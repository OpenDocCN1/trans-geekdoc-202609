    # Introduction


    Once a software developer asked me about the possibilities of Bitcoin. I explained
    it like this:


    Me: ‘Have you done work for clients as a freelancer?’

    Developer: ‘Yes.’


    Me: ‘Then you are familiar with the challenges that come with independent contract
    work; you have to make deals such as getting 50% payment upfront and 50% after
    completion of the project. Or you have to use an escrow service. You need contracts,
    and you and the client take on risk. Sometimes it gets messy, and you could have
    conflicts about payment.’


    He nods quickly; he knows how things go. I continue: ‘People are currently working
    on technology that works on top of Bitcoin and other cryptocurrencies that solves
    this, and many other things. For example, you could define a smart contract that
    pays according to your project’s timeline. Say that you and the client expect
    it to take two months to complete and that the price is fixed. The smart contract
    starts the money stream from the client to the contractor, minute by minute, until
    the end date. If someone is not happy at any point, either you or them clicks
    the button, and the stream of money stops. This guarantee is unstoppable and does
    not require an escrow agent.’


    The developer understands it, because he says: ‘I’m going to work on this as soon
    as I get home.’


    Such moments of entrepreneurial inspiration are typical for people who study the
    details of cryptocurrency. This book aims to help entrepreneurs make sense of
    the opportunities offered by cryptocurrencies and digital tokens.


    The launch of Bitcoin opened the field of finance for disruptive innovation: new
    products and services are possible, built by up-and-coming players such as startups
    and open source projects. In the age of crony-capitalism, which abuses its political
    power to earn money without risk, a handful of companies control finance. Other
    problems include fraud, quantitative easing, and too much debt. That is why innovation
    in the financial sector is an exciting trend.


    The invention of Bitcoin and decentralized finance means that you, yes you, can
    dive into the field of financial technology and stake a claim on the profits of
    banks. You can start solving problems that legacy players are ignoring. The big-sounding
    phrase “global financial sector” suggests that a scrappy entrepreneur like yourself
    should stay away from it. Any financial product, such as an insurance policy,
    mortgage, or investment, involves the creation and transfer of money, which are
    critical functions in the economy. That is why the “global financial sector” runs
    on top of banks. We can even be more specific: It is an oligopoly of institutions
    that controls money and investing (Andreas M. Antonopoulos, The internet of Money,
    2016).


    Economics 101 says that an oligopoly is a group of large companies within an industry
    who agree to keep prices high and competition at bay. Big banks work together
    to achieve a de facto monopoly on financial services. The cronies fear startup
    companies that compete with them on a level playing field. Your challenge as a
    crypto entrepreneur is to bypass and undercut these banks by giving their current
    customers a better financial product or service. You can win by inventing value
    propositions that outclass those offered by banks.


    This book is for doers and builders. I will focus on your opportunities as an
    entrepreneur. That is why we will skip cryptographic math, computer science, economic
    models, or game theory. Of course, these topics do matter: they are part of your
    arsenal as an entrepreneur, and it is to your advantage to learn as much about
    them as you can. But these topics have already been covered in other books, which
    I will mention in this book. Whenever I reference a book about cryptocurrency
    and related issues, it means that I recommend it with enthusiasm.


    The history of technology has shown how disruptions play out. Innovators build
    a scrappy application or platform that grows from obscurity, powered by a new
    perspective on an existing product. They get rapid feedback from their initial
    user base, taking advantage of their greater adaptability as a small organization
    until they boost the user experience beyond those of the legacy players. This
    process causes drama. Every technology that makes our life more efficient replaces
    companies that served that market less efficiently. For example, the invention
    of clay roof tiles put artisans of thatched roofs out of work, and the mainstream
    adoption of cars turned horse-drawn carts and carriages into quaint antiques.
    Likewise, Xerox machines and personal computers replaced armies of secretaries.
    We often see that technological progress gives a boost to the quality of life
    of the many at the cost of a forced career change for the few. Recent examples
    relevant for software entrepreneurs include brick-and-mortar retailers who lost
    their business to e-commerce platforms. It is easy to see how we all benefit from
    progress. If you have lived through any of the above examples, you know that feeling
    you get as a customer: “Wow! This is so much better! From now on, I want this
    new thing.”


    Cryptocurrencies and other crypto-assets can be like that. Entrepreneurs can use
    blockchains such as Bitcoin and Ethereum to disrupt banks, who are the legacy
    players of finance. Cryptocurrencies put the control over money back into the
    hands of the public. Economic progress depends on entrepreneurs applying technology
    to people’s problems, and most of us have plenty of financial challenges. Society,
    as a whole, has large-scale money problems that remain unsolved. A startup can
    tackle any one of these problems, which we will discuss one by one. By dividing
    and conquering, we can transcend the widespread economic and political challenges
    related to money and finance. Entrepreneurs have a heroic role to play; taking
    honorable risks to get rewarded for mastering these challenges. Cryptocurrencies
    are the tools to get it done.


    The inventors of Bitcoin and Ethereum designed them for smooth financial transactions.
    In contrast, banks have an outdated infrastructure with friction and hidden risk
    in most transactions. The entrepreneurs who drill into these challenges have an
    excellent chance to succeed with one venture or another. Their strategy is simple:
    1) look at financial functions that make customers vulnerable to a third party,
    that is, someone other than the sender and receiver of an asset, and 2) automate
    that function on a public blockchain, which acts as an immutable ledger of transactions.
    International transfers of a cryptocurrency are already superior to the services
    of any bank or other financial institution. You do not even need to have an account
    anywhere. Furthermore, software entrepreneurs and finance wizards can build services
    that use this money without having to partner with a bank.


    Chapters 4 and 5 explore some financial solutions that don’t rely on the legacy
    banking system. Chapter 6 gives examples of successful tokenized assets. As I
    write this in 2020, only a small portion of the global population wants cryptocurrency.
    However, when Bitcoin and Ethereum work as intended, traditional financial products
    will become obsolete. In the future, other blockchain-based systems could become
    relevant as well. Where a public blockchain can replace intermediaries, transactions
    get faster while costs fall. For now, the use cases are limited to international
    payments, some illegal trades, unstoppable donations, and protection from inflation.
    We are still figuring out how to apply this technology to other commercial uses.


    From the broad adoption of paper currency until the invention of Bitcoin, the
    business of creating currency belonged to banks. They profit from low interest
    rates on loans from the central bank, they create new money, and they get exclusive
    access to the best investment opportunities. In their comfortable status quo,
    banks capture most of the value of their captive customer base. However, since
    the launch of Bitcoin, the power of banks is up for liquidation. Nowadays, entrepreneurs
    can compete for customers by using blockchains such as Bitcoin and Ethereum. A
    superior class of value propositions is now possible. We can enter existing but
    closed markets and discover new ones, for example, serving people who do not have
    bank accounts, the so-called “unbanked,” or explore new business models for selling
    digital content. We can develop products that benefit from the shared efforts
    behind open-source software. The entrepreneurs and their customers take the power
    from banks by transacting on a new network that holds cryptographically secured
    assets. Entrepreneurs bring crypto-assets to the market to solve people’s financial
    problems. The energetic founders who see the future as open and decentralized
    have the right vision for this new technology: disruptive money. They understand
    the promise, and they are itching to build. This book is for them.


    Starting a company is an adventure because the blockchain industry resembles the
    Wild West. As you travel in the unknown terrain of Bitcoin and crypto-assets,
    you are going to want a decent map. Some can sell it to you. But who can you trust?
    You need some way of navigating this new space. You can get help from someone
    who has been out there already, who got his hands dirty and is familiar with the
    territory. This book is the “map” for an entrepreneurial venture that makes use
    of Bitcoin and Ethereum or any other blockchain flexible and secure enough for
    the service you plan to build.


    I based it on my hands-on experience working with blockchain entrepreneurs, developers,
    and consultants. As I was not founding an organization myself, I had time to observe
    and reflect, to make sense of the chaotic blockchain hype. I maintained perspective,
    and here I attempt to share my view with you in a way that I hope is useful to
    your entrepreneurial challenge. I worked for technology startups for over a decade
    as a consultant, copywriter, and project manager. I marketed high-tech value propositions.
    Since June 2017, I applied that skillset in startups that issued and traded crypto-assets.
    I have worked in teams that dealt with the challenges of designing a token economy
    and crafting a compelling value proposition for their users. I connected with
    entrepreneurs, developers, and marketers who showed me their projects. I have
    seen a lot of brilliance, but also a lot of window dressing and cheap talk. Throughout
    the blockchain hype of 2017, I was immune to the aggressive marketing campaigns
    because I studied the fundamentals of Bitcoin, and to a lesser extent, the workings
    of several other coins. I started following the industry in early 2013 and began
    building relationships with crypto developers and entrepreneurs since 2014, people
    who were working on the first wave of alternative coins. I got involved more seriously
    in 2016, inspired by the weekly Bitcoin meetup in Chiang Mai, Thailand. My priority
    was to make sure that I knew how Bitcoin worked in detail. Understanding the nuts
    and bolts of Bitcoin as well as its historical background protected me from being
    hypnotized by mirages or bamboozled by buzzwords.


    I want your venture to succeed because people like you will make a difference
    for the next decade of financial technology. The megatrend of decentralization,
    which gained speed with the internet, is moving into third gear with Bitcoin.
    I am excited that this ecosystem of exponential growth can take you and your venture
    to success.


    The best practices for blockchain ventures have their foundation in existing startup
    lore. We have the codified knowledge about starting a technology business with
    an idea and validating that idea by letting the market respond to your product.
    We have scripts for pivoting and scaling up. Now, we need to add an understanding
    of blockchains to that tradition and see how we open a new marketplace. Beyond
    a few certainties regarding Bitcoin and other blockchains, the future development
    of this technology is unknown. We will address that unknown by relying on rules
    of thumb, and we can walk through historical trends to find parallels.


    The book is organized like this:


    Chapter one, Disruptive Money, examines the role of money in the economy. To act
    as effective disruptors, entrepreneurs need to know their history. Various types
    of money have different origins, and people use them for different reasons. You
    can compare Bitcoin to traditional money, in terms of its features, advantages,
    and development.


    Chapter two, The Political Entrepreneur, shows how Bitcoin empowers a new kind
    of startup. Disruptive money systems, such as Bitcoin and Ethereum, define a territory
    of freedom, new virtual jurisdictions that protect the assets living on them with
    new security features. We can compare the relative security of blockchains and
    their resistance to the authority of governments.


    In chapter three, Liquidity and Adoption, we see that people adopt crypto-assets
    that fulfill a need. Crypto-assets with a commercial function catalyze a network
    effect. Rising liquidity makes the asset more stable, which draws new users, making
    the asset more liquid. A crypto startup has to place itself in that feedback loop.


    In Chapter four, Ideal Money, we see how a layer of secondary protocols can make
    money as efficient as information. The currency will free itself from the specific
    media that now dictate how it can move. Transacting with minimal friction and
    smart contracts could unlock new types of business.


    Chapter five, Wallet Design, is about removing any friction when handling money.
    The mainstream will only adopt crypto-assets that are easy to use; such a design
    is a creative challenge. Various hardware and software approaches make tradeoffs
    between convenience and security.


    Chapter six, Tokenized Assets, asks: Besides money, what else can we put on a
    blockchain? Bitcoin sets a standard for freedom and security to which other blockchains
    can aspire. Teams that aim to expand the possible use cases make designs for a
    new economy. These tokenized assets promise a future of trade and prosperity for
    the mainstream, provided that designers solve incentives, power, and governance.


    I assume that you sense the opportunities afforded by the proven success of well-known
    blockchains such as Bitcoin and Ethereum and that you are adventurous. You can
    handle a period without the certainties of proven customs and established laws.
    You are an explorer with the guts to stake out a territory of freedom. If this
    describes you, welcome to the Wild West. Here is your map. Enjoy the journey.

    '
  trans: '


    # 简介


    曾有一位软件开发者向我询问比特币的可能性。我这样向他解释：


    我：‘你作为自由职业者为客户做过工作吗？’

    开发者：‘做过。’


    我：‘那么你就熟悉独立合同工作带来的挑战；你需要达成协议，比如预付 50% 款项，项目完成后再付 50%。或者你需要使用托管服务。你需要合同，你和客户都要承担风险。有时会变得一团糟，你可能会就付款产生冲突。’


    他迅速点头；他知道事情是怎么运作的。我继续说：‘人们目前正在开发运行在比特币和其他加密货币之上的技术，可以解决这个问题以及许多其他问题。例如，你可以定义一个智能合约，根据项目的时间表进行付款。假设你和客户预计完成项目需要两个月，且价格固定。智能合约会从客户向承包商启动资金流，每分钟一次，直到结束日期。如果任何一方在任何时间点不满意，你或对方点击按钮，资金流就会停止。这种保证是不可阻挡的，不需要托管代理。’


    开发者理解了，因为他说：‘我一到家就着手做这件事。’


    这种创业灵感的时刻对于研究加密货币细节的人来说很典型。本书旨在帮助企业家理解加密货币和数字代币提供的机会。


    比特币的推出为金融领域的颠覆性创新打开了大门：新产品和服务成为可能，由初创公司和开源项目等新兴参与者构建。在裙带资本主义时代，它滥用政治权力来无风险赚钱，少数几家公司控制着金融。其他问题包括欺诈、量化宽松和过度债务。这就是为什么金融领域的创新是一个令人兴奋的趋势。


    比特币和去中心化金融的发明意味着，你，是的，你，可以进入金融科技领域，在银行的利润中分得一杯羹。你可以开始解决传统参与者忽视的问题。“全球金融部门”这个听起来很大的词组暗示，像你这样的草根企业家应该远离它。任何金融产品，如保险单、抵押贷款或投资，都涉及货币的创建和转移，这些是经济中的关键功能。这就是为什么“全球金融部门”运行在银行之上的原因。我们可以更具体地说：它是一个控制货币和投资的寡头垄断机构（Andreas
    M. Antonopoulos, 《货币的互联网》, 2016）。


    经济学 101 说，寡头垄断是行业内一群大公司，他们同意保持高价并抑制竞争。大银行合作以在金融服务上实现事实上的垄断。裙带关系者害怕与他们在公平竞争环境中竞争的初创公司。作为加密货币企业家，你的挑战是绕过并削弱这些银行，通过为他们的现有客户提供更好的金融产品或服务。你可以通过发明优于银行提供的价值主张来获胜。


    本书面向行动者和建设者。我将关注你作为企业家的机会。这就是为什么我们将跳过密码学数学、计算机科学、经济模型或博弈论。当然，这些主题很重要：它们是你作为企业家的武器库的一部分，尽可能多地了解它们对你有利。但这些主题已经在其他书中涵盖，我会在这本书中提到它们。每当我引用关于加密货币及相关问题的书时，意味着我热情地推荐它。


    技术的历史展示了颠覆是如何发生的。创新者构建一个从默默无闻中成长起来的草根应用程序或平台，由对现有产品的新视角驱动。他们从最初的用户群获得快速反馈，利用小型组织更大的适应性，直到他们将用户体验提升到超越传统参与者的水平。这个过程会引起戏剧性变化。每一种使我们的生活更高效的技术都会取代那些服务效率较低的公司。例如，黏土屋顶瓦的发明让茅草屋顶工匠失业，汽车的普及将马车和马车变成了古董。同样，复印机和个人电脑取代了大量秘书。我们经常看到，技术进步以少数人被迫转变职业为代价，提高了大多数人的生活质量。与软件企业家相关的最近实例包括实体零售商因电子商务平台而失去业务。很容易看出我们都从进步中受益。如果你经历过上述任何例子，你就知道作为客户的那种感觉：“哇！这好得多！从现在起，我要这个新东西。”


    加密货币和其他加密资产可以是这样。企业家可以使用比特币和以太坊等区块链来颠覆银行，银行是金融领域的传统参与者。加密货币将对货币的控制权重新交到公众手中。经济进步取决于企业家将技术应用于人们的问题，而我们大多数人有很多财务挑战。社会整体上有大规模的货币问题尚未解决。初创公司可以解决其中任何一个问题，我们将逐一讨论。通过分而治之，我们可以超越与货币和金融相关的广泛经济和政治挑战。企业家有英雄般的角色要扮演；承担可敬的风险，以掌握这些挑战而获得回报。加密货币是完成这项工作的工具。


    比特币和以太坊的发明者设计它们是为了实现顺畅的金融交易。相比之下，银行拥有过时的基础设施，大多数交易都存在摩擦和隐藏风险。深入研究这些挑战的企业家有很好的机会通过某个项目取得成功。他们的策略很简单：1）查看使客户易受第三方（即资产发送者和接收者以外的某人）影响的金融功能，以及
    2）在公共区块链上自动化该功能，公共区块链充当交易的不可更改账本。加密货币的国际转账已经优于任何银行或其他金融机构的服务。你甚至不需要在任何地方开设账户。此外，软件企业家和金融专家可以构建使用这种货币的服务，而无需与银行合作。


    第 4 章和第 5 章探讨了一些不依赖传统银行系统的金融解决方案。第 6 章给出了成功代币化资产的示例。在我 2020 年撰写本文时，只有全球人口的一小部分想要加密货币。然而，当比特币和以太坊按预期工作时，传统金融产品将变得过时。在未来，其他基于区块链的系统也可能变得相关。在公共区块链可以取代中介的地方，交易会更快，成本会降低。目前，用例仅限于国际支付、一些非法贸易、不可阻挡的捐款和防止通货膨胀。我们仍在弄清楚如何将这项技术应用于其他商业用途。


    从纸币的广泛采用直到比特币的发明，创造货币的业务属于银行。他们从中央银行的低利率贷款中获利，他们创造新货币，并且他们独家获得最佳投资机会。在舒适的现状中，银行从其被俘获的客户群中捕获了大部分价值。然而，自比特币推出以来，银行的权力正面临清算。如今，企业家可以通过使用比特币和以太坊等区块链来争夺客户。现在有可能实现更优越的价值主张类别。我们可以进入现有但封闭的市场并发现新的市场，例如，为没有银行账户的人（所谓的“无银行账户人群”）服务，或探索销售数字内容的新商业模式。我们可以开发受益于开源软件共享努力的产品。企业家及其客户通过在持有加密保护资产的新网络上进行交易，从银行手中夺取权力。企业家将加密资产带到市场上以解决人们的财务问题。那些将未来视为开放和去中心化的充满活力的创始人对这项新技术有着正确的愿景：颠覆性货币。他们理解其承诺，并且迫不及待地想要构建。本书是为他们而写的。


    创办一家公司是一次冒险，因为区块链行业类似于西部荒野。当你在比特币和加密资产的未知领域旅行时，你会想要一张像样的地图。有人可以卖给你。但你能信任谁？你需要一种在这个新空间中导航的方法。你可以从已经去过那里、弄脏了手并且熟悉该领域的人那里获得帮助。本书是“地图”，适用于利用比特币和以太坊或任何其他足够灵活和安全的区块链来构建你计划的服务的创业项目。


    我基于自己与区块链企业家、开发者和顾问合作的亲身经历撰写了本书。由于我自己没有创办组织，我有时间观察和反思，以理解混乱的区块链炒作。我保持了视角，并在此尝试以希望对你的创业挑战有用的方式与你分享我的观点。我作为顾问、文案撰写人和项目经理，在科技初创公司工作了十多年。我推广高科技价值主张。自
    2017 年 6 月以来，我在发行和交易加密资产的初创公司中应用了这些技能。我曾与处理设计代币经济学并为其用户打造引人注目的价值主张挑战的团队合作。我与企业家、开发者和营销人员建立了联系，他们向我展示了他们的项目。我见过很多才华，但也见过很多包装和空话。在
    2017 年的整个区块链炒作期间，我对激进的营销活动免疫，因为我研究了比特币的基础知识，以及在较小程度上，其他几种代币的运作方式。我从 2013 年初开始关注该行业，并自
    2014 年起开始与加密开发者和企业家建立关系，这些人正在开展第一波替代币项目。我受到泰国清迈每周比特币聚会的启发，于 2016 年更认真地参与其中。我的首要任务是确保我详细了解比特币的工作原理。理解比特币的核心机制及其历史背景保护我免受海市蜃楼的催眠或被流行语所迷惑。


    我希望你的项目能够成功，因为像你这样的人将在未来十年对金融科技产生影响。随着互联网的发展而加速的去中心化大趋势，正随着比特币进入第三档。我对这个指数级增长的生态系统能带领你和你的项目走向成功感到兴奋。


    区块链项目的最佳实践建立在现有的初创公司经验之上。我们拥有关于用一个想法创办科技企业，并通过让市场对你的产品做出反应来验证该想法的编码化知识。我们有关于转型和扩张的脚本。现在，我们需要将对区块链的理解添加到这一传统中，看看我们如何开辟一个新市场。除了关于比特币和其他区块链的几个确定性之外，这项技术的未来发展是未知的。我们将通过依赖经验法则，并回顾历史趋势来寻找类似之处，来应对这个未知。


    本书的组织如下：


    第一章，颠覆性货币，探讨货币在经济中的作用。要成为有效的颠覆者，企业家需要了解历史。各种类型的货币有不同的起源，人们出于不同的原因使用它们。你可以从功能、优势和发展等方面将比特币与传统货币进行比较。


    第二章，政治企业家，展示了比特币如何赋予一种新型初创公司权力。颠覆性货币系统，如比特币和以太坊，定义了一个自由领域，即新的虚拟管辖区，它们以新的安全功能保护其上的资产。我们可以比较区块链的相对安全性及其对政府权威的抵抗力。


    在第三章，流动性和采用中，我们看到人们采用满足需求的加密资产。具有商业功能的加密资产催化网络效应。不断上升的流动性使资产更加稳定，从而吸引新用户，使资产更具流动性。加密初创公司必须将自己置于这个反馈回路中。


    在第四章，理想货币中，我们看到二级协议层如何使货币像信息一样高效。货币将摆脱当前决定其如何流动的特定媒介。以最小摩擦和智能合约进行交易可能会解锁新的业务类型。


    第五章，钱包设计，是关于在处理货币时消除任何摩擦。主流只会采用易于使用的加密资产；这样的设计是一个创造性挑战。各种硬件和软件方法在便利性和安全性之间进行权衡。


    第六章，代币化资产，提出了一个问题：除了货币，我们还能在区块链上放置什么？比特币为自由和安全设定了标准，其他区块链可以向其学习。旨在扩展可能用例的团队为新经济进行设计。这些代币化资产承诺为主流带来贸易和繁荣的未来，前提是设计者解决激励、权力和治理问题。


    我假设你感受到了比特币和以太坊等知名区块链的成功所带来的机会，并且你富有冒险精神。你可以应对一个没有既定习俗和成熟法律确定性的时期。你是一个有胆量开辟自由领域的探险家。如果这描述的是你，欢迎来到西部荒野。这是你的地图。祝旅途愉快。


    '
