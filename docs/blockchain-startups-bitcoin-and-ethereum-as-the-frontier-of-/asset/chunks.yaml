    # 结论


    在本书的引言中，我指出了全球金融中那些疲惫不堪的做法，它们现在正准备由利用比特币、以太坊和其他区块链的企业家进行转型，甚至革命。我声称创新是掠夺性的，并邀请你踏上一段冒险之旅。我承诺本书将作为你的地图，帮助你在这个前沿领域穿越困惑。在本书的结尾，我希望你已经对行业有所了解，并获得启发去启动你的项目。任何使人依赖第三方的金融功能，都是去中心化区块链上自动化的候选者。第三方的存在创造了对不可更改的交易账本的需求。大多数章节都包含基于加密货币和代币化资产创办公司的想法。你现在知道如何通过将比特币和区块链应用于创建更好的金融产品来攻击旧系统。企业家对货币和贸易的过去与现在越了解，就越能设想并构建其未来。自由的领地是一个不断发展的生态系统，其中首先生存并繁荣的公司类型是投机者、交易者和做市商。在第
    3 章中，我强调了流动性和网络效应的催化剂。这种投机和交易的既定层作为基础，随着下一层的成熟，包括支付系统、智能合约和钱包。然后我们探索了这些较年轻的公司类型，它们在流行区块链的虚拟管辖区中繁荣发展。闪电网络让“老式比特币”更易于花费，而
    DeFi 是一个与传统金融竞争的实验室。如果 ETH2.0 兑现其承诺，我们可以期待大规模的高效去中心化应用，供主流用户使用。这些章节中是否有任何一章给你带来项目的想法？我期待听到你的计划。在未来几年里，我们可能会了解基于比特币的金融系统是什么样子。2020
    年底，全球经济因新冠疫情而低迷，越来越多的人看穿了法定货币的魔术。政治和商业精英在世界经济论坛上讨论经济和金融系统的“大重启”。与此同时，越来越多的知名投资者和高管已成为比特币爱好者，并在公开场合肯定其价值。这些里程碑汇聚在一起，为另一轮牛市奠定了绝佳基础。当比特币和其他加密资产的价格飙升时，正是为你的加密创业寻求投资者和客户的好时机。只要比特币网络尚未处理大量小额交易，BTC
    就仍然是一种类似于黄金的商品：个人和机构可以使用它来存储和转移大笔资金。如果——当——比特币通过侧链和闪电网络实现扩容时，它将完全复兴“硬”商品货币，并附带无摩擦和私密交易的额外好处。开发者和企业家将继续发明新的金融资产和操作，构建安全、便捷且免受中央控制的货币未来。我希望你能加入我，成为未来的一部分。


    # 关于作者


    Stefan King 自 2013 年起研究比特币，并于 2016 年成为积极的布道者。他在软件营销方面有着良好的记录，并致力于研究加密资产发布的复杂性。作为清迈每周比特币聚会的主持人，他向初学者解释比特币，并为在比特币和以太坊上构建的企业家提供建议。你可以在
    [www.stefantking.com](http://www.stefantking.com/) 和 [twitter.com/stefantking](http://twitter.com/stefantking)
    找到他。


    '
