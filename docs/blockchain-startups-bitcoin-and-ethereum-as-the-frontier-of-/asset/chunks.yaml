    # CHAPTER 1 颠覆性货币


    比特币所代表的金融创新仍处于早期阶段。在 2020 年撰写本文时，比特币大多是一个面向专业开发者和投机者的利基产品。只有世界人口的一小部分拥有加密资产，而更少的人了解如何持有和管理这些资产。价格随炒作周期波动，由对未来的希望和过山车般的新闻驱动，这使其成为先驱的环境。挑战在于应对混乱。那些穿透迷雾、看清局面的人，有机会作为创新者抓住机遇。当初创公司的团队使用比特币或以太坊等成熟区块链的工具构建产品或服务时，他们就有机会进行创新。这些网络的好处在于其稳固的历史，这使您的公司能够提供可靠且不可审查的数字资产转移，在提供新金融产品或服务时成为您的竞争优势。针对挑战性场景的更智能交易是货币和金融的未来，因为这是软件颠覆的最新行业。软件创新长期未能渗透到货币领域，因为发明数字稀缺性的智力挑战难以克服。我们可以通过创造普通纸币稀缺性所需的政治权力来衡量这一成就的规模：只有像国家这样庞大的实体才有能力保持国家货币的安全。此外，加密货币的技术工作仍在进行中。目前，功能性的国家货币几乎无需证明什么，因为该货币的机构是支付和投资的标准。我们需要在比特币的洞察基础上构建，让互联网支持货币和金融。比特币和以太坊是私人货币的第一层，是对银行的首次挑战。我们必须将这些洞察应用于不断增长的价值主张集合。区块链产品和服务并不自动优于银行的产品和服务。它们仅具有成为如此的潜力。创新之战才刚刚开始。


    我们将使用来自公共来源的定义。根据比特币维基：比特币是一种去中心化的数字货币，可实现向世界任何地方任何人即时付款。比特币使用点对点技术运行，无需中央机构：交易管理和货币发行由网络共同执行。（…）基于货币是任何物体或任何类型的记录，在特定国家或社会经济环境中被接受为商品和服务付款及债务偿还的概念，比特币的设计围绕使用密码学来控制货币的创建和转移，而不是依赖中央机构。比特币具有货币类商品的所有理想属性。它们便携、耐用、可分割、可识别、可替换、稀缺且难以伪造。


    根据以太坊官网：以太坊是一个全球、开源的去中心化应用平台。在以太坊上，你可以编写控制数字价值的代码，该代码严格按照编程方式运行，并且在世界任何地方都可访问。


    根据比特币维基：区块链是一个经过密码学保护、带时间戳的公共分布式数据库，记录了网络上发生过的每一笔（…）交易。这里的“分布式”意味着区块链中的信息被广播到网络中的每个节点并由其记录。没有一个中央数据库。比特币和以太坊基于去中心化价值转移的类似原理运行，但对其网络做出了不同的选择。比特币渴望成为安全可靠的替代金融系统，而以太坊有更广泛的使命：去中心化软件应用，其区块链上的资产风险更高。安全性和灵活性是根本的权衡，每个区块链都在两者之间选择平衡，无论是有意识的还是无意识的。


    在金融领域，比特币，以及在某种程度上以太坊，解决了对交易的集中控制问题。比特币和以太坊使用户摆脱任何控制或监管的第三方，从而赋予用户权力。如果加密货币是一种新的资产类别，那么它们实现的交易也属于新的类别：无需第三方的数字转移和价值持有。用户需要一种新型公司，使这些交易快速、安全且便捷。


    在引言中，我将加密创业的本质描述为取代一种金融产品或服务，该产品或服务使客户面临第三方的风险：除了交易双方之外，控制资产的人、公司或机构。为什么第三方是个问题？为了了解第三方的原始原因，我们必须简要回顾金融历史。我们将查看金融交易中每个参与者的经济功能，以了解成熟区块链所提供的可能性。


    ## 稀缺之物作为货币


    在工业革命之前的农业社会中，货币是黄金、白银和铜币。在社会层面，货币是一种记分方式。或者说：货币是一种记录谁欠谁什么、以及转移价值的方式。这是银行家完成的工作之一：转移付款。银行的基本功能之一是在保持安全的同时，将资金从一个地方转移到另一个地方。银行家通过运输黄金和白银来结算城市和国家之间的贸易余额，其数量等于交易商品价值的差额。为此，他们发明了支票，也称为汇票。想想
    16 世纪或 17 世纪欧洲国家相互连接并与其他大陆连接的时代。香料等商品从阿姆斯特丹流向布鲁塞尔，并由从布鲁塞尔流向阿姆斯特丹的等值白银支付。同时，葡萄酒等商品从布鲁塞尔逆向流向阿姆斯特丹，白银则从阿姆斯特丹流向布鲁塞尔以支付这些葡萄酒。白银需要携带，这有成本和风险。这意味着运输货币是昂贵的；毕竟，它是一种珍贵的实物商品，且面临抢劫风险。银行家通过向客户发行支票，使大多数这些实物运输变得不必要，客户可以在另一座城市的相应银行兑现这些支票。因此，人们不再需要向两个方向运输白银，而是可以携带支票自行转移资金。银行家发行并接受两个城市人们的支票，阿姆斯特丹和布鲁塞尔之间交易价值的差额——贸易逆差——可以通过运输白银来结算。货币运输的成本取决于距离和风险（坎蒂永，《经济学论文》，1755
    年）。这些支票或汇票使人与人之间的付款更加高效。需要注意的是，这些货币传输者之所以存在，是因为运输实物商品是昂贵的。银行家有工作将资金从一个地方转移到另一个地方，因为货币是一种实物，而风险是一种物理威胁。


    在当今，转移资金几乎是对数字银行账簿的自动更新。成本不再关乎被抢劫的物理风险或携带一袋现金在路上花费的时间。相反，现代银行转账之所以昂贵，是因为它们必须赢得并维持客户的信任。我们必须信任银行来维护账簿。除了买方和卖方，银行也是交易的第三方。如果我们查看货币历史，交易中存在第三方的必要性和弊端都很明显。然而，加密货币通过使货币转移第三方过时来解决这些弊端。


    ## 可信数字作为货币


    想象一下，如果一个城市的所有人都能用魔法手势将资金传输给供应商。在这样一个神奇的世界里，传输资金的工作不复存在。我们能想象到的最神奇的货币是零摩擦地在所有者之间移动的货币。现代电子货币创造了那个神奇的世界吗？它几乎做到了。通过
    PayPal、Transferwise 或 SWIFT 进行的付款感觉接近于价值的神奇传输。然而，我们仍然需要与银行建立业务关系。他们持有您的数字货币存款。您必须信任他们执行从您的神奇付款开始的转账。如果他们未能做到或对您的付款有疑问，您的业务就会停滞。问问旅行者或经营在线国际公司的人，这些货币传输者让他们感觉如何。其中许多人是不满意的客户。此外，银行转移的是什么东西？这种货币是由法令创造的，法令意为“法规”，即任意的命令、授权或批准。法定货币由单一主权国家当局创造，因为它们可以。它有价值是因为它们这么说。您必须用这种货币缴税，而且人们通常有法律义务将其作为付款接受。当局通过法律强制执行法定货币的稀缺性，并逮捕伪造者。与商品货币相比，理解法定货币的起源需要一些研究。工业革命前的商人对他们接受作为付款的黄金和白银有着直观的理解。贵金属是一种有着悠久历史的商品。人们对其用途达成一致。他们可以信任自己的可用选项将其交换为其他东西。在当天、第二天，或者几十年后，退休时。相比之下，现代商人银行账户中的数字不像贵金属那样表现。这些数字每年通过通货膨胀损失一点购买力。一种货币相对于其他货币的价格是不可预测的，除此之外，各国之间商品价格的差异已经是可变的。现代商人和消费者也理解他们的法定货币；他们中的大多数人避免在账户中保留大量资金。他们将一部分法定货币投资于其他将保值的资产，其余部分用于消费。无论我们考虑使用法定货币进行付款的现代商人，还是使用贵金属的工业革命前商人，我们都可以确定，他们都根据理性自身利益管理资金。由于法定货币与贵金属非常不同，其所有者自然表现得不同。


    在工业革命前的经济中，银行家、商人和政治家除了金属货币之外还有其他金融工具。如上所述，他们确实使用支票来结算贸易，以及信用证、股票和银行券。他们在必要或方便时使用这些工具代替货币。然而，他们从未将这些金融工具与货币本身混淆，货币严格来说是金属。我们可以假设大多数人理解为什么贵金属有价值。他们对黄金、白银和铜币之间的汇率有着准确而直观的认识。他们的货币景观比我们简单得多。工业革命前的货币始终是一种实物，严格按照物理的限制表现，他们从未将其与代表商品的汇票混淆。


    ## 货币的物理性与起源


    我们知道，历史上一系列商品曾充当货币，包括海螺、宝石、珠子、金币和银币（尼克·萨博，《贝壳支出：货币的起源》，2002 年）。如今，我们有纸质和电子形式的法定货币。我们可以从至少两个方面比较这些类型的货币：其起源地及其物理性。过去充当货币的商品是环境的自然组成部分。例如，宝石和金属来自地下，人们必须从海中收集海螺。获取这些商品需要劳动。然而，从事这项工作的能力分布在社会和各个地点。相比之下，现代法定货币属于国家和银行。中央银行创造货币以支付其购买的资产，这些资产通常是政府债券，即政府欠下的债务。然后商业银行可以再次贷出这些创造的货币。创造这种货币不需要劳动。唯一的要求是：


    - 主权，即在特定地理区域内强制使用法定货币的能力。

    - 对银行的严格监管，银行记录人们的余额。


    与法定货币相反，商品货币是由多个企业家的辛勤工作创造的。创造法定货币的权力是集中的，而创造商品的能力是分散的。商品的稀缺性是自然且强健的。法定货币的稀缺性是人为的且脆弱的。自银行业发明以来，货币变得不那么实物化；它从一种有价值的商品变成了交易记录。现在大部分货币供应量仅仅是记录谁欠谁什么。通过寻找更好的传输、储蓄和投资资金的方式，银行家创造了更易于处理的货币类型。本质上，你可以使用信用证和汇票发送资金，并可以通过准备金银行制度创造更多资金，在这种制度下，只有银行存款的一小部分由实际现金支持并可供提取（Investopedia）。


    货币的物理性和起源特征使我们能够区分以下几种货币：


    - 由企业家开采和收集的实物商品货币；

    - 由私人银行或政府发行、由其持有的存货支持的纸币；

    - 由主权政府中央银行发行的纸质法定货币；

    - 由地方或地区合作社发行的纸质法定货币；

    - 由主权政府中央银行发行、由受监管银行贷给公司和个人的数字法定货币；

    - 由私人创业实体或团体发行的数字货币。


    尽管尝试过这种货币的例子失败了，例如 E-gold，但私人数字货币随着加密货币的发明而成功，比特币是其第一个实例。我们可以通过查看两个最近接近数字分布式货币理念但未能实现全球分布的货币例子来欣赏加密货币的力量。地方法定货币是分布式货币的一个例子，E-gold
    是私人数字货币。两者都未能通过抗审查测试，这揭示了加密货币的独特品质。


    地方法定货币由地方当局印刷，以刺激城镇或更广泛地区的经济。地方政府与小企业会面以印刷该地方法定货币。例子包括布里克斯顿英镑、伯克夏股份、盐泉岛元、Bangla-Pesa、Ora、Kalentalese
    第纳尔、加勒比元、Fausto 等。人们可以同意以与国家货币相同的价值接受这种货币作为付款。小规模和信任使他们能够充当中央银行来印刷货币并促进当地商业。国家政府将这些小规模项目视为大多无害并允许其存在。然而，作为公司发行私人货币，例如
    E-gold 的情况，往往会被国家政府禁止。E-gold 是私人、数字、商品支持的货币。这种货币触及了主权国家货币。它还促成了洗钱和非法交易，这成为关闭 E-gold
    的完美借口。


    法定货币需要最高政治权威，即主权力量，来强制执行国家货币的接受和稀缺性。在 20 世纪和 21 世纪，在加密货币存在之前，你必须信任银行。你没有选择。这就是为什么银行家遵守严格的法规，他们的办公室装饰华丽，他们穿着西装。法定货币依赖于主权的政治权力以及公众对银行的信任。主权国家和银行对于法定货币的运作既是必要的也是充分的。银行对金融市场和交易的控制感到自在，受到法规的保护，这些法规构成了进入壁垒。真正的资本主义基于健康的竞争，但凭借垄断地位，自由市场就不再运作。商业变得政治化。罗伯特·赖希的纪录片《拯救资本主义》描述了美国部分情况。在欧洲，类似的声音指向他们自己破碎的系统。日本几十年来一直面临货币问题。自
    2008 年的大金融危机以来，公众一直觉得有什么不对劲，但研究人员、艺术家和制作者需要时间才能将这些失败之处让普通人理解。


    比特币超越了物理性、政府控制和货币起源的局限。它具有稀缺商品的属性，需要劳动才能产生，并且像银行账簿一样是数字的。然而，它既不需要主权者宣布它为货币，也不需要可信机构来转移它。这种新型货币使我们尚未能想象的经济交易成为可能。我们所知道的是，从现在起，我们的交易不再需要那个第三方。


    ## 稀缺数字作为货币


    地方法定货币、国家法定货币和私人数字商品货币都以显示加密货币独特优势的方式失败了：稀缺数字代币，由多个创业实体通过优雅的制衡系统发行和分发。人们可以在全球范围内使用加密货币。它是一种商品，由私人公司和个人在全球范围内交易。加密货币的特性是使实物商品需求旺盛的东西的数字版本。自比特币网络启动以来，你对银行家的信任不再是交易的必要成分。人们可以选择。只要比特币和其他加密货币变得更具流动性，我们就有了银行的替代方案。你可以信任银行家和整个受监管的系统，或者你可以信任不可更改的区块链。你可以选择接受或使用法定货币或加密货币付款。加密货币是银行系统无法处理的那些付款和金融工具的候选者。我们将在后面的章节中介绍这些案例。目前，请考虑银行几乎没有创新的理由。他们的方法是一种更容易、更安全的获利方式，而无需承担风险或辛勤工作。


    货币的特性表明，它需要对其价值在特定时间范围内的稳定性的信任。法定货币在短期和中期往往稳定，而黄金和白银在长期稳定。无论人们使用什么作为货币，它必须对某事有用且稀缺。只有当某物也有价值时，它才能以有意义的方式稀有。一种商品只有在首先因另一个原因而被需要后，才能承担货币的角色。在比特币的例子中，它作为数字收藏品和经济荣誉徽章而有价值。拥有比特币意味着你能想象出比法定货币和商品货币都更好的货币的可能性。


    ## 不可阻挡的货币


    私人货币只有在国家无法阻止其发行和交易时才能成功。它需要一种使其不可阻挡的品质。我们已经知道政府想要防止私人货币交易：这对公共资助的商业模式构成挑战。国家创造法定货币是有原因的：这使他们对人口拥有更多权力和金融控制。历史上，这种控制的需求是为了在战争中保卫国家（詹姆斯·戴尔·戴维森和威廉·里斯-莫格，《主权个人》，1999
    年）。在最近的时代，许多国家已经变成了臃肿的等级制度，服务于一群官僚及其依赖者。广泛流通的私人货币将挑战国家的利益，因此它只有在无法阻止其被用作付款时才能成功。


    比特币的独特之处在于它使用密码学创建数字稀缺资产，如果你选择，只有你通过不可更改账簿上的私钥控制它。比特币的不可更改性是一种新品质。它的优势在于不再需要信任可识别的权威，例如银行。比特币是不可阻挡且不可更改的，因为它是去中心化的。其不可更改性取决于用于分布式共识的工作量证明算法。比特币是一个在许多不同物理位置的许多物理计算机（“机器”）上运行的网络。所有机器都在使用相同的账簿，包含相同的交易块。它们都遵循相同的共识规则，这些规则自动化了比特币的发行和稀缺性。因为比特币在如此多的地方运行，所以没有任何单一的“地方”任何人可以去阻止它。只要系统按设计运行，它就是不可阻挡、不可更改且不可审查的。这是一种激进的颠覆。不可更改性取决于去中心化，而去中心化又取决于共识算法，在比特币的例子中，共识算法取决于工作量证明。


    我们知道私人货币必须是去中心化的，因为人们发行私人货币有着悠久的历史。起初，这是由私人银行在自由银行时代完成的，直到政府法定货币的引入。在当今，一些城镇发行地方货币。第一个使用密码学的数字货币是
    DigiCash，流通中的第一个私人数字货币是 E-gold。如上所述，美国政府关闭了 E-gold。禁止和阻止私人数字货币的倾向是 2009 年中本聪（比特币的化名发明者）专注于去中心化私人货币的方式的原因。新的数字货币必须有多个节点，能够在不需要信任任何单个节点的情况下进行协调。这就是为什么他必须解决达成共识的问题。他之所以能发明比特币，是因为他找到了解决“拜占庭将军问题”的实际解决方案，该问题涉及确保与不可信任的参与者达成可信共识的问题。这是他承担并实现的大胆目标。该解决方案使得代币既是数字的又是稀缺的。他的比特币解决方案和软件起初没有引起太多关注，因为当时几乎没人关心非法定货币。即使他在密码学和编程领域的大多数同行也没有太多关注。可以用叔本华的话来改述：中本聪击中了一个很少人甚至能看到的货币目标。解决拜占庭将军问题是一项多学科成就。这就是为什么在理解比特币时很容易偏离轨道。对比特币的随意调查会忽略其以这种方式运作的原因。


    ## 货币的政治


    对货币传输有历史感，并知道比特币是不可阻挡的货币后，我们可以欣赏货币的政治因素。这个新角度带来了新的创业机会。比特币的关键品质是：


    1. 稀缺性：难以创建；

    2. 用户友好性：易于持有、发送和接收；

    3. 供应可预测性：无人能超出发行计划进行通胀；

    4. 自由：你可以无需许可使用它；

    5. 抗没收和抗审查：难以被扣押。


    加密货币必须是私人货币，因为政府不太可能从发行去中心化加密货币中获益。他们已经可以发行数字法定货币。使用带有共识算法的区块链没有意义，因为数字法定货币已经按照其目的运作。政府只能在采用的后期阶段，如果顶级加密货币成为中央银行资产负债表的可行资产时，才能间接从去中心化货币中获益。第一个将投资组合扩展到加密货币的中央银行将拥有先发优势。如果其他中央银行也购买，价格将进一步上升到新的更稳定的水平，为先行者保障利润。


    加密货币和加密资产是新金融体系的基础。企业家可以在货币体系之上建立公司，而无需与银行家交谈。请注意，我们仍处于早期阶段。这些新型金融服务只能随着加密货币的流动性而增长。你的客户必须将加密资产视为生活的一部分，以便使用它们没有摩擦。大多数人不使用让他们沮丧的产品和服务。没有技术能进入主流，直到它保证几乎任何人都能轻松使用。在加密货币普及的世界里，你的公司可以为客户提供更快、更轻松的服务。这个新金融体系与法定货币竞争。政府只有在蚕食自己的法定货币体系时才能获益。在撰写本文时，有十几家中央银行计划推出国家货币的“区块链版本”。在我遇到的许多加密货币爱好者的意见中，这个计划行不通。法定货币已经是数字的；不需要区块链、任何分布式账簿或共识算法。这些技术只能帮助缺乏拥有中央银行的国家权威的货币。


    上述比特币主张与现状相悖；政治和经济精英在管理货币供应方面辜负了公众。根据加密货币爱好者的说法，他们背叛了我们的信任。信任政府就像信任父母——他们可能值得，也可能不值得。就像心理学家对养育有不同的模型和理论一样，政治家对组织社会和权威权力也有不同的看法。一个足够好的政府和法律体系将拥有权威，但只有在“被统治者的同意”下，根据《世界人权宣言》。比特币，第一个加密货币，是一个充满政治色彩的项目，因为比特币的创建者和大多数创新者拒绝任何政府对货币创造的权威。尽管不同类型的活动家在政治观点上有所不同，但推动比特币增长的人坚持认为，政府在处理货币供应方面有着糟糕的记录。所有政治权威都在货币政策领域未能或将无法通过“足够好政府”的测试。金融史充斥着资本管制、资产没收、货币贬值、恶性通货膨胀和主权违约的实例（J.T.
    Reed，《如何保护你的终身储蓄免受恶性通货膨胀和经济大萧条的影响》，2010 年）。这就是为什么无政府主义者和大多数自由意志主义者认为，政府的大部分或全部部分都不值得你的信任和支持。他们声称，政府为你做的任何事情都以你的代价，或以他人的更大代价为代价。相比之下，自由派、民主党人、共和党人和保守派认为，政府在当下和未来都有其位置，他们的官员将很好地行使主权。这包括现有的货币体系。政治家喜欢法定货币。更具体地说，他们喜欢以低成本创造更多货币的能力；他们喜欢承担公共债务和中央计划利率。围绕法定货币的官方叙述将货币现状描述为必要且恰当的。主流政治行动部分依赖于法定货币，但官方故事隐藏了这一关键事实。现代主权是印钞能力的条件。虽然法定货币需要国家的强制力，但去中心化加密货币可以在作为货币商品竞争的同时抵制这种强制。主流与比特币创建者之间的这种政治意见分歧将塑造加密货币的采用路径，因为它释放了货币商品的公开竞争。加密资产的流动性削弱了政府的货币支柱。


    在比特币成为货币商品之前，无政府主义者和自由意志主义者只有辩论和修辞作为说服工具。比特币出现后，不再需要辩论；他们可以通过持有加密资产来付诸行动。他们可以退出货币现状。少数派与主流之间毫无意义的讨论已成为一场实质性的竞争，将用颠覆性货币来争夺。加密货币为退出法定货币体系敞开了大门。谁
    ever 走出那条出口，就不再支持政治主流。每一位加密货币持有者，无政府主义和自由意志主义的论点就更有力。随着加密资产的去中心化力量增长，法定货币变得脆弱。如果这一过程继续下去，那么在某个时候，较弱的权威将开始无法监管在加密货币之上构建的公司。这可能会引发政府失败和加密资产持有者影响力上升的反馈循环。


    政府作为主权实体，通常不被视为竞争对手。例如，对暴力的垄断只有通过其他国家发动战争，或者通过道德存疑的冒险家（也称为罪犯）才会受到挑战。同样，比特币挑战了政府在货币和金融领域的垄断。任何金融运营者都有选择与政府和银行竞争。在比特币之前，印制自己的钱是不被允许的。即使你这样做了，也必须将范围限制在很小，比如地方货币或多人在线游戏内使用的货币。雄心勃勃的货币尝试，例如
    E-gold，都是徒劳的，因为它们很容易被阻止。然而，比特币可以——并且很可能可以——不被阻止，因此它是第一个有机会挑战国家主权的货币。它很调皮，很前卫。这是政治少数群体退出货币现状的一种新方式。直到
    2019 年，比特币都没有遭受过公开的阻止尝试。一个原因是大多数政府官员和中央银行家还没有对它做出决定。即使他们隐含地反对它，他们也不明白自己在看什么。当你看到一个议会委员会通过采访中央银行家、加密货币从业者和传统金融人士来调查加密货币时，这一点很明显。自
    2019 年底和 2020 年以来，几位美国政客表示他们希望禁止加密货币，因为它们损害了美国的利益。他们明白自己在看什么：美国的大部分地缘政治权力来自美元作为国际储备货币。然而，大多数政客和中央银行家不理解加密货币的愿景。他们用旧的尺度来判断它是否是货币，并发现加密货币不像法定货币。他们称之为数字商品，或是一个全新的资产类别。在他们的工作框架内，他们是正确的。它确实是一个新的资产类别，因为没有其他东西像它。它也是一种商品，无疑类似于黄金，而黄金正作为单纯的商品或中央银行资产发挥作用。但在过去，黄金是货币。它最初是一种商品，变成了货币，然后又回到了大多数人眼中的商品，只对黄金持有者和中央银行来说是货币一样。同样，一种稀缺的数字商品可以成为货币。它具有成为货币所需的所有属性，再加上一些额外的属性，例如能够从一部智能手机发送到另一部智能手机的能力。


    精英银行家和政客往往能正确看待加密货币的表面属性，但他们的框架太窄，无法看到全貌。大多数政府不试图阻止比特币的另一个可能原因，是为了防止反对其政策的叛乱之路凝固。叛乱将增强生态系统，使其更加强大。看来大多数精英银行家和政客都未能理解加密货币。几乎不可能跟上比特币、其他区块链和加密资产的发展。了解其运作方式需要掌握十几个科学分支的基本知识。从那里，你可以深入细节，而这些细节都来自专业技术领域。传统政客、金融
    MBA，甚至许多传统的技术投资者都无法准确评估加密货币。他们太忙于通过自己工作、背景和职责的视角来审视加密资产。


    ## 加密货币可能成为什么


    根据一些人的说法，比特币，或许还有其他区块链，可以保障世界上所有的价值交换。任何在价值周围流动的金融工具都可能成为去中心化数字货币之上的自动化合同。你可以在加密货币之上拥有多个平台，用于保障各种安排，具有不同的隐私和安全特性。关于“金融产品”的任何“合同”都可以控制特定金额或资金流。那些想要处理这种付款的人将是早期采用者。随着对该货币需求的增长，更多合同和产品将可用。通过让它们在独立但更小的区块链上运行，可以轻松降低单个合同和资产的安全性。市场将趋同于每种资产类型的安全性和结算保障水平。加密货币之上的每个产品或服务都必须在约束之间取得平衡。定义这些约束的一种方式是安全性、便利性和自由（Dan
    Geer，《网络安全与国家政策》，2010 年）。这些约束形成一个三角形，设计者为给定系统从中选择两个。每个这样的平衡安全解决方案都必须由一家公司构建。也许那家公司可以由你创立。


    看来比特币和其他加密货币在经济的某些部分已经能够立足。我们可以期待未来的功能吸收更广泛的交易范围。我们将较少依赖机构，并将较少暴露于货币供应的任意中央计划之下。企业家将能够自由地创造全球人口所要求的金融服务，而无需跳过监管者设置的障碍。在比特币之上构建，可以避免与那些必须遵守为一个价值转移需要第三方的世界而设计的法规的人打交道。这种颠覆全球金融的自由将受到现有机构的抵制，因为货币是国家政治的一部分。


