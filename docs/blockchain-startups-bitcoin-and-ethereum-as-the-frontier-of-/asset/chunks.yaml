    level is possible with cold storage, where you expend more effort to keep your
    private keys in a physical form only without a connection to the internet. Cold
    storage with a custodian means that someone else holds the keys secure; you depend
    on a third party. For example, no one can get to your assets because they sit
    in a bunker in Switzerland. Wallets are a multi-disciplinary design challenge
    covering hardware manufacturing, software security, “threat models,” mental models,
    and interface design. Companies that want to build a competitive wallet need a
    team that touches on all those fields. It can be a challenging journey. As a wallet
    customer, I have prepaid for a next-generation hardware wallet in a crowdfunding
    campaign, and their progress has halted along the way. I’m rooting for them to
    finish and deliver a cutting-edge product, but it seems that wallets’ market success
    is won the hard way. A company’s rewards for designing and building wallets right
    are as high as the risks for getting it wrong.


    ## Remove the Need for Custodians


    A custodian who keeps your crypto-assets in cold storage is the equivalent of
    holding valuables in a safe deposit box with a traditional bank. You choose to
    trust them fully and minimize the risk of losing the keys through any error of
    your own. An adversary would need a court order to confiscate your crypto-assets,
    which is possible but in most situations, unlikely. If you encrypt the key, they
    cannot access your assets. Crypto-asset custodians come in two varieties: a) they
    are regulated, know how much you own, and have insurance against heists. Or b)
    they are unregulated like “money guards,” they are a private person you trust,
    like a neighbor or family member. These money guards are standard in the developing
    world. These two types of custodians work well for many people, but they do not
    make use of the unique properties of crypto-assets. You and your money guard are
    still vulnerable to extortion, and you have to trust them. To transcend the tradeoff
    between convenience and security, developers and entrepreneurs have to apply their
    imagination to make a wallet that is as secure as a custodian, without making
    the user vulnerable to a third party or potential robbers. That kind of wallet
    will support both the convenience of online exchange and the security of cold
    storage. Ideally, we do not want our assets under any central control. By rising
    to the challenge of storing crypto-assets safely without custodians, we move forward
    on a trajectory to disrupt the central authority of money and finance. For next-generation
    wallets, startups can aspire to that security level, with users in full control
    of their wealth, with only a simple physical device that keeps the backup phrase
    and as easy to use as physical cash. Theft and loss protections are built-in.
    When holders can control and secure their crypto-assets without trusted third
    parties, banks and regulators will no longer have the power to frustrate owners
    according to random dictates. Typical current banking relationships have us paying
    third parties to handle everything, while customer experience is mediocre at best.
    If we demand a smooth cryptocurrency experience, we have to bypass the banking
    system, which means exchanges such as Coinbase, Kraken, and Bitstamp are only
    temporary solutions. They are too centralized and bureaucratic because they have
    to comply with banking regulations. We need something that gets crypto-assets
    into people’s hands naturally, which is how new owners will become invested in
    the future of money. Furthermore, we have to design the next generation of crypto-assets
    in a way that annihilates the incentive to hack or coerce. It should be impossible
    or prohibitively hard for potential thieves to reach crypto-assets. Owning crypto-assets
    must be safe and convenient for everyone so that all those independent owners
    together become a political constituency.

    '
  trans: '


    # CHAPTER 5 钱包设计


    在前面的章节中，我们讨论了如何消除处理资金时的摩擦；让加密资产更易于使用的一种方法是更好的钱包应用程序。钱包是一个创业机会，因为卖家可以从经过验证的商业模式中进行选择：a)
    通过连接交易所来支持资产交易，b) 收取钱包硬件的费用，或 c) 支持按月付费的安全备份。一些钱包初创公司正在尝试新的商业模式，但还为时过早，无法判断它们是否会奏效。这就是为什么本章只关注易用性和安全性，并假设如果你构建了一个安全且易于使用的钱包，付费用户就会来。更好的用户体验有助于将加密资产带给更广泛的采用者群体。加密资产的接口，即“钱包”，让你发送、接收和持有加密资产。然而，到目前为止，只有技术娴熟的人，即“创新者”，才能自信地使用它们。即使是最好的钱包，有时也很难使用。在未来几年中，钱包开发者必须不断调试，直到奶奶能给孙子送一个
    CryptoKitty 作为生日礼物。我提到过我感到可以自信购买比特币的那个时间点。我早些时候曾尝试购买比特币，但因为摩擦和风险而放弃。钱包技术和交易所的市场渗透率必须达到一定的易用性水平，我才成为买家。我的情况只是众多例子之一。无论你的技术专长、动机和天赋如何，在某个时刻，购买和持有比特币都超出了你的能力范围。这不仅仅是关于你对市场的访问；你还必须能够保护资产。这也适用于那些可以通过在笔记本电脑上挖矿而非常早进入的比特币爱好者。我听到和读到过许多关于搞砸和被盗的报告。以下情况是典型的：


    • 一些早期的比特币爱好者挖了很多币，但没有保留备份。损坏的硬盘或伴侣扔掉“旧电脑”让他们付出了惨重代价。

    • 一些人使用过于复杂的方法保护他们的加密资产，忘记了关键步骤，无法找回他们的财产。

    • 一些人保持安全设置简单，但在涉及头部受伤的事故后忘记了密码，或者随着时间的推移而忘记。

    • 在比特币变得更加主流之后，小偷开始通过黑客攻击、入室盗窃或结合暴力威胁的绑架来针对已知持有者。

    • 黑客使用网络钓鱼攻击、特洛伊木马和受感染的网站进入人们个人电脑上的钱包。


    我近距离目睹了这样一个案例。受害者在一台专门用于此目的的笔记本电脑上存放了价值 30,000 美元的加密资产，分散在多个钱包应用程序中。他安装了一个后来被证明是恶意的门罗币钱包。攻击者进入电脑后，清空了该钱包以及他所有其他钱包。受害者拥有信息技术的专业背景，但在下载了那个被攻破的钱包后，他无力阻止盗窃。这样的悲剧事件是加密资产创新者阶段的症状。我们可以期待一个未来，其中此类问题像银行对账单中的错误一样罕见。近年来，钱包设计师已经解决了其中几个安全问题——我们将在下面介绍。


    ## 消除摩擦


    为了为钱包产生设计创意，我们可以比较不同类型的货币和支付技术在摩擦方面的差异。每种支付方式都有特定于媒介的局限性，钱包初创公司可以将每种局限性视为需要解决的挑战。一笔金融交易要求用户在用户界面内执行一系列操作才能达到目标。我们将这些步骤区分为
    a) 用户引导和 b) 重复使用。例如，在某些国家和对某些人来说，申请信用卡需要两个月的前置时间，代表着五小时的工作量。在其他国家，你甚至不需要申请，只要信用评分良好，就会收到一张可用的信用卡。在日常生活中使用信用卡是标准做法，但如前一章所讨论的，信用卡远非理想的货币。这个例子表明，技术可能在不同的层面和接触点上产生摩擦，具体取决于用户的特征。设计师可以观察用户，并利用同理心来找到目标市场的摩擦点。从长远来看，我们可以预期每种支付方式都将整合到一种支持加密资产的单一钱包技术中。这种技术将由新公司或开源团队构建，而不是由银行构建。一个完整的钱包应用程序也将持有法定货币，但保持常规电子法定货币需要银行牌照，而银行不适合支持加密资产。这就是为什么这种钱包中的法定货币可能会是“稳定币”：通常是美元，由区块链上的代币代表的法定货币。这解决了我们在第
    3 章中讨论的入金和出金的一些问题。一个完整的钱包将持有至少所有知名且流动性好的加密资产，并消除法定货币/加密货币交易中的摩擦。加密资产可能会像互联网一样发展：从奇怪和危险的实验变成安全且轻松的实用工具。构建互联网的创新者只有在开始服务于大众时，才能开始颠覆电话和出版公司。主流采用的第一步是互联网浏览器的开发。随后的采用浪潮依赖于网络邮件、足够快的视频、BitTorrent、社交网络和智能手机。加密资产的主流采用取决于一种钱包设计，它为消费、赚取、储蓄、投资和投机提供了新的隐喻。我们必须将货币接口适应人们对货币运作方式的现有观念。对于加密资产，市场渗透率仍然很低；我们正处于创新者阶段。如果你足够了解它以至于能够使用它，你就是一个创新者——就像
    1995 年的互联网用户一样。每个创新者都有一个独特的机会：你可以承担责任，通过触及早期采用者来推动加密资产领域的发展。当我们放眼望去，加密资产取代普通纸币和数字货币似乎是不可避免的，但我们仍然必须构建那个未来。这个悖论指向了创新者的工作；作为企业家，你需要一种命运感结合紧迫感。


    ## 引擎盖下


    在可用技术中，复杂性被隐藏在“引擎盖下”。在开发的早期阶段，你看到并听到所有的齿轮。然后齿轮移到背景中直到消失，留下纯粹的功能供用户享受。完美的音响系统只是声音。理想的电视只是一扇通往别处的窗户。小孩子不知道汽油是易燃的，汽车靠爆炸运行，就像被封闭在引擎盖下安全小空间里的危险烟花。互联网曾经运行在针对人类声音优化的电话网络上，这就是为什么你的电脑在拨号上网时会发出奇怪的噪音。现在，互联网已经成为一种通用的抽象，一种像水和电一样的公用事业。随着时间的推移，人们将在没有听说过
    WiFi、蓝牙和 5G 的情况下上网。每当连接中断时，他们会惊讶地发现自己无法学习、工作或与朋友交谈。我们必须将加密资产的可用性推向类似的道路。技术发展的历史表明，我们需要的想法就在我们鼻子底下。然而，智人往往近视，被困在周围环境和日常习惯的现状中。狩猎采集者的条件反射抵制变化，因为变化往往意味着危险。界面设计师和安全专家必须超越这种古老的本能，运用想象力摆脱过时的模式和传统。


    ## 设计空间


    加密钱包是具有用户界面的工具，有许多可以想象的设计。工具在复杂性上各不相同。例如，任何人都可以使用一把剪刀，而驾驶飞机需要培训。这说明了区块链界面设计师必须探索的广阔设计空间。钱包设计的可能性是无限的，而其中只有很小一部分在实践中可行。有些设计会很快被发现，而其他设计可能需要数年才能发现。与此同时，我们可以从互联网软件的成熟过程中汲取灵感，作为历史上的类比。互联网提供的第一个明显优势是电子邮件：用户向联系人列表中的人发送消息，他们有一个收件箱、一个发件箱等。你可以想象下一步是：让用户连接到陌生人并向他们发送消息。表面上看，这似乎是一个同样简单的设计挑战。你在一个网站上收集一群陌生人，并给每个人一个收件箱和个人资料。例如，约会网站。然而，约会网站从“糟糕”发展到“足够好”大约花了十五年。说明设计空间大小的其他例子是
    Upwork 和 LinkedIn。这两个平台都将雇主与雇员或自由职业者匹配，但它们的目标受众和愿景不同。专门针对在线约会或工作匹配的网站和应用程序现在正处于“早期大众”阶段。这个历史类比表明，比特币和其他区块链技术有许多细节需要调整，直到我们能为主流用户提供高质量的体验。为了勾勒加密钱包的设计空间，让我们来看看我们现在在这个早期阶段面临的挑战和权衡。


    ### 持有私钥的风险


    加密资产是一种信息；它们是稀缺的，但不是由物质物质制成的。有价值信息的这种轻便性为钱包用户产生了特定的风险，设计师必须加以管理。加密资产存储在区块链上，使用公钥，在一个由私钥保护的“地址”上。公钥和私钥是大数字，表示为数字和字符的字符串。钱包的密钥是最关键的元素；谁控制私钥，谁就控制加密资产，因此你的加密资产的私钥绝不应该离开你的设备。一方面，密钥是坏人想要偷窃的东西，另一方面，你必须始终保留密钥的备份，以防丢失或损坏硬件设备。虽然密钥是信息，但风险是物理的，因为罪犯可能会胁迫所有者交出加密资产的密钥。这种安全权衡是钱包功能的首要关注点。钱包应该易于使用，但设计师面临一个两难困境：便利意味着风险。你可以通过消除风险来提高安全性，这意味着用户在金钱或麻烦方面付出代价。加密资产被盗或丢失的危险类似于一种也是液体和易挥发的物质：硝化甘油。必须小心处理这种油状炸药，因为如果它振动，就会爆炸。化学家学会了用吸附剂稳定硝化甘油，从而制造出炸药，这是一种用于在山中开凿隧道或拆除建筑物的工具。今天，加密资产仍然是一种危险的物质。安全专家和界面设计师尚未发现加密资产的“吸附剂”——保护非技术用户免受盗窃和丢失的方法。保护加密资产安全的一部分解决方案可以在历史和自然中找到。在液体资产可以是信息之前，它们总是实物，例如珠宝、金条、银币和宝石——你必须隐藏或保护的资产。如果你将资产放在身边，罪犯可能会将你作为抢劫目标。职业罪犯，如黑客和黑帮分子，选择在没有民主国家保护的情况下行动，而大多数人则更喜欢作为平民，享有所有权的法律保护，例如银行中的资产。加密资产的主流采用要求普通人在不依赖法律系统的情况下保护他们的财富免受盗窃和敲诈。这是钱包技术的主要挑战。


    ### 天然安全


    自然能告诉我们关于保护贵重物品安全的什么？一些为了未来储存食物的动物物种，在自然选择的压力下，变得足够聪明或足够强壮来保护它。蜜蜂，蜂蜜的制造者，雇佣了一支自杀式飞行员军队。它们以力量对抗力量。还有非暴力动物使用的其他方法。例如，加州灌木松鼠会进行缓存间距：将食物藏在不同的位置。它像一个负责任的投资组合经理一样分散风险。竞争对手可能会发现一个缓存，但其他缓存仍然隐藏。松鼠和其他啮齿动物进行分散储藏。它们记住大约
    1200 个坚果和种子的确切位置。通过类似的“隐蔽安全”措施，平民可以以更低的风险持有更多财富。记忆辅助工具和隐藏或受保护的备份已经是当前最佳钱包设计的一部分。


    ### 设计权衡


    拥有加密资产在某些方面比拥有实物更容易。你可以安全地、低成本地将财富带到任何地方。此外，私钥只是单词或数字，更容易隐藏。然而，加密资产的所有者必须采取更多措施来阻止胁迫。必须说服潜在的抢劫者，所有者现在或将来在胁迫下都无法访问密钥。加密资产是未来的财产，但如果持有这些资产会使人们面临暴力抢劫和敲诈的风险，这个未来就不会对主流用户发生。第
    1 章提到了安全、便利和自由之间的约束平衡（Dan Geer, Cybersecurity and National Policy, 2010）。钱包技术创新的第一个角度是提升便利性和安全性之间的权衡水平。核心两难在于易于使用且有风险，或者复杂且安全。任何新的、更好的钱包技术代际都必须超越前一代用户体验的限制性权衡。越来越多的非技术人员可以以更低的成本、更大的便利性保持其加密资产安全。钱包设计师旨在安全性和便利性的上升螺旋中上升。我们可以将钱包创新比作手机发展为智能手机的过程。功能和便利性随着每一代新产品的推出而扩大。钱包市场很可能大部分会被结合硬件和软件的公司所占据。便利性和安全性之间的权衡已经提升了三次。我们可以观察这种模式，看看钱包技术是如何发展的：


    交易所网站：购买和存储加密资产最简单的方法是将它们保存在交易所网站上。这就像与网上银行或经纪账户交互一样容易，但它们只提供安全的假象。界面看起来像银行的，你的银行大多是安全的。然而，交易所网站托管着加密资产，成为一个吸引黑客的“蜜罐”。从交易所黑客攻击加密资产比从银行黑客攻击数字法定货币要容易得多。这种风险不是理论上的。交易所经常被抢劫；每隔几个月就会有高调案例出现在新闻中。这种便利性和安全性之间权衡的原始水平不能持续太久。


    热钱包：当前的加密钱包迫使用户做出不愉快的选择。你可以使用“热钱包”，它们保持连接到互联网，用于接收较少量的加密资产，这些资产保持可用以便快速消费。最好的热钱包设计良好，在用户了解基础知识后易于使用。可用性诱使用户将所有资产都放在该钱包中，这太冒险了。在热钱包中携带过多价值是不建议的，因为黑客可以远程用病毒感染它，窃取你的资产。或者抢劫者可以通过威胁用户来拿走它，就像有时发生在保险箱中的贵重商店一样。


    硬件钱包：你可以为更多安全性付费，同时仍然保留一些便利性，使用硬件钱包。你可以始终花费资产而无需太多工作，但这比从交易所或热钱包发送更麻烦。硬件钱包比交易所网站和热钱包更好地保护加密资产，因为远程攻击硬件钱包更困难。


    多签名钱包和异地备份：一些钱包解决方案会自动保留安全的异地备份以供恢复。其他方案可以通过将花费能力分散到多个位置、设备或人员来提高安全性。


    托管冷钱包：目前，安全性和便利性的最高组合是“冷存储”加托管：其他人负责保护你的资产，他们将私钥离线保存，受到远程黑客的保护。你将被盗和敲诈的风险外包，但你使自己易受该第三方的影响。如果他们是一家公司，他们像银行一样受到监管和保险，你的资产在账簿上用于征税。这也意味着你接受当地当局出于任何原因没收你的加密资产的风险。用
    Geer 的三角形术语来说，你牺牲了一定的自由度，以换取更好的便利性和安全性。


    总结：硬件钱包已经提升了易于使用与安全性之间的两难困境。这是市场在大多数情况下所趋向的方向。通过冷存储，可以实现更高的安全级别，你需要付出更多努力将私钥仅以物理形式保存，而不连接互联网。带有托管的冷存储意味着其他人安全地持有密钥；你依赖第三方。例如，没有人能拿到你的资产，因为它们位于瑞士的一个掩体中。钱包是一个多学科设计挑战，涵盖硬件制造、软件安全、“威胁模型”、心理模型和界面设计。想要构建有竞争力钱包的公司需要一支涉及所有这些领域的团队。这可能是一段充满挑战的旅程。作为钱包客户，我在众筹活动中预付了一款下一代硬件钱包，但他们的进展在途中停滞了。我希望他们能完成并交付一款尖端产品，但似乎钱包的市场成功是艰难赢得的。一家公司设计和构建钱包正确所获得的回报，与做错所面临的风险一样高。


    ## 消除对托管人的需求


    一个将你的加密资产冷存储的托管人，相当于在传统银行的保险箱中存放贵重物品。你选择完全信任他们，并尽量减少因自身错误而丢失密钥的风险。对手需要法院命令才能没收你的加密资产，这是可能的，但在大多数情况下不太可能。如果你加密密钥，他们就无法访问你的资产。加密资产托管人有两种类型：a)
    他们受到监管，知道你拥有多少资产，并有针对抢劫的保险。或者 b) 他们不受监管，像“金钱守护者”，是一个你信任的私人，比如邻居或家人。这些金钱守护者在发展中国家很常见。这两种类型的托管人对许多人来说效果不错，但他们没有利用加密资产的独特属性。你和你的金钱守护者仍然容易受到敲诈，并且你必须信任他们。为了超越便利性和安全性之间的权衡，开发者和企业家必须运用想象力，制作一个像托管人一样安全，但又不使用户易受第三方或潜在抢劫者伤害的钱包。那种钱包将同时支持在线交易所的便利性和冷存储的安全性。理想情况下，我们不希望我们的资产处于任何中央控制之下。通过迎接在没有托管人的情况下安全存储加密资产的挑战，我们在颠覆货币和金融中央权威的轨迹上向前迈进。对于下一代钱包，初创公司可以志在达到那个安全级别，用户完全控制自己的财富，只需一个简单的物理设备来保存备份短语，并且像使用现金一样易于使用。防盗和防丢失保护是内置的。当持有者可以在没有可信第三方的情况下控制和保护他们的加密资产时，银行和监管机构将不再有权根据随意的命令挫败所有者。典型的当前银行关系让我们支付第三方来处理一切，而客户体验最好也只是平庸。如果我们要求流畅的加密货币体验，我们必须绕过银行系统，这意味着
    Coinbase、Kraken 和 Bitstamp 等交易所只是临时解决方案。它们过于集中和官僚，因为它们必须遵守银行法规。我们需要某种东西，能让加密资产自然地进入人们手中，这是新所有者将投资于货币未来的方式。此外，我们必须以一种方式设计下一代加密资产，以消除黑客攻击或胁迫的动机。潜在的窃贼应该不可能或极难接触到加密资产。拥有加密资产必须对每个人都是安全且方便的，这样所有这些独立所有者共同成为一个政治选民群体。


