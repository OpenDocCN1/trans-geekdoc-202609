    are probably not imaginable from where we are now. We can only intuit the possible
    and prepare for the opportunities. Here are some examples from our current vantage
    point.


    ### 1. Pay Subscriptions Per Second


    Present situation: A monthly or yearly subscription, like the newspaper, gym membership,
    salary, club membership, and tuition is paid this way because the bank transfers
