    # CHAPTER 4 Ideal Money


    People adopt crypto-assets that have a specific function in their economic life,
    such as transacting, saving, speculating, or investing. In the previous chapter,
    we saw that crypto-assets that fulfill those financial and commercial functions
    catalyze a network effect, giving birth to a self-reinforcing cycle. In essence,
    the more people use the asset, the more liquid it becomes, which in turn boosts
    its usefulness and value, which leads to the price rising. This high price allows
    the network to absorb more transactions of higher value. Rising liquidity makes
    the asset more stable, which draws new users, which makes the asset more liquid.
    The benefit of this feedback loop makes the cryptocurrency or asset a growing
    success.


    The features of a crypto-asset that catalyze a network effect fall into two broad
    categories:


    ## A) Financial choice


    We can judge these as value propositions with features and benefits to a specific
    buyer persona. The users of the product or service get choices or options that
    are black and white; they make the transaction possible or not. The entrepreneurs
    who can invent these features apply the traditional insights into startups to
    the domain of finance. Most startup entrepreneurs are familiar with the finance
    industry as it was before Bitcoin, and therefore overlook money, financial assets,
    and transactions as areas where they can win. But now, entrepreneurs merely have
    to turn their heads to see the opportunities.


    Strict regulation of international banking makes many transfers slow or impossible.
    Any substantial sum becomes precarious. Regulators force international bankers
    to act as third-rate cops that ask annoying questions. From the perspective of
    the client, it looks like petty abuse of power. They can use cryptocurrency to
    evade such customer experiences.


    Another example of giving people financial choices: Crypto-assets that relieve
    a person’s tax burden would be in high demand. Perhaps you can make people’s income
    streams passive, moving them from income-taxed to capital gains tax. There are
    likely many opportunities for regulatory arbitrage of tax law. Wealthy people
    already do this, with the help of costly attorneys, who are middlemen of traditional
    law. In the future, entrepreneurs can use smart contract platforms to provide
    those services to anyone who feels that they pay too much tax.


    ## B) Low friction


    One factor in the growth of the network effect is friction in the user experience
    of a crypto-asset. The resistance depends on, for example:


    - How quickly can a user get on board?

    - Does the user need technical knowledge?

    - What is the learning curve for the typical user?

    - Does the software evoke the right metaphors to support the mental model of the
    user?


    To apply an idea by consultant and educator Peter Drucker, crypto-assets that
    fulfill the benefit of transacting and holding are effective: they do the right
    thing, while crypto-assets that make these transactions quick and easy are efficient:
    they do ‘the thing’ right.


    We see that a specific crypto-asset first proves its effectiveness, and then becomes
    more efficient. In the case of Bitcoin, users first needed to understand the notion
    of a digital, scare, unstoppable currency. A critical mass of enthusiasts had
    to want it badly, and then entrepreneurs could profit from building exchanges
    and wallets that made using Bitcoin fast and easy. Altcoins showed a similar development,
    where the more successful crypto-assets got support from exchanges and wallets.


    The network effect of a cryptocurrency depends on the usefulness first: it has
    to empower a new type of transaction effectively. The currency or asset needs
    a reason to exist to get the feedback loop started. Once the users can fulfill
    their transaction needs in this new way, they can care about its efficiency. The
    transaction is a must-have; its speed and comfort are nice-to-haves.


    Many of the founders of altcoins confuse monetary effectiveness with payment efficiency.
    They compare the speed and ease-of-use of Bitcoin and Ethereum to centralized
    networks such as regular credit card payments or mobile applications of banks.
    These projects try to launch a cryptocurrency that competes in efficiency with
    fiat payment networks, without introducing the new type of transaction. However,
    there is no point in printing money that has no reason for existing. For now,
    digital fiat is doing an excellent job handling convenient payments. The novel
    use case, which unlocks new economic value, is a necessary condition for success.


    ## Building the Higher Layers


    One promising technology for making transactions on a blockchain faster and cheaper
    is a second protocol layer, on top of the base network. The protocol allows nodes
    to open channels between them that keep the transactions open until they close
    the channel. Then only the final balance is settled on the base layer. That will
    remove the need for maintaining a public and distributed record for small transactions.


    Protocols such as Lightning Network can ‘modulate’ the features of a bitcoin.
    For example, the users do not need to pay for hard guarantees if they make a small
    payment. A retail purchase such as coffee is not significant enough to record
    on the base layer of Bitcoin or Ethereum. The system should aggregate these on
    a higher tier. Also, you do not have to settle the balance daily. Many companies,
    such as retailers and subscription services, have customers who come back regularly,
    so an open payment channel is more efficient.


    The efficiency of the second layer protocol is like the difference between a paper
    contract, which is fast and cheap, and a court case, which is slow and expensive.
    A well-defined deal prevents the court case. The transacting parties only need
    judges for the rare and unlikely event not covered by the contract. Likewise,
    the smart contract on the second layer will usually work fine, and only if a dispute
    does occur, does either party need the forced on-chain transaction to settle the
    balance.


    The second layer will free the media of money in the same way that internet protocols
    free information and communication from their traditional carriers. In the old
    days, we had channels and “media” to hold and transmit data, and publishers had
    to squeeze the message into the medium’s limited economics. Some examples:


    - You took pictures in sets of 36 and could see them, after “development,” a week
    later.

    - TV and radio are uniform and passive.

    - A telephone is for one-to-one, and talking to people further away was more expensive.

    - The newspaper informs the opinions within a nation.

    - Compact discs (CDs) had two or three good songs, but you pay for all of them.

    - Private video recordings were scarce.


    With tablets, communication became easy, cheap, and frictionless. The trend of
    smartphones, tablets, and cloud computing finished the move away from specific
    media. Information flows lightly one-to-one, one-to-many, many-to-many, and many-to-one.


