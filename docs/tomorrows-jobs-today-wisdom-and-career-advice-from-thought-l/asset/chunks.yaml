- raw: "We are seeing the technology vendor market taking over a leadership role,\
    \ and they may serve as the new defining force in setting direction and guiding\
    \ the industry. Self-serving, yes, but it could be what is needed going forward.\
    \ I am not concerned about relevance as it will continue to be all about information\
    \ and technology, and the management, protection and leveraging of data as an\
    \ asset. While the role of a traditional Records Manager may not continue to be\
    \ relevant, I don’t find it particularly concerning. The relevance is in the work,\
    \ and it evolves.\n\nQ: This book is tasked with identifying the common threads\
    \ of wisdom woven throughout all the information management disciplines. Having\
    \ worked in various industries as both a practitioner and a consultant, what principals\
    \ do you see as key to successful outcomes in the management of data, technology,\
    \ and people?\n\nA: What I prefer to integrate with my approach is the KISS principle,\
    \ or keeping it simple, and that includes when identifying a solution, selecting\
    \ technology, developing taxonomy, writing policy, or planning the roll-out of\
    \ better practices. Simple always wins over complex, and this is undoubtedly key\
    \ in consideration of the end-user and expediting goals. This principle of keeping\
    \ it simple does not mean time was not invested, analytics were not employed,\
    \ or strategy was not used in gaining support, or implementing change. Intrinsic\
    \ is being smart in maximizing simplicity in accomplishing your goals. To quote\
    \ Albert Einstein: “Everything should be made as simple as possible, but not simpler,”\
    \ and da Vinci, “Simplicity is the ultimate sophistication.”\n\nQ: What is the\
    \ most constructive lesson you’ve picked up as a practitioner that you were able\
    \ to transfer into the business of consulting?\n\nA: The importance of being able\
    \ to connect with my organization’s decision makers in a way that was meaningful\
    \ to them and the organizations. As records management requires an enterprise-wide\
    \ approach, I developed an instinct for understanding and aligning it with the\
    \ overarching business goals. And like any business manager, I recognized I needed\
    \ to be savvy in getting sustained support and budget for my initiatives. All\
    \ my peers were after the same, and my area has long been considered an overhead\
    \ operation that is far from being mission-critical. Of course, I disagree as\
    \ I know what we do supports the bottom line.\n\nWhat I brought to consulting\
    \ was the keen understanding of the practitioner’s challenges and helping them\
    \ to reinforce and even elevate their needs for creating importance. Having sat\
    \ on their side of the conference room table, I sometimes know what the right\
    \ next step is might not align with right now for senior management or the organization.\
    \ Initiatives may have a best practice order for executing, but it is better to\
    \ get support for some now and prove value than to have no support. I respect\
    \ the practitioner and strive to ensure they end up in a better place, feeling\
    \ empowered going forward.\n\nQ: Of the five major emerging areas, big data, blockchain,\
    \ IoT, quantum computing, and artificial intelligence, which do you think will\
    \ require the most attention from records management and information technology\
    \ leaders and why?\n\nA: What I think requires the most attention from IG and\
    \ IT leaders is not related to any one area but having the ability to stop and\
    \ invest the time, without impeding progress, on a strategic vision and path.\n\
    \nToo many organizations have a reactive rather than a proactive approach regardless\
    \ of technology and emerging areas. As a result, continual “budget-year” investments\
    \ can be made based on limited view aspects, frequently without much involvement\
    \ by the business groups or consideration of where the business, as a whole, is\
    \ headed. The precedence-norm of fast decision making over smart is compromising\
    \ organizations in a variety of profound ways, including a chaotic information\
    \ environment. Part of the vision needs to include managing the growing volume\
    \ of content while maximizing its asset value. Otherwise, organizations will always\
    \ be reacting and encumbered by addressing past investments and splintered tools\
    \ supporting siloed groups.\n\nQ: How did you find yourself gravitating towards\
    \ the world of Records and Information Management?\n\nA: The field found me early\
    \ in my career, and it was a natural path. I have always been a very organized\
    \ and analytical person intrigued by the enterprise-wide scope and value and viewed\
    \ records and information as an organization’s most critical assets. The application\
    \ of technology to streamline manual processes was captivating. So, I gravitated\
    \ and then made a career of it, having been extremely fortunate to connect with\
    \ industry leaders who mentored my development and pushed my thinking.\n\n# [Part\
    \ III Relationships Matter](#nav.xhtml#toc19)\n\n> “You can take my factories,\
    \ burn up my buildings, but give me my people and I’ll build the business right\
    \ back again.”  \n\n> Henry Ford\n\nThe innovative business minds that have shared\
    \ their experience and advice in these pages have also been instrumental in developing\
    \ and refining best practices and approaches in their fields, including big data,\
    \ enterprise content management, blockchain, AI, privacy, IoT, and more. They\
    \ are our wise mentors and friends. In our careers, we’ve been lucky enough to\
    \ work closely with many of them to achieve common goals. Enjoying and being enriched\
    \ by professional relationships is above and beyond the greatest gift you can\
    \ give your career. Relationship building is, has always been and will always\
    \ be, the most seminal skill and strategy we should practice and master.\n\nAs\
    \ working professionals in the Information Age, we must strive to recognize and\
    \ even anticipate emerging trends. Seizing upon those opportunities is possible\
    \ when we choose to partner with change agents who share our vision and can work\
    \ with us to transform our enterprises. We must reach beyond our teams or spheres\
    \ of influence and work closely with the legal, regulatory, and ethical communities\
    \ that study, measure, and moderate the impact of our technology and products\
    \ on our respective fields. We need to plan and develop ourselves with a deep\
    \ respect for the world that our products and services impact.\n\nToday’s uptick\
    \ in cross-functional collaboration, particularly in the planning and review phases,\
    \ is being driven by an explosion of regulations and laws passed in the EU, the\
    \ United States, and across the world. While in part burdensome, it’s also a catalyst\
    \ for a new synergy we see across once siloed areas of our businesses. It is leading\
    \ to a holistic approach to management, governance, and profits. The new demands\
    \ of the digital economy and its ethical considerations like privacy and the environment\
    \ are moving us toward a dynamic view of customer relationships and customer experience.\n\
    \nRelationships are at the core of business ethics and information governance\
    \ (IG). There are various definitions of IG, but all seem to articulate and frame\
    \ an end-to-end solution that leverages the best minds available to an organization\
    \ to ensure decisions about digital information and its governance are not made\
    \ in a vacuum. IG helps organizations consider all angles to ensure its long-term\
    \ benefit on the organization as a whole is lasting, ethical, and risk-averse.\n\
    \nInformation governance is unique in its collaborative benefit because its primary\
    \ focus is data. Its ultimate impact on our bottom lines requires intelligent\
    \ discussions and decisions about dynamic initiatives, policies, and custodianship.\
    \ IG decisions today can easily make or break a company in the Information Age."
