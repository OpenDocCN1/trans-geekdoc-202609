- raw: 'We have a lot of discussions around this kind of stuff. What if somebody gets
    on a library computer and looks up how to do something malicious? How or do we
    even begin to protect against something like that? Where’s the line in the sand?
    Right now, for example, there’s a big discussion around viewing adult material
    in libraries.


    In terms of browser history, there’s a lot of discussion around adding filters
    to the computers and whether libraries be involved. Because those filters also
    might block out some legitimate searches. Should we trust our fellow citizens
    enough to allow them to access the internet as if they would at home, without
    tracking anything like we do when they check out a book?


    Q: Has the ease of conducting academic library research, by relying too heavily
    on search engines, had any negative impact on the quality of the results? Do you
    think by substituting or supplanting search results for traditional library science
    and peer review, we’re possibly producing data that tells us what we want to hear
    rather than what we should know?


    A: I’m not entirely sure that we’re seeing the impact of all this as much as we
    will in the next ten years. The big issue is that Google provides those search
    results without much context. What that leads to is a situation where I can right
    now prove just about any silly idea I have in my head through a Google search.
    If you’re looking at flat-earthers, you’re looking at anti-vaxxers, you’re looking
    at 9/11 being an inside job, you know those results erroneously validate those
    conspiracies.


    Q: Does that mean there is there going to be further regulation of content? What
    are some of the solutions? Do we de-anonymize the internet?


    A: This is one of the central issues in the recent election meddling controversy.
    Anybody can pretend they are a citizen of a different country online and then
    do whatever destructive thing they want to do. I don’t know if de-anonymizing
    the internet is the right solution, but I do think that as we normalize what people
    are calling research, which is equivalent to referencing a couple of videos that
    you agree with on YouTube, as that becomes normalized, it absolutely might filter
    into academia. It could start filtering into dissertations and legitimate research
    as a regular part of academic research. Another example, and one of the things
    that we keep hearing in libraries, is the falsehood that states determine the
    future prison population by measuring third-grade literacy levels. And to some
    that may sound “truthy,” but no state does that.


    We see the same thing with online books that misattribute facts to the wrong person.
    We know that it finds its way to book publishing because now you can do self-publishing.
    They’re sold on Amazon. Publishers are getting desperate for increasing revenue
    because book sales have slumped. They’ve been picking back up again, but they
    declined for a while. When you see an economic weakness, such as slumping book
    sales, and you want to turn that around, you’re maybe prone to publishing things
    people want to hear rather than the truth.


    We just had a controversy like this in our libraries only a couple of years ago.
    There was a famous doctor who Oprah had had on her show. He wrote a book about
    holistic medicine. It turned out that several of his cures for various diseases
    were dangerous. So even libraries were duped and had to take the work off of their
    nonfiction shelves. He could have been put in jail. But you can still look up
    the cures in that book, and you could find copies of passages online, and it would
    seem to validate him. There’s another one about bleaching. A bunch of people believes
    that you can cure autism with bleach because they believe autism is a microbial
    disease, not a neurological disorder. It’s dangerous and an ongoing issue.


    Right now, most people using the internet have some experience of life before
    the internet, or they’re young enough that they’re not basing major life decisions
    on what they learn on it. But in ten years, a large portion of the population
    is going to have grown up knowing only the internet as its only research tool.
    How are these folks going to be able to navigate just the amount of lies, propaganda,
    and bad advice that’s out there? There’s no way for them to understand how to
    go back and vet that information because they’re going to have no experience of
    a world where it didn’t exist.


    Q: Before you transitioned into political consulting, you were an administrative
    librarian. How did those experiences as a public servant influence your future
    endeavors? What kind of guidance would you give to a young person considering
    a career in either library or political science?


    A: I started as an elementary school librarian, which is hands down the best job
    in the entire world. That experience as an elementary school librarian is what
    guided my work in Sunnyvale, and Atherton, East Palo Alto, and elsewhere. Because
    I had that direct connection with those students, I saw the impact of reading
    on their lives from day-to-day. I saw them interact with books that were challenging
    and far beyond their reading level.


    I had second and third graders reading the Harry Potter books, which is just amazing.
    If a second grader can get through the first book of Harry Potter, they’re just
    going to read everything after that. It gave you confidence as a reader. Harry
    Potter was such a phenomenon that everybody was reading it, and you were only
    cool if you were reading it. It became this weird thing where it was uncool only
    to have watched the movies. You had to have read the books if you wanted to say
    you were a Harry Potter fan. So, kids were engaged in reading. Watching that transformation
    is what has guided me. My goal is to provide access to skills that can drastically
    improve the quality of these children’s lives as they get older.


    We just did a big research paper on crime statistics and library funding. Communities
    that spend more on library funding, literacy, and education have a lower crime
    rate and a much higher economic success rate. Those are economically viable communities.
    Some reports have come out that show libraries are one of the public expenditures
    that lead to a better quality of life and a happier life in those communities.
    Just enjoying seeing that happen firsthand is absolutely why a career in the library
    science field might be rewarding for you.


    Q: And what about the political side of that equation?


    A: One of the things that we had at one of my libraries in East Palo Alto was
    an after-school program called Quest that kids struggling with literacy could
    enroll in. If you know the background behind East Palo Alto, it was a tough neighborhood.
    It’s the city that “Dangerous Minds” is about.


    Well, when I first took my job there, they were putting window tinting on my office
    window, and I asked them why. Does the sun come up over there or something? They
    said no, it’s bulletproof. That’s the environment that I walked into. But at this
    school, at the Quest program, this second grader came in. He was refusing to read.
    He didn’t have a male role model at home. His mother worked two jobs. His father
    was incarcerated. His brother had been killed by gang violence. He was failing
    out of second grade.


    So, he got enrolled in Quest. We taught him the sight words is, and, or, the,
    that. Once he picked those up, he became a very confident reader. It’s a magical
    shortcut to reading for a lot of these kids. Once they’ve identified these words,
    reading becomes more manageable, and the challenging words feel less demanding.'
