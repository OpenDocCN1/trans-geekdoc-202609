    He wound up reading through all of our historical fiction books, through second,
    third, fourth grade. Then he got into our historical nonfiction books and read
    through all those. He came back as a tutor in high school, wound up getting a
    scholarship, and a history degree at Stanford. Witnessing that kind of impact
    on his life is what drove me to political science and action. Also, during the
    recession, when I had to lay off half my staff and cut our library hours, I learned
    that library funding is entirely political. Ninety-eight percent of library funding
    across the country is political. Only two percent are philanthropic grants and
    small donations.


    So that’s what led to me becoming involved in politics. And I would say don’t
    do it unless you’re utterly passionate about it. This is work that will burn you
    out fast unless you care, and you’re in it for the long term.


    # Chapter 17


    ## Strengthening Protection and Embracing Connections


    Douglas C. Williams, CEO, Williams Data


    **Topics:** Business Continuity, Civic Responsibility


    > “The future belongs to the fleet of foot. So, guess what, those with a fixed
    mindset will be passed over by those with a growth mindset.”


    > Doug Williams


    Douglas C. Williams is CEO of Williams Data Management and Chairman of the Board
    for the Vernon Chamber of Commerce. He has over 30 years of experience helping
    Fortune 500 clients with their document storage, destruction, and data security
    needs. He earned his bachelor’s in broadcast communications from San Francisco
    State University.


    **Q:** Doug, your family has been involved in the data management business for
    the better part of a century, and you’ve seen a lot of players come and go. How
    do small businesses like Williams remain resilient in the disruptive world of
    digital transformation, and what should executives be thinking about in terms
    of their long-term information management strategies?


    **A:** Commercial records management, the holistic approach at 30,000 feet includes
    the digital component, as well as the legacy hard copy component. Our transition
    in the early 1980s into the commercial records center business from industrial
    freight warehousing and distribution witnessed similar disruptions. Those disruptions
    had mostly to do with the shift to the service economy from the industrial and
    manufacturing economies. Our client base includes enterprise size businesses as
    well as small and medium-sized businesses.


    Executives in charge of information assets need to recognize the holistic scope
    of those information assets, whether they are structured or unstructured, and
    apply the information governance and regulatory guidelines to each equally. Knowing
    that digital technologies will change at light-speed, CEOs and their executive
    teams need to be knowledgeable and ready for changes in forensic discovery and
    see the impact of retention milestones for each type of information asset. We
    all know that text messages, email, and all social media posts have a permanent
    residency somewhere. Every business, large or small, has to accept a contingent
    liability regarding them. They need to recognize the action of maintaining a strict
    policy regarding their information management policies, irrespective of the resident
    media.


    **Q:** You were interviewed by Adam Burroughs of Smart Business Los Angeles and
    highlighted a growing alarm over data breaches. Here we are just a few years later,
    and data protection is a daily news flash. Do you still feel the majority of organizations
    are taking security and privacy for granted, or are you now starting to see a
    trend toward proactive management of data?


    **A:** I do. They are taking for granted, it won’t happen to them, and if it does,
    they are insured. But guess what, that is delusional. Again, a proactive plan
    requires a holistic approach to information management. The IT department knows
    how to protect the data, but typically do not know the why, like what are the
    governing rules for each type of data. That is the province of the `CIO` or the
    Director of Information Governance, or the General Counsel if an enterprise-size
    firm.


    The breaches in the headlines are preventable; however, because of human errors
    in social media, emails, texts, data sharing, lack of encryption, and the like,
    entryways into personal information data sets are vulnerable. In our case at Williams
    Data Management, because we are social media users, we installed front end data
    intrusion software, pioneered and patented by Oasis Technologies, known as `TITAN`,
    which blocks over half-a-million intrusions attempts per week from getting into
    our networks.


    Firewalls help, but `TITAN`’s magic has been ‘swatting away’ the attempts for
    over 30 years. Proactive, yes. Ongoing, yes. The recognition by executives that
    they hold personally identifiable information (`PII`) is step one in creating
    an `IG` plan to protect an organization from data breaches. Then the next step
    is to assess the business vulnerabilities and create a system that enables a security
    culture. Our firm has partnered with CSR Professional Services, Inc., which provides
    our clients with a suite of data breach tools enabling business continuity readiness
    and breach notification services in all 50 states, and in the EU as well.


    **Q:** You embarked on some big community and public service projects by taking
    the helm at the Vernon Chamber of Commerce. How has your experience in the private
    sector prepared you for developing and influencing public-private partnerships,
    and what do you see as the most defining aspect of those types of engagements?


    **A:** Yes, it is my personal goal at Vernon Chamber of Commerce to enable business
    and government, working together, to create growth mindsets. The future belongs
    to the fleet of foot. So, guess what, those with a fixed mindset will be passed
    over by those with a growth mindset. For example, the `21^(st)` century, now nearly
    20 percent over, is for the information economy. It’s for using data, software,
    and robotics for manufacturing and distribution. It is no longer a labor vs. capital
    economy. It is a labor vs. technology economy.


    In my opinion, and it is happening now, government entities using taxpayer dollars
    should either fund economically feasible growth mindset manufacturing projects
    in California or lower the taxes of growth mindset businesses, so they have the
    funds to do these projects themselves. Either way, the beneficiary population
    will win. Private sector leaders know projects must be profitable. Elected leaders
    must recognize the same thing. A public-private project must be profitable and
    self-sustaining, to enable the public to trust they’ll earn a return on the capital
    spend. The era of never-ending funding of boondoggle “bridge to nowhere” projects
    is over. The Vernon Chamber of Commerce has embraced a growth mindset, and that
    is why I decided to lead it.


    **Q:** For years, you’ve chaired an annual breakfast to support goodwill efforts
    in Israel and across the Middle East. You started this as a small gathering, and
    it has grown into one of the Jewish National Fund’s biggest events. Why is corporate
    social responsibility so cardinal to you, and how has that awareness changed the
    way you approach running your business?

