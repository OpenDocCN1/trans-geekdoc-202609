    \ \n**Topics**: Internet of Things, Compliance\n\n> “Companies need to recognize\
    \ that we are at an inflection point in terms of IoT and data and begin to reframe\
    \ their overarching governance strategies.”\n> — Priya Keshav\n\nPriya Keshav\
    \ is the founder and CEO of Meru Data, a software company that provides corporate\
    \ information governance solutions. Before developing her own patented products,\
    \ she led KPMG’s Forensic Technology Services Practice in the Southwest United\
    \ States. She graduated from the Warrington College of Business Administration\
    \ and received her MBA from the University of Florida.\n\n### Q: Priya, you’ve\
    \ written extensively regarding complex ethical issues born out of the mostly\
    \ unregulated Internet of Things (IoT) industry. Is there a universal awareness\
    \ of IoT’s potential risks yet or even an understanding of how to begin addressing\
    \ its challenges?\n\n### A: I think there is universal recognition that the use\
    \ of `IoT` is certainly introducing novel challenges and ethical questions. However,\
    \ I would not consider there is universal awareness or understanding of its risks\
    \ at this point. The use and adoption of `IoT` are rapidly increasing, the solutions\
    \ being developed are integrating multiple industries, and yet we are just scratching\
    \ the surface of what is possible. So, I think we are at a point today where we\
    \ recognize those challenges are going to arise, but I do not believe we have\
    \ fully understood the nature nor extent of them.\n\nIndustry players and regulators\
    \ are likely at the same crossroads and thinking about appropriate frameworks\
    \ for addressing possibilities and threats. I don’t believe regulatory pressures\
    \ from either Europe or the US are yet the primary drivers for the growing awareness.\
    \ But yes, there are regulatory interests that have the industry taking notice.\
    \ However, there are very few specific regulations, such as California bill `SB327`,\
    \ which deal with information privacy and connected `IoT` devices. Regulatory\
    \ efforts around `IoT` have been guideline focused, and agencies like the Consumer\
    \ Products Safety Commission and the Federal Trade Commission are getting involved.\n\
    \n### Q: With your Meru Data platform, you’ve strived to develop a workflow and\
    \ reporting tool that manages data governance for clients based on best practices\
    \ as opposed to specific regulatory directives. Is that strategy feasible given\
    \ the often rigid, prescriptive requirements in rules like the General Data Protection\
    \ Requirement (GDPR)?\n\n### A: Yes, because at Meru, we have focused on developing\
    \ software that can sustain data governance programs. That’s the reason we have\
    \ taken a fundamental approach to creating solutions that are not solely aimed\
    \ at specific regulatory initiatives. It would be harder to maintain tools that\
    \ are focused on just addressing a few specific regulations. We believe it makes\
    \ more sense to ensure instead that the organization can harness data as an asset\
    \ effectively. We think with effective governance in place, complying with regulations\
    \ becomes easier by design and doesn’t place additional technical burdens on organizations.\n"
  trans: "\n\n### A：令人惊讶的是，某些优先级的确定并非理性得出的，而是通过经验和直觉获得的。在现代方法中，信息管理者需要假设在复杂系统中，预测和优先级排序几乎是不可能的；信息管理者需要接受更大的不确定性和模糊性。基于此，现代信息管理者需要依靠对局的直觉感受，并信任他们及他人为职业带来的特质、创造力和能力。这本质上是一场“舞蹈”，但是由“爵士艺术家们”创造的，他们直觉地信任彼此的能力和技能，从而产生比他们个人才华总和更高的价值。\n\
    \n### Q：国际刑事法院有一个动态的公众门户网站，大量且敏感的法院文件在其中被索引、脱敏，并在获得授权后向公众开放搜索。这一强大的工具是如何影响人们与法院的互动的，它是否有助于提高人们对其使命的认识？\n\
    \n### A：是的，法院意识到它需要调整其在线形象呈现方式，确保现代化能够反映其作为顶尖司法组织的地位。这一观点得到了项目启动前咨询的员工和外部利益相关者的广泛支持。法院的数字环境在不断演变，随之演变的是其在线业务模式以及终端用户的预期。特别是，社交网络和移动访问方面需要快速进展。法院对其网络呈现进行了一场广泛且持续的转型，涵盖了所使用的工具、法院如何向所有受众展示自身并与其互动，以及这些信息如何被管理和监控。\n\
    \n初始开发阶段对我们的网络呈现采用了不同的哲学和方法。结果是对法院内容进行了简化且重点的展示。然而，鉴于信息量的不断增加，以及支持现有服务和团队所需的定制化程度，后来的转型变得更具挑战性。\n\
    \n### Q：在 1983 年 ARPANET（阿帕网）诞生之前，整个信息管理社区由全球范围内规模较小的图书馆员、档案管理员和博物馆馆员组成。在短短几十年里，互联网从根本上改变了我们访问、目录化和语境化事实并最终处理知识的方式。确保语境和叙事不再是普特曼编辑或美联社的角色。当真理以及记录本身的完整性可以为了政治、个人或其他不当目的而轻易被操纵时，这种“数据的民主化”是否影响了我们作为社会辨别真理的能力？\n\
    \n### A：我们所有的信息管理者都成为数据信息系统的一部分（正如今天现代（数字）网络中所所示），这种观念并非完全新鲜。今天，信息管理者不再是外部且中立的，而是通过摄取和传播的行为成为了信息生态的一部分。这对于原生数字世界中信息管理者的角色和责任也具有巨大影响。\n\
    \n困境在于，问责过程纠缠在复杂性之中。随着信息管理者越来越多地了解民主化数据，数据层面的事件似乎越来越不仅不可预测，而且其复杂性远比以前任何想象的都要复杂出无限倍。一个位置对数据的操作往往对另一个看似互不关联的数据组产生显著且意料之外的影响。因此，信息问责的一个关键方面是承认：每一个操作都可能产生意想不到的奇异的后果。在实践中，这意味着任何既定政策决策或行动的结果并不像以前所认为的那样可预测：确保免受病毒并不并不意味着安全，旨在管理保护的政策可能会在其他领域（如数据完整性和溯源）引发危机。\n\
    \n为了应对这种数据困境，我建议信息管理者培养看到全局的能力，看到其即时仓库之外的内容。正如微数据包之间的关系是对称平衡的一样，信息管理者与数据源之间的关系应该经过细致的平衡，任何一方都不应对另一方持有过权力。\n\
    \n# 第四章\n\n## 建立维持物联网海啸的框架\n\n**Priya Keshav**，Meru Data 创始人兼首席执行官  \n**主题**：物联网，合规\n\
    \n> “公司需要意识到，我们在物联网和数据方面正处于一个转折点，并开始重构它们的整体治理策略。”\n> — Priya Keshav\n\nPriya Keshav\
    \ 是 Meru Data 的创始人兼首席执行官，这是一家提供企业信息治理解决方案的软件公司。在开发自己的专利产品之前，她曾担任毕政在美国西南部的法务技术服务部门负责人。她毕业于华灵顿工商管理学院，并在佛罗里达大学获得\
    \ MBA 学位。\n\n### Q：Priya，你对由于大部分缺乏监管的物联网（IoT）行业而产生的复杂伦理问题写过大量文章。目前是否对物联网的潜在风险有普遍的认识，甚至对如何开始应对这些挑战有理解？\n\
    \n### A：我认为存在普遍的共识，即使用 `IoT` 确实带来了新的挑战和伦理问题。然而，我不认为目前对其风险有普遍的认识或理解。`IoT` 的使用和采用正在迅速增加，正在开发的解决方案正在整合多个行业，而我们还仅仅触及了可能性的表面。所以，我认为我们今天正处于这样一个时间点：我们意识到这些挑战将会出现，但我认为我们还没有完全理解它们的本质或程度。\n\
    \n行业从业者和监管机构可能正处于共同的十字路口，思考着应对各种可能性和威胁的适当框架。我不认为来自欧洲或美国的监管压力尚未是意识日益提高的主要驱动力。但是的，确实有监管利益引起了业内的关注。然而，具体的法规很少，例如加利福尼亚比的\
    \ `SB327` 法案，它们涉及信息隐私和连接的 `IoT` 设备。围绕 `IoT` 的监管努力侧重于指导方针，消费者产品安全委员会和联邦贸易委员会等机构也正在参与其中。\n\
    \n### Q：通过你的 Meru Data 平台，你努力开发一种工作流和报告工具，根据最佳实践而非特定的监管指令为客户管理数据治理。考虑到像《通用数据保护条例》（GDPR）等规则中通常具有僵化、指令性的要求，这种策略是行的吗？\n\
    \n### A：可以的，因为在 Meru，我们专注于开发能够维持数据治理计划的软件。这就是为什么我们采取了基础的方法来创建解决方案，而不仅仅针对特定的监管倡议。维护仅针对解决少数特定法规的工具会更加困难。我们认为，更好的做法是确保组织能够有效地利用数据作为资产。我们认为，在有有效的治理下，合规监管将从设计上就变得更容易，并且不会给组织带来额外的技术负担。\n\
    \n"
