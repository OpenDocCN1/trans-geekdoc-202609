  trans: '


    内化战略目标有助于公司从长期来看准备并应对不断变化的规则。这就是为什么我们的产品设计旨在帮助组织内部开发和维护（例如）一个长久有效的数据地图。我们还帮助客户确保，即使在进行各种短期工作（例如数据清理练习）时，管理数据的长期计划仍是他们的重点。


    ### 问：在准备您在彭博社的一篇文章中提到的即将到来的“数据海啸”，您建议公司重新审视其现有的合规框架。组织是否需要因为物联网（IoT）而重新思考其整个策略，还是只需要调整现有的指南和协议？


    ### 答：嗯，数据海啸已经来临，每天产生的数据量约为 2.5 艾亿（quintillion）字节。这包含了目前消费者数据隐私法规监管范围的信息类型。然而，与未来物联网设备将产生的信息类型和数据量相比，这场海啸将显得黯然无味。随着物联网设备在消费者的生活中无处不在，我们目前面临的数据问题相比之下几乎显得微不足道。公司需要意识到，我们正处于物联网和数据的转折点，并开始重新构建它们的整体治理策略。不采取此的公司将处于竞争劣势，无法将数据作为资产，并在应对消费者数据保护的监管压力方面陷入不断的斗争中。


    组织是否以及如何重新思考其现有的指南和协议，这取决于组织目前所处的阶段。不同组织的信息治理计划成熟度跨度很大。虽然有些公司理解 `IG` 的重要性，并正处于构建全面
    `IG` 计划的良好道路上，但许多公司仍处于初始阶段。虽然大多数公司都在“做某些事情”，但在从真正的信息治理计划中受益方面，他们仅仅触及了表面。几乎所有组织都针对减少存储负担等几个立刻可实现的目标。大多数公司还意识到，为他们的计划建立利益相关者的支持以使其具有可持续性至关重要。然而，公司仍有大量机会定位其治理工作，以便在物联网驱动的未来取得成功。物联网的需求可能会为组织提供动力，使其以未来为视角来构建其基础设施。


    建立一个关于组织内部如何创建、使用和存储数据的良好、基础性的方法是首要的。有了强大的基础，没有必要完全重新思考框架以纳入物联网。`IG` 的基本原则在物联网驱动的世界中仍然适用。然而，理解物联网数据的性质、它能为公司增加的价值，以及公司如果准备不足时可能带来的挑战，也同样重要。我提到的指南和标准中讨论了这些某些方面，专业人士应该关注这些指南的演变。例如，`NIST`
    关于物联网网络安全标准的草案讨论强调，公司可能需要为以下物联网设备的情况做准备：


    * 设备可能不像传统的 IT 资产那样被访问或监控。

    * 可能会改变物理世界，从而可能影响人身安全或对设备和设施造成损坏。

    * 具有不同的寿命预期，并可能有无法维护的硬件。

    * 具有异构所有权。公司可能无法维护所有设备的完整清单，并且可能对设备的访问受到限制。


    这些问题将使制定适用于所有物联网设备的通用建议或最佳实践变得具有挑战性。组织需要根据设备的具体用途来理解风险，并相应地调整其政策和流程。另一个需要记住的是，管理其中一些设备的安全和隐私风险可能会影响其他类型的风险，或者在另一个领域引入新的利益点。风险需要从整体上理解和处理。


    ### 问：您花了近十年时间领导毕马威（KPMG）最好的法证技术服务小组之一。在那个职位上您学到了哪些见解，这些见解对指导和启发您的创业活动有所帮助？


    ### 答：我看到公司通过能够将数据作为资产进行管理而获得了显著收益。如果做得恰当，公司将获得巨大的竞争优势，并提高消费者的信心和忠诚度。我也看到，当公司经历危机时，为了应对监管或法律对数据的需求而付出的成本是巨大的。主动准备并实施管理良好的
    `IG` 计划会产生巨大的影响。


    我看到看到 `IG` 计划如果过度依赖人工操作、如果难以跟踪进度，或者缺乏利益相关者的支持，将会陷入停滞。为了让计划持续下去，需要对进度有清晰的认识，并有一种持续的方法在成功的基础上不断进步而不增加投入。从文化角度上说，我认为
    `IG` 努力的停滞比完全不努力更糟糕。


    我们尝试在这些记录的经验的基础上为我们的客户提供可持续的模型。这种方法引起了许多公司的强烈共鸣，并帮助我们赢得了客户的认可。使公司能够为在拥有更多数据的明天世界中成功进行定位，是我们解决方案的另一个主要支柱。简而言之，我们正试图让
    `IG` 具有可持续性，并鼓励和使公司开发适用于今天和未来的框架。


    ### 问：您是否有任何愿意分享的智慧之言，可能对考虑在 IG、数据治理或物联网领域发展的职业的年轻人或个人有所帮助？在这些不断演变的学科中从底层开始加入是否已经太晚了？


    ### 答：不，现在加入还不太晚！在这个领域有许多卓越的机会可以建立非常成功且令人满意的职业。我们处于大多数行业大规模数据驱动变革的边缘。不久后，各类型的专业人士将在不断变化的监管场景下，积极管理更大规模、更多类型的新类型数据。


    我们必须意识到，物联网每天都在改变我们自己的生活。我们的房屋、汽车、工作和生活与几年前相比，连接更加紧密和互联网化。锁、门门摄像头、语音助手、无人机、自动驾驶汽车、智能设备，凡是你能到的，这些在今天已经发生了了。作为终端用户，我们处于完全理解为什么这些数据需要安全管理的立场。


    '
