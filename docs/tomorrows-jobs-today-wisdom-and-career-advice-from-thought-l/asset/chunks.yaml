    # 问题：在一个人们对自身行为的羞耻感有所减弱的世界里，这是否会从某种程度上影响普通大众对我们数据剥削的看法？


    答： 在我看来，我们进入了一个羞耻感较少的阶段，但其中很大一部分是可以接受的，我认为我们可能都能认同，也许在过去，我们对自己的性、自己的意见感到太羞耻了。能够自由地表达自己是一件好事。我想我还不确定我们正走向何何方，因为我在想，即使是
    50 年前，不戴帽子和手套就出门会被认为是不体面的的。我们必须小心，不要认为所发生的所有显露性的事情在某种绝对意义上都是错误的。


    可以肯定，这些是不同的。但是，不戴帽子和手套又算什么呢，贬低自己又算什么呢？我无疑一直是隐私道德化的坚决倡导者，并试图让人们在涉及到贬低自己时更加谨慎、更不愿披露信息。我经常以
    `Anthony Weiner` 为例，说他在公共生活中做得过头了，不仅泄露了个人信息，还在此过程中贬低了自己。我们确实想对这种情况采取预防措施。但如果这只是关于“我们以前去主日学校要戴白手套，而现在不了……”的问题，如果我们讨论的是这个，那么它并不重要。


    # 问题：你曾担任当地社区`长老教会`的长老。信仰或任何其他宗教价值观是否在你教育学生或以你的专业身份剖析隐私等伦理问题时发挥了作用或产生了影响？


    答：我认为，你成长背景或所信奉的宗教传统，即使不是显性的，也会潜移默化地影响你的建议以及你感到舒适的事。可以肯定，我曾试图挖掘自己的宗教传统，以寻找关于隐私问题的见解和指导。我甚至收集了《圣经》中的片段，展示了古代对身体披露和信息披露的担忧如何证明这些问题是多么古老。你可以在《旧约》和《新约》中发现一些精彩的内容，其中人们在为披露问题挣扎。


    同时，如果我的宗教传统教我男性优于女性、女性应该只被看而不被听到，我将讨厌看到这类规范在公法中被复制。我们不能让宗教传统直接决定我们认为应该治理一个多元开放社会的法律类型。但当然，作为一个个体，我们思考问题和价值观的方式会受到宗教背景的影响，我也是如此。


    # 问题：你在大学学习舞蹈，从`哈佛`毕业后从事法律工作，但最终决定将职业投入到高等教育、写作和咨询。是什么启发了你追求学术生涯？你认为哪些是持久的回报？


    答：我认为对阅读和对思想的热爱引导了我的职业生涯。阅读、写作、思想以及独立主导了我的选择。作为一名学者，我比许多员工要自由得多。我可以写我想写的的内容，思考我想思考的，并在大学内外进行教学，让人们参与到思想中。这些事情主导了我的选择。


    我曾喜欢当执业律师，但你必须思考并处理客户带给你的任何问题。你并不总是拥有选择关注主题的这种自由。那么当涉及到舞蹈或艺术等事物时，嗯，我热爱艺术，但我认为我一直对无法让写作和辩论成为这些活动的核心而感到有些沮丧。我认为我终究是一个用头脑的人，而不是用身体的人。


    # 第 9 章


    ## 发现意义的数据


    George Socha, Esq.，`Binder Dijker Otte` 执行董事


    主题：`eDiscovery`（电子取证），业务流程管理


    > “人们不断尝试寻找最有效的方法。”


    > George Socha, Esq. 现任 `Binder Dijker Otte` 的执行董事。他是电子取证领域的知名思想领袖。他在威斯康星大学麦迪逊分校获得政治学学士学位，在康奈尔大学获得法学位。他是
    `EDRM` 的联合创始人，并在杜克大学法学院演讲。


    # 问题：George，你和 Gelbmann，你们在 2005 年 5 月的第一次 `EDRM` 会议上建立了 `eDiscovery` 的框架。是什么启发了你们开发这一全面的工具？


    答：当我们收集信息并进行访谈时，对我们来说的关键动力是我们开始听到一个共同的主题。我们从那些电子取证服务商和软件提供者那里听到：“你们并不真正什么是电子取证。那是我们做的。所有那些声称做电子取证的人中，这完全不是`电子取证`。”我们从那些把大部分精力放在处理数据的人那里听到这句话。我们从那些托管数据的人那里听到。我们从那些审查数据的人那里听到。我们从那些托管数据的人那里听到。我们从那些托管数据的人那里听到。我们认为——嗯，不可能他们都是对的，因为他们提出的定义是冲突的！所以，我们问自己：“那里有任何可以描述这个的东西？”


    我们寻找四周，没有发现任何广泛接受的 `eDiscovery` 定义列出了主要的概念步骤。我们对自己说，既然外面找不到，让我们看看我们能不能拼凑出一个。我翻阅了我的通讯录。我们联系并邀请了大约
    35 个机构和人员参加了 2005 年 5 月的第一次 `EDRM` 会议。我们当时认为这最多只是一个为期一年的项目。我们将给出一个直接、务实的定义或一组定义，以及人们在进行电子取证时考虑的一些基本步骤。在当时，我们完全不知道多年后是否有人会关注我们的工作。


    # 问题：现在这个模型在`杜克大学`已经变成了一个机构和品牌。它是如何在那里落脚的？


    答：`Tom` 退休了，从我的角度来看，我觉得我作为 `EDRM` 的主要驱动者已经待得太久了。我也在考虑从个人执业转到另一个组织。所以，在这样的背景下，`Tom`
    和我决定为 `EDRM` 寻找一个新家。我们花了一段时间，但最终一位我们都非常熟悉的人向我们介绍了`杜克大学`的人。一旦我们与他们取得联系，事情进展得非常快。在
    2016 年夏天，`Tom` 和我将该项目交给了他们的法学院。


    # 问题：你认为 `EDRM` 对法律界最内在的处是什么？


    '
