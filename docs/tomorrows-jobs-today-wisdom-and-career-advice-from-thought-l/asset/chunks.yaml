  trans: '


    图书员正在帮助人们找到合适的网站来回答他们的问题，但同时也存在大量的服务。他们通过富有信息性和协作性的规划与公众保持紧密合作。例如，如果你想学习如何创办小企业，可以去图书馆。你可以参加他们的培训计划，或者访问他们的业务中心之一。你可以在那里找到许多关于创办小企业的信息，以及如何合规地处理各项事务的方法。因此，图书馆在社会中的角色并没有改变，改变的只是我们在图书馆内获取信息的方式。


    ## 数字鸿沟与连接性


    信息并非所有人都能触手可及。只有当你负担得起家庭上网费用，或者家里有智能手机或电脑的费用时，信息才是触手可及的。我们还面临通过主要 `ISPs` 的连接问题，这些公司在许多城市拥有垄断地位。在某些地区存在严重的连接问题，图书馆实际上是社区获取宽带互联网的唯一途径。在阿拉斯加，由于地理位置或地形的原因，连接问题极具挑战性，图书馆受到了负面影响。对于
    `Comcast` 或 `AT&T` 来说，向这些极小城镇铺设光纤网络并不划算，而图书馆往往是提供这项基本服务的唯一场所。


    ## 大数据与政治影响


    **Q：** 如今图书馆和教育机构究竟是如何利用大数据分析来在地方、州级和联邦级政治领域保持竞争力的？


    **A：** 在多数情况下，它们并没有这样做，这也是许多大问题之一。如果我们有更优质的数据，并能够以更有意义的方式使用大数据分析，我们就能更好地理解谁支持图书馆以及为什么支持。这种洞察力使我们理解如何与不同的人口群体进行交流。例如，我们该如何向保守派谈论图书馆？该如何向进步派谈论图书馆？我们拥有许多这类数据，但从未被有效地利用过。


    此外，这种选择还伴随着一些潜在问题。我能想到的最大问题是关于使用个人数据的隐私讨论。图书馆对隐私权持有坚决的支持。你知道的，如果你在图书馆借一本书，几乎没有人能查出你借了什么。


    **Q：** 我记得在起草《爱国者法案》期间进行过讨论，特别是关于政府是否应该有访问谁借阅了像《无政府主义者手册》之类的书籍的争议。你是认为这对于图书馆来说仍然是一个利益冲突吗？


    **A：** 是的，但这对我们意味着什么呢？这影响到我们营销自己的方式、使用和利用大数据的方式，以及我们如何保持竞争力。因为使用这些数据侵犯了隐私领域，对吧？如果我有足够关于某人的数据，能与他们就图书馆进行有意义的对话，那么取决于我获取这些数据的方式，可能会违反许多细微的隐私规则和标准。


    ## 隐私与追踪担忧


    图书馆不喜欢对读者保留任何数据。例如，最近出现过一个问题，`Lynda.com` 将平台卖给了图书馆。为了通过图书馆免费使用 `Lynda.com`（你凭图书馆卡即可访问所有培训内容和课程），你必须拥有一个
    `LinkedIn` 账号。而 `LinkedIn` 会追踪你访问了哪些 `Lynda` 课程。图书员对这种跟踪行为的发生感到不满。


    没有这种追踪选项意味着图书馆可以专注于服务。然而，当涉及到追踪时，就会产生摩擦。如果图书馆无法在不追踪用户的情况下提供服务，就会损害他们的使命。


    （注：输入中提供的剩余文本包含重复且碎片化的短语，已根据要求进行了精简以保持核心含义。）


    '
