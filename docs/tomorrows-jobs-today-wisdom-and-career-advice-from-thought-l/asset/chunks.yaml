- raw: "A: Surprisingly, some priorities are not arrived at rationally but via experience\
    \ and intuition. In the modern approach, the information manager needs to assume\
    \ that in complex systems, prediction and prioritization are nearly impossible;\
    \ the information manager accepts greater indeterminacy and ambiguity. In light\
    \ of this, the modern information manager needs to rely on intuitive feel for\
    \ situations, and trusts in the character, creativity, and abilities that they\
    \ and others bring to the profession. It is essentially a “dance” but created\
    \ by “jazz artists” that intuitively trust in each other’s abilities and skills\
    \ to produce something of higher value than the sum of their individual talents.\n\
    \nQ: The International Criminal Court has a dynamic public-facing portal where\
    \ voluminous and sensitive court documents are indexed, redacted, and made searchable\
    \ for the public once authorized. How has this robust tool affected people’s interactions\
    \ with the court, and has it helped raise awareness about its mission?\n\nA: Yes,\
    \ the court recognized that it needed to adapt its online presence, ensuring that\
    \ modernization reflected its status as a top judicial organization. This view\
    \ was widely supported by staff and external stakeholders consulted before the\
    \ start of the project. The digital environment of the Court is continuously evolving,\
    \ and with it the way it does business online and expectations of end-users. In\
    \ particular, progress needs to be rapid for social networking and mobile access.\
    \ A wide-ranging and sustained transformation of the Court’s web presence was\
    \ initiated, encompassing the tools used, how the Court presented itself to and\
    \ engaged with all audiences, and how this information was managed and monitored.\n\
    \nThe initial development phase utilized a different philosophy and approach to\
    \ our web presence. The result was a simplified and focused presentation of court\
    \ content. However, later transformations grew more challenging, given increasing\
    \ volumes of information and the degree of customization necessary to support\
    \ existing services and teams.\n\nQ: The entire information management community\
    \ before 1983, when ARPANET was born, consisted of a relatively small group of\
    \ librarians, archivists, and museum curators around the world. In just a few\
    \ decades, the internet has fundamentally altered the way we access, catalog,\
    \ and contextualize facts and ultimately process knowledge. Ensuring context and\
    \ narrative is no longer the role of a Putman editor or an associated press. Has\
    \ this “democratization of data” impacted our ability as a society to discern\
    \ truth, when truth and the very integrity of records can be so easily manipulated\
    \ for political, personal, or other nefarious reasons?\n\nA: The notion of all\
    \ of us information managers becoming a part of the data-information system, as\
    \ seen in modern (digital) networks today, is not entirely new. Today, the information\
    \ manager is no longer external and neutral, but through the act of ingestion\
    \ and dissemination becomes a part of the information ecosystem. It also has enormous\
    \ implications on the role and responsibilities of information managers in the\
    \ born-digital world.\n\nThe quandary is that the process of accountability is\
    \ entangled in complexity. As information managers come to understand more about\
    \ democratized data, it seems increasingly likely that events on a data level\
    \ are not only unpredictable but simply infinitely more complex than ever previously\
    \ imagined. The actions on data in one location often have a remarkable and unexpected\
    \ impact on another seemingly disconnected group of data. Because of this, one\
    \ key facet of information accountability recognizes that every action can have\
    \ unforeseen and exotic consequences. In practice, this means that the outcome\
    \ of any given policy decision or action is nowhere near as predictable as previously\
    \ supposed: ensuring protection from viruses does not necessarily bring security,\
    \ policies intended to manage protection can create crises in other areas, such\
    \ as data integrity and provenance.\n\nTo deal with this data dilemma, I would\
    \ propose that information managers develop the ability to see the whole, to see\
    \ beyond their immediate repository. Just as relationships between tiny data packets\
    \ are symmetrically balanced, so the relationship between information managers\
    \ and data sources should be meticulously balanced, with neither side holding\
    \ too much power over the other.\n\n[Chapter 4](#nav.xhtml#toc8)\n\n## [Establishing\
    \ a Framework to Sustain the IoT Tsunami](#nav.xhtml#toc8)\n\nPriya Keshav, Founder\
    \ and CEO, Meru Data  \n\nTopics : Internet of Things, Compliance\n\n> “Companies\
    \ need to recognize that we are at an inflection point in terms of IoT and data\
    \ and begin to reframe their overarching governance strategies.”  \n\n> Priya\
    \ Keshav\n\nPriya Keshav is the founder and CEO of Meru Data, a software company\
    \ that provides corporate information governance solutions. Before developing\
    \ her own patented products, she led KPMG’s Forensic Technology Services Practice\
    \ in the Southwest United States. She graduated from the Warrington College of\
    \ Business Administration and received her MBA from the University of Florida.\n\
    \nQ: Priya, you’ve written extensively regarding complex ethical issues born out\
    \ of the mostly unregulated Internet of Things (IoT) industry. Is there a universal\
    \ awareness of IoT’s potential risks yet or even an understanding of how to begin\
    \ addressing its challenges?\n\nA: I think there is universal recognition that\
    \ the use of IoT is certainly introducing novel challenges and ethical questions.\
    \ However, I would not consider there is universal awareness or understanding\
    \ of its risks at this point. The use and adoption of IoT are rapidly increasing,\
    \ the solutions being developed are integrating multiple industries, and yet we\
    \ are just scratching the surface of what is possible. So, I think we are at a\
    \ point today where we recognize those challenges are going to arise, but I do\
    \ not believe we have fully understood the nature nor extent of them.\n\nIndustry\
    \ players and regulators are likely at the same crossroads and thinking about\
    \ appropriate frameworks for addressing possibilities and threats. I don’t believe\
    \ regulatory pressures from either Europe or the US are yet the primary drivers\
    \ for the growing awareness. But yes, there are regulatory interests that have\
    \ the industry taking notice. However, there are very few specific regulations,\
    \ such as California bill SB327, which deal with information privacy and connected\
    \ IoT devices. Regulatory efforts around IoT have been guideline focused, and\
    \ agencies like the Consumer Products Safety Commission and the Federal Trade\
    \ Commission are getting involved.\n\nQ: With your Meru Data platform, you’ve\
    \ strived to develop a workflow and reporting tool that manages data governance\
    \ for clients based on best practices as opposed to specific regulatory directives.\
    \ Is that strategy feasible given the often rigid, prescriptive requirements in\
    \ rules like the General Data Protection Requirement (GDPR)?\n\nA: Yes, because\
    \ at Meru, we have focused on developing software that can sustain data governance\
    \ programs. That’s the reason we have taken a fundamental approach to creating\
    \ solutions that are not solely aimed at specific regulatory initiatives. It would\
    \ be harder to maintain tools that are focused on just addressing a few specific\
    \ regulations. We believe it makes more sense to ensure instead that the organization\
    \ can harness data as an asset effectively. We think with effective governance\
    \ in place, complying with regulations becomes easier by design and doesn’t place\
    \ additional technical burdens on organizations."
