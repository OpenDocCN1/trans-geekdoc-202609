- raw: 'A: The creation, and now the maintenance, of the EDRM diagram. That diagram,
    for the first time, provided a conceptual framework that people could use to break
    down the fundamental data discovery processes. They could break them down into
    manageable pieces and understand how the parts could better connect. It is meant
    to be a conceptual framework. We’ve adjusted it over the years. I think we are
    now on the seventh version. You can go to a page on the EDRM website and take
    a look at the prior versions and see the evolution. Since the original, we’ve
    added privacy, security, and risk components.


    Q: Law firms and corporate legal departments must leverage EDRM the most. But
    when did it go from an operational tool to something that courts started digesting
    and referencing?


    A: It’s not clear when that happened. I’m pretty sure the courts were not the
    first ones to notice and start paying attention to the EDRM diagram and framework.
    I think that the first ones to pay attention were the service and software providers,
    law firms, and corporate legal departments. Probably not long after that, it moved
    to individuals in various governmental institutions, and then somewhere along
    the way, the framework, even if not explicitly so, started to be brought to the
    attention of judges.


    When I say not explicitly so, what I mean is that attorneys arguing before them
    or submitting materials might never have said, “Here is the EDRM framework. Go
    to EDRM.net and see more.” But they were using the language. They were talking
    about identification, preservation, collection, each of the boxes, starting with
    identification and moving to the right on the diagram. Using a combination of
    those terms, in a way, made it clear that the EDRM framework was the basis for
    their understanding. It became the best mechanism to use to convey the concepts.
    I think they picked up on the terminology and the concepts behind the framework,
    well before any judge cited the EDRM framework.


    Q: You co-authored a paper with Saaya Shah entitled “Data Validation, Crucial
    Steps Towards Controlling and Understanding Your Data.” The goal of these strategies
    is to home in on “data that matters.” What are some of your observations about
    how these strategies have been leveraged in high profile investigations involving
    email and servers?


    A: One familiar example of that historically are limitations related to the volume
    of email. As a user, your PST file has limits on its size. There might be limits
    in the system in terms of how old an email message can be and can continue to
    live in your account. Because of those limits, email messages will flush out of
    the systems pretty regularly. Because of the limitations of technology, at least
    historically, there haven’t been many easy ways to categorize and retain messages
    based on content. Those capabilities weren’t usually there, and as a result, people
    who felt they had very good and legitimate reasons to keep those messages found
    workarounds. For example, sometimes, that meant saving copies of PST’s outside
    of a corporate system. People are constantly trying to figure out the most effective
    ways to get their jobs done. If they have technical barriers in front of them,
    sometimes they succumb to the enticement to circumvent those with unauthorized
    approaches.


    Q: A few years ago, I heard about companies saying they’d get rid of email entirely
    with new technologies like social media. How do you think that has worked out?


    A: It’s simple. On that front, what I have seen is that rarely have efforts to
    replace one technology, with another technology been all that successful. And
    using social media instead of email is a good example. Instead, what I’ve seen
    is that people don’t get rid of old systems so much as add to new ones. There
    are some exceptions. I think we probably see very few faxes these days, although
    faxes are commonly used in some narrow areas. For the most part, they’ve disappeared.
    Email is still very extensively used.


    What has happened is that email is not the only platform that folks use, and for
    some organizations, it’s no longer even the platform that gets the most traffic.
    I attended a conference a year or two ago with a presenter who said, “We took
    a look at our internal traffic, and now we’ve gotten more Slack messages back
    and forth than we do email messages internally.” They didn’t say anything about
    the volume of their communications with the outside world, which I suspect their
    email system still dominates.


    Q: You have jested that you were forced into the field of eDiscovery against your
    will following the deposition of an IT director. But do your own experiences as
    an attorney continue to inform your guidance as a consultant?


    A: I think that my experience as an attorney was and continues to be critical.
    I was a practicing lawyer, a litigator for 16 years. I want to say I was a trial
    lawyer, but I did not try enough cases ever to feel comfortable attaching that
    label to my name. And the most extended trial I participated in was four months.
    I did handle matters throughout their entire lifecycle. I drafted complaints,
    answers, prepared discovery requests, and responses — over ten thousand of them.
    I had to count them at one point, which is why I know that number. I took my share
    and defended my share of expert depositions. I worked on appeals at various levels.
    So, I got to see cases fully.


    I think today too few practicing attorneys and even fewer people in the electronic
    discovery space have had the advantage of that experience. As a result, we collectively
    spend far much more time and money on discovery activities than we should. And
    it’s because we don’t know when to stop. We don’t know when we have enough data
    because we haven’t been through that whole process. Adding that 16 years of experience
    has helped me better understand not just the extent of what potentially eDiscovery
    can do, but the value of appreciating the limits of what it should do.


    Q: Electronic records have made the discovery process very costly and prompted
    changes to the federal rules to limit expenses and scope. Do you think they’ve
    had any meaningful impact?


    A: Well, yes. However, there’s a lot packed into that. First of all, as far as
    I have been able to determine, there aren’t solid, reliable numbers available
    to back up any assertion there. What we do know is that the volume of data continues
    to expand enormously. We know that the volume of data available in litigation,
    pre-approved lawsuits, investigations, and the like is increasing. What we don’t
    know is what the impact of things like the changes in the rules have had on it.
    I suspect the increases in discoverable data are like a Ferrari surging forward,
    and the changes in the regulations and efforts along those lines are like the
    brakes in a homemade go-cart. The single set of changes that have had the most
    impact are those concerning proportionality and sanctions.


    Q: How do organizations use the emerging discipline of information governance
    to support their data strategies and projects?


    A: I think in the world of IG, it’s still a challenge. For a long-time, information
    governance was a practice, a methodology, an idea in search of a need. I can’t
    tell you how many efforts I witnessed, corporate efforts that failed. They couldn’t
    get funding because there was always something pressing. Whether it was taking
    the money to generate income or support a government investigation, to fight lawsuits,
    or for initiatives where you were forced to take some action, governance kept
    getting shoved to the back of the line.'
