- raw: 'A: The fourth amendment is an amazing provision that protects persons from
    a warrantless search and seizure. It was designed to protect peoples’ correspondence,
    letters, papers, as well as business documents from disclosure without a warrant.
    The idea of the government collecting or disclosing sensitive personal information
    about us was the same then as it is now. The fact that it’s much more efficient
    to collect information could be described as almost a legal technicality as opposed
    to a fundamental shift.


    I think that while the founding generation couldn’t imagine the fastest computers
    we all have on our wrists and our desktops today, they could understand entirely
    the idea that a person’s thoughts and conduct would be placed under government
    scrutiny. They could see that people would be punished by virtue of government
    taking advantage of access to documents never intended for them to see. So, I
    think they could very much appreciate the problem and why it’s so important that
    we do something to restore some sense of balance between the state and the individual.


    Q: Then, those amendments perhaps anticipated some of today’s challenges?


    A: Sure. Not in the abstract, but think of it in the concrete. If we go back to
    the 18th and 19th centuries, you will find some theorists speculating that someday
    there will be new inventions that will raise these types of issues. Warren and
    Brandeis talked specifically about new inventions and business methods. So, it’s
    never been far from the imagination of our legal minds that more opportunities
    would come through technology. They anticipated technologies that would do the
    kinds of things once only done with pen and paper, things that can now be done
    in cars and with computers. It’s a structurally identical problem. And so, while
    I do think our laws could be easily updated, including our constitutional laws,
    the constitutional principles are beautiful in part because fundamentally they
    do continue to apply even though times have changed quite a bit.


    Some of the constitutional languages we find in other countries around ideas like
    human dignity, which is now applied to privacy regulations, shows that, to some
    extent, very general constitutional language can be put to other purposes.


    Q: What region of the globe is the most lacking in privacy protections?


    A: I would not purport to answer that question or even the question of which region
    of the world is best. I think a lot of people would point to Europe and say, “Oh,
    the European Union is clearly ahead of the United States! Or Canada is ahead here
    or there.” To some extent the quality of privacy that people enjoy in a particular
    country is a function of their laws but also their customs and their mores, you
    know?


    Q: In a speech to the 40^(th) International Data Protection and Privacy Commissioners
    Conference, you posited that “Every person in every professional relationship,
    every financial transaction and every democratic institution thrives on trust.
    Openly embracing ethical standards and consistently living up to them remains
    the most reliable ways individuals and businesses can earn the respect upon which
    all else depends.” How do you facilitate trust, ethics, and morality in societies
    that have lost confidence in the authority of their institutions and have even
    begun to question their legitimacy?


    A: For me, trust has to be earned. It’s not something that can be demanded or
    pulled out of a drawer and handed over. Unfortunately, the more draconian and
    unreasonable state actors behave respecting people’s privacy, the less people
    will be able to generate the kind of trust that’s needed. And the more government
    or the business sector shows genuine regard and respect for peoples’ privacy in
    their actions, as well as in their word and policies, the more that trust will
    come into being.


    I think that people have to begin to act in ways that make trust possible. I have
    to act in ways that make trust possible by behaving respectfully towards my neighbors,
    my family members, and my colleagues at work, and they the same toward me. The
    businesses that we deal with have to act in ways that are suggestive of respect
    for their customers and their vendors. Up and down the chain. That’s what I think.
    There’s no magic formula, but I do think there’s some room for conversation for
    education in schools, in religious organizations, in NGOs, and policy bodies.
    There is room for conversations that enable people to find discourses about privacy,
    confidentiality, data protection that can be used when people demonstrate that
    they want to begin to talk together about the importance of respect for these
    standards.


    It’s surprising to me how often I’m asked to define privacy or define data protection.
    When we’re at the point where experts in the field have to be asked to give definitions
    of key concepts, we’re, of course, at a point where it’s going to be hard to have
    conversations that can develop trust around these ideas. That’s because people
    are not always even talking about the same thing. Or they don’t even know what
    to talk about under the rubric. We’re in the very early days of being able to
    generate trust around data protection, artificial intelligence, and the like because
    it’s just too new.


    Q: The technology is new, but the principles are almost ancient, aren’t they?


    A: Exactly. If we have clear conceptions about what we’re concerned about, whether
    its data protection or what we mean by artificial intelligence, then those ancient
    principles can be applied to new situations effectively.


    Q: Okay, but if we consider the idea respect is also a top-down issue, in terms
    of the influence of state actors and business leaders, isn’t there an impact of
    the ethical high ground being eroded over time? If those at the top of the pyramid
    are behaving in ways that diminish the value of trust, how is that even fixed
    or reversed?


    A: To some degree, the problems that we’re facing around data privacy are not
    the result of bad behavior, they’re the result of over-generalization or overuse
    of a small set of concerns as drivers of public policy. For example, if your job
    is national security, you might focus so much on that as a value that you don’t
    consider other values that might countermand national security, like respect for
    privacy or respect for individuals.


    A lot of policymakers ignore or undervalue privacy because they treat their interests
    or enterprise, whether it’s public health, national security, police safety, or
    efficient education, as having a certain set of goals, and they don’t see that
    there are meaningful competing priorities. They’re not bad actors. They’re just
    actors who are not focusing on the broader array of values that are pertinent
    to what they’re doing.


    If you’re a hospital, yes, you worry about the accuracy of medical records and
    the importance of biomedical research. Yet you can’t forget respect for dignity
    that would prevent you from human subject research abuses or privacy abuses. So,
    it’s about balancing priorities and values. I don’t agree that this is a question
    of bad actors versus good ones.


    There are some bad actors, of course. I do sometimes think in the corporate realm.
    Companies know that they are taking advantage of peoples’ information. They know
    that they’re violating reasonable expectations of privacy or expectations of privacy,
    which, if the consumer were aware of what was going on, might affect their purchasing
    decisions. Those are the bad actors for me. Actors who know there are privacy
    interests at stake that the public might not be aware of, and they need to be
    constrained. They must not be allowed to keep information away from consumers
    or to lie about the information given to the public. I think we can regulate against
    that to some extent, and we can use our criminal and civil liability system to
    address and perhaps deter some of that bad conduct.'
