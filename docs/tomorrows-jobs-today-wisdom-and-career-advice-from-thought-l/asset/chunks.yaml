- raw: "He wound up reading through all of our historical fiction books, through second,\
    \ third, fourth grade. Then he got into our historical nonfiction books and read\
    \ through all those. He came back as a tutor in high school, wound up getting\
    \ a scholarship, and a history degree at Stanford. Witnessing that kind of impact\
    \ on his life is what drove me to political science and action. Also, during the\
    \ recession, when I had to lay off half my staff and cut our library hours, I\
    \ learned that library funding is entirely political. Ninety-eight percent of\
    \ library funding across the country is political. Only two percent are philanthropic\
    \ grants and small donations.\n\nSo that’s what led to me becoming involved in\
    \ politics. And I would say don’t do it unless you’re utterly passionate about\
    \ it. This is work that will burn you out fast unless you care, and you’re in\
    \ it for the long term.\n\n[Chapter 17](#nav.xhtml#toc23)\n\n## [Strengthening\
    \ Protection and Embracing Connections](#nav.xhtml#toc23)\n\nDouglas C. Williams,\
    \ CEO, Williams Data  \n\nTopics: Business Continuity, Civic Responsibility\n\n\
    > “The future belongs to the fleet of foot. So, guess what, those with a fixed\
    \ mindset will be passed over by those with a growth mindset.”  \n\n> Doug Williams\n\
    \nDouglas C. Williams is CEO of Williams Data Management and Chairman of the Board\
    \ for the Vernon Chamber of Commerce. He has over 30 years of experience helping\
    \ Fortune 500 clients with their document storage, destruction, and data security\
    \ needs. He earned his bachelor’s in broadcast communications from San Francisco\
    \ State University.\n\nQ: Doug, your family has been involved in the data management\
    \ business for the better part of a century, and you’ve seen a lot of players\
    \ come and go. How do small businesses like Williams remain resilient in the disruptive\
