- raw: "We’re all aware that certain projects, those in which repetitive, mundane,\
    \ administrative, or technical work is required, are avoided like the plague by\
    \ line employees and management alike. It’s not as exciting as “What should we\
    \ do next with this ridiculous budget or patented technology?!” When a project\
    \ does happen to spark immediate interest and quickly garner executive support,\
    \ once it moves past the planning stages, it too can begin to feel like nobody\
    \ on the team wants to be bothered with the specific logistics. It ends up either\
    \ a shell of itself, on the chopping block, or just the back burner. This is especially\
    \ true in larger organizations where the majority of stakeholders are not incentivized\
    \ to profit from the idea or initiative’s success directly.\n\nSurprisingly, what\
    \ can blossom from these hellish projects are new, bold leaders, since these are\
    \ also opportunities for individuals willing to board the ship and chart the obstacle\
    \ course. These are the champions in life and work who drive initiatives forward\
    \ because they’re more interested in accomplishing something and learning new\
    \ skills than getting (or stealing) the credit. They are playing a long game,\
    \ and that’s how they outwit those who would short their own stock. Of course,\
    \ we all know individuals who have been elevated by less ethical means and have\
    \ gone on to lead companies, even governments! But there is no long-term professional\
    \ value for lifetime purveyors of immediate gratification.\n\nModern knowledge\
    \ workers expect to graduate into advanced roles and focus increasingly on delegation.\
    \ Yet a strictly hands-off attitude ultimately results in us easily falling out\
    \ of touch with basic business operations, over time making us seem unrelatable\
    \ and aloof to our co-workers and customers. We naively assume technology or corporate\
    \ bureaucracy will shoulder all the tedious processes we’re tasked with rather\
    \ than striving to understand its impact on our businesses and identifying room\
    \ for further efficiency.\n\nMasses of employees, especially those basking in\
    \ the spend-it-or-lose-it public sector, have grown comfortable with management\
    \ throwing money at a problem or bringing in consultants to clean up a mess instead\
    \ of tackling causation. As leaders and executives, we never want to take a step\
    \ backward and be viewed as unwilling to trust and delegate. Yet there is much\
    \ to be said for staying familiar with, remaining involved in, and practicing\
    \ the discipline in which you claim to have expertise.\n\nIn this Information\
    \ Age, we need to stay current with the problems our industry is facing, intimately,\
    \ so that our ideas remain fresh, so we can retool and modernize the principles\
    \ that have worked for us. Those principles and optics help get our teams to score\
    \ on goal posts that always seem to be moving.\n\n## The worst they can say is\
    \ no\n\nIf my 88-year-old mother ever had a LinkedIn profile, her headline would\
    \ read something like “Former ingenue, entrepreneur, dreamer, and the rest is\
    \ none of your business, my dear.” But to those who’ve had the privilege to know\
    \ her over the decades, her mantra has always been, quite emphatically, to treat\
    \ everybody with dignity. That was one of the main reasons she was receptive to\
    \ opportunity.\n\nShe began working from an early age and later helped my father\
    \ through chiropractic school by working long hours as a Hollywood extra during\
    \ the fifties and sixties. Though never seeking stardom, she knocked on enough\
    \ doors to get a lot of good work, saved some seed money, and established relationships\
    \ that would eventually transform her life. Mom leveraged her positive attitude\
    \ and tough shell to find opportunities, sell her strengths, and laugh off rejection.\
    \ “It’s no big deal,” she always told me as a kid when the chips were down and\
    \ she says the same thing to me now.\n\nMost importantly, and by example, Mom\
    \ taught me that you should never feel afraid to negotiate a deal because the\
    \ absolute worst “they,” a client, customer, or possible employer can say is…\
    \ no.\n\n## Seven windows of opportunity\n\nIn the next seven chapters, we demonstrate\
    \ how these lessons frame windows of opportunity opening up in fields like blockchain,\
    \ big data, IoT, and artificial intelligence. We begin with a journey to Zambia\
    \ to learn how distributed ledger technology is empowering impoverished communities\
    \ to demand visibility into supply chains and realize their potential. Next, a\
    \ renowned data scientist lays out some of the ethical challenges that AI has\
    \ left on our doorstep. Then we teleport to the Netherlands, where we discover\
    \ the strategy behind how information flows in the international court system.\
    \ We then zip back to the US to prepare for a data tsunami with a leading IoT\
    \ software developer. With that knowledge under our belt, we make our way to California\
    \ and sit down with a smart city CIO to see how new technologies are impacting\
    \ the public. We pick up from there and take an autonomous drive with a telematics\
    \ specialist from America’s largest insurer, before finally heading back to Africa\
    \ to witness opportunity in action. We’ll see you there!\n\n[Chapter 1](#nav.xhtml#toc5)\n\
    \n## [Blockchain for Common Good](#nav.xhtml#toc5)\n\nAshish Gadnis, Founder and\
    \ CEO, BanQu  \n\nTopics: Blockchain, Logistics, Upward Mobility\n\n> “Old economic\
    \ models have failed because they look at the ability to help people out of poverty\
    \ separate from enabling people in poverty to take part in the supply chain.”\
    \  \n\n> Ashish Gadnis\n\nAshish Gadnis is Chief Executive Officer of BanQu and\
    \ a recognized thought leader in the burgeoning blockchain community. He chairs\
    \ the Financial Inclusion Working Committee for the Wall Street Blockchain Alliance\
    \ and travels the world, explaining how this revolutionary new technology is transforming\
    \ the way we contemplate supply chain economics. He holds an MBA from the University\
    \ of Minnesota’s Carlson School of Management and graduated from the Global Leadership\
    \ and Public Policy program at the Harvard Kennedy School of Government.\n\nQ:\
    \ Ashish, we first learned about your life’s work at a conference exploring how\
    \ technology impacts the human condition. You shared the story of selling your\
    \ firm, Forward Hindsight, and soon after founding BanQu to fight extreme poverty\
    \ by leveraging blockchain. How did you choose this path?\n\nA: It was a means\
    \ to an end. I was born and raised in a slum in India 50 years ago. And I grew\
    \ up hating being poor. Pretty much all my life growing up, I was poor. When I\
    \ moved to the US and started building my life, and got my own deal and started\
    \ building Forward Hindsight, I always asked myself, “If somebody will buy this\
    \ thing, and if it all works out, I could walk away and try to help address the\
    \ extreme poverty situation in the world.” So, it wasn’t exactly like other entrepreneurs\
    \ who have that itch to do the next big thing.\n\nFor me, it was pretty organized.\
    \ I sold my company, and I just started volunteering in the Congo for a couple\
    \ of years and then had some experiences that forced me to reflect even further.\
    \ That’s when I realized I could volunteer for the rest of my life, or I could\
    \ actually start something like BanQu and make a dent in the universe. So, the\
    \ selling of my company was just a means to my end. I knew my calling was around\
    \ the corner, so I sold it and ultimately just walked away.\n\nQ: With BanQu,\
    \ people ensure their economic identity with an immutable record of their transactions\
    \ in a system benefiting the entire supply chain. How does the company go about\
    \ realizing those goals?"
