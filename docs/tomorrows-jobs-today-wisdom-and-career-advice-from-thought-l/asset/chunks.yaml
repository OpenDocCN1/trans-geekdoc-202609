  trans: '

    我们都意识到，某些需要重复性、平庸、行政或技术性的工作，被员工和管理层像躲避瘟疫一样避开。用这种荒谬的预算或技术来做什么并不令人兴奋！当一个项目确实引发了兴趣并迅速获得高层支持时，一旦它过了规划阶段，团队中的每个人都开始觉得不想被具体的事务困扰。结果要么是项目本身被搁置，要么是被边缘化了。这在大型组织中尤为常见，因为大多数利益相关者并没有动力直接从想法或倡议的成功中获益。


    令人惊讶的是，这些地狱般的工作可以开辟新的、大胆的领导者，因为这些愿意上船并克服障碍提供了机会。这些人是生活和工作中的冠军，因为他们更有兴趣成就某些事情，而不是获得（或窃取）功劳。他们玩的是长线游戏，这就是他们如何胜过那些错失机会的人的。当然，我们都认识那些通过较小手段获得提升并继续领导公司的人，但对于即时满足，并没有长期的职业价值。


    现代知识工人期待晋升到高级职位，并日益关注授权。然而，完全放手的态度最终导致我们与基础业务脱节，使我们与同事和客户疏远。我们天真地假设技术或官僚机构会承担我们负责的任务，而不是努力理解其对业务的影响并识别改进的空间。


    大量的员工，尤其是那些深陷贫困的人，已经习惯了管理层用钱解决问题，而不是请顾问来收拾局面。作为领导者和执行者，我们都不想后退，也不愿信任和授权。然而，对于熟悉、参与并实践你所声称的领域，还有许多可说的。


    在信息时代，我们需要紧跟行业面临的问题，保持我们的想法新颖，这样我们才能重新调整那些为我们服务的原则。这些原则帮助我们的团队在不断移动的目标上得分。


    ## 他们能说的最糟糕


    如果我 88 岁的母亲有 LinkedIn 个人资料，她的简介会写着：“前演员、创业者、梦想家，剩下的与我无关。”但对于几十年来一直认识她的人来说，她的格言一直非常坚定：要给予每个人尊严。这是她接受机会的主要原因之一。


    她从小就开始工作，后来在 50 年代和 60 年代通过担任好莱坞龙套来供养我的父亲。尽管从未追求成名，她敲开了许多门，获得了很多工作，积攒了一些启动资金，并建立了最终改变了她的关系。妈妈利用她积极的态度和韧性寻找机会，推销自己的专长，并对拒绝付笑。小时候遇到困难时，她总是告诉我：“没什么大不了，”现在她也对我这样做。


    最重要的是，通过榜样，妈妈教导你不应该害怕去交易，因为“他们”、客户或可能的雇主能说的最糟糕的话就是……不。


    ## 七个机会窗口


    在接下来的七章中，我们展示了这些教训如何在区块链、大数据、物联网和人工智能等领域开启机会窗口。我们首先从赞比亚之旅，学习分布式账本技术如何赋能贫困社区，要求供应链透明化并实现他们的潜力。接下来，一位著名科学家列出了
    AI 带到我们门口的一些伦理挑战。然后我们传送到荷兰，在那里我们发现了国际法院系统中信息流背后的策略。随后我们回到美国，与领先的物联网软件开发人员一起应对数据海啸。带着这些知识，我们来到加利福尼亚，与一位智慧城市的
    CIO 对坐，看看新技术如何影响公众。我们从那里开始，与美国最大的保险公司的远程技术专家一起进行自动驾驶之旅，最后回到非洲见证机会的行动。我们在那里见！


    ## 第一章


    ### 为了共同利益的区块链


    Ashish Gadnis，`BanQu` 创始人兼 CEO


    主题：`区块链`、`物流`、`社会流动`


    > “旧的经济模型失败了，因为他们将帮助人们摆离贫困与让贫困的人参与供应链分离开来来看。”


    > Ashish Gadnis


    Ashish Gadnis 是 `BanQu` 的首席执行官，也是新兴区块链社区公认的思想领袖。他担任华街区块链联盟金融包容工作委员会主席，环游世界解释这种革命性的新技术如何改变我们思考供应链经济的方式。他拥有明尼苏达大学卡尔森管理学院的
    MBA 学位，毕业于哈佛大学肯迪学院的全球领导与公共政策计划。


    **问：Ashish，我们最初在一个探索技术如何影响人类状况的会议上了解到你的事业。你分享了卖掉公司 `Forward Hindsight` 的故事，并很快创立了
    `BanQu` 利用区块链对抗极端贫困。你是如何选择这条道路的？**


    **答：这是一种达到目的的手段。50 年前，我在印度的一个贫民窟出生长大。我从小就讨厌贫穷。在成长的大部分时间里，我都是穷人。当我搬到美国开始建立生活，拥有自己的业务并开始建立
    `Forward Hindsight` 时，我总是问自己：“如果有人买这件东西，如果一切顺利，我就可以离开，尝试帮助解决世界上的极端贫困状况。”所以，这并不像其他那些渴望做下一件大事的创业者那样。**


    **对我来说，这发生得很有条理。我卖掉了公司，开始在刚果做了几年的志愿者，然后经历了一些迫使我进一步深层反思的经历。那时我意识到，我可以做一辈子的志愿者，也可以真正创立像
    `BanQu` 这样的事业，并在宇宙中留下印记。所以，卖掉公司只是我目的的手段。我知道我的使命就在眼前，所以我卖掉了它，并最终离开了。**

    '
