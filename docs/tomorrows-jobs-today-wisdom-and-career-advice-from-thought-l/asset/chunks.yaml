  trans: '


    # A: 我认为对于 AI 数据科学家，我给出的第一个建议是 `deep learning` 并不等同于深度理解。我知道大家对深度学习非常兴奋，但我认为我们必须超越它，去关注其他形式的学习和智能。深度学习的传统工作方式是基于你能从数据中提取出什么样的模式。这只是我们学习的一种方式，我们还通过其他方式进行学习。而对其他学习方式的投入还不够。所以，要持续学习。在符号层面进行学习。不仅从模式中学习，还要通过推理学习。我深信，在最高水平，即使是一些深度学习领域领先的研究人员也已经意识到了某些缺点，并试图解决这些问题。此外，作为一名
    AI 科学家，你需要保持开放的心态来接受不同的事物，以便在 AI 的创造中不断前进。这就是其中一条建议。


    对于想要进入行业的人来说，从业务角度来看，有一些你可以利用 AI 完成的简单事情，可以为你或你的业务带来巨大的投资回报，并促进职业增长。我们称之为使用“酷炫”的
    AI 来解决无聊的问题。我所说的无聊问题是指后台工作。对于大多数企业来说，有大量的发票和文本文档。人们只是在处理这些内容并提取信息。这是一个非常枯燥的任务，或者如果你喜欢的话，是一个无聊的任务。AI
    在这些领域可以提供很大帮助。它可以消除所有的苦差。服务经济中也留下了大量这类工作，AI 专业人士可以帮助消除它们。当然，消除这些苦差意味着你需要开始创造价值，而不仅仅是替代机械任务。但一旦你接受了这一挑战，我认为在这一领域有无限的机会开始尝试更有趣的事情。


    ## 引导信息流向


    Jones Lukose Ongalo 博士，国际刑事法院信息管理官


    **主题：** 数据治理


    > “我们现在生活在一个世界，一小部分信息就能改变地球上最强大组织和国家的经济。在这个世界里，紧密的敏感信息流可能会以数字形式泄露，并导致远离源头的人产生剧烈反应。”

    > — Jones Lukose Ongalo 博士


    Jones Lukose Ongalo 博士拥有 MBA 和计算机科学博士学位，是海牙刑事法院 `Court Pénale Internationale`
    的信息管理官。在过去的二十年里，他一直致力于开发和实施策略，为能源和公用事业领域的工程公司以及非洲、欧洲和美洲的司法机构实现运营效率和合规性。Jones 在海牙大学获得
    `MBA` 学位，并在赫瑞瓦特大学获得计算机科学 `Ph.D.`。


    **Q：** Ongalo 博士，你的工作和研究让你遍遍了世界各地，包括肯尼亚、卢旺达、博茨瓦纳、牙买加、英国以及现在的荷兰。你目前在国际刑事法院指导一项企业信息计划。在这么多不同的文化中，你遇到的最普遍的挑战是什么？它如何塑造了你对国际实体解决方案的想法？


    **A：** 我工作过一些数据无处不在但没有人引导其流向的组织。收集了大量信息，但没有人在引导其流向……（此处原文大量重复，已按要求处理翻译）。


    **Q:** 你是如何确定你的信息计划的优先级的？


    '
