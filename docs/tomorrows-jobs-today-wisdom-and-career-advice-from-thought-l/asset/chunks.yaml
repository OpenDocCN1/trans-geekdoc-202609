- raw: 'A: We are seeing the focus is on employee engagement and employee retention.
    There are a lot of strategies being built around this capability. For example,
    a lot of the data we look at, especially with the sub-four percent or so employment
    rate, is evidence that it’s tough now in this climate to find exceptional talent.
    What it comes down to is succession plans have to be built through an understanding
    of your organization by engaging your employees, and through that engagement process,
    companies learn the motivations of their staff, understand when big events happen,
    and how it affects certain departments. By understanding and gleaning information
    around that, they’re able to get in front of situations that may cause challenges
    to a succession plan.


    You’ll also hear quite a bit about employee analytics, and these systems are helping
    management understand trends and predict problems that may be prevented earlier.
    We use them ourselves, and also provide them to our clients. We believe, again,
    that it’s not only just about attracting talent. It’s often more critical these
    days to think about the employees that are already in the seat, and how you will
    retain them. That’s what we see as the decisive factor to a lot of employers.
    That factor is especially true in the tech world because there’s not just a battle
    for talent; there’s a war.


    The war is not only on understanding bigger, faster, stronger systems but also
    on culture. If you could understand that, it’s kind of like the old metaphor of
    bottling up lightening. If you could bottle that up and understand it, and then
    put the systems into place to watch the outliers, then you’re able to predict
    succession plans better. This strategy helps you predict when and where you may
    need help because you’re watching the data insights behind employee engagement.


    Q: What about the fact that some folks don’t expect to work at a place for 20
    or 30 years anymore? What are the drivers that keep people around nowadays besides
    compensation?


    A: Drivers can be a multitude of things. However, it comes down to timing. So,
    what we are looking at is where these individuals are in the trajectory of their
    careers. Are they just starting out, or are they five years in looking for promotion
    to climb the ladder? Are they ten years in, have kids? Knowing where they give
    you a better understanding of what their motivations are. When you know what their
    motivations are, it helps you with your planning and satisfying those needs. You
    must make sure to drive your decisions by understanding why that individual is
    motivated, and the way that they’re motivated, at that given time. A lot of companies
    are building structures around that idea, from wellness programs to empowering
    committee structures, to doing charity work.


    Q: There’s also a lot of talk about burnout. What do you think are the drivers
    for that?


    A: There’s a couple of pieces around burnout. The ones that we see a lot of the
    time is when companies have less of an idea around their vision. They change direction
    a lot. We’ve noticed it when there is no management to help communicate and assist
    with the change. That creates this kind of 8000 RPM running mode of all employees.
    It’s hamster-wheel running. It’s not running in a systematically scalable direction.
    More bureaucracy, red tape, not being able to get things done creates burnout
    as well.


    Q: Are you talking about a change in business strategy like a company redirecting
    its revenue stream or introducing a new business model?


    A: Yes, like a company going from on-prem to Cloud, that type of transformation.
    Or transforming a services company into a software company. Institutional transformation
    with a lack of planning, execution, and communication around the change is where
    we see a lot of burnout happen.


    Q: How has recruitment process outsourcing or RPO influenced the candidate selection
    process, and does it result in employees staying longer in a chosen position?


    A: I’m on the executive search side, but I know a lot about the recruitment process
    outsourcing side as well. The way that it influences the candidate selection process
    depends on how in-depth their RPO is. If they’re handling everything A to Z, RPO
    is beneficial from branding the website, running the back end, posting all the
    positions, and managing all the incoming candidates. It helps, but it comes down
    to making sure candidates have a good experience. That’s what we’ve noticed over
    time. It’s what the recruiting industry has unfortunately fallen short of at times.
    For example, have you ever had a recruiter call you and then not called you back
    after they said they would? That type of experience has an impact on an organization.


    To counter that, we run all the efficiencies so that every touchpoint is covered.
    So, our influence is mainly on experience. That’s what an RPO does. It’s about
    the authentic candidate experience. In our RPO clients, everyone gets a callback.
    The first candidate and second candidates are surveyed, along with the candidate
    that got the job and the manager. This strategy allows us to have continual process
    improvement.


    Does it result in an employee staying longer? When we use the engagement factor
    we talked about, it certainly does. When we have the recruitment process outsourcing,
    put into play, and then on top of that, we have engagement software that delights
    the employee. We’re able to have a seamless integration starting at onboarding.
    Also, as they are three months in, six months in, whatever cadence, you set up
    a regular check-in with that employee. When that happens, we’ve seen data to support
    the fact that placements are staying longer in a chosen position and seem happier.


    Q: We often overuse the maxim, “Do what you love,” which is easier said than done.
    Is there any career advice you’d have for a new college graduate, or a person
    between jobs, trying to find the right spot? For example, how long do you wait
    for the right gig?


    A: I work with SKEMA, S-K-E-M-A, which is an international business school at
    NC State. I go there through a couple of our programs that we run at the firm
    and speak to grad students. My advice to them is about understanding yourself
    first. If you can know your why, if you can understand why you do the things that
    you do, you’re moving in the right direction. Like the organizational consultant
    Simon Sinek says, people don’t buy what you do. They buy why you do it.


    I genuinely know I can affect change in someone’s career, and I take it very seriously.
    If they allow me to sit down and get to know them, not from just the skill set
    perspective, but truly an intangible aspect. What are their drivers? Is it a challenge?
    Is it money? Is it advancement? What are the things that drive them, given where
    they are in their current circumstances? If I can understand that, and if these
    individuals coming out of college can understand what’s important to them right
    now, then they’re better equipped to put themselves in the position to seize the
    right opportunity.


    Q: You’ve coached softball for Special Olympics now for a couple of decades. What
    has that organization and its athletes taught you about teamwork and success in
    general, that you might convey to somebody building their resume or their career?


    A: I’ve coached Special Olympics softball for 16 years, and I probably get way
    more out of it than they do. In essence, it’s teamwork. I have had to reteach
    my team, certain members of the team, certain skills every year. It teaches patience.
    We all learn comradery and love for one another. It’s not what it’s about whatsoever,
    but we got walloped all the time. I mean, we went seven years straight without
    winning a game, okay?'
