    Privacy by design and privacy by default will be significant concepts of the future
    information society. But in reality, people choose the lazy options, and we don’t
    invest serious efforts into the future of our information society. We leave this
    to science fiction authors and films, to CEOs of internet companies, and politicians.
    Privacy is not only about rights but obligations as well. These obligations tangle
    not only companies and public administrations. They apply to everybody of us,
    you and me.


    Everybody has to take care of his own data and to respect the data privacy of
    all others. We cannot claim any right of being forgotten when we actively upload
    our directory of addresses to a social platform. In my opinion, data privacy and
    privacy rights is primarily a task for education, which has to start even before
    school. It is a task for developing a mindset about the value and the risks of
    information. Data Privacy has to begin in our heads.


    **Q**: Predictive coding was introduced almost two decades ago, and while the
    technology has advanced, the barrier to adoption is still cost and complexity.
    Will advances in artificial intelligence and machine learning help make these
    tools accessible to smaller firms?


    **A**: First of all, we have crossed the magic border of `AI`. `AI` is now not
    only self-learning and self-optimizing but like evolution, self-replication, and
    self-expanding. An example is the “Neural Network Quine.” `AI` software is programming
    `AI` software, and `AI` software is managing `AI` environments controlled by `AI`
    administration tools. Machine learning will be standard in this new virtual world.
    This `AI` is different from our traditional perception of intelligence. It goes
    its own ways, inventing different methods, and is becoming transparent to human
    perception and intellect. It is here, waiting around the corner. We see a big
    war being fought by Amazon, Apple, Microsoft, Google, IBM, and others for the
    leadership role.


    Today, `AI` is even free for end-users or comes with consumer products. The longer
    it learns, the more sophisticated it will become. AI will become part of every
    piece of software. The future of IoT with billions of devices will only be manageable
    by AI. Yes, it will become part of every cloud offering and will reach smaller
    firms. The only delaying factor is legacy software, legacy management, legacy
    behavior, legacy business models.


    The overlapping, entailing, reverse-causing, accelerating innovation processes
    will encompass everybody. This is why I mentioned that our old ideas of information-driven
    society with well-informed citizens having control over information and machines
    would become overturned by dystopian models of a science fiction nature. Predictive
    analytics with artificial intelligence will play a role in our fight to keep control
    because software and systems will naturally anticipate what we will be doing better.
    Complete industries will change. First, those who deal with information only,
    like banks or insurances. Then manufacturing and others will follow.


    **Q**: Based on your years of experience as a practitioner, lecturer, and consultant,
    what sage advice can you offer to a young person just entering the field of information
    management and information technology?


    **A**: Well, education on information management is lagging behind the technology
    and information revolution. Learn to think by yourself, learn languages, learn
    how to communicate, learn methodologies, learn philosophy, learn to adopt change,
    learn not to stop learning throughout your life! Study something which is of real
    interest to you, what you love, which gives you intellectual satisfaction.


    # Marketing Moving Targets of the Digital Revolution


    Dux Raymond Sy, Chief Marketing Officer, AvePoint


    **Topics**: Digital Transformation, Cloud Computing


    > “The two main challenges in digital marketing are time scarcity and white noise
    which seem more pronounced in the enterprise IT space.”

    > Dux Raymond Sy


    Dux Raymond Sy is the Chief Marketing Officer of AvePoint and is responsible for
    driving business and digital transformation initiatives for commercial, educational,
    and public sector organizations across the globe. He’s also a Microsoft Regional
    Director and Most Valuable Professional and has authored numerous books, articles,
    and whitepapers on IT and business process strategy. He received his bachelor’s
    in telecommunications engineering from Southern Polytechnic University.


    **Q**: Dux, AvePoint specializes in leveraging the breadth of Microsoft technologies
    to help companies manage their cloud, on-premises, and hybrid environments. Some
    trends indicate at least a few enterprises have shifted back toward hybrid stacks
    after overextending themselves in the cloud. Will most enterprises eventually
    evolve from on-premises or hybrid infrastructures, or could factors such as data
    protection prevent total cloud adoption for some?


    **A**: When it comes to enterprise technology, we rarely move backward. The cloud’s
    cost, scale, efficiency access, and yes, even security advantages, are too desirable
    for on-premises or hybrid infrastructures to prevail long-term. What I will say
    is that the transformation will take much longer than the advertising of cloud
    providers would have you believe.


    Surprisingly, most organizations are still not all in on the cloud yet. We did
    a study a couple of years ago that showed about 70 percent of organizations were
    still in hybrid architectures. We also sponsored a study with the Association
    for Intelligent Information Management (AIIM) this year that showed one in three
    organizations is maintaining at least two versions of `SharePoint`. Attitudes
    towards the cloud have changed, but now the conversation has turned to how to
    get there rather than why. Lastly, there are capabilities that the cloud offers
    that cannot be delivered on-premises. Cloud-based advanced services, like machine
    learning, artificial intelligence, and data analytics, open new opportunities
    for technical teams to drive business value.


    **Q**: How is Infrastructure, Platform, and Software-as-a-Service changing the
    organizational hierarchy of IT departments, reporting structures, and collaborative
    teams? Are companies beginning to hire more administrators and get along with
    fewer developers, architects, and support staff? Where will the best IT jobs be
    in the next few years at the current pace?


    **A**: What we have found is that people and organizations evolve slower than
    technology. Right now, most organizations are just shifting on-premises roles
    to the cloud. So, if you were the `SharePoint` or the `Exchange` administrator,
    you are now the `SharePoint Online` or `Exchange Online` administrator. But what
    about applications that don’t exist on-premises? Who owns `PowerApps`? This strategy
    ignores the advanced workloads and connections between apps that exist in the
    cloud. What you do in `Microsoft Teams` impacts your `exchange` and vice versa.


    What organizations need, and we haven’t seen yet, are administrators that truly
    own the platform and look at platform-wide issues. If we see some of these issues
    just within `Office 365`, imagine what we will see as multi-cloud architectures
    become more popular. The best IT jobs in the next few years will be business enablers
    who have a love of learning. You will need to be agile in the era of tech intensity.


    **Q**: What are some of the challenges in marketing IT services and products in
    a rapidly shifting digital landscape, and exactly how does the Chief Marketing
    Officer role in an IT company differ from one tasked with promoting traditional
    goods and services?

