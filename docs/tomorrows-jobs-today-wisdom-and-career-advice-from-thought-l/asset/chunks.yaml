    \ abundant opportunities of the `Information Age`, folks of all skill levels continue\
    \ to struggle with the best approach to a happy and successful vocation. Business\
    \ models are transforming the job market so rapidly that even the most accomplished\
    \ executives and educated employees suffer from anxiety over the stability of\
    \ their roles. They must routinely prove their intrinsic value to their superiors\
    \ and define their `personal brand` within their organization. For new graduates\
    \ and those looking to make a big career transition, the reality of a continually\
    \ shifting corporate landscape can feel almost paralyzing. The emergence of impersonal\
    \ human resource tools like `artificial intelligence` in hiring practices has\
    \ compounded traditional fears underlying the search for our rightful place in\
    \ the new digital workplace.\n\nThere are plenty of recruiters, human resource\
    \ professionals, and resources like `The Future of Jobs Report` quoted in the\
    \ epigraph above that employ statistics and academic research to explain the modern\
    \ workforce. These factoids are interesting, but only those with practical, first-hand\
    \ experience can adequately convey the nuances of what it means to be and fulfill\
    \ the responsibilities of a `CIO`, `Blockchain Banker`, `Archivist`, or `Data\
    \ Scientist`. Profiles of today’s business leaders regularly serve up softball\
    \ interview questions that don’t help us fully understand the big why behind the\
    \ `how I got here` question. They rarely investigate how their subjects think\
    \ about specific issues impacting their chosen fields. This book reflects the\
    \ sobering perspectives of executives who sit on the firing line of board rooms\
    \ and who also know their way around a `server room`. These interviews enable\
    \ us to walk a mile in their shoes while exposing us to the exciting technology\
    \ trends responsible for creating the workforce demands we see emerging today.\n\
    \nHow do we discover where our contributions belong in this brave new world? How\
    \ do we discern what work we should train for and exactly where we should perform\
    \ it? What kinds of jobs are out there today, and what will they look like in\
    \ the near distant future for us? Will they be there tomorrow, or even by the\
    \ time you finish this book? Perhaps envisaging answers to these questions aren’t\
    \ so complicated at all. Maybe they’re right under our noses and spelled out on\
    \ the next few pages.\n\nIndeed, the reasons for today’s job anxiety and uncertainty\
    \ aren’t driven entirely by science fiction inspired fear of robots and automation.\
    \ Those may be fun hypotheticals with a certain truth to them. Our visceral worries\
    \ about our future job prospects are more aptly rooted in...\n"
