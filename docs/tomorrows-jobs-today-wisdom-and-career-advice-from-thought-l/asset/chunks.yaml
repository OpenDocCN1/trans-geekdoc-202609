- raw: "Privacy by design and privacy by default will be significant concepts of the\
    \ future information society. But in reality, people choose the lazy options,\
    \ and we don’t invest serious efforts into the future of our information society.\
    \ We leave this to science fiction authors and films, to CEOs of internet companies,\
    \ and politicians. Privacy is not only about rights but obligations as well. These\
    \ obligations tangle not only companies and public administrations. They apply\
    \ to everybody of us, you and me.\n\nEverybody has to take care of his own data\
    \ and to respect the data privacy of all others. We cannot claim any right of\
    \ being forgotten when we actively upload our directory of addresses to a social\
    \ platform. In my opinion, data privacy and privacy rights is primarily a task\
    \ for education, which has to start even before school. It is a task for developing\
    \ a mindset about the value and the risks of information. Data Privacy has to\
    \ begin in our heads.\n\nQ: Predictive coding was introduced almost two decades\
    \ ago, and while the technology has advanced, the barrier to adoption is still\
    \ cost and complexity. Will advances in artificial intelligence and machine learning\
    \ help make these tools accessible to smaller firms?\n\nA: First of all, we have\
    \ crossed the magic border of AI. AI is now not only self-learning and self-optimizing\
    \ but like evolution, self-replication, and self-expanding. An example is the\
    \ “Neural Network Quine.” AI software is programming AI software, and AI software\
    \ is managing AI environments controlled by AI administration tools. Machine learning\
    \ will be standard in this new virtual world. This AI is different from our traditional\
    \ perception of intelligence. It goes its own ways, inventing different methods,\
    \ and is becoming transparent to human perception and intellect. It is here, waiting\
    \ around the corner. We see a big war being fought by Amazon, Apple, Microsoft,\
    \ Google, IBM, and others for the leadership role.\n\nToday, AI is even free for\
    \ end-users or comes with consumer products. The longer it learns, the more sophisticated\
    \ it will become. AI will become part of every piece of software. The future of\
    \ IoT with billions of devices will only be manageable by AI. Yes, it will become\
    \ part of every cloud offering and will reach smaller firms. The only delaying\
    \ factor is legacy software, legacy management, legacy behavior, legacy business\
    \ models.\n\nThe overlapping, entailing, reverse-causing, accelerating innovation\
    \ processes will encompass everybody. This is why I mentioned that our old ideas\
    \ of information-driven society with well-informed citizens having control over\
    \ information and machines would become overturned by dystopian models of a science\
    \ fiction nature. Predictive analytics with artificial intelligence will play\
    \ a role in our fight to keep control because software and systems will naturally\
    \ anticipate what we will be doing better. Complete industries will change. First,\
    \ those who deal with information only, like banks or insurances. Then manufacturing\
    \ and others will follow.\n\nQ: Based on your years of experience as a practitioner,\
    \ lecturer, and consultant, what sage advice can you offer to a young person just\
