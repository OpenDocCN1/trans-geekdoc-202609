- raw: 'Once an obscure term, the concept has gained traction because, at this point
    in history, we’re all enduring an unnatural overlap between our personal and professional
    lives. Despite broad adoption, businesses are already learning that cultures blurring
    the line between work and home life often results in an encroachment that makes
    workforces less productive. It’s a trend obfuscated by the marketing and metrics
    waved in our faces by the fit-bit-digerati.


    The reality of work-life integration is made possible, and accessible to all,
    by the technological wonders that promote and accompany the Information Age. These
    offerings are marketed as must-have tools of convenience, advertised as essential
    life-hacks that, in many regards, even make us better people! In some instances,
    you literally cannot live without them.


    Yet contrary evidence is abundant, both statistical and devilishly anecdotal (in
    the case of the death-by-selfie) that proves how this total immersion in all things
    digital is hollowing us out emotionally and intellectually. We are no longer slaves
    to Pharaoh and relegated to pushing stones, but today we feel like we’re inching
    forward, restrained by invisible digital leashes, breaking up the leaps, bounds,
    and depths of our attention spans. Modern technological lifestyles even seem to
    polish away the rough and creative contours of our character. We are frequently
    robbed of our internal monologues and instead given social media profiles and
    hashtags, mere shadows of what we represent and mean to others.


    We needn’t run to an isolated cabin in the woods and pen a manifesto blaming innovation
    for all of our woes. We do need to draw clear battle lines with our favorite robots,
    lest we end up a mirror of them. It bears repeating. Less technology in our personal
    life equals more, long, meaningful breaths before we meet our maker.


    Work-life integration is dramatized in Cecil DeMille’s classic The Ten Commandments.
    Remember the famous scene where a worker is about to be trampled by a giant stone
    moved by “her colleagues.” Moses’ character, played by Charlton Heston, strides
    down from his managerial pedestal to save the poor soul, who later turns out is
    his mother! It’s a metaphor for how easily, regularly, and unfairly we put work
    before family, friends, and our well-being. And when work negatively impacts others,
    it is demonstrably immoral.


    I first learned about this 24/7 mindset by a CIO, who boasted, “Say I’m on a flight
    to Hawaii with my family for the weekend, and I’ve got to approve a purchase order
    for half-a-million. I can do it right here from my iPhone!” Well, that’s fitting,
    but it highlights the disconnect between those who have the world at their disposal
    and those who get interrupted with an email from their boss every weekend. The
    same technology fix that feeds the workaholic is now invading everyone’s space.
    It’s affecting their partner, their children, their social circle, people on the
    road. Do we want to subject ourselves to this type of digital bondage?


    Whether humanity is building Pyramids or iPads, imposed upon us or of our own
    making, an obsessive and aggressive approach to time-management will ultimately
    usurp what little personal, spontaneous, and family time we still have left. Does
    anybody living today hope for a gravestone that reads, “I wish I had worked, texted,
    emailed my customer more?”


    Ironically, this new digital bondage is reminiscent of the days when men and women
    of all ages built the Pyramids until they dropped dead. Sure, those grandiose
    sand tombs still stand as a testament to architecture and ingenuity, but they
    will also always represent a chapter in history when there was seldom a break
    from work. Luckily today, we have a choice.


    We must stand firmly behind the importance of rest and personal space. Sure, working
    remotely through technology has given us flexibility. There’s no denying that.
    But ideas like work-life integration have adversely impacted the very relationships
    and working-conditions they were meant to improve.


    In the Jewish faith, observers believe that the Sabbath, a day of rest, is a cornerstone
    of not just spiritual growth, but what ultimately may lead to success in other
    areas of one’s life. Most cultures share this value, but as it erodes across the
    globe in the modern era, and the lines between work and rest are worn away, we
    all suffer together. Create digital boundaries to separate work and life to free
    yourself from that digital bondage.


    ## Walk before you run


    Lastly, Less is More is also a business approach analogous to servant leadership,
    one that mentors by exemplifying measured discipline and a rational expectation
    setting for business partners, teams, and customers. It’s based on the understanding
    that we don’t want to overwhelm our already overwhelmed audience and peers. Our
    chosen cadence, especially in large, complex organizations, requires a nuanced
    understanding of company culture, its maturity level, and its appetite for change.
    Those considerations shape our strategies as we plan and adjust our change management
    plans and the technology strategies we select, or these days, select us. Ultimately
    our cadence will influence the footprint we hope to leave. How do we expect our
    message to get across if we don’t serve as its example? Do we want to race to
    the finish line like the hare or be deliberate in our strategic and cultural choices
    as we move forward like the tortoise?


    Company culture isn’t something we individually determine, but it’s a basic pillar
    we must build upon and may need to influence to nurture opportunities and get
    shared goals accomplished. A company that’s behind the curve on innovation, or
    has slipped a little off the tracks shouldn’t be treated as suffering from a deeply
    rooted cultural problem but rather perceived as one ripe for change. How we respond
    to inefficiencies, gaps, audit findings, and weaknesses in product offerings or
    team performance can make all the difference between an organization hostile to
    change or one welcoming to it.


    In the modern era, we see companies rushing into paradigm-shifting projects like
    digital transformation and quickly being served up a big plate of not buying it.
    Groups that pick up the mantle of digital transformation, excited by its potential,
    end up running around in circles, hurriedly setting up committees, imposing rules,
    writing up new guidelines, buying shelf-ware, and sprinting towards what they
    think will be early wins. Yet change management and digital transformation is
    not merely a race.


    A successful transformation necessitates a thoughtful assessment of the existing
    cultural, regulatory, operational landscape. Change agents today need to immerse
    themselves in understanding a firm’s technical capability and thresholds. Only
    then can its leaders develop a wise, aspirational, and reasonable plan. A planned
    yet flexible cadence covers essential bases and addresses the cultural needs of
    the business. It does not dump barrels of whiskey on its known drunks.


    A clear, salient, and targeted executive-level strategy around change and innovation:


    *   •Presents: opportunities for better governance to avoid fines and litigation
    exposure


    *   •Helps: to reduce expenses and monetize the information or product lifecycle


    *   •Fosters: trust to enhance employee, business partner, and customer experiences


    Instead of rushing in with a million ideas and every cook on hand, smart organizations
    and its leaders are better served with this empirically proven Less is More approach.
    Find the opportunity in between the gaps, facilitate honest discussions to achieve
    your goals, and don’t lose sight of results. No kitchen sink required.


    ## Taking the next steps'
