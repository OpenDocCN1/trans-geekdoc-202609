  toc: []
- raw: "If the impression fits a survival narrative, the middle manager hits the panic\
    \ button, initiating a fight, flight, freeze, or feign/appease response. In rapid\
    \ succession, our brain floods our entire body with adrenaline and other stress\
    \ hormones, our heartbeat quickens, vascular system contracts, field of vision\
    \ narrows, and so on.\n\nHowever, if the impression fits an opportunity narrative,\
    \ the middle manager hits the desire button, initiating a consideration or pursuit\
    \ response.\n\nSensing no immediate threat and plausible upsides, the middle manager\
    \ kicks it up to the chief executive officer to decide what will likely happen\
    \ next and what to do about the commotion.\n\nFor the most part, this has worked\
    \ pretty well for human beings. However, the process comes with a few exceptions\
    \ and variables.\n\nDelphic Curse \\- Most predictions are simply wrong. Digging\
    \ deeper, those predictions that most people consider plausible are often the\
    \ most errant. And the most implausible or farfetched predictions often turn out\
    \ to be most accurate. But, so what? Nobody believes them!\n\nThe More Things\
    \ Change \\- To update the old and somewhat cynical French proverb, amidst our\
    \ times of great change, a surprising number of things stand unchanged, immutable.\
    \ Of course, most of these things hide in plain sight and require “piercing the\
    \ veil of tranquilized obviousness.”\n\nShut-down Syndrome \\- Rapid change of\
    \ environments overwhelm our brains’ ability to make sense. Unless we take measures\
    \ to counteract this response, our brains will compel us to choose the familiar\
    \ or mediocre option or to avoid criticism. In part, we can avoid this by learning\
    \ from others about how they navigated the vagaries and vicissitudes of their\
    \ lives.\n\nUneven distribution \\- The future arrives unevenly distributed. Some\
    \ of us have already immigrated to the world of hyper-connectivity and intelligent\
    \ assistance, putting surfboards into water with the aim of surfing the next trillion-dollar\
    \ wave of innovation, wealth creation, and disruption. Some of us see the winds\
    \ of change on the distant horizon, believing that we have the luxury of two to\
    \ three years to make a change. Many believe their window has already opened and\
    \ closed. Just like jumping from a skyscraper, they feel there’s zero doubt they’ll\
    \ hit the ground. Still, others of us don’t see anything in our way, nor do we\
    \ believe that anything bad will happen. We’ll continue to just keep on, keeping\
    \ on. Who’s right? “Well, even if I knew, no one would believe me!”\n\nOpportunity\
    \ and Innovation Diffusion Curves \\- We can count on the fact that entrepreneurs\
    \ and technology enterprises will continue to invent, innovate, and disrupt the\
    \ status quo. For the foreseeable future, there will be jobs and careers for speeding\
    \ the introduction and adoption of new technologies and building operationalization\
    \ capabilities (accountabilities, workflows, and systems). Experimenters, early\
    \ adopters, early majority, late majority, and laggards will all have jobs to\
    \ do. However, we will discover that we must now cycle quickly through all those\
    \ jobs.\n\nAnd that’s where this book can aid both the young professional and\
    \ the seasoned executive.\n\nRafael and Abby have interviewed dozens of accomplished\
    \ and forward-thinking industry leaders and innovators to present their observations\
    \ about several technologies and trends. This alone will give you tons of insight\
    \ and background on a burgeoning array of developments.\n\nHowever, most of what\
    \ they will say about YOUR future might miss the mark by miles. That’s a good\
    \ thing: it will be only through your unique perspective that you will see opportunities\
    \ that hide in plain sight of YOUR world.\n\nWhat remains the same amidst all\
    \ this change? Decency, dignity, fairness, discernment, and flexibility.\n\nNow\
    \ more than ever, the world rewards those who parlay small wins into stupendous\
    \ gains, who play to their individual strengths, who learn how they learn, and\
    \ who know that most of what’s good in the world resulted from high performing\
    \ teams and their leaders.\n\nSo be that guy or gal.\n\nAs you read these interviews,\
    \ pay attention to more than just the particular concepts and technologies.\n\n\
    Pay attention to the narratives, the story logic, and themes that each interviewee\
