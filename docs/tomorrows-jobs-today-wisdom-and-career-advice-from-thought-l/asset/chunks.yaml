- raw: "We want to extend our sincere gratitude to each of the visionary business\
    \ and civic leaders around the world who shared their time, guidance, and career\
    \ insights to make this book possible. Thank you to our colleagues and friends,\
    \ including Michael Jay Moon, Dr. Jones Lukose Ongalo, Andrea Kalas, Miguel Mairlot,\
    \ Ashish Gadnis, Priya Keshav, Amb-Dr. Oyedokun Ayodeji Oyewole, Markus Lindelow,\
    \ Dr. Ulrich Kampffmeyer, Dr. Anita Allen, Douglas C. Williams, Kevin Gray, George\
    \ Socha, Esq., Dr. Katrina Miller Parrish, Mark Patrick, John Danenberger, Esq.,\
    \ Dr. Anand Rao, April Dmytrenko, Patrick Sweeney and Erick Swain.\n\nThank you\
    \ to the Schmider family, Allison Lloyd, Kathryn Keene, Sean Conley, Sharon Ware,\
    \ and Nick Paonessa.\n\nTo the stellar team at John Hunt publishing, we thank\
    \ you for believing in our book.\n\nMost importantly, we thank our own beacons\
    \ of wisdom, our loving parents, Dr. Raymond and Eleanor Moscatel, the late Lisa\
    \ Bair, and Charles and Heide Bair.\n\n# [Introduction](#nav.xhtml#toc3)\n\n>\
    \ “As technological breakthroughs rapidly shift the frontier between the work\
    \ tasks performed by humans and those performed by machines and algorithms, global\
    \ labour markets are undergoing major transformations. These transformations,\
    \ if managed wisely, could lead to a new age of good work, good jobs and improved\
    \ quality of life for all, but if managed poorly, pose the risk of widening skills\
    \ gaps, greater inequality and broader polarization.”  \n\n> Klaus Schwab, The\
    \ Future of Jobs Report\n\nIt’s every job seeker’s dream to land both a financially\
    \ and intellectually rewarding position doing something that they love. Or at\
    \ least like! Yet these days, even amidst the abundant opportunities of the Information\
    \ Age, folks of all skill levels continue to struggle with the best approach to\
    \ a happy and successful vocation. Business models are transforming the job market\
    \ so rapidly that even the most accomplished executives and educated employees\
    \ suffer from anxiety over the stability of their roles. They must routinely prove\
    \ their intrinsic value to their superiors and define their personal brand within\
    \ their organization. For new graduates and those looking to make a big career\
    \ transition, the reality of a continually shifting corporate landscape can feel\
    \ almost paralyzing. The emergence of impersonal human resource tools like artificial\
    \ intelligence in hiring practices has compounded traditional fears underlying\
    \ the search for our rightful place in the new digital workplace.\n\nThere are\
    \ plenty of recruiters, human resource professionals, and resources like The Future\
    \ of Jobs Report quoted in the epigraph above that employ statistics and academic\
    \ research to explain the modern workforce. These factoids are interesting, but\
    \ only those with practical, first-hand experience can adequately convey the nuances\
    \ of what it means to be and fulfill the responsibilities of a CIO, Blockchain\
    \ Banker, Archivist, or Data Scientist. Profiles of today’s business leaders regularly\
    \ serve up softball interview questions that don’t help us fully understand the\
    \ big why behind the how I got here question. They rarely investigate how their\
    \ subjects think about specific issues impacting their chosen fields. This book\
    \ reflects the sobering perspectives of executives who sit on the firing line\
    \ of board rooms and who also know their way around a server room. These interviews\
    \ enable us to walk a mile in their shoes while exposing us to the exciting technology\
    \ trends responsible for creating the workforce demands we see emerging today.\n\
    \nHow do we discover where our contributions belong in this brave new world? How\
    \ do we discern what work we should train for and exactly where we should perform\
    \ it? What kinds of jobs are out there today, and what will they look like in\
    \ the near distant future for us? Will they be there tomorrow, or even by the\
    \ time you finish this book? Perhaps envisaging answers to these questions aren’t\
    \ so complicated at all. Maybe they’re right under our noses and spelled out on\
    \ the next few pages.\n\nIndeed, the reasons for today’s job anxiety and uncertainty\
    \ aren’t driven entirely by science fiction inspired fear of robots and automation.\
    \ Those may be fun hypotheticals with a certain truth to them. Our visceral worries\
    \ about our future job prospects are more aptly rooted in the reality that we\
    \ don’t do a very good job explaining what we do to each other. That’s partly\
    \ because, as a result of the pace of technology, tomorrow’s work doesn’t look\
    \ much like yesterday’s stack and probably never will. The bigger reality is that\
    \ we’re all so preoccupied with our professional goals (and devices) that we rarely\
    \ sit down to thoughtfully communicate our priceless wisdom about our work outside\
    \ of occasional mentoring programs or when writing a new job description.\n\n\
    Like most of us who grew up in or who were born in this Information Age, we’ve\
    \ learned early on in our careers that we can’t expect to develop and survive\
    \ professionally, let alone thrive if we get too comfortable in our own silos.\
    \ Our ideas will get stale, our skillsets will grow old, and our energy to adapt\
    \ will precipitously decline. That familiar yet often overused maxim, “do what\
    \ you love,” while a historically useful antidote, isn’t nearly enough to carry\
    \ us over the finish line in today’s corporate rat race. While we don’t need to\
    \ finish first technically, we should want to be in the right lane for as much\
    \ of the journey as possible. That journey is most rewarding when it is equipped\
    \ not merely with knowledge and experience but with the shared wisdom of proven\
    \ leaders.\n\nIn these chapters and industry stories, we reveal the origins of\
    \ those crafted insights and three strategic themes common to each of these visionary\
    \ leaders: One - How gaps (weaknesses) can become opportunities; Two - How less\
    \ is often more; and Three - Why, above all else, our Relationships Matter now\
    \ as much as our credentials.\n\nThis book is for the new graduate, the professional\
    \ between jobs and the doting parents desperate to get their “brilliant” but lazy\
    \ kid out of the basement. It’s also for senior corporate leaders seeking an intimate\
    \ understanding of the changes abounding in their organizations. It’s for the\
    \ manager who wants to inspire and encourage professional development. And it’s\
    \ for every knowledge worker out there who wants to leverage technology and information\
    \ governance to reduce risk, generate revenue, and improve customer experiences.\n\
    \nTomorrow’s Jobs Today is not for those who cower in the face of disruption.\
    \ It’s a resource for smart people like you who recognize the jobs of the future\
    \ are very much here today and ours to adapt to. By absorbing the perspectives,\
    \ challenges, and solutions of those deeply in love with and accomplished in these\
    \ new careers, we can help ourselves, our friends, and our employees transform\
    \ anxiety over a job search, job loss, or just the winds of change into hope,\
    \ understanding, and opportunity.\n\n# [Part I Gaps are Opportunities](#nav.xhtml#toc4)\n\
    \n> “The Chinese use two brush strokes to write the word ‘crisis.’ One brush stroke\
    \ stands for danger; the other for opportunity. In a crisis, be aware of the danger–but\
    \ recognize the opportunity.”  \n\n> John F. Kennedy\n\nThe convergence of technology\
    \ and the rule of law is expected to intensify over the coming years. It’s a paradigm\
    \ shift that will force organizations of all sizes, private and public, across\
    \ all verticals, to balance a world ripe with innovation with an evolving universe\
    \ of risk and regulatory pressure. Employers and their workforces will be inclined\
    \ to adapt to this dynamic new digital landscape in their personal and professional\
    \ lives. Like every era before it, the individuals who lead the way will separate\
    \ themselves from the pack by identifying, engaging in, and fostering the right\
    \ opportunities wherever they reveal themselves."
