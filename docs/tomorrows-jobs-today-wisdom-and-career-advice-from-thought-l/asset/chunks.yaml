- raw: 'Q: Mark, you’ve served your country as a sailor, helicopter flight instructor,
    and now as a national security executive. What initially piqued your interest
    in a career in government, and why did you ultimately gravitate toward leadership
    roles in its knowledge management divisions?


    A: I am the son of a career Air Force officer who went on to a second career in
    municipal government following his military service. So, I am following in my
    father’s footsteps to a large degree. After attending the University of Virginia
    on a Naval Reserve Officer Training Corps (NROTC) scholarship, I enjoyed 21 years
    in the Navy, flying, doing various types of staff work, attending graduate school,
    living abroad and working with members of all the military services and with the
    interagency, allied military partners, and civilian members of allied ministries
    of defense.


    While in the Navy, I served as the deputy to the civilian who led the Joint Staff’s
    Information Management Division, from 2000-2002, here at the Pentagon, the position
    I now hold. During that period, that civil servant retired, and I acted as the
    division chief for a period of months. I was part of the selection committee that
    hired his replacement. It was during those couple of years I was exposed to workflow,
    records management, business process, business intelligence, decision support,
    and a number of information and knowledge management practices. I developed a
    keen awareness of how important these were to the business of the Joint Staff,
    and any large organization in general, whether public or private sector. It was
    exciting to do these things for an organization with such significance for our
    Armed Forces and the nation as a whole. The Chairman of the Joint Chiefs of Staff
    is the principal military advisor to the Secretary of Defense and the President.
    The Joint Staff is his staff.


    When I retired from the Navy in 2007, the civilian leadership position in the
    Joint Staff’s Information Management Division was vacant again, and I decided
    to apply for it. I was selected, and 12 years later, I’m still here. Like my father
    before me, government civil service seemed like a natural follow-up choice to
    my military career. Leadership in information and knowledge management in a national
    security environment felt like a continuation of what I did in the Navy, building
    on everything I’d learned, but also providing a continued path to grow in a field
    that I found fascinating. The only downside: no flying anymore. One year later,
    the iPhone came out, and our digital world seemed to speed up. The information
    world has continued to pique my interest as things have changed rapidly, so I’ve
    stuck with it.


    By the way, flying crewed aircraft and conducting a complex military mission involving
    multiple ships, aircraft, and submarines is one big information and knowledge
    management exercise—with a little hand-eye coordination thrown in! There is a
    direct relationship to where I am now.


    Q: You’re actively involved in groups like AIIM, the Association for Intelligent
    Information Management, and have sat on its Board of Directors. How does business
    and technology insight gleaned from private industry think tanks like AIIM influence
    information governance practitioners in the public sector?


    A: Information is information. Data is data. A business process is a business
    process. It doesn’t matter whether it occurs in the public or private sector.
    The fact is that most private sector businesses are smaller and more nimble than
    large government bureaucracies. Because of this, changes in the business technology
    environment have occurred much more rapidly there than in the public sector. It
    seemed obvious to me that if I wanted to learn the best way forward for public
    sector information and knowledge practices, I needed to familiarize myself with
    the innovation happening in the private sector.


    AIIM has been around since 1943. I found it soon after taking my civilian job
    via my local chapter, the National Capital Chapter. It was there I met a very
    experienced group of vendors, consultants, and other end users that had spent
    their entire careers in the information management space. They were able to teach
    me about the evolution of enterprise content management systems across businesses
    — the pharmaceutical industry, oil and gas, finance, etc. SharePoint was becoming
    a big deal, along with other systems and vendors. I shared with my AIIM colleagues
    what I was learning in my organization as well (nothing classified, of course!).
    As my personal and professional relationships with these AIIM members grew, I
    felt grateful and volunteered to serve on the chapter board. After some time,
    my peers encouraged me to apply for a director’s position on AIIM’s national board.
    I was nominated, selected, and began serving in 2014. Normally a three-year position,
    I continued as Treasurer, Vice-Chair, Chair, and now I’m in my sixth and final
    year of service as the Immediate Past Chair.


    AIIM has been my network. I’ve worked closely with folks from Microsoft, Box,
    Nuxeo, Gartner, OpenText, Alfresco, state government CIOs, private consultants,
    to name a few. It has been invigorating and rewarding, and I’ve always found that
    what I learn from my AIIM colleagues has direct or indirect application in the
    public sector. People, process, technology, and information innovation is transferable.


    As I’ve attended AIIM’s annual conferences, there has always been a significant
    number of public sector attendees from across various levels of government. I’m
    clearly not the only one. Public sector practitioners mingling with their private
    sector counterparts creates mutual benefit. Like-minded end-users collaborate.
    Customer-client relationships are formed. Lessons learned and best practices are
    shared. Training is facilitated, and practitioners grow their skills and, consequently,
    their value to their organizations.


    Q: The government is sometimes between a rock and a hard place in responding to
    Freedom of Information Act requests. What does the public need to understand about
    the burden these requests place on a bureaucracy?


    A: I can speak from my experience with the Department of Defense information,
    especially here in the Washington, D.C., area. Most of our information includes
    mixed classified equities of multiple agencies, both sub-agencies within DOD—say
    Department of the Army, Defense Intelligence Agency, a particular combatant command
    like US Central Command, or US European Command for example; and information originated
    by non-DOD agencies like the Department of State or the Intelligence Community.


    When a request to search for or review information comes into the OSD FOIA office,
    after they determine the request is legal, bona fide, etc., they then have to
    send it to all elements within the department that have equity to conduct reviews
    or searches. They may determine at that point that other non-DOD agencies need
    to review the information as well. Sometimes this isn’t discovered initially,
    but the DOD sub-agency will come back with the recommendation that the material
    also be reviewed by one or more other agencies. Once all of the reviews are in,
    the OSD FOIA Office has to combine them, adjudicate them for consistency, etc.
    and then send out the consolidated reply to the requester. This can take time.


    Within the Joint Staff, when we are given a case by the OSD FOIA office, we have
    to determine which sub-element of the staff has equity in the information so that
    it can be staffed by the correct Original Classification Authority. The work eventually
    will get from a FOIA caseworker into the hands of an action officer who has subject
    matter expertise to conduct the review or the search. Sometimes cases can be quite
    large and require considerable time to complete, and these action officers are
    doing them as a collateral duty. They have a “day job” that they also must do.'
