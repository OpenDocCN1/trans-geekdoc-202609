    Internalizing strategic objectives helps companies prepare and respond to the
    varying rules over the long run. That’s why our products are designed to help
    to develop and maintain, for example, an evergreen data map within the organization.
    We also help our customers ensure that a long-term plan for managing data remains
    their focus even as various shorter-term efforts, for example, exercises around
    data clean-up, are being worked on.


    ### Q: In preparing for the coming “data tsunami,” which you called out in a piece
    for Bloomberg, you advise companies to reexamine their existing compliance frameworks.
    Do organizations need to rethink their entire strategies as a result of IoT, or
    do they need to tweak existing guidelines and protocols?


    ### A: Well, the data tsunami is already here, with about 2.5 quintillion bytes
    of data created every day. This includes types of information that come under
    the purview of consumer data privacy regulations that are present today. However,
    this tsunami is going to pale in comparison with the types of information and
    volumes of data that will get generated by future IoT devices. As IoT devices
    become ubiquitous in consumers’ lives, our current problems with data will almost
    seem trivial by comparison. Companies need to recognize that we are at an inflection
    point in terms of IoT and data and begin to reframe their overarching governance
    strategies. Companies that don’t do this will be at a competitive disadvantage,
    unable to use their data as an asset, and in a constant struggle to keep up with
    regulatory pressures on how consumer data is safeguarded.


    How and whether organizations need to rethink their existing guidelines and protocols
    depends, of course, on where organizations are today. There is a broad spectrum
    of information governance program maturity across different organizations. While
    some companies understand the importance of `IG` and are well on their way to
    building a comprehensive `IG` program, many are still in the initial stages. While
    most of the companies are doing “something,” they are barely scratching the surface
    when it comes to benefiting from a real information governance program. Almost
    all organizations are targeting a few of the immediately achievable targets around
    reducing storage burdens. Most have also realized it is integral to build stakeholder
    support for their programs to make these sustainable. However, there are still
    substantial opportunities for companies to position their governance efforts to
    succeed in an IoT driven future. IoT demands will perhaps provide organizations
    with the impetus to build their infrastructure with a view towards that future.


    Establishing a sound, foundational approach to how the data is created, used,
    and stored within an organization is primary. With a strong foundation, it isn’t
    necessary to completely rethink the framework to incorporate IoT. The fundamental
    principles of `IG` will hold even in an IoT driven world. However, it also important
    to understand the nature of IoT data, the value it can add to a company, and the
    challenges it can pose if companies are unprepared. Some of these aspects are
    discussed in the guidelines and standards I noted, and professionals should keep
    up with the evolution of these guidelines. For instance, the draft discussion
    of cybersecurity standards around IoT from the `NIST` highlights that companies
    might have to prepare for situations where IoT devices:


    * Might not be accessed or monitored like conventional IT assets.

    * Can make changes to the physical world and thus can potentially affect human
    safety or cause damage to equipment and facilities.

    * Have differing lifespan expectations and possibly unserviceable hardware.

    * Have heterogeneous ownership. Companies might not be able to maintain a complete
    inventory of all devices and might also have restricted access to the devices.


    These issues will make it challenging to have universal recommendations or best
    practices that can work for all IoT devices. Organizations will need to understand
    risks based on specific uses of devices and adjust their policies and processes
    accordingly. Another thing to keep in mind is that managing the security and privacy
    risks of some of these devices might potentially affect other types of risk or
    might introduce a new stake in another area. Risks need to be understood and handled
    holistically.


    ### Q: You spent almost a decade leading one of the best Forensic Technologies
    Services groups at KPMG. What insights did you learn in that position that have
    proven helpful in guiding and informing your entrepreneurial ventures?


    ### A: I have seen companies derive marked benefits from being able to steward
    their data as an asset. If properly done, companies gain tremendous competitive
    advantages and improve consumer confidence and loyalty. I have also seen how considerable
    the costs of having to react to regulatory or legal needs for data can be when
    companies are going through a crisis. Being prepared proactively with better managed
    `IG` programs makes a big difference.


    I have also seen how `IG` programs stall if they are manually intensive, or, if
    it is hard to track progress, or if they do not have stakeholder buy-in. For programs
    to sustain, there needs to be a clear view of progress and a continuous way to
    build on successes without ever-increasing efforts. Culturally, I think it is
    worse to have an `IG` effort stall than to have no effort at all.


    We have tried to build on these documented experiences to provide our customers
    with sustainable models. This approach has a lot of resonance with companies and
    has helped us to gain traction with our customers. Enabling companies to position
    themselves for succeeding in tomorrow’s world with even more data has been the
    other major underpinning of our solutions. In a nutshell, we are trying to make
    `IG` sustainable and to encourage and enable companies to develop frameworks that
    will work today and in the future.


    ### Q: Are there any pearls of wisdom you’d be willing to share that might help
    a young person or individual thinking about a career in IG, Data Governance, or
    the IoT? Is it too late to get in on the ground floor on some of these evolving
    disciplines?


    ### A: No, it is not too late to get involved! There are some extraordinary opportunities
    to build very successful and satisfying careers in this space. We are at the cusp
    of massive data-driven changes in most industries. Soon, all kinds of professionals
    are going to be actively managing new types of data in larger volumes and under
    evolving regulatory scenarios.


    We must realize how our own lives are being altered by IoT every day. Our houses,
    cars, work, and lives are many times more wired and internet-connected than even
    a couple of years ago. Locks, doorbell cameras, voice-activated assistants, drones,
    autopilot cars, smart devices, you name it, it is already happening today. As
    end-users, we are perfectly positioned to appreciate why this data needs to be
    managed securely. It’s an incredibly in-demand skill to understand the technology
    generating this data, how companies can derive value from it, and the need to
    protect and secure it.

