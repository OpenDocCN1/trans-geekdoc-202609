    设计隐私和默认隐私将成为未来信息社会的重要概念。但现实中，人们倾向于选择偷懒的选项，我们没有为信息社会的未来投入巨大的努力。我们将这些留给了科幻小说作家、电影制作、互联网公司的首席执行官以及政治家。隐私不仅关乎权利，也关乎义务。这些义务不仅涉及公司和公共管理部门，也适用于我们每一个人，你和我。


    每个人都必须照顾好自己的数据，并尊重他人的数据隐私。当我们积极向社交平台上传地址列表时，我们就无法主张任何“被遗忘的权利”。在我看来，数据隐私和隐私权主要是教育的任务，而且这种任务应该在入学之前就开始。这是一项培养关于信息价值和风险思维的任务。数据隐私必须从我们的脑海开始。


    **Q**: 预测编码几乎是在二十年前引入的，虽然技术已经取得了进步，但采用的障碍仍然是成本和复杂性。人工智能和机器学习的进步将有助于让小型公司使用这些工具吗？


    **A**: 首先，我们已经跨越了 `AI` 的魔法边界。`AI` 现在不仅能够自我学习和自我优化，而且像进化一样，能够自我复制和自我扩张。一个例子是“神经网络
    Quine 程序”。`AI` 软件正在编写 `AI` 软件，`AI` 软件正在管理由 `AI` 管理工具控制的 `AI` 环境。机器学习将在这个新的虚拟世界中成为标准。这种
    `AI` 与我们对智能传统的认知不同。它有自己的道路，发明不同的方法，并变得对人类的感知智力透明。它就在这里，在转角处。我们看到亚马逊、苹果、微软、谷歌、IBM
    等公司正在为领导地位进行激战。


    今天，`AI` 甚至对终端用户免费，或者随消费产品提供。它学习得越久，就会变得越复杂。AI 将成为每一份软件的一部分。拥有数十亿设备的 IoT 未来只有通过
    AI 才能管理。是的，它将成为每个云服务的一部分，并进入小型公司。唯一的延迟因素是遗留软件、遗留管理、遗留行为和遗留业务模型。


    重叠、包含、反向引发、加速的创新过程将涵盖每个人。这就是为什么我提到，我们关于信息驱动社会的旧观念——即拥有充分信息的公民对信息和机器拥有控制权——将被具有科幻性质的乌托邦模型所颠覆。带有人工智能的预测分析将在我们保持控制权的战斗中发挥作用，因为软件和系统将更自然地预测出我们将做什么。整个行业将发生变化。首先是那些只处理信息的行业，如银行或保险。然后制造业和其他也会随其后。


    **Q**: 根据你作为从业者、讲师和顾问的多年经验，对刚刚进入信息管理和信息技术领域的年轻人提供什么智者的建议？


    **A**: 嗯，信息管理的教育正落后于技术和信息革命。学会独立思考，学习语言，学习如何沟通，学习方法论，学习哲学，学会接受变化，学会终身不停止学习！学习你真正感兴趣的、你热爱的、能带给你智力满足的东西。


    # 数字革命中不断变化的营销目标


    Dux Raymond Sy，AvePoint 首席营销官


    **主题**: 数字化转型，云计算


    > “数字营销的两个主要挑战是时间稀缺和白噪音，这些问题在企业级 IT 领域似乎更为突出。”

    > Dux Raymond Sy


    Dux Raymond Sy 是 AvePoint 的首席营销官，负责推动全球商业、教育和公共部门机构的业务和数字化转型倡议。他还是微软区域总监和最有价值专家（MVP），并撰写了许多关于
    IT 和业务流程策略的书籍、文章和白皮书。他获得了南方理工大学的电信工程学士学位。


    **Q**: Dux，AvePoint 擅长利用微软技术的广度来帮助公司管理其云、本地和混合环境。一些趋势表明，至少有部分企业在云端过度扩展后又转回混合堆栈。大多数企业最终会从本地或混合基础设施演变吗？还是说数据保护等因素会阻止某些公司实现全云端化？


    **A**: 当涉及到企业技术时，我们很少后退。云的成本、规模、访问效率，是的，甚至安全优势都太诱人了，以至于本地或混合基础设施无法长期占据主导。我要说，转型所需的时间将比云提供商广告让你相信的要长得多。


    惊讶的是，大多数组织尚未完全投入云端。我们几年前做的一项研究显示，约 70% 的组织仍在使用混合架构。我们今年还与智能信息管理协会 (AIIM) 赞助了一项研究，显示三分之一的组织至少维护两个版本的
    `SharePoint`。


    对云的态度已经改变，但现在的对话已转向“如何到达那里”，而不是“为什么”。最后，云提供了一些本地无法交付的能力。基于云的进阶服务，如机器学习、人工智能和数据分析，为技术团队驱动业务价值开辟了新机会。


    **Q**: 基础设施、平台和软件即服务 (SaaS) 是如何改变 IT 部门的组织层级、汇报结构和协作团队的？公司是否开始招聘更多的管理员，并减少与开发人员、架构师和支持人员的共事？按照目前的进度，未来几年内最好的
    IT 工作将出现在哪里？


    **A**: 我们发现，人类和组织的演变速度慢于技术。目前，大多数组织只是在将本地角色转移到云端。所以，如果你是 `SharePoint` 或 `Exchange`
    员，你现在就是 `SharePoint Online` 或 `Exchange Online` 员。但那些在本地不存在的应用程序呢？谁来拥有 `PowerApps`？这种策略忽略了云端存在的高级工作负载以及应用程序之间的连接。你在
    `Microsoft Teams` 中的操作会影响你的 `exchange`，反反之亦然。


    组织需要的是、而我们尚未看到的，是真正拥有平台并审视平台级问题的管理员。如果我们仅仅在 `Office 365` 内部就能看到此类问题，想象一下当多云架构变得更加流行时我们将看到什么。未来几年最好的
    IT 工作将是那些热爱学习的业务赋能者。在技术密集型时代，你需要保持敏捷。


    **Q**: 在快速变化的数字格局中营销 IT 服务和服务产品面临哪些挑战？IT 公司的首席营销官角色与负责推广传统商品的首席营销官相比，具体有何不同？


    '
