    [content]

    # The Reality of Work-Life Integration


    Once an obscure term, the concept has gained traction because, at this point in
    history, we’re all enduring an unnatural overlap between our personal and professional
    lives. Despite broad adoption, businesses are already learning that cultures blurring
    the line between work and home life often results in an encroachment that makes
    workforces less productive. It’s a trend obfuscated by the marketing and metrics
    waved in our faces by the fit-bit-digerati.


    The reality of work-life integration is made possible, and accessible to all,
    by the technological wonders that promote and accompany the Information Age. These
    offerings are marketed as must-have tools of convenience, advertised as essential
    life-hacks that, in many regards, even make us better people! In some instances,
    you literally cannot live without them.


    Yet contrary evidence is abundant, both statistical and devilishly anecdotal (in
    the case of the death-by-selfie) that proves how this total immersion in all things
    digital is hollowing us out emotionally and intellectually. We are no longer slaves
    to Pharaoh and relegated to pushing stones, but today we feel like we’re inching
    forward, restrained by invisible digital leashes, breaking up the leaps, bounds,
    and depths of our attention spans. Modern technological lifestyles even seem to
    polish away the rough and creative contours of our character. We are frequently
    robbed of our internal monologues and instead given social media profiles and
    hashtags, mere shadows of what we represent and mean to others.


    We needn’t run to an isolated cabin in the woods and pen a manifesto blaming innovation
    for all of our woes. We do need to draw clear battle lines with our favorite robots,
    lest we end up a mirror of them. It bears repeating. Less technology in our personal
    life equals more, long, meaningful breaths before we meet our maker.


    Work-life integration is dramatized in Cecil DeMille’s classic *The Ten Commandments*.
    Remember the famous scene where a worker is about to be trampled by a giant stone
    moved by “her colleagues.” Moses’ character, played by Charlton Heston, strides
    down from his managerial pedestal to save the poor soul, who later turns out is
    his mother! It’s a metaphor for how easily, regularly, and unfairly we put work
    before family, friends, and our well-being. And when work negatively impacts others,
    it is demonstrably immoral.


    I first learned about this 24/7 mindset by a `CIO`, who boasted, “Say I’m on a
    flight to Hawaii with my family for the weekend, and I’ve got to approve a purchase
    order for half-a-million. I can do it right here from my `iPhone!`” Well, that’s
    fitting, but it highlights the disconnect between those who have the world at
    their disposal and those who get interrupted with an email from their boss every
    weekend. The same technology fix that feeds the workaholic is now invading everyone’s
    space. It’s affecting their partner, their children, their social circle, people
    on the road. Do we want to subject ourselves to this type of digital bondage?


    Whether humanity is building Pyramids or iPads, imposed upon us or of our own
    making, an obsessive and aggressive approach to time-management will ultimately
    usurp what little personal, spontaneous, and family time we still have left. Does
    anybody living today hope for a gravestone that reads, “I wish I had worked, texted,
    emailed my customer more?”


    Ironically, this new digital bondage is reminiscent of the days when men and women
    of all ages built the Pyramids until they dropped dead. Sure, those grandiose
    sand tombs still stand as a testament to architecture. (Note: I will stop here
    as the input text became repetitive).

    [/content]


