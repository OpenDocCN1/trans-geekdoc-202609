  trans: '


    Kevin Gray 是伯班克市（City of Burbank）的首席信息官，领导一个 IT 部门，负责行政和网络管理、地理信息系统以及为 1400 多个名市员工提供的技术服务。在担任此职位之前，他曾担任全球顶级娱乐实体之一
    Viacom 的全球媒体和 IT 副总裁，监管一个跨越六大洲的国际团队。他在加州州立大学长滩分校获得信息系统学士学位，并是认证 Scrum 硕士和项目管理专业人士（PMP）。


    ## 职业路径与早期经历


    **Q：** Kevin，你的职业生涯始于奥星电影（Orion Pictures），负责 `Unix` 系统管理，随后在梦工（DreamWorks）指导数据中心运营。早期在应用设计和数据库管理方面的这些实践经验，是如何为你未来在
    Viacom 担任 IT 领导职位，最终成为伯班克市 CIO 职位做准备的？


    **A：** 嗯，我是从 IT 领域的初级服务台开始的。我很幸运，能够在它的各个方面不断成长。我认为，一步一级地爬上这个阶梯，让我体验了技术的所有学科。它让我能够“透视森林而非树木”，看到大局。它教会了我如何设计运营、如何制定战略，并赋予了我将这一切整合在一起的愿景。现在，我可以深思熟虑地制定出一个清晰的计划来运营组织，理解如何创新，如何通过特定的业务部门和整个组织来推动变革。经验是我领导领导的最好准备。


    ## IT 治理与业务战略


    **Q：** 你的重点之一始终是 IT 治理与组织业务战略保持一致的重要性。IT 团队实现这一目标有哪些实用的方法？伴随这种同步性的关系建立部分又有多么重要？


    **A：** 我认为实现这一目标最务实的方法是关注“人”。关注制定战略的人，并观察他们的业务是如何尝试实施战略的。因为最关的一的一点与共同目标保持一致，与你的合作伙伴保持一致。你必须成为业务部门真正的合作伙伴。技术是次要部分。技术是你用来尝试找到业务试图解决的问题的工具。而那些业务问题并不总是保持不变。它们会变化，根据经济状况而变化，根据市场状况而变化，可能根据你试图合作的那个职位上的人是谁而变化。


    所以，你必须保持距离，保持联系。这能让你保持一致。然后你就能想出有助于解决特定业务问题的解决方案。你必须保持敏捷，你必须能够切换方向。当业务改变方向时，你必须能够切换方向。我认为很多时候，IT
    组织没有保持联系。他们认为自己正在解决这个业务战略，正在解决业务问题。但随后业务问题变了，战略变了，他们突然就断了联系。最终，他们会在错误的方向上继续走三到六个月，这在技术领域是一辈子的了。


    我不但努力与我的业务伙伴保持一致，还要求我的团队保持一致。例如，我的直接下属，我已与市高层达成了一致。我的每个直接下属都需要与四到六个部门保持一致。他们被要求定期与其部门的高管会面，以确保他们保持一致并朝着正确的方向移动。我也会定期与这些市高管交流，以确保我们是一致的。


    这哪里帮助最大？例如，公园和休闲部（Parks and Recreation）不太可能没有技术团队帮助和专业知识的情况下尝试实施智能灌溉系统。有时，他们并不是刻意避免这种合作，而是没有意识到这个机会。他们没有考虑到我们为他们试图解决的业务问题所能带来的价值。他们没有考虑到我们可以引入的技术，或者他们可能想到了技术，但他们并不认为我们是最能将该解决方案付诸现实的人。


    ## 全球视野 vs. 本地执行


    **Q：** 你为了业务和休闲经常往返全球。这些经历如何影响你管理人的策略和方法，或者系统和程序的设计？借用的话说，涉及到 IT 愿景时，是否应该“本地化行动，全球化思考”？


    **A：** 我学到的最伟大的事情直接来自于与不同文化的接触经历，以及看到人们处理问题的特殊方式。人们之间如何合作。人们最终如何分析这些问题。我认为这非常有影响，因为并不是每个问题都是钉子，所以并不是每个解决方案都是锤子。如果你对看待事物的不同方式、对待问题的不同方法没有良好的欣赏，你就无法从你的工具箱中选择正确的工具。这会阻止你看到解决问题的新方法。


    仅仅是开放心态去体验这些不同的文化挑战，就能让你看到这些机会。它有助于支持和促进创新以及定义解决方案的新方法。在全局化思考和本地化行动方面，我在 Viacom
    期间，我们创造了一个词，也许不是我们构想出来的，或者是某人从那里借来的，这个词是“全球本地化”（glocal）。全球本地是因为人们看到并体验自己的世界，而他们的世界始终是本地的。在很多情况下，法律和法规是非常本地化的。但为了规模化，你必须在更大的范围内思考。要服务一家全球性公司，你必须全球化思考。所以，你需要首先定义治理。你定义如何应对问题的总体政策，然后在你定义的框架内，确定本地政策来应对你必须处理的本地问题。从自上而下的视角来看。


    ## 公共部门与私营部门


    **Q：** 现在你进入了公共部门，你的客户不仅是消费者，还是公民和公职人员。为私营实体开发 IT 解决方案与为公共实体有什么区别？有什么共同的主题吗？


    **A：** 我总结的主要区别是，在公共组织中，我们并不是在开发卖给人们的产品。我们不是试图扩大市场。我们的市场是我们的社区。我们没有创造或制造任何东西。我们交付的是全方位的服务。我们是一个服务组织。我们的产品就是我们提供的服务。我们的精力必须放在改进、扩展和使这些服务高效上。这与如何最好地开发产品相比，是最大的重点。我们在某种程度上确实会营销自己，但它不是实体产品。我们并不一定有某项物品的供应链。我们有我们所提供服务的供应链。这是最大的区别。


    在开发我们的 IT 框架时，这并不意味着方法会有不同。这只是我们关注点的不同。我们是在提供服务，而不是在发行电影。所以，开发这些框架是非常相似的，概念也适用于解决小城市的挑战。


    '
