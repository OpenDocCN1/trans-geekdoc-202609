- raw: 'Kevin Gray is the Chief Information Officer for the City of Burbank, leading
    an IT department responsible for administrative and network management, geographic
    information systems, and technical services for over 1400 city employees across
    15 departments. Before assuming this role, he served as VP of Global Media and
    IT for Viacom, one of the world’s premier entertainment entities, overseeing an
    international team located across six continents. He received his bachelor’s in
    information systems from California State University, Long Beach, and is a certified
    Scrum Master and Project Management Professional (PMP).


    Q: Kevin, you began your career path at Orion Pictures, administering Unix systems
    and then directed data center operations for DreamWorks. How did that early hands-on
    experience with application design and database administration prepare you for
    future IT leadership positions at Viacom and, ultimately, the CIO role with the
    City of Burbank?


    A: Well, I started on a service desk at the entry levels in IT. And I’ve been
    lucky enough to have grown up through all aspects of it. I think climbing that
    ladder one rung at a time let me experience all the disciplines of technology.
    It enabled me to see the forest through the trees, the big picture. It taught
    me how to design operations, develop a strategy, and equipped me with a vision
    to incorporate it all. And now I can thoughtfully pull together a clear plan for
    how to run an organization, understand how to innovate, how to drive change through
    both a specific business unit and an organization. Experience is what best prepared
    me to lead.


    Q: One of your focal points has always been the importance of aligning IT governance
    with an organization’s business strategy. What are some of the practical ways
    IT teams accomplish this goal, and how vital is the relationship-building component
    that accompanies that synchronicity?


    A: I think the most practical way to accomplish this is to focus on the people.
    Focus on the people developing the strategy and look at how their business is
    trying to implement it. Because the most vital thing is to be in alignment with
    the shared goal, in alignment with the people you’re partnering with. You have
    to be a true partner with the business. The technology is the secondary piece.
    The technology is what you use to try to find the solution to the problem the
    business is trying to solve. And those business problems don’t always stay the
    same. They change. They change based on economic conditions. They change based
    on market conditions. They may change based on who might be occupying the seat
    that you’re trying to partner with.


    So, you have to stay close, and you have to stay connected. That allows you to
    stay aligned. Then you can figure out the solutions that are going to help solve
    that particular business problem. You have to be agile. You have to be able to
    switch directions. When the business changes direction, you have to be able to
    switch direction. And I think too often, IT organizations, they don’t stay connected.
    They believe that they’re trying to solve this business strategy. That they’re
    trying to solve the business’ problems. But then the business problems change,
    the strategies change, and they’re suddenly not connected. Eventually, they’re
    heading down the wrong direction for another three to six months, which is a lifetime
    in technology.


    Not only do I try to stay aligned with my business partners, but I also require
    my teams to keep aligned. My direct reports, for example, I’ve aligned with the
    executives of the city. My direct reports each have between four and six departments
    that they need to be aligned with. And they’re required to meet with the executives
    of their department regularly to make sure that they’re staying aligned, and they’re
    moving in the right direction. I also talk periodically with these city executives
    to make sure we’re aligned.


    Where does that help the most? Well, it’s less likely, for example, that the Parks
    and Recreation department will try to implement a smart irrigation system without
    the help and expertise of the technology team. And sometimes, they’re not purposely
    trying to avoid this collaboration, but they don’t recognize the opportunity.
    They don’t think of the value that we can bring to this business problem that
    they’re trying to solve. They’re not thinking of the technology that we can introduce,
    or they may be thinking of technology, but they don’t necessarily think of us
    as the ones who can best bring that solution to fruition.


    Q: You’ve traveled frequently around the globe for business and pleasure. How
    have those experiences influenced your strategies and approaches to managing people
    or the design of systems and programs? To borrow a phrase, should you act locally
    but think globally when it comes to an IT vision?


    A: The greatest things I’ve learned come directly from my experiences interfacing
    with different cultures and seeing the special ways that people approach problems.
    How people work with one another. How people ultimately analyze those problems.
    I think it’s very consequential because every problem is not a nail, so every
    solution can’t be a hammer. If you don’t have a good appreciation for different
    ways of seeing things, different approaches towards problems, then you’re not
    able to choose the right tools from your toolkit. It prevents you from being able
    to see new ways of solving problems.


    Just being open to experiencing those different cultural challenges opens you
    up to seeing those opportunities. It helps support and promote innovation and
    new ways of defining solutions. In terms of thinking globally and acting locally,
    when I was at Viacom, we coined a term, maybe we didn’t conceive it, or somebody
    borrowed it from somewhere, but the term was “glocal.” Glocal because people see
    and experience their own world, and their world is always local. In a lot of cases,
    laws and regulations are very local. But, to scale, you have to think on a larger
    spectrum. To serve a global company, you have to think globally. So, what you
    do is that you first define governance. You define overarching policies for how
    you’re going to attack problems and then, within that framework that you’ve defined,
    you determine local policies to attack the local problem that you have to deal
    with. Approach it from a top-down perspective.


    Q: Now that you’re in the public sector, your customers aren’t just consumers,
    they’re citizens and public servants. What’s the difference between developing
    IT solutions for private entities versus public ones? Are there any common themes?


    A: The main difference I’ve gleaned is that in a public organization, we’re not
    developing products that we’re selling to people. We’re not trying to grow markets.
    Our market is our community. We’re not creating or manufacturing anything. What
    we’re delivering are our services across the board. We are a service organization.
    Our product is the service we provide. Our effort has to be on improving, scaling,
    making those services efficient. That’s the biggest focus as opposed to how to
    develop a product best. We do market ourselves in a sense, but it’s not a physical
    product. We don’t have, necessarily, supply chains for an item. We have supply
    chains for the services that we provide. That’s the biggest difference.


    In developing our IT frameworks, it doesn’t necessarily translate to a different
    approach. It’s just a difference in what we’re focusing on. We’re providing a
    service as opposed to say distributing a film. So, developing those frameworks
    is very similar, and the concepts apply to address the challenges of a small city.'
