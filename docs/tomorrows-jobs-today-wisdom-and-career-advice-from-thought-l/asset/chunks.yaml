- raw: 'A: Over the last two and a half years, we’ve determined that 2.7 billion people,
    including refugees displaced and those in extreme poverty zones, participate in
    some sort of a supply chain. That can mean you’re the most impoverished farmer
    in Congo growing coffee, cacao, or shea butter, you know, the ingredients that
    go into cosmetics, and your contributions show up in brands like eight dollar
    lattes and expensive body lotions. And in examining their participation, we realized
    that current models for getting people out of poverty have failed.


    Old economic models have failed because they look at the ability to help people
    out of poverty separate from enabling people in poverty to take part in the supply
    chain. We took another route. Nobody had ever done it. We said, “What if the people
    who are absolutely in that last mile get to participate equally?” Then the value
    for the brand is suddenly more relevant.


    Let’s use a simple example. If you’re buying cacao in Ghana and you’re a large
    chocolate company, there’s a good chance today that your last mile farmers are
    extremely poor and also invisible. No matter how much traceability, transparency,
    or fair trade you implement, until and unless that farmer can participate in his
    data, to know, for example, “I’m selling 40 kilos every other week to this big
    brand,” then that farmer will continue to live in poverty. That poor farmer today
    has everything stacked against him or her, especially if conditions are rough.


    I was just in Zambia a week and a half ago, and I saw a firsthand example of this
    problem, which was that women farmers have to borrow at a higher price point.
    Women farmers are often finding themselves on the short end of the stick because
    they’re not able, in a multitude of cases, to prove their history. What happens
    if she is selling 40 kilos upstream, and there are seven middlemen? After she
    sells her coffee, somebody picks it up, then brings it to somebody else, the next
    one goes to the warehouse, and eventually she’s lost the ability to track her
    product. You see, while the internet has come to people in poverty, it hasn’t
    actually pulled people out of extreme poverty, let alone permanently. There’s
    mobile money, there’s big data, AI, etc., but none of those models have ever allowed
    that mother, that farmer, to participate equally.


    When I say participate equally, it’s very basic. To me, participate equally means
    that one, she has a physical, digitally stored copy of that transaction that nobody
    can ever steal or manipulate. Two, she can prove her transaction history, which
    legitimizes her existence in that supply chain. Three, it allows her to now leverage
    that data in a way that reduces her cost of borrowing. It allows her to be portable.
    That’s how we decided to look at blockchain. Nobody has ever done this. People
    keep talking about how they’re going to use blockchain for good, but we’re one
    of the only ones doing it every day, taking a commercial approach while being
    simultaneously profoundly purpose-driven.


    We started a for-profit, for-purpose software company, and now the largest brands
    are coming to us because it solves two sides of the problem for them. One side
    is that the supply chain now becomes more cost-effective and efficient. They get
    better visibility into the supply chain in terms of quality, market access, and
    forecasting, which enables an ecosystem for crop insurance, climate protection,
    education. The other side of the coin is that they can start addressing issues
    like gender equality and labor rights.


    Q: In your model, BanQu offers a software-as-a-service software (SaaS) platform
    that supports six key United Nations Sustainable Development Goals (UN-SDGs) out-of-the-box.
    Together, this “Economic Identity Passport” is used by corporations, governments,
    and International Non-Government Organizations (INGO’s) looking to meet their
    UN-SDG goals and other commitments. Since launching, what have you found are the
    most utilized of the tools?


    A: They’re intertwined. This is why we took a platform approach and why it’s software
    as a service. A lot of companies are going to focus on water, healthcare, or gender.
    We looked at these six UN-SDG’s and realized that they should always be looked
    at together. Let’s look at an example. We’re live in eight countries. As I mentioned,
    I was recently in one in Sub-Saharan Africa, and we’re talking the bottom of the
    pyramid. No running water, no sanitation, no paved roads, high malnutrition. Tough
    as it gets. Yet their farmers (especially the women) are knowledgeable and resilient,
    and they grow crops because there is a market. BanQu gives them confidence and
    dignity because their harvest can be sold with full traceability and transparency.
    At the end of the day, it’s a circular economy, and now the woman farmer has an
    economic identity.


    Q: Can you explain that concept, economic identity, in detail?


    A: For us, economic identity is the ability to prove our identity in those types
    of transactions. So, if I sold you 40 kilos every three weeks, you pay me money
    for the quality and the quantity, and now it’s history. But one aspect of identity
    alone is useless. If you just show up at a bank and say, “Hey, I’m soand-so, this
    is my driver’s license, and you should give me a good interest rate on a car loan
    ” Well, they’re going to ask you to take a hike. Whereas if you showed up with
    your social security card and your education, you’re taken seriously. It’s just
    the way the world works. If I know a little more about you, I’m going to treat
    you with a bit more dignity, and that’s what our solution supports.


    Q: For organizations applying this private blockchain solution, are there some
    modules or some components more useful than others in the immediate term?


    A: The most pressing one is the supply chain connection. For example, some of
    the largest brands in the food business will sign up with us for immediate traceability
    and transparency into their existing crop flows. Just like they’re buying [Salesforce.com](http://Salesforce.com)
    or Oracle or SAP. They subscribe to our platform. We configure for things like
    language, currency, workflow, asset classes. We also have a meta-data framework
    that our clients can now create themselves for KPIs and metrics in real-time.
    We go live, and it gets deployed to the farmer who doesn’t have a smartphone,
    just via SMS, and now the last mile is connected in real-time. Traceable, transparent,
    and the farmer participates equally.


    So, when a transaction happens, they bring a bag of cacao or coffee or whatever
    to market, you, as the farmer get an SMS message confirming the transaction, and
    the location and an authentication token. We don’t mess with cryptocurrencies.
    We use pure blockchain. Now you have a copy that says you dropped off 40 kilos,
    plus here’s the quality, plus here’s the payout and it’s secured and private.


    The key empowering impact is that you have permanent digital proof of that asset
    from tree-to-cup or mine-to-battery. As the transaction progresses, you have a
    record of the payout, which is a big deal in emerging markets, especially around
    security and in terms of building your credibility in that crop flow. If you were
    dropping 40 kilos every two weeks and a broker was taking it off of your hands,
    you cannot prove that you have been growing a good crop. So, as the weeks go by,
    now the farmer can see her entire history, and it’s validated in the ledger, which
    makes her bankable. It benefits both the brand and the farmer as well as the entire
    supply chain.


    Q: Have you begun to tap the big data aspect of it? If so, what challenges will
    that bring in terms of our evolving regulatory climate?'
