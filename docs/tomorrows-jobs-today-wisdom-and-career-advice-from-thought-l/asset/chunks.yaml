- raw: 'I talked earlier about thinking glocally for a large multinational corporation,
    but I don’t have to think glocally in this role. I do, however, have to serve
    15 entirely different businesses. It’s really 15 altogether different business
    units within a small city. I have a utility whose service is providing electricity
    and water for the citizens in the city. That’s completely different than a police
    force that’s focused on law enforcement, which is entirely different than a public
    works organization focused on building and maintaining streets and streetlights.
    Two entirely different businesses, if you will. So, when I’m developing a framework
    for a city, it has to be an overarching framework that can serve these diverse
    business units. Yet when we focus on a specific business unit, we have to zone
    in on the solutions within that framework that best help that particular service
    that the business unit is providing.


    Q: Your education continued well beyond your initial degree work, leading to a
    SCRUM master and PMP certification. In today’s competitive career landscape, how
    have these credentials aided your professional development, and what designations
    do you advise others seeking IT leadership roles pursue?


    A: My perspective is a little different here than some of my peers. Yes, continued
    education is an absolute necessity. You have to continue to learn. You have to
    continue to grow. As people get older, they naturally get accustomed to their
    ways, but sometimes they get too comfortable. They don’t look to learn and grow.
    Hence, you get guys and gals that have been a mainframe administrator for their
    entire career, and they stay a mainframe administrator until they retire.


    My willingness to learn is what provided me with my first big opportunity in technology
    because, at my first company, we were a mainframe shop for government contract
    pricing applications. When mainframes became too expensive to maintain, our business
    decided to move into open systems like Unix. I worked with a team of mainframe
    engineers, and I was a service desk guy. When we started that transition to Unix,
    not all of the mainframe people wanted to get onboard. That opened the door for
    me. I started learning Unix and became a system administrator. I went to Unix
    systems administration training courses. I bought books, and I began to read.
    Within a couple of years, I became the lead on the project. When we transitioned
    that application from the mainframe, I became the go-to person. It set me up.


    I learned then, early in my career, that the worst thing that we can do was get
    stuck in our ways. Get stuck in the technology that we focus in. Get stuck in
    the way with which we conduct our careers. So, I’ve always embraced that principle.
    What I don’t necessarily embrace on its face are certifications because I’ve known
    a lot of certified idiots.


    Some folks have ten certifications, but practically they can’t accomplish much
    of anything because they live inside of a book. You need that book to learn the
    concepts and methodologies. But to transition that to real life, you need to deploy
    it in real life, to find out what works and what doesn’t. What works out of the
    book. What doesn’t work? What applies? What doesn’t apply? Once you do that, you
    need to get back into the books and keep learning. You’ve got to figure out what’s
    my next step. What’s the next step in the journey to continuous improvement? What’s
    the next step in the journey of both personal, professional growth?


    When books aren’t enough for me, if something isn’t sitting well, or sticking
    with me, then sometimes I’ll take a class. That class may or may not result in
    a certification. But I tell you what, in the end, I can sit down and have that
    conversation about Lean Six Sigma principles with the green belt or the black
    belt, whether I have the green belt or the black belt certification or not, right?
    That’s my goal in my career. Now, certifications do certainly help when you’re
    moving from one job to the next. If you don’t have the credentials, it may dent
    your resume. But if you can get in the door and sit down and talk about that subject
    as well as anybody else that might have the certification, then the knowledge
    is as much, if not more valuable than the paper.


    Q: Is there any opportunity to monetize public data, or do public entities avoid
    doing that? Amazon, as part of its headquarters search, was accused of using that
    project to harvest city data about urban housing and planning.


    A: Perhaps, but I don’t think so and let me tell you why. In general, everything
    we do, every email we write, every plan we develop, every policy we write, can
    all be acquired with a public records request. Everything we do has to be available.
    There’s very little that is done either in a local, state or federal government
    that isn’t accessible publicly or that can’t be obtained with a request. Amazon
    or anybody else can get that type of information in one way or another. There
    are very few restrictions on what data a city is not obligated to share with whoever
    asks. There are some rules and policies around getting that data, but the truth
    is anybody can ask for anything from the city, and we’re usually obligated to
    provide it. There are very few legal ramifications that prevent us from sharing
    that kind of information.


    For a city to consider monetizing that information, it’s counter to what we do.
    We collect revenue, but the revenue that we collect is intended for the provisioning
    of the services that we provide, right? We’re not profit-motivated by any means.
    There’s a double-edged sword to that, because not being profit-motivated sometimes
    results in a city not being as efficiency-motivated, not necessarily trying to
    find ways to do more with less or save costs. But not being profit-motivated also
    means you can’t go chase dollars. If you’re chasing dollars, it should be for
    funding the service that you’re providing.


    Q: What about using artificial intelligence? Is that technology being adequately
    leveraged in civic pursuits?


    A: I’d say we’re still in the beginning stages, in the infancy of all that. I
    have a few strategic initiatives that I’m driving for the City of Burbank. And
    I’m trying to stay ahead of where most of the cities are and trying to catch up
    where we might be behind. When I catch up, I want to go beyond. Of course, I’m
    happily sharing everything that I learn, everything I’m doing with all of our
    sister cities. I’ve taken several steps, written several policies and proposals
    and presentations. I did a smart city presentation for the city that got us to
    start thinking about where we stand on that journey and how we can continue to
    become a smarter city.


    I’m trying to push the envelope. And one of those areas includes data analytics.
    We’re building a data and analytics practice here in the City of Burbank where
    it didn’t exist before so that we can find ways to better utilize the data we
    have. Because you’re right, in that cities have a ton of data, but we haven’t
    always put a lot of thought into how we can better use it to improve the services
    that we provide. That could be anything from improving the traffic flow to increasing
    the revenue from parking. Or even predictive criminal enforcement, if you will.
    For example, if there are ways you can determine where a crime may occur, then
    you can better deploy your resources.


    Q: Do you think that runs up against some privacy issues?


    A: We’ll see. I think there’s going to be a journey. There’s going to be a pendulum
    swing. I’d say the pendulum is swinging towards less privacy, at least in public
    spaces, but there’s going to be some problems with that, and it will begin to
    swing back.


    Q: Do you think it perhaps could lead to less privacy in public spaces yet more
    in private ones?'
