- raw: 'Librarians are helping people find the right websites to answer their questions,
    but there’s also a ton of services. They’re working closely with the public through
    informative and collaborative programming. For example, you can go to the library
    if you want to learn about starting your small business. You can attend one of
    their training programs or visit one of their business centers. You can find a
    lot of your information for starting your small business and how to navigate everything
    legally. So, the role of the library hasn’t changed within society. It’s just
    how we access information within the library that has changed.


    Information isn’t at everyone’s fingertips. It’s only at your fingertips if you
    can afford the cost of internet access at home or the cost of having a smartphone
    or a computer at home. We also have issues around connectivity through the major
    ISPs, which have monopolies in various cities. There are major connectivity issues
    in certain areas where the library is legitimately the only access to broadband
    internet for the community. In Alaska, where the connectivity issues are exceptionally
    challenging because of the geography or the terrain, libraries are adversely affected.
    It’s also not cost-effective for Comcast or AT&T to run fiber networks out to
    these very small towns, and the library is often the only place that provides
    that essential service.


    Q: How exactly are libraries and educational institutions today leveraging big
    data analytics to stay competitive in local, state, and federal political spheres?


    A: They aren’t for the most part, and that’s one of the big issues. If we had
    better data and were able to use big data analytics in a more meaningful way,
    we’d have a better understanding of who supports libraries and why. That insight
    leads to an understanding of how to communicate with various demographics of the
    public. For example, how do we talk to conservatives about libraries? How do we
    speak to progressives about libraries? We have a lot of that data, but it has
    never been effectively utilized.


    There’s also a handful of underlying issues that come with that option. The biggest
    one that I can think of is the privacy discussion around using people’s data.
    Libraries are radically supportive of privacy rights. You know, if you check out
    a book at a library, there’s almost no way for anybody to find out what you checked
    out.


    Q: I recall discussions during the drafting of the Patriot Act and specifically
    the controversy over whether the government should have access to who checked
    out books like “The Anarchist’s Cookbook.” Are you suggesting it remains a conflict
    of interest for the libraries?


    A: Yes, but what does that do for us? That bleeds over to the way we market ourselves,
    the way that we use, and leverage big data and how we stay competitive. Because
    the use of that data encroaches on that privacy domain, right? If I have enough
    data about an individual to have a meaningful conversation with them about libraries,
    then depending on how I came across that data, I could violate any number of nuanced
    privacy rules and standards.


    Libraries don’t like keeping any data on their patrons. For example, there was
    a recent issue where [Lynda.com](http://Lynda.com) sells its platform to libraries.
    To use [Lynda.com](http://Lynda.com) through your library for free (you get access
    to all those pieces of training and courses with a library card), you have to
    get a LinkedIn account. And LinkedIn tracks which Lynda courses you access. Librarians
    are upset about the fact that kind of tracking occurs.


    Not having that tracking option also means that LinkedIn can’t target those people
    with marketing that could be beneficial to libraries. It also means that we don’t
    have any data to target our users better, to talk to them about the things that
    they want to learn, or what they want to do in their library. Consider this scenario,
    “I don’t know that you like science fiction books because we don’t keep that kind
    of data, so how can I tell you about new science fiction books that just came
    in?” You see, libraries lose that marketing advantage and partially to their detriment.
    But on the other hand, it’s such a core belief of librarianship that it becomes
    difficult to rationalize.


    Q: Are you concerned that new data privacy laws might make it cumbersome to connect
    with audiences, not just in libraries but in non-profit spaces or for political
    advocacy?


    A: There’s a couple of things that come to mind. Cambridge Analytica, for example,
    was a fascinating scandal because they weren’t doing anything different than what
    anyone else was doing, building data sets around individual voters. It’s just
    that their process for getting that data wasn’t exactly ethical to put it lightly.
    Those same types of data sets are being built by the DNC, the RNC, and others.
    Everybody in politics builds out the same data sets.


    The interesting thing is that the whole thing blew up and underscored the need
    for the GDPR. In the UK, we just launched a national advocacy project with the
    Charter Institute of Librarian Professionals, the professional association for
    librarians. We have to comply with all of those kinds of rules.


    At first, I was concerned about the GDPR being implemented, but what we see in
    the nonprofit base is that these businesses and political organizations are now
    managing their data in a much more productive and efficient way. They’re becoming
    effective at rallying support for their causes, simply because the GDPR mandates
    the kind of data maintenance they should have been doing all along.


    One example is that they were buying bulk email lists, and you can’t just buy
    email lists like that anymore. You can’t just purchase user sets. Ironically,
    the return on those kinds of purchases and those kinds of spends is so minute
    that it’s not even worth it. It’s far more efficient, and you get a much higher
    ROI if you spend your money cultivating opt-ins instead of purchasing lists. So,
    it does make it more cumbersome, because you have to do more strategy. You can’t
    just click a button and have half-a-million people to send an email to. You have
    to think about how to engage these people. How do I get them to opt-in? How do
    I get them to want to find out about this campaign? By thinking about all of those
    considerations, we become far better at raising both money and awareness.


    Q: What about the financial burden imposed by data protection and privacy requirements?


    A: I imagine if you had a list of ten million people to comb through, it would
    be expensive. But if you’re building from scratch, or you have a couple of thousand
    people in your database, it probably isn’t too tricky. I think almost all the
    platforms that I know of today that operate with GDPR in mind already have those
    processes built-in. People opt-out, and the platform does most of it all automatically.
    You don’t have to worry about long hours maintaining this data.


    Q: With the advent of the internet and the surveillance state, are libraries still
    on the front lines of defending privacy and censorship? How do they manage to
    be a nonpartisan resource in the modern era?


    A: Libraries have historically been committed to privacy and ensured none of your
    records are accessible. If you check out a book, there is an electronic record
    while you have it, but once you return it, all that tracking activity is removed
    from the record in all ways, shapes, and forms. Nobody can ever find out what
    you checked out after the fact. You can’t even go back to your library and say,
    “Look, I checked out a book last year. What book was it?” They won’t be able to
    tell you just because they don’t retain any of that data.'
