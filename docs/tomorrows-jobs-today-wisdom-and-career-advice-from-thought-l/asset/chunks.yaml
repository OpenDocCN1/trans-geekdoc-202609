  fmt: '

    In the following set of interviews, we’ll put on our cap and gown and get schooled
    on the origins and implications of privacy from a professor who wrote the first
    modern casebook on the subject. After that, things get a little litigious as we
    take a deep dive into eDiscovery with the co-creator of the Electronic Discovery
    Resource Model. We’ll spend some time in Germany with one of the fathers of enterprise
    content management and examine how the nature of work will be forever changed
    by the technology we’re just getting to know. That insight should prepare us for
    our next adventure into digital transformation with a Microsoft MVP. Next, we’ll
    take a look into how the world’s largest information management company is applying
    AI and analytics to sort out our old records. We’ll end up at the bottom line,
    by keeping it simple with advice from a renowned expert in the global information
    governance industry.


    # Chapter 8


    ## Professing Principles of Digital Ethics and Privacy


    Dr. Anita L. Allen, Vice Provost and Professor, University of Pennsylvania


    **Topics:** Privacy, Social Media


    > “For me, trust has to be earned. It’s not something that can be demanded or
    pulled out of a drawer and handed over. And the more government or the business
    sector shows genuine regard and respect for peoples’ privacy in their actions,
    as well as in their word and policies, the more that trust will come into being.”

    > Dr. Anita L. Allen


    Dr. Anita Allen serves as Vice Provost for Faculty and Henry R. Silverman Professor
    of Law and Philosophy at the University of Pennsylvania. Dr. Allen is a renowned
    expert in the areas of privacy, data protection, ethics, bioethics, and higher
    education, having authored the first casebook on privacy law and has been awarded
    numerous accolades and fellowships for her work. She earned her JD from Harvard
    and both her Ph.D. and master’s in philosophy from the University of Michigan.


    **Q:** Dr. Allen, a few years ago you spoke to the Aspen Institute and offered
    a prediction that “our grandchildren will resurrect privacy from a shallow grave
    just in time to secure the freedom, fairness, democracy, and dignity we all value...
    a longing for solitude and independence of mind and confidentiality...” Do you
    still feel that way, and if so, what will be the motivating factors for reclaiming
    those sacred principles?


    **A:** Yes, I believe that very hopeful prediction will come true because there’s
    an increasing sense in the general public of the extent to which we have perhaps
    unwittingly ceded our privacy controls to the corporate sector, and in addition
    to that, to the government. I think the Facebook problems that have been so much
    in the news around Cambridge Analytica have made us sensitive and aware of the
    fact that we are, by simply doing things we enjoy, like communicating with friends
    on social media, putting our lives in the hands of strangers.


    And so, these kinds of disclosures, whether they’re going to be on Facebook or
    some other social media business, are going to drive the next generation to be
    more cautious. They’ll be circumspect about how they manage their personal information,
    leading to, I hope, eventually, a redoubled effort to ensure our laws and policies
    are respectful of personal privacy.


    **Q:** How do we connect young people with those “sacred” principles when they’re
    growing up in environments that encourage oversharing and lack appreciation for
    the internal monologue?


    **A:** I think what is happening is that even without the private monologue, public
    events are creating a big exclamation point. Even the very young are learning
    that their communications, which they think of as private, are actually revealing
    information about them. Not just revealing information about the exact content
    of what they’re talking about, but also revealing information about their tastes,
    their values, and their preferences and so forth that can be discerned through
    artificial intelligence.


    The normative movement that I once felt was so important around public education,
    and education in the family remains so. But the headlines in the newspapers about
    data breaches and voluntary disclosures of data for commercial and political purposes,
    that kind of information, is out there in the public. It’s teaching the next generation
    of college students and young people about the basis for being concerned about
    their information.


    **Q:** Perhaps the next generation heeds the wisdom of their elders and avoids
    the career pitfalls and reputational consequences of exposing too much on the
    internet?


    **A:** I do think that that’s it as well. Your original question was about my
    prediction that the future would see a restoration of concern about privacy. I
    believe that, yes, as experience shows the younger generation just what the consequences
    are of living your life in the public view and there will be a turnaround to some
    extent. To get people to focus on what they have to lose. All of those consequences
    are causing people to be a little reserved. It would be wonderful if our laws
    and our common law could be rewritten so that the contemporary versions of old
    problems, and completely new issues brought on by global technologies, could be
    rethought in light of current realities.


    **Q:** While our right to privacy isn’t explicitly stated in the U.S. Constitution,
    it’s reasonably inferred from the language in the amendments. Yet today, “the
    right to be forgotten” is an uphill battle. Is legislation insufficient to protect
    privacy in the Information Age, or is the fault on the part of law enforcement
    and the courts?


    **A:** I’ve had the distinct pleasure to follow developments in privacy law pretty
    carefully for the last 20 years, now approaching 30, and am the author or co-author
    of numerous textbooks on the right to privacy, and so I’m familiar with the legal
    landscape. I can say from that familiarity that the measures we have in place
    right now are not adequate. It’s because the vast majority of our privacy laws
    were written literally before the internet, and in some cases in the late 1980s
    or early 1990s or early 2000s as the world was vastly evolving. So yes, we do
    need to go back and refresh our communications and children’s internet privacy
    laws. We need to rethink our health privacy laws constantly. And all of our privacy
    laws need to be updated to reflect existing practices and technologies.


    The right to be forgotten, which is a right described today as a new right created
    by the power of Google, is an old right that goes back to the beginning of privacy
    law. Even in the early 20th century, people were concerned about whether or not
    dated, but true information about people could be republished. So, it’s not a
    new question, but it has a new shape.


    **Q:** The Fourth Amendment to the Constitution was intended to protect Americans
    from warrantless search and seizure. However, for much of our history, citizens
    have observed as surveillance has become politically charged and easily abused.
    How would our founders balance the need for privacy, national security, and the
    rule of law today?

    '
  trans: '


    在接下来的系列采访中，我们将穿上学位服，向一位撰写了该领域首部现代案例集的教授请教，学习隐私的起源与内涵。之后，情况将变得更具法律诉讼色彩，因为我们将与“电子发现资源模型”（Electronic
    Discovery Resource Model）的共同创建者深入探讨“电子发现”（eDiscovery）。我们将在德国与企业内容管理之父之一共度一段时光，并审视我们刚刚开始了解的技术将如何永远地改变工作的本质。这种洞察将为我们与一位微软
    MVP 共同开启的下一场数字转型之旅做好准备。接下来，我们将看看全球最大的信息管理公司如何利用人工智能和分析技术来处理我们的旧记录。最后，我们将通过来自全球信息治理领域知名专家的建议，以简单明了的方式回归核心问题。


    # 第 8 章


    ## 阐述数字伦理与隐私原则


    阿尼塔·L·艾伦博士，宾夕法尼亚大学副教长、教授


    **主题：** 隐私、社交媒体


    > “对我而言，信任必须通过努力赢得。它不是那种可以索取或从抽屉里拿出来递给你的东西。政府或商业部门在行动、言论和政策上对人们的隐私表现出真正的关注和尊重，信任就会随之产生。”

    > 阿尼塔·L·艾伦博士


    阿尼塔·艾伦博士担任宾夕法尼亚大学教务副校长以及亨利·R·西弗曼法律与哲学教授。艾伦博士是隐私、数据保护、伦理、生物伦理和高等教育领域的知名专家，她撰写了第一本隐私法案例集，并因其工作获得了众多荣誉和奖学金。她在哈佛大学获得法学博士（JD），并在密歇根大学获得哲学博士和哲学硕士学位。


    **Q：** 艾伦博士，几年前您在阿斯彭学会发表演时给出的预测：“我们的孙孙辈将及时把隐私从浅的坟墓中复活，以确保我们所有人所珍的自由、公平、民主和尊严……一种对孤独、思想独立和保密性的渴望……”您现在仍然这么想吗？如果是，夺回这些神圣原则的动力因素将是什么？


    **A：** 是的，我相信那个非常有希望的预测会成真，因为公众越来越感觉到，我们或许已在无意中将隐私控制权交给了企业部门，此外还交给了政府。我认为，围绕剑桥分析公司（Cambridge
    Analytica）引发广泛关注的 Facebook 问题让我们变得敏感并意识到，仅仅通过做一些我们喜欢的事（比如在社交媒体上与朋友交流），我们就把自己的生活交到了陌生人手中。


    因此，这类披露事件，无论是发生在 Facebook 上还是其他社交媒体平台，都将驱动下一代人变得更加谨慎。他们会对管理个人信息保持审慎，我希望这最终会导致我们加倍努力，确保我们的法律和政策尊重个人隐私。


    **Q：** 当年轻人在那种鼓励过度分享且缺乏对内心独白赏识的环境中长大时，我们如何将他们与那些“神圣”的原则联系起来？


    **A：** 我认为正在发生的情况是，即使没有内心独白，公共事件也创造了一个巨大的感叹号。即使是年幼的孩子也在学习，他们认为是私密的通信实际上揭示了关于他们的信息。这不仅揭示了他们谈论的具体内容，还揭示了他们的品味、价值观、偏好等，这些都是可以通过人工智能被识别出来的。


    我曾经认为公共教育和家庭教育中的规范运动非常重要，现在依然如此。但报纸上关于数据泄露以及商业和政治目的自愿披露数据的头条，这类信息正暴露在公众面前。它正在教下一代大学生和年轻人关注他们信息的依据。


    **Q：** 也许下一代人应该听取长辈的智慧，避免在网上的职业生涯陷阱和声誉后果？


    **A：** 我确实认为如此。你最初的问题是关于我的预测：未来将看到对隐私的关注回归。我相信，是的，经验表明，人们在公众视野下生活会失去什么。这些后果正导致人们变得更加保留。如果我们的法律和普通法能够重写，以便对旧问题的现状以及全球技术带来的全新问题进行重新思考，那将太好了。


    **Q：** 虽然我们的隐私权在美国宪法中没有明确规定，但可以从修正案的语言中合理推断出来。然而在今天，“被遗忘权”是一场艰苦的战斗。是信息时代的立法不足以保护隐私，还是问题在于执法部门和法院？


    **A：** 在过去的 20 年里（现在接近 30 年），我有幸幸能密切关注隐私法的发展，并撰写或合著了多部关于隐私权的教科，因此我对法律格局非常熟悉。基于这种熟悉感，我可以说，我们目前采取的措施是不够的。这是因为我们大多数隐私法律是在互联网之前编写的，在某些情况下甚至是在
    20 世纪 80 年代末、90 年代初或 21 年代初，那时世界正在发生剧烈变化。所以是的，我们确实需要回归并刷新通信和儿童互联网隐私法。我们需要不断重新思考健康隐私法。我们所有的隐私法律都需要更新以反映现有的实践和技术。


    被遗忘权在今天被描述为 Google 等力量创造的新权利，但它是一项追溯到隐私法初期的古老权利。即使在 20 世纪初，人们也担心过去的真实信息是否可以再次出版。因此，这不是一个新问题，但它有了新的形状。


    **Q：** 宪法第四修正案旨在保护美国人免受无证搜查和扣押。然而，在我们历史的大部分时间里，公民观察监控变得充满政治色彩并容易被滥用。我们的开国者今天会如何平衡隐私需求、国家安全和法治之间的关系？


    '
