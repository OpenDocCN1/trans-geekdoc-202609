    trying to bridge an analog-to-digital transition. That’s given us an incredible
    perspective on legacy approaches, legacy systems, and legacy decisions against
    how new technologies and techniques can completely change our work. It’s time
    to lift our heads and look around and talk to each other. I’m so glad you are
    doing this through this series of interviews. Although we need to be experts in
    our corner of the field – legal, entertainment, historical records, corporate
    governance, we need each other now more than ever to discover where our collective
