    \ analytics. He has co-edited four books, published over 50 peer-reviewed papers,\
    \ and previously served as the Program Director for the Center for Intelligent\
    \ Decision Systems at the University of Melbourne. Dr. Rao received his Ph.D.\
    \ in finance technology from Melbourne University, his master’s from the University\
    \ of Sydney, and his MSc in computer science from the Birla Institute of Science\
    \ and Technology.\n\nQ: Dr. Rao, how has the relationship between academic institutions\
    \ and the business world evolved in the era of big data and analytics? Is it a\
    \ balanced symbiotic relationship, and what are its benefits for startups and\
    \ students alike?\n\nA: If you’re talking about the AI and big data world, one\
    \ of the challenges that academics have in this area is that they’ve always tended\
