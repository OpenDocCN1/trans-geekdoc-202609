- raw: "In the following set of interviews, we’ll put on our cap and gown and get\
    \ schooled on the origins and implications of privacy from a professor who wrote\
    \ the first modern casebook on the subject. After that, things get a little litigious\
    \ as we take a deep dive into eDiscovery with the co-creator of the Electronic\
    \ Discovery Resource Model. We’ll spend some time in Germany with one of the fathers\
    \ of enterprise content management and examine how the nature of work will be\
    \ forever changed by the technology we’re just getting to know. That insight should\
    \ prepare us for our next adventure into digital transformation with a Microsoft\
    \ MVP. Next, we’ll take a look into how the world’s largest information management\
    \ company is applying AI and analytics to sort out our old records. We’ll end\
    \ up at the bottom line, by keeping it simple with advice from a renowned expert\
    \ in the global information governance industry.\n\n[Chapter 8](#nav.xhtml#toc13)\n\
    \n## [Professing Principles of Digital Ethics and Privacy](#nav.xhtml#toc13)\n\
    \nDr. Anita L. Allen, Vice Provost and Professor, University of Pennsylvania \
    \ \n\nTopics: Privacy, Social Media\n\n> “For me, trust has to be earned. It’s\
    \ not something that can be demanded or pulled out of a drawer and handed over.\
    \ And the more government or the business sector shows genuine regard and respect\
    \ for peoples’ privacy in their actions, as well as in their word and policies,\
    \ the more that trust will come into being.”  \n\n> Dr. Anita L. Allen\n\nDr.\
    \ Anita Allen serves as Vice Provost for Faculty and Henry R. Silverman Professor\
    \ of Law and Philosophy at the University of Pennsylvania. Dr. Allen is a renowned\
    \ expert in the areas of privacy, data protection, ethics, bioethics, and higher\
    \ education, having authored the first casebook on privacy law and has been awarded\
    \ numerous accolades and fellowships for her work. She earned her JD from Harvard\
    \ and both her Ph.D. and master’s in philosophy from the University of Michigan.\n\
    \nQ: Dr. Allen, a few years ago you spoke to the Aspen Institute and offered a\
    \ prediction that “our grandchildren will resurrect privacy from a shallow grave\
    \ just in time to secure the freedom, fairness, democracy, and dignity we all\
    \ value... a longing for solitude and independence of mind and confidentiality...”\
