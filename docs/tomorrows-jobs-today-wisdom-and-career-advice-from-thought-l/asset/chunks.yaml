    A: 任何受 `GDPR` 约束的公司在实施这些要求时都应格外小心。在它生效之前，数据保护并不是公司的首要任务。现在范式即将发生变化，主要归因于可能产生的巨额罚款和潜在的声誉损害。`GDPR`
    的实施将要求修订内部程序，某些情况下任命数据保护官（`DPO`），并对所有流程进行映射和评估。遵守所有国家和欧盟法律法规已变得复杂且昂贵。数据保护并不一定构成例外。


    # 第 18 章 合规的未来


    ## Miguel Airlot，合伙人


    关于话题：合规，数据保护


    > “为了建立一个强大的合规计划，数据保护至关重要。”


    > Miguel Airlot 是一位律师兼数据保护官（`DPO`），在合规方面拥有丰富的经验，并在比利时布鲁塞尔广泛教授合规的话题。他在鲁汶天主教大学（`Université
    Catholique de Louvain`）获得了本科学位，并在根特大学（`Ghent University`）获得了法律硕士学位。


    Q: Miguel，你是如何转向金融和合规领域的？


    A: 金融领域一直令我着迷，因为它非常依赖信任。没有投资者对金融机构的信任，就没有创新的空间。由于 `GDPR` 规则生效，合规已变得日益复杂且昂贵。自去年以来，任何在金融行业工作并观察到违反
    `FSMA` 负责执行的金融法律规则的个人，都可以直接向 `FSMA` 举报。举报人的身份将保密，法律保护任何出于善举报违规行为的个人。


