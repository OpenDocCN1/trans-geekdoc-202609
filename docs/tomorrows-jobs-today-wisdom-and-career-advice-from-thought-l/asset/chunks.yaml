    What has changed over the last few years is the rise and tide of data privacy
    concerns driven by global legislation. That need to address privacy issues has
    opened up opportunities to get funding for information governance activities.
    If you get your electronic house in order, good things can flow. You can do a
    much better job of addressing your privacy needs and challenges. I think privacy
    is going to lead to some dramatic changes in the next one, two, and three years
    for information governance and electronic discovery, as well as in related areas.
    I think it’s going to be very interesting and exciting times for those disciplines.


    ## Q: These interviews touch on global management perspectives. I understand you
    spent some time with the Peace Corps. What did you learn from that experience
    that you’ve carried into your career?


    A: The old marketing slogan for the Peace Corps was the toughest job you’ll ever
    want. And I think that’s the best one-line description of my experience. I got
    a level of responsibility at a young age that I could only have received in a
    limited number of ways. It was a lot of responsibility with very little structure
    or guidance. I was out in the middle of nowhere, a long way from any support systems,
    working with my local counterparts who were similarly situated. We had to figure
    out how to get things done ourselves and not count on support from anyone.


    It was often a confusing and chaotic environment where the goals were very poorly
    defined. There was a lot of confusion. It sounds a lot like the world of electronic
    discovery, especially in its early days. So that was a part of the value. The
    more considerable value, though, is that it helped open my eyes to a better understanding
    that there is an enormous world out there. People approach things in different
    ways with different motivators, and at the same time, I recognized some commonalities.


    I had to learn a completely different language, French, as well as enough of the
    local languages to do some basic navigation in the marketplace. It’s not that
    different from having to figure out things like electronic discovery where there
    wasn’t even a language when we started studying it. To try and understand cultural
    differences is kind of like figuring out the differences between how lawyers and
    how IT professionals approach things. Two different worlds that don’t necessarily
    historically communicate with each other very effectively. But there are a lot
    of commonalities, and the best approach is just appreciating how big and complex
    the world is when combined with the possibility you might be able to make a difference.


    ## Q: How did you choose this career? Or did this career choose you?


    A: Several different things converged. My freshman year in high school, this was
    1972, I took a course on computer programming, `BASIC`. In my sophomore year,
    I took one on `Advanced BASIC`, and I think `Pascal`. I spent much of my free
    time in high school writing code for the fun of it.


    I went to college and had nothing to do with computers. Then I was a Peace Corps
    volunteer. Nothing to do with computers. I didn’t even have electricity. But,
    coming back in 1983, I saw the `IBM PC` and realized that the world had changed
    while I was gone. Oh, man. Bought an `Apple Macintosh` the first month they were
    available for purchase. I took that with me to law school. I got frustrated with
    the very ethereal nature of law school and got involved at the first opportunity
    in the legal aid clinic.


    In my second year, `IBM` donated a half dozen `PCs` to law school. The dean said,
    “I’m not sure what we can do with these in the classroom, but I think there’s
    a place for them in the clinic.” He gave them to the director who, in turn, looked
    at me and said, “You’ve got a computer. Go figure out what to do with these.”
    I wrote a matter management system because there wasn’t any `PC` networking in
    place yet. But it allowed us to manage our matters on those computers. Then I
    showed up at my first law firm, and they handed me a `Dictaphone` and said, “See
    how technologically advanced we are?” I thought, “What have I done to myself?”


    So, I brought my computer into work, and two things happened. One, a steady stream
    of senior associates and junior partners came into my office, shut the door, sat
    down, and delivered the same message. It was “Lose the computer. Real attorneys
    do not type. You will never be taken seriously as a lawyer if you have a computer
    on your desk.” Well, we know that’s not how things played out.


    At the same time, I got pulled into the largest set of cases the firm had ever
    handled, in part because I had that giant computer on my desk. We were going to
    have a million documents that were going to be coded, and that information was
    going into another computer somewhere. I had a computer, so there you go. I was
    put in charge. All of that eventually pulled me into the world of eDiscovery.
    I was just a few years in when our IT Director was hired away, and I was the functioning
    IT guy for a year and a half. After that, there was no escaping electronic discovery.


    # Chapter 10


    ## Emerging from the Dense Digital Fog


    Dr. Ulrich Kampffmeyer, Managing Director, Project Consult


    Topics: Enterprise Content Management, Artificial Intelligence


    > “With AI looming ahead, we may even have to redefine what work is. Man is no
    longer the scale, the ruler, the canon.”


    > Dr. Ulrich Kampffmeyer


    Dr. Ulrich Kampffmeyer is the Managing Director of Project Consult in Hamburg,
    Germany, and a renowned expert on digital transformations, business intelligence,
    and enterprise content management. He holds a master’s in archaeology and completed
    his Ph.D. in prehistory at the University of Göttingen.


    ## Q: Ulrich, you write and teach about cultural and social changes in work environments
    that are a direct result of the emergence of digital transformations now that
    data is at everyone’s. What change has the business world experienced?


    A: The pace of digital transformation accelerates day by day. Cloud technologies,
    artificial intelligence, `IoT`, and other developments are happening so fast that
    there is a danger they’ll get out of control. The mightier AI becomes, the larger
    the danger that it gets uncontrollable.


    Consider Shoshana Zuboff, one of the first tenured women at Harvard Business School,
    and her three laws:


    *   Everything that can be automated will be automated.

    *   Everything that can be informated will be informated.

    *   Every digital application that can be used for surveillance and control will
    be used for surveillance and control.


    Neither our businesses nor society is currently prepared for those changes. Just
    have a look at the General Data Protection Regulation discussions on data protection
    as a general necessity, data safety as the requirement for continuity, data privacy
    by default, information governance to keep control, keep the value, keep information
    accessible, and so forth. These are basic requirements that should not be ignored
    like in the past. Future historians will call our era the dark age of the early
    information society.


    Q: You spent quite a bit of time at the Fraunhofer Institute, developing imaging
    systems and processes to support archaeological studies. Given that images provide
    so much of the fuel for artificial intelligence engines, do you envision some
    of our older legacy systems and indexes providing value to future AI efforts?

