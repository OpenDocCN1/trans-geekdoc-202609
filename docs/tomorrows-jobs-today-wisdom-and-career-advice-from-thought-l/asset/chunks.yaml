- raw: "Consider the demonstrable catastrophic effects of a data breach or ransomware\
    \ attack. That immediate threat is why the relationships between stakeholders\
    \ on an IG team must remain candid, respectful, and informed. An impulsive decision\
    \ or misdirected motive can end up exposing a vulnerability in the system or much\
    \ worse. What makes a successful information governance team or program? You can\
    \ have a solid roadmap and the best tools, but it’s all dead in the water unless\
    \ you have good relationships that bond your team.\n\n## Hail to the Chieftains\n\
    \nThe analogy of corporate teamwork to that of professional sports is worthy of\
    \ application in the context of information governance. In 1952, the little known\
    \ but highly accomplished Seattle Chieftains college basketball team exemplified\
    \ teamwork during an era of tremendous social change.\n\nIt’s a shame that the\
    \ fabled sportswriter Mickey Gordon isn’t around anymore to share his first-hand\
    \ accounts of those players because he tells the story better than we ever could.\
    \ But the gist is that people growing up back then felt the Chieftains represented\
    \ the very best of America, and in some ways, the best of a country still stuck\
    \ under the thumb of Jim Crow. The Seattle Chieftains were an unlikely band of\
    \ brothers who defended each other on the paint and the road of life.\n\nThe secret\
    \ was in their diversity. In the 1950’s it was quite a big deal to have Catholics,\
    \ Jews, Blacks and Caucasians all on the same team. Despite a poorly funded program\
    \ and incredible competition, thanks to the relationships they developed with\
    \ one another, the Chieftains made it to both the NCAA and the National Invitational\
    \ Tournaments. Those successes may be a lifetime ago, but they’re certainly not\
    \ ancient history. The obstacles and challenges we all face as individuals and\
    \ teams may be a litt le diﬀerent now, but the best solutions remain very much\
    \ like they were in 1952, baked in the perfect balance between individuality and\
    \ unity. If we can see past the colors on our faces, we always find that we’re\
    \ still wearing the same jerseys.\n\nThat was the formula behind the Seattle Chieftains\
    \ and the ingredients for effective information governance programs. It’s about\
    \ harnessing the power of working relationships in the Information Age. Staying\
    \ in the position, but seeing past the material qualities of the individual gets\
    \ you the right expertise and ultimately to the goal line.\n\nSourcing the knowledge,\
    \ experience, and talent from each team member makes you virtually unstoppable.\
    \ Highly successful sports teams like the Chieftains have proven, coordinating\
    \ talent into a coherent, productive, sustainable strategy is the best way to\
    \ win, and win consistently.\n\n## A new way to set the table\n\nAt Compliance\
    \ and Privacy Partners, we work with highly regulated, US-based companies that\
    \ have lots of talented folks. They’re subject to many laws from HIPAA to the\
    \ CCPA to a multitude of tricky financial rules. However, our solutions are only\
    \ as effective as the commitment of our client’s stakeholders to their own efficiency\
    \ and compliance goals. Successful digital and information governance transformations\
    \ require capital investment and executive sponsorship, but above all, a culture\
    \ that values relationships. Directives may come from the top, but as they cascade\
    \ down through the organization, it’s the relationships between managers that\
    \ ultimately determine whether the direction is ultimately successful.\n\nNo matter\
    \ where our position sits in the organization, we can always find opportunities\
    \ to benefit both ourselves and our teams. Today’s leaders understand that to\
    \ make a difference in an increasingly crowded field they’ll need to:\n\n*   •Build:\
    \ relationships with IT, risk, legal, compliance\n\n*   •Plant: seeds and be the\
    \ gardener, not the flower\n\n*   •Nurture: the right talent to execute and maintain\
    \ the vision\n\nStrong leaders in the Information Age know how to build and encourage\
    \ the right types of relationships for themselves and among their peers. We plant\
    \ seeds, create synergy, and remember to nurture tomorrow’s talent. It’s one way\
    \ of reminding ourselves that nobody is an island, and the ocean around us remains\
    \ a boundless sea of opportunity.\n\n## Aligning people with policy and policy\
    \ with technology\n\nInformation governance as a discipline has already proven\
    \ its ROI to corporations around the globe by demonstrating the value of aligning\
    \ policy pillars and best practices with state-ofthe-art technology. As AI, IoT,\
    \ and big data continue to evolve as both operational necessities and revenue\
    \ streams, it becomes essential to apply governance. IG is also a young discipline\
    \ being exploited by some opportunistic vendors and consultants.\n\nOur strongest\
    \ recommendation for new practitioners of IG, no matter what specialty they come\
    \ from, is “don’t put the cart before the horse” when committing to transforming\
    \ your organization. Spend enough time building relationships with the business.\
    \ Develop your strategy in line with their business goals. Set the table with\
    \ the right stakeholders and remember to align your policies with your people\
    \ and your technology.\n\n## Don’t burn too many bridges\n\nThe keyword in the\
    \ adage that you can’t make a lot of money without making a few enemies is few.\
    \ Like my father, the basketball player, or that old soldier from New Mexico,\
    \ my Mother never wanted to find herself in a new room with an old enemy. By treating\
    \ everybody with dignity, she managed to avoid burning many bridges. And for every\
    \ bridge she burned, she’s probably built a hundred more. When a job, project,\
    \ or a deal doesn’t go your way, you must strive to take the high road and never\
    \ make it personal. You never know what the future brings or if a relationship\
    \ you recklessly dismissed in years past might be holding back the keys to a new\
    \ opportunity.\n\n## Just a few more folks you should meet\n\nOur last series\
    \ of interviews in this collection illustrates how relationships are indispensable\
    \ for a long and successful career in any era, but especially in the Information\
    \ Age. We open with a briefing at the Department of Defense with information that\
    \ may not be confidential but should certainly be taken to heart. We proceed to\
    \ the doctor’s office, where an informatics expert takes the temperature on the\
    \ quality of data in the medical world. Our checkup complete we head to the library\
    \ where one of the institution’s fiercest advocates makes a case for supporting\
    \ this public necessity. A civic leader and data protection steward in Los Angeles\
    \ then picks up that baton and hands it to a compliance specialist from Brussels\
    \ who shares his know-how on the regulatory institutions and individuals running\
    \ them. Close to the finish, we crack open a studio vault with one of the most\
    \ accomplished archivists in Hollywood before concluding with the practical perspectives\
    \ of a recruiter looking to fill Tomorrow’s Jobs Today.\n\n[Chapter 14](#nav.xhtml#toc20)\n\
    \n## [Defending Freedom with Information Management](#nav.xhtml#toc20)\n\nMark\
    \ Patrick, Chief of Information Management, Joint Staff, US Department of Defense\
    \  \n\nTopics: Knowledge Management, Cybersecurity\n\n> “Public sector practitioners\
    \ mingling with their private sector counterparts creates mutual benefit. Like-minded\
    \ end-users collaborate. Customer-client relationships are formed. Lessons learned\
    \ and best practices are shared.”  \n\n> Mark Patrick\n\nMark Patrick, CIP, leads\
    \ the Joint Staff’s Information Management Team at the United States Department\
    \ of Defense in Washington, D.C. He is a recognized thought leader in digital\
    \ transformation, intelligent information, and knowledge management. He earned\
    \ his bachelor’s in foreign affairs from the University of Virginia and his master’s\
    \ from Tufts University Fletcher School of Law and Diplomacy."
