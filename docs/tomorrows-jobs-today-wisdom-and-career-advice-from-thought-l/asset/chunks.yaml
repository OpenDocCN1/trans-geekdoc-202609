    答：我有一个大约 90 人的部门，我努力确保他们理解，他们的首要任务是自己，次要任务是家庭，第三要任务是工作。我不断向我的部门反复这一点，当涉及到个人面临自己的问题时，我尽力确保他们关注正确的事情。他们必须理清自己的优先顺序，并且相信如果他们来找我并需要休几天
    `PTO`（带薪假），我会理解，并将将其置于审计需求之前。


    审计总会发生；工作总会进行；`L.A. Care` 会继续存在。最紧迫的事情是这些人要照顾好他们自己和他们的家人。这可能源于我是一个家庭医生或者是一个顾家的人，但这种观念根植于我心中。我需要确保每个人都知道这一点，这已经深入人心。


    尽管如此，我必须努力做出榜样。这部分并不容易。我经常收到同事的抱怨，说我并不总是能做到行合一。所以，每天我也必须在这方面下功夫。我需要什么时候上班？什么时候可以下班？我需要从早上
    7 点一直到晚上 7 点吗？我需要成为那个负责编辑和审核进出部门的所有文档的人吗？我想在这些方面做得更好，但我认为这是一个熟悉的挑战。


    问：我们现在有了社交媒体这个概念，它成为人们开始审视自己的棱镜，每个人都必须有自己的品牌。这是一种巨大的压力，我认为没有人曾预料到这一点。这是如何影响人们的工作生活的？


    答：嗯，千禧一代是伴随着这些贴在手中的设备长大的一代，更晚的代更是如此。我关于这方面的个人经历之一是我值班时。那时我有一个传呼机，每当那个声音响起时，我都会产生生理反应。你知道你要去接宝宝了，或者必须去
    `ICU`（重症监护室）或 `ED`（急诊室），或者将面临一个非常紧张的情况。我现在的进展是，我的手机几乎从不开启响铃。目前我一直一直处于震动模式。有时我并不注意它。我会把它收起来，在晚上，我可能整晚都不会去管它。


    你必须找到适合自己的方法。有些人是工作狂，他们想每周每一天都工作。这没关系，但我确实想尝试倡导并激励一种更好的平衡。


    问：你在医学领域取得了成功，现在你沉浸于信息学和业务优化。你的医学训练是如何影响你解决其中业务部分的方法的？


    答：我认为首先，在医学中，我们学习评估一个情况，接收数据，尝试弄出鉴别诊断是什么。你永远不会试图直接给出解决方案。你想看到在所有相关场景下所有可能的解决方案。我从某种程度上把鉴别诊断看作是根源分析，在得到最终答案之前，你会考虑所有的可能性。然后，当我们得到最终答案时，我们使用数据。


