    # Narrative Responses


    If the impression fits a survival narrative, the middle manager hits the panic
    button, initiating a fight, flight, freeze, or feign/appease response. In rapid
    succession, our brain floods our entire body with adrenaline and other stress
    hormones, our heartbeat quickens, vascular system contracts, field of vision narrows,
    and so on.


    However, if the impression fits an opportunity narrative, the middle manager hits
    the desire button, initiating a consideration or pursuit response.


    Sensing no immediate threat and plausible upsides, the middle manager kicks it
    up to the chief executive officer to decide what will likely happen next and what
    to do about the commotion.


    For the most part, this has worked pretty well for human beings. However, the
    process comes with a few exceptions and variables.


    ### The Delphic Curse

    Most predictions are simply wrong. Digging deeper, those predictions that most
    people consider plausible are often the most errant. And the most implausible
    or farfetched predictions often turn out to be most accurate. But, so what? Nobody
    believes them!


    ### The More Things Change

    To update the old and somewhat cynical French proverb, amidst our times of great
    change, a surprising number of things stand unchanged, immutable. Of course, most
    of these things hide in plain sight and require “piercing the veil of tranquilized
    obviousness.”


    ### Shut-down Syndrome

    Rapid change of environments overwhelm our brains’ ability to make sense. Unless
    we take measures to counteract this response, our brains will compel us to choose
    the familiar or mediocre option or to avoid criticism. In part, we can avoid this
    by learning from others about how they navigated the vagaries and vicissitudes
    of their lives.


    ### Uneven distribution

    The future arrives unevenly distributed. Some of us have already immigrated to
    the world of hyper-connectivity and intelligent assistance, putting surfboards
    into water with the aim of surfing the next trillion-dollar wave of innovation,
    wealth creation, and disruption. Some of us see the winds of change on the distant
    horizon, believing that we have the luxury of two to three years to make a change.
    Many believe their window has already opened and closed. Just like jumping from
    a skyscraper, they feel there’s zero doubt they’ll hit the ground. Still, others
    of us don’t see anything in our way, nor do we believe that anything bad will
    happen. We’ll continue to just keep on, keeping on. Who’s right? “Well, even if
    I knew, no one would believe me!”


    ### Opportunity and Innovation Diffusion Curves

    We can count on the fact that entrepreneurs and technology enterprises will continue
    to invent, innovate, and disrupt the status quo. For the foreseeable future, there
    will be jobs and careers for speeding the introduction and adoption of new technologies
    and building operationalization capabilities (accountabilities, workflows, and
    systems). Experimenters, early adopters, early majority, late majority, and laggards
    will all have jobs to do. However, we will discover that we must now cycle quickly
    through all those jobs.


    # Navigating the Future


    And that’s where this book can aid both the young professional and the seasoned
    executive.


    Rafael and Abby have interviewed dozens of accomplished and forward-thinking industry
    leaders and innovators to present their observations about several technologies
    and trends. This alone will give you tons of insight and background on a burgeoning
    array of developments.


    However, most of what they will say about YOUR future might miss the mark by miles.
    That’s a good thing: it will be only through your unique perspective that you
    will see opportunities that hide in plain sight of YOUR world.


    What remains the same amidst all this change? Decency, dignity, fairness, discernment,
    and flexibility.


    Now more than ever, the world rewards those who parlay small wins into stupendous
    gains, who play to their individual strengths, who learn how they learn, and who
    know that most of what’s good in the world resulted from high performing teams
    and their leaders.


    So be that guy or gal.


    As you read these interviews, pay attention to more than just the particular concepts
    and technologies.


    Pay attention to the narratives, the story logic, and themes that each interviewee
    brought to their situations and opportunities.


    Pay attention to how they made sense of THEIR world, considering their social
    and cultural norms as well as their particular beliefs, talents, and lucky breaks.


    Dive head-first into their narratives, immersing yourself in their world, paying
    rapt attention to the whispers and nudges of YOUR intuition and Greater Imagination.


    If you so choose, read between the lines, discerning their `Beliefs` (cause effects)
    and `Context of Being` (who must one be, then and there, to have had those experiences
    and recollected or abstracted those experiences in these words that I now read?).


    As you get a sense of their worldview, have them coach or mentor you about your
    current situation, goals, and challenges.


    As you read these interviews, also have them read you: Use them as prompts or
    cues of your Greater Imagination or self.


    As you read about their particular job, know that it’s possible it may soon no
    longer exist as an economically sustainable engagement.


    But do know that the ultimate meta job is about how to design the ideal job, the
    job that fits you, hand and glove. The job that plays to your strengths, the one
    that demands your personal excellence and that you will find worth doing even
    if it does not pay top bracket salary!


    So, your shot on goal here is simple: learn how to design your ideal job for tomorrow,
    using the sense-making criteria and narratives of those whose shoulders you stand
    on today.


    Michael Jay Moon

    CEO, `GISTICS` and Gratitude Games

    Author, Firebrands: Building Brand Loyalty in the Internet Age


    # Acknowledgments


    We tend to credit the knowledge we’ve acquired throughout the years as either
    a direct benefit of our education or an indirect blessing of life’s humbling experiences.
    Yet, whether we studied at Oxford or the School of Hard Knocks, we recognize that
    gaining wisdom is worthier than any mastery of facts, figures, and skillsets.


    Wisdom is the reasoned synthesis and acute application of knowledge to life’s
    greater goals and meaning. It’s a gift and collective treasure that requires years
    if not generations of blood, sweat, and tears, trial and error, heroism and tragedy
    to be honed, survive judgment, and be passed along to new stewards. Wisdom travels
    from mother to son, father to daughter, teacher to pupil, from master to fellow
    to apprentice. It is sweetest when given freely and most bitter when taken for
    granted. We can’t put a price on this invisible commodity. We can only hope to
    repay those charitable enough to have shared it with us.

    '
