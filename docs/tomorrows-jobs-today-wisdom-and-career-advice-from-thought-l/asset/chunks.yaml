- raw: "A: Yes and No. We have an open API, and that lets banks, mobile operators,\
    \ and others integrate with BanQu. Also, we integrate with backend accounting\
    \ systems, ERP’s, inventory management, record-keeping systems, and so forth.\
    \ So, when these steps are happening, clients are already starting to do their\
    \ analysis because they can say, hey, we’re starting to see a good quality crop\
    \ in this region. We’ve had cases where the fraud detection piece, because of\
    \ blockchain, is already showing results because everybody entering the supply\
    \ chain is known and wants to be known. Everybody is now getting a copy of the\
    \ transaction they participate in and its improving transparency.\n\nFrom a data\
    \ analytics perspective, the big brands like us because now it gives them the\
    \ visibility into their last mile that they never had. Especially from a cash\
    \ flow perspective, from a standpoint of trying to reduce fluctuation around receivables,\
    \ supply chain insurance, and production planning. In a lot of these markets,\
    \ it’s all cash-based and manual 90-day reconciliation process to complete.\n\n\
    Having said all that, we don’t own anybody’s data, which is a key piece. We will\
    \ never own anybody’s data because that would then defeat the purpose of creating\
    \ a blockchain application. So, the data ownership is with the brand in terms\
    \ of the transactions that they are participating in, but the data ownership is\
    \ also with the farmer or the homeless person or the refugees. They now have a\
    \ copy of their data that they can use.\n\nThe way we built it, the end-user can\
    \ now prove their existence or the right to be forgotten. So, we have this permission-based\
    \ ledger where the farmer can say, “I want to be able to show a bank my data.”\
    \ And he can give permission to the bank. Or she could say, “I don’t want to participate\
    \ anymore, and I have the right to go dark.” Because at the end of the day, that\
    \ last mile farmer in BanQu has the ability to own, access, monetize, and permission\
    \ their data. So, the analytics applies but not at the last mile.\n\nQ: One of\
    \ the goals in conducting these interviews is gaining a better understanding of\
    \ the evolving role of data and its impact on society and governance. You’ve lived\
    \ and worked with people on all levels of the pyramid. What role is blockchain\
    \ playing here?\n\nA: Occasionally, people push back on the work we do and say,\
    \ you know, farmers aren’t literate. And I take offense to that because I’ve never\
    \ met a farmer or any person in poverty who said, “Don’t tell me how much crop\
    \ or garments or diamonds I sold you,” or “don’t tell me the price or confirmation\
    \ of the payout.” So actually farmers, miners, garment workers, they’re very literate\
    \ and brilliant. Here’s the data issue there. And it has a big implication for\
    \ governance. In my past life, I worked in Sarbanes-Oxley, in compliance and audit,\
    \ on segregation of duties. I was deep into the compliance framework and familiar\
    \ with all those kinds of issues. In the example of the farmer I’ve given, what\
    \ happens is that the world takes for granted that the farmer’s data rights don’t\
    \ exist. The rights for poor women that are growing your coffee are compromised\
    \ every day. We took a different approach and found that distributed ledger blockchain\
    \ technology empowers the poorest while strengthening the largest global brands.\n\
    \nIf you decouple the currency side, blockchain is immutability, consensus. Currency\
    \ is currency. The real value is consensus and immutability. And that’s where\
    \ a lot of people miss the true value of blockchain. We took an approach saying\
    \ the farmer, the slave labor that’s making the jeans, and also the refugee, should\
    \ have bleed control over all the data that he or she is either forced to participate\
    \ or is willing to participate in. And that has kind of solved part of the confusion\
    \ around the General Data Protection Requirement and data privacy because at the\
    \ end of the day, if you implement it the right way, which we’ve proven in the\
    \ last 18 months, the farmer owns their data, right?\n\nSo, if the farmer is selling\
    \ to the coffee company, but the coffee company says, “Hey, I don’t want to buy\
    \ your coffee from now on,” in today’s world, that coffee company is just going\
    \ to walk away with all this amazing data on the farmer. That’s the way the world\
    \ works today. Yet if you use blockchain, yes, the farmer and the coffee company\
    \ relationship changes. The company walks away with all this data, but the farmer\
    \ now has a copy of the data that nobody can ever take away. That’s how we implement\
    \ it. And that’s why we’re upfront. BanQu doesn’t own anybody’s data. And at the\
    \ end of the day, if my bank customer goes away, in my last mile, because we have\
    \ a B to B to C model, the customer never loses access to that data because we\
    \ have the proper safeguards.\n\nQ: This all seems like the ideal career track\
