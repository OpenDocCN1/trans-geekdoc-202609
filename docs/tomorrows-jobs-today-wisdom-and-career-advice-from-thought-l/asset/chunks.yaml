    # 读者评价


    ## 《今日的未来工作》


    在当今数据驱动、瞬息万变的世界，*今日的未来工作*为商业领袖和求职者共同提供了对许多复杂技术趋势的坚实概述。这本书帮助揭示了每个人都需要关注的问题，并为我们迈入新十年时如何应对这些问题提供了思考的食。

    — **Gregory L. Steinhauer**，American Life Inc. 主席


    信息是驱动和资助数字化转型之旅的货币。《今日的未来工作》成功捕捉到了一系列领导力观点，这些观点虽然迥异，但共同拥有一个变革性工作未来的核心特征：将信息视为最宝贵的资产。

    — **Peggy Winton**，智能信息管理协会 (AIIM) 首席执行官


    如果你想保持成功，就必须拥抱并适应变化。《今日的未来工作》向你展示了这些挑战既能带来启发，又能赋予力量。

    — **Jim Dodson**，Iron Mountain 高级副总裁


    在一个经常被不断加速的变化所占据的世界里，《今日的未来工作》卓越地识别、捕捉并讲述了来自全球范围内信息治理和技术专业人士的通往成功的解放性见解。挑战将永远存在，但对于那些愿意去观察的人来说，机会是巨大的。信息时代仍然是一个不断增长的前沿，等待着每一波新的开拓者。

    — **Seth Williams**，MER Conference 主席


    这是一本充满力量且文笔优美的书，它将无疑引导读者在这个变化莫测的信息时代找到属于自己的位置，让他们在那里蓬勃发展并为更大的利益做出贡献。

    — **Angela Bair Schmider 博士**，硕士，博士，马萨诸塞省总医院和哈佛医学院


    作者们汇聚了领先思想者的声音，探索了将主导未来几年的关键主题。有趣的访谈揭示了职业发展的最佳路径，以及明天将来临的社会、政治和伦理挑战。这是一本重要的书。

    — **Alex Panagides**，mxHero 首席执行官


    《今日的未来工作》汇聚了一群令人印象深刻的专业人士，他们从今天技术进步的前沿分享了智慧和职业建议。这些见解不可避免地将助力你的职业道路，将这么多才华横人的知识汇集在一本书书中，令人惊叹。我向任何正在推动或寻求将其组织推向未来的人推荐这本书。

    — **Nick Inglis**，ARMA International 内容与节目执行总监


    对于几乎每一个试图理解周围不断增长的变革速度之意义的人来说，这本书都是一本极佳的读物。每一章中进行的访谈帮助我们理解并解释了他人如何利用这些快速变化来实现个人成就，最重要的是为了人类的更大利益。对于那些对自己的职位稳定性感到焦虑的人，请思考这本书，并收获书中传达的智慧。

    — **John Isaza**，律师，FAI，Information Governance Solutions 联合创始人


    跳出有时通过调查问卷带来的杂乱数据，《今日的未来工作》直接面对那些创造未来工作世界的人。读读这本书；你自己也去访谈几位远见卓识者；帮助塑造未来。

    — **Andy Watson**，阿尔伯克基学院学院校长


