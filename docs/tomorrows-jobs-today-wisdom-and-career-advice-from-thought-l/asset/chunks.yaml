- raw: "A: That is precisely what I expect to see, and I’ll give you an example. The\
    \ camera systems that we have in the City of Burbank are pretty strategically\
    \ placed, but not very widespread. In another prominent Southern California city,\
    \ they have pervasive camera systems. They started to focus on major thoroughfares\
    \ and not necessarily within their residential areas. But what they found is that\
    \ when they catch crimes and can use the video evidence in their prosecution successfully,\
    \ in those neighborhoods, people initially didn’t want cameras there. But when\
    \ they started to experience burglaries, people would come back and ask if there\
    \ was any video evidence, and they didn’t. Naturally, those residents began to\
    \ request video systems. Now, that city is at a point that if a burglary happens,\
    \ and they don’t catch it on video, they’re almost obligated to deploy new cameras.\
    \ That’s a prime example of how technology can quickly change people’s perspectives.\n\
    \n[Chapter 6](#nav.xhtml#toc10)\n\n## [Driving Conversations Around Telematics](#nav.xhtml#toc10)\n\
    \nJohn Danenberger, Corporate Counsel, State Farm Insurance  \n\nTopics: Telematics,\
    \ Autonomous Vehicles\n\n> “Telematics is going to solve a lot of problems because\
    \ you’re realizing that things aren’t the same way they were 50 years ago.”  \n\
    \n> John Danenberger\n\nJohn Danenberger, CPCU, is Corporate Counsel at State\
    \ Farm Insurance and specializes in addressing issues around telematics. He served\
    \ in the US Army and is licensed to practice law in Texas and Illinois. He received\
    \ his bachelor’s from DePaul University, a master’s from UCL, and his JD from\
    \ Loyola University Chicago School of Law.\n\nQ: John, our cars are smartphones\
    \ on wheels, tracking vehicle location, performance, and driver behavior. Data\
    \ points include unique identifiers, breaking, and acceleration habits. How exactly\
    \ are auto insurers leveraging telematics?\n\nA: Right now, app-driven insurers\
    \ are better at capitalizing on this new technology than traditional insurance\
    \ companies. Insurers like Lemonade, Root, State Farm’s Highroad and Blue Owl\
    \ are using telematics to price each individual’s risk exposure in real-time.\
    \ That’s huge for the customer because they’re able to affect their premium by\
    \ just driving safely. They can say, look, “I’m a better citizen by driving safer,\
    \ and I get a premium discount.”\n\nQ: Who owns data collected by vehicular telematics\
    \ technology, and who can access it?\n\nA: The growing trend is to say that the\
    \ driver owns the data. But what is the driver signing away when they buy a new\
    \ car that’s equipped with telematics? Honda, for example, could easily put a\
    \ clause in their sales contract that says, by signing this deal and doing your\
    \ financing through us, you agree to give up data ownership. I would say a majority\
    \ of customers are willing to sign over some of that privacy as long as their\
    \ own life is taken care of swifter, easier in the event of a claim, or an emergency\
    \ where they need a tow or just a can of gas. Once data leaves the car and exists\
    \ in a satellite cloud space, then it probably is owned by the original equipment\
    \ manufacturer. I strongly support the larger insurance companies partnering with\
    \ manufacturers so that we can share that data. We can help service our customers\
    \ faster and accurately if we get that data immediately.\n\nQ: Do you expect to\
    \ see regulatory interest around telematics and data privacy changing?\n\nA: I\
    \ think in the next five years we’ll start seeing companies enter markets underpriced\
    \ or undervalued and then have to raise rates significantly within a 12 to 18\
    \ month period. We’ve already seen it in Rhode Island and California, and we’ll\
    \ see it in other states as these kinds of emergent, app-driven insurance companies\
    \ enter more markets. That’s when the regulators are going to come in and say\
    \ things like, “Well, wait a minute. We saw your initial application. We approved\
    \ your initial application before this rate change. Let’s see the math that’s\
    \ making you justify such a rate increase.” States want to be innovative and business-friendly.\
    \ On the other side, they’re going to have to explain their decision-making.\n\
    \nQ: What obstacles are blocking innovation and the adoption of autonomous vehicle\
    \ technology?\n\nA: The short answer is federal agencies cannot agree on a model\
    \ bill, and they are slow to speak on autonomous vehicle technology. The agencies\
    \ themselves are not aligned, and there’s not a unified message from the federal\
    \ government.\n\nQ: Can telematics help solve issues of equity and environmental\
    \ concerns?\n\nA: They absolutely can. We’ve already seen what insurance companies\
    \ have done with telematics, and we’ve already seen people using their cars less,\
    \ which is good for the environment. We’re seeing our drivers become more responsible.\
    \ Telematics is going to solve a lot of problems because you’re realizing that\
    \ things aren’t the same way they were 50 years ago. Just because some people\
    \ didn’t settle down, buy a house, and have a family, doesn’t necessarily mean\
    \ they have more risk exposure than someone that might have done those things.\n\
    \nQ: What opportunities do you see for the professionals seeking emergent technology-related\
    \ positions within large enterprises?\n\nA: The room for growth is massive. The\
    \ next 10 to 20 years are going to be exciting for professionals that want to\
    \ do pricing, contracting, and legal work in this space. Professionals that can\
    \ price these interesting products and identify risks companies need to cover\
    \ for both customers and employees will be able to draft contracts in a clever,\
    \ yet straightforward way. The sky’s the limit.\n\nQ: How did you make the transition\
    \ from a military career to working in corporate America?\n\nA: I came out of\
    \ law school in Chicago, began working at an intellectual property firm, and had\
    \ the good fortune to speak in many courtrooms in Illinois and Virginia. When\
    \ I got to the JAG Corps, they made me a trial attorney. I would have preferred\
    \ to have done defense work, but they made me a prosecutor. While I continued\
    \ to get good results or at least satisfying results in the courtroom, the work\
    \ did kind of way on my mind a bit. And when my time as a prosecutor was coming\
    \ to an end, they asked me what I wanted to do. I said, “Convoys.” So, they made\
    \ me the head of claims for Eurocom over in Germany.\n\nFor the armed services,\
    \ there are only four statutes that govern our claims process. So, after you know\
    \ or are familiar with those, they send you on your way, and you’re able to counsel\
    \ operations that are using convoys and transportation along the border. Back\
    \ in 2013-14, there was a buildup along what used to be known as the Eastern Wall.\
    \ We were convoying massive operations through Germany and into Poland, and a\
    \ lot of that was done with emergent technologies that were not available in the\
    \ private sector. The lead convoy truck would have a human driver, and the six,\
    \ seven, eight trucks that followed that lead truck wouldn’t necessarily need\
    \ a human behind the wheel. We were able to move very efficiently, very effectively\
    \ through two or three countries at a time!\n\nOnce I’d been satisfied with my\
    \ service to my country, I wanted to continue being involved in this area in any\
    \ way I could. I was looking for an insurance company that was willing or already\
    \ involved with having an app that was driven towards safety. State Farm was one.\n\
    \nI’d like to see more programs start incorporating telematics data. For instance,\
    \ the State Farm grid could know whether an erratic driver was two miles down\
    \ the road and be able to warn customers and say, “Hey, it’s close to midnight.\
    \ We see a driver two miles down the road that’s made eight lane changes in 40\
    \ seconds. You may want to pull over.”\n\n[Chapter 7](#nav.xhtml#toc11)\n\n##\
    \ [Tapping into Africa’s Potential](#nav.xhtml#toc11)\n\nAmb-Dr. Oyedokun Ayodeji\
    \ Oyewole, Chairman, Institute of Information Management  \n\nTopics: Information\
    \ Management, Upward Mobility"
