    # A: I guess for the AI data scientists, the first advice I would give is `deep
    learning` is not the same as deep understanding. And I know there’s a lot of excitement
    around deep learning, but I think we must go beyond it and look at all other forms
    of learning and intelligence. The way deep learning traditionally works is based
    on what patterns you can draw from the data. That’s just one way that we learn,
    and we also learn in other ways. And not enough work is being done in other ways
    of learning. So, continuous learning. Learning at the symbolic level. Learning
    not just from patterns, but by inference. I’m sure that at the highest level,
    even some of the leading researchers of deep learning are very conscious of some
    of the drawbacks, and are trying to address that. Also, as an AI scientist, you
    need to be open-minded in embracing different things, to be able to move forward
    in the creation of AI. So, that would be one piece of advice.


    For someone wanting to break into the industry, from a business point of view,
    there are some easy things that you can do with AI to give you or your business
    a big return on investment and lead to career growth. We call it using “cool”
    AI to solve boring problems. What I mean by boring problems is the back office.
    With most businesses, there’s a lot of invoices, and there’s a lot of text documents.
    People are just going through them, extracting information. That’s a very tedious
    task or a boring task if you like. AI can help a lot in those areas. It can remove
    all the drudgery. There is a lot of it left in the service economy as well that
    AI professionals can help remove. Of course, removing that drudgery means you
    then need to start adding value, rather than just replacing mechanical tasks.
    But, once you accept that challenge, I think there are indefinite opportunities
    to start doing more exciting things in the space.


    ## Directing the Flow of Information


    Dr. Jones Lukose Ongalo, Information Management Officer, International Criminal
    Court


    **Topics:** Data Governance


    > “We now live in a world where small sets of information can alter the economies
    of the most powerful organizations and states on the planet. It is a world where
    compact streams of sensitive information can digitally leak and cause violent
    reactions from people living far and beyond the source.”

    > — Dr. Jones Lukose Ongalo


    Dr. Jones Lukose Ongalo, MBA, Ph.D., is the Information Management Officer for
    the `Court Pénale Internationale` at the Criminal Court in the Hague. He has spent
    the last two decades developing and implementing strategies to achieve operational
    effectiveness and regulatory compliance for engineering firms in energy and utility
    sectors and judicial organizations within Africa, Europe, and the Americas. Jones
    received his `MBA` from Hague University and his `Ph.D.` in Computer Science from
    Heriot-Watt University.


