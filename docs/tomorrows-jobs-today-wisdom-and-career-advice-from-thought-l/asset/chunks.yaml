    我们诚挚感谢全球每一位富有远见的商业和公民领袖，感谢他们投入时间、指导和职业见解，使这本书的成为可能。感谢我们的同事和朋友，包括 `Michael Jay
    Moon`、`Dr. Jones Lukose Ongalo`、`Andrea Kalas`、`Miguel Mairlot`、`Ashish Gadnis`、`Priya
    Keshav`、`Amb-Dr. Oyedokun Ayodeji Oyewole`、`Markus Lindelow`、`Dr. Ulrich Kampffmeyer`、`Dr.
    Anita Allen`、`Douglas C. Williams`、`Kevin Gray`、`George Socha, Esq.`、`Dr. Katrina
    Miller Parrish`、`Mark Patrick`、`John Danenberger, Esq.`、`Dr. Anand Rao`、`April
    Dmytrenko`、`Patrick Sweeney` 以及 `Erick Swain`。


    感谢 `Schmider family`、`Allison Lloyd`、`Kathryn Keene`、`Sean Conley`、`Sharon Ware`
    以及 `Nick Paonessa`。


    感谢 `John Hunt publishing` 卓越团队，感谢你们对我们书的信任。


    最重要的是，我们要感谢我们自己的智慧灯塔，我们亲爱的父母 `Dr. Raymond` 和 `Eleanor Moscatel`、已故的 `Lisa Bair`，以及
    `Charles` 和 `Heide Bair`。


    # 引言


    > “随着技术突破迅速改变人类任务与机器及算法执行任务之间的边界，全球劳动力市场正在经历重大变革。这些变革如果管理得当，可能会开启一个良好工作、优质就业和所有人生活质量提高的新时代；但如果管理不当，则可能带来技能差距扩大、不平等现象加剧和更广泛极化的风险。”


    > `Klaus Schwab`，《未来就业报告》


    对于每一位求职者来说，梦想都是找到一份在财务和智力上都有丰回报、且从事自己热爱（或至少喜欢）的工作。然而在如今，即使在机会充行的`信息时代`，各种技能水平的人仍在为通往幸福且成功职业的最佳途径而挣扎。商业模式转型就业市场的速度之快，以至于即使是最成就的高管和受过良好教育的员工，也会对其职位的稳定性感到焦虑。他们必须经常向上证明自己的内在价值，并在组织内定义自己的`personal
    brand`（个人品牌）。对于应届毕业生和那些寻求重大职业转型的人来说，不断变化的企业格局现实可能几乎让人感到瘫痪。招聘实践中如`artificial intelligence`等非人性化人力资源工具的出现，加剧了人们在新的数字职场中寻找自身正确定位时的传统恐惧。


    有许多招聘人员、人力资源专业人士以及上述引言中引用的《未来就业报告》之类的资源，他们利用统计数据和学术研究来解释现代劳动力市场。这些事实很有趣，但只有那些具有实践性的一手经验的人，才能充分传达作为一名
    `CIO`、`区块链银行家`、`档案管理员`或`数据科学家`以及履行其职责的细微差别。当今商业领袖的简介通常提供一些浅易的面试问题，这并不能帮助我们充分理解“我是如何走到这里的”这个问题背后的深层原因。他们很少调查受访对象如何看待影响其所选领域的特定问题。这本书反映了那些处于董事会火线前沿、又熟悉`server
    room`（服务器机房）的高管们的清醒观点。这些访谈使我们能够设身处地，同时也让我们接触到创造了当今新兴劳动力需求的令人兴奋的技术趋势。


    在这个奇新世界中，我们如何发现自己的贡献归于何处？我们如何辨别应该接受什么样的工作培训，以及应该在哪里执行这些工作？今天有哪些工作，它们在不久的未来对我们来说会是什么样子？它们明天还会存在吗，甚至在你读完这本书时还会存在吗？也许设想这些问题的答案并不复杂。也许答案就在我们鼻子底下，并在接下来的几页中写得很清楚。


    事实上，当今职业焦虑和不确定性的原因并非完全源于科幻小说引发的对机器人和自动化恐惧。那些可能是带有某种事实性的有趣假设。我们对未来就业前景的直觉担忧更贴切地根源于……


