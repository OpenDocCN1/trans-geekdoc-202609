    Finally, one year we started winning and got into the last tournament game, so
    we were going for the gold. Long story short, we lost, and much of the team doesn’t
    know if we win or lose. So, they came up to me and said, “Coach, coach, hey, did
    we win? Did we win?” And I turned around to them, and I was like, “You know we’re
    all winners, we’re going home with some hardware, we got second place.” A few
    minutes later, I was talking to one of the coaches, and I hear right behind me,
    suddenly, this chant, “We’re number two! We’re number two!” They’re all celebrating.
    And I just lost it. I mean, that is to me what it’s all about. I was like, these
    athletes are so genuine, and this is as good as it gets.


    We ended up winning in the `50^(th)` anniversary last year, after all those kinds
    of tough years, so it was cool to see our athletes, some of whom I’ve had the
    whole time, mark that accomplishment. You know, it’s all the little things. It’s
    a theme in what we’re talking about today. If we learn people, that’s where you
    get to listen and actively listen. In all walks, right? When I’m listening to
    a candidate, when I’m listening to a client, when a new grad student is listening
    to a professor, or listening to someone, they’re interviewing with, when we’re
    listening to our children, when we’re listening to our parents, that’s when the
    meaningful stuff happens.


    It comes down to the intangibles I’ve noticed in this people business. When you
    understand someone at that level and understand what their motivation and their
    drivers are, you can truly build a team, and a very successful team, especially
    when you have a high-care quotient around it as well.


    # Epilogue


    As we bravely march through the upheaval of the Information Age, our hopes for
    the workforce outnumber our worries and concerns. This optimism is deeply seeded
    in a repeated meditation that the will of the achiever knows no obstacle it cannot
    face and eventually overcome. These original interviews document professional
    challenges, but they are also evidence of real success. Success through discipline.
    Success through study. Success through valuing wisdom derived not merely from
    our education and experience but passed down to us from our respected peers. That’s
    why we positively expect the leaders profiled in this book to emerge as defining
    voices in the future’s global digital disruption, innovation, and governance discussions.
    We already know their goodwill has made a tangible difference in lives like ours
    and hope it will work in yours as well.


    We can’t know exactly what the jobs of the future will look like, but the chances
    are that both the technical and soft skills examined in this book will serve as
    a basis for their qualifications. Like the leaders profiled in these chapters,
    each of us has a valuable contribution to make to that future and each other.
    We are an intricate species whose faults are well documented, but whose many inspired
    gifts and evergreen qualities are yet to be tapped. Your next step is leveraging
    those gifts when the opportunity arises, doing so strategically, and with the
    aid of the friends, family, and colleagues that make life worth living.


    # About the Authors


    Rafael Moscatel is an award-winning Information Governance Professional (`IGP`),
    Certified Records Manager (`CRM`) and Certified Information Privacy Manager (`CIPM`).
    He has decades of experience developing large-scale information management and
    digital transformation programs for Fortune 500 companies, including Paramount
    Pictures and Farmers Insurance. In 2015, he partnered with Stanford University
    and produced `The Little Girl with the Big Voice`, an acclaimed documentary based
    on historical archives and the Doctrine of Fair Use. He was honored with the Excellence
    for an Organization Award by ARMA International and regularly speaks at industry
    conferences about the evolving discipline of `IG`, including the `AIIM Conference`,
    `BoxWorks`, the International Legal Technology Association, the `MER Conference`,
    and the `Document Strategy Forum`. He is available for speaking engagements, consulting
    opportunities, and interviews.


    Abby Moscatel is a California trial attorney for State Farm Mutual Automobile
    Insurance Company. She combines her love for the law and passion for emerging
    technology by writing and presenting on ethics and admissibility of evidence related
    to `IoT` and social media. She obtained her `JD` from Southwestern Law School’s
    accelerated `SCALE` program and her `BS` in Legal Communication from Ohio University.
    Before law school, Abby was based in Washington, D.C., where she helped pioneer
    the use of the internet to mobilize students nationwide to lobby for increased
    access to federal financial aid. She also previously handled media relations for
    the Ohio Senate Democratic Caucus through the Ohio Legislative Service Commission’s
    fellowship program. Abby was the executive producer on Rafael’s `The Little Girl
    with the Big Voice`, assisting with the story editing, copyright licensing, and
    crowd-funding necessary to produce and distribute the film.


    Rafael and Abby’s first careers will always be Mom and Dad. They live in Los Angeles
    with their beloved children and dog named Pikachu Elsa.


