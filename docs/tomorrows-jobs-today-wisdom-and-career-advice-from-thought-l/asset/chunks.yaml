- raw: "> “Having a society where quality records and information can be easily accessed\
    \ must be a priority...”  \n\n> Amb-Dr. Oyedokun Ayodeji Oyewole\n\nAmb-Dr. Oyedokun\
    \ Ayodeji Oyewole, FIIM, ERMS, RMEM, FIRMS is the Chairman of the Board at the\
    \ Institute of Information Management based in Nigeria. Before leading the institute,\
    \ he served in senior IT roles for Swedish firms and consulted on cybersecurity\
    \ needs for the oil and gas industry. He received his BSc in Computer Science\
    \ from Lagos State University.\n\nQ: Amb-Dr. Oyedokun, your work developing new\
    \ practitioners in Records and Computer Science fields in Africa is substantial\
    \ and encouraging. You have empowered your students to harness their analytical\
    \ skills, engage in professional development, and seize opportunity. What inspired\
    \ you to start building a community of skilled practitioners that could make a\
    \ difference in their communities?\n\nA: My journey started in 2004 with a tremendous\
    \ vision and mission. This was at a time when only a few organizations in Africa\
    \ were implementing data science and information management technology. With the\
    \ vast opportunities in those areas coupled with the societal challenges faced\
    \ by the continent, I saw the need for us to bolster the demand for proper management\
    \ and security of records in both public and private organizations. A huge chunk\
    \ of organizations was still struggling with managing physical records and certainly\
    \ not prepared for electronic documents. Poverty, corruption, and a lack of employment\
    \ opportunities were crippling.\n\nIn analyzing all of this, I felt the only meaningful\
    \ solution to both alleviating suffering and empowering people was through the\
    \ advancement of this industry, information management, neglected for decades\
    \ in Africa. Having a society where quality records and information can be easily\
    \ accessed must be a priority in the face of several challenges ranging from lack\
    \ of government support, inadequate legislation, poorly trained professionals\
    \ and practitioners, to the absence of standards and necessary tools for adequate\
    \ data governance.\n\nQ: Most people around the world don’t realize that many\
    \ parts of Africa, especially in Nigeria, finally have sophisticated infrastructures\
    \ despite being considered developing nations. The history of Africa is varied\
    \ and rich, with much of its potential still yet to be unlocked. What if anything\
    \ do you feel is unique to African nations that you might not find in places like\
    \ the United Kingdom or the United States?\n\nA: Opportunities in Nigeria are\
    \ still blossoming, and there is a lot of potential and talent yet to be tapped.\
    \ I think what we see in Nigeria, especially, but other parts of Africa as well,\
    \ reflects a belief by young people that it’s becoming very possible to pursue\
    \ success in a professional capacity. They carry a deep resolve to take their\
    \ careers to the next level and make their lives better, despite a myriad of social\
    \ and economic challenges less prevalent in the West. That’s what inspires me\
    \ the most.\n\nQ: You spent quite some time working for Chevron Nigeria Limited\
    \ on its Agura Independent Power Project designing IT systems. Nigeria’s oil reserves\
    \ are substantial, and as this sector develops, just like in the United States,\
    \ there are social and environmental issues impacted by this progress. How much\
    \ are projects such as those affected by laws and regulations in African nations,\
    \ and what trends do you expect in the African regulatory landscape over the next\
    \ five or ten years?\n\nA: The regulatory environment in Nigeria is complex, creating\
    \ challenges even for companies that strive hard to be compliant! There’s legislation\
    \ to regulate almost every area of economic activity. The pro-transparency, anti-corruption\
    \ inclination of present administrations are seen as helping ensure accountability\
    \ and good governance. That means empowered regulators are comfortable with coming\
    \ down hard on breaches of local regulation. However, there hasn’t been as much\
    \ impact compared to other financial, telecommunications, and energy sectors operating\
    \ in other parts of the world.\n\nYet amidst the mix of regulatory change and\
    \ remaining instability, we do see opportunities for organizations to advance\
    \ their local positioning and risk management approach. Performing necessary compliance\
    \ audits and investing and internal capacity-building around compliance issues\
    \ is being achieved. In Africa, I believe companies should learn to prioritize\
    \ engagement and seek to build long-lasting interaction not only with regulators\
    \ but across a broader base of public sector stakeholders. Engagement will intensify\
    \ the understanding of regulators’ priorities and facilitate dialogue that will\
    \ ultimately improve policy formulation, and consequently help organizations to\
    \ shape the ethical business environment around their operations.\n\nQ: You have\
    \ hosted a plethora of international business leaders at your conferences to bring\
    \ new ideas to Africa. What kinds of contributions are Information Age professionals\
    \ in the rest of the world making to support the development of these professions\
    \ in Africa?\n\nA: A lot is happening in terms of development in the global information\
    \ management space, which I think Africa is yet to integrate into, realize, or\
    \ benefit from fully. Nevertheless, some professionals and organizations like\
    \ the Information and Records Management Society (IRMS), the International Records\
    \ Management Trust (IRMT), and the Information Governance Initiative (IGI) have\
    \ been of tremendous inspiration and support to the development of our industry\
    \ and job seekers in Africa. There are lots of opportunities for international\
    \ professionals who might be interested in exploring, including business and consultancy\
    \ services here. The records and information management profession of the 21^(st)\
    \ century is one for the brave-hearted, exciting, and with further potential than\
    \ ever before.\n\n# [Part II Less is More](#nav.xhtml#toc12)\n\n> “It is not important\
    \ to make many pictures, but that I have one picture right.”  \n\n> Piet Mondrian\n\
    \nAs brands and consumers develop a deeper awareness of the importance of protecting\
    \ their data, the idea of sharing less is becoming a more prudent, preferential,\
    \ and effective approach to governance. In fact, in domains like privacy, content\
    \ management, and application development, data minimization has become a dominant\
    \ design strategy. An emphasis on discretion and privacy is nothing new, but it\
    \ has gained relevancy following the dawn of social media, a cultural and technological\
    \ revolution that encourages individuals and businesses alike to share everything\
