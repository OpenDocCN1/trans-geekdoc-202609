    v Spain`，似乎与这一趋势相一致。由于这些原因，我认为任何大幅削弱数据用户权利的监管变更将质疑我们机构的民主合法性。


    Q: 金融服务市场管理局（`FSMA`）与比利时国家银行（`NBB`）是负责监管比利时金融部门的两大机构之一。在美国，则是金融行业监管局（`FINRA`）和证券交易委员会（`SEC`）负责确保金融机构和市场的合规。你认为与这些小组合作面临的挑战是什么？


    Q: 纽约州通过了《停止黑客攻击和提高数据安全法》（`SHIELD`）法案，该法案更新了数据泄露通知要求。全球和美国也努力通过类似于欧盟“被遗忘权”（`Right
