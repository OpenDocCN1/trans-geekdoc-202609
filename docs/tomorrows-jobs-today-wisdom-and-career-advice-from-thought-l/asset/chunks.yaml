- raw: 'Sometimes there is controversy over some classified equities that may have
    to be worked through. All FOIA cases also will be reviewed by legal counsel’s
    office. In CY 2018, my declassification branch completed over 1,600 cases involving
    either the FOIA or mandatory declassification reviews and security reviews that
    are subject to the Executive Order on Classified National Security Information
    (EO 13526). These types of reviews have different sponsor offices within the DOD.
    We track each request meticulously from receipt to return to the proper DOD office
    that interacts directly with the requester.


    I take it as my duty as a civil servant to ensure that whatever should be released
    to the public is released—or rather that we recommend to the OSD FOIA Office that
    it be released. However, I also am determined that anything that is properly classified
    should be withheld, which is also in the best interest of our citizens and our
    young men and women in harm’s way.


    This case workload across the federal government continues to grow year to year
    as more and more of our citizens have discovered how easy it is to initiate requests
    from their home computers. Note one does not have to be a US citizen to use the
    FOIA. Not surprisingly, our human resources to work these cases have not kept
    pace, although we have increased the efficiency of this work by using electronic
    workflow tools and tracking. There are even private organizations that have built
    a business around helping individuals file FOIA cases. It is a hallmark of our
    democracy that these processes exist, but they are not free and to mismanage our
    properly protected national security information by incomplete processes would
    not only be illegal, it could end in tragedy. The resources required to do this
    work are always in competition with resources needed to do all the other things
    agencies must do. They are limited.


    All of this is to say that what may appear like foot-dragging is really a patriotic
    attempt to serve both the public and our men and women in uniform. Could processes
    be improved? Always. Are some FOIA offices more efficient than others? Certainly.
    However, I am proud of the thousands and thousands of cases my division’s declassification
    branch has worked over the last 12 years, and if FOIA requesters knew the details,
    I believe they would be most appreciative.


    Q: Cybersecurity is an essential component of our national defense, and threats
    from foreign actors are becoming increasingly sophisticated. Yet federal, state,
    and local governments have limited resources to assist private entities investigating
    breaches and ransomware attacks. Where does a business’s responsibility to protect
    its own IT infrastructure end and the government’s role in defending it begin?


    A: Fundamentally, it’s about risk mitigation and resource management for businesses,
    governments, and individuals alike. Like many issues that have only recently come
    to be as technology has evolved rapidly in recent years, resolution may only come
    through testing in the courts, legislation, etc. This will take time. I expect
    there will ultimately be public/private partnerships that must emerge. US Cyber
    Command is very new, having acquired combatant command status this past May.


    The public’s awareness of these issues is mixed, and some of the risks will be
    assumed by citizens. The populace must learn to be responsible with their personal
    data. As awareness increases among the public, all levels of government, and within
    the private sector, and as the cybersecurity sector matures and grows, things
    should improve, but like our physical defense, our cyber defense will never be
    a 100 percent assured. The only way to ensure zero risk is to live in a cave and
    stay off the web. Not likely for most of us, and even for those who would choose
    such a lifestyle, they’d likely be picked up via satellite as they went about
    their off-the-grid foraging activities!


    The government will have to balance the resources spent to mitigate cyber risk
    with the resources required for all the other required tasks it must perform.
    Companies and individuals will have to do the same. Engagement and collaboration
    between these three groups will be continuously necessary.


    Q: Following the 9/11 terrorist acts, the U.S. took steps to ensure its security
    agencies were better equipped to share information and communicate. Besides leveraging
    technology to support interoperability, what have we done from a training perspective
    to promote better control over the handling of, and compliance with, confidential
    records and official systems?


    A: I can only answer this question from my local perspective. In short, a combination
    of training, automation, managed access to systems, and physical spaces are required.
    On the Joint Staff, training in the proper handling of classified or sensitive
    material is conducted during on-boarding for action officers. Refresher training
    is an annual requirement. As knowledge workers across the federal government create
    classified unstructured data, a human still must understand his/her agency’s classified
    equities and know how to mark or tag electronic documents accordingly.


    Automation can assist with minimizing human error, but there will always be a
    training requirement to ensure that documents and data are properly managed by
    the originator and anyone who handles information across the enterprise. If artificial
    intelligence and machine learning are used, a human will still be required to
    “teach” or configure the machine so it can detect sensitive information and prompt
    appropriate action.


    If spillages occur, processes must be in place to mitigate associated risks, assess
    and respond to damage, and revise procedures to prevent future similar occurrences.
    Security clearance vetting processes are in place at the point of hire to try
    and prevent nefarious mishandling. Throughout a federal employee’s time of service,
    continuous monitoring and/ or periodic reviews of the individual’s fitness for
    a security clearance are conducted.


    With the rise of “need to share” over “need to know,” the concomitant greater
    risk must be mitigated via system access controls, proper marking, and training.
    It will always be a balancing act when sensitive information must get to those
    who need it at “the speed of relevance.”


    Q: With deep fakes, AI inherent bias, and misinformation campaigns capable of
    drastically impacting the way citizens process information, what role if any does
    government have in combatting the disruptive social impacts they may have on the
    citizenry?


    A: I believe government has a role, but the specifics are complicated. There is
    some amount of “it depends” here. If another state or non-state actor is attempting
    to impact public opinion to affect a US election, this becomes a matter of national
    security at the federal level. State and municipal elections could be viewed differently.
    “Disruptive social impact” is somewhat vague, and I’d say government involvement
    should be considered on a case-by-case basis. Sowing the digital seeds of general
    social discord with the intent to create chaos, dysfunction, or further polarizing
    our society becomes tricky. It will need to be further analyzed, considered in
    the context of privacy laws, espionage laws, first amendment rights, and others.
    Legal precedents will need to be established in our courts, and perhaps legislation
    or national policies are required.'
