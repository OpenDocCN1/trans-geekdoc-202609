    Even if we can be pleased about this recent development, regulators should also
    have sufficient staff to perform, on a risk-basis, on-site controls. Even while
    encouraging cooperation, they need to exercise their ability to impose sanctions
    in the event of non-compliance. Otherwise, it becomes difficult to convince any
    employee or management team about the importance of complying with applicable
    rules and regulations if the regulators never impose a noticeable sanction.


    ### Q: How should financial institutions approach introducing AI and robots into
    their environments, and will it have a positive impact on compliance in the long
    term?


    **A:** Financial institutions have been leveraging those kinds of tools to detect
    suspicious transactions related to money laundering and identifying counterparties
    subject to sanctions for a while. Some of them already make use of predictive
    models. The use of AI or robotics may present opportunities for financial institutions
    if certain tasks or low-risk decisions can be automated using these new technologies.
    In addition to being cost-effective, these solutions could improve the efficiency
    of a compliance monitoring program and help mitigate risks. However, I seriously
    doubt that, at least for now, regulators would agree that the most material compliance
    tasks should be entrusted to an AI tool or any form of robotics, mainly for liability
    purposes. To my knowledge, no robot has been held responsible yet by a regulator
    or a court for a violation of a legal provision.


    ### Q: What is your advice for young professionals, millennials, entering, and
    trying to succeed in the fields of privacy, risk, and compliance?


    **A:** I would advise them first to question their ethics. What is your take on
    issues like money laundering, sanctions, the fight against terrorism, or data
    protection, for instance? Compliance offers the opportunity to perform a job in
    a more preventive and efficient way than ever before. Within an organization,
    your decisions will often be challenged by the sales or product department, which
    does not always understand the underlying issues that can be raised by certain
    unethical or illegal behaviors. For these reasons, it is healthy to keep a long-term
    vision to achieve sustainability while ensuring business growth. If you have and
    believe in that vision, embrace the challenges and opportunities that come.


    # Chapter 19


    ## Turning Collective Wisdom into Strength


    **Andrea Kalas**, VP of Archives, Paramount Pictures**


    **Topics:** Digital Archives, Library Science


    > “If there’s one thing I admire the most among the younger members of our field,
    it is their dedication to recognizing the path that is the worthiest… to their
    colleagues, to the collections, to the world they work and live in.”

    > — Andrea Kalas


    Andrea Kalas is a former President of the Association of Moving Image Archivists
    (AMIA) and a member of the Academy of Motion Picture Arts and Sciences (AMPAS).
    Before her current role as SVP of Archives at Paramount Pictures, she led the
    preservation program at the British Film Institute. She received her bachelor’s
    in film from Temple University and finished her master’s in film at the University
    of California at Los Angeles.


    ### Q: Andrea, we now exist in a world of accessible digital archives, but this
    new paradigm has ushered in an entirely new set of preservation challenges. You’ve
    spoken and taught at length about one of them, bit loss, and how it affects the
    race to preserve not just America’s rich film history, but the cinematic treasures
    around the world. How does a global team like yours prioritize its goals as it
    races against the clock?


    **A:** Digital preservation has the basic goal of avoiding bit loss, technically.
    However, the work that requires technologists and archivists to collaborate effectively
    involves the treatment of files as valuable records, art, or artifacts. This goes
    against so much of how basic information technology systems work. For example,
    the word “archive” has been used as a term to mean data written off-line and put
    on removable media on a shelf, never to be touched again. This is a sure path
    to bit loss. For an archivist, this definition is counterproductive. It as much
    about communication and clear technical requirements from archivists as it is
    building technical solutions.


    What we’ve developed is an infrastructure that makes sure there are multiple copies
    of our feature films, and that each file that makes up that film is checked annually.
    We’ve also worked hard at making sure that we’ve architected things so that as
    hardware and software change, which they inevitably do, the files and metadata
    that make up that film can survive. This keeps us on track with what we have to
    preserve. That and the incredibly brilliant archivists who work with me and bring
    innovation to the process as it evolves.


    ### Q: Beyond the importance of posterity in the arts, what are the benefits of
    preservation for large intellectual property firms like those in the entertainment
    business?


    **A:** Entertainment companies base their business plans on the ability to distribute
    films and television programs over the long-term and benefit from the preservation
    of their property both financially and culturally. The cultural aspect is often
    called in business terms, “branding,” or the public recognition of the value of
    that company. A film studio that demonstrates it cares as much about a film that
    has excellent public appreciation as it has financial benefit enhances its brand.
    These two reasons are why those who own property have a duty of care. We have
    some titles we distribute for a short period and others for which we have long-term
    rights. It is the latter we preserve.


    ### Q: Much of the credit for modern advances in artificial intelligence goes
    to academics like Fei-Fei Li at Stanford, who built large image data sets. Now
    we’re seeing software vendors developing tools for visual asset management that
    integrate machine learning to auto-classify large volumes of assets. Are solutions
    like this on the horizon for organizations like yours?


    **A:** I’m excited about the tools that are available to archivists based on the
    incredible advances in this field. One of the quotes I use from Fei Li is “human
    values define machine values.” To me that not only reminds me of her guidance
    on how to include all types of humans in interpretation, it also points to the
    phenomenal work of so many in the field of library science who have spent over
    a century on concepts like classification and subject headings which address the
    same challenge: how to bring structure to a collection of knowledge.


    Perhaps it is happening somewhere, but I have yet to see an AI demonstration from
    the companies who are selling this service say, “and we’ve incorporated the Library
    of Congress standards on motion picture genres.” We can and should continue to
    argue about the way a definition is assigned to any one object, but why haven’t
    the machines learned from the humans who have already done a lot of research around
    these kinds of definitions? I’d love to see that.


    ### Q: As we welcome a new generation of librarians, archivists, and data professionals,
    what are you observing in terms of their attitudes towards these roles given their
    upbringing in a wholly digital world? What positive qualities are we seeing in
    these individuals that separate them from the pack?

