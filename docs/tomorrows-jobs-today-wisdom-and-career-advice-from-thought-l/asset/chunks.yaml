    终于，有一年，我们开始赢得比赛并进入了锦标赛决赛，所以我们冲着金牌而去。简而言之，我们输了，团队中的许多人并不知道我们赢了还是了。于是，他们走过来我说：“教练，教练，嘿，我们赢了吗？我们赢了吗？”我转过身对他们说：“你们知道我们都是赢者，我们带着奖杯回家了，我们获得了第二名。”几分钟后，我正在和一位教练聊天，突然听到我身后爆发了一阵口号：“我们是第二！我们是第二！”他们所有人都在庆祝。我彻底破防了。我的意思是，对我来说，这才是意义所在。我想，这些运动员是如此地真诚，这已经是最好的了。


    在经历了那些艰难的岁月后，我们在去年的`50^(th)` 周年庆获得了胜利，所以看到我们的运动员——其中一些人我一直陪伴他们——创造了那项成就，感觉很酷。你知道的，这一切都源于小细节。这也是我们今天讨论的主题。如果你学会了人，你就学会了倾听和积极地倾听。在各行各业中都是如此，对吧？当我倾听候选人时，当我倾听客户时，当一个新毕业生倾听教授说话时，或者倾听面试对象说话时，当我们倾听孩子时，当我们倾听父母时，那才是有意义的事情发生的时候。


    这归于我在这种人本业务中观察到的非物质性因素。当你从那个层面上理解一个人，并理解他们的动机和驱动力时，你就能真正建立一支团队，一支非常成功的团队，尤其是当你还有一个高关怀商数（high-care
    quotient）时。


    # 结语


    当我们勇敢地迈过信息时代的动荡时，我们对劳动力的希望多于我们的忧虑和担心。这种乐观主义深深植根于一种反复的冥想：成功者的意志没有它无法面对并最终克服的障碍。这些原始的采访记录了职业挑战，但它们也是真实成功的证据。通过自律取得成功。通过学习取得成功。通过重视智慧取得成功——而这些智慧不仅源于我们的教育和经验，更是由我们尊敬的同仁传给我们的。这就是为什么我们积极期待书中描绘的领导者将成为未来全球数字动荡、创新和治理讨论中的定义性声音。我们已经知道，他们的善意对像我们这样的人产生了切实的影响，并希望它对你的生活也同样有效。


    我们无法确切知道未来的工作是什么样子，但很有可能，书中审视的技术和软技能将成为他们胜任资格的基础。正如这些章节中描绘的领导者一样，我们每个人对那个未来以及彼此都有着有价值的贡献。我们是一个复杂的物种，我们的缺点有据可查，但我们许多受启发的天赋和永恒的品质仍有待挖掘。你的下一步是在当机会出现时利用这些天赋，有策略地这样做，并在那些让生活变得意义的朋友、家人和同事的帮助下完成。


    # 关于作者


    Rafael Moscatel 是一位获奖奖的信息治理专业人士（`IGP`）、认证记录管理器（`CRM`）和认证信息隐私经理（`CIPM`）。他在为财富 500
    强公司（包括派拉蒙影业和农场保险公司）开发大型信息管理和数字化转型计划方面拥有十年经验。2015 年，他与斯坦福大学合作制作了《大声音的小女孩》，这是一部基于历史档案和公平使用原则的广受好评的纪录片。他荣获
    ARMA International 颁发的卓越组织奖，并经常在行业会议上就不断发展的 `IG` 学进行演讲，包括 `AIIM Conference`、`BoxWorks`、国际法律技术协会、`MER
    Conference` 以及 `Document Strategy Forum`。他接受演讲、咨询和采访预约。


    Abby Moscatel 是加利福尼亚州的诉讼律师。她拥有丰富的经验，曾为财富 500 强公司开发大型信息管理和数字化转型计划。在 2015 年，她与斯坦福大学合作制作了《大声音的小女孩》，这是一部基于历史档案和公平使用原则的广受好评的纪录片。她荣获
    ARMA International 颁发的卓越组织奖，并经常在行业会议上就不断发展的 `IG` 学进行演讲，包括 `AIIM Conference`、`BoxWorks`、国际法律技术协会、`MER
    Conference` 以及 `Document Strategy Forum`。


