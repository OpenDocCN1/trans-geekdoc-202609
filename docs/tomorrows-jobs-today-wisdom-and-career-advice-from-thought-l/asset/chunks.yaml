    versus when do I go on my intuition and experience?” For example, just because
    my personalized book-recommender suggests a particular collection doesn’t mean
    I’m buying each and every book. Right? I use my judgment, read through my options,
    and then decide. Irrespective of what the system says, I’m still making certain
    decisions. Over time, using discretion and AI, we’ll get better at what we’re
    doing.


    One of the concepts we use “man-plus-machine” is better than just “either one
    on their own.” So, in spite of all the machine intelligence, just using a machine
    isn’t the right thing yet for a multitude of serious decisions that we make. By
    the same token, just using humans without having some machine aid, in numerous
    cases, is also not optimal. That’s why the man-plus-the-machine is a better way
    of approaching it right now.


    ### Q: What or who initially influenced you to pursue a career in data science?


    A: I found my way into AI way back in 1985. I did my Ph.D. at that time, completed
    my computer science degree, and the only thing I could think of was wanting to
    get into AI. I was just fascinated by the human thinking process and being able
    to mimic that in a machine.


    ### Q: What sage advice might you have for those drawn to AI domains like machine
    learning, robotics, and neural networks? How do they break-in to an industry that
    seems so daunting and sophisticated?

    '
  trans: '

    此外，过去几年里，我们看到了对巨大计算力的需求，而这种需求如今在大学端往往变得匮乏，而在商业领域则更为充足。商业部门运行着配备强大 `GPUs` 的大型机器并进行量子计算，这些对于学术界来说，支持成本都是非常昂贵的。这也是他们在研究方面面临的挑战之一。


    事实上，在大数据和 AI 领域，学术界正处于落后状态，需要额外的投资。过去，超级计算领域有许多合作努力，政府也投入了巨额资金。但从那时起，至少在过去的几十年里，大部分资金已几乎消失了。这种投资正是大学现在向企业所寻求的那种类型。当然，在关系良好的地方，存在着高效的共生关系。公司可以提供数据，学术界可以提供技术和人才（基本上是大学学生、博士后）来分析这些数据。


    ### Q：未来主义者罗伊·阿马拉（Roy Amara）曾著名指出：“我们倾向于高估技术在短期内的影响，而低估其长期影响。”在过去几十年数字化变革的背景下，你认为他的话仍然成立吗？还是说我们对技术将我们带向何方已经有了更好的把握？


    A：在 AI 的情况下，主要是，这仍然非常正确。正如我们所知，关于它存在大量的炒作，每个人都在说：“嘿，AI 将接管一切。我们将失去所有的工作。”我认为，这至少在短期内不会发生。目前仍有许多障碍需要克服，因此我不认为所有这些恐惧都是根据的。从长期来看，是的。这些机器所增加的价值是一个缓慢增长的过程。因此，人类需要将自己定位在具有增值值的职业上，而不是重复性任务上。


    那些角色是自动化最集中的领域。我认为每个人都需要问自己一个问题：“如果我正在做非常重复性或体力性的工作，我是否在这里创造了价值？”所以，这就是关键所在。因为越来越多的这类责任将由机器接管。目前，人们不应该担心，但从长期来看，AI
    无疑将彻底改变就业市场。


    ### Q：你对新兴技术的伦理问题发表过非常有激情的观点。在最近的世界经济论坛上，你提到 AI 是一种向善的力量，但警告说仍有许多恐惧和误解阻碍了应用。对于开发者来说，今天最棘手的伦理障碍是什么？你们是如何克服它们的？


    A：首要的伦理挑战是偏见和公平的概念。有许多伦理原则，我们都被告知应该平等地对待每一个人，不因性别、种族、观点、年龄等所有不同标准产生偏见。我们可以这样说。但如果我是一个数据科学家，问题就变成了：我如何确保在我的
    `algorithm` 做出推荐时没有引入任何偏见？如果我在一家银行工作，正在编写一个决定个人信贷额度的机器学习算法，我究竟该如何做？我该如何确保我所做的事情在任何方案下都不是不公平的？每个行业都有许多这样的例子。


    之所以这个问题如此棘手，是因为我们使用历史数据进行机器学习，而当使用使用历史数据时，就像任何社会一样，它可能在某方面或另一方面存在偏见，对吧？可能是针对特定的族群或性别，这些都可能反映在
    AI 推荐中。已经出现过一些非常著名的案例，最近其中一个涉及两家巨头，一家是科技公司，另一家是银行。在这个例子中，男性申请了一张信用卡，他获得了一个特定的信贷额度。但在配偶的情况下，即使在共同账户中，如果妻子申请同样的卡，信贷额度由于某种原因低得多。问题突然变成了：为什么？这些故事现在已经进入了媒体，因此关于偏见问题有很多讨论。


    据某些说法，公平有 32 种定义。对于数据科学家来说，他们真的有时间去理解每每一种定义对他们所构建内容的所有影响吗？这是一个巨大的挑战。另一个挑战是显而易见的：“我该如何解释我的
    `algorithm` 正在做什么？”对于 AI 中的某些类型技术来说，这是一项艰巨的任务。


    另一个大问题是安全。我构建的 AI 是安全的吗？它是否在各种极端条件下都过测试？系统越复杂，测试其中的某些事情就越困难。所以，从伦理角度来看，这些代表了挑战，尽管在很大程度上伦理是什么是毫无疑问的。因此，虽然人们同意
    AI 应该是安全的，应该是可解释的。它应该是公平的。具体如何做到，绝非接近于解决。


    ### Q：采用 AI 的影响之一是公司可能需要更少的员工来实现或超过其目标。你提到过最容易受到冲击的前三个行业包括金融、医疗健康和汽车。在未来 15 年里，这些行业的劳动力将在多大程度上被取代？


    A：我们不应该将其看作是取代，而应看作是增强或工作的改变。是的，会有一定数量的人被取代，但他们的大多数可能会看到自己的工作描述发生变化。我认为，和以前发生过的革命一样，AI
    最终会创造更多工作、不同类型的工作，这些工作可能甚至不会归于某个特定的 AI 解决方案。我没有看到机器将取代一切的大规模失业。我完全没有看到这种情况会发生。我预计人们将需要更习惯于使用机器、使用推荐，并学会何时使用判断。决定：“我何时该接受机器的建议，而何时该遵循我的直觉和经验？”例如，仅仅因为我的个性化书推荐器推荐了某个特定的收藏品，并不意味着我要买每一本书。对吧？我使用我的判断力，阅读所有选项，然后做决定。无论系统说什么，我仍然在做某些决定。随着时间的推移，通过运用裁量权和
    AI，我们将正在做的事情做得更好。


    我们使用的概念之一“人机结合”比仅仅是“两者中的任何一个”要好。所以，尽管有这么多机器智能，对于我们所做的许多严肃决策来说，仅仅使用机器目前还不是正确的事。同样，在许多情况下，在没有某些机器辅助的情况下仅仅使用人类也是不是最优的。这就是为什么“人机结合”是目前处理这一问题的一种更好方法。


    ### Q：是什么或是谁最初促使你追求数据科学职业的？


    A：我早在 1985 年就进入了 AI 领域。那时我正在攻读博士，完成了计算机科学学位，我能想到的唯一事情就是想进入 AI。我对人类的思维过程以及在机器中模仿这种过程非常着迷。


    ### Q：对于那些被机器学习、机器人和神经网络等 AI 领域吸引的人，你有什么智者的建议？他们如何进入这个看起来如此高不可攀且复杂的行业？


    '
