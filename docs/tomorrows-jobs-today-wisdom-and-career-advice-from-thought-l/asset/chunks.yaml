    我之前讨论过为大型跨国公司进行“全球本地化”（glocally）的思考，但在这个职位上，我不需要进行全球本地化的思考。然而，我必须服务 15 个完全不同的业务。在一个小城市里，这实际上是
    15 个完全不同的业务部门。我有一个公用事业部门，负责为城市市民提供电力和水。这与专注于法律执法的警察部队完全不同，而警察部队又与专注于建设和维护街道及路灯的公共工程组织完全不同。如果你愿意这么说的话，这是两个完全不同的业务。


    所以，当我为一个城市制定一个框架时，它必须是一个能够服务这些多样化业务部门的总体框架。然而，当我们关注某一个特定的业务部门时，我们必须在该框架内锁定最能帮助该业务部门所提供的特定服务的解决方案。


    ### Q：你的教育经历远超你最初的学位学习，并让你获得了 `SCRUM master` 和 `PMP` 认证。在当今竞争激烈的职业环境中，这些证书是如何帮助你的职业发展的？对于寻求
    IT 领导力职位的人士，你建议他们追求哪些称号？


    ### A：我的观点与我的一些同龄人略有不同。是的，持续教育是绝对必要的。你必须不断学习。你必须不断成长。随着年龄的增长，人们自然会习惯自己的方式，但有时他们会变得过于舒适。他们不再寻求学习和成长。因此，你会发现有些男士和女士整个职业生涯都是大型机管理员，直到退休一直都是大型机管理员。


    我愿意学习的意愿使我在技术领域获得了第一个第一个大机会，因为在我的第一家公司，我们是一家专门处理政府合同定价应用程序的大型机公司。当大型机的维护成本变得过于昂贵时，我们的业务决定转向像
    `Unix` 这样的开放系统。我与一个大型机工程师团队一起工作，而我当时只是一个服务台人员。当我们开始向 `Unix` 转型时，并不是所有的大型机人员都想加入。这为我打开了大门。我开始学习
    `Unix` 并成为一名系统管理员。我参加了 `Unix` 系统管理培训课程。我买了书，并开始阅读。在几年之后，我成了该项目的负责人。当我们把该应用程序从大型机迁移出来时，我成了那个首选的人。这为我奠定了基础。


    我在职业生涯早期就学到，我们能做的最糟糕的事情就是固步成规。固执于我们关注的技术。固执于我们开展职业生涯的方式。所以，我一直坚持这一原则。我并不一定从表面上认同认证，因为我见过很多持有认证的白痴。


    有些人手里有十个认证，但在实践中，他们几乎无法完成任何事情，因为他们活在书里。你需要那本书书来学习概念和方法论。但要将这些转化为现实生活，你需要在现实生活中部署它们，去发现哪些有效，哪些无效。书本上有效的是什么？无效的又？哪些适用？哪些不适用？一旦你做到了这一点，你就需要回到书籍中继续学习。你必须弄清楚我的下一步是什么。在持续改进的旅程中下一步是什么？个人和职业成长旅程的下一步又是什么？


    当书本不能满足我的需求时，如果某件事不合心意……（此处原文重复了多次“if something isn’t sitting well”，根据指令要求不重复输出原文，此处仅保留语意逻辑）


    （注：由于原文中存在大量重复的短句“if something isn’t sitting well”，译文已根据文档工程师逻辑进行了处理，确保语意连贯且不产生冗余重复。）


