- raw: 'Q: Health informatics leverages AI and big data strategies to analyze health
    populations to improve overall outcomes, but the quality of the data sets used
    carries the potential to influence and produce unintended results. We already
    see inherent bias in other industries, but what’s it mean for the medical world?


    A: One of the things that we try to do, for example, in the case of claims, encounter,
    and population data, is to develop risk stratification or other adjustments. Because
    what we’re trying to do is say, “This person or this group has a higher risk or
    higher severity of illness.” Or, “Here is some potential for a higher cost. How
    can we address them differently than in a lower risk population?” So, yes, we
    do assign quality control resources and monitor those analytics to make sure we’re
    understanding the data correctly.


    All of our groups come to us frequently and say, “You’re not calculating the risk
    adjustment or the risk stratification correctly. We think our population is higher
    risk than what you’re representing.” But there’s not a lot we can do with that
    anecdotal response right now. All we can do is grab all the data we can find.


    Of course, a lot of data isn’t perfect. It may be a spectrum of corrupt to bad
    data entry. If we’re talking about the kinds of codes that we’ll get representing
    a claim or encounter, the quality of that data will vary. A claim is when you’re
    asking for reimbursement for services, so it’s a fee for service scenario, like
    an invoice. An encounter is when services are under a capitated payment where
    we’re already paying that entity a monthly amount to take care of a certain number
    of people. We get data in the door about the services they received, but they’ve
    already been paid for it. Therefore, the incentive to send us good encounter data
    is far less than the claim data.


    Q: As the quality assurance professional in your organization, even though you’re
    primarily responsible for population health care, are you also possibly catching
    some fraud?


    A: Yes, in some cases. We have a special investigations unit, SIU, and I’m the
    chair of the Credentialing and Peer Review Committee. That’s where we look at
    those kinds of issues, and we work very closely with our SIU unit. For example,
    when they identify providers who are just writing tons of prescriptions for one
    particular medication and we find out that these patients whose names are on the
    prescriptions never received them (and don’t even have a diagnosis matching them),
    it raises a flag. We can identify them through algorithms, through data from payment
    integrity or our pharmacy data.


    Q: Do you develop your systems and tools for this kind of data mining and analytics,
    or is there software already available?


    A: It’s a mix. There are software tools out there where you can do that first
    pass at running the data and finding trends, but I think that we still are learning
    how to set those algorithms up. It’s another place where bias could come into
    play. We could identify the wrong people, and so we have to review the first pass
    of the data carefully. If it doesn’t make sense, we try to confirm it. If we see
    a trend, we have to ask, “Okay, is there a good reason for that trend?” Let’s
    say we have a provider identified for tons of prescriptions of one type, like
    risky or expensive, but then we go and find out that that’s a neurologist who
    is dealing with kids with intractable epilepsy. Okay, well, then that makes good
    rational sense.


    Q: Do you have to prioritize who you put under the microscope, especially with
    the SIU, because you can’t go after every single problem or person?


    A: Yes, and we have ten thousand providers! In this committee, we’re focused on
    the providers’ side of things a little bit more than the member side of the equation,
    but the numbers are so huge you have to use whatever is available. This is what
    we do with population management, as well. We’ve got to figure out what that spectrum
    is, then decide where to put resources.


    Q: In response to technology’s effect on litigation, most states require attorneys
    to demonstrate technical competence. With the growth of Informatics, do you expect
    medical professionals to be held to similar education requirements?


    A: I hope so. I’ve got a family medicine background, but I also have a clinical
    informatics background, and there are maintenance certification requirements for
    both of them. Again, we’re all working with EMRs, and if you have folks who could
    do so much better with that knowledge, even with just basic EMR wisdom, like knowing
    about pre-checked order sets or templates for notes or ways to find different
    orders, it would be advantageous.


    Q: Would that type of education be as relevant for an oncologist as opposed to
    a podiatrist?


    A: It depends. Everybody needs to have some level of experience to enter and pull
    information out of an EMR. There are some specific tricks to be able to do that
    well, and it’s not just about how to make sure the information gets in appropriately.
    Successive folks are going to be seeing those patients and have to understand
    what happened to the patient. If you have a medical assistant or office staff,
    and they’re trying to find a report on a patient, how easily can they get to that
    data, and in how many ways?


    Q: We now have changes to board structures where Chief Information Security Officers
    are no longer reporting to a Chief Information Officer. They’re going directly
    to the CEO because cybersecurity is so paramount. Is that now the case with medical
    organizations? Does the Chief Medical Information Officer sit in the boardroom?


    A: Generally speaking, I think the C-Suite remains similar to what it has looked
    like for a while. In our case, we have a Chief Medical Officer, and then you have
    some others reporting up and transitioning all of the time. We have a Chief of
    Enterprise Integration, and I’m Chief of Quality and Information. I think the
    reporting structure itself can be a little bit different sometimes depending on
    the organization and the people. If you have a COO who is better at overseeing
    some areas of medical operations, then it’s appropriate for some of those administrative
    medical staff to report up through that person. It depends. The technology efforts
    that we have here are just ever-present and constantly changing, and of necessity
    must be as efficient and flexible as possible at all times. The reporting structure
    almost doesn’t have to matter so much as long as you have the affected stakeholders
    making sure the right things are being done for projects and initiatives to succeed.


    Q: So, what exactly made you choose the field of Informatics?


    A: I went into Informatics because I liked the combination of clinical with data
    and with business. I think it’s part of being a family physician. I like being
    able to have my hands in a lot of things and understanding a lot about data, which
    is the informatics side. I like having that variety. When I was doing family medicine,
    I felt like I could do way more than taking care of one person at a time. I loved
    my patients, and we had great relationships. I learned a lot, they learned a lot,
    but I really love population health because I can make an impact on millions of
    people with huge programs that can not only affect a community in Los Angeles
    but conceivably far beyond that.


    Q: As a trained physician, you have a perspective on the stresses of data-driven
    life on the body and mind. Society is just beginning to understand the side effects
    of excessive dependence on our devices. How do we address infringements of technology
    on work-life balance?'
