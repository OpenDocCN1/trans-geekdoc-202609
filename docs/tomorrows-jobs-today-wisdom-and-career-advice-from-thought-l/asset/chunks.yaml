- raw: "A: I have a department of about 90 people, and I try to make sure they understand\
    \ their priority is themselves, their second priority is their family, their third\
    \ priority is work. I try to reiterate that all of the time for my department,\
    \ and when it comes to individual people with their own issues, I try to make\
    \ sure they’re focused on the right things. They’ve got to have their priorities\
    \ in order and believe if they come to me and have to take some days of PTO that\
    \ I’m going to understand and put that before the demands of an audit.\n\nAudits\
    \ will happen; work will happen; L.A. Care will continue to exist. The most immediate\
    \ thing is that these people take care of themselves and their families. Maybe\
    \ that comes from me being a family physician or being a family person, but it’s\
    \ in there. It’s ingrained in me that I need to make sure everybody knows that.\n\
    \nThat said, I have to try to model the behavior. That part is not as easy. I\
    \ do get complaints from colleagues that tell me I’m not always practicing what\
    \ I preach. So, every day I too have to work on that. What time do I have to be\
    \ at work? What time can I leave work? Do I need to be here seven to seven? Do\
    \ I need to be the one taking care of editing and reviewing all of the documentation\
    \ that comes in and out of my department? I want to do a little better with that,\
    \ but I think it’s a familiar challenge.\n\nQ: We now have this concept of social\
    \ media as a prism through which people begin to see themselves, where every person\
    \ must have their brand. This is an incredible pressure that I don’t think anybody\
    \ ever expected. How is that affecting people’s work life?\n\nA: Well, millennials\
    \ are a whole generation that has grown up with these devices attached to their\
    \ hands, and even more so the later generation. One example of my own sort of\
    \ experience with that was when I was on call. I had a beeper at the time, and\
    \ I started to have a physiologic reaction to every time that sound would go off.\
    \ You knew you were going to deliver a baby, or you had to go to the ICU or the\
    \ ED, or something was going to be an intense situation to deal with. And what\
    \ I progressed to is now I rarely, if ever, have my phone actually on a ring.\
    \ I always have it on vibrate at this point. I don’t pay attention to it sometimes.\
    \ I put it away, and, in the evening time, I might not pay attention to it for\
    \ the whole night.\n\nYou have to do what works for you. Some people are workaholics,\
    \ and they want to work every day of the week. That’s fine, but I do want to try\
    \ to espouse and motivate for a better type of balance.\n\nQ: You’ve achieved\
    \ success in medicine, and now you’re immersed in informatics and business optimization.\
    \ How has your medical training informed your approach to solving the business\
    \ piece of it?\n\nA: I think first of all, in medicine, we learn to assess a situation,\
    \ take in the data, try to figure out what a differential diagnosis would be.\
    \ You’re never trying to go right to a solution. You want to see what all of the\
    \ possible solutions are in all relevant scenarios. I kind of think of differential\
    \ diagnosis in a way, like a root cause analysis, where you’re trying to look\
    \ at all of the possibilities before you get to your final answer. And then, when\
    \ you get to your top three, top two, or even the only one it could be, based\
    \ on the data you have available, then you move into your solution. You could\
    \ look at your solution as a project, as an initiative that follows a particular\
    \ process.\n\nWe use the System Development Lifecycle process and others. And\
    \ it’s interesting how much my medical training set me up for being able to assess\
    \ data in a way that falls in line with almost any kind of stepwise assessment.\n\
    \nQ: Your work has taken you from the L.A. marathon to as far as Tanzania. What’s\
    \ the best lesson you learned going out into those communities and abroad that\
    \ you’ve been able to bring back into your work and professional life?\n\nA: It’s\
    \ a simple answer, but it’s to listen. And if we’re talking about the Los Angeles\
    \ marathon, you’ve got five seconds to listen to that person and see what their\
    \ exact issue is and try to figure out what to do about it because they’re running\
    \ and they’re going to come in for a few seconds, and you’ve got to get them out\
    \ on the road again.\n\nIn Tanzania, it is so foreign to western allopathic medicine\
    \ physicians as to what could be going on with a patient, that you’ve got to listen\
    \ to what their story is to understand that, number one you may be looking at\
    \ something like malaria or something unusual in the United States, but it could\
    \ also be something totally different. For example, we had issues in one particular\
    \ area where there was a myth that if you had AIDS and you had sex with a virgin\
    \ that you would be cured. And so, we had to deal with that situation and those\
    \ who truly believed. We had to listen and think about what we could do with the\
    \ population there to try to redirect them to the right people who could change\
    \ that perception. But we had to listen to those folks to understand where to\
    \ focus our efforts.\n\nThat being said, with medical care, the minute the patient\
    \ walks in the door, you’ve got to let them tell their story. You got to give\
    \ them the time because you can’t assume by looking at a person or looking at\
    \ the data that you know what’s going on. Not only that, you don’t know what their\
    \ priority is. If you’re not working with them on their priorities, then they’re\
    \ not going to trust you in terms of how you’re working with them.\n\nThe same\
    \ thing is true in business. If I don’t listen to what my direct boss, my CMO,\
    \ is telling me about his preference or his opinion or priority, I’m going to\
    \ go the wrong direction completely. I’ve got to listen to what he’s saying, to\
    \ listen to what the CEO is saying, and put it all together to make sure that\
    \ I strike the right balance. The same thing can be said for my department. If\
    \ I’m not listening to them and or understanding what their real issues are, then\
    \ we could have problems in terms of employee engagement.\n\n[Chapter 16](#nav.xhtml#toc22)\n\
    \n## [Your New Neighborhood Library](#nav.xhtml#toc22)\n\nPatrick Sweeney, Political\
    \ Director, EveryLibrary  \n\nTopics: Public Affairs, Library Science\n\n> “When\
    \ you think about the fact that libraries are about information and not simply\
    \ about books, you begin to see where the value is.”  \n\n> Patrick Sweeney\n\n\
    Patrick Sweeney is the Political Director for EveryLibrary, the United States’\
    \ first and only political action committee for libraries. He is co-author of\
    \ Winning Elections and Influencing Politicians for Library Funding and Before\
    \ the Ballot: Building Support for Library Funding. In 2019 he was named one of\
    \ the “40 under 40” by the American Association of Political Consultants (AAPC).\
    \ Patrick received his master’s in library and information science from San Jose\
    \ State University, where he now teaches courses on politics and libraries.\n\n\
    Q: Patrick, your advocacy work helps libraries become successful in securing funding,\
    \ expanding influence within communities, and staying relevant in the digital\
    \ age. With information at everybody’s fingertips, how have librarian’s challenges\
    \ evolved, and why is supporting them so key to the health of our citizenry?\n\
    \nA: Well, when you think about the fact that libraries are about information\
    \ and not simply about books, you begin to see where the value is. What it means\
    \ is that people are visiting libraries and seeking much more complex information,\
    \ and they’re looking for guidance in navigating all of it. These are the same\
    \ tasks that libraries performed when information was only found in books."
