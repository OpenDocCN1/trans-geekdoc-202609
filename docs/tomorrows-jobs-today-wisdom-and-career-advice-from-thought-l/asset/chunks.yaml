    heads from their daily tasks to evaluate the bigger landscape and engage strategically
    with different solutions. So, you have to maximize the time and attention you
    do have. We try to have a good mix of different content for people to engage with,
    but we always try to be engaging and informative. We will have a 60-second video
    of me on `LinkedIn` eating Ramen and talking about digital transformation, but
    we will also do the 60-minute-deep dive webinar on customer challenges related
    to, but not centered on, our solutions. Every piece of content must have entertainment
    or education value, or it’s a waste of time for our audience.


    The other challenge in our industry is white noise. Not only are there a ton of
    vendors, but they are all making claims, some more valid than others. On top of
    that, since technology is often new and evolving, all the vendors are defining
    it or categorizing what they do slightly differently. It’s so essential to build
    and maintain your credibility and invest time in educating your audience even
    when it doesn’t directly relate to selling your audience. That’s why we put a
    lot of resources into maintaining one of the highest quality blogs on `Office
    365`, `SharePoint`, and digital transformation.


    ## Q: Are artificial intelligence and machine learning disrupting our traditional
    enterprise content management (ECM) systems and strategies, and what steps can
    business leaders take now to be prepared for automated document lifecycle management
    future?


    A: AI and machine learning have been impacting enterprise content management systems
    in mostly positive ways. One of the highest value use cases has been search. For
    example, `Office 365` is getting so good at knowing what document I want to look
    at or edit based on my past behaviors. It’s almost scary. Ultimately this is a
    good thing because there are a lot of industry studies that show employees waste
    too much productivity searching for content. However, we have seen nightmare situations
    where organizations haven’t tagged or classified their content appropriately,
    and payroll data accidentally gets surfaced to the entire company. Ultimately
    enhanced search and AI is good, but organizations still need to be vigilant about
    their data.


    We are seeing robotics being deployed within the enterprise to help enhance productivity.
    AvePoint launched `AVA`, a virtual assistant chatbot within `Microsoft Teams`,
    that allows end-users to restore their deleted or lost items in `Office 365`.
    This helps end-users get what they need quickly and removes some of the tedious
    tasks that IT admins have typically had to handle.


    ## Q: Data protection has always been an issue with cloud technology, especially
    now with the General Data Protection Regulation and consumer rights laws in the
    United States. How do you prepare clients for highly technical cybersecurity and
    privacy challenges when so much of their data is in the hands of vendors and third
    parties?


    A: AvePoint was named a strong leader in a recent `Forrester Wave` on `GDPR` solutions,
    so we help in a lot of ways. First, you mentioned so much data being held in the
    hands of vendors and third parties, and this is true. It’s a risk that organizations
    must mitigate, but it’s a risk that the industry has been aware of for a few years
    now. That means things like cloud security assessments for `SaaS` vendors have
    become standard, but they are still trapped in email and spreadsheet hell. We
    offer an enterprise risk management solution that helps automate this process
    and allows organizations to calculate their privacy and security risk.


    We are seeing robotics being deployed within the enterprise to help enhance productivity.
    AvePoint launched `AVA`, a virtual assistant chatbot within `Microsoft Teams`,
    that allows end-users to restore their deleted or lost items in `Office 365`.
    This helps end-users get what they need quickly and removes some of the tedious
    tasks that IT admins have typically had to handle.


