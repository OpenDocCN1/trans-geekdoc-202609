    # Q: There’s usually a disconnect between information managers and the legislators
    setting records retention periods. Over the years, strategies like “big buckets”
    have attempted to mitigate this obstacle, but they’re imperfect and carry their
    own risks. What can be done to bridge the divide better?


    A: There are two pieces to the puzzle of records management: classification and
    retention. A records retention schedule needs to be straightforward enough to
    implement so that users can apply record codes to records. But the retention periods
    for the record classes need to be specific enough so that some types of records
    are not over or under-retained because they are mistakenly grouped with others.


    It is a balancing act, and big buckets can only be taken so far. If a record class
    contains record types that users or legal requirements suggest should have a different
    retention period, then a new record class should be created. The other area in
    which the business can affect retention is a prudent implementation of the retention
    schedule into the records management system. For example, a record class may be
    defined as event-based in the retention schedule, but if it is known that all
    records for that record class are sent to storage only after the trigger event
    has occurred, then the storage date can be used as the base date to calculate
    retention. Classifying records is only part of the puzzle. This becomes all too
    familiar for clients with a lot of active records in offsite storage. These records
    need to be reviewed periodically to identify records whose event triggers have
    transpired.


    # Q: Why not keep everything forever?


    A: The keep-everything culture has evolved as a byproduct of cumbersome retention
    periods and reduced storage costs. Rather than make the tough decisions about
    particular data sets, records are often tagged with an overly conservative retention
    period. This leads to an ever-increasing repository of data that becomes difficult
    to access and analyze, as well as increased exposure to potential litigation.
    It’s important to identify and remove `ROT` (redundant, obsolete, and trivial
    information) and retire or archive applications promptly. Collection, classification,
    and retention processes should be assessed and optimized. Collect only the minimum
    data required for a task. Build a manageable records classification scheme so
    that it is straightforward for users to apply a record code. Prudently implement
    the retention schedule and review retention periods periodically. These are becoming
    requirements in the modern era.


    # Q: How are multinationals like Iron Mountain leveraging artificial intelligence
    techniques and machine learning to help clients measure and monetize their information
    assets?


    A: Companies know the vast repositories of data they generate and store are valuable,
    but extracting that value is difficult. Iron Mountain has entered into a partnership
    with `Google Cloud` to analyze unstructured data. The `Iron Mountain InSight`
    solution combines Iron Mountain’s experience in data analytics and information
    governance with Google’s artificial intelligence and machine learning capabilities.
    Iron Mountain is also working with `MicroFocus` and `Active Navigation` to offer
    content analytics. With classification using machine learning and retention applied
    using Iron Mountain’s privacy and policy expertise, these partnerships hope to
    shine some light on dark data.


    # Q: You’re a big supporter of your local math pentathlon and youth academics.
    What guidance do you have for a young person just getting started in preparing
    for a career in big data, consulting and analytics, or even an individual re-entering
    the workforce seeking opportunities in this developing field of technology and
    business?


    A: Math and logic games are a fun way for children to start learning critical
    and recovery.


    # Q: In your role as a fellow of ARMA International, a premier organization for
    records management professionals, you’ve helped to connect organizations with
    practitioners who can demonstrate the benefits of information governance (IG).
    What steps do you think organizations like ARMA will play as managing data becomes
    such a ubiquitous responsibility?


    A: A number of the core professional organizations have been dealing with an identity
    crisis for some time, and still struggle to have a clear and concise “elevator
    speech” on mission and value. Information governance, while it has a wide breadth,
    still has the industry confused, and remains a term that does not universally
    resonate with senior managers. The industry’s professional associations, while
    they have tremendous value and passionate support, are challenged to maintain
    their position in a fast-evolving and complex field.

