  trans: '


    # A: 在过去的两年半时间里，我们确定有 27 亿人（包括流离失所的难民和极端贫困地区的人）参与了某种形式的供应链。这可能意味着你是刚果最贫困的农民，种植咖啡、可可或乳木果油——你知道的，这些都是化妆品中的成分，而你的贡献体现在像
    8 美元拿铁和昂贵身体乳之类的品牌中。通过研究他们的参与情况，我们意识到目前的帮助人们脱贫模式已经失败了。


    旧的经济模型之所以失败，是因为它们将“帮助人们脱贫的能力”与“让贫困人口参与供应链”分离开来。我们采取了另一条路线。从未有人这样做。我们说：“如果那些绝对处于‘最后一公里’的人能够平等地参与呢？”那么对品牌而言的价值突然变得更加相关了。


    让我们举个简单的例子。如果你在加纳购买可可，而你是一家大型巧克力公司，那么今天你的最后一公里农民极有可能是极其贫困且隐形的。无论你实施了多少种追溯性、透明度或公平贸易，除非该农民能够参与到自己的数据生成中，例如知道“我每隔两周向这个大品牌卖
    40 公斤”，否则那个农民将继续生活在贫困中。今天那个贫困农民面临着重重阻碍，特别是在条件恶劣的情况下。


    我一个周前刚在赞比比亚，亲眼目睹了这个问题的案例：女性农民不得不以更高的价格借贷。女性农民往往发现自己处于劣势地位，因为在很多情况下，她们无法证明自己的历史。如果她在上游销售
    40 公斤，而有 7 个中间商，会怎样？在她卖完咖啡后，有人取走，然后带给另一个人，下一个人送到仓库，最终她失去了追踪自己产品的能力。你看，虽然互联网进入了贫困地区，但它并没有真正将人们从极端贫困中拉出来，更不用说永久性了。有移动支付、大数据、AI
    等，但没有任何一个模型曾能让那位母亲、那位农民平等地参与。


    当我说“平等参与”时，这非常基础。对我来说，平等参与意味着：

    1. 她拥有一份交易的物理及数字存储副本，没有人能偷取或操纵。

    2. 她可以证明自己的交易历史，这使她在该供应链中的存在合法化。

    3. 它允许她现在杠化这些数据来降低借贷成本。它让她具有可携带性（身份活性）。


    这就是我们决定研究区块链的原因。从未有人这样做。人们一直在谈论如何利用区块链来行善，但我们是少数每天都在做的人之一，在采取商业化方法的同时，又保持着深远的目标驱动。


    我们创办了一家兼顾营利与使命的软件公司，现在最大的品牌正向我们走来，因为我们解决了他们两个方面的问题。一方面，供应链现在变得更具成本效益且更高效。他们在质量、市场准入和预测方面对供应链有了更好的可见性，这为作物保险、气候保护、教育提供了生态系统。硬币的另一面是他们可以开始解决性别平等和劳动权利等问题。


    ## Q: 在您的模型中，BanQu 提供了一个即服务软件（SaaS）平台，该平台开箱即可支持六项关键联合国可持续发展目标（UN-SDGs）。这套“经济身份护照”共同供寻求实现联合国可持续发展目标及其他承诺的企业、政府和国际非政府组织（INGO）使用。自发布以来，您发现哪些工具利用率最高？


    ## A: 它们是交织的。这就是为什么我们采取了平台方法，也是为什么它是即服务。许多公司关注健康、水、性别等。我们关注这六项联合国可持续发展目标，并意识到它们应该结合在一起。通过这种方式，确保目标是可持续的。让我们看一个例子。我们已经在八个国家上线。正如我提到的，在撒哈拉以南的非洲，BanQu
    为他们带来了信心和尊严，现在农民拥有了经济身份。


    ## Q: 您能详细解释一下“经济身份”这个概念吗？


    ## A: 对我们来说，经济身份是证明你拥有支付记录的能力，这在新兴市场至关重要，特别是在安全和建立作物信誉方面。如果你每隔两周交付 40 公斤，而经纪人从你手里拿走，你无法证明你一直在种作物。因此，随着时间的推移，农民现在可以看到自己的整个历史，而且这在账本上得到了验证，使她变得可以信贷（bankable）。这同时也及了品牌以及整个供应链。


    ## Q: 对于应用这一区块链解决方案的机构，是否有某些模块或组件在短期内比其他更有用？


    ## A: 最紧迫的是供应链连接。例如，食品行业的一些大品牌会与我们合作，以实现现有作物流的即时追溯和透明化。就像他们购买 `Salesforce`、`Oracle`
    或 `SAP` 一样。他们订阅我们的平台。我们配置语言、货币、工作流、资产类别等。我们还有一个元数据框架，客户现在可以自己创建 KPI 和指标。我们上线后，通过短信部署给没有智能手机的农民，现在最后一公里实现了实时连接。可追溯、透明，且农民平等参与。


    所以，当交易发生时，他们把一袋可可或咖啡或其他任何东西带到市场，你作为农民收到确认交易的短信，以及位置和身份令牌。我们不玩加密货币。我们使用纯区块链。现在你拥有一份记录显示你交付了
    40 公斤，此外还有质量信息、支付金额，而且安全且私密。


    关键的赋能影响是，你拥有了从树到杯（或从矿山到电池）的永久数字证明。随着交易的进行，你拥有支付记录……这使她变得可以信贷……我将给予她更多的尊严。


    ## Q: 你们是否开始挖掘其中的大数据方面？如果是的话，在我们不断变化的监管环境下，这会带来哪些挑战？


    '
