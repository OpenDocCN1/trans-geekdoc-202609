    \nWe looked around and didn’t find any widely accepted definition of `eDiscovery`\
    \ that laid out the major conceptual steps. We said to ourselves, since we can’t\
    \ find anything out there, let’s see if we can put something together. I went\
    \ through my address book. We reached out and got a group of I think maybe 35\
    \ organizations and people who showed up at the first `EDRM` meeting in May of\
    \ 2005. We thought we were taking on a one-year project at the most. We were going\
    \ to come up with a straightforward, pragmatic definition or set of definitions\
    \ and some basic steps for people to think about as they through electronic discovery.\
    \ At that time, we had no idea that over a decade later, anybody would be paying\
    \ any attention to the work we were doing.\n\n# Q: And now that model is an entire\
    \ institution and brand at `Duke`. How did it find a home there?\n\nA: `Tom` was\
    \ retiring, and from my perspective, I felt I had perhaps overextended my stay\
    \ as a primary driver of `EDRM`. I also was looking at making a transition from\
    \ a solo practice to joining another organization. So, with that backdrop, `Tom`\
    \ and I decided it was time to look for a new home for `EDRM`. It took us a while,\
    \ but ultimately someone we both knew fairly well put us in touch with the folks\
    \ at `Duke`. Once we connected with them, things moved fairly quickly. In the\
    \ summer of 2016, `Tom` and I handed over the project to their law school.\n\n\
    # Q: What do you see as the `EDRM`’s most intrinsic benefit to the legal community?\n"
