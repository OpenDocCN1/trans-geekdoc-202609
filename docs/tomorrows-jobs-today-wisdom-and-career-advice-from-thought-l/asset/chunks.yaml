    # 问题：信息管理人员与制定记录保留期限的立法者之间通常存在脱节。多年来，诸如“大桶”（big buckets）之类的策略试图缓解这一障碍，但它们并不完美，且带有自身的风险。可以做些什么来更好地弥合这一鸿沟呢？


    回答：记录管理的谜题由两部分组成：分类和保留。记录保留计划必须足够简单以便执行，让用户能够将记录代码应用到记录中。但记录类别的保留期限需要足够具体，以免某些类型的记录因错误地归类到其他类别中而导致保留过度或不足。


    这是一场平衡术，而“大桶”策略的作用是有限的。如果一个记录类别包含了用户或法律要求认为应有不同保留期限的记录类型，则应该创建一个新的记录类别。业务部门影响保留的另一个领域是，将保留计划审慎地实施到记录管理系统中。例如，在保留计划中，某个记录类别可能被定义为基于事件的，但如果已知该类别的所有记录只有在触发事件发生后才发送到存储，那么就可以使用存储日期作为基准日期计算保留期。分类记录只是谜题的一部分。对于在异地存储中拥有大量活动记录的客户来说，这再熟悉不过。这些记录需要定期审查，以识别那些触发事件已经发生的记录。


    # 问题：为什么不永久保留所有内容？


    回答：“保留所有”的文化是繁琐的保留期限和存储成本降低演变的副产物。与其对特定数据集做出艰难的决定，记录往往被标记上一个过度保守的保留期限。这导致数据库不断增大，变得难以访问和分析，同时也增加了面临潜在诉讼的风险。识别并移除
    `ROT`（冗余、过时和无意义的信息）并及时退役或归档应用程序非常重要。应该对收集、分类和保留过程进行评估和优化。只收集任务所需的最少数据。建立一个易管理的记录分类方案，以便用户轻松地应用记录代码。审慎地实施保留计划并定期审查保留期限。这些在现代已成为一种必要要求。


    # 问题：像 Iron Mountain 这样的跨国公司如何利用人工智能技术和机器学习来帮助客户衡量并实现其信息资产的价值？


    回答：公司知道他们生成和存储的海量数据库非常有价值，但提取这些价值非常困难。Iron Mountain 已与 `Google Cloud` 建立合作伙伴以分析非结构化数据。`Iron
    Mountain InSight` 将 Iron Mountain 在数据分析和信息治理方面的经验与 Google 的人工智能和机器学习能力相结合。Iron
    Mountain 还在与 `MicroFocus` 和 `Active Navigation` 合作提供内容分析。通过使用机器学习进行分类，并利用 Iron
    Mountain 在隐私和政策方面的专业知识应用保留，这些合作伙伴关系希望为暗数据（dark data）带来一些光明。


    # 问题：你是当地数学五项活动和青少年学术的大支持者。对于刚开始准备从事大数据、咨询和分析职业的年轻人，或者对于在这一不断发展的科技和业务领域寻求机会的重返职场人士，你有什么建议？


    回答：数学和逻辑游戏是儿童开始学习批判性思维和恢复能力的一种有趣方式。


    # 问题：作为 ARMA International（领先的记录管理专业人员组织）的会士，你帮助机构与能够证明信息治理（IG）效益的从业人员建立联系。你认为在数据管理成为一项无处不在的责任时，像
    ARMA 这样的组织将扮演什么样的角色？


    回答：许多核心专业组织已经应对了一段时间的身份危机，仍然难以就使命和价值提供清晰简洁的“电梯演讲”。信息治理虽然涵盖范围广泛，但仍然让行业感到困惑，并且仍然是一个在高级经理中引起普遍共鸣的术语。行业协会虽然具有巨大的价值并受到热情的支持，但在快速进化且复杂的领域中维持其地位也面临着挑战。


    '
