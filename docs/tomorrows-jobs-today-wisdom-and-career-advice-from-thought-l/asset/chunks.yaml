- raw: 'A: In the mid-eighties, I worked on pattern recognition, image processing,
    database systems, and expert systems for archaeologists and prehistorians. Today,
    taking a computer, drones, and sensor systems to an excavation is standard. The
    capabilities of software, hardware, and self-learning algorithms are far more
    sophisticated than in those days. But let’s consider so-called old-fashioned methods
    of organizing information. You mentioned the terms “legacy” and “indexes.” Metadata
    is not legacy. It is a question of quality, control, and governance.


    Controlled metadata, vocabularies and taxonomies are of special value to big data
    analytics, artificial intelligence, and machine learning. Controlled data sets
    work as guide poles to train new technologies with high-quality information. This
    is useful for automated indexing when capturing information, when sharpening enterprise
    search for qualified results, and managing your repositories with compliance requirements.
    Especially when it comes to compliance, straightly organized high-quality information
    is an asset. But, AI will change the game as well in the near future. Currently,
    classification schemes and file plans are developed manually by academic rules.
    In the future, software will analyze all information and organize itself by protection
    guidelines, user models, processes, value, retention.


    Q: This series of interviews with global leaders in fields like information technology,
    risk, and compliance seeks to find common values and themes in these disciplines
    across disparate cultures. I know that you are an advocate of standardization.
    Are there any commonalities in the projects and people you’ve worked with that
    you believe should be universal goals?


    A: Standardization is a necessity. Everywhere. We do it with our language, our
    terms, our grammar to enable understanding. We do it with hardware so that it
    supports interfaces and operating systems. We do it with software so that it can
    interact with other software and systems. We do this with the retention rules
    for documents in our records management systems. Standardization is everywhere;
    that’s no question. The real question is, what has to be standardized and for
    which purpose? And is standardization something to prohibit innovation? Is standardization
    regarding streamlining and controlling data in opposition to the culture of a
    group of people or an organization?


    The larger and more distributed an organization is, the harder the job of implementation
    of change and change culture. Old behavior, language barriers, time zones, cultural
    differences can sometimes make common values hard to define. Processes to keep
    values and make businesses run smoothly need, as well, a kind of standardization.
    This might all change in the future with artificial intelligence. Less work for
    humans means that human-driven use models and respect for human work will decrease.
    It’s a major social challenge because people often define their status through
    their work. So, this is a common thread in all projects. Who is to redefine processes,
    keep workers involved, try to help them overcome their fears of losing their jobs,
    and be responsible for implanting a new mindset for a new type of work environment?
    With AI looming ahead, we may even have to redefine what work is. Man is no longer
    the scale, the ruler, the canon.


    Q: In being at the forefront of enterprise content management (ECM) and systems
    design, you learned plenty of lessons about development. We live in a far more
    regulated environment than existed 30 years ago. Our challenges today intersect
    with privacy and security. What are the types of risks and concerns you believe
    developers of content management systems should be thinking about when building
    the next Documentum, SharePoint, Alfresco, or Relativity?


    A: There is no future for old dinosaur architectures and big enterprise solutions.
    Modern solutions have to care for every type and technical format of information
    available. The basic strategy for products is automation. Not only to get rid
    of human work and to speed it up but to improve quality control and establish
    new areas of business opportunity. Integration is still a major issue. We are
    no longer talking about traditional records management systems for records managers
    but the integration of ECM functionality into other software. Interfacing and
    application programming interfaces (APIs) are crucial. And like the world of mobile
    apps, we will see services come up, which integrate and configure automatically
    into other environments.


    Complex systems will only be manageable by AI-based administration software. So
    not only end-user relevant processes will be transformed but also the configuration,
    administration, and management of these solutions. The IT services concept will
    make sure that ECM functionality is available in the same way as Software-as-a-Service,
    Platform-as-a-Service, and on-premise. A change will be that end-users no longer
    see an ECM client because the functionality is integrated into the standard desktop
    environment. ECM loses visibility on the desktop and becomes standard infrastructure.
    All of these developments change the paradigm of the traditional ECM software
    architecture and functionality. They require new dev-ops, new development tools,
    listening to the user, faster testing and roll-out, easier configuration, pre-configured
    business solutions, and easy to use end-user interfaces. It’s a big challenge
    for all companies developing any type of software.


    Q: There has been a lot of noise around the General Data Protection Requirement
    ((GDPR) specifically the “right to be forgotten” and stringent privacy and data
    retention safeguards, but we haven’t seen much intellectual discussion around
    the broader social benefits the law intends to support. How do you see this “return
    to privacy” improving society when it seems that much of the younger generation
    not only dismiss the value of privacy but, as Simon Sinek has noted, see themselves
    through the lens of the over-sharing social media community?


    A: The GDPR has been in place for some time and is only now being enforced. It
    is not a return to privacy. Privacy requirements and regulations always have been
    here. But nobody really cared. We were careless with information and information
    sharing. And now we are complaining that internet giants are using our data. The
    new quality of the GDPR is twofold: on the one hand, it is for all of Europe and
    organizations dealing with European personal data and transacting business in
    Europe. So, it intends to become a worldwide standard. On the other hand, it threatens
    high fines for infringement.


    This is a tool for enforcement we missed in the past, and that’s why everybody
    started to care about it. But the other side is this, small businesses, associations,
    and others may come under threat of the GDPR. Where big companies can hire teams
    of lawyers and establish a data protection regiment, small businesses are overwhelmed
    by bureaucracy. Information management software is a necessary tool for larger
    companies to manage all data. They need the equivalent of a data map to identify
    what information is stored and it’s quality, value, and legal character plus how
    it is processed. Smaller businesses struggle with these requirements because of
    their size, larger business because of the complexity and the sheer amount of
    data involved.


    The social communities have a different view on the requirements. On the one hand,
    they have to care more about privacy. They must be able to deliver reports where
    they store data and what they do with it. On the other hand, the GDPR strengthens
    them because small forums, blogs, communities, groups, and businesses give up
    on complying and move their communities to Facebook, LinkedIn, or somewhere else.
    Communities like Facebook even use the necessary declaration of agreement to implement
    new technology like face recognition, which inflicts directly with privacy.'
