    A：这正是我希望看到的，我给你们举个例子。我们在班克市（City of Burbank）拥有的摄像头系统布局得很有战略性，但并不广泛。在南加州另一座知名城市，他们拥有无处不在的摄像头系统。他们最初关注的是主要干道，而不一定是在住宅区内。但他们发现，当他们抓获犯罪分子并在起诉中成功使用视频证据时，那些社区的人起初并不希望在那里安装摄像头。但当他们开始遭遇入窃案时，人们就会回来询问是否有视频证据，而结果并没有。自然地，这些居民开始要求安装视频系统。现在，那座城市已经处于这样一种：如果发生了入窃案，而他们没有在视频中拍到，他们几乎被迫部署新的摄像头。这就是技术如何迅速改变人们观念的典型例子。


    ## 第 6 章


    ## 围绕车载信息学的对话


    John Danenberger，州州保险公司（State Farm Insurance）法务顾问


    **主题：** 车载信息学、自动驾驶车辆


    > “车载信息学将解决很多问题，因为你会意识到事情已经和 50 年前一样了。”


    > John Danenberger


    John Danenberger（CPCU）是州州保险公司的法务顾问，专门负责处理车载信息学相关的问题。他曾服于美国陆，并在德克萨斯州和伊利诺伊州拥有法律执业。他获得德波尔大学学士学位、伦敦大学学院（UCL）硕士学位以及芝加哥洛罗拉大学法学院的法博士学位。


    **问：** John，我们的汽车就像轮子上的智能手机，追踪车辆位置、性能和驾驶行为。数据点包括唯一标识符、刹车和加速习惯。汽车保险公司究竟是如何利用车载信息学的？


    **答：** 现在，应用驱动型保险公司在利用这项新技术方面比传统保险公司做得更好。像 `Lemonade`、`Root`、州州的 `Highroad` 和
    `Blue Owl` 等公司正在利用车载信息学为每个人的风险敞口定价。这对客户来说是巨大的，因为他们只需要安全驾驶就能影响自己的保费。他们可以说：“看，通过开得更安全，我是一个更好的公民，并且获得了保费折扣。”


    **问：** 车辆车载信息技术收集的数据归谁所有，谁可以访问？


    **答：** 增长的趋势是认为驾驶员拥有数据。但当他们购买配备车载信息学的新车时，他们到底放弃了什么？以 `Honda` 为例，他们可以很容易在销售合同中加入一个条款，说通过签署这份交易并通过我们进行融资，你同意放弃数据所有权。我认为大多数客户愿意出让部分隐私，只要在发生理赔或紧急情况（例如需要拖车或仅仅一桶汽）时，他们的生活能得到更快速、更容易的。一旦数据离开汽车并存在卫星云空间中，那么它可能就属于原始设备制造商（OEM）。我强烈支持大型保险公司与制造商合作，这样我们就可以共享这些数据。如果我们能立即获得这些数据，就能更快、更准确地服务我们的客户。


    **问：** 你是否预计看到围绕车载信息学和数据隐私的监管兴趣发生？


    **答：** 我认为在未来五年内，我们将看到一些公司以低价或低值价格进入市场，然后必须在 12 到 18 个月内大幅提高费率。我们已经在罗德岛州和加利福尼亚州看到了，随着这些新兴的、应用驱动型保险公司进入更多市场，我们将在其他州看到。到时候监管机构将介入并说类似的话，：“好，等一下。我们看到了你们的初始申请。在费率调整之前我们批准了你们的初始申请。让我们看看让你们合理化这种费率增长的数学依据是什么。”各州希望创新并对业务友好。但另一方面，他们必须解释自己的决策。


    **问：** 有什么障碍阻碍了创新和自动驾驶技术的采用？


    **答：** 简短的回答是联邦机构无法就模型法案达成一致，而且他们在自动驾驶技术方面的发言很缓慢。机构本身没有达成一致，联邦政府也没有统一的信息。


    **问：** 车载信息学可以帮助解决公平性和环境问题吗？


    **答：** 它们绝对可以。我们已经看到保险公司利用车载信息学做了什么，我们也看到人们减少了汽车的使用，这对环境是有好处的。我们看到驾驶员变得更加负责。车载信息学将解决很多问题，因为你会意识到事情已经和
    50 年前一样了。仅仅因为有些人没有安定下来、买房和组建家庭，并不意味着他们的风险敞口比那些可能做了这些的人更高。


    **问：** 你认为在大型企业中寻求新兴技术相关职位的专业人士会有哪些机会？


    **答：** 增长空间是巨大的。未来 10 到 20 年对于想要在这个领域从事定价、合同和法律工作的专业人士来说将将是令人兴奋的。能够为这些有趣的产品定价，并识别公司需要为客户和员工承担风险的专业人士将能够以一种聪明而直接的方式起草合同。上限是无限。


    **问：** 你是如何从军旅生涯转型到在美国企业中工作的？


    **答：** 我从芝加哥法学院毕业，开始在一家知识产权公司工作，并幸运地在伊利诺伊州和弗吉尼亚州的许多法庭上进行过演讲。当我进入 `JAG Corps`（法官团）时，他们让我担任审判律师。我本更倾向于做辩护工作，但他们让我当了检察官。


