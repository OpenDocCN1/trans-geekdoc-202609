  trans: '

    我们正看到技术供应商市场正在接管领导角色，它们可能成为设定方向和引导行业的新决定性力量。是的，虽然是出于自身利益的，但它可能正是未来需要的。我不担心相关性问题，因为未来将继续围绕信息和技术，以及作为资产的数据管理、保护和利用而展开。虽然传统的记录管理器（Records
    Manager）的角色可能不再持续具有相关性，但我并不认为这特别令人。相关性存在于工作本身，而且它会随之演变。


    ### 问：这本书的任务是识别贯穿于所有信息管理学科的共同智慧线索。作为一名曾在多个行业担任过从业者和顾问的人，你认为哪些原则是数据、技术和人员管理取得成功结果的关键？


    ### 答：我更倾向于在我的方法中融入 `KISS` 原则，即“保持简单”，这包括在识别解决方案、选择技术、开发分类法、编写政策或规划更佳实践的实施时保持简单。简单总是胜过复杂，这在考虑终端用户和加速目标实现时无疑是关键的。这种保持简单的原则并不意味着没有投入时间、没有使用分析手段，或者在获得支持或实施变革时没有使用策略。其本质在于，实现目标时通过聪明化最大化简化。引用阿尔伯特·爱因斯坦的话：“一切都应该变得尽可能简单，但不能过于简单，”以及达芬奇的话：“简单是终极的复杂。”


    ### 问：作为从业者，你获得的最具建设性的教训是什么？你又是如何将其转化到咨询业务中的？


    ### 答：能够与我组织的决策者建立对他们和组织都有意义的联系，这很重要。由于记录管理需要一种企业级的方法，我培养出了一种理解并将其与宏观业务目标对齐的直觉。像任何业务经理一样，我意识到我需要精明干练，以为我的倡议获得持续的支持和预算。我所有的同仁都在追求同样的，而我的领域长期以来被视为一种远离核心使命的开支性运营。当然的，我不认同这一点，因为我知道我们所做的工作支持着底线。


    我带入咨询领域的是对从业者挑战的敏锐理解，并帮助他们强化甚至提升他们对创造重要性的需求。由于曾坐在会议室桌的他们一侧，我有时知道正确的下一步可能并不符合高层管理或组织的当前需求。倡议在执行上可能有一个最佳实践顺序，但现在获得部分支持并证明其价值，比完全没有支持要好。我尊重从业者，并努力确保他们最终处于更好的境地，并在未来感到被赋能。


    ### 问：在大数据、区块链、物联网（IoT）、量子计算和人工智能这五大主要新兴领域中，你认为哪一个需要记录管理和信息技术领导者最关注？为什么？


    ### ：：我认为 `IG` 和 `IT` 领导者最需要关注的并非与任何单一领域有关，而是有能力在不阻碍进展的情况下，停下来并投入时间在战略愿景和路径上。


    无论技术和新兴领域如何，太多的组织采取的是反应性而非主动的方法。结果是，往往基于局限的视角进行持续的“预算年度”投资，而且经常缺乏业务部门的深度参与，或者没有考虑业务整体向何处发展。这种“快速决策优于
    明智决策”的优先准则正在以各种深刻的方式损害着组织，包括导致混乱的信息环境。愿景的一部分需要管理不断增长的内容量，同时最大化其资产价值。否则，组织将始终处于被动反应状态，并受过去的投资以及支持孤岛小组的碎片化工具。


    ### 问：你是如何发现自己倾向于记录和信息管理世界的？


    ### 答：这个领域在我职业生涯的早期就发现了我，这是一条自然的道路。我一直是一个非常有条理且善于分析的人，对企业级的范围和价值感兴趣，并将记录和信息视为组织最关键的资产。技术在流程管理中的应用吸引了我。因此，我投向了这一领域并将其作为职业事业。


    # 第三部分 关系至关重要


    > 你可以夺走我的工厂，毁我的建筑，但只要给我员工，我就能重新建立一切。


    —— 亨利·福特


    '
