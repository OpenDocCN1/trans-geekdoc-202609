    like cloud security assessments for `SaaS` vendors have become standard, but they
    are still trapped in email and spreadsheet hell. We offer an enterprise risk management
    solution that helps automate this process and allows organizations to calculate
    their privacy and security risk.


    Second, you noted the challenge of data going to third parties. The third way
    we help organizations is by offering a solution that can scan data.


    Q: Markus, you work with companies to help them better understand and address
    decades of often-incomplete metadata tied to some of their most treasured information
    assets. In certain cases, your client’s institutional memory has been completely
    lost. They’re struggling to figure out whether to dispose of their records by
    balancing retention costs untimely destruction risks. How does your team leverage
    diagnostic, predictive, and prescriptive analytics to make sense of the data to
    make informed decisions?

