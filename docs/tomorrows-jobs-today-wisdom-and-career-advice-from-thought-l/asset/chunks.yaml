    is to Los Angelesos. `Crabill’s Hamburgers Shoppe` serves up two items: sliders
    and home-made potato chips, cash only. People drive from miles around to sit at
    the six-seat counter restaurant, waiting in lines outside without complaint for
    the legendary lunch. Yet despite numerous opportunities to franchise the business,
    the family-run company has been resisting expansion since 1927. They’re comfortable
    with their profitable lot, and there’s nothing wrong with that.


    The secret of `Crabill’s` success is no different from that of `In-N-Out`. `Less
    is More` is a proven strategy that enables businesses to effectively execute on
    their mission and focus on keeping operations running smoothly.


    ## Creating digital boundaries


    The `Less is More` strategy and mindset are also useful for separating work demands
    from the burdens and blessings of life’s responsibilities. After all, our first
    priorities in life remain our physical health and mental well-being. Those prerequisites
    for happiness can hardly be satisfied with the success of our careers. We once
    referred to this careful dance as “work-life balance,” but recently, emboldened
    by the ubiquitous nature of personal devices, a new euphemism has arisen. It’s
    designed to normalize our workaholic tendencies and is labeled “work-life integration.”

    '
  trans: '


    我们现在所处的这种新范式必然要求我们有选择地放大那些需要被听到的声音，并在纷繁的入入杂声中有意识、有方法地识别并抓住机会。要真正利用书中提供的第一个课程——“差距即机会”（`Gaps
    are Opportunities`），我们必须经常行使意志，在通向更长久的回报的过程中，避免冲动和低廉的诱惑。在工作和生活中，我们必须在这一节奏中保持自律。清晰、简洁和直接将日益成为推动我们议程和职业生涯的紧缺软技能。


    ## 寻找寻找底线


    然而，“少即是多”（`Less is More`）不仅仅关乎隐私，或我们的行为举止，在大多数品牌都依赖信息流作为货币的今天，这是一种更好的经营方式。从公司治理和项目管理的角度来看，反应性管理技术、资源扩张或用金钱解决问题已不再是安全或具有成本效益的选择。它们曾经是这样过吗？事实上，任何在受监管行业工作过的人都目睹了大型组织如何轻易地重复地为了象征性地完成勾选而浪费预算。大多数采购专业人士在诚实的情况下，可以告诉你关于工作任务说明的恐怖故事，这些说明最终只导致了一张虚幻的账单，甚至留下了漏洞。这是因为（特别是在大数据时代）如果没有清晰简洁的目标、路线图和沟通策略，解决方案越官僚化，结果就越可能不理想。这种常见的无序也会影响一个实体，无论是公共还是私有，无论底层问题的复杂程度如何。


    “少即是多”（`Less is More`）策略究竟是如何让商业世界最优秀的团队运行如此顺畅的？这个想法本身在当今的商业气候下似乎是违直的，但那是因为我们已经习惯了信息过载，以至于本能地对微小的外部压力和监管产生过度反应、反应性反应。能够克制的公司仍然可以有效应对紧迫的关注和市场变化，但他们通过简化公司政策、优先考虑业务目标以及以同样的成熟度进行沟通来实现。这并不意味着精确和质量保证没有用武，但我们往往看到微观管理扼杀了发明的之母。


    在财富世界五百强（`Fortune 500`）公司担任高管期间，我们密切观察了审慎、克制的战略规划、轻量的高级管理足迹以及以适中节奏执行终极项目的切实收益。我们还见证了恰恰相反的影响，以及它给即使是最耐心、最有韧性的知识工作者和团队领袖带来的压力。随着时间的推移，由于书中一些同事也经历过的某些艰痛教训，我们开始见证并重视“少即是多”（`Less
    is More`）策略的结果。在克制和主动之间找到正确的平衡，是信息时代所有变革者的一项基本技能。这在数据保护和不可避免的数据泄露时代尤为真实。


    如果我们把这个概念再推进一步，并将其置在利用净推荐值（`Net Promotor Score`，简称 `NPS`）衡量客户体验的背景下思考它，我们就能获得关于简化和平衡需求的绝佳案例。大多数组织在使用这一通用实用工具时最终都做了同样的事情。他们对一切进行疯狂调查，建立巨大的数据湖，最后甚至无法“见木不见林”。这种痴迷让客户和员工陷入疯狂，此外，如果实施不当，还会制造一场分析噩梦。最终，大多数公司认同于一个问题：你有多大的可能推荐、购买、留存等？这就是我们试图在各种程序和产品的间隙中寻找机会时所做的。我们正试图挖掘底线，即主要目标、激励因素和差异化因素。在墙上钻一千个洞通常只会让你得到一个昂贵的新的干墙工程。关于客户体验的一些答案和怀疑，仍然可以通过直接倾听你真实的客户（无论是面对面、通过电话还是邮件）得到最好的理解和确认。


    为了帮助发现并保持正确的平衡并避免这种垃圾数据的洪流，我们最好的团队和领导者坚持认为，指导原则、政策和指令应该是清晰简洁的。这似乎显而易见，但在实践中并不总是如此，尤其是在过度分享的时代，对于那些了解法律但对运营规则知之甚少。这是我们在工作和生活中共同面临的熟悉的话题。


    为了策略性地选择我们的词汇和行动，这也能让我们脱颖而出。


    '
