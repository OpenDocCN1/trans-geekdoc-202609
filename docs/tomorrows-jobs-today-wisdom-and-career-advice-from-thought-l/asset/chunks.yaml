- raw: "A: The two main challenges in digital marketing are time scarcity and white\
    \ noise, which seem more pronounced in the enterprise IT space. The IT department\
    \ is being asked to do more with less, and they only have so much time to lift\
    \ their heads from their daily tasks to evaluate the bigger landscape and engage\
    \ strategically with different solutions. So, you have to maximize the time and\
    \ attention you do have. We try to have a good mix of different content for people\
    \ to engage with, but we always try to be engaging and informative. We will have\
    \ a 60-second video of me on LinkedIn eating Ramen and talking about digital transformation,\
    \ but we will also do the 60-minute-deep dive webinar on customer challenges related\
    \ to, but not centered on, our solutions. Every piece of content must have entertainment\
    \ or education value, or it’s a waste of time for our audience.\n\nThe other challenge\
    \ in our industry is white noise. Not only are there a ton of vendors, but they\
    \ are all making claims, some more valid than others. On top of that, since technology\
    \ is often new and evolving, all the vendors are defining it or categorizing what\
    \ they do slightly differently. It’s so essential to build and maintain your credibility\
    \ and invest time in educating your audience even when it doesn’t directly relate\
    \ to selling your audience. That’s why we put a lot of resources into maintaining\
    \ one of the highest quality blogs on Office 365, SharePoint, and digital transformation.\n\
    \nQ: Are artificial intelligence and machine learning disrupting our traditional\
    \ enterprise content management (ECM) systems and strategies, and what steps can\
    \ business leaders take now to be prepared for automated document lifecycle management\
    \ future?\n\nA: AI and machine learning have been impacting enterprise content\
    \ management systems in mostly positive ways. One of the highest value use cases\
    \ has been search. For example, Office 365 is getting so good at knowing what\
    \ document I want to look at or edit based on my past behaviors. It’s almost scary.\
    \ Ultimately this is a good thing because there are a lot of industry studies\
    \ that show employees waste too much productivity searching for content. However,\
    \ we have seen nightmare situations where organizations haven’t tagged or classified\
    \ their content appropriately, and payroll data accidentally gets surfaced to\
    \ the entire company. Ultimately enhanced search and AI is good, but organizations\
    \ still need to be vigilant about their data.\n\nWe are seeing robotics being\
    \ deployed within the enterprise to help enhance productivity. AvePoint launched\
    \ AVA, a virtual assistant chatbot within Microsoft Teams, that allows end-users\
    \ to restore their deleted or lost items in Office 365. This helps end-users get\
    \ what they need quickly and removes some of the tedious tasks that IT admins\
    \ have typically had to handle.\n\nQ: Data protection has always been an issue\
    \ with cloud technology, especially now with the General Data Protection Regulation\
    \ and consumer rights laws in the United States. How do you prepare clients for\
    \ highly technical cybersecurity and privacy challenges when so much of their\
    \ data is in the hands of vendors and third parties?\n\nA: AvePoint was named\
    \ a strong leader in a recent Forrester Wave on GDPR solutions, so we help in\
    \ a lot of ways. First, you mentioned so much data being held in the hands of\
    \ vendors and third parties, and this is true. It’s a risk that organizations\
    \ must mitigate, but it’s a risk that the industry has been aware of for a few\
    \ years now. That means things like cloud security assessments for SaaS vendors\
    \ have become standard, but they are still trapped in email and spreadsheet hell.\
    \ We offer an enterprise risk management solution that helps automate this process\
    \ and allows organizations to calculate their privacy and security risk as well\
    \ as map their data flows across their organization and with third parties.\n\n\
    Second, you noted the challenge of data going to third parties, but the reality\
    \ is the biggest challenge organizations have with their data is internal. A majority\
    \ of organizations aren’t classifying or tagging their data! How can they protect\
    \ their sensitive data if they don’t know where it is? This is a colossal compliance\
    \ risk. We offer a data validation and classification solution that can scan structured\
    \ and unstructured data across file shares and content systems to help organizations\
    \ classify their data.\n\nThe third way we help organizations with data protection\
    \ is by offering a data classification and protection solution that can identify\
    \ and help resolve incidents in real-time and prevent people from uploading sensitive\
    \ content to places they shouldn’t.\n\nQ: We’re conducting these interviews to\
    \ elucidate global perspectives from leaders with diverse backgrounds and across\
    \ industries. In reviewing your work, I came across some business lessons you\
    \ learned on a big trip to Kamala, Uganda, where you facilitated a web development\
    \ course for impoverished students. Can you tell me how traveling around the world\
    \ has informed your perspectives on how data should be governed, and what if anything\
    \ we can learn from science, technology, engineering, and math (STEM) students\
    \ in the developing world?\n\nA: What we can learn from STEM students in the developing\
    \ world is first to be grateful for the tremendous opportunities we have been\
    \ given, and it made me realize that as such, we have a responsibility to impart\
    \ this opportunity with those less fortunate. But also, on a personal level, the\
    \ pure joy in being able to learn new things and to have a passion for your vocation\
    \ is one of the things that get you out of bed in the morning.\n\n[Chapter 12](#nav.xhtml#toc17)\n\
    \n## [Illuminating the Physical Realm of Dark Data](#nav.xhtml#toc17)\n\nMarkus\
    \ Lindelow, Principal, Iron Mountain  \n\nTopics: Analytics, Records Management\n\
    \n> “Companies know the vast repositories of data they generate and store are\
    \ valuable, but extracting that value is difficult. With classification tools\
    \ using machine learning and applying policy expertise, we can shine some light\
    \ on dark data.”  \n\n> Markus Lindelow\n\nMarkus Lindelow leads the Information\
    \ Governance and Content Classification Practice Group for Iron Mountain, the\
    \ world’s largest information management company, where he’s been pioneering breakthrough\
    \ analytic techniques for over a decade. He holds a master’s in computer information\
    \ systems from Saint Edwards University.\n\nQ: Markus, you work with companies\
    \ to help them better understand and address decades of often-incomplete metadata\
    \ tied to some of their most treasured information assets in the form of historical\
    \ paper records and materials. In certain cases, your client’s institutional memory\
    \ has been completely lost. They’re struggling to figure out whether to dispose\
    \ of their records by balancing retention costs untimely destruction risks. How\
    \ does your team leverage diagnostic, predictive, and prescriptive analytics to\
    \ make sense of the data to make informed decisions?\n\nA: Our content classification\
    \ process focuses on making the best use of the available metadata. This means\
    \ classifying records with meaningful metadata as well as analyzing the classified\
    \ inventory to create classification rules for records with little or no metadata.\
    \ We have identified attributes within the data that tend to correlate with classification\
    \ conclusions. We assess the classified records associated with an attribute to\
    \ create a profile that may inform a rule to classify the unclassified records\
    \ sharing that same attribute.\n\nIf, for example, there are 100 cartons associated\
    \ with pickup order XYZ, and 90 of those cartons have been classified, and furthermore,\
    \ all 90 are classified to ABC100, can we create a rule to classify to ABC100\
    \ the ten unclassified cartons belonging to order XYZ? Clients then may weigh\
    \ the risk when applying this type of classification rule, and the process may\
    \ even include a random sampling of cartons for physical inspection to verify\
    \ the classification."
