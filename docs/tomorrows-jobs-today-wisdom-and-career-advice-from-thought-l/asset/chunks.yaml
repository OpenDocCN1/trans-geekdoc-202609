- raw: "A: I guess for the AI data scientists, the first advice I would give is deep\
    \ learning is not the same as deep understanding. And I know there’s a lot of\
    \ excitement around deep learning, but I think we must go beyond it and look at\
    \ all other forms of learning and intelligence. The way deep learning traditionally\
    \ works is based on what patterns you can draw from the data. That’s just one\
    \ way that we learn, and we also learn in other ways. And not enough work is being\
    \ done in other ways of learning. So, continuous learning. Learning at the symbolic\
    \ level. Learning not just from patterns, but by inference. I’m sure that at the\
    \ highest level, even some of the leading researchers of deep learning are very\
    \ conscious of some of the drawbacks, and are trying to address that. Also, as\
    \ an AI scientist, you need to be open-minded in embracing different things, to\
    \ be able to move forward in the creation of AI. So, that would be one piece of\
    \ advice.\n\nFor someone wanting to break into the industry, from a business point\
    \ of view, there are some easy things that you can do with AI to give you or your\
    \ business a big return on investment and lead to career growth. We call it using\
    \ “cool” AI to solve boring problems. What I mean by boring problems is the back\
    \ office. With most businesses, there’s a lot of invoices, and there’s a lot of\
    \ text documents. People are just going through them, extracting information.\
    \ That’s a very tedious task or a boring task if you like. AI can help a lot in\
    \ those areas. It can remove all the drudgery. There is a lot of it left in the\
    \ service economy as well that AI professionals can help remove. Of course, removing\
    \ that drudgery means you then need to start adding value, rather than just replacing\
    \ mechanical tasks. But, once you accept that challenge, I think there are indefinite\
    \ opportunities to start doing more exciting things in the space.\n\n[Chapter\
    \ 3](#nav.xhtml#toc7)\n\n## [Directing the Flow of Information](#nav.xhtml#toc7)\n\
    \nDr. Jones Lukose Ongalo, Information Management Officer, International Criminal\
    \ Court  \n\nTopics: Data Governance\n\n> “We now live in a world where small\
    \ sets of information can alter the economies of the most powerful organizations\
    \ and states on the planet. It is a world where compact streams of sensitive information\
    \ can digitally leak and cause violent reactions from people living far and beyond\
    \ the source.”  \n\n> Dr. Jones Lukose Ongalo\n\nDr. Jones Lukose Ongalo, MBA,\
    \ Ph.D., is the Information Management Officer for the Court Pénale Internationale\
    \ at the Criminal Court in the Hague. He has spent the last two decades developing\
    \ and implementing strategies to achieve operational effectiveness and regulatory\
    \ compliance for engineering firms in energy and utility sectors and judicial\
    \ organizations within Africa, Europe, and the Americas. Jones received his MBA\
    \ from Hague University and his Ph.D. in Computer Science from Heriot-Watt University.\n\
    \nQ: Dr. Ongalo, your work, and research have taken you to the four corners of\
    \ the world, including Kenya, Rwanda, Botswana, Jamaica, the UK, and now the Netherlands.\
    \ It’s there you presently direct an enterprise-wide information program for the\
    \ International Criminal Court. What is the most ubiquitous challenge you’ve encountered\
    \ across so many diverse cultures, and how has it shaped how you think about solutions\
    \ for international entities?\n\nA: I’ve worked in organizations where data is\
    \ everywhere, but no one is directing its flow. There is a lot of information\
    \ collected and stored that simply does not fit within the organization’s strategy.\
    \ The organization may claim that it is going in a particular direction, but the\
    \ data it holds does not provide the required evidence or proof. That experience\
    \ has led me to reconsider my role in the organization. In such environments,\
    \ it is my first priority to help determine the real purpose and value of data\
    \ to the organization. In other words, lend a hand in crafting the strategy of\
    \ the organization by leveraging information management principles.\n\nThose principles\
    \ recognize that we now live in a world where small sets of information can alter\
    \ the economies of the most powerful organizations and states on the planet. It\
    \ is a world where compact streams of sensitive information can digitally leak\
    \ and cause violent reactions from people living far and beyond the source. Tiny\
    \ words or images transported via exotic technology can lead to wide-spread panic\
    \ across whole populations, even wars. A world where information is fragmented,\
    \ infinitely raising an infinite number of world views and identities. It is a\
    \ world where the same information is interpreted differently in space and time.\
    \ It is a world where information is presented in constant flux, with the only\
    \ constant being surprise.\n\nWhatever your personal or political convictions\
    \ might be, I challenge you to consider new ways of looking at information management.\
    \ It won’t help to retreat to our old maps and models because the more we do that,\
    \ the more frustrated we become. We need new techniques to navigate the chaos,\
    \ filter the wrong, and point us to the significant. The new information manager\
    \ will thrive and even love to embrace the chaos of information by applying new\
    \ lenses and insights. He or she should be ready to be inspired to experiment\
    \ and try out new ideas and solutions.\n\nPerhaps the information manager of today\
    \ believes they need to invest in uncommon skills such as engineering, mathematics,\
    \ and statistics to remain relevant. But core values are still more important\
    \ to performance and outcomes. It is now very possible to visualize the behavior\
    \ of information management teams and predict their performance using tools that\
    \ align and measure core values to information management practices. Close examinations\
    \ of the way employees handle information flowing in the organization directly\
    \ reflect how core values such as respect, transparency, accountability, and integrity\
    \ positively influence productivity. A value-based approach is, therefore, very\
    \ effective in establishing healthy information management practices that can\
    \ endure the test of time.\n\nQ: In your roles as both consultant and practitioner,\
    \ your focus has been on advising public entities, whether they be utilities or\
    \ court systems. How are you deploying the new discipline of information governance\
    \ in these organizations to support business objectives?\n\nA: To start, information\
    \ governance needs to be much more than a formal system of internal tasks and\
    \ reporting relationships or something that occasionally shows up on intranet\
    \ sites and bulletin boards. Information management leaders understand that governance\
    \ schemes must be carefully matched to the organization’s purpose and environment.\
    \ Good governance also creates links between authority, responsibility, accountability,\
    \ and an organization’s actual data.\n\nInformation governance influences behavior\
    \ and helps shape an organization’s culture over time, much like a skeleton gives\
    \ shape to the body and allows stability in motion. This dimension guides the\
    \ practitioner in understanding how to use information as an enabler of change\
    \ judiciously and how it can be aligned appropriately to nurture effective behavior\
    \ and reporting relationships.\n\nI seek these types of principles and use them\
    \ as values to transcend technology, methodologies, and techniques. Without principles,\
    \ sensitive information is mishandled, individuals lose their way, and organizational\
    \ anxiety ensues. This creates confusion, conflicts, paralysis, and cannibalization\
    \ of energy. As part of my leadership strategy, I set clear principles and manage\
    \ these proactively rather than in damage control when a crisis occurs. I am mindful\
    \ of how I handle information within the organization and try to inspire other\
    \ staff to be so as well through that behavior.\n\nQ: How do you determine your\
    \ information program’s priorities?"
