- raw: 'However, edging out rivals and birthing the new strategies of the Information
    Age will also mean opening big windows of opportunity in the most unlikely and
    uncomfortable places. Inevitably, innovation will require us to vigorously pursue
    ethical solutions that disturb the status quo and ask us to rise above the trivial,
    adversarial, and political trenches of corporate warfare, bureaucracy, and misplaced
    micromanagement. The future’s employment requirements will invite us to look around
    and question within, to leverage our confidence to amplify our brand and market
    our skillset. Tomorrow’s leaders will be brave enough to scale the dangerous peaks
    of an increasingly competitive and ethically challenged mountain range. They will
    drive the problematic conversations that illuminate the valleys in between. To
    be part of that conversation means stepping outside your comfortable office, sticking
    your neck out, and adjusting your eyes to the new light.


    The building blocks of this first strategy, while familiar to the new disciplines
    and emerging technologies of the Information Age, have been around in one form
    or another for centuries. These include planning, audits, analytics, optimization,
    and quality assurance. That’s because most of the preeminent wonders in life take
    time and precision to build, as evidenced by their remnants and legacy. And that
    means opportunity. Take King Solomon’s temple. It wasn’t built on the fly. The
    architect Hiram had thousands of apprentices, fellows, and master stonemasons
    he relied on to ensure his project management plan didn’t fail. Each of those
    workers benefited to some degree from the master’s plan. There was a lot of precious
    time spent on the details and responsibilities delegated to others. It’s the same
    with all of the modern marvels today, from those that transport us across oceans
    to those we hold in our very hands. In each of humanity’s significant accomplishments,
    there has always been a wealth of opportunity, achieved through a series of many
    minor goals, seized on by people just like you. Observation and cadence are crucial
    to pinpointing those opportunities and seeing that magical forest through the
    trees.


    ## Broken down jalopies


    The Gaps are Opportunities strategy is rooted in a meditation on the importance
    of listening and observation and proves in short order wherever we look, especially
    in the weakest areas of a business, that there is always room for optimization.
    Those employees who seize upon and fix gaps in areas like production, risk, or
    quality assurance often become the most valuable players on the grid. They grow
    into the leaders that management loves to promote. Gaps and deficiencies in an
    existing program, a product, or a team can be the very best opportunities available
    to make your mark. History is chock-full of stories where a man or woman came
    along and “re-invented” a part of a wheel.


    One of the most amusing success stories exemplifying this point comes from the
    first part of the twentieth century. It involves a weary soldier returning from
    World War I. As the story goes, the GI was tired but also thrilled to be alive
    after countless friends had been killed, and so much of the world he knew destroyed.
    He was discharged in California and put on a Pullman train packed with other vets
    traveling from San Francisco to the East Coast. Like his fellow soldiers, the
    young man enjoyed his share of spirits in the bar car, and by the time they crossed
    over into New Mexico, most of the train’s passengers were quite drunk. Naturally,
    overconsumption can lead to brawling, and that’s what occurred by early noon.
    He held his own for a while, but eventually, he was thrown from the caboose about
    15 miles outside of Albuquerque. In those days, that was the middle of nowhere.


    If that wasn’t bad enough, he only had enough money to buy himself a bus ticket
    to finish the last leg of the trip and maybe half a sandwich. Slightly drunk and
    out of luck, he began walking down the road parallel to the railroad towards town.
    As he sobered up along the path, he started noticing a lot of broken-down sedans,
    pickup trucks, and roadsters abandoned along the highway, likely having run out
    of gas. Remember, this was 1918, before GPS and call boxes, let alone gas stations…
    in the desert! Well, this young man thought a lot about those beat-up clunkers,
    and in between each one, as he made his way to civilization, he began thinking
    about what the vehicles represented. By the time he finally made it to town, he
    had come up with one hell of an idea.


    Despite being parched and stinking to high heaven, he abandoned his plans to purchase
    a bus ticket and used what was left in his pocket to put a payment down on a tow
    truck. The next day he filled up the tank and set back along that road he’d traversed
    the afternoon before. Well, wouldn’t you know it? He picked up every darn one
    of those lonely jalopies and dragged them back to a lot he’d rented from the same
    lessor who extended him credit for the tow truck.


    Less than a decade later that GI was the third-largest scrap metal salesman in
    the Southwest United States. By the time he died, about the richest man in Albuquerque.
    He never quite made it home to Boston, but he did learn first-hand about how your
    journey is often more enjoyable, and profitable than arriving at your destination.


    So, what are your broken-down jalopies? What are the business processes, products,
    or teams you see broken down and in need of repair or improvement around your
    organization or community? How can you, like that GI, turn a real crap situation
    into one that benefits not just you, but ultimately the world around you? Can
    you identify the gaps in between the stops along the way to your goals? Are you
    ready to seize the day? Are you thrilled to be alive like that weary soldier the
    day he was thrown from the train?


    You indeed can find and fill the gaps with a growth mindset that sees the positive
    in the negative, that builds from the ashes, that polishes and reinvents both
    tried and true and also invents the brand new. Are you in a highly regulated industry
    or a business that’s dependent on rules and best practices governing things like
    AI and Big Data? If so consider:


    *   •Finding: high-priority compliance, legal or technical automation processes
    in need


    *   •Identifying: a toolset or strategy that is efficient and defensible, or a
    team that can turn around a ship


    *   •Marketing: cost and risk mitigation benefits to your business partners and
    stakeholders


    For some, that agenda might be too much work. But with that attitude, good luck
    getting called on to right the ship. After all, a bad attitude is like a flat
    tire. And as an old man I know from Albuquerque would tell you, you can’t get
    darn near anywhere with one of those.


    ## Optics: perception becomes reality


    These days everybody wants to be perceived as a “thought leader” and “focused
    on strategy.” That’s a reasonable and legitimate goal. But strategy must be complemented
    by subject matter expertise, and too generalized of a strategy is frequently where
    our most painful productivity issues originate. Sooner or later, somebody has
    to roll up their sleeves, become the specialist, or take responsibility for coordinating
    a team’s collective thoughts into a coherent game plan. It’s no surprise that
    most generalists begin their careers as specialists.


    It’s the substantive work that ultimately refines your capabilities and gives
    you the insight to lead big projects and teams. I’ll leave the specific number
    of hours required for expertise to Malcolm Gladwell. But the truth remains that
    the only way you gain experience is by taking on the dirty work and assuming ownership
    over both success and failure. What matters to management as much as the outcome
    is how you are perceived while responding to those challenges and how you carry
    yourself through the ups and downs. How you handle the blows matters more than
    how you take the bows.'
