    # Chapter 20


    ## Finding Genuine Talent in an Artificial World


    Erick Swain, Practice Director, Personify Executive Search


    **Topics:** Recruitment, Human Resources, Professional Development


    > “Employers need to be able to ask specific questions, drill-down, and recover
    the root causes of problems and fill those gaps. We do not minimize skill sets
    by any stretch, but we have also learned that the ‘intangible’ side of the equation
    gives both sides a better shot at a long-term fit.”


    > Erick Swain


    Erick Swaine is a practice director for Mackenzie Ryan, a global talent recruiting
    firm and specializes in information governance, AI, and analytics. He has placed
    thousands of job candidates across a broad spectrum of industries into mid-level
    to executive leadership positions and frequently speaks on their journeys and
    the mechanics of professional development. He earned his bachelor’s in marketing
    from the University of North Carolina at Chapel Hill.


    Q: Erick, you were an early pioneer in helping employers understand the value
    and talent that information governance, AI, and analytics professionals offered
    when these disciplines were in their infancy. How has the demand for these emerging
    fields transformed recruiting in the job market?


    A: There’s a lot to unpack there as it relates to tech itself, the demand for
    these emerging fields, and how that has transformed over the years. I come from
    the industry myself. Prior to my current role, I sold analytics software with
    builtin compliance and document management capabilities. Our firm recognized value
    in analytics and was looking to build a technology practice. Mackenzie Ryan, which
    split off from Personify last year (both held under Mackenzie Ryan Holdings),
    didn’t have it when I came abroad, so they went to their private equity VC partners
    and asked them, “Where are you investing as it relates to technology?” There was
    a resounding theme around electronically stored information. This was about a
    dozen years ago.


    At that point, not everyone had a content management system. The players were
    `SharePoint`, `OpenText`, and `OnBase` and companies like `Stellent`, which was
    later picked up by `Oracle`, and `FileNet`, which was picked up by `IBM`. But
    they hadn’t penetrated all the markets. Early on, the investment was in Content
    Management and overall repositories. It was soup-to-nuts storage of data, you
    know, manipulating workflows for all components of information management.


    Overall, human capital demand is there because of the efficiency that you can
    create by understanding data. The newfound efficiency is driving advanced analytics
    and AI over the last five to six years, this strategy requires the right talent.
    As companies started to evolve, and you had social media come into play, around
    the same time, there were massive amounts of stored data being created. Although
    storage kept cheaper and cheaper, there was a lot of regulation coming out requiring
    governance of data. They looked at information governance as a cost only and then
    hopped over into advanced analytics... into artificial intelligence.


    Q: Do we have enough of the right types of candidates? For example, insurance
    companies can’t seem to find enough people who understand telematics because the
    technology is so new in and of itself.


    A: That’s certainly the case in some respects. You take `machine learning`, `deep
    learning`, or `natural language processing`. There’s certainly a limited talent
    pool there. AI is a field that’s just a few years old, and so to go in and ask
    someone for three to five years’ experience is very tough. As a result, organizations
    have grown these capabilities internally and certified their own people around
    those programs. Yet, there remains an absolute shortage in many different related
    areas.


    Good data scientists, for example, can be hard to find. Certain developers are
    moving away from traditional skillsets, and into the open-source world, so we
    see a shortage of talent there. Employers need to be able to ask specific questions,
    drill-down, and recover the root causes of problems and fill those gaps. We do
    not minimize skill sets by any stretch, but we have also learned that the ‘intangible’
    side of the equation (i.e., personality, culture, management style, etc.) gives
    both sides a better shot at a long-term fit.


    Q: Due to the speed of technology, how are HR departments dealing with succession
    planning in their IT groups now that it’s the case that what’s needed in a successor
    is not simply soft skills and pedigrees, but working knowledge of systems and
    programming languages that are still burgeoning?

