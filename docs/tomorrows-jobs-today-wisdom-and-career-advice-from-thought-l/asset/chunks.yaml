  trans: "\n\n# 问题：健康信息学利用人工智能和大数据策略来分析健康人群以改善整体结果，但所用数据集的质量具有影响并产生无意之外结果的可能。我们已经在其他行业看到了固有的偏见，但这对于医学界意味着什么？\n\
    \n**回答：** 我们正在尝试的事情之一，例如在理赔（claims）、就诊（encounter）和人口数据方面，是开发风险分层或其他调整。因为我们正试图表达的是：“这个人个人或这个群体的疾病风险更高或病情更严重。”或者，“这里有产生更高成本的可能。我们如何以不同于低风险人群的方式来应对他们？”是的，我们确实分配了质量控制资源并监控这些分析，以确保我们正确地理解了数据。\n\
    \n我们所有的部门经常来找我们说：“你们没有正确地计算风险调整或风险分层。我们认为我们的人口风险比你们所代表的要高。”但对于这种基于经验的回复，我们目前也做不了什么。我们能做的就是收集我们能找到的所有数据。\n\
    \n当然，很多数据并不是完美的。它们可能处于从数据损坏到录入错误的光谱范围内。如果我们谈论的是代表理赔或就诊的各种代码，这些数据的质量将参差不齐。理赔是指你申请服务报销，所以这是一种按服务付费的场景，类似于发票。就诊是在按人头付费（capitated\
    \ payment）的情况下提供的服务，我们已经向该实体支付每月费用来照顾特定数量的人。我们从那里接收关于他们所接受服务的数据，但他们已经领过了。因此，向我们发送良好的就诊数据的动力远小于理赔数据。\n\
    \n## 问题：作为组织中的质量保证专业人员，尽管你主要负责人群健康保健，但你是否也可能发现一些欺诈行为？\n\n**回答：** 是的，在某些情况下是。我们有一个特别调查部门，即`SIU`，我是认证与同行评审委员会（`Credentialing\
    \ and Peer Review Committee`）的主席。我们在那里关注这类问题，并与我们的`SIU`部门紧密合作。例如，当他们识别出为某种特定药物开具大量处方的提供者，而我们发现这些处方上的患者名字从未收到过这些药物（甚至没有与之匹配的诊断），这就会触发警报。我们可以通过算法、通过支付完整性数据或我们的药房数据来识别他们。\n\
    \n 问题 问题：你们是为这种数据挖掘和分析开发自己的系统和工具，还是已经有现成的软件可用？\n\n**回答：** 两者兼有。市面上有一些软件工具可以让你对数据进行首次运行并发现趋势，但我认为我们仍然在学习如何设置这些算法。这是偏见可能起作用的另一个地方。我们可能会错误的人，所以我们必须仔细审查第一手数据。如果不符合逻辑，我们会尝试去确认。如果我们看到一种趋势，我们必须问：“好的，这种趋势有充分的理由吗？”假设我们识别出一个提供者开具了大量某类型（如高风险或昂贵）的处方，但随后我们发现那是一个神经科医生，处理的是难治性癫痫的儿童。好吧，那么这就合情合理。\n\
    \n## 问题：你是否必须优先考虑将谁放在显微镜下，特别是在`SIU`中，因为你无法追踪每一个问题或每一个人？\n\n**回答：** 是的，我们有一万名提供者！在这个委员会中，我们对提供者方面的关注稍微多于公式中的成员端，但数字太庞大了，你必须利用任何可用的资源。我们在人群管理中也是这样做。我们必须弄清楚那个光谱是什么，然后决定将资源放在哪里。\n\
    \n## 问题：响应技术对诉讼的影响，大多数州要求律师证明自己具备技术能力。随着信息学的增长，你是否预计医疗专业人员也将被要求达到类似的教育水平？\n\n\
    **回答：** 我希望如此。我有家庭医学的背景，但我也有临床信息学的背景，而且这两者都有维护认证要求。同样，我们所有人都在使用`EMRs`（电子健康记录），如果你有那些利用这些知识做得好很多的人，即使仅仅是基础的`EMR`智慧，例如了解预勾选医嘱集或病程记录模板或查找不同医嘱的方法，都将是有益的。\n\
    \n## 问题：这种类型的教育对于肿瘤科医生来说是否与足科医生具有同等的相关性？\n\n**回答：** 这取决于情况。每个人都需要一定程度的经验才能进入并从`EMR`中提取信息。有一些特定的技巧可以很好地做到这一点，这不仅仅关乎如何确保信息恰当输入。后续的人员将继续看这些患者并必须理解患者发生了什么。如果你有医疗助理或办公室人员，而他们正试图寻找一个患者，他们获取数据的便利程度如何，以及通过多少方式？\n\
    \n 问题 问题：我们现在看到架构的变化，首席信息安全官不再向首席信息官汇报，而是直接向首席执行官汇报，因为网络安全至关重要。医疗机构现在的情况也是这样吗？首席信息官会参加董事会吗？\n\
    \n**回答：** 一般来说，我认为高管理层（`C-Suite`）仍然保持相似。在我们的案例中，我们有一个首席医学官，然后你会有其他人不断汇报和转型。我们有一位企业集成主管，我是质量与信息主管。我认为汇报结构本身有时会有不同，取决于组织和人员。如果你有一位更擅监督某些医疗运营领域的首席运营官（`COO`），那么让那些行政医疗人员向其汇报是合适的。这取决于情况。我们在这里所做的技术努力无处不在且不断变化，从原则上必须尽可能高效和灵活。只要相关的利益相关者能够确保为了项目和倡议的成功而执行正确的工作，汇报结构几乎没有那么重要。\n\
    \n 问题 问题：那么，到底是什么让你选择了信息学领域？\n\n**回答：** 我进入信息学是因为我喜欢临床、数据和业务的结合。我认为这是家庭医生的一部分。我喜欢能够参与许多事情并对数据有深入了解，这就是信息学方面。我喜欢这种多样性。当我做家庭医学时，我觉得我可以比一次只照顾一个人要做的多得多。我热爱我的患者，我们建立了良好的关系。我学到了很多，他们也学到了很多，但我真正热爱人群健康，因为可以通过大型计划影响数百万人，这些计划不仅影响洛杉矶的一个社区，而且可能影响远得多。\n\
    \n## 问题：作为一名受过训练的医生，你对数据驱动的生活对身心造成的压力有独特的观点。社会刚刚开始理解过度依赖设备的副作用。我们如何应对技术对工作与生活平衡的侵犯？\n\
    \n"
