    A: I have a department of about 90 people, and I try to make sure they understand
    their priority is themselves, their second priority is their family, their third
    priority is work. I try to reiterate that all of the time for my department, and
    when it comes to individual people with their own issues, I try to make sure they’re
    focused on the right things. They’ve got to have their priorities in order and
    believe if they come to me and have to take some days of `PTO` that I’m going
    to understand and put that before the demands of an audit.


    Audit will happen; work will happen; `L.A. Care` will continue to exist. The most
    immediate thing is that these people take care of themselves and their families.
    Maybe that comes from me being a family physician or being a family person, but
    it’s in there. It’s ingrained in me that I need to make sure everybody knows that.


    That said, I have to try to model the behavior. That part is not as easy. I do
    get complaints from colleagues that tell me I’m not always practicing what I preach.
    So, every day I too have to work on that. What time do I have to be at work? What
    time can I leave work? Do I need to be here seven to seven? Do I need to be the
    one taking care of editing and reviewing all of the documentation that comes in
    and out of my department? I want to do a little better with that, but I think
    it’s a familiar challenge.


    Q: We now have this concept of social media as a prism through which people begin
    to see themselves, where every person must have their brand. This is an incredible
    pressure that I don’t think anybody ever expected. How is that affecting people’s
    work life?


    A: Well, millennials are a whole generation that has grown up with these devices
    attached to their hands, and even more so the later generation. One example of
    my own sort of experience with that was when I was on call. I had a beeper at
    the time, and I started to have a physiologic reaction to every time that sound
    would go off. You knew you were going to deliver a baby, or you had to go to the
    `ICU` or the `ED`, or something was going to be an intense situation to deal with.
    And what I progressed to is now I rarely, if ever, have my phone actually on a
    ring. I always have it on vibrate at this point. I don’t pay attention to it sometimes.
    I put it away, and, in the evening time, I might not pay attention to it for the
    whole night.


    You have to do what works for you. Some people are workaholics, and they want
    to work every day of the week. That’s fine, but I do want to try to espouse and
    motivate for a better type of balance.


