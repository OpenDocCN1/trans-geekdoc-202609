    \n## [Ethical Underpinnings of Artificial Intelligence](#nav.xhtml#toc6)\n\nDr.\
    \ Anand Rao, Global AI Lead, PricewaterhouseCoopers  \n\nTopics: Artificial Intelligence,\
    \ Big Data, Ethics\n\n> “Deep learning is not equal to deep understanding. I think\
