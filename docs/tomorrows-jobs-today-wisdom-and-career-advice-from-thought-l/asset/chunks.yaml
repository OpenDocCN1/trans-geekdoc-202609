    There are a number of novel legal issues at play with which government at all
    levels will need to contend. The digital commons, like international waters or
    space, can be leveraged for good or bad. International organizations may need
    to get involved, and the same sovereignty issues will come into play when those
    organizations address other issues. Coalitions of the willing have their limits.
    Governments at all levels can educate and work with their communities to raise
    awareness of the risks and mitigation strategies that should be considered.


    ### Q: What’s the best advice you can suggest for a person considering a role
    in knowledge management and seeing the military as an avenue towards that ultimate
    goal?


    A: Entering the military for knowledge management or any specialty requires research
    first. All branches of the Armed Forces and the civil service are doing knowledge
    management in some capacity. But each of these services has its own culture and
    subcultures with which one should become familiarized before enlisting or pursuing
    an officer’s commissioning program. Read military web sites, review `USA Jobs`,
    follow media in the knowledge and information management fields.


    I believe that knowledge management, information and records management, information
    technology, cybersecurity, and data management are all different parts of the
    same information and data portfolio. More and more, collaboration among professionals
    that have these subspecialties will be paramount. You do none of these in a vacuum.
    In the end, this evolving workforce is serving the mission of the organization.
    What the organization’s leadership needs is the just-in-time data and information
    to make decisions or achieve situational awareness.


    I have often described these overlapping fields of expertise as analogous to instruments
    in an orchestra. Each instrument is needed, but the instrumentalists must not
    only master their individual skill, they must understand their fellow musicians
    and be able to play in such a way as to create harmonious, beautiful music. There
    should be a conductor who knows how to put them all together with the wave of
    a baton—and likely lots of practice. Without this synergy, the only thing produced
    will be a cacophony of tuning noise.


    The military is only one way to get there, but folks must count the cost of military
    service. It’s not for everyone. Note that both military members and federal civilians
    take similar oaths of office “to support and defend the constitution of the United
    States against all enemies, foreign and domestic.” If that oath resonates, military
    service appeals. and one has a keen interest in information, data, and knowledge
    management, I’d say full speed ahead!


    # Chapter 15: Diagnosing the Healing Power of Informatics


    Dr. Katrina Miller Parrish, Chief Quality Information Executive, L.A. Care Health
    Plan


    **Topics:** Informatics, Compliance, Work-Life Balance


    > “The minute the patient walks in the door, you’ve got to let them tell their
    story. You can’t assume by looking at a person or looking at the data that you
    know what’s going on.”

    > Dr. Katrina Miller Parrish


    Dr. Katrina Miller Parrish is a physician, researcher, author, and Chief Quality
    and Information Executive for L.A. Care Health Plan. In her distinguished career,
    she has held leadership roles in prominent health organizations, received noted
    fellowships, and lectured at institutions, including USC’s Keck School of Medicine.
    She received her bachelor’s in biology from Reed College and MD from Eastern Virginia
    Medical School.


    ### Q: Dr Miller Parrish a hotly contested provision in the 21st Century Cures
    Act aims to increase IT interoperability and information sharing amongst healthcare
    groups. Yet those rules have met pushback over privacy and security concerns.
    How do health organizations and executives manage regulatory pressures, and how
    do they impact a workforce’s overall tactical capacity?


    A: A health organization like ours is beholden to regulations. LA Care Health
    Plan is a public health entity, and we receive our authority directly from the
    State of California and the County of Los Angeles. That means while a board approves
    everything we do, it can also be reviewed by the LA City Council or the state.
    Every day is spent making sure we’re adhering to all of the rules. Those could
    even come from the federal government or a line of business serving the Medicaid
    population or perhaps Medi-Cal in California.


    We’re regularly audited by the Department of Healthcare Services (`DHS`), and
    so we have to adhere to regulations, or we wouldn’t exist. During an audit, if
    they raise an issue, we’ll get a finding and sometimes have to develop a corrective
    action plan for it. We can fix it, but we have to commit to a resolution that
    takes time. It affects our capacity, and in contrast to for-profit organizations
    and how fast they can move, we have a few more hoops to jump through.


    It can take years to get initiatives to implementation because of all the necessary
    steps we have to take. I think part of working with a public health authority
    or a government entity is just knowing that’s the case. You understand that you
    have certain requirements. Part of what my world is all about is figuring out
    how to go through all of those processes as quickly and efficiently as possible.
    Asking what can we do in parallel? What has to be contingent upon something previously
    done? Then trying to make it happen as quickly as possible.


    ### Q: Does that imply you’re in favor of legislation like the 21st Century Cures
    Act?


    A: I’m in favor of interoperability as much as reasonably possible because, for
    us, we want to get as much data in our door as we can, especially for population
    health management. The more we get, the more we understand about our population,
    our members, and about our providers and network too. We’re interested in having
    access to as much data as feasible. So basically, anything that comes along that
    safely decreases information blocking for a public health benefit, we can get
    behind.


    ### Q: In the Affordable Care Act (ACA), the actual standards defining the Electronic
    Medical Record (EMR) were debated and delayed. How do you adapt to waiting for
    regulatory specifics? Do you drive forward with your technology initiatives and
    hope they’re agile enough to adjust to the final regulations?


    A: In our network, we work with eight different `EMRs`. The top five systems represent
    a majority of the population, but we have to try to figure out how we potentially
    work with the rest, which is why we lean on the health information exchanges.
    We work with three of those. It’s still not enough, and we’re very early in making
    that work. But what our “Health Information Ecosystem” strategy is partly about
    right now is working with whomever we can, getting as much good data as we can
    for our population health purposes, and processing it efficiently and on time.


    That takes a little initiative until you discover where your barriers are, and
    it hasn’t been so much the regulatory barriers. It’s technical barriers that challenge
    us. When we’re talking about regulatory barriers, they have to do with the type
    of data. For example, when we’re talking about mental health data, substance abuse
    data, there are some carve-outs that the state Medicaid programs will insist on
    treating and protecting differently.


    The exchanges need to speak to each other, and they’re getting there, but the
    `ACA` legislation didn’t adequately address them, and that’s been a challenge.
    If considerations had been put into the `ACA` in a meaningful way, we might be
    much further down the line, but they didn’t make it about true interoperability,
    and they didn’t give enough incentive to the vendors to do anything about it.

