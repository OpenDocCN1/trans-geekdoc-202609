- raw: "Q: In a world where people have a little less shame about conduct, doesn’t\
    \ that somehow impact the general population’s view of the exploitation of our\
    \ data?\n\nA: It seems to me we have entered a phase where there’s less shame,\
    \ but a lot of that’s OK because I think we can all agree that maybe in the past,\
    \ we were a bit too ashamed of our sexuality, of our opinions. Being able to express\
    \ ourselves freely is a good thing. I guess I’m not sure yet on where we are going\
    \ because I’m thinking about, even like 50 years ago, when it would have been\
    \ seen as uncouth to go out in public without your hat and gloves. We have to\
    \ be careful that we don’t think that everything that happens that’s revealing\
    \ is necessarily wrong in some absolute sense.\n\nIt’s different to be sure. But\
    \ what’s a matter of not wearing your hat and gloves, and what’s a matter of demeaning\
    \ yourself? I certainly have been a strong advocate for moralizing about privacy\
    \ and trying to get people to be more reserved and less willing to disclose when\
    \ it comes to demeaning oneself. And I constantly use the example of Anthony Weiner\
    \ as someone who, in public life, went too far, and not only disclosed but demeaned\
    \ himself in the process. We do want to take precautions against that. But if\
    \ it’s just a matter of, “we used to wear white gloves to Sunday school, and now\
    \ we don’t…” If that’s what we’re talking about, then it’s not that important.\n\
    \nQ: You served as an elder for the Presbyterian Church in your local community.\
    \ Does faith or any other religious value play a role or influence how you educate\
    \ students or dissect ethical issues like privacy in your professional capacity?\n\
    \nA: I think the religious traditions in which you were brought up or that you\
    \ embrace, even if it’s not explicit, implicitly affects what you recommend and\
    \ what you’re comfortable with. To be sure, I have tried to mine my religious\
    \ traditions to find insight and guidance around privacy issues. I even collect\
    \ passages from the Bible that show how ancient concerns about bodily disclosure\
    \ and information disclosure prove how ancient they are. You can find some wonderful\
    \ things in the Old and the New Testament in which people are struggling with\
    \ disclosure issues.\n\nAt the same time, if my religious tradition taught me\
    \ that men were superior to women and that women should be seen and not heard,\
    \ I would hate to see those kinds of norms reproduced in public law. We can’t\
    \ let our religious traditions directly dictate the kinds of laws that we think\
    \ should govern a diverse and open society. But certainly, as an individual, how\
    \ we think about problems and values are affected by our religious backgrounds,\
    \ and mine as well.\n\nQ: You studied dance in college and then practiced law\
    \ after graduating from Harvard, but ultimately decided to dedicate your career\
    \ to higher education, writing, and consulting. What inspired you to pursue an\
    \ academic career, and what would you say are the lasting rewards?\n\nA: I think\
    \ a love of reading and ideas guided my career. Reading, writing, and ideas, and\
    \ independence governed my choices. As an academic, I get to be far freer than\
    \ many employees are. I get to write what I want to write, to think about what\
    \ I want to think, and to teach and to engage people in ideas, in university,\
    \ and outside the university. Those things governed my choices.\n\nI loved being\
    \ a practicing lawyer, but you have to think about and deal with whatever problems\
    \ the clients bring to you. You don’t always have that freedom of choice of topic\
    \ to focus on. Then when it comes to things like dance or the arts, well, I love\
    \ the arts, but I think I’ve always felt a little frustrated about the inability\
    \ to make writing and debate sort of central to those activities. I think I am\
    \ more of a person of the mind than a person of the body ultimately.\n\n[Chapter\
    \ 9](#nav.xhtml#toc14)\n\n## [Discovering Data that Matters](#nav.xhtml#toc14)\n\
    \nGeorge Socha, Esq., Managing Director, Binder Dijker Otte  \n\nTopics: eDiscovery,\
    \ Business Process Management\n\n> “People are constantly trying to figure out\
    \ the most effective ways to get their jobs done. If they have technical barriers\
    \ in front of them, sometimes they succumb to the enticement to circumvent those\
    \ with unauthorized approaches.”  \n\n> George Socha\n\nGeorge Socha, Esq. is\
    \ a renowned industry thought leader and the Managing Director of Binder Dijker\
    \ Otte’s Technology and Business Transformation Services practice. He has authored\
    \ numerous articles on eDiscovery and speaks to global audiences on its rapid\
    \ evolution and distinct challenges. George is also the co-founder of the widely\
    \ utilized Electronic Discovery Reference Model (EDRM), a framework outlining\
    \ standards for the recovery and discovery of digital data. He earned his bachelor’s\
    \ in political science from the University of Wisconsin-Madison and his JD from\
    \ Cornell.\n\nQ: George, along with Tom Gelbmann, you made a groundbreaking contribution\
    \ to the discipline of eDiscovery with the Electronic Discovery Reference Model\
    \ (EDRM) in 2005. That conceptual tool to understand the eDiscovery process became\
    \ the foundation for an organization based at the Judicial Institute at Duke Law.\
    \ What inspired you to develop this comprehensive approach to data collection\
    \ in the litigation process?\n\nA: The key motivator for us, as we were gathering\
    \ information for a survey and interviewing subjects, was that we began hearing\
    \ a common theme. We heard it, especially from providers of electronic discovery\
    \ services and software, who said to us something akin to…“You guys don’t really\
    \ understand what e-discovery is. It’s what WE do. All of those people out there\
    \ claiming to do electronic discovery, that’s not eDiscovery at all.” We heard\
    \ that same line from people whose focus was preserving data. We heard it from\
    \ people who spent the bulk of their time and effort processing data. We heard\
    \ it from people who hosted the data. We heard it from the folks who were reviewing\
    \ it and so on. We thought - well, there is no possible way all of them are right\
    \ because they’re coming up with completely conflicting definitions! So, we asked\
    \ ourselves, “Is there anything out there that already describe this?”\n\nWe looked\
    \ around and didn’t find any widely accepted definition of eDiscovery that laid\
    \ out the major conceptual steps involved. We said to ourselves, since we can’t\
    \ find anything out there, let’s see if we can put something together. I went\
    \ through my address book. We reached out and got a group of I think maybe 35\
    \ organizations and people who showed up at the first EDRM meeting in May of 2005.\
    \ We thought we were taking on a one-year project at the most. We were going to\
    \ come up with a straightforward, pragmatic definition or set of definitions and\
    \ some basic steps for people to think about as they limped through electronic\
    \ discovery. At that time, we had no idea that over a decade later, anybody would\
    \ be paying any attention to the work we were doing.\n\nQ: And now that model\
    \ is an entire institution and brand at Duke. How did it find a home there?\n\n\
    A: Tom was retiring, and from my perspective, I felt I had perhaps overextended\
    \ my stay as a primary driver of EDRM. I also was looking at making a transition\
    \ from a solo practice to joining another organization. So, with that backdrop,\
    \ Tom and I decided it was time to look for a new home for EDRM. It took us a\
    \ while, but ultimately someone we both knew fairly well put us in touch with\
    \ the folks at Duke. Once we connected with them, things moved fairly quickly.\
    \ In the summer of 2016, Tom and I handed over the project to their law school.\n\
    \nQ: What do you see as the EDRM’s most intrinsic benefit to the legal community?"
