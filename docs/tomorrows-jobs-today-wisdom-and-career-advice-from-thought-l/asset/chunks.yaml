- raw: "A: Corporate responsibility starts with the people who own it. In the case\
    \ of the Jewish National Fund, which has existed since 1903, the task of communicating\
    \ its mission to Los Angeles was easy. And year after year for 12 years, we at\
    \ JNF-Los Angeles provided an annual educational program. I called it the Annual\
    \ Executive Briefing to bring in Israeli leaders to speak about current events,\
    \ policy plans, and the like, in a breakfast gathering. The format was very successful\
    \ in Los Angeles, and that format was scaled nationally. JNF has scores of cities\
    \ with annual breakfast events now. As it grew in Los Angeles, we asked for corporate\
    \ sponsorships to underwrite the cost of the event enabling every attendee a free\
    \ ticket to attend. I felt it was vitally important not to charge attendees for\
    \ breakfast. I still feel that way. If an attendee wants to make a gift, that\
    \ is welcome, but we at JNF wanted to grow the knowledge of the importance of\
    \ Israel within the Los Angeles community, free of charge.\n\nOur speakers over\
    \ the years have included Ambassadors, elected officials, authors, political commentators,\
    \ and members of the Israel Knesset. In the dozen-plus years, the event has been\
    \ going in Los Angeles, attendance has totaled well over a thousand people per\
    \ year, and it raises almost a million annually.\n\nQ: You graduated with a Broadcast\
    \ Journalism degree but ended up running a successful data management company!\
    \ If you could go back in time and change your focus to a different major, do\
    \ you think it would still lead you to your ultimate destination? What kind of\
    \ advice might you give somebody at a similar fork in the road?\n\nA: Well, that’s\
    \ a LOL! Personal evolution is all about a growth mindset. In the 1970s, I was\
    \ not thinking about records and information management. The Broadcast Journalism\
    \ direction was, I recall, a result of my taste for policy, economics, and communications.\
    \ I thought I could be the next Dan Rather or Roger Mudd. If those names resonate,\
    \ you are my age. Journalism was news writing with a focus on facts and consequences.\
    \ Nowadays, not as much. My advice is the same as Yogi Berra’s, who said, ‘When\
    \ you get to the fork in the road, take it!” By that, I think he meant to do what\
    \ your passion and intelligence say to you is correct. Fuel your passion and do\
    \ it to the best of your ability, whatever it is. Be happy and content with your\
    \ lot. It is not greener on the other side; it is just on the other side.\n\n\
    [Chapter 18](#nav.xhtml#toc24)\n\n## [The Future of Compliance](#nav.xhtml#toc24)\n\
    \nMiguel Mairlot, Partner, Ethikos Lawyers  \n\nTopics: Compliance, Data Protection\n\
    \n> “To build a strong compliance program, it is of utmost importance to work\
    \ towards good communication with regulators.”  \n\n> Miguel Mairlot\n\nMiguel\
    \ Mairlot is an attorney and Data Protection Officer (DPO) with a breadth of compliance\
    \ experience advising wealth management and insurance businesses. He has written\
    \ and spoken extensively about compliance topics and teaches financial law in\
    \ Brussels, Belgium. Miguel completed his undergraduate work at Université Catholique\
    \ de Louvain and received his advanced master’s in business law from Ghent University.\n\
    \nQ: Miguel, how did you find yourself gravitating towards the universe of finance\
    \ and compliance?\n\nA: Finance has always fascinated me because it is so dependent\
    \ on the idea, the value of trust. Without investor confidence and trust in financial\
    \ institutions, there is no room for innovation and growth. It is the trust we\
    \ afford each other that allows our businesses to grow and our economies to flourish.\
    \ One of the objectives of compliance is to maintain public confidence in the\
    \ financial system. The compliance mechanism requires financial institutions to\
    \ put in place, under penalty of sanctions, a whole series of preventive mechanisms\
    \ that contribute to the achievement of this crucial objective. Rather than focusing\
    \ on quick wins, compliance favors a long-term vision that focuses on sustaining\
    \ our economies.\n\nI spent the first ten years of my career working in litigation,\
    \ specializing in banking and finance laws. My expertise and knowledge of the\
    \ Markets in Financial Instruments Directive (MiFID) led me to work on its implementation\
    \ for various financial institutions. At that time, legal and compliance tasks\
    \ were usually performed by the same department. Although I’m still interested\
    \ and continue working on several aspects of that regulation, I devote most of\
    \ my time on issues related to money laundering and the detection of serious tax\
    \ fraud in the event of repatriation of assets.\n\nQ: How do you think companies\
    \ should approach the challenges of implementing the European Union’s General\
    \ Data Protection Requirement?\n\nA: Any company subject to GDPR should take care\
    \ when implementing the requirements set out by this new regulation. Before its\
    \ entry into force, data protection was not a top priority for European companies.\
    \ Now the paradigm is about to change, due mainly to the hefty fines which can\
    \ be imposed and the potential reputation damages which may result from a violation\
    \ of the provisions. Among all these tasks, raising awareness among employees\
    \ about the risks related to the infringement of the rules set out by GDPR might\
    \ constitute the biggest challenge since this new piece of legislation is also\
    \ considered a cultural change in Europe. The implementation of GDPR will require\
    \ the revision of internal procedures, the appointment of a Data Protection Officer\
    \ in some cases, and a mapping and assessment of all the data processes, as well\
    \ as contractual changes.\n\nQ: New York State introduced the Stop Hacks and Improve\
    \ Data Electronic Security Act (SHIELD) bill, which among other things, updates\
    \ breach notification requirements. There have also been global and stateside\
    \ efforts to pass bills similar to the EU’s “Right to be Forgotten” requirements.\
    \ Given some of the geopolitical shifts around the world, do you see support for\
    \ these regulations increasing or waning?\n\nA: The expansion of the legislative\
    \ rules which took place in Europe since the last financial crisis has no precedent.\
    \ Complying with all the national and European laws and regulations has become\
    \ increasingly complex and costly for companies. Data protection does not necessarily\
    \ constitute an exception to those rules. GDPR provisions were heatedly debated\
    \ before the European Commission during the drafting process, and this text constitutes\
    \ the last bastion that protects European data users against their potential abusers.\n\
    \nThe court decisions made during the last few years by the European Court of\
    \ Justice, namely Maximillian Schrems v Data Protection Commissioner; and Google\
    \ v Spain seem to be in line with this trend. For these reasons, I believe that\
    \ any change in the data protection regulations that dramatically reduces the\
    \ rights of the data users would call into question the democratic legitimacy\
    \ of some of our institutions.\n\nQ: The Financial Services and Markets Authority\
    \ (FSMA) is one of the two authorities, along with the National Bank of Belgium\
    \ (NBB), entrusted with the supervision of the Belgian financial sector. In the\
    \ United States, it is FINRA, the Financial Industry Regulatory Authority, and\
    \ the Securities Exchange Commission, or SEC, that is responsible for ensuring\
    \ compliance in our financial institutions and markets. What do you see as the\
    \ challenges in working with these groups?\n\nA: To build a strong compliance\
    \ program, it is of utmost importance to work towards good communication with\
    \ regulators. Since last year, any individual employed in the financial sector\
    \ who observes an infringement against the financial legislation rules which the\
    \ FSMA is responsible for enforcing can report it directly to the FSMA. The whistleblower’s\
    \ identity is kept secret, and the law protects any individual who, in good faith,\
    \ reported the infringement."
