    他读遍了我们所有的历史虚构书籍，从二年级、三年级到四年级。然后他开始读我们的历史非虚构书籍，并读完了所有这些书。高中时他回到导师回来，最终获得了奖学金，并在斯坦福大学获得了历史学位。见证了这种对他生活的影响，促使我转向政治学并行动。此外，在经济衰退期间，当我不得不裁掉一半员工并缩短图书馆开放时间时，我意识到图书馆的资金完全是政治性的。全国
    98% 的图书馆资金是政治性的，只有 2% 是慈善赠款和小额捐赠。


    这就是导致我投身政治的原因。我想说，除非你对此充满热忱，否则不要尝试。如果你不在乎且没有打算长期投入，这项工作会让你精疲力竭。


    # 第 17 章


    ## 加强保护与强化连接


    Douglas C. Williams，Williams Data 首席执行官


    **主题：** 业务连续性、公民责任


    > “未来属于跑得快的人。所以，猜怎么着，拥有固定思维的人将被拥有成长型思维的人超越。”


    > Doug Williams


    Douglas C. Williams 是 Williams Data Management 的首席执行官，也是 Vernon 商会的董事主席。他拥有 30
    多年的经验，帮助财富 500 强客户处理文档存储、销毁和数据安全需求。他在旧金山州立大学获得了广播传播学士学位。


    **Q：** Doug，你的家族从事数据管理业务已近近一个世纪，你见证了许多参与者的兴衰。像 Williams 这样的小企业如何在数字化转型的颠覆世界中保持韧性？高管在长期信息管理策略方面应该考虑什么？


    **A：** 商业记录管理是一种 3 万英尺视角下的全局方法，包含了数字部分以及遗留的纸质部分。我们在 20 世纪 80 年代初从工业货运仓储和分销转型商业记录中心业务，见证了类似的颠覆。这些波动主要与从工业制造业经济向服务经济的转变有关。我们的客户群包括企业级公司以及中小企业。


    负责信息资产的高管需要意识到这些信息资产的整体范围，无论是结构化的还是非结构化的，并将信息治理和监管准则同样应用于每一项资产。考虑到数字技术将以光速变化，首席执行官及其执行团队需要具备相关知识，并为法证发现的变化做好准备，看到每种类型信息资产留存里程碑的影响。我们都知道，短信、电子邮件和所有社交媒体帖子在某处都有永久留存。无论企业大小，每个企业都接受关于这些内容的或有性负债。他们需要意识到，无论存储介质如何，都要采取严格的信息管理政策的行动。


    **Q：** 你曾接受过 Smart Business Los Angeles 的 Adam Burroughs 采访，并强调了对数据泄露日益增长的担忧。几年后的现在，数据保护已成为每日新闻头条。你仍然认为大多数组织将安全和隐私视为理所当然吗？还是你现在开始看到主动管理数据的趋势？


    **A：** 我是这样。他们认为这是理所当然的，认为事情不会发生在自己身上，即使发生了，他们也有保险。但猜怎么着，那是幻觉。再次，一个主动计划需要全局的信息管理方法。IT
    部门知道如何保护数据，但通常不知道“为什么”，例如每种数据的治理规则是什么。这是 `CIO` 或信息治理总监的职责，如果是企业级公司，则是法律总顾问的职责。


    头条新闻中的泄露是可以预防的；然而，由于社交媒体、电子邮件、短信、数据共享以及缺乏加密等人为错误，个人信息数据集的入口是非常脆弱的。在我们 Williams
    Data Management，由于我们也是社交媒体用户，我们安装了前端数据入侵软件，该软件由 Oasis Technologies 开创并获得专利，名为
    `TITAN`，它每周可以阻止超过五十万进入我们网络的入侵尝试。


    防火墙有帮助，但 `TITAN` 的魔力在过去的 30 多里一直在“击退”这些尝试。主动的，是的。持续的，是的。高管意识到他们持有个人身份信息 (`PII`)
    是建立一个 `IG` 计划以保护组织免受数据泄露的第一步。下一步是评估业务漏洞并创建一个能够实现安全文化的系统。我们的公司与 CSR Professional
    Services, Inc. 合作，该公司为我们的客户提供一系列数据泄露工具，能够在全美 50 州以及欧盟提供业务连续性准备和泄露通知服务。


    **Q：** 你通过执掌 Vernon 商会启动了一些重大的社区和公共服务项目。你在私营部门的经验如何为你的开发和影响公私合作伙伴关系做准备？你认为这类合作最具定义性的方面是什么？


    **A：** 是的，我在 Vernon 商会的个人目标是让企业和政府共同努力，创造成长型思维。未来属于跑得快的人。所以，猜怎么着，拥有固定思维的人将被拥有成长型思维的人超越。例如，21
    世纪已经过去了近 20 年，它是信息经济的。它是利用数据、软件和机器人进行制造和分销。这不再是劳动力与资本的竞争，而是劳动力与技术的竞争。


    在我看来（而且这种情况正在发生），使用纳税人资金的政府实体要么资助加州经济可行的成长型思维制造项目，要么降低成长型企业的税收，让他们有资金自己开展这些项目。无论哪种方式，受益群体都会获胜。私营部门的领导者知道项目必须盈利。当选领导者也必须认识这一点。公私合作项目必须是盈利且自给自足的，让公众信任他们将获得资本支出的回报。无休止资助浪费性“通往无处之桥”项目的时代已经结束了。Vernon
    商会已经接受了成长型思维，这就是我决定领导它的原因。


    **Q：** 多年来，你一直主持年度早餐会，以支持以色列和整个中东的善意工作。你从一个小聚会开始这项活动，它已成为犹太民族基金会最大的活动之一。为什么企业社会责任对你如此至关重要？这种意识如何改变你经营业务的方式？


    '
