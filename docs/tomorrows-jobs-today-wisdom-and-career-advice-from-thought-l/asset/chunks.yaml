    ### Q: What about artificial intelligence? Is that technology being adequately
    leveraged in civic pursuits?


    A: I’d say we’re still in the beginning stages, in the infancy of all. I have
    a few strategic initiatives that I’m driving for the City of Burbank. And I’m
    trying to stay ahead of where most the cities are and trying to catch up where
    we might be behind. When I catch up, I want to go beyond. Of course, I’m happily
    sharing everything that I learn, everything I’m doing with all our sister cities.
    I’ve taken several steps, written several policies and proposals. I did a smart
    city presentation for the city that got us to start thinking about where we stand
    on that journey and how we can continue to become a smarter city.


    I’m trying to push the envelope. And one of those areas includes data analytics.
    We’re building a data and analytics practice here in the City of Burbank where
    it didn’t exist before so that we can find ways to better utilize the data we
    have. Because you’re right, that cities have a ton of data, but we haven’t always
    put a lot of thought into how we can better use it to improve the services that
    we provide. That could be anything from improving the traffic flow to increasing
    the revenue from parking. Or even predictive criminal enforcement, if you will.
    For example, if there are ways you can determine where a crime may occur, then
    you can better deploy your resources.


    Q: Do you think that runs up against some privacy issues?


    A: We’ll see. I think there’s going to be a journey. There’s going to be a pendulum
    swing. I’d say the pendulum is swinging towards less privacy, at least in public
    spaces, but there’s going to be some problems with that, and it will begin to
    swing back.


    Q: Do you think it perhaps could lead to less privacy in public spaces yet more
    in private ones?

