- raw: 'This new paradigm we find ourselves in necessarily requires us to selectively
    amplify when our voices need to be heard and be mindfully methodical about identifying
    and seizing opportunities amidst the inbound cacophony. To truly capitalize on
    the first lesson given in this book, Gaps are Opportunities, we must regularly
    exercise our will to avoid impulsive and lesser offers while navigating toward
    greater lasting rewards. And we must remain disciplined in this cadence at work
    and in the home. Clarity, brevity, and directness will increasingly be the in-demand
    soft skills that advance our agenda and our careers.


    ## Finding the bottom line


    Less is More isn’t just about privacy, though, or how we conduct ourselves, it’s
    a better way of doing business now that a majority of brands are dependent on
    the currency of information. From a corporate governance and project management
    perspective, reactive management techniques, resource expansion, or throwing money
    at a problem isn’t a safe or cost-effective bet anymore. Have they ever been?
    Indeed, anybody who has worked in a regulated industry has witnessed how easily
    large organizations repeatedly squander budgets to check a box symbolically. Most
    sourcing professionals, when they’re honest, can tell you horror stories about
    statements of work that ended up resulting in nothing more than an imaginary bill
    of goods and even vulnerabilities. That’s because (especially in the era of big
    data) without clear and concise goals, roadmaps, and communication strategies,
    the more bureaucratic a solution gets, the less likely the results will be favorable.
    That common disorder also affects an entity, whether it is public or private,
    regardless of the complexity of the underlying problem.


    How exactly does a Less is More strategy make the best teams in the business world
    run so smoothly? The idea itself almost seems counterintuitive in today’s business
    climate, but that’s because we’ve grown so accustomed to information overload
    that we instinctively over-respond, reactively, to the slightest outside pressure
    and regulation. Companies that exercise restraint can still respond effectively
    to immediate concerns and market shifts, but they do so by simplifying corporate
    policies, prioritizing business goals, and communicating with the same maturity.
    That doesn’t mean there isn’t a place for precision and quality assurance, but
    far too often we see micromanagement murdering the mothers of invention.


    While working as executives at Fortune 500 companies, we observed closely the
    tangible benefits of careful, restrained strategic planning, a light senior managerial
    footprint, and the results of executing capstone projects using moderated cadence.
    We’ve also witnessed the effects of doing exactly the opposite and the stresses
    it places on even the most patient, resilient knowledge workers, and team leaders.
    Over time, as a result of some tough lessons also experienced by some colleagues
    in this book, we began to witness and value the results of a Less is More strategy.
    Finding the right balance of restraint and proactivity is an essential skill for
    all agents of change in the Information Age. This is especially true in the era
    of data protection and inevitable data breaches.


    If we take this concept a step further and think about it in the context of the
    Net Promotor Score, or NPS, in gauging customer experience, we glean a prime example
    of the need for simplification and balance. Most organizations end up doing the
    same thing with this generally useful tool. They survey the hell out of everything,
    build enormous data lakes, and end up not even being able to see the forest through
    the trees. The obsessiveness drives customers and employees crazy besides the
    fact that it creates an analytics nightmare if not correctly implemented. Ultimately,
    most companies settle on that one question, how likely are you to recommend, buy,
    stay, etc.? That’s what we’re all trying to do in finding an opportunity amidst
    the gaps in our various programs and products. We’re trying to drill down to the
    bottom line, the main objective, the motivating factor, the differentiator. Drilling
    a thousand holes in the wall usually just gets you an expensive new drywall project.
    Some answers and suspicions about the customer experience can still best be understood
    and confirmed by just listening to your actual customers, either face to face
    or directly over the phone or by email.


    To help find and maintain the right balance and avoid this deluge of garbage data,
    our best teams and leaders insist that guiding principles, policies, and directives
    governing data are clear and concise. That may seem obvious, but it isn’t always
    evident in practice, especially in an era of oversharing or within a work culture
    that worships the Almighty CYA (cover your ass). Straightforwardness is not an
    easy sell today to a population with a 144-character attention span and one that’s
    less inclined to comply with communication in traditional ways. To complicate
    matters, we commonly see legal departments and advisors addressing the governance
    aspects of policy, who know a lot about the law, yet very little about how to
    write an operational rule. This is a familiar theme and common challenge we all
    face both in our personal and professional lives.


    To be strategically selective with our words, our actions and our expectations
    runs contrary to the human nature of a large segment of the workforce and consumers.
    It’s also what makes you stand out.


    ## Back on the road


    In the first section, Gaps are Opportunities, we introduced you to an entrepreneur
    who made a killing seizing on opportunity along the interstate following World
    War I. The roads we travel today are filled with businesses like his, symbolizing
    much more than just the trade they serve. Perhaps the most famous business that
    exemplifies the value of the Less is More strategy is In-N-Out Burger, a restaurant
    chain with over 300 locations founded in 1948. The secret of their success is
    attributed to the simplicity of their menu, which has not changed much in the
    seven decades since its inception. What observers fail to realize is that while
    Less is More has made that storied food hub tremendously successful and scalable,
    it’s anything but extraordinary or original. In fact, it’s a fundamental strategy
    that powers small businesses everywhere.


    Thousands of miles from the nearest In-N-Out, but just a short drive from Mechanicsburg,
    Ohio, there’s a family diner just as loved by the locals there as In-N-Out is
    to Los Angelenos. Crabill’s Hamburgers Shoppe serves up two items: sliders and
    home-made potato chips, cash only. People drive from miles around to sit at the
    six-seat counter restaurant, waiting in lines outside without complaint for the
    legendary lunch. Yet despite numerous opportunities to franchise the business,
    the family-run company has been resisting expansion since 1927. They’re comfortable
    with their profitable lot, and there’s nothing wrong with that.


    The secret of Crabill’s success is no different from that of In-N-Out. Less is
    More is a proven strategy that enables businesses to effectively execute on their
    mission and focus on keeping operations running smoothly.


    ## Creating digital boundaries


    The Less is More strategy and mindset are also useful for separating work demands
    from the burdens and blessings of life’s responsibilities. After all, our first
    priorities in life remain our physical health and mental well-being. Those prerequisites
    for happiness can hardly be satisfied with the success of our careers. We once
    referred to this careful dance as “work-life balance,” but recently, emboldened
    by the ubiquitous nature of personal devices, a new euphemism has arisen. It’s
    designed to normalize our workaholic tendencies and is labeled “work-life integration.”'
