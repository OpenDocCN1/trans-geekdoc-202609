- raw: "Q: There’s usually a disconnect between information managers and the legislators\
    \ setting records retention periods. Over the years, strategies like “big buckets”\
    \ have attempted to mitigate this obstacle, but they’re imperfect and carry their\
    \ own risks. What can be done to bridge the divide better?\n\nA: There are two\
    \ pieces to the puzzle of records management: classification and retention. A\
    \ records retention schedule needs to be straightforward enough to implement so\
    \ that users can apply record codes to records. But the retention periods for\
    \ the record classes need to be specific enough so that some types of records\
    \ are not over or under-retained because they are mistakenly grouped with others.\n\
    \nIt is a balancing act, and big buckets can only be taken so far. If a record\
    \ class contains record types that users or legal requirements suggest should\
    \ have a different retention period, then a new record class should be created.\
    \ The other area in which the business can affect retention is a prudent implementation\
    \ of the retention schedule into the records management system. For example, a\
    \ record class may be defined as event-based in the retention schedule, but if\
    \ it is known that all records for that record class are sent to storage only\
    \ after the trigger event has occurred, then the storage date can be used as the\
    \ base date to calculate retention. Classifying records is only part of the puzzle.\
    \ This becomes all too familiar for clients with a lot of active records in offsite\
    \ storage. These records need to be reviewed periodically to identify records\
    \ whose event triggers have transpired.\n\nQ: Why not keep everything forever?\n\
    \nA: The keep-everything culture has evolved as a byproduct of cumbersome retention\
    \ periods and reduced storage costs. Rather than make the tough decisions about\
    \ particular data sets, records are often tagged with an overly conservative retention\
    \ period. This leads to an ever-increasing repository of data that becomes difficult\
    \ to access and analyze, as well as increased exposure to potential litigation.\
    \ It’s important to identify and remove ROT (redundant, obsolete, and trivial\
    \ information) and retire or archive applications promptly. Collection, classification,\
    \ and retention processes should be assessed and optimized. Collect only the minimum\
    \ data required for a task. Build a manageable records classification scheme so\
    \ that it is straightforward for users to apply a record code. Prudently implement\
    \ the retention schedule and review retention periods periodically. These are\
    \ becoming requirements in the modern era.\n\nQ: How are multinationals like Iron\
    \ Mountain leveraging artificial intelligence techniques and machine learning\
    \ to help clients measure and monetize their information assets?\n\nA: Companies\
    \ know the vast repositories of data they generate and store are valuable, but\
    \ extracting that value is difficult. Iron Mountain has entered into a partnership\
    \ with Google Cloud to analyze unstructured data. The Iron Mountain InSight solution\
    \ combines Iron Mountain’s experience in data analytics and information governance\
    \ with Google’s artificial intelligence and machine learning capabilities. Iron\
    \ Mountain is also working with MicroFocus and Active Navigation to offer content\
    \ analytics. With classification using machine learning and retention applied\
    \ using Iron Mountain’s privacy and policy expertise, these partnerships hope\
    \ to shine some light on dark data.\n\nQ: You’re a big supporter of your local\
    \ math pentathlon and youth academics. What guidance do you have for a young person\
    \ just getting started in preparing for a career in big data, consulting and analytics,\
    \ or even an individual re-entering the workforce seeking opportunities in this\
    \ developing field of technology and business?\n\nA: Math and logic games are\
    \ a fun way for children to start learning critical thinking in a competitive\
    \ but supportive environment. With the preponderance of screens in children’s\
    \ lives, a productive way to channel this interest is through beginner programming\
    \ classes. For example, the Scratch programming language created by MIT is a visual\
    \ way to learn by programming with code blocks. If a child is attached to her\
    \ iPad, an app called Swift Playgrounds can help her learn Apple’s Swift programming\
    \ language. Programming requires logic, patience, and focus. At its heart, programming\
    \ is problem-solving, and running code to perform a function is very satisfying.\
    \ Programming is becoming a second language and a pivotal tool for young people\
    \ entering the workforce. An understanding of database design and development\
    \ is also helpful to understand how information is organized and accessed.\n\n\
    [Chapter 13](#nav.xhtml#toc18)\n\n## [Navigating the Global Digital Economy](#nav.xhtml#toc18)\n\
    \nApril Dmytrenko, Business Advisor, Information Governance & Compliance Strategies\
    \  \n\nTopics: Records Management, Compliance, Privacy\n\n> “Simple always wins\
    \ over complex, and this is certainly key in consideration of the end-user and\
    \ expediting goals.”  \n\n> April Dmytrenko\n\nApril Dmytrenko, CRM, FAI, is a\
    \ pioneer in the fields of records management, compliance, and privacy. She works\
    \ closely with diverse enterprises on developing legally compliant programs and\
    \ building strategic partnerships between their internal and external teams. She\
    \ serves on industry action committees and is an active speaker, trainer, and\
    \ author. She earned her bachelor’s in business administration and technology\
    \ from California State University, Fullerton.\n\nQ: April, years ago, you accurately\
    \ predicted that privacy would be the next big frontier for individuals managing\
    \ data processes and where so many of the jobs would be. We now have several legislatures\
    \ drafting regulations, and Chief Privacy Officer positions can’t be filled quickly\
    \ enough. Is there still time to enter this emerging field and make an impact?\n\
    \nA: Right now, we are experiencing a fantastic transformation of the business\
    \ environment but particularly the evolution of technology and the global digital\
    \ economy. It is indeed an exciting time, but we are acutely (headline news) aware\
    \ of the impacts of compromised data security and privacy, including the financial\
    \ impact on brand and reputation, litigation, and the overall burden and distraction\
    \ on the business. The exponential growth rate of incidents of data theft, damage,\
    \ loss or inadvertent disclosure continues to expand not only in frequency but\
    \ the scope, and complexity. While privacy concerns gained attention over 100\
    \ years ago and became topical again about 15 years ago, it is still truly in\
    \ an infancy state. Privacy offers IG professionals a rich opportunity to expand\
    \ their leadership or advisory role in maturing a unified approach to protection,\
    \ compliance with laws and regulations, and incident response and recovery.\n\n\
    Q: In your role as a fellow of ARMA International, a premier organization for\
    \ records management professionals, you’ve helped to connect organizations with\
    \ practitioners who can demonstrate the benefits of information governance (IG).What\
    \ steps do you think organizations like ARMA will play as managing data becomes\
    \ such a ubiquitous responsibility?\n\nA: A number of the core professional organizations\
    \ have been dealing with an identity crisis for some time, and still struggle\
    \ to have a clear and concise “elevator speech” on mission and value. Information\
    \ governance, while it has a wide breadth, still has the industry confused, and\
    \ remains a term that does not universally resonate with senior managers. The\
    \ industry’s professional associations, while they have tremendous value and passionate\
    \ support, are challenged to maintain their position in a fast-evolving and complex\
    \ field."
