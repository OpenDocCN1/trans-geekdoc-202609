  trans: '


    答：在 80 年代中期，我曾为考古学家和史前历史学家从事模式识别、图像处理、数据库系统以及专家系统工作。今天，带着电脑、无人机和传感器系统进行发掘已经是标准配置。软件、硬件和自学习算法的能力远比当年复杂。但让我们考虑一下所谓的旧式信息组织方法。你提到了“遗留”（legacy）和“索引”这些术语。元数据并不是遗留，它是质量、控制和治理的问题。


    受控的元数据、词表和分类法对大数据分析、人工智能和机器学习具有特殊价值。受控数据集充当指南针，通过高质量信息来训练新技术。这对于在捕获信息时的自动索引、优化企业搜索以获得合格结果，以及管理具有合规要求的存储库都非常有用。特别是在涉及合规性时，直接组织的优质信息是一项资产。但是，AI
    在不久后也将改变游戏规则。目前，分类方案和文件计划是根据学术规则手动开发的。未来，软件将分析所有信息，并根据保护指南、用户模型、流程、价值和保留期进行自我组织。


    问：这一系列对信息技术、风险和合规等领域全球领导者的访谈，旨在跨越不同的文化，寻找这些学科的共同价值观和主题。我了解到你是标准化的倡导者。在你参与过的项目和人中，是否存在某些你认为应该是通用目标的共同点？


    答：标准化是必须的。无处不在的。我们通过语言、术语和语法来实现理解。我们通过硬件来实现支持，使其能够接口和操作系统。我们通过软件来实现支持，使其能与其他软件和系统交互。我们在记录管理系统的文档保留规则中也做到了这一点。标准化无处不在；这毫无疑问。真正的问题是，什么必须被标准化，为了什么目的？标准化会阻碍创新吗？关于精简和控制数据的标准化是否与某群人或组织的文化对立？


    组织越大、越分散，实施变革和改变文化工作就越困难。旧有的行为、语言障碍、时区、文化差异有时会让共同价值难以定义。维持价值并让业务运行顺畅的流程也需要某种标准化。随着未来人工智能的发展，这一切可能会发生变化。人类工作的减少意味着由人类驱动的使用模型和对人类工作的尊重将会减少。这是一个重大的社会挑战，因为人们经常通过工作来定义自己的地位。因此，这是所有项目中的共同线。谁来重新定义流程、让员工参与进来、努力帮助他们克服对失去工作的恐惧，并负责为一种新类型的工作环境植入新思维？随着
    AI 的逼近，我们甚至不得不重新定义什么是工作。人不再是标尺、尺子或准则。


    问：处于企业内容管理（ECM）和系统设计的前沿，让你学到了许多关于开发的教训。我们现在处的环境比 30 年前受监管得多。我们今天面临的挑战交叉了隐私和安全。在构建下一个
    `Documentum`、`SharePoint`、`Alfresco` 或 `Relativity` 时，你认为内容管理系统的应该考虑哪些类型的风险和担忧？


    答：旧的恐龙架构和大型企业解决方案没有未来。现代解决方案必须关注各种每种类型和技术格式的信息。产品的基本策略是自动化。不仅是为了摆脱人工工作并加速，更是为了提高质量控制并建立新的业务机会领域。集成仍然是一个大问题。我们讨论的不再是面向档案管理员传统记录系统，而是将
    `ECM` 功能集成到其他软件中。接口和应用程序接口（`APIs`）至关重要。就像移动应用世界一样，我们将看到服务的出现，这些服务会自动集成并配置到其他环境中。


    复杂系统只有通过基于 AI 的管理软件才能管理。因此，不仅是终端用户相关的流程将发生变革，这些解决方案的配置、管理和维护也是如此。IT 服务概念将确保 `ECM`
    功能像 `Software-as-a-Service`、`Platform-as-a-Service` 和本地部署一样可用。一个变化是终端用户不再看到 `ECM`
    客户端，因为该功能已集成到标准的桌面环境中。`ECM` 失去了桌面的可见性，变成了标准基础设施。所有这些发展改变了传统 `ECM` 软件架构和功能的范式。它们需要新的
    `dev-ops`、新的开发工具、倾听用户以及更快的测试。


    问：关于通用数据保护条例（`GDPR`）有很多噪音，特别是“被遗忘权”和严格的隐私数据保留保护措施，但我们还没有看到关于该法律旨在支持的更广泛社会利益的智力讨论。你如何看待这种“回归隐私”对社会的改进？当许多年轻一代不仅忽视了隐私的价值，而且正如
    Simon Sinek 所指出的，他们通过过度分享的社交媒体社区的视角来看待自己时。


    答：`GDPR` 已经实施一段时间，现在才开始执行。这并不是回归隐私。隐私要求和法规一直都在。但以前没人真关心。我们在信息和信息共享上非常粗心。现在我们又抱怨互联网巨头在使用我们的数据。`GDPR`
    的新质量是双倍的：一方面，它是面向全欧洲以及处理欧洲个人数据和在欧洲开展业务的组织。因此，它旨在成为一个全球标准。另一方面，它对侵权行为威胁以高额罚款。


    这是我们过去缺失的执法工具，这就是为什么大家开始关注它。但另一面是，小企业、协会和其他可能受到 `GDPR` 的威胁。大公司可以聘佣律师团队并建立数据保护部队，而小企业被官僚主义淹没。信息管理软件是大型公司管理所有数据的必要工具。他们需要数据地图来识别存储了哪些信息及其质量、价值、法律属性，以及它是如何被处理的。小企业因为规模问题在这些要求面前挣扎，大型企业则因为复杂性和涉及的海量数据而挣扎。


    社交社区对这些要求有不同的看法。一方面，他们必须更加关注隐私。他们必须能够提供报告，说明他们在哪里存储数据以及对数据做了什么。另一方面，`GDPR` 强化了他们，因为小型论坛、博客、社区、小组和企业放弃了合规，并将社区搬到
    `Facebook`、`LinkedIn` 或其他地方。像 `Facebook` 这样的社区甚至利用必要的声明来实施人脸识别等新技术，这直接冲突了隐私。


    '
