    A: 有的，也没有。我们提供开放的 API，这让银行、移动运营商等能够与 `BanQu` 集成。此外，我们还与后端会计系统、ERP、库存管理、记录系统等集成。因此，当这些步骤发生时，客户已经开始进行分析了，因为他们可以说：“嘿，我们开始看到这个地区有了优质的作物了。”我们遇到过一些情况，由于
    `blockchain`，欺诈检测部分已经显示了效果，因为进入供应链的每个人都是已知的，并且希望被认可。现在每个人都能获得他们所参与交易的副本，这提高了透明度。


    从数据分析的角度来看，像我们这样的大品牌喜欢它，因为现在它给了他们以前从未过的最后一公里可见性。特别是从现金流的角度来看，从试图减少应收账波动、供应链保险和生产规划的角度来看。在许多市场中，完全是现金交易，并且需要
    90 天的人工对账流程才能完成。


    尽管如此，我们并不拥有任何人的数据，这是一个关键。我们永远不会拥有任何人的数据，因为那样将违背创建区块链应用的初衷。因此，在他们参与的交易方面，数据所有权属于品牌，但数据所有权也属于农民、无可归者或难民。他们现在拥有了可以使用自己的数据副本。


    按照我们构建的方式，终端用户现在可以证明他们的存在或被遗忘的权利。因此，我们有这种基于权限的账本，农民可以说：“我想向银行展示我的数据。”并可以赋予银行权限。她也可以说：“我不想再参与了，我有权隐身。”因为归根结底，`BanQu`
    中的这些最后一公里农民拥有拥有、访问、变现和授权其数据的能力。所以，分析是有效的，但并不适用于最后一公里。


    Q: 进行这些访谈的目标之一是更好地理解数据不断演变的角色及其对社会和治理的影响。你曾与金字塔上各个层级的人生活和工作。区块链在这里扮演着什么角色？


    A: 有时，人们会对我们的工作提出反对意见并说：“你知道的，农民是不识字的。”我对此感到被冒犯，因为我从未遇到过任何农民或任何贫困的人说：“不要告诉我我卖了给你多少作物、衣服或钻石，”或者“不要告诉我价格或付款确认。”事实上，农民、矿工、服装工人都是非常有文化且且聪明的。这里存在数据问题。它对治理有很大影响。在我过去的职业中，我曾在
    `Sarbanes-Oxley` 工作，负责合规和审计以及职责分工。我深耕合规框架并熟悉所有这类问题。在我给出的农民例子中，发生的情况是，世界认为农民的数据权利是不存在的。那些种植咖啡的贫困妇女的权利每天都在侵害。我们采取了不同的方法，发现分布式账本区块链技术赋能了最贫穷的人，同时加强了全球最大的品牌。


    如果你将货币端解耦，区块链是不可变性和共识。货币就是货币。真正的价值是共识和不可变性。这就是许多人错失区块链真正价值的地方。我们采取的方法是：农民、制造牛仔裤的奴隶劳工以及难民，应该对他们被迫参与或自愿参与的所有数据拥有控制权。这在某种程度上解决了围绕《通用数据保护条例》和数据隐私的某种部分困惑，因为归根结底，如果你以正确的方式实施它（正如我们在过去
    18 个月中证明的那样），农民拥有他们的数据，对吧？


    所以，如果农民正在卖咖啡给咖啡公司，但咖啡公司说：“嘿，从现在起不想买你的咖啡了，”在当今世界，这家咖啡公司将带走关于农民的所有数据。这就是今天世界的运作方式。然而如果你使用区块链，是的，农民和咖啡公司的关系改变了。公司带走了所有数据，但农民现在拥有一份没有人可以夺走的数据副本。这就是我们的实现方式。这也是为什么我们坚持：`BanQu`
    不拥有任何人的数据。归根结底，如果我的银行客户离开了，在我的最后一公里，由于我们有 `B to B to C` 模型，客户永远不会失去对数据的访问，因为我们有适当的安全措施。


    Q: 对于那些想要通过教育促进公益事业的人来说，这似乎是理想的职业路径。对于刚刚开始之旅的年轻人，你有什么建议？他们如何开始考虑进入区块链领域？


    A: 首先，你可能需要失败百万次。这是最简单的回答。但从职业角度来看，我绝对会进入计算机科学或某些技术栈。五大技术：物联网、区块链、大数据、人工智能和量子计算。这五项技术将改变我们生活的方方面面，无论好坏。如果你想创办下一个慈善机构或下一个大项目，你最好对这些领域有所了解，因为即使你最终成为一名脑科医生，你可能仍然需要理解其中某一项。这就是第一点。


    第二点就是直接投入，创办一家良好的创业公司，并愿意失败。

    '
