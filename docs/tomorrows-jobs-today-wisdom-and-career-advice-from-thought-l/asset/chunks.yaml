    # A: 数字营销面临的两大挑战是时间稀缺和白噪音，这在企业 IT 领域似乎更为明显。IT 部门被要求投入更少资源完成更多工作，而他们没有多少时间从日常工作中抬头来评估大局势，并与不同的解决方案进行战略性互动。因此，你必须最大化现有的时间和注意力。我们尝试提供不同内容的组合供人们参与，但我们总是努力保持内容的吸引力和信息量。我们会发布一段
    60 秒的视频，记录我在 `LinkedIn` 上吃拉面并谈论数字化转型，但也会针对与我们的解决方案相关但不以其为中心的客户挑战举办 60 分钟的深度研讨会。每一份内容都必须具有娱乐或教育价值，否则对我们的观众来说就是浪费时间。


    我们行业的另一个挑战是白噪音。不仅有大量的供应商，而且他们都在陈词，其中某些主张比其他的更有根据。此外，由于技术通常是全新的且不断演变的，所有供应商对技术的定义或对其业务的分类都略有不同。即使这与直接销售给客户没有关系，建立和维护你的信誉并投入时间教育你的观众也是至关重要的。这就是为什么我们投入大量的资源来维护
    `Office 365`、`SharePoint` 和数字化转型领域质量最高的博客。


    ## Q: 人工智能和机器学习是否正在颠覆我们传统的企业内容管理 (ECM) 系统和策略？业务领导者现在可以采取哪些步骤为未来的自动化文档生命周期管理做好准备？


    A: AI 和机器学习主要以积极的方式影响着企业内容管理系统。价值最高的用例之一是搜索。例如，`Office 365` 现在变得越来越擅长根据我过去的行为判断我想想要查看或编辑的文档。这几乎令人可怕。最终来说，这是一件好事，因为许多行业研究显示，员工在搜索内容上浪费了过多的生产力。然而，我们也见过噩梦般的情况，组织没有对其内容进行适当的标记或分类，导致工资数据意外暴露给整个公司。最终，增强搜索和
    AI 是好的，但组织仍然需要对自己的数据保持警惕。


    我们看到机器人技术被部署在企业内部以提高生产力。AvePoint 在 `Microsoft Teams` 中推出了了虚拟助手聊天机器人 `AVA`，允许终端用户恢复
    `Office 365` 中被删除或丢失的项目。这帮助终端用户快速获得他们所需的内容，并消除了一些 IT 管理员通常必须处理的繁琐任务。


    ## Q: 数据保护一直是云技术面临的问题，尤其是现在有了《通用数据保护条例》(GDPR) 和美国的消费者权利法。当大量数据都在供应商和第三方手中时，你如何让客户应对高度技术的网络安全和隐私挑战？


    A: AvePoint 在最近的 `Forrester Wave` `GDPR` 解决方案报告中被评强领导者，因此我们从很多方面提供帮助。首先，你提到有大量数据在供应商和第三方手中，这是事实。这是组织必须缓解的风险，但行业已经意识到这种风险几年了。这意味着，对
    `SaaS` 供应商进行云安全评估已成为标准，但他们仍然深陷于电子邮件和电子表格的炼狱中。我们提供了一种企业风险管理解决方案，帮助自动化这一过程并允许组织计算他们的隐私和安全风险。


    我们看到机器人技术被部署在企业内部以提高生产力。AvePoint 在 `Microsoft Teams` 中推出了了虚拟助手聊天机器人 `AVA`，允许终端用户恢复
    `Office 365` 中被删除或丢失的项目。这帮助终端用户快速获得他们所需的内容，并消除了一些 IT 管理员通常必须处理的繁琐任务。


    首先，你提到有大量数据在供应商和第三方手中，这是事实。这是组织必须缓解的风险，但行业已经意识到这种风险几年了。这意味着，对 `SaaS` 供应商进行云安全评估已成为标准，但他们仍然深陷于电子邮件和电子表格的炼狱中。我们提供了一种企业风险管理解决方案，帮助自动化这一过程并允许组织计算他们的隐私和安全风险。


    其次，你注意到了数据流向第三方的挑战。我们帮助组织的第三种方法是提供可以扫描数据的解决方案。


    Q: Markus，你与公司合作，帮助他们更好地理解和处理与其最宝贵信息资产相关的、长达数十年的且往往不完整的元数据。在某些情况下，你客户的机构记忆已经完全丢失。他们正努力通过平衡留存成本和不及时销毁的风险来决定是否处置这些记录。你的团队如何利用诊断性、预测性和指导性分析来解读数据，从而做出明智的决策？


