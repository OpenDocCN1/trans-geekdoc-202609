  * 物理\n\n## 5.8 给定场景，执行数据安全和隐私实践。\n\n* 数据销毁和介质清理\n    * 焚烧\n    * 碎碎\n    * 纸浆化\n\
  \    * 磨粉化\n    * 消磁\n    * 清除\n    * 擦除\n* 数据敏感性标记和处理\n    * 机密\n    * 隐私\n   \
  \ * 公开\n    * 专利\n    * PII\n    * PHI\n* 数据角色\n    * 所有者\n    * 管理/保管员\n    * 隐私官\n\
  * 数据留存\n* 法律与合规\n\n\n\n\n\n当你与第三方集成系统和数据时，请务必对比并分析每个机构的安全立场。协议或连接的每一方都应遵循其组织定义的安全策略和程序。然而，双方都需要确保其合作伙伴的安全基础设施能够满足其对安全的预期。如果两个机构之间的安全水平、甚至是安全成熟度之间存在巨大差异，那么安全性较低的实体将使另一个实体面临更大的被攻破风险——这就像网络中一个未打补丁的系统会使网络中的所有其他系统都面临风险一样。\n\
  \n为了验证合规性和性能标准，你应该审查协议要求。双方都应对其合作伙伴进行评估或审计，以确保其符合共同协议以及任何法规或合同义务。如果发现合作伙伴违反了法规，双方双方可能都需对这一疏忽承担责任。即使在没有法规的情况下，评估对方的安全敏锐度以及支持合理水平的生产力和性能的能力，对双方来说都是有益的，其目的是确保各项协议和合同的共同利益。\n\
  \n数据备份至关重要，因为它们是在数据丢失或损坏时恢复数据的唯一手段。然而，当第三方参与数据系统或信息交换时，需要解决备份哪些内容以及由谁来备份的问题。通信流的哪一侧应该备份数据？双方都应该备份数据吗？备份期间需要考虑数据所有权吗？如果合作伙伴关系解除，归档备份中的混合数据以及恢复期间的数据如何处理？\n\
  \n未经授权的数据共享可能会向外部或未经批准的实体泄露隐私、机密或专有数据。当你与第三方进行数据和系统集成时，未经授权的数据共享的风险会增加。需要数据加密、强身份验证、细粒度授权控制以及对活动的详细监控来减少和或消除此类泄露。\n\
  \n`互操作性协议 (interoperability agreement)`是一种正式合同（或至少是一份文档），定义了某种安排，即两个实体同意以某种身份相互工作。它定义了交换或共享的细节，因此几乎没有产生误解或事后更改协议条款的空间。该协议可以存在供应商和客户之间，也可以存在平等双方之间。此类协议可能会讨论单一资源的共享或等值资源的交换。\n\
  \n互操作性协议有许多形式和类型（表 5.1）。其中一些将在下面的章节中讨论。\n\n### 表 5.1 协议类型\n\n| 协议类型 |  |\n| ---\
  \ | --- |\n| BPA | 业务合作伙伴协议——组织实体之间 |\n| SLA | 服务水平协议——客户与供货之间 |\n| ISA | 互连安全协议——设定\
  \ IT 网络安全要求 |\n| MOU/MOA | 意向备忘录/协议备忘录——对一致协议或一致意图的表达 |\n\n#### BPA\n`业务合作伙伴协议 (BPA)`\
  \ 是两个实体之间的合同，规定了他们业务关系的条款。它清楚地定义了每个伙伴在这一努力中的预期和义务。`BPA` 应该包含有关决策过程；管理风格；业务资本如何分配；薪资、福利和其他其他分配的水平；是否可以增加新伙伴；纠纷解决；外部竞争活动/利益冲突；以及如何处理死亡或解散的情况等细节。\n\
  \n#### SLA\n`服务水平协议 (SLA)` 是供应商与客户之间的合同。`SLA` 定义了针对特定成本、以物易或其他补偿所提供的内容。它规定了服务或产品的范围、数值、质量、时间范围、性能和其他属性。如果提供者未履行其义务，`SLA`\
  \ 列出了客户的补偿或偿还选择。它还定义了客户在延迟付款或未付款情况下的惩罚措施。\n\n#### ISA\n`互连安全协议 (ISA)` 是对两个机构 IT\
  \ 基础设施之间链路的安全立场、风险和技术要求的正式声明。`ISA` 的目标是定义维护两个网络之间通信路径安全性的预期和责任。连接网络可以互利互惠，但它增加了需要识别和解决的额外风险。`ISA`\
  \ 是实现这一点的手段。\n\n#### MOU/MOA\n`意向备忘录 (MOU)` 或 `协议备忘录 (MOA)` 是两个实体之间对协议或一致意图、意愿或目的的表达。它通常不是法律协议或承诺，而是更正式形式的互惠协议或握手（这两者通常都未写在纸上）。`MOU`\
  \ 也可以称为`意向书 (letter of intent)`。它是记录双方之间协议或安排细节的手段，但并不一定在法律上约束他们遵守文档的参数。\n\n###\
  \ 人员管理\n实施适当的安全涉及技术的使用，但也强制要求修改用户行为。如果人员不相信也不支持安全，他们往往会反对组织最佳的安全努力。任何安全结构中最薄弱的环节都是在该工作的人。理解你的员工要么支持安全要么在拆解安全，对于适当策略设计、安全实施和用户培训至关重要。\n\
  \n#### 强制休假\n`强制休假 (Mandatory vacations)` 是用户同行审计的一种形式。该过程通过要求每位员工每年至少休假（或只是离开办公室且没有远程访问权限）一周到两周来实现。在员工离开期间，另一名员工使用原员工的特权账户执行其工作任务。此过程用于检测欺诈、滥用或无能。该技术通常用于金融环境或管理高价值资产的环境。\n\
  \n#### 岗位轮换\n`岗位轮换 (Job rotation)`、`交叉培训 (cross-training)` 或`职责轮 (rotation of duties)`\
  \ 是分离（见下一节）应用的平衡。如果所有高级任务都由单个管理员执行，如果某人离开了组织会怎样？如果没有其他人有知识或技能执行这些任务，组织就会遭受损失。岗位轮换是在少数工人之间定期轮换分配的工作任务或工作描述，有时被称为轮换小组（图\
  \ 5.1）。\n\n![图 5.1 岗位轮换、交叉培训和职责轮换](img/c05f001.jpg)\n\n**图 5.1** 岗位轮换、交叉培训和职责轮换\n\
  \n\n\n\n当实施工作轮换时，多个个人都拥有执行每项任务的知识。这些人员并不总是拥有执行这些任务的权限，但在需要时，一旦授予权限，他们就可以被召唤执行这些任务。这降低了人员离职带来的风险，因为该人员可能恰好是某个关键功能专有知识或技巧的唯一拥有。工作轮换的实施通过聘用几位在各自工作角色中接受过交叉培训的管理员，减少了对组织的行政影响。这有助于确保在行政人员流失的情况下，特定角色或工作职能能够获得持续的行政支持。\n\
  \n## 职责分离\n\n`Separation of duties`（`SoD`）是将管理任务或特权任务划分为不同的组；反之，每个组被单独分配给唯一的管理员。职责分离的应用确保了没有任何用户对整个网络、服务器或系统拥有完全访问权限或权力。每位管理员都有其独特定义的责任范围，且仅在特定分配的区域内拥有权限。如果某个管理员行为不端或其账户被破解，整个网络不会自动受到破坏。\n\
  \n职责分离将最小特权原则应用于管理用户。然而，它也要求几位管理员合作完成组织中的高风险、大规模性任务。这有助于防止欺诈、减少错误并防止利益冲突。例如，配置安全的人员不应是测试安全的人员；负责应收账款的人不应执行应付账款业务；程序员不应是测试代码和批准应用程序部署的同一批人员。\n\
  \n将职责分离视为一种控制机制，旨在限制由于个人错误或欺诈而可能造成的损害。例如，让同一名人员负责局域网（LAN）管理和局域网安全通常不是一个好主意。更好的模型是设立\
  \ IT 部门和安全部门。更严格的应用将将报告机制也分开，以防止许多 IT 部门“让它运行起来”的哲学压过那些不受欢迎的“以安全的方式运行起来”的替代方案。`SoD`\
  \ 是你现在在许多公司中同时发现首席信息官（`CIO`）和首席运营官（`COO`）的原因之一。另请参见第三章“架构与设计”中“安全 DevOps”章节的相关讨论。\n\
  \n## 洁净桌面策略\n\n`clean-desk policy`（洁净桌面策略）用于指导员工在每个工作阶段结束后如何以及为什么要清理桌面。从安全角度来看，此类策略的主要目标是减少敏感信息的泄露。这可能包括密码、财务记录、医疗信息、敏感计划或日程以及其他机密。如果员工在每天/每班结束时将所有工作材料放入可锁的办公桌抽屉或文件柜中，就可以防止这些材料的泄露、丢失和/或被盗。\n\
  \n用户也因未能妥善处理数据而闻名。应该指示用户将数据文件存放在哪里。通常，数据文件应该存储在包含公司备份流程的服务器上，而不是存储在客户端。除非获得授权并批准，否则用户不应使用移动介质。任何包含敏感或珍贵数据的移动介质都应格外小心，以防止丢失或被盗。用户不应安装软件，因为软件可能感染恶意软件，从而窃取数据或损害损害网络。用户不应通过任何未加密手段传输敏感数据，包括互联网电子邮件、文件传输、点对点文件共享、即时消息（IM）或\
  \ VoIP 协作工具。\n\n允许携带或在办公室外使用带有敏感数据的便携式电脑或移动介质的用户应只携带执行即时工作任务的最少数据。任何离开公司场所的资源丢失或被盗的风险都显著增加。保护整个数据集、数据库或记录集免受这种不必要的风险是非常关重要的。\n\
  \n## 背景检查\n\n`Background checks`（背景检查）用于核实员工是否符合职位要求且未被取消资格。例如，一个工作新申请人可能拥有正确的教育背景和证书，但缺乏所需的最低工作经验，因此既符合资格又不符合资格。背景检查用于核实工作经历、犯罪背景（如有）、证书和许可情况，以及个人和职业推荐。背景检查的目标或目的是核实当前或潜在员工是否适合该职位且不会对组织构成威胁。\n\
  \n## 离职面谈\n\n离职 interviews（离职面谈）是一种受控且尊重的终止或解雇过程。离职面谈的目的是控制这种情绪化的终止事件，以减少财产损失、信息泄露或其他尴尬情况。离职面谈通常在经理或人力资源经理的办公室进行。员工进入会议时，会有另一位人员（如其他经理、主管、高管或安全人员）陪同作为见证。随后通知员工已被解雇并允许去寻找其他工作机会。提醒他们有义务遵守签署的保密协议和任何相关合同。此时应交出身上所有的公司财产；这些包括钥匙、胸卡、智能卡、寻呼机和手机。随后，离职员工将被直接护送离开现场。如果离职员工的工作区域有任何个人物品，将由安全人员收集并在离开现场时还给他们。在某些组织中，可能要求允许安全人员驾驶离职员工的车辆离开公司停车场。如果员工家中还有其他公司财产，安全人员将乘坐另一辆车辆跟随，并在公共区域等待员工进入家中收集相关物品并提交给安全人员进行清点和评估。\n\
  \n离职面谈有许多变体和补充，可以添加到这一基本结构中。离职面谈应该以一致且尊重的方式进行。处理良好的终止流程会维护员工的尊严，并为他们提供处理离职问题（如医疗保险、失业补助、退休账户管理和最终工资发放）的知识，同时防止对公司财产的损害、与经理及其他同事的冲突或数据的损坏。\n\
  \n## 基于角色的意识培训\n\n安全解决方案的成功需要用户行为的改变。这些改变主要包括对正常工作的调整，以符合安全策略的标准、指南和程序。行为改变涉及用户某种层面的学习。通常有三种公认的学习水平：意识、培训和教育。\n\
  \n\n\n\n\n实际安全培训的前提是`awareness`（意识）。建立安全意识的目标是将安全置于首位，并使其成为用户公认的实体。意识在整个组织范围内建立了一个安全理解的共同基准或基础。意识的建立并非仅仅通过课堂式的练习，而是通过工作环境来完成的。可以使用许多工具来建立意识，例如海报、通知、通讯通讯文章、屏幕保护程序、T\
  \ 恤、管理者的集会演讲、公告、演示文稿、鼠标垫、办公用品和备忘录，以及传统的讲师授培训课程。意识关注与安全相关的关键或基础主题及问题，无论员工处于何种职位或分类，都必须理解这些内容。\n\
  \n意识是建立安全理解最小共同公约数或基础的工具。所有人员都应该充分意识到自己的安全责任和义务。他们应该接受培训，以知道该做什么和不该做什么。\n\n用户需要意识的问题包括避免浪费、欺诈和未经授权的活动。从高级管理人员到临时实习生，组织的每个成员都需要相同水平的意识。组织中的意识计划应与其安全策略、事件处理计划和灾难恢复程序挂钩。为了使意识培养计划有效，它必须保持新鲜、具有创造力并经常更新。意识计划还应与企业文化如何影响和作用个人以及整个组织安全的理解联系起来。如果员工没有看到安全策略和标准的执行，特别是在意识层面，那么他们可能觉得没有义务遵守它们。\n\
  \n## 基于角色的培训\n`Role-based training`（基于角色的培训）涉及教授员工执行工作任务并遵守安全策略（见表 5.2）。所有新员工都需要某种程度的培训，以便符合安全策略强制的所有标准、指南和程序。新用户需要知道如何使用\
  \ IT 基础设施、数据存储在哪里，以及资源分类的方法和原因。许多组织选择在授予网络访问权限之前对其进行培训，而另一些则在完成特定岗位培训之前授予新用户有限访问权限。培训是一项持续活动，必须在员工的整个职业生涯内持续进行。它被视为一种行政安全控制。\n\
  \nTABLE 5.2 安全角色\n\n| 角色 || 定义 |\n| --- | --- |\n| 数据所有者 (Data owner) || 负责规定资源的安全需求\
  \ |\n| 系统管理员 (System administrator) || 执行安全策略 |\n| 系统所有者 (System owner) || 为系统或网络设定要求\
  \ |\n| 用户 (User) || 系统的操作员 |\n| 特权用户 (Privileged user) || 拥有超出普通用户之外的能力和责任 |\n|\
  \ 执行用户 (Executive user) || 企业管理人员 |\n\n意识和基于角色的培训通常在公司内部提供。这意味着这些教学工具是由组织内部并在组织内部创建和部署的。然而，下一层级的知识传递通常从外部第三方源获取。\n\
  \n## 教育\n`Education`（教育）是一项更详细的努力，学生和用户在其中学习的内容远多于执行工作任务实际所需的知识。教育通常与用户追求认证或寻求职位晋升有关。它通常是寻求安全专业职位的人员的配置。安全专业人员需要对安全以及整个组织的本地环境有广泛的，而不仅仅是其特定的工作任务。\n\
  \n### 数据所有者\n当第三方参与 IT 系统或数据交换时，清楚地建立关于数据所有权的规则和限制非常重要。数据的原始拥有者是否保留所有权？现在接收数据的任何人是否拥有所有权？或者，支持网络或通信路径的中介是否对传输的数据拥有潜在的所有权？\n\
  \n数据所有者对其拥有的对象具有完全控制权。这赋予了他们更改内容以及为他人设置授权的能力。\n\n### 系统管理员\n系统管理员是负责执行组织和系统所有者所建立的安全和功能策略及要求的人员。系统管理员的工作功能可能包括安装更新、安装软件、备份数据以及响应故障排除问题。\n\
  \n### 系统所有者\n系统所有者是负责设定系统要求的实体。系统所有者可以是整个组织，也可以是个人网络经理。系统所有者制定安全策略、设定基准并定义系统配置。在许多组织中，系统所有者系统管理员的角色是合并的。\n\
  \n### 用户\n用户或操作员是使用部署的系统执行分配工作任务的个人。用户有责任在安全策略范围内完成分配的任务，并报告任何可疑或异常事件。\n\n### 特权用户\n\
  特权用户是被授予了超出普通用户的额外能力、权限和用户权利的人。特权用户通常被称为管理员。特权用户或管理员可能对环境的某个区域拥有特殊权限，例如用户账户、数据库或防火墙，但不应对\
  \ IT 基础设施的所有区域都拥有特殊权限（因为这违反了职责分工原则）。\n\n### 执行用户\n执行用户是企业管理职位的人员，被授予了超出普通用户的额外权限和能力，但可能小于管理员或特权用户。应注意给予执行用户多少额外权力，特别是当个人不熟悉安全和\
  \ IT 保护时。\n\n### NDA\n`NDA（保密协议）是一种合同，禁止特定的机密、秘密、专有或个人信息分享在特定预设个人或组织之外。许多员工在入职时必须签署\
  \ NDA，禁止他们在在职期间或离职后向任何外部实体披露内部细节。\n\n### 入职\n请参考第 4 章“身份与访问管理”中的“入职/离职”章节，了解此项人员管理操作描述。\n\
  \n### 持续教育\n如果用户没有经过良好培训并在安全环境中执行工作任务，那么安全就是毫无用处的。员工的安全培训对于任何安全努力的成功至关重要。它应该是安全策略和业务运营的一部分。这应该包括、意识培训、教育以及通过在线资源的支持。员工的`持续教育`主要应侧重于提高效率、生产力和安全合规性。\n\
  \n\n\n\n作为任何组织中的安全专业人员，你必须保持沟通渠道的畅通。这意味着你应该对所有人员的安全要求做到公开透明。清晰地培训用户如何在维护安全性的同时完成他们的工作任务。\n\
  \n作为经理，要乐于与各个层级和分类的人员讨论安全问题。准备好讨论安全性的优点和缺点。并乐于帮助用户学习如何在维持安全的同时保持高效和高产力。通过保持开放且丰富的沟通，你可以帮助防止用户放弃安全措施或刻意绕过安全程序。\n\
  \n`User awareness`（用户意识）是一项让安全成为所有员工常规思维的努力。它始于员工入职时的安全培训和引导。然而，用户意识必须贯穿组织的整个生命周期。它包括定期提醒、复习研讨会、带有安全更新的电子邮件、通讯报、内网网站、印有安全事实或规则的海报等——任何必要的让用户意识到安全重要性的措施。\n\
  \n如果一个组织未能维持用户的安全意识，它将面临安全性的逐渐侵蚀，这最终可能导致严重入侵的发生。遗憾的是，用户安全意识通常是安全管理中最容易被忽视的元素。事实上，缺乏安全意识是社会工程攻击成功的主要原因。通过适当的信息，用户可以具备识别社会工程攻击的能力并避免被其骗。\n\
  \n`Education`（教育）是广泛的安全培训，通常侧重于教用户如何安全地执行工作任务。安全教育的最终目标是认证。`Certification`是指通过一项或多项考试以获得认证证书（简历上亮眼的缩写），这证明了你拥有某些知识、技能和专业知识。\n\
  \n安全文档，特别是针对特定工作任务的指令，应该发布在内网网站上以便访问。这样，用户就可以了解变化的安全策略和程序。相比之下，关于已知漏洞和活跃调查的安全文档几乎不应向所有人公开（即使是所有内部员工）。\n\
  \n### 可接受使用政策/行为准则\n\n`acceptable use policy (AUP)`（可接受使用政策）定义了公司设备和资源哪些是以及不可接受的活动、实践或使用。可接受使用政策专门用于分配组织内部的安全角色，并规定与这些角色相关的责任。该政策定义了可接受的水平以及对行为和活动的预期。未能遵守政策可能会导致职业行为警告、处罚或终止合同。\n\
  \n没有可接受使用政策会导致许多用户产生错误假设，认为任何活动都是允许的，并且即使在公司设备上也享有隐私。然而，公司设备上往往很少或没有隐私。尽管这因国家而异，但公司通常有权审计、监控和记录使用其设备和访问服务时发生的所有活动。可接受使用政策（除隐私政策外）概述了这些监控策略，规定了用户可以做什么和不能做什么，并明确说明用户没有隐私。通常，员工必须在招聘和培训过程中过程中阅读并签署可接受使用政策。\n\
  \n### 不利性措施\n\n`Adverse actions`（不利性措施）是指未能遵守公司政策或在组织内主动实施违法行为的后果。不利性措施可以包括管理层的训诫、重新培训、要求在晚上或周末加班补工作、减薪或扣留工资、工作时间减少或增加、失去福利、跳过晋升或提升、必须支付费用或罚款、面临终止合同（图\
  \ 5.2）。\n\n### 通用安全策略\n\n组织基本保护正式化的最高层被称为 `security policy`（安全策略）。安全策略：\n\n- 是一份定义所需安全范围的文档\n\
  - 是任何成功尝试的基础元素\n- 是安全需求的概述或概括\n- 定义了主要的安全目标并概述了安全框架\n- 识别了主要功能区域并澄清了所有术语\n- 应该清晰定义为什么安全很重要以及哪些资产是有价值的\n\
  - 是实施安全的战略计划\n- 应该广泛概述为了保护组织利益应采用的安全目标和实践\n- 讨论了安全对日常运营每个方面的重要性以及高级级员工的重要性\n- 用于分配责任、定义角色、指定审计要求、概述执行过程并定义可接受的风险水平\n\
  - 通常用作高级管理层在保护自己免受入侵、攻击和灾难方面尽到职责的证明\n- 是强制性的\n\n许多组织采用几种类型的安全策略来定义或概述其整体安全策略（图 5.3）。组织安全策略（organizational\
  \ security policy）关注与组织每个方面相关的问题。特定问题安全策略（issue-specific security policy）关注特定的网络服务、部门、功能或其他与组织整体不同的方面。系统特定安全策略（system-specific\
  \ security policy）关注单个系统或类型的系统，规定了批准的硬件和软件，概述了锁定系统的方法，甚至强制要求防火墙或其他安全控制。\n\n除了这些针对性的安全策略外，安全策略还有三类总体分类：监管性的、咨询的和信息性的。每当行业或法律标准适用于你的组织时，就需要\
  \ `regulatory`（监管性）策略。该策略讨论了必须遵守的法规，并概述了应用于引导合规的程序。`advisory`（咨询性）策略讨论了接受的行为和活动，并定义了违规的后果。它解释了高级管理层对组织安全和合规的愿望。大多数策略都是咨询性的。`informative`（信息性）策略旨在提供特定主题的信息或知识，例如公司目标、使命宣言或组织如何与合作伙伴及客户互动。\n\
  \n\n\n\n从安全策略流中可以产生许多其他完整安全解决方案所需的文档或子元素。策略是宏观的概述，而标准、基线、指南和程序则包含了关于实际安全解决方案更具体、更详细的信息。\n\
  \n你应该将所有内容记录下来，作为安全的标准做法。文档通常被视为安全的基石。因此，你需要将所有安全元素完整地写入安全策略、标准、基线、指南和程序中。如果你有详尽的文档，将会有关于配置、操作、程序等的详细记录，这在发生事件、灾难或实施变更时将为你提供帮助。\n\
  \n有了完整、详细且详尽的文档，你环境的每一个方面以及受保护环境中的每一个事件都是已知的。当出现新事件或状况时，可以对文档进行审查和参考。有了适当的记录，组织的安全性更容易维护。\n\
  \n## 社交媒体网络/应用程序\n\nFacebook、Twitter 和 LinkedIn 等社交媒体网络，以及 Instagram、微信和 Pinterest\
  \ 等社交媒体应用，对个人和组织来说都是非常有用的工具。这些社交媒体服务和软件可用于发布信息、吸引新客户、提供支持、增加市场曝光率等。然而，与传统的广告媒体（如印刷、音频和视频广告）不同，组织无法完全控制公众接收到的信息。存在一种风险，即公众可能会查看他们并不认可的信息，或者仅仅利用你的平台将注意力引导他们感兴趣的领域。在尝试将社交媒体作为与客户、客户和公众的接口时，请保持谨慎——并在你的信息淹没在噪音中时做好准备。\n\
  \n## 个人电子邮件\n\n许多组织对于在公司设备上使用或访问个人电子邮件有安全策略。某些组织严格禁止使用个人电子邮件，而另一些组织则在不给组织带来风险或不会成为完成工作任务的严重干扰的情况下允许访问。当员工访问个人电子邮件时，系统面临恶意附件、邮件正文中的恶意脚本、通过链接访问恶意或不当内容或泄露公司机密数据的风险可能会增加。因此，对于组织来说，在公司设备上禁止使用个人可能是更安全的想法。\n\
  \n员工可能倾向于在自己的个人设备上访问个人电子邮件，而不是通过公司设备，以减少公司过滤器、拦截和审计的影响。通过公司系统发送或存储在公司系统上的任何数据都可以被组织查看、访问和保留。因此，为了最大限地保护个人隐私，员工应该将个人通信活动限制在自己的设备上。\n\
  \n## 考试要点\n\n**定义 SOP。** `标准操作程序` (`SOP`）是一种组织策略，提供详细或细粒度的逐步操作说明，以完成特定任务。`SOP` 的目标是提高员工活动的一致性，特别是在性能和安全合规性方面。\n\
  \n**理解与第三方集成系统和数据的安全影响。** 每当有第三方涉及你的 IT 基础设施时，数据丢失、泄露或破解的风险就会增加。在实施之前，需要仔细考虑与第三方集成系统和数据的安全影响。\n\
  \n**理解互操作性协议。** 互操作协议是正式合同（或至少是书面文件），定义了某种安排，即两个实体同意以某种身份相互协作。\n\n**定义 BPAs。** 业务伙伴协议\
  \ (`BPA`）是两个实体之间的合同，规定了它们的业务关系。\n\n**定义 SLAs。** 服务水平协议 (`SLA`）是供应商与客户之间的合同。\n\n\
  **定义 ISAs。** 互连安全协议 (`ISA`）是一份正式声明，说明了两个组织 IT 基础设施之间链路的安全立场、风险和技术要求。\n\n**定义 MOUs。**\
  \ 谅解备忘录 (`MOU`) 是两个实体之间协议或一致意图、意愿或目的的表达。\n\n理解用户习惯。实施适当的安全涉及使用技术，但还要求改变用户行为。如果人员不相信和支持安全，他们通常会反对组织的最佳安全努力。这包括处理密码行为、数据处理、整洁桌面策略、防止尾随以及个人所有设备等问题。\n\
  \n**理解岗位轮岗。** 岗位轮岗有两个功能：它提供了一种知识冗余，而且通过调动人员减少了欺诈、数据修改、盗窃、破坏和信息滥用的风险。\n\n**了解强制休假。**\
  \ 为期一两周的强制休假用于审计和验证员工的工作任务和权限。这通常会导致对滥用、欺诈或疏忽的检测。\n\n**理解职责分离的重要性。** 职责分离是将管理员任务或特权任务划分为不同的组，每个组再分配给唯一的管理员。职责分离的应用确保了没有单一用户对整个网络、服务器或系统拥有完全访问权限或权力。\n\
  \n**定义整洁桌面策略。** `整洁桌面策略` 用于指导员工在每个工作阶段结束如何以及为什么要清理桌面。\n\n**理解背景检查。** 背景检查用于验证员工是否符合某职位的资格而不被淘汰。\n\
  \n**了解离职面试。** `离职面试`是一个受控且尊重的终止合同或辞雇员工的过程。离职面试的目标是控制这一通常充满情感色彩的终止事件，以尽可能地减少财产损失、信息泄露或其他不幸或尴尬的发生。\n\
  \n**理解基于角色的培训。** `基于角色的培训`涉及教授员工执行工作任务并遵守安全策略。\n\n**理解安全教育。** 教育意味着安全培训，通常侧重于教用户安全地完成工作任务。安全教育更广泛，最终目标是认证。\n\
  \n**理解用户意识。** 用户意识是一项让安全成为所有员工经常思考的努力。遗憾的是，用户安全意识通常是安全管理中最被忽视的元素。缺乏安全意识是社交工程攻击成功的主要原因。\n\
  \n**定义 NDA。** `NDA`（保密协议）是一份合同，禁止特定的机密、秘密、专利和/或个人信息在特定指定的个人或组织之外共享或传播。\n\n**理解什么是可接受使用政策。**\
  \ 可接受使用政策定义了公司设备和资源什么是什么是不可接受的活动、做法或使用。\n\n\n\n\n\n## 理解什么是安全策略。\n\n安全策略是一个环境中安全工作的总体目的和方向，同时也指指明如何遵守安全要求来执行各项活动的详细程序性文档。\n\
  \n### 5.2 总结业务影响分析概念。\n\n灾难恢复计划和程序使组织能够在面临威胁其基础设施的事件时，维持或恢复其关键任务流程。维持业务连续性意味着维护组织的网络和\
  \ IT 基础设施，以确保关键任务功能继续运行。这必须在资源减少和设备受损的情况下完成。只要业务运营不停止，业务连续性就用于维持组织。如果业务运营停止，则交由灾难恢复介入。\n\
  \n`业务影响分析 (BIA)`是对业务任务和流程进行风险评估的过程，而不是针对资产。`BIA` 的目的是确定业务流程面临的风险，并设计保护和恢复解决方案。其目标是维持业务连续性，防止和/或减少停机时间，并为灾难发生后的快速恢复和复原做好准备。\n\
  \n`BIA` 识别对组织持续生存至关重要的资源以及对这些资源构成的威胁。它还评估了每个威胁实际发生的概率以及这些事件发生对业务的影响。该分析的结果为您提供了量化衡量标准，帮助您优先将业务连续性资源分配给组织面临的各种风险。\n\
  \n### RTO/RPO\n\n`最大可忍停机时间 (MTD)` 是业务功能处于无法运行状态且对业务造成不可修复损害的最长时间。`MTD` (见图 5.4])\
  \ 在您执行业务连续性计划 (BCP) 和灾难恢复计划 (DRP) 时提供了有价值的信息。一旦您定义了恢复目标，就可以设计并计划完成恢复任务所需的程序。\n\n\
  ![图 5.4 MTD, RTO, 和 RPO 时间线](img/c05f004.jpg)\n\n**图 5.4** MTD、RTO 和 RPO 时间线 \n\n\
  这引出了另一个衡量指标，即每个业务功能的`恢复时间目标 (RTO)`。这是您认为在发生中断时可以可行恢复该功能的时间。BCP 过程的目标是确保您的 `RTOs`\
  \ 小于 `MTDs`，从而确保功能不可用的时间永远不会超过可忍停机时间。\n\n与 `RTO` 相关的指标是`恢复点目标 (RPO)`。`RPO` 是衡量组织在灾难发生时可以接受多大的损失。这种可接受的损失是用时间衡量的。`RPO`\
  \ 测量独立于 `RTO`。例如，如果一个组织只能承受两个小时的数据丢失，那么 `RPO` 就是两小时。`RPO` 的是在灾难发生点之前可以丢失多少数据，而 `RTO`\
  \ 指的是公司在灾难发生后恢复运营所需的时间。通常，备份系统的设计是为了防止数据损失超过 `RPO` 限制，而恢复解决方案的设计是为了在超过 `RTO` 之前让一切状况恢复正常。\n\
  \n### MTBF\n\n老旧硬件应计划进行更换和/或维修。此类操作的计划应基于为每个设备建立的`平均无故障时间 (MTTF)`、`平均故障间隔时间 (MTBF)`\
  \ 和`平均修复/恢复时间 (MTTR)` 估值，或者基于现行的硬件生命周期管理组织最佳实践。`MTTF` 是在特定运行环境下设备预期的典型功能寿命。`MTBF`\
  \ 是故障之间预期的典型间隔时间，例如第一次故障和第二次故障之间的时间。如果 `MTTF` 和 `MTBF` 的值相同（或几乎相同），某些制造商仅列出 `MTBF`\
  \ 额定并用它涵盖这两个概念。`MTTR` 是执行设备维修所需的平均长度。在预计发生灾难性故障之前，设备通常可以经过多次维修。务必在所有设备的 `MTTF` 到期前安排更换。\n\
  \n当设备被送去维修时，您需要一个替代方案或备份设备来填补维修期间的空缺。通常，等到发生小故障后再进行维修是可以接受的，但等到完全故障发生后再进行更换是一种高风险的安全实践。\n\
  \n### MTTR\n\n请见上一节“MTBF”。\n\n### 关键任务功能\n\n`关键任务功能`或`关键业务功能`是指任何对组织运营至关的核心业务任务。这些功能、流程或任务如果被停止、中断或终止，可能会导致整个整体性失败。某些组织在没有功能性关键任务流程的情况下可以生存一短时间，但这些情况的\
  \ `MTD` 通常很短。\n\n### 关键系统的识别\n\n在评估风险并确定其最佳应对措施的过程中，需要识别组织的关键要素。`关键任务系统`、功能、流程或任务是组织的核心组件。如果没有关键任务运营，组织将不复存在。最的系统和组件通过\
  \ `BIA` 过程识别。`BIA` 与风险评估实际上是同一个过程。唯一的区别是风险评估关注资产，而 `BIA` 关注业务任务。对于每个业务任务，都会计算一个\
  \ `ALE`（年度预期损失）（参见后文“ALE”章节）。具有最大 `ALE` 的流程、系统或组件是该组织最关键的元素。\n\n### 单点故障\n\n`单点故障`是指任何对组织具有中等或关键任务重要性的单个设备、连接或路径。如果该项出现故障，整个组织将遭受损失。基础设施的设计应对所有中等或高度重要的元素进行冗余，以避免单点故障。消除单点故障涉及增加冗余、恢复选项或执行业务任务的替代手段。避免或解决单点故障将提高稳定性、运行时间和可用性。\n\
  \n### 影响\n\n`影响`衡量潜在威胁实现时可能或将造成的损害或损失量。威胁的影响由`暴露因子 (EF)` 指出：如果风险发生，资产价值损失的百分比（例如，如果发生了攻击）。\n\
  \n### 生命\n\n任何当业务任务或功能涉及人员生命风险时，必须实施保护措施以减少或消除人员死亡的可能性。可能导致生命损失等严重影响的风险包括自然灾害、火灾和人为攻击（如爆炸、毒药和射击）。大多数组织努力通过预防、检测和响应手段（如防火、改进检测、疏散计划、配备手持灭火器和建筑灭火系统）来减少生命威胁。\n\
  \n\n\n\n\n安全涉及到人员的健康。安全违规防护应包括防止个人免受物理和生理伤害的保护。组织应该提供安全的工作环境，例如适当的光线；稳定的地面；楼梯上的扶手；车辆行驶区域的标记；以及用于急救、洗眼或化学品接触后清理的安全站。\n\
  \n## 财务\n\n安全泄露可能会对财务产生影响。从入侵中恢复可能代价高昂，特别是当必须更换硬件、对该组织提起诉讼，以及需要进行大量调查以清除有害或恶意的代码或收集证据时。某些组织可能获得黑客险、入侵险或安全泄露保险，但应注意评估其成本效益，以及它是否涵盖了组织可能实际经历的任何问题。\n\
  \n## 声誉\n安全泄露可能会对组织的声誉产生不利影响。如果安全泄露变成公开信息，新闻媒体和网络博主可能会强调入侵的负面方面，而不是关注成功的检测、响应和恢复。此类负面报道可能会引导舆论反对该组织，从而对销售额和未来的业务产生直接的负面影响。\n\
  \n## 隐私影响评估\n\n`隐私 隐私影响评估 (PIA)` 是一种用于确定隐私风险、如何减轻这些风险，以及是否与新或未来的项目或努力有关通知受影响方的工具。当一个组织将通过新的软件应用程序、外展计划或其他任何类型的现实或数字交互从员工和/或客户收集个人身份信息（PII）时，应起草\
  \ `PIA`。`PIA` 应用于确定收集哪些特定的 PII 元素以及目的。然后，`PIA` 应评估 PII 的收集、存储、保护、使用、分发、访问和共享手段。\n\
  \n`PIA` 的目标是确保符合法律、法规、合同和政策；预测泄露的风险和后果；并协助评估保护措施的有效性并确定实施的额外保护措施。\n\n有关国土安全部（DHS）的\
  \ `PIA` 示例，请参见 [`www.dhs.gov/privacy-impact-assessments`](https://www.dhs.gov/privacy-impact-assessments)。\n\
  \n## 隐私阈值评估\n\n`隐私 阈值评估 (PTA)` 用于评估组织已经收集的数据，以确定此类数据是 PII、业务机密还是非敏感数据。如果发现 PII，则必须确定其来源并揭示其预期用途。如有必要，应实施额外的保护措施以防止\
  \ PII 分发。`PTA` 然后可用于确定 PII 是否为合法资产以及应如何管理，或者 PII 是否为非法资产并应被清除且通知相关方。\n\n## 考试要点\n\
  \n**定义 BIA。** 业务影响分析 (`BIA`) 是对业务任务和流程（而非资产）进行风险评估的过程。`BIA` 的目的是确定业务流程的风险，并设计保护和恢复解决方案。\n\
  \n**理解 MTD。** 最大可忍停机时间 (`MTD`) 是业务功能在无法运行状态下不会对业务造成不可弥补的损害的最长时间。\n\n**了解 RTO 和 RPO。**\
  \ 恢复时间目标 (`RTO`) 是你认为在发生中断时，能够可行地恢复该功能所需的时间。恢复点目标 (`RPO`) 是衡量当灾难发生时，组织可以接受多大程度的损失。\n\
  \n**定义 MTTF、MTBF 和 MTTR。** 老旧硬件应计划更换和/或维修。此类操作计划应基于为每个设备建立的平均故障时间 (`MTTF`)、平均故障间隔\
  \ (`MTBF`) 以及平均修复/恢复时间 (`MTTR`) 估计，或根据管理硬件生命周期的主流组织最佳实践。\n\n**理解任务关键功能。** 任务关键功能或关键任务功能是指任何对组织运营具有核心中心作用的业务任务。\n\
  \n**理解单点故障。** 单点故障是指任何对组织运营至关重要的单一设备、连接或路径。\n\n**了解影响。** 影响是衡量如果潜在威胁变为现实，可能或将造成的损害程度。威胁的影响由暴露因子\
  \ (`EF`) 标出，即如果风险发生时资产价值损失的百分比。\n\n**定义 PIA。** 隐私影响评估 (`PIA`) 是一种用于确定隐私风险、如何减轻这些风险，以及是否与新或未来的项目或努力有关通知受影响方的工具。\n\
  \n**定义 PTA。** 隐私阈值评估 (`PTA`) 用于评估组织已经收集的数据，以确定此类数据是 PII、业务机密还是非敏感数据。如果发现 PII，则必须确定其来源并揭示其预期用途。如有必要，应实施额外的保护措施以防止\
  \ PII 分发。\n\n## 5.3 解释风险管理过程和概念。\n\n安全旨在维持授权访问的同时防止数据或露。可能损害、破坏或披露数据或其他资源的可能性被称为\
  \ `风险`。\n\n因此，管理风险是维持安全环境的一个要素。风险管理是识别可能损害或披露数据的因素、根据数据价值和防护成本评估这些因素，并实施成本效益解决方案的详细过程。风险管理的整体过程用于开发和实施信息安全策略。这些策略的目标是降低风险并支持组织的任务。\n\
  \n因此，风险管理的主要目标是将风险降低到可接受的水平。该水平具体取决于组织、资产价值、预算以及许多其他因素。一个组织认为可接受的风险对另一个组织来说可能是不合理的高水平。\n\
  \n\n\n\n实现风险管理目标的过程被称为`risk analysis`。它包括对环境进行风险分析、评估每种风险发生的概率以及发生后可能造成的损害成本、评估每种风险各种应对措施的成本，并创建一份关于保护措施的成本/效益报告以提交给高层。除了这些以风险为重点的活动外，风险管理还需要对组织内的所有资产进行评估、评价和价值赋值。如果没有适当的资产评估，就无法对可能产生损失的风险进行排序和比较。\n\
  \n## 威胁评估\n\n尽管我们尽如所愿，但各种形式的灾难最终会击中每一个组织。无论是自然灾害（如飓风或地震），还是人为灾难（如建筑火灾或水管破裂），每个组织都会遇到威胁其生存的事件。强大的组织制定了完善的计划和程序，以帮助减轻灾难对其持续运营的影响，并加速恢复到正常运行。\n\
  \n### 环境\n环境威胁是由大自然触发的自然灾害。环境威胁可能导致业务任务的轻微中断、系统和基础设施的严重损害，或给组织带来毁灭性的灾难。\n\n### 人为\n\
  人为威胁是任何由人类引起的事件或事故。这范围从战争和恐怖主义行为到数据窃取、破坏和贪污不等。\n\n### 内部与外部\n组织需要认真对待任何及所有威胁。它们需要理解，源自内部和外部的安全风险都是重大的。外部攻击者通常获得更多的媒体关注，但内部威胁往往更有可能对组织造成重大且持久的损害。\n\
  \n## 风险评估\n风险识别和风险计算是组织安全工作不可或缺的组成部分。如果没有风险评估和分析，你将不知道你的安全策略需要解决哪些问题。计算机系统和网络永远不可能完全安全。然而，这一事实不应阻止你尽可能地保护你的环境。通过使用资产识别、风险评估、威胁识别和漏洞管理，你可以将安全工作集中在那些对你的资产威胁最大的领域上。\n\
  \n如果你不知道自己拥有什么，就不知道要保护什么。必须进行彻底的资产盘点，以识别任务关键系统，以及你的组织提供服务和生产产品所需的日常物品（如回形针和便利贴）。一旦你有了一份总清单，就可以对资产进行优先级排序。然后你可以先对最重要的项目进行风险评估；在为它们提供额外保护之后，再转向不那么重要的项目。\n\
  \n风险评估、风险管理和风险分析的目标是最大限度地减少风险对组织的影响。这是通过`mitigation`（应用保护措施或应对措施）、`transfer`或`assignment`（外包或购买保险）或`acceptance`（接受潜在损失）来实现。这一过程识别潜在威胁，评估这些威胁的潜在影响，并权衡所需的保护机制成本与业务连续性潜在损失或中断之间的关系。\n\
  \n`threat`是指任何可以利用漏洞的人或工具。威胁识别是一个概述系统潜在威胁的正式过程。`threat vector`是攻击获取目标访问以造成的路径或手段。这也被称为`attack\
  \ vector`。`threat probability`或`threat likelihood`是对发生概率的计算。`vulnerability`是系统中的缺陷、错误或漏洞。\n\
  \n该过程识别潜在威胁，评估这些威胁的潜在影响，并权衡所需的保护机制成本。\n\n### SLE\n`Single loss expectancy`（`SLE`）是单次事件导致的潜在价值损失。它是通过将`EF`乘以资产价值计算出的。`exposure\
  \ factor`（`EF`）是风险发生时资产损失的百分比。\n\n### ALE\n`Annualized loss expectancy`（`ALE`）是每种风险每年的潜在价值损失。它是通过将`SLE`乘以`ARO`计算出的。\n\
  \n\n\n\n- 应对措施应对所有用户、系统、协议等提供一致且均匀的保护。\n- 应对措施应尽可能减少或消除依赖，以减少级联故障。\n- 应对措施在初始部署和配置后，只需要极少的人工干预。\n\
  - 应对措施应该是防篡改的。\n- 应对措施应提供供特权操作人员访问的覆盖机制。\n- 应对措施应提供失效安全（fail-safe）和/或失效保护（fail-secure）选项。\n\
  \n幸运的是，你不需要为每一个 ALE（年度预期损失）选择一种特定的应对措施。随着优先处理优先级 ALE，这些应对措施也将解决许多次要的 ALE 问题。每当解决一个首要\
  \ ALE 资产或威胁，剩余问题的总列表就会缩小。\n\n### ARO\n\n*均年发生率*（`ARO`）是特定风险一年内可能发生特定次数的统计概率（通常写为\
  \ #/year）。它从风险评估公司、保险公司的精算表、通过分析内部历史记录，或者有时通过猜测获得。`ARO` 是对威胁造成伤害的机会以及该伤害在未来可能发生频率的评估。\n\
  \n### Asset value\n\n*资产价值*（通常写为 `AV`）是资产对组织的价值或重要性。它是基于有形和无形价值、支出和成本混合计算得。`AV`\
  \ 预测了如果资产不再可用或可行，组织将遭受的损失金额。\n\n### Risk register\n\n*风险登记表*或风险日志是一份文档，列出了组织、系统或单个项目内识别出的所有风险。风险登记表用于记录和跟踪风险管理活动，包括：\n\
  \n1. 识别风险。\n2. 评估严重性并对这些风险进行排序。\n3. 制定响应以减少或消除风险。\n4. 跟踪风险缓解的进度。\n\n### Likelihood\
  \ of occurrence\n\n*可能性*是衡量威胁在特定时间内变为现实的概率指标。在风险评估范围内，可能性是以年为单位进行衡量的。这种测量值被称为 `ARO`。参见前面的“ARO”章节。\n\
  \n### Supply chain assessment\n\n在评估组织风险时，考虑影响组织的外部因素是重要的，特别是与公司稳定性和资源可用性相关的因素。应该对组织的供应链进行评估，以确定它给组织带来了哪些风险。该组织是否按准时制运营，即材料在制造需要之前或正需要时交付？如果交付出现任何延迟，是否有多余或缓冲材料可用，可以在供应链运营重组期间维持生产？\n\
  \n### Impact\n\n风险管理的目标是将影响降至最低。这可以通过防止风险的发生，或通过对伤害做出及时且充分的响应来实现。参见目标 5.2 下之前的“影响”章节，“总结业务影响分析概念”。\n\
  \n### Quantitative\n\n大多数风险管理过程始于资产盘点。接下来，为每个资产分配一个 `AV`。然后，考虑每个资产的威胁。每个“资产-威胁”对都应该对\
  \ `EF`、`ARO` 以及对组织的最终影响进行单独评估。风险评估方法有两种：定量分析和定性分析。*定量*风险分析为资产损失分配具体的美元金额。*定性*风险分析为资产损失分配主观和无形的价值。这两种方法对于完整的风险分析都是必须的。\n\
  \n定量方法产生具体的概率百分比。这意味着它创建了一份报告，其中包含了风险等级风险水平、潜在损失、应对措施成本和保护措施价值的美元金额。这份报告通常非常易于理解，特别是对于任何了解电子表格和预算报告的人来说。将定量分析视为为风险分配量值的行为：换句话说，为每个资产和威胁标上美元金额。然而，纯粹的定量分析是不可能的；并非所有的分析元素和方面都可以被量化，因为某些是定性的、主观的或无形的。定量风险分析过程从资产估值和威胁识别开始。接下来，估计每个风险的潜力和频率。这些信息随后被用于计算评估保护措施的各种成本函数。\n\
  \n定量风险分析的六个主要步骤或阶段如下：\n\n1. 盘点资产并分配价值 (`AV`)。\n2. 研究每个资产并产生每个单独资产的所有可能威胁列表。对于列出的每个威胁，计算\
  \ `EF` 和 `SLE`。\n3. 执行威胁分析，计算每个威胁在一年内变为实现的概率——即 `ARO`。\n4. 通过计算 `ALE` 得出每个威胁的总体损失潜力。\n\
  5. 研究每个威胁的应对措施，然后根据所应用的应对措施计算 `ARO` 和 `ALE` 的变化。\n6. 对每个资产的每个威胁的每种应对措施进行成本效益分析。为每个威胁选择最合适的响应。\n\
  \n### Qualitative\n\n定性风险分析更多是基于场景的，而不是基于计算器的。与其为可能的损失分配精确的美元金额，不如在一个范围内对威胁进行排序，以评估它们的风险、成本和影响。定性风险矩阵（图\
  \ 5.7）可以显示频率和后果之间的关系。执行定性风险分析的过程涉及判断、直觉和经验。你可以使用许多技术进行定性风险分析：\n\n- 头脑风暴——从小组或个人收集自发想法\n\
  - 德尔菲法——小组通过使用盲投票达成匿名共识的方法\n- 故事板——通过画画来表示概念和时间线\n- 焦点小组——使用围绕单一主题的调查、研究或讨论小组\n\
  - 调查——一种广泛的数据收集技术，力求从任何来源获取信息\n- 调查问卷——提问一系列问题\n- 清查清单——必须对照流程、任务或存储进行评估的清单清单\n\
  - 一对一会议——同行之间讨论某个主题的会议\n- 访谈——与领域专家或对事件或情况有直接经验的人进行面对面的互动\n\n![图 5.7 定性风险矩阵](img/c05f007.jpg)\n\
  \n**图 5.7** 定性风险矩阵\n\n采用何种机制取决于组织的文化以及涉及的风险和资产类型。通常同时使用多种方法，并在提交给高层的最终风险分析报告中对比。\n\
  \n### 测试\n\n风险管理可能需要使用测试来确定某些形式或类型的风险。风险发现或风险测试可能涉及渗透测试和漏洞测试，以便将系统和软件的问题纳入缓解过程。\n\
  \n#### 渗透测试授权\n\n在执行刑事违反模拟之前，从高级管理层获得渗透测试授权是重要的。未经授权的渗透测试违反公司安全策略，并可能构成犯罪活动。\n\n\
  #### 漏洞测试授权\n\n\n\n\n在执行安全评估之前，应当获得漏洞测试授权。虽然漏洞测试通常与数据丢失或系统崩溃没有关联，但对于普通用户来说，这通常是一项禁止的任务。这是因为这可能会向用户揭露可能对组织造成严重损害的缺陷。因此，除非获得专门授权，否则大多数组织都不允许进行漏洞测试。\n\
  \n## 风险响应技术\n\n风险分析的记录结果有很多：\n\n*   对所有资产进行完整且详细的估值\n*   所有威胁和风险的详尽列表、发生概率以及一旦发生时的损失程度\n\
  *   一份特定威胁的保护措施和应对措施列表，并识别其有效性和 `ALEs`\n*   对每项保护措施的成本效益分析\n\n这些信息对于管理层就保护措施实施和安全策略变更做出明智、智能的决策至关重要。\n\
  \n一旦完成风险分析，管理层必须处理每个特定的风险。对风险有几种可能的响应方式：\n\n*   接受或容忍\n*   分配或转移\n*   回避\n*   减少或缓解\n\
  *   拒绝或忽略\n\n接受、转移、回避和缓解风险响应将在后续的小节中介绍。\n\n风险的一种最终但不可接受的响应是 `拒绝风险` 或 `忽略风险`。否认风险的存在或希望它永远不会发生，并不是一种有效的、审慎的、尽责的风险响应。\n\
  \n一旦实施了应对措施，剩余的风险就称为 `residual risk`。剩余风险包括针对特定资产的任何威胁，但高层选择不实施保护措施。换句话说，剩余风险是管理层选择接受而非缓解的风险。在大多数情况下，剩余风险的存在表明成本效益分析显示可用的保护措施并非具有效益的威慑手段。\n\
  \n`Total risk` 是组织在不实施任何保护措施的情况下面临的风险量。总风险的公式为 `threats` * `vulnerabilities` * `asset\
  \ value` = `total risk`。（注意，这里的 `*` 并不意味着乘法，而是一个组合函数；这并不是一个真正的数学公式。）总风险与剩余风险之间的差异被称为\
  \ `controls gap`：通过实施保护措施而减少的风险量。`residual risk` 的公式为 `total risk` – `controls gap`\
  \ = `residual risk`。\n\n与一般的风险管理一样，处理风险不是一次性的过程。相反，必须不断维护和重新确认安全性。事实上，重复风险评估和分析过程是一种随时间推移评估安全计划完整性和有效性的机制。此外，它有助于发现缺陷和发生变化的领域。由于安全性会随时间推移而变化，定期进行重新评估对于维持合理的安全性至关重要。\n\
  \n显然，妥善管理风险不仅仅是贴上一个补丁。风险管理是一个详尽、严谨的过程，应该定期执行，以评估组织的安全状态。\n\n### 接受\n\n`Accepting\
  \ risk`（接受风险）或 `tolerating risk` 是管理层对可能的保护措施进行成本效益分析估值，并确定应对措施的成本远大于风险可能导致的损失成本。这也意味着管理层已同意在风险发生时接受其后果和损失。在大多数情况下，接受风险需要一份清晰的文字说明，说明为什么没有实施保护措施、谁对决策负责，以及如果风险发生，谁将对损失负责，通常以“签字”信的形式呈现。组织接受风险的决策基于其风险容忍度。`Risk\
  \ tolerance` 是组织吸收与已发生风险相关的损失的能力。\n\n### 转移\n\n`Assigning risk`（分配风险）或转移风险，是将风险代表的损失成本转移给另一个实体或组织。购买保险和外包是分配或转移风险的常见形式。\n\
  \n### 回避\n\n分配风险的变体是风险回避。这是一个选择比默认、常见、快捷或廉价选项风险更小的替代方案或活动的过程。例如，选择飞往目的地而不是开车是风险回避的一种。另一个例子是选择在亚利桑州而非佛。\n\
  \n风险分配的另一种变体是风险威慑。这是一个实施威慑措施以防止违反安全政策的过程。一些示例包括审计、监控摄像头、保安、运动探测器和强身份验证，以应对那些参与网络犯罪的人。\n\
  \n### 缓解\n\n`Reducing risk`（减少风险）或缓解风险，是实施保护措施和应对措施以消除漏洞或阻止威胁。选择最具效益或有益的应对措施是风险管理的一部分，但不是风险评估的元素。事实上，措施的选择是在风险评估之后。通过从服务器消除\
  \ FTP 来避免风险，另一个例子是搬到内陆以避免飓风风险。\n\n### 变更管理\n\n请参第 3 章“版本控制与变更管理”。风险管理的总体目标是理解并减少风险。变更管理的总体目标是防止变更导致不必要的停机或安全性下降。因此，变更管理是任何风险管理策略中的重要元素。\n\
  \n### 考试重点\n\n**理解风险管理**。风险管理是一个识别可能损害或泄露数据、根据数据价值和应对措施成本评估这些因素、并实施具有效益的解决方案来降低风险的详细过程。\n\
  \n**了解风险评估**。风险评估的目标是减少风险对组织的影响。这通过缓解、分配或接受来实现。该过程识别潜在威胁，评估这些威胁的潜在影响，并根据所需的保护机制和潜在损失或中断进行衡量。\n\
  \n**理解资产识别**。必须对资产进行彻底清理，识别关键系统以及组织执行服务和生产产品所需的日常物品（如回形针和贴纸）。一旦有了主清单，就可以对资产进行排序。\n\
  \n**了解风险评估公式和变量**。不同的风险评估公式和变量包括暴露因子 (`EF`)、单次损失预期 (`SLE`)、年发生率 (`ARO`) 和年损失预期 (`ALE`)。\n\
  \n**理解威胁**。威胁是任何可以利用漏洞的个人或工具。威胁识别是概述系统潜在威胁的正式过程。\n\n**了解漏洞**。漏洞是系统、网络、计算机、软件等安全保护中的弱点、错误或漏洞。当漏洞存在时，可能会存在威胁来利用它。你可以使用应对措施和保护措施来修补漏洞。\n\
  \n\n\n\n# 定义 SLE。\n单次损失（Single loss expectancy, SLE）是指单次风险发生事件导致的潜在美元价值损失。它是通过 `EF`\
  \ 乘以资产价值计算得。\n\n# 定义 ALE。\n年度预期损失（Annualized loss expectancy, ALE）是指每种风险每年导致的潜在美元价值损失。它是通过\
  \ `SLE` 乘以 `ARO` 计算得。\n\n# 定义 ARO。\n年度发生率（Annualized rate of rate, ARO）是特定风险每年发生一定次数的统计概率（通常写为\
  \ `#/year`）。\n\n# 理解风险登记表。\n风险登记表或风险日志是一份文档，列出了组织、系统或单个项目内识别出的所有风险。\n\n# 理解定量风险分析。\n\
  定量风险分析侧重于硬性数值和百分比。由于风险的非实性属性，完全的定量分析是不可能的。该过程涉及为资产分配价值并识别威胁，然后确定威胁的潜在频率以及造成的损害；其结果是对保护措施的成本效益分析。\n\
  \n# 理解定性风险分析。\n定性风险分析更多地基于情景而非计算。可能的损失不会分配精确的美元金额；相反，威胁根据量表进行排名，以评估其风险、成本和影响。此类分析有助于负责制定适当风险管理策略的人员。\n\
  \n# 了解处理风险或响应风险的选项。\n降低风险（或风险缓解）是实施保护措施和应对措施。分配风险或转移风险是将风险所代表的损失成本转移到另一个实体或组织上。购买保险是分配或转移风险的一种形式。接受风险意味着管理层已经评估了可能的保护措施的成本效益分析，并确定应对措施的成本远大于由于风险导致的可能损失成本。这也意味着管理层已同意在风险发生时接受其后果和损失。\n\
  \n## 5.4 针对给定情景，遵循事件响应程序。\n\n当事件发生时，你必须按照安全策略中概述的方法并与当地法律法规一致的方式进行处理。事件管理或妥善处理事件的第一步是识别事件何时发生。你应该理解以下与事件处理相关的两个术语：\n\
  \n* `Event`（事件）：在特定时间内发生的任何情况\n* `Incident`（事故）：对组织数据的机密性、完整性或可用性产生负面影响的事件\n\n###\
  \ 事件响应计划\n\n事件未被报告的最常见原因是它们从未被识别。你每天可能发生许多安全策略违规行为，但如果你没有识别它们的方法，永远不知道。因此，你的安全策略应该识别并列出所有可能的违规行为以及检测它们的方法。当新类型的违规行为和攻击出现时，更新你的安全策略也很重要。\n\
  \n当你发现发生了事件时，你所采取的做法取决于事件的类型和损害范围。法律规定某些事件必须报告，例如影响政府或联邦利益计算机的事件（联邦利益计算机是金融机构或水力、电力系统等基础设施系统使用的计算机）或某些财务交易，无论损害金额如何。美国大多数州现在都拥有法律，要求组织如果遭遇了涉及某些类型个人身份信息（例如，信用卡号、社会安全号码和驾驶执照号码）的事件，必须向受影响的个人告知其泄露情况。\n\
  \n除了法律之外，许多公司还有合同义务，需要向业务合作伙伴报告不同类型的安全事件。例如，支付卡行业数据安全标准（`PCI DSS`）要求任何处理信用卡信息的商户必须及时向\
  \ Visa、Discovery、MasterCard 或美国运通（American Express）报告涉及此类信息的事件。\n\n每个组织都需要一个 `事件响应计划\
  \ (IRP)`。`IRP` 是定义如何防止事件、如何检测事件、如何响应事件以及在事件结束后如何恢复正常的标准操作程序（SOP）。事件是指任何违反公司安全策略的行为。轻微事件由部署的安全基础设施处理，刑事事件由执法部门处理。\n\
  \n\n\n\n* 确定事件发生期间是否有任何机密泄露。\n* 实施任何必要的恢复程序，以恢复安全性并从事件相关的损害中恢复。。\n* 监督任何必要的额外安全措施的实施，以提高安全性并防止事件再次发生。\n\
  \n在组建事件响应团队时，务必设计一个跨职能小组，其成员应代表受安全事件影响最直接的管理、技术和职能责任领域。\n\n## 练习\n\n计算机事件响应小组（CIRT）做好准备工作的一些关键要素包括模拟、演练和实战演习。CIRT\
  \ 成员应该参与持续教育和研究，以确保他们对新攻击、漏洞利用以及响应措施和修复方案的知识与时俱进。但在这些知识被应用于实际事件事件之前，必须在现实世界的模拟中对其进行测试。某些\
  \ CIRT 将拥有基于计算机的模拟，有些则会在组织内部进行演练，还有一些将拥有复制的部分设施，以便对响应方案进行现场演练（有时称为练习）。\n\n## 事件响应流程\n\
  \n当发生安全泄露或安全违规行为时，应遵循`事件响应程序`。事件响应最重要的目标之一是`遏制`：对证据的保护和保存。这可能需要将系统下线、使用镜像软件复制硬盘、对显示器屏幕进行拍照、记录异常状况或活动、断开服务器的网络连接等。图\
  \ 5.8 所示了一种策略。\n\n![图 5.8 事件响应策略](img/c05f008.jpg)\n\n图 5.8 一种事件响应策略\n\n对于对于终端用户来说，事件响应策略简单直接：他们应该离开计算机系统并联系事件响应团队。对于计算机事件响应团队来说，事件响应策略则更为复杂。以下章节将讨论\
  \ CIRT 的职责或关注的问题。\n\n### 准备\n\n准备对于确保非计划停机、安全泄露或灾难取得成功结果至关重要。做好准备包括定义在响应事件时遵循的程序、加固环境以应对事件以及改进检测方法。拥有计划并预分配资源来处理事件，可以缩短恢复时间，同时尽可能地减少损失和成本。应该制定一个涵盖处理事件各个方面的事件响应策略。\n\
  \n### 识别\n\n响应事件的第一步是检测并意识到事件正在发生。如果没有检测，事件将变成假阴性（即在存在恶意活动的情况下没有警报）——换句话说，就是“未知的未知”。如果一个组织没有意识到自己正遭受损害，那么它就不知道需要响应或做出更改。因此，改进检测安全违规行为的方法至关重要。这包括详细的安全日志、使用\
  \ `IDSs` 和 `IPS` 以及监控性能以发现异常活动水平的趋势。\n\n一旦识别出事件，就应收集并记录有关事件的数据。事件响应团队应该记录环境的状态并尝试推断事件的原因。这将有助于他们确定关注范围。可能还需要许多其他问题，例如：\n\
  \n* 哪些系统受到了影响？\n* 源是内部还是外部的？\n* 泄露是在扩大还是已经结束？\n* 它是基于网络流量的攻击吗？\n* 哪些子网受到了影响？\n*\
  \ 哪些系统可能被入侵者访问？\n* 访问了哪些资源？\n* 使用了什么等级的权限？\n* 哪些信息或数据面临风险？\n* 攻击来自单一源/矢量还是多个源？\n\
  * 这是对之前攻击的重复吗？\n* 是否涉及恶意代码感染？\n* 泄露具有传染性吗？\n* 隐私是否受到侵犯？\n* 其他哪些系统具有类似的漏洞？\n\n在回答这些问题时，应将信息包含在事件文档中。\n\
  \n### 遏制\n\n在响应事件的过程中，重要的目标是遏制问题（即防止进一步损害的可能性）并控制或防止损失。`遏制`意味着限制损害范围并防止其他系统或资源受到负面影响。当事件包括病毒感染、远程控制访问、木洛马、逻辑炸弹或黑客工具的使用时，遏制尤为重要。这些组件的恶意使用可能会留下稍后激活的残留元素。因此，在遏制之后，清除恶意软件应作为恢复过程的一部分，以防止进一步的损害或损失。\n\
  \n当检测到安全泄露或边界违规时，首响应人员必须启动`事件响应`。计划的且有记录的事件响应的目标是限制事件造成的损害程度、尽可能地恢复环境，并收集有关事件和犯罪者的信息，以防止再次发生并追究法律诉讼。\n\
  \n响应安全违规行为的最佳方法是有一个可以遵循的事件响应计划。该计划定义并描述了发生事件时应执行的程序。检测到或怀疑发生事件时应发生的要步骤之一是联系事件响应团队，然后由遵循事件响应计划中的程序。\n\
  \n不要注销系统或关闭计算机很重要，因为这些操作可能会损坏或更改证据。CIRT 团队将指导首响应人员采取什么行动。在相关情况下，常见的行动之一是拔掉网线，但对受影响或受损的系统保持不动。通常，首响应人员是终端用户；因此，终端用户接受适当培训并意识到如何处理和报告事件是非常重要的。\n\
  \n在初始的事件识别过程中，事件响应团队成员可能会意识到某个系统是目标或是泄露的原因。在这些情况下，可能会考虑替代的响应措施，例如隔离或移除设备。\n\n`隔离`将某些物品与环境其他隔离开，以提供保护并防止隔离元素与环境产生交互。这种技术可以用于保护关键任务服务器免受网络攻击，或通过隔离服务器来保护网络免受受损服务器的影响。\n\
  \n一旦某个硬件被确定为系统泄露的罪祸首或源头，将其从生产网络中移除通常是必要的。这可能是临时性的，例如在清理或修复期间将设备进行隔离。但在大多数情况下，设备移除意味着移除一个不再用于生产的设备。这可能是因为设备损坏或受损，超出了合理修复或恢复系统的能力。在这种情况下，可以销毁违规设备并获取新设备投入生产。\n\
  \n#### 根除\n\n\n\n\n\n当额外损害的可能已消除（或至少显著减少）时，就可以进行根除过程。`Eradication` 包含了用于移除或消除事件原因的过程，例如移除软件、删除恶意软件、更改配置、解雇人员、禁用受破坏的账户以及阻塞\
  \ IP 地址和端口。在某些情况下，根除并非必要的，或者会在恢复阶段进行处理。在某些情况下，从备份恢复系统的行为本身就完成了对违规应用程序或恶意软件的根除。\n\
  \n## 恢复\n\n`Recovery` 是从环境中移除任何损坏元素并对其进行替换的过程。这适用于从备份中恢复损坏的数据，也适用于用更新的版本或新版本替换故障的硬件或软件。在某些情况下，需要重新构建整个计算机系统（从新部件重建），以消除所有受损元素，并将运行正常且可信的系统投入生产。\n\
  \n恢复和重建程序还包括配置设置的更改以及添加新的安全功能或组件。如果存在可能被利用以导致事件再次发生的漏洞，这一点尤为重要。在恢复阶段结束时，环境将恢复正常运行。\n\
  \n## 教训总结\n\n事件响应的最后一步是评估响应计划和程序，并根据需要进行改进。这种审查也可以作为提取或澄清事件响应期间所得教训的手段。在响应过程中经常会出问题，从错误或失误中学习将改进未来的响应。\n\
  \n## 考试要点\n\n**了解事件管理。** 当事件发生时，你必须按照安全策略中概述的方式以及与当地法律法规一致的方式进行处理。事件管理或妥善处理事件的第一步是识别事件何时发生。\n\
  \n**理解事件响应策略的概念。** 事件响应策略是在发生安全泄露或安全违规时应遵循的程序。事件响应策略最重要的目标之一是遏制：对证据的保护和保存。\n\n**理解事件响应。**\
  \ 计划和有记录的事件响应的目标是限制事件造成的损害程度，尽快恢复环境，并收集有关事件和责任人的信息，以防止再次发生并追究法律诉讼。\n\n**理解准备工作。**\
  \ 准备对于确保计划停机、安全泄露或灾难获得成功结果是必要的。准备包括定义响应事件时遵循的程序、加固环境以防止事件，以及改进检测方法。\n\n**了解事件识别。**\
  \ 响应事件的第一步是意识到事件正在发生。这应该会导致记录有关事件的所有细节。\n\n**理解升级和通知。** 一旦你对事件组成有了基本了解，就可以遵循分阶段的升级和通知程序。只有具有特定权限或责任的人员才应收到泄露通知。\n\
  \n**理解根除。** 根除包含了用于移除或消除事件原因的过程。\n\n**理解恢复/重建程序。** 恢复是从环境中移除任何损坏元素并对其进行替换、更改配置设置以及添加新的安全功能或组件的过程。\n\
  \n**了解第一响应者。** 当检测到安全泄露或边界违规时，必须由第一响应者启动事件响应。`CIRT` 团队指导第一响应者采取哪些行动。\n\n**理解损害和损失控制。**\
  \ 在响应事件的过程中，重要的目标是遏制问题（进一步损害的可能）并控制它。\n\n## 5.5 总结取证的备概念\n\n`Forensics` 是对证据的收集、保护和分析。`Forensics`\
  \ 包含了从证据收集到其在法庭提交之前的保护。为了使证据在法庭上具有可采性，你必须能够证明监管链没有被中断，证据已得到妥善保存。这包括将证据收集到可运输的容器中，然后提供一个安全的环境。安全的环境可以防止损坏和盗窃，同时保持适当的温度和湿度，避免灰尘、烟雾、磁场和震动。\n\
  \n证据的`Collection` 是使其安全的程序。过程通常通常 `bag and tag`（装袋标记）。基本上，证据被收集、放入容器并贴标签，然后填写其监管链文件。\n\
  \n### 易失性顺序\n\n在收集证据时，考虑数据和资源的易失性很重要。易失性是指数据由于计算机系统的正常运行和时间的流逝而改变或丢失的可能性。潜在证据的收集应该根据事件、事故或犯罪的类型以及易失性顺序优先进行。通常，图\
  \ 5.9 所示的易失性顺序是可靠的。\n\n*   寄存器、缓存\n*   网络连接\n*   路由表、ARP 缓存、进程表、内核统计\n*   临时文件系统\n\
  *   磁盘\n*   与系统相关的远程日志和监控数据\n*   物理配置、网络拓扑\n*   存档媒体\n\n![图 5.9 易失性顺序](img/c05f009.jpg)\n\
  \n**图 5.9** 易失性顺序\n\n这种易失性顺序来自 RFC 3227：证据收集和存档指南（[www.faqs.org/rfcs/rfc3227.html](http://www.faqs.org/rfcs/rfc3227.html)）。这是关于证据收集通用知识的一份非常优秀的\
  \ RFC。\n\n### 监管链\n\n`chain of custody` 是一份指示证据在其生命周期中各种细节的文件。它始于发现的时间和地点，并识别谁发现了证据、谁保护了它、谁收集了它、谁运输了它、在存储期间保护了它以及谁分析了它。最终，监管链文件详细说明了对证据具有控制权和访问权限的人员。记录中的任何空白都会对证据的完整性产生怀疑，因为证据可能脱离权威控制。监管链必须从发现证据的刻起直到在法庭提交证据为止创建并维护。\n\
  \n### 法律留存\n\n\n\n\n\n# 法律保全 (Legal Hold)\n\n`legal hold` 是证据收集或电子取证过程中的早期步骤。它是向数据保管者发布的法律通知，告知特定数据或信息必须被保存，并且必须尽善努力保存所指定的证据。保管者必须维护并保存这些数据，直到收到不再需要该义务的通知。数据保管者可以是调查员工的雇主、接受调查的用户的服务或资源在线提供商，或者是接受调查客户的互联网服务供应商（ISP）。\n\
  \n## 数据获取\n\n`Data acquisition` 是发现和收集与刑事案件相关数据的流程和程序。在大多数情况下，证据收集应由获得许可并经过培训的取证专家执行，通常是与执法部门相关的人。然而，对于\
  \ Security+ 考试，有必要对取证证据或数据获取相关的概念有一定的了解。\n\n`Big data` 指的是规模大到至于传统的分析或处理方法无效、低效且不足的数据集。大数据涉及许多严峻的挑战，包括收集、存储、分析、挖掘、传输、分发和结果展示。如此海量的数据具有揭示较小数据集无法解决的细微差别和特性。从大数据中学习的潜力是巨大的，但处理它的负担也同样巨大。随着数据量的增加，数据分析的复杂性也随增加。大数据分析需要在大规模并行或分布式处理系统上运行高性能分析。在某些情况下，与犯罪活动相关的采集数据量巨大，这意味着取证数据获取和证据分析必须利用大数据工具。\n\
  \n### 捕系统镜像\n\n由于大多数计算机犯罪证据以磁性存储设备上的比特形式存在，因此很容易被操纵和更改。计算机可以用来制造和伪造任何形式的记录或数据。为了保存数据并建立和验证这些数据的完整性，会对嫌存储设备进行镜像。\n\
  \n在大多数情况下，会使用取证镜像程序创建存储设备的位流镜像副本。原始介质的镜像副本存储在取证清洁的存储设备上，这些设备已通过零化处理（zeroization\
  \ process）删除了所有现有数据。\n\n创建镜像的过程是在检查和平衡的情况下执行的。取证复制系统会在执行位流镜像拷贝的前后计算原始介质的哈希值（hash）。如果这些哈希值匹配，说明复制过程没有更改原始数据。此外，镜像副本也会进行哈希处理。如果镜像过程运行正常，每个镜像副本的哈希值将与原始数据的哈希值匹配。\n\
  \n### 网络流量与日志\n\n当发生计算机犯罪或违反策略的行为时，收集所有可能的证据来源至关重要。这些可能包括网络流量捕获以及网络设备日志。在某些网络环境中，可能对网络流量进行持续记录。然而，因为这会对存储容量产生巨大需求，此类记录通常只保留近期网络活动的滑动窗口——通常以分钟或最长几小时为单位。如果及时检测到违规行为，可以保存网络流量窗口以备进行更详细的离线分析。\n\
  \n许多网络设备（包括路由器、交换机、智能配线架、防火墙、代理和 VPN 设备）可以配置为记录发生在其上、或通过它们的事件、活动或数据包的日志文件。这些日志需要被收集和保存，以便在调查中使用。\n\
  \n### 拍摄视频\n\n视频有两个问题。首先，如果存在安全摄像头并捕到了安全违规的视频，这些捕到的视频图像需要作为证据保存。视频（及音频）录还可能记录输入的敏感数据，例如信用卡号。在这种情况下，这些数据必须受到与原始数据相同或更高水平的保护。\n\
  \n其次，在执行调查，特别是在寻找物理和/或逻辑证据时，让某人录像整个过程可能是重要的。视频录像观察可以协助犯罪现场重现、定位以及在法庭陈述期间对证据进行正确解释。\n\
  \n除了对证据收集行为录像外，在移动或拆卸与调查关联的物理物体时，从多个角度拍摄大量照片是一个好主意。\n\n### 记录时间偏移\n\n当事件被记录到日志文件中时，它会被赋予一个时间戳。时间戳取自写入日志文件的本地设备时钟，或者如果执行了远程日志记录，则从源设备随事件一起发送。然而，网络中设备和计算机的时钟在某种程度上不同步是非常普遍的现象。因此，建立一个已知的时间标准至关重要，例如通过美国\
  \ NIST (`http://tf.nist.gov/tf-cgi/servers.cgi`) 访问的原子钟之一；其他国家也有国家级的时间源。\n\n然后，每当提取一个日志文件时，都会检查主机设备的时钟并与时间标准进行比较。记录\
  \ `time offset`（时间偏移）是指记录设备时钟与标准之间的差异；它用于调整日志条目的时间，以同步多个网络设备上的事件和活动。日志时间管理对于攻击或入侵事件的时间顺序重建至关重要。\n\
  \n### 获取哈希值\n\n正如前面在“捕获系统镜像”部分提到的，在镜像复制的前后，如图 5.10\n\n**图 5.10** 一个哈希工具，HashCalc\n\
  \n### 截图\n\n在执行取证调查时，永远不要信任嫌疑计算机上的软件。因此，不建议使用原生屏幕捕获工具或功能。相反，使用相机拍摄显示内容的任何。这包括显示器、较小的\
  \ LCD 屏幕（如打印机上的）以及任何可能指示状态或功能的 LED。\n\n### 证人访谈\n\n`witness`（证人）是指通过其五感之一或多种感官过事件或事故的人。证人可以提供关于发生了什么、何地发生以及相关事件的时间顺序的信息。在调查或法庭案件期间，证人经常被要求提供其经历的证词。\n\
  \n## 保护\n\n\n\n\n\n取证保全旨在防止对收集到的证据发生任何更改。这些工作包括从系统中移除相关的存储设备、使用写保护保护适配器来阻止存储设备接收任何写入信号、在每次操作的前后进行哈希值计算，以及仅对存储设备的克隆副本进行分析，而绝不操作原始设备。如果原始数据被损坏或更改，它通常将无法在法庭上被采用。因此，取证专家在处理原始源驱动器时会极其谨慎。一旦创建了经过适当哈希验证的克隆，原始设备就会被封存并保护，然后所有的分析都将在克隆上进行。\n\
  \n## 恢复\n\n在取证调查过程中，通常需要恢复或还原数据，以便使其可用并确定其是否与犯罪活动有关。恢复的一种方法是从备份中恢复文件，无论这些备份是硬盘、磁带、光盘还是云端。另一种恢复机制是获取由文件系统维护的文件影子的访问权限。例如，在\
  \ `Windows Server` 系统下运行的 `NTFS` 格式存储设备可能使用 `Volume Shadow Copy Service`（卷影拷贝服务），该服务在向存储设备写入新版本文件时保留文件的旧版本。\n\
  \n恢复也可能包括分析空隙（slack space）中的数据。空隙空间是文件使用的最后一个簇中未被文件完全使用的未使用存储空间。最后一个簇的任何未使用部分都会保留之前存储在该处的任何数据。空隙空间分析工具可以提取存储在空隙中的数据残留，这些残留可能具有某些证据价值。\n\
  \n恢复可能包括使用删除恢复工具，这些工具可以在文件被删除后将其恢复为正常文件——或者至少在包含数据的簇被存储到设备上的新文件覆盖之前。一旦已删除文件的部分被覆盖，删除恢复就无法完全还原或检索数据。\n\
  \n## 战略情报/反间报收集\n\n战略情报收集由调查和采访技巧组成，某些执法人员、军人员以及特定案件中获得授权的平民会使用这些技巧来发现可能与犯罪活动相关的信息。犯罪的证据并不总是是显而易见的，也不位于预期的位置。这需要经验丰富的调查员技能、专业知识和经验，以全新的眼光和灵活的方法论对待每项调查。尽管许多犯罪可能会产生类似的证据，但并非所有犯罪都与之前的调查一致。调查员在考虑调查期间如何寻找和检测额外证据时，考虑环境、技术、受害者、机会、技能水平和其他相关项目是非常重要的。\n\
  \n战略情报收集可以包括对犯罪事件的直接和间接证人进行更深入的采访。它可以包括评估嫌疑人或受害者执行的非标准程序（off-SOP）任务。它可以包括考虑物理物流、时间顺序和人性，以发现在使用受影响系统和环境进行僵化、突然或粗略调查时可能被忽略的新证据。\n\
  \n反间谍或反取证（anti-forensics）包括犯罪者为了减少相关证据或误导调查而可能采取的行动。这包括通过手术化编辑删除与犯罪活动相关的事件来清理日志文件，或者植入未发生的事件或无罪实体的虚假记录。系统破坏可用于删除证据以及标准的个人或业务数据。反取证还可能放置潜伏在文件、空隙空间或日志文件中的陷阱代码，并针对执法人员使用的标准调查和分析工具。此类植入代码可能会触发存储设备擦除、损坏读取活动、过载/DoS\
  \ 扫描工具、生成随机数据或尝试破坏分析系统。调查员必须小心确定犯罪者的技能水平，并注意可能使用了反取证技术的迹象。\n\n### 激活日志\n\n许多组织正意识到取证证据收集对于理解以及响应、检测和起诉安全违规有多么重要。为此，使用活动日志（active\
  \ logging）来收集和维护广泛的安全和系统相关事件。活动日志可能是对事件更彻底收集，也是为了取证调查目的保存和保留审计轨迹的更稳健手段，而不仅仅是为了整体系统管理和可用性优化。\n\
  \n## 跟踪工时\n\n在实施事件响应程序或取证调查的过程中，你应该记录终端用户以及事件响应/调查小组采取的每一个操作。这些文档将作为审计轨迹，用于追溯事件期间采取的行动和发生的事件。从事件文档中学习包括采取预防措施防止事件再次发生，更新安全策略和相关的程序文档，并评估事件对资产损失、损害和环境风险带来的整体影响。\n\
  \n在事件解决后，对事件细节和结果的披露应限制在授权方范围内。通常，授权方限于高层管理、法律团队和部分安全人员。\n\n审阅参与事件响应和调解的工时也很重要。这有助于判断事件的开销是否合理。此类信息可调整预算或响应策略。\n\
  \n## 考试要点\n\n**了解基础取证程序。** 取证是对犯罪证据的收集、保护和分析，以便在法庭上呈现事件事实。取证最关键方面之一是证据的初始收集和保护。为了使证据在法庭上被采用，你必须能够证明证据链没有被中断、证据已妥善保存且证据被正确收集。这还包括易失性顺序等问题、捕获系统映像、收集网络流量和日志、拍摄视频、记录时间偏移、截图、采访证人以及跟踪工时和费用。\n\
  \n**理解易失性顺序。** 在收集证据时，考虑数据和资源的易失性非常重要。易失性是指数据由于计算机系统的正常运行和时间的推移而发生更改或丢失的可能性。潜在证据的收集应根据事件、事故或犯罪类型以及易失性顺序进行优先级排序。\n\
  \n**理解证据链。** 证据链是一份记录了证据在整个生命周期内详细信息的文档。它从发现的时间地点开始，并标识谁发现了证据、谁保护了它、谁收集了它、谁运输了它、谁分析了。\n\
  \n**理解法律留存（legal hold）。** 法律留存是证据收集或电子发现过程中的早期步骤。它是向数据保管员发出的法律通知，要求保留特定的数据或信息，并必须尽力保留所指示的证据。\n\
  \n\n\n\n\n## 了解证据保护\n证据从发现的那一刻起到其生命周期结束，都应该保护免受篡改、损坏和损坏，该生命周期可能在提交法庭后结束。\n\n## 理解证据收集\n\
  证据收集是通过收集证据来确保证据安全的程序。这一过程通常被称为“装袋并标记（bag and tag）”。基本上，证据被收集起来、放入容器中并贴上标签，同时填写其监管链文件。收集证据是犯罪现场技术人员的责任。\n\
  \n## 掌握大数据分析\n大数据分析要求在大规模并行或分布式处理系统上运行高性能分析程序。\n\n## 5.6 解释灾难恢复和业务连续性概念。\n\n`risk`（风险）是指威胁利用漏洞的可能性或概率，可能导致资产受损等损失。`threat`（威胁）是由任何事物或任何人引起的潜在事件，并可能导致不理想的结果。洪水和地震等自然现象、员工的意外行为以及蓄意攻击都可以对组织构成威胁。`vulnerability`（漏洞）是指任何类型的弱点。这种弱点可能是由于缺陷、局限性或缺乏安全控制引起的。\n\
  \n风险管理试图通过实施控制措施或对策来减少或消除漏洞，或减少潜在威胁的影响。消除风险是不可能的，也不是理想的。相反，组织专注于减少可能造成最大的风险。理解风险管理概念对于建立充分的安全态势、适当的安全治理以及尽责责任和尽职调查的法律证明至关重要。\n\
  \n因此，管理风险是维持安全环境的要素。风险管理是一个详细的过程，包括识别可能损害或暴露数据的因素、根据数据价值和对策成本评估这些因素，并实施成本效益的解决方案来减轻或减少风险。风险管理的整体过程用于制定和实施信息安全策略。这些策略的目标是减少风险并支持组织的使命。\n\
  \n风险管理的主要目标是将风险降低到可接受的水平。该水平取决于组织、其资产价值、预算规模以及许多其他因素。对一个组织认为是可接受的风险，对另一个组织可能是是不合理的高水平。设计和部署一个完全无风险的环境是不可能的；但可以实现显著的风险降低，通常只需少少努力。\n\
  \nIT 基础设施的风险并非都是基于计算机的。事实上，许多风险来自非计算机源。在对组织进行风险评估时，应考虑所有可能的风险。未能正确评估和响应所有形式的风险将使公司处于脆弱状态。请记住，IT\
  \ 安全（通常称为`逻辑`或`技术`安全）只能针对逻辑攻击或技术攻击提供保护。为了保护 IT 免受物理攻击，必须建立物理防护。\n\n实现风险管理目标的过程被称为`risk\
  \ analysis`（风险分析）。它包括检查环境中的风险、评估每个威胁事件发生的概率以及如果发生将造成的损害成本、评估针对每种风险的各种对策的成本，并为保护措施创建成本效益报告以提交给高层管理。除了这些以风险为重点的活动外，风险管理还需要对组织内的所有资产进行评估、评价和赋值。没有适当的资产估值，就不可能根据可能的损失对风险进行排序和比较。\n\
  \n`业务连续性计划 (BCP)` 涉及对组织流程的各种风险进行评估，并制定政策、计划和程序，以最大限度地减少这些风险在发生时对组织可能产生的影响。BCP 用于在紧急情况下维持业务的连续运行。BCP\
  \ 规划者的目标是实施政策、程序和流程的结合，使得潜在的破坏性事件对业务的影响降最低。图 5.11 展示了 BCP 循环。\n\n![图 5.11 BCP 创建与维护生命周期\
  \ ](img/c05f011.jpg)\n\n**图 5.11** BCP 创建与维护生命周期\n\n您应该理解业务连续性计划与灾难恢复计划之间的区别。记住这种区别的一种简单方法是：BCP\
  \ 在先，如果 BCP 的努力失败，DRP 将介入填补空白。\n\n许多行业受到联邦、州和当地法律或法规的约束，这些法律要求他们实施不同程度的 BCP。我们在本章已经讨论了一个例子——上市公司的官员和董事有信义责任，在执行其业务连续性职责时履行尽职调查。在其他情况下，要求（以及失败的后果）可能会更加严重。应急服务（如警察、消防和急救医疗）对社区有在灾难发生时继续运营的责任。，在公共安全受到威胁的紧急情况下，他们的服务变得更加关重要。如果他们未能实施可靠的\
  \ BCP，可能会导致生命或财产的损失，以及民众对政府信任度的下降。\n\n`灾难恢复计划 (DRP)` 是整体安全管理计划的重要组成部分。灾难恢复是 BCP\
  \ 的扩展。基本上，当业务连续性中断时，灾难就发生了。最终，BCP 和 DRP 都依赖于适当的备份程序。\n\nDRP 是在业务功能因重大事件中断时使用的详细程序集合。当主站点无法支持业务功能时，启动灾难恢复计划。该计划概述了在主站点恢复正常运行期间，在备站点使业务关键功能运行的程序。\n\
  \n灾难恢复计划通过关键流程清单和优先级排序、风险分析和评估过程以及对资源依赖关系的详细检查来制定。\n\n\n\n\n\n你应当考虑设施所在位置的影响。例如，当地的犯罪率是多少？你离高速公路有多远？应急服务离多近？该地区是否处于洪泛区、易发生地震，或容易经历过度降雨或降雪？了解这些特征有助于设施的规划、设计以及选址。\n\
  \n在组织内部制定并实施了计划后，定期对计划进行演练或练习至关重要。就像消防演习一样，演练和练习灾难恢复计划可以培训人员在紧急情况下做什么，并暴露任何疏忽或遗漏。灾难恢复演练是组织长期成功至关重要的维护要素。\n\
  \nBCP 和 DRP 包含以下元素：\n\n- **风险分析与评估**：该元素包括对组织每个任务关键环节面临的风险进行列举，然后对风险进行定性和定量分析，以确定哪种风险是最为关键的。\n\
  - **业务影响分析**：你必须确定任何单独实现的风险将对业务连续性产生多大的负面影响，并计算最大可停机时间。\n- **风险缓解策略规划**：你需要确定可以使用哪些对措施、保护措施或响应措施来最小地减少风险的影响。\n\
  - **计划的集成与验证**：此步骤包括将计划落实用户的日常工作习惯中，将其整合到安全策略中，并通过高层批准和测试对其进行验证。\n- **培训与意识**：组织需要妥善地对用户在紧急情况下的响应和责任进行培训，并在培训期间之间保持意识。\n\
  - **计划的维护与审计**：你必须随着环境的变化定期更新计划，并不断监控环境、计划本身、测试以及有关计划的培训，寻找可以改进之处。\n\n`disaster\
  \ recovery`（灾难恢复）应涵盖组织的各个方面。灾难恢复计划侧重于业务流程的恢复。此外，DRP 鼓励部署冗余以防止停机。以下章节将讨论若干种冗余和 DRP\
  \ 方案。\n\n### 恢复站点\n\n全组织范围的安全恢复程序涉及使用备用站点——即一个业务可以移动并继续执行任务关键业务运营的次要位置。恢复站点被称为备用站点、备用处理站点、备份位置或次要位置。备用站点三个三个：热备、温备和冷备（Figure\
  \ 5.12`）。\n\n![FIGURE 5.12 Alternate site options ](img/c05f012.jpg)\n\n`FIGURE\
  \ 5.12` 备用站点选项\n\n#### 热备站点\n\n`hot site`（热备站点）是原始站点的实时、动态镜像。它包含一个完整的网络环境，并已完全安装和配置了实时业务数据。一旦原始站点由于灾难无法运行，就可以使用热备站点继续业务运营，而无需任何停机时间。\n\
  \n热备站点是最贵的类型，但它们提供的停机时间最少。因此，虽然它们是可靠的恢复手段，但并没有成本效益。热备站点具有极高的安全风险，因为实时业务数据同时存储在主站点和热备站点，且它们之间存在实时通信。此外，热备站点还需要专门的支持人员进行维护，并保持其与主站点一致。\n\
  \n#### 温备站点\n\n`warm site`（温备站点）是一个部分配置的备用站点，安装了大部分服务器和网络基础设施。在发生灾难时，需要一些最终的软件安装和配置，并且必须从备份集中恢复数据。温备站点可能需要几小时或一天的时间准备好进行实时操作，以支持业务的任务关键功能。温备站点成本适中，但如果组织能够承受几天的停机，那么它是恢复时一个现实的选项。\n\
  \n当你从备用站点（无论是热备、温备还是冷备）返回时，灾难可能仍在发生。由于原始站点在灾难后无法运行，热备站点可以继续支持业务的任务关键功能。温备站点可能需要几小时或一天的时间准备好进行实时操作，以支持业务的任务关键功能。（注：此处原文存在部分重复描述）\n\
  \n#### 冷备站点\n\n`cold site`（冷备站点）通常只是一个空房间。它可以是一个没有任何设备或通信的地点，也可以是一个配备设备和公用设施的站点。无论何种情况，它可能需要几周时间来设置和配置业务需求。冷备站点是最便宜的选项，但它没有提供现实的恢复希望。\n\
  \n### 恢复顺序\n\n`Order of restoration`（恢复顺序）是恢复工作进展的顺序。在大多数情况下，当灾难发生时，应首先恢复最关键的业务流程。然后，按重要性递减修复其他流程。\n\
  \n然而，这种顺序仅在最初处理主站灾难时使用，特别是在业务转移到第二个、备份或替代处理站点时。当主站灾难得到解决，组织模拟返回修复主站点的过程时，应表现极其谨慎——因为主站点已与灾难发生前不同。事实上，如果损坏严重，主站点现在实际上是一个恰好位于原主站设施的三级站点。因此，返回主站点应该是缓慢且有条理的，顺序应与应急响应期间遵循的顺序相反。应先将不关键的流程恢复到修复的主站点，然后是重要性不断增加的流程。这种方法让你在将关键流程提交给未测试系统之前，评估修复主站的稳定可靠性。\n\
  \n### 备份概念\n\n`backups`（备份）是业务连续性的重要部分，因为它们为数据文件的损坏或丢失提供了保障。所有安全人员的格铭应该是：备份、备份、备份。在发生丢失、中断、损坏、入侵、破坏、感染或灾难时，备份是数据资源唯一的保险手段。\n\
  \n必须测试备份以证明其可靠和可用。测试备份意味着从备份介质恢复数据以验证恢复可以进行。如果你不测试恢复过程，就没有保证备份是成功的。\n\n备份有三种主要的形式：\n\
  \n- **全量备份**：`full backup`无论归档位设置如何都将所有文件复制到备份介质上。它清除或重置归档位。\n- **增量备份**：`incremental\
  \ backup`仅复制具有设置或标记的归档位的文件。它清除或重置归档位，因此只选择新文件或已更改的文件。\n\n\n\n\n\n# 差异备份\n\n`differential\
  \ backup` 仅复制那些设置了或标记了归档位的文件。它不会更改归档位，因此只会选择新文件或发生过变化的文件。\n\n增量备份和差异备份通常与全备份配合进行。例如，可以在每周初开始执行一次全备份，然后在其余六天每天执行一次增量备份或差异备份。每日增量备份每天消耗的时间和存储空间大致相同，而差异备份的大小每天都会增加，且耗时也随之变长。在恢复时，首先使用全备份来恢复初始文件集；然后按时间顺序恢复所有增量备份，或者仅恢复最后一次差异备份，以获取文件的最新版本。\n\
  \n备份介质应安全地存储在异地，以防止其受到影响主站业务连续性的同一场灾难的损坏或销毁。它们应该存储在防火的保险箱、金库或保险箱中。备份完成后，应尽快将备份磁带移至异地，并确保备份磁带运输的安全。磁带应始终免受物理损坏、盗窃、篡改和破坏。\n\
  \n安全恢复和还原可确保任务关键型、敏感或受保护的服务器在灾难后以最小的损失或安全违规进行恢复。安全恢复确保受影响系统重启到安全状态，并在发生故障、失效或安全违规时打开且激活的所有资源都能得到恢复，并重新施加相应的安全限制。任何损坏的文件都将从备份中恢复，并重新应用其适当的安全标签。\n\
  \n备份的另一种选择是使用云作为存储介质。许多在线存储服务可供个人和企业进行云备份。云备份解决方案的一个示例是 `CrashPlan`（`[www.crashplan.com](http://www.crashplan.com)`）。这是我使用的云备份解决方案；它设计用于保护单台机器、家庭所有机器或中小型企业的众多系统的数据。它在更改保存后会非常快地对更改的文件执行自动的近实时备份。它还保留了一些文件的之前的版本，以便恢复文档的较早编辑版本或图像文件的未修改版本。然而，使用云备份需要高速数据连接。大多数本地备份解决方案传输数据的速度远快于在线备份。亚马逊提供了云备份解决方案，其中可能包括让一辆装满物理存储设备的拖车（命名为\
  \ `AWS Snowmobile`）驶向新客户所在地，进行初始数据拷贝，其处理能力高达 `100 PB`（拍字节，即 1,000 TB）。`100 Gbps`\
  \ 的本地光纤链路仅需 11 多天即可拷贝 `100 PB` 的数据，而通过 `1 Gbps` 连接传输则需要 20 多年。\n\n## 差异备份详情\n\n\
  请参阅上文“备份概念”章节获取差异备份类型的描述。\n\n## 增量\n\n请参上文“备份概念”章节获取增量备份类型的描述。\n\n## 快照\n\n快照通常与虚拟机（`VMs`）相关，虚拟机程序能够对活动客操作系统创建镜像。快照是\
  \ `VM` 的完整副本，与克隆硬盘需要几小时（通常必须离线执行）相比，创建只需要几分钟。创建快照后，可以客操作系统应用更改；如果更改不理想，可以快速恢复快照以将客操作系统返回之前的保存状态。\n\
  \n## 全备份\n\n请参上文“备份概念”章节获取全备份类型的描述。\n\n## 地理考量\n\n在制定业务连续性和灾难恢复计划时，您应该评估地理因素及其对准备和响应的影响。\n\
  \n### 异地备份\n\n备份策略应包括异地存储备份介质，以便在可能损害主业务运营的重大事件发生时提供可靠的还原和补救手段。本地备份对于解决次要问题（如驱动器故障和误删）很有用。由于主生产环境遭受严重损坏，只有异地备份才是可靠的恢复手段。\n\
  \n### 距离\n\n替代处理设施和异地备份存储地应与主站保持合理的距离。合理性是主观的，但它取决于资产的价值和面临的风险。通常，替代设施应该足够远，以至于不受损害主位置的同一灾难的影响——但又不能太远，以免让员工前往替代设施过于不便。如果前往替代地点需要超过\
  \ `3 小时`，则可能需要为员工提供住宿，以免他们每天在完成 `8 小时` 上班之外，还要额外通勤 `6 小时`。\n\n备份介质也应存储在远离主位置的地方，以免受同一灾难的侵害。\n\
  \n### 位置选择\n\n位置选择应考虑可访问性，例如通往设施的道路数量和大小、公用设施接入可靠性、当地犯罪率、当地危害以及自然灾害（如洪水、火灾、地震、飓风和龙卷风）影响该地区的可能性。这些问题中的每一个必须在设施的设计和建设中得到解决。\n\
  \n### 法律影响\n\n某些行业和个人组织可能受到法律法规的约束或限制，其主设施的所在地。这可能表现为必须留在国境或远离人口密集地区。某些规定包括对特定建筑内允许操作人数的限制、建筑要求或对当地建筑规范的补充，以及与机场、火车站或海港的距离。\n\
  \n### 数据主权\n\n数据主权是一个概念，即信息一旦转换为二进制格式并存储为数字文件，它就受存储设备所在地国家的法律约束。鉴于云计算的日益普及，如果您的行业法规要求数据留在原产国，或者存储地法律与您的原产国差异巨大，那么数据主权是一个重要的考虑因素。数据主权会对数据的隐私、机密性和可用性产生影响。\n\
  \n## 业务连续性规划\n\n`IT 应急计划`是一项专注于 IT 基础设施保护和/或恢复的计划。它通常是 `BCP` 或 `DRP` 的一部分，尽管也可以单独制定\
  \ IT 计划。IT 应急计划侧重于在灾难发生时提供 IT 服务的替代手段。这些计划可以包括备份，以及替代、备用和备份地点。\n\n`业务连续性规划` 包括安全策略的制定、`BCP`、`DRP`\
  \ 以及许多其他方面，旨在为最坏的情况做好准备，并尽可能避免停机和数据丢失的后果。\n\n\n\n\n\n继任计划（图 5.13）是识别和准备特定人员（通常是现有员工）的过程，这些人将根据需要替代关键领导层或关键岗位的人员。人员计划可能是由于已知的退休日期、计划中的公司离职或意外事件（如长期患病）。对于使用继任计划的组织的长期成功，对未来的继任替代者进行重点培训和开发至关重要。在某些情况下，继任计划侧重于用流程或服务替代人员，而不是用另一个人类来填充职位。\n\
  \n![图 5.13 继任计划](img/c05f013.jpg)\n\n图 5.13 继任计划\n\n### 练习题/桌面演习\n\n桌面演习是一种针对潜在紧急事件的讨论会议。它通常以口头形式或带有最少视觉辅助（蓝图、图表或代表资源的棋盘游戏模型）进行。这是一种在无压力的环境中演示和评估应急计划的手段。桌面演习也称为结构化演练。小组可以讨论应急响应或恢复计划的步骤，以明确角色、评估职责、发现缺陷、解决疏漏并构思替代方案。\n\
  \n### 行动后报告\n\nBRP、DRP 或 CSIRT 团队应在事件发生的一周内对事件进行事后审查或“行动后报告”（AAR），以确保事件中的关键人物分享他们的知识，并制定最佳实践，以协助未来的事件响应工作。AAR\
  \ 应该详细说明涉及的问题、尝试过的响应、成功的解决方案以及任何疏漏、错误或吸取的教训。这些报告对于为未来事件做准备、在法庭上辩护组织以及培训响应团队的未来成员非常有帮助。\n\
  \n### 故障转移\n\n使用冗余服务器是避免单点故障的另一个示例。冗余服务器是主服务器的镜像或副本，在主服务器上进行数据更改后立即接收所有更改。一旦主服务器发生故障，备用或冗余服务器可以立即接管并替代主服务器为网络提供服务。这种接管过程被称为故障转移。\n\
  \n故障转移系统可以是热备的或冷备的。热备是一个自动系统，通常可以几乎瞬间完成任务。冷备则需要管理员手动执行从主系统切换到备用系统的任务，因此通常涉及明显的停机时间。\n\
  \n冗余服务器可以位于与主服务器相同的服务器机室内，也可以位于异地。冗余服务器的异地部署提供了更高的安全性，使得损坏主服务器的灾难不太可能损坏异地的备用服务器。然而，由于托管成本以及支持镜像操作所需的实时通信链路，异地冗余服务器的成本更高。\n\
  \n### 备用处理站点\n\n参见前面的章节“恢复站点”。\n\n### 替代业务实践\n\n替代性业务实践是指在首选的恢复策略和计划程序失败时使用的任何次级、备份、回退或备用计划。备份应急计划是当主计划失败或执行效果未达到预期时的一种种替代解决方案或响应。\n\
  \n回退应急计划是在移动到备用处理位置后返回主站点的计划。由于主站点可能已严重损坏，以至于需要移动到备用位置，主站点需要进行大幅修复以支持业务运营。修复后的主站点在技术上是一个新系统，因此在迁移关键任务流程之前，需要对其进行仔细的弹性压力测试。\n\
  \n## 考试要点\n\n**理解风险。** 风险是威胁利用漏洞的可能性或可能性，导致诸如资产损害之类的损失。\n\n**了解业务连续性计划和测试。** 业务连续性计划（BCP）涉及评估组织流程的各种风险，并制定政策、计划和程序，以最大限度地减少这些风险发生时对组织可能的影响。BCP\
  \ 用于在应急情况下维持业务连续运行。\n\n**理解灾难恢复。** 灾难恢复计划是一系列详细程序，用于业务功能被重大事件中断的情况。当主站点无法支持业务功能时，将启动灾难恢复计划。该计划概述了让关键业务功能运行的程序。\n\
  \n**理解替代恢复站点。** 替代站点是业务可以移动并继续执行操作的辅助位置。替代站点有三个级别：热、温、冷。\n\n**理解继任计划。** 继任计划是识别和准备特定人员（通常是现有员工）的过程，这些人将根据需要替代关键领导层的人员。\n\
  \n**了解备份。** 备份是在数据发生丢失、中断、损坏、入侵、破坏、感染或灾难时数据的唯一保险手段。应该对备份进行测试以确保其可靠且可用。\n\n**了解常见的备份类型。**\
  \ 三种常见的备份类型是全备、增备和差异备。\n\n**理解异地存储的重要性。** 备份介质应安全地存储在异地，以防止受到影响主站点业务连续性的相同灾难的损坏或破坏。该地点应该是防火的保险箱、机库或保险箱。\n\
  \n**定义桌面演习。** 桌面演习是一种针对潜在紧急事件的讨论会议。这是一种在无压力的环境中演示和评估应急计划的手段。\n\n**理解备份/回退应急计划或政策。**\
  \ 备份应急计划在主计划失败或效果未达到预期时提供替代解决方案或响应。回退应急计划为组织从准备工作、合同或协议中做好准备。回退计划应考虑退出某些合同或签署协议可能产生的法律或财务后果。\n\
  \n\n\n\n\n`访问控制` 一术语指的是执行此类任务的系列控制措施，例如确保只有授权的用户可以登录（因此侧重于身份验证），以及防止未经授权的用户访问资源（因此侧重于授权）。这些控制措施可以降低各种信息安全风险。\n\
  \n在可能的情况下，你希望防止任何类型的安全问题或事件。当然，这并不总是可能的，意外事件总会发生。当这些事件发生时，你希望尽快检测到它们。而且一旦检测到事件，你就希望对其进行纠正。\n\
  \n在阅读这些控制描述时，请注意某些控制被列为多种访问控制类型的示例。例如，放置在建筑周围的围栏（或边界定义设备）可以是一种预防性控制（从物理上阻止人员进入建筑区域）和/或是一种威慑性控制（震阻他人尝试访问）。\n\
  \n### 威慑性\n\n`威慑性`访问控制用于威慑人员违反安全策略。威慑性控制和预防性控制相似，但威慑性控制通常取决于个人决定不采取意外行为。相比之下，预防性控制实际上会阻止该行为。威慑性访问控制的示例包括策略、安全意识培训、锁、围栏、安全证、警卫、人防门和安全摄像头。\n\
  \n`指令性`访问控制用于引导、限制或控制主体的行为，以强制或鼓励其遵守安全策略。指令性访问控制的示例包括安全策略要求或标准、张贴通知、逃生路线出口标志（图 5.14\
  \ ）、监控、监督和程序。\n\n![FIGURE 5.14 指示牌](img/c05f014.jpg)\n\n**图 5.14** 指示牌\n\n### 预防性\n\
  \n`预防性`访问控制用于阻止或停止意外或未经授权活动的发生。预防性访问控制的示例包括围栏、锁、生物识别、人防门、照明、报警系统、职责分离、岗位轮换、数据分类、渗透测试、访问控制方法、加密、审计、安全摄像头或\
  \ CCTV 的存在、智能卡、回拨程序、安全策略、安全意识培训、防病毒软件、防火墙和 IPS。\n\n### 检测性\n\n`检测性`访问控制用于发现或检测意外或未经授权的活动。检测性控制在事后运行，只有在活动发生后才能发现它。检测性访问控制的示例包括警卫、运动检测器、安全摄像头或\
  \ CCTV 拍摄事件的记录和审查、岗位轮换、强制休假、审计日志、蜜罐或蜜网络、IDS、违规报告、对用户的监督和审查以及事件调查。\n\n### 纠正性\n\n\
  `纠正性`访问控制在意外或未经授权的活动发生后修改环境使系统恢复正常。它试图纠正因安全事件而发生的任何问题。纠正性控制可以是简单的，例如终止恶意活动或重启系统。它们还包括可以删除或隔离病毒的防病毒解决方案、确保丢失数据可以恢复的备份和恢复计划，以及可以修改环境以停止正在进行的攻击的活动\
  \ IDS/IPS。该访问控制用于在违反安全策略后修复或恢复资源、功能和能力。\n\n`恢复性`控制是纠正性控制的扩展，但具有更高级或复杂的能力。恢复性访问控制的示例包括备份和恢复、容错驱动系统、系统映像、服务器集群、防病毒软件以及数据库或虚拟机镜像。\n\
  \n### 补偿性\n\n`补偿性`访问控制用于为其他现有控制提供各种选项，以协助执行和支持安全策略。它可以是用于另一种控制之外或替代另一种控制的任何控制。例如，组织策略可能规定所有\
  \ PII（个人身份信息）必须加密。审查发现预防性控制正在加密数据库中的所有 PII 数据，但通过网络传输的 PII 是明文发送的。添加补偿性控制来保护传输中的数据。\n\
  \n### 技术性\n\n控制可以通过行政、逻辑/技术或物理方式实施。之前提到的任何控制类型都可以包含这些类型。\n\n`技术性`或`逻辑`访问涉及用于管理访问和为资源提供保护的硬件或软件。正如名称所示，它使用了技术。逻辑或技术控制的示例包括用户名、密码、智能卡和生物识别、加密、限制接口、访问控制列表、协议、防火墙、路由器、IDS。\n\
  \n### 行政性\n\n`行政性`访问控制是组织安全策略和其他法规定义的策略和程序。它们有时被称为管理控制。这些控制关注人员和业务实践。行政性访问控制的示例包括策略、程序、招聘实践、背景检查、数据分类和标记、安全意识和培训工作、休假历史、报告和审查、工作监督、人员控制和测试。\n\
  \n### 物理性\n\n物理访问控制是你可以触碰的物品。它们包括用于防止、监控或检测直接接触系统或区域的物理机制。物理访问控制的示例包括警卫、围栏、运动检测器、锁门、密封窗户、灯光、电缆保护、笔记本锁、证、刷卡、警犬、摄像头、人防门和报警器。\n\
  \n## 考试要点\n\n**理解控制类型。** `访问控制`术语指的是执行此类任务的系列控制措施，例如确保只有授权的用户可以登录以及防止未经授权的用户访问资源。控制类型包括预防性、检测性、纠正性、威慑性、恢复性、指令性和补偿性。控制也可以根据实施方式进行分类：行政性、逻辑性或物理性。\n\
  \n\n\n\n\n安全策略应规定打印材料和用过的存储介质在使用寿命结束后应如何处理。打印材料的安全处置和销毁通常涉及粉碎和焚烧。计算机的安全处置和销毁通常关注于存储介质的安全处置和销毁（图\
  \ 5.15）。在这些物品被适当销毁后，它们不再对组织构成威胁。如果潜在的入侵者或攻击者在处置和销毁后获得了这些物品，他们将无法从中任何有用信息。事实上，适当的处置和销毁是针对翻找垃圾和搜寻的防御措施。\n\
  \n![图 5.15 存储介质类型](img/c05f015.jpg)\n\n`图 5.15` 存储介质类型\n\n如果介质对组织仍然有用但需要移除存储在介质上的数据，可以使用介质或数据清理过程。使用清理过程的原因是删除和格式化不足以从存储设备中删除数据。删除和格式化仅从目录结构中删除文件条目，并将相关的存储簇标记为可用；这些过程并不会真正删除数据。只有当其他数据覆盖了旧数据时，旧数据才将无法访问或取回。在覆盖之前，取消删除操作可以恢复文件。任何可以被恢复的残留数据都可以称为数据残留。适当的清理过程将移除任何和所有数据残留，以防止任何形式的恢复。\n\
  \n传统的磁性介质，如旋转式硬盘驱动器（HDD），会优先覆盖外部或低编号轨道的区域，而不是内部或高编号轨道的区域。因此，内部轨道上被删除的数据留可用于删除恢复的时间可能比外部轨道上的文件长得多。固态硬盘（SSD）或闪介质使用磨损平衡过程，该过程试图在整个可用存储容量均匀地使用每个存储单元。这导致被删除的数据在硬盘的所有可用空闲空间被（至少一次）使用且写入操作“环绕”并最终覆盖被删除的单元之前，仍然保持可用于删除恢复。\n\
  \n一旦存储设备对组织不再有用，唯一的安全处置方法是某种形式的物理销毁。这些方法可以包括焚烧、酸浴和粉碎。剩余的碎片应由经过认证的回收服务处理，这些服务将尝试回收可用的金属并妥善处置任何有害或毒性材料。\n\
  \n通常认为有三个数据残留管理级别：清理、净化和销毁。清理（Clearing）是任何数据破坏技术，仅防止任何标准或常用的手段恢复数据残留，例如使用原生文件查看器查看文件系统或从回收站或影子副本服务中恢复数据。净化（Purging）是任何数据破坏技术，试图防止高级或实验室级的数据残留恢复技术恢复数据的访问。销毁（Destruction）是任何使存储设备本身物理性损坏到无法使用的数据破坏技术。\n\
  \n#### 焚烧\n\n焚烧或熏化可以是销毁纸质以及介质存储设备的有效手段。应注意处理焚烧硬件时可能产生的任何毒烟，剩余材料可以进行回收。当设备被焚烧时，会阻止任何数据残留的恢复。焚烧被认为是一种数据销毁技术。\n\
  \n#### 粉碎\n\n粉碎是一种有效的销毁技术。粉碎对于纸质和介质存储设备来说都是有效的销毁技术；但在所有情况下可能都不十分。粉碎通常使用横切切割，产生不大于\
  \ `1/8` 英寸（`4 mm`）的碎片。然而，存在碎屑被重新组装的风险，因此在高度安全的情况下可能不充分。粉碎可以被视为数据清理或净化技术。介质粉碎是一种将设备还原为碎片的破坏方法。当设备被粉碎时，会阻止任何数据恢复。粉碎被认为是一种数据销毁技术。\n\
  \n#### 纸浆\n\n造浆是一种涉及将纸与液体混合形成纤维浆的数据破坏过程。这对于纸质文件是有效的，但不适用于介质存储设备。当文档被造浆时，纸浆可以制成新产品，如纸板、硬板、起始材料或砖。然而，它在所有安全环境中可能都不十分。被造浆的文档无法恢复。造浆被认为是一种数据销毁技术。\n\
  \n#### 粉化\n\n粉化是一种设备销毁方法，其程度超过了粉碎，将设备还原为颗粒或粉末。当设备被粉化时，会阻止任何数据恢复。粉化被认为是一种数据销毁技术。\n\
  \n#### 消磁\n\n消磁是一使用利用强磁场进行存储设备数据销毁的方法。它仅对硬盘和磁带等磁性介质有效；对于光盘、SSD 和闪存卡等其他形式的介质无效。然而，由于使用磁场进行数据销毁不会留下可见痕迹，它并不总是能够防止数据恢复。磁力可能应用得不正确、强度不够，或者操作时间不够长。消磁不应被视为可靠的数据销毁手段。然而，它可能允许设备在相同环境中重复使用。消磁被认为是一种数据清理（无效时）或净化（有效时）技术。\n\
  \n#### 净化\n\n净化似乎被用作数据破坏过程水平或质量的参考，而不是应遵循的实际程序。请参见前文“数据销毁和清理”节末的讨论。\n\n#### 擦除\n\
  \n数据擦除是从存储设备中移除数据的过程。其通常目的是防止恢复会导致数据泄露的数据残留。擦除也被称为净化或清理。擦除程序可以包括消磁、随机数据覆盖和零化（即在存储设备上的每个位置写入零）。然而，这些技术仅提供了在相同环境中使用存储设备所需的足够数据删除。没有保证的擦除过程可以在较低安全的环境中完全安全地使用设备。擦除可以被视为数据净化或销毁技术。\n\
  \n\n\n\n\n`Classification` 是对对象（资产、数据、信息等）赋予敏感性标签，并对主体（用户）赋予安全许可标签的过程。在资源被分类后，IT\
  \ 基础设施和所有用户都应该阅读并尊重分配的标签。因此，每个对象都能获得其所需的安全性。\n\n数据分类是根据数据对秘密性、敏感性或机密性的来保护数据的主要手段。在设计和实施安全系统时，对所有数据一视为同的，因为某些数据项比其他数据需要更多的安全。在低安全级别保护所有内容意味着敏感数据很容易被访问。在高安全级别保护所有内容则成本过高，并且限制了对未分类、非关键数据的访问。数据分类用于确定投入多少精力、资金和资源来保护数据并控制其访问。\n\
  \n数据分类方案的主要目标是根据分配的重要性和敏感性标签，将保护数据的过程形式化和分层化。数据分类用于为存储、处理和传输数据提供安全机制。它还涉及如何从系统中移除数据并销毁数据。\n\
  \n## 使用数据分类方案的好处\n\n- 它体现了组织保护宝贵资源和资产的承诺。\n- 它有助于识别对组织最关键或最有价值的资产。\n- 它为保护机制的选择提供了信誉。\n\
  - 它通常是监管合规或法律限制的要求。\n- 它有助于定义访问级别、授权使用的类型，以及对不再具有价值的资源进行去密和/或销毁的参数。\n\n## 数据分类标准\n\
  \n分类标准取决于执行分类组织而异。然而，你可以从常见或标准的分类系统中得出许多通用性：\n\n- 数据的实用性\n- 数据的及时性\n- 数据的价值或成本\n\
  - 数据的成熟度或年龄\n- 数据的寿命（或过期时间）\n- 与人员的关系\n- 数据泄露损害评估（即数据泄露将如何影响组织）\n- 数据修改损害评估（即数据修改将如何影响组织）\n\
  - 数据对国家安全的影响\n- 对数据的授权访问（即谁有权访问数据）\n- 对数据的限制（即谁被限制访问数据）\n- 数据的维护和监控（即谁应该负责维护和监控数据）\n\
  - 数据的存储\n\n使用适用于组织的任何标准对数据进行评估，并为其分配适当的数据分类标签。在某些情况下，标签被添加到数据对象中。在其他情况下，标签仅通过将数据放入存储机制或置于安全保护机制之后分配。\n\
  \n## 实现分类方案\n\n要实施分类方案，你必须执行七个主要步骤或阶段：\n\n1. 识别保管员，并定义其职责。\n2. 指定评估标准——信息将如何被分类和标记。\n\
  3. 对每种资源进行分类和标记。（所有者执行此步骤，但主管应对其进行审核。）\n4. 记录发现的任何违反分类政策的异常，并将其整合到评估标准中。\n5. 选择将应用于每个分类级别的安全控制措施，以提供必要的保护级别。\n\
  6. 指定资源的去密程序以及将资源保管权转移给外部实体的程序。\n7. 创建企业范围内的意识培训计划，向所有人员介绍分类系统。\n\n在设计分类系统和编写使用程序文档时，去密往往被忽视。一旦资产不再值得或需要当前分配的分类或敏感性级别的保护，就需要进行去密。当资产未能按需要进行去密时，安全资源就会被浪费，高敏感性层级的价值和保护水平也会降低。\n\
  \n## 分类方案\n\n两种常见的分类方案是政府/军事分类和商业业务/私营部门分类。如图 5.16 所示，有五级政府/军事分类（此处从高到低列出）。\n\n\
  ![图 5.16 分类级别](img/c05f016.jpg)\n\n图 5.16 分类级别 \n\n- **机密 (Top Secret)**：最高分类级别。未经授权披露机密数据将产生剧影响并对国家安全造成严重损害。\n\
  - **秘密 (Secret)**：用于具有限制性质的数据。未经授权披露分类为秘密的数据将产生重大影响并对国家安全造成致命性损害。\n- **机密 (Confidential)**：用于机密性质的数据。未经授权披露分类为机密的数据将产生明显影响并对国家安全造成严重损害。此分类用于秘密与“敏感但未分类”之间的所有数据标签或分组。\n\
  - **敏感但未分类 (Sensitive but Unclassified)**：用于具有敏感或隐私性质的数据，但其泄露不会造成重大损害。\n- **未分类\
  \ (Unclassified)**：最低分类级别。用于既不敏感也不分类的数据。未分类数据的泄露不会损害机密性或造成任何明显损害。\n\n机密、秘密和绝密分类被统称为或标记为\
  \ `classified`（机密）。通常，向未经授权的人员透露数据的分类是对该数据的违反。因此，“机密”（classified）一词通常指任何排名高于“敏感但未分类”级别的数据。所有机密数据都免于《信息自由法》以及许多其他法律法规。\n\
  \n美国军事分类方案最关注数据的敏感性，并侧重于机密性的保护（即防止泄露）。你可以根据发生机密性违规时造成的损害程度粗略定义每个分类级别或标签。绝密级的数据的数据将对国家安全造成严重损害，而未分类级别的数据则不会对国家或局部安全造成任何严重损害。\n\
  \n商业业务/私营部门分类系统差异很大，因为它们通常不需要遵守标准或法规。例如，这里有四种可能的业务分类级别（按安全性从高到低列出）：\n\n- **机密 (Confidential)**：最高分类级别。用于极其敏感且仅供内部使用的数据。如果泄露了机密数据，可能会对公司产生重大负面影响。有时用\
  \ `proprietary`（专利）标签代替 `confidential`。\n- **隐私 (Private)**：用于具有隐私或个人性质且仅供内部使用的数据。如果泄露了隐私数据，可能会对公司或个人产生重大负面影响。\n\
  - **敏感 (Sensitive)**：用于比公开数据更分类的数据。如果泄露了敏感数据，可能会公司产生负面影响。\n- **公开 (Public)**：最低分类级别。用于所有不属于较高分类类别的数据。其泄露不会对组织产生严重的负面影响。\n\
  \n\n\n\n\n`need-to-know`（知情需要）安全策略通过对安全域内的资源、对象或数据进行分区域，来授予和限制访问权限。分区域的资源可能位于更大的分类分组中。要获得分区域项目的访问权限，主体（用户）必须获得或证明其“知情需要”——即根据分配的工作任务访问某项资源的必要性。如果没有“知情需要”策略，即使是具有足够安全许可范围的用户，此类数据也会被限制查看。这种形式的访问控制用于强制访问控制（MAC）环境，类似于在自主访问控制（DAC）环境中使用的最小特权原则。\n\
  \n虽然政府/军事术语和业务分类分级很有用，但也可以使用通用的术语。以下是一些常见的替代分类术语：\n\n- **High（高）**：高、中、低可以作为分类的通用引用，而不是使用政府/军事术语。“高”相当于“绝机密”（top\
  \ secret）。\n- **Medium（中）**：此级别在政府/军事术语中接近“机密”（classified）。\n- **Low（低）**：此级别在政府/军事术语中接近“非机密”（unclassified）。\n\
  - **Confidential（机密）**：机密涉及业务分类方案中价值最高且最敏感的数据级别。\n- **Private（私密）**：私密涉及业务分类方案中与个人相关的数据（PII）。参见前面的“信息分类”章节。\n\
  - **Public（公开）**：公开涉及业务分类方案中最不敏感的数据级别。参见前面的“信息分类”章节。\n\n## Confidential（机密）\n请参见“数据敏感性标记与处理”章节中之前的讨论。\n\
  \n## Private（私密）\n`Private` 是一种可以在各种背景和许多用途的数据分类标签。尽管大多数人认为它关注的是与其个人身份相关的保护，但它也可以指员工和客户的集体数据。某些组织甚至可能扩大定义，包含任何仅供内部使用的信息，这些信息实际上更属于业务机密而非私密。\n\
  \n隐私政策规定了组织内部隐私的保护或缺乏保护。然而，`privacy` 可能是一个难以定义的实体。该术语在许多语文中被频繁使用，但没有进行量化或限定。以下是关于隐私的一些可能的局部定义：\n\
  \n- 主动防止未经授权访问可识别身份的信息（即可以直接链接到个人或组织的数据点）\n- 免受未经授权访问被视为个人或机密的信息\n- 免受在未经同意或知情的情况下被观察、监控或检查\n\
  \n在 IT 领域处理隐私问题时，它通常变成了个人权利与组织权利或活动之间的平衡。一些人声称，个人有权控制是否可以收集关于自己的信息以及对这些信息可以进行什么处理。这通常涉及到个人身份信息（PII）的问题。`PII`\
  \ 是任何可以容易地和或明显追溯到原始人员或相关人员的数据项。\n\n另一些人声称，在公共视野下进行的任何活动（例如在互联网上进行的大多数活动或在公司设备上进行的活动）都可以在被监控者不知情或未经许可的情况下监控，且从此类监控中收集的信息可以用于组织认为适当或理想的任何用途。\n\
  \n一方面，保护个人免受不受的观察、直接营销以及私密、个人或机密细节的披露被认为是一项值得的努力。另一方面，组织声称人口统计、信息采集和定向营销改进了业务模式，减少了广告浪费并为各方节省了资金。\n\
  \n无论你对在线隐私问题的个人或组织立场如何，都应该在组织政策中解决。隐私问题不仅涉及你在线服务的外部访问者，还涉及你的客户、员工、供应商和承包商。如果你收集了关于任何个人或公司的任何信息，你就必须处理隐私。\n\
  \n在大多数情况下，特别是隐私被违反或限制时，必须通知个人和公司；否则，你可能会面临法律后果。允许或限制个人使用电子邮件、保留电子邮件、记录电话通话、收集有关浏览或消费习惯的信息等方面，也必须处理隐私问题。\n\
  \n## Public（公开）\n请参见“数据敏感性标记与处理”章节中之前的讨论。\n\n## Proprietary（专有）\n请参见“数据敏感性标记与处理”章节中之前的讨论。\n\
  \n## PII（个人身份信息）\n`Personally identifiable information (PII)` 是任何追溯到采集它的人类的数据项。与医疗相关的\
  \ `PII` 受 `HIPAA` 法律保护。然而，在美国，大多数 `PII` 通常并不受到保护。公司应在接受使用政策（`AUP`）中明确披露收集了哪些 `PII`\
  \ 以及将如何使用它们。\n\n`Privacy` 是用户在系统中被赋予的机性和隔离级别。大多数用户错误地认为他们在公司电脑上拥有隐私。`Privacy` 假设所进行的活动和通信对其他人隐藏，或者至少保护其不被预期接收者之外的人查看。然而，公司财产上的任何活动对网络的审计和监控组件都不是隐藏的。正如之前提到的，无论公司对隐私的立场如何，这些都必须在隐私政策中详细说明并披露。\n\
  \n## PHI（受保护的健康信息）\n根据美国法律，`Protected Health Information (PHI)` 是任何与健康状况、医疗服务使用、医疗付费以及与个人健康有关的其他收集信息相关的数据。美国《健康保险可流动性与责任法》（`HIPAA`）将\
  \ `PHI` 定义为与 18 类信息相关，这些信息必须安全处理以防止泄露和误用。这 18 个元素是：\n\n- 姓名\n- 小于州的所有地理标识符（因此地址、城市和邮政编码受保护）\n\
  - 与个人直接相关的日期（年份除外）\n- 电话号码\n- 传真号码\n- 电子邮件地址\n- 社会安全号码\n- 医疗记录号\n- 健康保险受益人号码\n-\
  \ 账号\n- 证书/执照号码\n- 车辆标识符和序列号\n- 设备标识符和序列号\n- Web URL\n- IP 地址码\n- 生物识别标识符\n- 照片\n\
  - 任何其他唯一标识码、特征或代码，但采集实体为数据编码而分配的唯一代码除外\n\n此类数据通常用于统计分析和社区健康评估，但在这些情况下，数据必须经过匿名化或去标识化。匿名化是通过删除或更改\
  \ `PHI` 项目来实现的，以防止将数据追溯到原始源或个人。去标识化是通过专门从 `PHI` 中删除这 18 个 `HIPAA` 元素来实现的。`HIPAA`\
  \ 和其他立法规定了收集、存储和使用 `PHI` 的严格参数范围。\n\n### Data roles（数据角色）\n数据角色在前面的“基于角色的意识培训”章节中讨论。\n\
  \n## Owner（所有者）\n请参见“基于角色的意识培训”章节中之前的讨论以及侧边“用户、所有者、保管人”。\n\n## Steward/custodian（管理员/保管人）\n\
  请参见“基于角色的意识培训”章节中之前的讨论以及侧边“用户、所有者、保管人”。\n\n## Privacy officer（隐私官）\n\n\n\n\n\n隐私专官（Privacy\
  \ officer）是公司的高管，负责制定公司隐私政策、实施该政策并监督其运行和管理。隐私专官的目标是确保与员工和客户相关的个人数据得到妥善的处理和保护。\n\n\
  ### 数据留存\n\n`retention policy`（留存策略）定义了需要维护哪些数据以及持续多久。策略定义了`data retention`（数据留存）的参数和操作。留存策略可能还需要定义持有数据的目的、保护这些数据实施的安全措施，以及被授权访问或处理这些数据的组织人员。各种行业法规以及合同义务可能对某些类型的数据规定最短留存时间。\n\
  \n`storage policy`（存储策略）定义了存储设备长期存放的手段、机制和位置。目前没有任何存储设备技术是永久的，因此你必须计划提供一个能够维持最佳环境（在热量、光线、湿度、震动等方面）和可靠安全性的存储设施。如果数据留存时间超过了存储设备的预计寿命，那么一套将数据从旧存储设备传输到新设备的程序的程序也是必关重要的。\n\
  \n### 法律与合规\n\n每个组织都需要验证其业务和政策是合法的，并符合其陈明的安全策略、行业义务和法规。审计对于`compliance testing`（合规性测试，也称为`compliance\
  \ checking`（合规检查）是必要的。验证系统是否符合法律、法规、基准、指南、标准、最佳实践和政策，是维护任何环境中安全的重要部分。合规性测试确保安全解决方案的所有必要和要求元素都正确部署并按预期运行。合规检查可以采取多种形式，例如漏洞扫描和渗透测试。它们还可以使用日志分析工具来确定系统上是否针对已部署应对措施的漏洞尝试了攻击或利用。\n\
  \n## 考试要点\n\n了解数据标记、处理和处置。标记是分类系统的一部分，用于指导安全，特别是在访问、处理和处置的领域。\n\n理解数据销毁和介质净化的概念。通常认为有三个级的数据残留管理水平：清除（clearing）、净化（purging）和销毁（destruction）。你应该考虑介质净化的多种选项，包括烧毁、粉碎、造纸、粉化、去磁和擦除。\n\
  \n定义信息分类。分类是为对象（资产、数据、信息等）贴上敏感性标签，并为主体（用户）贴上许可标签的过程。资源被分类后，IT 基础设施和所有用户应阅读并尊重分配的标签。因此，每个对象都能获得其所需的安全性。\n\
  \n理解隐私政策的目标。隐私政策的目标是保护个人身份信息（PII）的机密性。\n\n理解保护 PII 的必要性。个人身份信息（PII）是任何可以追溯到来源人类的数据项。与医疗相关的\
  \ PII 受 HIPAA 法律保护。然而，在美国，大多数 PII 并不受到通用的保护。公司应在接受使用政策（AUP）中明确说明收集了哪些 PII 以及将如何使用它们。\n\
  \n理解对法律、最佳实践和标准的合规性。审计通常用于合规性测试，也称为合规检查。验证系统是否符合法律、法规、基准、指南、标准、最佳实践和政策，是维护任何环境中安全的重要部分。合规性测试确保安全解决方案的所有必要和要求元素都正确部署并按预期运行。\n\
  \n### 复习题\n\n你可以在附录中找到答案。\n\n1. 下面哪种风险评估公式代表了公司由于资产的特定风险在一年内可能经历的总潜在损失？\n    1.\
