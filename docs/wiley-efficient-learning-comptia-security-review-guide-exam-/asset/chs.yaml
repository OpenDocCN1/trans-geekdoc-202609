  \    - SNMPv3\n    - SSL/TLS\n    - HTTPS\n    - 安全 POP/IMAP\n- 用场景\n    - 语音和视频\n\
  \    - 时间同步\n    - 电子邮件和网页\n    - 文件传输\n    - 目录服务\n    - 远程访问\n    - 域名解析\n   \
  \ - 路由与交换\n    - 网络地址分配\n    - 订阅服务\n\n![images](img/clogo.jpg) Security+ 考试将测试你对家庭办公室和企业环境中安全技术及工具的知识。以通过测试并有效地实施安全措施。\n\
  \n\n\n\n遵循“首次匹配”（first-match）方法的防火墙应该拥有一条最终的“拒绝所有”（deny all）规则。因此，任何不符合之前的允许或拒绝规则的数据包都会被丢弃。采用“混合方法”（amalgamation\
  \ approach）的防火墙则没有显式的拒绝规则；相反，它们拥有一种隐式拒绝立场，即任何未被特定允许的数据包都会被丢弃。\n\n因此，如果数据包未能满足允许规则的标准，将应用丢弃选项。通过这种方式，只有符合自定义允许过滤器或规则的数据包才允许跨越安全屏障。换句话说，防火墙是默认拒绝（deny-by-default）或隐式拒绝的安全工具。\n\
  \n防火墙有四种基本类型：\n\n### 包过滤防火\n`packet filter firewall`（包过滤防火墙）根据网络数据包头中的基本标识项来过滤流量。这包括源和目的\
  \ IP 地址、端口号以及使用的协议。包过滤防火墙工作在开放系统互连（OSI）模型的网络层（`Layer 3`）和传输层（`Layer 4`）。\n\n###\
  \ 话电路级网关\n`circuit-level gateway firewall`（电路级网关防火墙）通过过滤内部信任主机与外部不信任主机之间的连接来过滤流量。这种监控发生在\
  \ OSI 模型的网络层（`Layer 3`）或会话层（`Layer 5`）。这种类型的防火墙确保了用于建立和维护电路（虚拟电路或会话）的数据包是有效的并被正确使用的。一旦电路级网关允许了连接，就不会再对该通信进行进一步的过滤。\n\
  \n### 应用级网关\n`application-level gateway firewall`（应用级网关防火墙）根据用户访问、组员身份、使用的应用程序或服务，甚至是传输的资源类型来过滤流量。这种类型的防火墙工作在\
  \ OSI 模型的应用层（`Layer 7`）。此类防火墙可以被称为 `proxy`（代理）。应用级网关侧重于特定设备和协议组合的方面，以及会话的内容。应用感知防火墙为特定应用程序提供过滤服务。\n\
  \n### 状态检测防火墙\n`stateful inspection firewall`（状态检测防火墙）感知到任何有效的出站通信（特别是与 `TCP` 的）将触发外部实体的相应响应或回复。因此，这种类型的防火墙会根据响应动态地创建一个响应规则。但该规则仅在会话进行期间存在。这与静态包过滤防火墙不同，后者要求始终定义出站规则和入站规则。\n\
  \n此外，状态检测防火墙可以保留会话中之前数据包的知识，以便检测那些在仅评估单个数据包时无法察觉或检测到的非预期或恶意流量。这被称为 `context analysis`（上下文分析）或\
  \ `contextual analysis`。\n\n状态检测防火墙可能还会执行深度包检测，即对数据包载荷或内容的分析。这甚至可能包括通过跨多个数据包的重组合对原始（或最终）载荷进行虚拟重组。\n\
  \n因此，状态检测防火墙可以根据高阶信息做出更智能、更复杂的过滤决策。这种防火墙的关键功能之一是确保每个数据包都是已建立的传输控制协议（`TCP`）通信会话的一部分。所有异常或未关联的数据包都会被拦截。\n\
  \n### 防火墙策略与部署\n\n有效设计、部署和实施防火墙的第一步是设计或开发 `firewall policy`（防火墙策略）：这是一种关注组织内防火墙目的、用途、功能和安全的安全策略。该策略明确定义了防火墙应如何过滤流量，以及应该被拦截或允许的流量类型。\n\
  \n大多数防火墙在部署时至少有两个网络接口。此类防火墙被称为 `dual-homed`（双宿主机，参见图 2.2）或 `multihomed`（多宿主机，针对两个或多个\
  \ `NICs`）。双宿或多宿主机防火墙在网络之间提供了清晰的安全区分；因此，数据包必须成功通过防火墙的过滤器才能从一个网络移动到另一个网络。通过这种方式，防火墙提供了强大可靠的安全保障。\n\
  \n![图 2 一个隔离两个网络的双宿主机防火墙](img/c02f002.jpg)\n\n**图 2.2**](#c02.xhtml#figureanchor2-2)\
  \ 隔离两个网络的双宿主机防火墙\n\n具有三个或更多网络接口的防火墙可以同时管理多个网络的访问。常见的部署使用这些额外网络接口之一连接到非军事化区（`DMZ`）。`DMZ`\
  \ 托管公共访问的服务器，例如 Web 或文件传输协议（`FTP`）。防火墙为 `DMZ` 提供安全但公共访问，但防止了对私有网络的未经访问。如果这种多宿主机防火墙被破解，只有\
  \ `DMZ` 中的系统会直接受到威胁或暴露。\n\n当防火墙中的端口开启以允许虚拟专用网络（`VPN`）连接发生时，请记住所有加密数据将通过防火墙而不经过检查或过滤。除非防火墙能够看到未加密的数据（例如作为\
  \ `VPN` 终止点），否则它无法检查通信，因此无法提供过滤安全。\n\n`ingress filter`（入站过滤器）是针对外部进入安全区域的数据包（即入站通信）的流量过滤器。`egress\
  \ filter`（出站过滤器）是针对离开安全区域进入外部的数据包（出站通信）的流量过滤器。常见的入站和出站过滤器执行以下功能：\n\n*   拦截声称具有内部源地址的入站包\n\
  *   拦截声称具有外部源地址的出站包\n*   拦截源地址或目的地址位于黑名单（已知恶意 `IPs` 列表）的数据包\n*   拦截源或目的地址来自局域网（`LAN`）但尚未正式分配给主机的数据包\n\
  \n根据组织需求和基础设施设计，会在这些常见的防欺骗和常识保护基础上添加额外的防火墙规则。\n\n#### ACL\n`Access control list\
  \ (ACL)`（访问控制列表）术语通常用于对象权限和特权的上下文中，但也用于防火墙。防火墙上的规则或过滤器可以被称为 `ACLs`。大多数云解决方案或托管系统使用基于\
  \ `ACL` 的方法，而不是传统的防火墙。\n\n#### 应用型与网络型\n`application firewall`（应用防火墙）是一种设备、服务器插件、虚拟服务或系统过滤器，它为服务和所有用户定义了严格的通信规则。它的目的是特定的应用程序服务器端防火墙，以防止特定的协议和载荷攻击。`web\
  \ application firewall`（Web 应用防火墙）是应用防火墙的一个示例。它的目的是特定的应用程序防火墙，防止跨站脚本、SQL 注入和其他 Web\
  \ 应用攻击。\n\n`network firewall`（网络防火墙）是一种硬件设备，通常称为 `appliance`（设备），用于通用网络过滤。网络防火墙旨在为整个网络提供广泛的保护。\n\
  \n这两种类型的防火墙都很重要，并且许多情况下都是相关的。每个网络都需要网络防火墙。许多应用程序服务器都需要应用防火墙。然而，使用应用防火墙通常并不会抵消对网络防火墙的需求。你应该串联使用这两种类型以互补，而不是将它们视为竞争性的解决方案。\n\
  \n#### 有状态与无状态\n\n\n\n\n\n`无状态防火墙`（stateless firewall）根据过滤 ACL（访问控制列表）对每个数据包进行逐一分析。通信的上下文（即任何之前的数据包）不会用于对当前数据包做出允许或拒绝的决策。`有状态防火墙`（stateful\
  \ firewall）监控通信的状态或会话；在对当前数据包做出允许或拒绝决策时，它会评估之前的数据包以及可能的其他通信和条件。有状态防火墙会考虑通信上下文，而无状态防火墙则不会。\n\
  \n## 隐式拒绝 (Implicit deny)\n\n`隐式拒绝`（Implicit deny）是默认的安全立场，确保任何未被明确授予访问或权限的通信默认都被拒绝访问。默认拒绝语句在权限管理系统中是隐式的，不需要特意定义。这在基于“首项匹配应用”原则运行的防火墙和路由器访问规则集上可能不同。在这种情况下，默认的拒绝所有规则作为最后一条规则包含在内。当不存在显式的允许或拒绝规则时，隐式拒绝是默认响应。在防火墙语境下，所有规则被视为针对流量的整体，因此不需要定义显式的拒绝所有规则，因为如果流量不符合允许规则，它将被隐式拒绝拦截。\n\
  \n## VPN 集中器器 (VPN concentrator)\n\n`虚拟私有网络 (VPN)` 是跨越中间网络的两个实体之间的通信`隧道`（tunnel）。在大多数情况下，中间网络是不可信的网络（如互联网），因此通信隧道也是加密的。VPN\
  \ 将在第 3 章“架构与设计”中的“隧道/VPN”部分进行进一步讨论。\n\n`VPN 集中器器`（VPN concentrator）是一种专用硬件设备，旨在支持大量的并发\
  \ VPN 连接（通常为数百个或数千个）。它为安全的 VPN 连接提供高可用性、高可扩展性和高性能。随着对安全通信需求的日益增长，VPN 已成为保护跨越私有网络和互联网通信的重要工具。\n\
  \nVPN 集中器器也可以称为 VPN 服务器、VPN 网关、VPN 防火墙、VPN 远程访问服务器 (RAS)、VPN 设备、VPN 代理或 VPN 终端。\n\
  \n### 远程访问与站点对站点 (Remote access vs. site-to-site)\n\n`远程访问 VPN`（remote access VPN）是`站点对\
  \ VPN`（site-to-site VPN）的变体。区别在于，在远程访问 VPN 中，一个端点是连接到组织网络的远程用户的单一实体。远程访问 VPN 也称为主机到站点\
  \ VPN（host-to-site VPN）。站点对站点 VPN 是两个组织网络之间的 VPN。远程访问 VPN 和站点对站点 VPN 都被称为隧道模式 VPN，它们提供链路加密。这意味着它们仅在流量位于隧道内部时才提供加密。在这两种类型的隧道模式\
  \ VPN 中，在作为站点或组织网络的 VPN 这一侧，离开隧道的流量将恢复为明文以穿越私有网络。\n\nVPN 的另一种主要类型是传输模式 VPN（transport\
  \ mode VPN）。它提供端到端加密，可以被描述为主机到主机 VPN。在这种类型的 VPN 中，所有流量在端点之间完全加密，但这些端点只是单个系统，而不是组织网络。\n\
  \n## IPSec\n\n`IP 协议安全 (IPSec)` 是一种源自 IPv6 安全功能的 IPv4 VPN 协议。你可以在拨号连接或网络到网络连接中使用\
  \ IPSec。当用于拨号连接时，它通常作为 L2TP 链路中的加密协议。IPSec 本身更适用于跨越普通 LAN 链路、高速 WAN 链路和互联网的网络到网络连接。\n\
  \nIPSec 不是单一协议，而是多个协议的集合。IPSec 的两个主要协议是`认证头 (AH)` 和`封装安全载荷 (ESP)`。\n\nIPSec 使用对称加密提供加密安全保障。这意味着通信双方使用共享密钥对通过\
  \ IPSec VPN 链路传输的流量进行加密和解密。IPSec 用于管理加密的机制之一是`互联网密钥交换 (IKE)`；它确保通信双方之间安全地交换秘密密钥，以建立加密的\
  \ VPN 隧道。IKE 由三个元素组成：Oakley、SKEME 和 ISAKMP。\n\nOakley 是一种密钥生成和交换协议，类似于 Diffie-Hellman（请参见第\
  \ 6 章“加密学与 PKI”）。`安全密钥交换机制 (SKEME)` 是一种安全交换密钥的方法。\n\n`互联网安全关联与密钥管理协议 (ISAKMP)` 用于组织和管理由\
  \ Oakley 和 SKEME 生成并交换的加密密钥。安全关联（security association）是两个实体之间约定的认证和加密方法。如果没有通用的认证方法，VPN\
  \ 链路无法建立。因此，ISAKMP 用于以安全的方式为安全关联协商并提供经过认证的密钥材料（一种常用的认证方法）。ISAKMP 的四个主要功能组件如下：\n\n\
  * 通信伙伴的认证\n* 威胁缓解\n* 安全关联的创建与管理\n* 加密密钥的建立与管理\n\nIPSec 是由互联网工程任务组 (IETF) 制定的一个标准架构，用于在两个实体之间建立交换信息的安全通道。这两个实体可以是两个系统、两个路由器、两个网关或任何组合。虽然通常用于连接两个网络，IPSec\
  \ 也可以连接单个计算机（例如服务器和工作站或一对工作站）。IPSec 没有规定所有的实现细节，但是一个开放的模块化框架，允许许多制造商和软件开发人员开发良好的\
  \ IPSec 解决方案。\n\nIPSec 使用公钥加密提供加密、访问控制、不可否认性和消息认证，均使用互联网协议。IPSec 的主要用途是 VPN，因此 IPSec\
  \ 以传输模式或隧道模式运行。IPSec 通常与 L2TP 配对使用 L2TP/IPSec。\n\nIPSec 协议为安全通信提供了完整的基础。它已获得广泛认可，并在许多商用操作系统内置提供。\n\
  \n### 隧道模式 (Tunnel mode)\n\nIPSec 可以以两种模式运行：`隧道模式`和`传输模式`。在隧道模式下，IPSec 通过封装整个原始\
  \ LAN 协议包并添加自己的 IPSec 头，为有效负载和消息头提供加密保护（参见图 2.3）。\n\n```\nFIGURE 2.3 IPSec 在隧道模式下的数据包加密\n\
  ```\n**FIGURE 2.3** IPSec 在隧道模式下的数据包加密\n\n### 传输模式 (Transport mode)\n\n在传输模式下，IPSec\
  \ 为有效负载提供加密保护，保持原始消息头完整（参见图 2.4）。当你跨越不可信网络时，应使用隧道模式。\n\n```\nFIGURE 2.4 IPSec 在传输模式下的数据包加密\n\
  ```\n**FIGURE 2.4** IPSec 在传输模式下的数据包加密\n\n### AH\n\n`认证头 (AH)` 为消息完整性和不可否认性提供保证。AH\
  \ 还提供认证和访问控制，并防止重放攻击。\n\n### ESP\n\n`封装安全载荷 (ESP)` 为数据包内容的机密性和完整性提供保护。它提供加密和有限的认证，并防止重放攻击。\n\
  \n### 分流隧道与全隧道 (Split tunnel vs. full tunnel)\n\n\n\n\n\n`分流隧道` (split tunnel) 是一种\
  \ VPN 配置，允许连接到 VPN 的系统同时通过 VPN 访问组织网络并直接访问互联网。因此，分流隧道同时授予对互联网和组织网络的开放连接。\n\n`全隧道`\
  \ (full tunnel) 是一种 VPN 配置，其中客户端的所有流量都通过 VPN 链接发送到组织网络，然后将任何发往互联网的流量从组织网络的代理或防火墙接口路由出去通往互联网。全隧道确保了所有流量都由组织网络的安全基础设施进行过滤和管理。\n\
  \n## TLS\n\n`安全套接层 (SSL)` 由网景公司 (Netscape) 开发，旨在为网络流量提供客户端-服务器加密。`HTTPS` 使用端口 `443`\
  \ 在 Web 服务器和浏览器客户端之间协商加密的通信会话。尽管 `SSL` 最初是作为网景浏览器的标准，但微软也将其采用为其流行的 Internet Explorer\
  \ 浏览器的安全标准。`SSL` 整合到这两个产品中，使其成为了事实上的互联网标准。\n\n`SSL` 依赖于交换服务器数字证书，以在浏览器和 Web 服务器之间协商\
  \ `RSA` 加密/解密参数。`SSL` 的目标是创建安全的通信通道，并在整个 Web 浏览会话期间保持开启。\n\n`SSL` 依赖于对称加密和非对称加密的结合。当用户访问网站时，浏览器获取\
  \ Web 服务器的证书并从中提取服务器的公钥。然后浏览器创建一个随机对称密钥，使用服务器的公钥对其加密，并将加密后的对称密钥发送给服务器。服务器随后使用自己的私钥解密对称密钥，两个系统使用该对称密钥交换后续所有的消息。这种方法允许\
  \ `SSL` 使用非对称加密的高级功能，同时使用更快的对称算法对绝大多数交换数据进行加密和解密。\n\n`SSL` 是较新的安全标准——`传输层安全协议 (TLS)`\
  \ 协议的基础，该协议在 `RFC 2246` 中规定。`TLS` 的流行程度迅速超越 `SSL`。`SSL` 和 `TLS` 都支持服务器认证（强制性）和客户端认证（可选）。\n\
  \n由于在 `SSL` 中发现了可利用的漏洞，`TLS` 已取代 `SSL`。自 2016 年 11 月以来，大多数浏览器默认禁用了 `SSL`，仅保留 `TLS`\
  \ 激活状态。关于 `TLS`（以及 `SSL`）的进一步讨论，请参见本章后部分的“SSL/TLS”节。\n\n## 始终连接 VPN (Always-on VPN)\n\
  \n始终连接 VPN 是一种在每次网络链路变为活动时尝试自动连接到 VPN 服务的服务。某些始终连接 VPN 可以配置为在建立互联网链路时启动（而非本地网络链路），或仅在建立\
  \ WiFi 链路时启动（而非有线链路）。由于使用开放公共互联网链路（无论无线还是有线）存在风险，使用始终连接 VPN 可以确保在尝试使用在线资源时每次都能安全连接。\n\
  \n## NIPS/NIDS\n\n`入侵检测` (Intrusion detection) 是一项重要的安全能力`入侵检测系统 (IDS)` 设计用于检测未经授权的入侵者或不良活动。通常，`IDS`\
  \ 以被动方式使用；它们是检测问题而非消除问题。入侵防御系统 (`IPS`) 设计用于检测未经授权访问的尝试并阻止这些尝试成功。`IPS` 通常使用更为主动；它们会与不良实体的通信进行交互并干预。\n\
  \n`IDS` 和 `IPS` 安全解决方案被认为是防火墙的互补（参见图 2.5）。`IDS` 和 `IPS` 系统可以是两个独立的解决方案，也可以是一个组合产品。\n\
  \n![图 2.5 一个 IDS 和防火墙协同工作保护网络](img/c02f005.jpg)\n\n**图 2.5 一个 IDS 和防火墙协同工作保护网络\n\
  \n`IDS/IPS` 有两种主要类型：网络型 (`NIDS/NIPS`) 和主机型 (`HIDS/HIPS`)。`NIDS` 可以检测发生在网络内部的恶意活动（该活动不跨越防火墙）以及能够通过防火墙的活动。`HIDS`\
  \ 可以检测发生在单个主机上的恶意活动。\n\n除了配置错误外，`IDS/IPS` 最常见的问题是`误报` (false positives) 的发生。当合法的流量或用户活动被误认为是入侵者活动时，就会发生`误报`。\n\
  \n`基于网络的入侵检测/防御系统` (network-based IDS/IPS) 实时监控网络流量（参见图 2.6）。它监控网络流量模式，扫描数据包头信息，并可能检查包内容以检测安全违规或攻击。`基于网络的\
  \ IDS/IPS` 对于检测针对网络 攻击（例如基于带宽的拒绝服务 `DoS` 攻击）是可靠的。`NIDS/NIPS` 监控网络流量，寻找任何异常或恶意内容。根据其检测到的内容和配置方式，它可以实时响应以通知管理员（被动的\
  \ `NIDS` 响应），或在任何攻击或入侵尝试成功攻击网络或任何内部目标之前对其进行干预（主动的 `NIPS` 反应）。最常见的对恶意包的响应是丢弃它们，从而使其有效负载失效。然而，`NIDS/NIPS`\
  \ 也可以配置为断开会话并重新配置防火墙，以及启动警报、扩展监控并将入侵者隔离在`蜜罐` (honeypot) 或隔离室 (padded cells) 中。`蜜罐`\
  \ 是一种旨在欺骗攻击者和入侵者并诱导他们离开私有安全网络的虚拟环境（参见本章后部分的“蜜罐”节）。`隔离室` (padded cell) 是在检测到入侵时仅激活的限制区域。\n\
  \n![图 2.6 基于网络的 IDS/IPS 在网络中的部署决定了分析的数据](img/c02f006.jpg)\n\n**图 2.6 基于网络的 IDS/IPS\
  \ 在网络中的部署决定了分析的数据。\n\n`基于主机的入侵检测/防御系统` (host-based IDS/IPS) 监控主机的审计跟踪和日志文件（参见图 2.7）。这种类型的\
  \ `IDS/IPS` 限于主机的审计能力（包括 `操作系统` 以及安装的应用程序和服务）。只有当主机的审计能力捕捉了足够的信息时，`基于主机的 IDS/IPS`\
  \ 才能检测针对主机的攻击，无论这些源自外部源还是登录主机的用户。\n\n![图 2.7 基于主机的 IDS/IPS 与操作系统交互](img/c02f007.jpg)\n\
  \n**图 2.7 基于主机的 IDS/IPS 与操作系统交互\n\n`HIDS` 的常见示例是防病毒软件、反间谍扫描器和安全异常检测器。\n\n具有主动检测和响应能力的\
  \ `IDS/IPS` 设计旨在采取快速行动以减少入侵者造成的潜在损害。这种响应可能关闭服务器或仅关闭影响的服务，或者断开可疑连接（参见图 2.9 和图 2.10）。\n\
  \n![图 2.8 IDS/IPS 的组件协同工作提供网络监控](img/c02f008.jpg)\n\n**图 2.8 IDS/IPS 的组件协同工作提供网络监控\n\
  \n![图 2.9 IDS/IPS 指令 TCP 重置所有连接](img/c02f009.jpg)\n\n**图 2.9 IDS/IPS 指令 TCP 重置所有连接\n\
  \n![图 2.10 IDS/IPS 指令防火墙关闭端口 80 60 秒以阻止 Internet 信息服务 (IIS) 攻击](img/c02f010.jpg)\n\
  \n\n\n\n\n# FIGURE 2.10 IDS/IPS 指令防火墙关闭端口 80 60 秒以拦截互联网信息服务（IIS）攻击\n\n具有被动检测和响应能力的\
  \ IDS/IPS 不会对入侵者采取直接行动；相反，它可能会增加审计和记录的数据量，并通知管理员发生入侵入侵。IDS/IPS 擅长检测 DoS 攻击；利用漏洞、缺陷或隐藏功能以及端口扫描。它在检测伪造邮件方面并不可靠。被动\
  \ IDS/IPS 响应通常不会被入侵者发现，且不会直接影响违规活动，而主动 IDS/IPS 响应会被入侵者看到，因为它们直接中断并干扰了违规活动。\n\n许多工具被用于监控和监督网络及系统复杂基础设施中的活动，例如性能监控器、系统监控器、IDS、协议分析器等。这些许多工具还支持一种或多种监控方法。这些方法决定了工具如何判断测量或事件何时是正常的、异常的、良性的、恶性的等。\n\
  \n## 基于特征\n\n基于特征的检测（参见图 2.11）将事件模式与 IDS/IPS 数据库中存储的已知攻击模式（特征）进行比较。基于特征的系统的优点在于，它可以快速、准确地检测来自其特征数据库中的任何事件。然而，基于特征的系统的主要缺点是它无法检测新的和未知的活动或事件。因此，新的零日攻击是基于特征的系统无法识别的。随着新攻击的发现和模式数据库的改进，部署的基于特征的工具需要更新其本地数据库。\n\
  \n![FIGURE 2.11 正在运行的特征检测 IDS/IPS ](img/c02f011.jpg)\n\n# FIGURE 2.11 正在运行的特征检测\
  \ IDS/IPS\n\n## 启发式/行为\n\n基于行为的监控或检测方法依赖于基准的建立或对正常和良性的定义。基于行为的监控是异常检测的一种，但它不是使用规则数据库来确定异常，而是使用实际生产活动的记录。一旦建立了此基准，监控工具就能检测偏离该正常标准的活动。基于行为的系统的优点是它可以检测任何类型的变化或差异，包括以前未见和未知的问题（如零日入侵攻击）。然而，基于行为攻击监控的缺点是定义什么是正常是一个非常艰巨的挑战。当发生非标准活动时，确定什么是良性的或恶性的并不容易，对于自动化基于行为工具来说通常无法实现。\n\
  \n启发式分析通过将可疑程序或新程序与已知恶意软件示例进行比较来实现。这可以通过许多方法完成。一种方法是将疑程序运行在沙箱或虚拟机中观察其活动。如果它显示的活动与已知恶意代码足够相似，则将其归类为恶意。\n\
  \n另一种方法是反编译新程序并寻找已知的恶意子程序或已知恶意软件的代码段重复。这种方法被称为`static analysis`。\n\n## 异常\n\n基于异常的检测（参见图\
  \ 2.12）监控环境中正在进行的活动并寻找异常发生。基于异常的监控或检测方法依赖于对所有有效活动形式的定义。这个已知有效活动数据库允许工具检测任何及所有异常。异常检测通常用于协议。因为协议的所有有效合法形式都是已知且可以定义的，因此任何对这些已知有效结构的变体都被视为异常。异常检测在阻止异常事件方面非常有效。然而，落在正常值范围流量或事件并不意味着该事件或流量的内容本质上不是恶性的。\n\
  \n![FIGURE 2.12 使用专家系统技术评估风险的异常检测 IDS/IPS ](img/c02f012.jpg)\n\n# FIGURE 2.12 使用专家系统技术评估风险的异常检测\
  \ IDS/IPS\n\n## 内联 vs. 被动\n\n`inline IPS` 有两个接口，所有流量必须经过 IPS。流量从任一接口进入，由 IPS 分析引擎进行评估，然后在通往目的地的途中从另一个接口。这种技术使\
  \ IPS 能够停止或阻塞滥用流量。\n\n`passive IDS or IPS` 使用混杂模式网卡（promiscuous mode NIC）监听网络通信。被动\
  \ IDS 通常部署在交换机的 SPAN（交换端口分析器）端口上，在那里接收跨交换机发生的每次通信的副本。这种端口有时被称为审计端口、IDS 端口或镜像端口。这种监控仅允许对发现的问题进行反应性响应，而不是主动性响应。\n\
  \n## 带内 vs. 带外\n\n`in-band IDS` 配置为监控和过滤每个会话的连接前活动和连接后活动。连接前活动可能包括身份验证以及在允许建立会话之前验证是否符合最小安全要求。连接后活动包括流量监控、内容过滤、基于身份的访问控制，以及对已授予连接仍然有效并应允许继续的持续验证。\n\
  \n`out-of-band IDS` 配置为执行连接前活动监控，但不参与任何连接后活动监控。\n\n## 规则\n\nIDS 规则用于定义什么被认为是良性的允许流量，什么是恶意/可疑/异常的禁止流量。异常检测通常通过定义规则来实现。任何符合定义良性活动规则的事件都允许发生，而任何符合可疑活动规则的事件都会被拦截、记录或标记以进行详细分析。\n\
  \nSnort 是基于规则的 NIDS 示例。Snort 使用简单的规则描述语言编写规则，对于保护网络免受识别的意外流量具有显著收益。Snort 规则由规则动作（如\
  \ alert、log 或 pass）、协议（如 TCP 或 UDP）、源 IP 地址、源端口号、方向、目的 IP 地址、目的端口号以及最后如果数据包匹配规则要求时执行的操作组成。请参阅在线\
  \ Snort 规则文档（[`http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node27.html`](http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node27.html)）获取更具体的、非考试相关的信息。\n\
  \n## 分析\n\nIDS 分析是对 IDS 结果的审查、调查和理解。IDS 将事件或流量视为良性或恶意，并相应触发警报/响应或不。这允许 IDS 产生四种可能的结果；前两个是真阳性（true\
  \ positive），后两个是真阴性（true negative）。最理想的是真阴性，即只发生了良性事件且没有警报。次理想的状态是真阳性，即发生了恶意事件且警报响了。\n\
  \n### 假阳性 (False positive)\n\n\n\n\n第三种状态发生在良性事件触发了警报时；这就是误报（false positive）。这是不受欢迎的，因为它浪费了响应资源、时间和注意力，而且如果反复发生，可能会让人对\
  \ `IDS` 系统的质量产生怀疑，导致未来的警报被忽略。必须小心确保响应团队在反复出现误报后，仍然始终尊重 `IDS` 警报。关于此主题的更多讨论，请参阅第一章中的“误报”章节。\n\
  \n### 漏报\n第四种状态发生在恶意事件没有触发警报时——这就是漏报（false negative）。这是最糟糕的状态，因为伤害正在发生但却无人为人知。因此，对这种伤害没有响应，导致它会持续发生。这种状态无法直接解决，因为它是“未知的未知”。唯一的办法是继续改进和调整\
  \ `IDS` 的检测能力，以尽尽可能地减少这种状态的发生。\n\n### 路由器\n`router`（路由器，参见图 2.13））用于连接多个网络网段。路由器允许来自一个网段的流量跨越到另一个网段（参见图\
  \ 2.14）。然而，流量必须通过路由器的过滤器才能转换。带有访问控制列表（`ACLs`）的路由器可以被视为简单的防火墙。\n\n![FIGURE 2.13 连接两个网络的路由器，例如局域网到广域网](img/c02f013.jpg)\n\
  \n`FIGURE 2.13` 连接两个网络的路由器，例如局域网到广域网 \n\n![FIGURE 2.14 实施路由器以分段和安全的企业网络](img/c02f014.jpg)\n\
  \n`FIGURE 2.14` 实施路由器以分段和安全的企业网络 \n\n路由器根据路由表 Direct 流量，并使用 `ACLs`（如规则或过滤器）授权或拒绝访问。路由表告知路由器根据已知最佳路径（`route`）将收到的数据包传向哪个方向发送。\n\
  \n路由器可以管理入站和出站通信的流量。路由器收集的网络信息存储在路由表中。路由表可以通过静态方式管理，也可以通过动态路由协议进行管理。\n\n安全的路由器配置是指防止恶意或未经授权的路由更改的配置。可以通过几个简单设置来实现：\n\
  \n*   将路由器的管理员密码设置为独特且秘密的密码。\n*   设置路由器忽略所有 Internet 控制消息协议（`ICMP`）类型 5 重定向消息。\n\
  *   使用需要验证和数据加密的安全路由协议来交换路由数据。\n*   预配置其他可以交换路由数据的受信任路由器的 `IP` 地址。\n*   配置管理接口使其仅在内部接口上运行，使用安全协议，并可能仅允许在专用网上访问。\n\
  \n通过这些简单的预防措施，你可以提高路由器配置的安全性。有关更高级的路由器配置建议，请参见 CIS 基准和配置指南：[`www.cisecurity.org/cis-benchmarks`](https://www.cisecurity.org/cis-benchmarks)。\n\
  \n#### ACLs\n访问控制列表（`ACLs`）用于定义谁被允许或拒绝执行特定活动或操作权限。`ACLs` 通常与对象访问相关，但也适用于通信。在许多情况下，防火墙、路由器甚至交换机都可以使用\
  \ `ACLs` 作为安全管理的方法。事实上，这些设备的规则可以被称为 `ACLs` 或过滤器。它们的概念大致相同。与许多其他安全控制机制一样，`ACLs` 默认拒绝并仅对异常情况允许。如果用户/IP/设备出现在\
  \ `ACL` 中（具体为访问控制条目 `[ACE]`，它是 `ACL` 中的单行），则指定的操作或活动将被允许或拒绝。\n\n#### 反伪造\n可以在路由器上添加反伪造（Antispoofing）规则或\
  \ `ACLs` 以丢弃明显虚假的通信。这些规则简单地指示：如果数据包的源地址不存在于流量源子网内，则它是伪造的并应该被丢弃。反伪造规则在管理跨越内外边界流量的路由器上最有效。任何不是自内部\
  \ `IP` 地址的出站流量以及任何不是自外部 `IP` 地址的入站流量都可以被丢弃。\n\n### 交换机\n`switch`（交换机，参见图 2.15\n\n\
  `FIGURE 2.15` 两个系统之间的交换\n\n交换机通常连接单个主机，但也可用于将网络连接。交换机从一个端口接收信号，并向目标接收者连接的端口发送。交换机通过维护交换端口外设备介质访问控制（`MAC`）地址表来完成此流量控制任务。交换机检查收到的每个数据包的源\
  \ `MAC` 地址，并将 `MAC` 地址和相关端口记录在它的 `CAM`（内容寻址内存）表中。因此，`CAM` 表是动态的，并不断更新。交换机分析收到的每个数据包的头部以确定目标\
  \ `MAC` 地址，然后仅向已知该 `MAC` 地址所在的端口传输每个数据包。如果遇到未知的 `MAC` 地址（不在 `CAM` 表中），则将未知目的数据包发送到除入口端口外的所有端口。\n\
  \n交换机是防御来自网络内随机客户端`嗅探攻击（sniffing attacks）`的良好手段。嗅探是捕获网络流量进行分析的行为；当未经授权进行嗅探时就会发生嗅探攻击。交换机仅在源和目标系统之间的特定网络链上传输消息。\n\
  \n嗅探器只能拦截恰好在其连接的网段上传输的流量。因此，使用交换机代替集线器是防御嗅探的极佳手段。\n\n然而，存在逻辑和物理攻击可以克服这种保护。如果黑客获得物理访问权限，他可以连接到审计/监控/镜像端口，或重新配置交换机以获得对其看到的所有数据的完全访问权限。如果黑客仅对交换机具有逻辑（网络）访问权限，那么`MAC\
  \ 洪泛攻击`可以过载交换机的 `CAM` 表，从而丢弃有效的 `MAC` 地址并用无效的 `MAC` 地址填充表。\n\n当这种攻击成功时，交换机可能会恢复到类似于集线器的容错模式，将数据发送到所有端口而不是单个端口。这种类型的攻击通常被称为`主动嗅探`，因为黑客必须攻击交换机（有时也通过地址解析协议\
  \ `[ARP]` 洪泛攻击攻击网络上的主机）来获得所有网络流量的访问权限。\n\n#### 端口安全\n\n\n\n\n\nIT 中的 `port security`（端口安全）可以有多种含义。它可以是指对所有连接点进行物理控制，例如\
  \ `RJ-45` 墙插或设备端口（如交换机、路由器或配线架上的端口），以确保没有未经授权的用户或设备能够尝试连接到开放端口。这可以通过锁定布线间和服务器机柜，然后断开从配线架（或打线架）通往房间墙插的工作工作站布线来实现。任何不需要或未使用的墙插都可以（也应该）通过这种方式在物理上禁用。另一种选择是使用智能配线架，它可以监控连接到建筑内每个墙端口的任何设备的\
  \ `MAC` 地址，不仅能检测到何时新设备连接到空闲端口，还能检测到有效设备何时断开或被无效设备替换。\n\n`port security` 的另一个含义是\
  \ `TCP` 和用户数据报协议（`UDP`）端口的管理。如果某个服务处于激活状态并分配了一个端口，那么该端口就是开放的。如果没有服务正在使用，其他其他 65,535\
  \ 个端口（`TCP` 或 `UDP`）都是关闭的。黑客可以通过端口扫描来检测活动服务的存在。防火墙、`IDSs`、`IPSs` 以及其他安全工具可以检测到这种活动，并阻止或返回虚假/误导性信息。这种措施是端口安全的一种类型，可以降低端口扫描的效率。\n\
  \n`port security` 也可以指 `port knocking`（端口触发），这是一种安全系统，系统上的所有端口看起来都是关闭的。然而，如果客户端按照特定顺序向一组特定的端口发送数据包（类似于秘密敲门），那么所需的服务端口就会打开，并允许客户端软件连接到该服务。端口触发不能防止黑客监听端口触发序列并重复它，但它确实可以击败随机针对面向互联网系统的端口扫描器。\n\
  \n`port security` 还可以指在允许通过或跨越端口通信之前，需要对端口进行身份验证。这可以在交换机、路由器、智能配线架，甚至无线网络上实现。此概念通常被称为\
  \ `IEEE 802.1x`。请参阅第 4 章“身份与访问管理”中的“IEEE 802.1x”章节。\n\n## 二层交换 vs. 三层交换\n\n交换机通常是二层设备，因为它基于\
  \ `MAC` 地址管理流量。交换机可以创建 `VLANs` 来将通信隔离在同一 `VLAN` 的成员之间。但当需要跨 `VLAN` 通信时，可以使用三层交换机；它在其各个\
  \ `VLANs` 之间提供路由。因此，三层交换机包含它可以提供为其 `VLANs` 的路由器功能。\n\n## 环路防护\n\n网络术语中的 `loop`（环路）是指重复自身的传输路径。它相当于网络中的绕圈。网络环境中环路的问题在于它会浪费资源，特别是网络吞吐量容量。环路可能发生在二层和三层，分别与\
  \ `Ethernet` 和 `IP` 相关。\n\n以太网环路通过在网络网桥和交换机上使用生成树协议 (`STP`）来解决。`STP` 学习所有可用路径，然后做出流量管理决策以防止产生环路路径。有效地，`STP`\
  \ 建立了传输阻障以防止环路的产生。\n\nIP 使用不同的技术解决环路问题。IP 并不是防止导致环路的路径，而是控制数据包在丢弃之前传输的距离。因此，IP 并不是防止环路，而是在数据包终止之前最小化环路量。这是通过\
  \ IP 头部中的倒计时器控制的，具体为生存时间 (`TTL`) 值。`TTL` 设置为特定的操作系统特定默认值（例如，Windows 的 `TTL` 现在为\
  \ 128，但在某些旧版本中为 32，而 Linux 系统的 `TTL` 范围从 64 到 255），然后每个路由器在重传 IP 数据包时递减 `TTL`。当路由器接收到的\
  \ `TTL` 值为 1 时，该路由器停止向目标地转发数据包，并带有错误消息（“ICMP 类型 11—超时”）将其发回源地址。\n\n## 洪泛防护\n\n`flood\
  \ guard`（洪泛防护）是对洪泛或大规模流量 `DoS` 攻击的防御。洪泛防护目的是检测洪泛活动并自动开始阻止。这防止了此类恶意流量进入私有网络。\n\n\
  洪泛用于多种攻击变体。一种洪泛攻击可用于过载交换机。Cisco IOS 中的正式命令 `floodguard` 可用于启用或禁用 Defender（这是 Cisco\
  \ 解决洪泛攻击的解决方案）。\n\n\n\n\n\n应用代理或特定应用程序代理是配置用于处理单个应用程序及其相关协议通信的代理服务器。例如，Web 应用程序代理设计用于仅管理基于\
  \ `HTTP` 和 `HTTPS` 的通信。应用代理运行在 `Layer 7`（应用层），能够处理特定应用程序及相关应用层协议的负载。\n\n多用途代理不局限于单个应用程序或协议集，而是可以为任何应用程序和协议提供代理功能。多用途代理运行在\
  \ `Layers 3` 和 `4`（网络层和传输层），根据 IP 地址和/或 端口号管理通信。\n\n## 负载均衡器\n\n`load balancer`\
  \ 用于将网络流量负载分散或分布到多个网络链路或网络设备上。负载均衡的目的是获得更优的设施利用率、最小化响应时间、最大化吞吐量、减少过载并消除瓶颈。尽管负载均衡可用于多种情况，但一种常见的实现是将负载分散到服务器农场或集群的多个成员之间。负载均衡器可能使用多种技术来执行负载分配，如表\
  \ 2.1 所示。\n\n表 2.1 常见负载均衡技术\n\n| 技术 | 描述 |\n| --- | --- |\n| 随机选择 | 每个数据包或连接被随机分配到一个目的地。\
  \ |\n| 轮询 | 每个数据包或连接按顺序分配到下一个目的地，例如 1、2、3、4、5 循环。 |\n| 负载监控 | 每个数据包或连接根据目标的当前负载或容量分配目的地。当前负载最低的设备接收下一个数据包或连接。\
  \ |\n| 优先级划分 | 每个数据包或连接根据主观偏好或已知容量差异分配目的地。例如，假设系统 1 可以处理系统 2 和 3 两倍容量；在这种情况下，优先级划分将类似于\
  \ 1、2,3。 |\n\n负载均衡可以是软件服务或硬件设备。负载均衡还可以整合许多功能，取决于协议或应用程序，包括缓存、安全套接层 (`SSL`) 卸载、缓冲、过滤以及防火墙。\n\
  \n### 调度\n\n调度或负载均衡方法是负载均衡器在其后端设备之间分配工作、请求或负载的方法。调度可以非常基础，例如轮询，也可以非常高级和复杂，例如监控设备负载、会话以及性能的其他方面以维持负载分布。\n\
  \n### 亲和性\n\nAffinity 是客户端请求发送到负载均衡器管理的集群或设备内特定服务器的配置偏好。亲和性使用应用层（`Layer 7`）以下的信息将客户端与特定服务器关联。虽然可以更准确地确保所需的服务器处理特定客户端，但实现并非总是可行，因此使用了亲和性。亲和性确保特定服务器处理请求。\n\
  \n### 轮询\n\nRound-robin 是负载均衡的基本形式之一，将每个后续请求或负载交给下一个服务器。例如，如果有四台服务器，请求按顺序分配到服务器\
  \ 1、2、3、4，然后再次回到服务器 1。这种模式就像扑克或钓鱼游戏中的发牌方式。\n\n### 主备\n\n主备系统是一种负载均衡形式，在正常运行期间某些链路或系统处于空闲休眠状态。如果一个活动元素失效，备用元素将上线并接管故障元素的负载。这种技术用于在正常状态和故障状态之间保持吞吐量或负载水平一致。\n\
  \n### 主主\n\n主主系统是一种负载均衡形式，在正常运行期间所有可用链路或系统。在一个或多个链路发生故障时，剩余的活动链路必须支持之前所有链路处理的全部负载。这种技术用于在正常运行期间最大化流量水平或负载，故障期间可以接受容量降低。\n\
  \n### 虚拟 IP\n\n虚拟 IP 地址有时用于负载均衡；IP 地址被客户端感知甚至分配给域名，但该 IP 地址并未实际分配给物理机器。相反，当在 IP\
  \ 地址接收通信时，它们被调度到运行在另一组 IP 地址上的实际系统。\n\n## 接入点\n\n无线网络在企业和家庭网络中已变得常见。正确管理无线网络的可靠访问以及安全并不总是很容易。本节检查了各种无线安全问题。\n\
  \n无线区域是指无线设备可以连接到无线接入点的物理区域。无线区域可能会安全安全环境环境允许允许入侵者访问无线网络。你应该调整无线接入点 (`WAP`) 的强度，以最大化授权用户访问并最小化入侵者访问。这样做可能需要\
  \ `WAPs` 的唯一放置、屏蔽和噪声传输。\n\n`802.11` 是无线网络通信的 IEEE 标准。该标准的各种版本（技术上称为 `amendments`\
  \ 修订版）已应用于无线网络，包括 `802.11a`、`802.11b`、`802.11g` 和 `802.11n`。`802.11x` 有时用于统指所有这些特定实现；然而，人们倾向于使用\
  \ `802.11`，因为 `802.11x` 容易与 `802.1x` 混淆，后者是一种独立于无线认证技术。`802.11` 标准的每个版本或修订版提供了略好的吞吐量：分别为\
  \ 2 Mbps、11 Mbps、54 Mbps 和 200+ Mbps，如表 2.2 所示。`802.11` 标准还定义了等效加密 (`WEP`)，为无线通信提供窃听保护。\n\
  \n表 2.2 802.11 无线网络修订版\n\n| 修订版 | 速度 | 频率 |\n| --- | --- | --- |\n| 802.11 | 2 Mbps\
  \ | 2.4 GHz |\n| --- | --- | --- |\n| 802.11a | 54 Mbps | 5 GHz |\n| 802.11b | 11\
  \ Mbps | 2.4 GHz |\n| 802.11g | 54 Mbps | 2.4 GHz |\n| 802.11n | 200+ Mbps | 2.4\
  \ GHz 或 5 GHz |\n| 802.11ac | 1.3 Gbps | 5 GHz |\n| 802.11ad | 7 Gbps | 60 GHz |\n\
  \n无线网络使网络变得比以往任何时候都灵活。工作站和便携系统不再受限于电缆，可以在办公室或环境中自由移动——只要在部署的 WAP 信号范围内即可。然而，这种自由是以增加漏洞为代价的。无线网络面临着与任何有线网络相同的威胁和风险，此外还有远程窃听、数据包嗅探以及新形式的拒绝服务\
  \ (DoS) 和入侵问题。\n\n\n\n\n\n当你部署无线网络时，你应该部署配置为使用 `infrastructure mode`（基础设施模式）而非 `ad\
  \ hoc mode`（接入模式）的 `WAPs`。`ad hoc mode` 意味着任意无线网络设备（包括两个无线网络接口卡 `NICs`）可以在没有中央控制机构的情况下通信。`infrastructure\
  \ mode` 则意味着需要一个 `WAP`，系统上的无线 `NICs` 不能直接交互，并且会执行 `WAP` 对无线网络访问的限制。\n\n`infrastructure\
  \ mode` 包含几种变体，包括独立式、有线扩展、企业扩展和桥接。当一个 `WAP` 连接无线客户端之间但不连接到任何有线资源时，就形成了 `stand-alone`（独立式）模式架构。此时\
  \ `WAP` 仅作为无线集线器。`wired extension`（有线扩展）模式架构发生在 `WAP` 作为连接点，将无线客户端连接到有线网络。`enterprise\
  \ extended`（企业扩展）模式架构发生在使用多个 `WAPs` 将大物理区域连接到同一个有线网络。每个 `WAP` 使用相同的扩展服务集标识符 (`ESSID`)，以便客户端可以在区域漫游的同时保持网络连接，即使它们的无线\
  \ `NICs` 将关联从一个 `WAP` 切换到另一个。`bridge`（桥接）模式架构发生在使用无线连接链路两个有线网络时。这通常使用专用的无线桥接器，并用于有线桥接不便的场景，例如连接楼层或建筑之间的网络。\n\
  \n`IEEE 802.11` 标准定义了无线客户端在无线链路上进行正常网络通信之前可以对 `WAPs` 进行认证的两种方法。这两种方法是开放系统认证 (`OSA`)\
  \ 和共享密钥认证 (`SKA`)。`OSA` 意味着不需要真实的认证。只要客户端和 `WAP` 之间可以传输无线电信号，就允许通信。使用 `OSA` 的无线网络通常以明文形式传输所有内容，因此不提供机密性安全性。`SKA`\
  \ 意味着在网络通信之前必须进行某种形式的认证。`802.11` 标准为 `SKA` 定义了一种可选技术，称为有线等效隐私保护 (`WEP`)。关于无线加密的更多信息请参阅第\
  \ 6 节“给定场景，安装并配置无线安全设置”。\n\n### SSID\n\n无线网络被分配一个 `SSID`（`BSSID` 或 `ESSID`）以区分不同的无线网络。如果同一个无线网络中涉及多个基站或\
  \ `WAPs`，则定义一个 `ESSID`。`SSID` 类似于工作组名称。如果无线客户端知道 `SSID`，它可以配置其无线 `NIC` 与关联的 `WAP`\
  \ 通信。然而，知道 `SSID` 并不总是意味着获得许可，因为 `WAP` 可以使用许多安全功能来阻止意外的访问。`SSIDs` 由厂商默认定义，由于这些默认\
  \ `SSIDs` 是众所周知的，标准安全实践要求在部署之前将 `SSID` 更改为独特的内容。\n\n`WAP` 通过一种称为 `beacon frame`（信标帧）的特殊传输广播\
  \ `SSID`。这允许范围内的任何无线 `NIC` 都能看到无线网络，并使连接变得尽可能简单。然而，应该禁用这种默认的 `SSID` 广播以保持无线网络的秘密。尽管如此，攻击者仍然可以使用无线嗅探器发现\
  \ `SSID`，因为 `SSID` 必须在无线客户端和 `WAP` 之间的传输中使用。因此，禁用 `SSID` 广播并不是真正的安全机制。相反，应该使用 `WPA2`\
  \ 作为可靠的认证和加密解决方案，而不是试图隐藏无线网络的存在。\n\n### MAC 过滤\n\n`MAC filter`（MAC 过滤器）是一份授权的无线客户端接口\
  \ MAC 地址列表，由 `WAP` 用来阻止对所有未经授权设备的访问。虽然这是一个很有用的功能，但它只能用于无线客户端较少（少于 20 个）且为静态的环境。此外，拥有基础无线黑客工具的黑客可以发现有效客户端的\
  \ MAC 地址，然后将该地址伪装到他们的攻击无线客户端上。\n\n### 信号强度\n\n某些 `WAPs` 提供天线功率电的物理或逻辑调整。功率级别控制通常由制造商设置为适用于大多数情况的设置。然而，如果在执行场勘调查并调整天线位置后，无线信号仍不理想，你可能需要调整功率级别。请记住，更改信道、避免反射和信号散射表面以及减少干扰通常对提高连接可靠性影响更为显著。\n\
  \n在调整功率级别时，应进行微调，而不是尝试将设置最大化或最小化。此外，注意初始/默认设置，以便在需要时返回该设置。在每次调整功率级别后，在重新进行场勘调查和质量测试之前重置/重启\
  \ `WAP`。有时，降低功率级别可以提高性能。\n\n### 频段选择/带宽\n\nWiFi 频段选择应根据无线网络的用途或目的以及现有干扰的水平。对于外部网络，通常优选\
  \ `2.4 GHz`，因为它可以提供良好的距离覆盖但速度较慢；对于内部网络通常优选 `5 GHz`，因为它提供了更高的吞吐量率（但覆盖区域较小）。高频电波无法穿透墙壁和家具等固体，因此\
  \ `5 GHz` 频段最适合开放的内部环境。\n\n正如第 1 节“无线信道”中讨论和所示，每个频率内部都被分为称为信道的无线频段，对于 `2.4 GHz`，选择一个干扰或无干扰的信道非常重要，因为信道间距为\
  \ `5 MHz`，但信道宽度为 `22 MHz`。因此，任何 `2.4 GHz` 信道都会与其上方和方的三个信道产生干扰。`5 GHz` 频段被分为宽度为 `20\
  \ MHz` 的信道，间距也是 `20 MHz`。因此，相邻信道之间没有干扰。这也允许相邻信道绑定以创建更宽的信道，从而支持更快的数据吞吐量。\n\n### 天线类型与放置\n\
  \n无线客户端和基站可以使用多种类型的天线。许多设备的标准天线可以替换为更强的（信号增强型）天线。\n\n标准的直线型或杆形天线是全向性天线，可以在垂直于天线本身的所有方向上发送和接收信号。这是大多数基站和某些客户端设备上常见的天线类型。\n\
  \n大多数其他类型的天线都是**定向的**：它们将发送和接收能力集中在一个主要方向上。方向性天线的示例包括 `Yagi`、`cantenna`、`panel`\
  \ 和 `parabolic`。\n\n\n\n\n\n在部署无线网络时，天线的放置应该是一个考虑因素。在进行适当的实地调查之前，不要固执于特定的位置。将 `WAP`\
  \ 和/或其天线放置在可能的位置，然后测试不同位置的信号强度和连接质量。只有在确认潜在的线线放置位置提供了满意的连接性后，才应将其固定。\n\n在寻求最佳天线位置时，请考虑以下指南：\n\
  \n*   使用中心位置。\n*   避免实心物理障碍物。\n*   避免反射或其他平整金属表面。\n*   避免电气设备。\n\n如果基站具有外部全向天线，通常应将其位置垂直向上指向。如果使用定向性天线，请将焦点指向所需的业务区域。请记住，无线信号会受到干扰、距离和障碍物的影响。\n\
  \n## 胖型 vs 瘦型\n\n胖型接入点（Fat access point）是一种完全管理的无线系统基站，作为独立的无线解决方案运行。瘦型接入点（Thin\
  \ access point）仅仅是一个无线发射器/接收器，必须从单独的外部集中管理控制台进行管理。大多数管理功能已转移到卸载管理设备，因此无线接入点只需处理无线电信号。使用瘦型接入点的好处是，管理、安全、路由、过滤等可以集中在一个位置，而整个设施中可能部署了数十个或更多瘦型接入点。大多数胖型接入点需要逐个设备进行配置，因此在企业应用中不那么灵活。\n\
  \n## 控制器型 vs 独立型\n\n基于控制器的无线接入点是由中央控制器管理的瘦型接入点。独立式（Stand-alone）接入点是胖型接入点，它在设备本地处理所有管理功能。\n\
  \n## SIEM\n\n一个用于自动化监控网络系统的集中式应用程序对于许多组织至关重要。有许多术语用于描述此类解决方案，包括 `安全信息和事件管理 (SIEM)`、`安全信息管理\
  \ (SIM)` 和 `安全事件管理 (SEM)`。通过使用这类企业级监控系统进行实时事件分析，可以监控整个组织的 IT 基础设施。`SIEM` 可以触发器或阈值来监控特定的功能、元素或事件，当特定值或水平被突破时将发送警报或启动报警。这可以被视为比\
  \ `SNMP`（简单网络管理控制台）提供的系统更先进的系统。`SNMP` 侧重于从网络设备提取信息；然而，可以使用陷阱消息（trap messages）在监控系统发生事件或违反阈值时通知管理控制台。\n\
  \n`SIEMS` 可监控电子邮件服务器集群的活动。当电子邮件服务器记录事件时，`SIEM` 代理会监控日志中感兴趣的事件。如果发现了一个事件，`SIEM` 代理会将事件详情转发到中央管理\
  \ `SIEM` 系统。主 `SIEM` 分析引擎确定事件的严重程度以及它是否与近期其他事件有关，并且它可能会触发发送给管理员的通知或请求立即响应的报警。`SIEM`\
  \ 运行以防止问题演变到足以中断关键任务通信的程度的一个例子是：如果电子邮件服务器由于入站消息的激增或增加而开始出现未处理消息的积压。`SIEM` 可以注意到到这种正常运行的变化，并在情况变成\
  \ `DoS` 且系统无法跟上通信或开始丢失、删除、覆盖或其他方式丢失消息之前通知管理员。\n\n`SIEMs` 通常具有广泛的配置选项，允许 IT 人员选择哪些事件和发生的情况对组织很重要。因此，`SIEM`\
  \ 允许根据组织的特定业务流程、优先级和风险对监控和告警进行自定义。`SIEM` 解决方案将包含任何类型的服务器代理，并可能包括接入网络设备的钩，例如交换机、路由器、防火墙、`IDSs`、`IPSs`、`VPNs`\
  \ 和 `WAPs`（图 2.17`）。因此，`SIEM` 是拥有各种系统和设备的大组织的监控和分析工具。`SIEM` 解决方案的报告将让 IT 和安全人员了解环境的状况，报警和警告将使他们对问题或入侵做出及时响应。\n\
  \n![图 2.17 SIEM 的概念](img/c02f017.jpg)\n\n图 2.17 SIEM 的概念\n\n`SIEM` 通常可以执行比仅事件监控更多的任务；它还可以通过监控整个网络系统的配置和补丁状态作为\
  \ `NAC`（网络访问控制）解决方案。`SIEM` 可以提供资产跟踪、`MAC` 监控、`IP` 管理和系统清单概述，甚至可以监控未经授权的软件安装——无论是由用户实施还是通过恶意软件感染实现的。\n\
  \n### 聚合\n\n`SIEM` 将从整个网络范围内设备提取的日志、事件详情和系统测量聚合到集中管理服务器。这使得 `SIEM` 能够监控整个 IT 基础设施，并为管理员提供有关网络整体健康稳定性的见解。聚合对于\
  \ `SIEM` 的优势至关重要。\n\n### 关联\n\n关联是对记录的事件进行比较和分析，以寻找相似之处或重复发生的情况。`SIEM` 执行的关联分析使其能够注意到重复的违规行为、故障趋势和其他形式的升级或反复发生的事件。\n\
  \n### 自动告警和触发器\n\n`SIEM` 使用自动告警和触发器让网络和安全管理员了解网络上任何可能违反安全或被认为可疑的事件。这是 `SIEM` 的一个关键功能，其在严重损害发生之前主动通知\
  \ IT 人员问题的能力使其作为至关重要的企业工具而脱颖而出。\n\n### 时间同步\n\n时间同步始终是安全解决方案实施的一个重要元素，包括 `SIEM`，它可以协助维护网络设备时钟的同步。时间同步是重现或至少分析违规事件的重要部分。如果日志记录的时间戳不同同步，则可能很难（甚至不可能）确定事件发生的顺序。\n\
  \n### 事件去重\n\n\n\n\n日志需要防止意外的或恶意的篡改。诸如 `SIEM` 和 `Syslog` 等集中式日志服务可以通过多种技术帮助保护日志的完整性。其中一种技术是在网络中的各个位置为日志创建额外的副本。这是集中式日志解决方案采用的首要日志保护技术。主日志仍留在原始系统中，但在一个或多个日志管理服务器上维护一份日志的副本。另一种技术是将日志副本存储在\
  \ `WORM`（一次写入多次读取）存储设备上。这些存储介质在任何数据项写入后都会禁止对其进行更改。`WORM` 的常见示例包括光盘和 `ROM` 芯片，但也有\
  \ `WORM` 硬盘和磁带可用。\n\n### DLP\n\n数据泄露防护（Data loss prevention，DLP）指的是专门实施的系统，用于检测和防止对敏感信息的未经授权访问、使用或传输。`DLP`\
  \ 可以包括旨在支持这一主要目标的硬件和软件要素元素。它可能涉及深度数据包检测、存储和传输加密、上下文评估、授权监控以及集中化管理。\n\n可以实施广泛的安全措施来提供\
  \ DLP 益处；这些包括阻止使用电子邮件附件、设置严格的特定作业授权、阻止复制粘贴、防止使用便携式驱动器以及将所有存储默认设置为加密。然而，请记住，虽然 `DLP`\
  \ 会减少意外数据丢失和数据泄露的发生，但任何故意违反公司安全规则的人仍可能找到方法来破坏此类保护。\n\n许多法规，如《健康保险流通与责任法案》（`HIPAA`）、《经济和临床健康信息技术法》（`HITECH`）、《格拉姆-莱利法》（`GLBA`）、`Basel\
  \ II` 以及 `PCI DSS`，要么直接要求 DLP 解决方案，要么暗示了对 DLP 的需求。\n\n#### USB 阻止\n\n许多数据丢失和数据泄露事件通过\
  \ `USB` 存储设备发生，这些设备相对于其尺寸具有巨大的容量。它们使用方便，而且容易隐藏、丢失或被盗。在设置网络使用策略时禁用 `USB` 存储设备的使用可以显著减少基于便携式\
  \ `USB` 存储发生的数据丢失和数据泄露。\n\n阻止使用内存卡（如 `SD` 卡和 `microSD` 卡）也值得考虑。这些类型的内存卡几乎像 USB 驱动器一样无处不在。而且，不要忽视这样一个事实：大多数手机手机在通过\
  \ `USB` 线连接到计算机时可以作为 `USB` 存储器（图 2.18 ）。因此，手机可以对其内部内存存储和任何扩展存储（如 `SD` 或 `microSD`\
  \ 卡）提供可写访问。\n\n![图 2.18 手机在通过 USB 线连接后，从 Windows 系统可以访问其存储空间。](img/c02f018.jpg)\n\
  \n图 2.18 手机在通过 `USB` 线连接后，从 Windows 系统可以访问其存储空间。\n\n#### 基于云的防护\n\n基于云的 DLP 必须侧重于严格的授权，以防止未经授权的实体查看、访问或下载敏感数据。云端服务可能是便携设备、销售终端设备、桌面应用程序和智能设备的数据源。`Cloud\
  \ DLP` 需要包含存储加密和传输加密，以限制授权用户、软件和设备对资源的访问。\n\n#### 电子邮件\n\n电子邮件 DLP 通常涉及对附件的阻止或过滤，以及限制可能启用数据和/或代码传输的\
  \ `HTML/web` 功能的使用。电子邮件 DLP 还可以结合阻止复制粘贴，防止用户将敏感文档的正文传输给未经授权的接收者。\n\n### NAC\n\n\
  网络访问控制（Network Access Control，NAC）涉及通过严格遵守和实施安全策略来控制对环境的访问。`NAC` 的目标是防止或减少零日攻击、在整个网络执行安全策略并使用身份进行访问控制。这些目标可以通过使用强大且详细的安全策略来实现，定义了安全控制的所有方面，并对从客户端到服务器的每个设备以及每次内部或外部通信进行过滤、预防、检测和响应。`NAC`\
  \ 是一种自动检测和响应系统，可以实时做出反应，确保所有监控系统都更新了补丁和程序，并符合最新的安全配置。\n\n`NAC` 可以通过准入前哲学或准入后哲学实施。使用准入前哲学，系统在被允许与网络通信之前必须满足所有当前的安全要求（如补丁应用和防病毒软件更新）。准入后哲学认为允许/拒绝决定是基于用户活动做出的，而活动基于预定义的授权矩阵。`NAC`\
  \ 也可以结合这两种哲学的方面进行部署。\n\n与 `NAC` 相关的其他问题包括使用客户端/系统代理与整体网络监控（无代理）；使用带外监控与带内监控；以及解决任何补救、隔离或强制性门户策略。\n\
  \n基于代理的 `NAC` 系统的典型操作是在每个受管理的系统上安装 `NAC` 监控代理。`NAC` 代理会定期（可能每天）下载配置文件，以根据本地系统检查其与当前配置基准要求的对齐情况。如果系统不合规，它可以被隔离到补救子网中，在\
  \ във子网中它只能与 `NAC` 服务器通信。`NAC` 代理可以下载并应用更新和配置文件，以使系统合规。一旦实现合规，`NAC` 代理将将系统返回到正常生产网络。\n\
  \n许多组织已经发布了带有 `NAC` 理念的产品（通常在产品标题中），包括 `Cisco`、`McAfee`、`Symantec` 等。也有许多开源解决方案。\n\
  \n#### 易失性与永久性\n\n`NAC` 代理可以是易失的或永久的。易失性 `NAC` 代理通常使用 Web/移动语言（如 `Java` 或 `ActiveX`）编写，并在访问特定的管理网页时下载并执行到本地机器。易失性\
  \ `NAC` 代理可以设置为运行一次后终止，也可以驻留在内存中直到系统重启。\n\n永久性 `NAC` 代理作为持久软件后台服务安装到监控系统上。\n\n####\
  \ 主机健康检查\n\n`NAC` 系统可以检查监控系统的安全和性能状况。这种主机健康检查可以作为确定对系统应用哪些更新和配置的一部分。它还可以用于建立系统的持续记录，以监控趋势或建立基准。\n\
  \n#### 代理与无代理\n\n\n\n\n\n邮件网关（mail gateway）或电子邮件网关是一种附加式安全过滤器，用于降低恶意和浪费性邮件的风险。邮件网关在邮件存入接收者的收件箱文件夹之前，过滤掉入邮件中的恶意软件、钓鱼诈骗和垃圾信息。邮件网关也可用于过滤出站消息。这种出站过滤可以作为数据泄露防护（DLP）的组件，或者为防止个人身份信息（PII）的分发提供额外保护。\n\
  \n## 垃圾邮件过滤器\n\n`Spam`（垃圾邮件）是指任何不受欢迎的和/或未经请求的电子邮件。可以将垃圾邮件想象成数字世界的垃圾邮件和上门推销。\n\n\
  `Spam` 这一问题源于多种原因：\n\n*   某些 `spam` 带有恶意代码，如病毒、逻辑炸弹或特洛马。\n*   某些 `spam` 带有社会工程攻击（也称为欺骗邮件）。\n\
  *   不希望的邮件会在你筛选它们以寻找合法信息时浪费你的时间（图 2.19 ）。\n*   某些 `spam` 浪费了互联网资源：存储容量、计算周期和吞吐量。\n\
  \n![FIGURE 2.19 注意我 Gmail 账户上的垃圾邮件计数器；这只是自我上次清理以来这一周的消息计数！](img/c02f019.jpg)\n\n\
  `FIGURE 2.19` 注意我 Gmail 账户上的垃圾邮件计数器；这只是自我上次清理以来这一周的消息计数！\n\n对针对垃圾邮件的主要防御措施是电子邮件过滤器。`email\
  \ filter`（电子邮件过滤器）是一份邮件地址、域名或 IP 地址列表，已知垃圾邮件源自这些地址。如果从列表中的垃圾邮件源接收到消息，电子邮件过滤器将拦截或丢弃它。某些电子邮件过滤器正变得像反病毒扫描器一样复杂。这些过滤器可以检查邮件的头部、主题和内容，寻找能够识别其为已知类型垃圾邮件的关键词或短语，然后采取适当的操作丢弃、隔离或阻止该消息。\n\
  \n除了客户端应用程序或客户端垃圾邮件过滤器外，还有企业级垃圾邮件工具。某些企业级工具是独立设备（通常称为反垃圾邮件设备），而另一些是内部企业邮件服务器的软件扩展。企业级垃圾邮件过滤的益处是，它可以在不受欢迎的消息浪费邮件服务器存储空间或到达客户端之前，通过拦截和丢弃它们来减少内部的垃圾邮件分发。\n\
  \n然而，邮件垃圾邮件过滤器也存在问题。仅仅因为消息包含了通常在垃圾邮件中看到的关键词，并不意味着每条带有这些词的消息都是垃圾邮件。某些合法的（即使不是必需的）消息也包含垃圾邮件词。解决这个问题的方法之一是让垃圾邮件过滤工具将所有疑似垃圾邮件的消息放入隔离文件夹。用户可以查阅此文件夹以查找被误判的消息并将其恢复。\n\
  \n管理垃圾邮件时需要解决的另一个重要问题是伪造邮件（spoofed email）。`spoofed`（伪造的）邮件是具有虚假或伪造源地址的消息。当邮件服务器接收到邮件时，它应该对消息的源地址进行反向查询。如果源地址是假的或不存在，应丢弃该消息。检测或阻止伪造消息的其他方法包括根据黑名单检查源地址，以及对消息头部中的无效条目进行过滤。\n\
  \n`spam filter`（垃圾邮件过滤器）是一种软件或硬件工具，其主要目的是识别并拦截、过滤或删除不受欢迎的消息（即垃圾邮件）。垃圾邮件最常见于电子邮件，但也存在于即时消息（IM）、短信服务（SMS）、Usenet\
  \ 以及网络讨论、论坛、评论和博客中。由于垃圾邮件在全球范围内消耗大量资源，因此在每个机会进行过滤和拦截都是至关重要的。未能阻止垃圾邮件会导致其浪费资源、消耗带宽并分散员工对生产性活动的注意力。垃圾邮件还可能通过链接和附件成为恶意软件感染的常见源。\n\
  \n## DLP\n\n邮件网关可以配置为根据敏感材料或关键词列表过滤出站消息的内容。这有助于防止数据丢失或数据泄露事件的发生。\n\n## 加密\n\n加密可以作为安全工具或绕过过滤的手段。邮件网关无法过滤加密消息的内容，但可以针对特定客户端的加密邮件或其他任何其他明文形式的邮件进行过滤。\n\
  \n## 桥\n\n传统的网络桥是用于连接局域网的设备。局域网最初是基于集线器的。随着交换机的实施，网络桥不再是常见的设备。\n\n与桥相关的另一个新问题是，当单个系统具有两个活动接口，一个连接公司网络，另一个连接互联网时。在这种情况下，通常需要确保启用桥接。在某些系统中，此功能被称为\
  \ `IP forwarding`（IP 转发）。桥接或 `IP forwarding` 允许流量在连接的接口之间直接流动。这不是安全的配置。\n\n随着 IPv6\
  \ 的部署，许多组织将采用 IPv4 到 IPv6 的隧道、代理或桥。这可能允许组织在某些部分保留 IPv4。\n\n## SSL/TLS 加速器\n\n`SSL\
  \ accelerators` 或 `TLS accelerators` 用于将加密操作卸载到专用硬件。这释放了服务器或系统本身的资源，同时保持了连接的安全性。通过让专用\
  \ SSL/TLS 加速器管理安全连接，可以为更多会话提供更高效的加密。\n\n## SSL 解密器\n\n`SSL decryptor` 或 `TLS decryptor`\
  \ 是一种为了过滤目的而解码安全通信的专用设备。SSL/TLS 解密器可以在线部署，也可以用于带外管理。当在线部署时，解密器作为 SSL/TLS 卸载器；解解密在这里处理，而不是由\
  \ Web 或邮件服务器本身管理。这种在线实现还允许使用负载均衡将通信负载分配到多个托管服务器上。\n\n带外监控工具只需要解密通信以进行过滤，而不需要同时加密出站消息。此类配置为过滤或\
  \ IDS/IPS 系统提供了通信的明文版本。\n\n## 媒体网关\n\n`media gateway` 是任何将数据从一种通信格式转换为另一种格式的设备或服务。媒体网关通常位于不同类型网络的交叉点。媒体网关常用于\
  \ VoIP 系统，将基于 IP 的通信转换为模拟或数字信号。\n\n## 硬件安全模块\n\n`hardware security module (HSM)`\
  \ 是一种加密处理器，用于管理和存储数字密钥、加速加密操作、支持更快的数字签名并改进身份验证。`HSM` 通常是附加适配器或外围，也可以是 TCP/IP 网络设备。HSM\
  \ 包含篡改保护，以防止在攻击者获得物理访问时被滥用。\n\n\n\n\n\nHSM 为大型（2,048 位以上）非对称加密计算提供了加速解决方案，并为密钥存储提供了安全的保险箱。许多证书颁发机构系统使用\
  \ HSM 存储证书；ATM 和 POS 银行终端通常采用专用 HSM；硬件 SSL 加速器可以包含 HSM 支持；而符合 DNSSEC 标准的 DNS 服务器使用\
  \ HSM 进行密钥和区域文件存储。\n\nHSM 的一个常见示例是 `trusted platform module (TPM)`。这种存在于许多便携式系统主板上的特殊芯片可用于存储用于全驱动器加密的主加密密钥。\n\
  \n### 考试核心要点\n\n**理解防火墙。** 防火墙通过控制进入和离开网络的流量来提供保护。它们使用过滤器或规则来管理流量。\n\n**了解防火墙的类型。**\
  \ 三种基本的防火墙类型是包过滤防火、电路级网关和应用层网关。第四种类型结合了这三者的特征，被称为状态检测防火墙。\n\n**理解隐式拒绝（Implicit deny）。**\
  \ 隐式拒绝是一种默认的安全立场，即：如果你没有被明确授予对资源的访问权限或权利，则默认你被拒绝访问。\n\n**理解基于应用程序的与基于网络的防火墙。** 应用防火墙是一种设备、服务器扩展、虚拟服务或系统过滤器，它为某个服务和所有用户定义了一\
  \ set 严格的通信规则。网络防火墙是一种硬件设备（通常称为设备），设计用于通用网络过滤。网络防火墙旨在为整个网络提供广泛的保护。\n\n**理解状态检测与无状态检测防火墙。**\
  \ 无状态防火墙根据过滤 ACL 对逐个数据包进行分析。它不会利用通信的上下文或之前的数据包来对当前数据包做出允许或拒绝的决定。状态检测防火墙监控通信的状态或会话；在对当前数据包做出允许或拒绝决定时，它会评估之前的数据包以及可能的通信和条件。\n\
  \n**理解 VPN 集中器。** VPN 集中器是一种专用的硬件设备，旨在支持大量的并发 VPN 连接（通常为数百或数千个）。它为安全的 VPN 连接提供高可用性、高可扩展性和高性能。\n\
  \n**了解 IPsec。** IPSec 是一种安全架构框架，支持通过 IP 进行安全通信。IPSec 在传输模式或隧道模式下建立安全通道。它可以用于建立计算机之间的直接通信，或在网络之间建立\
  \ VPN。\n\n**理解 AH 和 ESP。** IPSec 不是单一协议，而是系列协议的集合。IPSec 的两个主要协议是 `Authentication\
  \ Header (AH)` 和 `Encapsulating Security Payload (ESP)`。AH 提供发送者数据的身份验证；ESP 提供传输数据的加密以及有限的身份验证。\n\
  \n**理解隧道模式和传输模式。** 在隧道模式下，IPSec 通过封装整个原始局域网协议包并添加自身的临时 IPSec 头部，为负载和消息报头提供加密保护。在传输模式下，IPSec\
  \ 仅为负载提供加密保护，并保持原始消息报头完整。\n\n**理解 IKE。** 互联网密钥交换（`IKE`）确保通信双方之间安全地交换密钥，以建立加密的 VPN\
  \ 隧道。\n\n**理解 ISAKMP。** 互联网安全关联和密钥管理协议（`ISAKMP`）用于以安全的方式为安全关联协商并提供验证的密钥材料（一种常见的验证方法）。ISAKMP\
  \ 的四个主要功能组件是：通信伙伴的身份验证、威胁缓解、安全关联的创建与管理，以及加密密钥的建立与管理。\n\n**了解分隧道（Split tunnel）。**\
  \ 分隧道配置允许用户同时访问私有网络和互联网。分隧道经常用于 VPN 连接的系统。\n\n**理解 IDS。** 入侵检测系统（`IDS`）是一种监控入侵或违反安全策略行为的自动化系统。IDS\
  \ 共有两种类型：基于网络和基于主机的。\n\n**理解 NIDS。** 基于网络的入侵检测系统（`NIDS`）实时监控网络流量。它对于检测针对网络的攻击（如\
  \ DoS）是可靠的。\n\n**理解 HIDS。** 基于主机的入侵检测系统（`HIDS`）监控审计跟踪和日志文件。它对于检测针对主机的攻击是可靠的。\n\n\
  **了解检测机制。** 签名检测将事件模式与数据库存储的已知攻击模式（签名）进行比较。异常检测监控环境中的持续活动并寻找异常。\n\n**理解响应方法。** 具有主动检测和响应功能的\
  \ IDS 旨在采取快速行动减少入侵者造成的潜在损害。这种响应可能包括关闭服务器或受影响的服务或断开连接。具有被动检测和响应的 IDS 不会对入侵者采取直接行动；相反，它可能会增加审计的数据量并通知管理员。\n\
  \n**理解基于行为检测。** 基于行为的监控或检测方法依赖于建立基准或对正常的定义。一旦建立了该基准，工具就能检测出偏离该标准的活动。\n\n**理解基于签名的检测。**\
  \ 基于签名的监控或检测方法依赖于已知恶意或不受欢迎活动的签名或模式数据库。基于签名系统的优势是它可以快速准确地检测其数据库中的任何事件。\n\n**理解基于异常的检测。**\
  \ 基于异常的监控或检测方法依赖于所有有效活动形式的定义。这个已知有效活动的数据库允许工具检测异常。\n\n**了解路由器。** 路由器允许流量从一个网络段穿越另一个网络段。然而，流量必须通过路由器的过滤器才能完成转换。\n\
  \n**理解路由器访问控制列表。** 访问控制列表（`ACLs`）用于定义允许或拒绝执行特定活动或操作。`ACLs` 通常与对象访问相关，但也适用于通信。在许多情况下，防火墙、路由器和交换机使用\
  \ `ACLs` 作为安全管理的方法。\n\n**理解交换机。** 交换机是一种用于连接其他设备并可能对其通信实现流量管理的网络设备。它从一个端口接收信号，并将其发送到接收者连接的端口。交换机常用于创建虚拟局域网（`VLANs`）。\n\
  \n**理解环路保护。** 网络术语中的环路是指自我重复的传输路径。环路保护包括以太网的 `STP` 和 IP 报头的 `TTL` 值。\n\n**理解代理。**\
  \ 代理服务器是应用层防火墙或电路级防火墙的一种变体。代理服务器用客户端和服务器之间的代理或中间人。\n\n\n\n\n\n# 理解负载均衡器。负载均衡器用于将网络流量负载分布到多个网络链路或网络设备上。负载均衡的目的是获得最优的基础利用率、最小化响应时间、最大化吞吐量、减少过载并消除瓶颈。\n\
  \n# 了解无线接入点。无线接入点是支持和管理基础架构模式无线网络的网络管理设备。\n\n# 熟悉 802.11 以及 802.11a, b, g, n 和 802.11n\
  \ (150+ Mbps)。`802.11` 是无线网络通信的 IEEE 标准。版本包括 `802.11a` (2 Mbps)、`802.11b` (11 Mbps)\
  \ 和 `802.11g` (54 Mbps)。`802.11` 标准还定义了有等效加密 (`WEP`)。\n\n# 了解 MAC 过滤器。MAC 过滤器是一个授权的无线客户端接口\
  \ MAC 地址列表，`WAP` 用它来阻止所有未经授权设备的访问。\n\n# 了解 SSID 广播。无线网络通常通过一种称为信标帧（beacon frame）的特殊包定期发布其\
  \ `SSIDs`。当 `SSID` 广播时，任何具有自动检测和连接功能的设备都能看到该网络并与其建立连接。\n\n# 了解天线类型。无线客户端和基站可以使用多种类型的天线。这些包括全极化杆形天线以及许多定向天线，如八角形、饼罐、板天线和抛物天线。\n\
  \n# 理解现场测量。现场测量是调查部署在环境中 `WAPs` 的存在、强度范围范围的过程。任务通常涉及携带便携式无线设备行走，记录无线信号强度，并将其绘制在建筑平面或示意图上。\n\
  \n# 理解 SIEM。安全信息和事件管理 (`SIEM`) 是一种集中应用程序，用于网络系统进行自动化监控和实时事件分析。\n\n# 理解 DLP。数据泄露防护\
  \ (`DLP`) 是一种专门设计的系统，用于检测和防止对敏感信息的未经授权访问、使用或传输。`DLP` 可以包括旨在支持这一首要目标的硬件和软件元素。\n\n\
  # 理解 NAC。网络访问控制 (`NAC`) 指通过严格遵守和实施安全策略来控制对环境的访问。`NAC` 的目标是防止或减少零日攻击、在整个网络中执行安全策略，并使用身份进行访问控制。\n\
  \n# 理解邮件网关。邮件网关或电子邮件网关是一种附加安全过滤器，用于减少恶意和浪费邮件的风险。邮件网关在入站邮件存入接收者收件箱之前，过滤掉恶意软件、钓鱼诈骗和垃圾邮件。\n\
  \n# 注意垃圾邮件。垃圾邮件是不受欢迎的或未经请求的电子邮件。它由于许多原因成为一个问题：\n\n* 垃圾邮件可以是病毒、逻辑炸弹和木马等恶意代码的载体。\n\
  * 垃圾邮件可以是社会工程攻击（欺骗邮件）的载体。\n* 当你筛选邮件寻找合法信息时，垃圾邮件会浪费你的时间。\n* 垃圾邮件浪费了互联网资源，如存储容量、计算周期和吞吐量。\n\
  \n# 理解 SPIM。`SPIM` 是指 `IM`（即时消息）上的垃圾邮件。\n\n# 理解桥器。传统的网络桥器是用于连接本地 `LANs` 的设备。与桥接相关的另一个关注点是系统具有两个活跃的网络接口。\n\
  \n# 了解 SSL/TLS 加速器。`SSL 加速器`或 `TLS 加速器` 用于将加密操作卸载到专用硬件设备。这在保持连接安全性的同时，释放了服务器或系统本身的资源。\n\
  \n# 理解 SSL 解密器。`SSL 解密器`或 `TLS 解密器`是用于解码安全通信以便过滤和监控的专用设备。\n\n# 理解媒体网关。媒体网关是任何将数据从一种通信格式转换为另一种格式的设备或服务。媒体网关通常位于不同类型网络的交汇处。\n\
  \n# 理解 HSM。硬件安全模块 (`HSM`) 是一种加密处理器，用于管理和存储加密密钥、加速加密操作、支持更快的数字签名并改进身份验证。\n\n## 2.2\
  \ 给场景，使用适当的软件工具评估组织的安全态。\n\n安全管理在初始安全部署后立即开始。安全管理永无止。关于环境安全总有新知识需要学习。这是由于攻击和利用性质的不断变化，以及生产网络的演进。本节介绍了许多用于评估\
  \ IT 基础设施安全态的安全工具。\n\n### 协议分析仪\n\n`protocol analyzer` 是一种用于检查网络流量内容的工具。协议分析仪通常被称为嗅探器（sniffer），它可以是专用硬件设备，也可以是安装在典型主机系统上的软件。无论哪种，协议分析仪首先是一个包捕获工具，可以收集网络流量并存储在内存或存储设备中。一旦捕获到数据包，可以使用复杂的自动化工具和脚本或手动进行分析。协议分析仪通常将\
  \ `NIC` 置于混杂模式（promiscuous mode），以便查看并捕获本地网段上的所有数据包，而不仅仅是目标 MAC 地址为计算机本地 `NIC` 的包。在混杂模式下，`NIC`\
  \ 会忽略数据包的目标 MAC 地址并收集它看到的每一个包。\n\n一旦收集到网络数据包，它要么被保存到硬盘的日志文件中，要么保留在内存的缓冲区中。协议分析仪可以到二进制级别检查单个数据包。大多数分析仪或嗅探器会自动将头部内容解析为可扩展的大纲形式（图\
  \ 2.20）。任何配置或设置都可以可以在头部中详细看到。\n\n![图 2.20 Wireshark，网络嗅探器，显示捕获通信 TCP 头的扩展视图](img/c02f02.jpg)\n\
  \n**图 2.20** Wireshark，网络嗅探器，显示捕获通信 TCP 头的扩展视图\n\n嗅探器可能是 `协议分析仪` 的同义词，也可能是一种不同类型的产品。嗅探器通常提供捕获过滤器和显示过滤器。捕获过滤器是一组决定哪些包被保存到捕获文件或缓冲区、哪些被丢弃的规则。捕获过滤器用于收集感兴趣的包并将保留包减少到最小。显示过滤器用于从包文件或缓冲区显示符合要求的包。显示过滤器类似于查询，用于定位感兴趣的包。\n\
  \n协议分析仪从简单的原始包捕获工具到完全自动的分析引擎不等。有开源（如 `Wireshark`）和商业（如 `Omnipeek` 和 `NetScout`）选项。\n\
  \n协议分析仪可用于发现由硬件和软件问题引起的通信问题。它们可以检测由于配置错误、故障或恶意意图引起的协议异常。通常，当安全管理员尝试追踪网络通信问题或发现攻击源时，他们会使用协议分析仪。\n\
  \n`Sniffer` 可能是 `protocol analyzer` 的同义词，也可能意味着一种不同的类型。嗅探器通常是一种包（或帧）捕获工具，而协议分析仪能够解码并解释包/帧内容。\n\
  \n\n\n\n协议分析器被网络管理员用于整个内部网络、DMZ（解密化区），甚至开放的因特网上，用以评估网络通信。当发生异常或无法解释的网络事件时，协议分析器可能有助于捕获与事件相关的流量，以诊断并故障排除问题。协议分析器可以捕获实时流量，帮助管理员根据报头值和载荷数据确定通信故障或服务及应用程序问题的原因。\n\
  \n## 网络扫描器\n\n网络扫描器通常是端口扫描器的一种，它增加了枚举技术，以便对网络上发现的设备进行清点。网络扫描器可以使用多种检测技术来发现网络上系统的存在，无论是合法设备还是流氓系统。这些技术包括\
  \ Ping 扫描（ping sweeping）、端口扫描和混杂模式检测。\n\nPing 扫描是指使用 `ICMP Type 8 Echo Request`\
  \ 数据包触发特定特定子网内任何系统返回 `ICMP Type 0 Echo Reply` 数据包的。然而，只有那些不过滤或忽略 `ICMP` 的系统才会响应。\n\
  \n端口扫描可用于检测开放端口的存在。如果检测到开放端口，意味着在被探测的 IP 地址上存在系统。如果向开放的 TCP 端口发送带有 `SYN` 标记的初始数据包，它们将始终响应\
  \ `SYN/ACK` 响应。然而，如果发送端口探测过快，智能防火墙可能会阻止开放端口的响应。\n\n混杂模式检测通过发送查询或请求来实现，但将其目标指向网络上未使用的\
  \ MAC 地址。任何处于正常模式的 `NIC` 都会忽略该请求，但处于混杂模式的 `NICs` 将接受查询并响应。这种技巧或技术可以检测出任何处于混杂模式的系统，但这些系统可能不会对其他技术做出响应。\n\
  \n网络扫描器经常用于定位和识别网络上的设备。管理员可能使用网络扫描器对网络进行清点，并寻找流氓或位置异常的系统。\n\n### 流氓系统检测\n\n流氓系统是指任何未经授权出现在私有网络上的设备。流氓系统可以是有线的、无线的或虚拟机。网络扫描器可以通过检测未出现在预审系统索引中的机器来协助检测流氓系统。\n\
  \n### 网络映射\n\n网络映射通常是安全管理的重要组成部分。除了流氓机器检测外，它还用于确保网络上存在的每个系统都经过了授权，并且所有预期的系统都在在内。用于网络映射的工具可能会生成已发现系统的文本列表，也生成包含典型细节的视觉图表，如\
  \ IP 地址、可能的 MAC 地址、子网组、操作系统类型以及系统名称或标识。\n\n## 无线扫描器/破解器\n\n无线扫描器用于检测无线网络的存在。任何未封装在法拉笼内的无线网络都可以被检测到，因为基站将传输无线电波。法拉笼是一种过滤或阻塞无线电波所有目标频率的封闭装置，以防止跨边界窃听。禁用了\
  \ SSID 广播的无线网络也是可以检测的，因为它们仍在传输无线信号。\n\n无线扫描器能够快速确定区域是否存在无线网络、它们使用的频率和通道、网络名称以及正在使用何种加密加密。无线扫描器还能识别基站和所有连接客户端的\
  \ MAC 地址，因为即使使用 `WPA-2` 加密，无线通信中的以太网报头也是明文的。\n\n一旦发现无线网络，由于其对 `RC4` 的实现不佳，`WEP`\
  \ 网络加密可以在片刻被攻破。同样基于 `RC4` 的 `WPA` 网络较好，但它们的加密可以在 12 小时内被破解。目前只有基于 `AES` 的 `WPA-2`\
  \ 加密是无法破解的。\n\n大多数没有使用法拉笼来限制其无线信号的组织都为黑客提供了潜在的攻击途径。即使是经过 `WPA-2` 加密的网络，攻击者也可以发现所有无线设备的\
  \ MAC 地址，记录流量的大小和时机，并实施有效的 `DoS` 攻击。\n\n\n\n\n密码破解工具通过将潜在密码的哈希值与账户数据库中存储的哈希值（通过任何手段获取或破解）进行对比。潜在密码要么是使用所有可能的字符组合动态生成的，要么是从预编译的密码列表（称为\
  \ `dictionary lists`）中提取的。每个潜在密码都会经过哈希处理，并将哈希值与账户数据库进行比较。如果发现匹配项，密码破解工具就发现了用户账户的密码。在第\
  \ 1 章中描述的生日攻击、彩虹表攻击、字典攻击和暴力破解攻击都是密码破解攻击的典型示例。\n\n系统管理员使用密码破解器来压力测试用户密码的强度。任何由管理员控制的密码破解器发现的密码都必须更改为更强且更能抵抗密码破解技术的密码。密码破解器应在隔离的离线系统上使用，以防止攻击者利用合法的密码审计活动作为窃取凭据的手段。\n\
  \n### 漏洞扫描器\n\n`vulnerability scanner` 是一种用于扫描目标系统以寻找已知漏洞、弱点或缺陷的工具。这些自动化工具拥有攻击、探测、脚本等的数据库，并在受控的方式在一个或多个系统上运行。漏洞扫描器旨在探测目标并生成发现结果报告。它们可以从私有网络内部直接测试内部系统，也可以从网络外部测试边界设备以抵御突破攻击。\n\
  \n请注意，`vulnerability scanner` 通常被用作执行任何类型安全评估或用于安全评估的工具的通用术语。这一点从该术语在目标列表中多次出现可见而易见。在这里，该术语指的是一种检查弱点症状的特定工具。务必在考试中考虑这一点，并寻找上下文线索以解读题目的意图。\n\
  \n漏洞扫描器的设计目标是在探测弱点时不造成破坏，但它们仍可能无意中导致错误、网络性能变慢和停机。因此，计划它们的使用并为潜在的恢复操作做好准备非常重要。\n\n\
  漏洞扫描可以是商业产品，如 `Retina`，也可以是开源产品，如 `Nessus`。大多数组织都会利用多个漏洞扫描器以获得对其安全状态最全面的视角。每次使用漏洞扫描器时，都应该从供应商处更新。\n\
  \n应定期使用漏洞扫描器来识别公司网络所有部分的漏洞、弱点和配置错误。\n\n### 配置合规扫描器\n\n`configuration compliance\
  \ scanner` 是一种手动操作的 NAC。它是一种快速扫描系统的工具，用于检查是否安装了批准更新和补丁，以及系统是否符合安全和通用系统配置设置。\n\n\
  系统管理员应定期使用配置合规扫描器来检查和监控网络上设备的设置状态。\n\n### 利用框架\n\n漏洞利用框架（Exploitation framework）是一种能够充分利用其发现的弱点的漏洞扫描器。它可以是自动或手动的利用评估工具。例如，`Metasploit`\
  \ 是一个开源的漏洞利用框架，而 `Immunity Canvas` 和 `Core Impact` 是商业漏洞利用框架。利用框架通常允许对测试元素进行自定义，并可以创建新的测试以部署到你环境的目标机上。\n\
  \n与漏洞扫描器相比，利用框架确实具有额外的风险，因为它尝试充分利用任何发现的弱点。因此，确保创建了可靠的备份，并实施了能够及时恢复受损数据或系统的事件响应策略（`IRP`）至关重要。漏洞利用框架的目的或目标并非蓄意造成伤害，但测试理念的彻底性可能会无意中导致数据丢失或停机。\n\
  \n漏洞利用框架是一种高级漏洞扫描器，系统管理员和安全管理员可以使用它来压力测试 IT 基础设施的安全态。使用利用框架进行定期扫描和评估将帮助 IT 管理人员在安全问题被攻击者发现之前发现并解决它们。\n\
  \n### 数据清理工具\n\n`Data sanitization` 是从存储设备中删除数据使其无法再恢复的概念。操作系统的标准删除和格式化功能会留下数据残留，这些残留可以被删除数据恢复工具找回。这是因为删除和格式化仅将存储设备扇区标记为可用，而没有实际删除任何现有数据。数据清理用新数据覆盖现有数据以防止数据恢复。覆盖过程可以写入随机数据、全\
  \ 1、全 0（称为 `zeroization`）或某些重复的 1 和 0 模式。\n\n任何丢弃、回收或转售计算机系统或存储设备的人都应该使用数据清理工具。由于存在数据残留恢复风险和数据丢失/泄露的风险，所有存储设备在离开你的安全环境之前都应该进行清理。\n\
  \n### 隐写术工具\n\n请参第 6 章“隐写术”部分讨论此主题。\n\n### 蜜罐\n\n`honeypot` 是一种虚构的环境，旨在欺骗攻击者和入侵者，并将他们引离私有安全网络（参见\
  \ 图 2.21 )）。蜜罐通常部署在不受信的网络（如互联网、业务伙伴或 DMZ）与私有网络之间的缓冲区网络中。在这个位置，蜜罐充当攻击者的诱饵和注意力分散源。\n\
  \n![FIGURE 2.21 A network honeypot deceives an attacker and gathers intelligence.\
  \ ](img/c02f021.jpg)\n\nFIGURE 2.21 网络蜜罐欺骗了攻击者并收集情报。\n\n蜜罐看起来和运行起来像真实的系统或网络，但它不包含任何有价值或合法的数据或资源。入侵者可能会被欺骗，浪费时间去攻击和渗透蜜罐，而不是你的实际网络。蜜罐中的所有活动都会被监控和记录。\n\
  \n部署蜜罐的目的是为你的私有网络提供额外的安全层（特别是一种检测机制），并收集攻击信息，可能为起诉恶意入侵者和攻击者提供足够的证据。蜜罐通常可以收集足够的信息来确定入侵者的身份；被攻击或关注的数据、资源或系统的类型；以及攻击的方法和工具。\n\
  \n如果蜜罐对于黑客或入侵者来说比受保护的私有域网更容易找到，那么它们就是有效的。它们应该经过适当的安全保护使其看起来像真实的网络，但不要过度安全。目标是分散攻击者的注意力并将他们引离你的内网，以便我们学习新的攻击，并可能追踪罪犯进行起诉。如果蜜罐看起来太容易访问，或者反应和行为不像真实的生产网络，经验丰富的黑客和入侵者就不会被欺骗，并可能被激发出寻找并攻击你真实的生产网络。\n\
  \n\n\n\n\n另一种蜜罐的形式被称为*填充陷阱*（*padded cell*）。蜜罐通常是一个持续开启的具有分散性的网络，而填充陷阱是一个只有在检测到入侵，或尝试启动/执行未经授权的命令或软件时才会被激活的遏留区域。\n\
  \n当存在攻击者可能找到规避非公开共享资源方法的风险时，就可以使用蜜罐。在公共 Web 服务器或已知的邮件系统面前，蜜罐的价值很小，但在无法公开访问的系统面前，它们可能非常有效。\n\
  \n## 备份工具\n\n备份工具将数据备份到备用存储设备上。备份是防止数据丢失的保险措施。只有当备份可用时，才能恢复受损、被删除或损坏的数据。可以配置备份工具在特定的时期或时间间隔内自动地执行备份。\n\
  \n有关各种类型备份的详细信息，请参阅第 5 章的“备份概念”章节。\n\n应使用备份工具为数据集（包括系统和设备配置）提供恢复选项。备份应该是连续的，或者是定期实施的。备份是防止数据丢失的唯一保险手段。\n\
  \n## 标志抓取（Banner grabbing）\n\n*标志抓取*是捕获网络服务初始响应或欢迎消息的过程。当向开放端口上的服务发送数据或身份请求，且该服务返回了可能直接或间接揭示其身份的信息时，就会发生*标志抓取*。标志通常会披露应用程序的身份、版本信息以及可能更多的内容。针对\
  \ Web 服务器进行标志抓取的一种常用方法是使用 `telnet` 客户端发送纯文查询。可以通过打开命令提示符、输入 `telnet` [`www.apache.org`](http://www.apache.org)\
  \ `80`、按回车、输入 `HEAD / HTTP/1.0` 然后再按几次回车来实现。这将显示一个 HTTP 200 OK 消息（图 2.22），该消息通常包含一条\
  \ Server 行，用于识别正在使用的特定 Web 服务器产品。标志抓取是黑客和研究人员常用的常用技术，用于通过网络连接了解有关未知系统的信息。\n\n![图\
  \ 2.22 www.apache.org 的标志抓取结果](img/c02f022.jpg)\n\n**图 2.22** [`www.apache.org`](http://www.apache.org)\
  \ 的标志抓取结果\n\n当攻击者或管理员想要进一步了解目标系统时，可以使用标志抓取。如果能从目标系统中检索标志，它通常包含运行在端口上的应用程序的产品和版本详情，以及有关底层操作系统的信息。\n\
  \n## 被动 vs. 主动\n\n*被动*（*passive*）工具、技术或方案是指监控局面但不对其采取任何行动的。这包括记录细节、启动分析引擎以及通知管理员。被动操作或工具不会影响事件，并且不会被事件（或事件的主体）看到（或被注意到）。\n\
  \n*主动*（*active*）工具、技术或方案是指干预局面以改变事件或结果的。这包括更改设置、打开或关闭端口、重启设备、重启服务、启动应用程序、断开客户端、恢复数据等。主动操作或工具会影响事件，因此可以被事件或事件的主体检测到。\n\
  \n当首选监控而非反应时，应使用被动工具，例如观察允许的活动。当响应和遏制（如停止入侵尝试）比持续的信息收集更重要时，应使用主动工具。\n\n## 命令行工具\n\
  \n某些安全工具是命令行工具。以下是你在 Security+ 考试中应该熟悉的某些命令行工具列表。\n\n可能涉及使用其中几种工具的场景是：在私有网络中寻找潜在的违规系统的调查期间。`nmap`\
  \ 工具可以通过执行一系列端口扫描来检测系统的存在。`ping` 工具可以验证目标的 IP 地址是否处于激活并正在使用状态。`tracert` 命令可以用于确定目标系统最近的路由器。`arp`\
  \ 命令可以根据其 IP 地址确定违规系统的 MAC 地址。`nslookup` 或 `dig` 工具可能用于确定违规机器是否已注册在目录服务的 DNS 系统中。`tcpdump`\
  \ 工具可以收集发送到或从目标系统接收的数据包。`netcat` 可能用于尝试连接到目标系统上的任何开放端口，以执行标志抓取或其他信息发现。\n\n### Ping\n\
  \n互联网控制消息协议（ICMP）是一种网络健康和链路测试协议。ICMP 在第 3 层运行，作为 IP 数据包的有效荷。它是 `ping`、`traceroute`\
  \ 和 `pathping` 常用的协议。ICMP 的大多数用途都围绕其从显请求到回显回复展开。ICMP 也用于错误公告或传输。然而，ICMP 仅在实际收到数据包时提供信息。\n\
  \nICMP 也是常用于网络扫描和恶意攻击的协议。当它用于网络扫描时，Ping 扫描（ping sweeps）用于识别正在使用的 IP 地址。然而，由于 ICMP\
  \ 可以被忽略或阻塞，这使其成为一种不可靠的主机发现工具。至于恶意攻击，ICMP 的滥用包括死亡之（Ping of Death）、小鲁夫攻击（Smurf）和洛基（Loki）。\n\
  \n死亡之创建多个数据包碎片，这些碎片在目标上重组，创建一个大于最大有效大小 65535 字节的 ICMP/IP 数据包。在未保护的系统上，这可能导致死机或重启。\n\
  \n小鲁夫攻击通过滥用 ICMP。攻击者向具有不安全的互联网访问路由器或防火墙接口的众多网络的定向广播地址发送 ICMP 回显请求。这些请求被伪造为来自受害者的\
  \ IP 地址。回显请求的每个接收者都会向受害者发送回显回复，导致流量洪水对受害者实施拒绝服务（DoS）。\n\n洛基是一种使用 ICMP 作为封装或隧道协议的工具。实际上，洛基使用\
  \ ICMP 就像一个未加密的 VPN。它跨越允许输出 ICMP 回显请求及其相应的输入回显回复的网络边界。\n\nICMP 功能或运行围绕一个被称为类型（Type）和代码（Code）的信号系统。ICMP\
  \ 大约有 40 种定义的类型；最常见的五种（与 Security+ 考试相关的）列在表 2.3（c02.xhtml#table2-3）中。\n\n[**表 2.3**](#c02.xhtml#tableanchor2-3）常见\
  \ ICMP 类型\n\n| ICMP 类型 || 描述 |\n\n| --- | --- |\n| 8 | 回显请求 |\n| --- | --- |\n|\
  \ 0 | 回显回复 |\n| 11 | 超时 |\n| 3 | 目的不可达 |\n| 5 | 重定向\n\n某些类型使用代码进一步详细的设计。例如，类型 3\
  \ 目的不可达有 14 个代码，用于提供有关该类型原因或起因更具体的细节。一个常见的例子是类型 3 代码 3——意味着目的不可达，目的端口不可达——这是向关闭的\
  \ UDP 端口发送数据包时的标准响应。\n\n\n\n\n\n`ping` 命令使用了 ICMP 类型 8 和类型 0 消息。在 Windows 平台上，`ping`\
  \ 会发送四个回显请求（图 2.23），而在大多数其他平台（如 Linux）上，它会无限重复发送回显请求，直到工具终止。如果目标系统正在运行并能够响应，则会将回显请求返回请求系统。如果收到回显请求，`ping`\
  \ 将通过显示关于回复的消息来确认此信息，这些信息包括大小、往返时间以及生成的 TTL。如果没有收到回复，工具将显示错误“请求超时（Request timed\
  \ out）”。积极的结果确认了访问远程系统的能力。然而，“请求超时”错误并不一定意味着远程系统已离线——它也意味着系统太忙无法响应、通往目标的路由存在缺陷、系统拦截了\
  \ ICMP，或者系统不响应 ICMP。因此，使用基于 ICMP 的 `ping` 是判断系统是否存在并在线的不可靠手段。\n\n![图 2.23 ping 命令](img/c02f023.jpg)\n\
  \n图 2.23 ping 命令\n\n从自己的系统命令提示符尝试 `ping` 命令。使用 `ping –h` 命令查看语法细节。\n\n`tracert`\
  \ 除了类型 8 和 0 外，还使用了 ICMP 类型 11 超（见后文章节“tracert”）。当访问目标拒绝或失败时，通常会收到类型 3。类型 3 ICMP\
  \ 消息通常会返回一个子码，提供关于失败原因更具体的信息（[`en.wikipedia.org/wiki/Internet\\_Control\\_Message\\\
  _Protocol`](https://en.wikipedia.org/wiki/Internet_Control_Message_Protocol)）。类型\
  \ 5 重定向曾用于临时实现静态路由绕路，但由于黑客的滥用，公共路由器通常忽略此类类型。\n\n### netstat\n\n`netstat` 命令显示系统的\
  \ TCP 会话信息。输出选项包括显示活动连接的源和目的 IP 地址及端口号（图 2.24）、列出与连接相关的程序、显示流量字节、显示以太网统计数据、显示外部地址的\
  \ FQDN 以及显示路由表。\n\n![图 2.24 netstat 命令的输出](img/c02f024.jpg)\n\n图 2.24 netstat 命令的输出\n\
  \n从自己的系统命令提示符尝试 `netstat` 命令。使用 `netstat –h` 命令查看语法细节。\n\n### tracert\n\n命令 `tracert`(Windows)\
  \ 或 `traceroute`(Linux) 用于发现本地系统与远程系统之间的路由。`tracert` 使用 ICMP 协议。它向目标发送与 `ping` 相同的\
  \ ICMP 类型 8 回显请求，但它操纵了 IP 头的 TTL。第一波三个请求的 TTL 仅为 1。第一个路由器将 TTL 减 1，发现 TTL 为 0。一旦\
  \ TTL 达到零，路由器就会丢弃数据包并创建一个新的 ICMP 类型 11 超消息发送回源端。源系统使用类型 11 数据包的源 IP 地址（即路由器的 IP\
  \ 地址）进行反向 DNS 查询。如果该 IP 地址有 PTR（指针）记录，则会显示路由器的域名以及 IP 地址。如果 IP 地址没有关联域名，则只显示 IP\
  \ 地址。每个后续查询的 TTL 都会递增，直到达到默认的最大 30 跳或从目标处收到类型 0 回显回复（图 2.25 ）。\n\n![图 2.25 tracert\
  \ 命令](img/c02f025.jpg)\n\n图 2.25 tracert 命令\n\n从自己的系统命令提示符尝试 `tracert` 命令。使用 `tracert\
  \ –h` 命令查看语法细节。\n\n### nslookup/dig\n\n命令行工具 `nslookup` 和 `dig` 用于执行手动 DNS 查询。`nslookup`\
  \ 工具存在于 Windows 上，而 `dig` 工具存在于 Linux 上。这些工具最初对系统配置的 DNS 服务器进行查询。但是，可以将工具重定向到备用\
  \ DNS 服务器以执行查询。\n\n从自己的系统命令提示符尝试 `nslookup` 和 `dig` 命令。在 Windows 上，`nslookup` 工具可以在交互模式或非交互模式下使用。交互模式允许在\
  \ `nslookup` 界面内发布多个连续命令（图 2.26 ）。要在交互模式下启动 `nslookup`，输入命令 `nslookup`，然后输入 `?`\
  \ 来查看语法列表。非交互模式可以使用命令语法发布单个命令。要查看语法，输入 `nslookup -?`。在 Linux 上，输入 `dig -?` 命令查看此工具的语法。\n\
  \n![图 2.26 nslookup 工具](img/c02f026.jpg)\n\n图 2.26 nslookup 工具\n\n### arp\n\n`arp`\
  \ 命令用于显示或操作 ARP 缓存的内容。ARP 缓存显示了 MAC 地址与 IP 地址之间的当前关联。通过 `arp` 工具，你可以查看当前 ARP 缓存、删除条目或添加新条目（图\
  \ 2.27 ）。\n\n![图 2.27 arp 命令](img/c02f027.jpg)\n\n从自己的系统命令提示符尝试 `arp` 命令。使用 `arp\
  \ -?` 命令查看语法细节。\n\n### ipconfig/ifconfig\n\nWindows 命令行工具 `ipconfig` 用于显示 IP 配置并对接口进行某些修改。`ipconfig`\
  \ 命令可以显示摘要或完整的接口配置（图 2.28 ）、释放 DHCP 分配的 IP 地址、触发 DHCP 更新、清除 DNS 缓存以及显示 DNS 缓存内容。\n\
  \n![图 2.28 Windows ipconfig 命令](img/c02f028.jpg)\n\n图 2.28 Windows ipconfig 命令\n\
  \n从自己的系统命令提示符尝试 `ipconfig` 命令。使用命令 `ipconfig /` 查看语法细节。\n\nLinux 命令 `ifconfig` 和\
  \ `ip` 用于操作接口卡的设置。`ifconfig` 命令较旧，计划被 `ip` 命令取代。这些工具可以显示当前的 NIC 配置、启用和禁用接口、设置 IP\
  \ 地址以及删除 IP 地址。`ip` 命令可执行许多其他网络功能，包括添加 ARP 缓存条目、显示路由表和更改路由表。\n\n![图 2.29 Linux ip\
  \ 命令](img/c02f029.jpg)\n\n图 2.29 Linux ip 命令\n\n从自己的 Linux 系统命令提示符尝试 `ifconfig`\
  \ 和 `ip` 命令。使用命令 `ifconfig -h` 或 `ip –h` 查看语法细节。\n\n### tcpdump\n\n命令行工具 `tcpdump`\
  \ 是 Linux 上的原始数据包捕获工具（图 2.30 ）。它可以将数据包捕获到捕获文件中。它支持命令行捕获过滤器以收集特定的数据包。输出的捕获文件可以使用许多其他工具检查，包括\
  \ Wireshark 等 GUI 数据包分析实用程序。\n\n![图 2.30 tcpdump 命令](img/c02f030.jpg)\n\n图 2.30\
  \ tcpdump 命令\n\n\n\n\n\n`nmap` 命令是一个网络映射器或端口扫描器。`nmap` 工具可用于广泛的网络发现和枚举功能，包括 ping\
  \ 扫描、端口扫描（`图 2.31` ）、应用程序识别、操作系统识别、防火墙和 IDS 规避，以及用于发现目标应用程序和操作系统详细信息的大量脚本函数。`Zenmap`\
  \ 是 `nmap` 的图形用户界面。\n\n![FIGURE 2.31 nmap 工具。 ](img/c02f031.jpg)\n\n`图 2.31` nmap\
  \ 工具。\n\n请从你自己的系统命令提示符尝试 `nmap` 命令。使用命令 `nmap -h` 查看语法细节。\n\n## netcat\n\n`netcat`\
  \ 命令是一个灵活的网络工具，用于向 TCP 和 UDP 网络连接写入数据或从其读取。其命令行工具简为 `nc`。该工具用于在网络路径上重定向标准输入和输出，即使对于那些不具备原生网络能力的工具和程序也是如此。除了重定向输入和输出外，它还可以作为基础端口扫描器（`图\
  \ 2.32` )）、执行文件传输、作为端口监听器，甚至作为远程控制后门使用。\n\n![FIGURE 2.32 nc (netcat) 命令 ](img/c02f032.jpg)\n\
  \n`图 2.32` `nc` (netcat) 命令\n\n请从你自己的系统命令提示符尝试 `nc` 命令。使用命令 `nc -h` 查看语法细节。Netcat\
  \ 变得越来越难以找到，因为它不再是一个独立的项目。要获取该命令，读者需要安装 `nmap` 并获取与该项目捆绑的版本，或者安装如 `cryptocat` 等分支版本。\n\
  \n## 考试要点\n\n**理解协议分析器** 协议分析器是用于检查网络流量内容的工具。\n\n**理解网络扫描器** 网络扫描器通常是端口扫描器的一种，它增加了枚举技术，以便对网络发现的设备进行清点。\n\
  \n**理解无线扫描器/破解器** 无线扫描器用于检测无线网络的存在。一旦发现无线网络，由于其对 `RC4` 的实现存在缺陷，可以使用无线破解器在瞬间破解 WEP\
  \ 网络加密。同样基于 `RC4` 的 WPA 网络较好，但它们的加密可以在 12 小时内被破解。\n\n**理解哈希攻击。** 哈希可以使用逆向工程、反向哈希匹配或生日攻击来攻击。这些攻击方法通常被密码破解工具广泛使用。\n\
  \n**熟悉漏洞扫描器。** 漏洞扫描器是用于扫描目标系统已知漏洞、弱点或安全漏洞的工具。这些自动化工具拥有攻击、探测、脚本等数据库，并以受控的方式针对一个或多个系统运行。\n\
  \n**理解配置合规性扫描器** 配置合规性扫描器是手动操作 NAC（网络访问控制）的一种形式。它是一种快速扫描系统以检查是否安装了批准的更新和补丁，以及系统是否符合安全和通用系统配置设置的工具。\n\
  \n**注意利用框架** 漏洞框架是用于利用漏洞的工具。\n\n**理解数据清洗** 数据清洗是从系统中移除数据的概念。\n\n**理解蜜罐。** 蜜罐是设计用于诱捕攻击者离开的虚假环境。\n\
  \n**了解标头抓取（Banner grabbing）。** 标头抓取是捕捉服务初始响应的过程。\n\n**理解备份工具** 备份工具创建数据的备份。\n\n\
  **理解各种命令行工具** 你应该熟悉命令行工具，例如 `ping`、`netstat`、`nslookup/dig`、`arp`、`ipconfig/ifconfig`、`tcpdump`、`nmap`、`netcat`、`traceroute`、`pathping`\
  \ 等。\n\n**理解 ICMP** 互联网控制消息报协议 (`ICMP`) 是一种用于维护网络健康的协议。它在第 3 层作为负载运行。\n\n一个安全良好的环境应该记录所有系统和用户事件日志。当记录的事件中发现异常时，响应应针对特定的违规行为。然而，当异常出现在日志系统本身时，这也需要特定的且立即关注。\n\
  \n安全管理的关键环节是能够解决安全问题。\n\n### 未加密凭据/明文\n\n允许通过明文进行认证已不再是可接受的做法。当发现认证为明文时，在认证解决方案安全之前，停止使用是关重要的。\n\
  \n保护认证的首选方法是在哈希处理之前对密码进行加盐（salt），然后使用如 `TLS`、`SSH` 或 `IPSec` 等强加密。\n\n在使用旧版本的不安全服务时（如\
  \ `FTP`（`图 2.33` ）、`Telnet` 或 `HTTP`），排查明文加密凭据的存在非常有价值。这些旧协议和服务默认不加密认证，因此它们是窃听事件的目标，攻击者借此发现账户凭据。\n\
  \n![FIGURE 2.33 使用 Wireshark 捕获的明文密码 ](img/c02f033.jpg)\n\n`图 2.33` 使用 Wireshark\
  \ 捕获的明文密码\n\n\n\n\n权限（Permissions）或特权（Privileges）是授予用户对单个对象（如文件和打印机）的能力。（相比之下，用户权利\
  \ user rights 是授予用户对操作系统的能力，例如重启系统或安装设备驱动程序的能力。）分配权限非常重要，以便用户有足够的权限完成其工作任务，但不具备任何实质性的额外能力。这被称为最小权限原则。\n\
  \n当用户拥有的权限过多时，组织面临的风险比必要的要高。当用户拥有的权限过少时，他们无法完成工作职责。\n\n要评估权限问题，管理员首先必须了解用户完成工作需要哪些权限和特权，然后确定该用户对其需要访问的对象的当前有效权限。这是通过累加通过组成员身份或直接授予用户帐户的权限，然后移除任何对权限的拒绝来实现的。如果最终的有效权限与该职位不符，则需要通过将用户从组中添加或移除，或者添加或移除用户特定的权限来完成调整。权限问题还可能与用户访问了他们不应访问的资源有关。可以通过删除任何特定的用户允许规则、将用户从组中移除、从访问列表中移除某个组，或对该对象添加特定用户或组的拒绝来解决这些问题。\n\
  \n当用户无法访问其之前可以访问或本应该访问的资源时，就有必要对权限问题进行排除。在大型环境中，用户帐户成为多个组的成员是常见现象。因此，一个组授予的权限和特权可能会被另一个组移除。请检查受影响用户在相应资源上的有效权限，并将设置与该用户能够访问的其他类似资源进行比较。\n\
  \n## 访问违规\n\n访问违规（Access violation）可以描述为未经授权的登录事件或未经授权的资源访问事件，当某人访问其未授权的系统时就会发生。然而，如果他们使用凭据执行了有效登录，那么问题在于身份验证和授权系统的配置。管理员需要调整配置以防止未来发生此类登录事件。\n\
  \n同样，如果一个合法用户能够访问他们不应能够访问的资源，这就是授权失败。管理员应该重新评估并重新配置授权设置，特别是从用户角度和从对象角度来看的有效权限（见上一节）。\n\
  \n每当系统活动出现异常、出现未经授权的可执行文件或其他文件，或者预期的文件和应用程序不存在时，考虑是否发生了访问违规是一种良好的排排除实践。如果发生了未经授权的本地或远程访问事件，它可能会给系统留下更改，这些更改可能会被细细的管理员或用户注意到。\n\
  \n## 证书问题\n\n证书问题可能与广泛的潜在配置错误、策略违规或信息缺失有关。如果端用户无法验证数字证书，他们可能不信任颁发证书的 `CA`。如果是这种情况，则应该检查该\
  \ `CA` 以确定其是否是一个值得信任的实体；如果是，则应将 `CA` 的公钥添加到客户端的信任根证书列表（`TRL`）中。\n\n如果 `CA` 的客户滥用其证书将其用于犯罪活动、更改其确认的身份或以其他方式违反证书策略的条款，则\
  \ `CA` 应该吊销该证书。\n\n如果端用户仍然接受已吊销的证书，可能是因为他们的客户端程序无法下载证书吊销列表（`CRL`）或无法查询在线证书状态协议（`OCSP`）服务。要解决此问题，请更新客户端程序并/或更改其配置，使用正确的\
  \ `CA` 地址来访问这些吊销状态检查资源。\n\n每当身份验证事件失败时，都应该对证书身份验证进行排除，特别是当该事件之前是成功时。查找系统、软件、配置或网络发生的任何更改。检查根\
  \ `CA` 证书，并验证主体证书是否仍然有效且未被吊销。\n\n有关证书和证书管理的更多信息，请参阅第 6 节“给定一个场景，实施公钥基础设施”。\n\n##\
  \ 数据外泄\n\n当发生数据外泄（Data exfiltration）时，外部人员或未经授权的实体访问了内部数据。这是一个数据丢失或数据泄露事件。为了应对这种情况，首先要确定涉及哪些信息或数据，以及可能导致的风险或后果。接下来，处理违反安全策略的实体。如果是员工，这可能意味着严厉警告、解雇或提起诉讼；如果是外部实体，起诉可能是唯一的选择。发现数据外泄发生的方法，并实施新的防御措施以防止再次发生同样的违规。\n\
  \n排除数据外泄应包括检查用户日志、检查授权设置，并调查最近是否发现了与系统相关的漏洞。\n\n## 配置错误的设备\n\n攻击者在尝试入侵目标组织时，会利用一切可能的优势。这包括寻找配置错误的设备作为入侵点。配置错误的设备可能会干扰正常通信，也可能导致安全违规。对配置错误的设备的排除工作应包括将当前设置与记录的设置基准进行对比、检查访问日志中的近期使用或修改，并查看漏洞公告。\n\
  \n### 防火墙\n\n配置错误的防火墙可能会允许旨在拦截的通信跨越网络边界。仔细审查防火墙规则很重要，以防止由于复杂的冲突过滤条目出现漏洞。可以使用第三方评估工具发现防火墙规则集中的错误。\n\
  \n其他防火墙配置错误包括未及时更新补丁，以及未能管理管理接口的访问。每当供应商发布新更新时，始终要检查并更新防火墙。这将尽可能减少已知和暴露的漏洞。始终更改默认密码，但确保不要使用简单的或在多个设备上使用相同的密码。禁用管理接口的明文访问，并要求加密连接。确保只有内部系统可以发起到管理接口的连接，并阻止任何\
  \ WAN 接口访问管理接口的尝试。\n\n### 内容过滤\n\n\n\n\n当内容过滤器未能对通信进行适当或彻底的检查时，它可能会失效。内容过滤器应该部署在网络架构中，使其能够获取应用程序协议的明文负载。否则，如果内容过滤器无法查看应用程序协议负载，或者负载经过了加密，则过滤器将无法正确应用。使用交替编码技术（如\
  \ `Hex` 或 `Unicode`）也可能绕过内容过滤器。确保内容过滤器不仅检查特定的特定的 `ASCII` 匹配，还检查处理后的结果。\n\n内容过滤中常见的疏忽是未能对元字符进行转义（见第\
  \ 1 章）。请确保，除了拦截长度过长或匹配已知不必要数据集的内容外，您的内容过滤还转义了元字符，以消除它们的程序功能。\n\n## 接入点\n\n配置不正确的无线接入点是攻击者试图访问私有网络的常见目标。常见问题包括运行过时的固件、保留默认配置、未保护管理控制台访问，以及未能实施强身份验证和加密（图\
  \ 2.34）。这些问题可以通过安装当前固件、自定义设置（特别是安全性）、锁定管理接口访问以要求来自有线连接的加密和强身份验证，以及使用 `WPA-2` 加密（配合长且复杂的\
  \ `PER/PSK` 密码或利用网络可访问的 `AAA` 服务通过 `ENT/IEEE 802.1x` 实现多因素身份验证）来解决。\n\n![FIGURE\
  \ 2.34 安全配置不良的 WiFi 接入点](img/c02f034.jpg)\n\n图 2.34 安全配置不良的 WiFi 接入点\n\n有关无线安全的更多信息，请参阅第\
  \ 3 章“给定场景，实施安全网络架构概念”和第 6 章“给定场景，安装和配置无线安全设置”。\n\n### 弱安全配置\n\n应避免糟糕或弱的安全配置。应当禁用旧的或非标准的合性功能，并将其替换为符合当前标准的设置。这可能需要升级设备、更新固件，并选择更稳健的配置，这些配置可能会阻止旧系统获取访问。\n\
  \n应定期对弱安全配置进行故障排除。每台 IT 设备都应该对其当前和首选的配置状态进行评估。IT 管理员应该审查基线安全建议以及漏洞公告。请记住，默认设置永远不是安全设置。\n\
  \n## 人员问题\n\n人一直是安全中最薄弱的环节，因为他们可能会犯错、被诱导导致伤害，或故意违反公司安全规定。考虑人员给组织带来的风险并实施安全策略以最小化和处理这些风险至关重要。\n\
  \n人员问题的故障排除应包括确认所有人员都参加过有关标准最低安全活动和要求的意识培训，评估人员的使用和活动日志，并确定违规是故意的、被迫的、意外的还是由于无知。\n\
  \n### 政策违规\n\n当用户违反规则时就会发生政策违规。用户需要接受组织安全策略的培训，并知道其在遵守安全规则方面的特定责任。如果发生违规，应进行内部调查以评估是意外还是故意行为。如果是意外，则需要培训员工在将来如何避免发生此类事故，并可能需要实施新的应对措施。如果是故意的，问题的严重程度可能决定一系列应对措施，包括重新培训、调岗和解雇。\n\
  \n政策违规的一个示例是通过社交网络帖子向外部实体发布公司内部备忘录。根据备忘录的内容，这可能是一个轻微违规（例如根据员工认为发布内容搞笑或无意义的备忘录），或一个严重问题（例如发布了泄露公司机密的备忘录）。\n\
  \n### 内部威胁\n\n内部威胁是指组织内部违反公司安全策略的人。一旦识别出内部威胁，就需要将其从组织中移除。如有必要，联系执法部门提起刑事指控。威胁主体访问的任何资源都应该经过评估并重新加密。\n\
  \n内部威胁的一个示例是员工故意通过 `USB` 驱动将恶意代码带入建筑感染网络。此类恶意软件可能是破坏性的，也可能为外部实体提供远程控制后门访问（无论这是否是内部人员的意）。\n\
  \n### 社会工程\n\n社会工程攻击从电子邮件通信到面对接触不等。每当发生安全漏洞时，都应该进行调查以确定受到了哪些影响以及攻击是否持续。人员应重新培训，以在未来检测并避免社会工程攻击。如果攻击导致数据泄露或攻击者获得远程访问，则需要解决这些问题。对于数据泄露事件，必须评估泄露数据的价值和风险。对于远程访问事件，需要终止连接、移除任何恶意软件并安装额外的防御以防止相同的远程访问事件再次发生。\n\
  \n社会工程的一个示例是员工打开了电子邮件附件，该附件由攻击者伪造，看似是合业务通信，但实际上是诱骗受害者安装远程控制服务的诡计。\n\n### 社交媒体\n\n\
  社交媒体可能是注意力的分散，也是组织的潜在漏洞。当该任务不是其工作描述的一部分时，员工通过与社交媒体互动很容易浪费时间和系统资源。公司的可接受用户策略（`AUP`）应该指示员工在工作期间需要专注于工作，而不是花时间在个人或与工作相关的任务上。\n\
  \n社交媒体可以是员工故意无意向外部分发内部、机密、专有或 `PII` 数据的手段。可以通过输入信息或参与聊天披露他们本应保密的信息来实现。也可以通过分发或发布来自内部文件存储器的文档来实现。社交媒体经常是攻击者发起或进一步实施社会工程攻击的工具。\n\
  \n应对社交媒体问题可以通过在防火墙中添加 IP 封并在 `DNS` 中添加过滤器来阻止对社交媒体网站的访问。违反规定的员工需要受到警告甚至解雇。\n\n社交媒体滥用的一个示例是员工在社交媒体网站或应用程序上浪费时间，而不是完成其工作任务。\n\
  \n#### 个人电子邮件\n\n个人电子邮件也可以作为注意力的分散、向外部泄露数据的手段，或恶意软件感染发生的方法。除了上一节讨论的步骤外，可能需要阻止在公司设备上访问个人电子邮件。\n\
  \n### 未授权的软件\n\n\n\n\n未经授权的软件可能导致恶意软件感染或违反使用许可。不应赋予员工安装他们选择的软件的权限；相反，用户应该只能使用由系统管理员安装的软件。可以通过使用白名单机制来限制独立程序或便携式程序，从而只允许预先批准的执行文件在系统上运行。\n\
  \n如果在系统中发现未经授权的软件，请确定是由谁安装了该应用程序，以及它是否属于以下情况之一：\n\n*   对工作任务有用的合法应用程序\n*   潜在的恶意软件\n\
  *   仅与工作无关\n\n如果某人反复违反公司政策，应对对其进行批评，并可能将其解雇。如果用户绕过了软件安装预防措施，则应加强这些安全措施，或使用更具限制性的预防技术对其进行补充。\n\
  \n未经授权软件的一个示例是员工通过安装网络嗅探器来监控网络，以便收集凭据、个人身份信息（PII）或其他敏感数据。未经授权软件的故障排除应包括实施白名单策略以禁止安装或执行未经授权的代码、监控员工的执行活动，并将异常的网络通信追溯到其源系统（这可能表明使用了未经授权的软件）。\n\
  \n### 基线偏离\n所有公司系统都应在预期参数内运行并符合定义的基线。如果确定某个系统偏离了基线，则应将该系统从生产网络移除以调查原因。如果偏离是由恶意事件引起的，请按照前面的章节中讨论的方法进行调查和响应。如果偏离是由正常的工作相关操作和活动引起的，则可能需要更新基线和/或实施更限制性的系统修改策略，例如白名单或使用静态系统。静态系统是一种用户无法进行任何更改，或只能进行临时且微小的更改（在用户注销后会被弃）的环境。\n\
  \n### 许可合规性违反（可用性/完整性）\n许可合规性对于组织避免法律纠纷非常重要。公司设备上使用的所有软件都需要按照其许可进行使用。如果发现未获得适当许可的软件，应立即将其移除。调查应确定软件是如何进入系统的。如果业务任务需要该软件，则在重新安装之前应获得适当且有效的许可。\n\
  \n一种常见的许可合规性违反是为某个软件产品购买了特定数量的安装或使用许可，但随后无意或刻意安装了超过许可数量的版本。这可能被视为支持业务任务或资源可用性的手段，但是以牺牲组织的完整性为代价的。\n\
  \n### 资产管理\n资产管理跟踪组织实施的硬件和软件的过程。此管理过程用于确保更新、修订、替换和升级得到妥善实施，并确保所有公司资产都记录在案。如果资产管理失败，可能会在不需要的情况下获取新设备，因为现场有足够的设备但没有经过妥善的。这可能导致资产丢失、被盗，或错误地丢弃被误认为是多余或旧的但实际上对业务任务是必需的设备。\n\
  \n应定期（可能是每季度或每年一次）进行手动盘点，以比较和调整任何自动化或数字清单及资产管理系统。如果流程显示资产管理可靠，可以降低手动核实的频率。\n\n###\
  \ 身份验证问题\n身份验证是系统安全的关键要素。身份验证是 AAA 服务的第一个元素，AAA 还包括授权和计费。没有可靠的身份验证，就无法让用户对其行为负责。\n\
  \n身份验证问题包括用户凭据被破坏、用户被冒充或用户无法登录。如果已知用户凭据已被泄露（例如用户数据库被攻击者远程访问或用户凭据以明文传输），则需要使所有用户凭据失效并重置。\n\
  \n如果用户被冒充，应在调查期间禁用该账户。如果问题可以解决，可以重置账户上的凭据并将使用权归给原始用户。如果违规行为严重或与犯罪有关，请保持违规账户禁用，并为用户创建一个具有强效凭据的新账户。\n\
  \n如果用户无法登录，可能是由于身份验证服务故障或通信问题。重启和/或重置系统可以解决小问题。用户可能提供了错误的凭据、忘记了或尝试使用之前的凭据。这可能需要重置凭据并让用户重新尝试授权。如果用户从未从特定系统尝试过身份验证，请检查兼容性问题。如果身份验证失败是一个新问题，请查找上次成功登录以来可能发生的任何变化。系统的更改（无论是故意经过批准的还是意外的）都可能是问题的原因。可能需要撤销更改或重新配置系统以恢复用户的身份验证功能。确定问题是仅针对一个用户还是影响了部分或所有其他用户可能也会帮助。\n\
  \n## 考试要点\n**了解未加密凭据的问题。** 允许在明文或清晰通信通道上进行身份验证不再是可接受的做法。所有身份验证，无例外，都应该经过加密。\n\n\
  **理解访问违规。** 访问违规可以是未经授权的登录事件，也可以未经授权的资源访问事件。\n\n**理解证书问题的故障排除。** 证书问题可能与广泛的潜在配置错误、策略违反或信息缺失有关。\n\
  \n**理解数据外泄。** 当发生数据外泄时，外部或未经授权的实体访问了内部数据。这是一个数据丢失或数据泄露事件。\n\n**了解人员问题。** 人始终是安全中最薄弱的环节——他们可能会犯错、被诱骗导致伤害或故意违反公司安全规定。\n\
  \n**理解未经授权软件的问题。** 未经授权的软件可能导致恶意软件感染或违反使用许可。\n\n**理解基线偏离的问题。** 所有公司系统都应在预期参数内运行并符合定义的基线。如果确定某个系统偏离了基线，则应将该系统从生产网络移除以调查原因。\n\
  \n**意识到许可合规性违反的问题。** 许可合规性对于组织避免法律纠纷非常重要。公司设备上使用的所有软件都需要按照其许可进行使用。\n\n### HIDS/HIPS\n\
  \n\n\n\n基于主机的入侵检测系统（HIDS）监控本地机器以是否存在异常活动的迹象。请参阅本章之前“NIPS/NIDS”节中对 HIDS/HIPS 的讨论。\n\
  \nHIDS 或 HIPS 的输出可能包含警报（alerts）或报告（reports）。警报是刚刚发生或正在发生的立即事件的指示。在审查警报内容后，管理员应制定响应措施以及时处理问题，并重点关注尽力减少进一步损害。报告是警报以及其他信息的记录，这些信息与监控时间范围和被监控的系统相关。应该定期审查这些报告。如果在报告中发现严重问题，应采取措施阻止损害进一步扩大，并实施预防技术以防止再次发生。\n\
  \n如果发生了入侵事件，可能会有相关记录。通过分析和解释 HIDS/HIPS 的输出，我们可以判断是否尝试了入侵、攻击是否成功，以及攻击者目标指向了哪些系统。\n\
  \n### 杀毒软件\n\n`Antivirus`软件是一项重要的安全应用程序（图 2.35 ）。它是主机级 IDS 的一个示例。它监控本地系统，以发现内存、活动进程和存储器中的恶意软件证据。大多数杀毒产品都可以删除检测到的恶意代码并修复其造成的大部分损坏。\n\
  \n![FIGURE 2.35 杀毒软件应用状态页](img/c02f035.jpg)\n\n`FIGURE 2.35` 杀毒应用状态页\n\n为了使杀毒软件生效，必须保持每日签名数据库更新。使用最新的引擎也很重要，因为新的检测和删除方法只出现在最新版本的杀毒软件中。\n\
  \n杀毒或反恶意软件产品的输出，在实时系统监控器发现恶意软件时为警报或报警；如果是系统级文件扫描发现，则为报告。实时恶意软件事件可能会导致杀毒产品自动响应或提示用户。响应可能包括删除恶意软件或隔离。删除感染的文件可能会导致数据丢失，而隔离可以提供在移除恶意元素的同时保留数据的选项。如果存在备份，则可能优选删除；但如果没有感染文件的备份，则优选隔离。\n\
  \n`Antispam`软件是杀毒软件的一种变体。它专门监控电子邮件通信中的垃圾邮件和其他形式的非意愿邮件，以阻止骗局、身份盗窃、资源浪费以及可能的恶意软件分发。某些杀毒软件产品包含反垃圾邮件组件。反垃圾邮件产品可能会对其丢弃或隔离的邮件生成简要报告。然而，在大多数情况下，用户需要查看隔离的垃圾邮件文件夹的内容，以查看哪些被识别为可疑的内容。\n\
  \n`Spyware`监控你的操作并将重要细节传输到监控你活动的远程系统。例如，间谍软件可能会等待你登录银行网站，然后将你的用户名和密码发送给该间谍软件的创建者。或者，它可能会等待你在电子商务网站输入信用卡号，然后将该号码发送给欺诈者并在黑市转售。\n\
  \n`Adware`虽然形式与间谍软件非常相似，但目的不同。它利用各种技术在受感染的计算机上显示广告。广告软件简单的形式是在你浏览时在屏幕上显示弹出广告。更阴险的版本可能会监控你的购物行为并将你重定向到竞争对手网站。\n\
  \n在这两种情况下，你都需要一个反间谍扫描器来检测、删除和击退间谍软件及广告软件。某些杀毒产品包含反间谍功能。然而，运行一个来自杀毒扫描器不同厂商的反间谍扫描器可能是一个好主意。反间谍和反广告产品的输出与杀毒产品的输出非常相似。\n\
  \n当系统被已知恶意软件感染时，杀毒软件应检测到异常代码并启动对违规文件的删除或隔离。杀毒工具的输出可以进行分析和解释，以理解检测到了什么特定形式的恶意软件以及防护软件执行的响应。\n\
  \n### 文件完整性检查\n\n文件完整性检查是比较文件的当前哈希值与存储/之前的哈希值的活动。文件完整性检查工具将显示警报，或对未通过基于哈希完整性检查的文件生成报告。当文件完整性被破坏时，响应措施应该是用备份中的有效版本替换文件。查看日志文件以确定更改的来源，然后采取适当措施防止完整性违反行为再次发生。\n\
  \n文件完整性检查工具的输出可以进行分析和解释，以理解哪些文件不完整。有了这些知识，可能可以通过审查文件更改日志来确定文件何时被修改的，以及是由个人还是软件执行的修改。\n\
  \n### 主机防火墙\n\n基于主机的或个人软件防火墙是安装在客户端系统上的安全应用程序。客户端防火墙用于保护客户端系统免受用户活动以及来自网络或互联网通信的影响。个人防火墙必须保持补丁和更新。它通常可以将通信限制在已批准的应用程序和协议，并通常可以防止外部发起的连接。\n\
  \n基于主机防火墙的输出可能是提示用户是否授予某个软件程序出站通信权限，或警报用户尝试违反现有的入站和出站防火墙规则。如果是有效程序请求网络访问，可以授予权限。但如果网络访问未获得授权或程序未知，则应拒绝该请求。\n\
  \n分析和解释基于主机防火墙的输出可以判断是否针对主机尝试了入侵或 DoS 攻击，或者主机软件是否尝试离开系统以攻击其他系统。\n\n### 应用白名单\n\n\
  `Application whitelisting`是一种禁止未经授权软件运行的安全选项。白名单也称为“默认拒绝”或“隐式拒绝”。在应用安全中，应用白名单阻止任何软件（包括恶意软件）运行，除非它在预先批准的例外列表中（即白名单）。这与典型的设备安全立场不同，后者是默认允许并按例外拒绝（也称为黑名单）。\n\
  \n由于恶意软件的增长，应用白名单方法是剩余的在保护设备和数据方面显示出真正前景的方案之一。然而，没有任何安全解决方案是完美的，包括白名单。所有已知的白名单解决方案都可以被内核漏洞和应用程序配置问题所绕过。\n\
  \n白名单解决方案可能会生成输出报告，详细说明启动未批准软件的尝试，以及每个已批准软件的执行记录。该报告可用于确定是否需要将其他软件添加到白名单中，或者是否需要重新考虑其已批准的应用程序。\n\
  \n\n\n\n应用程序白名单可能会产生相关日志，记录用户尝试执行未包含在许可列表中的软件。分析和解释这些输出可以帮助确定是否需要批准额外的软件，或者用户是否正试图为了个人利益执行未经授权的任务，或者尝试执行他们未经过培训、没有技能或未经授权的任务。\n\
  \n## 可移动介质控制\n\n`Removable media`（可移动介质）驱动器泛泛的可移动存储设备既被视为便利工具，也被视为安全漏洞。向计算机系统添加和移除存储介质的能力使其更加灵活。然而，使用可移动介质也会导致托管内容易受数据窃取和恶意代码植入。\n\
  \n可移动介质包括后续章节列出的电子、逻辑和数字存储机制，以及打印材料。当介质不再需要时，应对其进行适当销毁，以防止向未经授权的实体泄露敏感机密信息。例如，未能销打印件或刻制的\
  \ CD 可能会为翻垃圾寻找信息的攻击者提供猎物。\n\n`Tape`（磁带）是一种常用于备份目的的可移动介质。它是一种顺序存储形式，因此数据元素按顺序写入和读取，而不是像硬盘那样半随机地读取。磁带介质通常支持比除硬盘外的大多数可移动介质更大的存储容量。这使其适用于备份操作。\n\
  \n`可刻录紧光盘 (CD-Rs)` 包含了各种的可写入的光学介质。这些包括 `CDR`、`CD-RW`、`DVD-R`、`DVD-RW`、`蓝光可刻录盘 (BD-R)`\
  \ 以及许多其他变体。可写 CD 和 DVD 由于尺寸限制（`CD-R/RW` 最大为 650 MB，`DVD-R/RW` 为 4 GB 或更多），通常不适用于网络备份，但对于个人（家庭）或客户端级别的备份非常有用。`BD-Rs`\
  \ 的容量为 25 GB 到 50 GB，在某些环境（如小型家庭办公室）中可能非常有用，但它们并不是一种广泛实现的解决方案。无论如何，如果你不对介质保持物理控制，CD\
  \ 上的数据就不会受到保护，因此极易受到未经授权的访问。\n\n`Hard drives`（硬盘）通常被认为是计算机的永久内部存储设备。事实确实如此，但硬盘也以移动的形式存在。这些包括插入机箱或通过\
  \ `SCSI`、`eSATA`、`USB` 或 `IEEE 1394 (FireWire)` 连接的、带有自带外部电源连接的硬盘。\n\n`Diskettes`（磁盘），或称软盘，是只能存储少量数据（约\
  \ 1.4 MB）的可移动介质。然而，尽管它们很小，但如果落入他人之手，会对保护的环境构成重大的安全威胁——更不用它们可能被用于向系统引入恶意软件。虽然这种类型的存储介质正变得越来越常见，但在出现时仍然是一个安全隐患。\n\
  \n`Flashcard`（闪存卡）或内存卡是一种在小尺寸外壳中使用 `EEPROM` 或 `NVRAM` 内存芯片的存储形式。闪存卡通常使用 `USB` 接口，或者直接插入设备（如\
  \ MP3 播放器和数字相机）中。某些闪存卡几乎像硬币一样小，因此容易隐藏。\n\n`Smartcards`（智能卡）可用于多种用途。它们可以作为身份验证因子（特别是作为\
  \ 2 类身份验证因子，通常被称为“你拥有的东西”）。当作为此类使用时，智能卡包含一个存储密码、PIN 码、证书、私钥或数字签名的内存芯片。身份验证系统使用此存储的数据项来验证用户身份。网络、便携式计算机、`PDAs`、卫星电话、公密钥基础设施\
  \ (PKI) 设备等使用智能卡作为身份验证机制。智能卡甚至可以当作信用卡使用（如美国运蓝卡）。\n\n智能卡也可以作为存储设备。大多数智能卡的存储容量有限。\n\
  \n\n\n\n4. 在非生产系统上测试所有更新。\n5. 记录测试系统的变更情况，并计划在生产系统上的实施方案。\n6. 在实施更新之前对生产系统进行备份。\n\
  7. 在生产系统上实施更新。\n8. 评估更新对生产系统的影响。\n9. 如果发现负面影响，则回滚更新。\n\n补丁管理可以通过手动过程实现，也可以使用智能软件工具来自动化这项关键活动。Windows\
  \ 环境下智能补丁管理软件的一个示例是微软的 Windows Server Update Services (WSUS)。WSUS 为管理员提供了集中化的补丁管理、分发和安装手段。对于其他操作系统和混合操作系统环境，也有类似的解决方案解决方案。尽管安全不仅仅涉及补丁管理，但安全管理要求妥善安装补丁和更新。\n\
  \n`hotfix`（热补丁）通常是针对单一问题的更新（尽管也有一些多问题的热补丁），用于修复单个问题。热补丁测试不像其他更新那样充分——它们被快速设计和发布，以处理紧迫问题和故障。如果你正遇到它们旨在修复的问题，或者正受到它们旨在解决的漏洞的威胁，则应该安装它们。\n\
  \n`Service packs`（服务包）是将热补丁和其他之前未发布的更新及功能作为一个整体的集合。它们经过了充分测试，一旦发布，通常应应用于所有系统。服务包可能是累积的，因此你只需要应用最新的服务包即可保持系统处于最新状态。当服务包不是累积的时，它在应用之前需要特定基础的先前的补丁。\n\
  \n`patch`（补丁）是一种修复导致安全漏洞的编程缺陷的更新。补丁是单一问题的实用程序，测试比热补丁更充分。\n\n补丁管理工具的输出将是一份报告，指示受监控系统是否符合已批准的更新。某些补丁管理系统能够自动应用已批准的补丁，而另一些则需要管理员手动安装更新。\n\
  \n### UTM\n\n一体机安全设备是一种设计用于互联网连接与网络之间在线运行的硬件设备。其目标是检测并过滤各种恶意的、浪费的或其他不受欢迎的。这些设备可以被称为安全网关或\
  \ `unified threat management` (UTM) 系统。它们的实现是为了执行防火墙、IDS、IPS 和 NAT 功能，并提供 DoS 保护、垃圾邮件过滤、病毒扫描、隐私保护、Web\
  \ 过滤、间谍软件拦截和活动跟踪。某些一体机安全设备还提供托管 Web 应用程序的服务端以及无线安全功能。\n\n对于某些组织来说，提供如此功能的单一产品是一种节约成本的。在其他环境中，特别是较大的企业，这可能不是最佳选择。\n\
  \n由于 UTM 是多个产品的组合，UTM 的输出要么是每个子功能的独特报告，要么是包含所有工具结果合并的单一报告。对 UTM 报告的响应应基于发现的具体项目，并将遵循本节早些讨论的相同程序。\n\
  \n### DLP\n\n数据泄露防护 (DLP) 是旨在减少和或防止数据向外部未经授权的实体丢失或泄数据的系统。如果发生 DLP 违规，其报告应指示涉及的数据、与违规相关的用户以及事件的严重程度。\n\
  \n### 数据执行防护\n\n数据执行防护 (DEP) 是许多操作系统的安全功能，旨在阻止范围内存攻击，包括缓冲区溢出。DEP 阻塞存储在指定为仅数据区域的代码执行。然而，DEP\
  \ 并非万无一，某些形式的缓冲区溢出无法被其阻止。\n\n当 DEP 时，可能没有任何官方日志或报告。某些 DEP 解决方案可能会创建一个内存滥用尝试。通常的结果是管理员偶然注意到恶意软件或未经授权的代码正在执行。响应应该是终止该代码。\n\
  \n### Web 应用防火墙\n\nWeb 应用防火墙是一种设备、服务器插件、虚拟服务或系统过滤器，它为网站及所有访问者定义了一 set 严格的通信规则。它旨在作为特定的应用程序防火墙，防止跨站脚本、SQL\
  \ 注入和其他 Web 攻击。\n\n相关的设备是 Web 安全网关，它是一种 Web 内容过滤器（通常基于 URL 和内容），同时也支持恶意软件扫描。在大多数情况下，组织实施\
  \ Web 安全网关是为了更好地执行员工 Web 活动策略。某些 Web 安全网关还包含非 Web 功能，包括即时消息 (IM) 过滤、电子邮件过滤、垃圾邮件拦截和欺骗检测。\n\
  \n`URL filtering`（URL 过滤），也称为 Web 过滤，是根据请求访问的全部或部分 URL 阻止访问网站的行为。URL 过滤关注完全限定域名\
  \ (FQDN) 的全部或部分、特定路径名、特定文件名、特定文件扩展或整个特定的 URL。许多 URL 过滤工具可以从供应商获取更新的 URL 阻止列表，并允许管理员自定义列表中添加或删除\
  \ URL。\n\n`Content inspection`（内容检查）是一种安全过滤功能，会对应用程序协议有效负载的内容进行检查。通常此类检查基于关键词匹配。使用不受欢迎的术语、地址或\
  \ URL 的主黑名单来控制哪些内容允许或到达用户。\n\n`Malware inspection`（恶意软件检查）利用恶意软件扫描器（也称为防病毒扫描器或间谍软件扫描器）检测网络流量中不受欢迎的软件内容。如果检测到恶意软件，可以进行拦截或记录并/或触发警报。\n\
  \n许多防火墙，特别是应用程序防火墙和代理，都包含 URL 过滤、内容检查和恶意软件检查作为额外的安全功能。\n\n\n\n\n`Application-aware\
  \ devices`（应用感知设备）是安全设备，例如 `firewalls`、`IDSs`、IPSSPs 和代理，它们在协议栈的较高层运行，旨在对特定通信的内容提供侧重点的安全过滤和分析。此类设备围绕特定的应用程序或服务设计，例如\
  \ Web、电子邮件、`IM`、文件传输、数据库交互等。通常，应用感知设备能够根据其对特定应用程序和协议的关注，提供深度内容检查和过滤。\n\nWeb 应用防火墙或\
  \ Web 安全网关的输出与 `firewall`、`IDS` 或 `UTM` 的输出相似。输出可能是实时警报或事后报告。正如本章前面的节所讨论的，应对对输出进行评估并确定相应的响应。\n\
  \n## 考试要点\n\n**理解杀毒软件。** 杀毒软件是一种至关重要的安全应用。杀毒软件是主机 `IDS` 的一个示例。它监控本地系统，寻找内存、活动进程和存储中是否存在恶意软件的证据。\n\
  \n**理解文件完整性检查。** 文件完整性检查是将文件的当前哈希值与存储/之前的文件哈希值进行比较的活动。\n\n**理解基于主机的防火墙。** 基于主机的或个人软件防火墙是安装在客户端系统上的安全应用。客户端防火墙用于保护客户端系统免受用户活动以及来自网络或互联网通信的侵害。\n\
  \n**了解应用程序白名单。** 应用程序白名单是一种禁止未经授权软件执行的安全选项。白名单也被称为默认拒绝或隐式拒绝。\n\n**理解可移动介质控制。** 可移动介质驱动器和泛指的可移动存储器既被视为一种便利，也被视为一种安全漏洞。向计算机系统添加和移除存储媒体的能力使其更具通用性。然而，使用可移动介质也会导致托管内容受到数据泄取和恶意代码植入的影响。\n\
  \n**理解高级恶意软件工具。** 高级恶意软件工具可能涉及扫描器，其检测数据库包含了 `ransomware`、`rootkits` 和可能不受需要的程序 (`PUPs`)。\n\
  \n**注意补丁管理工具。** 补丁管理是确保更新和补丁被正确测试并应用到生产系统的正式过程。\n\n**理解 UTM。** 一体化安全设备或统一威胁管理 (`UTM`)\
  \ 是一种设计在互联网连接和网络之间以行模式运行的硬件设备。其目标是检测和过滤所有类型的恶意的、浪费的或其他所需的流量。\n\n**理解 DLP。** 数据泄露防护\
  \ (`DLP`) 是旨在减少发生和或防止数据丢失或数据泄露到外部未经授权实体的系统。如果发生 `DLP` 违规，其报告应指示涉及的数据、与泄露相关的用户以及参与外泄的应用程序。\n\
  \n**了解 DEP。** 数据执行防护 (`DEP`) 是许多操作系统的内存安全功能，旨在阻止一系列范围内的内存滥用攻击，包括缓冲区溢出。`DEP` 阻塞存储在标记为仅数据区域的内存区域的代码执行。\n\
  \n**理解 Web 应用防火墙。** Web 应用防火墙是一种设备、服务器附加组件、虚拟服务或系统过滤器，它为网站及其所有访问者定义了一组严格的通信规则。它旨在作为应用程序防火墙，以防止跨站脚本、`SQL\
  \ injection` 和其他 Web 应用攻击。\n\n## 2.5 给定场景，安全地部署移动设备。\n\n移动设备是现代生活的中心部分，特别是在 Security+\
  \ 考试中。\n\n### 连接方法\n\n移动设备可能支持多种不同选项。对于任何组织来说，考虑许多遥远地区唯一的可用选项都是重要的。\n\n#### 蜂窝\n\
  \n蜂窝网络供手机和智能手机使用。网络围绕称为“小区”的区域组织，这些区域中心是一个主收发器、手机塔或基站。蜂窝通信可以支持音频、文本和数据。通过蜂窝网络提供的服务通常按代际命名，这些定义较为松散，例如\
  \ `2G`、`3G` 和 `4G`（`5G` 在 2017 年开始实施）。这些代词用于指网络的每一次改进。例如，`2G` 指全球移动通信 (`GSM`)，它仍支持大多数音频通信；`3G`\
  \ 指通用移动电信 (`UMTS`)；`4G` 指长期演进 (`LTE`)。\n\n通常，蜂窝服务是加密的，但仅限于从移动设备传输到传输塔的期间。一旦通过电缆传输，通信就变成了明文。因此，避免在蜂窝网络上执行任何敏感或机的任务。在通过蜂窝连接传输之前，使用加密通信应用程序进行预加密。\n\
  \n#### WiFi\n\nWiFi 或无线网络最初由 IEEE `802.11` 标准定义。WiFi 是一种在大多数家庭、办公室和公共零售场所（如餐厅和商店）随处可见的通信方案。\n\
  \n关于无线网络或 WiFi 的更多信息位于本章前面的“接入点”部分，以及第 6 章的“给定场景，安装并配置无线设置”。\n\nWiFi 并不总是加密，即使加密了，加密也仅限于便携设备和基站之间。为了对通信进行端到端加密，请使用\
  \ VPN 或加密通信应用程序在通过 WiFi 传输之前进行加密。\n\n#### SATCOM\n\n`SATCOM` 或卫星通信是利用位于近地轨道上的卫星进行音频和数据传输的一种。`SATCOM`\
  \ 设备受益于从地面 100 多英里上方传输信号的宽足迹，实现了几乎完全的服务覆盖。与地面解决方案相比，`SATCOM` 的数据传输速度相当差，但它可能是许多遥远地区唯一的选择。\n\
  \n![FIGURE 2.37 Satellite communications for voice and data ](img/c02f037.jpg)\n\
  \n\n\n\n\n在大多数情况下，卫星通信（SATCOM）都经过加密，以防止来自信号覆盖区域内其他人员窃听。然而，加密仅适用于便携式设备与卫星之间、以及卫星与地面站之间的通信。一旦通信到达地面站，它可能会以明文形式通过陆地、蜂窝或数据连接进行传输。在通过卫星连接发送任何敏感通信之前，请务必提前进行加密。\n\
  \n## 蓝牙 (Bluetooth)\n\n蓝牙定义在 `IEEE 802.15` 中，并使用 `2.4 GHz` 频率（某些形式的 WiFi 也使用该频率）。在大多数实现和使用场景中，蓝牙默认是明文传输的，但可以使用特殊的发射器和外围设备进行加密。蓝牙在已配对的设备之间运行，这是一种松散关联设备的手段，通常是使用默认配对代码（通常为\
  \ `0000` 或 `1234`）或在一种设备上显示并必须输入到另一台设备上的随机 8 字符代码。蓝牙通常是一种短距离通信方法，但该距离基于配对设备天线的相对强度。标准或官方使用的蓝牙范围可达\
  \ 100 米；最常见的是 10 米。\n\n蓝牙容易受到多种攻击，包括蓝牙嗅探（bluesniffing）、蓝牙攻击（bluesmacking）、蓝牙劫持（bluejacking）、蓝牙窃取（bluesnarfing）和蓝牙漏洞（bluebugging）。请参阅第一章“蓝牙劫持”和“蓝牙窃取”章节。\n\
  \n由于蓝牙通常是明文通信，请勿使用它来支持敏感或机密的交易。请使用提供加密交易的替代通信手段。即使您使用了可以加密无线信号的特殊蓝牙实现，这种加密也会在无线信号末端的蓝牙发射器/接收器设备处结束。\n\
  \n## 近场通信 (NFC)\n\n`近场通信 (NFC)` 是一种用于在近距离设备之间建立无线通信的标准。它允许您通过将设备接触或将它们带在几英寸范围内，在设备之间执行某种类型的自动同步和关联。更多信息请参阅第一章“NFC”章节。\n\
  \nNFC 设计为一种安全通信系统，在大多数情况下，其信号经过加密或编码。NFC 不支持持续或大数据的传输（如 WiFi、蜂窝网络甚至蓝牙），因此仅其其的数据传输用途有限来看，风险是极小的。\n\
  \n## ANT\n\nANT 是 Garmin 拥有的专有协议，是一种开放访问的多播传感器网络技术。它使用 `2.4 GHz` 频段来支持传感器设备与管理设备（如智能手机）之间的交互。它在本质上类似于蓝牙\
  \ LE（低功耗），但主要重点在于从低功耗和低比特率的传感器收集数据。ANT 于许多健身追踪器、心率监测仪、手表、自行车码表和步计中。\n\nANT 提供了加密通信的能力，但并非总是开启。某些\
  \ ANT 的实现（例如 `ANT+`）不提供任何加密选项，因为它们关注的是跨厂商互操作性而非安全性。与 NFC 类似，由于目前用途的限制，ANT 的风险有限。然而，在使用任何明文通信系统时请务必保持谨慎。\n\
  \n## 红外 (Infrared)\n\n对于现代设备而言，红外技术不如无线技术那样常见。然而，仍然有许多红外实现；它们通常围绕摄像头将图像传输到打印机或存储设备，或者作为摄像头、视频系统、A/V\
  \ 系统和环境传感器的遥控器。红外是一种基于视距的系统，容易被中断。红外通信通常是明文。你不太可能使用红外通信；但如果你确实使用了，请小心传输有价值或敏感的数据。一些现代手机继续包含一个红外端口，用作控制电视和其他\
  \ A/V 娱乐设备的发射器。\n\n## USB\n\nUSB（通用通用串行总线）是一种通过有线链路连接外围设备和主电脑的标准。对于 2000 年以后制造的设备，USB\
  \ 几乎总是一种连接选项。有多种规范和适配器/连接变体。尽管 USB 是设备间交换数据的易用机制，但它对数据传输不提供任何安全性。一旦设备通过 USB 连接，它们通常会在标准文件管理工具中显示为\
  \ USB 存储设备，可以在其中进行数据读写。USB 提供的唯一保护是它是有线连接而非无线连接，并且加密且屏幕锁定的设备可能会禁用 USB 端口。只有在清除屏幕锁后，USB\
  \ 端口才会用于数据交换。\n\n## 移动设备管理概念\n\n随着智能手机和其他移动设备与互联网以及公司网络交互的能力日益增强，它们面临着日益增长的安全风险。移动设备通常支持内存卡，并可用于将恶意代码带入组织或将机密数据带出。移动设备通常包含敏感数据，如联系人、短信、电子邮件以及可能存在的笔记和文档。移动设备的丢失或被盗可能意味着个人和/公司秘密的泄露。\n\
  \n移动设备正成为黑客和恶意代码的目标。将非必要的信息留在便携设备之外，运行防火墙和防病毒软件（可用），并保持系统锁定和/或加密（可能）。许多移动设备还支持 USB\
  \ 连接，以便与台式电脑和/或笔记本电脑同步通信和联系人，以及传输文件、文档、音乐、视频等。\n\n此外，移动设备并不免疫窃听。使用正确类型的复杂设备，大多数手机通话都可以被窃听——更不用说\
  \ 15 英尺内的任何人都能听到你说话。在手机上讨论相关内容时要小心，尤其是当你处于公共场所时。\n\n移动设备上提供了许多安全功能。然而，支持某项功能并不同于正确配置并启用了该功能。只有当安全功能生效时，才能获得安全收益。请确保你的设备上所有所需的安全功能都按预期运行。\n\
  \n当允许个人拥有的设备在不受限制、监督或控制的情况下进入和离开安全设施时，潜在的危害是巨大的。大多数便携电子设备，尤其是手机、音频播放器和数字相机，都可以用作存储设备。这允许恶意代码被带入或敏感数据被秘密取出。此外，任何带有摄像头功能的设备都可以拍摄敏感信息或位置的照片。个人拥有的设备可以使用以下任何一术语：`portable\
  \ device`（便携设备）、`mobile device`（移动设备）、`personal mobile device (PMD)`（个人移动设备）、`personal\
  \ electronic device`（个人电子设备）或 `portable electronic device (PED)`（便携电子设备），以及 `personally\
  \ owned device (POD)`（个人所有设备）。\n\n\n\n\n\n`移动设备管理 (MDM)` 是一种软件解决方案，用于解决员工访问公司资源时使用的海量移动设备管理的挑战性任务。MDM\
  \ 的目标是提高安全性、提供监控、启用远程管理并支持故障排除。许多 MDM 解决方案支持广泛的设备，并可以在许多服务提供商运行。你可以使用 MDM 通过空中（跨越运营商网络）或\
  \ `WiFi` 连接推送或删除应用程序、管理数据并强制执行配置设置。MDM 可以用于管理公司拥有的设备，也可以管理个人拥有的设备（例如在自自带设备 [BYOD]\
  \ 环境中）。\n\n`设备安全`是指移动设备可能可用的系列潜在安全选项或功能。并非所有便携式电子设备 (PEDs) 都具有良好的安全功能。但即使设备具有安全功能，除非启用并进行正确配置，否则它们也将毫无价值。在做出购买决定之前，请务必考虑新设备的安全选项。\n\
  \n## 应用管理\n\n`应用控制`或`应用管理`是一种设备管理解决方案，限制了哪些应用程序可以安装到设备上。还可以用于强制安装特定应用程序或强制执行某些应用程序的设置，以支持安全基线或维护其他形式的合规性。使用应用控制通常可以通过限制用户安装来自未知源或提供非工作相关功能的应用程序的能力，来减少对恶意应用程序的暴露风险。\n\
  \n尽管必须启用安全功能才能产生任何益处，但移除对业务任务或常见个人使用至关重要的应用程序并禁用功能同样重要。启用功能和安装应用程序的范围越大，漏洞或软件缺陷对设备和/或其包含的数据造成伤害的可能性越大。遵循常见的安全实践（如加固）可以减少移动设备的攻击面。\n\
  \n除了管理移动设备的安全性之外，你还需要关注在这些设备上使用的应用程序和功能。桌面或笔记本系统的大多数软件安全问题与常识安全实践一样适用于移动设备。\n\n\
  ## 内容管理\n\n内容管理是对移动设备及其对公司系统托管内容的访问控制，以及对存储在移动设备上的公司数据的访问控制。通常使用 `MCM`（移动内容管理）系统来控制公司资源以及在移动设备上访问或使用这些资源的手段。在向移动设备渲染或发送数据时，MCM\
  \ 可以考虑设备的能力、存储可用性、屏幕尺寸、带宽限制、内存 (`RAM`) 和处理器性能。\n\n移动设备内容管理系统的目标是在减少复杂性、困惑和不便的同时，最大限度提高性能和工作效益。MCM\
  \ 还可以与 MDM 绑定以确保公司数据的安全使用。\n\n## 远程擦除\n\n如果设备丢失或被盗，应执行远程擦除或远程清理。`远程擦除`允许你远程删除设备上的所有数据，可能甚至是配置设置。擦除过程可以通过手机业务或有时通过任何互联网连接触发（图\
  \ 2.38）。然而，远程擦除并保证数据安全。小偷足够聪明，可以在导出数据时防止触发擦除功能的连接。此外，远程擦除通常只是删除用户数据并将设备恢复到出厂状态。熟练的小偷可能会在擦除后恢复删除的数据文件。提高远程擦除效果的方法是保持移动设备的存储加密。这样，还原删除操作只会恢复加密文件，并且很可能让攻击者无法解码数据。\n\
  \n![图 2.38 通过 Google 查找我的设备提供的远程擦除（删除）功能](img/c02f038.jpg)\n\n**图 2.38** 通过 Google\
  \ 查找我的设备提供的远程擦除（删除）功能 \n\n## 地围栏\n\n地理围栏是指指定特定的地理区域，用于在移动设备上实施功能。地理围栏可以通过 GPS 坐标、无线定位系统\
  \ (`IPS`) 或存在或不存在无线信号来定义。例如，地理围栏可能会在进入公司建筑时启用或禁用 `WiFi` 和摄像头，或者进入商店时启用移动支付。\n\n\
  ## 地理定位\n\n`地理定位`或`地理标记`是移动设备在任何媒体中包含位置详情的能力。地理定位数据通常用于导航工具和许多基于位置的服务，例如向附近的商店提供折扣或优惠券。许多移动设备包含\
  \ GPS 芯片以支持导航从中受益，因此可以跟踪这些设备。GPS 芯片本身通常只是卫星信号的接收器。然而，移动设备上的应用程序可以记录 GPS 位置并报告给在线服务。你可以使用\
  \ GPS 追踪监控……但为了让 GPS 追踪工作，移动设备必须具有互联网或无线业务。\n\n支持 GPS 的移动设备可以在照片中以经纬度的形式嵌入地理位置，以及日期/时间信息。这允许潜在的攻击者（或愤怒的前任）查看社交网络或类似网站上的照片，并确定拍摄照片的确切时间和地点。这种地理标记可以被用于恶意目的，例如确定某人的日常活动。一旦带有地理标记的照片被上传到互联网，潜在的网络跟踪者可能会获得比上传者预期的更多的信息。这是终端用户安全意识培训的绝佳素材。\n\
  \n## 屏幕锁\n\n`屏幕锁`的设计旨在防止他人随意拿起并使用你的手机或移动设备。然而，大多数屏幕锁可以通过滑动图案或在键盘显示上输入数字来解锁。这两者都不是真正的安全操作。屏幕锁可能有绕过方法，例如通过紧急通话功能访问电话应用程序。而且，如果黑客通过蓝牙、无线或\
  \ USB 线连接设备，屏幕锁并不一定能保护设备。\n\n屏幕锁通常在非使用超时期后触发。大多数电脑在系统闲置几分钟后会自动触发密码保护的屏幕保护程序。同样，许多平板电脑和手机在闲置\
  \ 30-60 秒后会触发屏幕锁并调暗或关闭屏幕。锁定功能确保如果你离开无人看管或设备丢失被盗，其他人很难访问你的数据或应用程序。要解锁设备，你需要输入密码、代码或\
  \ `PIN`；绘制图案；提供眼睛或面部进行识别识别；扫描指纹；或使用近距离设备，如近场通信 (`NFC`) 或射频识别 (`RFID`) 环或标签。\n\n\n\
  \n\n\n`Push notification services` 能够将信息发送到您的设备，而不是让设备（或其应用程序）从在线资源拉取信息。推送通知在及时通知关注事项方面有用，但如果是广告或垃圾信息，也可能成为一种困扰。许多应用程序和服务都可以配置为使用推送和/或拉取通知。请考虑每种应用的优势和权衡，以及允许推送通知是否值得为此分心。\n\
  \n### 密码和识别码\n\n如果锁定手机能够提供真正的安全性，那么在手机或其他移动设备上使用强密码将是一个很棒的主意。但大多数移动设备并不安全，即使有强密码，设备仍然可以通过\
  \ `Bluetooth`、无线网络或 `USB cable` 被访问。如果特定的移动设备在启用系统锁时能够阻止对设备的访问，那么这将是一个值得设置的功能，可以设置为在闲置一段时间或手动初始化后自动触发。这种收益通常在您同时启用设备密码和存储加密时获得。\n\
  \n您应该考虑任何减少未经授权访问移动设备的手段。许多 `MDM` 解决方案可以强制执行锁屏配置并防止用户禁用该功能。\n\n在移动设备上或对移动设备进行身份验证通常非常简单，特别是对于手机和平板电脑。然而，滑动或模式访问不应被视为真正的身份验证。尽可能使用密码、提供\
  \ `PIN`、提供人眼或面部进行识别、扫描指纹，或使用近距离设备（如 `NFC` 或 `RFID` 环或贴片）。这些设备身份验证手段对窃偷来说要难破解得多。如前所述，将设备身份验证与设备加密相结合也是明智的，以阻止通过连接电缆对存储信息的访问。\n\
  \n移动设备上的 `Lockout`（锁定）与公司工作站上的账户锁定类似。当用户在多次尝试后未能提供凭据时，账户或设备将被禁用（锁定）一段时间，或者直到管理员清除锁定标记为止。\n\
  \n移动设备可能提供锁定功能，但该功能只有在配置了屏幕锁的情况下才会生效。否则，通过简单的屏幕滑动访问设备将无法提供足够的安全性，因为没有发生身份验证过程。某些设备会随着身份验证失败次数的增加而导致访问尝试之间的延迟变得越来越长。某些设备允许在达到设定尝试次数（例如三次）后触发持续几分钟的锁定。其他设备会触发持久锁定，并要求使用不同的账户或主密码/代码来重新获得设备的访问权限。\n\
  \n### 生物识别\n\n生物识别是移动设备身份验证的一种便利手段。然而，它们的准确性并不如我们所希望的那样。密码必须完全匹配；否则身份验证尝试会被拒绝，但生物识别只需满足存储生物识别值参考配置的近似值即可。这就是为什么您的手指不需要每次都以相同的方式朝向，手指上完全相同的部位也不必位于传感器上。即使您为自己的生物识别因素对设备进行了训练，设备也会从您所选的身体部位采集大量样本以创建参考配置。移动设备上的大多数生物识别传感器都相当简单，可以被生物因素的伪版本欺骗。如果有人从光滑表面（如玻璃杯或桌面）上取了您的指纹，他们可以制作出胶质替代品。许多面部识别系统可能会被有效主体的照片欺骗。\n\
  \n因此，不应将生物识别作为设备身份验证的唯一手段或机制。如果设备持有价值贵且敏感的内容，生物识别不应作为设备身份验证的唯一手段或机制。\n（注：原文此处有一句重复句子；我已根据指令保持了核心含义）\n\
  \n### 容器化\n\n容器化是内部托管系统和云提供商虚拟化演进的下一个阶段。基于虚拟机的系统使用安装在主机服务器裸机上的虚拟机管理程序（hypervisor），然后在每个虚拟机内部运行一个完整的客户操作系统，且每个虚拟机通常只支持单个应用程序。\n\
  \n容器化基于消除操作系统元素重复并完全移除虚拟机管理程序的概念。相反，每个应用程序都被放置在容器中，容器内仅包含支持其所需的资源。容器运行在标准的共享操作系统上。实际上存在一种虚拟机管理程序的替代品，通称为\
  \ `container engine`（容器引擎），但它消耗的资源远比虚拟机管理程序少得多，因为它仅仅为容器提供了对操作系统资源和服务的访问。容器化提供的每个物理服务器的应用程序密度是虚拟机管理程序虚拟化解决方案提供的\
  \ 10 到 100 倍。\n\n可以通过在公司云的容器化主机上托管主操作系统，将容器化应用于移动设备，以便实际移动设备仅作为操作系统容器的远程控制界面，而不是在设备上运行业务应用和公司数据。\n\
  \n### 上文感知身份验证\n\n上下文感知身份验证是对传统身份验证方法的改进。它评估用户尝试的来源和上下文。如果用户来自已知的可信系统（例如公司设施），则存在低风险上下文。如果用户的上下文和来源来自未知设备和/或位置，则上下文为高风险。因此，上下文感知身份验证是一种可以防止身份冒充的自适应机制。\n\
  \n### 存储分段\n\n`Storage segmentation` 用于人工划分存储介质上不同类型或取值的数据。在移动设备上，设备制造商和/或服务提供商可以使用存储分段将设备操作系统和预装应用程序与用户安装的应用程序及数据隔离开。某些移动设备管理系统进一步实施存储分段，以便公司数据和应用与用户数据及应用分离。\n\
  \n### 全设备加密\n\n加密通常是防止未经授权访问数据的保护机制，无论是在存储中还是传输中。大多数移动设备提供某种形式的存储加密。如果可用，应当启用。然而，加密并保证数据安全，特别是如果设备在解锁状态下被盗，或者系统本身存在已知的后门攻击漏洞时。\n\
  \n\n\n\n允许移动设备连接到公司网络或与其交互会增加组织的风险。公司应该制定移动设备安全策略，以尝试解决并减少与以下列表相关的问题。\n\n### 第三方应用商店\n\
  \n第一方应用商店 `iTunes` 和 `Google Play`（图 2.39）是 iOS 或 Android 手机的合理应用来源。对于 Android 设备，`Amazon\
  \ Underground` 应用商店也是一种应用来源。然而，大多数其他应用商店对托管应用程序的规则通常不严格。在 Android 设备上，简单地启用从未知源安装功能允许使用\
  \ `Amazon Underground` 应用商店。对于 Apple iOS 设备，除非设备已越狱（jailbreak），否则你受限于官方 `iTunes\
  \ App Store`（这通常是一个安全建议）。\n\n![图 2.39 Google Play 商店](img/c02f39.jpg)\n\n`图 2.39`\
  \ Google Play 商店\n\n当移动设备由组织管理时（特别是在使用 `MDM` 时），大多数第三方应用商店将被拦截。第三方应用商店代表了数据泄露或恶意软件入侵风险的显著增加。\n\
  \n### Root/越狱\n\nRooting 或越狱（越狱是 Apple 设备的特殊术语）是破坏移动设备启动加载程序上的数字权限管理 (`DRM`) 的行为，以便以\
  \ root 权限操作设备。Rooted 用户可以操纵操作系统、启用或禁用硬件功能，并安装应用商店中不可用的应用程序。Rooting 可能会允许用户更改操作系统或运行应用商店中不可用的应用程序，但这没有风险。在\
  \ Rooted 状态操作也会降低安全性，因为具有完全 root 权限启动了许多形式的恶意代码。当用户已 Root 或越狱设备时，组织应禁止在公司网络上使用 Rooted\
  \ 设备或访问公司资源。某些情况下，Rooted 设备提供的益处可能超过其风险，但此类设备应作为独立设备运行，而不是公司终端设备。此外，用户应考虑在 Rooting\
  \ 有益时在正常设备上使用 Rooted 设备。\n\n截至 2017 年，完全拥有的设备进行 Rooting 是合法的，但《数字千年版权法案》允许此类操作的豁免将于\
  \ 2017 年底过期。在尝试这样做之前，务必查看 Rooted 设备的合法性。如果其他豁免或新立法未能恢复 Rooted 设备的合法性，那么从 2018 年开始将再次变为非法。如果你被发现制作帮助他人\
  \ Root 设备，这被视为比 Root 自己的设备更严重的行为。\n\n即使 Rooting 是合法的，也要记住仍存在某些限制。首先，只有在你完全拥有该设备时它才是合法的；如果你签署了期一年或两年的硬件合约；或者如果你处于租购合同且在合同完成之前并不完全拥有该设备。因此，在完全拥有设备之前\
  \ Root 是非法的。其次，合法的 Root 不需要制造商、供应商或运营商履行任何保修。在大多数情况下，任何形式的系统篡改（包括 Root）都会使你的保修失效。Rooting\
  \ 还可能导致你的支持合同或更换合同失效。第三，Rooting 被运营商和某些产品供应商积极抑制。Rooted 设备可能不允许在运营商网络上运行，或者可能被禁止访问资源、下载应用或接收更新。\n\
  \n### 侧载 (Sideloading)\n\n侧载是通过某种形式的文件传输或 USB 存储方法将应用安装到设备上的活动，而不是从应用商店安装。除非 Apple\
  \ iOS 设备已越狱，否则无法进行侧载。如果 Android 设备启用了“从未知源安装应用”(Install Apps From Unknown Sources)，则可以侧载。\n\
  \n大多数组织应该禁止用户侧载，因为这可能是绕过应用商店或 `MDM` 实施的安全限制的一种。\n\n### 自定义固件\n\n移动设备预装了供应商或运营商提供的固件或操作系统。固件可以通过供应商或运营商提供的升级进行更新。如果设备已\
  \ Root 或越狱，它可以允许用户安装自定义自定义固件来替代默认固件。自定义固件可以移除供应商或运营商包含的臃肿软件，添加或移除功能，并精简操作系统以优化性能。网络上有专门针对\
  \ Apple 和 Android 设备自定义固件的讨论论坛和社区，例如 [xda-developers.com](http://xda-developers.com)（小心，名称中要包含连字符！）和\
  \ [howardforums.com](http://howardforums.com)。\n\n组织不应允许用户运行带有自定义固件的移动设备，除非该固件经过组织的预批准。某些自定义固件在安装完成后可以恢复到非\
  \ Root 状态。\n\n### 运营商解锁 (Carrier unlocking)\n\n大多数直接从运营商购买的移动设备都是运营商锁定的（carrier\
  \ locked）。这意味着在移除锁定或解锁之前，你无法在任何其他运营商网络上使用该设备。一旦你完全拥有设备，运营商应该免费解锁手机，但你必须专门请求，如[图\
  \ 2.40](#c02.xhtml#figure2-40）所示；他们不会自动执行。如果你账户状况良好并前往具有兼容运营商服务的另一个国家，你可能让运营商为你的旅行解锁手机，以便你临时使用另一个\
  \ SIM 卡进行本地运营商服务。\n\n设备运营商解锁并不等同于 Rooting。运营商解锁状态仅允许更换 SIM 卡以使用另一运营商的服务（这在技术上仅当你的设备与运营商使用相同的射频时才可能）。\n\
  \n运营商解锁的设备不应给组织带来任何额外风险；因此可能不需要在公司网络上禁止运营商解锁设备。\n\n#### 固件 OTA 更新\n\n\n\n固件 OTA\
  \ 更新是对移动设备现有固件的升级、补丁和改进，这些更新是从电信运营商或供应商通过无线传输（OTA）方式下载的。某些电信运营商不会将固件下载计入流量限制，但你可能仍然发现通过\
  \ WiFi 下载 OTA 更新更快、也更可靠。通常情况下，作为移动设备的所有者，一旦新的固件 OTA 更新可用，你就应该将其安装到设备上。然而，某些更新可能会更改设备配置或干扰\
  \ `MDM` 限制。组织应该在允许托管设备接收更新之前尝试对新更新进行测试。可能需要设立一个等待期，以便 `MDM` 供应商更新其管理产品，以妥善监督新固件更新的部署和配置。\n\
  \n## 相机使用\n公司安全策略需要涵盖带有摄像头的移动设备。某些环境禁止任何类型的摄像头。这要求授权设备必须不带摄像头。如果允许使用摄像头，则应明确记录何时可以使用以及何时不能使用摄像头，并向员工进行说明。移动设备可以作为存储设备，提供指向外部提供商或服务的备用无线连接路径，还可以用于收集泄露机密信息或设备的图像和视频。\n\
  \n如果地理围栏（geofencing）可用，则可以使用 `MDM` 实施特定区域的硬件禁用配置，以便在设备位于公司场所时关闭摄像头（或其他组件），并在设备离开地理围栏区域后恢复该功能为运行状态。\n\
  \n## SMS/MMS\nSMS（短信服务，也称为文本信息）和 MMS（多媒体短信服务）是电信运营商提供的通信功能，通常用于移动设备。MMS 允许将图像、视频以及其他文件随文本消息一起发送给接收者。\n\
  \nSMS 和 MMS 的风险和收益通常与电子邮件相当。阻止附件和文件交换是一个好主意，需要进行垃圾邮件过滤（尽管即时消息垃圾邮件可能被称为 `SPIM`），需要建立社会工程防御，并且必须对用户进行培训，以规避风险并减少干扰。\n\
  \n## 外部媒体\n许多移动设备支持可拆卸存储。某些智能手机支持 `microSD` 卡，而大多数较大的设备（如平板电脑和笔记本电脑）支持 `SD` 卡和其他媒体卡格式，这些卡可用于扩展移动设备的可用存储空间。然而，大多数手机需要拆卸后盖，有时还需要拆卸电池才能添加或移除存储卡。较大的手机、平板电脑和笔记本电脑可能支持设备侧面易于访问的卡槽。\n\
  \n此外，还有移动存储设备可以通过内置无线接口提供基于 `Bluetooth` 或 `WiFi` 的存储数据访问。\n\n组织需要考虑在便携式和移动设备上使用可拆卸存储是一项便利的优势，还是一个重大的风险向量。如果是前者，则需要适当的访问限制和使用培训；如果是后者，则可以通过\
  \ `MDM` 禁止可拆卸存储。\n\n## USB OTG\n`USB` 是一种规范，允许带有 `USB` 端口的移动设备充主机并使用其他标准外设 `USB`\
  \ 设备，如存储设备、鼠标、键盘和数字相机。如果 `USB OTG` 被认为组织内使用的移动设备的风险向量，则可以通过 `MDM` 禁用。\n\n## 录音麦克风\n\
  大多数带有扬声器的移动设备都有麦克风。麦克风可录制附近的音频、噪音声音。许多设备还支持通过 `USB` 适配器或 `1/8″` 立体接头连接外部麦克风。如果麦克风录音被视为安全风险，则应使用\
  \ `MDM` 禁用此功能，或禁止移动设备进入敏感区域或会议。\n\n## GPS 标记\nGPS 标记与地理定位和地理标记相同。请参见前面的章节“地理定位”。这也是一个可以使用\
  \ `MDM` 禁用的功能。\n\n## WiFi 直接/点点\n`WiFi Direct` 是自形成网络（ad hoc）或点对连接无线拓扑结构的新名称。它是无线设备直接连接而无需中间基站的手段。`WiFi\
  \ Direct` 支持 `WPA-2`，但并非所有设备都能支持这种可选的加密方案。`WiFi Direct` 用于广泛的功能，包括传输并在显示器或电视上显示媒体、向打印机发送打印作业、控制家庭自动化产品、控制监控摄像头以及控制电子相框。\n\
  \n在商业环境中，只有在可以使用 `WPA-2` 的地方才应使用 `WiFi Direct`。否则，明文通信风险太大。\n\n## 热点（Tethering）\n\
  热点是将移动设备的蜂网络数据连接与其他设备共享活动。数据共享可以通过 `WiFi`、`Bluetooth` 或 `USB` 线进行。某些服务提供商在其服务计划中包含热点功能，而另一些则收取额外费用，甚至完全阻止热点功能。\n\
  \n热点可能代表对组织的风险。它是用户为原本网络隔离的设备授予接入访问的手段，并可以作为绕过公司对互联网使用过滤、拦截和监控的手段。因此，当移动设备位于公司设施内时，应阻止热点。\n\
  \n## 支付方式\n有很多基于移动设备的支付系统。有些基于 `NFC`，有些基于 `RFID`，有些基于 `SMS`，还有一些基于光学摄像头的解决方案，例如扫描二维码（`QR`\
  \ 码）。移动支付对于购物者来说很方便，但并不总是一种安全的机制。用户应仅使用需要每笔交易确认或需要解锁设备并启动应用程序才能执行交易的移动支付解决方案。如果没有这些措施，可能会克隆设备的非接触支付信号并进行交易滥用。\n\
  \n组织不太可能基于移动支付解决方案产生任何额外风险。但在公司所有设备上实施这些方案或将其与公司财务账户关联时，仍应保持谨慎。\n\n## 部署模型\n目前有多种部署模型允许员工在工作期间使用或提供移动设备，并在办公室外执行工作任务。然而，在讨论这些之前，我们将看看移动设备策略在涉及个人或便携式电子设备（`PED`）与组织\
  \ IT 基础设施和业务任务的关系时必须解决的若干额外关注点。\n\n\n\n\n### 数据所有权\n当使用个人设备执行业务任务时，个人数据和业务数据很可能会发生混合。某些设备支持存储分段，但并非所有设备都能提供数据类型隔离。建立数据所有权可能会非常复杂。例如，如果设备丢失或被盗，公司可能希望触发远程擦除，以清除设备上的所有价值信息。然而，员工通常会对此产生抵触，特别是如果设备有机会被找回或归还。擦除会删除所有业务和个人数据，这对于个人来说可能是巨大的损失——特别是如果设备被找回，因为那时擦除看起来就像过度反应。应该建立关于数据所有权的明确政策。某些\
  \ MDM 解决方案可以提供数据隔离/分段，并在不影响个人数据的情况下业务数据清理。\n\n关于数据所有权的移动设备策略应涵盖移动设备的备份。业务数据和个人数据应受到备份方案的保护——可以是针对设备上所有数据的单一方案，也可以针对每种类型或类别数据的独立方案。这降低了发生远程擦除事件以及设备故障或损坏时数据丢失的风险。\n\
  \n### 支持所有权\n当员工的移动设备发生故障、缺陷或损坏时，谁负责设备的维修、更换或技术支持？移动设备策略应定义公司将提供哪些支持，哪些支持留给个人，以及在相关情况下其服务提供商。\n\
  \n### 补丁管理\n移动设备策略应定义个人所有移动设备补丁管理的手段和机制。用户是否负责安装更新？用户是否应该安装所有可用的更新？组织是否应在设备上安装之前测试更新？更新是通过空中（通过服务提供商）处理还是通过\
  \ WiFi 处理？\n\n### 反病毒管理\n移动设备策略应规定是否在移动设备上安装反病毒、反恶意软件和反间谍软件的扫描器。策略应指示推荐使用的产品和应用程序，以及这些解决方案的设置。\n\
  \n### 取证\n移动设备策略应处理与移动设备相关的取证和调查问题。用户需要意识到，在发生安全违规或犯罪活动时，他们的设备可能会卷入其中。这将要求从这些设备中收集证据。某些证据收集过程可能具有破坏性，而某些法律调查则需要没收设备。\n\
  \n### 隐私\n移动设备策略应处理隐私和监控。当使用个人设备执行业务任务时，用户通常会失去他们在在工作中使用移动设备前所享有的部分或全部隐私。员工可能需要同意在移动设备上被跟踪和监控，即使在非公司场所且非工作时间内。在移动设备策略下使用的个人设备应被个人视为“准公司财产”。\n\
  \n### 入职/离职\n移动设备策略应处理个人移动设备的入职和离职程序。移动设备入职包括安装安全、管理和生产力应用程序，并实施安全高效的配置设置。移动设备离职包括对业务数据进行正式擦除以及移除任何业务特定的应用程序。在某些情况下，可能会规定全设备擦除和出厂重置。\n\
  \n### 遵循公司政策\n移动设备策略应明确指出，使用个人设备进行业务活动并不意味着员工无需遵守公司政策。员工应将移动设备视为公司财产，并遵守所有限制，即使在离开办公场所和非工作时间也是如此。\n\
  \n### 用户接受\n移动设备策略在在工作中使用个人设备的所有元素上需要清晰且具体。对于许多用户来说，移动设备策略下实施的限制、安全设置和 MDM 跟踪将比他们预期的要困难得多。因此，组织应该在允许个人设备进入生产环境之前，努力解释移动设备策略的细节。只有在员工表达了同意和接受（通常通过签名）后，其设备才应入职。\n\
  \n### 架构/基础设施考虑\n在实施移动设备策略时，组织应评估其网络和安全设计、架构和基础设施。如果每个员工都带入个人设备，网络上的设备数量可能会翻倍。这需要规划处理\
  \ IP 分配、通信隔离、数据优先级管理、增加的入侵检测系统 (`IDS`)/入侵防御系统 (`IPS`) 监控负载，以及内部和跨任何互联网链路的带宽消耗。大多数移动设备都支持无线功能，因此这可能需要更稳健的无线网络，并处理\
  \ WiFi 拥堵和干扰。考虑移动设备策略需要考虑到它将触发的设施成本。\n\n### 法律关注问题\n公司律师应评估移动设备的法律关注问题。在执行业务任务时使用个人设备可能意味着责任负担和数据泄露风险的增加。移动设备可能会让员工开心，但对组织来说可能并不值得或符合成本效益。\n\
  \n### 可接受使用政策\n移动设备策略应引用公司的可接受使用政策，或包含一个关注独特问题的移动设备特定版本。在工作中使用个人设备时，信息泄露、分心和访问不当内容的风险将会增加。员工应时刻记住，工作时的首要目标是完成生产力任务。\n\
  \n#### BYOD\nBYOD 是一种允许员工自带个人设备上班，并使用这些设备通过公司网络连接业务资源和互联网的政策。虽然 BYOD 可能会提高员工士气工作满意度，但它增加了组织的安全风险。如果\
  \ BYOD 政策是开放的，任何设备都可以连接到公司网络。并非所有移动设备都具有安全功能，因此此类策略允许不合规设备进入生产网络。\n\n用户需要理解在工作中使用自己设备的益处、限制和后果。阅读并签署\
  \ BYOD 政策，外参加概述或培训计划，可能足以实现合理的认知。\n\n#### COPE\n“公司所有，个人启用” (COPE) 的概念意味着组织购买设备并提供给员工。然后每个用户都可以自定义设备，并将其用于工作活动和个人活动。COPE\
  \ 允许组织精确选择哪些设备允许进入组织网络——仅限可以配置为符合安全策略的设备。\n\n#### CYOD\n“自选设备”(CYOD) 的概念为用户提供一份批准设备列表，让他们从中选择实施的设备。CYOD\
  \ 可以实施为让员工从批准列表中购买自己的设备（BYOD 变体），或由公司为员工购买设备（COPE 变体）。\n\n#### Corporate-owned\n\
  \n\n\n\n\n公司拥有的移动策略是指公司购买支持符合安全策略的移动设备。这些设备应专门用于公司业务，用户不应在设备上执行任何个人任务。这通常要求员工携带第二台设备供个人使用。\n\
  \n## VDI\n\n虚拟桌面基础设施 (VDI) 是一种通过在中央服务器上托管虚拟机并让用户进行远程访问，来降低终端设备安全风险和性能需求的方法。VDI 已应用于移动设备，并已广泛用于平板电脑和笔记本电脑。它是一种在中央服务器上保留存储控制权、获取更高层次的系统处理和其他资源的方法，并允许低端设备访问超出其硬件能力的软件和服务。\n\
  \n这导致了虚拟移动基础设施 (VMI) 的出现，移动设备的操作系统在中央服务器上实现虚拟化。因此，传统移动设备的大部分操作和活动不再发生在移动设备本身上。这种远程虚拟化允许组织比使用标准移动设备平台获得更大的控制力和安全性。它还能让个人拥有设备在不增加风险配置的情况下与\
  \ VDI 交互。这种概念需要一个专用的隔离无线网络，以防止 BYOD 设备通过 VDI 解决方案之外直接与公司资源交互。\n\n## 考试要点\n\n- **了解各种连接方法的基础知识。**\
  \ 你应该对各种移动设备连接方法有基本的了解，包括蜂窝、WiFi、卫星通信 (SATCOM)、蓝牙、NFC、ANT、红外和 USB。\n\n- **理解移动设备安全。**\
  \ 设备安全涉及移动设备可能提供的各种潜在安全选项或功能。并非所有便携电子设备 (PEDs) 都具有良好的安全功能。PED 安全功能包括全设备加密、远程擦除、锁定、屏锁、GPS、应用控制、存储分段、资产跟踪、库存控制、移动设备管理、设备访问控制、可移动式存储以及禁用未使用功能。\n\
  \n- **熟悉移动设备安全管理概念。** 随着手机和其他移动设备与互联网以及公司网络交互的能力不断增强，它们面临的安全风险日益增加。移动设备正成为黑客和恶意代码的目标。移动设备提供了广泛的安全功能。移动设备管理\
  \ (MDM) 是一种软件解决方案，用于解决员工用于访问公司资源的海量移动设备的挑战性任务。\n\n- **理解移动设备应用管理。** 应用控制或应用管理是一种设备管理解决方案，限制了设备上可以安装哪些应用程序。它也可以用于强制安装特定应用程序，或强制某些应用程序的设置，以支持安全基准或维护其他形式的合规。\n\
  \n- **理解移动设备内容管理。** 内容管理涉及控制移动设备及其对托管在公司系统的内容的访问，以及控制对存储在移动设备上的公司数据的访问。\n\n- **了解如何执行移动设备远程擦除。**\
  \ 如果设备丢失或被盗，应执行远程擦除或远程清理。远程擦除允许远程删除设备上的所有数据，甚至可能是配置设置。\n\n- **理解移动设备地理围栏。** 地理围栏是指指定特定的地理区域，用于在移动设备上实现功能。地理围栏可以通过\
  \ GPS 坐标、无线室内定位系统 (IPS) 或特定无线信号的存在与否定义。\n\n- **理解移动设备地理定位。** 地理定位或地理标记是移动设备在其创建的任何媒体中包含其位置详情的能力。\n\
  \n- **了解如何使用移动设备屏锁。** 屏锁旨在防止他人随意拿起并使用你的手机或移动设备。\n\n- **熟悉移动设备推送通知服务。** 推送通知服务能够向你的设备发送信息，而不是让设备（或其应用）从在线资源拉取信息。\n\
  \n- **理解移动设备上下文感知认证。** 上下文感知认证是对传统认证手段的改进。上下文认证将评估用户尝试访问系统的源头和上下文。\n\n- **能够描述移动设备容器化。**\
  \ 容器化是内部托管系统以及云提供商/服务虚拟化趋势演变的下一阶段。容器化可以与移动设备结合使用，方法是在公司云的容器化主机上托管主操作系统；然后实际的移动设备仅作为\
  \ OS 容器的远程控制接口，而不是让设备本身运行业务应用和公司数据。\n\n- **理解设备设备存储分段。** 存储分段用于在存储介质上人为地划分不同类型或取值的数据。在移动设备上，设备制造商和/或服务提供商可能会使用存储分段将设备的操作系统和预装应用与用户安装的应用及用户数据隔离开。\n\
  \n- **了解第三方应用商店的安全问题。** 第三方应用源代表了组织网络数据泄露或恶意代码入侵风险的增加。\n\n- **定义根 (Rooting) 和越狱\
  \ (Jailbreaking)。** 根或越狱是破坏移动设备引导程序上数字版权管理 (DRM) 安全的行为，以便以 root 或全系统权限操作设备。\n\n\
  - **理解侧载 (Sideloading)。** 侧载是通过某种形式的文件传输或 USB 存储方法将安装文件带到设备上并安装应用程序的活动，而不是从应用商店安装。\n\
  \n- **熟悉自定义固件。** 移动设备预装了供应商或电信运营商提供的固件或核心操作系统。如果设备被根或越狱，可以允许用户安装替代的自定义固件来取代默认固件。自定义固件可以移除供应商或运营商包含的臃肿软件，增加或删除功能，并精简操作系统以优化性能。\n\
  \n- **理解运营商解锁。** 大多数直接从运营商购买的移动设备都是运营商锁定的。这意味着在移除锁定或运营商解锁之前，无法在任何其他运营商网络上使用该设备。\n\
  \n- **了解如何使用固件 OTA 更新。** 固件 OTA 更新是从运营商或供应商通过空中 (OTA) 下载的移动设备现有固件的升级、补丁和改进。\n\n\
  - **定义 USB OTG。** USB On-The-Go (OTG) 是一种规范，允许带有 USB 端口的移动设备充当主机并使用标准外设 USB 设备，如存储设备、鼠标、键盘和数字相机。\n\
  \n- **定义 WiFi Direct。** WiFi Direct 是一种无线设备直接相互连接而无需中间基站的方法。\n\n- **定义热点共享 (Tethering)。**\
  \ 热点共享是将移动设备的蜂窝网络数据连接与其他设备共享活动。数据连接的共享可以通过 WiFi、蓝牙或 USB 线缆进行。\n\n\n\n\n\n# 理解移动设备应用安全。移动设备上使用的应用程序和功能需要安全保护。相关概念包括密钥管理、凭据管理、认证、地理标记、加密、应用程序白名单以及传递信任/认证。\n\
  \n# 定义 BYOD。自自带设备（BYOD）是一项政策，允许员工将自己的个人移动设备带到工作场所，并使用这些设备连接到（或通过）公司网络，以访问业务资源和/或互联网。虽然\
  \ BYOD 可能会提高员工士气和工作满意度，但它也增加了组织的安全风险。相关问题包括数据所有权、支持所有权、补丁管理、防病毒管理、取证、隐私保护、入职/离职、对公司政策的遵循情况、用户接受度、架构/基础设施考虑、法律问题、可接受使用政策以及机载摄像头和视频。\n\
  \n# 定义 COPE。COPE 代表公司所有、个人启用（corporate owned, personally enabled）。它允许组织购买设备并提供给员工。每个用户随后都可以自定义设备，并将其用于工作活动和个人活动。\n\
  \n# 定义 CYOD。CYOD 代表自选 own 设备（choose your own device）。这一概念为用户提供一份已批准的设备列表，用户从中从中选择要实施的设备。\n\
  \n# 熟悉公司所有移动策略。公司所有型移动策略是指公司购买支持符合安全策略的移动设备。这些设备应专门用于公司业务，用户不应在这些设备上执行任何个人任务。\n\n\
  # 理解 VDI 和 VMI。虚拟桌面基础设施（VDI）是一种通过在中央服务器上托管用户远程访问的虚拟机，来减少终端设备安全风险和性能要求的方法。这催生了虚拟移动基础设施（VMI），其中移动设备的操作系统在中央服务器上实现虚拟化。\n\
  \n## 2.6 给定场景，实现安全协议。\n\n通过实现安全通信协议可以显著提高组织的安全态。本节讨论了许多可以用于为通信加密的协议。\n\n### 协议\n\
  \nTCP/IP 是互联网及全球大多数私有网络使用的主要协议族。TCP/IP 是一套最初并非围绕全球网络概念设计的协议，安全也不是其主要特性。然而，TCP/IP\
  \ 是互联网上使用的主要协议，IP 和 TCP 还支持许多安全协议和附加功能。\n\nTCP/IP 协议族的通用知识对于 Security+ 考试是必要的，但它被假设是先修知识基础，主要源自\
  \ CompTIA Network+ 认证。如果你通不熟悉 TCP/IP，请咨询 Network+ 学习材料或在网上搜索 TCP/IP。\n\nIPv4 广泛使用，采用\
  \ 32 位地址方案。大多数公共网络仍然基于 IPv4；然而，可用的公共 IPv4 地址非常稀缺。IPv4（以及 IPv6）运行在 OSI 协议栈的网络层，即第\
  \ 3 层。\n\nIPv6 在 1998 年的 RFC 2460 中定稿。它使用 128 位地址方案，消除了广播和分片，并包含了原生通信加密功能。它于 2012\
  \ 年 6 月 6 日在互联网上正式启用。向 IPv6 的迁移仍在缓慢进行，但速度开始加快。要查看全球公共 IPv6 部署进展，请查看 Google 的 IPv6\
  \ 统计页面（图 2.41 ）位于 `https://www.google.com/intl/en/ipv6/statistics.html`。\n\n```\n\
  ![图 2.41 Google 的 IPv6 统计数据 ](img/c02f041.jpg)\n```\n\n图 2.41 Google 的 IPv6 统计数据\n\
  \n在任何情况下，使用安全协议都不会是一个坏主意。在每次数据通信中，如果存在安全协议，请使用它。如果存在安全协议，请使用它。\n\n### DNSSEC\n\n\
  域名系统（DNS）是用于公共和私有网络的层级命名方案。DNS 将 IP 地址与人类可读的全限定域名（FQDN）连接起来。FQDN 由三个部分组成：\n\n* 顶级域名（TLD）——[com](http://www.google.com)\n\
  * 域名——[google](http://www.google.com)\n* 子域名或主机名——[www](http://www.google.com)\n\
  \nDNSSEC（DNS 安全扩展）为 DNS 提供保护。TLD 可以是许多原始 TLD 中的任意一个：[com](http://www.google.com)、[org](http://www.google.com)、[edu](http://www.google.com)、[mil](http://www.google.com)、[gov](http://www.google.com)\
  \ 和 [net](http://www.google.com)——以及较新的 TLD，如 [info](http://www.google.com)、[museum](http://www.google.com)、[telephone](http://www.google.com)、[mobi](http://www.google.com)、[biz](http://www.google.com)\
  \ 等。还有被称为国家代码的变体。（访问 [www.iana.org/domains/db/](http://www.iana.org/domains/db/)\
  \ 获取有关当前 TLD 的详情。注：第七个原始 TLD 是 [int](http://www.google.com)，代表国际，已被国家代码取代。）\n\n\
  注册域名必须在任何批准的域名注册处正式注册，例如 Network Solutions 或 GoDaddy。\n\nFQDN 的左侧部分可以是单个主机名（例如 [www](http://www.google.com)、[ftp](http://www.google.com)\
  \ 等），也可以是多段划分（例如 server1.group3.bldg5.mycompany.com）。\n\nFQDN 的总长度不能超过 253 个字符（包括点）。单个部分不能超过\
  \ 63 个字符。FQDN 只能包含字母、数字和连字符。\n\n每个注册域名都有分配的权威名称服务器。权威名称服务器托管该域名的区域文件。区域文件是关于特定域的资源记录集合或详细信息。有许多可能的资源记录（参见\
  \ [`en.wikipedia.org/wiki/List_of_DNS_record_types`](http://en.wikipedia.org/wiki/List_of_DNS_record_types)）；最常见的列在表\
  \ 2.4 [#c02.xhtml#table2-4] 中。\n\n表 2.4 常见资源记录\n\n| 记录 | 类型 |  |\n| --- | --- |\
  \ --- |\n| A | 地址记录 | 将 FQDN 链接到 IPv4 地址 |\n| --- | --- | --- |\n| AAAA | 地址记录 |\
  \ 将 FQDN 链接到 IPv6 地址 |\n| PTR | 指针记录 | 将 IP 地址链接到 FQDN（用于反向查询） |\n| CNAME | 规范名称\
  \ | 将 FQDN 别名链接到另一个 FQDN |\n| MX | 邮件交换 | 将邮件和消息相关的 FQDN 链接到 IP 地址 |\n| NS | 名称服务器记录\
  \ | 指定权威名称服务器的 FQDN 和 IP 地址 |\n| SOA | 区域起始记录 | 指定有关区域文件的权威信息，如主名称服务器、序列号、超时和刷新间隔\
  \ |\n\n\n\n\n\n最初，DNS 是通过一个名为 `HOSTS` 的静态本地文件处理的。该文件仍然存在，但动态 DNS 查询系统已很大程度上取代了它，特别是对于大型私有网络以及互联网。当客户端软件指向\
  \ FQDN（完全限定域名）时，协议栈会启动 DNS 查询，以便将名称解析为用于构建 IP 报头的 IP 地址。解析过程首先检查本地 DNS 缓存，以查看答案是否已知。DNS\
  \ 缓存由来自本地 `HOSTS` 文件的预加载内容以及在当前启动会话期间执行的任何 DNS 查询（尚未超时）。如果缓存中没有所需的答案，则会向本地 IP 配置中指定的\
  \ DNS 服务器发送 DNS 查询。解析查询的过程既有趣又复杂，但大部分内容与 Security+ 考试无关。要更深入探索 DNS，请参阅 [`en.wikipedia.org/wiki/Domain\\\
  _Name\\_System`](http://en.wikipedia.org/wiki/Domain_Name_System) 和 [`unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html`](http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html)。\n\
  \nDNS 通过 TCP 端口 53 和 UDP 端口 53 运行。TCP 端口 53 用于区域传输。这些是 DNS 服务器之间用于特殊手动查询的区域文件交换，或者当响应超过\
  \ 512 字节时使用。UDP 端口 53 用于大多数典型的 DNS 查询。\n\nDNS 安全性扩展是对现有 DNS 基础设施的安全改进。DNSSEC 的主要功能是在\
  \ DNS 操作期间为设备之间提供可靠的身份验证。DNSSEC 已在 DNS 系统的大部分范围内实施。每个 DNS 服务器都会发放一个数字证书，用于执行双向证书认证。DNSSEC\
  \ 的目标是防止各种 DNS 滥用，防止错误数据被注入解析过程。一旦完全实施，DNSSEC 将显著减少针对服务器的 DNS 滥用。\n\n### SSH\n\n\
  `Secure Shell (SSH)` 是 Telnet 以及许多 Unix “r”工具（如 `rlogon`、`rsh`、`rexec` 和 `rcp`）的安全性替代品。Telnet\
  \ 以明文通信为代价提供对系统的远程访问，而 SSH 传输是密文，因此受到免窃听的保护。SSH 通过 TCP 端口 22 运行。SSH 是在 Windows 中的\
  \ `HyperTerminal`、Linux 中的 `Minicom` 或两者中的 `PuTTY` 等终端编辑器程序中最常用的协议。SSH 的使用示例包括远程连接到交换机或路由器以进行配置。\n\
  \nSSH 提供了一种方法，可以在任何距离上与服务器、路由器、交换机或类似设备建立安全的命令行、纯文本界面连接。你可以通过 SSH 连接执行许多命令行或可编写脚本的活动，如\
  \ 图 2.42 所示。\n\n![图 2.42 Unix 版本的 SSH，显示了可用命令行选项列表 ](img/c02f042.jpg)\n\n图 2.42\
  \ Unix 版本的 SSH，显示了可用命令行选项列表\n\nSSH 以安全的加密形式传输身份验证流量和数据。因此，没有信息以明文形式交换。SSH 是一个非常灵活的工具。它可以作为\
  \ Telnet 的安全替代品；它可以用于加密类似于 `TLS` 的协议（如 `SFTP`）；并且可以作为 VPN 协议。\n\n### S/MIME\n\n\
  由于电子邮件原生是不安全的，因此已经开发了多种加密选项来为互联网上使用的电子邮件增加安全性。最常见的两种解决方案是 `Secure/Multipurpose Internet\
  \ Mail Extensions (S/MIME)` 和 `Pretty Good Privacy (PGP)`。\n\nS/MIME 是一种用于加密和数字签名电子邮件的互联网标准。S/MIME\
  \ 了电子邮件的标准 MIME 元素（该元素允许电子邮件携带附件和高阶文本信息：字体、颜色、大小、布局等），并将其扩展到包含消息加密。S/MIME 使用混合加密系统，结合了\
  \ `RSA`（一种非对称加密方案）和 `AES`（一种对称加密算法）来加密和保护电子邮件。\n\nS/MIME 的原理是从服务器获取原始消息，使用对称加密密钥对其加密，然后将其附加到新的空白电子邮件中。对称加密密钥本身使用接收者的公钥进行加密或封装，然后同样附加到空白电子邮件中。新的空白电子邮件包含发件者和接收者的电子邮件地址，以控制消息到其目的地的路由。接收者随后必须剥离附件，使用其私钥打开信封以提取对称密钥，然后解密原始消息。当以这种方式使用电子邮件加密时，机密性得到了保护。\n\
  \n如 图 2.43 所示，基本过程如下：\n\n1. 发件者系统生成随机对称密钥。\n2. 发件者使用随机对称密钥对消息加密。\n3. 使用接收者的公钥对对称密钥进行封装（加密）。\n\
  4. 将消息和信封发送给接收者。\n5. 接收者使用其私钥打开（解密）信封以提取对称密钥。\n6. 接收者使用对称密钥解密消息。\n\n![图 2.43 基于混合密码学的电子邮件加密过程\
  \ ](img/c02f043.jpg)\n\n图 2.43 基于混合密码学的电子邮件加密\n\n加密电子邮件的过程并不复杂；但实施起来很繁琐。幸运的是，大多数电子邮件客户端原生\
  \ S/MIME 支持自动化这一过程。S/MIME 电子邮件解决方案的唯一限制是所有通信伙伴都必须安装兼容的 S/MIME 产品，并使用通用或兼容的非对称加密密钥对。\n\
  \nS/MIME 是一种基于标准的电子邮件安全解决方案。一种专有的开源电子邮件安全解决方案是 Pretty Good Privacy (PGP)。请参阅第 6\
  \ 章“PGP/GPG”部分中的概念讨论。\n\n### SRTP\n\n`SRTP (Secure Real-Time Transport Protocol，或安全\
  \ RTP)` 是 `RTP (Real-Time Transport Protocol)` 的安全改进，用于许多 `VoIP (IP 语音)` 通信。SRTP\
  \ 旨在通过强大的加密和可靠的身份验证降低 VoIP DoS 的风险。\n\n### LDAPS\n\n`目录服务` 是受管理的网络资源。它实际上是网络索引或网络电话簿。通过使用目录服务，大型网络更容易导航、管理和安全。微软的\
  \ `Active Directory`、`OpenLDAP` 以及 Novell 的旧 `eDirectory`（或 `NDS`）都是目录服务的示例。这三者都基于\
  \ `LDAP (目录访问协议)`。\n\nLDAP 是一种允许客户端访问目录服务中资源的标准协议。目录服务是一种提供中央数据库访问的网络服务，该数据库包含有关网络上可用资源的详细信息。LDAP\
  \ 遵循 x.500 标准，该标准定义什么是目录服务以及如何构建和组织它（至少从基础基础设施的角度来看）。客户端可以使用至少由用户名和密码组成的身份验证通过 LDAP\
  \ 与目录服务资源进行交互。\n\n\n\n\n\nLDAP 目录结构是层次化数据模型，它们像树一样使用分支，并具有清晰标识和定义的根节点（参见图 2.44 ）。LDAP\
  \ 通过 TCP 端口 `389`（明文）和 `636`（安全）运行。用于明文认证的两种连接机制。它们分别被称为匿名绑定（anonymous bind，无身份验证）和简单绑定（simple\
  \ bind，明文密码认证）。保护 LDAP 而非让其以不安全的明文形式非常重要。这通过在 LDAP 上启用简单身份验证与安全层（`SASL`）来实现，该层在客户端身份验证以及所有数据交换中实现了传输层安全（`TLS`）。这导致了\
  \ `LDAP Secured (LDAPS)`。这并不是保护 LDAP 的唯一方法，但是 Security+ 考试中涉及的方法。\n\n![图 2.44 基于\
  \ LDAP 的目录服务结构示例](img/c02f044.jpg)\n\n**图 2.44** 基于 LDAP 的目录服务结构示例\n\n### FTPS\n\
  \n文件传输或交换的陈旧协议是 `File Transfer Protocol (FTP)`。该协议通常用于在不同系统之间移动文件，无论是在互联网上还是私有网络内部。理解\
  \ `FTP` 的基础知识以及安全的替代文件传输解决方案对于 Security+ 考试非常重要。\n\nFTP 是一种明文文件交换协议。任何使用 `TCP/IP`\
  \ 的计算机系统都支持它。FTP 服务器系统被配置为允许经过验证或匿名的 FTP 客户端登录以上传或下载文件。FTP 默认采用 TCP 端口 `20` 和 `21`。端口\
  \ `21` 用于会话管理，端口 `20` 用于数据传输。FTP 有两种连接选项：主动（active）和被动（passive）。主动 FTP 是 FTP 连接的原始方法。主动\
  \ FTP 的过程如下：\n\n1. 客户端使用随机源端口号（例如 `1060`）通过 TCP 端口 `21` 发起 FTP 服务器的会话管理连接。\n2. FTP\
  \ 服务器从 TCP 源端口 `20` 向 FTP 客户端发起的数据传输连接，其目标端口为比客户端原始源端口加 1 的端口（例如 `1061`）。\n\n这种技术仅在客户端未受防火墙、代理或\
  \ NAT 功能保护时有效，因为它需要从 FTP 服务器到 FTP 客户端的入站主动连接。在现在的大多数情况下，由于可能存在防火墙、代理或 NAT，FTP 通常以被动模式使用。被动\
  \ FTP 的过程如下：\n\n1. 客户端使用随机源端口号（例如 `1060`）通过 TCP 端口 `21` 发起 FTP 服务器的会话管理连接。\n2. 服务器选择一个随机端口号打开，以便接收第二个由客户端发起的连接（例如端口\
  \ `4081`），并通过现有的通信会话将该数字发送给客户端。\n3. 客户端再次发起一个到 FTP 服务器的数据传输连接，使用递增的客户端源端口号（例如 `1061`）到服务器建议的目标端口号（例如\
  \ `4081`）。\n\n文件交换是互联网、内网和外外网上的常见做法。FTP 是一个独立的平台，因此使得不同操作系统之间的文件交换变得简单。它是 DMZ 中部署的常用服务之一——DMZ\
  \ 是私有网络的扩展，互联网用户可以访问 Web 和电子邮件等服务，从而在允许内部客户端访问服务的同时，为公司资源受控的公共访问。\n\n由于所有 FTP 流量都以明文传输，它很容易受到数据嗅探和其他形式的窃听。不要在\
  \ FTP 上使用与你在安全环境中相同的用户账户和密码。否则，如果攻击者捕获了你的 FTP 登录流量，他们也获取了登录你的安全网络所需的登录凭据。务必为 FTP\
  \ 登录使用独立且不同的用户账户。嗅探器和协议分析器在本章稍前的“理解协议分析器”部分中讨论过。\n\n`Anonymous FTP` 是登录 FTP 服务器的一种无名登录形式。通常，希望匿名登录的\
  \ FTP 站点访问者使用 `anonymous` 单词作为登录名。然后他们会被提示提供电子邮件地址作为密码，但任何文本字符串都足够了。\n\n站点管理员应仔细配置允许匿名访问的\
  \ FTP 服务器。匿名用户不应能够下载（在许多情况下是查看）任何由匿名用户上传的文件文件。只有在绝对必要时才应启用匿名上传和下载。可能的情况下，不要在同一个\
  \ FTP 站点上同时允许经过验证和匿名的 FTP 登录。大多数 FTP 服务器默认启用了匿名 FTP，因此通常必须专门禁用它以限制对经过验证用户的访问。\n\n\
  如果允许 FTP 上传——特别是当允许匿名 FTP 上传时——确保无法通过 Web URL 访问上传文件夹。如果你不采取这一预防措施，网络访问者可能通过 HTTP\
  \ 从 FTP 站点下载文件，或者他们可能能够执行已上传的文件。这两种策略都被黑客广泛用于各种入侵攻击。\n\n`Blind FTP` 是匿名 FTP 或经过验证\
  \ FTP 的一种配置，其中上传的文件对访问者来说是不可见且不可读的。因此，用户可以上传文件但不能看到上传的结果。此外，即使使用户知道存放在你的盲 FTP 站点上的文件的确切路径和文件名，存入的文件也是只写的，因此无法进行读取或下载。这确保了你的\
  \ FTP 站点不会被文件交换者占满。\n\n\n\n\n\n无论采用何种安全 FTP 解决方案，服务器和客户端必须使用相同的解决方案。客户端和服务器必须具备兼容或可操作的\
  \ FTP 工具，以建立连接并支持文件交换。否则，FTP 会话的建立以及后续的文件传输通信将无法实现。\n\n## SNMPv3\n\n简单网络管理协议（SNMP）是一种被大多数网络设备和兼容\
  \ TCP/IP 的主机支持的标准网络管理协议。这些设备包括路由器、交换机、网桥、WAP、防火墙、VPN 设备、调制解调器、打印机等。通过使用控制台，可以使用\
  \ SNMP 与各种网络设备交互，获取状态信息、性能数据、统计数据和配置详情。某些设备支持通过 SNMP 修改配置设置。\n\n早期版本的 SNMP 依赖社区字符串（community\
  \ strings）的明文传输进行身份验证。社区是指 SNMP 控制台可以交互的网络设备集合。原始的默认社区名称为 `public` 和 `private`。最新版本的\
  \ SNMP 允许设备与控制台之间进行加密通信，并提供了自定义认证因素的强身份验证保护。\n\nSNMP 运行在 UDP 端口 `161` 和 `162` 上。UDP\
  \ 端口 `161` 用于 SNMP 代理（即网络设备）接收请求，而 UDP 端口 `162` 用于控制台接收响应和通知（也称为 trap 消息）。\n\n##\
  \ SSL/TLS\n\n传输层安全协议（TLS）是 Netscape 公司 SSL 的更新替代方案。TLS 通常与 SSL 相同，但它使用了更安全的加密协议和算法。它是目前保护各种基于第\
  \ 5 层及以上协议的通信的首选协议。\n\n`Secure Sockets Layer (SSL)` 和 `Transport Layer Security\
  \ (TLS)` 用于加密 浏览器与 Web 服务器之间的流量。通过使用 SSL 或 TLS，网络用户可以进行在线购买、与银行交互并访问私有信息，而无需暴露其通信内容。SSL\
  \ 和 TLS 可以使网络交易变得私密且安全。尽管它们不是真正的 VPN 协议，但 SSL 和 TLS 的工作方式与 VPN 非常相似。\n\nSSL 最初由\
  \ Netscape 开发，但它迅速成为互联网标准并被 TLS 取代。TLS 基于 SSL，但两者并不具有互操作性。SSL 运行在 TCP 端口 `443` 上，而\
  \ TLS 可以在默认的 TCP 端口 `443` 和 `80`（如 HTTP 所示）上运行。\n\n除了 Web 通信，SSL 还可以用于保护 FTP、网络新闻传输协议（NNTP）、电子邮件、Telnet\
  \ 以及其他应用层 TCP/IP 协议。然而，当 SSL 用于保护其他应用协议时，目标端口与使用 `443` 的 HTTPS 不同；其他示例包括 `465` 端口上的\
  \ SSL SMTP`993` 端口上的 SSL IMAP 以及 `995` 端口上的 SSL POP3。\n\nSSL/TLS 还可以为其他应用层协议（如 Telnet、FTP\
  \ 和电子邮件）提供加密会话。SSL/TLS 运行在 OSI 模型第 4 层（传输层）顶部。因此，任何第 5-7 层的协议都可以使用 SSL/TLS 进行加密。\n\
  \n当你使用 SSL/TLS 保护浏览器与 Web 服务器之间的通信时，必须完成一个多步握手过程来建立安全会话：\n\n1. 客户端请求安全连接。\n2. 服务器响应其证书、证书颁发机构（issuing\
  \ CA）名称及其公钥。\n3. 客户端验证服务器证书，生成会话（对称）加密密钥，使用服务器的公钥对密钥进行加密，并将加密后的密钥发送给服务器。\n4. 服务器解包会话密钥，并将使用会话密钥加密的会话摘要发送给客户端。\n\
  5. 客户端检查摘要，并将自己的摘要发回给服务器，同样使用会话密钥进行加密。\n6. 在双方都接收到匹配的会话摘要后，启动安全的 SSL 通信。\n\nSSL/TLS\
  \ 使用对称密钥作为会话密钥。SSL 可用的会话密钥包括 40 位和 128 位强度。目前 TLS 会话密钥可以跨越 128 位到 256 位之间。\n\n##\
  \ HTTPS\n\n万维网是一个庞大的、全球性的、临时的在线信息和商店集合。支持 Web 的主要协议是 `Hypertext Protocol Secure`。\n\
  \n## 安全的 POP/IMAP\n\n邮局协议（POP）和互联网消息访问协议（IMAP）通过实现 TLS（或过去的 SSL）加密来安全保护。这把这些协议转换为\
  \ `POPS` 和 `IMAPS`，并将它们的端口分别从 `110` 更改为 `995`，`143` 更改为 `993`。\n\nPOP 和 IMAP 是邮件提取协议，而\
  \ SMTP 是邮件发送或转发协议。当使用 TLS 加密形式的 SMTP、POP 或 IMAP 时，安全性仅存在于邮件客户端与本地邮件服务器之间。邮件服务器之间的任何后续邮件通信可能是加密的\
  \ SMTP 也可能不是。\n\n### 用例\n\n用例在不断扩大，在这些场景中数据传输、音频通信或其他信息交换需要安全协议。\n\n### 语音和视频\n\n\
  语音通信已从传统的固定电话转向使用蜂窝网络和 VoIP 的手机。将 VoIP 作为商务电话、家庭电话和手机的趋势只会继续增加。尽管某些 VoIP 解决方案可以提供端到端加密，但这似乎并不是行业标准，且不同系统之间往往无法进行加密。\n\
  \n### 时间同步\n\n\n\n\n时间同步是安全管理以及整体网络和系统管理的重要元素。许多基本功能和服务都依赖于可靠的时间信息。网络时间协议 (`NTP`)\
  \ 运行在 `UDP` 端口 `123` 上，用于同步系统钟之间以及系统与外部可靠时间源之间的同步。\n\n`NTP` 是一种明文协议，因此单独使用 `NTP`\
  \ 存在相关风险。某些 `NTP` 攻击可能简单地对时间同步事件进行监听。这可能会让攻击者获取更多关于你网络中系统的信息，因为 `NTP` 连接会泄露涉及的系统的源地址和目的地址。\n\
  \n虽然 `NTPv4` 提供了一些加密技术，但它们主要用于完整性检查，而不是机密性。可能有在系统之间实现 `IPSec` 或其他 `VPN` 会话，然后通过加密通道对\
  \ `NTP` 进行隧道传输。\n\n## 电子邮件和网页\n\n电子邮件和 Web 通信都可以使用其各自协议的 `TLS` 加密形式进行轻松保护。请参阅前文章节中“S/MIME”、“SSL/TLS”、“HTTPS”和“安全\
  \ POP/IMAP”的讨论。\n\n## 文件传输\n\n使用 `SSH` 或 `TLS` 加密形式的 `FTP` 可以轻松实现安全的文件传输；请参见本章前面的“SSH”、“FTPS”、“SFTP”和“SSL/TLS”章节。还有许多其他替代的文件传输协议；其中一些提供加密，但并非全部如此。因此，在实施或使用任何文件传输解决方案之前，务必研究其安全特性。\n\
  \n一种方案是使用 `P2P`（点对点）解决方案，例如 `BitTorrent`。`BitTorrent` 是 `P2P` 解决方案的一个示例，它提供了通信加密以及对交付数据进行完整性检查。\n\
  \n评估你的操作系统或第三方应用程序所使用的内部文件传输协议也很重要。在 `Linux` 和 `Unix` 上使用原生的 `Windows` 消息块 (`SMB`)\
  \ 服务或网络文件系统 (`NFS`) 是很常见的。这些文件传输工具虽然方便，但它们是明文的。你应该建立 `IPSec` 或其他 `VPN` 连接，然后将文件传输会话封装在\
  \ `VPN` 中，以这些这些工具安全性。\n\n## 目录服务\n\n目录服务是现代网络的关键功能。大多数客户端都应支持安全的目录服务交互形式，例如 `LDAPS`（或\
  \ `SASL`），因此应该要求这种安全手段。请参见早的章节“LDAPS”。\n\n## 远程访问\n\n远程访问服务器 (`RAS`) 是一种支持来自远程用户或系统连接的网络服务器。`RAS`\
  \ 系统通常支持调制解调器组、`VPN` 链接甚至终端服务连接。\n\n调制解调器（参阅 图 2.46 ））是一种通过电话线在两台计算机（或网络）之间创建网络通信链路的设备。调制解调器是仍被操作系统广泛支持的最慢远程连接方法之一。大多数连接被限于\
  \ 56 Kbps 的最大吞吐量。然而，由于便携系统可以使用任何可用电话线连接到公司办公室，调制解调器可能会在未来几年内继续存在。\n\n![图 2.46 远程工作站与\
  \ Windows 服务器之间使用调制解调器的 RAS 连接](img/c02f046.jpg)\n\n图 2.46 远程工作站与 Windows 服务器之间使用调制解调器的\
  \ RAS 连接\n\n远程工作站与 Windows 服务器之间使用调制解调器的 RAS 连接\n\n`回拨`\n\n`战争拨号`\n\n`远程身份验证`\n\n\
  `电话通信`\n\n`私用交换机 (PBX)`\n\n\n\n\n-   更改所有默认密码、账户和访问码\n-   启用日志记录\n-   限制长途电话\n-\
  \   用户意识与培训\n\n`Voice over IP (VoIP)` 是一种用于在 `TCP/IP` 网络上传输语音和/或数据的隧道机制。`VoIP` 具有替代或取代\
  \ PSTN（公共电话网）的潜力，因为它通常成本更低，并且提供了更多化的选项和功能。`VoIP` 可以作为计算机网络以及移动设备上的直接电话替代品。然而，`VoIP`\
  \ 能够支持视频和数据传输，从而实现视频会议和项目远程协作。`VoIP` 提供商业和开源两种选择。某些 `VoIP` 解决方案需要专用硬件来替换传统的电话筒/基站，或者允许这些设备连接到\
  \ `VoIP` 系统上运行。某些 `VoIP` 解决方案仅限软件，例如 `Skype`，它允许用户现有的扬声器、麦克风或耳机取代传统的电话筒。其他方案则更多基于硬件，例如\
  \ `magicJack`，它允许将接入 `USB` 适配器的现有 PSTN 电话设备利用互联网上的 `VoIP`。通常，`VoIP-to-VoIP` 通它是免费的（假设使用相同或兼容的\
  \ `VoIP` 技术），而 `VoIP-to-landline` 通话通常按分钟收费。虽然大多数 `VoIP` 协议支持加密，但它通常默认禁用的，或者由于连接到不兼容的接收者（例如从计算机\
  \ `VoIP` 工具拨打固网电话）而无法使用。\n\n## 域名解析\n\n`DNS` 安全应该被引起重视。如果你的 `DNS` 解析被伪造或监控，你的系统和/或组织可能会受到损害。`DNSSEC`\
  \ 是一种提高 `DNS` 解析安全性的手段；请参阅前面的“DNSSEC”部分进行相关讨论。\n\n## 路由与交换\n\n路由器和交换机之间的通信是攻击者的另一个潜在潜在目标。如果他们能够干扰路由表收敛或\
  \ `STP` 的收敛，攻击者可以将流量重定向到他们拥有物理或逻辑访问权限的路径，或者简单地实施 DoS（拒绝服务攻击）。在网络管理设备之间采用 `VPNs`或其他加密服务可以降低这些风险。\n\
  \n## 网络地址分配\n\n`Subnetting`（子网划分）是用于网络上的划分过程，用于将较大的主机组划分为较小的集合。子网划分的行为可能是根据所需的 IP\
  \ 类限制、基于子网的最大尺寸限制、物理限制、业务功能差异化或其他考虑而强制要求的。子网划分主要是一种逻辑活动，但它可用于指导或引导物理划分。事实上，许多大型组织在物理部署中会模仿其逻辑子网划分架构，以便于进行故障排除和维护。\n\
  \n最终，在 `TCP/IPv4` 协议中，子网划分由分配的主机 IP 地址及其相关的子网掩码定义。子网掩码是一个 32 位二进制数，指示主机 IP 地址（对于\
  \ `TCP/IPv4` 至少是 32 位二进制数）的哪些部分定义网络 ID（或子网 ID），哪些部分定义主机 ID。网络 ID 和子网 ID 在每个组织的私有网络内或跨公共互联网中是唯一的。主机\
  \ ID 仅在本地子网内是唯一的。就像区码定义电话号码所在的通用区域一样，网络 ID 定义了子网所在的位置。在一个区码和另一个区码之间存在重复的七位电话号码，在多个子网内部存在重复的主机\
  \ ID。然而，与电话号码不同，IP 地址始终以其完整的数字组合呈现，并在必要或重要时呈现其相关的子网掩码。\n\n例如，IP 地址 `193.25.172.56`\
  \ 配合子网掩码 `255.255.0.0` 可以从这种点点十进制表示法转换为二进制如下：\n\n| IP 地址 | 11000001000110011010110000111000\
  \ |\n| :--- | :--- |\n| 子网掩码 | 11111111111111110000000000000000 |\n| 网络 ID | 11000001000110010000000000000000\
  \ |\n| 主机 ID | 00000000000000001010110000111000 |\n\n通过只读取被子网掩码中的 1 标记或掩码的 IP 地址部分，显示网络\
  \ ID：`11000001000110010000000000000000`，或 `193.25.0.0`。\n\n通过只读取被子网掩码中的 0 标记或掩码的\
  \ IP 地址部分，显示主机 ID：`00000000000000001010110000111000`，或 `0.0.172.56`。\n\n子网内的主机能够直接与该子网内的任何其他主机通信。然而，要与其他子网的主机通信，流量必须流出子网指向目标主机所在的子网。这是通过将数据流发送到本地子网的默认网关实现的。默认网关只是你本地子网中路由器的接口。路由器随后读取目标\
  \ IP 地址并将流量导向其子网。\n\n可以使用子网划分控制通信、阻止访问、划分安全区域以及更多。这只是对该主题的通用概述。如果你还不熟悉如何进行子网划分 `TCP/IP`，请咨询\
  \ `Network+` 学习资料或在线搜索相关内容。\n\n网络地址分配应仔细考虑。在 `IPv4` 下，内部使用 `RFC1918` 的私有地址。这将防止外部实体与内部系统建立通信。然而，这将要求实施\
  \ `NAT/PAT` 以支持从内部系统到外部系统的通信。使用 `RFC1918` 和 `NAT/PAT` 将减少外部实体判断你网络规模和内部分配的能力。\n\n\
  IPv4 的另一个问题是可用公 地址非常少。这是一个问题，因为服务器通常需要自己的公 IP 地址。某些服务可以在同一个 Web 服务器 IP 地址上托管多个站点，但并非所有服务都能这样配置。客户端可以使用\
  \ `NAT` 无限扩展。但一旦没有了更多可用的 `IPv4` 地址，新的服务器就无法上线。迁移到 `IPv6` 对于互联网和其他互联技术的未来扩展至关重要。\n\
  \n## 订阅服务\n\n订阅服务正成为企业和个人常用的工具。各种类型的订阅正获得广泛支持；这些包括电子邮件、文档编辑、云存储、云备份、游戏、视频娱乐、`VoIP`\
  \ 和远程托管。\n\n无论使用何种订阅服务，都应确保在线服务服务器与客户端/订阅者/客户系统之间的连接经过加密。同样重要的是在线服务是否为客户数据库以及任何在线文件或数据提供适当的安全。\n\
  \n### 基础知识\n\n**理解 TCP/IP。**`TCP/IP` 是互联网和全球大多数私有网络中使用的主要的协议族。\n\n**了解 IPv4。**`IPv4`\
  \ 广泛使用，采用 32 位地址方案，运行在网络层或 OSI 协议栈的第 3 层。\n\n**理解 IPv6。**`IPv6` 使用 128 位地址方案，消除了广播和分片，并包含原生的通信加密功能。\n\
  \n**熟悉 DNS。**`DNS` 是公共和私有网络中均使用的分层命名方案。它将 IP 地址和人类友好的全限定域名 (FQDN) 关联在一起。\n\n\n\n\
  \n\n## 理解 DNSSEC\n`DNSSEC`（域名系统安全扩展）是对现有 DNS 基础设施的一种安全改进。`DNSSEC` 的主要功能是在执行 DNS\
  \ 操作时为设备之间提供可靠的身份验证。\n\n## 理解 SSH\nSecure Shell（`SSH`）是 `Telnet`、`rlogon`、`rsh`\
  \ 和 `RCP` 的安全替代。它可以被称为远程访问或远程终端解决方案。`SSH` 对身份验证和数据流量进行加密，并在 `TCP` 端口 `22` 上运行。\n\
  \n## 理解 Telnet\n`Telnet` 是一种终端仿真网络应用程序，支持远程连接以执行命令和运行应用程序，但不支持文件传输。`Telnet` 使用 `TCP`\
  \ 端口 `23`。\n\n## 了解密码学在保护电子邮件方面的常见应用\n加密消息的新兴标准是安全/多用途互联网邮件扩展（`S/MIME`）协议。另一种流行的电子邮件安全协议是\
  \ Phil Zimmerman 的优良隐私（`PGP`）。\n\n## 理解 SRTP\n`SRTP`（安全实时传输协议或安全 RTP）是对实时传输协议（`RTP`）的安全改进，用于许多\
  \ IP 语音（`VoIP`）通信。`SRTP` 旨在通过强健的加密和可靠的身份验证来尽可能减少 `VoIP` `DoS` 风险。\n\n## 了解 LDAP\n\
  轻量级目录访问协议（`LDAP`）允许客户端与目录服务资源交互。`LDAP` 基于 `x.500` 并使用 `TCP` 端口 `389` 和 `636`。它使用带有区域根的树结构。\n\
  \n## 理解 LDAPS\n`LDAPS`（安全 LDAP）通过在 `LDAP` 开启启用简单身份验证和安全层（`SASL`）来实现，它对客户端身份验证以及所有数据交换实施了传输层安全协议（`TLS`）。\n\
  \n## 注意 FTP\n文件传输协议（`FTP`）是一种明文文件交换解决方案。`FTP` 服务器系统允许经过身份验证或匿名的 `FTP` 客户端登录以上传或下载文件。`FTP`\
  \ 使用 `TCP` 端口 `20` 和 `21`。\n\n## 理解 FTPS\n`FTPS` 是 `FTP Secure` 或 `FTP SSL`，表示通过\
  \ `SSL`（现在是 `TLS`）保护的 `FTP` 变体。这种 `FTP` 服务变体与 `SFTP` 不同，后者是由 `SSH` 保护的 `FTP`。\n\n\
  ## 理解 SFTP\n安全 FTP（`SFTP`）是标准或基础 `FTP` 的安全替代方案，对客户端和服务器之间的身份验证和数据流量进行加密。`SFTP` 使用\
  \ `SSH` 提供安全的 FTP 通信。\n\n## 了解 TFTP\n简单文件传输协议（`TFTP`）是一种不需要身份验证的简单文件交换协议。它运行在 `UDP`\
  \ 端口 `69` 上。\n\n## 理解 SNMP\n简单网络管理协议（`SNMP`）是大多数网络设备和符合 TCP/IP 标准的主机支持的网络管理协议。这些包括路由器、交换机、网桥、`WAPs`、防火墙、VPN\
  \ 设备、调制调器、打印机等。\n\n## 熟悉 SSL 和 TLS\n安全套接层（`SSL`）和传输层安全（`TLS`）用于加密 浏览器与 Web 服务器之间的流量。`TLS`\
  \ 是 Netscape `SSL` 的更新替代品。通过使用 `SSL` 或 `TLS`，网络浏览用户可以进行在线购物、与银行交互并访问私人信息，而无需披露其通信内容。`SSL`\
  \ 和 `TLS` 可以使 Web 变得私安全。\n\n## 理解 HTTPS\n当使用 `SSL` 或 `TLS` 安全交易时，被称为 `HTTPS`。\n\n\
  ## 注意 POP/IMAP\n邮局协议（`POP`）和互联网访问协议（`IMAP`）是用于从邮件服务器检索电子邮件的协议。\n\n## 复习题\n\n1. 你可以在附录找到答案。\n\
