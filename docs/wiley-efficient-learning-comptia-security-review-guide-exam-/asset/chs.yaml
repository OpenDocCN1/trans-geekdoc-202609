  - 人员通道 (Mantrap)\n- 法拉笼\n- 锁的类型\n- 生物识别\n- 障碍/路柱\n- 令牌/卡片\n- 环境控制\n    - HVAC (暖通空调)\n\
  \    - 冷热通道\n    - 防火\n- 缆锁\n- 屏幕过滤器\n- 相机\n- 运动检测\n- 日志\n- 红外检测\n- 密钥管理\n\n![images](img/clogo.jpg)\
  \ `Security+` 考试将测试你对 IT 环境架构设计及其相关安全的理解。为了通过测试并有效地实施安全，你需要理解本章详细介绍的与网络安全设计和架构相关的概念和术语。\n\
  \n## 3.1 解释框架、最佳实践和安全配置指南的使用场景和目的。\n\n安全是复杂的。设计和实施安全的任务可能是如此令人敬畏，以至于许多组织可能会将其推迟到为时已晚，直到他们经历了严重的入侵或违规。简化这一过程（或至少是开始）的方法是采用来自信誉实体的定义的指南和建议。有许多政府、开源和商业的安全框架、最佳实践和安全配置指南，它们可以作为大小组织安全安全计划的起点和目标。\n\
  \n### 行业标准框架和参考架构\n\n安全框架是保护你组织资产安全的指南或计划。它为新组织和有历史的组织实施安全提供了一个结构。安全框架应该提供一种视角，即安全不仅仅是\
  \ IT 的问题，而且是一项重要的业务运营功能。一个设计良好的安全框架应该涵盖人员问题、网络安全、便携和移动设备、操作系统、应用程序、服务器和终端设备、网络服务、业务流程、用户任务、通信和数据存储。\n\
  \n行业标准框架是指被特定业务领域内大多数组织采纳并尊重的框架。参考架构可能会伴随安全框架出现。通常，参考架构是对虚构组织及其如何实施安全的详细描述。这一概念为现实世界的组织提供了指南，可以将其作为模板来适应和实施某一框架。\n\
  \n某些安全框架旨在帮助新组织实施其初始和基础的安全要素，而另一些框架则旨在改进现有的现场安全基础设施。\n\n#### 监管性 (Regulatory)\n\n\
  监管性安全框架是由政府法规或法律建立的安全指南。因此，监管性框架由政府机构制定或赞助。然而，这并不意味着其使用范围仅限于政府实体。许多监管性框架是公开可的，因此也可以被采纳并应用于私营组织。\n\
  \n安全框架不需要专门为某个组织设计，也不需要实施整个框架。每个组织都是独有的，因此应该使用几个框架来组装一个能够解决其特定安全需求的解决方案。\n\n####\
  \ 非监管性 (Non-regulatory)\n\n非监管性安全框架是任何由非政府实体制作的安全指南。这包括开源社区以及商业实体。非监管性框架可能需要许可费或订阅费才能查看和访问框架的细节。某些商业实体甚至会提供定制的实施指南或合规审计。\n\
  \n#### 国家级与国际级 (National vs. international)\n\n国家安全框架是专为特定国家内部而设计的安全指南。国家框架的作者可能会尝试限制对其框架细节的访问，以便将实施限制在仅有的本地行业。国家框架还可能包含特定国家的限制、要求、公用或其他关注点，这些点并不适用于任何或大多数其他国家。此类国家特有的细节也可能成为在其他地区使用此类框架的限制因素。\n\
  \n国际安全框架的设计初衷是独立于国家的。这些框架的制定目标是避免任何特定国家的限制或特殊性，以支持该框架在全球范围内的采用。遵循国际安全框架通过确保组织拥有兼容且等效的安全保护，简化了跨越国界的组织之间的交互。\n\
  \n#### 行业特定框架 (Industry-specific frameworks)\n\n行业特定框架是为适用于某一特定行业（如银行业、医疗保健、保险、能源管理、运输或零售）而设计的。这类框架针对行业内最常见的问题进行了调整，可能不那么容易适用于该目标之外的组织。\n\
  \n### 基准/安全配置指南\n\n基准 (Benchmark) 是一份记录记录的需求列表，用于确定系统、设备或软件解决方案是否允许在安全管理环境中运行（`Figure\
  \ 3.1`）。安全配置指南是基准的另一种术语。它也可以被称为标准或基线。\n\n![FIGURE 3.1 CIS 基准网站](img/c03f001.jpg)\n\
  \n`FIGURE 3.1` CIS 基准网站。\n\n基准可以包含有关产品安装和配置的特定说明。它还可能建议更改、修改以及辅助工具、实用程序、驱动程序和控制以提高系统的安全性。基准还可能建议操作步骤、`SOPs`（标准操作程序）和用户指南，以便在执行业务任务时维护安全。\n\
  \n基准可以从外部实体采纳，例如政府法规、商业指南或社区建议。但最终，基准应该根据组织的资产、威胁和风险进行定制。\n\n#### 平台/厂商特定指南\n\n\
  安全配置指南通常非常针对特定的操作系统/平台、应用程序或产品供应商。这类指南在保护产品方面非常有帮助，因为它们可以提供分步的、逐点击、逐命令的指令，来保护特定的应用程序、`OS`\
  \ 或硬件产品。\n\n##### Web 服务器\n\n基准和安全配置指南可以关注特定的 Web 服务器产品，例如微软的 `Internet Information\
  \ Service` 或 `Apache Web Server`。\n\n### 操作系统\n\n基准和安全配置指南可以关注特定的操作系统，例如 `Microsoft\
  \ Windows`、`Apple Macintosh`、`Linux` 或 `Unix`。\n\n##### 应用程序服务器\n\n基准和安全配置指南可以关注特定的应用程序服务器，例如\
  \ `Domain Name System (DNS)`、`动态主机配置协议 (DHCP)`、数据库、`网络附属存储 (NAS)`、`存储区域网络 (SAN)`、`目录服务`、`虚拟专用网络\
  \ (VPN)` 或 `IP 语音 (VoIP)`。\n\n##### 网络基础设施设备\n\n\n\n\n基准测试和安全配置指南可以关注特定的网络基础设施设备，例如防火墙、交换机、路由器、无线访问点、VPN\
  \ 集中器、Web 安全网关、虚拟机/管理程序或代理服务器。\n\n## 通用指南\n\n通用安全配置指南在建议方面更具通用性，而不是专注于单一的软件或硬件产品。这使得它们在许多情况下都非常有用，但对于如何具体实施这些建议，它们提供的细节和指令较少。针对产品的指南可能会提供数百个配置原生防火墙的步骤，而通用指南可能只提供几十条通用建议。此类指南将实现建议的具体操作留给系统管理员，由他们决定如何实现目标或实施建议。\n\
  \n### 深度防御/分层安全\n\n`Defense in depth`（深度防御）是指在实际或理论的同心圆或层级中使用多种类型的访问控制。这种分层安全的形式有助于组织避免单一的安全态势。单一思维认为，只需要一种安全机制就足以提供足够的安全性。\n\
  \n只有通过对防御措施进行智能组合，你才能构建出能够抵御重大且持续入侵尝试的防御。入侵者或攻击者需要攻破多层防御才能触及受保护的资产。\n\n与任何安全解决方案一样，依赖单一的安全机制是不明智的。`Defense\
  \ in depth`、`multilayered security`（多层安全）或 `diversity of defense`（防御多样性）在实际或理论的同心圆或层级中使用多种类型的访问控制。通过安全控制的冗余和多样性，环境可以避免单一安全功能失效的陷阱；环境有多次机会偏移、拒绝、检测和阻止任何威胁。当然，没有任何安全机制是完美的。每个独立的安全机制都有缺陷或解决方法等待黑客发现和利用。\n\
  \n### 供应商多样性\n\n供应商多样性对于建立深度防御非常重要，以避免由于单一供应商的设计、架构和安全理念导致的安全漏洞。没有哪个供应商可以提供完整的端到端安全解决方案来防止所有已知和未知的利用和入侵。因此，为了提高组织的安全态势，整合来自各种供应商、制造商和程序员的安全机制是非常重要的。\n\
  \n### 控制多样性\n\n控制多样性对于避免单一的安全结构至关重要。不要依赖单一形式或类型的安全；而是将多种安全机制集成到防御层中。使用三个防火墙的安全性不如使用一个防火墙、一个\
  \ IDS（入侵检测系统）和强身份验证。\n\n#### 行政控制\n\n行政控制通常包括安全策略，以及管理人员和监督业务流程的机制。确保行政控制的多样性是重要的，而不是依赖单一层或单一类型的安全机制。\n\
  \n#### 技术控制\n\n技术控制包括任何用于为 IT 基础设施提供安全的逻辑或技术机制。技术安全控制需要广泛且多样，以便建立起坚固的防护墙来防止入侵和利用尝试。单一防御（无论是单层还是相同防御的重复）都可能毁于单一攻击。多样化和多层的防御需要更复杂的攻击方法，需要一系列地成功利用多个漏洞并在不被发现的情况下才能攻破目标。这种使用一系列漏洞进行攻击的概念被称为\
  \ `daisy-chaining`（链式攻击）。\n\n#### 用户培训\n\n用户培训始终是任何安全工作的关键部分。需要培训用户如何在限制条件内执行其工作任务。\n\
  \n## 考试要点\n\n**关注框架**：安全框架是保护组织资产安全的指南或计划。它可能是监管性的、非监管性的、国家级或国际性的。\n\n**理解基准测试**：基准测试是系统要求的文档化列表。它可能是特定行业的也可能是通用的。\n\
  \n**定义深度防御**：`Defense in depth` 是在实际或理论的同心圆或层级中使用多种类型的访问控制。它包含了供应商多样性和控制多样性。\n\n\
  ## 3.2 给定场景，实现网络架构\n\n可靠的网络安全取决于坚实的基础。网络架构是你的网络的物理结构。本节讨论了许多架构概念。\n\n### 区域/拓扑结构\n\
  \n`network zone`（网络区域）是为特定目的设计的网络区域，例如内部使用或外部使用。网络区域是局域网（LAN）的逻辑和/物理划分或分段，允许额外的安全层（见图\
  \ 3.2）。每个安全区域都是具有单一定义安全级别的网络区域。该安全性可能关注授权访问、防止访问、保护机性和完整性，或限制流量。不同的安全区域通常托管不同类型的资源。区域通常通过使用唯一的\
  \ IP 子网和防火墙进行指定和隔离。网络区域的另一个术是网络拓扑结构。网络区域有很多类型；其中几种将在后续节中介绍。\n\n![FIGURE 3.2 A typical\
  \ LAN connection to the Internet](img/c03f002.jpg)\n\n**图 3.2** 典型的局域网到互联网的连接\n\n\
  ### DMZ\n\n`demilitarized zone (DMZ)`（非军事化区）是一个特殊的子网。网络由网络组件（如电缆和交换机）和主机（如客户端和服务器）组成。大型网络通常在逻辑和物理上划分为较小的互连网络。这些较小的网络被称为\
  \ `subnets`（子网）。子网通常相当通用，但某些具有特殊的用途和/或配置。\n\nDMZ 是网络的一个区域，专门设计供低信任用户访问特定系统，例如公众访问\
  \ Web 服务器。如果 DMZ（整体或作为 DMZ 内的单个系统）被破坏，私有局域网并不一定受到或破坏。对 DMZ 的访问通常由防火墙和路由器系统控制或限制。\n\
  \nDMZ 充当公共不可信互联网与私有信任局域网之间的缓冲区网络。这种实现被称为屏障子网（screened subnet）。它通过将 DMZ 子网放置两个防火墙之间来实现，其中一个防火墙连接互联网，另一个连接私有局域网。\n\
  \n\n\n\nDMZ 也可以通过使用多接口防火墙来部署（参见图 3.3）。此类防火墙有三个接口：一个连接互联网，一个连接私有局域网（LAN），一个连接 DMZ。\n\
  \n![图 3.3 多接口防火墙 DMZ](img/c03f003.jpg)\n\n图 3.3 多接口防火墙 DMZ\n\nDMZ 使组织能够向公共和内部客户端提供信息服务（如网页浏览、FTP\
  \ 和电子邮件），而不会损害私有局域网的安全性。\n\n部署 DMZ 的典型场景是组织希望向公众提供资源，例如 Web 服务器、电子邮件服务器或文件服务器。\n\
  \n#### 外网 (Extranet)\n`extranet`（参见图 3.4）是一个受私有控制的网段或子网，作为业务对业务（B2B）交易的 DMZ。它允许组织向合作伙伴、供应商、销商或客户提供专门的服务。外网基于\
  \ `TCP/IP`，并通常使用常见的互联网信息服务，如网页浏览、FTP 和电子邮件。外网不对普通公众开放。它们通常要求外部实体使用 `VPN` 连接。这限制了未经授权的访问，并确保与外网的所有通信都是安全的。外网的另一个重要安全考量是，今天是合作伙伴的公司明天可能就是竞争对手。因此，你绝不要将你不愿让未来的竞争对手访问的数据放置到外网中。\n\
  \n![图 3.4 两个组织之间的典型外网](img/c03f004.jpg)\n\n图 3.4 两个组织之间的典型外网\n\n使用外网的常见场景是组织需要向业务伙伴或外部供应商授予资源访问。这允许外部实体访问提供的资源，而无需将这些资源暴露在开放的互联网上，也不会允许外部实体访问私有局域网。\n\
  \n#### 内网 (Intranet)\n`intranet` 是私有网络或私有局域网。该术语出现于 20 世纪 90 年代，当时传统 LAN 与采用互联网技术（如\
  \ `TCP/IP` 协议、Web 服务和电子邮件）的 LAN 之间存在区别。现在大多数网络都使用这些技术，“内网”一词已不再区别于“LAN”。\n\n所有拥有网络的组织都有内网。因此，任何涉及私有局域网的场景也是内网。\n\
  \n#### 无线 (Wireless)\n无线网络是使用无线波作为通信媒介而非铜缆或光纤电缆的网络。无线网络区域可以通过加密（如 `WPA-2`）和唯一身份验证来隔离（以便只有获得特定网络区域授权的用户和设备才能登录该无线区域）。\n\
  \n无线作为可行方案的场景包括需要便携设备的工作空间，或者布设网络电缆成本过高。\n\n#### 访客 (Guest)\n访客区或访客网络是私有网络中指定供临时授权访问者使用的区域。它允许非员工实体与你的私有网络进行部分交互，或者至少与部分严格控制的资源集进行交互，而不会将你的内部网络暴露在未经授权的用户威胁之下。访客网络可以是无线网络或线网络。访客网络还可以通过\
  \ `VLAN` 强制执行来实现。\n\n任何定期需要为访问者和访客提供某种程度网络访问（即使只是提供互联网连接）的组织，都应该考虑实施访客网络。\n\n####\
  \ 蜜罐网 (Honeynets)\n`honeynet` 由两个或多个联网的蜜罐协同工作组成，用于监控或重建更大、更多样化的网络布局。通常，这些蜜罐网有助于\
  \ `IDS` 的部署，用以检测和捕获内部及外部攻击者。更多信息请参见第 2 章“技术与工具”中的“蜜罐网”章节。\n\n#### NAT\n为了让系统能够跨越互联网进行通信，它们必须具备能够连接的\
  \ `TCP/IP` 地址。遗憾的是，租赁足够的公共 IP 地址以为网络上的每个系统分配一个是非常昂贵的。此外，为网络上的每个系统分配公有 IP 地址意味着这些系统可以被外部的良性或恶意实体直接访问（或至少直接寻址）。解决此问题的方法是是使用网络地址转换\
  \ (NAT)`（参见图 3.5）。\n\n![图 3.5 连接到本地网络的典型互联网连接](img/c03f005.jpg)\n\n图 3.5 连接到本地网络的典型互联网连接\n\
  \nNAT 将网络包头中的内部系统私有 IP 地址（参见 `RFC 1918` 的讨论）转换为公共 IP 地址。它以一对的方式执行此操作；因此，一个租赁的公共\
  \ IP 地址即可允许一个内部系统访问互联网。由于互联网通信通常不是永久性或专用的连接，如果内部系统不需要同时访问互联网，那么一个公共 IP 地址就可以有效支持三四个内部系统。因此，当使用\
  \ NAT 时，较大的网络只需要租赁较少量的公共 IP 地址。\n\nNAT 提供以下优点：\n* 它向外部实体隐藏了 IP 划分方案和结构。\n* 它充当基础防火墙，只允许响应内部系统请求的入站流量。\n\
  * 它通过需要更少的租赁公有 IP 地址来降低费用。\n* 它允许使用 `私有 IP 地址 (RFC 1918)`。\n\n与 NAT 密切相关的是 `端口地址转换\
  \ (PAT)`，它允许单个公共 IP 地址托管来自内部客户端的多达 65,536 个并发通信（理论最大值；在实践中，在大多数情况下你应该将数量限制在 100\
  \ 个或更少）。PAT 不是对 IP 地址进行一对一映射，而是使用传输层端口号在每个公共 IP 地址上托管多个并发通信。\n\nIT 行业中对 `NAT` 术语的使用已包含了\
  \ `PAT` 的概念。因此，当你听到或读到 NAT 时，可以假设该材料指的是 PAT。这对于大多数操作系统和服务都是如此的，对于 Security+ 考试也是如此。\n\
  \n另一个需要熟悉的问题是 NAT 穿透 (NAT-T)。传统的 NAT 不支持 `IPSec VPNs`，因为 `IPSec` 协议的要求以及 NAT 对数据包头部的更改。然而，NAT-T\
  \ 专门设计用于支持 `IPSec` 和其他隧道 VPN 协议，例如`二层隧道协议 (L2TP)`，以便组织可以在同一个边界设备/接口上同时从 NAT 和 VPN\
  \ 中获益。\n\n随着 `IPv4` 向 `IPv6` 转换的进行，需要在这些 IP 结构之间进行 NAT。随着迁移的推进，`v4-to-v6 网关`或 `NAT\
  \ 服务器`将变得更加常见，以维护旧版 `IPv4` 网络与更新的 `IPv6` 网络之间的连通性。一旦大多数系统使用 `IPv6`，`v4-to-v6 NAT\
  \ 系统`的数量将会减少。\n\n必须实施 NAT 的场景包括使用 `RFC 1918` 的私有 IP 地址，或者当防止外部发起对内部设备的通信时。\n\n####\
  \ 自组织网络 (Ad hoc)\nAd hoc 是无线网络的一种形式，也称为对点网络。它是一种无线网络的形式，其中单个主机直接相互连接，而不是通过中间人。关于此主题的更多信息，请参见第\
  \ 2 章的“WiFi direct/ad hoc”。\n\n### 隔离/划分/分割\n\n\n\n\n\n`Network segmentation`（网络分段）涉及对网络设备之间流量控制。当网络与所有外部通信隔离时，就会发生完全或物理网络分段，因此事务只能发生在分段网络内的设备之间。逻辑网络分段可以通过交换机\
  \ VLANs`或其他流量控制手段实现，包括 `MAC addresses`、`IP addresses`、物理端口、`TCP` 或 `UDP` 端口、协议，或应用过滤、路由和访问控制管理。网络分段可以隔离静态环境，以防止更改和/或利用到达这些环境。\n\
  \n`Security layers`（安全层）存在于将不同分类或敏感性级别的设备归类在一起，并与其他具有不同安全级别的组隔离开的场景。这种隔离可以是绝对的或单向的。例如，低级别可能无法向高级别发起通信，但高级别可以向低级别发起通信。隔离也可以是逻辑的或物理的。`Logical\
  \ isolation`（逻辑隔离）要求在数据和数据包上使用分类标签，网络管理、`OSs` 和应用程序必须尊重并执行这些标签。`Physical isolation`（物理隔离）要求在不同安全级别的网络之间实现网络分段或空隙（air\
  \ gaps）。\n\n网络之间的桥接（Bridging）可以是网络设计的一种特性。网络桥接是自配置的、廉价的、维持冲突域隔离、对第 3 层以上协议透明，并避免了\
  \ 5-4-3 规则的第 1 层限制（参见 [`en.wikipedia.org/wiki/5-4-3\\_rule`](https://en.wikipedia.org/wiki/5-4-3_rule)）。然而，网络桥接并不总是理想的。它不支持或划分广播域，扩展性不好，会导致延迟并可能引发环路。为了消除这些问题，你可以实现网络分离或分段。实现此目标有两种方法。首先，如果网络分段之间的通信是必要的，你可以实现\
  \ `IP subnets` 并使用 `routers`。其次，你可以创建不需要通信的物理隔离网络。这也可以通过使用 `firewalls` 代替 `routers`\
  \ 来实现安全的过滤和流量管理。\n\n所有网络都涉及到需要划分、分段和隔离的场景。如果不在内部私有网络和外部公共网络之间建立区分，那么对于保护敏感数据和系统而言，维护隐私、安全和控制将极具挑战性。网络分段应该根据活动的敏感性、数据的价值、数据丢失或泄露的风险、分类级别、物理位置或任何组织认为重要的区别来划分通信区域。\n\
  \n### Physical（物理）\n\n物理分段发生在网络之间没有建立链路时。这也被称为“空隙隔离”（air gap）。如果两个网络之间没有电缆且没有无线连接，则实现了物理网络隔离/分段/隔离。这是禁止意外数据传输的最可靠的手段。然而，对于极少数需要或必要通信的事件，这种配置也是最不便的。\n\
  \n### Logical (VLAN)（逻辑 VLAN）\n\n`virtual local area network (VLAN)`（虚拟局域网）是由交换机创建的硬件强制网络分段。默认情况下，交换机上的所有端口都是\
  \ `VLAN 1` 的一部分。但随着交换机管理员逐端口更改 `VLAN` 分配，各种端口可以组合在一起，并与其他 `VLAN` 端口标记保持分离。\n\n`VLANs`\
  \ 用于流量管理。同一 `VLAN` 内部端口之间的通信不受阻碍地进行，但 `VLAN` 之间的通信需要路由功能，该功能可以由外部 `router` 或交换机的内部软件提供（这就是\
  \ `multilayer switch` 术语的来源）。`VLANs` 被视为子网，但它们不是子网。`VLANs` 由交换机创建。子网通过 `IP address`\
  \ 和 `subnet mask` 分配创建。\n\n`VLAN management`（VLAN 管理）是使用 `VLANs` 出安全或性能目的控制流量。`VLANs`\
  \ 可用于隔离网络分段之间的流量。这可以通过不在不同分段之间定义路由来实现。也可以通过在 `VLANs` 之间不定义路由来实现（注：此处翻译逻辑重复，原文在此处有重复描述，已重新根据逻辑翻译）。实际上：`VLANs`\
  \ 用于隔离网络分段之间的流量。这可以通过不在不同分段之间定义路由来实现。\n\n*重新对齐逻辑和翻译：*\n\n一个 `virtual local area\
