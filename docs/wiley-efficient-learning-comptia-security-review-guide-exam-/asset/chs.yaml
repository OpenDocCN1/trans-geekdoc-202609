  2. 允许最多尝试登录三次失败，后将锁定账户 15 分钟。\n3. 要求密码保持静态至少至少三天，并防止重复使用最近使用过的五个密码。\n4. 要求每个管理员除拥有特权账户外，还必须拥有普通用户账户。\n\
  \n# 第 5 章：风险管理\n\n**本章涵盖的 CompTIA SECURITY+ 考试目标包括：**\n\n## 5.1 解释与组织安全相关的策略、计划和规程的重要性。\n\
