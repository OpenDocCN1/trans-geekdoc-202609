  \n\n\n# 虚拟化与安全\n\n在安全性方面，虚拟化提供了多项优势。对整个虚拟系统进行备份通常比对等的原生硬件安装系统更简单、快速。此外，当发生错误或问题时，可以在几分钟内用备份替换虚拟系统。虚拟系统的恶意代码攻击很少影响宿主机操作系统（OS）。这使得测试和实验更加安全。\n\
  \n可以针对虚拟机使用自定义的虚拟网络分段，使客操作系统（guest OS）成为与主机相同网络划分的一部分，或者将客操作系统放在不同的网络划分中。虚拟机可以设置为与主机不同的网段成员，或者放置在仅存在于虚拟且与物理网络介质无关的网络中。关于这种技术（即软件定义网络），请参见后文章节“SDN”。\n\
  \n## 物理隔离 (Air gaps)\n\n物理隔离是物理网络隔离的另一种术语，如前面的“物理”章节中所讨论的。\n\n## 隧道技术/VPN\n\n`虚拟私有网络\
  \ (VPN)` 是跨越中间网络的两个实体之间的通信`隧道`。在大多数情况下，中间网络是不可信的网络（如互联网），因此通信隧道通常是经过加密的。许多场景都部署\
  \ VPN；例如，VPN 可用于跨互联网连接两个网络（参见图 3.7），或允许远程客户端通过互联网连接到办公室局域网（LAN）（参见图 3.8）。一旦建立 VPN\
  \ 链路，VPN 客户端的网络连通性与通过电缆连接的 LAN 完全相同。直接 LAN 电缆连接与 VPN 链路唯一的区别在于速度。\n\n![图 3.7 跨互联网使用\
  \ VPN 连接两个局域网](img/c03f007.jpg)\n\n**图 3.7** 跨互联网通过 VPN 连接两个局域网\n\n![图 3.8 客户端通过互联网\
  \ VPN 连接到网络](img/c03f008.jpg)\n\n**图 3.8** 客户端通过互联网 VPN 连接到网络\n\nVPN 为远程用户访问公司 LAN\
  \ 资源提供了极佳的解决方案。具有以下优势：\n\n* 它们消除了对昂贵的拨号调制解调器组（包括陆线和 ISDN）的需求。\n* 它们消除了长途电话费。\n*\
  \ 它们允许世界上任何有互联网连接的用户与办公室网络建立 VPN 链路。\n* 它们为身份验证和数据传输提供了安全保障。\n\nVPN 协议有时被称为`隧道协议`。这种命名习惯旨在将注意力集中在\
  \ VPN 的隧道能力上。\n\nVPN 通过名为`封装 (encapsulation)` 的过程工作。当数据通过 VPN 链路从一个系统传输到另一个系统时，正常的\
  \ LAN TCP/IP 流量被封装（装入或封闭）在 VPN 协议中。VPN 协议像一个安全信封，提供了特殊的交付能力（例如跨越互联网）以及安全机制（如数据加密）。\n\
  \n当使用防火墙、入侵检测系统、防病毒扫描程序或其他包过滤/监控安全机制时，你必须意识到 VPN 流量的数据载荷是不可查看、不可访问、不可扫描或过滤的，因为它是加密的。因此，为了让这些安全机制对\
  \ VPN 传输的数据生效，它们必须放置在 VPN 隧道之外，在数据解密并恢复正常 LAN 流量后对其进行处理。\n\nVPN 提供以下关键功能：\n\n* `访问控制\
  \ (Access control)` 限制用户访问网络上的资源。\n* `身份验证 (Authentication)` 证明通信双方的身份。\n* `机密性\
  \ (Confidentiality)` 防止受保护的数据未经授权的泄。\n* `数据完整性 (Data integrity)` 防止数据在传输过程中被意外更改。\n\
  \nVPN 链路使用 VPN 协议建立。有很多 VPN 协议，但你应该识别以下四种：\n\n* `点对点隧道协议 (PPTP)`\n* `二层隧道协议 (L2TP)`\n\
  * `OpenVPN (SSL VPN, TLS VPN)`\n* `IP 协议安全安全 (IPsec)`（参见第 2 章章节“IPSec”）\n\nPPTP\
  \ 最初由微软开发。L2TP 是结合了微软的 PPTP 专有实现和思科的二层转发 (L2F) VPN 协议的特性而开发的。自开发以来，L2TP 已成为了一项 Internet\
  \ 标准 (RFC 2661)，并正迅速获得广泛支持。\n\nL2TP 和 PPTP 都基于点对点协议 (PPP)，因此适用于各种远程接入连接，包括拨号。L2TP\
  \ 可以支持几乎任何网络协议。PPTP 限于 IP 流量。L2TP 使用 `UDP` 端口 1701，而 PPTP 使用 `TCP` 端口 1723。\n\n\
  PPTP 可以使用 PPP 支持的任何身份验证方法，包括：\n\n* 挑战握手认证协议 (CHAP)\n* 扩展认证协议 (EAP)\n* 微软挑战握手认证协议版本\
  \ 1 (MS-CHAP v1)\n* 微软挑战握手认证协议版本 2 (MS-CHAP v2)\n* Shiva 认证协议 (SPAP)\n* 密码认证协议 (PAP)\n\
  \n并非所有 PPTP 实现都能提供数据加密。例如，在 Windows 系统之间使用 PPTP VPN 时，身份验证协议 `MS-CHAP v2` 可启用数据加密。\n\
  \nL2TP 依赖于 PPP，因此依赖于 PPP 支持的身份验证协议。这通常被称为 `IEEE 802.1x`（参见第 4 章“身份与访问管理”和第 6 章“密码学与\
  \ PKI”中关于 IEEE 802.1x 的章节），它是 PPP 中 EAP 的派生物。IEEE 802.1x 使 L2TP 能够利用或借用网络上任何可用 AAA\
  \ 服务器，如 `RADIUS` 或 `TACACS+`。L2TP 不提供原生加密，但它支持使用加密协议，例如 IP 协议安全 (IPSec)。虽然不是强制，但\
  \ L2TP 通常使用 `IPsec`。\n\nL2TP 可用于隧道任何路由协议，但本身不包含安全功能。当使用 L2TP 封装 IPsec 时，它获得了身份验证和数据加密功能，因为这些功能是由\
  \ IPsec 提供的。使用 L2TP 封装的 IPSec 代替裸 IPSec 的主要原因是需要跨越一个不可信或安全性未知的二层网络。这包括电信运营商提供的业务连接，如帧继\
  \ (Frame Relay) 和异步传输模式 (ATM) 或公共交换电话网 (PSTN)。在其他情况下，可以使用 IPSec 而无 L2TP 的额外开销。\n\
  \n\n\n\n站点到站点 VPN 和远程访问 VPN 是隧道模式 VPN 的变体。另一种类型的 VPN 是传输模式 VPN，它提供端到端的加密，并可以描述为主机到主机的\
  \ VPN。在此类 VPN 中，所有流量在端点之间都经过完全加密，但这些端点仅是单个系统，而不是组织网络。\n\n### 安全设备/技术部署\n\n在设计网络布局和结构时，考虑安全设备及相关技术的部署至关重要。规划网络基础设施架构和组织的目标是在最大化安全性的同时，最小地减少停机时间、破坏或其他对生产效率的干扰。\n\
  \n### 传感器 (Sensors)\n\n传感器是一种硬件或软件工具，用于监控活动或事件，以记录信息或至少注意到某事的发生。传感器可以监控热、湿度、风力变化、门窗开关、数据流移动、网络上使用的协议类型、用户登录时间、针对敏感服务器的任何活动等。\n\
  \n为了让传感器发挥作用，它们需要位于靠近关注事件的适当位置，以便能够察觉该事件。这可能要求传感器监控所有网络流量、监控特定的门或监控单一计算机系统。\n\n\
  ### 收集器 (Collectors)\n\n安全收集器是任何将数据汇集到日志或记录文件的系统。收集器的功能类似于审计、日志记录和监控的功能。收集器监控特定的活动、事件或流量，然后将信息记录到记录文件中。目标可以是，例如登录事件、开门事件、特定可执行文件的所有启动、对敏感文件的任何访问，或任务关键服务器上的所有活动。\n\
  \n收集器像任何审计系统一样，需要在存储设备上有足够的空间来记录其收集的数据。此类数据的处理方式应视为比其采集来源的原始数据、程序或系统更敏感。收集器应该放置在合适的位置，使其能够审查和检索其旨在监控的系统、多个系统或网络的信息。这可能需要与监控目标建立直接链接或路径，或者可能可以在通信的克隆或镜像副本上运行，例如交换机的\
  \ `SPAN`、`audit`、`mirror` 或 `IDS` 端口。\n\n### 关联引擎 (Correlation engines)\n\n关联引擎是一种分析系统，用于审查日志文件内容或实时事件。它被编程用于识别相关事件、按顺序发生的情况以及相互依赖的活动模式，以检测可疑或违规事件。通过关联引擎利用模糊逻辑和预测性分析聚合并分析系统日志的能力，它可能在人类管理员注意到很久之前就检测出问题或潜在问题。\n\
  \n关联引擎不需要位于网络链路上，也不需要直接安装在被监控的系统上。它必须能够访问记录的日志或实时活动流以执行分析。这可能允许它在数据仓库或集中式日志服务器（一个维护来自服务器和其他关键系统的所有实时日志克隆副本的系统）或附近运行，或者在交换机的\
  \ `SPAN` 端口上运行。\n\n### 过滤器 (Filters)\n\n过滤器用于识别或匹配事件、地址、活动、内容或关键词，并触发响应。在大多数情况下，过滤器用于阻止或防止不必要的活动或数据交换。最常见的过滤工具示例是防火墙。\n\
  \n过滤器应该位于任何需要对数据通信进行控制的通信路径的链路上。请记住，过滤器无法检查加密流量，因此对此类流量的过滤必须在加密之前或解密之后进行。\n\n###\
  \ 代理 (Proxies)\n\n有关代理的介绍，请参阅第 2 章“代理 (Proxy)”章节。\n\n代理的部署或位置应位于源设备或源地设备与其目标系统之间。透明代理的位置必须位于源和目的之间的路由路径上，而非透明代理可以位于替代或间接路由路径上，因为源系统会自行将流量指向代理。\n\
  \n### 防火墙 (Firewalls)\n\n有关防火墙的介绍，请参阅第 2 章“防火墙 (Firewall)”章节。\n\n防火墙的部署或位置应位于任何由于风险、敏感性、价值或目的而存在差异的网络段过渡处。标准的安全做法是在内部网络与互联网之间，以及在互联网、DMZ\
  \ 和内网之间部署硬件安全防火墙（见图 3.9）。\n\n[此处为图片说明]\n\n软件防火墙也部署在整个组织网络中的每个主机系统（包括服务器和客户端）。\n\n\
  也可以考虑在部门、卫星办公室、VPN 甚至不同的建筑或楼层之间实施防火墙。\n\n### VPN 集中器 (VPN concentrators)\n\n有关 VPN\
  \ 集中器的介绍，请参阅第 2 章“VPN 集中器 (VPN concentrator)”章节。\n\nVPN 集中器应该位于组织网络的边界或靠近主互联网连接。VPN\
  \ 集中器可以位于主防火墙的内部或外部。如果安全策略是对进入私有网络的流量进行过滤，则 VPN 集中器必须位于防火墙之外。如果来自 VPN 的远程位置流量是受信任的，则\
  \ VPN 集中器可以位于防火墙内部。\n\n### SSL 加速器 (SSL accelerators)\n\n有关 SSL/TLS 加速器的介绍，请参阅第\
  \ 2 章“SSL/TLS 加速器”章节。\n\nSSL/TLS 加速器应该位于组织网络的边界或靠近主互联网连接，并在受保护连接的资源服务器之前。通常，SSL/TLS\
  \ 加速器位于通信链路上，使得恶意网络访问无法到达加速器与资源主机之间的网段。该设备或服务的目的是卸载加密计算负载，以便资源主机能够将其系统资源用于服务访问者。\n\
  \n### 负载均衡器 (Load balancers)\n\n有关负载均衡器的介绍，请参阅第 2 章“负载均衡器 (Load balancer)”章节。\n\n\
  负载均衡器应该位于一组服务器（通常称为集群）之前，这些服务器都支持相同的资源。负载均衡器的目的是在集群成员之间分配连接请求负载，因此决定了它的位置。负载均衡器位于请求客户端与托管资源的集群或服务器组之间。\n\
  \n### DDoS 缓解设备 (DDoS mitigator)\n\nDDoS 缓解设备是一种软件解决方案、硬件设备或云服务，尝试过滤和/或拦截与 DoS 攻击相关的流量。有关此类攻击的信息，请参阅第\
  \ 1 章“威胁、攻击与漏洞”中的“DoS”和“DDoS”章节。\n\n\n\n\n\nDDoS 缓解设备会尝试区分合法数据包和恶意数据包。良性流量将被发送到目的地，而滥用流量将会被丢弃。低端\
  \ DDoS 缓解设备可能被称为洪泛防护（flood guards）。洪泛防护通常防火墙的一个功能。然而，此类解决方案仅改变了 DDoS 攻击的焦点，并没有消除它。低级\
  \ DDoS 缓解设备或洪泛防护方案可以防止恶意流量到达目标服务器，但过滤系统本身可能会过载。这导致即使目标服务器本身在过程中没有损坏，DoS 事件仍然能够切断网络的通信。\n\
  \n商业级 DDoS 解决方案（尤其是基于云服务的解决方案）的工作方式不同。它们不是简单地在现场过滤流量，而是将流量重定向到云提供商的核心过滤网络。云端 DDoS\
  \ 缓解设备通常会在 10,000 多台虚拟机前使用负载均衡器，以稀释并分配流量以便分析和过滤。所有垃圾数据包被丢弃，合法流量则被路由回目标网络。\n\nDDoS\
  \ 缓解设备应该部署在通往内网、DMZ 和外网的路径串联位置上。这使得 DDoS 缓解设备能够在所有流量到达服务器或整个网络之前过滤来自外部攻击源的流量。\n\n\
  ## 聚合交换机\n\n聚合交换机是作为许多其他交换机互连点的主或核心交换机。在过去，这种设备可能被称为主配线（`MDF`）、中央配线、核心配线或主配框。在大型网络部署中，初始主交换机部署在边界点附近（即公司内部布线与外部电信布线接触的点），然后将用于各个楼层、部门或网络段的额外交换机连接到主交换机上。\n\
  \n## 分器（Taps）与端口镜像\n\n分器是一种监听网络通信的手段。过去，分器是与铜线本身的物理连接，通常使用机械手段剥离或穿透绝缘层以接触导体。这类分器通常被称为吸血鬼分器（vampire\
  \ taps）。今天，分器可以串联安装而不损坏现有电缆。要安装串联分器，必须先将原始电缆从交换机（或其他网络管理设备）拔出，然后插入分器。接着，将分器插入空出的原始端口。在需要对特定电缆进行流量监控，且端口镜像功能不可用或不受欢迎的情况下，都应该安装分器。\n\
  \n端口镜像是托管交换机上的一种常见功能；它会将来自一个或多个其他端口的流量复制到特定端口。交换机可能有一个硬连接的交换端口分析（`SPAN`）端口，它可以复制所有其他端口的流量，或者任何端口都可以设置为一个或多个其他端口的镜像、审计、IDS\
  \ 或监控端口。端口镜像发生在交换机本身。\n\n## SDN\n\n操作系统虚拟化的概念催生了其他虚拟化主题，例如虚拟网络。虚拟网络或网络虚拟化是将硬件和软件网络组件组合成单一集成实体。由此产生的系统允许软件对所有网络功能进行控制：管理、流量整形、地址分配等。可以使用单个管理控制台或界面来监控网络的各个方面，而在过去，这项任务需要物理地访问每个硬件组件。虚拟化网络已成为企业部署和管理基础设施的流行手段。\n\
  \n`软件定义网络 (SDN)` 是一种将控制平面与转发平面分离的网络架构。这允许通过软件对网络进行编程，而不是在单个设备上进行手动配置。SDN 为网络管理提供了灵活性、可扩展性和自动化。\n\
  \n虚拟化网络产生的另一个有趣进展是存储区域网络（`SAN`）。`SAN` 是一种将各个存储设备组合成单一网络可访问容器的网络技术。虚拟 `SAN` 或软件定义存储系统是在虚拟化网络之上对\
  \ `SAN` 的虚拟再创建。\n\n`存储区域网络 (SAN)` 是一种次级网络（区别于主通信网络），用于整合和管理各种存储设备。SAN 常用于增强硬盘、驱动器阵列、光盘库和磁带库等网络设备，使它们在服务器看来就像本地存储一样。\n\
  \n## 考试要点\n\n**理解网络区域**：网络区域是为特定目的（如内部使用或外部使用）设计的网络区域。网络区域是局域网（LAN）的逻辑和/物理划分或分段，允许额外的安全和控制层。\n\
  \n**理解 DMZ**：非军事区（`DMZ`）是专门为公共用户访问设计的网络区域。`DMZ` 是公共不可信互联网和私有信任局域网之间的缓冲区网络。`DMZ`\
  \ 通常通过多主防火墙部署。\n\n**理解外网（extranets）**：外网是作为业务对业务交易 `DMZ` 的内网。外网允许组织向业务合作伙伴、供应商、分销商或客户提供专门服务。\n\
  \n**理解内网（intranets）**：内网是私有网络或私有局域网。\n\n**了解访客网络**：访客区域或访客网络是私有网络中供临时授权访客使用的区域。\n\
  \n**理解蜜罐网络（honeynets）**：蜜罐网络由两个或多个协同使用的网络蜜罐组成，用于监控或重现更大、更多化的网络布局。\n\n\n\n\n\n##\
  \ 了解 NAT。NAT 将网络数据包标头中的内部系统 IP 地址转换为公 IP 地址。它向外部实体隐藏 IP 方案和结构。NAT 充当基础防火墙，只允许响应内部系统请求的入站流量。它通过减少对租赁公共\
  \ IP 地址的需求来降低成本，并允许使用私有 IP 地址 (`RFC 1918`）。\n\n## 了解 PAT。与 NAT 密切相关的是端口翻译 (`PAT`)，它允许单个公共\
  \ IP 地址托管来自内部客户端的多个并发通信。PAT 不是一对一地映射 IP 地址，而是使用传输层端口号在每个公共 IP 地址上托管多个并发通信。\n\n##\
  \ 了解 RFC 1918。RFC 1918 定义了在互联网上不可路由的私有 IP 地址范围：10.0.0.0–10.255.255.255（`10.0.0.0\
  \ /8` 子网，1 个 A 类范围）；172.16.0.0–172.31.255.255（`172.16.0.0 /12` 子网），16 个 B 类范围；以及\
  \ 192.168.0.0–192.168.255.255（`192.168.0.0 /16` 子网），256 个 C 类范围。\n\n## 理解网络分段。网络分段涉及控制网络设备之间的流量。可以使用交换机通过\
  \ VLAN 实现逻辑网络分段，或其他流量控制手段，包括 MAC 地址、IP 地址、物理端口、TCP 或 UDP 端口、协议或应用过滤、路由和访问控制管理。\n\
  \n## 理解 VLAN。交换机通常用于创建虚拟局域网 (`VLANs`)——即从单个物理网络中逻辑上创建子网。VLAN 用于在不改变物理拓扑结构的情况下对网络进行逻辑分段。它们易于实现，管理开销小，并且是一种基于硬件的解决方案。\n\
  \n## 理解虚拟化。虚拟化技术用于在单个主机的内存中托管一个或多个操作系统。相关问题包括快照、补丁兼容性、主机可用性/弹性、安全控制测试和沙箱。\n\n##\
  \ 理解 VPN。虚拟私有网络 (`VPN`) 是跨越中间网络的两个实体之间的通信隧道。在大多数情况下，中间网络是不信任的网络（如互联网），因此通信隧道也是加密的。\n\
  \n## 了解 VPN 协议。PPTP、L2TP、OpenVPN 和 IPSec 都是 VPN 协议。\n\n## 理解 PPTP。点对点隧道协议 (`PPTP`)\
  \ 基于 PPP，仅限于 IP 流量，并使用 TCP 端口 1723。PPTP 支持 PAP、SPAP、CHAP、EAP 以及 MS-CHAP v.1 和 v.2。\n\
  \n## 了解 L2TP。数据链路隧道协议 (`L2TP`) 基于 PPTP 和 L2F，支持任何局域网协议，使用 UDP 端口 1701，并经常使用 IPSec\
  \ 进行加密。\n\n## 理解 OpenVPN。OpenVPN 基于 TLS（以前为 SSL），并提供了一个易于配置但安全稳固的 VPN 选项。\n\n##\
  \ 意识到安全设备放置的重要性。在设计网络布局和结构时，考虑安全设备及相关技术的放置非常重要。规划网络基础设施架构和组织的目标是最大化安全性的，同时最大限度地减少停机、妥协或其他对生产力的干扰。\n\
  \n## 理解软件定义网络。软件定义网络 (`SDN`) 是一种网络操作、设计和管理的独特方法。SDN 旨在将基础设施层（硬件和基于的设置）与控制层（数据传输管理的网络服务）分离。\n\
  \n## 3.3 给定场景，实现安全系统设计。\n\n任何有效的安全基础设施都是根据安全策略的指南构建的，并由安全系统组成。安全系统的规划和开发必须将安全不再仅仅视为一项功能，而是将其视为一个核心概念。本节讨论了有助于安全系统的一些重要设计概念。\n\
  \n### 硬件/固件安全\n\n安全是硬件/固件组件和软件元素的集成。本节将查看若干种硬件和固件安全技术。\n\n#### FDE/SED\n\n全盘加密 (`FDE`)\
  \ 或整个磁盘加密通常用于为操作系统、其安装的应用程序以及所有本地存储的数据提供保护。FDE 使用单个主对称加密密钥加密存储设备上的所有数据。当实施 FDE 时，写入加密存储设备的任何内容（包括标准文件、临时文件、缓存数据、内存交换数据，甚至删除的残留部分和空隙空间的内容）都会被加密。\n\
  \n然而，全盘加密仅在系统完全关机时才能提供合理的保护。如果黑客在系统运行期间访问系统，有几种方法可以绕过硬盘加密。这些包括 FireWire 直接内存访问 (`DMA`)\
  \ 攻击、恶意软件从内存中窃取加密密钥、使用液氮减慢内存衰减率，甚至仅仅是用户冒充。这些攻击的细节对于本次考试并不重要。但是，你应该知道全盘加密仅是一种部分安全控制措施。\n\
  \n为了最大化提高全盘加密的防御强度，你应该使用长且复杂的密码在启动时解锁系统。此密码不应被写下来，也不应用于任何其他系统或任何其他目的。每当系统不处于活动状态时，都应该关机（休眠模式可以，但不是睡眠模式）并进行物理锁定以防止未经授权的访问。硬盘加密应被视为一种延迟策略，而不是防止访问数据的真正预防措施。\n\
  \n硬盘加密可以通过如前所述的软件解决方案提供，也可以通过硬件解决方案提供。一种方案是自加密驱动器 (`SED`)。某些硬盘制造商提供包含板载硬件加密的硬盘产品。然而，这些解决方案大多数是专有的，且不公开其方法，某些已经通过相对简单的破解手段被破解。\n\
  \n使用可信的软件加密解决方案可以是具有成本效益且安全的选择。但要意识到，任何形式的硬盘加密（无论基于硬件还是软件）都不能保证防御所有可能形式的攻击。\n\n\
  USB 加密通常与 USB 存储设备有关，包括 USB 连接的硬盘和 USB 闪盘。某些 USB 设备制造商在他们的产品中包含加密功能。这些设备通常具有自动运行工具，用于在用户通过身份验证后访问加密内容。加密\
  \ USB 设备的示例是 IronKey。\n\n如果 USB 设备的制造商未提供加密功能，你通常可以通过各种商业或开源解决方案添加这些功能。最知名、受尊重且可信的开源解决方案之一是\
  \ VeraCrypt（图 3.10）（它是已遗弃的前身 TrueCrypt 的修订且安全的替代品）。该工具可加密文件、文件夹、分区、驱动器部分或整个硬盘，无论是内部、外部还是\
  \ USB。\n\n![FIGURE 3.10 VeraCrypt 加密对话框](img/c03f010.jpg)\n\n**图 3.10** VeraCrypt\
  \ 加密对话框\n\n#### TPM\n\n可信平台模块 (`TPM`) 既是加密处理器的规范，也是主板上支持此项的芯片。TPM 芯片用于为硬件支持/实现的硬盘加密系统存储和处理加密密钥。通常，与纯软件实现相比，硬件实现的硬盘加密被认为更安全。\n\
  \n\n\n\n在使用基于 TPM 的全盘加密时，用户/操作人员必须向计算机提供密码或物理 USB 令牌设备以进行身份验证，并允许 TPM 芯片将加密密钥释放到内存中。尽管这看起来与软件实现相似，但主要的区别在于，如果硬盘从原始系统中移除，它将无法解密。只有通过原始\
  \ TPM 芯片才能对加密的硬盘进行解密和访问。而对于仅软件的硬盘加密，硬盘可以移动到不同的计算机，而没有任何访问或使用限制。\n\n### HSM\n\n`hardware\
  \ security module (HSM)` 是一种特殊用途的加密处理器，用于广泛的潜在功能。HSM 的功能包括加速加密操作、管理和存储加密密钥、卸载数字签名验证以及改进身份验证。HSM\
  \ 可以是主板上的芯片、外部外设设备、网络连接设备，或者是附加或扩展适配器或卡（插入路由器、防火墙或机架式服务器刀片等设备中）。HSM 通常包含防篡改技术，以在在攻击者获得物理访问权限的情况下防止或阻止滥用和误用。HSM\
  \ 的一个例子是 TPM（见上一节）。\n\n### UEFI/BIOS\n\n`Basic input/output system (BIOS)` 是嵌入在硬件的`electrically\
  \ erasable programmable read-only memory (EEPROM)` 中的基础低端固件或软件。BIOS 识别并启动基础系统硬件组件，如硬盘、光驱、显卡等，以便开始加载操作系统的引导过程。这一关键的系统功能是黑客和其他入侵者的目标，因为其可能提供一种未受保护或不受监控的攻击途径。\n\
  \nBIOS 攻击以及互补的金属氧化半导体 (CMOS) 和设备固件攻击正成为物理黑客以及恶意代码的常见目标。如果黑客或恶意软件能够更改系统的 BIOS、CMOS\
  \ 或固件，它们可能能够绕过安全功能或启动其他禁止活动。\n\n防止 BIOS 攻击需要对所有敏感或昂贵的硬件进行物理访问控制。此外，强大的恶意软件防护（如当前的防病毒软件）也重要。\n\
  \nBIOS 的替代或改进方案是统一扩展固件接口（UEFI）。UEFI 支持与 BIOS 相同的功能，并带有许多改进，例如支持更大的硬盘（特别是启动盘）、更快的启动速度、增强的安全功能，甚至在更改系统设置时可以使用鼠标（BIOS\
  \ 仅限于键盘控制）。UEFI 还包含独立于 CPU 的架构、具有网络支持的灵活预 OS 环境、安全启动（见下一节）以及前后后兼容。它还运行独立于 CPU 的驱动程序（用于系统组件、驱动器控制器和硬盘）。\n\
  \n### 安全启动与证明\n\n安全启动是 UEFI 的一项功能，旨在通过防止加载或安装未经预先数字证书签名的设备驱动程序或操作系统来保护本地系统的运行环境。因此，安全启动保护系统免受各种底层或引导级恶意软件的影响，例如某些根程序和后门。安全启动确保只有通过证明（通过验证数字签名完成的验证和批准过程）的驱动程序和操作系统才允许在本地系统中安装和加载。\n\
  \n尽管安全启动证明的安全优势很重要且对所有系统都有益，但有一个待考虑的重要缺点：如果系统具有锁定的 UEFI 安全启动机制，可能会阻止系统所有更换操作系统（例如从\
  \ Windows 切换到 Linux），或阻止他们使用未经过主板厂商批准的第三方硬件（这意味着第三方供应商没有支付费用让主板厂商对其产品评估并对其驱动签名）。如果存在使用替代操作系统或更改系统硬件组件的可能性，请务必使用能够为\
  \ UEFI 安全启动提供解锁代码/密钥的厂商主板。\n\n### 供应链\n\n供应链安全是指大多数计算机并非由单一实体构建的理念。事实上，我们所知的大多数计算机制造商（如戴尔、HP、华硕、Acer\
  \ 和苹果）主要执行最终组装，而不是制造所有单个组件。通常 CPU、内存、驱动器控制器、硬盘、SSD 和显卡是由其他第三方供应商创建的。即使是这些供应商，也不可能自己开采矿石或处理用于塑料的石油或蚀刻其芯片的硅。因此，任何成品系统都有一段漫长而复杂的历史，被称为其供应链，它使其得以产生或导致了它的出现。\n\
  \n安全的供应链是指链中的所有供应商或环节都是可靠的、值得信赖的、声誉良好的组织，它们会向业务合作伙伴披露其实践和安全要求（尽管不一定向公众）。链中的每个环节都对链中的下一个环节负责并问责。从原材料到精制产品，再到电子零件、计算机组件再到成品的每一次交接都经过适当的组织、记录、管理和审计。安全供应链的目标是确保成品具有足够的质量，满足性能和运行目标，并提供所述的安全机制，并且在过程的任何时候，任何元素都没有受到未经授权或恶意的操纵或破坏。\n\
  \n### 硬件信任根\n\n硬件信任根建立在安全的供应链之上。系统的安全性最终取决于构成计算机的组件的可靠性和安全性，以及从原始原材料制造成所经历的过程。如果支持应用程序的硬件存在安全漏洞或后门，或者未能提供适当基于\
  \ HSM 的加密功能，那么软件无法补偿这些缺陷。只有当系统的根——硬件本身是可靠且值得信赖的，整个系统才能被认为是可信的。系统安全是由许多互连环节组成的链；如果任何环节是薄弱的，整条链就是不可信的。\n\
  \n#### EMI/EMP\n\n电磁干扰（EMI）是机器在使用或电流沿导体流动时产生的噪声。铜网络电缆和电源线可能会吸收环境噪声或 EMI，这可能会损坏网络通信或干扰设备的供电。电磁脉冲（EMP）是瞬时高水平\
  \ EMI，可以损坏附近的大多数电气设备。\n\nEMI 屏蔽对于网络通信电缆以及电源都是重要的。EMI 屏蔽可以包括从 UTP（非屏蔽双绞）升级到 STP（屏蔽双绞）、在屏蔽导管中布设电缆，或使用光纤网络电缆。针对\
  \ EMI 的屏蔽也可以对 EMP 提供适度的保护，尽管这取决于 EMP 与设备或电缆相比的强度和距离。通常，这两种电缆（网络电源）应该在分开的导管中布设，并相互隔离和屏蔽。\n\
  \n\n\n任何安全的系统设计都需要使用安全的操作系统。虽然没有一种操作系统是绝对安全的，但针对特定任务或功能选择合适的操作系统，可以减少持续安全管理的负担。\n\
  \n## 类型\n\n有很多方法可以对操作系统进行分类或分组。本节包含了操作系统类型、标签和分组的几个特定示例。在任何情况下，对操作系统的选择都应该侧重于功能和能力，同时不能忽视原生的安全优势。尽管通常可以通过安装软件添加安全性，但原生的安全功能通常更优。\n\
  \n### 网络\n\n网络操作系统（`NOS`）是任何具有原生网络能力、并以网络作为通信和数据传输手段而设计的操作系统。如今的大多数操作系统都是 `NOSs`，但并非所有的操作系统都具备网络功能。在许多情况下，出于功能、稳定性和安全性考虑，仍然倾向于使用独立或隔离的操作系统。\n\
  \n### 服务器\n\n服务器是 `NOS` 的一种形式。它是一个资源主机，负责向其他请求的系统提供数据、信息或通信功能。`Servers` 是网络上支持和维护网络的计算机系统。由于它们代表了资产、价值和能力的集中，因此比工作站需要更强大的物理和逻辑安全保护。终端用户应被限制物理接触服务器，并且他们没有理由直接登录服务器——他们应该通过工作站在网络与服务器交互。\n\
  \n### 工作站\n\n工作站是 `NOS` 的另一种形式。工作站是资源消费者。工作站通常是用户登录的地方，然后通过工作站跨网络连接服务器以访问资源并检索数据。工作站也被称为\
  \ `clients`、`terminals` 或 `end-user computers`。对工作站的访问应限制在授权人员。实现这一点的方法之一是使用强身份验证，例如使用智能卡加密码或\
  \ `PIN` 的双因子身份验证。\n\n### 设备设备\n\n设备操作系统是 `NOS` 的另一种变体。设备 `NOS` 是一种精简版或单一用途的操作系统，通常位于网络设备上，如防火墙、路由器、交换机、无线访问点和\
  \ VPN 网关。设备 `NOS` 围绕一组主要功能或任务设计，并且通常不支持任何其他能力。\n\n### 自助机（Kiosk）\n\n自助机操作系统既是独立操作系统也是\
  \ `NOS` 的变体。自助机操作系统为终端用户的使用和访问而设计。终端用户可能是组织的员工，也可以是公众中的任何人。自助机操作系统被锁定，仅启用预先授权的软件产品和功能。自助机操作系统在每次重启时都会恢复到锁定模式，某些系统在遇到缺陷、崩溃、错误或任何尝试执行未经授权的\
  \ `command` 或启动未批准的可执行文件时也会恢复。自助机操作系统的目标和目的是为用户提供稳健的信息服务，同时防止无意或故意的误用系统。自助机通常部署在公共场所，因此必须配置为针对该情况有效实施安全措施。\n\
  \n### 移动操作系统\n\n移动操作系统是 `NOS` 的另一种形式。移动操作系统设计用于便携式设备上运行。虽然便携式设备可以定义为任何带有电池设备，但移动操作系统是为传统的\
  \ `NOSs` 来说太大或资源需求过高的便携式设备设计的。许多便携设备的 `CPU` 处理能力、`RAM` 内存可用性和存储能力低于完整的笔记本电脑或工作站系统。移动操作系统旨在优化有限资源的性能。\n\
  \n\n\n从这个角度来看，你应该理解，在系统部署到网络之前，应该从系统中移除所有非必要的软件元素，特别是当网络具有互联网连接时。但你如何知道哪些是必要的，哪些是不必要的呢？这里有一个基本方法：\n\
  \n1. 规划系统的目的。\n2. 识别支持该目的所需的服务、应用程序和协议。确保这些内容已安装在系统中。\n3. 识别系统中已存在的服务、应用程序和协议。移除所有不需要的内容。\n\
  \n通常，你并不知道系统默认出现的某个特定服务是否是需要的。因此，需要进行试错测试。如果某些软件元素并非明确必需，请逐个禁用它们并测试系统的功能。如果系统运行符合你的预期，那么该软件可能是不需要的。如果系统运行不符合预期，则需要重新启用该软件。这个过程被称为`应用和系统加固（application\
  \ and system hardening）`。\n\n你可能会发现某些服务和协议提供的功能和能力对于系统的核心功能并非必要。如果是这样，请设法禁用或限制这些特性。这可能包括限制端口或通过管理控制台重新配置服务。\n\
  \n系统上的基本服务通常很容易识别——它们通常具有与服务器功能对应的易识别名称。然而，你必须确定在你的特定系统中哪些服务是必要的。Web 服务器上必要的服务在文件服务器或电子邮件服务器上可能并不必要。以下是一些可能的基本服务示例：\n\
  \n* 文件共享\n* 电子邮件\n* Web\n* 文件传输协议 (FTP)\n* Telnet\n* SSH\n* 远程访问\n* 网络新闻传输协议 (NNTP)\n\
  * 域名系统服务 (DNS)\n* 动态主机配置协议 (DHCP)\n\n非必要服务更难识别。仅仅因为某个服务的名称与你服务器的基本功能不同，并不意味着它没有被底层操作系统或作为支持服务使用。测试并验证任何服务是否被基本服务所依赖至关重要。然而，有几个服务是非必要服务的常见候选对象，你可能想要首先定位并禁用它们（假设你遵循了前述描述的测试方法）。这些可能包括：\n\
  \n* NetBIOS\n* Unix RPC\n* 网络文件系统 (NFS)\n* X 服务\n* R 服务\n* 简易文件传输协议 (TFTP)\n* NetMeeting\n\
  * 即时消息\n* 远程控制软件\n* 简单网络管理协议 (SNMP)\n\n### 最小功能原则 (Least functionality)\n\n在设计和实施安全时应采用的一个经验规则是最小功能原则。如果你始终选择并安装功能最少或没有任何不必要的额外功能和特性的解决方案，你获得的结果可能会比选择任何比需要选项更多的解决方案更安全。这是减少攻击表面的另一个视角。与其移除和阻塞不需要或不受欢迎的组件，不如选择那些在业务功能或任务严格需求之外，具有最少额外能力的硬件和软件系统。\n\
  \n### 安全配置 (Secure configurations)\n\n所有公司系统都应该在预期参数内运行，并符合定义的安全配置基准。任何被确定为偏离基准的系统都应从生产网络中移除，以调查原因。如果偏差是由于恶意事件引起的，则进行调查和响应。如果偏差是由于正常的工作相关操作和活动引起的，则可能需要更新基准和/或实施更严格的系统修改策略，例如白名单机制或使用静态系统。静态系统是一种用户无法进行更改的环境，或者用户可以实施的少数更改只是临时的，并在用户注销后被丢弃。\n\
  \n有关关于安全配置和建立基准的更多讨论，请参阅本章后后的“安全基准（Secure baseline）”部分。\n\n### 可信操作系统 (Trusted operating\
  \ system)\n\n`trusted OS`（信任操作系统）是一种访问控制功能，要求存在特定的操作系统才能访问资源。通过限制仅访问那些已知实现了特定安全特性的系统，资源所有者可以确保资源安全性的的可能性降低。\n\
  \n`trusted OS`（可信操作系统）的另一个正式定义是任何符合政府和/或军事安全标准的操作系统，这些标准能够执行多层级安全策略（即通过对主体和对象使用分类标签来执行强制性访问控制）。可信操作系统的示例包括\
  \ Trusted Solaris、Apple macOS X、HP-UX 和 AIX。许多其他操作系统也可以修改为可信，例如 Windows、Windows\
  \ Server 和 SELinux。\n\n### 应用白名单/黑名单 (Application whitelisting/blacklisting)\n\n\
  可以专门允许或禁止应用程序；详情请参见第 2 章章节“应用白名单（Application whitelisting）”。\n\n### 禁用默认账户/密码 (Disable\
  \ default accounts/passwords)\n\n如果你不需要，就不要保留。这在现实生活中可能是你的一个可选格言，但在安全方面，它是两个原则中的第一个——另一个是加固剩余部分。消除不必要的服务和账户只是适当的安全和环境加固的开始。留下默认或未使用的账户会为黑客和攻击者提供更多可能的入侵点。\n\
  \n始终将默认密码更改为唯一且复杂的密码。所有默认密码可以在线获取（图 3.12）。可用，始终开启密码保护并设置复杂密码。不要假设物理访问控制已经足够，或逻辑远程访问是不可能的。如果你发现设备具有硬编码的默认密码（这意味着来自供应商的原始密码无法禁用或替换），请将该设备从网络中移除，并用提供真实安全配置选项的设备替换它。\n\
  \n![图 3.12 CIRT.net 的默认密码数据库](img/c03f012.jpg)\n\n图 3.12 CIRT.net 的默认密码数据库\n\n###\
  \ 显示器 (Displays)\n\n\n\n\n\n显示器可以显示敏感、机密或个人信息。调整你的系统显示器方向，使其在你工作位置坐下或站立时难以被看到，这一点非常重要。你不希望公共区域的其他人或路过的人看到你屏幕上的内容。安装屏幕屏障（也称为隐私过滤器）可能是值得的。正如本章稍后“屏幕屏障”部分将讨论的，这些设备可以将显示器的可视范围缩小到最大距离垂直方向\
  \ 30 度的范围内。\n\n某些显示器是无线的，从核心计算机到显示器本身的信号可能没有加密。区域内的任何人都可能监听你的显示器通信，以查看显示器上显示的内容。\n\
  \n### 支持 WiFi 的 MicroSD 卡\n\n许多没有原生支持无线功能的便携设备可以使用带有 `WiFi` 的 `microSD` 或 `SD` 卡进行增强。这些内存存储卡自带\
  \ `WiFi` 适配器，反过来可以为移动设备提供无线连接。虽然这不会让移动设备变成功能全 `NOS`，但它通常允许将文件（保存到存储扩展卡）上传或备份到云服务或网络共享。这些支持\
  \ `WiFi` 的 `SD` 和 `microSD` 卡可能支持无线加密，但并不一定。\n\n当这些卡用在已具有网络功能的设备中时，该设备可能成为黑客的额外攻击路径——特别是当它自动连接到明文\
  \ `WiFi` 网络时。通常情况下，避免使用任何支持 `WiFi` 的存储扩展卡。虽然不那么方便，但手动将 `SD` 卡移动到完整的计算机系统以上传文件更快，且可能更安全。\n\
  \n### 打印机/多功能一体\n\n许多打印机是网络打印机，这意味着它们可以直接连接到网络，而无需直接连接到计算机。网络打印机作为自身的打印服务器。它可以通过电缆或无线连接到网络。某些设备不仅仅是打印机，可能包含传真、扫描和其他功能。这些被称为多功能设备\
  \ (`MFDs`)。任何连接到网络的设备都可能是潜在的突破点。这可能是由于设备固件的缺陷，也可能取决于设备是否使用通信加密。\n\n### 外部存储设备\n\n\
  通用串行总线 (`USB`) 设备如今无处不在。几乎每个使用电脑的员工都拥有一个 `USB` 存储设备，大多数便携设备（如手机、音乐播放器以及录像或视频摄像机）都通过\
  \ `USB` 连接。然而，这种便利性是以安全为代价的。至少有四个主要问题：\n\n* 几乎任何 `USB` 设备都可以用于将恶意代码引入安全环境，或将敏感、机密和/或专有数据泄露出去。即使不是专门设计为存储设备的设备（如手机），可能具有该功能。\n\
  * 大多数计算机具有从 `USB` 启动的能力。这允许用户启动到备用 `OS`（例如 `Kali`，一种用于黑客攻击和/渗透测试的 Linux 发行版），从而完全绕过原生\
  \ `OS` 实施的任何安全性。\n* 某些较新的恶意软件使用 `Windows` 的 `Autoruns` 功能从受感染的 `USB` 存储设备传播到主机计算机。如果没有采取更新、补丁和使用最新的杀毒病毒防护加固系统等安全措施，此类恶意软件将成功。\n\
  * `USB` 自动打字器具有每秒数千次尝试的暴力破解登录的能力。\n\n为了防止 `USB` 威胁，唯一的实际选择是完全禁止使用 `USB` 设备并锁定所有\
  \ `USB` 端口。某些组织不仅禁用了 `USB` 功能，还用硅胶、环氧脂或类似材料填充 `USB` 端口，从而确保 `USB` 设备无法被使用。随着企业转向\
  \ `USB` 键盘和鼠标，环氧脂法的效果降低了：用户可以简单地移除输入设备并直接或通过集线器连接 `USB` 驱动器。相反，更多企业开始在（已锁定的）`BIOS`\
  \ 中禁用 `USB` 启动，并在 `OS` 中禁用 `USB` `Autoruns`。否则，允许使用 `USB` 通常会让你的组织系统面临威胁。\n\n###\
  \ 数码相机\n\n当数码相机被用于拍摄敏感文档或计算机屏幕上的信息时，可能会带来安全风险。数码相机通过电缆连接到计算机系统时可以作为存储设备，从而允许用户将机密文件传输到组织外部，或从外部引入恶意软件。数码相机原生支持无线通信，或通过使用支持\
  \ `WiFi` 的存储卡添加该功能。大多数数码相机包含 `GPS` 芯片，以便对在设备上创建的照片和视频进行地理标记。这可能会暴露敏感或秘密位置，以及拍摄照片或录制视频的时间日期。\n\
  \n## 考试要点\n\n**理解硬件安全。** 系统硬件和外围需要物理访问控制和保护，以维护软件实施的逻辑安全性。如果没有对设施和物理环境的访问控制，其他受保护的系统可能会被破解。\n\
  \n**了解 FDE 和 SED。** 全盘加密 (`FDE`) 或整个磁盘加密通常用于为 `OS`、其安装的应用程序以及所有本地存储的数据提供保护。`FDE`\
  \ 使用单个主对称加密密钥加密存储设备上的所有数据。另一个选项是自加密驱动器 (`SEDs`)。\n\n**理解 TPM。** 可信平台模块 (`TPM`) 既是加密处理器的规范，也是主板上支持此功能的芯片。`TPM`\
  \ 芯片用于存储和处理用于硬件支持和实现的硬盘加密系统的加密密钥。\n\n**定义 HSM。** 硬件安全模块 (`HSM`) 是一种特殊用途的加密处理器，用于多种潜在功能。`HSM`\
  \ 的功能包括加速加密操作、管理和存储加密密钥、卸载数字签名以及改进身份验证。\n\n**理解 UEFI 和 BIOS。** 基础输入输出系统 (`BIOS`)\
  \ 是嵌入在硬件电擦除可只读存储 (`EEPROM`) 中的基础低端固件或软件。`BIOS` 识别并启动基础系统硬件组件。`BIOS` 的替代或改进是统一扩展固件接口\
  \ (`UEFI`)。`UEFI` 提供了与 `BIOS` 相同的功能支持并带有许多改进，例如支持更大的硬盘（特别是用于启动）、更快的启动速度、增强的安全功能，甚至在更改系统时使用鼠标的能力。\n\
  \n**领会 OS 安全。** 没有完全安全的 `OS`。它们都有安全缺陷。每个 `OS` 都需要实施某种程度的安全管理。\n\n**理解 EMI 屏蔽。**\
  \ 屏蔽用于限制或控制来自电磁或射频干扰的干扰。这包括使用屏蔽电缆或抗干扰电缆，或者通过屏蔽导管布设电缆。\n\n**意识到禁用不必要端口和服务的重要性。**\
  \ 如果一个系统运行了许多服务和协议，其攻击面将比仅运行基本服务和协议的系统大。\n\n\n\n\n\n## 理解最小功能原则。在设计和实施安全措施时，可以采用的一项经验法则是最小功能原则。如果你始终选择并安装功能最少或不包含任何不必要的额外功能的解决方案，那么你的结果可能会比选择具有过多选项的解决方案更安全。\n\
  \n## 了解可信操作系统（Trusted OS）的概念。可信操作系统是一种访问控制功能，要求特定的操作系统才能访问资源。可信操作系统的另一个正式定义是：任何符合政府和/或军事安全标准、能够执行多级安全策略的任何操作系统。\n\
  \n## 理解外围安全。系统硬件和外围需要物理访问控制和保护，以维护软件所实施的逻辑安全。\n\n## 3.4 解释安全阶段部署概念的重要性。\n\n安全阶段部署（Secure\
  \ staging）是对新系统（无论是硬件还是软件）进行配置和部署的控制过程。安全阶段过程的目标是确保符合组织的安全策略和配置基准，同时最大限度地减少将不安全的系统接入私有网络甚至互联网带来的风险。本节讨论了可能构成安全阶段部署系统的若干元素。\n\
  \n### 沙箱\n\n`Sandboxing` 是一种隔离或限制手段。它的实施目的是防止新软件或其他可疑软件对生产系统造成伤害。它可以用于应用程序或整个操作系统。\n\
  \n由于在虚拟化上下文中，实施沙箱非常简单，因为你只需要点击几次鼠标或执行命令即可隔离虚拟机。一旦可疑代码被认为是安全的，你就可以将其发布并集成到环境中。如果发现它是恶意的、不稳定的或不受需要的，可以很轻松地将其从环境中移除。\n\
  \n### 环境\n\n组织的 IT 环境必须经过配置和分段，以正确实施阶段部署。这通常要求至少四个主要的网络划分：开发、测试、阶段（staging）和生产。\n\
  \n### 开发\n\n开发网络是公司内部程序员和开发人员编写新软件代码的地方。对于某些组织来说，这可能也是创建定制硬件的地方。该网络必须与所有网络划分完全隔离，以防止恶意软件入侵或未完成产品的外泄。\n\
  \n### 测试\n\n测试网络是对开发中的产品或可能作为最终版本的的产品进行一系列评估、压力测试、漏洞扫描甚至攻击尝试的地方，以确定该产品是否稳定、安全并已准备好部署到生产网络。\n\
  \n### 阶段\n\n阶段网络是对新设备（无论是内部开发还是从外部供应商获取）进行配置的地方，以确保符合公司的安全策略和配置基准。一旦系统完成阶段部署，就可以移动到测试网络进行评估。在系统通过评估后，就可以部署到生产网络。\n\
  \n### 生产\n\n生产网络是完成日常业务任务和工作流程的地方。它应该只在经过适当阶段部署和测试的设备和系统上运行。生产网络应经过管理，使其免受新系统和未经测试的解决方案风险和不可靠性的。生产网络的目标是支持组织数据和业务任务的机密性、完整性和可用性（以及其他目标）。\n\
  \n### 安全基准\n\n`security posture`（安全态）是指组织抵抗攻击的能力水平。组织的安全态可能好也可能差。计划和实施是安全态的一部分，通常被称为\
  \ `secure baseline`（安全基准）或 `security baseline`（安全基准线）。这些包括详细的策略和程序、IT 基础设施和设施的实施，以及对所有人员的适当培训。\n\
  \n经常用于帮助维护加固系统的机制是使用安全基准，这是一种组织内所有系统必须遵守的标准化最小安全水平。这种最小公约数建立了一个坚固且可靠的安全结构，在此基础上建立信任和保证。安全基准由组织的安全策略定义。创建或定义基准需要检查环境的三个关键领域：操作系统、网络和应用程序。它可能包括特定硬件组件、操作系统版本、服务包、补丁和升级、配置设置、附加应用程序、服务设置等要求。\n\
  \n建立安全基准或加固系统的基本程序如下：\n\n1. 移除不需要的组件，如协议、应用程序、服务和硬件（包括设备驱动程序）。\n2. 更新并补补操作系统以及所有安装的应用程序、服务和协议。\n\
  3. 尽可能安全地配置所有已安装软件。\n4. 对系统、活动服务及其托管资源的信息发布施加限制。\n\n文档是建立安全基准和在环境中实施安全的重要方面。系统从设计到实施、调优和安全的每个方面都应该记录文档。缺乏足够的文档通常是难以锁定或加固服务器的主要原因。如果没有适当的文档，在实施安全改进之前，必须发现有关操作系统、硬件配置、应用程序、服务、更新、补丁、配置等所有细节。有了适当的文档，安全专业人员可以快速在现有安全基础上增强，而无需重新检查整个环境。\n\
  \n`security template`（安全模板）是一组安全设置，可以机械地应用于计算机以建立特定的配置。安全模板可以用于建立基准或使系统符合安全策略。它们可以针对工作站和服务器的功能或目的进行定制设计。安全模板是一个通用概念；然而，特定的安全模板可以通过\
  \ Windows 组策略系统应用。\n\n安全模板可以通过手动构建或通过从预配置的主机中提取设置来构建。一旦存在安全模板，你就可以用它配置新或现有机器（通过手动或组策略对象\
  \ `GPO` 将模板应用于目标），或将当前配置与目标配置进行比较。后一个被称为 `security template analysis`（安全模板分析），通常会生成一份详细说明合规差距的报告。\n\
  \n`Operating system hardening`（操作系统加固）是减少漏洞、管理风险并提高操作系统提供或为操作系统提供的安全性的过程。这通常通过利用操作系统的原生安全功能并辅以防火墙、防病毒软件和恶意代码扫描器等附加应用程序来实现。有许多安全配置加固和配置检查清单的在线资源，例如\
  \ NIST 安全配置清单计划网站 [`csrc.nist.gov/groups/SNS/checklists/`](http://csrc.nist.gov/groups/SNS/checklists/)（图\
  \ 3.13），它们可以作为制定组织特定标准操作程序（SOPs）的起点。\n\n![FIGURE 3.13 The NIST Security Configuration\
  \ Checklists Program site](img/c03f013.jpg)\n\n\n\n\n\n# 图 3.13 NIST 安全配置检查清单\n\n\
  操作系统（OS）加固包括保护系统免受有意的定向攻击以及无意或意外的损害。这可以包括实施安全防御措施，以及针对硬件和软件的容错解决方案。系统加固程序中通常包含以下操作：\n\
  \n*   部署最新版本的操作系统。\n*   对操作系统应用任何服务包或更新。\n*   更新所有设备驱动程序的版本。\n*   验证所有活动状态的远程管理或远程连接解决方案都是安全的。避免使用\
  \ `FTP`、`Telnet` 以及其他明文或弱身份验证的协议。\n*   禁用所有不必要的服务、协议和应用程序。\n*   移除或安全地配置简单网络管理协议\
  \ (`SNMP`)。\n*   使用互联网时间服务器同步整个网络的时区和时钟。\n*   配置事件查看器日志设置，以最大限度地捕获和存储审计事件。\n*  \
  \ 重命名默认账户，例如 `administrator`、`guest` 和 `admin`。\n*   对所有账户强制执行强密码。\n*   定期强制更改密码。\n\
  *   限制对管理组和账户的访问。\n*   隐藏最后登录用户的账户名称。\n*   强制账户锁定。\n*   配置登录时显示的法律警告信息。\n*   如果使用了文件共享，强制使用安全的共享协议或使用虚拟专用网络\
  \ (`VPNs`)。\n*   使用安全和漏洞扫描器对系统进行扫描。\n*   扫描开放端口。\n*   在公开访问的系统上禁用互联网控制消息协议 (`ICMP`)\
  \ 的功能。\n*   考虑禁用 `NetBIOS`。\n*   配置审计。\n*   配置备份。\n\n系统使用的文件系统很大地影响了该系统提供的安全性。包含安全特性（如访问控制和审计）的文件系统比不包含安全特性的文件系统更安全。受保护文件系统的绝佳示例是微软新技术文件系统\
  \ (`NTFS`)。它提供了文件和文件夹级的分访问权限和审计功能。不包含安全性的系统示例包括文件分配表 (`FAT`) 和 `FAT32`。\n\n### 完整性测量\n\
  \n完整性测量或评估的主要手段是使用哈希值（hash）。详情请参阅第 6 章“哈希”章节。\n\n## 考试要点\n\n**理解安全分阶段（secure staging）。**\
  \ 安全分阶段是对新系统（无论是硬件还是软件）进行配置和部署的受控过程。安全分阶段的目标是确保符合组织的安全策略和配置基准，同时最大限度地减少将不安全的系统暴露在私有网络甚至互联网上的风险。\n\
  \n**理解沙箱（sandboxing）。** 沙箱是一种检疫或隔离的手段。它的实现目的是限制新软件或其他可疑软件对生产系统造成危害。\n\n**理解安全的 IT\
  \ 环境。** 组织的 IT 环境必须经过配置和分段，以正确实施分阶段。这通常至少需要四个主要的网络区域：开发环境、测试环境、分阶段环境和生产环境。\n\n**意识到安全基准的重要性。**\
  \ 计划和实施是安全态势的一部分，通常被称为安全基准（secure baseline）。这些包括详细的策略和程序、在 IT 基础设施和机设施中的实施，以及对所有人员的适当培训。\n\
  \n## 3.5 解释安全性的安全影响\n\n系统使用的文件系统很大地影响了该系统提供的安全性。包含安全特性（如访问控制和审计）的文件系统比不包含安全特性的文件系统更安全。受保护文件系统的绝佳示例是微软新技术文件系统\
  \ (`NTFS`)。它提供了文件和文件夹级的分访问权限和审计功能。不包含安全性的系统示例包括文件分配表 (`FAT`) 和 `FAT32`。\n\n### 完整性测量\n\
  \n完整性测量或评估的主要手段是使用哈希值（hash）。详情请参阅第 6 章“哈希”章节。\n\n## 考试要点\n\n**理解安全分阶段（secure staging）。**\
  \ 安全分阶段是对新系统（无论是硬件还是软件）进行配置和部署的受控过程。安全分阶段的目标是确保符合组织的安全策略和配置基准，同时最大限度地减少将不安全的系统暴露在私有网络甚至互联网上的风险。\n\
  \n**理解沙箱（sandboxing）。** 沙箱是一种检疫或隔离的手段。它的实现目的是限制新软件或其他可疑软件对生产系统造成危害。\n\n**理解安全的 IT\
  \ 环境。** 组织的 IT 环境必须经过配置和分段，以正确实施分阶段。这通常至少需要四个主要的网络区域：开发环境、测试环境、分阶段环境和生产环境。\n\n**意识到安全基准的重要性。**\
  \ 计划和实施是安全态势的一部分，通常被称为安全基准（secure baseline）。这些包括详细的策略和程序、在 IT 基础设施和机设施中的实施，以及对所有人员的适当培训。\n\
  \n（注：由于原文中存在大量重复段落，根据指令“不要重复输出原文”的原则，此处仅翻译核心内容及结构结构。）\n\n\n\n\n\n大多数 SCADA 系统在设计时的人机界面都非常精简。它们通常使用机械按钮和旋钮，或简单的\
  \ LCD 屏幕界面（类似于你在办公打印机或 GPS 导航设备上看到的界面）。然而，联网的 SCADA 设备可能具有更复杂的远程控制软件界面。\n\n从理论上讲，SCADA\
  \ 的静态设计和极的人机界面本应使系统具有很强的抗攻击或抗修改能力。因此，SCADA 设备中内置的安全防护较少，尤其是在过去。但已经发生过几起著名的 SCADA\
  \ 泄露事件；例如，`Stuxnet`向位于核设施的 SCADA 系统输送了首个 `rootkit`。许多 SCADA 供应商已开始在其解决方案中实施安全改进，以防止或至少减少未来的泄露风险。\n\
  \n## 智能设备/物联网\n\n`Smart devices`（智能设备）是一类移动设备，它们为用户提供了丰富的自定义选项（通常通过安装 App 实现），并可能利用设备端或云端的人工智能（AI）处理。可以标记为“智能设备”的产品正在不断扩大，目前已包含了智能手机、平板电脑、音乐播放器、家庭助手、运动相机和健身追踪器。\n\
  \n`Android` 是基于 Linux 的移动设备操作系统，由 Google 于 2005 年收购。2008 年，第一批运行 Android 的设备向公众发售。Android\
  \ 源代码通过 Apache 许可证开源，但大多数设备也包含专有软件。尽管 `Android` 主要设计用于用于手机和平板电脑，但它已被广泛应用于各种设备，包括电视机、游戏主机、数码相机、微波炉、手表、电子阅读器、无线电话和滑雪护镜。\n\
  \n在手机和平板电脑中使用 `Android` 并不是静态环境的良好范例。这些设备允许广泛的用户自定义：你既可以安装来自 `Google Play Store`\
  \ 的 App，也可以安装来自未知外部源的 App（如 `Amazon’s App Store`），并且许多设备支持将默认版本的 `Android` 替换为自定义版本或替代版本。然而，当\
  \ `Android` 用在其他设备上时，它可以被实现为更接近静态系统的形式。\n\n无论是否为静态，`Android` 都存在许多安全漏洞。包括暴露于恶意 App、运行来自恶意网站的脚本以及允许不安全的数据传输。`Android`\
  \ 设备通常可以被 root（破解其安全和访问限制），以授予用户对设备底层配置设置的完全 root 级访问。root 会增加设备的安全风险，因为所有运行的代码都会继承\
  \ root 权限。\n\n随着新更新的发布，`Android` 的安全性得到了改进。用户可以调整许多配置设置以减少漏洞和风险。此外，用户可能还可以安装可以为平台添加额外安全功能的\
  \ App。\n\n`iOS` 是 Apple 提供的移动设备操作系统，适用于 iPhone、iPad、iPod 和 Apple TV。`iOS` 未经许可不在任何非\
  \ Apple 硬件上使用。因此，Apple 完全控制着 `iOS` 的功能和能力。然而，`iOS` 也是一个静态环境的糟糕范例，因为用户可以从 `Apple\
  \ App Store` 安装超过百万个 App 中的任何一个。此外，通常可以对 `iOS` 进行越狱（破解 Apple 的安全和访问限制），允许用户安装第三方\
  \ App 并对底层设置获得更大的控制权。越狱 `iOS` 设备会降低其安全性并使设备处于潜在的泄露风险中。用户可以调整设备设置来提高 `iOS` 设备的安全性，并安装许多可以增加安全功能的\
  \ App。\n\n物联网（IoT）是一个新的子类别，甚至是一类新的设备，它们连接互联网为家庭或办公室环境中的传统或新家电或设备提供自动化、远程控制或 AI 处理。`IoT`\
  \ 设备有时是对我们几十年来一直在本地手动执行的功能或操作的革命性改进，我们再也不希望失去这些功能。其他 `IoT` 设备无非是昂贵的噱头小工具，在使用一段时间后就会被遗忘。所有\
  \ `IoT` 的安全问题在于访问和加密。很多时候，`IoT` 设备在设计时并未考虑安全性，甚至将其视为事后考虑。这已经导致了许多家庭和办公室的安全漏洞。此外，一旦攻击者通过\
  \ `IoT` 设备获得了访问权限，就可以访问网络上的其他设备。在选择安装 `IoT` 设备时，请评估设备的安全性以及供应商的安全声誉。如果新设备无法满足或接受你的安全基准，就不要为了花哨的小工具损害你的安全性。\n\
  \n一种可能的安全方案是为 `IoT` 设备部署一个独立的网络，与主网络隔离，用于 `IoT` 设备。这种配置通常被称为三路路由器 `图 3.14`（参考 [`www.grc.com/sn-545.pdf`](https://www.grc.com/sn-545.pdf)\
  \ 或 [`www.pcper.com/reviews/General-Tech/Steve-Gibbons-Three-Router-Solution-IOT-Insecurity`](https://www.pcper.com/reviews/General-Tech/Steve-Gibbons-Three-Router-Solution-IOT-Insecurity)）。\n\
  \n![图 3.14 三路路由器网络布局](img/c03f014.jpg)\n\n图 3.14 三路路由器网络布局\n\n虽然我们经常将智能设备和 `IoT`\
  \ 与家庭或个人使用相关联，但它们也是组织的关注点。这部分是因为员工在公司设施内甚至组织网络上使用了移动设备。这些担忧通常通过 `BYOD`、`COPE` 或\
  \ `CYOD` 策略解决（更多信息请参见第 2 章“部署模型”部分）。网络专业关注的另一个方面是 `IoT` 或联网自动化设备被添加到业务环境中。这包括环境控制（如空调管理、空气质量控制、碎片和烟雾检测、照明控制）、门自动化、人员和资产追踪以及耗材库存管理和自动订购（如咖啡、零食、打印机粉、纸和其他办公用品）。因此，智能设备和\
  \ `IoT` 设备都是现代业务网络的潜在元素，需要适当的安全管理和监督。有关智能设备和 `IoT` 设备妥善安全管理的额外阅读材料，请参阅“NIST 物联网倡议”：[`www.nist.gov/itl/applied-cybersecurity/nist-initiatives-iot`](https://www.nist.gov/itl/applied-cybersecurity/nist-initiatives-iot)。\n\
  \n## 可穿戴技术\n\n可穿戴技术是智能设备和 IoT 设备的分支，专为个人佩戴设计。可穿戴技术最常见的例子是智能手表和健身追踪器。\n\n## 家庭自动化\n\
  \n\n\n\n\n智能设备和物联网（IoT）中一个非常流行的元素是家居自动化设备。这些包括智能恒温器、烤箱、冰箱、车库门、门铃、门锁和安全摄像头。这些物联网设备可以为各种琐碎、单调或不便活动提供自动化或调度功能，例如管理家庭暖空调系统、将杂货添加到在线购物列表、在您靠近时自动打开或解锁门、记录家中的访客，以及烹饪晚餐以便在您下班回家时恰好就绪。\n\
  \n与家居自动化设备相关的注意事项与智能设备、物联网和可穿戴设备相同。务始终考虑安全影响，评估已包含或缺失的安全功能，考虑将设备部署在与其他计算机设备隔离的独立网络中，并仅使用提供强效身份验证和加密的解决方案。\n\
  \n### HVAC\nHVAC（供暖、通风和空调）可以通过嵌入式解决方案控制（可能也被称为智能设备或物联网设备）。关于安全问题，请参见之前对智能设备的讨论，并参见“环境控制”下稍后的“HVAC”章节。物理安全控制防御物理攻击，而逻辑和技术控制仅防御逻辑和技术攻击。\n\
  \n### SoC\n片上系统（SoC）是一种集成电路（IC）或芯片，将计算机的所有元素集成到单个芯片中。这通常包括主 CPU、内存、GPU、WiFi、线路网络、外围接口（如\
  \ USB）和电源管理。在大多数情况下，与完整的计算机相比，SoC 缺失的唯一项是批量存储。通常必须附带或连接到 SoC 以存储其程序和其他文件，因为 SoC\
  \ 通常只包含足够保留其固件或操作系统的内存。\n\nSoC 的安全风险包括 SoC 的固件或操作系统通常非常精简，这为大多数安全功能留下的空间很小。SoC 可能能够过滤输入（例如通过长度或转义元字符）、拒绝未签名代码、提供基础防火墙过滤、使用通信加密并提供安全的身份验证。但这些功能在所有\
  \ SoC 产品上并不可用。使用 SoC 的少数设备包括微型计算机树莓派、健身追踪器、智能手表和某些智能手机。\n\n### RTOS\n实时操作系统（RTOS）旨在以最小的延迟或等待处理或处理到达系统的数据。RTOS\
  \ 通常存储在只读存储（ROM）中，并设计为在硬实时或软实时条件下运行。硬实时解决方案用于任务关键型操作，为了安全起见，必须消除或最小化延迟，例如自动驾驶汽车。软实时解决方案用于在典型或正常情况下可以接受适度延迟的情况，如大多数消费电子产品，例如数字手写笔和计算机上图形程序之间的延迟。\n\
  \nRTOS 可以是事件驱动或时间分共享的。事件驱动 RTOS 会根据预定义的优先级在操作或任务之间切换。时间分共享 RTOS 会根据时钟中断或特定时间间隔在操作或任务之间切换。当调度或定时是所执行任务中最关键的部分时，通常会实现\
  \ RTOS。\n\n使用 RTOS 的安全考虑问题是这些系统通常非常专注且用途单一，为安全留下的空间很少。它们经常使用自定义或专有代码，这些代码可能包含攻击者发现的未知漏洞或缺陷。当调度或定时是所执行任务中最关键的部分时，通常会实现\
  \ RTOS。\n\n### 打印机/MFD\n参见“外围设备”下较早的“打印机/MFD”章节以了解其安全影响。如果打印机或多功能设备（MFD）具有网络能力，则可以被视为嵌入式设备。现代打印机和\
  \ MFD 通常是机箱内的全功能计算机，这增加了安全风险。网络管理员需要将所有此类设备纳入其安全管理策略中，以防止此类妥协。\n\n### 摄像头系统\n参见“外围设备”下较早的“数字摄像头”章节以了解其安全影响。某些摄像头系统包含\
  \ SoC 或嵌入式组件，赋予其网络能力。作为网络节点运行的可以被远程控制；提供自动化功能；并可能执行特殊功能，例如延时录制、跟踪、脸识别或滤波录制。\n\n\
  ### 特殊用途\n随着计算机控制、远程访问、远程管理、自动化、监控和 AI 处理应用于专业和个人事件及任务，嵌入式系统的概念正在迅速扩大。除了本节之前提到的概念外，还有一些您应该熟悉的其他特殊用途嵌入式系统。这些包括大型机、游戏机、医疗设备、车辆以及飞机/无人机。\n\
  \n*大型机*是用于执行高度复杂的计算并提供批量数据处理的高端计算机系统。旧的大型机可以被认为是静态环境，因为它们通常是围绕单个任务设计或支持单个任务关键型应用程序。这些配置没有提供显著的灵活性，但它们提供了高稳定性和长期运行。现代大型机要灵活得多，通常用于为支持大量虚拟机提供高速计算能力。每个虚拟机都可以用于托管唯一的操作系统，反过来支持广泛的应用程序。如果实施现代大型机是为了为一个操作系统或应用程序提供固定或静态支持，它可以被认为是一个静态环境。\n\
  \n*游戏机*，无论是家用系统还是便携系统，都是静态系统和嵌入式系统的示例。游戏机的操作系统通常是固定的，仅在供应商发布系统升级时才会更改。此类升级通常是操作系统、应用程序和固件改进的混合体。\n\
  \n\n\n\n越来越多的医疗设备集成了 `IoT` 技术，以便实现远程访问、监控和管理。这可能是医疗治疗领域的一项重大创新，但也带来了安全风险。所有的计算机系统都容易受到攻击和滥用。所有的计算机系统都存在可能被攻击者发现并滥用的缺陷和故障。尽管大多数医疗设备供应商都努力提供稳健且安全的产品，但不可能考虑到并测试每一种攻击、访问或滥用的可能性。目前已经发生了多起医疗设备被远程控制、禁用、访问或受到\
  \ `DoS` 攻击的案例。在使用任何医疗设备时，请考虑远程访问（无论有线还是无线）对于其提供的医疗护理是否至关重要。如果不是必要的，禁用医疗设备的网络功能可能更有意义。虽然个人电脑或智能手机的泄露可能会不便和/或尴尬，但医疗设备的泄露可能会威胁生命。\n\
  \n## 车辆\n\n`In-vehicle computing systems` 可能包括用于监控发动机性能以及优化制动、转向和悬挂的组件，也可以包括与驾驶、环境控制和娱乐相关的仪表盘元件。早期的车载系统是静态环境，几乎完全没有调整或更改的能力，特别是对于所有者/驾驶员而言。现代车载系统可能提供更广泛的功能，包括连接移动设备或运行自定义应用程序。车载计算系统可能具有或没有充分的安全机制。即使系统仅提供信息（例如发动机性能、娱乐和导航），也需要考虑解决方案中包含了哪些安全特性。它是否连接到云服务？通信是否加密？身份验证有多强？它是否容易被未经授权的第三方访问？如果车载计算系统正在控制车辆（这可能被称为自动驾驶或自驾驶），那么将安全作为系统的主要设计元素就更为重要。否则，车辆可能会从方便的交通工具变成一个死亡之盒。\n\
  \n## 飞机/无人机\n\n自动驾驶系统已作为飞机的一部分几十年。在你乘坐的大多数飞机中，人类飞行员可能只在起飞和降落阶段对飞机拥有完全控制权，在那时也不总是如此。在飞行的大部分时间内，自动驾驶系统可能一直控制着飞机。军事、执法部门和爱好者一直使用无人机（`UAVs`），但通常是在远程控制下。现在，随着飞行自动化系统的出现，`UAVs`\
  \ 可以完全自主地起飞、飞往目的地并降落。甚至有许多零售企业正在实验并在某些国家实施 `UAV` 递送食品和/或其他包裹。\n\n自动化飞机和 `UAVs` 的安全是我们所有人都关注的问题。这些系统是否能够防止恶意软件感染、信号干扰、远程控制接管、`AI`\
  \ 故障和远程代码执行？`UAV` 是否与授权的控制系统建立了经过验证的连接？`UAV` 的通信是否加密？如果通过 `DoS` 或信号干扰阻塞了与控制系统的所有联系，飞机将怎么办？受攻击的\
  \ `UAV` 可能会导致披萨丢失、产品受损、几片瓦片损坏或严重的人身伤害。\n\n## 考试要点\n\n理解嵌入式系统。嵌入式系统是作为系统一部分实现的计算机。嵌入式系统通常围绕其所属的大型产品的特定限制功能而设计。\n\
  \n理解静态环境。静态环境是针对特定需求、能力或功能进行配置，然后设置为保持不变的应用程序、操作系统、硬件 set 或网络。示例包括 `SCADA`、嵌入式系统、`Android`、`iOS`、主机、游戏机和车载计算系统。\n\
  \n理解静态环境的安全方法。静态环境、嵌入式系统和其他限制或单一用途计算环境需要安全管理。这些技术可能包括网络分段、安全层、应用防火墙、手动更新、固件版本控制、封装以及控制冗余和多样性。\n\
  \n了解 `SCADA` 和 `ICS`。监控控制与数据采集（`SCADA`）是工业控制系统（`ICS`）的一种。`ICS` 是一种计算机管理设备，用于控制工业过程和机器。`SCADA`\
  \ 被应用于许多行业。\n\n理解智能设备。智能设备为用户提供大量自定义选项的移动设备，通常通过安装应用程序，并可能利用设备端或云端的人工智能（`AI`）处理。\n\
  \n理解 `IoT`。物联网（`IoT`）是一个新的类别甚至是一类新的联网设备，旨在为家庭或办公室环境中的传统或新电器或设备提供自动化、远程控制或 `AI` 处理。\n\
  \n理解 `SoC`。系统级芯片（`SoC`）是一种集成电路（`IC`）或芯片，将计算机的所有元件集成到一个芯片中。\n\n了解 `RTOS`。实时操作系统（`RTOS`）设计用于以最小的延迟或等待处理或处理进入系统的数据。`RTOS`\
  \ 通常存储在只读存储器（`ROM`）上，并设计用于在硬实时或软实时条件下运行。\n\n## 3.6 总结安全应用开发和部署概念\n\n安全的软件始于安全的开发和部署系统。只有当软件产品以安全的方式进行设计、制作和分发时，最终产品才能提供可靠且可信的安全保障。本节讨论了安全软件部署和开发的几个方面。\n\
  \n### 开发生命周期模型\n\n开发生命周期模型是创建新产品或修改现有产品任务的有序方法。正式的 `软件开发生命周期 (SDLC)` 模型通过建立一个让新想法变成实际软件的标准流程，有助于确保产品更加可靠、更稳定。软件开发的存在时间与计算机一样长——不到\
  \ 100 年。现代软件只有 30 年或 40 年左右的历史。最早的软件开发管理形式形成于 20 世纪 70 年代和 80 年代，但直到 1991 年软件工程协会建立能力成熟模型（`CMM`）时，软件管理概念才正式建立并广泛采用。\n\
  \n#### 瀑布式 vs 敏捷\n\n两个主要的 `SDLC` 概念是瀑布模型和敏捷模型。瀑布模型（图 3.15）包含七个阶段或步骤。最初的想法是项目开发将按照从第一个到最后一个顺序通过这些步骤，并限制不允许返回较早的阶段。“瀑布”这一名称源于瀑布中岩石阶梯的概念，水落在每个阶梯上然后向下进入下一个阶梯，水无法向上回流。瀑布模型的较新修订版本允许返回较早的阶段（如图像中的向上箭头所示），以解决后期阶段发现的遗漏或错误。\n\
  \n![FIGURE 3.15 瀑布模型](img/c03f015.jpg)\n\n**FIGURE 3.15** 瀑布模型\n\n\n\n\n\n瀑布模型的主要受限之处是它只能返回到直接的前一个阶段。这阻止了返回早期阶段以纠正那些在开发过程后期才被发现的概念和设计问题。因此，它迫使人们完成一个已知存在缺陷或无法实现目标的产品。\n\
  \n为了解决这个问题，人们设计了改进后的瀑布模型。该版本在每个阶段都增加了验证和确认过程，以便在一个阶段完成时，通过评审过程确保每个阶段的目的、功能和目标已成功且正确地实现。\n\
  \n然而，在另一种变体——螺旋模型出现之前，这种模型改进并没有被广泛采用。螺旋模型 `图 3.16` 的设计核心是多次重复早期的阶段（称为迭代），以确保每个阶段的每个元素和方面在最终产品中都能得到满足。\n\
  \n![图 3.16 螺旋模型](img/c03f016.jpg)\n\n`图 3.16` 螺旋模型\n\n在图中，每个螺旋都会穿过前四个初始阶段。在迭代完成时，会开发并测试一个解决方案的原型\
  \ `(P1, P2, …)`。根据原型，重复螺旋路径。完成多次迭代，直到原型满足初始阶段的所有或大部分需求、设计目标和功能，此时最终原型就成为最终产品。\n\n\
  最现代的软件开发生命周期（SDLC）模型之一是敏捷（Agile），它基于自适应开发，将关注运行的产品和满足客户需求置于对流程的僵化遵守、特定工具的使用以及详细文档记录之上。敏捷关注开发的自适应方法；它支持早期交付、持续改进以及对变化的灵活和快速响应。\n\
  \n2001 年，17 位敏捷开发先驱制定了《敏捷软件开发宣言》`[`agilemanifesto.org`](http://agilemanifesto.org)`，其核心哲学阐述如下：\n\
  \n> 我们通过实践和帮助他人实践来发现更好的软件开发方法。通过这项工作，我们开始重视：\n\n> `个体和互动` 高于 流程和工具\n\n> `可运行的软件`\
  \ 高于详尽的文档\n\n> `客户协作` 高于 谈判\n\n> `响应变化` 高于 遵循计划\n\n> 也就是说，虽然右侧的项目也有价值，但我们更看重左侧的项目。\n\
  \n此外，《敏捷宣言》还规定了指导开发哲学的 12 条原则：\n\n> “我们的首要任务是通过早期和持续交付有价值的软件来满足客户的需求。\n\n> 欢迎需求的变化，即使在开发后期也是如此。敏捷过程利用变化为客户创造竞争优势。\n\
  \n> 频繁地交付可运行的软件，周期从几周到几个月不等，并倾向于更短的时间范围。\n\n> 业务人员和开发人员在整个项目期间每天共同工作。\n\n> 围绕积极主动的个人来构建项目。\n\
  \n> 为他们提供完成工作所需的环境和支持。\n\n> 可运行的软件是衡量进展的首要标准。\n\n> 敏捷过程促进可持续开发。\n\n> 保持恒定的工作节奏。\n\
  \n> 对技术卓越和良好设计的持续关注可增强敏捷性。\n\n> 简单性——最大化减少未工作工作的艺术——至关重要。\n\n> 最好的架构、需求和设计源于自组织团队。\n\
  \n> 团队定期反思如何变得更有效，然后调整其行为。”\n\n敏捷正迅速成为主导性的 SDLC 模型，被各种大小的团体所采用。\n\n### 安全 DevOps\n\
  \nDevOps，或开发与运维，是一项整合许多元素的新运动。DevOps 通常由开发、运维、安全和质量保证组成。安全 DevOps 是 DevOps 的变体，它优先考虑安全性。DevOps\
  \ 有许多目标，包括缩短上市时间、提高质量、维护可靠性以及将安全性引入到设计和开发过程中。\n\n#### 安全自动化\n\n安全自动化对 DevOps 至关重要，以确保更早地发现问题和漏洞，以便进行妥善处理。这包括自动化漏洞扫描和代码攻击、使用模糊测试技术发现逻辑缺陷或缺乏输入清理的情况，以及使用评估软件管理错误的代码扫描器。\n\
  \n#### 持续集成\n\n为了使安全在任何开发活动中取得成功，它必须在开发过程开始和整个过程中进行集成和维护。安全 DevOps 必须采用持续集成方法，确保将自动化工具、自动化测试和安全元素的后续注入贯穿整个过程。程序员需要采用安全的编码实践，安全专家需要培训程序员，安全审计员需要在整个开发过程中监控代码。\n\
  \n#### 基准设定（Baselining）\n\n每个开发项目都需要一个基准。基准是项目向发布迈进时必须满足的最低功能、响应和安全水平。任何不符合或超过基准的软件产品将被拒绝，并必须返回开发阶段进行改进。基准是质量控制的一种。\n\
  \n#### 不变系统（Immutable systems）\n\n不可变系统是一种服务器或软件产品，一旦配置并部署，就不会在原地进行修改。相反，当需要新版本或进行更改时，会创建一个修订版本，然后部署新系统以替换旧系统。不可变系统的概念是防止对某个系统或另一个系统的微调和更改导致配置差异的复杂化。\n\
  \n\n\n\n基础设施即代码（Infrastructure as code）是硬件管理感知和处理方式的一种转变。它不再将硬件配置视为一种手动的、直接操作的、一对一的管理负担，而是将其视为另一组元素，并像在\
  \ DevOps 下管理软件和代码一样对其进行管理。这种硬件管理方式的转变使许多组织能够简化基础设施变更，使其比以前更容易、更快速、更安全，且更可靠。基础设施即代码通常需要实施硬件管理软件，例如\
  \ `Puppet`。此类解决方案为过去无法以这种方式管理的 IT 基础设施部分提供了版本控制、代码审查、持续集成和代码评审。\n\n## 版本控制与变更管理\n\
  \n在安全环境中进行变更可能会引入漏洞、重叠、对象缺失和疏忽，从而导致新的漏洞。面对变更时，维持安全性的唯一方法是系统地管理变更。变更管理通常涉及对安全控制和机制相关的活动进行广泛的计划、测试、记录、审计和监控。环境变更记录随后被用于识别变更主体，无论这些主体是对象、主体、程序、通信路径还是网络本身。\n\
  \n变更管理的目标是确保任何变更都不会导致安全性下降或损害。变更管理还负责使任何变更回滚到之前的安全状态成为可能。变更管理可以实施在任何系统中，无论其安全级别如何。最终，变更管理通过保护已实施的安全免受意外、间接或影响性的损害，提高了环境的安全性。虽然变更管理的一个重要目标是防止安全性的意外降低，但其首要目的是让所有变更都经过详细的记录和审计，从而能够接受管理层的审查和监督。\n\
  \n变更管理应用于监督系统各个方面的变动，包括硬件配置以及操作系统和应用程序。变更管理应包含在设计、开发、测试、评估、实施、发布、演进、增长、持续运行和修改中。它要求对每个组件和配置进行详细清单。它还需要对每个系统组件（从硬件到软件，从配置设置到安全功能）收集并维护完整的文档。\n\
  \n配置、版本控制或变更管理的变更控制过程有几个目标或要求：\n\n*   以受监控且有序的方式实施变更。变更始终受控的。\n*   包含正式的测试过程，以验证变更是否产生了预期结果。\n\
  *   所有变更都可以撤销。\n*   在变更发生前通知用户，以防止生产力损失。\n*   系统地分析变更的影响。\n*   尽可能减少变更对能力、功能和性能的负面影响。\n\
  \n变更管理过程的一个示例是`parallel run`并行运行，这是一种新系统部署测试，其中新系统和旧系统并行运行。在每个系统中同时执行每个主要或重要的用户过程，以确保新系统支持旧系统支持或提供的所有所需业务功能。\n\
  \n变更是安全性的对立面。事实上，变更往往会导致安全性降低。因此，安全环境通常实施变更管理系统，以尽力减少变更对安全性的负面影响。`Change documentation`变更文档是变更管理系统的一个方面：它是实施实施之前，写出对系统、计算机、软件、网络等要进行的变更细节的过程。然后，实施变更。\n\
  \n## 配置与取消配置\n\n`Change documentation` 是变更管理系统的一个方面：它是在实施之前，写出对系统、计算机、软件、网络等要进行的变更细节的过程。然后，实施变更。\n\
  \n## 安全编码技术\n\n安全编码概念是在软件开发过程中将安全性实现到软件中的努力。安全性仍然需要正确编码，并避免常见的陷阱和错误。\n\n### 正确的错误处理\n\
  \n当发生错误时，程序应回到安全状态。这通常被称为 `fail-secure design`（故障安全设计）。然而，程序员必须将此编码到应用程序中，以便发生真正的故障安全响应。这应该包括错误和异常处理。当过程、步骤或输入导致错误时，系统应恢复到更安全的状态。这可能包括重置到之前的操作状态、重启到安全状态或回收连接状态以恢复安全通信。错误还应向访客和用户提供最少的信息，特别是对外部/外部访客和用户。所有详细的错误信息都应存储在访问限制的日志文件中，供编程人员和管理员使用。每当遇到异常时，应拒绝它并触发故障安全响应。\n\
  \n### 正确的输入验证\n\n`Input validation` 输入验证是防御性编程的一个方面，旨在防止各种针对输入的内容的攻击，例如缓冲区溢出和模糊测试（fuzzing）。输入验证在允许处理每个接收到的输入之前都会对其进行检查。检查可以是长度、字符类型、语言类型、域，甚至是时间检查，以防止未知、不想要或意外的内容进入核心程序。\n\
  \n### 规范化\n\n规范化是一种数据库编程和管理技术，用于减少冗余。规范化的目标是防止冗余数据，冗余数据会浪费空间并增加处理负载。规范化的数据库更高效，并允许更快速的数据检索操作。删除重复和冗余数据确保敏感数据仅存在于一个表或数据库（原始源）中，而不是在许多其他地方重复。这可以降低安全敏感数据管理难度，因为允许数据库安全管理员在原始数据源上实施访问控制，而无需尝试锁定每个重复副本。\n\
  \n#### 存储过程\n\n\n\n\n\n存储过程是一个子程序或软件模块，可以被那些与关系型数据库管理系统（RDBMS）交互的应用程序调用或访问。存储过程可用于输入期间期间数据验证、管理访问控制、评估数据逻辑等。存储过程可以使某些数据库应用程序变得更高效、更一致且更安全。\n\
  \n## 代码签名\n代码签名是对软件程序创建数字签名的活动，以确认该程序未被更改以及其来源是谁。请参阅第 6 章的“数字签名”章节。\n\n## 加密\n加密用于保护存储中的数据和传输中的数据。程序员应在应用程序中采用可信且可靠的加密系统。关于加密和密码学的广泛讨论，请参阅第\
  \ 6 章。\n\n## 混淆/伪装\n混淆或伪装是一种编码实践，即专门编写难以被其他程序员破译的代码。采用这些技术可能是为了防止未经授权的第三方理解专有解决方案。恶意程序员也可能采用这些技术来隐藏软件的真实意图和目的。\n\
  \n## 代码复用/死代码\n代码复用是在一个新程序中包含现有的代码。通过采用和重用现有代码，代码复用可以作为加快开发过程的一种方式。然而，重用代码时应注意不要违反版权或知识产权限制。充分理解重用的代码也是重要的，以确保不会通过回收的代码向新产品中引入后门或其他可利用的漏洞。\n\
  \n死代码是软件中任何被执行但其输出或结果未被任何其他过程使用的部分。从本质上说，执行死代码是对时间和资源的浪费。程序员应努力尽量减少并消除产品中的死代码，以提高效率并减少可利用的错误或漏洞的可能。死代码有时被用作混淆的一部分。\n\
  \n## 服务端 vs 客户端的执行与验证\n服务端验证适用于保护系统免受恶意用户提交的输入。大多数脚本或移动 Applet 的客户端执行都可以被熟练的网黑客轻松绕过。因此，如果提交到服务器的操作绕过了这些保护，任何客户端过滤的防御都是微乎其微。网络黑客可以编辑\
  \ `JavaScript` 或 `HTML`、修改表单、更改 URL 等。因此，永远不要假设任何客户端过滤是有效的——所有输入在处理之前都应在服务端进行重新评估。服务端验证应包括对输入长度的检查、对已知的脚本化或恶意内容的过滤（如\
  \ `SQL` 命令或脚本调用），以及对元字符的过滤（见见第 1 章“威胁、攻击与漏洞”）。\n\n客户端验证同样重要，但其重点在于为典型用户提供更好的响应或反馈。客户端验证可用于指示输入是否符合某些要求，例如长度、值、内容等。例如，如果要求提供电子邮件地址，客户端验证检查可以确认它使用了支持的字符，并符合\
  \ `username@FQDN` 这种典型的构型结构。\n\n尽管所有的验证都可以在服务端进行，但这通常是一个更复杂的过程并会给交互带来延迟。服务端和客户端验证的结合可以在保持合理安全防御的同时，实现更高效的交互。\n\
  \n## 内存管理\n程序员应在软件中包含侧重于妥当内存管理的代码。软件应该预分配内存缓冲区，但也要限制发送到这些缓冲区的输入。包含输入限制检查是安全编码实践的一部分，但在软件创建的初始阶段，可能被视为无用的工作。某些程序员专注于让新代码运行起来，意图是将来返回代码以提高安全性和效率。遗憾的是，如果功能性编码工作比预期的长，可能会导致安全修订被降至最低或跳过。务必确保使用安全编码实践（例如适当的内存管理），以防止各种常见的软件漏洞，如缓冲区溢出攻击。\n\
  \n## 第三方库和 SDK 的使用\n第三方软件库和软件开发包（SDK）通常是程序员不可或缺的工具。使用现有的代码允许程序员专注于自己的自定义代码和逻辑。SDK\
  \ 为软件编写提供指导，以及解决方案，例如特殊的 `APIs`、子程序或存储过程，这些可以简化为复杂执行环境创建软件的工作。\n\n然而，当您使用第三方软件库时，预先编写的代码可能包含未知且尚未发现的缺陷、后门或其他可利用的问题。在依赖任何第三方代码之前，尝试对其进行审查。同样，`SDK`\
  \ 可能没有将安全和效率作为首要任务，因此请评估 `SDK` 提供的功能和能力是否符合自身的编程和安全标准。\n\n## 数据暴露\n当软件未能妥善保护其处理的数据时，可能会导致未经授权的数据暴露。程序员需要在其产品中包含授权、身份验证和加密方案，以防止数据泄露、丢失和暴露。\n\
  \n## 代码质量与测试\n无论网络加固、审计还是用户培训都无法弥补糟糕的编程。稳固的应用安全对于任何组织的长期生存都至关重要。应用安全始于安全编码和设计，并在软件生命周期内通过测试和补丁进行维护。代码质量需要在执行前进行评估。软件测试需要在发布前进行。\n\
  \n在将新应用程序部署到生产环境之前，您应该将其安装到实验室或试点环境中。一旦完成测试，部署程序应包含安装指南的编写，该指南不仅包含部署步骤，还必须包含初始配置的基准。这可以是一个书面基准，也可以是可以应用的的模板文件。应用程序配置基准的目的是确保符合策略并减少人为错误。基准可以定期重新应用或根据不断的工作条件进行验证。\n\
  \n### 静态代码分析器\n`静态代码分析器`在不执行程序的情况下审查原始源代码。这种调试工作旨在程序在目标或客户系统运行之前定位缺陷。静态代码分析通常是软件质量和安全测试的第一步。\n\
  \n### 动态分析（例如：模糊）\n`动态分析`是在程序执行期间对软件代码进行测试和评估。然后对执行的代码接受一系列输入以评估其行为和响应。执行动态分析的一种方法被称为模糊。\n\
  \n### 模糊\n`模糊` 是一种针对目标程序生成输入的软件测试技术。模糊测试的目标是发现导致错误、失败和崩溃的输入集，或者发现目标程序中的其他未知缺陷。基本上，`fuzz-tester`\
  \ 暴力攻击在给定参数内生成的输入远超正常用户或环境能做的输入。通过模糊工具发现的信息可以改进软件，也可以用于开发针对它的漏洞程序。\n\n\n\n\n\n当模糊测试工具发现一个导致目标应用程序出现异常行为的构造输入时，该输入和响应会被记录在日志中。安全专业人员或黑客会审查这些感兴趣输入的日志。通过正确的技能和工具，模糊测试的结果可以转换为修复已发现缺陷的补丁，或者是利用这些缺陷的漏洞利用程序。\n\
  \n## 压力测试\n\n`Stress testing` 是动态分析的另一种变体，使硬件或软件产品承受各种程度的负载，以评估其在压力下的运行和功能能力。压力测试可以从较低的流量水平开始，然后增加到异常高水平。压力测试的目的是了解产品在正常条件到\
  \ DoS 级流量或负载之间的各种情况下将如何表现、反应或失败。\n\n## 沙盒\n\n`sandbox` 是一个受限执行环境的软件实现，用于封装应用程序。沙箱（图\
  \ 3.17）通常用于保护整个计算机免受新的、未知且未经测试的应用程序的影响。沙箱为包含的应用程序提供执行所需的直接或间接系统资源访问，但没有更改周围环境或存储设备（其文件之外）的能力。沙箱通常用于软件测试和潜在恶意软件评估，它是虚拟化概念的基础。\n\
  \n![FIGURE 3.17 Application sandboxing](img/c03f017.jpg)\n\n`图 3.17` 应用程序沙箱\n\n\
  ## 模型验证\n\n`Model verification` 是软件开发过程的一部分，通常用于确保编写的代码仍然符合开发流程、体系模型或设计限制。模型验证还可以扩展到通过运行测试来确保软件解决方案能够实现预期的现实结果。模型验证可以确保产品在开发过程中符合安全基线要求。\n\
  \n## 编译代码与运行时代码\n\n大多数应用程序是用一种高级语言编写的，这种语言更接近人类语言（如英语），而不是组成机器语言的 1 和 0。高级语言更容易供人们学习和使用以构建新的软件解决方案。然而，高级语言最终必须转换为机器语言以执行预期的操作。\n\
  \n如果代码使用创建输出可执行文件的编译器转换为机器语言，则该语言被称为编译型语言。生成的可执行文件可以随时运行。\n\n如果代码保持其原始的可读形式，并仅在执行时刻转换为机器语言，则该语言是运行时编译语言。某些运行时语言会一次将整个代码编译/转换为机器语言以执行，而另一些则一次仅编译/转换一行（有时被称为即时执行或编译）。\n\
  \n编译代码更难让攻击者注入恶意软件，但也很难检测此类恶意软件。运行时代码更容易让攻击者注入恶意软件，但更容易检测此类恶意软件。\n\n## 考试要点\n\n\
  **理解 SDLC。** 开发生命周期模型是创建新产品或修订现有产品任务的系统化排序。正式的软件开发生命周期（`SDLC`）模型通过建立使新想法变为实际产品的流程，有助于确保产品更加可靠稳定。\n\
  \n**掌握瀑布模型。** 瀑布模型由七个步骤组成。\n\n**理解敏捷。** `Agile` 模型基于自适应开发，关注客户需求。\n\n**理解 DevOps。**\
  \ `DevOps` 通常由开发和运维组成。\n\n**理解变更管理。** 变更的目标是为了确保变更不会导致漏洞。这通常涉及规划、测试、审计和监控。\n\n**了解配置和取消配置。**\
  \ `Provisioning` 用于确保有可用资源。`Deprovisioning` 专注于从退役的服务器上释放资源。\n\n**理解安全编码概念。** `Secure\
  \ coding` 概念是在软件开发过程中旨在实现安全特性的努力。\n\n**理解错误处理。** 当进程、程序或输入导致错误时，系统应恢复到更安全的状态。\n\n\
  **理解输入验证。** `Input validation` 在允许处理每个收到的输入之前进行检查。\n\n**了解归一化。** `Normalization`\
  \ 是一种用于减少冗余的数据库编程和管理技术。\n\n**理解存储过程。** `stored procedure` 是一个子程序或软件模块，可以被与 RDBMS\
  \ 交互的应用程序调用或访问。\n\n**了解代码签名。** `Code signing` 为软件程序创建数字签名的活动，以确认其未被更改以及其来源者。\n\n\
  **理解混淆和伪装。** `Obfuscation` 或 `camouflage` 是一种编码实践，专门编写编写以让其他程序员难以破译的代码。\n\n**理解代码复用。**\
  \ `Code reuse` 是在新程序中包含预先代码。\n\n\n\n\n\n## 安全编码最佳实践\n\n### 理解死代码。\n死代码是指任何任何被执行但其执行输出或结果未被任何其他过程使用的软件部分。从本质上说，执行死代码是对时间和资源的浪费。\n\
  \n### 了解服务器端验证。\n\n服务器端验证适用于保护系统免受恶意用户提交的输入。它应该包含对输入长度的检查、对已知的脚本化或恶意内容的过滤（如 `SQL`\
  \ 命令或脚本调用），以及对元字符的过滤。\n\n### 理解客户端验证。\n客户端验证侧重于为普通用户提供更好的响应或反馈。它可以被用于指示输入是否符合某些要求，例如长度、取值、内容等。\n\
  \n### 了解内存管理。\n软件应该包含适当的内存管理，例如预分配内存缓冲区，同时也限制发送到这些缓冲区的输入。包含输入限制检查是安全编码实践的一部分。\n\n\
  ### 理解第三方库和 SDK。\n第三方软件库和软件开发工具包（`SDKs`）通常是程序员不可或缺的工具。使用现有的代码可以让程序员专注于自己的自定义代码和逻辑。\n\
  \n### 理解代码质量和测试。\n应用程序安全始于安全编码和设计，随后通过测试和补丁在软件的生命周期内进行维护。\n\n### 理解静态代码分析器。\n静态代码分析器在不执行程序的情况下审查产品的原始源代码。这种调试工作侧重于在程序在目标或客户系统上运行之前定位软件代码中的缺陷。\n\
  \n### 了解动态分析。\n动态分析是在程序执行期间对软件代码进行测试和评估。执行中的代码随后将接受一系列输入，以评估其行为和响应。\n\n### 理解模糊测试（Fuzzing）。\n\
  模糊测试是一种软件测试技术，用于为目标程序生成输入。模糊测试的目标是发现导致错误、失败和崩溃的输入集，或者发现目标程序中的其他缺陷。\n\n### 了解压力测试。\n\
  压力测试是动态分析的另一种变体，其中硬件或软件产品被置于各种工作负载之下，以评估其在压力下运行和发挥功能的能力。\n\n### 理解沙箱。\n沙箱是一种受限执行空间的软件实现，用于封装应用程序。沙箱通常用于保护整个计算机免受新的、未知的、未经测试的应用程序的侵害。\n\
  \n### 理解模型验证。\n模型验证通常是软件开发过程的一部分；它用于确保编写的代码仍然符合开发流程、架构模型或设计限制。\n\n### 理解编译后的代码。\n\
  如果代码使用编译器创建输出可执行文件转换为机器语言，那么该语言就是编译型语言。\n\n### 了解运行时代码。\n如果代码保持其原始的可读形式，并且仅在执行的那一刻被转换为机器语言，那么该语言就是运行时编译语言。\n\
  \n## 3.7 总结云和虚拟化概念\n\n虚拟化技术用于在单台主机的内存中托管一个或多个 `OSs`。这种机制允许几乎任何 `OS` 在任何硬件上运行。它还允许多个\
  \ `OSs` 在同一块硬件上同时工作。云计算通常是远程虚拟化。请复阅本章之前的“虚拟化”章节。\n\n云计算和虚拟化，特别是当你在云中进行虚拟化时，带有严重的风险。一旦敏感、机密或专有数据离开了组织的范围，它们也离开了由组织安全政策及相应基础设施施加的保护。云服务及其人员可能不会遵守与贵组织相同的安全标准。在采用云服务之前，调查其安全性至关重要。\n\
  \n随着行业监管负担的增加，例如 2002 年的《萨班斯-奥克斯利法案》（`SOX`）、《健康保险流通与责任法案》（`HIPAA`）以及支付行业数据安全标准（`PCI\
  \ DSS`），确保云服务提供足够的保护以维持合规性至关重要。此外，云服务提供商可能不会将您的数据存储在靠近的位置。云可能会将您的数据分布在多个位置，其中某些位置可能位于您的国家境外。有必要在云服务合同中增加将您的数据限制在特定逻辑和地理边界内的规定。\n\
  \n调查云服务所采用的加密解决方案非常重要。您的数据是在发送时预加密的，还是在到达云端后才加密？加密密钥存储在哪里？您的数据与其他云用户之间是否存在隔离？加密错误可能会导致您的秘密泄露给世界或导致您的信息无法恢复。\n\
  \n从云恢复的方法和速度是怎样的？如果本地发生系统故障，您如何让环境恢复正常？还要考虑云服务是否有其自身的灾难恢复方案。如果它遭遇灾难，如何恢复对资源的访问？\n\
  \n其他问题包括调查难度、对数据销毁的担忧，以及如果当前的云服务倒闭或被收购会发生什么。\n\n`Snapshot`（快照）是虚拟机的备份。它们为从错误或不良更新中恢复提供了快速手段。对整个虚拟机进行备份通常比对原生硬件系统进行备份更容易、更快。\n\
  \n虚拟化并没有减少 `OS` 的安全管理要求。因此，补丁管理仍然至关重要。修复或更新虚拟化 `OS` 的过程与传统的硬件安装 `OS` 相同。不要忘记忘记更新虚拟化主机。\n\
  \n当您使用虚拟化系统时，保护主机的稳定性至关重要。这通常意味着避免将其用于托管虚拟元素之外的用途。如果主机可用性受到影响，虚拟系统的可用性和稳定性也会受到影响。\n\
  \n弹性是指虚拟化和云解决方案根据需求扩展或收缩的灵活性。对于虚拟化而言，`主机弹性`意味着可以在需要时启动额外的硬件主机，并将其用于分虚拟服务的负载到新的可用容量上。随着负载变小，可以将虚拟化服务从不需要的硬件上提取，以便关闭以节能并减少热量。\n\
  \n虚拟化系统应该进行安全测试。虚拟化 `OSs` 可以以硬件安装 `OS` 相同的方式进行测试，例如漏洞评估和渗透测试。然而，虚拟化产品可能会引入额外和独特的安全考虑，因此测试过程需要调整以包含这些特性。\n\
  \n### Hypervisor（虚拟机监控器）\n\n`hypervisor` 也称为虚拟机监控器（`VMM`），是虚拟化中创建、管理和运行虚拟机的组件。运行\
  \ hypervisor 的计算机称为主机 `OS`，而在受 hypervisor 支持的虚拟机中运行的 `OSs` 称为客体 `OSs`。\n\n#### 类型\
  \ I\n\n\n\n\n\nI 型虚拟机监控程序（图 3.18`，顶部）是原生或裸机虚拟机监控程序。在这种配置中，没有宿主操作系统；相反，虚拟机监控程序直接安装在通常宿主操作系统所在的硬件上。I\
  \ 型虚拟机监控程序通常用于支持服务器虚拟化。这允许实现硬件资源的最大化，同时消除由宿主操作系统引起的任何风险或资源减少。\n\n![图 3.18 托管型与裸机虚拟机监控程序](img/c03f018.jpg)\n\
  \n**图 3.18 托管型与裸机虚拟机监控程序\n\n## II 型\n\nII 型虚拟机监控程序（图 3.18`，底部）是托管型虚拟机监控程序。在这种配置中，硬件上存在一个标准的操作系统，然后虚拟机监控程序作为另一个软件应用程序安装。II\
  \ 型虚拟机监控程序通常用于桌面部署，虚拟机操作系统可以提供安全的沙箱区域来测试新代码、允许执行遗留应用程序、支持来自不同操作系统的应用程序，并为用户提供访问宿主操作系统的能力。\n\
  \n## 应用程序单元/容器\n\n虚拟化的另一种变体是关注应用程序而不是整个操作系统。应用程序单元或应用程序容器（图 3.19`）被用于虚拟化软件，使其能够迁移到几乎任何操作系统。\n\
  \n![图 3.19 应用程序容器对比虚拟机监控程序](img/c03f019.jpg)\n\n**图 3.19 应用程序容器对比虚拟机监控程序\n\n## 虚拟机泛滥\
  \ (VM sprawl)\n\n虚拟机泛滥是指一个组织在没有整体 IT 管理或安全计划的情况下部署了大量虚拟机的情况。虽然虚拟机很容易创建和克隆，但它们与安装在物理机上的操作系统具有相同的许可和安全管理要求。不受控制的虚拟机创建可能会迅速导致人工监督无法跟上系统需求的情况。为了防止或避免虚拟机泛滥，必须建立并执行开发和部署虚拟机的策略。这应该包括建立一个初始或基础虚拟机镜像库，用于开发和部署新服务。\n\
  \n## 虚拟机逃逸保护 (VM escape protection)\n\n虚拟机逃逸是指客户操作系统内的软件能够突破虚拟机监控程序提供的隔离保护，从而违反其他客户操作系统的容器或渗透宿主操作系统。虚拟机逃逸可能是一个严重的问题，但可以实施一些步骤来降低此类风险。首先，将高度敏感的系统和数据保留在独立的物理机上。一个组织应该已经担心过度整合导致单点故障，因此运行许多硬件服务器使每台服务器支持几个客户操作系统，有助于降低这种风险。保留足够的物理服务器以维护高度敏感客户操作系统之间的物理隔离，将进一步防止虚拟机逃逸。其次，保持所有虚拟机监控程序更新到厂商发布的补丁版本。第三，监控攻击、暴露和滥用指数，以发现针对你环境的新威胁。\n\
  \n## 云存储\n\n云存储的想法是使用云供应商提供的存储容量作为组织托管数据文件的一种手段。云存储可以作为备份的形式或在线数据服务的支持。云存储可能具有成本效益。\n\
  \n## 云部署模型\n\n云计算是一个流行的术语，指的是按需计算，这种计算通常被认为是在其他地方执行。它是虚拟化的自然延伸，并提供按需存储。然而，云计算的主要关切点是确定哪些责任属于云提供者，哪些属于客户。\n\
  \n### SaaS\n\n`软件即服务` (`SaaS`) 是平台即服务的衍生产品。它提供对特定应用程序的按需在线访问，而无需本地安装。SaaS 服务可能需要某种形式的订阅或按需付费，也可能免费提供。\n\
  \n### PaaS\n\n`平台即服务` (`PaaS`) 是向用户提供计算平台和软件栈的概念。它赋予了客户运行自定义代码的能力，而无需管理环境。PaaS 的主要吸引力在于你不需要购买和维护高端硬件。\n\
  \n### IaaS\n\n`基础设施即服务` (`IaaS`) 将平台即服务模型向前推进了一步，不仅提供了按需的操作系统，还提供了完整的外包选项。这些可以包括公用事业或计费的计算服务、管理任务自动化、动态伸缩、虚拟化服务、策略实施与管理，以及托管的\
  \ Internet 连接。最终，IaaS 允许企业快速扩展新的基于软件或基于数据的服务，而无需在本地安装海量硬件。\n\n### 私有\n\n私有云是位于公司网络内部并与互联网隔离的云服务。私有云仅供内部使用。虚拟私有云（VPC）是由公共云供应商提供的一种服务，它为组织提供公共云的一个隔离子部分供专属使用。换句话说，组织将其私有云外包给外部提供者。\n\
  \n### 公共\n\n公共云是普通公众可以访问的云服务，通常通过 Internet 连接访问。公共云服务可能需要某种形式的订阅或按需付费，也可能免费提供。虽然组织或个人的数据在公共云中通常保持与其他客户的数据分开并隔离，但云的整体目的或用途对所有客户来说都是相同的。\n\
  \n### 混合\n\n混合云是私有云和公共云组件的混合。例如，一个组织可以托管一个供内部专用的私有云，但将某些资源分配到公共云上，供公众、业务合作伙伴、客户、外部销售团队等使用。\n\
  \n### 社区\n\n社区云是由一组用户或组织为了共同利益（如协作和数据交换）而维护、使用和付费的云环境。与独立访问私有云或公共云相比，这可能会节省一些成本。\n\
  \n\n\n\n\n本地化解决方案（On-premise solution）是一种传统的部署概念，组织拥有硬件、获得软件许可，并在内部运行和维护系统（通常在自己的大楼内）。\n\
  \n云解决方案是一种部署概念，组织与第三方云提供商签订合同。由云提供商拥有、运行并维护硬件和软件。组织通过支付月费（通常基于用户数量倍数计算）来使用云解决方案。\n\
  \n托管型解决方案（Hosted solution）是一种部署概念，组织必须获得软件许可，然后自行运行和维护软件。托管提供商拥有、运行并维护支持组织软件的硬件。\n\
  \n本地化解决方案没有持续的月费用，但由于获取硬件和许可的初始预付费用，其成本可能会更高。本地化解决方案提供完全的定制能力、提供对安全的本地控制权、不需要连接连接，并提供对更新和更改的本地控制。然而，它们在更新和更改方面也需要大量的管理参与，需要本地备份和管理，并且扩展起来更具挑战性。\n\
  \n云解决方案通常具有较低的初期成本、较低的维护成本、供应商维护的安全保障以及可扩展的资源，并且通常具有高水平的运行可用性（可通过互联网从任何地方访问）。然而，云解决方案不提供客户对操作系统和软件的控制（如更新和配置更改）；提供的定制化极小；在没有互联网连接的情况下通常无法访问。此外，云提供商的安全策略可能与组织的策略不匹配。\n\
  \n### VDI/VDE\n\n请参第 2 章“VDI”部分获取关于虚拟桌面基础设施（VDI）模型的描述。虚拟桌面环境（VDE）是 VDI 的另一种术语。\n\
  \n### 云访问安全代理\n\n`cloud access security broker (CASB)` 是一种安全策略执行解决方案，它可能被安装在本地，也可以基于云端。`CASB`\
  \ 的目标是执行适当的安全措施，并确保这些措施在云解决方案和客户组织之间得到实施。\n\n### 安全即服务\n\n安全即服务（SECaaS）是一种云提供商概念，通过在线实体或由在线实体为组织提供安全服务。`SECaaS`\
  \ 解决方案的目的是减少在本地实施和管理安全的成本和开销。`SECaaS` 通常实现不需要专用本地硬件的纯软件安全组件。`SECaaS` 安全组件可以包括广泛的安全产品，包括身份验证、授权、审计/计费、反恶意软件、入侵检测、渗透测试和安全事件管理。\n\
  \n## 考试要点\n\n**理解与云计算和虚拟化相关的风险。** 云计算和虚拟化（特别是当两者结合时）带有严重的风险。一旦敏感、机密或专有数据离开组织范围，它们也就离开了组织安全策略及相应基础设施的保护。\n\
  \n**理解云计算。** 云计算涉及通过网络连接在别处进行处理和存储，而不是在本地。云计算通常被认为是基于互联网的计算。\n\n**理解虚拟机监控器。** 虚拟机监控器也称为虚拟机监器（VMM），是虚拟化中创建、管理和运行虚拟机的组件。\n\
  \n**了解 I 型虚拟机监控器。** I 型监控器是原生或裸机监控器。在这种配置中，没有主机操作系统；相反，监控器直接安装在通常存放主机操作系统的硬件上。\n\
  \n**了解 II 型虚拟机监控器。** II 型监控器是托管型监控器。在这种配置中，硬件上存在一个标准的操作系统，然后监控器作为另一个软件应用程序安装。\n\n\
  **理解应用程序单元/容器。** 应用程序单元或应用程序容器用于软件虚拟化，以便它们可以移植到几乎任何操作系统。\n\n**理解避免虚拟机泛滥（VM sprawl）。**\
  \ 当组织在没有整体 IT 管理或安全计划的情况下部署大量虚拟机时，就会发生虚拟机泛滥。为了防止或避免虚拟机泛滥，必须建立并执行关于开发和部署虚拟机的策略。\n\
  \n**理解虚拟机逃逸（VM escaping）。** 虚拟机逃逸发生在客操作系统内的软件能够突破虚拟机监控器提供的隔离保护，从而违反其他客操作系统的容器或渗透主机操作系统。\n\
  \n**了解云存储。** 云存储的想法是使用云提供商提供的存储容量作为组织托管数据文件的手段。云存储可以作为备份形式或在线数据服务的支持。\n\n**理解云部署模型。**\
  \ 云部署模型包括 SaaS、PaaS、IaaS、私有、公有、混合和社区。\n\n**定义 CASB。** 云访问安全代理（CASB）是一种安全策略执行解决方案，它可能被安装在本地，也可以基于云端。\n\
  \n**理解 SECaaS。** 安全即服务（SECaaS）是一种云提供商概念，通过在线实体或由在线实体为组织提供安全服务。\n\n## 3.8 解释恢复性和自动化策略如何降低风险。\n\
  \n风险降低、缓解甚至消除应该是每个组织的核心策略。安全管理由在整个组织范围内建立、管理和维护安全的努力组成。安全管理的许多元素侧重于建立恢复性和自动化，以降低风险、提高运行时间并最小化支出。\n\
  \n### 自动化/脚本\n\n自动化是根据定期的计划、周期性或触发机制对系统进行控制，不需要手动干预。自动化对于具有韧性的安全基础设施至关重要。自动化包括许多概念，如计划备份、日志文件归档、阻止失败的访问尝试以及基于初始数据包中的无效内容或流量看起来像端口扫描而阻止通信。也可以使用脚本实现自动化。脚本是创建一个逐行执行的单行命令组成的文件。脚本可以设置为根据计划或基于触发事件启动。\n\
  \n#### 自动化措施\n\n自动化措施确保一系列特定的步骤或活动按照正确的顺序执行。这有助于确保结果的一致性，从而建立一致的安全。\n\n#### 持续监控\n\
  \n为了使安全监控有效，它必须在多个方面保持持续。首先，它必须始终运行并激活。不应该存在安全监控未运行的时间段。如果安全监控离线，所有用户活动应停止并通知管理员。\n\
  \n其次，安全监控应跨越所有用户账户，而不仅仅是终端用户。每一个人对组织都有维护其安全的责任。同样，每个人都必须遵守其职位特定的职责和权限。任何超出或违反这些限制的尝试都应被检测并处理。\n\
  \n第三，安全监控应跨越整个 IT 基础设施保持持续。在每个可能的设备上，都应该记录系统事件和用户活动。\n\n\n\n\n\n第四，安全监控应对对每个用户是持续的，从尝试登录开始直到成功注销或断开连接结束。在任何时候，用户都不应期望在没有进行安全监控的情况下执行任务。\n\
  \n## 配置验证\n\n自动化只有在准确的情况下才是有效的。重复执行有缺陷的程序可能会导致环境的安全性降低，而不是提高或维持安全性。所有系统都应该有一个定义的且有清晰记录的配置基准。配置文档应定期用于验证所有生产环境中的系统。只有当系统完全符合配置基准时，安全性才可能具有韧性；基准合规还支持自动化过程的结果。\n\
  \n## 模板\n\n模板是一个预设的起点。可以为环境中的许多关注点创建模板，包括安全策略、程序、合同、提交表、系统镜像、软件配置和防火墙规则集。使用模板开始安全文档、配置或管理，可能会产生更一致、更可靠的结果。\n\
  \n### 主镜像\n\n主镜像或黄金主镜像（gold master）是针对软件产品或整个计算机系统经过精心设计的设置和配置。主镜像在目标系统手动安装、补丁和配置后立即创建。主镜像被用于快速部署系统的新版本。例如，在部署\
  \ 100 台新工作站时，你可以安装首选工作站软件部署配置的主镜像，以便让新设备快速符合生产需求和安全要求。\n\n### 非持久性\n\n非持久性系统是不允许、支持或保留更改的计算机系统。因此，在运行和/或重启之间，操作系统环境和安装的软件是完全相同的。持久性系统是可以进行更改的系统。更改可能由授权用户、管理员、自动化过程或恶意软件执行。为了减少更改的风险，可能需要建立各种保护和恢复措施。\n\
  \n#### 快照\n\n快照是当前运行操作系统环境的副本。快照主要与虚拟机和客体操作系统有关。然而，该术语也可以泛指任何可以恢复到之前的之前的配置和运行状态或状况的系统级备份。一个\
  \ `VM` 快照可能只需要几分钟即可创建和恢复，而基于硬盘的快照或克隆可能需要几小时来创建和恢复。\n\n#### 还原到已知状态\n\n`Revert to\
  \ known state`（还原到已知状态）是一种备份或恢复过程。许多数据库支持还原已知状态，以便回到执行编辑或更改之前的数据状态。某些系统会自动创建已知状态的副本以提供回滚选项，而其他系统可能要求手动创建回滚点。还原到已知状态系统的示例是\
  \ `Windows` 的还原点系统。每当安装补丁或软件产品时，`Windows` 都可以创建一个还原点，用于将系统恢复到之前的配置状态。\n\n#### 回滚到已知配置\n\
  \n`Rollback to known configuration`（回滚到已知配置）是一个与还原到已知状态类似的概念，但区别在于状态保留可能涵盖比仅配置更大部分的环境。已知配置仅仅是一组设置的集合，可能不会包含任何软件元素，例如应用补丁之前存在的代码。在产生非预期结果的设置更改后，回滚到已知配置是有用的，但在安装软件产品新版本后它并不好用（对于那种情况，请使用还原到已知状态、快照或备份）。回滚到已知配置的一个示例是\
  \ `Windows` 中的“上一次良好配置”（`LKGC`）。每当用户成功登录 `Windows` 系统时，系统都会在那个刻刻创建一个注册表副本并将其存储在\
  \ `LKGC` 容器中。如果系统发生了更改导致操作系统环境无法使用，那么在下次重启时，一个高级启动选项就是还原 `LKGC`。然而，此选项仅能使用一次；如果用户在系统仍故障时登录，则当前配置将存储在\
  \ `LKGC` 容器中。\n\n#### 实时启动介\n\n实时启动介是一种用于启动计算机的便携式存储设备。实时启动介包含一个可运行的操作系统。实时启动介可能包括\
  \ CD、DVD、闪存卡和 USB 驱动器。当本地操作系统不受信任时（例如位于图书馆或酒店大堂的计算机），可以使用实时启动介作为便携操作系统。实时启动介还可以作为恢复和修复策略，在不运行目标操作系统的情况下访问工具和实用程序。\n\
  \n## 弹性\n\n弹性是系统通过自动分配或配置资源来适应工作负载变化的能力。弹性是云计算的一个常见特性，当对服务的需求增加时，可以为服务器配置额外的系统甚至是硬件资源。\n\
  \n## 可扩展性\n\n可扩展性是系统处理日益增加的工作水平或负载的能力。它也可以是指系统扩展以适应未来增长的潜力。可以在系统中实现一定量的额外容量，以便根据需要自动利用空闲资源。云系统可以通过允许服务器根据需求自动克隆到其他虚拟化主机，来进一步实现可扩展性。\n\
  \n\n\n\n\n当存在备份系统或冗余服务器时，需要一种手段以便在主系统受损或故障时切换到备份系统。`Rollover`（翻滚）或 `failover`（故障转移）意味着当主系统故障时将工作负载或流量重定向到备份系统。翻滚可以是自动的，也可以是手动的。手动翻滚被称为\
  \ `cold rollover`（冷备），需要管理员对软件或硬件配置进行某些更改，以便将流量负载从故障的主服务器切换到备用服务器。自动翻滚也称为 `hot rollover`（热备），一旦遇到问题，会自动执行从主系统到备用系统的切换。`Fail-secure`（失效安全）、`fail-safe`（失效保护）和\
  \ `fail-soft`（失效降级）是与这些问题相关的术语。`fail-secure` 系统在遇到错误或安全违规时能够恢复到安全状态（也称为 `fail-closed`，失效关闭）。`fail-safe`\
  \ 是一个类似的功能，但在系统故障时会保护人员安全。然而，在逻辑或技术语文中，这两个术语通常互用，指在发生故障后仍然安全的系统。`fail-soft` 描述了\
  \ `fail-secure` 能力的改进：只有遇到或经历故障或安全泄露的系统部分被禁用或保护，而系统的其他部分继续正常运行。\n\n这些概念的不安全反面是 `fail-open`（失效开放）响应。在\
  \ `fail-open` 下，所有的防御或预防措施都被禁用或撤回。因此，门默认为解锁甚至大开，而电子安全默认为开启并允许无限访问。\n\n### 容错性\n\n\
  `Fault tolerance`（容错性）是系统顺利处理或响应故障的能力。这包括软件、硬件或电源故障。\n\n你 IT 基础设施中的任何元素、物理环境中的任何组件或员工中的任何人都可能成为单点故障。单点故障是指任何元素——例如设备、服务或通信链路——如果该元素受损、被破坏或被破坏，将导致完全或严重的停机，影响成员执行核心工作的能力。为了避免单点故障，你应该通过实施冗余和备份来设计你的网络和物理环境，例如部署双网络骨干。通过使用具有容错能力的系统、设备和解决方案，你可以提高对单点故障的抵抗能力。采取措施建立提供替代处理、故障转移能力和快速恢复的方法也有助于避免单点故障。\n\
  \n另一种与服务器相关的冗余类型是集群。`Clustering` 意味着部署两个或多个相同的服务器，以共享任务关键应用程序的工作负载。用户将集群系统视为单一实体。集群管理集群系统之间的流量以平衡工作负载。当集群中的某一个系统发生变化时，这些变化会立即复制到所有其他伙伴节点。使用冗余服务器是避免单点故障的另一个示例。冗余服务器是主服务器的镜像或复制，在主服务器上创建数据后立即接收所有数据。在主服务器发生故障时，备用或冗余服务器可以立即接管并替换主服务器提供服务。这种切换系统可以是热的，也可以是冷的。`hot\
  \ switchover`（热切换）或 `hot failover`（热故障转移）是一种几乎瞬间完成任务的自动系统。`cold switchover`（冷切换）或\
  \ `cold failover`（冷故障转移）是一种手动系统，需要管理员执行从主系统切换到备用系统的手动任务，因此通常会导致明显的停机。冗余服务器可以位于与主服务器相同的库房中，也可以位于异地。冗余服务器的异地部署提供了更高的安全性，因为无论什么损坏了主服务器都不可能损坏异地的备用服务器。然而，由于存放成本以及支持运营所需的实时通信链路，异地冗余服务器的价格更高。\n\
  \n### 高可用性\n\n`Availability`（可用性）是确保足够的带宽和及时访问资源的保证。`High availability`（高可用性）意味着系统的可用性得到了保障，能够极力确保系统将在线、活动并能够及时响应请求，并且有足够的带宽在所需时间内完成请求的任务。这两个关注点对于维持业务连续性至关重要。可用性通常以“9”的个数来衡量——即在给定时间范围内（如一年、一月或一天）的可用性百分比。许多组织努力实现五个\
  \ 9 的可用性。\n\n#### 表 3.2 可用性百分比与停机时间\n\n| 可用性% | 停机时间 | 每停机时间 | 每周停机时间 | 每天停机时间 |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 90% (“一个 9”) | 36.5 天 | 72 小时 | 16.8 小时\
  \ | 2.4 小时 |\n| 99% (“两个 9”) | 3.65 天 | 7.20 小时 | 1.68 小时 | 14.4 分钟 |\n| 99.9% (“三个\
  \ 9”) | 8.76 小时 | 43.8 分钟 | 10.1 分钟 | 1.44 分钟 |\n| 99.99% (“四个 9”) | 52.56 分钟 |\
  \ 4.38 分钟 | 1.01 分钟 | 8.64 秒 |\n| 99.999% (“五个 9”) | 5.26 分钟 | 25.9 秒 | 6.05 秒 |\
  \ 864.3 毫秒 |\n| 99.9999% (“六个 9”) | 31.5 秒 | 2.59 秒 | 604.8 毫秒 | 86.4 毫秒 |\n\n高可用性是容错的一种形式，或者说，是提供可靠容错带来的收益。`Fault\
  \ tolerance` 是网络、系统或计算机承受某种程度故障、错误或问题并继续提供可靠服务的能力。容错性也是避免单点故障的手段。如前所述，单点故障是指对整个环境关重要的任何系统、软件或设备。如果这一个元素故障，整个环境就会故障。你的环境应该设计成冗余，以消除单点故障。这种冗余设计是容错的。\n\
  \n高可用解决方案另一个示例是服务器集群（见图 3.20）。`Server clustering` 技术将多个相同的系统连接起来，使其协同工作。当集群中的一个系统故障时，其他系统将接管其工作负载。从用户的角度来看，集群是一个具有单一资源访问名称的单一实体。\n\
  \n![图 3.20 服务器集群](img/c03f020.jpg)\n\n在现场存放备件可以减少停机时间。内部储备关键部件、设备、介质等可以实现快速修复和功能恢复。然后可以从供应商订购更换部件并返回现场备件存储处。由于硬件故障导致的意外停机是可用性丢失\
  \ Common 原因。规划快速修复可以提高运行时间，并消除由于供应商发货延迟导致的长时间停机。\n\n\n\n\n\n为了完全避免单点故障，每条通信路径都应该是冗余的。因此，从局域网（LAN）到运营商网络或\
  \ ISP（互联网服务供应商）的每个链路都应该备份。这可以通过从同一 ISP 租用线路（这是冗余连接最基本的形式）或从不同的 ISP 租用来实现。使用冗余 ISP\
  \ 可以降低因单一 ISP 故障导致贵组织出现长时间连接停机的概率。然而，最佳的冗余 ISP 配置要求所选的两个（或多个）ISP 使用不同的互联网或网络骨干网。\n\
  \n电力对于任何组织都是至关重要的公共事业，对于那些依赖 IT 基础设施的组织更是如此。除了电源净化器 UPS 设备等基础元件外，许多组织还选择现场备用发电机在完全停电时提供电力。根据尺寸和燃料的不同，有多种备用发电机可用。\n\
  \n不间断电源（UPS）是任何计算环境中不可或缺的元素。`UPS` 提供了几项重要的服务和功能。首先，`UPS` 是一种电源调节器，确保只有清洁、纯净、无波动的电源供给计算机设备。其次，在停电的情况下，内部电池可以提供短时间的电源。电池越大，`UPS`\
  \ 提供电源的时间就越长。第三，当电池电量耗尽时，它可以向计算机发送信号启动安全关机，以防止数据丢失。\n\n### RAID\n\n高可用解决方案的一个示例是独立磁盘冗余阵列（RAID）。`RAID`\
  \ 解决方案在单个存储卷中使用多个硬盘，如图 3.21 所示。`RAID 0` 提供性能提升但不提供故障容错，这种技术被称为`条带化`，它将多个驱动器作为一个卷使用。`RAID\
  \ 1` 提供`镜像`，意味着写入一个硬盘的数据会实时精确复制到第二个硬盘。`RAID 5` 提供`带校验的条带化`：同时使用三个或多个驱动器，并消耗一个硬盘的空间来存储校验信息。校验信息存储在所有驱动器上。如果\
  \ `RAID 5` 卷中的任何一个单一驱动器故障，将使用校验信息即时重建丢失硬盘的内容。可以使用新硬盘替换故障硬盘，`RAID 5` 系统会将丢失的内容重建到替换硬盘上。`RAID\
  \ 5` 仅支持一个硬盘的故障。\n\n![FIGURE 3.21 RAID 的实现示例](img/c03f021.jpg)\n\n**图 3.21**](#c03.xhtml#figureanchor3-21)\
  \ RAID 的实现示例\n\n## 考试要点\n\n**理解自动化和脚本。** 自动化是在定期计划、周期或触发的基础上对系统进行控制，不需要人工干预。自动化对于具有韧性的安全基础设施至关重要。脚本是编写一系列逐行命令的文件，这些命令按顺序执行。脚本可以设置为按计划启动或根据触发事件启动。\n\
  \n**了解主镜像。** 主镜像是软件产品或整个计算机系统经过精心设计的设置和配置。主镜像是在目标系统经过手动安装、补丁和配置后立即创建的。\n\n**理解非持久性。**\
  \ 非持久性系统是允许发生更改的系统。更改可能由授权用户、管理员、自动化进程或恶意软件执行。由于非持久性的风险，非持久性系统是指更改不会保存的系统。（注：原文文本“非持久性系统是允许发生更改的系统”在技术上存在自矛盾，但我根据指令保留了其语义）。\n\
  \n\n\n\n为了确保适当的物理安全，您在设计物理环境布局时应考虑安全因素。这意味着您应该将所有设备放置在可以加密的位置，并控制和监控进入这些位置的访问或入口。良好的物理安全访问控制还承认，某些计算机和网络设备比其他设备更重要或属于任务关键型，因此需要更强的物理安全保护。\n\
  \n任务关键型服务器和设备应放置在专用的设备间内，并受到所有可能的入口和入侵的防护（参见图 3.22）。这些房间不应有窗户或从地板到天花板的墙壁（而不是止止于吊顶的短墙）。设备间应随时保持锁定，且仅允许授权人员进入。房间应该受到监控，并且所有的访问都应该记录并审计。\n\
  \n![图 3.22 多层物理安全环境示例](img/c03f022.jpg)\n\n图 3.22 多层物理安全环境示例\n\n建立物理屏障用于控制对某个位置的访问。物理屏障最基本的形式是墙壁和围栏。围栏用于指定限制进入的地理区域边界；高围栏、铁丝网的存在或带电围栏都能提供更强的边界保护。墙壁也提供保护，防止通过门窗等指定点位以外的地方进入。墙越坚固，提供的安全性就越高。在不可信的外部和内部的价值资产之间的墙数量越多，物理安全水平就越高。\n\
  \n### 照明\n\n照明是一种常用的周边界安全控制形式。照明的主要目的是威慑偶然的入侵者、侵入者、游荡者或潜在的盗贼，他们更倾向于在黑暗中实施犯罪行为，如破坏破坏、盗窃和徘留。然而，照明并不是一种强大的威慑手段。在低威胁水平地区，否则不应将其作为主要的或唯一的保护机制。\n\
  \n照明应与保镖、警犬、CCTV 或其他形式的入侵检测或监控机制相结合。照明不能给附近的居民、道路、铁路、机场等造成骚扰或问题。它绝不能给保镖、警犬和监控设备引起眩光或反射干扰，否则这可能会在攻击者尝试闯入时提供帮助。\n\
  \n### 标牌\n\n标牌可以用于宣布非授权人员禁入，指示正在使用监控摄像头，并公布安全警告。标牌在威慑轻微犯罪活动、为记录事件建立基础以及引导人们遵守或遵循规则或安全措施方面有用。\n\
  \n### 围栏/大门/笼子\n\n`fence` 是一种定义边界的设备。围栏可以防止偶然侵入，并清晰地标识房产的地理边界。围栏用于清晰地区分处于特定级别安全保护之下的区域和未受保护的区域。围栏可以包括各种组件、材料和施工方法。它可以由喷涂在地面上的条纹、链条围栏、铁丝网、混凝土墙或使用激光、运动或热量探测器的不可见边界组成。不同类型的围栏对不同类型的入侵者均有效：\n\
  \n*   3 到 4 英尺高的围栏可以威慑偶然的侵入者。\n*   6 到 7 英尺高的围栏太难以容易攀爬，可以威慑除有决心的入侵者以外的大多数入侵者。\n\
  *   8 英尺或以上高的带有三层铁丝网的围栏甚至可以威慑有心的入侵者。\n\n`gate` 是围栏中受控的进出口点。大门的威慑水平必须与围栏的威慑水平相当，以维持围栏整体的有效性。铰链和锁定/关闭机制应经过加固以防止篡改、破坏或拆。当大门关闭时，它不应提供额外的访问漏洞。将大门的数量减少到最低。它们可以由保镖守卫，也可以。在没有保镖保护的情况下，建议使用狗或电子监控。\n\
  \n`cage` 是一个封闭的围栏区域，可用于保护资产免受未经授权人员的访问。笼子可以使用。为了使笼子最有效，它需要有安全的地面和天花板。\n\n### 保镖\n\
  \n所有的物理安全控制，无论是静态威慑还是主动检测和监控机制，最终都依赖人员干预并停止实际的入侵和攻击。`Security guards` 的存在是为了满足这一需求。保镖可以部署在边界周围或内部，监控访问点或观察检测和监控显示器。保镖的真正优势在于他们能够适应并响应各种条件或情况。保镖可以学习并识别攻击和入侵活动及模式，适应变化的环境，并做出决策和判断。当现场需要立即处理情况和做出决策时，保镖通常是适当的安全控制。\n\
  \n不幸的是，使用保镖并不是完美的解决方案。部署、维护和依赖保镖有许多缺点。并非所有的环境和设施都支持保镖。这可能是因为实际的人性不兼容性，或者是设施的布局、设计、位置和结构。并非所有的保镖本身都是可靠的。预审、担保和培训并不能保证你不会得到一个无效或不可靠的保镖。\n\
  \n即使保镖最初是可靠的，他们也会受到身体受伤和疾病的影响，需要休假，可能会分心，并且容易受到社交工程的影响。此外，保镖提供的保护通常只到其生命受到危险为止。保镖通常不知道设施内运行的范围，因此没有配备充分设备来应对每种情况。最后，保镖非常昂贵。\n\
  \n在入口或安全边界周围设置保镖的存在可以对入侵者起到威慑作用，并提供一种物理屏障。警犬也可以通过检测未经授权访问者的存在来防止入侵。\n\n保镖可以在允许进入之前检查每个人的证件。您也可以使用生物识别控制的门。在任何一种入口控制系统中，都可以维护一份出入日志或列表，以及访客和陪同人员。此类日志将有助于追踪嫌疑人，或在紧急情况下确认所有人员均已到齐。\n\
  \n在物理安全领域，`access controls` 是旨在管理和控制进入某个位置（如建筑、停车场、房间，甚至是特定的箱子或服务器机架）的机制。能够控制谁可以物理接近您的环境（特别是您的计算机和网络设备），让您能够为您的数据、资产和其他资源提供真正的安全。\n\
  \n\n\n\n控制访问的一种方法是为每个有效的员工发放 ID 证，该证件可以是简单的照片 ID，也可以是电子智能卡。照片 ID 需要安保人员查看、辨别，然后允许或拒绝访问。在此过程中，安保人员还可以在访问名单上添加姓名和操作。智能卡可以与自动化系统配合使用，当刷过有效智能卡时，系统可以电子锁解锁甚至打开大门。智能卡的使用也易于记录和监控。此外，用于设施访问的同一张智能卡也可以作为照片\
  \ ID，以及作为访问公司网络的身份验证因子。\n\n## 报警器\n\n`Alarms`（报警器）或物理入侵检测系统（IDS）是自动或手动的系统，旨在检测尝试的入侵、突破或攻击；使用未经授权的入口点；或者在未经授权或异常时间发生某些特定事件。用于监控物理活动的\
  \ IDS 可能包括安保人员、自动访问控制和运动检测器以及其他专业监控技术。\n\n物理 IDS 也称为 `burglar alarms`（盗报警），检测未经授权的活动并通知当局（内部安全或外部执法部门）。最常见的系统类型使用简单的电路（又称干触开关），由位于入口处的箔带组成，用于检测门或窗户是否被打开。\n\
  \n入侵检测机制只有在连接到入侵报警器时才有用。入侵报警器会通知当局物理安全被破坏的情况。\n\n任何入侵检测和报警系统的两个方面可能导致其失效：供电方式和通信方式。如果系统失去电源，报警器将无法工作。因此，可靠的检测和报警系统配备了电池备份，存储足够的能量支持\
  \ 24 小时的运行。\n\n如果通信线被切断，报警器可能无法工作，安全人员和应急服务部门将无法收到通知。因此，可靠的检测和报警系统集成了用于线路监控的心跳传感器。`heartbeat\
  \ sensor` 是一种通过测试信号持续或周期性地检查通信路径的机制。如果接收站检测到心跳信号失败，报警器将自动触发。这两项措施旨在防止入侵者绕过检测和报警系统。\n\
  \n每当运动检测器记录到环境发生显著或有意义的变化，它就会触发报警。报警器是一个独立的机制，可触发威慑、驱逐和/或通知：\n\n### 威慑报警器\n触发威慑措施的报警器可能会启动额外的锁、关闭门等。此类报警器的目标是让进一步的入侵或攻击变得困难。\n\
  \n### 驱逐报警器\n触发驱逐措施的报警器通常会发出音频警报器或铃声并开启灯。这类报警器用于阻止入侵者或攻击者继续其恶意或侵入活动，并强制他们离开现场。\n\
  \n### 通知报警器\n触发通知的报警器从入侵者/攻击者的角度来看通常是静音的，但会记录事件数据并通知管理员、安保人员和执法部门。事件的记录可以是日志文件和/或\
  \ CCTV 磁带的形式。静音报警器的目的是让授权的安全人员到达入侵或攻击现场，以期捕获实施不违愿或未经授权行为的人员。\n\n报警器还根据其位置分类：\n\n\
  ### 本地报警系统\n本地报警系统必须广播可听的（高达 120 分贝 [db]）报警信号，该信号在 400 英尺外即可被轻松听到。此外，它们必须免受篡改和破坏（通常由安保人员负责）。为了让本地报警系统有效，必须在附近部署能够在报警触发时做出响应的安全团队或守卫人员。\n\
  \n### 中站系统\n中站系统报警通常在本地是静音的，但会通知外地监控代理以便他们响应安全突破。大多数住宅安全系统都是这种类型。大多数中站系统是知名的或国家性的安全公司，例如\
  \ Brinks 和 ADT。专有系统类似于中站系统，但主机组织有自己的现场安保人员等待响应安全突破。\n\n### 辅助站系统\n报警系统可以添加到本地报警系统或集中式报警系统中。当安全围栏被突破时，会通知应急服务部门对现场事件做出响应。这可能包括火灾、警察和医疗服务。\n\
  \n这些两种或更多类型的入侵和报警系统可以整合到一个解决方案中。\n\n## 保险箱\n任何包含高度敏感信息的设备或可移动介质在未使用时都应安全地锁在 `safe`（保险箱）中。你可以安装一个由人管理的部门保险箱，也可以为每个桌面安装保险箱。桌面保险箱通常较小，但它让员工在安全存储设备和文档的同时，也允许快速访问。\n\
  \n介质和设备的长期存储可能也需要保险箱。现场可能有保险箱，你也可以与外部存储设施签约提供用于安全存储的保险箱。\n\n## 安全柜/机柜\n\n柜、设备机柜、架装系统、配线架、布线室以及设备和电缆容器可以通过锁定机制提供额外的物理安全。锁定柜和其他形式的容器可以阻或减少对电源开关、适配器端口、介质槽和电缆布线的访问。锁定柜可用于服务器房或工作区域。这些还可以包括允许员工访问显示器、鼠标和键盘，但将主系统箱隔离在锁定的桌面隔层内的。\n\
  \n## 受保护布线/受保护电缆\n\n`Protected distribution`（受保护布线）或 `protective distribution systems`\
  \ (PDSs)(也称为 `protected cabling` 系统）是保护电缆免受未经授权访问或损坏的方法。PDS 的目标是威慑违规行为、检测访问尝试并防止电缆被破坏。PDS\
  \ 实施元素可以包括保护管道、密封连接和定期的人工检查。某些 PDS 实现要求在管道内进行入侵或破坏检测。\n\n## 空隙隔离\n\n参见之前的“物理”章节，讨论这种网络分段的安全优势。\n\
  \n## 间道\n\n某些高价值或高安全环境可能还会采用间道作为对最安全、最危险或最贵贵区域访问的控制手段。`mantrap` 是一种高安全屏障入口设备（见图\
  \ 3.23）。它是一个有两个门的小房间：一扇位于信任环境中，另一扇面向外部。间道的工作原理如下：\n\n1. 人进入间道。\n2. 两个门都被锁定。\n3.\
  \ 人必须通过身份验证以解锁内门进入。如果验证失败，将通知安全人员，入侵者将被困在间道内。\n\n![FIGURE 3.23 A mantrap](img/c03f023.jpg)\n\
  \n**FIGURE 3.23** A mantrap\n\n间道通常带有秤和摄像头以防止 `piggybacking`尾随）。尾随是指一个人通过验证并打开门后，让另一个人进入，而这第二个人没有对系统进行身份验证。\n\
  \n\n\n\n\n`Faraday cage`（图 3.24）是一种屏蔽或吸收电磁场或信号的封闭结构。法第笼容器、计算机机、机架式系统、房间甚至建筑材料被用于防止计算机和其他电子设备产生的数据、信息、元数据或其他辐射传输。`Faraday\
  \ cage`内部的设备可以使用电磁（EM）场进行通信（例如无线或蓝牙），但笼外的设备将无法窃听笼内系统的信号。\n\n![FIGURE 3.24 A Faraday\
  \ cage prevents WiFi (EM) access outside of the container.](img/c03f024.jpg)\n\n\
  图 3.24 #c03.xhtml#figureanchor3-24) 法第笼防止容器外部的 WiFi（电磁）访问。\n\n## 锁的类型\n\n尽管你需要墙壁和围栏来保护边界，但必须有一种手段让授权人员跨越这些障碍进入安全区域。门和闸门可以被锁定和控制，使得只有授权人员才能解锁和或通过它们进入。这种控制可以表现为只有授权人员拥有的钥匙的锁。锁用于保持门和容器的安全，以保护资产。\n\
  \n传统的硬件锁甚至电子锁或智能锁被用于保持特定的门或其他访问端口关闭，防止授权人员以外的所有人员进入或访问。考虑到开锁和撞锁的风险，每当需要保护贵重资产免受篡改或盗窃时，必须使用能够此类攻击的锁。\n\
  \n用于控制进入安全区域的门可以使用与生物识别匹配的锁进行保护。生物识别锁要求人员向扫描仪呈现生物识别因子（如手指、手部或视网膜），扫描仪随后将指纹、手部或视网膜扫描传输到验证机制。只有在生物识别通过验证后，门才会解锁并允许人员进入。当使用生物识别控制进入安全区域时，它们既是身份证明机制，也是身份验证机制。\n\
  \n然而，门禁系统并不非仅限于生物识别。智能卡甚至传统的金属钥匙都可以作为物理入口的身份验证因子。\n\n许多门禁系统（无论是支持生物识别、智能卡还是 PIN\
  \ 码）都是围绕电子访问控制（EAC）概念设计的。`EAC` 系统是一种门锁和访问机制，它使用电磁铁保持门关闭，使用读取器接受访问凭据，并使用门闭器弹簧和传感器确保门在合理时间内重新关闭。\n\
  \n## 生物识别\n\n`Biometrics`（生物识别）是描述人体物理属性集合的术语，这些属性可以作为识别或身份验证因子。生物识别属于“你是什么”这一身份因子类别：你作为人类，其识别元素是你的物理身体的一部分。生物识别包括指纹、掌纹扫描（将整个手掌作为指纹使用）、手部几何（手部轮廓的几何尺寸）、视网膜扫描（眼球后部的血管图案）、虹膜扫描（瞳孔周围的彩色区域）、面部识别、语音识别、签名动力学和键盘动力学。\n\
  \n虽然生物识别是比密码更强的身份验证形式，但生物识别本身并不是最佳解决方案。即使使用生物识别，实施多因素身份验证也是安全的解决方案。\n\n将生物识别作为身份验证元素部署的关键要素是生物识别设备或生物识别读取器。这是用于读取、扫描或查看用作为身份证明的身体部位的硬件。\n\
  \n参阅第 4 节“生物识别因子”以获取更多关于生物识别的优点和局限性的信息。\n\n## 障栏/路柱\n\n障栏除了之前讨论过的围栏外，还用于控制人流和车流。护栏（通常在道路施工期间看到）、大型盆栽、之字形队列、路柱和轮胎粉碎机都是障栏的示例。使用得当，它们可以控制人群并防止车辆被用于对你的建筑造成破坏。\n\
  \n## 令牌/卡片\n\n在物理进入设施时，令牌设备或访问卡可以作为身份验证的元素。参阅第 4 节的“令牌”、“物理访问控制”和“基于证书的身份验证”。\n\n\
  ## 环境控制\n\n`Environmental monitoring`（环境监测）是测量和评估给定结构内部环境质量的过程。这可以关注一般或基础问题，如温度、湿度、尘埃、烟雾和其他碎片。然而，更先进的系统可以包括化学、生物、放射和微生物检测器。\n\
  \n在设计安全设施时，记住各种环境因素是非常重要的。这些包括：\n\n*   控制温度和湿度\n*   尽量减少烟雾和空气中的尘埃和碎片\n*   减少震动\n\
  *   防止在敏感设备附近消耗食物饮料\n*   避免强磁场\n*   管理电磁和射频干扰\n*   调节电源\n*   管理静电\n*   提供适当的火灾和灭\n\
  \n### HVAC\n\n加热、通风和空调（`HVAC`）管理出于两个原因：温度和湿度。在任务关键的服务器机库或室内，温度应保持在选定的设定点附近，以支持最佳系统运行。对许多人来说，“最佳”温度或优选设定点是华氏\
  \ 60 度左右。然而，一些组织的运行温度低至 55 度，另一些则逐渐升至 90 度。通过良好的空气流管理和环境监测，许多公司服务器房温度每升高 1 度，就能节省\
  \ 4 到 5% 的冷却费用。整个组织应该管理湿度水平，以保持相对湿度在 40% 到 60% 之间。低湿度会导致静电堆积，放电可能会损坏大多数电子设备。高湿度会导致凝结，从而导致腐蚀。\n\
  \n### 热道和冷道\n\n`Hot and cold aisles`（热冷通道）是大型服务器房维持最佳运行温度的方法。整体技术是将服务器机架排列成行，并由过道隔开（[图\
  \ 3.25）。然后设计气流系统，使得上升的热空气被天花板上的进风口捕捉，而冷空气则从天花板或地板的相反过道返回。因此，每隔一个通道是热的，然后是冷的。这形成了一种循环模式，旨在优化冷却过程。\n\
  \n![FIGURE 3.25 A hot aisle/cold aisle air management system](img/c03f025.jpg)\n\
  \n热冷通道管理系统。\n\n### 灭火\n\n火灾是任何设施设计中必须解决常见问题。电气火灾是建筑火灾的常见原因；它们可能是由于过热的计算机或网络设备，或者管理不当的电源电缆和分配节点（电源插线）引起的。\n\
  \n\n\n\n早期火灾检测和扑灭至关重要，因为发现越早，对设施和设备的损坏就越小。人员安全始终是重中之重。然而，在专用的、安全的、关键的服务器房（通常称为`server\
  \ cage`、`server vault`或`datacenter`）中，灭火系统可以是基于气体放出的而非水基。基于气体放出的系统通过移除空气中的氧气甚至可以抑制燃烧的化学反应，通常不会损坏计算机设备，但此类系统对人体有害的。如果必须使用水基系统，请采用预作用系统，以便在发生误报时关闭水流释放。\n\
  \n设施和人员的安全应该是安全工作的重点。人的生命和安全无疑是首要考虑的问题，但也需要投入足够的精力为建筑和其他现实世界的资产提供物理安全。接下来的章节将讨论安全与安全的许多方面。\n\
  \n每栋建筑都需要一个疏散计划、一个备份疏散计划，甚至一个备份的备份疏散计划。`escape route`是人员离开建筑到达安全区域应走的路径。应该识别、标记并向所有人员传达首选和备用的疏散路线。还需要为残障人士提供便利。\n\
  \n员工需要接受安全和疏散程序的培训。一旦完成培训，应通过演习和模拟对其培训效果进行测试。让工人熟悉疏散流程有助于加强他们对疏散计划和可用路线的理解，也有助于在发生威胁事件时减轻焦虑和恐慌。\n\
  \n所有物理安全要素，特别是与人类生命和安全相关的要素，都应该定期测试。法律规定必须对灭火器、火灾探测器/报警器和电梯进行定期检查。应该对门锁、围栏、大门、防人门（mantraps）、闸机、摄像头以及所有其他物理安全控制措施实施自定的测试计划。\n\
  \n### 缆锁\n\n`cable lock`用于防止小型设备易被盗窃。许多设备（最常见的是便携式电脑）都有肯森安全插槽（K-Slot），该插槽设计为缆锁的连接点。`K-Slot`最初由肯森开发，该公司目前继续开发新的缆锁安全设备。\n\
  \n缆锁通常不是不可破解的安全设备，因为大多数便携式系统都是用薄金属和塑料制成的。然而，小偷会不于偷窃带有缆锁的设备，因为当他们试图抵押或出售设备时，强行将缆锁从`K-Slot`中拔出的损坏将显而易见。\n\
  \n### 屏幕过滤器\n\n安装`screen filters`（称为隐私过滤器）可能是值得的，它可以将屏幕可视范围缩小到相对于垂直方向最大 30 度（见图\
  \ 3.26）。这类屏幕的设计是为了防止坐在你旁边的人（例如在飞机上）看到你的显示器内容。\n\n![FIGURE 3.26 屏幕过滤器的视角](img/c03f026.jpg)\n\
  \n`FIGURE 3.26` 屏幕过滤器的视角角\n\n### 摄像头\n\n视频监控、视频监测、闭路电视（CCTV）和安全摄像头都是威慑意外活动并对事件发生创建数字记录的手段。摄像头的放置应监控出口和入口，以便允许授权级别的任何变化——例如，从外部进入设施的门、从公共区域进入工作区域的门，以及从工作区域进入高安全区域的门。摄像头还应用于监控贵重资产和资源周围的活动，如服务器房、保险箱、金库和组件储室，并为停车结构和走廊等公共区域提供额外保护。\n\
  \n摄像头应配置为记录到存储介质中。传统上是某种磁带，例如 VCR 录像带。然而，现代系统可能会记录到 DVD、NVRAM 或硬盘驱动器上，并可以通过有线甚至是加密的无线连接进行记录。\n\
  \n摄像头的类型各异。典型的安全摄像头通过记录可见光图像工作，通常在光线不足的区域额外的照明。其他类型的摄像头包括仅在检测到运动时记录的摄像头、能够在红外线下记录的摄像头以及能够自动跟踪移动的摄像头。\n\
  \n视频记录可用于检测违反策略的行为、跟踪人员移动或通过录像捕获入侵者。视频录像应进行实时监控或定期进行审查，以提供侦测效益。摄像头的视觉存在就能对潜在的犯罪者产生威慑作用。\n\
  \n摄像头主要用于检测和记录意外或未经授权的活动。如果有人知道摄像头的存在并会记录其行为，那么此人实施违规行为的可能性就会降低。这通常被称为`deterrent`（威慑）。\n\
  \n安保人员能够在设施内移动，可能查看摄像头看不到的地方。安保人员通常既是威慑手段也是侦测控制手段。他们可以应对各种问题，并根据不断变化调整行动。\n\n摄像头和安保人员都有实用的安全功能，但两者都需要适当使用才能产生益处，都有各自独特的需求，且在某些方面都有成本。\n\
  \n### 运动检测\n\n`motion detector`（或运动传感器）是感知特定区域运动或声音的设备。存在多种类型的运动检测，包括红外、热敏、波形、电容、光电和被动音频检测：\n\
  \n* 红外运动探测器监控区域内红外照明模式的显著或有效变化。\n* 热敏运动探测器监控区域热水平的显著或有效变化。\n* 波形运动探测器向监控区域发射持续的低频声波或高频微波信号，并监控反射模式的显著或有效干扰。\n\
  * 电容运动探测器感知周围物体电场或磁场的变化。\n* 光电运动探测器感知监控区域可见光水平的变化。这种传感器通常部署在没有窗户且保持黑暗的室内房间。\n* 被动音频运动探测器监听监控区域的异常声音。\n\
  \n应根据部署环境选择合适的运动检测技术，以尽量减少误报和漏报。\n\n### 日志\n\n应维护物理访问日志。这些日志可以通过使用智能卡进入设施时自动创建，也可以由安保人员在检查每个人的身份证明后手动记录进入。物理访问日志的目的是为服务器、工作站和网络设备产生的逻辑日志提供上下文。在紧急情况下，日志也很有帮助，可以判断是否每个人都已安全逃离建筑，或者是否需要派遣救援队进入。\n\
  \n### 红外检测\n\n红外检测常用于安全摄像头以感知黑暗中的环境或检测区域内的运动。这些概念在之前的“摄像头”和“运动检测”章节中讨论过。\n\n###\
  \ 密钥管理\n\n\n\n\n物理安全相关的密钥管理侧重于向需要进入安全房间、区域或容器的人员分发实体金属钥匙。应该维护详细的日志，记录谁为了什么目的、领取了哪把钥匙进入了哪个房间/容器的哪把钥匙。应定期进行审计，以确保责任人员仍持有钥匙，并告知钥匙是否已面临被盗或复制的风险。钥匙应进行编号，并在可能的情况下贴上标签或标记为不可复制（这样锁锁匠将拒绝制作副本）。当该个人不再需要访问权限时，应将钥匙归还给经理。数字或电子密钥管理与密码学有关，将在第\
  \ 6 章中进行阐述。\n\n## 考试要点\n\n### 物理访问控制\n物理访问控制是指旨在管理和控制进入特定地点的机制。能够控制谁可以接近你的环境（尤其是你的计算机和网络设备），可以让你为你的数据、资产和其他资源提供安全保障。\n\
  \n### 照明\n照明是一种常用的周边界安全形式。其主要目的是威慑那些宁愿在黑暗中进行不法行为（如破坏、盗窃和徘徊）的入侵者、侵入者或游荡者。\n\n###\
  \ 标志牌\n标志牌可用于宣布某些区域未经授权禁止进入，指示正在使用监控摄像头，并发布安全信息。\n\n### 围栏、大门和笼子\n围栏是定义边界的设备。围栏可以防止偶然侵入，并清晰地标识出物业的地理边界。大门是受控的出口和入口。笼子是一个封闭区域，用于保护资产免受未经授权的人员访问。\n\
  \n### 保员\n所有的安全控制，无论是静态威慑手段还是主动检测和监控机制，最终都依赖人员来干预并阻止实际攻击。\n\n### 报警器\n物理入侵检测系统（IDS），也称为防盗报警器，用于检测未经授权的活动并通知当局（内部安全或外部执法部门）。\n\
  \n### 保险箱\n任何包含高度敏感信息的设备或可移动介质在未使用时应安全地存放在保险箱内。\n\n### PDS\n保护分布系统（`PDS`）（也称为受保护布线系统）是保护电缆免受未经授权访问或损坏的手段。\n\
  \n### 人行门阱\n人行门阱是一种高安全屏障设备。它是一个有两个门的小房间：一扇通往受信环境，另一扇通往外部。人员必须经过正确的身份验证才能解锁内门并进入。\n\
  \n### 法第笼\n法第笼是一种可以屏蔽或吸收电磁场或信号的封闭装置。\n\n### 生物识别\n生物识别是对人体物理属性的收集，这些属性可以作为身份验证因子（你的特征）。生物识别包括指纹、掌纹扫描（使用整个手掌）、手形几何（手轮廓的几何尺寸）、视网膜扫描（眼后部的血管图案）、虹膜扫描（瞳孔周围的彩色区域）、面部识别、语音识别、签名动态识别和键盘动态识别。\n\
  \n### 环境监测\n环境监测是测量和评估给定结构内部环境质量的过程。\n\n### 湿度管理\n整个组织范围内，应管理湿度水平，以保持相对湿度在 40% 到\
  \ 60% 之间。低湿度会导致静电积聚，放电可能会损坏电子设备。高湿度会导致凝结，从而导致腐蚀。\n\n### 冷热通道\n冷热通道是大型服务器机房中维持最佳温度的手段。\n\
  \n### 灭火系统\n早期的火灾检测和灭火非常重要，因为发现越早，对设施和设备造成的损害就越小。人员安全始终是重中之重。\n\n### 电脑锁\n连接锁用于防止小型设备易被盗窃。\n\
  \n### 屏幕隐私膜\n值得安装屏幕隐私膜，将屏幕的可视范围缩小到偏离垂直方向最大 4 度。\n\n### 摄像头\n视频监控、视频监测、闭路电视（`CCTV`）和安全摄像头都是威慑意外活动并为事件发生创建数字记录的手段。\n\
  \n### 运动检测\n运动检测器或运动传感器是感知特定区域移动或声音的设备。许多类型的运动检测，包括红外、热量、波形、电容和被动音频。\n\n## 复习题\n\
