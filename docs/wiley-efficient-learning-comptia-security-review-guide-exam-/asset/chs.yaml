  \    1. 数据加密标准 (DES)\n    2. 高级加密标准 (AES)\n    3. 三重 DES (3DES)\n    4. IDEA\n3.\
  \ 保护数据、信息或资源秘密性的安全服务被称为？\n    1. 完整性\n    2. 身份验证\n    3. 不可否认性\n    4. 机密性\n4.\
  \ 数字签名可以使用以下哪些项来创建？\n    1. 非对称密码学\n    2. 哈希算法\n    3. 密钥托管\n    4. 对称密码学\n\n\n\
