  \ grabbing) 是黑客用来识别开放端口运行产品的通信技术。\n2. A. 在受到根内核 (rootkit) 攻击后，恢复系统安全状态的唯一选择是重建 (reconstitution)。\n\
  3. D. 如果用户没有经过良好培训，社会工程更容易发生。缺乏用户意识对中间人攻击、反哈希匹配或物理入侵攻击的影响较小。\n4. C. 入水池攻击 (Watering\
  \ hole attack) 可用于在后续访问者的系统中植入恶意软件。\n5. A、B 和 D。程序员可以通过验证输入、编写防御性代码、转义元字符以及拒绝所有脚本输入来实施防止\
  \ XSS 最有效的方法。\n6. A. 反病毒病毒 (Retviruses) 专门针对杀毒软件系统使其失效。\n7. D. RAT 是远程访问木马。RAT 是一种恶意代码，允许攻击者对受侵害的系统进行某种程度的远程控制。\n\
  8. A. 钓鱼 (Phishing) 是一种社会工程攻击，专注于从任何潜在目标获取凭据或身份信息。它基于获取信息的概念。攻击者通过电子通信伪装成信任实体（例如银行、服务提供商或商户）来获取用户名、密码、信用卡详情或其他个人身份信息。\n\
  9. B. 中间人攻击 (Man-in-the-middle attack) 是一种通信监听攻击。攻击者位于客户端和服务器（或任何两个通信实体）之间的通信流中。客户端和服务器认为它们正在直接通信——即使它们使用了加密或加密的通信链路。\n\
  10. D. 缓冲区溢出攻击发生在攻击者向进程提交大于输入变量容量的数据时。除非程序正确处理多余输入，否则额外数据将掉入系统的执行栈并可能作为全权限操作执行。\n\
  \n\n\n\n\n11. C. 重构是在不改变软件外部感知行为或产生结果的情况下，对软件代码进行限制或重新组织。重构侧重于改进软件的非功能性元素（质量属性、非行为需求、服务需求或约束）。重构可以提高可读性、降低复杂性、便于故障排除，并简化未来的扩展和延伸性工作。\n\
  \n12. B. 恶性孪生（Evil twin）是一种攻击手段，黑客运行一个伪接入点，该接入点会根据客户端设备的连接请求自动克隆或模拟接入点的身份。每当设备成功连接到无线网络时，它会在历史记录中保留一个无线配置文件。\n\
  \n13. A. 黑客行动主义（Hacktivist）是指利用黑客技术来实现某种事业或目的的人。黑客行动者为了推动其事业而实施犯罪活动。即使知道自己会被识别、捕获和起诉，他们仍然会攻击目标。他们这样做是因为他们相信自己的目标或事业比自己更重要。\n\
  \n14. C. 开源情报（Open source intelligence）是从任何公开的资源中收集信息。这包括网站、社交网络、讨论论坛、文件服务、公共数据库和其他在线源。这也包括非互联网源，如图书馆和期刊。\n\
  \n15. B. 在渗透测试（或泛指黑客）中，枢纽（pivot）是指破坏一个系统的行为，然后通过攻击获得的权限或访问权限，将注意力转向另一个最初可能不可见或无法利用的目标。它是指在获得初始立足点后调整入侵焦点或目标的能力。\n\
  \n16. D. 权限提升（Privilege escalation）是一种攻击或利用手段，它授予攻击者比初始利用所可能获得的更高的权限、许可或访问权限。\n\n\
  17. C. 主动侦察（Active reconnaissance）是通过交互手段收集有关目标信息的理念。通过与目标直接交互，攻击者可以快速收集准确且详细的信息，但代价可能是被识别为攻击者，而不是仅仅是一个无辜、良性的、随机访客。\n\
  \n18. B. 当使用自动化漏洞扫描器在识别弱点的同时监听网络通信时，正在对安全控制进行被动测试。\n\n19. C. 生命周期结束的系统（End-of-life\
  \ systems）是指不再接收供应商更新和支持的系统。如果一个组织继续使用寿命结束的系统，被攻击的风险将很高，因为任何未来的漏洞都永远无法被修补或修复。为了维护安全环境，放弃寿命结束的系统至关重要。\n\
  \n20. A. 默认配置不应允许留在设备或应用程序中。默认设置是为了便于安装和初始配置，以最大限度地减少新客户的咨询电话。\n\n## 第 2 章：技术与工具\n\
  \n1. B. 防火墙通过控制进入和离开网络的流量来提供保护；因此，这是一种基础的安全设备，应该部署在任何规模的网络中。\n\n2. A. 基于网络的入侵检测系统（Network-based\
  \ IDSs）不适用于检测电子邮件伪装。检测电子邮件伪装不是 `NIDS` 的功能，因为由于邮件是网络通信的有效负载，而 `NIDS` 主要关注协议标头。此外，即使是那些分析有效负载的\
  \ `NIDS`，如果那些伪造邮件元素在技术上是有效的（例如正确的值）并代表真实实体（尽管不是信息的实际作者和发送者），它们通常也无法检测伪造邮件元素。\n\n\
  3. C. 非法或未经授权的区域传输是对 `DNS` 服务器的重大且直接的威胁。如果外部人员对内部 `DNS` 服务器执行区域传输，结果将是具有 IP 地址的所有系统的信息泄露。这是由于大多数内部网络使用基于\
  \ `LDAP` 的目录服务，`LDAP` 是基于 `DNS` 的，且 `DHCP` 会自动向 `LDAP` 和 `DNS` 注册设备。\n\n4. 生存时间（`TTL`）是\
  \ `IP` 头部中的一个值，用于防止第三层环。`TTL` 值设置了 IP 数据包在未到达预期目的地而被丢弃之前可以经过的最大路由器数量。每个路由器都会将 `TTL`\
  \ 减 1，然后检查结果是否为非零（以便转发数据包）或零（丢弃数据包）。如果数据包由于 `TTL` 耗尽而被丢弃，路由器将创建一个 `ICMP` 类型 11 超时消息，并发送给被丢弃通信的源头。\n\
  \n5. C. 橡胶天线是全向天线。`Cantenenna`、`Yagi` 天线和板状天线都是定向天线的示例。\n\n6. B. 链式块消息认证码计数模式协议（`CCMP`）基于\
  \ `AES` 加密方案。\n\n7. B. 移动设备管理（`MDM`）是一种软件解决方案，用于解决员工访问公司资源所需的海量移动设备管理任务。`MDM` 的目标是提高安全性、提供监控、实现远程管理并支持故障排除。并非所有移动设备都支持可移除式存储，更少有支持加密的可移除式存储。地理标记用于标记照片和社交网络帖子，而不是用于\
  \ BYOD（自带设备）管理。应用程序白名单可能是 BYOD 管理的一个元素，但它只是完整 `MDM` 解决方案的一部分。\n\n8. B. 笔记本电脑丢失或被盗的风险是数据丢失，而不是系统本身的丢失。因此，在系统中保留少量敏感数据是降低风险的唯一方法。硬盘加密、安全锁和强密码虽然是好主意，但是预防工具而非降低风险的手段。它们不能防止故意和恶意的数据破坏发生；相反，它们鼓励诚实的人保持诚实。\n\
  \n9. B. 白名单（Whitelisting）是一种阻止未经授权软件执行的安全选项。白名单也被称为默认拒绝或隐式拒绝。黑名单（Blacklisting）被称为例外拒绝或默认允许，是防止恶意软件执行最有效的手段。\n\
  \n10. A. `LDAP` 使用 TCP 端口 `636` 和 `389`。`POP3` 和 `SMTP` 分别使用 TCP 端口 `110` 和 `25`。`TLS`\
  \ 使用 TCP 端口 `443` 和 `80`（`SSL` 仅使用端口 `443`；`HTTP` 使用端口 `80`）。`FTP` 使用 TCP 端口 `20`\
  \ 和 `21`。\n\n11. B. `NAC` 代理可以是溶解性的或永久性的。溶解性 `NAC` 代理通常使用 Web/移动语言（如 `Java` 或 `ActiveX`）编写，并在访问特定的管理网页时下载并执行到本地机器上。溶解性\
  \ `NAC` 代理可以设置为运行一次后退出，或者在系统重启之前一直留在内存中。永久性 `NAC` 代理作为持久软件后台服务安装在被监控系统上。\n\n12.\
  \ D. 媒体网关是任何将数据从一种通信格式转换为另一种格式的设备或服务。媒体网关通常位于不同类型网络的交汇处。媒体网关常用于 `VoIP` 系统，此类系统需要将\
  \ IP 通信转换为模拟或数字信号。\n\n13. B, D, E. 利用框架（Exploitation framework）是一种能够充分利用其发现的弱点的漏洞扫描器。它可以是自动或手动的漏洞评估工具。利用框架通常允许对测试元素进行自定义，并创建部署到环境环境目标的新测试。与漏洞扫描器相比，利用框架具有额外的风险，因为它尝试充分利用任何发现的弱点。\n\
