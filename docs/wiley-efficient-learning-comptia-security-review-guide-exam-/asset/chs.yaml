  \n\n\n\n\n### 6. 保安分类\nD 保安人员不是一种管理控制。保安人员可以被视为预防性、检测性和/或纠正性控制。\n\n### 7. 强制休假\n\
  D 强制假期是用户同行审计的形式。该过程通过要求每位员工每年休假（或只是离开办公室且不远程访问）最短一段时间（通常为一到两周）。在员工离开期间，另一名员工坐在其座位上，使用原员工的特权账户执行工作任务。此过程用于检测欺诈、滥用或无能。该技术通常应用于财务环境或管理高价值资产的环境。\n\
  \n### 8. 岗位轮换\n岗位轮换、交叉培训或职责轮换是职责分工应用的平衡措施。如果所有高级任务都由单个管理员执行，当其中一个人离开组织时会发生什么？如果没有其他人具备知识或技能执行这些任务，组织将遭受损失。岗位轮换是在少数一组工人（有时称为轮换小组）之间定期轮换分配的工作任务或职位描述。\n\
  \n### 9. 硬件生命周期管理\nB 老化的硬件应安排更换和/或维修。此类操作的时间表应基于为每个设备建立的或基于主流硬件生命周期管理最佳实践平均故障时间\
  \ (`MTTF`)、平均故障间隔时间 (`MTBF`) 和平均修复/恢复时间 (`MTTR`) 估计值。`MTTF` 是在特定运行环境下设备的预期典型功能寿命。`MTBF`\
  \ 是两次故障之间的预期典型时间范围，例如第一次故障和第二次故障之间。如果 `MTTF` 和 `MTBF` 为相同值（或接近），某些制造商仅列出 `MTBF`\
  \ 额定并用其涵盖这两个概念。`MTTR` 是对设备进行维修所需的平均长度。设备在发生灾难性故障之前通常可以进行多次维修。请确保在所有设备的 `MTTF` 到期前安排其更换。\n\
  \n### 10. 单点故障\nD 单点故障是指任何对组织具有中等到任务关键性重要性的个人或唯一设备、连接或路径。如果该项发生故障，整个组织将遭受损失。基础设施的设计应对对所有中等或高度重要的元素进行冗余设计，以避免单点故障。消除单点故障涉及增加冗余、恢复选项或执行业务任务和流程的替代手段。避免或解决单点故障将提高稳定性、正常运行时间和可用性。\n\
  \n### 11. 定性风险分析\nC 定性风险分析更多是基于场景的，而不是基于计算。与其为可能的损失分配精确的美元金额，不如根据量表对威胁进行排序，以评估它们的风险、成本和影响。执行定性风险分析的过程涉及判断、直觉和经验。你可以使用许多技术进行定性风险分析，包括头脑风暴、德尔法技术、故事板、焦点小组、调查、检查清单、问卷、一对一会议和访谈。\n\
  \n### 12. 风险接受\nB 接受风险或承受风险是管理层对可能的保护措施进行成本效益分析评估，并确定对措施的成本远大于由于风险导致的可能损失成本。这也意味着管理层已同意在风险发生时承担后果和损失。在大多数情况下，接受风险需要一份清晰的说明，说明为什么没有实施某保护措施、谁负责该决策，以及谁将对该决策负责。\n\
  \n### 13. 事件响应计划\nA 事件响应计划 (`IRP`) 由准备、识别、遏制、根除、恢复和教训组成。\n\n### 14. 恢复过程\nC 恢复是移除受损元素并将其替换的过程。在某些情况下，整个系统需要重新整合（从新部件重建）以恢复生产。这还包括配置设置的更改和添加新的安全功能。如果仍然存在可能导致事件再次发生的漏洞，这一点尤为重要。在恢复结束时，环境将恢复正常。\n\
  \n### 15. 法律留存\nD 法律留存是证据收集或电子发现过程中的早期步骤。它是给数据保管者的法律通知，要求必须保留特定的数据或信息，并且必须尽诚意努力进行保留。保管者必须维护并保存数据，直到收到通知该义务不再存在。\n\
  \n### 16. 取证保全\nA, B, D 取证保全旨在防止任何与收集的证据相关的变化。这些努力包括将相关存储设备从系统中移除、使用写保护保护适配器阻止存储设备接收任何写入信号、在每次操作前后使用哈希计算，并且仅分析存储设备的克隆副本而绝不分析原始设备。如果原始数据被损坏或更改，它通常将无法在法庭上采用。\n\
  \n### 17. 业务连续性计划\nB 业务连续性计划 (`BCP`) 制定者的目标是实施策略、程序和流程组合，使得潜在的破坏性事件对业务的影响降最低。\n\n\
  ### 18. 热备中心\nD 热备是原始站点的实时、秒级的镜像。它包含一个完整的网络环境，已完全安装并配置了实当前的业务数据。一旦原始站点由于灾难而无法运行，就可以使用热备继续业务运营而无需任何停机时间。热备是最贵的，但它们提供的停机时间最少。\n\
  \n### 19. 控制类型\nC 纠正性访问控制在意外或未经授权的活动发生后修改环境使系统恢复正常。预防性访问控制用于挫败或阻止意外或未经授权的活动发生。检测性访问控制用于发现或识别意外或未经授权的活动。补偿性访问控制用于为其他现有控制提供各种选项，以协助执行和支持安全策略。\n\
  \n\n\n\n\n## 20. 受保护健康信息 (PHI)\n\nA, B, C, D, E, F, G, H. 根据美国法律，受保护健康信息 (`PHI`)\
  \ 是任何与个人健康状况、医疗服务使用、医疗费用支付以及与其健康相关的收集的个人信息数据。`HIPAA` 根据 18 种信息定义了 PHI，这些信息必须安全处理，以防止泄露和滥用。这\
  \ 18 个元素包括：姓名、所有小于州级的地理标识符（因此地址、城市和邮政编码受保护）、与个人直接相关的日期（年份外）、电话号码、传真号码、电子邮件地址、社会安全号码、医疗记录号、健康保险受益人号码、账号、证书/许可证号码、车辆标识符和序列号、设备标识符和序列号、Web\
  \ URL、IP 地址、生物识别标识符、照片图像以及任何其他唯一标识数字、特征或代码（收集实体分配的数据的唯一代码除外）。\n\n## 第 6 章：密码学与 PKI\n\
  \n1. B. `Elliptic Curve Diffie-Hellman Ephemeral`（或 `Elliptic Curve Ephemeral Diffie-Hellman`，即\
  \ `ECDHE`）通过使用椭圆曲线密码学 (`ECC`) 实现完美正向安全性。`PBKDF2` 是一种直接不支持完美正向安全性的密钥扩展技术示例。`HMAC`\
  \ 是一种哈希函数。`OCSP` 用于检查证书撤销。\n\n2. C. `Triple DES` (`3DES`) 提供 168 位密钥的强度。`数据加密标准`\
  \ (`DES`) 提供 56 位密钥的强度。`高级加密标准` (`AES`) 提供 128、192 或 256 位密钥的强度。`国际数据加密算法` (`IDEA`)\
  \ 提供 128 位密钥的强度。\n\n3. D. 数据、信息或资源机密性的服务被称为`机密性` (`confidentiality`)。`完整性` (`Integrity`)\
  \ 保护数据的可靠性和正确性。`身份验证` (`Authentication`) 验证消息发送者或接收者的身份。`否认性` (`Nonrepudiation`)\
  \ 防止消息发送者或活动执行者否认其发送了消息或执行了该活动。\n\n4. C. 数字签名不使用 `密钥托管` (`Key escrow`)，但它是证书和密钥管理的容错特性。`非对称加密`和`对称加密`连同`哈希`用于数字签名。\n\
  \n5. A, C. 当主体请求证书时，必须向 `CA` 提供身份证明和主体的公钥。`私钥` (`private key`) 绝不能向任何人透露，甚至是 `CA`。在密钥或证书发布后使用硬件存储设备，而不是请求过程的一部分。\n\
  \n6. B. 从私有企业的角度来看，`集中密钥管理` (`Centralized key management`) 更安全，或至少更符合预期。从公共或个人角度来看，`去中心化密钥管理`\
  \ (`decentralized key management`) 更安全。个人分布式密钥管理是非标准术语，可以指代去中心化密钥管理。\n\n7. D. 密钥和证书应该在过期之前更新。其他选项都是错误的。\n\
  \n8. A. `CBC` (`密码块链`) 模式用于防止重复密文块的产生。这是通过在加密操作中加入 `IV` 实现的。`IV` 使用 `XOR` 与第一块集成。然后使用所选的密钥对结果进行加密。第一块的密文。\n\
  \n9. B. 从私有企业的角度来看，`集中密钥管理` 更安全，或至少更符合预期。从公共或个人角度来看，`去中心化密钥管理` 更安全。个人分布式密钥管理是非标准术语，可以指代去中心化密钥管理。\n\
  \n10. D. 使用`非对称加密`的`数字签名`：\n    1. 发送者计算哈希。\n    2. 发送者附加哈希。\n    3. 发送者使用私钥。\n\
  \    4. 接收者接收消息。\n    5. 接收者使用公钥。\n    6. 接收者解密哈希。\n    7. 接收者计算消息。\n    8. 接收者计算哈希。\n\
  \    9. 接收者比较值。\n\n11. C. `密钥扩展` (`Key stretching`) 是一种可以增强弱密码的技术集合。\n\n12. B. `模糊安全`\
  \ (`Security through obscurity`) 是通过隐藏来实现的概念。\n\n13. C. `椭圆曲线 Diffie-Hellman` (`ECDHE`)\
  \ 通过使用椭圆曲线密码学 (`ECC`) 实现完美正向安全性。\n\n14. D. `XOR` (`异或`) 是一种异或逻辑，意味着当输入不同（例如一个为 `0`\
  \ 另一个为 `1`）时输出为真（或 `1`）。它在数学文献中被称为 `XOR` 函数，通常表示为 `⊕`。当进行异或的值均为 `0` 或 `1` 时，结果为\
  \ `0`。\n\n15. B. `ROT13` 是一种基于 26 个字母的替换密码。`ROT13` 的操作是将原始明文字母移动 13 个位置。第一块的密文 `frhevgl\
  \ ebpxf` 解密为明文 `security rocks`。\n\n16. C. `WPA` 和 `WPA-2` 支持两种身份验证形式：`PSK` 和 `ENT`。`PSK`\
  \ 共享密钥也被称为个人。`PSK` 使用静态固定密码进行验证。`ENT`企业也被称为 `IEEE 802.1x/EAP`。`ENT` 允许利用现有的 `AAA`\
  \ 服务（如 `RADIUS` 或 `TACACS+`）来验证。`WEP` 仅支持固定密钥验证。`WPS`（WiFi 安全设置）为无线网络添加新客户端，除了按下\
  \ `WPS` 按钮或向 `WAP` 发送 `PIN` 之外，没有进行身份验证。\n\n17. D. `EAP-TLS` 是一种开放 标准，它是 `TLS` 协议的实现，用于保护身份验证流量。`EAP-TLS`\
  \ 被认为是可用最强大的 `EAP` 标准之一。当客户端和服务器（无线终端设备和无线基站）都拥有数字证书时，`EAP-TLS` 最有效。\n\n\n\n\n\n\
  # 19. A. 固定（Pinning）或 HTTP 公钥固定（HPKP）是一种运行在 HTTP 之上的安全机制，它允许 HTTPS（TLS 安全的网络服务）系统防止攻击者通过欺诈颁发的数字证书进行伪装。固定的工作原理是向访问者提供一个名为\
  \ `Public-Key-Pins` 的 HTTP 响应头部字段，该字段包含了服务器所使用的证书哈希值，以及关于固定这些证书的时间戳。\n\n# 20. B.\
  \ SAN（使用者备用名称）证书支持单个实体的多个名称，例如主机名、站点名称、IP 地址和通用名称。SAN 证书用于为多个名称提供身份验证，但仅限于那些特定定义的名称。\n\
