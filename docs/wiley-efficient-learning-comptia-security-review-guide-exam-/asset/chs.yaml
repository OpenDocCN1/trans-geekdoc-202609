  3. `Bollard`\n4. `Access cards`\n\n# 第 4 章 身份与访问管理\n\n本章涵盖的 CompTIA SECURITY+ 考试目标包括：\n\
  \n* **4.1 对比身份与访问管理概念。**\n    * 识别、认证、授权和审计 (AAA)\n    * 多因素身份认证\n        * 身份特征\
