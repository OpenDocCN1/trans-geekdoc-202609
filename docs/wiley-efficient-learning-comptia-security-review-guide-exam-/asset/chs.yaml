  \    * 联邦\n    * 单点登录\n    * 传递信任\n* **4.2 给定场景，安装并配置身份与访问服务。**\n    * `LDAP`\n\
  \    * `Kerberos`\n    * `TACACS+`\n    * `CHAP`\n    * `PAP`\n    * `MSCHAP`\n\
