  3. 将完整消息包发送给接收者。\n4. 发送者将加密的哈希附加消息上。\n5. 接收者计算消息的哈希。\n6. 发送者编写一条消息。\n7. 接收者比较两个哈希值。\n\
  8. 接收者剥离加密的哈希（数字签名）。\n9. 发送者使用其私钥对哈希进行加密。\n\n1. H, G, E, B, D, F, A, C, I\n2. F,\
  \ I, G, A, D, H, C, B, E\n3. C, A, E, I, B, D, G, H, F\n4. F, B, I, D, C, H, A,\
  \ E, G\n\n## 11. 你是一个拥有一个新款智能手机 App 的程序员。你的 App 为用户提供了一种在加密容器中安全存储个人数据（如日历、财务信息和个人联系人）的方法。人们担心用户无法记住长长的随机加密密钥，但你想使用某种比单纯记忆密码更强大的东西。可以使用哪种技术在尽可能减少用户记忆信息的同时，最大化加密的安全性？\n\
  \n1. 会话密钥 (Session key)\n2. 瞬态密钥 (Ephemeral key)\n3. 密钥展伸 (Key stretching)\n4. 秘密算法\
  \ (Secret algorithm)\n\n## 12. 效果最低的安全形式是什么？\n\n1. 瞬态密钥\n2. 隐蔽实现安全 (Security through\
