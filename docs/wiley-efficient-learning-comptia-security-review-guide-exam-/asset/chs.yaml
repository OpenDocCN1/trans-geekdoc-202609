  \   `Asset management`（资产管理）\n\n## 领域 2.0 技术与工具\n\n## 2.1 安装并配置网络组件。\n\n*   `Firewall`（防火墙）\n\
  \n    *   `Stateful` vs. `stateless`（状态 vs 无状态）\n    *   `Inline` vs. `passive`（内联\
