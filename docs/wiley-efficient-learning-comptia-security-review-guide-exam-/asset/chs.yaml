  \ 是使用静态固定密码进行身份认证。`ENT` 或企业模式也称为 `IEEE 802.1x/EAP`。\n\n（此处省略重复内容）\n\n`WEP` 的早期替代方案是\
  \ `WiFi 保护访问 (WPA)`。这种技术是一种改进，但本身并不完全安全。`WPA` 是 `WEP` 的改进，仍然使用 `RC4` 算法。`WPA` 采用`临时密钥完整性协议\
  \ (TKIP)` 或思科的替代方案 `轻级扩展认证协议 (LEAP)` 以确保每个连接的会话都发放一个随机加密密钥。\n\n`WPA` 支持两种形式的认证：`PSK`\
  \ 和 `ENT`。`PSK` 或预共享密钥也称为个人模式。`PSK` 是使用静态固定密码进行身份认证。`ENT` 或企业模式也称为 `IEEE 802.1x/EAP`。`ENT`\
  \ 开启了对现有 `AAA` 服务（如 `RADIUS` 或 `TACACS+）的使用。\n\n尽管 `WPA` 是 `WEP` 受欢迎的改进，但它不再被认为是安全的，因为\
  \ `RC4` 算法现在可以由于计算能力的进步而被攻破。\n\n在某些场景下可能仍考虑 `WPA`，例如需要不支持 `WPA2` 的旧设备，或者当物理隔离可以防止攻击者访问无线信号时。然而，过去\
  \ 10 年制造的设备大多支持 `WPA2`，因此很少真正需要使用 `WPA`。\n\n#### WPA2\n\n最新的无线加密形式是 `WPA2（WiFi 保护访问版本\
  \ 2，有时写作 WPA-2）`。`WPA2` 使用与 `WPA` 相同的两种认证选项：`PSK` 和 `ENT`。`WPA2` 使用 `AES` 加密算法和被称为`基于哈希的消息认证码协议\
  \ (CCMP)` 的密钥交换技术。`WPA2` 定义于 `IEEE 802.11i`。\n\n大多数无线通信的场景应使用 `WPA2`。尽管 `PSK` 方便易用，特别是在家庭或小型环境中，但在有专用\
  \ `AAA` 服务的情况下，应实施 `ENT`。\n\n#### CCMP\n\n`基于哈希的消息认证码协议 (CCMP)` 的创建是为了取代 `WEP` 和\
  \ `WPA` 的 `TKIP`。`CCMP` 基于 `AES`。它是 `802.11` 无线网络首选的安全协议。到目前，针对 `AES/CCMP` 加密的攻击尚未成功。大多数无线场景受益于使用\
  \ `CCMP/AES/WPA-2`。\n\n#### TKIP\n\n`临时密钥完整性协议 (TKIP)` 设计用于 `WEP` 的替代方案，而无需替换旧无线硬件。`TKIP`\
  \ 以 `WPA` 的名称实现在 `802.11` 无线网络中。\n\n`TKIP` 和 `WPA` 已于 2004 年被 `WPA2` 正式取代。此外，针对\
  \ `WPA` 和 `TKIP` 的特定攻击（`coWPAtty` 和一种基于 GPU 的破解工具）已使 `WPA` 的安全性变得不可靠。\n\n\n\n\n\n\
  ### EAP\n\n可扩展认证协议 (`EAP`) 并不是一种特定的认证机制；而是一个认证框架。本质上，EAP 允许新的认证技术与现有的无线或点对点连接技术兼容。目前有\
  \ 40 多种不同的 EAP 认证方法得到广泛支持。这些包括无线方法 `LEAP`、`EAP-TLS`、`EAP-SIM`、`EAP-FAST`、`EAP-TLS`\
  \ 和 `EAP-TTLS`。\n\n### PEAP\n\n受保护的可扩展认证协议 (`PEAP`) 将 EAP 方法封装在 TLS 隧道中，提供认证和潜在的加密。由于\
  \ EAP 最初设计用于用于物理隔离的通道，因此假设路径是安全的，所以 EAP 通常是不经过加密的。因此，`PEAP` 可以为 EAP 方法提供加密。\n\n\
  ### EAP-FAST\n\n通过安全隧道进行灵活认证 (`EAP-FAST`) 是由 Cisco 提出的协议，旨在取代 `LEAP`，得益于 `WPA2`\
  \ 的发展，`LEAP` 现在已经过时。\n\n### EAP-TLS\n\nEAP 传输层安全协议 (`EAP-TLS`) 是一个开放 IETF 标准，是用于保护认证流量的\
  \ TLS 协议实现。EAP-TLS 被认为可用最强大的 EAP 标准之一。当客户端和服务器（无线终端设备和无线基站）都拥有数字证书时，EAP-TLS 最为有效。\n\
  \n### EAP-TTLS\n\n隧道传输层安全协议 (`EAP-TTLS`) 是 EAP-TLS 的扩展，在认证之前在终端之间创建一个类似 VPN 的隧道。这确保了客户端的用户名永远不会明文传输。\n\
  \n### IEEE 802.1x\n\n此主题请见第 4 章的“IEEE 802.1x”节。\n\n### RADIUS 联邦\n\nRADIUS 联邦是 802.1x\
  \ 下的一个选项，无线网络中的各种设备可以使用 RADIUS 进行认证，而不是使用所有设备共享的固定静态密码。这里的联邦概念是无论厂商硬件、操作系统或应用程序如何，都能对设备进行认证，因为\
  \ `RADIUS` 是一种互操作的开放标准。\n\n### 方法\n\n本节检查了无线网络上可能使用的各种认证或访问控制技术。\n\n#### PSK vs\
  \ 企业级 vs 开放式\n\n预共享密钥 (`PSK`) 正如其名所示。两个独立的双方在通信之前，通过带外通信方法共享一个密钥。这是 WEP 的问题之一，因为用于加密的相同值也用于认证。在\
  \ `WEP` 下，这被称为共享密钥认证 (`SKA`)，连接到同一个无线网络的所有人都使用相同的值。`WPA` 和 `WPA2` 下的 `PSK` 对于无线网络的所有用户来说仍然是一个固定值，但它可以被定义为比\
  \ `WEP` 的 `PSK` 强得多的密码/口令，且 `PSK` 不再参与无线加密的密钥分配。在无法使用 `ENT` 认证的场景下应使用 `PSK`。\n\n\
  企业级，或 `ENT`，也称为 `IEEE 802.1x/EAP`。`ENT` 允许利用现有的 AAA 服务（认证、授权、计费服务），例如 `RADIUS` 或\
  \ `TACACS+` 来进行认证。这使得能够为每个连接的用户/设备实现唯一的认证，而不是像 `PSK` 那样使用固定共享认证。在任何无法使用 `ENT` 认证的场景下都应使用\
  \ `ENT` 认证。\n\n#### WPS\n\n此主题请见第 4 章的“WPS”节。\n\n#### 强制性门户\n\n强制性门户（captive portal）是一种认证技术，将新连接的无线\
  \ Web 客户端重定向到门户访问控制页面。强制性门户通常位于酒店、餐厅、酒吧、机场和图书馆。\n\n## 考试要点\n\n**定义 WEP。** 有线等效隐私\
  \ (`WEP`) 由 IEEE 802.11 标准定义。它的设计目的是为无线网络提供与有线网络相同水平的安全和加密保护。`WEP` 提供免受无线传输数据包嗅探和窃听的保护。\n\
  \n**定义 WPA。** `WEP` 的早期替代方案是 WiFi 保护访问 (`WPA`)。这种技术是一种改进，但其本身并不完全。它基于 `LEAP` 和 `TKIP`\
  \ 加密系统，并使用一个密钥。\n\n**定义 WPA2。** `WPA2` 是一种新的加密方案，被称为 `CCMP`，它基于 `AES`。\n\n**熟悉 CCMP。**\
  \ 计数模式链路消息认证协议 (`CCMP`) 是为了取代 `WEP` 和 `WPA` 而创建的。`CCMP` 基于 `AES`。\n\n**熟悉 TKIP。**\
  \ 临时密钥完整性协议 (`TKIP`) 设计用于取代 `WEP`，而无需替换旧无线硬件。`TKIP` 以 WiFi 保护访问 (`WPA`) 的名称实现在 802.11\
  \ 无线网络。\n\n**定义 EAP。** 可扩展认证协议 (`EAP`) 并不是一种特定的认证机制；而是一个认证框架。本质上，EAP 允许新的认证技术与现有的无线或点对点连接技术兼容。\n\
  \n**理解 PEAP。** 受保护的可扩展认证协议 (`PEAP`) 将 EAP 方法封装在 TLS 隧道中，提供认证和潜在的加密。\n\n**定义 LEAP。**\
  \ 轻量级可扩展认证协议 (`LEAP`) 是 `WPA` 下 `TKIP` 的 Cisco 私有替代方案。它在 `802.11i/WPA2` 系统作为标准通过之前，为了解决\
  \ `TKIP` 的缺陷而开发的。\n\n\n\n\n公钥加密在技术上是非对称加密的一个子集。此外，`公钥密钥基础设施 (PKI)` 是一个用于部署非对称（或公钥）加密，以及对称加密、哈希算法和证书的框架，以获得一个现实世界灵活且功能强大的安全通信系统。后续章节将讨论\
  \ `PKI` 及其子元素的各个方面（而不仅仅是关注公钥加密）。\n\n`PKI` 并不是一种产品；相反是一种解决方案的蓝图或概念。它规定了应该发生什么以及你应该遵守哪些标准，但没有指示你应该使用哪些技术或算法。`PKI`\
  \ 重点在于证明通信双方的身份，提供通过非对称加密解决方案安全交换会话对称加密密钥的方法，并提供通过哈希保护消息完整性的方法。大多数 `PKI` 解决方案都是基于证书和\
  \ `CA` 的使用。\n\n在任何需要完整的端到端加密解决方案的场景中，都应该实现 `PKI`。`PKI` 可以提供可靠的存储和通信加密、身份验证、数字签名、数字信封和完整性校验。\n\
  \n### 组件\n\n`数字证书` 的目的只有一个：证明用户身份或对象的来源。它们并不提供关于所附对象或服务的可靠性或质量的证明；它们仅提供该产品或服务的来源证明。\n\
  \n证书在被称为`信任第三方`的理论下工作。该理论认为，如果 `user A` 信任 `user C` 且 `user B` 信任 `user C`，那么 `user\
  \ A` 就可以信任 `B`，反之亦然。通过证书，信任第三方是证书颁发机构 (`CA`)（参见图 6.7）。如果两个用户拥有由 `CA` 发的证书，这两个用户就可以信任彼此的身份。证书在互联网和私有组织内部都是这样工作的。\n\
  \n![图 6.7 CA 流程](img/c06f007.jpg)\n\n**图 6.7** CA 流程\n\n互联网和私有网络中使用使用的证书大多基于 `X.509\
  \ 版本 3` 证书标准。该标准规定了证书的构建方式及其所需的组件，例如主体的公钥、`CA` 的区分名称、唯一的序列号以及用于证书加密的对称算法类型（参见图 6.8）。\n\
  \n![图 6.8 展示其存储的某些信息的证书](img/c06f008.jpg)\n\n**图 6.8** 展示其存储的某些信息的证书\n\n用户或主体使用以下程序获取证书：\n\
  \n1. 主体向 `CA` 请求证书。请求过程包括主体的身份证明和主体的公钥。\n2. `CA` 验证主体的身份。\n3. `CA` 创建证书。\n4. `CA`\
  \ 通过 `CA` 的私钥对证书进行签名以验证证书。\n5. `CA` 将证书颁发给主体。\n\n### CA\n\n`证书` 是身份验证的手段。它们通常涉及一个信任的第三方`证书颁发机构\
  \ (CA)`：一个私有或公共实体，负责向作为客户端（主体）或服务器（对象）的实体颁发证书。`CA` 的责任是在颁发证书之前验证每个实体的身份。证书颁发后，该实体可以使用证书作为其身份的证明。\n\
  \n当你在私有网络中使用证书时，你就是自己的信任第三方（即你是你自己的 `CA`）。这种私有证书解决方案被称为`公钥基础设施 (PKI)`。`PKI` 规定了应该发生什么以及你应该遵守哪些标准，但没有指示你应该使用哪些技术或算法。`PKI`\
  \ 重点在于证明通信双方的身份，提供通过非对称加密解决方案安全交换会话对称加密密钥的方法，并提供通过哈希保护消息完整性的方法。大多数 `PKI` 解决方案都是基于证书和\
  \ `CA` 的使用。\n\n当你在私有网络中使用证书时，你就是自己的信任第三方（即你是你自己的 `CA`）。这种私有证书解决方案被称为`公钥基础设施 (PKI)`。`PKI`\
  \ 规定了应该发生什么以及你应该遵守哪些标准，但没有指示你应该使用哪些技术或算法。当你在在私有网络中使用证书时，证书可以以逻辑或电子方式（如 `CA`）或通过物理访问设备（如智能卡）使用。在逻辑部署中，证书需要访问设备。在私有部署中，证书存储在物理访问设备上。当用户请求证书时，必须提供提供身份证明和公钥。`CA`\
  \ 通过 `CA` 的私钥对证书进行签名以验证证书。`CA` 将证书颁发给主体。\n\n\n\n\n证书有特定的过期日期，有时被称为 `lifetime date`（有效期）。当到达该日期时，证书将被自动拒绝并视为无效。然而，证书颁发机构（CA）可能会在预定义的过期日期之前有理由撤销或使证书失效。`Revocation`（撤销）是\
  \ CA 使证书失效、取消或撤销的过程。\n\n撤销的发生可能是因为主体的身份信息发生了变化、主体使用证书实施犯罪，或者主体使用证书的方式违反了 CA 的证书策略。\n\
  \n当证书被撤销时，它会被添加到 CA 的 `certificate revocation list (CRL)` 中，即其已撤销证书数据库。当证书的过期日期到达时，它将从\
  \ `CRL` 中移除，因为时间戳会自动使证书失效。因此，`CRL` 只包含那些已撤销但尚未过期的证书。图 6.10 显示了证书撤销过程。\n\n![图 6.10\
  \ 证书撤销过程](img/c06f010.jpg)\n\n图 6.10 证书撤销过程\n\n`CRL` 向所有用户和应用程序免费分发。在接受证书之前，您应该始终咨询它。在颁发给请求的用户或应用程序时，`CRL`\
  \ 也会被分配一个有效期。当 `CRL` 超过此有效期时，它就不能再信赖，您应该获取新的、更新后的 `CRL` 版本。\n\n当用户应用程序（如 Web 浏览器）从服务器（如\
  \ Web 服务器）接收证书时，应用程序首先验证证书上的日期是否仍然有效。接下来，它会检查 CA 的 `CRL` 本地副本。如果 `CRL` 不再有效，将获取更新后的\
  \ `CRL` 副本。应用程序检查该证书是否出现在 `CRL` 中。如果没出现，应用程序将证书提交给用户进行最终的接受选择。用户也可以选择接受或拒绝证书，并指示是否对未来所有该证书的实例都做出此相同的接受或拒绝选择。\n\
  \n`CRL` 进程被广泛使用，但它不是告知用户和应用程序证书状态的唯一机制。`Online Certificate Status Protocol (OCSP)`（在线证书状态协议）是另一种基于直接查询的解决方案。每当应用程序接收新证书时，它都会向\
  \ OCSP CA 服务器发送查询。CA 直接响应以指示证书是仍然有效还是已撤销。通过使用 `OCSP`，大型 `CRLs` 不再重复传输给每个请求系统，且查询是直接、即时且实时的。\n\
  \n大多数加密密钥和所有证书都有内置的过期日期。到达该日期后，密钥或证书将失效，没有任何系统会接受它。密钥和证书被分配有一个有效期，控制设置被称为 `valid\
  \ from`（生效日期）和 `valid to`（失效日期）。超过其 `valid to` 日期的密钥和证书应被丢弃或销毁。\n\n如果密钥或证书的 `valid\
  \ to` 日期临近，您应该申请更新。如果您在有效期过期之前未能续期，则必须从头开始整个请求过程。\n\n`Suspension`（挂起）是撤销的替代方案。当密钥或证书将临时从活动中移除，但主体（或\
  \ CA）不希望将其失效时可以使用挂起。当密钥或证书被挂起时，它不能用于签名或加密任何新项目，但之前签名或加密过的项目可以被验证或解密。密钥或证书可以在日后重新激活。\n\
  \n挂起状态检查是撤销状态检查的扩展。然而，结果指示证书或密钥当前是有效还是处于挂起状态（此类状态将被标记为 `certification hold`）。\n\n\
  `Renewal`（续期）是在密钥或证书过期之前，重新颁发具有延长有效期的密钥或证书的过程。续期过程不需要完全重复请求和身份证明过程；相反，使用旧密钥（即将过期的密钥）对新密钥的请求进行签名。这允许\
  \ CA 快速确定终端用户的密钥或证书是否可以立即扩展（或使用新的有效期重新颁发），或者应根据其现有的有效期被拒绝并撤销。CA 的决定通常取决于终端用户对组织证书策略（密钥或证书的可接受使用策略）的遵守情况。\n\
  \n密钥或证书不再需要，或者当它过期或被撤销后，应对对其妥善处置。这一过程被称为 `key destruction`（密钥销毁）：从所有软件和硬件存储设备中移除密钥或证书。对于仍然有效的密钥和证书，应告知\
  \ CA 密钥或证书的销毁。此操作允许 CA 更新其 `CRL` 和 `OCSP` 服务器。\n\n使用密钥销毁的原因包括结业、身份变更或必须获取替换密钥或证书。\n\
  \n### OCSP\n\n参见上一节“CRL”中关于在线证书状态协议 (OCSP) 的讨论。\n\n### CSR\n\n`certificate signing\
  \ request (CSR)`（证书签名请求）是代表用户或组织向证书颁发机构发送的消息，用于请求并申请数字证书。`CSR` 通常遵循 PKCS#10 规范或签名公钥与挑战\
  \ (SPKAC) 格式。`CSR` 通常包含生成的公钥以及根据适用证书标准（如 v3）定义的的主体详情。\n\n### 证书\n\n`Registration`（注册）是获取证书的过程。具体细节取决于\
  \ CA 是公有的还是私有的，以及用于 CA 服务的软件，但过程的基本原理是相同的。注册过程如下：\n\n1. 主体创建一个私钥并生成一个公钥。\n2. 公钥连同主体身份证明发送给\
  \ CA。\n3. CA 根据所需的尽职调查验证主体的身份。\n4. CA 通过其私钥对主体的公钥进行数字签名来创建证书，然后添加包含 `X.509 v3` 证书标准要求的文件。\n\
  5. CA 通过安全通道将证书发送给主体。\n\n某些私有组织可能会在 CA 上生成初始的主体密钥集，然后将其颁发给主体。\n\n当前的证书标准 `X.509\
  \ v3`（由 RFC 5280 定义）要求证书的组件和结构如下：\n\n* 版本号\n* 序列号\n* 签名算法 ID\n* 者名称\n* 有效期\n* 主体名称\n\
  * 主体公钥信息\n* 公钥算法\n* 主体公钥\n* 发行者唯一标识符（可选）\n* 主体唯一标识符（可选）\n* 扩展（可选）\n* 证书签名算法\n* 证书签名\n\
  \n大多数项目以明文形式显示，任何查看数字证书的人可见。最终，数字证书是由 CA 私钥签名的主体公钥，并附带包含所需详情的明文文档。\n\n\n\n\n\n`public\
  \ key`（公钥）是公钥加密密钥对中的密钥，设计用于发送到公共世界。任何人都可以获取一个人的公钥，并用它与该人员建立安全的通信。公钥由私钥派生，但无法通过逆转该过程来发现私钥。\n\
  \n## 私钥\n\n`private key`（私钥）是公钥加密密钥对中的密钥，设计为在本地安全保存，并仅供所属的个人访问。私钥用于解锁使用相应的公钥发送的通信内容。私钥也可用于制作数字签名。关于私钥的主要要点是它应该被妥善保护，并且通常用于解密。\n\
  \n## 对象标识符 (OID)\n\n`Object IDentifier (OID)`（对象标识符）用于命名或引用 `X.509` 证书中的大多数对象类型，例如名称（Distinguished\
  \ Names）和证书实践声明（Certificate Practices Statements）。`OID` 是由国际电信联盟（`ITU`）和国际标准化/国际电工委员会（`ISO/IEC`）定义的标准标识符机制，用于用全球唯一的持久歧性名称命名任何对象、概念或事物。\n\
  \n每个 `OID` 都从三个选项中的初始节点开始：`0: ITU-T`、`1: ISO` 或 `2: joint-iso-itu-t`。然后，每个后续元素或节点都从官方\
  \ `OID` 树中选择（查看 `OID` 树的在线版本：[www.oid-info.com/cgi-bin/display?tree=](http://www.oid-info.com/cgi-bin/display?tree=)）。CA\
  \ 的 `OID` 示例是 `2.16.840.1.114412`，它引用了 DigiCert CA ([`www.digicert.com`](https://www.digicert.com))）。该\
  \ `OID` 的拆分如下：\n\n* `2` - `joint-iso-itu-t`\n* `16` – 国家\n* `840` – 美国\n* `1` –\
  \ 组织\n* `114412` – DigiCert\n\n`OID` 层次结构中较低层的值（例如 DigiCert 的 `114412`）必须在 `OID`\
  \ 仓库中注册。有多个仓库，大多数 `RAs` 都可以作为仓库，且仓库中的所有数据都是公开可见。\n\n## 概念\n\n在任何 `PKI` 实现中，都有许多需要熟悉的概念。本节指出了许多可能包含在\
  \ Security+ 考试中的概念。\n\n### 在线 CA 与 离线 CA\n\n`offline CA`（离线 CA）是层次结构中的根 CA，它与网络断开，并且通常处于关闭状态，以关机状态存储在物理安全的容器（如保险库）中。当中间、从属或甚至叶子\
  \ CA 的证书即将过期或过期时，必须将 `offline CA` 重新上线，以便为其重新签名或重新发布证书。将 CA 保持离线状态的典型目的是防止整个信任链被破坏。其核心概念是：如果根\
  \ CA 被攻破，整个信任环境就会被破坏。如果根 CA 是离线的，它就不会被攻破，因此至少信任结构的根部或基础得到了保护，并在信任结构以某种方式被破坏时可以使用它重新创建或重新建立信任结构。\n\
  \n`offline CAs` 的一个重要考虑因素是，无法实现根托管的 `CRL`（吊销列表），因为该系统将不可用。因此，要么没有整个层次结构的 `CRL`，要么只有在根节点上线时才更新\
  \ `CRL`。某些 CA 系统允许在根节点离线期间，将 `CRL` 管理权委托给层次结构中的另一个 CA。\n\n`online CA`（在线 CA）始终保持在线并连接网络。为了管理\
  \ `online CA` 带来的风险，必须在物理和逻辑上都保持 `online CAs` 的安全。\n\n关于 `offline CA` 是否实际上比具有良好安全管理的\
  \ `online CA` 更安全，存在争议。由于发生过几起严重的 CA 破解事件（DigiNotar 就是其中之一；参见 [`en.wikipedia .org/wiki/DigiNotar`](https://en.wikipedia.org/wiki/DigiNotar)），这种技术并不像认为的那样可靠。事实上，许多人认为\
  \ `offline CAs` 是一种“隐性安全”。推荐的替代方案是使用硬件安全模块 (`HSM`）。\n\n### 封存 (Stapling)\n\n`OCSP\
  \ stapling`（OCSP 封存或证书封存）是检查 `X.509` 数字证书吊销状态的一种手段。该机制允许证书提交者附加或封存由签发 CA 签署的带有时间戳的\
  \ `OCSP` 响应。这种封存过程允许客户端或接收者无需与 `OCSP` 服务器交互即可验证所提供证书的状态。封存通常被视为对以前 OCSP 解决方案的改进；它降低了针对\
  \ CA 系统的拒绝服务（DoS）风险。\n\n### 固定 (Pinning)\n\n`Pinning`（固定或 `HTTP Key Pinning (HPKP)`）是一种运行在\
  \ HTTP 之上的安全机制，允许 HTTPS 系统防止攻击者通过欺诈性证书进行冒充。固定的原理是向访问者提供一个名为 Public-Pins 的 HTTP 头部字段值，其中包含了服务器使用的证书哈希值，以及保留这些固定信息的时间戳。因此，对新网站的首次访问不受固定保护。假设首次访问的是合法网站且没有发生中间人攻击，客户端将接收该服务器的有效证书列表。以后访问同一服务器时，会将数字证书的哈希与客户端上的固定哈希进行比较。如果匹配，则不受阻地与网站交互。如果不匹配，则连接被拒绝并显示警告信息，指示证书异常。\n\
  \n## 信任模型\n\n`trust model`（信任模型）指的是证书机构系统使用的信任层次结构。CA 使用的基本信任模型方案是具有单一顶层根 CA 的层次结构。`root\
  \ CA` 通过自签名自己的证书来启动信任树。根 CA 之下有一个、两个或多个从属 CA。在每个从属 CA 之下可能也有一个、两个或多个从属 CA，依此类推。从属\
  \ CA 有时被称为“中间 CA”或“叶子 CA”。在该模型中，所有 CA 只有一个父 CA，但它们可能有多个子级 CA（参见 图 6.11 ）。根 CA 是信任的起点；层次信任模型中的所有\
  \ CA 和参与者最终都依赖根 CA 的信誉。\n\n\n\n\n\n`Cross-certification`（交叉认证）发生在一个组织的 `CA` 选择信任另一个组织的\
  \ `CA` 时（参见图 6.12）。这也称为 `bridge trust structure`（桥接信任结构）。通过这种方式，两个组织的证书会被另一个组织接受。大多数情况下，`root\
  \ CA` 被配置为信任其他的 `root CAs`；然而，可能会部署一个独立的 `bridge CA` 作为新的高级根节点，其他层次结构的 `root CAs`\
  \ 信任它。如果多个 `root CAs` 直接相互信任以创建桥接信任，这也可以被称为 `mesh trust`（网状信任）。`mesh trust` 要求每个成员都直接信任每个成员；因此这种技术很难扩展，因为随着受信任\
  \ `CAs` 数量的增加，信任关系会呈指数级增长。\n\n![FIGURE 6.12 A cross or bridge trust structure](img/c06f012.jpg)\n\
  \nFIGURE 6.12 交叉或桥接信任结构\n\n`trust list`（信任列表）是信任模型的一种形式，为网络浏览器或类似的应用程序提供一份受信任 `CAs`\
  \ 的根证书列表。网络浏览器信任大量的证书源，是因为受信任 `CAs` 列表中存在受信任 `CA` 的根证书。\n\n另一种信任模型选项是 `peer trust`（对等信任）或\
  \ `web of trust`（信任网）。这与 `mesh trust` 类似，但主要区别在于 `peer trust` 不涉及层次结构或第三方信任结构。`peer\
  \ trust` 链接存在于各个实体之间，没有第三方 `CA`。相反，信任中的每个成员都是自己的 `CA`，并自颁发、自签名证书，其他人必须按原接受这些证书。\n\
  \n### Key escrow（密钥托管）\n\n在对称系统中，所有拥有共享密钥的实体都必须保护该密钥的隐私性和机密性。如果密钥在任何地方或被任何人泄露，整个解决方案（所有使用相同密钥的实体）都会被破解（受该密钥保护的所有内容都会被破解）。\n\
  \n在非对称系统中，每个终端用户必须保护自己的私钥。如果终端用户的私钥被泄露，那么只有这一个用户的安全性会丢失。\n\n`Key escrow`（密钥托管）是一种存储过程，由中心化管理系统保留私钥和/或密钥的副本（参见图\
  \ 6.13）。该系统安全地存储加密密钥，作为灾难发生时的保险或恢复手段。在密码学中，灾难是指密钥的丢失或损坏。如果此类密钥存储在托管中，它就可以通过 `key-escrow\
  \ agent`（密钥托管代理）恢复，并用于恢复任何使用损坏或丢失密钥加密的数据。\n\n![FIGURE 6.13 A key archiving or escrow\
  \ system](img/c06f013.jpg)\n\nFIGURE 6.13 密钥归档或托管系统\n\n然而，如果你是一个一个致力于获得完全、全方位安全的终端用户，那么可以从另一个角度来看待托管。如果你被分配了私钥或秘密密钥，那么颁发机构\
  \ `CA`（或加密服务器）可能会在托管中保留一份密钥副本。这意味着在任何时候，`key-recovery agent`（密钥恢复代理）都可能从托管中提取你的密钥，并在未经你许可的情况下用它解密你用公钥或秘密密钥加密的任何内容。显然，密钥托管对于私有企业环境非常好，但它并不适用于公共互联网。\n\
  \n`Recovery`（恢复）是从托管中提取密钥或证书的过程。当用户丢失密钥或密钥被损坏时，可以使用 `Recovery`。此过程也可用于提取密钥以解密数据，即使用户仍对其密钥拥有有效所有。后者选项在私有企业环境中可能是必要的。\n\
  \n\n\n\n\n另一种方案被称为`去中心化密钥管理`。在这种环境中，终端用户生成自己的密钥（对称或非对称），并仅在需要时将密钥提交给中心化机构（参见图 6.15\
  \ ）。例如，为了请求数字证书，终端用户只需将其公钥传输给 `CA`。终端用户的私钥始终保持私密，因此终端用户是拥有该密钥的唯一实体。此外，由于公钥已经是公开的，其泄露不会导致终端用户安全解决方案的完全泄露。\n\
  \n![图 6.15 去中心化的密钥生成系统](img/c06f015.jpg)\n\n`图 6.15` 去中心化的密钥生成系统\n\n在去中心化的密钥管理系统中，终端用户最终负责管理自己的密钥，并使用托管提供容错能力。如果终端用户未能采取必要的措施，丢失或损坏的密钥可能意味着丢失所有使用该密钥加密的所有数据。\n\
  \n加密密钥和数字证书应安全地存储。如果私钥（非对称）或密钥（对称）发生泄露，那么所有使用该密钥加密的数据的安全性就会丢失。必须使用可靠的存储机制来保护加密密钥。存储密钥有两种方法或机制：基于硬件的或基于软件的。\n\
  \n密钥可以存储在软件解决方案或硬件解决方案中。两者都有独特的优点和缺点。软件解决方案提供了灵活的存储机制，并且通常提供可自定义的选项。然而，此类解决方案容易受到电子攻击（病毒或入侵），可能无法妥控制访问（权限提升攻击），并可能被删除或破坏。大多数软件解决方案依赖于主机操作系统的安全性，而这种安全性可能并不足够。\n\
  \n硬件解决方案不够灵活。然而，它们比软件解决方案更可靠、更安全。硬件解决方案可能昂贵，且容易受到物理盗窃。如果用户没有物理持有硬件存储解决方案，他们无法访问安全或加密的资源。一些常见的硬件密钥存储解决方案示例包括智能卡和闪存驱动器。\n\
  \n在某些情况下，你可能会使用多对密钥。一组密钥可能用于身份验证和加密，而另一组用于数字签名。这允许第一组密钥被托管并包含在中心化密钥管理方案的数据备份中。然后，第二组密钥受到免泄露保护，所有者数字签名的隐私也得到保护，防止了滥用和伪造。\n\
  \n## 证书链\n\n证书链是 `根 CA` 与终端用户实体之间的关系。证书链是将 `根 CA` 链接到第一级中间 CA，然后将该 CA 链接到其他层级的可能的其他中间\
  \ CA，然后连接到底层的叶子 CA，最后连接到终端用户实体。\n\n`证书链`（或称为建立信任链）也可以发生在单个系统内部或私有网络环境中。此概念允许从组件感知并信任其上方的元素，而无需直接感知并信任环境的根（尽管它们有时可能将其称为根锚点）。\n\
  \n## 证书类型\n\n许多 `CA` 提供多种类型的证书。本节列出了许多类型的证书。\n\n### 通配符\n\n`通配符证书`为注册域名的下的所有子域名提供验证。证书上的\
  \ `[*.mycompany.com]` 通配符还将为 `[ftp.myexamplecompany.com]`、`[www.myexamplecompany.com]`、`[stuff.myexamplecompany.com]`、`[info.myexamplecompany.com]`\
  \ 以及任何以 `[myexamplecompany.com]` 为基础的其他内容提供身份验证。\n\n### SAN\n\n`主体备用名称 (SAN) 证书`支持单个实体的多个名称，例如主机、站点名称、IP\
  \ 地址和通用名称。`SAN` 证书用于向多个名称提供身份验证，但仅限于那些特定定义的名称。因此，它的工作方式与通配符不同。\n\n### 代码签名\n\n`代码签名证书`用于验证源代码或编译代码的来源。它是程序员、开发者或供应商证明其软件解决方案的真实性和完整性的手段。\n\
  \n### 自签名\n\n`自签名证书`是由其所标识的同一实体签发的证书。`根 CA` 为自己签发的第一份证书是自签名证书，且任何对等信任成员也会颁发自签名证书。\n\
  \n### 机器/计算机\n\n`机器或计算机证书`用于验证设备的身份，而不是服务或用户。\n\n### 电子邮件\n\n`电子邮件证书`用于验证特定的电子邮件地址。\n\
  \n### 用户\n\n`用户证书`用于验证特定的个人。\n\n### 根\n\n`根证书`是 `根 CA` 签发给自身的自签名证书，作为建立其信任结构的手段，其他设备通过被颁发受信任的第三方证书来进入该结构（最初仅从根颁发，随后由信任层次中的其他中间或从属\
  \ CA 颁发）。\n\n### 域名验证\n\n`域名验证证书`验证的是域名，而不是特定的设备、服务器或系统硬件。\n\n### 扩展验证\n\n`扩展验证\
  \ (EV) 证书`在 `CA` 颁发证书之前花费大量额外精力来验证和确认主体身份时颁发。颁发 `EV` 证书的要求和标准由扩展验证指南（`https://cabforum.org/extended-validation/`）定义。使用\
  \ `EV` 证书让终端用户能够信任经过验证的实体（并增强信心），因为 `CA` 花费额外精力验证他们确实是他们所称的。\n\n记住，没有任何 `CA` 验证过程是无懈可击的。组织中很多人，并不是所有人都完全可靠。而且信任系统经常被破坏。因此，在面对标准证书或\
  \ `EV` 证书时，不要仅仅认为经过验证的证书允许你对远程实体延伸信任和信心，而是考虑它增加了你的保证，让你在出现问题时知道找谁。\n\n## 证书格式\n\n\
  有多种证书格式。证书格式是将 `X.509 v3` 证书中定义的信息编码到文件中的方式。虽然某些格式可以互换或互操作，但并非普遍如此。\n\n### DER\n\
  \n`DER (区分编码规则)` 是一种证书文件编码技术和扩展名。`DER` 是一种二进制格式，而不是 ASCII（如 `PEM` 所使用的）。`DER` 编码证书可以存储在扩展名为\
  \ `.der` 或 `.cer` 的文件中。`DER` 可用于存储服务器证书、中间证书和私钥。`DER` 可多数场景，但通常与 `Java` 相关。\n\n\
  ### PEM\n\n\n\n\n\n`PEM`（隐私增强型电子邮件）是一种证书格式，它使用 Base64 (ASCII) 将证书细节编码到具有 `.pem`、`.crt`、`.cer`\
  \ 或 `.key` 扩展文件中。PEM 证书文件包含 `\"-----BEGIN CERTIFICATE-----\"` 和 `\"-----END CERTIFICATE-----\"\
  ` 。PEM 可存储服务器证书、中间证书和私钥。PEM 是最常用的格式。\n\n### PFX\n`PFX`（个人信息交换）或 `PKCS#12` 是一种以二进制形式存储证书数据的证书格式。PFX\
  \ 文件的扩展名为 `.pfx` 或 `.p12`。PFX 最常用于 Windows 系统，用于导入和导出证书及私钥。PFX 可存储服务器证书、中间证书和私钥。\n\
  \n### CER\n`CER`（证书）（`.crt` 的另一种形式）是一种可用于存储 DER 或 PEM 格式证书的文件扩展名。\n\n### P12\n`P12`\
  \ (`PKCS#12`）是 PFX 格式证书的一种文件扩展名选项。\n\n### P7B\n`P7B` 或 `PKCS#7` `B` 是一种以 Base64\
  \ 编码 ASCII 文件存储证书数据的证书格式。P7B 格式的数据可以存储在具有 `.p7b` 或 `.p7c` 扩展的文件中。P7B 证书文件包含 `\"\
  -----BEGIN PKCS7-----\"` 和 `\"-----END PKCS7-----\"`。P7B 可用于存储证书和链证书，不能存储私钥。\n\n\
  ## 考试要点\n\n**理解信任第三方。** 证书的运行基于“信任第三方”理论：如果用户 A 信任 C 且用户 B 信任 C，那么用户 A 就可以信任 B，反之亦然。在证书中，信任第三方是证书机构\
  \ (CA)。\n\n**熟悉证书。** 证书只有一个用途：证明用户身份或对象的来源。证书不提供关于所附对象或服务的可靠性或质量的任何证明；它们仅提供该产品或服务来源的证明。\n\
  \n**理解 X.509 版本 3 证书标准。** 大多数证书基于 X.509 版本 3 证书标准。其中一些必要组件包括主体的公钥、CA 的区分名称、唯一序列号以及用于证书加密的对称算法类型。\n\
  \n**定义 PKI。** 公钥基础设施 (PKI) 专注于证明通信双方的身份，通过非对称加密解决方案提供安全交换基于会话的对称加密密钥的方法，并通过使用哈希保护消息完整性的方法。\n\
  \n**理解请求证书的流程。** 要请求证书，主体需向 CA 提交包含其身份证明和公钥的请求。\n\n**熟悉证书策略。** 证书策略是一份作为通用互操作性标准和通用保证标准基础的\
  \ PKI 文档。它是规范组织内部数字证书使用的声明。证书策略是针对证书的可接受使用策略。\n\n**理解证书实践陈述。** 证书实践声明 (CPS) 描述了\
  \ CA 如何管理其颁发的证书。它详细说明了如何执行证书管理、如何维护安全性，以及 CA 从创建到撤销执行任何类型的证书管理时必须遵循的程序。\n\n**理解撤销。**\
  \ CA 可能在证书预定义的过期日期之前撤销或令其失效。撤销可能是因为主体的身份信息发生了变化、主体使用证书实施犯罪，或者主体使用证书的方式违反了 CA 的证书策略。\n\
  \n**理解证书吊销列表。** 当证书被撤销时，它会被添加到 CA 的证书吊销列表 (CRL) 中。CRL 免费分发给所有用户和应用程序。在接收者接受证书及其相关内容之前，应始终咨询\
  \ CRL。\n\n**定义 OCSP。** 在线证书状态协议 (OCSP) 是一种基于直接查询的撤销解决方案。每当应用程序接收到新证书时，都会向 OCSP CA\
  \ 服务器发送查询。CA 直接响应以指示该证书仍然有效还是已被撤销。\n\n**理解密钥过期。** 大多数加密密钥和所有证书都有内置的过期日期。到达日期后，密钥或证书将失效，没有任何系统会接受它。密钥和证书被分配有一个寿命，并带有名为“有效期”和“有效期结束”的控制设置。超过有效期结束日的密钥和证书应丢弃或销毁。\n\
  \n**了解密钥撤销和状态检查。** 密钥和证书可以在达到寿命过期日期之前被撤销。状态检查是根据当前系统日期检查寿命日期、检查 CRL 和/或查询 OCSP 服务器的过程。\n\
  \n**定义密钥挂起。** 挂起是撤销的替代方案。当密钥或证书将临时从活动使用中移除，但主体（或 CA）不希望完全使该密钥或证书失效时，可以使用挂起。挂起允许密钥或证书在日后的日期重新激活。\n\
  \n**定义密钥恢复。** 恢复是从托管中提取密钥或证书的过程。当用户丢失密钥或密钥损坏时，可以使用恢复过程。只有密钥恢复代理才能执行密钥恢复。\n\n**定义密钥续期。**\
  \ 续期是在密钥或证书在过期前重新颁发并延长寿命日期的过程。续期不需要完全重复请求和身份证明过程；相反，使用旧密钥（即将过期的密钥）对新密钥的请求进行签名。\n\
  \n**定义密钥销毁。** 在密钥或证书不再需要、过期或被撤销后，应妥善处置。对于仍然有效的密钥和证书，应通知 CA 已销毁。此操作允许 CA 更新其 CRL\
  \ 和 OCSP 服务器。\n\n**理解网络浏览器如何处理新证书。** 当网络浏览器从 Web 服务器接收证书时，它会验证证书上的日期仍然有效。接下来，它检查\
  \ CA 的本地 CRL。如果 CRL 不有效，则获取更新后的副本副本。应用程序检查证书是否出现在 CRL 上。如果不在，应用程序会将证书呈现给用户进行最终接受选择。\n\
  \n**熟悉 CSR。** 证书签名请求 (CSR) 是 RA 代表用户或组织向证书机构发送的请求并申请数字证书的消息。CSR 通常遵循 PKCS#10 规范或签名公钥和挑战\
  \ (SPKAC) 格式。\n\n**理解 OID。** 对象标识符 (OID) 用于命名或引用 X.509 证书中的大多数对象类型，例如区分名称和证书实践陈述。OID\
  \ 是 ITU 和 ISO/IEC 定义的标准标识符机制，用于以全球唯一的持久性名称命名任何对象、概念或事物。\n\n**熟悉密码套件。** 密码套件是身份验证、加密和哈希算法的标准集合，用于定义安全网络通信的参数。密码套件由四个元素组成并以此命名：密钥交换机制、身份验证机制、对称密码和哈希机制。\n\
  \n\n\n\n\n# 理解证书封存（stapling）。\nOCSP 封存（或封存、证书封存或以前的 TLS 证书状态请求）是检查 X.509 数字证书吊销状态的手段。这种机制允许证书提交者附加或封存由颁发\
  \ CA 签名的带有时间戳 OCSP 响应。\n\n# 定义固定（pinning）。\n固定（或 HTTP 公钥固定，HPKP）是种运行在 HTTP 之上的安全机制，它允许\
  \ HTTPS（受 TLS 安全的网络服务）系统防止攻击者通过伪造颁发的数字证书进行身份冒充。\n\n# 理解信任模型。\n信任模型术语是指证书机构系统使用的信任分级结构。CA\
  \ 使用的最基本且最常见的信任模型方案是分级结构。\n\n# 理解分级信任模型。\n分级结构具有单一的顶级根 CA。在根 CA 之下有一个、两个或多个从属 CA。根\
  \ CA 是信任的起点。分级信任模型中的所有 CA 和参与者最终都依赖于根 CA 的可信度。\n\n# 了解交叉认证。\n交叉认证或桥接信任发生在一个机构的 CA\
  \ 选择信任另一个机构的 CA 时。通过这种方式，任何一个机构的证书都被另一个机构接受。在大多数情况下，根 CA 被配置为信任另一个根 CA。\n\n# 理解身份验证。\n\
  在密码学中，身份验证是验证消息发送者或接收者身份的安全服务。\n\n# 定义不可否认性。\n不可否认性防止消息发送者或活动实施者否认他们发送了消息或执行了该活动。\n\
  \n# 了解如何使用密码系统实现身份验证。\n身份验证为用户身份提供保证。使用身份验证的一种可能方案是挑战-响应协议，其中远程用户被要求使用通信双方的密钥对消息进行加密。身份验证可以使用对称和非对称密码系统实现。\n\
  \n# 了解加密学在网络安全的常见应用。\n安全网络流量的事实标准是使用套接层 HTTP（也称为 HTTPS）。安全在保护个人消息方面起着重要作用。大多数网络浏览器都支持这两个标准。\n\
  \n# 理解在密码系统中提供不可否认性的性。\n不可否认性提供了消息发送者确实编写了该消息的不可否认证据。非对称密码系统才能实现不可否认性。\n\n# 理解密钥托管（key\
  \ escrow）。\n密钥托管是一种存储过程，由中央管理系统保留私钥或秘密密钥的副本。该系统安全地存储加密密钥，作为密钥丢失或损坏时的保险或恢复手段。\n\n\
  # 了解密钥管理基础。\n密钥长度应足够长以提供必要的保护级别，应安全地存储和传输，应该是随机的，此外，如果没有反复使用，它们应该被托管并在寿命结束时妥善销毁。\n\
  \n# 理解集中式密钥管理。\n集中式密钥管理将加密密钥的完全控制权交给机构，并夺走了终端用户的控制权。所有加密密钥的副本都存储托管。\n\n# 理解去中心化密钥管理。\n\
  在去中心化密钥管理中，终端用户生成自己的密钥（对称或非对称），并仅在需要时向中央机构提交密钥。用户的私钥始终保密，因此他们是拥有该密钥的唯一实体。\n\n# 了解密钥存储。\n\
  加密密钥和数字证书应该安全存储。如果私钥（非对称）或秘密密钥（对称）被攻破，那么所有使用该密钥加密的数据安全性将丧失。\n\n# 理解 M of N 控制。\n\
  如果环境不值得对单一密钥恢复代理产生信任，可以实现名为 M of N 控制的机制。`M of N control` 表示存在多个密钥恢复代理（`M`），并且必须有这些密钥恢复代理的特定最小数量（`N`）协同工作，才能从数据库中提取密钥。\n\
  \n# 理解软件密钥存储。\n软件解决方案提供了灵活的存储机制，通常具有可自定义选项。然而，软件解决方案容易受到电子攻击（病毒或入侵），可能无法正确控制访问（权限提升攻击），并可能被删除或破坏。大多数软件解决方案依赖主机操作系统的安全性，而这可能是不够。\n\
  \n# 理解硬件密钥存储。\n硬件解决方案没有软件解决方案灵活；但它们更可靠、更安全。硬件解决方案可能昂贵且易受物理盗窃。如果用户没有物理持有硬件存储解决方案，他们无法访问受保护或加密的资源。常见的硬件密钥解决方案示例包括智能卡和闪存驱动器。\n\
  \n# 了解私钥保护。\n在对称系统中，所有持有共享密钥的实体必须保护该密钥的隐私和秘密性。如果密钥在任何地方或被任何人攻破，整个解决方案（所有使用相同密钥的实体）都会被攻破（所有受该密钥保护的内容）。\n\
  \n# 理解使用多个密钥对。\n在某些情况下，你可能使用多个密钥对。一组密钥可能用于身份验证和加密，另一组用于数字签名。这允许第一组密钥对被托管并包含在集中密钥管理方案的数据备份中。然后保护第二组密钥免受攻破，并且所有者数字签名的隐私得到保护，防止了滥用和伪造。\n\
  \n# 定义证书链（certificate chaining）。\n证书链是根 CA 与终端用户实体之间的关系。\n\n# 了解证书类型。\n许多 CA 提供各种类型的证书，包括通配符、使用者备用名称\
  \ (SAN)、代码签名、自签名、机器/计算机、电子邮件、用户、根、域名验证和扩展验证。\n\n# 了解常见的证书格式。\n证书格式是将 X.509 v3 证书定义的信息编码为文件。格式包括\
  \ DER、PEM、PFX、P12 和 P7B。证书的文件扩展包括 `.cer`, `.der`, `.pem`, `.crt`, `.key`, `.pfx`,\
  \ `.p12`, `.p7b` 和 `.p7c`。\n\n## 复习题\n\n答案可以在附录中找到。\n\n1. 下哪项与提供或支持完美前向密钥最直接相关？\n\
