  \ 虚拟机泛滥（VM sprawl）发生在组织在没有整体 IT 管理或安全计划的情况下部署大量虚拟机时。虽然虚拟机易于创建和克隆，但它们与安装在金属机上的操作系统具有相同的许可和安全管理要求。不受控制的虚拟机创建可能迅速导致人工监督无法跟上系统需求。\n\
  \n### 18. B. 平台即服务（PaaS）是向虚拟或云服务提供计算平台和软件解决方案栈的概念。本质上，它涉及支付费用以提供平台各个方面（即操作系统和完整解决方案包）的服务。PaaS\
