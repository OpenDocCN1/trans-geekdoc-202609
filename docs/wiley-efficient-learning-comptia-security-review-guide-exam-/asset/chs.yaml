  \    1. CER 比较\n    2. OAuth 验证器\n    3. Zephyr 分析图\n    4. 联邦评估\n\n16. 随着设备敏感性的增加，哪种生物识别错误会增加？\n\
  \    1. FAR\n    2. FRR\n    3. CER\n    4. 误报\n\n17. 你正在安装一个新的网络服务应用程序。该应用程序需要在多个资源上的各种权限以及一些高级用户权限才能正常运行。应该为此应用程序创建什么类型的账户？\n\
