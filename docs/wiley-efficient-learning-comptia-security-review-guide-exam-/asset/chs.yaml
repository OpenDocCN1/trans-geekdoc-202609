- "# Wiley Efficient Learning Comptia Security+ 复习指南：考试 Sy0-501\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n# 致谢\n\n# 关于作者\n\n\n\n\n\n\n\n## 10. 复习习题\n\n## 5.9 复习习题\n\n\n\n\n\
  \n\n\n\n\n\n# 指南\n\n2. \n3. 引言\n\n# 页码\n\n220. 176\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\
  \nSecurity+ 认证计划由计算机技术行业协会（`CompTIA`）开发，旨在提供一种行业范围内的认证计算机服务技术人员在计算机安全基础方面的能力。Security+\
  \ 认证授予那些已达到知识水平和安全技能、并出个人和企业环境中基础能力的人员。该考试定期更新，以确保其内容与最新趋势同步。最近的更新标记为 `SY0-501`，于\
  \ 2017 年底发布。本书重点关注这些新修订的目标。\n\n## 什么是 Security+ 认证？\n\n创建 Security+ 认证是为了为进入复杂的\
  \ IT 安全世界提供一个入门步骤。你只需要通过单一考试即可获得 Security+ 认证。然而，获得此认证并不意味着你就能为公司提供真实的安全服务。事实上，这只是走向真正的安全知识和经验的第一步。通过获得\
  \ Security+ 认证，你应该能够积累更多的安全经验，以追求更复杂、更深入的安全知识和认证。\n\n有关考试的最新价格和注册程序的更新，请访问 `www..com`。如果您对考试范围或相关的\
  \ CompTIA 项目有进一步的问题，请参阅 CompTIA 网站 `www.comptia.org`。\n\n## 这本书适合你吗？\n\n`CompTIA\
  \ Security+ Review Guide: SY0-501` 被设计为简洁、便携的考试复习指南。它可以与更典型的全尺寸学习指南结合使用，例如 Wiley\
  \ 的 `CompTIA Security+ Study Guide: SY0-501`（ISBN: `978-1260026054`）、计算机培训（`CBT`）课程软件以及教室/实验室环境，也可以作为那些认为不需要进行更广泛（和/或更昂贵）备考的人的考试复习。我们的目标不是给出答案，而是识别出你可能被测试的主题，并对这些主题提供充分且针对性的覆盖。\n\
  \n\n\n\n\n也许你已经在信息技术领域工作多年了。花大钱参加一个专业的 IT 备考课程，这种想法听起来可能并不吸引人。他们能教给你什么你已经不知道的知识呢，对吧？不过，请小心——许多经验丰富的网络管理员曾满自信地走进考场，结果在未通过\
  \ IT 考试后局促地离开。在读完这本书后，你应该清楚地知道，你对相关技术的理解如何符合 `Security+` 考试出题者的预期。\n\n或者，你可能是 IT\
  \ 领域的新手，被其极具挑战性的工作和高薪资的承诺所吸引。你可能刚刚读完了一本 800 页的学习指南，或者在当地的培训中心上了为期一周的课程。有大量的信息需要记录，不是吗？嗯，通过根据\
  \ `CompTIA 的考试目标` 对本书进行组织，并将信息拆分为简洁、易于管理的片段，我们创建了我们认为是目前最实用的考试复习指南。把它放进背包带去上班吧。在阅读这本书时，你将能够快速识别出你最熟悉的领域以及那些需要更深入复习的领域。\n\
  \n## 本书是如何组织的？\n\n本书根据 `CompTIA` 为 `Security+` 考试准备的官方目标列表组织。章节对应于目标和主题分组的六大领域。考试在这些六个主题领域或领域的权重分配如下：\n\
  \n*   `1.0 威胁、攻击与漏洞 (21%)`\n*   `2.0 技术与工具 (22%)`\n*   `3.0 架构与设计 (15%)`\n*   `4.0\
  \ 身份与访问管理 (16%)`\n*   `5.0 风险管理 (14%)`\n*   `6.0 密码学与 PKI (12%)`\n\n在每个章节中，将根据直接来自\
  \ `CompTIA` 的官方考试目标，按顺序逐一介绍每个领域的顶层考试目标。除了对每个目标进行彻底复习外，每个章节还包含两个特定特性：`Exam Essentials（考试要点）`和\
  \ `Review Questions（复习题）`。\n\n`Exam Essentials` 在每个顶级目标章节的最后，你将获得一份短主题列表，你在考试前应该充分探索这些主题。`Exam\
  \ Essentials` 包含了你应当从该章节或从 `CompTIA Security+ Study Guide` 对应内容获取的关键信息标记。\n\n`Review\
  \ Questions` 特性结束于每个章节，提供 20 道题帮助你评估对该章节的掌握程度。\n\n## 参加 Security+ 考试的提示\n\n这里是一些成功参加考试的通用提示：\n\
  \n*   携带两种形式的 ID。其中一种必须是照片证，如驾驶执照。另一种可以是主主信用卡或护照。两种形式都必须包含签名。\n*   及早到达考试中心，以便你可以放松并复习学习材料。\n\
  *   仔细阅读题目。不要急于过早下结论。确保你确切知道题目在问什么。\n*   每道题读两次，阅读答案选项，然后在选择答案之前再次阅读题目。\n*   你可以向前或向后移动，但一次只能移动一题。只有在你对当前题目给出答案后，才能向前移动。只有在看到最后一个题目后的\
  \ `Review Page（复习页）` 后，你才能随机跳转题目。\n*   不要留下任何未回答的问题。未回答的问题不会给你猜对答案并获得更多分数的机会。\n\
  *   注意你的时间。如果你在剩余 5 分钟时还没有看到最后一道题，请对剩余题目进行猜测。\n*   会有具有多个正确答案的题目。当有多个正确答案时，屏幕上的消息会提示你“选择两个”或“选择所有适用”。务必阅读显示的消息，以便知道你必须选择多少个正确答案。\n\
  *   只需要单个正确答案的题目将使用单选按钮选择答案，而需要两个或更多答案的题目将使用复选框。\n*   在回答你不确定的多选题时，使用排除法先排除掉明显错误的答案。如果你需要进行明智的推测，这样做将增加你的几率。\n\
  *   尝试从自己的直接经验中扩展你的视角。通常，考试题的编写者来自大型企业；如果你只从小公司或个人的角度考虑答案，你可能无法确定正确答案。\n*   你可以标记或标记一个题目，表示你想在结束考试前再次复习它。被标记的题目将在\
  \ `Review page（复习页）` 上突出显示。\n*   有关考试的最新定价和注册流程的更新，请访问 `CompTIA 网站`：[www.comptia.org](http://www.comptia.org)。\n\
  \n### 基于性能的题目\n\n`CompTIA` 已开始在它的考试中包含基于性能（基于场景）的题目。这些题目与传统的多选题不同，候选人被要求执行一项任务或一系列任务。任务可能包括填空、根据视频或图像回答问题、重新排列一组顺序、在图表上放置标签、根据给定的情况或一组条件填写字段，或在网络安全管理设备上设置配置。如果你被呈现一个场景并被要求完成任务，请不要惊讶。基于性能的题目设计比标准多选题更具挑战性，因此也值更多。花时间仔细回答这些题目。有关\
  \ `CompTIA` 对基于性能题目的官方描述，请访问 [`certification.comptia.org/2012/10/09/What_Is_A_Performance-Based_Question`](http://certification.comptia.org/2012/10/09/What_Is_A_Performance-Based_Question)。\n\
  \n### 考试细节\n\n`Security+ SY0-501 考试` 最多 90 道题，考试本身的时间分配为 90 分钟。考试前的元素（如 `NDA（保密协议）`）和考试后的调查提供了额外时间。如果你只分配到多选题，那么你将会有最多\
  \ 90 道题。如果你被分配到基于性能的题目（这是最可能的），那么总题数将少于 90 道。通常会有 5 或 6 道基于性能的题目和大约 70 道多选题，总计约\
  \ 75 道。然而，你可能被分配 8 道或更多基于性能的题目和大约 50 道多选题，总计 55 道。要通过，你必须在 100-900 分范围内至少获得 750\
  \ 分（有效分为 81.25%）。考试结束后，你将收到一份测试结果打印件。该报告将显示你的分数以及你错错的考试主题。\n\n### 如何联系出版商\n\n`Sybex`\
  \ 欢迎对其所有书籍提供反馈。访问 `Sybex 网站` [www.sybex.com](http://www.sybex.com) 获取书籍更新和额外的认证信息。你还可以在那里找到表单，用于对本书或任何其他\
  \ `Sybex 书` 提交评论或建议。\n\n## Security+ 考试目标\n\n\n\n\n\n为了方便参考和说明，以下是 Security+ 目标的完整列表。此外，我们组织本书的内容与官方目标列表相对应。我们在整本书中使用该目标列表的顺序和组织方式。每个领域由一个组成。每个子目标是章节中的标题。\n\
  \n## 领域 1.0 威胁、攻击与漏洞\n\n### 1.1 给定场景，分析受陷指标并确定恶意软件类型。\n\n*   `Viruses`（病毒）\n\n \
