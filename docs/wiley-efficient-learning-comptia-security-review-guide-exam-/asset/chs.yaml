  \        * `MAC`\n        * `DAC`\n        * `ABAC`\n        * 基于角色的访问控制\n     \
  \   * 基于规则的访问控制\n    * 物理访问控制\n        * 接近卡\n        * 智能卡\n    * 生物识别因子\n    \
  \    * 指纹扫描仪\n        * 视网膜扫描仪\n        * 虹膜扫描仪\n        * 语音识别\n        * 人脸识别\n\
  \        * 误接受率\n        * 误拒绝率\n        * 交叉错误率\n    * 令牌 (Tokens)\n        * 硬件\n\
  \        * 软件\n        * `HOTP/TOTP`\n    * 基于证书的认证\n        * `PIV/CAC/smart card`\n\
  \        * `IEEE 802.1x`\n    * 文件系统安全\n    * 数据库安全\n* **4.4 给定场景，区分常见的账户管理实践。**\n\
  \    * 账户类型\n        * 用户账户\n        * 共享和通用账户/凭据\n        * 访客账户\n        * 服务账户\n\
  \        * 特权账户\n    * 一般概念\n        * 最小权限原则\n        * 入职/离职\n        * 权限审计与审查\n\
  \        * 使用审计与审查\n        * 时间限制\n        * 重新认证\n        * 标准命名规范\n        *\
  \ 账户维护\n        * 基于组的访问控制\n        * 基于位置的策略\n    * 账户策略执行\n        * 凭据管理\n  \
  \      * 组策略\n        * 密码复杂度\n        * 过期\n        * 恢复\n        * 禁用\n      \
  \  * 锁定\n        * 密码历史\n        * 密码重复\n        * 密码长度\n\nSecurity+ 考试将测试你对身份访问管理概念的理解，因为它们涉及家庭办公室和公司环境的安全网络系统。为了通过测试并有效地实施安全，你需要理解本章详细介绍的与网络相关的基本概念和术语。你还需要熟悉在给定场景下何时以及为什么要使用各种工具和技术。\n\
  \n## 4.1 对比身份与访问管理概念。\n\n身份是指对每个单独的用户、程序和系统组件进行唯一命名和引用的概念，以便进行认证、授权和审计，从而让用户对其行为负责。这也被称为“识别后认证”。访问管理是定义并强制执行每个已识别的主体可以做什么和不能做什么的概念。这被称为授权。\n\
  \n### 识别、认证、授权和审计 (AAA)\n\n理解识别、认证和授权之间的区别非常重要。尽管这些概念相似且对所有安全机制都至关重要，但它们是不同的，不能混淆。\n\
  \n识别和认证通常被用作一个两步的过程，但它们是不同的活动。*识别*（Identification）是对身份的断言。这在每次认证或访问过程中只需要发生一次。任何一种常见的认证因素都可以用于识别。一旦完成识别，必须进行认证过程。*认证*（Authentication）是验证或证明所声明身份的行为。其问题在于既要检查此类身份是否存在于安全环境的已知账户中，又要确保声称该身份的人是正确、有效且被授权使用该特定身份的人。\n\
  \n\n\n\n\n`username` 是最常见的标识形式。它是主体为了被识别为系统的有效用户而使用的任何名称。某些用户名源于个人的真实姓名，某些是被分配的，而某些是由主体自行选择的。在多个系统中使用一致的用户名有助于在这些平台上建立一致的声誉。然而，即使在复制\
  \ `username` 时，保持所有位置之间身份验证因素的唯一性也是至关重要的。\n\n身份验证可以有多种形式，最常见的是单因素、双因素或多因素配置。身份验证过程中使用的唯一因素越多，身份验证本身就越有韧性、越可靠。如果提供的身份验证因素对于声称的身份都是有效且正确的，那么就可以假设访问者就是其声称的身份。随后，授权的权限和操作限制机制将接管，并从该点开始控制用户的活动。\n\
  \n身份证明——即身份验证——通常以以下一个或多个身份验证因素的形式出现：\n\n*   `Something you know`（例如密码、代码、PIN、组合或秘密短语）\n\
  *   `Something you have`（例如智能卡、令牌设备或密钥）\n*   `Something you are`（例如指纹、视网膜扫描或语音识别；通常被称为\
  \ `biometrics`，在本章稍后部分讨论）\n*   `Somewhere you are`（例如物理或逻辑位置）；这可以视为 `something you\
  \ know` 的子集。\n*   `Something you do`（例如你的打字节奏、秘密握手或私人敲门声）。这可以视为 `something you know`\
  \ 的子集。\n\n`something you know` 身份验证因素也被称为类型 1 因素，`something you have` 称为称为类型 2 因素，`something\
  \ you are` 称为类型 3 因素。`somewhere you are` 和 `something you do` 因素没有类型标签。\n\n当仅使用一个身份验证因素时，被称为单因素身份验证（或少见的单因素认证）。\n\
  \n`Authorization` 是控制主体可以和不能做什么、访问、使用或查看内容的机制。授权通常被称为访问控制或访问限制。大多数系统都以“默认拒绝”或“隐式拒绝”的默认授权立场运行。然后，通过例外向单个主体或主体组授予所有必要的访问。\n\
  \n一旦主体通过身份验证，其访问必须经过授权。授权过程确保根据分配给已验证身份（我们从现在起称为 `subject`）的权利和特权，请求的活动或对象访问是可能的。授权指示了谁被信任执行特定操作。在大多数情况下，系统会评估访问控制矩阵，比较主体、对象和预期的活动。如果允许特定操作，则该主体获得授权；如果不允许，则该主体未获得授权。\n\
  \n请记住，仅仅因为主体已被识别并通过身份验证，并不意味着它已经获得了授权。主体可能会登录到网络（换句话说，被识别并通过身份验证），但被阻止访问文件或打印到打印机（因为未被授权执行此类活动）。大多数网络用户仅被授权在特定的资源集上执行有限数量的活动。识别和身份验证是“全有全无”的。\n\
  \n### Multifactor authentication\n\n多因素身份验证要求主体提供两个或更多因素。当仅使用一个身份验证因素时，被称为单因素身份验证（或少见的单因素认证）。身份验证过程中使用的唯一因素越多，身份验证本身就越有韧性、越可靠。\n\
  \n如果提供的身份验证因素对于声称的身份都是有效且正确的，那么就可以假设访问者就是其声称的身份。随后，授权的权限和操作限制机制将接管，并从该点开始控制用户的活动。\n\
  \n![4.1 Two-factor authentication](img/c04f1.jpg)\n\n### Federation\n\n联邦或联合身份是将主体跨越多个站点、服务或实体的账户链接到单个账户的方法。它是实现单点登录的一种。联邦解决方案通常使用\
  \ `SAML` 实现跨站身份验证。\n\n联邦在系统之间创建身份验证信任以促进单点登录。联邦信任可以是单向的或双向的，也可以是传递的或非传递的。\n\n\n\n\
  \n\n`Single sign-on (SSO)`（单点登录）意味着一旦用户（或其他主体）通过领域（realm）的身份验证，他们无需再次验证身份即可访问任何领域实体上的资源。（`Realm`\
  \ 是领域域或网络的另一种术语）。这允许用户通过单一身份验证程序，访问执行工作任务所需的所有资源、数据、应用程序和服务器。SSO 消除了用户需要管理多个用户名和密码的需求，因为只需要一组登录凭据。单点登录的一些示例包括\
  \ `Kerberos`、`SESAME`、`NetSP`、`KryptoKnight`、目录服务、瘦客户端和脚本访问。`Kerberos` 是 Security+\
  \ 考试中你应该了解的 SSO 解决方案之一；它将在后文“Kerberos”章节中进行讨论。\n\n### 传递信任\n\n`Transitive trust`（传递信任）或\
  \ `transitive authentication`（传递验证）是指当可以使用第三方绕过限制时产生的一种安全问题。传递信任是实体（如系统、网络或组织）之间的链接关系，其中从一个端点的信任跨越或通过中间实体到达最远端的端点。例如，如果四个系统通过传递信任链接（例如\
  \ A-B-C-D），那么由于传递信任的本质，A 中的中的实体就可以访问 B、C 和 D 中的资源。它可以被视为一种共享信任。\n\n传递信任的一个真实世界示例是你点披萨。厨师制作披萨并将其交给助理，助理将披萨装在盒子里。然后助理将披萨交给送餐员，送餐员将其送到你的所在地交给你的室友，然后你的室友将披萨带进厨房，你从中拿了一片吃。由于你信任链条中的每一个环节，你正经历着传递信任。\n\
  \n请记住，传递信任既可以是链接系统的有利特性，也可能是风险或破解的源头。如果厨师在披萨上放了你不想要或未点的菠萝、蘑菇或���鱼，那么信任就被破坏了。\n\n\
  攻击者经常寻找传递信任的情况，以绕过针对直接攻击的防御和封锁。例如，公司防火墙阻止攻击者对内部数据库服务器发起直接攻击。攻击者转而针对一名使用社交网络的员工。在添加目标好友后，攻击者向该员工发送一个指向恶意软件感染器的链接。如果员工点击该链接，他们的系统可能会被远程控制恶意软件感染。然后，当员工将受感染的系统带回办公室时，它为攻击者提供了攻击内部数据库的访问路径。因此，攻击者通过社交网络到员工到公司网络的传递信任导致了安全漏洞的发生。\n\
  \n## 考试要点\n\n**理解识别（Identification）。** 识别仅使用一个身份验证因素声称身份的行为。\n\n**定义身份验证（Authentication）。**\
  \ 身份验证使用一个或多个身份验证因素证明所声称身份的行为。\n\n**理解多因素身份验证（Multifactor authentication）。** 多因素身份验证要求用户提供两个或多个身份验证因素来证明其身份。\n\
  \n**了解多因素身份验证。** 使用两个或多个身份验证因素但某些属于相同类型时，就发生了多因素身份验证或强认证。\n\n**理解双因素身份验证（Two-factor\
  \ authentication）。** 使用两个不同的身份验证因素时，就发生了双因素身份验证。\n\n**理解联邦（Federation）。** 联邦或联邦身份是将主体来自多个站点、服务或实体的账户链接到单一账户的手段。\n\
  \n**理解单点登录（Single sign-on）。** 单点登录意味着一旦用户（或其他主体）通过领域的身份验证，他们无需再次验证身份即可访问任何领域实体上的资源。\n\
  \n**了解传递信任。** `Transitive trust` 或 `transitive authentication` 是当可以使用第三方绕过限制时产生的一种安全问题。传递信任是实体之间的链接关系，其中从一个端点的信任跨越或通过中间实体到达最远端的端点。\n\
  \n## 4.2 给定场景，安装并配置身份和访问服务。\n\n`Authentication`（身份验证）是用户向系统证明其身份的机制。它是证明主体是账户有效用户的过程。通常，身份验证过程涉及简单的用户名和密码。但也涉及更复杂的身份验证因素或凭据保护机制，为登录和账户验证过程提供强保护。身份验证过程要求主体提供身份然后提供该身份的证明。\n\
  \n许多系统和技术涉及识别、身份验证和访问控制。本节将讨论其中的若干几个。\n\n### LDAP\n\n请参考第二章“技术与工具”中的“LDAPS”章节以了解该技术。\n\
  \n`LDAP` 通常默认存在于每个私有网络，因为它是网络目录服务（如 `Active Directory`）的主要基础。LDAP 用于授予对网络中可用信息访问权限。通过使用授权限制，可以限制查看或搜索网络资源的能力。\n\
  \n### Kerberos\n\n早期的身份验证传输机制以明文从客户端向验证服务器发送登录凭据。遗憾的是，这种解决方案容易受到窃听和拦截，从而导致系统的安全性受到怀疑。我们需要的是一种不以易于捕获、提取和重用的形式传输登录凭据的解决方案。\n\
  \n提供登录凭据保护的方法之一是 `Kerberos`，它是一种受信任的第三方身份验证协议，最初在麻理工学院的 Athena 项目下开发。目前广泛使用的 `Kerberos`\
  \ 版本是第 5 版。`Kerberos` 用于验证网络主体（主体）对网络上其他实体（对象、资源和服务器）的身份。`Kerberos` 是平台无关的；但某些操作系统需要特殊的配置调整以支持真正的互操作性（例如带有\
  \ Unix 的 Windows 服务器）。\n\n`Kerberos` 是一种集中式身份验证解决方案。Kerberos 解决方案的核心元素是密钥分配中心 (KDC)，它负责通过使用安全加密密钥和票据在网络环境中验证主体身份并控制访问。\n\
  \n`Kerberos` 是一种受信任的第三方身份验证解决方案，因为 KDC 在客户端和服务器的通信中充当了第三方。因此，如果客户端信任 KDC 且服务器信任\
  \ KDC，那么客户端和服务器就可以相互信任。\n\n`Kerberos` 也是一种单点登录解决方案。`Single sign-on` 意味着一旦用户（或其他主体）通过领域的身份验证，他们无需再次验证身份即可访问任何领域实体上的资源。（*realm*\
  \ 是在单一 Kerberos 实现下保护的网络。）\n\nKerberos 身份验证的基本流程如下：\n\n1. 主体提供登录凭据。\n2. Kerberos\
  \ 客户端系统加密密码并将保护后的凭据传输给 KDC。\n3. KDC 验证凭据，然后创建一个 `ticket-granting ticket (TGT)`——主体密码的哈希形式，并带有一个指示有效寿命的时间戳。TGT\
  \ 被加密并发送给客户端。\n4. 客户端接收 TGT。此时，该主体是 Kerberos 领域中已验证的主体。\n\n\n\n\n\n## Kerberos 认证过程（续）\n\
  \n5. 主体请求访问网络服务器上的资源。这导致客户端向 KDC 请求`服务票据`（service ticket，ST）。\n6. KDC 验证客户端是否拥有有效的\
  \ TGT，然后向客户端颁发 `ST`。`ST` 包含一个指示其有效生存期的时间戳。\n7. 客户端接收到 `ST`。\n8. 客户端将 `ST` 发送给托管所需资源的网络服务器。\n\
  9. 网络服务器验证 `ST`。如果验证通过，它将与客户端建立一个通信会话。从此点开始，Kerberos 不再参与其中。\n\n图 4.2 显示了 Kerberos\
  \ 认证过程。\n\n![图 4.2 Kerberos 认证过程](img/c04f002.jpg)\n\n图 4.2 Kerberos 认证过程\n\nKerberos\
  \ 认证方法有助于确保登录凭据在从客户端传输到服务器的传输过程中不被泄露。票据中包含的时间戳确保了过期的票据无法被重用。这防止了针对 Kerberos 的重放攻击和欺骗攻击。\n\
  \nKerberos 支持`双向认证`客户端和服务器相互证明身份）。它具有可扩展性，因此能够管理大型网络的认证。由于是集中化的，Kerberos 有助于减少访问网络内资源的总时间。\n\
  \n## TACACS+\n\n`终端访问控制器访问控制系统 (TACACS)` 是另一个 AAA 服务器的范例。`TACACS` 是一个互联网标准（RFC 1492）。与\
  \ `RADIUS` 类似，它使用 `TCP 49` 和 `UDP 49` 端口。`XTACACS` 是思科对标准 RFC 形式的第一个私有修订版。`TACACS+`\
  \ 是思科对该服务的第二次重大修订，将其转变为另一个私有版本。这三个版本的 `TACACS` 之间互不兼容。`TACACS` 和 `XTACACS` 曾用于许多旧系统，但在当前系统中已几乎被\
  \ `TACACS+` 取代。\n\n`TACACS+` 在许多方面与 `RADIUS` 有不同。一个主要区别是 `RADIUS` 将认证和授权结合（AAA 中的前两个\
  \ A），而 `TACACS+` 将两者分离，允许在协议选择上具有更大的灵活性。例如，使用 `TACACS+` 时，管理员可以使用 Kerberos 作为认证机制，同时为授权选择完全不同的机制。在\
  \ `RADIUS` 中，这些选项相对有限。\n\n使用 `TACACS+` 的场景包括任何存在思科设备的远程访问情况。为了运行 `TACACS+ AAA` 服务来认证本地或远程系统及用户，需要思科硬件的支持。\n\
  \n## CHAP\n\n`挑战握手认证协议 (CHAP)` 是一种广泛用于各种点对点协议 (PPP) 连接（包括拨号接入、ISDN、DSL 和电缆连接）的认证协议，用作为登录凭据提供一种安全的传输机制。它是作为\
  \ `PAP` 的安全替代方案和替代品而开发的，`PAP` 以明文传输认证凭据。\n\n`CHAP` 使用初始认证保护过程来支持登录，并使用定期的中间重验证过程来确保主体/客户端仍然是其声称的身份。该过程如下：\n\
  \n1. 用户提示输入用户名和密码。只有用户名被发送到服务器。\n2. 认证过程对主体的密码执行单向哈希函数。\n3. 认证服务器将用户名与其账户数据库进行比较，以验证其是否为有效的现有账户。\n\
  4. 如果匹配，服务器向客户端发送一个随机挑战数。\n5. 客户端使用密码哈希值和挑战数作为 `CHAP` 算法的输入来生成响应，然后将响应传回服务器。\n6.\
  \ 服务器从存储的用户账户中检索密码哈希值，并结合挑战数计算出预期的响应。\n7. 如果结果匹配，主体被允许通过 `CHAP` 通信。图 4.3 显示了 `CHAP`\
  \ 认证过程。\n\n`CHAP` 是一种在连接上运行的 `RADIUS` 类似的认证系统。`CHAP` 定期向客户端发送挑战。一旦客户端通过认证，该连接就不会被劫持。\n\
  \n![图 4.3 CHAP 认证](img/c04f003.jpg)\n\n图 4.3 CHAP \n\n## PAP\n\n`密码认证协议 (PAP)` 是一种不安全的明文认证机制。`PAP`\
  \ 早已被 `CHAP` 取代。\n\n## MSCHAP\n\n`MSCHAP` 是微软对 `CHAP` 的定制化版本。`MSCHAP1` 适用于 Windows\
  \ NT 4.0 到 Windows XP 的版本。`MSCHAP` 通常与点对点隧道协议 (PPTP)（一种 VPN 协议）以及保护的可扩展认证协议 (PEAP)\
  \ 相关。`MSCHAP` 与 `CHAP` 的主要区别之一是支持双向认证而非仅限客户端认证。`MSCHAP2` 使用 `DES` 加密传输的 NT 密码哈希，这种加密很弱且容易被破解。因此，在有更强认证选项的情况下，应避免使用\
  \ `MSCHAP`。\n\n## RADIUS\n\n`远程拨号用户服务 (RADIUS)` 是一种集中认证系统。它通常用于为网络提供额外的安全层。通过将远程访问的认证从域控制器甚至远程访问服务器卸载到\
  \ `RADIUS` 等专用认证服务器，可以为整个网络提供更好的保护。`RADIUS` 适用于任何类型的远程访问，包括拨号、虚拟专用网络 (VPN) 和终端服务。\n\
  \n`RADIUS` 被称为 `AAA 服务器`。`AAA` 代表认证、授权（或访问控制）和计费（有时称为审计）。`RADIUS` 为远程访问客户端提供了独特的\
  \ AAA 功能，与普通本地域客户端的功能不同。`RADIUS` 并不是唯一的 AAA 服务器，但它是部署最广泛的。\n\n部署 `RADIUS` 时，理解 `RADIUS\
  \ 客户端`和 `RADIUS 服务器` 这两个术语非常重要，两者如图 4.4 所示。`RADIUS 服务器`显然是托管 `RADIUS` 服务的系统。然而，`RADIUS\
  \ 客户端`是远程访问服务器 (RAS)，而不是连接 RAS 的远程系统。对于远程访问客户端而言，它只看到 `RAS`，看不到 `RADIUS 服务器`。因此，`RAS`\
  \ 是 `RADIUS 客户端`。`RADIUS` 是一种经典的 AAA 解决方案，但替代方案包括思科私有的 `TACACS+` 以及 `RADIUS` 的直接竞争对手\
  \ `Diameter`。\n\n![图 4.4 RADIUS 客户端管理本地连接并向中央服务器认证](img/c04f004.jpg)\n\n\n\n\n\n\
  RADIUS 可用于任何远程访问认证场景。RADIUS 是平台无关的，因此不需要任何特定厂商的硬件。任何厂商的大多数 RADIUS 产品都与其他产品具有互操作性。RADIUS\
  \ 是一种被广泛支持的 AAA（认证、授权和计费）服务，可以作为大多数 IEEE 802.1x 实现的认证系统（参见本章后后的“IEEE 802.1x”章节），包括无线接入点上的\
  \ ENT 认证选项。\n\n### SAML\n\n`Security Assertion Markup Language (SAML)` 是一种基于 XML\
  \ 的开放标准数据格式，旨在支持系统、服务和设备之间身份认证和授权详细信息的交换。SAML 的设计是为了解决 Web 端实现单点登录（SSO）面临的困难。SAML\
  \ 的解决方案基于一种信任的第三方机制，在该机制中，主体或用户（`principle`）通过信任的认证服务（`identity provider` 身份提供者）进行验证，以便目标服务器或资源主机（`service\
  \ provider` 服务提供者）接受访问者的身份。SAML 并不规定必须使用的认证凭据，因此它具有灵活性，并可能兼容未来的认证技术。\n\nSAML 用于创建和支持认证联合。SAML\
  \ 的成功可以在任何你提供使用其他站点认证来访问账户的地方在线看到。例如，如果你访问 [feedly.com](http://feedly.com) 并点击“免费开始（Get\
  \ started for free）”按钮，会弹对话框（见图 4.5），在其中你可以选择将新的 Feedly 账户链接到 Google、Facebook、Twitter、Windows、Evernote\
  \ 或你所在公司的企业认证账户，而你不想为 Feedly 使用唯一的电子邮件和密码的话。\n\n![图 4.5 一个 SAML/OAuth 单点登录界面的示例](img/c04f005.jpg)\n\
  \n`图 4.5` 一个 SAML/OAuth 单点登录界面的示例\n\n在任何希望链接系统、服务或站点但认证解决方案尚未兼容的场景下，都应该使用 SAML。SAML\
  \ 允许在认证解决方案之间创建接口以实现联合。\n\n### OpenID Connect\n\n`OpenID Connect` 是一种基于 Internet\
  \ 的单点登录解决方案。它基于 OAuth 协议（见下一节）运行，也可用于 Web 服务以及智能设备应用。OpenID Connect 的目的或目标是简化应用程序识别和验证用户的过程。有关更多详细信息和编程指南，请参阅\
  \ [`openid.net/connect/`](https://openid.net/connect/)。\n\n任何在线应用或 Web 服务都应考虑将 OpenID\
  \ Connect 作为认证解决方案。它是一种简单的解决方案，对于你即将火的数字应用来说可能足够健壮。\n\n### OAuth\n\n`OAuth` 是一种用于认证和访问委托（联合）的开放标准。OAuth\
  \ 被网站、Web 服务和移动设备应用广泛使用。OAuth 是支持主次系统之间认证联合的简单手段。主系统可以是 Google、Facebook 或 Twitter，次要系统可以是任何。OAuth\
  \ 经常使用 SAML 实现。当你被提供使用主服务的现有认证作为次要服务的认证的能力时，通常可以识别出正在使用 OAuth（参见前文的图 4.5）。\n\nOAuth\
  \ 可用于任何场景，在这些场景中一个新的、较小的次要实体想要使用主实体的访问令牌（access tokens）作为认证手段。换句话说，OAuth 用于实现认证联合。\n\
  \n### Shibboleth\n\n`Shibboleth` 是另一个认证联合和单点登录解决方案示例。Shibboleth 是一种基于标准的开源解决方案，可用于\
  \ Internet 上的网站认证。Shibboleth 是一种基于标准的开源解决方案，可用于跨 Internet 的网站认证。它基于 SAML 开发，可用于\
  \ Internet 或私有网络。\n\n有关 Shibboleth 的更多信息，请访问 [`shibboleth.net`](https://shibboleth.net/)。\n\
  \n安全令牌（Secure token）\n\nSAML 在任何希望链接系统、服务或站点但认证解决方案尚未兼容的场景下都应被使用。SAML 允许在认证解决方案之间创建接口以实现联合。\n\
  \n安全令牌是一个受保护的加密数据，通过 Kerberos 票据验证。安全令牌也可以被称为 HOTP 设备（见本章后后的“HOTP/TOTP”章节）。\n\n\
  安全令牌应被考虑用于任何私有或公共的认证场景。\n\n\n\n\n\nNTLM 几乎用于所有 Windows 到 Windows 的身份验证场景。尽管它不是最稳健或最安全的身份验证形式，但在大多数情况下它是安全的。当\
  \ NTLM 被认为不足或不兼容时（例如连接到非 Windows 系统时），应使用基于数字证书的身份验证。\n\n## 考试要点\n\n- **理解 Kerberos。**\
  \ Kerberos 是一种受信任的第三方认证协议。它使用带有时间戳的加密密钥作为票来证明身份并授予资源访问。Kerberos 是一种单登录解决方案，通过密钥发行中心（`KDC`）管理其集中认证机制。\n\
  - **了解 TACACS+。** TACACS 是一种集中远程访问认证解决方案。它是一个互联网标准（`RFC 1492`）；然而，思科的 `XTACACS`\
  \ 以及现在的 `TACACS+` 实现迅速作为 RADIUS 的替代方案而流行。\n- **理解 CHAP。** 挑战握手认证协议（`CHAP`）是一种主要用于拨号连接（通常为\
  \ `PPP`）的认证协议，用为登录凭据提供安全的传输机制。`CHAP` 使用单向哈希来保护密码并定期对客户端进行重新认证。`CHAP` 使用的一个良好示例是两个企业路由器之间的点对点链路。\n\
  - **定义 PAP。** 密码认证协议（`PAP`）是一种不安全的明文密码登录机制。`PAP` 是早期的普通电话业务（`POTS`）认证机制。\n- **理解\
  \ MSCHAP。** `MSCHAP` 是微软定制或专有的 `CHAP` 版本。`MSCHAP` 与 `CHAP` 之间的主要区别之一是 `MSCHAP` 支持双向认证，而不是仅客户端认证。`MSCHAPv2`\
  \ 使用 `DES` 加密加密传输的 NTLM 密码哈希，这种加密非常薄弱且容易被破解。\n- **理解 RADIUS。** `RADIUS` 是一种集中认证系统。它通常被部署为网络提供额外的安全层。\n\
  - **理解 SAML。** 安全断言标记语言（Security Assertion Markup Language）是一种基于 `XML` 的开放标准数据格式，用于支持系统、和服务设备之间交换身份验证和授权详情。\n\
  - **了解 OpenID Connect。** OpenID Connect 是一种基于互联网的单登录解决方案。它在 `OAuth` 协议上运行，可以用于 Web\
  \ 服务以及智能设备应用。\n- **理解 OAuth。** `OAuth` 是一种身份验证和访问委托（联邦）的开放标准。`OAuth` 被网站/服务和移动设备应用广泛。\n\
  - **定义 Shibboleth。** Shibboleth 是另一个认证联邦和单登录解决方案示例。Shibboleth 是一种基于标准的开源解决方案，可用于互联网或私有网络内的网站身份验证。\n\
  - **理解安全令牌。** 安全令牌是一个受保护的、可能是加密的身份验证数据集，用于证明特定用户或系统已通过正式登录程序验证。访问令牌包括 Web Cookie、`Kerberos`\
  \ 票据和数字证书。安全令牌是一种不会泄露任何主体凭据信息、或允许易于伪装的访问令牌。\n- **了解 NTLM。** 新技术局域网（`NTLM`）是用于 Microsoft\
  \ Windows 的密码哈希存储系统。它是一种不可逆的挑战-响应协议系统，因此比 `LM` 哈希安全得多。`NTLM` 经常使用的地方之一是 Microsoft\
  \ Active Directory，用于替代 `RADIUS` 或 `TACACS` 解决方案进行用户登录认证。\n\n## 4.3 给定场景，实施身份和访问管理控制。\n\
  \n授权是 AAA 服务的第二个元素。因此，授权或访问控制是组织安全的重要组成部分。理解身份验证和访问控制管理的变体和选项对于安全管理至关重要。\n\n###\
  \ 访问控制模型\n\n授予或拒绝用户与资源交互并使用的能力的机制被称为`访问控制`。`访问控制`通常使用术语`授权`。授权定义了授予用户的资源访问类型——换句话说，即用户被授权做什么。授权通常被认为是身份验证之后的下一个逻辑步骤。`身份验证`是向系统证明你的身份或登录的行为。通过适当的授权或访问控制，系统可以正确控制对资源的访问，以防止未经的访问。\n\
  \n有三种常见的访问控制方法：\n\n- 强制访问控制（`MAC`）\n- 任意访问控制（`DAC`）\n- 基于角色的访问控制（`RBAC`）\n\n这三个模型在当今\
  \ IT 环境中被广泛。熟悉这些模型对于 Security+ 考试至关重要。\n\n在大多数环境中，`DAC` 是用于控制和管理主体对资源访问和使用的足够授权机制。大多数操作系统默认都是\
  \ `DAC`。在政府或军事环境中，分类被认为是一种基本的控制机制，应使用 `MAC` 根据主体的许可级别直接执行并限制访问。`RBAC` 是许多环境中的潜在备选方案，但在员工流失率高的情况下最合适。\n\
  \n### MAC\n\n`强制访问控制 (MAC)` 是政府和军事环境通常采用的访问控制形式。`MAC` 规定访问是基于一组规则授予的，而不是根据用户的自行决定。管理\
  \ `MAC` 的规则本质上是分级的，通常被称为`敏感性标签`、`安全域`或`分类`。`MAC` 环境定义了几个特定的安全域或敏感级，然后使用来自这些域的相关标签对对象和主体实施访问控制。\n\
  \n政府或军事的 `MAC` 实现通常包括以下五个级别（从最不敏感到最敏感排序）：\n\n- 不加密（Unclassified）\n- 敏感但未加密（Sensitive\
  \ but unclassified）\n- 机密（Confidential）\n- 秘密（Secret）\n- 极机密（Top secret）\n\n对象或资源被分配对应于这些安全域之一的敏感性标签。每个特定的安全域或级别定义了为了保护该域内对象而必须实施的安全机制和限制。\n\
  \n`MAC` 也可以部署在私营部门或企业环境中。此类情况通常涉及以下四个安全域级别（从最不敏感到最敏感排序）：\n\n- 公共（Public）\n- 敏感（Sensitive）\n\
  - 私有（Private）\n- 机密/专利（Confidential/Proprietary）\n\n`MAC` 环境的主要目的是防止`泄露`：即违反机密性安全原则。当未经授权的用户访问受保护的资源时，就会发生安全违反。对象根据泄露可能造成的损害被分配特定的敏感性标签。例如，如果一个极机密资源泄露，可能会对国家安全造成严重损害。\n\
  \n`MAC` 环境的工作原理是为主体分配`许可级别`并为对象分配`敏感性标签`——换句话说，一切都被分配了一个分类标记。许可级别的名称与分配给`对象`或资源的敏感性标签名称相同。人员（或其他主体，如程序或计算机系统）必须拥有与其想要访问的资源相同或更高的分配许可级别。通过这种方式，访问根据分类规则（即敏感性标签和许可级别）被授予或限制的。\n\
  \n\n\n\nMAC 之所以得名，是因为它对环境实施的访问控制是强制性的。其分配的分类以及由此产生的访问授权和限制无法由用户更改。相反，由定义环境并判断敏感性标签和许可密级分配的规则来控制授权。\n\
  \nMAC 并不是一种具有极粒度控制的安全环境。MAC 的一种改进包括对“按需知晓”（need to know）的使用：这是一种安全限制，除非主体有知晓某些对象的需求，否则某些对象（资源或数据）将受到限制。需要特定“按需知晓”的对象会被分配一个敏感性标签，但它们与具有相同敏感性标签的其他对象（在同一安全域内）进行隔离。“按需知晓”本身就是一种规则，它规定仅向被分配了需要访问受隔离对象的工作任务的用户授予访问。即使用户具有适当的许可级别，如果没有按需知晓，他们也将拒绝访问。“按需知晓”是\
  \ DAC 中最小权限原则在 MAC 中的对应概念（该原则在下一节中描述）。\n\n## DAC\n\n`Discretionary access control\
  \ (DAC)` 是大多数商业和家庭环境中使用的访问控制或授权形式。DAC 是用户导向的，更具体地说，是由环境中的对象（资源）的所有者和创建者控制的。DAC 是基于身份的：对象的所有者根据用户身份和对象所有者的裁量权授予或限制访问。因此，对象的所有者或创建者可以决定哪些用户被授予或拒绝访问其对象的权限。为了实现这一点，DAC\
  \ 使用了 ACLs。\n\n`access control list (ACL)` 是附加到环境中每个对象和资源上的安全逻辑机制。它定义了根据对象类型，哪些用户被授予或拒绝了各种可用的访问权限。可以将单个用户账户或用户组添加到对象的\
  \ `ACL` 中，并授予或拒绝授予其访问权限。\n\n如果你的用户账户没有通过对象的 `ACL` 获得访问权限，那么你的访问通常会被默认拒绝（注意：并非所有操作系统都使用默认拒绝的方法）。如果你的用户账户通过对象的\
  \ `ACL` 被专门授予了访问权限，则你被授予定义的特定级别或类型的访问权限。如果你的用户账户通过对象的 `ACL` 被专门拒绝了访问权限，则你将被拒绝定义的特定级别或类型的访问权限。在某些情况下（例如\
  \ Microsoft Windows），`ACL` 中的 `Denied`（拒绝）设置将覆盖所有其他设置。Table 4.1 显示了一个属于三个组的用户的访问矩阵，以及对网络服务器上文件夹内特定文件的访问结果。如你所见，`Denied`\
  \ 设置的存在覆盖了从另一个组授予的任何其他访问权限。因此，如果你在某个用户组中的身份授予了你对某个对象的写入权限，但另一个组专门拒绝你对同一对象的写入权限，那么你将被拒绝对该对象的写入权限。\n\
  \n**表 4.1**](#c04.xhtml#tableanchor4-1) 基于组成员身份的累积访问\n\n| 销售组 | 用户组 | 研究组 | 最终访问结果\
  \ | 文件名 |\n| --- | --- | --- | --- | --- |\n| Change | Read | 未指定 | Change | SalesReport.xls\
  \ |\n| --- | --- | --- | --- | --- |\n| Read | Read | Change | Change | ProductDevelopment.doc\
  \ |\n| 未指定 | Read | Denied | Denied | EmailPolicy.pdf |\n| Full control | Denied\
  \ | 未指定 | Denied | Customers.doc |\n\n## ABAC\n\n`Attribute-based access control\
  \ (ABAC)` 是通过通过属性或特征分配访问的机制。属性可以与用户、对象、系统、应用程序、网络、服务、时间甚至甚至是主观的环境考虑因素有关。ABAC 访问随后通过一组布尔规则（类似于\
  \ if-then 编程语句）确定，并产生操作将引起的结果。ABAC 是一种动态的、感知内容的授权方案，可以根据风险配置和不断变化的环境条件（如系统负载、延迟、是否使用加密）来修改访问。ABAC\
  \ 也称为基于策略的访问控制 (PBAC) 和基于声明的访问控制 (CBAC)。\n\n## RBAC\n\n`Role-based access control\
  \ (RBAC)` 是另一种严格的访问控制形式。它可能与 MAC 一起被归为非强制性访问控制一类。RBAC 使用的规则基本上是职位描述：用户被分配一个特定的角色，并根据该角色的必要工作任务授予对对象的访问。例如，备份操作员的角色可能被授予将系统上的每个文件备份到磁带驱动器的能力。被赋予备份操作员角色的用户就可以执行该功能。\n\
  \n`Rule-based access control (RBAC 或 rule-BAC)` 通常用于根据过滤规则过滤流量的网络设备，如防火墙和路由器。基于规则的访问控制\
  \ (RBAC) 系统独立于用户或资源强制执行规则，因为规则就是规则。如果防火墙规则将端口设置为关闭，那么无论谁尝试访问系统，该端口都是关闭的。这些过滤规则通常被称为\
  \ `rules`（规则）、`rule sets`（规则集）、`filter lists`（过滤列表）、`tuples`（组）或 ACL。\n\n物理访问控制\n\
  \n考虑 IT 安全时经常忽略了管理物理访问的需求。需要物理访问控制来限制物理访问违规，而需要逻辑访问控制来限制逻辑访问违规。\n\n在设施的不同区域之间存在价值、风险或用途差异的任何情况下，都应该实施物理访问控制。在任何认为设置锁门合理的地方，都应该实施由技术管理的物理访问控制。\n\
  \n\n\n\n除了智能卡和哑卡外，近距离设备也可用于控制物理访问。`proximity device`（近距离设备）或近距离卡可以是无源设备、感应供电设备或应答设备。近距离设备由授权持有者佩戴或拿着。当它通过\
  \ `proximity reader` 时，读取器能够确定持有者的身份以及他们是否具有授权访问权限。无源设备通过反射或以其他方式改变读取器产生的电磁场，读取器会检测到这种变化。\n\
  \n无源设备没有主动源电子元件；它只是具有特定属性的小磁铁（类似于 DVD 上常见的防盗装置）。感应供电设备具有电子元件，当设备进入读取器产生的电磁（EM）场时会被激活。此类设备从电磁场产生电为自身供电（例如只需将访问卡在读器几英寸内移动即可解锁大门的读卡器）。应答设备是自供电的，并传输接收器接收到的信号。这可以持续进行，也可以在按下按钮时进行（例如车库门开启器或汽车报警器钥匙）。\n\
  \n除了智能/哑卡和近距离读器外，还可以使用射频识别 (RFID) 或生物识别访问控制设备管理物理访问。\n\n### 智能卡\n\n参见实施基于证书的认证讨论中后文“PIV/CAC/智能卡”章节。\n\
  \n### 生物识别因素\n\n`Biometrics`（生物识别）是用于描述人体物理属性集合的术语，这些属性可以作为识别或认证因素。生物识别属于“你是什么”这一认证因素类别：你作为人类，识别元素是你物理身体的一部分。\n\
  \n为了识别和认证目的，可以考虑多种生物识别因素。后续章节将讨论其中的几个几个选项。\n\n然而，当组织决定实施生物识别因素时，评估可用选项非常重要，以便选择最符合组织安全标准的生物识别解决方案。实现这一目标的方法之一是咨询\
  \ Zephyr 分析图（[图 4.6]）。这种图展示了各种生物识别因素选项特征的相对优缺点。`图 4.6` 中显示的特定示例从四个特征（侵入性、准确性、成本和工作量）上评估了八种生物识别类型。安全管理员应根据组织对所评估特征的优先级来选择一种生物识别形式。\n\
  \n![FIGURE 4.6 一个 Zephyr 分析图](img/c04f006.jpg)\n\n`FIGURE 4.6]` 一个 Zephyr 分析图\n\n\
  一旦选定了生物识别类型，就需要购买特定的品牌和型号。实施最准确设备的方法是通过交叉错误率分析（参见本章稍后关于“交叉错误率”的章节）完成。\n\n生物识别设备或生物识别扫描仪应作为多因素认证的要素。任何涉及敏感数据的场景都对应着更高安全性的需求。更强安全性的一个要素是更稳健的认证。任何形式的多因素认证都比单因素认证解决方案更强大。\n\
  \n### 指纹扫描仪\n\n指纹扫描仪用于分析手指和拇指上皮肤脊纹的可见图案。指纹被认为是个人独有的，几十年来一直用于物理安全中的识别，现在也经常用作电子认证因素。指纹读器现在被广泛用于笔记本电脑、智能手机和\
  \ USB 闪存器，作为识别和认证的方法。尽管指纹扫描仪很常见且看起来易于使用，但它们有时会被指纹照片、黑粉和胶带提取的指纹或橡胶制品的指纹所欺骗。\n\n###\
  \ 视网膜扫描仪\n\n视网膜扫描仪关注眼后方的血管图案。视网膜扫描是最准确的生物识别认证形式，能够区分同卵双胎。然而，它是员工接受度最低的生物识别扫描方法，因为它们可能会暴露健康状况，例如高血压和怀孕。早期的视网膜扫描向用户眼睛里吹一口气（这很不舒服），但新的设备通常使用红外光。视网膜图案也会随着年龄增长和视网膜退化而改变。\n\
  \n### 虹膜扫描仪\n\n虹膜扫描仪关注瞳孔周围的颜色区域。它是准确准确生物识别认证形式。虹膜扫描通常被认为比其他生物识别因素具有更长的认证有效期，因为虹膜在人一生中（除非眼睛受伤）保持相对不变。\n\
  \n### 语音识别\n\n语音识别是一种生物识别认证，依赖于人声音的特征，即声纹。为了进行认证，用户说出一个特定的短语并与原始语音进行比较。语音识别有时用作额外的认证机制，但很少单独使用。\n\
  \n### 人脸识别\n\n人脸识别基于脸部的几何图案来检测个体。面部扫描用于在进入安全空间（如安全保险库）之前识别和认证人员。许多照片网站现在都包含人脸识别，一旦个人在其他照片中被识别，就可以自动识别并标记他们。\n\
  \n### 误识率\n\n与所有硬件形式一样，生物识别读器也存在潜在的错误。有两种特定的错误类型引起关注：`false rejection rate (FRR)`\
  \ 或 I 类错误，以及 `false acceptance rate (FAR)` 或 II 类错误。`FRR` 是根据设备敏感性对有效主体进行失败认证的次数，而\
  \ `FAR` 是根据设备敏感性所接受的无效主体数量。\n\n### 误拒率\n\n在前节中讨论过。\n\n### 交叉错误率\n\n生物识别设备的两个错误测量（`FRR`\
  \ 和 `FAR`）可以映射在比较灵敏度与错误率的图表上。图中这两种率相交的点被称为`交叉错误率 (CER)`；参见 `图 4.7`。注意 `FRR` 错误数量随着敏感性的增加而增加，而\
  \ `FAR` 错误随着敏感性的增加而减少。`CER` 点（相对于错误刻度测量）用于确定来自不同供应商或不同型号的特定部位哪种生物识别设备最准确。相对较低的 `CER`\
  \ 点是相关部位更准确的生物识别设备。\n\n![FIGURE 4.7 一个 FRR 和 FAR 的图示图](img/c04f007.jpg)\n\n`FIGURE\
  \ 4.7]` 一个 FRR 和 FAR 的图示图\n\n\n\n\n\n`token`（令牌）是一种身份验证因素，属于“你拥有的”东西。它通常是一个硬件设备，也可以通过软件形式实现为逻辑令牌。令牌用于生成临时的单次使用密码，目的是创建更强力的身份验证。通过这种方式，用户账户不再绑定到单一的静态密码。相反，用户必须在物理上持有生成密码的设备。在登录过程中，用户输入令牌中提供的当前有效密码作为其密码。\n\
  \n令牌有多种形式。某些令牌根据时间生成密码（参见本章后半部分的图 4.8），而另一些则根据身份验证服务器的挑战生成密码。无论哪种情况，用户生成的密码都只能使用（或尝试使用）一次，在此之后他们必须等待下一个时间窗口或请求另一个挑战。只能使用一次的密码被称为`一次性密码`（`OTP`）。这是最安全的密码形式，因为无论其使用是否导致登录成功，该一次性密码永远不会再次有效。由于密码具有复杂性和不断变化的特性，一次性密码只有在使用令牌时才能被采用。然而，令牌并不一定是一个设备；也有纸质选项以及基于智能手机应用程序的解决方案。\n\
  \n![FIGURE 4.8 RSA SecurID 令牌设备](img/c04f008.jpg)\n\n`FIGURE 4.8` RSA SecurID 令牌设备\n\
  \n令牌可能是一个设备（图 4.8），例如带有或不带键盘的小型计算器。它也可以是一个高端智能卡。如果部署当，基于令牌的身份验证系统比仅有密码的系统更安全。\n\n\
  在任何需要或应当使用多因素认证的场景下，都应该使用令牌。与单一因素身份验证相比，实施多因素解决方案可以改进几乎每一个身份验证事件。\n\n### 硬件\n\n\
  身份验证令牌可以是一个硬件设备，用户每次尝试登录时都必须在场。硬件令牌通常设计得很小，可以挂在钥匙扣或挂绳上。它们通常被称为钥匙扣令牌或钥匙感应器（key fobs）。\n\
  \n### 软件\n\n身份验证令牌可以是软件解决方案，例如智能设备上的应用程序。由于我们许多人几乎去哪里都随身携带手机，因此需要时拥有一个提供`OTP`的应用程序可以消除携带另一个硬件设备或物理令牌的需求。软件令牌应用程序广泛可用并实现在许多互联网服务中；因此，很容易采用作为私有网络的身份验证因素。\n\
  \n### HOTP/TOTP\n\n`基于 HMAC 的一次性密码`（`HOTP`）令牌，或异步动态密码令牌，是某些设备或应用程序，它们不是基于固的时间间隔，而是基于非重复的单向函数（例如哈希或哈希消息认证码（`HMAC`——一种在哈希过程中使用对称密钥的哈希算法）来生成密码。这些令牌通常在用户向令牌设备输入\
  \ PIN 后生成密码。身份验证过程通常包括挑战和响应，其中服务器向用户发送一个 PIN，用户输入 PIN 来创建密码。这些令牌嵌入了一个唯一的种子（或随机数）以及设备的唯一标识符。有关此操作的描述请参见前面的“CHAP”章节。\n\
  \n使用 HOTP 有一个潜在的缺点，被称为`错位问题`（`off-by-one problem`）。如果非基于时间的种子或密钥同步出现偏差，客户端可能计算的值可能是服务器已经丢弃或尚未生成的值。这需要设备与身份验证服务器重新同步。\n\
  \n`基于时间的一次性密码`（`TOTP`）令牌，或同步动态密码令牌，是按固定时间间隔（例如每 60 秒）生成密码的设备或应用程序。时间间隔令牌的时钟必须与身份验证服务器同步。为了进行身份验证，用户输入显示的密码连同\
  \ PIN 或短语作为第二个身份验证因素。生成的一次性密码提供身份标识，而 PIN/短语提供身份验证。\n\n### 基于证书的身份验证\n\n证书或数字证书是源自非对称公钥密码的可信第三方身份验证技术。有关数字证书的详细内容，请参见第\
  \ 6 章。\n\n`基于证书的身份验证`通常是验证设备、系统、服务、应用程序、网络和组织身份的可靠机制。然而，仅凭证书不足以识别或验证个人，因为证书是数字文件，可能会丢失、被盗或被其他滥用于冒充攻击。但是，当作为多因素认证过程实施时，证书可以显著提高各种场景下登录的安全性。\n\
  \n#### PIV/CAC/智能卡\n\n`智能卡`（图 4.8）是嵌入集成电路芯片的信用卡大小的 ID、证章或安全通行证。它们可以包含有关授权持有者的信息，这些信息可用于识别和/或验证。某些智能卡甚至可以处理信息或在内存芯片中存储相当数量的数据。许多智能卡被用作数字证书的硬件可插式介质存储设备。这使得用户能够随身携带信用卡大小的设备，并将该设备作为多因素认证的要素之一，专门支持将证书认证作为这些因素之一。\n\
  \n智能卡可能有几种术语：\n\n*   包含集成电路（`ICs`）的身份令牌\n*   处理器型 IC 卡\n*   带有`ISO 7816` 接口的 IC\
  \ 卡\n\n智能卡通常被视为一种完整的安全解决方案，但它们本身不应是完整的。与任何单一安全机制一样，智能卡会受到缺陷和漏洞的影响。它们可能受到物理攻击、逻辑攻击、木马程序攻击或社会工程攻击。\n\
  \n`存储卡`是带有磁条或只读芯片的机器可读身份卡，例如信用卡、借记卡或 ATM 卡。存储卡可以保留少量数据，但无法像智能卡那样处理数据。存储卡通常作为双因素控制的一种：卡片是你拥有的东西，而其`PIN`是你知道的东西。然而，存储卡很容易被复制或伪隆，无法满足安全环境下的身份验证。\n\
  \n`通用访问卡`（`CAC`）是美国政府和军事用于身份验证目的的智能卡的名称。尽管`CAC`名称是由国防部分配的，但相同的技术在商业环境中也被广泛使用。这种智能卡用于托管凭据，特别是数字证书，可用于授予设施或计算机终端的访问。\n\
  \n`个人身份验证`（`PIV`）卡，如证章、身份卡和安全证，是物理身份识别和/或电子访问控制设备。证章可能只是简单的一个名字标签，指示你是有效员工还是访客。它也可以是采用多因素认证的复杂智能卡或令牌设备，用于验证并证明你的身份，并提供访问设施、特定房间或安全工作站的身份验证和授权。证章通常包含照片、编码数据的磁条和个人信息，以帮助安保人员验证身份。\n\
  \n\n\n\n\n胸证可以用于主要由安保人员控制物理访问的环境。在这种情况下，胸证是安保人员的视觉识别工具。他们可以通过将你的照片与本人进行对比来验证你的身份，并查阅打印或电子授权人员名单来确定你是否具有有效权限。\n\
  \n胸证也可以用于由扫描设备而非安保人员维护的环境。在这种情况下，胸证既可用于身份识别也可用于身份验证。当胸证用于身份识别时，需在设备上刷卡，然后胸证所有者必须提供一个或多个认证因子，例如密码、短语或生物特征（如果使用了生物识别设备）。当胸证用于身份验证时，胸证所有者提供\
  \ ID、用户名等，然后通过刷卡胸证进行验证。\n\n## IEEE 802.1x\n\n`IEEE 802.1x` 是一种基于端口的认证机制。它基于可扩展认证协议\
  \ (EAP)，通常用于封闭环境的无线网络。然而，`802.1x` 并不仅用于无线接入点 (WAP)，它也可以用于防火墙、代理、VPN 网关以及其他需要认证交接服务的地方。可以将\
  \ `802.1x` 视为一种认证代理。当你希望使用现有的认证系统而不是配置另一个系统时，`802.1x` 可以让你实现这一点。\n\n当使用 `802.1x`\
  \ 时，它会根据用户或服务的认证情况，基于端口做出允许或拒绝连接的决策。`802.1x` 最初被用于弥补无线等效隐私加密 (WEP) 的缺陷，但今天它通常用作更复杂的认证和连接管理系统的组件，包括远程认证拨入用户服务\
  \ (`RADIUS`)、`Diameter`、Cisco 系统终端访问控制器访问控制系统加密 (`TACACS+`) 以及网络访问控制 (`NAC`)。\n\n\
  与许多技术一样，`802.1x` 容易受到中间人攻击和劫持攻击的影响，因为认证机制仅在连接建立时发生。\n\n`802.1x` 是一种标准的基于端口的网络访问控制，确保客户端在进行适当认证之前无法与资源进行通信。从本质上说，`802.1x`\
  \ 是一个交接系统，允许任何设备使用现有网络基础设施的认证服务。通过使用 `802.1x`，可以将其他技术和解决方案如 `RADIUS`、`TACACS`、证书、智能卡、令牌设备和生物识别技术集成到任何通信系统中。`802.1x`\
  \ 通常与无线接入点相关，但其用途并不限于无线。\n\n## 文件系统安全\n\n`Filesystem security` 通常关注授权而非认证。为了保护文件系统，要么需要锁定访问存储设备的计算机访问权限，以拒绝任何未经专门授权的访问（例如使用多因素身份认证），或者应对对存储设备进行加密，以阻止除有意授权之外的所有人员访问。详见本章前面的“访问控制模型”部分，有关通过\
  \ `DAC`、`MAC`、`RBAC` 等进行授权控制的细节。\n\n文件系统安全应应用于所有场景，以定义用户拥有的访问权限。此类权限应根据他们的工作职责授予，以便用户完成工作任务，而不会给组织带来重大的额外不当风险。这一概念被称为最小权限原则，应该在所有资源访问管理手段中采用并执行。\n\
  \n## 数据库安全\n\n`Database security` 对于任何将大型数据集视为核心资产的组织来说都是重要组成部分。如果没有数据库安全工作，业务任务可能会中断，机密信息可能会泄露。数据库安全涉及的广泛主题包括聚合、推理、数据挖掘、数据仓库和数据分析。\n\
  \n结构化查询语言 (`SQL`) 是用于与大多数数据库交互的语言，它提供了许多功能，可以合并一个或多个表中的记录以产生可能有用的信息。这一被称为“聚合”的过程并非没有安全漏洞。聚合攻击被用于收集许多低级安全项目或低价值项目，并将它们结合起来以创建出更高安全级别或更高价值的内容。\n\
  \n例如，假设一个低级军事记录员负责在人员和设备从一个基地转移到另一个基地时更新其记录。作为其职责的一部分，该记录员可能被授予查询和更新人员表所需的数据库权限。\n\
  \n军方可能不会将个人的调转请求（换句话说，琼斯中士正从 X 基地调往 Y 基地）视为机密信息。记录员拥有访问该信息的权限，因为他需要它处理琼斯中士的调转。然而，由于可以使用聚合函数，记录员可能会计算分配到世界每个军事基地的部队人数。这些兵力水平通常是严密保护的军事机密，但低级记录员可以通过对大量非机密记录使用聚合函数来推断它们。\n\
  \n出于此原因，数据库安全管理员严格控制对聚合函数的访问，并充分评估它们可能向未经授权的人员披露的潜在信息尤为重要。\n\n推理攻击带来的数据库安全问题与数据聚合威胁引起非常相似。推理攻击涉及将几条非敏感信息相结合，以获取应属于更高级别的信息。然而，推理利用的是人类大脑的演绎能力，而非现代数据库平台的原始数学能力。\n\
  \n一个经常引用的推理攻击示例是：大型公司的一名会计员被允许检索公司薪资支出总额以用于高层报告，但不被允许访问单个员工的薪水。会计员通常需要准备生效日期为过去的日期的报告，因此被允许访问过去一年任何一天的薪资总额。假设该会计员还必须知道各种员工的入职和离职日期，并拥有访问这些信息的权限。这为推理攻击打开了大门。如果某人是在特定日期入职的唯一员工，会计员现在就可以获取该日期和前一天的薪资总额，从而推断出该员工的薪水——这是用户不被允许直接访问的敏感信息。\n\
  \n与聚合一样，防御推理攻击的最佳方法是对授予单个用户的权限保持持续警惕。此外，可以使用数据模糊化处理来防止对敏感信息的推理。例如，如果会计员只能检索四舍五入到最百万的薪资信息，他可能无法获得关于单个员工的任何有用信息。最后，你可以使用数据库分区技术，根据内容价值、风险和重要性将单个数据库划分为多个独立的数据库，以对抗此类攻击。\n\
  \n\n\n\n许多组织使用大型数据库（称为数据仓库（大数据概念的前身）来来存储来自各种数据库的海量信息，以用于专门的分析技术。这些数据仓库通常包含详细的历史信息，由于存储限制或数据安全考量，这些信息通常不会存储在生产环境数据库中。\n\
  \n数据字典通常用于存储关于数据的关键信息，包括用法、类型、来源、关系和格式。数据库管理软件（`DBMS`）通过读取数据字典来确定尝试访问数据的用户的访问权限。\n\
  \n数据挖掘技术允许分析师梳理数据仓库，并寻找潜在的关联信息。例如，分析师可能会发现灯泡的需求在冬季月份总是增加的，并在规划定价和促销策略时利用这些信息。数据挖掘技术的结果是开发出可以预测未来活动的数据模型。\n\
  \n数据挖掘活动产生元数据——即关于数据的数据。元数据并非数据挖掘操作的产物；其他功能或服务也可以产生元数据。可以将数据挖掘操作产生的元数据看作是数据的浓缩。它也可以是一个更大数据集的超集、子集或表示。元数据可以是数据集中重要、重大、相关、异常或离群的元素。\n\
  \n元数据的一个常见安全示例是安全事件报告。事件报告是通过使用安全审计数据挖掘工具从审计日志数据仓库中提取的元数据。在大多数情况下，元数据的价值或敏感性（由于披露性）高于仓库中的大部分数据。因此，元数据被存储在一个被称为“数据市”的更安全的容器中。\n\
  \n数据仓库和数据挖掘对安全专业人员具有重要意义，原因有二：首先，如前所述，数据仓库包含大量潜在敏感信息，容易受到聚合攻击和推理攻击，安全从业人员必须确保采取适当的访问控制和其他安全措施来保护这些数据。其次，数据挖掘在被用于为基于统计异常入侵检测系统建立基准时，实际上可以作为一种安全工具。\n\
  \n数据分析是对原始数据进行检查的科学，重点是从海量信息集中提取有用信息。数据分析的结果可能关注正常或标准项目的的重要离群值或异常、所有数据项目的摘要，或者对某些有趣信息的针对性提取和组织。随着越来越多的组织从客户和产品中收集惊人量的数据，数据分析是一个不断发展的领域。待处理的海量信息需要一种全新的数据库结构和分析工具。它甚至获得了“大数据”的绰号。\n\
  \n大数据指的是规模大到传统的分析或处理方法变得不再有效、低效且不足的数据集。大数据涉及许多严峻挑战，包括收集、存储、分析、挖掘、传输、分发和结果展示。如此大量的数据有可能揭示普通数据集无法解决的细微差别和特性。从大数据中学习的潜力巨大，但处理大数据的负担同样巨大。随着数据量的增加，数据分析的复杂性也随之增加。大数据分析需要在大规模并行或分布式处理系统上运行高性能分析。在安全方面，组织正努力收集日益详细和详尽的事件数据和访问数据。收集这些数据的目的是评估合规性、提高效率、提高生产力以及检测违规行为。\n\
  \n关系数据库是在平面二维表中组织和结构化数据的方法。基于行的列组织方案被广泛使用，但它并不总是最佳解决方案。当关系数据库变得极其巨大时，特别是设计和管理不当时，可能会变得难以管理和使用。当大量用户同时执行查询时，它们的性能可能会缓慢。而且它们可能不支持现代复杂编程技术和数据结构所需的数据映射。在过去，大多数`RDBMSs`的应用都没有经历过这些潜在的缺点。然而，在如今的大数据以及\
  \ Google、Amazon、Twitter 和 Facebook 等规模的服务时代，`RDBMSs`已不是某些数据管理需求的充分解决方案。\n\n`NoSQL`\
  \ 是一种采用非关系数据结构的数据库方法，如层次级结构或多级嵌套和引用。`层次级数据结构`是指每个数据对象可以有一个单一的数据父关系，并具有零、一个或多个数据子关系。`数据父节点`是向上或更靠近层次结构根的项，而`数据子节点`是向下或离根部更远的项。`DNS`\
  \ 和 `XML` 数据是层次级数据结构的绝佳示例。\n\n`多级嵌套和交叉引用数据结构`是一种系统，其中数据对象可以拥有多个数据父和数据子链接，甚至可能拥有跨多个层级或“同级”数据项之间的链接。有效地，任何数据项都可以链接到任何其他数据项，而没有结构限制。Facebook、Twitter\
  \ 和 Google+ 关系的组织就是这种性质。这种 `DBMS` 结构也被称为“分布式数据库模型”。\n\n`NoSQL` 数据库还是 `SQL` 数据库？这是\
  \ `DBMS` 管理员和数据库程序员之间经常争论的问题。然而，在这里使用 `SQL` 术语并不完全准确，因为 `SQL` 是与数据库交互的手段，而不是数据库的形式或类型。更具体地说，比较是在关系数据库管理系统（`RDBMSs`）和非关系数据库之间。标记为\
  \ `NoSQL` 的数据库实际上可能支持 `SQL` 命令，因此应该被标记为 `NotRDBMS` 或 `NotRelational`。`NoSQL` 这个绰号更多是对\
  \ `Microsoft SQL Server` 的轻微蔑视，而不是表示用于大数据的 `DBMS` 不支持 `SQL` 查询。\n\n近年来，使用 `SQL`\
  \ 数据库（再次为了清楚，支持 `SQL` 表达式的 `DBMS`）的服务、应用程序和网站被发现受到一系列攻击的影响，特别是 `SQL` 注入。然而，这种攻击与\
  \ `DBMS` 和 `SQL` 表达式的关系较小，更多是源于网站配置安全性较低且使用了非防御性脚本。接收用户输入但未专门编写以防御 `SQL` 注入的脚本默认是脆弱的。这种漏洞结合\
  \ `DBMS` 松散的安全控制，导致了互联网上 `SQL` 注入攻击的泛滥。\n\n\n\n\n- **原子性**：每个事务都以“全成功或全失败”的状态执行。\n\
  - **一致性**：每个事务都保持数据的有效性和数据库有效状态。\n- **隔离性**：每个事务都独立发生，互不干扰。\n- **持久性**：每个已提交的事务都是持久可靠的。\n\
  \n关于 NoSQL 的讨论通常会提到 `JSON` 主题。`JavaScript Object Notation (JSON)`）是某些 NoSQL 数据库选项中常用的组织和引用格式。将\
  \ `JSON` 作为 NoSQL 解决方案的基础是互联网服务的一种流行选择。然而，它只是许多可用 NoSQL 选项之一。\n\n## 考试要点\n\n**理解授权。**\
  \ 授权是控制主体可以和不能做什么、访问、使用或查看内容的机制。授权通常被称为访问控制或访问限制。\n\n**了解访问控制。** 访问控制或权限管理可以使用三种主要方案之一来实现：用户、组或角色。这些方案直接对应访问控制方法\
  \ `DAC`、`MAC` 和 `RBAC`。\n\n**理解 MAC。** 强制访问控制（`MAC`基于分类规则。对象被分配敏感性标签，主体被分配许可标签。用户通过拥有特定资源的适当许可获得访问权限。分类是分层级的。\n\
  \n**了解常见的 MAC 分级结构。** 政府或军事 `MAC` 使用以下级别：未分类、敏感但不机密、机密、秘密和绝密。私营部门或公司业务环境 `MAC` 使用这些：公开、敏感、私有和机密。\n\
  \n**理解 DAC。** 任意访问控制（`DAC`）基于用户身份。用户通过对象上的 `ACLs` 授予访问权限，由对象所有者或创建者决定。\n\n**理解 ACL。**\
  \ `ACL`（访问控制列表）是附加到环境中每个对象和资源上的安全逻辑设备。它根据对象类型定义哪些用户被授予或拒绝各种类型的访问权限。\n\n**理解 ABAC。**\
  \ 基于属性的访问控制（`ABAC`）是一种通过属性或特征方案为资源分配访问和权限的机制。\n\n**了解基于角色的访问控制 (RBAC)。** 基于角色的访问控制（`RBAC`）基于工作描述。用户根据其分配的工作任务获得访问权限。`RBAC`\
  \ 最适合员工流动率高的环境。\n\n**了解基于规则的访问控制 (RBAC)。** `基于规则的访问控制 (RBAC)` 通常用于根据过滤规则过滤流量的网络设备，例如防火墙和路由器上发现的规则。`基于规则`的系统独立于用户或资源执行规则，因为规则就是规则。\n\
  \n**理解邻近系统。** `邻近设备或邻近卡` 可以是被动设备、场场供电设备或应应器。\n\n**理解生物识别设备选择。** 评估可用选项以选择最符合组织安全优先事项的生物识别解决方案非常重要；这可以通过咨询\
  \ `Zephyr` 分析图来实现。\n\n**理解 FRR 和 FAR。** 误拒率（`FRR`，或 `I 型`）错误是根据设备敏感性计算的有效主体认证失败次数。误接受率（`FAR`，或\
  \ `II 型`）错误是根据设备敏感性计算的接受的无效主体次数。\n\n**定义 CER。** 交叉错误率（`CER`）是图中 `FRR` 线和 `FAR` 线交叉的点。相对最低的\
  \ `CER` 点对于相应的部位来说是准确的生物识别设备。\n\n**理解令牌 (Tokens)。** 令牌是身份验证因素的一种形式，是你所拥有的东西。它通常是一个硬件设备，但可以在软件中实现为逻辑令牌。\n\
  \n**理解 TOTP。** 基于时间的一次性密码（`TOTP`）令牌或同步动态密码令牌是在固定时间间隔生成密码的设备或应用程序。\n\n**理解 HOTP。**\
  \ 基于 HMAC 的一次性密码（`HOTP`）令牌或异步动态密码令牌不是基于固定时间间隔，而是基于不重复的单向函数（例如 `hash` 或 `HMAC` 操作）生成密码的设备或应用程序。\n\
  \n**理解身份验证卡。** 个人身份验证卡（如胸卡、身份证和安全 ID）是物理识别和/或电子访问控制设备。\n\n**了解智能卡。** 智能卡是嵌入集成电路芯片的信用卡大小的\
  \ ID、胸卡或安全通行证。它们可以包含有关授权持有者的信息，用于识别和/或验证目的。\n\n**理解 802.1x。** `802.1x` 是一种基于端口的认证机制。它基于\
  \ `EAP`，通常用于无线网络。然而，`802.1x` 仅用于 `WAPs`；它也可以用于防火墙、网关以及需要切换服务的场所。将 `802.1x` 视为一个认证代理。\n\
  \n## 4.4 给定场景，区分常见的账户管理实践\n\n账户管理是身份验证和授权的一个元素。安全的账户管理包括对各种帐户类型的理解、对广泛概念的掌握以及对账户策略限制的理解。本节讨论这些问题。\n\
  \n#### 账户类型\n\n用户账户类型是与主体访问相关的类型、级别和限制设置的起点。组织应该考虑在网络中使用哪些类型的帐户，以及禁止哪些类型的帐户。\n\n\
  #### 用户账户\n\n用户账户也称为标准帐户、限制帐户、普通帐户甚至常规帐户。用户账户是典型网络中最常见的账户类型，因为每个人都被分配了一个用户账户。用户账户受到限制是因为此类帐户用于常规、正常的日常操作任务。在大多数环境中，禁止用户帐户安装软件或进行重大系统/操作系统更改。\n\
  \n即使是系统管理员也应分配标准用户账户用于大部分的工作活动。强大的管理员帐户应保留在绝对必要时使用。\n\n#### 共享和通用帐户\n\n在任何情况下，标准工作环境都不应实施共享账户。如果几个人使用一个共享账户，就无法区分一个人和另一个人的操作。共享账户应仅用于公共系统（如自助终端）或匿名连接（也应该避免避免）。\n\
  \n`通用帐户禁止` 是一条规则，即在私有网络或任何对安全的系统中都不应允许通用、共享或匿名帐户。只有当每个主体都有唯一的帐户时，才可能跟踪个人的活动，并对其行为以及任何违反公司政策或法律的行为承担责任。\n\
  \n通用凭据可以指共享帐户的共享凭据，也可以指内置帐户的默认凭据。这两种形式的通用凭据都不是安全的，都应该被避免。所有原生和/或默认帐户都应分配复杂的密码。\n\
  \n#### 客客帐户\n\n\n\n\n访客账户有两种形式。一种方案是使用所有访问者共用的共享组访客账户。另一种方案是为每个访客创建一个具有有限权限的唯一账户。应避免前者的访客账户概念，因为它无法对个人的行为进行追责。后者的访客账户概念更理想，因为它允许对个人行为进行追责。还可以使用每个用户的唯一访客账户，根据临时访问者或访客的需求和工作要求，定制并针对访问访问和权限。\n\
  \n访客账户并非为每个访问设施的人员提供的；相反，它们应该只发放给那些因有效的合法工作需要访问公司网络的人员。这可能包括顾问、临时工、来自其他地点的访问人员、实习生、调查员和审计师。\n\
  \n## 服务账户\n\n服务账户是用于控制应用程序访问权限和能力的用户账户。通过使用服务账户，可以为应用程序授予与其功能和数据访问需求相关的特定授权。这比将应用程序配置为管理员、`root`\
  \ 或系统运行是一种更安全的解决方案。大多数应用程序和服务不需要完整且全系统级的权限；服务账户允许根据软件的精确需求，对权限、特权和用户权利进行精细的定制。\n\
  \n## 特权账户\n\n管理人员需要两个用户账户：标准账户和管理员或`特权账户`。他们的标准账户应该拥有其他所有典型员工所拥有的普通权限。该账户应用于大多数工作日所包含的琐碎任务。他们的管理账户应配置为仅具有完成分配的管理功能所需的特殊特权。该账户不应能够执行日常工作中的琐碎任务。这种限制迫使用户针对当前任务使用正确的账户。它还限制了特权账户的使用时间，并防止在管理访问成为风险而非收益时使用它，例如当使用管理员账户访问互联网、打开电子邮件或执行常规文件传输或执行时。\n\
  \n对于在组织内拥有多个角色的用户，特别是拥有多个管理角色的用户，每个角色都应该有自己的管理用户账户。这可能意味着员工有一个标准用户账户和两个或多个管理账户。这给员工保持身份验证的独立性带来了额外负担，但它防止了单一账户过于强大。所有特权账户都应该要求多因素身份验证，以提高安全性并防止为账户定义单一的基础密码。\n\
  \n## 通用概念\n\n本节包含了许多账户管理概念的描述，这些概念对于 IT 环境的安全管理至关重要。\n\n### 最小权限\n\n`least privilege`原则是一种安全立场，即仅授予用户完成其工作任务所需的最小访问权限、许可和特权。这确保了用户无法执行其职责范围之外的任何任务。\n\
  \n应该对特权、许可、权利、访问权限等进行定期审查，以检查是否存在权限蔓延（privilege creep）或与工作职责不符的情况。权限蔓延发生在员工随着工作职责的变化随时间推移积累特权的情况下。最终结果是员工拥有的权限超过了最小权限原则根据其当前工作职责所规定的权限。\n\
  \n`Least privilege`是信息安全领域的基石。简单来说，对于用户而言，最小权限原则规定用户应仅被授予执行任务所需的最小权限。\n\n### 入职/离职\n\
  \n`Onboarding`是将新员工添加到身份访问管理（`IAM`）系统的过程。当员工的角色或职位发生时，也会使用入职流程。`Offboarding`是该过程的反相反过程。是在人员离开组织后移除其身份的过程。入职和离职程序应明确记录，以确保应用的一致性以及符合法规要求。\n\
  \n### 权限审核与审查\n\n`Permissions`是授予或拒绝用户的访问活动，通常通过使用每个对象的访问控制列表（`ACLs`）来实现。`ACL`是单个访问控制条（`ACEs`）的集合。自由量访问控制（`DAC`）环境中的每个对象都有一个`ACL`。每个`ACE`关注一个用户账户或一个组，然后授予或拒绝特定对象的权限，例如读取、写入或执行。\n\
  \n\n\n\n权限利用被称为 `privilege abuse`（权限滥用）或 `privilege escalation`（权限提升）。当用户账户能够获得对更高级别权限的未授权访问时，就会发生权限提升，例如一个普通用户账户能够执行管理功能。权限提升可能通过使用黑客工具或环境配置不当而发生。当懒散的管理员在根据新职位描述授予用户新权限时，未能移除旧权限，也可能发生这种情况。权限的累积可以视为权限提升的一种形式。\n\
  \n对访问和权限进行审计和审查应用于监控和跟踪权限的分配以及未经授权的权限提升，还应包括权限的使用。了解用户在做什么以及操作的频率，可能协助管理员分配和管理权限。\n\
  \n## 使用审计与审查\n\n安全工作的一部分是让用户对其行为负责。只有当每个用户都拥有唯一的标识账户时，才能实现。因此，共享账户或组账户不足以提供问责机制。每个用户都应被提供强身份验证凭据以防止账户被接管。每个账户都需要有明确定义的访问控制和授权限制。最后，所有用户活动都应记录在审计或日志机制中。通过落实这些要素，你可以进行`user\
  \ auditing and review`，以确定用户是否在恰当执行其工作任务，或者是否存在违反公司政策或法律的失败和/成功的尝试。\n\n## 时段限制\n\
  \n时段限制是一种访问控制概念，限制用户账户只能在每周的特定日期和日期登录系统或网络。例如，一名全职员工可能只能在周一至周五的上午 7 点到下午 6 点之间登录工作网络。虽然这对防止员工加班或累积加班时间可能有一定影响，但其主要目的是防止账户在通常不应使用的晚上和周末期间被滥用。这是一种工具和技术，用于将敏感环境的访问限制在正常业务时间内，在此时可以进行监督和监控，以防止欺诈、滥用或入侵。\n\
  \n## 重新认证\n\n重新认证（Recertification）可以指多种重要的安全管理概念。\n\n重新认证可能意味着根据用户账户的权限和权利，对员工的工作职责进行定期评估。重新认证是确保遵循最小权限原则的手段。\n\
  \n重新认证与正式认证程序有关，例如建立某主题的知识和/或技能证明，并可能与许可或运行批准的分配、撤销或扩展有关。\n\n“重新认证”一词也可以指评估组织对法规、标准及其自身书面安全策略合规性的行为。\n\
  \n最后，重新认证可以引用对 IT 基础设施账户管理和权限分配机制的评估，以确保它们继续提供足够的身份验证和授权安全性。\n\n## 标准命名规范\n\n某些组织采用了`standard\
  \ naming convention` 来控制系统、共享、用户账户名和电子邮件地址名称。此类系统可以使创建新名称更加简单直接，反过来也让恢复忘记的名称变得简单。然而，如果外部人员发现了正在使用的命名规范，也会让他们很容易预测名称。尽管对象和用户的名称不像密码、PII\
  \ 和公司知识产权那样敏感，但采用标准命名规范可以被视为一种精简化努力，旨在防止或减少某些用户自行选择的存疑或冒犯性名称。\n\n## 账户维护\n\n`Account\
  \ maintenance`是对 IT 环境的用户账户进行定期或周期性审查和评估。任何不再需要的账户都应被禁用，例如以前员工使用的账户或与已卸载的服务相关的账户。一旦由于任何安全审计考虑而被禁用合理一段时间（对于某些公司来说可能是\
  \ 2 周，而另一些公司可能需要 6 个月），应删除该账户。请记住，一旦账户被删除，所有与该账户相关的审计记录现在将没有用户对象可以指向，因此在任何系统或安全审计中都可能被归类为“杂项”。\n\
  \n账户维护还可能包括持续的密码审计或破解，以便在攻击者之前发现弱密码，让用户更改为更健壮的密码。\n\n账户管理还应根据每位员工的个人职位描述和工作任务职责，审查组成员关系、用户权限、时间限制和资源访问。\n\
  \n## 基于组的访问控制\n\n`Group-based privileges`为组内所有成员集体分配权限或资源访问。基于组的访问控制授予组内每个成员对特定对象的相同级别的访问权限。基于组的权限在许多操作系统中都很常见，包括\
  \ Linux 和 Windows。Linux（以及 Unix）在每个对象上使用基于组的权限。事实上，每个对象都有三种权限：所有者的权限、所有者所属组的权限以及其他用户的权限（称为\
  \ World 或 Everyone）。第二组权限定义了组内所有成员的权限，它与该对象关联，因为所有者是该组的一员。\n\nWindows 使用组管理的方式不同。每个对象都有一个\
  \ `ACL`（访问控制列表）。ACL 可以包含一个或多个访问控制条目（ACE）。每个 ACE 关注单个用户或一个组。如果一个 ACE 关注一个组，则组内所有成员都将被授予（或拒绝）对该对象的相关权限。\n\
  \n在使用组分配的权限时，考虑这样做是否违反了最小权限原则，以及你是否真的希望授予特定组的所有成员对特定对象的相同访问权限很重要。如果不是，你需要更改权限分配。\n\
  \n### 基于位置的策略\n\n用于控制授权的`Location-based policies`根据主体所处的位置来授予或拒绝资源访问。这可能基于网络连接是本地有线、本地无线还是远程。除了逻辑或地理位置外，基于位置的策略还可以根据\
  \ MAC 地址、IP 地址、操作系统版本、补丁级别和/或子网授予或拒绝访问。基于位置的策略应作为标准身份验证过程的补充，而不是替代。\n\n### 账户策略强制\n\
  \n用户名和密码是最常见的身份验证形式（参见图 4.9）。如果提供的密码与系统账户数据库中指定用户的密码匹配，则该用户通过了系统验证。然而，仅仅因为用户名和密码是最常见的身份验证形式，并不意味着它是最安全的。相反，它通常被认为是最不安全的身份验证形式。\n\
  \n![图 4.9 使用用户名和密码的 basic 登录过程](img/c04f009.jpg)\n\n**图 4.9** 使用用户名和密码的 basic 登录过程\n\
  \n\n\n\n\n目前已经开发出许多改进基础用户名/密码组合的方法。首先是以加密形式将密码存储在账户数据库中。通常，这种形式是来自单向哈希函数的哈希值。其次是使用身份验证协议（或机制），防止密码在网络（尤其是互联网）上以易于读取的形式传输。第三是在程序层面通常强制执行强有（复杂）密码。这样做是为了确保系统只允许那些密码破解工具难以发现的密码通过验证。\n\
  \n无论组织采用何种身份验证方式，考虑最佳安全业务实践并建立一套可供遵循的标准操作程序都是至关重要的。一旦建立了账户管理策略，就对其进行强制。只有一贯地应用安全措施，才能获得一致且可靠的结果。\n\
  \n强密码具有以下特征：\n\n*   由大量字符组成（2017 年建议至少 12 个字符，优选为 16 个或更多）\n*   包含至少三种类型的字符（大写字母、小写字母、数字和键盘符号）\n\
  *   定期更改（每 90 天一次）\n*   不包含任何字典词、常用词或缩写词\n*   不包含主体真实姓名、用户名或电子邮件地址的任何部分。\n\n这些特征可以通过\
  \ `account policy enforcement`（账户策略强制执行）来实现。这是操作系统中密码要求特征的集合，通常被称为 `password policy`（密码策略）。\n\
  \n密码应该足够强以抵抗攻击发现，又要足够让人们记住。这有时是一个很难把握的界限。训练用户选择并记忆强短语（passphrases）是改变风险行为的一个重要要素。\n\
  \n持续监控源于通过用户访问审查来确保用户问责的需求。在政府法规和安全合同中，对环境进行持续监控正成为标准元素，以便对安全态和用户对安全策略的合规性提供更全面的概述。有效来说，持续监控要求对所有用户进行同等监控，从用户进入组织的物理或逻辑场所开始一直监控直到他们离开或断开连接，并跟踪任何服务和服务资源上所有类型的活动。这种全面的审计、记录和监控方法增加了捕获与滥用或违规相关证据的可能性。\n\
  \n### 凭据管理\n\n`Credential management`（凭据管理）是一种旨在存储、管理甚至跟踪用户凭据的业务或软件产品。对于必须管理成百上千个用户的企业级网络，有许多凭据管理选项可用。然而，大多数凭据管理解决方案是为终端用户部署设计的。凭据管理产品允许用户将所有的在线（甚至本地）凭据存储在本地或云端的安全数字容器中。此类产品的示例包括\
  \ LastPass、1Password、KeePass 和 Dashlane。通过使用凭据管理器，用户可以为各种账户定义更长、更随机的凭据，而无需承担记忆的负担或写下的问题。\n\
  \n在中央位置存储凭据被称为 `credential management`。鉴于互联网网站和服务的广泛，且每个服务都有其特定的登录要求，使用唯一的用户名和密码可能是一种负担。凭据管理解决方案提供了一种安全存储大量凭据集的方法。这些工具通常使用一组主凭据集（优选多因素认证）在需要时解锁数据集。某些凭据管理选项甚至可以提供自动填充。\n\
  \n### 组策略\n\n`Group policy`（组策略）是管理 Windows 系统的机制。`Group Policy Object (GPO)`（组策略对象）是可以应用于环境的设置集合。在\
  \ GPO 提供的大量设置中，有许多与凭据、密码历史、密码长度和账户锁定设置相关的设置。\n\n### 密码复杂度\n\n`password policy`（密码策略）是组织策略的一部分的一组规则，规定了最小密码长度、最大密码有效期、最小密码有效期、密码历史以及某些密码复杂度。后者的设置\
  \ `password complexity`（密码复杂度）通常强制要求四种类型中至少出现三种，并且不允许用户名、真实姓名或电子邮件地址出现。通常，超过 12\
  \ 个字符的密码被认为是相当安全的，超过 15 个字符的密码被认为是非常安全的。通常，密码的字符越多，字符类型复杂度越高，对密码破解技术的抵抗力就越强。要求定期更改密码（例如每\
  \ 90 天一次）并禁止重用之前的密码（密码历史），可以提高使用密码作为主要身份验证手段的系统的安全性。\n\n密码是臭名名的弱身份验证形式。任何仍然仅依赖密码的环境都比采用更强身份验证形式的组织面临更大的账户被破解风险。每个组织都应该认真考虑将多因素认证作为提高身份验证安全性的手段。\n\
  \n良好的密码是可以精心设计的。然而，如果任由用户自行发挥，大多数用户会回到默认或更简单的行为。用户——即使他们接受过选择强、长且易于记住的密码的训练——将密码写下来、被社交工程师欺骗或在其他环境中重用密码的情况也并不罕见。\n\
  \n糟糕的密码行为还包括：\n\n*   重用旧密码或之前的密码\n*   与同事、朋友或家人共享密码\n*   使用非加密的密码存储工具\n*   允许在非加密协议上使用密码\n\
  *   未能检查硬件键盘记录器、摄像头或窥视的旁观者\n\n这些大多数糟糕的密码行为可以通过安全策略、技术限制和用户培训来解决。\n\n#### 过期\n\n\n\
  \n\n\n多年来，一种常见的做法是密码在特定时间后自动过期，以强制用户更改密码。密码保持不变的时间可以根据风险和威胁水平而异。然而，关于密码 `expiration`（过期）的一种常见传统规则是每\
  \ 90 天更改一次密码。这在 Security+ 考试中可能仍被认为是“正确”的答案，但由于密码年龄过久而需要更改的观点现在被认为是无效的（参见随附的侧边栏）。只有在满足以下情况下，才需要更改密码：\n\
  \n*   不符合公司密码策略\n*   明显不安全\n*   被重复使用\n*   由于系统入侵而可能已泄露\n\n否则，一个强效的（长且复杂的）密码可以保持不变。\n\
  \n### 恢复\n\n`Password recovery`（密码找回）通常是一个糟糕的安全解决方案。当忘记密码时，应该直接更改密码。恢复和/或显示密码的能力要求密码存储机制是可逆的，或者密码以多种方式存储。一种更安全的选择是要求更改密码而不是恢复密码。\n\
  \n大多数系统已经转向密码替换，放弃了真正的密码恢复。然而，密码替换并不一定是一个安全的过程。组织通常有一个安全选项，要求员工亲自前往账户管理员办公室，出示照片身份证，以便更改或重置账户密码。然而，网站通常使用两种糟糕的密码重置选项之一。如果你忘记了某个网站的密码，它通常会提供一个“我忘记了密码”的链接。然后系统会提示你提供与账户相关的电子邮件地址，或回答几个安全或身份验证问题。\n\
  \n如果密码发送到了你的电子邮件地址，而你恰好认出那是你忘记的密码，你就知道该网络服务是以明文形式存储密码的。如果他们以安全的方式存储密码，即使只是简单的 `hash`（哈希），他们也无法立即向你发送现有的实际密码。你希望在恢复邮件中看到的是一个新的、理想情况下是随机的密码。但由于电子邮件本身是一个明文通信系统，你需要尽快使用新密码登录账户，并立即将密码更改为新的内容。\n\
  \n如果你被要求回答几个安全问题，那么你需要知道从某些数据库源、你的购买历史或信用记录中请求的你的事实，或者回答你在最初设置账户时被问或选择的问题答案。遗憾的是，这些问题往往非常平庸，并且在各个网站之间是标准化的。例如，许多网站询问你最喜欢的度假地、最喜欢的食物、最喜欢的音乐、最喜欢的电影、三年级老师的名字、第一只宠物的名字、第一辆汽车的品牌和型号、第一份工作、高中吉祥物，或你婚礼上的伴郎/伴娘。这些常见问题通常是许多其他人也知道你的信息，特别是朋友、家人和某些敌人。在设置安全问题答案时，可以考虑向用户建议实施混淆技术，使输入的答案不那么明显。一些选项包括反向拼写正确答案；回答问题的相反答案；或者在每个答案中添加填充陈述，例如\
  \ `ABC123`。尽管没有任何混淆技术是万无一失的，一旦答案数据库被泄露，任何技术都会被破解，但它至少可以为防止那些试图通过密码恢复漏洞冒充你的人提供一些额外的保护。\n\
  \n### 禁用\n\n`Disablement`（禁用）或 `account expiration`（账户过期）是一项在特定期间禁用账户的功能。这通常用于防止临时工未经授权的访问。\n\
  \n### 锁定\n\n`Account lockout`（账户锁定）在有人多次登录失败时会自动禁用账户。被锁定的账户可能一直处于禁用状态，直到管理员干预。\n\
  \n### 密码历史\n\n`Password history`（密码历史）是一项跟踪以前密码的功能以防止重复使用。为了使密码历史生效，它通常必须与最小密码结合使用。\n\
  \n### 密码重复使用\n\n`Password reuse`（密码重复使用）发生在用户尝试在同一系统中使用他们之前用过的密码时。密码历史的管理防止了密码重复使用。\n\
  \n### 密码长度\n\n`Password length`（密码长度）结合复杂度是决定密码强度的重要因素。通常密码越长越好。7 个字符或少的密码可能在几小时内被破解。8\
  \ 到 9 个字符的密码可能在几天或几周内被破解。10 个或更多字符的密码不太可能破解。\n\n## 考试要点\n\n**了解共享账户。** 在任何情况下，标准工作环境都不应实施共享账户。如果多个人都使用共享账户，就无法区分一个人的行为和另一个人的行为。\n\
  \n\n\n\n\n# 理解账户维护。\n账户维护是对 IT 环境中的用户账户进行定期或周期性审阅和评估的活动。\n\n## 理解基于组的访问控制。\n基于组的访问控制授予组内每个成员对特定对象具有同等层级的访问权限。\n\
  \n## 理解基于位置的策略。\n基于位置的授权控制策略根据主体所在地来授予或拒绝对资源的访问。\n\n## 了解凭证管理。\n凭证管理是一种旨在存储、管理、甚至跟踪用户凭证的业务或软件产品。\n\
  \n## 理解组策略。\n`Group Policy`（组策略）是 Windows 网络域环境中管理 Windows 系统的机制。`Group Policy Object\
  \ (GPO)`（组策略对象）注册表设置集合，可以在系统启动时或用户登录时应用到系统。\n\n## 理解密码管理。\n密码管理是用于在大型网络环境中管理密码的系统。它通常要求用户创建复杂密码。它还处理了复杂性、过期、恢复、账户禁用、锁定、历史记录、重复使用和长度等问题。\n\
  \n## 复习题\n\n你可以在附录中找到答案。\n\n1. 哪种访问控制方法最适合员工离职率高的环境？\n    1. MAC\n    2. DAC\n \
  \   3. RBAC\n    4. ACL\n\n2. 使用哪种机制来支持系统、服务和设备之间交换验证和授权详情？\n    1. 生物识别\n    2.\
  \ 双因子认证\n    3. SAML\n    4. LDAP\n\n3. 哪种是强度最大的密码？\n    1. 超过八个字符\n    2. 一次性\n\
  \    3. 静态\n    4. 不同类型的键盘字符\n\n4. 下列哪种技术可以用于基于目录服务的网络与远程客户端之间增加额外的保护层？\n    1.\
  \ SMTP\n    2. RADIUS\n    3. PGP\n    4. VLAN\n\n5. 下列哪不是单点登录的好处？\n    1. 浏览多个系统的能力\n\
  \    2. 需要记忆的用户名和密码更少\n    3. 更细粒度的访问控制\n    4. 更强的密码\n\n6. 联邦（Federation）是实现 \\\
  _\\_\\_\\_\\_\\_\\_ 的手段。\n    1. 责任日志记录\n    2. ACL 验证\n    3. 单点登录\n    4. 可信 OS\
  \ 加固\n\n7. 你被指派为公司商店的零售区域安装新的自助终端（kiosk systems）。公司选择使用标准设备和开源 Linux 操作系统。你担心所有人都会知道\
  \ root 账户的默认密码。应该调整自助机的哪个方面以防止未经授权的实体进行系统更改？\n    1. 授权 (Authorization)\n    2.\
  \ 计 (Accounting)\n    3. 身份验证 (Authentication)\n    4. 审计 (Auditing)\n\n8. 你的公司有几个班次的工人。由于数据性质和合同要求，禁止加班和换班。为了确保工人仅在分配的班次期间登录\
  \ IT 系统，你应该实施哪种类型的控制？\n    1. 多因子认证\n    2. 时段限制\n    3. 位置限制\n    4. 单点登录\n\n9.\
  \ 将以下步骤（用字母 A 到 I 表示）按正确排序：\n    1. `KDC` 验证客户端是否拥有有效的 `TGT` 并向客户端颁发 `ST`。`ST` 包含一个指示其有效生存的时间戳。\n\
  \    2. 客户端接收到 `TGT`。此时，主体是 `Kerberos` 域中经过验证的主体。\n    3. 客户端将 `ST` 发送到托管所需资源的网络服务器。\n\
  \    4. `Kerberos` 客户端系统加密密码并将受保护的凭证发送到 `KDC`。\n    5. 主体请求访问网络服务器上的资源。这导致客户端请求资源。\n\
  \    6. 主体提供凭据。\n    7. 网络服务器验证 `ST`。从这里开始，`Kerberos` 不再参与。\n    8. `KDC` 验证凭据并创建服务票据\
  \ (`ST`)。`ST` 包含一个指示其有效生存的时间戳。\n    9. 客户端接收到 `TGT`。此时，主体是 `Kerberos` 域中经过验证的主体。\n\
  \    （注：原文步骤 7-9 存在逻辑重复或错乱，已按原文翻译）\n\n10. 你的公司最近购买了思网络设备。哪种 AAA 服务可用？\n    1. RADIUS\n\
  \    2. X.500\n    3. TACACS+\n    4. X.509\n\n11. 你的最近决定允许一些员工每周在家工作。在配置允许远程访问时，你意识到这带来的风险。可以实施哪种机制？\n\
  \    1. Kerberos\n    2. 单点登录\n    3. 更强的授权\n    4. RADIUS\n\n12. 你正在开发一种控制灯具的智能应用。为了让设备变得尽可能简单，你应该集成哪种技术？\n\
  \    1. OpenID Connect\n    2. Shibboleth\n    3. 安全令牌\n    4. 基于角色的访问控制\n\n13.\
  \ 权限是如何计算的？\n    1. 计算允许的数量减去拒绝的数量\n    2. 累加允许\n    3. 查看用户的许可级别\n    4. 计算用户所属的组数量\n\
