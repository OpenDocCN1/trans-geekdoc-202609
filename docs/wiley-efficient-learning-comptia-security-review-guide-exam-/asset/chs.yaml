  \n1. `D. 年化损失期望 (ALE) 代表了公司因特定资产风险而在单年内可能经历的总潜在损失。`\n\n2. `D. 谅解备录 (MOU) 是两个实体之间协议或一致意图、意愿或目的的表达。`\n\
