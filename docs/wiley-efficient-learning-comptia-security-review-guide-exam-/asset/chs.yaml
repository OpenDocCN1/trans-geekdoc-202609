  \ |\n\n# 第一章：威胁、攻击与漏洞\n\n本章涵盖的 COMPTIA SECURITY+ 考试目标包括：\n\n### 1.1 根据给定的场景，分析入侵指标并确定恶意软件类型。\n\
  \n* 病毒 (Viruses)\n* 加密恶意软件 (Crypto-malware)\n* 勒索软件 (Ransomware)\n* 蠕虫 (Worm)\n\
  * 木马 (Trojan)\n* 根根包 (Rootkit)\n* 键盘记录器 (Keylogger)\n* 广告软件 (Adware)\n* 间谍软件 (Spyware)\n\
  * 机器人 (Bots)\n* `RAT`\n* 逻辑炸弹 (Logic bomb)\n* 后门 (Backdoor)\n\n### 1.2 比较并对比不同类型的攻击。\n\
  \n* **社会工程学** (**Social engineering**)\n    * 钓鱼攻击 (Phishing)\n    * 针对性钓鱼 (Spear\
  \ phishing)\n    * 捕鲸鱼攻击 (Whaling)\n    * 语音钓鱼 (Vishing)\n    * 尾随 (Tailgating)\n\
  \    * 冒充 (Impersonation)\n    * 翻找垃圾 (Dumpster diving)\n    * 窥视屏幕 (Shoulder surfing)\n\
  \    * 骗局 (Hoax)\n    * 水坑攻击 (Watering hole attack)\n    * 原理（有效性原因）\n        *\
  \ 权威性 (Authority)\n        * 威慑性 (Intimidation)\n        * 认同 (Consensus)\n    \
  \    * 稀缺性 (Scarcity)\n        * 熟悉 (Familiarity)\n        * 信任 (Trust)\n      \
  \  * 紧急性 (Urgency)\n\n* **应用/服务攻击** (**Application/service attacks**)\n    * 拒绝服务\
  \ (DoS)\n    * 分式拒绝服务 (DDoS)\n    * 中人攻击 (Man-in-the-middle)\n    * 缓冲区溢出 (Buffer\
  \ overflow)\n    * 注入 (Injection)\n    * 跨站脚本 (Cross-site scripting)\n    * 跨站请求伪造\
  \ (Cross-site request forgery)\n    * 权限提升 (Privilege escalation)\n    * ARP 污染\
  \ (ARP poisoning)\n    * 放大攻击 (Amplification)\n    * DNS 投毒 (DNS poisoning)\n  \
  \  * 域名劫持 (Domain hijacking)\n    * 浏览器中间人 (Man-in-the-browser)\n    * 零日攻击 (Zero\
  \ day)\n    * 重放攻击 (Replay)\n    * 传递哈希值 (Pass the hash)\n    * 劫持及相关攻击\n      \
  \  * 点击劫持 (Clickjacking)\n        * 会话劫持 (Session hijacking)\n        * URL 劫持 (URL\
  \ hijacking)\n        * 拼写域名攻击 (Typo squatting)\n    * 驱动程序操控 (Driver manipulation)\n\
  \        * 填充 (Shimming)\n        * 重构 (Refactoring)\n    * MAC 伪造 (MAC spoofing)\n\
  \    * IP 伪造 (IP spoofing)\n\n* **无线攻击** (**Wireless attacks**)\n    * 重放攻击 (Replay)\n\
  \    * 初始向量 (IV)\n    * 恶意孪生 (Evil twin)\n    * 伪接入点 (Rogue AP)\n    * 干扰攻击 (Jamming)\n\
  \    * `WPS`\n    * 蓝牙攻击 (Bluejacking)\n    * 蓝牙窃取 (Bluesnarf)\n    * `RFID`\n \
  \   * 近场通信 (NFC)\n    * 断开连接 (Disassociation)\n\n* **加密攻击** (**Cryptographic attacks**)\n\
  \    * 生日攻击 (Birthday)\n    * 已知明文/密文 (Known plain text/cipher text)\n    * 彩虹表攻击\
  \ (Rainbow tables)\n    * 字典攻击 (Dictionary)\n    * 暴力破解 (Brute force)\n        *\
  \ 在线与离线 (Online vs. offline)\n    * 碰撞攻击 (Collision)\n    * 降级攻击 (Downgrade)\n \
  \   * 重放攻击 (Replay)\n    * 弱实现 (Weak implementations)\n\n### 1.3 解释威胁者类型及其属性。\n\n\
  * **威胁者类型** (**Types of actors**)\n    * 脚本小子 (Script kiddies)\n    * 黑客 (Hacktivist)\n\
  \    * 有组织犯罪 (Organized crime)\n    * 国家级力量/APT (Nation states/APT)\n    * 内部人员\
  \ (Insiders)\n    * 竞争对手 (Competitors)\n* **威胁者属性** (**Attributes of actors**)\n\
  \    * 内部/外部 (Internal/external)\n    * 复杂程度 (Level of sophistication)\n    * 资源/资金\
  \ (Resources/funding)\n    * 意图/动机 (Intent/motivation)\n    * 开源情报的使用 (Use of open-source\
  \ intelligence)\n\n### 1.4 解释渗透测试概念。\n\n* 主动侦察 (Active reconnaissance)\n* 被动侦察 (Passive\
  \ reconnaissance)\n* 渗透 (Pivot)\n* 初始利用 (Initial exploitation)\n* 持久化 (Persistence)\n\
  * 权限提升 (Escalation of privilege)\n* 黑盒 (Black box)\n* 白盒 (White box)\n* 灰盒 (Gray\
  \ box)\n* 渗透测试与漏洞扫描的区别 (Pen testing vs. vulnerability scanning)\n\n## 1.5 解释漏洞扫描概念。\n\
  \n* 被动测试安全控制 (Passively test security controls)\n* 识别漏洞 (Identify vulnerability)\n\
  * 识别缺失的安全控制 (Identify lack of security controls)\n* 识别常见配置错误 (Identify common misconfigurations)\n\
  * 侵入式与非侵入 (Intrusive vs. non-intrusive)\n* 有凭据与无凭据 (Credential vs. non-credentialed)\n\
  * 误报 (False positive)\n\n### 1.6 解释与漏洞类型的影响。\n\n* 竞态条件 (Race conditions)\n* 由以下引起的漏洞：\n\
  \    * 结束系统 (End-of-life systems)\n    * 嵌入式系统 (Embedded systems)\n    * 缺乏厂商支持\
  \ (Lack of vendor support)\n* 输入处理不当 (Improper input handling)\n* 错误处理不当 (Improper\
  \ error handling)\n* 配置错误/弱配置 (Misconfiguration/weak configuration)\n* 默认配置 (Default\
  \ configuration)\n* 资源耗尽 (Resource exhaustion)\n* 用户缺乏培训 (Untrained users)\n* 账户配置不当\
  \ (Improperly configured accounts)\n* 业务流程漏洞 (Vulnerable business processes)\n*\
  \ 弱加密套件和实现 (Weak cipher suites and implementations)\n\n\n\n\n\n- 内存/缓冲区漏洞\n    -\
  \ 内存泄漏\n    - 整数溢出\n    - 缓冲区溢出\n    - 指针解引用\n    - DLL 注入\n- 系统蔓延/未记录资产\n- 架构/设计缺陷\n\
  - 新威胁/零日攻击\n- 不当的证书和密钥管理\n\n![images](img/clogo.jpg)\n\nSecurity+ 考试将测试你对 IT 攻击和攻破的知识。个人和组织必须理解广泛的黑客攻击和攻破手段，以防御停机和入侵。为了通过测试并有效减少损失和伤害，你需要理解本章详细介绍的威胁、攻击、漏洞、概念和术语。\n\
  \n## 1.1 给定一个场景，分析入侵指标并确定恶意软件的类型。\n\n`Malware`（恶意软件）或 `malicious code`（恶意代码）是指从计算机系统合法用户或所有者的角度来看执行意外功能的任何软件元素。这一客观主题侧重于根据给定的场景、症状列表或对感染或入侵的通用描述来识别特定类型恶意软件的能力。恶意代码包含了广泛的概念，包括病毒、勒索软件、蠕虫、木马、根基程序、键盘记录器、广告软件、间谍软件、机器人、RAT（远程访问木马）、逻辑炸弹和后门。以下是各类的概述。\n\
  \n### 病毒\n\n病毒只是恶意代码、恶意软件或恶意程序的一个示例。`Viruses`（病毒）的名字源于它们的生物学对应物。它们是被设计通过自我复制从一个系统传播到另一个系统，并执行各种恶意活动的程序。病毒执行的恶意活动包括数据删除、损坏、篡改和外泄。某些病毒的复制和传播速度极快，以至于消耗大部分可用系统和网络资源，从而执行一种拒绝服务攻击（`DoS`，在本章稍后部分讨论）。\n\
  \n大多数病毒需要一个宿主来依附。宿主可以是一个文件（如 `common viruses` 所示），也可以是存储设备的引导区。附加到存储设备（包括 HDD、SSD、CD/DVD-ROM、蓝光光盘和\
  \ USB）引导区，并从而在驱动器激活时加载到内存中的病毒被称为 `boot sector viruses`（引导区病毒）。\n\n在这些类别中，某些特定的病毒类型包括：\n\
  \n- `Polymorphic viruses`（多态病毒）：`Polymorphic viruses` 能够使用加密掩盖自己的代码，以避免被防病毒扫描器检测。\n\
  - `Macro viruses`（宏病毒）：`Macro viruses` 存在于文档或电子邮件中，并利用效率软件的脚本能力。\n- `Stealth viruses`（隐身病毒）：`Stealth\
  \ viruses` 试图通过掩盖或隐藏其活动来避免检测。\n- `Armored viruses`（加壳病毒）：`Armored viruses` 是任何经过设计以避免检测并增加移除难度的恶意软件。这可能涉及复杂的编译技术、过于复杂的编码逻辑以及内存的异常使用。\n\
  - `Retroviruses`（逆转病毒）：`Retroviruses` 专门针对防病毒系统，使其失效。\n- `Phage viruses`（噬菌病毒）：`Phage\
  \ viruses` 修改或感染系统的许多方面，以便它们能够从任何剩余的未清除部分重新生成自身。\n- `Companion viruses`（伴生病毒）：`companion\
  \ virus` 借用常用可执行文件的根文件名，然后赋予自己 `.com` 扩展名，试图尝试启动自己而不是预定的应用程序。\n- `Multipart or multipartite\
  \ viruses`（多部分或多复合病毒）：`Multipart` 或 `multipartite viruses` 执行多个任务，并可能以多种方式感染系统。\n\
  \n对抗病毒的最佳技术是定期更新的防病毒或反恶意软件扫描器，它会监控所有本地存储设备、内存和通信通道的病毒活动。然而，将修改用户行为以规避风险活动作为安全策略的核心组成部分是非常关重要的。否则，在没有人为降低风险的情况下，任何技术保护都是不充分的。减少或避免风险的活动示例包括避免从非供应商源下载软件、不打开邮件附件以及避免使用来自其他环境的可移动介质。\n\
  \n如果系统感染了病毒，一些潜在症状包括数据文件损坏或丢失、应用程序不再执行、系统运行缓慢、鼠标点击与系统响应之间的延迟、应用程序或系统崩溃、硬盘持续活动以及系统对鼠标移动或击键无响应的倾向。这些症状中的任何都可能伴随病毒感染；但它们也可以其他恶意软件感染的症状。\n\
  \n### 加密恶意软件\n\n`Crypto-malware`（加密恶意软件）是任何将加密作为武器或防御的恶意软件。加密作为武器见于勒索软件等恶意软件，而加密作为防御则见于多态病毒和加壳病毒等恶意软件。\n\
  \n加密恶意软件的另一种潜在形式是寻找加密存储设备的加密密钥，然后将这些密钥披露给远程攻击者。此类恶意软件的目标或目的是授予攻击者访问原本受保护内容的权限。\n\
  \n加密恶意软件感染的症状包括无法访问数据、数据丢失、系统无法启动、系统运行缓慢（在加密过程中）以及要求支付费用以解密数据的弹出窗口。\n\n### 勒索软件\n\
  \n`Ransomware`（勒索软件）是一种接管计算机系统的恶意软件，通常通过加密用户数据来阻碍其使用并要求付款。有效而言之，它是一种将用户数据作为人质，以换取赎金支付的恶意软件。通常，勒索软件背后的盗贼要求使用不可追踪的资金卡进行支付，例如\
  \ MoneyPak Green Dot 卡，或者使用比特币（一种旨在不可追踪的数字货币形式）支付。\n\n对抗勒索软件的防御措施包括规避风险行为、运行反恶意软件以及维护你数据的可靠备份。除非你绝对没有其他方法重新获得你的数据，否则请避免支付赎金。向攻击者支付赎金只会鼓励他们继续犯罪活动。\n\
  \n勒索软件感染的症状包括无法访问数据、数据丢失、系统无法启动、系统运行缓慢（在加密过程中）以及要求支付费用以解密数据的弹出窗口。\n\n### 蠕虫\n\n\
  另一种与病毒密切相关的恶意软件形式是蠕虫。`Worms`（蠕虫）是自包含的应用程序，不需要宿主文件或硬盘即可感染。蠕虫通常关注复制和传播，而不是直接的损害和破坏。蠕虫设计用于利用系统（操作系统、协议、服务或应用程序）的特定漏洞，然后利用该漏洞扩散到具有相同漏洞的其他系统。它们可能被用于投放病毒、逻辑炸弹、勒索软件、后门以及僵尸网络的僵尸/代理/机器人，或者它们也可以执行直接的病毒式混乱活动。\n\
  \n蠕虫的防御措施与病毒相同，额外增加了保持系统补丁。\n\n蠕虫感染可能表现出的症状包括系统响应缓慢、应用程序不再执行、存储设备空间不足、CPU 和内存利用率达到\
  \ 100%、系统崩溃以及异常的网络活动。\n\n### 木马\n\n\n\n\n\n`Trojan horse`（特洛伊木）是一种伪装成有用或合法软件的恶意软件。常见的木马形式是游戏和屏幕保护程序，但任何软件都可以被制成木马。木马的目标是欺骗用户在他们的计算机上安装它。这使得木马的恶意代码部分能够访问原本受保护的环境。`Trojan`通过将一个看似无害的主文件与恶意载荷结合而形成。它是技术滥用与社会工程学的结合。受害者被欺骗在他们的系统上接受木马，因为他们认为自己获得的只是显而易见的无害主机。然而，当主机文件被使用时，恶意载荷就会释放并感染系统。最常见的木马是一些工具，用于向系统安装分布式拒绝服务（`DDoS`）、僵尸网络代理或远程控制后门。\n\
  \n特洛伊马的防御措施与病毒相同。\n\n涉及通过木马投送恶意软件导致系统被感染的场景，可能会引发其他恶意软件感染中提到的任何症状（见前文和后文的恶意软件概念），因为木马可以用于传递任何类型的恶意代码。此外，木马在触发或启动并传递恶意载荷时，可能会立即导致系统变慢或无响应。\n\
  \n### Rootkit\n`rootkit`是一种特殊的黑客工具，它深层嵌入在操作系统（OS）中。rootkit 将自己位于操作系统的核心，在那里它可以操纵操作系统看到的信息。rootkit\
  \ 通常会替换操作系统内核、在内核下方垫层（shim）、替换设备驱动或渗透应用程序库，以便无论它向操作系统提供或隐藏什么信息，操作系统都会认为这些是正常且可接受的。这使得\
  \ rootkit 能够躲避检测，防止文件管理工具查看其文件，并防止任务管理或进程管理工具查看其活动进程。因此，rootkit 是一种“隐形盾牌”。rootkit\
  \ 可以用于隐藏其他恶意工具和/或执行其他功能。rootkit 或被 rootkit 隐藏的其他工具可以捕捉击键、窃取凭据、监控 URL、截屏、通过麦克风录音、跟踪应用程序使用情况，或为远程黑客授予对受损目标系统的后门访问权限或远程控制权。\n\
  \n在 rootkit 感染系统后，该系统就再也无法被信任或被认为是安全的。有些 rootkit 仍然无法被检测到和/或无法被有效删除。因此，任何被 rootkit\
  \ 入侵的系统都永远无法再次完全被信任。用一个愚蠢的比喻来说：如果你正在与一支隐形军队战斗，你如何确保你击败了所有的士兵？\n\n有几种 rootkit 检测工具，其中一些能够移除某些\
  \ rootkit。然而，一旦你怀疑系统上存在 rootkit，唯一真正安全的响应是重构或替换整个计算机。`Reconstitution`（重构）涉及对该系统上的所有存储设备执行低级格式化操作，从受信任的原始源重新安装操作系统和所有应用程序，然后从受信任的无\
  \ rootkit 的备份中恢复文件。显然，防止 rootkit 的最佳方法是防御而非响应。\n\nrootkit 感染通常没有与其相关的明显症状或受损的迹象。rootkit\
  \ 作者通常极力减少任何可能指示系统已被入侵的明显活动。在初始安装 rootkit 后的几刻钟，由于 rootkit 正在安装自身，可能会出现一些系统迟钝和无响应，但除此之外，它会积极掩盖任何症状。\n\
  \n### Keylogger\n`keylogger`（键盘记录器）是一种记录在系统键盘上输入的击键的恶意软件形式。软件键盘记录器通常能够记录来自物理键盘和屏幕键盘的输入。捕捉到的击键随后会被上传到攻击者处进行分析和利用。\n\
  \n许多反病毒扫描器都包含了键盘记录器的签名；然而，可能还需要一个潜在不良程序（`PUP`）扫描器，如`Malwarebytes`，来检测此类滥用软件。\n\n\
  硬件键盘记录器是连接到键盘上的物理设备。硬件键盘记录器无法通过软件检测，因此需要物理检查。有些键盘记录器可以通过 Wi-Fi、蓝牙或蜂窝网络上传捕捉的内容，而另一些需要物理提取。\n\
  \n键盘记录器感染可能会表现为响应迟钝、需要按两次键才能识别，并导致系统整体性能下降。\n\n### Adware\n`Adware`（广告软件）是间谍软件（后文讨论）的一种变体。广告软件根据用户的活动、访问的\
  \ URL、使用的应用程序等向用户显示弹出广告。广告软件用于向潜在客户定制广告。遗憾的是，大多数广告软件在用户不知情或未同意的情况下到达客户端系统。因此，合法的商业产品被认为是侵入性和滥用的。\n\
  \n某些形式的广告软件提供虚假安全产品的报价。它们通常显示看起来系统正在扫描的动画，甚至可能搜索恶意代码或入侵事件。然后广告软件会显示发现了问题，解决方案是下载“免费”程序来移除或解决问题。这种类型的恶意软件被称为恐吓软件。\n\
  \n广告软件的防御措施与间谍软件和病毒相同——带有特定的间谍软件/广告软件扫描工具。\n\n广告软件受损的迹象可能包括在网络浏览器未运行时仍弹出广告、系统响应迟缓以及鼠标响应不佳（尤其是点击链接时）。\n\
  \n### Spyware\n`Spyware`（间谍软件）是任何在用户直接不知情或未经许可收集信息的恶意代码或商业代码。当间谍软件试图获取信息以进行身份盗窃或凭据劫持时，它是完全恶意的。然而，许多广告公司使用恶意性较小的间谍软件来收集潜在客户的数据。无论哪种，用户通常不知道间谍软件的存在及其正在收集定期传输到外部实体的信息。间谍软件可以收集击键、启动的应用程序名称、本地文件、发送和接收的电子邮件和即时消息（IM）以及访问的\
  \ URL；它还可以通过麦克风录音，甚至通过摄像头录制视频。间谍软件可以由病毒、蠕虫或木马投放，也可以作为商业、免费或共享软件应用程序的额外元素被安装。\n\n\
  间谍软件的防御措施与病毒相同，并增加了特定的间谍软件扫描工具。\n\n间谍软件感染可能会导致明显的症状，如系统性能缓慢、键盘和鼠标响应不佳、出现未知文件以及可用存储空间迅速减少。\n\
  \n### Bots\n\n\n\n\n\n`botnet` 一词是 `robot network`（机器人网络）的缩写。它用于描述在大量受感染系统上部署的恶意代码，这些系统都由黑客进行远程控制。僵尸网络是传统\
  \ DoS 攻击演变的产物，形成被称为`分布式拒绝服务 (DDoS) 攻击`的概念。当黑客在许多次要受害者上部署了远程控制的代理、僵尸或机器人，然后将这些部署的机器人作为一个整体来攻击主要目标时，就发生了\
  \ DDoS 攻击。（在本章稍后的详细章节中，我们将审回顾特定的攻击类型。）\n\n僵尸网络由黑客直接或间接控制。有时黑客被称为 `bot herder`（僵尸饲养者）、`master`（主控），甚至是\
  \ `handler`（处理程序）。直接控制僵尸网络是指僵尸饲养者向每个机器人发送命令。因此，机器人在开放的端口上有一个监听服务，等待来自僵尸饲养者的通信。僵尸网络的间接控制可以通过任何中间通信系统实现，包括互联网即时聊天（IRC）、即时消息（IM）、文件传输协议（FTP）、电子邮件、网络、博客、Facebook、Twitter\
  \ 等。当使用间接控制时，机器人会访问中间通信服务以获取来自僵尸饲养者的消息。中间通信服务通常被称为“命令与控制中心”（C2），但它并不是复杂的控制界面，而是攻击者与机器人之间交换信息的连接点。\n\
  \n僵尸网络之所以成为是因为世界上大多数计算机都可以访问互联网，而且其中许多计算机的安全性很低。僵尸网络创建者编写僵尸网络代码，利用共同漏洞来广泛传播僵尸网络代理——通常使用与病毒、蠕虫和木马相同的技术。僵尸网络通常包含数千（甚至数十万）受感染的次要受害者。次要受害者是僵尸网络代理的主机，除了最初的入侵和僵尸代理种植外，它们不会受到影响或损坏。黑客希望次要受害者保持功能完全，这样当他们针对主要目标发起僵尸网络攻击时，就可以利用所有次要受害者的资源攻击主要目标。\n\
  \n僵尸网络可执行任何类型的恶意活动。尽管它们通常用于执行 DoS 洪水攻击，但僵尸网络也可用于发送垃圾邮件、执行大规模分布式并行处理以破解密码或加密密钥、执行钓鱼攻击、捕获数据包或执行任何可以想象的活动。\n\
  \n防御僵尸网络的最佳方法是保持系统补丁和加固，不要成为僵尸网络代理的主机（换句话说，不要成为次要受害者）。严格的出口防火墙规则、源地址过滤以及统一威胁管理（UTM）设备上的网络内容过滤也是有效的反措施。此外，大多数杀病毒软件和反间谍软件工具的检测数据库中包含了常见的僵尸网络代理。\n\
  \n如果你是僵尸网络洪水攻击的主要受害者，你几乎无能为之停止攻击。你的响应通常限于断开网络连接、联系你的 ISP 以及向执法部门报案。有几种 DDoS 过滤服务，范围从免费服务到昂贵的企业级服务不等。\n\
  \n僵尸网络感染的迹象可能包括系统性能缓慢、CPU 和内存利用率高、异常网络流量过高、存储设备上出现奇怪的文件、运行未知进程以及桌面上出现奇怪的程序窗口。\n\n\
  ### RAT\n\n远程访问客户端 `RAT` 是一种恶意代码形式，允许攻击者访问系统。一旦在系统上激活，该工具就会打开访问端口并等待入站连接。因此，`RAT`\
  \ 充当黑客的访问门户，使能够绕过任何安全限制并获得（或重新获得）系统的访问。常用的后门工具包括 `Back Orifice`、`NetBus` 和 `Sub7`（均在\
  \ Windows 上运行）。这些和其他常见的后门工具会被病毒扫描器和间谍软件扫描工具检测并移除。\n\n### 逻辑炸\n\n`logic bomb`（逻辑炸）是一种在触发事件发生前保持休眠的恶意代码。触发事件可以是特定的日期、程序的启动、输入特定的按键或访问\
  \ URL（如在线银行页面）。逻辑炸可以执行程序员希望的任何恶意功能，从导致崩溃、删除数据到窃取凭据。逻辑炸也可以是派叉炸（fork bomb），它会触发复制事件，使原始代码克隆。这种派叉/克隆过程不断重复，直到系统由于资源消耗或耗尽网络带宽而崩溃。逻辑炸感染的症状可能包括系统性能突然变化、应用程序崩溃以及存储可用空间丢失。\n\
  \n### 后门\n\n`backdoor` 一词可以指对系统的两种类型类型的问题或攻击。第一种也是最老的后门是开发者安装的绕过所有安全的访问方法。该后门是一个特殊的硬编码用户账户、密码或命令序列，允许任何知道访问钩子（有时称为\
  \ `maintenance hook`）的人进入环境并做出更改。从开发者的角度来看，这听起来很好，特别是在编码和调试过程中。遗憾的是，当产品接近完成时，这些编程快捷方式往往会被遗忘；因此它们最终出现在最终产品中。幸运的是，一旦在发布的产品中发现后门，供应商通常会发布补丁以从已安装的产品中移除后门代码。可能存在后门是保持供应商发布的更新和补丁的另一个良好理由。\n\
  \n后门的第二个含义是黑客安装的远程访问客户端。这些带有恶意目的的小型工具可以通过木马程序、病毒、蠕虫、网站移动代码下载，甚至作为入侵活动的一部分，轻易地部署在计算机上。一旦在系统上激活，该工具就会打开访问端口并等待入站连接。因此，后门充当黑客的访问门户，使能够绕过任何安全限制并获得系统的访问。\n\
  \n图 1.1 显示了正在进行的后门攻击。\n\n```\n![图 1.1 正在进行的后门攻击](img/c01f001.jpg)\n```\n\n**图 1.1**\
  \ 正在进行的后门攻击\n\n\n\n\n\n后门入侵可能会引发明显的症状，例如系统无响应、应用程序似乎自行打开或关闭、异常的网络连接和活动，以及文件的丢失或新文件的出现。\n\
  \n## 考试要点\n\n**理解病毒。** 病毒是旨在通过自我复制从一个系统传播到另一个系统，并执行各种恶意活动的程序。\n\n**理解加密恶意软件。** 加密恶意软件是任何形式将加密技术作为武器或防御的恶意软件。\n\
  \n**理解勒索软件。** 勒索软件是一种恶意软件，旨在接管计算机系统以阻止其使用并索要报。\n\n**理解蠕虫。** 蠕虫设计用于利用系统（操作系统、协议、服务或应用程序）的单一漏洞，然后利用该漏洞将自己复制到具有相同漏洞的其他系统中。\n\
  \n**理解特洛马。** 特洛马是一种伪装成有用或合法软件的恶意软件。\n\n**理解根内核工具包（Rootkits）。** Rootkit 是一种恶意代码，它可以欺骗\
  \ `OS` 使其认为活动进程和文件不存在。Rootkit 会使受攻击的系统变得完全不可信。\n\n**理解键盘记录器。** 键盘记录器是记录输入系统键盘按键的恶意软件形式。\n\
  \n**理解间谍软件和广告软件。** 间谍软件收集用户信息，并可能利用这些信息定制广告或盗取身份信息。广告软件收集用户信息并用其向用户投放广告。间谍软件和广告软件通常都是未经授权收集信息的非预期软件。\n\
  \n**理解僵尸网络。** 僵尸网络是由黑客控制的机器人或恶意软件代理网络，用于对目标发起大规模攻击。\n\n**理解远程访问木马（RAT）。** 远程访问木马（`RAT`）是一种恶意代码，它允许攻击者对受攻击的系统获得某种程度的远程控制访问。\n\
  \n**理解逻辑炸弹。** 逻辑炸弹是一种在触发事件发生前保持休眠状态的恶意代码。触发事件可以是特定的日期、特定程序的启动或对特定 `URL` 的访问。\n\n\
  **理解后门攻击。** 后门攻击有两种类型：开发者安装的绕过任何及所有安全限制的访问方法，或者黑客安装的远程访问客户端。\n\n**理解恶意代码应对措施。**\
  \ 应对病毒和其他恶意代码的最佳对措施是使用定期更新的防病毒扫描器，它会监控所有本地存储设备、内存和通信路径的恶意活动。其他应对措施包括避免从互联网下载软件、不打开邮件附件以及避免使用来自其他环境的可移动存储介质。\n\
  \n## 1.2 比较和对比攻击类型。\n\n任何连接到任何类型网络的计算机系统都会受到各种类型的攻击。网络系统遭受攻击的频率正以惊人的速度增长。即使是未连接互联网的系统（例如隔离在私有网络中的系统）也可能受到攻击。攻击计算机系统的方法数不胜。熟悉这些攻击方法以及如何应对它们是\
  \ `Security+` 考试的一项基本技能。以下章节将讨论常见的攻击方法。\n\n### 社会工程学\n\n`社会工程学` 是一种利用人性和人类行为的攻击形式。社会工程攻击主要有两种形式：说服某人执行未经授权的操作或说服某人泄露机密信息。例如，受害者可能被骗认为收到的邮件是权威的（例如电子邮件诈骗），认为电话中的某人是应该尊重和服从的人（例如自称是技术支持或外地经理的人），或者认为他们身边的人正是他们声称的身份（例如空调\
  \ [AC] 维修人员）。在几乎每种情况下，在社会工程学中，攻击者都试图说服受害者执行他们不应执行的活动或泄露信息。攻击成功会导致信息泄露或攻击者获得了对安全环境的逻辑或物理访问权限。\n\
  \n任何形式的广告都可以被视为一种社会工程攻击——广告吸引你并试图让你购买或使用某种产品或服务。虽然广告的动机是利润，但大多数社会工程攻击的动机更具恶意。事实上，黑客现在可以使用先进的技术来协助他们的社会工程学活动。\n\
  \n其中一种工具是社会工程学工具包 (`SET`)。正如你在 `http://social-engineer.org/social-engineer.org`\
  \ 网站所示，`SET` 专门设计用于针对人类因素执行高级攻击。它与 `Metasploit` 框架集成，允许攻击者通过诱导即将受害者点击某种弹出窗口来控制远程计算机。例如，玩最新版本的最热门在线视频游戏的玩家可能会收到一个显示临时网络拥堵的弹出窗口。然后它可能会说：“如果性能可以，请选择保持在线，或选择断开以断开并重新连接。”在几乎任何情况下，社会工程学的攻击都会导致攻击者的代码运行并可能导致系统利用。攻击中的用户交互部分就是为什么这被称为社会工程学工具包。\n\
  \n以下是一些常见社会工程攻击的示例场景：\n\n*   一名员工收到一封关于网络范围内传播的危险病毒的邮件。该信息指示员工在硬盘上查找某个特定文件并删除它，因为这表明病毒的存在。然而，识别出的文件通常是系统所需的必需文件。\n\
  *   一个网站声称提供免费访问其产品和服务，但需要更改网络浏览器和/或防火墙以下载访问软件。\n*   一名秘书接到一个电话，对方自称是由于迟到要见 CEO\
  \ 的客户。拨叫者索要 CEO 的私人手机号码以便拨打。\n*   帮助热线接到一个来自外线的电话。拨叫者自称是目前在另一个城市参加销售会议的部门经理。拨叫者声称忘记了密码，需要重置密码以便他们远程登录下载一份重要的演示文稿。\n\
  *   一个看起来像空调维修人员的人进入办公室，声称收到了关于大楼故障设备的服务单。该“维修人员”确定可以从你的办公区域内部访问该设备，并要求自由维修空调系统。\n\
  *   一个意之外的弹出窗口\n\n这些只是可能的社会工程攻击的几个例子。它们也可能是合法且无害的事件，但你可以看到它们如何掩盖攻击者的动机和目的。\n\n防止社会工程学的方法包括：\n\
  \n*   培训人员了解社会工程攻击以及如何识别常见迹象。\n*   在电话中为人员执行活动时要求进行身份验证。\n*   定义不通过电话的限制信息。\n* \
  \  始终验证维修人员的证件，并确认确实由授权人员提交了真正的服务单。\n*   在通过至少两个独立的可靠来源验证信息之前，绝不遵循邮件的指令。\n\n\n\n\
  \n\n*   在与任何你不认识或不熟悉的人交道时（无论是面对面、电话还是通过互联网/网络），请务必保持谨慎。\n\n防范社交工程攻击的唯一真实防御手段是用户教育和意识培训。适度的偏执和怀疑将有助于用户检测或注意到社交工程攻击的尝试。培训应该包括角色扮演以及针对各种形式社交工程攻击的大量范例。\n\
  \n### 网络钓鱼\n\n`Phishing` 是一种社会工程攻击形式，侧重于从任何潜在目标中窃取凭据或身份信息。它基于“钓鱼”信息的概念。攻击者通过在电子通信（通常是电子邮件）中伪装成可信的实体（例如银行、服务提供商或商户），以此获取用户名、密码、信用卡详情或其他个人身份信息等敏感信息。网络钓鱼可以通过多种方式利用多种通信媒介进行，包括电子邮件、网页、实时论坛、`IM`、留言板等。\n\
  \n为了防御网络钓鱼攻击，应训练终端用户避免点击通过电子邮件、`IM` 或社交网络消息收到的任何链接。相反，用户应该通过使用预设的书签或通过按名称搜索网站来访问目标网站。如果在在该网站上访问账户后，在线消息或警报系统中没有出现重复消息，则原始消息很可能是攻击或伪造的。任何此类虚假通信都应向目标组织报告，然后删除该消息。\n\
  \n所有形式的网络钓鱼都利用了人们对表面上合法的第三方的意愿，而他们没有应用基本的、常性的性的安全规则（这里这些原则中最相关的是“绝不打开意外的邮件附件”和“绝不通过电子邮件共享敏感信息”）。\n\
  \n### 鱼叉式钓鱼\n\n`Spear phishing` 是一种更具针对性的钓鱼形式，其信息是针对特定群体定制并设计的，而不是对任何人进行盲目广播。攻击者通常会先攻破一家在线或数字业务以窃取其客户数据库。然后，伪造看起来像来自该受害业务的消息，但使用了伪造的源地址和错误的\
  \ URL。这种攻击的希望是，与某个组织已有在线/数字关系的人更有可能落入虚假信息。如果受害者做出回应，随后的消息或他们访问的网站将旨在诱导其个人信息，以执行账户接管或彻底的身份盗窃。\n\
  \n### 捕鲸式钓鱼\n\n`Whaling` 是一种针对特定高价值个体的钓鱼形式。通过针对高价值个人，攻击者可以获得可用于更大攻击的敏感信息。捕鲸式钓鱼通常涉及使用高度个性化的消息，这些看似来自可信来源或高管。捕鲸式攻击的目标是欺骗高价值个人泄露敏感信息或执行欺诈交易。\n\
  \n### 电话钓鱼\n\n`Vishing` 是一种通过电话进行的钓鱼。攻击者可能使用来电号码显示欺骗技术，让电话看起来来自可信来源。他们还可能使用自动录音或语音电话收集信息。电话钓鱼的目标是欺骗受害者泄露敏感信息。\n\
  \n### 尾随\n\n`Tailgating` 发生在未经授权的人跟随授权人员进入安全区域时。这可能在授权人员为未经授权的人开门时发生。为了防止尾随，组织应该使用安全措施，如人肉道和道闸机。\n\
  \n### 顺便\n\n`Piggybacking` 与尾随类似，但它发生在授权人员同意的情况下。这可能发生在授权人员刻意或无意地为未经授权的人开门时。为了防止搭便，组织应该训练员工不要为他人开门。\n\
  \n\n\n\n\n为了防止翻找垃圾（或至少减少其价值），所有文档在丢弃前应经过粉碎和/或焚烧。此外，不应将任何存储介质丢入垃圾桶；应使用安全的处置技术或服务。\n\
  \n### 肩窥视\n\n*肩窥视*（Shoulder surfing）是指有人能够观察用户的键盘或查看其显示屏的情况。这可能允许他们获取密码或看到机密、隐私或简单不属于他们查看的信息。通常，通过使用锁门根据敏感级别对员工小组进行分组来防止肩窥视。此外，用户不应让其显示器朝向窗户（从外部可见）或走道/门口（内部问题）可见。而且他们不应在咖啡馆或飞机等公共场所处理敏感数据。\n\
  \n### 骗局\n\n*骗局*（Hoax）是社会工程学的一种形式，旨在说服目标执行某些会导致问题或降低其 IT 安全性的动作。骗局通常是电子邮件，声称某种紧迫的威胁正在互联网上传播，你必须执行某些任务来保护自己。受害者可能会指示删除文件或更改配置设置，这将导致\
  \ `OS` 损坏、`OS` 无法启动或安全防御能力的降低。此外，骗局邮件通常鼓励受害者将信息转发给所有的联系人以“传播消息”。\n\n### 鱼穴攻击\n\n\
  *钓水穴攻击*（Watering hole attack）是一种针对区域、群体或组织的针对性攻击。该攻击分为三个主要阶段。第一阶段是观察目标的习惯。目标是发现一个或多个目标成员经常访问的共同资源、网站或位置。该位置被认为是钓水穴。第二阶段是在该位置植入恶意软件。第三阶段是等待目标访问该位置并感染其系统。更多信息，请参阅\
  \ `www.wired.com/threatlevel/2013/freedom-hosting/`。\n\n### 原则（有效原因）\n\n社会工程学之所以有效，是因为几种人性的原理。\n\
  \n### 权威\n\n*权威*（Authority）是社会工程学的一种形式，因为人们自然倾向于服从权力者。攻击者可能伪装成高管、影响人物或执法人员，以说服受害者透露信息或执行动作。\n\
  \n#### 恐吓\n\n*恐吓*（Intimidation）通常用于营造恐惧感或紧迫感。攻击者可能会威胁受害者面临负面后果，如法律行动、终止雇或数据丢失，以强制其服从。\n\
  \n#### 否\n\n*否*（Denial）通常用于让受害者感到不知所措或无法清晰思考。攻击者可能声称某条消息或请求来自信任实体，使受害者更容易顺从。\n\n\
  #### 共识\n\n*共识*（Consensus）或*社会证明*（social proof）依赖于人们遵循他人行为的倾向。攻击者可能声称许多其他人已经执行了该动作，从而鼓励受害者这样做。\n\
  \n#### 稀缺性\n\n*稀缺性*（Scarcity）是一种用于营造时间压力或可用性有限的技术。这会迫使受害者在不思考的情况下迅速行动，因为他们担心错失机会。\n\
  \n#### 熟悉/好感\n\n*熟悉*（Familiarity）或*好感*（liking）利用人类信任我们认识或喜欢的人的倾向。攻击者可能假装成朋友、同事或乐于助的人与受害者建立关系。\n\
  \n### 信任\n\n*信任*（Trust）是社会工程学的一种形式，攻击者与受害者建立关系。一旦建立信任，攻击者就可以操纵受害者透露信息或执行动作。\n\n\
  ### 紧急性\n\n*紧急性*（Urgency）通常用于营造即时需求感。攻击者可能声称情况危急，从而防止受害者考虑请求的有效性。\n\n#### 应用/服务攻击\n\
  \n社会工程学并不是现代环境面临的唯一攻击形式。攻击者使用各种攻击和利用手段来外泄数据，或获得对我们组织的逻辑或物理访问。在本节中，我将讨论几个利用信息技术的攻击示例。\n\
  \n#### DoS\n\n*拒绝服务*（`DoS`）是一种攻击形式，其主要目标是防止受害系统执行合法活动或响应合法流量。`DoS` 攻击有两种基本类型。第一种形式利用软件的弱点、错误或标准功能，导致系统挂起、冻结、消耗所有系统资源等。最终结果是受害计算机无法处理任何合法的任务。第二种形式用垃圾网络流量淹没受害者的通信流水线。最终结果是受害计算机无法发送或接收合法的网络通信。\n\
  \n\n\n\n\nDoS 并不是单一的攻击，而是一整类攻击。某些攻击利用了操作系统软件的漏洞，而另一些攻击则侧重于已安装的应用、服务或协议。某些攻击利用特定的协议，包括互联网协议\
  \ (`IP`)、传输控制协议 (`TCP`)、互联网控制消息协议 (`ICMP`) 和用户数据报协议 (`UDP`)。\n\nDoS 攻击通常发生在一个攻击者和一个受害者之间。。然而，它们并不非要以这种简单的方式进行。大多数\
  \ DoS 攻击都会利用某种形式的中间系统（通常是无意且不知情的参与者），以便在受害者面前隐藏攻击者的身份。例如，如果攻击者直接向受害者发送攻击包，受害者可能会发现攻击者的身份。而通过使用\
  \ `spoofing`（在本章稍后部分讨论），这会变得更加困难，尽管并非不可能。\n\n下一代 DoS 攻击被称为`分布式拒绝服务 (DDoS)` 攻击。这类\
  \ DoS 攻击通过首先攻破或渗透一个多个作为启动点或攻击平台的中间系统来实施。这些中间系统通常被称为`次级受害者`。攻击者在这些系统上安装远程控制工具，通常称为`bots`、`zombies`\
  \ 或`agents`。然后，在指定的时刻或响应攻击者的启动命令时，对受害者发起 DoS 攻击，如图 1.2 所示。通过这种方式，受害者可能会发现导致 DoS\
  \ 攻击的僵尸系统，但可能无法追踪到真正的攻击者。最近，这种在许多毫无防备的次级受害者上部署大量机器人或僵尸的行为被称为`botnets`（参见之前的章节“Botnets”）。\n\
  \n![图 1.2 DDoS 攻击图 ](img/c01f002.jpg)\n\n**图 1.2** DDoS 攻击\n\n除了 DoS 和 DDoS 之外，还有第三形式，被称为`分布式反射拒绝服务\
  \ (DRDoS)`。这种形式的攻击利用了`放大`或`反弹`网络，该网络是一个不知情的参与者，但不幸的是，它能够接收广播消息并创建消息响应、回声或反弹。实际上，攻击者向放大网络的广播地址发送伪造的消息包。这导致每个收到的入站包都被分发到网络中的所有主机（数量可能是\
  \ 10,000 或 100,000 个）。每个主机随后对每个包做出响应，但由于原始包的源是伪造的，响应将发送受害者而不是真正的发送者（攻击者）。因此，源自攻击者的单个数据包变成了许多离开放大网络的数据包，并最终淹没受害者的通信链路。\n\
  \n有很多特定的 DoS、DDoS 和 DRDoS 攻击工具和方法。以下是您应该能够识别的几种：\n\n### Smurf（烟雾攻击）\n这种形式的 DRDoS\
  \ 使用 ICMP 回显响应包（ping 包）。攻击者向多个中间网络的广播地址发送 `ICMP Type 8` 回显请求包，并将源 IP 地址设置为主要受害者。这导致多个\
  \ `ICMP Type 0` 响应被发送给受害者。Smurf 攻击也称为放大攻击。参见图 1.2。\n\n![图 1.2 DDoS 攻击图 ](img/c01f002.jpg)\n\
  \n**图 1.2** Smurf 攻击\n\n### Fraggle（碎石攻击）\n这种形式的 DRDoS 使用 UDP。\n\n### SYN flood（SYN\
  \ 洪水攻击）\n这种攻击利用了 TCP 三次握手。攻击者向服务器发送 `SYN` 包，服务器响应 `SYN/ACK`，但攻击者从不发送 `ACK`。这导致服务器产生许多半打开连接，最终耗尽其资源。\n\
  \n### Ping of death（死亡之）\n这种形式的攻击发送超大的 ping 包。\n\n### Xmas attack（圣诞树攻击）\n当有人发送开启了\
  \ `URG`、`PSH` 和 `FIN` 标志的 TCP 包时，就会 `Xmas attack`。根据 TCP 规范，如果端口关闭，服务器应该忽略此类数据包。这被称为圣诞树攻击，因为标志位的设置就像圣诞树一样。\n\
  \n\n\n\n# 中间人攻击 (Man-in-the-middle Attack)\n\n`中间人攻击` 是一种通信窃听攻击。攻击者将自己置于客户端和服务器（或任何两个通信实体）之间的通信流中。客户端和服务器认为它们正在直接通信——它们甚至可能拥有了安全或加密的通信链路。然而，攻击者可以访问并可能修改这些通信。\n\
  \n中间人攻击 (MitM) 的复杂度从非常简单到相当复杂不等。某些中间人攻击利用 DHCP 漏洞分发虚假的 IP 配置，例如将攻击系统的 IP 地址定义为受害者的默认网关。其他形式的中间人攻击侧重于名称解析系统投毒——例如域名系统\
  \ (`DNS`)、地址解析协议 (`ARP`)、NetBIOS 和 Windows 网上命名服务 (`WINS`)。还有其他中间人攻击包括使用虚假的代理服务器设置或使用\
  \ MAC（媒体访问控制）地址欺骗。任何形式的中间人攻击都可以欺骗客户端将攻击者视为服务器，并欺骗服务器将攻击者视为客户端，或者简单地让攻击者成为通信路径上的一个透明节点。当这种骗局成功时，客户端会将登录凭据提交给伪造的服务器（伪装的攻击者），攻击者反而伪装成真实的客户端将凭据发送给实际服务器。结果是客户端与攻击者建立了通信链路（甚至可能是加密链路），而攻击者与服务器建立了通信链路。当数据在真实的客户端和服务器系统之间双向传输时，攻击者可以读取并访问所有数据，并可以选择修改流量以进一步实施欺骗。\n\
  \n图 1.5 显示了一次中间人攻击。\n\n![图 1.5 发生在客户端和 Web 服务器之间的中间人攻击](img/c01f005.jpg)\n\n图 1.5\
  \ 发生在客户端和 Web 服务器之间的中间人攻击\n\n此类攻击在路由和名称解析系统首先被攻破时最为成功，以便在客户端到服务器的通信启动之前让攻击者就位。然而，在某些情况下，中间人攻击也可以针对现有的客户端服务器通信链路进行（通常假设它们没有加密）。这种可能的一种情况是开放的无线连接。攻击者可以向无线客户端受害者发送去身份认证包；然后，当他们尝试重新连接时，攻击者欺骗受害者系统通过自己建立连接，而不是与有效的基站连接。即使是这种风格的中间人攻击也是有效的，因为整个过程发生只需要几秒钟的时间，除非短暂的断开中断了活动的数据传输，否则用户甚至不会注意到该事件。\n\
  \n针对中间人攻击的防御措施包括强加密协议（如 `IPsec`、`SSH` 和 `TLS`）以及使用强身份验证，例如域名系统安全扩展 (`DNSSEC`) 和双向证书认证。\n\
  \n### 传递访问 (Transitive Access)\n\n与中间人攻击相关的是传递访问攻击或利用。传递访问是一种潜在的后门或绕过传统访问控制手段的方法。其理念是用户\
  \ `A` 可以使用进程 `B`，进程 `B` 可以使用或调用进程 `C`，而进程 `C` 可以访问对象 `D`。\n\n\n\n\n从组织的角度来看，`SQL\
  \ injection` 攻击比 XSS 攻击（见下节）更危险，因为 SQL 注入攻击的目标是组织资产，而 XSS 攻击的目标是客户或网站访问者。`SQL injection`\
  \ 攻击使用意想不到的输入来更改或破坏 Web 应用程序。然而，SQL 注入攻击并非使用这些输入来尝试欺骗用户，而是利用它未经授权访问底层数据库及相关资产。\n\
  \n### Web 应用程序的演变\n\n在 Web 早期，所有网页都是 `static` 的，即是不改变的。网站管理员创建包含信息的网页并将其放在 Web 服务器上，用户可以使用浏览器检索它们。Web\
  \ 的发展迅速超出了这种模式，因为用户希望能够根据个人需求访问定制化信息。例如，银行网站的访问者不仅对包含银行网点、营业时间和服务的信息的静态页面感兴趣，他们还想检索包含其个人账户信息的动态内容。显然，网站管理员无法为每个单独的用户在\
  \ Web 服务器上创建一个包含该用户个人账户信息的网页。对于大型银行来说，这将需要维护数百万个具有最新信息的页面。这就是动态 Web 应用程序派上用场的地方。\n\
  \nWeb 应用程序利用数据库在用户提出请求时按需创建内容。在银行示例中，用户登录 Web 应用程序并提供账号和密码。Web 应用程序随后从银行数据库中检索当前账户信息，并使用其立即创建一个包含用户当前账户信息的网页。如果该用户一小时后返回，Web\
  \ 服务器将重复该过程，从数据库获取更新的账户信息。\n\n### 安全影响\n\n对于安全专业人员来说，这意味着什么？Web 应用程序为传统的安全模型增加了复杂性。Web\
  \ 服务器作为一个公共访问的服务器，属于与其他服务器隔离的独立网络区域，通常称为 `demilitarized zone (DMZ)`。另一方面，数据库服务器并非供公共访问的，因此它应该属于内部网络，或者至少属于与\
  \ `DMZ` 隔离的安全子网。Web 应用程序需要访问数据库，因此防火墙管理员必须创建规则，允许从 Web 服务器访问数据库服务器。这条规则为互联网用户访问数据库服务器创建了潜在路径。\n\
  \n如果 Web 应用程序运行正常，它将只允许授权请求访问数据库。然而，如果 Web 应用程序存在漏洞，它可能允许个人通过 `SQL injection` 攻击以意想不到且未经授权的方式篡改数据库。这些攻击允许恶意人员直接对底层数据库执行\
  \ SQL 事务。`SQL injection` 攻击可能允许攻击者绕过身份验证、暴露数据库表中的机密数据、更改现有数据、向数据库添加新记录、破坏整个表或数据库，甚至通过某些数据库功能（如命令\
  \ 存储过程）获得类似命令行的访问。\n\n### 防御技术\n\n你可以使用两种技术保护你的 Web 应用程序免受 `SQL injection` 攻击：\n\
  \n1. **执行输入验证。** 输入验证允许你限制用户在表单中提供的数据类型。存在许多输入注入或操纵攻击的变体，需要广泛的防御方法，包括白名单和黑名单过滤器。应该采用的主要输入清理形式包括限制输入长度、对已知恶意内容模式进行过滤、以及转义\
  \ `metacharacters`。\n\n2. **限制账户权限。** Web 应用程序使用的数据库账户应具有最小的权限集。根结底，`SQL injection`\
  \ 是前端后端交互之间的漏洞。\n\n`LDAP injection` 是输入攻击的一种变体；然而，攻击的焦点是后端目录服务而不是数据库服务器。如果 Web 服务器前端使用脚本来构建\
  \ LDAP 语句，那么 `LDAP injection` 就是一个潜在威胁。与 `SQL injection` 一样，输入清理和防御性编码至关重要。`XML\
  \ injection` 是 `SQL injection` 的另一个变体，其后端目标是 XML 应用。\n\n### 跨站脚本\n\n`Cross-site\
  \ scripting (XSS)` 是一种恶意代码注入攻击，攻击者能够破坏 Web 服务器并将自己的恶意代码注入到发送给访问者的内容中。黑客已经发现了许多种巧妙的方法，通过\
  \ CGI 脚本、Web 服务器漏洞、SQL 注入攻击、框架利用、DNS 重定向、Cookie 劫持以及许多其他形式向网站注入恶意代码。成功的 `XSS` 攻击可能导致身份盗窃、凭据盗取、数据泄露、财务损失或在访问的客户端上种植远程控制软件。\n\
  \n对于网站管理员来说，防御 `XSS` 包括维护已补丁的 Web 服务器、使用 Web 应用防火墙、运行基于主机的入侵检测系统 (`HIDS`)、审计可疑活动，最重要的是对长度、恶意内容和元字符过滤进行服务器端输入验证。作为\
  \ Web 用户，你可以通过保持系统补丁更新、运行杀病毒软件和避免非主流网站来防御 `XSS`。某些浏览器浏览器有插件（例如 Firefox 的 NoScript\
  \ 和 Chrome 的 uBlock Origin），允许仅执行你选择的脚本。\n\n#### 跨站请求伪造\n\n`Cross-site request forgery\
  \ (XSRF)` 是一种本质与 XSS 类似的攻击。然而，对于 `XSRF`，攻击的焦点是访问用户的 Web 浏览器而不是所访问的网站。`XSRF` 的主要目的是欺骗用户或用户的浏览器执行他们无意执行或未授权的操作。这包括退出会话、上传站点\
  \ Cookie、更改账户信息、下载账户详情、进行购买等。一种 `XSRF` 形式是用恶意软件感染受害者系统，保持休眠状态直到访问特定网站。然后，恶意软件将以用户的身份伪造请求，以欺骗\
  \ Web 服务器对 Web 服务器和/或客户端执行恶意操作。\n\n使用 `XSRF` 的利用示例是 Zeus，它会隐藏在受害者系统中，直到用户访问其在线银行网站；随后，在检查账户余额并确定银行账号后，这些细节将发送给控制它的攻击者，攻击者将向另一银行发起\
  \ ACH 资金转账。因此，这是一个直接从受害者账户中窃取资金的恶意软件示例。\n\n\n\n\n网站管理员可以通过在连接的客户端请求敏感或高风险操作时要求确认或重新身份验证，来实施防止\
  \ XSRF（跨站请求伪造）的措施。这可能要求用户重新输入密码、通过短信或电子邮件向用户发送代码并要求其返回给网站、触发基于电话的验证，或解决 CAPTCHA（一种区分人类与软件机器人的机制）。另一种潜在的保护机制是在每个\
  \ URL 请求和会话建立时添加随机字符串（称为 `nonce`），并检查客户端 HTTP 请求头中的 `Referer` 字段以判断是否存在伪造。终端用户可以养成更安全的习惯，例如运行反恶意软件扫描器；使用主机入侵检测系统（HIDS）；运行防火墙；避免非主流网站；始终从网站注销而不是关闭浏览器、关闭标签页或切换到另一个\
  \ URL；保持浏览器更新更新；以及定期清理临时文件和缓存 Cookie。\n\n### 权限提升\n\n`Privilege escalation`（权限提升）发生于用户能够获得比组织分配的更高的权限、访问权限或特权时。权限提升可能意外发生，也可能由于管理疏忽引起，但通常该术语指的是特意且蓄地滥用系统来窃取访问权限。\n\
  \n权限提升可以通过操作系统（OS）的漏洞实现。通常使用黑客工具来利用程序缺陷或缓冲区溢出，这可能允许攻击用户获得管理员组的永久或临时访问权限。这种攻击形式被称为**垂直权限提升**，因为当前的低级用户或访问权限本身被提升到了更高的访问级别。在其他情况下，权限提升通过身份盗取或凭据泄露发生，例如击键记录或密码破解。这种攻击形式被称为**水平权限提升**，因为攻击者切换到另一个用户账户以获得更高层次的访问权限。\n\
  \n权限提升是对安全的违反。具体而言，它是对授权限制的违背，并可能是对身份验证的破坏。为了防止或停止权限提升，所有操作系统都应保持供应商提供的最新补丁。此外，还应配置审计和监控以关注权限提升的症状。这些包括非管理员反复尝试执行用户账户管理，以及反复尝试访问用户分配授权级别之外的资源。\n\
  \n## ARP poisoning\n\n`Address Resolution Protocol (ARP) poisoning`（ARP 协议投毒）是伪造\
  \ TCP/IP 使用的 IP 到 MAC 地址解析系统的行为。ARP 运行在 OSI 模型的第 2 层，即数据链路层。ARP 负责将 IP 地址解析为 MAC\
  \ 地址。这允许第 2 层在将传输到物理层（第 1 层）之前进行物理寻址。与 DNS 类似，ARP 解析是一个多步过程：\n\n1. 检查本地 ARP 缓存。\n\
  2. 如果失败，则发送 ARP 广播。\n\nARP 广播是向本地子网内所有可能的接收者发送的（更准确地说，ARP 广播是由同一以太网广播域的所有成员接收的，但这组系统几乎与本地子网中的系统相同），询问所有主机是否拥有该\
  \ IP 地址。如果该 IP 地址的所有者在线，它将向源系统发送直接回复，并包含其 MAC 地址。\n\nMAC 地址对于 TCP/IP 通信至关重要，因为传输发生在主机与主机、路由器与路由器之间，这不仅基于\
  \ IP 地址，而且主要基于 MAC 地址。当一个主机向另一个主机发送数据时，如果该主机在同一个子网内，它会将信号从其带有 MAC 地址的网卡（NIC）传输到目标的\
  \ MAC 地址的网卡。如果目标在不同的子网中，它会将消息发送给默认网关的 MAC 地址网卡（即该子网中的路由器接口）。然后，该路由器接管并尝试寻找目标主机，通过直接连接到其某个端口的子网，或者通过将消息发送到另一个可能连接到目标主机子网的路由器。如果没有适当的\
  \ ARP 活动，这个过程是无法实现的。\n\nARP 投毒可以通过许多方式发生。最常见的方法是投毒本地 ARP 缓存，或发送投毒的 ARP 回复或公告。在任何一种情况下，如果主机获取了\
  \ IP 地址的错误 MAC 地址，其传输可能会发送到错误的位置。这种策略在单个子网内最有效，但对多个子网也有影响。ARP 投毒通常用于主动嗅探攻击，在其中使用虚假的\
  \ ARP 公告将流量重定向到黑客控制的系统，允许攻击者查看所有交易的内容。攻击必须将每个以太网帧转发到正确的 MAC 地址目的地，以防止 DoS（拒绝服务）并维持一切无常的假象。\n\
  \n用于监控 ARP 投毒的一种流行工具是 `arpwatch`。然而，针对包括 ARP 投毒在内的 ARP 攻击的最佳防御是交换机上的端口安全。交换机端口安全可以禁止与未知、未经授权的恶意设备通信，并可能确定哪个系统正在响应所有\
  \ ARP 查询，从而拦截来自故障系统的 ARP 回复。\n\n## Amplification\n\n在 `amplification attack`（放大攻击）中，攻击者产生的工作量或流量被倍增，导致大量流量被输送到主要受害者。放大攻击也可以称为反射攻击或弹跳攻击。大多数放大攻击涉及无辜的第三方系统或网络，这些系统被用于产生多倍响应。放大攻击的一个历史案例是前面提到的\
  \ Smurf DRDoS。任何攻击者的单个数据包产生两个或多个发送到主要目标的数据包，都可以描述为放大攻击。这类攻击赋予了攻击者比没有倍增收益时更高的感知力量能力。虽然\
  \ Smurf DRDoS 使用中间网络的广播地址进行放大，但其他攻击可以使用请求来生成更大的回复。\n\n这种后者的放大攻击的示例发生在 2014 年 2 月。该攻击利用了\
  \ 4529 台 NTP（网络时间协议）服务器，通过发送管理员请求 `MONLIST`。该命令会生成一份最后请求 NTP 服务器信息的 600 个 IP 地址的报告。这导致了针对目标受害者的洪水，峰值达到\
  \ 400 Gbps。\n\n放大攻击在攻击者中很流行，因为它们有助于增加针对大型目标的有效力量。虽然过少数非放大攻击也对受害者产生了更大流量流量——例如 Mirai\
  \ 僵尸网络在 2016 年 9 月针对 krebsonsecurity.com 产生了 620 Gbps 的流量——但这种情况极少。\n\n## DNS poisoning\n\
  \n`DNS poisoning`（DNS 投毒）是伪造客户端用于访问目标系统所使用的 DNS 信息的行为。可以通过多种方式发生。每当客户端需要将 DNS 名称解析为\
  \ IP 地址时，可能会经历以下过程：\n\n1. 检查本地缓存（包括来自 `HOSTS` 文件的内容）。\n2. 向已知的 DNS 服务器发送 DNS 查询。\n\
  3. 向任何可能的本地子网 DNS 服务器发送广播查询。（此步骤并不被广泛支持）。\n\n\n\n\n如果客户端无法从这些步骤中的任何一步获取 DNS 到 IP\
  \ 的解析，则解析将失败且无法发送通信。DNS 污染可能发生在上述任何步骤，但最简单的方法是破坏 `HOSTS` 文件或 DNS 服务器查询。\n\n有许多方法可以攻击或利用\
  \ DNS。攻击者可能会使用以下技术之一：\n\n-   **部署恶意的 DNS 服务器（也称为 DNS 欺骗或 DNS 钓鱼）。** 恶意的 DNS 服务器可以监听网络流量，截获任何\
  \ DNS 查询或与目标网站特定的 DNS 查询。然后，恶意的 DNS 服务器会向客户端发送带有虚假 IP 信息的 DNS 响应。这种攻击要求恶意的 DNS 服务器必须在真实\
  \ DNS 服务器响应之前将响应返回给客户端。一旦客户端收到来自恶意 DNS 服务器的响应，客户端就会关闭 DNS 查询会话，这导致真实 DNS 服务器的响应被丢弃并视为会话外包而被忽略。\n\
  \nDNS 查询未经过身份验证，但它们确实包含一个被称为查询 ID 或 `QID` 的 16 位值。DNS 响应必须包含与查询相同的 `QID` 才能被接受。因此，恶意的\
  \ DNS 服务器必须在虚假回复中包含请求的 `QID`。\n\n-   **执行 DNS 污染。** `DNS poisoning` 涉及攻击真实的 DNS\
  \ 服务器并向其区域文件中放入错误信息。这导致真实的 DNS 服务器向客户端发送虚假数据。\n\n-   **修改 HOSTS 文件。** 通过向客户端的 `HOSTS`\
  \ 文件中放入虚假 DNS 数据将用户重定向到虚假位置。\n\n-   **破坏 IP 配置。** 破坏 IP 配置可能导致客户端拥有虚假的 DNS 服务器定义。这可以在客户端上直接完成，也可以在网络的\
  \ DHCP 服务器上完成。\n\n-   **使用代理伪造。** 这种方法仅适用于 Web 通。这种攻击在客户端浏览器中植入虚假的 代理数据，然后由攻击者操作恶意的代理服务器。恶意的代理服务器可以修改\
  \ HTTP 流量包，将请求重定向到黑客想要的任何网站。\n\n尽管有许多 DNS 污染方法，但这里你可以采取的一些基本安全措施可以极程度上减少这些威胁：\n\n\
  -   限制从内部 DNS 服务器到外部 DNS 服务器的区域传输。这是通过阻止入站 `TCP` 端口 `53`（区域传输请求）和 `UDP` 端口 `53`（查询）来实现的。\n\
  -   限制内部 DNS 服务器从外部 DNS 服务器获取区域传输。\n-   部署`network intrusion detection system (NIDS)`\
  \ 来监控异常的 DNS 流量。\n-   在你的私有网络中适当加固所有 DNS、服务器和客户端系统。\n-   使用 DNSSEC 保护你的 DNS 基础设施。\n\
  -   要求内部客户端通过内部 DNS 解析所有域名。这要求你阻止出站 `UDP` 端口 `53`（用于查询），同时保留出站 `TCP` 端口 `53`（用于区域传输）。\n\
  \n另一种与 DNS 污染和/或 DNS 欺骗密切相关的攻击是 `DNS pharming`。`Pharming` 是将有效网站的 URL 或 IP 地址恶意重定向到虚假网站，该网站托管了原始有效网站的虚假版本。这通常是钓鱼攻击的一部分，攻击者试图欺骗受害者交出登录凭据。如果潜在受害者不小心或不注意，他们可能会被骗向虚假的钓鱼网站提供登录信息。DNS\
  \ 钓鱼通常通过修改系统上的本地 `HOSTS` 文件，或者通过污染或欺骗 DNS 解析发生。DNS 钓鱼是一项日益严重的问题，因为黑客已经发现了利用 DNS\
  \ 漏洞的方法，针对大量目标用户钓鱼各种域名。\n\n如需详细查看 DNS 及其漏洞，请阅读位于 [www.unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html](http://www.unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html)\
  \ 上的《Kaminsky DNS 漏洞图解指南》。\n\n### 域名劫持 (Domain hijacking)\n\n`Domain hijacking`（或称域名被窃取）是在未经合法所有者授权的情况下，恶意更改域名注册注册信息的恶意行为。这可以通过盗取所有者的登录凭据；使用\
  \ `XSRF`、会话劫持或 `MitM`；或利用域名注册商系统的缺陷来实现。\n\n有时，当另一个人在原所有者注册过期后立即注册域名时，这被称为域名劫持，但它不应被这样定义。这是一种潜在的不合道德的行为，但它不是真正的黑客行为或攻击。它是利用了原所有者未能手动扩展注册或配置自动续费的疏忽。如果原所有者由于未能维护注册而丢失域名，通常没有其他办法，只能联系新所有者并询问重新获得控制权。许多注册商对过期的注册执行“慢者失效（you\
  \ snooze, you lose）”政策。\n\n当一个组织丢失域名并由他人接管控制权时，这对该组织及其客户和访问者来说都是一个毁灭性的事件。原始网站或在线内容将不再可用（或至少在同一个域名下不可用）。新所有者可能会托管完全不同的内容，或者托管之前网站的虚假副本。随后的此类活动可能会欺骗访问者，类似于钓鱼攻击，其中\
  \ `PII (个人身份信息)` 可能会被提取和收集。\n\n### 浏览器中间人 (Man-in-the-browser)\n\n`man-in-the-browser`\
  \ (`MitB`, `MiTB`, `MiB`, `MIB`) 攻击实质上是一种 `MitM` 攻击。唯一的区别在于，中间人恶意软件运行在受害者系统上，它能够在通信离开浏览器之后、离开网络接口之前立即进行拦截和操纵。`MitB`\
  \ 通常是一个虚假的代理系统，即使是加密连接也可以通过伪造证书进行渗透。\n\n防御 `MitB` 攻击的主要措施是避免危险行为以减少受到恶意软件感染、运行反恶意软件扫描器、使用\
  \ `HIDS` 以及使用状态检测防火墙。\n\n### 零日 (Zero day)\n\n`Zero-day attacks` 是新发现的、没有特定防御的攻击。`zero-day\
  \ exploit` 旨在利用目标系统中未知或未公开的缺陷或漏洞。零日也意味着尚未存在攻击的直接或特定防御；因此，大多数拥有目标漏洞资源的系统都面临风险。\n\n\
  许多攻击利用零日漏洞——黑客发现但安全社区尚未充分解决的安全漏洞。系统受这些漏洞影响有两个主要原因。首先，可能是由于发现新类型的恶意代码与发布补丁和反病毒更新之间存在必要的延迟。其次，可能是由于系统管理员更新速度缓慢。零日漏洞的存在使得在你的组织中建立一个强大的补丁管理计划至关重要，以确保及时应用关键安全更新。此外，你可能希望定期使用漏洞扫描器对系统进行已知安全问题扫描。\n\
  \n### 重放 (Replay)\n\n\n\n\n\n重放攻击（Replay attack）顾其实名：攻击者截获网络流量，然后重放（重新传输）截获的流量，试图获得对系统的未授权访问。最常见的情况下，攻击者关注的是客户端与服务器进行认证之间交换的网络流量。如果攻击者能够截获认证流量——特别是包含登录凭据的数据包，即使这些不仅仅是用户名和密码（如证书、令牌响应或生物识别值）——那么重放攻击可能会通过重新传输截获的数据包，赋予攻击者登录系统的能力。\n\
  \n图 1.8 显示了重放攻击。当客户端向服务器传输登录凭据（1）时，攻击者拦截并窃听了该传输（2），随后可以将截获的认证数据包重放给服务器，伪装成原始客户端进行登录（3）。\n\
  \n![FIGURE 1.8 正在发生的重放攻击 ](img/c01f008.jpg)\n\nFIGURE 1.8 正在发生的重放攻击 \n\n如果重放攻击成功，攻击者将获得与最初提交认证信息的用户相同的访问权限。幸运的是，大多数现代操作系统、网络、协议、服务和应用程序都使用各种重放保护机制直接防止此类攻击。常见的应对措施包括数据包排序、时间戳、挑战响应（challenge-response）和临时会话加密。数据包排序确保收到的任何顺序错误（或不在合理范围内）的数据包被丢弃和忽略。数据包时间戳确保任何在特定时间窗口之外收到的数据包被丢弃和忽略。一个很好的例子是\
  \ Kerberos，得益于对时间戳的使用，它不受重放攻击的侵。。\n\n挑战响应是一种认证类型，服务器向建立连接的客户端生成并发布一个随机数挑战。客户端使用挑战数和用户密码的哈希值（或其他认证因子）生成响应。响应被发回服务器，服务器将其与使用挑战数和从用户账户数据库提取的凭据所生成的预期响应进行比较。由于每个挑战仅有效一次且每个挑战都是随机选择的，因此无法进行重放攻击。\n\
  \n临时会话密钥（Ephemeral session key）是指使用 `DHE` 或 `ECDHE`（见第 6 节，“Diffie-Hellman”）来生成随机、不重复、不可重用、不可预测且会话特定的对称加密密钥\
  \ Term。满足这些标准意味着每个认证会话都是加密的，且该加密仅有效一次。再次，这是一种防御重放攻击的可靠方法。\n\n### 传递哈希（Pass the hash）\n\
  \n传递哈希是一种认证攻击，可能用于在实际上并不知道或持有受害者凭据明文的情况下，作为授权用户的身份获取访问。这种攻击主要针对 Windows 系统，该系统在客户端上为其已认证的\
  \ Windows 域维护一组缓存凭据（这就是攻击名称中“哈希”一词所指的项，也称为认证令牌）。缓存凭据用于在下一次用户尝试登录时，认证域控制器不可用的情况下，授予用户访问本地系统和网络的权限。在这种情况下，将使用缓存凭据，并且每当域控制器上线时，域控制器都会自动接受该用户已通过妥当认证，因为该用户通过之前成功域登录时使用的缓存凭据获得了访问权限。尽管微软已实施了多次保护此过程的尝试，但黑客继续利用\
  \ Windows 操作系统的这种容错特性。\n\n攻击者从受害者系统的注册表（Registry）中提取缓存凭据，然后将这些凭据用于他们自己的伪造域客户端。这可能会欺骗域控制器使其接受攻击者为授权用户，即使该攻击实际上并没有参与任何认证过程。\n\
  \n此类攻击的缓解措施包括禁用缓存凭据、要求网络级认证（NLA）以及强制使用 `NTLMv2`（禁用 `NTLM`）。\n\n### 劫持及相关攻击\n\n劫持攻击是指攻击者接管合法会话的攻击。某些形式的劫持会断开客户端，而其他则让攻击者获得系统或服务的控制权。本节包含了与劫持相关的利用。\n\
  \n#### 点击劫持（Clickjacking）\n\n点击劫持是一种基于网页的攻击，导致用户的点击跳转到非预期的位置。这通常通过使用隐藏或不可见的层、框架或图像映射来实现。当用户看到此类项目或链接并点击鼠标时，点击被拦截并指向并非用户实际想要的地方。\n\
  \n点击劫持可用于钓鱼攻击、劫持、中间人攻击（MitM）。点击劫持的示例包括：在 Amazon 按钮后隐藏一个按钮；欺骗用户开启麦克风或摄像头；导致用户将社交媒体资料设置为公开；下载恶意软件（包括后门、根器和勒索软件）；以及虚假广告点击。\n\
  \n#### 会话劫持（Session hijacking）\n\nTCP/IP 劫持或会话劫持是攻击者接管现有通信会话的形式。根据攻击目的，攻击者可以扮演客户端或服务器。在大多数会话劫持形式中，通信对方（通常是客户端）会被断开——他们意识到自己无法通信且会话已中断。然而，他们可能不会立即意识到自己是会话劫持攻击的连带损害。一些用于执行会话劫持工具包括\
  \ `Ettercap`、`Cain`、`Juggernaut` 和 `Hunt`。\n\n图 1.9 显示了 TCP/IP 劫持攻击。\n\n![FIGURE\
  \ 1.9 TCP/IP 劫持攻击 ](img/c01f009.jpg)\n\nFIGURE 1.9 TCP/IP 劫持攻击 \n\n应对 TCP/IP 劫持攻击的措施包括使用加密协议并在会话期间进行定期重认证。此外，现代或安全的协议通常设计有预防功能，使会话劫持变得困难或不可能。这些功能包括复杂的非线性排序规则以及具有短超时值的时间戳。\n\
  \n#### URL 劫持（URL hijacking）\n\nURL 劫持或域名抢注（typo squatting）是在用户误输目标资源的域名或 IP 地址时捕获流量的手段。抢注者预测\
  \ URL 错误并注册这些域名，以将流量引导至自己的网站。这可能是出于竞争，也可能是出于恶意。用于抢注的变体包括常见的拼写错误（如 `googel.com`）、输入错误（如\
  \ `gooogle.com`）、名称或单词的变体（例如复数形式，如 `googles.com`）以及不同的顶级域（如 `google.org`）。\n\n\n\
  \n\n\nURL 劫持也是指显示一个看起来像知名产品、服务或网站的链接或广告的做法，但点击后它会将用户重定向到另一个位置、服务或产品。这可以通过发布网站和页面，并利用\
  \ SEO（搜索引擎优化）来使你的内容在搜索结果中排名靠前，或者通过使用广告软件，将合法的广告和链接替换为指向其他或恶意位置的链接来实现。\n\n## 域名抢注\
  \ (Typo squatting)\n\n参见上一一节，“URL 劫持”。\n\n## 驱动程序操控 (Driver manipulation)\n\n某些形式的恶意代码或攻击者入侵会利用一种被称为\
  \ `driver manipulation` 的软件操控形式。当恶意程序员编写系统或设备驱动程序使其根据某些条件产生不同的行为时，就会驱动程序操控。例如，系统基准工具可能用于测试计算机性能，但如果驱动程序被调整为仅在使用特定基准测试工具时提供良好的性能，那么这种对评估的滥用就属于驱动程序操控。这种操作最近发生在大众汽车身上，该公司设计其“节能”柴油引擎在测试时提供高性能测量，但在标准驾驶条件下以较低水平运行。\n\
  \n驱动程序操控可能由原始硬件供应商、原始软件设计者或第三方实施，无论是合法的系统设计者还是攻击者。驱动程序操控可以基于驱动程序内部的自定义代码，也可以基于利用驱动程序功能、能力或漏洞的非驱动程序软件，以实现预期的目标或效果。\n\
  \n驱动程序操控可用于实现特定目标或隐藏未实现特定目标的事实。驱动程序操控可用于优化性能或降低性能、提高安全或绕过安全、创建远程控制和后门漏洞，或阻止此类滥用的实施。\n\
  \n## 垫片 (Shimming)\n\n`Shimming` 是一种向系统注入替代或补偿代码，以便在不更改原始或现有代码的情况下更改其操作。一个粗略的比喻是，当新地板上的桌子不稳定时，可以使用垫片（shim）来支撑桌腿；这比重建或修改桌子本身要好。垫片可以作为现有软件或固件代码的快速修复，以便现场更改操作或在修改核心代码库之前测试新选项。\n\
  \n只要垫片接受来自前一个元素的输出，并能为接收元素产生可接受的输入，就可以插入两个编程对象或子程序之间的任何位置。垫片将拦截来自第一个元素的 API 调用、输出或消息，对捕获的信息集进行处理，然后生成符合下一个元素输入的输出。\n\
  \n垫片被广泛用于在硬件平台不再提供基本功能时支持遗留应用程序。垫片充当旧 API 和新 API 之间的兼容性接口。\n\n攻击者也可以利用垫片向操作系统环境中注入替代命令，添加监听和操纵的钩子（hooks），或简单地获得对目标的远程访问和控制。\n\
  \n## 重构 (Refactoring)\n\n`Refactoring` 是在不改变软件外部感知行为或产生结果的情况下，对软件代码进行限制或重新组织。重构侧重于改进软件的非功能性元素，例如质量属性、非行为需求、服务需求或约束。重构可以提高可读性、降低复杂度、便于故障排除，并简化未来的扩展和外接工作。重构可能简化内部程序逻辑，并消除隐藏或未解决的错误或弱点。\n\
  \n重构的目标包括保持相同的外部行为并且不引入新的错误或缺陷。\n\n重构是关于简化代码、消除冗余以及避免长长的、单式的代码结构。通过将计算机代码划分为不同的封装元素、模块、对象或子程序，程序员确保生成的代码更容易测试、验证和修改。重构被许多人视为经验丰富的程序员的关键行为。\n\
  \n重构也可以作为关注编程捷径或解决不优雅解决方案的手段。有时，为了让代码运行，程序员会通过使用捷径实际上在“作弊”，而不是编写更长有效完整的方法。起初可能很好，但代码中依赖这种作弊的元素越多，整个软件就变得越不稳定、不可靠。有些人称之为技术债，就像金钱一样，它可以积累利息并导致生成的软件不稳定或不安全。重构为程序员提供了机会使用正确的指令重新编写捷径，以便更可靠、完整地建模或构建行为。\n\
  \n缺乏重构可能会在代码中留下弱点或逻辑缺陷，攻击者可能会发现并利用它们来自己。这些缺陷可以使用模糊工具（fuzzing tools）发现；参见第 3 节“动态分析（例如，模糊测试）”。此类发现是未知漏洞和零日漏洞的基础，任何使用此类存在缺陷且不优雅软件的人都可能受到攻击。\n\
  \n## MAC 伪造 (MAC spoofing)\n\nMAC（介质访问控制）地址也被称为物理地址、硬件地址或以太网地址。MAC 地址通常是制造商分配给网卡（NIC）的\
  \ 48 位二进制数。MAC 地址由两个等大小的部分组成：OUI 和网卡特定数字。OUI（即组织唯一标识符）由 IEEE（电气与电子工程师学会）颁发给网卡供应商。然后，网卡供应商生成自己的网卡特定数字，该数字可能包含模型和构建版本以及每个设备的唯一值。然后，MAC\
  \ 地址被烧录在网卡的 ROM 芯片上。然而，由于以太网协议在计算机内存中运行，它从网卡读取此 ROM  MAC，但将其存储在软件配置位置（例如 Linux 中的\
  \ `CFG` 文件或 Windows 中的注册表）。\n\n可以监听网络并记录正在使用的 MAC 地址。然后可以通过修改网卡的 MAC 软件副本，将这些地址之一伪造到系统中。这会导致以太网驱动程序使用修改或伪造的\
  \ MAC 创建帧，而不是原始分配的 MAC。因此，伪造 MAC 地址非常简单。\n\nMAC 伪造用于仿充另一个系统（通常是有效或经过授权的网络设备），以绕过端口安全或\
  \ MAC 过滤限制。MAC 过滤是一种旨在限制或仅允许特定 MAC 地址的设备访问网络的安全机制。其意图是防止未经授权的参与网络通信。然而，一个名为 `macchanger`\
  \ 的简单 Linux 应用程序只需几次点击即可实现这一功能。在 Windows 平台上，Technitium MAC Address Changer 让 MAC\
  \ 伪造变得简单。如果网卡设备驱动程序支持，Windows 10 可能提供更改 MAC 地址的能力；要检查，查看适配器设备属性对话框的“高级”选项卡(图 1.10）。因此，MAC\
  \ 过滤并不是完整的安全解决方案，因为 MAC 伪造可以绕过这种防御措施。\n\n\n\n\nMAC 欺骗的防御措施包括：\n\n*   使用智能交换机来监控异常的\
  \ MAC 地址使用和滥用行为。\n*   使用网络入侵检测系统（NIDS）监控异常的 MAC 地址使用和滥用行为。\n*   维护设备及其 MAC 地址清单，以确认设备是经过授权的，还是未知的非法设备。\n\
  \n## IP 欺骗\n\n`Spoofing`（欺骗）是指伪造数据的行为。通常这种伪造涉及更改网络数据包的源地址。由于源地址被更改，受害者无法定位真实的攻击者或通信发起者。此外，通过伪造源地址，攻击者可以将数据包响应、回复和回显重定向到其他系统（如\
  \ Smurf、Fraggle 和 land DoS 攻击所示）。\n\nIP 欺骗主要有三种类型。一种方法是通过将源 IP 地址设置为某个无辜且未参与的第三方的地址，来构造攻击性的\
  \ IP 数据包。这种类型的 IP 欺骗将导致攻击者处于单向或的通信状态——来自主要受害者的任何响应都将发送给无辜的第三方。攻击事件的所有日志都将指向无辜的第三方设备，将其视为罪魁祸首。第二方法是对\
  \ IP 地址的所有者/用户进行 DoS 断开连接，然后在攻击系统上临时接管该 IP 地址。这为攻击者提供了双向通信，以便从主要目标获取信息。攻击结束后，该 IP\
  \ 地址将恢复到原始系统的正常使用。然而，日志文件会将攻击归咎于分配该 IP 地址的无辜第三方，而不是非法系统。第三方法涉及使用当前未分配给任何有效授权系统的子网中的\
  \ IP 地址。这种方法同样赋予了攻击双向通信，但日志显示未分配的地址是攻击源，这清楚地表明某台非法机器一直在使用该地址进行攻击。\n\n针对 IP 欺骗攻击的防御措施包括：\n\
  \n*   丢弃边界系统接收到的源目的地位于私有网络内部的入站数据包（这表明存在欺骗）。\n*   丢弃边界系统接收到的源目的地位于私有网络外部的出站数据包（这同样表明存在欺骗）。\n\
  *   如果数据包头中包含 LAN 地址且该 LAN 地址未正式分配给有效系统，则丢弃所有此类数据包。\n*   运行 NIDS 以监控 IP 地址使用位置的变化。\n\
  \n## 无线攻击\n\n无线通信是一个快速发展的网络、连接、通信和数据交换技术领域。字面上，数以千计的协议、标准和技术都可以标记为无线。这些包括手机、蓝牙、无线电话和无线网络。随着无线技术的不断泛殖，组织的安全工作不能局限于锁定本地网络。安全应该是一种端到端的解决方案，解决所有形式、方法和技术的通信问题。\n\
  \n无线网络在企业和家庭网络中已变得常见。妥善管理无线网络以实现可靠访问和安全并不总是一件易事。本节将探讨各种无线安全问题。\n\n### 重放\n\n`replay\
  \ attack`（重放攻击）是重传捕获的通信，希望获得访问目标系统的权限。这一概念在本章之前的“应用/服务攻击”和“重放”章节中讨论过。\n\n针对无线环境的重放攻击可能专门关注对初始身份验证的滥用。然而，存在许多其他无线重放攻击变体。它们包括拦截典型客户端的新连接请求，然后重放该请求，以欺骗基站做出，仿佛另一个新的客户端连接请求已启动。无线重放攻击还可以通过向基站重传连接请求或资源请求来关注\
  \ DoS，以便使其忙于管理新连接，而不是维护和为现有连接提供服务。\n\n通过保持基站固件更新以及运行针对无线的 NIDS 可以缓解无线重放攻击。`W-IDS`\
  \ 或 `W-NIDS` 能够检测此类滥用行为并及时通知管理员情况。\n\n### IV\n\n`IV` 代表 `initialization vector`（初始化向量），这是一个加密术语，指随机数。大多数加密函数使用\
  \ IV 以通过减少预测性和重复性来提高安全性。当 IV 较短、以明文传输或选择不当时时，它就会成为安全弱点。`IV` 攻击是利用了处理方式。因此，`IV` 攻击是针对\
  \ `IV` 处理不当的利用。`IV` 攻击的一个例子是破解 WEP（无线等效隐私）加密。WEP 是 802.11 无线网络的原始加密选项。它基于 RC4。然而，由于设计和实现上的错误，WEP\
  \ 的主要缺陷与 `IV` 有关。WEP 的 `IV` 仅 24 位且以明文传输。这结合 WEP 不检查数据包新鲜性的事实，使得实时破解 WEP 可以在 60\
  \ 秒内成功（参见 Aircrack-ng 工具）。\n\n### 恶意双生\n\n`Evil twin`（恶意双生）攻击是指黑客运行虚假接入点，根据客户端请求克隆（或双生）接入点的身份。每当设备成功连接到无线网络时，它会在记录中保留无线配置文件。这些无线配置文件用于在进入基站范围内自动重连。每当设备的无线适配器启用时，它都会连接网络，因此会对记录中的每个网络发送重连请求。这些重连请求包含了原始基站的\
  \ MAC 地址和网络的 SSID。恶意双生攻击系统监听这些重连请求的无线信号。一旦恶意双生看到重连请求，就会伪造这些参数并为客户端提供明文连接。客户端接受请求并与假的恶意双生基站建立连接。这使得黑客能够通过中间攻击监听通信，可能导致会话劫持、数据篡改、凭据盗取和身份窃。\n\
  \n这种攻击之所以有效，是因为身份验证和加密是由基站管理的，而不是由客户端强制。因此，尽管客户端的无线配置文件包含身份凭据和加密信息，客户端也会接受基站提供的任何类型的连接。\n\
  \n为了防御恶意双生攻击，请注意你的设备连接的无线网络。如果你连接到一个已知并非附近的网络，这很可能表明你正受到攻击。请断开连接并去其他地方访问互联网。你还应该从列表中删除不必要和旧的无线配置文件，以减少攻击者的目标选择。\n\
  \n### 非法 AP\n\n在现场勘测中经常发现的安全问题是存在“非法无线接入点”（rogue wireless access points）。非法 `WAP`\
  \ 可能是员工为了方便而放置的，也可能是攻击者从外部运行的。\n\n\n\n\n员工部署的无线接入点可以连接到任何开放的网络端口。此类未经授权的接入点通常没有进行安全配置，或者即使配置了，其配置也不恰当，或与组织批准的接入点不符。应该发现并移除非法无线接入点，以消除通往你原本受保护的网络不受监管的访问路径。\n\
  \n攻击者通常会找到访问公司的方法（通过作为员工的朋友，或者通过参加公司参观、伪装成维修技术人员或早餐塔可销售员，甚至在半夜闯入），以便部署一个非法接入点。一旦安置了非法接入点，攻击者就可以从距离你正门一段适中的距离处轻松进入网络。\n\
  \n攻击者还可以在外部部署非法无线接入点（WAP），以针对现有的无线客户端或未来访客的无线客户端。针对现有无线客户端的攻击要求将非法 WAP 配置为复制合法 WAP\
  \ 的 `SSID`、`MAC address` 和无线信道，尽管其运行功率等级更高。这可能导致保存了无线配置文件的客户端无意中选择或偏于连接到非法 WAP，而不是原始合法\
  \ WAP。\n\n第二种方法侧重于吸引新的访客无线客户端。这种类型的非法 WAP 通过社交工程技巧进行配置，将 `SSID` 设置为一个看似合法甚至优于原始合法无线网络\
  \ `SSID` 的替代名称。例如，如果原始 `SSID` 是“ABCcafe”，那么非法 WAP 的 `SSID` 就可以是“ABCcafe-2”、“ABCcafe-LTE”或“ABCcafe-VIP”。非法\
  \ WAP 的 `MAC address` 和信道不需要是原始 WAP 的克隆。这些替代名称对于新访客来说可能像是更好的网络选项，从而诱骗他们选择连接到虚假网络而非合法网络。\n\
  \n防御非法 WAP 的方法是识别正确有效的 `SSID`。此外，组织运行无线入侵检测系统（IDS）来监控无线信号的滥用情况也是有益的，例如新出现的 WAP，特别是那些使用模仿或相似\
  \ `SSID` 和 `MAC` 运行的 WAP。\n\n## 干扰\n\n无线通信利用无线电波进行距离信号传输。无线电频谱是有限的；因此必须对其进行善管理，以允许多个并发连接且产生产生或没有干扰。无线频谱使用\
  \ `frequency` 进行测量或区分。频率是特定时间内波振荡次数的测量值，使用的单位是赫兹（Hz），即每秒振荡次数。无线电波的频率在 3 Hz 到 300\
  \ GHz 之间。不同范围的频率被指定用于特定用途，例如 AM 和 FM 广播电台、VHF 和 UHF 电视等。目前，900 MHz、2.4 GHz 和 5 GHz\
  \ 频率在商业无线产品中最常用，因为它们属于无许可分类。然而，为了管理有限无线电频率的并发使用，开发了多种频谱使用技术。这些包括`扩频 (spread spectrum)`、`跳频扩频\
  \ (FHSS)`、`直接序列扩频 (DSSS)` 以及`正交频分复用 (OFDM)`。\n\n`spread spectrum`（扩频）意味着通信在多个频率上同时进行。因此消息被分成若干部分，每部分同时发送但使用不同的频率。从本质上说这是并行通信而非串行通信。\n\
  \n跳频扩频（`FHSS`）是扩频概念的早期实现。然而，它不是以并行方式发送数据，而是以串行方式传输数据，同时不断改变使用的频率。它利用整个可用频率范围，但一次只使用一个频率。当发送者从一个频率切换到下一个频率时，接收器必须遵循相同的跳频模式来获取信号。FHSS\
  \ 的目的是通过不断转换频率而非仅使用可能受影响的单一频率来帮助减少干扰。\n\n直接序列扩频（`DSSS`）同时并行利用多个可用频率。这提供了比 FHSS 更高的数据吞吐量。DSSS\
  \ 还使用一种名为 `chipping code` 的特殊编码机制，允许接收器即使在信号部分因干扰而失真也能重建数据。这发生的情况与 `RAID 5` 的校验位允许重建丢失驱动器上的数据的方式非常相似。\n\
  \n正交频分复用（`OFDM`）是频率使用的另一种变体。OFDM 采用数字多载波调制方案，允许更紧凑的传输。调制后的信号是正交的（orthogonal），因此它们之间互不产生干扰。最终，OFDM\
  \ 需要较小的频率范围（即 `channel bands`），但可以提供更大的数据吞吐量。\n\n干扰可能是意外或故意的。故意干扰是干扰的一种形式。`Jamming`（干扰）是通过传输无线电信号，通过降低有效信噪比来防止可靠通信。为了避免或减少干扰和阻塞，首先从调整设备的物理位置开始。接下来，检查是否有使用相同频率和/或信道的设备。如果有冲突，更改你控制的设备上使用的频率或信道。如果正在发生干扰攻击，尝试对攻击源进行三角测量并采取适当措施解决问题——即如果问题源于你的物理位置之外，请联系执法部门。\n\
  \n## WPS\n\n`WiFi Protected Setup (WPS)` 是一种无线网络的安全标准。它旨在简化向安全性良好的无线网络添加新客户端的工作量。它的工作原理是，在管理员通过按下基站上的\
  \ WPS 按钮触发该功能后，自动连接第一个搜索网络的新无线客户端。然而，该标准还要求提供代码或 `PIN`，可以远程发送到基站，以触发 WPS 协商，而无需物理按下按钮。这可能导致暴力破解攻击，使黑客能够在几小时内（通常小于\
  \ 6 小时）猜出 WPS 代码，从而使黑客将自己的未经授权的系统连接到无线网络。\n\nWPS 是大多数无线接入点默认开启的功能，因为它是设备 WiFi 联盟认证的要求。作为以安全为导向的部署前流程的一部分，禁用它是重要的。如果设备未提供关闭\
  \ WPS 的功能（或开关不起作用），请升级或替换基站的固件，或更换整个设备。\n\n通常，请保持 WPS 关闭。每当你升级固件时，再次执行一次以安全为导向的部署前流程，以确保包括\
  \ WPS 在内的所有设置都设置正确。如果你需要向网络添加大量客户端，可以临时重新启用 WPS——只需确保在之后立即禁用即可。\n\n## Bluejacking\n\
  \n\n\n\n\n`Bluejacking` 指在未经所有者/用户许可的情况下，向具备蓝牙功能的设备发送消息。这些消息通常会自动出现在设备的屏幕上。几乎任何支持蓝牙的设备，如\
  \ PDA、手机甚至笔记本电脑，都能接收到蓝击攻击消息。大多数 `bluejacking` 涉及通过对象交换（`OBEX`）协议（该协议也用于红外通信）向目标设备发送\
  \ `vCard`（虚拟名片）。许多小型便携设备仅配备 `1 mW` 功率天线，蓝牙访问范围可能在 `10 meters` 或更短范围内；而在笔记本电脑上，蓝牙访问范围可达\
  \ `100 meters`（得益于 `100 mW` 功率天线）。然而，使用强传输天线可以超过这些距离，实现一英里或更远的距离。\n\n`bluejack`\
  \ 消息通常放置在 `vCard` 的名称字段中，几乎没有其他内容。这使得消息被限制为短文本字符串。但这种花招仍可用于各种恶作剧、调侃和广告。一些支持多媒体消息的手机还能接收图像和声音。`Bluejacking`\
  \ 大多是无害的，因为它不包含恶意代码——至少到目前为止如此。\n\n许多设备都配置了针对 `bluejacking` 的防御，不会自动接受来自未知（即未配对）源的蓝牙消息。相反，你可能会看到警告，提示已收到来自未知设备的消息，并询问你想要接受还是拒绝该消息。你也可以在不活动使用时关闭蓝牙来减少暴露风险。\n\
  \n所有蓝牙设备都容易受到 `bluejacking` 攻击，因为这只是消息或公告的传输。其他受到广泛关注的蓝牙攻击包括 `bluesniffing` 和 `bluesmacking`。`Bluesniffing`\
  \ 是对蓝牙通信进行窃听或数据包捕。由于蓝牙大多是明文，这种攻击允许攻击者监控你的蓝牙活动，例如击键、通话等。`Bluesmacking` 是一种针对蓝牙设备的\
  \ `DoS` 攻击。防御这些风险的措施是尽量减少蓝牙的使用，特别是在公共场所。\n\n### Bluesnarfing\n\n`Bluesnarfing` 是通过蓝牙连接对数据进行未经授权的访问。通常\
  \ `bluejacking` 术语被误用来描述或标记 `bluesnarfing` 活动。针对 PDA、手机和笔记本电脑的成功 `bluesnarfing`\
  \ 攻击能够提取日历、联系人列表、短信、电子邮件、图片、视频等。由于 `bluesnarfing` 涉及窃取数据，它在大多数国家都是非法的。\n\n`Bluesnarfing`\
  \ 通常发生在黑客系统与目标设备之间的配对链路上。如果设备未被设置为对公众可见（即可发现）或未允许配对，通常无法进行 `bluesnarfing`。曾经存在一个蓝牙漏洞，可以利用它对设置为私密的手机进行\
  \ `bluesnarfing`，但该漏洞早已被修复。确实，如果你知道蓝牙的蓝牙 `MAC addresses`，即使是对不可发现的设备也可能进行 `bluesnarfing`，但这通常不是一种实用的攻击，因为必须猜中\
  \ `48-bit` 地址。\n\n另一个有趣的蓝牙攻击是 `bluebugging`。这种攻击允许攻击者通过蓝牙连接对你的设备硬件和软件进行远程控制。该名称源于在受攻击系统中开启麦克风，以便将其作为远程无线监听器。\n\
  \n`Bluesnarfing` 和 `bluebugging` 攻击并非基于蓝牙的固有缺陷，而是基于特定设备实现中的漏洞。因此，这些利用程序并不常见，但如果你的设备存在漏洞，它们就是严重的。务必保持固件更新，以最小化风险。\n\
  \n### RFID\n\n`RFID (Radio Frequency Identification)` 是一种追踪技术，其原理是在放置磁场中时，利用天线产生的电流为无线发射器供电（图\
  \ 1.11）。RFID 可以从很远的地方（通常为数百米）被触发/供电并读取。RFID 可以附加或集成到笔记本电脑、平板电脑、路由器、交换机、USB 闪盘、便携硬盘等设备的结构中。这允许在无需与设备直接接触的情况下进行快速库存跟踪。只需带着\
  \ RFID 读写器进入房间，即可收集区域内激活芯片传输的信息。\n\n![FIGURE 1.11 An RFID antenna ](img/c01f011.jpg)\n\
  \n`FIGURE 1.11 An RFID antenna` (`[#c01.xhtml#figure1-11]`)\n\n`[`electrosome.com/rfid-frequency-identification/`](https://electrosome.com/rfid-frequency-identification/)`\n\
  \n人们担心 RFID 可能会成为一种侵犯隐私的技术。\n\n### NFC\n\n`Near field communication (NFC)` 是一种在近距离设备之间建立无线通信的标准。它允许你通过将设备相互接触或将它们靠在几英寸的范围内来实现设备间的某种自动同步和关联。NFC\
  \ 是 RFID 的衍生技术，其本身是一种场电电或触发设备。\n\nNFC 常见于智能手机和许多移动设备配件。它通常用于执行设备间的数据交换、建立直接通信，或通过连接无线接入点访问更复杂的服务（如\
  \ `WPA-2` 加密无线网络）。由于 NFC 是基于无线的技术，它并非没有漏洞。NFC 攻击包括中间人攻击、窃听、数据操纵和重放攻击。\n\n### Disassociation\n\
  \n`Disassociation`（取消关联）是许多无线管理帧类型之一。取消关联可用于多种无线攻击形式，包括：\n\n*   对于具有隐藏 SSID 的网络，会将一个伪造为\
  \ `WAP` `MAC address` 的取消关联包发送到连接的客户端，导致客户端丢失连接并发送重关联请求包（Reassociation Request），该包包含明文的\
  \ SSID。\n*   攻击可以向客户端发送重复的取消关联帧以防止重关联，从而导致 `DoS`。\n*   可以通过使用取消关联帧启动会话劫持，保持客户端处于断开状态，同时攻击者冒充客户端并接管其与\
  \ `WAP` 的无线会话。\n*   可以使用取消关联帧断开客户端来实现中间人攻击。然后攻击者使用与原始 `WAP` 相同的 SSID 和 MAC 从其伪造/假的\
  \ `WAP` 提供更强的信号；一旦客户端连接到假 `WAP`，攻击者再连接到真实的 `WAP`。\n\n防御这些攻击的主要措施是运行无线 `IDS`，监控无线滥用行为。\n\
  \n\n\n\n密码是最常见的身份验证形式；同时，它们也是最弱的形式。仅仅依赖密码并非真正的安全。密码的强度通常通过通过各种形式的加密攻击破解密码所需的时间和精力来衡量。这些攻击统称为\
  \ `password cracking`（密码破解）或 `password guessing`（密码猜测）。弱密码通常只使用字母和数字；经常使用字典或其他常用词；并可能包含与用户资料相关的信息，如出生日期、社会安全号码和宠物名称。强密码更长、更复杂且唯一，并会定期更换。\n\
  \n至少有四种攻击方法被用于窃取或破解密码。所有方法都涉及 `reverse hash matching`（反向哈希匹配）。这是直接从认证服务器的账户数据库中窃取密码的哈值，或从网络流量中提取它，然后逆向还原原始密码。这是通过获取潜在密码、对其进行哈希，然后将窃取的哈值与潜在密码的哈希进行比较来实现。如果找到匹配项，则潜在密码可能是实际密码。（顺便说一下，即使潜在密码不是实际密码，如果它恰好产生了相同的哈值，也会被认证系统接受为有效密码。）四种密码破解或猜测攻击分别是\
  \ `brute force`（暴力破解，又称 `birthday attack` 生日攻击）、`dictionary, hybrid`（字典、混合）和 `rainbow\
  \ tables`（彩虹表）。\n\n本节深入探讨这四种主要的密码破解技术，以及相关问题以及其他专注于滥用加密保护数据的攻击。\n\n## 生日\n\n`brute\
  \ force or birthday attack`（暴力破解或生日攻击）用于哈希以及涉及有限集合（哈希值或密钥）的其他加密形式。生日攻击名称源于一个利用共享生日数学概率的酒吧赌约。（这个赌约的内容是：如果酒吧里有两个人的生日相同，你就可以免费喝酒；否则，你要为全场买一轮酒。）然而，这个赌约源于生日统计悖论，该悖论属于数学中的\
  \ `probability theory`（概率论）领域。\n\n问题在于，由于只有 366 种可能的生日（不要忘记闰年！），随着人数的增加，两个人共享相同出生月份和日期的概率呈指数级增长。只需\
  \ 23 个人就有 50% 的概率其中两人生日相同，而只需要 75 个人就能达到 99.9% 的概率。当这种逻辑应用于破解密码（或加密密钥）时，它表明由于目标是有限集合的一部分（是的，规模很大，但仍然是有限的），猜中的概率会随每次猜测而增加。换句话说，每次错误的猜测都会从剩余池中移除一个选项，因此下一次猜测正确的概率略有增加。这就是为什么暴力攻击是成功的——只要有足够的时间进行猜测，成功的概率就会不断增加。\n\
  \n生日攻击可以针对任何对哈希的使用。然而，它们最常用于密码猜测攻击（将在在下一节中讨论）。在密码猜测攻击中，程序会将可能的密码与存储在账户数据库中的密码进行比较。但存储在账户数据库中的密码是安全的，因为那里只存储了它们的哈希值。因此，密码破解程序在扫描账户数据库查找匹配项之前，首先会对每个可能的密码执行与安全系统所相同的哈希函数。如果找到匹配项，则密码猜测工具就根据\
  \ `f(M)=f(M')` 属性发现了密码。这更具体地被称为 `birthday attack`（生日攻击）。\n\n## 已知明文/密文\n\n`plain\
  \ text`（明文）和 `cipher text`（密文）攻击侧重于对称加密，攻击者已知部分明文和对应的密文。目标是确定密钥。\n\n该操作涉及三个主要组件：`plain\
  \ text`（明文）、`algorithm`（算法）和 `cipher text`（密文）。一旦攻击者知道其中两个，就可以求解最后一部分。已知明文攻击始于已知数据，然后对其进行加密。攻击者获取\
  \ `cipher text`（密文）。\n\n这种攻击的已知文本版本是相同的过程，只是方向相反。攻击者已知 `cipher text`（密文）和 `algorithm`（算法）。受害者使用密钥解密数据产生\
  \ `plain text`（明文）。同样，还有一种变体被称为 `chosen plain text`（选择明文），即攻击者向受害者提供数据集以产生 `cipher\
  \ text`。\n\n## 彩虹表\n\n传统上，密码破解对每个密码进行哈希处理，然后执行 `Exclusive Or (XOR)`（异或）比较以与窃取的哈值进行检查。哈希过程比\
  \ `XOR` 过程慢得多，因此破解密码花费的时间 99.99% 花在了生成哈希上。新的密码破解形式被开发出来，以从破解时间中消除哈希时间。这种技术被称为 `rainbow\
  \ tables`（彩虹表）。\n\n彩虹表利用了被称为 `hash chain`（哈希链）的概念。构建哈希链使用初始起始密码（通常随机选择），然后对起始密码进行哈希处理。然后使用名为\
  \ `reduction function`（还原函数）的过程将哈值转换为新密码。（注意哈希是不可逆的；它们是单向操作，因此 `reduction function`\
  \ 不会重建原始密码，而是创建一个。）这个过程（将密码哈希为新密码）重复多次。哈希链可以由几个链接组成，也可以由几千个链接组成。完成后，只保留每个链的起始和结束密码。产生许多独特的哈希链是为了涵盖大部分或所有受攻击哈希算法（密码系统）有效范围内的潜在密码和哈值。\n\
  \n一旦构建了彩虹表哈希链数据库，就可以破解从受害者处获取的哈值。攻击者首先将窃取的哈值通过 `reduction function`，然后检查该值是否匹配任何哈希链的结束或停止元素。如果是，则攻击者知道密码的明文在该链中。如果不是，攻击者将执行另一组哈希和还原函数并再次检查。最终将发现匹配的哈希链结尾。\n\
  \n\n\n\n\n一旦确定了正确的哈希链，攻击者就会开始链计算，再次从链的原始起始值开始，并执行哈希和归约操作，直到遇到被盗的哈希值。一旦实现这一目标，攻击者就知道了生成与被盗哈希值匹配的直接前一个密码，从而破解了该密码哈希。\n\
  \n尽管这个过程看起来可能复杂甚至迂回，但它最终是一种相当高效的破解密码的方法。然而，彩虹表确实有其局限性。很难判断特定的哈希链集是否足以覆盖或处理给定哈希的所有或甚至大多数潜在密码。彩虹表的大小取决于可能密码的范围、字符选项以及密码的长度。对于糟糕的密码哈希算法——例如\
  \ `LM`（语言管理器，微软 Windows 中最旧且现已弃用的函数）——完整的彩虹表仅有 64 GB。一个覆盖 `NTLM` 密码的彩虹表——仅限于美国键盘字符（95\
  \ 个唯一选项）和长度为 1-8 的密码——至少需要 16 EB（或 16,000,000,000,000,000,000 字节）。\n\n有时彩虹表会与预计算哈希数据库混淆。一个包含所有可能的输入密码及其相应输出哈希的数据库比彩虹表大得多。\n\
  \n为了保护自己免受这种威胁，请将所有密码更改为至少 16 个字符，并混合使用字符类型——大写字母、小写字母、数字和符号（如果支持）。还要确保对于在线网站、服务或内部本地网络系统，每次登录都使用唯一的密码。只要可用，使用多因素身份验证。\n\
  \n## 字典\n\n`字典攻击`（图 1.12）通过使用预定义的可能密码列表来猜测密码。密码列表可以包含数百万个可能的密码。密码列表或字典通常是围绕主题构建的。因此，如果攻击者了解关于你的个人基本信息，他们就可以尝试利用人性倾向于使用你常用或熟悉的单词来选择密码的特点。例如，如果攻击者知道你从事于医疗行业、养猫并且喜欢航海，他们就可以选择包含这些主题常见单词、缩写和短语的密码字典。\n\
  \n![FIGURE 1.12 Cain & Abel 的字典攻击配置页](img/c01f012.jpg)\n\n`FIGURE 1.12 Cain & Abel\
  \ 的字典攻击配置页 \n\n对于没有接受过创建复杂密码方法和技能训练的用户，字典攻击异常地有效。这些攻击非常简单，因为它们只尝试以列表中的原始形式测试密码。例如，“password”、“Password”和“PASSWORD”都是不同的，因为大写字母和小写字母具有不同的\
  \ ASCII 值。因此，除非字典列表中包含所有的大小写变体，否则字典攻击将不会测试这些变体。只有字典列表中包含的特定密码构造会被用于攻击目标密码哈希。\n\n\
  某些字典列表尝试包含迄为止被盗的所有密码和所有有效单词（来自实际字典、公有书籍或在线百科全书），以涵盖广泛的潜在密码和受害者选择密码的想法。其中一个列表可以在\
  \ [crackstation.net](http://crackstation.net) 获取，那里可以下载包含近 15 亿个密码的列表。使用这些聚合密码列表对于渗透测试和创建加固环境至关重要。伦理渗透测试人员和系统管理员在进行安全测试时应使用仅包含密码的字典列表，同时避免包含用户名和其他个人身份信息（PII）元素的列表。字典攻击是相对较快的操作，但对于对密码安全有了解或其系统强制了合理密码长度和复杂性的目标，其成功率较低。\n\
  \n## 暴力破解\n\n`暴力破解攻击`（图 1.13）旨在尝试每种可能的有效字符组合来构造可能的密码，从单个字符开始，随着过程不断添加字符，试图发现用户账户使用的特定密码。在时间足够的情况下，此类攻击总是成功的。虽然通过暴力破解方法可以惊人的速度发现简单短的密码，但更长且复杂的密码可能需要极其长时间。\n\
  \n![FIGURE 1.13 Cain & Abel 的字典攻击配置页](img/c01f013.jpg)\n\n`FIGURE 1.13 Cain & Abel\
  \ 的字典攻击配置页 \n\n更长且复杂的密码会让暴力破解攻击的成功率降低。然而，只要时间足够，暴力破解总会成功。但对于足够长的目标密码（16 个或更多字符），暴力破解攻击变得不切实际。暴力破解攻击的一个重要变体是混合破解攻击。`混合攻击`使用字典列表作为密码源，但使用暴力破解技术在逐渐增加的级别上进行修改。例如，第一轮对每个源密码进行所有可能的单字符修改，然后第二轮进行所有可能的双字符修改，依此类推。这包括替换字符以及添加字符。混合方法的好处在于，它专注于目标用户根据其兴趣和背景可能使用的单词，而不是尝试所有可能的组合。\n\
  \n混合密码攻击对于那些被迫遵守公司密码策略的用户最有效，例如最小长度 9 个字符，且四种字符类型每种至少两个示例。大多数用户并不知道密码复杂性为什么重要，公司培训计划也没有提供足够的关于选择密码的信息。因此，典型的人会通过选择一个他们容易记住的单词来遵循要求，然后进行修改直到符合要求。例如，如果用户选择单词“password”作为基础词，只需通过六次更改或添加字符，他们就能产生“P@5sw0Rd!”，这符合最小\
  \ 9 位且每种字符类型包含两个示例的密码策略。然而，这个密码非常糟糕，因为它基于字典列表中可能包含的最常见的单词之一，且仅仅是一个六次更改/字符变体。典型的混合攻击在字典列表中到达基础词后，不到\
  \ 1 秒钟就能找到该用户的密码。\n\n\n\n\n\n我们必须选择更好的密码来防御混合攻击。一种方法是选择三到五个单词并将它们连接（在技术上现在这被称为密码短语），然后进行足够的字符更改以满足复杂度要求。这种方法远优于仅使用单个基础词，主要因为结果长度通常在\
  \ 10 到 25 个字符之间。\n\n| 密码示例 | 预计破解时间 |\n| --- | --- |\n| montyp99 | 几分钟 |\n| monty\
  \ python grail | 几年 |\n| monty python movie holy grail | 世纪 |\n| Monty Python 1975\
  \ and the Holy Grail! | 千千年 |\n\n### 在线 vs. 离线\n\n在线密码攻击针对提示符中的实时登录。在此类攻击中，攻击者提交凭据，这些凭据将由目标系统的身份验证服务处理。如果凭据正确，攻击者就成功伪装了用户。如果不正确，则会发生登录拒绝错误。大多数登录提示允许用户进行多次尝试提供正确的凭据。然而，系统管理员不想授予无限尝试，因为这会让黑客能够持续猜测受害者的凭据。因此，在大多数情况下，会配置\
  \ `account lockout`（账户锁定）。\n\n账户锁定是一种安全机制，在账户被锁定（禁用使用）之前提供固定次数的登录尝试。通常允许在触发账户锁定之前进行三次登录事件。一旦触发锁定，它可以持续特定的分钟数（例如\
  \ 15 分钟），或无限持续。如果账户锁定被设置为无限时间限制，管理员将需要手动禁用锁定状态，以便将账户恢复到可用状态。请记住，这些只是锁定的基础知识。某些形式的锁定会完全锁定账户，而另一些则仅锁定当前的源尝试位置（因此可以使用另一个位置或设备尝试尝试登录）。某些锁定会禁用主要的登录方式（如指纹）并回退到备用方法（如密码）。某些锁定系统还提供用户锁定清除过程（类似于密码恢复），这可能涉及短信或电子邮件恢复码，或回答身份验证安全问题。某些锁定系统在登录尝试之间使用递增的延迟，使得第三次失败导致\
  \ 5 分钟的延迟，第四次导致 15 分钟延迟，第五次导致 30 分钟延迟，依此类推。\n\n离线攻击是指攻击者并非针对实时目标系统工作，而是在自己独立的计算机上工作。攻击者必须已经获得了目标的密码哈希并将其传输到自己的计算机上。收集哈希是一项挑战性任务，因为大多数系统专门设计用于防止哈希窃。它们存储在加密的身份验证数据库中，并仅通过加密通道通过网络传输。因此，攻击者必须使用巧妙的技术来访问哈希。这些包括直接物理接触目标系统、使用远程控制工具从内存或网络流量中提取哈希，或者获取系统文件的备份。\n\
  \n一旦攻击者获得了密码哈希，密码破解操作就可以攻击者自己的计算机上进行，可以使用 CPU 或 GPU，也可以使用云计算服务（如 Amazon EC2 服务）。离线攻击不受账户锁定的影响或限制，因为该安全功能是身份验证服务的一部分，而不是哈希本身。因此攻击者对密码的数量没有限制。\n\
  \n### 冲突\n\n当两个操作产生相同的结果时，就会发生 `collision`（冲突）。冲突发生在加密和哈希处理中。当两个操作产生相同的密文时，就发生了冲突。这可能表明加密系统实现不当。一个安全的加密系统将保证，即使你尝试使用相同的密钥再次加密相同的消息，随机化函数（称为\
  \ `IV`）也会确保每次生成的密文都是唯一的。加密冲突也可能表明密钥没有以临时方式使用。\n\n哈希冲突更有可能是讨论或关注的焦点。当由相同算法哈希的两个数据集产生相同的哈希值时，就会发生哈希冲突。哈希冲突始终可能发生，因为它是一个接受任何输入并产生固定长度输出的过程。因此，关键在于理解正确使用哈希以避免此类情况发生。\n\
  \n哈希冲突的设计是为了防止人们无法察觉或忽略的损坏、更改或伪造。为了这一目的，哈希算法采用了称为 `avalanche effects`（雪崩效应）的特征，确保输入中的微小变化会产生输出的巨大变化。因此，如果前后的哈希不匹配，则当前数据集与原始数据集不同。然而，如果前后的哈希匹配，在接受当前数据为原始数据之前，仍有一个额外的步骤。该步骤是查看数据，如果它看起来不像原始数据，那么哈希匹配的出现就是冲突。因此，这意味着数据被替换成了另一个产生相同哈希的不同数据集。在这种情况下，数据仍然应该被丢弃，因为它显然不是原始数据。只有当前后的哈希匹配且当前数据看起来像原始数据时，你才能接受当前数据是有效且未更改的（即它保持了完整性）。\n\
  \n哈希冲突攻击旨在欺骗受害者接受一个替代数据集，仅仅因为它恰好产生了相同的哈希值。这只有在受害者在检查哈希值之外不查看数据时才会发生。与较长的哈希（如 512\
  \ 位）相比，较短的哈希（如 128 位）更容易发生哈希冲突。因此，在选择哈希算法时，使用产生最长哈希的可用选项。\n\n\n\n\n\n`downgrade\
  \ attack`（降级攻击）试图阻止客户端与服务器协商健壮的高级加密。这种攻击可以使用实时流量操纵技术或通过中间人攻击（伪造代理）进行，目的是强行将尝试的协商降级到较低的算法和密钥交换/生成水平。通过阻止客户端建立高级加密会话，攻击者即使在建立“加密”会话后，能够继续监听和操纵对话。如果客户端和服务器都保留了为了向后兼容而设计的旧加密选项，那么这种攻击就是可能的。如果攻击者能够强制协商选择这些旧选项，那么攻击者就可能利用旧方案中的已知漏洞。降级攻击的一个例子是针对\
  \ `SSL/TLS` 的，攻击者使用一种名为 `POODLE attack` 的技术。POODLE 的是“降级旧加密的填充 Oracle 攻击”（Padding\
  \ Oracle On Downgraded Legacy Encryption）。POODLE 会导致客户端退回到使用 `SSL 3.0`，它具有比 `TLS`\
  \ 不健壮的加密密码套件选项。\n\n防御降级攻击的最佳方法是禁用对旧加密选项的支持以及与不安全系统的向后兼容。\n\n## 重放 (Replay)\n\n`replay\
  \ attack`（重放攻击）发生在攻击者捕获数据包并将其重新传输或重放回网络中的情况。重放攻击通常关注身份验证包，目标是虚假地获得系统或服务的访问权限。在重放（或播放）攻击中，攻击者并不获取受害者的凭据知识。相反，攻击者持有包含凭据的数据包，然后将它们重新发送到网络，希望欺骗身份验证服务，授予攻击者与原始用户（受害者）相同的访问权限。\n\
  \n重放攻击大多局限于遗留系统和服务，，因为大多数现代身份验证的实现方式都集成了针对重放攻击的特定防御措施。这些防御措施包括在数据包中使用短时间戳使其仅在几秒钟内有效、使用随机的一次性使用挑战-响应对话（即向客户端系统发送一个随机数，该系统必须计算响应），以及使用一次性使用的临时会话加密密钥。\n\
  \n## 弱质的实现 (Weak Implementations)\n\n现代密码学系统的大多数失败都是由于糟糕或 `weak implementations`（弱点实现），而不是算法本身的真正失败。大多数软件产品采用的算法已经经过了广泛审查，并经受住了专注分析和攻击。因此，软件产品未能提供可靠安全的任何失败都归于编程错误或实现过程中的错误。\n\
  \n在软件中正确实现产生真正随机且不可预测密钥的随机化函数是具有挑战性的。一些程序员忽略了这种复杂性（这是非常重要的），并依赖于执行环境提供的简单且可预测的“随机化”函数。其他失败还包括在多个数据集或会话中重用密钥、按顺序或其他使用模式使用密钥、以不安全的方式存储密钥，以及以不安全的方式分或交换密钥。所有这些问题都有解决方案，大部分是采用安全编码实践，并咨询其他专家程序以获取避免常见编程陷阱的提示建议。将新代码提交给其他熟练的程序员和密码学领域专家（SME）进行彻底审查和分析也会有所帮助。\n\
  \n## 考试要点 (Exam Essentials)\n\n**理解社会工程学。** `Social engineering`（社会工程学）是一种利用人性和人类行为的攻击形式。社会工程学攻击主要有两种形式：说服某执行未经授权的操作或说服他们泄露机密信息。\n\
  \n**理解网络钓鱼。** 网络钓鱼是试图通过电子通信（通常是电子邮件）中假装成可靠实体（例如，银行、服务提供商或商户）来获取敏感信息（如用户名、密码、信用卡详情或其他个人身份信息\
  \ (PII)的过程。\n\n**理解鱼叉式钓鱼。** `Spear phishing`（鱼叉式钓鱼）是一种更具针对性的网络钓鱼，其信息是专门针对个人或群体定制并定向的。攻击的希望是，已经与组织建立在线/数字关系的人更有可能落入虚假信息的陷阱。\n\
  \n**理解鲸洛钓鱼。** `Whaling`（鲸钓鱼）是一种针对特定高价值个体的钓鱼形式。\n\n**理解语音钓鱼。** Vishing（语音钓鱼）是通过 VoIP\
  \ 服务进行的网络钓鱼。\n\n**理解尾随和搭车。** `Tailgating`（尾随）发生在授权实体在合法员工授权但不知情的情况下进入设施的情况。`Piggybacking`（搭车）发生在授权实体在合法员工授权且知情的情况下进入设施的情况。\n\
  \n**理解身份冒充。** `Impersonation`（身份冒充）是冒用他人身份的行为。身份冒充的目的是欺骗某人相信你是该身份，以便可以使用该身份的力量或权威。身份冒充也称为伪装或欺骗。\n\
  \n**理解翻垃圾桶。** Dumpster diving（翻垃圾桶）是通过寻找垃圾以获取目标组织或个人信息的行为。它可以为攻击者提供使社会工程学攻击更容易或更有效的信息。\n\
  \n**理解窥视。** Shoulder surfing（窥视）发生在有人观察你的键盘或查看你的屏幕。这可能允许他们学习你的密码或查看隐私信息。\n\n**理解骗局。**\
  \ 骗局是一种社会工程学，旨在说服目标执行会导致问题或降低其 IT 安全的操作。骗局通常是一封邮件，声称某种威胁正在互联网上传播，你必须执行某些任务来保护自己。\n\
  \n**理解水坑攻击。** 水坑攻击是一种针对特定地区、群体或组织的针对性攻击形式。它是通过毒化常用资源进行的。\n\n**理解社会工程学的原理。** 社会工程学攻击涉及许多技术。这些通常涉及一个或多个共同原理，如权威、恐吓、共识/社会证明、稀缺、熟悉/好感、信任和紧迫性。\n\
  \n**理解任意代码执行。** 任意代码执行是在目标系统上运行任何软件的能力。\n\n**理解拒绝服务 (DoS)。** 拒绝服务（DoS）是一种攻击形式，其主要目标是阻止被害系统执行合法活动或响应合法流量。一种形式利用软件的漏洞、错误或标准功能导致系统挂起、冻结、消耗所有系统资源等。结果是受害者计算机无法处理任何合法任务。另一种形式是用垃圾网络流量淹没害者的通信管道。结果是受害者计算机无法发送或接收合法的网络通信。\n\
  \n**理解 Smurf 攻击。** 这种 DRDoS 形式使用 `ICMP` 回显应包（ping 包）。\n\n**理解 Xmas 攻击。** Xmas 攻击实际上是\
  \ Xmas 扫描。它是一种可以通过许多常用端口扫描器（包括 `Nmap`、`Xprobe` 和 `hping2`）执行端口扫描形式。Xmas 扫描向目标端口发送\
  \ TCP 包，并同时开启 `URG`、`PSH` 和 `FIN` 标志。\n\n\n\n\n\n# 了解 DDoS\n分布式拒绝服务（DDoS）利用放大网络或反弹网络，这些网络是不情愿或不知情的参与者，遗憾的是，它们能够接收广播消息并创建消息响应、回声或反弹。实际上，攻击者向放大网络的广播地址发送了伪造的消息数据包。\n\
  \n# 了解中间人攻击\n中间人攻击是一种通信窃听攻击。攻击者将自己置于客户端和服务器（或任何两个通信实体）之间的通信流中。客户端和服务器认为它们正在直接进行通信。\n\
  \n# 了解缓冲区溢出\n缓冲区溢出的发生由于缺乏安全的防御性编程。利用缓冲区溢出可能导致系统崩溃或任意代码执行。当程序接收的输入大于其设计允许接收或处理的大小时，就会发生缓冲区溢出。程序接收到的额外数据在没有任何安全限制的情况下被转移到\
  \ CPU；然后被允许执行。缓冲区溢出的结果包括程序崩溃、冻结或崩溃系统、打开端口、禁用服务、创建用户账户、提升现有用户账户的权限、访问网站或执行实用程序。\n\
  \n# 了解注入攻击\n注入攻击是任何允许攻击者向目标系统提交代码以修改其操作和/或污染并破坏其数据集的利用。示例包括 SQL 注入、LDAP 注入、XML 注入、命令注入、HTML\
  \ 注入、代码注入和文件注入。\n\n# 了解 SQL 注入\nSQL 注入攻击允许恶意个人通过网站前端直接对底层数据库执行 SQL 事务。\n\n# 了解目录遍历\n\
  目录遍历是一种攻击，允许攻击者跳出 Web 根目录结构，进入由 Web 服务器宿主操作系统托管的文件系统的任何其他部分。\n\n# 了解跨站脚本\n跨站脚本（XSS）是一种恶意代码注入攻击，其中攻击者能够破坏\
  \ Web 服务器，并向发送给其他访问者的内容中注入自己的恶意代码。\n\n# 了解跨站脚本 (XSS) 预防\n防止资源主机上 XSS 的最有效方法是由程序员实现的，包括验证输入、编写防御性代码、转义元字符以及拒绝所有类似脚本的输入。\n\
  \n# 了解跨站请求伪造 (XSRF)\n跨站请求伪造（XSRF）是一种更多关注访问用户的 Web 浏览器而非所访问网站的攻击。XSRF 的主要目的是欺骗用户或用户的用户的浏览器执行他们并非本意执行或不会授权的操作。\n\
  \n# 了解跨站请求伪造 (XSRF) 预防\nXSRF 预防措施包括为每个 URL 请求和会话建立添加随机字符串（称为 nonce），并检查客户端 HTTP\
  \ 请求头中的 referrer 以判断是否存在伪造。\n\n# 了解权限提升\n当用户账户能够获得未授权的更高级权限访问时，就会发生权限提升，例如一个可以执行管理功能的普通用户账户。权限提升可以通过使用黑客工具或环境配置不当发生。\n\
  \n# 了解 ARP 投毒\nARP 投毒是伪造 TCP/IP 使用的 IP 到 MAC 地址解析系统的行为。\n\n# 放大\n放大攻击是指攻击者产生的工作量或流量被倍增，从而导致大量流量传递给主要受者的攻击。放大攻击也被称为反射攻击或绑定攻击。\n\
  \n# 了解 DNS 投毒\nDNS 投毒是伪造客户端用于访问目标系统所需的 DNS 信息的行为。这可以通过部署恶意 DNS 服务器（也称为 DNS 欺骗和 DNS\
  \ 钓鱼）、使用 DNS 投毒、修改 `HOSTS` 文件、损坏 IP 配置以及使用代理伪造来实现。\n\n# 了解钓鱼攻击（Pharming）\n钓鱼攻击是将有效网站的\
  \ URL 或 IP 地址恶意重定向到虚假网站，该网站托管了原始有效网站的虚假版本。\n\n# 了解域名劫持\n域名劫持或域名盗窃是在未经合法所有者授权的情况下更改域名注册的恶意行为。这可以通过窃取所有者的登录凭据、使用\
  \ XSRF、劫持会话、使用中间人攻击（MitM）或利用域名注册商系统的漏洞来实现。\n\n# 了解浏览器中间攻击\n浏览器中间攻击（MitB, MiTB, MiB,\
  \ MIB）实质上是一种中间人攻击。唯一的区别是中间人恶意软件运行在受害者系统上，它能够在通信离开浏览器之后、退出网络接口之前立即进行拦截和操纵。\n\n# 了解零日漏洞\n\
  零日攻击是新发现的、没有特定防御措施的攻击。零日利用旨在利用目标系统中世界上未知或未公开的缺陷或漏洞。零日也意味着目前不存在针对该攻击的直接或特定防御；因此，大多数拥有目标资产的系统都面临风险。\n\
  \n# 了解重放攻击\n在重放攻击中，攻击者捕获网络流量，然后重放捕获的流量，试图获得对系统的未授权访问。\n\n# 了解哈希值传递\n哈希值传递（Pass the\
  \ hash）是一种身份验证攻击，可能在实际上不知道或没有受害者凭据明文的情况下，作为授权用户获取访问权限。这种攻击主要针对 Windows 系统。\n\n#\
  \ 了解劫持攻击\n劫持攻击是指攻击者从合法用户处接管会话控制权。某些劫持形式会断开客户端，而其他形式则授予攻击者进入系统或服务的并行连接。\n\n# 了解点击劫持\n\
  点击劫持是一种基于 Web 页面的攻击，导致用户点击了并非本意想要点击的内容。这通常通过使用隐藏或不可见的覆盖层、框架集或图像映射来实现。\n\n# 了解会话劫持\n\
  TCP/IP 劫持或会话劫持是一种攻击形式，攻击者接管现有的通信会话。根据攻击目的，攻击者可以扮演客户端或服务器的角色。\n\n# 了解域名拼写错误/URL 劫持\n\
  域名拼写错误（或 URL 劫持）是一种当用户错误输入目标资源的域名或 IP 地址时用于捕获流量的手段。\n\n# 了解 Cookie\nCookie 是 Web\
  \ 服务器开发的一种跟踪机制，用于监控和响应用户对多个 Web 页面的连续查看。它可能导致身份盗取。\n\n# 了解驱动程序操控\n驱动程序操控发生在恶意程序员编写系统或设备驱动程序，使其根据某些条件表现出不同的行为。\n\
  \n# 了解垫片（Shimming）\n垫片是一种向系统注入替代或补偿代码的方法，以便在不更改原始或现有代码的情况下更改其操作。\n\n# 了解重构\n重构是在不改变软件外部行为或产生结果的情况下，对软件代码进行限制或重新组织。重构侧重于改进软件的非功能元素，例如质量属性、非行为需求、服务需求和约束条件。\n\
  \n\n\n\n\n### 理解欺骗（Spoofing）。欺骗是伪造数据的行为。通常伪造涉及更改网络数据包的源地址。由于源地址被更改，受害者无法定位真实的攻击者或通信的发起者。此外，通过伪造源地址，攻击者可以将数据包的响应、回复和回声重定向到其他系统。\n\
  \n### 理解 MAC 欺骗。MAC 欺骗用于冒充另一个系统（通常是有效或已授权的网络设备），以绕过端口安全策略或 MAC 过滤限制。\n\n### 理解 IP\
  \ 欺骗。IP 欺骗有三种主要类型：为攻击制作 IP 数据包进行攻击，但将源 IP 地址设置为无辜且未参与的第三方的地址；通过拒绝服务（DoS）攻击，断开 IP\
  \ 地址所有者/用户的连接，然后在攻击系统上临时接管该 IP 地址；或者使用当前未分配给有效授权系统的子网中的 IP 地址。\n\n### 理解无线漫游（War\
  \ driving）。无线漫游是指使用检测工具寻找无线网络信号的行为。通常，无线漫游是指某寻找其未经授权访问的无线网络的过程。\n\n### 理解无线重放攻击。无线重放攻击可能关注初始身份验证的滥用。它们可能被用于模拟大量新客户端或导致拒绝服务（DoS）。\n\
  \n### 理解初始化向量（IV）。`IV` 是数学和密码学中对随机数的术语。大多数现代加密函数使用 `IVs` 来通过减少预测性和重复性来提高其安全性。\n\n\
  ### 理解恶意孪生攻击（Evil twin attacks）。在恶意孪生攻击期间，黑客将其系统配置为有效无线接入点的孪生节点。受害者被骗连接到虚假的孪生网络，而不是有效的原始无线网络。\n\
  \n### 理解非法接入点（Rogue access points）。非法 `WAP` 可能是员工为了方便而放置的，也可能是攻击者外部运行。应该发现并移除非法无线接入点，以消除进入受保护网络的未受监管的访问路径。\n\
  \n### 理解干扰（Jamming）。干扰是通过传输无线电信号，通过降低有效信噪比来防止可靠的通信。\n\n### 理解 WPS 攻击。WPS 是一种无线网络的安全标准，已被发现存在缺陷。该标准要求一种可以远程发送到基站的代码，以触发\
  \ WPS 协商。这导致了暴力破解猜测攻击，黑客可以在几小时内猜出 WPS 代码。\n\n### 理解蓝信攻击（Bluejacking）。蓝信攻击是在未经所有者/用户许可的情况下，向支持蓝牙的设备发送信息。任何支持蓝牙的设备（如智能手机或笔记本电脑）都可以接收蓝信攻击信息。\n\
  \n### 理解蓝盗攻击（Bluesnarfing）。蓝盗攻击是通过蓝牙连接未经授权地访问数据。针对智能手机和笔记本电脑的成功蓝盗攻击已经能够提取日历、联系人列表、短信、电子邮件、照片、视频等。\n\
  \n### 理解 RFID。RFID（射频识别）是一种基于追踪技术，其原理是当放置在磁场中时，利用天线产生的电流为无线发射器供电。RFID 可以在数百米外被触发/供电并被读取。\n\
  \n### 理解 NFC。近场通信（`NFC`）是用于在近距离设备之间建立无线通信的标准。它让您能够通过将设备相互接触或将它们带入几英寸范围内，来实现设备之间某种类型的自动同步和关联。\n\
  \n### 理解解关联（Disassociation）。解关联是许多无线管理帧类型之一。解关联可以用于多种形式的无线攻击，包括发现隐藏的 `SSIDs`、导致拒绝服务（DoS）、劫持会话以及使用\
  \ `MitM`（中间人攻击）。\n\n### 理解密码攻击。密码的强度通常通过通过各种形式的加密攻击破解密码所需的时间和精力来衡量。这些攻击统称为密码破解或密码猜测。密码攻击的形式包括暴力破解（也称为生日攻击）、字典攻击、混合攻击和彩虹表攻击。\n\
  \n### 理解密码猜测。密码猜测是一种旨在发现用户账户所用密码的攻击。它通常被称为密码破解。根据用于在直接登录提示或生日攻击程序中选择可能密码的方法，密码猜测工具主要分为两类：暴力破解和字典攻击。\n\
  \n### 理解密码破解器。密码破解器是一种工具，用于对受保护的密码存储进行逆向工程，以获得（重新获得）对未知或遗忘密码的访问权限。有四种著名的密码破解技术：字典攻击、暴力破解、混合攻击和预计算哈希。\n\
  \n### 理解生日攻击。生日攻击利用了一种数学属性，该属性是：如果对两个值执行相同的数学函数且结果相同，则原始值也是相同的。\n\n### 理解已知明文攻击和已知密文攻击。已知明文攻击和已知密文攻击等加密攻击针对反复使用相同密钥或以其他可预测方式选择密钥的加密系统。目标是发现密钥或系列密钥中的一个，然后使用该密钥解密加密系统保护的大部分或全部数据。\n\
  \n### 理解彩虹表（Rainbow tables）。彩虹表利用了被称为哈希链的概念。它提供了相对快速的密码破解，但代价是事先花费时间和精力的制作彩虹表哈希数据库。\n\
  \n### 理解字典攻击。字典攻击使用预先存在的可能密码列表进行密码猜测。\n\n### 理解暴力破解攻击（Brute force attacks）。暴力破解旨在尝试字符的所有有效组合来构造可能的密码，从单个字符开始，随着不断增加字符，试图发现用户账户使用的特定密码。\n\
  \n### 理解在线与离线密码破解。在线密码攻击发生在实时登录提示中。离线攻击是指攻击者并非针对实时目标系统工作，而是在自己独立的计算机上工作以破解密码哈希。\n\
  \n### 理解冲突（Collision）。冲突是指两个加密操作产生了相同的结果。冲突发生在加密操作中以及哈希操作中。\n\n### 理解降级攻击（Downgrade\
  \ attack）。降级攻击试图防止客户端与服务器成功协商健壮强度加密。这种攻击可以通过实时流量操纵技术或通过中间人攻击（伪代理）进行，以强制将协商降级到较低质量的算法和密钥交换/生成。\n\
  \n### 理解重放攻击（Replay attacks）。重放攻击是指攻击者捕获网络包，然后将其重新传输或重放回网络。\n\n### 理解薄弱实现。大多数加密系统的失败是由于糟糕或薄弱的实现，而不是算法本身的失效。\n\
  \n\n\n\n\n`threat actor`（威胁者）是指负责导致或控制组织或个人所经历的任何违反安全事件的人员或实体。此类事件可能成功也可能未成功突破受害者的安全基础设施，但任何尝试都是值得关注、记录和评估的事件。了解贵组织面临的威胁至关重要，而了解可能负责这些威胁的威胁者类型将进一步有助于您的防御准备工作。\n\
  \n## 威胁者类型\n\n攻击或利用行为的实际执行者从个人到组织不等。与威胁者相关的某些术语将包含在以下章节中。\n\n### 脚本小子 (Script kiddies)\n\
  `Script kiddies` 是知识水平低于专业熟练攻击者的威胁者。脚本小子通常无法为自己的编写攻击工具，并且可能并不完全理解攻击是如何运作的。然而，脚本小子能够遵循指令，并使用由其他熟练且知识丰富的恶意程序员所制作的攻击工具。脚本小子的数量远多于专业攻击者。由于人数众多，加之他们可能拥有可以利用你\
  \ IT 系统中漏洞的攻击工具，脚本小子也构成了严重威胁。\n\n### 黑客行动主义者 (Hacktivist)\n`hacktivist` 是利用其黑客技术为了某种事业或目的的人。黑客行动主义者从事犯罪活动以进一步推动其事业。黑客行动主义者即使知道会被识别、捕获和起诉，也会攻击目标。他们这样做是因为他们相信自己的目的或事业比自己更重要。请记住，无论犯罪者的意图或目的是什么，实施犯罪都是违法的。黑客行动主义通常被用作一种抗议形式，但它并不是合法的。\n\
  \n### 有组织犯罪 (Organized crime)\n`Organized crime` 网络犯罪活动，因为这是另一个允许犯罪分子获得访问权限、权或资金的利用领域。尽管并非所有的攻击和入侵都有组织犯罪集团的资助或支持，但他们在网络攻击中的参与是非常显著的。一些有组织犯罪集团积极招募熟练的黑客加入其犯罪企业中的行列。\n\
  \n### 国家级攻击者/APT (Nation states/APT)\n许多政府和军队——国家——现在正将网络攻击作为其武器库中针对真实或感知敌敌（无论是边界内部还是外部）的另一种武器。有关国家级支持的网络事件的示例，请阅读\
  \ Stuxnet（由赛科伦克发现）和 Flame（由卡巴斯基发现）的恶意代码概念（`https://www.symantec.com/content/en/us/enterprise/media/security_response/whitepapers/w32_stuxnet_dossier.pdf`\
  \ 和 `https://www.kaspersky.com/flame`）。\n\n`APT (高级持续性威胁)` 是任何形式能够在相当长时间内持续利用目标的网络攻击。APT\
  \ 往往利用未知的漏洞（即公众未广为人知的漏洞）并尝试在整个攻击过程中保持隐蔽性。该名称源于以下概念：攻击是独特的，并利用了非公开知识的漏洞（即这种针对未知漏洞的利用被标记为“高级”的）；这种利用让攻击者对目标拥有持续的远程访问和控制（即具有“持续性”）；并且攻击者可能是国家级（即这是一个“威胁”）。APT\
  \ 有时指那些利用所有可用利用手段继续关注目标，以保持对受害者控制和主导地位的威胁者。\n\n### 内部人员 (Insiders)\n任何组织最大的风险之一就是其自身的内部人员。黑客努力获取内部人员已经拥有的东西：在设施内的物理存在，或\
  \ IT 基础设施上的有效用户账户。当内部人员执行恶意活动时，威胁是重大的，因为他们已经过了大多数物理屏障，并可能拥有可以让他们破坏 IT 安全的便捷访问权限。\n\
  \n恶意内部人员可以通过各种存储设备（包括智能手机、内存卡、光盘和 USB 驱动器）从外部带入恶意代码。这些相同的存储设备可用于泄露或盗取内部机密和私人数据，以便向外界公开。（你认为\
  \ WikiLeaks 的绝大部分内容来自哪里？）恶意内部人员可以执行恶意代码、访问危险网站或故意执行有害活动。\n\n减少内部人员威胁的手段包括彻底的背景检查、严厉的政策、详细的用户活动审计和监控、禁止外部存储设备以及使用白名单来减少未经授权的代码执行。\n\
  \n### 竞争对手 (Competitors)\n另一种威胁者类型是竞争对手。许多组织仍然选择对竞争对手进行间谍活动和破坏，尽管众所周知此类行为是非法的。这可能是由于对方公司感知到的优势，或者由于不愿意投入精力在竞争市场中获得有效的市场份额。组织应该始终密切监控竞争对手，寻找他们从中受益或发起网络攻击的迹象。这一概念被称为竞争情报收集。竞争情报收集是一种通过分析公开信息来跟踪另一公司的有效合法的手段。\n\
  \n公司还应该特别关注业务合作伙伴、承包商以及可能离开组织加入竞争对手的员工（无论你雇用了对方的人，还是他们挖了你的员工）。\n\n## 者的属性\n\n威胁者可能具有各种技能和属性。在分析组织面临的威胁时，记住这些变量是非常重要的。\n\
  \n### 内部/外部 (Internal/external)\n威胁可能源于组织内部，也源于外部。公司往往将大部分分析和安全部署精力放在外部威胁上，而对来自内部威胁关注不足。所有威胁都应该根据其本身（对组织及其资产的特定风险水平）来考虑，而不仅仅基于人们对问题的主观观点。\n\
  \n### 复杂程度 (Level of sophistication)\n威胁者的技能水平和复杂程度差异很大。某些攻击者是受过良好培训的专业人士，将他们的知识应用于恶意活动，而另一些只是为了扩大现有的技能库而学习如何进行网络攻击的坏人。\n\
  \n\n\n\n某些攻击是结构化或有针对性的，而另一些是非结构化且机会主义的。结构化或有针对性的攻击是指特定组织始终是目标，并投入了大量精力寻找破坏该组织安全的方法。这种类型的攻击通常涉及更高水平的复杂性，因为寻求实现目标时需要有条理且持久性。非结构化或机会主义的攻击是指寻找恰好易受到所选攻击或漏洞利用的目标。这种类型的攻击通常由攻击者在制作出新的漏洞工具后执行；他们寻找目标是为了展示或证明他们的工具确实有效。这种类型的攻击展示的复杂程度要低得多。是的，构建一个新的攻击工具可能是一个复杂的过程，但不断攻击多个目标直到找到一个具有特定弱点的目标，这一动作并不复杂。这等同于给一个幼儿一把锤子；如果他们把所有东西都看作钉子并去敲，也许最终他们真的会击中一个真正的钉子。\n\
  \n## 资源/资金\n\n某些威胁者资金充足且资源广阔，而另一些则不然。某些威胁者自筹资金；另一些则寻找外部投资者或付费客户。自筹资金的威胁者可能会劫持或使用广告平台来获取资金；另一些可能使用勒索软件从受害者那里勒索钱。某些黑客像雇佣兵一样向客户提供服务，客户向攻击者付费伤害特定目标或为特定漏洞编写新的利用程序。某些成员由个人付费，某些由企业付费，另一些由国家付费。\n\
  \n## 意图/动机\n\n攻击者的意图或动机可能是个人独特的，也可能与你相似。某些攻击者的动机是金钱和名声显而易见的利益。另一些出于无聊或仅仅为了向自己证明他们可以而攻击。另一些人从攻击中获得刺激，或受到挑战的激励。某些攻击者只是犯罪集团中的乌龟，每天从事着枯燥的体力工作，即攻击他们提供的目标列表（想象一下脚本小子的格子间农场）。某些攻击者是为了好玩，另一些则是出于无奈（为了挣钱养家）。某些人基于哲学、政治意识形态、宗教观点、对环境的看法或对商业计划的分歧进行攻击。有时，攻击者的动机是我们永远无法获知的——或者即使我们知道了可能无法理解。\n\
  \n## 开源情报的使用\n\n`Open-source intelligence`（开源情报）是从任何公开资源中收集信息。这包括网站、社交网络、讨论论坛、文件服务、公共数据库和其他在线源。它还包括非互联网源，如图书馆和定期期刊。目标或任何其他实体发布的关于目标的任何信息都是开源情报收集的重点。用于收集开源情报的过程、技术和方法在黑客方法中可以被称为侦察、信息收集、足迹探测、指纹识别或目标研究。\n\
  \n## 考试要点\n\n**定义威胁者（threat actor）。** 威胁者是负责导致或控制组织或个人经历的任何违反安全事件的人或实体。\n\n**定义脚本小子（script\
  \ kiddies）。** 脚本小子是知识水平低于专业熟练攻击者的威胁者。脚本小子通常无法编写自己的攻击工具，并且可能不完全理解攻击是如何运作的。\n\n**定义黑客主义（hacktivist）。**\
  \ 黑客主义者是指利用黑客技术来实现某种事业或目的的人。黑客主义者从事犯罪活动来推进其事业。\n\n**理解组织化犯罪如何参与网络犯罪。** 组织化犯罪参与网络犯罪活动是因为这是另一个可以利用的领域，允许他们获得访问权限、权力或金钱。\n\
  \n**理解国家如何使用网络攻击。** 大多数国家现在将网络攻击作为其针对真实或感知中的敌人的武器库中的另一种武器，无论这些敌人在边界内部还是边界之外。\n\n\
  **定义 APT。** APT（高级持续性威胁）是任何形式的能够在相当长时间内持续利用目标的网络攻击。APT 通常会利用未向公众公开的漏洞，并尝试在整个攻击过程中保持隐蔽性。\n\
  \n**理解内部人员带来的风险。** 任何组织最大的风险之一就是其内部人员。黑客努力获取内部人员已经拥有的东西：在设施内的物理存在或在 IT 基础设施上的可运行用户账户。\n\
  \n**理解竞争对手带来的风险。** 虽然众所周知此类行为是非法的，但许多组织仍选择对竞争对手进行企业间谍活动和破坏。\n\n**理解内部和外部威胁者带来的风险。**\
  \ 威胁可能源于你的组织内部，也源于外部。公司经常将大部分分析和安全部署精力放在外部威胁上，而没有对来自内部的威胁给予足够的关注。\n\n**理解威胁者的复杂程度。**\
  \ 威胁者的技能水平和复杂程度差异很大。某些攻击者是经过良好训练的专业人士，他们将自己的知识应用于恶意活动；而另一些仅仅是学会了如何进行网络攻击以扩大现有技能的坏人。\n\
  \n**了解威胁者如何获取资源和资金。** 某些威胁者资金充足且资源广阔；另一些则不然。某些威胁者自筹资金，另一些则寻找外部投资者或付费客户。自筹资金的威胁者可能会劫持或使用广告平台来获取资金；另一些可能使用勒索软件从受害者那里勒索钱。\n\
  \n**理解威胁者的意图和动机。** 攻击者的意图或动机可能是个人独特的，也可能和你相似。某些攻击者的动机是金钱和名声显而易见的利益。另一些出于无聊或仅仅为了向自己证明他们可以而攻击。\n\
  \n**理解开源情报。** `Open-source intelligence`（开源情报）是从任何公开资源中收集信息。这包括网站、社交网络、讨论论坛、文件服务、公共数据库和其他在线源。它还包括非互联网源，如图书馆和定期期刊。\n\
  \n## 1.4 渗透测试概念。\n\n`Penetration testing`（渗透测试）是一种安全评估形式，涉及与犯罪黑客相同的工具、技术和方法，但由安全专业人员执行。渗透测试也被称为\
  \ `ethical hacking`（道德黑客）或 `pen testing`。\n\n### 主动侦察\n\n`Active reconnaissance`（主动侦察）通过交互手段收集有关目标的信息。通过直接与目标交互，人员可以快速收集准确详细的信息，但代价可能是被识别为攻击者，而不是仅仅是一个无害、良性的随机访问者。被认为是主动侦察的活动示例包括访问目标网站、进行端口扫描（下文将讨论）、与目标的技术支持或帮助台服务交流、访问其物理位置以及对目标系统进行漏洞扫描。\n\
  \n\n\n\n在主动侦察期间执行的一个常见功能或任务是`port scanning`。端口扫描器是一种漏洞评估工具，它通过向目标系统的端口发送探测或测试数据包，以了解这些端口的状态。端口可以处于两种状态之一：开放或关闭。如果向开放\
  \ TCP 端口发送有效的连接请求（带有 `SYN` 标记的数据包），可以预期一个正常的响应（带有 `SYN/ACK` 标记的数据包）。如果 TCP 端口关闭，响应将是一个\
  \ `RST` 包。然而，如果存在防火墙，防火墙可能会过滤掉关闭端口上的连接尝试，导致探测系统未收到任何包。这被称为`filtering`。因此，TCP 端口扫描器将拥有端口开放或关闭的直接证明，但如果没有收到响应，也可以假设该端口被过滤了。\n\
  \n尽管这种形式的探测有效，但它产生的流量可能会被目标系统或保护它的防火墙记录或日志。因此，开发了许多其他形式的端口扫描。某些扫描技术使用标准数据包，但在意料之外的上下文，例如\
  \ `FIN` 或 `ACK` 标记的数据包。这些数据包在有效的 TCP 建立或销毁握手之外没有实际意义；因此当在上下文之外使用时，它们可能会引发对探测实体有意义的响应。即使是没有启用任何头部标志的普通数据包，也可以用于\
  \ `NULL scan`。甚至还有一些扫描方法使用无效的数据包结构，例如 `Xmas scan`，它启用了许多头部标志（参见前面的章节“Xmas 攻击”）。\n\
  \n这些扫描如何操作的细节稍微超出了 Security+ 的内容范围。然而，重要的是要理解端口扫描允许安全测试人员和黑客发现系统上有哪些端口是开放的。一旦知道了目标上的开放端口，这些信息就可以引导发现其他重要细节，例如主机操作系统的身份以及目标上托管了哪些类型的服务。许多扫描工具（如\
  \ `Nmap`）不仅可以检测开放、关闭和隐藏端口，还能确定操作系统并识别端口上的活动服务。有时这些操作是使用特征数据库执行的，有时是使用横幅抓取（banner-grabbing）查询执行的。`banner\
  \ grab`（见第 2 章“技术与工具”）发生在向开放端口上的服务发送数据或身份请求，且该服务响应了可能直接或间接揭示其身份的信息时。\n\n### 被动侦察\n\
  \n`Passive reconnaissance` 是在不与目标交互的情况下收集有关目标信息的活动。相反，信息是从非目标拥有和控制的来源（其他网站和服务）收集的，以及通过窃听目标的通信收集的。通过被动侦察可以收集大量信息，但它可能没有通过主动手段收集的数据那样准确。此外，基于窃听的侦察可能需要很长时间才能收集有用信息，因为你必须等待目标根据正常活动来传输你想要获取的数据。\n\
  \n在被动侦察期间执行的活动示例包括访问社交网络网站、阅读第三方报告、搜索讨论论坛（非目标运营）、研究域名和 IP 地址注册，以及访问任何其他未由目标拥有、控制或监控的在线或离线来源。\n\
  \n### 枢纽\n\n在渗透测试（或泛指黑客攻击）中，`pivot` 是入侵系统的行为或能力，然后通过攻击获得的权限或访问权限将注意力集中在另一个最初可能不可见或无法利用的目标上。它是指获得初始立脚点后调整入侵焦点或目标的能力。理论上可以从攻破计算机\
  \ A 枢纽转到对计算机 B 发起攻击，而计算机 B 之前无法访问，或者一旦计算机 A 被攻破，就可以访问计算机 A 上的托管信息。这可能包括文件、数据库内容、安全设置和账户凭据。\n\
  \n枢纽还涉及`daisy chaining`（链式攻击），其概念是顺序执行多次漏洞利用以实现目标上的某个目标。通常在现代的深度防御或多样化防御安全基础设施下，单次攻击不足以实现攻破目标。相反，必须发动多次连续的攻击，每次攻击都依赖于上一次利用的成功并在此基础上构建。例如，一个链式攻击可能包括一个初始端口扫描以找到一个开放端口，然后对开放端口后的应用程序进行利用，该程序执行代码更改防火墙配置以打开另一个端口，从而导致攻破另一个（之前无法访问的）服务以发起注入攻击，从而导出出用户账户凭据。这一系列攻击事件也是枢纽攻击的例子，因为每次成功的攻击都导向了另一个目标和利用。\n\
  \n### 初始利用\n\n渗透测试或真实世界恶意攻击中的 `initial exploitation` 是授予攻击者/测试人员访问系统的权限事件。它是对组织安全基础设施的首次成功突破，授予攻击者/测试人员对目标的某种程度的命令控制或远程访问权限。在初始利用之前的所有步骤——侦察、端口扫描、枚举和漏洞检测——都导致了并使得初始利用成为可能。一旦初始利用成功，就可以发生攻击的后期阶段：建立对目标的持久连接和控制，并隐藏所有入侵痕迹。\n\
  \n### 持久化\n\n`Persistence` 是攻击的一种特征，其特点是维持对攻破目标的远程访问和控制。某些攻击是快速的单次事件，初始攻破触发某些结果，例如窃取数据、植入恶意软件、破坏文件或导致系统崩溃。但此类事件是短暂的“一次性”的发生，不是持久性攻击。持久性攻击授予攻击者对受害者系统和/或网络进行持续长时间的访问和控制。\n\
  \n### 权限提升\n\n`Escalation of privilege`（权限提升）是任何授予攻击者更高权限、许可或访问权限的攻击或利用，这些权限超过了初始利用获得的或合法用户被分配的权限。权限提升可以是水平或垂直的。水平权限提升发生在攻击能够利用系统或软件中的漏洞，使得当前用户账户成为管理员组的成员、将账户转换为管理员账户，或简单允许以系统或\
  \ root 身份执行命令。这通常通过通过初始账户功能植入键盘记录器窃取凭据来实现，这可能是直接安装恶意软件，或通过电子邮件附件发送木马程序安装程序。\n\n\
  ### 黑盒\n\n\n\n\n\n理解渗透（以及其他形式）测试的各种术语至关重要。`black box`（黑盒）字面意思是指一种内部电路、组成和处理功能未知的设备，但可以对其对各种输入的响应输出进行观察和分析。黑盒渗透测试在不使用任何关于组织结构、使用的硬件软件类型，或其安全策略、流程和程序的初始知识的情况下进行。\n\
  \n黑盒测试要求渗透测试人员在黑客攻击的早期投入大量的时间和精力，以尽可能地发现有关目标网络和系统“黑盒”运行的信息。这导致黑盒测试（在黑、白、灰测试方案中）耗时最长、成本最高，但它能为组织的安全态势提供一个真实的外部犯罪黑客的视角。\n\
  \n### 白盒\n\n相比之下，`white box`（白盒）是指内部结构和处理方式已知且易理解的设备。这种区别在渗透测试中非常重要，白盒测试利用了关于组织结构、使用的硬件软件类型以及其安全策略、流程和程序的知识。它也可以被称为隐形盒测试或透明盒测试。白盒测试寻求利用所有关于网络运行和功能的已知知识，以集中并指导测试工作。白盒渗透测试利用所有可用知识来驱动其工作。\n\
  \n白盒测试人员不需要在侦察阶段投入大量精力的，只需进行足够的初始研究活动以确认所提供的信息。白盒测试的总时间要短得多，因此成本也低得多。然而，结果是它为一个恶意管理员提供了大量关于组织安全的信息。这种类型的渗透测试最容易被忽视或被低估，因为组织领导者很难想象他们最信任的\
  \ IT 管理员竟然会反背他们。\n\n### 灰盒\n\n`Gray-box`（灰盒）测试结合了上述其他两种方法，基于对目标环境的部分了解进行评估。这需要在侦察上花费一些时间，其成本通常介于白盒和黑盒测试之间。其结果是从不满员工的角度进行的安全评估。该员工对组织及其安全有一定的了解，并具有某种程度的物理和逻辑访问权限。\n\
  \n### 渗透测试 vs 漏洞扫描\n\n漏洞扫描和渗透测试是检测和响应新漏洞及缺陷的重要方面。除了这些重要工具外，对性能、吞吐量和协议使用的持续监控可以揭示停机趋势、工作重点的变化以及基础设施升级的需求。\n\
  \n渗透测试是一种漏洞扫描形式，由由受过训练的白帽安全专家组成的团队执行，而不是由内部安全管理员使用自动化工具执行。渗透测试（也称为伦理黑客）使用与真实世界犯罪黑客相同的工具、技术和技能作为方法论，来测试组织部署的安全基础设施。渗透测试为你提供了真实黑客的视角，而典型的漏洞扫描仅提供扫描器供应商的安全视角。\n\
  \n为了最好模拟现实情况，渗透测试通常在 IT 或安全人员不知情的情况下进行。高层管理通常会安排伦理黑客活动。这使得渗透测试能够评估基础设施和响应人员的表现。这被称为\
  \ `unannounced test`（不通知测试）。`announced test`（已通知测试）意味着组织中的每个人都知道渗透评估正在进行以及何时进行。\n\
  \n渗透测试可以采取许多形式，包括从外部入侵、模拟不满的员工、社交工程攻击和物理攻击，以及远程连接、无线和 VPN 攻击。渗透测试的目标是在真正的犯罪分子之前发现弱。大多数渗透测试要求测试人员具备高水平的知识和技能。虽然使用了自动化工具，但渗透测试获得的大部分收益源于测试人员修改现有漏洞或为攻击编写自定义代码的技能。这是因为真实的黑客通常根据其目标编写自己的手术级精确攻击工具和脚本。安全管理员确实使用自动化工具进行漏洞扫描，以检查策略合规性和已知问题。渗透测试则用于发现这些自动化工具无法发现的新弱点。\n\
  \n在安全术语中，`penetration`（渗透）发生在攻击成功且入侵者能够突破你环境周围的边界时。突破可能小到从你的网络中读取几比特数据，大到以具有无限制权限的用户身份登录。安全的首要目标是防止渗透。\n\
  \n你可以用来测试安全措施强度的某种常用方法是进行渗透测试，这是一种使用任何可用手段破入你受保护网络的激烈尝试。组织通常聘请外部顾问来执行渗透测试，这样测试人员就不会获知环境安全配置、网络设计和其他内部机密元素。\n\
  \n渗透测试试图寻找你现有安全边界中的任何所有可检测的弱点。操作术语是 `detectable`（可检测的）；在网络软件和硬件设计的大规模基础设施中潜伏着未被检测和目前未知的威胁，任何渗透测试都无法直接发现它们。一旦发现弱点，就可以选择并部署对策措施来提高环境安全性。渗透测试与实际攻击的一个显著区别是，一旦在渗透测试期间发现了漏洞，入侵尝试会在漏洞利用造成任何损害之前停止。有一些开源和商业工具（如\
  \ `Metasploit` [`Figure 1.14` ]、`Immunity’s CANVAS` 和 `CORE Impact`））可以被视为活动安全扫描器或利用框架；它们允许你将渗透测试更进一步，尝试利用系统和网络中的已知漏洞。这些工具可能被好人和坏人共同。\n\
  \n![FIGURE 1.14 The CLI (command-line interface) of Metasploit on Kali Linux](img/c01f014.jpg)\n\
  \n**FIGURE 1.14** The CLI (command-line interface) of Metasploit on Kali Linux\n\
  \n渗透测试可以使用自动化攻击工具或套件，也可以使用常用的网络工具和脚本手动执行。自动化攻击工具的范围从专业的漏洞扫描器到互联网上发现的野外工具。工具也经常用于手动执行的渗透测试，但重点在于了解如何实施攻击。\n\
  \n渗透测试应在获得管理层（以及安全人员）同意和知情的情况下进行。执行未经批准的安全测试可能会导致生产力损失、触发应急响应团队，甚至让你丢掉工作并可能面临入狱之灾。\n\
  \n\n\n\n定期安排渗透测试是准确判断组织所部署的安全机制的良好方法。渗透测试还可以揭示补丁或安全设置不足的区域，以及产生新漏洞的区域。为了评估您的系统，可以从\
  \ [www.cisecurity.org](http://www.cisecurity.org) 下载基准测试和测试工具，并从 [www.sectools.org](http://www.sectools.org)\
  \ 获取一份相当全面的安全评估及黑客/渗透测试工具列表。\n\n识别并抵御攻击需要对攻击的性质和发生情况有明确且定义良好的知识体系。某些攻击模式会留下特征，使其通过\
  \ `IDS` 仪器就能被从偶然观察中察觉；而其他形式的攻击是深奥的，或者不利于模式匹配引擎，因此必须根据可接受活动的基准进行衡量。\n\n哪些元素或属性代表了攻击序列而非良性流量形成？问题的回答取决于细致、专注的安全专业人员跟进最新的攻击、漏洞、利用程序和安全通告（例如来自\
  \ [www.us-cert.gov/cas/bulletins](http://www.us-cert.gov/cas/bulletins) 的美国计算机应急响应小组公告，或来自\
  \ [`cve.mitre.org`](http://cve.mitre.org) 的常见漏洞与披露数据库的公告）。\n\n在实施修复或安全控制之前，验证问题确实存在是非常重要的。如果您的环境中不存在该漏洞，那么防御威胁是没有意义的。同样，如果威胁不存在，或者极小可能在您的组织中变为现实，实施应对措施可能也是没有。\n\
  \n渗透测试的一部分是确认是否存在漏洞以及是否存在真实的威胁。根据已知威胁、漏洞和风险的严重程度，您可以决定通过实施应对措施、将风险转移到其他地方或接受风险来决定是否做出响应。\n\
  \n黑客经常尝试找到找到绕过安全控制的方法。伦理黑客或渗透测试人员会尝试许多相同的技术，以便您在这些技术被恶意人员滥用之前意识到它们。绕过安全控制的方法各异，但一些常见的通用类别包括使用替代的物理或逻辑路径、过载控制措施以及利用新缺陷。如果黑客知道特定的接入路径是安全的，他们可能会寻找替代路线。例如，如果所有来自互联网的流量都通过\
  \ `firewall` 过滤，黑客可能会尝试在网络上定位调制解器或未经授权的无线接入点，以绕过 `firewall` 的防护。\n\n有时 `DoS/DDoS`\
  \ 攻击可用来使 `firewalls`、`IDS`、`IPS`、审计等过载，从而让这些安全工具在真实攻击发生时“分散注意力”。此外，每天都在编写新的利用程序，它们可能通过利用有错误的编程代码来破坏安全性。例如，请参阅\
  \ [www.exploit-db.com](http://www.exploit-db.com) 上的漏洞数据库，获取当前已公开的新漏洞和零日利用程序列表。\n\
  \n仅仅因为使用了电子锁或其他形式的访问控制，并不能确保绕过系统是不可能的。绕过电子控制的方法包括关闭电源、创建短路、引入备电源、绕过触发电路以及通过虚假误报使检测器过载。\n\
  \n渗透测试应该被用于发现新缺陷或未知漏洞，同时也用于测试所部署的安全基础设施的能力。如果当前的安全控制不足或可以被轻易绕过，彻底的渗透测试应该揭示这一点。如果您的安全态势不够强大以捕捉熟练的伦理黑客，那么它就不可能足够好捕捉职业犯罪黑客。\n\
  \n渗透测试应该发现漏洞，然后按照预定的程度对其进行利用。测试不应进行到导致无法修复的损坏或长时间停机的程度。渗透测试的重点在于测试人员要符合伦理，并在服务水平协议\
  \ (`SLA`) 或测试合同规定的限制或边界内进行。任何可能导致伤害的测试在执行之前都应获得特定的预先批准。此外，测试目标应准备最近的备份和恢复团队，以防测试人员的预防措施不足或攻击意外比预想的更广泛。\n\
  \n## 考试要点\n\n### 理解主动侦察\n主动侦察是通过交互手段收集有关目标信息的理念。通过与目标交互，可以快速收集准确且详细的信息，但代价可能是被识别为攻击者，而非仅仅是一个无辜、良性的随机访问者。\n\
  \n#### 了解如何使用端口扫描器\n端口扫描器是一种漏洞评估工具，通过向目标系统的端口发送探测或测试包，以了解这些端口的状态。\n\n### 理解被动侦察\n\
  被动侦察是在不与目标交互的情况下收集有关目标信息的活动。相反，信息是从非目标拥有和控制的来源（其他网站和服务）以及通过窃听目标的通信来收集的。\n\n### 定义横移动\
  \ (Pivoting)\n在渗透测试（或普通黑客）中，`pivot` 是破坏系统的行为或能力，然后利用通过攻击获得的权限或访问权限将注意力转向另一个最初不可见或不可利用的目标上。\n\
  \n### 理解初始利用\n渗透测试或真实世界恶意攻击中的初始利用是授予攻击者/测试人员访问系统权限的事件。它是对组织安全基础设施的首次成功突破，授予攻击者/测试人员对目标的某种程度的命令控制权或远程访问权限。\n\
  \n### 定义持久化 (Persistence)\n持久化是指维持对受攻击目标远程访问和控制的攻击概念。持久性攻击允许攻击者对受害者系统和/或网络获得持续的访问和控制。\n\
  \n### 理解权限提升 (Escalation of privilege)\n权限提升是任何授予攻击者比初始利用更高的权限、许可或访问权限的攻击或利用程序。权限提升可以是水平的也可以是垂直的。\n\
  \n### 理解黑盒测试\n黑盒渗透测试在不使用任何关于组织结构、使用的硬件软件类型或其安全策略、流程和程序的初始知识的情况下进行。它为组织的安全态势提供了一个真实的外部犯罪黑客视角。\n\
  \n### 理解白盒测试\n白盒测试利用关于组织结构、使用的硬件软件类型以及其安全策略、流程和程序的知识。结果是它为内部恶意管理员提供了大量关于组织安全的信息。\n\
  \n### 理解灰盒测试 (Gray-box testing)\n灰盒测试结合了另外两种方法，基于对目标环境的部分知识进行评估。结果是从不满员工的视角进行的安全评估。\n\
  \n\n\n\n\n# 理解渗透测试。渗透测试是一种漏洞扫描的形式，由由经过培训的白帽安全专家组成的特殊团队执行，而不是由内部安全管理员使用自动化工具执行。渗透测试（也称为伦理黑客）使用与真实世界中犯罪黑客相同的工具、技术和技能作为一种方法，来对组织已部署的安全基础设施进行测试。\n\
  \n## 1.5 解释漏洞扫描概念。\n\n`Vulnerability scanning` 用于发现已部署安全系统中的缺陷，以便在违规发生之前对其进行改进或修复。通过使用多种评估工具（如漏洞扫描器、协议分析器、网络扫描器和无线扫描器），安全管理员可以快速了解缺陷。只有通过警惕以及持续的监控与评估，安全工作才能被证明是成功的。\n\
  \n通常情况下，漏洞扫描应由安全管理员定期定期地（例如每周一次）进行。此外，只有在彻底执行了漏洞扫描并对每项告警事项做出响应/处理后，组织才准备好进行真正的渗透测试。渗透测试需要专门的全职测试人员，他们通常是外部顾问。而漏洞扫描可以由任何具备相当技能和知识的\
  \ IT 或安全管理员在经过少量培训和实验室测试后运行。\n\n漏洞扫描器和安全评估工具用于测试系统已知的安全漏洞和缺陷。它们被用于生成报告，指示系统中需要管理以提高安全性的方面。报告可能会建议应用补丁或进行特定的配置或安全设置更改，以改进或实施安全(图\
  \ 1.15 )。![图 1.15 漏洞扫描器 Nessus 的扫描总结报告](img/c01f015.jpg)\n\n图 1.15 漏洞扫描器 Nessus\
  \ 的扫描总结报告\n\n漏洞扫描器的实用性完全取决于其安全问题数据库。因此，必须经常从供应商更新数据库，以便对您的系统提供实用的审计。将漏洞扫描器与 `IDS`\
  \ 结合有助于减少 `IDS` 的误报，并将总的入侵或安全违规行为次数降至最低。当发现的漏洞被快速且频繁地修复时，系统将提供更安全的环境。\n\n`IDS` 概念的扩展是\
  \ `IPS`。`IPS` 试图在发生时主动阻止未经授权的连接尝试或非法流量模式。`IPS` 设计属于 `IDS` 对应物的相同类型（基于主机和基于网络）和分类（基于行为和基于签名），它们通常被一起部署以实现完全的网络覆盖。此外，许多\
  \ `IPS` 平台能够剖析高层应用协议以寻找恶意有效负载。`IDSs` 和 `IPSs` 之间的界限可能会模糊，因为许多自称的 `IDSs` 具有 `IPS`\
  \ 能力。如今，检测和防御系统共同出现的情况比单独出现的情况更为常见。\n\n漏洞扫描的结果需要由位通的安全专家进行解读。自动化扫描工具可能会产生许多误报；因此，在实施修复之前，可能需要确认安全缺陷的存在，特别是当修复成本高昂或干扰生产时。另一个问题是，扫描工具报告的严重性级别可能不准确或与您的组织不相关。最后，漏洞扫描的结果必须根据现有环境、已知的真实威胁和预算进行解读。\n\
  \n### 被动测试安全控制\n\n当使用自动化漏洞扫描器寻求识别缺陷而不充分利用已发现的漏洞时，即是在对安全控制措施进行被动测试。在大多数情况下，自动化漏洞扫描器会在安全控制尝试测试时检测到它。此外，由于安全控制在执行自动化漏洞扫描期间正在运行，安全控制在实际目标成为扫描焦点的同时也进行了“演练”。因此，只要对目标进行了测试，但不是专门针对安全措施本身进行测试，就会发生被动测试安全控制的情况。\n\
  \n主动测试安全控制措施涉及尝试充分利用并突破目标系统。这可以通过使用主动扫描器（也称为利用框架）或使用手动攻击来完成。\n\n### 识别漏洞\n\n能够识别漏洞的扫描器是通过其评估数据库中定义的测试探测过程来实现识别的。漏洞扫描器的目标是告知您您的网络内、系统内或针对单个应用程序的任何潜在缺陷或攻击点。在大多数情况下，漏洞扫描器使用表面探测活动评估目标，这并不会充分利用潜在的缺陷。因此，报告是根据漏洞的症状列出所有问题，而不是实际利用的确认结果。这导致报告中的某些项目是误报。因此，系统管理员在采取任何缓解活动之前，对漏洞扫描器报告上的每项内容进行调查，以确认它们是否为实际可利用的缺陷，是至关重要的。\n\
  \n### 识别安全控制的缺失\n\n漏洞扫描器的一项重要任务是识别评估目标中不存在的任何必要或最佳实践安全控制措施。此类报告可能指示未应用更新和补丁，或者不存在特定的安全机制，例如加密、防病毒扫描、防火墙等。如果漏洞扫描器可以轻松判断出您的环境缺少安全基础设施的关键元素，那么黑客也可以发现这一点并利用您对足够保护的缺失来获利。\n\
  \n### 识别常见的配置错误\n\n许多漏洞扫描器可以确定您是否具有不当、低劣或配置错误的系统和保护措施。如果漏洞扫描器能够检测到此问题，攻击者也可以。请确保立即纠正任何发现的配置错误。\n\
  \n### 侵入性与非侵入性\n\n`intrusive`（侵入性）漏洞扫描（也称为主动评估）尝试利用已检测到的任何缺陷或漏洞。`nonintrusive`（非侵入性）漏洞扫描（也称为被动评估）仅发现缺陷和漏洞的症状，而不尝试利用它们。传统上，漏洞扫描器被认为是非侵入性的，而渗透测试被认为是侵入性的。然而，现在各种评估工具都可以提供任何形式的评估。\n\
  \n### 有凭证与无凭证\n\n`credentialed`（有凭证）扫描是指向扫描器提供用户登录凭据（通常是域管理员），以便其执行工作。提供的账户凭据最可能是域账户而非本地账户（如\
  \ `root` 或 `administrator`）。`noncredentialed`（无凭证）扫描是指未向扫描工具提供任何用户账户扫描，因此只能发现不需要凭证的漏洞。两种形式的扫描都应该使用以对您的安全基础设施提供彻底的评估。\n\
  \n### 误报\n\n\n\n\n\n`false positive`（误报）是指由于良性活动被最初归类为潜在恶意活动而导致的警报或警告。误报的问题在于，它们会导致安全管理员浪费时间调查非恶意事件。随着时间的推移，在反复了多次误报后，安全管理员可能会停止响应报警，并假设所有警报都是误报。\n\
  \n另一个需要解决的更重要的问题是 `false negative`（漏报）。误报是指没有恶意事件但有警报，而漏报是有有恶意事件但没有警报。当漏报发生时，人们会认为只发生了良性事件；然而，恶意活动实际上正在发生。这等同于建筑发生了火灾但没有火灾报警器。\n\
  \n当恶意或异常事件没有触发警报或警告时，就会发生 `false negative`。当使用糟糕的检测技术、检测数据库未及时更新，或者组织面临新的、未知的零日威胁时，就会发生漏报。当恶意活动发生且未被检测到时，受害者对情况并不知情。他们在不知道损害正在发生的情况下遭受着伤害。因此，他们不知道需要进行任何响应或调整。这就是“未知的未知”的领域。\n\
  \n| | **恶意事件** | **良性事件** |\n| --- | --- | --- |\n| 警报/警告 | 真正性 (True positive)\
  \ | 误报 (False positive) |\n| 无警报/警告 | 漏报 (False negative) | 真阴性 (True negative)\
  \ |\n\n为了降低漏报风险，组织应该采用“默认拒绝”（deny-by-default）或“隐式拒绝”（implicit-deny）的安全立场。这种立场的核心思想是：除非被明确允许（放置在白名单或异常列表中），否则不允许任何活动发生。保持检测技术（如防火墙、入侵检测系统\
  \ (IDS) 和入侵预防系统 (IPS)）的核心引擎以及规则列表和检测数据库的更新也是良好的做法。\n\n## 考试要点\n\n**理解漏洞扫描。** 漏洞扫描用于发现已部署安全系统中的缺陷，以便在漏洞发生前对其进行改进或修复。通过使用各种评估工具，安全管理员可以快速了解缺陷。\n\
  \n**理解安全控制措施的被动测试。** 当使用自动化漏洞扫描器且扫描器仅识别缺陷而不完全利用已发现的漏洞时，就是在对安全控制措施进行被动测试。\n\n**理解漏洞识别。**\
  \ 能够识别漏洞的扫描器通过其评估数据库中定义的测试探测过程来识别漏洞。漏洞扫描器的目标是告知你网络、系统内部或针对单个应用程序的任何潜在缺陷或攻击点。\n\n\
  **理解安全控制措施缺失的识别。** 漏洞扫描器的一项重要任务是识别评估目标中缺失任何必要或符合最佳实践的安全控制措施。此类报告可能表明未应用更新和补丁，或者不存在特定的安全机制。\n\
  \n**能够识别常见的配置错误。** 许多漏洞扫描器可以判断你是否拥有不当、糟糕或配置错误的系统和保护措施。如果漏洞扫描器能够检测到此问题，攻击者也可以做到。\n\
  \n**理解侵入性与非侵入性。** `intrusive`（侵入性）漏洞扫描尝试利用检测到的任何缺陷或漏洞（也称为主动评估）。`nonintrusive`（非侵入性）漏洞扫描仅发现缺陷和漏洞的症状，而不尝试利用它们（也称为被动评估）。\n\
  \n**理解有凭据的与无凭据的。** `credentialed`（有凭据的）扫描是提供凭据的扫描；`noncredentialed`（无凭据的）扫描是不提供凭据的扫描。\n\
  \n**知道什么是误报。** 当良性事件触发警报或警告时，就会发生误报。\n\n**知道什么是漏报。** 当恶意或异常事件没有触发警报或警告时，就会发生漏报。\n\
  \n## 1.6 与漏洞类型相关的影响\n\n存在许多形式和类型的黑客攻击、利用和入侵。本节重点关注某些形式漏洞对组织可能产生的影响。\n\n### 竞态条件\n\
  \n计算机系统以严格的精确性执行任务。攻击者可以根据任务的可预测性开发攻击。算法常见的事件序列是检查资源是否可用，然后访问它。检查时间（`TOC`）是主体检查对象状态的时间。在返回对象之前可能有多个决策需要做出。当决定访问对象时，程序在使用时间（`TOU`）访问它。`TOC`\
  \ 和 `TOU` 之间的时间差有时足以让攻击者替换对象。从检查时间到使用时间（TOCTOU）的攻击通常被称为 `race conditions`（竞态条件），因为攻击者正在与合法进程竞争以替换该对象。\n\
  \n`TOCTOU` 攻击的一个经典例子是在数据身份验证之后、读取数据之前替换数据文件。通过将一个真实数据文件替换为另一个攻击者选择和设计的文件，攻击者可能以许多方式引导程序的行为。当然，攻击者必须对受攻击的程序和系统有深入的了解。\n\
  \n同样，攻击者可以尝试在资源或整个系统状态变化的两个已知状态之间采取行动。通信断开也为攻击者可能利用提供了微小窗口。只要对资源的状态检查在对资源的操作之前进行，在检查和操作之间的短暂间隔内就存在潜在攻击的机会。竞态条件攻击可能导致系统被接管、数据泄露和数据破坏。\n\
  \n### 由于以下原因导致的漏洞：\n\n每个非典型和专门的系统都会给组织带来独特且往往复杂的安全压力。在设计安全策略和执行网络分段时，记住这些点是重要的。\n\
  \n### 终止寿命的系统\n\n\n\n\n\n终止寿命（End-of-life）系统是指不再接收供应商更新和支持的系统。如果组织继续使用终止寿命的系统，其遭受攻击的风险将很高，因为任何未来的漏洞都无法被修补或修复。为了维护安全环境，放弃终止寿命系统至关重要。仅仅因为供应商停止了支持就放弃一个仍在运行的解决方案，起初可能看起来并不具有成本效益或实际意义。然而，你将投入的安全管理工作可能会远超过开发和部署一个基于现代系统的替代方案的成本。\n\
  \n### 嵌入式系统\n\n嵌入式系统是添加到现有机械或电气系统的任何形式的计算组件，用于提供自动化和或监控。嵌入式系统可能会带来安全风险，因为它们通常是静态系统，这意味着即使是部署它们的管理员，也没有真正的手段来更改设备的操作以解决安全漏洞。某些嵌入式系统可以使用供应商提供的补丁进行更新，但补丁通常在已知漏洞在野外发现几个月后才发布。将嵌入式系统与互联网以及私有生产网络隔离开，以最大限度地减少受到远程攻击、远程控制或恶意软件侵害的风险。\n\
  \n### 缺乏供应商支持\n\n任何系统（无论是硬件还是软件）一旦缺乏供应商支持，随着时间的推移都会变得越来越不安全。缺乏支持可能一直是产品的一个“特性”，即供应商在初始销售后不对产品提供任何改进、支持或补丁/升级。作为安全管理员，你应该避免使用缺乏供应商支持的产品，并在产品达到其终止寿命日期时将其淘汰。\n\
  \n### 不当的输入处理\n\n许多形式的攻击是由于缺乏输入清理或验证导致的。只有通过适当的输入处理，才能减少或消除软件漏洞。每位程序员都应该采用以下三种主要的输入过滤形式并将其包含在编写的代码中：\n\
  \n* 检查长度。\n* 过滤已知的恶意软件模式。\n* 转义元字符。\n\n### 不当的错误处理\n\n错误的错误处理可能导致关键信息泄漏给攻击者，或允许攻击者强制系统进入不安全状态。如果错误消息处理不当，它们可能会披露有关缺陷或弱点的细节，使攻击者能够调整他们的攻击。例如，如果攻击者向目标系统提交一个单引号，而错误响应指示存在未闭合的引号（图\
  \ 1.16），那么它告诉攻击者没有进行元字符过滤。否则，错误本应说明尝试了无效或超出范围的输入已被拒绝，并且用户应该重试。\n\n![图 1.16 显示缺少元字符过滤的网站错误页面](img/c01f016.jpg)\n\
  \n图 1.16 显示缺少元字符过滤的网站错误页面\n\n如果错误本身没有被正确处理，可能会导致应用程序向访问者披露机密数据，允许攻击者绕过验证，甚至导致系统崩溃。程序员应该在产品中包含一个错误管理系统，以处理无效值、超出范围的数据集或其他形式的不当输入。当检测到错误时，错误管理系统应向用户显示通用错误消息，例如“错误，请重试”或“错误，请联系技术支持”。错误管理系统应将错误的所有细节记录到文件中供管理员使用，但不应向用户披露这些细节。此外，如果错误可能导致安全违规，应启动一种称为“故障安全”（fail-secure）的通用错误故障响应。故障安全系统在发生故障时将恢复到安全的、关闭的受保护状态，而不是进入信息可以被泄露或修改的开放、不安全、无保护状态。\n\
  \n### 配置错误/弱配置\n\n系统实施者和执行持续系统管理的人有责任确保正确且安全的配置项保持定义并强制执行。当系统在活跃生产中使用时允许保留配置错误或弱配置，数据丢失、数据泄露和整个系统被破坏的风险更高。\n\
  \n### 默认配置\n\n默认配置绝不应该被留在设备或应用程序中。默认设置是为了便于安装和初始配置，以最大限度地减少新客户的售后请求。作为系统管理员，你应该将系统设置从默认值更改为符合你安全策略的状态。默认的专制在于，默认设置通常是不安全的，因此会让系统容易受到简单的攻击。\n\
  \n### 资源耗尽\n\n当允许应用程序以不受限制且不受监控的方式运行时，就会发生资源耗尽，导致所有可用系统资源在尝试响应用户请求或响应 DoS 攻击时被消耗。系统管理员监控有效资源消耗的基准并关注可能需要扩展容量或响应性攻击的趋势至关重要。\n\
  \n### 未经培训的用户\n\n未经培训的用户更容易犯错或滥用系统的资源和能力。只有经过培训的员工才被允许使用敏感的系统资源。组织需要在直接与生产环境关联的测试系统上正确培训新员工。只有当新员工显示出能够熟练完成任务后，才将其移动到实时生产系统中。\n\
  \n### 配置不当的账户\n\n用户账户需要正确配置，以便根据员工的职位职责授予正确的资源访问级别和系统权限。无论采用何种授权手段，都应仅授予用户完成任务所需的权限。超过此最小限制只会增加组织的风险，而没有任何益处。配置不当的账户违反了最小权限原则。员工应仅拥有特定工作所需的对象权限或权限以及系统用户权利或能力。\n\
  \n### 有漏洞的业务流程\n\n应对对所有业务任务、流程、程序或功能进行脆弱性评估，这包括考虑每个业务流程的机密性、完整性和可用保护或缺陷。还应该关注每个业务流程处理的数据集的价值性。\n\
  \n### 弱加密套件和实现\n\n加密套件中的所有加密或其他算法元素并非安全。许多旧算法或算法实现存在已知缺陷、弱点或破解手段。这些较弱的加密应该被避免和禁用，并用很少或没有问题的强加密套件进行替换。加密方法的年龄并不意味着其强度或弱点。有关弱加密、加密套件攻击以及\
  \ Google 对未来建议的讨论，请阅读 [TLS 加密套件漏洞列表](http://googleonlinesecurity.blogspot.com/2013/11/a-roster-of-tls-cipher-suites-weaknesses.html)](http://googleonlinesecurity.blogspot.com/2013/11/a-roster-of-tls-cipher-suites-weaknesses.html)。\n\
  \n\n\n\n\n### 内存/缓冲区漏洞\n\n内存是计算机系统的关键元素。它是存储接收到的输入数据的区域，无论是来自键盘、网络还是存储设备。预留或分配用于存储输入的内存区域被称为\
  \ `buffer`（缓冲区）。内存或缓冲区攻击和利用是严重的安全问题。\n\n### 内存泄漏\n\n`memory leak`（内存泄漏）与其名称所暗示的意思相反。当程序未能释放内存或继续消耗更多内存时，就会发生\
  \ `memory leak`。之所以被称为“泄漏”，是因为当应用程序导致 `memory leak` 时，整个计算机系统的可用空闲内存会减少。将此问题称为内存消耗缺陷可能更合适。取决于\
  \ `memory leak` 的速度，该问题在典型情况下（例如在应用程序使用几分钟后关闭时）可能不会察觉，也可能会迅速恶化，导致系统故障。程序员应该专注于妥善管理内存，并在不再需要时释放内存分配。否则，终端用户和系统管理员应该监控系统性能以发现软件内存泄漏，并选择停止使用违规产品。\n\
  \n### 整数溢出\n\n`integer overflow`（整数溢出）是在数学操作尝试创建一个大到无法由分配的存储空间或内存结构包含或表示的数值时发生的状态。例如，8\
  \ 位值只能存储 `0` 到 `255` 之间的数字。如果在最大值上增加一个数字，就会发生 `integer overflow`。通常，数值会重置或回零到 `0`，类似于汽车里程表的回零。然而，在其他情况下，结果会\
  \ `saturates`（饱和），即保留最大值。因此，结果是另一种形式的错误（信息缺失或丢失）。在其他情况下，回零会导致负数。如果编程逻辑假设数字始终为正数，那么当处理负数时，可能会导致违反安全规则的结果。程序员需要了解其代码以及他们正在开发的平台的数值限制。。程序员应该采用某些编码技术，在溢出发生之前对\
  \ `integer-overflow` 结果进行测试。\n\n### 缓冲区溢出\n\n`buffer overflow`（缓冲区溢出）是一种内存利用，它利用了软件缺乏对输入长度的验证。通过向系统注入比预期更大的输入，这种攻击可能导致额外数据“溢出”分配的\
  \ `buffer`，从而覆盖后续相邻位置的内存。这种 `buffer overflow` 可能仅导致系统冻结或执行故障。然而，在某些情况下，`buffer overflow`\
  \ 允许将 `shellcode`（预编译的恶意代码）注入内存，并在其中可能以系统级权限执行。这被称为由缓冲区溢出攻击导致任意代码执行。防止 `buffer overflow`\
  \ 的主要防御措施是输入清理，特别是限制输入的长度。\n\n#### 指针解引用\n\n`pointer dereference`（指针解引用）是一种编程活动，通过根据在\
  \ `pointer`（一种持有地址的变量类型——即内存空间位置）中存储的地址或位置触发内存拉取，来获取存储在内存位置的值。无效解引用可能由于：尝试引用未初始化（未分配内存地址）的\
  \ `pointer`；引用获取数据并赋值给未配置为相同数据类型（二进制与 `ASCII` 或数字与文本）的变量的 `pointer`；以及引用由于动态内存分配而被释放的\
  \ `pointer`。\n\n#### DLL 注入\n\n`DLL injection`（DLL 注入）是一种高级软件技术，通过操作进程顺序开始。`DLL`（动态库）是设计用于加载和使用的代码集合，通常在许多应用程序之间共享。\n\
  \n#### 系统蔓延/未记录的资产\n\n`System sprawl`（系统蔓延）或 `server sprawl`（服务器蔓延）是指大量低利用率服务器正在运行的情况。这些服务器占用了空间、消耗电力并对其他资源提出需求。如果组织批量购买低端硬件而不是针对用用例选择优化设备，就会发生这种情况。将软件整合到优化的硬件上可以减少效率低下。未记录的资产是另一种形式的资源浪费机会流失。如果不清楚组织内部存在哪些设备，就无法规划未来的增长、采取适当的安全措施或追踪违规元素。业务任务中使用的每种资产都应该被识别和跟踪。\n\
  \n### 架构/设计缺陷\n\n架构或设计缺陷与代码 Bug 是区别的。Bug 是软件代码编写过程中的错误，通常是拼写错误或使用了错误的函数。`Design\
  \ flaws`（设计缺陷）是应用程序整体概念、理论、实现或结构上的错误。设计缺陷可能存在于对要解决的问题的误解，或者未理解解决方案的需求，又在初始构思期间未能考虑安全措施。\n\
  \n架构或设计缺陷通常分为三大主类：遗漏缺陷（omission flaws）、疏忽缺陷（commission flaws）或实现缺陷（realization flaws）。当遗漏安全需求或忽略开发过程中的关键要素时，会发生遗漏缺陷。当对如何执行某些操作、解决问题或在性能与安全之间取得平衡做出糟糕决策时，会发生疏忽缺陷。当选择了正确的设计概念，但在代码中实现得不当时，就会发生实现缺陷，从而导致一个与遗漏缺陷或疏忽缺陷无法区分的问题。\n\
  \n### 新威胁/零日漏洞\n\n\n\n\n\n黑客几乎每天都会开发新的威胁。感知到新威胁是安全管理中至关重要的一部分。进行每日研究可以帮助你保持与时同步。为了查看或追踪某些问题，安全专业人员可以查阅各种网站以获取威胁信息。这类有用网站包括\
  \ [`www.exploit-db.com`](https://www.exploit-db.com)、[`cve.mitre.org`](https://cve.mitre.org)、[`nvd.nist.gov/`](https://nvd.nist.gov/)\
  \ 以及 [`www.us-cert.gov`](https://www.us-cert.gov)。\n\n通过关注与新的零日漏洞相关的安全趋势和警报，你将能够更好地应对并防御此类事件。\n\
  \n每天都有成千上万种新的病毒和恶意软件变体被制作并发布。幸运的是，只有一小部分是重大威胁。然而，这并不意味着可以忽视即使是一个恶意代码感染也可能造成的损害严重性。\n\
  \n每个人都需要最新的防病毒扫描程序。该扫描程序应配置为按照自动计划每天下载更新。系统应至少每周进行一次全面扫描。应当实时监控系统的活动。尽管防病毒软件在过去几年取得了显著进步，但它仍然不能作为避免风险活动和控制用户行为的替代品。\n\
  \n请参阅“应用程序/服务攻击”和“零日”章节中关于零日问题的早期报道。\n\n### 不当的证书和密钥管理\n\n当涉及加密时，密钥管理始终是一个问题。大多数加密系统的失败是基于不当的密钥管理，而非算法。良好的密钥选择基于随机数的质量和可用性。大多数移动设备必须在本地依赖糟糕的随机数生成机制，或通过无线链接访问更稳健的随机数生成器（`RNGs`）。一旦创建了密钥，就需要存储，以最大限度地减少丢失或泄露的风险。密钥存储的最佳选择通常是可拆卸硬件或使用可信平台模块（`TPM`），但这些在手机和平电脑上很少见。\n\
  \n有关通用密钥管理的更多讨论，请参见第 6 章“加密与 PKI”中的“密钥托管”章节。\n\n## 考试要点\n\n**理解竞态条件。** 检查时间使用时间（`TOCTTOU`）攻击通常被称为竞态条件，因为攻击者正在与合法进程竞争，在对象被使用之前替换它。另一种形式的竞态条件攻击发生在两个进程并发运行时，一个进程被设计为先完成，但攻击改变了处理过程以改变完成顺序。\n\
  \n**理解生命周期结束的系统。** 生命周期结束的系统是指不再接收供应商更新和支持的系统。如果组织继续使用寿命结束的系统，那么被攻击的风险很高，因为未来的漏洞将无法被修补或修复。\n\
  \n**理解嵌入式系统。** 嵌入式系统是添加到现有机械或电气系统中用于提供自动化和监控的任何形式的计算组件。\n\n**意识到可能缺乏供应商支持。** 任何系统（无论是硬件还是软件）一旦缺乏供应商支持，随着时间的推移都会变得越来越不安全。缺乏支持可能是由于生命周期结束，但也可能是产品一直存在的“特性”，即供应商在初始销售后不提供任何改进、支持或补丁/升级。\n\
  \n**理解不当的输入处理。** 许多形式的利用是由于缺乏输入清理或验证导致的。只有通过适当的输入处理才能减少或消除软件漏洞。\n\n**了解适当的输入处理。**\
  \ 每个程序员都应该采用并并在他们编写的每段代码包含三种主要的输入过滤形式：检查长度、过滤已知的恶意软件模式以及转义元字符。\n\n**理解不当的错误处理。**\
  \ 不当的错误处理可能允许关键信息泄露给攻击者，或允许攻击者强制系统进入不安全状态。如果错误消息没有被正确处理，它们可能会披露有关缺陷或弱点的细节，使攻击者能够精调他们的利用程序。\n\
  \n**理解配置错误/弱配置。** 当系统在活跃生产使用期间允许配置错误或弱配置存在时，数据丢失、数据泄露和整个系统被破坏的风险更高。\n\n**了解默认配置的风险。**\
  \ 绝不应允许默认配置留在设备或应用程序中。默认设置的暴政在于，默认设置通常是不安全的，因此使系统容易受到简单的攻击。\n\n**理解资源耗尽。** 资源耗尽发生在允许应用程序以无限制且未受监控的方式运行时，导致所有可用系统资源在尝试响应合法用户请求或响应\
  \ Do 斯攻击时被耗尽。\n\n**理解未经训练的用户。** 未经训练的用户更有可能犯错或滥用系统的资源和能力。\n\n**理解配置不当的账户。** 配置不当账户的概念违反了最小权限原则。\n\
  \n**理解脆弱的业务流程。** 所有的业务任务、流程、程序和功能都应该根据它们对组织的重要性及其相对脆弱性进行评估。\n\n**理解弱加密套件和实现。** 许多旧算法或算法实现具有已知的缺陷、弱点或破解手段。这些较弱的加密算法应该被避免和禁用，并用具有很少或没有问题的强加密套件替换。\n\
  \n**理解内存泄漏。** 内存泄漏发生在程序未能释放内存或继续消耗更多内存时。\n\n**理解整数溢出。** `integer overflow` 是当数学运算尝试创建一个太大以至于分配的存储空间或内存结构无法包含或表示的数值时发生的状态。\n\
  \n**理解缓冲区溢出。** 缓冲区溢出是利用软件缺乏输入长度验证的内存利用攻击。在某些情况下，缓冲区溢出允许在内存中注入 shellcode（预编译的恶意代码），其可能会以系统级权限执行。\n\
  \n**理解指针解引用。** 指针解引用是根据存储在指针中的地址或位置触发内存拉取，以获取存储在内存位置中的值的编程活动。\n\n**理解 DLL 注入。**\
  \ DLL 注入是一种高级的软件利用技术，通过操纵进程内存来欺骗其加载额外代码，从而执行原始作者无意的操作。\n\n**理解系统蔓延/未记录资产。** 系统蔓延或服务器蔓延是指组织机房中运行着大量未利用服务器的情况。资产的存在是资源浪费和机会流失的形式。\n\
  \n\n\n\n[/content]\n\n### 理解新威胁。\n\n黑客几乎每天都会开发新的威胁。感知新威胁是安全管理中至关重要的一部分。\n\n# 理解不当的证书和密钥管理。\n\
  \n大多数加密系统的失败都是基于不当的密钥管理，而不是算法本身。\n\n## 复习题\n\n你可以在附录中找到答案。\n\n1. 攻击者决定尝试攻破你组织的网络。他们已经确定了你使用的\
