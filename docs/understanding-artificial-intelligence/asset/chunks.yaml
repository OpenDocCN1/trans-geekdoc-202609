- raw: 'And the benefit is, once the algorithm has used the examples to separate the
    two sides, it can define a decision system. The system is then able to classify
    any described object based on its attributes into the “cat” category or the “noncat”
    category, even if it is not included among the learning examples.


    This calculation even works with very little data: the algorithm systematically
    builds the optimal margin, regardless of how many dimensions and examples are
    provided. Naturally, the more examples there are, the more reliable the separator
    will be.


    This learning algorithm is, therefore, particularly interesting. Even if it requires
    complex calculations to find the separator, it allows us to handle problems with
    many dimensions and relatively little data. By contrast, this is not the case
    with algorithms that use decision trees.


    ## [KEEP STRAIGHT](#contents.xhtml#toc2_113)


    However, even in the 1990s, no one really gave much thought to this method.


    The SVM algorithm does, indeed, have a serious limitation: the separation that
    it establishes between the two clusters is inevitably *linear*, in the mathematical
    sense of the term. In plain language, it’s a straight line.


    Let us consider the picture below:


    ![image](images/inline11_7.jpg)


    It has a lot of curves and triangles, which means it would be placed in the top
    right of our dimension space – that is, next to the cats. And there, it’s no good:
    to separate this picture from the cat group, we would need a curved line – in
    other words, a *nonlinear* separator. However, the SVM algorithm is unable to
    produce this kind of separator. It’s rather frustrating!


    ![image](images/inline11_8.jpg)


    ## [THE SVM STRIKES BACK](#contents.xhtml#toc2_114)


    Nevertheless, in 1992, Vladimir Vapnik, Bernhard Boser, and Isabelle Guyon wrote
    an article that would revolutionize machine learning. Using a mathematical transformation
    called the “kernel trick,” they showed that it was possible to produce nonlinear
    classifications with an SVM.


    The *kernel* is a function that measures the similarities of two points in a feature
    space. This is analogous to the distance function used in the *k*\-means algorithm.
    With the SVM, the *kernel* allows us to calculate the margin and, thus, the separator.


    Vapnik and his colleagues had a great idea: add imaginary features to the kernel
    to force the algorithm to work in a space with more dimensions. It’s kind of like
    some physicists were to say to us: “OK, ultimately, the third dimension isn’t
    enough. Based on our calculations, we going to pretend the space has eight dimensions
    and we’ll see what we get as a result.”


    This *kernel trick* allows us to break free of the SVM’s limitations: the algorithm
    still calculates a linear dividing line, but since it is formed in a space with
    greater dimensions, it is no longer linear when we come back to our initial dimensions.


    It’s a little hard to imagine, isn’t it? Think of our physicists. For years, they
    drew triangles using straight lines. Then, one day, they realized that Earth was
    round and, as a result, all the triangles were actually distorted when they would
    draw Earth on a piece of paper. This is more or less the idea behind the *kernel
    trick*.


    ## [INTELLIGENT, DID YOU SAY INTELLIGENT?](#contents.xhtml#toc2_115)


    The SVM has had a lot of success in computing since the dawn of the 21st century.
    It is very effective at recognizing cat pictures, even when there are dirty tricks
    like a wolf with its ears up or the Pyramid of Giza (don’t laugh, the triangular
    shape tricks the computer very easily). Let’s be serious; SVM is particularly
    very useful for a whole ton of other applications, starting with understanding
    natural language (human language).


    Processing natural language is a difficult problem for AI and, yet, one of the
    most ambitious problems to solve. Indeed, language is a very complex phenomenon
    that is impossible to describe using symbolic rules alone. As soon as you leave
    a very specific framework, as soon as the vocabulary becomes the slightest bit
    realistic, the rules become too abundant.


    ![image](images/inline11_9.jpg)


    It is not possible to use decision trees either: the classification algorithms
    need a lot of examples to cover each dimension. However, sometimes there can be
    just as many dimensions as words! In the tens of thousands! The SVM allows us
    to circumvent this limitation and build classifications for objects with many
    variables and many values. This isn’t some kind of miracle, though. For this to
    work, we need data. A lot of data. Positive examples (this picture contains a
    cat). And negative examples (this picture does not contain a cat).


    If Google’s applications are currently the best at document searches, image recognition,
    and machine translation, it’s simply because they have colossal amounts of data
    that their competitors do not! Try to imagine how much time and energy it takes
    to build a database with a label for each piece of data: this is a cat, this is
    not a cat. Thanks to the billions of searches we do every minute on their servers,
    Google researchers obtain this data for free. You have to admit that it’s worth
    it!


    ## [CAREFUL, DON’T SWALLOW THE KERNEL!](#contents.xhtml#toc2_116)


    However, just like every AI technique, the SVM has a weakness. To work well, an
    SVM not only needs the right data set, it also needs a kernel function that is
    well suited to the problem to be solved. This means that a computer scientist
    must not only define the problem’s dimensions (the features) but also what happens
    inside the kernel. This is a bit like the heuristic in the minimax method for
    chess: if you don’t tell the machine how to evaluate the board, it won’t play
    correctly.


    There are some classic functions for the kernel that are well suited for each
    kind of problem. They are easy to control and generally produce good results.
    But as soon as you try to increase the AI’s performance, it’s not enough to just
    give it more examples: you have to look under the algorithm’s hood. In other words,
    you have to hot-rod the kernel.


    Many years of higher learning in mathematics and computer science are needed to
    understand how an SVM works and to be able to manipulate these algorithms. Researchers
    spend several years building one kernel for a specific problem. However, advancements
    in AI image processing and natural language understanding, two major artificial
    intelligence tasks, have been lightning fast since the advent of the SVM.


    In the early 2010s, however, there was a new revolution in machine learning: artificial
    neural networks.


    ![image](images/inline11_5.jpg)


    | [Learning to Read](#contents.xhtml#toc1_117)[*Understanding What a Neural Network
    Is*](#contents.xhtml#toc1_117) || [12](#contents.xhtml#toc1_117) |


    | --- | --- |


    The idea of building artificial neurons is not new. It dates back to the middle
    of the 20th century and understanding how the human brain works. In 1949, Donald
    Hebb, a Canadian psychologist, hypothesized that brain cells called neurons are
    the basis of the brain’s learning mechanism. He made a fundamental assertion:
    if two neurons are active at the same time, the synapses between them are strengthened.


    Today, neurobiologists know that it isn’t that simple, but the “Hebb rule” has
    paved the way for important neuroscience research and served as a foundation for
    artificial neural network development.


    ## [DRAW ME A NEURON](#contents.xhtml#toc2_118)


    An artificial neuron is nothing like a human neuron. It’s simply a term used to
    refer to a number-based computing operation. The computed result depends on several
    neuron input *parameters*.


    Let’s take a closer look.


    To begin with, the “neuron’s” input consists of a list of numbers, which are usually
    binary (0 or 1). Each number is multiplied by a coefficient, called a *weight*,
    and the first step of the calculation is to sum everything up. Mathematicians
    refer to this as the *weighted sum*.'
