- raw: 'Both evolutionary algorithms and the Tabu search method appear easy to use:
    You give the program some parameters and that’s it! It figures out the solutions
    all by itself.


    However, a lot of intelligence actually goes into choosing these parameters, for
    example, how they connect to neighbors in the search space for the Tabu search,
    how the genome is coded for individuals in evolutionary algorithms, what the right
    crossover method is for the solutions, and what the selection function is…


    In every instance, there is always a human who tells the computer how to handle
    the problem. Even though the computing method is generic, the intelligence that
    allows the problem to be solved is entirely human.


    | [Small but Strong](#contents.xhtml#toc1_74)[*Understanding How Ants Find Their
    Way*](#contents.xhtml#toc1_74) || [8](#contents.xhtml#toc1_74) |


    | --- | --- |


    The idea of banding together to resolve a problem isn’t limited to evolutionary
    algorithms. Another AI method based on this principle and inspired by nature is
    *multi-agent systems*. Unlike evolutionary algorithms, they work directly in the
    state space.


    ## [MULTI-AGENT SYSTEMS](#contents.xhtml#toc2_75)


    Multi-agent systems appeared in the early 1990s. They aren’t just used to make
    artificial intelligence algorithms. At first, they were a general technique used
    in developing computer programs.


    Imagine you want to build a city with houses, stores, transportation, and so on.
    You certainly aren’t going to make everything all at once. You start by designing
    neighborhoods, then you arrange them. In computer science, we work in the same
    way. No one writes a program with thousands of lines of code all in one go. We
    develop small pieces and assemble them with each other to build a program gradually.
    Computer scientists work little bit by little bit.


    Over time, these little bits of program have become more and more sophisticated,
    to the point that in the 1990s, they were no longer little bits of program but
    instead entire programs assembled with others. Each program in this assembly is
    capable of resolving a given problem but cannot function alone: it receives data
    from other programs and conveys the result of its calculations to another program.
    This small world of programs exchanges data from one end of our little computerized
    city to another. We call these little bits of program *agents* because they *act*
    on data to resolve the problem together.


    A computer program written in this manner, with basic programs coupled together,
    is called a *multi-agent system*. This type of system is somewhat similar to ant
    colonies: each ant does a very specific task (find a twig, find food, move the
    eggs, etc.) that it repeats tirelessly for the colony to function as a whole.
    Each ant’s work appears to be very simple and, yet, when combined together, they
    produce a structure that functions in a very complex manner.


    ## [THE ALGORITHM AND THE ANT](#contents.xhtml#toc2_76)


    To design a multi-agent system, we have to define what the different agents do,
    how they exchange information and how they work together to resolve a problem.
    Artificial intelligence takes inspiration from this technique to write algorithms
    capable of resolving difficult problems, such as the traveling salesman problem.


    The multi-agent algorithm used to resolve the traveling salesman problem is precisely
    called the “ant colony optimization” algorithm. It was invented in 1992 by the
    Italian researcher Marco Dorigo, who drew inspiration from the way ants move to
    propose a method to calculate a path.


    ![image](images/inline8_1.jpg)


    The principle is the following: Just as with evolutionary algorithms, we’re going
    to build a lot of solutions. Each agent is going to calculate a solution at random.
    But then these agents are going to exchange information about the solutions they’ve
    found:


    — How many miles did you travel?


    — 394.


    — Oh yeah, not bad! And which cities did you pass through?


    — Through Toulouse, then through Marseille. And you?


    — Me, through Bordeaux first, but it was 468 miles, which isn’t as good.


    — Yes, this isn’t as good.


    Actually, the agents don’t speak to each other. They just leave traces on the
    graph to inform the other agents of their calculations.


    ## [JUST LIKE IN THE ANT COLONY](#contents.xhtml#toc2_77)


    The idea of leaving a trace on the graph is directly inspired by what ants do
    in nature. As ants move about, they leave behind their *pheromones*. These are
    small odorous molecules that help guide other ants. For an ant, pheromones work
    like a message: “Hey guys, look over here, I went this way.” Ants like to follow
    other ants’ pheromones. In nature, it is possible to observe columns of ants following
    each other: each ant is guided by the pheromones of its fellow ants.


    When you place a mound of sugar near an anthill, the ants don’t notice it right
    away. They move about at random, and one of them eventually comes across this
    treasure trove. It then retraces its steps back to the anthill and leaves behind
    a trail of pheromones to guide its fellow ants.


    However, over time the pheromones evaporate. Thus, ants that take longer to return
    to the anthill from the mound of sugar will leave weaker pheromone trails: the
    odor will have enough time to evaporate before the ant gets back, and the other
    ants will not be so inclined to follow the same path. On the other hand, on the
    shortest paths, the pheromones won’t have enough time to evaporate: the odor will
    still be strong, and it will attract even more ants. If there are several paths
    from the anthill to the sugar, the ants will eventually take the shortest path.


    ## [CALCULATING A PATH WITH ANTS](#contents.xhtml#toc2_78)


    In computer science, the pheromones are replaced by the numbers that each bit
    of computer program (each *agent*) writes on the graph, directly associated with
    the lines connecting the points. In the computer’s memory, we write a list of
    all the connections, and for each connection we include a cell to store a number:
    a cell for the direct path from Toulouse to Marseille, a cell for the direct path
    from Toulouse to Bordeaux, a cell for the direct path from Bordeaux to Nantes,
    and so on. And in each cell, the agents that pass through this connection put
    the total distance they traveled.


    ![image](images/inline8_2.jpg)


    Let’s come back to the dialog between the two agents: the one who traveled 394
    miles and passed through Toulouse and then Marseille, and his colleague who passed
    through Bordeaux. The first one is going to record 394 in the Limoges-Toulouse
    cell, the Toulouse-Marseille cell, and all the other cells corresponding to this
    path. The second one is going to record 468 in the Limoges-Bordeaux cell and in
    all the other cells corresponding to the path that he took.


    Taking a path at random like our agents doesn’t take much time for a computer.
    Thus, we can ask a hundred agents to do this work. Each agent is going to record
    its total travel time on all the graph’s connections for all the paths it took.
    Once all of the agents have finished, for each connection the algorithm calculates
    the *average* distance in miles traveled by the agents who passed through it.


    Let’s use a concrete example. Let’s assume three agents – Anne, Bernard, and Celine
    – traveled from Marseille to Toulouse. In total, Anne traveled 260 miles; Bernard,
    275; and Celine, 210. We will, thus, put 400 (the average: 260 + 275 + 210)/3
    = 248) in the Marseille-Toulouse cell.'
