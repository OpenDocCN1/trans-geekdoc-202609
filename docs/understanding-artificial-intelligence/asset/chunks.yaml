- raw: 'The second step is to compare this sum with a value, called a *bias*. If the
    sum is greater, the neuron’s output is a value of 1. If this is the case, we say
    that the neuron fires up. If not, its output is 0. Note, however, that there is
    no object or light. This is simply a calculation that produces a certain result.


    The weight and bias are the neuron’s parameters. They allow us to control how
    it works.


    For example, let’s take the “neuron” below. We’ve indicated the inputs, the weight
    and the bias.


    ![image](images/inline12_1.jpg)


    In this example, the sum calculated by the neuron is:


    1 × 7 + 1 × (−2) + 0 × 3 + 1 × 5 = 10            


    The result (10) is smaller than the bias (13). Thus, the neuron’s output is 0
    (as a result, we say that it remains “off&#160;”). This is the result of the calculation.


    By way of comparison, here’s a diagram of a human neuron from an encyclopedia.
    You have to admit, this is totally different!


    ![image](images/inline12_2.jpg)


    ## [MORE TRIANGLES](#contents.xhtml#toc2_119)


    An artificial neural network is an algorithm that makes this type of “neural”
    calculations on data.


    The first networks were programmed in the mid-1950s to simulate human neurons,
    as in Hebb’s theory. This is how “neural” came to be used to describe this type
    of calculation. However, artificial neural networks really get their start with
    the *perceptron* algorithm, which was invented by Frank Rosenblatt in 1957.


    By seizing on the idea of artificial neurons, Rosenblatt programmed an algorithm
    capable of learning to recognize black-and-white triangle pictures. What made
    the perceptron unique was that the calculations were organized in consecutive
    “layers” of neurons, as in the drawing below:


    ![image](images/inline12_3.jpg)


    To the far left of the diagram, sensors transform the picture into numbers: each
    *pixel*^([1](#ch12.xhtml#fn12_1)) is transformed into a 0 if it is off or a 1
    if it is on (in gray in our drawing). The machine used by Rosenblatt for his experiments
    had a resolution of 400 pixels (20 × 20), which is ridiculously small compared
    to today’s photographs. The perceptron’s input is thus 400 numbers (0 or 1), which
    correspond to the picture’s pixels.


    The perceptron’s first layer is composed of several hundred neurons that each
    calculate a different result using these numbers. Each neuron has its own weight
    and its own bias, which makes all of the results different. From the first “layer”
    of calculations, we obtain several hundred numbers, which are either 0 or 1. For
    Rosenblatt this operation is the *assimilation*, and this first list of calculations
    is the “assimilation layer.”


    All of these results are then fed into a second input layer. Again, hundreds of
    different calculations produce hundreds of results, which are either 0 or 1. We
    could continue on like this for quite some time, but Rosenblatt, in an article
    published in *Psychological Review* in 1958, proposed stopping after two assimilation
    layers.


    The third and final layer contains only one neuron. It takes the numbers calculated
    by the preceding layer and runs a “neural” calculation to obtain a 0 or a 1. The
    goal of this little game is for the final output to be a 1 when the picture contains
    a triangle and a 0 in all other cases.


    ## [JUST A LITTLE FINE TUNING](#contents.xhtml#toc2_120)


    Unfortunately, it’s not that simple: the real difficulty consists of finding good
    values for each parameter and bias. It’s like a gigantic mixing console with millions
    of mixing knobs that need to be turned to just the right position.


    ![image](images/inline12_4.jpg)


    For each neuron, you have as many knobs as inputs. Imagine that the first layer
    of our perceptron contains 1,000 neurons; that makes 400,000 parameters to adjust,
    just for the first layer, and each one can be any value. There is no way we’re
    going to just happen upon the right configuration by chance.


    This is where supervised learning comes in.


    ## [A LONG LEARNING PROCESS](#contents.xhtml#toc2_121)


    The learning algorithm allows us to automatically calculate the values of the
    parameters that leads to the right answer: 1 when the picture provided is a triangle,
    and 0 if not.


    At the start, all the parameters are set to 0. For each example, the network calculates
    an output: it either fires up the “triangle” neuron or it doesn’t.


    If the answer is right (e.g. the triangle neuron fires up when the picture provided
    is indeed a triangle), we don’t touch anything. On the other hand, if the calculation
    is wrong, we need to adjust the weight and the bias. To do this, we’re going to
    increase or decrease by 1 all the parameters that were used to calculate the incorrect
    output.


    Concretely, if the network answered “yes” even though we showed the machine a
    round object, we look at all the neurons in the network that fired. Then, we lower
    by 1 all the weights that had an input of 1. But we don’t touch the ones that
    had 0, since they didn’t affect the neuron’s output.


    Let’s come back to our example with four values:


    ![image](images/inline12_5.jpg)


    No matter what the value of the third weight is, the sum will always be 10. When
    the input is 0, the weight isn’t used in the calculation.


    Thus, we decrease the neural network’s weights, but we also increase by 1 the
    bias of each neuron that fired so that they will be a little harder to fire up
    with the values provided. The idea is to make the last neuron not fire anymore
    if we feed it the same picture again.


    Conversely, if the network answers “no” even when the operator fed it a triangle,
    we have to increase the weights of the nonzero inputs and decrease the bias for
    the neurons that didn’t fire (to reduce how much they filter).


    Now, we make the same adjustments (move the sliders by 1 in one direction or the
    other) to each example in the learning database. Obviously, we don’t do this by
    hand. The weights are just numbers in a computer, and the algorithm does the calculations
    all on its own by considering thousands of previously memorized examples one after
    another. After a good number of examples, with a bit of luck, the knobs are in
    a position that allows them to recognize triangles, cats, or something else, based
    on what we decided to teach it.


    ![image](images/inline12_6.jpg)


    ## [WHERE DID MY BRAIN GO?](#contents.xhtml#toc2_122)


    Rosenblatt’s machine used less than a thousand “neurons”; however, that still
    leaves hundreds of thousands of calculations to do for each example. Despite that,
    this algorithm is generic enough to resolve many artificial intelligence problems,
    and the first results on triangles were very encouraging. Rosenblatt firmly believed
    that perceptrons could one day learn, make decisions, and translate texts into
    foreign languages.


    The euphoria didn’t last. In 1969, two renowned researchers published a book that
    brought this type of research to a screeching halt. They were none other than
    Marvin Minsky, one of the fathers of AI, whom we’ve already talked about, and
    Seymour Papert, another big name in computer science, to whom we’re indebted for
    Logo, an educational programming language.


    In their book, these two eminent researchers described the perceptron’s advantages
    and disadvantages. Among other things, they demonstrated that a “neural” calculation
    was incapable of resolving simple problems, like the famous “nonlinear problems”
    mentioned in the previous chapter. As they put it, a neuron with two inputs could
    not be adjusted to fire only when one of the inputs alone is 1 and the other is
    0: this is what we call the “exclusive or problem.”


    It is true: a “neural” calculation by itself is not capable of calculating a nonlinear
    function… but by layering the neurons as Rosenblatt proposed, even with only one
    assimilation layer, it is possible to circumvent this limitation and calculate
    just about any function. In fact, Rosenblatt’s triangle recognition problem is
    nonlinear, and it was solved with this neural model.'
