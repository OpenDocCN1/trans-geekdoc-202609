    Deep neural networks are a win-win. Not only are they no longer limited by the
    computer’s processing capacity (thanks to the GPUs, which allow it to run operations
    in parallel), but their layered arrangement allows us to obtain better learning
    results. What happiness!


    Of course, we have to determine how to configure the network – in other words,
    the way in which the calculations are performed. For this, researchers build several
    configurations with two, three, four, ten, or sixteen different-sized layers.
    Then they compare the performance of these different networks on the learning
    database so they can choose a configuration that produces the best results. This
    very empirical step is done automatically. The computer compares the outputs of
    the different configurations, based on the data provided by the human, by using
    the exploration algorithms written by the human.


    So, what’s the problem? Why isn’t everything resolved by these machine-built neurons?


    The machine learning system’s performance isn’t so much a result of the chosen
    configuration as it is a result of the way the data are built and analyzed by
    your algorithm. Let’s look at an example.


