- raw: "Unfortunately, many researchers misunderstood Minsky and Papert’s book. The\
    \ “exclusive or” example was cited indiscriminately in numerous scientific articles,\
    \ leading many to be skeptical of the perceptron. This despite the fact that,\
    \ by 1972, several publications in scientific journals demonstrated how to resolve\
    \ an “exclusive or” problem with a two-layer perceptron. Unfortunately, it would\
    \ be another ten years before anyone showed any interest in artificial neural\
    \ networks again!\n\n## [ONE MORE LAYER!](#contents.xhtml#toc2_123)\n\nNeural\
    \ networks would eventually come back in vogue in the early 1980s. As so often\
    \ happens in science when a theory starts to fade into memory, it was ultimately\
    \ reinvented. The physicist John Joseph Hopfield rediscovered neural networks\
    \ in 1982. He proposed a new model that, in the end, was not so different from\
    \ Rosenblatt’s perceptron and breathed new life into this scientific topic.\n\n\
    In 1986, the psychologist David Rumelhart and the computer scientists Geoffrey\
    \ Hinton and Ronald Williams proposed the notion of *back-propagation*, a new\
    \ learning algorithm inspired by the algorithms of the 1960s, to adjust the parameters\
    \ of mechanical controllers. Using some calculations, the algorithm determines\
    \ which parameters have contributed the most to the network’s right, or wrong,\
    \ answer. It then adjusts the weights and biases of these parameters more aggressively,\
    \ and adjusts less aggressively for the parameters that contributed “little” to\
    \ the result.\n\nIn this way, the algorithm finds the right parameter values much\
    \ more quickly.\n\n## [NETWORK SUCCESS](#contents.xhtml#toc2_124)\n\nThanks to\
    \ back-propagation, artificial neural networks made phenomenal progress! They\
    \ were quickly adopted in various domains to automate classification tasks, to\
    \ control robots, to predict market changes, to simulate how hydraulic systems\
    \ operate, and more.\n\nThe application we most often see in our daily life might\
    \ very well be automatic character recognition, which allows banks to verify check\
    \ amounts or the post office to sort mail by zip code. Most often, the machines\
    \ used are programmed with a single-layer perceptron and a back-propagation algorithm.\n\
    \nUp to the mid-1990s, neural networks were all the rage. However, they remained\
    \ difficult to manipulate. It takes years of training to be able to configure\
    \ a neural network for a given task. Researchers often learn by trial and error\
    \ and must use all of their expertise to determine the number of neurons an input\
    \ layer requires. You need to have just enough to calculate the nonlinear function,\
    \ but not too many!\n\nIndeed, each additional neuron increases the number of\
    \ calculations the machine must make. If you build an input layer from one thousand\
    \ neurons that each receive a thousand inputs, that’s already one million additions\
    \ and just as many multiplications. One iteration of an algorithm only takes one\
    \ second… but you have to repeat it on millions of examples to determine the weight.\n\
    \n## [ONE MORE SMALL BREAK](#contents.xhtml#toc2_125)\n\nNeural networks, as we\
    \ can see, require lots of calculations to be trained correctly. This is one reason\
    \ why Vapnik’s SVM (the support vector machine we saw in the previous chapter)\
    \ replaced neural networks in the 1990s. Because SVMs are much simpler to manipulate,\
    \ they obtain better results for classification tasks and, rather quickly, for\
    \ most supervised learning problems. By comparison, neural networks are limited\
    \ by a computer’s processing power.\n\nNevertheless, this would all change in\
    \ the late 2000s with the advent of a new calculation tool.\n\n\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_ \n\n[1](#ch12.xhtml#Cfn12_1)  In a computer, the picture\
    \ is cut up into little dots called *pixels*. To understand what a pixel is, stick\
    \ your nose up against a television screen or a poster. You’ll see small colored\
    \ dots that, from afar, make up the picture. Telephones, televisions, computer\
    \ screens, and internet images are all described by their *resolution*, which\
    \ is expressed as a number of pixels. This indicates the picture quality.\n\n\
    | [Learning as You Draw](#contents.xhtml#toc1_126)[*Understanding What Deep Learning\
    \ Is*](#contents.xhtml#toc1_126) || [13](#contents.xhtml#toc1_126) |\n\n| ---\
    \ | --- |\n\nIn the mid-2010s, a new type of computation appeared: graphics processing\
    \ unit (GPU) computation. This was a genuine revolution in the world of machine\
    \ learning.\n\n## [ARE VIDEO GAMES BAD FOR YOUR HEALTH?](#contents.xhtml#toc2_127)\n\
    \nA computer is made of numerous electronic components: the processor (or CPU)\
    \ that does the computation, the memory that stores the data, but also the keyboard,\
    \ screen, mouse, hard disk, and so on. All these components work with binary numbers\
    \ computation. Thus, the image you see on your screen is the result of operations\
    \ carried out by your computer to determine which pixels should be lit up and\
    \ which should not.\n\nWhen you read a web page or work on your tablet, the display\
    \ requires few operations: all of the computations can be done by the computer’s\
    \ processor. But when you play a video game, the computer has to continually process\
    \ new images to display them, and it has to delegate this work to a specific component:\
    \ the graphics card.\n\nGraphics cards are an essential component in video game\
    \ consoles and, just as often, computers. Each new generation offers better image\
    \ quality for a better gaming experience: it’s the graphics cards that make this\
    \ possible. The performance of these components has continuously increased since\
    \ the 1980s, driven by the formidable economic clout of the video game market.\n\
    \n## [PARALLEL COMPUTING](#contents.xhtml#toc2_128)\n\nA graphics card is made\
    \ up of hundreds (even thousands) of small mini-processors: “graphics processing\
    \ units” or GPUs. The processors are considerably less powerful than the computer’s\
    \ main processor, but they work “in parallel” – that is, all at the same time.\n\
    \nImagine you’re playing a tennis match. The ball is a yellow sphere that must\
    \ be displayed on the screen 60 times per second. To determine which pixels to\
    \ color yellow on the screen, the graphics card has to compute every 16 milliseconds\
    \ the ball’s position and its relative size. This is done by carrying out relatively\
    \ fast calculations on mathematical objects: matrices and vectors. Simply put,\
    \ we can say that this is just some additions and multiplications carried out\
    \ repeatedly on numbers stored in the computer’s memory.\n\nThe thousands of processing\
    \ units carry out all these operations at the same time for the image’s million\
    \ pixels, which allows the display to be updated very quickly. This is only possible\
    \ because all the small calculations on the pixels can be carried out independently\
    \ from one another. You don’t need to know the first pixel’s result to calculate\
    \ its neighbor’s. Computer scientists call this *parallel processing*.\n\n![image](images/inline13_1.jpg)\n\
    \n## [THE RETURN OF THE NEURAL NETWORKS](#contents.xhtml#toc2_129)\n\nIn the early\
    \ 2010s, AI researchers started to take an interest in graphics cards, which were\
    \ initially designed for video games and films. For a few hundred euros, it is\
    \ possible to acquire thousands of parallel computing units. True, these mini-processors\
    \ run very simple calculations, but they do them all at the same time, which is\
    \ very fast!\n\nSome AI algorithms, such as the Tabu algorithm we used for the\
    \ traveling salesman problem, are unable to make much use of parallel processing.\
    \ Each stage of the algorithm uses the result from the preceding stage: the calculations\
    \ are not independent. By contrast, other algorithms, such as neural networks,\
    \ can be run in parallel. The calculation of a layer’s first neuron does not need\
    \ the calculation from the layer’s second neuron: the two calculations are independent.\n\
    \nPlus, the calculations carried out by the neural network are simple: additions\
    \ and multiplications. The GPU’s small processing units are perfect for the job!\
    \ And that changes everything."
  fmt: '

    Unfortunately, many researchers misunderstood Minsky and Papert’s book. The “exclusive
    or” example was cited indiscriminately in numerous scientific articles, leading
    many to be skeptical of the perceptron. This despite the fact that, by 1972, several
    publications in scientific journals demonstrated how to resolve an “exclusive
    or” problem with a two-layer perceptron. Unfortunately, it would be another ten
    years before anyone showed any interest in artificial neural networks again!


    ## [ONE MORE LAYER!](#contents.xhtml#toc2_123)


    Neural networks would eventually come back in vogue in the early 1980s. As so
    often happens in science when a theory starts to fade into memory, it was ultimately
    reinvented. The physicist John Joseph Hopfield rediscovered neural networks in
    1982. He proposed a new model that, in the end, was not so different from Rosenblatt’s
    perceptron and breathed new life into this scientific topic.


    In 1986, the psychologist David Rumelhart and the computer scientists Geoffrey
    Hinton and Ronald Williams proposed the notion of `back-propagation`, a new learning
    algorithm inspired by the algorithms of the 1960s, to adjust the parameters of
    mechanical controllers. Using some calculations, the algorithm determines which
    parameters have contributed the most to the network’s right, or wrong, answer.
    It then adjusts the weights and biases of these parameters more aggressively,
    and adjusts less aggressively for the parameters that contributed “little” to
    the result.


    In this way, the algorithm finds the right parameter values much more quickly.


    ## [NETWORK SUCCESS](#contents.xhtml#toc2_124)


    Thanks to `back-propagation`, artificial neural networks made phenomenal progress!
    They were quickly adopted in various domains to automate classification tasks,
    to control robots, to predict market changes, to simulate how hydraulic systems
    operate, and more.


    The application we most often see in our daily life might very well be automatic
    character recognition, which allows banks to verify check amounts or the post
    office to sort mail by zip code. Most often, the machines used are programmed
    with a single-layer perceptron and a `back-propagation` algorithm.


    Up to the mid-1990s, neural networks were all the rage. However, they remained
    difficult to manipulate. It takes years of training to be able to configure a
    neural network for a given task. Researchers often learn by trial and error and
    must use all of their expertise to determine the number of neurons an input layer
    requires. You need to have just enough to calculate the nonlinear function, but
    not too many!


    Indeed, each additional neuron increases the number of calculations the machine
    must make. If you build an input layer from one thousand neurons that each receive
    a thousand inputs, that’s already one million additions and just as many multiplications.
    One iteration of an algorithm only takes one second… but you have to repeat it
    on millions of examples to determine the weight.


    ## [ONE MORE SMALL BREAK](#contents.xhtml#toc2_125)


    Neural networks, as we can see, require lots of calculations to be trained correctly.
    This is one reason why Vapnik’s SVM (the support vector machine we saw in the
    previous chapter) replaced neural networks in the 1990s. Because SVMs are much
    simpler to manipulate, they obtain better results for classification tasks and,
    rather quickly, for most supervised learning problems. By comparison, neural networks
    are limited by a computer’s processing power.


    Nevertheless, this would all change in the late 2000s with the advent of a new
    calculation tool.


    \_\_\_\_\_\_\_\_\_\_\_\_\_


    [1](#ch12.xhtml#Cfn12_1)  In a computer, the picture is cut up into little dots
    called `*pixels*`. To understand what a pixel is, stick your nose up against a
    television screen or a poster. You’ll see small colored dots that, from afar,
    make up the picture. Telephones, televisions, computer screens, and internet images
    are all described by their `resolution`, which is expressed as a number of pixels.
    This indicates the picture quality.


    | [Learning as You Draw](#contents.xhtml#toc1_126)[*Understanding What Deep Learning
    Is*](#contents.xhtml#toc1_126) || [13](#contents.xhtml#toc1_126) |


    | --- | --- |


    In the mid-2010s, a new type of computation appeared: graphics processing unit
    (GPU) computation. This was a genuine revolution in the world of machine learning.


    ## [ARE VIDEO GAMES BAD FOR YOUR HEALTH?](#contents.xhtml#toc2_127)


    A computer is made of numerous electronic components: the processor (or CPU) that
    does the computation, the memory that stores the data, but also the keyboard,
    screen, mouse, hard disk, and so on. All these components work with binary numbers
    computation. Thus, the image you see on your screen is the result of operations
    carried out by your computer to determine which pixels should be lit up and which
    should not.


    When you read a web page or work on your tablet, the display requires few operations:
    all of the computations can be done by the computer’s processor. But when you
    play a video game, the computer has to continually process new images to display
    them, and it has to delegate this work to a specific component: the graphics card.


    Graphics cards are an essential component in video game consoles and, just as
    often, computers. Each new generation offers better image quality for a better
    gaming experience: it’s the graphics cards that make this possible. The performance
    of these components has continuously increased since the 1980s, driven by the
    formidable economic clout of the video game market.


    ## [PARALLEL COMPUTING](#contents.xhtml#toc2_128)


    A graphics card is made up of hundreds (even thousands) of small mini-processors:
    “graphics processing units” or GPUs. The processors are considerably less powerful
    than the computer’s main processor, but they work “in parallel” – that is, all
    at the same time.


    Imagine you’re playing a tennis match. The ball is a yellow sphere that must be
    displayed on the screen 60 times per second. To determine which pixels to color
    yellow on the screen, the graphics card has to compute every 16 milliseconds the
    ball’s position and its relative size. This is done by carrying out relatively
    fast calculations on mathematical objects: matrices and vectors. Simply put, we
    can say that this is just some additions and multiplications carried out repeatedly
    on numbers stored in the computer’s memory.


    The thousands of processing units carry out all these operations at the same time
    for the image’s million pixels, which allows the display to be updated very quickly.
    This is only possible because all the small calculations on the pixels can be
    carried out independently from one another. You don’t need to know the first pixel’s
    result to calculate its neighbor’s. Computer scientists call this `parallel processing`.


    ![image](images/inline13_1.jpg)


    ## [THE RETURN OF THE NEURAL NETWORKS](#contents.xhtml#toc2_129)


    In the early 2010s, AI researchers started to take an interest in graphics cards,
    which were initially designed for video games and films. For a few hundred euros,
    it is possible to acquire thousands of parallel computing units. True, these mini-processors
    run very simple calculations, but they do them all at the same time, which is
    very fast!


    Some AI algorithms, such as the Tabu algorithm we used for the traveling salesman
    problem, are unable to make much use of parallel processing. Each stage of the
    algorithm uses the result from the preceding stage: the calculations are not independent.
    By contrast, other algorithms, such as neural networks, can be run in parallel.
    The calculation of a layer’s first neuron does not need the calculation from the
    layer’s second neuron: the two calculations are independent.


    Plus, the calculations carried out by the neural network are simple: additions
    and multiplications. The GPU’s small processing units are perfect for the job!
    And that changes everything.

