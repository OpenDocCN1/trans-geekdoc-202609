  fmt: '

    The A\* algorithm uses a heuristic to explore the state space. This heuristic
    consists of going in the right direction as much as possible, while staying on
    the right path as much as possible. This is also what you do when you find your
    way on a map: you know where your destination is, and you look how to get there
    with your finger by tracing your finger in a mostly straight line from your starting
    point.


    Likewise, when you walk along the street, you head in what you believe is the
    “right direction.” If you come upon an obstacle, you go around it, or you retrace
    your steps. In general, if you have a good estimate of your initial direction,
    this method is quite effective.


    This is exactly what our A\* algorithm is going to do. Instead of choosing, at
    every step, the point closest to the starting point that it hasn’t looked at yet,
    as Dijkstra does, it chooses a compromise between the distance from the starting
    point (to remain close to the shortest path) and the distance to the destination
    point as the crow flies (to come as close as possible to the goal).


    ## [FOLLOW THE CROWS](#contents.xhtml#toc2_42)


    Computer scientists call the distance as the crow flies (straight line distance)
    a `heuristic function`. It’s a rule of computation that gives a “not so bad” estimate
    of the distance to arrive at each point.


    This function must be easy to calculate: it is going to be used each time the
    algorithm encounters a new point as it explores the state space. If it takes three
    minutes to calculate the heuristic function’s output, we’ll never finish! With
    the GPS, this works out well: the straight line distance is very easy to evaluate
    because you know each point’s coordinates on the graph.


    ![image](images/inline4_5.jpg)


    But the heuristic function must also give the best possible estimate of the actual
    distance to the destination point – that is, the distance you’ll obtain when you
    take the path on foot, as opposed to flying over buildings. You might have some
    bad luck: there’s construction work on Rue du Pas-de-la-Mule and you have to take
    a huge detour on Rue Saint-Gilles. But, in general, this seems like a good path
    to follow.


    Actually, with the GPS, the straight line distance is an excellent heuristic.
    It is possible to mathematically prove that the path provided by the A\* algorithm
    is clearly the shortest path. Computer scientists say that this heuristic is `admissible`.


    This is not always the case. There are many computer science problems for which
    one must find a path on a graph. The A\* algorithm can be used with different
    heuristics, each one corresponding to a specific problem. The special thing about
    this algorithm is precisely how generic it is. Even if the heuristic function
    provided to the machine to resolve the problem is not admissible (in other words,
    it doesn’t guarantee it will find the shortest path on the graph), the A\* algorithm
    will find a solution rather quickly. It won’t necessarily be the best, but with
    a bit of luck it won’t be too bad.


    ## [THERE’S A TRICK!](#contents.xhtml#toc2_43)


    The GPS example allows us to understand that inside each AI algorithm there is
    inevitably a trick provided by a human: the heuristic.


    Resorting to heuristics stems from the fact that it is impossible for a computer
    to guarantee an exact solution to the problem posed in a reasonable amount of
    time. AI algorithms always calculate an approximation, and it’s the heuristic
    function (and, of course, a well-chosen algorithm) that allows us to obtain solutions
    that are “not too bad.” The quality of the solution will give people the sense
    that the machine is more or less intelligent.


    With the A\* algorithm, the programmer writes the heuristic as a function – for
    example, the straight line distance for a GPS. In other AI programs, as we’ll
    see throughout this book, other heuristics will be considered. In this way, computer
    scientists have created an illusion of intelligence by giving the algorithm instructions
    that allow it to find a good solution. For its part, the computer simply applies
    the heuristic. Undoubtedly, this is very rewarding for the computer scientists
    who make AI.


    | [Winning at Chess](#contents.xhtml#toc1_44)[`*Understanding How to Build Heuristics*`](#contents.xhtml#toc1_44)
    || [`5`](#contents.xhtml#toc1_44) |


    | --- | --- |


    We now have in our suitcase all the equipment we need to make our journey to the
    land of AI. A Turing machine, some algorithms, a bit of complexity, some graphs,
    and two or three heuristics: voilà, the computer scientist’s complete survival
    kit.


    To understand artificial intelligence, let’s take a stroll through computer science
    history.


    ## [A SHORT HISTORY OF AI](#contents.xhtml#toc2_45)


    Everything began in 1843, when Ada Lovelace wrote the first algorithm for Charles
    Babbage’s analytical engine, a precursor to the computer. In a way, this is the
    prehistory of computer science. The first programmable machines didn’t quite exist
    yet: Jacquard’s loom, invented in 1801, was already using perforated cards to
    guide needles, but it was purely a matter of controlling mechanical commands.
    The first machines to use computation and programming only appeared at the end
    of the 19th century, during the US census. The first entirely electronic computer,
    the ENIAC, was invented in 1945, a 100 years after Ada Lovelace’s algorithm. It
    is where we entered year zero in computer science… and everything would go much
    faster after this.


    In 1950, just five years after the arrival of the ENIAC, Alan Turing used the
    term “artificial intelligence” for the first time. This new concept was a massive
    hit, and in just a few years numerous AI algorithms were proposed.


    In the 1960s, computer science became widespread. The computer quickly became
    an essential tool in many industries, given its ability to store and process data.
    The A\* algorithm we discussed in the previous chapter dates back to this time
    period. In the 1970s, computers took over offices: employees could directly input
    and consult company data. Everyone was talking and thinking about AI!


    And yet it would take almost 20 more years for computers to beat humans at chess.
    What happened?


    During this time, AI hit a rough patch. After the first successes in the 1960s,
    society was full of enthusiasm. People imagined machines would soon be capable
    of surpassing humans in every activity. They thought we would be able to automatically
    translate Shakespeare to Russian and replace general practitioners with computers
    that could make a diagnosis based on a patient’s information.


    The reality check was brutal. Investors who had had a lot of hope for this promising
    field realized that AI only provided good results in a few limited domains. And
    just as before, a computer scientist had to systematically give the machine very
    specific algorithms and data. Without them, it was no more intelligent than a
    jar of pickles.


    It was very disappointing. At a time when we knew how to calculate a rocket’s
    trajectory to go to the moon, we couldn’t even program a robot capable of crossing
    the street without getting run over. The fallout with AI was quite simply on par
    with hopes it had generated.


    Unfortunately, it was all just a big misunderstanding between computer scientists
    on one hand, who were all excited by the prospect of having the first intelligent
    tasks completed by machines, and the general public on the other hand, who got
    carried away by what they saw in science fiction.


    Artificial intelligence paid a heavy price. From 1980 to 2010, approximately,
    only a few businesses agreed to invest in these technologies. Instead, most preferred
    to stick with exact algorithms they could manage and monitor easily.


    Feng-Hsiung Hsu and Murray Campbell, two young IBM engineers, began their career
    at this dire time. They set a goal that was both ambitious for AI and exciting
    for the general public: to build a computer program capable of defeating chess’s
    grand champions.


    ![image](images/inline5_1.jpg)

