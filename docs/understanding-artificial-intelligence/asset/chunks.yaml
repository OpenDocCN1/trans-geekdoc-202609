    In fact, this name has caused a huge misunderstanding between computer science
    researchers and AI users. Obviously, this isn’t a matter of letting programs loose
    in nature and expecting them to manage all on their own! We’re simply using a
    property of computer science. The data processing (for example, how to do an addition)
    is described in a program that is itself a datum provided to the machine. A program
    that is also a datum can be modified or built by another program.


    In this manner, you can write data-based programs capable of producing new AI
    programs.


    ![image](images/inline1_3.jpg)


    ## [OBEY, I SAY!](#contents.xhtml#toc2_10)


    Everything happens as if, like in the choose-your-own-adventure book, the author
    asked you to rewrite a page’s content by replacing certain words with others,
    or by writing new instructions on blank pages at the end of the book. The information
    manipulated by the computer, whether data or the program itself, can be modified
    by the program.


    However, this transformation only ever happens by obeying the algorithm’s instructions.
    A program cannot produce *just any* program. If the initial program doesn’t have
    good instructions, the resulting program will probably contain errors and be incapable
    of doing the most minimal “intelligent” processing. Let’s return to our example
    of the choose-your-own-adventure book. If the author’s instruction is to replace
    every “e” with “w,” there is little chance you’ll be able to continue the adventure
    after you’ve carried out the instruction on the page!


    It is also important to remember that the operations carried out by your learning
    program, which produces the processing program, always depend on the data it has
    received. In our choose-your-own-adventure book, an instruction of this kind might
    be “Find the first letter of the first item you picked up.” Thus, the modifications
    made depend on the data (here, the item you chose to pick up first). Obviously,
    if the data are poorly chosen, the resulting program won’t be very effective either.


    For this reason, an AI program using machine learning can only produce a “good”
    program if we give it good data and good instructions. None of this works all
    on its own!


    ## [ATTENTION: ONE PROGRAM CAN CONCEAL ANOTHER!](#contents.xhtml#toc2_11)


    We are a long way from seeing a computer write a program on its own to resolve
    a problem it has not been designed for. It is too difficult. There are too many
    differences in the data sets, and too many possible rules to write for such a
    program to run correctly. An AI that could resolve any problem and make you a
    cup of coffee as a bonus simply does not exist because each problem requires a
    specific program and the data to match it.


    To write AlphaGo, the champion Go program, the engineers at Google had to write
    an initial program to observe portions of Go games. Using these data, they wrote
    a second program capable of providing the best move in each situation. This required
    years of work! And they had to give the program good information so that it could
    *learn* from the data.


    The result obtained is specific to Go: you can’t just reuse it on another game.
    You could certainly adapt the analytical program and have it use different data
    to build another program capable of providing the best move in chess or checkers.
    It has been done by Google. But this requires the programmers to analyze the generation
    program, to modify it, to describe the rules of chess, and to explain how to analyze
    a chess board, which is, all in all, much different from a Go board. Your program
    cannot modify itself to produce something intelligent.


    Would we expect a race car to be capable of beating eggs and washing laundry?


    ![image](images/inline1_4.jpg)


    ## [SO, WHAT IS AI?](#contents.xhtml#toc2_12)


    To understand what AI is, we’re going to look at some different methods used to
    write artificial intelligence programs.


    All these methods rely on algorithms that are sometimes easy to understand but
    often difficult to put into practice. We will see how different tasks, each requiring
    the human ability to reason, has led researchers to invent methods to automate
    them. We will also see that, sometimes, these methods do not resemble at all what
    any relatively reasonable human would do in the same situation. Indeed, as [Minsky
    (1968)](#ch01.xhtml#ref1_1) once said, it’s a matter of making *“computer programs
    which perform tasks which are performed in a more satisfactory way by humans.”*
    It’s not about making them perform a task as a human would do it.


    Marvin Minsky’s definition of AI is, thus, somewhat frustrating. From the start,
    he puts a limitation on AI. As soon as a task performed by a machine equals human
    beings in performing the given task, it is no longer AI. And it’s kind of true:
    no one finds it extraordinary anymore that a GPS device shows the right way to
    go visit Grandma in Colorado just as well as if it had spent its whole childhood
    there. Yet it is indeed AI.


    There are, of course, other definitions of artificial intelligence. The definition
    proposed in issue 96 of *La Recherche* magazine (“Research”) in January 1979 is
    interesting. It states, *“Artificial intelligence seeks to equip computer systems
    with intellectual abilities comparable to those of humans.”* Once again, this
    is fantasy: “equipping machines with intellectual abilities comparable to humans.”


    This is a very ambitious goal. It does make you dream a little, and that’s why
    it’s exciting. The real question, however, is to find out how far we can go in
    this direction.


    ![image](images/inline1_5.jpg)


    ## [REFERENCE](#contents.xhtml#toc3_13)


    Minsky, M. (1968). *Semantic Information Processing*. The MIT Press, Cambridge,
    MA.


    \_\_\_\_\_\_\_\_\_\_\_\_\_


    [1](#ch01.xhtml#Cfn1_1)  Indeed, in some languages, such as French and German,
    computer science is called “informatics,” which has the same root as “information.”


    | [The Turing Test](#contents.xhtml#toc1_14)[*Understanding That It Is Difficult
    to Measure the Intelligence of Computers*](#contents.xhtml#toc1_14) || [2](#contents.xhtml#toc1_14)
