    -   [进化算法和 Tabu 搜索方法看起来使用起来很容易：你只需给程序一些参数，然后它就能自己找出解决方案！](https://wiki.example.org/feynmans_learning_method)


    -   但是，选择这些参数需要大量的智能，例如：在 Tabu 搜索中，参数如何与搜索空间中的邻居相连；在进化算法中，个体的基因如何编码；对解的适当交叉方法是什么；选择函数是什么……


    -   在每种情况下，总有一个**人**告诉计算机如何处理问题。尽管计算方法是通用的，但能够解决问题的智能完全是**人类**的。


    | Small but Strong*Understanding How Ants Find Their Way* || 8 |


    | --- | --- |


    **结合力量来解决问题的思想并不局限于进化算法。另一种基于此原则并受自然启发的 AI 方法是**_multi-agent systems_**。与进化算法不同，它们直接在状态空间中工作。**


    ## MULTI-AGENT SYSTEMS


    **多 agent 系统**出现在 20 世纪 90 年代初。它们不只是用于构建人工智能算法。最初，它们是用于开发计算机程序的通用技术。


    想象你想要建造一座包含房屋、商店、交通等的城市。你显然不会一次性完成所有事情。你先设计社区，然后安排它们。在计算机科学中，我们也是如此。没有人会一次性编写成千上万行代码的程序。我们开发小块，然后逐步将它们组装在一起，逐步构建程序。计算机科学家也是一小步一小步地工作。


    随着时间的推移，这些小块程序变得越来越复杂，到 90 年代，它们不再是小块，而是由其他程序组装而成的**整个程序**。每个程序在组装中都能解决特定问题，但不能单独工作：它接收其他程序的数据，并将计算结果传递给另一个程序。我们称这些小块程序为**agents**，因为它们**在数据上行动**以共同解决问题。


    以这种方式编写的、由基础程序耦合而成的计算机程序称为**multi-agent system**。这种系统在一定程度上类似于蚂蚁群：每只蚂蚁执行非常具体的任务（找树枝、找食物、搬运卵等），并反复进行这些任务以使整个蚁群运作。每只蚂蚁的工作看似简单，但当它们结合在一起时，能够形成一个运作非常复杂的结构。


    ## THE ALGORITHM AND THE ANT


    要设计一个多 agent 系统，我们需要定义不同 agents 的职责、它们如何交换信息以及它们如何协作解决问题。人工智能借鉴这种技术，编写能够解决困难问题的算法，例如**traveling
    salesman problem**（旅行售货员问题）。


    用于解决旅行售货员问题的多 agent 算法被称为**ant colony optimization**算法。它于 1992 年由意大利研究者**Marco
    Dorigo**发明，灵感来源于蚂蚁的移动方式，提出了一种计算路径的方法。


    ![image](img/inline8_1.jpg)


    **原理如下**：与进化算法类似，我们将构建大量解决方案。每个 agent 会随机计算一个解。随后，这些 agents 会交换关于它们找到的解决方案的信息：


    -   你走了多少英里？


    -   394。


    -   哦，不错！你经过了哪些城市？


    -   通过图卢兹，然后通过马赛。你呢？


    -   我先经过波尔多，但总共走了 468 英里，这不如前者好。


    -   是的，这不如前者好。


    实际上，agents 之间不直接交谈。它们在图上留下痕迹，以告知其他 agents 它们的计算结果。


    ## JUST LIKE IN THE ANT COLONY


    **在图上留下痕迹**的想法直接受到自然中蚂蚁的启发。蚂蚁在移动时会留下**pheromones**（信息素），这些是微小的有气味分子，帮助引导其他蚂蚁。对蚂蚁而言，信息素像一条信息：“伙计们，看这里，我走这条路。”蚂蚁倾向于跟随其他蚂蚁的信息素。在自然界中，可以看到蚂蚁形成列，沿着彼此的信息素行进：每只蚂蚁都被同伴的信息素引导。


    当你在蚁巢附近放一堆糖时，蚂蚁一开始不会注意到它。它们随机移动，最终有一只蚂蚁发现了这份宝藏。随后，它会回到蚁巢，并在路径上留下信息素，引导其他蚂蚁。


    然而，随着时间的推移，信息素会**挥发**。因此，返回蚁巢所需时间越长的蚂蚁，在路径上留下的信息素就越弱：气味有足够的时间挥发，其他蚂蚁不太可能沿着同一条路径行进。相反，在最短路径上，信息素不会有足够的时间挥发：气味仍然浓郁，会吸引更多的蚂蚁。如果有多条从蚁巢到糖的路径，蚂蚁最终会选择最短的路径。


    ## CALCULATING A PATH WITH ANTS


    在计算机科学中，信息素被**每个程序片段（即每个 agent）**在图上写下的数字所取代，这些数字直接关联到连接点的线段。在计算机的内存中，我们维护所有连接的列表，并且为每条连接提供一个单元格来存储数值：一个用于图卢兹到马赛的直接路径的单元格，一个用于图卢兹到波尔多的直接路径的单元格，一个用于波尔多到
    Nantes 的直接路径的单元格，以此类推。在每个单元格中，经过该连接的 agents 会记录它们走过的总距离。


    ![image](img/inline8_2.jpg)


    让我们回到前面两个 agents 的对话：一位走了 394 英里并经过了图卢兹和马赛，另一位经过了波尔多。前者会在 Limoges-Toulouse、Toulouse-Marseille
    以及其他对应路径的单元格中记录 394。后者会在 Limoges-Bordeaux 以及其它对应路径的单元格中记录 468。


    随机选择路径对计算机来说不花费多少时间。因此，我们可以让一百个 agents 同时工作。每个 agent 都会在它走过的所有路径上，记录在图上所有连接上的总行程距离。当所有
    agents 完成后，算法会为每条连接计算**平均**行程距离（即经过该连接的 agents 的总距离的平均值）。


    让我们用一个具体的例子来说明。假设三位 agents——Anne、Bernard 和 Celine——从马赛到图卢兹旅行。总体上，Anne 走了 260 英里，Bernard
    走了 275 英里，Celine 走了 210 英里。因此，我们会在 Marseille-Toulouse 单元格中填入 248（即 (260 + 275
    + 210) / 3 = 248）的平均值。

    '
