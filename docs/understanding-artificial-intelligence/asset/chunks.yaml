    how to respond, it sends the question back to the user: |


    | YOU: || What do you call cheese that’s not yours? |


    | ELIZA: || Why are you asking me what do you call cheese that’s not yours? It
    simply asks questions, letting the user provide the dialog. |


    ![image](images/inline2_3.jpg)

    '
  trans: '

    这些例子表明，虽然计算机特别擅长处理需要记忆和计算的任务（它们正是为此而设计的），但这并不意味着它们是智能的，因为人类智能包含许多其他方面。例如，我们能够通过依赖过去的经验来进行推理。这正是医生在做出诊断时所做的，也是我们在驾驶汽车、计划假期或工作时所做的。我们在无法准确描述的情境中做出决策，而这些情境对于计算机来说难以精确描述。


    我们也知道如何在学校或工作中学习新技能。我们能够利用之前的例子来形成新概念、创造新想法，并利用推理能力想象新工具。最重要的是，我们能够通过使用词语、构建句子以及组合符号来进行交流，从而传达复杂而往往抽象的概念。当你告诉朋友你最喜欢的小说时，他们能够理解故事，而无需阅读书中的确切文字。正是由于我们的智能，我们每时每刻都以新的方式看待世界，并且能够将它传达给身边的人。


    所有这些都表明，如果我们想将机器的能力与人类智能进行比较，我们需要做的不仅仅是比较记忆和数学能力。


    ## A TEST, BUT WHICH ONE?


    测量人类智能的一种方法是使用特定的心理测试。最著名的就是智商（IQ，Intelligence Quotient）测试，它于 20 世纪 50 年代由威廉·斯泰恩（William
    Stern）发明。要确定你的 IQ，心理学家会使用根据你年龄和受教育程度调整的练习题。这些题目考察你的逻辑推理、空间推理、记忆力等能力。你回答得越快且答对，你的
    IQ 分数就越高。


    显然，这种测试只测量了人类智能的一小部分。研究人员日益关注其他方面，如情感智能（理解自己情绪及他人情绪的能力）或艺术创造力。此外，IQ 分数并非绝对值：它仅用于将你与参加该测试的平均分人群进行比较。如果你的
    IQ 超过 100，意味着你在这项测试上表现优于平均水平。


    因此，我们可以思考：电脑的 IQ 是高于还是低于 100？遗憾的是，将 IQ 测试或其他测试改造以评估机器，是一项微妙的工作。首先，你需要把问题“翻译”成计算机能够理解的语言——换句话说，转化为
    0 和 1。做 IQ 测试时，心理学家会展示图片并口头提问。人类需要把这些问题“编程”到计算机中。


    在这种测试中，我们实际上能评估什么？机器的智能？让它回答问题的 AI 程序的智能？数据被翻译成计算机语言的方式？我们必须记住，任何程序都是由程序员使用算法和数据编写的（如上一章节所示）。那么，我们到底在测量什么？是程序员的智能？提供给机器的数据的质量？再一次，我们可以看到这些都与机器的“智能”无关。至少，其中很大一部分智能来自人类。


    ![image](img/inline2_2.jpg)


    ## AND THEN THERE WAS TURING!


    1950 年，阿兰·图灵（Alan Turing）提出了一种不同的测试，用于研究机器的能力。与其测量智能不同，他的思路是简单区分人类和机器。我们称之为图灵测试，至今仍被视为评估
    AI 程序的基准。


    图灵测试的原理很简单。它受到一场曾在社交活动中进行的游戏的启发，虽然这场游戏已久已失传。下面是规则：在游戏中，一名男性和一名女性各自进入不同的房间。其余的宾客留在客厅，通过向隔离的男性或女性发送便条与他们“交谈”。宾客无法直接与隔离的人交流，也不知道谁在哪个房间。他们必须猜出谁是男性、谁是女性，并且知道两人都在努力说服宾客自己是女性。


    在图灵测试中，一名真人在一间房间，而一台装有人工智能程序的计算机在另一间。你可以通过键盘（输入消息）和屏幕（阅读回复）与真人交流，也可以通过另一套键盘和屏幕与程序交流，但你不知道哪一套设备连接的是模仿人类的
    AI 程序，哪一套连接的是真实的人类。为增加难度，所有回复都在相同的时间间隔内给出；答复的速度不被考虑，你只能依据回复的内容来区分人类和 AI。


    ## IT CHATS…


    图灵测试至今仍是计算机科学家们关注的挑战。它催生了著名的“聊天机器人”（chatbots），即能够回答几乎任何问题的 AI 程序，从“如果你的奶酪不是你的，它叫什么？”到“你知道你的眼睛很美吗？”。为了表彰每年最佳聊天机器人，国际上设立了“洛布诺奖”（Loebner
    Prize）。1990 年，休·洛布诺（Hugh Loebner）承诺首位开发能够通过图灵测试的聊天机器人程序将获得 10 万美元和一枚金质奖章。由于没有人成功，2006
    年开始了年度竞赛：聊天机器人被评委们挑战让它们尽快给出错误的回答。这非常有趣。如果你想尝试，只需在网络或智能手机应用中搜索聊天机器人程序。网络上有大量此类程序，你很快就会让聊天机器人说出荒唐的话。但也可能会被一些高质量的回答所惊喜。尽管如此，官方的洛布诺奖评委——
    subject matter experts——只需不到五个问题就能辨认出聊天机器人。


    ## A CHATBOT NAMED ELIZA


    第一个聊天机器人由约瑟夫·维兹曼（Joseph Weizenbaum）于 1966 年开发，名为 ELIZA。


    它遵循一些非常基础的原则。首先，它拥有一个包含经典话题（家庭、计算机、健康）的句子词库。它会在用户的句子中识别关键词（如 family、mom、dad、sister
    等），从而系统地对话者进行回应：


    | YOU: || Do you have a mom? |


    | --- | --- |


    | ELIZA: || Do you want us to talk about your family? And when it doesn’t know
    how to respond, it sends the question back to the user: |


    | YOU: || What do you call cheese that’s not yours? |


    | ELIZA: || Why are you asking me what do you call cheese that’s not yours? It
    simply asks questions, letting the user provide the dialog. |


    ![image](img/inline2_3.jpg)

    '
