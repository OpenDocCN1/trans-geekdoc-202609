- raw: 'Not with what we know at present. “Weak” AIs have no ability to create or
    imagine. For this reason, they are unable to go beyond the framework programmed
    for them. Even when we talk of “autonomous vehicles,” or self-driving cars, the
    autonomy in question is limited to what the machine has been designed for. The
    car will not “turn” against its driver unless it has been programmed to do so.


    Isaac Asimov illustrated this situation very well in his *Robot* series. The characters
    are machines that obey the stories’ three laws of robotics, the first being to
    never injure a human being. Throughout the stories, we discover that the robots
    can adopt very strange behaviors, and even cause accidents. However, never do
    the robots violate the laws of robotics. No robot ever injures a human or allows
    a human to come to harm.


    Such “autonomous” systems are becoming more and more common, and we can see they
    are relatively harmless indeed… as long as we use them correctly! This is exactly
    like other tools we use on a daily basis. Lots of people get hurt each year with
    a screwdriver, a drill, or a saw, occasionally because of a defect, but more often
    because of misuse. However, these objects are not conspiring against us. This
    only happens in horror movies.


    As for strong AI that would be self-aware and determined to break free of our
    control, there is nothing preventing anyone from claiming it may exist one day.
    Artificial intelligence, the generalization of “big data,” and recent advancements
    in deep learning are undeniable leaps in technology. Yet they don’t bring us any
    closer to artificial consciousness. They are still just tools at the service of
    humans.


    ## [MISUSE OF AI](#contents.xhtml#toc2_154)


    The main danger with AI today is how these technologies can be used. Let’s consider
    search engines like Google and Baidu, for example. They allow anyone to access
    any information contained in the giant library that is the internet. But these
    same algorithms can be used to automatically filter the content you access. This
    is also what Facebook does when it calculates the information that might interest
    you based on your profile.


    This wouldn’t be so bad if social networks hadn’t become the main source of information
    for persons aged 18–24. What’s to prevent an information dictatorship controlled
    by tech giants or totalitarian states from deciding overnight what we can or cannot
    know?


    It’s the same thing for almost every AI technique. What’s to prevent the image
    recognition or automated decision-making technology currently used to develop
    self-driving cars from one day being used to develop killer robots capable of
    identifying their targets and eliminating them without human intervention? Many
    researchers including Stuart Russell have already raised alarms about the malicious
    use of AI technology.


    And they are right: it is urgent that we understand what AI algorithms are capable
    of so that we, humans, can decide what we choose to consider acceptable. We need
    to understand which AI uses we wish to prevent and how to guard against them.
    It is up to us to develop algorithms that do not violate these ethical rules –
    not even by accident.


    ![image](images/inline16_1.jpg)


    ## [AI SERVING PEOPLE](#contents.xhtml#toc2_155)


    Computer programmers, users, and politicians are all responsible for how AI will
    be used: above all, this is a legislation and ethics problem. It is important
    that we guard against potential malicious acts guided by political, religious,
    or economic ideologies. More than anything else, we mustn’t forget that artificial
    intelligence is there to help us, not to imprison us!


    Every day we use dozens of AI algorithms for our greater good, from braking systems
    on cranes and subway trains to information search tools that allow us to find
    an address, prepare a school presentation, or find our favorite song. These uses
    are often so insignificant that we don’t even realize we’re using AI.


    Without a doubt, AI programs will one day be used to commit crime. In fact, this
    has most likely already happened, even if only in the domain of cybersecurity:
    hackers use programs to accomplish tasks that, to them, are “intelligent.” This
    is AI. As a result, cybersecurity specialists develop AI algorithms to guard against
    this. They detect server intrusions with the help of machine learning and isolate
    infected network computers using multi-agent systems.


    We mustn’t aim at the wrong target: AI can be misused, but it doesn’t act on its
    own. It has been programmed by a programmer for a specific purpose. It has been
    used by a human with an objective in mind. In every instance, it’s a human who
    is ultimately responsible for how it is used.


    One mustn’t confuse a tool and its use. An AI can be misused. An AI cannot, however,
    become malicious spontaneously, at least not based on today’s scientific knowledge.


    ## [EXPLAINING, ALWAYS EXPLAINING](#contents.xhtml#toc2_156)


    One of the biggest issues with artificial intelligence is helping users understand
    what “intelligent” machines do.


    Self-driving cars will be on our roads soon. There will be accidents – it’s inevitable.
    When this happens, we will need to determine why the system made an error, whether
    it was used correctly, and in which circumstances this error might reoccur. This
    is why more and more researchers are taking an interest in developing “explainable”
    AI algorithms.


    Today, it’s very hard to explain an AI’s decision, whether it’s to play chess,
    to recognize a cat picture on the internet, or to drive a vehicle. The inputs
    are transformed into numbers, which are fed into tons of calculations. Therefore,
    it is not easy to determine which part of a calculation is responsible for a certain
    aspect of a decision.


    Some researchers attempt to write mathematical proofs to assess, or not, certain
    properties of a system. Others attempt to identify which properties have most
    contributed to the decision the system has made, such as recognizing the cat’s
    ears in the triangle example. The objective is to produce an output that is intelligible
    enough for us to subsequently explain it based on the program’s initial settings.


    This is a difficult subject, and I don’t think we can currently say this issue
    has been resolved. However, there is no doubt that in the coming years many AI
    algorithms will be developed that will be able to explain what information was
    used to form the basis of a decision. There may even be, as Stuart Russell proposes,
    algorithms capable of automatically detecting when they are about to make an error.


    | [To Infinity and Beyond!](#contents.xhtml#toc1_157)[*Understanding That AI Has
    Good Days Ahead*](#contents.xhtml#toc1_157) || [17](#contents.xhtml#toc1_157)
    |


    | --- | --- |


    Artificial intelligence is transforming our world. It is giving us machines capable
    of accomplishing tasks that, for a long time, we believed only humans are capable
    of. And while machines do not “think” in the same way humans do, AI’s progress
    is nothing short of incredible. This is why it inspires us to dream big.


    ## [WHERE ARE WE GOING?](#contents.xhtml#toc2_158)


    So many amazing things have been accomplished thanks to artificial intelligence.
    In light of so many advancements, it’s hard to know what comes next. So many challenges
    remain. Some of them appear to be within reach, others light years away, no matter
    how clever the person predicting what AI’s next success stories will be.


    Today, we know how to program machines that can easily win at Go or poker; however,
    AI is unable to beat humans at video games like League *of Legends* or StarCraft,
    despite the ability of a computer to give thousands of commands per second. Programs
    can find information in a medical encyclopedia faster than any human, and they
    can isolate genes, but they are still unable to make a medical diagnosis. Algorithms
    can find a path by accounting for traffic jams and will soon be able to navigate
    a car through town, but they are unable to explain why.'
  fmt: '

    Not with what we know at present. “Weak” AIs have no ability to create or imagine.
    For this reason, they are unable to go beyond the framework programmed for them.
    Even when we talk of “autonomous vehicles,” or self-driving cars, the autonomy
    in question is limited to what the machine has been designed for. The car will
    not “turn” against its driver unless it has been programmed to do so.


    Isaac Asimov illustrated this situation very well in his `Robot` series. The characters
    are machines that obey the stories’ three laws of robotics, the first being to
    never injure a human being. Throughout the stories, we discover that the robots
    can adopt very strange behaviors, and even cause accidents. However, never do
    the robots violate the laws of robotics. No robot ever injures a human or allows
    a human to come to harm.


    Such “autonomous” systems are becoming more and more common, and we can see they
    are relatively harmless indeed… as long as we use them correctly! This is exactly
    like other tools we use on a daily basis. Lots of people get hurt each year with
    a screwdriver, a drill, or a saw, occasionally because of a defect, but more often
    because of misuse. However, these objects are not conspiring against us. This
    only happens in horror movies.


    As for strong AI that would be self-aware and determined to break free of our
    control, there is nothing preventing anyone from claiming it may exist one day.
    Artificial intelligence, the generalization of “big data,” and recent advancements
    in deep learning are undeniable leaps in technology. Yet they don’t bring us any
    closer to artificial consciousness. They are still just tools at the service of
    humans.


    ## [MISUSE OF AI](#contents.xhtml#toc2_154)


    The main danger with AI today is how these technologies can be used. Let’s consider
    search engines like Google and Baidu, for example. They allow anyone to access
    any information contained in the giant library that is the internet. But these
    same algorithms can be used to automatically filter the content you access. This
    is also what Facebook does when it calculates the information that might interest
    you based on your profile.


    This wouldn’t be so bad if social networks hadn’t become the main source of information
    for persons aged 18–24. What’s to prevent an information dictatorship controlled
    by tech giants or totalitarian states from deciding overnight what we can or cannot
    know?


    It’s the same thing for almost every AI technique. What’s to prevent the image
