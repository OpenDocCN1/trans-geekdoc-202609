- raw: 'These two examples demonstrate that while computers are particularly well
    equipped to handle anything requiring memory and calculation (they were designed
    for this purpose), this doesn’t make them intelligent, because human intelligence
    consists of many other aspects. For example, we are able to reason by relying
    on our past experiences. This is what a doctor does when making a diagnosis, but
    this is also what each of us does when we drive a car, when we plan a vacation,
    or when we work. We make decisions in situations that would be impossible to describe
    accurately enough for a computer. When a baker tells us he’s out of flour, we
    understand that he can’t make any more bread. There’s no need for him to explain.


    We also know how to learn new skills at school or at work. We are able to use
    previous examples to form new concepts, create new ideas, and imagine new tools,
    using our ability to reason. Above all, we are able to communicate by using words,
    constructing sentences, and putting symbols together to exchange complex, often
    abstract, notions. When you tell your friends about your favorite novel, they
    understand the story without needing to read the exact words in the book. Thanks
    to our intelligence, we see the world in a new way every instant of our lives,
    and we are capable of conveying it to those around us.


    All of this goes to show that if we want to compare a machine’s abilities to human
    intelligence, we’re going to have to try something more than just memory and math.


    ## [A TEST, BUT WHICH ONE?](#contents.xhtml#toc2_16)


    To measure human intelligence, it is possible to use certain psychological tests.
    The most famous one is the IQ (or intelligence quotient) test, invented in the
    1950s by William Stern. To determine your IQ, the psychologist relies on exercises
    adapted to your age and your education. These exercises evaluate your capacity
    for logical reasoning, spatial reasoning, memorization, and so on. The more quickly
    you respond with the right answer, the higher your IQ score.


    Obviously, this kind of test only measures a small part of human intelligence.
    Researchers are increasingly interested in other aspects such as emotional intelligence
    (the ability to understand one’s emotions and those of other people) or artistic
    creativity. Moreover, an IQ score is not an absolute value: it only allows you
    to compare yourself with the average score of people who have taken this test.
    If you have an IQ over 100, it means you do better at this test than the average
    person.


    We could thus ask ourselves whether a computer has an IQ above or below 100. Unfortunately,
    adapting an IQ test, or any other test, to test a machine is a delicate operation.
    To start with, you would have to “translate” the questions into a language that
    the computer can understand – in other words, into zeros and ones. When you take
    an IQ test, a psychologist shows you pictures and asks you questions verbally.
    A human would have to “program” these questions into the computer.


    What could we really evaluate with such a test? The machine’s intelligence? The
    intelligence of the AI program that allows it to answer the questions? The way
    the data were translated into the computer’s language? We mustn’t forget that
    any program has to be written by a programmer using algorithms and data, as we
    saw in the previous chapter. So, what do we measure? The intelligence of the programmer
    who created and programmed the algorithm? The quality of the data given to the
    machine? Once again, we can see that none of this has anything to do with the
    machine’s “intelligence.” At the least, a good portion of this intelligence comes
    from a human.


    ![image](images/inline2_2.jpg)


    ## [AND THEN THERE WAS TURING!](#contents.xhtml#toc2_17)


    In 1950, Alan Turing proposed a different kind of test to study the ability of
    machines. Instead of measuring intelligence, his idea was to simply differentiate
    between man and machine. We call this the Turing test, and today it is still considered
    as a reference when it comes to AI programs.


    The principle is quite simple. It is inspired by a game that was played at social
    events, though it has long since gone out of style. Here you have it anyway, so
    you can spice up your birthdays and surprise parties. In this game, a man and
    a woman each go into a different room. The other guests, who remain in the living
    room, can “talk” with the man or the woman by sending notes to them through the
    servants. The guests cannot speak directly with the isolated persons, and they
    do not know who is in which room. They have to guess who is the man and who is
    the woman, and they know that both of them are trying to convince the guests that
    they are the woman.


    In the Turing test, you have a human in a room and a computer with an artificial
    intelligence program in the other. You can communicate using a keyboard (to type
    your messages) and a screen (to read their responses). Thus, you have a keyboard
    and a screen to speak with the human, and another keyboard and screen to speak
    with the program, but you do not know which one is connected to the AI program
    imitating a human and which one is connected to the real human typing the responses.
    To complicate things a little more, all the responses are given within the same
    time interval. The speed of the answers isn’t taken into consideration: you can
    only consider the content of the answers to distinguish between the human and
    the AI.


    ## [IT CHATS…](#contents.xhtml#toc2_18)


    The Turing test is a challenge that still keeps many computer scientists busy
    today. It has given rise to the famous “chatbots,” the artificial intelligence
    programs capable of speaking and answering just about any question one might ask
    them, from “What do you call cheese that is not yours?” to “Did you know you have
    beautiful eyes?” An international competition has even been created to recognize
    the best chatbots each year: the Loebner Prize. In 1990, Hugh Loebner promised
    $100,000 and a solid gold medal to the first programmer to develop a chatbot capable
    of passing the Turing test. As no one succeeded, an annual competition was started
    in 2006: chatbots are presented to judges who attempt to make them respond incorrectly
    as fast as possible. It is very amusing. If you want to give it a try, search
    for any chatbot program. There are plenty of them on the internet and in smartphone
    applications. You’ll very quickly get the chatbot to say something ridiculous.
    But you might also be pleasantly surprised by the quality of some responses. That
    being said, know that the official Loebner Prize judges, who are experts in the
    subject, are capable of identifying a chatbot in fewer than five questions.


    ## [A CHATBOT NAMED ELIZA](#contents.xhtml#toc2_19)


    The first chatbot was developed in 1966 by Joseph Weizenbaum. It is named ELIZA.


    It operates according to some very basic principles. For one thing, it is equipped
    with a sentence catalog of classic topics (family, computers, health). It spots
    a topic’s key words in the user’s sentence (family, mom, dad, sister, etc.), which
    allows it to systematically respond to its interlocutor:


    | YOU: || Do you have a mom? |


    | --- | --- |


    | ELIZA: || Do you want us to talk about your family? And when it doesn’t know
    how to respond, it sends the question back to the user: |


    | YOU: || What do you call cheese that’s not yours? |


    | ELIZA: || Why are you asking me what do you call cheese that’s not yours? It
    simply asks questions, letting the user provide the dialog. |


    ![image](images/inline2_3.jpg)'
