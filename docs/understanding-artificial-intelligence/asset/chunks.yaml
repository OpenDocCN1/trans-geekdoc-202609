- raw: "Now, let’s take a look at chess, which is, you’ll agree, slightly more interesting\
    \ than tic-tac-toe. Not all the pieces can move over all the squares, and each\
    \ kind of piece is subject to different rules. For this reason, calculating the\
    \ number of configurations is more complicated than tic-tac-toe. According to\
    \ the mathematician Claude Shannon, there are around 10^(120) possible chess games\
    \ – in other words, 10^(120) different games to examine to choose the best move.\
    \ To write this, we use the digit “one” followed by 120 zeros:\n\n1,000,000,000,000,000,000,000,000,000,000,000,000,000,000,000,000,000,\
    \  \n\n000,000,000,000,000,000,000,000,000,000,000,000,000,000,000,000,000,  \n\
    \n000,000,000,000,000,000\n\nTo give you a better idea, this is billions of billions\
    \ of billions… of billions of times more than the number of atoms in the entire\
    \ universe. It is impossible to imagine that a machine will someday be able to\
    \ examine all of these games in a reasonable amount of time. Currently, computers\
    \ are capable of going up to the first 10 zeros; that means there are still 110\
    \ more after that! Even if we assume the computing power of computers will continue\
    \ to double every two years, as suggested by Moore’s law,^([2](#ch05.xhtml#fn5_2))\
    \ we will have to wait 732 years before we are able to make a computer capable\
    \ of examining all the possible games in under a second.\n\nTo beat Garry Kasparov,\
    \ an artificial intelligence algorithm was needed. As we saw in the previous chapter,\
    \ this means two things. First, forget about always winning: this is the *heuristic\
    \ method*. Our computer will know how to play chess, but it will make mistakes:\
    \ that’s one of the rules of artificial intelligence. Second, we have to ask humans\
    \ which calculations to make in this heuristic so we can reduce the number of\
    \ mistakes.\n\n## [THE RETURN OF MINIMAX](#contents.xhtml#toc2_51)\n\nWhen adapted\
    \ to artificial intelligence, the minimax algorithm takes the principle of the\
    \ initial algorithm but adds two fundamental ideas. The first is to consider only\
    \ a subpart of the tree; the whole is too large to be computed by a machine. Instead,\
    \ the computer stops once it reaches a certain number of “reasonable” moves. In\
    \ other words, since it is impossible to calculate all the games, we’ll just look\
    \ at what happens for the first eight to ten moves.\n\nEven this makes for a lot\
    \ of games to look at. To give you an idea, imagine each player has ten possible\
    \ moves for each turn (there are generally many more). On the first move, made\
    \ by white, ten possibilities. When it’s black’s turn, again ten possibilities.\
    \ So, that’s 100 (10 × 10) possibilities for a two-move game. On the next move,\
    \ for white, again ten possibilities, and so on. On the tenth move, there are\
    \ already ten thousand (10^(10)) different games to consider. A computer even\
    \ from the early decades of the 2000s cannot go much beyond that.\n\nWith 10 moves,\
    \ it’s highly unlikely the game will be over. Actually, it will just be getting\
    \ started. Nevertheless, it is possible to assign a score to each of these “game\
    \ beginnings.” This is the second idea introduced in the minimax algorithm: using\
    \ a *heuristic function* provided by a human.\n\n## [A HEURISTIC TO WIN AT CHESS](#contents.xhtml#toc2_52)\n\
    \nIf we look at a chessboard during a game in progress, it may not be easy to\
    \ say who is going to win. But we can, nevertheless, say two or three interesting\
    \ things. If you’ve already lost your queen, a rook, and two knights, the game\
    \ is not off to a good start. In contrast, occupying the middle of the board early\
    \ in the game is generally considered to be a good tactical advantage.\n\nChess\
    \ players are able to assign scores to these different situations. When children\
    \ learn to play chess, they learn the values of each piece: a queen is worth 10,\
    \ a rook 5, the knight or the bishop 3, and so on. Using this idea, we can assign\
    \ a score to the chessboard. Additionally, we can award a bonus if a player is\
    \ occupying the center of the board, or a penalty if a player’s pieces are under\
    \ threat. This doesn’t allow us to say for sure who is going to win, but it gives\
    \ us an initial estimate.\n\nConcretely, this means that, even after only ten\
    \ turns, we can calculate a score for each chess game. In computer science, we\
    \ program this score as a heuristic function.\n\nFrom here, the principle is the\
    \ same as with von Neumann’s algorithm: the computer uses the score to calculate\
    \ minimums and maximums. It’s that simple! As we descend this initial genealogical\
    \ tree from the tree’s “leaves” (corresponding to the games of eight to ten moves)\
    \ toward the roots (corresponding to the game’s current situation), the algorithm\
    \ is able to tell which move corresponds to the maximum of minimums of the maximums\
    \ of the minimums, and so on. Thus, this is likely the best move at the moment.\n\
    \nNext, it’s your opponent’s turn. Here, the algorithm starts over based on the\
    \ new situation: it calculates all the eight- to ten-move games in advance and\
    \ applies the minimax method to choose the move that looks best. And so on and\
    \ so forth.\n\n## [EASIER SAID THAN DONE](#contents.xhtml#toc2_53)\n\nWith this\
    \ algorithm, you can write a program that plays chess pretty well – except for\
    \ a few key details.\n\nFor starters, the minimax algorithm can be improved by\
    \ “cutting” the tree branches we already know won’t provide a better result. This\
    \ method is known as the *alpha-beta pruning* method. John McCarthy, one of the\
    \ most famous researchers in artificial intelligence, proposed this pruning idea\
    \ at a Dartmouth workshop in 1956. This is not a new heuristic, because the cut\
    \ branches are “clearly” bad according to the minimax theorem. Thus, in practice\
    \ we don’t lose anything. On the other hand, this pruning allows us to work with\
    \ bigger trees and gain a few moves for your game estimate. Instead of only considering\
    \ the next 10 moves, the computer can go up to 15 or 16 moves!\n\nAfter this,\
    \ to win against the world chess champion, you need to write a good heuristic\
    \ function. This means you need to determine the value of the threatened pieces,\
    \ the captured pieces, the different strategic positions, and so on. Nevertheless,\
    \ all this requires a certain expertise in chess and quite a few attempts before\
    \ you find the right values.\n\nFinally, you need to have a supercomputer like\
    \ Deep Blue and a whole team of engineers to work on it for a decade! A small\
    \ consideration, of course.\n\n![image](images/inline5_5.jpg)\n\n## [A DISAPPOINTING\
    \ VICTORY](#contents.xhtml#toc2_54)\n\nThe Deep Blue victory in the late 1990s\
    \ did not give AI the renewed momentum we might have expected. The general public\
    \ and specialists alike were not convinced by the quality of Deep Blue’s playing.\
    \ And for good reason! Some of the computer’s moves were terrible. The algorithm\
    \ does not plan everything, and, unlike humans, it has no strategic knowledge.\n\
    \nIt wasn’t exactly a resounding victory either: some matches ended in draws,\
    \ and the decisive match appears to have been more the result of a mistake by\
    \ Kasparov, disconcerted by an unlikely move by Deep Blue, than by strategic and\
    \ tactical qualities worthy of chess’s best masters!\n\nWithout knowing everything\
    \ about the minimax algorithm, people easily understood that the IBM computer\
    \ simply applied a crude method and won by brute force. This computing power,\
    \ though not actual physical force, gives pretty much the same impression as if\
    \ Hulk Hogan (a 275-pound heavyweight wrestling champion) won a judo competition\
    \ against an Olympic champion who competes in the under-105-pound weight class.\
    \ Something doesn’t seem right.\n\nBut that’s exactly how AI works. And not just\
    \ in games and GPS. Remember: this is about allowing machines to perform *tasks\
    \ that are, for the moment, performed in a more satisfactory way by humans*. The\
    \ method isn’t important, it’s the result that matters."
