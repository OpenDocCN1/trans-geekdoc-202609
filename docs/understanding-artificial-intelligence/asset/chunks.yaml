    # [Introduction](#contents.xhtml#toc1_1)


    Humans have never stopped inventing tools. During prehistoric times, we cut stones
    and made harpoons for hunting. At the dawn of agriculture, we invented pickaxes
    and sickles for farming, carts to transport heavy loads, and even tools to make
    other tools! Over time, they became more and more complex.


    And then we invented machines.


    The first were the cranes of antiquity. More than simple tools, machines transform
    energy to accomplish tasks that humans would otherwise have difficulty completing.
    The car, the washing machine, the lawn mower: we couldn’t live without these inventions
    anymore.


    Artificial intelligence is sometimes presented as a new revolution. It seems possible
    to provide machines with self-awareness, to make them capable of thinking for
    themselves, even to surpass us. This is a fascinating perspective, but it’s also
    troubling. This is why each advancement in artificial intelligence gives rise
    to all sorts of fantasies.


    Our ancestors certainly had the same reaction – a mix of fear and nervous enthusiasm
    – when the first weaving looms appeared during the Renaissance. These machines
    were capable of doing work that, up to that point, could only be done by humans.
    Suddenly, a human was replaced by a human creation. Some people considered it
    the “devil’s machine,” while others looked at it and saw a future where no one
    would have to work any longer. Clothing would make itself! History has shown that
    the truth is somewhere in between.


    In 2016, many people were left in awe as AlphaGo, Google’s artificial intelligence
    program, beat Lee Sedol at the game Go. The program even went so far as to make
    a move no human player would ever have thought of. We had built a machine capable
    of surpassing humans on their preferred terrain: strategic thought.


    So what? Are we surprised if a car beats Usain Bolt in the 100-m dash? Humans
    have always tried to go beyond their limits. Artificial intelligence is simply
    a tool to do so. This is why we urgently need to demystify what AI means for us.


    AI has very little to do with the way it’s portrayed in science fiction novels.
    It is nothing like human intelligence, and there is no secret plan to replace
    us and enslave humanity. It is simply a tool, one of the best we have ever invented,
    but it has no will of its own.


    AI is an incredible force that is changing the world we live in. But just as with
    any tool created by man, one must learn how to use it and guard against misuse.
    To do so, we must understand artificial intelligence. That is the goal of this
    book: I want to take you on a walk in the land of AI. I want to share my amazement
    at this extraordinary tool with you.


    However, I also want to help you understand how AI works and what its limitations
    are.


    ![image](images/inlineintroduction_1.jpg)


    | [What is Artificial Intelligence?](#contents.xhtml#toc1_2)[*Understanding What
    a Computer, an Algorithm, a Program, and, in Particular, an Artificial Intelligence
    Program Are*](#contents.xhtml#toc1_2) || [1](#contents.xhtml#toc1_2) |


    | --- | --- |


    What is artificial intelligence? Before we start debating whether machines could
    enslave humans and raise them on farms like cattle, perhaps we should ask ourselves
    what AI is made of. Let’s be clear: artificial intelligence is not about making
    computers intelligent. Computers are still machines. They simply do what we ask
    of them, nothing more.


    ## [COMPUTER SCIENCE AND COMPUTERS](#contents.xhtml#toc2_3)


    To understand what a computer is and isn’t capable of, one must first understand
    what computer science is. Let’s start there.


    Computer science is the science of processing information.^([1](#ch01.xhtml#fn1_1))
    It’s about building, creating, and inventing machines that automatically process
    all kinds of information, from numbers to text, images, or video.


    This started with the calculating machine. Here, the information consists of numbers
    and arithmetic operations. For example:


    346 + 78 = ?


    Then, as it was with prehistoric tools, there were advancements over time, and
    the information processed became more and more complex. First it was numbers,
    then words, then images, then sound. Today, we know how to make machines that
    listen to what we say to them (this is “the information”) and turn it into a concrete
    action. For example, when you ask your iPhone: “Siri, tell me what time my doctor’s
    appointment is,” the computer is the machine that processes this information.


    ## [COMPUTERS AND ALGORITHMS](#contents.xhtml#toc2_4)


    To process the information, the computer applies a method called an *algorithm*.
    Let’s try to understand what this is about.


    When you went to elementary school, you learned addition: you have to put the
    numbers in columns, with the digits correctly aligned. Then, you calculate the
    sum of the units. If there is a carried number, you make note of it and then you
    add the tens, and so on.


    $\\begin{matrix} & 1 & 1 & \\\\ & 3 & 4 & 6 \\\\ + & & 7 & 8 \\\\ = & 4 & 2 &
    4 \\\\ \\end{matrix}$


    This method is an algorithm.'
