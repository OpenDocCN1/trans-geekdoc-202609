  trans: '

    确实，人工智能算法试图解决这些“不可能”的问题。显然，所提议的解决方案并不完美（正如我们刚才看到的，这是不可能的！）。该算法偶尔会错误地识别人脸，或者在下棋或翻译句子时出错。但该算法会在“合理”的时间内工作——换句话说，它使用的操作次数远少于理论上精确解所需的次数。


    非常常见的是，构建 AI 实际上是开发程序，在合理的时间内给出一个还不错的解决方案，即使我们知道正确的解决方案根本无法获得。


    在本书的其余部分，我们将看到一系列人工智能方法，它们不仅不智能，而且未必能提供问题所需的良好解决方案。承认吧，AI 的“智能”正逐渐令人存疑！


    尽管如此，你仍将看到它依然运行得相当不错。


    | 迷失在森林中*理解 AI 方法的第一项原则 – 探索* || 4 |


    | --- | --- |


    让我们以人类相当擅长的简单问题——“找到自己的路”——来开始进入 AI 领域的旅程。


    ## PARIS 的小散步


    想象你从布雷格-萨宾地铁站出来，正站在巴黎的中心，需要前往普拉塞·德·沃斯格雷以参观维克多·雨果故居。如下面的地图所示，你需要沿着布尔努瓦·里夏尔-勒诺尔大道向布拉热尔广场走一百码，然后右转进入维克多·雨果大街。接着，横过布欧马尔沙大道，沿
    Rue du Pas-de-la-Mule 走到普拉塞·德·沃斯格雷，那是左侧第二条街道。维克多·雨果故居就在这条街上。


    构建这条路线是人类利用智能可以轻松完成的任务。遗憾的是，并非每个人都具备完成这类危险任务的能力。如果不够小心，你很可能最终会在普拉塞·德·拉·里昂广场。


    ![image](img/inline4_1.jpg)


    为了克服这一困难，我们现在使用 GPS，这是一种能在任何时刻确定我们在地球表面上位置的设备。GPS 从二十八颗悬浮在我们头顶数千英尺的卫星接收信号。通过测量每颗卫星发送信号所需的时间，它计算出这些卫星的距离，从而确定自己在地球表面上的位置。


    ## GPS 的工作原理


    为了帮助你导航，汽车或手机中的 GPS 还附带一张地图。这是一个重要工具，展示了你可以去的所有地点以及它们之间的连接。想象一下，这在数据层面意味着什么：每个地址、每一段道路（即使只有几码长），每一个交叉路口……所有内容都必须在上面以
    GPS 坐标的形式呈现！每一个可能的位置都在地图上对应一个点，它们通过一个庞大的网络相互连接。


    我们用来从地铁口走到维克多·雨果故居的这段小地图上，已经有数百个点：地铁出口、街道（细分成必要的小段）、这些小段之间的所有交叉路口、这些小段上所有建筑的地址……所有这些点相互连接。


    正是得益于这张地图以及点之间的连接，GPS 能够显示从地铁口到布尔努瓦·里夏尔-勒诺尔大道、从大道到 Rue du Pasteur Wagner 的交叉口，乃至其他路段的行进方式。


    ## 寻找路径


    GPS 地图是一组相互连接的“点”。在数学和计算机科学中，这类集合被称为 *graph*。它使人工智能程序能够计算从图上的一个点到另一个点的路径。


    GPS 知道你当前所在位置（地铁口）。你告诉它想去的目标点（维克多·雨果故居）。它必须计算出你必须经过的所有点（大道的小段、Rue du Pas-de-la-Mule
    的小段等）才能到达目的地。


    从 GPS 的视角来看，你的路径是图上相邻的点的序列。在计算机科学中，我们说 GPS 的 AI 程序“在图上寻找路径”。该路径随后被两个 GPS 组件使用：图形界面，用于在地图上显示路径；以及语音合成器（那声小声说话的声音），在你经过每一个点时提示你：“500
    英尺后左转”。


    让我们考虑决定路径的人工智能程序。


    ## 比想象中更困难


    要开发一个 GPS 导航程序，我们必须编写一个算法，它在得到图、起点和终点时，能够*在图上找到一条路*。表述如此，我们便能感受到机器完全有能力完成这件事：我们拥有所有必要的数据。如果你把一张带有图的纸交给六岁的表亲，并让他画出路径，他应该能够轻松做到。


    但对于计算机来说，这正是难点所在。记住我们之前了解到的工作方式：它们是运行在磁带上的图灵机，对“单元格”进行操作。每个单元格对应机器的一个特定信息，它只能一次查看一个单元格。与我们不同，计算机不能“看到”整个图。它只能看到当前的一个点。


    把自己置于机器的位置，尝试寻找解决方案。你只能查看起点（本例中的地铁口），并从图上的相邻点中选择一个：布雷格大街、萨宾大街、布尔努瓦·里夏尔-勒诺尔大道、阿梅洛通道、布尔努瓦·里夏尔-勒诺尔大道
    21–23 号公寓，等等。你不能同时查看它们全部：必须逐一选择，将未查看的点保存到记忆中（在图灵机的其他情况下），然后从下一点重新开始。


    如果你选择布尔努瓦·里夏尔-勒诺尔大道，你现在可以查看它的邻居列表。列表中包含你已经看到的“地铁口”点，但仍有其他点。你可以把 Rue du Pasteur
    Wagner 加入待查看的点列表。接下来，你必须选择另一个点并重复此过程。


    如果你运气好，你会最终到达维克多·雨果故居。但在任何时候，你都无法判断你选择的点是离目标更近还是更远。你只能看到图上的即时相邻点。


    ![image](img/inline4_3.jpg)


    ## 迷失的探险者


    这真是令人不安，不是吗？计算机就像色诺斯在迷宫中：它可以在身后留下痕迹以记住走过的路，可以记住它到达的每个交叉口，但它永远不知道它选择的走廊会通向哪里！


    图上的路径寻找问题是人工智能领域的经典问题：计算机科学家称其为 *state space exploration*。


    尽管名字听起来像是在太空中发射携带美国旗帜的火箭，实际上它与太空毫无关系。在计算机科学中，state space 指的是机器所有可能状态的图，对于 GPS
    来说，则是所有可能的位置。state space exploration 就是在可能性空间中行走，从一个点到下一个点，一边记录已走过的路径，一边搜寻目标点。这正是色诺斯在迷宫中的样子。


    ## 太容易了！

