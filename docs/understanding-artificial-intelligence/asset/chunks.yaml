    Human behavior simulation is increasingly used in decision-making support systems:
    it helps leaders, politicians, and business owners analyze and understand complex
    phenomena such as opinion dynamics in politics, energy consumption, or even urban
    space occupation.


    ## JUDEA PEARL


    Judea Pearl is the inventor of `Bayesian networks`. This is an artificial intelligence
    method that combines symbolic reasoning (the objects manipulated by the Bayesian
    network can be interpreted by humans) with statistical learning (these objects
    are related by the probabilities that may be learned from the data). Bayesian
    networks are used in numerous applications to represent relationships between
    facts, in particular in bioinformatics, information research, and decision-making
    support systems.


    ## RICHARD RICHENS, JOHN SOWA, AND RONALD BRACHMAN


    In symbolic AI, machines attempt to reason about the knowledge contained in data,
    just like we do. For this, `knowledge representation` models are developed to
    program computers with the knowledge they are meant to manipulate. The first general
    knowledge representation model was proposed by Richard Richens in 1956. He dubbed
    this model a `semantic network`, and it led to many other advancements in artificial
    intelligence such as John Sowa’s conceptual graphs, proposed in 1976, and Ronald
    Brachman’s `description logics`,^([3](#ch18.xhtml#fn_3)) proposed in the mid 1980s.


    ## DEBORAH MCGUINNESS


    In the early 2000s, symbolic AI specialists invented the `semantic web`. This
    can be defined as a network of web pages written especially for computers using
    well-formed formulas so they can read internet content just as humans can. The
    semantic web uses computer models based on description logics and the OWL language
    invented by Deborah McGuinness and her colleagues.


    Nowadays, computers exchange “semantic” information on the internet to respond
    to our needs. For example, when you search for a celebrity using a search engine,
    you obtain a text box showing the person’s age, height, and general information.
    This information is taken from data in the semantic web.


