- raw: 'Each example is described by a set of attributes. ID3 then calculates the
    values of the branch so that the decision tree’s answer is correct for all of
    the database’s examples. The algorithm doesn’t just associate the values with
    the result: the instructions for the branch points are calculated so as to group
    together as many examples as possible in the databases.


    ![image](images/inline11_1.jpg)


    Let’s assume, for example, that we have a very basic medical diagnosis database.
    Our database indicates the temperature, throat color, and condition (sick or healthy)
    of each individual. By using the ID3 algorithm, we can build a decision tree to
    determine whether a person is sick or in good health. The algorithm is going to
    determine that everyone with a temperature over 100.4°F is sick, no matter their
    throat color or exact temperature value (100.8°F, 102.37°F, etc.). In this way,
    it is possible to group them together in one decision tree branch. Conversely,
    when the temperature is low, only individuals with a red throat are sick. This
    allows us to build the following decision tree:


    ![image](images/inline11_2.jpg)


    A decision tree like this can be used to diagnose a patient who isn’t in the database.
    Thus, if we input an individual with a temperature of 99.1°F and a normal throat,
    even if there is no example with these exact values in the corpus, the algorithm
    will be able to confirm that the individual isn’t sick!


    ## [LOTS OF EXAMPLES, LOTS OF VARIABLES](#contents.xhtml#toc2_108)


    You are probably better off consulting a physician instead of relying on this
    prediction, because this artificial intelligence program only works with data
    and variables we give it. With only two variables, we can’t expect a very accurate
    diagnosis!


    The ID3 algorithm and its successors, in particular the C4.5 algorithm, were among
    the most widely used learning algorithms in the 2000s. Not only are they capable
    of building compact trees, they can also deal with exceptions when an example
    from a database needs to be handled in a particular manner.


    To achieve this feat, at each stage of the tree, the Quinlan algorithm calculates
    which variable allows it to best separate all the examples it has been given.
    For Akinator, this means choosing the most relevant question to quickly arrive
    at the right answer. With the doctor, this means finding the variable and the
    value range that gathers the most examples. To do this, the algorithm measures
    the variables’ *data gains* using a mathematical function. Naturally, we must
    calculate this value for each variable and for all the examples. However, the
    calculation is relatively quick, even with thousands of examples and lots of variables.


    In its calculation, the algorithm also considers a few particular eventualities.
    If an example’s attributes cannot be generalized because its values are too specific,
    it is excluded from the decision tree. The algorithm, then, calculates how reliable
    each result produced by the final decision program. Thus, it is able to tell you
    “with 99.1°F and a normal throat, there is an 82% chance you are not sick.” Impressive,
    isn’t it?


    ## [TOO MUCH, IT’S TOO MUCH!](#contents.xhtml#toc2_109)


    The weakness of these algorithms is the amount of data you need to build a “good”
    classification. The more variables you have, the more examples you need.


    You’re right to suspect we normally don’t just use two or three variables to write
    an AI program. For each piece of data, there are usually several dozens of features,
    and sometimes many more! To interpret commands in a natural language like Siri
    does, for instance, we need thousands of dimensions.


    Thus, the number of examples required to build a good learning algorithm can be
    mind-boggling. Even with the enormous databases we’ve built since the 1990s, the
    results are rarely up to the task. This algorithm is not capable of calculating
    general rules.


    What we need, then, is another method.


    ## [THE KITTIES RETURN](#contents.xhtml#toc2_110)


    The other method we need has been around since 1963. It’s the support vector machine,
    or SVM, a model proposed by Vladimir Vapnik and Alexey Chervonenkis.


    For nearly 30 years, these two Russian researchers studied how classes are built
    from a statistical standpoint. The two mathematicians were interested in *data
    distribution*. Thus, they proposed an algorithm capable of classifying data, like
    ID3 does, but with many fewer examples. The idea is to “separate” the data so
    as to have the largest margin possible on each side of a dividing “line.”


    To understand this principle, imagine we have a system capable of recognizing
    cat pictures. We’ll only consider two dimensions: the number of triangles in the
    picture (a particular feature of cat ears) and the number of rounded shapes.


    ![image](images/inline11_3.jpg)


    We give our algorithm the four following examples: a cat photo, a cat drawing,
    a mountain landscape with a hill, and a view of the pyramids.


    Each picture is placed higher the more rounded shapes it has. Likewise, the more
    triangles it has, the further to the right it is placed.


    Naturally, it is impossible to build a system capable of recognizing the pictures
    based on these two dimensions alone. But this simple example allows us to understand
    how an SVM works.


    ## [THE MATHEMATICS OF ARTIFICIAL INTELLIGENCE](#contents.xhtml#toc2_111)


    The SVM’s first task is to analyze the examples supplied to the system during
    the learning phase and draw a straight line to separate the cat pictures from
    the rest. In theory, this is easy. But in practice, there are many ways to separate
    points in a space with only one straight line, as demonstrated by our two robots
    in the picture.


    ![image](images/inline11_4.jpg)


    In the first case, proposed by the robot on the left, the separating bar is very
    close to the photo of the cat and the photo of the pyramids, while the other two
    pictures are further away. By contrast, in the second case, the bar is really
    close to the picture of the mountain and the drawing of the cat. And between the
    two, there are many other possible positions. How do we choose?


    The first thing we can see is that these two “extreme” bar positions each pose
    a problem. Indeed, our objective isn’t simply to separate the pictures hanging
    on the board but to build a program capable of sorting through


    ![image](images/inline11_6.jpg)


    *new* cat and noncat pictures, without knowing which category they belong to ahead
    of time. If we choose the first dividing line, the one that comes near the photos,
    we have a high risk of error. Indeed, a very similar cat photo having slightly
    fewer curves or triangles will go on the other side of the line and end up being
    classified in the noncat category. By contrast, a picture of pyramids with slightly
    more curves would be considered a cat.


    Similarly, the solution proposed by the other robot, which comes very close to
    the cat drawing, is going to produce an algorithm that also makes mistakes easily.
    In the end, Vapnik proposed choosing the solution that provided the greatest margin
    possible from one side of the dividing line to the other, such that the two groups
    would be as far as possible from the line. Using mathematical calculations, the
    algorithm thus finds the straight line with the greatest margin. This increases
    its chances of correctly classifying future pictures.


    This algorithm is called the optimal margin separator. In the drawing with the
    third robot holding the bar, this means having the largest possible gray strip
    from one side of the separator to the other.


    ## [TOO MUCH CLASS!](#contents.xhtml#toc2_112)


    Using calculations, it is thus possible to separate the dimension space into two
    parts: the “cats” side and the “noncats” side, in our example.'
