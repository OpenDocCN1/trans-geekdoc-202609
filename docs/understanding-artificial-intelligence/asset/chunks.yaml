- raw: "Nothing says the techniques used have to resemble what a human would do. Quite\
    \ the contrary, the power of computers is their ability to process large amounts\
    \ of data very fast. Whereas a human will rely on reasoning and experience, a\
    \ machine will test a billion solutions, from the most absurd to the most relevant,\
    \ or search through giant databases in the same amount of time. It doesn’t think,\
    \ it computes!\n\nSo, this is somewhat disappointing. However, it would be absurd\
    \ to expect machines to do things “like humans.” They are not physically capable\
    \ of it.\n\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ \n\n[1](#ch05.xhtml#Cfn5_1)  The\
    \ name Deep Thought comes from the supercomputer in Douglas Adams’s humorous novel\
    \ *The Hitchhiker’s Guide to the Galaxy*. In the book, the computer computes the\
    \ “Answer to the Ultimate Question of Life, the Universe and Everything,” no less!\
    \ According to the author, the answer is… 42!\n\n[2](#ch05.xhtml#Cfn5_2)  In 1975,\
    \ the engineer and computer scientist Gordon Moore made a hypothesis that the\
    \ number of transistors on a microprocessor doubles every two years. This assertion\
    \ gave life to Moore’s law, which in plain language is “computer processing power\
    \ doubles every two years.” This very imprecise assumption has become a target\
    \ to aim for in the computer science industry, and it has pretty much been the\
    \ norm since the 1970s.\n\n| [The Journey Continues](#contents.xhtml#toc1_55)[*Understanding\
    \ That One Graph Can Conceal Another*](#contents.xhtml#toc1_55) || [6](#contents.xhtml#toc1_55)\
    \ |\n\n| --- | --- |\n\nUnlike humans, machines do not “think.” That’s why it’s\
    \ difficult to make true artificial intelligence.\n\n## [ON THE INTELLIGENCE OF\
    \ MACHINES](#contents.xhtml#toc2_56)\n\nAs humans, we resolve problems by using\
    \ our experience and our ability to reason. To develop AI algorithms, on the other\
    \ hand, we have to “think AI.” All we have is a Turing machine, a strip of tape\
    \ with small cells containing data and instructions to go from one cell to the\
    \ next. Therefore, we have to find a technique that works with this tool and its\
    \ strengths. This means computing power, not reasoning.\n\nTo help themselves\
    \ with this task, artificial intelligence researchers can take inspiration from\
    \ nature, which often does things very well. You may already have heard of *genetic\
    \ algorithms*, artificial *neural networks*, or *ant colony algorithms*. Behind\
    \ these peculiar names are AI methods inspired, in one form or another, by nature.\n\
    \n## [A VERY PARTICULAR TRAVELER](#contents.xhtml#toc2_57)\n\nTo understand these\
    \ different methods, let’s consider an amusing problem known as the *traveling\
    \ salesman* problem. Imagine you are a sales representative for some company –\
    \ a company that makes air conditioners, let’s say. Your job is to present your\
    \ new models in several large cities throughout France. Naturally, you want to\
    \ make the trip as efficient as possible by spending the least possible amount\
    \ of time on the road.\n\nWhen you put it that way, the problem looks similar\
    \ to our GPS story. However, it is very different.\n\n![image](images/inline6_1.jpg)\n\
    \n## [A HEALTHY WALK](#contents.xhtml#toc2_58)\n\nNaturally, it is also a graph\
    \ problem. If we represent each city as a point on a graph and connect each point\
    \ to all the others with “lines” showing the time required to go from one city\
    \ to the next, we indeed get a graph that we’ll have to travel across.\n\nBut\
    \ this isn’t about finding a path from one point to another. To start, all the\
    \ points are connected to each other. So the path is a piece of cake! What we\
    \ need is to find the shortest path that passes through *all* of the points on\
    \ the graph.\n\nThis problem is very well known in computer science… and it is\
    \ impossible to resolve it efficiently! It is nothing like the GPS problem or\
    \ Dijkstra’s algorithm: that’s child’s play compared to this! To give you an idea,\
    \ if you try to find an exact solution to the traveling salesman problem for a\
    \ graph with 20 points, the best algorithms possible will take a hundred years\
    \ to give you an answer with a modern computer. With Dijkstra’s algorithm, you\
    \ get an answer in under a second for a graph with 1,000 points.\n\n## [A REALLY\
    \ DIFFICULT PROBLEM…](#contents.xhtml#toc2_59)\n\nThe traveling salesman problem\
    \ has many applications in computer science, but that’s not all. In the “door-to-door”\
    \ category, in addition to urban furniture and sonic vacuum sales, it can also\
    \ be used by an power company to determine the route the meter reader should take,\
    \ by a pizza company for customer deliveries, by the post office to deliver mail\
    \ as quickly as possible, by the city to pick up garbage, and so on.\n\nThe solution\
    \ to this problem is also needed to optimize the computational costs for computer\
    \ graphics cards, to test electronic circuits, or to control the movements of\
    \ industrial machinery. The economic implications are huge!\n\nVery early on,\
    \ computer scientists sought to provide a “good” solution to the traveling salesman\
    \ problem in a reasonable amount of time, in the absence of an exact solution.\n\
    \n## [THE GREEDY ALGORITHM](#contents.xhtml#toc2_60)\n\nOver the course of time,\
    \ several AI algorithms have been proposed. The first of them has a very original\
    \ name: the *greedy* algorithm. This AI method uses a simple heuristic: at each\
    \ stage, the traveler chooses the city that is closest to where he is (and which\
    \ he hasn’t visited yet, of course).\n\nIn computing terms, we just choose the\
    \ one that’s the closest distance away from among the remaining unvisited points.\
    \ We can write the algorithm as follows:\n\nLet C be the set of all the non-visited\
    \ points in the graph.\n\nLet p be the closest point in C to the current position.\n\
    \nGo to the point and remove it from C.\n\nIf C is empty, you are finished. If\
    \ not, resume.\n\nThis algorithm is called “greedy” because it never reconsiders\
    \ a previously selected city. It just goes straight ahead, traveling miles and\
    \ miles without ever thinking about it.\n\n![image](images/inline6_2.jpg)\n\n\
    ## [AT LEAST, IT’S FAST!](#contents.xhtml#toc2_61)\n\nGreedy algorithms are used\
    \ in numerous problems in computer science. The version we use in the traveling\
    \ salesman problem is known as the *nearest neighbor algorithm* because it chooses\
    \ the nearest neighbor (from among those who haven’t been visited yet).\n\nWhat\
    \ can we say about this algorithm?\n\nFirst, it effectively calculates a solution:\
    \ that’s a good start. Plus, it does it very fast. The program’s complexity is\
    \ the number of points squared, the same as with Dijkstra’s algorithm, which we\
    \ used for the GPS. This means the computer can work on graphs with a thousand\
    \ points before hitting any real difficulty. Not so bad, right? Especially for\
    \ an AI algorithm that requires less than ten lines of computer code!\n\nNow,\
    \ with that being said, the solution probably won’t be the best. In certain cases,\
    \ it can even be very bad.\n\nImagine we leave from Limoges and have to visit\
    \ Toulouse, Bordeaux, Marseille, and Nantes before we return to Limoges. With\
    \ the greedy algorithm, we’re going to go to Bordeaux first (137 miles), then\
    \ to Toulouse (152 miles), then to Marseille (252 miles), before we go 615 miles\
    \ in the opposite direction to Nantes, passing through Bordeaux and Toulouse,\
    \ or through Clermont-Ferrand. If we had done a little thinking, we probably would\
    \ have gone to Nantes first, which is, admittedly, a little further from Limoges\
    \ than Bordeaux (186 miles), but then we would have passed through all the other\
    \ cities in a loop (Nantes, Bordeaux, Toulouse, Marseille), instead of making\
    \ the same trip twice. Our loop would have been 805 miles instead of almost 1,160\
    \ miles!\n\n## [COME ON, WE CAN DO BETTER!](#contents.xhtml#toc2_62)\n\nThe problem\
    \ with the greedy algorithm is that it doesn’t attempt to do any better than the\
    \ first path it determines. It’s a real shame because this first solution isn’t\
    \ necessarily very good, and it might be easy to fix a few mistakes, like going\
    \ to Nantes and back, which isn’t well positioned on the route."
  fmt: "\nNothing says the techniques used have to resemble what a human would do.\
    \ Quite the contrary, the power of computers is their ability to process large\
    \ amounts of data very fast. Whereas a human will rely on reasoning and experience,\
    \ a machine will test a billion solutions, from the most absurd to the most relevant,\
    \ or search through giant databases in the same amount of time. It doesn’t think,\
    \ it computes!\n\nSo, this is somewhat disappointing. However, it would be absurd\
    \ to expect machines to do things “like humans.” They are not physically capable\
    \ of it.\n\n\\_______ \n\n[1](#ch05.xhtml#Cfn5_1)  The name `Deep Thought` comes\
    \ from the supercomputer in Douglas Adams’s humorous novel *The Hitchhiker’s Guide\
    \ to the Galaxy*. In the book, the computer computes the “Answer to the Ultimate\
    \ Question of Life, the Universe and Everything,” no less! According to the author,\
    \ the answer is… `42`!\n\n[2](#ch05.xhtml#Cfn5_2)  In 1975, the engineer and computer\
    \ scientist `Gordon Moore` made a hypothesis that the number of transistors on\
    \ a microprocessor doubles every two years. This assertion gave life to `Moore’s\
    \ law`, which in plain language is “computer processing power doubles every two\
    \ years.” This very imprecise assumption has become a target to aim for in the\
    \ computer science industry, and it has pretty much been the norm since the 1970s.\n\
    \n| [The Journey Continues](#contents.xhtml#toc1_55)[*Understanding That One Graph\
    \ Can Conceal Another*](#contents.xhtml#toc1_55) || [6](#contents.xhtml#toc1_55)\
    \ |\n\n| --- | --- |\n\nUnlike humans, machines do not “think.” That’s why it’s\
    \ difficult to make true artificial intelligence.\n\n## [ON THE INTELLIGENCE OF\
    \ MACHINES](#contents.xhtml#toc2_56)\n\nAs humans, we resolve problems by using\
    \ our experience and our ability to reason. To develop AI algorithms, on the other\
    \ hand, we have to “think AI.” All we have is a `Turing machine`, a strip of tape\
    \ with small cells containing data and instructions to go from one cell to the\
    \ next. Therefore, we have to find a technique that works with this tool and its\
    \ strengths. This means computing power, not reasoning.\n\nTo help themselves\
    \ with this task, artificial intelligence researchers can take inspiration from\
    \ nature, which often does things very well. You may already have heard of *genetic\
    \ algorithms*, artificial *neural networks*, or *ant colony algorithms*. Behind\
    \ these peculiar names are AI methods inspired, in one form or another, by nature.\n\
    \n## [A VERY PARTICULAR TRAVELER](#contents.xhtml#toc2_57)\n\nTo understand these\
    \ different methods, let’s consider an amusing problem known as the *traveling\
    \ salesman* problem. Imagine you are a sales representative for some company –\
    \ a company that makes air conditioners, let’s say. Your job is to present your\
    \ new models in several large cities throughout France. Naturally, you want to\
    \ make the trip as efficient as possible by spending the least possible amount\
    \ of time on the road.\n\nWhen you put it that way, the problem looks similar\
    \ to our GPS story. However, it is very different.\n\n![image](images/inline6_1.jpg)\n\
    \n## [A HEALTHY WALK](#contents.xhtml#toc2_58)\n\nNaturally, it is also a graph\
    \ problem. If we represent each city as a point on a graph and connect each point\
    \ to all the others with “lines” showing the time required to go from one city\
    \ to the next, we indeed get a graph that we’ll have to travel across.\n\nBut\
    \ this isn’t about finding a path from one point to another. To start, all the\
    \ points are connected to each other. So the path is a piece of cake! What we\
    \ need is to find the shortest path that passes through *all* of the points on\
    \ the graph.\n\nThis problem is very well known in computer science… and it is\
    \ impossible to resolve it efficiently! It is nothing like the GPS problem or\
    \ Dijkstra’s algorithm: that’s child’s play compared to this! To give you an idea,\
    \ if you try to find an exact solution to the traveling salesman problem for a\
    \ graph with 20 points, the best algorithms possible will take a hundred years\
    \ to give you an answer with a modern computer. With Dijkstra’s algorithm, you\
    \ get an answer in under a second for a graph with 1,000 points.\n\n## [A REALLY\
    \ DIFFICULT PROBLEM…](#contents.xhtml#toc2_59)\n\nThe traveling salesman problem\
    \ has many applications in computer science, but that’s not all. In the “door-to-door”\
    \ category, in addition to urban furniture and sonic vacuum sales, it can also\
    \ be used by an power company to determine the route the meter reader should take,\
    \ by a pizza company for customer deliveries, by the post office to deliver mail\
    \ as quickly as possible, by the city to pick up garbage, and so on.\n\nThe solution\
    \ to this problem is also needed to optimize the computational costs for computer\
    \ graphics cards, to test electronic circuits, or to control the movements of\
    \ industrial machinery. The economic implications are huge!\n\nVery early on,\
    \ computer scientists sought to provide a “good” solution to the traveling salesman\
    \ problem in a reasonable amount of time, in the absence of an exact solution.\n\
    \n## [THE GREEDY ALGORITHM](#contents.xhtml#toc2_60)\n\nOver the course of time,\
    \ several AI algorithms have been proposed. The first of them has a very original\
    \ name: the *greedy* algorithm. This AI method uses a simple heuristic: at each\
    \ stage, the traveler chooses the city that is closest to where he is (and which\
    \ he hasn’t visited yet, of course).\n\nIn computing terms, we just choose the\
    \ one that’s the closest distance away from among the remaining unvisited points.\
    \ We can write the algorithm as follows:\n\nLet `C` be the set of all the non-visited\
    \ points in the graph.\n\nLet `p` be the closest point in `C` to the current position.\n\
    \nGo to the point and remove it from `C`.\n\nIf `C` is empty, you are finished.\
    \ If not, resume.\n\nThis algorithm is called “greedy” because it never reconsiders\
    \ a previously selected city. It just goes straight ahead, traveling miles and\
    \ miles without ever thinking about it.\n\n![image](images/inline6_2.jpg)\n\n\
    ## [AT LEAST, IT’S FAST!](#contents.xhtml#toc2_61)\n\nGreedy algorithms are used\
    \ in numerous problems in computer science. The version we use in the traveling\
    \ salesman problem is known as the *nearest neighbor algorithm* because it chooses\
    \ the nearest neighbor (from among those who haven’t been visited yet).\n\nWhat\
    \ can we say about this algorithm?\n\nFirst, it effectively calculates a solution:\
    \ that’s a good start. Plus, it does it very fast. The program’s complexity is\
    \ the number of points squared, the same as with Dijkstra’s algorithm, which we\
    \ used for the GPS. This means the computer can work on graphs with a thousand\
    \ points before hitting any real difficulty. Not so bad, right? Especially for\
    \ an AI algorithm that requires less than ten lines of computer code!\n\nNow,\
    \ with that being said, the solution probably won’t be the best. In certain cases,\
    \ it can even be very bad.\n\nImagine we leave from Limoges and have to visit\
    \ Toulouse, Bordeaux, Marseille, and Nantes before we return to Limoges. With\
    \ the greedy algorithm, we’re going to go to Bordeaux first (137 miles), then\
    \ to Toulouse (152 miles), then to Marseille (252 miles), before we go 615 miles\
    \ in the opposite direction to Nantes, passing through Bordeaux and Toulouse,\
    \ or through Clermont-Ferrand. If we had done a little thinking, we probably would\
    \ have gone to Nantes first, which is, admittedly, a little further from Limoges\
    \ than Bordeaux (186 miles), but then we would have passed through all the other\
    \ cities in a loop (Nantes, Bordeaux, Toulouse, Marseille), instead of making\
    \ the same trip twice. Our loop would have been 805 miles instead of almost 1,160\
    \ miles!\n\n## [COME ON, WE CAN DO BETTER!](#contents.xhtml#toc2_62)\n\nThe problem\
    \ with the greedy algorithm is that it doesn’t attempt to do any better than the\
    \ first path it determines. It’s a real shame because this first solution isn’t\
    \ necessarily very good, and it might be easy to fix a few mistakes, like going\
    \ to Nantes and back, which isn’t well positioned on the route.\n"
