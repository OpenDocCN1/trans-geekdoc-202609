    When you work with only one processor, you cannot build a neural network with
    more than one layer of a thousand neurons. However, thanks to the little GPUs
    working in parallel, it is possible to design networks with several layers … and
    practically as many neurons as you want on each layer!


    `*Deep learning*` is the name researchers have given to these neural network algorithms
    with multiple assimilation layers, as opposed to the perceptron, which is limited
    to only one assimilation layer.


    ## [WHY ADD MORE?](#contents.xhtml#toc2_130)


    It isn’t necessary to descend into the depths of the abyss to resolve AI problems
    using neural networks. With just two assimilation layers, you already have a deep
    network.


    In theory, adding additional layers does not allow you to calculate new things.
    Mathematicians have shown that a network with only one assimilation layer could
    learn the same thing as a deep network … provided it has enough neurons. However,
    in practice it’s not that simple.


    Building a “deep neural network” algorithm accelerates convergence in the learning
    process; in other words, it boosts the speed with which you obtain good positions
    for the network’s adjustable knobs. Recall that our goal is to adjust thousands
    of parameters in order to correctly respond to an input. This is done by progressively
    adjusting the parameters” values based on the examples in the learning phase.


    In a deep network, the “right” values for each layer’s parameters depend on the
    preceding layer’s work. Everything happens as if you have broken down your big
    problem into a series of calculations that depend on each other but are simpler
    to adjust. By breaking the problem down, and combining it with a good back-propagation
    algorithm, it takes much less time to determine weight values that will produce
    good results.


    ![image](images/inline13_2.jpg)


