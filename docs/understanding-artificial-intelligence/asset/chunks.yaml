    ## [FROM THEORY TO PRACTICE](#contents.xhtml#toc2_48)


    The algorithm that allows computers to win at chess against the best players in
    the world takes its inspiration from the method defined by the minimax theorem.
    Naturally, it’s called *the minimax algorithm*. The idea is relatively simple:
    attempt all the moves possible, then all the opponent’s possible moves (for each
    possible move), then all the possible responses, and so on until one of the two
    players wins.


    This builds a kind of genealogical tree of possible game situations starting from
    the initial situation. In this tree, the root is the initial state of the game
    (no player has made a move), and each move corresponds to a branch leading to
    the state of the game once the move has been made, as shown in the following drawing.


    ![image](images/inline5_3.jpg)


    The idea behind the minimax algorithm is to use this genealogical tree to choose
    the best move. Starting at the “final” situations at the top of the tree (in other
    words, the endings of the games), we move downward toward the root.


    To begin, we transform all of this into numbers because computers are machines
    that manipulate numbers. Then, we assign a score to each final situation. For
    example, in Mancala, the score could be the number of seeds obtained minus the
    opponent’s seeds. In chess, the score could be 0 if you lose, 1 if you draw, and
    2 if you win.


    Imagine now that you are at the last move of the game. If it’s not your turn,
    the logical choice for your opponent is to make the winning move. Put another
    way, your opponent is going to make a move that achieves the least optimal final
    situation for you (unless you’re playing someone totally stupid). Thus, the other
    player’s goal is to achieve the *minimum* score (from your point of view). Conversely,
    if it’s your move, you want to choose the move leads you to the *maximum* score.
    Therefore, the score of a situation when there is only one move left is the final
    situation’s minimum (or maximum) score.


    And for the move right before it? It’s the same, except the roles are reversed!
    You must choose the move that leads to the minimum (if it’s your opponent’s turn)
    or the maximum (if it’s your turn) of what we just calculated for the final move.
    The score of each situation two moves from the end is, thus, the maximum of the
    minimum (or the minimum of the maximum: this depends on the player).


    Thus, von Neumann’s algorithm starts at the game’s final moves at the top of the
    tree and moves “downward” toward the root by alternating the minimums and the
    maximums. Hence the algorithm’s name: the move you must choose at the end is the
    maximum of the minimums of the maximums of the minimums of the maximums of the
    minimums. In sum, it’s minimax!


    ![image](images/inline5_4.jpg)


    This is somewhat hard to imagine because we aren’t machines. For a computer, calculating
    these maximums and minimums is very easy, just like exploring the state space
    we saw in the previous chapter. The program consists of less than ten lines of
    code!


    In all of this there isn’t necessarily any artificial intelligence. The reason
    for this is quite simple: when the minimax algorithm was invented in the late
    1920s, a machine’s computing power wasn’t relevant. Computers didn’t even exist
    yet!


    ## [ANOTHER LIMIT TO COMPUTERS?](#contents.xhtml#toc2_49)


    To apply the von Neumann method directly, one must make a genealogical tree of
    all the possible games. This task varies in difficulty depending on the game in
    question.


    Let’s start with tic-tac-toe. Von Neumann’s method can be applied directly. If
    we consider the symmetries and the fact that the players stop playing as soon
    as one of them has won, there are 26,830 possible games in tic-tac-toe. For a
    machine, examining these 27,000 configurations and calculating the maximums and
    minimums is actually a piece of cake! With several billion operations per second,
    your brain would take longer to read the result than the machine would to calculate
    the best move! There is no complexity problem here, so there’s no need to resort
    to artificial intelligence. The von Neumann method works.


    ## [CHECKMATE, VON NEUMANN!](#contents.xhtml#toc2_50)

    '
  trans: '

    ## A NEW CHALLENGE


    下棋需要智慧，毫无疑问。要理解每个棋子的移动方式需要几个小时，要玩得好则需要多年的训练。国际象棋冠军是细心的观察者，并致力于研究各种战术。


    因此，创建一个能在国际象棋上获胜的机器是一个真正的挑战。不可能“编程”所有战术：需要考虑的情况太多，以及棋子和位置之间的交互作用太复杂，无法为计算机编写规则。你必须换一种思路。


    IBM 研究部门的“Deep Blue”项目能够应对这一挑战。Hsu 和 Campbell 毕业后不久便被雇佣，他们在卡内基梅隆大学期间就曾作为学生项目参与过类似工作。IBM
    研究部门的负责人非常睿智，他让他们在当时极为稀缺的计算资源下继续推进该项目。20 世纪 80 年代，IBM 正在研发超级计算机，能够处理比普通计算机快得多的信息。第一台
    IBM 国际象棋机 Deep Thought，^(1) 每秒可评估 3,000 种局面！


    然而，它在 1989 年输给了加里·卡斯帕罗夫。最终在 1997 年，Deep Blue——由 256 个处理器组成、能够在三分钟内评估 2000 亿种局面的机器——战胜了当之无愧的世界冠军……并且仅仅差了一点点！


    ## AN OLD ALGORITHM


    令人惊讶的是，Hsu 和 Campbell 用来获胜的算法并不新颖。它在计算机尚未发明之前就已存在！该算法由数学家约翰·冯·诺伊曼提出，另一位计算机科学的大人物。冯·诺伊曼因发明后来被称为计算机的电路而闻名。


    早在此之前，1928 年，冯·诺伊曼就开始关注“组合性游戏”。这些是两位玩家、信息完全公开且无随机性的游戏，国际象棋只是其中的一个例子：两名玩家看到相同的局面（完全信息），且没有随机性，与蛇与梯子不同。国际象棋和跳棋可能是西方文化中最为人知的两种组合性游戏。但你是否玩过
    Reversi，玩家翻转棋子；以及非洲著名的 Mancala 游戏，玩家在小坑中放置种子以“捕获”对手的种子？约翰·冯·诺伊曼证明，在这类游戏中，总存在一个确定最佳走法的算法，即
    *minimax 定理*。


    我们不能简单地直接套用该算法，这正是它的微妙之处。以棋类 Hex 为例，这是一款 1950 年代推出的棋盘游戏，双方通过六边形棋子试图连接对方的两侧，同时阻止对方。最小最大定理证明，存在一个算法可以计算最佳走法。Hex
    的发明者、未来 1994 年经济学诺贝尔奖得主 John Nash 甚至证明，首位玩家总能通过正确的走法获胜！自动计算这一策略（即利用算法）却是一个极其复杂的问题，即使计算机拥有数以千计倍于当今最强大机器的算力，也无法在一天内完成。


    换言之，已被证明首位玩家在选择正确走法时必然获胜（对手无法阻止），……但计算具体的走法是不可能的！


    ![image](img/inline5_2.jpg)


    ## FROM THEORY TO PRACTICE


    能够让计算机战胜世界最佳棋手的算法，其灵感来源于最小最大定理所定义的方法，自然被称为 *the minimax algorithm*。其思想相当简单：遍历所有可能的走法，再遍历对手的所有可能走法（针对每一种可能的走法），再遍历所有可能的回应，以此类推，直至有玩家获胜。


    这构建了一个从初始局面出发的可能局面 genealogical tree（谱系树），树根为游戏的初始状态（尚未有玩家落子），每一次落子对应一条通往落子后局面的分支，如下图所示。


    ![image](img/inline5_3.jpg)


    最小最大算法的核心是利用这棵谱系树来选择最佳走法。从树顶部的“最终”局面（即游戏的结局）开始，向下移动至根节点。


    首先，需要将所有情形转化为数值，因为计算机只能处理数字。然后，为每个最终局面赋予一个分数。例如，在 Mancala 中，分数可以是获得的种子数减去对手的种子数；在国际象棋中，分数可以是
    0（失败）、1（平局）和 2（胜利）。


    假设你处于游戏的最后一步。如果轮到对手落子，那么对手的合理选择是走致胜走法，换句话说，对手会选择让你处于最不利的最终局面（除非你面对的是完全愚蠢的对手）。因此，对手的目标是实现对你而言的
    *最小* 分数。相反，如果轮到你落子，你希望选择能让你获得 *最大* 分数的走法。因此，当只剩下一步时，该局面的分数等于最终局面的最小（或最大）分数。


    再看上一步的落子呢？情况相同，只是角色互换！你必须选择能让对手处于最小（若是对手回合）或让自己处于最大（若是自己回合）分数的走法。两步之内的局面分数，因此是最大的最小值（或最小的最大值，取决于轮到谁落子）。这使得每个局面的分数在倒推时交替出现最小与最大。


    因此，冯·诺伊曼的算法从游戏树顶部的最终局面开始，向下“移动”至根节点，在最小与最大之间交替进行。


    于是，计算机只需进行简单的最大值和最小值运算，就像在前一章中探索状态空间那样轻松。整个程序不到十行代码！


    在这一切过程中，并不一定涉及人工智能。原因很简单：最小最大算法在 20 世纪 80 年代末被发明时，机器的计算能力并不重要——那时计算机甚至还未存在！


    ## ANOTHER LIMIT TO COMPUTERS?


    要直接使用冯·诺伊曼方法，必须构建所有可能游戏的谱系树。这一任务的难度取决于所考虑的游戏。


    让我们先从 Tic‑Tac‑Toe（三子棋）说起。冯·诺伊曼的方法可以直接应用。若考虑对称性以及玩家在有人获胜后立即停止游戏的事实， Tic‑Tac‑Toe
    总共有 26,830 种可能局面。对于机器而言，检查这约 27,000 种局面并计算最大值和最小值是轻而易举的事！在每秒数十亿次运算的机器面前，你的大脑读取结果的时间会远长于机器计算最佳走法的时间！这里不存在复杂性问题，因此无需诉诸人工智能。冯·诺伊曼方法即可奏效。


    ## CHECKMATE, VON NEUMANN!

    '
