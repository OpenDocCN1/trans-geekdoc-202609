    Admit it, the idea of machine learning is kind of scary. Our natural tendency
    to personify machines has led us to imagine that they could be capable, like a
    small child, of learning from the world around them and acquiring true autonomy
    from their inventors, us, humans. Nothing of the sort. A machine always works
    within the bounds of the algorithm and the data we provide.


    ## [ASK THE PROGRAM!](#contents.xhtml#toc2_93)


    To understand the principle of machine learning, we have to come back to the notion
    of computer programming. Computers are machines capable of processing data an
    algorithm described in a computer program. For its part, this program itself is
    provided to the computer in the form of data. Here, we can make two observations:


    1.  A computer uses data to produce new data.


    2.  A program is data.


    Consequently, there is nothing to prevent the result of an algorithm – the data
    produced by the machine – from being a program capable of processing new data.


    ![image](images/inline10_1.jpg)


    Machine learning implements this principle. This works a little as if the computer
    scientist gives the computer a plan (the data) and some instructions to build
    a new machine following this plan. The computer follows the instructions on the
    plan. It obtains a new machine that is also capable of processing data.


    ## [FROM DATA TO PROGRAMS](#contents.xhtml#toc2_94)


    In computer science, it’s a little more subtle than this. We don’t exactly build
    new machines, but we do produce new data or new programs that allow us to process
    data in new ways.


