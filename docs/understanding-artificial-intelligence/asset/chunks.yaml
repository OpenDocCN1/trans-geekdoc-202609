  trans: '

    今天，聊天机器人已经得到极大的发展。`ALICE` 是由 `Richard Wallace` 在 1990 年代开发的程序，也是诺贝尔竞赛的多次获胜者，拥有超过
    50,000 条规则，能够回答你可能想问的任何问题。然而，至今还没有人能够骗过 Loebner 评审委员会并夺得奖项……而且没有任何人工智能程序能够通过图灵测试。定期有计算机工程团队宣布他们已经成功了，但他们从未完全遵循图灵的所有要求。


    ## IT’S CONTROVERSIAL TOO!


    实际上，图灵测试被批评为评估“人工智能”的方法。别忘了它是 1950 年提出的，当时计算机还无法处理图像以检测癌细胞，也无法在高速公路上驾驶汽车！那时的人工智能与今天大不相同。


    图灵测试的第一条严肃批评来自 `John Searle`，他是一位对人工智能作出重要贡献的哲学家。为了说明图灵测试的局限性，他提出了“中文房间”实验。想象一个人，他对中文一无所知，且与世隔绝。我们给他提供写有中文字符的橡皮印章（事实上有
    50,000 个字符）以及一本精确描述每种中文问题对应答案的手册（答案同样用中文）。这个人不需要理解中文。在手册中，他找到对应问题的符号序列，并用印章复制手册中给出的回答。他既不理解问题，也不清楚自己做出的回答，但房间外的母语中文使用者会毫不犹豫地断言，房间里的人“懂中文”。


    中文房间实验非常清楚地表明，智能绝不仅仅是操纵符号。然而，图灵测试测量的全部依赖于符号。这很正常，因为计算机是一种专门处理以符号（0 和 1）表示信息的机器。


    因此，图灵测试只能衡量机器处理符号的能力，而不能衡量机器的智能。


    ## MY COMPUTER AND I ARE NOT ALIKE!


    错误在于认为可以通过将机器的行为与人类的行为进行比较来判断机器的智能。`Turing` 只是想知道我们是否能够构建一台能够“思考”的机器。正因如此，他提出比较机器行为与人类行为。但今天我们知道这并非如此简单：并非所有智能行为都是人类的。请回想一下
    26,534 × 347 的乘法，你甚至没有尝试去算出答案！相反，人类可以完美地表现出错误的行为。例如，人类在回答时比计算机更频繁地出现错别字。这也是在图灵测试中辨别人类的方式！


    事实上，图灵测试在开发人工智能程序时并不实用。`Turing` 从未打算让他的测试用于衡量计算机的智能。请记住，一个程序仅仅是为特定目的而编写的一系列计算：下一步在国际象棋局中走哪一步、在下一个十字路口是否转左、是否在一张图片中识别出猫或大象，等等。我们通过评估其在所给任务（下棋、寻路、整理照片）中的表现来检验
    AI 程序的智能，而不是看它是否能就其解决问题的哲学观点进行讨论。程序虽然比人类更高效。


    这点至关重要。虽然创造人工人类是一个需要编写 AI 程序的有趣问题，但相反的情况并非如此。开发 AI 程序并不需要制造人工人类。你完全可以编写能够出色完成特定任务的
    AI，而不必像人类一样。


    为了说明这种差异，计算机科学家 `Stuart Russell` 和 `Peter Norvig`——这两位在全球大学中因著作《人工智能》而闻名——提供了一个有趣的类比：飞机。航空工程师依据流体力学设计飞机，他们并不试图制造能够像鸽子一样飞行的机器，以便
    fool（欺骗）其他鸽子。


    计算机的强项是能够极快地处理大量数据。而人类则依赖推理或经验。机器可以瞬间测试数十亿种解（从最荒谬到最相关），或在庞大的数据库中查找信息。


    当你解数独时，你绝不会尝试在每个格子里逐个尝试所有可能的数字。但这正是计算机的做法：如果我在这里放 1……不行，不行。好吧，试 2 吧。也许可以。好吧，再看看，如果把
    1 放在它旁边的格子里……也不行。好吧，还是 2 吧……以此类推。每个操作对计算机来说只需几纳秒，它每秒能完成数亿次！你做不到。


    ![image](img/inline2_4.jpg)


    人类智能与我们称之为人工智能的差异，由计算机科学家 `Edsger Dijkstra` 精辟地概括。他曾说：“机器能否思考的问题，与潜艇能否游泳的问题一样无关紧要。”我们构建的机器并不思考。在某种意义上，它们给人一种智能的错觉。它们并不真正智能。


    | Why Is It So Difficult?*Understanding There Are Limitations to What a Machine
    Can Calculate* || 3 |


    | --- | --- |


    我们必须接受一个令人悲哀的事实：机器并不智能。至少，并不是在我们说一个人“智能”时的同一意义上。某种程度上，这对我们的自尊是一种安慰：能够让机器完成困难任务的，是人类在其算法中所投入的智能。那么，AI
    算法到底长什么样呢？


    有人可能会认为，它们是具有特殊形式或结构的算法，与其他程序截然不同，从而产生机器似乎有智能的错觉。事实上，并非如此。像所有算法一样，它们看起来像烹饪食谱。像所有程序一样，它们由机器逐步执行，机器的基本工作方式就像阅读“选择你自己的冒险”书籍的读者。


    然而，开发每一种 AI 方法需要多年科研人员的研究，而这些科研人员本身也经历了多年的学习。为什么这么困难？请记住，没有一种通用的方法可以制造 AI，而是有许多不同的方法，因此有许多不同的算法。它们看起来各不相同，但往往有共同点：它们都是为了克服计算机的两大主要限制——记忆和处理能力。


    ## LIMITATIONS OF COMPUTERS


    计算机是具备强大记忆能力的机器，能够在说出一句话的时间里完成计算。但像所有机器一样，计算机也会达到极限。


    以复印机为例。复印机是一种能够极快地复制文档的机器，这正是它的设计目的。衡量其性能的方法可以是询问你的祖父母在使用碳粉纸时做了什么，或回想中世纪的修士抄写员。然而，每台复印机只能在每分钟产生有限数量的页面，这个数量由其物理约束决定。


