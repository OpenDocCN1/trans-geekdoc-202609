- raw: 'Computer scientists do not consider this to be a “difficult” problem. If the
    graph is very large, the exploration will take a certain amount of time, but we
    know how to write some algorithms that can do it quite well. For example, when
    departing from the starting point, you can choose a random neighbor on the graph,
    then a neighbor of a neighbor, and so on. Basically, you randomly walk around
    until you find Place des Vosges. This algorithm is nice if you like to stroll
    about, but you may end up visiting the whole neighborhood before you actually
    come to the Hugo Victor House.


    Another algorithm consists of looking at all of the starting point’s neighbors
    first, then all of the neighbors’ neighbors, and so on, until you come to the
    Victor Hugo House. You move in a spiral when you leave the subway. This algorithm
    is good if you don’t want to miss anything in the neighborhood …. On the other
    hand, you won’t exactly get to your goal right away.


    However, these two algorithms have a very good complexity from a computer science
    standpoint: it is equal to the problem’s theoretical complexity. This means that
    these two algorithms, while quite basic, are more or less what we can do best
    with a machine to find a path on a graph, even if we can see they pass through
    a ton of useless points.


    Let us not forget that machines work “blindly” like Theseus in the labyrinth!
    We are guaranteed to find a solution with these two algorithms because they systematically
    explore the state space.


    ## [IT’S A WIN-WIN](#contents.xhtml#toc2_35)


    If we look more closely, however, there is a big difference between these two
    algorithms. The second algorithm, moving in a spiral from the starting point,
    is going to study the points on the graph *in order based on their distance from
    the starting point*. That’s why, when it achieves the objective, it will be certain
    to have calculated the shortest path (even though, in doing so, it had to go around
    in circles). This is clearly what we’re looking for with a GPS. The first algorithm
    does not guarantee that the path it finds will be a “good” one. If it finds one,
    it may very well send you to Place de la Bastille, Place d’Italie, and Place de
    la République, with three changeovers in the subway, before you ever arrive at
    the Victor Hugo House.


    Thus, the problem with the GPS isn’t just exploring the state space, it’s finding
    the *best* path possible on this darned graph.


    ![image](images/inline4_4.jpg)


    ## [COMPUTER SCIENCE IN THREE QUESTIONS](#contents.xhtml#toc2_36)


    This example illustrates a fundamental problem in computer science. When we create
    an algorithm, we always have to ask three questions.


    First, does the algorithm address the problem in question? This is essential.
    Here, both algorithms find a solution, if there is one. No worries about that.


    Second, does the algorithm achieve the result in a reasonable amount of time?
    This is the complexity we already discussed. Our two algorithms are more or less
    the same in terms of complexity, and they’re actually very good because they reach
    the theoretical complexity limit.


    Third, is the solution provided by the algorithm of “good quality”? For our pathfinding,
    a “good” solution is one that doesn’t make us visit all of Paris. If we’re clearly
    looking for the shortest path here, we better not be strolling about.


    ## [A CLEVER ALGORITHM](#contents.xhtml#toc2_37)


    We owe the first effective algorithm for finding the shortest path on the graph
    to Edsger Dijkstra. This algorithm uses the spiral idea while considering the
    *distances* between the points on the graph (for example, the length of a section
    of street or of an alley).


    On the three computer science questions, Dijkstra’s algorithm scores 10 out of
    10. First, it finds a path if there is one: we can prove it mathematically. Second,
    it does it in a reasonable amount of time: the algorithm’s complexity is close
    to the problem’s complexity. Third, it is proven that the path obtained is always
    the shortest of all the possible paths. If there is another path, it is undoubtedly
    longer.


    Yet this algorithm is not an AI algorithm. First and foremost, it’s an effective
    algorithm for exploring any kind of state space.


    ## [AI IS HERE!](#contents.xhtml#toc2_38)


    To begin making AI, one must consider the data shown on the graph and the computing
    time.


    With a GPS, the data are the points on the graph – that is, the different places
    where you can go. To show the Paris neighborhood we used in our example, we need
    a graph containing about a hundred points, perhaps more. For a small city, you’ll
    quickly need about ten thousand points.


    Dijkstra’s algorithm, like most algorithms, requires more and more computation
    as the graph gets larger: its complexity depends on the size of the inputs, as
    we saw in the previous chapter.


    Specifically, the complexity of Dijkstra’s algorithm is the number of points on
    the graph squared. If a graph contains 10 points, we’ll need around 100 operations
    (10 × 10) to calculate the best path. For 100 points, we’ll need 10,000 operations
    (100 × 100), and so on. The greater the number of points, the greater the number
    of operations.


    At this rate, we quickly reach the limit a computer can compute in a reasonable
    amount of time. And that’s where artificial intelligence comes in. We need to
    find an “intelligent” state space exploration algorithm so we won’t have to wait
    an eternity for the GPS to tell us what route to take.


    ## [A HEAD IN THE STARS](#contents.xhtml#toc2_39)


    The artificial intelligence algorithm that can resolve this problem is called
    “A star” (or “A\*” for those in the know). It was invented by Peter Hart, Nils
    Nilsson, and Bertram Raphael in 1968.


    The idea behind this algorithm is simple: What takes time in Dijkstra’s algorithm
    is ensuring that, at all times, the path produced will be the shortest path possible.
    What we need is an algorithm that, without exactly wandering around randomly,
    doesn’t necessarily have to examine everything like Dijkstra’s algorithm does.


    This algorithm will not always give the best solutions. But we can hope that,
    if it doesn’t choose the points completely at random, it will provide a, “good”
    solution. Naturally, we will have taken a bit of a stroll, but it will be in the
    right direction.


    This is the principle of artificial intelligence.


    ## [THE BEST IS THE ENEMY OF THE GOOD](#contents.xhtml#toc2_40)


    The first thing to understand about AI algorithms is that they *do not aim to
    obtain an exact solution to the problem posed*.


    When a cooking recipe says “add 1.5 ounces of butter,” you don’t necessarily take
    out your scale and weigh your butter to the ounce. You take an eight-ounce stick
    of butter, cut off what looks like three-eighths, and that’s it. It’s a lot faster!
    By doing it this way, you are consciously forgoing an exact solution, but you
    know that your cake won’t necessarily be that bad. It just won’t be “perfect.”


    This is the idea behind artificial intelligence. When it is not possible to compute
    the best solution in a low enough number of operations, we must content ourselves
    with a faster, “approximate” solution. We have to give up on exactness to gain
    computing time for the machine.


    ## [ROUGHLY SPEAKING, IT’S THAT WAY!](#contents.xhtml#toc2_41)


    In artificial intelligence, we call this a *heuristic*. It’s a somewhat highbrow
    word for a method or algorithm that provides a solution that isn’t necessary the
    best. However, if we’re lucky, it isn’t too bad either, and we get it in a reasonable
    amount of time. It’s like cutting the butter without using the scale.'
