    variables we can work with, surpassing the limits of symbolic models.


    ## [RIDDLE ME THIS](#contents.xhtml#toc2_105)


    To understand how supervised machine learning algorithms work, let’s use another
    game as an example: “Akinator, the web genie,” a software developed by two French
    programmers in 2007. It’s a variation of the game “Guess Who,” in which the computer
    has to guess which character the user is thinking of.


    For this, the user answers questions about the character such as “Is your character
    a man?” The possible answers are “yes,” “no,” “mostly yes,” "mostly no," and “I
    don’t know.” Question by question, the system ultimately identifies the person
    you are thinking of.


    Try it out: the software is available online and on smartphones! It’s rather impressive.


    ## [TREES AGAIN](#contents.xhtml#toc2_106)


    To guess correctly, Akinator uses a *decision tree*, a mathematical tool that
    allows the choices to be programmed. The final decisions (here, the characters
    the player may be thinking of) are the leaves on the tree’s branches. To reach
    them, the program follows the branches starting from the root. Each branch point
    represents a decision based on the values of the variables. In Akinator, these
    variables correspond to the questions Akinator can ask: Is the character real?
    Is the character a man? Is the character still living? And so forth. These questions
    were chosen by the game’s inventors.


    A decision tree is kind of like a program: you provide a set of variables describing
    the problem (in our example, the values corresponding to a character), and the
    system proceeds from branch point to branch point to find the “right” decision
    (in this case, the character’s name).


    For this to work, first we need to build a decision tree. This is a tedious task,
    and it’s impossible to do it by hand.


    ## [A BIT OF PREDICTION](#contents.xhtml#toc2_107)


    In 1986, Ross Quinlan proposed an algorithm that would go down in history: ID3.
    This supervised learning algorithm allows us to automatically build decision trees
    using examples from a database.

    '
  trans: '

    为了获得这个结果，该算法按顺序处理示例。在每一步中，它都尝试基于前面的示例构建最广泛的规则。这要感谢米哈尔斯基所使用的描述逻辑。该语言不仅允许我们描述变量的值（例如三角形的耳朵）和决策公式（如果有三角形，则它是猫），还允许描述公式本身的推理规则。例如，当有多辆特征相似的汽车时，米哈尔斯基会让机器应用一条规则，将这些示例归类在一起。


    通过使用这些逻辑规则，算法逐步构建出一个能够正确处理所有提供给它的示例的决策规则。


    ## TELL ME WHAT YOU READ, AND I’LL TELL YOU WHO YOU ARE


    逻辑规则是米哈尔斯基算法的核心。它们使我们能够构建这些最终的决策规则，并且全部都是研究者“手动”定义的。正如人工智能通常的情况一样，机器会得到一定的“人类专业知识”。在这里，这种专业知识直接影响学习过程：如果你想学习这个例子，就需要对该示例进行相应的操作以构建你的决策公式。


    ![image](img/inline10_5.jpg)


    不过，事实仍然是，计算机会自动在计算机语言（这里是描述逻辑 VL[21]）中构建决策规则。正如我们在本章开头使用的“计划”示例一样，计算机构建了一个基于示例的程序。


    所有这些算法的力量都源于其结果是一组可理解的决策规则，只要你使用 VL[21] 语言。在构建方式如上时，系统（即学习得到的程序）可以解释它每一个决定的原因！


    这种方法在推荐系统中尤其有趣。让我们以购书为例。k‑means 算法可能会根据距离测量推荐一本与你已选书相似的书籍，但它无法解释为什么这本书是一个好的选择。相反，能够学习书籍的所有特征并将它们组织成结构良好的公式的系统，能够告诉你：“实际上，你喜欢
    1980 年代的科幻书籍。” 这不就是很酷吗？


    ## FROM SYMBOLIC TO NUMERIC


    然而，这种受监督的学习方式存在一定局限性。最大的局限在于，当你向系统提供输入时，你需要已经具备某种象征性表示的数据（例如“汽车很大”、“第二辆车有敞篷顶”等）。这有点像向盲人描述一个物体：你必须用大量文字细节来描述，让对方在没有看到的情况下推断出视觉属性。这件事很快变得繁琐，老实说，没有人会乐意用这种方式描述小猫的照片。


    第二个问题更为深刻。随着示例数量的增加，每一个新案例都会让机器在最终决策规则上变得稍微复杂一点。约翰·麦卡锡将这种困难称为 *qualification problem*（资格问题）。想象你已经知道“汽车是四轮并配有方向盘的车辆”。如果你遇到一辆只有三轮或使用控制杆代替方向盘的汽车，你就必须在决策规则中加入这些特殊情况。每一个特殊情况都使得规则集越来越复杂……也越来越难以理解！


    在 1990 年代，人工智能研究者因此转向了其他方法。机器不再直接操作决策规则，而是只操作变量来调整程序，类似于 k‑means 算法。这种学习方式被称为
    *machine learning*。


    | Learning to Count*Understanding What Statistical Learning Is* || 11 |


    | --- | --- |


    受监督学习的目标是构建逻辑系统（或其他模型）中的程序；而统计机器学习仅操作变量之间的关联，产生一组数值作为“程序”，以便做出决策，例如 k‑means 中的聚类中心点。


    与 k‑means 不同，受监督学习不要求机器对对象进行聚类。它为每个输入定义期望的结果。因此，系统并不计算所有类别（或要给出的答案）；这些类别在示例数据库中已经描述。


    为了教机器识别猫的照片，我们必须给它看几张照片，并告诉它每张照片是否包含猫。


    ## NEW AND OLD ALIKE?


    受监督机器学习的统计方法并非在 1990 年代才被发明：上世纪 50 年代末为棋类或三角形游戏开发的第一批受监督学习模型已经基于此原理运行，它们计算输入数值与期望结果之间的关联。


    象征性人工智能在 1980 年之前占据了人工智能研究的主导地位，原因有两点。


    第一，正如我们所见，象征性学习产生可解释的系统，因为它们使用逻辑语言进行描述。第二，象征性学习在数据量相对较少时表现良好，而 1970 年代并没有像今天那样庞大的数据库。因此，使用统计机器学习方法的难度并不值得。


    多年来计算机科学的进步产生了海量数值数据，并使我们能够处理更多变量，超越了象征模型的限制。


    ## RIDDLE ME THIS


    要理解受监督机器学习算法的工作原理，我们可以使用另一个游戏作为例子：“Akinator，网络妖精”，由两位法国程序员于 2007 年开发。它是“Guess
    Who”（猜谁）游戏的变体，计算机需要猜出用户在想哪个角色。


    为此，用户需要回答关于角色的问题，例如 “你的角色是男性吗？”可能的回答有 “yes”（是）， “no”（否）， “mostly yes”（大概是）， “mostly
    no”（大概不是），以及 “I don’t know”（不知道）。随着问题的逐一提出，系统最终会确定你所思考的那个人。


    试试看：该软件既可以在线使用，也有手机版！这真的很令人印象深刻。


    ## TREES AGAIN


    为了正确猜出，Akinator 使用 *decision tree*（决策树），这是一种数学工具，允许将选择编程进去。最终的决定（即玩家可能在想的角色）位于树枝的叶子节点。为了到达它们，程序从根节点开始沿着分支向下走。每个分支点代表基于变量值的决策。在
    Akinator 中，这些变量对应于它可以提出的问题：角色是真实的吗？角色是男性吗？角色是否仍在世？以此类推。这些问题由游戏的创作者选定。


    决策树有点像程序：你提供一组描述问题的变量（在我们的例子中，角色的属性值），系统从分支点到分支点地逐步寻找“正确”的决定（即角色的名称）。


    为了实现这一点，首先我们需要构建决策树。这项工作繁琐且无法人工完成。


    ## A BIT OF PREDICTION


    1986 年，Ross Quinlan 提出了历史性的算法：ID3。该受监督学习算法能够自动利用数据库中的示例构建决策树。


    '
