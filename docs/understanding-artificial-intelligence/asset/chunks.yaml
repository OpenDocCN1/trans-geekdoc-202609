    # Acknowledgments


    我首先在大学时发现了人工智能，并且从此再也没有回头。


    这本书不可能在没有我遇到的 extraordinary 人士的帮助下完成。我欠他们太多。Sylvie 是第一个向我介绍 AI 的人。Jean-Paul 在我初次涉足科研时指导了我。Fred、Seb、Sophie、Alex，以及我的同事和朋友，帮助我找到用来阐释困难
    AI 概念的恰当表达。过去 20 年里，我结识了许多热情的研究人员、迷人的同事和朋友，实在无法在此列举全部。你们知道自己是谁。请知道，这也是你们的书。


    我要特别感谢 Monique 和 Alain，他们带领数百名学生走上 AI 的道路，如果没有他们，我就不会认识我最喜欢的艺术家 Lizete。我感激有机会沿着他们的脚步走，指引年轻人走上
    AI 前景光明的道路。


    这本书得益于我的妻子和孩子们，他们耐心地审阅了每一章，并各自贡献了一粒沙。他们知道我比什么都爱他们。谢谢我的朋友 Céline 和 Paul，他们的支持和阅读非常重要。谢谢
    Lizete，你的耐心和始终如一的好心情！向公众写作并不容易，尤其是当你大部分时间都与专家交流时。如果没有你们的建议，这本书永远不会面世。


    我也想感谢 Emmanuel，他帮助我完成这本册子的艰巨出版过程，Kaska 在整个过程中支持我，以及我的出版商 Ms. Baud 和 Ms. Cohen，感谢他们对我们的信任。


    最后，感谢所有为 AI 史做出、并继续做出贡献的人。我尤其想到那些在幕后工作的研究人员，他们让这个小型 AI 社区保持运转。全球 AI 社会在过去 20 年里经历了风暴、逆势而行和舆论变化，以确保
    AI 的生存。他们很少能享受到劳动的成果，但如果没有他们，今天写这本关于 AI 的书是不可能的。


    N. Sabouret


    起初，只有三位计算机科学家在博客上发文，讨论宏大的话题。博客随后在 LIP6 的走廊和休息室中延续了 11 年，直到 Nicolas 再次联系我，谈起这次令人惊叹的合作。我衷心感谢我的前博客伙伴：Nicolas
    Stefanovitch，即 `Zak Galou`，以及 Thibault Opsomer，即 `Glou`。我也要承认我的艺术伙伴：CMIJ 的所有成员、AllfanartsV2
    论坛的成员以及 BD&Paillettes 的成员。感谢 François 协助物流（餐具、烹饪以及照看 Renzo），这让我每年十二月都能穿上艺术围裙。最后，感谢
    Nicolas，你的热情和随时准备为这项美好合作提供支持。我很高兴能够实现 lifelong 梦想，通过我的艺术帮助他人学习科学。


    L. De Assis


