  trans: '

    第二步是将这个和与一个值，称为 `bias` 进行比较。如果和大于该值，神经元的输出为 1。如果情况如此，我们说该神经元“激活”。否则，它的输出为 0。注意，然而并没有物体或光。这仅仅是一个产生特定结果的计算。


    `weight` 和 `bias` 是神经元的参数。它们使我们能够控制它的工作方式。


    例如，让我们看下面的“神经元”。我们标注了输入、`weight` 和 `bias`。


    ![image](img/inline12_1.jpg)


    在这个例子中，神经元计算出的和为：


    1`×`7 + 1`×`(-2) + 0`×`3 + 1`×`5 = 10


    结果（10）小于 `bias`（13）。因此，神经元的输出为 0（因此我们说它仍然“关闭”）。这是计算的结果。


    作为对比，下面是一张来自百科全书的人类神经元示意图。你必须承认，这完全不同！


    ![image](img/inline12_2.jpg)


    ## MORE TRIANGLES


    人工神经网络是一种算法，它在数据上执行这种“神经”计算。


    最早的网络是在 1950 年代中期编程的，目的是模拟人类神经元，正如 Hebb 的理论所示。正是通过这种方式，“神经”一词开始用来描述这种计算。然而，人工神经网络真正起步于
    1957 年由 Frank Rosenblatt 发明的 *perceptron* 算法。


    通过抓住人工神经元的思想，Rosenblatt 编写了一个能够学习识别黑白三角形图片的算法。使感知器独特的地方在于，计算被组织成连续的“神经元层”，如下面的图示：


    ![image](img/inline12_3.jpg)


    在图的最左侧，传感器将图片转换为数字：每个 `pixel`^(1) 要么为 0（关闭）要么为 1（开启），在我们的绘图中呈灰色。Rosenblatt 用于实验的机器分辨率为
    400 像素（20 × 20），相较于当今的照片显得可笑地小。感知器的输入因此是 400 个数字（0 或 1），对应于图片的像素。


    感知器的第一层由几百个神经元组成，每个神经元使用这些数字计算不同的结果。每个神经元都有自己的 `weight` 和 `bias`，使得结果各不相同。从第一层计算得到的几百个数字，要么是
    0 要么是 1。对 Rosenblatt 而言，这一操作是 *assimilation*，而这第一层计算则是“assimilation layer”。


    随后，这些结果被送入第二层输入层。再次，数百个不同的计算产生数百个结果，要么是 0 要么是 1。我们可以继续这样下去很长时间，但 Rosenblatt 在
    1958 年发表于 *Psychological Review* 的文章中提出，只需在两层“assimilation layer”之后即可停止。


    第三且最后一层仅包含一个神经元。它取前一层计算得到的数字，运行“神经”计算以得到 0 或 1。这个小游戏的目标是：当图片包含三角形时输出 1，否则输出 0。


    ## JUST A LITTLE FINE TUNING


    不幸的是，事情并非如此简单：真正的难点在于为每个参数和 `bias` 找到合适的值。这就像一台拥有数百万旋钮的巨型调音台，每个旋钮都需要调到恰当的位置。


    ![image](img/inline12_4.jpg)


    对于每个神经元，输入的数量决定了它拥有的旋钮数量。想象一下，我们的感知器的第一层包含 1,000 个神经元，这意味着仅第一层就有 400,000 个参数需要调节，每个参数都可以取任意值。我们不可能靠运气碰巧找到正确的配置。


    正是在此，有监督学习（supervised learning）登场。


    ## A LONG LEARNING PROCESS


    学习算法会自动计算出能够给出正确答案的参数值：当提供的图片是三角形时输出 1，否则输出 0。


    初始时，所有参数均设为 0。对于每个示例，网络会计算出输出：要么激活“三角形”神经元，要么不激活。


    如果答案正确（例如，当给出的图片确实是三角形时，三角形神经元会激活），则无需做任何修改。相反，如果计算错误，我们需要调整 `weight` 和 `bias`。为此，我们会对所有用于计算错误输出的参数加
    1 或减 1。


    具体来说，如果网络错误地回答“是”，即使我们向机器展示了一个圆形物体，我们仍会检查所有导致该输出的神经元。然后，我们将所有输入为 1 的 `weight`
    减少 1。对于输入为 0 的 `weight`，我们保持不变，因为它们未影响神经元的输出。


    让我们回到我们四值的例子：


    ![image](img/inline12_5.jpg)


    无论第三个 `weight` 的值如何，总和始终为 10。当输入为 0 时，第三个 `weight` 不参与计算。


    因此，我们会降低神经网络的 `weight`，同时对每个激活的神经元的 `bias` 加 1，使其在给定数值下更难激活。目的是让下一层的最终神经元在再次输入相同图片时不再激活。


    相反，如果网络在被输入三角形时回答“否”，我们需要提高那些非零输入的 `weight`，并降低未激活神经元的 `bias`，以减小它们对输出的过滤作用。


    现在，我们对数据库中的每个示例都进行相同的调整（向左或向右移动滑块 1 位），不必手动完成。`weight` 只是计算机中的数字，算法会自行在数千个已记忆的示例中逐一进行计算。经过足够多的示例，运气好的话，旋钮会处于能够识别三角形、猫或其他我们教它的事物的位置。


    ![image](img/inline12_6.jpg)


    ## WHERE DID MY BRAIN GO?


    Rosenblatt 的机器使用了不到一千个“神经元”，但即便如此，每个示例仍需进行数十万次计算。尽管如此，该算法足够通用，能够解决许多人工智能问题，且对三角形的识别效果非常有希望。Rosenblatt
    坚信感知器最终能够学习、做出决策，并翻译成外语。


    然而，这种兴奋并未持续。1969 年，两位著名的研究者出版了一本书，使这类研究戛然而止。他们正是 Marvin Minsky，人工智能之父，我们已经讨论过，以及
    Seymour Papert，计算机科学另一大人物，因贡献 Logo 语言而受到我们的感谢。


    在他们的书中，这两位权威人士描述了感知器的优势与局限。其中之一是他们证明，感知器无法解决简单的问题，即前一章提到的著名的“非线性问题”。换句话说，一个拥有两个输入的神经元无法被调节为仅在一个输入为
    1 而另一个输入为 0 时才激活——这正是所谓的“异或（XOR）问题”。


    事实确实如此：单一的“神经”计算本身无法计算非线性函数……但通过像 Rosenblatt 所提议的那样层叠神经元，即使只有一层“assimilation layer”，也可以克服这一限制，计算几乎任意函数。事实上，Rosenblatt
    的三角形识别问题是非线性的，正是通过这种神经模型得到解决。


    '
