    Evolutionary algorithms and multi-agent systems are two examples of artificial
    intelligence algorithms for which computer scientists drew inspiration from natural
    phenomena. There are others. Neural networks have been a big success since 2010,
    and they are also inspired by nature. However, before we learn how they work,
    we first need to get through another chapter.


    ## [FIND THE ODD ONE OUT!](#contents.xhtml#toc2_83)


    Among the skills that make use of human intelligence, there is one that machines
    and data processing cannot do without. It is the ability to classify objects –
    that is, to group or separate elements based on their features.


    Human beings do not have much difficulty distinguishing between birds and mammals.
    We learn early on how to group things that look alike: ducks, geese, and waterfowl
    all look like each other more than like a cat or a lion. This skill allows us
    to describe the personality of our friends (shy, exuberant, etc.) without needing
    to resort to complex reasoning.


    However, classification is not as easy as it might seem.


    Let’s consider the five animals below: A dog, a cat, a duck, a cow, and a lion.


    ![image](images/inline9_1.jpg)


    If you had to divide them into two clusters of similar animals, how would you
    group them? Naturally the cat and the lion… perhaps with the dog? And the cow
    and the duck together? Or would you leave the duck out, since it’s not a mammal?
    But you could also think of the lion as the odd one out: it’s the only wild animal.
    Or perhaps the cow: it’s the only animal humans get milk from.


    As you can see, grouping objects based on their similarities isn’t always easy.


    ## [FROM ANIMALS TO GENES](#contents.xhtml#toc2_84)


    Since the 1980s, computer scientists have taken an interest in algorithms capable
    of doing this same type of categorization. As an example of a concrete application
    of this research, biologists use computers to analyze DNA sequences and find genes
    shared by different species. This allows them to understand how several different
    DNA sequences contribute to the way a certain genetic character is expressed in
    a given species.


    Each DNA sequence contains billions of A, C, G, and T elements. It is impossible
    to analyze them by hand. To accomplish this work, researchers use machines capable
    of grouping similar genetic data. This problem isn’t that much different from
    the animals, except the amount of data is enormous.'
