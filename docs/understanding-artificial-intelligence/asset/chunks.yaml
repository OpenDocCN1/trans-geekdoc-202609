    # [Acknowledgments](#contents.xhtml#acknowledgments)


    I first discovered artificial intelligence at college. And I never looked back.


    This book would not have been possible without all the extraordinary people I’ve
    met. I owe them so much. Sylvie was the first person to introduce me to AI. Jean-Paul
    guided me during my first forays into research. Fred, Seb, Sophie, Alex, my colleagues,
    and friends, helped me find the right words to make difficult AI notions easier
    to understand. In the last 20 years, I’ve met so many passionate researchers,
    fascinating colleagues, and friends that it is impossible for me to name them
    all here. You know who you are. Know that this is also your book.


    I would like to give special thanks to Monique and Alain, who have led hundreds
    of students down the path of AI and without whom I would not have met my favorite
    artist, Lizete. I am grateful for the opportunity to follow in your steps and
    guide young people down a promising path in AI.


    This book owes much to my wife and children, who patiently reviewed each chapter
    and each contributed their grain of sand. They know I love them more than anything.
    Thank you to my friends, Céline and Paul, for their support and their readings.
    Thank you, Lizete, for your patience and unwaveringly good humor! Writing for
    the general public is not easy when you spend most of your days speaking with
    experts. Without all of your advice, this book would never have seen the light
    of day.


    I would also like to thank Emmanuel, who helped me with the arduous process of
    publishing this book, Kaska, who supported me in the whole process, as well as
    my publishers, Ms. Baud and Ms. Cohen, for putting their trust in us.


    Finally, thank you to everyone who has made, and continues to make, history in
    AI. I am especially thinking of the many researchers working behind the scenes
    who keep the small AI community ticking. The AI society worldwide have had to
    weather storms, buck trends, and withstand changing opinion for 20 years to ensure
    AI’s survival. Rarely do they reap the fruits of their labor, and yet without
    them it would not be possible to write this book about AI today.


    N. Sabouret


    In the beginning, it was just a trio of computer scientists who posted about big
    things on an internet blog. The blog continued on its merry way in the hallways
    and break rooms at the LIP6 for 11 more years until Nicolas got back in touch
    with me about this incredible collaboration. It is with deep emotion that I would
    like to thank my former blog sidekicks: Nicolas Stefanovitch, a.k.a `Zak Galou`,
    and Thibault Opsomer, a.k.a `Glou`. I would also like to acknowledge my art companions:
    all the members of the CMIJ, of the AllfanartsV2 forum, and of BD&Paillettes.
    Thanks to François for his help with logistics (dishes, cooking, and babysitting
    Renzo), which allowed me to put on my artist apron every night in December 2018.
    Finally, thank you, Nicolas, for your enthusiasm and availability for this beautiful
    collaboration. I am happy I was able to fulfill my lifelong dream of helping others
    learn about science through my artwork.


    L. De Assis


