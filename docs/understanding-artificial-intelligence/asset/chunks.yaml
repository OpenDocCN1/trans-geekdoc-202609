- raw: 'There is no guarantee this day will ever come, however. There is no guarantee
    we will get an amazing cluster either. But in practice, this works rather well.
    On most of the data sets, the algorithm stops after a while and produces a decent
    cluster. This is all we’re asking of our new artificial intelligence program.


    ## [THERE IS NO RIGHT SOLUTION](#contents.xhtml#toc2_88)


    There are naturally other clustering methods, such as *combinatorial optimization*,
    which guarantees a certain cluster quality. This isn’t the case with the *k*\-means
    algorithm. Like all other artificial intelligence algorithms, it’s about finding
    a solution in a reasonable amount of time, even if it’s imperfect.


    The main difficulty with unsupervised cluster analysis methods is that the computer
    scientist must be familiar with the algorithms and with the way they cluster the
    data. That’s because, objectively, there is no best algorithm: everything depends
    on what you want to do with the result. To place mailboxes in a city, for example,
    first you’ll want to make homogeneous clusters so that each mailbox covers more
    or less the same surface area or the same population. But if you try to draw cities
    on maps, you’ll use an algorithm capable of building heterogeneous clusters, because
    cities often have an irregular shape. Ultimately, if you are a biologist and are
    interested in animal species, you will most certainly use a hierarchical classification
    that allows you to build clusters and subclusters: cats and dogs are mammals,
    birds and mammals are vertebrates, and so on.


    ## [TO EACH ITS OWN METHOD](#contents.xhtml#toc2_89)


    Clustering algorithms used in artificial intelligence define heuristics to build
    a data partition that is as consistent as possible with the user’s objectives.
    Thus, each algorithm follows its own method: it applies its own heuristic.


    Moreover, clustering algorithms work on very large quantities of data. You might
    be disappointed by the following information, but we do not use algorithms to
    sort five animals. When we use an AI algorithm, it’s because the calculation is
    much too complicated to do it by hand, or it’s because there is too much data.
    The problem’s complexity simply makes it impossible to examine all the possible
    clusters: there are too many!


    Because of the amount of data to be processed and because we are using heuristics,
    it is very rare to obtain a perfect classification. There is no way you will obtain
    classes of the same size even if you would like to. There will be some objects
    halfway between two classes that you’ll have to put one place or another somewhat
    arbitrarily. Each time, the algorithms make choices that are not entirely satisfying.
    Of course, they really aren’t doing the choosing: they are applying rules that
    allow them to come as close as possible to achieving the objectives set by the
    programmer.


    ## [SO, WHERE’S THE LEARNING IN ALL THIS?](#contents.xhtml#toc2_90)


    Cluster analysismethods rely on the idea that the computer uses the data to build
    one exclusive decision rule. The result of this calculation is not limited to
    reorganizing a list of previously clustered objects: it subsequently allows you
    to assign a class to any object.


    For instance, let’s use the *k*\-means algorithm, which determines the points
    in the feature space. If you give your system a new object to classify, the computer
    will immediately be able to put it in a cluster by comparing the distance to the
    “mean points.” Thus, the algorithm hasn’t just built two classes, it has also
    created a calculation function for classifying any object of the same family.


    This gives the impression that, using the data provided, the computer has learned
    to classify the objects on its own. That’s why computer scientists often speak
    of *unsupervised learning*.


    Naturally, the computer hasn’t learned anything: it has simply applied a classification
    rule built using an algorithm. This classification rule even behaves like an algorithm:
    we can use it to classify new objects.


    ## [JOY AND GOOD HUMOR!](#contents.xhtml#toc2_91)


    It is possible to make a system “learn” plenty of things using unsupervised cluster
    analysis. For example, a system can learn to automatically recognize emotions
    on photos of faces. Indeed, by focusing on the emotional features of facial expressions,
    unsupervised cluster analysis algorithms are able to calculate imaginary points
    to represent joy or anger. As with the *k*\-means algorithm, the machine can then
    use these points to recognize an emotion on a face that it has never seen before!
    In some way, it has “learned” to recognize emotions on its own.


    However, it is important to remember that nothing happens by magic. A computer
    scientist has played a role at each stage of the process to define the features
    of the objects studied, to choose the right algorithm, and to ensure the result
    is used correctly. A human has told the machine which operations to run on the
    data provided.


    The machine is not capable of finding these operations on its own because it has
    no imagination: it makes the calculations we ask of it, period. The computer scientist
    has programmed a distance function for the objects to be clustered together. The
    scientist has also decided how the objects will be clustered together. After that,
    the computer does all the work. Our computer scientist would have had quite a
    hard time doing this classification without the computer!


    The computer surpasses humans in a good many activities, including classification.
    It is able to process an astronomical amount of data way faster than any human
    can. However, it can only do this by following the instructions provided in the
    algorithms.


    ![image](images/inline9_6.jpg)


