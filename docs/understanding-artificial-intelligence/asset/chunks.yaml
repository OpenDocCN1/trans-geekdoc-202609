    -   人工智能在决策支持系统中被越来越多地用于模拟人类行为：它帮助领导者、政治家和企业家分析和理解政治中的舆论动态、能源消耗以及城市空间占用等复杂现象。


    **JUDEA PEARL**


    Judea Pearl 是 `Bayesian networks` 的发明者。这是一种人工智能方法，将符号推理（Bayesian 网络中的对象可由人类解释）与统计学习（这些对象之间的概率可以从数据中学习）相结合。Bayesian
    networks 在众多应用中用于表示事实之间的关系，特别是在生物信息学、信息研究和决策支持系统中。


    **RICHARD RICHENS, JOHN SOWA, AND RONALD BRACHMAN**


    在符号人工智能领域，机器尝试推理数据中包含的知识，正如人类所做的那样。为此，`knowledge representation` 模型被开发出来，以便将计算机所需的知识编程进去。第一个通用的知识表示模型由
    Richard Richens 在 1956 年提出。他称该模型为 `semantic network`，并推动了人工智能的许多其他进展，如 John Sowa
    于 1976 年提出的概念图，以及 Ronald Brachman 于 1980 年代中期提出的 `description logics`。^(3)


    **DEBORAH MCGUINNESS**


    在 2000 年代初期，符号人工智能专家发明了 `semantic web`。它可以定义为专门为计算机编写的网页，使用结构化公式，使它们能够像人类一样阅读互联网内容。`semantic
    web` 采用基于描述逻辑和由 Deborah McGuinness 及其同事发明的 OWL 语言的计算机模型。


    如今，计算机在互联网上交换“语义”信息以响应我们的需求。例如，当你在搜索引擎中搜索名人时，会看到一个文本框显示该人的年龄、身高和一般信息。这些信息来源于 `semantic
    web` 中的数据。


