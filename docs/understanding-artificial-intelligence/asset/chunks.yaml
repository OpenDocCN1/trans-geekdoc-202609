  trans: '

    对于计算机来说也是一样的。它们运算非常快；这就是它们被发明的原因。为了让你有个概念，2010 年代研发的个人电脑每秒可以进行数十亿次加法运算。这个数字自 1950
    年代起就一直在不断上升！但有时这还不够。


    如果你需要进行需要 100 亿次运算的计算，你需要等待几秒钟才能得到结果。但如果你的程序需要 1 万亿次运算才能解决你给电脑的问题，你需要等待 15 分钟。如果需要
    100 万亿次运算，你需要等待整整一天！


    ## A REAL HEADACHE


    你会对我说：100 万亿次运算，这不可能，太多了！别被骗：当我们编写算法时，运算次数会非常快速地变得惊人。让我们用一个愚蠢的例子来说明：想象我们想要编写一个程序来为学校制定课表。这是一件让副校长每年夏天都要花一部分时间解决的问题。他们肯定会非常高兴如果一台机器能帮他们完成所有工作。首先，我们先写一个程序来计算学生所有可能的课表组合。接下来，我们将看到如何分配教师。


    好吧，我们直接承认，这行不通。但我们还是尝试一下。


    我们有一所有 10 个教室、15 个班级的学校（这是一所很小的学校，每个年级只有五个班级，让我们想象一下）。对于每个小时的课程，有大约 3000 种选择十个班级在该时间段上课的可能性。而对于每天上八节课的一天，这相当于
    6 后面跟 27 个 0 的数量（6×10²⁷）。天哪！如果我们必须逐个考虑它们，即使拥有每秒能做十亿次运算的电脑，也永远也不会结束。


    ![image](img/inline3_1.jpg)


    在计算机科学中，没过多久就遇到了这种计算能力限制的问题。实际上，这个问题正是计算机程序开发的核心。计算机科学家的难题并不只是找到一个自动化过程来解决给定的问题。这个过程还必须在合理的时间内产生结果。


    正如我们之前讨论过的，阿兰·图灵在二战期间试图破译德国密码时就遇到了这个难题。那时，已经可以构建一台机器，依次尝试德国人可能用恩尼格玛机加密信息的所有可能密码。一组组合后，机器会将编码后的词与信息中的词进行比较，直到找到正确的那个。理论上，这应该可行。但实际中，这些惊人的机器并不足够快以破译信息。它们能够完成需要成千上万的人才能完成的工作，但仍然不够。德国人只需每
    24 小时更改一次恩尼格玛机的组合，代码破译者就必须重新开始。为了“破解”恩尼格玛机的密码，阿兰·图灵的团队必须找到一种不需要如此多运算的不同方法。


    ## COUNTING OPERATIONS


    整个计算机科学研究领域都致力于这个计算限制问题。它被称为*复杂性*。复杂性概念对人工智能也非常重要。


    要真正理解这种难度，必须知道有两种复杂性：算法的复杂性和问题的复杂性。


    算法的复杂性仅仅是算法解决问题所需的运算次数。例如，考虑下面的“制作煎蛋”算法：


    ```

      For each guest:

              If the carton of eggs is empty:

                      Open a new carton of eggs.

              Take an egg.

              Break open the egg on the bowl.

              Scramble.

              Pour in the frying pan.

              Repeat 60 times:

                      Let cook five seconds.

                      Scramble.

    ```


    对于每位客人，这个算法执行两次操作（取一个鸡蛋并打开它）。此外，每六位客人需要额外执行一次操作（打开鸡蛋盒）。最后，鸡蛋需要搅拌、倒入平底锅并烹饪，这需要
    122 次操作。如果 N 是客人的数量，那么该算法总共执行 122 + (N / 6) + (2 × N)次操作。 Voilà，这就是它的复杂度。


    正如你所见，算法的复杂度不只是一个数字：它是一个依赖于问题数据的公式。在我们的例子中，复杂度取决于客人的数量：客人越多，所需的操作次数就越多。计算机也是一样。对于同一个算法，提供的数据越多，它需要执行的操作次数就越多。


    计算机科学家根据提供给算法的数据量来计算算法的复杂度。因此，算法的复杂度取决于“问题的大小” — 也就是说，需要在计算机内存中写出的 0 和 1 的数量，用来描述问题。


    ## THIS IS GETTING COMPLEX


    但这还不全部。计算机科学家还要面对另一种复杂性：问题的复杂性。


    这被定义为解决问题所需的最少运算次数，以电脑的方式完成。换句话说，这对应于能够解决该问题的最快算法的复杂度。


    算法未必是已知的：这是一种理论上的复杂度。 *如果* 我们知道如何编写一个超级算法，即所有可能算法中最佳的、能解决该问题的算法，那么它的复杂度就是如此。但这并不意味着我们知道如何编写这样的算法。事实上，计算机科学家们往往发现了其他算法，这些算法的复杂度更高，并且一直在努力寻找更好的算法。


    总之，当我们把问题交给一群计算机科学家时，他们首先会使用数学证明来确定使用电脑解决该问题所需的最少运算次数（即问题的理论复杂度）。随后，他们会开发算法，尝试在可能的情况下接近这个复杂度上限。


    ![image](img/inline3_2.jpg)


    但真正的乐趣在于当存在大量问题时，其理论复杂度已经远远超过我们希望通过有效算法解决的范围。换句话说，即使我们假设知道如何编写最佳算法，它也无法在合理的运算次数内解决该问题
    —  — 哪怕是未来将快 millions of times faster 的计算机也无法做到。


    ## SQUARING THE CIRCLE?


    有一整套问题，电脑永远也无法完美解决，无论计算能力如何提升。计算机科学家早已知道这一点。然而，几乎所有人工智能尝试解决的问题都属于这一类：下棋、识别面部、制定课表、翻译语句、驾驶汽车等。找到问题的*精确*解决方案所需的运算次数如此之大，已超出我们对计算能力的想象范围。


