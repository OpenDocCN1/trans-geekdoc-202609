- raw: 'To obtain this result, the algorithm takes the examples one after the other.
    At each step, it tries to build the broadest rule possible based on the preceding
    examples. This is possible thanks to the description logic used by Michalski.
    This language not only allows us to describe the variables’ values (there are
    triangle-shaped ears) and the decision formulas (if there are triangles, then
    it is a cat), but also the reasoning rules for the formulas themselves. For example,
    when several cars have similar features, Michalski asks the machine to apply a
    rule that groups the examples together.


    By using these logic rules, the algorithm gradually builds a decision rule that
    gives a correct answer for all the examples supplied to it.


    ## [TELL ME WHAT YOU READ, AND I’LL TELL YOU WHO YOU ARE](#contents.xhtml#toc2_101)


    The logic rules are the essence of Michalski’s algorithm. They allow us to build
    these final decision rules, and they have all been defined by the researcher “by
    hand.” As always with AI, there is a certain amount of human expertise supplied
    to the machine. Here, the expertise has a direct impact on the learning process:
    if you want to learn this example, then do this or that to build your decision
    formula.


    ![image](images/inline10_5.jpg)


    Still, the fact remains that the computer automatically builds decision rules
    in a computer language (here, the description logic VL[21]). As with the “plan”
    example we used at the beginning of the chapter, the computer has built a program
    using examples.


    All of this algorithm’s power stems from the fact that the result is a set of
    intelligible decision rules, as long as you’re speaking VL[21]. When built in
    this way, the system (the program resulting from the learning) can then explain
    each of its decisions!


    This type of approach can be particularly interesting in a recommendation system.
    Let’s use book shopping as an example. The *k*\-means algorithm might recommend
    for you a book that is “close” to other books you have chosen, thanks to a distance
    measurement. However, it won’t be able to explain why this book is a good choice.
    On the other hand, a system capable of learning all the features of the books
    you read and grouping them together in well-formed formulas will be able to tell
    you: “Actually, you like 1980s science fiction books.” Impressive, isn’t it?


    ## [FROM SYMBOLIC TO NUMERIC](#contents.xhtml#toc2_102)


    However, this supervised learning approach presents certain limitations. The biggest
    limitation is that, when you give the system its inputs, you need data that already
    have some form of symbolic representation (the car is big, the second car has
    an open roof, etc.) It’s a little bit like when you describe an object to a blind
    person. You need to describe it with many details, using only words, so that the
    person can infer visual properties about this object without ever see them. This
    task gets tedious very fast, and, let’s be honest, no one has fun describing kitten
    pictures this way.


    The second problem is much deeper. As the number of examples increases, each new
    case leads the machine to make the final decision rule a little more complex.
    John McCarthy named this difficulty the *qualification problem*. Imagine you have
    learned that a car is a vehicle with four wheels and a steering wheel. If you
    encounter an example of a car with only three wheels or with a control stick instead
    of a steering wheel, you’ll have to add these particular cases in the decision
    rules. For each particular case, the set of rules becomes more and more complex
    … and less and less intelligible!


    In the 1990s, artificial intelligence researchers therefore turned to other approaches.
    The machine no longer manipulates the decision rules directly. Instead, it only
    manipulates the variables to calibrate a program, like with the *k*\-means algorithm.
    This type of learning has been dubbed *machine* learning.


    | [Learning to Count](#contents.xhtml#toc1_103)[*Understanding What Statistical
    Learning Is*](#contents.xhtml#toc1_103) || [11](#contents.xhtml#toc1_103) |


    | --- | --- |


    Whereas the objective of symbolic learning is to build a program in a logic system
    (or another model), statistical machine learning only manipulates the associations
    between the values of variables and a result. The resulting “program” is, therefore,
    a set of numeric values that permits a decision to be made, like the *k* mean
    points in unsupervised classification.


    But unlike the *k*\-means, supervised learning does not give the machine the task
    of clustering the objects together. It defines the expected result for each input.
    Thus, the system does not calculate all the classes (or the answer to be given):
    these are described in the example databases.


    In order to teach the machine to recognize cat pictures, we have to give it several
    pictures and tell it whether each one contains a cat or not.


    ## [NEW AND OLD ALIKE?](#contents.xhtml#toc2_104)


    Statistical approaches for supervised machine learning were not invented in the
    1990s: the first supervised learning models developed in the late 1950s for checkers
    or triangles already operated on this principle. These algorithms calculate an
    association between the numeric values of the inputs and the expected result.


    Defenders of symbolic AI largely dominated AI research up until the 1980s. There
    are two reasons for this.


    First, as we have seen, symbolic learning produces explainable systems because
    they are described in a logical language. Second, symbolic learning works well
    with relatively low amounts of data, and in the 1970s, we didn’t have the gigantic
    databases that are in use today. The greater difficulty of using statistical machine
    learning methods was, thus, not worth it. Over the decades, advancements in computer
    science have helped produce much more numeric data and increased the number of
    variables we can work with, surpassing the limits of symbolic models.


    ## [RIDDLE ME THIS](#contents.xhtml#toc2_105)


    To understand how supervised machine learning algorithms work, let’s use another
    game as an example: “Akinator, the web genie,” a software developed by two French
    programmers in 2007. It’s a variation of the game “Guess Who,” in which the computer
    has to guess which character the user is thinking of.


    For this, the user answers questions about the character such as “Is your character
    a man?” The possible answers are “yes,” “no,” “mostly yes,” "mostly no,” and “I
    don’t know.” Question by question, the system ultimately identifies the person
    you are thinking of.


    Try it out: the software is available online and on smartphones! It’s rather impressive.


    ## [TREES AGAIN](#contents.xhtml#toc2_106)


    To guess correctly, Akinator uses a *decision tree*, a mathematical tool that
    allows the choices to be programmed. The final decisions (here, the characters
    the player may be thinking of) are the leaves on the tree’s branches. To reach
    them, the program follows the branches starting from the root. Each branch point
    represents a decision based on the values of the variables. In Akinator, these
    variables correspond to the questions Akinator can ask: Is the character real?
    Is the character a man? Is the character still living? And so forth. These questions
    were chosen by the game’s inventors.


    A decision tree is kind of like a program: you provide a set of variables describing
    the problem (in our example, the values corresponding to a character), and the
    system proceeds from branch point to branch point to find the “right” decision
    (in this case, the character’s name).


    For this to work, first we need to build a decision tree. This is a tedious task,
    and it’s impossible to do it by hand.


    ## [A BIT OF PREDICTION](#contents.xhtml#toc2_107)


    In 1986, Ross Quinlan proposed an algorithm that would go down in history: ID3.
    This supervised learning algorithm allows us to automatically build decision trees
    using examples from a database.'
