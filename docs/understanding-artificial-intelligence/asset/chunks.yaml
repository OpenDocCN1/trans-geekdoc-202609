- raw: 'When you work with only one processor, you cannot build a neural network with
    more than one layer of a thousand neurons. However, thanks to the little GPUs
    working in parallel, it is possible to design networks with several layers … and
    practically as many neurons as you want on each layer!


    *Deep learning* is the name researchers have given to these neural network algorithms
    with multiple assimilation layers, as opposed to the perceptron, which is limited
    to only one assimilation layer.


    ## [WHY ADD MORE?](#contents.xhtml#toc2_130)


    It isn’t necessary to descend into the depths of the abyss to resolve AI problems
    using neural networks. With just two assimilation layers, you already have a deep
    network.


    In theory, adding additional layers does not allow you to calculate new things.
    Mathematicians have shown that a network with only one assimilation layer could
    learn the same thing as a deep network … provided it has enough neurons. However,
    in practice it’s not that simple.


    Building a “deep neural network” algorithm accelerates convergence in the learning
    process; in other words, it boosts the speed with which you obtain good positions
    for the network’s adjustable knobs. Recall that our goal is to adjust thousands
    of parameters in order to correctly respond to an input. This is done by progressively
    adjusting the parameters” values based on the examples in the learning phase.


    In a deep network, the “right” values for each layer’s parameters depend on the
    preceding layer’s work. Everything happens as if you have broken down your big
    problem into a series of calculations that depend on each other but are simpler
    to adjust. By breaking the problem down, and combining it with a good back-propagation
    algorithm, it takes much less time to determine weight values that will produce
    good results.


    ![image](images/inline13_2.jpg)


    ## [THE CRUX OF THE PROBLEM](#contents.xhtml#toc2_131)


    Deep neural networks are a win-win. Not only are they no longer limited by the
    computer’s processing capacity (thanks to the GPUs, which allow it to run operations
    in parallel), but their layered arrangement allows us to obtain better learning
    results. What happiness!


    Of course, we have to determine how to configure the network – in other words,
    the way in which the calculations are performed. For this, researchers build several
    configurations with two, three, four, ten, or sixteen different-sized layers.
    Then they compare the performance of these different networks on the learning
    database so they can choose a configuration that produces the best results. This
    very empirical step is done automatically. The computer compares the outputs of
    the different configurations, based on the data provided by the human, by using
    the exploration algorithms written by the human.


    So, what’s the problem? Why isn’t everything resolved by these machine-built neurons?


    The machine learning system’s performance isn’t so much a result of the chosen
    configuration as it is a result of the way the data are built and analyzed by
    your algorithm. Let’s look at an example.


    To allow a machine to “read” a word written by hand, you can use a neural network
    to decode each character one by one. However, your system will certainly be more
    efficient if it can also consider neighboring characters, since the symbols aren’t
    completely independent. Thus, you want to build a neural network whose inputs
    are a combination of letters, as opposed to a single letter.


    This combination is done using mathematical calculations that also use parameters.
    Modern algorithms use machine learning to adjust these parameters. In this way,
    you have neurons that not only learn the parameters to answer the question correctly
    but also learn the *hyperparameters* to combine data or to determine the network’s
    configuration.


    ![image](images/inline13_3.jpg)


    All this work performed by the machine must first be thought out by the computer
    scientists: the humans determine how to combine the data to obtain better results
    based on whether the task to be resolved needs to understand words, recognize
    a picture, avoid an obstacle, and so on. Each problem requires us to build the
    right solution, and good results are hard to reproduce on another problem, even
    if it is similar.


    ## [THE ACHIEVEMENTS OF DEEP LEARNING](#contents.xhtml#toc2_132)


    Thanks to deep learning, artificial intelligence has made mind-boggling progress
    in very difficult areas such as image analysis and natural language processing.
    It is also used in AlphaGo, the Go program written by Google capable of beating
    any human player. Most surprising of all is the speed with which big-name companies
    like Google, Facebook, and Apple, just to name a few, have taken to the subject.


    When a new algorithm is invented by researchers, it often takes decades before
    businesses can use it in their systems. For deep neural networks, each new invention
    leads to another new invention in less than a year! This allows machine learning
    to grow at lightning speed. And obtain impressive results!&#160;… and hit limitations!


    The primary limitation of neural networks is their inability to explain the decision
    they’ve made. This problem was raised at the start of machine learning by artificial
    intelligence researchers. It is still true.


    The machine makes calculations on the input to produce a correct output in 99%
    of cases. However, it cannot explain why it has produced a correct answer, or
    even how. No one is able to explain what its decision is based on, which is bothersome
    if we want to understand and control what happens in the machine.


    ![image](images/inline13_4.jpg)


    “Symbolic” algorithms like Michalski’s, which we saw in [chapter 10](#ch10.xhtml#chapter10),
    seek to provide a “logical” explanation for each decision the system makes. By
    contrast, a perceptron is unable to affirm that a triangle is a three-sided shape!
    It recognizes the triangles, that’s all. Similarly, a self-driving car brakes
    to make a turn but it cannot explain “why.”


    ## [WATCH OUT FOR TRICKS!](#contents.xhtml#toc2_133)


    Another difficulty with neural networks is that it is hard to solve problems if
    there are no learning examples. Researchers hypothesize that a well-trained network
    works more or less “continuously”: an input similar to a correctly processed example
    will also be processed correctly by the network. Unfortunately, that isn’t the
    case.


    Many research teams have had a fun time inventing algorithms capable of building
    examples that cause neural networks to fail by making very small changes to the
    initial inputs. They call these “adversarial patches.” These patches can be inserted
    in an image to make any neural network algorithm fail. At the top of the next
    page is an example from an article written by Google researchers in 2018. The
    system recognizes a toaster instead of a banana when the adversarial patch (the
    little round picture) is added.


    ## [TO EACH HIS OWN METHOD](#contents.xhtml#toc2_134)


    The support vector machines and decision trees we saw in the preceding chapters
    are not susceptible to these kinds of tricks. On the other hand, they require
    sophisticated input transformation algorithms to process the inputs’ features.
    This work is difficult and can only be done by a human who has spent years studying
    AI.


    ![image](images/inline13_5.jpg)


    In neural networks, feature processing is incorporated into the learning process,
    which makes the network easier to use … but also susceptible to error.


    No AI algorithm is perfect. Each AI method has its advantages and disadvantages.
    The secret is knowing how to use them right.


    | [Winning at Go](#contents.xhtml#toc1_135)[*Understanding What Reinforcement
    Learning Is*](#contents.xhtml#toc1_135) || [14](#contents.xhtml#toc1_135) |


