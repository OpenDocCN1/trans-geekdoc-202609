    Before we develop any kind of artificial intelligence, it would be good if we
    define what intelligence is… and that’s where things get complicated! While we
    know quite well how to recognize stupidity (all you have to do is look around
    you and see what people do wrong), it’s harder to explain exactly what human intelligence
    is.


    ## [WHAT IS INTELLIGENCE?](#contents.xhtml#toc2_15)


    The first idea that comes to mind is to define intelligence as the opposite of
    ignorance. Unfortunately, it’s not that simple. If I ask you what year the city
    of Moscow was founded, you most likely won’t know the answer. Yet no one could
    accuse you of not being intelligent just for that, even though the answer can
    be found in any encyclopedia. And you wouldn’t say the encyclopedia is intelligent
    simply because it can tell you the date Moscow was founded. Intelligence doesn’t
    consist of knowledge alone. You must also be able to use what you know.


    A second idea would be to associate intelligence with the ability to answer difficult
    questions. For example, let’s consider Georg Cantor, the mathematician who founded
    set theory in the 19th century. To deal with such in-depth mathematical problems,
    he was clearly very intelligent. However, one’s ability in math is not enough
    to characterize intelligence. If I ask you what 26,534 × 347 is, it might take
    you some time to get the answer. However, a calculator will give you the result
    in an instant. You wouldn’t say that the calculator is intelligent, not any more
    intelligent than the encyclopedia.


    ![image](images/inline2_1.jpg)

