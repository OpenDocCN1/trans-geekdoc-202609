- raw: 'Everything happens as if the algorithm has “built” a data-based classification
    program. This new program is capable of processing any new data of the same kind.


    However, the machine does not learn on its own. For this to work, a computer scientist
    must first write the learning program – in other words, all of the instructions
    that will allow the computer to use the data to produce a new AI system. The computer
    cannot invent a new artificial intelligence program on its own: it just follows
    the procedure it receives from a human.


    ## [AN EXAMPLE IS BETTER THAN A LONG EXPLANATION](#contents.xhtml#toc2_95)


    This programming technique is widely used in artificial intelligence when the
    problem in question is too difficult to be resolved using a heuristic written
    by hand. Let’s take voice command systems like Apple’s Siri, Google Home, or Amazon’s
    Alexa as an example. They are able to associate phrases (“Turn the light on,”
    “What time is it?”) with specific operations: search for a definition on the internet,
    look up the time, turn on a light, and so on.


    As we saw in [chapter 2](#ch02.xhtml#chapter2), this doesn’t necessarily have
    anything to do with understanding what the phrase says. It’s simply a matter of
    associating the words with the commands. One of the first systems of this type
    was programmed entirely “by hand” by Terry Winograd in the late 1960s. The idea
    was to give commands to a machine to move different-shaped objects.


    This hard-to-pronounce program is called Shrdlu. To make it work, Winograd had
    to predict the words that would be used, the different ways of giving orders to
    the machine, and so on. It’s long, tedious work.


    The idea of machine learning is to write a program that will automatically build
    associations between the commands and the operation to be carried out. To achieve
    this operation, researchers amass giant databases, often containing hundreds of
    thousands of command examples. For each sentence in the database, you have to
    tell the machine what specific result you expect to obtain. For example:


    ```

      what time is it ‚→‚ tell the time

    ```


    The learning algorithm must build a system capable of associating the right answer
    with each possible value provided as input. In other words, we want it to “learn”
    to reproduce the results provided in the examples.


    This technique is referred to as *supervised* learning.


    ## [THE ADVENTURE BEGINS](#contents.xhtml#toc2_96)


    The first supervised learning algorithms date back to the 1950s.


    At that time, Arthur Samuel was working on an artificial intelligence program
    using the minimax algorithm on checkers. His heuristic was based on counting the
    number of pieces and kings, and on the pieces’ movements on the board. It occurred
    to him, however, that the machine could memorize the moves made and associate
    them with the final result (win or loss). He then wrote a new heuristic capable
    of considering the “experience” of previous games or previously recorded professional
    games when evaluating how to score each move. In this way, he used data to train
    his system to improve his heuristic.


    Around the same time, albeit with a completely different method and objectives,
    Frank Rosenblatt proposed a learning algorithm capable of recognizing triangles
    in a picture. He gave the machine hundreds of triangle examples to calibrate a
    calculation function that could then determine whether a shape was a triangle
    or not.


    These two AI programs were likely the first ones to use supervised learning algorithms.


    ## [MUCH ADO ABOUT NOTHING?](#contents.xhtml#toc2_97)


    The idea of training a machine to perform a task, rather than writing how to perform
    the task, is not new. At first, however, it was limited to only a few applications.
    The machines at the time did not have enough data to use supervised learning algorithms
    on anything and everything.


    Today, computers are capable of reacting to commands in natural language, transcribing
    handwriting, detecting errors in physical systems, recommending a book for you
    to read, and distinguishing between a face and a cat in a picture. All of this
    is possible thanks to the incredible amounts of labeled data that have been gathered
    in databases to tell the machine: “You see, in this picture, there is a cat!”


    ![image](images/inline10_3.jpg)


    You’re going to say to me: an algorithm that recognizes cats, that isn’t very
    useful. You might be surprised to learn that kittens fooling around or looking
    cute for the camera are among some of the most watched videos on the internet.
    So, you never know how useful a computer program might be!


    ## [FROM IMAGE TO DATA](#contents.xhtml#toc2_98)


    It is important to understand that the computer doesn’t interpret the data. As
    with the Turing test, it only sees symbols, specifically, binary numbers recorded
    in its memory cells. As far as it can tell, these numbers could describe a picture
    of a cute kitten just as well as a list of telephone numbers. If you give the
    machine a map of Paris and you apply an animal recognition algorithm, it will
    recognize a cat or frog really easily!


    Thus, we need to tell the learning program what the features of the data are,
    as we did with the unsupervised classification algorithm. This way, it’s simply
    a matter of transforming the initial data (kitten pictures, telephone numbers,
    or a map of Paris) into *variables* the program can learn the rules of.


    ## [HOW ABOUT WE TAKE THE TRAIN?](#contents.xhtml#toc2_99)


    The type of variables the learning algorithm must rely on is sometimes subject
    to intense debate. As the 1970s came to a close, the Polish researcher Ryszard
    Michalski wrote a learning algorithm that worked with so-called *symbolic* variables
    – in other words, well-formed logical formulas. The data model he used, named
    VL[21], is a *description logic*. These computer languages were very popular in
    the 1980s and 1990s. They let us describe variables or decision rules such as
    the following:


    ```

      The animals with triangle-shaped ears are cats

    ```


    This could be written in VL[21] using the following formula:


    ```

      ∃ ear[shape(ear)= triangle] → cat

    ```


    Michalski used this language to write an artificial intelligence program capable
    of building logic rules. This is revolutionary! The system no longer positions
    points in a vector space, as did *k*\-means. Instead, it writes well-formed formulas
    that represent reasoning similar to a human’s.


    To illustrate this result, Michalski programmed a system capable of recognizing
    a series of trains. It’s less amusing than kittens, but it also proves that researchers
    didn’t lack imagination before the advent of the internet!


    ![image](images/inline10_4.jpg)


    ## [IT’S LOGIC!](#contents.xhtml#toc2_100)


    Michalski’s trains are defined by their features: number of cars, car size, whether
    it is open (no roof) or closed, and so on. The researcher gives his program examples
    of trains traveling east or west and describes their features. For example:


    *There is an eastbound train with three cars. The first car is small and has an
    open roof. The second car is a locomotive. The third car is small and has a closed
    roof*.


    Obviously, all this is written in the logic language VL[21] with ∃, \[\], and
    other abstruse symbols.


    Michalski’s program automatically learns, from examples, rules of the form “If
    there are such and such features, then the train is traveling east” (or west).
    In other words, if we apply the algorithm to a slightly different domain, it automatically
    learns, from examples, the decision-making rules that allow it to recognize objects,
    just like with the cat ears:


    ```

      ∃ ear[shape(ear) = triangle] → cat

    ```'
