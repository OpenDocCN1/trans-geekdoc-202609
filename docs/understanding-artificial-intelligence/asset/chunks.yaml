- raw: 'For computers, it’s the same. They compute very quickly; that’s why they were
    invented. To give you an idea, a personal computer developed in the 2010s can
    do billions of additions per second. That’s a lot (by contrast, I still recall
    you never finished the multiplication problem in [chapter 2](#ch02.xhtml#chapter2)).
    And this number hasn’t stopped increasing since the 1950s! But there comes a time
    when it isn’t enough.


    If you need to make a calculation that requires 10 billion operations, you’ll
    have to wait a few seconds for the result. But if your program needs a trillion
    operations to solve the problem you’ve given to your computer, you’ll have to
    wait 15 minutes. And if it needs 100 trillion operations, you’ll have to wait
    an entire day!


    ## [A REAL HEADACHE](#contents.xhtml#toc2_24)


    You’re going to say to me: 100 trillion operations, that’s impossible, it’s too
    much! Don’t be fooled: when we write algorithms, the number of operations becomes
    impressive really fast. Let’s use a silly example: imagine we wanted to write
    a program that makes schedules for a school. It’s a problem vice-principals spend
    a portion of their summer on every year. They would surely be very happy if a
    machine did it all for them. First, we’ll start with a program that calculates
    all the possible schedule combinations for the students. Next, we’ll see how to
    assign the teachers.


    OK, we might as well admit it right off the bat, this isn’t going to work. But
    we’ll try anyway.


    We have a school with 10 rooms for 15 classes (it’s a small school with only five
    classes per grade, let’s imagine). For each hour of class, there are around 3,000
    possibilities for choosing the ten classes that can meet then. And for each eight-hour
    day of classes, that makes 6 billion billion billion possibilities (a 6 with 27
    zeros). Yikes! If we have to consider them one by one, we’ll never finish, even
    with a computer that can do a billion operations per second.


    ![image](images/inline3_1.jpg)


    In computer science, it didn’t take long to come up against this limitation on
    computing power. Actually, this question is at the core of computer program development.
    The difficulty for a computer scientist isn’t just about finding an automated
    process to resolve a given problem. The process must also produce a result in
    a reasonable amount of time.


    Alan Turing, whom we have already spoken of, was faced with this difficulty when
    he worked on deciphering German secret codes during World War II. At the time,
    it was already possible to build a machine that could try, one after another,
    all the possible codes the Germans might use to encrypt their messages using the
    Enigma machine. Combination after combination, the machine would compare the encoded
    word with a word from the message until it found the right one. In theory, this
    should work. But in practice, these incredible machines weren’t fast enough to
    decipher the messages. They were capable of doing a job that required thousands
    and thousands of men, but it wasn’t enough. All the Germans had to do was change
    the Enigma combination every 24 hours, and the code breakers had to start all
    over again. To “crack” the Enigma machine’s codes, Alan Turing’s team had to find
    a different way that didn’t require so many operations.


    ## [COUNTING OPERATIONS](#contents.xhtml#toc2_25)


    An entire branch of computer science research is dedicated to this computational
    limit. It is known as *complexity*. The notion of complexity is also very important
    in artificial intelligence.


    To really understand this difficulty, it is important to know there are two types
    of complexities: the complexity of algorithms and the complexity of problems.


    The complexity of an algorithm is simply the number of operations necessary for
    the algorithm to resolve the problem in question. For example, consider the “preparing
    an omelet” algorithm below:


    ```

      For each guest:

              If the carton of eggs is empty:

                      Open a new carton of eggs.

              Take an egg.

              Break open the egg on the bowl.

              Scramble.

              Pour in the frying pan.

              Repeat 60 times:

                      Let cook five seconds.

                      Scramble.

    ```


    For each guest, this algorithm performs two operations (take an egg and break
    it open). Additionally, for every six guests, it performs an additional operation
    (open a carton). Finally, the eggs have to be scrambled, poured into the frying
    pan, and cooked, which takes 122 operations. If *N* is the number of guests, then
    the algorithm performs a total of 122 + (N / 6) + (2 × N) operations. Voilà, this
    is its complexity.


    As you can see, the complexity of an algorithm isn’t just a number: it’s a formula
    that depends on the data of the problem in question. In our example, the complexity
    depends on the number of guests: the more guests we have, the more operations
    we need. It’s the same for a computer. For a given algorithm, the more data we
    give it, the more operations it will have to perform to resolve the problem.


    Computer scientists calculate an algorithm’s complexity based on the amount of
    data provided to the algorithm. Thus, the algorithm’s complexity depends on the
    “size” of the problem – in other words, the number of zeros and ones we have to
    write in the computer’s memory to describe the problem in question.


    ## [THIS IS GETTING COMPLEX](#contents.xhtml#toc2_26)


    But that isn’t all. Computer scientists deal with another complexity: the complexity
    of the *problem*.


    This is defined as the minimum number of operations needed to resolve the problem
    with a computer. In other words, this corresponds to the complexity of the fastest
    algorithm capable of resolving the problem.


    The algorithm isn’t necessarily known: this is a theoretical complexity. *If*
    we knew how to write a super algorithm, the best of all possible algorithms to
    resolve this problem, this is what its complexity would be like. This doesn’t
    mean, however, that we know how to write such an algorithm. Quite often, computer
    scientists have found other algorithms, with even higher complexities, and they
    rack their brains trying to find better ones.


    In summary, when we give a problem to a group of computer scientists, they will
    first use mathematical proofs to determine the minimum number of operations needed
    to resolve the problem using a computer (the problem’s theoretical complexity).
    Next, they’re going to develop algorithms that will attempt to come near this
    complexity limit, if possible.


    ![image](images/inline3_2.jpg)


    But where this gets really fun is when there are a whole bunch of problems for
    which the theoretical complexity is already way too high to hope to make an effective
    algorithm. In other words, even the best possible algorithm, assuming we know
    how to write it, couldn’t solve the problem in a reasonable number of operations
    – not even with the computers of the future, which will be millions of times faster!


    ## [SQUARING THE CIRCLE?](#contents.xhtml#toc2_27)


    There are a whole slew of problems that a computer will never be able to perfectly
    solve, no matter what happens. Computer scientists already know this. Yet almost
    all of the problems AI attempts to solve fall in this category: playing chess,
    recognizing a face, preparing a schedule, translating a statement into a foreign
    language, driving a car, and so on. The number of operations needed to find an
    *exact* solution to the problem is so large that it goes beyond what we can imagine
    in terms of computing power.'
