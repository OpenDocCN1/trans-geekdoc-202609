- raw: 'Today, chatbots are much more evolved. ALICE, a program developed by Richard
    Wallace in the 1990s and a winner of the Loebner competition on several occasions,
    contains more than 50,000 rules and can answer anything you might wish to ask
    it. However, no one has succeeded yet in fooling the Loebner jury and winning
    the prize… and no AI program has successfully passed the Turing test either. On
    a regular basis, teams of computer engineers announce they’ve succeeded. But they
    never fully follow all of Turing’s requirements.


    ## [IT’S CONTROVERSIAL TOO!](#contents.xhtml#toc2_20)


    Actually, the Turing test is criticized as a method for evaluating “the intelligence”
    of an AI program. Don’t forget that it was developed in 1950, at a time when computers
    weren’t capable of processing images to detect cancer cells, or of driving a car
    on the highway! AI looked a lot different than it does today.


    The first serious criticism of the Turing test came in 1980 from John Searle,
    a philosopher who has contributed much to artificial intelligence. To explain
    the Turing test’s limitations, he proposed the “Chinese room” experiment. Imagine
    that a person who has no knowledge of Chinese is put in a room and isolated from
    the rest of the world. We give him rubber stamps with Chinese characters (50,000
    characters, in fact!) and a manual with very precise instructions describing,
    for each possible question in Chinese, the answer to be given (also in Chinese).
    Our person in the room does not need to understand Chinese. In the manual, he
    finds the series of symbols corresponding to the question, and he uses the stamps
    to copy the response provided by the manual. He hasn’t understood the question.
    He doesn’t even know what he has responded, and yet a native Chinese speaker located
    outside the room would affirm without hesitation that the person in the room speaks
    Chinese.


    The Chinese room experiment illustrates very well that intelligence is most certainly
    not limited to manipulating symbols. However, everything the Turing test measures
    relies entirely on symbols. And this is all rather normal because a computer is
    a machine that is designed to process information represented by symbols: zeros
    and ones.


    Thus, the Turing test cannot measure a machine’s intelligence, only its ability
    to process symbols like a human.


    ## [MY COMPUTER AND I ARE NOT ALIKE!](#contents.xhtml#toc2_21)


    The error is to believe that we can judge a machine’s intelligence by comparing
    its behavior to a human’s. Turing only wanted to know if we could build a machine
    capable of thinking. This is why he proposed comparing a machine’s behavior with
    a human’s. But today we know that it’s not that simple: all intelligent behaviors
    are not necessarily human. Think back to the multiplication of 26,534 × 347. You
    didn’t even try to find the answer! By contrast, humans can perfectly adopt erroneous
    behaviors. For example, they make typos in their answers much more often than
    computers. This is also a way of recognizing them in the Turing test!


    In fact, the Turing test is not really useful when developing an AI program. Turing
    never intended for his test to be used to measure the intelligence of computers.
    Let us not forget that a program is simply a series of calculations conceived
    for a specific purpose: choosing the next move in a game of chess, deciding whether
    to turn left at the next intersection, recognizing whether a picture contains
    a cat or an elephant, and so on. To test the intelligence of AI programs, we evaluate
    their performance based on the task to be performed (playing chess, finding a
    path, sorting photos). We don’t try to see whether it’s possible to talk with
    them about their philosophical viewpoint on the problem they’re meant to resolve.
    The program is, however, much more efficient than a human.


    This is an important difference. While the creation of artificial human beings
    is an interesting problem that requires writing AI programs, the opposite is not
    true. It is not necessary to make artificial humans to develop AI programs. You
    can certainly program AIs capable of resolving a given task brilliantly without
    resembling a human.


    To explain this difference, computer scientists Stuart Russell and Peter Norvig,
    known in universities around the world for their book *Artificial Intelligence*,
    offer an amusing analogy with airplanes. Aeronautical engineers build planes according
    to aerodynamics. They do not try to make machines that fly exactly as pigeons
    so that they can fool other pigeons.


    The strength of computers is their ability to process large amounts of data very
    quickly. Whereas a human relies on reasoning or on experience, a machine can instantly
    test billions of solutions, from the most absurd to the most relevant, or search
    through gigantic databases.


    When you solve a Sudoku, it would never occur to you to try all the digits possible
    in each square, one by one. However, that’s exactly how a computer operates: If
    I put 1 here… Nope, that doesn’t work. OK, 2 then. Ah, maybe. OK, let’s see, if
    put 1 in the square next to it… Nope, that didn’t work either. OK, 2 then… and
    so on. Each of these operations only takes a few nanoseconds for a computer: it
    can do hundreds of millions of them per second! You cannot.


    ![image](images/inline2_4.jpg)


    This fundamental difference between human intelligence and what we call artificial
    intelligence was summed up well by Edsger Dijkstra, a computer scientist who has
    an important place in the history of algorithms. He once said, *“The question
    of whether machines can think is about as relevant as the question of whether
    submarines can swim.”* We build machines that do not think. In some ways, however,
    they give us the impression they are intelligent. They are not.


    | [Why Is It So Difficult?](#contents.xhtml#toc1_22)[*Understanding There Are
    Limitations to What a Machine Can Calculate*](#contents.xhtml#toc1_22) || [3](#contents.xhtml#toc1_22)
    |


    | --- | --- |


    We must accept a sad truth: machines are not intelligent. At least, not in the
    same sense as when we say a person is intelligent. In a way, this is comforting
    for our ego: the thing that allows a machine to accomplish difficult tasks is
    the intelligence humans put into their algorithms. Well, then, what do AI algorithms
    look like?


    One might think they are really special algorithms with forms or structures different
    from other programs, thus creating an illusion that machines are intelligent.
    Nothing of the sort. Like all algorithms, they look like a cooking recipe. And
    like all programs, they are applied, step by step, by a machine that basically
    operates like the reader of a choose-your-own-adventure book.


    However, it takes years of research, by scientists who themselves have completed
    years of study, to develop each AI method. Why is it so difficult? It is important
    to keep in mind that there is no general technique for making AI, but rather many
    different methods and, therefore, many different algorithms. They don’t look alike
    at all, but they often have something in common. They are all designed to get
    around the two primary limitations computers have: memory and processing capacity.


    ## [LIMITATIONS OF COMPUTERS](#contents.xhtml#toc2_23)


    Computers are machines equipped with incredible memory and are able to make a
    calculation in less time than it takes to say it. However, like all machines,
    a computer can reach its limits.


    Take the photocopier, for example. It’s a machine that allows you to copy documents
    very quickly. That’s what it’s made for. To measure how well it performs, ask
    your grandparents what they had to do with carbon paper, or think about the monk
    scribes of the Middle Ages. Yet each photocopier can only produce a limited number
    of pages per minute, which is determined by its physical constraints.'
