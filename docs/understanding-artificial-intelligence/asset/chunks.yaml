    Go 棋盘大相径庭。你的程序不能修改自身来产生更智能的东西。我们会期待赛车能跑赢鸡蛋并洗衣服吗？![image](img/inline1_4.jpg)


    ## SO, WHAT IS AI?


    要理解 AI 是什么，我们将查看用于编写人工智能程序的不同方法。


    所有这些方法都依赖于算法，这些算法有时易于理解，但往往难以实现。我们将看到，不同的人类推理任务促使研究人员发明方法来自动化它们。我们也会看到，有时这些方法与人类在相同情境下会做的完全不同的做法。正如
    Minsky (1968) 所说，“让计算机程序执行人类在相同情境下更满意地完成的任务”。这不是让程序像人类一样完成任务。


