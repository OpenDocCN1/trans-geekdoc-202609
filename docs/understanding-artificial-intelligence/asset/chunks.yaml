    point by visiting the nearest neighbor each time.


    However, there is also another space: the `solution` space. This notion is somewhat
    hard to understand. Imagine you’re no longer concerned about the cities you pass
    through (the states), but instead you’re concerned about the list of cities that
    determines your entire path (the solution). With the traveling salesman problem,
    any solution is one in which you’ve visited all the cities, no matter the order.
    Bordeaux, Toulouse, Marseille, Nantes is one solution. Marseille, Toulouse, Bordeaux,
    Nantes is another (better). All of these solutions, together, are known as the
    solution space.


    The greedy algorithm simply searches, rather hastily, `any` solution: it chooses
    one single value in the solution space.


    ![image](images/inline6_3.jpg)


    ## [THE SOLUTION SPACE](#contents.xhtml#toc2_63)


    The difficulty that arises in the traveling salesman problem comes from the size
    of the solution space. If we have `N` cities to visit in addition to our departure
    city, there are `N` choices for the first city, `N` − 1 for the next, and so on.
    In total, we’ll have


    `N × (N − 1) × (N − 2) × ⋯ × 3 × 2 × 1`


    solutions to visit all of the cities. This calculation, well known to mathematicians,
    is referred to as a `factorial`, and we write it with an exclamation point. Thus,
    we have `N!` solutions for our problem of `N` cities. Put another way, for a state
    space of size `N`, as in the case of the traveling salesman, the solution space
    is size `N!`.


    As soon as we start talking about complexity and problem size, however, this factorial
    function loses its charm. Indeed, its value goes up incredibly fast. To give you
    an idea, if `N` = 4, we will have 24 possible solutions; if `N` = 7, that’s already
    5,000. And if `N` = 10, it’s over 3 million! Thus, it is inconceivable to try
    them all to decide which is best.


    ## [ONE GRAPH CAN CONCEAL ANOTHER!](#contents.xhtml#toc2_64)


    On the other hand, with all these solutions, even if there are a lot of them,
    we can build a graph: all we have to do is “connect” the solutions. Computer scientists
    love these graphs because they can write lots of algorithms with them.


    To build this solution graph, we’re going to connect two solutions when they are
    identical except for two cities. For example:


    `Limoges` → `Marseille` → `Toulouse` → `Bordeaux` → `Nantes`


    would be a neighbor solution to


    `Limoges` → `Bordeaux` → `Toulouse` → `Marseille` → `Nantes`


    We have only inverted Bordeaux and Marseille on our route.


    In our solution space with 24 solutions (four cities to visit), we’re going to
    connect each solution to six neighbor solutions, each one corresponding to a possible
    inversion of two cities on the route.


    Now we have a graph with some neighbors, as was the case for the state space.
    Thus, we can use algorithms to “explore” this solution space. Why not!


    ## [SPACE EXPLORATION](#contents.xhtml#toc2_65)


    This idea was used in an algorithm proposed in 1986 by Fred Glover, a researcher
    at the University of Colorado. It’s called the `Tabu search` method. This funny
    name comes from the fact that in this algorithm we are prevented from reconsidering
    any solution that has already been explored: it is taboo. This algorithm is not
    limited to the traveling salesman problem: it can be used to explore the space
    solutions of any AI problem.


    To resolve a problem with the Tabu search method, you start with an initial solution
    (for example, one obtained with the greedy algorithm) and you look at its neighbors
    in the solution space. For each neighbor solution, you can calculate the solution’s
    `cost` – in other words, the total number of miles you’re going to have to travel
    (if you are trying to solve a traveling salesman problem) with this new solution.
    The Tabu search algorithm then chooses the neighbor that has the lowest cost.
    Attention: this solution may be `not as good` as your initial solution! It is
    simply the best one from among all the neighbors. Regardless of whether it is
    better or worse, you take this solution and you put the preceding solution on
    the “Tabu” list.


    Then the algorithm continues: you examine the new solution’s neighbor solutions
    (unless they’re already taboo) and you choose the best one. Next, you put your
    old solution on the Tabu list and start again, and so on.


    ![image](images/inline6_4.jpg)


    After a while, we need to stop. If we continue on like that, we may end up trying
    to examine all the solutions. There are too many: the famous `N!`. For example,
    you say, “OK, I’ll stop after I have tried 10,000 solutions.” At this point, you
    look at all the solutions you have in your Tabu list, from the first (the one
    you started with) to the last (the one you ended the exploration with), and you
    keep the best one.


    This is the Tabu method. Simple, isn’t it? And this method produces pretty good
    results. But if we really think about it, we can do a lot better. To do so, we
    just need to join the efforts of more than one.


    | [Darwin 2.0](#contents.xhtml#toc1_66)[*Understanding How to Explore Space as
    a Group*](#contents.xhtml#toc1_66) || [7](#contents.xhtml#toc1_66) |


    | --- | --- |


    A well-known AI method for exploring the solution space consists of using `evolutionary
    algorithms`. This method was invented in 1965 by the German researcher Ingo Rechenberg;
    however, artificial intelligence researchers only took an interest in it much
    later, in the late 1990s.


    ## [NATURAL SELECTION](#contents.xhtml#toc2_67)


    The idea of evolutionary algorithms is to take direct inspiration from the theory
    of natural selection, the principle asserted by Charles Darwin in 1838 in his
    theory of evolution. According to Darwin, species evolve based on their environment.
    The better adapted an individual is, the more likely it is to survive. Surviving
    individuals reproduce and give birth to other individuals, passing on the traits
    that allowed them to survive (better).


    Take, for example, a herd of prehistoric giraffes. The giraffes with longer legs
    and necks will survive better than the others because they’ll be able to eat the
    acacia leaves that grow in the African savanna. Thus, they’ll have a greater chance
    of having children than the others, and because their longer legs and necks are
    genetic traits that are passed on during reproduction, there will be more large
    giraffes in the next generation. In this manner, after some time there will only
    be large giraffes, the ones that we know today.


    Artificial intelligence uses this idea to build heuristics to explore solution
    spaces.


    I get the feeling you’re a little confused. Are we going to ask giraffes to program
    computers? No, not exactly. We’re going to write an algorithm to find the best
    solution from among all the possible solutions. In this sense it’s like the Tabu
    algorithm – but this time, we won’t be satisfied with just one paltry individual
    strolling about in the “solution space” graph: we’re going to use a whole bunch.
    And to do this, we’re going to draw inspiration from giraffes in the savanna.


    ## [COMPUTING HERDS](#contents.xhtml#toc2_68)


    Imagine that, instead of giraffes, we have a herd of solutions. What I mean is,
    we have a cluster of points in a solution space. And imagine that it’s possible
    to make new solutions from two solutions chosen at random from this herd. For
    the moment, this may seem a bit abstract, but we’ll see it more clearly soon.
    Assume, for the moment, that this is possible.

