    # 介绍


    人类从未停止发明工具。在旧石器时代，我们砍树制造石斧和投掷矛用于狩猎。农业黎明时期，我们发明了锛头和镰刀用于农业，用于运输重物的车，甚至用于制造其他工具！随着时间的推移，它们变得越来越复杂。


    然后我们发明了机器。


    古代的起重机是第一批机器。它们不只是简单的工具，机器将能量转化为完成人类难以完成的任务。汽车、洗衣机、割草机：我们已经离不开这些发明了。


    人工智能有时被描述为新的革命。它似乎使我们能够赋予机器自我意识，让它们能够自我思考，甚至超越人类。这是一个令人着迷的视角，但也令人不安。这也是为什么每一次人工智能的进步都会引发各种幻想。


    我们的祖先在文艺复兴时期看到第一批织布机时，也有同样的反应——一种恐惧与紧张兴奋交织的情绪。这些机器能够完成以前只能由人类完成的工作。突然间，人类被人类的创造物所取代。有些人称它为“魔鬼的机器”，而另一些人则看到它是一个未来——不再需要工作的未来。衣服会自己做！历史表明，真相介于两者之间。


    2016 年，许多人被 AlphaGo，谷歌的人工智能程序击败李世石时留下了震撼。该程序甚至做出了人类玩家从未想到的走法。我们创造了一种机器，能够在人类偏好的领域——战略思维——上超越人类。


    所以怎样？如果一辆汽车能在 100 米短跑中击败 Usain Bolt，我们是否会感到惊讶？人类一直在努力超越自己的极限。人工智能只是一个工具，用来实现这一点。因此，我们急需消除关于
    AI 对我们的意义的神秘化。


    AI 与科幻小说中描绘的方式几乎没有关系。它与人类智能全然不同，也没有秘密计划取代并奴役人类。它仅仅是一种工具，是我们迄今为止最出色的发明之一，但它没有自己的意志。


    AI 是一个 incredible（不可思议）的力量，正在改变我们生活的世界。但正如任何人类创造的工具一样，必须学会如何使用它并防止其被滥用。为此，我们必须理解人工智能。这正是本书的目标：我想带你走进人工智能的领域。我想与你分享对这一
    extraordinary（非凡）工具的惊叹。


    然而，我也想帮助你理解人工智能的工作原理及其局限性。


    ![image](img/inlineintroduction_1.jpg)


    | 什么是人工智能？ | *理解计算机、算法、程序，以及特别是人工智能程序* | 1 |

    | --- | --- | --- |


    什么是人工智能？在我们开始讨论机器是否能奴役人类并像牛一样在农场中饲养之前，也许我们应该先思考人工智能由什么组成。让我们明确一点：人工智能并不是让计算机变得更聪明。计算机仍然是机器，它们只做我们要求它们做的事，除此之外什么都不做。


    ## [计算机科学与计算机


    要理解计算机能做什么也不能做，首先必须理解计算机科学是什么。让我们从这里开始。


    计算机科学是信息处理的科学。^(1) 它涉及构建、创建和发明能够自动处理各种信息的机器，从数字到文本、图像或视频。


    这始于计算机。此时，信息由数字和算术运算组成。例如：


    346 + 78 = ?


    随后，正如旧石器时代工具的发展一样，随着时间的推移，所处理的信息变得越来越复杂。首先是数字，然后是文字，接着是图像，再然后是声音。今天，我们已经能够制造能够倾听我们所说内容的机器（这就是“信息”），并将其转化为具体行动。例如，当你向
    iPhone 说：“Siri，告诉我我医生的预约时间”，计算机是处理这一信息的机器。


    ## 计算机与算法


    为了处理信息，计算机应用一种称为*算法*的方法。让我们尝试理解这是什么。


    当你在小学时，你学习过加法：你需要把数字对齐排列，确保数位正确。然后，你计算个位的和。如果有进位，你要记下它，然后计算十位，以此类推。


    $\\begin{matrix} & 1 & 1 & \\\\ & 3 & 4 & 6 \\\\ + & & 7 & 8 \\\\ = & 4 & 2 &
    4 \\\\ \\end{matrix}$


    这就是一种算法。


    '
