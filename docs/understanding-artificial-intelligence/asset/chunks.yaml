- raw: 'Indeed, artificial intelligence algorithms attempt to find a solution to these
    “impossible” problems. Obviously, the proposed solution will not be perfect (as
    we just saw, this is impossible!). The algorithm will incorrectly recognize a
    face from time to time, or it will make an error when playing chess or translating
    a sentence. But this algorithm will work in a “reasonable” time – in other words,
    with a lot fewer operations than what the theoretical limit requires for an exact
    solution.


    Very often, making AI consists of developing programs that give us a not-so-bad
    solution in a reasonable amount of time, when we know the right solution is simply
    not obtainable.


    Throughout the rest of this book, we are going to see a whole bunch of artificial
    intelligence methods that are not only not intelligent, they also don’t necessarily
    provide a good solution to the problem in question. Admit it, AI’s “intelligence”
    is starting to look doubtful!


    That being said, however, you’re going to see that it still works pretty well.


    | [Lost in the Woods](#contents.xhtml#toc1_28)[*Understanding a First Principles
    of AI Method – Exploration*](#contents.xhtml#toc1_28) || [4](#contents.xhtml#toc1_28)
    |


    | --- | --- |


    Let us begin our journey into the land of AI with a simple problem humans are
    quite good at: “finding their way.”


    ## [A SMALL WALK IN PARIS](#contents.xhtml#toc2_29)


    Imagine that you come out of the Bréguet-Sabin subway stop right in the middle
    of Paris, and you need to go to Place des Vosges to visit the Victor Hugo House.
    As shown on the following map, you need to take Boulevard Richard-Lenoir toward
    Place de la Bastille for a hundred yards and then turn right onto Rue du Pasteur
    Wagner. Next, cross Boulevard Beaumarchais and take Rue du Pas-de-la-Mule until
    you reach Place des Vosges, the second street on the left. The Victor Hugo House
    is on this street.


    Building this path is a task that humans know how to do by using their intelligence.
    Unfortunately, not everyone has the same ability for such a perilous mission.
    If you don’t pay attention, you might very well end up in Place de la République.


    ![image](images/inline4_1.jpg)


    To get around this difficulty, nowadays we use a GPS, a device that allows us
    to determine our location on the earth’s surface at any given moment. The GPS
    receives signals from twenty-eight satellites hovering a couple thousand miles
    over our heads. By measuring the time it takes each satellite to send a signal,
    it calculates the distance from these satellites and determines its position on
    the earth’s surface.


    ## [HOW A GPS WORKS](#contents.xhtml#toc2_30)


    To help you find your way, the GPS in your car or your telephone also has a map.
    This is an important tool that shows you all the places you can go and how they’re
    connected. It is important to imagine what all this means in terms of data: each
    address, each portion of road, even if just a few yards long, each intersection
    … everything must be represented on there, with GPS coordinates! Each possible
    position has a corresponding point on the map, and they are all connected to each
    other in a giant network.


    ![image](images/inline4_2.jpg)


    Thus, on the small portion of the map we used to go from the subway to the Victor
    Hugo House, there are already hundreds of points: the subway exit, the streets
    (cut up into as many little sections as necessary), all the intersections between
    these small portions of street, all the addresses of all the buildings on these
    portions of street … and all these points are connected to each other.


    Thanks to this map and the connections between the different points, the GPS can
    show how to go from the subway exit to Boulevard Richard-Lenoir, from the boulevard
    to the intersection with Rue du Pasteur Wagner, and so on.


    ## [FINDING THE PATH](#contents.xhtml#toc2_31)


    A GPS map is a set of interconnected “points.” In mathematics and computer science,
    this set is called a *graph*. It allows the artificial intelligence program to
    calculate the path to follow to go from one point on the graph to another.


    The GPS knows what point you’re located at (the subway exit). You’ve told it what
    point you want to go to (the Victor Hugo House). It must, then, calculate all
    the points you must pass through (all the small stretches of the boulevard, all
    the small stretches of Rue du Pas-de-la-Mule, etc.) to reach your destination.


    From the GPS’s point of view, your path is a series of points next to each other
    on the graph. In computer science, we say the GPS’s AI program “finds a path on
    the graph.” This path is then used by two other GPS components: the graphic interface,
    which allows us to view the path on the map, and the speech synthesizer (the little
    voice that gives you the information as you pass from one point to the next: “in
    500 feet, turn left”).


    Let’s consider the artificial intelligence program that determines the path.


    ## [IT IS MORE DIFFICULT THAN IT LOOKS](#contents.xhtml#toc2_32)


    To develop a GPS pathfinder program, we have to write an algorithm that, when
    given a graph, a starting point, and an end point, is capable of *finding a path*
    on the graph. When we put it this way, we really get the sense that it’s something
    a machine is capable of: we have all the necessary data. If you give a piece of
    paper with a graph on it to your six-year-old cousin and ask him to draw the path,
    he should be able to do it pretty easily.


    But for a computer, this is where things get difficult. Remember what we saw about
    how they work: they are Turing machines that run operations on the “cells” on
    a strip of tape. Each cell corresponds to one specific piece of information for
    the machine, and it can only examine one cell at a time. Unlike us, the computer
    does not “see” the whole graph. It only sees one point at a time.


    Put yourself in the machine’s place and try to find a solution. You can only look
    at the starting point (the subway exit, in our example) and choose one of the
    neighboring points on the graph: Rue Bréguet, Rue Saint-Sabin, Boulevard Richard-Lenoir,
    Passage Amelot, apartment 21–23 on Boulevard Richard-Lenoir, and so on. You cannot
    examine them all at the same time: you have to choose one, save the ones you haven’t
    looked at yet in your memory (in other Turing machine cases), and start over again
    at the next point.


    If you choose Boulevard Richard-Lenoir, you can now look at a list of its neighbors.
    This list contains the “subway exit” point that you’ve already seen, but there
    are still all the others. You can add Rue du Pasteur Wagner to your list of points
    to look at. Next, you must choose another point and start again.


    If you’re fortunate, you’ll end up making it to the Victor Hugo House with this
    method. But at no time will you know whether the point you’ve chosen is bringing
    you closer to, or farther away from, your goal. Again, you can only see your immediate
    neighbors on the graph.


    ![image](images/inline4_3.jpg)


    ## [THE ADVENTURERS OF THE LOST GRAPH](#contents.xhtml#toc2_33)


    It’s quite unsettling, isn’t it? The computer is like Theseus in the labyrinth:
    it can leave a trail behind it to know what path it has taken, it can remember
    each intersection it has come to, but it never knows where the corridor it has
    chosen will lead to!


    This pathfinding problem on a graph is a classic artificial intelligence problem:
    computer scientists call it *state space exploration*.


    Contrary to what the name suggests, it has nothing to do with sending a rocket
    into space with a flag of the United States. Not at all. In computer science,
    state space is the graph that defines all of the machine’s possible states. Or,
    for a GPS, all the possible positions. State space exploration consists of walking
    through this space of possibilities, from one point to the next in search of a
    given point, all the while memorizing the path up to this point. It’s Theseus
    in the labyrinth.


    ## [SO EASY!](#contents.xhtml#toc2_34)'
