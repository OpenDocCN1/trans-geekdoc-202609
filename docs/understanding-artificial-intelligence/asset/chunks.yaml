    It is hard to say exactly when reinforcement learning was invented. Even so, its
    principle plays an important role in AI algorithms. The TD-lambda algorithm invented
    by Richard Sutton in 1988 is widely considered the first reinforcement learning
    algorithm that could be broadly applied to many categories of problems.


    All reinforcement learning algorithms share a common feature: they do not need
    examples to learn.


    When young children learn to catch a ball, they learn by trial and error. They
    move their hands without much rhyme or reason at first, but they gradually learn
    the right movements to sync up with the ball’s movement. In this learning process,
    children don’t rely on examples. They correct their errors over subsequent attempts.


    This is the idea behind reinforcement learning: the computer calculates a “score”
    for each possible action in each situation by “trial and error.” As it does this,
    it gradually adjusts the calculation’s parameters.


    ![image](images/inline14_4.jpg)


    ## [STEP BY STEP](#contents.xhtml#toc2_143)


    Like back-propagation in a neural network, reinforcement learning lets us adjust
    the parameters of a sequence of calculations. However, unlike supervised learning,
    the output doesn’t depend on examples. The systems that these algorithms work
    on don’t have input, per se. They begin at an initial state and perform a sequence
    of actions to reach a desired state.


    Let’s use Go as an example. The initial state is the empty board. The system makes
    a series of moves, observes each of the opponent’s responses, and the final state
    is achieved when the game is over. On the basis of the result at the end of the
    game, you can assign a score to your series of moves. Computer scientists call
    this a `reward function`.


    In this type of system, there is no corpus of examples associated with the correct
    output, as is the case with neural networks. We have a given sequence of actions
    and just as many intermediate inputs. In this way, each state on the game board
    corresponds to an input, and the system’s response is the action chosen by the
    system (its move). The actions are only evaluated at the end of the game, once
    all the actions are complete.


    Reinforcement learning consists of adjusting the parameters of these actions by
    using a reward function. Each action, or each intermediate state (this depends
    on which algorithm you use), is given a score. When the computer reaches the final
    state, the algorithm adjusts the scores of all the actions or intermediate states
    encountered during the match in accordance with the reward value. For example,
    imagine that the system’s first move is H5, its second is B7, and so on until
    the end of the match, which it wins handily. In this case, the scores for actions
    H5, B7, and the following moves will be increased. By contrast, if the match results
    in a loss, their scores will be decreased by however much the reward function
    decides.


    ![image](images/inline14_5.jpg)


    To adjust the parameters of your system, which can decide which action to take
    at each stage of the process, the reinforcement learning algorithm is going to
    play millions of “fake” Go matches to adjust its parameters. To ensure that the
    learning is effective, this algorithm carefully chooses its actions. Unlike with
    the Monte Carlo algorithm, its moves are not made completely at random. As the
    algorithm advances, the “right” parameters have a higher chance of being chosen.
    In this way, the system `reinforces` the certainty of having a good strategy to
    achieve the desired final state.


    ## [PLAYING WITHOUT RISK](#contents.xhtml#toc2_144)


    Not all problems can be resolved with this method. For example, let’s consider
    self-flying drones (NASA has been working on a prototype since the early 2000s).
    It is not reasonable to build a million drones, send them up in the air, and watch
    them crash to the ground over and over until we eventually figure out the right
    parameters. Only the Shadoks^([1](#ch14.xhtml#fn14_1)) would use this method.
    Computer scientists use simulation instead. However, the algorithm only learns
    how to behave in simulation. There’s no guarantee it will work correctly in real
    life!


    Thus, reinforcement learning can only be used for applications that simulate no-risk
    operations, as is the case with Go. Using this reinforcement learning technique,
    AlphaGo engineers succeeded at gradually training the two neural networks: all
    you have to do is have the computer play against itself. This produces billions
    of matches that allow the neural network to gradually reinforce its confidence
    to make decisions, whether it be to reject a move (the “network policy”) or to
    stop the game (the “value network”).


    ## [GIVE ME THE DATA!](#contents.xhtml#toc2_145)


    The same reinforcement learning technique can be used to teach AlphaGo to play
    chess and checkers. In 24 hours, the system calculates the best action sequences
    and becomes unbeatable.


    These two learning methods, neural networks and supervised learning, rely on a
    similar idea. This consists of writing an algorithm to adjust a set of parameters
    in a calculation that allows the machine to make a decision. This adjustment is
    achieved by exploring a new space: the `parameter` space. When your system receives
    an input, it calculates an output based on the input’s parameters. The learning
    algorithm is going to explore this set of possible parameters, which is gigantic,
    to find values that allow it to obtain a good response… in most cases.


    ![image](images/inline14_6.jpg)


    When the problem to be resolved is easy to simulate, as is the case with Go (losing
    a match isn’t a big deal), the reinforcement learning techniques allow this parameter
    space to be explored in a clever manner. In other cases, the system has to be
    given examples. A lot of examples, often in unfathomable quantities. Thus, to
    be trained correctly, Rosenblatt’s perceptron needs more triangles than a geometry
    teacher sees in a lifetime!


    However, in the era of “big data,” satisfying this need is no longer a problem.
    Artificial intelligence research laboratories build gigantic databases to train
    their algorithms. And if Google is the best at image recognition, natural language
    comprehension, and Go, it’s because their engineers have the ability to collect
    data from our internet searches, our telephones, our videos, and our emails.


    Certain domains continue to elude these learning-based techniques because labeled
    data aren’t available. Consequently, artificial intelligence researchers develop
    techniques using symbolic models, like the ones we saw in the early chapters of
    this book, to generate synthetic data based on computer models of a given domain.
    These synthetic data capture a degree of human expertise.


    These very promising approaches have been in development for some years and have
    a bright future ahead.


    And, just like that, computers now regularly outperform us. It’s going to take
    some time to get used to – even though we are solely responsible for this!


    \_\_\_\_\_\_\_\_\_\_\_\_\_


    [1](#ch14.xhtml#Cfn14_1)  The Shadoks are silly animated cartoon characters, very
    popular in France in the 1960s, that keep failing in building all sorts of machines.


    | [Strong AI](#contents.xhtml#toc1_146)[*Understanding AI’s Limitations*](#contents.xhtml#toc1_146)
    || [15](#contents.xhtml#toc1_146) |


    | --- | --- |


    Our journey in the land of AI will soon be at an end. What we’ve seen so far is
    a general overview of some problems and some methods used to solve them. There
    are still many other techniques we haven’t covered. Most approaches used in AI
    require many years of study before they can be fully mastered.


    Despite this, you get the general idea: humans build machines that perform calculations,
    transform data, and resolve problems. However, these machines are not truly intelligent.
    They apply a procedure created by a human being.

