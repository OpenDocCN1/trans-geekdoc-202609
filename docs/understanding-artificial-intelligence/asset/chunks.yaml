- raw: 'The reasons are no mystery: the partial perception of the situation, the consideration
    of temporality, and the diversity of possible solutions. For now, though, AI researchers
    are unable to get around these obstacles. But each method contributes some progress,
    each algorithm has its victories. Gradually, our knowledge grows and we are able
    to build ever more impressive machines.


    ## [DOING LIKE HUMANS?](#contents.xhtml#toc2_159)


    Some people think machines will soon be able to automatically correct philosophy
    essays or hire people using a resume and a video. I don’t think so. The technical
    limitations aside, the human factor in these tasks is so subtle that it would
    be difficult to capture it in an AI system. Humans would quickly find out how
    to trick such systems using “antagonist data.”


    Perhaps one day we will discover that artificial intelligence cannot do everything.
    That there are some things that elude computer data processing. Or perhaps not.
    As more discoveries are made, will we ultimately succeed at imitating humans flawlessly,
    including their abilities to err, to behave foolishly, and, despite everything,
    to strive tirelessly to improve?


    Artificial intelligence algorithm research teaches us a lot about humans. We often
    attempt to understand how humans perform tasks in order to build machines that
    can do it better. Before that, many researchers also attempted to build machines
    to understand man or nature: the neural networks, to cite one example, were invented
    to study the theories proposed by psychologists in the 1950s. Thus, the progress
    with machines is also raising questions about humans’ thinking mechanisms.


    In the end, isn’t this the greatest gift AI could give us: the ability to better
    understand ourselves?


    ![image](images/inline17_1.jpg)


    # [Even More AI!](#contents.xhtml#toc1_160)


    Sadly, it impossible to talk about all of the AI techniques invented since 1956:
    we would need another 15 chapters! My goal in this book was not to cover the entire
    spectrum of artificial intelligence research, but to simply help you understand
    how AI works, what its limitations are, and how, over the course of history, we
    have progressed in developing machines that are increasingly capable of performing
    tasks that require “intelligence.”


    AI techniques are used in numerous domains even if we are not entirely aware of
    it. In fact, we use AI every day. At this point, I think it is fair to credit
    some famous researchers for their discoveries in artificial intelligence that
    I did not have the opportunity to speak about in the preceding chapters. Dozens
    of names deserving mention come to mind. I''ve chosen the most famous ones below.


    ## JAMES ALLEN


    James Allen is a researcher who isn’t content to make only one major contribution
    to artificial intelligence. James Allen is famous for his temporal reasoning model
    that allows computers to reason about notions such as “before,” “after,” “at the
    same time,” and “during.” He has also helped develop several natural language
    dialogue systems that combine knowledge representation techniques in *symbolic*
    artificial intelligence with *statistical learning*.^([1](#ch18.xhtml#fn_1))


    ## JOHN MCCARTHY AND PATRICK HAYES


    In the 1960s, John McCarthy and Patrick Hayes laid the foundations for an entire
    field of symbolic artificial intelligence. They proposed a model for reasoning
    about actions and changes: things are no longer always true or always false. In
    so doing, they paved the way for *cognitive robotics* research – in other words,
    building robots capable of reasoning about how to behave in the world. This isn’t
    quite artificial consciousness, however, because the machines simply apply rules
    of mathematical logic within a framework whose bounds have been set by humans.
    However, the systems developed using this technology are able to adapt to different
    situations by using *logical reasoning*.


    ## RICHARD FIKES, NILS NILSSON, AND DREW MCDERMOTT


    In artificial intelligence, planning is the branch that concerns itself with calculating
    the right sequence of operations to achieve a goal. The STRIPS model, invented
    by Richard Fikes and Nils Nilsson in 1971, helps to describe actions, to describe
    a goal using a well-formed formula, and to calculate actions to achieve this goal.
    Planning algorithms allow systems to autonomously adapt to different situations.
    They are used in numerous industrial systems… and even in the Hubble telescope!


    Other models and algorithms have been proposed since then, such as Drew McDermott’s
    PDDL language, or the hierarchical task network (HTN) models proposed in the early
    2000s. Each year brings new advancements that allow machines to resolve increasingly
    complex problems and come one step closer to human reasoning.


    ## CHRISTOPHER WATKINS, LESLIE KAELBLING, AND MICHAEL LITTMAN


    The best-known *reinforcement learning* algorithm^([2](#ch18.xhtml#fn_2)) is certainly
    the *Q-learning* algorithm proposed by Christopher Watkins in 1989. It is taught
    in artificial intelligence courses at universities all around the world. In 2014,
    a Google team used a *Q-learning* variation to develop an AI program capable of
    playing Atari’s 1980s video game Breakout just as well as a human. Today, this
    type of algorithm is commonly used in industrial robots to grab objects.


    In the 1990s, Leslie Kaelbling and Michael Littman took a model from another branch
    of computer science and adapted it to artificial intelligence: *the partially
    observable Markov decision process*. When combined with reinforcement learning
    methods, this tool allows machines to calculate optimal solutions for *planning*
    problems by considering eventual uncertainties in the information transmitted
    by the sensors. These planning algorithms are widely used in robots, in particular
    the robots NASA sends to Mars.


    ## ROBERT KOWALSKI, ALAIN COLMERAUER, AND PHILIPPE ROUSSEL


    In 1972, French researchers Alain Colmerauer and Philippe Roussel proposed the
    first programming language based entirely on logic, drawing inspiration from the
    work of Britain’s Robert Kowalski. The language, Programming Logic (Prolog), would
    become a big hit in the artificial intelligence community. Widely used in automated
    systems, including the Paris subway, it is still taught at universities today.
    More recently Prolog was used in programming Watson, IBM’s artificial intelligence
    computer system that beat all of Jeopardy’s champions hands down.


    ## EDWARD FEIGENBAUM


    Edward Feigenbaum is considered the “father” of *expert systems*. These computer
    programs use logical reasoning to emulate the decision-making ability of human
    experts: chemists, doctors, security experts, and so forth.


    Expert systems are still used today in large industrial infrastructures.


    ## LOTFI ZADEH


    Lotfi Zadeh is the inventor of *fuzzy logic*. Behind the odd name lies a very
    particular computing model that allows computers to reason about facts that are
    more or less true, such as “it’s nice outside,” “it rained a lot,” or “the car
    is going fast.” Artificial intelligence programs using fuzzy logic, with reasoning
    rules written by humans, have been used in all kinds of intelligent control systems
    since the 1980s: cranes, elevators, meteorology, air traffic control, and many
    others.


    ## ALLEN NEWELL


    Allen Newell is an artificial intelligence pioneer who was present at the Dartmouth
    workshop in 1956. In the 1980s, his work led to *cognitive architectures*, the
    most famous of which are undoubtedly John Laird’s Soar and John Anderson’s ACT-R.
    These are computer models that allow a computer to simulate human behavior in
    a specific situation. They are used in video games to provide nonplaying characters
    with more realistic reactions when confronted with players’ decisions.'
