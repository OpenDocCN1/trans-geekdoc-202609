- raw: 'So, is it possible to build machines that are truly intelligent? Machines
    capable of resolving all kinds of problems without human intervention? Machines
    capable of learning and developing as children do? Machines aware of the world
    around them? Machines that can feel emotion, form a society, and build a future
    together? Some people, such as French researcher Jacquets Pitrat, firmly believe
    so.


    We might as well say it now: this is a tricky topic that has more in common with
    science fiction than with actual science. It goes without saying, the dream of
    a truly intelligent machine made in humans’ image has been an extraordinary driving
    force behind all of the developments in artificial intelligence since the 1950s.
    Currently, however, there is nothing to suggest it is possible to build such a
    machine.


    ## [STRONG AI](#contents.xhtml#toc2_147)


    The artificial intelligence techniques we have seen throughout this book were
    systematically developed for a very specific goal: to effectively resolve a given
    problem. They do not attempt to imitate humans in every domain.


    In the 1970s, the philosopher John Searle hypothesized that the human brain could
    behave like a computer, a machine that processes information. Subsequently, he
    used *Strong AI* to refer to artificial intelligence capable of perfectly imitating
    the human brain. The term stuck.


    ![image](images/inline15_1.jpg)


    Today, we use the term *weak AI* to refer to AI techniques that allow us to resolve
    specific problems, such as finding a path for a GPS, recognizing cute kittens
    in pictures, or winning at Go. It’s a bit of a misnomer: these computer programs
    systematically surpass human ability; what’s more, that’s what they were designed
    for. You might agree that it’s a little presumptuous to say they’re “weak.” Human
    pride knows no limits.


    Strong AI, on the other hand, refers to artificial systems capable of thinking
    like a human being. As a result, researchers distinguish between two very different
    problems: building a general AI and building an artificial consciousness. Let’s
    take a look at these two notions.


    ## [GENERAL INTELLIGENCE](#contents.xhtml#toc2_148)


    The idea of developing a machine capable of adapting to any type of situation
    and resolving a wide variety of problems like a human wasn’t thought up yesterday.
    It is certainly the main driving factor behind countless artificial intelligence
    research projects. Although a great number of researchers have given up on this
    utopia, many still hear its call.


    General artificial intelligence brings together researchers who develop AI in
    this direction. Their objective is to develop an artifact capable of performing
    any intellectual task a human can accomplish. Consequently, they have developed
    a certain number of tests that a general AI must be able to pass, such earning
    a university degree, passing the Turing test, or preparing a coffee in an unfamiliar
    house.


    The difficulty is that the *same program* must perform all of these tasks, whereas
    a weak AI uses one program for each set of problems. Attention! This doesn’t mean
    that a so-called weak artificial intelligence cannot be applied to several problems.
    A primary objective in AI and any computer science research project is to develop
    algorithms that are as generic as possible, regardless of the method used. Thus,
    the minimax algorithm is the same for chess as it is for Reversi. The only thing
    that changes is the heuristic function. A deep neural network will always have
    the same structure. The only things that change are the number of neurons in each
    layer and the learning examples provided to the machine.


    However, this isn’t the only difference between a general AI and a weak AI. It
    is absolutely impossible to apply a weak AI algorithm directly to a problem that
    it hasn’t been designed for. If you have any doubts, just try resolving the traveling
    salesman problem using the AlphaGo neural networks!


    ![image](images/inline15_2.jpg)


    ## [ARTIFICIAL CONSCIOUSNESS](#contents.xhtml#toc2_149)


    The second problem that research into strong AI looks at is how to build an artificial
    consciousness – a machine that would be conscious of physical or immaterial elements
    in addition to the data it manipulates, a machine that would be aware that it’s
    a machine.


    Researchers in this domain raise questions that are entirely different from the
    ones we’ve studied so far. First and foremost, scientists attempt to define what
    consciousness is and what a machine would have to produce to allow us to say that
    it is conscious. This is an open question and it relates to subjects that draw
    on philosophy and neuroscience just as much as artificial intelligence.


    What would the neural activity of such a consciousness look like? Could this phenomenon
    be reproduced in a machine? Under what conditions? An underlying idea in artificial
    consciousness research is that a machine capable of simulating a human brain would
    be able to create a consciousness, but philosophers are skeptical of this purely
    mechanical vision of consciousness. Numerous researchers believe the body also
    plays a fundamental role in consciousness, just as it does with emotion.


    ## [AN UNCERTAIN FUTURE](#contents.xhtml#toc2_150)


    Is a general artificial intelligence or an artificial consciousness around the
    corner? It is impossible to give a purely scientific answer devoid of opinions,
    beliefs, and ideologies. Many researchers do not “believe” it is possible to create
    a strong AI with our current means. However, no one can fully prove that it is
    impossible, and several businesses are investing in this type of research.


    History has shown that the future of artificial intelligence is difficult to predict.
    Certain things that looked on the verge of being resolved in the 1980s, such as
    diagnosing illness, have proven to be terribly difficult. On the other hand, certain
    objectives that seemed impossible to achieve, such as Go, have clearly become
    much easier. In the 1970s, no one would have bet a dime on neural networks. Today,
    they’re a major focus of attention.


    While it may not lead to any concrete results, strong AI research certainly contributes
    to the knowledge we have about human intelligence. It would be foolish to dismiss
    it outright.


    ## [HOW FAR CAN WE GO?](#contents.xhtml#toc2_151)


    In computer science, and AI in particular, making predictions is rather audacious.
    Many people have been wrong about AI, and many will continue to be wrong about
    what AI has in store for us. Even if we remain within the well-controlled domain
    of so-called weak AI, it will surely open new doors for society. Machines are
    increasingly capable of accomplishing what might have seemed impossible to automate
    just a few years ago. And, as you might expect, this evolution is raising concerns.


    | [Is There Cause for Concern?](#contents.xhtml#toc1_152)[*Understanding That
    AI Can Be Misused*](#contents.xhtml#toc1_152) || [16](#contents.xhtml#toc1_152)
    |


    | --- | --- |


    Artificial intelligence is a powerful tool. It allows machines to accomplish a
    considerable number of tasks that, until very recently, could only be accomplished
    by humans. Computer applications written by AI algorithms also allow us to process
    data faster, whether it’s for making decisions, travel, finding information, controlling
    industrial machinery, or just playing games.


    Quite often, AI’s capacities greatly surpass those of humans. This inevitably
    leads us to consider the place of machines in our societies and our relationship
    with them. Will they eventually take control of our societies and destroy or enslave
    humanity, as in sci-fi movies?


    ## [AUTONOMOUS SYSTEMS?](#contents.xhtml#toc2_153)'
