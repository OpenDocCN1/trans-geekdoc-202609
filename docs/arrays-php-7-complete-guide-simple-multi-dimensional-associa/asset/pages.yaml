- pgno: 24
  md: '# Other Ways to Define Arrays


    In PHP, if you know the inital values for an array, it can be created using a
    structure similar to other languages.

    $customer_record = array(''Fred'', ''Smith'', ''123 Main Street'', ''Atlanta'',
    ''GA'', ''30001'');

    print_r($customer_record);


    Array ( 0] => Fred [1] => Smith [2] => 123 Main Street [3] => Atlanta [4] => GA
    [5] => 30001


    In this example, we have initially created the array with a certain number of
    elements (6) and initial values. PHP, like other languages, will automatically
    number the subscripts for each position, beginning at zero. Since PHP stores all
    arrays in the same format, we can change the values in this array using the same
    techniques we have discussed.


    print_r($customer_record);

    Array ( 0] => Pete [1] => Smith [2] => 123 Main Street [3] => Atlanta [4] => GA
    [5] => 30001


    As you can see, Fred is replaced by Pete, passing a new value into the proper
    position.


    What happens if we attempt to place a value in a position that does not exist?

    $customer_record[6] = ''77077777777'';

    print_r($customer_record);


    Array ( 0] => Pete [1] => Smith [2] => 123 Main Street [3] => Atlanta [4] => GA
    [5] => 30001 [6] = 77077777777


    As you can see, the array simply creates a new position and places the value at
    that position.

    $customer_record[] = ''77077777777'';


    PHP arrays will automatically place new values at the end of the array if a position
    is not included. This is not true in other languages. Many languages will indicate
    that you are out of bounds (you you have exceeded the size of the array). They
    will not let you add elements to the array unless you somehow increase the size
    of the array.


    In the format used in the example above, the original array contains the exact
    same information and positions as the previous array. PHP allows us to easily'
  merge: -1
  img_proc: true
