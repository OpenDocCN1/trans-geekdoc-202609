- pgno: 21
  md: "# PHP array, that position merely does not exist.\n\nprint_r($customer_record);\n\
    Array ( [0] => Fred [2] => Smith [3] => 123 Main Street [4] => Atlanta [5] =>\
    \ GA [6] => 30001 )\n\nAs you can see from the results of executing a print_r\
    \ against a populated $customer_record array, there is no position 1 that exists\
    \ in the array.\n\nYou might wonder if this will cause any problems in retrieving\
    \ values from the array.\n\nRemember when creating dynamic arrays in PHP we might\
    \ not know how many positions are in the array. You may have been taught, or seen\
    \ the for loop used with arrays. The for loop is not the best choice for retrieving\
    \ values in a PHP array.\n\n**The foreach loop is a much better choice.** This\
    \ loop will automatically only retrieve positions that exist in the array (it\
    \ would skip position 1 in the example above) and automatically retrieves all\
    \ positions of an array.\n\n```\nforeach($customer_record as $value)\n{\n  print\
    \ $value;\n}\n```\n\n$customer_record is the name of the array. as is a required\
    \ keyword. $value represents the value that exists within the position that the\
    \ method is currently accessing. $value can be assigned any name by the programmer.\
    \ It is a temporary property that holds the value in the current position in the\
    \ array.\n\nIf we use this loop to print the values in the previous array, the\
    \ loop would start at position 0 and print the contents of the first position\
    \ (Fred). The loop would then move to the next position in the array, position\
    \ 2 (there is no position 1). It would print the contents of this position (Smith)\
    \ and continue until all positions in the array have been printed.\n\nFred 123\
    \ Main Street Atlanta GA 30001\n\n**The foreach loop makes retrieving values from\
    \ PHP arrays easy.** This loop will eliminate any possibility of trying to retrieve\
    \ values from non-existent positions in the array and will eliminate the possibility\
    \ of going beyond the end (size) of the array. The size and positions of an array\
    \ could change at any time and this little foreach loop will still function properly."
