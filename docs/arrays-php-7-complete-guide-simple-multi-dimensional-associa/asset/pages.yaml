    $customer_record[4] = validate_state($_POST[''state'']);

    $customer_record[5] = validate_zip_code($_POST[''zip_code'']);

    print "Your name is $customer_record[0] $customer_record[1].

    nYou live at $customer_record[2], $customer_record[3],

    $customer_record[4], $customer_record[5]"";

    ?>

    ```


    In Example 1-4, the individual records are replaced with locations within the
    array $customer_record to store the values retrieved. In most programming languages,
    arrays subscripts must be numbered beginning with zero. Unlike many other languages,
    PHP allows us to dynamically create our array locations when needed (as shown
    in Example 1-4). This allows us store and revive values in an array in a similar
    way to storing and retrieving values in'
