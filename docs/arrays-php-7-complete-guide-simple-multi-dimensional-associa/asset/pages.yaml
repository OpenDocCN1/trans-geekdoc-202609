    The output of a print_r statement would produce similar results (because it makes
    no indication of the data types of the individual values).


    However, we can detect the difference if we first convert our array to JSON format
    (using the method json_encode), and then display the results. We could also use
    the PHP var_dump method. We will look at examples using this method in a later
    chapter.


    $json = json_encode($customer_record);


    print_r($json);


    ["Pete","Smith","123 Main Street","Atlanta","GA",30001]


    The JSON format allows you to see that the data type for the zip code did actually
    change from a string value (‘30001’) to a numeric value (30001).

    Even if the zip code already existed in string format, when we replace it with
    a numerical value, that number (not string) would now exist in the array.'
