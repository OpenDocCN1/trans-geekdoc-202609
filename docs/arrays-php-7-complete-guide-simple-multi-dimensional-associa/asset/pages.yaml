    +   - reset — sets the internal pointer of an array to its first element


    “reset() rewinds array’s internal pointer to the first element and returns the
    value of the first array element.”


    # Syntax:


    ```

    mixed reset ( &$array )

    ```


    # Example:


    ```

    $first_array = array(''first_name'' => ''Pete'', ''last_name'' => ''Smith'', ''address''
    => ''123

    Main Street'', ''city'' => ''Atlanta'', ''state'' => ''CA'', ''zip_code'' => 30001);

    ```


    ```

