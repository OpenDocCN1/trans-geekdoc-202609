    A PHP program can access information passed from an html form using the $_POST
    or _GET methods. The method used in the PHP program must match the type indicated
    in the html form attribute. Information passed via post will not display via the
    URL address in the browser. Information passed via get will display on the URL
    line.


    Why do we have a choice?


    Information passed via get does not use as much server memory because it is contained
    in the URL address. Information passed via post resides in the memory of the server.
    Sites that have heavy traffic, such as search engines, get to be as memory efficient
    as possible. Although passing information via post ‘hides’ the information from
    the URL line, it is not consider to be secure because it is not usually encrypted.


    The $_POST and _GET methods use the property name created by the html form (‘first_name’)
    to retrieve the value passed (‘Fred’). The information can be placed into a property
    ($first_name) that is defined in the program itself. Remember, all the information
    gathered via the $_POST (or $_GET) method is stored as the string data type (since
    the html form can only pass strings).


    PHP dynamically creates a property the first time it is used, space is allocated
    in memory for the property and its value by the operating system of the web server.


    $first_name = validate_first_name($_POST[''first_name'']);


