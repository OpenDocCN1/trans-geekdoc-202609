  md: '# Preface


    Arrays - PHP 7 Complete Guide is intended for use as a supplemental beginning
    level programming book. It is not the goal of this book to cover advanced techniques
    in the current versions of the PHP programming language. Some beginning knowledge
    of general PHP programming concepts is expected but no actual programming experience
    or education is assumed.

    All code examples in this book are compatible with PHP 7. The newest methods (functions)
    available in PHP have been used to provide the reader with the most current coding
    techniques. The examples use core methods provided in the PHP language. PHP includes
    many additional methods to accomplish similar tasks as shown within. The reader
    may, and should, research additional advanced array techniques after understanding
    the materiel presented in this book.


