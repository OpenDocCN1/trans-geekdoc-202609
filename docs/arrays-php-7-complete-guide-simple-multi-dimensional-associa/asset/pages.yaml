    "Cap" "Hill" "1112 Peachtree Road"


    "Atlanta" "GA" 30018


    In 2-1, four customers exist within the table. In a spreadsheet or in a program,
    the information for each customer is contained in a *record* (also referred to
    as a row). Each row has the same type of information in each *column*. For example,
    the *first column* contains the first name of each of the customers.


    This table contains six columns and four rows. However, remember that spreadsheets
    and programs begin the numbering of elements with zero, not one. The uppermost
    left element (which contains “Pete”) resides in row zero and column zero (0, 0).
    The lowermost right element (30018) resides in row three and column five (3, 5).


    What resides in row 2 and column 2? “111 Peachtree Street"

    Why do we say row x and column y, not column y and row x?


    The answer lies in how the information is stored in memory. The operating system
    stores two dimensional arrays by row. The rows are kept intact because everything
    in a row is related (all of *Pete Smith’s* information). The row information is
    placed in memory locations that are contiguous to each other (next to each other).
    Other rows are not necessarily stored in memory next to previous rows. This allow
    the operating system to be efficient with memory storage.


    When retrieving data from a *two-dimensional array*, we usually retrieve or look
    at a row of information at a time (such as all of *Pete Smith’s* information).
    In turn allows the operating system to go to one continuous area of memory to
    pull the information. When a column of information is needed, less efficiently
    occurs, because the operating system might need to go to several noncontiguous
    locations in memory to retrieve the information.


