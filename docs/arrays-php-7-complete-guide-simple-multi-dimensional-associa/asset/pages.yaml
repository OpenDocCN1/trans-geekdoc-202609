- pgno: 119
  md: '# Sorting Arrays


    array_multisort — sorts multiple or multi-dimensional arrays


    array_multisort() can be used to sort several arrays at once, or a multi-dimensional
    array by one or more dimensions.


    Associative (string) keys will be maintained, but numeric keys will be re-indexed.


    Sorting type flags:


    +   * SORT_REGULAR - compare items normally (don''t change types)

    * SORT_NUMERIC - compare items numerically

    * SORT_STRING - compare items as strings

    * SORT_LOCALE_STRING - compare items as strings, based on the current locale.
    It uses the locale, which can be changed using setlocale()

    * SORT_NATURAL - compare items as strings using “natural ordering” like natsort

    * SORT_FLAG_CASE - can be combined (bitwise OR) with SORT_STRING or SORT_NATURAL
    to sort strings case-insensitively


    Syntax:


    ```

    bool array_multisort ( array &$array1, mixed $array1_sort_order = SORT_ASC, mixed
    $array1_sort_flags = SORT_REGULAR [, mixed $ ... ] )

    ```


    Example:


    ```

    $first_array = array(''Pete'', ''Smith'', ''123 Main Street'', ''Atlanta'', ''GA'',
    ''30001'');

    $second_array = array(''Sally'', ''Parisi'', ''101 South Street'', ''Atlanta'',
    ''GA'', ''30001'');

    ```


    ```

    array_multisort($first_array, SORT_ASC,

    $second_array, SORT_DESC);

    ```


    ```

    print_r($first_array);

    print_r($second_array);

    ```'
