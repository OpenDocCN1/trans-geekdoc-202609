    an exception is thrown with the message "Invalid First Name".nOnce these statements
    execute, the customer information is stored in memory and can be accessed by the
    program. If this was a complete program, the information would also be stored
    in a location external to the program (such as a database or cloud location) before
    the program completes execution. Once the data is no longer accessible in memory.
    When a program completes, the garbage collector of the operating system is notified
    that the memory space is no longer needed. The garbage collector then takes the
    responsibility to reassign the memory space for other users.


    This process becomes more complicated, however, if the program needs the ability
