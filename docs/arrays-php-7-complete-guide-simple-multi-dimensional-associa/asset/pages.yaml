  md: 'Some students get lost when learning about Associative Arrays. However, there
    is no reason to panic. You have already seen them use in every example in this
    book!!


    # What?


    Yes, remember, it was mentioned in chapter one that all arrays are the same in
    PHP. All arrays are Associative Arrays. The only difference between what we discussed
    before now and what is placed in the subscript. Recall


    Example 1-4:


    # Example 1–4 – process_customer_record.php


    ```

    <?php

    // accepts information from example1.html

    // This is NOT a complete program. The validate methods shown need to be created
    to clean any // input

    $customer_record[0] = validate_first_name($_POST[''first_name'']);

    $customer_record[1] = validate_last_name($_POST[''last_name'']);

    $customer_record[2] = validate_address($_POST[''address'']);

    $customer_record[3] = validate_city($_POST[''city'']);

    $customer_record[4] = validate_state($_POST[''state'']);

    $customer_record[5] = validate_zip_code($_POST[''zip_code'']);

    print "Your name is $customer_record[0] $customer_record[1].

    You live at $customer_record[2], $customer_record[3],

    $customer_record[4], $customer_record[5]";

    ?>

    ```


    The subscripts in this example are 0, 1, 2, 3, 4, and 5. That is not very descriptive.
    Instead, we can use words.


    # Example 3-1


    ```

