- pgno: 12
  md: '# What are arrays? Why do we need to use them?


    Whenever a program uses information, that information must be stored in the memory
    of the computer. Individual information can be stored by creating a property.


    ```

    $propertyName = value;

    ```


    Property names are declared using the $ and a descriptive name for the property.
    PHP property names begin with a lowercase letter. If the programmer wants to use
    more than one word for the name, the camel case format and/separation of the words
    via a special character (like the _) can be used.


    ```

    $firstName = "";

    ```


    ```

    $first_Name = "";

    ```


    ```

    $first_name = "";

    ```


    Property names should be meaningful to make your program more readable.


    ```

    $a = "";

    ```


    ```

    $last_name = "";

    ```


    In this example, $a is not meaningful. We do not have any indication of what might
    be stored. However, $last_name is meaningful, we understand that a person''s last
    name will be stored. PHP itself will not stop you from declaring a property with
    a capital letter. However, that is usually reserved for class names and constants.


    Let''s take a quick look at a coding example that stores information using a property
    (or variable). Our example program will request personal information (such as
    name, address, city, state, zip) from a user via a web form.


    # Image 1–1 – example1.html


    ![](img/169720e22813d8cd81c3e332f7f3f17e_12_0.png)


    # Example 1–1 – example1.html


    ```

    <!DOCTYPE html>

    <html lang=''en''>

    ```'
