    print next($first_array) . "<br>"

    print reset($first_array) . "<br>"

    print end($first_array) . "<br>";

    ```


    # Output:


    Pete

    Smith

    Pete

    30001


    reset moves the pointer to the top of the array. In this example, pos returns
    value in the first element, but does not move the pointer. Next moves the pointer
    to the second element and then returns the value store in it. reset moves back
    to the top of the array and returns the value in the first element. end is the
    reverse of reset, it moves to the last position of the array and returns the value
    in that position.'
