- pgno: 19
  md: 'An array is nothing more than a container of multiple properties. array is
    given a name (such as $customer_records) using the same syntax as a property.
    This one is used for storing and reviewing every value in the array. Since the
    same name is used to access every value in the array, there needs to be a way
    determine where a value is stored or retrieved. This is done by using a subscript.
    In most languages a subscript is a numerical value. However, as we will see later,
    PHP arrays also allow alphabetical subscripts.


    Note: PHP actually has only one type of arrays. This allows numerical or alphabetic.
    The term “Associative Arrays” is used to describe PHP arrays with alphabetic.
    However, all PHP arrays are stored in memory in the same format. We will discuss
    associative arrays a little later.


    We can replace the individual properties (such as $first_name) with the array
    name plus ($customer_records[0]).


