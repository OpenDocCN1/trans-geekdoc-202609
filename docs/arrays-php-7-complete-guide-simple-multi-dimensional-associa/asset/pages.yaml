  md: '# Traversing Arrays


    current — returns the current element in an array


    The current() function simply returns the value of the array element that''s currently
    being pointed to by the internal pointer. It does not move the pointer in any
    way. If the internal pointer points beyond the end of the elements list or the
    array is empty, current() returns FALSE.


    Syntax:


    mixed current ( array &$$array )


    Example:


    $first_array = array(''first_name'' => ''Pete'', ''last_name'' => ''Smith'', ''address''
    => ''123 Main Street'', ''city'' => ''Atlanta'', ''state'' => ''CA'', ''zip_code''
    => 30001;


    print current($first_array) . <br>

    print next($first_array) . <br>

    print prev($first_array) . <br>

    print end($first_array) . <br>


    Output:


    Pete

    Smith

    Pete

    30001


    current works with next, previous, and end to display values located in positions
    in an array. current does not actually move the pointer (position currently accessed)
    in the array. As shown in this example, only the values are displayed not the
    keys (subscripts).


    each — returns the current key and value pair from an array and advance the array
    cursor'
