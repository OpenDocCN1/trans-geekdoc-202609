  md: '# Updating & Inserting


    Actually we have already shown several examples on updating values in

    arrays. Let’s look at another.


    ```

    $customer_record = array (

    array(''Pete'', ''Smith'',''123 Main Street'', ''Atlanta'', ''GA'', 30001),

    array(''Sally'', ''Parisi'',''101 South Street'', ''Atlanta'', ''GA'', 30001)

    );

    declare(strict_types=1);

    function update_array_value(int $subscript, $value) {

    $customer_record[$subscript] = $value;

    }

    ```


    $temp_array = array(''Pete'', ''Smith'',''1234 Main Street'', ''Atlanta'', ''GA'',
    30001);

    update_array_value(0, $temp_array);

    This example totally replaces the Pete value with a Peter array. 0 is passed into

    $subscript and the Peter array is passed into $value when the method is called.

    The method then replaces the contents of position 0 with the values in the

    Peter array. Actually it will also insert the array if the position does not

    currently exist in the array.


    If we just want to change one value in the array, we can make a slight

    adjustment.


    ```

    $customer_record = array (

    array(''Pete'', ''Smith'',''123 Main Street'', ''Atlanta'', ''GA'', 30001),

    array(''Sally'', ''Parisi'',''101 South Street'', ''Atlanta'', ''GA'', 30001)

    );

    declare(strict_types=1);

    function update_array_value(int $first_subscript, int $second_subscript, $value)
    {

    $customer_record[$first_subscript][$second_subscript] = $value;

    }

    update_array_value(0, 0, “Peter”);

    ```'
