    \n“Chunks an array into arrays with size elements. The last chunk may contain\
    \ less than size elements.”\n\nSyntax:\n\n```\narray_chunk ( array $array , int\
    \ $size [, bool $preserve_keys = false )\n```\n\nExample:\n\n```\n$test_array\
    \ = array('Jeff', 'Smith', '123 Main Street', 'Atlanta', 'GA', '30001');\n```\n\
