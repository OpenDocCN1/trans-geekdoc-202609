- pgno: 14
  md: 'values (also called keys values). The property names are determined by the
    values shown in the name attributes of the html form (such as first_name in the
    example above). The values assigned to the properties are retrieved from the information
    entered by the user in the textboxes.


    # Example 1–2 – properties and values sent to process_customer.php


    ```

    first_name = "Fred"

    last_name = "Smith"

    address = "123 Main Street"

    city = "Atlanta"

    state = "GA"

    zip_code = "30001"

    ```


    The properties created by html are very similar to properties used in PHP. This
    allows them to be easily processed within a PHP program. Both PHP and html create
    properties when they are first used. PHP considers the data type of any information
    that is displayed or received from an html web site to be string. Thus, as shown
    in Example 1-2, even though the html form requires the user to enter a number
    for the zip code, the value is actually stored as a string (indicated by the quotes).


    PHP dynamically determines a property’s data type when a value is stored into
    the property. This can have advantages and disadvantages. One advantage is the
    ability for PHP to change the data type of information stored in a property at
    any time.


    ```

    $zip_code = "30001"

    $zip_code = 30001;

    ```


    The first statement above would place the string “30001” into the property $zip_code.
    If the property did not exist before, it would also be created. The second statement
    would change the type of information stored in $zip_code from a string to an integer.


    # Example 1–3 – process_customer.php


    ```

    <?php

    // accepts information from example1.html

    // This is NOT a complete program. The validate methods shown need to be created

    clean any from /input.

    $first_name = validate_first_name($_POST[''first_name'']);

    ```'
