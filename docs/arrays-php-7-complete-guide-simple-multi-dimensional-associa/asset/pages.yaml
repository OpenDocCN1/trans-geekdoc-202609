    the array in the second parameter ($second_array) into the array in the first
    parameter ($first_array). If there is not a related value in the second array
    (there is no last_name or zip_code), it will retain the values from the first
    array. If there are values in the second array that are not in the first array,
    it will add them to the end of the array (lastname, zipcode) produced. This process
    is recursive.


    # array_replace — replaces elements from passed arrays into the first array


    array_replace() replaces the values of array1 with values having the same keys
    in each of the following arrays. If a key from the first array exists in the second
    array, its value will be replaced by the value from the second array. If the key
    exists in the second array, and not the first, it will be created in the first
    array. If a key only exists in the first array, it will be left as is. If several
    arrays are passed for replacement, they will be processed in order, the later
    arrays overwriting the previous values.


    Syntax:


    ```

    array array_replace ( $array1, $array2 [ , $array ... ] )

    ```


    Example:


    ```

    $first_array = array(''first_name'' => ''Pete'', ''last_name'' => ''Smith'', ''address''
