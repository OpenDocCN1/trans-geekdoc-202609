    \ column. Each time flow of the program hits the bottom of the inner loop and\
    \ returns to the top of the inner foreach loop the next column is selected. When\
    \ no more columns exist in the row, the loop ends.\n\nWhen this occurs, the flow\
    \ of the program will also drop to the bottom of the outside loop. This sends\
