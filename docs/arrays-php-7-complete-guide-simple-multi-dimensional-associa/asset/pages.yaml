- pgno: 91
  md: 'In the example, var_dump was used, instead of print_r, to provide a more detailed
    view of the array. We can see that the Customer object is attached at position
    0 of the customer_record array with a first_name (“fred”) and last_name (“smith”).


    There is more we could discover about object arrays. However, the intent is just
    to get your feet wet.


    Why would we use object arrays instead of associative arrays?


    One good example is provided in the gaming industry. In many games, once the user
    has obtained a certain expert level, they are invited to play a bonus round. In
    order to jump to the bonus round all information related to the current level
    the user has obtained must be saved. Everything on the screen (including the aliens)
    are objects. These objects can be temporarily saved to an object array while the
    user plays the bonus round. When the user has completed the round, the objects
    can be retrieved from the array and placed back into their original positions
    on the screen. Each object would include properties to indicate their last location
    to already done to complete this process.


    We are already done discussing Associative and Object Arrays. As we have seen,
    only a few coding changes are need to use associative arrays instead of numerical
    arrays. Associative arrays allow us to create much more readable code syntax.
    We no longer need to try to figure out what $customer_record[0] contains. We can
    see that $customer_record[''first_name''] will hold a first name.


    Let''s try an exercise before the next chapter.'
