    array_replace_recursive — replaces elements from passed arrays into the first
    array recursively


    array_replace_recursive() replaces the values of array1 with the same values from
    all the following arrays. If a key from the first array exists in the second array,
    its value will be replaced by the value from the second array. If the key exists
    in the second array, and not the first, it will be created in the first array.
    If a key only exists in the first array, it will be left as is. If several arrays
    are passed for replacement, they will be processed in order, the later array overwriting
    the previous values.


    Syntax:


    ```

    array array_replace_recursive ( $array1, $array2 [, $array3 ... ] )

    ```


    Example:


    ```

    $first_array = array(''first_name'' => ''Pete'', ''last_name'' => ''Smith'', ''address''
    => ''123

    Main Street'', ''city'' => ''Atlanta'', ''state'' => ''GA'', ''zip_code'' => 30001);

    ```


    ```

    $second_array = array(''first_name'' => ''Sally'', ''last_name'' => ''Parisi'',
    ''address'' =>

    ''101 South Street'', ''city'' => ''Atlanta'', ''state'' => ''GA'', ''zipcode''
    => 30001);

    ```


    ```

    print_r(array_replace_recursive($first_array, $second_array));

    ```


    Output:


    Array (


    ```

    [first_name] => Sally

    ```


    ```

    [last_name] => Smith

    ```


    ```

    [address] => 101 South Street

    ```


    ```

    [city] => Atlanta

    ```'
