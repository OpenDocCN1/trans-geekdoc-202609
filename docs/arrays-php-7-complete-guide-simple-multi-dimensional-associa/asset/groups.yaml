    \ — 对数组进行排序\n\n> “此函数按值进行排序。元素将从低到高对数组进行排序。”\n\n## 语法：\n\n```\nbool sort ( array\
    \ &$array, int $sort_flags = SORT_REGULAR )\n```\n\n## 示例：\n\n```php\n$first_array\
    \ = array('first_name' => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main\
