    \n# 第 6 章 – PHP 函数 – 数组的搜索、遍历和显示\n\n完成本章后，学生将能够...\n\n- 创建一个简单的 PHP 程序来搜索数组中存在的值和/或键\n\
    - 创建一个简单的 PHP 程序，在不使用循环的情况下遍历数组的每一个元素\n- 创建一个简单的 PHP 程序，根据过滤器显示数组的内容\n\n在最后一个章节中，我们将简要介绍用于搜索、遍历和显示数组的\
    \ PHP 函数。这些函数中的许多适用于多种数组类型（单维、多维和/或关联数组）。\n\n以下所有函数的描述均由可在 www.php.net 访问的 PHP\
    \ 手册提供。我们还提供了使用每个函数的简短示例以及这些示例结果的描述。这些示例仅用于让您初步接触。如需获取所显示函数的更详细描述以及更多更多示例，请访问在线\
    \ PHP 手册。\n\n# 搜索数组\n\narray_count_values — 统计数组中所有值的次数\n\n“返回一个数组，数组的值作为键，它们在数组中的频率作为值。”\n\
    \n语法：\n\n```\narray array_count_values ( array $array )\n```\n\n示例：\n\n```php\n\
    $silly_array = array(\"hey\", \"hey\", \"hey\", \"what\", \"is\", \"this\", \"\
    unsure\", \"unset\");\nprint_r(array_count_values($silly_array));\n```\n\n输出：\n\
    \nArray\n\n```\n(\n[hey] => 3\n[what] => 1\n[is] => 1\n[this] => 1\n[unsure] =>\
    \ 2\n)\n```\n\n此示例统计了 $silly_array 中值的频率。它创建了一个以值作为索引、频率作为值的数组。\n\narray_column\
    \ - 返回输入数组中单列的值。\n\n“array_column() 返回输入中由 column_key 标识的单列的值。可选，可以提供 index_key，以便通过输入中\
