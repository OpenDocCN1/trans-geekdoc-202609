    print_r($customer_record);\nArray (\n[0] => Pete\n[2] => 123 Main Street\n[3]\
    \ => Atlanta\n[4] => GA\n[5] => 3001)\n```\n\n在 ` ` 之前，我们已经展示了多个通过 `array_push`\
    \ 在数组末尾值的示例。让我们看看另一个方法。\n\n示例 1-9 insert.php\n\n```php\n$customer_record = array('Pete','123\
    \ Main Street', 'Atlanta','GA',3001);\n```\n\n在示例 1-9 中，`array_push` 函数被用于在数组末尾添加值。因此，这实际上是向数组中插入值。\n\
    \n示例 1-10 update.php\n\n```php\n$customer_record = array('Pete','123 Main Street',\
    \ 'Atlanta','GA',3001);\n```\n\n在示例 1-10 中，通过传递下标和值来更新了数组。让我们看看一个结合了这些想法的方法。\n\
