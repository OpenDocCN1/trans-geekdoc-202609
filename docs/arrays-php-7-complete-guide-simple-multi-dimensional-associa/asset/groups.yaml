    $customer_record[] = validate_state($POST['state']);\n$customer_record[] = validate_zip_code($POST['zip_code']);\n\
    print \"Your name is $customer_record[0]\";\nprint \"\\nYou live at $customer_record[2],\
    \ $customer_record[3],\n$customer_record[4], $customer_record[5];\";\n?>\n```\n\
    \n然而，我们仍然需要理解，当每个值被放入数组时，数组下标将自动分配一个数字（从 0 开始）。示例 1-4 和示例 1-5 实际上产生了相同的数组。请注意，在示例\
    \ 1-5 中，为了检索数组中的单个值，我们仍然需要意识到下标的存在。可以使用 `foreach` 循环提取所有值，而无需知道下标（正如我们很快将看到的）。我们还可以像下面所示使用\
    \ PHP 函数 `print_r` 来快速查看数组的所有内容。\n\n# PHP 数组相比其他语言的数组具有多个优势。\n\n```php\n$customer_record[0]\
    \ = validate_first_name($POST['first_name']);\n$customer_record[2] = validate_last_name($POST['last_name']);\n\
    ```\n\n在 Java 这样的语言中，如果数组中的某个位置没有赋予初始值，该位置将持有一个 `null` 值。`null` 值是零，且它是空的。如果 Java\
    \ 程序尝试对数组中未赋值的值进行计算，程序将产生错误，指示该位置上有一个 `null` 值。如果一个 PHP 数组中跳过了某个位置，该位置仅仅是不存在。\n\
    \nprint_r($customer_record);\nArray ( [0] => Fred [2] => Smith [3] => 123 Main\
    \ Street [4] => Atlanta [5] => GA [6] => 30001 )\n\n从对填充的 $customer_record 数组执行\
    \ `print_r` 的结果可以看出，数组中不存在位置 1。\n\n你可能会想这是否会在从数组中检索值时引起任何问题。\n\n记住在 PHP 中创建动态数组时，我们可能不知道数组中有多少个位置。你可能被教过或看到过用于数组的\
    \ `for` 循环。`for` 循环不是检索 PHP 数组值的最佳选择。\n\n**`foreach` 循环是一个更好的选择。** 该循环将自动只检索数组中存在的位置（它将跳过上述示例中的位置\
    \ 1），并自动检索数组的所有位置。\n\n```php\nforeach($customer_record as $value)\n{\n  print\
    \ $value;\n}\n```\n\n$customer_record 是数组的名称，`as` 是一个必须的关键字。$value 代表该方法当前正在访问的位置中存在的值。程序员可以为\
    \ $value 分配任何名称。它是一个临时属性，用于保存数组中当前位置的值。\n\n如果我们使用这个循环来打印上数组中的值，循环将从位置 0 开始并打印第一个位置的内容（Fred）。循环将移动到数组中的下一个位置，即位置\
    \ 2（没有位置 1）。它将打印该位置的内容（Smith），并持续到数组中的所有位置都打印完毕。\n\nFred 123 Main Street Atlanta\
    \ GA 30001\n\n**`foreach` 循环使得从 PHP 数组中检索值变得简单。** 该循环将消除任何尝试从数组中不存在的位置检索值的可能性，并将消除超出数组末尾（大小）的可能性。数组的大小和位置可以随时改变，而这个小小的\
    \ `foreach` 循环仍然能够正常工作。\n\n你还会发现，有许多 PHP 函数可以在读取、检索或更新数组中的值时，消除使用循环的需要。\n\n# 定义数组的其他方法\n\
    \n在 PHP 中，如果你知道数组的初始值，可以使用类似于其他语言的结构创建。\n$customer_record = array('Fred', 'Smith',\
    \ '123 Main Street', 'Atlanta', 'GA', '30001');\nprint_r($customer_record);\n\n\
    Array ( [0] => Fred [1] => Smith [2] => 123 Main Street [3] => Atlanta [4] =>\
    \ GA [5] => 30001 )\n\n在这个示例中，我们最初创建了一个具有特定数量（6个）元素初始值的数组。PHP 与其他语言一样，会自动为每个位置的下标编号，从零开始。由于\
    \ PHP 以相同的格式存储所有数组，我们可以使用讨论过的技术更改此数组中的值。\n\nprint_r($customer_record);\nArray\
    \ ( [0] => Pete [1] => Smith [2] => 123 Main Street [3] => Atlanta [4] => GA [5]\
    \ => 30001 )\n\n你可以看到，Fred 被 Pete 取代，向正确的位置传递了新值。\n\n如果我们尝试在一个不存在的位置放置一个值会发生什么？\n\
    $customer_record[6] = '777777';\nprint_r($customer_record);\n\nArray ( [0] =>\
    \ Pete [1] => Smith [2] => 123 Main Street [3] => Atlanta [4] => GA [5] => 30001\
    \ [6] => 777777 )\n\n正如你所看到的，数组会创建一个新位置并将值放在该位置。PHP 数组会自动在末尾添加值，如果位置不存在。这在其他语言中不是真的。许多语言会指示你越界（超过了数组的大小）。在上面使用的格式中，PHP\
    \ 数组包含了与之前数组完全相同的信息和位置。如果我们向该位置加载一个数字而不是字符串会发生什么？\n$customer_record[5] = 30001;\n\
    \nprint_r($customer_record);\n\nArray ( [0] => Pete [1] => Smith [2] => 123 Main\
    \ Street [3] => Atlanta [4] => GA [5] => 30001 )\n\n`print_r` 语句的输出会产生数据类型的差异。然而，我们可以首先将数组转换为\
    \ JSON 格式（使用 `json_encode` 方法），然后显示结果。我们还可以使用 PHP `var_dump` 方法。我们将在后面的章节中使用这种方法。\n\
    \n$json = json_encode($customer_record);\n\nprint_r($json);\n\n[\"Pete\",\"Smith\"\
    ,\"123 Main Street\",\"Atlanta\",\"GA\",30001]\n\nJSON 格式让你看到邮政的数据类型从字符串值（'30001'）变为了数值（30001）。即使邮政编码已经作为字符串存在，当我们将其替换为数值时，该数字（而不是字符串）现在存在于数组中。\n\
    \nHTML 数组\n\n现在我们对 PHP 数组如何工作有了大致了解，我们可以在 HTML 表单中使用此概念，并发现可以轻松将数组传递给我们的 PHP 程序。\n\
