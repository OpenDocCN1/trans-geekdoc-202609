    什么是数组？为什么我们需要它们？每当程序使用信息时，该信息必须存储在计算机内存中。可以通过创建属性来存储个人信息。


    ```

    $propertyName = value;

    ```


    使用 $ 声明属性。PHP 属性名以小写字母开头。如果程序员想对名称使用多个单词，可以使用驼峰格式并通过特殊字符（如 _）分隔单词。


    ```

    $firstName = "";

    ```


    ```

    $first_Name = "";

    ```


    ```

    $first_name = "";

    ```


    属性名应该具有意义，以便您的程序更具可读性。


    ```

    $a = "";

    ```


    ```

