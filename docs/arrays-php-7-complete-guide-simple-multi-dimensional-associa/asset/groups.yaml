    \ — 检查给定的键或索引是否存在于数组中\n\narray_key_exists() 如果给定的键在数组中已设置，则返回 TRUE。键可以是数组索引的任何可能值。\n\
    \n语法：\n\n```\nbool array_key_exists ( mixed $key , array $array )\n```\n\n示例：\n\
