    \nrsort($first_array);\nprint_r($first_array);\n```\n\n## 输出：\n\n```\nArray (\n\
    [0] => 30001\n[1] => Smith\n[2] => Pete\n[3] => CA\n[4] => Atlanta\n[5] => 123\
    \ Main Street\n)\n```\n\nrsort 按反序对数组中的值。它不保留原始数组的键（下标）。\n\n## shuffle — 打乱数组顺序\n\
    \n“此函数打乱数组中元素的顺序。”\n\n## 语法：\n\n```\nbool shuffle ( array &$array )\n```\n\n##\
