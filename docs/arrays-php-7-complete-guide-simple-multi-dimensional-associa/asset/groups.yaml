    In PHP 7, the try/catch blocks are used to capture Exceptions and Errors. Exceptions
    are ‘user’ exceptions that may be raised by the program. For example, a validation
    method (such as validate_zip_code determines if the zip code information received
    from the html form is in the proper format. If the information is not valid, the
    method can raise an exception for the calling program to handle. If this occurred
    the flow of the code would jump to a catch handling exceptions (if there is one).


    In Example 2-5, $e holds the Exception object. The object includes a getMessage
    method which holds the actual error message produced. The print statement would
    display the error message. User Exceptions are not usually considered to be fatal.
    They should be handled by the program and execution of the program should continue,
    if possible.


    Errors are produced by the PHP environment. An error could be produced if the
    file accessed does not exist. Errors also be produced if there are syntax errors
    in the program code. In PHP 7, Errors can be handled in a similar fashion as Exceptions.
    In this example, any error is caught by the catch block for errors. The Error
    object also include a getMessage method to display the error message. Unlike Exceptions,
    Errors are considered to be fatal. The program should be shut down when errors
    occur.


    The use of both catch blocks in the example, will ensure that we capture all possible
    problems with executing this program and display the messages related to the problems
    that might occur.


