    The answer lies in how the information is stored in memory. The operating system
    stores two dimensional arrays by row. The rows are kept intact because everything
    in a row is related (all of *Pete Smith’s* information). The row information is
    placed in memory locations that are contiguous to each other (next to each other).
    Other rows are not necessarily stored in memory next to previous rows. This allow
    the operating system to be efficient with memory storage.


