    ```

    $customer_record[] = new Customer("customer_record");

    ```


    The customer_record html array is pulled from the customer array which was populated
    by values entered by the user in the html form. A Customer object was created.
    The customer_record array is passed into the constructor of the Customer object.


    ```

    function __construct($value)

    ```


    The constructor renames the array as $value.


    ```

    set_first_name($value[0]);

    set_last_name($value[1]);

    set_address($value[2]);

    set_city($value[3]);

    set_state($value[4]);

    set_zip_code($value[5]);

    ```


    The values in each position of the $value array are then passed into set methods
    to populate the new Customer object properties. Finally the Customer object is
    attached to the PHP $customer_record array at position 0 (or the next available
    position).


    All of this action takes place because of the one line!


    ```

    array(1)

    [0=>object(Customer)#1 (6)

    ["first_name":"Customer":private

    ```'
