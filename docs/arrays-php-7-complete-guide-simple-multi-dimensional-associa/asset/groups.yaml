    \n语法：\n\n```\nbool in_array ( mixed $needle, array $haystack [, bool $strict =\
    \ false )\n```\n\n示例：\n\n```php\n$customer_record = array (\narray('first_name'\
    \ => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main Street', 'city' =>\
