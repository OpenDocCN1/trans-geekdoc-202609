  mdcn: "\n\n有些学生在学习关联数组（Associative Arrays）时会迷困。然而，没有理由恐慌。你已经在本书的每一个示例中见过它们了！！\n\n\
    ## 这是什么？\n\n是的，请记住，第一章提到过 PHP 中的所有数组都是相同的。所有的数组都是关联数组。我们之前讨论的内容与现在内容的唯一区别在于下标中的内容。回想一下\n\
    \n### 示例 1-4:\n\n### 示例 1–4 – process_customer_record.php\n\n```php\n<?php\n//\
    \ 接收来自 example1.html 的信息\n// 这不是一个完整的程序。需要创建 validate 方法以清理任何 // 输入\n$customer_record[0]\
    \ = validate_first_name($_POST['first_name']);\n$customer_record[1] = validate_last_name($_POST['last_name']);\n\
    $customer_record[2] = validate_address($_POST['address']);\n$customer_record[3]\
    \ = validate_city($_POST['city']);\n$customer_record[4] = validate_state($_POST['state']);\n\
    $customer_record[5] = validate_zip_code($_POST['zip_code']);\nprint \"Your name\
    \ is $customer_record[0] $customer_record[1].\nYou live at $customer_record[2],\
    \ $customer_record[3],\n$customer_record[4], $customer_record[5]\";\n?>\n```\n\
    \n这个示例中的下标是 0, 1, 2, 3, 4, 和 5。这并不具有描述性。相反，我们可以使用单词。\n\n### 示例 3-1\n\n```php\n\
    <?php\n// 接收来自 example1.html 的信息\n// 这不是一个完整的程序。需要创建 validate 方法以清理任何 // 输入\n\
    $customer_record[\"first_name\"] = validate_first_name($_POST['first_name']);\n\
    $customer_record[\"last_name\"] = validate_last_name($_POST['last_name']);\n$customer_record[\"\
    address\"] = validate_address($_POST['address']);\n```\n\n```php\n$customer_record[\"\
    city\"] = validate_city($_POST['city']);\n$customer_record[\"state\"] = validate_state($_POST['state']);\n\
    $customer_record[\"zip_code\"] = validate_zip_code($_POST['zip_code']);\nprint\
    \ \"Your name is \" . $customer_record[\"first_name\"] . \". You live at \" .\
    \ $customer_record[\"address\"] . \", \" . $customer_record[\"city\"] . \", \"\
    \ . $customer_record[\"state\"] . \", \" . $customer_record[\"zip_code\"];\n?>\n\
    ```\n\n如果我们将每个数字下标替换为更具意义的字母下标，我们发现 \"first_name\" 值是通过 `$_POST` 从 html 表单接收的。属性中的值在名为\
    \ `first_name` 的位置进行验证。所有其他检索到的数据也发生类似的过程。注意：注意 `print` 语句在下标周围使用了单引号（'first_name'）而不是双引号。你不能在双引号内部嵌入双引号（包含要打印字符串的双引号内）。在许多情况下（并非所有情况），你可以使用单引号代替。让我们来看另一个示例。\n\
    \n### 示例 2-4 - process_customer_array_twodim_saved.php\n\n```php\n<?php\n$customer_file\
    \ = file_get_contents(\"customer_data.json\");\n$customer_record = json_decode($customer_file,\
    \ TRUE);\n$customer = filter_input_array($_POST);\n$customer_info = validate_array($customer_record);\n\
    array_push($customer_record, $customer_info);\nprint_r($customer_record);\nfile_put_contents(\"\
    customer_data.json\", json_encode($customer_record));\n?>\n```\n\n在示例 2-4 中，从文件中检索了一个二维数组，追加了来自\
    \ html 表单的信息并保存到原始文件中。该数组使用了数字下标。我们只需要更改一行来处理存在于 `customer_data.json` 中的关联数组。\n\
    \n### 示例 3-2 - process_customer_associate_array_twodim_saved.php\n\n```php\n<?php\n\
    $customer_file = file_get_contents(\"customer_data.json\");\n$customer_record\
    \ = json_decode($customer_file, TRUE);\n$customer = filter_input_array($_POST);\n\
    list(\n    $customer_info['first_name'], $customer_info['last_name'],\n    $customer_info['address'],\
    \ $customer_info['city'],\n    $customer_info['state'], $customer_info['zip_code']\n\
    ) = validate_array($customer_record);\narray_push($customer_record, $customer_info);\n\
    print_r($customer_record);\nfile_put_contents(\"customer_data.json\", json_encode($customer_record));\n\
    ?>\n```\n\nPHP `list` 是一个语言结构，可用于同时为多个属性（变量）赋值。在 PHP 7 之前，值实际上是以反向赋值的。PHP 7 按照呈现的顺序进行赋值。由于我们对下标使用了真实的字母值而不是数值，因此顺序并不重要。\n\
    \n```php\nlist(\n$customer_info['first_name'], $customer_info['last_name'],\n\
    $customer_info['address'], $customer_info['city'],\n$customer_info['zip_code']\n\
    ) = validate_array($customer_record);\n```\n\n这部分示例代码以任何顺序都可以工作。来自 `$customer_record`\
    \ 数组中位置 0 的值（来自 html 表单）将被放置在 `$customer_info['first_name']` 中。位置 1 的值将放置在 `$customer_info['last_name']`\
    \ 中。该过程将根据 `$customer_record` 数组中的位置数量继续。\n\n`list` 语句中的属性数量应与数组中的位置数量相同。此示例应该包含之前的\
    \ `try/catch` 块，以便在数组中的位置少于预期时捕捉错误。`try/catch` 块还将处理文件本身可能任何问题。\n\nArray (\n[0]\
    \ =>\n  Array ([first_name] => default [last_name] => default [address] => default\
    \ [city] => default [state] => default [zip_code] => 10001)\n[1] =>\n  Array ([zip_code]\
    \ => 11111 [state] => af [city] => ad [address] => aq [last_name] => as [first_name]\
    \ => aa)\n)\n\n通过使用关联数组，我们不需要担心值保存的顺序。在示例中，两个数组是反序保存的。然而，我们通过字母下标访问值，而不是位置。`print\
    \ $customer_record[0]['first_name']` 将显示该位置（default），无论它实际上位于数组的什么位置。\n\n让我们查看在\
    \ MySQL 数据库中检索和保存所需的更改。\n\n### 示例 3–3 – process_customer_associate_array_twodim_mysql.php\n\
    \n```php\n<?php\ntry\n{\n$mysqli = new mysqli(\"localhost\", \"userid\", \"password\"\
    , \"database\");\n$query = \"SELECT * FROM customers\";\n$result = $mysqli->query($query);\n\
    $customer_record = $result->fetch_all(MYSQLI_ASSOC);\n$customer = filter_input_array($_POST);\n\
    $customer_info = validate_array($customer['customer_record']);\narray_push($customer_record,\
    \ $customer_info);\nprint_r($customer_record);\n$query = \"INSERT INTO customers\
    \ (first_name, last_name, address, city, state, zip_code) VALUES ('\";\n$query\
    \ .= $customer_info['first_name'] . \"', '\" . $customer_info['last_name'] . \"\
    ', '\" . $customer_info['address'] . \"', '\" . $customer_info['city'] . \"',\
    \ '\" . $customer_info['state'] . \"', '\" . $customer_info['zip_code'] . \"')\"\
    ;\n$mysqli->query($query);\n$mysqli->close();\n}\ncatch(Exception $e)\n{\n   \
    \ echo \"Error: \" . $e->getMessage();\n}\n```\n\n当用 MySQL 处理关联数组时，所需的更改非常少。\n\
    \n"
