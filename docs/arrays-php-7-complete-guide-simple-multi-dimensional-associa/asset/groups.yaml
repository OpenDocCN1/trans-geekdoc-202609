  mdcn: "\n\n```html\n<input type='submit'\nvalue=\"Click to submit your information\"\
    \ />\n</form>\n</body>\n</html>\n```\n\n在示例 1-5 中，每个 html 命名元素都被替换为 `customer_record`\
    \ 数组中的一个位置。这个 html 数组是动态创建的，就像 PHP 数组一样。第一个文本框中的值（将是客户的名字）现在被放置于 `customer_record[0]`。\n\
    \n该 html 表单现在可以通过 `post` 方法将此数组传递给 PHP 程序，无需任何其他更改。\n\n示例 1-7 – process_customer_array.php\n\
    \n```php\n<?php\n$customer = filter_input_array(INPUT_POST);\n$customer_record\
    \ = validate_array($customer[\"customer_record\"]);\nprint \"Your name is $customer_record[0]\
    \ $customer_record[1].\";\nprint \"You live at $customer_record[2], $customer_record[3],\
    \ $customer_record[4], $customer_record[5];\";\n?>\n```\n\n正如从示例 1-7 中所示，我们实际上可以使用更少的代码将\
    \ html 数组拉入程序中。程序包含一个 PHP `filter_input_array` 方法，它拉取由 html 表单创建的完整数组。它还过滤掉任何有害数据，例如\
    \ html 符号 `<>`。\n\n注意：`filter_input_array` 方法不会验证字段是否具有正确的信息，例如 `first_name` 字段中应少于等于\
    \ 15 个字母字符（现在称为 `customer_record[0]`）。可以创建一个 `validate_array` 方法来接收数组并将单个值传递给正确的验证程序。\n\
    \n```php\nfunction validate_array($input_array)\n{\n$value = validate_first_name($input_array[0]);\n\
    $value = validate_last_name($input_array[1]);\n$value = validate_address($input_array[2]);\n\
    $value = validate_city($input_array[3]);\n$value = validate_state($input_array[4]);\n\
    $value = validate_zip_code($input_array[5]);\nreturn $input_array;\n}\n```\n\n\
    假设每个 validate 方法在出现问题时都会抛出异常，那么如果流到达方法的末尾，该方法就可以假设每个字段都经过了验证。该方法返回传递的数组，以便将数组放置在\
    \ `$customer_record` 中。`$value` 包含了返回的单个值。然而，它的存在仅仅是为了允许 validate 方法像之前显示的那样包含一个返回语句。当然，我们可以移除返回语句，这样就不需要\
    \ `$value` 了。\n\n在示例 1-7 中，`$customer_record = validate_array($customer[\"customer_record\"\
    ])` 搜索名为 `$customer_record` 的数组，并在调用 `validate_array` 之后将该数组放入 PHP 程序的 `$customer_record`\
    \ 中。这实际上将 `$customer_record` 变成了一个包含从表单文本框传递的值的数组。现在不再需要通过额外的代码来填充 `$customer_record`\
    \ 中的单个位置了。这一切仅通过一行代码就完成了！\n\n# 删除\n\nArray (\n[0] => Fred\n[1] => Smith\n[2] =>\
    \ 123 Main Street\n[3] => Atlanta\n[4] => GA\n[5] => 3001)\n\n逻辑将会解释说明创建一个循环来删除数组中间某个值的必要性。如果我们删除第二个值（`[1]`），书本将解释说被删除值之后的每个值都需要重新定位到上方，以填补被删除的值。这通常是必要的，以避免任何\
    \ NULL 值。Array\n[0] => Fred\n[1] => Smith\n[2] => 123 Main Street\n[3] => Atlanta\n\
    [4] => GA\n[5] => 3001)\n\n循环将更新数组为类似于上面示例的内容。在 PHP 中，这是没必要的。正如之前解释的那样，数组在处理缺失订阅者时运行良好。`foreach`\
    \ 循环会自动跳过缺失的订阅者。因此，我们可以通过创建一个简单的函数来从数组中删除任何下标。\n\n示例 1-8_deletes.php\n\n```php\n\
    $customer_record = array('Pete','123 Main Street', 'Atlanta','GA',3001);\ndeclare(strict_types=1);\n\
