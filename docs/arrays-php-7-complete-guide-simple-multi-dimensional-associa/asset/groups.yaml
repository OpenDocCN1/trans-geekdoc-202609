    \ => 30001\n)\n\narray_intersect — 返回第一个数组中存在于所有数组中的值\n\n“array_intersect() 返回一个包含存在于所有输入数组中的第一个数组元素的数组。使用字符串进行比较，整数和浮点数将转换为字符串。”\n\
    \n语法：\n\n```\narray array_intersect ( array $array, array ...$arrays )\n```\n\n\
