    \n输出：\n\nArray\n\n```\n(\n[0] => Pete\n[1] => Sally\n)\n```\n\n在此示例中，返回了 customer_array\
    \ 中所有的名字（first names）。\n\n在 PHP 7 中，你可以在第二个参数中指定索引。\n\n示例：\n\n```php\n$customer_record\
