    # Chapter 4 – PHP Functions – Changing, Splitting, Slicing, and Sorting Arrays


    After completing this chapter, the student will be able to...

    Create a simple PHP program which changes the contents of an existing array

    Create a simple PHP program which splits an array based on a value or comparison

    Create a simple PHP program which slices an array based on a value or comparison

    Create a simple PHP program which sorts an array based on a value, comparison,
    or key


    In this chapter we will take a brief look at the PHP functions that are available
    to change, split, slice, and sort arrays. Many of these functions work with multiple
    array types (single, multi-dimensional, and/or associative).

