    [last_name] => Smith\n[address] => 123 Main Street\n[city] => Atlanta\n[state]\
    \ => GA\n)\n\narray_shift — 移除数组的第一个元素\n\n“array_shift() 移除数组的第一个元素并返回它，重新索引剩余的元素。”\n\
    \n语法：\n\n```\nmixed array_shift ( array &$array )\n```\n\n示例：\n\n```php\n$first_array\
    \ = array('first_name' => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main\
