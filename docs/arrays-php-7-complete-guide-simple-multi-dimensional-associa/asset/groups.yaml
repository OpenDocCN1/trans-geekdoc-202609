    \ first name is Pete. The last name is Smith. The address is 123 Main Street.\
    \ The city is Atlanta. The state is CA. The zip is 30001.\n\n此函数适用于关联数组。使用数组中的键创建变量（属性）。数组中的值被放置在属性中。在此示例中，使用\
    \ extract 函数创建了六个属性。\n\n### sizeof — count 的别名\n\n语法:\n```php\nint sizeof ( mixed\
    \ $array_or_countable [, int $mode = COUNT_NORMAL )\n```\n\n示例:\n\n```php\n$first_array\
    \ = array('Pete','Smith','123 Main Street','Atlanta','CA', 30001);\n\n$count =\
