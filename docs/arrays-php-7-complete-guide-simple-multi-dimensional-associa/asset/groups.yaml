    A lot happens in Example 2-4. The PHP method file_get_contents will dump all contents
    of the file into the property provided. The contents of the file $customer_data.json
    are placed into the property $customer_file (which makes it array).


    In this statement the contents of $customer_file are converted from JSON format
    to PHP array using the PHP function json_decode. The file itself contains JSON
    data. The array is placed into the property $customer_record. This automatically
    turns $customer_record into a two-dimensional array (assuming that the information
    in the file is formatted correctly).'
