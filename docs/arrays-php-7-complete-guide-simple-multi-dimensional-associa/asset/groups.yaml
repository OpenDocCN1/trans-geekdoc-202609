    \ (lastname, zipcode) produced. This process is not recursive.\n\n# Exercises\n\
    \n- 1. Create a PHP program which contains an array of cities with a population\
    \ of greater than 100,000 residents in Georgia. Include a section array which\
    \ contains cities with a population of greater than 100,000 residents in Florida.\
    \ Using one of the PHP functions shown in this chapter, compare the arrays and\
    \ display the common elements.\n\n- 2. Using the arrays from #1, use one of the\
    \ functions shown in this chapter to merge the arrays without any duplications\
    \ existing in the new array.\n\n# Chapter 6 – PHP Functions – Searching, Traversing,\
    \ and Displaying Arrays\n\nAfter completing this chapter, the student will be\
    \ able to...\n\n- Create a simple PHP program to search an array for an existing\
    \ value and/or key\n- Create a simple PHP program which will traverse through\
    \ every element of an array without using a loop\n- Create a simple PHP program\
    \ which will display contents of an array based on a filter\n\nIn this final chapter\
    \ we will take a brief look at the PHP functions to search, traverse, and display\
    \ arrays. Many of these functions work with multiple array types (single, multi-dimensional,\
    \ and/or associative).\n\nAll descriptions of the following functions are provided\
    \ by the on-line PHP manual available at www.php.net. Brief examples using each\
    \ function and a description of the results of these examples are provided. These\
    \ examples are only meant to get your feet wet. For a more detailed description\
    \ of the functions shown, and for more examples, visit the on-line PHP manual.\n\
    \n# Searching Arrays\n\narray_count_values — counts all the values of an array\n\
    \n“Returns an array using the values of array as keys and their frequency in array\
    \ as values.”\n\nSyntax:\n\n```\narray array_count_values ( array $array )\n```\n\
    \nExample:\n\n```php\n$silly_array = array(\"hey\", \"hey\", \"hey\", \"what\"\
    , \"is\", \"this\", \"unsure\", \"unset\");\nprint_r(array_count_values($silly_array));\n\
    ```\n\nOutput:\n\nArray\n\n```\n(\n[hey] => 3\n[what] => 1\n[is] => 1\n[this]\
    \ => 1\n[unsure] => 2\n)\n```\n\nThis example counts the frequency of the values\
    \ in $silly_array. It creates an array that uses the value as an index and the\
    \ frequency as the value.\n\narray_column - returns the values from a single column\
    \ in the input array.\n\n“array_column() returns the values from a single column\
    \ of the input, identified by the column_key. Optionally, an index_key may be\
    \ provided to index the values in the returned array by the values from the index_key\
    \ column of the input.”\n\nSyntax:\n\n```\narray array_column ( array $input,\
    \ mixed $column_key [ , mixed $index_key = null ] )\n```\n\nExample:\n\n```php\n\
    $customer_record = array (\narray('first_name' => 'Pete', 'last_name' => 'Smith',\
    \ 'address' => '123 Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code'\
    \ => 30001),\narray('first_name' => 'Sally', 'last_name' => 'Parisi', 'address'\
    \ => '101 South Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    \n$first_names = array_column($customer_record, 'first_name');\nprint_r($first_names);\n\
    ```\n\nOutput:\n\nArray\n\n```\n(\n[0] => Pete\n[1] => Sally\n)\n```\n\nIn this\
    \ example, all first names in the customer_array are returned.\n\nIn PHP 7 you\
    \ can also specify an index in the second parameter.\n\nExample:\n\n```php\n$customer_record\
    \ = array (\narray('first_name' => 'Pete', 'last_name' => 'Smith', 'address' =>\
    \ '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001),\n\
    array('first_name' => 'Sally', 'last_name' => 'Parisi', 'address' => '101 South\
    \ Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001)\n);\n```\n\
    \n```php\n$first_names = array_column($customer_record, 'first_name', 'last_name');\n\
    print_r($first_names);\n```\n\nOutput:\n\nArray\n\n```\n(\n[Smith] => Pete\n[Parisi]\
    \ => Sally\n)\n```\n\nIn this example, the values in last_name, are used to populate\
    \ the new keys (subscripts) which are returned from the function.\n\narray_key_exists\
    \ — checks if the given key or index exists in the array\n\narray_key_exists()\
    \ returns TRUE if the given key is set in the array. key can be any value possible\
    \ for an array index.\n\nSyntax:\n\n```\nbool array_key_exists ( mixed $key ,\
    \ array $array )\n```\n\nExample:\n\n```php\n$first_array = array('first_name'\
    \ => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main Street', 'city' =>\
    \ 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n```\n\n```php\nif (array_key_exists('first_name',\
    \ $first_array)) {\n    print \"The 'first_name' is in the array\";\n}\n```\n\n\
    Output:\n\nThe 'first_name' is in the array\n\narray_keys — returns the keys of\
    \ a subset of the array\n\n\"array_keys() returns the keys, numeric and string,\
    \ from the array.\"\n\nSyntax:\n\n```\narray array_keys ( array $array [, mixed\
    \ $search = null ] [, bool $recursive = false ] )\n```\n\nExample:\n\n```php\n\
    $customer_record = array (\narray('first_name' => 'Pete', 'last_name' => 'Smith',\
    \ 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code'\
    \ => 30001),\narray('first_name' => 'Sally', 'last_name' => 'Parisi', 'address'\
    \ => '101 South Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001)\n\
    );\n\nprint_r(array_keys($customer_record));\n```\n\nOutput:\n\nArray\n\n```\n\
    [0] => first_name\n[1] => last_name\n[2] => address\n[3] => city\n[4] => state\n\
    [5] => zip_code\n[6] => first_name\n[7] => last_name\n[8] => address\n[9] => city\n\
    [10] => state\n[11] => zip_code\n)\n```\n\narray_search — searches the array for\
    \ a value and returns the corresponding key\n\n“array_search() returns the key\
    \ if needle is found in the array, FALSE otherwise.”\n\nSyntax:\n\n```\nmixed\
    \ array_search ( mixed $needle, array $haystack [, bool $strict = false ] )\n\
    ```\n\nExample:\n\n```php\n$customer_record = array (\narray('first_name' => 'Pete',\
    \ 'last_name' => 'Smith', 'address' => '123 Main Street', 'city' => 'Atlanta',\
    \ 'state' => 'GA', 'zip_code' => 30001),\narray('first_name' => 'Sally', 'last_name'\
    \ => 'Parisi', 'address' => '101 South Street', 'city' => 'Atlanta', 'state' =>\
    \ 'GA', 'zip_code' => 30001)\n);\n\nprint array_search('123 Main Street', $customer_record);\n\
    ```\n\nOutput:\n\n2\n\narray_search returns the key if the value is in the array.\
    \ It does not return the position of the item in the array.\n\nin_array — checks\
    \ if a value exists in an array\n\n“Returns TRUE if needle is found in the array,\
    \ FALSE otherwise.”\n\nSyntax:\n\n```\nbool in_array ( mixed $needle, array $haystack\
    \ [, bool $strict = false ] )\n```\n\nExample:\n\n```php\n$customer_record = array\
    \ (\narray('first_name' => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main\
    \ Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001),\narray('first_name'\
    \ => 'Sally', 'last_name' => 'Parisi', 'address' => '101 South Street', 'city'\
    \ => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001)\n);\n\nif(in_array(\"Pete\"\
    , $customer_record)) {\n    print \"Found Pete!\";\n} else {\n    print \"Not\
    \ found!\";\n}\n```\n\nOutput:\n\nFound Pete!\n\nin_array returns TRUE if the\
    \ value is in the array. It does not return the position of the item in the array.\n\
    \narray_merge — merges one or more arrays\n\n“array_merge() merges elements of\
    \ one or more arrays. If the input arrays have the same string keys, the later\
    \ value will overwrite the previous.”\n\nSyntax:\n\n```\narray array_merge ( array\
    \ $array1, array ...$arrays )\n```\n\nExample:\n\n```php\n$first_array = array('first_name'\
    \ => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main Street', 'city' =>\
    \ 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n$second_array = array('lastname'\
    \ => 'Parisi', 'zipcode' => 30001);\n\nprint_r(array_merge($first_array, $second_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[first_name] => Pete\n[last_name] => Smith\n[address]\
    \ => 123 Main Street\n[city] => Atlanta\n[state] => GA\n[zip_code] => 30001\n\
    [lastname] => Parisi\n[zipcode] => 30001\n)\nComparing $first_array with $second_array,\
    \ the last name and zip code indexes are different. This function will attempt\
    \ to substitute the values contained in the array in the second parameter ($second_array)\
    \ into the array in the first parameter ($first_array). If there is not a related\
    \ value in the second array (there is no last_name or zip_code), it will retain\
    \ the values from the first array. If there are values in the second array that\
    \ are not in the first array, it will add them to the end of the array (lastname,\
    \ zipcode) produced. This process is not recursive.\n\narray_diff — returns values\
    \ from the first array that are not present in the others\n\n“array_diff() returns\
    \ an array containing the the entries from $array that are not present in any\
    \ of the other arrays. Comparison is done using strings, so integers and floats\
    \ will be cast to strings before comparison.”\n\nSyntax:\n\n```\narray array_diff\
    \ ( array $array, array ...$arrays )\n```\n\nExample:\n\n```php\n$first_array\
    \ = array('first_name' => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main\
    \ Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n$second_array\
    \ = array('first_name' => 'Sally', 'last_name' => 'Parisi', 'address' => '101\
    \ South Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    \nprint_r(array_diff($first_array, $second_array));\n```\n\nOutput:\n\nArray\n\
    (\n[address] => 123 Main Street\n[zip_code] => 30001\n)\n\narray_intersect — returns\
    \ values from the first array that are present in all the others\n\n“array_intersect()\
    \ returns an array containing all the entries from the first array that are present\
    \ in all the other input arrays. Comparison is done using strings, so integers\
    \ and floats will be cast to strings before comparison.”\n\nSyntax:\n\n```\narray\
    \ array_intersect ( array $array, array ...$arrays )\n```\n\nExample:\n\n```php\n\
    $first_array = array('first_name' => 'Pete', 'last_name' => 'Smith', 'address'\
    \ => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    $second_array = array('first_name' => 'Sally', 'last_name' => 'Parisi', 'address'\
    \ => '101 South Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    \nprint_r(array_intersect($first_array, $second_array));\n```\n\nOutput:\n\nArray\n\
    (\n[first_name] => Pete\n[city] => Atlanta\n[state] => GA\n[zip_code] => 30001\n\
    )\n\narray_unique — removes duplicate values from an array\n\n“array_unique()\
    \ returns a new array with duplicate values removed, preserving the first index\
    \ key for the remaining values. Comparison is done using strings.”\n\nSyntax:\n\
    \n```\narray array_unique ( array $array, int $flags = SORT_SORT_ORDER = SORT_REGULAR\
    \ )\n```\n\nExample:\n\n```php\n$first_array = array('first_name' => 'Pete', 'last_name'\
    \ => 'Smith', 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' =>\
    \ 'GA', 'zip_code' => 30001);\n$second_array = array('first_name' => 'Sally',\
    \ 'last_name' => 'Parisi', 'address' => '101 South Street', 'city' => 'Atlanta',\
    \ 'state' => 'GA', 'zip_code' => 30001);\n\nprint_r(array_unique($first_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[first_name] => Pete\n[last_name] => Smith\n[address]\
    \ => 123 Main Street\n[city] => Atlanta\n[state] => GA\n[zip_code] => 30001\n\
    )\n\narray_flip — flips keys and values of an array\n\n“array_flip() returns an\
    \ array with keys and values swapped. If the input array has duplicate values,\
    \ the last one encountered will overwrite the previous ones.”\n\nSyntax:\n\n```\n\
    array array_flip ( array $array )\n```\n\nExample:\n\n```php\n$first_array = array('first_name'\
    \ => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main Street', 'city' =>\
    \ 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\nprint_r(array_flip($first_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[Pete] => first_name\n[Smith] => last_name\n[123 Main\
    \ Street] => address\n[Atlanta] => city\n[GA] => state\n[30001] => zip_code\n\
    )\n\narray_keys — returns the keys of an array\n\n“array_keys() returns an array\
    \ with the keys of the input array as keys, and the specified value as values.”\n\
    \nSyntax:\n\n```\narray array_keys ( array $array, mixed $search_key = null )\n\
    ```\n\nExample:\n\n```php\n$first_array = array('first_name' => 'Pete', 'last_name'\
    \ => 'Smith', 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' =>\
    \ 'GA', 'zip_code' => 30001);\n\nprint_r(array_keys($first_array));\n```\n\nOutput:\n\
    \nArray\n(\n[0] => first_name\n[1] => last_name\n[2] => address\n[3] => city\n\
    [4] => state\n[5] => zip_code\n)\n\narray_values — returns the values of an array\n\
    \n“array_values() returns an array with the values of the input array as keys\
    \ indexed numerically starting from 0.”\n\nSyntax:\n\n```\narray array_values\
    \ ( array $array )\n```\n\nExample:\n\n```php\n$first_array = array('first_name'\
    \ => 'Pete', 'last_name' => 'Smith', 'address' => '123 Main Street', 'city' =>\
    \ 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\nprint_r(array_values($first_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[0] => Pete\n[1] => Smith\n[2] => 123 Main Street\n\
    [3] => Atlanta\n[4] => GA\n[5] => 30001\n)\n\narray_pop — removes the last element\
    \ of an array\n\n“array_pop() removes the last element of the array and returns\
    \ it.”\n\nSyntax:\n\n```\nmixed array_pop ( array &$array )\n```\n\nExample:\n\
    \n```php\n$first_array = array('first_name' => 'Pete', 'last_name' => 'Smith',\
    \ 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code'\
    \ => 30001);\n\n$last_element = array_pop($first_array);\n\nprint $last_element;\n\
    print_r($first_array);\n```\n\nOutput:\n\n30001\nArray\n(\n[first_name] => Pete\n\
    [last_name] => Smith\n[address] => 123 Main Street\n[city] => Atlanta\n[state]\
    \ => GA\n)\n\narray_shift — removes the first element of an array\n\n“array_shift()\
    \ removes the first element of the array and returns it, re-indexing the remaining\
    \ elements.”\n\nSyntax:\n\n```\nmixed array_shift ( array &$array )\n```\n\nExample:\n\
    \n```php\n$first_array = array('first_name' => 'Pete', 'last_name' => 'Smith',\
    \ 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code'\
    \ => 30001);\n\n$first_element = array_shift($first_array);\n\nprint $first_element;\n\
    print_r($first_array);\n```\n\nOutput:\n\nPete\nArray\n(\n[last_name] => Smith\n\
    [address] => 123 Main Street\n[city] => Atlanta\n[state] => GA\n[zip_code] =>\
    \ 30001\n)\n\narray_push — pushes elements onto the end of an array\n\n“array_push()\
    \ appends one or more elements to the end of the array.”\n\nSyntax:\n\n```\nint\
    \ array_push ( array &$array, mixed ...$elements )\n```\n\nExample:\n\n```php\n\
    $first_array = array('first_name' => 'Pete', 'last_name' => 'Smith', 'address'\
    \ => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    \narray_push($first_array, \"new element\", \"another element\");\n\nprint_r($first_array);\n\
    ```\n\nOutput:\n\nArray\n(\n[first_name] => Pete\n[last_name] => Smith\n[address]\
    \ => 123 Main Street\n[city] => Atlanta\n[state] => GA\n[zip_code] => 30001\n\
    [6] => new element\n[7] => another element\n)\n\narray_replace — replaces elements\
    \ of one array with elements from others\n\n“array_replace() replaces elements\
    \ of the first array with elements from one or more arrays.”\n\nSyntax:\n\n```\n\
    array array_replace ( array $array, array ...$arrays )\n```\n\nExample:\n\n```php\n\
    $first_array = array('first_name' => 'Pete', 'last_name' => 'Smith', 'address'\
    \ => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    $second_array = array('first_name' => 'Sally', 'last_name' => 'Parisi', 'address'\
    \ => '101 South Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code' => 30001);\n\
    \nprint_r(array_replace($first_array, $second_array));\n```\n\nOutput:\n\nArray\n\
    (\n[first_name] => Sally\n[last_name] => Parisi\n[address] => 101 South Street\n\
    [city] => Atlanta\n[state] => GA\n[zip_code] => 30001\n)\n\narray_sort — sorts\
    \ an array by its values\n\n“array_sort() sorts an array by its values in ascending\
    \ order and maintains index-value association.”\n\nSyntax:\n\n```\nbool array_sort\
    \ ( array &$array, int $flags = SORT_REGULAR, int $order = SORT_ASC )\n```\n\n\
    Example:\n\n```php\n$first_array = array('first_name' => 'Pete', 'last_name' =>\
    \ 'Smith', 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA',\
    \ 'zip_code' => 30001);\n\narray_sort($first_array);\n\nprint_r($first_array);\n\
    ```\n\nOutput:\n\nArray\n(\n[2] => 123 Main Street\n[3] => Atlanta\n[4] => GA\n\
    [5] => 30001\n[0] => Pete\n[1] => Smith\n)\n\narray_keysort — sorts an array by\
    \ its keys\n\n“array_keysort() sorts an array by its keys in ascending order and\
    \ maintains index-value association.”\n\nSyntax:\n\n```\nbool array_keysort (\
    \ array &$array, int $flags = SORT_REGULAR, int $order = SORT_ASC )\n```\n\nExample:\n\
    \n```php\n$first_array = array('first_name' => 'Pete', 'last_name' => 'Smith',\
    \ 'address' => '123 Main Street', 'city' => 'Atlanta', 'state' => 'GA', 'zip_code'\
    \ => 30001);\n\narray_keysort($first_array);\n\nprint_r($first_array);\n```\n\n\
    Output:\n\nArray\n(\n[0] => Pete\n[1] => Smith\n[2] => 123 Main Street\n[3] =>\
    \ Atlanta\n[4] => GA\n[5] => 30001\n)\n\narray_reverse — reverses the order of\
    \ an array\n\n“array_reverse() returns a new array with the order of the elements\
    \ reversed.”\n\nSyntax:\n\n```\narray array_reverse ( array $array, bool $preserve_keys\
    \ = false )\n```\n\nExample:\n\n```php\n$first_array = array('first_name' => 'Pete',\
    \ 'last_name' => 'Smith', 'address' => '123 Main Street');\n\nprint_r(array_reverse($first_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[2] => 123 Main Street\n[1] => Smith\n[0] => Pete\n\
    )\n\narray_shuffle — randomly shuffles an array\n\n“array_shuffle() randomly shuffles\
    \ the elements of an array.”\n\nSyntax:\n\n```\nvoid array_shuffle ( array &$array\
    \ )\n```\n\nExample:\n\n```php\n$first_array = array('first_name' => 'Pete', 'last_name'\
    \ => 'Smith', 'address' => '123 Main Street');\n\narray_shuffle($first_array);\n\
    \nprint_r($first_array);\n```\n\nOutput:\n\n(Order will vary)\n\narray_var — returns\
    \ a copy of the array\n\n“array_var() returns a copy of the array.”\n\nSyntax:\n\
    \n```\narray array_var ( array $array )\n```\n\nExample:\n\n```php\n$first_array\
    \ = array('first_name' => 'Pete', 'last_name' => 'Smith');\n\n$copy = array_var($first_array);\n\
    \nprint_r($copy);\n```\n\narray_walk — destroys an array\n\n\n\nunset($first_array[2]\
    \ = \"123 Main Street\";\n: 123 Main Street\n in Array( [0] => Pete, [1] => Smith,\
    \ [2] => 123 Main Street )\n\narray_walk — applies a function to each element\
    \ of an array\n\n“array_walk() applies a callback function to each element of\
    \ an array.”\n\nSyntax:\n\n```\nvoid array_walk ( array &$array, callable $callback,\
    \ mixed $userdata = null )\n```\n\nExample:\n\n```php\n$first_array = array('first_name'\
    \ => 'Pete', 'last_name' => 'Smith');\n\narray_walk($first_array, function($value,\
    \ $key) {\n    $value = strtoupper($value);\n});\n\nprint_r($first_array);\n```\n\
    \nOutput:\n\nArray\n(\n[first_name] => PETE\n[last_name] => SMITH\n)\n\narray_walk_recursive\
    \ — applies a function to each element of an array\n\n“array_walk_recursive()\
    \ applies a callback function to each element of an array, including nested arrays.”\n\
    \nSyntax:\n\n```\nvoid array_walk_recursive ( array &$array, callable $callback,\
    \ mixed $userdata = null )\n```\n\nExample:\n\n```php\n$first_array = array('first_name'\
    \ => 'Pete', 'info' => array('city' => 'Atlanta'));\n\narray_walk_recursive($first_array,\
    \ function($value, $key) {\n    $value = strtoupper($value);\n});\n\n\n\nprint_r($first_array);\n\
    ```\n\nOutput:\n\nArray\n(\n[first_name] => PETE\n[info] => Array\n    (\n   \
    \     [city] => ATLANTA\n    )\n)\n\narray_filter — filters elements of an array\n\
    \n“array_filter() returns a new array containing the elements of the array that\
    \ pass the callback.”\n\nSyntax:\n\n```\narray array_filter ( array $array, callable\
    \ $callback, mixed $userdata = null )\n```\n\nExample:\n\n```php\n$first_array\
    \ = array(0, 1, 2, 3, 4, 5);\n\n$result = array_filter($first_array, function($value)\
    \ {\n    return $value > 2;\n});\n\nprint_r($result);\n```\n\nOutput:\n\nArray\n\
    (\n[3] => 3\n[4] => 4\n[5] => 5\n)\n\narray_map — applies a function to each element\
    \ of an array\n\n“array_map() creates a new array by applying a callback function\
    \ to each element of one or more arrays.”\n\nSyntax:\n\n```\narray array_map (\
    \ callable $callback, array ...$arrays )\n```\n\nExample:\n\n```php\n$first_array\
    \ = array(1, 2, 3);\n\n$result = array_map(function($n) {\n    return $n * 2;\n\
    }, $first_array);\n\nprint_r($result);\n```\n\nOutput:\n\nArray\n(\n[0] => 2\n\
    [1] => 4\n[2] => 6\n)\n\narray_unique_key — returns unique keys of an array\n\n\
    “array_unique_key() returns a new array with duplicate keys removed, preserving\
    \ the first occurrence.”\n\nSyntax:\n\n```\narray array_unique_key ( array $array,\
    \ int $flags = SORT_REGULAR )\n```\n\nExample:\n\n```php\n$first_array = array('a'\
    \ => 1, 'b' => 2, 'a' => 3);\n\nprint_r(array_unique_key($first_array));\n```\n\
    \nOutput:\n\nArray\n(\n[a] => 1\n[b] => 2\n)\n\narray_unique_diff — returns the\
    \ difference between two arrays\n\n“array_unique_diff() returns an array containing\
    \ the elements of the first array that are not present in the second array, with\
    \ duplicates removed.”\n\nSyntax:\n\n```\narray array_unique_diff ( array $array,\
    \ array $array2, int $flags = SORT_REGULAR )\n```\n\nExample:\n\n```php\n$first_array\
    \ = array(1, 2, 2, 3);\n$second_array = array(2, 4);\n\nprint_r(array_unique_diff($first_array,\
    \ $second_array));\n```\n\nOutput:\n\nArray\n(\n[0] => 1\n[3] => 3\n)\n\narray_intersect_diff\
    \ — returns the intersection of two arrays\n\n“array_intersect_diff() returns\
    \ an array containing all elements of the first array that are not present in\
    \ the second array.”\n\nSyntax:\n\n```\narray array_intersect_diff ( array $array,\
    \ array $array2 )\n```\n\nExample:\n\n```php\n$first_array = array(1, 2, 3);\n\
    $second_array = array(2, 4);\n\nprint_r(array_intersect_diff($first_array, $second_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[0] => 3\n)\n\narray_merge_key — merges arrays based\
    \ on their keys\n\n“array_merge_key() merges one or more arrays. If the input\
    \ arrays have the same keys, the later value will overwrite the previous.”\n\n\
    Syntax:\n\n```\narray array_merge_key ( array $array1, array ...$arrays )\n```\n\
    \nExample:\n\n```php\n$first_array = array('a' => 1, 'b' => 2);\n$second_array\
    \ = array('b' => 3, 'c' => 4);\n\nprint_r(array_merge_key($first_array, $second_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[a] => 1\n[b] => 3\n[c] => 4\n)\n\narray_replace_key\
    \ — replaces elements based on their keys\n\n“array_replace_key() replaces elements\
    \ of the first array with elements from one or more arrays based on their keys.”\n\
    \nSyntax:\n\n```\narray array_replace_key ( array $array, array ...$arrays )\n\
    ```\n\nExample:\n\n```php\n$first_array = array('a' => 1, 'b' => 2);\n$second_array\
    \ = array('b' => 3, 'c' => 4);\n\nprint_r(array_replace_key($first_array, $second_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[a] => 1\n[b] => 3\n[c] => 4\n)\n\narray_u_diff —\
    \ returns the unique difference between arrays\n\n“array_u_diff() returns an array\
    \ containing the elements of the first array that are not present in the second\
    \ array, with duplicates removed.”\n\nSyntax:\n\n```\narray array_u_diff ( array\
    \ $array, array ...$arrays )\n```\n\nExample:\n\n```php\n$first_array = array(1,\
    \ 2, 2, 3);\n$second_array = array(2, 4);\n\nprint_r(array_u_diff($first_array,\
    \ $second_array));\n```\n\nOutput:\n\nArray\n(\n[0] => 1\n[3] => 3\n)\n\narray_u_intersect\
    \ — returns the intersection of arrays\n\n“array_u_intersect() returns an array\
    \ containing all elements of the first array that are present in all the other\
    \ arrays.”\n\nSyntax:\n\n```\narray array_u_intersect ( array $array, array ...$arrays\
    \ )\n```\n\nExample:\n\n```php\n$first_array = array(1, 2, 3);\n$second_array\
    \ = array(2, 4);\n\nprint_r(array_u_intersect($first_array, $second_array));\n\
    ```\n\nOutput:\n\nArray\n(\n[1] => 2\n)\n\narray_u_sort — sorts an array using\
    \ a user comparison function\n\n“array_u_sort() sorts an array using a user-defined\
    \ callback function to compare elements.”\n\nSyntax:\n\n```\nbool array_u_sort\
    \ ( array &$array, callable $callback, int $flags = SORT_REGULAR, int $order =\
    \ SORT_ASC )\n```\n\nExample:\n\n```php\n$first_array = array('a' => 1, 'b' =>\
    \ 2, 'c' => 3);\n\narray_u_sort($first_array, function($a, $b) {\n    return $a\
    \ <=> $b;\n});\n\nprint_r($first_array);\n```\n\nOutput:\n\nArray\n(\n[a] => 1\n\
    [b] => 2\n[c] => 3\n)\n\narray_u_keysort — sorts an array by its keys using a\
    \ user comparison function\n\n“array_u_keysort() sorts an array by its keys using\
    \ a user-defined callback function to compare keys.”\n\nSyntax:\n\n```\nbool array_u_keysort\
    \ ( array &$array, callable $callback, int $flags = SORT_REGULAR, int $order =\
    \ SORT_ASC )\n```\n\nExample:\n\n```php\n$first_array = array('c' => 3, 'a' =>\
    \ 1, 'b' => 2);\n\narray_u_keysort($first_array, function($a, $b) {\n    return\
    \ $a <=> $b;\n});\n\nprint_r($first_array);\n```\n\nOutput:\n\nArray\n(\n[a] =>\
    \ 1\n[b] => 2\n[c] => 3\n)\n\narray_walk_recursive — applies a function to each\
    \ element of an array\n\n“array_walk_recursive() applies a callback function to\
    \ each element of an array, including nested arrays.”\n\nSyntax:\n\n```\nvoid\
    \ array_walk_recursive ( array &$array, callable $callback, mixed $userdata =\
    \ null )\n```\n\nExample:\n\n```php\n$first_array = array('first_name' => 'Pete',\
    \ 'info' => array('city' => 'Atlanta'));\n\narray_walk_recursive($first_array,\
    \ function($value, $key) {\n    $value = strtoupper($value);\n});\n\nprint_r($first_array);\n\
    ```\n\nOutput:\n\nArray\n(\n[first_name] => PETE\n[info] => Array\n    (\n   \
    \     [city] => ATLANTA\n    )\n)\n"
  mdcn: "\n\n输出：\n\n```\nArray (\n[first_name] => Sally\n[last_name] => Smith\n[address]\
