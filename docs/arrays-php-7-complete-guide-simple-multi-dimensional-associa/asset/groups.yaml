    \ zipcode）。此过程不是递归的。\n\n# 练习题\n\n- 1. 创建一个 PHP 程序，其中包含一个位于佐治亚州且人口超过 100,000 的城市数组。包含一个部分数组，该数组包含位于佛罗里达州且人口超过\
