    code, managed by Composer, in the vendor folder. Eventually, we could make our
    framework a separate project and include it via Composer, but for now we will
    store it in a separate folder in our project. This will allow us to identify and
    separate out the reusable bits of our framework.


    Create a folder called lib/weekend and move all the code that is currently in
    the src folder into this new location. If you try to access the application now
    you will get an error, like: “Uncaught Error: Class Weekend\App not found”. We
    need to tell Composer that we’ve move the code for the namespace Weekend and update
    its autoloader. Edit the autoload section of composer.json as per listing 10.1.
    Notice how we also add our src folder to the autoloader config so it can find
    our site’s code. In this example, I’m not using a namespace for my site-specific
    code.


