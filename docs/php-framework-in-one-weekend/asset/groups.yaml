    # # Creating Responses


    We added in the HTTP Foundation component to give us a nice object-oriented interface
    for working with HTTP messages. We saw how to create an object from the HTTP request.
    Now let''s use the HTTP Foundation to create our HTTP response objects too. Up
    until now we have been printing the output directly, and relying on PHP to send
    this as the response. It''s easy to turn this into a `Response` object thanks
    to HttpFoundation. The component provides different response types to make it
    easy to send JSON results, or binary files, but for now we will just use a standard
    HTML response.


    The package provides a few different ways of creating responses. You can create
    a new `Response` object:

    `use Symfony\Component\HttpFoundation\Response; $response = new Response($content);`


    You can also set the HTTP status code and HTTP headers via the constructor. By
    default the HTTP status code will be 200. If you want to serve a “404 page not
    found” you can create a response like this:

    `$response = new Response(“not found”, 404);`


    Once you have finished generating the response you have to send it to the user.
    This is done by calling `send()` on the `$response` object, like this:

    `$response->send();`


    A convenient factory method is also provided, to which you can also (optionally)
    provide content, status, and headers:

    `$response = Response::create($content, $status, $headers);`


    The default content is the empty string, so you will want to provide your own
    value for this. You can omit status and headers and use the defaults (assuming
    nothing went wrong). The default status is 200. The factory method supports chaining
    when generating the response, so you can call the `send()` method directly, like
    this:

    `Response::create($content)->send();`


    Listing 6.1 shows the new version of our `index.php` file that wraps the Twig
    result as a HTTP Request object and sends it (line 20).


    ```

    1 <?php

    2 use League\Flysystem\Adapter\Local;

    3 use League\Flysystem\Filesystem;

    4 use Symfony\Component\HttpFoundation\Request;

    5 use Symfony\Component\HttpFoundation\Response;

    6

    7 require __DIR__.''../vendor/autoload.php'';

    8

    9 $request = Request::createFromGlobals();

    10

    10 $adapter = new Local(__DIR__.''../data''); 11 $filesystem = new Filesystem($adapter);
    12

    13 $variables = json_decode($filesystem->read(''menu.json''), true); 14

    15 $loader = new Twig_Loader_Filesystem(__DIR__.''../templates''); 16 Twig = new
    Twig_Environment($loader);

    17

    18 $content = $twig->render(''index.html'', $variables[''index'']); 19

    20 Response::create($content)->send();

    ```


    **Listing 6.1:** public/index.php'
