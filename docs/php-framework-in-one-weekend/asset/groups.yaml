    \ the new routing code in our run() method.\n\n### Listing 7.2: src/App.php\n\n\
    ```php\npublic function run(Request $request)\n{\n    $path = $request->getPathInfo();\n\
    \    switch ($path)\n    {\n    case '/':\n    case '/index':\n    case '/about':\n\
    \        $controller = new BasicPageController();\n        return $controller->get($path);\n\
    \    }\n    return Response::create(\"Not found\", 404);\n}\n```\n"
  mdcn: "\n\n## App 类\n\n现在我们准备开始为应用程序添加其他路由。让我们先通过为代码创建一个独立的 App 类来稍微整理一下。然后我们将把代码从\
    \ index.php 移出来，以便能更有条理地组织。\n\n我们需要自己的命名空间，这样在定义 App 类时就不必担心未来与其他名为 App 的东西发生冲突。我们还使用这个命名空间来配置\
    \ Composer，指定源代码的位置。让我们使用 Weekend 作为我们的命名空间。\n\n在项目根目录下创建一个 src 文件夹。源代码将放在这里。从现在起，我们将只使用\
    \ public 文件夹来存放公开可访问的资源，与源代码分开。public 文件夹将包含我们的静态资源，如图片、CSS 和 JavaScript。我们还需要保留\
    \ public/index.php 文件，因为所有 Web 请求都会路由到这里。我们将修改 public/index.php 文件，使其只加载并运行我们的\
    \ App。\n\n我们在 src/App.php 中创建应用程序的源文件。我们遵循 PSR-4 规范[19]来命名文件和类。我们告诉 Composer 源文件所在的位置，然后它会将它们添加到自动加载器中。这意味着我们不需要包含所有源文件，因为它们会在需要时自动加载。\n\
    \n列表 6.2 显示了我们放在 src/App.php 中的新 App 类的代码，使用了之前 index.php 文件中的代码。列表 6.3 显示了加载并运行我们的\
    \ App 的新 index.php 文件。\n\n### Listing 6.2: src/App.php\n\n```php\n<?php\nnamespace\
    \ Weekend;\n\nuse League\\Flysystem\\Adapter\\Local;\nuse League\\Flysystem\\\
    Filesystem;\nuse Symfony\\Component\\HttpFoundation\\Request;\nuse Symfony\\Component\\\
    HttpFoundation\\Response;\nuse Twig_Environment;\nuse Twig_Loader_Filesystem;\n\
    \nclass App\n{\n    public function run(Request $request)\n    {\n        $adapter\
    \ = new Local(__DIR__ . '/../data');\n        $filesystem = new Filesystem($adapter);\n\
    \        $variables = json_decode($filesystem->read('menu.json'), true);\n   \
    \     $loader = new Twig_Loader_Filesystem(__DIR__ . '/../templates');\n     \
    \   $twig = new Twig_Environment($loader);\n        $content = $twig->render('index.html',\
    \ $variables['index']);\n        return Response::create($content);\n    }\n}\n\
    ```\n\n### Listing 6.3: public/index.php\n\n```php\n<?php\nuse Symfony\\Component\\\
    HttpFoundation\\Request;\n\nrequire __DIR__ . '/../vendor/autoload.php';\n$request\
    \ = Request::createFromGlobals();\n\n$app = new \\Weekend\\App();\n$response =\
    \ $app->run($request);\n$response->send();\n```\n\n如果你现在尝试运行，会得到一个错误。消息将出现在你的浏览器或\
    \ PHP 错误日志中，具体取决于你的配置。它会显示 Class Weekend\\App not found。这是因为我们尚未将类包含在自动加载系统中。要做到这一点，我们需要将其添加到\
    \ composer.json 配置中。在 autoload 下创建一个 psr-4 条目，并将 Weekend 命名空间映射到我们的 src 文件夹。Composer\
    \ 对此处的格式很在意。文件必须是有效的 JSON。注意不要添加多余的逗号，或遗漏命名空间末尾的双反斜杠。列表 6.4 显示了更新后的 composer.json\
    \ 文件。\n\n### Listing 6.4: composer.json\n\n```json\n{\n    \"name\": \"darrenmothersel/php-framework\"\
    ,\n    \"authors\": [\n        {\n            \"name\": \"Darren\",\n        \
    \    \"email\": \"darren@darrenmothersele.com\"\n        }\n    ],\n    \"require\"\
    : {\n        \"symfony/http-foundation\": \"^3.0\",\n        \"twig/twig\": \"\
    ^1.24\",\n        \"league/flysystem\": \"^1.0\"\n    },\n    \"autoload\": {\n\
    \        \"psr-4\": {\n            \"Weekend\\\\\": \"src/\"\n        }\n    }\n\
    }\n```\n\n现在使用 dump-autoload Composer 命令重新生成自动加载器：\n\n```bash\n$ composer dump-autoload\n\
    ```\n\n只有在手动编辑 composer.json 文件中的自动加载器设置时才需要运行此命令。当你使用 Composer 更新或安装新包时，自动加载器会自动重新生成。\n\
    \n## 路由\n\n现在我们准备实现一个基本路由器。在上一步中，我们将所有功能都移到了 App 类的 run() 方法中。run() 方法以 Request\
    \ 对象作为输入，并返回一个 Response 对象。这是所有 Web 应用程序的基础，所有 Web 框架都有这个基本功能。\n\n我们简单应用（在当前状态下）的限制是功能被硬编码到了\
    \ run() 方法中。我们需要一种根据请求将调用路由到不同功能的方法。\n\n首先，让我们尝试一个简单的路由器，它使用请求中的信息和我们之前创建的 data/menu.json\
    \ 文件中的配置。我们使用 getPathInfo() 方法从请求中获取请求的路径：\n\n```php\n$path = $request->getPathInfo();\n\
    ```\n\n现在我们可以通过检查 $path 变量来更改响应的 $content。例如，使用这样的 switch 语句：\n\n```php\n$content\
    \ = \"\";\nswitch ($path) {\ncase '/':\ncase '/index':\n    $content = $twig->render('index.html',\
    \ $variables['index']);\n    break;\ncase '/about':\n    $content = $twig->render('index.html',\
    \ $variables['about']);\n    break;\n}\n```\n\n这个 switch 语句定义了两个不同的路由及其对应的代码。我们稍后会回到此处，但你可能已经看到改进的方法。在我们的\
    \ run() 方法中，我们只需要将 $content 包装在 Response 中并返回它。我们还进行错误检查，当路径未匹配时返回 404：\n\n```php\n\
    if (empty($content)) {\n    return Response::create(\"Not found\", 404);\n}\n\
    return Response::create($content);\n```\n\n你可以尝试每个 URL 来确认这行得通：\n\n- http://localhost:4000/\n\
    - http://localhost:4000/index\n- http://localhost:4000/about\n\n另外，尝试加载一个未定义路由的\
    \ URL 并检查是否会得到 404 错误：\n\n```\nhttp://localhost:4000/contact\n```\n\n## 第 7 章\n\
    \n### 控制器\n\n自我们的第一个“Hello World！”示例以来，我们已经走得很远了，当时我们在一个 PHP 脚本中完成了所有事情。我们现在已经有了一些结构，但所有内容仍然在\
    \ App 类的单个 run() 方法中。\n\n在 Web 框架中，你通常会发现不同的请求类型由不同的对象负责。前端控制器将请求分发给适当的控制器以生成响应。我们迄今为止定义的两个路由都可以由同一个控制器处理。如果你看看我们创建的基本路由器，生成内容的代码几乎是一样的。让我们创建一个\
    \ BasicPageController 类来封装这个功能。\n\n按照 PSR-4 的自动加载命名规则，我们为控制器创建一个名为 src/Controller\
    \ 的文件夹。我们的 Weekend 命名空间映射到 src 文件夹，因此我们的控制器的命名空间将是 Weekend\\Controller。如果我们需要完整引用我们的新控制器类，它将被称为\
    \ Weekend\\Controller\\BasicPageController。列表 7.1 显示了我们新 BasicPageController 类的代码。\n\
    \n### Listing 7.1: src/Controller/BasicPageController.php\n\n```php\n<?php\nnamespace\
    \ Weekend\\Controller;\n\nuse League\\Flysystem\\Adapter\\Local;\nuse League\\\
    Flysystem\\Filesystem;\nuse Symfony\\Component\\HttpFoundation\\Response;\nuse\
    \ Twig_Environment;\nuse Twig_Loader_Filesystem;\n\nclass BasicPageController\n\
    {\n    protected $filesystem;\n    protected $menu;\n    protected $twig;\n\n\
    \    public function __construct()\n    {\n        $adapter = new Local(__DIR__\
    \ . '/../../data');\n        $this->filesystem = new Filesystem($adapter);\n \
    \       $this->menu = json_decode($this->filesystem->read('menu.json'), true);\n\
    \        $loader = new Twig_Loader_Filesystem(__DIR__ . '/../../templates');\n\
    \        $this->twig = new Twig_Environment($loader);\n    }\n\n    public function\
    \ get($path)\n    {\n        $page = ($path == '/') ? 'index' : substr($path,\
    \ 1);\n        if (isset($this->menu[$page])) {\n            $content = $this->twig->render('index.html',\
    \ $this->menu[$page]);\n            return new Response($content);\n        }\n\
    \        return Response::create(\"not found\", 404);\n    }\n}\n```\n\n构造函数（第\
    \ 16-25 行）现在负责创建文件系统和 Twig 环境。我们还将 menu.json 的内容加载到 $menu 变量中，以便在我们的 *控制器回调* 中稍后使用。get()\
    \ 方法（第 27-36 行）是我们的回调，路由器将为此控制器定义的请求 *分发* 到该回调。之前硬编码到路由器中的处理响应的代码已从 App 的 run()\
    \ 方法移动到此控制器的 get() 方法中。\n\nget() 回调中的第 29 行检查默认路径，并从路径中去掉开头的 /。$page 的值用于获取 $this->menu\
    \ 数组的相应部分，该数组在构造函数中通过读取 menu.json 文件创建。\n\n我们 App 类中的路由器现在简单多了。我们将所有三个定义的路由都路由到同一个控制器。列表\
    \ 7.2 显示了我们 run() 方法中的新路由代码。\n\n### Listing 7.2: src/App.php\n\n```php\npublic\
    \ function run(Request $request)\n{\n    $path = $request->getPathInfo();\n  \
    \  switch ($path)\n    {\n    case '/':\n    case '/index':\n    case '/about':\n\
    \        $controller = new BasicPageController();\n        return $controller->get($path);\n\
    \    }\n    return Response::create(\"Not found\", 404);\n}\n```\n\n"
