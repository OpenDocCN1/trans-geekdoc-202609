    ## 前言


    > “周末，编程自我提升的基本单位”

    > Peter Shirley


    我最近很享受阅读 Peter Shirley 的《周末光线追踪》[21]。在几个章节中，Peter 指导你完成构建基本光线追踪应用程序的过程。它不是一个全面的工具，但在一个周末内，你将学习足够的材料来掌握基本概念。Peter
    说他包含了“这些作业中最基础的一组，这样在一个周末内就非常可行，这是编程自我提升的基本单位。”


    ## 关于本项目


    我在此遵循了 Peter 的方法，并将引导你完成一个短小的项目，这个项目在一个周末内应该可以轻松完成。该项目基于我曾与小型 PHP 开发者小组一起开展的为期
    2 天的培训课程。我将内容精简为一组简单的示例，每个示例都在前一个基础上构建。


    它并非旨在成为你可以立即用于真实网站的工具，而是作为学习现代 PHP Web 应用中使用的基本概念的起点。它也不旨在成为 Web 技术的入门课程。假设你对
    HTML、CSS、JavaScript 和 PHP 有一定的了解。


    这门课程的另一个目标是教授现代 PHP。有大量过时的书籍、教程和指南教授 PHP，但它们今天都无法通过代码审查。在这个项目中，我们将努力使用现代 PHP 最佳实践。但是，一个周末不足以涵盖整个现代
    PHP。我们鼓励你阅读《PHP 正确做法》[16]，以了解使用 PHP 的现代方法的更详细概述。


    这个周末项目是关于探索现代 PHP 以及 PHP 包和库的生态系统。在整个周末中，你将学习构建现代 PHP 应用所依赖的一些基本概念。Drupal、phpBB、Laravel、eZ
    Publish、Joomla!、Magento、Piwik 等许多项目都在使用 Symfony Components[25] 作为构建基础。我们将使用这些以及更多内容来构建我们自己的
    PHP 框架。


    ## 关于作者


    我于 2001 年在谢菲尔德大学编写并讲授了我的第一门 PHP 课程。在唱片公司短暂工作后，我联合创立了一家数字音乐初创公司，并担任 CTO 直到 2007
    年，之后我创立了 Ideation Networks。作为一名 Drupal 专家，我为 Drupal 机构、大规模 Drupal 部署和旗舰 Drupal
    网站提供软件开发和培训。最近，这包括帮助开发者从 Drupal 7 切换到 Drupal 8，并教授现代 PHP。


    ## 约定


    等宽字体中的文本要么是代码片段，要么是在命令行中输入的命令。我在 OSX 上使用 iTerm2，但任何 PHP 运行的环境都应该可以。我使用 $ 字符来指示命令提示符。如果你看到一行以该字符开头，后跟一个空格，那么它是应该在终端中输入的命令。


    ```

    $ pwd

    /Users/darren/dev/book

    ```


    shell 块中不以 $ 字符开头的任何行都是命令返回的输出。你应该预期在运行前面的命令后，在终端中看到这些输出。


    等宽字体的其他用途包括代码示例、PHP 关键字、文件名、类、函数和命令。你会看到部分代码示例，内联包含，例如：


    ```

    $name = $_GET[''name''];

    ```


    你还会看到完整源文件的完整代码清单。这些将包括 PHP、CSS、JavaScript、Twig 模板和 JSON 配置文件，例如清单 1。代码清单旁边的标题用于指示其关联的文件。源代码左侧的行号指示引用了源文件中的哪些行。如本示例所示，已提供第
    2-6 行。清单可能列出整个文件，也可能仅列出突出正在讨论的问题的选定行数。


    ```

    2 require __DIR__.''../vendor/autoload.php'';

    3 $name = "World";

    4 ?>

    5 <!DOCTYPE html>

    6 <html lang="en">

    ```


    **清单 1：** public/index.php 注意 源文件仅作为示例提供。它们旨在说明正在讨论的概念。你应当自己编写代码。请不要复制粘贴。阅读代码，理解它，然后编写自己的版本。如果你自己编写代码、即兴发挥并根据喜好进行调整，你将学到更多。你可以随意使用提供的代码，但它仅旨在作为参考。


    如果你卡住了，请查看 GitHub 仓库[23] 或联系作者[2]。


    ## 第 0 章


    ### 开始


    你应该使用最新的稳定版 PHP。我正在使用 PHP 7，但这个项目在 PHP 5.6 上也应该可以正常工作。你可以使用 php -v 命令检查已安装的 PHP
    版本。


    ```

    $ php -v

    PHP 7.0.6 (cli) (built: May 12 2016 15:13:35) ( NTS ) Copyright (c) 1997-2016
    The PHP Group

    Zend Engine v3.0.0, Copyright (c) 1998-2016 Zend Technologies

    ```


    如果你在 OSX 上，可以使用 Homebrew[10] 更新和安装 PHP：


    ```

    $ brew update

    $ brew install homebrew/php/php70

    ```


    我们将使用一个名为 Composer 的应用程序来下载 PHP 包，并使其可供我们的 PHP 代码使用。


    如果你还没有安装 Composer，可以在 Composer 网站[5] 上找到安装说明。你可以将 Composer 本地安装到这个单个项目，但我更喜欢全局安装它。我会假设你已经做了同样的操作，并将
    composer 可执行文件添加到你的 PATH 中。如果你以不同方式安装了它，可能需要更新示例命令。


    ```

    $ composer

    ```


    如果你运行上面的命令，你应该能看到关于 Composer、其选项以及可用命令列表的一些基本帮助。


