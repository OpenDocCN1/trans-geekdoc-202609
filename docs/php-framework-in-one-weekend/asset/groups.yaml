    ## HTTP 请求


    PHP 将传入请求的数据作为全局变量提供。它们如下所示：


    ```php

    $name = $_GET[''name''];

    ```


    我们不希望直接操作这些全局变量。而且，既然我们有了一组代码库来简化对 HTTP 消息的处理，就不必这样做了。HTTP Foundation 组件可以根据 PHP
    在全局变量中提供的数据为您创建请求对象。


    当我们使用 Composer require 命令下载包时，它会将包添加到自动加载器中，以便类自动可用。当我们第一次在代码中使用类时，其代码会自动加载。我们可以创建一个表示请求的对象，如下所示：


    ```php

    $request = \Symfony\Component\HttpFoundation\Request::createFromGlobals();

    ```


    当我们引入多个包中的代码时，需要确保包中定义的名称不会冲突。PHP 提供了一种称为命名空间（namespaces）的功能，可防止命名冲突。你可以在之前的示例中看到，HttpFoundation
    组件提供的 Request 对象具有 _完全限定_ 名称：


    ```php

    \Symfony\Component\HttpFoundation\Request

    ```


    由于此文件中没有名为 Request 的内容，因此不会发生名称冲突。因此，我们可以使用 PHP 的 use 关键字将名称 _导入_ 到本地作用域，以整理代码。你可以在清单
    3.2（第 2 行和第 5 行）中看到这方面的演示。


    现在我们有了一个对象，可以用来从请求中获取信息：


    ```php

    $name = $request->get(''name'');

    ```


    你会注意到我也在示例页面中添加了一个 print_r 语句（第 16 行，清单 3.2），以便你可以查看 $request 对象的结构。清单 3.2 展示了我们的新
    public/index.php 文件。


    ```php

    1 <?php

    2 use Symfony\Component\HttpFoundation\Request;

    3 require __DIR__.''../vendor/autoload.php'';

    4

    5 $request = Request::createFromGlobals();

    6 $name = $request->get(''name'');

    7 ?>

    8 <!DOCTYPE html>

    9 <html lang="en">

    10 <head>

    11 <meta charset="UTF-8">

    12 <title>Document</title>

    13 </head>

    14 <body>

    15 <h1>Hello <?php print $name; ?>!</h1>

    16 <pre><?php print_r($request); ?></pre>

    17 </body>

    18 </html>

    ```


    ### 清单 3.2：public/index.php


    启动 PHP 内置 Web 服务器（如果之前仍在运行，则无需重复），并在浏览器中加载页面以检查是否正常工作。


    ```bash

    $ php -S localhost:4000 -t public/

    ```


    请务必在 URL 中为 $name 参数提供值，如下所示：


    ```

    http://localhost:4000/?name=World

    ```


    备注：直接输出用户输入绝不是好主意。这是将安全问题引入代码的最简便方法。在此示例中，我们直接从用户输入获取了 $name 变量并将其输出。在实际情况中，你会过滤此值以删除任何危险字符，以防止跨站脚本（XSS）攻击。我们在此不这样做，因为我们将使用一个模板系统来为我们处理此问题。你可以通过加载以下
    URL 来确认此操作不安全：


    ```

    http://localhost:4000/?name=Danger<script>alert(''hi!'')</script>

    ```


    你将看到一个 JavaScript 警告。GET 参数中的代码直接嵌入到页面中。你不必是安全专家也能意识到，允许用户将 JavaScript 代码注入页面是个坏主意。


    ## 第 4 章

    ### 模板


    目前我们所有代码都放在一个源文件（index.php）中。在我们的 PHP Web 框架中，我们希望将逻辑与显示分开。随着项目规模扩大，这样做更具可扩展性且更易于维护。这也意味着设计师可以单独处理模板，而无需了解任何
    PHP 代码。我们还可以受益于自动转义（过滤危险内容）等安全功能。


    有许多可作为 PHP 包使用的模板引擎^1。你（或你的 Web 设计师）可能有偏爱。你可能想要使用某个特定模板，因为它得到工作流中其他工具的支持。Mustache[13]
    很流行，因为它在几乎所有语言中都有实现，但有些人发现其无逻辑模板有局限性。我们将使用 Twig[29]，因为它“灵活、快速且安全”。


    让我们使用 Composer 安装 Twig：


    ```bash

    $ composer require twig/twig

    ```


    你的 composer.json 配置文件的 require 部分现在应如清单 4.1 所示。


    ```json

    9 "require": {

    10 "symfony/http-foundation": "^3.0",

    11 "twig/twig": "^1.24"

    12 }

    ```


    ### 清单 4.1：composer.json


    在项目中创建一个模板文件夹，并按清单 4.2 创建名为 templates/index.html 的新文件。


    ^1 你可以使用 Packagist 网站搜索 PHP 包。以下是按下载量排序的“template”搜索[15]。


    ```html

    1 <!doctype html>

    2 <html lang="en">

    3 <head>

    4 <meta charset="UTF-8">

    5 <title>Document</title>

    6 </head>

    7 <body>

    8 <h1>Hello {{ name }}!</h1>

    9 </body>

    10 </html>

    ```


    ### 清单 4.2：templates/index.html


    Twig 网站提供了模板语法的完整参考[28]。注意它如何使用 {{ 和 }} 来界定表达式。界定符之外的内容将作为 HTML 输出。界定符内的表达式会被求值，并将其输出插入到
    HTML 中。在此示例中，简单表达式 {{ name }} 将求值为提供的 name 变量的值。你将在下文看到如何传入模板所期望的所有变量。


    现在让我们将系统的其余部分转换为使用模板。这意味着修改 public/index.php，使其不再将 HTML 标记硬编码在其中。目前，我们将用加载和执行
    Twig 的代码来替换它。


    Twig 是一个非常灵活的系统，由各种组件组成。要开始使用，你只需要一个 *模板加载器*（Template Loader），以便 Twig 知道如何加载模板文件，以及一个
    *Twig 环境*（Twig Environment），所有模板处理都在此发生。


    清单 4.3 显示了新的 public/index.php 文件，其中在第 9 行创建了模板加载器，在第 10 行加载了 Twig 环境。


    ```php

    1 <?php

    2 use Symfony\Component\HttpFoundation\Request;

    3 require __DIR__.''.././vendor/autoload.php'';

    4

    5 $request = Request::createFromGlobals();

    6

    7 $name = $request->get(''name'');

    8

    9 $loader = new Twig_Loader_Filesystem(__DIR__.''.././templates'');

    10 $twig = new Twig_Environment($loader);

    11

    12 echo $twig->render(''index.html'',[''name'' => $name]);

    ```


    ### 清单 4.3：public/index.php


    HTML 标记已被删除，现在是在第 12 行调用 $twig 对象的 render() 方法时生成的。对 $twig->render() 的调用需要两个参数。第一个是模板名称，第二个是要传递给模板的
    *模板变量* 数组。在我们的模板文件（templates/index.html）中，有一个引用名为 name 的变量的表达式 {{ name }}。在调用
    render 时，我们传递从请求对象检索到的 $name 变量。


    如果之前未运行，请再次启动 PHP 内置 Web 服务器。如果你加载以下 URL，应看到“Hello World！”。

    http://localhost:4000/?name=World


    请注意，如果你直接访问 http://localhost:4000 而不提供 name 参数，则只会看到“Hello !”。我们在第 2 章（清单 2.1）中创建的基本测试脚本将失败。让我们通过为
    name 提供默认值来修复这个问题。


    清单 4.4 展示了 Twig default() 过滤器的用法。管道符号 (|) 用于将 *name* 变量的输出 *管道* 到 *default* 过滤器。Twig
    提供了许多可用的过滤器[12]。如果输入为空，此过滤器只是提供一个默认值。


    ```html

    1 <!doctype html>

    2 <html lang="en">

    3 <head>

    4 <meta charset="UTF-8">

    5 <title>Document</title>

    6 </head>

    7 <body>

    8 <h1>Hello {{ name | default(''World'') }}</h1>

    9 </body>

    10 </html>

    ```


    ### 清单 4.4：templates/index.html


    备注：顺便提一下，你可以测试一下这如何解决上一章末尾讨论的安全问题。你可以尝试访问同一个不安全的 URL，但这次请注意输出中你会看到 Hello Danger<script>alert(...)</script>！Twig
    在输出时会自动过滤变量。HTML 标签被转义，因此它们会显示在页面上，而不是被解释为有效的脚本标签。


    '
