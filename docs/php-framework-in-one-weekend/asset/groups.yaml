    如果我们可以移除硬编码依赖，我们可以使控制器更容易理解，更易于维护，并隔离功能。我们通过使用依赖注入来实现这一点，这仅仅意味着我们传入依赖项，而不是在类中创建它们。因此，对于
    ContactController，我们将 Twig 环境传递给构造函数：


