    Twig 代码需要更改，你必须找到每个使用它的位置并进行更新。这里只有两个控制器，这可能不是什么大问题，但随着系统增长，复杂性也会增加。保持事物分离很重要。


    Twig 依赖项被硬编码到两个控制器中。BasicPageController 还对我们的 $filesystem 对象和 menu.json 配置有硬编码依赖。


