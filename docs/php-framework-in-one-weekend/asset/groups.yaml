    ## 模板逻辑


    你可能注意到，我们在最新的 Twig 模板中使用了不同的语法。我们创建的第一批模板仅使用了表达式分隔符，例如 {{ title }}。我们现在引入另一种类型的分隔符，{%
    ... %}。


    双花括号（{{ ... }}）始终包含表达式。内容会被求值并打印出来。它可能包含单个变量，在这种情况下会输出该变量的值。它可以包含更复杂的表达式，并使用过滤器。Twig
    求值表达式，将结果传递给任何指定的过滤器，并将结果输出到模板中。


    我们可以使用另一种分隔符（{% ... %}）向模板添加逻辑。最后一个示例显示它们用于定义模板之间的继承，以及将一个模板包含在另一个模板中。我们也可以使用它们添加条件语句来打开或关闭模板的部分内容。它们还可以用于添加循环，重复模板的部分内容。


    让我们通过使用先前创建的 menu.json 配置文件向模板添加导航来演示这一点。为了做到这一点，我们需要使菜单结构可供我们的 Twig 模板使用。我们鼓励你考虑实现此目的的不同方式。作为示例，我们将创建自己的模板服务。目前我们使用
