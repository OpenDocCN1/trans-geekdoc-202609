    # # Chapter 5 Content


    Now that we’ve got a templating system in place we need some content to put in
    the templates. At some point we might need a database for more advanced content
    management. For now we are going to store our content in simple text data files.


    Create a folder in your project called data that will be the root of our flat
    file data store. We will use a folder on the local filesystem during our development,
    but thanks to the Flysystem[9] package these data files could be anywhere. Instead
    of using PHP’s built-in file access, we use Flysystem because it provides a filesystem
    abstraction. This provides a nice API for working with files, including loading,
    saving, renaming, copying, deleting, and listing. Because it is an abstraction
    we can work with multiple filesystems in the same way. Plugins provide the implementation
    details for different types of filesystem. Flysystem calls these plugins Adapters.
    There are Adapters available for local files, Azure, Amazon S3, Dropbox, FTP,
    SFTP, WebDAV, and many more.


    Use Composer to install Flysystem:


    ```

    $ composer require league/flysystem

    ```


    Composer will download the latest version, add it to the require section of your
    config, and make it available to your PHP code via the autoloader. Listing 5.1
    shows what the require section of the composer.json file looks like with the new
    addition.


    ```

    9 "require": {

    10 "symphony/http-foundation": "^3.0", 11 "twig/twig": "^1.24",

    12 "league/flysystem": "^1.0" 13 }

    ```


    # Listing 5.1: composer.json


    We will interact with the filesystem using a \League\Flysystem\Filesystem object.
    In order to instantiate a filesystem we need to first create the Adapter. We are
    using the Local adapter which requires we pass the folder we want to use as the
    root of our filesystem as parameter to the constructor. We import the namespaces
    from Flysystem, and then create the objects like this:


    ```

    <?php

    use League\Flysystem\Adapter\Local; use League\Flysystem\Filesystem;

    $adapter = new Local(__DIR__.''../data''); $filesystem = new Filesystem($adapter);

    ```


    Lets create a simple data structure in JSON format. We can use PHP’s built in
    json_decode() function to convert the JSON data in the file to a PHP array. In
    your data folder create a file data/menu.json as per listing 5.2.


    ```

    1 {

    2 "index": {

    3 "title": "Hello World!",

    4 "content": "Welcome to my PHP framework."

    5 },

    6 "about": {

    ```'
