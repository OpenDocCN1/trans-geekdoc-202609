    controllers can be mapped to different requests, and how different HTTP methods
    can be mapped to different callback methods on the controllers. We urgently need
    to deal with dependencies before our controllers get too complicated.


    ## Chapter 8


    ### Dependency Injection


    We now have two controllers. If you look in the constructors for both BasicPageController
    and ContactController you will see some duplicate code. Both controllers have
    a dependency on the Twig system that they use to render the output. Both controllers
    currently instantiate their own version of the Twig environment and store it in
    an instance variable. Duplicating code like this is never a good idea if you care
    about the maintainability of your software. If the Twig code needs to change you’ve
    got to find every place it’s used and update it. That might not be as much of
    an issue here, with just two controllers, but as the system grows so does the
    complexity. Keeping things separate is important.


    The Twig dependency is hard-coded into both our controllers. The BasicPageController
    also has a hard-coded dependency on our $filesystem object, and our menu.json
    configuration.


    Testing objects with hard-coded dependencies is difficult. As you saw earlier
    in our brief look at testing, we ideally want to test each bit of functionality
    separately.


    If we can remove the hard-coded dependencies we can make our controllers a bit
    easier to understand, easier to maintain, and isolate functionality. We do this
    by using dependency injection, which simply means we pass in the dependencies
    rather than create them in the class. So, in the case of the ContactController
    we pass in the Twig environment to the constructor:


    ```php

    public function __construct(Twig_Environment $twig) {

    $this->twig = $twig;

    }

    ```


    In the case of the BasicPageController we pass in the Twig environment and the
    menu config into the constructor. We no longer need the $filesystem as this was
    just used to load the config:


    ```php

    public function __construct(Twig_Environment $twig, $menu) {

    $this->twig = $twig;

    $this->menu = $menu;

    }

    ```


    Our controllers are now much simpler, but this makes our App a bit more complicated.
    We need to instantiate the dependencies so that we can pass them into the controllers.
    Because both controllers use Twig, I’ve added it as a global service by creating
    an instance variable in our App constructor. I’ve also added the $filesystem in
    the same way:


    ```php

    protected $twig;

    protected $filesystem;

    public function __construct() {

    $loader = new Twig_Loader_Filesystem(__DIR__ . ''/../templates'');

    $this->twig = new Twig_Environment($loader);

    $adapter = new Local(__DIR__ . ''/../data'');

    $this->filesystem = new Filesystem($adapter);

    }

    ```


    I then added a private method that loads the menu configuration:


    ```php

    private function getMenuConfig()

    {

    return json_decode($this->filesystem->read(''menu.json''), true);

    }

    ```


    And now update the router to create and pass the dependencies into the controllers:


    ```php

    switch ($path) {

    case ''/'':

    case ''/index'':

    case ''/about'':

    $menu = $this->getMenuConfig();

    $controller = new BasicPageController($this->twig, $menu);

    return $controller->get($path);

    case ''/contact'':

    $controller = new ContactController($this->twig);

    if ($method == ''POST'')

    {

    return $controller->post($request);

    }

    return $controller->get();

    }

    ```


    ## Testing


    Now that our controllers are independent, they should be easier to test. Let’s
    try this out by revisiting our simple test.php script. Listing 8.1 shows how the
    functionality of the controller can be tested separately. We’re not testing the
    dependencies, so we create fake (simplified) versions of the dependencies and
    pass them in to the controller. We do this for all the scenarios we want to test
    our controller against.


    ```php

    <?php

    use Weekend\Controller\BasicPageController;

    require_once ''vendor/autoload.php'';

    $templates = [

    ''index.html'' => ''{{ title }}'',

    ];

    $twig = new Twig_Environment(

    new Twig_Loader_Array($templates));

    $menu = [''test'' => [

    ''title'' => ''Hello World!'',

    ''content'' => ''Test content''

    ]];

    $controller = new BasicPageController($twig, $menu);

    $output = $controller->get(''/test'');

    if (strpos($output, "Hello World!"))

    {

    echo "Test passed!", PHP_EOL;

    }

    ```


    **Listing 8.1:** test.php


    This is a simple example, and in reality you would probably use a testing framework.
    PHPUnit is a popular testing framework and provides a mechanism to create fake
    objects (or Mocks, as they’re called in testing) to use as dependencies. Many
    PHP packages come with adapters and plugins to use as dependencies in tests. For
    example, the Flysystem package we are using as a filesystem abstraction provides
    a Memory and a Null adapter that you can use to create fake filesystems in your
    tests.

