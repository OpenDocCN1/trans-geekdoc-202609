    ## Chapter 6 Routing


    We’ve got a templating system, and a basic flat file data store. Now we need the
    ability to serve different responses based on the request. Web frameworks tend
    to use a design pattern called Front Controller where a single script is responsible
    for handling all requests. This usually requires some configuration of the web
    server. If you don’t include configuration for the web server, you would need
    to include the name of your controller script in every URL of your site, and your
    URLs would look like this:


    http://example.com/index.php?page=about


    when what you really want is:


    http://example.com/about


    You may want to pass in more information via the URL. For example, if you want
    to display an article with ID=1 your URL might be:


    http://example.com/index.php?type=article&id=1


    when you really want:


    http://example.com/article/1


    or maybe even:


    http://example.com/articles/my-article-title


    Without configuration, the web server does not know that it should map all incoming
    requests to your front controller script. When it sees:


    http://example.com/about


    it might try to load a file called about or about/index.html and return a 404
    error.


    ### Server Configuration


    The process for configuring your front controller will depend on what server you
    are using. I give hints at how to configure this on both Apache and Nginx below.
    For this weekend we are only using the PHP built-in web server. This dev server
    doesn’t need any configuration. We automatically get routing to our index.php
    file for free when we start the built-in server with:


    ```

    $ php -S localhost:4000 -t public/

    ```


    If you are using Apache then you can create a .htaccess file to add your web server
    configuration. Something like this will work for Apache:


    ```

    RewriteEngine On

    RewriteCond %{REQUEST_FILENAME} !-f

    RewriteCond %{REQUEST_FILENAME} !-d

    RewriteRule . index.php

    [L]

    ```


    This requires Apache’s rewrite module to be enabled. The configuration first checks
    that the request is not for an existing file (images, css, js, etc) and then routes
    everything else to index.php.


    Nginx is another popular web server used with PHP. In which case you will add
    something like this to your nginx.conf:


    ```

    try_files $uri $uri/ /index.php;

    ```


    ## Creating Responses


    We added in the HTTP Foundation component to give us a nice object-oriented interface
    for working with HTTP messages. We saw how to create an object from the HTTP request.
    Now let''s use the HTTP Foundation to create our HTTP response objects too. Up
    until now we have been printing the output directly, and relying on PHP to send
    this as the response. It''s easy to turn this into a `Response` object thanks
    to HttpFoundation. The component provides different response types to make it
    easy to send JSON results, or binary files, but for now we will just use a standard
    HTML response.


    The package provides a few different ways of creating responses. You can create
    a new `Response` object:

    `use Symfony\Component\HttpFoundation\Response; $response = new Response($content);`


    You can also set the HTTP status code and HTTP headers via the constructor. By
    default the HTTP status code will be 200. If you want to serve a “404 page not
    found” you can create a response like this:

    `$response = new Response(“not found”, 404);`


    Once you have finished generating the response you have to send it to the user.
    This is done by calling `send()` on the `$response` object, like this:

    `$response->send();`


    A convenient factory method is also provided, to which you can also (optionally)
    provide content, status, and headers:

    `$response = Response::create($content, $status, $headers);`


    The default content is the empty string, so you will want to provide your own
    value for this. You can omit status and headers and use the defaults (assuming
    nothing went wrong). The default status is 200. The factory method supports chaining
    when generating the response, so you can call the `send()` method directly, like
    this:

    `Response::create($content)->send();`


    Listing 6.1 shows the new version of our `index.php` file that wraps the Twig
    result as a HTTP Request object and sends it (line 20).


    ```

    1 <?php

    2 use League\Flysystem\Adapter\Local;

    3 use League\Flysystem\Filesystem;

    4 use Symfony\Component\HttpFoundation\Request;

    5 use Symfony\Component\HttpFoundation\Response;

    6

    7 require __DIR__.''../vendor/autoload.php'';

