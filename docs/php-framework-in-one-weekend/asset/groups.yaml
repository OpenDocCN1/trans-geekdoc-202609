    \ $filesystem 依赖项，尽管它并不是在每个请求中都被使用。我们可以通过使用依赖注入容器来解决这两个问题。\n\n让我们抽象一下，以便更详细地了解依赖注入的工作原理。我们有一个类\
    \ A，它需要 B，但我们不想在 A 内部硬编码 B 的创建。因此我们将 B 传递给 A 的构造函数。\n\n```\nclass A\n{\npublic\
    \ function doSomething() { $b = new B();\nreturn $b->run($this->data);\n}\n}\n\
    $a = new A();\n$a->doSomething();\n```\n\n我们使用依赖注入，并这样做：\n\n```\nclass A {\nprotected\
    \ $b;\npublic function __construct(B $b) {\n$this->b = $b;\n}\npublic function\
    \ doSomething() {\nreturn $this->b->run($this->data);\n}\n}\n$b = new B();\n$a\
