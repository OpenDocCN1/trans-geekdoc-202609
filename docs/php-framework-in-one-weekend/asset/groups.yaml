    # DI Container


    We’ve seen how using dependency injection simplified our controller classes. In
    general, dependency injection makes code easier to maintain, easier to reuse,
    and more testable. But, it made the code that called our controllers do more work
    as the calling code had to create and pass in the dependencies before it could
    use the controllers. We also instantiated the $filesystemdependency even though
    it wasn’t used on every request. We can fix both of these issues by using a dependency
    injection container.


    Let’s get a bit abstract for a second, so we can see in more detail how dependency
    injection works. We have a class A that needs a B, but we don’t want to hard code
    the creation of B inside A. So we pass B into A’s constructor.


    Instead of this (pseudocode):


    ```

    class A

    {

    public function doSomething() { $b = new B();

    return $b->run($this->data);

    }

    }

    }

    $a = new A();

    $a->doSomething();

    ```


    We use dependency injection, and do this:


    ```

    class A {

    protected $b;

    public function __construct(B $b) {

    $this->b = $b;

    }

    public function doSomething() {

    return $this->b->run($this->data); }

    }

    $b = new B();

    $a = new A($b);

    $a->doSomething();

    ```


    But what if b also has dependencies? And those dependencies have dependencies?
    The process of creating an object could get very complex. You end up with:


    ```

    $d = new D();

    $c = new C();

    $b = new B($c, $d); $a = new A($b);

    $a->doSomething();

    ```


    When all you really wanted to do was:


    ```

    $a = new A();

    $a->doSomething();

    ```


    The solution provided by most PHP web frameworks is some mechanism for managing
    dependencies and dependency injection. Essentially, this is just a recommended
    way of creating objects and configuring the dependencies they require. This is
    usually called a container. Our pseudocode example using a container might look
    something like this:


    ```

    $container->get(''A'')->doSomething();

    ```'
  - '[PAGE 46]


    There are many options available for PHP, including:


    +   - Symfony provides a DI component[26] that allows you to configure dependencies
    using XML, JSON or PHP.

    +   - Pimple[24] is a good stand-alone option that is used by the Silex micro-framework.

    +   - Container[11] is a solution offered by the same team of developers that
    created the filesystem abstraction we are using.

    +   - Auryn[1] provides auto-wiring of dependencies.


    **Note** It is important to note that the DI container should only be used to
    create the objects needed to run your app. You should never pass a DI container
    into a class as a dependency. This actually happens quite a lot, and is considered
    an *anti-pattern* (i.e. opposite to best practise). What you''ve done in this
    case is convert your DI container into a *service locator* which does the opposite
    of what dependency injection should do. It hides dependencies deep inside your
    classes, when you''re really trying to expose and provide all dependencies at
    the top level.'
