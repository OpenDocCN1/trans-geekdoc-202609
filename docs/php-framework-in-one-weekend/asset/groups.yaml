    \ controller classes. In general, dependency injection makes code easier to maintain,\
    \ easier to reuse, and more testable. But, it made the code that called our controllers\
    \ do more work as the calling code had to create and pass in the dependencies\
    \ before it could use the controllers. We also instantiated the $filesystem dependency\
    \ even though it wasn’t used on every request. We can fix both of these issues\
    \ by using a dependency injection container.\n\nLet’s get a bit abstract for a\
    \ second, so we can see in more detail how dependency injection works. We have\
    \ a class A that needs a B, but we don’t want to hard code the creation of B inside\
    \ A. So we pass B into A’s constructor.\n\nInstead of this (pseudocode):\n\n```\n\
    class A\n{\npublic function doSomething() { $b = new B();\nreturn $b->run($this->data);\n\
    }\n}\n$a = new A();\n$a->doSomething();\n```\n\nWe use dependency injection, and\
    \ do this:\n\n```\nclass A {\nprotected $b;\npublic function __construct(B $b)\
    \ {\n$this->b = $b;\n}\npublic function doSomething() {\nreturn $this->b->run($this->data);\n\
    }\n}\n$b = new B();\n$a = new A($b);\n$a->doSomething();\n```\n\nBut what if b\
    \ also has dependencies? And those dependencies have dependencies? The process\
    \ of creating an object could get very complex. You end up with:\n\n```\n$d =\
    \ new D();\n$c = new C();\n$b = new B($c, $d);\n$a = new A($b);\n$a->doSomething();\n\
    ```\n\nWhen all you really wanted to do was:\n\n```\n$a = new A();\n$a->doSomething();\n\
    ```\n\nThe solution provided by most PHP web frameworks is some mechanism for\
    \ managing dependencies and dependency injection. Essentially, this is just a\
    \ recommended way of creating objects and configuring the dependencies they require.\
    \ This is usually called a container. Our pseudocode example using a container\
    \ might look something like this:\n\n```\n$container->get('A')->doSomething();\n\
    ```\n\nThere are many options available for PHP, including:\n\n- Symfony provides\
    \ a DI component[26] that allows you to configure dependencies using XML, JSON\
    \ or PHP.\n- Pimple[24] is a good stand-alone option that is used by the Silex\
    \ micro-framework.\n- Container[11] is a solution offered by the same team of\
    \ developers that created the filesystem abstraction we are using.\n- Auryn[1]\
    \ provides auto-wiring of dependencies.\n\n### Note\nIt is important to note that\
    \ the DI container should only be used to create the objects needed to run your\
    \ app. You should never pass a DI container into a class as a dependency. This\
    \ actually happens quite a lot, and is considered an *anti-pattern* (i.e. opposite\
    \ to best practise). What you've done in this case is convert your DI container\
    \ into a *service locator* which does the opposite of what dependency injection\
    \ should do. It hides dependencies deep inside your classes, when you're really\
    \ trying to expose and provide all dependencies at the top level.\n\n## Using\
    \ a DI Container\n\nWe will configure a dependency injection container to create\
    \ objects and their dependencies when we request them. Doing this means that our\
    \ objects will only get instantiated when they are needed, and make the calling\
    \ code easier to write as we will be able to just create objects, without worrying\
    \ about instantiating dependencies first.\n\nWe will use the Symfony Dependency\
    \ Injection container and a YAML configuration file. Use the Composer require\
    \ command to install these PHP packages as dependencies:\n\n```\n$ composer require\
    \ symfony/dependency-injection\n$ composer require symfony/config\n$ composer\
    \ require symfony/yaml\n```\n\nWe can now remove the _global services_ we created\
    \ in App and replace them with the Container:\n\n```\nprotected $container;\n\
    public function __construct() {\n$this->container = new ContainerBuilder();\n\
    $loader = new YamlFileLoader($this->container, new FileLocator(__DIR__));\n$loader->load('services.yml');\n\
    }\n```\n\nThis code uses a YamlFileLoader to load up a configuration file where\
    \ our _service_ definitions are stored. Listing 8.2 shows the services.yml config\
    \ file for our example. The format of this file is defined by the Symfony DI container.\
    \ It allows you to specify a parameters section, and a list of services. The services\
    \ are the objects that the container knows how to build. The configuration for\
    \ each one specifies which class is used, and what arguments are needed for its\
    \ constructor. These can reference other services (dependencies) or configuration\
    \ from the parameters section.\n\n```\nparameters:\n  template_dir: '../templates'\n\
    \n  data_dir: '../data'\n\nservices:\n  loader:\n    class: Twig_Loader_Filesystem\n\
    \    arguments: [\"%template_dir%\"]\n  twig:\n    class: Twig_Environment\n \
    \   arguments: [\"@loader\"]\n  adapter:\n    class: League\\Flysystem\\Adapter\\\
    Local\n    arguments: [\"%data_dir%\"]\n  filesystem:\n    class: League\\Flysystem\\\
    Filesystem\n    arguments: [\"@adapter\"]\n```\n\n**Listing 8.2:** src/services.yml\n\
    \nWe get objects out of the container when we need them. Only the dependencies\
    \ that actually get used will be instantiated, and the container will wire together\
    \ all the dependencies for us. We just request the item we want, like this:\n\n\
    ```\n$fs = $this->container->get('filesystem');\n```\n\nSo, as an example, our\
    \ /contact route becomes this:\n\n```\ncase '/contact':\n$twig = $this->container->get('twig');\n\
    $controller = new ContactController($twig);\nif ($method == 'POST') {\nreturn\
    \ $controller->post($request);\n}\nreturn $controller->get();\n```\n\nAs you can\
    \ see, in this example, we get() the dependency from the container, and pass it\
    \ to the controller as before. We should probably add this dependency to our configuration\
    \ as well. Let's add the controllers to our services.yml file then use the container\
    \ to create them.\n\nThe configuration for our ContactController is quite simple,\
    \ as it just has a dependency on Twig. We add this to the services: section of\
    \ our services.yml file:\n\n```\ncontact_controller:\n  class: Weekend\\Controller\\\
    ContactController\n  arguments: ['@twig']\n```\n\nWe can now get the controller\
    \ directly from the DI container. It will automatically create the Twig dependency\
    \ that is required when creating the contact controller. The **BasicPageController\
    \ is a bit more complicated because we are doing some processing** of the menu\
    \ config before we pass it to the constructor. To help with this we will create\
    \ a service class that will load and manage our configuration. Create a src/Service\
    \ folder and use listing 8.3 as a guide for creating the ConfigService class.\n\
    \n```\n<?php\nnamespace Weekend\\Service;\n\nuse League\\Flysystem\\FilesystemInterface;\n\
    \nclass ConfigService\n{\n  protected $config;\n  public function __construct(FilesystemInterface\
    \ $fs)\n  {\n    $this->config = json_decode($fs->read('menu.json'), true);\n\
    \  }\n\n  public function getConfig()\n  {\n    return $this->config;\n  }\n}\n\
    ```\n\n**Listing 8.3:** src/Service/ConfigService.php\n\nAside In the ConfigService\
    \ class constructor I have actually defined the parameter type as FilesystemInterface.\
    \ An interface is a bit like a contract. It doesn't specify any details about\
    \ the implementation, it only states what functionality exists. It’s a specification.\
    \ Classes can declare that they implement the interface specification, meaning\
    \ that they provide an implementation for all the functionality described by the\
    \ interface specification. This allows us to easily swap in other implementations\
    \ later. We only use functionality defined in the interface, so we can be sure\
    \ that any other implementation provided will work.\n\nWe can now add this ConfigService\
    \ to our services.yml file:\n\n```\nconfig_service:\n  class: Weekend\\Service\\\
    ConfigService\n  arguments: ['@filesystem']\n```\n\nAnd also add the BasicPageController\
    \ which depends on Twig and this new config service:\n\n```\nbasic_page_controller:\n\
    \  class: Weekend\\Controller\\BasicPageController\n  arguments: ['@twig', '@config_service']\n\
    ```\n\nUpdate the constructor in BasicPageController to take the ConfigService\
    \ as a dependency, rather than the raw menu data that was being passed before:\n\
    \n```\npublic function __construct(Twig_Environment $twig, ConfigService $config)\
    \ {\n$this->twig = $twig;\n$this->config = $config;\n}\n```\n\nUpdate the get()\
    \ callback in the controller so that it fetches the $menuConfiguration from the\
    \ ConfigService:\n\n```\npublic function get($path) {\n$Page = ($path == '/')\
    \ ? 'index' : substr($path, 1);\n$menu = $this->config->getConfig();\nif (isset($menu[$Page]))\
    \ {\n$content = $this->twig->render('index.html', $menu[$page]);\nreturn new Response($content);\n\
    }\nreturn Response::create(\"not found\", 404);\n}\n```\n\nAnd then finally, tidy\
    \ up the router so that it now fetches the controllers from the container:\n\n\
    ```\nswitch ($path) {\ncase '/':\ncase '/index':\ncase '/about':\n$controller\
    \ = $this->container->get('basic_page_controller');\nreturn $controller->get($path);\n\
    case '/contact':\n$controller = $this->container->get('contact_controller');\n\
    if ($method == 'POST') {\nreturn $controller->post($request);\n}\nreturn $controller->get();\n\
    }\n```\n\nMaybe you can start to think about ways to improve this. The run() method\
    \ now doesn't have to deal with instantiating dependencies and controllers. In\
    \ run() we are just dealing with routing requests to the correct controller callback.\
    \ How would you extract the route configuration from the router logic? This is\
    \ something we’ll come back to, but for now consider the following example. Can\
    \ you see how to improve it?\n\n```\npublic function run(Request $request) {\n\
    $path = $request->getPathInfo();\n$method = strtolower($request->getMethod());\n\
    $routes = [\n'/' => 'basic_page_controller',\n'/index' => 'basic_page_controller',\n\
    '/about' => 'basic_page_controller',\n'/contact' => 'contact_controller',\n];\n\
    if (isset($routes[$path])) {\n$controller = $this->container->get($routes[$path]);\n\
    if (is_callable([$controller, $method])) {\nreturn call_user_func_array([$controller,\
    \ $method], [$request]);\n}\n}\n}\n```\n"
