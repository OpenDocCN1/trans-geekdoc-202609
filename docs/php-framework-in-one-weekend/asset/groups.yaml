    You may have noticed that we used a different syntax in our latest Twig templates.
    The first templates we created just made use of the expression delimiters, for
    example {{ title }}. We now introduce the other type of delimiters, {% ... %}.


    The double curly-braces ( {{ ... }} ) always contain expressions. The content
    is evaluated and printed out. It may contain a single variable, in which case
    the value of that variable is output. It can contain more complex expressions,
    and use filters. Twig evaluates the expressions, passes the result through any
    specified filters, and outputs the result into the template.


    We can add logic to our templates using the other style of delimiters ( {% ...
    %} ). This last example shows them used to define inheritance between templates,
