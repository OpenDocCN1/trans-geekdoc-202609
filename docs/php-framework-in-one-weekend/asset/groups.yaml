    15

    16 $loader = new Twig_Loader_Filesystem(__DIR__.''../templates'');

    17 $twig = new Twig_Environment($loader);

    18

    19 $content = $twig->render(''index.html'', $variables[''index'']);

    20 Response::create($content)->send();

    ```


