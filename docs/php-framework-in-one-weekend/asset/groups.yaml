    \n## 接下来？\n\n你现在已经有了自己 PHP Web 框架的雏形。以下是一些关于下一步发展方向的想法：\n\n- 将其用于创建项目的起点。收集你自己偏好的\
    \ PHP 包集合，包含配置和样板代码，以便在开始新项目时节省时间。\n- 尝试替代的依赖注入容器。试着使用 Pimple[24] 作为应用的基础。你更喜欢这种工作方式吗？还是你喜欢\
    \ YAML 配置文件？\n- 添加缓存支持以提升性能。\n- 完成并改进联系控制器中的表单处理。\n- 学习 PHP 安全，包括 CSRF[18]。你可以在这里如何扩展框架以使其更安全？你可以在框架中提供哪些设施，以便在未来的项目中更容易实现安全性？\n\
    - 使用你自己的改进版本替换我们的基础路由器。阅读这篇关于使用正则表达式的博客[7]并尝试 FastRoute[8]。或者，如果你更喜欢更友好的 API，试试\
    \ Route[22]。\n- 查看 Awesome PHP[3] 列表，找出你认为对项目有用的包，并将它们集成到你的框架中。\n- 使用 Symfony\
