- pgno: 18
  md: '# # Chapter 3

    HTTP


    Our web framework is going to deal with HTTP messages. We will receive a HTTP

    request, and return a HTTP response.


    We need to parse and extract information from the HTTP request. What resource
    is being

    requested? What action is to be taken? What content types does the client accept?
    Our

    application may be accepting input from the user, in which case we''ll need to
    look in the

    HTTP request for form field inputs, url parameters, and uploaded files.


    We also need to construct a valid HTTP response so the client can understand what
    we are

    sending back to them in reply to their request. This includes the content, and
    information

    about the format and how it is encoded.


    Rather than studying the specifications of HTTP messages and URIs we can use a
    PHP

    package that hides all the details and provides a more developer-friendly way
    of receiving

    and creating HTTP messages. The PHP FIG (Framework Interoperability Group) has

    defined a standard set of HTTP message interfaces[20] which frameworks and PHP

    packages can adopt to improve interoperability. You can search Packagist[14] for
    popular

    PHP packages related to HTTP. We will use the most popular HTTP message abstraction,

    the Symfony HttpFoundation component[27]. It is the same component used in many

    popular PHP systems like Drupal and Laravel.


    Let''s go back to our composer.jsonand add the HTTP Foundation component to our

    requirements, so Composer can install it in our project. You can edit the composer.jsonfile

    manually, or use the Composer requirecommand:


    ```

    $ composer require symfony/http-foundation

    ```


    This will download the most recent stable version. At the time of writing this
    is v3.0.6.

    You will notice that it also downloads the mbstring polyfill package because it
    is a

    required dependency of the HTTP Foundation component. The requireSection of your

    composer.json configuration file now looks something like listing 3.1.


    ```

    9 "require": {

    10 "symfony/http-foundation": "^3.0" 11 }

    Listing 3.1: composer.json

    ```'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# HTTP Requests


    PHP makes the data from the incoming request available as global variables. They
    look like this:


    ```

    $name = $_GET[''name''];

    ```


    We don’t want to work with these global variables directly. And, now we have a
    library of code to make working with HTTP messages easier, we don’t have to. The
    HTTP Foundation component can create a request object for you from the data provided
    by PHP in the global variables.


    When we used the Composer requirecommand to download the package it added it to
    the autoloader so that the classes are automatically available to us. The code
    for them will be automatically included when we first use the class in our code.
    We can create an object to represent the request like this:


    ```

    $request = \Symfony\Component\HttpFoundation\Request::createFromGlobals();

    ```


    When we are including code from multiple packages we need to ensure that the names
    of things defined by the packages don’t clash. PHP provides a feature called namespaces
    that protects against naming collisions. You can see in the previous example that
    the Request object provided by the HttpFoundation component has the _fully qualified_
    name:


    ```

    \Symfony\Component\HttpFoundation\Request

    ```


    Because we don’t have anything called Request in this file there will not be a
    clash of names. We can therefore tidy up our code by _importing_ the name to our
    local scope with PHP’s usekeyword. You can see this demonstrated in listing 3.2
    (lines 2 and 5).


    Now we have an object we can use to get information from the request:


    ```

    $name = $request->get(''name'');

    ```


    You will notice that I have also added a print_rstatement to our example page
    (line 16, listing 3.2) so you can see the structure of the $requestobject. Listing
    3.2 shows our new public/index.phpfile.


    ```

    1 <?php

    2 use Symfony\Component\HttpFoundation\Request;

    3 require __DIR__.''../vendor/autoload.php'';

    4

    10 <head>

    11 <meta charset="UTF-8">

    12 <title>Document</title>

    13 </head>

    14 <body>

    15 <h1>Hello <?php print $name; ?>!</h1> 16 <pre><?php print_r($request); ?></pre>
    17 </body>

    18 </html>

    ```


    ```

    5 $request = Request::createFromGlobals();

    6 $name = $request->get(''name'');

    7 ?>

    8 <!DOCTYPE html>

    9 <html lang="en">

    ```'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Listing 3.2: public/index.php


    Start PHP’s built-in web server (if it’s not already still running from before)
    and load up

    the page in your browser to check it works.


    ```

    $ php -S localhost:4000 -t public/

    ```


    Be sure to provide a value for the $name parameter in the URL, like this:


    ```

    http://localhost:4000/?name=World

    ```


    NB: Directly printing out user input is never a good idea. It is the easiest way
    to introduce

    security issues into your code. In this example we have taken the $name variable
    directly

    from user input and then printed it out. In reality you would filter this value
    to remove any

    dangerous characters to prevent against cross-site scripting (XSS). We’re not
    doing this

    here because we’re going to use a templating system that takes care of this for
    us. You can

    confirm that this is insecure by loading the following URL:


    ```

    http://localhost:4000/?name=Danger<script>alert(’hi!’)</script>

    ```


    You will see a JavaScript alert. The code in the GET parameter is embedded directly
    in the

    page. You don’t have to be a security expert to realise that allowing users to
    inject

    JavaScriptcodeintothepageisabadidea.'
