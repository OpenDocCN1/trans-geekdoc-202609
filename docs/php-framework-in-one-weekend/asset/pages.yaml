  md: '# # Preface


    > > “a weekend, the fundamental unit of coding self-improvement”

    > > Peter Shirley


    I recently enjoyed working through Peter Shirley''s Ray Tracing in One Weekend[21].
    Over the course of a few chapters, Peter guides you through the process of building
    a basic ray tracing application. It''s not a comprehensive tool, but in one weekend
    you cover enough material to learn the fundamental concepts. Peter says he included
    “the most primal set of these assignments so that it''s very doable in a weekend,
    the fundamental unit of coding self-improvement.”'
