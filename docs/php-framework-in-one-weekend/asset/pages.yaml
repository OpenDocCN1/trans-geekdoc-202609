- pgno: 42
  md: '# Chapter 8

    Dependency Injection


    We now have two controllers. If you look in the constructors for both BasicPageController
    and ContactController you will see some duplicate code. Both controllers have
    a dependency on the Twig system that they use to render the output. Both controllers
    currently instantiate their own version of the Twig environment and store it in
    an instance variable. Duplicating code like this is never a good idea if you care
    about the maintainability of your software. If the Twig code needs to change you’ve
    got to find every place it’s used and update it. That might not be as much of
    an issue here, with just two controllers, but as the system grows so does the
    complexity. Keeping things separate is important.


    The Twig dependency is hard-coded into our both our controllers. The BasicPageController
    also has a hard-coded dependency on our $filesystem object, and our menu.jsonConfiguration.


    Testing objects with hard-coded dependencies is difficult. As you saw earlier
    in our brief look at testing, we ideally want to test each bit of functionality
    separately.


    If we can remove the hard-coded dependencies we can make our controllers a bit
    easier to understand, easier to maintain, and isolate functionality. We do this
    by using dependency injection, which simply means we pass in the dependencies
    rather than create them in the class. So, in the case of the ContactController
    we pass in the Twig environment to the constructor:


    ```

    ```php

    public function __construct(Twig_Environment $twig) {

    $this->twig = $twig; }

    ```

    ```


    In the case of the BasicPageController we pass in the Twig environment and the
    menu config into the constructor. We no longer need the $filesystem as this was
    just used to load the config:


    ```

    ```php

    public function __construct(Twig_Environment $twig, $menu) {

    $this->twig = $twig; $this->menu = $menu; }

    ```

    ```


    Our controllers are now much simpler, but this makes our Appa bit more complicated.
