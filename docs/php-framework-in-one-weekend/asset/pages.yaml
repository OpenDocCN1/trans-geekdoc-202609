- pgno: 29
  md: '# # Chapter 6 Routing


    We’ve got a templating system, and a basic flat file data store. Now we need the
    ability to serve different responses based on the request. Web frameworks tend
    to use a design pattern called Front Controller where a single script is responsible
    for handling all requests. This usually requires some configuration of the web
    server. If you don’t include configuration for the web server, you would need
    to include the name of your controller script in every URL of your site, and your
    URLs would look like this:


    http://example.com/index.php?page=about

    when what you really want is:

    http://example.com/about


    You may want to pass in more information via the URL. For example, if you want
    to display an article with ID=1 your URL might be:


    http://example.com/index.php?type=article&id=1

    when you really want:

    http://example.com/article/1

    or maybe even:

    http://example.com/articles/my-article-title


    Without configuration, the web server does not know that it should map all incoming
    requests to your front controller script. When it sees:

    http://example.com/about it might try to load a file called aboutOR about/index.htmland
    return a 404 error.'
