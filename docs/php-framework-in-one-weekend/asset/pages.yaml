- pgno: 45
  md: '# DI Container


    We’ve seen how using dependency injection simplified our controller classes. In
    general, dependency injection makes code easier to maintain, easier to reuse,
    and more testable. But, it made the code that called our controllers do more work
    as the calling code had to create and pass in the dependencies before it could
    use the controllers. We also instantiated the $filesystemdependency even though
    it wasn’t used on every request. We can fix both of these issues by using a dependency
    injection container.


    Let’s get a bit abstract for a second, so we can see in more detail how dependency
    injection works. We have a class A that needs a B, but we don’t want to hard code
    the creation of B inside A. So we pass B into A’s constructor.


    Instead of this (pseudocode):


    ```

    class A

    {

    public function doSomething() { $b = new B();

    return $b->run($this->data);

    }

    }

    }

    $a = new A();

    $a->doSomething();

    ```


    We use dependency injection, and do this:


    ```

    class A {

    protected $b;

    public function __construct(B $b) {

    $this->b = $b;

    }

    public function doSomething() {

    return $this->b->run($this->data); }

    }

    $b = new B();

    $a = new A($b);

    $a->doSomething();

    ```


    But what if b also has dependencies? And those dependencies have dependencies?
    The process of creating an object could get very complex. You end up with:


    ```

    $d = new D();

    $c = new C();

    $b = new B($c, $d); $a = new A($b);

    $a->doSomething();

    ```


    When all you really wanted to do was:


    ```

    $a = new A();

    $a->doSomething();

    ```


    The solution provided by most PHP web frameworks is some mechanism for managing
    dependencies and dependency injection. Essentially, this is just a recommended
    way of creating objects and configuring the dependencies they require. This is
    usually called a container. Our pseudocode example using a container might look
    something like this:


    ```

    $container->get(''A'')->doSomething();

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'There are many options available for PHP, including:


    +   - Symfony provides a DI component[26] that allows you to configure dependencies
    using XML, JSON or PHP.

    +   - Pimple[24] is a good stand-alone option that is used by the Silex micro-framework.

    +   - Container[11] is a solution offered by the same team of developers that
    created the filesystem abstraction we are using.

    +   - Auryn[1] provides auto-wiring of dependencies.


    **Note** It is important to note that the DI container should only be used to
    create the objects needed to run your app. You should never pass a DI container
    into a class as a dependency. This actually happens quite a lot, and is considered
    an *anti-pattern* (i.e. opposite to best practise). What you''ve done in this
    case is convert your DI container into a *service locator* which does the opposite
    of what dependency injection should do. It hides dependencies deep inside your
    classes, when you''re really trying to expose and provide all dependencies at
    the top level.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Using a DI Container


    We will configure a dependency injection container to create objects and their
    dependencies when we request them. Doing this means that our objects will only
    get instantiated when they are needed, and make the calling code easier to write
    as we will be able to just create objects, without worrying about instantiating
    dependencies first.


    We will use the Symfony Dependency Injection container and a YAML configuration
    file. Use the Composer requirecommand to install these PHP packages as dependencies:


    ```

    $ composer require symfony/dependency-injection $ composer require symfony/config

    $ composer require symfony/yaml

    ```


    We can now remove the _global services_ we created in App and replace them with
    the Container:


    ```

    protected $container;

    public function __construct() {

    $this->container = new ContainerBuilder(); $loader = new YamlFileLoader($this->container,
    new

    FileLocator(__DIR__));

    $loader->load(''services.yml'');

    }

    ```


    This code uses a YamlFileLoader to load up a configuration file where our _service_
    definitions are stored. Listing 8.2 shows the services.ymlconfig file for our
    example. The format of this file is defined by the Symfony DI container. It allows
    you to specify a parameters section, and a list of services. The services are
    the objects that the container knows how to build. The configuration for each
    one specifies which class is used, and what arguments are needed for it''s constructor.
    These can reference other services (dependencies) or configuration from the parameters
    section.


    ```

    1 parameters:

    2 template_dir: ''../templates''

    3

    4 data_dir: ''../data''

    5

    6 services:

    7 loader:

    8 class: Twig_Loader_Filesystem

    9 arguments: ["%template_dir%"]

    10 twig:

    11 class: Twig_Environment

    12 arguments: ["@loader"]

    13 adapter:

    14 class: League\\Flysystem\\Adapter\\Local 14 arguments: ["%data_dir%"]

    15 filesystem:

    16 class: League\\Flysystem\\Filesystem 17 arguments: ["@adapter"]

    ```


    **Listing 8.2:** src/services.yml


    We get objects out of the container when we need them. Only the dependencies that
    actually get used will be instantiated, and the container will wire together all
    the dependencies for us. We just request the item we want, like this:'
