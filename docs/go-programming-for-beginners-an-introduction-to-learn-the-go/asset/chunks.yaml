    \n## 13.3 向函数传递参数\n\n在函数调用时，通过将参数括在括号内来传递。多个参数用逗号分隔。参数只能传递给接受参数的函数。值得注意的是，函数调用时传递的参数数量和顺序必须与函数定义中一致。\n\
    \n下面是一个 Go 程序，演示接受两个整数并计算其和的函数：\n\n```go\n/*Function Demo 2*/\n/*Package Declaration*/\n\
