  fmt: "\n# 13. Functions\n\nA function is a piece of reusable code that can be \"\
    called\" to perform certain tasks. We have already used a few functions such as\
    \ `Printf`, `Scanln`, `Atoi`, etc. These functions are written by someone else\
    \ and we are using them to make our programming life easier. `Scanln` and `Println`\
    \ are I/O functions which implicitly work with the devices (either directly or\
    \ indirectly) to do the required job. Imagine how inconvenient programming would\
    \ be if we had to write a big piece of code every time we wanted to print something\
    \ on the console. Because `Println` and `Scanln` functions are already defined\
    \ somewhere by someone, programmers like us can simply call them to get our job\
    \ done. In this chapter, we will learn to write our own functions. The topic of\
    \ functions can be broadly classified into two categories – function definition\
    \ and function call.\n\n## 13.1 Function Definition\n\nFunction definition is\
    \ a piece of code that defines what a function does. For example, a function to\
    \ add two number will have the logic to add to numbers in its function definition.\
    \ A program can have zero or more user defined functions. All functions should\
    \ be defined outside the `main` function. The best place to define functions is\
    \ between the package declaration statement and `main` function. Here is a general\
    \ syntax of function definition:\n\n```\nfunc <function name> (<arguments>) <return\
    \ type> {\n    /*Function Body*/\n    //Statements\n}\n```\n\nExample:\n\n```\n\
    func helloFunction() {\n    fmt.Printf(\"\\nHello! We are inside helloFunction!\\\
    n\")\n}\n```\n\nHere are the parts of a basic function definition:\n\n*   **Function\
    \ Name**\n    *   A function name is the name given to a function marked by `<function\
    \ name>` in the above code snippet. This name is used to identify and call the\
    \ function. Function naming rules are the same as identifier/variable naming rules.\n\
    *   **Arguments**\n    *   Arguments (marked by `<arguments>` in the above code\
    \ snippet) are the values that a function \"accepts\" into local variables. These\
    \ values are passed to a function at the time of function call. A function may\
    \ accept zero or more arguments. When there are more than one arguments, they\
    \ should be separated using comma. Arguments are also called Parameters.\n*  \
    \ **Return Type**\n    *   A function can optionally return a value back to the\
    \ calling function. The data type of the value that a particular function is returning\
    \ should be specified in the return type field marked by `<return type>` in the\
    \ above code snippet.\n*   **Function Body**\n"
  trans: "\n\n# 13. 函数\n\n函数是一段可复用的代码，可以被“调用”以执行特定任务。我们已经使用过一些函数，例如 `Printf`、`Scanln`、`Atoi`\
    \ 等。这些函数由他人编写，我们使用它们让编程工作变得更轻松。`Scanln` 和 `Println` 是 I/O 函数，它们隐式地与设备（直接或间接）协作以完成所需工作。想象一下，如果每次想在控制台打印内容都要编写一大段代码，编程将会多么不便。因为\
    \ `Println` 和 `Scanln` 函数已由某人在某处定义好，像我们这样的程序员只需调用它们即可完成工作。在本章中，我们将学习编写自己的函数。函数主题大体可分为两类——函数定义和函数调用。\n\
    \n## 13.1 函数定义\n\n函数定义是一段定义函数功能的代码。例如，一个用于添加两个数字的函数，其函数定义中将包含添加两个数字的逻辑。一个程序可以包含零个或多个用户定义函数。所有函数都应在\
    \ `main` 函数**外部**定义。定义函数的最佳位置在包声明语句和 `main` 函数之间。以下是函数定义的通用语法：\n\n```\nfunc <function\
    \ name> (<arguments>) <return type> {\n    /*Function Body*/\n    //Statements\n\
    }\n```\n\n示例：\n\n```\nfunc helloFunction() {\n    fmt.Printf(\"\\nHello! We are\
    \ inside helloFunction!\\n\")\n}\n```\n\n以下是基本函数定义的组成部分：\n\n*   **函数名**\n    *\
    \   函数名是赋予函数的名称，在上述代码片段中由 `<function name>` 标记。此名称用于标识和调用函数。函数命名规则与标识符/变量命名规则相同。\n\
    *   **参数**\n    *   参数（在上述代码片段中由 `<arguments>` 标记）是函数“接收”到局部变量中的值。这些值在函数调用时传递给函数。一个函数可以接受零个或多个参数。当有多个参数时，应使用逗号分隔。参数也称为形参。\n\
    *   **返回类型**\n    *   函数可以选择性地将一个值返回给调用函数。特定函数返回值的数据类型应在返回类型字段中指定，在上述代码片段中由 `<return\
    \ type>` 标记。\n*   **函数体**\n\n"
