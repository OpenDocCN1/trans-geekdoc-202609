- raw: '14\. Strings A string is a sequence of characters. A constant string can be
    formed by enclosing a sequence of characters inside double quotes. Just like an
    array, individual characters can be accessed with the help of the access operator
    (\[ \]) by specifying their indexes. Index of a string begins at 0 and ends at
    one less than the size of the string . The length of a string can be determined
    using the len(<string>) function. Using the access operator, the individual characters
    can only be read but not set. Here is a simple Go program the demonstrates these
    string basics: /\*String Demo 1\*/ /\*Package Declaration\*/ package main /\*Import
    Statement - import fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/
    func main () { ​ /\*Declare and initialize a string\*/ ​ var name string \= "Monica"
    ​ /\*Fetch length of the string\*/ ​ length := len ( name ) ​ /\*Display the string
    and its length\*/ ​ fmt . Printf ( "\\nname = %s, length = %d\\n" , name , length
    ) ​ /\*Use for loop to print individual characters of the string\*/ ​ for i :=
    0 ; i < length ; i ++ { ​ ​ fmt . Printf ( "\\nCharacter at index %d ==> %c\\n"
    , i , name \[ i \]) ​ } } Output: ![](Image00070.jpg)Individual characters of
    a string can be fetched into a character array using the rune functions as follows:
    <character array var> = \[\]rune(<String>) Example: c\_arr = \[\]rune(str) An
    array of characters can be converted to a string using the string function as
    follows: <string> = string (<character array variable>) str = string (char\_array)
    Here is a program that demonstrates the working of this function: /\*Rune demo\*/
    /\*Package Declaration\*/ package main /\*Import Statement - import fmt package\*/
    import ( "fmt" ) /\*Mandatory main function\*/ func main () { str := "Excelsior"
    ​ str\_length := len ( str ) ​ /\*Use rune to fetchs characters in an array\*/
    ​ str\_char := \[\] rune ( str ) ​ fmt . Printf ( "\\nstr: %s, length: %d" , str
    , str\_length ) ​ fmt . Printf ( "\\n\\nCharacter array: %c\\n" , str\_char )
    ​ fmt . Printf ( "\\nstr\_char character array elements: \\n" ) ​ for i := 0 ;
    i < str\_length ; i ++ { ​ ​ fmt . Printf ( "\\nCharacter at index %d ==> %c\\n"
    , i , str\_char \[ i \]) ​ } } Output: ![](Image00071.jpg)There is a package called
    strings which has many built-in functions that help in string manipulations. Let
    us take a look at a few important ones: 14.1 Concatenating strings Two or more
    strings can be concatenated using the strings.Join function. In order to do so,
    the strings to be concatenated should be placed inside a string array. Here is
    the general syntax: strings.Join(<string array>, <separator>) Example: big\_string
    := strings.Join(arr, “ “) There is an even simpler way of concatenating two or
    more strings – using the \+ operator . General syntax: <concatenated string variable>
    = <string 1> + <string 2> + ... <string n> Example: big\_str := “hello” + “ “
    + “world!” Let us write a program that demonstrates both these concatenation methods:
    /\*String Demo 2 - Concatenation\*/ /\*Package Declaration\*/ package main /\*Import
    Statement - import fmt, strings packages\*/ import ( ​ ​ "fmt" ​ ​ "strings" ​
    ​ ) /\*Mandatory main function\*/ func main () { ​ /\*Declare and initialize a
    string array\*/ ​ var words \= \[\] string { "This" , "is" , "an" , "array" ,
    "of" , "7" , "strings" } ​ /\*Display the string array\*/ ​ fmt . Printf ( "\\nwords
    array: %s\\n" , words ) ​ /\*Concatenate using strings.Join\*/ ​ words\_str :=
    strings . Join ( words , " " ) ​ fmt . Printf ( "\\nConcatenated string (using
    strings.Join): %s\\n" , words\_str ) ​ /\*Short declare some strings\*/ ​ str1
    := "Go" ​ str2 := "Programming" ​ str3 := "Language" ​ /\*Concatenate str1, str2
    and str3\*/ ​ str4 := str1 + " " + str2 + " " + str3 ​ fmt . Printf ( "\\nstr1
    = %s\\nstr2 = %s\\nstr3 = %s\\n\\nConcatenated string (using + operator)\\n\\nstr4
    = %s\\n" , str1 , str2 , str3 , str4 ) } Output: ![](Image00072.jpg)14.2 Compare
    strings The Compare function from the strings  package is used to compare two
    strings. Syntax: strings.Compare(<string1>, <string2>) Example: result := (string1,
    string2) This function returns 0 is both strings are the same, returns \-1 if
    string1 is lexicographically less than string2 and returns 1 if string1 is lexicographically
    greater than string2 . Let us write a program to read two strings from the user
    and compare them: /\*Compare two strings\*/ /\*Package Declaration\*/ package
    main /\*Import Statement - import fmt, bufio, os, strings package\*/ import (
    ​ ​ "fmt" ​ ​ "bufio" ​ ​ "os" ​ ​ "strings" ​ ​ ) /\*Mandatory main function\*/
    func main () { ​ /\*Create an input reader variable of type NewReader using stdin\*/
    ​ inputReader := bufio . NewReader ( os . Stdin ) ​ /\*Prompt the user to enter
