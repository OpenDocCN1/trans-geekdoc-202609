    , first)\n\t} else {\n\t\tfmt.Printf(\"\\nThe given string is not present in the\
    \ main string.\\n\")\n\t}\n}\n```\n\n输出：\n![](img/Image00074.jpg)\n\n## 14.4 修剪字符串\n\
    \n可能需要从字符串中移除不需要的字符。可以使用 `strings` 包中的 `Trim` 函数，如下所示：\n\n```go\n<trimmed_string>\
    \ = strings.Trim(<string>, <character set to be trimmed>)\n```\n\n从用户处读取字符串时，`\\\
    n` 或 `\\r` 或两者都有很大概率被追加到字符串中。可以使用 `Trim` 函数移除这些字符：\n\n```go\nnew_str = strings.Trim(str,\
    \ \"\\n\\r\")\n```\n\n实际上，让我们看看从用户处读取字符串时会发生什么——我们将字符串转换为字符数组来查看每个字符：\n\n```go\n\
    /*Pre-trim demo*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement\
    \ - import fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\
    \n\t\"os\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input\
    \ reader variable of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
    \n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string:\
    \ \")\n\n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
    n')\n\n\tstr_length := len(str)\n\n\tfmt.Printf(\"\\nLength: %d\", str_length)\n\
    \n\t/*Use rune to fetch characters in an array*/\n\tstr_char := []rune(str)\n\n\
    \tfmt.Printf(\"\\n\\nCharacter array: \\n %c \\n\", str_char)\n\n\tfor i := 0;\
    \ i < str_length; i++ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\"\
    , i, str_char[i])\n\t}\n}\n```\n\n输出：\n![](img/Image00075.jpg)\n\n我们输入了单词 Linux，它显然有\
    \ 5 个字符。但长度显示为 7。此外，在打印字符时，我们在位置 5 和 7 看到了两个空字符。让我们稍微调查一下，看看发生了什么。我们将修改以下语句：\n\
    \n```go\nfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\", i, str_char[i])\n\
    ```\n\n改为：\n\n```go\nfmt.Printf(\"\\nCharacter at index %d ==> %X\\n\", i, str_char[i])\n\
    ```\n\n新语句将打印字符的十六进制代码。这是新的输出：\n![](img/Image00076.jpg)\n\n索引 5 处的字符是 D，即 `0x0D`，索引\
    \ 6 处的字符是 A，即 `0x0A`。如果你在 ASCII 表中核对这些十六进制值，就会意识到这些字符分别是 `\\r` 和 `\\n`。\n\n让我们使用\
    \ `Trim` 函数看看会发生什么。这是新程序：\n\n```go\n/*Trim demo*/\n/*Package Declaration*/\npackage\
    \ main\n\n/*Import Statement - import fmt, bufio, os, strings package*/\nimport\
    \ (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\n\
    func main() {\n\t/*Create an input reader variable of type NewReader using stdin*/\n\
    \tinputReader := bufio.NewReader(os.Stdin)\n\n\t/*Prompt the user to enter something*/\n\
    \tfmt.Printf(\"\\nEnter a string: \")\n\n\t/*Read string using ReadString function*/\n\
    \tstr, _ := inputReader.ReadString('\\n')\n\n\t/*Trim to remove unwanted characters*/\n\
    \tstr = strings.Trim(str, \"\\n\\r\")\n\n\tstr_length := len(str)\n\n\tfmt.Printf(\"\
    \\nLength: %d\", str_length)\n\n\t/*Use rune to fetch characters in an array*/\n\
    \tstr_char := []rune(str)\n\n\tfmt.Printf(\"\\n\\nCharacter array: \\n %c \\n\"\
    , str_char)\n\n\tfor i := 0; i < str_length; i++ {\n\t\tfmt.Printf(\"\\nCharacter\
    \ at index %d ==> %c\\n\", i, str_char[i])\n\t}\n}\n```\n\n输出：\n![](img/Image00077.jpg)\n\
    \n## 14.5 大小写转换\n\n可以分别使用 `ToUpper` 和 `ToLower` 函数将字符串转换为大写和小写。\n\n语法：\n```go\n\
    <ustring> = strings.ToUpper(<string>)\n<lstring> = strings.ToLower(<string>)\n\
    ```\n\n示例：\n```go\nstr1 = strings.ToUpper(s)\nstr2 = strings.ToLower(s)\n```\n\
    \n下面是一个演示大小写转换的程序：\n\n```go\n/*Case conversion demo*/\n/*Package Declaration*/\n\
    package main\n\n/*Import Statement - import fmt, bufio, os, strings package*/\n\
    import (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n\t/*Create an input reader variable of type NewReader\
    \ using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\n\t/*Prompt the\
    \ user to enter something*/\n\tfmt.Printf(\"\\nEnter a string: \")\n\n\t/*Read\
    \ string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\n')\n\
    \n\t/*Trim to remove unwanted characters*/\n\tstr = strings.Trim(str, \"\\n\\\
    r\")\n\n\t/*Convert to upper and lower case*/\n\tu_str := strings.ToUpper(str)\n\
    \tl_str := strings.ToLower(str)\n\n\tfmt.Printf(\"\\nOriginal string: %s\\nUpper\
    \ case string: %s\\nLower case string: %s\\n\", str, u_str, l_str)\n}\n```\n\n\
    输出：\n![](img/Image00078.jpg)\n\n"
