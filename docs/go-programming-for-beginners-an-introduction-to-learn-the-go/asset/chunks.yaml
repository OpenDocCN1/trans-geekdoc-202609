    - import fmt, bufio, os, strings package\*/ import ( ​ ​  "fmt" ​ ​ "bufio" ​
    ​ "os" ​ ​ "strings" ​ ​ ) /\*Mandatory main function\*/ func main () { ​ /\*Create
