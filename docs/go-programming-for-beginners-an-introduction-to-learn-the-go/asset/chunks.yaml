    \ {\n    fmt.Printf(\"\\n[Inside getSumAvg] - Received 1 argument: \\n\\narr[10]\
    \ = %v\\n\\n\", arr)\n    /*Calculate sum, avg*/\n    sum := 0\n    for i := 0;\
