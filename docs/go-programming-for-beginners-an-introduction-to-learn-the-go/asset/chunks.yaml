    \n/*Mandatory main function*/\nfunc main() {\n}\n```\n\n**Compile and Execute:**\n\
    \n![](Image00016.jpg)\n\nAs seen, the program is built and run successfully. Nothing\
    \ significant happens on the console as we are not doing anything inside the program.\
    \ The program starts executing from the empty main function.\n\n# 5. Hello World!\
    \ Go Program\n\nIn the previous chapter, we saw what are the basic constituents\
    \ of a standalone Go program. We also saw how to write a basic Go program that\
