    ## 1. Introduction\n\nThere are legendary programming languages such as `C` and\
    \ `C++` which are used to build platform and architecture specific and native\
    \ software applications where the emphasis is usually on performance; and then\
    \ there are all purpose scripting languages such as `Ruby` and `Python` which\
    \ can do just about anything ranging from simple desktop applications to complex\
    \ cloud applications. While languages such as `Python` and `Ruby` are easy to\
    \ learn, easy to code and offer a super wide range of functionalities and libraries\
    \ as compared to `C/C++`, the performance is not as good as `C/C++` (sorry Python\
    \ fans, but it’s true!) unless there is dedicated hardware support for accelerating\
    \ the applications. This is because a script is usually executed by a special\
    \ software called as an interpreter which executes a script line by line where\
    \ as a program written in `C/C++` is compiled to generate executable code which\
    \ is native to a hardware platform and then the executable code is run.\n\n`Go`\
    \ programming language combines the performance of languages such as `C/C++` and\
    \ the ease of use of languages like `Python`. `Go` programming language also known\
    \ as `golang` or simply `Go` is a multi-paradigm programming language designed\
    \ by `Robert Griesemer`, `Rob Pike`, and `Ken Thompson` at `Google`. It is a statically\
    \ typed, compiled programming language that supports programming paradigms such\
    \ as object oriented, functional, imperative and concurrent programming. The development\
    \ of `Go` began at `Google` in `2007` and the first stable version was released\
    \ in `2012` following a public announcement in late `2009`. The developers used\
    \ `C++`, Assembly language and `Go` (self-hosted) to implement `Go` programming\
    \ language. There are two major implementations of `Go` – `gccgo` which is the\
    \ front end for `GCC` compiler and `Google`’s `Go` compiler which targets operating\
    \ systems such as `Windows`, `Linux`, `macOS` and other Unix/BSD-like operating\
    \ such as `DragonFly BSD`, `FreeBSD`, `NetBSD`, etc.\n"
