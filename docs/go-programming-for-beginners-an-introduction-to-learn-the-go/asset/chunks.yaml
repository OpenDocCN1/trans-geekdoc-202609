    # 6. Data Types


    数据类型用于对数据进行分类。例如，字符串是一种数据类型；数字是另一种数据类型。Go 提供了 3 种基本数据类型——布尔型、数值型和字符串型。让我们逐一了解这些类别：


    ## 6.1 Boolean Data Type（布尔数据类型）


    布尔数据类型只有两个值——`true` 和 `false`。它们在决策制定和控制结构中被大量使用。在编程中，该数据类型被称为 `bool`。


    ## 6.2 Numeric Data Types（数值数据类型）


    数值数据类型用于处理不同种类的数字。此类别可进一步细分为 3 个子类别——整型、浮点型和复数型。


    ### 6.2.1 Integers（整型）


    顾名思义，整型数据类型用于处理整数。Go 支持不同大小的有符号和无符号整数。列表如下：


    | Data Type | Description |

    | --- | --- |

    | `int` | 有符号整数，大小取决于系统（32 位或 64 位） |

    | `uint` | 无符号整数，大小取决于系统（32 位或 64 位） |

    | `int8` | 8 位有符号整数 |

    | `int16` | 16 位有符号整数 |

    | `int32` | 32 位有符号整数 |

    | `int64` | 64 位有符号整数 |

    | `uint8` | 8 位无符号整数 |

    | `uint16` | 16 位无符号整数 |

    | `uint32` | 32 位无符号整数 |

    | `uint64` | 64 位无符号整数 |

    | `rune` | 同 `uint32`。用于 Unicode 字符。 |

    | `byte` | 同 `int8`。一个字节是 8 位宽的数据。 |

    | `uintptr` | 用于存储指向所有类型整数指针的无符号整数。 |


    > **Note:** 如果你只需要一种整数数据类型，应使用 `int` 或 `uint`。大小将根据你使用的系统类型决定。如果你使用 32 位系统，大小将为
    32 位；对于 64 位系统，大小将为 64 位。如果你对所处理数据的大小要求很具体，可以使用适当大小的数据类型。


    ### 6.2.2 Floats（浮点型）


    数值数据类型的此子类别用于浮点值。


    | Data Type | Description |

    | --- | --- |

    | `float32` | 32 位 IEEE 754 浮点数 |

    | `float64` | 64 位 IEEE 754 浮点数 |


    ### 6.2.3 Complex（复数型）


    复数数据类型用于处理具有实部和虚部的复数。


    | Data Type | Description |

    | --- | --- |

    | `complex64` | 64 位复数，拥有 `float32`（32 位）类型的实部和虚部。两个 32 位 `float32` 类型总共占 64 位。
    |

    | `complex128` | 128 位复数，拥有 `float64`（64 位）类型的实部和虚部。两个 64 位 `float64` 类型总共占 128
    位。 |


    ## 6.3 String Data Type（字符串数据类型）


    字符串数据类型用于处理字符串值。字符串是字符序列。在编程中，Go 中该数据类型被称为 `string`。我们已经了解了如何使用 `Printf()` 和 `Println()`
    函数打印字符串。更多细节将在下一章介绍。


    ## 6.4 Other Data Types（其他数据类型）


    除了这 3 种基本数据类型，Go 还提供了一些其他数据类型，包括——聚合数据类型和引用数据类型。这些类别的数据类型将在本书的相关章节中介绍。

    '
