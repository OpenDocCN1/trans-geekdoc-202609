- raw: '12\. Arrays An array is a collection of similar items. In programmatic terms,
    an array in Go language is a data structure which contains items of the same data
    type . Each item inside an array is known as an array element (or just an element
    ). An element can be referred to using its position in the array which is known
    as an index . An array index begins at 0 and ends at one less than the size of
    the array (size – 1 ). For example, if we had an array of 10 elements, the first
    element of that array would be present at 0, the second one at index 1, the third
    one at index 2, ..., and the last element would be present at index 9. In Go programming
    language, an array can be declared using the following syntax: var <array variable>
    \[<size of the array>\] <data type> Example: var array1 \[5\] int var msg \[3\]
    string var x \[10\] float64 Once an array is declared, its elements will get zero-values
    (numeric arrays will hold 0 and string arrays will hold empty strings). Individual
    elements can be accessed using their indexes enclosed with the access operator
    ( \[ \] ) . This way, you can set (and also retrieve/print) individual elements
    of an array. Here is an example: /\*Declaring an int array of size 5. First index
    is 0, last index is 4\*/ var num\_array \[5\] int /\*Setting element at index
    0 to 15\*/ num\_array\[0\] = 15 /\*Setting element at index 1 to -35\*/ num\_array\[1\]
    = -35 /\*Setting element at index 2 to 0\*/ num\_array\[2\] = 0 /\*Setting element
    at index 3 to 68\*/ num\_array\[3\] = 68 /\*Setting element at index 4 to 18\*/
    num\_array\[4\] = 18 This is how num\_array will look inside memory: ![](Image00059.jpg)We
    will now write a program where in we will create an integer array, set element
    values and print them back. The whole array can be printed using the verbs %v
    or %d . Printing individual elements would be the same as printing any other integer
    variable: /\*Array Demo 1\*/ /\*Package Declaration\*/ package main /\*Import
    Statement - import fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/
    func main () { ​ /\*Declare an array of 7 integers\*/ ​ var arr \[ 7 \] int ​
    /\*Set values of all elements\*/ ​ arr \[ 0 \] \= 83 ​ arr \[ 1 \] \= \-34 ​ arr
    \[ 2 \] \= 55 ​ arr \[ 3 \] \= 97 ​ arr \[ 4 \] \= \-24 ​ arr \[ 5 \] \= \-11
    ​ arr \[ 6 \] \= 46 ​ /\*Print the whole array\*/ ​ fmt . Printf ( "\\nArray arr:\\n\\n%v\\n"
    , arr ) ​ /\*Print index and corresspoiding values\*/ ​ fmt . Printf ( "\\nValue
    at index: 0 ==> %d" , arr \[ 0 \]) ​ fmt . Printf ( "\\nValue at index: 1 ==>
    %d" , arr \[ 1 \]) ​ fmt . Printf ( "\\nValue at index: 2 ==> %d" , arr \[ 2 \])
    ​ fmt . Printf ( "\\nValue at index: 3 ==> %d" , arr \[ 3 \]) ​ fmt . Printf (
    "\\nValue at index: 4 ==> %d" , arr \[ 4 \]) ​ fmt . Printf ( "\\nValue at index:
    5 ==> %d" , arr \[ 5 \]) ​ fmt . Printf ( "\\nValue at index: 6 ==> %d\\n" , arr
    \[ 6 \]) } Output: ![](Image00060.jpg)It is also possible to initialize an array
    at the time of declaration using the following syntax: var <array variable> =
    \[<optional size>\] <data type> {<elements separated by comma>} Example: var arr1
    = \[\] int {-3, 0, 3} var arr2 = \[6\] float32 {0.36, -0.25, 0.01, -0.67, 0.88,
    0.73} Here is a program that demonstrates array initialization: /\*Array Demo
    2\*/ /\*Package Declaration\*/ package main /\*Import Statement - import fmt package\*/
    import ( "fmt" ) /\*Mandatory main function\*/ func main () { ​ /\*Declare an
    array of 5 floats and initialize\*/ ​ var arr \= \[ 5 \] float32 { 4 . 6 , \-65
    . 21 , 0 . 64 , \-12 . 76 , 25 . 75 } ​ /\*Print the whole array\*/ ​ fmt . Printf
    ( "\\nArray arr:\\n\\n%v\\n" , arr ) ​ /\*Print index and corresspoiding values\*/
    ​ fmt . Printf ( "\\nValue at index: 0 ==> %f" , arr \[ 0 \]) ​ fmt . Printf (
