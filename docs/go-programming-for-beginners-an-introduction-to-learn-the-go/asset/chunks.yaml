    \ ![](Image00089.jpg)(*Must be 13 years or older to subscribe)\n"
  trans: "\n\n# 17. 编程示例\n\n既然我们已经学习了 Go 编程的基础知识，现在让我们将这些概念付诸实践，尝试一些编程示例。\n\n## 17.1\
    \ 数字各位之和\n\n下面是一个程序，它从用户处读取一个整数并计算其各位数字之和：\n\n```go\n/*各位数字之和*/\n/*包声明*/\npackage\
    \ main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc\
    \ main() {\n\tvar number int\n\tvar sum int = 0\n\tfmt.Printf(\"\\n 请输入一个数字: \"\
    )\n\tfmt.Scanf(\"%d\", &number)\n\tfor number > 0 {\n\t\t/*将个位数字加到 sum 上*/\n\t\
    \tsum = sum + (number % 10)\n\t\t/*丢弃个位数字*/\n\t\tnumber = number / 10\n\t}\n\t\
    fmt.Printf(\"\\n 所有数字之和: %d\\n\", sum)\n}\n```\n\n**输出：**\n![](img/Image00084.jpg)\n\
    \n## 17.2 斐波那契数列\n\n斐波那契数列以 0 和 1 作为前两项开始。下一项通过将前两项相加得出。由于前两项是 0 和 1，接下来的项将是 1、2、3、5、8，依此类推。以下是该程序：\n\
    \n```go\n/*斐波那契数列*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\
    \"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\tvar terms, next int\n\tvar previous,\
    \ current int = 0, 1\n\tfmt.Printf(\"\\n 请输入要生成的项数: \")\n\tfmt.Scanf(\"%d\", &terms)\n\
    \tif terms < 2 {\n\t\tfmt.Printf(\"\\n 斐波那契数列至少包含两项\")\n\t} else {\n\t\tfmt.Printf(\"\
    \\n\\n 斐波那契数列:\\n\\n\")\n\t\tfor i := 0; i < terms; i++ {\n\t\t\tfmt.Printf(\"\
    %d \", previous)\n\t\t\tnext = previous + current\n\t\t\tprevious = current\n\t\
    \t\tcurrent = next\n\t\t}\n\t}\n\tfmt.Printf(\"\\n\")\n}\n```\n\n**输出：**\n![](img/Image00085.jpg)\n\
    \n## 17.3 反转给定数字\n\n下面是一个读取整数并将其反转的程序：\n\n```go\n/*反转数字*/\n/*包声明*/\npackage main\n\
    \n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main()\
    \ {\n\tvar number int\n\tvar rev int = 0\n\tfmt.Printf(\"\\n 请输入一个数字: \")\n\t\
    fmt.Scanf(\"%d\", &number)\n\tfor number > 0 {\n\t\trev = (rev * 10) + (number\
    \ % 10)\n\t\tnumber = number / 10\n\t}\n\tfmt.Printf(\"\\n 反转结果: %d\\n\", rev)\n\
    }\n```\n\n**输出：**\n![](img/Image00086.jpg)\n\n## 17.4 字符串回文\n\n如果一个字符串的反转与原字符串相同，则称该字符串为回文。例如，“book”\
    \ 不是回文，而 “malayalam” 是回文。以下程序接收一个字符串作为输入并检查它是否为回文。请注意，未考虑大小写敏感性。\n\n```go\n/*回文*/\n\
    /*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt、bufio、os、strings 包*/\nimport (\n\t\"\
    fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*强制性的 main 函数*/\nfunc main()\
    \ {\n\t/*使用 stdin 创建一个类型为 NewReader 的输入读取器变量*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
    \t/*提示用户输入内容*/\n\tfmt.Printf(\"\\n 请输入一个字符串: \")\n\t/*使用 ReadString 函数读取字符串*/\n\
    \tstr, _ := inputReader.ReadString('\\n')\n\t/*去除 \\n 和 \\r 字符*/\n\tstr = strings.Trim(str,\
    \ \"\\n\\r\")\n\tstr_length := len(str) - 1\n\t/*使用 rune 获取数组中的字符*/\n\tstr_char\
    \ := []rune(str)\n\t/*反转字符串*/\n\tfor i := 0; i < str_length/2; i++ {\n\t\ttemp\
    \ := str_char[i]\n\t\tstr_char[i] = str_char[str_length-i]\n\t\tstr_char[str_length-i]\
    \ = temp\n\t}\n\t/*使用 string 函数转回字符串*/\n\trev_str := string(str_char)\n\tfmt.Printf(\"\
    \\n 反转后的字符串: %s\\n\", rev_str)\n\t/*检查两个字符串是否相等*/\n\tresult := strings.Compare(str,\
    \ rev_str)\n\tif result == 0 {\n\t\tfmt.Printf(\"\\n%s 是回文。\\n\", str)\n\t} else\
    \ {\n\t\tfmt.Printf(\"\\n%s 不是回文。\\n\", str)\n\t}\n}\n```\n\n**输出：**\n![](img/Image00087.jpg)\n\
    \n## 17.5 冒泡排序\n\n冒泡排序是一种按升序或降序对数据结构进行排序的算法。在此算法中，以嵌套方式使用两个循环。内层循环确保将最大或最小元素放置在数据结构的开头或末尾。外层循环的迭代次数等于数据结构中的元素数量。我们将编写一个程序，从用户处读取\
    \ 5 个整数，将它们放入数组，并使用冒泡排序按升序对数组进行排序。\n\n```go\n/*使用冒泡排序对数组排序*/\n/*包声明*/\npackage\
    \ main\n\n/*导入语句 - 导入 fmt、strconv 包*/\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\
    \n/*强制性的 main 函数*/\nfunc main() {\n\t/*声明变量*/\n\tvar arr [5]int\n\t/*声明两个循环计数器*/\n\
    \tvar i, j int\n\t/*声明一个变量临时存储作为字符串的数字*/\n\tvar num_str string\n\t/*提示用户输入 5 个元素，使用\
    \ for 循环*/\n\tfor i = 0; i < 5; i++ {\n\t\tfmt.Printf(\"\\n 请输入索引 %d 处的元素: \"\
    , i)\n\t\tfmt.Scanln(&num_str)\n\t\t/*将 num_str 转换为整数*/\n\t\tnum, err := strconv.Atoi(num_str)\n\
    \t\t/*将 num 赋值给 arr[i]*/\n\t\tarr[i] = num\n\t\t/*将 err 赋值给空标识符*/\n\t\t_ = err\n\
    \t}\n\tfmt.Printf(\"\\n 原始数组: %d\\n\", arr)\n\tarr_length := len(arr)\n\t/*冒泡排序*/\n\
    \tfor i = 0; i < arr_length; i++ {\n\t\tfor j = 0; j < i; j++ {\n\t\t\tif arr[j]\
    \ > arr[j+1] {\n\t\t\t\ttemp := arr[j]\n\t\t\t\tarr[j] = arr[j+1]\n\t\t\t\tarr[j+1]\
    \ = temp\n\t\t\t}\n\t\t}\n\t}\n\tfmt.Printf(\"\\n 排序后的数组: %d\\n\", arr)\n}\n```\n\
    \n**输出：**\n![](img/Image00088.jpg)\n\n# 18. 结束语\n\nGo 编程语言是一个相对较新的语言。第一个版本发布于\
    \ 2012 年，因此在撰写本书时（2020 年），它大约只有 8 岁。凭借其提供的特性，这门语言拥有巨大的潜力。我编写本书的目的是让读者熟悉一门新的编程语言，它可能在不久的将来彻底改变软件开发。我已尽最大努力使书中的概念非常简单，以便您的基础变得非常扎实。在\
    \ Web 开发、云应用开发、中间件开发等方面，Go 语言已被证明是**游戏规则改变者**。如果您已经理解了本书中解释的基本概念，您绝对应该学习更多内容，并可能涉足一些高级概念，如面向对象编程、文件处理、错误处理等。如果您已经是一名\
    \ Web 开发人员，您应该尝试 Web 框架，如 `Gin`、`Web.Go`、`Martini`、`Revel` 等，以开发 Web 应用程序和服务。希望您从本书中学到了有价值的知识。请永远记住——学无止境！\n\
    \n如果您像我写作时一样喜欢这本书，您可以订阅*我的电子邮件列表，以获取独家内容和未来新书的抢先预览。请访问下面的链接：[`eepurl.com/du_L4n`](http://eepurl.com/du_L4n)\
    \ 或使用二维码：![](img/Image00089.jpg)(*订阅者必须年满 13 周岁)\n\n"
