  fmt: "\n# 12. Arrays\n\nAn array is a collection of similar items. In programmatic\
    \ terms, an array in Go language is a data structure which contains items of the\
    \ same data type. Each item inside an array is known as an array element (or just\
    \ an element). An element can be referred to using its position in the array which\
    \ is known as an index. An array index begins at 0 and ends at one less than the\
    \ size of the array (size – 1). For example, if we had an array of 10 elements,\
    \ the first element of that array would be present at 0, the second one at index\
    \ 1, the third one at index 2, ..., and the last element would be present at index\
    \ 9.\n\nIn Go programming language, an array can be declared using the following\
    \ syntax:\n\n```\nvar <array variable> [<size of the array>] <data type>\n```\n\
    \nExample:\n\n```\nvar array1 [5] int\nvar msg [3] string\nvar x [10] float64\n\
    ```\n\nOnce an array is declared, its elements will get zero-values (numeric arrays\
    \ will hold 0 and string arrays will hold empty strings). Individual elements\
    \ can be accessed using their indexes enclosed with the access operator (`[]`).\
    \ This way, you can set (and also retrieve/print) individual elements of an array.\n\
    \nHere is an example:\n\n```\n/*Declaring an int array of size 5. First index\
    \ is 0, last index is 4*/\nvar num_array [5] int\n\n/*Setting element at index\
    \ 0 to 15*/\nnum_array[0] = 15\n\n/*Setting element at index 1 to -35*/\nnum_array[1]\
    \ = -35\n\n/*Setting element at index 2 to 0*/\nnum_array[2] = 0\n\n/*Setting\
    \ element at index 3 to 68*/\nnum_array[3] = 68\n\n/*Setting element at index\
    \ 4 to 18*/\nnum_array[4] = 18\n```\n\nThis is how `num_array` will look inside\
    \ memory:\n![](Image00059.jpg)\n\nWe will now write a program where in we will\
    \ create an integer array, set element values and print them back. The whole array\
    \ can be printed using the verbs `%v` or `%d`. Printing individual elements would\
    \ be the same as printing any other integer variable:\n\n```\n/*Array Demo 1*/\n\
    /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\n\
    import (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    /*Declare\
    \ an array of 7 integers*/\n    var arr [7] int\n\n    /*Set values of all elements*/\n\
    \    arr[0] = 83\n    arr[1] = -34\n    arr[2] = 55\n    arr[3] = 97\n    arr[4]\
    \ = -24\n    arr[5] = -11\n    arr[6] = 46\n\n    /*Print the whole array*/\n\
    \    fmt.Printf(\"\\nArray arr:\\n\\n%v\\n\", arr)\n\n    /*Print index and corresponding\
    \ values*/\n    fmt.Printf(\"\\nValue at index: 0 ==> %d\", arr[0])\n    fmt.Printf(\"\
    \\nValue at index: 1 ==> %d\", arr[1])\n    fmt.Printf(\"\\nValue at index: 2\
    \ ==> %d\", arr[2])\n    fmt.Printf(\"\\nValue at index: 3 ==> %d\", arr[3])\n\
    \    fmt.Printf(\"\\nValue at index: 4 ==> %d\", arr[4])\n    fmt.Printf(\"\\\
    nValue at index: 5 ==> %d\", arr[5])\n    fmt.Printf(\"\\nValue at index: 6 ==>\
    \ %d\\n\", arr[6])\n}\n```\n\nOutput:\n![](Image00060.jpg)\n\nIt is also possible\
    \ to initialize an array at the time of declaration using the following syntax:\n\
    \n```\nvar <array variable> = [<optional size>] <data type> {<elements separated\
    \ by comma>}\n```\n\nExample:\n\n```\nvar arr1 = [] int {-3, 0, 3}\nvar arr2 =\
    \ [6] float32 {0.36, -0.25, 0.01, -0.67, 0.88, 0.73}\n```\n\nHere is a program\
    \ that demonstrates array initialization:\n\n```\n/*Array Demo 2*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    /*Declare\
    \ an array of 5 floats and initialize*/\n    var arr = [5] float32 {4.6, -65.21,\
    \ 0.64, -12.76, 25.75}\n\n    /*Print the whole array*/\n    fmt.Printf(\"\\nArray\
    \ arr:\\n\\n%v\\n\", arr)\n\n    /*Print index and corresponding values*/\n  \
    \  fmt.Printf(\"\\nValue at index: 0 ==> %f\", arr[0])\n    fmt.Printf(\"\\nValue\
    \ at index: 1 ==> %f\", arr[1])\n    fmt.Printf(\"\\nValue at index: 2 ==> %f\"\
    , arr[2])\n    fmt.Printf(\"\\nValue at index: 3 ==> %f\", arr[3])\n    fmt.Printf(\"\
    \\nValue at index: 4 ==> %f\\n\", arr[4])\n}\n```\n\nOutput:\n![](Image00061.jpg)\n\
    \nAn array can be of any data type. When initializing an array, the size may or\
    \ may not be specified. It will be taken automatically depending on the number\
    \ of elements you set at the time of initialization. At any point in the program,\
    \ you can use the function `len(<array variable>)` to determine the size of an\
    \ array. Also, accessing elements every time manually may not be the best way\
    \ – loops do a great job working with arrays.\n\nHere is an example that demonstrates\
    \ these concepts:\n\n```\n/*Array Demo 3*/\n/*Package Declaration*/\npackage main\n\
    \n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    /*Declare an array of 10 strings and initialize*/\n\
    \    var country = [] string {\"USA\", \"UK\", \"India\", \"Brazil\", \"South\
    \ Africa\", \"Argentina\", \"New Zealand\", \"Russia\", \"Morocco\", \"Latvia\"\
    }\n\n    /*Print the whole array*/\n    fmt.Printf(\"\\nArray country:\\n\\n%v\\\
    n\", country)\n\n    /*Print index and corresponding values using for loop*/\n\
    \    /*Use len function to retrieve the size of the array*/\n    size := len(country)\n\
    \n    for i := 0; i < size; i++ {\n        fmt.Printf(\"\\nValue at index: %d\
    \ ==> %s\", i, country[i])\n    }\n    fmt.Printf(\"\\n\")\n}\n```\n\nOutput:\n\
    ![](Image00062.jpg)\n\nLet us take a few more programming examples to better understand\
    \ arrays. Here is an example that takes 5 integers as input from the user and\
    \ saves it in an array, calculates the sum and average of those integers:\n\n\
    ```\n/*Array Input*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement\
    \ - import fmt package*/\nimport (\n    \"fmt\"\n    \"strconv\"\n)\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    /*Declare variables*/\n    var arr [5] int\n\
    \    var sum int = 0\n    var num_str string\n\n    /*Declare a variable to store\
    \ average*/\n    var avg float32\n\n    /*Prompt the user to enter 5 elements,\
    \ use for loop*/\n    for i := 0; i < 5; i++ {\n        fmt.Printf(\"\\nEnter\
    \ element at index %d: \", i)\n        fmt.Scanln(&num_str)\n\n        /*Convert\
    \ num_str to integer*/\n        num, err := strconv.Atoi(num_str)\n\n        /*Assign\
    \ num to arr[i]*/\n        arr[i] = num\n\n        /*Assign err to blank identifier*/\n\
    \        _ = err\n\n        /*Keep calculating sum*/\n        sum += arr[i]\n\
    \    }\n\n    /*Calculate average*/\n    avg = float32(sum) / 5.0\n    fmt.Printf(\"\
    \\nArray arr:\\n%v\\nSum: %d\\nAverage: %f\\n\", arr, sum, avg)\n}\n```\n\nOutput:\n\
    ![](Image00063.jpg)\n\nLet us write a program to take 5 integers as input from\
    \ the user, save them in an array and reverse the array:\n\n```\n/*Reverse an\
    \ array*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
    \ fmt, strconv package*/\nimport (\n    \"fmt\"\n    \"strconv\"\n)\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    /*Declare variables*/\n    var arr [5] int\n\
    \    var num_str string\n\n    /*Prompt the user to enter 5 elements, use for\
    \ loop*/\n    for i := 0; i < 5; i++ {\n        fmt.Printf(\"\\nEnter element\
    \ at index %d: \", i)\n        fmt.Scanln(&num_str)\n\n        /*Convert num_str\
    \ to integer*/\n        num, err := strconv.Atoi(num_str)\n\n        /*Assign\
    \ num to arr[i]*/\n        arr[i] = num\n\n        /*Assign err to blank identifier*/\n\
    \        _ = err\n    }\n\n    fmt.Printf(\"\\nOriginal array:\\n%v\\n\", arr)\n\
    \n    /*Reverse Array*/\n    for i := 0; i < 5 / 2; i++ {\n        temp := arr[i]\n\
    \        arr[i] = arr[4 - i]\n        arr[4 - i] = temp\n    }\n\n    fmt.Printf(\"\
    \\nReversed array:\\n%v\\n\", arr)\n}\n```\n\nOutput:\n![](Image00064.jpg)\n"
  trans: "\n\n# 12. 数组\n\n数组是相似项目的集合。在编程术语中，Go 语言中的数组是一种包含相同数据类型项目的数据结构。数组内的每个项目称为数组元素（或简称元素）。可以使用元素在数组中的位置来引用该元素，该位置称为索引。数组索引从\
    \ 0 开始，到比数组大小小 1 的位置结束（大小 – 1）。例如，如果我们有一个包含 10 个元素的数组，该数组的第一个元素将位于 0，第二个位于索引 1，第三个位于索引\
    \ 2，……，最后一个元素将位于索引 9。\n\n在 Go 编程语言中，可以使用以下语法声明数组：\n\n```\nvar <数组变量> [<数组大小>]\
    \ <数据类型>\n```\n\n示例：\n\n```\nvar array1 [5] int\nvar msg [3] string\nvar x [10]\
    \ float64\n```\n\n一旦声明了数组，其元素将获得零值（数值数组将保存 0，字符串数组将保存空字符串）。可以使用由访问操作符（`[]`）括起来的索引来访问单个元素。这样，您可以设置（也可以检索/打印）数组的单个元素。\n\
    \n这是一个示例：\n\n```\n/*声明一个大小为 5 的 int 数组。第一个索引是 0，最后一个索引是 4*/\nvar num_array [5]\
    \ int\n\n/*将索引 0 处的元素设置为 15*/\nnum_array[0] = 15\n\n/*将索引 1 处的元素设置为 -35*/\nnum_array[1]\
    \ = -35\n\n/*将索引 2 处的元素设置为 0*/\nnum_array[2] = 0\n\n/*将索引 3 处的元素设置为 68*/\nnum_array[3]\
    \ = 68\n\n/*将索引 4 处的元素设置为 18*/\nnum_array[4] = 18\n```\n\n`num_array` 在内存中的样子如下：\n\
    ![](img/Image00059.jpg)\n\n我们现在将编写一个程序，在其中创建一个整数数组，设置元素值并将它们打印出来。可以使用动词 `%v` 或\
    \ `%d` 打印整个数组。打印单个元素与打印任何其他整数变量相同：\n\n```\n/*数组演示 1*/\n/*包声明*/\npackage main\n\
    \n/*导入语句 - 导入 fmt 包*/\nimport (\n    \"fmt\"\n)\n\n/*强制的 main 函数*/\nfunc main()\
    \ {\n    /*声明一个包含 7 个整数的数组*/\n    var arr [7] int\n\n    /*设置所有元素的值*/\n    arr[0]\
    \ = 83\n    arr[1] = -34\n    arr[2] = 55\n    arr[3] = 97\n    arr[4] = -24\n\
    \    arr[5] = -11\n    arr[6] = 46\n\n    /*打印整个数组*/\n    fmt.Printf(\"\\n 数组\
    \ arr:\\n\\n%v\\n\", arr)\n\n    /*打印索引和对应的值*/\n    fmt.Printf(\"\\n 索引 0 处的值:\
    \ ==> %d\", arr[0])\n    fmt.Printf(\"\\n 索引 1 处的值: ==> %d\", arr[1])\n    fmt.Printf(\"\
    \\n 索引 2 处的值: ==> %d\", arr[2])\n    fmt.Printf(\"\\n 索引 3 处的值: ==> %d\", arr[3])\n\
    \    fmt.Printf(\"\\n 索引 4 处的值: ==> %d\", arr[4])\n    fmt.Printf(\"\\n 索引 5 处的值:\
    \ ==> %d\", arr[5])\n    fmt.Printf(\"\\n 索引 6 处的值: ==> %d\\n\", arr[6])\n}\n\
    ```\n\n输出：\n![](img/Image00060.jpg)\n\n也可以在声明时使用以下语法初始化数组：\n\n```\nvar <数组变量>\
    \ = [<可选大小>] <数据类型> {<用逗号分隔的元素>}\n```\n\n示例：\n\n```\nvar arr1 = [] int {-3, 0,\
    \ 3}\nvar arr2 = [6] float32 {0.36, -0.25, 0.01, -0.67, 0.88, 0.73}\n```\n\n这是一个演示数组初始化的程序：\n\
    \n```\n/*数组演示 2*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n  \
    \  \"fmt\"\n)\n\n/*强制的 main 函数*/\nfunc main() {\n    /*声明一个包含 5 个浮点数的数组并初始化*/\n\
    \    var arr = [5] float32 {4.6, -65.21, 0.64, -12.76, 25.75}\n\n    /*打印整个数组*/\n\
    \    fmt.Printf(\"\\n 数组 arr:\\n\\n%v\\n\", arr)\n\n    /*打印索引和对应的值*/\n    fmt.Printf(\"\
    \\n 索引 0 处的值: ==> %f\", arr[0])\n    fmt.Printf(\"\\n 索引 1 处的值: ==> %f\", arr[1])\n\
    \    fmt.Printf(\"\\n 索引 2 处的值: ==> %f\", arr[2])\n    fmt.Printf(\"\\n 索引 3 处的值:\
    \ ==> %f\", arr[3])\n    fmt.Printf(\"\\n 索引 4 处的值: ==> %f\\n\", arr[4])\n}\n\
    ```\n\n输出：\n![](img/Image00061.jpg)\n\n数组可以是任何数据类型。初始化数组时，可以指定大小，也可以不指定。大小将根据您在初始化时设置的元素数量自动确定。在程序的任何位置，您都可以使用函数\
    \ `len(<数组变量>)` 来确定数组的大小。此外，每次手动访问元素可能不是最佳方式——循环在处理数组方面做得很好。\n\n这是一个演示这些概念的示例：\n\
    \n```\n/*数组演示 3*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n  \
    \  \"fmt\"\n)\n\n/*强制的 main 函数*/\nfunc main() {\n    /*声明一个包含 10 个字符串的数组并初始化*/\n\
    \    var country = [] string {\"USA\", \"UK\", \"India\", \"Brazil\", \"South\
    \ Africa\", \"Argentina\", \"New Zealand\", \"Russia\", \"Morocco\", \"Latvia\"\
    }\n\n    /*打印整个数组*/\n    fmt.Printf(\"\\n 数组 country:\\n\\n%v\\n\", country)\n\
    \n    /*使用 for 循环打印索引和对应的值*/\n    /*使用 len 函数获取数组的大小*/\n    size := len(country)\n\
    \n    for i := 0; i < size; i++ {\n        fmt.Printf(\"\\n 索引 %d 处的值: ==> %s\"\
    , i, country[i])\n    }\n    fmt.Printf(\"\\n\")\n}\n```\n\n输出：\n![](img/Image00062.jpg)\n\
    \n让我们再看几个编程示例，以更好地理解数组。这是一个示例，它从用户处获取 5 个整数作为输入并将其保存在数组中，计算这些整数的总和和平均值：\n\n```\n\
    /*数组输入*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n    \"fmt\"\n\
    \    \"strconv\"\n)\n\n/*强制的 main 函数*/\nfunc main() {\n    /*声明变量*/\n    var arr\
    \ [5] int\n    var sum int = 0\n    var num_str string\n\n    /*声明一个变量来存储平均值*/\n\
    \    var avg float32\n\n    /*提示用户输入 5 个元素，使用 for 循环*/\n    for i := 0; i < 5;\
    \ i++ {\n        fmt.Printf(\"\\n 请输入索引 %d 处的元素: \", i)\n        fmt.Scanln(&num_str)\n\
    \n        /*将 num_str 转换为整数*/\n        num, err := strconv.Atoi(num_str)\n\n \
    \       /*将 num 赋值给 arr[i]*/\n        arr[i] = num\n\n        /*将 err 赋值给空标识符*/\n\
    \        _ = err\n\n        /*持续计算总和*/\n        sum += arr[i]\n    }\n\n    /*计算平均值*/\n\
    \    avg = float32(sum) / 5.0\n    fmt.Printf(\"\\n 数组 arr:\\n%v\\n 总和: %d\\n\
    \ 平均值: %f\\n\", arr, sum, avg)\n}\n```\n\n输出：\n![](img/Image00063.jpg)\n\n让我们编写一个程序，从用户处获取\
    \ 5 个整数作为输入，将它们保存在数组中并反转该数组：\n\n```\n/*反转数组*/\n/*包声明*/\npackage main\n\n/*导入语句\
    \ - 导入 fmt, strconv 包*/\nimport (\n    \"fmt\"\n    \"strconv\"\n)\n\n/*强制的 main\
    \ 函数*/\nfunc main() {\n    /*声明变量*/\n    var arr [5] int\n    var num_str string\n\
    \n    /*提示用户输入 5 个元素，使用 for 循环*/\n    for i := 0; i < 5; i++ {\n        fmt.Printf(\"\
    \\n 请输入索引 %d 处的元素: \", i)\n        fmt.Scanln(&num_str)\n\n        /*将 num_str\
    \ 转换为整数*/\n        num, err := strconv.Atoi(num_str)\n\n        /*将 num 赋值给 arr[i]*/\n\
    \        arr[i] = num\n\n        /*将 err 赋值给空标识符*/\n        _ = err\n    }\n\n\
    \    fmt.Printf(\"\\n 原始数组:\\n%v\\n\", arr)\n\n    /*反转数组*/\n    for i := 0; i\
    \ < 5 / 2; i++ {\n        temp := arr[i]\n        arr[i] = arr[4 - i]\n      \
    \  arr[4 - i] = temp\n    }\n\n    fmt.Printf(\"\\n 反转后的数组:\\n%v\\n\", arr)\n\
    }\n```\n\n输出：\n![](img/Image00064.jpg)\n\n"
