    \ Demo 1*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
    \ fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main()\
    \ {\n\t/*Declare 6 variables of type int using var keyword*/\n\tvar num1, num2,\
    \ sum, diff, prod, mod int\n\n\t/*Declare float32 variable to store quotient*/\n\
    \tvar quo float32\n\n\t/*Assign values to num1 and num2*/\n\tnum1 = 53\n\tnum2\
    \ = 18\n\n\t/*Perform various arithmetic operations*/\n\tsum = num1 + num2\n\t\
    diff = num1 - num2\n\tprod = num1 * num2\n\n\t/*num1 and num2 both are integers.\n\
    \tHence num1/num2 will result in an integer even if the quotient is a float mathematically\n\
    \tYou need to convert both operands to float32 using float32(<operand>) before\
    \ dividing.*/\n\tquo = float32(num1) / float32(num2)\n\n\tmod = num1 % num2\n\n\
    \t/*Print Everything*/\n\tfmt.Printf(\"\\nnum1 = %d num2 = %d\", num1, num2)\n\
    \tfmt.Printf(\"\\nnum1 + num2 = %d\", sum)\n\tfmt.Printf(\"\\nnum1 - num2 = %d\"\
    , diff)\n\tfmt.Printf(\"\\nnum1 * num2 = %d\", prod)\n\tfmt.Printf(\"\\nnum1 /\
    \ num2 = %f\", quo)\n\tfmt.Printf(\"\\nnum1 (modulus) num2 = %d\", mod)\n\n\t\
    num1++\n\tnum2++\n\n\tfmt.Printf(\"\\nnum1++ = %d num2++ = %d\\n\", num1, num2)\n\
    }\n```\n\nOutput:\n![](Image00026.jpg)\n\n# Arithmetic Operators Demo 2 - Floating\
    \ point arithmetic\n\nLet us see how arithmetic operators work with floating point\
    \ numbers. We have used the verbs `%f` for printing normal floating point values\
    \ and `%E` for printing values in scientific notation format:\n\n```go\n/*Arithmetic\
    \ Operators Demo 2 - Floating point arithmetic*/\n/*Package Declaration*/\npackage\
    \ main\n\n/*Import Statement - import fmt package*/\nimport (\n\t\"fmt\"\n)\n\n\
    /*Mandatory main function*/\nfunc main() {\n\t/*Declare 6 variables of type float32\
    \ using var keyword*/\n\tvar num1, num2, sum, diff, prod, quo float32\n\n\t/*Assign\
    \ values to num1 and num2*/\n\tnum1 = 0.0363257\n\tnum2 = -2.93157E-3\n\n\t/*Perform\
    \ various arithmetic operations*/\n\tsum = num1 + num2\n\tdiff = num1 - num2\n\
    \tprod = num1 * num2\n\tquo = num1 / num2\n\n\t/*Print Everything*/\n\tfmt.Printf(\"\
    \\nValues in normal floating point form -> num1 = %f num2 = %f\", num1, num2)\n\
    \tfmt.Printf(\"\\nValues in scientific notation form -> num1 = %E num2 = %E\"\
    , num1, num2)\n\tfmt.Printf(\"\\nnum1 + num2 = %f\", sum)\n\tfmt.Printf(\"\\nnum1\
    \ - num2 = %f\", diff)\n\tfmt.Printf(\"\\nnum1 * num2 = %E\", prod)\n\tfmt.Printf(\"\
    \\nnum1 / num2 = %E\\n\", quo)\n}\n```\n\nOutput:\n![](Image00027.jpg)\n\n# Arithmetic\
    \ Operators Demo 3 - Complex numbers' arithmetic\n\nArithmetic operators will\
    \ also work on complex numbers. You can create complex number variables using\
    \ the `complex64` or `complex128` data types. A `complex64` data type is made\
    \ up of two `float32` data types, one each for real and imaginary parts and a\
    \ `complex128` data type is made up of one `float64` data type for the real part\
    \ and another `float64` data type for the imaginary part. The verb to be used\
    \ is `%f` as a complex number is made up of two floating point numbers in Go.\
    \ Alternatively, you can use `%v` too which will display a value using the original\
    \ data type.\n\nA complex number variable can be initialized directly by specifying\
    \ the real and imaginary part or by using a function called `complex` as follows:\n\
    \n```go\n<variable> := complex(<real part>, <imaginary part>)\nNum := complex(1,\
    \ 8)\n```\n\nHere is a Go program that demonstrates the use of arithmetic operators\
    \ on complex numbers:\n\n```go\n/*Arithmetic Operators Demo 3 - Complex numbers'\
    \ arithmetic*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement -\
    \ import fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\n\
    func main() {\n\t/*Declare 6 variables of type complex64 using var keyword*/\n\
    \tvar num1, num2, sum, diff, prod, quo complex64\n\n\t/*Assign values to num1\
    \ and num2*/\n\tnum1 = 2 - 5i\n\n\t/*Use complex function to create a complex\
    \ number, does the same job*/\n\tnum2 = complex(-3, 7)\n\n\t/*Perform various\
    \ arithmetic operations*/\n\tsum = num1 + num2\n\tdiff = num1 - num2\n\tprod =\
    \ num1 * num2\n\tquo = num1 / num2\n\n\t/*Print Everything*/\n\tfmt.Printf(\"\\\
    nnum1 = %v num2 = %v\", num1, num2)\n\tfmt.Printf(\"\\nnum1 + num2 = %v\", sum)\n\
    \tfmt.Printf(\"\\nnum1 - num2 = %v\", diff)\n\tfmt.Printf(\"\\nnum1 * num2 = %v\"\
    , prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %f\", quo)\n\n\t/*Increment num1 and\
    \ decrement num2*/\n\tnum1++\n\tnum2--\n\n\tfmt.Printf(\"\\nnum1++ = %v num2--\
    \ = %v\\n\", num1, num2)\n}\n```\n\nOutput:\n![](Image00028.jpg)\n\n# 9.2 Relational\
    \ Operators\n\nRelational operators are used to compare operands. The result of\
    \ the comparison can either be Boolean (`bool`) `true` or `false`. This category\
    \ of operators is very useful when working with control structures.\n\n| Operator\
    \ | Description |\n| :--- | :--- |\n| `==` | Equal To |\n| `!=` | Not Equal To\
    \ |\n| `<` | Less Than |\n| `>` | Greater Than |\n| `<=` | Less Than OR Equal\
    \ To |\n| `>=` | Greater Than OR Equal To |\n\nHere is a program that demonstrates\
    \ the usage of relational operators. The verb `%t` is used to display the Boolean\
    \ result of comparison operations:\n\n```go\n/*Relational Operators Demo*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Declare variables\
    \ of type int using var keyword*/\n\tvar a, b, c, d int = -1, 3, -1, 9\n\n\t/*Print\
    \ a, b, c, d*/\n\tfmt.Printf(\"\\na = %d b = %d c = %d d = %d\\n\", a, b, c, d)\n\
    \n\t/*Print result of comparison operations*/\n\tfmt.Printf(\"\\na == c: %t\"\
    , a == c)\n\tfmt.Printf(\"\\nb == d: %t\", b == d)\n\tfmt.Printf(\"\\na != c:\
    \ %t\", a != c)\n\tfmt.Printf(\"\\nb != d: %t\", b != d)\n\tfmt.Printf(\"\\na\
    \ < b: %t\", a < b)\n\tfmt.Printf(\"\\nc > d: %t\", c > d)\n\tfmt.Printf(\"\\\
    nd <= b: %t\", d <= b)\n\tfmt.Printf(\"\\na >= c: %t\\n\", a >= c)\n}\n```\n\n\
    Output:\n![](Image00029.jpg)\n\n# 9.3 Logical Operators\n\nLogical operators are\
    \ used to perform operations such as Logical AND, Logical OR and Logical NOT on\
    \ Boolean operands. Variables holding Boolean values (`true` or `false`) as well\
    \ as expressions (perhaps using Relational Operators) that result in `true` or\
    \ `false` can be considered as operands.\n\n| Operator | Description | Sample\
    \ Usage |\n| :--- | :--- | :--- |\n| `&&` | Logical AND | `(Expression 1) && (Expression\
    \ 2)` |\n| `||` | Logical OR | `(Expression 1) || (Expression 2)` |\n| `!` | Logical\
    \ NOT | `!(Expression 1)` |\n\nNote: If expressions are used as operands, they\
    \ will be evaluated first.\n\nHere is a Go program that shows how logical operators\
    \ work:\n\n```go\n/*Logical Operators Demo*/\n/*Package Declaration*/\npackage\
    \ main\n\n/*Import Statement - import fmt package*/\nimport (\n\t\"fmt\"\n)\n\n\
    /*Mandatory main function*/\nfunc main() {\n\t/*Declare variables of type float32\
    \ using var keyword*/\n\tvar a, b, c float32 = -65.736, 54.642, 0.003\n\n\t/*Short\
    \ declare two boolean variables*/\n\tx := true\n\ty := false\n\n\t/*Print results\
    \ of various operations*/\n\tfmt.Printf(\"\\nx = %t y = %t\", x, y)\n\tfmt.Printf(\"\
    \\nx || y = %t, x && y = %t, !x = %t, !y = %t\", x || y, x && y, !x, !y)\n\tfmt.Printf(\"\
    \\n(a < b) && (b > c) = %t\", (a < b) && (b > c))\n\tfmt.Printf(\"\\n(a == c)\
    \ || (c != b) = %t\", (a == c) || (c != b))\n\tfmt.Printf(\"\\n(b != c) && (c\
    \ <= a) = %t\", (b != c) && (c <= a))\n\tfmt.Printf(\"\\n(a == b) || x = %t\\\
    n\", (a == b) || x)\n}\n```\n\nOutput:\n![](Image00030.jpg)\n\n# 9.4 Bitwise Operators\n\
    \nBitwise operators work on individual bits of operands. Operations will be carried\
    \ out in a bit-by-bit manner. In order to understand this class of operators,\
    \ you need to understand a little bit of the binary number system and Boolean\
    \ algebra.\n\n| Operator | Description | Sample Usage | Explanation |\n| :---\
    \ | :--- | :--- | :--- |\n| `&` | Bitwise Logical AND | `x & y` | Performs logical\
    \ AND on each of the operands on a bit-by-bit basis. |\n| `|` | Bitwise Logical\
    \ OR | `x | y` | Performs logical OR on each of the operands on a bit-by-bit basis.\
    \ |\n"
  trans: "\n\n# 算术运算符演示 1\n\n这是一个演示两个整数简单算术运算的 Go 程序：\n\n```go\n/*算术运算符演示 1*/\n/*包声明*/\n\
    package main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\n\
    func main() {\n\t/*使用 var 关键字声明 6 个 int 类型的变量*/\n\tvar num1, num2, sum, diff,\
    \ prod, mod int\n\n\t/*声明 float32 变量以存储商*/\n\tvar quo float32\n\n\t/*为 num1 和\
    \ num2 赋值*/\n\tnum1 = 53\n\tnum2 = 18\n\n\t/*执行各种算术运算*/\n\tsum = num1 + num2\n\
    \tdiff = num1 - num2\n\tprod = num1 * num2\n\n\t/*num1 和 num2 都是整数。\n\t因此即使数学上商是浮点数，num1/num2\
    \ 的结果也将是整数。\n\t你需要在相除前使用 float32(<操作数>) 将两个操作数都转换为 float32。*/\n\tquo = float32(num1)\
    \ / float32(num2)\n\n\tmod = num1 % num2\n\n\t/*打印所有内容*/\n\tfmt.Printf(\"\\nnum1\
    \ = %d num2 = %d\", num1, num2)\n\tfmt.Printf(\"\\nnum1 + num2 = %d\", sum)\n\t\
    fmt.Printf(\"\\nnum1 - num2 = %d\", diff)\n\tfmt.Printf(\"\\nnum1 * num2 = %d\"\
    , prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %f\", quo)\n\tfmt.Printf(\"\\nnum1 (取模)\
    \ num2 = %d\", mod)\n\n\tnum1++\n\tnum2++\n\n\tfmt.Printf(\"\\nnum1++ = %d num2++\
    \ = %d\\n\", num1, num2)\n}\n```\n\n输出：\n![](img/Image00026.jpg)\n\n# 算术运算符演示\
    \ 2 - 浮点数算术\n\n让我们看看算术运算符如何用于浮点数。我们使用动词 `%f` 打印普通浮点值，使用 `%E` 以科学计数法格式打印值：\n\n\
    ```go\n/*算术运算符演示 2 - 浮点数算术*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport\
    \ (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t/*使用 var 关键字声明 6 个 float32\
    \ 类型的变量*/\n\tvar num1, num2, sum, diff, prod, quo float32\n\n\t/*为 num1 和 num2\
    \ 赋值*/\n\tnum1 = 0.0363257\n\tnum2 = -2.93157E-3\n\n\t/*执行各种算术运算*/\n\tsum = num1\
    \ + num2\n\tdiff = num1 - num2\n\tprod = num1 * num2\n\tquo = num1 / num2\n\n\t\
    /*打印所有内容*/\n\tfmt.Printf(\"\\n 普通浮点形式的值 -> num1 = %f num2 = %f\", num1, num2)\n\
    \tfmt.Printf(\"\\n 科学计数法形式的值 -> num1 = %E num2 = %E\", num1, num2)\n\tfmt.Printf(\"\
    \\nnum1 + num2 = %f\", sum)\n\tfmt.Printf(\"\\nnum1 - num2 = %f\", diff)\n\tfmt.Printf(\"\
    \\nnum1 * num2 = %E\", prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %E\\n\", quo)\n\
    }\n```\n\n输出：\n![](img/Image00027.jpg)\n\n# 算术运算符演示 3 - 复数运算\n\n算术运算符也适用于复数。你可以使用\
    \ `complex64` 或 `complex128` 数据类型创建复数变量。`complex64` 数据类型由两个 `float32` 数据类型组成，分别用于实部和虚部；而\
    \ `complex128` 数据类型由一个用于实部的 `float64` 数据类型和另一个用于虚部的 `float64` 数据类型组成。由于 Go 中的复数由两个浮点数组成，因此要使用的动词是\
    \ `%f`。或者，你也可以使用 `%v`，它将使用原始数据类型显示值。\n\n复数变量可以通过直接指定实部和虚部来初始化，也可以通过使用名为 `complex`\
    \ 的函数来初始化，如下所示：\n\n```go\n<变量> := complex(<实部>, <虚部>)\nNum := complex(1, 8)\n\
    ```\n\n下面是一个演示在复数上使用算术运算符的 Go 程序：\n\n```go\n/*算术运算符演示 3 - 复数运算*/\n/*包声明*/\npackage\
    \ main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc\
    \ main() {\n\t/*使用 var 关键字声明 6 个 complex64 类型的变量*/\n\tvar num1, num2, sum, diff,\
    \ prod, quo complex64\n\n\t/*为 num1 和 num2 赋值*/\n\tnum1 = 2 - 5i\n\n\t/*使用 complex\
    \ 函数创建复数，效果相同*/\n\tnum2 = complex(-3, 7)\n\n\t/*执行各种算术运算*/\n\tsum = num1 + num2\n\
    \tdiff = num1 - num2\n\tprod = num1 * num2\n\tquo = num1 / num2\n\n\t/*打印所有内容*/\n\
    \tfmt.Printf(\"\\nnum1 = %v num2 = %v\", num1, num2)\n\tfmt.Printf(\"\\nnum1 +\
    \ num2 = %v\", sum)\n\tfmt.Printf(\"\\nnum1 - num2 = %v\", diff)\n\tfmt.Printf(\"\
    \\nnum1 * num2 = %v\", prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %f\", quo)\n\n\t\
    /*num1 自增，num2 自减*/\n\tnum1++\n\tnum2--\n\n\tfmt.Printf(\"\\nnum1++ = %v num2--\
    \ = %v\\n\", num1, num2)\n}\n```\n\n输出：\n![](img/Image00028.jpg)\n\n# 9.2 关系运算符\n\
    \n关系运算符用于比较操作数。比较的结果可以是布尔值（`bool`）`true` 或 `false`。这类运算符在使用控制结构时非常有用。\n\n| 运算符\
    \ | 说明 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `>`\
    \ | 大于 |\n| `<=` | 小于或等于 |\n| `>=` | 大于或等于 |\n\n下面是一个演示关系运算符用法的程序。动词 `%t` 用于显示比较操作的布尔结果：\n\
    \n```go\n/*关系运算符演示*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\
    \t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t/*使用 var 关键字声明 int 类型的变量*/\n\
    \tvar a, b, c, d int = -1, 3, -1, 9\n\n\t/*打印 a, b, c, d*/\n\tfmt.Printf(\"\\\
    na = %d b = %d c = %d d = %d\\n\", a, b, c, d)\n\n\t/*打印比较操作的结果*/\n\tfmt.Printf(\"\
    \\na == c: %t\", a == c)\n\tfmt.Printf(\"\\nb == d: %t\", b == d)\n\tfmt.Printf(\"\
    \\na != c: %t\", a != c)\n\tfmt.Printf(\"\\nb != d: %t\", b != d)\n\tfmt.Printf(\"\
    \\na < b: %t\", a < b)\n\tfmt.Printf(\"\\nc > d: %t\", c > d)\n\tfmt.Printf(\"\
    \\nd <= b: %t\", d <= b)\n\tfmt.Printf(\"\\na >= c: %t\\n\", a >= c)\n}\n```\n\
    \n输出：\n![](img/Image00029.jpg)\n\n# 9.3 逻辑运算符\n\n逻辑运算符用于对布尔操作数执行逻辑与、逻辑或和逻辑非操作。保存布尔值（`true`\
    \ 或 `false`）的变量以及结果为 `true` 或 `false` 的表达式（可能使用关系运算符）都可以视为操作数。\n\n| 运算符 | 说明 |\
    \ 示例用法 |\n| :--- | :--- | :--- |\n| `&&` | 逻辑与 | `(表达式 1) && (表达式 2)` |\n| `||`\
    \ | 逻辑或 | `(表达式 1) || (表达式 2)` |\n| `!` | 逻辑非 | `!(表达式 1)` |\n\n注意：如果表达式用作操作数，它们将首先被求值。\n\
    \n下面是一个展示逻辑运算符如何工作的 Go 程序：\n\n```go\n/*逻辑运算符演示*/\n/*包声明*/\npackage main\n\n/*导入语句\
    \ - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t\
    /*使用 var 关键字声明 float32 类型的变量*/\n\tvar a, b, c float32 = -65.736, 54.642, 0.003\n\
    \n\t/*短声明两个布尔变量*/\n\tx := true\n\ty := false\n\n\t/*打印各种操作的结果*/\n\tfmt.Printf(\"\
    \\nx = %t y = %t\", x, y)\n\tfmt.Printf(\"\\nx || y = %t, x && y = %t, !x = %t,\
    \ !y = %t\", x || y, x && y, !x, !y)\n\tfmt.Printf(\"\\n(a < b) && (b > c) = %t\"\
    , (a < b) && (b > c))\n\tfmt.Printf(\"\\n(a == c) || (c != b) = %t\", (a == c)\
    \ || (c != b))\n\tfmt.Printf(\"\\n(b != c) && (c <= a) = %t\", (b != c) && (c\
    \ <= a))\n\tfmt.Printf(\"\\n(a == b) || x = %t\\n\", (a == b) || x)\n}\n```\n\n\
    输出：\n![](img/Image00030.jpg)\n\n# 9.4 位运算符\n\n位运算符作用于操作数的各个位。操作将以逐位的方式进行。为了理解这类运算符，你需要了解一些二进制数系统和布尔代数的知识。\n\
    \n| 运算符 | 说明 | 示例用法 | 解释 |\n| :--- | :--- | :--- | :--- |\n| `&` | 位逻辑与 | `x &\
    \ y` | 在逐位的基础上对每个操作数执行逻辑与运算。 |\n| `|` | 位逻辑或 | `x | y` | 在逐位的基础上对每个操作数执行逻辑或运算。\
    \ |\n\n"
