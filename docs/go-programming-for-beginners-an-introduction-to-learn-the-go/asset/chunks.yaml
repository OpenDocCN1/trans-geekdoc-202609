  fmt: "\n# 11. Control Structures\n\nControl structures are programming constructs\
    \ used to give programmers better control over the flow of the program. When a\
    \ program is compiled, an executable binary file is built. This file contains\
    \ machine level instructions that are native to a particular platform. Every line\
    \ of meaningful code results in one or more machine level instructions. For example,\
    \ `var name string` will result in one type of a machine level instruction, `a\
    \ = b + c` will result in another type of an instruction. This is done by the\
    \ compiler and we do not have to worry about it. The point of bringing this up\
    \ in this chapter is to explain the flow of execution. So, back to the topic –\
    \ each line of code refers to one or more executable instructions. Many lines\
    \ of code will result in many machine level instructions. The executable binary\
    \ once run will start executing from the first instruction till the last one.\
    \ Conceptually, we can say that a program starts executing from the first line\
    \ of code till the last one (although in reality the program file is not the one\
    \ that executes, the executable binary does). This is a very linear flow of execution.\
    \ We can alter this flow of execution using control structures. Go offers decision\
    \ making constructs and loops as control structures.\n\n## 11.1 Decision Making\n\
    \nDecision making constructs introduce conditionality to the execution of a program.\
    \ For example, you can execute a block of code depending on whether a condition\
    \ is met or not met. Go offers decision making constructs in the form of `if-else`,\
    \ `switch` and some advanced constructs. We will take a look at `if-else` and\
    \ `switch`.\n\n### 11.1.1 If-Else construct\n\nThe If-Else construct is used to\
    \ execute a block of code if a given condition is `true` and optionally execute\
    \ a different block of code if the given condition is `false`. Let us begin with\
    \ a simple `if` block.\n\n**General syntax:**\n\n```\nif (<condition>) {\n   \
    \ /*Statements to be executed if <condition> is true*/\n}\n```\n\n**Example:**\n\
    \n```\nif (num == 0) {\n    fmt.Println(\"num is 0\")\n}\n```\n\nAn `if` statement\
    \ should be given a condition to evaluate marked by `<condition>` in the above\
    \ code snippet. This condition is usually a boolean expression which can evaluate\
    \ to either `true` or `false`. If it evaluates to `true`, the statements inside\
    \ the `if`-block (the block of code present within curly brackets after the `if`\
    \ statement) will be executed. If it evaluates to `false`, the `if` block will\
    \ be skipped and the program will resume execution from after the `if`-block.\n\
    \n> **Note:** The condition can be a simple boolean expression such as `(a ==\
    \ 0)` or a combination of many boolean expressions using logical operators such\
    \ as `(a != 0) && (b > 1)`.\n\nLet us write a simple program which demonstrates\
    \ the usage of an `if` statement:\n\n```go\n/*If Demo*/\n/*Package Declaration*/\n\
    package main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\
    \n)\n\n/*Mandatory main function*/\nfunc main() {\n    var a int = 20\n\n    fmt.Printf(\"\
    \\nProgram execution begins. This statement is before the if block.\\n\")\n\n\
    \    /*Check if a is greater than 10*/\n    if (a > 10) {\n        fmt.Printf(\"\
    \\nInside if block.\\n%d is greater than 10.\\n\", a)\n    }\n\n    fmt.Printf(\"\
    \\nOutside if block. Program coming to an end.\\n\")\n}\n```\n\n**Output:**\n\
    ![](Image00041.jpg)\n\nIn this example, we had set a condition which evaluates\
    \ to `true` and the `if`-block executes. Let us change the code, modify `if (a\
    \ > 10)` to `if (a < 10)` and see what happens:\n\n**Output:**\n![](Image00042.jpg)\n\
    \nAs seen, the statements inside the `if` block do not get executed when the given\
    \ condition evaluates to `false`. It is possible to execute a different block\
    \ of code when the given condition evaluates to `false` using an `else` block.\
    \ The `else` block should immediately follow the `if` block.\n\n**General syntax:**\n\
    \n```\nif (<condition>) {\n    /*Statements to be executed if <condition> is true*/\n\
    } else {\n    /*Statements to be executed if <condition> is false*/\n}\n```\n\n\
    **Example:**\n\n```\nif (num == 0) {\n    fmt.Println(\"num is 0\")\n} else {\n\
    \    fmt.Println(\"num is NOT 0\")\n}\n```\n\nThe working of `if-else` construct\
    \ is simple – if the condition evaluates to `true`, the `if` block will be executed\
    \ and the `else` block will be skipped and if it evaluates to `false`, the `if`\
    \ block will be skipped and the `else` block will be executed.\n\nLet us write\
    \ a program using `if` and `else` blocks and see what happens when the given condition\
    \ of the `if` block evaluates to `false`.\n\n```go\n/*If Else Demo*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    var a int\
    \ = 5\n\n    fmt.Printf(\"\\nProgram execution begins. This statement is before\
    \ the if block.\\n\")\n\n    /*Check if a is greater than 10*/\n    if (a > 10)\
    \ {\n        fmt.Printf(\"\\nInside if block.\\n%d is greater than 10.\\n\", a)\n\
    \    } else {\n        fmt.Printf(\"\\nInside else block.\\n%d is NOT greater\
    \ than 10.\\n\", a)\n    }\n\n    fmt.Printf(\"\\nOutside if/else blocks. Program\
    \ coming to an end.\\n\")\n}\n```\n\n**Output:**\n![](Image00043.jpg)\n\nAs seen,\
    \ the condition `(a > 10)` evaluates to `false` as `a` is `5`. As a result, the\
    \ `if` block gets skipped and the `else` block gets executed.\n\nOne `if-else`\
    \ block combination will check for the validity of one condition. Depending on\
    \ what the given condition evaluates to, either `if` or `else` block will get\
    \ executed. If you want to check for more than one conditions, you can nest `if-else`\
    \ blocks within `if-else` blocks like this:\n\n```\nif (<condition 1>) {\n   \
    \ /*Statements to be executed if <condition 1> is true*/\n    if (<condition 2>)\
    \ {\n        /*Statements to be executed if <condition 1> and <condition 2> are\
    \ true*/\n    } else {\n        /*Statements to be executed if <condition 1> is\
    \ true and <condition 2> is false*/\n    }\n} else {\n    /*Statements to be executed\
    \ if <condition 1> is false*/\n    if (<condition 3>) {\n        /*Statements\
    \ to be executed if <condition 1> is false and <condition 3> is true*/\n    }\
    \ else {\n        /*Statements to be executed if <condition 1> and <condition\
    \ 3> is false*/\n    }\n}\n```\n\nAnother way of checking for multiple conditions\
    \ is by using `else-if` blocks. There will be a mandatory `if`-block and an optional\
    \ `else`-block. Between these blocks, you can have as many `else-if` blocks as\
    \ you want where each `else-if` statement will have its own condition. This way\
    \ you can check for as many conditions as you want. Here is a general syntax:\n\
    \n```\nif (<condition 1>) {\n    /* This block will be executed if <condition\
    \ 1> is true. */\n} else if (<condition 2>) {\n    /*This block will be executed\
    \ if <condition 1> is false <condition 2> is true */\n} else if (<condition 3>)\
    \ {\n    /*This block will be executed if <condition 1> and <condition 2> are\
    \ false and <condition 3> is true.*/\n} else {\n    /*This block will be executed\
    \ if <condition 1>, <condition 2> and <condition 3> are  false.*/\n}\n```\n\n\
    When there is a combination of `if-else if-else` blocks, what happens is – the\
    \ condition of the `if` statement will be checked. If that condition evaluates\
    \ to `true`, the `if` block will be executed and that will be end of the story!\
    \ All the remaining blocks will be skipped. However, if the condition evaluates\
    \ to `false`, the execution control will jump to the `else if` statement that\
    \ follows and its condition will be checked. If it evaluates to `true`, that particular\
    \ `else if` block will be executed and rest of the blocks will be skipped. If\
    \ its condition evaluates to `false`, the control will jump to the next `else-if`\
    \ block (if present) and that block’s condition will be checked. This process\
    \ will continue until either a valid condition is found or there are no more `else-if`\
    \ blocks left. If none of the conditions evaluate to `true`, the `else` block\
    \ (if present) will be evaluated.\n\nLet us write a Go program to check if a given\
    \ number is positive, negative or zero:\n\n```go\n/*Positive Negative Zero */\n\
    /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt and strconv\
    \ package*/\nimport (\n    \"fmt\"\n    \"strconv\"\n)\n\n/*Mandatory main function*/\n\
    func main() {\n    /*Declare variable to store input*/\n    var num_str string\n\
    \n    fmt.Printf(\"\\nEnter a number: \")\n\n    /*Read user input using Scanln\
    \ function*/\n    fmt.Scanln(&num_str)\n\n    /*Convert num_str to integer*/\n\
    \    num, err := strconv.Atoi(num_str)\n\n    /*Assign err to blank identifiers*/\n\
    \    _ = err\n\n    /*Check if num > 0*/\n    if (num > 0) {\n        fmt.Printf(\"\
    \\n%d is positive.\\n\", num)\n    } else if (num < 0) {\n        fmt.Printf(\"\
    \\n%d is negative.\\n\", num)\n    } else {\n        fmt.Printf(\"\\n%d is zero.\\\
    n\", num)\n    }\n}\n```\n\n**Output:**\n![](Image00044.jpg)\n\n### 11.1.2 Switch-Case\
    \ construct\n\nWe have seen how to check for the validity of multiple conditions\
    \ using multiple `else if` blocks. The `switch-case` construct provides an even\
    \ better way of handling multiple conditions. There are multiple ways of writing\
    \ a `switch-case` construct and we will take a look at a few important ones. Let\
    \ us start with the basic format:\n\n```\nswitch (<expression>) {\n    case <constant\
    \ expression 1>:\n        /*Statements to be executed if <expression> matches\
    \ <constant expression 1>*/\n    case <constant expression 2>:\n        /*Statements\
    \ to be executed if <expression> matches <constant expression 2>*/\n    case <constant\
    \ expression 3>:\n        /*Statements to be executed if <expression> matches\
    \ <constant expression 3>*/\n    ...\n    case <constant expression n>:\n    \
    \    /*Statements to be executed if <expression> matches <constant expression\
    \ n>*/\n    default:\n        /*Statements to be executed if <expression> finds\
    \ no match*/\n}\n```\n\nIn this syntax of `switch-case` construct, the `switch`\
    \ statement is given an expression to work with – marked by `<expression>` in\
    \ the above code snippet. An expression can be something as simple as a variable.\
    \ Inside the `switch` block, there are multiple `case` blocks where each `case`\
    \ statement has a constant expression. When the `switch` statement is encountered,\
    \ its expression is evaluated. The resulting value will be checked against the\
    \ constant expressions of `case` blocks. If the resulting value matches one of\
    \ the constant expressions, that particular `case` block is executed. This process\
    \ is known as **testing for cases**. If the values does not match any of the constant\
    \ expressions, the `default` case block (if present) is executed.\n\nHere is a\
    \ simple `switch-case` demo:\n\n```go\n/*Switch Demo 1*/\n/*Package Declaration*/\n\
    package main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\
    \n)\n\n/*Mandatory main function*/\nfunc main() {\n    /*Create a variable for\
    \ switch*/\n    Option := 3\n\n    /*Switch Option, where Option is int variable\
    \ assigned to 3*/\n    switch (Option) {\n        /*Various cases to match Option*/\n\
    \        case 1:\n            fmt.Printf(\"\\nOption is 1.\\n\")\n        case\
    \ 2:\n            fmt.Printf(\"\\nOption is 2.\\n\")\n        case 3:\n      \
    \      fmt.Printf(\"\\nOption is 3.\\n\")\n        /*Default case incase there\
    \ is no match*/\n        default:\n            fmt.Printf(\"\\nOption does not\
    \ match any of the cases.\\n\")\n    }\n}\n```\n\n**Output:**\n![](Image00045.jpg)\n\
    \nIn the above program, there are 3 cases and the variable `Option` is used to\
    \ switch. This variable has been assigned to `3`, let us change `Option` to `1`\
    \ and `9` and see what happens:\n\n**Output (Option = 1):**\n![](Image00046.jpg)\n\
    \n**Output (Option = 9):**\n![](Image00047.jpg)\n\nThe variable used to switch\
    \ can also be set in the `switch` statement itself as follows:\n\n```\nswitch\
    \ <optional statement, set variable> (<variable/expression>) {\n    case <constant\
    \ expression 1>:\n        /*Statements to be executed if <expression> matches\
    \ <constant expression 1>*/\n    ...\n    case <constant expression n>:\n    \
    \    /*Statements to be executed if <expression> matches <constant expression\
    \ n>*/\n    default:\n        /*Statements to be executed if <expression> finds\
    \ no match*/\n}\n```\n\nLet us re-write the previous program and set `Option`\
    \ to `2` in the `switch` statement itself:\n\n```go\n/*Switch Demo 1*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    /*Switch\
    \ Option, where Option is int variable short-declared and assigned to 2*/\n  \
    \  switch Option := 2; (Option) {\n        /*Various cases to match Option*/\n\
    \        case 1:\n            fmt.Printf(\"\\nOption is 1.\\n\")\n        case\
    \ 2:\n            fmt.Printf(\"\\nOption is 2.\\n\")\n        case 3:\n      \
    \      fmt.Printf(\"\\nOption is 3.\\n\")\n        /*Default case incase there\
    \ is no match*/\n        default:\n            fmt.Printf(\"\\nOption does not\
    \ match any of the cases.\\n\")\n    }\n}\n```\n\n**Output:**\n![](Image00048.jpg)\n\
    \nAnother way of writing a `switch-case` construct is by using boolean expressions\
    \ for each `case` statement as follows:\n\n```\nswitch {\n    case <boolean expression\
    \ 1>:\n        /*Statements to be executed <boolean expression 1> evaluates to\
    \ true */\n    case <boolean expression 2>:\n        /*Statements to be executed\
    \ <boolean expression 2> evaluates to true */\n    case <boolean expression 3>:\n\
    \        /*Statements to be executed <boolean expression 3> evaluates to true\
    \ */\n    ...\n    case <boolean expression n>:\n        /*Statements to be executed\
    \ <boolean expression n> evaluates to true */\n    default:\n        /*Statements\
    \ to be executed if all boolean expressions are false */\n}\n```\n\nLet us write\
    \ a program to read a number from the user and check whether it is odd or even.\
    \ We will use the `switch-case` syntax from the above code snippet:\n\n```go\n\
    /*Switch Demo 2 -- Odd or Even*/\n/*Package Declaration*/\npackage main\n\n/*Import\
    \ Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n    /*Declare a variable to store a number*/\n  \
    \  var num int\n\n    /*Prompt the user to enter a number and read using scanf*/\n\
    \    fmt.Printf(\"\\nEnter a number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /*Switch\
    \ num % 2*/\n    switch {\n        /*Various cases for each outcome*/\n      \
    \  /*If the remainder is zero, the number is even*/\n        case (num % 2) ==\
    \ 0:\n            fmt.Printf(\"\\n%d is even.\\n\", num)\n        /*If the remainder\
    \ is one, the number is odd*/\n        case (num % 2) == 1:\n            fmt.Printf(\"\
    \\n%d is odd.\\n\", num)\n    }\n}\n```\n\n**Output:**\n![](Image00049.jpg)\n\n\
    A `switch-case` construct can be used to switch using a variable of any basic\
    \ data type, does not have to be a number. Let us write a program to ask the user\
    \ to enter the name of a month and determine its serial number:\n\n```go\n/*Switch\
    \ Demo 3*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
    \ fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc\
    \ main() {\n    /*Declare a variable to store the name of the month*/\n    var\
    \ month string\n\n    /*Prompt the user to enter the name of a month and read\
    \ using scanf*/\n    fmt.Printf(\"\\nEnter month: \")\n    fmt.Scanf(\"%s\", &month)\n\
    \n    /*Switch month*/\n    switch month {\n        /*Various cases for each month*/\n\
    \        case \"January\", \"january\":\n            fmt.Printf(\"\\nJanuary comes\
    \ at No.1 in a year.\\n\")\n        case \"February\", \"february\":\n       \
    \     fmt.Printf(\"\\nFebruary comes at No.2 in a year.\\n\")\n        case \"\
    March\", \"march\":\n            fmt.Printf(\"\\nMarch comes at No.3 in a year.\\\
    n\")\n        case \"April\", \"april\":\n            fmt.Printf(\"\\nApril comes\
    \ at No.4 in a year.\\n\")\n        case \"May\", \"may\":\n            fmt.Printf(\"\
    \\nMay comes at No.5 in a year.\\n\")\n        case \"June\", \"june\":\n    \
    \        fmt.Printf(\"\\nJune comes at No.6 in a year.\\n\")\n        case \"\
    July\", \"july\":\n            fmt.Printf(\"\\nJuly comes at No.7 in a year.\\\
    n\")\n        case \"August\", \"august\":\n            fmt.Printf(\"\\nAugust\
    \ comes at No.8 in a year.\\n\")\n        case \"September\", \"september\":\n\
    \            fmt.Printf(\"\\nSeptember comes at No.9 in a year.\\n\")\n      \
    \  case \"October\", \"october\":\n            fmt.Printf(\"\\nOctober comes at\
    \ No.10 in a year.\\n\")\n        case \"November\", \"november\":\n         \
    \   fmt.Printf(\"\\nNovember comes at No.11 in a year.\\n\")\n        case \"\
    December\", \"december\":\n            fmt.Printf(\"\\nDecember comes at No.12\
    \ in a year.\\n\")\n        /*Default case*/\n        default:\n            fmt.Printf(\"\
    \\n%s does not seem like the name of a month!\\n\")\n    }\n}\n```\n\n**Output:**\n\
    ![](Image00050.jpg)\n\nRefer to the program, notice how each `case` has two constant\
    \ expressions. When you need to execute the same piece of code for more than one\
    \ constant expressions, instead of writing a separate `case` with a different\
    \ constant expression, you can write just one `case` statement with multiple constant\
    \ expressions separated by comma.\n\n## 11.2 Loops\n\nA loop is a programming\
    \ construct with which a piece of code can be run over and over again depending\
    \ on whether or not a condition is met. Go offers only one loop called `for` loop.\n\
    \n### 11.2.1 for Loop\n\nThe basic syntax of `for` loop is as follows:\n\n```\n\
    for <condition> {\n    /*Statements to be executed as long as <condition> is true*/\n\
    }\n```\n\n**Example:**\n\n```\nnum := 0\nfor num < 5 {\n    fmt.Printf(\"num =\
    \ %d\", num)\n    num = num + 1\n}\n```\n\nWhen the execution control encounters\
    \ a `for` loop, its condition is checked. If it evaluates to `true`, the statement\
    \ inside the loop block are executed. This is one **loop iteration**. Once the\
    \ end of the loop block is reached, the execution control will jump back to the\
    \ `for` statement and check the condition again. If it evaluates to `true` again,\
    \ the loop block will be executed once again. Such loop iterations will go on\
    \ happening as long as the given condition evaluates to `true`. Once it evaluates\
    \ to `false`, the execution control will come out of the loop. If the condition\
    \ never becomes `false`, the loop will go on executing. Such a loop is known as\
    \ an **infinite loop**.\n\nHere is a program that prints 0 to 9 using a `for`\
    \ loop:\n\n```go\n/*For Demo 1*/\n/*Package Declaration*/\npackage main\n\n/*Import\
    \ Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n    /*Initialize an integer variable to 0*/\n   \
    \ var count int = 0\n\n    /*Run for loop from 0 to 9*/\n    for (count < 10)\
    \ {\n        /*Print count*/\n        fmt.Printf(\"count = %d\\n\", count)\n \
    \       /*Increment count*/\n        count++\n    }\n}\n```\n\n**Output:**\n![](Image00051.jpg)\n\
    \nAnother way of writing a `for` loop is by using a **loop variable**. Here is\
    \ the general syntax:\n\n```\nfor <loop variable initialization>; <condition>;\
    \ <loop variable increment/decrement> {\n    /*Statements to be executed as long\
    \ as <condition> is true*/\n}\n```\n\nUsing this syntax, you can initialize a\
    \ loop variable in the `for` statement itself. It also gives you an option to\
    \ increment/decrement the loop variable. At the end of each iteration, the given\
    \ condition will be checked. If it evaluates to `true`, the loop variable will\
    \ be incremented/decremented and then loop block will be executed as the next\
    \ iteration. The loop variable can also be short-declared in the `for` statement\
    \ if it is not declared before.\n\nUsing this syntax, let us write a program to\
    \ print multiples of 5. The loop variable has been short-declared in the `for`\
    \ statement:\n\n```go\n/*For Demo 2*/\n/*Package Declaration*/\npackage main\n\
    \n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    fmt.Printf(\"\\nMultiples of 5\\n\\n\")\n\
    \n    /*Run for loop from 1 to 10*/\n    for count := 1; count <= 10; count++\
    \ {\n        /*Print count * 5*/\n        fmt.Printf(\"%d\\n\", count * 5)\n \
    \   }\n}\n```\n\n**Output:**\n![](Image00052.jpg)\n\nHere is an example where\
    \ the loop variable has been previously declared:\n\n```go\n/*For Demo 3*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    /*Declare\
    \ an int variable*/\n    var count int\n\n    fmt.Printf(\"\\nMultiples of 3\\\
    n\\n\")\n\n    /*Run for loop from 1 to 20*/\n    for count = 1; count <= 20;\
    \ count++ {\n        /*Print count * 3*/\n        fmt.Printf(\"%d\\n\", count\
    \ * 3)\n    }\n}\n```\n\n**Output:**\n![](Image00053.jpg)\n\n### 11.2.2 Control\
    \ Statements\n\nAs long as the given condition is `true`, a loop will go on executing.\
    \ This is the normal execution process of a loop. It is possible to alter this\
    \ flow of execution of a loop using control statements such as `continue` and\
    \ `break`.\n\n#### 11.2.2.1 continue statement\n\nWhen a `continue` statement\
    \ is encountered, the execution control jumps to the beginning of the loop thereby\
    \ skipping all the statements after the `continue` statement. In other words,\
    \ the loop moves to the next iteration.\n\nLet us write a program to print only\
    \ odd numbers between 1 and 30:\n\n```go\n/*For Demo -- continue */\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    fmt.Printf(\"\
    \\nOdd numbers between 1 and 30\\n\\n\")\n\n    /*Run for loop from 1 to 30*/\n\
    \    for count := 1; count <= 30; count++ {\n        if (count % 2 == 0) {\n \
    \           continue\n        }\n        fmt.Printf(\"%d\\n\", count)\n    }\n\
    }\n```\n\n**Output:**\n![](Image00054.jpg)\n\n#### 11.2.2.2 break statement\n\n\
    When a `break` statement is encountered, the execution of the loop halts and the\
    \ control comes out of the loop.\n\nLet us understand this concept with a programming\
    \ example. We shall run a loop from 1 to 10 and break out of the loop when `count`\
    \ becomes 7:\n\n```go\n/*For Demo -- break */\n/*Package Declaration*/\npackage\
    \ main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\
    \n/*Mandatory main function*/\nfunc main() {\n    /*Run for loop from 1 to 10*/\n\
    \    for count := 1; count <= 10; count++ {\n        if (count == 7) {\n     \
    \       break\n        }\n        fmt.Printf(\"count = %d\\n\", count)\n    }\n\
    }\n```\n\n**Output:**\n![](Image00055.jpg)\n\nA more practical use of the `break`\
    \ statement can be understood with the help of the following program where we\
    \ ask the user to enter a number and determine whether it is prime or composite:\n\
    \n```go\n/*Prime or composite - using break*/\n/*Package Declaration*/\npackage\
    \ main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\
    \n/*Mandatory main function*/\nfunc main() {\n    /*Declare variable to store\
    \ user input and to serve as loop counter*/\n    var i, num int\n\n    /*Prompt\
    \ the user to enter a number and read using Scanf*/\n    fmt.Printf(\"\\nEnter\
    \ a number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /*Run loop from 2 to num as\
    \ every number is divisible by 1*/\n    for i = 2; i <= num; i++ {\n        if\
    \ (num % i == 0) {\n            break\n        }\n    }\n\n    if (num != i) {\n\
    \        fmt.Printf(\"\\n%d is a composite number.\\n\", num)\n    } else {\n\
    \        fmt.Printf(\"\\n%d is a prime number.\\n\", num)\n    }\n}\n```\n\n**Output:**\n\
    ![](Image00056.jpg)\n\nLet us write a few more programs to gain better understanding\
    \ of loops. Following is a program that calculates factorial of a given number.\
    \ Factorial of a number `n` is represented as `n! = n x (n -1) x (n - 2) x ...\
    \ x 1`. Factorial of a negative number cannot be calculated and the factorial\
    \ of zero is 1.\n\n```go\n/*Factorial*/\n/*Package Declaration*/\npackage main\n\
    \n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    /*Declare variable to store user input,\
    \ loop counter and factorial*/\n    var i, num int\n    var f int = 1\n\n    /*Prompt\
    \ the user to enter a number and read using Scanf*/\n    fmt.Printf(\"\\nEnter\
    \ a number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /*Run loop from num to 1*/\n\
    \    for i = num; i > 0; i-- {\n        f = f * i\n    }\n\n    if (num >= 0)\
    \ {\n        fmt.Printf(\"\\nFactorial of %d is %d\\n\", num, f)\n    } else {\n\
    \        fmt.Printf(\"\\nFactorial of a negative number cannot be calculated\\\
    n\")\n    }\n}\n```\n\n**Output:**\n![](Image00057.jpg)\n\nLet us write another\
    \ program using loops where we will calculate the sum of first `n` even numbers.\n\
    \n```go\n/*Sum of n even numbers*/\n/*Package Declaration*/\npackage main\n\n\
    /*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    /*Declare variable to store n, loop counter\
    \ and sum*/\n    var i, n int\n    var even_num, sum int = 1, 0\n\n    /*Prompt\
    \ the user to enter a number and read using Scanf*/\n    fmt.Printf(\"\\nEnter\
    \ n: \")\n    fmt.Scanf(\"%d\", &n)\n\n    fmt.Printf(\"\\nFirst %d even numbers:\
    \ \\n\\n\", n)\n\n    for i = 1; even_num <= n; i++ {\n        if (i % 2 == 0)\
    \ {\n            fmt.Printf(\"%d \", i)\n            sum += i\n            even_num++\n\
    \        }\n    }\n\n    fmt.Printf(\"\\n\\nSum of above even numbers: %d\\n\"\
    , sum)\n}\n```\n\n**Output:**\n![](Image00058.jpg)\n"
  trans: "\n\n# 11. 控制结构\n\n控制结构是用于让程序员更好地控制程序执行流程的编程构造。当程序被编译时，会构建一个可执行的二进制文件。该文件包含特定平台原生的机器级指令。每一行有意义的代码都会产生一条或多条机器级指令。例如，`var\
    \ name string` 将产生一类机器级指令，而 `a = b + c` 将产生另一类指令。这是由编译器完成的，我们无需担心。在此章节中提及这一点的目的是为了解释执行流程。回到主题——每一行代码对应一条或多条可执行指令。多行代码将产生多条机器级指令。可执行二进制文件一旦运行，将从第一条指令开始执行，直到最后一条。从概念上讲，我们可以认为程序从第一行代码开始执行，直到最后一行（尽管实际上执行的是可执行二进制文件，而不是程序文件本身）。这是一种非常线性的执行流程。我们可以使用控制结构来改变这种执行流程。Go\
    \ 语言提供了决策构造和循环作为控制结构。\n\n## 11.1 决策制定\n\n决策构造为程序的执行引入了条件性。例如，你可以根据某个条件是否满足来执行一块代码。Go\
    \ 语言以 `if-else`、`switch` 以及一些高级构造的形式提供了决策构造。我们将重点介绍 `if-else` 和 `switch`。\n\n\
    ### 11.1.1 If-Else 构造\n\nIf-Else 构造用于在给定条件为 `true` 时执行一块代码，并可选择在给定条件为 `false`\
    \ 时执行另一块不同的代码。让我们从一个简单的 `if` 块开始。\n\n**通用语法：**\n\n```\nif (<condition>) {\n  \
    \  /* 如果 <condition> 为 true 则执行的语句 */\n}\n```\n\n**示例：**\n\n```\nif (num == 0)\
    \ {\n    fmt.Println(\"num is 0\")\n}\n```\n\n`if` 语句应提供一个用于求值的条件，在上述代码片段中标记为\
    \ `<condition>`。该条件通常是一个布尔表达式，其求值结果为 `true` 或 `false`。如果求值为 `true`，则执行 `if` 块内的语句（即\
    \ `if` 语句后花括号内的代码块）。如果求值为 `false`，则跳过 `if` 块，程序将从 `if` 块之后恢复执行。\n\n> **注意：** 条件可以是简单的布尔表达式，如\
    \ `(a == 0)`，也可以是使用逻辑运算符组合的多个布尔表达式，如 `(a != 0) && (b > 1)`。\n\n让我们编写一个简单的程序来演示\
    \ `if` 语句的用法：\n\n```go\n/* If Demo */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入\
    \ fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n  \
    \  var a int = 20\n\n    fmt.Printf(\"\\nProgram execution begins. This statement\
    \ is before the if block.\\n\")\n\n    /* 检查 a 是否大于 10 */\n    if (a > 10) {\n\
    \        fmt.Printf(\"\\nInside if block.\\n%d is greater than 10.\\n\", a)\n\
    \    }\n\n    fmt.Printf(\"\\nOutside if block. Program coming to an end.\\n\"\
    )\n}\n```\n\n**输出：**\n![](img/Image00041.jpg)\n\n在本例中，我们设置了一个求值为 `true` 的条件，因此\
    \ `if` 块得以执行。让我们修改代码，将 `if (a > 10)` 改为 `if (a < 10)` 并观察结果：\n\n**输出：**\n![](img/Image00042.jpg)\n\
    \n可以看到，当给定条件求值为 `false` 时，`if` 块内的语句不会被执行。可以使用 `else` 块在条件求值为 `false` 时执行另一块不同的代码。`else`\
    \ 块必须紧跟在 `if` 块之后。\n\n**通用语法：**\n\n```\nif (<condition>) {\n    /* 如果 <condition>\
    \ 为 true 则执行的语句 */\n} else {\n    /* 如果 <condition> 为 false 则执行的语句 */\n}\n```\n\
    \n**示例：**\n\n```\nif (num == 0) {\n    fmt.Println(\"num is 0\")\n} else {\n \
    \   fmt.Println(\"num is NOT 0\")\n}\n```\n\n`if-else` 构造的工作原理很简单——如果条件求值为 `true`，则执行\
    \ `if` 块并跳过 `else` 块；如果求值为 `false`，则跳过 `if` 块并执行 `else` 块。\n\n让我们编写一个使用 `if` 和\
    \ `else` 块的程序，看看当 `if` 块的给定条件求值为 `false` 时会发生什么。\n\n```go\n/* If Else Demo */\n\
    /* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n\
    /* 强制性的 main 函数 */\nfunc main() {\n    var a int = 5\n\n    fmt.Printf(\"\\nProgram\
    \ execution begins. This statement is before the if block.\\n\")\n\n    /* 检查\
    \ a 是否大于 10 */\n    if (a > 10) {\n        fmt.Printf(\"\\nInside if block.\\\
    n%d is greater than 10.\\n\", a)\n    } else {\n        fmt.Printf(\"\\nInside\
    \ else block.\\n%d is NOT greater than 10.\\n\", a)\n    }\n\n    fmt.Printf(\"\
    \\nOutside if/else blocks. Program coming to an end.\\n\")\n}\n```\n\n**输出：**\n\
    ![](img/Image00043.jpg)\n\n可以看到，条件 `(a > 10)` 求值为 `false`，因为 `a` 为 `5`。因此，`if`\
    \ 被跳过，`else` 块得以执行。\n\n一个 `if-else` 块组合只会检查一个条件的有效性。根据给定条件的求值结果，将执行 `if` 或 `else`\
    \ 块。如果你想检查多个条件，可以在 `if-else` 块内嵌套 `if-else` 块，如下所示：\n\n```\nif (<condition 1>)\
    \ {\n    /* 如果 <condition 1> 为 true 则执行的语句 */\n    if (<condition 2>) {\n    \
    \    /* 如果 <condition 1> 和 <condition 2> 都为 true 则执行的语句 */\n    } else {\n   \
    \     /* 如果 <condition 1> 为 true 且 <condition 2> 为 false 则执行的语句 */\n    }\n} else\
    \ {\n    /* 如果 <condition 1> 为 false 则执行的语句 */\n    if (<condition 3>) {\n   \
    \     /* 如果 <condition 1> 为 false 且 <condition 3> 为 true 则执行的语句 */\n    } else\
    \ {\n        /* 如果 <condition 1> 和 <condition 3> 都为 false 则执行的语句 */\n    }\n}\n\
    ```\n\n检查多个条件的另一种方法是使用 `else-if` 块。将有一个强制性的 `if` 块和一个可选的 `else` 块。在这两个块之间，你可以拥有任意数量的\
    \ `else-if` 块，每个 `else-if` 语句都有自己的条件。这样你就可以检查任意数量的条件。以下是通用语法：\n\n```\nif (<condition\
    \ 1>) {\n    /* 如果 <condition 1> 为 true，则执行此块。 */\n} else if (<condition 2>) {\n\
    \    /* 如果 <condition 1> 为 false 且 <condition 2> 为 true，则执行此块。 */\n} else if (<condition\
    \ 3>) {\n    /* 如果 <condition 1> 和 <condition 2> 为 false 且 <condition 3> 为 true，则执行此块。\
    \ */\n} else {\n    /* 如果 <condition 1>、<condition 2> 和 <condition 3> 都为 false，则执行此块。\
    \ */\n}\n```\n\n当存在 `if-else if-else` 块组合时，发生的过程是——首先检查 `if` 语句的条件。如果该条件求值为 `true`，则执行\
    \ `if` 块，故事到此结束！所有剩余的块都将被跳过。然而，如果条件求值为 `false`，执行控制将跳转到紧随其后的 `else if` 语句并检查其条件。如果求值为\
    \ `true`，则执行该特定的 `else if` 块，其余块被跳过。如果其条件求值为 `false`，控制将跳转到下一个 `else-if` 块（如果存在），并检查该块的条件。此过程将持续进行，直到找到一个有效的条件，或者不再有\
    \ `else-if` 块为止。如果没有任何条件求值为 `true`，则会执行 `else` 块（如果存在）。\n\n让我们编写一个 Go 程序来检查给定的数字是正数、负数还是零：\n\
    \n```go\n/* Positive Negative Zero */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入\
    \ fmt 和 strconv 包 */\nimport (\n    \"fmt\"\n    \"strconv\"\n)\n\n/* 强制性的 main\
    \ 函数 */\nfunc main() {\n    /* 声明变量存储输入 */\n    var num_str string\n\n    fmt.Printf(\"\
    \\nEnter a number: \")\n\n    /* 使用 Scanln 函数读取用户输入 */\n    fmt.Scanln(&num_str)\n\
    \n    /* 将 num_str 转换为整数 */\n    num, err := strconv.Atoi(num_str)\n\n    /* 将\
    \ err 赋值给空标识符 */\n    _ = err\n\n    /* 检查 num > 0 */\n    if (num > 0) {\n  \
    \      fmt.Printf(\"\\n%d is positive.\\n\", num)\n    } else if (num < 0) {\n\
    \        fmt.Printf(\"\\n%d is negative.\\n\", num)\n    } else {\n        fmt.Printf(\"\
    \\n%d is zero.\\n\", num)\n    }\n}\n```\n\n**输出：**\n![](img/Image00044.jpg)\n\
    \n### 11.1.2 Switch-Case 构造\n\n我们已经了解了如何使用多个 `else if` 块来检查多个条件的有效性。`switch-case`\
    \ 构造提供了一种处理多个条件的更好方式。编写 `switch-case` 构造有多种方式，我们将介绍几种重要的方式。让我们从基本格式开始：\n\n```\n\
    switch (<expression>) {\n    case <constant expression 1>:\n        /* 如果 <expression>\
    \ 匹配 <constant expression 1> 则执行的语句 */\n    case <constant expression 2>:\n  \
    \      /* 如果 <expression> 匹配 <constant expression 2> 则执行的语句 */\n    case <constant\
    \ expression 3>:\n        /* 如果 <expression> 匹配 <constant expression 3> 则执行的语句\
    \ */\n    ...\n    case <constant expression n>:\n        /* 如果 <expression> 匹配\
    \ <constant expression n> 则执行的语句 */\n    default:\n        /* 如果 <expression>\
    \ 未找到匹配项则执行的语句 */\n}\n```\n\n在这种 `switch-case` 构造语法中，`switch` 语句被赋予一个用于工作的表达式——在上述代码片段中标记为\
    \ `<expression>`。表达式可以像变量一样简单。在 `switch` 块内部，有多个 `case` 块，每个 `case` 语句都有一个常量表达式。当遇到\
    \ `switch` 语句时，其表达式会被求值。生成的值将与 `case` 块的常量表达式进行比对。如果生成的值与其中一个常量表达式匹配，则执行该特定的 `case`\
    \ 块。这个过程称为**情况测试**。如果值与任何常量表达式都不匹配，则执行 `default` case 块（如果存在）。\n\n这是一个简单的 `switch-case`\
    \ 演示：\n\n```go\n/* Switch Demo 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt\
    \ 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /*\
    \ 创建一个用于 switch 的变量 */\n    Option := 3\n\n    /* Switch Option，其中 Option 是赋值为\
    \ 3 的 int 变量 */\n    switch (Option) {\n        /* 用于匹配 Option 的各种 case */\n \
    \       case 1:\n            fmt.Printf(\"\\nOption is 1.\\n\")\n        case\
    \ 2:\n            fmt.Printf(\"\\nOption is 2.\\n\")\n        case 3:\n      \
    \      fmt.Printf(\"\\nOption is 3.\\n\")\n        /* 如果没有匹配项的默认 case */\n   \
    \     default:\n            fmt.Printf(\"\\nOption does not match any of the cases.\\\
    n\")\n    }\n}\n```\n\n**输出：**\n![](img/Image00045.jpg)\n\n在上述程序中，有 3 个 case，变量\
    \ `Option` 用于 switch。该变量已赋值为 `3`，让我们将 `Option` 改为 `1` 和 `9` 并观察结果：\n\n**输出 (Option\
    \ = 1)：**\n![](img/Image00046.jpg)\n\n**输出 (Option = 9)：**\n![](img/Image00047.jpg)\n\
    \n用于 switch 的变量也可以在 `switch` 语句本身中设置，如下所示：\n\n```\nswitch <optional statement,\
    \ set variable> (<variable/expression>) {\n    case <constant expression 1>:\n\
    \        /* 如果 <expression> 匹配 <constant expression 1> 则执行的语句 */\n    ...\n  \
    \  case <constant expression n>:\n        /* 如果 <expression> 匹配 <constant expression\
    \ n> 则执行的语句 */\n    default:\n        /* 如果 <expression> 未找到匹配项则执行的语句 */\n}\n\
    ```\n\n让我们重写之前的程序，在 `switch` 语句本身中将 `Option` 设置为 `2`：\n\n```go\n/* Switch Demo\
    \ 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\
    \n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* Switch Option，其中 Option 是在 switch\
    \ 中短声明并赋值为 2 的 int 变量 */\n    switch Option := 2; (Option) {\n        /* 用于匹配\
    \ Option 的各种 case */\n        case 1:\n            fmt.Printf(\"\\nOption is 1.\\\
    n\")\n        case 2:\n            fmt.Printf(\"\\nOption is 2.\\n\")\n      \
    \  case 3:\n            fmt.Printf(\"\\nOption is 3.\\n\")\n        /* 如果没有匹配项的默认\
    \ case */\n        default:\n            fmt.Printf(\"\\nOption does not match\
    \ any of the cases.\\n\")\n    }\n}\n```\n\n**输出：**\n![](img/Image00048.jpg)\n\
    \n编写 `switch-case` 构造的另一种方式是为每个 `case` 语句使用布尔表达式，如下所示：\n\n```\nswitch {\n    case\
    \ <boolean expression 1>:\n        /* 当 <boolean expression 1> 求值为 true 时执行的语句\
    \ */\n    case <boolean expression 2>:\n        /* 当 <boolean expression 2> 求值为\
    \ true 时执行的语句 */\n    case <boolean expression 3>:\n        /* 当 <boolean expression\
    \ 3> 求值为 true 时执行的语句 */\n    ...\n    case <boolean expression n>:\n        /*\
    \ 当 <boolean expression n> 求值为 true 时执行的语句 */\n    default:\n        /* 当所有布尔表达式都为\
    \ false 时执行的语句 */\n}\n```\n\n让我们编写一个程序从用户处读取一个数字并检查它是奇数还是偶数。我们将使用上述代码片段中的 `switch-case`\
    \ 语法：\n\n```go\n/* Switch Demo 2 -- Odd or Even */\n/* 包声明 */\npackage main\n\n\
    /* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n    /* 声明一个变量存储数字 */\n    var num int\n\n    /* 提示用户输入数字并使用 scanf 读取 */\n\
    \    fmt.Printf(\"\\nEnter a number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /*\
    \ Switch num % 2 */\n    switch {\n        /* 针对每种结果的各种 case */\n        /* 如果余数为零，则数字为偶数\
    \ */\n        case (num % 2) == 0:\n            fmt.Printf(\"\\n%d is even.\\\
    n\", num)\n        /* 如果余数为一，则数字为奇数 */\n        case (num % 2) == 1:\n       \
    \     fmt.Printf(\"\\n%d is odd.\\n\", num)\n    }\n}\n```\n\n**输出：**\n![](img/Image00049.jpg)\n\
    \n`switch-case` 构造可以使用任意基本数据类型的变量进行切换，不一定非要是数字。让我们编写一个程序要求用户输入月份名称并确定其序号：\n\n\
    ```go\n/* Switch Demo 3 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\n\
    import (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明一个变量存储月份名称\
    \ */\n    var month string\n\n    /* 提示用户输入月份名称并使用 scanf 读取 */\n    fmt.Printf(\"\
    \\nEnter month: \")\n    fmt.Scanf(\"%s\", &month)\n\n    /* Switch month */\n\
    \    switch month {\n        /* 每个月份的各种 case */\n        case \"January\", \"\
    january\":\n            fmt.Printf(\"\\nJanuary comes at No.1 in a year.\\n\"\
    )\n        case \"February\", \"february\":\n            fmt.Printf(\"\\nFebruary\
    \ comes at No.2 in a year.\\n\")\n        case \"March\", \"march\":\n       \
    \     fmt.Printf(\"\\nMarch comes at No.3 in a year.\\n\")\n        case \"April\"\
    , \"april\":\n            fmt.Printf(\"\\nApril comes at No.4 in a year.\\n\"\
    )\n        case \"May\", \"may\":\n            fmt.Printf(\"\\nMay comes at No.5\
    \ in a year.\\n\")\n        case \"June\", \"june\":\n            fmt.Printf(\"\
    \\nJune comes at No.6 in a year.\\n\")\n        case \"July\", \"july\":\n   \
    \         fmt.Printf(\"\\nJuly comes at No.7 in a year.\\n\")\n        case \"\
    August\", \"august\":\n            fmt.Printf(\"\\nAugust comes at No.8 in a year.\\\
    n\")\n        case \"September\", \"september\":\n            fmt.Printf(\"\\\
    nSeptember comes at No.9 in a year.\\n\")\n        case \"October\", \"october\"\
    :\n            fmt.Printf(\"\\nOctober comes at No.10 in a year.\\n\")\n     \
    \   case \"November\", \"november\":\n            fmt.Printf(\"\\nNovember comes\
    \ at No.11 in a year.\\n\")\n        case \"December\", \"december\":\n      \
    \      fmt.Printf(\"\\nDecember comes at No.12 in a year.\\n\")\n        /* 默认\
    \ case */\n        default:\n            fmt.Printf(\"\\n%s does not seem like\
    \ the name of a month!\\n\")\n    }\n}\n```\n\n**输出：**\n![](img/Image00050.jpg)\n\
    \n请参考该程序，注意每个 `case` 如何拥有两个常量表达式。当你需要为多个常量表达式执行同一段代码时，不必编写带有不同常量表达式的单独 `case`，而是可以只编写一个\
    \ `case` 语句，其中包含用逗号分隔的多个常量表达式。\n\n## 11.2 循环\n\n循环是一种编程构造，可以根据条件是否满足，反复运行一段代码。Go\
    \ 语言仅提供一种循环，称为 `for` 循环。\n\n### 11.2.1 for 循环\n\n`for` 循环的基本语法如下：\n\n```\nfor\
    \ <condition> {\n    /* 只要 <condition> 为 true 就执行的语句 */\n}\n```\n\n**示例：**\n\n\
    ```\nnum := 0\nfor num < 5 {\n    fmt.Printf(\"num = %d\", num)\n    num = num\
    \ + 1\n}\n```\n\n当执行控制遇到 `for` 循环时，会检查其条件。如果求值为 `true`，则执行循环块内的语句。这称为一次**循环迭代**。一旦到达循环块的末尾，执行控制将跳回\
    \ `for` 语句并再次检查条件。如果再次求值为 `true`，循环块将再次被执行。只要给定条件求值为 `true`，这种循环迭代就会持续发生。一旦求值为\
    \ `false`，执行控制将退出循环。如果条件永远不变为 `false`，循环将持续执行。这样的循环称为**无限循环**。\n\n下面是一个使用 `for`\
    \ 循环打印 0 到 9 的程序：\n\n```go\n/* For Demo 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句\
    \ - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\
    \    /* 初始化一个整数变量为 0 */\n    var count int = 0\n\n    /* 运行从 0 到 9 的 for 循环 */\n\
    \    for (count < 10) {\n        /* 打印 count */\n        fmt.Printf(\"count =\
    \ %d\\n\", count)\n        /* 增加 count */\n        count++\n    }\n}\n```\n\n\
    **输出：**\n![](img/Image00051.jpg)\n\n编写 `for` 循环的另一种方式是使用**循环变量**。以下是通用语法：\n\n\
    ```\nfor <loop variable initialization>; <condition>; <loop variable increment/decrement>\
    \ {\n    /* 只要 <condition> 为 true 就执行的语句 */\n}\n```\n\n使用这种语法，你可以在 `for` 语句本身中初始化循环变量。它还提供了一个增加/减少循环变量的选项。每次迭代结束时，将检查给定条件。如果求值为\
    \ `true`，循环变量将被增加/减少，然后循环块将作为下一次迭代被执行。如果循环变量之前未声明，也可以在 `for` 语句中短声明。\n\n使用这种语法，让我们编写一个程序打印\
    \ 5 的倍数。循环变量已在 `for` 语句中短声明：\n\n```go\n/* For Demo 2 */\n/* 包声明 */\npackage main\n\
    \n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc\
    \ main() {\n    fmt.Printf(\"\\nMultiples of 5\\n\\n\")\n\n    /* 运行从 1 到 10 的\
    \ for 循环 */\n    for count := 1; count <= 10; count++ {\n        /* 打印 count *\
    \ 5 */\n        fmt.Printf(\"%d\\n\", count * 5)\n    }\n}\n```\n\n**输出：**\n![](img/Image00052.jpg)\n\
    \n这是一个循环变量已预先声明的示例：\n\n```go\n/* For Demo 3 */\n/* 包声明 */\npackage main\n\n/*\
    \ 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n    /* 声明一个 int 变量 */\n    var count int\n\n    fmt.Printf(\"\\nMultiples\
    \ of 3\\n\\n\")\n\n    /* 运行从 1 到 20 的 for 循环 */\n    for count = 1; count <=\
    \ 20; count++ {\n        /* 打印 count * 3 */\n        fmt.Printf(\"%d\\n\", count\
    \ * 3)\n    }\n}\n```\n\n**输出：**\n![](img/Image00053.jpg)\n\n### 11.2.2 控制语句\n\
    \n只要给定条件为 `true`，循环就会持续执行。这是循环的正常执行过程。可以使用 `continue` 和 `break` 等控制语句来改变循环的这种执行流程。\n\
    \n#### 11.2.2.1 continue 语句\n\n当遇到 `continue` 语句时，执行控制将跳转到循环的开头，从而跳过 `continue`\
    \ 语句之后的所有语句。换句话说，循环将移至下一次迭代。\n\n让我们编写一个程序仅打印 1 到 30 之间的奇数：\n\n```go\n/* For Demo\
    \ -- continue */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n\
    \    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    fmt.Printf(\"\\nOdd\
    \ numbers between 1 and 30\\n\\n\")\n\n    /* 运行从 1 到 30 的 for 循环 */\n    for\
    \ count := 1; count <= 30; count++ {\n        if (count % 2 == 0) {\n        \
    \    continue\n        }\n        fmt.Printf(\"%d\\n\", count)\n    }\n}\n```\n\
    \n**输出：**\n![](img/Image00054.jpg)\n\n#### 11.2.2.2 break 语句\n\n当遇到 `break` 语句时，循环的执行将停止，控制将退出循环。\n\
    \n让我们通过一个编程示例来理解这个概念。我们将运行一个从 1 到 10 的循环，当 `count` 变为 7 时跳出循环：\n\n```go\n/* For\
    \ Demo -- break */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n\
    \    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 运行从 1 到 10 的 for\
    \ 循环 */\n    for count := 1; count <= 10; count++ {\n        if (count == 7) {\n\
    \            break\n        }\n        fmt.Printf(\"count = %d\\n\", count)\n\
    \    }\n}\n```\n\n**输出：**\n![](img/Image00055.jpg)\n\n通过以下程序可以理解 `break` 语句更实用的用法，我们要求用户输入一个数字并判断它是质数还是合数：\n\
    \n```go\n/* Prime or composite - using break */\n/* 包声明 */\npackage main\n\n/*\
    \ 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n    /* 声明变量存储用户输入并作为循环计数器 */\n    var i, num int\n\n    /* 提示用户输入数字并使用 Scanf\
    \ 读取 */\n    fmt.Printf(\"\\nEnter a number: \")\n    fmt.Scanf(\"%d\", &num)\n\
    \n    /* 从 2 运行循环到 num，因为每个数字都能被 1 整除 */\n    for i = 2; i <= num; i++ {\n   \
    \     if (num % i == 0) {\n            break\n        }\n    }\n\n    if (num\
    \ != i) {\n        fmt.Printf(\"\\n%d is a composite number.\\n\", num)\n    }\
    \ else {\n        fmt.Printf(\"\\n%d is a prime number.\\n\", num)\n    }\n}\n\
    ```\n\n**输出：**\n![](img/Image00056.jpg)\n\n让我们编写更多程序以更好地理解循环。以下程序计算给定数字的阶乘。数字\
    \ `n` 的阶乘表示为 `n! = n x (n -1) x (n - 2) x ... x 1`。负数的阶乘无法计算，零的阶乘是 1。\n\n```go\n\
    /* Factorial */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n\
    \    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明变量存储用户输入、循环计数器和阶乘\
    \ */\n    var i, num int\n    var f int = 1\n\n    /* 提示用户输入数字并使用 Scanf 读取 */\n\
    \    fmt.Printf(\"\\nEnter a number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /*\
    \ 从 num 运行循环到 1 */\n    for i = num; i > 0; i-- {\n        f = f * i\n    }\n\n\
    \    if (num >= 0) {\n        fmt.Printf(\"\\nFactorial of %d is %d\\n\", num,\
    \ f)\n    } else {\n        fmt.Printf(\"\\nFactorial of a negative number cannot\
    \ be calculated\\n\")\n    }\n}\n```\n\n**输出：**\n![](img/Image00057.jpg)\n\n让我们使用循环编写另一个程序，计算前\
    \ `n` 个偶数的和。\n\n```go\n/* Sum of n even numbers */\n/* 包声明 */\npackage main\n\n\
    /* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n    /* 声明变量存储 n、循环计数器和和 */\n    var i, n int\n    var even_num, sum int =\
    \ 1, 0\n\n    /* 提示用户输入数字并使用 Scanf 读取 */\n    fmt.Printf(\"\\nEnter n: \")\n \
    \   fmt.Scanf(\"%d\", &n)\n\n    fmt.Printf(\"\\nFirst %d even numbers: \\n\\\
    n\", n)\n\n    for i = 1; even_num <= n; i++ {\n        if (i % 2 == 0) {\n  \
    \          fmt.Printf(\"%d \", i)\n            sum += i\n            even_num++\n\
    \        }\n    }\n\n    fmt.Printf(\"\\n\\nSum of above even numbers: %d\\n\"\
    , sum)\n}\n```\n\n**输出：**\n![](img/Image00058.jpg)\n\n"
