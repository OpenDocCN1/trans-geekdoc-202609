    \== 0 ) { ​ ​ fmt . Printf ( "\\nBoth strings are the same.\\n" ) ​ } else if
    ( result > 0 ) { ​ ​ fmt . Printf ( "\\nFirst string is lexicographically greater
    than the second string.\\n" ) ​ } else { ​ ​ fmt . Printf ( "\\nSecond string
    is lexicographically greater than the first string.\\n" ) ​ } } Output: ![](Image00073.jpg)14.3
    Search for a string inside another string The Contains function from the strings
    package is used to check if a string is present in another string. This function
    returns boolean true if the string is present and returns false if absent. Syntax:
    strings.Compare(<main string>, <string to be searched>) Example: result := (“Hello
    World”, “World”) Further, you can use IndexOf function from the strings package
    to determine the first occurrence of the given string in the main string. This
    function function return \-1 if the string is not present in the main string.
    Here is a program that reads two strings from the user and searches for the second
    string in the main string: /\*Search for a string within another string\*/ /\*Package
    Declaration\*/ package main /\*Import Statement - import fmt, bufio, os, strings
    package\*/ import ( ​ ​ "fmt" ​ ​ "bufio" ​ ​ "os" ​ ​ "strings" ​ ​  ) /\*Mandatory
    main function\*/ func main () { ​ /\*Create an input reader variable of type NewReader
    using stdin\*/ ​ inputReader := bufio . NewReader ( os . Stdin ) ​ /\*Prompt the
    user to enter something\*/ ​ fmt . Printf ( "\\nEnter the main string: " ) ​ /\*Read
    string using ReadString function\*/ main\_str , \_ := inputReader . ReadString
    ( ''\\n'' ) ​ fmt . Printf ( "\\nEnter the string to be searched inside the main
    string: " ) ​ /\*Read string using ReadString function\*/ str , \_ := inputReader
    . ReadString ( ''\\n'' ) ​ /\*Use trim function to remove all \\n and \\r characters\*/
    ​ str \= strings . Trim ( str , "\\n\\r" ) ​ result := strings . Contains ( main\_str
    , str ) ​ if ( result \== true ) { ​ ​ fmt . Printf ( "\\nThe given string is
    present in the main string." ) ​ ​ /\*Find the first occurrence\*/ ​ ​ first :=
    strings . Index ( main\_str , str ) ​ ​ /\*Print first index\*/ ​ ​ fmt . Printf
    ( "\\n\\nFirst Occurrence: %d\\n" , first ) ​ } else { ​ ​ fmt . Printf ( "\\nThe
    given string is not present in the main string.\\n" ) ​ } } Output: ![](Image00074.jpg)14.4
    Trimming a string There may arise a need to remove unwanted character from a string.
    You can use the Trim  function from the strings package as follows: <trimmed\_string>
    = strings.Trim(<string>, <character set to be trimmed>) When reading strings from
    the user, there is a high chance that \\n or \\r or both get appended to the string.
    You can use the Trim function to remove these characters: new\_str = strings.Trim(str,
    “\\n\\r”) In fact, let us see what happens when we read a string from the user
    – we will convert the string to character array to take a look at each character:
    /\*Pre-trim demo\*/ /\*Package Declaration\*/ package main /\*Import Statement
    - import fmt, bufio, os, strings package\*/ import ( ​ ​ "fmt" ​ ​ "bufio" ​ ​
    "os" ​ ​ ) /\*Mandatory main function\*/ func main () { ​ /\*Create an input reader
    variable of type NewReader using stdin\*/ ​ inputReader := bufio . NewReader (
    os . Stdin ) ​ /\*Prompt the user to enter something\*/ ​ fmt . Printf ( "\\nEnter
