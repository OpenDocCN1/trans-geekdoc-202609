  fmt: "\n# 10. User Interaction\n\nUp to this point, we have seen several programming\
    \ examples. All those programs had hard-coded values. None of the programs gave\
    \ the user an opportunity to enter values manually. In this section, we will learn\
    \ how to accept input from the user. There are many ways to interact with the\
    \ user. We will learn about two simple functions from the `fmt` package used for\
    \ reading input from the user – `Scanln` and `Scanf`.\n\n## 10.1 Scanln Function\n\
    \nHere is how to use the `Scanln` function:\n\n```go\nfmt.Scanln(&<string variable>)\n\
    ```\n\n**Example:**\n\n```go\nvar str string\nfmt.Scanln(&str)\n```\n\nThe `Scanln`\
    \ function requires a string variable to be specified to store the user’s input\
    \ (marked by `<string variable>` in the above code snippet). This function implements\
    \ a **blocking I/O operation**. That is, when the execution control reaches a\
    \ `Scanln` statement, the execution of the program will halt to give the user\
    \ an opportunity to enter something through the keyboard (and press Enter). Once\
    \ the user enters something and hits Enter, whatever the user has entered through\
    \ the keyboard will be fetched and stored in the specified string variable. The\
    \ ampersand sign (`&`) before the variable is used to fetch the memory address\
    \ of the variable so that the `Scanln` function can directly set the contents\
    \ of the specified variable. This concept will be clearer in the Pointers chapters.\n\
    \nLet us write a simple Go program to prompt the user to enter something and display\
    \ it back:\n\n```go\n/* User Interaction Demo 1 */\n/* Package Declaration */\n\
    package main\n\n/* Import Statement - import fmt package */\nimport (\n\t\"fmt\"\
    \n)\n\n/* Mandatory main function */\nfunc main() {\n\t/* Create a variable to\
    \ store input */\n\tvar str string\n\n\t/* Prompt the user to enter something\
    \ */\n\tfmt.Printf(\"\\nEnter something: \")\n\n\t/* Read user input using Scanln\
    \ function */\n\tfmt.Scanln(&str)\n\n\t/* Display whatever has been read */\n\t\
    fmt.Printf(\"\\nYou have entered: %s \\n\", str)\n}\n```\n\n**Output:**\n![](Image00033.jpg)\n\
    \nThe `Scanln` function has its own limitations. To start with, it can only read\
    \ the input in a string format. That means, even if you enter a number, it will\
    \ be treated as a string. Second, it reads input as a space-separated tokenized\
    \ string. That is, if you enter a sentence, each word will be treated as a token\
    \ and those many variables will be needed to store the input. If you specify only\
    \ one variable and enter a sentence, only the first word will be read.\n\nLet\
    \ us run the same program and try to enter a sentence:\n![](Image00034.jpg)\n\n\
    As seen, only the first word is read. The above input had four words and hence\
    \ the `Scanln` statement should have had 4 variables specified to store those\
    \ 4 words as follows:\n\n```go\nfmt.Scanln(&str1, &str2, &str3, &str4)\n```\n\n\
    Similarly, the `Printf` statement should look like:\n\n```go\nfmt.Printf(\"\\\
    nYou have entered: %s %s %s %s\\n \", str1, str2, str3, str4)\n```\n\nHere is\
    \ the full program:\n\n```go\n/* User Interaction Demo 2 */\n/* Package Declaration\
    \ */\npackage main\n\n/* Import Statement - import fmt package */\nimport (\n\t\
    \"fmt\"\n)\n\n/* Mandatory main function */\nfunc main() {\n\t/* Create variables\
    \ to store input */\n\tvar str1, str2, str3, str4 string\n\n\t/* Prompt the user\
    \ to enter something */\n\tfmt.Printf(\"\\nEnter something: \")\n\n\t/* Read user\
    \ input using Scanln function */\n\tfmt.Scanln(&str1, &str2, &str3, &str4)\n\n\
    \t/* Display whatever has been read */\n\tfmt.Printf(\"\\nYou have entered: %s\
    \ %s %s %s\\n \", str1, str2, str3, str4)\n}\n```\n\n**Output:**\n![](Image00035.jpg)\n\
    \nAlthough the program works correctly now, this is not the best way to read a\
    \ sentence as we do not know how big a sentence a user will enter. One variable\
    \ will be required to store one word. This is not at all practical. There is a\
    \ better way to read sentences using the `bufio` package discussed later in this\
    \ chapter. We will use the `Scanln` function only when we want to read one word\
    \ or one number at a time.\n\nIf the user enters a number and you try to read\
    \ it using `Scanln`, it will be in the string format. In order to convert a number\
    \ in string format to the appropriate numeric format, we will use functions from\
    \ the `strconv` package. The first thing you will have to do is import this package\
    \ in your program and use the following conversion functions:\n\n**Convert a number\
    \ in string format to integer:**\n\n```go\n<number variable>, <error variable>\
    \ = strconv.Atoi(<number in string format>)\n```\n\n**Example:**\n\n```go\nnum,\
    \ err := strconv.Atoi(\"55\")\n```\n\nIn the above example, `\"55\"` in string\
    \ format will be converted to `55` in integer format and stored in the variable\
    \ `num` which is short declared here. Along with that, `err` has also been short\
    \ declared which will be used to store conversion error if any.\n\n**Convert a\
    \ number in string format to float:**\n\n```go\n<variable> = strconv.ParseFloat(<number\
    \ in string format>, <number of bits>)\n```\n\n**Example:**\n\n```go\nnumS :=\
    \ \"-46.2343\"\nnumF, err := strconv.ParseFloat(numS, 64)\n```\n\nIn the above\
    \ example, the `ParseFloat` function will convert `\"-46.2343\"` in string format\
    \ to `-46.2343` in 64-bit float format and return it to the `numF` variable where\
    \ it will be stored.\n\nLet us write a Go program to accept 4 numbers from the\
    \ user – two integers and two floats. We will use `Scanln` function to read these\
    \ inputs and hence all 4 numbers will be stored in string format. We will convert\
    \ these numbers to the appropriate formats and perform addition, subtraction,\
    \ multiplication and division:\n\n```go\n/* User Interaction Demo 3 - Work with\
    \ numbers */\n/* Package Declaration */\npackage main\n\n/* Import Statement -\
    \ import fmt and strconv package */\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\n\
    /* Mandatory main function */\nfunc main() {\n\t/* Declare variables to store\
    \ input */\n\tvar num1_str, num2_str, num3_str, num4_str string\n\n\t/* Declare\
    \ variables to store int and float64 equivalents */\n\tvar num1, num2, sum, diff\
    \ int\n\tvar num3, num4, prod, quo float64\n\n\t/* Prompt the user to enter two\
    \ integers */\n\tfmt.Printf(\"\\nEnter two integers: \")\n\n\t/* Read user input\
    \ using Scanln function */\n\tfmt.Scanln(&num1_str, &num2_str)\n\n\t/* Prompt\
    \ the user to enter two floats */\n\tfmt.Printf(\"\\nEnter two floats: \")\n\n\
    \t/* Read user input using Scanln function */\n\tfmt.Scanln(&num3_str, &num4_str)\n\
    \n\t/* Convert num1_str and num2_str to integer */\n\tnum1, err1 := strconv.Atoi(num1_str)\n\
    \tnum2, err2 := strconv.Atoi(num2_str)\n\n\t/* Convert num3_str and num4_str to\
    \ float64 */\n\tnum3, err3 := strconv.ParseFloat(num3_str, 64)\n\tnum4, err4 :=\
    \ strconv.ParseFloat(num4_str, 64)\n\n\t/* Assign err to blank identifiers */\n\
    \t_ = err1\n\t_ = err2\n\t_ = err3\n\t_ = err4\n\n\t/* Perform arithmetic operations\
    \ */\n\tsum = num1 + num2\n\tdiff = num1 - num2\n\tprod = num3 * num4\n\tquo =\
    \ num3 / num4\n\n\t/* Print everything */\n\tfmt.Printf(\"\\nnum1 + num2 = %d\"\
    , sum)\n\tfmt.Printf(\"\\nnum1 - num2 = %d\", diff)\n\tfmt.Printf(\"\\nnum3 *\
    \ num4 = %f\", prod)\n\tfmt.Printf(\"\\nnum3 / num4 = %f \\n\", quo)\n}\n```\n\
    \n**Note:** We have used 4 different error variables – `err1`, `err2`, `err3`\
    \ and `err4` for 4 different conversions. There is no need to use them. However,\
    \ if you do not use them, the compiler will return a “declared but not used” error\
    \ and the program will not build. To circumvent this problem, each of these error\
    \ variables can be assigned to the blank identifier `_`.\n\n**Output:**\n![](Image00036.jpg)\n\
    \n## 10.2 Scanf Function\n\nThe `Scanf` function is quite similar to the one used\
    \ in C language. This function uses verbs (analogous to format specifiers in C)\
    \ to read data of particular types. For example, if you want to read an integer\
    \ from the user, you can use the verb `%d`. This eliminates the extra step of\
    \ data conversion used in `Scanln`. The same verbs discussed in Chapter 8 will\
    \ be used.\n\nHere is the general syntax:\n\n```go\nfmt.Scanf(\"<formatted string\
    \ with verbs>\", &<variables separated by comma>)\nfmt.Scanf(\"%<verb 1> %<verb\
    \ 2>, ...\", &<var 1>, &<var 2>, ...)\n```\n\n**Example:**\n\n```go\nfmt.Scanf(\"\
    %s %d %f\", &name, &age, &weight)\n```\n\nThe `Scanf` function uses a formatted\
    \ string made up of verbs to parse user’s input. For every verb used, there is\
    \ a corresponding variable (where variable name is prefixed with an ampersand\
    \ sign). This function also implements **blocking I/O operation**. When the user\
    \ enters something through the keyboard, it will be parsed according to the format\
    \ specified in the formatted string.\n\nFor example, if the formatted string looks\
    \ like this – `\"%s %d %f\"`, the user is supposed to enter three values separated\
    \ by a space where the first value is a string, the second value is an integer\
    \ and the third value is a float. Enter is supposed to be pressed only when all\
    \ the values are entered. If the user presses enter after entering the first value,\
    \ the remaining two inputs will be skipped and the corresponding variables will\
    \ get zero-values.\n\nLet us take another example of a formatted string. If the\
    \ formatted string looks like this – `\"%d\\n%f\\n%d\\n%s\"`, the function will\
    \ expect 4 inputs from the user. The `\"\\n\"` character sequence between the\
    \ verbs indicates that the user is supposed to press enter after entering each\
    \ input. If this is getting confusing, you can always use one `Scanf` statement\
    \ for one input.\n\nLet us write a program to read 3 inputs from a user and print\
    \ whatever the user has entered back:\n\n```go\n/* Scanf Demo */\n/* Package Declaration\
    \ */\npackage main\n\n/* Import Statement - import fmt package */\nimport (\n\t\
    \"fmt\"\n)\n\n/* Mandatory main function */\nfunc main() {\n\t/* Declare Variables\
    \ */\n\tvar name string\n\tvar age int\n\tvar weight float32\n\n\t/* Prompt the\
    \ user to enter 3 values */\n\tfmt.Printf(\"\\nEnter name, age and weight: \"\
    )\n\n\t/* Read 3 values */\n\tfmt.Scanf(\"%s %d %f\", &name, &age, &weight)\n\n\
    \t/* Display everything */\n\tfmt.Printf(\"\\n\\nName: %s, Age: %d, Weight: %f\
    \ \\n\", name, age, weight)\n}\n```\n\n**Output:**\n![](Image00037.jpg)\n\nIn\
    \ the above example, `\"Liev\"` is read as string, `18` is read as int and `152`\
    \ is read as float32. This is how the assignment of input to variables happens:\n\
    ![](Image00038.jpg)\n\nAs mentioned earlier, the input is read according to the\
    \ data type specified by verbs, no need arises to convert input from one form\
    \ to another. Let us cross check this by writing a program to add two numbers.\
    \ This time, we will insert `\\n` between two verbs and hence, the user will have\
    \ to hit enter after entering each number:\n\n```go\n/* Scanf Add Two Numbers\
    \ Demo */\n/* Package Declaration */\npackage main\n\n/* Import Statement - import\
    \ fmt package */\nimport (\n\t\"fmt\"\n)\n\n/* Mandatory main function */\nfunc\
    \ main() {\n\t/* Declare Variables */\n\tvar num1, num2, sum int\n\n\t/* Prompt\
    \ the user to enter 2 numbers */\n\tfmt.Printf(\"\\nEnter two numbers: \")\n\n\
    \t/* Read 2 numbers */\n\tfmt.Scanf(\"%d\\n%d\", &num1, &num2)\n\n\t/* Calculate\
    \ sum */\n\tsum = num1 + num2\n\n\t/* Display everything */\n\tfmt.Printf(\"\\\
    nSum = %d\\n\", sum)\n}\n```\n\n**Output:**\n![](Image00039.jpg)\n\n## 10.3 Reading\
    \ Sentences\n\nBoth `Scanf` and `Scanln` functions are not capable of reading\
    \ sentences, i.e. strings containing words. There is a function called `ReadString`\
    \ in the `bufio` package. Hence, `bufio` package needs to be included if you intend\
    \ to use `ReadString` function. Alongside `bufio`, `os` should be imported as\
    \ we need access to `os.Stdin` (standard input/output). Do not worry about the\
    \ technicalities, this is an advanced topic. All you have to do is remember a\
    \ few lines of code if you want to read a sentence.\n\nHere is the general syntax:\n\
    \n```go\n<Reader variable> := bufio.NewReader(os.Stdin)\n<string variable>, _\
    \ := <Reader variable>.ReadString('\\n')\n```\n\n**Example:**\n\n```go\nr := bufio.NewReader(os.Stdin)\n\
    msg, _ := r.ReadString('\\n')\n```\n\nHere is a program that prompts the user\
    \ to enter something and reads a full sentence:\n\n```go\n/* Read Sentence */\n\
    /* Package Declaration */\npackage main\n\n/* Import Statement - import fmt, bufio,\
    \ os package */\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n)\n\n/* Mandatory\
    \ main function */\nfunc main() {\n\t/* Create an input reader variable of type\
    \ NewReader using stdin */\n\tinputReader := bufio.NewReader(os.Stdin)\n\n\t/*\
    \ Prompt the user to enter something */\n\tfmt.Printf(\"\\nEnter a sentence: \"\
    )\n\n\t/* Read using ReadString function */\n\ttext, _ := inputReader.ReadString('\\\
    n')\n\n\t/* Print whats been read */\n\tfmt.Printf(\"\\nYou have entered: \\n%s\"\
    , text)\n}\n```\n\n**Output:**\n![](Image00040.jpg)\n"
  trans: "\n\n# 10. 用户交互\n\n到目前为止，我们已经看了几个编程示例。所有这些程序都使用了硬编码的值。没有任何程序给用户提供手动输入值的机会。在本节中，我们将学习如何接受用户的输入。与用户交互的方式有很多。我们将学习\
    \ `fmt` 包中用于读取用户输入的两个简单函数——`Scanln` 和 `Scanf`。\n\n## 10.1 Scanln 函数\n\n以下是使用 `Scanln`\
    \ 函数的方法：\n\n```go\nfmt.Scanln(&<字符串变量>)\n```\n\n**示例：**\n\n```go\nvar str string\n\
    fmt.Scanln(&str)\n```\n\n`Scanln` 函数需要指定一个字符串变量来存储用户的输入（在上述代码片段中用 `<字符串变量>` 标记）。该函数实现了**阻塞\
    \ I/O 操作**。也就是说，当执行控制到达 `Scanln` 语句时，程序的执行将暂停，给用户一个通过键盘输入内容（并按回车键）的机会。一旦用户输入内容并按下回车，用户通过键盘输入的任何内容都将被获取并存储在指定的字符串变量中。变量前的\
    \ `&` 符号用于获取变量的内存地址，以便 `Scanln` 函数可以直接设置指定变量的内容。这一概念将在指针章节中更清晰地说明。\n\n让我们编写一个简单的\
    \ Go 程序，提示用户输入内容并将其显示回来：\n\n```go\n/* 用户交互演示 1 */\n/* 包声明 */\npackage main\n\n\
    /* 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n\t/* 创建一个变量来存储输入 */\n\tvar str string\n\n\t/* 提示用户输入内容 */\n\tfmt.Printf(\"\
    \\n 请输入内容: \")\n\n\t/* 使用 Scanln 函数读取用户输入 */\n\tfmt.Scanln(&str)\n\n\t/* 显示读取的内容\
    \ */\n\tfmt.Printf(\"\\n 您输入了: %s \\n\", str)\n}\n```\n\n**输出：**\n![](img/Image00033.jpg)\n\
    \n`Scanln` 函数有其自身的局限性。首先，它只能以字符串格式读取输入。这意味着，即使您输入一个数字，它也会被视为字符串。其次，它将输入作为以空格分隔的标记化字符串读取。也就是说，如果您输入一个句子，每个单词将被视为一个标记，并且需要相应数量的变量来存储输入。如果您只指定一个变量却输入一个句子，则只会读取第一个单词。\n\
    \n让我们运行相同的程序并尝试输入一个句子：\n![](img/Image00034.jpg)\n\n如所见，只读取了第一个单词。上面的输入有四个单词，因此\
    \ `Scanln` 语句应该指定 4 个变量来存储这 4 个单词，如下所示：\n\n```go\nfmt.Scanln(&str1, &str2, &str3,\
    \ &str4)\n```\n\n同样，`Printf` 语句应如下所示：\n\n```go\nfmt.Printf(\"\\n 您输入了: %s %s %s\
    \ %s\\n \", str1, str2, str3, str4)\n```\n\n这是完整的程序：\n\n```go\n/* 用户交互演示 2 */\n\
    /* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/*\
    \ 强制性的 main 函数 */\nfunc main() {\n\t/* 创建变量来存储输入 */\n\tvar str1, str2, str3, str4\
    \ string\n\n\t/* 提示用户输入内容 */\n\tfmt.Printf(\"\\n 请输入内容: \")\n\n\t/* 使用 Scanln\
    \ 函数读取用户输入 */\n\tfmt.Scanln(&str1, &str2, &str3, &str4)\n\n\t/* 显示读取的内容 */\n\t\
    fmt.Printf(\"\\n 您输入了: %s %s %s %s\\n \", str1, str2, str3, str4)\n}\n```\n\n\
    **输出：**\n![](img/Image00035.jpg)\n\n虽然程序现在可以正确运行，但这不是读取句子的最佳方式，因为我们不知道用户会输入多长的句子。存储一个单词需要一个变量。这完全不切实际。稍后在本章中讨论的\
    \ `bufio` 包提供了一种读取句子的更好方法。我们将仅在想要一次读取一个单词或一个数字时使用 `Scanln` 函数。\n\n如果用户输入一个数字，而您尝试使用\
    \ `Scanln` 读取它，它将以字符串格式存在。为了将字符串格式的数字转换为适当的数值格式，我们将使用 `strconv` 包中的函数。您要做的第一件事是在程序中导入此包并使用以下转换函数：\n\
    \n**将字符串格式的数字转换为整数：**\n\n```go\n<数字变量>, <错误变量> = strconv.Atoi(<字符串格式的数字>)\n```\n\
    \n**示例：**\n\n```go\nnum, err := strconv.Atoi(\"55\")\n```\n\n在上面的示例中，字符串格式的 `\"\
    55\"` 将被转换为整数格式的 `55` 并存储在变量 `num` 中（此处使用短变量声明）。同时，`err` 也被短声明，用于存储可能发生的转换错误。\n\
    \n**将字符串格式的数字转换为浮点数：**\n\n```go\n<变量> = strconv.ParseFloat(<字符串格式的数字>, <位数>)\n\
    ```\n\n**示例：**\n\n```go\nnumS := \"-46.2343\"\nnumF, err := strconv.ParseFloat(numS,\
    \ 64)\n```\n\n在上面的示例中，`ParseFloat` 函数将字符串格式的 `\"-46.2343\"` 转换为 64 位浮点格式的 `-46.2343`\
    \ 并返回给 `numF` 变量存储。\n\n让我们编写一个 Go 程序，从用户那里接受 4 个数字——两个整数和两个浮点数。我们将使用 `Scanln`\
    \ 函数读取这些输入，因此所有 4 个数字都将以字符串格式存储。我们将把这些数字转换为适当的格式并执行加、减、乘、除运算：\n\n```go\n/* 用户交互演示\
    \ 3 - 处理数字 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 和 strconv 包 */\nimport\
    \ (\n\t\"fmt\"\n\t\"strconv\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\t/* 声明变量来存储输入\
    \ */\n\tvar num1_str, num2_str, num3_str, num4_str string\n\n\t/* 声明变量来存储 int\
    \ 和 float64 等价值 */\n\tvar num1, num2, sum, diff int\n\tvar num3, num4, prod, quo\
    \ float64\n\n\t/* 提示用户输入两个整数 */\n\tfmt.Printf(\"\\n 请输入两个整数: \")\n\n\t/* 使用 Scanln\
    \ 函数读取用户输入 */\n\tfmt.Scanln(&num1_str, &num2_str)\n\n\t/* 提示用户输入两个浮点数 */\n\tfmt.Printf(\"\
    \\n 请输入两个浮点数: \")\n\n\t/* 使用 Scanln 函数读取用户输入 */\n\tfmt.Scanln(&num3_str, &num4_str)\n\
    \n\t/* 将 num1_str 和 num2_str 转换为整数 */\n\tnum1, err1 := strconv.Atoi(num1_str)\n\
    \tnum2, err2 := strconv.Atoi(num2_str)\n\n\t/* 将 num3_str 和 num4_str 转换为 float64\
    \ */\n\tnum3, err3 := strconv.ParseFloat(num3_str, 64)\n\tnum4, err4 := strconv.ParseFloat(num4_str,\
    \ 64)\n\n\t/* 将错误赋值给空标识符 */\n\t_ = err1\n\t_ = err2\n\t_ = err3\n\t_ = err4\n\n\
    \t/* 执行算术运算 */\n\tsum = num1 + num2\n\tdiff = num1 - num2\n\tprod = num3 * num4\n\
    \tquo = num3 / num4\n\n\t/* 打印所有内容 */\n\tfmt.Printf(\"\\nnum1 + num2 = %d\", sum)\n\
    \tfmt.Printf(\"\\nnum1 - num2 = %d\", diff)\n\tfmt.Printf(\"\\nnum3 * num4 = %f\"\
    , prod)\n\tfmt.Printf(\"\\nnum3 / num4 = %f \\n\", quo)\n}\n```\n\n**注意：** 我们为\
    \ 4 次不同的转换使用了 4 个不同的错误变量——`err1`、`err2`、`err3` 和 `err4`。实际上没有必要使用它们。但是，如果您不使用它们，编译器将返回“声明但未使用”错误，程序将无法构建。为了规避这个问题，可以将每个错误变量赋值给空标识符\
    \ `_`。\n\n**输出：**\n![](img/Image00036.jpg)\n\n## 10.2 Scanf 函数\n\n`Scanf` 函数与\
    \ C 语言中使用的函数非常相似。该函数使用动词（类似于 C 语言中的格式说明符）来读取特定类型的数据。例如，如果您想从用户那里读取一个整数，可以使用动词\
    \ `%d`。这消除了 `Scanln` 中使用的数据转换的额外步骤。第 8 章讨论的相同动词将被使用。\n\n以下是通用语法：\n\n```go\nfmt.Scanf(\"\
    <带有动词的格式化字符串>\", &<用逗号分隔的变量>)\nfmt.Scanf(\"%<动词 1> %<动词 2>, ...\", &<变量 1>, &<变量\
    \ 2>, ...)\n```\n\n**示例：**\n\n```go\nfmt.Scanf(\"%s %d %f\", &name, &age, &weight)\n\
    ```\n\n`Scanf` 函数使用由动词组成的格式化字符串来解析用户的输入。对于使用的每个动词，都有一个对应的变量（变量名前缀为 `&` 符号）。该函数也实现了**阻塞\
    \ I/O 操作**。当用户通过键盘输入内容时，它将根据格式化字符串中指定的格式进行解析。\n\n例如，如果格式化字符串如下——`\"%s %d %f\"\
    `，用户应该输入三个用空格分隔的值，其中第一个值是字符串，第二个值是整数，第三个值是浮点数。只有在输入所有值后才应按回车键。如果用户在输入第一个值后按下回车，则将跳过剩余的两个输入，相应的变量将获得零值。\n\
    \n让我们再举一个格式化字符串的例子。如果格式化字符串如下——`\"%d\\n%f\\n%d\\n%s\"`，该函数将期望用户输入 4 个值。动词之间的 `\"\
    \\n\"` 字符序列表示用户应该在输入每个值后按回车键。如果这让您感到困惑，您可以始终为每个输入使用一条 `Scanf` 语句。\n\n让我们编写一个程序，从用户那里读取\
    \ 3 个输入并将用户输入的内容打印回来：\n\n```go\n/* Scanf 演示 */\n/* 包声明 */\npackage main\n\n/*\
    \ 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n\t/* 声明变量 */\n\tvar name string\n\tvar age int\n\tvar weight float32\n\n\t\
    /* 提示用户输入 3 个值 */\n\tfmt.Printf(\"\\n 请输入姓名、年龄和体重: \")\n\n\t/* 读取 3 个值 */\n\t\
    fmt.Scanf(\"%s %d %f\", &name, &age, &weight)\n\n\t/* 显示所有内容 */\n\tfmt.Printf(\"\
    \\n\\n 姓名: %s, 年龄: %d, 体重: %f \\n\", name, age, weight)\n}\n```\n\n**输出：**\n![](img/Image00037.jpg)\n\
    \n在上面的示例中，`\"Liev\"` 被读作字符串，`18` 被读作 int，`152` 被读作 float32。输入分配给变量的过程如下：\n![](img/Image00038.jpg)\n\
    \n如前所述，输入是根据动词指定的数据类型读取的，因此不需要将输入从一种形式转换为另一种形式。让我们通过编写一个程序来添加两个数字来验证这一点。这次，我们将在两个动词之间插入\
    \ `\\n`，因此用户在输入每个数字后必须按回车键：\n\n```go\n/* Scanf 两数相加演示 */\n/* 包声明 */\npackage main\n\
    \n/* 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
    \ {\n\t/* 声明变量 */\n\tvar num1, num2, sum int\n\n\t/* 提示用户输入 2 个数字 */\n\tfmt.Printf(\"\
    \\n 请输入两个数字: \")\n\n\t/* 读取 2 个数字 */\n\tfmt.Scanf(\"%d\\n%d\", &num1, &num2)\n\
    \n\t/* 计算总和 */\n\tsum = num1 + num2\n\n\t/* 显示所有内容 */\n\tfmt.Printf(\"\\n 总和 =\
    \ %d\\n\", sum)\n}\n```\n\n**输出：**\n![](img/Image00039.jpg)\n\n## 10.3 读取句子\n\n\
    `Scanf` 和 `Scanln` 函数都无法读取句子，即包含单词的字符串。`bufio` 包中有一个名为 `ReadString` 的函数。因此，如果您打算使用\
    \ `ReadString` 函数，需要导入 `bufio` 包。除了 `bufio`，还应导入 `os`，因为我们需要访问 `os.Stdin`（标准输入/输出）。不用担心技术细节，这是一个高级主题。如果您想读取一个句子，只需记住几行代码即可。\n\
    \n以下是通用语法：\n\n```go\n<读取器变量> := bufio.NewReader(os.Stdin)\n<字符串变量>, _ := <读取器变量>.ReadString('\\\
    n')\n```\n\n**示例：**\n\n```go\nr := bufio.NewReader(os.Stdin)\nmsg, _ := r.ReadString('\\\
    n')\n```\n\n这是一个提示用户输入内容并读取完整句子的程序：\n\n```go\n/* 读取句子 */\n/* 包声明 */\npackage main\n\
    \n/* 导入语句 - 导入 fmt、bufio、os 包 */\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\
    )\n\n/* 强制性的 main 函数 */\nfunc main() {\n\t/* 使用 stdin 创建一个 NewReader 类型的输入读取器变量\
    \ */\n\tinputReader := bufio.NewReader(os.Stdin)\n\n\t/* 提示用户输入内容 */\n\tfmt.Printf(\"\
    \\n 请输入一个句子: \")\n\n\t/* 使用 ReadString 函数读取 */\n\ttext, _ := inputReader.ReadString('\\\
    n')\n\n\t/* 打印读取的内容 */\n\tfmt.Printf(\"\\n 您输入了: \\n%s\", text)\n}\n```\n\n**输出：**\n\
    ![](img/Image00040.jpg)\n\n"
