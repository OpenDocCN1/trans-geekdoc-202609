    }\n```\n\nOutput:\n![](Image00070.jpg)\n\nIndividual characters of a string can\
    \ be fetched into a character array using the rune functions as follows:\n\n```go\n\
    <character array var> = []rune(<String>)\n```\n\nExample:\n```go\nc_arr = []rune(str)\n\
    ```\n\nAn array of characters can be converted to a string using the `string`\
    \ function as follows:\n\n```go\n<string> = string(<character array variable>)\n\
    ```\n\nExample:\n```go\nstr = string(char_array)\n```\n\nHere is a program that\
    \ demonstrates the working of this function:\n\n```go\n/*Rune demo*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\tstr := \"Excelsior\"\
    \n\n\tstr_length := len(str)\n\n\t/*Use rune to fetch characters in an array*/\n\
    \tstr_char := []rune(str)\n\n\tfmt.Printf(\"\\nstr: %s, length: %d\", str, str_length)\n\
    \n\tfmt.Printf(\"\\n\\nCharacter array: %c\\n\", str_char)\n\n\tfmt.Printf(\"\\\
    nstr_char character array elements: \\n\")\n\n\tfor i := 0; i < str_length; i++\
    \ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\", i, str_char[i])\n\t\
    }\n}\n```\n\nOutput:\n![](Image00071.jpg)\n\nThere is a package called `strings`\
    \ which has many built-in functions that help in string manipulations. Let us\
    \ take a look at a few important ones:\n\n## 14.1 Concatenating strings\n\nTwo\
    \ or more strings can be concatenated using the `strings.Join` function. In order\
    \ to do so, the strings to be concatenated should be placed inside a string array.\
    \ Here is the general syntax:\n\n```go\nstrings.Join(<string array>, <separator>)\n\
    ```\n\nExample:\n```go\nbig_string := strings.Join(arr, \" \")\n```\n\nThere is\
    \ an even simpler way of concatenating two or more strings – using the `+` operator.\
    \ General syntax:\n\n```go\n<concatenated string variable> = <string 1> + <string\
    \ 2> + ... <string n>\n```\n\nExample:\n```go\nbig_str := \"hello\" + \" \" +\
    \ \"world!\"\n```\n\nLet us write a program that demonstrates both these concatenation\
    \ methods:\n\n```go\n/*String Demo 2 - Concatenation*/\n/*Package Declaration*/\n\
    package main\n\n/*Import Statement - import fmt, strings packages*/\nimport (\n\
    \t\"fmt\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t\
    /*Declare and initialize a string array*/\n\tvar words = []string{\"This\", \"\
    is\", \"an\", \"array\", \"of\", \"7\", \"strings\"}\n\n\t/*Display the string\
    \ array*/\n\tfmt.Printf(\"\\nwords array: %s\\n\", words)\n\n\t/*Concatenate using\
    \ strings.Join*/\n\twords_str := strings.Join(words, \" \")\n\n\tfmt.Printf(\"\
    \\nConcatenated string (using strings.Join): %s\\n\", words_str)\n\n\t/*Short\
    \ declare some strings*/\n\tstr1 := \"Go\"\n\tstr2 := \"Programming\"\n\tstr3\
    \ := \"Language\"\n\n\t/*Concatenate str1, str2 and str3*/\n\tstr4 := str1 + \"\
    \ \" + str2 + \" \" + str3\n\n\tfmt.Printf(\"\\nstr1 = %s\\nstr2 = %s\\nstr3 =\
    \ %s\\n\\nConcatenated string (using + operator)\\n\\nstr4 = %s\\n\", str1, str2,\
    \ str3, str4)\n}\n```\n\nOutput:\n![](Image00072.jpg)\n\n## 14.2 Compare strings\n\
    \nThe `Compare` function from the `strings` package is used to compare two strings.\n\
    \nSyntax:\n```go\nstrings.Compare(<string1>, <string2>)\n```\n\nExample:\n```go\n\
    result := strings.Compare(string1, string2)\n```\n\nThis function returns 0 if\
    \ both strings are the same, returns `-1` if `string1` is lexicographically less\
    \ than `string2` and returns `1` if `string1` is lexicographically greater than\
    \ `string2`.\n\nLet us write a program to read two strings from the user and compare\
    \ them:\n\n```go\n/*Compare two strings*/\n/*Package Declaration*/\npackage main\n\
    \n/*Import Statement - import fmt, bufio, os, strings package*/\nimport (\n\t\"\
    fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\n\
    func main() {\n\t/*Create an input reader variable of type NewReader using stdin*/\n\
    \tinputReader := bufio.NewReader(os.Stdin)\n\n\t/*Prompt the user to enter something*/\n\
    \tfmt.Printf(\"\\nEnter a string: \")\n\n\t/*Read string using ReadString function*/\n\
    \tstr1, _ := inputReader.ReadString('\\n')\n\n\tfmt.Printf(\"\\nEnter another\
    \ string: \")\n\n\t/*Read string using ReadString function*/\n\tstr2, _ := inputReader.ReadString('\\\
    n')\n\n\t/*Compare str1 and str2 using strings.Compare*/\n\tresult := strings.Compare(str1,\
    \ str2)\n\n\tif result == 0 {\n\t\tfmt.Printf(\"\\nBoth strings are the same.\\\
    n\")\n\t} else if result > 0 {\n\t\tfmt.Printf(\"\\nFirst string is lexicographically\
    \ greater than the second string.\\n\")\n\t} else {\n\t\tfmt.Printf(\"\\nSecond\
    \ string is lexicographically greater than the first string.\\n\")\n\t}\n}\n```\n\
    \nOutput:\n![](Image00073.jpg)\n\n## 14.3 Search for a string inside another string\n\
    \nThe `Contains` function from the `strings` package is used to check if a string\
    \ is present in another string. This function returns boolean `true` if the string\
    \ is present and returns `false` if absent.\n\nSyntax:\n```go\nstrings.Contains(<main\
    \ string>, <string to be searched>)\n```\n\nExample:\n```go\nresult := strings.Contains(\"\
    Hello World\", \"World\")\n```\n\nFurther, you can use the `Index` function from\
    \ the `strings` package to determine the first occurrence of the given string\
    \ in the main string. This function returns `-1` if the string is not present\
    \ in the main string.\n\nHere is a program that reads two strings from the user\
    \ and searches for the second string in the main string:\n\n```go\n/*Search for\
    \ a string within another string*/\n/*Package Declaration*/\npackage main\n\n\
    /*Import Statement - import fmt, bufio, os, strings package*/\nimport (\n\t\"\
    fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\n\
    func main() {\n\t/*Create an input reader variable of type NewReader using stdin*/\n\
    \tinputReader := bufio.NewReader(os.Stdin)\n\n\t/*Prompt the user to enter something*/\n\
    \tfmt.Printf(\"\\nEnter the main string: \")\n\n\t/*Read string using ReadString\
    \ function*/\n\tmain_str, _ := inputReader.ReadString('\\n')\n\n\tfmt.Printf(\"\
    \\nEnter the string to be searched inside the main string: \")\n\n\t/*Read string\
    \ using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\n')\n\n\t\
    /*Use trim function to remove all \\n and \\r characters*/\n\tstr = strings.Trim(str,\
    \ \"\\n\\r\")\n\n\tresult := strings.Contains(main_str, str)\n\n\tif result ==\
    \ true {\n\t\tfmt.Printf(\"\\nThe given string is present in the main string.\"\
    )\n\n\t\t/*Find the first occurrence*/\n\t\tfirst := strings.Index(main_str, str)\n\
    \n\t\t/*Print first index*/\n\t\tfmt.Printf(\"\\n\\nFirst Occurrence: %d\\n\"\
    , first)\n\t} else {\n\t\tfmt.Printf(\"\\nThe given string is not present in the\
    \ main string.\\n\")\n\t}\n}\n```\n\nOutput:\n![](Image00074.jpg)\n\n## 14.4 Trimming\
    \ a string\n\nThere may arise a need to remove unwanted characters from a string.\
    \ You can use the `Trim` function from the `strings` package as follows:\n\n```go\n\
    <trimmed_string> = strings.Trim(<string>, <character set to be trimmed>)\n```\n\
    \nWhen reading strings from the user, there is a high chance that `\\n` or `\\\
    r` or both get appended to the string. You can use the `Trim` function to remove\
    \ these characters:\n\n```go\nnew_str = strings.Trim(str, \"\\n\\r\")\n```\n\n\
    In fact, let us see what happens when we read a string from the user – we will\
    \ convert the string to a character array to take a look at each character:\n\n\
    ```go\n/*Pre-trim demo*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement\
    \ - import fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\
    \n\t\"os\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input\
    \ reader variable of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
    \n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string:\
    \ \")\n\n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
    n')\n\n\tstr_length := len(str)\n\n\tfmt.Printf(\"\\nLength: %d\", str_length)\n\
    \n\t/*Use rune to fetch characters in an array*/\n\tstr_char := []rune(str)\n\n\
    \tfmt.Printf(\"\\n\\nCharacter array: \\n %c \\n\", str_char)\n\n\tfor i := 0;\
    \ i < str_length; i++ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\"\
    , i, str_char[i])\n\t}\n}\n```\n\nOutput:\n![](Image00075.jpg)\n\nWe entered the\
    \ word Linux, which clearly has 5 characters. But the length is reflected as 7.\
    \ Also, while printing characters, we see two empty characters at location 5 and\
    \ 7. Let us do a bit of investigation and see what is going on. We will modify\
    \ the following statement:\n\n```go\nfmt.Printf(\"\\nCharacter at index %d ==>\
    \ %c\\n\", i, str_char[i])\n```\n\nTo:\n\n```go\nfmt.Printf(\"\\nCharacter at\
    \ index %d ==> %X\\n\", i, str_char[i])\n```\n\nThe new statement will print the\
    \ HEX code of the characters. Here is the new output:\n![](Image00076.jpg)\n\n\
    Character at index 5 is D which is `0x0D` and at index 6 is A which is `0x0A`.\
    \ If you cross check these HEX values in an ASCII table, you will realize that\
    \ these characters are `\\r` and `\\n` respectively.\n\nLet us use the `Trim`\
    \ function and see what happens. Here is the new program:\n\n```go\n/*Trim demo*/\n\
    /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt, bufio,\
    \ os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\
    \n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input reader\
    \ variable of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
    \n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string:\
    \ \")\n\n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
    n')\n\n\t/*Trim to remove unwanted characters*/\n\tstr = strings.Trim(str, \"\\\
    n\\r\")\n\n\tstr_length := len(str)\n\n\tfmt.Printf(\"\\nLength: %d\", str_length)\n\
    \n\t/*Use rune to fetch characters in an array*/\n\tstr_char := []rune(str)\n\n\
    \tfmt.Printf(\"\\n\\nCharacter array: \\n %c \\n\", str_char)\n\n\tfor i := 0;\
    \ i < str_length; i++ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\"\
    , i, str_char[i])\n\t}\n}\n```\n\nOutput:\n![](Image00077.jpg)\n\n## 14.5 Case\
    \ conversion\n\nA string can be converted to upper and lower case using the functions\
    \ `ToUpper` and `ToLower` respectively.\n\nSyntax:\n```go\n<ustring> = strings.ToUpper(<string>)\n\
    <lstring> = strings.ToLower(<string>)\n```\n\nExample:\n```go\nstr1 = strings.ToUpper(s)\n\
    str2 = strings.ToLower(s)\n```\n\nHere is a program that demonstrates case conversion:\n\
    \n```go\n/*Case conversion demo*/\n/*Package Declaration*/\npackage main\n\n/*Import\
    \ Statement - import fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\
    \"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\nfunc main()\
    \ {\n\t/*Create an input reader variable of type NewReader using stdin*/\n\tinputReader\
    \ := bufio.NewReader(os.Stdin)\n\n\t/*Prompt the user to enter something*/\n\t\
    fmt.Printf(\"\\nEnter a string: \")\n\n\t/*Read string using ReadString function*/\n\
    \tstr, _ := inputReader.ReadString('\\n')\n\n\t/*Trim to remove unwanted characters*/\n\
    \tstr = strings.Trim(str, \"\\n\\r\")\n\n\t/*Convert to upper and lower case*/\n\
    \tu_str := strings.ToUpper(str)\n\tl_str := strings.ToLower(str)\n\n\tfmt.Printf(\"\
    \\nOriginal string: %s\\nUpper case string: %s\\nLower case string: %s\\n\", str,\
    \ u_str, l_str)\n}\n```\n\nOutput:\n![](Image00078.jpg)\n"
  trans: "\n\n# 14. 字符串\n\n字符串是字符的序列。可以通过将一系列字符用双引号括起来来形成常量字符串。就像数组一样，可以通过指定索引，借助访问操作符（`[]`）来访问单个字符。字符串的索引从\
    \ 0 开始，到比字符串大小小 1 的位置结束。字符串的长度可以使用 `len(<string>)` 函数来确定。使用访问操作符，只能读取单个字符，而不能设置。\n\
    \n下面是一个演示这些字符串基础知识的简单 Go 程序：\n\n```go\n/*String Demo 1*/\n/*Package Declaration*/\n\
    package main\n\n/*Import Statement - import fmt package*/\nimport (\n\t\"fmt\"\
