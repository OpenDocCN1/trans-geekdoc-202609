  fmt: "\n# Structures\n\nA structure is a user defined data type used to store a\
    \ collection of elements. Unlike arrays, elements can be of any data type. Structure\
    \ elements are also called fields.\n\nThe following syntax is used to define a\
    \ structure:\n\n```\ntype <structure name> struct {\n    <field 1> <data type\
    \ of field 1>\n    <field 2> <data type of field 2>\n    <field 3> <data type\
    \ of field 3>\n    ...\n    <field n> <data type of field n>\n}\n```\n\nLet us\
    \ define a structure to store the details of a student such as `student_id`, `first_name`,\
    \ `last_name`, `age`, `gpa`:\n\n```\ntype student struct {\n    student_id int\n\
    \    first_name string\n    last_name string\n    gpa float32\n}\n```\n\nA structure\
    \ definition is merely a blueprint of a user defined data type. It does not contain\
    \ data on its own. In order to make use of a structure definition, variables of\
    \ that structure type should be created and their fields must be set.\n\nHere\
    \ is how you would create a structure variable:\n\n```\nvar <structure variable>\
    \ <structure name>\n```\n\nExample:\n\n```\nvar s1 student\nvar x, y, student\n\
    ```\n\nThe fields of a structure variable can be set as follows:\n\n```\n<structure\
    \ variable>.<field> = <value>\n```\n\nExample:\n\n```\nvar s student\ns.student_id\
    \ = 100014\ns.first_name = \"Grant\"\ns.last_name = \"Dewan\"\ns.age = 16\n```\n\
    \nHere is an example that defines a structure, creates a structure variable, sets\
    \ its fields and prints them on the console:\n\n```go\n/* Structures Demo 1 */\n\
    /* Package Declaration */\npackage main\n\n/* Import Statement - import fmt package\
    \ */\nimport (\n    \"fmt\"\n)\n\n/* Define a structure */\n/* Set 3 fields */\n\
    type student struct {\n    s_id int\n    f_name string\n    l_name string\n  \
    \  grade int\n    age int\n    gpa float32\n}\n\n/* Mandatory main function */\n\
    func main() {\n    /* Declare a structure variable S of type student */\n    var\
    \ S student\n\n    /* Set fields of S */\n    S.s_id = 30657095\n    S.f_name\
    \ = \"Sophia\"\n    S.l_name = \"Johnson\"\n    S.grade = 12\n    S.age = 18\n\
    \    S.gpa = 8.97\n\n    /* Print S' details */\n    fmt.Printf(\"\\nStudent -\
    \ S\\n\")\n    fmt.Printf(\"\\nS.s_id = %d\", S.s_id)\n    fmt.Printf(\"\\nS.f_name\
    \ = %s\", S.f_name)\n    fmt.Printf(\"\\nS.l_name = %s\", S.l_name)\n    fmt.Printf(\"\
    \\nS.grade = %d\", S.grade)\n    fmt.Printf(\"\\nS.age = %d\", S.age)\n    /*\
    \ Print gpa, restrict to 2 decimal places */\n    fmt.Printf(\"\\nS.gpa = %.2f\\\
    n\", S.gpa)\n}\n```\n\nOutput:\n![](Image00082.jpg)\n\nA structure variable can\
    \ also be initialized using the following syntax:\n\n```\nvar <struct var> <struct\
    \ name> = <struct name>{<field 1>:<value 1>, ..., <field n>:<value n>}\n```\n\n\
    Example:\n\n```\nvar s1 student = student{student_id: 231, first_name: \"Rajat\"\
    , last_name: \"Singh\", age: 20}\n```\n\nShort-declaring a structure variable\
    \ is also possible with the following syntax:\n\n```\n<struct var> := <struct\
    \ name>{<field 1>:<value 1>, ..., <field n>:<value n>}\n```\n\nExample:\n\n```\n\
    s2 := student{student_id: 592, first_name: \"Jorge\", last_name: \"Fernandez\"\
    , age: 17}\n```\n\nHere is a program that shows all the methods of field setting:\n\
    \n```go\n/* Structures Demo 2 */\n/* Package Declaration */\npackage main\n\n\
    /* Import Statement - import fmt package */\nimport (\n    \"fmt\"\n)\n\n/* Define\
    \ a structure */\n/* Set 3 fields */\ntype person struct {\n    name string\n\
    \    address string\n    age int\n}\n\n/* Mandatory main function */\nfunc main()\
    \ {\n    /* Declare a structure variable p1 */\n    var p1 person\n\n    /* Set\
    \ fields of p1 */\n    p1.name = \"Earl\"\n    p1.address = \"NJ\"\n    p1.age\
    \ = 25\n\n    /* Declare and initialize a structure variable p2 */\n    var p2\
    \ person = person{name: \"Manjunath\", address: \"New Delhi\", age: 30}\n\n  \
    \  /* Short declare and initialize structure variable p3 */\n    p3 := person{name:\
    \ \"Bella\", address: \"London\", age: 19}\n\n    fmt.Printf(\"\\nperson p1\\\
    n\")\n    fmt.Printf(\"\\np1.name = %s\\np1.address = %s\\np1.age = %d\\n\", p1.name,\
    \ p1.address, p1.age)\n    fmt.Printf(\"\\nperson p2\\n\")\n    fmt.Printf(\"\\\
    np2.name = %s\\np2.address = %s\\np2.age = %d\\n\", p2.name, p2.address, p2.age)\n\
    \    fmt.Printf(\"\\nperson p3\\n\")\n    fmt.Printf(\"\\np3.name = %s\\np3.address\
    \ = %s\\np3.age = %d\\n\", p3.name, p3.address, p3.age)\n}\n```\n\nOutput:\n"
  trans: "\n\n# 结构体\n\n结构体是一种用户定义的数据类型，用于存储元素的集合。与数组不同，元素可以是任意数据类型。结构体元素也称为字段。\n\n\
    使用以下语法来定义结构体：\n\n```\ntype <结构体名称> struct {\n    <字段 1> <字段 1 的数据类型>\n    <字段\
    \ 2> <字段 2 的数据类型>\n    <字段 3> <字段 3 的数据类型>\n    ...\n    <字段 n> <字段 n 的数据类型>\n\
    }\n```\n\n让我们定义一个结构体来存储学生的详细信息，例如 `student_id`、`first_name`、`last_name`、`age`、`gpa`：\n\
    \n```\ntype student struct {\n    student_id int\n    first_name string\n    last_name\
    \ string\n    gpa float32\n}\n```\n\n结构体定义仅仅是用户定义数据类型的蓝图。它本身不包含数据。为了使用结构体定义，应创建该结构体类型的变量，并设置其字段。\n\
    \n以下是创建结构体变量的方法：\n\n```\nvar <结构体变量> <结构体名称>\n```\n\n示例：\n\n```\nvar s1 student\n\
    var x, y, student\n```\n\n结构体变量的字段可以按如下方式设置：\n\n```\n<结构体变量>.<字段> = <值>\n```\n\
    \n示例：\n\n```\nvar s student\ns.student_id = 100014\ns.first_name = \"Grant\"\n\
    s.last_name = \"Dewan\"\ns.age = 16\n```\n\n下面是一个定义结构体、创建结构体变量、设置其字段并在控制台打印它们的示例：\n\
    \n```go\n/* 结构体演示 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport\
    \ (\n    \"fmt\"\n)\n\n/* 定义一个结构体 */\n/* 设置 3 个字段 */\ntype student struct {\n\
    \    s_id int\n    f_name string\n    l_name string\n    grade int\n    age int\n\
    \    gpa float32\n}\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明一个类型为 student\
    \ 的结构体变量 S */\n    var S student\n\n    /* 设置 S 的字段 */\n    S.s_id = 30657095\n\
    \    S.f_name = \"Sophia\"\n    S.l_name = \"Johnson\"\n    S.grade = 12\n   \
    \ S.age = 18\n    S.gpa = 8.97\n\n    /* 打印 S 的详细信息 */\n    fmt.Printf(\"\\nStudent\
    \ - S\\n\")\n    fmt.Printf(\"\\nS.s_id = %d\", S.s_id)\n    fmt.Printf(\"\\nS.f_name\
    \ = %s\", S.f_name)\n    fmt.Printf(\"\\nS.l_name = %s\", S.l_name)\n    fmt.Printf(\"\
    \\nS.grade = %d\", S.grade)\n    fmt.Printf(\"\\nS.age = %d\", S.age)\n    /*\
    \ 打印 gpa，限制为 2 位小数 */\n    fmt.Printf(\"\\nS.gpa = %.2f\\n\", S.gpa)\n}\n```\n\
    \n输出：\n![](img/Image00082.jpg)\n\n结构体变量也可以使用以下语法进行初始化：\n\n```\nvar <结构体变量> <结构体名称>\
    \ = <结构体名称>{<字段 1>:<值 1>, ..., <字段 n>:<值 n>}\n```\n\n示例：\n\n```\nvar s1 student\
    \ = student{student_id: 231, first_name: \"Rajat\", last_name: \"Singh\", age:\
    \ 20}\n```\n\n也可以使用以下语法短声明结构体变量：\n\n```\n<结构体变量> := <结构体名称>{<字段 1>:<值 1>, ...,\
    \ <字段 n>:<值 n>}\n```\n\n示例：\n\n```\ns2 := student{student_id: 592, first_name:\
    \ \"Jorge\", last_name: \"Fernandez\", age: 17}\n```\n\n下面是一个展示所有字段设置方法的程序：\n\n\
    ```go\n/* 结构体演示 2 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport\
    \ (\n    \"fmt\"\n)\n\n/* 定义一个结构体 */\n/* 设置 3 个字段 */\ntype person struct {\n \
    \   name string\n    address string\n    age int\n}\n\n/* 强制性的 main 函数 */\nfunc\
    \ main() {\n    /* 声明一个结构体变量 p1 */\n    var p1 person\n\n    /* 设置 p1 的字段 */\n\
    \    p1.name = \"Earl\"\n    p1.address = \"NJ\"\n    p1.age = 25\n\n    /* 声明并初始化一个结构体变量\
    \ p2 */\n    var p2 person = person{name: \"Manjunath\", address: \"New Delhi\"\
    , age: 30}\n\n    /* 短声明并初始化结构体变量 p3 */\n    p3 := person{name: \"Bella\", address:\
    \ \"London\", age: 19}\n\n    fmt.Printf(\"\\nperson p1\\n\")\n    fmt.Printf(\"\
    \\np1.name = %s\\np1.address = %s\\np1.age = %d\\n\", p1.name, p1.address, p1.age)\n\
    \    fmt.Printf(\"\\nperson p2\\n\")\n    fmt.Printf(\"\\np2.name = %s\\np2.address\
    \ = %s\\np2.age = %d\\n\", p2.name, p2.address, p2.age)\n    fmt.Printf(\"\\nperson\
    \ p3\\n\")\n    fmt.Printf(\"\\np3.name = %s\\np3.address = %s\\np3.age = %d\\\
    n\", p3.name, p3.address, p3.age)\n}\n```\n\n输出：\n\n"
