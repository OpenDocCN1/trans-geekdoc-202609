- raw: "13\\. Functions A function is a piece of reusable code that can be “called”\
    \ to perform certain tasks. We have already used a few functions such as Printf,\
    \ Scalnln, Atoi, etc . These functions are written by someone else and we are\
    \ using them to make our programming life easier. Scanln and Println are I/O functions\
    \ which implicitly work with the devices (either directly or indirectly) to do\
    \ the required job. Imagine how inconvenient programming would be if we had to\
    \ write a big piece of code every time we wanted to print something on the console.\
    \ Because Println and Scanln functions are already defined somewhere by someone,\
    \ programmers like us can simply call them to get our job done. In this chapter,\
    \ we will learn to write our own functions. The topic of functions can be broadly\
    \ classified into two categories – function definition and function call . 13.1\
    \ Function Definition Function definition is a piece of code that defines what\
