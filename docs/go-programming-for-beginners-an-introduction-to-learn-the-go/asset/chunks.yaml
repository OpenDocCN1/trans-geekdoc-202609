  fmt: "\n# 函数体\n\n函数体是函数的核心部分，实际工作在此完成。例如，若有一个函数用于计算给定数字的阶乘，负责计算阶乘的代码即位于定义的这一部分。以下代码片段展示了不同类型的函数：\n\
    \n```go\n/*Function that accepts no arguments and returns no value*/\nfunc sayHello()\
    \ {\n    fmt.Printf(\"\\nJust a function that prints Hello on the console.\")\n\
    }\n\n/*Function that accepts one argument and returns no value*/\nfunc showValue(name\
    \ string) {\n    fmt.Printf(\"\\nReceived name = %s\", name)\n}\n\n/*Function\
    \ that accepts one argument and returns one value*/\nfunc doubleIt(x int) int\
    \ {\n    return (x * 2)\n}\n\n/*Function that accepts three arguments and returns\
    \ two values*/\nfunc doMath(a int, b int, c int) (int, float32) {\n    sum :=\
    \ a + b + c\n    avg = float32(sum) / 3.0\n    return sum, avg\n}\n```\n\n## 13.2\
    \ 函数调用\n\n已定义的函数不会自动执行，需要被调用（可能从另一个函数，如 `main` 函数中调用）。函数通过其名称调用，并按函数定义中指定的顺序传递完全相同数量的参数。通用语法如下：\n\
    \n```\n<function name>(<arguments>)\n```\n\n示例：`myFunction()`\n\n下面调用上一节定义的每个函数：\n\
    \n```go\nsayHello()\nshowValue(\"Sarah\")\nx = doubleIt(100)\nsum, avg = doMath(1,\
    \ 2, 3)\n```\n\n以下是一个不接受参数且无返回值的简单函数示例：\n\n```go\n/*Function Demo 1*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*User defined function*/\n/*This function accepts no arguments\
    \ and returns no value*/\nfunc myFunction() {\n    fmt.Printf(\"\\n[Inside myFunction]\
    \ - Hello! from myFunction\\n\")\n}\n\n/*Mandatory main function*/\nfunc main()\
    \ {\n    fmt.Printf(\"\\n[Inside main] - now calling myFunction\\n\")\n    /*Call\
    \ myFunction*/\n    myFunction()\n    fmt.Printf(\"\\n[Inside main] - reaching\
    \ the end of main function/program\\n\")\n}\n```\n\n输出：\n![](Image00065.jpg)\n\
    \n## 13.3 向函数传递参数\n\n在函数调用时，通过将参数括在括号内来传递。多个参数用逗号分隔。参数只能传递给接受参数的函数。值得注意的是，函数调用时传递的参数数量和顺序必须与函数定义中一致。\n\
    \n下面是一个 Go 程序，演示接受两个整数并计算其和的函数：\n\n```go\n/*Function Demo 2*/\n/*Package Declaration*/\n\
    package main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\
    \n)\n\n/*User defined function*/\n/*This function accepts 2 arguments and returns\
    \ no value*/\nfunc addTwoNumbers(a int, b int) {\n    sum := a + b\n    fmt.Printf(\"\
    \\n[Inside addTwoNumbers] - Received two arguments: \\n\\na = %d, b = %d\\n\\\
    n\", a, b)\n    fmt.Printf(\"\\n[Inside addTwoNumbers] - Sum = %d\\n\", sum)\n\
    }\n\n/*Mandatory main function*/\nfunc main() {\n    fmt.Printf(\"\\n[Inside main]\
    \ - now calling addTwoNumbers, passing 5 and 9 as arguments\\n\")\n    /*Call\
    \ addTwoNumbers*/\n    addTwoNumbers(5, 9)\n    fmt.Printf(\"\\n[Inside main]\
    \ - reaching the end of main function/program\\n\")\n}\n```\n\n输出：\n![](Image00066.jpg)\n\
    \n## 13.4 返回值\n\n函数可借助 `return` 语句向调用函数返回值。通用语法如下：\n\n```\nreturn <values>\n```\n\
    \n示例：\n\n```go\n/*Single value*/\nreturn name\n\n/*Multiple values*/\nreturn x,\
    \ y, z\n```\n\n调用返回值的函数时，必须指定变量接收返回值，否则将丢失。接收多个值时需指定多个变量，返回多值时将执行多重赋值。示例如下：\n\n\
    ```go\n/*Receive single value*/\nname = getName()\n\n/*Receive multiple values*/\n\
    a, b, c = getValues()\n```\n\n下面编写一个函数，接受三个整数，计算平均值并返回：\n\n```go\n/*Function Demo\
    \ 3*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt\
    \ package*/\nimport (\n    \"fmt\"\n)\n\n/*User defined function*/\n/*This function\
    \ accepts 3 arguments and returns one value*/\nfunc findAverage(a int, b int,\
    \ c int) float32 {\n    fmt.Printf(\"\\n[Inside findAverage] - Received three\
    \ arguments: \\n\\na = %d, b = %d, c = %d\\n\\n\", a, b, c)\n    /*Calculate sum*/\n\
    \    sum := a + b + c\n    /*Calculate average, use type casting to convert from\
    \ int to float*/\n    avg := (float32(sum) / 3.0)\n    fmt.Printf(\"\\n[Inside\
    \ findAverage] - Returning avg back to main\\n\")\n    return avg\n}\n\n/*Mandatory\
    \ main function*/\nfunc main() {\n    fmt.Printf(\"\\n[Inside main] - now calling\
    \ findAverage, passing 2, 8 and -3 as arguments\\n\")\n    /*Call findAverage,\
    \ receive returned value in average variable (short declared)*/\n    average :=\
    \ findAverage(2, 8, -3)\n    fmt.Printf(\"\\n[Inside main] - average = %f\\n\"\
    , average)\n    fmt.Printf(\"\\n[Inside main] - reaching the end of main function/program\\\
    n\")\n}\n```\n\n输出：\n![](Image00067.jpg)\n\n再编写一个程序，演示返回多个值的函数。定义一个函数接受两个整数，返回四个值——和、差、积、商：\n\
    \n```go\n/*Function Demo 4*/\n/*Package Declaration*/\npackage main\n\n/*Import\
    \ Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*User defined\
    \ function*/\n/*This function accepts 2 arguments and returns 4 values*/\nfunc\
    \ performArithmetics(a int, b int) (int, int, int, float32) {\n    fmt.Printf(\"\
    \\n[Inside performArithmetics] - Received 2 arguments: \\n\\na = %d, b = %d\\\
    n\\n\", a, b)\n    /*Calculate sum, diff, prod, quo*/\n    sum := a + b\n    diff\
    \ := a - b\n    prod := a * b\n    quo := float32(a) / float32(b)\n    fmt.Printf(\"\
    \\n[Inside performArithmetics] - Returning sum, diff, prod, quo back to main\\\
    n\")\n    return sum, diff, prod, quo\n}\n\n/*Mandatory main function*/\nfunc\
    \ main() {\n    /*Declare variables to store return values*/\n    var sum, diff,\
    \ prod int\n    var quo float32\n    fmt.Printf(\"\\n[Inside main] - now calling\
    \ performArithmetics, passing 15 and 6 as arguments\\n\")\n    /*Call performArithmetics,\
    \ receive returned values in sum, diff, prod, quo*/\n    sum, diff, prod, quo\
    \ = performArithmetics(15, 6)\n    fmt.Printf(\"\\n[Inside main] - sum = %d, diff\
    \ = %d, prod = %d, quo = %f\\n\", sum, diff, prod, quo)\n    fmt.Printf(\"\\n[Inside\
    \ main] - reaching the end of main function/program\\n\")\n}\n```\n\n输出：\n![](Image00068.jpg)\n\
    \n## 13.5 数组作为参数传递\n\n将数组作为参数传递给函数的过程与传递其他参数相同。通用语法如下：\n\n```go\nfunc <function\
    \ name>(<array variable>[] <data type>) <return type> {\n    /*Statements*/\n\
    }\n\n/*OR*/\nfunc <function name>(<array variable>[<size>] <data type>) <return\
    \ type> {\n    /*Statements*/\n}\n```\n\n示例：\n\n```go\nfunc demoFunction(names\
    \ []string) {\n    /*Statements*/\n}\n\n/*OR*/\nfunc demoFunction(names [10]string)\
    \ {\n    /*Statements*/\n}\n```\n\n> **注意**：虽然在大多数情况下不指定数组大小程序也能正常运行，但建议始终注明数组大小。\n\
    \n下面编写一个 Go 程序，接受一个整数数组，返回所有元素的和及其平均值：\n\n```go\n/*Function Demo 5*/\n/*Package\
    \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
    \ (\n    \"fmt\"\n)\n\n/*User defined function*/\n/*This function accepts an array\
