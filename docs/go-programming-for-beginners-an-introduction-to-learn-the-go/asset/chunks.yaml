  fmt: "\n# 17. Programming Examples\n\nNow that we have gone through the basics of\
    \ Go programming, let us put those concepts to use and try out some programming\
    \ examples.\n\n## 17.1 Sum of digits of a number\n\nHere is a program that reads\
    \ an integer from the user and calculates the sum of its digits:\n\n```go\n/*Sum\
    \ of digits*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
    \ fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main()\
    \ {\n\tvar number int\n\tvar sum int = 0\n\tfmt.Printf(\"\\nEnter a number: \"\
    )\n\tfmt.Scanf(\"%d\", &number)\n\tfor number > 0 {\n\t\t/*Add one's digit to\
    \ sum*/\n\t\tsum = sum + (number % 10)\n\t\t/*Discard one's digit*/\n\t\tnumber\
    \ = number / 10\n\t}\n\tfmt.Printf(\"\\nSum of all digits: %d\\n\", sum)\n}\n\
    ```\n\n**Output:**\n![](Image00084.jpg)\n\n## 17.2 Fibonacci series\n\nFibonacci\
    \ series begins with the terms 0 and 1. The next term is derived by adding the\
    \ previous two terms. Since first two terms are 0 and 1, the next terms will be\
    \ 1, 2, 3, 5, 8 and so on. Here is the program:\n\n```go\n/*Fibonacci Series*/\n\
    /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\n\
    import (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\tvar terms,\
    \ next int\n\tvar previous, current int = 0, 1\n\tfmt.Printf(\"\\nEnter the number\
    \ of terms to be generated: \")\n\tfmt.Scanf(\"%d\", &terms)\n\tif terms < 2 {\n\
    \t\tfmt.Printf(\"\\nFibonacci series contains at least two terms\")\n\t} else\
    \ {\n\t\tfmt.Printf(\"\\n\\nFibonacci series:\\n\\n\")\n\t\tfor i := 0; i < terms;\
    \ i++ {\n\t\t\tfmt.Printf(\"%d \", previous)\n\t\t\tnext = previous + current\n\
    \t\t\tprevious = current\n\t\t\tcurrent = next\n\t\t}\n\t}\n\tfmt.Printf(\"\\\
    n\")\n}\n```\n\n**Output:**\n![](Image00085.jpg)\n\n## 17.3 Reverse a given number\n\
    \nHere is a program that reads an integer and reverses it:\n\n```go\n/*Reverse\
    \ a number*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
    \ fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main()\
    \ {\n\tvar number int\n\tvar rev int = 0\n\tfmt.Printf(\"\\nEnter a number: \"\
    )\n\tfmt.Scanf(\"%d\", &number)\n\tfor number > 0 {\n\t\trev = (rev * 10) + (number\
    \ % 10)\n\t\tnumber = number / 10\n\t}\n\tfmt.Printf(\"\\nReverse: %d\\n\", rev)\n\
    }\n```\n\n**Output:**\n![](Image00086.jpg)\n\n## 17.4 String Palindrome\n\nA string\
    \ is said to be a palindrome if its reverse is the same as the original string.\
    \ For example, the word “book” is not a palindrome while the word “malayalam”\
    \ is a palindrome. Following is a program that receives a string as an input and\
    \ checks if it is a palindrome. Note that case-sensitivity is not accounted for.\n\
    \n```go\n/*Palindrome*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement\
    \ - import fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\
    \n\t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t\
    /*Create an input reader variable of type NewReader using stdin*/\n\tinputReader\
    \ := bufio.NewReader(os.Stdin)\n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\
    \\nEnter a string: \")\n\t/*Read string using ReadString function*/\n\tstr, _\
    \ := inputReader.ReadString('\\n')\n\t/*Trim \\n and \\r characters*/\n\tstr =\
    \ strings.Trim(str, \"\\n\\r\")\n\tstr_length := len(str) - 1\n\t/*Use rune to\
    \ fetch characters in an array*/\n\tstr_char := []rune(str)\n\t/*Reverse str*/\n\
    \tfor i := 0; i < str_length/2; i++ {\n\t\ttemp := str_char[i]\n\t\tstr_char[i]\
    \ = str_char[str_length-i]\n\t\tstr_char[str_length-i] = temp\n\t}\n\t/*Convert\
    \ back to string using string function*/\n\trev_str := string(str_char)\n\tfmt.Printf(\"\
    \\nReversed string: %s\\n\", rev_str)\n\t/*Check if both strings are equal*/\n\
    \tresult := strings.Compare(str, rev_str)\n\tif result == 0 {\n\t\tfmt.Printf(\"\
    \\n%s is a palindrome.\\n\", str)\n\t} else {\n\t\tfmt.Printf(\"\\n%s is not a\
    \ palindrome.\\n\", str)\n\t}\n}\n```\n\n**Output:**\n![](Image00087.jpg)\n\n\
    ## 17.5 Bubble Sort\n\nBubble sort is an algorithm for sorting data structures\
    \ in ascending or descending order. In this algorithm, two loops are used in a\
    \ nested manner. The inner loop makes sure that the greatest or the smallest element\
    \ is either placed at the beginning or the end of the data structure. The number\
    \ of iterations that the outer loop goes through is equal to the number of elements\
    \ in the data structure. We will write a program to read 5 integers from the user,\
    \ put them in an array and sort the array in ascending order using bubble sort.\n\
    \n```go\n/*Sorting array using Bubble Sort*/\n/*Package Declaration*/\npackage\
    \ main\n\n/*Import Statement - import fmt package*/\nimport (\n\t\"fmt\"\n\t\"\
    strconv\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Declare variables*/\n\
    \tvar arr [5]int\n\t/*Declare two loop counters*/\n\tvar i, j int\n\t/*Declare\
    \ a variable to temporarily store num as string*/\n\tvar num_str string\n\t/*Prompt\
    \ the user to enter 5 elements, use for loop*/\n\tfor i = 0; i < 5; i++ {\n\t\t\
    fmt.Printf(\"\\nEnter element at index %d: \", i)\n\t\tfmt.Scanln(&num_str)\n\t\
    \t/*Convert num_str to integer*/\n\t\tnum, err := strconv.Atoi(num_str)\n\t\t\
    /*Assign num to arr[i]*/\n\t\tarr[i] = num\n\t\t/*Assign err to blank identifier*/\n\
    \t\t_ = err\n\t}\n\tfmt.Printf(\"\\nOriginal array: %d\\n\", arr)\n\tarr_length\
    \ := len(arr)\n\t/*Bubble sort*/\n\tfor i = 0; i < arr_length; i++ {\n\t\tfor\
    \ j = 0; j < i; j++ {\n\t\t\tif arr[j] > arr[j+1] {\n\t\t\t\ttemp := arr[j]\n\t\
    \t\t\tarr[j] = arr[j+1]\n\t\t\t\tarr[j+1] = temp\n\t\t\t}\n\t\t}\n\t}\n\tfmt.Printf(\"\
    \\nSorted array: %d\\n\", arr)\n}\n```\n\n**Output:**\n![](Image00088.jpg)\n\n\
    # 18. Final Words\n\nGo programming language is a relatively new one. The first\
    \ version was released in 2012, so at the time of writing this book, it is just\
    \ about 8 years old in 2020. This language has great potential with the kind of\
