- raw: "17\\. Programming Examples Now that we have gone through the basics of Go\
    \ programming, let us put those concepts to use and try out some programming examples.\
    \ 17.1 Sum of digits of a number Here is a program that reads an integer from\
    \ the user and calculates the sum of its digits: /\\*Sum of digits\\*/ /\\*Package\
    \ Declaration\\*/ package main /\\*Import Statement - import fmt package\\*/ import\
    \ ( \"fmt\" ) /\\*Mandatory main function\\*/ func main () { ​ var number int\
    \ ​ var sum int \\= 0 ​ fmt . Printf ( \"\\\\nEnter a number: \" ) ​ fmt . Scanf\
    \ ( \"%d\" , & number ) ​ for number > 0 { ​ ​ /\\*Add one's digit to sum\\*/\
    \ ​ ​ sum \\= sum + ( number % 10 ) ; ​ ​ /\\*Discard one's digit\\*/ ​ ​ number\
    \ \\= number / 10 ; ​ } ​ fmt . Printf ( \"\\\\nSum of all digits: %d\\\\n\" ,\
    \ sum ) } Output: ![](Image00084.jpg)17.2 Fibonacci series Fibonacci series begins\
    \ with the terms 0 and 1. The next term is derived by adding the previous two\
    \ terms. Since first two terms are  0 and 1, the next terms will be 1, 2, 3, 5,\
    \ 8 and so son. Here is the program: /\\*Fibonacci Series\\*/ /\\*Package Declaration\\\
    */ package main /\\*Import Statement - import fmt package\\*/ import ( \"fmt\"\
    \ ) /\\*Mandatory main function\\*/ func main () { ​ var terms , next int ​ var\
    \ previous , current int \\= 0 , 1 ​ fmt . Printf ( \"\\\\nEnter the number of\
    \ terms to be generated: \" ) ​ fmt . Scanf ( \"%d\" , & terms ) ​ if ( terms\
    \ < 2 ) { ​ ​ fmt . Printf ( \"\\\\nFibonacci series contains at least two terms\"\
    \ ) ​ } else { ​ ​ fmt . Printf ( \"\\\\n\\\\nFibonacci series:\\\\n\\\\n\" )\
    \ ​ ​ for i := 0 ; i < ( terms ) ; i ++ { ​ ​ fmt . Printf ( \"%d \" , previous\
    \ ) ​ ​ next \\= previous + current ​ ​ previous \\= current ​ ​ current \\= next\
    \ ​ ​ ​ } ​ } ​ fmt . Printf ( \"\\\\n\" ) } Output: ![](Image00085.jpg)17.3 Reverse\
    \ a given number Here is a program that reads an integer and reverses it: /\\\
    *Reverse a number\\*/ /\\*Package Declaration\\*/ package main /\\*Import Statement\
    \ - import fmt package\\*/ import ( \"fmt\"  ) /\\*Mandatory main function\\*/\
    \ func main () { ​ var number int ​ var rev int \\= 0 ​ fmt . Printf ( \"\\\\\
    nEnter a number: \" ) ​ fmt . Scanf ( \"%d\" , & number ) ​ for ( number > 0 )\
    \ { ​ ​ rev \\= ( rev \\* 10 ) + ( number % 10 ) ​ ​ number \\= number / 10 ​\
    \ } ​ fmt . Printf ( \"\\\\nReverse: %d\\\\n\" , rev ) } Output: ![](Image00086.jpg)17.4\
    \ String Palindrome A string is said to be a palindrome if its reverse is the\
    \ same as the original string. For example, the word “book” is not a palindrome\
    \ while the word “malayalam” is a palindrome. Following is a program that receives\
    \ a string as an input and checks if it is a palindrome. Note that case-sensitivity\
    \ is not accounted for. /\\*Palindrome\\*/ /\\*Package Declaration\\*/ package\
    \ main /\\*Import Statement - import fmt, bufio, os, strings package\\*/ import\
    \ ( ​ ​ \"fmt\" ​ ​ \"bufio\" ​ ​ \"os\" ​ ​ \"strings\" ​ ​ ) /\\*Mandatory main\
    \ function\\*/ func main ()  { ​ /\\*Create an input reader variable of type NewReader\
    \ using stdin\\*/ ​ inputReader := bufio . NewReader ( os . Stdin ) ​ /\\*Prompt\
    \ the user to enter something\\*/ ​ fmt . Printf ( \"\\\\nEnter a string: \" )\
    \ ​ /\\*Read string using ReadString function\\*/ str , \\_ := inputReader . ReadString\
    \ ( '\\\\n' ) ​ /\\*Trim \\\\n and \\\\r characters\\*/ ​ str \\= strings . Trim\
    \ ( str , \"\\\\n\\\\r\" ) ​ str\\_length := len ( str ) \\- 1 ​ /\\*Use rune\
    \ to fetchs characters in an array\\*/ ​ str\\_char := \\[\\] rune ( str ) ​ /\\\
    *Reverse str\\*/ ​ for i := 0 ; i < str\\_length / 2 ; i ++ { ​ ​ temp := str\\\
    _char \\[ i \\] ​ ​ str\\_char \\[ i \\] \\= str\\_char \\[ str\\_length \\- i\
    \ \\] ​ ​ str\\_char \\[ str\\_length \\- i \\] \\= temp ​ } ​ /\\*Convert back\
