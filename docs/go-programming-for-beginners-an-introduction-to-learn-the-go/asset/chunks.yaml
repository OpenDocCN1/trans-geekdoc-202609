- raw: "7\\. Variables A variable is a uniquely identifiable name given to a memory\
    \ location. When a variable is declared, some space is reserved for it in the\
    \ memory depending on its type. For example, if you declare a variable of int8\
    \ type, 1 byte (8-bits) will be reserved in the memory; if you declare a variable\
    \ of float64 type , 8 bytes (64-bits) will be reserved for it in the memory. These\
    \ memory locations have uniquely identifiable address which is usually in hexadecimal\
    \ format. Because it would not be possible to work with memory addresses every\
    \ time we want to access data we use variables. Naming rules for variables are\
    \ the same as identifier naming rules – a variable name can contain alphanumeric\
    \ characters; it cannot start with a number and the only allowed special character\
    \ is underscore (\\_) . A variable can be declared using the var keyword with\
    \ the following syntax: var <variable 1>, <variable 2>, …. , <variable n> <data\
    \ type> Example: /\\*Declare 2 variables of type string\\*/ var first\\_name,\
    \ last\\_name string /\\*Declare 1 variable of type int\\*/ var p int /\\*Declare\
    \ 2 variables of type Boolean (bool)\\*/ var flag1, flag2 bool /\\*Declare 1 variable\
    \ of type float32\\*/ var p float32 7.1 Variable Initialization Variables when\
    \ they are declared (using snippets shown above) will have zero values . That\
    \ is, a Boolean variable will have a default false value, a numeric variable will\
    \ have 0 value and a string variable will hold an empty string (“”) . You can\
    \ set initial values to variables at the time of declaration. This process is\
    \ known as initialization . Variables when initialized will hold the initial value\
    \ that you set instead of a zero value. Here is the general syntax: var <variable\
    \ 1>, ... ,<variable n> <data type (optional)> = <value 1>, … ,<value n> Example:\
    \ /\\*Declare 1 int variable with value 1290, mention the type\\*/ var x int =\
    \ 1290 /\\*Declare 2 float32 variables with values -36.58 and 59.37, mention the\
    \ type\\*/ var a, b float32 = -36.58, 59.37 It is also possible to declare and\
    \ initialize variables with mixed data types as follows: var <variable 1>, <variable\
    \ 2>, … <variable n> = <value 1>, <value 2>, … <value n> Example: /\\*Declare\
    \ and initialize two Boolean values without mentioning the type\\*/ var b1, b2\
    \ = false, true /\\*Declare and initialize 4 variables of mixed type\\*/ var name,\
    \ age, height, is\\_working = “Adam”, 19, 1.78, false 7.2 Short Variable Declaration\
    \ Short variable declaration is used to declare and initialize variables with\
    \ the help of short declaration operator ( : \\= ) . Using this method, you can\
    \ skip using the var keyword however, initial value has to be assigned. General\
    \ Syntax: <variable 1>, <variable 2>, … <variable n> := <value 1>, <value 2>,\
    \ … <value n> Example: /\\*Short declare and initialize an integer value\\*/ num\
    \ := 31 /\\*Short declare and initialize variables of different types\\*/ msg,\
    \ x, flag, y := “Hello”, -6, true, 8.122 Note: Short declaration will only work\
    \ inside a function. Variables declared outside functions will have to be declared\
    \ with the var keyword. We will mostly be declaring variables inside functions\
    \ unless specified otherwise. This concept will be clearer in the Functions chapter.\
    \ 7.3 Variable Assignment Variables can be assigned values using the de-facto\
    \ assignment operator given by the equal-to sign (=) . For variable assignment\
    \ to work, the variables must be declared first – either using the var keyword\
    \ or using short declaration . If you try to assign a value to a variable that\
    \ is not previously declared, the compiler will return an error. General Syntax:\
    \ /\\*Assuming the variables have been defined\\*/ <var 1>, <var 2>, … <var n>\
    \ = <value 1>, <value 2>, … <value n> Example: var x int v = 20 var a float64\
    \ var name string count := 0 a = -365.58901 name, count = “Max”, 99 7.4 Printing\
    \ Variables The contents of a variable can be printed on the console using the\
    \ Println function from the fmt package. Here is the general syntax: fmt.Println(<var\
    \ 1>, <var 2>, … <var n>) Example: fmt.Println(name) fmt.Println(a, b, c, d) You\
    \ can even use constant strings inside the Println function to label variables.\
    \ For example: var person\\_name, person\\_age = “Sasha”, 23 fmt.Println(“Name:”,\
    \ person\\_name, “Age:”, person\\_age) Note: While Println function does an alright\
    \ job printing contents of variables, it is a crude method. The proper way to\
    \ do this to use formatted strings with Printf function. This will be covered\
    \ in the next chapter. Here is a Go program that demonstrates the usage of variables:\
    \ /\\*Variables Demo\\*/ /\\*Package Declaration\\*/ package main /\\*Import Statement\
    \ - import fmt package\\*/ import ( \"fmt\" ) /\\*Mandatory main function\\*/\
    \ func main () { ​ /\\*Declare 2 variables of type int using var keyword\\*/ ​\
    \ var num1 , num2 int ​ /\\*Assign values to num1 and num2\\*/ ​ num1 \\= 10 ​\
    \ num2 \\= 20 ​ /\\*Declare and initialize 2 float32 variables using var keyword\\\
    */ ​ var x , y float32 \\= \\-67 . 81 , 45 . 76 ​ /\\*Declare and assign variables\
    \ of mixed type using var keyword\\*/ ​ var a , b , msg , flag \\= \\-5 , 9 .\
    \ 4 , \"Some text...\" , false ​ /\\*Short declare a complex number\\*/ ​ c1 :=\
    \ 2 + 3i ​ /\\*Short declare variables of different data types\\*/ ​ p , q , country\
    \ , c2 , done := 178 , \\-358 . 97 , \"Argentina\" , 5 \\- 12i , true ​ /\\*Print\
    \ Everything\\*/ ​ fmt . Println ( \"\\\\nnum1:\" , num1 , \", num2:\" , num2\
    \ ) ​ fmt . Println ( \"\\\\nx:\" , x , \", y:\" , y ) ​ fmt . Println ( \"\\\\\
    na:\" , a , \", b:\" , b , \", msg:\" , msg , \", flag:\" , flag ) ​ fmt . Println\
    \ ( \"\\\\nc1:\" , c1 ) ​ fmt . Println ( \"\\\\np:\" , p , \", q:\" , q , \"\
    , country:\" , country , \", c2:\" , c2 , \", done:\" , done ) } Output: ![](Image00022.jpg)Note:\
    \ \n\n1.  It is always a good idea to use meaningful variable names. For example,\
    \ if you want to store the name of a person, you are better off naming that variable\
    \ as name as opposed to something random such as xyz . \n\n2.  Declare the variables\
    \ only if you need them. If you declare a variable and do not use it anywhere\
    \ in your program, the compiler will give you a “declared but not used” error.\
    \ This will prevent the program from building. If you somehow happen to declare\
    \ the variable and not use it and want to avoid this error, you can assign the\
    \ unused variables to the blank identifier given by the underscore sign (\\_)\
    \ . "
  fmt: "\n# 7. Variables\n\n变量是赋予内存位置的唯一可识别名称。声明变量时，根据其类型会在内存中预留相应空间。例如，声明 `int8`\
    \ 类型变量将预留 1 字节（8 位）；声明 `float64` 类型变量将预留 8 字节（64 位）。这些内存位置拥有唯一可识别的地址，通常以十六进制格式表示。因为不可能每次访问数据都使用内存地址，所以我们使用变量。\n\
    \n变量命名规则与标识符命名规则相同：变量名可包含字母数字字符；不能以数字开头；唯一允许的特殊字符是下划线（`_`）。\n\n变量可使用 `var` 关键字按以下语法声明：\n\
    \n```go\nvar <variable 1>, <variable 2>, …, <variable n> <data type>\n```\n\n\
    示例：\n\n```go\n/*Declare 2 variables of type string*/\nvar first_name, last_name\
    \ string\n\n/*Declare 1 variable of type int*/\nvar p int\n\n/*Declare 2 variables\
    \ of type Boolean (bool)*/\nvar flag1, flag2 bool\n\n/*Declare 1 variable of type\
    \ float32*/\nvar p float32\n```\n\n## 7.1 Variable Initialization\n\n变量声明时（使用上述片段）将具有零值。即：布尔变量默认值为\
    \ `false`，数值变量默认值为 `0`，字符串变量默认值为空字符串（`\"\"`）。可在声明时设置初始值，此过程称为初始化。初始化后变量将保存设定的初始值而非零值。\n\
    \n通用语法：\n\n```go\nvar <variable 1>, ..., <variable n> <data type (optional)> =\
    \ <value 1>, …, <value n>\n```\n\n示例：\n\n```go\n/*Declare 1 int variable with\
    \ value 1290, mention the type*/\nvar x int = 1290\n\n/*Declare 2 float32 variables\
    \ with values -36.58 and 59.37, mention the type*/\nvar a, b float32 = -36.58,\
    \ 59.37\n```\n\n也可按如下方式声明并初始化混合数据类型的变量：\n\n```go\nvar <variable 1>, <variable\
    \ 2>, … <variable n> = <value 1>, <value 2>, … <value n>\n```\n\n示例：\n\n```go\n\
    /*Declare and initialize two Boolean values without mentioning the type*/\nvar\
    \ b1, b2 = false, true\n\n/*Declare and initialize 4 variables of mixed type*/\n\
    var name, age, height, is_working = \"Adam\", 19, 1.78, false\n```\n\n## 7.2 Short\
    \ Variable Declaration\n\n短变量声明使用短声明操作符（`:=`）声明并初始化变量。此方法可省略 `var` 关键字，但必须赋初值。\n\
    \n通用语法：\n\n```go\n<variable 1>, <variable 2>, … <variable n> := <value 1>, <value\
    \ 2>, … <value n>\n```\n\n示例：\n\n```go\n/*Short declare and initialize an integer\
    \ value*/\nnum := 31\n\n/*Short declare and initialize variables of different\
    \ types*/\nmsg, x, flag, y := \"Hello\", -6, true, 8.122\n```\n\n> **注意**：短声明仅在函数内部有效。函数外部声明的变量必须使用\
    \ `var` 关键字。除非另有说明，我们主要在函数内部声明变量。此概念将在 Functions 章节进一步阐述。\n\n## 7.3 Variable Assignment\n\
    \n变量可使用赋值操作符（`=`）赋值。变量赋值前必须已声明——无论是使用 `var` 关键字还是短声明。若尝试给未声明的变量赋值，编译器将报错。\n\n\
    通用语法：\n\n```go\n/*Assuming the variables have been defined*/\n<var 1>, <var 2>,\
    \ … <var n> = <value 1>, <value 2>, … <value n>\n```\n\n示例：\n\n```go\nvar x int\n\
    v = 20\nvar a float64\nvar name string\ncount := 0\na = -365.58901\nname, count\
    \ = \"Max\", 99\n```\n\n## 7.4 Printing Variables\n\n可使用 `fmt` 包的 `Println()`\
    \ 函数在控制台打印变量内容。\n\n通用语法：\n\n```go\nfmt.Println(<var 1>, <var 2>, … <var n>)\n\
    ```\n\n示例：\n\n```go\nfmt.Println(name)\nfmt.Println(a, b, c, d)\n```\n\n甚至可在 `Println()`\
    \ 函数中使用常量字符串标记变量。例如：\n\n```go\nvar person_name, person_age = \"Sasha\", 23\nfmt.Println(\"\
    Name:\", person_name, \"Age:\", person_age)\n```\n\n> **注意**：`Println()` 函数虽能打印变量内容，但属于粗糙方法。更规范的方式是使用\
    \ `Printf()` 函数配合格式化字符串，将在下一章介绍。\n\n下面是演示变量用法的 Go 程序：\n\n```go\n/*Variables Demo*/\n\
    /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\n\
    import (\n    \"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n    /*Declare\
    \ 2 variables of type int using var keyword*/\n    var num1, num2 int\n\n    /*Assign\
    \ values to num1 and num2*/\n    num1 = 10\n    num2 = 20\n\n    /*Declare and\
    \ initialize 2 float32 variables using var keyword*/\n    var x, y float32 = -67.81,\
    \ 45.76\n\n    /*Declare and assign variables of mixed type using var keyword*/\n\
    \    var a, b, msg, flag = -5, 9.4, \"Some text...\", false\n\n    /*Short declare\
    \ a complex number*/\n    c1 := 2 + 3i\n\n    /*Short declare variables of different\
    \ data types*/\n    p, q, country, c2, done := 178, -358.97, \"Argentina\", 5\
    \ - 12i, true\n\n    /*Print Everything*/\n    fmt.Println(\"\\nnum1:\", num1,\
    \ \", num2:\", num2)\n    fmt.Println(\"\\nx:\", x, \", y:\", y)\n    fmt.Println(\"\
    \\na:\", a, \", b:\", b, \", msg:\", msg, \", flag:\", flag)\n    fmt.Println(\"\
    \\nc1:\", c1)\n    fmt.Println(\"\\np:\", p, \", q:\", q, \", country:\", country,\
    \ \", c2:\", c2, \", done:\", done)\n}\n```\n\n输出：\n![](Image00022.jpg)\n\n> **注意**：\n\
    >\n> 1. 始终建议使用有意义的变量名。例如，存储人名时，命名为 `name` 优于 `xyz` 等随机名称。\n> 2. 仅在需要时声明变量。若声明变量却未在程序中使用，编译器将报“declared\
    \ but not used”错误，导致构建失败。若必须声明但不使用，可将其赋值给空标识符（`_`）以规避错误。\n"
