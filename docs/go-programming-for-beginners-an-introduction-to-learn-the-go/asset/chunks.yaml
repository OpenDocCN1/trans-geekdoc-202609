- raw: '11\. Control Structures Control structures are programming constructs used
    to give programmers better control over the flow of the program. When a program
    is compiled, an executable binary file is built. This file contains machine level
    instructions that are native to a particular platform. Every line of meaningful
    code results in one or more machine level instructions. For example, var name
    string will result in one type of a machine level instruction, a = b + c will
    result in another type of an instruction. This is done by the compiler and we
    do not have to worry about it. The point of bring this up in this chapter is to
    explain the flow of execution. So, back to the topic – each line of code refers
    to one or more executable instructions. Many lines of code will result in many
    machine level instructions. The executable binary once run will start executing
    from the first instruction till the last one. Conceptually, we can say that a
    program starts executing from the first line of code till the last one (although
    in reality the program file is not the one that executes, the executable binary
    does). The is a very linear flow of execution. We can alter this flow of execution
    using control structures. Go offers decision making constructs and loops as control
    structures. 11.1 Decision Making Decision making constructs introduce conditionality
    to the execution of a program. For example, you can execute a block of code depending
    on whether a condition is met or not met. Go offers decision making constructs
    in the form of if-else , switch and some advanced constructs. We will take a look
    at if-else and switch . 11.1.1 If-Else construct The If-Else construct is used
    to execute a block of code if a given condition is true and optionally execute
    a different block of code if the given condition is false . Let us begin with
    a simple if block. General syntax: if (<condition>) { /\*Statements to be executed
    if <condition> is true\*/ } Example: if (num == 0) { fmt.Println(“num is 0”) }
    An if statement should be given a condition to evaluate marked by <condition>
    in the above code snippet. This condition is usually a boolean expression which
    can evaluate to either true or false . If it evaluates to true , the statements
    inside the if-block (the block of code present within curly brackets after the
    if statement ) will be executed. If it evaluates to false , the if block will
    be skipped and the program will resume execution from after the if-block . Note:
    The condition can be a simple boolean expression such as (a == 0) or a combination
    of many boolean expressions using logical operators such as (a != 0) && (b > 1)
    . Let us write a simple program which demonstrates the usage of an if statement:
    /\*If Demo\*/ /\*Package Declaration\*/ package main /\*Import Statement - import
    fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/ func main () { ​
    var a int \= 20 ​ fmt . Printf ( "\\nProgram execution begins. This statement
    is before the if block.\\n" ) ​ /\*Check if a is greater than 10\*/ ​ if ( a >
    10 ) { ​ fmt . Printf ( "\\nInside if block.\\n%d is greater than 10.\\n" , a
    ) ​ } ​ fmt . Printf ( "\\nOutside if block. Program coming to an end.\\n" ) }
    Output: ![](Image00041.jpg)In this example, we had set a condition which evaluates
    to true and the if-block executes. Let us change the code, modify if ( a > 10
    ) to if ( a < 10 ) and see what happens: Output: ![](Image00042.jpg)As seen, the
    statements inside the if block do not get executed when the given condition evaluates
    to false . It is possible to execute a different block of code when the given
    condition evaluates to false using an else block . The else block should immediately
    follow the if block . General syntax: if (<condition>) { /\*Statements to be executed
    if <condition> is true\*/ } else { /\*Statements to be executed if <condition>
    is false\*/ } Example: if (num == 0) { ​ ​ fmt.Println(“num is 0”) } else { ​
    ​ fmt.Println(“num is NOT 0”) } The working of if-else  construct is simple –
    if the condition evaluates to true , the if block will be executed and the else
    block will be skipped and if it evaluates to false , the if block will be skipped
    and the else block will be executed. Let us write a program using if and else
    blocks and see what happens when the given condition of the if block evaluates
    to false . /\*If Else Demo\*/ /\*Package Declaration\*/ package main /\*Import
    Statement - import fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/
    func main () { ​ var a int \= 5 ​ fmt . Printf ( "\\nProgram execution begins.
    This statement is before the if block.\\n" ) ​ /\*Check if a is greater than 10\*/
    ​ if ( a > 10 ) { ​ ​ fmt . Printf ( "\\nInside if block.\\n%d is greater than
    10.\\n" , a ) ​ } else { ​ ​ fmt . Printf ( "\\nInside else block.\\n%d is NOT
    greater than 10.\\n" , a ) ​ } ​ fmt . Printf ( "\\nOutside if/else blocks. Program
    coming to an end.\\n" ) } Output: ![](Image00043.jpg)As seen, the condition (a
    > 10) evaluates to false as a is 5 . As a result, the if block gets skipped and
    the else block gets executed. One if-else block combination will check for the
    validity of one condition. Depending on what the given condition evaluates to,
    either if or else block will get executed. If you want to check for more than
    one conditions, you can nest if-else blocks within if-else blocks like this: if
    (<condition 1>) { ​ ​ /\*Statements to be executed if <condition 1> is true\*/
    ​ ​ if (<condition 2>) { ​ ​ /\*Statements to be executed if <condition 1> and
    <condition 2> are true\*/ ​ ​ } else { ​ ​ /\*Statements to be executed if <condition
    1> is true and <condition 2> is false\*/ ​ ​ } } else { ​ ​ /\*Statements to be
    executed if <condition 1> is false\*/ ​ ​ if (<condition 3>) { ​ ​ /\*Statements
    to be executed if <condition 1> is false and <condition 3> is true\*/ ​ ​ } else
    { ​ ​ /\*Statements to be executed if <condition 1> and <condition 3> is false\*/
    ​ ​ } } Another way of checking for multiple conditions is by using else-if blocks
    . There will be a mandatory if-block and an optional else-block . Between these
    blocks, you can have as many else-if blocks as you want where each else-if statement
    will have its own condition. This way you can check for as many conditions as
    you want. Here is a general syntax: if ( <condition 1>) { ​ ​ /\* This block will
    be executed if <condition 1> is true. \*/ } else if ( <condition 2> ) { /\*This
    block will be executed if <condition 1> is false <condition 2> is true \*/ } else
    if ( <condition 3> ) { /\*This block will be executed if <condition 1> and <condition
    2> are false and <condition 3> is true.\*/ } else { ​ ​ /\*This block will be
    executed if <condition 1>, <condition 2> and                                                         <condition
    3> are  false.\*/ } When there is a combination of if-else if-else blocks, what
    happens is – the condition of the if statement will be checked. If that condition
    evaluates to true , the if block will be executed and that will be end of the
    story! All the remaining blocks will be skipped . However, if the condition evaluates
    to false , the execution control will jump to the else if statement that follows
    and its condition will be checked. If it evaluates to true , that particular else
    if block will be executed and rest of the blocks will be skipped. If its condition
    evaluates to false , the control will jump to the next else-if block (if present)
    and that block’s condition will be checked. This process will continue until either
    a valid condition is found or there are no more else-if blocks left. If none of
    the conditions evaluate to true , the else block (if present) will be evaluated.
    Let us write a Go program to check if a given number is positive, negative or
    zero: /\*Positive Negative Zero \*/ /\*Package Declaration\*/ package main /\*Import
    Statement - import fmt and strconv package\*/ import ( ​ ​ "fmt" ​ ​ "strconv"
    ​ ​ ) /\*Mandatory main function\*/ func main () { ​ /\*Declare variable to store
    input\*/ ​ ​ var num\_str string ​ fmt . Printf ( "\\nEnter a number: " ) ​ /\*Read
    user input using Scanln function\*/ ​ fmt . Scanln (& num\_str ) ​ /\*Convert
    num\_str to integer\*/ ​ num , err := strconv . Atoi ( num\_str ) ​ /\*Assign
    err to blank identifiers\*/ ​ \_ \= err ​ /\*Check if num > 0\*/ ​ if ( num >
    0 ) { ​ ​ fmt . Printf ( "\\n%d is positive.\\n" , num ) ​ } else if ( num < 0
    ) { ​ ​ fmt . Printf ( "\\n%d is negative.\\n" , num  ) ​ } else { ​ ​ fmt . Printf
    ( "\\n%d is zero.\\n" , num ) ​ } } Output: ![](Image00044.jpg)11.1.2 Switch-Case
    construct We have seen how to check for the validity of multiple conditions using
    multiple else if blocks. The switch-case construct provides even better better
    way of handling multiple conditions. There are multiple ways of writing a switch-case
    construct and we will take a look at a few important ones. Let us start with the
    basic format: switch (<expression>) { ​ ​ case <constant expression 1>: ​ ​ /\*Statements
    to be executed if <expression> matches <constant expression 1>\*/ ​ ​ case <constant
    expression 2>: ​ ​ /\*Statements to be executed if <expression> matches <constant
    expression 2>\*/ ​ ​ case <constant expression 3>: ​ ​ /\*Statements to be executed
    if <expression> matches <constant expression 3>\*/ ​ ​ ... ​ ​ case <constant
    expression n>: ​ ​  /\*Statements to be executed if <expression> matches <constant
    expression n>\*/ ​ ​ default: ​ ​ /\*Statements to be executed if <expression>
    finds no match\*/ } In this syntax of switch-case construct, the switch statement
    is given an expression to work with – marked by <expression> in the above code
    snippet. An expression can be something as simple as a variable. Inside the switch
    block, there are multiple case blocks where each case statement has a constant
    expression. When the switch statement is encountered, its expression is evaluated.
    The resulting value will be checked against the constant expressions of case blocks.
    If the resulting value matches one of the constant expressions, that particular
    case block is executed. This process is known as testing for cases . If the values
    does not match any of the constant expressions, the default case block (if present)
    is executed. Here is a simple switch-case demo: /\*Switch Demo 1\*/ /\*Package
    Declaration\*/ package main /\*Import Statement - import fmt package\*/ import
    ( "fmt" ) /\*Mandatory main function\*/ func main () { ​ /\*Create a variable
    for switch\*/ ​ Option := 3 ​ /\*Switch Option, where Option is int variable assigned
    to 3\*/ ​ switch ( Option ) { ​ ​ /\*Various cases to match Option\*/ ​ ​ case
    1 : ​ ​ fmt . Printf ( "\\nOption is 1.\\n" ) ​ ​ case 2 : ​ ​ fmt . Printf (
    "\\nOption is 2.\\n" ) ​ ​ case 3 : ​ ​ fmt . Printf ( "\\nOption is 3.\\n" )
    ​ ​ /\*Default case incase there is no match\*/ ​ ​ default : ​ ​ fmt . Printf
    ( "\\nOption does not match any of the cases.\\n" ) ​  } } Output: ![](Image00045.jpg)In
    the above program, there are 3 cases and the variable Option is used to switch.
    This variable has been assigned to 3, let us change Option to 1 and 9 and see
    what happens: Output (Option = 1): ![](Image00046.jpg)Output (Option = 9): ![](Image00047.jpg)The
    variable used to switch can also be set in the switch statement itself as follows:
    switch <optional statement, set variable> (<variable/expression>) { ​ ​ case <constant
    expression 1>: ​ ​ /\*Statements to be executed if <expression> matches <constant
    expression 1>\*/ ​ ​ ... ​ ​ case <constant expression n>: ​ ​ /\*Statements to
    be executed if <expression> matches <constant expression n>\*/ ​ ​  default: ​
    ​ /\*Statements to be executed if <expression> finds no match\*/ } Let us re-write
    the previous program and set Option to 2 in the switch statement itself: /\*Switch
    Demo 1\*/ /\*Package Declaration\*/ package main /\*Import Statement - import
    fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/ func main () { ​
    /\*Switch Option, where Option is int variable short-declared and assigned to
    2\*/ ​ switch Option := 2 ​ ( Option ) { ​ ​ /\*Various cases to match Option\*/
    ​ ​ case 1 : ​ ​ fmt . Printf ( "\\nOption is 1.\\n" ) ​ ​ case 2 : ​ ​ fmt .
    Printf ( "\\nOption is 2.\\n" ) ​ ​ case 3 : ​ ​ fmt . Printf ( "\\nOption is
    3.\\n" ) ​ ​ /\*Default case incase there is no match\*/ ​ ​ default : ​ ​ fmt
    . Printf ( "\\nOption does not match any of the cases.\\n" ) ​ } } Output: ![](Image00048.jpg)Another
    way of writing a switch-case construct is by using boolean expressions for each
    case statement as follows: switch { ​ ​  case <boolean expression 1>: ​ ​ /\*Statements
    to be executed <boolean expression 1> evaluates to true \*/ ​ ​ case <boolean
    expression 2>: ​ ​ /\*Statements to be executed <boolean expression 2> evaluates
    to true \*/ ​ ​ case <boolean expression 3>: ​ ​ /\*Statements to be executed
    <boolean expression 3> evaluates to true \*/ ​ ​ ... ​ ​ case <boolean expression
    n>: ​ ​ /\*Statements to be executed <boolean expression n> evaluates to true
    \*/ ​ ​ default: ​ ​ /\*Statements to be executed if all boolean expressions are
    false \*/ } Let us write a program to read a number from the user and check whether
    it is odd or even. We will use the switch-case syntax from the above code snippet:
    /\*Switch Demo 2 -- Odd or Even\*/ /\*Package Declaration\*/ package main /\*Import
    Statement - import fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/
    func main () { ​ /\*Declare a variable to store a number\*/ ​ var num int ​ /\*Prompt
    the user to enter a number and read using scanf\*/ ​ fmt . Printf ( "\\nEnter
    a number: " ) ​ fmt . Scanf ( "%d" , & num ) ​ /\*Switch num % 2\*/ ​ switch {
    ​ ​ /\*Various cases for each outcome\*/ ​ ​ /\*If the remainder is zero, the
    number is even\*/ ​ ​ case ( num % 2 ) \== 0 : ​ ​ fmt . Printf ( "\\n%d is even.\\n"
    , num ) ​ ​ /\*If the remainder is one, the number is odd\*/ ​ ​ case ( num %
    2 ) \== 1 : ​ ​ fmt . Printf ( "\\n%d is odd.\\n" , num  ) ​ ​ } } Output: ![](Image00049.jpg)A
    switch-case construct can be used to switch using a variable of any basic data
    type, does not have to be a number. Let us write a program to ask the user to
    enter the name of a month and determine its serial number: /\*Switch Demo 3\*/
    /\*Package Declaration\*/ package main /\*Import Statement - import fmt package\*/
    import ( "fmt" ) /\*Mandatory main function\*/ func main () { ​ /\*Declare a variable
    to store the name of the month\*/ ​ var month string ​ /\*Prompt the user to enter
    the name of a month and read using scanf\*/ ​ fmt . Printf ( "\\nEnter month:
