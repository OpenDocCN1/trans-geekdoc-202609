    ```\n\nLet us combine whatever we have learnt and write a program to print “Hello\
    \ World!” on the console:\n\n```\n/*Package Declaration Statement*/\npackage main\n\
    \n/*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n    /*Print Hello World! using fmt.Printf function*/\n\
    \    fmt.Printf(\"Hello World!\")\n}\n```\n\n**Output:**\n\n![](Image00017.jpg)\n\
    \nLet us try the same program in Go Playground:\n\n![](Image00018.jpg)\n\nYou\
    \ can alternatively use the `Println` function from the same `fmt` package. This\
    \ function inserts a new line at the end of the printed screen. General Syntax:\n\
    \n```\nfmt.Println(<string>)\n```\n\nExample:\n\n```\nfmt.Println(“Just another\
    \ string…”)\n```\n\nHere is the modified Hello World! program using `Println`\
    \ function:\n\n```\n/*Package Declaration Statement*/\npackage main\n\n/*Import\
    \ statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main function*/\n\
    func main() {\n    /*Print Hello World! using fmt.Println function*/\n    fmt.Println(\"\
    Hello World!\")\n}\n```\n\n**Output:**\n\n![](Image00019.jpg)\n\nAs seen, there\
    \ is an extra line of space left after printing Hello World. If you want to insert\
    \ a new line anywhere in the string, you can use the escape character sequence\
    \ `\\n` inside the string. This will work with `Printf` as well as `Println` functions.\
    \ Here is an example:\n\n```\n/*Package Declaration Statement*/\npackage main\n\
    \n/*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n    /*Print Hello World! using fmt.Printf function*/\n\
    \    fmt.Printf(\"\\nHello \\nWorld!\\n\")\n}\n```\n\n**Output:**\n\n![](Image00020.jpg)\n\
    \nThere are many more escape character sequences. Another useful one is `\\t`\
    \ which will insert one tab-space in the output string. This will again work with\
    \ `Printf` and `Println` functions. Here is an example:\n\n```\n/*Package Declaration\
    \ Statement*/\npackage main\n\n/*Import statement, import fmt package*/\nimport\
    \ \"fmt\"\n\n/*Mandatory main function*/\nfunc main() {\n    /*Print Hello World!\
    \ using fmt.Println function*/\n    fmt.Println(\"\\nHello\\tWorld!\")\n}\n```\n\
    \n**Output:**\n\n![](Image00021.jpg)\n\nThis is the chapter where we learned to\
    \ build a meaningful console application which prints text on the screen. In almost\
    \ every subsequent program, we will be printing something or the other on the\
    \ console and hence you should know your way around `Printf` and `Println` functions\
    \ really well. It is a good idea to play around with these functions and try to\
    \ display different strings.\n"
  trans: "\n# 4. 语法\n\n既然我们已经知道如何编译和执行程序，现在让我们开始学习 Go 语言的实际编程概念。Go 是一门**大小写敏感**的语言。我们可能会说\
    \ “programming”、“Programming” 和 “PROGRAMMING” 是同一个词，但 Go 编译器会将它们视为完全不同的标识符。\n\n\
    ## 4.1 语句\n\n语句用于执行一项任务或一组任务的组合。它可以由任何内容组成，例如运算符、函数调用、变量赋值等。简单来说，语句就是一行执行一条或多条指令的代码，例如在屏幕上打印内容、执行算术运算、从文件读取数据等。在\
    \ Go 中，一条语句占据一行。以下是几个语句的示例：\n\n```\nfmt.Printf (“Hello”)\nvar x int = 51\nmsg\
    \ = “Go book”\n```\n\n## 4.2 注释\n\n注释用于标记或解释一段代码。编译器会忽略注释，它们对程序的执行**没有任何影响**。因此，注释仅与我们人类相关。注释以\
    \ `/*` 字符序列开始，以 `*/` 字符序列结束。以下是几个示例：\n\n```\n/*This is a comment*/\n/* You can\
    \ have any text within this character sequences */\n```\n\n本书包含多个编程示例。每个程序都包含注释，解释特定代码段的功能。每当你在本书中看到程序时，请务必仔细阅读注释。\n\
    \n## 4.3 标识符\n\n标识符是赋给变量、类、对象、函数或其他任何可识别实体的名称。标识符名称可以包含字母数字字符，但第一个字符必须是字母。唯一允许的特殊字符是下划线（`_`）。\n\
    \n## 4.4 关键字\n\n关键字是保留字，**不能**用作标识符名称。以下是 Go 语言的关键字列表：\n\n| break | default |\
    \ func | interface | select |\n| :--- | :--- | :--- | :--- | :--- |\n| case |\
    \ defer | go | map | struct |\n| chan | else | goto | package | switch |\n| const\
    \ | fallthrough | if | range | type |\n| continue | for | import | return | var\
    \ |\n\n## 4.5 记号\n\n记号是程序中任何有意义的项。关键字、标识符、常量、符号、字符串字面量等都可以称为记号。\n\n## 4.6 基本程序构成要素\n\
    \n一个最基础的 Go 程序应包含以下构成要素：\n\n### 包声明\n\nGo 将系统中的源文件组织为包。Go 程序可用于构建库，也可用于构建独立应用程序。独立应用程序是指能自行执行的程序，而库无法自行执行，必须在其他应用程序中使用。在本书中，我们将主要构建独立应用程序。独立应用程序的包名应为\
    \ `main`。这会告诉编译器，当前处理的 Go 程序应构建为独立应用程序，而非库。包声明语句的写法如下：\n\n```\npackage <package\
    \ name>\n```\n\n示例：\n\n```\npackage main\n```\n\n### 导入包\n\n包是预构建的库，可执行各种任务。Go\
    \ 为不同用途提供了丰富的包集合。以下是导入包的通用语法：\n\n```\nimport (\n    <package 1>\n    <package\
    \ 2>\n    <package 3>\n    ...\n    <package n>\n)\n```\n\n对于处理格式化 I/O 操作，使用 `fmt`\
    \ 包。如果你想编写一个在控制台打印内容的程序，这被视为格式化输出操作。你可以按如下方式导入 `fmt` 包：\n\n```\nimport (\"fmt\"\
    )\n```\n\n### 主函数\n\n主函数作为程序的**入口点**。程序将从主函数内的第一条语句开始执行。以下是编写主函数的方式：\n\n```\n\
    func main() {\n    /*Statements Here*/\n}\n```\n\n让我们将这些程序构成要素结合起来，编写一个能构建但不执行任何操作的\
    \ Go 程序。它将包含包声明语句和一个空的主函数。我们不会包含导入 `fmt` 语句，因为我们不打算执行任何 I/O 操作：\n\n```\n/*Package\
    \ Declaration Statement*/\npackage main\n\n/*Mandatory main function*/\nfunc main()\
    \ {\n}\n```\n\n**编译并执行：**\n\n![](img/Image00016.jpg)\n\n如图所示，程序构建并成功运行。控制台上没有发生任何显著事件，因为我们在程序内部没有做任何事情。程序从空的主函数开始执行。\n\
    \n# 5. Hello World! Go 程序\n\n在上一章中，我们了解了独立 Go 程序的基本构成要素。我们还学习了如何编写一个能构建和执行但不执行任何操作的基础\
    \ Go 程序。在本章中，我们将编写一个在控制台打印内容的程序。在控制台打印内容被视为**输出操作**。我们将使用 `fmt` 包中的 `Printf` 函数。可以通过\
    \ `fmt.Printf` 访问它。使用该函数的通用语法是：\n\n```\nfmt.Printf(<string>)\n```\n\n`Printf`\
    \ 函数需要一个要打印的字符串。字符串是字符序列。向该函数提供字符串时，字符序列应包含在双引号内。该函数实际上接受格式化字符串，但为求简单，我们暂时只关注普通字符串，稍后再讨论格式化字符串。如果你想在控制台打印内容，`fmt.Printf`\
    \ 语句看起来会像这样：\n\n```\nfmt.Printf(“Let us print something”)\n```\n\n让我们结合所学知识，编写一个在控制台打印\
    \ “Hello World!” 的程序：\n\n```\n/*Package Declaration Statement*/\npackage main\n\
    \n/*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n    /*Print Hello World! using fmt.Printf function*/\n\
    \    fmt.Printf(\"Hello World!\")\n}\n```\n\n**输出：**\n\n![](img/Image00017.jpg)\n\
    \n让我们在 Go Playground 中尝试相同的程序：\n\n![](img/Image00018.jpg)\n\n你也可以使用同属 `fmt` 包的\
    \ `Println` 函数。该函数会在打印内容的末尾插入一个新行。通用语法：\n\n```\nfmt.Println(<string>)\n```\n\n\
    示例：\n\n```\nfmt.Println(“Just another string…”)\n```\n\n以下是使用 `Println` 函数的修改版\
    \ Hello World! 程序：\n\n```\n/*Package Declaration Statement*/\npackage main\n\n\
    /*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main function*/\n\
    func main() {\n    /*Print Hello World! using fmt.Println function*/\n    fmt.Println(\"\
    Hello World!\")\n}\n```\n\n**输出：**\n\n![](img/Image00019.jpg)\n\n如图所示，打印 Hello\
    \ World 后留出了一行额外的空行。如果你想在字符串的任意位置插入新行，可以在字符串内使用转义字符序列 `\\n`。这对 `Printf` 和 `Println`\
    \ 函数均有效。示例如下：\n\n```\n/*Package Declaration Statement*/\npackage main\n\n/*Import\
    \ statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main function*/\n\
    func main() {\n    /*Print Hello World! using fmt.Printf function*/\n    fmt.Printf(\"\
    \\nHello \\nWorld!\\n\")\n}\n```\n\n**输出：**\n\n![](img/Image00020.jpg)\n\n还有许多其他的转义字符序列。另一个有用的是\
    \ `\\t`，它会在输出字符串中插入一个制表符空格。这同样适用于 `Printf` 和 `Println` 函数。示例如下：\n\n```\n/*Package\
    \ Declaration Statement*/\npackage main\n\n/*Import statement, import fmt package*/\n\
    import \"fmt\"\n\n/*Mandatory main function*/\nfunc main() {\n    /*Print Hello\
    \ World! using fmt.Println function*/\n    fmt.Println(\"\\nHello\\tWorld!\")\n\
    }\n```\n\n**输出：**\n\n![](img/Image00021.jpg)\n\n本章我们学习了如何构建一个有意义的控制台应用程序，在屏幕上打印文本。在几乎所有后续程序中，我们都会在控制台打印各种内容，因此你应该非常熟练地掌握\
    \ `Printf` 和 `Println` 函数的用法。建议多尝试这些函数，尝试显示不同的字符串。\n"
