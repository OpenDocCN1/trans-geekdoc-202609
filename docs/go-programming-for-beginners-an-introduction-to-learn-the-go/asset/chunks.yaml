- raw: "8\\. Output Formatting In the previous section, we learned to use Println\
    \ function to print variables. This function automatically leaves one line at\
    \ the end, leaves a space between items when multiple items are printed. There\
    \ is not much control although it does a good enough job if your objective is\
    \ to simply print variables. For proper output formatting, we can use Printf function\
    \ from the fmt package. This gives a much better control over the output; you\
    \ will see why in a while. The Printf function accepts a formatted string as an\
    \ argument. A formatted string is made up of string literals and format specifiers\
    \ called verbs . A verb is a character sequence which starts with a percentage\
    \ (%) symbol . Different verbs are used for different data types. For example,\
    \ for strings %s is used, for integers %d is used, etc. If a formatted string\
    \ is given to a Printf function, variables, constants or expressions must also\
    \ be given as arguments following the formatted string. At the time of printing,\
    \ verbs will be substituted by the corresponding variables, constants or values\
    \ resulting from the evaluation of a given expression. General syntax: fmt.Printf\
    \ (<formatted string>, <variables/constants/expressions>) Example: fmt.Printf\
    \ (“Name: %s, Number: %d”, name, num) In the above example, first verb %s will\
    \ be substituted by the value of name and second verb %d will be substituted by\
    \ the value of num in the output. The following illustration will make things\
    \ clearer. ![](Image00023.jpg)Consider the following program: package main import\
    \ \"fmt\" func main () { ​ /\\*Initialize string variables\\*/ ​ var first\\_name\
    \ , last\\_name , city string \\= \"Samantha\" , \"Hudson\" , \"Denver\" ​ /\\\
    *Initialize integer variable\\*/ ​ var age int \\= 33 ​ fmt . Printf ( \"\\\\\
    nFirst Name: %s \\\\nLast Name: %s \\\\nAge: %d \\\\nCity: %s \\\\n\" , first\\\
    _name , last\\_name , age , city ) } Output: ![](Image00024.jpg)Go offers many\
    \ verbs, here are a few important ones: \n\n| Verb  || Description  |\n\n| ---\
    \ | --- |\n\n| %v  || Value in default format  |\n\n| %T  || Data type of the\
    \ value  |\n\n| %t  || Boolean values – true or false  |\n\n| %d  || Integers\
    \  |\n\n| %b  || Binary (Base 2)  |\n\n| %o  || Octal (Base 8)  |\n\n| %O  ||\
    \ Octal (Base 8) with 0o  prefix  |\n\n| %x  || Hexadecimal (Base 16) with (a-f)\
    \ in lower case  |\n\n| %X  || Hexadecimal (Base 16) with (A-F) in upper case\
    \  |\n\n| %c  || Character  |\n\n| %f  || Floating point value with no exponent\
    \  |\n\n| %F  || Same as %f  |\n\n| %e  || Scientific notation – floating point\
    \ with exponent. e will be in lower case  |\n\n| %E  || Scientific notation –\
    \ floating point with exponent. E will be in lower case  |\n\n| %s  || String\
    \  |\n\n| %p  || Pointer  |\n\nHere is a Go program that makes use of different\
    \ verbs for different data types: package main import \"fmt\" func main () { ​\
    \ /\\*Declare and initialize a few variables\\*/ ​ var x , y , z \\= 75 , \\-6\
    \ . 872 , 3 + 2i ​ var flag \\= true ​ msg := \"Go Programming\" ​ /\\*Print various\
    \ things using Printf\\*/ ​ fmt . Printf ( \"\\\\nx = %v Type: %T\" , x , x )\
    \ ​ fmt . Printf ( \"\\\\nx (decimal): %d\\\\nx (binary): %b\\\\nx (octal): %O\\\
    \\nx (hexadecimal): %X\" , x , x , x , x ) ​ fmt . Printf ( \"\\\\ny = %f Type:\
    \ %T \\\\nz = %f Type: %T\" , y , y , z , z ) ​ fmt . Printf ( \"\\\\nflag = %t\
    \ Type: %T\" , flag , flag ) ​ fmt . Printf ( \"\\\\nmsg = %s Type: %T\\\\n\"\
    \ , msg , msg ) } Output: ![](Image00025.jpg)Note: \n\n*   The number of verbs\
    \ inside a formatted string and the number of arguments following a formatted\
    \ string should be the same. \n\n*   Always use the correct verb according to\
    \ the data type of the value to be printed. When in doubt, use %v . \n\n9\\. Operators\
    \ An operator is a symbol or a group of symbols used to perform one or more operations.\
    \ Go offers arithmetic operators, relational operators, logical operators, bitwise\
    \ operators and assignment operators. Let us take a look at each category of operators.\
    \ 9.1 Arithmetic Operators An arithmetic operator as the name suggests is used\
    \ to perform arithmetic operations such as addition, subtractions, etc. \n\n|\
