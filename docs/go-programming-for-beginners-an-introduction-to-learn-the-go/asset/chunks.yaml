- raw: "6\\. Data Types A data type is used to categorize data. For example, a string\
    \ is one type of data; a number is another type of data. Go offers 3 basic data\
    \ types – Boolean, Numeric and Strings . Let us take a look at each one of these\
    \ categories: 6.1 Boolean Data Type A Boolean data type can only have two values\
    \ – true and false . These are heavily used in decision making and control structures.\
    \ This data type is referred to as bool programmatically. 6.2 Numeric Data Types\
    \ Numeric data types are used to deal with different kinds of numbers. This category\
    \ can be divided further into 3 sub categories – Integers, Floats and Complex\
    \ . 6.2.1 Integers Integer data types as the name suggests are used to deal with\
    \ integers. Go supports signed as well as unsigned integers of varying sizes.\
    \ Here is a list: \n\n| Data Type  || Description  |\n\n| --- | --- |\n\n| int\
    \  || Signed integer, size depends on the system (32-bit or 64-bit)  |\n\n| uint\
    \  || Unsigned integer, size depends on the system (32-bit or 64-bit)  |\n\n|\
    \ int8  || 8-bit signed integer  |\n\n| int16  || 16-bit signed integer  |\n\n\
    | int32  || 32-bit signed integer  |\n\n| int64  || 64-bit signed integer  |\n\
    \n| uint8  || 8-bit unsigned integer  |\n\n| uint16  || 16-bit unsigned integer\
    \  |\n\n| uint32  || 32-bit unsigned integer  |\n\n| uint64  || 64-bit unsigned\
    \ integer  |\n\n| rune  || Same as unit32. Used for Unicode characters.  |\n\n\
    | byte  || Same as int8. A byte is an 8-bit wide data.  |\n\n| uintptr  || Unsigned\
    \ integer used to store pointers to integers of all types.  |\n\nNote: If you\
    \ simply need a data type for integer, you should either use int or uint  . The\
    \ size will be decided depending on what kind of system you use. If you use a\
    \ 32-bit system, the size will be 32-bits and for 64-bit systems, the size will\
    \ be 64-bits. If you are specific with the size requirements of the data you are\
    \ dealing with, you can use the data type of appropriate size. 6.2.2 Floats This\
    \ sub-category of numeric data types is used for floating point values. \n\n|\
    \ Data Type  || Description  |\n\n| --- | --- |\n\n| float32  || 32-bit IEEE 754\
    \ floating-point number  |\n\n| float64  || 64-bit IEEE 754 floating-point number\
    \  |\n\n6.2.3 Complex Complex data types are used to deal with complex numbers\
    \ having real and imaginary parts. \n\n| Data Type  || Description  |\n\n| ---\
    \ | --- |\n\n| complex64  || 64-bit Complex Number having float32 (32-bit) type\
    \ real and imaginary parts. Two 32-bit float32 types add up to 64-bits in total.\
    \  |\n\n| complex128  || 128-bit Complex Number having float64 (64-bit) type real\
    \ and imaginary parts. Two 64-bit float64 types add up to 128-bits in total. \
    \ |\n\n6.3 String Data Type A string data type is used to deal with string values.\
    \ A string is a  sequence of characters. Programmatically, this data type is referred\
    \ to as string in Go. We have already seen how to print a string using Printf\
    \ and Println functions. More details will be covered in the next chapter. 6.4\
    \ Other Data Types Apart from the 3 basic data types, Go offers some more data\
    \ types which include – Aggregate data types and Reference data types. These categories\
    \ of data types are covered in the relevant chapters of this book. "
