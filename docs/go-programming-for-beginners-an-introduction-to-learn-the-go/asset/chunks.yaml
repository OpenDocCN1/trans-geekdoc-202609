- raw: '15\. Pointers When a variable is declared, it is allotted some memory region
    to store its content. This memory region has a uniquely identifiable address.
    Pointers are special kind of variables that are used to store addresses of other
    variables . An important thing to note here is that a pointer can store the memory
    address of a variable of the same data type. For example, an integer pointer will
    store the memory address of an integer variable; a string pointer cannot store
    the memory address of a floating point variable. A pointer variable is declared
    using the following syntax: var <pointer variable> \*<data type> Examples: /\*Integer
    pointer\*/ var ptr \*int /\*String pointers\*/ var sptr1, sptr2 \*string /\*Floating
    point pointer\*/ var p \*float64 The memory address of a variable can be fetched
    by prefixing ampersand (&) symbol to it. This address can be assigned only to
    pointer variables of the same data type. Here is how you would do it: var name
    string = “Jason” var sptr \*string sptr = &name /\*Short declare a pointer\*/
    var address string = “NY” add\_ptr := &address /\*Declare and initialize pointers\*/
    var a, b int var aptr, bptr \*int = &a, &b When a pointer is holding the address
    of a variable, it is said that the pointer variable is “pointing to” that variable.
    Let us write a program to create a few variables and create the appropriate number
    of pointers pointing to these variables: /\*Pointers Demo 1\*/ /\*Package Declaration\*/
    package main /\*Import Statement - import fmt package\*/ import ( "fmt" ) /\*Mandatory
    main function\*/ func main () { ​ /\*Declare and initialize a string\*/ ​ var
    name string \= "Shaun" ​ /\*Declare a string pointer\*/ ​ var name\_ptr \* string
    ​ /\*Assign the address of name to name\_ptr\*/ ​ name\_ptr \= & name ​ /\*Short
    declare and initialize int variable\*/ ​ age := 19 ​ /\*Short declare and initialize
    integer pointer\*/ ​ aptr := & age ​ /\*Declare and initialize float variables\*/
    ​ var height , weight float32 \= 182 . 36534 , 165 . 75124 ​ /\*Declare and initialize
    pointer variables pointer variables\*/ ​ var hptr , wptr \* float32 \= & height
    , & weight ​ /\*Print everything\*/ ​ fmt . Printf ( "\\nname = %s\\nname\_ptr
    (address of name var) = %v\\n" , name , name\_ptr ) ​ fmt . Printf ( "\\nage =
    %d\\natpr (address of age var) = %v\\n" , age , aptr ) ​ fmt . Printf ( "\\nheight
    = %f\\nhtpr (address of height var) = %v\\n" , height , hptr ) ​ fmt . Printf
    ( "\\nweight = %f\\nwtpr (address of weight var) = %v\\n" , weight , wptr ) }
    Output: ![](Image00079.jpg)In this program, we have just displayed the contents
    of the variables and their memory addresses. It probably does not make sense to
    you at this point. You could be asking – what am I suppose to do with the memory
    address of a variable? Well, we are coming to that. We can dereference  pointers
    to directly access the value stored at a memory address that the pointer is pointing
    to. In order to dereference a pointer, asterisk (\*) symbol must be prefixed to
    the pointer variable. Here is a code snippet that explains this concept: var x
    int = 90 var ptr \*int = &x /\*Dereference ptr to access the value of x and assign
    it to y\*/ y := \*ptr The working of this snippet is explained in the following
    diagram: ![](Image00080.jpg)There is an integer variable x , initialized to 90
    . Let us say, that this variable is stored at memory address 0x00a3h . An integer
    pointer variable ptr is declared and the address of x is assigned to it using
    the statement var ptr \*int = &x . Now, ptr holds 0x00a3h . Next, we dereference
    ptr to access the value present at the memory address 0x00a3h (90) and copy it
    to another variable y (lets say y is at address 0x01b6h , but that is of no significance
    in this example). Dereferencing and copying is done using the statement y := \*ptr
    . In this example, we managed to copy the contents of one variable to another
    variable without touching the source variable. Let us understand this concept
    with the help of a Go program: /\*Pointers Demo 2\*/ /\*Package Declaration\*/
    package main /\*Import Statement - import fmt package\*/ import ( "fmt"  ) /\*Mandatory
    main function\*/ func main () { ​ /\*Declare and initialize a string\*/ ​ var
    name string \= "Anabelle" ​ /\*Declare a string pointer\*/ ​ var name\_ptr \*
    string ​ /\*Assign the address of name to name\_ptr\*/ ​ name\_ptr \= & name ​
    /\*Short declare and initialize int variable\*/ ​ age := 33 ​ /\*Short declare
    and initialize integer pointer\*/ ​ aptr := & age ​ /\*Print everything\*/ ​ fmt
    . Printf ( "\\nname = %s\\nname\_ptr = %v\\n\*name\_ptr = %s\\n" , name , name\_ptr
    , \* name\_ptr ) ​ fmt . Printf ( "\\nage = %d\\natpr = %v\\n\*aptr = %d\\n" ,
    age , aptr , \* aptr ) ​ /\*Modify values of name and age without touching name
    and age\*/ ​ \* name\_ptr \= "Diorah" ​ \* aptr \= 21 ​ fmt . Printf ( "\\nname
    = %s\\nname\_ptr = %v\\n\*name\_ptr = %s\\n" , name , name\_ptr , \* name\_ptr
    ) ​ fmt . Printf ( "\\nage = %d\\natpr = %v\\n\*aptr = %d\\n" , age , aptr , \*
    aptr ) } Output: ![](Image00081.jpg)As seen, there are two variables name and
    age which hold some arbitrary initial values. We change the contents of these
    variables by dereferencing pointers (name\_ptr and aptr ) which point to these
    variables. If you have understood the concept of variables and pointers  well,
    you may be wondering – a pointer is just another variable and it will have its
    own address. Yes, a pointer variable has its own address. You can have a pointer
    which is pointing to another pointer variable. In order to to that, the pointer
    which is pointing to another pointer will have to be declared as \*\*<data type>
    . Consider the following code snippet: var x int = 1050 var x\_ptr \*int = &x
    var x\_ptr\_ptr \*\*int = &xptr \*\*x\_ptr\_ptr = 7000 fmt.Println(x) There is
    an integer variable x which holds 1050 . A pointer variable x\_ptr is used to
    hold the address of x and another pointer variable x\_ptr\_ptr is used to hold
    the value of x\_ptr . Single dereferencing of xptr\_ptr as \*x\_ptr\_ptr will
    give us the value of x\_ptr which would be the address of x . Double dereferencing
    of x\_ptr\_ptr as \*\*x\_ptr\_ptr will give us the value of x . The statement
    \*\*x\_ptr\_ptr = 7000 will change the value of x to 7000 . Note: Pointers is
    an advanced topic heavily used in data structures, system level programming, embedded
    systems, etc. If this chapter confuses you, it is quite okay. You can go through
    the rest of the book without any issues. As a beginner, you just have to know
    what is a pointer and what does it do. '
  fmt: "\n# 15. Pointers\n\n当声明一个变量时，会为其分配一块内存区域来存储其内容。这块内存区域有一个唯一可识别的地址。指针是一种特殊的变量，用于存储其他变量的地址。这里需要注意的一个重要事项是：指针只能存储相同数据类型变量的内存地址。例如，整型指针将存储整型变量的内存地址；字符串指针不能存储浮点型变量的内存地址。\n\
    \n指针变量使用以下语法声明：\n\n```go\nvar <pointer variable> *<data type>\n```\n\n示例：\n\n\
    ```go\n/*Integer pointer*/\nvar ptr *int\n\n/*String pointers*/\nvar sptr1, sptr2\
    \ *string\n\n/*Floating point pointer*/\nvar p *float64\n```\n\n可以通过在变量名前加上 `&`\
    \ 符号来获取变量的内存地址。该地址只能赋值给相同数据类型的指针变量。具体操作如下：\n\n```go\nvar name string = \"Jason\"\
    \nvar sptr *string\nsptr = &name\n\n/*Short declare a pointer*/\nvar address string\
    \ = \"NY\"\nadd_ptr := &address\n\n/*Declare and initialize pointers*/\nvar a,\
    \ b int\nvar aptr, bptr *int = &a, &b\n```\n\n当指针持有某个变量的地址时，称该指针变量“指向”该变量。让我们编写一个程序来创建几个变量，并创建相应数量的指针指向这些变量：\n\
    \n```go\n/*Pointers Demo 1*/\n/*Package Declaration*/\npackage main\n\n/*Import\
    \ Statement - import fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n\t/*Declare and initialize a string*/\n\tvar name\
    \ string = \"Shaun\"\n\n\t/*Declare a string pointer*/\n\tvar name_ptr *string\n\
    \n\t/*Assign the address of name to name_ptr*/\n\tname_ptr = &name\n\n\t/*Short\
    \ declare and initialize int variable*/\n\tage := 19\n\n\t/*Short declare and\
    \ initialize integer pointer*/\n\taptr := &age\n\n\t/*Declare and initialize float\
    \ variables*/\n\tvar height, weight float32 = 182.36534, 165.75124\n\n\t/*Declare\
    \ and initialize pointer variables*/\n\tvar hptr, wptr *float32 = &height, &weight\n\
    \n\t/*Print everything*/\n\tfmt.Printf(\"\\nname = %s\\nname_ptr (address of name\
    \ var) = %v\\n\", name, name_ptr)\n\tfmt.Printf(\"\\nage = %d\\natpr (address\
    \ of age var) = %v\\n\", age, aptr)\n\tfmt.Printf(\"\\nheight = %f\\nhtpr (address\
    \ of height var) = %v\\n\", height, hptr)\n\tfmt.Printf(\"\\nweight = %f\\nwtpr\
    \ (address of weight var) = %v\\n\", weight, wptr)\n}\n```\n\n输出：\n![](Image00079.jpg)\n\
    \n在该程序中，我们仅显示了变量的内容及其内存地址。此时你可能还无法理解其意义。你可能会问——变量的内存地址有什么用？我们马上就会讲到。我们可以**解引用**指针，以直接访问指针指向的内存地址处存储的值。为了解引用指针，必须在指针变量前加上\
    \ `*` 符号。以下代码片段解释了这一概念：\n\n```go\nvar x int = 90\nvar ptr *int = &x\n/*Dereference\
    \ ptr to access the value of x and assign it to y*/\ny := *ptr\n```\n\n该片段的工作原理如下图所示：\n\
    ![](Image00080.jpg)\n\n存在一个整型变量 `x`，初始化为 `90`。假设该变量存储在内存地址 `0x00a3h` 处。声明一个整型指针变量\
    \ `ptr`，并使用语句 `var ptr *int = &x` 将 `x` 的地址赋值给它。现在 `ptr` 持有 `0x00a3h`。接着，我们解引用\
    \ `ptr` 以访问内存地址 `0x00a3h` 处的值（`90`）并将其复制给另一个变量 `y`（假设 `y` 在地址 `0x01b6h`，但这在本例中无关紧要）。解引用和复制通过语句\
    \ `y := *ptr` 完成。在本例中，我们在不接触源变量的情况下，成功将一个变量的内容复制到了另一个变量。\n\n让我们通过一个 Go 程序来理解这一概念：\n\
    \n```go\n/*Pointers Demo 2*/\n/*Package Declaration*/\npackage main\n\n/*Import\
    \ Statement - import fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main\
    \ function*/\nfunc main() {\n\t/*Declare and initialize a string*/\n\tvar name\
    \ string = \"Anabelle\"\n\n\t/*Declare a string pointer*/\n\tvar name_ptr *string\n\
    \n\t/*Assign the address of name to name_ptr*/\n\tname_ptr = &name\n\n\t/*Short\
    \ declare and initialize int variable*/\n\tage := 33\n\n\t/*Short declare and\
    \ initialize integer pointer*/\n\taptr := &age\n\n\t/*Print everything*/\n\tfmt.Printf(\"\
    \\nname = %s\\nname_ptr = %v\\n*name_ptr = %s\\n\", name, name_ptr, *name_ptr)\n\
    \tfmt.Printf(\"\\nage = %d\\natpr = %v\\n*aptr = %d\\n\", age, aptr, *aptr)\n\n\
    \t/*Modify values of name and age without touching name and age*/\n\t*name_ptr\
    \ = \"Diorah\"\n\t*aptr = 21\n\n\tfmt.Printf(\"\\nname = %s\\nname_ptr = %v\\\
    n*name_ptr = %s\\n\", name, name_ptr, *name_ptr)\n\tfmt.Printf(\"\\nage = %d\\\
    natpr = %v\\n*aptr = %d\\n\", age, aptr, *aptr)\n}\n```\n\n输出：\n![](Image00081.jpg)\n\
    \n如上所示，有两个变量 `name` 和 `age` 持有任意初始值。我们通过解引用指向这些变量的指针（`name_ptr` 和 `aptr`）来修改这些变量的内容。\n\
    \n如果你已经很好地理解了变量和指针的概念，你可能会想——指针只是另一个变量，它也有自己的地址。是的，指针变量有自己的地址。你可以拥有一个指向另一个指针变量的指针。为此，指向另一个指针的指针必须声明为\
    \ `**<data type>`。请看以下代码片段：\n\n```go\nvar x int = 1050\nvar x_ptr *int = &x\n\
    var x_ptr_ptr **int = &xptr\n**x_ptr_ptr = 7000\nfmt.Println(x)\n```\n\n存在一个整型变量\
    \ `x`，持有值 `1050`。指针变量 `x_ptr` 用于持有 `x` 的地址，另一个指针变量 `x_ptr_ptr` 用于持有 `x_ptr` 的值。对\
    \ `x_ptr_ptr` 进行单次解引用（`*x_ptr_ptr`）将得到 `x_ptr` 的值，即 `x` 的地址。对 `x_ptr_ptr` 进行双重解引用（`**x_ptr_ptr`）将得到\
    \ `x` 的值。语句 `**x_ptr_ptr = 7000` 将把 `x` 的值改为 `7000`。\n\n> **注意**：指针是一个高级主题，在数据结构、系统级编程、嵌入式系统等领域被大量使用。如果本章让你感到困惑，这很正常。你可以毫无问题地继续阅读本书的其余部分。作为初学者，你只需要知道什么是指针以及它有什么作用。\n"
