    index 6 is A which is 0x0A . If you cross check these HEX values in an ASCII table,
    you will realize that these characters are \\r and \\n respectively. Let us use
    the Trim function and see what happens. Here is the new program: /\*Trim demo\*/
    /\*Package Declaration\*/ package main /\*Import Statement - import fmt, bufio,
    os, strings package\*/ import ( ​ ​ "fmt" ​ ​ "bufio" ​ ​ "os" ​ ​ "strings" ​
    ​ ) /\*Mandatory main function\*/ func main () { ​ /\*Create an input reader variable
    of type NewReader using stdin\*/ ​ inputReader := bufio . NewReader ( os . Stdin
    ) ​ /\*Prompt the user to enter something\*/ ​ fmt . Printf ( "\\nEnter a string:
    " ) ​ /\*Read string using ReadString function\*/ str , \_ := inputReader . ReadString
    ( ''\\n'' ) ​ /\*Trim to remove unwanted characters\*/ ​ str \= strings . Trim
    ( str , "\\n\\r"  ) ​ str\_length := len ( str ) ​ fmt . Printf ( "\\nLength:
    %d" , str\_length ) ​ /\*Use rune to fetchs characters in an array\*/ ​ str\_char
    := \[\] rune ( str ) ​ fmt . Printf ( "\\n\\nCharacter array: \\n %c \\n" , str\_char
    ) ​ for i := 0 ; i < str\_length ; i ++ { ​ ​ fmt . Printf ( "\\nCharacter at
    index %d ==> %c\\n" , i , str\_char \[ i \]) ​ } } Output: ![](Image00077.jpg)14.5
    Case conversion A string can be converted to upper and lower case using the functions
    ToUpper and ToLower respectively. Syntax: <ustring> = strings.ToUpper(<string>)
