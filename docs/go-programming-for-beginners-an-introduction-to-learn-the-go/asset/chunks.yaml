    \n## 13.4 返回值\n\n函数可借助 `return` 语句向调用函数返回值。通用语法如下：\n\n```\nreturn <values>\n```\n\
    \n示例：\n\n```go\n/*Single value*/\nreturn name\n\n/*Multiple values*/\nreturn x,\
    \ y, z\n```\n\n调用返回值的函数时，必须指定变量接收返回值，否则将丢失。接收多个值时需指定多个变量，返回多值时将执行多重赋值。示例如下：\n\n\
    ```go\n/*Receive single value*/\nname = getName()\n\n/*Receive multiple values*/\n\
