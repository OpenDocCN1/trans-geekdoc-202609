  fmt: "\n# 8. Output Formatting\n\n在上一节中，我们学习了使用 `Println` 函数打印变量。该函数会在末尾自动换行，在打印多个项目时会在项目之间留出一个空格。虽然它对于简单打印变量已经足够好用，但控制能力不强。对于规范的输出格式化，我们可以使用\
    \ `fmt` 包中的 `Printf` 函数。这能提供对输出更好的控制；稍后你将了解原因。\n\n`Printf` 函数接受一个格式化字符串作为参数。格式化字符串由字符串字面量和称为\
    \ **verb（动词/格式动词）** 的格式说明符组成。Verb 是一个以百分号（`%`）开头的字符序列。不同的数据类型使用不同的 verb。例如，字符串使用\
    \ `%s`，整数使用 `%d` 等。如果将格式化字符串传给 `Printf` 函数，则必须在格式化字符串后跟上变量、常量或表达式作为参数。打印时，verb\
    \ 将被相应变量、常量或给定表达式求值的结果所替换。\n\n通用语法：\n```go\nfmt.Printf(<formatted string>, <variables/constants/expressions>)\n\
    ```\n\n示例：\n```go\nfmt.Printf(\"Name: %s, Number: %d\", name, num)\n```\n\n在上述示例中，第一个\
    \ verb `%s` 将被 `name` 的值替换，第二个 verb `%d` 将被 `num` 的值替换。\n\n下图将使事情更清晰：\n![](Image00023.jpg)\n\
    \n请看下面的程序：\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    /* Initialize\
    \ string variables */\n    var first_name, last_name, city string = \"Samantha\"\
    , \"Hudson\", \"Denver\"\n\n    /* Initialize integer variable */\n    var age\
    \ int = 33\n\n    fmt.Printf(\"\\nFirst Name: %s \\nLast Name: %s \\nAge: %d \\\
    nCity: %s \\n\", first_name, last_name, age, city)\n}\n```\n\n输出：\n![](Image00024.jpg)\n\
    \nGo 提供了许多 verb，以下是几个重要的：\n\n| Verb | Description |\n| --- | --- |\n| `%v` | Value\
    \ in default format |\n| `%T` | Data type of the value |\n| `%t` | Boolean values\
    \ – true or false |\n| `%d` | Integers |\n| `%b` | Binary (Base 2) |\n| `%o` |\
    \ Octal (Base 8) |\n| `%O` | Octal (Base 8) with 0o prefix |\n| `%x` | Hexadecimal\
    \ (Base 16) with (a-f) in lower case |\n| `%X` | Hexadecimal (Base 16) with (A-F)\
    \ in upper case |\n| `%c` | Character |\n| `%f` | Floating point value with no\
    \ exponent |\n| `%F` | Same as `%f` |\n| `%e` | Scientific notation – floating\
    \ point with exponent. e will be in lower case |\n| `%E` | Scientific notation\
    \ – floating point with exponent. E will be in upper case |\n| `%s` | String |\n\
    | `%p` | Pointer |\n\n下面是一个使用不同 verb 处理不同数据类型的 Go 程序：\n```go\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    /* Declare and initialize a few variables\
    \ */\n    var x, y, z = 75, -6.872, 3+2i\n    var flag = true\n    msg := \"Go\
    \ Programming\"\n\n    /* Print various things using Printf */\n    fmt.Printf(\"\
    \\nx = %v Type: %T\", x, x)\n    fmt.Printf(\"\\nx (decimal): %d\\nx (binary):\
    \ %b\\nx (octal): %O\\nx (hexadecimal): %X\", x, x, x, x)\n    fmt.Printf(\"\\\
    ny = %f Type: %T \\nz = %f Type: %T\", y, y, z, z)\n    fmt.Printf(\"\\nflag =\
    \ %t Type: %T\", flag, flag)\n    fmt.Printf(\"\\nmsg = %s Type: %T\\n\", msg,\
    \ msg)\n}\n```\n\n输出：\n![](Image00025.jpg)\n\n注意：\n\n*   格式化字符串内的 verb 数量与格式化字符串后跟随的参数数量必须相同。\n\
    *   始终根据要打印的值的数据类型使用正确的 verb。拿不准时，使用 `%v`。\n\n# 9. Operators\n\n运算符是用于执行一个或多个操作的符号或符号组。Go\
    \ 提供了算术运算符、关系运算符、逻辑运算符、位运算符和赋值运算符。让我们看看每一类运算符。\n\n## 9.1 Arithmetic Operators\n\
    \n顾名思义，算术运算符用于执行加法、减法等算术运算。\n\n| Operator | Description | Sample Usage | Explanation\
    \ |\n| --- | --- | --- | --- |\n| `+` | Addition | `x + y` | Performs arithmetic\
    \ addition, returns sum of the operands. |\n| `-` | Subtraction | `x - y` | Subtracts\
    \ operand on the right from the operand on the left and returns the difference.\
    \ |\n| `*` | Multiplication | `x * y` | Multiplies operands and returns the product.\
    \ |\n| `/` | Division | `x / y` | Performs division and returns the quotient.\
    \ |\n| `%` | Modulus | `x % y` | Performs division and returns the remainder.\
    \ Operands needs to be of integer type. |\n| `++` | Increment | `x++` | Increments\
    \ the value of the operand by 1. |\n| `--` | Decrement | `y--` | Decrements the\
    \ value of the operand by 1. |\n\n注意：\n\n*   当你用一个整数除以另一个整数时，除法运算符将返回一个整数商，即使从数学上讲它应该是一个浮点值。这本身不是问题，在某些情况下甚至很有用。但是，如果你想要商的浮点数版本，需要先使用\
    \ `float32(<operand>)` 或 `float64(<operand>)` 将操作数转换为 float。\n*   对于复数，自增/自减运算符仅作用于实部。\n\
    *   你可以使用多个变量和多个运算符构建多项式/表达式。甚至可以使用括号来优先执行特定操作。\n"
