- raw: '2\. Scope With Go language, you can build desktop applications, web applications,
    web services and much more. Google’s Go language compiler toolchain is available
    for Windows, macOS, Linux and other Unix-like operating systems. With that toolchain,
    you can build applications targeted for Windows/Unix-like operating systems-based
    desktops and servers, embedded platforms, WebAssembly, etc. At present, there
    is not a stable GUI development framework available for Go, most of them are made
    available using wrappers and are still under development. But this is under no
    circumstances a turn-off because Go can do a lot of things. Containerization tool
    Docker which is revolutionizing cloud computing and virtualization space is entirely
    written in Go. It is possible to access databases such as MySQL, PostgreSQL, SQLite,
    etc . with Go. You can even develop applications targeting some of the relatively
    newer technologies such as blockchain, data science, machine learning, etc. One
    of the key selling points of Go is that it can build WebAssembly applications.
    WebAssembly is a type of code that can be run inside supported browsers. It is
    an open standard for executable binary code format targeted at web applications.
    This enables near native performance. With this feature, you can build a high
    performance web application written in Go language. With so much flexibility and
    such a wide use case scenario, Go is quickly becoming one of the most enterprise
    friendly languages with companies such as Uber, Twitch, Google, Dailymotion, etc
    . making use of it to implement some of their applications and services. Is prior
    programming knowledge needed to learn Go Programming language? The short answer
    to that question is No . The long answer is – any prior programming experience
    will definitely help. Go combines the efficiency of languages like C/C++ and ease
    of use and code readability of languages such as Python or Javascript. If you
    know  any of these languages, you will be able to relate to the concepts really
    well. But even if you are a complete beginner to programming or this is the first
    language you are learning, you should be able to learn Go with the right kind
    of mind set appropriate efforts. Having said that, you should be comfortable with
    using your computer. That is, you should know the way around your system, be comfortable
    with installing/removing software, using Command Prompt, PowerShell, Terminal,
    Shell, etc . Who is this book for? What will I learn? This book is for anybody
    who wants to learn the basics of Go programming language. The content has been
    carefully designed to suit complete beginners as well as experienced programmers.
    You will learn to build and execute simple console applications for desktops. '
  fmt: '

    # Go 语言的应用范围


    使用 Go 语言，你可以构建桌面应用程序、Web 应用程序、Web 服务等。Google 的 Go 语言编译器工具链适用于 Windows、macOS、Linux
    和其他类 Unix 操作系统。利用该工具链，你可以构建面向 Windows/类 Unix 操作系统的桌面和服务器应用、嵌入式平台、`WebAssembly`
    等目标的应用程序。


    目前，尚无稳定的 Go GUI 开发框架，大多数框架通过封装实现且仍在开发中。但这绝非劣势，因为 Go 语言功能强大。正在革新云计算和虚拟化领域的容器化工具
    `Docker` 完全由 Go 编写。可以使用 Go 访问 `MySQL`、`PostgreSQL`、`SQLite` 等数据库。你甚至可以开发面向区块链、数据科学、机器学习等较新技术的应用程序。


    Go 语言的一个核心卖点是能够构建 `WebAssembly` 应用程序。`WebAssembly` 是一种可在支持的浏览器中运行的代码类型，它是面向 Web
    应用程序的可执行二进制代码格式的开放标准，可实现接近原生的性能。利用此特性，你可以用 Go 语言编写高性能 Web 应用程序。


    凭借如此灵活性和广泛的用例，Go 正迅速成为最受企业青睐的语言之一，`Uber`、`Twitch`、`Google`、`Dailymotion` 等公司均在使用它实现其部分应用和服务。


    ## 学习 Go 是否需要编程基础？


    简短回答：**不需要**。


    详细回答：任何编程经验都会有所帮助。Go 结合了 `C/C++` 等语言的高效性，以及 `Python` 或 `JavaScript` 等语言的易用性和代码可读性。如果你了解这些语言中的任意一种，将能很好地理解
    Go 的概念。但即使你是编程零基础或这是你学习的第一门语言，只要具备正确的心态并付出适当努力，也能学会 Go。


    话虽如此，你应熟练使用计算机，即了解系统操作，能熟练安装/卸载软件，使用 `Command Prompt`、`PowerShell`、`Terminal`、`Shell`
    等工具。


    ## 本书适合谁？将学到什么？


    本书适合所有想学习 Go 编程语言基础的人。内容经过精心设计，适合完全的初学者和有经验的程序员。你将学会为桌面构建和执行简单的控制台应用程序。

    '
