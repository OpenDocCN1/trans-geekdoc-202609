- raw: '10\. User Interaction Up to this point, we have seen several programming examples.
    All those programs had hard coded values. None of the programs gave the user an
    opportunity to enter values manually. In this section, we will learn how to accept
    input from the user. There are many ways to interact with the user. We will learn
    about two simple functions from the fmt package used for reading input from the
    user – Scanln and Scanf . 10.1 Scanln Function Here is how to use the Scanln fucntion:
    fmt.Scanln ( &<string variable> ) Example: var str string; smt.Scanln (&str )
    The Scanln function requires a string variable to be specified to store user’s
    input marked by <string variable> in the above code snippet. This function implements
    a blocking I/O operation . That is, when the execution control will reach a Scanln
    statement, the execution of the program will halt to give the user an opportunity
    to enter something through the keyboard (and press Enter). Once the user enters
    something and hits Enter, whatever the user has entered through the keyboard will
    be fetched and stored in the specified string variable. The ampersand sign (&)
    before the variable is used to fetch the memory address of the variable so that
    the Scanln function can directly set the contents of the specified variable. This
    concept will be clearer in the Pointers chapters. Let us write a simple Go program
    to prompt the user to enter something and display it back: /\*User Interaction
    Demo 1\*/ /\*Package Declaration\*/ package main /\*Import Statement - import
    fmt package\*/ import ( "fmt" ) /\*Mandatory main function\*/ func main () { ​
    /\*Create a variable to store input\*/ ​ var  str string; ​ /\*Prompt the user
    to enter something\*/ ​ fmt . Printf ( "\\nEnter something: " ) ​ /\*Read user
    input using Scanln function\*/ ​ fmt . Scanln (& str ) ​ /\*Display whatever has
    been read\*/ ​ fmt . Printf ( "\\nYou have entered: %s \\n" , str ) } Output:
    ![](Image00033.jpg)The Scanln function has its own limitations. To start with,
    it can only read the input in a string format. That means, even if you enter a
    number, it will be treated as a string. Second, it reads input as a space-separated
    tokenized string. That is, if you enter a sentence, each word will be treated
    as a token and those many variables will be needed to store the input. If you
    specify only one variable and enter a sentence, only the first word will be read.
    Let us run the same program and try to enter a sentence: ![](Image00034.jpg)As
    seen, only the first word is read. The above input had four words and hence the
    Scanln statement should have had 4 variables specified to store those 4 words
    as follows: fmt.Scanln(&str1, &str2, &str3, &str4) Similarly, the Printf statement
    should look like: fmt.Printf("\\nYou have entered: %s %s %s %s\\n ", str1, str2,  str3,
    str4) Here is the full program: /\*User Interaction Demo 2\*/ /\*Package Declaration\*/
    package main /\*Import Statement - import fmt package\*/ import ( "fmt" ) /\*Mandatory
    main function\*/ func main () { ​ /\*Create variables to store input\*/ ​ var
    str1 , str2 , str3 , str4 string; ​ /\*Prompt the user to enter something\*/ ​
    fmt . Printf ( "\\nEnter something: " ) ​ /\*Read user input using Scanln function\*/
    ​ fmt . Scanln (& str1 , & str2 , & str3 , & str4 ) ​ /\*Display whatever has
    been read\*/ ​ fmt . Printf ( "\\nYou have entered: %s %s %s %s\\n " , str1 ,
    str2 , str3 , str4 ) } Output: ![](Image00035.jpg)Although the program works correctly
    now, this is not the best way to read a sentence as we do not know how big a sentence
    a user will enter. One variable will be required to store one word. This is not
    at all practical. There is a better way to read sentences using the bufio package
    discussed later in this chapter. We will use the Scanln function only when we
    want to read one word or one number at a time. If the user enters a number and
    you try to read it using Scanln , it will be in the string format. In order to
    convert a number in string format to the appropriate numeric format, we will use
    functions from the strconv package. The first thing you will have to do is import
    this package in your program and use the  following conversion functions: Convert
    a number in string format to integer: <number variable>, <error variable> = strconv.Atoi(<number
    in string format>) Example: num, err := strconv.Atoi(“55”) In the above example,
    “55” in string format will be converted to 55 in integer format and stored in
    the variable num which is short declared here. Along with that, err has also been
    short declared which will be used to store conversion error if any. Convert a
    number in string format to float: <variable> = strconv.ParseFloat(<number in string
    format>, <number of bits>) Example: numS := “-46.2343” numF, err := strconv.ParseFloat(numS,
    64) In the above example, the ParseFloat function will convert “-46.2343” in string
    format to \-46.2343 in 64-bit float format and return it to the numF variable
    where it will be stored. Let us write a Go program to accept 4 numbers from the
    user – two integers and two floats. We will use Scanln function to read these
    inputs and hence all 4 numbers will be stored in string format. We will convert
    these numbers to the appropriate formats and perform addition, subtraction, multiplication
    and division: /\*User Interaction Demo 3 - Work with numbers \*/ /\*Package Declaration\*/
    package main /\*Import Statement - import fmt and strconv package\*/ import (
    ​ ​ "fmt" ​ ​ "strconv" ​ ​ ) /\*Mandatory main function\*/ func main () { ​ /\*Declare
    variables to store input\*/ ​ ​ var num1\_str , num2\_str , num3\_str , num4\_str
    string ​ /\*Declare variables to store int and float64equivalents\*/ ​ var num1
    , num2 , sum , diff  int ​ var num3 , num4 , prod , quo float64 ​ /\*Prompt the
    user to enter two integers\*/ ​ fmt . Printf ( "\\nEnter two inegers: " ) ​ /\*Read
    user input using Scanln function\*/ ​ fmt . Scanln (& num1\_str , & num2\_str
    ) ​ /\*Prompt the user to enter two floats\*/ ​ fmt . Printf ( "\\nEnter two floats:
    " ) ​ /\*Read user input using Scanln function\*/ ​ fmt . Scanln (& num3\_str
    , & num4\_str ) ​ /\*Convert num1\_str and num2\_str to integer\*/ ​ num1 , err1
    := strconv . Atoi ( num1\_str ) ​ num2 , err2 := strconv . Atoi ( num2\_str )
    ​ /\*Convert num3\_str and num4\_str to float64\*/ ​ num3 , err3 := strconv .
    ParseFloat ( num3\_str , 64 ) ​ num4 , err4 := strconv . ParseFloat ( num4\_str
    , 64 ) ​ /\*Assign err to blank identifiers\*/ ​ \_ \= err1 ​ \_ \= err2 ​ \_
    \= err3 ​ \_ \= err4 ​ /\*Perform arithmetic operations\*/ ​ sum \= num1 + num2
    ​ diff \= num1 \- num2 ​ prod \= num3 \* num4 ​ quo \= num3 / num4 ​ /\*Print
    everything\*/ ​ fmt . Printf ( "\\nnum1 + num2 = %d" , sum ) ​ fmt . Printf (
    "\\nnum1 - num2 = %d" , diff ) ​ fmt . Printf ( "\\nnum3 \* num4 = %f" , prod
    ) ​ fmt . Printf ( "\\nnum3 / num4 = %f \\n" , quo ) } Note: We have used 4 different
    error variables – err1, err2, err3 and err4 for 4 different conversions. There
    is no need to use them. However, if you do not use them, the compiler will return
    a “declared but not used” error and the program will not build. To circumvent
    this problem, each of these error variables can be assigned to the blank identifier
    \_ . Output: ![](Image00036.jpg)10.2 Scanf Function The Scanf function is quite
    similar to the one used in C language . This function uses verbs (analogous to
    format specifiers in C) to read data of particular types. For example, if you
    want to read an integer from the user, you can use the verb %d . This eliminates
    the extra step of data conversion used in Scanln . The same verbs discussed in
    Chapter 8 will be used. Here is the general syntax: fmt.Scanf(“<formatted string
    with verbs>”, &<variables separated by comma>) fmt.Scanf(“%<verb 1> %<verb 2>,
