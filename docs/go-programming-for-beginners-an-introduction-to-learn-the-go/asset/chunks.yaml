    := \[\] rune ( str ) ​ fmt . Printf ( "\\n\\nCharacter array: \\n %c \\n" , str\_char
    ) ​ for i := 0 ; i < str\_length ; i ++ { ​ ​ fmt . Printf ( "\\nCharacter at
    index %d ==> %c\\n" , i , str\_char \[ i \]) ​ } } Output: ![](Image00075.jpg)We
    entered the word Linux, which clearly has 5 characters. But the length is reflected
    as 7. Also, while printing characters, we see two empty characters at location
    5 and 7. Let us do a bit of investigation and see what is going on. We will modify
    the following statement: fmt. Printf( "\\nCharacter at index %d ==> %c\\n" , i,
