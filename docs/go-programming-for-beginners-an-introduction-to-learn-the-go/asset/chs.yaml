- "# Go 语言入门指南：通过教程与实战示例学习 Go 编程语言\n\n\n\n![](img/Image00000.jpg)\n\n\n\n\n\n\n\n\
  ## 1. 简介\n\n有 `C` 和 `C++` 等传奇编程语言，它们用于构建特定于平台和架构的原生软件应用程序，其重点通常在于性能；还有 `Ruby` 和\
  \ `Python` 等通用脚本语言，它们几乎可以做任何事情，范围从简单的桌面应用程序到复杂的云应用程序。虽然 `Python` 和 `Ruby` 等语言易于学习、易于编码，并且与\
  \ `C/C++` 相比提供了超广泛的功能和库，但性能不如 `C/C++` 好（抱歉 Python 粉丝们，但这是事实！），除非有专用硬件支持来加速应用程序。这是因为脚本通常由一种称为解释器的特殊软件逐行执行，而用\
  \ `C/C++` 编写的程序则被编译生成特定于硬件平台的可执行代码，然后运行该可执行代码。\n\n`Go` 编程语言结合了 `C/C++` 等语言的性能和 `Python`\
  \ 等语言的易用性。`Go` 编程语言也称为 `golang` 或简称 `Go`，是由 `Robert Griesemer`、`Rob Pike` 和 `Ken\
  \ Thompson` 在 `Google` 设计的一种多范式编程语言。它是一种静态类型、编译型编程语言，支持面向对象、函数式、命令式和并发编程等编程范式。`Go`\
  \ 的开发始于 `2007` 年的 `Google`，第一个稳定版本于 `2012` 年发布，此前于 `2009` 年底进行了公开宣布。开发人员使用 `C++`、汇编语言和\
  \ `Go`（自托管）来实现 `Go` 编程语言。`Go` 有两个主要实现——`gccgo`，它是 `GCC` 编译器的前端，以及 `Google` 的 `Go`\
  \ 编译器，它面向 `Windows`、`Linux`、`macOS` 和其他类 Unix/BSD 操作系统，如 `DragonFly BSD`、`FreeBSD`、`NetBSD`\
  \ 等。\n\n\n\n\n\n# Go 语言的应用范围\n\n使用 Go 语言，你可以构建桌面应用程序、Web 应用程序、Web 服务等。Google 的 Go\
  \ 语言编译器工具链适用于 Windows、macOS、Linux 和其他类 Unix 操作系统。利用该工具链，你可以构建面向 Windows/类 Unix 操作系统的桌面和服务器应用、嵌入式平台、`WebAssembly`\
  \ 等目标的应用程序。\n\n目前，尚无稳定的 Go GUI 开发框架，大多数框架通过封装实现且仍在开发中。但这绝非劣势，因为 Go 语言功能强大。正在革新云计算和虚拟化领域的容器化工具\
  \ `Docker` 完全由 Go 编写。可以使用 Go 访问 `MySQL`、`PostgreSQL`、`SQLite` 等数据库。你甚至可以开发面向区块链、数据科学、机器学习等较新技术的应用程序。\n\
  \nGo 语言的一个核心卖点是能够构建 `WebAssembly` 应用程序。`WebAssembly` 是一种可在支持的浏览器中运行的代码类型，它是面向 Web\
  \ 应用程序的可执行二进制代码格式的开放标准，可实现接近原生的性能。利用此特性，你可以用 Go 语言编写高性能 Web 应用程序。\n\n凭借如此灵活性和广泛的用例，Go\
  \ 正迅速成为最受企业青睐的语言之一，`Uber`、`Twitch`、`Google`、`Dailymotion` 等公司均在使用它实现其部分应用和服务。\n\n\
  ## 学习 Go 是否需要编程基础？\n\n简短回答：**不需要**。\n\n详细回答：任何编程经验都会有所帮助。Go 结合了 `C/C++` 等语言的高效性，以及\
  \ `Python` 或 `JavaScript` 等语言的易用性和代码可读性。如果你了解这些语言中的任意一种，将能很好地理解 Go 的概念。但即使你是编程零基础或这是你学习的第一门语言，只要具备正确的心态并付出适当努力，也能学会\
  \ Go。\n\n话虽如此，你应熟练使用计算机，即了解系统操作，能熟练安装/卸载软件，使用 `Command Prompt`、`PowerShell`、`Terminal`、`Shell`\
  \ 等工具。\n\n## 本书适合谁？将学到什么？\n\n本书适合所有想学习 Go 编程语言基础的人。内容经过精心设计，适合完全的初学者和有经验的程序员。你将学会为桌面构建和执行简单的控制台应用程序。\n\
  \n\n\n\n\n## 3. 入门\n\n构建 Go 应用程序需要一台运行 Windows/Linux 的 PC 或一台 MAC 机器。Go 程序是纯文本文件（带有扩展名\
  \ `.go`），因此你需要一个文本编辑器来编写 Go 程序。任何文本编辑器都可以胜任，包括 `Notepad`、`Wordpad`、`vi`、`emacs`、`Notepad++`\
  \ 等。选择一个你最习惯的编辑器即可。或者，你也可以使用 `Eclipse`、`IntelliJ` 等 IDE。为了学习基础知识，我倾向于保持简单，坚持使用简单的文本编辑器而不是\
  \ IDE。你需要在机器上安装 Go 编译器工具链，以便构建 Go 应用程序。\n\n## 3.1 在 Windows 上安装 Go\n\n访问 [`golang.org/dl/`](https://golang.org/dl/)\
  \ 并下载最新的 Windows 安装程序文件，其扩展名为 `.msi`。获得文件后，双击执行。你需要管理员权限才能继续。你将看到如下欢迎屏幕：\n\n![](img/Image00002.jpg)\n\
  \n点击**下一步**，将显示最终用户许可协议 (EULA)。\n\n![](img/Image00003.jpg)\n\n阅读协议，接受条款并点击**下一步**。\n\
  \n![](img/Image00004.jpg)\n\n在这里，你可以选择更改安装目录。最好保持默认设置，直接点击**下一步**。\n\n![](img/Image00005.jpg)\n\
  \n点击**安装**，安装过程将开始。\n\n![](img/Image00006.jpg)\n\n这可能需要几分钟才能完成。完成后，你将看到类似以下的界面：\n\
  \n![](img/Image00007.jpg)\n\n点击**完成**。通过进入 Go 安装目录下的 `bin` 文件夹（如果安装时未更改，通常为 `C:\\\
  Go\\`），验证 Go 安装，确保存在名为 `go.exe` 的可执行文件：\n\n![](img/Image00008.jpg)\n\n或者，你可以使用命令提示符中的\
  \ `cd` 命令导航到 Go 安装目录，并使用 `dir` 命令列出目录内容：\n\n![](img/Image00009.jpg)\n\nGo 安装程序会自动将该\
  \ `bin` 目录的路径添加到 `PATH` 环境变量中。这使得 `go.exe` 可以从任何位置访问。要检查这一点，打开命令提示符或 PowerShell\
  \ 并输入以下命令：\n\n```\ngo\n# 或\ngo.exe\n```\n\n如果你看到类似以下截图的内容，则意味着 Go 安装成功且 `PATH` 变量设置正确：\n\
  \n![](img/Image00010.jpg)\n\n如果你看到类似这样的提示 – `go` 不是内部或外部命令，也不是可运行的程序或批处理文件。这意味着安装有问题，或者\
  \ `PATH` 变量未正确设置。在这种情况下，使用 `echo %PATH%` 命令检查 `PATH` 变量，如果未添加 Go 的 `bin` 目录，请通过系统属性（`Windows\
  \ 键 + Pause Break`）手动添加。如果 `PATH` 变量设置正确但仍找不到 `go` 命令，请重新执行安装过程。\n\n## 3.2 在类 Unix\
  \ 操作系统上安装 Go\n\n如果你使用 Linux、macOS、FreeBSD、DragonFly BSD 等类 Unix 操作系统，请从 [`golang.org/dl/`](https://golang.org/dl/)\
  \ 下载适合你操作系统的安装文件。安装过程因操作系统而异。最好遵循此链接 [`golang.org/doc/install`](https://golang.org/doc/install)\
  \ 处提供的官方 Go 文档，了解如何在特定操作系统上安装 Go。\n\n> **注意：** 本书演示的程序是在 Windows 机器上编写、构建和执行的。除非另有说明，否则它们应该可以在类\
  \ Unix 操作系统上直接编译通过。\n\n## 3.3 编译和执行 Go 程序\n\n如前所述，Go 程序是带有扩展名 `.go` 的纯文本文件。Go 是一门编译型语言。也就是说，一种称为编译器的特殊软件将纯文本\
  \ Go 程序转换为可执行文件。以下是编译过程的概念框图：\n\n![](img/Image00011.jpg)\n\n简单来说，将 Go 程序提供给 Go 编译器，后者将纯文本文件转换为可执行的二进制文件。当然，这其中还有更多内容；编译过程涉及许多技术概念，但这对用户是透明的，因此除非你从事底层系统软件设计或编译器设计领域，否则无需了解这些。现在让我们看看如何编译和执行\
  \ Go 程序。\n\n### 3.3.1 在 Windows 上\n\n在 Windows 上打开命令提示符/PowerShell，导航到包含要编译和执行的程序的目录，并输入以下命令：\n\
  \n```\ngo build <程序文件>\n```\n\n**示例：** `go build test.go`\n\n当你输入 `go build <程序文件>`\
  \ 时，`go` 命令指向作为 Go 编译器的 `go.exe` 文件。要编译的程序作为命令行参数传递给该工具，在上述命令中由 `<程序文件>` 标记。如果编译过程成功完成，将生成一个与程序文件同名但带有\
  \ `.exe` 扩展名的可执行文件。例如，`go build test.go` 命令在编译成功时将生成 `test.exe` 文件。如果你想要自定义输出文件名，可以使用\
  \ `-o` 标志，如下所示：\n\n```\ngo build -o <输出文件> <程序文件>\n```\n\n**示例：** `go build -o xyz\
  \ test.go`\n\n获得输出文件后，可以在命令提示符/PowerShell 中按如下方式执行：\n\n```\n<可执行文件名>\n```\n\n**示例：**\
  \ `test.exe`\n\n### 3.3.2 在类 Unix 操作系统上\n\n在 Linux、macOS 或任何其他类 Unix 操作系统上打开 Bash/Shell/Terminal，导航到待编译程序所在的目录，并输入以下命令：\n\
  \n```\ngo build <程序文件>\n```\n\n**示例：** `go build test.go`\n\n当你输入 `go build <程序文件>`\
  \ 时，`go` 命令指向通常位于 `/usr/local/go/bin` 目录下的 Go 编译器可执行文件 `go`。要编译的程序作为命令行参数传递给该工具，在上述命令中由\
  \ `<程序文件>` 标记。如果编译过程成功完成，将生成一个与程序同名的可执行文件。该文件将自动获得执行权限。例如，`go build test.go` 命令在编译成功时将生成\
  \ `test` 文件。如果你想要自定义输出文件名，可以使用 `-o` 标志，如下所示：\n\n```\ngo build -o <输出文件> <程序文件>\n\
  ```\n\n**示例：** `go build -o test prog.go`\n\n可以在终端中按如下方式执行输出文件：\n\n```\n./<可执行文件名>\n\
  ```\n\n**示例：** `./test`\n\n### 3.3.3 编译和执行演示\n\n让我们通过实践来正确理解如何编译 Go 程序并执行它。该过程将在\
  \ Windows 上演示。如果你使用类 Unix 操作系统，请参阅 3.3.2 节。在 Windows 上，打开你喜欢的文本编辑器，复制并粘贴以下代码：\n\n\
  ```\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Printf(\"\\nIf you\
  \ see this, you did a great job so far!\\n\")\n}\n```\n\n将此文件另存为 `test.go` 到方便的位置。这是你要编译的\
  \ Go 程序。程序也可以称为代码、源码、源文件或程序文件。打开命令提示符或 PowerShell，使用 `cd` 命令导航到 `test.go` 所在的目录，并输入以下命令：\n\
  \n```\ngo build test.go\n```\n\n此命令将生成一个名为 `test.exe` 的文件。按如下方式执行此文件：\n\n```\ntest.exe\n\
  ```\n\n输出如下：\n\n![](img/Image00012.jpg)\n\n> **注意：** 你不必理解上述代码的作用或工作原理，本节的唯一目的是教你如何编译和执行\
  \ Go 程序。\n\n### 3.3.4 编译错误\n\n当源文件中存在错误时，会发生编译错误。这些通常是语法相关的问题。如果你尝试编译一个有问题的 Go 程序，编译器将抛出错误，编译过程将不会成功完成，因此也不会生成可执行文件。有时，编译器返回的错误信息会准确告诉你哪里出错了，有时则不会。因此，在编译前手动检查每个程序是个好主意。以下是一个示例编译错误的样子：\n\
  \n![](img/Image00013.jpg)\n\n### 3.3.5 Go Playground\n\nGo Playground 是一个基于 Web\
  \ 的工具，用于在线编译和执行 Go 程序。当然，无法通过此工具使用 Go 的全部功能，但尽管如此，它是一个非常有用的工具，可用于尝试小程序和学习概念，特别是在你无法访问配置了\
  \ Go 环境的 PC/笔记本电脑时。打开你喜欢的 Web 浏览器并访问 [`play.golang.org/`](https://play.golang.org/)。你将看到类似以下的界面：\n\
  \n![](img/Image00014.jpg)\n\n清除现有代码，复制并粘贴 3.3.3 节 中的代码，然后点击**运行**。你应该会在代码区域正下方看到输出：\n\
  \n![](img/Image00015.jpg)\n\n\n\n\n## 4. 语法\n\n既然我们已经知道如何编译和执行程序，现在让我们开始学习 Go 语言的实际编程概念。Go\
  \ 是一门**大小写敏感**的语言。我们可能会说 “programming”、“Programming” 和 “PROGRAMMING” 是同一个词，但 Go\
  \ 编译器会将它们视为完全不同的标识符。\n\n## 4.1 语句\n\n语句用于执行一项任务或一组任务的组合。它可以由任何内容组成，例如运算符、函数调用、变量赋值等。简单来说，语句就是一行执行一条或多条指令的代码，例如在屏幕上打印内容、执行算术运算、从文件读取数据等。在\
  \ Go 中，一条语句占据一行。以下是几个语句的示例：\n\n```\nfmt.Printf (“Hello”)\nvar x int = 51\nmsg =\
  \ “Go book”\n```\n\n## 4.2 注释\n\n注释用于标记或解释一段代码。编译器会忽略注释，它们对程序的执行**没有任何影响**。因此，注释仅与我们人类相关。注释以\
  \ `/*` 字符序列开始，以 `*/` 字符序列结束。以下是几个示例：\n\n```\n/*This is a comment*/\n/* You can have\
  \ any text within this character sequences */\n```\n\n本书包含多个编程示例。每个程序都包含注释，解释特定代码段的功能。每当你在本书中看到程序时，请务必仔细阅读注释。\n\
  \n## 4.3 标识符\n\n标识符是赋给变量、类、对象、函数或其他任何可识别实体的名称。标识符名称可以包含字母数字字符，但第一个字符必须是字母。唯一允许的特殊字符是下划线（`_`）。\n\
  \n## 4.4 关键字\n\n关键字是保留字，**不能**用作标识符名称。以下是 Go 语言的关键字列表：\n\n| break | default | func\
  \ | interface | select |\n| :--- | :--- | :--- | :--- | :--- |\n| case | defer |\
  \ go | map | struct |\n| chan | else | goto | package | switch |\n| const | fallthrough\
  \ | if | range | type |\n| continue | for | import | return | var |\n\n## 4.5 记号\n\
  \n记号是程序中任何有意义的项。关键字、标识符、常量、符号、字符串字面量等都可以称为记号。\n\n## 4.6 基本程序构成要素\n\n一个最基础的 Go 程序应包含以下构成要素：\n\
  \n### 包声明\n\nGo 将系统中的源文件组织为包。Go 程序可用于构建库，也可用于构建独立应用程序。独立应用程序是指能自行执行的程序，而库无法自行执行，必须在其他应用程序中使用。在本书中，我们将主要构建独立应用程序。独立应用程序的包名应为\
  \ `main`。这会告诉编译器，当前处理的 Go 程序应构建为独立应用程序，而非库。包声明语句的写法如下：\n\n```\npackage <package\
  \ name>\n```\n\n示例：\n\n```\npackage main\n```\n\n### 导入包\n\n包是预构建的库，可执行各种任务。Go 为不同用途提供了丰富的包集合。以下是导入包的通用语法：\n\
  \n```\nimport (\n    <package 1>\n    <package 2>\n    <package 3>\n    ...\n  \
  \  <package n>\n)\n```\n\n对于处理格式化 I/O 操作，使用 `fmt` 包。如果你想编写一个在控制台打印内容的程序，这被视为格式化输出操作。你可以按如下方式导入\
  \ `fmt` 包：\n\n```\nimport (\"fmt\")\n```\n\n### 主函数\n\n主函数作为程序的**入口点**。程序将从主函数内的第一条语句开始执行。以下是编写主函数的方式：\n\
  \n```\nfunc main() {\n    /*Statements Here*/\n}\n```\n\n让我们将这些程序构成要素结合起来，编写一个能构建但不执行任何操作的\
  \ Go 程序。它将包含包声明语句和一个空的主函数。我们不会包含导入 `fmt` 语句，因为我们不打算执行任何 I/O 操作：\n\n```\n/*Package\
  \ Declaration Statement*/\npackage main\n\n/*Mandatory main function*/\nfunc main()\
  \ {\n}\n```\n\n**编译并执行：**\n\n![](img/Image00016.jpg)\n\n如图所示，程序构建并成功运行。控制台上没有发生任何显著事件，因为我们在程序内部没有做任何事情。程序从空的主函数开始执行。\n\
  \n## 5. Hello World! Go 程序\n\n在上一章中，我们了解了独立 Go 程序的基本构成要素。我们还学习了如何编写一个能构建和执行但不执行任何操作的基础\
  \ Go 程序。在本章中，我们将编写一个在控制台打印内容的程序。在控制台打印内容被视为**输出操作**。我们将使用 `fmt` 包中的 `Printf` 函数。可以通过\
  \ `fmt.Printf` 访问它。使用该函数的通用语法是：\n\n```\nfmt.Printf(<string>)\n```\n\n`Printf` 函数需要一个要打印的字符串。字符串是字符序列。向该函数提供字符串时，字符序列应包含在双引号内。该函数实际上接受格式化字符串，但为求简单，我们暂时只关注普通字符串，稍后再讨论格式化字符串。如果你想在控制台打印内容，`fmt.Printf`\
  \ 语句看起来会像这样：\n\n```\nfmt.Printf(“Let us print something”)\n```\n\n让我们结合所学知识，编写一个在控制台打印\
  \ “Hello World!” 的程序：\n\n```\n/*Package Declaration Statement*/\npackage main\n\n\
  /*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main function*/\n\
  func main() {\n    /*Print Hello World! using fmt.Printf function*/\n    fmt.Printf(\"\
  Hello World!\")\n}\n```\n\n**输出：**\n\n![](img/Image00017.jpg)\n\n让我们在 Go Playground\
  \ 中尝试相同的程序：\n\n![](img/Image00018.jpg)\n\n你也可以使用同属 `fmt` 包的 `Println` 函数。该函数会在打印内容的末尾插入一个新行。通用语法：\n\
  \n```\nfmt.Println(<string>)\n```\n\n示例：\n\n```\nfmt.Println(“Just another string…”)\n\
  ```\n\n以下是使用 `Println` 函数的修改版 Hello World! 程序：\n\n```\n/*Package Declaration Statement*/\n\
  package main\n\n/*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory\
  \ main function*/\nfunc main() {\n    /*Print Hello World! using fmt.Println function*/\n\
  \    fmt.Println(\"Hello World!\")\n}\n```\n\n**输出：**\n\n![](img/Image00019.jpg)\n\
  \n如图所示，打印 Hello World 后留出了一行额外的空行。如果你想在字符串的任意位置插入新行，可以在字符串内使用转义字符序列 `\\n`。这对 `Printf`\
  \ 和 `Println` 函数均有效。示例如下：\n\n```\n/*Package Declaration Statement*/\npackage main\n\
  \n/*Import statement, import fmt package*/\nimport \"fmt\"\n\n/*Mandatory main function*/\n\
  func main() {\n    /*Print Hello World! using fmt.Printf function*/\n    fmt.Printf(\"\
  \\nHello \\nWorld!\\n\")\n}\n```\n\n**输出：**\n\n![](img/Image00020.jpg)\n\n还有许多其他的转义字符序列。另一个有用的是\
  \ `\\t`，它会在输出字符串中插入一个制表符空格。这同样适用于 `Printf` 和 `Println` 函数。示例如下：\n\n```\n/*Package\
  \ Declaration Statement*/\npackage main\n\n/*Import statement, import fmt package*/\n\
  import \"fmt\"\n\n/*Mandatory main function*/\nfunc main() {\n    /*Print Hello\
  \ World! using fmt.Println function*/\n    fmt.Println(\"\\nHello\\tWorld!\")\n\
  }\n```\n\n**输出：**\n\n![](img/Image00021.jpg)\n\n本章我们学习了如何构建一个有意义的控制台应用程序，在屏幕上打印文本。在几乎所有后续程序中，我们都会在控制台打印各种内容，因此你应该非常熟练地掌握\
  \ `Printf` 和 `Println` 函数的用法。建议多尝试这些函数，尝试显示不同的字符串。\n\n\n\n## 6. 数据类型\n\n数据类型用于对数据进行分类。例如，字符串是一种数据类型；数字是另一种数据类型。Go\
  \ 提供了 3 种基本数据类型——布尔型、数值型和字符串型。让我们逐一了解这些类别：\n\n## 6.1 布尔数据类型\n\n布尔数据类型只有两个值——`true`\
  \ 和 `false`。它们在决策制定和控制结构中被大量使用。在编程中，该数据类型被称为 `bool`。\n\n## 6.2 数值数据类型\n\n数值数据类型用于处理不同种类的数字。此类别可进一步细分为\
  \ 3 个子类别——整型、浮点型和复数型。\n\n### 6.2.1 整型\n\n顾名思义，整型数据类型用于处理整数。Go 支持不同大小的有符号和无符号整数。列表如下：\n\
  \n| 数据类型 | 描述 |\n| --- | --- |\n| `int` | 有符号整数，大小取决于系统（32 位或 64 位） |\n| `uint`\
  \ | 无符号整数，大小取决于系统（32 位或 64 位） |\n| `int8` | 8 位有符号整数 |\n| `int16` | 16 位有符号整数 |\n\
  | `int32` | 32 位有符号整数 |\n| `int64` | 64 位有符号整数 |\n| `uint8` | 8 位无符号整数 |\n| `uint16`\
  \ | 16 位无符号整数 |\n| `uint32` | 32 位无符号整数 |\n| `uint64` | 64 位无符号整数 |\n| `rune` |\
  \ 同 `uint32`。用于 Unicode 字符。 |\n| `byte` | 同 `int8`。一个字节是 8 位宽的数据。 |\n| `uintptr`\
  \ | 用于存储指向所有类型整数指针的无符号整数。 |\n\n> **注意：** 如果你只需要一种整数数据类型，应使用 `int` 或 `uint`。大小将根据你使用的系统类型决定。如果你使用\
  \ 32 位系统，大小将为 32 位；对于 64 位系统，大小将为 64 位。如果你对所处理数据的大小要求很具体，可以使用适当大小的数据类型。\n\n### 6.2.2\
  \ 浮点型\n\n数值数据类型的此子类别用于浮点值。\n\n| 数据类型 | 描述 |\n| --- | --- |\n| `float32` | 32 位 IEEE\
  \ 754 浮点数 |\n| `float64` | 64 位 IEEE 754 浮点数 |\n\n### 6.2.3 复数型\n\n复数数据类型用于处理具有实部和虚部的复数。\n\
  \n| 数据类型 | 描述 |\n| --- | --- |\n| `complex64` | 64 位复数，拥有 `float32`（32 位）类型的实部和虚部。两个\
  \ 32 位 `float32` 类型总共占 64 位。 |\n| `complex128` | 128 位复数，拥有 `float64`（64 位）类型的实部和虚部。两个\
  \ 64 位 `float64` 类型总共占 128 位。 |\n\n## 6.3 字符串数据类型\n\n字符串数据类型用于处理字符串值。字符串是字符序列。在编程中，Go\
  \ 中该数据类型被称为 `string`。我们已经了解了如何使用 `Printf()` 和 `Println()` 函数打印字符串。更多细节将在下一章介绍。\n\
  \n## 6.4 其他数据类型\n\n除了这 3 种基本数据类型，Go 还提供了一些其他数据类型，包括——聚合数据类型和引用数据类型。这些类别的数据类型将在本书的相关章节中介绍。\n\
  \n\n\n\n## 7. 变量\n\n变量是赋予内存位置的唯一可识别名称。声明变量时，根据其类型会在内存中预留相应空间。例如，声明 `int8` 类型变量将预留\
  \ 1 字节（8 位）；声明 `float64` 类型变量将预留 8 字节（64 位）。这些内存位置拥有唯一可识别的地址，通常以十六进制格式表示。因为不可能每次访问数据都使用内存地址，所以我们使用变量。\n\
  \n变量命名规则与标识符命名规则相同：变量名可包含字母数字字符；不能以数字开头；唯一允许的特殊字符是下划线（`_`）。\n\n变量可使用 `var` 关键字按以下语法声明：\n\
  \n```go\nvar <variable 1>, <variable 2>, …, <variable n> <data type>\n```\n\n示例：\n\
  \n```go\n/*声明 2 个 string 类型变量*/\nvar first_name, last_name string\n\n/*声明 1 个 int\
  \ 类型变量*/\nvar p int\n\n/*声明 2 个布尔类型变量*/\nvar flag1, flag2 bool\n\n/*声明 1 个 float32\
  \ 类型变量*/\nvar p float32\n```\n\n## 7.1 变量初始化\n\n变量声明时（使用上述片段）将具有零值。即：布尔变量默认值为 `false`，数值变量默认值为\
  \ `0`，字符串变量默认值为空字符串（`\"\"`）。可在声明时设置初始值，此过程称为初始化。初始化后变量将保存设定的初始值而非零值。\n\n通用语法：\n\n\
  ```go\nvar <variable 1>, ..., <variable n> <data type (optional)> = <value 1>, …,\
  \ <value n>\n```\n\n示例：\n\n```go\n/*声明 1 个值为 1290 的 int 变量，指明类型*/\nvar x int = 1290\n\
  \n/*声明 2 个值为 -36.58 和 59.37 的 float32 变量，指明类型*/\nvar a, b float32 = -36.58, 59.37\n\
  ```\n\n也可按如下方式声明并初始化混合数据类型的变量：\n\n```go\nvar <variable 1>, <variable 2>, … <variable\
  \ n> = <value 1>, <value 2>, … <value n>\n```\n\n示例：\n\n```go\n/*声明并初始化两个布尔值，不指明类型*/\n\
  var b1, b2 = false, true\n\n/*声明并初始化 4 个混合类型的变量*/\nvar name, age, height, is_working\
  \ = \"Adam\", 19, 1.78, false\n```\n\n## 7.2 短变量声明\n\n短变量声明使用短声明操作符（`:=`）声明并初始化变量。此方法可省略\
  \ `var` 关键字，但必须赋初值。\n\n通用语法：\n\n```go\n<variable 1>, <variable 2>, … <variable n>\
  \ := <value 1>, <value 2>, … <value n>\n```\n\n示例：\n\n```go\n/*短声明并初始化一个整数值*/\n\
  num := 31\n\n/*短声明并初始化不同类型的变量*/\nmsg, x, flag, y := \"Hello\", -6, true, 8.122\n\
  ```\n\n> **注意**：短声明仅在函数内部有效。函数外部声明的变量必须使用 `var` 关键字。除非另有说明，我们主要在函数内部声明变量。此概念将在 Functions\
  \ 章节进一步阐述。\n\n## 7.3 变量赋值\n\n变量可使用赋值操作符（`=`）赋值。变量赋值前必须已声明——无论是使用 `var` 关键字还是短声明。若尝试给未声明的变量赋值，编译器将报错。\n\
  \n通用语法：\n\n```go\n/*假设变量已定义*/\n<var 1>, <var 2>, … <var n> = <value 1>, <value 2>,\
  \ … <value n>\n```\n\n示例：\n\n```go\nvar x int\nv = 20\nvar a float64\nvar name string\n\
  count := 0\na = -365.58901\nname, count = \"Max\", 99\n```\n\n## 7.4 打印变量\n\n可使用\
  \ `fmt` 包的 `Println()` 函数在控制台打印变量内容。\n\n通用语法：\n\n```go\nfmt.Println(<var 1>, <var\
  \ 2>, … <var n>)\n```\n\n示例：\n\n```go\nfmt.Println(name)\nfmt.Println(a, b, c, d)\n\
  ```\n\n甚至可在 `Println()` 函数中使用常量字符串标记变量。例如：\n\n```go\nvar person_name, person_age\
  \ = \"Sasha\", 23\nfmt.Println(\"Name:\", person_name, \"Age:\", person_age)\n```\n\
  \n> **注意**：`Println()` 函数虽能打印变量内容，但属于粗糙方法。更规范的方式是使用 `Printf()` 函数配合格式化字符串，将在下一章介绍。\n\
  \n下面是演示变量用法的 Go 程序：\n\n```go\n/*变量演示*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt\
  \ 包*/\nimport (\n    \"fmt\"\n)\n\n/*强制的 main 函数*/\nfunc main() {\n    /*使用 var\
  \ 关键字声明 2 个 int 类型变量*/\n    var num1, num2 int\n\n    /*给 num1 和 num2 赋值*/\n   \
  \ num1 = 10\n    num2 = 20\n\n    /*使用 var 关键字声明并初始化 2 个 float32 类型变量*/\n    var\
  \ x, y float32 = -67.81, 45.76\n\n    /*使用 var 关键字声明并赋值混合类型的变量*/\n    var a, b,\
  \ msg, flag = -5, 9.4, \"Some text...\", false\n\n    /*短声明一个复数*/\n    c1 := 2 +\
  \ 3i\n\n    /*短声明不同数据类型的变量*/\n    p, q, country, c2, done := 178, -358.97, \"Argentina\"\
  , 5 - 12i, true\n\n    /*打印所有内容*/\n    fmt.Println(\"\\nnum1:\", num1, \", num2:\"\
  , num2)\n    fmt.Println(\"\\nx:\", x, \", y:\", y)\n    fmt.Println(\"\\na:\",\
  \ a, \", b:\", b, \", msg:\", msg, \", flag:\", flag)\n    fmt.Println(\"\\nc1:\"\
  , c1)\n    fmt.Println(\"\\np:\", p, \", q:\", q, \", country:\", country, \", c2:\"\
  , c2, \", done:\", done)\n}\n```\n\n输出：\n![](img/Image00022.jpg)\n\n> **注意**：\n\
  >\n> 1. 始终建议使用有意义的变量名。例如，存储人名时，命名为 `name` 优于 `xyz` 等随机名称。\n> 2. 仅在需要时声明变量。若声明变量却未在程序中使用，编译器将报“declared\
  \ but not used”错误，导致构建失败。若必须声明但不使用，可将其赋值给空标识符（`_`）以规避错误。\n\n\n\n\n## 8. 输出格式化\n\n\
  在上一节中，我们学习了使用 `Println` 函数打印变量。该函数会在末尾自动换行，在打印多个项目时会在项目之间留出一个空格。虽然它对于简单打印变量已经足够好用，但控制能力不强。对于规范的输出格式化，我们可以使用\
  \ `fmt` 包中的 `Printf` 函数。这能提供对输出更好的控制；稍后你将了解原因。\n\n`Printf` 函数接受一个格式化字符串作为参数。格式化字符串由字符串字面量和称为\
  \ **verb（动词/格式动词）** 的格式说明符组成。Verb 是一个以百分号（`%`）开头的字符序列。不同的数据类型使用不同的 verb。例如，字符串使用\
  \ `%s`，整数使用 `%d` 等。如果将格式化字符串传给 `Printf` 函数，则必须在格式化字符串后跟上变量、常量或表达式作为参数。打印时，verb 将被相应变量、常量或给定表达式求值的结果所替换。\n\
  \n通用语法：\n```go\nfmt.Printf(<formatted string>, <variables/constants/expressions>)\n\
  ```\n\n示例：\n```go\nfmt.Printf(\"Name: %s, Number: %d\", name, num)\n```\n\n在上述示例中，第一个\
  \ verb `%s` 将被 `name` 的值替换，第二个 verb `%d` 将被 `num` 的值替换。\n\n下图将使事情更清晰：\n![](img/Image00023.jpg)\n\
  \n请看下面的程序：\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    /* Initialize\
  \ string variables */\n    var first_name, last_name, city string = \"Samantha\"\
  , \"Hudson\", \"Denver\"\n\n    /* Initialize integer variable */\n    var age int\
  \ = 33\n\n    fmt.Printf(\"\\nFirst Name: %s \\nLast Name: %s \\nAge: %d \\nCity:\
  \ %s \\n\", first_name, last_name, age, city)\n}\n```\n\n输出：\n![](img/Image00024.jpg)\n\
  \nGo 提供了许多 verb，以下是几个重要的：\n\n| Verb | Description |\n| --- | --- |\n| `%v` | 默认格式的值\
  \ |\n| `%T` | 值的数据类型 |\n| `%t` | 布尔值 – true 或 false |\n| `%d` | 整数 |\n| `%b` | 二进制\
  \ (Base 2) |\n| `%o` | 八进制 (Base 8) |\n| `%O` | 带 0o 前缀的八进制 (Base 8) |\n| `%x` |\
  \ 十六进制 (Base 16)，小写 (a-f) |\n| `%X` | 十六进制 (Base 16)，大写 (A-F) |\n| `%c` | 字符 |\n\
  | `%f` | 无指数的浮点数值 |\n| `%F` | 同 `%f` |\n| `%e` | 科学计数法 – 带指数的浮点数。e 为小写 |\n| `%E`\
  \ | 科学计数法 – 带指数的浮点数。E 为大写 |\n| `%s` | 字符串 |\n| `%p` | 指针 |\n\n下面是一个使用不同 verb 处理不同数据类型的\
  \ Go 程序：\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    /* Declare\
  \ and initialize a few variables */\n    var x, y, z = 75, -6.872, 3+2i\n    var\
  \ flag = true\n    msg := \"Go Programming\"\n\n    /* Print various things using\
  \ Printf */\n    fmt.Printf(\"\\nx = %v Type: %T\", x, x)\n    fmt.Printf(\"\\nx\
  \ (decimal): %d\\nx (binary): %b\\nx (octal): %O\\nx (hexadecimal): %X\", x, x,\
  \ x, x)\n    fmt.Printf(\"\\ny = %f Type: %T \\nz = %f Type: %T\", y, y, z, z)\n\
  \    fmt.Printf(\"\\nflag = %t Type: %T\", flag, flag)\n    fmt.Printf(\"\\nmsg\
  \ = %s Type: %T\\n\", msg, msg)\n}\n```\n\n输出：\n![](img/Image00025.jpg)\n\n注意：\n\
  \n*   格式化字符串内的 verb 数量与格式化字符串后跟随的参数数量必须相同。\n*   始终根据要打印的值的数据类型使用正确的 verb。拿不准时，使用\
  \ `%v`。\n\n## 9. 运算符\n\n运算符是用于执行一个或多个操作的符号或符号组。Go 提供了算术运算符、关系运算符、逻辑运算符、位运算符和赋值运算符。让我们看看每一类运算符。\n\
  \n## 9.1 算术运算符\n\n顾名思义，算术运算符用于执行加法、减法等算术运算。\n\n| Operator | Description | Sample\
  \ Usage | Explanation |\n| --- | --- | --- | --- |\n| `+` | 加法 | `x + y` | 执行算术加法，返回操作数之和。\
  \ |\n| `-` | 减法 | `x - y` | 从左操作数中减去右操作数并返回差值。 |\n| `*` | 乘法 | `x * y` | 相乘操作数并返回乘积。\
  \ |\n| `/` | 除法 | `x / y` | 执行除法并返回商。 |\n| `%` | 取模 | `x % y` | 执行除法并返回余数。操作数需为整数类型。\
  \ |\n| `++` | 自增 | `x++` | 将操作数的值加 1。 |\n| `--` | 自减 | `y--` | 将操作数的值减 1。 |\n\n\
  注意：\n\n*   当你用一个整数除以另一个整数时，除法运算符将返回一个整数商，即使从数学上讲它应该是一个浮点值。这本身不是问题，在某些情况下甚至很有用。但是，如果你想要商的浮点数版本，需要先使用\
  \ `float32(<operand>)` 或 `float64(<operand>)` 将操作数转换为 float。\n*   对于复数，自增/自减运算符仅作用于实部。\n\
  *   你可以使用多个变量和多个运算符构建多项式/表达式。甚至可以使用括号来优先执行特定操作。\n\n\n\n\n\n### 算术运算符演示 1\n\n这是一个演示两个整数简单算术运算的\
  \ Go 程序：\n\n```go\n/*算术运算符演示 1*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\n\
  import (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t/*使用 var 关键字声明 6 个\
  \ int 类型的变量*/\n\tvar num1, num2, sum, diff, prod, mod int\n\n\t/*声明 float32 变量以存储商*/\n\
  \tvar quo float32\n\n\t/*为 num1 和 num2 赋值*/\n\tnum1 = 53\n\tnum2 = 18\n\n\t/*执行各种算术运算*/\n\
  \tsum = num1 + num2\n\tdiff = num1 - num2\n\tprod = num1 * num2\n\n\t/*num1 和 num2\
  \ 都是整数。\n\t因此即使数学上商是浮点数，num1/num2 的结果也将是整数。\n\t你需要在相除前使用 float32(<操作数>) 将两个操作数都转换为\
  \ float32。*/\n\tquo = float32(num1) / float32(num2)\n\n\tmod = num1 % num2\n\n\t\
  /*打印所有内容*/\n\tfmt.Printf(\"\\nnum1 = %d num2 = %d\", num1, num2)\n\tfmt.Printf(\"\
  \\nnum1 + num2 = %d\", sum)\n\tfmt.Printf(\"\\nnum1 - num2 = %d\", diff)\n\tfmt.Printf(\"\
  \\nnum1 * num2 = %d\", prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %f\", quo)\n\tfmt.Printf(\"\
  \\nnum1 (取模) num2 = %d\", mod)\n\n\tnum1++\n\tnum2++\n\n\tfmt.Printf(\"\\nnum1++\
  \ = %d num2++ = %d\\n\", num1, num2)\n}\n```\n\n输出：\n![](img/Image00026.jpg)\n\n\
  ### 算术运算符演示 2 - 浮点数算术\n\n让我们看看算术运算符如何用于浮点数。我们使用动词 `%f` 打印普通浮点值，使用 `%E` 以科学计数法格式打印值：\n\
  \n```go\n/*算术运算符演示 2 - 浮点数算术*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport\
  \ (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t/*使用 var 关键字声明 6 个 float32\
  \ 类型的变量*/\n\tvar num1, num2, sum, diff, prod, quo float32\n\n\t/*为 num1 和 num2 赋值*/\n\
  \tnum1 = 0.0363257\n\tnum2 = -2.93157E-3\n\n\t/*执行各种算术运算*/\n\tsum = num1 + num2\n\
  \tdiff = num1 - num2\n\tprod = num1 * num2\n\tquo = num1 / num2\n\n\t/*打印所有内容*/\n\
  \tfmt.Printf(\"\\n 普通浮点形式的值 -> num1 = %f num2 = %f\", num1, num2)\n\tfmt.Printf(\"\
  \\n 科学计数法形式的值 -> num1 = %E num2 = %E\", num1, num2)\n\tfmt.Printf(\"\\nnum1 + num2\
  \ = %f\", sum)\n\tfmt.Printf(\"\\nnum1 - num2 = %f\", diff)\n\tfmt.Printf(\"\\nnum1\
  \ * num2 = %E\", prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %E\\n\", quo)\n}\n```\n\n\
  输出：\n![](img/Image00027.jpg)\n\n### 算术运算符演示 3 - 复数运算\n\n算术运算符也适用于复数。你可以使用 `complex64`\
  \ 或 `complex128` 数据类型创建复数变量。`complex64` 数据类型由两个 `float32` 数据类型组成，分别用于实部和虚部；而 `complex128`\
  \ 数据类型由一个用于实部的 `float64` 数据类型和另一个用于虚部的 `float64` 数据类型组成。由于 Go 中的复数由两个浮点数组成，因此要使用的动词是\
  \ `%f`。或者，你也可以使用 `%v`，它将使用原始数据类型显示值。\n\n复数变量可以通过直接指定实部和虚部来初始化，也可以通过使用名为 `complex`\
  \ 的函数来初始化，如下所示：\n\n```go\n<变量> := complex(<实部>, <虚部>)\nNum := complex(1, 8)\n```\n\
  \n下面是一个演示在复数上使用算术运算符的 Go 程序：\n\n```go\n/*算术运算符演示 3 - 复数运算*/\n/*包声明*/\npackage main\n\
  \n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\
  \t/*使用 var 关键字声明 6 个 complex64 类型的变量*/\n\tvar num1, num2, sum, diff, prod, quo complex64\n\
  \n\t/*为 num1 和 num2 赋值*/\n\tnum1 = 2 - 5i\n\n\t/*使用 complex 函数创建复数，效果相同*/\n\tnum2\
  \ = complex(-3, 7)\n\n\t/*执行各种算术运算*/\n\tsum = num1 + num2\n\tdiff = num1 - num2\n\
  \tprod = num1 * num2\n\tquo = num1 / num2\n\n\t/*打印所有内容*/\n\tfmt.Printf(\"\\nnum1\
  \ = %v num2 = %v\", num1, num2)\n\tfmt.Printf(\"\\nnum1 + num2 = %v\", sum)\n\t\
  fmt.Printf(\"\\nnum1 - num2 = %v\", diff)\n\tfmt.Printf(\"\\nnum1 * num2 = %v\"\
  , prod)\n\tfmt.Printf(\"\\nnum1 / num2 = %f\", quo)\n\n\t/*num1 自增，num2 自减*/\n\t\
  num1++\n\tnum2--\n\n\tfmt.Printf(\"\\nnum1++ = %v num2-- = %v\\n\", num1, num2)\n\
  }\n```\n\n输出：\n![](img/Image00028.jpg)\n\n## 9.2 关系运算符\n\n关系运算符用于比较操作数。比较的结果可以是布尔值（`bool`）`true`\
  \ 或 `false`。这类运算符在使用控制结构时非常有用。\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| `==` | 等于 |\n\
  | `!=` | 不等于 |\n| `<` | 小于 |\n| `>` | 大于 |\n| `<=` | 小于或等于 |\n| `>=` | 大于或等于 |\n\
  \n下面是一个演示关系运算符用法的程序。动词 `%t` 用于显示比较操作的布尔结果：\n\n```go\n/*关系运算符演示*/\n/*包声明*/\npackage\
  \ main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc\
  \ main() {\n\t/*使用 var 关键字声明 int 类型的变量*/\n\tvar a, b, c, d int = -1, 3, -1, 9\n\n\
  \t/*打印 a, b, c, d*/\n\tfmt.Printf(\"\\na = %d b = %d c = %d d = %d\\n\", a, b, c,\
  \ d)\n\n\t/*打印比较操作的结果*/\n\tfmt.Printf(\"\\na == c: %t\", a == c)\n\tfmt.Printf(\"\
  \\nb == d: %t\", b == d)\n\tfmt.Printf(\"\\na != c: %t\", a != c)\n\tfmt.Printf(\"\
  \\nb != d: %t\", b != d)\n\tfmt.Printf(\"\\na < b: %t\", a < b)\n\tfmt.Printf(\"\
  \\nc > d: %t\", c > d)\n\tfmt.Printf(\"\\nd <= b: %t\", d <= b)\n\tfmt.Printf(\"\
  \\na >= c: %t\\n\", a >= c)\n}\n```\n\n输出：\n![](img/Image00029.jpg)\n\n## 9.3 逻辑运算符\n\
  \n逻辑运算符用于对布尔操作数执行逻辑与、逻辑或和逻辑非操作。保存布尔值（`true` 或 `false`）的变量以及结果为 `true` 或 `false`\
  \ 的表达式（可能使用关系运算符）都可以视为操作数。\n\n| 运算符 | 说明 | 示例用法 |\n| :--- | :--- | :--- |\n| `&&`\
  \ | 逻辑与 | `(表达式 1) && (表达式 2)` |\n| `||` | 逻辑或 | `(表达式 1) || (表达式 2)` |\n| `!` |\
  \ 逻辑非 | `!(表达式 1)` |\n\n注意：如果表达式用作操作数，它们将首先被求值。\n\n下面是一个展示逻辑运算符如何工作的 Go 程序：\n\n\
  ```go\n/*逻辑运算符演示*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"\
  fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t/*使用 var 关键字声明 float32 类型的变量*/\n\t\
  var a, b, c float32 = -65.736, 54.642, 0.003\n\n\t/*短声明两个布尔变量*/\n\tx := true\n\t\
  y := false\n\n\t/*打印各种操作的结果*/\n\tfmt.Printf(\"\\nx = %t y = %t\", x, y)\n\tfmt.Printf(\"\
  \\nx || y = %t, x && y = %t, !x = %t, !y = %t\", x || y, x && y, !x, !y)\n\tfmt.Printf(\"\
  \\n(a < b) && (b > c) = %t\", (a < b) && (b > c))\n\tfmt.Printf(\"\\n(a == c) ||\
  \ (c != b) = %t\", (a == c) || (c != b))\n\tfmt.Printf(\"\\n(b != c) && (c <= a)\
  \ = %t\", (b != c) && (c <= a))\n\tfmt.Printf(\"\\n(a == b) || x = %t\\n\", (a ==\
  \ b) || x)\n}\n```\n\n输出：\n![](img/Image00030.jpg)\n\n## 9.4 位运算符\n\n位运算符作用于操作数的各个位。操作将以逐位的方式进行。为了理解这类运算符，你需要了解一些二进制数系统和布尔代数的知识。\n\
  \n| 运算符 | 说明 | 示例用法 | 解释 |\n| :--- | :--- | :--- | :--- |\n| `&` | 位逻辑与 | `x & y`\
  \ | 在逐位的基础上对每个操作数执行逻辑与运算。 |\n| `|` | 位逻辑或 | `x | y` | 在逐位的基础上对每个操作数执行逻辑或运算。 |\n\n\
  \n\n\n# 位运算符\n\n| 运算符 | 名称 | 示例 | 说明 |\n| :--- | :--- | :--- | :--- |\n| `^` | 按位逻辑异或\
  \ | `x ^ y` | 对操作数的每一位执行逻辑异或运算。 |\n| `<<` | 左移 | `x << y` | 左操作数的位向左移动右操作数指定的次数。例如，`x\
  \ << 3` 将 `x` 的位左移 3 次。 |\n| `>>` | 右移 | `x >> y` | 左操作数的位向右移动右操作数指定的次数。例如，`y >>\
  \ 5` 将 `y` 的位右移 5 次。 |\n\n以下是位运算符的演示。动词 `%b` 和 `%X` 分别用于以二进制和十六进制格式打印值。\n\n```go\n\
  /* Bitwise Operators Demo */\n/* Package Declaration */\npackage main\n\n/* Import\
  \ Statement - import fmt package */\nimport (\n\t\"fmt\"\n)\n\n/* Mandatory main\
  \ function */\nfunc main() {\n\t/* Declare two integers */\n\tvar x, y int = 23,\
  \ 42\n\n\t/* Print values of x and y in decimal, binary and hex format */\n\tfmt.Printf(\"\
  \\nx (decimal) = %d, x (binary) = %b, x (hexadecimal) = %X\", x, x, x)\n\tfmt.Printf(\"\
  \\ny (decimal) = %d, y (binary) = %b, y (hexadecimal) = %X\", y, y, y)\n\n\t/* Print\
  \ the result of bitwise operations */\n\tfmt.Printf(\"\\n\\nBitwise AND (&)\\nx\
  \ & y (decimal) = %d, x & y (binary) = %b, x & y (hexadecimal) = %X\\n\", x&y, x&y,\
  \ x&y)\n\tfmt.Printf(\"\\nBitwise OR (|)\\nx | y (decimal) = %d, x | y (binary)\
  \ = %b, x | y (hexadecimal) = %X\\n\", x|y, x|y, x|y)\n\tfmt.Printf(\"\\nBitwise\
  \ XOR (^)\\nx ^ y (decimal) = %d, x ^ y (binary) = %b, x ^ y (hexadecimal) = %X\\\
  n\", x^y, x^y, x^y)\n\tfmt.Printf(\"\\nLeft Shift (<<)\\nx << 1 (decimal) = %d,\
  \ x << 1 (binary) = %b, x << 1 (hexadecimal) = %X\\n\", x<<1, x<<1, x<<1)\n\tfmt.Printf(\"\
  \\nRight Shift (>>)\\ny >> 3 (decimal) = %d, y >> 3 (binary) = %b, y >> 3 (hexadecimal)\
  \ = %X\\n\", y>>3, y>>3, y>>3)\n}\n```\n\n**Output:**\n![Output](img/Image00031.jpg)\n\
  \n## 9.5 赋值运算符\n\n我们已经了解了由等号（`=`）表示的标准赋值运算符。Go 语言中还有更多运算符用于执行复合赋值操作。\n\n| 运算符 |\
  \ 说明 | 示例用法 | 等价于 |\n| :--- | :--- | :--- | :--- |\n| `+=` | 执行算术加法，然后将和赋值给左操作数。\
  \ | `x += y` | `x = x + y` |\n| `-=` | 从左操作数中减去右操作数，并将差值赋值给左操作数。 | `x -= y` | `x\
  \ = x - y` |\n| `*=` | 相乘操作数并将积赋值给左操作数。 | `x *= y` | `x = x * y` |\n| `/=` | 将左操作数除以右操作数，并将商赋值给左操作数。\
  \ | `x /= y` | `x = x / y` |\n| `%=` | 将左操作数除以右操作数，并将余数赋值给左操作数。 | `x %= y` | `x\
  \ = x % y` |\n| `&=` | 执行按位逻辑与运算，将结果赋值给左操作数。 | `x &= y` | `x = x & y` |\n| `\\|=`\
  \ | 执行按位逻辑或运算，将结果赋值给左操作数。 | `x \\|= y` | `x = x \\| y` |\n| `^=` | 执行按位逻辑异或运算，将结果赋值给左操作数。\
  \ | `x ^= y` | `x = x ^ y` |\n| `<<=` | 执行左移操作，将结果赋值给左操作数。 | `x <<= y` | `x = x\
  \ << y` |\n| `>>=` | 执行右移操作，将结果赋值给左操作数。 | `x >>= y` | `x = x >> y` |\n\n让我们编写一个\
  \ Go 程序来演示不同赋值运算符的用法。\n\n```go\n/* Assignment Operators Demo */\n/* Package Declaration\
  \ */\npackage main\n\n/* Import Statement - import fmt package */\nimport (\n\t\"\
  fmt\"\n)\n\n/* Mandatory main function */\nfunc main() {\n\t/* Declare two integers\
  \ */\n\tvar num1, num2 int = 35, 20\n\n\tfmt.Printf(\"\\nnum1 = %d num2 = %d\",\
  \ num1, num2)\n\n\t/* Perform various compound assignment operations and print */\n\
  \tnum1 += num2\n\tfmt.Printf(\"\\nnum1 += num2 = %d\", num1)\n\n\tnum1 -= num2\n\
  \tfmt.Printf(\"\\nnum1 -= num2 = %d\", num1)\n\n\tnum1 *= num2\n\tfmt.Printf(\"\\\
  nnum1 *= num2 = %d\", num1)\n\n\tnum1 /= num2\n\tfmt.Printf(\"\\nnum1 /= num2 =\
  \ %d\", num1)\n\n\tnum1 %= num2\n\tfmt.Printf(\"\\nnum1 %%= num2 = %d\", num1)\n\
  \n\tnum1 &= num2\n\tfmt.Printf(\"\\nnum1 &= num2 = %d (decimal) / %%b (binary)\"\
  , num1, num1)\n\n\tnum1 |= num2\n\tfmt.Printf(\"\\nnum1 \\|= num2 = %d (decimal)\
  \ / %%b (binary)\", num1, num1)\n\n\tnum1 ^= num2\n\tfmt.Printf(\"\\nnum1 ^= num2\
  \ = %d (decimal) / %%b (binary)\", num1, num1)\n\n\tnum2 <<= 1\n\tfmt.Printf(\"\\\
  nnum2 <<= 1 = %d (decimal) / %%b (binary)\", num2, num2)\n\n\tnum2 >>= 3\n\tfmt.Printf(\"\
  \\nnum2 >>= 3 = %d (decimal) / %%b (binary)\\n\", num2, num2)\n}\n```\n\n**Output:**\n\
  \n\n\n\n## 10. 用户交互\n\n到目前为止，我们已经看了几个编程示例。所有这些程序都使用了硬编码的值。没有任何程序给用户提供手动输入值的机会。在本节中，我们将学习如何接受用户的输入。与用户交互的方式有很多。我们将学习\
  \ `fmt` 包中用于读取用户输入的两个简单函数——`Scanln` 和 `Scanf`。\n\n## 10.1 Scanln 函数\n\n以下是使用 `Scanln`\
  \ 函数的方法：\n\n```go\nfmt.Scanln(&<字符串变量>)\n```\n\n**示例：**\n\n```go\nvar str string\n\
  fmt.Scanln(&str)\n```\n\n`Scanln` 函数需要指定一个字符串变量来存储用户的输入（在上述代码片段中用 `<字符串变量>` 标记）。该函数实现了**阻塞\
  \ I/O 操作**。也就是说，当执行控制到达 `Scanln` 语句时，程序的执行将暂停，给用户一个通过键盘输入内容（并按回车键）的机会。一旦用户输入内容并按下回车，用户通过键盘输入的任何内容都将被获取并存储在指定的字符串变量中。变量前的\
  \ `&` 符号用于获取变量的内存地址，以便 `Scanln` 函数可以直接设置指定变量的内容。这一概念将在指针章节中更清晰地说明。\n\n让我们编写一个简单的\
  \ Go 程序，提示用户输入内容并将其显示回来：\n\n```go\n/* 用户交互演示 1 */\n/* 包声明 */\npackage main\n\n/*\
  \ 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
  \ {\n\t/* 创建一个变量来存储输入 */\n\tvar str string\n\n\t/* 提示用户输入内容 */\n\tfmt.Printf(\"\\\
  n 请输入内容: \")\n\n\t/* 使用 Scanln 函数读取用户输入 */\n\tfmt.Scanln(&str)\n\n\t/* 显示读取的内容 */\n\
  \tfmt.Printf(\"\\n 您输入了: %s \\n\", str)\n}\n```\n\n**输出：**\n![](img/Image00033.jpg)\n\
  \n`Scanln` 函数有其自身的局限性。首先，它只能以字符串格式读取输入。这意味着，即使您输入一个数字，它也会被视为字符串。其次，它将输入作为以空格分隔的标记化字符串读取。也就是说，如果您输入一个句子，每个单词将被视为一个标记，并且需要相应数量的变量来存储输入。如果您只指定一个变量却输入一个句子，则只会读取第一个单词。\n\
  \n让我们运行相同的程序并尝试输入一个句子：\n![](img/Image00034.jpg)\n\n如所见，只读取了第一个单词。上面的输入有四个单词，因此 `Scanln`\
  \ 语句应该指定 4 个变量来存储这 4 个单词，如下所示：\n\n```go\nfmt.Scanln(&str1, &str2, &str3, &str4)\n\
  ```\n\n同样，`Printf` 语句应如下所示：\n\n```go\nfmt.Printf(\"\\n 您输入了: %s %s %s %s\\n \",\
  \ str1, str2, str3, str4)\n```\n\n这是完整的程序：\n\n```go\n/* 用户交互演示 2 */\n/* 包声明 */\n\
  package main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数\
  \ */\nfunc main() {\n\t/* 创建变量来存储输入 */\n\tvar str1, str2, str3, str4 string\n\n\t\
  /* 提示用户输入内容 */\n\tfmt.Printf(\"\\n 请输入内容: \")\n\n\t/* 使用 Scanln 函数读取用户输入 */\n\t\
  fmt.Scanln(&str1, &str2, &str3, &str4)\n\n\t/* 显示读取的内容 */\n\tfmt.Printf(\"\\n 您输入了:\
  \ %s %s %s %s\\n \", str1, str2, str3, str4)\n}\n```\n\n**输出：**\n![](img/Image00035.jpg)\n\
  \n虽然程序现在可以正确运行，但这不是读取句子的最佳方式，因为我们不知道用户会输入多长的句子。存储一个单词需要一个变量。这完全不切实际。稍后在本章中讨论的 `bufio`\
  \ 包提供了一种读取句子的更好方法。我们将仅在想要一次读取一个单词或一个数字时使用 `Scanln` 函数。\n\n如果用户输入一个数字，而您尝试使用 `Scanln`\
  \ 读取它，它将以字符串格式存在。为了将字符串格式的数字转换为适当的数值格式，我们将使用 `strconv` 包中的函数。您要做的第一件事是在程序中导入此包并使用以下转换函数：\n\
  \n**将字符串格式的数字转换为整数：**\n\n```go\n<数字变量>, <错误变量> = strconv.Atoi(<字符串格式的数字>)\n```\n\
  \n**示例：**\n\n```go\nnum, err := strconv.Atoi(\"55\")\n```\n\n在上面的示例中，字符串格式的 `\"\
  55\"` 将被转换为整数格式的 `55` 并存储在变量 `num` 中（此处使用短变量声明）。同时，`err` 也被短声明，用于存储可能发生的转换错误。\n\n\
  **将字符串格式的数字转换为浮点数：**\n\n```go\n<变量> = strconv.ParseFloat(<字符串格式的数字>, <位数>)\n```\n\
  \n**示例：**\n\n```go\nnumS := \"-46.2343\"\nnumF, err := strconv.ParseFloat(numS,\
  \ 64)\n```\n\n在上面的示例中，`ParseFloat` 函数将字符串格式的 `\"-46.2343\"` 转换为 64 位浮点格式的 `-46.2343`\
  \ 并返回给 `numF` 变量存储。\n\n让我们编写一个 Go 程序，从用户那里接受 4 个数字——两个整数和两个浮点数。我们将使用 `Scanln` 函数读取这些输入，因此所有\
  \ 4 个数字都将以字符串格式存储。我们将把这些数字转换为适当的格式并执行加、减、乘、除运算：\n\n```go\n/* 用户交互演示 3 - 处理数字 */\n\
  /* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 和 strconv 包 */\nimport (\n\t\"fmt\"\n\
  \t\"strconv\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\t/* 声明变量来存储输入 */\n\tvar\
  \ num1_str, num2_str, num3_str, num4_str string\n\n\t/* 声明变量来存储 int 和 float64 等价值\
  \ */\n\tvar num1, num2, sum, diff int\n\tvar num3, num4, prod, quo float64\n\n\t\
  /* 提示用户输入两个整数 */\n\tfmt.Printf(\"\\n 请输入两个整数: \")\n\n\t/* 使用 Scanln 函数读取用户输入 */\n\
  \tfmt.Scanln(&num1_str, &num2_str)\n\n\t/* 提示用户输入两个浮点数 */\n\tfmt.Printf(\"\\n 请输入两个浮点数:\
  \ \")\n\n\t/* 使用 Scanln 函数读取用户输入 */\n\tfmt.Scanln(&num3_str, &num4_str)\n\n\t/*\
  \ 将 num1_str 和 num2_str 转换为整数 */\n\tnum1, err1 := strconv.Atoi(num1_str)\n\tnum2,\
  \ err2 := strconv.Atoi(num2_str)\n\n\t/* 将 num3_str 和 num4_str 转换为 float64 */\n\t\
  num3, err3 := strconv.ParseFloat(num3_str, 64)\n\tnum4, err4 := strconv.ParseFloat(num4_str,\
  \ 64)\n\n\t/* 将错误赋值给空标识符 */\n\t_ = err1\n\t_ = err2\n\t_ = err3\n\t_ = err4\n\n\t\
  /* 执行算术运算 */\n\tsum = num1 + num2\n\tdiff = num1 - num2\n\tprod = num3 * num4\n\t\
  quo = num3 / num4\n\n\t/* 打印所有内容 */\n\tfmt.Printf(\"\\nnum1 + num2 = %d\", sum)\n\
  \tfmt.Printf(\"\\nnum1 - num2 = %d\", diff)\n\tfmt.Printf(\"\\nnum3 * num4 = %f\"\
  , prod)\n\tfmt.Printf(\"\\nnum3 / num4 = %f \\n\", quo)\n}\n```\n\n**注意：** 我们为 4\
  \ 次不同的转换使用了 4 个不同的错误变量——`err1`、`err2`、`err3` 和 `err4`。实际上没有必要使用它们。但是，如果您不使用它们，编译器将返回“声明但未使用”错误，程序将无法构建。为了规避这个问题，可以将每个错误变量赋值给空标识符\
  \ `_`。\n\n**输出：**\n![](img/Image00036.jpg)\n\n## 10.2 Scanf 函数\n\n`Scanf` 函数与 C\
  \ 语言中使用的函数非常相似。该函数使用动词（类似于 C 语言中的格式说明符）来读取特定类型的数据。例如，如果您想从用户那里读取一个整数，可以使用动词 `%d`。这消除了\
  \ `Scanln` 中使用的数据转换的额外步骤。第 8 章讨论的相同动词将被使用。\n\n以下是通用语法：\n\n```go\nfmt.Scanf(\"<带有动词的格式化字符串>\"\
  , &<用逗号分隔的变量>)\nfmt.Scanf(\"%<动词 1> %<动词 2>, ...\", &<变量 1>, &<变量 2>, ...)\n```\n\
  \n**示例：**\n\n```go\nfmt.Scanf(\"%s %d %f\", &name, &age, &weight)\n```\n\n`Scanf`\
  \ 函数使用由动词组成的格式化字符串来解析用户的输入。对于使用的每个动词，都有一个对应的变量（变量名前缀为 `&` 符号）。该函数也实现了**阻塞 I/O 操作**。当用户通过键盘输入内容时，它将根据格式化字符串中指定的格式进行解析。\n\
  \n例如，如果格式化字符串如下——`\"%s %d %f\"`，用户应该输入三个用空格分隔的值，其中第一个值是字符串，第二个值是整数，第三个值是浮点数。只有在输入所有值后才应按回车键。如果用户在输入第一个值后按下回车，则将跳过剩余的两个输入，相应的变量将获得零值。\n\
  \n让我们再举一个格式化字符串的例子。如果格式化字符串如下——`\"%d\\n%f\\n%d\\n%s\"`，该函数将期望用户输入 4 个值。动词之间的 `\"\
  \\n\"` 字符序列表示用户应该在输入每个值后按回车键。如果这让您感到困惑，您可以始终为每个输入使用一条 `Scanf` 语句。\n\n让我们编写一个程序，从用户那里读取\
  \ 3 个输入并将用户输入的内容打印回来：\n\n```go\n/* Scanf 演示 */\n/* 包声明 */\npackage main\n\n/* 导入语句\
  \ - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\t\
  /* 声明变量 */\n\tvar name string\n\tvar age int\n\tvar weight float32\n\n\t/* 提示用户输入\
  \ 3 个值 */\n\tfmt.Printf(\"\\n 请输入姓名、年龄和体重: \")\n\n\t/* 读取 3 个值 */\n\tfmt.Scanf(\"\
  %s %d %f\", &name, &age, &weight)\n\n\t/* 显示所有内容 */\n\tfmt.Printf(\"\\n\\n 姓名: %s,\
  \ 年龄: %d, 体重: %f \\n\", name, age, weight)\n}\n```\n\n**输出：**\n![](img/Image00037.jpg)\n\
  \n在上面的示例中，`\"Liev\"` 被读作字符串，`18` 被读作 int，`152` 被读作 float32。输入分配给变量的过程如下：\n![](img/Image00038.jpg)\n\
  \n如前所述，输入是根据动词指定的数据类型读取的，因此不需要将输入从一种形式转换为另一种形式。让我们通过编写一个程序来添加两个数字来验证这一点。这次，我们将在两个动词之间插入\
  \ `\\n`，因此用户在输入每个数字后必须按回车键：\n\n```go\n/* Scanf 两数相加演示 */\n/* 包声明 */\npackage main\n\
  \n/* 导入语句 - 导入 fmt 包 */\nimport (\n\t\"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
  \ {\n\t/* 声明变量 */\n\tvar num1, num2, sum int\n\n\t/* 提示用户输入 2 个数字 */\n\tfmt.Printf(\"\
  \\n 请输入两个数字: \")\n\n\t/* 读取 2 个数字 */\n\tfmt.Scanf(\"%d\\n%d\", &num1, &num2)\n\n\
  \t/* 计算总和 */\n\tsum = num1 + num2\n\n\t/* 显示所有内容 */\n\tfmt.Printf(\"\\n 总和 = %d\\\
  n\", sum)\n}\n```\n\n**输出：**\n![](img/Image00039.jpg)\n\n## 10.3 读取句子\n\n`Scanf`\
  \ 和 `Scanln` 函数都无法读取句子，即包含单词的字符串。`bufio` 包中有一个名为 `ReadString` 的函数。因此，如果您打算使用 `ReadString`\
  \ 函数，需要导入 `bufio` 包。除了 `bufio`，还应导入 `os`，因为我们需要访问 `os.Stdin`（标准输入/输出）。不用担心技术细节，这是一个高级主题。如果您想读取一个句子，只需记住几行代码即可。\n\
  \n以下是通用语法：\n\n```go\n<读取器变量> := bufio.NewReader(os.Stdin)\n<字符串变量>, _ := <读取器变量>.ReadString('\\\
  n')\n```\n\n**示例：**\n\n```go\nr := bufio.NewReader(os.Stdin)\nmsg, _ := r.ReadString('\\\
  n')\n```\n\n这是一个提示用户输入内容并读取完整句子的程序：\n\n```go\n/* 读取句子 */\n/* 包声明 */\npackage main\n\
  \n/* 导入语句 - 导入 fmt、bufio、os 包 */\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n)\n\
  \n/* 强制性的 main 函数 */\nfunc main() {\n\t/* 使用 stdin 创建一个 NewReader 类型的输入读取器变量 */\n\
  \tinputReader := bufio.NewReader(os.Stdin)\n\n\t/* 提示用户输入内容 */\n\tfmt.Printf(\"\\\
  n 请输入一个句子: \")\n\n\t/* 使用 ReadString 函数读取 */\n\ttext, _ := inputReader.ReadString('\\\
  n')\n\n\t/* 打印读取的内容 */\n\tfmt.Printf(\"\\n 您输入了: \\n%s\", text)\n}\n```\n\n**输出：**\n\
  ![](img/Image00040.jpg)\n\n\n\n\n\n## 11. 控制结构\n\n控制结构是用于让程序员更好地控制程序执行流程的编程构造。当程序被编译时，会构建一个可执行的二进制文件。该文件包含特定平台原生的机器级指令。每一行有意义的代码都会产生一条或多条机器级指令。例如，`var\
  \ name string` 将产生一类机器级指令，而 `a = b + c` 将产生另一类指令。这是由编译器完成的，我们无需担心。在此章节中提及这一点的目的是为了解释执行流程。回到主题——每一行代码对应一条或多条可执行指令。多行代码将产生多条机器级指令。可执行二进制文件一旦运行，将从第一条指令开始执行，直到最后一条。从概念上讲，我们可以认为程序从第一行代码开始执行，直到最后一行（尽管实际上执行的是可执行二进制文件，而不是程序文件本身）。这是一种非常线性的执行流程。我们可以使用控制结构来改变这种执行流程。Go\
  \ 语言提供了决策构造和循环作为控制结构。\n\n## 11.1 决策制定\n\n决策构造为程序的执行引入了条件性。例如，你可以根据某个条件是否满足来执行一块代码。Go\
  \ 语言以 `if-else`、`switch` 以及一些高级构造的形式提供了决策构造。我们将重点介绍 `if-else` 和 `switch`。\n\n###\
  \ 11.1.1 If-Else 构造\n\nIf-Else 构造用于在给定条件为 `true` 时执行一块代码，并可选择在给定条件为 `false` 时执行另一块不同的代码。让我们从一个简单的\
  \ `if` 块开始。\n\n**通用语法：**\n\n```\nif (<condition>) {\n    /* 如果 <condition> 为 true\
  \ 则执行的语句 */\n}\n```\n\n**示例：**\n\n```\nif (num == 0) {\n    fmt.Println(\"num is\
  \ 0\")\n}\n```\n\n`if` 语句应提供一个用于求值的条件，在上述代码片段中标记为 `<condition>`。该条件通常是一个布尔表达式，其求值结果为\
  \ `true` 或 `false`。如果求值为 `true`，则执行 `if` 块内的语句（即 `if` 语句后花括号内的代码块）。如果求值为 `false`，则跳过\
  \ `if` 块，程序将从 `if` 块之后恢复执行。\n\n> **注意：** 条件可以是简单的布尔表达式，如 `(a == 0)`，也可以是使用逻辑运算符组合的多个布尔表达式，如\
  \ `(a != 0) && (b > 1)`。\n\n让我们编写一个简单的程序来演示 `if` 语句的用法：\n\n```go\n/* If Demo */\n\
  /* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/*\
  \ 强制性的 main 函数 */\nfunc main() {\n    var a int = 20\n\n    fmt.Printf(\"\\nProgram\
  \ execution begins. This statement is before the if block.\\n\")\n\n    /* 检查 a\
  \ 是否大于 10 */\n    if (a > 10) {\n        fmt.Printf(\"\\nInside if block.\\n%d is\
  \ greater than 10.\\n\", a)\n    }\n\n    fmt.Printf(\"\\nOutside if block. Program\
  \ coming to an end.\\n\")\n}\n```\n\n**输出：**\n![](img/Image00041.jpg)\n\n在本例中，我们设置了一个求值为\
  \ `true` 的条件，因此 `if` 块得以执行。让我们修改代码，将 `if (a > 10)` 改为 `if (a < 10)` 并观察结果：\n\n**输出：**\n\
  ![](img/Image00042.jpg)\n\n可以看到，当给定条件求值为 `false` 时，`if` 块内的语句不会被执行。可以使用 `else` 块在条件求值为\
  \ `false` 时执行另一块不同的代码。`else` 块必须紧跟在 `if` 块之后。\n\n**通用语法：**\n\n```\nif (<condition>)\
  \ {\n    /* 如果 <condition> 为 true 则执行的语句 */\n} else {\n    /* 如果 <condition> 为 false\
  \ 则执行的语句 */\n}\n```\n\n**示例：**\n\n```\nif (num == 0) {\n    fmt.Println(\"num is\
  \ 0\")\n} else {\n    fmt.Println(\"num is NOT 0\")\n}\n```\n\n`if-else` 构造的工作原理很简单——如果条件求值为\
  \ `true`，则执行 `if` 块并跳过 `else` 块；如果求值为 `false`，则跳过 `if` 块并执行 `else` 块。\n\n让我们编写一个使用\
  \ `if` 和 `else` 块的程序，看看当 `if` 块的给定条件求值为 `false` 时会发生什么。\n\n```go\n/* If Else Demo\
  \ */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n\
  )\n\n/* 强制性的 main 函数 */\nfunc main() {\n    var a int = 5\n\n    fmt.Printf(\"\\\
  nProgram execution begins. This statement is before the if block.\\n\")\n\n    /*\
  \ 检查 a 是否大于 10 */\n    if (a > 10) {\n        fmt.Printf(\"\\nInside if block.\\\
  n%d is greater than 10.\\n\", a)\n    } else {\n        fmt.Printf(\"\\nInside else\
  \ block.\\n%d is NOT greater than 10.\\n\", a)\n    }\n\n    fmt.Printf(\"\\nOutside\
  \ if/else blocks. Program coming to an end.\\n\")\n}\n```\n\n**输出：**\n![](img/Image00043.jpg)\n\
  \n可以看到，条件 `(a > 10)` 求值为 `false`，因为 `a` 为 `5`。因此，`if` 被跳过，`else` 块得以执行。\n\n一个 `if-else`\
  \ 块组合只会检查一个条件的有效性。根据给定条件的求值结果，将执行 `if` 或 `else` 块。如果你想检查多个条件，可以在 `if-else` 块内嵌套\
  \ `if-else` 块，如下所示：\n\n```\nif (<condition 1>) {\n    /* 如果 <condition 1> 为 true\
  \ 则执行的语句 */\n    if (<condition 2>) {\n        /* 如果 <condition 1> 和 <condition\
  \ 2> 都为 true 则执行的语句 */\n    } else {\n        /* 如果 <condition 1> 为 true 且 <condition\
  \ 2> 为 false 则执行的语句 */\n    }\n} else {\n    /* 如果 <condition 1> 为 false 则执行的语句\
  \ */\n    if (<condition 3>) {\n        /* 如果 <condition 1> 为 false 且 <condition\
  \ 3> 为 true 则执行的语句 */\n    } else {\n        /* 如果 <condition 1> 和 <condition 3>\
  \ 都为 false 则执行的语句 */\n    }\n}\n```\n\n检查多个条件的另一种方法是使用 `else-if` 块。将有一个强制性的 `if`\
  \ 块和一个可选的 `else` 块。在这两个块之间，你可以拥有任意数量的 `else-if` 块，每个 `else-if` 语句都有自己的条件。这样你就可以检查任意数量的条件。以下是通用语法：\n\
  \n```\nif (<condition 1>) {\n    /* 如果 <condition 1> 为 true，则执行此块。 */\n} else if\
  \ (<condition 2>) {\n    /* 如果 <condition 1> 为 false 且 <condition 2> 为 true，则执行此块。\
  \ */\n} else if (<condition 3>) {\n    /* 如果 <condition 1> 和 <condition 2> 为 false\
  \ 且 <condition 3> 为 true，则执行此块。 */\n} else {\n    /* 如果 <condition 1>、<condition\
  \ 2> 和 <condition 3> 都为 false，则执行此块。 */\n}\n```\n\n当存在 `if-else if-else` 块组合时，发生的过程是——首先检查\
  \ `if` 语句的条件。如果该条件求值为 `true`，则执行 `if` 块，故事到此结束！所有剩余的块都将被跳过。然而，如果条件求值为 `false`，执行控制将跳转到紧随其后的\
  \ `else if` 语句并检查其条件。如果求值为 `true`，则执行该特定的 `else if` 块，其余块被跳过。如果其条件求值为 `false`，控制将跳转到下一个\
  \ `else-if` 块（如果存在），并检查该块的条件。此过程将持续进行，直到找到一个有效的条件，或者不再有 `else-if` 块为止。如果没有任何条件求值为\
  \ `true`，则会执行 `else` 块（如果存在）。\n\n让我们编写一个 Go 程序来检查给定的数字是正数、负数还是零：\n\n```go\n/* Positive\
  \ Negative Zero */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 和 strconv 包 */\n\
  import (\n    \"fmt\"\n    \"strconv\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\
  \    /* 声明变量存储输入 */\n    var num_str string\n\n    fmt.Printf(\"\\nEnter a number:\
  \ \")\n\n    /* 使用 Scanln 函数读取用户输入 */\n    fmt.Scanln(&num_str)\n\n    /* 将 num_str\
  \ 转换为整数 */\n    num, err := strconv.Atoi(num_str)\n\n    /* 将 err 赋值给空标识符 */\n \
  \   _ = err\n\n    /* 检查 num > 0 */\n    if (num > 0) {\n        fmt.Printf(\"\\\
  n%d is positive.\\n\", num)\n    } else if (num < 0) {\n        fmt.Printf(\"\\\
  n%d is negative.\\n\", num)\n    } else {\n        fmt.Printf(\"\\n%d is zero.\\\
  n\", num)\n    }\n}\n```\n\n**输出：**\n![](img/Image00044.jpg)\n\n### 11.1.2 Switch-Case\
  \ 构造\n\n我们已经了解了如何使用多个 `else if` 块来检查多个条件的有效性。`switch-case` 构造提供了一种处理多个条件的更好方式。编写\
  \ `switch-case` 构造有多种方式，我们将介绍几种重要的方式。让我们从基本格式开始：\n\n```\nswitch (<expression>) {\n\
  \    case <constant expression 1>:\n        /* 如果 <expression> 匹配 <constant expression\
  \ 1> 则执行的语句 */\n    case <constant expression 2>:\n        /* 如果 <expression> 匹配\
  \ <constant expression 2> 则执行的语句 */\n    case <constant expression 3>:\n       \
  \ /* 如果 <expression> 匹配 <constant expression 3> 则执行的语句 */\n    ...\n    case <constant\
  \ expression n>:\n        /* 如果 <expression> 匹配 <constant expression n> 则执行的语句 */\n\
  \    default:\n        /* 如果 <expression> 未找到匹配项则执行的语句 */\n}\n```\n\n在这种 `switch-case`\
  \ 构造语法中，`switch` 语句被赋予一个用于工作的表达式——在上述代码片段中标记为 `<expression>`。表达式可以像变量一样简单。在 `switch`\
  \ 块内部，有多个 `case` 块，每个 `case` 语句都有一个常量表达式。当遇到 `switch` 语句时，其表达式会被求值。生成的值将与 `case`\
  \ 块的常量表达式进行比对。如果生成的值与其中一个常量表达式匹配，则执行该特定的 `case` 块。这个过程称为**情况测试**。如果值与任何常量表达式都不匹配，则执行\
  \ `default` case 块（如果存在）。\n\n这是一个简单的 `switch-case` 演示：\n\n```go\n/* Switch Demo\
  \ 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n\
  )\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 创建一个用于 switch 的变量 */\n    Option\
  \ := 3\n\n    /* Switch Option，其中 Option 是赋值为 3 的 int 变量 */\n    switch (Option)\
  \ {\n        /* 用于匹配 Option 的各种 case */\n        case 1:\n            fmt.Printf(\"\
  \\nOption is 1.\\n\")\n        case 2:\n            fmt.Printf(\"\\nOption is 2.\\\
  n\")\n        case 3:\n            fmt.Printf(\"\\nOption is 3.\\n\")\n        /*\
  \ 如果没有匹配项的默认 case */\n        default:\n            fmt.Printf(\"\\nOption does\
  \ not match any of the cases.\\n\")\n    }\n}\n```\n\n**输出：**\n![](img/Image00045.jpg)\n\
  \n在上述程序中，有 3 个 case，变量 `Option` 用于 switch。该变量已赋值为 `3`，让我们将 `Option` 改为 `1` 和 `9`\
  \ 并观察结果：\n\n**输出 (Option = 1)：**\n![](img/Image00046.jpg)\n\n**输出 (Option = 9)：**\n\
  ![](img/Image00047.jpg)\n\n用于 switch 的变量也可以在 `switch` 语句本身中设置，如下所示：\n\n```\nswitch\
  \ <optional statement, set variable> (<variable/expression>) {\n    case <constant\
  \ expression 1>:\n        /* 如果 <expression> 匹配 <constant expression 1> 则执行的语句 */\n\
  \    ...\n    case <constant expression n>:\n        /* 如果 <expression> 匹配 <constant\
  \ expression n> 则执行的语句 */\n    default:\n        /* 如果 <expression> 未找到匹配项则执行的语句\
  \ */\n}\n```\n\n让我们重写之前的程序，在 `switch` 语句本身中将 `Option` 设置为 `2`：\n\n```go\n/* Switch\
  \ Demo 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"\
  fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* Switch Option，其中 Option 是在\
  \ switch 中短声明并赋值为 2 的 int 变量 */\n    switch Option := 2; (Option) {\n        /*\
  \ 用于匹配 Option 的各种 case */\n        case 1:\n            fmt.Printf(\"\\nOption is\
  \ 1.\\n\")\n        case 2:\n            fmt.Printf(\"\\nOption is 2.\\n\")\n  \
  \      case 3:\n            fmt.Printf(\"\\nOption is 3.\\n\")\n        /* 如果没有匹配项的默认\
  \ case */\n        default:\n            fmt.Printf(\"\\nOption does not match any\
  \ of the cases.\\n\")\n    }\n}\n```\n\n**输出：**\n![](img/Image00048.jpg)\n\n编写 `switch-case`\
  \ 构造的另一种方式是为每个 `case` 语句使用布尔表达式，如下所示：\n\n```\nswitch {\n    case <boolean expression\
  \ 1>:\n        /* 当 <boolean expression 1> 求值为 true 时执行的语句 */\n    case <boolean\
  \ expression 2>:\n        /* 当 <boolean expression 2> 求值为 true 时执行的语句 */\n    case\
  \ <boolean expression 3>:\n        /* 当 <boolean expression 3> 求值为 true 时执行的语句 */\n\
  \    ...\n    case <boolean expression n>:\n        /* 当 <boolean expression n>\
  \ 求值为 true 时执行的语句 */\n    default:\n        /* 当所有布尔表达式都为 false 时执行的语句 */\n}\n```\n\
  \n让我们编写一个程序从用户处读取一个数字并检查它是奇数还是偶数。我们将使用上述代码片段中的 `switch-case` 语法：\n\n```go\n/* Switch\
  \ Demo 2 -- Odd or Even */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport\
  \ (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明一个变量存储数字 */\n\
  \    var num int\n\n    /* 提示用户输入数字并使用 scanf 读取 */\n    fmt.Printf(\"\\nEnter a\
  \ number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /* Switch num % 2 */\n    switch\
  \ {\n        /* 针对每种结果的各种 case */\n        /* 如果余数为零，则数字为偶数 */\n        case (num\
  \ % 2) == 0:\n            fmt.Printf(\"\\n%d is even.\\n\", num)\n        /* 如果余数为一，则数字为奇数\
  \ */\n        case (num % 2) == 1:\n            fmt.Printf(\"\\n%d is odd.\\n\"\
  , num)\n    }\n}\n```\n\n**输出：**\n![](img/Image00049.jpg)\n\n`switch-case` 构造可以使用任意基本数据类型的变量进行切换，不一定非要是数字。让我们编写一个程序要求用户输入月份名称并确定其序号：\n\
  \n```go\n/* Switch Demo 3 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\n\
  import (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明一个变量存储月份名称\
  \ */\n    var month string\n\n    /* 提示用户输入月份名称并使用 scanf 读取 */\n    fmt.Printf(\"\
  \\nEnter month: \")\n    fmt.Scanf(\"%s\", &month)\n\n    /* Switch month */\n \
  \   switch month {\n        /* 每个月份的各种 case */\n        case \"January\", \"january\"\
  :\n            fmt.Printf(\"\\nJanuary comes at No.1 in a year.\\n\")\n        case\
  \ \"February\", \"february\":\n            fmt.Printf(\"\\nFebruary comes at No.2\
  \ in a year.\\n\")\n        case \"March\", \"march\":\n            fmt.Printf(\"\
  \\nMarch comes at No.3 in a year.\\n\")\n        case \"April\", \"april\":\n  \
  \          fmt.Printf(\"\\nApril comes at No.4 in a year.\\n\")\n        case \"\
  May\", \"may\":\n            fmt.Printf(\"\\nMay comes at No.5 in a year.\\n\")\n\
  \        case \"June\", \"june\":\n            fmt.Printf(\"\\nJune comes at No.6\
  \ in a year.\\n\")\n        case \"July\", \"july\":\n            fmt.Printf(\"\\\
  nJuly comes at No.7 in a year.\\n\")\n        case \"August\", \"august\":\n   \
  \         fmt.Printf(\"\\nAugust comes at No.8 in a year.\\n\")\n        case \"\
  September\", \"september\":\n            fmt.Printf(\"\\nSeptember comes at No.9\
  \ in a year.\\n\")\n        case \"October\", \"october\":\n            fmt.Printf(\"\
  \\nOctober comes at No.10 in a year.\\n\")\n        case \"November\", \"november\"\
  :\n            fmt.Printf(\"\\nNovember comes at No.11 in a year.\\n\")\n      \
  \  case \"December\", \"december\":\n            fmt.Printf(\"\\nDecember comes\
  \ at No.12 in a year.\\n\")\n        /* 默认 case */\n        default:\n         \
  \   fmt.Printf(\"\\n%s does not seem like the name of a month!\\n\")\n    }\n}\n\
  ```\n\n**输出：**\n![](img/Image00050.jpg)\n\n请参考该程序，注意每个 `case` 如何拥有两个常量表达式。当你需要为多个常量表达式执行同一段代码时，不必编写带有不同常量表达式的单独\
  \ `case`，而是可以只编写一个 `case` 语句，其中包含用逗号分隔的多个常量表达式。\n\n## 11.2 循环\n\n循环是一种编程构造，可以根据条件是否满足，反复运行一段代码。Go\
  \ 语言仅提供一种循环，称为 `for` 循环。\n\n### 11.2.1 for 循环\n\n`for` 循环的基本语法如下：\n\n```\nfor <condition>\
  \ {\n    /* 只要 <condition> 为 true 就执行的语句 */\n}\n```\n\n**示例：**\n\n```\nnum := 0\n\
  for num < 5 {\n    fmt.Printf(\"num = %d\", num)\n    num = num + 1\n}\n```\n\n\
  当执行控制遇到 `for` 循环时，会检查其条件。如果求值为 `true`，则执行循环块内的语句。这称为一次**循环迭代**。一旦到达循环块的末尾，执行控制将跳回\
  \ `for` 语句并再次检查条件。如果再次求值为 `true`，循环块将再次被执行。只要给定条件求值为 `true`，这种循环迭代就会持续发生。一旦求值为 `false`，执行控制将退出循环。如果条件永远不变为\
  \ `false`，循环将持续执行。这样的循环称为**无限循环**。\n\n下面是一个使用 `for` 循环打印 0 到 9 的程序：\n\n```go\n/*\
  \ For Demo 1 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n  \
  \  \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 初始化一个整数变量为 0 */\n   \
  \ var count int = 0\n\n    /* 运行从 0 到 9 的 for 循环 */\n    for (count < 10) {\n  \
  \      /* 打印 count */\n        fmt.Printf(\"count = %d\\n\", count)\n        /*\
  \ 增加 count */\n        count++\n    }\n}\n```\n\n**输出：**\n![](img/Image00051.jpg)\n\
  \n编写 `for` 循环的另一种方式是使用**循环变量**。以下是通用语法：\n\n```\nfor <loop variable initialization>;\
  \ <condition>; <loop variable increment/decrement> {\n    /* 只要 <condition> 为 true\
  \ 就执行的语句 */\n}\n```\n\n使用这种语法，你可以在 `for` 语句本身中初始化循环变量。它还提供了一个增加/减少循环变量的选项。每次迭代结束时，将检查给定条件。如果求值为\
  \ `true`，循环变量将被增加/减少，然后循环块将作为下一次迭代被执行。如果循环变量之前未声明，也可以在 `for` 语句中短声明。\n\n使用这种语法，让我们编写一个程序打印\
  \ 5 的倍数。循环变量已在 `for` 语句中短声明：\n\n```go\n/* For Demo 2 */\n/* 包声明 */\npackage main\n\
  \n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
  \ {\n    fmt.Printf(\"\\nMultiples of 5\\n\\n\")\n\n    /* 运行从 1 到 10 的 for 循环 */\n\
  \    for count := 1; count <= 10; count++ {\n        /* 打印 count * 5 */\n      \
  \  fmt.Printf(\"%d\\n\", count * 5)\n    }\n}\n```\n\n**输出：**\n![](img/Image00052.jpg)\n\
  \n这是一个循环变量已预先声明的示例：\n\n```go\n/* For Demo 3 */\n/* 包声明 */\npackage main\n\n/* 导入语句\
  \ - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\
  \    /* 声明一个 int 变量 */\n    var count int\n\n    fmt.Printf(\"\\nMultiples of 3\\\
  n\\n\")\n\n    /* 运行从 1 到 20 的 for 循环 */\n    for count = 1; count <= 20; count++\
  \ {\n        /* 打印 count * 3 */\n        fmt.Printf(\"%d\\n\", count * 3)\n    }\n\
  }\n```\n\n**输出：**\n![](img/Image00053.jpg)\n\n### 11.2.2 控制语句\n\n只要给定条件为 `true`，循环就会持续执行。这是循环的正常执行过程。可以使用\
  \ `continue` 和 `break` 等控制语句来改变循环的这种执行流程。\n\n#### 11.2.2.1 continue 语句\n\n当遇到 `continue`\
  \ 语句时，执行控制将跳转到循环的开头，从而跳过 `continue` 语句之后的所有语句。换句话说，循环将移至下一次迭代。\n\n让我们编写一个程序仅打印 1\
  \ 到 30 之间的奇数：\n\n```go\n/* For Demo -- continue */\n/* 包声明 */\npackage main\n\n\
  /* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main()\
  \ {\n    fmt.Printf(\"\\nOdd numbers between 1 and 30\\n\\n\")\n\n    /* 运行从 1 到\
  \ 30 的 for 循环 */\n    for count := 1; count <= 30; count++ {\n        if (count\
  \ % 2 == 0) {\n            continue\n        }\n        fmt.Printf(\"%d\\n\", count)\n\
  \    }\n}\n```\n\n**输出：**\n![](img/Image00054.jpg)\n\n#### 11.2.2.2 break 语句\n\n\
  当遇到 `break` 语句时，循环的执行将停止，控制将退出循环。\n\n让我们通过一个编程示例来理解这个概念。我们将运行一个从 1 到 10 的循环，当 `count`\
  \ 变为 7 时跳出循环：\n\n```go\n/* For Demo -- break */\n/* 包声明 */\npackage main\n\n/* 导入语句\
  \ - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n\
  \    /* 运行从 1 到 10 的 for 循环 */\n    for count := 1; count <= 10; count++ {\n   \
  \     if (count == 7) {\n            break\n        }\n        fmt.Printf(\"count\
  \ = %d\\n\", count)\n    }\n}\n```\n\n**输出：**\n![](img/Image00055.jpg)\n\n通过以下程序可以理解\
  \ `break` 语句更实用的用法，我们要求用户输入一个数字并判断它是质数还是合数：\n\n```go\n/* Prime or composite - using\
  \ break */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\
  \n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明变量存储用户输入并作为循环计数器 */\n    var\
  \ i, num int\n\n    /* 提示用户输入数字并使用 Scanf 读取 */\n    fmt.Printf(\"\\nEnter a number:\
  \ \")\n    fmt.Scanf(\"%d\", &num)\n\n    /* 从 2 运行循环到 num，因为每个数字都能被 1 整除 */\n \
  \   for i = 2; i <= num; i++ {\n        if (num % i == 0) {\n            break\n\
  \        }\n    }\n\n    if (num != i) {\n        fmt.Printf(\"\\n%d is a composite\
  \ number.\\n\", num)\n    } else {\n        fmt.Printf(\"\\n%d is a prime number.\\\
  n\", num)\n    }\n}\n```\n\n**输出：**\n![](img/Image00056.jpg)\n\n让我们编写更多程序以更好地理解循环。以下程序计算给定数字的阶乘。数字\
  \ `n` 的阶乘表示为 `n! = n x (n -1) x (n - 2) x ... x 1`。负数的阶乘无法计算，零的阶乘是 1。\n\n```go\n\
  /* Factorial */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n  \
  \  \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明变量存储用户输入、循环计数器和阶乘 */\n\
  \    var i, num int\n    var f int = 1\n\n    /* 提示用户输入数字并使用 Scanf 读取 */\n    fmt.Printf(\"\
  \\nEnter a number: \")\n    fmt.Scanf(\"%d\", &num)\n\n    /* 从 num 运行循环到 1 */\n\
  \    for i = num; i > 0; i-- {\n        f = f * i\n    }\n\n    if (num >= 0) {\n\
  \        fmt.Printf(\"\\nFactorial of %d is %d\\n\", num, f)\n    } else {\n   \
  \     fmt.Printf(\"\\nFactorial of a negative number cannot be calculated\\n\")\n\
  \    }\n}\n```\n\n**输出：**\n![](img/Image00057.jpg)\n\n让我们使用循环编写另一个程序，计算前 `n` 个偶数的和。\n\
  \n```go\n/* Sum of n even numbers */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt\
  \ 包 */\nimport (\n    \"fmt\"\n)\n\n/* 强制性的 main 函数 */\nfunc main() {\n    /* 声明变量存储\
  \ n、循环计数器和和 */\n    var i, n int\n    var even_num, sum int = 1, 0\n\n    /* 提示用户输入数字并使用\
  \ Scanf 读取 */\n    fmt.Printf(\"\\nEnter n: \")\n    fmt.Scanf(\"%d\", &n)\n\n \
  \   fmt.Printf(\"\\nFirst %d even numbers: \\n\\n\", n)\n\n    for i = 1; even_num\
  \ <= n; i++ {\n        if (i % 2 == 0) {\n            fmt.Printf(\"%d \", i)\n \
  \           sum += i\n            even_num++\n        }\n    }\n\n    fmt.Printf(\"\
  \\n\\nSum of above even numbers: %d\\n\", sum)\n}\n```\n\n**输出：**\n![](img/Image00058.jpg)\n\
  \n\n\n\n\n## 12. 数组\n\n数组是相似项目的集合。在编程术语中，Go 语言中的数组是一种包含相同数据类型项目的数据结构。数组内的每个项目称为数组元素（或简称元素）。可以使用元素在数组中的位置来引用该元素，该位置称为索引。数组索引从\
  \ 0 开始，到比数组大小小 1 的位置结束（大小 – 1）。例如，如果我们有一个包含 10 个元素的数组，该数组的第一个元素将位于 0，第二个位于索引 1，第三个位于索引\
  \ 2，……，最后一个元素将位于索引 9。\n\n在 Go 编程语言中，可以使用以下语法声明数组：\n\n```\nvar <数组变量> [<数组大小>] <数据类型>\n\
  ```\n\n示例：\n\n```\nvar array1 [5] int\nvar msg [3] string\nvar x [10] float64\n\
  ```\n\n一旦声明了数组，其元素将获得零值（数值数组将保存 0，字符串数组将保存空字符串）。可以使用由访问操作符（`[]`）括起来的索引来访问单个元素。这样，您可以设置（也可以检索/打印）数组的单个元素。\n\
  \n这是一个示例：\n\n```\n/*声明一个大小为 5 的 int 数组。第一个索引是 0，最后一个索引是 4*/\nvar num_array [5] int\n\
  \n/*将索引 0 处的元素设置为 15*/\nnum_array[0] = 15\n\n/*将索引 1 处的元素设置为 -35*/\nnum_array[1]\
  \ = -35\n\n/*将索引 2 处的元素设置为 0*/\nnum_array[2] = 0\n\n/*将索引 3 处的元素设置为 68*/\nnum_array[3]\
  \ = 68\n\n/*将索引 4 处的元素设置为 18*/\nnum_array[4] = 18\n```\n\n`num_array` 在内存中的样子如下：\n\
  ![](img/Image00059.jpg)\n\n我们现在将编写一个程序，在其中创建一个整数数组，设置元素值并将它们打印出来。可以使用动词 `%v` 或 `%d`\
  \ 打印整个数组。打印单个元素与打印任何其他整数变量相同：\n\n```\n/*数组演示 1*/\n/*包声明*/\npackage main\n\n/*导入语句\
  \ - 导入 fmt 包*/\nimport (\n    \"fmt\"\n)\n\n/*强制的 main 函数*/\nfunc main() {\n   \
  \ /*声明一个包含 7 个整数的数组*/\n    var arr [7] int\n\n    /*设置所有元素的值*/\n    arr[0] = 83\n\
  \    arr[1] = -34\n    arr[2] = 55\n    arr[3] = 97\n    arr[4] = -24\n    arr[5]\
  \ = -11\n    arr[6] = 46\n\n    /*打印整个数组*/\n    fmt.Printf(\"\\n 数组 arr:\\n\\n%v\\\
  n\", arr)\n\n    /*打印索引和对应的值*/\n    fmt.Printf(\"\\n 索引 0 处的值: ==> %d\", arr[0])\n\
  \    fmt.Printf(\"\\n 索引 1 处的值: ==> %d\", arr[1])\n    fmt.Printf(\"\\n 索引 2 处的值:\
  \ ==> %d\", arr[2])\n    fmt.Printf(\"\\n 索引 3 处的值: ==> %d\", arr[3])\n    fmt.Printf(\"\
  \\n 索引 4 处的值: ==> %d\", arr[4])\n    fmt.Printf(\"\\n 索引 5 处的值: ==> %d\", arr[5])\n\
  \    fmt.Printf(\"\\n 索引 6 处的值: ==> %d\\n\", arr[6])\n}\n```\n\n输出：\n![](img/Image00060.jpg)\n\
  \n也可以在声明时使用以下语法初始化数组：\n\n```\nvar <数组变量> = [<可选大小>] <数据类型> {<用逗号分隔的元素>}\n```\n\n\
  示例：\n\n```\nvar arr1 = [] int {-3, 0, 3}\nvar arr2 = [6] float32 {0.36, -0.25, 0.01,\
  \ -0.67, 0.88, 0.73}\n```\n\n这是一个演示数组初始化的程序：\n\n```\n/*数组演示 2*/\n/*包声明*/\npackage\
  \ main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n    \"fmt\"\n)\n\n/*强制的 main 函数*/\nfunc\
  \ main() {\n    /*声明一个包含 5 个浮点数的数组并初始化*/\n    var arr = [5] float32 {4.6, -65.21,\
  \ 0.64, -12.76, 25.75}\n\n    /*打印整个数组*/\n    fmt.Printf(\"\\n 数组 arr:\\n\\n%v\\\
  n\", arr)\n\n    /*打印索引和对应的值*/\n    fmt.Printf(\"\\n 索引 0 处的值: ==> %f\", arr[0])\n\
  \    fmt.Printf(\"\\n 索引 1 处的值: ==> %f\", arr[1])\n    fmt.Printf(\"\\n 索引 2 处的值:\
  \ ==> %f\", arr[2])\n    fmt.Printf(\"\\n 索引 3 处的值: ==> %f\", arr[3])\n    fmt.Printf(\"\
  \\n 索引 4 处的值: ==> %f\\n\", arr[4])\n}\n```\n\n输出：\n![](img/Image00061.jpg)\n\n数组可以是任何数据类型。初始化数组时，可以指定大小，也可以不指定。大小将根据您在初始化时设置的元素数量自动确定。在程序的任何位置，您都可以使用函数\
  \ `len(<数组变量>)` 来确定数组的大小。此外，每次手动访问元素可能不是最佳方式——循环在处理数组方面做得很好。\n\n这是一个演示这些概念的示例：\n\
  \n```\n/*数组演示 3*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n    \"\
  fmt\"\n)\n\n/*强制的 main 函数*/\nfunc main() {\n    /*声明一个包含 10 个字符串的数组并初始化*/\n    var\
  \ country = [] string {\"USA\", \"UK\", \"India\", \"Brazil\", \"South Africa\"\
  , \"Argentina\", \"New Zealand\", \"Russia\", \"Morocco\", \"Latvia\"}\n\n    /*打印整个数组*/\n\
  \    fmt.Printf(\"\\n 数组 country:\\n\\n%v\\n\", country)\n\n    /*使用 for 循环打印索引和对应的值*/\n\
  \    /*使用 len 函数获取数组的大小*/\n    size := len(country)\n\n    for i := 0; i < size;\
  \ i++ {\n        fmt.Printf(\"\\n 索引 %d 处的值: ==> %s\", i, country[i])\n    }\n \
  \   fmt.Printf(\"\\n\")\n}\n```\n\n输出：\n![](img/Image00062.jpg)\n\n让我们再看几个编程示例，以更好地理解数组。这是一个示例，它从用户处获取\
  \ 5 个整数作为输入并将其保存在数组中，计算这些整数的总和和平均值：\n\n```\n/*数组输入*/\n/*包声明*/\npackage main\n\n\
  /*导入语句 - 导入 fmt 包*/\nimport (\n    \"fmt\"\n    \"strconv\"\n)\n\n/*强制的 main 函数*/\n\
  func main() {\n    /*声明变量*/\n    var arr [5] int\n    var sum int = 0\n    var num_str\
  \ string\n\n    /*声明一个变量来存储平均值*/\n    var avg float32\n\n    /*提示用户输入 5 个元素，使用 for\
  \ 循环*/\n    for i := 0; i < 5; i++ {\n        fmt.Printf(\"\\n 请输入索引 %d 处的元素: \"\
  , i)\n        fmt.Scanln(&num_str)\n\n        /*将 num_str 转换为整数*/\n        num,\
  \ err := strconv.Atoi(num_str)\n\n        /*将 num 赋值给 arr[i]*/\n        arr[i] =\
  \ num\n\n        /*将 err 赋值给空标识符*/\n        _ = err\n\n        /*持续计算总和*/\n    \
  \    sum += arr[i]\n    }\n\n    /*计算平均值*/\n    avg = float32(sum) / 5.0\n    fmt.Printf(\"\
  \\n 数组 arr:\\n%v\\n 总和: %d\\n 平均值: %f\\n\", arr, sum, avg)\n}\n```\n\n输出：\n![](img/Image00063.jpg)\n\
  \n让我们编写一个程序，从用户处获取 5 个整数作为输入，将它们保存在数组中并反转该数组：\n\n```\n/*反转数组*/\n/*包声明*/\npackage\
  \ main\n\n/*导入语句 - 导入 fmt, strconv 包*/\nimport (\n    \"fmt\"\n    \"strconv\"\n\
  )\n\n/*强制的 main 函数*/\nfunc main() {\n    /*声明变量*/\n    var arr [5] int\n    var\
  \ num_str string\n\n    /*提示用户输入 5 个元素，使用 for 循环*/\n    for i := 0; i < 5; i++ {\n\
  \        fmt.Printf(\"\\n 请输入索引 %d 处的元素: \", i)\n        fmt.Scanln(&num_str)\n\n\
  \        /*将 num_str 转换为整数*/\n        num, err := strconv.Atoi(num_str)\n\n    \
  \    /*将 num 赋值给 arr[i]*/\n        arr[i] = num\n\n        /*将 err 赋值给空标识符*/\n \
  \       _ = err\n    }\n\n    fmt.Printf(\"\\n 原始数组:\\n%v\\n\", arr)\n\n    /*反转数组*/\n\
  \    for i := 0; i < 5 / 2; i++ {\n        temp := arr[i]\n        arr[i] = arr[4\
  \ - i]\n        arr[4 - i] = temp\n    }\n\n    fmt.Printf(\"\\n 反转后的数组:\\n%v\\\
  n\", arr)\n}\n```\n\n输出：\n![](img/Image00064.jpg)\n\n\n\n\n\n## 13. 函数\n\n函数是一段可复用的代码，可以被“调用”以执行特定任务。我们已经使用过一些函数，例如\
  \ `Printf`、`Scanln`、`Atoi` 等。这些函数由他人编写，我们使用它们让编程工作变得更轻松。`Scanln` 和 `Println` 是 I/O\
  \ 函数，它们隐式地与设备（直接或间接）协作以完成所需工作。想象一下，如果每次想在控制台打印内容都要编写一大段代码，编程将会多么不便。因为 `Println`\
  \ 和 `Scanln` 函数已由某人在某处定义好，像我们这样的程序员只需调用它们即可完成工作。在本章中，我们将学习编写自己的函数。函数主题大体可分为两类——函数定义和函数调用。\n\
  \n## 13.1 函数定义\n\n函数定义是一段定义函数功能的代码。例如，一个用于添加两个数字的函数，其函数定义中将包含添加两个数字的逻辑。一个程序可以包含零个或多个用户定义函数。所有函数都应在\
  \ `main` 函数**外部**定义。定义函数的最佳位置在包声明语句和 `main` 函数之间。以下是函数定义的通用语法：\n\n```\nfunc <function\
  \ name> (<arguments>) <return type> {\n    /*Function Body*/\n    //Statements\n\
  }\n```\n\n示例：\n\n```\nfunc helloFunction() {\n    fmt.Printf(\"\\nHello! We are\
  \ inside helloFunction!\\n\")\n}\n```\n\n以下是基本函数定义的组成部分：\n\n*   **函数名**\n    * \
  \  函数名是赋予函数的名称，在上述代码片段中由 `<function name>` 标记。此名称用于标识和调用函数。函数命名规则与标识符/变量命名规则相同。\n\
  *   **参数**\n    *   参数（在上述代码片段中由 `<arguments>` 标记）是函数“接收”到局部变量中的值。这些值在函数调用时传递给函数。一个函数可以接受零个或多个参数。当有多个参数时，应使用逗号分隔。参数也称为形参。\n\
  *   **返回类型**\n    *   函数可以选择性地将一个值返回给调用函数。特定函数返回值的数据类型应在返回类型字段中指定，在上述代码片段中由 `<return\
  \ type>` 标记。\n*   **函数体**\n\n\n\n\n\n### 函数体\n\n函数体是函数的核心部分，实际工作在此完成。例如，若有一个函数用于计算给定数字的阶乘，负责计算阶乘的代码即位于定义的这一部分。以下代码片段展示了不同类型的函数：\n\
  \n```go\n/*Function that accepts no arguments and returns no value*/\nfunc sayHello()\
  \ {\n    fmt.Printf(\"\\nJust a function that prints Hello on the console.\")\n\
  }\n\n/*Function that accepts one argument and returns no value*/\nfunc showValue(name\
  \ string) {\n    fmt.Printf(\"\\nReceived name = %s\", name)\n}\n\n/*Function that\
  \ accepts one argument and returns one value*/\nfunc doubleIt(x int) int {\n   \
  \ return (x * 2)\n}\n\n/*Function that accepts three arguments and returns two values*/\n\
  func doMath(a int, b int, c int) (int, float32) {\n    sum := a + b + c\n    avg\
  \ = float32(sum) / 3.0\n    return sum, avg\n}\n```\n\n## 13.2 函数调用\n\n已定义的函数不会自动执行，需要被调用（可能从另一个函数，如\
  \ `main` 函数中调用）。函数通过其名称调用，并按函数定义中指定的顺序传递完全相同数量的参数。通用语法如下：\n\n```\n<function name>(<arguments>)\n\
  ```\n\n示例：`myFunction()`\n\n下面调用上一节定义的每个函数：\n\n```go\nsayHello()\nshowValue(\"Sarah\"\
  )\nx = doubleIt(100)\nsum, avg = doMath(1, 2, 3)\n```\n\n以下是一个不接受参数且无返回值的简单函数示例：\n\
  \n```go\n/*Function Demo 1*/\n/*Package Declaration*/\npackage main\n\n/*Import\
  \ Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*User defined function*/\n\
  /*This function accepts no arguments and returns no value*/\nfunc myFunction() {\n\
  \    fmt.Printf(\"\\n[Inside myFunction] - Hello! from myFunction\\n\")\n}\n\n/*Mandatory\
  \ main function*/\nfunc main() {\n    fmt.Printf(\"\\n[Inside main] - now calling\
  \ myFunction\\n\")\n    /*Call myFunction*/\n    myFunction()\n    fmt.Printf(\"\
  \\n[Inside main] - reaching the end of main function/program\\n\")\n}\n```\n\n输出：\n\
  ![](img/Image00065.jpg)\n\n## 13.3 向函数传递参数\n\n在函数调用时，通过将参数括在括号内来传递。多个参数用逗号分隔。参数只能传递给接受参数的函数。值得注意的是，函数调用时传递的参数数量和顺序必须与函数定义中一致。\n\
  \n下面是一个 Go 程序，演示接受两个整数并计算其和的函数：\n\n```go\n/*Function Demo 2*/\n/*Package Declaration*/\n\
  package main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\
  \n)\n\n/*User defined function*/\n/*This function accepts 2 arguments and returns\
  \ no value*/\nfunc addTwoNumbers(a int, b int) {\n    sum := a + b\n    fmt.Printf(\"\
  \\n[Inside addTwoNumbers] - Received two arguments: \\n\\na = %d, b = %d\\n\\n\"\
  , a, b)\n    fmt.Printf(\"\\n[Inside addTwoNumbers] - Sum = %d\\n\", sum)\n}\n\n\
  /*Mandatory main function*/\nfunc main() {\n    fmt.Printf(\"\\n[Inside main] -\
  \ now calling addTwoNumbers, passing 5 and 9 as arguments\\n\")\n    /*Call addTwoNumbers*/\n\
  \    addTwoNumbers(5, 9)\n    fmt.Printf(\"\\n[Inside main] - reaching the end of\
  \ main function/program\\n\")\n}\n```\n\n输出：\n![](img/Image00066.jpg)\n\n## 13.4\
  \ 返回值\n\n函数可借助 `return` 语句向调用函数返回值。通用语法如下：\n\n```\nreturn <values>\n```\n\n示例：\n\
  \n```go\n/*Single value*/\nreturn name\n\n/*Multiple values*/\nreturn x, y, z\n\
  ```\n\n调用返回值的函数时，必须指定变量接收返回值，否则将丢失。接收多个值时需指定多个变量，返回多值时将执行多重赋值。示例如下：\n\n```go\n/*Receive\
  \ single value*/\nname = getName()\n\n/*Receive multiple values*/\na, b, c = getValues()\n\
  ```\n\n下面编写一个函数，接受三个整数，计算平均值并返回：\n\n```go\n/*Function Demo 3*/\n/*Package Declaration*/\n\
  package main\n\n/*Import Statement - import fmt package*/\nimport (\n    \"fmt\"\
  \n)\n\n/*User defined function*/\n/*This function accepts 3 arguments and returns\
  \ one value*/\nfunc findAverage(a int, b int, c int) float32 {\n    fmt.Printf(\"\
  \\n[Inside findAverage] - Received three arguments: \\n\\na = %d, b = %d, c = %d\\\
  n\\n\", a, b, c)\n    /*Calculate sum*/\n    sum := a + b + c\n    /*Calculate average,\
  \ use type casting to convert from int to float*/\n    avg := (float32(sum) / 3.0)\n\
  \    fmt.Printf(\"\\n[Inside findAverage] - Returning avg back to main\\n\")\n \
  \   return avg\n}\n\n/*Mandatory main function*/\nfunc main() {\n    fmt.Printf(\"\
  \\n[Inside main] - now calling findAverage, passing 2, 8 and -3 as arguments\\n\"\
  )\n    /*Call findAverage, receive returned value in average variable (short declared)*/\n\
  \    average := findAverage(2, 8, -3)\n    fmt.Printf(\"\\n[Inside main] - average\
  \ = %f\\n\", average)\n    fmt.Printf(\"\\n[Inside main] - reaching the end of main\
  \ function/program\\n\")\n}\n```\n\n输出：\n![](img/Image00067.jpg)\n\n再编写一个程序，演示返回多个值的函数。定义一个函数接受两个整数，返回四个值——和、差、积、商：\n\
  \n```go\n/*Function Demo 4*/\n/*Package Declaration*/\npackage main\n\n/*Import\
  \ Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*User defined function*/\n\
  /*This function accepts 2 arguments and returns 4 values*/\nfunc performArithmetics(a\
  \ int, b int) (int, int, int, float32) {\n    fmt.Printf(\"\\n[Inside performArithmetics]\
  \ - Received 2 arguments: \\n\\na = %d, b = %d\\n\\n\", a, b)\n    /*Calculate sum,\
  \ diff, prod, quo*/\n    sum := a + b\n    diff := a - b\n    prod := a * b\n  \
  \  quo := float32(a) / float32(b)\n    fmt.Printf(\"\\n[Inside performArithmetics]\
  \ - Returning sum, diff, prod, quo back to main\\n\")\n    return sum, diff, prod,\
  \ quo\n}\n\n/*Mandatory main function*/\nfunc main() {\n    /*Declare variables\
  \ to store return values*/\n    var sum, diff, prod int\n    var quo float32\n \
  \   fmt.Printf(\"\\n[Inside main] - now calling performArithmetics, passing 15 and\
  \ 6 as arguments\\n\")\n    /*Call performArithmetics, receive returned values in\
  \ sum, diff, prod, quo*/\n    sum, diff, prod, quo = performArithmetics(15, 6)\n\
  \    fmt.Printf(\"\\n[Inside main] - sum = %d, diff = %d, prod = %d, quo = %f\\\
  n\", sum, diff, prod, quo)\n    fmt.Printf(\"\\n[Inside main] - reaching the end\
  \ of main function/program\\n\")\n}\n```\n\n输出：\n![](img/Image00068.jpg)\n\n## 13.5\
  \ 数组作为参数传递\n\n将数组作为参数传递给函数的过程与传递其他参数相同。通用语法如下：\n\n```go\nfunc <function name>(<array\
  \ variable>[] <data type>) <return type> {\n    /*Statements*/\n}\n\n/*OR*/\nfunc\
  \ <function name>(<array variable>[<size>] <data type>) <return type> {\n    /*Statements*/\n\
  }\n```\n\n示例：\n\n```go\nfunc demoFunction(names []string) {\n    /*Statements*/\n\
  }\n\n/*OR*/\nfunc demoFunction(names [10]string) {\n    /*Statements*/\n}\n```\n\
  \n> **注意**：虽然在大多数情况下不指定数组大小程序也能正常运行，但建议始终注明数组大小。\n\n下面编写一个 Go 程序，接受一个整数数组，返回所有元素的和及其平均值：\n\
  \n```go\n/*Function Demo 5*/\n/*Package Declaration*/\npackage main\n\n/*Import\
  \ Statement - import fmt package*/\nimport (\n    \"fmt\"\n)\n\n/*User defined function*/\n\
  /*This function accepts an array as an argument and returns 2 values*/\nfunc getSumAvg(arr\
  \ [10]int) (int, float32) {\n    fmt.Printf(\"\\n[Inside getSumAvg] - Received 1\
  \ argument: \\n\\narr[10] = %v\\n\\n\", arr)\n    /*Calculate sum, avg*/\n    sum\
  \ := 0\n    for i := 0; i < 10; i++ {\n        /*Keep calculating sum*/\n      \
  \  sum += arr[i]\n    }\n    /*Calculate average*/\n    avg := float32(sum) / 10.0\n\
  \    fmt.Printf(\"\\n[Inside getSumAvg] - Returning sum, avg back to main\\n\")\n\
  \    return sum, avg\n}\n\n/*Mandatory main function*/\nfunc main() {\n    /*Declare\
  \ an integer array of 10 elements*/\n    var arr = [10]int{9, -5, 6, 12, -3, 4,\
  \ -1, -1, 25, 10}\n    /*Declare variables to store sum and average*/\n    var sum\
  \ int\n    var avg float32\n    fmt.Printf(\"\\n[Inside main] - now calling getSumAvg,\
  \ passing arr = %v as an argument\\n\", arr)\n    /*Call getSumAvg, receive returned\
  \ values in sum, avg*/\n    sum, avg = getSumAvg(arr)\n    fmt.Printf(\"\\n[Inside\
  \ main] - sum = %d, avg = %f\\n\", sum, avg)\n    fmt.Printf(\"\\n[Inside main]\
  \ - reaching the end of main function/program\\n\")\n}\n```\n\n输出：\n![](img/Image00069.jpg)\n\
  \n\n\n\n\n## 14. 字符串\n\n字符串是字符的序列。可以通过将一系列字符用双引号括起来来形成常量字符串。就像数组一样，可以通过指定索引，借助访问操作符（`[]`）来访问单个字符。字符串的索引从\
  \ 0 开始，到比字符串大小小 1 的位置结束。字符串的长度可以使用 `len(<string>)` 函数来确定。使用访问操作符，只能读取单个字符，而不能设置。\n\
  \n下面是一个演示这些字符串基础知识的简单 Go 程序：\n\n```go\n/*String Demo 1*/\n/*Package Declaration*/\n\
  package main\n\n/*Import Statement - import fmt package*/\nimport (\n\t\"fmt\"\n\
  )\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Declare and initialize a string*/\n\
  \tvar name string = \"Monica\"\n\n\t/*Fetch length of the string*/\n\tlength :=\
  \ len(name)\n\n\t/*Display the string and its length*/\n\tfmt.Printf(\"\\nname =\
  \ %s, length = %d\\n\", name, length)\n\n\t/*Use for loop to print individual characters\
  \ of the string*/\n\tfor i := 0; i < length; i++ {\n\t\tfmt.Printf(\"\\nCharacter\
  \ at index %d ==> %c\\n\", i, name[i])\n\t}\n}\n```\n\n输出：\n![](img/Image00070.jpg)\n\
  \n可以使用 rune 函数将字符串的单个字符获取到字符数组中，如下所示：\n\n```go\n<character array var> = []rune(<String>)\n\
  ```\n\n示例：\n```go\nc_arr = []rune(str)\n```\n\n可以使用 `string` 函数将字符数组转换为字符串，如下所示：\n\
  \n```go\n<string> = string(<character array variable>)\n```\n\n示例：\n```go\nstr =\
  \ string(char_array)\n```\n\n下面是一个演示该函数工作原理的程序：\n\n```go\n/*Rune demo*/\n/*Package\
  \ Declaration*/\npackage main\n\n/*Import Statement - import fmt package*/\nimport\
  \ (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\tstr := \"Excelsior\"\
  \n\n\tstr_length := len(str)\n\n\t/*Use rune to fetch characters in an array*/\n\
  \tstr_char := []rune(str)\n\n\tfmt.Printf(\"\\nstr: %s, length: %d\", str, str_length)\n\
  \n\tfmt.Printf(\"\\n\\nCharacter array: %c\\n\", str_char)\n\n\tfmt.Printf(\"\\\
  nstr_char character array elements: \\n\")\n\n\tfor i := 0; i < str_length; i++\
  \ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\", i, str_char[i])\n\t\
  }\n}\n```\n\n输出：\n![](img/Image00071.jpg)\n\n有一个名为 `strings` 的包，它包含许多有助于字符串操作的内置函数。让我们来看看其中几个重要的：\n\
  \n## 14.1 连接字符串\n\n可以使用 `strings.Join` 函数连接两个或多个字符串。为此，待连接的字符串应放在一个字符串数组中。以下是通用语法：\n\
  \n```go\nstrings.Join(<string array>, <separator>)\n```\n\n示例：\n```go\nbig_string\
  \ := strings.Join(arr, \" \")\n```\n\n还有一种连接两个或多个字符串的更简单方法——使用 `+` 运算符。通用语法：\n\n\
  ```go\n<concatenated string variable> = <string 1> + <string 2> + ... <string n>\n\
  ```\n\n示例：\n```go\nbig_str := \"hello\" + \" \" + \"world!\"\n```\n\n让我们编写一个程序来演示这两种连接方法：\n\
  \n```go\n/*String Demo 2 - Concatenation*/\n/*Package Declaration*/\npackage main\n\
  \n/*Import Statement - import fmt, strings packages*/\nimport (\n\t\"fmt\"\n\t\"\
  strings\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Declare and initialize\
  \ a string array*/\n\tvar words = []string{\"This\", \"is\", \"an\", \"array\",\
  \ \"of\", \"7\", \"strings\"}\n\n\t/*Display the string array*/\n\tfmt.Printf(\"\
  \\nwords array: %s\\n\", words)\n\n\t/*Concatenate using strings.Join*/\n\twords_str\
  \ := strings.Join(words, \" \")\n\n\tfmt.Printf(\"\\nConcatenated string (using\
  \ strings.Join): %s\\n\", words_str)\n\n\t/*Short declare some strings*/\n\tstr1\
  \ := \"Go\"\n\tstr2 := \"Programming\"\n\tstr3 := \"Language\"\n\n\t/*Concatenate\
  \ str1, str2 and str3*/\n\tstr4 := str1 + \" \" + str2 + \" \" + str3\n\n\tfmt.Printf(\"\
  \\nstr1 = %s\\nstr2 = %s\\nstr3 = %s\\n\\nConcatenated string (using + operator)\\\
  n\\nstr4 = %s\\n\", str1, str2, str3, str4)\n}\n```\n\n输出：\n![](img/Image00072.jpg)\n\
  \n## 14.2 比较字符串\n\n`strings` 包中的 `Compare` 函数用于比较两个字符串。\n\n语法：\n```go\nstrings.Compare(<string1>,\
  \ <string2>)\n```\n\n示例：\n```go\nresult := strings.Compare(string1, string2)\n```\n\
  \n如果两个字符串相同，该函数返回 0；如果 `string1` 在字典序上小于 `string2`，则返回 `-1`；如果 `string1` 在字典序上大于\
  \ `string2`，则返回 `1`。\n\n让我们编写一个程序从用户处读取两个字符串并进行比较：\n\n```go\n/*Compare two strings*/\n\
  /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt, bufio,\
  \ os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\
  \n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input reader variable\
  \ of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\n\
  \t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string: \")\n\
  \n\t/*Read string using ReadString function*/\n\tstr1, _ := inputReader.ReadString('\\\
  n')\n\n\tfmt.Printf(\"\\nEnter another string: \")\n\n\t/*Read string using ReadString\
  \ function*/\n\tstr2, _ := inputReader.ReadString('\\n')\n\n\t/*Compare str1 and\
  \ str2 using strings.Compare*/\n\tresult := strings.Compare(str1, str2)\n\n\tif\
  \ result == 0 {\n\t\tfmt.Printf(\"\\nBoth strings are the same.\\n\")\n\t} else\
  \ if result > 0 {\n\t\tfmt.Printf(\"\\nFirst string is lexicographically greater\
  \ than the second string.\\n\")\n\t} else {\n\t\tfmt.Printf(\"\\nSecond string is\
  \ lexicographically greater than the first string.\\n\")\n\t}\n}\n```\n\n输出：\n![](img/Image00073.jpg)\n\
  \n## 14.3 在另一个字符串中搜索字符串\n\n`strings` 包中的 `Contains` 函数用于检查一个字符串是否存在于另一个字符串中。如果字符串存在，该函数返回布尔值\
  \ `true`，如果不存在则返回 `false`。\n\n语法：\n```go\nstrings.Contains(<main string>, <string\
  \ to be searched>)\n```\n\n示例：\n```go\nresult := strings.Contains(\"Hello World\"\
  , \"World\")\n```\n\n此外，可以使用 `strings` 包中的 `Index` 函数来确定给定字符串在主字符串中首次出现的位置。如果字符串不存在于主字符串中，该函数返回\
  \ `-1`。\n\n下面是一个从用户处读取两个字符串并在主字符串中搜索第二个字符串的程序：\n\n```go\n/*Search for a string within\
  \ another string*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement\
  \ - import fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\
  \t\"os\"\n\t\"strings\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create\
  \ an input reader variable of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
  \n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter the main string:\
  \ \")\n\n\t/*Read string using ReadString function*/\n\tmain_str, _ := inputReader.ReadString('\\\
  n')\n\n\tfmt.Printf(\"\\nEnter the string to be searched inside the main string:\
  \ \")\n\n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
  n')\n\n\t/*Use trim function to remove all \\n and \\r characters*/\n\tstr = strings.Trim(str,\
  \ \"\\n\\r\")\n\n\tresult := strings.Contains(main_str, str)\n\n\tif result == true\
  \ {\n\t\tfmt.Printf(\"\\nThe given string is present in the main string.\")\n\n\t\
  \t/*Find the first occurrence*/\n\t\tfirst := strings.Index(main_str, str)\n\n\t\
  \t/*Print first index*/\n\t\tfmt.Printf(\"\\n\\nFirst Occurrence: %d\\n\", first)\n\
  \t} else {\n\t\tfmt.Printf(\"\\nThe given string is not present in the main string.\\\
  n\")\n\t}\n}\n```\n\n输出：\n![](img/Image00074.jpg)\n\n## 14.4 修剪字符串\n\n可能需要从字符串中移除不需要的字符。可以使用\
  \ `strings` 包中的 `Trim` 函数，如下所示：\n\n```go\n<trimmed_string> = strings.Trim(<string>,\
  \ <character set to be trimmed>)\n```\n\n从用户处读取字符串时，`\\n` 或 `\\r` 或两者都有很大概率被追加到字符串中。可以使用\
  \ `Trim` 函数移除这些字符：\n\n```go\nnew_str = strings.Trim(str, \"\\n\\r\")\n```\n\n实际上，让我们看看从用户处读取字符串时会发生什么——我们将字符串转换为字符数组来查看每个字符：\n\
  \n```go\n/*Pre-trim demo*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement\
  \ - import fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\
  \t\"os\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input reader\
  \ variable of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
  \n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string: \"\
  )\n\n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
  n')\n\n\tstr_length := len(str)\n\n\tfmt.Printf(\"\\nLength: %d\", str_length)\n\
  \n\t/*Use rune to fetch characters in an array*/\n\tstr_char := []rune(str)\n\n\t\
  fmt.Printf(\"\\n\\nCharacter array: \\n %c \\n\", str_char)\n\n\tfor i := 0; i <\
  \ str_length; i++ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\", i, str_char[i])\n\
  \t}\n}\n```\n\n输出：\n![](img/Image00075.jpg)\n\n我们输入了单词 Linux，它显然有 5 个字符。但长度显示为 7。此外，在打印字符时，我们在位置\
  \ 5 和 7 看到了两个空字符。让我们稍微调查一下，看看发生了什么。我们将修改以下语句：\n\n```go\nfmt.Printf(\"\\nCharacter\
  \ at index %d ==> %c\\n\", i, str_char[i])\n```\n\n改为：\n\n```go\nfmt.Printf(\"\\\
  nCharacter at index %d ==> %X\\n\", i, str_char[i])\n```\n\n新语句将打印字符的十六进制代码。这是新的输出：\n\
  ![](img/Image00076.jpg)\n\n索引 5 处的字符是 D，即 `0x0D`，索引 6 处的字符是 A，即 `0x0A`。如果你在 ASCII\
  \ 表中核对这些十六进制值，就会意识到这些字符分别是 `\\r` 和 `\\n`。\n\n让我们使用 `Trim` 函数看看会发生什么。这是新程序：\n\n```go\n\
  /*Trim demo*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
  \ fmt, bufio, os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\
  \t\"strings\"\n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input\
  \ reader variable of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
  \n\t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string: \"\
  )\n\n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
  n')\n\n\t/*Trim to remove unwanted characters*/\n\tstr = strings.Trim(str, \"\\\
  n\\r\")\n\n\tstr_length := len(str)\n\n\tfmt.Printf(\"\\nLength: %d\", str_length)\n\
  \n\t/*Use rune to fetch characters in an array*/\n\tstr_char := []rune(str)\n\n\t\
  fmt.Printf(\"\\n\\nCharacter array: \\n %c \\n\", str_char)\n\n\tfor i := 0; i <\
  \ str_length; i++ {\n\t\tfmt.Printf(\"\\nCharacter at index %d ==> %c\\n\", i, str_char[i])\n\
  \t}\n}\n```\n\n输出：\n![](img/Image00077.jpg)\n\n## 14.5 大小写转换\n\n可以分别使用 `ToUpper`\
  \ 和 `ToLower` 函数将字符串转换为大写和小写。\n\n语法：\n```go\n<ustring> = strings.ToUpper(<string>)\n\
  <lstring> = strings.ToLower(<string>)\n```\n\n示例：\n```go\nstr1 = strings.ToUpper(s)\n\
  str2 = strings.ToLower(s)\n```\n\n下面是一个演示大小写转换的程序：\n\n```go\n/*Case conversion demo*/\n\
  /*Package Declaration*/\npackage main\n\n/*Import Statement - import fmt, bufio,\
  \ os, strings package*/\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\
  \n)\n\n/*Mandatory main function*/\nfunc main() {\n\t/*Create an input reader variable\
  \ of type NewReader using stdin*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\n\
  \t/*Prompt the user to enter something*/\n\tfmt.Printf(\"\\nEnter a string: \")\n\
  \n\t/*Read string using ReadString function*/\n\tstr, _ := inputReader.ReadString('\\\
  n')\n\n\t/*Trim to remove unwanted characters*/\n\tstr = strings.Trim(str, \"\\\
  n\\r\")\n\n\t/*Convert to upper and lower case*/\n\tu_str := strings.ToUpper(str)\n\
  \tl_str := strings.ToLower(str)\n\n\tfmt.Printf(\"\\nOriginal string: %s\\nUpper\
  \ case string: %s\\nLower case string: %s\\n\", str, u_str, l_str)\n}\n```\n\n输出：\n\
  ![](img/Image00078.jpg)\n\n\n\n\n## 15. 指针\n\n当声明一个变量时，会为其分配一块内存区域来存储其内容。这块内存区域有一个唯一可识别的地址。指针是一种特殊的变量，用于存储其他变量的地址。这里需要注意的一个重要事项是：指针只能存储相同数据类型变量的内存地址。例如，整型指针将存储整型变量的内存地址；字符串指针不能存储浮点型变量的内存地址。\n\
  \n指针变量使用以下语法声明：\n\n```go\nvar <pointer variable> *<data type>\n```\n\n示例：\n\n```go\n\
  /*Integer pointer*/\nvar ptr *int\n\n/*String pointers*/\nvar sptr1, sptr2 *string\n\
  \n/*Floating point pointer*/\nvar p *float64\n```\n\n可以通过在变量名前加上 `&` 符号来获取变量的内存地址。该地址只能赋值给相同数据类型的指针变量。具体操作如下：\n\
  \n```go\nvar name string = \"Jason\"\nvar sptr *string\nsptr = &name\n\n/*Short\
  \ declare a pointer*/\nvar address string = \"NY\"\nadd_ptr := &address\n\n/*Declare\
  \ and initialize pointers*/\nvar a, b int\nvar aptr, bptr *int = &a, &b\n```\n\n\
  当指针持有某个变量的地址时，称该指针变量“指向”该变量。让我们编写一个程序来创建几个变量，并创建相应数量的指针指向这些变量：\n\n```go\n/*Pointers\
  \ Demo 1*/\n/*Package Declaration*/\npackage main\n\n/*Import Statement - import\
  \ fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\nfunc main()\
  \ {\n\t/*Declare and initialize a string*/\n\tvar name string = \"Shaun\"\n\n\t\
  /*Declare a string pointer*/\n\tvar name_ptr *string\n\n\t/*Assign the address of\
  \ name to name_ptr*/\n\tname_ptr = &name\n\n\t/*Short declare and initialize int\
  \ variable*/\n\tage := 19\n\n\t/*Short declare and initialize integer pointer*/\n\
  \taptr := &age\n\n\t/*Declare and initialize float variables*/\n\tvar height, weight\
  \ float32 = 182.36534, 165.75124\n\n\t/*Declare and initialize pointer variables*/\n\
  \tvar hptr, wptr *float32 = &height, &weight\n\n\t/*Print everything*/\n\tfmt.Printf(\"\
  \\nname = %s\\nname_ptr (address of name var) = %v\\n\", name, name_ptr)\n\tfmt.Printf(\"\
  \\nage = %d\\natpr (address of age var) = %v\\n\", age, aptr)\n\tfmt.Printf(\"\\\
  nheight = %f\\nhtpr (address of height var) = %v\\n\", height, hptr)\n\tfmt.Printf(\"\
  \\nweight = %f\\nwtpr (address of weight var) = %v\\n\", weight, wptr)\n}\n```\n\
  \n输出：\n![](img/Image00079.jpg)\n\n在该程序中，我们仅显示了变量的内容及其内存地址。此时你可能还无法理解其意义。你可能会问——变量的内存地址有什么用？我们马上就会讲到。我们可以**解引用**指针，以直接访问指针指向的内存地址处存储的值。为了解引用指针，必须在指针变量前加上\
  \ `*` 符号。以下代码片段解释了这一概念：\n\n```go\nvar x int = 90\nvar ptr *int = &x\n/*Dereference\
  \ ptr to access the value of x and assign it to y*/\ny := *ptr\n```\n\n该片段的工作原理如下图所示：\n\
  ![](img/Image00080.jpg)\n\n存在一个整型变量 `x`，初始化为 `90`。假设该变量存储在内存地址 `0x00a3h` 处。声明一个整型指针变量\
  \ `ptr`，并使用语句 `var ptr *int = &x` 将 `x` 的地址赋值给它。现在 `ptr` 持有 `0x00a3h`。接着，我们解引用 `ptr`\
  \ 以访问内存地址 `0x00a3h` 处的值（`90`）并将其复制给另一个变量 `y`（假设 `y` 在地址 `0x01b6h`，但这在本例中无关紧要）。解引用和复制通过语句\
  \ `y := *ptr` 完成。在本例中，我们在不接触源变量的情况下，成功将一个变量的内容复制到了另一个变量。\n\n让我们通过一个 Go 程序来理解这一概念：\n\
  \n```go\n/*Pointers Demo 2*/\n/*Package Declaration*/\npackage main\n\n/*Import\
  \ Statement - import fmt package*/\nimport (\n\t\"fmt\"\n)\n\n/*Mandatory main function*/\n\
  func main() {\n\t/*Declare and initialize a string*/\n\tvar name string = \"Anabelle\"\
  \n\n\t/*Declare a string pointer*/\n\tvar name_ptr *string\n\n\t/*Assign the address\
  \ of name to name_ptr*/\n\tname_ptr = &name\n\n\t/*Short declare and initialize\
  \ int variable*/\n\tage := 33\n\n\t/*Short declare and initialize integer pointer*/\n\
  \taptr := &age\n\n\t/*Print everything*/\n\tfmt.Printf(\"\\nname = %s\\nname_ptr\
  \ = %v\\n*name_ptr = %s\\n\", name, name_ptr, *name_ptr)\n\tfmt.Printf(\"\\nage\
  \ = %d\\natpr = %v\\n*aptr = %d\\n\", age, aptr, *aptr)\n\n\t/*Modify values of\
  \ name and age without touching name and age*/\n\t*name_ptr = \"Diorah\"\n\t*aptr\
  \ = 21\n\n\tfmt.Printf(\"\\nname = %s\\nname_ptr = %v\\n*name_ptr = %s\\n\", name,\
  \ name_ptr, *name_ptr)\n\tfmt.Printf(\"\\nage = %d\\natpr = %v\\n*aptr = %d\\n\"\
  , age, aptr, *aptr)\n}\n```\n\n输出：\n![](img/Image00081.jpg)\n\n如上所示，有两个变量 `name`\
  \ 和 `age` 持有任意初始值。我们通过解引用指向这些变量的指针（`name_ptr` 和 `aptr`）来修改这些变量的内容。\n\n如果你已经很好地理解了变量和指针的概念，你可能会想——指针只是另一个变量，它也有自己的地址。是的，指针变量有自己的地址。你可以拥有一个指向另一个指针变量的指针。为此，指向另一个指针的指针必须声明为\
  \ `**<data type>`。请看以下代码片段：\n\n```go\nvar x int = 1050\nvar x_ptr *int = &x\nvar\
  \ x_ptr_ptr **int = &xptr\n**x_ptr_ptr = 7000\nfmt.Println(x)\n```\n\n存在一个整型变量 `x`，持有值\
  \ `1050`。指针变量 `x_ptr` 用于持有 `x` 的地址，另一个指针变量 `x_ptr_ptr` 用于持有 `x_ptr` 的值。对 `x_ptr_ptr`\
  \ 进行单次解引用（`*x_ptr_ptr`）将得到 `x_ptr` 的值，即 `x` 的地址。对 `x_ptr_ptr` 进行双重解引用（`**x_ptr_ptr`）将得到\
  \ `x` 的值。语句 `**x_ptr_ptr = 7000` 将把 `x` 的值改为 `7000`。\n\n> **注意**：指针是一个高级主题，在数据结构、系统级编程、嵌入式系统等领域被大量使用。如果本章让你感到困惑，这很正常。你可以毫无问题地继续阅读本书的其余部分。作为初学者，你只需要知道什么是指针以及它有什么作用。\n\
  \n\n\n\n# 结构体\n\n结构体是一种用户定义的数据类型，用于存储元素的集合。与数组不同，元素可以是任意数据类型。结构体元素也称为字段。\n\n使用以下语法来定义结构体：\n\
  \n```\ntype <结构体名称> struct {\n    <字段 1> <字段 1 的数据类型>\n    <字段 2> <字段 2 的数据类型>\n\
  \    <字段 3> <字段 3 的数据类型>\n    ...\n    <字段 n> <字段 n 的数据类型>\n}\n```\n\n让我们定义一个结构体来存储学生的详细信息，例如\
  \ `student_id`、`first_name`、`last_name`、`age`、`gpa`：\n\n```\ntype student struct\
  \ {\n    student_id int\n    first_name string\n    last_name string\n    gpa float32\n\
  }\n```\n\n结构体定义仅仅是用户定义数据类型的蓝图。它本身不包含数据。为了使用结构体定义，应创建该结构体类型的变量，并设置其字段。\n\n以下是创建结构体变量的方法：\n\
  \n```\nvar <结构体变量> <结构体名称>\n```\n\n示例：\n\n```\nvar s1 student\nvar x, y, student\n\
  ```\n\n结构体变量的字段可以按如下方式设置：\n\n```\n<结构体变量>.<字段> = <值>\n```\n\n示例：\n\n```\nvar s student\n\
  s.student_id = 100014\ns.first_name = \"Grant\"\ns.last_name = \"Dewan\"\ns.age\
  \ = 16\n```\n\n下面是一个定义结构体、创建结构体变量、设置其字段并在控制台打印它们的示例：\n\n```go\n/* 结构体演示 1 */\n/*\
  \ 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport (\n    \"fmt\"\n)\n\n/*\
  \ 定义一个结构体 */\n/* 设置 3 个字段 */\ntype student struct {\n    s_id int\n    f_name string\n\
  \    l_name string\n    grade int\n    age int\n    gpa float32\n}\n\n/* 强制性的 main\
  \ 函数 */\nfunc main() {\n    /* 声明一个类型为 student 的结构体变量 S */\n    var S student\n\n\
  \    /* 设置 S 的字段 */\n    S.s_id = 30657095\n    S.f_name = \"Sophia\"\n    S.l_name\
  \ = \"Johnson\"\n    S.grade = 12\n    S.age = 18\n    S.gpa = 8.97\n\n    /* 打印\
  \ S 的详细信息 */\n    fmt.Printf(\"\\nStudent - S\\n\")\n    fmt.Printf(\"\\nS.s_id\
  \ = %d\", S.s_id)\n    fmt.Printf(\"\\nS.f_name = %s\", S.f_name)\n    fmt.Printf(\"\
  \\nS.l_name = %s\", S.l_name)\n    fmt.Printf(\"\\nS.grade = %d\", S.grade)\n  \
  \  fmt.Printf(\"\\nS.age = %d\", S.age)\n    /* 打印 gpa，限制为 2 位小数 */\n    fmt.Printf(\"\
  \\nS.gpa = %.2f\\n\", S.gpa)\n}\n```\n\n输出：\n![](img/Image00082.jpg)\n\n结构体变量也可以使用以下语法进行初始化：\n\
  \n```\nvar <结构体变量> <结构体名称> = <结构体名称>{<字段 1>:<值 1>, ..., <字段 n>:<值 n>}\n```\n\n示例：\n\
  \n```\nvar s1 student = student{student_id: 231, first_name: \"Rajat\", last_name:\
  \ \"Singh\", age: 20}\n```\n\n也可以使用以下语法短声明结构体变量：\n\n```\n<结构体变量> := <结构体名称>{<字段\
  \ 1>:<值 1>, ..., <字段 n>:<值 n>}\n```\n\n示例：\n\n```\ns2 := student{student_id: 592,\
  \ first_name: \"Jorge\", last_name: \"Fernandez\", age: 17}\n```\n\n下面是一个展示所有字段设置方法的程序：\n\
  \n```go\n/* 结构体演示 2 */\n/* 包声明 */\npackage main\n\n/* 导入语句 - 导入 fmt 包 */\nimport\
  \ (\n    \"fmt\"\n)\n\n/* 定义一个结构体 */\n/* 设置 3 个字段 */\ntype person struct {\n   \
  \ name string\n    address string\n    age int\n}\n\n/* 强制性的 main 函数 */\nfunc main()\
  \ {\n    /* 声明一个结构体变量 p1 */\n    var p1 person\n\n    /* 设置 p1 的字段 */\n    p1.name\
  \ = \"Earl\"\n    p1.address = \"NJ\"\n    p1.age = 25\n\n    /* 声明并初始化一个结构体变量 p2\
  \ */\n    var p2 person = person{name: \"Manjunath\", address: \"New Delhi\", age:\
  \ 30}\n\n    /* 短声明并初始化结构体变量 p3 */\n    p3 := person{name: \"Bella\", address: \"\
  London\", age: 19}\n\n    fmt.Printf(\"\\nperson p1\\n\")\n    fmt.Printf(\"\\np1.name\
  \ = %s\\np1.address = %s\\np1.age = %d\\n\", p1.name, p1.address, p1.age)\n    fmt.Printf(\"\
  \\nperson p2\\n\")\n    fmt.Printf(\"\\np2.name = %s\\np2.address = %s\\np2.age\
  \ = %d\\n\", p2.name, p2.address, p2.age)\n    fmt.Printf(\"\\nperson p3\\n\")\n\
  \    fmt.Printf(\"\\np3.name = %s\\np3.address = %s\\np3.age = %d\\n\", p3.name,\
  \ p3.address, p3.age)\n}\n```\n\n输出：\n\n\n\n\n\n## 17. 编程示例\n\n既然我们已经学习了 Go 编程的基础知识，现在让我们将这些概念付诸实践，尝试一些编程示例。\n\
  \n## 17.1 数字各位之和\n\n下面是一个程序，它从用户处读取一个整数并计算其各位数字之和：\n\n```go\n/*各位数字之和*/\n/*包声明*/\n\
  package main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\n\
  func main() {\n\tvar number int\n\tvar sum int = 0\n\tfmt.Printf(\"\\n 请输入一个数字:\
  \ \")\n\tfmt.Scanf(\"%d\", &number)\n\tfor number > 0 {\n\t\t/*将个位数字加到 sum 上*/\n\
  \t\tsum = sum + (number % 10)\n\t\t/*丢弃个位数字*/\n\t\tnumber = number / 10\n\t}\n\t\
  fmt.Printf(\"\\n 所有数字之和: %d\\n\", sum)\n}\n```\n\n**输出：**\n![](img/Image00084.jpg)\n\
  \n## 17.2 斐波那契数列\n\n斐波那契数列以 0 和 1 作为前两项开始。下一项通过将前两项相加得出。由于前两项是 0 和 1，接下来的项将是 1、2、3、5、8，依此类推。以下是该程序：\n\
  \n```go\n/*斐波那契数列*/\n/*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"\
  fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\tvar terms, next int\n\tvar previous,\
  \ current int = 0, 1\n\tfmt.Printf(\"\\n 请输入要生成的项数: \")\n\tfmt.Scanf(\"%d\", &terms)\n\
  \tif terms < 2 {\n\t\tfmt.Printf(\"\\n 斐波那契数列至少包含两项\")\n\t} else {\n\t\tfmt.Printf(\"\
  \\n\\n 斐波那契数列:\\n\\n\")\n\t\tfor i := 0; i < terms; i++ {\n\t\t\tfmt.Printf(\"%d\
  \ \", previous)\n\t\t\tnext = previous + current\n\t\t\tprevious = current\n\t\t\
  \tcurrent = next\n\t\t}\n\t}\n\tfmt.Printf(\"\\n\")\n}\n```\n\n**输出：**\n![](img/Image00085.jpg)\n\
  \n## 17.3 反转给定数字\n\n下面是一个读取整数并将其反转的程序：\n\n```go\n/*反转数字*/\n/*包声明*/\npackage main\n\
  \n/*导入语句 - 导入 fmt 包*/\nimport (\n\t\"fmt\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\
  \tvar number int\n\tvar rev int = 0\n\tfmt.Printf(\"\\n 请输入一个数字: \")\n\tfmt.Scanf(\"\
  %d\", &number)\n\tfor number > 0 {\n\t\trev = (rev * 10) + (number % 10)\n\t\tnumber\
  \ = number / 10\n\t}\n\tfmt.Printf(\"\\n 反转结果: %d\\n\", rev)\n}\n```\n\n**输出：**\n\
  ![](img/Image00086.jpg)\n\n## 17.4 字符串回文\n\n如果一个字符串的反转与原字符串相同，则称该字符串为回文。例如，“book”\
  \ 不是回文，而 “malayalam” 是回文。以下程序接收一个字符串作为输入并检查它是否为回文。请注意，未考虑大小写敏感性。\n\n```go\n/*回文*/\n\
  /*包声明*/\npackage main\n\n/*导入语句 - 导入 fmt、bufio、os、strings 包*/\nimport (\n\t\"fmt\"\
  \n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n\n/*强制性的 main 函数*/\nfunc main() {\n\t\
  /*使用 stdin 创建一个类型为 NewReader 的输入读取器变量*/\n\tinputReader := bufio.NewReader(os.Stdin)\n\
  \t/*提示用户输入内容*/\n\tfmt.Printf(\"\\n 请输入一个字符串: \")\n\t/*使用 ReadString 函数读取字符串*/\n\t\
  str, _ := inputReader.ReadString('\\n')\n\t/*去除 \\n 和 \\r 字符*/\n\tstr = strings.Trim(str,\
  \ \"\\n\\r\")\n\tstr_length := len(str) - 1\n\t/*使用 rune 获取数组中的字符*/\n\tstr_char\
  \ := []rune(str)\n\t/*反转字符串*/\n\tfor i := 0; i < str_length/2; i++ {\n\t\ttemp :=\
  \ str_char[i]\n\t\tstr_char[i] = str_char[str_length-i]\n\t\tstr_char[str_length-i]\
  \ = temp\n\t}\n\t/*使用 string 函数转回字符串*/\n\trev_str := string(str_char)\n\tfmt.Printf(\"\
  \\n 反转后的字符串: %s\\n\", rev_str)\n\t/*检查两个字符串是否相等*/\n\tresult := strings.Compare(str,\
  \ rev_str)\n\tif result == 0 {\n\t\tfmt.Printf(\"\\n%s 是回文。\\n\", str)\n\t} else\
  \ {\n\t\tfmt.Printf(\"\\n%s 不是回文。\\n\", str)\n\t}\n}\n```\n\n**输出：**\n![](img/Image00087.jpg)\n\
  \n## 17.5 冒泡排序\n\n冒泡排序是一种按升序或降序对数据结构进行排序的算法。在此算法中，以嵌套方式使用两个循环。内层循环确保将最大或最小元素放置在数据结构的开头或末尾。外层循环的迭代次数等于数据结构中的元素数量。我们将编写一个程序，从用户处读取\
  \ 5 个整数，将它们放入数组，并使用冒泡排序按升序对数组进行排序。\n\n```go\n/*使用冒泡排序对数组排序*/\n/*包声明*/\npackage main\n\
  \n/*导入语句 - 导入 fmt、strconv 包*/\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\n/*强制性的 main\
  \ 函数*/\nfunc main() {\n\t/*声明变量*/\n\tvar arr [5]int\n\t/*声明两个循环计数器*/\n\tvar i, j\
  \ int\n\t/*声明一个变量临时存储作为字符串的数字*/\n\tvar num_str string\n\t/*提示用户输入 5 个元素，使用 for 循环*/\n\
  \tfor i = 0; i < 5; i++ {\n\t\tfmt.Printf(\"\\n 请输入索引 %d 处的元素: \", i)\n\t\tfmt.Scanln(&num_str)\n\
  \t\t/*将 num_str 转换为整数*/\n\t\tnum, err := strconv.Atoi(num_str)\n\t\t/*将 num 赋值给\
  \ arr[i]*/\n\t\tarr[i] = num\n\t\t/*将 err 赋值给空标识符*/\n\t\t_ = err\n\t}\n\tfmt.Printf(\"\
  \\n 原始数组: %d\\n\", arr)\n\tarr_length := len(arr)\n\t/*冒泡排序*/\n\tfor i = 0; i <\
  \ arr_length; i++ {\n\t\tfor j = 0; j < i; j++ {\n\t\t\tif arr[j] > arr[j+1] {\n\
  \t\t\t\ttemp := arr[j]\n\t\t\t\tarr[j] = arr[j+1]\n\t\t\t\tarr[j+1] = temp\n\t\t\
  \t}\n\t\t}\n\t}\n\tfmt.Printf(\"\\n 排序后的数组: %d\\n\", arr)\n}\n```\n\n**输出：**\n![](img/Image00088.jpg)\n\
