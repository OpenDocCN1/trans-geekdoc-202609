    Accepted for publication

    June 29, 2022


    Costulatory molecules are an indispensable signal for activating immune cells.
    However, the features of many costulatory molecules (CMGs) in lung adenocarcinoma
    (LUAD) are poorly understood. This study systematically explored expression patterns
    of CMGs in the tumor microenvironment (TIME) of patients with LUAD. Their expression
    profiles were downloaded from the GEO database. Two subsets ''hot'' and ''cold''
    were identified by K-clustering and estimated immune cells in malignant tumors
    using tissue expression. The ''hot'' subset suggested higher activation in immune
    cells and enrichment in the immune cell receptor signaling pathway and adaptive
    response. Three CMGs (CD80, LTB, and TNFSF8) were screened as diagnostic markers
    by means of Absolute Signature Selection Operator and Survival Maximum Regression
    algorithms. The developed nomogram for predicting LUAD tissue status satisfied
    diagnostic accuracy in the Gene Atlas training cohort as well as GSE62110 and
    GSE13847. Immunohistochemistry staining of 16 specimens revealed an apparently
    positive correlation between expression of CMGs and pathologic response to immunotherapy.
    Thus, the independent prediction of status of LUAD patients with good predictive
    accuracy, which could serve as a test for identifying immunotherapy responders.
    (Am J Pathol 2022, 1922–1443; https://doi.org/10.1016/j.ajpath.2022.06.016)


