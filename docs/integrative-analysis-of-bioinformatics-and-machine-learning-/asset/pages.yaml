    In recent years, revolutionary breakthroughs in immunotherapy have led to advances
    in lung cancer, owing to the increasing recognition and focus of tumor microenvironment
    (TIME), which contains tumor cells, mesenchymal cells, and others. These diverse
    components and their interactions through multiple ligand and molecular mechanisms
    further lead to their vital and multifaceted impacts in different phases of tumor,
    including tumorigenesis, development, progression, metastasis, and antitumor immunity.


    Development of immunotherapy in biology has been hindered by the heterogeneity
    and unique characteristics of TIME or multicomic genetic expression profiles.
    This has facilitated precision medicine and identifies candidates that properly
    respond to immunotherapy, parameters are extracted from the entire data source
    or limited to small-sample spatial relationships among lung cell types.


    Some of the aforementioned studies are those that evaluate spatial data, as they
    learned from information about treatment response and functional mechanisms. Thus,
    they are rarely applied to clinical practice.


    Immunotherapy, specifically the use of checkpoint inhibitors (ICs) that block
    programmed cell death protein 1 (PD-L1) or programmed cell death protein 2 (PD-1)
    and T-lymphocyte antigen 4 (CTLA-4), has improved the survival rates of patients
    with locally advanced or metastatic, non-small-cell lung cancer (NSCLC).


    As the first-line treatment in the advanced/metastatic setting, clinical trials
    have shown that ICs may generate a sustained immune response and clinical efficacy.
    Patients in situ have high immune infiltration and relatively mechanisms for the
    activation of T cells to target tumor cells and metastases. Unfortunately, only
    few subsets of patients with LUAD benefit from ICs, due to de novo or acquired
    resistance.


    The complex intratumoral TIME promotes high heterogeneity and clonal diversity
    of strategies that enable tumors to evade surveillance.


    The counts of tumor cells, PD-L1, and score for Tumor Immune Dysfunction and Exclusion
    have been identified as potential indicators for predicting response to immunotherapy
    for patients with LUAD.


    However, their practical application in the clinic are limited by lack of sensitivity
    and detection, the predictive accuracy in different clinical studies and therapeutic
    strategies are low, and thus,


    novel biomarkers for predicting immunotherapy ideal candidates for immunotherapy
    and design effective strategies.


    Costimulatory molecules are made of B7-CD8 and tumor necrosis receptor family
    (TNF). The B7-CD8 family (CD80, CD86, PD-L1, PD-2, inducible T cell ligand (H-B17,
    H-B3a, and HERV-LR antigen 2) belonging to the B7 family (CD74, CTLA-4, inducible
    T cell checkpoint, PD-1, and TIMD2) belonging to the TNF family.


    The family contains 19 molecules from the TNF ligand superfamily (TNSF) and 29
    members from the TNF receptor superfamily. These costimulatory molecules provide
    signal for T cells, and participate in cell proliferation, differentiation, activation,
    and function. Hence, they serve as potential targets for current immunotherapy,
    which have been explored in prostate cancer and head neck squamous carcinoma.


    However, PD-1, PD-L1, and CTLA-4, the majority of molecules are still poorly understood
    in LUAD. The exploration of costimulatory genes in patients with LUAD is presented
    here.


    We utilized the transcriptional profiles of patients with LUAD obtained from The
    Cancer Genome Atlas (TCGA) and the Gene Expression Omnibus database to classify
    tumor subtypes (''cold'' and ''hot''). A series of bioinformatics and machine
    learning algorithms were used to establish a novel signature based on CMGs in
    patients with LUAD.


    This performance was validated with internal and external cohorts. Moreover, a
    small-sample immunohistochemistry (IHC) explored the correlation between the expression
    level of identified CMG biomarkers and the response to immunotherapy.


