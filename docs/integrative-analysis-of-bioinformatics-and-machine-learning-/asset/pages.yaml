    # Functional Annotation and Pathway Enrichment


    To light on possible differences in the biological function and pathways enriched
    in hot and cold tumors, Gene Enrichment Analysis was performed using GSEA (version
    4.0.1; http://www.msigdb.org/gsea/downloads.html). The Encyclopedia of Genes and
    CMGs in Gene C5 V7 and Gene Ontology in C5 V7 were used to perform the functional
    annotation and pathway enrichment.^34 A false discovery rate < 0.05 and P < 0.05
    were considered significant.


    # Patient Clustering Based on CMGs


    The K-means algorithm, an unsupervised consensus clustering learning algorithm,
    was used to classify patients into different clusters with distinct CMG patterns
    in the TCGA and GSE12310 data sets. Before analysis, the factoextra package was
    used to find the optimal cluster numbers in these two data sets. Principal component
    analysis was conducted to show visual results of the clustering and to evaluate
    the clustering efficacy.


    # Screen Diagnostic Biomarkers of Hot Tumors


    Least Absolute Shrinkage and Selection Operator, the Support Vector-Recursive
    Feature Elimination, and logistic regression were used to screen diagnostic biomarkers
    of the hot immune type. Least Absolute and Selection regression with R package
    and the Vector Machine-Recursive Elimination algorithm was performed on the TCGA
    data set to use the caret package to show the number of candidate CMGs. From the
    aforementioned biomarkers were subjected to the multivariate logistic regression,
    CMGs with significant features were identified as diagnostic biomarkers in the
    TCGA. The same work was also conducted in the GSE12310 data set. Finally, diagnostic
    biomarkers in the TCGA and GSE12310 sets were overlapped to determine final CMG
    diagnostic biomarkers.


    # Differentiation of Cold and Hot Tumors


    The Estimation of Strom and Immune Cells in Malignant Lung Tumors Using Estimation
    Data (ESTIMATE) also calculate the immune score, stromal score, and tumor purity
    using the gene set.^34 With a high immune score represents a high level of immune
    infiltration that was identified as "hot". The ESTIMATE package was used to calculate
    the immune score, stromal score, and tumor purity in TCGA and GSE12310 data sets,
    where LUAD patients were divided into hot and cold tumors. The GSE180347 data
    set, with at least 50 lymphocytes per-power field were identified as hot.


    # Construction and Validation of the Diagnostic Nomogram


    Using the TCGA data set as a training set, the nomogram integrating CMG diagnostic
    biomarkers was established to predict the survival time for patients with LUAD.
    GSE12310 and GSE180347 were used as validation data sets to assess the performance
    of this diagnostic nomogram. The calibration and operating characteristics curves
    were plotted in all three sets. In addition, the area value of the nomogram and
    PD-L1 was compared, and the clinical value of the nomogram was evaluated via decision
    analysis in all three data sets.


    # Immune Infiltration Analysis by TME


    With per to 1000, the CIBERSORT algorithm was used to investigate the infiltration
    landscape of 22 immune cells in the TCGA and GSE12310 data sets.^35 The correlation
    between types of immune cells and CMG patterns between "hot" and "cold" tumors
    were compared.


    A total of 16 postoperative specimens were collected from a cohort of LUAD patients
