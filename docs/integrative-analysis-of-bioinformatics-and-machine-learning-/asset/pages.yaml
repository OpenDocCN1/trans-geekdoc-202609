    # Discussion


    With the development of immunotherapy and multi-omics analyses, emerging studies
    on molecular and cellular mechanisms within the intratum TIME have been intensively
    conducted, but most studies focused on immune cell phenotypes. Tumor cells usually
    deliver incorrect messages to immune cells by costimulatory molecule signaling
    and expression within the TIME further increasing immune evasion. As signals for
    activation of T cells, elaborations on costimulatory molecules in LUAD are still
    poorly understood. This study used an unsupervised clustering method for identifying


    subtypes based on CMGs in LUAD, with significantly highlighted comprehensive characteristics
    and the diagnostic value of CMGs in LUAD cohorts. Moreover, an exploratory analysis
    in a real-world small sample via IHC revealed that the expression level of the
    three CMGs had an apparently positive correlation with the pathologic response
    to neoadjuvant immunotherapy in GSE9157 data, the SVM model using CMGs also showed
    high accuracy in predicting response to immunotherapy.


