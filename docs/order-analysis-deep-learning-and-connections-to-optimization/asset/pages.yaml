    # 2.1.2 Penalty Functionals


    Penalty methods have been used in numerical optimization for many decades. Penalty
    functionals play an important role here.


    **Definition 2.2** Let $S$ be a nonempty subset of a real normed space $(Y, ||\cdot||)$.
    A continuous functional $\eta : Y \to \mathbb{R}_+$ with the property $(for y
    \in Y)$


    $\eta(y) = 0 \iff y \in S$


    is called *exterior penalty functional* or simply penalty functional for $S$ (see
    Fig. 2.2).


    In penalty methods, these functionals are multiplied by sufficiently large real
    numbers, called penalty parameters. The continuity assumption in Definition 2.2
    is needed for convergence proofs in numerical optimization.


    **Example 2.2** Let $Y := \mathbb{R}^m$ with $m \in \mathbb{N}$ be given. Then
    we consider the polyhedral closed convex cone with nonempty interior (which is
    not needed here)


    $C := \{y \in \mathbb{R}^m \mid a^i^T y \le 0 \text{ for all } i \in \{1, \dots,
    k\}$


    for some $k \in \mathbb{N}$ and nonzero vectors $a^1, \dots, a^k \in \mathbb{R}^m$.
    Next, we define the function $\eta : \mathbb{R}^m \to \mathbb{R}_+$ by


    $\eta(y) := \sum_{i=1}^k (max \{0, -a^i^T y\})^2 \text{ for all } y \in \mathbb{R}^m$.


    Then it follows for arbitrary $y \in \mathbb{R}^m$


    $y \in C \iff -a^i^T y \le 0 \text{ for all } i \in \{1, \dots, k\}$


    $\iff max \{0, -a^i^T y\} = 0 \text{ for all } i \in \{1, \dots, k\}$


