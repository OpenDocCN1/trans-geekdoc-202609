    relations and introduced new ones that are more realistic in practice.


    Proposition 5.1 characterizes sets arising in Definition 5.1 by inequalities in
    R. A rewriting of set as inequalities was already given by Hernández and Rodríguez-Marín
    [59, Theorem 3.10, (iii) in 2007 using an extension of the Gertzwistar scalarizing
    function [43]. Such a rewriting of set as inequalities was also given by Köbis
    and Köbis [88, Theorem 3.3 and 3.8] for Gertzwistar scalarizing functions and
    various order relations. For the signed distance functional can be found in the
    papers of Gutiérrez, Jiménez, Miglierna, and Molina [47, Proposition 4.11], Chen,
    Ansari, and Yao [24], own, Jiménez, Novo, and Vilchez [78, Theorem 5.1], [79,
    Theorem 4.1] and Ha [51, Proposition 3]. However, in Proposition 5.1 one does
    not need an explicit form of the scalarizing functional.


    The results in Proposition 5.2 and Remark 5.1 are also marked by Köbis and Köbis
    [88, Remark 1] for specific scalarizing functionals. The characterization of a
    minimal set in Corollary 5.1 shows that set optimization problems with fixed order
    structure can be difficult optimization problems.


    The definition of the less variable order relation (Definition 5.3) was first
    given by Eichfelder and Pilecka [36, Definition 2.4] together with a variety of
    other variable order relations for sets. For a subsequent proper see also the
    work of Köbis, Le, and Tammer [90]. Proposition 5.5 was first given in the proof
    of Theorem 4.1 by Eichfelder and Pilecka [37] and subsequently by Köbis, Le, and
    Tammer, Theorems 3 and 6 for special scalarizing functionals.


    It is already noted on page 90 that Theorem 5.1 is only a slight extension of
    the result of Eichfelder and Pilecka [37, Theorem 4.1, (iii)]. In fact, Eichfelder
    and Pilecka [37] did not use the exact definition of the g in their proof, so
