  md: "# # Chapter 3\nApplication in Nonlinear Optimization\n\n**Abstract** In this\
    \ chapter, we investigate optimization problems with a real-valued objective functional\
    \ and a general inequality constraint. We do not assume convexity except for the\
    \ preorder cone, or generalized convexity, so this approach is also valid for\
    \ discrete-continuous nonlinear optimization problems. We restrict ourselves to\
    \ problems with a unique minimal solution for which we present optimality conditions.\n\
    \n# ## 3.1 Optimality Conditions for a Unique Minimal Solution\n\nWe start with\
    \ the problem formulation in nonconvex nonlinear optimization.\n\n**Assumption\
    \ 3.1** Let $X$ and $Y$ be real linear spaces, let $C$ be a convex cone in $Y$,\
    \ and let $\tilde{S}$ be a nonempty subset of $X$. Let a functional $f : \tilde{S}\
    \ \to \\mathbb{R}$ and a map $g : \tilde{S} \to Y$ be given, and let the constraint\
    \ set\n\n> $S := \\{x \\in \tilde{S} \\mid g(x) \\in -C\\}$\n\nnonempty.\n\nUnder\
    \ this assumption, we investigate the nonlinear optimization problem\n\n> $\\\
    min_{x \\in S} f(x) \\quad (3.1)$\n\nwith a general inequality constraint. Notice\
    \ that we do not have convexity assumptions on $f, g$, and $\tilde{S}$. By Definition\
    \ 1.21, $\tilde{x} \\in \tilde{S}$ is said to be a *minimal solution* of the optimization\
    \ problem (3.1) iff\n\n> $f(\tilde{x}) \\le f(x)$ for all $x \\in S$.\n\nIn this\
    \ chapter, we work with a stronger minimality notion. $\tilde{x} \\in \tilde{S}$\
    \ is called a *unique minimal solution* of problem (3.1) iff\n\n> $f(\tilde{x})\
    \ < f(x)$ for all $x \\in S$ with $x \neq \tilde{x}$."
