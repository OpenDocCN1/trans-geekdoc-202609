    $\sup_{b\in B, a\in A} \psi(a-b) \leq 0$$

    $\quadquad \Longrightarrow \quad \min_{b\in B, a\in A} \psi(a-b) \leq 0 \text{
    if this min term exists}$

    ```


    For the proof of the second characterization, we only remark that


    $A \subseteq B-C \quad \Longrightarrow \quad \forall a\in A \ \exists b\in B :
    \ a-b\in -C,$


    which leads to the assertion.'
