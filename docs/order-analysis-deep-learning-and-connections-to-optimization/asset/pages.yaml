  md: "# 6.6 Gradient Methods\n\nThen, for each $i \\in \\mathbb{N}$, it is\n\n$E_b(\\\
    |x^i - \\bar{x}\\|_2^2) \\leq (1-\\lambda\\mu)^i \\|x^0 - \\bar{x}\\|_2^2 + \\\
    frac{2\\lambda}{\\mu} V_b\\left(\\frac{1}{b} \\sum_{k \\in B_i} \\nabla f_k(x^i)\\\
    right),$\n\nwhere $\bar{x} \\in \\mathbb{R}^n$ is the unique solution of the optimization\
    \ problem (6.6) and $E_b(-)$ and $V_b(-)$ denote the expectation and the variance\
    \ with respect to a mini-batch with $b$ elements,\n\nFurther details, extensions,\
    \ and additional convergence results can be found in the handbook [42].\n\nFinally,\
    \ we discuss another extension of the stochastic gradient method, called the stochastic\
    \ average gradient method. The advantage of this procedure is that previously\
    \ computed gradients are reused, repeatedly improving the estimate of the gradient\
    \ of the objective function.\n\n**Algorithm 6.6** (Stochastic average gradient\
    \ method [124, Algorithm 1])\n| 1 Input: $f_1, \\dots, f_p : \\mathbb{R}^n \\\
    to \\mathbb{R}$, starting vector $x^0 \\in \\mathbb{R}^n$, |\n| 2 maximal iteration\
    \ number $i_{max}$. |\n| 4 $i := 0$ % initialization |\n| 5 $y^1 := y^2 := \\\
    dots := y^p := 0_{\\mathbb{R}^n}$ |\n| 6 $s^0 := 0_{\\mathbb{R}^n}$ |\n| 7 **while**\
    \ $i \\leq i_{max}$ |\n| 8 $k := \\text{rand}(p)$ % random integer (uniformly\
    \ sampled in $[1, \\dots, p]$) |\n| 9 $s^{i+1} := s^i - y^k + \\nabla f_k(x^i)$\
    \ % estimator of the sum of gradients |\n| 10 $y^k := \\frac{\\nabla f_k(x^i)}{p}$\
    \ % gradient estimator update |\n| 11 $d^i := -s^{i+1} / p$ % iteration direction\
    \ |\n| 12 choose $\\lambda_i > 0$ |\n| 13 $x^{i+1} := x^i + \\lambda_i d^i$ %\
    \ step size |\n| 14 $i := i + 1$ |\n| 15 **end while** |\n| 17 Output: $x^1, x^2,\
    \ \\dots, .$ |\n\nFirst, some notes for a better understanding of this method.\
    \ In this algorithm, $s^i$ denotes the sum of the gradients $y^1, \\dots, y^p$\
    \ at iteration $i \\in \\mathbb{N} \\cup \\{0\\}$. In line 9, this sum is updated\
    \ by replacing the estimate $y^k$ by the gradient $\\nabla f_k(x^i)$ for some\
    \ index $k \\in \\{1, \\dots, p\\}$ chosen in line 8. Then, in line 11, we get\
    \ the direction in the form\n\n```\n$d^i := -\\frac{1}{p} \\left(\\sum_{j=1 \\\
    \ j \\neq k}^p y^j + \\nabla f_k(x^i)\\right).$\n```"
