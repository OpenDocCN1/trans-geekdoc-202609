    and


    ```

    $A \subseteq B-C \quad \Longrightarrow \quad \sup_{a\in A, b\in B} \psi(a-b) \leq
    0$$

    $\quadquad \Longrightarrow \quad \inf_{a\in A, b\in B} \psi(a-b) \leq 0 \text{
    if this min term exists}$

    ```


    **Proof** For arbitrary nonempty sets $A, B \subseteq Y$, :


    ```

    $B \subseteq A+C \quad \Longrightarrow \quad \forall b\in B \ \exists a\in A :
    \quad b \in \{a\}+C$$

    $\quadquad \Leftrightarrow \quad a-b\in -C \Leftrightarrow \ \psi(a-b)\leq 0$$

    ```


