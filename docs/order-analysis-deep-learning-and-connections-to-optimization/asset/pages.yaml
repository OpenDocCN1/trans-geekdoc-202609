    space $(Y, \|\cdot\|)$, and let $\psi$ be a $-C$ representing convex functional
    with the property that $y \in Y$ we have


    $y \in -C \iff \psi(y) = 0.$


    Then it holds


    $0^* \in \partial\psi(0Y).$


    **Proof** every $y \in Y$, we have


