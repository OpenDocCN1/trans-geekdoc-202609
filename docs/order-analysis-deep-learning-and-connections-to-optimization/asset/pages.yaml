    \dots, x_n) \in \mathbb{R}^n. \quad (6.15)$

    ```


    The optimization problem (6.14) is scalable in the dimension $n$. The $j$-th summand
    (with $j \in \{1, \dots, n\}$) in (6.15) depends on only one variable, $x_j$;
