  md: '# # Chapter 6

    Basics of Deep Learning


    **Abstract** The topics of this chapter are important basic principles of deep
    learning, a comprehensive discussion of gradient methods, and the treatment of
    numerical examples. These subjects are treated from a more mathematical point
    of view. In the context of deep neural networks, we limit the introductory presentation
    mainly to supervised learning. Both deterministic and stochastic gradient methods
    are discussed. In the deterministic variants, also called batch gradient descent
    methods, emphasis is placed on effective step size rules, such as those of Barzilai
    and Borwein (IMA J Numer Anal 8:141–148, 1988) and a new variant in Algorithm
    6.3. The numerical examples are of of an illustrative nature.


    # ## 6.1 Introduction


    For many years, we have witnessed the highly successful application of artificial
    intelligence (AI) in many fields, especially in the processing of images, text,
    language, sound, and many other areas of applications. Here, computer science
    interacts with various scientific disciplines such as medicine, natural sciences,
    economics, and engineering as biomedical engineering.


    Deep learning is an important subfield of machine learning, which in turn is a
    mastery of AI. It enables the discovery of complex structures in datasets and
    their mathematical formalization. In essence, deep learning is used to find complex
    classes of mathematical functions that form the base for “intelligent” predictions
    or decisions. These function classes typically have a large number of parameters
    that can be optimally determined using an existing dataset. This requires the
    use of mathematical optimization methods that can handle a large number of variables
    and a complicated objective function. Some of these optimization methods are the
    subject of this chapter.


    Mathematical optimization is proving to be a key technology for the solution of
    complex problems in the field of AI. To illustrate this, let''s start with a very
    simple introductory'
