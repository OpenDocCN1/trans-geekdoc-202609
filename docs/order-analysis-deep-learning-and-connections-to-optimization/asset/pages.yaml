  md: '# 6.4.4 ReLU Function


    The Rectified Linear Unit (abbreviated ReLU) is a simple piecewise linear function.
    Fukushima [41] introduced this special activation function in 1969.


    Definition 6.3 ([41, p. 324]) The function $\varrho : \mathbb{R} \to \mathbb{R}_+$
    is given by


    $$\varrho(x) := \max\{0, x\ \text{ for all } x \in \mathbb{R}$


    is ReLU function.


    Figure 6.7 illustrates the ReLU function. This function is not bounded from above
    and also not differentiable at $\tilde{x}:= 0$, but it is continuous. However,
    this function can be smoothed in a small neighborhood of zero so that the modified
    function is differentiable.


    Fukushima [41] defined this activation function as a kind of combination of the
    identity function and the zero function based on the functionalities of the synapses
    of one biological neuron at the interface to the next biological neuron.


    The ReLU function has the advantage that, in contrast to the sigmoid or tanh functions,
    does not require any arithmetic operations to be performed. On the other hand,
    for nonpositive values, the function values are simply set to zero, which can
    eliminate certain information. However, particular successes are reported in the
    research literature, which is why this ReLU activation function is popular (cf.
    among others [26, 110]).


    The approximation performance of deep feedforward neural networks using the ReLU
    activation function has been investigated by Shen, Yang, and Zhang [127] in terms
    of the number of neurons. Their result hold for a continuous function $g : [0,1]^d
    \to \mathbb{R}$ (where $d$ denotes the dimension of the feature space) with a
    modulus of continuity $\omega_g : [0, \infty) \to \mathbb{R}_+ \cup{\{\infty\\}$
    given by


    $$\omega_g(\varepsilon) := \sup \{|g(x)-g(y)\| \ x, y \in [0,1]^d, \|x-y| \le
    \varepsilon\}$ for all $\varepsilon > 0$.


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_110_0.png)'
