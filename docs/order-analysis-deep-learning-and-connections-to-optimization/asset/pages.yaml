  md: "# 6.6 Gradient Methods\n\n# Algorithm 6.4 (Stochastic gradient method)\n\n\
    ```\n1 Input: $f_1, \\dots, f_p : \\mathbb{R}^n \to \\mathbb{R}$, starting vector\
    \ $x^0 \\in \\mathbb{R}^n$,\n2 maximal iteration number $i_{max}$.\n3\n4 $i :=\
    \ 0$ % initialization\n5 while $i \\le i_{max}$ do\n6 $k := \text{randi}(p)$ %\
    \ random integer (uniformly sampled in $\\{1, \\dots, p\\}$)\n7 $d^i := -\nabla\
    \ f_k(x^i)$ % iteration direction\n8 choose $\\lambda_i > 0$ % step size\n9 $x^{i+1}\
    \ := x^i + \\lambda_i d^i$\n10 $i := i + 1$\n11 end while\n12\n13 Output: $x^1,\
    \ x^2, \\dots$\n```\n\n# Remark 6.7\n\n+   (A) 6.4 does not specify the step size\
    \ $\\lambda_i$ in line 8. In practice, a step size formula as $\\lambda_i = \\\
    frac{1}{i}$ for $i \\in \\mathbb{N}$ is used, or one works with constant step\
    \ sizes such as 0.1, 0.01, or 0.001. A good choice of $\\lambda_i$ actually depends\
    \ on the optimization problem under consideration.\n\n+   (B) The previous algorithm\
    \ only works with one gradient $\nabla f_k(x^i)$ at an iteration $x^i$ and ignores\
    \ the other gradients $\nabla f_j(x^i)$ for $j \\in \\{1,\\dots,p\\}\\{k\\}$.\
    \ Because of this lack of information, one cannot assume that the iteration direction\
    \ used is particularly good. However, one can easily see the descent of the objective\
    \ function continuous after several iterations.\n\nNext, we could cite by Garrigos\
    \ and Gover [42] on the convergence rate of the stochastic gradient method under\
    \ appropriate assumptions.\n\n**Theorem 6.4 (Convergence of the Stochastic Gradient\
    \ Method [42], Theorem 5.7])** Let the functions $f_1, \\dots, f_p : \\mathbb{R}^n\
    \ \to \\mathbb{R}$ with $n, p$ be differentiable, convex, and bounded from below,\
    \ and let the objective function $f : \\mathbb{R}^n \to \\mathbb{R}$ be defined\
    \ by (6.17). For each $j \\in \\{1,\\dots,p\\}$, the gradients $\nabla f_j$ be\
    \ Lipschitz continuous, i.e., there exists Lipschitz constant $L_j > 0$ such that\n\
    \n$$\nabla f_j(x) - \nabla f_j(y)\\|_2 \\le L_j\\|x - y\\|_2$ for all $x, y \\\
    in \\mathbb{R}^n$.\n\nThe objective function $f$ is $\\mu$-strongly convex for\
    \ $\\mu > 0$ (Definition 1.25). Furthermore, let $(x^i)_{i\\in\\mathbb{N}}$ be\
    \ a sequence generated by Algorithm 6.4 with a constant step size $\\lambda$ (\
    \ $\\lambda_i = \\lambda$ for all $i \\in \\mathbb{N}$) satisfying $0 < \\lambda\
    \ < \\min\\{\\frac{1}{\\mu}, L_{\\max}\\}$ with $L_{\\max} := \\max_{1\\le j\\\
    le p} L_j$."
