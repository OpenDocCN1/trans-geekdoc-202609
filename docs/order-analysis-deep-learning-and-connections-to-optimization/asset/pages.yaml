- pgno: 2
  md: The series in Vector Optimization contains publications in various fields of
    optimization with vector-valued objective functions, such as multiobjective optimization,
    multi criteria decision making, set optimization, vector-valued game theory and
    border areas to financial mathematics, biosystems,semidefinite programming and
    stochastic multiobjective control theory. Studies of continuous, discrete, combinatorial
    and stochastic multiobjective objective models in interesting fields of operations
    research are also included. The series covers mathematical theory, methods and
    applications in economics and engineering. These publications being written in
    English are primarily monographs and multiple author works containing current
    advances in these fields.
