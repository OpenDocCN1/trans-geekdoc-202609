    # 2.4 Sublinearity


    Here, we now study $-C$ representing functionals which are additionally sublinear.
    This additional assumption of sublinearity is not unrealistic, as the following
    example shows:


    **Example 2.7** ($Y, \|cdot|$,$) be a real normed space, and let some continuous
    functional $\ell \in Y^*$ be arbitrarily chosen. Then we consider the Bishop-Phelps
    functional $\varphi_\ell : Y \to \mathbb{R}$


    ```

    $\varphi_\ell(y) := \ell(y) + \|y| \ \text{ for all } y \in Y$.

