    ```

    $[y, \tilde{y}] \approx \mathcal{F}(31,739.4339\mathcal{F}(x_1, \tilde{x}_1)[x_2,
    \tilde{x}_2])

    n+[0.078448, 0.078557)]

    – 906.020783\mathcal{F}(-1009.692[x_1, \tilde{x}_1] + 31.332713[x_2, \tilde{x}_2])$

    +[-3354.3805, -3323.8843])$

    +[-2131.5185, -2111.2906]$.

    ```


    For example, for the intervals $[x_1, \tilde{x}_1] := [-0.25, 0.25]$ and $[x_2,
    \tilde{x}_2] := [2, 2]$, we obtain the predicted interval $[y, \tilde{y}] := [-0.99898,
    -0.617011]$. For the special intervals $[x_1, \tilde{x}_1] := [0, 0]$ and $[x_2,
    \tilde{x}_2] := [2, 2]$, which consist of only one point, we get the predicted
    interval $[y, \tilde{y}] := [-0.99847, -0.94947]$. Because of the interval-valued
    theory, single-valued inputs can also produce an interval-valued output. This
    problem seems to require more artificial neurons or a complex deep neural network.


    # 7.6 Bibliographical Notes


    The study of deep neural networks with set-valued inputs is not new. Already Qi
    al. [115] and Zaheer et al. [146] investigated deep neural networks with set-valued
    inputs in 2017. So Soelch et al. [129] for a recent paper. These papers are more
    application-oriented, while Chap. 7 provides a mathematical framework for set-valued
    inputs in a general setting.


    In 1994, Hausdorff [57] introduced the distance named after him (compare also
    [125, Section 1.8]). It is noted by [125, page 68] by Pompeiu [114, page 282]
    first introduced the Hausdorff distance in a special case. For example, in the
    field of neural networks, the Hausdorff distance is used to evaluate the performance'
