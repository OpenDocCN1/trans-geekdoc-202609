    $(x, y) \mapsto x + y$ with $x, y \in Y$,


    $(\alpha, y) \mapsto \alpha y$ with $\alpha \in \mathbb{R}$ and $y \in Y$


    are continuous on $Y \times Y$ and $\mathbb{R} \times Y$, respectively. In many
    situations, we use, for simplicity, the notation $Y$ instead of $(Y, T)$ for a
    real topological linear space.


    +   (b) A subset $S$ of a topological linear space $Y$ is called bounded iff for
    $0$-neighborhood $U$ there is a $\lambda \in \mathbb{R}$ with the property $S
    \subseteq \lambda U$.'
