    6 Basics of Deep Learning


    computing a little step size. So the iteration formula is


    $x^{i+1} := x^i + d^i$


    as given in line 16 of Algorithm 6.3.

    In order to avoid that the iteration direction $d^i$ is an ascent direction, one
    can check the sign of the scalar product


    ```

    $$\nabla f(x^i)^T d^i = \frac{d}{d\lambda} f(x^i + \lambda d^i)|_{\lambda=0} =
    \lim_{\lambda\to0_+} \frac{f(x^i + \lambda d^i) - f(x^i)}{\lambda}$

    ```


    If $

    abla f(x^i)^T d^i > 0$, then there exists some $\hat{\lambda} > 0$ so that


    $f(x^i + \lambda d^i) > f(x^i)$ for all $\lambda \in (0, \hat{\lambda})$


    i.e., $d^i$ is an ascent direction. In this case, we can replace $d^i$ with $-d^i$
    and get a descent direction. This is implemented in line 13 of Algorithm 6.3.
    However, since we are not working with an additional step size for $d^i$; it may
    be that the next iteration point $x^{i+1}$ we get a larger value of the objective
    function.


