  md: "# 126 6 Basics of Deep Learning\n\nThen, for each $i \\in \\mathbb{N}$, it\
    \ is\n\n```\n$E\\left(\\|x^i - \\bar{x}^i\\|_2^2\\right) \\leq (1-\\lambda\\mu)^l\\\
    |x^0 - \\bar{x}^l\\|_2^2 + \\frac{2\\lambda}{\\mu}V(G),$\n```\n\nwhere $\bar{x}\
    \ \\in \\mathbb{R}^n$ is the unique minimal solution of the optimization problem\
    \ (6.6) and $V(G)$ denotes the variance of a discrete $\\mathbb{R}^n$-valued random\
    \ element $G$, which is uniformly distributed and takes on the gradients $\\nabla\
    \ f_i(\\bar{x}), \\dots, \\nabla f_p(\\bar{x}).$.\n\nIn this theorem, the variance\
    \ $V(G)$ is also called gradient noise [42], Definition 4.16. For convergence\
    \ results of the stochastic gradient method, we refer to the handbook [42].\n\n\
    Next, we apply the stochastic gradient method to the optimization problem from\
    \ Example 6.3.\n\n**Example 6.5** As in 6.3, consider the unconstrained optimization\
    \ problem (6.14) with the objective function $f: \\mathbb{R}^n \\to \\mathbb{R}$\
    \ given by\n\n```\n$f(x) = \\sum_{j=1}^n \\frac{j}{10}(e^{x_j} - x_j - 1)\\n=:\
    \ \\sum_{j=1}^n \\frac{j}{10}(e^{x_j} - x_j - 1) \\text{ for all } x := (x_1,\
    \ \\dots, x_n) \\in \\mathbb{R}^n\\n=:f_j(x)$\n```\n\nHere we have $p := n$, and\
    \ the functions $f_j: \\mathbb{R}^n \\to \\mathbb{R}$ (with $j \\in \\{1, \\dots,\
    \ n\\}$) are simple in this. For $n=10$, 6.15 shows the values of the objective\
    \ function $f$ at the iteration points $x^{1000}, \\dots, x^{2000}$ obtained with\
    \ 8-core iMac. As Example 6.3, the starting point is set to $x^0 := (1, 1, \\\
    dots, 1) = (1, 1, \\dots, 1)$. Since the index $k$ (line 6 of Algorithm 6.4) is\
    \ uniformly distributed in $[1, \\dots, p]$, we cannot expect an iteration path\
    \ to remain unchanged if we are actually close together. 6.15 shows such iteration\
    \ paths. CPU times are 0.01 or 0.02 seconds. The high number of iterations results\
    \ from the constant step size $\\lambda := \\lambda := 0.01$ (at each iteration\
    \ $i \\in \\mathbb{N}$) chosen in line 8 of Algorithm 6.4. It is also interesting\
    \ to compare 6.15 with Figs. 6.13 and 6.14.\n\nA disadvantage of the stochastic\
    \ gradient method is that only one gradient $\\nabla f_k$ is used. This drawback\
    \ can be reduced by selecting several gradients at each iteration.f1, \\dots,\
    \ f_p$. This leads to a combination of a gradient descent method and the stochastic\
    \ gradient method, which is called a *mini-batch stochastic gradient method*."
