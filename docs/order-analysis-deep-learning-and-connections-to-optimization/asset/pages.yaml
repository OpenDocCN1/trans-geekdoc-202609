- pgno: 90
  md: '# 4.4 Bibliographical Notes


    more theoretical interest. A very strong optimality term is given by strongly
    minimal elements of a set. Many sets do not have strongly minimal elements, and
    therefore, this known optimality notion is often not relevant in practice.


    # Section 4.2


    The results of this section were already developed by Jahn [74, Subsection 4.2].
    Jahn and Khan [76] developed optimality conditions for concrete vector optimization
    problems with a variable order structure used for the objective map and the constraints.
    This approach does not use of representing functionals. Due to the variable order,
    the Lagrange multipliers are not constant but they are functions of the variables.


    # Section 4.3


    The results of Sect. 4.3 were already published by Jahn and Khan [76, Section
    4]. Problems with vanishing constraints can be found in structural optimization
    [1, Example 1]. Achtziger and Kanzow were the first who investigated optimality
    conditions and constraint qualifications for this problem class. Mathematical
    programs with switching constraints, e.g., Mehlitz [105] and the references therein.
    Conditional objectives appear in image registration of medical data studied by
    Eichfelder [33, Subsection 1.3.1]. Wacker [137] (also see Wacker and Deinzer [138])
    was the first who investigated such problems with a weighting approach where the
    nonnegative weights may change during the iteration process. Since the weight
    of an objective may be zero, Based on these concrete applications in medical technology,
    Eichfelder [32, 33] developed a theory of variable order structures in vector
    optimization. Variable order structures are the right tool for the investigation
    of problem (4.8).


    If the sets $G_1, \dots, G_m$ are described by inequalities, then the conditional
    constraints in (4.8) can be transformed to constraints of a mathematical program
    with vanishing constraints (MPVC), which is closely related to a mathematical
    program with equilibrium constraints (MPEC) (for details, see Achtziger and Kanzow
    [1]). In this section, we do not assume that the sets $G_1, \dots, G_m$ have a
    special structure. This is possible because we work with variable order structures.'
