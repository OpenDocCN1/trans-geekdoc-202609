  md: '# Section 6.1


    This section gives only a brief introduction to the topic from a mathematical
    point of view. Therefore, the very simple Example 6.1 is chosen. More recent applications
    include computer vision and large language models (below).


    # Section 6.2


    Artificial neurons are the subject of Sect. 6.2. One of the fundamental papers
    on artificial neurons was published in 1943 by McCulloch and Pitts [102]. They
    developed a logical calculus to describe neurons and networks of neurons.


    # Section 6.3


    A brief introduction to deep neural networks can be found in Sect. 6.3. It describes
    the structure of a feedforward neural network and provides the most commonly used
    terms.


    # Section 6.4


    Only common activation functions are listed in Sect. 6.4. Some of these functions
    can be extended by special parameters; see [26, 110]. A comprehensive list of
    known activation functions can be found in [15, Table 1.1]. In addition to Theorem
    6.1, one can prove a so-called universal approximation theorem (see15, Theorem
    1.15]). It states that deep networks can approximate any continuous function on
    a compact set under appropriate assumptions, especially on the activation function
    used. For further references on this topic, see [127, 15].


    # Section 6.5


    This section is dedicated to supervised learning with deep neural networks. The
    resulting optimization problems indeed a challenge, especially for modern applications.
    Examples of this include computer vision and large language models.


    An introduction to the interesting possibilities of computer vision can be found
    at Klingler [87] from the company visi. Objects such as pedestrians, cars, trucks,
    etc. can be not only recognized in an image but also tracked. These are important
    steps toward autonomous driving. For handwritten digit recognition, we refer to
    a review article published by Kadhre, Desale, More, and Palhagdal [81].


    Large language models (LLMs) are among the most challenging applications today.
    They can combine images and text (in which case they are multimodal) and generate
    natural language. The US company OpenAI provides a good example of this with ChatGPT-4
    software. The number of parameters used in this LLM is very high, but not known
    (as of November 2023). See Remark 6.9 for a combination of ChatGPT with MATLAB.
    The linguistic startup European Alpha also combines images and text. It uses up
    to 300 billion parameters [4]. Such software can also answer questions about an
    image (see [3]). In 2023, another promising startup Mistral was founded in France.
    Its Mistral 8X7B uses up to 46 billion parameters (as of January 2024). Unlike
    others, Mistral AI works with open LLMs and supports the open-source community.


    Ferreira [38, p. 6] points out that LLMs generate output by word, recognizing
    patterns in the data on which they were trained. And [38, p. 10]'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 6.8 Bibliographical Notes


    problems can occur due to hallucination, i.e., the output text contains false
    or misleading information presented as fact ([141]. LLMs are transformer models
    [38, p. 7]. Merritt [105] says "A transformer model is a neural network that learns
    context and this meaning by tracking relationships in stochastic data like the
    ones in this sentence."


    # 6.6


    An overview of different gradient methods for deep learning is provided in Sect.
    6.6. Due to the high dimensionality of the optimization problem, matrix operations
    should be avoided. Therefore, we restrict ourselves to different types of gradient
    methods and do not study quasi-Newton methods.


    Different names are used for gradient methods. This is due to the fact that research
    fields, such as mathematics, computer science, engineering, and medicine, use
    and extend them. For example, IBM [66] distinguishes three types of gradient descent:
    batch gradient descent, stochastic gradient descent, and mini-batch gradient descent.
    Batch gradient descent means the entire, large dataset, is considered in the optimization
    problem, which leads to a very complex problem with long processing time. The
    methods in Sect. 6.6, are appropriate for this task (e.g., see [124]). Stochastic
    gradient descent, the topic of Sect. 6.2, with a stochastic selection within the
    entire dataset, which has advantages in terms of speed and memory requirements.
    Mini-batch descent is a certain combination of the two concepts above and take
    advantage of it. It is described in Sect. 6.6 because it is an extended stochastic
    gradient method.


    In 1847, Cauchy [23] introduced the steepest descent method (for a classification
    of the historical paper, see [96]) given in Sect. 6.6.1. Further developments
    of the theory and extensions of the Barilai-Borwein method [12] given in Algorithm
    6.2 are formulated by Raydan [116, 117], Dai and Liao [270], and Huang et al.
    [65]. For deep learning problems, a gradient method was also given by Todorov-Tanev
    [134]. Algorithm 6.3 can also be understood as a special case of the Barilai-Borwein
    method, since it is likewise based on the quasi-Newton equation.


    Robbins and Monro [119] gave the first foundations of stochastic gradient methods
    in 1951. Recent developments in stochastic gradient methods can be found in [147,
    97, 133, 44], among others. The mini-batch stochastic gradient method is popular
    today. However, if we continue to use the functions of $f_1,...$ in subsequent
    iterations, a memory of helpful gradient information is built up many iterations
    that can be used subsequently. In this way, the estimation of the gradient of
    the objective function can be improved. This strategy is used in the stochastic
