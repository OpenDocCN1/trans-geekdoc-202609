    **Definition 1.11** Let $S$ be a nonempty subset of a real linear space. The set


    $conc(S) :={\lambda s \mid \lambda \geq 0 \text{ and } s \in S\}$


    is called the cone *generated by S* (Compare. Fig. 1.11).


    If a real linear space is preordered, then a preorder can also be introduced on
    its dual space.


    **Definition 1.12** Let $Y$ be a real linear space with a preorder cone $C$. The
    cone


    $C'' :={\ell \in Y'' \mid \ell(y) \geq 0 \text{ for all } y \in C\}$


    is called the dual cone for $C$ (here $Y''$ denotes the algebraic dual space of
    $Y$).


    # 1.3 Normed Spaces


    Although normed spaces are the most important space structure in the second part
    of this book, we first start with topological spaces in general.


    **Definition 1.13** Let $Y$ be a nonempty set.


    +   (a) A topology $\mathcal{T}$ on $Y$ is defined to be a set of subsets of $Y$
    that satisfy the following axioms:


    +   (i) Union of sets of $\mathcal{T}$ belongs to $\mathcal{T}$.


    +   (ii) Finite intersection of sets of $\mathcal{T}$ belongs to $\mathcal{T}$.


    +   (iii) $\varnothing \in \mathcal{T}$ and $Y \in \mathcal{T}$.


    In this case, $(Y, \mathcal{T})$ is called a topological space and the elements
    of $\mathcal{T}$ are called open sets.


    +   (b) Let $\mathcal{S}$ and $\mathcal{T}$ be two topologies on $Y$. $S$ is called
    *finer than* $\mathcal{T}$ (or $\mathcal{T}$ is called *coarser than* $S$) iff
    every open-set is $\mathcal{S}$-open.'
