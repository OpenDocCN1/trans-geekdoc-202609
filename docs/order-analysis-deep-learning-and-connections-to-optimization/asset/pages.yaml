    $\Longiff \|(y_1, \dots, y_m)\|_2^2 \leq 2y_m^2, \ y_m \geq 0$

    $\Longiff \|(y_1, \dots, y_m)\|_2 \leq \sqrt{2} \ e^m^T y$

    $\Longiff \|y\|_2 \leq \sqrt{2} \ e^m^T y$


    with $e^m := (0, \dots, 0, 1) \in \mathbb{R}^m$ (see the proof in [68, Lemma 2.2,
    (a)). Consequently, the Lorentz cone is a Bishop-Phelps cone with $\ell := \sqrt{2}e^m$.


