- pgno: 18
  md: "# Chapter 1\nPreliminaries\n\n**Abstract** In this chapter, we summarize the\
    \ well-known definitions of linear spaces and convex sets, as well as the definition\
    \ of topological linear spaces, and we consider a preorder and a partial order\
    \ in such a linear setting. Special attention is paid to normed spaces. Directional\
    \ derivatives and subdifferentials are also recalled.\n\n# 1.1 Linear Spaces and\
    \ Convexity\n\nFirst, we recall the definition of a real linear space and present\
    \ some other notions.\n\n**Definition 1.1** Let $Y$ be a given set. Assume that\
    \ there is an addition on $Y$, i.e., a map from $Y \times Y$ to $Y$, and a scalar\
    \ multiplication on $Y$, i.e., a map from $\\mathbb{R} \times Y$ to $Y$, are defined.\
    \ The set $Y$ is called a *real linear space* if the following axioms are satisfied\
    \ (for arbitrary $x, y, z \\in Y$ and $\\lambda, \\mu \\in \\mathbb{R}$)\n\n+\
    \   (a) $x + y + z = x + (y + z)$.\n(b) $x + y = y + x$.\n(c) There is an element\
    \ $0 \\in Y$ with $x+0 = x$ for all $x \\in Y$.\n(d) For every $x \\in Y$, there\
    \ is a $y \\in Y$ with $x+y=0$.\n(e) $\\lambda(x + y) = \\lambda x + \\lambda\
    \ y$.\n(f) $(\\lambda + \\mu)x = \\lambda x + \\mu x$.\n(g) $\\lambda(\\mu x)\
    \ = (\\lambda\\mu)x$.\n(h) $1x = x$.\n\nThe element $0$ given under (c) is the\
    \ *zero element* of $Y$.\n\n**Definition 1.2** Let $S$ and $T$ be nonempty subsets\
    \ of a real linear space $Y$. Then we define the *algebraic sum* of $S$ and $T$\
    \ as\n\n```\n$S + T := \\{s + t \\mid s \\in S \\text{ and } t \\in T\\}$\n```\n\
    \nand the *algebraic difference* of $S$ and $T$ as\n\n```\n$S - T := \\{s - t\
    \ \\mid s \\in S \\text{ and } t \\in T\\}$\n```\n\n© The Author(s), under exclusive\
    \ license to Springer Nature Switzerland 2024\nJ. Hahn, Order Analysis, Deep Learning,\
    \ and Connections to Optimization,\nVector Optimization, https://doi.org/10.1007/978-3-031-67422-8_1\n\
    3"
