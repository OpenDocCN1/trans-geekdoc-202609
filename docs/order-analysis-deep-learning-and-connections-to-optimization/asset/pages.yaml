    **Remark 6.4 (Second Barzilai-Borwein Formula)** Beside the formula for $\lambda_j$
    in line 9 of Algorithm 6.2, there is another formula by Barzilai and Borwein [12].
    It reads


    ```

    $$\lambda_i := \frac{(x^i - x^{i-1})^\text{T}(\nabla f(x^i) - \nabla f(x^{i-1}))}{(\nabla
    f(x^i) - \nabla f(x^{i-1}))^\text{T}(\nabla f(x^i) - \nabla f(x^{i-1}))} \quad
    (6.13)$

    ```


    If we consider again the quasi-Newton equation (6.11) but with the class of updates
    $B''_i := \frac{1}{\lambda}$ for $\lambda > 0$, we can also solve the optimization
    problem


    ```

    $$\min_{\lambda>0} ||x^i - x^{i-1}\|^2 - \lambda(\nabla f(x^i) - \nabla f(x^{i-1}))||_2^2.$

    ```


    With similar arguments as Remark 6.3, we can then obtain the formula (6.13). The
    formula (6.13) can also be used in Algorithm 6.2. However, Dai and Liao [27, line
    on p. 8 find that the formula (6.13) often performs well in practical computations
    than the formula in Algorithm 6.2. Occasionally, the $\lambda_i$ in Algorithm
    6.2 is the long *BB step size* and $\lambda_i$ in (6.13) is the short *BB step
    size* (see [65, 718]). It is interesting to note that both formulas do not guarantee
    a decrease of the objective function values, there does not necessarily have to
    be a descent [117, 27]].


    There is work on extending the step size formula in Algorithm 6.2 (see among others
    [117, 65] and the references). And there are convergence results under some special
    assumptions on the objective function (see see [40] for an early patch on the
    convergence of gradient methods and [12, 116, 134]).


