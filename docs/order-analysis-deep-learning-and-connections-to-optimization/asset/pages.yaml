    (as given in Definition 4.1) and


    ```

    max(A) = {a \in A |\ \bar{a} \leq c, a \in A \Rightarrow a = \bar{a}}

    ```


    With the following proposition, we investigate the question: What does it mean
    in Definition 5.2 if some set $A \in \mathcal{F}$ the two inequalities $A \lesssim_s
    \tilde{A}$ and $\tilde{A} \lesssim_s A$ hold?


    **Proposition 5.4 ([73, Proposition 3.1])** Let $C$ be a convex cone in a real
    linear space $Y$, and let $\mathcal{F}$ be a family of nonempty subsets of $Y$,
    for which the set of minimal elements and the set of maximal elements are nonempty.
    For every $A \in \mathcal{F}$, let the equations


    ```

    A + C = min(A) + C and A - C = max(A) - C

    ```


    satisfied. For some $A \in \mathcal{F}$, we then have


    ```

    \tilde{A} minimal set of $F \iff$ min(\tilde{A}) and max(A) = max(\tilde{A})$\nfor
    all $A \in \mathcal{F}$ with $A \lesssim_s \tilde{A}$.

    ```


    **Proof** for some $A \in \mathcal{F}$ and an arbitrary $A \in \mathcal{F}$, it
    holds by definition


    ```

    $A \lesssim_s \tilde{A}$ and $\tilde{A} \lesssim_s A \iff$ \tilde{A}+C \subseteq
    A+C, A-C \subseteq \tilde{A}-C, \tilde{A} \subseteq A-C$.

    ```


    By Jahn [71, Lemma 2.4], this is equivalent to the following


    ```

    \tilde{A}+C \subseteq A+C, A-C \subseteq \tilde{A}-C, A+C \subseteq \tilde{A}+C,
    \tilde{A}-C \subseteq A-C

    ```


    again equivalent to


    ```

    \tilde{A}+C = A+C, \tilde{A}-C = A-C.

    ```


    By the equalities (5.2), it can be written as


    ```

    min(A)+C = min(A)+C, max(A)-C = max(A)-C.

    ```


    The first equality implies $min(A) \subseteq min(\tildetilde{A})+C$, which means


    ```

    \tilde{a} \in min(\tildetilde{A}) \exists a \in min(A), c \in C : \tilde{a} =
    a+c.

    ```


    Let $\tilde{a} \in min(\tildetilde{A})$ be arbitrarily chosen. Then we have $\tilde{a}
    = a+c$ for some $a \in min(A)$ and some $c \in C$. Since the first equality in
    (5.3) also implies $min(A) \subseteq min(\tildetilde{A})+C$, there are $\hat{a}
    \in min(\tildetilde{A})$ and $\hat{c} \in C$ with $\tilde{a} = a+\hat{c}$. Hence,
    we get


    ```

    \tilde{a} = a+c = \hat{a}+\hat{c}.

    ```'
