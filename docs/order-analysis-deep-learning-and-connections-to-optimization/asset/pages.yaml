  md: '# Example 1.2


    (a) If one defines the componentwise partial order $\leq$ on $\mathbb{R}^n$ by


    ```

    $: := \{(x, y) \in \mathbb{R}^n \times \mathbb{R}^n \mid x_i \leq y_i \text{ for
    all } i \in \{1, \dots, n\}\$

    ```


    then the linear space $\mathbb{R}^n$ becomes a partially ordered linear space.


    (B) For $-\infty < a < b < \infty$, let $C[a, b]$ denote the linear space of continuous
    real-valued functions on $[a, b]$. With the natural partial order $\leq$ on $C[a,
    b]$ given by


    ```

    $: := \{(x, y) \in C[a, b] \times C[a, b] \mid x(t) \leq y(t) \text{ for all }
    t \in [a, b]\}\$

    ```


    the space $C[a, b]$ becomes a partially ordered linear space.


    # Definition 1.9 Let $C$ be a nonemptyet subset of a real linear space $Y$.


    (a) The set $C$ is called a *cone* iff


    ```

    $y \in C, \lambda \geq 0 \implies \lambda y \in C$

    ```


    (see Fig. 1.7).


    (b) A cone $C$ is called *pointed* iff


    ```

    $y \in C, -y \in C \implies y = 0y$

    ```


    (see Fig. 1.8).


    (c) A cone $C$ is called *reproducing* iff $C - C = Y$. In this case, one also
    says that $C$ generates $Y$.


    # Example 1.3 The sets


    ```

    $\mathbb{R}^n_+ := \{y \in \mathbb{R}^n \mid y_i \geq 0 \text{ for all } i \in
    \{1, \dots, n\}\}$

    ```


