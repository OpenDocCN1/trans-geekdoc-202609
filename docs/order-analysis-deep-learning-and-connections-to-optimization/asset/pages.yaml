  md: "# 7.5 Specialization to Interval-Valued Inputs\n\n**Proposition 7.7** *Let\
    \ the assumptions of Theorem 7.5 be fulfilled. The point $\tilde{z}$ solves problem\
    \ (7.17) with the minimal value 0 if and only if $\tilde{z}$ solves the optimization*\n\
    \n```\n$$\\min_{j=1}^p \\left(y_j^l \\text{pred}(z) - y_j^l\\right)^2 + \\left(y_j^u\
    \ \\text{pred}(z) - y_j^u\\right)^2$$\n$$$\\text{subject to}$\n$$$\\underline{b}_i\
    \ \\le \\bar{b}_i \\text{ for all } i \\in {1, \\dots, m\\}$$\n$$$z := (w_1, \\\
    dots, w_n, \\underline{b}_1, \\dots, \\underline{b}_m, \\bar{b}_1, \\dots, \\\
    bar{b}_m) \\in \\mathbb{R}^{n+2m}$$\n(7.18)\n```\n\nThe point $\\tilde{z}$ solves\
    \ problem (7.17) with the minimal value 0 if and only if $\tilde{z}$ is feasible,\
    \ i.e., the constraints are satisfied,\n\n```\n$$\\max \\left\\{|y_j^l \\text{pred}(z)\
    \ - y_j^l|, |y_j^u \\text{pred}(z) - y_j^u|\\right\\ = 0 \\text{ for all } j \\\
    in {1, \\dots, p}.$\\$\n(7.19)\n```\n\nEquation (7.19) is equivalent to\n\n```\n\
