    \n本书从数学角度介绍了序分析和深度学习这两个重要领域。重点是与优化的联系，这种联系构成了一个作为关键技术驱动因素的框架。具体而言，这意味着序分析在优化中的应用是一个核心点，而优化是深度学习中的重要工具。\n\
    \n# 序分析\n\n代数序理论和分析是数学中的重要领域，两者之间少量重叠。如果序理论满足适当条件，那么序分析就是利用分析方法处理序理论问题的合适工具。序分析总结了可以解决序理论问题的分析方法。“序分析”一词在此意义上被首次使用。然而，在工程建模背景下，序分析指的是旋转机械振动信号和噪声的分析。在无监督深度度量学习领域，Kan、Cen、Li、Mladenovic\
    \ 和 He [82] 使用相对序来决定图像是否属于某类；这种所谓的相对序分析随后与度量学习的性能优化相结合。\n\n序分析的主要方法是：序理论中的不等式通常可以被\
    \ $\\mathbb{R}$ 中的不等式所取代，使得泛函分析成为研究序理论问题的合适工具。本书引入了序分析，并描述了其在优化中的重要应用。这些应用包括非线性优化，以及具有固定和可变序结构的向量优化和集优化。可以处理所谓的条件优化问题。在这些与优化相关的应用中，序分析也可以应用于经济和金融问题。\n\
    \n序理论与分析之间的联系通过一个泛函给出，该泛函表示实空间中的一个负凸锥，并将该泛函相对于水平 0 的下水平集作为负凸锥。由于负凸锥等于相对于预序实直线空间中所有负元素（包括零）的集合，因此所有负元素等于该下水平集。这些表示泛函包括\
    \ Bishop-Phelfs 泛函 [18] 和标量化函数，如 Hiriart-Utty [61, 62] 引入的符号距离泛函和 Tammer [43]\
    \ 的 Gerstwitz 标量函数。该理论还涵盖了某些惩罚泛函，这是通过统一的方法实现的。\n\n通常情况下，线性空间中表示凸锥的泛函是不唯一的，因此可以选择具有有用属性的泛函。这对于一般的序分析来说是一个优势。\n\
    \n本书第二部分的重点是序分析的基础知识。假设读者已掌握了泛函分析的基础知识。必要的基础知识在第一部分中进行了总结。第二部分概述的理论适用于经济、金融和优化的各种应用。我们限制在考虑实值、向量值和集值目标函数的优化中。这些问题出现在非线性优化中。\n\
    \n深度 \n\n深度学习是本书第三部分的主题。深度学习的基础知识，如前馈神经网络、监督学习和各种形式的梯度方法，将在第 6 章介绍。重点在于对优化背景至关重要的基础知识。梯度方法作为数值优化中的一类重要方法将进行更详细的讨论。在梯度方法中，引入了一种具有新步长规则的方法，即所谓的牛顿型梯度下降法。\n\
    \n第 7 章的核心是将神经网络扩展到具有集值输入的网络。由于集值输入，获得的权重和偏置在当数据变化处于所考虑的范围内时仍然有效。这导致了更鲁棒的对某些数据变化不敏感的估计器。这也有助于防御对抗攻击。因此，集值输入具有特别重要的意义，这是一个非常有意义的话题。\n\
    \n作为闭区间的集是集值输入的特殊特例。由于输入数据在闭区间内变化很大，我们得到简单的公式。然而，这付出了高代价，因为相应的优化问题是有约束的。\n\n"
