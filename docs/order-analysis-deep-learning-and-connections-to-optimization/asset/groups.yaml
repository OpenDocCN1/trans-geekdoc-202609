    spaces have a similar structure, but they are different in detail.


    Under appropriate assumptions, a relation between the subdifferential of the $-C$
    representing functional at the origin and the dual cone can be given.


    Theorem 2.2 ([74, Theorem 3.1]) Let $C$ be a convex cone of a real normed space
