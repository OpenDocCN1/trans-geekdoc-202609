    **摘要** 本章的主题是深度学习的基本原理、梯度方法的全面讨论以及数值例的处理。这些主题从更具数学的角度进行处理。在神经网络的背景下，我们将介绍性内容主要限制在监督学习。讨论了确定性和随机梯度方法。在确定性变体（也称为批量梯度下降）中，重点是有效的步长规则，如
    Barzilai 和 Borwein (IMA J Numer Anal 8:141–148, 1988) 以及算法 6.3 中的新变体。


    ## 6.1 引言


    多年来，我们见证了人工智能（AI）在许多领域的成功应用，特别是在图像、文本、语言、声音等许多其他领域。在这里，计算机科学与医学、自然科学、经济学和工程学等学科相交叉。这种集合值方法在计算上是计算密集型的，但具有产生更具健壮性预测的优势。


