    $-C$ representing sublinear functional, and let there be some $\tilde{y} \in Y$
    with $\psi(\tilde{y}) < 0$. Then we have*


    $\tilde{y}$ weakly minimal element of $T \iff \tilde{y}$ minimal solution of $\min_{y\in
    T} \psi(y - \tilde{y}).$


