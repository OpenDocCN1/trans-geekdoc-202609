    ```


    如果 $\nabla f(x^i)^T d^i > 0$，则存在某些 $\hat{\lambda} > 0$，使得：


    $f(x^i + \lambda d^i) > f(x^i)$ 对于所有的 $\lambda \in (0, \hat{\lambda})$


