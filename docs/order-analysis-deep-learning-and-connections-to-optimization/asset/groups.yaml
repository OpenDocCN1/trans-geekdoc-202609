    ```

    $b_k^i = \frac{\frac{\partial f}{\partial x_k}(x^i) - \frac{\partial f}{\partial
    x_k}(x^{i-1})}{x_k^i - x_k^{i-1}} \text{ for all } k \in \{1, \dots, n\}.$

    ```


    这产生了迭代方向：


    ```

    $d^i := -(B^i)^{-1} \nabla f(x^i) = - \begin{pmatrix} 1/b_1^i & & & \ddots & &
    & 1/b_n^i \end{pmatrix} \nabla f(x^i)$

    ```


    如果 $b_1^i, \dots, b_n^i \neq 0$。在这些假设下，迭代方向的分量可以简单地写为：


    ```

    $d_k^i := -\frac{x_k^i - x_k^{i-1}}{\frac{\partial f}{\partial x_k}(x^i) - \frac{\partial
    f}{\partial x_k}(x^{i-1})} \text{ for all } k \in \{1, \dots, n\}.$

