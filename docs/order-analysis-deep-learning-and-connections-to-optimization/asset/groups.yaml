    尽管赋范空间是书中部分最重要的空间，我们首先从一般的拓扑空间开始。**定义 1.13** 设 $Y$ 为非空集。


    (a) $Y$ 上的拓扑 $\mathcal{T}$ 定义为满足以下公理的 $Y$ 子集集合：

    - (i) $\mathcal{T}$ 中集合的并属于 $\mathcal{T}$。

    - (ii) $\mathcal{T}$ 中集合的有限交属于 $\mathcal{T}$。

