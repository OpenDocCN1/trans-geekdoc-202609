    - (f) $(\lambda + \mu)x = \lambda x + \mu x$。

    - (g) $\lambda(\mu x) = (\lambda\mu)x$。

    - (h) $1x = x$。


    在 (c) 中给元素 $0$ 是 $Y$ 的**零元素**。


    **定义 1.2** 设 $S$ 和 $T$ 为实线性空间 $Y$ 的非空子集。我们定义 $S$ 和 $T$ 的**代数和**为：


    $S + T := \{s + t \mid s \in S \text{ 且 } t \in T\}$


    $S$ 和 $T$ 的**代数差**为：


    $S - T := \{s - t \mid s \in S \text{ 且 } t \in T\}$


