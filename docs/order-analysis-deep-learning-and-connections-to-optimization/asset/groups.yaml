  - '[PAGE 8]


    learning, the topic of Part III, is divided into two chapters. Chapter 6 presents
    the basics of deep learning, such as deep neural networks, activation functions,
    supervised learning, and gradient methods, along with numerical examples. The
    gradient methods include the usual gradient descent methods, together with a new
    quasi-Newton type gradient descent method, as well as different variants of the
    stochastic gradient methods. Deep learning with set-valued inputs is the subject
    of Chap. 7. The focus is on an extended activation function and on different distance
    terms for sets. Simpler formulas are given for the special case of interval-valued
    inputs.


