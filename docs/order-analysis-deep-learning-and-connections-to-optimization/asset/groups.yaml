    1) = \mathcal{B}(\ell, 1),$$


    ## 2.7 Zeros


    where $\mathcal{B}(\ell, 1)$ denotes the closed ball with center $\ell$ and radius
    1. With Theorem 2.2, we then obtain


    $$cl\left[ \text{cone} \left(\mathcal{B}(\ell, 1)\right)\right] \subseteq C^*.
    \quad (2.13)$$


    It is obvious from the definition of a $-C$ representing functional $\psi$ that
    the zeros of $\psi$ belong to the negative convex cone of the real space. For
    the functional $\psi_1$ in the illustrative Example 2.3, we know that the set
    of zeros equals the boundary of $-C$ (see Fig. 2.4). But for the functional $\psi_2$
    given in Example 2.3 (compare Fig. 2.5), the set of all zeros equals the negative
    convex cone $-C$. Functionals with this property are studied in this section.


    **Example 2.10 ([74, Example 3.4])** As in Example 2.3, let the convex cone $C
    := \mathbb{R}^2_+ \subset \mathbb{R}^2$ be given. But now we consider the $-C$
    representing functional $\psi : \mathbb{R}^2 \to \mathbb{R}$ with


    $$\psi(y) := \max(y_1, y_2) \text{ for all } y = (y_1, y_2) \in \mathbb{R}^2 \quad
    (2.14)$$


    (compare Fig. 2.6). It is evident that


    $$-\mathbb{R}^2_+ = \{y \in \mathbb{R}^2 \mid \psi(y) = 0\},$$


    i.e., the convex cone $-C$ equals the set of all zeros of the functional $\psi$.
    The continuously differentiable function $\psi_2$ given by (2.3) also has this
    property (compare Fig. 2.5).


    Fig. 2.6 Function $\psi : \mathbb{R}^2 \to \mathbb{R}$ given by (2.14) (see [74,
    Fig. 3]) ![](img/e4a2e491dbba0df71ab293f149cd5b_60_0.png)


    ## C Representing Functionals


    **Proposition 2.15 ([74, Proposition 3.9])** Let $C$ be a convex cone of a real
    normed space $(Y, \|\cdot\|)$, and let $\psi$ be a $-C$ representing functional
    with the property that $y \in Y$ have $y \in -C \iff \psi(y) = 0$.


    Then $0^* \in \partial\psi(0_Y)$.


    **Proof** every $y \in Y$, we have $\psi(y) \geq \psi(0_Y) + 0^*(y)$ implying
    $0^* \in \partial\psi(0_Y)$.


    **Theorem 2.3 ([74, Theorem 3.2])** Let $C$ be a convex cone of a real normed
    space $(Y, \|\cdot\|)$, and let $\psi$ be a $-C$ representing functional with
    the property that for $y \in Y$ we have $y \in -C \iff \psi(y) = 0$. Let $\psi''(0_Y)$
    denote the directional derivative of $\psi$ at $0_Y$. Under the additional assumption
    $\ell \in C^* \exists \alpha_{\ell} > 0 : \alpha_{\ell}(y) \leq \psi''(0_Y)(y)$
    for all $y \in Y$, then holds $C^* \subseteq \text{cone}(\partial\psi(0_Y))$.


    **Proof** Let $\ell \in C^*$ be arbitrarily chosen. By assumption (2.15), there
    exists $\alpha_{\ell} > 0$ so that $\alpha_{\ell}(y) \leq \psi''(0_Y)(y)$ for
    all $y \in Y$. With Theorem 1.3 (a), we obtain $\alpha_{\ell} \in \partial\psi(0_Y)$
    implying $\ell \in \frac{1}{\alpha_{\ell}}\partial\psi(0_Y)$. Consequently, we
    have $\ell \in \text{cone}(\partial\psi(0_Y))$.


    Figure 2.7 illustrates assumption (2.15) of Theorem 2.3. This assumption is stronger
    than the condition $0^* \in \partial\psi(0_Y)$ shown in Proposition 2.15. Although
    the equivalence $y \in -C \iff \psi(y) = 0$ is not explicitly used in the proof


    ## 2.8 Extension to Variable Order Structures


    **Fig. 2.7** Illustration of assumption (2.15) in Theorem 2.3 (see [74, Fig. 4])
    ![](img/e4a2e491dbba0df71ab293f149cd5b_62_0.png) of Theorem 2.3, it is a reasonable
    condition for assumption (2.15). Notice that Theorems 2.2 and 2.3 present nearly
    converse inclusions; there are close relations between the dual cone and the subdifferential
    of $\psi$ at the origin under appropriate assumptions.


    **Corollary 2.1** Let the assumptions of Theorems 2.2 and 2.3 be fulfilled. Then
    we have $C^* = cl[\text{cone}(\partial\psi(0_Y))]$.


    **Proof** By Theorem 2.3, we obtain $C^* \subseteq \text{cone}(\partial\psi(0_Y))
    \subseteq cl[\text{cone}(\partial\psi(0_Y))]$ and Theorem 2.2 shows $cl[\text{cone}(\partial\psi(0_Y))
    ] \subseteq C^*$, which completes the proof.


    The theory of $-C$ representing functionals can also be extended to variable order
    structures in a real linear space. In this general case, we assume the following:


    **Assumption 2.2** Let $Y$ be a real linear space, and let $\mathcal{K} : Y \rightrightarrow
    Y$ denote a set-valued map so that the images $\mathcal{K}(y)$ are convex cones
    for all $y \in Y$.


    **Fig. 2.8** Two overlapping Bishop-Phelps cones $K(\tilde{y}^1)$ and $K(\tilde{y}^2)$
    (see [74, Fig. 5]) ![](img/e4a2e491dbba0df71ab293f149cd5b_63_0.png)


    **Definition 2.6 ([74, Definition 3.2])** Under Assumption 2.2, a functional $\psi
    : Y \times Y \rightarrow R$ is called a $-\kappa$ representing functional iff
    $y \in -C \iff \psi(y) = 0$ for all $y \in Y$.


    **Example 2.11 ([74, Example 3.5])** Let $(Y, \|\cdot\|)$ be a real normed space,
    and let $\psi : Y \to \mathbb{R}$ be a $-C$ representing functional. We investigate
    the set-valued map $\mathcal{K} : Y \rightrightarrow Y$ with $\mathcal{K}(y) :=
    \{x \in Y \mid \psi(y+x) \geq 0\}$ for all $y \in Y$.


    **Definition 2.7 ([74, 3.7])** Let $C$ be a convex cone of a real normed space
    $(Y, \|\cdot\|)$, and let $\psi$ be a $-C$ representing functional with the property
    that $y \in Y$ have $y \in -C \iff \psi(y) = 0$.


    **Remark 2.8 ([74, 3.8])** Let $C$ be a convex cone of a real normed space $(Y,
    \|\cdot\|)$, and let $\psi$ be a $-C$ representing functional with the property
    that $y \in Y$ have $y \in -C \iff \psi(y) = 0$. It is obvious from the definition
    of a $-C$ representing functional $\psi$ that the zeros of $\psi$ belong to the
    negative convex cone of the real space. For the functional $\psi_1$ in the illustrative
    Example 2.3, we know that the set of zeros equals the boundary of $-C$ (see Fig.
    2.4). But for the functional $\psi_2$ given in Example 2.3 (compare Fig. 2.5),
    the set of all zeros equals the negative convex cone $-C$. Functionals with this
    property are studied in this section.

