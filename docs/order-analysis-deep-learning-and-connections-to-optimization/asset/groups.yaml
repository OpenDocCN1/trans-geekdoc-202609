    $$\min_{\mathcal{K}_{f_1}(f_1(x))\dots\mathcal{K}_{f_k}(f_k(x))} \begin{cases}
    f_1(x) \vdots \ f_k(x) \end{cases} \\ \text{subject to the constraints} \ g_1(x)
