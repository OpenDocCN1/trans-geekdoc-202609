    # Chapter 7

    Deep Learning with Set-Valued Inputs


    Abstract In this chapter, standard inputs in deep learning networks are extended
    to set-valued inputs. In this framework, a set-valued activation map is given
    that extends the known softsign function. Optimal weights and biases can be computed
    by minimizing the well-known Hausdorff distance between true and predicted sets.
    Two additional distances for special classes of sets are introduced, leading to
    simpler optimization problems. Finally, the theory is specialized to the simple
    case of inputs in the form of closed bounded intervals.


    # 7.1 Introduction


    Deep learning is nowadays an indispensable tool in many modern application areas,
    including AI. Developments in the field of set optimization, with set-valued objectives/constraints,
    encouraging the study of artificial neural networks with set-valued inputs. Such
    inputs allow for the consideration of uncertain data. Uncertainties arise, for
    example, when data are incomplete or caused by rounding errors, approximations
    or certain predictions, and changing environments ([17, p. 361] and the references
    therein). Distribution assumptions are not required for this approach.


    Moreover, if the data of the features in an instance changes slightly, this may
    cause a change in the computed estimate. However, one is often interested in a
    robust estimate, meaning that the computed estimate remains unchanged under small
    perturbations of these input values. This can be achieved by working with set-valued
    inputs, such certain balls around the standard input. Robust estimates are preferred
    in applications.


    Set-valued inputs in deep learning networks require more theoretical and numerical
    effort. Thus, one needs a set-valued activation map by extension of the softsign
    function (Definition 6.2). And the crucial problem to determine the optimal weights
    and biases is more complex than one needs to minimize the distance between true
    and predicted sets. If one chooses the well-known Hausdorff distance, one has
    to solve “inf” problems, which can be complicated. Investigations of the Hausdorff
    distance can be found, for example, in [131, 9, 83].'
  - '[PAGE 152]


    For special classes of sets that occur as inputs, two new distances are introduced
    that are numerically easier to handle. The so-called radial distance refers to
    sets whose boundary can be described by certain functionals. If sets can be described
    by a single inequality constraint, then we work with the introduced constraint
    distance. In both cases, the crucial optimization problems are simpler than the
    corresponding problem with the Hausdorff distance.


    The main results of this work relate to investigations of the properties of the
    two new distances but also of the Hausdorff distance. In particular, we show under
    which conditions the considered sets the Hausdorff distance exists and thus can
    be computed. radial distance is applied to the radial sets, which are restrictive
    and whose properties are studied in more detail. It turns out that the radial
    distance is indeed a metric. The solvability of the crucial optimization problem
    can be proved for this metric under strict conditions. The class of the constrained
    sets turns out to be not as restrictive as the class of radial sets. For the corresponding
    constraint distance, we show that it is a semimetric. Although the triangle inequality
    does not hold in general, the constraint distance can be used for a reasonable
    approximation of the true set by a predicted set. Again, the resulting optimization
    problem for the constraint distance is much simpler than the corresponding problem
    with the Hausdorff distance.


    From the point of applications, closed, bounded intervals (i.e., compact intervals)
    play an important role as inputs. They are easy to handle in deep learning networks.
    It is interesting to note that for the set classes considered, radial, constraint,
    and Hausdorff distances coincide and can be easily calculated. Therefore, the
    corresponding optimization problem has a simple structure.


    # 7.2 Preliminaries


    We start with a motivating example that shows why it is useful to study set-valued
    inputs in neural networks.


    **Example 7.1 (Uncertain Data)** Consider an artificial neuron with standard input
    $x_i \in \mathbb{R}$ for some $i \in \mathbb{N}$. In general, an input $x_i$ is
    fixed. But if it depends on uncertainties, it is a function of uncertain data.
    For example, in the field of renewable energies such as photovoltaic plants or
