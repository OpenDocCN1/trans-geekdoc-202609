    comparable form to mini-batch stochastic gradient methods and stochastic average
    gradient methods. This opens the space for further research.


    There is another important variant of a stochastic gradient method that is not
    discussed in this chapter. Kingma and Ba [86] introduced a much-cited method for
    adaptive moment estimation (Adam). an adaptive step size is used. The special
    adaptation rule uses the second raw moment of the gradient, which has a significant
    advantage over fixed step sizes. Adam is useful for problems with large datasets
    and many variables. This method, and variants of it, seems to be one of the most
    preferred training methods for LLMs. Adam is also implemented in MATLAB.


    Finally, we would like to point out that it is possible to combine a gradient
