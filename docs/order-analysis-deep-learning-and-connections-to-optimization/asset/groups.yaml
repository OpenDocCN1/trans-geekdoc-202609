    我们研究了具有变序结构的集合优化问题。基于实线性空间 $Y$ 中的集合小于序关系，我们考虑 $Y$ 的非空子集族 $\mathcal{F}$，并以类似于定义
    5.2 的方法研究 $\mathcal{F}$ 中的最小集。


