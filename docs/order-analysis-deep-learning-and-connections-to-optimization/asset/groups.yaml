    $\hat{S}_d \subseteq X_d$ 可以写为 $\hat{S}_d = \{x_d^i\}_{i\in N}$，其中 $N := \{1,
    2, \dots, n\}$ ($n \in \mathbb{N}$) 或 $N := \mathbb{N}$，元素为 $x_d^1, x_d^2, \dots
