    $d_k^i := -\frac{x_k^i - x_k^{i-1}}{\frac{\partial f}{\partial x_k}(x^i) - \frac{\partial
    f}{\partial x_k}(x^{i-1})} \text{ for all } k \in \{1, \dots, n\}.$

    ```


