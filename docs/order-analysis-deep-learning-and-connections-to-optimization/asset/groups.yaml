    ## 5.2 变序结构


    ```

    $A \prec_{s,K} B \Longleftrightarrow \max \left\{ \sup_{b\in B\ a\in A} \psi(a-b,
    a), \sup_{a\in A\ b\in B} \psi(a-b, b) \right\} \leq 0$

