    Note that the modulus of continuity is generally used to quantitatively measure
    uniform continuity (see [98, p. 239]).


    The following theorem is presented without proof:


    **Theorem 6.1 (Approximation Property of ReLU Deep Feedforward Neural Networks
    [127, Theorem 1.1])** Let the continuous function $g \in C([0,1]^d)$ be arbitrarily
    chosen, and let $s, t \in \mathbb{N}$ and $p \in [1, \infty)$ be numbers. Then
    there exists a real-valued function $f$ in the class of all functions generated
    by a ReLU deep feedforward neural network with width $\alpha \max \{d t^{-1/2},
    t+1\}$ and depth $2s+\beta$, where


    $$\alpha := \begin{cases} 2 & p \in [1, \infty) \\ 3^d & p = \infty \end{cases}$$


