    x_k}(x^{i-1})}{x_k^i - x_k^{i-1}} \text{ for all } k \in \{1, \dots, n\}.$

    ```


    This results in the iteration direction


    ```

    $d^i := -(B^i)^{-1} \nabla f(x^i) = - \begin{pmatrix} 1/b_1^i & & & \ddots & &
    & 1/b_n^i \end{pmatrix} \nabla f(x^i)$

    ```


