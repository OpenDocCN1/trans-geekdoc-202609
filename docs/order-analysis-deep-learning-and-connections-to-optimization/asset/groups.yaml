    被称为集合 $S$ 的**符号距离泛函**或**有向距离泛函**。


    ## 2.1 Bishop-Phelps、惩罚与标量化泛函


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_40_0.png)


    **图 2.3** 某些 $y \in Y$ 处距离泛函值的说明（参见 [72], 图 2.10）


    **命题 2.1**（参见 [144, Proposition 3.2, (4)]) 设 $C$ 为反射性实 Banach 空间 $(Y, ||\cdot||)$
    中的闭预序锥，且 $C \neq Y$。*那么我们有*


    $$-C = \{y \in Y \mid \Delta_{-C}(y) \leq 0\}$$


    **证明**


    (a) 任取 $y \in -C$。则有


    $$\Delta_{-C}(y) = d_{-C}(y) - d_{Y\setminus(-C)}(y) \leq 0.$$


    (b) 对于任取的 $y \notin -C$，可以得：


    $$\Delta_{-C}(y) = d_{-C}(y) - d_{Y\setminus(-C)}(y) = d_{-C}(y).$$


    对于闭凸锥 $-C$，存在某些 $\tilde{y} \in -C$ 使得


    $$\Delta_{-C}(y) = ||\tilde{y} - y|| > 0 \neq 0$$


    （比较 [72, Thm. 2.18]，该结论由定理 1.2 得出）。因此，我们得出 $\Delta_{-C}(y) > 0$。


    在适当假设下，命题 2.1 指出负凸锥等于符号距离泛函 $\Delta_{-C}$ 关于水平层 0 的下水平集。


    ## 2.2 泛函的表示


    另一种广知的标量化泛函是由 Tammer（原名 Gerstewitz）[43] 于 1983 年引入的。


    **定义 2.4** 设 $S$ 是实线性空间 $Y$ 的非空子集，并任给 $k \in Y\setminus\{0_Y\}$。泛函 $\xi_{S,k}
    : Y \to \mathbb{R} := \mathbb{R} \cup \{-\infty\} \cup \{+\infty\}$ 满足：


    $$\xi_{S,k}(y) := \inf\{t \in \mathbb{R} \mid y \in \{tk\} + S\} \text{ 对于所有 }
    y \in Y$$


    （其中 $\inf \emptyset := +\infty$ 被称为*Gerstewitz 标量化泛函*。）


    在定义 2.4 的假设下，泛函 $\xi_{S,k}$ 也称为沿 $k$ 平移不变（参见 Tammer 和 Weiner [132] 及其参考文献）。在数学金融中，这类泛函在风险测度理论中起着重要作用（参见
    Artzner, Delbaen, Eber 和 Heath [8]）。


    对于我们的研究，该泛函的以下性质至关重要：


    **命题 2.2**（参见定理 5.2.3）设 $Y$ 为实拓扑线性空间，设 $C$ 为 $Y$ 中闭预序锥，且 $C \neq Y$ 且 $C \neq
    \{0_Y\}$。对于每一个 $k \in C\setminus\{0_Y\}$，我们有


    $$-C = \{y \in Y \mid \xi_{-C,k}(y) \leq 0\}.$$


    ### **证明**


    - (a) 任取 $y \in -C$，即 $y-0k \in -C$。我们立即得到：


    $$\xi_{-C,k}(y) := \inf\{t \in \mathbb{R} \mid y-tk \in -C\} \leq 0 \text{ 对于所有
    } y \in Y.$$


    - (b) 选择一个满足 $\xi_{-C,k}(y) \leq 0$ 的任意 $y \in Y$。由于 $C$ 是闭的，存在某些 $t \leq 0$，使得根据命题
    1.1


    $$y \in \{tk\} - C \subseteq -C - C = -C.$$


    因此，我们得出 $y \in -C$。


    命题 2.2 意味着在适当假设下，负凸锥等于由 Gerstewitz 标量化泛函给出的不等式的解集。在数学金融中，风险测度关于水平层 0 给出的下水平集称为*接受集*（参见
    Artzner, Delbaen, Eber 和 Heath [8, Definition 2.3]）。


    ## 定义与示例


    上一节的结果为通过更一般的不等式锥表示负锥的统一方法开启了大门。现在，我们引入表示实线性空间负凸锥的泛函。


    为了我们的研究，我们做出以下标准假设：


    **假设 2.1** $Y$ 为实线性空间，设 $C$ 为 $Y$ 中的凸锥。


    在此假设下，我们使用如下定义的特殊泛函 $\psi$ 来描述凸锥 $-C$：


    **定义 2.5** ([35, Remark 3.3], [73, Assumption 2.1], [74, Definition 3.1]) 满足假设
    2.1。一个泛函 $\psi : Y \rightarrow \mathbb{R}$ 被称为 $-C$ 的表示泛函，当且仅当


    $$-C=\{y \in Y \mid \psi(y) \leq 0\}$$


    从备注 2.1 和 2.2 以及命题 2.1 和 2.2 可以明显看出，Bishop-Phelps 泛函 $\varphi$、惩罚函数 $\eta$、符号距离函数
    $\Delta_{-C}$ 以及 Gerstewitz 标量化函数 $\xi_{-C,k}$ 都是 $-C$ 泛函。


    **示例 2.3** ([74, Example 3.1]) 作为一个简单的说明示例，我们考虑特殊情况 $Y = \mathbb{R}^2$ 和 $C =
    \mathbb{R}^2_+$。 (由于原文此处存在大量乱码，根据逻辑翻译) 符号距离函数 $\Delta_{-C}$ 和 Gerstewitz 标量化函数
    $\xi_{-C,k}$ 均为 $-C$ 泛函。


    *(注：原文中示例 2.3 后包含大量重复和乱码，翻译时已根据上下文逻辑进行了清理并保留了核心结构。)*

