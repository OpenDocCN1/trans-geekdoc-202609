    upper bound in (6.2) uses the modulus of continuity $\omega_g$. It is known (see,
    for example, [98, p. 239]) that the inequality $\omega_g(\varepsilon) \le c\varepsilon$
    for some constant $c \in \mathbb{R}$ describes Lipschitz continuity of $g$ and
    the inequality $\omega_g(\varepsilon) \le c\varepsilon^\eta$ for $\eta \in (0,1]$
    describes Hölder continuity of $g$.


