    \in A \exists b \in B : a \preceq b)$ (5.1)


    $\preceq_C$ 表示由凸锥 $C$ 导出的偏序。

    众所周知，定义 5.1 中的等价式 $(5.1)$ 可以写为：


    $A \preceq_s B \iff B \subseteq A + C \text{ 且 } A \subseteq B - C$


