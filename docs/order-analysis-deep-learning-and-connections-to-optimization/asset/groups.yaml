    # 2.10 Bibliographical Notes


    The presentation of this chapter is based on results by Eichfelder and Jahn [35]
    and Jahn [73, 74]. Specific bibliographical notes are compiled for each subsection.


    **Section 2.1**

    Bishop-Phelps cones introduced by Bishop and Phelps [18] (see also the paper [112]
    of Phelps). For detailed information about the important class of Bishop-Phelps
    cones, compare Jahn [68] and Hahn [53, 54]. Lorentz cones (see Example 2.1) play
    an important role in second-order programming. For research literature on second-order
    programming, see Ben-Tan and Nemirovski [13, Lecture 3] and Alizadeh and Goldfar
    [5]. The Bishop-Phelps functional $\varphi_s$ is a normal functional introduced
    by Zaffaroni [39]. For an early book on penalty methods, we refer to Fiacco and
    McCormick [144]. Since penalty methods are standard techniques in constrained
    nonlinear optimization, these methods are in nearly every book on numerical optimization.
    The Hiriare-Urtty scalizing function was first given by Hiriare-Urrty [61, 62],
    and later, it was studied by Zaffaroni, while Khan, Tammer, and Zălinescu [85]
    used the notion oriented distance functional. The Gerstwitz scalizing function
    was introduced by Tammer (Germany Gerstwitz) [43]. For the properties of the Gerstwitz
    scalizing functional, we refer to Khan, Tammer, and Zălinescu [85], among others.
    An overview of translation invariant functions were given by Tammer and Weidner
    [132] (compare the references therein). Early results on translation functions
    were studied by Hamel [56]. His text also contains an interesting classification
    of various developments. The relationships between several scalizing functions
    were studied by Bouza, Quintana, and Tammer [22]. There are many papers on generalization
    of scalizing functions and their use in optimization. For instance, a recent paper
    by Ansari and Sharma [7] studies the properties of a generalized oriented function
    introduced by Xu and Li [142]. And an extension of the Gerstwitz functional and
    its application in optimization is given by Köbis, Le, Tammer, and Yao [89], among
    others.'
