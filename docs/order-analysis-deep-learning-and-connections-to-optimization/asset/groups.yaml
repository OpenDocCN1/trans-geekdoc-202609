    ## 4.2 Variable Order Structure


    Now, we investigate vector optimization problems with variable order under the
    following assumption:


    **Assumption 4.2** Let $Y$ be a real linear space, let $\mathcal{K} : Y \rightarrow
    Y$ denote a set-valued map so that the images $\mathcal{K}(y)$ are convex cones
    for all $y \in Y$, and let $T$ be a nonempty subset of $Y$.


    In general, the known orders $\le_1$ and $\le_2$ in Definition 2.7 are used in
    vector optimization with variable order. Figure 4.4 illustrates such a variable
    order.


    **Definition 4.4** ([33, Definition 2.7]) Let Assumption 4.2 be satisfied.


    - (a) An element $\tilde{y} \in T$ is called a *nondominated* element of the set
    $T$ iff there is no $y \in T$ with $y \le_1 \tilde{y}$ and $y \neq \tilde{y}$.

    (b) An element $\tilde{y} \in T$ is called a *minimal* element of the set $T$
