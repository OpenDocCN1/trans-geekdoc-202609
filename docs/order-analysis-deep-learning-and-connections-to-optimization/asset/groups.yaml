    # # Part I

    # Fundamentals


    This first part is a compilation of important analytical concepts that are helpful
    for a better study of the two parts that follow. Important definitions and profound
    results are repeated. Emphasis is placed on linear and normed spaces, convexity,
    and preorder structures.'
  - "[PAGE 18]\n\n# Chapter 1\nPreliminaries\n\n**Abstract** In this chapter, we summarize\
    \ the well-known definitions of linear spaces and convex sets, as well as the\
    \ definition of topological linear spaces, and we consider a preorder and a partial\
    \ order in such a linear setting. Special attention is paid to normed spaces.\
    \ Directional derivatives and subdifferentials are also recalled.\n\n# 1.1 Linear\
    \ Spaces and Convexity\n\nFirst, we recall the definition of a real linear space\
    \ and present some other notions.\n\n**Definition 1.1** Let $Y$ be a given set.\
    \ Assume that there is an addition on $Y$, i.e., a map from $Y \times Y$ to $Y$,\
    \ and a scalar multiplication on $Y$, i.e., a map from $\\mathbb{R} \times Y$\
    \ to $Y$, are defined. The set $Y$ is called a *real linear space* if the following\
    \ axioms are satisfied (for arbitrary $x, y, z \\in Y$ and $\\lambda, \\mu \\\
    in \\mathbb{R}$)\n\n+   (a) $x + y + z = x + (y + z)$.\n(b) $x + y = y + x$.\n\
    (c) There is an element $0 \\in Y$ with $x+0 = x$ for all $x \\in Y$.\n(d) For\
    \ every $x \\in Y$, there is a $y \\in Y$ with $x+y=0$.\n(e) $\\lambda(x + y)\
    \ = \\lambda x + \\lambda y$.\n(f) $(\\lambda + \\mu)x = \\lambda x + \\mu x$.\n\
    (g) $\\lambda(\\mu x) = (\\lambda\\mu)x$.\n(h) $1x = x$.\n\nThe element $0$ given\
    \ under (c) is the *zero element* of $Y$.\n\n**Definition 1.2** Let $S$ and $T$\
    \ be nonempty subsets of a real linear space $Y$. Then we define the *algebraic\
    \ sum* of $S$ and $T$ as\n\n```\n$S + T := \\{s + t \\mid s \\in S \\text{ and\
    \ } t \\in T\\}$\n```\n\nand the *algebraic difference* of $S$ and $T$ as\n\n\
    ```\n$S - T := \\{s - t \\mid s \\in S \\text{ and } t \\in T\\}$\n```\n\n© The\
    \ Author(s), under exclusive license to Springer Nature Switzerland 2024\nJ. Hahn,\
    \ Order Analysis, Deep Learning, and Connections to Optimization,\nVector Optimization,\
    \ https://doi.org/10.1007/978-3-031-67422-8_1\n3"
  - "[PAGE 19]\n\n# Preliminaries\n\nFor an arbitrary $\\lambda \\in \\mathbb{R}$,\
    \ the notation $\\lambda S$ is used as\n\n$\\lambda S := \\{\\lambda s \\mid s\
    \ \\in S\\}$.\n\nIt is important to note that the set equation $S + S = 2S$ in\
    \ general does not hold a nonempty subset $S$ of a real linear space.\n\n**Definition\
    \ 1.3** Let $Y$ be a real linear space. The set $Y'$ is defined to be the set\
    \ of all linear functionals from $Y$ to $\\mathbb{R}$. If we define for all $\\\
    varphi, \\psi \\in Y'$ and all $\\lambda \\in \\mathbb{R}$\n\n$(\\varphi + \\\
    psi)(y) := \\varphi(y) + \\psi(y)$ for all $y \\in Y$\n\nand\n\n$(\\lambda\\varphi)(y)\
    \ := \\lambda \\varphi(y)$ for all $y \\in Y$,\n\nthen $Y'$ is a real linear space\
    \ itself, and it is called the algebraic dual space of $Y$.\n\n**Definition 1.4**\
    \ Let $S$ be a subset of convex.\n\n+   (a) The set $S$ is called convex iff for\
    \ all $x, y \\in S$\n\n$\\lambda x + (1 - \\lambda)y \\in S$ for all $\\lambda\
    \ \\in [0, 1]$\n\n(see Fig. 1.1).\n\n+   (b) Let the set $S$ be nonempty. $S$\
    \ is called starshaped with respect to some $\bar{x} \\in S$ iff for every $x\
    \ \\in S$\n\n$\\lambda x + (1 - \\lambda)\\bar{x} \\in S$ for all $\\lambda \\\
    in [0, 1]$\n\n+   (c) Let the set $S$ be nonempty and convex. A functional $f\
    \ : S \\to \\mathbb{R}$ is called convex iff all $x, y \\in S$\n\n$f(\\lambda\
    \ x + (1 - \\lambda)y) \\le \\lambda f(x) + (1 - \\lambda) f(y)$ for all $\\lambda\
    \ \\in [0, 1]$\n\n(see Figs. 1.2 and 1.3).\n\n![](img/e4a2e491dbba0d9f71abf293f149cd5b_19_0.png)\n\
