    $$\min_{j=1}^p \max {|y^j_{pred}(z) - \overline{y^j}|, |\overline{y^j_{pred}}(z)
    - y^j|}$$

    $$\text{subject to}$$

    $$b_i \le \overline{b_i} \text{ for all } i \in \{1, \dots, m\} \quad (7.17)$$

    $$z := (w_1, \dots, w_n, b_1, \overline{b_1}, \dots, b_m, \overline{b_m}) \in
    \mathbb{R}^{n+2m}$$


    $y^j_{pred}(\cdot), \overline{y^j_{pred}}(\cdot)$ 表示第 $j$ 个样本（$j \in \{1, \dots,
    p\}$）的预测区间输出 $[y^j, \overline{y^j}]$ 表示第 $j$ 个样本的真实区间输出。


