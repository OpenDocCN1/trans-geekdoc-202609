    $$\sum_{j=1}^p d_H([y^j_{pred}(\cdot), \overline{y^j_{pred}}(\cdot)], [y^j, \overline{y^j}])
    = \sum_{j=1}^p \max {|y^j_{pred}(\cdot) - \overline{y^j}|, |\overline{y^j_{pred}}(\cdot)
    - y^j|}$$


    如果我们注意到区间的端点约束，生成的优化问题可以写成形式 (7.17)。在深度学习网络中，如果对不等式约束感兴趣，也可以通过如下方式求解修改后的：


    $$\min_{j=1}^p (y_j^l(z) - y^j)^2 + (y_j^u(z) - y^j)^2$$

    $$\text{subject to}$$

    $$\underline{b}_i \le \bar{b}_i \text{ for all } i \in \{1, \dots, m\}$$


    **命题 7.7** *设定理 7.5 的假设满足。点 $\tilde{z}$ 求解问题 (7.17)，当且仅当 $\tilde{z}$ 满足：*


    $$\min_{j=1}^p \max {|y^j_{pred}(z) - \overline{y^j}|, |\overline{y^j_{pred}}(z)
    - y^j|} = 0$$


    方程 (7.19) 等价于


    $$y_j^l(z) - y^j = 0 \text{ and } y_j^u(z) - y^j = 0 \text{ for all } j \in \{1,
    \dots, p\}$$


    这意味着 $\tilde{z}$ 求解问题 (7.17) 具有最小值。根据命题 7.6，映射 $\mathcal{F}$ 是不可微的，对于数值计算，我们可以平滑
    Eq. (14) 中的项或者选择另一种合适的激活函数。


    最后，我们讨论一个带有表 7.3 中数据集的简单示例。这些输入与真实类别以区间的形式给出。相应的输入集如图 7.10 所示。这些集合是矩形或方形。在后续，我们只处理类似于图
    6.19 的，这指示了实值的特殊情况。我们使用 MATLAB R2021a 中实现的 fmincon 来求解优化问题 (7.18)。该问题很难求解，因为存在许多局部极值。因此，从不同的随机选择点开始优化是有意义的。以下最优解是大量点中的一个。


    表 7.3 示例 7.5 数据


    | $x_1$ 区间 | $x_2$ 区间 | 类 |

    | :--- | :--- | :--- |

    | $[-0.5, 0.5]$ | $[-0.5, 0.5]$ | $[1, 1]$ |

    | $[-1.2, -0.8]$ | $[-1.2, -0.8]$ | $[1, 1]$ |

    | $[-2.5, -2]$ | $[-2.5, -2]$ | $[1, 1]$ |

    | $[1.8, 2]$ | $[-3, -1]$ | $[1, 1]$ |

    | $[3, 3.3]$ | $[-2.3, -2]$ | $[1, 1]$ |

    | $[0, 0.5]$ | $[-3.5, -3]$ | $[1, 1]$ |

    | $[-3.3, -3]$ | $[-3.5, -2.8]$ | $[1, 1]$ |

