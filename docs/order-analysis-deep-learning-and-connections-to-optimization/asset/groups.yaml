    ……医学分割方法（参见 [83]）。关于豪斯夫距离的进一步参考可参见 [131, 9]。


    径向函数用于数学的各个领域。在 $\mathbb{R}^2$ 中，Méneroux 等人 [104] 已经在不同的框架下研究了由积分定义的径向距离。本章引入了实数范数空间中径向距离的一个更具通用版本。


    集合值理论到区间值输入的特化在第 [16] 节，第 2 页中进行了描述。最近，Betencourt 和 Muhanna [16] 发表了一种针对区间值输入的深度学习方法，称为深度区间神经网络。它完全基于区间分析，这意味着梯度法也适用于区间变量。然而，在第
    7.5 节中，我们处理的是实值权重且仅有区间值偏置，因此可以使用常用的优化程序。例如，在使用惩罚函数方法时，我们还可以使用无约束优化方法求解子问题。目标是尽可能地减少对区间算术的使用。


