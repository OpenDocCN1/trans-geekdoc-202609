    (b) The gradient descent method basically determines a zero of the gradient of
    the objective function. The condition $\nabla f(x)=0$ is a necessary optimality
    condition for a global as well as for a local minimal or maximal point. Since
    the method belongs to the class of descent methods, i.e., the function values
    of the iteration points are decreased from step to step (see Lemma 6.1), the gradient
    descent method runs to a local minimal point in the “valley" where it starts.
    To find a (global) minimal point, it is recommended to start the procedure repeatedly
    with different starting points and to select the one with the smallest objective
    value among all approximate solutions. An example of this is the Himmelblau function
    [60] $f: \mathbb{R}^2 \to \mathbb{R}$


    $f(x_1, x_2) := (x_1^2 + x_2 - 11)^2 + (x_1 + x_2^2 - 7)^2$ for all $(x_1, x_2)
    \in \mathbb{R}^2$.


