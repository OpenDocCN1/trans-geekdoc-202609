    ## 6.4 激活函数


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_109_0.png)


    **图 6.5** 双曲正切函数 tanh 及其导数 tanh'' 的插图


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_109_1.png)


    **图 6.6** softsign 函数 ρ 及其导数 ρ'' 的视化


    ### 6.4.3 Softsign 函数


    以下由 Turian、Bergstra 和 Bengio [135] 提出的 softsign 函数（另见参见 [30, 108]）在某些方面与 tanh
    相似：


    **定义 6.2** 函数 $\rho : \mathbb{R} \to (-1, 1)$，定义为


    ```

    $\rho(x) := \frac{x}{1 + |x|} \quad \text{对于所有 } x \in \mathbb{R}$

    ```


    被称为*softsign 函数*。图 6.6 展示了 softsign 函数。与 tanh 函数一样，我们得到开区间 $(-1, 1)$ 作为 softsign
    函数的值域。softsign 函数 $\rho$ 的一阶导数为：


    ```

    $\rho''(x) := \frac{1}{(1 + |x|)^2} \quad \text{对于所有 } x \in \mathbb{R},$

    ```


    如图6.6所示。显而易见，softsign 函数 $\rho$ 是一阶连续可微的；二阶导数仅在零点外存在。在实践中，softsign 函数并没有特殊作用。然而，在数值上比
    tanh 函数更容易计算，并且可以通过包含集合值输入来轻松泛化（见第 7.3 节）。


    ### 6.4.4 ReLU 函数


    修正线性单元（缩写为 ReLU）是一种简单的分段线性函数。Fukushima [41] 于1969年引入了这种特殊的激活函数。


    **定义 6.3 ([41, p. 324])** 函数 $\varrho : \mathbb{R} \to \mathbb{R}_+$，定义为


    $$\varrho(x) := \max\{0, x\} \text{ 对于所有 } x \in \mathbb{R}$$


    是 ReLU 函数。


    图 6.7 展示了 ReLU 函数。该函数在上方无界，且在 $\tilde{x} := 0$ 处不可微，但它是连续的。然而，该函数可以在零的一个小邻域内进行平滑，使得修改后的函数是可微的。


    Fukushima [41] 根据一个生物神经元与下一个生物神经元界面突触的功能将这种激活函数定义为恒等函数和零函数的组合。


    ReLU 函数的优势在于，与 sigmoid 或 tanh 函数相比，它不需要执行任何算术运算。另一方面，对于非正值，函数值被设置为零，这可能会消除某些信息。然而，研究文献中报告了特定的成功，这就是为什么这种
    ReLU 激活函数如此流行（参见其他 [26, 110]）。


    Shen、Yang 和 Zhang [127] 从神经元数量的角度对使用 ReLU 激活函数的深层前馈神经网络的近似性能进行了了研究。他们的结果适用于连续函数
    $g : [0,1]^d \to \mathbb{R}$（其中 $d$ 表示特征空间的维度），其连续性模 $\omega_g : [0, \infty) \to
    \mathbb{R}_+ \cup \{\infty\}$ 定义为：


    $$\omega_g(\varepsilon) := \sup \{|g(x)-g(y)\| : x, y \in [0,1]^d, \|x-y\| \le
    \varepsilon\} \text{ 对于所有 } \varepsilon > 0.$$


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_110_0.png)


    ## 6.5 监督学习


    注意，连续性模通常用于定量地衡量一致连续性（参见 [98, p. 239]）。


    以下定理不经证明给出：


    **定理 6.1 (ReLU 深层前馈神经网络的近似属性 [127, Theorem 1.1])** 任意选取连续函数 $g \in C([0,1]^d)$，令
    $s, t \in \mathbb{N}$ 且 $p \in [1, \infty]$ 为数值。那么在所有由 ReLU 深层前馈神经网络生成的函数类中，存在实值函数
    $f$，其宽度为 $\alpha \max \{d t^{-1/2}, t+1\}$，深度为 $2s+\beta$，其中


    $$\alpha := \begin{cases} 2 & p \in [1, \infty) \\ 3^d & p = \infty \end{cases}$$


    以及


    $$\beta := \begin{cases} 4 & p \in [1, \infty) \\ 2d & p = \infty \end{cases}$$


    使得


    $$\|g-f\|_{L^p((0,1)^d)} \le C\sqrt{d}\omega_g(t^{-1/2}).$$


    **备注 6.1 (连续性模的特殊类)** 在定理 6.1 中，(2)界使用了连续性模 $\omega_g$。已知（例如 [98, p. 239]），对于常数
    $c \in \mathbb{R}$，不等式 $\omega_g(\varepsilon) \le c\varepsilon$ 描述了 $g$ 的 Lipschitz
    连续性，而对于 $\eta \in (0,1]$，不等式 $\omega_g(\varepsilon) \le c\varepsilon^\eta$ 描述了
    $g$ 的 Hölder 连续性。


    ### 学习的基础


    一个神经网络描述了一大类函数，但对于特定问题，需要指定权重和偏置。这可以通过从给定的数据集进行*学习*来实现。这样的训练数据集包含输入（如特征）和正确的输出。深度神经网络适当权重和偏置的计算被称为*监督学习*。在本章中，我们主要限制在无约束优化。除了监督学习外，还有所谓的无监督学习、半监督学习或*强化学习*（详见
    [120]）。


    接下来，我们从训练数据集研究监督学习。在具有 $p \in \mathbb{N}$ 个样本的此类数据集中考虑形式为 $(x^j, y^j) \in \mathbb{R}^k
    \times \mathbb{R}^l$ 的任意样本，其中 $x^j$ 是输入向量，$y^j$ 是输出向量。通过选择适当权重向量 $w = (w_1, \dots,
    w_q) \in \mathbb{R}^q$ 和偏置向量 $b = (b_1, \dots, b_r) \in \mathbb{R}^r$（其中 $q, r
    \in \mathbb{N}$），在深度神经网络中，我们尝试找到函数 $f(\cdot, w, b)$ 作为 $y^l$ 的良好近似。对于给定的 $\mathbb{R}^l$
    范数 $\|\cdot\|$，近似误差可以表示为 $\|f(x^j, w, b) - y^j\|$。由于该过程适用于每个样本，我们尽可能保持 $\sum_{j=1}^p
    \|f(x^j, w, b) - y^j\|$。这导致了无约束优化问题：


    $$\min_{(w,b) \in \mathbb{R}^{q+r}} \sum_{j=1}^p \|f(x^j, w, b) - y^j\| \quad
    (6.3)$$


    如果我们使用欧里得范数 $\|\cdot\|_2$，考虑无约束优化问题是有意义的：


    $$\min_{(w,b) \in \mathbb{R}^{q+r}} \sum_{j=1}^p \|f(x^j, w, b) - y^j\|_2 \quad
    (6.4)$$


    出于简单性考虑。注意问题 (6.3) 和 (6.4) 并不总是可解的。例如，


    $$0 = \inf_{(w_1,w_2,b_1,b_2) \in \mathbb{R}^4} |e^{w_1+b_1}| + |e^{w_2+b_2}|$$


    成立，但下界无法达到。该优化问题没有最小值。但以下命题给出了 (6.3) 修改后的求解条件。


    **命题 6.1 (修改问题 (6.3) 的求解)** 给定具有 $p \in \mathbb{N}$ 个形式为 $(x^j, y^j) \in \mathbb{R}^k
    \times \mathbb{R}^l$ 样本的数据集（其中 $j \in \{1, \dots, p\}$），令函数 $f : \mathbb{R}^k
    \times \mathbb{R}^q \times \mathbb{R}^r \to \mathbb{R}^l$ 给出，使得对于所有 $j \in \{1,
    \dots, p\}$ 它都是连续的，且 $\|\cdot\|$ 是 $\mathbb{R}^l$ 中的任意范数。那么对于任何 $\alpha > 0$，约束优化问题


    $$\min_{(w,b) \in B(0_{q+r}, \alpha)} \sum_{j=1}^p \|f(x^j, w, b) - y^j\| \quad
    (6.5)$$


    ## 6.6 梯度法


    （其中 $\mathcal{B}(\mathbb{R}^{q+r}, \alpha)$ 表示 $\mathbb{R}^{q+r}$ 周围半径为 $\alpha$
    的闭球）有一个最小值。


    **证明** 由于闭球是紧的且目标函数 $\sum_{j=1}^p \|f(x^j, \cdot, \cdot) - y^j\|$ 是连续的，根据著名的 Weierstrass
    定理，优化问题 (6.5) 存在最小值。


    巨大的权重或偏置是不有趣的。因此，将约束集限制为某个半径的闭球是有意义的。通过这种修改，我们得到了最小值。


    在实践中，由带有隐藏层的深度神经网络隐含给出的函数类并不是显式形式。因此，优化问题 (6.2) 和 (6.3) 中的目标函数不是显式知的。为了计算对 $(w,
    b)$ 的目标值，我们将训练样本通过神经网络的人工神经元。通过这种方式，第 $j$ 个训练样本的结果为 $f(x^j, w, b)$，我们得到了目标函数的值。


    对于梯度法等数值优化方法，我们需要目标函数在某个 $(w, b) \in \mathbb{R}^{q+r}$ 处的梯度。现在我们假设所选激活函数是可微的。如果我们选择优化问题
    (6.4) 的目标函数，即：


    $$\sum_{j=1}^p \|f(x^j, w, b) - y^j\|^2 = \sum_{j=1}^p (f(x^j, w, b) - y^j)^2
    \text{ 对于所有 } (w, b) \in \mathbb{R}^{q+r}$$


    我们得到了一个可微函数。为了得到该目标函数关于对 $(w, b)$ 的一个分量的偏导数，我们可以使用链式法则回到人工神经元的输入。通过从神经元单元重复这一过程，我们得到了所需偏导数的公式。该过程在网络中反向运行，被称为*反向传播*。关于反向传播的介绍性描述，参考
    Zhou [150]。


    本节关注如下形式的无约束优化问题的数值解：


    $$\min_{x \in \mathbb{R}^n} f(x) \quad (6.6)$$


