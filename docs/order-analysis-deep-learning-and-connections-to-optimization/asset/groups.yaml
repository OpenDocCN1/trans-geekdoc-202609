    ## 5 在集优化中的应用


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_94_0.png)


    图 5.2 $\mathbb{R}^2$ 中简单集的族 $\mathcal{F}$ 以及连同偏序 $\mathbb{R}^2_+$


    我们现在将注意力转向集优化问题。根据实线性空间 $Y$ 中的集小于序关系，我们考虑 $Y$ 的非空子集的一个族 $\mathcal{F}$，并研究 $\mathcal{F}$
    的最小集。


    **定义 5.2** 设 $C$ 为实线性空间 $Y$ 中的一个凸锥，设 $\mathcal{F}$ 为 $Y$ 的非空子集的一个族。称 $\tilde{A}
    \in \mathcal{F}$ 为 $\mathcal{F}$ 的*最小集*，当且仅当：


    $A \preceq_s A, A \in \mathcal{F} \Longrightarrow \tilde{A} \preceq_s A.$


    **示例 5.2** 设 $Y := \mathbb{R}^2$ 且 $C := \mathbb{R}^2_+$。设 $\mathcal{F} := \{A_1,
    \dots, A_5\}$ 为图 5.2 所示的集族。在这种情况下，我们仅有集不等式 $A_2 \preceq_s A_1, A_3 \preceq_s A_1,
    A_4 \preceq_s A_5$，那么显然 $A_2, A_3$ 和 $A_4$ 是 $\mathcal{F}$ 的唯一最小集。


    **备注 5.2** 对于后续的研究，我们分别为一个集合中所有最小元素和极大元素构成的集引入了缩写。这里，我们使用了定义 4.1 给出的最小性概念的扩展。设
    $C$ 为实线性空间 $Y$ 中的凸锥，并给定 $\emptyset \neq A \subseteq Y$。设 $\preceq_c$ 表示由 $C$ 导出的预序。集


    $\min(A) := \{ \tilde{a} \in A \mid a \preceq_c \tilde{a}, a \in A \Longrightarrow
    \tilde{a} \preceq_c a \}$


    表示 $A$ 的最小元素集，集


    $\max(A) := \{ \tilde{a} \in A \mid \tilde{a} \preceq_c a, a \in A \Longrightarrow
    a \preceq_c \tilde{a} \}$


    被称为 $A$ 的极大元素集。当然，如果凸锥 $C$ 是尖的，那么


    $\min(A) = \{ a \in A \mid a \preceq_c A, a \in A \Longrightarrow a = \bar{a}
    \}$ （如定义 4.1 所示）且


    $\max(A) = \{a\in A \mid \bar{a} \leq c, a \in A \Longrightarrow a = \bar{a}\}$


    通过以下命题，我们研究如下问题：对于某个 $A \in \mathcal{F}$，两个不等式 $A \lesssim_s \tilde{A}$ 和 $\tilde{A}
    \lesssim_s A$ 成立，定义 5.2 意味着什么？


    **命题 5.4 ([73])** 设 $C$ 为实线性空间 $Y$ 中的凸锥，设 $\mathcal{F}$ 为 $Y$ 的非空子集的族，其最小元素集和极大元素集非空。对于每个
    $A \in \mathcal{F}$，满足方程


    $A + C = \min(A) + C$ 和 $A - C = \max(A) - C$，则对于某个 $A \in \mathcal{F}$，$\tilde{A}$
    是 $\mathcal{F}$ 的最小集当且仅当对于所有 $A \in \mathcal{F}$ 都有 $A \lesssim_s \tilde{A}$。


    **证明** 对于某个 $A \in \mathcal{F}$ 和任意的 $A \in \mathcal{F}$，根据定义，$A \lesssim_s \tilde{A}$
    和 $\tilde{A} \lesssim_s A$ 成立当且仅当 $\tilde{A}+C \subseteq A+C, A-C \subseteq \tilde{A}-C$。根据
    Jahn [71, 引理 2.4]，这等价于 $\tilde{A}+C \subseteq A+C, A-C \subseteq \tilde{A}-C,
    A+C \subseteq \tilde{A}+C, \tilde{A}-C \subseteq A-C$，再次等价于 $\tilde{A}+C = A+C,
    \tilde{A}-C = A-C$。根据等式 (5.2)，可以写为 $\min(A)+C = \min(A)+C, \max(A)-C = \max(A)-C$。第一个等式意味着
    $\min(A) \subseteq \min(\tilde{A})+C$，这意味着对于 $\tilde{a} \in \min(\tilde{A})$，存在
    $a \in \min(A), c \in C$ 使得 $\tilde{a} = a+c$。任意选取 $\tilde{a} \in \min(\tilde{A})$。对于某个
    $a \in \min(A)$ 和某个 $c \in C$，我们有 $\tilde{a} = a+c$。由于 (5.3) 中的第一个等式也意味着 $\min(A)
    \subseteq \min(\tilde{A})+C$，存在 $\hat{a} \in \min(\tilde{A})$ 和 $\hat{c} \in C$
    使得 $\tilde{a} = a+\hat{c}$。因此，我们得到 $\tilde{a} = a+c = \hat{a}+\hat{c}$。


    ## 5.1 固定序结构


    图 5.3 等式 (5.2) 的说明 [73](img/e4a2e491dbba0d9f71abf293f149cd5b_96.png) 由于 $\bar{a},
    \hat{a} \in \min(\hat{A})$，我们得到 $\hat{c} + c = 0$，即 $c = -\hat{a}$。由于 $C$ 是尖的，我们得到
    $c \in C \cap (-C) = \{0\}$。因此，我们有 $\hat{a} = a$，从而 $\min(\hat{A}) \subseteq \mathbb{R}^2$。通过命名，我们也得到
    $\min(A) \subseteq \min(A)$，并且有 $\min(A) = \min(A)$。等式 $\max(A) = \max(A)$ 可以类比证明。断言的
    $\rightarrow$ 部分从最小性的定义得出。断言的 $\leftarrow$ 部分是等式 (5.3) 的简单结论。注意，集等式 (5.2) 是向量优化中一个著名的假设，也可以对某些非凸集成立（见图
    5.3）。对于 $Y := \mathbb{R}^2, C := \mathbb{R}^2$ 且如图 5.3 所示，我们有 $A + C = \min(A)
    + C$ 和 $A - C = \max(A) - C$。但集等式 (5.2) 通常并不成立；例如，如果我们选择 $Y := \mathbb{R}^2, C
    := \mathbb{R}^2, A = \{(y_1, y_2) \in \mathbb{R}^2 \mid y_1^2 + y_2^2 < 1 \cup
    (-1, 0)\}$（见图 5.4），我们有 $\min(A) + C = (-1, 0)$，并且得到 $\min(A) + C = \{(y_1, y_2)
    \in \mathbb{R}^2 \mid y_1 \geq -1, y_2 \geq 0\} \neq A + C$，即 (5.2) 中的第一个等式不满足。为了在不使用集关系的情况下制定适当的最优条件，我们将命题
    5.4 与命题 5.1 结合。


    **推论 5 ([73, 推论 5])** 设 $C$ 为实线性空间 $Y$ 中的凸锥，设 $\mathcal{F}$ 为 $Y$ 的非空子集的族，其最小元素集和极大元素集非空且满足等式
    (5.2)。


    ## 5.2 变序结构


    图 5.4 由 (5.4) 定义的集 $A$ 和 $A + \mathbb{R}^2_+$![](img/e4a2e491dbba0d9f71abf293f149cd5b_97.png)
    此外，让等式 $\sup_{a \in A} \psi(a-b) = \max_{a \in A} \psi(a-b)$ 和 $\inf_{b \in B}
    \psi(a-b) = \max_{b \in B} \psi(a-b)$ 对于所有 $A, B \in \mathcal{F}$ 满足。对于某个 $\tilde{A}
    \in \mathcal{F}$，$\tilde{A}$ 是 $\mathcal{F}$ 的最小集当且仅当对于所有 $A \in \mathcal{F}$
    都有 $\min(A) = \min(\tilde{A})$ 且 $\max(A) = \max(\tilde{A})$。


    **证明** 根据命题 5.1，不等式 $A \preceq_s \tilde{A}$（对于所有 $A, \tilde{A} \in \mathcal{F}$）可以重写为
    $\max \left\{\max_{a \in A} \psi(a-\tilde{a}), \max_{a \in \tilde{A}} \psi(\tilde{a}-a)\right\}
    \le 0$。


