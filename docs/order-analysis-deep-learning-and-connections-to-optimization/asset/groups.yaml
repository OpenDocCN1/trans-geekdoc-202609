    **备注 7.1** 设函数 $\eta : \mathbb{R}_{++}^{+} \to \mathbb{R}$，对于所有 $a, \overline{a}$，有
    $\eta(a, \overline{a}) = \max(a, \overline{a})$。根据命题 7.1，对于任意 $(a, \overline{a})
