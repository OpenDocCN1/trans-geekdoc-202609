    **Proposition 2.14** ([72, Exercise 8.3]) Let $\tilde{Y} := \mathbb{R}^m$ (with
    $m \in \mathbb{N}$) and $C := \mathbb{R}^m_+$ be chosen. Then the $-C$ representing
