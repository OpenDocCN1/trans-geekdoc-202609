  mdcn: '

    学习是第三部分的主题，分为两个章节。第 6 章介绍了深度学习的基础知识，如深度神经网络、激活函数、监督学习和梯度方法，并附有数值示例。梯度方法包括了常用的梯度下降法，以及一种新的拟牛顿型梯度下降法，以及随机梯度下降的不同变体。具有集合值输入（set-valued
    inputs）的深度学习是第 7 章的主题。该章重点关注扩展的激活函数和针对集合的不同距离项。对于区间值输入的特殊情况，书中给出了更简单的公式。


    # 致谢


    我感谢我的同事 Gabriele Eichfelder、Akthar A. Khan 和 Truong Xuan Duc Ha，感谢他们在序分析课题上的共同工作和富有成效的讨论。我也感谢我的同事
    Wigand Rathmann，他向我介绍了深度学习，并就这一主题与我进行了启发性的讨论。


    德国，埃尔朗根


    Johannes Jahn


    2024年5月


