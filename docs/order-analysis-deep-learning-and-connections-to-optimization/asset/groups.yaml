    优化问题 (7.10) 的极解可以通过求解以下问题得到：


    $$\min_{x\in S(X)} \sup |\varphi_{S_{pred}(w_1, \dots, w_n, B_1, \dots, B_m)}(x)
    - \varphi_{S_{true}}(x)| \text{subject to } w_1, \dots, w_n \in \mathbb{R}; \quad
    B_1, \dots, B_m \in \widehat{P}(X).$$$$


    使用松弛变量，该问题可以重写为：


    $$\min \lambda \text{subject to } -\lambda \leq \varphi_{S_{pred}(w_1, \dots,
    w_n, B_1, \dots, B_m)}(x) - \varphi_{S_{true}}(x) \leq \lambda \quad \text{for
    all } x \in S(X), \\ w_1, \dots, w_n \in \mathbb{R}; \quad B_1, \dots, B_m \in
    \widehat{P}(X)..$$$


    这是一个具有有限变量和无限约束的半无限优化问题。


    ### 7.4.3 约束距离


    当两个集合由约束描述时，可以给出另一种确定两个集合之间距离的方法。出于此目的，我们定义以下类集合：


    **定义 7.7** 设 $X$ 为实线性空间：


    (a) 特殊类 $C_C(X)$ 定义为：


    $$C_C(X) := \{A \in \mathcal{P}(X) \mid A = \{x \in X \mid \psi_A(x) \leq 0\}\}$$


    对于给定的泛函 $\psi_A : X \to \mathbb{R}$，它依赖于 $A$。


    (b) 每一个集合 $A \in C_C(X)$ 称为*约束集*，相关的泛函 $\psi_A$ 称为*约束泛函*。


    显然，$C_C(X)$ 类并不像径向集合类那样具有限制性。对于约束集 $A$，约束泛函 $\psi_A$ 不是唯一的。例如，约束泛函 $2\psi_A$ 也是一个约束泛函（参见示例
    7.4 (b) 的另一个示例）。


    **示例 7.4** 设 $X$ 为实线性空间。


    - (a) 设集合 $A \in \mathcal{P}(X)$ 由 $k$ 个不等式约束（$k \in \mathbb{N}$）定义，即：


    $$A := \{x \in X \mid \psi_i(x) \leq 0 \text{ for all } i \in \{1, \dots, k\}\}$$


    带有泛函 $\psi_1, \dots, \psi_k : X \to \mathbb{R}$。如果我们选择泛函 $\psi_A : X \to \mathbb{R}$：


    $$\psi_A(x) := \sum_{i=1}^k \max\{0, \psi_i(x)\} \quad \text{for all } x \in X,$$


    则 $\psi_A$ 是一个约束泛函。


    - (b) 如果集合 $A \in \mathcal{P}(X)$ 由 $\ell$ 个等式约束（$\ell \in \mathbb{N}$）给出：


    $$A := \{x \in X \mid \eta_i(x) = 0 \text{ for all } i \in \{1, \dots, \ell\}\}$$


    带有泛函 $\eta_1, \dots, \eta_\ell : X \to \mathbb{R}$，则泛函 $\psi_A : X \to \mathbb{R}$：


    $$\psi_A(x) := \sum_{i=1}^\ell |\eta_i(x)| \quad \text{for all } x \in X,$$$$


    是一个约束泛函。另一个约束泛函是 $\tilde{\psi}_A : X \to \mathbb{R}$：


    $$\tilde{\psi}_A(x) := \sum_{i=1}^{\ell} (\eta_i(x))^2 \quad \text{for all } x
    \in X.$$


    在这种情况下，有无限的方法通过泛函类指定约束泛函。


    - (c) 接下来结合不等式和等式约束。设集合 $A \in \mathcal{P}(X)$ 的形式为：


    $$A := \{x \in X \mid \psi_i(x) \leq 0 \text{ for all } i \in \{1, \dots, k\},
    \eta_i(x) = 0 \text{ for all } i \in \{1, \dots, \ell\}\}$$$$


    带有数字 $k, \ell$ 以及泛函 $\psi_1, \dots, \psi_k, \eta_1, \dots, \eta_\ell : X \to \mathbb{R}$。则泛函
    $\psi_A : X \to \mathbb{R}$：


    $$\psi_A(x) := \sum_{i=1}^k \max\{0, \psi_i(x)\} + \sum_{i=1}^\ell |\eta_i(x)|
    \quad \text{for all } x \in X$$


    是一个约束泛函。


    - (d) 最后，考虑使用实线性空间 $Y$ 中凸锥 $C$ 的一般约束。设集合 $A \in \mathcal{P}(X)$ 的形式为：


    $$A := \{x \in X \mid g(x) \in -C\}$$


    其中 $g : X \to Y$ 是给定的映射。现在使用书中第 2部分的序分析。设代表 $-C$ 的泛函 $\psi : Y \to \mathbb{R}$
    给出（参见定义 2.5），即假设：


    $$-C = \{y \in Y \mid \psi(y) \leq 0\}$$$


    则集合 $A$ 可以重写为：


    $$A := \{x \in X \mid \psi(g(x)) \leq 0\$$$$在这种特殊情况下，$\psi_A := \psi \circ g$
    是一个约束泛函。在示例 7.4 中，部分 (a)–(c) 基于熟悉的泛函，而在部分 (d) 中使用了序分析。在 $C_C(X)$ 类中，我们现在引入两个集合之间的距离。


    **定义 7.8** 设 $X$ 为实线性空间。对于两个集合 $A, B \in C_C(X)$ 以及相关的约束泛函 $\psi_A$ 和 $\psi_B$，*约束距离*定义为：


    $$d_c(A, B) := \max_{a \in A} \{0, \sup_{b \in B} \psi_A(b)\}.$$


    **定理 7.3** 设 $X$ 为实线性空间。那么 $C_C(X)$ 类上的约束距离 $d_c$ 具有以下性质：


    - (a) $d_c$ 在 $C_C(X)$ 上是非负的，且对于对所有的 $A, B \in C_C(X)$，$d_c(A, B) = 0 \iff A =
    B$。

    - (b) 对于所有的 $A, B \in C_C(X)$，$d_c(A, B) = d_c(B, A)$。


    **证明** 任意选取 $A, B \in C_C(X)$。(a) 根据定义 7.8，显然 $d_c(A, B)$ 是非负的。进一步，对于泛函 $\psi_A$
    和 $\psi_B$：


    $$A = B \iff A \subseteq B \text{ 且 } B \subseteq A \iff \psi_B(a) \leq 0 \text{
    for all } a \in A \text{ 且 } \psi_A(b) \leq 0 \text{ for all } b \in B \iff 0
    \geq \sup_{a \in A} \psi_B(a) \text{ 且 } 0 \geq \sup_{b \in B} \psi_A(b) \iff
    \max\{0, \sup_{a \in A} \psi_B(a), \sup_{b \in B} \psi_A(b)\} = 0 \iff d_c(A,
    B) = 0.$$$


    (b) 根据定义 7.8，显然 $d_c(A, B) = \max\{0, \sup_{a \in A} \psi_B(a), \sup_{b \in B}
    \psi_A(b)\} = d_c(B, A)$，这需要证明。


    根据定理 7.3，距离 $d_c$ 仅是 $C_C(X)$ 上的半量。一般而言，三角不等式成立。尽管 $C_C(X)$ 类也有限制性，但约束距离 $d_c$
    的关键优势在于人们有“标准”优化问题要解决。


    定理 7.2 不能扩展到 $C_C(X)$ 类，因为通常不满足三角不等式。尽管如此，集合 $S_{true}$ 可以被集合 $S_{pred}$ 合理地近似。


    **命题 7.5** 假设满足假设 7.1。如果优化问题：


    $$\min d_c(S_{pred}(w_1, \dots, w_n, B_1, \dots, B_m), S_{true}) \text{subject
    to } w_1, \dots, w_n \in \mathbb{R}; B_1, \dots, B_m \in \widehat{P}(X) (7.12)$$$$$


    （假设在目标函数中出现的所有集合都包含在 $C_C(X)$ 类中，且具有极值为0的极解 $(\tilde{w}_1, \dots, \tilde{w}_n,
    \tilde{B}_1, \dots, \tilde{B}_m)$），则 $S_{pred}(\tilde{w}_1, \dots, \tilde{w}_n,
    \tilde{B}_1, \dots, \tilde{B}_m) = S_{true}$。$$


    **证明** 对于问题 (7.12) 的每一个极值为0的极解 $(\tilde{w}_1, \dots, \tilde{w}_n, \tilde{B}_1,
    \dots, \tilde{B}_m)$：


    $$d_c(S_{pred}(\tilde{w}_1, \dots, \tilde{w}_n, \tilde{B}_1, \dots, \tilde{B}_m),
    S_{true}) = 0.$$$$


    由定理 7.3 (a) 即可该断言得证。$\square$


    '
