    > 0$ 的 Lipschitz 连续性，即：


    $$\|\nabla f_j(x) - \nabla f_j(y)\|_2 \le L\|x - y\|_2 \text{ 对于所有 } x, y \in
    \mathbb{R}^n.$$


    目标函数 $f$ 对于某些 $\mu > 0$ 是 $\mu$-凸的（定义 1.25）。此外，设 $\{x^i\}_{i \in \mathbb{N}}$
