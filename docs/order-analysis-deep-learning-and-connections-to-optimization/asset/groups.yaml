    54 2 -C Representing Functionals


    # Section 2.2


    In this section, we define $-C$ representing functionals, where $C$ is a convex
    cone in a real linear space. These functionals have already been utilized by Eichfelder
    [35] and Jahn [73] without using this special name. Later, $-C$ representing functionals
    were used by Jahn [74]. It turns out that these functionals form a general class
    of functionals that group together all functionals from Sect. 2.1. In a paper
    by Ha [52], the equality (2.1) is also called the cone representation property
    (P4), where $\psi$ is an abstract scalarizing function.


    # Section 2.3


    The results of this section can already be found in Jahn''s paper [74].


    # Section 2.4


    Most of the results on sublinearity from the author''s paper [74, Subsection 3.3].
    Theorem 2.1 is closely related to a similar result of Bishop-Phelps theory [68],
    Theorem 2.5].


    # Section 2.5


    This section presents results given by the author in [73], Proposition 4.1 and
    Remark 4.2. The proof of Proposition 2.12 is a blueprint for the proofs of Proposition
    2.13 and 2.14. Another very short proof of Proposition 2.13 (a) was given by Hiart-Urrty
    and Leméchal in [63, page 275]. The proof of Proposition 2.13 (a) in the present
    book has the advantage that it can be easily applied to the coercive case. Investigations
    of the directional derivative of the maximal symmetric matrix were already given
    by Magnus [100] (compare also Lancaster [93]; Andrew, Chu, and Lancaster [66];
    Shapiro [126], Zhang, Zhang, and Xiao [149]; and Ding, Sun, and Toh [29].


    # Section 2.6


    Investigations of the subdifferential of scalarizing functionals are known in
    the research literature. The subdifferential of the signed distance functional
    was already studied by Hiart-Urrty [62, p. 69] (compare also Ha [48], Proposition
    21.11). Investigations of the subdifferential of the Gerstewitz scalarizing functional
    were carried out by Khan, Tammer, and Zălinescu [85, Subsection 5.2.5]. For Bishop-Phelps
    cones, the condition of (2.13) in Example 2.9 is included in [68, Thm.2.13].


    # Section 2.7


    It is obvious for a penalty functional for the negative convex cone that all zeros
    of this functional equals the negative convex cone. But it is also known from
    Bishop-Phelps theory that in special the zeros of a Bishop-Phelps functional equal
    the negative convex cone; a comprehensive study of such special cases was carried
    out by Ha and Jahn [54]. It was shown in [54, Lemma 2.1] that a Bishop-Phelps
    cone $C(\ell)$ is given by an equation and only if $\|\ell\|_{Y^*} = 1$. In the
    norm of the continuous linear functional $\ell$ plays an important role in the
    theory of Bishop-Phelps cones.'
