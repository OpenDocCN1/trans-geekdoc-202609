    # 116 深度学习基础


    随后被称为拟牛顿方程或割线方程（可参见 [28, 148]）。通常情况下，拟牛顿方法通过满足拟牛顿方程 (6.11) 的矩阵 $B''$ 更新公式进行工作。


    由于深度学习中的优化可能包含数百万个变量，使用稠密矩阵 $B''$ 是不可行的（无法使用标准的拟牛顿方法）。因此，我们选择了一类简单的矩阵，即矩阵类 $\lambda
    I$，其中 $\lambda > 0$ 必须适当选择，$I$ 表示 $(n, n)$ 单位矩阵。Barzilai 和 Borwein [12] 使用拟牛顿方程为梯度下降法确定了合适的步长。为了对于这一类特殊矩阵获得方程
    (6.11) 的良好近似，我们求解以下优化问题：


    $$\|\lambda I(x^i - x^{i-1}) - (\nabla f(x^i) - \nabla f(x^{i-1}))\|_2^2. \quad
    (6.12)$$


    其可以重写为：


    $$\min_{\lambda>0}(x^i - x^{i-1})^T(\nabla f(x^i) - \nabla f(x^{i-1}))^T[\lambda(x^i
    - x^{i-1}) - (\nabla f(x^i) - \nabla f(x^{i-1}))].$$


    对于每个最小的 $\lambda > 0$，该优化问题的目标函数的导数为零，我们得到：


    $$0 = (x^i - x^{i-1})^T[\lambda(x^i - x^{i-1}) - (\nabla f(x^i) - \nabla f(x^{i-1}))]
    + [x^i - x^{i-1})^T(\nabla f(x^i) - \nabla f(x^{i-1}))^T](x^i - x^{i-1})$$

    $$=2\tilde{\lambda}(x^i - x^{i-1})^T(x^i - x^{i-1}) - 2(x^i - x^{i-1})^T(\nabla
    f(x^i) - \nabla f(x^{i-1}))$$


    意味着：


    $$\tilde{\lambda} := \frac{(x^i - x^{i-1})^T(\nabla f(x^i) - \nabla f(x^{i-1}))}{(x^i
    - x^{i-1})^T(x^i - x^{i-1})}.$$$$


    从拟牛顿方法中已知，迭代如下：


    $$x^{i+1} := x^i + (B^i)^{-1}d^i = x^i + \frac{1}{\lambda}d^i.$$


    如果我们设置：


    $$\lambda_i := \frac{1}{\tilde{\lambda}} = \frac{(x^i - x^{i-1})^T(x^i - x^{i-1})}{(x^i
    - x^{i-1})^T(\nabla f(x^i) - \nabla f(x^{i-1}))}.$$$$


    我们得到了算法 6.2 第 9 行中的 Barzilai-Borwein 步长规则。这种 $\lambda_i$ 的选择不能保证目标函数 $f$ 下降（参见
    [117, p. 27]）。


    ## 6.6 梯度方法


    **备注 6.4 (第二个 Barzilai-Borwein 公式)** 除去算法 6.2 第 9 行中的 $\lambda_j$ 公式外，还有另一个由 Barzilai
    和 Borwein [12] 给出的公式。其形式为：


    $$\lambda_i := \frac{(x^i - x^{i-1})^\text{T}(\nabla f(x^i) - \nabla f(x^{i-1}))}{(\nabla
    f(x^i) - \nabla f(x^{i-1}))^\text{T}(\nabla f(x^i) - \nabla f(x^{i-1}))} \quad
    (6.13)$$


    如果我们再次考虑拟牛顿方程 (6.11)，但使用更新类 $B''_i := \frac{1}{\lambda}$（$\lambda > 0$），我们也可以求解优化问题：


    $$\min_{\lambda>0} \|x^i - x^{i-1}\|^2 - \lambda(\nabla f(x^i) - \nabla f(x^{i-1}))\|_2^2.$$


    通过与备注 6.3类似的证明，我们可以得到公式 (6.13)。公式 (6.13) 也可以用于算法 6.2。然而，Dai 和 Liao [27, 第8页某行]
    发现，公式 (6.13) 在实际计算中的性能通常优于算法 6.2 中的公式。偶尔，算法 6.2 中的 $\lambda_i$ 是长 *BB 步长*，而 (6.13)
    中的 $\lambda_i$ 是短 *BB 步长*（参见 [65, 718]）。有趣的是，这两个公式都不保证目标函数值的减少，不一定非是下降的 [117,
    27]。


    关于扩展算法 6.2 中步长公式的研究有很多（参见其他 [117, 65]）。在对目标函数的特殊假设下，存在收敛性结果（关于梯度法收敛性的早期补丁参见 [40]，以及
    [12, 134]）。


    使用 Barzilai [117] 的一个简单修改测试问题，我们现在通过以下示例讨论算法 6.2 的特性：


    **示例 6.3 ([117] 中的修改问题 2)** 对于任意的 $n \in \mathbb{N}$，我们研究无约束优化：


