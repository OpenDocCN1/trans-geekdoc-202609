    ## 7.5 区间值输入的特化


    区间变量在不确定性数据的优化中是为人知的。它们的优点是只需要期望数据的下界和上界。当数据分布未知时，可以使用它们。在这里，我们考虑 $\mathbb{R}$
    中的闭且有界的区间。


    **定义 7.9** $\mathbb{R}$ 中闭且有界区间的特殊类 $C_{int}(\mathbb{R})$ 定义为：


    $$

    C_{int}(\mathbb{R}) := \{[a, \overline{a}] \mid -\infty < a \leq \overline{a}
    < \infty\}

    $$


    图 7.3 展示了一个具有数值输入和区间输出的人工神经元前馈网络。注意，人工神经元中的数值计算应使用区间算术。后续引理中的公式 (7.13) 用于人工神经元中的区间计算。


    **引理 7.1** 设 $n \in \mathbb{N}$ 为给定的数。对于任意输入 $[x_i, \overline{x}_i] \in C_{int}(\mathbb{R})$，其中
    $i \in (1,\dots,n)$，任意偏置区间 $[b, \overline{b}] \in C_{int}(\mathbb{R})$ 以及任意权重
    $w_1,\dots,w_n \in \mathbb{R}$，我们得到：


    $$

    \sum_{i=1}^n w_i[x_i, \overline{x}_i] + [b, \overline{b}] = [\sum_{i \in L_+}
    w_i x_i + \sum_{i \in L_-} w_i \overline{x}_i + b, \sum_{i \in L_+} w_i \overline{x}_i
    + \sum_{i \in L_-} w_i x_i + \overline{b}] \quad (7.13)

    $$


    ![](img/e4a2e491dbba0d9f71abf293f149cd5b_168_0.png)


    **图 7.3** 具有区间输入和区间输出的人工神经元前馈网络示意图


    其中

    $I_+ := \{i \in \{1, \dots, n\} \mid w_i > 0\}$

    以及

    $I_- := \{i \in \{1, \dots, n\} \mid w_i < 0\}$


    **证明** 回忆对于任意的两个区间 $[x_i, \overline{x}_i], [x_j, \overline{x}_j] \in C_{\text{int}}(\mathbb{R})$，其中
    $i, j \in \{1, \dots, n\}$，加法定义为：


    $$

    [x_i, \overline{x}_i] + [x_j, \overline{x}_j] = [x_i + x_j, \overline{x}_i + \overline{x}_j]

    $$


    对于某些权重 $w_i \in \mathbb{R}$，我们有：


    $$

    \begin{cases} [w_i x_i, w_i \overline{x}_i] & \text{if } w_i > 0 \\ [w_i \overline{x}_i,
    w_i x_i] & \text{if } w_i < 0 \\ [0, 0] & \text{if } w_i = 0 \end{cases}

    $$


    利用这些公式，我们可以写道：


    $$

    \sum_{i=1}^n w_i [x_i, \overline{x}_i] = \sum_{i \in I_+} w_i [x_i, \overline{x}_i]
    + \sum_{i \in I_-} w_i [\overline{x}_i, x_i]

    $$


    这包含了等式 (7.13)。


    以下命题提供了激活映射 $\mathcal{F}$ 的显式公式：


    **命题 7.6** 设 $[a, \overline{a}] \in C_{\text{int}}(\mathbb{R})$ 为任意选择。那么对于激活映射
