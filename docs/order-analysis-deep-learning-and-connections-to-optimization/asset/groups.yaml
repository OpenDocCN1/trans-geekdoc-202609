    with $\psi(0) = 0$ and has a nonempty subdifferential $\partial\psi(0)$. Then
    it holds


    ```math

    $$\text{cl} (\partial\psi(0)) \subseteq C^*.$$$

    ```


    Proof $\ell \in \text{cl} [\partial\psi(0)]$ be arbitrarily chosen. Then there
    exist sequences $(\lambda_n)_{n \in \mathbb{N}}$ and $(\ell_n)_{n \in \mathbb{N}}$
    with $\lambda_n \geq 0$ and $\ell_n \in \partial\psi(0)$ for all $n \in \mathbb{N}$
    so that $\bar{\ell} = \lim_{n \to \infty} \lambda_n \ell_n$. By the definition
    of the subdifferential, we have for every $n \in \mathbb{N}$


    ```math

    $$\psi(y) \geq \psi(0) + \ell_n(y) = \ell_n(y) \quad \text{for all } y \in Y.$$$

    ```

