    $Y$ 为**实线性空间**：


    - (a) $x + y + z = x + (y + z)$。

    - (b) $x + y = y + x$。

    - (c) 存在元素 $0 \in Y$，对于所有 $x \in Y$，有 $x+0 = x$。

    - (d) 对于每一个 $x \in Y$，存在 $y \in Y$ 使得 $x+y=0$。

