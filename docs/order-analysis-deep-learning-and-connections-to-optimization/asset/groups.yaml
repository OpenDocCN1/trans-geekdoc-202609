    在这种情况下$(Y, \mathcal{T})$ 称为拓扑空间，$\mathcal{T}$ 的元素称为开集。


    (b) 设 $\mathcal{S}$ 和 $\mathcal{T}$ 是 $Y$ 两个拓扑。$\mathcal{S}$ 比 $\mathcal{T}$ *更细*（或称
    $\mathcal{T}$ 比 $\mathcal{S}$ *更粗*），当且仅当每个 $\mathcal{S}$-开集都是 $\mathcal{T}$-开集。


    (c) 设 $(Y, T)$ 为拓扑空间，设 $S$ 为 $Y$ 的子集，令 $y \in Y$ 为给定元素。S$ 称为 $y$ 的邻域，当且仅当存在开集
    $T$ 使得 $y \in S$。S$ 的所有内部元素的集合称为 $S$ 的内部，记为 $int(S)$。集合 $S$ 称为闭集，当且仅当 $Y \setminus
    S$ 是开集。$Y$ 的所有与 $S$ 相交的闭包元素的集合称为 $S$ 的闭包，记为 $cl(S)$。


    一个非空预序 $I$，其序关系具有反射性和传递性，称为是有方向的，当且仅当 $I$ 中的任意两个元素在 $I$ 中都有上界。从方向集 $I$ 到非空集 $Y$
    的映射称为网，记为 $(y_i)_{i \in I}$。拓扑空间 $(Y, T)$ 中的网 $(y_i)_{i \in I}$ 称为收敛于某个 $y \in
    Y$，当且仅当对于 $y$ 的每个邻域 $U$，存在 $n \in I$，使得对于所有的 $i \geq n$，都有 $y_i \in U$。拓扑空间 $(Y,
    T)$ 中的元素 $y \in Y$ 称为 $y$ 的极限点，当且仅当对于 $y$ 的每个邻域 $U$ 和每个 $n \in I$，都一个 $i \in I$。


    (e) 拓扑空间 $(Y, T)$ 中的非空子集 $S$ 称为紧的，当且仅当 $S$ 中的网都有极限点。


    (f) 设 $(X, S)$ 和 $(Y, T)$ 为两个拓扑空间。映射 $f : X \to Y$ 在 $x$ 处连续，当且仅当对于 $f(x)$ 的每个邻域
    $V$，存在 $x$ 的邻域 $U$，使得 $f(U) \subseteq V$。$f : X \to Y$ 在 $X$ 上是连续的，当且仅当对于每个 $x
    \in X$ 都是连续的。


    接下来，我们考虑拓扑空间 $(X, T)$其中 $X$ 现在是一个线性空间。在这种情况下，我们要求空间的拓扑和线性结构是兼容的。


    **定义 1.14** $Y$ 为实线性空间，$T$ 为 $Y$ 上的拓扑。


    (a) $(Y, T)$ 称为实线性空间，当且仅当加法和数乘是连续的，即映射 $(x, y) \mapsto x + y$ 对于 $x, y \in Y$，$(\alpha,
    y) \mapsto \alpha y$ 对于 $\alpha \in \mathbb{R}$ 和 $y \in Y$ 分别在 $Y \times Y$ 和
    $\mathbb{R} \times Y$ 上连续。在许多情况下，为了简单，我们用 $Y$ 代替 $(Y, T)$ 表示拓扑线性空间。


    (b) 拓扑线性空间 $Y$ 的子集 $S$ 称为有界的，当且仅当对于 $0$-邻域 $U$，存在 $\lambda \in \mathbb{R}$ 使得
    $S \subseteq \lambda U$。


    (c) 实拓扑空间 $Y$ 的非空子集 $S$ 称为完备的，当且仅当 $S$ 中的柯西网收敛于 $y \in S$（即对于 $S$ 中的网 $(y_i)_{i
    \in I}$ 如果 $\lim_{i,j\in I} (y_i - y_j) = 0$，存在 $y \in S$ 使得 $\lim_{i\to\infty}
    y_i$）。


    **命题 1.3** 设 $S$ 是实拓扑线性空间 $Y$ 中的非空凸集。闭包 $cl(S)$ 是凸的。对于 $int(S) \neq \varnothing$，有：

    (a) $int(S) = core(S)$。

    (b) $cl(S) = S$。


    如果 $S$ 不是凸的，$int(S)$ 和 $core(S)$ 可能不等。例如，对于示例 1.1 中的非凸 $S$，我们得到 $int(S) \neq core(S)$（比较图
    1.5）。


