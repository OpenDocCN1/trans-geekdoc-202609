    由于幻觉可能会出现问题，即输出文本包含了呈现为事实的虚假或误导性信息 [141]。大语言模型（LLMs）是 Transformer 模型 [38, p. 7]。Merritt
    [105] 指出：“Transformer 模型是一种神经网络，它通过跟踪随机数据（如本句中的数据）中的关系来学习上下文和这种含义。”


    ## 6.6


    第 6.6 节提供了深度学习中不同梯度方法的概述。由于优化问题具有高维性，应尽量避免矩阵运算。因此，我们将范围限制在不同类型的梯度方法上，而不研究拟牛顿法。


    梯度方法有不同的名称。这是因为由于数学、计算机科学、工程和医学等研究领域在使用并扩展这些方法。例如，IBM [66] 将梯度下降划分为三种类型：批量梯度下降、随机梯度下降和小批量梯度下降。批量梯度下降意味着在优化问题中考虑整个大型数据集，这导致了一个非常复杂且处理时间很长的问题。第
    6.6 节中的方法适用于此任务（例如，参见 [124]）。随机梯度下降是第 6.2 节的主题，在整个数据集中进行随机选择，在速度和内存需求方面具有优势。小批量下降是上述两个概念的某种结合，并利用了它们的优点。它在第
    6.6 节中描述，因为它是一种扩展的随机梯度方法。


    1847 年，Cauchy [23] 介绍了第 6.6.1 节给出的最陡下降法（关于历史论文的分类请参见 [96]）。算法 6.2 给出的 Barilai-Borwein
    方法 [12] 的理论发展和扩展由 Raydan [116, 117]、Dai 和 Liao [270] 以及 Huang 等人 [65] 制定。对于深度学习问题，Todorov-Tanev
    [134] 也给出梯度方法。算法 6.3 也可以理解为 Barilai-Borwein 方法的一个特例，因为它同样基于拟牛顿方程。


    Robbins 和 Monro [119] 在 1951 年给随机梯度方法的基础基础。随机梯度方法的最新进展可以在 [147, 97, 133, 44] 等文献中找到。小批量随机梯度方法在今天非常流行。然而，如果在后续迭代中继续使用函数
    $f_1,...$，那么在多次迭代中会建立起有用的梯度信息记忆，随后可以使用。通过这种方式，可以改进目标函数梯度的估计。这种策略被用于随机平均梯度法（算法
    6.6）。该方法由 Le Roux、Schmidt 和 Bach 在多篇论文中引入（参见 [94, 95, 123, 124]，以及 [139]）。


    若干梯度方法的变体使用恒定步长实现（例如，参见 [19]），这在随机梯度下降中很常见。如果算法 6.2 和 6.3 中使用的步长公式能以比的形式应用于小批量随机梯度方法和随机平均梯度方法，将是理想的。这为进一步的研究开辟了空间。


    本章没有讨论另一种重要的随机梯度变体。Kingma 和 Ba [86] 引入了一种被广泛引用的自适应矩估计（Adam）。它使用了自适应步长。特殊的自适应规则使用梯度的二阶原始矩，与固定步长相比具有显著优势。Adam
    适用于具有大型数据集和许多变量的问题。这种方法及其变体似乎是大语言模型最青睐的训练方法之一。Adam 在 MATLAB 中也有实现。


    最后，我们想指出可以将梯度方法与随机方法结合，以确定目标函数的全局最小点。为此，我们参考第 6.7 节。


