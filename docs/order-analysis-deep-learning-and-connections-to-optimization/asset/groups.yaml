    ## 3.2 2 - $-C$ 表示泛函


    对于 $k \in N$ 和非零向量 $a^1,...,a^k \in \mathbb{R}^m$，泛函 $\psi : \mathbb{R}^m \to
    \mathbb{R}$


    $$\psi(y) := \max_{i\in\{1,\dots,k\}} \{-a_i^T y\} \text{ 对于所有 } y \in \mathbb{R}^m$$


    是 $-C$ 表示的。对比示例 2.2 以获得一个可微的 $-C$ 表示泛函。


    在特殊情况 $C := R_m^+$ 下，我们得到一个简单的 $-C$ 表示泛函 $\psi$：


    $$\psi(y) := \max\{y_1,...,y_m\} \text{ 对于所有 } y = (y_1,...,y_m) \in \mathbb{R}^m$$


    泛函 $\psi : \mathbb{R}^m \to \mathbb{R}$


    $$\psi(y) := ||(y_1,...,y_{m-1})||_2^2 + y_m \text{ 对于所有 } y \in \mathbb{R}^m$$


    （其中 $m \ge 2$ 且 $||\cdot||_2$ 表示 $\mathbb{R}^{m-1}$ 中的欧几里得范数）对于洛伦兹锥 $C_L$ 是 $-C_L$：


    $C_L = \{(y_1,...,y_m) \in \mathbb{R}^m \mid ||(y_1,...,y_{m-1})||_2 \le y_m\}$


    （同样对比示例 2.1）。


    ## 2.3 基本性质


    我们总结了 $-C$ 表示泛函的一些性质。


    **命题 2.3** ([74, Proposition 3.1]) 假设满足假设 2.1，并令 $\psi$ 为 $-C$ 表示泛函。


    - (a) $C \neq \{0\} \iff y \in Y\setminus\{0\}: \psi(y) \le 0$。

    - (b) $C$ 是尖锐的 (pointed) $\iff (y \in Y, \max\{-y\}, \psi(y)) \le 0 \Rightarrow
    y = 0)$。


    **证明**


    - (a) 因为 $C \neq \{0\} \Leftrightarrow -C \neq \{0\}$，断言根据等式 (2.1) 得出。

    - (b) 因为凸锥 $C$ 是尖锐的 $\iff C \cap (-C) = \{0\}$，断言根据等式 (2.1) 得出。


    **命题 2.4** ([74, Proposition 3.2]) 假设满足假设 2.1，并令 $\psi$ 为 $-C$ 表示泛函。


    - (a) $\forall y \in Y: \psi(y) \le 0 \Rightarrow$ 对于所有 $\lambda \ge 0, \psi(\lambda
    y) \le 0$。

    - (b) $\forall y^1, y^2 \in Y: \max\{\psi(y^1), \psi(y^2)\} \le 0 \Rightarrow
    \psi(y^1 + y^2) \le 0$。

    - (c) $\psi(0) \le 0$。


    ## 2.4 次线性性


    - (d) *如果此外，$Y$ 是一个实拓扑线性空间，$\psi$ 在 $0$ 处连续且 $C \neq Y$，我们有 $\psi(0) = 0$。*


    **证明** 断言 (a) 和 (b) 源于凸锥 $-C$ 的条件，即：


    $y \in -C \Rightarrow$ 对于所有 $\lambda \geq 0, \lambda y \in -C$


    以及


    $y^1, y^2 \in -C \Rightarrow y^1 + y^2 \in -C$。


    部分 (c) 是 $0 \notin -C$ 的直接结论。在部分 (d) 中，注意存在某些 $y \notin -C$ 意味着


    对于所有 $\lambda > 0, \psi(\lambda y) > 0$。


    因此，我们得到 $\psi(0) \geq 0$，且断言根据部分 (c) 得出。


    **命题 2.5** ([74, 3.3]) *假设满足假设 2.1*，并令 $\psi$ 为 $-C$ 表示泛函。那么*


    - (a) $\tilde{y} - C = \{y \in Y \mid \psi(y-\tilde{y}) \leq 0 \text{ 对于所有 } \tilde{y}
    \in Y\}$。

    - (b) $\tilde{y} + C = \{y \in Y \mid \psi(y-\tilde{y}) \leq 0 \text{ 对于所有 } \tilde{y}
    \in Y\}$。

    - (c) $S - C = \{y \in Y \mid s \in S, \psi(y-s) \leq 0 \text{ 对于所有非空集合 } S \subseteq
    Y\}$。

    - (d) $S + C = \{y \in Y \mid s \in S, \psi(y-s) \leq 0 \text{ 对于所有非空集合 } S \subseteq
    Y$。


    **证明** 我们仅证明断言 (a) 和 (c)，因为另外两个可以通过分析法证明：


    - (a) $\tilde{y} - C = \{y \in Y \mid y-\tilde{y} \le 0\} = \{y \in Y \mid \psi(y-\tilde{y})
    \le 0\} \text{ 对于所有 } \tilde{y} \in Y$。

    - (c) $S - C = \{y \in Y \mid s \in S, \psi(y-s) \le 0\} \text{ 对于所有非空集合 } S \subseteq
    Y$。


    这里，我们现在研究额外具有次线性的 $-C$ 表示泛函。这一额外假设是不现实的，如下例：


    **示例 2.7** $(Y, \|\cdot\|)$ 是一个实范数空间，选取某个连续泛函 $\ell \in Y^*$。然后考虑 Bishop-Phelps
    泛函 $\varphi_\ell : Y \to \mathbb{R}$


    $$\varphi_\ell(y) := \ell(y) + \|y\|$$


    根据备注 2.1，该泛函是 $-C$ 表示的。此外，$\varphi_\ell$ 是次线性的，因为对于所有 $y \in Y$ 和 $\lambda \ge
    0$：


    $\varphi_\ell(\lambda y) = \ell(\lambda y) + \|\lambda y\| = \lambda\ell(y) +
    \lambda\|y\|$


    以及


    $\varphi_\ell(y^1 + y^2) = \ell(y^1 + y^2) + \|y^1 + y^2\| \le \ell(y^1) + \ell(y^2)
    + \|y^1\| + \|y^2\| = \varphi_\ell(y^1) + \varphi_\ell(y^2)$ 对于所有 $y^1, y^2 \in
    Y$（对比定义 1.7）。


    **命题 2.6** ([74, Proposition 3.4]) 令 $Y$ 为实空间。对于每一个次线性泛函 $\psi : Y \to \mathbb{R}$，集合
    $S := \{y \in Y \mid \psi(y) \le 0\}$ 是一个锥。


    **证明** 令 $\psi : Y \to \mathbb{R}$ 为次线性泛函。选取 $y \in S$ 和 $\lambda \ge 0$，$\psi(\lambda
    y) = \lambda\psi(y) \le 0$，即 $\lambda y \in S$。此外，对于所有 $y^1, y^2 \in S$，我们得到


    $\psi(y^1 + y^2) \le \psi(y^1) + \psi(y^2) \le 0$，意味着 $y^1 + y^2 \in S$。因此，集合
    $S$ 是一个锥。


    但并不是泛函 $\psi : Y \to \mathbb{R}$（其中 $Y$ 表示线性空间）都具有水平集 $\{y \in Y \mid \psi(y)
    \le 0\}$ 是锥的性质，由（2.3）给出。


    **命题 2.7** ([74, Proposition 3.5]) 假设满足假设 2.1，并令 $\psi$ 为次线性表示泛函。存在某个线性泛函 $\ell
    \in Y''$ 使得 $-C$ 包含在半空间 $\{y \in Y \mid \ell(y) \le 0\}$ 中。


    **证明** $\psi$ 是次线性泛函，根据 Hahn-Banach 定理，存在线性泛函 $\ell \in Y''$，对于所有 $y \in Y$，有
    $\psi(y) \ge \ell(y)$。对于每个 $y \in -C$，则有 $0 \ge \psi(y) \ge \ell(y)$，这证明了断言。


    **定理 2.1** ([74, Proposition 3.6]) 假设满足假设 2.1，并令 $\psi$ 为次线性 $-C$ 表示泛函。那么：


    - (a) $\{y \in Y \mid \psi(y) \le 0\} \subseteq \text{core}(-C)$。

    - (b) 如果后者为空，$\text{core}(-C) \subseteq \{y \in Y \mid \psi(y) < 0\}$。


    **证明**


    (a) 选取 $y \in Y$ 且 $\psi(y) < 0$。对于任意 $h \in Y$，存在某个足够小的 $\lambda > 0$，使得


    $$\psi(y + \lambda h) \le \psi(y) + \lambda\psi(h) < 0 \text{ 对于所有 } \lambda \in
    [0, \tilde{\lambda}].$$


    这意味着 $y \in \text{core}(-C)$。根据假设，存在某个 $\bar{y} \in Y$ 使得 $\psi(\bar{y}) < 0$。则存在某个
    $\lambda > 0$ 使得 $-\lambda\bar{y} \in -C$。因此，我们得到


    $$\psi(y) = \psi(y - \lambda\bar{y} + \lambda\tilde{y}) \le \psi(\lambda\tilde{y})
    \le \lambda\psi(\tilde{y}) < 0.$$


    这是需要证明的。


    在定理 2.1 的假设下，可以推导出


    $$y \in \text{core}(-C) \subseteq \{y \in Y \mid \psi(y) < 0\}$$


    如果后者为空。


    **命题 2.8** ([74, Proposition 3.7]) 假设满足假设 2.1，并令 $\psi$ 为 $-C$ 表示泛函。选取 $y \in
    Y$ 且 $\psi(y) < 0$，则 $y \in \text{core}(-C)$。


    **证明** 因为 $\psi(y) < 0$，我们有 $y \in \text{core}(-C)$。


    **命题 2.9** ([74, Proposition 3.8]) 令 $(Y, \|\cdot\|)$ 为实范数空间，并选取某个连续泛函 $\ell \in
    Y^*$。则 $C = \{y \in Y \mid \ell(y) \le 0\}$ 是一个锥。


    **证明** 因为 $\psi(y) < 0$，我们有 $y \in \text{core}(-C)$。


    **命题 2.10** 假设满足假设 2.1，并令 $\psi$ 为 $-C$ 表示泛函。如果 $\psi$ 是正齐的（即 $\psi(\lambda y)
