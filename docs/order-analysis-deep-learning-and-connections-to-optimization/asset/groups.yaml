    ## 6.6 梯度法


    ### 算法 6.4 (随机梯度法)


    ```

    1 输入: $f_1, \dots, f_p : \mathbb{R}^n \to \mathbb{R}$, 起向量 $x^0 \in \mathbb{R}^n$,

    2 最大迭代次数 $i_{max}$。

    3

    4 $i := 0$ % 初始化

    5 while $i \le i_{max}$ do

    6 $k := \text{randi}(p)$ % 随机整数（在 $\{1, \dots, p\}$ 中均匀采样）

    7 $d^i := -\nabla f_k(x^i)$ % 迭代方向

    8 选择 $\lambda_i > 0$ % 步长

    9 $x^{i+1} := x^i + \lambda_i d^i$

    10 $i := i + 1$

    11 end while

    13

    输出: $x^1, x^2, \dots$

    ```


    ### 注意 6.7


    - (A) 6.4 没有在第 8 行指定步长 $\lambda_i$。在实践中，通常使用如 $\lambda_i = \frac{1}{i}$（$i \in
    \mathbb{N}$）的步长公式，或者使用 0.1、0.01 或 0.001 等常数步长。$\lambda_i$ 的良好选择实际上取决于所考虑的优化问题。


    - (B) 前述算法在迭代 $x^i$ 时仅使用一个梯度 $\nabla f_k(x^i)$，并忽略了其他 $j \in \{1,\dots,p\} \setminus
    \{k\}$ 的梯度 $\nabla f_j(x^i)$。由于缺乏这些信息，无法假设使用的迭代方向是特别好的。然而，可以很容易观察到目标函数在几次迭代后是连续下降的。


    接下来，我们可以引用 Garridos 和 Gover [42] 关于在适当假设下随机梯度法的收敛率。


    **定理 6.4 (随机梯度法的收敛性 [42], 定理 5.7])** 设函数 $f_1, \dots, f_p : \mathbb{R}^n \to \mathbb{R}$
    中的 $n, p$ 是可微、凸且有下界的，并令目标函数 $f : \mathbb{R}^n \to \mathbb{R}$ 由 (6.17) 定义。对于每个
    $j \in \{1,\dots,p\}$，梯度 $\nabla f_j$ 是 Lipschitz 连续的，即存在 Lipschitz 常数 $L_j >
    0$ 使得：


    $$|\nabla f_j(x) - \nabla f_j(y)\|_2 \le L_j\|x - y\|_2 \text{ 对于所有 } x, y \in
    \mathbb{R}^n。 $$


    目标函数 $f$ 对于 $\mu > 0$ 是 $\mu$-强凸的（定义 1.25）。此外，设 $(x^i)_{i\in\mathbb{N}}$ 是由算法
    6.4 生成的序列，常数步长 $\lambda$（对于所有 $i \in \mathbb{N}$, $\lambda_i = \lambda$）满足 $0
    < \lambda < \min\{\frac{1}{\mu}, L_{\max}\}$，其中 $L_{\max} := \max_{1\le j\le p}
    L_j$。


    那么，对于每个 $i \in \mathbb{N}$，


    ```

    E\left(\|x^i - \bar{x}^i\|_2^2\right) \leq (1-\lambda\mu)^i\|x^0 - \bar{x}^i\|_2^2
    + \frac{2\lambda}{\mu}V(G),

    ```


    其中 $\bar{x} \in \mathbb{R}^n$ 是优化问题 (6.6) 的唯一最小解，$V(G)$ 表示离散 $\mathbb{R}^n$ 取值随机元素
    $G$ 的方差，它均匀分布并取值为梯度 $\nabla f_i(\bar{x}), \dots, \nabla f_p(\bar{x})$。


    在该定理中，方差 $V(G)$ 也称为梯度噪声 [42]，定义 4.16。关于随机梯度法的收敛结果，请参阅手册 [42]。


    接下来，我们将随机梯度法应用于示例 6.3 中的优化问题。


    **示例 6.5** 如 6.3 所示，考虑无约束优化问题 (6.14)，其目标函数 $f: \mathbb{R}^n \to \mathbb{R}$ 给出：


    ```

    $f(x) = \sum_{j=1}^n \frac{j}{10}(e^{x_j} - x_j - 1)$

    =: \sum_{j=1}^n \frac{j}{10}(e^{x_j} - x_j - 1) \text{ 对于所有 } x := (x_1, \dots,
    x_n) \in \mathbb{R}^n$

    =:f_j(x)$

    ```


    这里我们有 $p := n$，且函数 $f_j: \mathbb{R}^n \to \mathbb{R}$（对于 $j \in \{1, \dots, n\}$）在此处是简单的。对于
    $n=10$，6.15 显示了目标函数 $f$ 在迭代点 $x^{1000}, \dots, x^{2000}$ 处的值。


    '
