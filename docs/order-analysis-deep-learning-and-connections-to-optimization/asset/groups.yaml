    ## 4.4 参考文献


    更具理论意义。集合的强最小元素给出了一个非常强的最优性术语。许多集合没有强最小元素，因此，这种已知的最优性概念在实践中往往并不适用。


    ## 4.2 节


    本节的结果已由 Jahn [74, 第 4.2 节] 开发。Jahn 和 Khan [76] 针对目标映射和约束使用可变顺序结构的具体向量优化问题建立了最优性条件。这种方法没有使用表示泛函。由于顺序是可变的，拉朗日乘数不是常数，而是变量的函数。


    ## 4.3 节


    第 4.3 节的结果已由 Jahn 和 Khan [76, 第 4 节] 发表。结构优化中可以发现消失约束的问题 [1, 示例 1]。Achtziger 和
    Kanzow 是第一个研究该类问题的最优条件和约束限定的人。具有切换约束的数学规划问题，例如 Mehlitz [105] 及其参考文献。条件目标出现在 Eichfelder
    [33, 第 1.3.1 节] 研究的医学数据图像注册中。Wacker [137]（也参见 Wacker 和 Deinzer [138]）是第一个通过加权方法研究此类问题的人，其中非负权重在迭代过程中可能会变化。由于目标的权重可能为零，基于医学技术中的这些具体应用，Eichfelder
    [32, 33] 开发了向量优化中的可变顺序结构理论。可变顺序结构是研究问题 (4.8) 的工具。


    如果集合 $G_1, \dots, G_m$ 由不等式描述，那么 (4.8) 中的条件约束可以转换为具有消失约束数学规划 (MPVC) 的约束，这与平衡约束数学规划
    (MPEC) 密切相关（细节请参见 Achtziger 和 Kanzow [1]）。在本节中，我们不假设集合 $G_1, \dots, G_m$ 具有特殊结构。这是可能的，因为我们使用了可变顺序结构。


    ## 第 5 章

    # 集合优化的应用


    **摘要** —— 表示 $-C$ 或 $-\mathcal{K}$ 的泛函是集合优化中的重要工具。在优化领域，人们研究具有集合值目标映射的优化问题。但在这里，我们在更通用的框架下研究这些问题，即我们研究一个集合族中的最小集合。与上一章一样，我们研究由凸锥
    $C$ 给出的固定顺序结构问题，以及由合适的集合值映射 $\mathcal{K}$ 引入的可变顺序结构问题。在两种情况下，主要主题都是最小集合的刻画。


    ## 5.1 固定顺序结构


    第一步，需要一个用于比较非空集合的序关系。实践中可以使用不同的序关系（例如，比较 Jahn 和 Ha [75]）。为了简单起见，我们限制使用 Young 在
    1931 年引入的 [143] 为人知的集合小于序关系。


