    该数据集中有四个实例，每个实例由两个特征 $a$ 和一个分类数字（为 -1 或 1）组成。作为预测分类数字的函数，我们选择


    $\mathcal{F}(p_1,p_2,p_3) := \{f \in \mathbb{R}^2 \mid f(x_1, x_2) = \tanh(p_1x_1
    + p_2x_2 + p_3) \forall (x_1, x_2) \in \mathbb{R}^2$


    其中 $p_1, p_2, p_3 \in \mathbb{R}$ 是任意选择的参数，$x_1, x_2$ 表示特征。该类的每个函数都依赖于参数 $p_1,
    p_2, p_3 \in \mathbb{R}$。在此类中，我们的目标是为每个实例找到最优参数，使得给定特征处的函数值近似于分类数字。这可以通过求解无约束优化问题来实现：


    $$\min_{p_1,p_2,p_3 \in \mathbb{R}} (\tanh(-2p_1 - p_2 + p_3) - 1)^2 + (\tanh(25p_1
    + 6p_2 + p_3) + 1)^2 + (\tanh(17p_1 + 4p_2 + p_3) + 1)^2 + (\tanh(-15p_1 - 6p_2
    + p_3) - 1)^2.$$


    当 $p_1 = -4.5504, p_2 = -1.7752$ 且 $p_3 = 3.7752$ 时，该优化问题的目标值为 $1.4132 \times
    10^{-5}$。因此，公式


    $y = \tanh(-4.5504x_1 - 1.7752x_2 + 3.7752)$ 对于四个实例的给定的特征 $x_1$ 和 $x_2$，给出了分类数字
    $y$ 的良好近似。在实践中，一个数据集自然包含大量实例，这使得相关优化目标变得非常复杂。例如，众名的数据集集 [84] 包含一个超过 250,000 个实例的数据集和一个包含超过
    60,000 个特征的数据集。因此，人工智能中的现实世界问题导致的具有挑战性的优化问题还需要可以使用深度神经网络系统地构建的复杂函数。


    ## 6.2 人工神经元


    神经系统中的*神经元*是一种接收电信号并产生传输到其他神经元的信号的兴奋细胞。图 6.1 展示了一种称为多极元的特殊神经元，它有许多树突但只有一个轴突。估计人脑有
    860 亿个神经元（比较 [58]）。人工神经元是生物神经元的数学形式化表示，如图 6.2 所示。为了简单起见，在不与生物情况混淆时，人工神经元通常简单称为神经元。每个人工神经元可以有几个输入
    $x_1, \dots, x_k \in \mathbb{R}$（$k \in \mathbb{N}$）和一个输出 $\hat{y} \in \mathbb{R}$。在人工神经元内部，每个输入
    $x_i$（$i \in \{1, \dots, k\}$）都与某个权重 $w_i \in \mathbb{R}$ 相乘。这些项之和加上偏置 $b \in
    \mathbb{R}$。然后对这个最终结果应用所谓的激活函数 $\varrho : \mathbb{R} \to \mathbb{R}$，得到该人工神经元的输出。换句话说，输出
    $\hat{y}$ 可以写为：


    $$\hat{y} = \varrho\left(\sum_{i=1}^{k} w_ix_i + b\right) = \varrho(w^T x + b)$$


    $w := (w_1, \dots, w_k)$ 且 $x := (x_1, \dots, x_k)$。激活函数 $\varrho$ 应该以适当的方式选择；第
    6.4 节讨论了一些常见的激活函数示例。对于给定的输入向量 $x$，输出 $\hat{y}$ 由权重向量 $w$、偏置 $\hat{b}$ 和激活函数 $\varrho$
    的选择决定。


    ## 6.3 深度神经网络


    解决复杂的 AI 问题通常需要复杂的人工神经元网络。图 6.3 展示了所谓的*前馈神经网络* (FNN)，这意味着信息是向前流动的，*即*，从输入节点（没有循环或环）通过隐藏节点到输出节点。在神经网络中，沿直线垂直对齐的元素集合称为*层*。


    ![](img/e4a2491dbba09f71ab293f149cd5b_105_0.png)

    图 6.1 多极元的插图，由 Blausen 提供，取自 Wikimedia [20]


    ![](img/e4a2491dbba09f71ab293f149cd5b_105_1.png)

    图 6.2 具有输入 $x_1, x_2, \dots, x_k$ 和一个输出 $\hat{y}$ 的人工神经元插图


    ## 6.4 激活函数


    在本节中，我们将讨论对深度学习至关重要的激活函数。


    ### 6.4.1 Sigmoid 函数


    Sigmoid 函数可能是最著名的函数之一。定义 6.1 由函数 $\varrho : \mathbb{R} \to (0, 1)$ 给出


    $$\varrho(x) = \frac{1}{1 + e^{-x}}$$


    被称为*sigmoid* 函数。


    ![](img/e4a2491dbba09f71ab293f149cd5b_108_0.png)

    图 6.4 来自定义 6.1 的 sigmoid 函数 $\rho$ 及其导数 $\rho''$


    函数 $\rho$ 的值域等于开区间 $(0, 1)$。如果倾向于范围 $(-1, 1)$，则可以考虑修改后的函数：


    $$2\rho(x) - 1 = \frac{1-e^{-x}}{1+e^{-x}}$$


    ### 6.4.2 tanh 函数


    双曲正切也用作激活函数。显然，它也可以写成形式：


    $$tanh(x) = \frac{e^x-e^{-x}}{e^x+e^{-x}} = \frac{1-e^{-2x}}{1+e^{-2x}} = 2\rho(2x)-1$$


