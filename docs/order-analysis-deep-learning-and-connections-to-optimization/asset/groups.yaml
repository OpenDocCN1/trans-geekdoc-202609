    Since the set-valued maps are defined at an image vector of the vector functions
    $f_1, \dots, f_k, g_1, \dots, g_m$, the injectivity assumption ensures that each
    image vector has a unique preimage vector, so that the set-valued maps are well-defined
    on the image set of each vector function. Under the further additional assumption
    that objectives do not vanish all together, we can give a formulation of the conceptual
