    and Sanger 2007）。


    ## 3.5 非英语语言中的停用词


    到本章为止，我们一直关注英语停用词，但英语并不代表每种语言。我们目前为止使用的“短”列表和“长”列表的概念是专门针对英语这种语言的。你应该预期不同的语言会有不同数量的“无信息”单词，并且这个数量取决于语言的形态丰富性；包含每个停用词所有可能的形态变体的列表可能会变得非常大。


    不同语言在每类词中拥有不同数量的单词。例如语法格如何影响德语中冠词的使用。下表显示德语中定冠词和不定冠词的使用¹⁷


    中文停用词列表的构建既有手动的，也有自动的（Zou, Wang, Deng, Han, and Wang 2006），但到目前为止还没有被接受为标准（Zou,
    Wang, Deng, and Han 2006）。对中文文本中停用词识别的全面讨论将超出本书的范围，因此我们只重点介绍一些与英语不同的挑战。


    与英语的主要区别是使用意音文字而不是字母来传递信息。然而，中文汉字不应与中文单词（词）混淆。现代汉语中的大多数单词是由多个字符组成的。这意味着推断单词的存在变得更加复杂，而且停用词的概念将影响这种字符分词的完成。


    ## 3.6 总结


    在许多标准的 NLP 工作流中，移除停用词被呈现为默认或正确的选择，且无需任何注释。虽然移除停用词可以提高你使用文本数据进行机器学习的准确性，但此类步骤的选择是复杂的。现有停用词列表的内容差异巨大，而构建你自己的列表的可用策略可能会对你的模型结果产生微妙或不微妙的影响。


