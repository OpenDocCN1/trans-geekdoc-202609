- raw: 'In R, text is typically represented with the *character* data type, similar
    to strings in other languages. Let''s explore text from fairy tales written by
    Hans Christian Andersen, available in the **hcandersenr** package ([Hvitfeldt,
    2019a](#bib.xhtml#refbib_48)). This package stores text as lines such as those
    you would read in a book; this is just one way that you may find text data in
    the wild and does allow us to more easily read the text when doing analysis. If
    we look at the first paragraph of one story titled “The Fir-Tree,” we find the
    text of the story is in a character vector: a series of letters, spaces, and punctuation
    stored as a vector.


    ![](images/pg9_1.jpg)![](images/pg10_1.jpg)


    The first nine lines stores the first paragraph of the story, each line consisting
    of a series of character symbols. These elements don''t contain any metadata or
    information to tell us which characters are words and which aren''t. Identifying
    these kinds of boundaries between words is where the process of tokenization comes
    in.


    In tokenization, we take an input (a string) and a token type (a meaningful unit
    of text, such as a word) and split the input into pieces (tokens) that correspond
    to the type ([Manning, Raghavan, and Schütze 2008](#bib.xhtml#refbib_76)). [Figure
    2.1](#03chap_02.xhtml#f2_1) outlines this process.


    ![FIGURE 2.1: A black box representation of a tokenizer. The text of these three
    example text fragments has been converted to lowercase and punctuation has been
    removed before the text is split.](images/fig2_1.jpg)


    **FIGURE 2.1:** A black box representation of a tokenizer. The text of these three
    example text fragments has been converted to lowercase and punctuation has been
    removed before the text is split.


    Most commonly, the meaningful unit or type of token that we want to split text
    into units of is a **word**. However, it is difficult to clearly define what a
    word is, for many or even most languages. Many languages, such as Chinese, do
    not use white space between words at all. Even languages that do use white space,
    including English, often have particular examples that are ambiguous ([Bender,
    2013](#bib.xhtml#refbib_6)). Romance languages like Italian and French use pronouns
    and negation words that may better be considered prefixes with a space, and English
    contractions like “didn''t” may more accurately be considered two words with no
    space.


    To understand the process of tokenization, let''s start with a overly simple definition
    for a word: any selection of alphanumeric (letters and numbers) symbols. Let''s
    use some regular expressions (or regex for short, see [Appendix A](#Appendix01.xhtml))
    with strsplit() to split the first two lines of “The Fir-Tree” by any characters
    that are not alphanumeric.


    ![](images/pg11_1.jpg)


    At first sight, this result looks pretty decent. However, we have lost all punctuation,
    which may or may not be helpful for our modeling goal, and the hero of this story
    ("fir-tree") was split in half. Already it is clear that tokenization is going
    to be quite complicated. Luckily for us, a lot of work has been invested in this
    process, and typically it is best to use these existing tools. For example, **tokenizers([Mullen
    et al., 2018](#bib.xhtml#refbib_83))** and **spaCy ([Honnibal et al., 2020](#bib.xhtml#refbib_43))**
    implement fast, consistent tokenizers we can use. Let''s demonstrate with the
    **tokenizers** package.


    ![](images/pg12_1.jpg)


    We see sensible single-word results here; the tokenize\_words() function uses
    the **stringi** package ([Gagolewski, 2020](#bib.xhtml#refbib_35)) and C++ under
    the hood, making it very fast. Word-level tokenization is done by finding word
    boundaries according to the specification from the International Components for
    Unicode (ICU). How does this word boundary algorithm[^(11)](#fn11)


    *   Break at the start and end of text, unless the text is empty.


    *   Do not break within CRLF (new line characters).


    *   Otherwise, break before and after new lines (including CR and LF).


    *   Do not break within emoji zwj sequences.


    *   Keep horizontal whitespace together.


    *   Ignore Format and Extend characters, except after sot, CR, LF, and new lines.


    *   Do not break between most letters.


    *   Do not break letters across certain punctuation.


    *   Do not break within sequences of digits, or digits adjacent to letters (“3a,”
    or “A3”).


    *   Do not break within sequences, such as “3.2” or “3,456.789.”


    *   Do not break between Katakana.


    *   Do not break from extenders.


    *   Do not break within emoji flag sequences.


    *   Otherwise, break everywhere (including around ideographs).


    While we might not understand what each and every step in this algorithm is doing,
    we can appreciate that it is many times more sophisticated than our initial approach
    of splitting on non-alphanumeric characters. In most of this book, we will use
    the **tokenizers** package as a baseline tokenizer for reference. Your choice
    of tokenizer will influence your results, so don''t be afraid to experiment with
    different tokenizers or, if necessary, to write your own to fit your problem.


    ## 2.2 Types of tokens


    Thinking of a token as a word is a useful way to start understanding tokenization,
    even if it is hard to implement concretely in software. We can generalize the
    idea of a token beyond only a single word to other units of text. We can tokenize
    text at a variety of units including:


    *   characters,


    *   words,


    *   sentences,


    *   lines,


    *   paragraphs, and


    *   n-grams.


    In the following sections, we will explore how to tokenize text using the **tokenizers**
    package. These functions take a character vector as the input and return lists
    of character vectors as output. This same tokenization can also be done using
    the **tidytext ([Silge and Robinson, 2016](#bib.xhtml#refbib_104))** package,
    for workflows using tidy data principles where the input and output are both in
    a dataframe.


    ![](images/pg14_1.jpg)


    The tokenization achieved by using tokenize\_words() on sample\_vector:


    ![](images/pg14_2.jpg)


    will yield the same results as using unnest\_tokens() on sample\_tibble; the only
    difference is the data structure, and thus how we might use the result moving
    forward in our analysis.


    ![](images/pg14_3.jpg)![](images/pg15_1.jpg)


    Arguments used in tokenize\_words() can be passed through unnest\_tokens() using
    the “the dots”[^(12)](#fn12)


    ![](images/pg15_2.jpg)


    ### 2.2.1 Character tokens


    Perhaps the simplest tokenization is character tokenization, which splits texts
    into characters. Let''s use tokenize\_characters() with its default parameters;
    this function has arguments to convert to lowercase and to strip all non-alphanumeric
    characters. These defaults will reduce the number of different tokens that are
    returned. The tokenize\_\*() functions by default return a list of character vectors,
    one character vector for each string in the input.


    ![](images/pg16_1.jpg)


    What do we see if we take a look?


    ![](images/pg16_2.jpg)


    We don''t have to stick with the defaults. We can keep the punctuation and spaces
    by setting strip\_non\_alphanum = FALSE, and now we see that spaces and punctuation
    are included in the results too.


    ![](images/pg16_3.jpg)![](images/pg17_1.jpg)


    The results have more elements because the spaces and punctuation have not been
    removed.


    Depending on the format you have your text data in, it might contain ligatures.
    Ligatures are when multiple graphemes or letters are combined as a single character
    The graphemes “f” and “l” are combined into “ﬂ,” or “f” and “f” into “ff.” When
    we apply normal tokenization rules the ligatures will not be split up.


    ![](images/pg17_2.jpg)'
