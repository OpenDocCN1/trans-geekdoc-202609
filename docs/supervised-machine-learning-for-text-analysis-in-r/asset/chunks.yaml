    在 R 语言中，文本通常用 `character` 数据类型表示，类似于其他语言中的字符串。让我们探索由汉斯·克里斯蒂安·安德森写的童话文本，这些文本来自于
    `hcandersenr` 包（Hvitfeldt, 2019a）。该包将文本存储为行，就像你在书中读的那样；这只是你在野外环境中发现文本数据的一种方式，并且能够让我们在进行分析时更容易地阅读文本。如果我们看一个名为《松树》的故事的第一段，会发现故事的文本存储在一个字符向量中：一组存储在向量中的字母、空格和标点符号。


    images/pg9_1.jpg/pg10.jpg


    前九行存储了故事的第一段，每行由一组字符符号组成。这些元素不包含任何元数据或信息，用以告诉我们哪些字符是单词，哪些不是。识别单词之间的这类边界边界正是分词（tokenization）过程大显用场的地方。


    在分词过程中，我们接收一个输入（字符串）和一个标记类型（文本的有意义单位，如单词），并将输入拆分为对应该类型的片段（标记）（Manning, Raghav,
    and Schütze 2008）。`图 2.1`](#03chap_02.xhtml#f2_1) 概述了这一过程。


    **图 2.1：** 分词器的黑盒表示。这些示例文本片段的文本在拆分之前已转换为小写并移除了标点符号。images/fig2_1.jpg/images2_1.jpg


    最常见的、我们想要将文本拆分为单位的有意义单位或标记类型是 `word`。然而，对于许多或大多数语言来说，很难清晰地定义什么是单词。许多语言（如中文）完全不在单词之间使用空格。即使是使用空格的语言（包括英语），通常也有特定的歧义的示例（Bender,
    2013）。意大利语和法语等罗曼语言使用的代词和否定形式可能被视为带有空格的前缀，而英语缩写如“didn''t”可能更准确地被视为两个没有空格的单词。


    为了理解分词过程，让我们从对单词一个极其简单的定义开始：任何字母数字（字母和数字）符号的选取。让我们使用一些正则表达式（简称为 `regex`，见附录 A）配合
    `strsplit()`，通过任何非字母数字的字符来拆分《松树》的前几行。


    初看，这个结果看起来不错。然而，我们丢失了所有的标点符号，这对我们的建模目标可能有用也可能有害，而且 "fir-tree" 被拆分了一半。显而易见，分词将会变得非常复杂。幸运的是，人们在这个过程中已经投入了大量工作，通常使用现有的工具是最好的。例如，`tokenizers`
    (Mullen et al., 2018）和 `spaCy` (Honnibal et al., 2020）实现了我们可以使用的快速、一致的分词器。让我们用
    `tokenizers` 包来演示一下。


    images/pg11_1.jpg/imagespg12_1.jpg


    我们在这里看到了合理的单词结果；`tokenize_words()` 函数底层使用了 `stringi` 包（Gagolewski, 2020）和 C++，使其运行非常快。单词级分词是通过根据
    Unicode 国际组件（ICU）的规范找到单词边界完成的。这个单词边界算法是如何工作的？（#fn11）


    * 在文本的开始和结束处断开，除非文本为空。

    * 不在 `CRLF`（换行符）内部断开。

    * 否则，在换行符（包括 `CR` 和 `LF`）前后断开。

    * 不在 emoji zwj 序列内部断开。

    * 保持水平空格在一起。

    * 忽略格式（Format）和扩展（Extend）字符，但在 `sot`、`CR`、`LF` 和新行之后除。

    * 不在大多数字母之间断开。

    * 不在大多数标点符号之间断开。

    * 不在 emoji zwj 序列内部断开。

    * 不在扩展字符之间断开。

    * 不在字母数字序列内部断开。

    * 不在字母数字序列内部断开。

    * 不在大多数字母之间断开。

    * 不在大多数标点符号之间断开。

    * 不在 emoji zwj 序列内部断开。

    * 不在扩展字符之间断开。

    * 不在字母数字序列内部断开。

    * 不在字母数字序列内部断开。

    * 不在大多数字母之间断开。

    * 不在 emoji 之间断开。

    * 否则，在处处断开（包括字形字）。


    虽然我们可能不理解算法的每一步在做什么，但我们可以发现它比我们的初始方法要复杂得多。在本书的大部分范围内，我们将使用分词器作为基准。分词器的选择会影响结果，因此不要害怕尝试不同的分词器以适应你的问题


    ## 2.2 标记类型


    将标记视为单词是理解分词的一种有用方法，即使这在软件中很难实现。我们可以将标记的概念从单个单词扩展到其他单元。我们可以提取：


    * 字符

    * 单词

    * 句子

    * 行

    * 段落

    * n-gram


    在接下来的章节中，我们将探索如何使用 `tokenizers` 包对文本进行分词。这些函数接受字符向量作为输入并返回字符向量列表作为输出。这种分词也可以使用
    `tidytext` (Silge and Robinson, 2016) 包完成，适用于使用 tidy 原则的工作流，输入和输出都是 dataframe。


    images/pg14.jpg


    在 `sample_vector` 上使用 `tokenize_words()` 实现的分词将产生与 `sample_tibble` 上使用 `unnest_tokens()`
    相同的结果；唯一的区别在于数据结构，以及我们之后如何使用结果。


    images/pg14_3.jpg/15_1.jpg


    `tokenize_words()` 中的参数可以通过 `unnest_tokens()` 传递（#fn12）15_2.jpg


    ### 2.2.1 字符标记


    也许简单的分词是字符分词，它将文本拆分为字符。让我们使用默认参数 `tokenize_characters()`；该函数具有转换为小写和删除所有非字母数字字符的参数。这些默认设置将减少返回的不同标记数量。`tokenize_*`
    函数默认返回字符向量列表，输入中的每个字符串对应一个字符向量。


    images/pg16_1.jpg


    如果我们看一眼，我们看到了什么？


    images/pg16_2.jpg


    我们不必固守默认设置。通过设置 `strip_non_alphanum = FALSE`，我们可以保留标点和空格，现在我们看到结果中也包含了空格和标点。


    images/pg16_3.jpg/17_1.jpg


    取决于你的文本数据的格式，它可能包含连字。连字是多个字形或字母组合成单个字符。字形“f”和“l”组合成“ﬂ”，“或“f”和“f”组合成“ff。”当我们应用常规分词规则时，连字不会被拆分。


    images/pg17_2.jpg

