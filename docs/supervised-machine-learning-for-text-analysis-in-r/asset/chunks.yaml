    \ for workflows using tidy data principles where the input and output are both\
    \ a dataframe.\n\nimages/pg14_1.jpg\n\nThe tokenization achieved by using `tokenize_words()`\
    \ on `sample_vector` will yield the same results as using `unnest_tokens()` on\
    \ `sample_tibble`; the only difference is the data structure, and thus how we\
    \ might use the result moving forward.\n\nimages/pg14_3.jpg/15_1.jpg\n\nArguments\
    \ used in `tokenize_words()` can be passed through `unnest_tokens()` using the\
    \ “dots” (#fn12) pg15_2.jpg\n\n### 2.2.1 Character tokens\n\nPerhaps the simplest\
    \ tokenization is character tokenization, which splits texts into characters.\
    \ Let's use `tokenize_characters()` with its default parameters; this function\
    \ has arguments to convert to lowercase and to strip all non-alphanumeric characters.\
    \ These defaults will reduce the number of different tokens that are returned.\
    \ The `tokenize_*` functions by default return a list of character vectors, one\
    \ character vector for each string in the input.\n\nimages/pg16_1.jpg\n\nWhat\
    \ do we see if we take a look?\n\nimages/pg16_2.jpg\n\nWe don't have to stick\
