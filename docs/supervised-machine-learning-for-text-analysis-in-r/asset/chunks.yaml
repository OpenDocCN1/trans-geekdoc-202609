- raw: "This list is more appropriate for our concept of stop words, and now it is\
    \ time for us to make some choices. How many do we want to include in our stop\
    \ word list? Which words should we add and/or remove based on prior information?\
    \ Selecting the number of words to remove is best done by a case-by-case basis\
    \ as it can be difficult to determine a priori how many different “meaningless”\
    \ words appear in a corpus. Our suggestion is to start with a low number like\
    \ 20 and increase by 10 words until you get to words that are not appropriate\
    \ as stop words for your analytical purpose.\n\nIt is worth keeping in mind that\
    \ such a list is not perfect. Depending on how your text was generated or processed,\
    \ strange tokens can surface as possible stop words due to encoding or optical\
    \ character recognition errors. Further, these results are based on the corpus\
    \ of documents we have available, which is potentially biased. In our example\
    \ here, all the fairy tales were written by the same European white man from the\
    \ early 1800s.\n\nEasy examples are to include the complements to the words in\
    \ the list if they are not already present. Include “big” if “small” is present,\
    \ “old” if “young” is present. This example list has words associated with women\
    \ often listed lower in rank than words associated with men. With \"man\" being\
    \ at rank 79 but \"woman\" at rank 179, choosing a threshold of 100 would lead\
    \ to only one of these words being included. Depending on how important you think\
    \ such nouns are going to be in your texts, consider either adding \"woman\" or\
    \ deleting \"man\".[^(15)](#fn15)\n\n[Figure 3.4](#04chap_03.xhtml#f3_4) shows\
    \ how the words associated with men have a higher rank than the words associated\
    \ with women. By using a single threshold to create a stop word list, you would\
    \ likely only include one form of such words.\n\n![FIGURE 3.4: Tokens ranked according\
    \ to total occurrences, with rank 1 having the most occurrences](images/fig3_4.jpg)\n\
    \n**FIGURE 3.4:** Tokens ranked according to total occurrences, with rank 1 having\
    \ the most occurrences\n\nImagine now we would like to create a stop word list\
    \ that spans multiple different genres, in such a way that the subject-specific\
    \ stop words don't overlap. For this case, we would like words to be denoted as\
    \ a stop word only if it is a stop word in all the genres. You could find the\
    \ words individually in each genre and use the right intersections. However, that\
    \ approach might take a substantial amount of time.\n\nBelow is a bad approach\
    \ where we try to create a multi-language list of stop words. To accomplish this\
    \ we calculate the *inverse document frequency[^(16)](#fn16)*\n\n$$\\\\begin{array}{l}\
    \ {idf(\\\\text{term}) = \\\\ln\\\\left( \\\\frac{n\\_{\\\\text{documents}}}{n\\\
    _{\\\\text{documents~containing~term}}} \\\\right)} \\\\\\\\ \\\\end{array}$$\
    \  \n\nIf the word “dog” appears in 4 out of 100 documents then it would have\
    \ an idf(\"dog\") = log(100/4) = 3.22, and if the word “cat” appears in 99 out\
    \ of 100 documents then it would have an idf(\"cat\") = log(100/99) = 0.01. Notice\
    \ how the idf values goes to zero (as a matter of fact when a term appears in\
    \ all the documents then the idf of that word is 0 log(100/100) = log(1) = 0),\
    \ the more documents it is contained in. What happens if we create a stop word\
    \ list based on words with the lowest IDF? The following function takes a tokenized\
    \ dataframe and returns a dataframe with a column for each word and a column for\
    \ the IDF.\n\n![](images/pg46_1.jpg)\n\nHere is the result when we try to create\
    \ a cross-language list of stop words, by taking each fairy tale as a document.\
    \ It is not very good!\n\n![FIGURE 3.5: Words from all of H.C. Andersen's fairy\
    \ tales in Danish, English, French, German, and Spanish, counted and ordered by\
    \ IDF](images/fig3_5.jpg)\n\n**FIGURE 3.5:** Words from all of H.C. Andersen's\
    \ fairy tales in Danish, English, French, German, and Spanish, counted and ordered\
    \ by IDF\n\n![FIGURE 3.6: Words from all of H.C. Andersen's fairy tales in English,\
    \ counted and ordered by IDF](images/fig3_6.jpg)\n\n**FIGURE 3.6:** Words from\
    \ all of H.C. Andersen's fairy tales in English, counted and ordered by IDF\n\n\
    This time we get better results. The list starts with “a,” “the,” “and,” and “to”\
    \ and continues with many more reasonable choices of stop words. We need to look\
    \ at these results manually to turn this into a list. We need to go as far down\
    \ in rank as we are comfortable with. You as a data practitioner are in full control\
    \ of how you want to create the list. If you don't want to include “little” you\
    \ are still able to add “are” to your list even though it is lower on the list.\n\
    \n## 3.3 All stop word lists are context-specific\n\nContext is important in text\
    \ modeling, so it is important to ensure that the stop word lexicon you use reflects\
    \ the word space that you are planning on using it in. One common concern to consider\
    \ is how pronouns bring information to your text. Pronouns are included in many\
    \ different stop word lists (although inconsistently), but they will often *not*\
    \ be noise in text data. Similarly, [Bender et al. (2021)](#bib.xhtml#refbib_8)\
    \ discuss how a list of about 400 “Dirty, Naughty, Obscene or Otherwise Bad Words”\
    \ were used to filter and remove text before training a trillion parameter large\
    \ language model, to protect it from learning offensive language, but the authors\
    \ point out that in some community contexts, such words are reclaimed or used\
    \ to describe marginalized identities.\n\nOn the other hand, sometimes you will\
    \ have to add in words yourself, depending on the domain. If you are working with\
    \ texts for dessert recipes, certain ingredients (sugar, eggs, water) and actions\
    \ (whisking, baking, stirring) may be frequent enough to pass your stop word threshold,\
    \ but you may want to keep them as they may be informative. Throwing away “eggs”\
    \ as a common word would make it harder or downright impossible to determine if\
    \ certain recipes are vegan or not while whisking and stirring may be fine to\
    \ remove as distinguishing between recipes that do and don't require a whisk might\
    \ not be that big of a deal.\n\n## 3.4 What happens when you remove stop words\n\
    \nWe have discussed different ways of finding and removing stop words; now let's\
    \ see what happens once you do remove them. First, let's explore the impact of\
    \ the number of words that are included in the list. [Figure 3.7](#04chap_03.xhtml#f3_7)\
    \ shows what percentage of words are removed as a function of the number of words\
    \ in a text. The different colors represent the three different stop word lists\
    \ we have considered in this chapter.\n\n![FIGURE 3.7: Proportion of words removed\
    \ for different stop word lists and different document lengths](images/fig3_7.jpg)\n\
    \n**FIGURE 3.7:** Proportion of words removed for different stop word lists and\
    \ different document lengths\n\nWe notice, as we would predict, that larger stop\
    \ word lists remove more words than shorter stop word lists. In this example with\
    \ fairy tales, over half of the words have been removed, with the largest list\
    \ removing over 80% of the words. We observe that shorter texts have a lower percentage\
    \ of stop words. Since we are looking at fairy tales, this could be explained\
    \ by the fact that a story has to be told regardless of the length of the fairy\
    \ tale, so shorter texts are going to be denser with more informative words.\n\
    \nAnother problem you may face is dealing with misspellings.\n\nHandling misspellings\
    \ when using premade lists can be done by manually adding common misspellings.\
    \ You could imagine creating all words that are a certain string distance away\
    \ from the stop words, but we do not recommend this as you would quickly include\
    \ informative words this way."
