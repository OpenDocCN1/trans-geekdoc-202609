    深怀我的岳母 Lisa，她是第一个听取并完全鼓励这个最终变成这本书的想法的人。感谢 Grace、Violet 和 Lewis，他们（得益于疫情和远程学校）近距离地见证了我的大部分工作。


    # 前言


    作为一种统计实践，建模可以涵盖广泛的活动。本书侧重于文本的监督式或预测性建模，利用文本数据来对我们周围的世界进行预测。我们使用了 `tidymodels`。监督机器学习涉及建立一个统计模型来从输入中估计某些输出。我们在书中训练的两种类型模型是回归和分类。将回归模型想象为预测数值或连续输出，例如预测最高法院意见的年份。将分类模型想象为预测离散的数量或类别标签，例如预测
    GitHub issue 是否关于文档。此类模型可用于对新观测值进行预测，理解哪些特征对输出有贡献等。我们可以使用性能指标来评估我们的模型，以确定哪些模型是最好的，哪些在我们的特定背景下是可以接受的，甚至是哪些是公平的。


    我们作为说话者或写作者使用的自然语言必须转换为机器可读的数值表示才能准备好计算。在书中，我们从零开始探索典型的预处理步骤，并考虑这些步骤的影响。我们还展示了如何流畅地使用
    `textrecipes` 包（Hvitfeldt, 2020）在建模流水线中准备文本数据。Silge 和 Robinson (2017) 提供了使用 R
    进行文本挖掘的实用介绍。文本数据包含了可以用于洞察、理解和更好决策的潜在信息，如果你已经开始通过 `tidytext` 包从数据中获取洞察，本书将更进一步展示如何对文本数据进行预测建模。对于在
    Silge 和 Robinson (2017) 中未涵盖的作品，本书将提供关于对文本进行预测的建模方法的鲁棒介绍。


    # 大纲


    本书分为三个部分。我们通过将深度学习定义为任何类型的层神经网络，将机器学习定义为其他所有方法，这既是因为这些不同的方法使用不同的软件包和建模基础设施，而且从务实角度来看，这种划分有所帮助。


    - **自然语言特征**：我们如何将文本转换为适用于建模的表示？在这些章节中，我们探索了文本最常见的预处理步骤，以及它们何时有效，何时无效。

    - **机器学习方法**：我们研究了工具箱中一些简单且更轻量级模型的威力。

    - **深度学习方法**：在拥有更多时间和资源的情况下，我们看看转向神经网络可以实现什么。


    第二部分和第三部分的一些主题有所交叉，因为它们为相同的任务提供了不同的方法。在书中，我们将通过示例进行演示并使用一系列数据集构建模型。这些数据集的描述可以在附录
    B 中找到。


    # 本书未涵盖主题


    本书作为文本预测和建模的详尽介绍，并带有详细的实践示例，但自然语言处理的许多领域我们并未涵盖。CRAN 自然语言处理任务视图


    - **将文本数据读入内存**：文本数据可能以各种异构格式出现在数据从业人员手中。文本数据存在于 PDF、数据库、纯文本文件（给定项目的单个或多个）、网站、API、纸质等。访问并有时清洗文本数据集使其进入内存并准备好分析所需的技能如此多样且广泛，我们无法希望在书中涵盖。我们向读者推荐
    R 包，如 `readr` (Wickham and Hester, 2020)、`pdftools` (Ooms, 2020a) 和 `httr` (Wickham,
    2020)，我们在这些任务中发现它们非常有帮助。

    - **文本的无监督机器学习**：Silge 和 Robinson (2017) 无监督文本建模的一种方法的介绍，第 5 章深入探讨了词嵌入，它从文本数据的潜在结构中进行学习。然而，在没有结果或输出变量需要预测时，许多许多无监督机器学习算法可以用于学习文本数据的结构或分布。


    '
