    *   **文本生成：** 我们在第 8 章](#13chap_10.xhtml)、第 9 章](#14chap_11.xhtml)和第 10 章](#15chap_12.xhtml)中讨论的深度学习模型架构可以生成新文本，也可以对现有文本进行建模。Chollet
    and Allaire (2018)提供了关于如何使用神经网络架构和训练数据进行文本生成的详细信息。


    *   **语音处理：** 在语音录音中检测单词的模型通常基于书中概述的许多原理，但其训练数据是`audio`而非书面文本。R 用户可以通过大型云提供商访问预训练的语音转文本模型，例如通过`googleLanguageR`包在
    R 中访问 Google Cloud 的`Speech-to-Text API` (Edmondson, 2020)。


    *   **机器翻译：** 基于旧的统计方法或新的神经网络方法的语言间文本机器翻译是一个复杂且深入的话。今天，最成功且广为人知的机器翻译实现都是专有的，因为大型科技公司既拥有相关的专业知识，又拥有足够的语言数据来训练用于通用机器翻译的成功模型。Google
    就是其中之一，Google Cloud 的`Translation API` 同样可以通过`googleLanguageR` 包在 R 中使用。


    ## 这本书适合谁读？


    本书旨在为希望将文本集成到建模流程中的数据科学家和分析师提供实用的指导和直接适用的知识。


    我们假设读者对 R、非文本数据的预测建模概念以及`tidyverse`³ 有一定了解。


