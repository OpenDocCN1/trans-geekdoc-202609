    在我们创建的数据集中有 167,879 个不同的词（在移除停用词后），但请注意，即使在最常见的词中，我们也看到了像 "state" 和 "states" 这样的对。用于建模的常用数据结构，以及思考文本数据稀疏性的一种有用心理模型，是矩阵。让我们用
    `cast()` 将这些整洁数据转换为稀疏矩阵，从技术上讲，它是来自 `quanteda` 包(Benoit et al., 2018) 的文档-特征矩阵对象。


    ![](img/pg59_2.jpg)


    看看这个矩阵的稀疏性。它非常高！将这种稀疏性看作是我们想要用于构建监督机器学习模型的数据稀疏性。


    如果我们在这里使用词干提取（stemming）作为预处理步骤会怎样？


    ![](img/pg60_1.jpg)


    我们减少了数千个词特征，尽管稀疏性并没有发生太大变化。减少特征数量可能有什么帮助？常识告诉我们，大幅地减少数据集中词特征的数量将提高我们用它训练的任何机器学习模型的性能，*前提是我们没有通过词干提取丢失任何重要信息*。


    越来越多的学术研究表明，词干提取对文本建模可能会产生适得其反。例如，Schofield and Mimno (2016) 以及相关工作探索了围绕词干提取和其他预处理步骤的选择如何没有帮助，并且在训练文本主题模型时实际上会损害性能。具体来自
    Schofield 和 Mimno (2016) 的观点：


    主题建模是文本无监督机器学习的一个例子，它与我们将在书中重点关注的预测建模方法不同，但教训仍然是词干提取对任何特定语境可能有用也可能有害。在我们学习本章后续内容并了解更多关于词干提取的知识时，请考虑为了减少词特征数量而在对文本进行词干提取时丢失了哪些信息。词干提取在某些情况下是有用的，但典型的提取算法具有某种攻击性，其设计初衷是以牺牲特异性（或精确率，或真阴性率）为代价来提高敏感性（或召回率，或真阳性率）。


    大多数常见的词干提取算法都能成功地将单词还原为词干（即不在单词末尾留下多余的词尾），但代价是将某些意义、语义、用法等方面有巨大差异的单词合并为相同的词干。后者的例子数不胜完，但其中一些包括：


    *   meaning and mean

    *   likely, like, liking

    *   university and universe


    在监督机器学习上下文中，这会影响模型的正类预测值（精确率），或不将真阴性错误地标记为阳性的能力。在第 7 章中，我们将训练模型来预测对美国消费者金融保护局的投诉是否关于房贷款。词干提取可以增加模型寻找正例样本（即关于房贷款的投诉）的能力。然而，如果投诉文本被过度提取词干（over-stemmed），生成的模型将失去正确标记负例样本（即*不是*关于房贷款的投诉）的能力。


    ## 4.3 理解词干提取算法


    如果词干提取将成为我们的 NLP 工具箱的一部分，那么值得详细研究一种方法，以理解它在底层是如何工作的。Porter 词干提取算法非常易于理解，我们可以在不到一页的范围内过一遍它的大纲。它涉及五个步骤，以及单词“测量”（`measure`）的概念。


    将任何单词认为由交替的元音组 *V* 和辅音 *C* 组成。一个或多个元音在一起是一个 *V* 实例，一个或多个辅音在一起是一个 *C* 实例。我们可以将任何单词写为：


    $$\\begin{array}{l} {\\lbrack C\\rbrack{(VC)^{m}\\lbrack V\\rbrack} \\ \\end{array}$$


    其中 *m* 被称为单词的“测量”。括号中的第一个 *C* 和最后一个 *V* 是可选的。在这个框架下，我们可以单词 "tree" 写为：


    $$\\begin{array}{l} {CV} \\ \\end{array}$$


    其中 *C* 是 “tr”，“V” 是 “ee”；这是一个 `m = 0` 的单词。我们将单词 "algorithms" 写为：


    $$\\begin{array}{l} {VCVCVC} \\ \\end{array}$$


    这是一个 `m = 3` 的单词。


    *   Porter 提取器的第一步（也许这看起来像是在作弊）实际上由三个处理复数和过去分词结尾的子步骤组成。在第一个子步骤 `1a` 中，`sses` 被替换为
    `ss`，`ies` 被替换为 `i`，并移除最后的单个字母 `s`。第二个子步骤 `1b` 取决于单词的测量值 `m`，但处理如 `eed`、`ed`、`ing`
    等结尾，并在 `ate`、`ble` 和 `ize` 等结尾加上 `e`。第三个子步骤 `1c` 为特定 `m` 的单词将 `y` 替换为 `i`。

    *   Porter 提取的第二步规范了 20 个结尾。在这一步中，`ization` 变为 `ize`，`alism` 变为 `al`，`aliti` 变为
    `al`（注意这里的结尾 `i` 是来自第一步），其他 17 个结尾也是如此。

    *   第三步再次处理输出，使用一个七个结尾列表。在这里，`ical` 和 `iciti` 都变为 `ic`，`ful` 和 `ness` 都被移除，该步骤中的其他三个结尾也是如此。

    *   第四步涉及更长的结尾列表（19 个），它们都被移除。像 `ent`、`ism`、`ment` 等结尾在这一步被移除。

    *   第五步也是最后一步，包含两个子步骤，都取决于单词的测量值 `m`。在这一步中，根据 `m`，最后的 `e` 字母有时会被移除，最后的双写字母有时会被移除。


    该算法首次发表于 Porter (1980)，目前仍被广泛使用；阅读 Willett (2006) 可以了解它如何以及为什么成为词干提取标准的背景。Lovins
    工作领域是工程，因此她的方法特别适用于技术术语。我们可以追溯更*远*，查看 Lovins (1968) 中被认为是第一个发布的词干提取算法。该算法使用了比
    Porter 算法更大的结尾列表、条件和规则，尽管被认为过时，但实际上更快！


