    # Part I Natural Language Features


    # 1Language and modeling


    DOI: [10.1201/9781003093459-1](https://doi.org/10.1201/9781003093459-1)


    Machine learning and deep learning models for text are executed by computers,
    but they are designed and created by human beings using language generated by
    human beings. As natural language processing (NLP) practitioners, we bring our
    assumptions about what language is and how language works into the task of creating
    modeling features from natural language and using those features as inputs to
    statistical models. This is true *even when* we don''t think about how language
    works very deeply or when our understanding is unsophisticated or inaccurate;
    speaking a language is not the same as having an explicit knowledge of how that
    language works. We can improve our machine learning models for text by heightening
    that knowledge.


    Throughout the course of this book, we will discuss creating predictors or features
    from text data, fitting statistical models to those features, and how these tasks
    are related to language. Data scientists involved in the everyday work of text
    analysis and text modeling typically don''t have formal training in how language
    works, but there is an entire field focused on exactly that, *linguistics*.


    ## 1.1 Linguistics for text analysis


    [Briscoe (2013)](#bib.xhtml#refbib_18) provides helpful introductions to what
    linguistics is and how it intersects with the practical computational field of
    natural language processing. The broad field of linguistics includes subfields
    focusing on different aspects of language, which are somewhat hierarchical, as
    shown in [Table 1.1](#02chap_01.xhtml#t1_1).'
  fmt: '

    * **Text generation:** The deep learning model architectures we discuss in [Chapters
    8](#13chap_10.xhtml), [9](#14chap_11.xhtml), and [10](#15chap_12.xhtml) can be
    used to generate new text, as well as to model existing text. [Chollet and Allaire
    (2018)](#bib.xhtml#refbib_23) provide details on how to use neural network architectures
    and training data for text generation.


    * **Speech processing:** Models that detect words in audio recordings of speech
    are typically based on many of the principles outlined in this book, but the training
    data is `audio` rather than written text. R users can access pre-trained speech-to-text
    models via large cloud providers, such as Google Cloud''s `Speech-to-Text API`
    accessible in R through the `googleLanguageR` package ([Edmondson, 2020](#bib.xhtml#refbib_24)).


    * **Machine translation:** Machine translation of text between languages, based
    on either older statistical methods or newer neural network methods, is a complex,
    involved topic. Today, the most successful and well-known implementations of machine
    translation are proprietary, because large tech companies have access to both
    the right expertise and enough data in multiple languages to train successful
    models for general machine translation. Google is one such example, and Google
    Cloud''s `Translation API` is again available in R through the `googleLanguageR`
    package.


    ## Who is this book for?


    This book is designed to provide practical guidance and directly applicable knowledge
    for data scientists and analysts who want to integrate text into their modeling
    pipelines.


    We assume that the reader is somewhat familiar with R, predictive modeling concepts
    for non-text data, and the `tidyverse`[³](#fn3).


    We don''t assume an extensive background in text analysis, but `Text Mining with
    R`[⁴](#fn4).


