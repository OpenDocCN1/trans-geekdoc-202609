    \ lines into sentences while preserving the book column in the data set. To do\
    \ this we use `nest()` and `map_chr()` to create a dataframe where each fairy\
    \ tale is its own element and then we use the `unnest_sentences()` function from\
    \ the `tidytext` package to split the text into sentences.\n\n![](images/pg24_2.jpg)\n\
    \nNow that we have turned the text into “one sentence per element,” we can analyze\
    \ on the sentence level.\n\n## 2.3 Where does tokenization break down?\n\nTokenization\
    \ will generally be one of the first steps when building a model or any kind of\
    \ text analysis, so it is important to consider carefully what happens in this\
    \ step of data preprocessing. As with most software, there is a trade-off between\
    \ speed and customizability, as demonstrated in [Section 2.6](#03chap_02.xhtml#sec2_6).\
    \ The fastest tokenization methods give us less control over how it is done.\n\
    \nWhile the defaults work well in many cases, we encounter situations where we\
    \ want to impose stricter rules to get better or different tokenized results.\
    \ Consider the following sentence.\n\nThis sentence has several interesting aspects\
    \ that we need to decide whether to keep or to ignore when tokenizing. The first\
    \ issue is the contraction in \"Don\", which presents us with several possible\
    \ options. The fastest option is to keep this as one word, but it could also be\
    \ split up into \"do\" and \"n\".\n\nThe next issue at hand is how to deal with\
    \ \"$1\"; the dollar sign is an important part of this sentence as it denotes\
    \ a kind of currency. We could either remove or keep this punctuation symbol,\
    \ and if we keep the dollar sign, we can choose between keeping one or two tokens,\
    \ \"$1\" or \"$\" and \"1\". If we look at the default for `tokenize_words()`,\
    \ we notice that it defaults to removing most punctuation including `$`.\n\n![](images/pg25_1.jpg)\n\
    \nWe can keep the dollar sign if we don't strip punctuation.\n\n![](images/pg25_2.jpg)\n\
    \nWhen dealing with this sentence, we also need to decide whether to keep the\
    \ final period as a token or not. If we remove it, we will not be able to locate\
    \ the last word in a sentence using n-grams.\n[/content] (Wait, I'll just provide\
    \ the final answer). (Final output):\n\n[content]\nIt can be useful to be able\
    \ to reshape text data to get a different observational unit. As an example, if\
    \ you wanted to build a sentiment classifier that would classify sentences as\
    \ hostile or not, then you need to work with and train your model on sentences\
    \ of text. Turning pages or paragraphs into sentences is a necessary step in your\
    \ workflow.\n\nLet us look at how we can turn the `the_fir_tree` from a “one line\
    \ per element” vector to a “one sentence per element.” `the_fir_tree` comes as\
    \ a vector so we start by using `paste()` to combine the lines back together.\
    \ We use a space as the separator, and then we pass it to the `tokenize_sentences()`\
    \ function from the `tokenizers` package, which will perform sentence splitting.\n\
    \n![](images/pg23_2.jpg)!(images/pg24_1.jpg)\n\nIf you have lines from different\
    \ categories as we have in the `hcandersen_en` dataframe, which contains all the\
    \ lines of the fairy tales in English, then we would like to be able to turn these\
    \ lines into sentences while preserving the book column in the data set. To do\
    \ this we use `nest()` and `map_chr()` to create a dataframe where each fairy\
    \ tale is its own element and then we use the `unnest_sentences()` function from\
    \ the `tidytext` package to split the text into sentences.\n\n![](images/pg24_2.jpg)\n\
    \nNow that we have turned the text into “one sentence per element,” we can analyze\
    \ on the sentence level.\n\n## 2.3 Where does tokenization break down?\n\nTokenization\
    \ will generally be one of the first steps when building a model or any kind of\
    \ text analysis, so it is important to consider carefully what happens in this\
    \ step of data preprocessing. As with most software, there is a trade-off between\
    \ speed and customizability, as demonstrated in [Section 2.6](#03chap_02.xhtml#sec2_6).\
    \ The fastest tokenization methods give us less control over how it is done.\n\
    \nWhile the defaults work well in many cases, we encounter situations where we\
    \ want to impose stricter rules to get better or different tokenized results.\
    \ Consider the following sentence.\n\nThis sentence has several interesting aspects\
    \ that we need to decide whether to keep or to ignore when tokenizing. The first\
    \ issue is the contraction in \"Don\", which presents us with several possible\
    \ options. The fastest option is to keep this as one word, but it could also be\
    \ split up into \"do\" and \"n\".\n\nThe next issue at hand is how to deal with\
    \ \"$1\"; the dollar sign is an important part of this sentence as it denotes\
    \ a kind of currency. We could either remove or keep this punctuation symbol,\
    \ and if we keep the dollar sign, we can choose between keeping one or two tokens,\
