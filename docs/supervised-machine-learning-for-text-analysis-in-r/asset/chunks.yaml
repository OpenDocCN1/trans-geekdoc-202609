  trans: '

    这些领域分别研究语言呈现组织性的不同层级。当我们为文本数据构建监督机器学习模型时，我们利用这些组织层级来创建`自然语言特征`（natural language
    features），即模型的预测器或输入。这些特征通常依赖于语言的形态学特征，例如当文本被拆分为字符序列以用于循环神经网络深度学习模型时。有时这些特征也依赖于语言的句法特征，例如模型使用词性信息时。这些大致分层次的组织层级是将无结构化语言转换为可用于建模的数学表示的关键过程。


    同时，这种组织方式和语言规则可能具有歧义；我们为机器学习创建文本特征的能力受到语言本身特性的限制。宾夕法尼亚大学的语言学家贝亚特里斯·桑托里尼（Beatrice
    Santorini）汇编了新闻标题中的语言歧义示例⁶


    *   烤饼干时带上你的孩子

    *   三月计划定在明年八月进行

    *   愤怒的牛用斧头伤了农夫

    *   芝加哥的妻子们杀了大多数配偶


    如果你对语言学家研究什么以及他们对语言的了解并不熟悉，这些新闻标题看起来非常滑稽。对于语言学家来说，这些之所以滑稽，是因为它们展示了特定类型的语义歧义。


    请注意，列表中的前两个子领域是关于声音的，即语音。大多数语言学家认为语音是基础，而将语言记录成文本则是一种技术性的步骤。


    书面文本通常比我们希望的更缺乏创造力，并且离原始语言更远。这说明了从书面文本进行建模的根本性局限性。想象一下我们想要的抽象语言数据存在某个高维潜空间中；我们希望通过文本某种方式提取这些信息，但这并非完全可能的。我们创建的任何特征或构建的任何模型本质上都是受限的。


    ## 1.2 某一领域概览：形态学


    对语言运作方式的深入了解如何为文本建模提供启发？让我们关注`形态学`（morphology），即单词内部结构及其形成方式的研究来解释这一点。在英语中，单词的长度中等偏短；英语词素（有意义的最小语言单位）与单词的比例中等偏，而土耳其语和俄语等语言的词素与单词的比例更高
    (Bender, 2013)。与之相关的是，语言可以是分析性的（如普通话或现代英语，将概念拆分为独立的单词），也可以是合成性的（如匈牙语或斯瓦希里语，将概念合并为一个单词）。


    形态学重点关注前缀、后缀和词根等词素如何组合成单词。某些语言（如丹麦语）使用许多复合词。丹麦语单词如“brandbil”（消防车）、“politibil”（警车）和“lastbil”（卡车）都包含词素
    `bil`（汽车），并以表示汽车类型的前缀开头。由于这些复合词，某些名词看起来比它们对应的英语词更具描述性；“vaskebjørn”（浣熊）被拆分为词素 `vaske`
    和 `bjørn`，字面意思是“洗澡熊”⁷


    文本数据集的形态特征与预处理步骤深度相关，例如`分词`（tokenization）（第 2 章)）、删除停用词（第 3 章)），甚至是词干提取（第 4 章)）。这些创建自然语言特征的预处理步骤反过来会对模型的预测或解释产生重大影响。


    ## 1.3 不同的语言


    我们相信这本书的大多数读者可能是英语母语者，而且用于训练机器学习模型的文本中，绝大多数无疑是英语。然而，英语在全球范围内绝非主导语言，尤其是作为母语或第一语言时。作为一个对我们来说很熟悉的例子，这本书的两位作者有一位是英语母语者，另一位不是。根据全面且详细的《世界语言》（Ethnologue）项目⁸


    Bender (2011) 为计算语言学家提供了指导⁹


    ## 1.4 文本变化的其他方式


    语言会随时间变化。这是另一个影响建模的因素。考虑两个数据集，都是英语，但一个由推文组成，另一个由医学文档组成。如果 NLP 从者在推文数据集上训练模型来预测语言的某些特征，根据我们的经验，当该模型应用于医学数据集时，效果可能很差¹⁰


    ## 1.5 总结


    我们认为语言学是研究语言如何运作的，虽然我们并不认为现实世界的 NLP 必须成为语言学专家，但从这些专家那里学习可以提高模型的准确性，以及对模型为何有效（或无效）的理解。文本预测模型反映了其训练数据的特征，因此语言随时间、方言以及各种文化背景会导致在一个数据集上训练的模型不适用于另一个。大量的文本建模文献关注英语，但英语并非全球主导语言。


    ### 1.5.1 在本章中你学习了：


    *   语言学领域涵盖了从声音到语言使用的主题

    *   形态学等主题如何与文本建模相关

    *   如何识别你正在建模的语言，即使它是英语

    *   关于语言变化的多种方式以及这如何影响模型结果


    # 2 分词 (Tokenization)


    DOI: [10.1201/978103093459-2](https://doi.org/10.1201/978103093459-2)


    为了从自然语言构建监督机器学习的特征，我们需要一种将原始文本表示为数字的方法，以便对其进行计算。通常，这种从自然语言到特征（或任何形式的文本分析）转换的第一步骤之一是`分词`（tokenization）。了解分词和标记（tokens）以及相关的
    n 元（n-gram）概念，对于几乎任何自然语言处理任务都是关重要的。


    ## 2.1 什么是标记 (token)?


