    * 停用词移除对不同类型的文本的影响是不同的

    * 关于停用词列表内置的偏差以及构建此类列表的策略


    ## 4 词干提取 (Stemming)


    DOI: [10.1201/9781003093459-4](https://doi.org/10.1201/9781003093459-4)


    当我们处理文本时，文档包含包含基础词的不同版本，这通常被称为 `stem`（词干）。例如，“The Fir-Tree”包含了单词 "tree" 的多个版本（即屈折形式）。


    ![](img/pg53_1.jpg)


    我们再次看到，树在故事故事中很重要；单数形式出现了 76 次，复数形式出现了 12 次。（我们将在本章稍后部分讨论可能如何处理 "tree" 中的撇号。）


    如果我们对 "trees" 和 "tree" 之间的差异感兴趣，并且想将它们一起处理呢？这个想法是 `stemming`（词干提取）的核心，即为单词数据集识别基础词（或词干）的过程。词干提取涉及语言学中的形态学分支，即单词是如何形成的。在这个例子中，"trees"
    将失去它的字母 "s"，而 "tree" 保持不变。如果我们在提取提取后再次计算单词频率，我们会发现词干 "tree" 出现了 88 次（如果我们也找到了
    "tree" 的词干，则是 89 次）。


    ## 4.1 如何在 R 中对文本进行词干提取


    在过去的半个世纪里，已经有了许多用于单词词干提取的算法；我们将关注两种方法。第一种是 Porter (1980) 的词干提取算法，这可能是英语最广泛使用的词干提取器。Porter
    本身在 Snowball 框架¹⁸ 中实现了该算法 ![](img/pg54_1.jpg


    看看这些词干。注意，我们现在有了 88 次 "tree"。另外注意有些单词看起来并不像真实的单词那样拼写；这在这种词干提取算法中是正常且符合预期的。Porter
    算法将 "story" 和 "stories" 的词干都识别为 "stori"，这不是一个普通的英语单词，而是一个特殊的词干对象。


    Porter 词干提取仅适用于英语吗？远不止！我们可以使用 `language` 参数来实现多种语言的 Porter 词干提取。首先，我们可以对文本进行分词并
    `nest()` 为列表列。


    ![](img/pg55_1.jpg)


    然后我们可以移除停用词（对每个语言使用 `stopwords(language = "da")` 类似的命令）并使用 Porter 算法进行提取提取。这五种语言的前
    20 个词干是什么？


    images/pg55_2.jpg

    images/pg56_1.jpg


    图 4.1 展示了处理非英语语言时的一些挑战；鉴于此，我们在所有语言中都看到了关于小松树的单词，它们是提取后的形式。


    ```

    ![](img/fig4_1.jpg)

    ```


    ** 4.1:** 五种语言的 Porter 词干提取结果


    Porter 词干提取器是从一个单词开始并得到单个词干的算法，但那并不是唯一的词干提取器。另一类提取器是基于字典的词干提取器。其中一种提取器是 Hunspell¹⁹


    images/pg56_2.jpg


    images/pg58_1.jpg


    注意这里的代码稍有不同（我们不得不使用 `unnest()`），结果也略有不同。我们只有真实的单词，结果中的总行数更多。发生了什么？


    images/pg58_2.jpg


    我们有两个词干！这种提取器的工作方式不同；它同时利用单词的形态分析和现有字典来寻找可能的词干。可能会得到多个词干，词干可能与原始单词在意义上没有关系。例如，用这个库时，“number”的一个词干是“numb”。Hunspell
    库是为了作为拼写检查构建的，因此取决于你的分析目的，它可能不是合适的选择。


    ## 4.2 你应该使用词干提取吗？


    在许多标准的 NLP 工作流中，移除停用词被呈现为默认或正确的选择，且没有任何注释。我们鼓励你将词干提取视为文本建模中的一个预处理步骤，必须经过良好的判断来思考并选择（或不选择）它。


    如果你正在为文本训练机器学习模型，为什么词干提取通常会有帮助？词干提取减少了文本数据的*特征空间*。让我们通过实际操作观察一下，使用 **scotus**
    包中提供的美国最高法院判决数据集（该数据集在附录 B.2


