- raw: 'We might want to have these ligatures separated back into separate characters,
    but first, we need to consider a couple of things. First, we need to consider
    if the presence of ligatures is a meaningful feature to the question we are trying
    to answer. Second, there are two main types of ligatures: stylistic and functional.
    Stylistic ligatures are when two characters are combined because the spacing between
    the characters has been deemed unpleasant. Functional ligatures like the German
    Eszett (also called the scharfes S, meaning sharp s) ß, is an official letter
    of the German alphabet. It is described as a long S and Z and historically has
    never gotten an uppercase character. This has led the typesetters to use SZ or
    SS as a replacement when writing a word in uppercase. Additionally, ß is omitted
    entirely in German writing in Switzerland and is replaced with ss. Other examples
    include the “W” in the Latin alphabet (two “v” or two “u” joined together), and
    æ, ø, and å in the Nordic languages. Some place names for historical reasons use
    the old spelling “aa” instead of å. In [Section 6.7.1](#09chap_07.xhtml#sec6_7_1)
    we will discuss text normalization approaches to deal with ligatures.


    ### 2.2.2 Word tokens


    Tokenizing at the word level is perhaps the most common and widely used tokenization.
    We started our discussion in this chapter with this kind of tokenization, and
    as we described before, this is the procedure of splitting text into words. To
    do this, let''s use the tokenize\_words() function.


    ![](images/pg18_1.jpg)


    The results show us the input text split into individual words.


    ![](images/pg18_2.jpg)


    We have already seen lowercase = TRUE, and strip\_punct = TRUE and strip\_numeric
    = FALSE control whether we remove punctuation and numeric characters, respectively.
    We also have stopwords = NULL, which we will talk about in more depth in [Chapter
    3](#04chap_03.xhtml).


    Let''s create a tibble with two fairy tales, “The Fir-Tree” and “The Little Mermaid.”
    Then we can use unnest\_tokens() together with some **dplyr** verbs to find the
    most commonly used words in each.


    ![](images/pg18_3.jpg)![](images/pg19_1.jpg)


    The five most common words in each fairy tale are fairly uninformative, with the
    exception being "tree" in the “The Fir-Tree.”


    ### 2.2.3 Tokenizing by n-grams


    An n-gram (sometimes written “ngram”) is a term in linguistics for a contiguous
    sequence of *n* items from a given sequence of text or speech. The item can be
    phonemes, syllables, letters, or words depending on the application, but when
    most people talk about n-grams, they mean a group of *n* words. In this book,
    we will use n-gram to denote word n-grams unless otherwise stated.


    Some example n-grams are:


    *   **unigram:** “Hello,” “day,” “my,” “little”


    *   **bigram:** “fir tree,” “fresh air,” “to be,” “Robin Hood”


    *   **trigram:** “You and I,” “please let go,” “no time like,” “the little mermaid”


    The benefit of using n-grams compared to words is that n-grams capture word order
    that would otherwise be lost. Similarly, when we use character n-grams, we can
    model the beginning and end of words, because a space will be located at the end
    of an n-gram for the end of a word and at the beginning of an n-gram of the beginning
    of a word.


    To split text into word n-grams, we can use the function tokenize\_ngrams(). It
    has a few more arguments, so let''s go over them one by one.


    ![](images/pg20_1.jpg)


    We have seen the arguments lowercase, stopwords, and simplify before; they work
    the same as for the other tokenizers. We also have n, the argument to determine
    which degree of n-gram to return. Using n = 1 returns unigrams, n = 2 bigrams,
    n = 3 gives trigrams, and so on. Related to n is the n\_min argument, which specifies
    the minimum number of n-grams to include. By default both n and n\_min are set
    to 3 making tokenize\_ngrams() return only trigrams. By setting n = 3 and n\_min
    = 1, we will get all unigrams, bigrams, and trigrams of a text. Lastly, we have
    the ngram\_delim argument, which specifies the separator between words in the
    n-grams; notice that this defaults to a space.


    Let''s look at the result of n-gram tokenization for the first line of “The Fir-Tree.”


    ![](images/pg20_2.jpg)


    Notice how the words in the trigrams overlap so that the word “down” appears in
    the middle of the first trigram and beginning of the second trigram. N-gram tokenization
    slides along the text to create overlapping sets of tokens.


    It is important to choose the right value for n when using n-grams for the question
    we want to answer. Using unigrams is faster and more efficient, but we don''t
    capture information about word order. Using a higher value for n keeps more information,
    but the vector space of tokens increases dramatically, corresponding to a reduction
    in token counts. A sensible starting point in most cases is three. However, if
    you don''t have a large vocabulary in your data set, consider starting at two
    instead of three and experimenting from there. [Figure 2.2](#03chap_02.xhtml#f2_2)
    demonstrates how token frequency starts to decrease dramatically for trigrams
    and higher-order n-grams.


    ![FIGURE 2.2: Using longer n-grams results in a higher number of unique tokens
    with fewer counts. Note that the color maps to counts on a logarithmic scale.](images/fig2_2.jpg)


    **FIGURE 2.2:** Using longer n-grams results in a higher number of unique tokens
    with fewer counts. Note that the color maps to counts on a logarithmic scale.


    We are not limited to use only one degree of n-grams. We can, for example, combine
    unigrams and bigrams in an analysis or model. Getting multiple degrees of n-grams
    is a little different depending on what package you are using; using tokenize\_ngrams()
    you can specify n and n\_min.


    ![](images/pg21_1.jpg)![](images/pg22_1.jpg)


    Combining different degrees of n-grams can allow you to extract different levels
    of detail from text data. Unigrams tell you which individual words have been used
    a lot of times; some of these words could be overlooked in bigram or trigram counts
    if they don''t co-appear with other words often. Consider a scenario where every
    time the word “dog” was used it came after an adjective: “happy dog,” “sad dog,”
    “brown dog,” “white dog,” “playful dog,” etc. If this is fairly consistent and
    the adjectives varied enough, then bigrams would not be able to detect that this
    story is about dogs. Similarly “very happy” and “not happy” will be recognized
    as different from bigrams and not with unigrams alone.


    ### 2.2.4 Lines, sentence, and paragraph tokens


    Tokenizers to split text into larger units of text like lines, sentences, and
    paragraphs are rarely used directly for modeling purposes, as the tokens produced
    tend to be fairly unique. It is very uncommon for multiple sentences in a text
    to be identical! However, these tokenizers are useful for preprocessing and labeling.


    For example, Jane Austen''s novel *Northanger Abbey* (as available in the **janeaustenr**
    package) is already preprocessed with each line being at most 80 characters long.
    However, it might be useful to split the data into chapters and paragraphs instead.


    Let''s create a function that takes a dataframe containing a variable called text
    and turns it into a dataframe where the text is transformed into paragraphs. First,
    we can collapse the text into one long string using collapse = ”\\ n” to denote
    line breaks, and then next we can use tokenize\_paragraphs() to identify the paragraphs
    and put them back into a dataframe. We can add a paragraph count with row\_number().


    ![](images/pg22_2.jpg)


    Now we take the raw text data and add the chapter count by detecting when the
    characters "CHAPTER" appears at the beginning of a line. Then we nest() the text
    column, apply our add\_paragraphs() function, and then unnest() again.


    ![](images/pg23_1.jpg)


    Now we have 1020 separate paragraphs we can analyze. Similarly, we could go a
    step further to split these chapters into sentences, lines, or words.'
