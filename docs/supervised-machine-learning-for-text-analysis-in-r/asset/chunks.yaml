- raw: 'One of the downsides of creating your own stop word lists using frequencies
    is that you are limited to using words that you have already observed. It could
    happen that “she''d” is included in your training corpus but the word “he''d”
    did not reach the threshold. This is a case where you need to look at your words
    and adjust accordingly. Here the large premade stop word lists can serve as inspiration
    for missing words.


    In [Section 6.4](#09chap_07.xhtml#sec6_4), we investigate the influence of removing
    stop words in the context of modeling. Given the right list of words, we see no
    harm to the model performance, and sometimes find improvement due to noise reduction
    ([Feldman, and Sanger 2007](#bib.xhtml#refbib_28)).


    ## 3.5 Stop words in languages other than English


    So far in this chapter, we have focused on English stop words, but English is
    not representative of every language. The notion of “short” and “long” lists we
    have used so far are specific to English as a language. You should expect different
    languages to have a different number of “uninformative” words, and for this number
    to depend on the morphological richness of a language; lists that contain all
    possible morphological variants of each stop word could become quite large.


    Different languages have different numbers of words in each class of words. An
    example is how the grammatical case influences the articles used in German. The
    following tables show the use of definite and indefinite articles in German[^(17)](#fn17)


    Building lists of stop words in Chinese has been done both manually and automatically
    ([Zou, Wang, Deng, Han, and Wang 2006](#bib.xhtml#refbib_114)) but so far none
    has been accepted as a standard (Zou, Wang, Deng, and Han 2006). A full discussion
    of stop word identification in Chinese text would be out of scope for this book,
    so we will just highlight some of the challenges that differentiate it from English.


    The main difference from English is the use of logograms instead of letters to
    convey information. However, Chinese characters should not be confused with Chinese
    words. The majority of words in modern Chinese are composed of multiple characters.
    This means that inferring the presence of words is more complicated, and the notion
    of stop words will affect how this segmentation of characters is done.


    ## 3.6 Summary


    In many standard NLP workflows, the removal of stop words is presented as a default
    or the correct choice without comment. Although removing stop words can improve
    the accuracy of your machine learning using text data, choices around such a step
    are complex. The content of existing stop word lists varies tremendously, and
    the available strategies for building your own can have subtle to not-so-subtle
    effects on your model results.


    ### 3.6.1 In this chapter, you learned:


    *   what a stop word is and how to remove stop words from text data


    *   how different stop word lists can vary


    *   that the impact of stop word removal is different for different kinds of texts


    *   about the bias built in to stop word lists and strategies for building such
    lists


    # 4Stemming


    DOI: [10.1201/9781003093459-4](https://doi.org/10.1201/9781003093459-4)


    When we deal with text, often documents contain different versions of one base
    word, often called a *stem*. “The Fir-Tree,” for example, contains more than one
    version (i.e., inflected form) of the word "tree".


    ![](images/pg53_1.jpg)


    Trees, we see once again, are important in this story; the singular form appears
    76 times and the plural form appears 12 times. (We''ll come back to how we might
    handle the apostrophe in "tree" later in this chapter.)


    What if we aren''t interested in the difference between "trees" and "tree"and
    we want to treat both together? That idea is at the heart of *stemming*, the process
    of identifying the base word (or stem) for a data set of words. Stemming is concerned
    with the linguistics subfield of morphology, how words are formed. In this example,
    "trees" would lose its letter "s" while "tree" stays the same. If we counted word
    frequencies again after stemming, we would find that there are 88 occurrences
    of the stem "tree" (89, if we also find the stem for "tree").


    ## 4.1 How to stem text in R


    There have been many algorithms built for stemming words over the past half century
    or so; we''ll focus on two approaches. The first is the stemming algorithm of
    [Porter (1980)](#bib.xhtml#refbib_92), probably the most widely used stemmer for
    English. Porter himself released the algorithm implemented in the framework Snowball[^(18)](#fn18)
    ![](images/pg54_1.jpg)


    Take a look at those stems. Notice that we do now have 88 incidences of "tree".
    Also notice that some words don''t look like they are spelled as real words; this
    is normal and expected with this stemming algorithm. The Porter algorithm identifies
    the stem of both "story" and "stories" as "stori", not a regular English word
    but instead a special stem object.


    Does Porter stemming only work for English? Far from it! We can use the language
    argument to implement Porter stemming in multiple languages. First we can tokenize
    the text and nest() into list-columns.


    ![](images/pg55_1.jpg)


    Then we can remove stop words (using get\_stopwords(language = "da") and similar
    for each language) and stem with the language-specific Porter algorithm. What
    are the top-20 stems for “The Fir-Tree” in each of these five languages, after
    removing the Snowball stop words for that language?


    ![](images/pg55_2.jpg)![](images/pg56_1.jpg)


    [Figure 4.1](#05chap_04.xhtml#f4_1) demonstrates some of the challenges in working
    with languages other than English; the stop word lists may not be even from language
    to language, and tokenization strategies that work for a language like English
    may struggle for a language like French with more stop word contractions. Given
    that, we see here words about little fir trees at the top for all languages, in
    their stemmed forms.


    ![FIGURE 4.1: Porter stemming results in five languages](images/fig4_1.jpg)


    **FIGURE 4.1:** Porter stemming results in five languages


    The Porter stemmer is an algorithm that starts with a word and ends up with a
    single stem, but that''s not the only kind of stemmer out there. Another class
    of stemmer are dictionary-based stemmers. One such stemmer is the stemming algorithm
    of the Hunspell[^(19)](#fn19)


    ![](images/pg56_2.jpg)![](images/pg58_1.jpg)


    Notice that the code here is a little different (we had to use unnest()) and that
    the results are a little different. We have only real English words, and we have
    more total rows in the result. What happened?


    ![](images/pg58_2.jpg)


    We have *two* stems! This stemmer works differently; it uses both morphological
    analysis of a word and existing dictionaries to find possible stems. It''s possible
    to end up with more than one, and it''s possible for a stem to be a word that
    is not related by meaning to the original word. For example, one of the stems
    of “number” is “numb” with this library. The Hunspell library was built to be
    a spell checker, so depending on your analytical purposes, it may not be an appropriate
    choice.


    ## 4.2 Should you use stemming at all?


    You will often see stemming as part of NLP pipelines, sometimes without much comment
    about when it is helpful or not. We encourage you to think of stemming as a preprocessing
    step in text modeling, one that must be thought through and chosen (or not) with
    good judgment.


    Why does stemming often help, if you are training a machine learning model for
    text? Stemming *reduces the feature space* of text data. Let''s see this in action,
    with a data set of United States Supreme Court opinions available in the **scotus**
    package, discussed in more detail in [Section B.2](#Appendix02.xhtml#secB_2).
    How many words are there, after removing a standard data set of stopwords?


    ![](images/pg59_1.jpg)'
