- raw: 'Next up are subject-specific stop words. These words are uninformative for
    a given subject area. Subjects can be broad like finance and medicine or can be
    more specific like obituaries, health code violations, and job listings for librarians
    in Kansas. Words like “bath,” “bedroom,” and “entryway” are generally not considered
    stop words in English, but they may not provide much information for differentiating
    suburban house listings and could be subject stop words for certain analysis.
    You will likely need to manually construct such a stop word list ([Section 3.2](#04chap_03.xhtml#sec3_2)).
    These kinds of stop words may improve your performance if you have the domain
    expertise to create a good list.


    Lastly, we have document-level stop words. These words do not provide any or much
    information for a given document. These are difficult to classify and won''t be
    worth the trouble to identify. Even if you can find document stop words, it is
    not obvious how to incorporate this kind of information in a regression or classification
    task.


    ## 3.1 Using premade stop word lists


    A quick option for using stop words is to get a list that has already been created.
    This is appealing because it is not difficult, but be aware that not all lists
    are created equal. [Nothman, Qin, and Yurchak (2018)](#bib.xhtml#refbib_84) found
    some alarming results in a study of 52 stop word lists available in open-source
    software packages. Among some of the more grave issues were misspellings (“fify”
    instead of “fifty”), the inclusion of clearly informative words such as “computer”
    and “cry,” and internal inconsistencies, such as including the word “has” but
    not the word “does.” This is not to say that you should never use a stop word
    list that has been included in an open-source software project. However, you should
    always inspect and verify the list you are using, both to make sure it hasn''t
    changed since you used it last, and also to check that it is appropriate for your
    use case.


    There is a broad selection of stop word lists available today. For the purpose
    of this chapter, we will focus on three of the lists of English stop words provided
    by the **stopwords** package ([Benoit, Muhr, and Watanabe 2021s](#bib.xhtml#refbib_10)).
    The first is from the SMART (System for the Mechanical Analysis and Retrieval
    of Text) Information Retrieval System, an information retrieval system developed
    at Cornell University in the 1960s ([Lewis et al., 2004](#bib.xhtml#refbib_70)).
    The second is the English Snowball stop word list ([Porter, 2001](#bib.xhtml#refbib_93)),
    and the last is the English list from the Stopwords ISO[^(13)](#fn13)


    Before we start delving into the content inside the lists, let''s take a look
    at how many words are included in each.


    ![](images/pg39_1.jpg)


    The lengths of these lists are quite different, with the longest list being over
    seven times longer than the shortest! Let''s examine the overlap of the words
    that appear in the three lists in an UpSet plot in [Figure 3.1](#04chap_03.xhtml#f3_1).
    An UpSet plot ([Lex et al., 2014](#bib.xhtml#refbib_71)) visualizes intersections
    and aggregates of intersections of sets using a matrix layout, presenting the
    number of elements as well as summary statistics.


    ![FIGURE 3.1: Set intersections for three common stop word lists visualized as
    an UpSet plot](images/fig3_1.jpg)


    **FIGURE 3.1:** Set intersections for three common stop word lists visualized
    as an UpSet plot


    The UpSet plot in Figure 3.1 shows us that these three lists are almost true subsets
    of each other. The only exception is a set of 10 words that appear in Snowball
    and ISO but not in the SMART list. What are those words?


    ![](images/pg39_2.jpg)


    All these words are contractions. This is *not* because the SMART lexicon doesn''t
    include contractions; if we look, there are almost 50 of them.


    ![](images/pg40_1.jpg)


    We seem to have stumbled upon an inconsistency: why does SMART include "he" but
    not "she"? It is hard to say, but this could be worth rectifying before applying
    these stop word lists to an analysis or model preprocessing. This stop word list
    was likely generated by selecting the most frequent words across a large corpus
    of text that had more representation for text about men than women. This is once
    again a reminder that we should always look carefully at any pre-made word list
    or another artifact we use to make sure it works well with our needs[^(14)](#fn14)


    When you select a stop word list, it is important that you consider its size and
    breadth. Having a small and concise list of words can moderately reduce your token
    count while not having too great of an influence on your models, assuming that
    you picked appropriate words. As the size of your stop word list grows, each word
    added will have a diminishing positive effect with the increasing risk that a
    meaningful word has been placed on the list by mistake. In [Section 6.4](#09chap_07.xhtml#sec6_4),
    we show the effects of different stop word lists on model training.


    ### 3.1.1 Stop word removal in R


    Now that we have seen stop word lists, we can move forward with removing these
    words. The particular way we remove stop words depends on the shape of our data.
    If you have your text in a tidy format with one word per row, you can use filter()
    from **dplyr** with a negated %in% if you have the stop words as a vector, or
    you can use anti\_join() from **dplyr** if the stop words are in a tibble(). Like
    in our previous chapter, let''s examine the text of “The Fir-Tree” by Hans Christian
    Andersen, and use **tidytext** to tokenize the text into words.


    ![](images/pg41_1.jpg)


    Let''s use the Snowball stop word list as an example. Since the stop words return
    from this function as a vector, we will use filter().


    ![](images/pg42_1.jpg)


    If we use the get\_stopwords() function from **tidytext** instead, then we can
    use the anti\_join() function.


    ![](images/pg42_2.jpg)


    The result of these two stop word removals is the same since we used the same
    stop word list in both cases.


    ## 3.2 Creating your own stop words list


    Another way to get a stop word list is to create one yourself. Let''s explore
    a few different ways to find appropriate words to use. We will use the tokenized
    data from “The Fir-Tree” as a first example. Let''s take the words and rank them
    by their count or frequency.


    ![FIGURE 3.2: Words from ”The Fir Tree” ordered by count or frequency](images/fig3_2.jpg)


    **FIGURE 3.2:** Words from ”The Fir Tree” ordered by count or frequency


    We recognize many of what we would consider stop words in the first column here,
    with three big exceptions. We see "tree" at 3, "fir" at 12, and "little" at 22.
    These words appear high on our list, but they do provide valuable information
    as they all reference the main character. What went wrong with this approach?
    Creating a stop word list using high-frequency words works best when it is created
    on a **corpus** of documents, not an individual document. This is because the
    words found in a single document will be document-specific and the overall pattern
    of words will not generalize that well.


    The word "tree" does seem important as it is about the main character, but it
    could also be appearing so often that it stops providing any information. Let''s
    try a different approach, extracting high-frequency words from the corpus of *all*
    English fairy tales by H.C. Andersen.


    ![FIGURE 3.3: Words in all English fairy tales by Hans Christian Andersen ordered
    by count or frequency](images/fig3_3.jpg)


    **FIGURE 3.3:** Words in all English fairy tales by Hans Christian Andersen ordered
    by count or frequency'
  fmt: "\nNext up are subject-specific stop words. These words are uninformative for\
    \ a given subject area. Subjects can be broad like finance and medicine or can\
    \ be more specific like obituaries, health code violations, and job listings for\
    \ librarians in Kansas. Words like “bath,” “bedroom,” and “entryway” are generally\
    \ not considered stop words in English, but they may not provide much information\
    \ for differentiating suburban house listings and could be subject stop words\
    \ for certain analysis. You will likely need to manually construct such a stop\
    \ word list ([Section 3.2](#04chap_03.xhtml#sec3_2)). These kinds of stop words\
    \ may improve your performance if you have the domain expertise to create a good\
    \ list.\n\nLastly, we have document-level stop words. These words do not provide\
    \ any or much information for a given document. These are difficult to classify\
    \ and won't be worth the trouble to identify. Even if you can find document stop\
    \ words, it is not obvious how to incorporate this kind of information in a regression\
    \ or classification task.\n\n## 3.1 Using premade stop word lists\n\nA quick option\
    \ for using stop words is to get a list that has already been created. This is\
    \ appealing because it is not difficult, but be aware that not all lists are created\
    \ equal. [Nothman, Qin, and Yurchak (2018)](bib.xhtml#refbib_84) found some alarming\
    \ results in a study of 52 stop word lists available in open-source software packages.\
    \ Among some of the more grave issues were misspellings (“fify” instead of “fifty”),\
    \ the inclusion of clearly informative words such as “computer” and “cry,” and\
    \ internal inconsistencies, such as including the word “has” but not the word\
    \ “does.” This is not to say that you should never use a stop word list that has\
    \ been included in an open-source software project. However, you should always\
    \ inspect and verify the list you are using, both to make sure it hasn't changed\
    \ since you used it last, and also to check that it is appropriate for your use\
    \ case.\n\nThere is a broad selection of stop word lists available today. For\
    \ the purpose of this chapter, we will focus on three of the lists of English\
    \ stop words provided by the `stopwords` package ([Benoit, Muhr, and Watanabe\
    \ 2021s](#bib.xhtml#refbib_10)). The first is from the SMART (System for the Mechanical\
    \ Analysis and Retrieval of Text) Information Retrieval System, an information\
    \ retrieval system developed at Cornell University in the 1960s ([Lewis et al.,\
    \ 2004](#bib.xhtml#refbib_70)). The second is the English Snowball stop word list\
    \ ([Porter, 2001](#bib.xhtml#refbib_93)), and the last is the English list from\
    \ the Stopwords ISO[13](#fn13)\n\nBefore we start delving into the content inside\
    \ the lists, let's take a look at how many words are included in each.\n\n![](images/pg39_1.jpg)\n\
    \nThe lengths of these lists are quite different, with the longest list being\
    \ over seven times longer than the shortest! Let's examine the overlap of the\
    \ words that appear in the three lists in an UpSet plot in [Figure 3.1](#04chap_03.xhtml#f3_1).\
    \ An UpSet plot ([Lex et al., 2014](#bib.xhtml#refbib_71)) visualizes intersections\
    \ and aggregates of intersections of sets using a matrix layout, presenting the\
    \ number of elements as well as summary statistics.\n\n![FIGURE 3.1: Set intersections\
    \ for three common stop word lists visualized as an UpSet plot](images/fig3_1.jpg)\n\
    \n**FIGURE 3.1:** Set intersections for three common stop word lists visualized\
    \ as an UpSet plot\n\nThe UpSet plot in Figure 3.1 shows us that these three lists\
    \ are almost true subsets of each other. The only exception is a set of 10 words\
    \ that appear in Snowball and ISO but not in the SMART list. What are those words?\n\
    \n![](images/pg39_2.jpg)\n\nAll these words are contractions. This is *not* because\
    \ the SMART lexicon doesn't include contractions; if we look, there are almost\
    \ 50 of them.\n\n![](images/pg40_1.jpg)\n\nWe seem to have stumbled upon an inconsistency:\
    \ why does SMART include \"he\" but not \"she\"? It is hard to say, but this could\
    \ be worth rectifying before applying these stop word lists to an analysis or\
    \ model preprocessing. This stop word list may improve your performance if you\
    \ have the domain expertise to create a good list.\n\n### 3.1.1 Stop words in\
    \ R\n\nNow that we have seen stop word lists, we can move forward with removing\
    \ these. The particular way we remove words depends on the shape of your data.\
    \ If you have your text in a tidy format, we will use **tidytext** to tokenize\
    \ the.\n\n![](images/pg41_1.jpg)\n\nLet's use the Snowball stop word list as an\
    \ example. Since the stop words return from this function as a vector, we will\
    \ use `filter()`.\n\n```r\n# Example using filter()\ndata %>%\n  filter(!word\
    \ %in% stop_words)\n```\n\n![](images/pg42_1.jpg)\n\nIf we use `get_stopwords()`\
    \ function from `tidytext` instead, we can use `anti_join()` from `dplyr`.\n\n\
    ```r\nstop_words <- get_stopwords(language = \"snowball\")\ndata %>%\n  anti_join(stop_words,\
    \ by = \"word\")\n```\n\n![](images/pg42_2.jpg)\n\nThe result of these two is\
    \ the same since we used the same stop word list.\n\n## 3.2 Creating your own\
    \ stop word list\n\nAnother way to get a stop word list is to create one yourself.\
    \ Let's explore a few ways to find appropriate words. We will use the tokenized\
    \ data from “The-Tree” as a first example. Let's take the words and rank them\
    \ by their count.\n\n![FIGURE 3.2: Words from ”The Tree” ordered by count or frequency](images/fig3_2.jpg)\n\
    \n**FIGURE 3.2:** Words from ”The Tree” ordered by count or frequency\n\nWe recognize\
    \ many of what we consider stop words in the first column here, with three big\
    \ exceptions. We see \"tree\" at 3, \"fir\" at 12, and \"little\" at 22. These\
    \ words appear high on our list, but they do provide valuable information as they\
    \ all reference the main character. What went wrong with this approach? Creating\
    \ a stop word list using high-frequency words works best when it is created on\
    \ a **corpus** of documents, not an individual document. This is because the words\
    \ found in a single document will be document-specific and the overall pattern\
    \ of words will not generalize that well.\n\nThe word \"tree\" does seem important\
    \ as it is about the main character, but it could also be appearing so often that\
    \ it stops providing any information. Let's try a different approach, extracting\
    \ high-frequency words from the corpus of *all* English fairy tales by H.C. Andersen.\n\
    \n![FIGURE 3.3: Words in all English fairy tales by Hans Christian Andersen ordered\
    \ by count or frequency](images/fig3_3.jpg)\n\n**FIGURE 3.3:** Words in all English\
    \ fairy tales by Hans Christian Andersen ordered by count or frequency\n"
  trans: "\n\n接下来是特定领域的停用词。这些词对于特定的学科领域来说是不包含信息的。学科可以很宽泛，如金融和医学，也可以很具体，如讣告、健康码违规和堪萨斯州图书管理员的职位启事。在英语中，“bath”（浴室）、“bedroom”（卧室）和“entryway”（入口）等词通常不被视为停用词，但它们对于区分郊区房源可能提供不了多少信息，可能是某些分析中的领域停用词。你可能需要手动构建此类停用词列表（第\
    \ 3.2 节）。如果你拥有领域知识来创建一个良好的列表，这类停用词可能会提高你的性能。\n\n最后，我们还有文档级停用词。这些词对于特定文档没有提供任何或很多信息。它们很难分类，不值得花精力去识别。即使你找到了文档级停用词，也不清楚如何将此类信息整合到回归或分类任务中。\n\
    \n## 3.1 使用现成的停用词列表\n\n使用停用词的一种快速选择是获取一个已经创建的列表。这很有吸引力，因为并不困难，但请注意并非所有列表都是同等质量的。Nothman,\
    \ Qin, and Yurchak (2018) 在对开源软件软件包中提供的 52 个停用词列表进行研究时，发现了一些令人震惊的结果。在其中一些较为严重的问题包括拼写错误（用“fify”代替“fifty”）、包含了明显具有信息量的词汇，如“computer”（计算机）和“cry”（哭泣），以及内部不一致之处，例如包含了单词“has”但没有包含单词“does”。这并不是说你不应该永远使用包含在开源软件项目中的停用词列表。然而，你应该始终检查并验证你正在使用的列表，以确保它自你上次使用以来没有发生变化，并检查它是否适用于你的用例。\n\
    \n今天有广泛的停用词列表可供选择。在本章中，我们将关注由 `stopwords` 包提供的三个英语停用词列表（Benoit, Muhr, and Watanabe\
    \ 2021s）。第一个源自 SMART（文本机械分析与检索系统）信息检索系统，该系统是康奈尔大学 20 世纪 60 年开发的（Lewis et al.,\
    \ 2004）。第二个是英语 Snowball 停用词列表（Porter, 2001），最后一个是来自 Stopwords ISO13 的英语列表。\n\n\
    在开始深入列表内部的内容之前，让我们看看每个列表中包含多少个词。\n\n![](img/pg39_1.jpg)\n\n这些列表的长度差异很大，最长的列表比最短的还要长七倍以上！让我们通过图\
    \ 3.1 中的 UpSet 图查看三个列表中出现词汇的重叠情况。UpSet 图（Lex et al., 2014）使用矩阵布局将集合的交集和交集的聚合可视化，展示元素的数量以及汇总统计数据。\n\
    \n![图 3.1：以 UpSet 图可视化的三个常用停用词列表的集合交集](img/fig3_1.jpg)\n\n**图 3.1：**以 UpSet 图可视化的三个常用停用词列表的集合交集\n\
    \n图 3.1 中的 UpSet 图告诉我们，这三个列表几乎是彼此的真子集。唯一的例外是一个包含 10 个词的集合，它们出现在 Snowball 和 ISO\
    \ 中，但在 SMART 列表中。这些词是什么？\n\n![](img/pg39_2.jpg)\n\n这些词都是缩写。由于 SMART 不包含缩写，我们看，那里有\
    \ 50 个。\n\n![](img/pg40_1)\n\n我们似乎发现了一个不一致：为什么 SMART 包含了“he”但没有包含“she”？这很难说，但在应用这些停用词列表之前可能值得纠正。如果你拥有领域知识来创建一个良好的列表，这类停用词可能会提高你的性能。\n\
    \n### 3.1.1 R 中的停用词\n\n现在我们已经看到了停用词列表，可以继续处理这些词。在 R 中移除这些词取决于数据的形状。如果你的文本是 tidy（整洁）格式，我们将使用\
    \ **tidytext** 进行分词。\n\n![](img/pg41_1.jpg)\n\n让我们使用 Snowball 停用词列表作为示例。由于此函数返回的停用词是一个向量，我们将使用\
    \ `filter()`。\n\n```r\n# 使用 filter() 的示例\ndata %>%\n  filter(!word %in% stop_words)\n\
    ```\n\n![](img/pg42_1)\n\n如果我们改用 `tidytext` 中的 `get_stopwords()` 函数，我们可以使用 `dplyr`\
    \ 中的 `anti_join()`。\n\n```r\nstop_words <- get_stopwords(language = \"snowball\"\
    )\ndata %>%\n  anti_join(stop_words, by = \"word\")\n```\n\n![](img/pg42_2)\n\n\
    这两个方法的结果相同，因为我们使用了相同的停用词列表。\n\n## 3.2 创建自己的停用词列表\n\n获取停用词列表的另一种方法是自己创建一个。让我们探索寻找合适词的几种方法。我们将“Tree”的分词数据作为第一个示例。让我们提取这些词并按计数进行排名。\n\
    \n![图 3.2：按计数排序的“Tree”词](img/fig3_2.jpg)\n\n**图 3.2：**按计数排序的“Tree”词\n\n在这里的第一列中，我们发现了许多我们认为是停用词的词，但有三个例外。我们看到“tree”是\
    \ 3，“fir”是 12，“little”是 22。这些词在我们的列表中排名靠前，但它们提供了价值信息，因为它们都引用了主角。这种方法出了什么问题？使用高频词创建停用词列表在针对文档**语料库**（corpus）时效果最好，而不是单个文档。这是因为单个文档中的词汇是文档特定的，整体词汇模式泛化并不良好。\n\
    \n“tree”这个词似乎很重要，因为它是关于主角的，但它也可能因为出现频繁而不再提供任何信息。让我们尝试另一种方法，从 H.C. Andersen *所有*\
    \ 英语童话语料库中提取高频词。\n\n"
