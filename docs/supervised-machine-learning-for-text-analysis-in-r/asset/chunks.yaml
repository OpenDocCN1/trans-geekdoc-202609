    我们可能希望将这些合字拆分为单独的字符，但首先，我们需要考虑几点。首先，我们需要考虑合字的存在对于我们正试图回答的问题是否是一个有意义的特征。其次，合字有两种主要类型：样式合字功能合字。样式合字是指两个字符结合在一起，是因为字符之间的间距被认为不美观。功能合字，例如德语的
    Eszett（也称为 scharfes S，意为锐 s）`ß`，它是德语字母表中的一个正式字母。它被描述为长 S 和 Z，在历史上从未有过大写形式。这导致排字员在书写大写单词时使用
    `SZ` 或 `SS` 作为替代。此外，在瑞士的德语写作中，`ß` 完全被省略，并用 `ss` 替换。其他例子包括拉丁字母中的“W”（由两个“v”或两个“u”组合而成），以及北欧语言中的
    `æ`、`ø` 和 `å`。由于历史原因，一些地名使用旧拼法“aa”而不是 `å`。我们将在第 6.7.1 节中讨论处理合字的文本规范化方法。


    ## 2.2.2 词标记


