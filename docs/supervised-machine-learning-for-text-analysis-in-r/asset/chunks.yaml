    words.


    *   The reason we use the quantifier + is that there are cases where a word is
    followed by multiple characters we don''t want, such as "okay..." and "Really?!!!".


    We are using map() since str\_split() returns a list, and we want str\_remove\_all()
    to be applied to each element in the list. (The example here only has one element.)


    Now let''s see if we can get the same result using extraction. We will start by
    constructing a regular expression that will capture hyphenated words; our definition
    here is a word with one hyphen located inside it. Since we want the hyphen to
    be inside the word, we will need to have a non-zero number of characters on either
    side of the hyphen.


    ![](images/pg30_1.jpg)


    Wait, this only matched the hyphenated word! This happened because we are only
    matching words with hyphens. If we add the quantifier ? then we can match 0 or
    1 occurrences.


    ![](images/pg30_2.jpg)


    Now we are getting more words, but the ending of "isn" is not there anymore and
    we lost the word "a". We can get matches for the whole contraction by expanding
    the character class \[:alpha:\] to include the character . We do that by using
    \[\[:alpha:\]\].


    ![](images/pg30_3.jpg)


    Next, we need to find out why "a" wasn''t matched. If we look at the regular expression,
    we remember that we imposed the restriction that a non-zero number of characters
    needed to surround the hyphen to avoid matching words that start or end with a
    hyphen. This means that the smallest possible pattern matched is two characters
    long. We can fix this by using an alternation with | . We will keep our previous
    match on the left-hand side, and include \[:alpha:\]1 on the right-hand side to
    match the single length words that won''t be picked up by the left-hand side.
    Notice how we aren''t using \[\[:alpha:\]\] since we are not interested in matching
    single characters.


    ![](images/pg31_1.jpg)


    That is getting to be quite a complex regex, but we are now getting the same answer
    as before.


    ### 2.4.3 Wrapping it in a function


    We have shown how we can use regular expressions to extract the tokens we want,
    perhaps to use in modeling. So far, the code has been rather unstructured. We
    would ideally wrap these tasks into functions that can be used the same way tokenize\_words()
    is used.


    Let''s start with the example with hyphenated words. To make the function a little
    more flexible, let''s add an option to transform all the output to lowercase.


    ![](images/pg31_2.jpg)![](images/pg32_1.jpg)


    Notice how we transformed to lowercase first because the rest of the operations
    are case insensitive.


    Next let''s turn our character n-gram tokenizer into a function, with a variable
    n argument.


    ![](images/pg32_2.jpg)


    We can use paste0() in this function to construct an actual regex.


    ## 2.5 Tokenization for non-Latin alphabets


    Our discussion of tokenization so far has focused on text where words are separated
    by white space and punctuation. For such text, even a quite basic tokenizer can
    give decent results. However, many written languages don''t separate words in
    this way.


    One of these languages is Chinese where each “word” can be represented by one
    or more consecutive characters. Splitting Chinese text into words is called “word
    segmentation” and is still an active area of research ([Ma, Ganchev, and Weiss
    2018](#bib.xhtml#refbib_75); [Huang et al., 2020](#bib.xhtml#refbib_45)).


    We are not going to go into depth in this area, but we want to showcase that word
    segmentation is indeed possible with R as well. We use the **jiebaR** package
    ([Wenfeng and Yanyi, 2019](#bib.xhtml#refbib_109)). It is conceptually similar
    to the **tokenizers** package, but we need to create a worker that is passed into
    segment() along with the string we want to segment.


    ![](images/pg33_1.jpg)


    ## 2.6 Tokenization benchmark


    Not all tokenization packages are the same. Most open-source tokenizers in R are
    well-designed, but they are designed to serve different purposes. Some have a
    multitude of arguments to allow you to customize your tokenizer for greater flexibility,
    but this flexibility comes at a price; they tend to have relatively slower performance.


    While we can''t easily quantify flexibility, it is straightforward to benchmark
    some of the tokenizers available in R so you can pick the one that best suits
    your needs.


    ![](images/pg34_1.jpg)![](images/pg35_1.jpg)


    The corpus package ([Perry, 2020](#bib.xhtml#refbib_90)) offers excellent performance
    for tokenization, and other options are not much worse. One exception is using
    a base R function as a tokenizer; you will see significant performance gains by
    instead using a package built specifically for text tokenization.


    ## 2.7 Summary


    To build a predictive model, text data needs to be split into meaningful units,
    called tokens. These tokens range from individual characters to words to n-grams
    and even more complex structures, and the particular procedure used to identify
    tokens from text can be important to your results. Fast and consistent tokenizers
    are available, but understanding how they behave and in what circumstances they
    work best will set you up for success. It''s also possible to build custom tokenizers
    when necessary. Once text data is tokenized, a common next preprocessing step
    is to consider how to handle very common words that are not very informative—
    stop words. [Chapter 3](#04chap_03.xhtml) examines this in detail.


    ### 2.7.1 In this chapter, you learned:


    *   that tokens are meaningful units of text, such as words or n-grams


    *   to implement different kinds of tokenization, the process of splitting text
    into tokens


    *   how different kinds of tokenization affect the distribution of tokens


    *   how to build your own tokenizer when the fast, consistent tokenizers that
    are available are not flexible enough


    # 3Stop words


    DOI: [10.1201/9781003093459-3](https://doi.org/10.1201/9781003093459-3)


    Once we have split text into tokens, it often becomes clear that not all words
    carry the same amount of information, if any information at all, for a predictive
    modeling task. Common words that carry little (or perhaps no) meaningful information
    are called *stop words*. It is common advice and practice to remove stop words
    for various NLP tasks, but the task of stop word removal is more nuanced than
    many resources may lead you to believe. In this chapter, we will investigate what
    a stop word list is, the differences between them, and the effects of using them
    in your preprocessing workflow.


    The concept of stop words has a long history with Hans Peter Luhn credited with
    coining the term in 1960 ([Luhn, 1960](#bib.xhtml#refbib_74)). Examples of these
    words in English are “a,” “the,” “of,” and “didn''t.” These words are very common
    and typically don''t add much to the meaning of a text but instead ensure the
    structure of a sentence is sound.


    Historically, one of the main reasons for removing stop words was to decrease
    the computational time for text mining; it can be regarded as a dimensionality
    reduction of text data and was commonly-used in search engines to give better
    results ([Huston and Croft, 2010](#bib.xhtml#refbib_46)).


    Stop words can have different roles in a corpus. We generally categorize stop
    words into three groups: global, subject, and document stop words.


    Global stop words are words that are almost always low in meaning in a given language;
    these are words such as “of” and “and” in English that are needed to glue text
    together. These words are likely a safe bet for removal, but they are low in number.
    You can find some global stop words in pre-made stop word lists ([Section 3.1](#04chap_03.xhtml#sec3_1)).'
