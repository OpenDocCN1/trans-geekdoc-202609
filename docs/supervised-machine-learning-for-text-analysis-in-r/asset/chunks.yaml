  trans: '

    能够重塑文本数据以获得不同的观测单元是非常有用的。例如，如果你想构建一个情感分类器，将句子分类为具有敌意或非敌意，那么你就需要对句子文本进行处理并训练模型。将页面或段落转换为句子是你的工作流中必要的一步。


    让我们看看如何将 `the_fir_tree` 从“每个元素一行”的向量转换为“每个元素一个句子”。`the_fir_tree` 以向量形式呈现的，因此我们首先使用
    `paste()` 将行重新组合在一起。我们使用空格作为分隔符，然后将其传递给 `tokenizers` 包中的 `tokenize_sentences()`
    函数，该函数将执行句子拆分。


    ![](img/pg23_2.jpg)!(images/pg24_1.jpg)


    如果你像我们在 `hcandersen_en` 数据框中拥有来自不同类别的行（该框包含了所有英文童话的行），那么我们希望能够将这些行转换为句子，同时保留数据集中的
    `book` 列。为了实现这一点，我们使用 `nest()` 和 `map_chr()` 创建一个数据框，其中每个童话都是一个独立的元素，然后我们使用 `tidytext`
    包中的 `unnest_sentences()` 函数将文本拆分为句子。


    ![](img/pg24_2.jpg)


    现在我们已经将文本转换为“每个元素一个句子”，我们可以在句子层面进行分析了。


    ## 2.3 分词在何处失效？


    分词通常是构建模型或进行任何文本分析的早期步骤之一，因此仔细考虑数据预处理这一步发生了什么是非常重要的。与大多数软件一样，速度和定制性之间存在权衡，正如第
    2.6 节所示。快速分词方法对执行方法的控制较少。


    虽然默认设置在许多情况下运行良好，但我们也会遇到希望实施更严格规则以获得更好或不同分词结果的情况。考虑以下句子。


    这个句子有几个有趣的方面，我们在分词时需要决定是保留还是忽略。第一个问题是 "Don" 中的缩写，它为我们提供了几种可能的选择。最快的选择是将其保留为一个单词，但它也可以被拆分成
    "do" 和 "n"。


    接下来的问题是如何处理 "$1"；美元符号是这个句子的重要部分，因为它表示了一种货币。我们可以删除或保留这个标点符号，如果我们保留了美元符号，我们可以在保留一个标记或两个标记（"$1"
    或 "$" 和 "1"）之间进行选择。如果我们查看 `tokenize_words()` 的默认设置，注意到它默认删除大多数标点符号，包括 `$`。


    ![](img/pg25_1.jpg)


    如果我们不删除标点符号，就可以保留美元符号。


    ![](img/pg25_2.jpg)


    在处理这个句子时，我们还需要决定是否将最后的句号作为一个标记保留。如果我们删除了它，将无法使用 n-grams 定位句子中的最后一个单词。


    分词导致的信息丢失（尤其是默认分词）在在线和更非正式的文本中发生得更频繁。多个空格、感叹号的极端使用以及刻意的大写使用会导致……（注：原文此处有大量重复句，已按要求处理）。

    '
