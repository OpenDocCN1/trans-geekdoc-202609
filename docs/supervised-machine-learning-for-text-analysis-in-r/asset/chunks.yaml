- raw: 'It can be useful to be able to reshape text data to get a different observational
    unit. As an example, if you wanted to build a sentiment classifier that would
    classify sentences as hostile or not, then you need to work with and train your
    model on sentences of text. Turning pages or paragraphs into sentences is a necessary
    step in your workflow.


    Let us look at how we can turn the\_fir\_tree from a “one line per element” vector
    to a “one sentence per element.” the\_fir\_tree comes as a vector so we start
    by using paste() to combine the lines back together. We use a space as the separator,
    and then we pass it to the tokenize\_sentences() function from the **tokenizers**
    package, which will perform sentence splitting.


    ![](images/pg23_2.jpg)![](images/pg24_1.jpg)


    If you have lines from different categories as we have in the hcandersen\_en dataframe,
    which contains all the lines of the fairy tales in English, then we would like
    to be able to turn these lines into sentences while preserving the book column
    in the data set. To do this we use nest() and map\_chr() to create a dataframe
    where each fairy tale is its own element and then we use the unnest\_sentences()
    function from the tidytext package to split the text into sentences.


    ![](images/pg24_2.jpg)


    Now that we have turned the text into “one sentence per element,” we can analyze
    on the sentence level.


    ## 2.3 Where does tokenization break down?


    Tokenization will generally be one of the first steps when building a model or
    any kind of text analysis, so it is important to consider carefully what happens
    in this step of data preprocessing. As with most software, there is a trade-off
    between speed and customizability, as demonstrated in [Section 2.6](#03chap_02.xhtml#sec2_6).
    The fastest tokenization methods give us less control over how it is done.


    While the defaults work well in many cases, we encounter situations where we want
    to impose stricter rules to get better or different tokenized results. Consider
    the following sentence.


    This sentence has several interesting aspects that we need to decide whether to
    keep or to ignore when tokenizing. The first issue is the contraction in "Don",
    which presents us with several possible options. The fastest option is to keep
    this as one word, but it could also be split up into "do" and "n".


    The next issue at hand is how to deal with "$1"; the dollar sign is an important
    part of this sentence as it denotes a kind of currency. We could either remove
    or keep this punctuation symbol, and if we keep the dollar sign, we can choose
    between keeping one or two tokens, "$1" or "$" and "1". If we look at the default
    for tokenize\_words(), we notice that it defaults to removing most punctuation
    including $.


    ![](images/pg25_1.jpg)


    We can keep the dollar sign if we don''t strip punctuation.


    ![](images/pg25_2.jpg)


    When dealing with this sentence, we also need to decide whether to keep the final
    period as a token or not. If we remove it, we will not be able to locate the last
    word in a sentence using n-grams.


    Information lost to tokenization (especially default tokenization) occurs more
    frequently in online and more casual text. Multiple spaces, extreme use of exclamation
    characters, and deliberate use of capitalization can be completely lost depending
    on our choice of tokenizer and tokenization parameters. At the same time, it is
    not always worth keeping that kind of information about how text is being used.
    If we are studying trends in disease epidemics using Twitter data, the style the
    tweets are written in is likely not nearly as important as what words are used.
    However, if we are trying to model social groupings, language style and how individuals
    use language toward each other becomes much more important.


    Another thing to consider is the degree of compression each type of tokenization
    provides. The choice of tokenization results in a different pool of possible tokens
    and can influence performance. By choosing a method that gives fewer possible
    tokens you allow later computational tasks to be performed faster. However, that
    comes with the risk of collapsing together categories of a different meaning.
    It is also worth noting that the spread of the number of different tokens varies
    with your choice of tokenizer.


    [Figure 2.3](#03chap_02.xhtml#f2_3) illustrates these points. Each of the fairy
    tales from **hcandersenr** has been tokenized in five different ways and the number
    of distinct tokens has been plotted along the x-axis (note that the x-axis is
    logarithmic). We see that the number of distinct tokens decreases if we convert
    words to lowercase or extract word stems (see [Chapter 4](#05chap_04.xhtml) for
    more on stemming). Second, notice that the distributions of distinct tokens for
    character tokenizers are quite narrow; these texts use all or most of the letters
    in the English alphabet.


    ![FIGURE 2.3: The number of distinct tokens can vary enormously for different
    tokenizers](images/fig2_3.jpg)


    **FIGURE 2.3:** The number of distinct tokens can vary enormously for different
    tokenizers


    ## 2.4 Building your own tokenizer


    Sometimes the out-of-the-box tokenizers won''t be able to do what you need them
    to do. In this case, we will have to wield **stringi**/**stringr** and regular
    expressions (see [Appendix A](#Appendix01.xhtml)).


    There are two main approaches to tokenization.


    1.  *Split* the string up according to some rule.


    2.  *Extract* tokens based on some rule.


    The number and complexity of our rules are determined by our desired outcome.
    We can reach complex outcomes by chaining together many smaller rules. In this
    section, we will implement a couple of specialty tokenizers to showcase these
    techniques.


    ### 2.4.1 Tokenize to characters, only keeping letters


    Here we want to modify what tokenize\_characters() does, such that we only keep
    letters. There are two main options. We can use tokenize\_characters() and remove
    anything that is not a letter, or we can extract the letters one by one. Let''s
    try the latter option. This is an **extract** task, and we will use str\_extract\_all()
    as each string has the possibility of including more than one token. Since we
    want to extract letters we can use the letters character class \[:alpha:\] to
    match letters and the quantifier 1 to only extract the first one.


    ![](images/pg27_1.jpg)![](images/pg28_1.jpg)


    We may be tempted to specify the character class as something like \[a-zA-Z\]1.
    This option would run faster, but we would lose non-English letter characters.
    This is a design choice we have to make depending on the goals of our specific
    problem.


    ![](images/pg28_2.jpg)


    ### 2.4.2 Allow for hyphenated words


    In our examples so far, we have noticed that the string “fir-tree” is typically
    split into two tokens. Let''s explore two different approaches for how to handle
    this hyphenated word as one token. First, let''s split on white space; this is
    a decent way to identify words in English and some other languages, and it does
    not split hyphenated words as the hyphen character isn''t considered a white-space.
    Second, let''s find a regex to match words with a hyphen and extract those.


    Splitting by white space is not too difficult because we can use character classes,
    as shown in [Table A.2](#Appendix01.xhtml#tblappA_2). We will use the white space
    character class \[:space:\] to split our sentence.


    ![](images/pg29_1.jpg)


    This worked pretty well. This version doesn''t drop punctuation, but we can achieve
    this by removing punctuation characters at the beginning and end of words.


    ![](images/pg29_2.jpg)


    This regex used to remove the punctuation is a little complicated, so let''s discuss
    it piece by piece.


    *   The regex ^\[:punct:\]+ will look at the beginning of the string (^) to match
    any punctuation characters (\[:punct:\]), where it will select one or more (+).


    *   The other regex \[:punct:\]+$ will look for punctuation characters (\[:punct:\])
    that appear one or more times (+) at the end of the string ($).'
