    ## 2.2.3 按 n-gram 进行分词


    n-gram（有时写为“ngram”）是语言学中的术语，指从给定的文本或语音序列中连续的 `n` 个项目。根据应用，项目可以是音素、节、字母或单词，但当大多数人谈论
    n-gram 时，指的是一组 `n` 个单词。在本书中，除非另有说明，我们将使用 n-gram 表示词 n-gram。


