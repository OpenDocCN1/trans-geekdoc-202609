- raw: 'These fields each study a different level at which language exhibits organization.
    When we build supervised machine learning models for text data, we use these levels
    of organization to create *natural language features*, i.e., predictors or inputs
    for our models. These features often depend on the morphological characteristics
    of language, such as when text is broken into sequences of characters for a recurrent
    neural network deep learning model. Sometimes these features depend on the syntactic
    characteristics of language, such as when models use part-of-speech information.
    These roughly hierarchical levels of organization are key to the process of transforming
    unstructured language to a mathematical representation that can be used in modeling.


    At the same time, this organization and the rules of language can be ambiguous;
    our ability to create text features for machine learning is constrained by the
    very nature of language. Beatrice Santorini, a linguist at the University of Pennsylvania,
    compiles examples of linguistic ambiguity from news headlines[⁶](#fn6)


    *   Include Your Children When Baking Cookies


    *   March Planned For Next August


    *   Enraged Cow Injures Farmer with Ax


    *   Wives Kill Most Spouses In Chicago


    If you don''t have knowledge about what linguists study and what they know about
    language, these news headlines are just hilarious. To linguists, these are hilarious
    because they exhibit certain kinds of semantic ambiguity.


    Notice also that the first two subfields on this list are about sounds, i.e.,
    speech. Most linguists view speech as primary, and writing down language as text
    as a technological step.


    Written text is typically less creative and further from the primary language
    than we would wish. This points out how fundamentally limited modeling from written
    text is. Imagine that the abstract language data we want exists in some high-dimensional
    latent space; we would like to extract that information using the text somehow,
    but it just isn''t completely possible. Any features we create or model we build
    are inherently limited.


    ## 1.2 A glimpse into one area: morphology


    How can a deeper knowledge of how language works inform text modeling? Let''s
    focus on **morphology**, the study of words'' internal structures and how they
    are formed, to illustrate this. Words are medium to small in length in English;
    English has a moderately low ratio of morphemes (the smallest unit of language
    with meaning) to words while other languages like Turkish and Russian have a higher
    ratio of morphemes to words ([Bender, 2013](#bib.xhtml#refbib_6)). Related to
    this, languages can be either more analytic (like Mandarin or modern English,
    breaking up concepts into separate words) or synthetic (like Hungarian or Swahili,
    combining concepts into one word).


    Morphology focuses on how morphemes such as prefixes, suffixes, and root words
    come together to form words. Some languages, like Danish, use many compound words.
    Danish words such as “brandbil” (fire truck), “politibil” (police car), and “lastbil”
    (truck) all contain the morpheme “bil” (car) and start with prefixes denoting
    the type of car. Because of these compound words, some nouns seem more descriptive
    than their English counterpart; “vaskebjørn” (raccoon) splits into the morphemes
    “vaske” and “bjørn,” literally meaning “washing bear”[⁷](#fn7)


    The morphological characteristics of a text data set are deeply connected to preprocessing
    steps like tokenization ([Chapter 2](#03chap_02.xhtml)), removing stop words ([Chapter
    3](#04chap_03.xhtml)), and even stemming ([Chapter 4](#05chap_04.xhtml)). These
    preprocessing steps for creating natural language features, in turn, can have
    significant effects on model predictions or interpretation.


    ## 1.3 Different languages


    We believe that most of the readers of this book are probably native English speakers,
    and certainly most of the text used in training machine learning models is English.
    However, English is by no means a dominant language globally, especially as a
    native or first language. As an example close to home for us, of the two authors
    of this book, one is a native English speaker and one is not. According to the
    comprehensive and detailed Ethnologue project[⁸](#fn8)


    [Bender (2011)](#bib.xhtml#refbib_5) provides guidance to computational linguists
    building models for text, for any language. One specific point she makes is to
    name the language being studied.


    This idea is simple (acknowledge that the models we build are typically language-specific)
    but the #BenderRule[⁹](#fn9)


    ## 1.4 Other ways text can vary


    The concept of differences in language is relevant for modeling beyond only the
    broadest language level (for example, English vs. Danish vs. German vs. Farsi).
    Language from a specific dialect often cannot be handled well with a model trained
    on data from the same language but not inclusive of that dialect. One dialect
    used in the United States is African American Vernacular English (AAVE). Models
    trained to detect toxic or hate speech are more likely to falsely identify AAVE
    as hate speech ([Sap et al., 2019](#bib.xhtml#refbib_97)); this is deeply troubling
    not only because the model is less accurate than it should be, but because it
    amplifies harm against an already marginalized group.


    Language is also changing over time. This is a known characteristic of language;
    if you notice the evolution of your own language, don''t be depressed or angry,
    because it means that people are using it! Teenage girls are especially effective
    at language innovation and have been for centuries ([McCulloch, 2015](#bib.xhtml#refbib_77));
    innovations spread from groups such as young women to other parts of society.
    This is another difference that impacts modeling.


    Consider two bodies of text, both mostly standard written English, but one made
    up of tweets and one made up of medical documents. If an NLP practitioner trains
    a model on the data set of tweets to predict some characteristics of the text,
    it is very possible (in fact, likely, in our experience) that the model will perform
    poorly if applied to the data set of medical documents[^(10)](#fn10)


    ## 1.5 Summary


    Linguistics is the study of how language works, and while we don''t believe real-world
    NLP practitioners must be experts in linguistics, learning from such domain experts
    can improve both the accuracy of our models and our understanding of why they
    do (or don''t!) perform well. Predictive models for text reflect the characteristics
    of their training data, so differences in language over time, between dialects,
    and in various cultural contexts can prevent a model trained on one data set from
    being appropriate for application in another. A large amount of the text modeling
    literature focuses on English, but English is not a dominant language around the
    world.


    ### 1.5.1 In this chapter, you learned:


    *   that areas of linguistics focus on topics from sounds to how language is used


    *   how a topic like morphology is connected to text modeling steps


    *   to identify the language you are modeling, even if it is English


    *   about many ways language can vary and how this can impact model results


    # 2Tokenization


    DOI: [10.1201/9781003093459-2](https://doi.org/10.1201/9781003093459-2)


    To build features for supervised machine learning from natural language, we need
    some way of representing raw text as numbers so we can perform computation on
    them. Typically, one of the first steps in this transformation from natural language
    to feature, or any of kind of text analysis, is *tokenization*. Knowing what tokenization
    and tokens are, along with the related concept of an n-gram, is important for
    almost any natural language processing task.


    ## 2.1 What is a token?'
  fmt: '

    These fields each study a different level at which language exhibits organization.
    When we build supervised machine learning models for text data, we use these levels
    of organization to create `natural language features`, i.e., predictors or inputs
    for our models. These features often depend on the morphological characteristics
    of language, such as when text is broken into sequences of characters for a recurrent
    neural network deep learning model. Sometimes these features depend on the syntactic
    characteristics of language, such as when models use part-of-speech information.
    These roughly hierarchical levels of organization are key to the process of transforming
    unstructured language to a mathematical representation that can be used in modeling.


    At the same time, this organization and the rules of language can be ambiguous;
    our ability to create text features for machine learning is constrained by the
    very nature of language. Beatrice Santorini, a linguist at the University of Pennsylvania,
    compiles examples of linguistic ambiguity from news headlines[⁶](#fn6)


    *   Include Your Children When Baking Cookies

    *   March Planned For Next August

    *   Enraged Cow Injures Farmer with Ax

    *   Wives Kill Most Spouses In Chicago


    If you don''t have knowledge about what linguists study and what they know about
    language, these news headlines are just hilarious. To linguists, these are hilarious
    because they exhibit certain kinds of semantic ambiguity.


    Notice also that the first two subfields on this list are about sounds, i.e.,
    speech. Most linguists view speech as primary, and writing down language as text
    as a technological step.


    Written text is typically less creative and further from the primary language
    than we would wish. This points out how fundamentally limited modeling from written
    text is. Imagine that the abstract language data we want exists in some high-dimensional
    latent space; we would like to extract that information using the text somehow,
    but it just isn''t completely possible. Any features we create or model we build
    are inherently limited.


    ## 1.2 A glimpse into one area: morphology


    How can a deeper knowledge of how language works inform text modeling? Let''s
    focus on `morphology`, the study of words'' internal structures and how they are
    formed, to illustrate this. Words are medium to small in length in English; English
    has a moderately low ratio of morphemes (the smallest unit of language with meaning)
    to words while other languages like Turkish and Russian have a higher ratio of
    morphemes to words ([Bender, 2013](#bib.xhtml#refbib_6)). Related to this, languages
    can be either more analytic (like Mandarin or modern English, breaking up concepts
    into separate words) or synthetic (like Hungarian or Swahili, combining concepts
    into one word).


    Morphology focuses on how morphemes such as prefixes, suffixes, and root words
    come together to form words. Some languages, like Danish, use many compound words.
    Danish words such as “brandbil” (fire truck), “politibil” (police car), and “lastbil”
    (truck) all contain the morpheme `bil` (car) and start with prefixes denoting
    the type of car. Because of these compound words, some nouns seem more descriptive
    than their English counterpart; “vaskebjørn” (raccoon) splits into the morphemes
    `vaske` and `bjørn`, literally meaning “washing bear”[⁷](#fn7)


    The morphological characteristics of a text data set are deeply connected to preprocessing
    steps like `tokenization` ([Chapter 2](#03chap_02.xhtml)), removing stop words
    ([Chapter 3](#04chap_03.xhtml)), and even stemming ([Chapter 4](#05chap_04.xhtml)).
    These preprocessing steps for creating natural language features, in turn, can
    have significant effects on model predictions or interpretation.


    ## 1.3 Different languages


    We believe that most of the readers of this book are probably native English speakers,
    and certainly most of the text used in training machine learning models is English.
    However, English is by no means a dominant language globally, especially as a
    native or first language. As an example close to home for us, of the two authors
    of this book, one is a native English speaker and one is not. According to the
    comprehensive and detailed Ethnologue project[⁸](#fn8)


    [Bender (2011)](bib.xhtml#refbib_5) provides guidance to computational linguists
    to identify the language you are modeling, even if it is English[⁹](#fn9)


    ## 1.4 Other ways text can vary


    Language is changing over time. This is another difference that impacts modeling.
    Consider two bodies of text, both mostly written English, but one made up of tweets
    and one made up of medical documents. If an NLP practitioner trains a model on
    the data set of tweets to predict some characteristics of language, it is very
    possible (in fact, in our experience) that the model will perform poorly if applied
    to the data set of medical documents[¹⁰](#fn10)


    ## 1.5 Summary


    Linguistics is the study of how language works, and while we don''t believe real-world
    NLP practitioners must be experts in linguistics, learning from such domain experts
    can improve both the accuracy of our models and our understanding of why they
    do (or don''t!) perform well. Predictive models for text reflect the characteristics
    of their training data, so differences in language over time, between dialects,
    and in various cultural contexts can prevent a model trained on one data set from
    being appropriate for another. A large amount of the text modeling literature
    focuses on English, but English is not a dominant language around the.


    ### 1.5.1 In this chapter, you learned:


    *   that areas of linguistics focus on topics from sounds to how language is used

    *   how a topic like morphology is connected to text modeling

    *   to identify the language you are modeling, even if it is English

    *   about many ways language can vary and how this can impact model results


    # 2 Tokenization


    DOI: [10.1201/978103093459-2](https://doi.org/10.1201/9781003093459-2)


    To build features for supervised machine learning from natural language, we need
    some way of representing raw text as numbers so we can perform computation on
    them. Typically, one of the first steps in this transformation from natural language
    to feature, or any of kind of text analysis, is `tokenization`. Knowing what tokenization
    and tokens are, along with the related concept of an n-gram, is important for
    almost any natural language processing task.


    ## 2.1 What is a token?

