    使用频率创建自己的停用词列表的缺点之一是，你受限于使用已经观察到的单词。可能会出现“she''d”包含在你的训练语料库中，但单词“he''d”没有达到阈值的情况。在这种情况下，你需要查看你的单词并进行相应的调整。在这里，大型预制停用词列表可以为缺失的单词提供灵感。


