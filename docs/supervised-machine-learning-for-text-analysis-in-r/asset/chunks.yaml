- raw: '*   **Text generation:** The deep learning model architectures we discuss
    in [Chapters 8](#13chap_10.xhtml), [9](#14chap_11.xhtml), and [10](#15chap_12.xhtml)
    can be used to generate new text, as well as to model existing text. [Chollet
    and Allaire (2018)](#bib.xhtml#refbib_23) provide details on how to use neural
    network architectures and training data for text generation.


    *   **Speech processing:** Models that detect words in audio recordings of speech
    are typically based on many of the principles outlined in this book, but the training
    data is *audio* rather than written text. R users can access pre-trained speech-to-text
    models via large cloud providers, such as Google Cloud''s Speech-to-Text API accessible
    in R through the **googleLanguageR** package ([Edmondson, 2020](#bib.xhtml#refbib_24)).


    *   **Machine translation:** Machine translation of text between languages, based
    on either older statistical methods or newer neural network methods, is a complex,
    involved topic. Today, the most successful and well-known implementations of machine
    translation are proprietary, because large tech companies have access to both
    the right expertise and enough data in multiple languages to train successful
    models for general machine translation. Google is one such example, and Google
    Cloud''s Translation API is again available in R through the **googleLanguageR**
    package.


    ## **Who is this book for?**


    This book is designed to provide practical guidance and directly applicable knowledge
    for data scientists and analysts who want to integrate text into their modeling
    pipelines.


    We assume that the reader is somewhat familiar with R, predictive modeling concepts
    for non-text data, and the **tidyverse[³](#fn3)**


    We don''t assume an extensive background in text analysis, but *Text Mining with
    R[⁴](#fn4)*


