- raw: "There are 167,879 distinct words in this data set we have created (after removing\
    \ stopwords) but notice that even in the most common words we see a pair like\
    \ \"state\" and \"states\". A common data structure for modeling, and a helpful\
    \ mental model for thinking about the sparsity of text data, is a matrix. Let's\
    \ cast() this tidy data to a sparse matrix, technically, a document-feature matrix\
    \ object from the **quanteda ([Benoit et al., 2018](#bib.xhtml#refbib_11))** package.\n\
    \n![](images/pg59_2.jpg)\n\nLook at the sparsity of this matrix. It's high! Think\
    \ of this sparsity as the sparsity of data that we will want to use to build a\
    \ supervised machine learning model.\n\nWhat if instead we use stemming as a preprocessing\
    \ step here?\n\n![](images/pg60_1.jpg)\n\nWe reduced the number of word features\
    \ by many thousands, although the sparsity did not change much. Why is it possibly\
    \ helpful to reduce the number of features? Common sense says that reducing the\
    \ number of word features in our data set so dramatically will improve the performance\
    \ of any machine learning model we train with it, *assuming that we haven't lost\
    \ any important information by stemming*.\n\nThere is a growing body of academic\
    \ research demonstrating that stemming can be counterproductive for text modeling.\
    \ For example, [Schofield and Mimno (2016)](#bib.xhtml#refbib_98) and related\
    \ work explore how choices around stemming and other preprocessing steps don't\
    \ help and can actually hurt performance when training topic models for text.\
    \ From Schofield and Mimno (2016) specifically,\n\nTopic modeling is an example\
    \ of unsupervised machine learning for text and is not the same as the predictive\
    \ modeling approaches we'll be focusing on in this book, but the lesson remains\
    \ that stemming may or may not be beneficial for any specific context. As we work\
    \ through the rest of this chapter and learn more about stemming, consider what\
    \ information we lose when we stem text in exchange for reducing the number of\
    \ word features. Stemming can be helpful in some contexts, but typical stemming\
    \ algorithms are somewhat aggressive and have been built to favor sensitivity\
    \ (or recall, or the true positive rate) at the expense of specificity (or precision,\
    \ or the true negative rate).\n\nMost common stemming algorithms you are likely\
    \ to encounter will successfully reduce words to stems (i.e., not leave extraneous\
    \ word endings on the words) but at the expense of collapsing some words with\
    \ dramatic differences in meaning, semantics, use, etc. to the same stems. Examples\
    \ of the latter are numerous, but some include:\n\n*   meaning and mean\n\n* \
    \  likely, like, liking\n\n*   university and universe\n\nIn a supervised machine\
    \ learning context, this affects a model's positive predictive value (precision),\
    \ or ability to not incorrectly label true negatives as positive. In [Chapter\
    \ 7](#10chap_08.xhtml), we will train models to predict whether a complaint to\
    \ the United States Consumer Financial Protection Bureau was about a mortgage\
    \ or not. Stemming can increase a model's ability to find the positive examples,\
    \ i.e., the complaints about mortgages. However, if the complaint text is over-stemmed,\
    \ the resulting model loses its ability to label the negative examples, the complaints\
    \ *not* about mortgages, correctly.\n\n## 4.3 Understand a stemming algorithm\n\
    \nIf stemming is going to be in our NLP toolbox, it's worth sitting down with\
    \ one approach in detail to understand how it works under the hood. The Porter\
    \ stemming algorithm is so approachable that we can walk through its outline in\
    \ less than a page or so. It involves five steps, and the idea of a word **measure**.\n\
    \nThink of any word as made up alternating groups of vowels *V* and consonants\
    \ *C*. One or more vowels together are one instance of *V*, and one or more consonants\
    \ togther are one instance of *C*. We can write any word as\n\n$$\\\\begin{array}{l}\
    \ {\\\\lbrack C\\\\rbrack{(VC)}^{m}\\\\lbrack V\\\\rbrack} \\\\\\\\ \\\\end{array}$$\
    \  \n\nwhere *m* is called the “measure” of the word. The first *C* and the last\
    \ *V* in brackets are optional. In this framework, we could write out the word\
    \ \"tree\" as\n\n$$\\\\begin{array}{l} {CV} \\\\\\\\ \\\\end{array}$$  \n\nwith\
    \ *C* being “tr” and *V* being “ee”; it's an m = 0 word. We would write out the\
    \ word \"algorithms\" as\n\n$$\\\\begin{array}{l} {VCVCVC} \\\\\\\\ \\\\end{array}$$\
    \  \n\nand it is an m = 3 word.\n\n*   The first step of the Porter stemmer is\
    \ (perhaps this seems like cheating) actually made of three substeps working with\
    \ plural and past participle word endings. In the first substep (1a), “sses” is\
    \ replaced with “ss,” “ies” is replaced with “i,” and final single “s” letters\
    \ are removed. The second substep (1b) depends on the measure of the word m but\
    \ works with endings like “eed,” “ed,” “ing,” adding “e” back on to make endings\
    \ like “ate,” “ble,” and “ize” when appropriate. The third substep (1c) replaces\
    \ “y” with “i” for words of a certain m.\n\n*   The second step of the Porter\
    \ stemmer takes the output of the first step and regularizes a set of 20 endings.\
    \ In this step, “ization” goes to “ize,” “alism” goes to “al,” “aliti” goes to\
    \ “al” (notice that the ending “i” there came from the first step), and so on\
    \ for the other 17 endings.\n\n*   The third step again processes the output,\
    \ using a list of seven endings. Here, “ical” and “iciti” both go to “ic,” “ful”\
    \ and “ness” are both removed, and so forth for the three other endings in this\
    \ step.\n\n*   The fourth step involves a longer list of endings to deal with\
    \ again (19), and they are all removed. Endings like “ent,” “ism,” “ment,” and\
    \ more are removed in this step.\n\n*   The fifth and final step has two substeps,\
    \ both which depend on the measure m of the word. In this step, depending on m,\
    \ final “e” letters are sometimes removed and final double letters are sometimes\
    \ removed.\n\nThis algorithm was first published in Porter (1980) and is still\
    \ broadly used; read [Willett (2006)](#bib.xhtml#refbib_112) for background on\
    \ how and why it has become a stemming standard. We can reach even *further* back\
    \ and examine what is considered the first ever published stemming algorithm in\
    \ [Lovins (1968)](#bib.xhtml#refbib_72). The domain Lovins worked in was engineering,\
    \ so her approach was particularly suited to technical terms. This algorithm uses\
    \ much larger lists of word endings, conditions, and rules than the Porter algorithm\
    \ and, although considered old-fashioned, is actually faster!\n\n# 5Word Embeddings\n\
    \nDOI: [10.1201/9781003093459-5](https://doi.org/10.1201/9781003093459-5)"
