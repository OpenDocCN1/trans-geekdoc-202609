    ### 2.4.3 将其封装在函数中


    我们已经展示了如何使用正则表达式来提取我们需要的标记（tokens），可能用于建模。到目前为止，代码仍然相当缺乏结构。理想情况下，我们将这些任务封装成函数，以便可以像使用
    `tokenize_words()` 一样使用。


    让我们从带连字符单词的示例开始。为了让函数更灵活，让我们添加一个选项，将所有输出转换为小写。


    ![](img/pg31_2.jpg)![](img/pg32_1.jpg)


    注意我们是如何先转换为小写的，因为其余的操作是不区分大小写的。


    接下来，让我们把字符 n-gram 分词器转换为一个函数，并带有一个变量参数 `n`。


    ![](img/pg32_2.jpg)


    我们可以在此函数中使用 `paste0()` 来构建实际的正则。


    ## 2.5 非拉丁字母的分词


    我们到为止对分词的讨论一直集中在空格和标点符号分隔单词的文本上。对于这类文本，即使是非常基础的分词器也能得到不错的结果。然而，许多文字语言并不是这样分隔单词的。


    这些语言之一是中文，其中每个“词”可以用一个或多个连续的字符表示。将中文文本分成单词被称为“分词”（word segmentation），这仍然是一个活跃的研究领域（Ma,
    Ganchev, and Weiss 2018; Huang et al., 2020）。


    我们不会深入探讨这一领域，但我们想展示使用 R 进行分词确实是可能的。我们使用 `jiebaR` 包（Wenfeng and Yanyi, 2019）。它在概念上与
    `tokenizers` 包相似，但我们需要创建一个 worker，将其连同我们要分割的字符串一起传递给 `segment()`。


    ![](img/pg33_1.jpg)


    ## 2.6 分词基准测试


    并不是分词包都是一样的。R 中大多数开源分词器都设计良好，但它们是为了不同的目的设计的。有些具有许多参数，允许你自定义分词器以获得更大的灵活性，但这种灵活性是有代价的；它们的性能往往较慢。


    虽然我们无法量化灵活性，但对 R 中提供的某些分词器进行基准测试是简单的，这样你就可以选择最适合你需求的那个。


    ![](img/pg34_1.jpg)![](img/pg35_1.jpg)


    `corpus` 包（Perry, 2020）为分词提供了极佳性能，其他选项也没有差多少。一个例外是使用基础 R 函数作为分词器；你会发现，使用专门为文本分词构建的包将获得显著性能提升。


    ## 2.7 总结


    为了构建预测模型，文本数据需要被分成有意义的单元，称为标记（tokens）。这些标记从单个字符到单词、n-gram 甚至更复杂的结构不等，而从文本中识别标记的特定程序对你的结果可能很重要。目前有快速且一致的分词器，但理解它们的运行方式以及在什么情况下有效将有助于你的成功。一旦文本数据被分词，下一步通常是考虑如何处理非常常见的单词——停用词。必要时也可以构建自定义的分词器。第
    3 章详细讨论了这一点。


    ### 2.7.1 在本章中你学习了：


    *   标记是有意义的文本单元，例如单词或 n-gram

    *   实现不同类型的分词，即将文本分成单词的过程

    *   不同类型的分词如何影响标记的分布

    *   当分词器不够灵活时如何构建自己的分词器


    # 3 停用词


    DOI: [10.1201/9781030943](https://doi.org/10.1201/9781030943)


    一旦我们将文本分成标记，通常会发现并不是所有单词对于预测任务都带有相同的信息（如果有的话）。携带少量（或无）意义信息的单词被称为停用词（stop words）。在各种
    NLP 任务中移除停用词是常见的建议和做法，但停用词的任务比许多资源引导的要微妙。


    停用词的概念有悠久的历史，Hans Peter Luhn 被认为在 1960 年创造了这个术语（Luhn, 1960）。英语中这些单词的示例有“a”、“the”、“of”和“didn''t”。


