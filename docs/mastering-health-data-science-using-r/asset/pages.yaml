- pgno: 173
  md: '# 10

    Probability Distributions in R


    In this chapter, we cover how to generate random samples in R from known probability
    distributions and empirical distributions. Base R provides a set of four functions
    for all common probability distributions. These can be used to generate random
    samples and to calculate the corresponding density, quantile, and cumulative functions
    that correspond to that distribution.


    ```

    library(tidyverse)

    library(HDSinRdata)

    data(NHANESsample)

    ```


    In the following code, we demonstrate an example of drawing random samples. Anytime
    we perform an operation in R in which the outcome has some randomness, we are
    using R’s random number generator under the hood. This means that the results
    change every time we run our code. In order to make sure our code is replicable,
    we have to set a random seed, which makes the results the same every time. The
    set.seed() function takes in a numeric seed value. You can use any number as the
    seed. In the next code chunk, we first sample a random value from the numbers
    1 to 10 without setting a seed. Note that every time you run this code chunk,
    the output can change. However, in the following code chunk we set a seed, which
    means that the result is always the same (in this case, it’s equal to 2).


    ```

    sample(1:10, 1)

    #> [1] 1

    ```


    ```

    set.seed(5)

    sample(1:10, 1)

    #> [1] 2

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# ## 10.1 Probability Distribution Functions


    All of the common discrete (e.g., Bernoulli, binomial) and continuous (e.g., normal,
    uniform, exponential, Poisson) probability distributions have corresponding functions
    in R. For each of these distributions, there are four available functions:


    +   * r[dist](): random sample function for the given distribution (e.g., rnorm(),
    runif())

    +   * d[dist](): density function for the distribution (e.g., dnorm(), dunif())

    +   * p[dist](): cumulative distribution function for the distribution (e.g.,
    pnorm(), punif())

    +   * q[dist](): quantile function for the distribution (e.g., qnorm(), qunif())


    Let''s see how these work in practice, using the normal and binomial distributions
    as examples.


    # ### 10.1.1 Random Samples


    The following code generates a sample of 100 random numbers following a normal
    distribution with mean 5 and standard deviation 1. As you can see, the function
    takes in n (the number of observations), mean (the mean with default value 0),
    and sd (the standard deviation with default value 1). A histogram plot (using
    the built-in hist() function) shows that the generated values look roughly normally
    distributed.


    ```

    x <- rnorm(n = 100, mean = 5, sd = 1)

    hist(x)

    ```'
  merge: -1
  img_proc: true
