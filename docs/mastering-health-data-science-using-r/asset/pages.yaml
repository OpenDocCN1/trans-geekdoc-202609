    # ### 2.4.1 Indexing a Matrix


    Since matrices are two-dimensional, a single value is indexed by both its row
    number and its column number. This means that to access a subset of values in
    a matrix, we need to provide row and column indices. In the subsequent code, we
    access a single value in the first row and the fourth column. The first value
    is always the row index and the second value is always the column index.


    ```

    ```r

    rainfall[1, 4]

    #> [1] 3

    ```

    ```


    As before, we can also provide multiple indices to get multiple values. In the
    subsequent example, we choose multiple columns, but we can also choose multiple
    rows (or multiple rows and multiple columns).


    ```

    ```r

    rainfall[1, c(4, 5, 7)]

    #> [1] 3 0 0

    ```

    ```


    As with vectors, we can also use Booleans to index a matrix by providing Boolean
    values for the rows and/or columns. Note that in the following example we give
    a vector for the row indices and no values for the columns. Since we did not specify
    any column indices, this selects all of them.


    ```

    ```r

    rainfall[c(FALSE, TRUE), ]

    #> [1] 1.0 0.4 0.2 0.5 0.3 0.0 0.0

    ```

    ```'
