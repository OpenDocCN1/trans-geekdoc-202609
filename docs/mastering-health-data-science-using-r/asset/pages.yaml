    The data we use in this chapter contains information about patients who visited
    one of the University of Pittsburgh’s seven pain management clinics. This includes
    patient-reported pain assessments using the Collaborative Health Outcomes Information
    Registry (CHOIR) at baseline and at a 3-month follow-up (Alter et al. 2021). You
    can use the help operator `?pain` to learn more about the source of this data
    and to read its column descriptions. Since this data is available in our R package,
    we can use the `data()` function to load this data into our environment. Note
    that this data has 21,659 rows and 92 columns.


