  md: "The last function we demonstrate in this section is the arrange() function,\
    \ which takes in a data frame and a vector of columns used to sort the data (data\
    \ is sorted by the first column with ties sorted by the second column, etc.).\
    \ By default, the arrange() function sorts the data in increasing order, but we\
    \ can use the desc() function to instead sort in descending order. For example,\
    \ the following code filters the data to male smokers before sorting by decreasing\
    \ systolic and diastolic blood pressure in descending order. That is, the value\
    \ of DBP1 is used to sort rows that have the same systolic blood pressure values.\n\
    \n```\nnhanes_df %>%\n  select(c(YEAR, SEX, SMOKE_STATUS, SBP1, DBP1, LEAD)) %>%\n\
    \  filter(SEX == \"Male\", SMOKE_STATUS == \"Current Smoker\") %>%\n  arrange(desc(SBP1),\
    \ desc(DBP1)) %>%\n  head(8)\n#>   YEAR SEX    SMOKE_STATUS SBP1 DBP1 LEAD\n#>\
    \ 1 2011 Male Current Smoker  230  120 5.84\n#> 2 2015 Male Current Smoker  230\
    \   98 1.56\n#> 3 2009 Male Current Smoker  220   80 4.84\n#> 4 2001 Male Current\
