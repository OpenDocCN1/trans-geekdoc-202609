- pgno: 247
  md: "To implement backward selection, we first create a model with all the covariates\
    \ included. The period `.` in the formula indicates that we want to include all\
    \ variables. Next, we use the `step()` function. Since we are using backward selection,\
    \ we only need to specify the lower formula in the scope.\n\n```\n```r\nmodel_full\
    \ <- glm(e_cig_use ~ ., data = nyts_sub, family = binomial)\nmod_step <- step(model_full,\
    \ direction = 'backward',\n                 scope = list(lower = \"e_cig_use ~\
    \ sex + grade +\n                 race_and_ethnicity + location\"))\n#> Start:\
    \  AIC=6093\n#> e_cig_use ~ location + sex + grade + otherlang +\n#>     grades_in_past_year\
    \ +\n#>     perceived_e_cig_use + race_and_ethnicity + LGBT +\n#>     psych_distress\
    \ +\n#>     family_affluence\n#>\n#>                      Df Deviance  AIC\n#>\
    \ - family_affluence    2     6038 6090\n#> <none>                       6037\
    \ 6093\n#> - otherlang           1     6042 6096\n#> - LGBT                2 \
    \    6051 6103\n#> - psych_distress      3     6106 6156\n#> - grades_in_past_year\
    \ 6     6126 6170\n#> - perceived_e_cig_use 1     6416 6470\n#>\n#> Step:  AIC=6090\n\
    #> e_cig_use ~ location + sex + grade + otherlang +\n#>     grades_in_past_year\
    \ +\n#>     perceived_e_cig_use + race_and_ethnicity + LGBT + psych_distress\n\
    #>\n#>                      Df Deviance  AIC\n#> <none>                      \
    \ 6038 6090\n#> - otherlang           1     6043 6093\n#> - LGBT             \
    \   2     6052 6100\n#> - psych_distress      3     6106 6152\n#> - grades_in_past_year\
    \ 6     6128 6168\n#> - perceived_e_cig_use 1     6418 6468\n```\n```\n\nStepwise\
    \ selection keeps most variables in the model and only drops family affluence.\
    \ In the following output, we can see the AUC for this model has improved to 0.818."
  merge: -1
