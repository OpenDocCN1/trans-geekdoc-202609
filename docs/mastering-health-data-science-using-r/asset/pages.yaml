  md: "```\nmeans\n#> [1]  0.0768 -0.1682 -0.4058  0.0328 -0.1283\n```\n\nAnother\
    \ loop-hiding function is `lapply(X, FUN)`. This function applies the function\
    \ x to each element of x. In this case, x functions like an iterator, and FUN\
    \ is a function representing what we want to do in each iteration. The result\
    \ is returned as a list of the function output for each value of x. We use this\
    \ function in the regression context we saw earlier. Here, x is our vector of\
    \ groups, and we have written a custom function to be able to call that code on\
    \ each group. We learn how to write our own functions in [Chapter 18](#).\n\n\
    ```\nfind_lm_results <- function(group){\n  # Runs simple linear regression and\
    \ returns coefficient and p-value\n  dat <- nshanes$RACE == group, ]\n  mod <-\
    \ summary(lm(SBP1 ~ LEAD, data = dat))\n  return(mod$coefficients[2, c(1, 4)])\n\
    }\n\nlapply(race_values, find_lm_results)\n#> [[1]]\n#> Estimate Pr(>|t|)\n#>\
    \ 7.83e-01 3.97e-11\n#>\n#> [[2]]\n#>  Estimate  Pr(>|t|)\n#>  2.50e+00 7.81e-138\n\
