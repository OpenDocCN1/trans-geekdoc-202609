    \ the correlation, we can also test whether this correlation is significantly\
    \ different from zero. The function `cor.test()` tests for association between\
    \ paired samples, using either Pearson’s product moment correlation coefficient,\
    \ Kendall’s τ, or Spearman’s ρ. Similar to the `t.test()` and `wilcox.test()`\
    \ functions, we can also specify the `alternative` and `conf.level` arguments.\
    \ In the following code, we test whether there is a non-zero correlation between\
    \ the 2020 and 2021 county rates using Pearson’s product-moment correlation. We\
    \ can see from the resulting p-value that we can reject the null hypothesis that\
    \ the correlation is zero and conclude that it is instead significantly different\
    \ than zero. This time we also print the computed confidence interval for our\
    \ estimate.\n\n```\n```r\ncor_test_res <- cor.test(county_rates$y2020,\n     \
    \                    county_rates$y2021,\n                         method = \"\
    pearson\")\ncor_test_res\n#>\n#>  Pearson's product-moment correlation\n#>\n#>\
    \ data:  county_rates$y2020 and county_rates$y2021\n#> t = 9, df = 250, p-value\
    \ <2e-16\n#> alternative hypothesis: true correlation is not equal to 0\n#> 95\
    \ percent confidence interval:\n#>  0.401 0.587\n#> sample estimates:\n#> cor\n\
    #> 0.5\n```\n```\n\n```\n```r\ncor_test_res$conf.int\n#> [1] 0.401 0.587\n#> attr(,\"\
