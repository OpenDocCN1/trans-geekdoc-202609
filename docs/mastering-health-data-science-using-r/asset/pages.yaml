  md: '# # 9

    Case Study: Exploring Early COVID-19 Data


    In this chapter, we demonstrate a short exploratory analysis as a case study.
    This case study focuses on COVID-19 cases and deaths during 2020 using the covidcases
    and mobility datasets from the HDSinRdata package. A new package that is used
    in this case study is usmap package (Di Lorenzo 2024), which allows us to easily
    create spatial plots of the United States.


    ```

    library(HDSinRdata)

    library(tidyverse)

    library(patchwork)

    library(gt)

    library(gtsummary)

    library(usmap)

    ```


    # ## 9.1 Pre-processing


    We start by cleaning and merging our data. The covidcases data contains weekly
    confirmed COVID-19 cases and deaths at the state and county level in 2020. As
    the data description notes, some of these values may be negative due to data discrepancies
    in the cumulative counts data. The mobility data contains daily mobility statistics
    by state.


    ```

    # Read in data

    data(covidcases)

    data(mobility)

    ```


    First, we look at the columns in our data. We convert the date columns in the
    mobility data to be recognized as a date using the as.Date() function. The covidcases
    data has the week number of 2020. We create a similar column for the mobility
    data.'
