- pgno: 211
  md: '# # 13

    Linear Regression


    This chapter introduces you to linear regression analysis in R. We cover how to
    fit linear regression models, check model assumptions using diagnostic plots,
    change model formulas by adding transformations and interactions, calculate performance
    metrics, and perform variable selection using stepwise selection.


    For this chapter, we use the NHANESsample dataset seen in Chapter 4. The sample
    contains lead, blood pressure, BMI, smoking status, alcohol use, and demographic
    variables from NHANES 1999-2018. Variable selection and feature engineering were
    conducted in an effort to replicate the regression analyses conducted by Huang
    (2022). Use the help operator ?NHANESsample to read the variable descriptions.
    Note that we ignore survey weights for this analysis.


    We use the broom package (Robinson, Hayes, and Couch 2023) to present the estimated
    coefficients for our regression models and the car package to compute variance
    inflation factors.


    ```

    library(HDSinRdata)

    library(tidyverse)

    library(broom)

    library(car)


    data(NHANESsample)

    ```


    # ## 13.1 Simple Linear Regression


    In Chapter 4, we presented some initial exploratory analysis for this data. In
    this chapter, we use linear regression to understand the association between blood
    lead levels and systolic blood pressure, adjusting for possible confounders. Replicating
    the analysis of Huang (2022), we create summary columns for systolic and diastolic
    blood pressure. If an observation has one blood pressure reading, then we use
    that value. If there is more than one blood pressure reading, then we drop the
    first observation and average the rest. We'
  merge: -1
  img_proc: true
- pgno: 212
  md: "do a complete case analysis by dropping any observation with NA values. This\
    \ leaves us with 30,405 observations.\n\n```\nNHANESsample$SBP <- apply(NHANESsample[,c(\"\
    SBP1\", \"SBP2\", \"SBP3\",\n                                      \"SBP4\")],\
    \ 1,\n                         function(x) case_when(sum(!is.na(x)) == 0 ~ NA,\n\
    \                                               sum(!is.na(x)) == 1 ~ sum(x, na.rm\
    \ = TRUE),\n                                               sum(!is.na(x)) > 1\
    \ ~ mean(x[-1],\n                                                            \
    \             na.rm = TRUE)))\nNHANESsample$DBP <- apply(NHANESsample[,c(\"DBP1\"\
    , \"DBP2\", \"DBP3\",\n                                      \"DBP4\")], 1,\n\
    \                         function(x) case_when(sum(!is.na(x)) == 0 ~ NA,\n  \
    \                                             sum(!is.na(x)) == 1 ~ sum(x, na.rm\
    \ = TRUE),\n                                               sum(!is.na(x)) > 1\
    \ ~ mean(x[-1],\n                                                            \
    \             na.rm = TRUE)))\nnhanes_df <- na.omit(subset(NHANESsample,\n   \
    \                         select=-c(SBP1, SBP2, SBP3, SBP4, DBP1,\n          \
    \                            DBP2, DBP3, DBP4)))\n\ndim(nhanes_df)\n#> [1] 30405\
    \    15\n```\n\nNext, we make sure any categorical variables are coded as factors.\n\
    \n```\nnhanes_df$SEX <- as.factor(nhanes_df$SEX)\nnhanes_df$RACE <- as.factor(nhanes_df$RACE)\n\
    nhanes_df$EDUCATION <- as.factor(nhanes_df$EDUCATION)\nnhanes_df$BMI_CAT <- as.factor(nhanes_df$BMI_CAT)\n\
    nhanes_df$LEAD_QUANTILE <- as.factor(nhanes_df$LEAD_QUANTILE)\n```\n\nWe start\
    \ with simple linear regression. In the following code, we plot the relationship\
    \ between blood lead level and systolic blood pressure. For a simple linear regression\
    \ scenario with a single continuous independent variable, a scatter plot allows\
    \ us to easily visualize whether we meet the assumptions underlying linear regression.\
    \ The survey sampling for the NHANES survey allows us to assume that each observation\
    \ is independent. If we meet the assumptions of linear regression, we also expect\
    \ the plot to show that the average systolic blood pressure increases linearly\
    \ with blood lead level and that the observations look normally distributed with\
    \ equal variance along that line. We do not observe that to be the case. We come\
    \ back to this in the section on transformations and interactions.\n\n```\nplot(nhanes_df$LEAD,\
    \ nhanes_df$SBP,\n```"
