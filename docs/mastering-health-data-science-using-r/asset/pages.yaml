- pgno: 206
  md: "In Chapter 10, we explored that log blood lead levels could be approximated\
    \ by a normal distribution. To test our hypothesis that there is a difference\
    \ in mean log blood lead level between those with and without hypertension, we\
    \ use a two-sample unpaired t-test. This shows a statistically significant difference\
    \ between the two groups at the 0.05 level.\n\n```\nt.test(log(LEAD) ~ HYP, data\
    \ = NHANESSample)\n#>\n#> Welch Two Sample t-test\n#>\n#> data: log(LEAD) by HYP\n\
    #> t = -37, df = 28853, p-value <2e-16\n#> alternative hypothesis: true difference\
    \ in means between group 0\n#>   and group 1 is not equal to 0\n#> 95 percent\
    \ confidence interval:\n#> -0.314 -0.282\n#> sample estimates:\n#> mean in group\
    \ 0 mean in group 1\n#>     0.161      0.459\n```\n\nFinally, we repeat this test\
    \ for a stratified analysis and present the results in a concise table. For both\
    \ groups, we find a statistically significant difference at the 0.05 level.\n\n\
    ```\n# stratify the data\nnhanes_male <- NHANESSample[NHANESSample$SEX == \"Male\"\
    ,]\nnhanes_female <- NHANESSample[NHANESSample$SEX == \"Female\",]\n\n# t-test\
    \ for each\ntest_male <- t.test(log(LEAD) ~ HYP, data = nhanes_male)\ntest_female\
    \ <- t.test(log(LEAD) ~ HYP, data = nhanes_female)\n\n# create data frame\nres_df\
    \ <- data.frame(group = c(\"Male\", \"Female\"),\n                     statistic\
    \ = signif(c(test_male$statistic,\n                     test_female$statistic),\
    \ 3),\n                     p.value = signif(c(test_male$p.value,\n          \
    \           test_female$p.value), 3))\n\nres_df\n#>   group statistic   p.value\n\
    #> 1  Male   -14.7 1.84e-48\n#> 2 Female   -32.3 4.35e-221\n```"
  merge: -1
  img_proc: true
