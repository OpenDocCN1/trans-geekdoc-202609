    the days of the week from smallest to largest rain value.


    ```

    rain

    #> Monday Tuesday Wednesday Thursday Friday

    #> 5.0 0.1 0.0 0.0 0.5 0.0 0.0

    order(rain)

    #> [1] 3 4 6 7 2 5 1

    days[order(rain)]

    #> [1] "Wednesday" "Thursday" "Saturday" "Sunday" "Tuesday"

    #> [6] "Friday" "Monday"

    ```


    Both of these functions have an extra possible argument decreasing, which has
    a default value of FALSE. We can specify this to be TRUE to find the days of the
    week sorted from largest to smallest rainfall. Note that in the case of ties,
    the first occurrence gets the higher rank.


    ```

    days[order(rain, decreasing=TRUE)]

    #> [1] "Monday" "Friday" "Tuesday" "Wednesday" "Thursday"

    #> [6] "Saturday" "Sunday"

    ```'
