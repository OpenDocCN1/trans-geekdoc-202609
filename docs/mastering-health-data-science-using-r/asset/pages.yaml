- pgno: 216
  md: "We can also extract the estimated regression coefficients from the model using\
    \ the coef() function or by using the tidy() function from the broom package.\
    \ This function puts the coefficient estimates, standard errors, statistics, and\
    \ p-values in a data frame. We can also add a confidence interval by specifying\
    \ conf.int = TRUE. In our example, we add a 95% confidence interval (which is\
    \ the default value for conf.level).\n\n```\ncoef(adj_model)\n#>  (Intercept)\
    \      LEAD       AGE  SEXFemale\n#>  101.785     0.400     0.462    -2.778\n\
    ```\n\n```\ntidy(adj_model, conf.int = TRUE, conf.level = 0.95)\n#> # A tibble:\
    \ 4 x 7\n#>   term        estimate std.error statistic  p.value conf.low\n#> \
    \  <chr>          <dbl>     <dbl>     <dbl>    <dbl>    <dbl>\n#> 1 (Intercept)\
    \  102.      0.304      335.     0        101.\n#> 2 LEAD           0.400   0.0552\
    \       7.24 4.54e-13   0.292\n#> 3 AGE            0.462   0.00557     83.0  \
    \ 0        0.451\n#> 4 SEXFemale     -2.78    0.196      -14.2   1.36e-45  -3.16\n\
    ```\n\nSome other useful summary functions are resid(), which returns the residual\
    \ values for the model, and fitted(), which returns the fitted values or estimated\
    \ y values. We can also predict on new data using the predict() function. In the\
    \ following plot, we look at the distribution of the residual values and then\
    \ plot the fitted vs. true values. We observe some extreme residual values as\
    \ well as the fact that the absolute residual values increase with increased blood\
    \ pressure values.\n\n```\nsummary(resid(adj_model))\n#>    Min. 1st Qu.  Median\
    \    Mean 3rd Qu.    Max.\n#>  -65.6  -10.6   -1.6    0.0    8.5  131.6\n```\n\
    \n```\nplot(nhanes_df$SBP, fitted(adj_model),\n     xlab = \"True Systolic Blood\
    \ Pressure\",\n     ylab = \"Predicted Systolic Blood Pressure\", pch = 16)\n\
    abline(a = 0, b = 1, col = \"red\", lwd = 2)\n```"
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/58a554e865d49ca347d9a3f76f8f0812_217_0.png)


    We can next perform a nested hypothesis test between our simple linear regression
    model and our adjusted model using the anova() function. We pass both models to
    this function along with the argument test="F" to indicate that we are performing
    an F-test. The print() function shows the two tested models along with the associated
    p-value, which indicates a significantly better fit for the adjusted model.


    ```

    print(anova(simp_model, adj_model, test= "F"))

    #> Analysis of Variance Table

    #>

    #> Model 1: SBP ~ LEAD

    #> Model 2: SBP ~ LEAD + AGE + SEX

    #>   Res.Df    RSS Df Sum of Sq     F Pr(>F)

    #> 1  30403 10375769

    #> 2  30401 8413303  2 1962467 3546 <2e-16 ***

    #> ---

    #> Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    ```


    The model summary for the adjusted model displays the estimated coefficient for
    sex as SEXFemale, which indicates that the reference level for sex is male. If
    we want to change our reference level, we can reorder the factor variable either
    by using the factor() function and specifying Female as the first level or by
    using the relevel() function. The ref argument in the relevel() function specifies
    the new reference level. Now, when we run the model, we can see that the estimated
    coefficient for sex is labeled as SEXMale.'
