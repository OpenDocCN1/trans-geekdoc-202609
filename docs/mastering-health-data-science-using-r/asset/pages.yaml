    We now want to add in the mobility data. In the previous join, we wanted to keep
    any observation in covidcases regardless if it was in the lockdowndates data frame.
    Therefore, we used a left-join. In this case, we only want to keep observations
    that have mobility data for that state on each date. This indicates that we want
    to use an inner_join. The function inner_join() takes in two data tables (table1
    and table2) and the columns to match rows by. The function only keeps rows in
    table1 that match to a row in table2. Again, those columns in table2 not used
    to match with table1 are added to the resulting outcome. In this case, we match
    by both state and date.'
