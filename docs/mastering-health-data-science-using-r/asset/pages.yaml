  md: '# # 5 Data Transformations and Summaries


    In this chapter, we introduce the **dplyr** package (Wickham et al. 2023), which
    is part of the **tidyverse** group of packages, to expand our tools in exploring
    and transforming our data. We learn how to do some basic manipulations of data
    (e.g., adding or removing columns, filtering data, arranging by one or multiple
    columns) as well as how to summarize data (e.g., grouping by values, calculating
    summary statistics). We also practice combining these operations using the pipe
    operator `%>%` from the **tidyverse**. We use the same sample of the National
    Health and Nutrition Examination Survey (Centers for Disease Control and Prevention
    (CDC) 1999-2018) as in Chapter 4.


