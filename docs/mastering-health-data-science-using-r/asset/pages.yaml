- pgno: 359
  md: '# Table 22.1


    ```

    NHANESsample %>%

    select(AGE, SEX, EDUCATION, INCOME, LEAD) %>%

    head()

    #>   AGE   SEX EDUCATION INCOME LEAD

    #> 1  77   Male MoreThanHS  5.00 5.0

    #> 2  49   Male MoreThanHS  5.00 1.6

    #> 3  37   Male MoreThanHS  4.93 2.4

    #> 4  70   Male LessThanHS  1.07 1.6

    #> 5  81   Male LessThanHS  2.67 5.5

    #> 6  38 Female MoreThanHS  4.52 1.5

    ```


    To demonstrate the abilities of these packages, let''s suppose that we wanted
    to display the head of the first few columns of the NHANESsample data from the
    HDSinRdata package. The following code produces the corresponding output in the
    knitted pdf report. You can see in Table 22.1 that it essentially just copies
    the raw output from R, which is rather messy.


    We use the kable() and kable_styling() functions from the kableExtra package to
    produce a more nicely formatted table. The kable() function generates a table
    from a data frame. The kable() function allows you to specify some display options
    for your table. For example, you can add a caption to your table using the caption
    argument, and you can change the names of the columns in the table using the col.names
    argument. The kable_styling() has additional options available. Similar to the
    fig-pos = H command described for figures in the previous section, adding “HOLD_position”
    to the kable_styling() function prevents the table from floating on the report;
    adding “scale_down” scales the table so that it fits in the margins of the paper.
    The updated code and output are shown in the following code chunk and Table 22.2.
    See the documentation for the kable() and kable_styling() functions for more options
    available.


    ```

    NHANESsample %>%

    select(AGE, SEX, EDUCATION, INCOME, LEAD) %>%

    head() %>%

    kable(col.names = c("Age", "Sex", "Education Level",

    "Poverty Income Ratio", "Lead Level")) %>%

    kable_styling(latex_options = c("scale_down", "HOLD_position"))

    ```'
