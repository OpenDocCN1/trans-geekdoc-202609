  md: "```\n#>\n#> data: x and y\n#> t = -0.1, df = 205, p-value = 0.9\n#> alternative\
    \ hypothesis: true difference in means is not equal to 0\n#> 95 percent confidence\
    \ interval:\n#> -0.563 0.495\n#> sample estimates:\n#> mean of x mean of y\n#>\
    \ -0.503 -0.469\n```\n\nBesides a t-test, we can also use a two-sample Wilcoxon\
    \ non-parametric test using the wilcox.test() function, which has the same arguments\
    \ as the function t.test(). Both the t.test() and wilcox.test() can only compare\
    \ two groups. When we want to compare two or more independent samples, we can\
    \ use a Kruskal-Wallis rank sum test using the kruskal.test() function or a one-way\
    \ analysis of variance (ANOVA) using the aov() function.\n\nThis time we use the\
    \ column county_type, which is an indicator for whether the county is urban, suburban,\
    \ or rural according to the RUCC (rural-urban continuum codes) from the U.S. Department\
    \ of Agriculture. For the kruskal.test() function, we can either specify the arguments\
    \ formula (rate_change ~ county_type) and data (county_rates_type) or we can specify\
    \ two vectors: x, a numeric vector, and g, a factor representing the group. For\
    \ the aov() function, we specify the test using a formula and the data. To see\
    \ the p-value, we have to use the summary() function to print the result. Again,\
    \ both tests suggest that we fail to reject the null hypothesis at the 0.05 level.\n\
    \n```\nkruskal.test(county_rates_type$rate_change,\n                     county_rates_type$county_type)\n\
    #>\n#> Kruskal-Wallis rank sum test\n#>\n#> data: county_rates_type$rate_change\
    \ and\n#> county_rates_type$county_type\n#> Kruskal-Wallis chi-squared = 2, df\
    \ = 2, p-value = 0.3\n```\n\n```\naov_res <- aov(rate_change ~ county_type,\n\
    \                     data = county_rates_type)\nsummary(aov_res)\n#>\n#> Df Sum\
