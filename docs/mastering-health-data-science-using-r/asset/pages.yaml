    We mention tibbles here since some functions in the **tidyverse** convert data
    frames to tibbles in their output. In particular, when we later summarize over
    groups we can expect a tibble to be returned. It is useful to be aware that our
    data may change data structure with such functions and to know that we can always
    convert back if needed.


    # ## 5.2  Subsetting Data


    In earlier chapters, we have seen how to select and filter data using row and
    column indices as well as using the subset() function. The **dplyr** package has
    its own functions that are useful for subsetting data. The select() function allows
    us to select a subset of columns: this function takes in the data frame (or tibble)
    and the names or indices of the columns we want to select. For example, if we
    only wanted to select the variables for race and blood lead level, we could specify
    these two columns. To display the result of this selection, we use the pipe operator
    %>% from the **magrittr** package of the **tidyverse**. Similar to the pipe operator
    |> in base R, the pipe operator %>% takes the result on the left-hand side and
    passes it as the first argument to the function on the right-hand side. The following
    output shows that there are only two columns in the filtered data.


    ```

    ```r

    select(nhanes_df, c(RACE, LEAD)) %>% head()

    #>             RACE LEAD

    #> 1 Non-Hispanic White  5.0

    #> 2 Non-Hispanic White  1.6

    #> 3 Non-Hispanic White  2.4

    #> 4 Mexican American    1.6

    #> 5 Non-Hispanic White  5.5

    #> 6 Non-Hispanic White  1.5

    ```

    ```


    The select() function can also be used to *remove* columns by adding a negative
    sign in front of the vector of column names in its arguments. For example, we
    keep all columns except ID and LEAD_QUANTILE. Note that in this case we'
  merge: -1
  img_proc: true
- pgno: 98
  md: "have saved the selected data back to our data frame nhanes_df. Additionally,\
    \ this time we used a pipe operator to pipe the data to the select function itself.\n\
    \n```\nnhanes_df <- nhanes_df %>% select(-c(ID, LEAD_QUANTILE))\nnames(nhanes_df)\n\
    #> [1] \"AGE\"       \"SEX\"       \"RACE\"      \"EDUCATION\" \"INCOME\"\n#>\
    \ [6] \"SMOKE\"     \"YEAR\"      \"LEAD\"      \"BMI_CAT\"   \"HYP\"\n#> [11]\
    \ \"ALC\"       \"DBP1\"      \"DBP2\"      \"DBP3\"      \"DBP4\"\n#> [16] \"\
    SBP1\"      \"SBP2\"      \"SBP3\"      \"SBP4\"\n```\n\nWhile select() allows\
    \ us to choose a subset of columns, the filter() function allows us to choose\
    \ a subset of rows. The filter() function takes a data frame as the first argument\
    \ and a vector of Booleans as the second argument. This vector of Booleans can\
    \ be generated using conditional statements as we used in Chapter 4. We choose\
    \ to filter the data to only observations after 2008.\n\n```\nnhanes_df_recent\
    \ <- nhanes_df %>% filter(YEAR >= 2008)\n```\n\nWe can combine conditions by using\
    \ multiple filter() calls, by creating a more complicated conditional statement\
    \ using the & (and), | (or), and %in% (in) operators, or by separating the conditions\
    \ with commas within filter. In the following code, we demonstrate these three\
    \ ways to filter the data to males between 2008 and 2012. Note that the between()\
    \ function allows us to capture the logic YEAR >= 2008 & YEAR <= 2012.\n\n```\n\
    # Example 1: multiple filter calls\nnhanes_df_males1 <- nhanes_df %>%\n  filter(YEAR\
    \ <= 2012) %>%\n  filter(YEAR >= 2008) %>%\n  filter(SEX == \"Male\")\n\n# Example\
    \ 2: combine with & operator\nnhanes_df_males2 <- nhanes_df %>%\n  filter((YEAR\
    \ <= 2012) & (YEAR >= 2008) & (SEX == \"Male\"))\n\n# Example 3: combine into\
    \ one filter call with commas\nnhanes_df_males3 <- nhanes_df %>%\n  filter(between(YEAR,\
    \ 2008, 2012), SEX == \"Male\")\n```\n\nThe use of parentheses in the previous\
    \ code is especially important in order to capture our desired logic. In all these\
    \ examples, we broke our code up into multiple lines, which makes it easier to\
    \ read. A good rule of thumb is to not go past 80 characters in a line, and R\
    \ Studio conveniently has a vertical gray line"
