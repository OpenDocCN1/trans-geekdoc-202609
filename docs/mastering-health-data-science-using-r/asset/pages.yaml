  md: '# 3.3.2 Other Selection Functions


    In the previous code, we selected rows using TRUE/FALSE Boolean values. Instead,
    we could have also used the which() function. This function takes TRUE/FALSE values
    and returns the index values for all the TRUE values. We use this to treat those
    with race given as DECLINED as not specified.


    ```

    pain$PAT_RACE[which(pain$PAT_RACE == "DECLINED")] <- "NOT SPECIFIED"

    ```


    Another selection function is the subset() function. This function takes in two
    arguments. The first is the vector, matrix, or data frame to select from, and
    the second is a vector of TRUE/FALSE values to use for row selection. We use this
    to find the observation with race marked as OTHER. We then update this race to
    also be marked as not specified.


    ```

    subset(pain, pain$PAT_RACE == "OTHER")

