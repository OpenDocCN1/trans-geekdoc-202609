  md: "![](img/58a554e865d49ca347d9a3f76f8f0812_138_0.png)\n\nLet’s create another\
    \ example. This time, I create a histogram for initial recorded pain level. To\
    \ find the corresponding geom for the type of plot we’d like to make, we can use\
    \ the data visualization cheat sheet from Posit[^1]. The first page lists all\
    \ the geom options available along with what aesthetics we can set for each option.\
    \ For example, here we are interested in plotting the distribution of one continuous\
    \ variable, and under the `geom_histogram()` function we can see that we can specify\
    \ x (the variable whose distribution we want to plot) as well as binwidth, alpha,\
    \ color, fill, linetype, size, and weight. By default, the y value in a histogram\
    \ is the count for each bin.\n\nIn the following code, you can see that we updated\
    \ the color (`color`), fill (`fill`), and opacity (`alpha`) of our histogram bars\
    \ and updated the number of bins to be 11 (to account for the possible values\
    \ 0-10). Additionally, we used the `theme_minimal()` function to change the background\
    \ colors used. You can find the available themes on the second page of the cheat\
    \ sheet. Try changing the theme of the following plot to `theme_bw()`.\n\n```\n\
    ```r\nggplot(pain_df)+\n  geom_histogram(aes(x = PAIN_INTENSITY_AVERAGE), color\
    \ = \"violetred\",\n                 fill = \"lightblue\", alpha = 0.5, bins =\
    \ 11) +\n  labs(x = \"Patient Reported Pain Intensity\", y = \"Count\")+\n  theme_minimal()\n\
    ```\n```"
