  md: '# 1


    # Getting Started with R


    This chapter introduces you to R as a programming language and shows you how we
    can use this language in two different ways: directly through the R Console, and
    using the RStudio development environment. To start, you need to download R[^1]
    and RStudio[^2].


    # 1.1 Why R?


    What are some of the benefits of using R?


    +   - R is built for statisticians and data analysts.

    +   - R is open source.

    +   - R has most of the latest statistical methods available.

    +   - R is flexible.


    Since R is designed for statisticians, it is built with data in mind. This comes
    in handy when we want to streamline how we process and analyze data. It also means
    that many statisticians working on new methods are publishing user-created packages
    in R, so R users have access to most methods of interest. R is also an interpreted
    language, which means that we do not have to compile our code into machine language
    first; this allows for simpler syntax and more flexibility when writing our code,
    which also makes it a great first programming language to learn.


    Python is another interpreted language often used for data analysis. Both languages
    feature simple and flexible syntax, but while Python is more broadly developed
    for usage outside of data science and statistical analyses, R is a great programming
    language for those in health data science. I use both languages and find switching
    between them to be straightforward, but I do prefer R for anything related to
    data or statistical analysis.


    [^1]: https://cran.rstudio.com/

    [^2]: https://posit.co/download/rstudio-desktop/'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.1.1 Installation of R and RStudio


    To run R on your computer, you need to download and install R³. This allows you
    to open the R application and run R code interactively. However, to get the most
    out of programming with R, you should install RStudio, which is an integrated
    development environment (IDE) for R. RStudio offers a nice environment for writing,
    editing, running, and debugging R code.


    Each chapter in this book is written as a Quarto document and can also be downloaded
    as a Jupyter notebook. You can open Quarto files in RStudio to run the code as
    you read and complete the practice questions and exercises.


    # 1.2 The R Console


    The R Console provides our first intro to code in R. Figure 1.1 shows the console''s
    appearance when opened. You should see a blinking cursor; this is where we can
    write our first line of code!


    ![](img/58a554e865d49ca347d9a3f76f8f0812_18_0.png)


    Figure 1.1: The R Console.'
  merge: -1
  img_proc: true
