    \ be -6.4736.\n\n```\n# Insert your solution here:\n```\n\nOne thing to consider\
    \ is that the t.test() function assumes that the sample x comes from a normal\
    \ distribution. The one-sample Wilcoxon signed rank test is a non-parametric alternative\
    \ to the one-sample t-test that can be used to compare the median value of a sample\
    \ to a theoretical value without assuming that the data are normally distributed.\
    \ This test can be performed using the wilcox.test() function and takes in the\
    \ same arguments as the t.test() function. In the following output, we can see\
    \ that we again reject the null hypothesis at the 0.05 level and conclude that\
    \ the median abortion rate in 2021 was significantly lower than 5.14, which was\
    \ the median rate in 2020.\n\n```\nwilcox_res <- wilcox.test(county_rates_2021,\
    \ alternative = \"less\",\n                              mu = 5.14, conf.level\
    \ = 0.95)\nwilcox_res\n#>\n#> Wilcoxon signed rank test with continuity correction\n\
    #>\n#> data:  county_rates_2021\n#> V = 12807, p-value = 0.002\n#> alternative\
    \ hypothesis: true location is less than 5.14\nwilcox_res$p.value\n#> [1] 0.00193\n\
    ```\n\n# 11.2 Correlation and Covariance\n\nWe now look at two-sample tests. To\
    \ start, we look at the 2020 and 2021 rates by county. We pivot our data into\
