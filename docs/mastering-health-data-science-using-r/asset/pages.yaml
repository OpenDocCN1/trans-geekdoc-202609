  md: 'Looking back at the missing values, there are two useful functions for selecting
    the complete cases in a data frame. The `na.omit()` function returns the data
    frame with incomplete cases removed, whereas `complete.cases()` returns TRUE/FALSE
    values for each row indicating whether each row is complete, which we can then
    use to select the rows with TRUE values. In the following code, we see that both
    approaches select the same number of rows.


    ```

    pain_sub1 <- na.omit(pain)

    pain_sub2 <- pain[complete.cases(pain), ]

    dim(pain_sub1)

    #> [1] 2413 96

    dim(pain_sub2)

    #> [1] 2413 96

    ```


    # 3.2.6 Dates in R


    The columns in the `pain` data contain character and numeric values. One special
    type of character column that is not present is a column that corresponds to a
    date or date-time. By default, `read.csv()` reads these columns in as character
    columns, whereas the `read_csv()` function from the **readr** package in the **tidyverse**
    family recognizes common date formats. If we have a character column, we can convert
    to a date object using `as.Date()` for date columns and `as.POSIXct()` for date-time
    columns. For columns with only a time but no date, you can add a date or use the
    **hms** package (Müller 2023), which is not demonstrated here. These functions
    automatically try to detect the format of the inputted string, but it is often
    helpful to provide the `format` and time zone `tz`. To input our format we use
    the following key.


    | Symbol | Description |

    | :--- | :--- |

    | %Y | Four-digit year. |

    | %y | Two-digit year. |

    | %m | Numeric month. |

    | %b% | Abbreviated name of month. |

    | %B | Full name of month. |

    | %d | Numeric day of the month. |

    | %H | Military time hour (24 hours). |

    | %I | Imperial time hour (12 hours). |

    | %M | Minute. |

    | %S | Seconds. |

    | %p | AM/PM |'
  merge: -1
