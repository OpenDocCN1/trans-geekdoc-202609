  md: "# 20.2 Avoid Copies and Duplicates\n\na matrix m. We then create a matrix n\
    \ that is equal to m. Last, we update n by taking the logarithm of all elements\
    \ plus one, differentiating it from m. R creates copies upon modification. This\
    \ means that when we initialize n we have not actually created a second matrix\
    \ in memory. Instead, we have two names for the same matrix. On the third line,\
    \ we want to update n, so we need to actually create a second matrix that is different\
    \ from m.\n\n```\n```r\nm <- matrix(rpois(100000, 6), ncol=1000)\nn <- m\nn <-\
    \ log(n + 1)\n```\n```\n\nThis is different from the subsequent code which updates\
    \ m itself. In this case, R can modify the matrix in place by going through each\
    \ element and updating its value rather than creating a new matrix. As the size\
    \ of our data grows, creating copies can be expensive. Imagine, m being a large\
    \ genetic dataset with RNA-sequencing data. First, this object may take up a lot\
    \ of memory, so creating a copy may mean we could run out of memory. Second, copying\
    \ over all this information is expensive.\n\n```\n```r\nm <- log(m + 1)\n```\n\
    ```\n\nLet’s consider another case. In the following code, we have two functions\
    \ that both find the proportion of people within 1, 2, and $>$2 standard deviations\
    \ from the mean for one of the PROMIS instrument variables. When we input pain\
    \ as an argument to the first function, we do not create a copy of it since we\
    \ haven’t modified the data frame. However, once we create a new column, this\
    \ means that we have to copy the full data frame. The second function instead\
    \ takes in a single column, requiring us to copy only this information. The difference\
    \ in execution time shows an edge to the second method, but the difference is\
    \ small. This indicates that actually computing this new column and finding the\
    \ proportions takes more time than the duplication.\n\n```\n```r\ncode_promisl\
    \ <- function(df){\n    # create new column with categories\n    df$PAIN_PHYSICAL_FUNCTION_CUT\
