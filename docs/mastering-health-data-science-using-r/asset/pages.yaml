- pgno: 215
  md: "# 13.1.1 Practice Question\n\nFit a simple linear regression model with SBP\
    \ as the outcome and AGE as the independent variable. The estimated coefficient\
    \ for AGE should be 0.47693. Then, plot these two variables against each other\
    \ and add the estimated regression line to the plot, as we did previously. You\
    \ should see that this regression has a better fit than the previous one.\n\n\
    ```\n# Insert your solution here:\n```\n\n# 13.2 Multiple Linear Regression\n\n\
    We now create a model that is similar to the previous one except that it also\
    \ adjusts for age and sex. To add these variables into the model, we have to specify\
    \ a new formula. In the following code chunk, we fit this model and then print\
    \ a summary, again using the summary() function.\n\n```\nadj_model <- lm(SBP ~\
    \ LEAD + AGE + SEX, data = nhanes_df)\nsummary(adj_model)\n#>\n#> Call:\n#> lm(formula\
    \ = SBP ~ LEAD + AGE + SEX, data = nhanes_df)\n#>\n#> Residuals:\n#>     Min \
    \     1Q  Median      3Q     Max \n#> -65.62 -10.59  -1.55   8.55 131.60 \n#>\n\
    #> Coefficients:\n#>             Estimate Std. Error t value Pr(>|t|)    \n#>\
    \ (Intercept) 101.78541    0.30353  335.34   < 2e-16 ***\n#> LEAD         0.40007\
    \    0.05525    7.24   4.5e-13 ***\n#> AGE          0.46193    0.00557   82.97\
    \   < 2e-16 ***\n#> SEXFemale   -2.77774    0.19567  -14.20   < 2e-16 ***\n#>\
    \ ---\n#> Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n#>\n\
    #> Residual standard error: 16.6 on 30401 degrees of freedom\n#> Multiple R-squared:\
    \  0.212,\tAdjusted R-squared:  0.212 \n#> F-statistic: 2.72e+03 on 3 and 30401\
    \ DF,  p-value: <2e-16\n```"
