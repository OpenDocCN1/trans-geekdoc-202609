  md: 'values range from 0 to 10 with a median value of 7 and that there is a NA value.


    ```

    ```r

    summary(pain$PAIN_INTENSITY_AVERAGE)

    #> Min. 1st Qu. Median Mean 3rd Qu. Max. NA''s

    #> 0.00 5.00 7.00 6.49 8.00 10.00 1

    ```

    ```


    We have already seen the `max()`, `min()`, `mean()`, and `median()` functions
    that could have computed some of these values for us separately. Since we do have
    an NA value, we add the `na.rm=TRUE` argument to these functions. Without this
    argument, the returned value for all of the functions is NA.


    ```

    ```r

    min(pain$PAIN_INTENSITY_AVERAGE, na.rm=TRUE)

    #> [1] 0

    max(pain$PAIN_INTENSITY_AVERAGE, na.rm=TRUE)

    #> [1] 10

    mean(pain$PAIN_INTENSITY_AVERAGE, na.rm=TRUE)

    #> [1] 6.49

    median(pain$PAIN_INTENSITY_AVERAGE, na.rm=TRUE)

    #> [1] 7

    ```

    ```


    Additionally, the following functions are helpful for summarizing quantitative
    columns.


    +   - `range()` - returns the minimum and maximum values for a numeric vector
    x.

    +   - `quantile()` - returns the sample quantiles for a numeric vector.

    +   - `IQR()` - returns the interquartile range for a numeric vector.


    By default, the `quantile()` function returns the sample quantiles.


    ```

    ```r

    quantile(pain$PAIN_INTENSITY_AVERAGE, na.rm = TRUE)

    #>    0%  25%  50%  75% 100%

    #>     0    5    7    8   10

    ```

    ```


    However, we can pass in a list of probabilities to use instead. For example, in
    the following code we find the 0.1 and 0.9 quantiles. Again, we add the `na.rm=TRUE`
    argument.


    ```

    ```r

    quantile(pain$PAIN_INTENSITY_AVERAGE, probs = c(0.1, 0.9), na.rm=TRUE)

    #>  10% 90%

    #>    4   9

    ```

