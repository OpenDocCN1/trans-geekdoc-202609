  md: "```\n#> 5   0   1\n#> 6   0   1\n```\n\nOur outcome vector corresponds to log\
    \ transformed systolic blood pressure.\n\n```\ny <- log(nhanes$SBP)\n```\n\nThe\
    \ glmnet() function fits an elastic net regression model. This requires us to\
    \ specify our input matrix x and response variable y. Additionally, we can specify\
    \ the assumed distribution for y using the family argument. In our subsequent\
    \ example, we fit this model with α = 1 and 25 different values of λ. By default,\
    \ glmnet() sets α to 1 and creates a grid of 100 different values of lambda. It\
    \ is also default to standardize x, which we can turn off by specifying standardize\
    \ = FALSE in our function call.\n\n```\nmod_lasso <- glmnet(x, y, family = \"\
    gaussian\", alpha = 1,\n                   nlambda = 25)\n```\n\nIf we plot the\
    \ resulting object, we can see the model coefficients for each resulting model\
    \ by plotting how the coefficient for each variable changes with the value of\
    \ λ. The plot() function by default plots these against the penalty term but we\
    \ can also specify to plot against the λ values on the log scale. The label argument\
    \ adds a label to each line, though these are often hard to read. The numbers\
    \ at the top of the plot indicate how many non-zero coefficients were included\
    \ in the model for different λ values. Read the documentation ?glmnet to see the\
    \ other possible inputs including the penalty.factor and weights arguments.\n\n\
    ```\nplot(mod_lasso, xvar = \"lambda\", label = TRUE)\n```"
