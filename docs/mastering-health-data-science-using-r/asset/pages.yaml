    \ function. For a one-sample t-test, we need to specify our sample x, the alternative\
    \ hypothesis `alternative` (default is a two-sided test), the true value of the\
    \ mean `mu` (default 0), and a confidence level `conf.level` (default 0.95). In\
    \ the following code, we run this t-test, and we can see from the result that\
    \ we reject the null hypothesis at the 0.05 level and observe a statistically\
    \ significant decline in the abortion rate in 2021.\n\n```\nt.test(county_rates_2021,\
    \ alternative = \"less\", mu = 6.23,\n       conf.level=0.95)\n#>\n#> One Sample\
    \ t-test\n#>\n#> data:  county_rates_2021\n#> t = -2, df = 253, p-value = 0.02\n\
    #> alternative hypothesis: true mean is less than 6.23\n#> 95 percent confidence\
    \ interval:\n#>  -Inf 5.98\n#> sample estimates:\n#> mean of x\n#>   5.17\n```\n\
    \nThe output for this test is printed. If we want to reference these values, we\
    \ need to save the result. The object `t_test_res` is a list that contains information\
    \ about the statistic, p-value, confidence interval, etc. The list of outputs\
    \ is similar to other test objects, so it is useful to look at what is contained\
    \ in each by reading the test documentation (`?t.test`). We find the p-value from\
    \ `t_test_res`.\n\n```\nt_test_res <- t.test(county_rates_2021, alternative =\
    \ \"less\",\n                     mu = 6.23, conf.level = 0.95)\nnames(t_test_res)\n\
    #> [1] \"statistic\"   \"parameter\"   \"p.value\"     \"conf.int\"\n#> [5] \"\
    estimate\"    \"null.value\"  \"stderr\"      \"alternative\"\n#> [9] \"method\"\
    \      \"data.name\"\n\nt_test_res$p.value\n#> [1] 0.0161\n```"
