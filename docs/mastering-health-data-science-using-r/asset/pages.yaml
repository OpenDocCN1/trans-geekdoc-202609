  md: "```\nlibrary(MASS)\nlibrary(tidyverse)\nlibrary(patchwork)\nlibrary(glmnet)\n\
    ```\n\nWe start by writing our function to generate our data. Our input here will\
    \ be the parameters n, p, s, rho, and nu and our output will be a list.\n\n```\n\
    #' Simulate data\n#'\n#' @param n Number of observations\n#' @param p Number of\
    \ variables\n#' @param s Sparsity level (number of non-zero coefficients)\n#'\
    \ @param snr Signal-to-noise ratio\n#' @param rho Predictor correlation level\n\
    #' @return List containing simulated covariate matrix `X`,\n#' outcome vector\
    \ `y`, true coefficient vector `beta`,\n#' covariate matrix `Sigma`, and variance\
    \ of y `sigma`\nsimulate_data <- function(n, p, s, snr, rho) {\n\n  # Generate\
    \ covariance matrix\n  cov_mat = matrix(0, nrow = p, ncol = p)\n  for (row in\
    \ 1:p) {\n    for (col in 1:p) {\n      cov_mat[row, col] = rho^abs(row-col)\n\
    \    }\n  }\n\n  # Generate X\n  x <- mvrnorm(n=n, mu=rep(0,p), Sigma = cov_mat)\n\
    \n  # Generate beta values\n  b <- rep(0, p)\n  b[1:s] <- 1\n\n  # find values\n\
    \  mu <- x %*% b\n  intercept <- -mean(mu)\n\n  # Calculate variance\n  var <-\
    \ as.numeric((t(b) %*% cov_mat %*% b)/snr)\n\n  # Generate y values\n```"
  merge: -1
  img_proc: true
- pgno: 319
  md: "```\ny <- mvrnorm(mu = mu, Sigma = var*diag(n))\n\nreturn(list(X = x, y = y,\
    \ beta = b, Sigma = cov_mat, sigma = var))\n}\n```\n\nNext, we will write a function\
    \ for our model metrics. The only input we need from our model is the estimated\
    \ coefficients. Otherwise, all of the information comes from the data we generate\
    \ with the function we just wrote. We will utilize this list format to extract\
    \ the values needed for our formulas.\n\n```\n#' Return model metrics\n#'\n#'\
    \ @param coef_est Vector with estimated coefficients\n#' @param test_data Withth\
    \ test set (`simulate_data()` output)\n#' @return Vector with relative test error\
    \ (RTE) and proportion\n#' of variance explained (PVE).\nget_metrics <- function(coef_est,\
    \ test_data) {\n\n  # Extract out values needed\n  coef_true <- test_data$beta\n\
    \  Sigma <- test_data$Sigma\n  var_y <- test_data$sigma\n\n  # Calculate relative\
    \ test error\n  RTE <- (t(coef_est - coef_true) %*% Sigma %*%\n           (coef_est\
    \ - coef_true) + var_y) /\n    var_y\n\n  # Calculate PVE\n  # Proportion of variance\
    \ explained\n  PVE <- 1 - (t(coef_est - coef_true) %*% Sigma %*%\n           \
    \    (coef_est - coef_true) + var_y) /\n    (var_y + t(coef_true %*% Sigma %*%\
    \ coef_true))\n\n  return(c(RTE = RTE, PVE = PVE))\n}\n```\n\nNext, we will write\
    \ a function that takes in the given parameters, fits the two models, and outputs\
    \ the evaluation metrics. In this case, we will let the parameters be a named\
