    # ## 4.4 Tables


    Another useful way to display information about your data is through tables. For
    example, it is standard practice in articles to have the first table in the paper
    give information about the study sample, such as the mean and standard deviation
    for all continuous columns and the proportions for categorical columns. The **gt**
    package is designed to create polished tables that can include footnotes, titles,
    column labels, etc. The **gtsummary** package is an extension of this package
    that can create summary tables. We focus on the latter but come back to creating
    nice tables in Chapter 22.


    To start, we create a gt object (a special type of table) of the first six rows
    of our data using the `gt()` function. You can see the difference in the formatting
    as opposed to printing the data.


