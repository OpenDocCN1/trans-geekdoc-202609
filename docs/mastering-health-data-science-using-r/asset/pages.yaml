  md: "```\n# Insert your solution here:\n```\n\n# 13.3.4 Leverage and Influence\n\
    \nWe may also be interested in how each observation is influencing the model.\
    \ Leverage values measure how much an individual observation’s y value influences\
    \ its own predicted value and indicate whether observations have extreme predictor\
    \ values compared to the rest of the data. Leverage values range from 0 to 1 and\
    \ sum to the number of estimated coefficients. Observations with high leverage\
    \ have the potential to significantly impact the estimated regression coefficients\
    \ and the overall fit of the model. Therefore, examining leverage values helps\
    \ identify observations that may be influential or outliers. In the following\
    \ code chunk, we find the ten highest leverage values and then find those observations\
    \ in the data.\n\n```\nsort(hatvalues(adj_model), decreasing = TRUE)[1:10]\n#>\
    \   23016    2511    3091   21891    3661     511   21892   15321\n#>     6511\n\
    #> 0.03899 0.02936 0.02270 0.01484 0.01443 0.01399 0.01159 0.01080\n#>   0.01022\n\
    #>     3452\n#> 0.00968\nnhanes_df[order(hatvalues(adj_model), decreasing = TRUE),\
    \ ] %>%\n    select(c(SBP, LEAD, AGE, SEX)) %>%\n    head(10)\n#>       SBP LEAD\
    \ AGE  SEX\n#> 23016 129 61.3  38 Male\n#>  2511 139 54.0  61 Male\n#>  3091 154\
    \ 48.0  72 Male\n#> 21891 123 38.9  54 Male\n#>  3661 101 38.0  39 Male\n#>  \
