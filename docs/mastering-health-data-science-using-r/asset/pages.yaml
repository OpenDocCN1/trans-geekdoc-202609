- pgno: 101
  md: "allows us to specify a condition, and then two alternative values based on\
    \ whether we meet or do not meet this condition. We see that there are about 15,000\
    \ subjects in our data who never smoked.\n\n```\n```r\nifelse(nhanes_df$SMOKE_STATUS\
    \ == \"NeverSmoke\", \"No\", \"Yes\") %>%\n  table()\n#> .\n#>     No  Yes\n#>\
    \ 15087 16178\n```\n```\n\nAnother useful function from the **tidyverse** is the\
    \ `case_when()` function, which is an extension of the `ifelse()` function but\
    \ allows to specify more than two cases. We demonstrate this function to show\
    \ how we could relabel the levels of the SMOKE_STATUS column. For each condition,\
    \ we use the right side of the `~` to specify the value to be assigned when that\
    \ condition is TRUE.\n\n```\n```r\ncase_when(nhanes_df$SMOKE_STATUS == \"NeverSmoke\"\
    \ ~ \"Never Smoked\",\n          nhanes_df$SMOKE_STATUS == \"QuitSmoke\" ~ \"\
    Quit Smoking\",\n          nhanes_df$SMOKE_STATUS ==\n             \"StillSmoke\"\
    \ ~ \"Current Smoker\") %>%\n  table()\n#>\n#> Current Smoker   Never Smoked \
    \  Quit Smoking\n#>       7317           15087          8861\n```\n```\n\nIn the\
    \ previous example, we did not store the columns we created. To do so, we could\
    \ use the `$` operator or the `cbind()` function. The tidyverse also includes\
    \ an alternative function to add columns called `mutate()`. This function takes\
    \ in a data frame and a set of columns with associated names to add to the data\
    \ or update. In the subsequent example, we create the column EVER_SMOKE and update\
    \ the column SMOKE_STATUS. Within the `mutate()` function, we do not have to use\
    \ the `$` operator to reference the column SMOKE_STATUS. Instead, we can specify\
    \ just the column name, and the function interprets it as that column.\n\n```\n\
    ```r\nnhanes_df <- nhanes_df %>%\n  mutate(EVER_SMOKE = ifelse(SMOKE_STATUS ==\
    \ \"NeverSmoke\",\n                             \"No\", \"Yes\"),\n         SMOKE_STATUS\
    \ =\n             case_when(SMOKE_STATUS == \"NeverSmoke\" ~ \"Never Smoked\"\
    ,\n                       SMOKE_STATUS == \"QuitSmoke\" ~ \"Quit Smoking\",\n\
    \                       SMOKE_STATUS == \"StillSmoke\" ~ \"Current Smoker\"))\n\
    ```\n```"
