    \       0     0 1.242  8.46e-09\n#> 5         Other Race       0     0 1.927 \
    \ 1.06e-11\n```\n```\n\nWe now write this code as a *for* loop. A for loop contains\
    \ two pieces. First, we have an *iterator*. An iterator traverses an object that\
    \ has a natural order. Most of the time we traverse over vectors, but we could\
    \ also have a list object. The second piece is a code block. This code is run\
    \ for each value of the iterator.\n\n```\n```r\nfor (iterator_name in object){\n\
    \    code to run for each value of the iterator\n}\n```\n```\n\nTwo simple for\
    \ loops are given in the next code chunk. In the first loop, our iterator goes\
    \ through the vector 1:5, whereas in the second one our iterator iterates through\
    \ the vector of names. In the first loop, we traverse the numbers 1 to 5 and for\
    \ each number we run the code that squares the number. In each iteration, we name\
    \ the current number we are on to be i. That means that the first time through\
    \ the loop i is equal to 1, the second time i has value 2, etc. In the second\
    \ loop, our iterator is also a vector, but this time it is names. In this case,\
    \ in each iteration the object name represents the current name we are on as we\
    \ traverse the vector of names. In particular, the first time through the loop\
    \ name is equal to “Alice”, the second time name has value “Bob”, and so forth.\n\
    \n```\n```r\nfor (i in 1:5){\n    print(sqrt(i))\n}\n#> [1] 1\n#> [1] 1.41\n#>\
    \ [1] 1.73\n#> [1] 2\n#> [1] 2.24\n```\n```"
