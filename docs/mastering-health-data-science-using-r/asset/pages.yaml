  md: '# # 21

    ## Expanding Your R Skills


    Throughout this book, we have covered some popular packages as well as many of
    the specific functions from these packages. However, it would be impossible to
    cover all of the packages, functions, and options that are available in R. In
    this chapter, we talk about how to use new packages, interpret error messages,
    debugging, and overall good programming practices to help you take your R programming
    to the next level.


    # ### 21.1 Reading Documentation for New Packages


    As you start to apply the tools from this book to your own work or in new settings,
    you may need to install and use new packages or encounter some unexpected errors.
    Practicing reading package documentation and responding to error messages helps
    you expand your R skills beyond the topics covered here. We demonstrate these
    skills using the **stringr** package (Wickham 2022), which is a package that is
    part of the **tidyverse** and has several functions for dealing with text data.


    ```

    ```r

    library(tidyverse)

    library(HDSinRdata)

    ```

    ```


    Every published package has a CRAN website. This website contains a reference
    manual that contains the documentation for the functions and data available in
    the package. Most often, the website also includes useful vignettes that give
    examples of how to use the functions in the package. The site also tells you what
    the requirements for using the package are, who the authors of the package are,
    and when the package was last updated. For example, take a look at the CRAN site
    for **stringr**¹ and read the vignette “Introduction to String R”².


    We use the **stringr** package to demonstrate cleaning up text related to a'
