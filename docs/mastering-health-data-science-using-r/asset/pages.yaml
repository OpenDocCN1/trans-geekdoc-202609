    # 22.4 Adding in Equations


    Another useful option in Markdown is to add in mathematical equations. If you
    want to insert math equations, you can do so by writing LaTeX expressions. To
    write a math equation inline, you put a single dollar sign $ on either side of
    your equation, and to write a math equation on its own line, you put a double
    dollar sign $$ on either side of the equation, like so:


    Here''s an equation that is inline with the text: $5x^2 + 9x^3$ produces $5x^2
    + 9x^3$. On the other hand, here''s an equation that is on its own line: $$5x^2
    + 9x^3$$ produces


    $5x^2 + 9x^3$


    Here is some other LaTeX notation that you should know in order to write common
    equations: * To create a fraction, type \frac{numerator}{denominator}. For example,
    \frac{2}{3} produces 2/3. * To create a subscript, type _. For'
