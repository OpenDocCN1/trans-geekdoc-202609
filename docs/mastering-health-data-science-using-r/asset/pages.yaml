- pgno: 185
  md: 'In this chapter, we look at hypothesis testing in R. We start with single sample
    distributions and tests, and then we look at hypothesis tests for comparing two
    samples. Examples include testing for positive correlations, performing two-sample
    paired t-tests, and testing for equal variance among groups. The data we use in
    this section comes from the Texas Health and Human Services Department and includes
    the reported number of induced terminations of pregnancy (ITOPs) from 2016 to
    2021, stratified by both race and county (Texas Health & Human Services Commission
    2016-2021). The data also contains the rate of abortions per 1000 females aged
    15-49. Read the data documentation to see the full variable descriptions.


    We use the **tidyverse**, **gt**, and **gtsummary** packages to help manipulate
    and summarize the data. The **car** package (Fox, Weisberg, and Price 2023) contains
    the function `leveneTest()` to implement a Levene''s test for homogeneity of variance
    across groups, and all other hypothesis tests are available in base R.


    ```

    library(tidyverse)

    library(car)

    library(HDSinRdata)

    library(gt)

    library(gtsummary)


    data(tex_itop)

    ```


    # 11.1 Univariate Distributions and One-Sample Tests


    Let''s begin by looking at a single outcome of interest - the number of induced
    terminations of pregnancy (referred to as ITOPs or abortions below) in 2021 per
    1000 females ages 15-49 in each county. We use the number of females ages 15-49
    as a proxy to scale the number of abortions by the population size,'
  merge: -1
  img_proc: true
- pgno: 186
  md: "though this is not truly reflective of the number of people who can give birth\
    \ in each county.\n\n```\ncounty_rates_2021 <- tex_itop$total_rate[tex_itop$year\
    \ == 2021]\nhist(county_rates_2021, breaks = 35)\n```\n\n![](img/58a554e865d49ca347d9a3f76f8f0812_186_0.png)\n\
    \nWe can see in the figure that this is a heavy-tailed distribution. In the following\
    \ code, we find the ten counties with the highest rates and see that there are\
    \ some counties that have very few total abortions but that have some of the highest\
    \ abortion rates. This indicates a small population. On the other hand, we also\
    \ observe Harris county, which contains the city of Houston and has both a high\
    \ total abortion count and a high abortion rate.\n\n```\ntex_itop %>%\n  filter(year\
    \ == 2021) %>%\n  slice_max(n = 10, total_rate) %>%\n  dplyr::select(c(county,\
    \ total_itop, total_rate))\n#> # A tibble: 10 x 3\n#>   county total_itop total_rate\n\
    #>   <chr>      <dbl>     <dbl>\n#> 1 Loving         1     111.\n#> 2 Terrell\
    \        5      50\n#> 3 Concho         4     13.9\n#> 4 Harris     14122    \
    \ 13.5\n```"
