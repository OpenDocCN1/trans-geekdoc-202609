- pgno: 179
  md: "```\n```\npnorm(0)\n#> [1] 0.5\npnorm(5, mean = 5, sd = 1)\n#> [1] 0.5\n```\n\
    ```\n\nSince the binomial distribution is discrete, it can only take on integer\
    \ values from 0 to size. This means that, for example, the `pbinom()` function\
    \ returns the same value for 3, 3.5, 3.6, all the way up to, but not including,\
    \ 4. This is because \\(P(X \\le 3) = P(X \\le 3.2) = P(X \\le 3.5) = P(X \\le\
    \ 3.6)\\) and so on. Note that here we passed in a vector of values x.\n\n```\n\
    ```\npbinom(c(3, 3.5, 3.6, 4), size = 10, p = 0.5)\n#> [1] 0.172 0.172 0.172 0.377\n\
    ```\n```\n\nWe can also vary the parameters for the distribution by passing a\
    \ vector for size and/or p to the cumulative distribution function. In the subsequent\
    \ code chunk, we find the probability that \\(X \\le 3\\) and the probability\
    \ that \\(X \\le 4\\) with 12 trials and a probability 0.25 and with 10 trials\
    \ and a probability 0.5.\n\n```\n```\npbinom(c(3, 3, 4, 4), size = c(12, 10, 12,\
    \ 10),\n       p=c(0.25, 0.5, 0.25, 0.5))\n#> [1] 0.649 0.172 0.842 0.377\n```\n\
    ```\n\n# 10.1.4 Quantile Distribution\n\nLastly, we have the quantile distribution\
    \ function, which is the inverse of the cumulative distribution function. This\
    \ function takes in a probability x, a mean, and a sd and returns the value for\
    \ which the cumulative distribution function is equal to x. Thus, when x is equal\
    \ to 0.5, the `qnorm()` function returns the median of the distribution, which\
    \ is equal to the mean for the normal distribution.\n\n```\n```\nqnorm(0.5)\n\
    #> [1] 0\nqnorm(0.5, mean = 5, sd = 1)\n#> [1] 5\n```\n```\n\nFor the discrete\
    \ binomial distribution, the `qbinom()` function returns the largest integer value\
    \ for which the probability of being less than or equal to that value is at most\
    \ the inputted value x."
  merge: -1
  img_proc: true
