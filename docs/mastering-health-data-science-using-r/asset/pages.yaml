  md: '# Types of Joins:


    +   • left_join(table1, table2, by): Joins each row of table1 with all matches
    in table2.


    +   • right_join(table1, table2, by): Joins each row of table2 with all matches
    in table1 (the opposite of a left join)


    +   • inner_join(table1, table2, by): Looks for all matches between rows in table1
    and table2. Rows that do not find a match are dropped.


    +   • full_join(table1, table2, by): Keeps all rows from both tables and joins
    those that match. Rows that do not find a match have NA values filled in.


    +   • semi_join(table1, table2, by): Keeps all rows in table1 that have a match
    in table2 but does not join to any information from table2.


    +   • anti_join(table1, table2, by): Keeps all rows in table1 that do not have
    a match in table2 but does not join to any information from table2. The opposite
    of a semi-join.


    We first demonstrate a left-join using the left_join() function. This function
    takes in two data tables (table1 and table2) and the columns to match rows by.
    In a left-join, for every row of table1, we look for all matching rows in table2
    and add any columns not used to do the matching. Thus, every row in table1 corresponds
    to at least one entry in the resulting table but possibly more if there are multiple
    matches. In the subsequent code chunk, we use a left-join to add the lockdown
    information to our covidcases data. In this case, the first table is covidcases
    and we match by state. Since the state column has a slightly different name in
    the two data frames (“state” in covidcases and “State” in lockdowndates), we specify
    that state is equivalent to State in the by argument.


    ```

    covidcases_full <- left_join(covidcases, lockdowndates,

    by = c("state" = "State"))


    head(covidcases_full)

    ## # A tibble: 6 x 8

    ## state county week weekly_cases weekly_deaths date

    ## <chr> <chr> <dbl> <int> <int> <date>

    ## 1 California Marin 9 1 0 2020-02-23

    ## 2 California Orange 9 3 0 2020-02-23

    ## 3 Florida Manatee 9 1 0 2020-02-23

    ## 4 California Napa 9 1 0 2020-02-23

    ## 5 New Hampshire Grafton 9 2 0 2020-02-23

    ```'
