  md: "```\nnhanes <- NHANESsample %>%\nselect(c(RACE, SEX, SBP1, DBP1, HYP, LEAD))\
    \ %>%\nna.omit()\n```\n\nIn the following code, we are fitting a simple linear\
    \ regression model for systolic blood pressure with the single covariate of blood\
