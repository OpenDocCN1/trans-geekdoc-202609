  md: 'To start, type 2+3 and press ENTER. You should see that 5 is printed below
    that code and that your cursor is moved to the next line.


    # ### 1.2.1 Basic Computations and Objects


    In the previous example, we coded a simple addition. Try out some other basic
    calculations using the following operators :


    +   - Addition: 5+6

    +   - Subtraction: 7−2

    +   - Multiplication: 2*3

    +   - Division: 6/3

    +   - Exponentiation: 4^2

    +   - Modulo: 100 %% 4


    For example, use the modulo operator to find what 100 mod 4 is. It should return
    0 since 100 is divisible by 4.


    If we want to save the result of any computation, we need to create an object
    to store our value of interest. An object is simply a named data structure that
    allows us to reference that data structure. Objects are also commonly called **variables**.
    In the following code, we create an object x which stores the value 5 using the
    assignment operator <-. The assignment operator assigns whatever is on the right-hand
    side of the operator to the name on the left-hand side. We can now reference x
    by calling its name. Additionally, we can update its value by adding 1. In the
    second line of code, the computer first finds the value of the right-hand side
    by finding the current value of x before adding 1 and assigning it back to x.


    ```

