    x <- 2+3

    x <- x+1

    x

    #> [1] 6

    ```

    ```


    We can create and store multiple objects by using different names. The following
    code creates a new object y that is one more than the value of x. We can see that
    the value of x is still 5 after running this code.


    ```

    ```r

    x <- 2+3

    y <- x

    ```

