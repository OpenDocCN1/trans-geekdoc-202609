  md: "```\n```r\nex_return <- function(){\n  x <- 2\n  y <- 3\n}\nresult <- ex_return()\n\
    result\n#> [1] 3\n```\n```\n\n# 18.1.4 Scope of Objects\n\nWhen working within\
    \ functions and calling functions, we want to remember the scope of our objects.\
    \ *Global objects* are objects defined outside of functions. These values can\
    \ also be accessed outside or inside functions. For example, the object y is defined\
    \ outside of a function and so is a global object, meaning we can use its value\
    \ inside the function.\n\n```\n```r\ny <- \"Cassandra\"\n\nex_scope <- function(){\n\
    \  return(paste(\"Hey,\", y))\n}\n\nex_scope()\n#> [1] \"Hey, Cassandra\"\n```\n\
    ```\n\nIf we change the value of a global object within a function however, it\
    \ does not update the value outside of the function. In the subsequent code chunk,\
    \ we add 1 to y inside the function, but it does not change the value of y after\
    \ the function is done. Every time we run a function, R creates a new sub-environment\
    \ inside, which can access the values of global objects but also creates its own\
    \ *local objects*. In this case, the function creates its own object y, which\
    \ is a local object that is a copy of the original object.\n\nAs another example,\
    \ the function also creates a local object called z which ceases to exist after\
    \ we run the function. If we try to print z on the last line, we would get an\
    \ error that z is not found. All objects created inside functions only exist in\
    \ that sub-environment and are erased when we are no longer in the function. Therefore,\
    \ we want to make sure we return any values we want to store.\n\n```\n```r\ny\
    \ <- 5\n```\n```"
  merge: -1
  img_proc: true
- pgno: 301
  md: "```\nex_local <- function(x){\n  y <- y + 1\n  z <- x * y\n  return(y + z)\n\
    }\n\nex_local(2)\n#> [1] 18\ny\n#> [1] 5\n```\n\nTo update global objects within\
    \ a function, you can use the `<<-` operator (global assignment operator). This\
    \ looks for an object in the global environment and updates its value (or creates\
    \ an object with this value if none is found). For example, the following function\
    \ updates the value of the global objects `y`. As a general practice, we should\
    \ be careful using global objects within a function, and it often is safer to\
    \ use input arguments and return values instead.\n\n```\ny <- 5\n\nex_update_global\
    \ <- function(x){\n  y <<- y + 1\n  return(y + x)\n}\n\nex_update_global(2)\n\
    #> [1] 8\ny\n#> [1] 6\n```\n\n# 18.1.5 Functions within Functions and Returning\
    \ Functions\n\nSometimes we see functions written inside other functions. Writing\
    \ functions within functions can be useful to separate out some part of the code\
    \ or to give that function access to the local environment objects. In the following\
    \ example, the inner function has access to the value of `x` even though we have\
    \ not passed it as an argument. The downside of this structure is that the function\
    \ `add_x()` does not exist outside the function, so we cannot call it in other\
    \ code."
  merge: -1
  img_proc: true
