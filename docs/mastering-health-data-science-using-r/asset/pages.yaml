- pgno: 122
  md: "# 7.1 Tidy Data\n\nThe tidyverse is designed around interacting with tidy data\
    \ with the premise that using data in a tidy format can streamline our analysis.\
    \ Data is considered tidy if:\n\n+   - Each variable is associated with a single\
    \ column.\n+   - Each observation is associated with a single row.\n+   - Each\
    \ value has its own cell.\n\nTake a look at the sample data which stores information\
    \ about the maternal mortality rate for five countries over time (Roser and Ritchie\
    \ 2013). This data is not tidy because the variable for maternity mortality rate\
    \ is associated with multiple columns. Every row should correspond to one class\
    \ observation.\n\n```\nmat_mort1 <- data.frame(country = c(\"Turkey\", \"United\
    \ States\",\n  \"Sweden\", \"Japan\"),\n  y2002 = c(64, 9.9, 4.17, 7.8),\n  y2007\
    \ = c(21.9, 12.7, 1.86, 3.6),\n  y2012 = c(15.2, 16, 5.4, 4.8))\nhead(mat_mort1)\n\
    #>   country y2002 y2007 y2012\n#> 1   Turkey 64.00 21.90 15.2\n#> 2 United States\
    \ 9.90 12.70 16.0\n#> 3   Sweden 4.17 1.86 5.4\n#> 4    Japan 7.80 3.60 4.8\n\
    ```\n\nHowever, we can make this data tidy by creating separate columns for country,\
    \ year, and maternity mortality rate as we demonstrate in the following code.\
    \ Now every observation is associated with an individual row.\n\n```\nmat_mort2\
    \ <- data.frame(\n  country = rep(c(\"Turkey\", \"United States\", \"Sweden\"\
    , \"Japan\"), 3),\n  year = c(rep(2002, 4), rep(2007, 4), rep(2012, 4)),\n  mat_mort_rate\
    \ = c(64.0, 9.9, 4.17, 7.8, 21.9, 12.7, 1.86, 3.6,\n                    15.2,\
    \ 16, 5.4, 4.8))\nhead(mat_mort2)\n#>   country year mat_mort_rate\n#> 1   Turkey\
    \ 2002        64.00\n#> 2 United States 2002         9.90\n#> 3   Sweden 2002\
    \         4.17\n```"
  merge: -1
  img_proc: true
