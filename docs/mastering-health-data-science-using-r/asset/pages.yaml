    when passed an lm object. The four plots include (a) Residuals vs. Fitted, (b)
    a QQ-plot for the residuals, (c) Standardized residuals (sqrt) vs. Fitted, and
    (d) Standardized Residuals vs. Leverage. In the last plot, you'
