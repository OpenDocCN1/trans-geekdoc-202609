    \ it does not include an option to specify your own folds. Instead, we use the\
    \ `nfolds` argument to specify to run 5-fold cross-validation. This function also\
    \ allows us to specify a number of \\(\\lambda\\) and \\(\\gamma\\) values, or\
    \ we can use the default number. Plotting the result shows the estimated mean\
    \ squared error with error bars for each model and the corresponding support size.\n\
    \n```\ncv_l0l2 = L0Learn.cvfit(x, y, loss = \"SquaredError\",\n nFolds = 5, penalty\
    \ = \"L0L2\")\nplot(cv_l0l2)\n```\n\n![](img/58a554e865d49ca347d9a3f76f8f0812_265_0.png)\n\
    \nThe returned results are stored in `cvMeans`. This is a list of matrices — one\
    \ for each value of \\(\\gamma\\). To extract these into a more manageable form,\
    \ we use the `sapply()` function to convert each matrix to a numeric vector and\
    \ create a matrix of results. The columns of this matrix correspond to the 10\
    \ \\(\\gamma\\) values used, and each column of this matrix corresponds to 100\
    \ \\(\\lambda\\) values chosen for that particular value of \\(\\gamma\\). We\
    \ use the `which()` function to find which one has the lowest estimated mean squared\
    \ error."
