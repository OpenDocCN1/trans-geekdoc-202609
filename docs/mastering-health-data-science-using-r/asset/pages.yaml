    The formula passed to the lm() function also allows us to use the . to indicate
    that we would like to include all remaining columns as independent variables or
    the - to exclude variables. In the following code chunk, we show how we could
    use these to fit a model with LEAD, AGE, and SEX as included covariates by excluding
    all other variables instead of by specifying these three variables themselves.


    ```

    lm(SBP ~ . - ID - RACE - EDUCATION - INCOME - SMOKE - YEAR - BMI_CAT -

    LEAD_QUANTILE - DBP - ALC - HYP - RACE, data = nhanes_df)

    #>

    #> Call:

    #> lm(formula = SBP ~ . - ID - RACE - EDUCATION - INCOME - SMOKE -

    #>     YEAR - BMI_CAT - LEAD_QUANTILE - DBP - ALC - HYP - RACE,

    #>     data = nhanes_df)

    #>

    #> Coefficients:

    #>  (Intercept)          AGE      SEXMale         LEAD

