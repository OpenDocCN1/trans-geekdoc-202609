- pgno: 119
  md: '# # 7


    Merging and Reshaping Data


    In this chapter, we continue to look at some of the ways to manipulate data using
    the **tidy**r and **dplyr** packages, which are part of the **tidyverse** group
    of packages. In particular, we look at reshaping and merging data frames in order
    to get the data in the format we want. When reshaping data, we can convert between
    _wide form_ (more columns, fewer rows) and _long form_ (fewer columns, more rows).
    We can also use data pivots to put our data into what is called _tidy form_. Additionally,
    we look at combining information from multiple data frames into a single data
    frame. The key ideas when merging data are to think about what the common information
    is between the data frames and to consider which values we want to keep.


    For this chapter, we use three datasets. The first dataset is **covidcases**,
    which contains the weekly COVID-19 case and death counts by county in the United
    States for 2020 (Guidotti and Ardia 2020; Guidotti 2022); the second dataset is
    **mobility**, which contains daily mobility estimates by state in 2020 (Warren
    and Skillman 2020); and the third dataset is **lockdowndates**, which contains
    the start and end dates for statewide stay-at-home orders (Raifman et al. 2022).
    Take a look at the first few rows of each data frame and read the documentation
    for the column descriptions.


    ```

    library(tidyverse)

    library(HDSinRdata)


    data(covidcases)

    data(lockdowndates)

    data(mobility)

    ```


    ```

    head(covidcases)

    ## # A tibble: 6 x 5

    ##   state county week weekly_cases weekly_deaths

    ##   <chr> <chr> <dbl> <int> <int>

    ## 1 California Marin 9 1 0

    ## 2 California Orange 9 3 0

    ## 3 Florida Manatee 9 1 0

    ```'
  merge: -1
  img_proc: true
