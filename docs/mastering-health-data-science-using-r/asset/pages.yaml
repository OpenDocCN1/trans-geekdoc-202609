    #> [21] "SBP4"

    ```


    To start our exploration, we look at whether there are any missing values. We
    use the complete.cases() function to observe that there are no complete cases.
    We also see that the subsequent blood pressure measurements and alcohol use have
    the highest percentage of missing values. For demonstration, we choose to only
    keep the first systolic and diastolic blood pressure measurements and do a complete
    case analysis using the na.omit() function to define our complete data frame nhanes_df.


    ```

    sum(complete.cases(NHANESsample))

    #> [1] 0

    apply(NHANESsample, 2, function(x) sum(is.na(x)))/nrow(NHANESsample)

    #> ID AGE SEX RACE EDUCATION

