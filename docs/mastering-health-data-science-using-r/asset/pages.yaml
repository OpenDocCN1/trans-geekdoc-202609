- pgno: 176
  md: 'For the binomial distribution, the difference is that we need to specify a
    probability p and number of trials size (rather than mean and sd in the normal
    case) to specify the distribution. In the following code, we generate 100 random
    numbers following a binomial distribution with 10 trials and a probability 0.5.


    ```

    x <- rbinom(n = 100, p = 0.5, size = 10)

    hist(x)

    ```


    ![](img/58a554e865d49ca347d9a3f76f8f0812_176_0.png)


    We can also specify a different size or probability of success for each sample.
    We repeat our sample but this time let the probability of success be 0.25 for
    half of the sample and 0.75 for the other half.


    ```

    x <- rbinom(n = 100, p = rep(c(0.25, 0.75), 50), size = 10)

    hist(x)

    ```'
  merge: -1
  img_proc: true
