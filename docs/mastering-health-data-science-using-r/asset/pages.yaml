  md: "# Case Study: Predicting Tuberculosis Risk\n\nFor this chapter, we use the\
    \ tb_diagnosis dataset seen in Chapter 6 from the **HDSinRdata** package. These\
    \ data contains information on 1,762 patients in rural South Africa and urban\
    \ Uganda who presented at a health clinic with tuberculosis-related symptoms and\
    \ who were tested for tuberculosis (TB) using Xpert MTB/RIF (Baik et al. 2020).\
    \ Our goal is to conduct a similar regression analysis to Baik et al. (2020) and\
    \ use these data to derive a risk model for screening patients for treatment while\
    \ awaiting Xpert results. Unlike Baik et al. (2020), we do not restrict our analysis\
    \ to simple integer risk score models.\n\n```\n```r\nlibrary(tidyverse)\nlibrary(HDSinRdata)\n\
    library(gt)\nlibrary(gtsummary)\nlibrary(glmnet)\nlibrary(pROC)\n```\n```\n\n\
