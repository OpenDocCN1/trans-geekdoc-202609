    ```


    ```

    nhanes_df <- na.omit(subset(NHANESsample,

    select = -c(SBP2, SBP3, SBP4, DBP2, DBP3,

    DBP4)))

    ```


    In the last chapter, we introduced the table() and summary() functions to quickly
    summarize categorical and quantitative vectors. We can observe that over half
    of the observations never smoked and that the most recent NHANES cycle in the
    data is 2017-2018.


    ```

    table(nhanes_df$SMOKE)

