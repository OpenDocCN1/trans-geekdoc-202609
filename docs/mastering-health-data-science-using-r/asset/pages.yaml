    # ## 7.2 Reshaping Data


    The mobility and COVID-19 case data are both already in tidy form: each observation
    corresponds to a single row, and every column is a single variable. We might consider
    whether the lockdown dates should be re-formatted to be tidy. Another way to represent
    this data would be to have each observation be the start or end of a stay-at-home
    order.


    To reshape our data, we use the `pivot_longer()` function to change the data from
    what is called **wide form** to what is called **long form**. This kind of pivot
    involves taking a subset of columns that we want to _gather_ into a single column
    while increasing the number of rows in the dataset. Before pivoting, we have to
    think about which columns we are transforming. The image in Figure 7.1 shows a
    picture of some data on whether students have completed a physical, hearing, or
    eye exam. The data is presented in wide form on the left and long form on the
    right. To transform wide data to long data, we have identified a subset of columns
    `cols` that we want to transform (these `cols` are `phys`, `hear`, and `eye` in
    the left table). The long form contains a new column `names_to` that contains
    the exam type, and `values_to` that contains a binary variable indicating whether
    or not each exam was completed.


    In our case, we want to take the lockdown start and end columns and create two
    new columns: one column will indicate whether or not a date represents the start
    or end of a lockdown, and the other will contain the date itself. These are called
    the _key_ and _value_ columns, respectively. The key column gets its values from
    the names of the columns we are transforming (or the keys), whereas the value
    column gets its values from the entries in those columns (or the values).


    The `pivot_longer()` function takes in a data table, the columns `cols` that we
    are pivoting to long form, the column name, `names_to` that will store the data
    from the previous column names, and the column name `values_to` that will store
    the information from the columns gathered. In our case, we name the first column
    `Lockdown_Event`, since it will contain whether each date is the start or end
    of a lockdown, and we name the second column `Date`. Take a look at the result.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "![](img/58a554e865d49ca347d9a3f76f8f0812_124_0.png)\n\n# Figure 7.1: Pivoting\
    \ Longer.\n\n```\nlockdown_long <- lockdowndates %>%\n  pivot_longer(cols = c(\"\
    Lockdown_Start\", \"Lockdown_End\"),\n   names_to = \"Lockdown_Event\", values_to\
    \ = \"Date\") %>%\n  mutate(Date = as.Date(Date, formula = \"%Y-%M-%D\"),\n  \
    \       Lockdown_Event = ifelse(Lockdown_Event==\"Lockdown_Start\",\n        \
    \                         \"Start\", \"End\")) %>%\n  na.omit()\nhead(lockdown_long)\n\
    #> # A tibble: 6 x 3\n#>   State   Lockdown_Event Date\n#>   <chr>   <chr>   \
    \       <date>\n#> 1 Alabama Start            2020-04-04\n#> 2 Alabama End   \
    \         2020-04-30\n#> 3 Alaska  Start          2020-03-28\n#> 4 Alaska  End\
    \            2020-04-24\n#> 5 Arizona Start          2020-03-31\n#> 6 Arizona\
    \ End            2020-05-16\n```\n\nIn R, we can also transform our data in the\
    \ opposite direction (from long form to wide form instead of from wide form to\
    \ long form) using the function pivot_wider(). This function again first takes\
    \ in a data table, but now we specify the arguments names_from and values_from.\
    \ The former indicates the column that R should get the new column names from,\
    \ and the latter indicates where the row values should be taken from. For example,\
    \ in order to pivot our lockdown data back to wide form in the following code,\
    \ we specify that"
