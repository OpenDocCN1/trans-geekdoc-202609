  md: "# 5.4 Summarizing and Grouping\n\nsummarize() that finds the number of observations.\
    \ In the mean() and median() functions we set na.rm=TRUE to remove NAs before\
    \ computing these values (otherwise, we could get NA as our output).\n\n```\n\
    ```r\nnhanes_df %>%>\nfilter(RACE == \"Non-Hispanic Black\") %>%>\nsummarize(TOT\
    \ = n(), MEAN_SBP = mean(SBP1, na.rm=TRUE),\n          MEAN_DBP = mean(DBP1, na.rm=TRUE))\n\
    #>\n#>   TOT MEAN_SBP MEAN_DBP\n#> 1 6041    129   72.6\n```\n```\n\nIf we wanted\
    \ to repeat this for the other race groups, we would have to change the arguments\
    \ to the filter() function each time. To avoid having to repeat our code and/or\
    \ do this multiple times, we can use the group_by() function, which takes a data\
    \ frame and one or more columns with which to group the data. In the following\
    \ code, we group using the RACE variable. When we look at printed output, it looks\
    \ almost the same as it did before except that we can see that its class is now\
    \ a grouped data frame, which is printed at the top. In fact, a grouped data frame\
    \ (or grouped tibble) acts like a set of data frames: one for each group. If we\
    \ use the slice() function with index 1, it returns the first row for each group.\n\
    \n```\n```r\nnhanes_df %>%>\ngroup_by(RACE) %>%>\nslice(1)\n#> # A tibble: 5 x\
    \ 20\n#> # Groups:   RACE [5]\n#>    AGE SEX   RACE  EDUCATION PIR SMOKE_STATUS\
    \ YEAR LEAD\n#>  <dbl> <fct> <fct> <fct>     <dbl> <chr>      <dbl> <dbl>\n#>\
    \ 1   70 Male  Mexican~ LessThan~ 1.07 Quit Smoking 1999 1.6\n#> 2   61 Female\
    \ Other H~ MoreThan~ 3.33 Current Smo~ 1999 2.2\n#> 3   77 Male  Non-His~ MoreThan~\
    \ 5   Never Smoked 1999 5\n#> 4   38 Female Non-His~ HS        0.92 Current Smo~\
    \ 1999 1.8\n#> 5   63 Female Other R~ MoreThan~ 5   Never Smoked 1999 1.2\n#>\
    \ # i 11 more variables: HYP <dbl>, ALC <chr>, DBP1 <dbl>, DBP2 <dbl>,\n```\n\
    ```"
  merge: -1
  img_proc: true
