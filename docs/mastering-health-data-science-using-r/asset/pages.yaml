    ```


    Next, we call the cv.glmnet() function which implements k-fold cross-validation
    across a grid of lambda values. Similar to before, we specified x, y, and alpha
    = 1. This time, we also include the measure to use for cross-validation (mse indicates
    mean squared error) and provide the fold vector foldid. If you do not want to
    provide folds, you can instead use the nfolds argument to specify the number of
    folds desired and the cv.glmnet() function will create them. Plotting the returned
    object shows us the estimated mean squared error for different values of lambda
    as well as error bars for each estimate. Similar to before, it also shows the
    number of non-zero coefficients at the top.


    ```

    ```

    cv_lasso <- cv.glmnet(x, y, foldid = foldid, alpha = 1,

    type.measure = "mse")

    plot(cv_lasso)

