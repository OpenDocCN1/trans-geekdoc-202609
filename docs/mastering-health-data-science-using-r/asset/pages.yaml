    # ## 8.3 Adding Groups


    In the previous example, we created two histograms using two calls to the `geom_histogram()`
    function. However, there is another way to create multiple layers like this when
    you want to separate the geom layer based on a variable. For example, suppose
    we want to visualize the distribution of physical function by whether someone
    has follow-up information. In the following code, we create the variable HAS_FOLLOW_UP
    before using it in our aesthetic for `geom_density()`) as both the color and group.
    In fact, we do not have to add the group argument because as soon as we specify
    to `ggplot` that we want to color the density plots by this variable, it creates
    the grouping. Finally, we update the legend for this grouping using the `scale_color_discrete()`
    function, as the discrete variable HAS_FOLLOW_UP determines the color.'
