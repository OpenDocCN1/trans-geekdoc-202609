    \ tibble: 6 x 3\n##   State   Start       End\n##   <chr>   <date>      <date>\n\
    ## 1 Alabama 2020-04-04  2020-04-30\n## 2 Alaska  2020-03-28  2020-04-24\n## 3\
    \ Arizona 2020-03-31  2020-05-16\n## 4 California 2020-03-19 2021-01-25\n## 5\
    \ Colorado 2020-03-26  2020-04-27\n## 6 Connecticut 2020-03-23 2020-05-20\n```\n\
    \nHere's another example: suppose that I want to create a data frame where the\
    \ columns correspond to the number of cases for each state in New England, and\
    \ the rows correspond to the numbered months. First, I need to filter my data\
    \ to New England and then summarize my data to find the number of cases per month.\
    \ I use the `month()` function to be able to group by month and state. Additionally,\
    \ you can see that I add an `ungroup()` at the end. When we summarize on data\
    \ grouped by more than one variable, the summarized output is still grouped. In\
    \ this case, the warning message states that the data is still grouped by state.\n\
    \n```\nne_cases <- covidcases %>%\n  filter(state %in% c(\"Maine\", \"Vermont\"\
