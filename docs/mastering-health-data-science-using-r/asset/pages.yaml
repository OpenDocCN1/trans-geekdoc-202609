    # 14.2 Residuals, Discrimination, and Calibration


    Next, we look at the distribution of the residuals. The resid() function can be
    used to find the residuals again, but this time we might want to specify the Pearson
    and deviance residuals by specifying the type argument. We plot histograms for
    both of these residual types using the following code. In both plots, we can observe
    a multi-modal distribution, which reflects the binary nature of our outcome.


    ```

    par(mfrow=c(1,2))

    hist(resid(mod_start, type = "pearson"), main = "Pearson Residuals")

    hist(resid(mod_start, type = "deviance"), main = "Deviance Residuals")

    ```


