    #>  6511 175 33.0  71 Male\n#>  3452 113 31.4  38 Male\n```\n\nSome other measures\
    \ of influence are the DFBETAs and Cook’s distance, which measure how much each\
    \ observation influences the estimated coefficients and the estimated y values,\
