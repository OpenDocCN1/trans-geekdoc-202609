- pgno: 187
  md: "```\n#> 5 Irion\n3 12.9\n#> # i 5 more rows\n```\n\nSome of the counties are\
    \ so small that we may want to consider dropping them from our analysis. In particular,\
    \ among these small counties, the rates in Loving County and Terrell County are\
    \ high enough that we might consider them to be outliers. For this one-sample\
    \ analysis, however, we do not remove them. If we wanted to estimate the mean\
    \ abortion rate among counties \\(\\mu\\), we can do so by simply using the `mean()`\
    \ function. For reference, the Centers for Disease Control estimated the national\
    \ abortion rate in 2020 to be 11.2 abortions per 1,000 women aged 15–44 years\
    \ (Kortsmit 2023).\n\n```\nmean(county_rates_2021, na.rm = TRUE)\n#> [1] 5.17\n\
    ```\n\nWithin R we can also calculate a confidence interval for this mean. Recall\
    \ that a \\((1 - \\alpha)\\%\\) confidence interval for the mean is given by the\
    \ equation \\(\\hat{\\mu} \\pm z_{1-\\alpha/2} \\cdot \\frac{\\hat{\\sigma}}{\\\
    sqrt{n}}\\), where \\(\\hat{\\mu}\\) is our sample mean, \\(\\hat{\\sigma}^2\\\
    ) is the sample variance, and \\(n\\) is the number of observations.\n\nIn the\
    \ subsequent code chunk, we use this formula to calculate a 95% confidence interval\
    \ for the mean abortion rate among counties:\n\n```\nest_mean <- mean(county_rates_2021,\
    \ na.rm = TRUE)\nest_sd <- sd(county_rates_2021)\nz_alpha <- dnorm(1 - 0.05 /\
    \ 2)\nn <- length(county_rates_2021)\nc(est_mean - z_alpha * est_sd / sqrt(n),\n\
    \  est_mean + z_alpha * est_sd / sqrt(n))\n#> [1] 5.04 5.29\n```\n\nIf we want\
    \ to display this nicely, we can use the `round()` function, which allows us to\
    \ specify a number of digits to be displayed, and the `paste()` function, which\
    \ creates a single character string from multiple inputs.\n\n```\nlower <- round(est_mean\
