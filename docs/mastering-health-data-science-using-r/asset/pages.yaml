  md: "# 15\n\n# Model Selection\n\nIn Chapter 13 and Chapter 14, we included one\
    \ simple method for model selection, stepwise selection. This chapter expands\
    \ upon our model selection tools in R by focusing on regularized regression. The\
    \ two packages we cover are **glmnet** (Friedman, Tibshirani, and Hastie 2010)\
    \ and **L0Learn** (Hazimeh, Mazumder, and Nonet 2023). These two packages focus\
    \ on different types of model regularization.\n\n```\nlibrary(HDSinRdata)\nlibrary(tidyverse)\n\
    library(glmnet)\nlibrary(L0Learn)\n```\n\nTo demonstrate these packages, we use\
    \ the same motivating example as in Chapter 13. Recall, that the NHANESsample\
    \ dataset contains lead, blood pressure, BMI, smoking status, alcohol use, and\
    \ demographic variables from NHANES 1999-2018. Our focus is looking at the association\
    \ between blood lead levels and systolic blood pressure. We first create a single\
    \ systolic blood pressure by averaging across all measurements. We also transform\
    \ lead with a log transformation before dropping variables we want to exclude\
    \ from our analysis.\n\n```\n# load in data\ndata(NHANESsample)\n\n# transform\
    \ SBP and lead\nNHANESsample$SBP <-\n  rowMeans(NHANESsample[c(\"SBP1\", \"SBP2\"\
    , \"SBP3\", \"SBP4\")],\n           na.rm=TRUE)\n\nNHANESsample$LEAD <- log(NHANESsample$LEAD)\n\
    \n# remove variables not to include in the model\nnhanes <- NHANESsample %>%>\n\
    \  select(-c(ID, HYP, LEAD_QUANTILE, DBP1, DBP2, DBP3, DBP4,\n            SBP1,\
    \ SBP2, SBP3, SBP4, YEAR)) %>%>\n```"
