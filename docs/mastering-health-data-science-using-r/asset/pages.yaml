  md: '# 18.3 Debugging and Testing


    As we write more complex code and functions, we want to learn how to test our
    code. When it comes to testing code, a good mantra is “test early and test often”.
    So avoid writing too much code before running and checking that the results match
    what you expect. Here are some simple principles that are applicable to debugging
    in any setting.


    +   - Start simple and build up in steps.

    +   - Check your syntax by checking that all parentheses (), brackets [], and
    curly braces {} match where you expect.

    +   - Check that object names are correct and you don’t have any accidental typos
    or that you are accidentally using the same name for different objects.

    +   - Restart your R session and re-run all code.

    +   - Check if you use the same object name for different objects.

    +   - Localize your error by printing out the values of objects at each stage
    or use break points in R.

    +   - Modify your code one piece at a time and check all test values again to
    avoid introducing new errors.


    For example, suppose we want to write a function that finds any pairs of numeric
    columns with a Pearson correlation with absolute value above a certain threshold.
    We want our code to be structured so that it makes sense, is flexible to our needs,
    and avoids unnecessary work. To start building up this function, we need to first
    think about the inputs and outputs we want. This is called a _top-down approach_.
    Sketching out the overall steps your code needs to complete before writing any
    of them can help to improve your structure and avoid having to rewrite large pieces.


    In this case, our input to this function is a data frame which could contain a
    mixture of numeric and categorical columns and a threshold correlation value with
    a default value of 0.6. We want to return a data frame with the pairs and their
    correlation. This gives us a template for our documentation.


    ```

    #'' Find pairs of columns with strong correlation

    #''

    #'' @description Finds all pairs of numeric columns with strong Pearson

    #'' correlation and returns the pairs in a data frame

    #''

    #'' @param df data frame

    #'' @param threshold positive numeric threshold value to define a

    #'' strong correlation as one with absolute value above the threshold

    #'' @return data frame with one row for each pair of columns

    #'' with high correlation containing the names of the columns

    ```'
  merge: -1
  img_proc: true
