  md: '# 4.3 Autogenerated Plots


    time, such as the ggpairs() function. The function ggpairs() takes the data as
    its first argument. By default, it plots the pairwise distributions for all columns,
    but we can also specify to only select a subset of columns using the columns argument.
    You can see in the following example that it plots barplots and density plots
    for each univariate sample distribution. It then plots the bivariate distributions
    and calculates the Pearson correlation for all pairs of continuous columns. That''s
    a lot of information!


    ```

    ggpairs(nhanes_df, columns = c("SEX", "AGE", "LEAD", "SBP1", "DBP1"))

    ```


    ![](img/58a554e865d49ca347d9a3f76f8f0812_89_0.png)


    Another useful function in this package is the ggcorr() function. This function
    takes in a data frame with only numeric columns and displays the correlation between
    all pairs of columns, where the color of each grid cell indicates the strength
    of the correlation. The additional argument label=TRUE prints the actual correlation
    value on each grid cell. This is a useful way to identify pairs of strongly correlated
    columns. Note that we used the pipe operator again to find the correlation on
    the continuous columns without saving this subset of data.


    ```

    nhanes_df[, c("AGE", "LEAD", "SBP1", "DBP1")] |>

    ggcorr(label = TRUE)

    ```'
