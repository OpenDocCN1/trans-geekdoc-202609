- pgno: 203
  md: "# Case Study: Analyzing Blood Lead Level and Hypertension\n\nFor this chapter,\
    \ we use the NHANESsample dataset seen in Chapter 4. The sample contains lead,\
    \ blood pressure, BMI, smoking status, alcohol use, and demographic variables\
    \ from NHANES 1999-2018. Variable selection and feature engineering were conducted\
    \ to replicate the pre-processing conducted by Huang (2022). We further replicate\
    \ the regression analysis by Huang (2022) in Chapter 13. Use the help operator\
    \ ?NHANESsample to read the variable descriptions. Note that we ignore survey\
    \ weights for this analysis.\n\n```\nlibrary(HDSinRdata)\nlibrary(tidyverse)\n\
    library(gt)\nlibrary(gtsummary)\n\ndata(\"NHANESsample\")\n```\n\nOur analysis\
    \ focuses on using hypothesis testing to look at the association between hypertension\
    \ and blood lead levels by sex. We first select some demographic and clinical\
    \ variables that we believe may be relevant, including age, sex, race, body mass\
    \ index, and smoking status. We do a complete case analysis and drop any observations\
    \ with missing data.\n\n```\nNHANESsample <- NHANESsample %>%\n  select(\"AGE\"\
    , \"SEX\", \"RACE\", \"SMOKE\", \"LEAD\", \"BMI_CAT\",\n         \"HYP\", \"ALC\"\
    ) %>%\n  na.omit()\n```\n\nWe begin with a summary table stratified by hypertension\
    \ status. As expected, we see statistically significant differences between the\
    \ two groups across all included variables. We also observe higher blood lead\
    \ levels and a higher proportion of male participants for those with hypertension."
  merge: -1
  img_proc: true
