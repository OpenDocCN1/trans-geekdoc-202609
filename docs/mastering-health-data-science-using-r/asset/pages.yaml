    \ second `v` always has length n.\n\n```\n```r\nrw1 <- function(n){\n  v <- c(0)\n\
    \  for (i in 2:n){\n    v[i] <- v[i-1] + rbinom(1, 1, 0.5)\n  }\n  return(v)\n\
    }\n```\n```"
