  md: '# ## 2.5.1 Indexing a Data Frame


    We can select elements of the data frame using its indices in the same way as
    we did with matrices. In the subsequent code, we access a single value and then
    a subset of our data frame. The subset returned is itself a data frame. Note that
    the second line returns a data frame.


