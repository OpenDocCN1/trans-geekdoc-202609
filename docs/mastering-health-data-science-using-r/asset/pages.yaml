    # 10.2 Empirical Distributions and Sampling Data


    At the start of this chapter, we used the `sample()` function. This function can
    also be used to sample from an empirical distribution. The `sample(x, size, replace=FALSE,
    prob=NULL)` function takes in the values we want to sample from x, the number
    of observations we want to sample size, and whether we want to sample with replacement
    replace. If we don’t want to sample such that each value has an equal probability
    of being chosen, we can also set a probability vector prob, which must have the
    same length as x. In the following code, we sample 500 rows without replacement
    from the NHANESsample data. To do so, we select 500 values from the indices 1
    to the number of rows in the data. We then select rows of the data using these
    indices.


    ```

    nhanes_sample_ids <- sample(1:nrow(NHANESsample), 500, replace = FALSE)

    nhanes_sample <- NHANESsample[nhanes_sample_ids, ]

    dim(nhanes_sample)

    #> [1] 500 21

    ```


    We now demonstrate sampling with replacement. By doing so, we create a new dataset
    that is sampled from the empirical distribution of the data and that is called
    a *bootstrap sample*.


    ```

    nhanes_sample_ids <- sample(1:nrow(NHANESsample), nrow(NHANESsample), replace
    = TRUE)

    nhanes_sample <- NHANESsample[nhanes_sample_ids, ]

    dim(nhanes_sample)

    #> [1] 31265 21

    ```'
  merge: -1
  img_proc: true
