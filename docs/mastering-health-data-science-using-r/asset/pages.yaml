  md: "# 13.3.1 Normality\n\nBeyond the default plots, we can also plot a histogram\
    \ of the residuals and a qq-plot. The qqnorm() and qqline() functions can take\
    \ in the residuals from our model as an argument. The latter adds the theoretical\
    \ red line for reference. As both the histogram and qq-plot show, the residuals\
    \ are positively skewed, and thus the assumption of normality is not satisfied\
    \ for our residuals. Later in this chapter, we discuss how we might transform\
    \ this dataset and/or model to satisfy this assumption.\n\n```\npar(mfrow = c(1,\
    \ 2)) # plot next to each other\nhist(resid(adj_model), xlab = \"Residuals\",\n\
    \     main = \"Histogram of Residuals\")\nqqnorm(resid(adj_model))\nqqline(resid(adj_model),\
    \ col = \"red\")\n```\n\n![](img/58a554e865d49ca347d9a3f76f8f0812_220_0.png)\n\
    \nInstead of using the direct residuals, we can also find the standardized residuals\
    \ with the function rstandard(). The standardized residuals are the raw residuals\
    \ divided by an estimate of the standard deviation for the residual, which is\
    \ different for each observation.\n\n```\npar(mfrow = c(1, 2))\nhist(rstandard(adj_model),\
    \ xlab = \"Standardized Residuals\",\n     main = \"Histogram of Standardized\
    \ Residuals\",\n     cex.main = 0.65)\nqqnorm(rstandard(adj_model), cex.main =\
    \ 0.65)\nqqline(rstandard(adj_model), col = \"red\")\n```"
