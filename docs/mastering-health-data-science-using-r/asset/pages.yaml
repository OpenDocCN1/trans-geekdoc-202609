    ![](img/58a554e865d49ca347d9a3f76f8f0812_177_0.png)


    # 10.1.2 Density Function


    Next, we look at the density function. Recall that the probability density function
    for a normal distribution with mean \(\mu\) and standard deviation \(\sigma\)
    is given by the following formula.


    \(f_X(x) = \frac{1}{\sigma\sqrt{2\pi}} \exp \left( -\frac{1}{2} \left( \frac{x-\mu}{\sigma}
    \right)^2 \right)\)


    Using the following code, we can compare some of the values from the `dnorm()`
    function to this equation and see that they are in fact equal. We could also specify
    the mean and standard deviation in this function but choose to use the default
    values (mean = 0 and sd = 1).


    ```

    dnorm(0) == 1/sqrt(2*pi)

    #> [1] TRUE

    dnorm(1) == exp(-1/2)/sqrt(2*pi)

    #> [1] TRUE

    dnorm(2) == exp(-1/2*2^2)/sqrt(2*pi)

    #> [1] TRUE

    ```


    If we wanted to find the density function for several values, we can input a vector
    to this density function. In the following code, we find the values of the density
    function for a normal distribution with mean 1 and standard deviation 2 for values
    c(-1, 0, 1, 2, 3).'
  merge: -1
  img_proc: true
