- pgno: 235
  md: '# Logistic Regression


    This chapter builds on the previous chapter and continues with regression analysis
    in R. Specifically, we cover binary logistic regression using the glm() function,
    which can be used to fit generalized linear models. Many of the functions learned
    in the last chapter can also be used with a glm object. For example, the glm()
    function expects a formula in the same way as the lm() function. We also cover
    diagnostic plots and model evaluation specific to a binary outcome.


    The data used in this chapter is from the 2021 National Youth Tobacco Survey (NYTS)
    (Centers for Disease Control and Prevention (CDC) 2021). This dataset contains
    20,413 participants and a set of variables relating to demographic information,
    frequency of tobacco use, and methods of obtaining said tobacco as reported by
    students on the 2021 NYTS. We use logistic regression to examine whether survey
    setting is associated with youth reporting of current tobacco use, similar to
    the analysis presented in Park-Lee et al. (2023). Note that we ignore survey weights
    for this analysis.


    We use the broom package again to present the estimated coefficients, the tidyverse
    package to create a calibration plot, the lmtest (Hothorn et al. 2022) package
    to perform likelihood ratio tests, and the pROC package (Robin et al. 2023) to
    create receiver operating characteristic curves.


    ```

    library(broom)

    library(tidyverse)

    library(pROC)

    library(lmtest)

    library(HDSinRdata)

    data(nyts)

    ```'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 14.1 Generalized Linear Models in R


    The glm(formula, data, family) function in R is used to fit generalized linear
    models. The three main arguments we must specify to the function are:


    +   • formula - the relationship between the independent variables and the outcome
    of interest,

    +   • data - the dataset used to train the model, and

    +   • family - a description of the error distribution and link function to be
    used in the model.


    In binary logistic regression, we assume a binomial outcome and use the logit
    link function. We can specify this by setting family = binomial. By default, this
    assumes the link function is the logit function. Note that we can even use the
    glm() function to implement linear regression by setting family = gaussian. Using
    our example from Chapter 13, running glm(SBP ~ LEAD, data = nhanes_df, family
    = gaussian) would be equivalent to lm(SBP ~ LEAD, data = nhanes_df).


    Our outcome of interest is current e-cigarette use, e_cig_use, so we need to create
    this variable from the variables that are currently in the data. We set e_cig_use
    to 0 if the respondent answered that they have not used e-cigarettes in the last
    30 days and 1 otherwise. We can see that there are only 1,435 respondents who
    reported e-cigarette use. This is a low percentage of the overall sample, which
    will likely impact our results.


    ```

    nyts$e_cig_use <- as.factor(ifelse(nyts$num_e_cigs == 0, "0", "1"))

    table(nyts$e_cig_use)

    #>

    #>   0   1

    #> 18683 1435

    ```


    Looking at the covariate of interest, survey setting, we can see that there are
    85 respondents who took the survey in “Some other place”. Since we are interested
    in the impact of taking the survey at school compared to other settings, we simplify
    this variable to have two levels: “school” and “home/other”.


    ```

    table(nyts$location)

    #>

    #>             At home (virtual learning) In a school building/classroom

    #>                    8738                    10737

    ```'
  merge: -1
  img_proc: true
- pgno: 237
  md: "```\n```r\n#>                 Some other place\n#>                        \
