    # 2.4 Matrices


    Matrices are similar to vectors in that they store data of the same type. However,
    matrices are two-dimensional consisting of both rows and columns (see Figure 2.3),
    as opposed to one-dimensional vectors.


    ![](img/58a554e865d49ca347d9a3f76f8f0812_38_0.png)


    **Figure 2.3:** Matrix Example.


    In the following code, we create a matrix reporting the daily rainfall over multiple
    weeks. We can create a matrix using the matrix(data, nrow, ncol, byrow) function.
    This creates a nrow by ncol matrix from the vector data values filling in by row
    if byrow is TRUE and by column otherwise. Run the code. Then, change the last
    argument to byrow=FALSE and see what happens to the values.


    ```

    rainfall <- matrix(c(5, 6, 0.1, 3, 0, 1, 0, 1, 0.4, 0.2,

    0.5, 0.3, 0, 0),

    ncol=7, nrow=2, byrow=TRUE)

    rainfall

    #>   [,1] [,2] [,3] [,4] [,5] [,6] [,7]

    ```'
