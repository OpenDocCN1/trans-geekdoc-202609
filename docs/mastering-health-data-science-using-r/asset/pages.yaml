    # 21.4 General Programming Tips


    As you write more complex code and functions, we want to focus on practicing good
    programming principles. This helps when you need to share or update your code
    or when you inevitably run into errors or unexpected behavior. Following are some
    general programming tips and how they relate to communication and debugging.


    +   1. Consistent Naming. Use consistent and informative names for your objects
    and functions. For example, you can see that within this text we have only used
    lowercase letters, underscores (_), and occasionally numbers in our names. These
    names should also be informative and unique. This makes it easier to check for
    typos or duplicate names when debugging. When debugging, check that you haven''t
    used the same name for different objects or different names for the same object.
    You can do this by using the ls() function to find all current objects or by checking
    your environment pane.


    ```

    # Recommended

    ages <- c(65, 33, 27, 88)

    age_mean <- mean(ages)


    # Not recommended

    x <- c(65, 33, 27, 88)

    x1 <- mean(ages)

    ```'
