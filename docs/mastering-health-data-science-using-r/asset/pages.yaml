  md: '```

    #> Min. 1st Qu. Median Mean 3rd Qu. Max.

    #> 1999 2003 2007 2008 2011 2017

    ```


    We decide to select the most recent observations from NHANES 2017-2018 for our
    analysis in this chapter. We use the subset() function to select these rows.


    ```

    nhanes_df <- subset(nhanes_df, nhanes_df$YEAR == 2017)

    ```


    As shown, smoking status has been coded into three categories: “NeverSmoke”, “QuitSmoke”,
    and “StillSmoke”. We want to create a new column to represent whether someone
    has ever smoked. To do so, we use the ifelse() function, which allows us to create
    a new vector using logic. The logic captured by this function is that we want
    to use one value if we meet some condition, and we want to use a second value
    if the condition is not met. The first argument is a vector of TRUE/FALSE values
    representing the conditions, the next argument is the value or vector to use if
    we meet the condition(s), and the last argument is the value or vector to use
    otherwise. We use this function to create a new vector EVER_SMOKE that is equal
    to “Yes” for those who are either still smoking or quit smoking and equal to “No”
    otherwise.


    ```

    nhanes_df$EVER_SMOKE <- ifelse(nhanes_df$SMOKE %in% c("QuitSmoke",

    "StillSmoke"),

    "Yes", "No"))

    table(nhanes_df$EVER_SMOKE)

    #>

    #> No Yes

    #> 1411 1173

    ```


    If we did not want to store this new column, we could use the pipe operator |>
    to send the output directly to the table() function. The pipe operator takes the
    result on the left-hand side and passes it as the first argument to the function
    on the right-hand side.


    ```

    ifelse(nhanes_df$SMOKE %in% c("QuitSmoke", "StillSmoke"),

    "Yes", "No") |>

    table()

    #>

    #> No Yes

    #> 1411 1173

    ```'
