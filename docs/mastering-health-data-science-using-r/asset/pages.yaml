  md: "# ## 2.3 Factors\n\nA factor is a special kind of vector that behaves like\
    \ a regular vector except that it represents values from a category. In particular,\
    \ a factor keeps track of all possible values of that category, which are called\
    \ the levels of the factor. Factors are especially helpful when we start getting\
    \ into data analysis and have categorical columns. The `as.factor()` function\
    \ converts a vector to a factor.\n\n```\n```r\ndays <- c(\"Monday\", \"Tuesday\"\
    , \"Wednesday\", \"Monday\",\n          \"Thursday\", \"Wednesday\")\ndays_fct\
    \ <- as.factor(days)\n\nclass(days_fct)\n#> [1] \"factor\"\nlevels(days_fct)\n\
    #> [1] \"Monday\"    \"Thursday\"  \"Tuesday\"   \"Wednesday\"\n```\n```\n\nIn\
    \ the previous example, we did not specify the possible levels for our column.\
    \ Instead, R found all values in the vector days and set these equal to the levels\
    \ of the factor. Because of this, if we try to change one of the levels to “Friday”,\
    \ we get an error. Uncomment the following line to see the error message.\n\n\
    ```\n```r\n#days_fct[2] <- \"Friday\"\n```\n```\n\nWe can avoid this error by\
    \ specifying the levels using the `factor()` function instead of the `as.factor()`\
    \ function.\n\n```\n```r\ndays <- c(\"Monday\", \"Tuesday\", \"Wednesday\", \"\
    Monday\", \"Thursday\",\n          \"Wednesday\")\ndays_fct <- factor(days,\n\
    \                  levels = c(\"Monday\", \"Tuesday\", \"Wednesday\",\n      \
    \                       \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\"))\n\
    \nclass(days_fct)\n#> [1] \"factor\"\nlevels(days_fct)\n#> [1] \"Monday\"    \"\
    Tuesday\"   \"Wednesday\" \"Thursday\"  \"Friday\"\n#> [6] \"Saturday\"  \"Sunday\"\
    \ndays_fct[2] <- \"Friday\"\n```\n```"
  merge: -1
  img_proc: true
