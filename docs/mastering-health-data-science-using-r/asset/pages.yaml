    After coding these columns as dates, we can access information such as the day,
    month, year, or week from them. These functions are all available in the **lubridate**
    package (Spinú, Grolemund, and Wickham 2023), which is a package in the **tidyverse**
    that allows us to manipulate dates.


    ```

    month(mobility$date[1])

    #> [1] 3

    week(mobility$date[1])

    #> [1] 9

    ```


    Next, we add a date column to covidcases. In this case, we need to use the week
    number to find the date. Luckily, we can add days, months, weeks, or years to
    dates using the **lubridate** package. January 1, 2020 was a Wednesday and is
    counted as the first week; so to find the corresponding Sunday for each week,
    we add the recorded week number minus 1 to December 29, 2019 (the last Sunday
    before 2020). We show a simple example of adding one week to this date before
    doing this conversion for the entire column.


    ```

    as.Date("2019-12-29") + weeks(1)

    #> [1] "2020-01-05"

    ```


    ```

    covidcases$date <- as.Date("2019-12-29") + weeks(covidcases$week - 1)

