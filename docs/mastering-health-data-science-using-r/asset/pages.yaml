  md: '# # Data Structures in R


    In this chapter, we demonstrate the key **data structures** in R. Data structures
    are how information is stored in R and refer to the types of objects we can create
    in R. The data structures that we use inform R how to interpret our code. Any
    **object** is a named instance of a data structure. For example, the object `ex_num`
    is a vector of numeric type.


    ```

    ex_num <- 4

    ```


    The main data structures in R are **vectors**, **factors**, **matrices**, **arrays**,
    **lists**, and **data frames**. These structures are distinguished by their dimensions
    and by the type of data they store. For example, we might have a one-dimensional
    vector that contains all numeric values, or we could have a two-dimensional data
    frame with rows and columns where we might have one numeric column and one character
    column. In Figure 2.1, there are two vectors with different types (character and
    numeric) on top, followed by a matrix and data frame below. In this chapter, we
    cover each data structure except for arrays. Arrays are an extension of matrices
    that allow for data that is more than two-dimensional and are not needed for the
    applications covered in this book.


    # ## 2.1 Data Types


    Each individual value in R has a type: **logical**, **integer**, **double**, or
    **character**. We can think of these as the building blocks of all data structures.
    We use the `typeof()` function to find the type of our vector `ex_num`, which
    shows that the value of `ex_num` is a **double**. A double is a numeric value
    with a stored decimal.


    ```

    typeof(ex_num)

    #> [1] "double"

    ```


    On the other hand, an **integer** is a whole number that does not contain a'
