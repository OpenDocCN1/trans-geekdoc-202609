  md: 'You can also add links [text](www.example.com) and images ![alt text](#fig-label
    image.png). In the latter example, fig-label becomes the label of the image we
    can use to cross-reference it, while image.png is the image file name (see Figure
    22.5).


    Example link.²


    ![](img/58a554e865d49ca347d9a3f76f8f0812_357_1.png)


    **Figure 22.5:** Example Image.


    The Markdown Guide³ has a great cheat sheet⁴ as well as more resources for formatting
    Markdown text.


    You can also have inline R code by using single backticks around your code `{r}
    max(c(1,2,3))`. The code must start with r to be run when knit. This allows you
    to reference variables in your text. For example, we could display the variance
    of a column in our data without having to copy the value over `{r} round(var(cars$speed),2)`.


    # 22.3 Formatting Figures and Tables


    Often, you’ll want to include figures generated by your code in your report, and
    you can customize these figures by changing the chunk options for the chunks that
    produce them. To change the size of a figure, you can add in the chunk option
    `fig-width: 3` with your desired size in inches. To add a nice caption to a figure
    in your report, you can add `fig-cap : ''Your Desired Caption.''` option. To name
    a figure, you want to start your label with `fig-` such as `fig-myfigure`.


    By default, the figures generated by your code chunks are allowed to ‘float’ in
    Quarto. This means that the figures might move away from where they were coded
    or referenced in the final report. To prevent this behavior, you can


