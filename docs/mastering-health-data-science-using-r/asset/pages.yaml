  md: '# 17 Logic and Loops


    Now that we have seen a lot of the functionality of R, we can start to build up
    more structured code using programming structures. To start, we introduce *control
    flows*. Control flows are code blocks that determine a sequence of code to be
    run. The two types of control flows we introduce are if-else blocks and loops.


    ```

    ```r

    library(HDSinRdata)

    library(tidyverse)

    ```

    ```


    # 17.1 Logic and Conditional Expressions


    You may recall that we introduced logical operators in Chapter 3. We used these
    operators through conditional expressions such as when we indexed a data frame
    or the `ifelse()` or `casewhen()` functions. For example, in the following code
    we have vectors of systolic and diastolic blood pressure measurements, and we
    write a logical operator to check if at least one of the systolic measurements
    is above 140 or if at least one of the diastolic measurements is above 90.


    ```

    ```r

    sbp_measurements <- c(131, 110, 125, 145, NA, 130)

    dbp_measurements <- c(70, NA, 80)

    any(sbp_measurements > 140, na.rm = TRUE) |

    any(dbp_measurements > 90, na.rm = TRUE)

    #> [1] TRUE

    ```

    ```


    Let''s look at another example. Suppose these blood pressure measurements were
    taken consecutively but may have missing values. We want to create a single value
    to summarize the blood pressure for the patient. If we only have one blood pressure
    reading, then we use that value. However, if there is more than one blood pressure
    reading, then we drop the first observation and average the rest. We assume that
    not all values are NA. The following'
  merge: -1
  img_proc: true
- pgno: 280
  md: "code uses an ifelse() function to do this by first checking if there is a single\
    \ reading. If so, it takes the sum removing NA values to find that value. If not,\
    \ we find all non-NA values and remove the first one before averaging.\n\n```\n\
    sbp_measurements <- c(131, 110, 125, 145, NA, 130)\nifelse(sum(!is.na(sbp_measurements))\
    \ == 1,\n       sum(sbp_measurements, na.rm = TRUE),\n       mean(sbp_measurements[!is.na(sbp_measurements)][-1]))\n\
    #> [1] 128\n```\n\nWe could also accomplish the same thing using a control flow\
    \ called an if-else statement. An if-else statement follows the following structure.\
    \ First, we have a conditional statement. If the conditional statement is true,\
    \ then the code in the if statement, the code within the first set of curly braces,\
    \ is run. If not, then the code in the else statement is run. In this way, the\
    \ control flow controls how our code is executed.\n\n```\nif (conditional statement){\n\
    block of code if the statement is TRUE\n} else{\nblock of code if the statement\
    \ is FALSE\n}\n```\n\nThe next code chunk shows an example where the conditional\
    \ statement is the same as previously. Note that since either the code in the\
    \ if or else statement is run, the object avg_val is always defined.\n\n```\n\
    sbp_measurements <- c(131, 110, 125, 145, NA, 130)\nif(sum(!is.na(sbp_measurements))\
    \ == 1){\n  avg_val <- sum(sbp_measurements, na.rm = TRUE)\n} else{\n  avg_val\
    \ <- mean(sbp_measurements[!is.na(sbp_measurements)][-1])\n}\navg_val\n#> [1]\
    \ 128\n```\n\nOne of the things to notice is that an if statement can only take\
    \ in a single Boolean. It cannot take in a vector of Boolean values like the ifelse()\
    \ and case_when() functions can. In that way, the ifelse() function is useful\
    \ because it can be applied to multiple instances, but it isn't as flexible if\
    \ you want to run multiple lines of code depending on the logical statement since\
    \ it doesn't allow you to include a code block.\n\nLet's do another example of\
    \ both an if-else statement and the ifelse() function to demonstrate this. In\
    \ the following code, we use an if-else statement to"
  merge: -1
  img_proc: true
- pgno: 281
  md: "determine if someone has hypertension. Note that here we have two lines of\
    \ code that are run in each part: one line is printing the result and the other\
    \ is storing a 0/1 value. Try changing the values of sbp and dbp.\n\n```\n```r\n\
    sbp <- 130\ndbp <- 80\nif(sbp > 140 | dbp > 90){\n  print(\"Hypertension\")\n\
    \  hyp <- 1\n} else{\n  print(\"No Hypertension\")\n  hyp <- 0\n}\n#> [1] \"No\
    \ Hypertension\"\nhyp\n#> [1] 0\n```\n```\n\nNow let’s replicate this with the\
    \ `ifelse()` function which allows us to take in paired vectors of blood pressure\
    \ measurements and return a vector of 0/1 values for each observation. The difference\
    \ here is that we cannot include a print statement since we are only allowed one\
    \ return value.\n\n```\n```r\nsbp_measurements <- c(131, 110, 125, 145, 130)\n\
    dbp_measurements <- c(90, 75, 80, 90, 80)\nhyp <- ifelse(sbp_measurements > 140\
    \ | dbp_measurements > 90, 1, 0)\nhyp\n#> [1] 0 0 0 1 0\n```\n```\n\nNote that\
    \ in the previous code we ignored NA values. In this case, changing sbp or dbp\
    \ to NA causes an error in the if-else statement. This is because it does not\
    \ understand which code block to run. The `ifelse()` can handle NA values and\
    \ returns NA for observations with no TRUE/FALSE value. To accomplish this with\
    \ the if-else statement, we can add in multiple conditions. In particular, we\
    \ can add in more statements as follows. In this case, the first time we reach\
    \ a true conditional statement, we run the code in that block. If no statements\
    \ are true, then we run the last block of code. So we always run exactly one block\
    \ of code.\n\n```\n```r\nif (conditional statement A){\n  block of code if the\
    \ statement A is TRUE\n} else if (conditional statement B){\n  block of code if\
    \ the statement B is TRUE and statement A is FALSE\n} else if (conditional statement\
    \ C){\n  block of code if the statement C is TRUE and statement A and B are FALSE\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 282
  md: "```\n```text\n} else{\nblock of code if statements A, B, and C are all FALSE\n\
    }\n```\n```\n\nLet’s use this with our hypertension example. In this case, we\
    \ want to return NA if the answer is not known. Change the values so that you\
    \ reach each code block. The order of the conditions matters because if the first\
    \ statement is false, then we know at least one value is not NA. This also means\
    \ that we would only check the fourth condition if the first three are false,\
    \ which means that neither of the values can be NA.\n\n```\n```r\nsbp <- 130\n\
    dbp <- 80\nif(is.na(sbp) & is.na(dbp)){\n    # Both are NA\n    hyp <- NA\n} else\
    \ if ((is.na(sbp) & dbp <= 90) | (is.na(dbp) & sbp <= 140)){\n    # One is NA\
    \ and the other is below the threshold\n    hyp <- \"Inconclusive\"\n} else if\
    \ ((is.na(sbp) & dbp > 90) | (is.na(dbp) & sbp > 140)){\n    # One is NA and the\
    \ other is above the threshold\n    hyp <- \"Hypertension\"\n} else if (dbp >\
    \ 90 | sbp > 140){\n    # Neither are NA and at least one is above the threshold\n\
    \    hyp <- \"Hypertension\"\n} else{\n    # Neither are NA and neither is above\
    \ the threshold\n    hyp <- \"No Hypertension\"\n}\nhyp\n#> [1] ”No Hypertension”\n\
    ```\n```\n\nWe can rearrange these conditions to have one less condition. In the\
    \ following code chunk, we first check if both are NA. Then we check that at least\
    \ one value is above the threshold. This statement uses the fact that both can’t\
    \ be NA since the first condition must be false. Next, in the third statement,\
    \ if at least one value is NA, then that must mean the other is below the threshold,\
    \ so the result is inconclusive.\n\n```\n```r\nsbp <- 130\ndbp <- 80\nif(is.na(sbp)\
    \ & is.na(dbp)){\n    # Both are NA\n    hyp <- NA\n```\n```"
