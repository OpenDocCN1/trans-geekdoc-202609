    # 2.2.1 Indexing a Vector


    Once we have a vector, we may want to access certain values stored in that vector.
    To do so, we index the vector using the position of each value: the first value
    in the vector has index 1, the second value has index 2, etc. When we say a vector
    is one-dimensional, we mean that we can define the position of each value by a
    single index. To index the vector, we then use square brackets [] after the vector
    name and provide the position. We use these indices to find the value at index
    1 and the value at index 4.


    ```

    days[1]

    #> [1] "Monday"

    days[4]

    #> [1] "Thursday"

    ```


    We can either access a single value or a subset of values using a vector of indices.
    Let’s see what happens when we use a vector of indices c(1,4) and then try using
    -c(1,4) and see what happens. In the first case, we get the values at index 1
    and at index 4. In the second case, we get all values except at those indices.
    The - indicates that we want to remove rather than select these indices.


    ```

    days[c(1, 4)]

    #> [1] "Monday" "Thursday"

    days[-c(1, 4)]

    #> [1] "Tuesday" "Wednesday" "Friday"

    ```


    However, always indexing by the index value can sometimes be difficult or inefficient.
    One extra feature of vectors is that we can associate a name with each value.
    In the subsequent code, we update the names of the vector rain to be the days
    of the week and then find Friday’s rain count by indexing with the name.


    ```

    names(rain) <- days

    print(rain)

    #> Monday Tuesday Wednesday Thursday Friday

    ```'
