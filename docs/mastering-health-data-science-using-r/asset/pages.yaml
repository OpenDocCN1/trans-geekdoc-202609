- pgno: 240
  md: "To further evaluate the fit of our model, we may want to observe the predicted\
    \ probabilities. The `predict()` function by default returns the predicted value\
    \ on the scale of the linear predictors. In this case, that is the predicted log\
    \ odds. If we want to find the predicted probabilities, we can update the argument\
    \ by specifying `type=\"response\"`. Additionally, we can predict on data not\
    \ used to train the model by using the argument `newdata`. Note that there are\
    \ only 18,747 predicted probabilities despite our training data having more observations.\
    \ This is because the `glm()` function (and `lm()` function) drop any observations\
    \ with NA values when training. In the last chapter, we omitted incomplete cases\
    \ prior to analysis so that the predicted probabilities corresponded directly\
    \ to the rows in our data.\n\n```\n```r\npred_probs <- predict(mod_start, type\
    \ = \"response\")\nlength(pred_probs)\n#> [1] 18747\n```\n```\n\nIf we want to\
    \ find the class for each observation used in fitting the model, we can use the\
    \ model’s output, which stores the model matrix x and the outcome vector y. We\
    \ plot the distribution of estimated probabilities for each class. Note that all\
    \ the predicted probabilities are below 0.5, the typical cut-off for prediction.\
    \ This is in part due to the fact that we have such an imbalanced outcome.\n\n\
    ```\n```r\nggplot() +\n  geom_histogram(aes(x = pred_probs, fill = as.factor(mod_start$y)),\n\
    \                 bins = 30) +\n  scale_fill_discrete(name = \"E-Cig Use\") +\n\
    \  labs(x = \"Predicted Probabilities\", y = \"Count\")\n```\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "![](img/58a554e865d49ca347d9a3f76f8f0812_241_0.png)\n\n# 14.2.1 Receiver Operating\
    \ Characteristic Curve\n\nWe now plot the receiver operating characteristic (ROC)\
    \ curve and compute the area under the curve (AUC). The roc() function from the\
    \ pROC package builds a ROC curve. The function has several ways to specify a\
    \ response and predictor. For example, we can specify the response vector response\
    \ and predictor vector predictor. By default, with a 0/1 outcome, the roc() function\
    \ assumes class 0 is controls and class 1 is cases. We can also specify this in\
    \ the levels argument to set the value of the response for controls and cases,\
    \ respectively. Additionally, the function assumes the predictor vector specifies\
    \ predicted probabilities for the class 1. We can change the argument direction\
    \ = \">\" if the opposite is true. We can plot the ROC curve by calling the plot()\
    \ function. We can add some extra information by adding the AUC (print.auc = TRUE)\
    \ and the threshold that maximizes sensitivity + specificity (print.thres = TRUE).\n\
    \n```\nroc_mod <- roc(predictor = pred_probs,\n   response = as.factor(mod_start$y),\n\
    \   levels = c(0,1), direction = \"<\")\nplot(roc_mod, print.auc = TRUE, print.thres\
    \ = TRUE)\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: '![](img/58a554e865d49ca347d9a3f76f8f0812_242_0.png)


    If we want to understand more about the curve, we can use the coords() function
    to find the coordinates for each threshold used to create the curve. The argument
    x = "all" specifies that we want to find all thresholds, but we could also specify
    only to return local maxima.


    ```

    roc_vals <- coords(roc = roc_mod, x = "all")

    head(roc_vals)

    #>  threshold specificity sensitivity

    #> 1      -Inf    0.00000    1.000

    #> 2   0.00569    0.00523    1.000

    #> 3   0.00713    0.01070    1.000

    #> 4   0.00850    0.01547    0.999

    #> 5   0.00934    0.01835    0.998

    #> 6   0.00982    0.02404    0.996

    ```


    For example, we could use this information to find the highest threshold with
    a corresponding sensitivity above 0.75. This returns a threshold of 0.062. If
    we were to predict class 1 for all observations with a predicted probability above
    0.062, then we would achieve a sensitivity of 0.77 and specificity of 0.56 on
    the training data.


    ```

    roc_vals[roc_vals$sensitivity > 0.75, ] %>% tail(n = 1)

    #>  threshold specificity sensitivity

    #> 63    0.062    0.555    0.768

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: "We use the threshold of 0.080 indicated on our ROC curve to create predicted\
    \ classes for our response. By comparing the result to our outcome using the `table()`\
    \ function, we can directly calculate measures like sensitivity, specificity,\
    \ positive and negative predictive values, and overall accuracy.\n\n```\n```r\n\
    pred_ys <- ifelse(pred_probs > 0.08, 1, 0)\ntab_outcome <- table(mod_start$y,\
    \ pred_ys)\ntab_outcome\n#>     pred_ys\n#>          0    1\n#> 0 11992  5395\n\
    #> 1   455   905\n```\n```\n\n```\n```r\nsens <- tab_outcome[2, 2]/(tab_outcome[2,\
    \ 1]+tab_outcome[2, 2])\nspec <- tab_outcome[1, 1]/(tab_outcome[1, 1]+tab_outcome[1,\
    \ 2])\nppv <- tab_outcome[2, 2]/(tab_outcome[1, 2]+tab_outcome[2, 2])\nnpv <-\
    \ tab_outcome[1, 1]/(tab_outcome[1, 1]+tab_outcome[2, 1])\nacc <- (tab_outcome[1,\
    \ 1]+tab_outcome[2, 2])/sum(tab_outcome)\n```\n```\n\n```\n```r\ndata.frame(Measures\
    \ = c(\"Sens\", \"Spec\", \"PPV\", \"NPV\", \"Acc\"),\n           Values = round(c(sens,\
    \ spec, ppv, npv, acc),3))\n#>   Measures Values\n#> 1     Sens  0.665\n#> 2 \
    \    Spec  0.690\n#> 3      PPV  0.144\n#> 4      NPV  0.963\n#> 5      Acc  0.688\n\
    ```\n```\n\n# 14.2.2 Calibration Plot\n\nAnother useful plot is a calibration\
    \ plot. This type of plot groups the data by the estimated probabilities and compares\
    \ the mean probability with the observed proportion of observations in class 1.\
    \ It visualizes how close our estimated distribution and true distribution are\
    \ to each other. There are several packages that can create calibration plots,\
    \ but we demonstrate how to do this using the **ggplot2** package. First, we create\
    \ a data frame with the predicted probabilities and the outcome variable. Additionally,\
    \ we group this data into `num_cuts` groups based on the predicted probabilities\
    \ using the `cut()` function. Within each group, we find the model’s predicted\
    \ mean along with the observed proportion and estimated standard errors."
  merge: -1
  img_proc: true
- pgno: 244
  md: "```\nnum_cuts <- 10\ncalib_data <- data.frame(prob = pred_probs,\n        \
    \                 bin = cut(pred_probs, breaks = num_cuts),\n                \
    \         class = mod_start$y)\n\ncalib_data <- calib_data %>%\n  group_by(bin)\
    \ %>%\n  summarize(observed = sum(class)/n(),\n            expected = sum(prob)/n(),\n\
    \            se = sqrt(observed * (1-observed) / n())))\n\ncalib_data\n#> # A\
    \ tibble: 10 x 4\n#> #>   bin             observed expected      se\n#> #>   <fct>\
    \           <dbl>    <dbl>   <dbl>\n#> #> 1 (0.00488,0.0322] 0.0212   0.0203 0.00188\n\
    #> #> 2 (0.0322,0.0592]  0.0440   0.0441 0.00328\n#> #> 3 (0.0592,0.0862]  0.0621\
    \   0.0708 0.00451\n#> #> 4 (0.0862,0.11]    0.0986   0.0988 0.00587\n#> #> 5\
    \ (0.113,0.14]     0.131    0.123  0.0131\n#> #> # i 5 more rows\n```\n\nNext,\
    \ we plot the observed vs. expected proportions. We also used the estimated standard\
    \ error to create corresponding 95% confidence intervals. The red line indicates\
    \ a perfect fit where our estimated and true distributions match. Overall, the\
    \ plot shows that our model could be better calibrated.\n\n```\nggplot(calib_data)\
    \ +\n  geom_abline(intercept = 0, slope = 1, color = \"red\") +\n  geom_errorbar(aes(x\
    \ = expected, ymin = observed - 1.96 * se,\n                    ymax = observed\
    \ + 1.96 * se),\n                colour=\"black\", width=.01)+\n  geom_point(aes(x\
    \ = expected, y = observed)) +\n  labs(x = \"Expected Proportion\", y = \"Observed\
    \ Proportion\") +\n  theme_minimal()\n```"
  merge: -1
  img_proc: true
