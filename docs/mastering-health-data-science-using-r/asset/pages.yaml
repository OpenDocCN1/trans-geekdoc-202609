    # 10.1.5 Reference List for Probability Distributions


    In the previous examples, we only used the normal and binomial distributions.
    The following list contains the other probability distributions available in R.
    For each distribution, we have given the arguments for the r[dist]() function.
    The other three functions have a similar format. Unless otherwise stated, the
    parameter n is the number of observations.


    +   • **Beta**: rbeta(n, shape1, shape2, ncp = 0) with shape parameters shape1
    and shape2 (and optional non-centrality parameter ncp).

    +   • **Binomial**: rbinom(n, size, prob) with probability of success prob and
    number of trials size.

    +   • **Cauchy**: rcauchy(n, location = 0, scale = 1) with location parameter
    location and scale parameter scale.

    +   • **Chi-Square**: rchisq(n, df, ncp = 0) with df degrees of freedom and optional
    non-centrality parameter ncp.

    +   • **Exponential**: rexp(n, rate = 1) with rate rate (i.e., mean = 1/rate).

    +   • **F**: rf(n, df1, df2, ncp) with df1 and df2 degrees of freedom (and optional
    non-centrality parameter ncp).

    +   • **Gamma**: rgamma(n, shape, rate = 1, scale = 1/rate) with parameters shape
    and scale (or alternatively specified by rate).

    +   • **Geometric**: rgeom(n, prob) with probability parameter prob.

    +   • **Hypergeometric**: rhyper(nn, m, n, k) with m white balls, n black balls,
    and k balls chosen.

    +   • **Logistic**: rlogis(n, location = 0, scale = 1) with parameters location
    and scale.

    +   • **Log Normal**: rlnorm(n, meanlog = 0, sdlog = 1) with mean meanlog and
    standard deviation sdlog on the log scale.

    +   • **Negative Binomial**: rnbinom(n, size, prob, mu) with parameters size and
    prob.

    +   • **Normal**: rnorm(n, mean = 0, sd = 1) with mean equal to mean and standard
    deviation equal to sd.

    +   • **Poisson**: rpois(n, lambda) with parameter lambda.

    +   • **Student t**: rt(n, df, ncp) with df degrees of freedom (and optional non-centrality
    parameter ncp).

    +   • **Uniform**: runif(n, min = 0, max = 1) with minimum value min and maximum
    value max.

    +   • **Weibull**: rweibull(n, shape, scale = 1) with parameters shape and scale.

    +   • **Wilcoxon Rank Sum**: rwilcox(nn, m, n) with nn number of observations
    and sample sizes m and n.'
  merge: -1
  img_proc: true
