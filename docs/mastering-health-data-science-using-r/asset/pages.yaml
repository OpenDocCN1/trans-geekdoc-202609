- pgno: 315
  md: "# Case Study: Designing a Simulation Study\n\nSimulation studies are an ideal\
    \ setting for utilizing functions. When conducting a simulation study, we often\
    \ need to generate data, run statistical methods, and collect results, and we\
    \ replicate this for a large number of simulations. Functions will ensure that\
    \ we can write cleaner and reproducible code. In this case study, we will write\
    \ the code for a simulation study that is based on the analysis by Hastie, Tibshirani,\
    \ and Tibshirani (2020), which compared different methods for sparse regression.\
    \ For our purposes, we will focus on the comparison between lasso and ridge regression,\
    \ introduced in Chapter 15.\n\nOur goal is to understand the predictive power\
    \ of the two models for different data settings. We will generate our training\
    \ and test data using the following data generating mechanism which relies on\
    \ the number of observations n, the number of predictors p, the sparsity s <=\
    \ p, predictor correlation level rho, and nu signal-to-noise ratio.\n\n+   1.\
    \ We define a vector of coefficients \\(\\beta \\in \\mathbb{R}^p\\) which has\
    \ its first s components equal to 1 and the rest equal to 0. Note that our model\
    \ will not have an intercept.\n+   \n+   2. We draw the rows of the predictor\
    \ matrix \\(X \\in \\mathbb{R}^{n \\times p}\\) from a multivariate normal distribution\
    \ \\(N_p(0, \\Sigma)\\), where \\(\\Sigma \\in \\mathbb{R}^{p \\times p}\\) has\
    \ entry (i, j) equal to \\(\\rho^{|i - j|}\\).\n+   \n+   3. We draw the outcome\
    \ \\(y \\in \\mathbb{R}^n\\) from a normal distribution \\(N(X\\beta, \\sigma^2\
    \ I)\\), where \\(\\sigma^2 = \\frac{\\beta^T \\Sigma \\beta}{\\nu}\\). This ensures\
