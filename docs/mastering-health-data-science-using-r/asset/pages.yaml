  md: "# 20\nWriting Efficient Code\n\nWhen we talk about efficient code, we are talking\
    \ about computational efficiency or writing code that is fast to execute. For\
    \ this topic, we need to peek under the hood to consider how R is implementing\
    \ our code in order to understand what can slow down our code. We use the **microbenchmark**\
    \ package (Mersmann 2023) to time our code execution. For demonstration, we use\
    \ a subset of the pain dataset from the **HDSinRdata** package.\n\n```\n```r\n\
    library(microbenchmark)\nlibrary(HDSinRdata)\nlibrary(tidyverse)\n\ndata(pain)\n\
    pain <- pain %>%\n  select(-c(BMI, GH_MENTAL_SCORE, GH_PHYSICAL_SCORE,\n     \
    \       PROMIS_PAIN_BEHAVIOR)) %>%\n  na.omit()\n```\n```\n\nThe function `Sys.time()`\
    \ returns the current system time. This allows us to find the net time required\
    \ to execute a chunk of code. For example, the following code finds how long it\
    \ takes to loop through the data to find the number of people who had an improvement\
    \ in pain.\n\n```\n```r\nstart_time <- Sys.time()\nnum <- 0\nfor (i in 1:nrow(pain)){\n\
    \  if (pain$PAIN_INTENSITY_AVERAGE[i] <=\n      pain$PAIN_INTENSITY_AVERAGE.FOLLOW_UP[i]){\n\
    \    num <- num + 1\n  }\n}\nend_time <- Sys.time()\nend_time - start_time\n#>\
    \ Time difference of 0.0198 secs\n```\n```"
