- pgno: 230
  md: '# 13.5 Evaluation Metrics


    In addition to adjusted R-squared, there are a few other metrics that can help
    us to understand how well our model fits the data and can also help with model
    selection. The AIC() and BIC() functions find the Akaike information criterion
    (AIC) and Bayesian information criterion (BIC) values, respectively. Both AIC
    and BIC balance the trade-off between model complexity and goodness of fit. AIC
    takes into account both the goodness of fit (captured by the likelihood of the
    model) and the complexity of the model (captured by the number of parameters used).
    Lower AIC values are preferable. BIC is similar to AIC but has a stronger penalty
    for model complexity compared to AIC. Both measures indicate a preference for
    keeping the interaction term.


    ```

    AIC(model_log_log)

    #> [1] -38610

    AIC(model_interaction)

    #> [1] -38760

    ```


    ```

    BIC(model_log_log)

    #> [1] -38569

    BIC(model_interaction)

    #> [1] -38710

    ```


    The predict() function allows us to calculate the predicted y values. When called
    on a model with no data specified, it returns the predicted values for the training
    data. We could also specify new data using the newdata argument. The new data
    provided must contain the columns given in the model formula. We use the predict()
    function to find the predicted values from our model and then calculate the mean
    absolute error (MAE) and mean squared error (MSE) for our model. MAE is less sensitive
    to outliers compared to MSE. The MAE indicates that our model has fairly high
    residuals on average. While this model may be helpful for understanding the relationship
    between blood lead level and systolic blood pressure, it would not be very useful
    as a tool to predict the latter.


    ```

    pred_y <- predict(model_interaction)

    ```


    ```

    mae <- mean(abs(nhanes_df$SBP - pred_y))

    ```'
