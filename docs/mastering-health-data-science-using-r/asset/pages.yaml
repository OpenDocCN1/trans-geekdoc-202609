    \ from 1 to 100. Take the mean of those observations; it should be 56.7.\n\n```\n\
    ```r\n# Insert your solution here:\n```\n```\n\nBeyond sampling, we can also find\
    \ the empirical cumulative distribution. That is, we can use a given vector to\
    \ infer a distribution. In the following case, we draw a random sample from a\
    \ normal distribution `vec` and then find its empirical cumulative distribution\
    \ using the `ecdf()` function. This function actually returns a function, which\
