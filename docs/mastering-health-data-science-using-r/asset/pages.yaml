  md: "# 18.1 Components of a Function\n\nTo start storing functions, we need to give\
    \ them a name and define their input (arguments) and output (return values). To\
    \ do so, we assign a function name to a function object as shown in the following\
    \ code. This example function has two arguments arg1 and arg2 and returns output.\n\
    \n```\n```\nfunction_name <- function(arg1, arg2){\n  code to compute output from\
    \ arguments\n  return(output)\n}\n```\n```\n\nTake a look at the following simple\
    \ function. The name of this function is say_hello, and there is no input (arguments)\
    \ or output (return values) associated with this function. Instead, it just prints\
    \ out a hello statement.\n\n```\n```\nsay_hello <- function(){\n  print(\"Hello!\"\
    )\n}\n```\n```\n\nRunning the previous code creates an object called say_hello\
    \ of the class function. We can run this function by calling it using empty parentheses\
    \ (since there are no input arguments).\n\n```\n```\nclass(say_hello)\n#> [1]\
    \ \"function\"\n```\n```\n\n```\n```\nsay_hello()\n#> [1] \"Hello!\"\n```\n```\n\
    \nWe can add to this function by instead adding our first argument called name\
    \ which is a string and then printing “Hello, [name]!”. In the next code chunk,\
    \ we use the paste0() function which concatenates the string arguments into a\
    \ single string.\n\n```\n```\nsay_hello <- function(name){\n  print(paste0(\"\
    Hello, \", name, \"!\"))\n}\nsay_hello(\"Weici\")\n#> [1] \"Hello, Weici!\"\n\
    ```\n```"
