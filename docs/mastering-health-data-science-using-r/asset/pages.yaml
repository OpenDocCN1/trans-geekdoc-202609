- pgno: 69
  md: '# ### 3.3 Using Logic to Subset, Summarize, and Transform


    We have already seen how to use TRUE/FALSE values to select rows in a data frame.
    The following logic operators in R allow us to expand on this capability to write
    more complex logic.


    +   - `<` less than

    +   - `<=` less than or equal to

    +   - `>` greater than

    +   - `>=` greater than or equal to

    +   - `==` equal to

    +   - `!=` not equal to

    +   - `a %in% b` a’s value is in a vector of values b


    The first six operators are a direct comparison between two values.


    ```

    ```r

    2 < 2

    #> [1] FALSE

    2 <= 2

    #> [1] TRUE

    3 > 2

    #> [1] TRUE

    3 >= 2

    #> [1] TRUE

    "A" == "B"

    #> [1] FALSE

    "A" != "B"

    #> [1] TRUE

    ```

    ```


    The operators assume there is a natural ordering or comparison between values.
    For example, for strings the ordering is alphabetical and for logical operators
    we use their numeric interpretation (TRUE == 1, FALSE == 0).


    ```

    ```r

    "A" < "B"

    #> [1] TRUE

    TRUE < FALSE

    #> [1] FALSE

    ```

    ```


    The %in% operator is slightly different. This operator checks whether a value
    is in a set of possible values. For example, we can check whether values are in
    the set c(4,1,2).'
  merge: -1
  img_proc: true
- pgno: 70
  md: '```

    1 %in% c(4, 1, 2)

    #> [1] TRUE

    c(0, 1, 5) %in% c(4, 1, 2)

    #> [1] FALSE TRUE FALSE

    ```


    Additionally, we can use the following operators, which allow us to negate or
    combine logical operators.


    +   • !x - the NOT operator ! reverses TRUE/FALSE values

    +   • x | y - the OR operator | checks whether either x or y is equal to TRUE

    +   • x & y - the AND operator & checks whether both x and y are equal to TRUE

    +   • xor(x, y) - the xor function checks whether exactly one of x or y is equal
    to TRUE (called exclusive or)

    +   • any(x) - the any function checks whether any value in x is TRUE (equivalent
    to using an OR operator | between all values)

    +   • all(x) - the all function checks whether all values in x are TRUE (equivalent
    to using an AND operator & between all values)


    Some simple examples for each are given in the following code chunk.


    ```

    !(2 < 3)

    #> [1] FALSE

    ("Alice" < "Bob") | ("Alice" < "Aaron")

    #> [1] TRUE

    ("Alice" < "Bob") & ("Alice" < "Aaron")

    #> [1] FALSE

    xor(TRUE, FALSE)

    #> [1] TRUE

    any(c(FALSE, TRUE, TRUE))

    #> [1] TRUE

    all(c(FALSE, TRUE, TRUE))

    #> [1] FALSE

    ```


    Let''s demonstrate these operators on the pain data. We first update the Medicaid
    column by making the character values more informative. The logic on the left-hand
    side selects those who do or do not have Medicaid and then assigns those values
    to the new ones.


    ```

    pain$MEDICAID_BIN[pain$MEDICAID_BIN == "no"] <- "No Medicaid"

    pain$MEDICAID_BIN[pain$MEDICAID_BIN == "yes"] <- "Medicaid"

    table(pain$MEDICAID_BIN)

    #>

    ```'
  merge: -1
  img_proc: true
