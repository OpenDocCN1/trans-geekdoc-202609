    start writing your report! Your file should now look like Figure 22.2.


    At the top of this pane is a toggle between source and visual mode. In visual
    mode, we can see that we have a text toolbar including options to bold text or
    add a list. If we switch to source mode, our text reveals the underlying Markdown
    in Figure 22.3 and the toolbar disappears. This chapter focuses on teaching you
    to edit in source mode, but you can always switch to visual mode if you prefer.


    We write all of the text and code that we would like to include in your report
    in this .qmd file, and then produce a nicely formatted report from this file by
    ‘rendering’ the file. We can either render to HTML, PDF, or WORD by clicking on
    the Render button from the toolbar at the top of the page. To update our format
    from PDF, we change the text in the top block to format: html or format: word.'
