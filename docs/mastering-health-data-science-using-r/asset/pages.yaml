- pgno: 248
  md: "```\nroc_mod_step <- roc(predictor = predict(mod_step, type = \"response\"\
    )),\n response = as.factor(mod_step$y),\n levels = c(0, 1), direction = \"<\"\
    )\n plot(roc_mod_step, print.auc = TRUE, print.thres = TRUE)\n```\n\n![](img/58a554e865d49ca347d9a3f76f8f0812_248_0.png)\n\
    \nIf we want to compare this model to our previous one, we could use a likelihood\
    \ ratio test since the two models are nested. The `lrtest()` function from the\
    \ **lmtest** package allows us to input two nested `glm` models and performs a\
    \ corresponding Chi-squared likelihood ratio test. First, we need to ensure that\
