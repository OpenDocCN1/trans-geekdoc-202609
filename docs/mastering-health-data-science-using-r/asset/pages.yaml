- pgno: 192
  md: "# 11.3 Two-Sample Tests for Continuous Variables\n\nIf we wanted to directly\
    \ compare the difference between 2020 and 2021 rates, we could use a two-sample\
    \ test. In this case, because our samples are paired by county, we can use a two-sample\
    \ paired t-test. Specifically, we use a two-sided test to test the null hypothesis\
    \ that the rates are equal by specifying two different vectors x and y. Note that\
    \ we used the default values of mu = 0 and alternative = \"two.sided\". Additionally,\
    \ we used the default value var.equal = FALSE, which implies that the samples\
    \ may have different variances. From the results, we reject the null hypothesis\
    \ that the two county rates are equal at the 0.05 level. We also print a 95% confidence\
    \ interval of the difference in means.\n\n```\nt_test_two_res <- t.test(x = county_rates$y2020,\n\
    \                         y = county_rates$y2021)\n\nt_test_two_res\n#>\n#> Welch\
    \ Two Sample t-test\n#>\n#> data:  county_rates$y2020 and county_rates$y2021\n\
    #> t = 2, df = 497, p-value = 0.01\n#> alternative hypothesis: true difference\
    \ in means is not equal to 0\n#> 95 percent confidence interval:\n#>  0.145 1.278\n\
    #> sample estimates:\n#> mean of x mean of y\n#>   5.28    4.57\nt_test_two_res$conf.int\n\
    #> [1] 0.145 1.278\n#> attr(,\"conf.level\")\n#> [1] 0.95\n```\n\nIn the tex_itop\
    \ dataset, each county has also been categorized by whether it was urban or rural.\
    \ Suppose we want to compare the change in abortion rates from 2020 to 2021 between\
    \ rural and urban counties. First, we create a variable describing the rate change\
    \ between these years using the following code. We choose to use the change in\
    \ rate rather than percent change to avoid infinite or undefined values.\n\n```\n\
    county_rates_type <- tex_itop %>%\n  dplyr::select(c(county, urban, county_type,\
    \ total_rate, year)) %>%\n```"
  merge: -1
  img_proc: true
- pgno: 193
  md: "```\n```r\nfilter(total_rate < 15, year %in% c(2020, 2021)) %>%\npivot_wider(names_from\
    \ = year, values_from = total_rate) %>%\nna.omit() %>%\nrename(\"y2020\" = \"\
    2020\", \"y2021\" = \"2021\") %>%\nmutate(rate_change = (y2021 - y2020))\n```\n\
    ```\n\nWe again use a two-sample two-sided t-test, but this time the data are\
    \ not paired. In the following code, we show an alternative way to specify a t-test\
    \ using a formula lhs ~ rhs, where lhs is a numeric column and rhs is a factor\
    \ column with two levels. We must also specify the data in this case. From the\
    \ R output in this case, we would fail to reject the null hypothesis at the 0.05\
    \ level and conclude that the rate changes for urban and rural counties are not\
    \ significantly different. We also print the estimates used in the t-test using\
    \ estimate, which shows the estimated mean in both groups.\n\n```\n```r\nt_test_unpaired\
    \ <- t.test(rate_change ~ urban,\n                           data = county_rates_type)\n\
    t_test_unpaired\n#>\n#>  Welch Two Sample t-test\n#>\n#> data:  rate_change by\
    \ urban\n#> t = 0.1, df = 205, p-value = 0.9\n#> alternative hypothesis: true\
    \ difference in means between group\n#>   Rural and group Urban is not equal to\
    \ 0\n#> 95 percent confidence interval:\n#>  -0.495  0.563\n#> sample estimates:\n\
    #> mean in group Rural mean in group Urban\n#>             -0.469            \
    \ -0.503\nt_test_unpaired$estimate\n#> mean in group Rural mean in group Urban\n\
    #>             -0.469             -0.503\n```\n```\n\nNote that this yields the\
    \ same results as if we had specified the data using two vectors x and y.\n\n\
    ```\n```r\nx <- county_rates_type$rate_change[county_rates_type$urban == 'Urban']\n\
    y <- county_rates_type$rate_change[county_rates_type$urban == 'Rural']\nt.test(x\
    \ = x, y = y, paired = FALSE)\n#>\n#>  Welch Two Sample t-test\n```\n```"
  merge: -1
