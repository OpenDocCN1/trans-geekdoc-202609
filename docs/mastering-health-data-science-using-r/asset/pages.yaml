    # ## 8.2 Adjusting the Axes and Aesthetics


    We can further control how each aesthetic element is displayed using scale functions.
    For example, suppose that I want to update the previous plot. In particular, I
    first want to update the x-axis to display all of the values 0 to 10 instead of
    0, 2.5, 5, etc.. To update the x-axis, I need to find the corresponding scale
    function for x with continuous values. This function is scale_x_continuous(),
    which allows me to specify limits (limits), breaks (breaks), and labels (labels).
    The scale functions can be found on the second sheet of the cheat sheet. In this
    case, I just want to update the breaks to be all integer values from 0 to 10.


    ```

    ggplot(pain_df)+

    geom_histogram(aes(x = PAIN_INTENSITY_AVERAGE), color = "violetred",

    fill = "lightblue", alpha = 0.5, bins = 11) +

    labs(x = "Patient Reported Pain Intensity", y = "Count")+

    scale_x_continuous(breaks = 0:10)+

    theme_minimal()

    ```'
  merge: -1
  img_proc: true
