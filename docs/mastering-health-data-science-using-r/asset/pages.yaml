  md: '# 18.1.1 Arguments


    Arguments are inputs passed to functions so that they can complete the desired
    computation. We can also have default values for these arguments. In this case,
    those arguments do not have to be specified when calling the function. For example,
    rnorm(10) uses the default value for the mean to understand which distribution
    we want to use. In the following function, we find the Euclidean distance from
    a given (x,y,z) coordinate and the origin (0,0,0) with a default value of zero
    for all values.


    ```

    dist_to_origin <- function(x = 0, y = 0, z = 0){

    return(((x - 0)^2 + (y - 0)^2 + (z - 0)^2)^(0.5))

    }

    ```


    If we call this function with no arguments, it uses all the default values.


    ```

    dist_to_origin()

    #> [1] 0

    ```


    However, if we call the function with one argument, the function assumes this
    first argument is x. Similarly, it assumes the second value is y and the third
    value is z. If we want to give the arguments without worrying about the order,
    we can specify them using their names (see the last line in the following code
    chunk).


    ```

    dist_to_origin(1)

    #> [1] 1

    dist_to_origin(1, 2)

    #> [1] 2.24

    dist_to_origin(1, 2, 3)

    #> [1] 3.74

    dist_to_origin(y = 2, z = 3)

    #> [1] 3.61

    ```


    Besides passing in numeric values, strings, data frames, lists, or vectors, we
    can also pass other types of objects in as arguments to a function. For example,
    we can take another function in as an argument. In the next example, we create
    two functions. The first function calculates the Euclidean distance between two
    points. The second one computes the distance from a given point to the origin.
    Note that this updated function to find the distance to the origin is more flexible
    and written in a cleaner manner. First, it allows us to input a point of any length.
    Second, it allows us to specify the distance function used. This also demonstrates
    calling a function within another function.'
  merge: -1
  img_proc: true
