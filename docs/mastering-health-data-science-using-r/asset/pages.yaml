    #> F = 1, num df = 187, denom df = 59, p-value = 0.6

    #> alternative hypothesis: true ratio of variances is not equal to 1

    #> 95 percent confidence interval:

    #>  0.719 1.657

    #> sample estimates:

    #> ratio of variances

    #>         1.12

    f_test$estimate

    #> ratio of variances

    #>        1.12

