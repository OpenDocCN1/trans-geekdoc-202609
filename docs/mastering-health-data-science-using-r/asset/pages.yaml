    # ## 15.1 Regularized Regression


    Suppose we have a numeric data matrix \(X \in \mathbb{R}^{n \times p}\) and outcome
    vector \(y \in \mathbb{R}^n\). We let \(x_i\) denote the vector representing the
    \(i\)th row of \(X\). This corresponds to the \(i\)th observation. When we refer
    to regularized regression, we are referring to solving the following optimization
    problem that minimizes the average loss plus a penalty term.


    \(\min_{(\beta_0, \beta) \in \mathbb{R}^{p+1}} \frac{1}{n} \sum_{i=1}^n l(y_i,
    \beta_0 + \beta^T x_i) + \text{Pen}(\beta) \tag{15.1}\)


    The function \(l(y_i, \beta_0 + \beta^T x_i)\) represents the loss function. For
    linear regression, this corresponds to the squared error \((y_i - \beta_0 - \beta^T
    x_i)^2\). For logistic regression, this loss corresponds to the logistic loss
    function.


    The penalty terms we implement include the following:


    +   * L0 Norm: \(||\beta||_0 = \sum_{j=1}^p 1(\beta_j \neq 0)\), the number of
    non-zero coefficients,


    +   * L1 Norm: \(||\beta||_1 = \sum_{j=1}^p |\beta_j|\), the sum of absolute values
    of the coefficients, and


    +   * Squared L2 Norm: \(||\beta||_2^2 = \sum_{j=1}^p \beta_j^2\), the sum of
    squared coefficients.


    # ## 15.2 Elastic Net


    We first consider L1 and L2 regularization. In particular, consider the following
    penalty term, referred to as elastic net regularization,


    \(\lambda \left[ \alpha ||\beta||_1 + (1 - \alpha) ||\beta||_2^2 \right],\)'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'where λ is a complexity parameter and α controls the balance between the two
    norms. A model with only L1 regularization (α = 1) corresponds to lasso regression
    while a model with only L2 regularization (α = 0) corresponds to ridge regression.
    Note that the penalty depends on the scale of X and we typically assume each column
    has been standardized.


    The **glmnet** package implements elastic net regularization. It assumes our data
    are in the form described previously. Therefore, we first create our numeric data
    matrix x and output vector y. Some of our variables are categorical, so in order
    to create a numeric matrix we need to one-hot encode them. We can do so using
    the `model.matrix()` function which takes in a formula and a data frame and creates
    the corresponding design matrix including creating dummy variables from factor
    variables and implementing any transformations. Note that we drop the first generated
    column which corresponds to the intercept. The transformation to our outcome does
    not impact the result.


