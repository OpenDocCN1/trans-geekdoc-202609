  md: '+   4. Practice Reading Documentation. Whenever you are using a new function,
    you should read the documentation first. When debugging, you should check that
    the input arguments to a function match what is expected and check the examples.
    Reading these examples also helps when writing your own documentation so you can
    better understand how to communicate to your audience.


    +   5. Start Simple, Build Up. If we write a large amount of code at once and
    then it fails to work, it''s hard to understand what went wrong. Instead, we should
    build up our code or functions in small steps and check it after each step. When
    it comes to testing code, a good mantra is test early and test often. So, try
    to avoid writing too much code before running and checking that the results match
    what you expect. If you do end up writing a big chunk of code, you can localize
    your error by checking the values of objects at different points.


    +   6. Get Comfortable Asking for Help. In software engineering, it''s a known
    tip to have a rubber ducky (or other adorable object) at your desk to talk through
    your code. Having to verbalize and explain your approach can be really helpful
    for debugging. R''s error messages can sometimes hint at what the error might
    stem from, but they are not always direct. Searching for error messages you don''t
    understand might give you a better understanding of the problem.


