  md: "```\n#' Find unique elements of a vector\n#'\n#' @param x vector\n#' @return\
    \ new vector with duplicates removed\nown_unique <- function(x){\n  # check for\
    \ empty vector\n  if (length(x) == 0){\n    return(NULL)\n  }\n\n  # otherwise\
    \ y will be unique values\n  y <- c()\n\n  for(i in 1:length(x)){\n    # if value\
    \ in x is not in y, we add it\n    if(!(x[i] %in% y)){\n      y <- c(y, x[i])\n\
    \    }\n  }\n\n  return(y)\n}\n```\n\n+   3. Don't Repeat Yourself. Repeating\
    \ code increases the likelihood of errors. Additionally, it makes it hard to update\
    \ our code later on. When we find ourselves repeating code, we should use a function.\
    \ If you find yourself repeating constants, you should define these values as\
    \ an object. The subsequent code uses a single line of code to convert categorical\
    \ variables to factors and stores a vector of which columns are categorical.\n\
    \n```\ndry_df <- data.frame(age = ages,\n                     tb = c(1, 0, 0,\
    \ 0),\n                     heart_rate = c(60, 82, 76, 72),\n                \
    \     gender = c(\"Female\", \"Male\", \"Nonbinary\",\n                      \
    \          \"Female\"))\n\n# convert factor variables\ncat_vars <- c(\"tb\", \"\
    gender\")\ndry_df[cat_vars] <- lapply(dry_df[cat_vars], factor)\n```"
