    # 2.6 Important Aspects of HCI


    The assurance of user satisfaction is a key component of HCI. Because HCI examines
    how humans and machines interact, it draws on relevant knowledge from both the
    human and the machine sides. The summary of key aspects and definitions are as
    follows [6]:


    +   * *Effectiveness*: The precision and thoroughness with which users accomplish
    their intended objectives.

    * *Efficiency*: The amount of resources used in comparison to how accurately and
    completely fulfill their goals.

    * *Satisfaction*: A good attitude toward the system''s environment and freedom
    from discomfort.

    * *Flexibility*: The extent to which a system can accommodate changes desired
    by the user beyond those first specified.

    * *Learnability*: The amount of time and effort needed to master a given level
    of system performance, also known as the learning curve.

    * *Memory*: The time and work needed to get back to a certain level of performance
    after being absent from the system for a certain amount of time.

