    to reduce the processing time. Following that, if the image suffers from interference,
    one can activate filters to remove these to ensure accurate detection. In addition
    to bilateral and Gaussian filters, trilateral filters can also be used. Using
    a canny filter and an edge detector, an edged image can be obtained using thresholding
    generated by a machine to obtain the edges. These edges can be detected by lane
    detectors. Segments of the lane boundary will be generated on the left and the
    right. As a result, the RGB color codes are used to determine yellow and white
    lanes.


