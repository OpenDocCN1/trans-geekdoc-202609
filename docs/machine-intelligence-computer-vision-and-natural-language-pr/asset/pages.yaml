    # 12.3.1.2 Feature Map


    The convolved feature map is formed by sliding the filter over the image and computing
    the dot product. Every layer feature map output acts as input to the next layer.


    # 12.3.1.3 Region Proposal Network (RPN)


    In RPN training, each region proposal is labeled to indicate whether an object
    has a defective or region. If the intersection (IOU) between the proposal and
    the ground-truth box exceeds the threshold (0.7 in this study), or if it has the
    highest IOU with a ground-truth box, the proposal is assigned as a positive training
    sample, if the maximum IOU between a non-positive proposal and the ground-truth
    box is lower than the corresponding threshold (0.3 in this study), the proposal
    is regarded as a negative sample. RPN in faster R-CNN is trained using a multi-task
    loss defined by Eq. 12.2.


    ```

    $L\{p_i\}, \{t_i\} = \frac{1}{N_{cls}} \sum_{cls} L_{cls}(p_i, p_i^*) - \frac{1}{N_{reg}}
    \sum_{reg} P_i^* L_{reg}(t_i, t_i^*)$  (12.2)

    ```


    where i indicates the anchor, $P_i$ represents the predicted probability of anchor
    being one type of sewer pipe defect. $P_i^*$ represents the ground-truth label
    of anchor if the anchor is a positive sample and 0 if it is negative. $t_i$ is
    a vector indicating the coordinates of the predicted bounding box to a positive
    anchor. $N_{cls}$ and $N_{reg}$ are two normalization factors for the two components
    and are weighted by a balancing parameter $\lambda$. With reference to a related
    study [22], the value of $N_{cls}$ is set to 256 and $N_{reg}$ equals 2,400 which
    is an approximate value of the number of anchor locations in the model. The balancing
    parameter $\lambda$ is set to 10, so that both cls and reg are roughly weighted
    equal.


