    type, characterized by the occurrence of limitis plastica, is related to an unfavorable
    prognosis, as by a result of which the diagnosis is commonly delayed until the
    illness is advanced. Gastric H. pylori infection is closely related to this type,
    as in the intestinal type.


    The XGBoost ensemble method is used to classify patients with high or low risk
    of developing gastric cancer. The dataset was collected from a single facility
    in Japan from 2006 to 2017. The results showed that XGBoost performed best among
    10 classification models built (Taninaka et al., 2019). The basic principles,
    advantages and disadvantages, training, and testing of data with the application
    of Machine Learning techniques used in the diagnosis of gastric cancer were studied
    (Danish et al., 2021). Extreme gradient boosting (XGBoost) had the best performance
    in predicting cancer development (AUC 0.97, 95%CI 0.96–0.98), and was superior
    to conventional logistic regression (AUC 0.90, 95 CI 0.84–0.92). With the XGBoost
    model, the number of patients considered at high risk of gastric cancer was 6.6,
    with a miss rate of 1.9 percent. A total of 26 clinical variables were input into
    these models (Leung et al., 2021). A gradient boosting decision (GBDT) is a type
    of ensemble learning technique that can be used as a predictive model for the
    diagnosis of gastric cancer, by noninvasive techniques. The dataset consists of
    709 samples and was collected from Zhejiang Provincial People''s Hospital. The
    accuracy of the GBDT model was 83 percent (Zhu et al., 2020).


    The Computerized Decision Support (CDS) system works as an assistant to doctors
    in the field of gastroenterology. The CDS helps in identifying the cancerous area
