    # 7.1.1 The Need for IoT


    IoT as a transformative technology has gained popularity and momentum, within
    a short span of time since its introduction. This buzzword was coined in 1999
    by Kevin Ashton, when he decided to track the supply chain of the Procter & Gamble
    products, using Radio-Frequency Identification (RFID). The primary advantages
    of IoT were deemed to be the reason for its success and growth in leap and bounds.


    +   - harnesses voluminous data for decision-making

    - offers automated tracking and monitoring

    - reduces workload and increases productivity

    - increases efficiency

    - enhances quality of life.


    We will now discuss these advantages of IIOT:


    +   - Harnesses voluminous data for decision-making: The devices or sensors connected
    through the IoT can be geographically apart and still generate and collect huge
    volumes of data. For instance, on the domestic front, an IoT-enabled refrigerator
    can raise alerts on the expiry date of food items, give prompts on the food items
    running out of stock, and optimize power consumption. Likewise, the business-related
    data generated through IoT can help strategize the business plans and solutions.

    - Automates tracking, monitoring and control: Tracking enables users to check
    the status of the machine to take necessary actions. For example, the user can
    monitor quality of food items in a smart refrigerator and they can replace the
    items without consistently checking.

    - Reduces workload and increases productivity: Since the devices are performing
    major tasks, this leads to a reduction in costs, time, and human intervention.
    Most of the communications are machine-to-machine and the connected devices lead
    to useful implementations that increase the efficiency of both the business and
    end users. For example, the lights are automatically turned off when the user
    leaves the smart room and saves this electricity.

    - Enhances quality of life: The applications of IoT improve quality in various
    sectors, namely health, lifestyle of users, etc. For example, the smart watch
    is used to track the heartbeats and can analyse the exercises carried out by the
    user [6].


    # 7.1.2 Integration of IoT and Technologies


    The advances in computing technologies have increased the potential of IoT, in
    severalal possible areas:'
