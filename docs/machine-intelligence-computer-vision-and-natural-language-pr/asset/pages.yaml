    popular (Kaush and Bhatia, 2022; Pandey et al., 2022). Several NLP methods can
    be adopted for evaluating the emotions considering any scenario (Dandekar and
    Naraware, 2022). Opinion mining plays a great role in generating several models
    that mimic the human thinking processes while handling uncertain situations (Kaur
    et al., 2022). Sentiment analysis is an indispensable part of cognitive computing
    (Pasupa and Ayuthaya, 2022). Opinion mining is multi-disciplinary in nature that
    involves the culmination of Natural Language Processing, Machine Learning, Deep
    Learning, Statistics, Mathematics, Psychology, Sociology, Artificial Intelligence
    and many other domains. Inumerable research articles are available on sentiment
    analysis. Several tertiary studies are also carried out using secondary research
    articles opinion mining. The information obtained after implementing opinion mining
    on a certain subject matter can be incorporated to explain, analyze and comprehend
    particular phenomena (Pozzi et al., 2017). Considering the business area, opinion
    mining plays a very important role in analyzing the customers'' views on a particular
    product. Strategies to improve the business can be analyzed using sentiment analysis.
    Analyzing the needs of the customer is extremely important in the current business
    domain which is highly aligned towards the customers (Chagas et al., 2018).


    # 14.2 Background and Related Work


    The present work considers "sentiment analysis" to be a common terminology for
    sentiment analysis as well as opinion mining. Sentiment analysis revolves around
    the concept of Natural Language Processing (NLP) as suggested by Cambria et al.
    (2017); Hematian and Sohrabi (2017); and Pozzi et al. (2017). A three-tier architecture
    can be suggested considering sentiment analysis as follows:


    +   1. Syntactic layer: The syntactic layer involves the functions: normalization
    of the dataset under consideration, disambiguation of boundaries associated with
    the sentence, tagging parts of speech to each set of words in the sentence or
    phrase, breaking down an entire sentence into smaller chunks and lemmatizing the
    words. i.e., reducing each word to its root form (Hematian and Sohrabi, 2017).

    2. Semantics layer: The semantics layer involves the following tasks: detection
    of subjectivity and objectivity of sentences, extraction of underlying concepts,
    anaphor resolution and recognition of named entities (Kumar and Teeja, 2012).

    3. Pragmatics layer: The pragmatics layer involves the following functions: detection
    of sarcastic elements in the dataset, understanding the metaphors involved, extraction
    of aspects involved in a particular sentence and detection of polarities (Cambria
    et al., 2017; Ligtharter et al., 2021).'
