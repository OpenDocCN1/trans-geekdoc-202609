    # # A New Frontier in Machine Intelligence: Creativity


    Ardhendu G. Pathak


    # ## 1.1 Introduction


    On October 25, 2018, the topic of computer creativity, until then mostly an idle
    curiosity for lay persons and a plaything for computer nerds, suddenly captured
    the public imagination when a painting called “Portrait of Bellamy” (Figure 1.1)
    was sold for $432,000 at Christie’s auction house [1]. This painting was created
    using a type of Artificial Intelligence (AI) program called Generative Adversarial
    Network (GAN). At the bottom right of the painting, a mathematical equation appeared
    where normally the artists signature is placed.


    Creativity has been considered a gift from the gods, the ancient Greeks believed
    that the Muses — goddesses for different areas of artistic expression, such as
    epic poetry — whispered in the ears of the mortals to impart the powers of creativity.
    In India too, the story goes that “Kavikulagura” (the Dean of Poets) Kalidas received
    a boon from the goddess Kali to compose his poems in Sanskrit.


    The modern view of human creativity, however, considers it a part of the many
    dimensions of the human intelligence. Being subjective and socially indexed, there
    is no single accepted definition of creativity. Among many different classification
    schemas, Boden [2] proposes that creative output can be classified as either combinatorial,
    exploratory, or transformational creativity. Novel or improbable combinations
    of familiar ideas are denoted as combinatorial creativity. The exploratory'
  merge: -1
  img_proc: true
