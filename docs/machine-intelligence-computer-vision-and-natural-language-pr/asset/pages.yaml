  md: '# Overview of Human-Computer Interaction


    # 2.4.3 Ethics, Privacy, and Security


    +   1. *Fundamental privacy concerns*: The numerous privacy problems to be solved
    the right to be alone without interruption (solitude), the right to have no public
    identity (anonymity), and the right not to be monitored (intimacy). The right
    to control one’s personal information must be protected as well.


    +   2. *HCI research*: Use of vulnerable user populations in HCI research, such
    as older adults, people with disabilities, immigrants, socially isolated individuals,
    patients, children, and so on, should be avoided. Participant anonymity is also
    a difficult task, as studies have shown that data can be de-anonymized when combined
    with other datasets.


    +   3. *Online social networks (OSNs)*: Concerns about privacy in OSNs include
    data retention issues, the ability to browse private information, data selling,
    and targeted marketing. Privacy and content sharing are two opposing fundamental
    features of OSNs that must be perfectly combined, a challenge that OSN designers
    must master.


    +   4. *Healthcare technologies*: In the context of healthcare, data privacy,
    accuracy, integrity, and confidentiality are essential. Access to EHealth for
    all, anonymity, autonomy, beneficence and non-maleficence, dignity, no discrimination,
    and fully informed consent, justice, and value-sensitive design are all ethical
    principles that should be addressed in EHealth.


    +   5. *Virtual reality*: In a virtual environment, the illusion causes the user’s
    reactions and feelings, such as over-attachment to virtual agents or feeling out
    of control and behaving aggressively in both the virtual and physical worlds.
    The intentions of the creator of the VR environment may be ambiguous and dangerous
    to the user. Users’ perceptions of reality may be affected as a result of VR,
    resulting in virtual dissonance.


    +   6. *IoT and Big Data*: Data about people in the virtual world are supplemented
    and integrated with real-world data, and data privacy is further jeopardized by
    the interconnection of common devices. The connection of daily items threatens
    data anonymity even more. By connecting multiple systems and merging data, risks
    to privacy and identity are realized. Discrimination and restriction of options
    may result from automated decision-making. Malevolent intents and deceptive promises
    should not be made to vulnerable people.


    +   7. *Intelligent environments*: Intelligent systems, in general, pose a number
    of risks, such as user identification based on collected data, the persistence
    of personal/sensitive data, profiling and implicit deduction and attribution of
    new properties to individuals, data for monitoring, data misinterpretation, public
    disclosure of confidential information, and data collection techniques used without
    the user''s knowledge. Transparency is essential when autonomous intelligent agents
    make more complicated and significant ethical judgments, so that humans can understand,
    predict, and appropriately trust AI, whether manifested as traceability, verifiability,
    non-deception, or intelligibility.'
