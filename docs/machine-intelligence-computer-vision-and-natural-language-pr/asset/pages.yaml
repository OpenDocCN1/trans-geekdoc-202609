- pgno: 13
  md: '# Preface


    At the outset, the following is not an exaggerated statement:


    By smartly leveraging a growing array of digitization and digitalization technologies
    and tools, machines and devices in our everyday environments (homes, hotels, hospitals,
    retail stores, factory floors, airports, warehouses, etc.) are being systematically
    empowered to be interactive in their operations, offerings and outputs.


    There are path-breaking edge and digitization technologies such as miniaturized
    and disappearing sensors, actuators, RFID tags, stickers, microcontrollers, chips
    and codes, LED lights and communication modules, smart dust, etc. for transforming
    all kinds of physical, mechanical, electrical and electronics systems into digitized
    elements. Through short- and long-range communication technologies, digitized
    entities are subsequently connected with one another in the vicinity and with
    remotely held software and databases (cloud-hosted). Thus, sensing, perception,
    vision, communication, and computing technologies empower tangible things to become
    digitized entities. Such empowered entities are now ready to join the mainstream
    communication. In short, all of wearables, handhelds, and implantable, mobile,
    wireless, fixed and nomadic devices, appliances, equipment, machinery, wares,
    instruments, etc. are being meticulously prepared for the ensuing digital era.
    In the recent past, these networked embedded systems have been the Internet of
    Things (IoT) sensors and devices.


    Now connected devices, which are projected to be in billions, are capable of creating
    zetabytes of digital data. Fortunately, the IT industry is being bombarded with
    a variety of integrated analytics platforms, methods, frameworks, software libraries,
    toolsets, and other enablers to transition digital data into actionable insights.
    Furthermore, data integration and virtualization techniques are prevalent, along
    with data fabrics and meshes to capture, aggregate and insert into data analytics
    platforms. The aspect of knowledge visualization is fulfilled through 360 degree
    dashboards. Especially with a host of breakthrough artificial intelligence (AI)
    algorithms and models, the difficult process of transforming digital'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# xiv Preface


    data insights is being highly simplified and sped up. By feeding the knowledge
    discovered into IoT devices, the days of having cognitive devices are at hand.
    Such edge devices can exhibit intelligent behavior.


    Machine and deep learning (ML/DL) algorithms with a host of frameworks, pre-trained
    models, and specialized accelerators come in handy in providing computer vision
    (CV) and natural language processing (NLP) applications. These unique capabilities
    are being replicated in resource-intensive IoT devices and machines. Machines
    that can see and perceive can bring deeper and decisive acceleration, automation,
    and augmentation capabilities to businesses as well as people in their everyday
    assignments and engagements. Machine vision is becoming the grandiose reality
    with the distinct advances in computer vision and device instrumentation spaces.
    Machines are increasingly software-defined. That is, all everything that is happening
    there and to be deployed in mission-critical locations to monitor and take decisive
    actions in time with all the clarity and agility.


    These pioneering developments have laid down a stimulating and scintillating foundation
    to visualize and realize a variety of specialized applications not only for enterprises
    but also for people at large. Empowering machines with sensing, vision, perception,
    analytics, knowledge discovery and dissemination, decision-making and action capabilities
    through a host of breakthrough digital technologies and goes long in establishing
    intelligent systems and adaptive networking, such as 5G and Wi-Fi 6, can lead
    to a new industrial revolution. Edge AI-inspired robots, drones, gizmos, and gadgets
    are bound to facilitate smart manufacturing and Industry 4.0 and 5.0 applications.
    Similarly the next-generation digitally transformed healthcare domain is set to
    immensely benefit society through vision-enabled machines. Technology-induced
    innovations can aid experts and workers in conceiving and concretizing fresh ways
    and to perform low-waste and high-efficiency industrial activities.


    Machines are enabled to interact with other machines in the vicinity and with
    remote machines through a host of networking protocols. Similarly, natural interfaces,
    machines and men are able to interact purposefully. That is, human interfaces
    (HMIs) are seeing the grand reality these days with a plethora of technological
    innovations and disruptions. As convolutional neural networks (CNNs) facilitate
    machine vision, the further maturity and stability of recurrent neural networks
    (RNNs), a grandiose part of the deep learning (DL) field, strengthened the NLP
    capability of our everyday machines.


    The third and final feature is to produce autonomous machines with self-configuring,
    healing, defending, and managing features. With the steadily growing power of
    machine learning (ML) algorithms, a dazzling array of industrial machinery, medical
    instruments, defense equipment, consumer electronics, handheld, wearables, and
    other edge devices are being readied to intrinsically exhibit'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Preface


    behavior. Devices are becoming autonomous; therefore, they can continuously and
    consistently deliver their designated services without any slowdown or breakdown.
    In their actions and reactions, they become fault-tolerant, high-performing, self-defending,
    adaptive, reactive, proactive, etc. In a nutshell, people and businesses will
    get state-the-art products, solutions, and services through a bevy of cutting-edge
    technologies.


    It is possible to produce and supply a host of people-centric, real-time, service-oriented,
    event-driven, and context-aware services with intelligent machines in and around
    us. Thus, connected devices, digitized entities, and intelligent applications,
    the business-driven IT is all set to be people IT in the years to come.


    This book is to enlighten our esteemed readers with all the details on the following
    topics.


    +   1. Artificial intelligence (AI) (machine and deep learning (ML/DL) algorithms,
    computer vision (CV), and natural language processing (NLP) capabilities)

    2. Edge computing, clouds and analytics

    3. Edge AI technologies and tools

    4. Industry 4.0 – a detailed overview and use cases

    5. The IoT – the promising industrial applications

    6. Audio and video analytics

    7. Edge clouds and analytics

    8. Autonomic systems for industrial processes

    9. Hyperautomation techniques

    10. Computer and machine vision

    11. Human-machine interfaces (HMIs)

    12. Cybersecurity for smart industrial systems

    13. Machine vision applications and use cases for Industry 4.0

    14. Smart and high-precision manufacturing

    15. Intelligent robots and drones'
