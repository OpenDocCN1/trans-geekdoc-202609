    # 3.2.3 Understanding the Differences between Edge and Fog Computing


    Both edge and fog computing are designed as the subsidiaries of cloud computing.
    Even though both terms are used interchangeably, there exist a few differences
    between them.


    The main difference between the edge and fog environments is [4], in edge computing,
    computation happens usually on end devices. It can be any IoT sensor or gateways
    which are close to the sensors. Fog computing shifts computing to the LAN hardware
    or processors connected to the LAN, which is near the end devices but at a longer
    distance away compared to the edge devices. Edge computing is closer to the end
    devices than fog computing. This helps to further reduce the transmission time.
    Thus, edge computing generates a response with less delay and latency.


    Edge computing has less capability to perform data filtering and analysis. It
    processes all the data and generates a response without the requirement. Fog computing
    offers an environment to test and analyse the incoming requests before processing.
    Memory and storage space can be saved by enabling fog computing. The fog computing
    supports data filtering where only the required data will be transferred to the
    cloud, the cloud will not be overloaded with millions of bits of data. The network
    congestion, jitter, delay, etc. can be reduced with fog implementation.


    The edge computing environment is less scalable than fog computing. The edge nodes
    are usually part of an IoT network. Fog nodes are configured in the LAN hardware
    and have a strong infrastructure support, making the fog easily expandable. The
    fog environment is capable of incorporating new nodes, making the technology more
    scalable.


    Edge computing is considered a part of the IoT network itself. The data is processed
    within the IoT network itself, making the data more secure. The fog nodes capture
    the data from nearby end devices and process it. The data travels to longer distance,
    which increases the chances of attacks, compared to edge computing. When considering
    the cloud processing, fog computing offers better security and less chance of
    errors. Fog nodes are considered a part of the cloud computing infrastructure
    itself.


    The edge/fog technology has only minor differences among them. When compared to
    the cloud technology, we can see that differences are major. Table 3.1 depicts
    the differences between the cloud, fog and edge computing models. Table 3.1'
