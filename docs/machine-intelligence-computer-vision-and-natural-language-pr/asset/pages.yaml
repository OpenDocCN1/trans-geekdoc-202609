  img_proc: true
- pgno: 328
  md: '# 304 Machine Intelligence


    changes from the standard genome code. And, changing a single base in nucleotides
    from "ACGTTTGA" to "ACGTCTGA" may have negative health implications.

    Interpreting genetic data brings us closer to medicine''s future: it signifies
    the start of an age characterized by personalized medicine, in which every human
    has their own personal DNA sequence and thus, their own genome, loaded with numerous
    mutations, in that some are beneficial and others dangerous. The Human Genome
    Project (HGP), which is sponsored by the US government, the first trial at sequencing
    in 2003. From 1990 to 2003, HGP received $3 billion in funding to convert sequences
    from a manual format to an automated process. Moreover, the HGP has discovered
    that in total there are 20,500 human genes. And, the human genome was determined
    in three ways by scientists working over HGP,


    +   - Determine the "order"/series" of the complete genome bases in human DNA.

    - Generate maps that display the positions of genes for large parts of the chromosomes.

    - Produce connectivity maps, and difficult versions of its type first developed
    in early Drosophila research, with which the inherited properties can be monitored
    for several generations.


    Genome Wide Association Studies (GWAS) made the Human Genome Project step forward
    by identifying the most common genetic variants in various people and establishing
    links among genes and diseases. Some challenges in the manipulation of genomic
    data are:


    +   - The fact that around 6000 Mendelian disorders are examined at the primary
    genetic level, the majority of their activities in health and disease remain unknown.

    - The National Institutes of Health (NIH), Sequence Read Archive (SRA) databases
    have developed at an exponential pace over the last eight years. While advances
    in NGS have made it simple to sequence an entire genome/exome, the handling, analysis,
    and interpretation of the genomic data produced by NGS remain a significant challenge.


    By considering the human genes for about 3 billion base pairs, a human genome
    creates about 100 terabytes of data in the file format of BAM (Binary Version
    of Sequence Alignment/Map), and VCF (Variant Call Format). Moreover, the BAM file
    size in a sequencing experiment is found by the count and read length. For a single
    sample of 30 WGS data, the FASTQ file could be around 250 GB, the BAM file could
    be around 100 GB, the VCF file could be around 1 GB, and the other annotated files
    could be around 1 GB. And, by considering the estimated file sizes of various
    NGS data formats, it is time-consuming to generate such files.'
