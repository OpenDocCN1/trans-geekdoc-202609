    - Big Data Technologies: The technology-driven way of life has triggered the usage
    of IoT and the generation of Big Data by IoT related to automobiles, healthcare,
    business, industry, meteorological devices, the military, smart devices, agriculture,
    e-governance, e-commerce, etc. As IoT is inseparable from Big Data, the implicit
    potential of Big Data is harnessed using the appropriate tools for data engineering,
    information processing and analytics, using HBase, MongoDB, etc. [7].

    - Cybersecurity: The IoT devices are prone to security threats due to the vulnerable-open-source,
    APIs (application programming interfaces), security integration, unpatched software,
    test cases as well as limited visibility on the integration of IoT components.
    These threats can be suitably mitigated through data encryption API security,
    periodic open-source software updates, authentication schemes, compliance of IoT
    standards and DNS (Domain Name Server) filtering [8].

    - Software-Defined Networking (SDN): SDN is an emergent architecture which offers
    flexible and dynamic centralized network management. It has a special feature
    of decoupling network control and data functions. This ensures higher-order abstraction
    and programmability for the network control plane [9]. Some of the SDNs available
    on the market are: Cisco DNA Center, Cisco ACI, IBM Cloud Internet Services, Cradlepoint
    Engine, VMware NSX, and IBM Networking Services for Software Defined Networks
    [10].


