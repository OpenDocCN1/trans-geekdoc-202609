  md: '# 132 Machine Intelligence


    +   Sensors or devices are generated to generate or gather data from their respective
    environment. These gadgets are the bridge between the digital and the real world.
    The data can be simple, reading a temperature or complex, such as recording a
    video. An IoT set-up can have single or multiple sensors. For instance, a smartphone
    has multiple sensors, such as motion sensor, light sensor, geoposition sensor,
    environment sensor, proximity sensor, compass sensor, biometric sensor, meters,
    probes, gadgets, and actuators to measure various parameters.


    +   Connectivity is the crucial element that provides physical/virtual connectivity
    among the sensors/devices through Wi-Fi, Bluetooth, cellular satellite, low-power
    Wide Area Networks gateway, routers, Ethernet, etc. The optimality of connectivity
    is decided by the quantum of power consumption, range coverage, and its bandwidth


    +   Data processing with handling raw data (batched or streaming data), formatting
    data (Spreadsheet, plain text, files, etc.), data storage (into local, remote
    cloud storage), processing and preparing output, and visualization [11].


    +   User-interface deals with the delivery of information to the end-user, in
    a human-interpretable form. This can be accomplished through command line, menu-based,
    form-based, voice-based, and graphical user interface (GUI). Alexa and Siri are
    the typical examples of voice-based interfaces.


    The other important elements of IoT are security, gateway, application, and user.

    in general, the seven layers of IoT are delineated as: (1) sensors; (2) sensor
    to gateway network (e.g., BLE, LoRaWAN, ZigBee, and Sigfox); (3) gateway (routers/
    methods); (4) gateway to network (Ethernet, Wi-Fi, satellite, cellular); (6) internet-to-user
    network (user-view of the processed data); and (7) value-added information (visualization
    of data for better insights leading to strategic decisions).


    A few trivial applications of IoT are [13]:


