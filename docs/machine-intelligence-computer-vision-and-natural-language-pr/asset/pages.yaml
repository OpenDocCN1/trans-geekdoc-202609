- pgno: 77
  md: '# 3.2.4.2 Less Bandwidth Consumption


    The large amount of data generated by different applications consumes lots of
    bandwidth while travelling from source to remote cloud data centre. This can be
    reduced by incorporating edge devices, as most of the time-constrained requests
    can be processed locally by the edge computing. The edge/fog can also filter data
    and perform analytics and forward only the required data to the remote cloud.
    This greatly reduces the bandwidth consumption, making it preferable.


    # 3.2.4.3 Mobility Support


    Fog/edge computing supports mobility with the help of protocols, such as Locator
    ID Separation Protocol (LISP). LISP is an RFC 6830 standard protocol developed
    by the Internet Engineering Task Force LISP Working Group. The LISP protocol decodes
    the location information from the host packet and provides the required mobility
    support for applications using edge computing.


    # 3.2.4.4 Heterogeneity


    Heterogeneity refers to different types of elements and technologies involved
    in the edge computing infrastructure. The edge computing elements include the
    end devices, servers and the edge network which performs a variety of functions.
    The APIs, communication protocols, policies and platforms involved also contribute
    to the heterogeneous nature of edge computing.


    # 3.2.4.5 Location Awareness


    Applications which require location awareness such as transportation and utility
    management require edge/fog computing environment. Cloud computing does not support
    geographically based applications due to lack of the location awareness feature.
    The edge/fog helps collect and process information based on geographic location.


    # 3.2.5 Benefits of Edge/Fog Computing


    # 3.2.5.1 Cost


    Edge/fog servers reduce the cost of building a cloud-like infrastructure. The
    maintenance of edge servers is also easier, compared to the cloud. Companies can
    easily set up an edge computing environment and can monitor and maintain it with
    comparatively lower costs. The implementation as well as the maintenance of the
    edge/fog can bring lower costs.'
