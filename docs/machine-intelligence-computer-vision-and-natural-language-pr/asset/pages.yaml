- pgno: 161
  md: '# IIOT Applications and Services 137


    +   - Predictive maintenance: Predictive maintenance involves identifying a machine''s
    need for maintenance before an emergency arises and output must be stopped immediately.
    Thus, implementation of data acquisition, analysis, and management are needed
    to avoid such unexpected situations. IoT uses sensors that transmit alerts when
    specific damage indicators appear. The real-time data are gathered from the sensors
    on-the-fly, in order to track the robots or machines. The advanced algorithms
    are used to send alerts when the monitoring parameters, such as temperature, pressure,
    etc., cross the prescribed upper/lower threshold level.


    +   - Intelligence systems for improvements: IoT generates virtual data that is
    either directly or indirectly to streamline and optimize the key resources and
    processes. This may lead to the creation of generic/problem-specific operational
    intelligence and business intelligence models.


    +   - Pinpoint inventories: IoT is also used for automated inventory monitoring
    and tracking. This process may help in optimized inventory management, supply
    chain management, and marketing.


    +   - Quality control: IoT devices are deployed for quality control of process
    and products, at every stage of manufacturing.


    # 7.5.2 IoT Sensors


    The sensors are the most significant component of the IoT hardware. The IoT sensors
    commonly used in the industry are primarily categorized into four types: (1) mechanical
    sensors; (2) thermodynamic sensors; (3) electrical sensors, and (4) geospatial
    sensors:


    +   - Mechanical sensors: The real-time mechanical sensors can monitor both static
    (time-invariant inputs) and dynamic (time-variant inputs). These types of sensors
