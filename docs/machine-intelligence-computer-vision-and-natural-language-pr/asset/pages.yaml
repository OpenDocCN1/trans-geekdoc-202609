- pgno: 31
  md: '# A New Frontier in Machine Intelligence ■ 7


    discussions have closely followed the similar debate about artificial intelligence
    [2, 20, 21, 22].nBroadly speaking, the arguments fall into the following groups:


    +   1. Some researchers have proposed a test for artificial creativity on the
    lines of the Turing Test for judging artificial intelligence as “the philosophy,
    science and engineering of behaviors that unbiased observers would deem to be
    “creative” [23]. This does not presume any priori criteria and relies only on
    human judgment.

    2. The second camp proposes to define a criterion for creativity and then test
    to see if any of the machine-generated works would muster. For example, Boden
    [2] defined creativity as “the ability to come with ideas or artifacts that are
    new, surprising and valuable.” Of course, three attributes listed here are not
    objectively measurable and necessarily assume human judgment and subjectivity.

    3. The third stream of discussion is the one Alan Turing [24] referred to as “Lovelace
    objection,” after Ada Lovelace, the celebrated English mathematician whom might
    consider be the first computer programmer. She wrote: “[The Analytical Engine
    of Charles Babbage has no pretensions to originate anything, since it can only
    do whatever we know how to order it to perform.]. The famous “Chinese room” experiment
    of John Searle [25] for Artificial Intelligence is in a similar vein. It goes
    something like this: imagine a scenario where a person ignorant of Chinese language
    and script assembles sets according to an instruction manual using cards that
    have Chinese logograms. The long chain of symbols thus assembled meaningless to
    the person assembling it, but to a person who knows Chinese, they may make perfect
    sense. As per this scenario, the output of any computer program (including AI)
    may surprise its creators, but it does not constitute intelligence (or creativity)
    on the part of machines in any human sense.


    As can be seen from the above, the debate is far from settled and there are valid
    arguments on all sides. Meanwhile, surprising, useful, and sometimes aesthetically
    pleasing results are obtained by programs that use increasingly sophisticated
    techniques and datasets, as seen in Section 1.3.


    # 1.5 Artificial Creativity and Copyright


    AI-assisted creation of works could have significant ramifications for copyright
    law. Traditionally, most definitions of originality to grant the copyright for
    a work need a human creator, and tools such as a brush or pen do not matter for
    the purpose of copyright determination. In the same vein, for computer-generated
    work, the'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Machine Intelligence


    computer and the program used for generation have been seen as more tools in the
    creative process. But with the advent of sophisticated AI paradigms, the program
    is not just a tool; it makes many “creative” decisions to produce an output that
    is novel, useful and surprising to humans. Therefore, the long-held legal doctrines
    and policies are being tested in the new AI-driven world [26].


    While looking at the copyright and AI-created, two types of situations have to
    be considered: (1) how work “created” by AI should be protected, if all (AI as
    producer); and (2) to what extent the data and algorithms used in training the
    AI might constitute fair use and infringement (“AI as consumer”) [27].


    The question of “authorship” must be decided first when considering the provisions
    of copyright laws to any work in general, and AI-generated work in particular,
    since the author is the first owner of the copyright. For AI-generated work, this
    question is not easy to answer. The candidates for authorship range from the programmer
    who created the system, the user who might have given inputs at “runtime,” the
    AI computer system itself, and finally the investors who funded the efforts. In
    most jurisdictions including the US and EU countries, the law does not recognize
    non-human authorship. In a recent case involving selfies by monkeys, the US Court
    rejected its legal standing for animals to claim copyright [28]. The same logic
    may then be extended to machine-generated/assisted work.


    In terms of “AI as consumer” of copyright, it is known that lots of data are consumed
    in training the AI models. Some of this data, in terms of text, images, or music,
    may be owned by third parties. Whether there would be any liability or not resulting
    from the use of such data would depend on the application of the “fair-use” doctrine
    that covers transformative and derivative products that are not market substitutes
    of the original copyrighted material (e.g., making thumbnail images and storing
    them for training).


    The topic of copyright for autonomously generated creative work using machines
    is quite quiet, and the legal thinking is still being shaped in the important
    jurisdictions [29].


    # Conclusion


    In this chapter we have seen a brief history of using machines to produce creative
    work. We also saw the debate this has generated right from the start about the
    very nature of creativity and whether machines can be creative. In many ways,
    the arguments, both for and against, parallel those that are familiar from the
    debate on the nature of artificial intelligence. After outlining representative
    samples from the early attempts at machine creativity, we saw the virtual explosion
    of the use of AI in what are traditionally considered creative fields such as
    painting, writing poetry, proving mathematical theorems, or playing complex strategy
    games, etc.'
