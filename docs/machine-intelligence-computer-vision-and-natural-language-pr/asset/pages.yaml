    # 3.2.4 Edge/Fog Computing Characteristics


    Edge/fog computing has many characteristics [5], which are similar to the cloud
    computing. However, there are some characteristics which differentiate cloud computing
    from edge/fog computing,


    # 3.2.4.1 Low Latency


    One of the most promising characteristics of edge computing is latency reduction.
    The latency can be defined as a delay in communication in simple terms. It refers
    to the overall delay happening for packets from the source to the destination,
    right from packet transfer by the sender to decoding at the receiver side. As
    the edge computing performs computations at the edge of the network, latency can
    be considerably reduced compared to cloud implementation.'
