    a minor root (scattered with low density). In the visual inspection technique
    by CCTV video images, a large number of inspection images are mostly conducted
    manually to identify types and locations, which is time-consuming, costly, labor-intensive,
    and inaccurate. Computer vision is performed by a computer or machine that can
    recognize digital images or videos [11]. The computer vision techniques [12, 13]
    are Haar detector [14], SIFT [15], HOG [16] using larger HOG filters [17] and
    the deformable part-based model (DPM) [18]. However, these methods require the
    complex manual design of the feature extractor and training process, which are
    inefficient. The digital image processing techniques are segmentation [19], histogram
    equalization, and transformation.


    Deep learning-based approaches have been developed for object detection [20] to
    address the limitation of conventional methods. The R-CNN uses region proposals
    generated through an external method called selective search for the input image.
    Each warped region proposal is forwarded to a CNN model to compute the features
    into a support vector machine (SVM) [14] classifier to calculate the classification
    scores. Box regression is then conducted for the classified image that the location
    of each object can be predicted. One limitation of R-CNN is that the multi-stage
    training process is time-consuming and requires large computation cost. In addition,
    the detection speed is slow for each as the convolution, classification, and regression
    need to be implemented for each region.


    The fast R-CNN is applied to the input image to produce the feature map, on which
    the region proposals (RPN) [21] are generated by the selective search. Through
    a Region of Interest (ROI) pooling layer, the generated region proposals are converted
    into fixed-length layers, which are fed into the fully connected layers for both
    classification and bounding box regression. Compared with RNN, fast R-CNN [22]
    performs training using multi-task in a single-stage manner, which greatly reduces
    the training time. The detection is faster because the convolution is only conducted
    once for the original image of all the region proposals, and the detection accuracy
    is improved. Cheng et al. have adopted a method to identify cracks depending on
    conventional computer vision technique using R-CNN with deep learning techniques
    [6]. The detection model is trained using 3,000 images collected from CCTV inspection
    videos of sewer pipes.


    After training, the model is evaluated in terms of detection accuracy and computation
    using mean average precision (MAP), meeting detection speed, and training time.
    Specifically, the experiment of dataset size and convolutional layers can improve
    the model''s accuracy. The experiment results demonstrate that dataset size, initialization
    network type, training mode and hyper-parameters model performance are improved.
    The adjustment of hyper-parameters such as filter dimensions or stride values
    contributes to higher detection accuracy, achieving MAP of 83 percent accuracy
    and faster detection speed in the sewer pipe. It is very efficient for the automated
    detection of sewer pipe defects in CCTV.'
