    HUSH! THE STORM HAS BURST.


    A program called JAPE was constructed in 1981 at the University of Edinburgh [5].
    It produced short running puzzles such as:


    +   - What is the difference between leaves and a car?

    - One you brush and rake, the other you rush and brake.

    - What is the difference between a pretty glove and a silent cat?

    - One is a cute kitten; the other is a mute kitten.

    - What do you call a strange market?

    A bizarre bazaar.


    In the 1960s, the early computer artists, especially for visual art, one of the
    significant limitations was the output. Plotters, connected with a brush or pen,
    were used in early experiments. An example of a complex algorithmic work from
    that period was a screen-print of a drawing artiste, titled “Hommage à Paul Klee’s
    oil painting entitled "13/9/65 Nr. 2," created by Frieder N in 1965. The work
    was inspired by Paul Klee’s painting entitled “Highroads and Byroads” (1929) [3].


    One of the pioneers of computer art or what is now called generative art, was
    Harold Cohen. He was an accomplished painter and an outstanding engineer. developed
    a system called AARON that became increasingly sophisticated (and large in size),
    and the output was exhibited at prestigious museums and galleries [6]. When asked
    who was the artist, Cohen or Aaron, Harold gave the relationship between Renaissance
    painters and their assistants. This question of authorship, which appears quite
    academic and abstract, has some serious commercial and legal implications. We
    will discuss this in the section related to intellectual property (IP) rights.


    With the advent of Artificial Intelligence (AI), the “picture” for computer activity
    changed dramatically. This was due to the availability of powerful algorithms
    and computational power coupled with advances in the related fields such as 3D
    printing and interactive display technologies.


