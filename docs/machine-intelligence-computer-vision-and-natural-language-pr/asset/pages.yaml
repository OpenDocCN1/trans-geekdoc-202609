    In short, cloud computing helps to reduce the infrastructure and maintenance costs
    by providing on-demand access to a pool of resources, including software, databases,
    storage, etc. and provides numerous services to users by per use. One of the major
    drawbacks of cloud computing lies in getting a response as the data centres are
    in geographically remote locations. The cloud also suffers from security and privacy
    issues and higher bandwidth consumption. The introduction of edge/fog computing
    solves many issues related to cloud implementation. Section 3.2 gives an introduction
    to edge/fog computing, defines the architecture, the benefits of edge/cloud integration,
    applications and discusses research challenges to be addressed when integrating
    edge/fog to the cloud environment.


    # 3.2 Edge/Fog Computing Basics


    The explosive growth of technology has resulted in newer innovations, such as
    the IoT, which continuously generates millions of data. The IoT greatly relies
    on the cloud for storage and processing due to its power-constrained nature. The
    large volume of data which is transferred back and forth in cloud data centres
    creates network congestion and increased network bandwidth utilization. This also
    creates prolonged delay in getting a response which affects the performance of
    IoT devices. Edge/fog computing brings processing nearer the IoT devices, thereby
    reducing latency and delay.


    # 3.2.1 Edge Computing Computing


    Edge computing refers to performing the processing at the edge of the network,
    which can be in the IoT sensor itself or the gateways [3]. The time-sensitive
    data will be analysed and processed in the network''s edge and the response will
    be immediately sent to the end devices. Many companies are making the shift from
    cloud to edge or have incorporated the edge as a middle layer to improve the performance
    of the existing applications.'
