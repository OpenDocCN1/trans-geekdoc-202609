    # 13.1.5 Structure of Intelligent Agents


    The intelligent agent is the autonomy to complete specific, repetitive and predictable
    tasks for users and applications. It is also called intelligent because of its
    learning ability based on experience. The two main functions of the structural
    intelligent agents (SIA) are action and perception. Actions are performed through
    actuators and the perception through the sensors. Intelligent agents also have
    sub-agents which forms a hierarchical structure. Both the higher- and the lower-level
    agents combined form a system which could solve problems through the intelligent
    response and behavior.


    The features of intelligent agents are:


    +   - Level of autonomy helps to perform certain work.

    - Learning ability through prior experience.

    - Interaction with agents, humans and systems.

    - Intelligent agents can adapt to the new rules incrementally.

    - Goal-oriented system.

    - Intelligent agents are knowledge-based through processing, communication and
    entities.


    The intelligent agents have five categories. Grouping of these agents is based
    on their capabilities and the level of superficial intelligence. Figure 13.3 shows
    the categories of intelligent agents. The five categories are:


    +   1. Simple reflex agent.

    2. Model-based reflex agent.

    3. Goal-based agent.

    4. Utility-based agent.

    5. Learning agent.'
