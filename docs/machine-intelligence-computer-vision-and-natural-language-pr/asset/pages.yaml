    # 10.1 Introduction


    Lane detection is a critical component when driving heavy vehicles. This is done
    by using computer vision methods with the help of the OpenCV library [1]. Lane
    detection is performed by looking for white marks on both sides of the lane and
    patterns with color. The number of people driving along the nation''s highways
    without proper sleep is uncountable, causing accidents. Using Python, OpenCV,
    and Keras, the driver will be alerted to drowsiness and avoid accidents [2]. The
    concept of driving in the right lane refers to avoiding the risk of moving into
    another lane without the knowledge of the driver, which leads to accidents [2].
    Lane departure signals and lane-keeping signals are the warning signals. Sleep
    deprivation is a problem for truckers who travel long distances. As such, driving
    while sleepy becomes extremely dangerous as the driver can wander into the wrong
    lane, we recommend a portable system to monitor a driver''s actions that can sit
    on the windshield or any surface.


    Humans have developed technology to simplify and protect their lives, whatever
    they are performing mundane tasks, such as going to work [2] or more complex ones,
