- pgno: 74
  md: 'The edge nodes are designed to be capable of performing computational tasks
    locally. Apart from this, edge devices are configured to request and respond to
    data from remote cloud data centres. Edge nodes can perform data storage and analysis,
    computational offloading, processing, and request and response services, as well
    as distribute request and delivery services from remote cloud data centres to
    the user. As edge nodes are capable of doing these tasks, they should be designed
    in such a way that reliability, usability, privacy and security be top priority.
    The architecture must also support requirements such as differentiation, extensibility,
    isolation, and reliability.


    Edge computing has numerous definitions in the literature. Edge computing is an
    autonomous computing model which includes a set of heterogeneous devices arranged
    in a distributed manner that communicate with the underlying network and perform
    computing tasks, such as data storage, analytics and processing [4]. The edge
    computing can be implemented as a lease-based service, if without needing to build
    the necessary infrastructure. Mobile edge computing is a similar term to edge
    computing, which helps mobile users to access the features of edge computing.
    Terms as Cloudlets, MicroCloud, fog, etc. are terms for edge computing which are
    designed as subsidiaries to cloud technology.


    # 3.2.2 Fog Computing


    Fog computing is synonymous with edge computing with the difference being only
    in location where the data is processed. The fog follows a distributed architecture
    where the incoming tasks are offloaded to different fog nodes [2]. In fog computing,
    the processing happens in LAN hardware or processors attached to a LAN. This also
    greatly reduces the response time and reduces latency issues.


    According to Cisco, fog computing can be defined as an extension of the cloud
    computing paradigm from the core of the network to the edge of the network. It
    is a highly virtualized platform which supports processing, analytics, data storage,
    and networking services between edge devices and cloud servers. The fog services
    are usually evaluated using the Quality of Service (QoS) metric. The QoS is usually
    evaluated on four parameters: (1) connectivity; (2) reliability; (3) capacity;
    (4) delay.


    Connectivity refers to the ability to stay connected to the network using the
    appropriate protocols. As the fog follows a distributed nature, failure of one
    fog node will not affect the connectivity. Reliability is the measure of error-free
    the data. Fog computing performs processing in close proximity to the edge devices.
    This will considerably reduce the errors and issues which can happen for data
    which travel long distances. This ensures reliability in fog computing.


    Capacity is defined by bandwidth usage and storage. Capacity needs be improved
    based on how well the data is offloaded to different fog nodes and how well the
    filtering is performed and the cloud resources are utilized. Delay is the time'
