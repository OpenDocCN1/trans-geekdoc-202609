- pgno: 1
  md: '# Machine Intelligence


    Machines are being systematically empowered to be interactive and intelligent
    in their operations, offerings, and outputs. There are pioneering Artificial Intelligence
    (AI) technologies and tools. Machine and Deep Learning (ML/DL) algorithms, along
    with their enabling frameworks, libraries, and specialized accelerators, particularly
    useful applications in computer and machine vision, human-machine interfaces (HMIs),
    and intelligent machines. Machines that can see and perceive offer deeper and
    decisive acceleration, and augmentation capabilities to businesses as well as
    to people in their everyday tasks. Machine vision is becoming a reality because
    of advances in the computer vision and device instrumentation fields. Machines
    are increasingly software-defined. That is, vision-enabling software and hardware
    modules are being embedded in new-generation machines to be self-, surroundings,
    and situation-aware.


    Machine Intelligence emphasizes computer vision and natural language processing
    as drivers of advances in machine intelligence. The book examines these technologies
    from the algorithmic level to the applications level. It also examines the integrative
    technologies enabling intelligent applications in business and industry.


    Features:


    +   - Motion images object detection over voice using deep learning algorithms

    - Ubiquitous computing and augmented reality to HCI

    - Learning and reasoning using Artificial Intelligence

    - Economic sustainability, mindfulness, and diversity in the age of artificial
    intelligence and machine learning

    - Streaming analytics for healthcare and retail domains


    Covering established and emerging technologies in machine vision, the book focuses
    on recent and novel applications and discusses state-of-the-art technologies and
    tools.


    Pethuru Raj is the chief architect in the Site Reliability Engineering (SRE) division
    of Reliance Jio Platforms Ltd., Bangalore, India. He previously worked as a cloud
    infrastructure architect in the IBM Global Cloud Center of Excellence (CoE), as
    a TOGAF-certified enterprise architecture (EA) consultant in Wipro Consulting
    Services (WCS) Division and as lead architect in the corporate research (CR)'
  merge: -1
  img_proc: true
