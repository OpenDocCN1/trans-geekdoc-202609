    Some issues that arise while handling genomic data are described below,


    # 16.8.2 Privacy


    Privacy is one of the most sensitive issues in data science. In fact, the public''s
    current privacy concerns regarding surveillance cameras, financial transactions,
    and email communication are nowadays difficult to detect due to the cross-reference
    of larger datasets, quasi-identifier is the best example for this. While genomics-based
    privacy has some distinct characteristics compared to data science-based privacy
    issues, the fact is that the genome is crossing across generations and is very
    important to protect. Moreover, revealing genomic data is more dangerous than
    leaking other kinds of data. Once a person''s data or their relative variants
    are revealed or leaked, they may not be able to take them back. Finally, genomic
    data are far larger in size than several other kinds of personal data; for example,
    the genome contains more confidential information than a social security number
    or credit card.


    # 16.8.3 Data Ownership


    Privacy is a major concern in data management. An individual entity or patient
    owns their personal information, a coercive trend in this biomedical science is
    that the researcher who produces a dataset manages. Researchers with large datasets
    have a long history that supports them in analysing the data over the period in
    order to discovering stories. In particular, health data has commercial and medical
    value, so corporations and governments often claim control and ownership of large
    datasets. According to data miners, all information should be accessible, since
    this would allow any aggregation of massive amounts of data, better statistical
    analysis, and optimal outcomes. In fact, combining large datasets results in increasingly
    better genotypes correlated with phenotypes. Furthermore, we estimate that sharing
    biases, such as particular diseases, pathologies, and phenotypes, and being more
    enthusiastic to share genetic data would occur in an ideal case, in which individual
    users were committed to free access and the dataset became entirely accessible
    and freely transferred by the users.


    Skew in the dataset can be caused by education, socio-economic status, and healthcare
    access, all of which can be bias mining efforts, including knowledge extraction.
    Likewise, around 80 percent of participants in genome-wide association studies
    are of European ancestry, despite the fact that group makes up only 16 percent
    of the global population. As a result, complete data sharing is unlikely to be
    practical in the future for the best genomic studies. The development of a large
    private'
