    creativity involves the generation of novel ideas by the exploration of existing
    ideas or constructs, while the transformational creativity involves generation
    of novel ideas and constructs by transformation of an existing idea space in such
    a way that the new constructs bear little or no relation to the existing ones.


    The attempts to get computers to do something that can be fun or interesting ("creative")
    apart from mathematical computations started with the widespread availability
    of computers. In this chapter, we will briefly discuss the history of such efforts.
    We will then see some examples of creative output generated by computers using
    AI. Next, the legal and intellectual property rights implications of the output
    autonomously generated by computers will be covered. We will conclude with the
    outline of the philosophical debate around the artificial creativity domain.


    # 1.2 A Short History of Computer Creativity


    As mentioned earlier, people started exploring what computers can do, apart from
    lightning-fast computations, as soon as computers were available. One such earliest
    "artwork" in the Victoria and Albert Museum, London, is a long exposure photo
    of waves on a fluorescent screen of an oscilloscope, obtained by Ben Laposky in
    1952 [3].


    Another example of "combinatorial creativity" was a program called "Computerized
    Haiku," written in 1968 by Margaret Masterman and Robin'
