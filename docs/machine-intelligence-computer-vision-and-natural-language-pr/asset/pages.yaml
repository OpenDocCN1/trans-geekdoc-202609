    (Amulya et al., 2022; Bhagat and Bakariya, 2022; Jorvekar and Gangwar, 2022; Shah
    et al., 2022).


    +   2. Unsupervised learning: Unsupervised learning does not require definitions
    or any sort annotations or labels to be associated with the dataset. Basically
    unsupervised learning technique does not need a training dataset.


    +   3. Semi-supervised learning: Semi-supervised learning includes both labeled
    and unlabeled datasets during the process of training. The amount of effort put
    in by the humans can be reduced by a considerable amount by adopting a semi-supervised
    learning technique. Semi-supervised learning also results in a decent accuracy
    score. Aspect-associated opinion mining mechanism can be carried out using the
    semi-supervised learning mechanism. It is quite easy to obtain and capture the
    opinions of sentiment-rich dataset (Nandekar and Patil, 2022). Semi-supervised
    techniques are popular in the domain of Twitter sentiment analysis (da Silva et
    al., 2016).


    +   4. Supervised learning: Research is carried out by adopting a supervised machine
    learning technique that needs a labeled training dataset, which it cannot be implemented
    for any tasks. Classification of tweets as positive, negative or neutral can be
    carried out using the supervised machine learning techniques. Some of the most
    widely used supervised models for Support Vector Machine, Logistic Regression,
    Random Forest, etc.


    +   5. Deep learning based approaches: Machine learning has given rise to an interesting
    sub-field in Computer Science, ie., deep learning. Recently, researchers have
    incorporated several deep learning algorithms for Twitter sentiment algorithms
