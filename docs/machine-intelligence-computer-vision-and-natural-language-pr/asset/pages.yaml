  md: '# Edge/Fog Computing ■ 49


    The introduction of edge/fog computing has greatly reduced the delay in getting
    a response in time-sensitive applications [2]. The edge/fog layer is not an independent
    entity. It relies on the cloud for further processing and permanent storage of
    data. Thus, the end devices, the edge/fog layer and the cloud together form the
    architecture for many applications. Any technology, the edge/fog also has a few
    drawbacks which are an area where active research is still on. The recent research
    shows that the latency, response time, delay, etc. can be considerably reduced
