    # 14.2.8 Levels of Sentiment Analysis


    +   1 Aspect-based sentiment analysis: The conventional document-based classification
    of sentiments aims to analyze the general emotion of a particular text and classifies
    the text as positive, neutral or negative. Aspect level sentiment analysis tries
    to figure out the emotion behind a particular aspect in a specific context.


    +   2 Document-based sentiment analysis: The entire text is considered as a whole
    for analysis (Wang et al., 2014). However, there are a few challenges in adopting
    document-level sentiment analysis as there could be several contradictory opinions
    expressed in a single document in multiple ways (Kumar and Teeja, 2012).


    +   3 Sentence-based sentiment analysis: Specific statements or sentences in a
    particular document are considered. The polarity associated with each sentence
    is analyzed.


    There are challenges with respect to sentiment analysis. Sentiment analysis is
    dependent on the domain, hence the problem of domain arises. Opinion mining depends
    greatly on the language under consideration. Linguistic dependency is a major
    issue that creates problems while implementing sentiment analysis. Vast amounts
    of research are being carried out, using the English corpus as a dataset. Chinese
    and Spanish languages are also considered useful for sentiment analysis. Not much
    is researched in the field of opinion mining is carried out on other languages.
    Opinion mining models that try to work on datasets incorporating several languages
    is quite challenging (Kumar and Garg, 2019; Qazi et al., 2017). Opinion spans
    need to be detected (Qazi et al., 2017). Detection of opinion spans is still challenging
    in opinion mining, as fake opinions quickly spread across the web (Vesought et
