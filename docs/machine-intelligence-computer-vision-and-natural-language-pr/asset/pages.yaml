    # 14.5 Conclusion


    The total number of tweets considered for analysis is 500 (tweets from May 2021).
    The number of tweets after removal of duplicate tweets is 498. Textblob library
    of Python was considered to determine the polarity of the tweets. The number of
    positive tweets in the dataset is 216 and the number of negative tweets in the
    dataset is 79. Comparing the number of positive tweets and negative tweets, the
    number of positive tweets is more, i.e., 216. A novel algorithm which is a culmination
    of machine learning, deep learning, nature inspired techniques and artificial
    neural networks is implemented. The suggested model is an ensemble of decision
    tree algorithm, gradient boosting, logistic regression and genetic algorithm based
    on the auto encoder technique. The objective of the research was to classify the
    tweets as positive or negative for the considered dataset, that is from the month
    of May 2021. The proposed ensemble technique resulted in an accuracy score of
    81.25 percent.


