  md: '# 14.2.5 Extraction of Aspects


    Aspect extraction is one of the major tasks involved in sentiment analysis (Wu
    et al., 2022). In a particular scenario there be a target entity, for example,
    the target entity can represent a product, an event, a person or an organization
    (Kumar and Sebastian, 2012). The concept of fine-grained sentiment analysis is
    quite popular (ibid.). Extraction of aspects considering blogs that do not have
    any specific topics and social media data like Tweets is extremely important.
    Several methods are used for the extraction of aspects. The conventional and the
    first foremost method to implement extraction of aspects is analysis based on
    frequency. The analysis based on frequency identifying regularly incorporated
    compound nouns and nouns that can most probably correspond to aspects. A significant
    approach for frequency-based analysis for aspect extraction says that if the noun
    or compound noun occurs at a minimum of 1 percent of the statements, then it can
    be represented as an aspect. The next way to figure out the aspects is by analyzing
    the aspects that before a modifying adjective is a word carrying emotions. Through
    this method, aspects that do not occur frequently can be discovered. An algorithm
    based on syntax is suggested by Qiu et al. (2009).


    # 14.2.6 Datasets Associated with Sentiment Analysis


    The contents generated by users are generally adopted by researchers to carry
    out sentiment analysis. The dataset considered for analysis depends on the field
    in which opinion mining is performed. The datasets associated with social media
    sites like Twitter and Facebook are highly subjective in nature (Valle-Cruz et
    al., 2022). The language adopted is informal across the social media sites, whereas
