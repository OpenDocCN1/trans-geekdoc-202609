    3]. It is expected that approximately 19,500 sewer pipe systems [4] can handle
    the flow of 50 billion gallons of raw sewage but most of the sewer systems have
    become obsolete, as they are 30–100 years old [5]. There are various sewer pipe
    defects such as cracks, deposits, and infiltrations.[6]. For example, cracks [7,
    8] are divided into longitudinal cracks (same orientation of the pipeline), vertical
    cracks (orientation is vertical to the pipeline) and complex cracks consisting
    of both longitudinal and vertical ones [9].


    Deposits are of different types, such as attached deposits (attached to the pipe
    wall) and settled deposits (settled on the pipe ground) [10]. As for the tree
    root intrusion, this can be a mass root intrusion (high density or large occupying
