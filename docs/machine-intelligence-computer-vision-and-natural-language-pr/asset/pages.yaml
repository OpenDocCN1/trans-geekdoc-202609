    The right information at the right time by the IoT devices helps the managers
    to receive the relevant information related to the maintenance, so that the mitigating
    tasks can be planned well ahead. The predictive maintenance benefits in increasing
    safety and extending the lifetime of the plants/equipment as well as avoiding
    accidents and hazards [29].


    # 7.11.2 Smart Metering


    A smart meter is an internet-enabled device that detects the amount of energy,
    water, or natural gas used by a building or residence. The conventional meters
    can track only the total consumption whereas smart meters are able to detect the
    quantum of resource consumption, along with the time-stamp. Industries make use
    of smart meters to track the consumer usage as well as to fix the price as per
    usage. Moreover, this approach is helpful in hazardous industries like mining
    as well as with widely dispersed equipment or heavy reliance on environmental
    conditions. To avoid squandering resources or overloading its energygenerating
    equipment, the energy sector relies on smart metering and remote monitoring [30].


    # 7.11.3 Location Tracking


    GPS systems, RFID tags, and other wireless technologies can be used to track assets
    and locations and provide up-to-date information to the companies.


    # 7.11.4 Location Services


    These are frequently used by logistics organizations to track goods whilst in
    transit; and to reroute the drivers, when needed. Location-based IIoT technology
    can be used in industrial warehouses to track the materials. These services enable
    the employees to quickly locate the materials.


    # 7.11.5 Remote Quality Monitoring


    IoT sensors are used by organizations such as the Environmental Protection Agency
    to continuously monitor the quality of environmental resources and goods, using
    water sensors, air sensors, etc., based on their timely, reliable, relevant, and
    accurate data on environmental pollutants. These IoT sensors can be used by industries
    related to chemical processing and pharmaceutical to remotely check the quality
    of materials or products. Employees can quickly verify numerous processes, then
    the remote monitoring tasks increase productivity. Similar to this, real-time
    notifications promote quicker reactions, preventing accidents that, if not caught
    in time, could endanger the product [31].'
