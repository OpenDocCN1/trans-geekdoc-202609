    IoT can be deployed in a toothbrush and can be scaled up for a massive manufacturing
    industry [2]. The Internet of Things variously can be found in a heart monitor
    that analyzes the heartbeat of a person, a biochip transporter that provides a
    unique identification number for an animal [3], a sensor in an automobile that
    can alert the driver when the air pressure of a tire drops, [4]. IoT devices can
    be interfaced without a keyboard or a screen. The virtual assistants such as Alexa
    and Siri are IoT-enabled software that gathers information across the globe. From
    the industrial perspective, IoT devices produce a rich set of data, which plays
    a vital role in automated operation control for decisive, prediction-based safety
    and security measures [5].'
