    # 5.3.4 YOLOv4 Architecture


    Already we have discussed YOLO, which is one of the most famous object detection
    algorithms due to its speed and accuracy. YOLOv4 is intended for this process,
    based on recent analysis findings, using CSPDarknet53 as a backbone, SPP (spatial
    pooling pyramid) and PAN (path aggregation network), which is referred to as "the
    Neck", and YOLOv3 for "the Head". The network contains 53 convolution layers with
    the sizes of 1x1 and 3x3, and every convolution layer is connected with a batch
    normalization (BN) layer and Mish activation layer. SPP may be a methodology to
    exploit both fine and coarse information by simultaneously pooling on multiple
    kernel sizes (1, 5, 9, 13). PAN is a technique that leverages information in layers
    to the input by merging features from completely different backbone levels to
    the detector. This model contains 53 convolution layers, each followed by a batch
    normalization layer and Leaky ReLU activation. Predicting the output contains
    the centre of the ground truth of an object, which predicts the image. The centre
    of an image is responsible for the detection of objects, and also predicting through
    probabilities that the box contains a class class.


    # 5.3.4.1 Intersection over Union (IoU)


    Intersection over Union employs mean average precision (mAP) is found. This is
    a number from zero to one that specifies the quality of overlap between the predicted
    and ground truth bounding box.'
