    # 15.2 Use of AI to Create an Agricultural Database


    One of the pressing challenges in India pertains to the absence of a comprehensive
    national database encompassing essential information on land use, soil health,
    crop patterns, disease prevalence, and agricultural extension services. The landowners
    have difficulty finding agricultural labour and water for the soil. Some landowners
    converted their properties into multi-story buildings, schools, and colleges.
    In most cases, the land''s viability for cultivation was finished, and farmers
    are familiar with one type of cultivation. That main issue with tobacco cultivation.
    At present, tobacco cultivation in India is declining not as a result of any livelihood
    training but as a result of decreased land vitality for the tobacco product. A
    farmer who knows rice cultivation is generally familiar with the entire process.
    However, they are concerned shifting cultivation to other crops because they are
    unfamiliar with the whole process and the markets. For Indian agriculture to be
    sustainable, there is an urgent need for scientific intervention. There are agricultural
    offices in every district in India, and the government employs qualified professionals
    in each of these offices. Much of the work is not being done as it should. The
    potential solution is an interactive app that understands the local language and
    answers all of the farmer''s questions in the local language. The challenge is
    obtaining the information from the local language database, which must exist.
    It would take some time for such inter-app to learn most aspects of agriculture.
    Ideally, the learning algorithm of such technology can be automated, which has
    its own risk of providing incorrect information. The best answer is a human teacher,
    but takes time and money, and it is the best way to go. In the meantime, a local
    language database on agriculture must be built, which is a costly endeavour, given
    that India has 1,652 or more languages. Koch languages are on the verge of extinction;
    there are opportunities to preserve many languages using machine learning and
    AI to teach the same language with the same intensity to non-native populations
    from other parts of the world. We can preserve a great civilization and avert
