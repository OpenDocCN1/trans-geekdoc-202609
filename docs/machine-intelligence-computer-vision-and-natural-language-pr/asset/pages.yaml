    # 9.7.3.3 Location-Based AR


    This is one of the most frequently used types of AR. The location is mostly determined
    by GPS, Digital Compass, smartphone camera, and other technologies. It does not
    require special markers to identify the location where the virtual object is placed,
    unlike marker-based AR (Figure 9.13). A specific location is assigned to the virtual
    products. The objects are displayed on the screen when the user enters a predefined
    area. Because it can forecast the user’s focus to connect real-time data with
    the current spot, location-based AR does not require a hint from the object to
    deploy. It also enables app developers to display imaginative, interesting, and
    valuable digital content to physical points of interest [13].


    # 9.7.3.4 Superposition AR


    Superposition AR creates a different view of an object that can be used to temporarily
    replace the original view (Figure 9.14). This means that an augmented view replaces
    the full view of an object or a portion of it with this technology. Object recognition
    is key in this type of AR. Superposition AR displays numerous perspectives of
    a target object with the option of emphasizing additional relevant information
    [13].


    # 9.7.3.5 Projection-Based AR


    Projection-based AR is a video projection technique that allows users to extend
    or distribute digital data by projecting images onto the surface of 3D objects
    or into their actual space (Figure 9.15). The user does not operate this type
    of technology.'
