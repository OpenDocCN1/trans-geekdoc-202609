    stumbles in this stage. Like a child, it is beginning its learning. As we point
    out the mistakes, the adjustment has to be made which helps AI become more accurate.
    One of the main things to avoid is overfitting. Overfitting happens when a model
    learns the noise details in the training stage that negatively affect the performance
    of the new data.

    2. *Validation stage:* Once the AI has completed the training stage, the next
    stage is validation. This stage provides the information of how the AI performs
    using the new set of data. With as the training stage, one has to evaluate and
    confirm the behavior of the AI and the new variable which is not considered earlier.
    Issues with the overfitting will be revealed during the validation stage.

    3. *Testing stage:* After the training stage, the new dataset is sent to the testing
    stage to see the performance of the AI model. The raw data is sent to the AI model
    for testing, to see if AI can make perfect decisions on the unstructured information.
    If the decision is wrong, the training stage has to be repeated until it is performed
    accurately.


