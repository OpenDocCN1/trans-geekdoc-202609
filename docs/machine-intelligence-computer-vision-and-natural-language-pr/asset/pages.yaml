    # 7.11.6 Supply Chain Management and Optimization


    Supply chain management and optimization processes unquestionably IoT-generated
    data. Suppliers can easily keep track of the consignrees; where they have been
    stranded; and find the predicted timeline to reach a certain place. Product locations
    can be predicted and verified using GPS and associated devices and sensors. This
    lets the customers know the actual day and time related to the shipment. The primary
    areas that IoT addresses in supply chain management and optimization are: authentication
    of location using sensors in a container, tracking traffic flow and product movement
    speed; monitoring; maintaining the quality parameters of the products, and optimal
    route detection [32].


