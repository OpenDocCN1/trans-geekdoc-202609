    # 3.2.5.7 Agility


    The fog/edge computing model can be built by small and individual businesses,
    making it agile. The system deployment is now possible with the help of open software
    interfaces and development kits. There are numerous edge/fog simulation platforms
    which can be explored to test the use cases.


    The edge/fog devices can easily be configured and require lower infrastructure
    costs for operation and maintenance. The edge/fog cooperates with the cloud data
    centre and follows a layered design approach. The available architectural pattern
    for edge/fog incorporation and its features are discussed next.


    # 3.3 Architecture of the Edge/Fog Computing


    The edge/fog computing has the advantage of reducing latency and increasing the
    performance of time-sensitive applications. But the edge/fog cannot be a replacement
    for cloud computing. They complement each other, giving rise to a three-tier architecture
    [6]. The different layers include devices at the lower layer, followed by the
    edge fog, followed by the cloud layer. All three layers coordinate with each other
    to offer the services. The different layers together to increase the performance
    of the system. Different architectural patterns are available in the literature.
    The components of each layer and services provided by each layer are where active
    research is in progress. The most common architecture is the three-layered one.
    It serves as the base for the different models currently available. There are
    numerous simulation tools which support the three-tier architecture. The layout
    of the cloud-edge/fog architecture is demonstrated in 3.1.


    The lowest layers include different sensors, actuators, RFID devices, mobile devices,
    etc., which continuously generate some form of data. The data will be transferred
    to the middle layer, i.e., the edge/fog layer. This layer will filter the data,
    process it and send a response to the end devices. This layer will also pass the
    data to the cloud layer for further processing and permanent storage. The cloud
    layer will process the data, do proper analytics and send a response back. It
    also keeps a copy of the processed data. The end devices, on receiving a response
    from the cloud or the edge, will proceed to the next stage. This is how all layers
    together accomplish any task.'
