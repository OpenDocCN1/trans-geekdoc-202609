  md: '# Chapter 3


    # Edge/Fog Computing: An Overview and Insight into Research Directions


    Priya Thomas and Deepa V. Jose


    #  3.1 Introduction


    Cloud computing has emerged as a platform which provides on demand access to computing
    resources and services anywhere, at any time. It enables remote access for storage,
    software, data repositories, and offers services such as networking, data filtering,
    and analytics. The cloud services can be accessed using the pay use policy, making
    it more flexible and customer-friendly. There are lots of cloud providers, such
    as AWS, Google Cloud, Microsoft Azure, etc., that guarantee seamless services
    to end users. The reliability of the cloud technology will greatly reduce the
    infrastructure and maintenance costs, making it very popular.


    The cloud computing technology can be classified into public, private, and hybrid
    cloud, based on the access model followed. The public cloud offers services to
    users by resource sharing. The users can access the services of the remote cloud
    without building their own infrastructure. Data availability depends on the underlying
    network condition, and the security and privacy policies will be defined by the
    cloud providers. The private cloud provides dedicated infrastructure to users
    with more security as they are built within the premises of an organization. It
    helps to access data faster and with greater reliability. Hybrid clouds are a
    combination of private and public clouds which can be relied upon to improve the
    scalability. This type helps to access all the benefits of the public cloud without
    compromising security and speed.


    DOI: 10.12011/9781003424550-3'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 48 Machine Intelligence


    The cloud computing services can be classified into the following:


    +   - Infrastructure as a Service (IaaS), which provides services such as remote
    access to storage, computing, virtual machines and networking resources.


    +   - Software as a Service (SaaS), which helps to access software remotely without
    directly installing them on PCs.


    +   - Platform as a Service (PaaS), which helps to access computing platforms,
    such as operating systems, program execution environments, databases, etc.


    All these services are available to cloud users, with choice of service based
    on their requirements.


    Cloud computing offers numerous benefits to its users, such as scalability, agility,
    elasticity, low cost, high performance, higher productivity, etc. Cloud computing
    also suffers from a few drawbacks [1], such as single point of failure, security
    issues, high response time, longer processing delays, latency, less reliability,
    and is continuously going to improve the features of cloud computing models. Among
    the different ones, one of the most trustworthy solutions is the incorporation
    of fog/edge computing. The terms fog and edge are usually used interchangeably
    in the literature, and these two types of computing help to improve the performance
    of applications which depend on cloud computing technology.


    The fog computing was originally coined by Cisco. The edge/fog was introduced
    to bring programming to the network instead of remote data centres. The major
    drawback faced by cloud computing was related to high response time due to the
    longer distance travelled by the data. The cloud data centres reside in geographically
    distant locations from the user or application which uses it. This significantly
    increases the response time and the delay if the network is congested, making
    cloud a less promising solution for delay-sensitive applications. Edge/fog computing
    helps to reduce this problem by reducing the distance between the end user and
    the computing nodes. Even though they are used synonymously, there is a difference
    between edge and fog. The difference lies in the location where the data is processed.


    In edge computing, the data is processed on the edge of the network. For example,
    if the Internet of Things (IoT) is an application that edges computing platform,
    the IoT sensor can be configured as an edge node and data be processed in this
    node. In fog computing, the processing nodes connected to a local network (LAN)
    or the LAN hardware itself is nearer to the end user. So, both of computing platforms
    help to process data locally and respond faster to the application. The time-sensitive
    data will be processed in these edge/fog nodes and the response will be transferred
    immediately to the end devices, reducing latency and delay considerably. The less
    sensitive data will be transferred to the remote cloud for further processing,
    forming a three-layered architecture.'
