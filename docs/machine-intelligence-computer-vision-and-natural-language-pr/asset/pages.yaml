  md: '# Streaming Analytics for Healthcare and Retail Domains ■ 305


    Data can be analysed swiftly with the Big Data infrastructures. In comparison
    to the original version, a Big Data-based Burrows-Wheeler Aligner (BWA) will maximize
    the alignment speed 36-fold.


    Currently, most sequencing data analysis methods depend on VCF files, which believe
    that all "no-call locations" are just reference locations. In reality, inadequate
    coverage can be the cause of several "no-call locations". As a result, data quality
    information for each location, which includes coverage and Phred-based quality
    ratings, must be used to determine if "no-call locations" are reference-consistent
    due to the less coverage in the downstream data variety. Exome sequencing data
    has been examined using a variety of toolkits for cloud computing, data compression,
    to prioritize variants, data exchange, Copy Number Variation (CNV) identification,
    and phenotypes. Analytical tools work on VCFs, which do not generally require
    an infrastructure always since VCFs are a bit smaller than BAM files.


    Researchers are now encountering considerable difficulties in maintaining, sequencing,
    interpreting, and analysing WGS data. Thus, the problems will be compounded as
    millions of people are sequenced, that becomes one of the targets of the Precision
    Medicine Initiative (PMI) in the United States and related work around the world.
    It may possible to build a Big Data framework to handle and interpret large volumes
    of genomic data that is consistent with clinical workflows by exploiting the scalability
    and distribution features in Big Data infrastructures.


    # 16.8.1 Securing Genomic Data


    Genomic data must be secured. Hence, confidentiality and privacy should be preserved
    in the same way as securing other health information. Data secure transmission,
    password protection, data encryption, reviewing transfer strategies, and the operational
    strategies against breaching activities are required. The Fair Information Practices
    Principles (FIPPs) introduced a paradigm that allows data sharing based on Health
    and Human Services guidelines followed by the US Department of Health. Some of
    its principles are individual accessibility, data collection, data transparency,
    disclosure constraints, data integrity, data quality, data accountability and
    data protection. The Workshop for Electronic Data Interchange (WEDI) has published
    a paper highlighting the problems of health IT integration in terms of infrastructure,
    procedures, and coordination [43]. Data integration, data access, data exchange,
    and data governance are challenges makes it easier to store big genetic files
    and combine data to make it more accessible.


    A study has been presented which outlines the complexities of health IT integration
    in terms of coordination, workflows, and infrastructure. Some more challenges
    are data convergence, data sharing, and data governance. Since date data storage
    services are offered by an outside agency of the healthcare institution, cloud
    computing poses potential security issues. Cloud providers are perceived as business
    associates and'
