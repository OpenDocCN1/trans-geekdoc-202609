  md: '# Chapter 12


    # Sewer Pipe Defect Detection in CCTV Images Using Deep Learning Techniques


    P. L. Chithra and P. Bhavani


    # 12.1 Introduction


    The sewer pipe systems are a component of civil infrastructure that is designed
    to collect wastewater. In the United States, 800,000 miles of public and 500,000
    miles of private laterals are connected to public sewer pipes. Most of the sewer
    systems are between 30 and 100 years old and suffer pipe blockage, which is mainly
    caused by grease and debris. Sewer defects are caused by root intrusion, line
    breaks, and unequal amounts of inflow and infiltration. For example, cracks can
    be divided into longitudinal cracks, vertical cracks and complex cracks consisting
    of both longitudinal and vertical ones. Pipe deposits are of different types,
    such as attached deposits (attached to the pipe wall) and settled deposits (settled
    on the pipe floor). As root intrusion, this can belong to the mass root (high
    density or large occupying area) or minor root (scattered and with low density).
    All these defects such as cracks, deposits, root intrusions, as well as water
    infiltrations, impair the performance of the sewer pipe. Currently, visual inspection
    techniques such as closed-circuit television (CCTV) are commonly used for underground
    sewer pipe inspection.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 222 Machine Intelligence


    A CCTV usually consists of camera and an illumination device mounted on a tractor.
    During the inspection, the CCTV unit moves along the interior pipe wall and transmits
    the inspection video to an external monitor on the ground. While encountering
    a pipe defect or pipe lateral, the inspector stops the unit and zooms the camera
    into the abnormal part to check whether are potential defects or not. After the
    inspection, the inspector watches the captured images or videos to Manual interpretation
    of the inspection images or videos is time-consuming, labor-intensive and the
    results can be subject-inaccurately. For this reason, an efficient computer vision
    technique has been used to interpret the inspection images or videos automatically.
    However, conventional computer vision techniques require the design of complex
    feature extractors and the images used for training needs a large amount of pre-processing.


    In addition, the training process is tedious and inefficient. In recent years,
    deep learning has achieved promising performance in various computer vision tasks
    such as image classification and object detection. With conventional computer
    vision techniques, approaches based on deep learning are capable of extracting
    image features automatically and there is no requirement for image pre-processing,
    which greatly improves the accuracy and efficiency. Therefore, an automated detection
    approach is proposed in this study, based on faster region-based convolutional
    neural network (R-CNN), which is a deep learning model for object detection and
    also for identifying and locating sewer pipe defects from CCTV images.


    The rest of the chapter is organized as follows, Section 12.2 contains the existing
    works related to sewer pipe defects, Section 12.3 explains the various methodologies,
    Section 12.4 presents the experimental results, and finally, Section 12.5 yields
    the conclusion.


