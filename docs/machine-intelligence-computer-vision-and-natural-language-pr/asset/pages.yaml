    # 5.3.4.2 mAP


    Mean precision (mAP) is employed by collecting a set of predicted object detections
    and a set of ground truth object annotations.


    +   - For every prediction, IoU is computed with reference to each ground truth
    enclosed in the image.

    - These IoUs are then thresholded to some value (generally between 0.5 and 0.95)
    and predictions are matched with ground truth boxes with respect to a greedy strategy
    (i.e. highest IoUs are matched first).

    - A recall (PR) curve is then generated for every object class and therefore the
    average (AP) is computed. A PR curve takes into consideration the performance
    of a model with reference to true positives, false negatives over a spread of
    confidence values.

    - The mean of the AP of all categories classes is the mAP.


    # 5.3.4.3 Precision


    Precision is the ratio of the number of true positives to the total number of
    positive predictions. For example, if the model detected 100 cars, and 90 were
    correct, the precision is 90 cent.


    # 5.3.4.4 Recall


    Recall is the ratio of the number of true positives to the total number of actual
    (relevant) objects. For example, if the model correctly detects 75 cars in an
    image, and there are actually 100 cars in the image, the recall is 75 per cent.


    +   - The F1 score is a weighted average of the precision and recall. Values range
    from 0 to 1, where 1 means the highest accuracy.


    # 5.3.4.5 Non-Maximum Suppression (NMS)


    Non-maximum suppression (NMS) may be the final step that is used in various computer
    vision tasks. It is a category of algorithms to choose one entity (e.g., bounding
    boxes) out of many overlapping entities. The purpose of NMS is to decide the best
    bounding box for an object and reject or “suppress” all other alternative bounding
    boxes. The NMS takes two things into consideration:'
