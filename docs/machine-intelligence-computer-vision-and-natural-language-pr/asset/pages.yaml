    storage of larger datasets to maximize performance, a private archive will be
    approved for use only by certified researchers. Furthermore, in future, people
    will be faced with data science problems, namely sharing constrained data in a
    certain context. Finally, data ownership is closely associated with obtaining
    profits and benefits from the data. The best strategies have to be identified
    not only to recognize the data generation process, but also to analyse the data
    efficiently and to value the reward analysts and data generators.


    # 16.9 Conclusion


    This chapter discusses real-time streaming analytics in the healthcare and retail
    domain. Developing data analytics is now easier than ever before, thanks to the
    digital transformation of business. Data streaming analytics may enhance decisionmaking
    by providing better business insight predictions. Streaming analytics'' ultimate
    goal is to assist organizations to stay ahead of their competition by allowing
    them to make smarter decisions. Streams of data are gathered in retail and healthcare
    via different electronic devices such as mobile phones, wireless sensors, etc.,
    linked through the internet. The healthcare business requires software and technology
    capable of real-time analysis of massive and diverse data streams. Streaming analytics
    technology is used in retail establishments and e-commerce because increasing
    client happiness is the key aim. Streaming analytics also helps new companies
    reach their target audiences and gain market share. Big Data analytics uses both
    structured and unstructured data. It enhances decision-making for both researchers
    and medical practitioners.


