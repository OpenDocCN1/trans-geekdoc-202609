  md: '# Ubiquitous Computing and Augmented Reality in HCI ■ 175


    # 9.7 Augmented Reality (AR)


    AR is a dynamically augmented version of the physical environment created by the
    use of digital elements, music, or other sensory integration using technology.
    AR is defined as a system that combines real and virtual worlds, enabling real-time
    interaction and accurate 3D recognition of virtual and real things. The advance
    of AR technology is the best illustration of how HCI has innovated so much. AR
    is being used to improve natural environments and provide visually enhanced experiences.
    The information about the user’s surrounding real-world environment becomes interactive
    and digitally modified with the use of modern AR technologies, such as computer
    vision, incorporating AR cameras into smartphone applications, and object identification.
    The real world is overlaid with data on the environment and these things. This
    data could be virtual. AR refers to any AR experiment [11].


    # 9.7.1 AR’s History in a Nutshell


    In 1968, Harvard professor and computer scientist Ian Sutherland invented the
    first head-mounted display, named “The Sword of Damocles.” Myron Kruger, a computer
    scientist and artist, established the “Videoplace” laboratory at the University
    of Connecticut in 1974. The term “augmented reality” was invented by Tom Caudell,
    a Boeing researcher, in 1990. One of the first fully working AR systems was constructed
    in 1992 by Louis Rosenberg, a researcher at the USAF Armstrong Research Lab. Julie
    Martin, a writer and producer, pioneered AR in the entertainment sector with the
    theatre performance Dancing in Cyberspace in 1994. Sportsvision broadcast the
    first NFL game using the virtual 1st & Ten graphic system, sometimes known as
    the yellow marker, in 1998. The technology overlays a yellow line on top of the
    footage so viewers see where the team just got a first. NASA developed a hybrid
    vision system for the X-38 spacecraft in 1999. During their tests, the system
    used AR technology to aid navigation. Hirokazu Kato created the ARToolKit, an
    open-source software library, in 2000. This package aided other developers in
    the creation of AR software. To overlay virtual images on top of the real world,
    the library uses video tracking. Sportsvision updated the 1st & Ten graphics in
    2003 to include the function on the new Skycam system, which provides spectators
    with an aerial shot of the field with graphics placed on top. For the first time
    in the media, Esquire Magazine employed AR to bring the pages to life in 2009.
    Volkswagen introduced the MARTA app (Mobile Augmented Reality Technical Assistance
    in Service) in 2013, which provided technicians with step-by-step repair instructions
    in the service handbook. In 2014, Google Glass, a set of AR glasses that users
    might wear for immersive experiences, was presented. In 2016, Microsoft began
    delivering the HoloLens, a more advanced version of wearable AR technology than
    Google Glass [12].'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 9.7.2 Characteristics of AR


    AR is a computer system that can merge real-world and computer-generated data
    and it has its own set of characteristics.


    +   - It enables the actual and virtual worlds to be combined so that elements
    of the virtual world can interact with aspects of the actual world.

    - Information is exhibited virtually, such as photos, audio, videos, graphics
    and GPS data, and is strongly linked to the information that we see with our actual
    eyes.

    - It should be real-time interactive.

    - It directly interacts with the environment''s physical capabilities.


    # 9.7.3 AR Types


    Many immersive app development companies are always looking to improve the consumer
    experience by integrating rich and innovative ways of expressing digital content.
    This is made feasible through the use of several types of AR.


    # 9.7.3.1 Marker-Based AR


    Marker-based AR uses AR applications to identify physical images, ''Markers''
    and 3D models are shown in Figure 9.11. When you open the AR app, it uses your
    mobile device''s back camera to track such markers. This form of AR technology
    is also known as image recognition or recognition-based AR. AR displays overlay
    content in the form of video, image, 3D model, or animation clips,. Users can
    connect with this content through an app. This is a popular sort of AR that allows
    users to observe an object or image in detail and from various angles. Furthermore,
    when the user turns the marker, the 3D imaginary rotates at the same time [13].


    # 9.7.3.2 Markerless AR


    Markerless AR works by scanning the environment without the use of a marker (Figure
    9.12). Users can place the virtual object or information anywhere they want without
    having to move anything in the background. Markerless AR is a type of virtual
    reality that collects positional information using the device''s location, digital
    compass, camera, and accelerometer. In addition, for AR products to not always
    float in the air, mobile apps with such features frequently ask the user for a
    flat surface or floor to place them on. The AR app detects flat surface and places
    items on top of it [13].'
