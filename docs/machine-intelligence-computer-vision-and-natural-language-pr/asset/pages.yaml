    # 1.7 Postscript


    While this manuscript was in preparation, US-based company OpenAI released its
    chatbot, ChatGPT, based on a so-called “Large Language Model” (LLM), consisting
    of billions of parameters. It became a global sensation for its ability to generate
    text in a variety of writing styles, engaging narratives, and even to explain
    poetry and jokes. LLMs, coupled with the vastly improved image generation programs
    as DALL-E and Stable Diffusion, have significantly redefined the landscape of
    creativity in the context of artificial intelligence and machine learning. As
    these models continue to evolve, they will reshape our notions of itself. Furthermore,
    their emergence has sparked a renewed debate on intellectual property rights.
    Additionally, these models have brought the issues of bias and fairness to the
    forefront of the conversation, as their responses are influenced by the data they
    are trained on. The implications of these developments extend far beyond the academic
    sphere, influencing industries from literature to advertising.


