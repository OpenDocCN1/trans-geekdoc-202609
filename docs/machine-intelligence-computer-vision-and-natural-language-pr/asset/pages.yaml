    # 7.11 Use-Cases in Industrial IoT


    # 7.11.1 Predictive Maintenance


    Periodic maintenance of assets and resources apparently pays off in millions of
    dollars of operational cost saved, in any business. Sensors, cameras, and data
    analytics managers from various industries to accurately predict the likely time
    of breakdown before it really occurs. These IoT-enabled systems can generate warning
    signs and such information to develop maintenance schedules, as well as perform
    preventative maintenance on equipment before issues can arise. Thus, IoT-based
    sensors trans-form the maintenance process into something dynamic and automatic.'
