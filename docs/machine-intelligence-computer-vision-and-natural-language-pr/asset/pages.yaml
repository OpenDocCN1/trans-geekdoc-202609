    # 6.4.1 Vertical and Horizontal Flip in Image Augmentation


    An image flip reverses the rows or columns of pixels in the case of a vertical
    or horizontal flip respectively. The flip augmentation is specified by a Boolean
    horizontal flip or vertical flip argument to the Image Data constructor class.
    For photographs like the bird photograph, horizontal flips may make sense, but
    vertical flips would not. For other types of images, such as aerial photographs,
    cosmology photographs, and microscopic photographs, vertical flips may make sense
    (Gondhalekar, 2020).


    # 6.4.2 Random Rotation Augmentation


    A rotation augmentation randomly rotates the image clockwise by a given number
    of degrees from 0 to 360. The rotation will likely rotate pixels out of the image
    frame and leave areas of the frame with no pixel data that must be filled. In
    example this https://machinelearningmastery.com/how-to-configure-image-data-augmentation-when-training-deep-learning-neural-networks/
    demonstrates random rotations via the range argument, with rotations to the image
    between 0 and 90 degrees. For random brightness augmentation, the brightness of
    the image can be augmented by either randomly darkening images, brightening images,
    or both. The aim is to allow a model to generalize across images trained on different
    lighting levels. This can be achieved by specifying the brightness range argument
