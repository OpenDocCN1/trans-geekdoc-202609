    # # Ubiquitous Computing and Augmented Reality in HCI


    Nancy Jasmine Goldena and Thangapriya


    # ## 9.1 Introduction


    Human-computer interaction (HCI) is a branch of computer science that studies
    how people and computers interact. HCI researchers study how people interact with
    computers and create technologies that enable people to connect with computers
    in unique ways. HCI is at the crossroads of computer science, cognitive science,
    design, mass communication, and a number of other specialties. The most fundamental
    and essential aspects of HCI are augmented reality (AR) and ubiquitous computing
    (UC) [1–7].


    # ## 9.2 Ubiquitous Computing (UC)


    UC is a new computing model characterized by the seamless integration of hundreds
    of thousands of self-communicating small-scale computers and intelligent devices
    found in the user''s environment and daily activities. UC is also known as pervasive
    computing, everywhere, and ambient intelligence. UC refers to the emerging trend
    of embedding computing capabilities, particularly in the form of microprocessors,
    into everyday objects in order to enable them to efficiently transmit information.
    UC can perform useful functions while reducing end-user interaction with computers.
    For'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 164 ■ Machine Intelligence


    example, a user may want to drive from home to the gym. Smartphones, wearable
    devices, and other fitness trackers may be required. Wireless communication and
    networking technologies, mobile devices, embedded systems, wearable computers,
    radio frequency identification (RFID) tags, middleware, and software agents are
    all examples of UC [8].


    # 9.2.1 UC''s History


    Mark Weiser, the Chief Technologist at Xerox Palo Palo Alto Research Center (PARC),
    coined the term “ubiquitous computing” in 1988. Weiser published some of the initial
    papers on the subject, both alone and with PARC Director and Chief Scientist Seely
    Brown, primarily defining it and sketching out its obstacles. The Active Badge,
    a “clip-on computer” the size of an employee ID card, was designed at the Olivretti
    Research Laboratory in Cambridge, England, allowing businesses to track the exact
    locations of people in a building as well as the objects to which they were attached
    [8].


    At PARC, Weiser was inspired by social scientists, anthropologists, and philosophers,
    who explored a new approach to computers and connectivity. He believes that people
    live by following their routines and knowledge bases, so that the most powerful
    things are effectively invisible in use. This is a problem that affects the entire
    field of computer science. First and foremost, it makes the world a better place
    by activating computers. Hundreds of wireless devices of different sizes, per
    person and per office, are offered. This necessitated new work in areas such as
    operating systems, user interfaces, the internet, wireless, graphics, and a variety
    of other domains. At that time, Weiser called this “ubiquitous computing.” This
    is distinct from personal digital assistants (PDAs) and Dynabooks. UC that believes
    after 30 years, interface design and computer design had the route of the ‘dramatic’
    machine. UC’s ultimate goal is to create a computer that is thrilling, magnificent,
    and fascinating. Weiser suggests the “invisible” path, which is a less-traveled
    path where the main aim is to make a computer so embedded, so comfortable, that
    the user stops worrying about it. Weiser believes that the second path will come
    to dominate in the next 20 years. But it won''t be easy, PARC has been testing
    several versions of the future infrastructure. In the late 1990s, IBM’s pervasive
    computing group popularized the phrase “pervasive computing” [8].


