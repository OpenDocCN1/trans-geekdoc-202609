    # 11.2 Dataset Description


    The gastric cancer gene expression dataset was collected from Gene Expression
    Omnibus with the GEO accession code (GSE2685) which consists of 4,524 attributes
    that include the records of 30 patients (Hippo et al., 2002). The python programming
    language is used to analyze the performance of the supervised machine learning
    algorithms.


    # 11.2.2 Classification Techniques


    In order to predict the outcome of the dataset, the algorithm processes a training
    set containing a set of attributes and the respective outcome, usually target
    or prediction attribute. In this work, the supervised machine learning algorithms
    predict which of the algorithm is most suitable for classifying the gastric cancer
    gene expression dataset. The supervised machine learning algorithms namely Logistic
    Regression (LR), Decision Tree (DT), Naïve Bayes (NB) and K-Nearest Neighbor (KNN)
    are used to find which fits effectively for the gastric cancer gene expression
    dataset.


    # 11.2.2.1 Logistic Regression (LR)


    Logistic Regression is basically a supervised machine learning algorithm and it
    is used to determine the relationship between the dependent variable (x) to the
    set of independent variables (y). In a classification problem the target variable
    or output (y) can only be a discrete variable for the given set of features (x).
    The model builds the regression model to predict the probability that the given
    data belongs to the category numbered as 1. Just like linear regression, it follows
    the linear algorithm. Logistic regression data uses the sigmoid function (Eq.
    11.1) to convert the values within the range of 0–1 with the threshold value of
    0.5 (Brindah et al., 2021).


    ```

    Sigmoid Function S(x) = \frac{1}{1+e^{-x}} (11.1)

    ```


    # 11.2.2.2 Decision Tree (DT)


    The decision tree is a non-parametric supervised machine learning algorithm (So
    et al., 2007) that can be used for both classification and regression problems.
    Mostly it is employed in classification problems. It is a flowchart with a tree-like
    structure where the internal node represents the feature, the branch represents
    the decision rule, and the leaf node represents the outcome. Decision tree works
    on the sum of product form which is known as the disjunctive normal form. It has
    two popular attribute selection measures, such as the Entropy and the Gini Index.
    Entropy (Eq. 11.2) is used to measure the impurity of the gastric cancer'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'expression dataset. The Gini Index (Eq. 11.3) computes the degree of probability
    of a specific variable that has been wrongly classified. It works on categorical
    variables and gives the outcome of success or failure:


    ```

    $Entropy = \sum_{i=1}^{n} p(C_i)\log_2(p(C_i))$$ (11.2)

    ```


    ```

    $Gini = 1 - \sum_{i=1}^{n} p^2(C_i)$$ (11.3)

    ```


    # 11.2.2.3 Naïve Bayes (NB)


    Naïve Bayes (NB) is a probabilistic machine learning algorithm based on the Bayes
    Theorem that can be used in a wide variety of classification tasks. It is called
    Naive because it assumes that the occurrence of a certain feature is independent
    of the occurrences of the features. It is simple to use and it does not require
    as much training data and it handles both continuous and categorical data. NB
    (Eq.11.4) is one of the simplest and most effective classification algorithms
    which helps in building the fast machine learning models that can make quick predictions
    (Mortezaghi et al., 2019). It leads to a linear decision boundary in many cases.


    Bayes depends on the principle of the Bayes theorem.


    ```

    $P(A|B) = P(B|A) * P(A) / P(B)$$ (11.4)

    ```


    where:

    P(A|B) is posterior probability

    P(B) is likelihood probability

    P(A) is prior probability

    P(B) is marginal probability


    # 11.2.2.4 K-Nearest Neighbor (KNN)


    K-Nearest Neighbor (KNN) is a non-parametric supervised learning algorithm which
    uses proximity to classify classifications or predictions about grouping of an
    individual data point (Li et al., 2012), KNN works by finding the distance between
    a query and all the samples in the data. In the KNN algorithm, the K value is
    initialized to the number of neighbors. Then, the distance between the current
    objects and the $k$ cluster centroids is calculated. Assign the current sample
    to that cluster to which it is closest. Compute the "cluster centers" of each
    cluster. These become the new cluster centers. These steps have to be repeated,
    until the convergence criterion is satisfied.'
  merge: -1
  img_proc: true
