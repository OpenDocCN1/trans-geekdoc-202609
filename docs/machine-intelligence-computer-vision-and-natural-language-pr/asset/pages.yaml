    # 14.2.1 Classification of Sentiments


    Classification of sentiments is one of the most frequently researched area in
    Computer Science. Analyzing the polarities associated with the phrases in the
    dataset is a subdivision of the classification of sentiments. Usually research
    work includes classifying the polarities as negative or positive (Wang et al.,
    2014). Apart from classifying the polarities as positive or negative, some of
    the research include a third category called neutral. Cross-language and cross-domain
    classification can be considered as sub-divisions of the classification of sentiments.
    Ambiguity with the word polarities still needs to be researched. Research is carried
    out on models for the retrieval of information that can be considered an alternative
    methodology for machine learning models to implement disambiguation of word polarity
    (Kumar and Garg, 2020).


    # 14.2.2 Subjectivity Classification


    Subjectivity classification deals with analyzing whether subjectivity is present
    in the considered dataset (Kasmuri and Basiron, 2017). The prime objective of
    subjectivity classification is to eliminate objective phrases in the dataset.
    Subjectivity classification is one of the foremost tasks associated with sentiment
    analysis. Words that are associated with emotions like "better,"fine," etc. are
    detected by the subjectivity classification system (ibid.).


    # 14.2.3 Opinion Spam Identification


    Spamming of opinions is one of the major issues while implementing sentiment analysis
    (Krrishnan and Radha, 2022). The advances in digitalization and growing popularity
    of social media networking sites, e-commerce sites and websites associated with
    reviews have resulted in the generation of fake reviews. Fake reviews are created
    to either promote or denote any subject under consideration.


    # 14.2.4 Detection of Language Implicitly


    Sarcastic, ironic and humorous data fall under the category of implicit language.
    Sometimes there are situations where there is a kind of ambiguity and a sort of
    vagueness in certain text or speech that become difficult for humans to comprehend
    at. Detection of implicit language aims to try to analyze the underlying factors
    associated with a certain event. Consider a phrase “I love problems”, the word
    ‘problem’ is considered at factual. The word ‘love’ is associated with either
    sarcasm or humor or it can even be ironic in nature. Conventional methods for
    identifying implicit language incorporate the discovery of expressions associated
    with laughter, usage of punctuations and emoticons.'
