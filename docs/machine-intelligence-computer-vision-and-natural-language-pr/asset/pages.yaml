    # 14.3.7 Ensemble Techniques for Sentiment Analysis


    Ensemble techniques for sentiment analysis involve consideration of several machine
    learning or deep learning algorithms and blend them together to result in improved
    accuracy rates (Mamun et al., 2022). Ensemble techniques yield more precise results
    than a single model under consideration (Alsayat, 2022; Kamara et al., 2022; Rabiu
    et al., 2022). The term "weak learners" is also known as base models is used in
    the scenario of ensemble learning techniques. Weak learners are not complicated;
    they are quite simple models that act as the basis of the development of complicated
    models. Bagging, boosting and stacking are the three categories that fall under
    the umbrella of the ensemble learning technique.


    +   **Bagging technique:** The bagging technique, popularly represented as a bootstrap
    aggregation, is implemented to minimize the variation within an inconsistent dataset.
    In the scenario of bagging, an arbitrary portion of data involved in the training
    is chosen with substitution. Non-heterogeneous learners are taken into consideration
    while adopting the bagging method.

    **Boosting technique:** The boosting ensemble replaces the dataset considered
    for training, in order to give importance to illustrations that went wrong in
    the training dataset that were fitted earlier. The boosting ensemble method centers
    on the idea of rectifying errors involved in prediction. A sequential manner is
    followed while fitting and integrating the models into the ensemble.

    **Stacking technique:** The stacked generalization, also called the stacking technique,
    is a method to enable several classification models. Stacking combines several
    classification models through the use of meta learning. In the stacking technique,
    a number of base models or algorithms are considered. A training dataset is considered
    on which the base models or algorithms are trained. The final result of all the
    base models is obtained and the meta model is trained on the end result of all
    the base models. The present research implements the stacking technique. The base
    algorithms implemented are the decision tree classifier, the gradient boosting
    classifier, logistic regression and the genetic algorithm. The meta classifier
    is the support vector machine.


