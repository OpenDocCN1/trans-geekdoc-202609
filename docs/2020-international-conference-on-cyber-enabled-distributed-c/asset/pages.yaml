  md: '# # Blockchain-based dynamic group management for multiple keywords search
    encryption technology


    Yuxian Chen1,2,3, Jian Bai1,2, Yao Hao1,2, Sijiao Liao, Zhongqiang Yi1,2, and
    Hao Zhang1,2


    ^1Science and Technology on Communication Security Laboratory, Chengdu 610041,
    China

    2No.30 Inst, China Electronics Technology Group, Chengdu 610041, China

    3 China Electronics Technology Security Co., Ltd

    239282759@qq.com


    **Abstract—**Search encryption (SE) provides online search functions to protect
    encrypted data and the user query privacy. It has challenges of substantial bandwidth
    and storage overhead that should be mitigated for a practical SE. In this paper,
    we propose a blockchain-based user management scheme for SE that can decentralize
    bandwidth management, and enhances the security of privacy in order to prevent
    identity loss, tampering brought by TTP. We leverage blockchain to offer security
    efficiency, and theoretical analysis validates the feasibility and security. Further
    experiments are carried out to demonstrate the SE effectiveness.


    **Keywords—Search encryption;** Multiple; Decentralized; encryption; Blockchain.


    not only reduces the computational complexity on the client, but also realizes
    secure dynamic group management. The usage of TTP (proxy) is also the strategy
    adopted by most solutions in the basis of dynamic search encryption. Li, Huang
    [15] further designs a multi-keyword search scheme supporting fine-grained results.


    At present many server providers such as Azure and Google App Engine protect user
    privacy through authentication and ACL (Access Control List) [16]. However, these
    applications are constructed on the assumption that the server is trusted. In
    practical implementation, cloud service providers can rely on user''s privacy,
    that the server is semi-trusted, however curious. Although search encryption technology
    solves the contradiction between data privacy and availability on the cloud, there
    is no mature commercial application. On the basis of encryption, ciphertext documents
    and search process increase bandwidth and economic cost; other many solutions
    with application scenarios still need improvement in function, efficiency, and
    security.


    # I. INTRODUCTION


    Search encryption is a technology to protect user data''s security and query privacy
    without affecting data retrieval. The basic scenario is that the user encrypts
    his own data, generates the keywords and uploads it to the cloud. When he needs
    to retrieve the data, he submits the keywords to the cloud server. The cloud does
    not know the keywords or the ciphertext, but uses the traps of the keywords to
    retrieve the cipher text of the data, then returns the result [1]


    Search encryption is mainly divided into symmetric and asymmetric. However, it
    can be further subdivided according to the number of creators and searchers. Its
    research has many properties, efficiency, security, correctness, etc [4–7]; Jin
    Li [8] proposes which switch support keyword search in encryption. Wang [9] proposes
    scheme that can support range of search query. For B [10] proposes supporting
    search encryption in ciphertext. Hector [11] proposes SQL query that can support
    encrypted search. The server does not need to decrypt the ciphertext, but operates
    the ciphertext, which further increases the potential of search encryption, but
    at present, the efficiency of homomorphic encryption is not practical. Yong H
    [13] proposed a public key scheme that supports file sharing among multiple users
    and efficient search of multiple keywords. Dong [14] uses a TTP (Trusted Party)
    to manage and distribute keys, uses El-Gamal proxy encryption, which


    dynamic user management is an important direction for SE. However, user management
    in SE is implemented by TTP, but TTPs also have a lot of issues with users, for
    example, single point of failure, identity disclosure, hard to find a TTP that
    all trust in practice, etc. These issues are related to service availability,
    efficiency and security.


    In this paper, we propose a blockchain-based scheme that can realize file sharing
    within a user group and dynamic user management without proxy. The scenario supports
    various creators and searchers, that is, ciphertext and keywords created by various
    creators can be searched by various searchers. Based on the analysis of the previous
    research that supports index of conjunctive keyword search, Our contributions
    can be summarized as follows:


    +   - A blockchain-based scheme that can realize file sharing within a user group
    and dynamic user management without proxy.

    - On the basis of scenario that supports various creators and searchers, the scheme
    naturally has the feature of multi-service index book, which brings the availability
