    The rest of the paper is organized as follows: In Section 2, we familiarize with
    the scheme''s preliminaries, bilinear map and blockchain. In Section 3, we put
    forward the model and structure of our scheme. Section 4 presents blockchain-based
    architecture. Section 5 covers the principle verification of the scheme, including
    theory proof, advantage description and encryption feasibility. Section 6 concludes
    the paper.


    # II. PRELIMINARIES


    # A. Elliptic bilinear map


    For any two groups $G_1, G_2$ with same prime order, there exists a bilinear map
    $e$ satisfying $G_1 \times G_2 \rightarrow G_2$, which then has properties as
    follows:


    +   1) Bilinearity: for any $a_1, a_2$ in group $G_1$, and $b_1, b_2$ in group
    $G_2$, $e(a_1a_2, b_1b_2) = e(a_1, b_1)^{a_2b_2}$;n2) Non-degeneracy: if $g_1,
    g_2$ is the generator of $G_1$, then $e(g_1, g_2)$ is the generator of $G_2$;n3)
    Computational: for any elements $g^a, g^b$ in group $G_1$, of $a, b \in Z_p$,
    $e(g^a, g^b)$ can be calculated in a polynomial time.


    # B. Blockchain and smart contract


    Blockchain is a time-ordered data structure using cryptographic technology to
    guarantee the consensus and credibility of the system. Its advantages mainly contains
    following aspects:


    +   1) Decentralization: the management of the system is executed by multiple
    nodes, which increases the system''s transparency and fairness.

    2) Anti-tampering: hash function based data structure can store the correlation
    of information, a bit tampering can be detected by the correction of the chain
    structure.

    3) Strong fault tolerance: consensus algorithm and multiple backups can detect
    and reject malicious actors and attackers.

    4) No trusted third party: smart contract is a piece of code that runs on blockchain
    to secure the agreement. It is triggered by event, making it possible to get rid
    of TTP (Trusted Third Party) which may also be untrusted.


    In our scheme, we use blockchain and smart contract to manage the generation and
    distribution of user''s key instead of TTP (Trusted Third Party), which gives
    users more autonomy and get rid of the risk of keys being compromised by TTP.


    Considering the multi-party relationship in searchable encryption, the efficiency
    of consensus algorithm, and the scheme designs dynamic membership management by
    the trusted Consortium blockchain platform meets different needs of multi-parties,
    as (Consortium chain, public chain, and private chain). The engineering experiment
    will also be based on blockchain in the following chapters.


    # C. Index structure


    The encrypted object in our scheme is text-based, unstructured. User stores a
    set $D=\{d_1, d_2, ..., d_n\}$ where each document has a corresponding index structure,
    recording its attribute domain in json format. 1: $attr(d) = \{name: value; name:
    value; ...\}$, such as age, author, height, etc. There may be some overall difference
    between documents, so index structure and data are separately stored and searched
    on server for every query.


    ![](img/2a600712fcb0af2f22fbfb36492ba977_1_0.png)


    # III. SYSTEM MODEL AND SCHEMA PROCESS


    The scheme involves two participants in blockchain management


    +   * users: U represent a group of users $U_1, U_2, ...$ these users are in charge
    of encryption and query. Each user in the group have many permissions, including
    encryption, decrypt and search. Moreover, each user can search other users'' encrypted
    documents and decrypt them.

    * CSP (Cloud Service Provider): CSP provides user server storage, service encryption
    and key services. Generally, CSP is honest and won''t violate the service contracts,
    but may be curious and analyze user''s behavior to get privacy. Blockchain is
    responsible for calculation public, compute and distribute keys for each group
    member to realize group management, including key distribution and permission
    revocation. Rules are written in the smart contract to consensus previously and
    can be executed automatically by triggered events.'
