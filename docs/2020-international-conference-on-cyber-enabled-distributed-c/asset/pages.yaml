    # C. Advantage analysis


    Blockchain has the characteristics of multi-node block,

    each node has the entry ledger, which means it is

    decentralized management service, which is secure

    compared with TTP (Trusted Third Party). Each node can

    provide basic management service. The scheme can also get rid

    single point of failure by TTP. The flow of orders and

    cloud services are written into the blockchain in the

    form of "contracts", and when "contracts" are triggered

    by events to execute (automatically), so to realize the


    management of users and cloud. There is no need

    to worry about the theft, tampering and disclosure of user

    identities, and other data by TTP. Multi-node

    also makes supervision possible, for that, nodes are deployed

    the service department exists to work the flow of

    cloud, make no one violates the "pre-set" contract.


