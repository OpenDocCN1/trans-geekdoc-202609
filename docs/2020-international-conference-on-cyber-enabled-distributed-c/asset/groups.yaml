    ![](img/2a600712fcb0af2f22fbfb36492ba977_3_1.png)


    是否在云存储中，这意味着搜索成功了。根据之前的方案 $E_{K_c,K_k}(I(D)) = E_{K_c}(E_k(D), f^{MSK})$，CSP 首先使用
    $x_{x_2}^2$ 计算 $f^{MSK}y^{\sigma_i}$，返回结果 $E_{K_c}(E_k(D))$。否则，返回 1。


    当用户获得结果 $E_{K_c}(E_k(D))$ 时，他随后使用私钥 $x_{x_1}^{-1}$ 计算文件密钥来解密 $E_k(D)$。


    基于区块链的用户管理：对于每个想要加入的用户，智能合约可以为其注册 $x_1, x_2$，并为云端注册密钥对 $(x_2, x_2'')$，满足 $x_1^2
    = x_2^2$，该密钥对通过区块链传输，否则无法传输。


    ## E. 基于区块链的成员管理


    防止中间人攻击 (MITM)：据我们所知，我们是第一个利用区块链和 TTP（三重信任）实现用户管理的。攻击者监控 CSP 与注册用户之间的通信，搜索查询 $Trap
    \equiv (id_u, g^{\gamma_u}, g^{\sigma_u}, \sigma_{i_1}, ..., \sigma_{i_m})$ 被注册，结果为
    $rs = (E_{K_c}(E_k(D)))$。由于 $x_{x_1}^{-1}$ 是离散数问题（DLP），攻击者解密 $x_1$ 的可能性不存在。


    关于问题，如图 3 所示，智能合约为用户和 CSP 分离了 $x_1, x_2$MSK$ 被放入区块链，这意味着用户加入的成功。我们已经证明了该方案可以防止
    MITM 攻击。除了新用户外，用户管理还可能撤销用户身份。当用户需要注销时，智能合约将发送指令，要求 CSP 删除部分存储 $(id_u, x_2^{-1})$，然后用户既无法搜索，也无法使用其私钥
    $x_{x_1}^{-1}$ 区分其他用户共享的加密文档结果。


    ## B. 原理验证与压力测试


    我们从工程角度验证了我们的方案。如表 1 所示，2500 个用户在 5000 秒内连续调用操作，直到操作重复。从图 4 可以看到成功数量波动很大。随着经过时间的结束，交易速率呈现上升趋势。


    交易变得稳定，在 400 tps（每秒交易数）左右波动。至于波动，这与区块链记录机制一致。与传统系统（TTP，受信第三方）在事件发布时立即记录权威性不同，代码显示成员管理行为存在于区块中（如身份、密钥）。该理论基于区块生成，根据
    fabric 策略，当满足两个条件之一时，就会触发一个新区块。


    # 表 I 系统配置与实验环境


    | 特性 | 值 |

    |---|---|

    | 操作系统 | Ubuntu Linux 版本 4.4 |

    | 网络测试工具 | Apache JMeter, 通用操作 |

    | Hyperledger fabric 版本 | 2 台配置相同的机器(2CPU, 32G) |

    | 区块链节点状态 | 包含 1 个排序器节点和 1 个对等节点 Kafka 集群 |

    | 测试命令 | chaincode |

    | 线程数 | 250 |

    | 启动阶段（秒） | 300 |

    | 循环计数 | 300 |


    交易变得稳定，在 400 tps 左右波动。至于波动，这与区块链记录机制一致。与传统系统（TTP，受信第三方）在事件发布时立即记录权威性不同，代码显示成员管理行为存在于区块中（如身份、密钥）。该理论基于区块生成，根据
    fabric 策略，当满足两个条件之一时，就会触发一个新区块。首先，区块中的数量达到限制。其次，交易计数达到预设时间。在我们的模拟中，由于交易量的影响，进行了压力测试。当
    tps 超过系统节点处理能力时，系统可能会变得不稳定，这就是为什么在 25 分钟后出现了故障线。问题指的是成员行为等。


    ## C. 优势分析


    区块链具有多节点区块的特点，每个节点都有账本，这意味着它是去中心化管理，与 TTP（受信第三方）相比更安全。每个节点都可以提供基础管理服务。该方案还可以消除
    TTP 的单点故障。多节点也使得监管成为可能，为此，服务部门存在，确保无人违反“预设”合约。


    # VI. 结论


    该方案是区块链应用搜索加密的一种有效实现。基于区块链的信任机制导致了新型非共识信任关系，为解决搜索环境中的问题开启了新方向。


    # VII. 致谢


    本工作感谢国家重点研发计划支持（2017YFB080230）（2017YFB080230）、四川省主要科技项目关键技术研发、部分市政府及信息产业支持（2017GTZ20002）、四川省应用基础研究计划“大规模敏感数据安全存储技术”（2020YFG00298）。


