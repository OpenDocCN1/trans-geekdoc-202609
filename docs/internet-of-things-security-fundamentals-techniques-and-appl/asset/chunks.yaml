    a firewall. The IoT gateway device acts as an intermediary between the IoT sensor
    device and the cloud service over the Internet.


    ### 4.3.4 Back-end Data-sharing


    This model refers to a communication architecture that allows users to export
    and analyze data collected from an IoT sensor device and uploaded to cloud to
    the other services or other data sources. This architecture provides a way for
    granting access to the uploaded sensor data to third parties, organization, services,
    or users [[6](#Ch04.xhtml#ref4_6)].


    ## 4.4 IoT Protocols

