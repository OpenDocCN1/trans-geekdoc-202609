    # 5 Role of Blockchain in IoT Security

    **Tasneem Jahan and Imran Ali Khan**


    Department of Computer Science Engineering, Bansal Institute of Research, Technology
    and Science, Madhya Pradesh, India


    DOI: 10.1201/9781003338642-5


    Internet of Things (IoT) is a computing technology that has evolved to improve
    every object of our daily life, by transforming them into smart devices, thus
    by creating the automation of routine tasks and activities. It aims for designing
    a digital world to boost the business momentum and for the growth of industries.
    With the expansion of IoT across the globe, the major concern associated with
    it is its resistance to attacks and security. IoT deals with the scenarios that
    involve complicated network connections and computer capabilities for sensors
    controllers, and several other technologies to provide real-time computing services.
    IoT has heterogeneous collection of devices that vary in architecture and creates
    a varied network size. Security is an important aspect that is needed to be implemented
    efficiently by using protocols and algorithmic schemes. The following content
    of this chapter will cover the working of Blockchain, along with its advantages
    and disadvantages. Examples of Blockchain in IoT applications, security aspects
    of Blockchain, and Blockchain in business are also discussed.


    ## 5.1 Introduction

    Internet of Things (IoT) security deals with the protection and safety of the
    devices and networks connected to the IoT. There are many things which we use
    in our daily life. These things are to be connected to the Internet using a wired
    or wireless backbone. IoT communication gets its data from the connecting devices
    which are used in industries’ smart energy grids, home and building automation,
    vehicle-to-vehicle communication, and wearable computing devices.


    The main problem is that the IoT industry is not focussing on the security measures,
    not only companies but the consumers also not concerned about the security threats.
    Furthermore, end users often fail to change the default passwords on smart devices
    – or if they do change them, fail to select sufficiently strong passwords. This
    gap can be fulfilled by a robust automated system which enables end users and
    companies to overcome such a kind of threat.


    The objective of designing a secure IoT model has many obstacles for even the
    simplest tasks such as data sensing, data communication, and data storage. To
    achieve this goal from the scratch, the entire IoT system is classified into two
    discrete levels as:


    1.  System view: It groups various elements of an IoT ecosystem together, e.g.,
    things or objects, network services, gateways, and cloud services.

    2.  Business view: It comprises the set of services offered by IoT, e.g., the
    platform architecture, applications, connectivity, and business model.


    ## 5.2 urrent Trends and Their Challenges

