  trans: '

    ## 2. 能力撤销

    能力可以由获得适当授权的主体撤销，从而解决了分布式环境中基于能力方法的一个问题。


    ## 3. 信息粒度

    服务提供方可以根据能力令牌中所述的内容细化其行为以及需要提供的数据。图 2.3 举例说明了使用基于能力的访问控制方法来管理一个简单情况：Bob 要去度假，在他不在期间他的房子需要打扫。Dave
    提出在 Bob 度假期间照顾他的房子。Bob 向 Dave 提供一个访问令牌，该令牌：（a）标识 Dave 是唯一有权使用该令牌的主体，（b）说明 Dave
    实际可以执行的操作，以及（c）说明 Dave 可以执行这些操作的天数。


    ![图 2.3 ACL 与基于能力的授权模型示例。](img/fig2_3.jpg)


    图 2.3 ACL 与基于能力的授权模型示例。


    Bob 和 Dave 无需在其身份验证和授权系统之间建立信任关系。Bob 的家用电器识别由 Bob 创建的访问令牌，Dave 只需证明他是能力令牌中标识为有权在假期期间执行特定家务活动的主体（受让人）。上述机制非常直观，易于理解且易于使用。`CapBAC`
    非常适合制造环境，在该环境中存在许多主体，内部（例如，工人和生产主管）和外部（例如，供应商和维护人员），需要直接（例如，通过移动或桌面计算设备）或间接（例如，通过应用程序服务）访问制造厂内的设备、数据和服务。其中大多数，如果不是全部，这些元素都需要严格的访问控制策略和更细粒度的访问控制执行，同时管理工作必须与所管理资源或主体的数量解耦，尤其是在主体中有很多外部主体时。


    `CapBAC` 架构元素可以简要描述如下（图 2.4）：

    * 能力的资源对象（图 2.4 中的 `Service A`）；它可以是特定的数据或设备、服务，或任何可以唯一标识和/或操作的（类似资源）可访问元素；

    * 授权能力，详细说明了授予的权利（以及哪些可以被委派，以及在这种情况下其委派深度）、可以行使这些权利的资源、受让人的身份以及其他信息（例如，能力有效期、`XACML`
    条件等）。授权能力在其自身中指定的有效期内有效，或直至被明确撤销；

    * 能力撤销用于撤销一个或多个能力。与能力一样，能力撤销是一个可通信对象，由具有特定权利的主体创建（例如，撤销者必须是被撤销能力的委派路径中的祖先），以通知负责管理资源的服务特定能力不再有效；

    * 服务/操作请求是所提供服务设想的服务请求，唯一附加特性是以不可伪造的方式引用或包含一个能力。例如，对于 `RESTful` 服务，对其中一个公开的 REST
    资源进行的 `HTTP GET` 请求只需包含能力及其所有权证明即可使用我们的访问控制机制；

    * `PDP`（策略决策点）是负责管理资源访问请求验证和决策的与资源无关的服务。在 `CapBAC` 环境中，它处理在能力中授予的访问权限与本地策略的验证，并检查委派链中能力的撤销状态；

    * 资源管理器是管理针对/到已标识资源的服务/访问请求的服务。资源管理器检查随服务请求发送的能力令牌的可接受性，以及所请求服务/操作与所展示能力之间的有效性和一致性。它充当
    `XACML` 策略执行点（`PEP`），并考虑 `PDP` 的验证结果；

    * 撤销服务负责管理能力撤销。


    ![图 2.4 基于能力的授权架构组件及其交互。](img/fig2_4.jpg)


    图 2.4 基于能力的授权架构组件及其交互。


    ### 2.3.3 GAMBAS 自适应中间件（GAMBAS 贡献）

    `GAMBAS` 项目开发了一种创新且自适应的中间件，以实现以行为驱动的服务在保护隐私的同时实现自动化利用，这些服务能够自主适应用户的上下文。与当今主要通过移动浏览器或移动应用程序按需搜索实现的移动信息访问相比，`GAMBAS`
    设想的中间件将能够在正确的时间主动访问正确的信息。因此，`GAMBAS` 中间件所实现的上下文感知自动化将为其用户创造无缝且干扰更少的体验，同时降低应用程序开发的复杂性。


    如 图 2.5 所示，`GAMBAS` 实现的核心创新是开发模型和基础设施以支持上下文的可互操作表示和可扩展处理，开发通用但资源高效的框架以实现用户上下文的多模态识别，以及用于强制执行用户隐私的协议和机制，以及用于优化与行为驱动服务交互的用户界面概念。


    ![图 2.5 GAMBAS 中间件。](img/fig2_5.jpg)


    图 2.5 GAMBAS 中间件。


    从安全和隐私的角度来看，`GAMBAS` 中的开发集中于一个安全的分布式架构，其中数据采集、数据存储和数据处理都由用户严格控制。因此，安全和隐私基于以下要素。

    * 个人采集和本地存储：`GAMBAS` 中数据采集的主要手段是特定用户拥有的个人互联网连接设备，例如用户的手机、平板电脑、笔记本电脑等。通过这些设备的内置传感器获取的数据被本地存储，以便用户保持完全控制。值得注意的是，中间件提供了禁用特定传感器子集的机制，以防止积累用户根本不想收集和存储的数据。

    * 匿名数据发现：为了实现单个用户或一组用户之间设备的共享，本地设备上的数据存储可以连接起来形成分布式数据处理系统。为此，`GAMBAS` 中间件引入了一个数据发现系统，该系统使用假名以避免泄露用户身份。假名可以与用户定义的一组合法人员以自动方式同步，以便能够动态更改它们。

    * 基于策略的访问控制：为了限制对用户数据的访问，联网的数据存储基于用户可以定义的策略执行访问控制。为了减少配置工作量，`GAMBAS` 中间件包含一个策略生成工具，可用于根据用户在使用社交服务时表现出的共享行为推导出初始设置。


