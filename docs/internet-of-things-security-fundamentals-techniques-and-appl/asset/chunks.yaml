    The variable `key` if implemented as suggested will not result in the repetition
    of patterns, unlike in the normal mode. `AVK` depends on the data sent previously.
    There is no guarantee that the previously sent data may not be stolen. This needs
    further investigations for proper utilization of the time-variant `key` \[2, [4](#Ch06.xhtml#ref6_4)\].
    In order to solve the problem, there should be some technique such that the previously
    sent data are protected or there are some storage media where a replica of the
    data can be stored. The circuit will behave as a multiplexer where the control
    signal will govern whether there is a need to swap-in of data from the data-store
    or not \[6–[9](#Ch06.xhtml#ref6_9)\].


    Designing a good cryptosystem not only requires encryption algorithms and key
    management protocols but also requires necessary testing to test the design under
    cryptic pattern discovery and mining.


    The parametric `Fibo-Q` model uses parameter `n` as input for computation of `key`.
    Sparse approach uses location (`i`, `j`) as two parameters for computation of
    `keys`. The `keys` used in these approaches were numeric `keys`. To extend the
    idea over alphanumeric `keys`, the parameters like

    `p[1]` = part of vehicle number, `p[2]` = nickname, and `p[3]` = date of birth
    of spouse, can be used. The possible key samples may be `mp09t!nku020284`, `mp09b0b020284`,
    `mp09t!nku020286`, etc. The keys generated in this fashion are `{P[1]P[2]P[3],
    P[1]P''[2]P[3], P[1]P[2]P''[3], P''[1]P[2]P''[3…]}`. Hence, by changing parameter
    values, variable `keys` can be generated. The alphanumeric mixed `key` construction
    using this approach is to be analyzed from the hacker’s perspective. The parameters
    from the possible parameter set used in different sessions can be found through
    association rules. The parameters may be associated with the device location of
    IoT and used to generate its secret `key` for secure communication. The `keys`
    may also be used as OTP for authentication. To simplify the situation, we have
    taken real-world persons as a device and associated information of the person
    will act as a parameter for the generation of a secret `key`. The public information
    of element of the IoT network may be captured by peeping tom and used to predict
    the parameters and also the final `key`. The next section deals with basic association
    rules and examples and presents mining and frequent patterns discovery for the
    proposed parametric `AVK` model analysis.


    ### 6.3.1 Apriori Approach for Parameter Prediction


    Conventionally, the association rule `X → Y` indicates that if the `key` (antecedent)
    appears, then the parameter set (consequent) `p[i]`, `p[j]`, …, `p[k]` also tends
    (with highly probable) to appear, where `X` and `Y` may be single parameters or
    set of parameters (in which the same parameter does not appear in both sets) \[[10](#Ch06.xhtml#ref6_10)\].
    In other words, `X` and `Y` would be found together frequently in the given training
    set and they do not show a causal relationship \[[11](#Ch06.xhtml#ref6_11)\].


    For example, the number of parameters in session [Table 6.1](#Ch06.xhtml#table6_1)
    is 16. The `key` of a particular session is constituted from a variable number
    of parameter terms `{p[i], p[j], …, p[k]}` and it is denoted by `f(p[i], p[j],
    …, p[k])`, where `p[i]`, `p[j]`, …, `p[k]` are variables specific to a particular
    session. Further, assume that information of `n`-sessions is available (Table
    6.1). Each session of Table 6.1 is denoted by `S = {S[i], S[j], …, S[k]}` with
    a unique `session-Id` and function `f(.)` with a set of parameters (possibly a
    small subset) constituting each session `key`. Each session `key` of `m` parameters
    is with `key` `f(p[i], p[j], …, p[k])`. Typically, the session `key` is varied
    due to differences in the number of parameters. A cryptanalyst has a record of
    what parameters are used for each session to generate its session `key`. The goal
    of cryptanalyst here is to find association relationships from a given large number
    of session `keys`, to identify the parameters that tend to occur together. In
    Table 6.1, each row shows the set of parameters that are used in each session.


