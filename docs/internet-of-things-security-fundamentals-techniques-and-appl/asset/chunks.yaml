    ## 1.3 Business Aspects in IoT

    With the emergence of IoT, the business processes can become smooth and robust
    at the fundamental level and can reach greater heights with smart devices and
    automated products. IoT has the power to transform the business applications.
    The business aspects of IoT have focuses on the following key elements:

    * Smarter products in companies: The pocket size smart phones bear a lot of things
    of the world inside it. The smart devices result in the quick and instantaneous
    processing of applications and execute business activities in a comparatively
    short period of time.

    * Enable smarter business operations and smarter decisions: The feedback process
    becomes easy and prediction of future impacts can be judged.

    * Change in business model: The primitive producer–consumer trend has been greatly
    revolutionized by IoT. It offers time-saving business solutions.


    ## 1.4 Industrial IoT (IIoT)

    The extension of IoT to the manufacturing industry is defined by the term IIoT.
    It radically changes the process of manufacturing by empowering the addition and
    accessibility of huge amount of data at extremely high speeds and in a systematic
    and cost-effective manner. Many of the companies are now implementing IIoT to
    incorporate sensor data, to constantly and accurately capture the communicating
    data, and for the efficient monitoring of the overall supply chain, quality control,
    to store information about equipments, vehicles, and containers and for the traceability
    of industrial processes.

    IIoT produces data which are exponentially large compared to that of generated
    by IoT. For example, around 500GB data can be produced by a single turbine compressor
    blade in one single day. And therefore, IIoT requires combining not only computers
    and Internet but also the modern day technologies of Big Data, Cloud Computing,
    and Machine Learning. There is also an important remark associated with IIoT,
    which can be understood as IoT is important but not critical while IIoT failure
    might result in life-threatening or other emergency situations. IIoT is thus a
    very promising technology and it assures the emergence of the next industrial
    revolution by creating a platform of connectivity and to drive industrial solutions
    with IoT.

    The key elements in IIoT are:

    * Exchange of information is between business to business, rather than from business
    to consumers.

    * The market segments of IIoT are huge enterprises compared to small business
    or limited enterprise of IoT.

    * The data volume of IoT is termed Big Data. In IIoT, there are limited but specific
    data.

    * IoT focuses on consumer convenience and consumer needs. IIoT aims to cut down
    the investments and improvement of return costs.


    ### 1.4.1 Security Requirements in IIoT

    The industrial Internet aims at improving the efficiency and productivity of the
    production process throughout the supply chain ([Figure 1.2](#Ch01.xhtml#fig1_2)).
    IIoT encompasses those areas with high stake industries, for e.g., oil and gas
    supply chains, power grids, heavy machineries, and sensors. Any security breach
    in these applications could cause a huge impact on business solutions. There could
    be a threat to data security.


    ![Figure 1.2 IIoT operations.](Images/fig1_2.jpg)


    [Figure 1.2](#Ch01.xhtml#bck_fig1_2) IIoT operations.


    Ignoring security and privacy issues could endanger not only the user activities
    but also the operation and functionality of devices. IIoT security includes the
    concern for safety and reliability.


    ## 1.5 Vehicular Sensor Networks (VANETs)

    A vehicular *ad hoc* network (VANET) considers a vehicle as a node that transmits
    messages among vehicles. It is a subset of IoT that could be termed IoV. Vehicles
    are smart objects, equipped with sensors, and have IP-based connectivity. A VANET
    transmits messages between intra-vehicle components, vehicle to vehicle, and vehicle
    to people. The processing of messages is based on sensing capabilities of vehicles.

    A VANET boosts the foundation of an Intelligent Transportation System (ITS), which
    has the potential to offer a rich set of applications to its customers, which
    acts as a roadside infrastructure for using security and services.


