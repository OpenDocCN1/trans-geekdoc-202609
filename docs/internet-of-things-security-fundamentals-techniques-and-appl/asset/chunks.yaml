    ## 6.5 参数模型密码挖掘结果分析


    对观察结果（表 6.9）的分析可以得出以下推断：22 个参数和 100 个调查响应的频繁模式基数数量过大。对于支持度低于 5% 的情况，频繁模式范围从 70,000
    到 63,00,000，这表明少数人选择的频繁参数组合组合过大。


    1. 实际上，不同的人以相同方式选择参数的可能性确实非常低。

    2. 结果还显示，随着支持度百分比的增加，频繁模式急剧减少。

    3. 从较高支持度获得的频繁模式数量很少，可以轻松分析，但同时观察到频繁模式本质上是显而易见的，其大小（项集大小）也很小。因此，通用参数不需要分析。例如，在我们的案例中，参数
    12（密钥混合大小写选择）非常自然。

    4. 根据所获得的结果（参见表 6.10 中的频繁模式）可以得出另一个结论：支持度较高的频繁模式没有用处，因为很多人以相同方式思考密钥参数选择的几率很小。但少数人可能会以相同方式思考，为此我们需要降低支持度百分比，然后模式会以不同大小呈指数增长，这使得手动分析变得不可能，并且系统很难破解它。


