- raw: 'Datagram transport layer security (DTLS) is a communication protocol that
    provides security for datagram-based applications. For this purpose, it allows
    the applications to communicate to prevent eavesdropping, tampering, or message
    forgery. The DTLS protocol is based on the stream-oriented transport layer security
    (TLS) protocol. The DTLS provide a similar security guarantee to TLS. The DTLS
    protocol datagram preserves the semantics of the transport so that the application
    has not to suffer from the delays associated with stream protocols, but it has
    to take care of packet reordering, loss of datagram, and data larger than the
    size of a datagram network packet. There are three main elements when considering
    security, namely, integrity, authentication, and confidentiality. DTLS can achieve
    all of them. DTLS solves two problems, reordering and packet lost. DTLS adds three
    implements: first, packet retransmission, second, assigning sequence number within
    the handshake, and third, replay detection. Unlike network layer security protocols,
    DTLS in the application layer protects end-to-end communication. The endto-end
    communication protection will make it hard for attackers to access to all text
    data that pass through a compromised node. DTLS also avoids cryptographic overhead
    problems that occur in lower layer security protocols.


    ### **4.7.4** **CoAP (Constrained Application Protocol)**


    Constrained Application Protocol (CoAP) is now becoming the standard and popular
    protocol for IoT applications. Security is always a major concern to protect the
    communication between devices. It is a lightweight protocol designed for M2M communications
    within IoT applications. CoAP uses Datagram Transport Layer Security (DTLS) as
    communication protocol. CoAP is by default bound to UDP and optionally to DTLS,
    providing a high level of communication security \[[15](#Ch04.xhtml#ref4_15)\].


    ### **4.7.5** **XMPP (Extensible Messaging and Presence Protocol)**


    Security has always been a key issue for XMPP. The security considerations in
    XMPP are high security, certificate validation, client–server communication, server–server
    communication, protocol layers, firewalls, and base64. *High security* is the
    mutual confidentiality which is maintained in both sides of communication when
    a certification-based authentication is provided. If the certificate is issued,
    then only the authorized certificate should be accepted. *Certificate validation*
    is when a certificate is issued, it should be reviewed by both the communicating
    objects. In *client–server communication*, the client must support the TLS and
    Simple Authentication and Security Layer (SASL) protocols to connect to the server.
    The encryption of the XML stream is done using TLs and the authentication is supported
    out by the SASL. After the service is verified, then only the client should communicate
    to the server. The IP address which the client communicates should be kept private
    so that the channel is prevented from intruders.


    In *server–server communication* unlike the client, the server should support
    the TLS and SASL protocol for ease of communication. Authentication and integrity
    of the data are ensured with the use of SASL in the server communication. *Protocol
    layers* consist of four protocols in order to be used in XMPP as mentioned in
    the security implementation. The protocols are TCP, TLS, SASL, and XMPP, where
    TCP is the base layer where the connection between the client and the server is
    established. TLS encrypts the XML stream, SASL provides authentication, and XMPP
    is the application layer. For *Firewalls*, TCP is widely used for XMPP communication.
    For client-to-server communication, port 5222 is used and for server-to-server
    communication, port 5269 is used. *Base64* helps to recognize the trusted client
    and server. The server validates the client and if any data are found irrelevant,
    then they are not accepted. This improves the data integrity and passing the correct
    data.


    ## **4.8** **Security Management**


    It is the set of functions that protect the data against unauthorized access,
    control the activity of user operations, set up security rules, monitor security
    events, etc. There are many security management techniques used of which two of
    the most important are discussed here which can be useful for IoT.


    ### **4.8.1** **Identity and Access Management (IAM)**


    It is the security discipline that enables the access of a right resource to a
    right individual at a right time for a right reason. This management is mission-critical
    and requires to make sure that proper access to resources across increasingly
    heterogeneous technology environments is granted and also to meet increasingly
    rigorous compliance requirements. It covers many issues related to security such
    as how users can achieve an identity, the protection of user identity, and also
    the technologies which support that protection (e.g., network protocols, digital
    certificates, passwords, etc.). IAM has the following functions:-


    *   The pure identity function which includes creation, management, and deletion
    of user identities without concern to access or entitlements.


    *   The user access (log-on) function which defines how proper users can gain
    access to the system with provided credentials.


    *   The service function which includes a system that delivers the user and devices
    personalized, role-based, online, on-demand, multimedia content, and presence-based
    services.


    *   Identity federation which includes a system that relies on federated identity
    in order to authenticate a user without knowing his or her password. Identity
    federation is made up of one or more systems that associate user access and allow
    users to log in based on authenticating against one of the systems acting in federation.


    In addition to creation, deletion, and modification of user identity data, identity
    management also controls additional entity data for use by applications, such
    as contact information or location. The system capabilities of IAM are authentication,
    authorization, roles, delegation, and interchange. The *authentication* is a verification
    of users using a password or a biometrics device. *Authorization* is managing
    authorization information that defines who can access what operations in the context
    of a specific application. *Roles* are the groups of operations that users are
    granted. Roles are often related to a particular job or job function. For example,
    a user administrator is authorized to reset a user’s password, while a system
    administrator may have the ability to assign a user to a specific server. *Delegation*
    allows local administrators to perform system modifications without a global administrator.
    It may also mean that one user can perform operation on behalf of other user.
    *Interchange* is the use of Security Assertion Markup Language (SAML) protocol
    to exchange identity information between two identity domains \[[16](#Ch04.xhtml#ref4_16)\].


    The IAM can be illustrated through the IoT-based smart parking system. The smart
    parking system is an IoT reference system because it contains multiple endpoints
    that capture data and send it to the database storage on the IoT server. The system
    also provides data analytics and decision making. In this example, the smart parking
    system, as discussed by Russell et al. \[5\], has the following features:


    *   Consumer-facing service: This service allows customers to locate the vacant
    parking spot and pricing.


    *   Payment flexibility: This service allows customers to pay for parking space
    using multiple payment methods such as credit cards, cash/coins, and mobile payment
    services.


    *   Entitlement enforcement: This service allows the ability to track time for
    purchased parking spot, determine the expiry time, sense the overstayed time at
    the parking spot, and communicate the violation to parking enforcement.'
