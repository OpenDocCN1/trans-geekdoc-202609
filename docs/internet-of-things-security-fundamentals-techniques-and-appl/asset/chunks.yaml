  trans: '

    * 安全的分布式查询处理：在由已连接且受访问控制的本地数据存储组成的集合之上，GAMBAS 中间件能够以安全的方式实现分布式查询处理。为此，查询处理引擎使用由新颖的密钥交换机制引导的身份验证机制和加密协议，这些机制利用用户已使用的现有
    Web 基础设施。


    ### 2.3.4 IoT-A 架构（IoT-A 贡献）

    安全是物联网的重要基石。因此，在 IoT-A 项目中，我们认为全面解决各个方面的安全和隐私问题非常重要。基于外部和内部利益相关者的输入形成的一组需求被用作识别保证用户数据隐私和完整性、用户身份验证以及系统可信度的机制和功能的基础。


    这些功能在 WP1 的框架内被分析并在功能组（FG）和功能组件（FC）中进行编排。高层 PS&T 规范在 IoT-A 架构参考模型（ARM）框架内得到整合，然后传递给处理通信协议（WP3）、基础设施服务（WP4）以及硬件方面（WP5）的垂直
    WP。由于物联网提供的高度异构环境以及分析师预测的庞大数量的已连接（自主）设备，高度关注可扩展性和互操作性。


    ARM 文档 \[5\] 为理解和采用 IoT-A 的开放架构铺平了道路，同时提供了我们所采用的物联网安全、隐私和信任设计策略的总体定义。然后，在 WP3
    中，我们分析了物联网边缘部分通信的安全性及其对整体通信架构的影响。在此背景下，我们研究了 HIP 和 HIP-BEX 协议，并考虑了诸如移动性、协作密钥建立以及使用
    PANA/EAP 保护网络接入等问题。


    然后，在 WP4 \[6\] 的框架内，我们为 IoT-A 开发了安全的解析基础设施。它确保了解析功能的安全性和隐私性，并为解析基础设施之外的其他安全功能提供基础。它控制对物联网资源、现实世界实体以及相关信息（包括各自的标识符）的访问。此外，解析基础设施还提供对匿名性的支持：用户在使用物联网资源或更高级别服务时无需透露其身份。为实现所有这些目标，开发了各种安全组件（图
    2.6）。它们涉及授权和身份验证、密钥交换和管理、信任与声誉以及身份管理。


    ![图 2.6 IoT-A 解析基础设施中的隐私和安全组件。](img/fig2_6.jpg)


    **图** **2.6** IoT-A 解析基础设施中的隐私和安全组件。


    最后，WP5 处理设备级隐私和安全。特别是，它描述了用于验证 RFID 设备并提供读写器与标签之间通信保密性所需的机制。IoT-A 架构的 PS&T 特性将在即将到来的
    IoT-A eHealth 用例中进行测试。


    ### 2.3.5 Butler 项目中的治理、安全和隐私（Butler 贡献）

    BUTLER 项目的目标是创建一种实验性技术平台，以支持物联网的发展。BUTLER 方法的主要特点是其针对的“横向性”：BUTLER 背后的愿景是一个无处不在的物联网，同时影响我们生活的多个领域（健康、能源、交通、城市、家庭、购物和商业）。因此，BUTLER
    平台必须能够通过提供通信、定位和情境感知能力来支持不同的“智能”领域，同时保证其安全性和终端用户的隐私。安全和隐私问题在 BUTLER 项目中至关重要，并体现在多个需求中，主要需求涉及：


    * 物联网应用中存在数据安全方面的标准问题，既涉及数据存储层面，也涉及数据通信层面。物联网连接的“事物”的多样性和多重性以及交换的数据进一步放大并复杂化了这些需求。

    * 物联网支持的应用在使用数据方面可能带来额外的隐私问题，从应用程序收集数据（应以用户“知情同意”协议为条件）到为实现真正的“情境感知”而进行的这些数据的画像、交换和共享。


    数据技术保护^()


    然而，隐私和安全不仅指网络上数据交换的安全性，还应包括：（a）交换数据的准确性保护，（b）服务器信息的保护，（c）通过明确的动态授权机制保护数据的用途，（d）数据的选择性披露，以及（e）“数据使用透明度”政策的实施。


    BUTLER 项目还从其对商业模式的影响角度解决安全和隐私挑战。为了明确 BUTLER 中设想的横向物联网平台，项目从收集和分析多达 70 个用例的需求开始。这些用例的分析不仅为平台规范产生了需求，还提供了有关部署横向物联网的潜在社会经济影响以及对相关商业模式的影响的宝贵信息。


    如果得到适当处理，伦理和隐私问题将从威胁转变为机遇。用户对服务的更好理解增加了接受度并建立了对服务的信任。这种信任成为服务提供商的竞争优势，可成为其商业模式的基石。反过来，服务提供商对伦理和隐私问题的经济利益源于这种竞争优势，成为用户隐私将得到尊重的保证。BUTLER
    项目关于伦理、隐私和数据安全对商业模式和社会经济影响的研究将发表在 Deliverable 1.4（2013 年 5 月）和 Deliverable 1.3（2014
    年 9 月）中。


    终端用户参与概念验证和实地试验是 BUTLER 项目的另一个特点。终端用户参与不仅是验证 BUTLER 平台的技术质量（技术可行性、集成和扩展）的关键，也是评估终端用户对未来“横向”物联网设想场景的感知和接受度的关键。


    然而，在项目范围内涉及终端用户需要谨慎处理其数据和隐私问题。实地试验和概念验证的详细规范在 Deliverable 1.2 中有描述（计划于 2013 年
    5 月底完成）。组织终端用户参与时必须考虑以下问题：


    1. 必须建立技术安全机制以确保参与者的安全和隐私。这涉及安全的数据通信和存储，在 BUTLER 项目范围内，这由开发并集成到 BUTLER 平台中的使能安全技术解决。

    2. 参与者必须充分了解实验的范围和目标。在 BUTLER 的情况下，这涉及向公众解释项目范围和目标的特定努力。

    '
