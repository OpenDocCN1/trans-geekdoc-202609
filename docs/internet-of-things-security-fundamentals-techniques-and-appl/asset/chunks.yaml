    ### 6.3.1 用于参数预测的 Apriori 方法


    传统上，关联规则 `X → Y` 表示如果 `key`（前件）出现，则参数集（后件）`p[i]`、`p[j]`、…、`p[k]` 也倾向于（高度可能）出现，其中
    `X` 和 `Y` 可以是单个参数或参数集（其中同一参数不会同时出现在两个集合中）\[10\]。换句话说，`X` 和 `Y` 在给定的训练集中会经常一起出现，并且它们不显示因果关系
    \[11\]。


    例如，会话中参数的数目表 6.1 为 16。特定会话的 `key` 由可变数量的参数项 `{p[i], p[j], …, p[k]}` 构成，并表示为 `f(p[i],
