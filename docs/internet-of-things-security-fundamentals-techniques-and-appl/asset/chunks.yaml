    The responses received are collected through Google form, which was shared over
    professional network (LinkedIn), social network (Facebook and Google plus), and
    Google groups of aluminous of DAVV to get real trends. The baseline from the hacker’s
    perspective on the parametric `AVK` model may be used to find out which parameters
    are favorable for key constructions. Which among those are the most prominent
    or frequent? Is there any association among these parameters? But with a large
    number of pairs, determination of correlation will be costly. Finding correlation
    will be easy in case of less number of parameters. We used the `SPSS` tool to
    analyze the survey result, because it provides grouping of parameter sets into
