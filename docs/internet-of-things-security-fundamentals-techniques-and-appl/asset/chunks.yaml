    ### 6.4.3 Frequent Patterns Generated for Parametric AVK Model

    Traditional `Apriori` algorithm is applied on response data with a variable number
    of parameters. To analyze the responses, `Apriori` algorithm is applied to response
    data with tab delimited text file format used as the input file. The same file
    also stores the end results. The algorithm can be used in two ways: first, find
    the frequent parameter set by pruning the candidate parameter set with a user-defined
    support threshold value. Later for rule generation, the minimum support and confidence
    are varied over range (1–100%). With respect to variable support, variation in
    the number of frequent parameters, the time consumed in seconds for generation
    of association rules, and corresponding file size has been captured as shown in
