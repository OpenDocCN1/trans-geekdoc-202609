  trans: '

    可用性可以通过仔细维护所有必需的硬件、在需要时立即进行硬件维修，以及维护不受软件冲突影响的正常运行的操作系统环境来确保。可用性在物联网中非常重要，因为所有配备传感器的物联网设备都需要全天候保持运行。还应保持系统设备更新至软件或固件的当前版本。物联网设备传输数据也需要足够的通信带宽，以防止瓶颈出现。冗余、故障转移、RAID
    甚至高可用性集群可以在硬件问题发生时减轻严重后果；因此，对于最坏情况而言，快速且自适应的灾难恢复至关重要。还应包含针对数据丢失或连接中断的保障措施，以应对自然灾害和火灾等不可预测事件。额外的安全设备或软件，例如防火墙和代理服务器，也可用于防范因拒绝服务（DoS）攻击和网络入侵等恶意行为导致的停机和数据无法访问。


    ### 4.2.2.4 不可否认性


    不可否认服务提供数据来源或数据交付的保证，从而可以保护发送方免受接收方对其已收到数据的虚假否认，或保护接收方免受发送方对其已发送数据的虚假否认。不可否认是指证明某事件已发生的能力，从而以后无法对其进行否认。例如，在电子邮件系统中，不可否认用于保证接收方无法否认收到消息，发送方也无法否认发送消息。不可否认是一种通过数字签名、加密等方式保证对象之间消息传输的方法。它是信息保证（IA）的五大支柱之一。不可否认也是物联网中的一个重要方面。因为物联网中的数据最为重要，因此在灾难恢复系统、工业和研究、医疗保健等实时系统中变得更加关键，在这些系统中数据本身在系统中发挥着重要作用。在这种情况下，不可否认服务发挥着重要作用。


    数字签名是一种密码学功能，可用于在物联网系统中实现不可否认服务。数字签名还提供完整性、认证和数据来源保护。它设计为仅属于签名者，即负责签署消息并拥有签名密钥的个人或设备。数字签名有两种类型，一种使用对称密钥（秘密共享密钥），另一种使用非对称密钥（私钥不共享）。在图
    4.2 中，发送消息的物联网设备会将其签名添加到消息中。被发送的消息现在称为签名消息，任何拥有适当密钥的其他物联网设备都可以执行签名操作的逆操作，即签名验证。如果签名验证过程失败，则验证者不应信任数据的完整性，即使它们据称来自受信任的来源[5]。


    ![图 4.2 防欺骗和篡改的数字签名保护。](img/fig4_2.jpg)


    图 4.2 数字签名防止欺骗和篡改的保护。


    为了理解物联网系统中的不可否认服务，可以考虑医疗保健传感器应用的示例。医疗保健传感器应用提供无线泛在网络功能。医疗保健传感器应用基于具有传感和/或执行能力的微小节点的互联，并放置或植入人体内。医疗保健传感器应用本质上是感知上下文的、个性化的和动态的。它感知患者的活动并通知远程位置的医生有关患者的健康问题。信息可能至关重要，如果出现某些紧急医疗状况且患者需要关注。
    因此，此类应用需要对数据的来源和交付提供保证，例如，如果医生感到需要发送关于患者健康状况的决定而该决定需要患者本人或执行器立即响应或采取行动。物联网应用在这种情况下的失败会影响医生的决策并导致可能对患者造成伤害的不理想结果。因此，为了保护此类通信，可以使用数字签名。数字签名，如上所述，有助于保护此类通信，使攻击者无法伪造数据，并且由于受到保护，接收端的设备无法否认其来源。因此，此类保护保证了有关患者的此类重要信息的传递。


    ## 4.3 物联网架构


    物联网架构由链路层、网络层、传输层和应用层等四个层组成，架构由传感器设备、网关设备、互联网上的云服务、通信设备和介质等组成。如图 4.3 所示，物联网架构的每一层负责特定任务并由不同的协议组成。物联网架构还具有各种通信方法。本节根据架构中的通信模型讨论物联网架构。


    ![图 4.3 物联网层和协议。](img/fig4_3.jpg)


    图 4.3 物联网层和协议。


    ### 4.3.1 设备到设备通信


    该模型表示两个或多个设备直接连接并相互通信，而不是通过中间应用服务器。这些设备通过多种类型的网络通信，包括 IP 网络或互联网。设备到设备通信的示例是通过智能手机软按钮控制的智能灯泡。另一个示例可能是智能交通系统中的车对车通信，其中一辆车向另一辆车发送警告消息，针对两车之间的短距离。


    ### 4.3.2 设备到云通信


    在此模型中，物联网设备直接连接到物联网的云服务。物联网云服务负责收集和存储传感器设备的数据、设置规则并对这些数据进行处理。云服务可为物联网设备提供多种服务，如通过社交网络共享数据、生成警报等。此方法利用现有的通信机制，如有线以太网或
    Wi-Fi 连接，在设备与 IP 网络之间建立连接，最终通过互联网连接到云服务。


    ### 4.3.3 设备到网关


    在此模型中，物联网设备连接到本地网关设备，网关设备连接到互联网。此方法为物联网基础设施增加了额外的强度和安全性。网关设备可以通过防火墙来过滤信息。物联网网关设备充当物联网传感器设备与互联网上的云服务之间的中间件。


    ### 4.3.4 后端数据共享


    该模型是指一种通信架构，允许用户导出和分析从物联网传感器设备收集并上传到云的数据，以便与其他服务或其他数据源共享。该架构提供了一种向第三方、组织、服务或用户授予对已上传传感器数据访问权限的方式[6]。


    ## 4.4 物联网协议

