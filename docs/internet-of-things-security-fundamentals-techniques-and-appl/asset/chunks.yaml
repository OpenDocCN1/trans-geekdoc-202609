    # 3 IoT Data Processing: The Different Archetypes and Their Security and Privacy
    Assessment

    Pijush Kanti Dutta Pramanik and Prasenjit Choudhury


    Dept. of Computer Science & Engineering, National Institute of Technology, Durgapur,
    India


    DOI: 10.1201/9781003338642-3


    Undoubtedly, in recent years, Internet of Things (IoT) has created the maximum
    ripples in the IT industry. Large-scale implementation of IoT will generate a
    massive amount of data. To obtain actionable knowledge, these data must be processed.
    But the complex nature of these data and the IoT architecture as well have made
    the processing of a complicated task. This chapter looks into the fact how it
    becomes challenging to the computing fraternity to process the diverse types of
    dynamic data generated from diverse heterogeneous IoT devices. This chapter will
    help readers in having an overview of the different architectures for IoT data
    processing. Each architecture is discussed decoratively along with the associated
    challenges. The open and ubiquitous nature of IoT makes it more vulnerable to
    the security threats. The issues pertaining to security and vulnerabilities that
    are faced by the architectures are discussed specifically. Along with a general
    discussion on the security and privacy issues in IoT, the authors have also portrayed
    a different view on the overhyped concerns for the security and privacy aspects
    in IoT. The purpose of this chapter is to make readers able to decide on the suitable
    data processing architecture for their IoT applications considering different
    factors such as cost, response time, etc., with a special focus on security and
    privacy.


    ## 3.1 Introduction

    Internet of things (IoT) has brought probably the largest wave in the cyber industry
    after the Internet and mobile communications \[[1](#Ch03.xhtml#ref3_1)\]. IoT
    refers to an interconnected setup \[[2](#Ch03.xhtml#ref3_2)\] which allows remote
    accessing of the objects (things) over the Internet. These things are typically
    furnished with some sort of sensors and may include mobile devices, washing machines,
    street cameras, wearable devices, medical equipment, etc. As the number of such
    connected devices is growing at an express pace, by the next few years, it will
    become virtually boundless. This extensive number of things will result in an
    unforeseen amount of data generation. Besides others, the most vital but obvious
    concern is to be addressed that how to process such a huge and ever-increasing
    amount of data? Processing this humongous data is definitely challenging, especially,
    considering the heterogeneous and dynamic nature of IoT. To utilize the IoT systems
    most advantageously and effectively, an efficient data processing system is needed
    that can address different issues arises in the execution of IoT data capturing,
    processing, and consuming. Business organizations are recognizing great opportunity
    to mould their business to IoT-oriented. Understanding the nitty-gritty of different
    architectures will help the organizations in implementing IoT judiciously.


    Since the IoT devices are typically characterized by a limited computational and
    storage capacity, it requires some external data processing means. One of the
    crucial decisions has to be taken by the IoT developers and implementers is that
    where to process the vast IoT data. Whether it is to be processed within the IoT
    devices or they should be processed in a remote centralized data center or in
    between somewhere else. Whether organizations should process on-premises using
    own infrastructure or a third-party service should be called on and so on.


    Every networked system is vulnerable to security and privacy threats. IoT is also
    no exception. The widespread use of IoT on a huge scale has made the risk graver.
    The security of IoT data is of paramount importance, as it can open up vulnerabilities
    to both the user and the system due to the fragile nature of the data.


    The rest of the chapter is organized as follows. In [Section 3.2](#Ch03.xhtml#sec3_2),
    some typical properties of IoT have been enlisted. In [Section 3.3](#Ch03.xhtml#sec3_3),
    we shall mention the challenges that are to be dealt with in IoT data processing.
    [Section 3.4](#Ch03.xhtml#sec3_4) addresses the core theme of this chapter, i.e.,
    all the possible architectures that can be used for processing IoT data considering
    different factors. The security and privacy issues of each archetype are identified
    in [Section 3.5](#Ch03.xhtml#sec3_5). A general discussion on the security and
    privacy issues in IoT has been stated in [Section 3.6](#Ch03.xhtml#sec3_6), whereas
    in [Section 3.7](#Ch03.xhtml#sec3_7), we present a rational view on whether the
    overstressed concern on the security and privacy in IoT is really that worrisome.
    Finally, [Section 3.8](#Ch03.xhtml#sec3_8) concludes the chapter.


    ## 3.2 Properties of IoT Data

