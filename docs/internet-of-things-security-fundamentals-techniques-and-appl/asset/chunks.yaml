    chain;

    * The resource manager is the service that manages service/access requests for/to
    the identified resource. The resource manager checks the acceptability of the
    capability token shipped with the service request as well as the validity and
    congruence of the requested service/operation against the presented capability.
    It acts as an `XACML` Policy Enforcement Point (`PEP`) which considers the validation
