- raw: '**Dr. Shishir Kumar Shandilya** is a renowned academician and an active researcher
    with proven record of teaching and research. He is a Cambridge University Certified
    Professional Teacher and Trainer, a Senior Member of IEEE-USA, and also elected
    as an executive member of the IEEE Industry-Outreach Committee-India. Dr. Shandilya
    has received the “IDA Teaching Excellence Award” for distinctive use of Technology
    in Teaching by Indian Didactics Association, Bangalore, and the “Young Scientist
    Award” for two consecutive years (2005 and 2006) by Indian Science Congress and
    MP Council of Science and Technology. He has written seven books of international-fame
    (published in USA, Denmark, and India) and published over 50 quality research
    papers. He is an active member of over 20 international professional bodies. He
    is also an excellent programmer and credited various software projects in his
    account. He is also giving consultancy in IT as a Sr. Consultant. He has recently
    delivered an expert lecture on “Opinion Mining” at Oxford – United Kingdom.


    **Dr. Soon Ae Chun** is a professor and the director of Information Systems and
    Informatics program, and a Graduate Center doctoral faculty member of Computer
    Science at the City University of New York. She is the director of the Information
    Security Research and Education Lab (iSecure Lab) sponsored by NSF. She is a Fulbright
    Scholar and the recipient of the CSI Dolphin Award for Outstanding Scholarly Achievement.
    She is served as the President of the Digital Government Society. Professor Chun’s
    research interests include security and privacy, semantic web, data integration,
    social data analytics, and workflow. Dr. Chun’s current research projects include
    the development of a cybersecurity ontology, a Linked Data development of multi-modal
    cybersecurity educational data, and research on social data analytics in the Healthcare
    domain. Her research has been sponsored by NSF, NOAA, a New Jersey State Agency,
    CUNY, and Fulbright. Professor Chun has published in security and database journals,
    such as Journal of Computer Security, IEEE Transactions on Dependable and Secure
    Computing, Journal of Distributed and Parallel Databases, Journal of Information
    Sciences, as well as applied informatics journals such as Government Information
    Quarterly and Information Polity. Dr. Chun has served as conference chairs at
    the International Conference on Digital Government Research and the IFIP conference
    of Database and Applications Security and Privacy, a track chair of the Semantic
    Web Applications at ACM Symposium of Applied Computing, and a program chair of
    the International Conference on Digital Government Research. Professor Chun is
    an IEEE senior member and a member of the ACM, the Digital Government Society,
    and the Beta Gamma Sigma Honor Society.


    **Dr. Smita Shandilya** is an eminent scholar and energetic researcher with excellent
    teaching and research skills. She achieved excellent result in all the subjects
    she has taught till date. She has over 20 quality research papers in international
    and national journals and conferences to her credits. She has delivered several
    invited talks in national seminars of high repute. Her research interests are
    power system planning and smart micro grids. She is one of the core members of
    the research and development section of her Institute. She is also involved in
    various projects like the establishment of Energy Lab in the Institute (first
