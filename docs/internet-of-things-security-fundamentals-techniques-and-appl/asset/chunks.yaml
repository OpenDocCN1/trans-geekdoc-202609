    `key`。`keys` 也可作为一次性密码用于身份验证。为简化情况，我们将现实世界中的人作为设备对待，个人的相关信息将作为生成秘密 `key` 的参数。物联网网络元素的公开信息可能被偷窥者捕获并用于预测参数以及最终的
