    物联网以巨大方式影响了我们的生活，未来也将继续如此。未来的物联网设备将真正无处不在，并将比今天更广泛地使用。物联网设备数量的增加将产生大量数据。为了充分利用物联网的真正潜力，这些数据需要得到有效处理。为此，需要合适的
    数据捕获和处理架构。本章我们讨论了其中几种架构。我们看到处理物联网数据是一项具有挑战性的工作。我们还评估了每种架构的安全性和隐私方面。我们看到如果数据在家庭网络内处理（例如，Grid
    和 Fog），风险较小，因为数据在公共网络（即互联网）停留的时间越长，风险就越大。如果数据通过外部网络发送到远程集中式服务器（Cloud），风险最大。我们还认为不仅要关注物联网安全，还应强调保护数据隐私。在组织和政府层面，物联网应用应有标准化的政策和框架。作为总结之言，出于充分的理由，明智的做法是避免将所有可以连接的东西都连接到物联网。


