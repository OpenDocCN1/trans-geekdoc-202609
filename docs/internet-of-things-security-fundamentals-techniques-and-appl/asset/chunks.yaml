- raw: 'Availability can be ensured by carefully maintaining all required hardware,
    performing hardware repairs straight away whenever it is needed, and maintaining
    appropriately working operating system environment which is free of software conflicts.
    Availability is very much important in IoT because all IoT devices that are equipped
    with sensors require be up and running all the time. It is also important to keep
    the system devices updated with the current version of software of the firmware.
    An adequate communication bandwidth is also required for IoT devices to transmit
    data and preventing the occurrence of bottleneck. Redundancy, failover, RAID,
    and even high-availability clusters can mitigate serious consequences when hardware
    issues occur; therefore, fast and adaptive disaster recovery is essential for
    the worst case scenarios. Safeguards against data loss or interruptions in connections
    should also be included in case of unpredictable events such as natural disasters
    and fire. Extra security equipment or software such as firewalls and proxy servers
    can also be used to guard against downtime and unreachable data due to malicious
    actions such as denial-of-service (DoS) attacks and network intrusions.


    #### **4.2.2.4** **Non-repudiation**


    A non-repudiation service provides an assurance of the origin of data or delivery
    of data so that it can protect the sender against false denial by the recipient
    that the data have been received, or to protect the recipient against false denial
    by the sender that the data have been sent. Non-repudiation is the ability to
    prove that an event has taken place, so that this cannot be repudiated later.
    For example, in the e-mail system, non-repudiation is used to guarantee that the
    recipient cannot deny receiving the message and that the sender cannot deny sending
    it. Non-repudiation is a method that guarantees message transmission between objects
    via digital signature, encryption, etc. It is one of the five pillars of information
    assurance (IA). Non-repudiation is also an important aspect in the IoT. Because
    the data in IoT are most important, it becomes more crucial in real-time systems
    such as disaster and recovery system, industry and research, healthcare, etc.,
    where the data alone play an important role in the system. In such scenario, non-repudiation
    service plays an important role.


    Digital signature, a cryptographic function, can be used to implement non-repudiation
    services in an IoT system. Digital signature also provides integrity, authentication,
    and data origin protections. It is designed to be unique to the signer, the individual
    or device responsible for signing the message and who possesses the signing key.
    There are two types of digital signatures, one which uses symmetric key (secret,
    shared key) and other which uses asymmetric key (private key is unshared). In
    [Figure 4.2](#Ch04.xhtml#fig4_2), an IoT device that sends the message adds its
    signature to the message. The message being send is now called signed message
    and any other IoT device with the appropriate key can perform the inverse of signature
    operation called signature verification. If the signature verification process
    fails, then the verifier should not trust the integrity of data and if they have
    originated from the trusted source \[[5](#Ch04.xhtml#ref4_5)\].


    ![Figure 4.2 Digital signature protection from spoofing and tampering.](Images/fig4_2.jpg)


    [**Figure** **4.2**](#Ch04.xhtml#bck_fig4_2) Digital signature protection from
    spoofing and tampering.


    To understand non-repudiation service in the IoT system, an example of healthcare
    sensor application can be considered. A healthcare sensor application provides
    wireless ubiquitous networking functionalities. Healthcare sensor application
    is based on the interconnection of tiny nodes that have sensing and/or actuating
    capabilities and is placed or planted in a human body. Healthcare sensor applications
    are context-aware, personal, and dynamic in nature. It senses the patient activity
    and informs the doctor on remote location about the patient’s health issue. The
    information may be vital if some emergency medical condition arises and the patient
    requires attention. Thus, such an application requires assurance of the origin
    and delivery of data, for example, if a doctor senses some urgency to send a decision
    on patient’s health condition that requires immediate response or action either
    by patient himself or by actuators. The IoT application failing in such scenario
    would affect doctor’s decision and leads to undesirable results that may cause
    harm to the patient. Therefore, to protect such communication, a digital signature
    may be used. A digital signature, as discussed above, is helpful in protecting
    such communication so that an attacker will not be able to falsify data and since
    it is protected, a device at the receiving end cannot deny its origin. Therefore,
    such protection guarantees the delivery of such vital information about the patient.


    ## **4.3** **IoT Architecture**


    The IoT architecture consists of four layers such as link layer, network layer,
    transport layer, and application layer and the architecture consists of sensor
    devices, gateway devices, a cloud service over the Internet, communication devices
    and medium, etc. As shown in [Figure 4.3](#Ch04.xhtml#fig4_3), each layer of the
    IoT architecture is responsible for a specific task and consists of different
    protocols. The IoT architecture also has various communication methods. This section
    discusses the IoT architecture on the basis of the communication model in the
    architecture.


    ![Figure 4.3 IoT layers and protocols.](Images/fig4_3.jpg)


    [**Figure** **4.3**](#Ch04.xhtml#bck_fig4_3) IoT layers and protocols.


    ### **4.3.1** **Device-to-Device Communication**


    This model represents two or more devices that directly connect and communicate
    to each other, rather than through an intermediary application server. These devices
    communicate over many types of networks, including IP  networks or the Internet.
    The example of device-to-device communication is a smart light bulb controlled
    by smartphone soft buttons. The other example may be vehicle-to-vehicle communication
    in smart transportation systems where one car sending warning message to other
    car for the short distance between the two cars.


    ### **4.3.2** **Device-to-Cloud Communication**


    In this model, the IoT device directly connects to the Cloud service for IoT.
    The cloud service for IoT is responsible for collecting and storing data from
    sensor devices, setting rules, and providing processing on those data. The cloud
    service may provide many services for the IoT devices such as sharing data over
    social network, generating alert, etc. This method takes advantage of existing
    communication mechanisms such as wired Ethernet or Wi-Fi connections to establish
    a connection between the device and the IP network which finally connects to the
    cloud service over the Internet.


    ### **4.3.3** **Device-to-Gateway**


    In this model, the IoT device connects to the local gateway device and the gateway
    device connect to the Internet. This method adds extra strength and security to
    the IoT infrastructure. The gate device can be used to filter information by having
    a firewall. The IoT gateway device acts as an intermediary between the IoT sensor
    device and the cloud service over the Internet.


    ### **4.3.4** **Back-end Data-sharing**


    This model refers to a communication architecture that allows users to export
    and analyze data collected from an IoT sensor device and uploaded to cloud to
    the other services or other data sources. This architecture provides a way for
    granting access to the uploaded sensor data to third parties, organization, services,
    or users \[[6](#Ch04.xhtml#ref4_6)\].


