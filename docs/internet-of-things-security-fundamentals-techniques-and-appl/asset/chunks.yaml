  trans: '

    `TCP/IP` 协议栈是互联网的核心。`IoT` 中的协议栈分为四层。这些层分别是链路层、网络层、传输层和应用层。每层负责借助不同的协议执行特定任务。图
    4.3 表示四层及各层使用的协议。


    ### 4.4.1 链路层

    该层负责在 `IoT` 设备之间传输数据。该层隐藏底层硬件的细节，并向上一层表示为通信介质。链路层将数据流逐位转换为信号并发送到底层硬件。在接收端，该层以电信号形式从硬件接收数据，将其组装成可识别的帧格式，然后交给上层。链路层工作在直接连接的两个主机之间。这种直接连接可以是点对点或广播。链路层执行以下任务：

    * *帧处理*：链路层从网络层接收数据包并将其封装成帧。然后，它逐位在硬件上发送每个帧。在接收端，数据链路层从硬件拾取信号并将其组装成帧。

    * *寻址*：数据链路层提供硬件寻址机制。硬件地址在链路上假定是唯一的。

    * *同步*：一旦数据帧在链路上发送，它就为两端同步传输。

    * *差错控制*：当信号在传输过程中遇到问题时，它检测错误并尝试恢复实际数据位，同时向发送方提供错误报告机制。

    * *流量控制*：同一链路上的 `IoT` 设备可能具有不同的速度或容量。链路层确保流量控制，使通信设备能够以相同速度交换数据。

    * *多址访问*：可能存在较高的碰撞概率。链路层提供诸如 `CSMA/CD` 之类的机制，以确保数据在多个设备之间共享。链路层由以下协议组成，这些协议决定数据如何在网络上传输。以下是链路层中的
    IEEE 标准。

    * `802.3 Ethernet` 是以太网网络的有线以太网标准的集合。它定义了有线以太网的媒体访问控制 (`MAC`)。它有 `802.3` 作为同轴电缆，`802.3.i`
    作为铜双绞线连接，`802.3.j` 作为光纤连接，`802.3.ae` 作为光纤等。这些标准提供的数据速率为 10 Mb/s 至 40 Gb/s 甚至更高。`802.11
    Wi-Fi` 是无线局域网 (`WLAN`) 技术的规范集合。`802.11` 指定了无线客户端与基站之间或两个无线客户端之间的空中接口。`802.11`
    有多个在 `IoT` 中使用的规范。标准 `802.11a` 工作在 5 GHz，`802.11b/g` 工作在 2.4 GHz，`802.11n` 工作在
    2.4/5 GHz，`802.11ac` 工作在 5 GHz，`802.11ad` 工作在 60 GHz。这些提供的数据速率为 1 Mb/s 至 6.75
    Gb/s。`802.16 WiMax` 是一系列无线宽带标准，提供的数据速率为 1.5 Mb/s 至 1 Gb/s，移动站提供至 100 Mb/s，固定站至
    1 Gb/s。`802.15.4 LR-WPAN` 是一项技术标准，定义了低速率无线个人局域网 (`LR-WPANs`) 的运行。它提供的数据速率约为 40
    Kb/s 至 250 Kb/s。该标准提供低成本、低速通信，适用于受限供电的 `IoT` 设备。这些对于远程传感数据非常有用。`2G/3G/4G` 是移动通信标准，其中
    2G 包括 `GSM` 和 `CDMA`，3G 包括 `UMTS` 和 `CDMA2000`，4G 包括 `LTE`。基于这些标准的 `IoT` 设备可以通过蜂窝网络通信。这些标准提供的数据速率为
    9.6 Kb/s 至 100 Mb/s [7]。


    该层极易受到对 `IoT` 设备的若干攻击。这些攻击如下：

    * `Address Resolution Protocol (ARP) spoofing` 是一种攻击者向网络发送 `ARP` 消息的技术，目的是将攻击者的
    `MAC` 地址与另一个主机如网关关联，导致发送给攻击者的 `IP` 流量。此攻击允许攻击者拦截网络上的数据帧，修改和停止流量，并为其他攻击打开大门。

    * `Denial of Service (DoS) attack` 是一种攻击，攻击者通过干扰服务使传感器节点或网络资源不可用。


    ### 4.4.2 网络层

    它也称为 `IoT` 中的互联网层，负责将 `IP` 数据报从源网络发送到目标网络。该层执行主机寻址和数据包路由。数据报包含源地址和目的地址，用于将其从源路由到跨多个网络的目的地。主机标识使用分层
    `IP` 地址方案，例如 `IPv4` 或 `IPv6` 等。网络层负责执行以下任务 [8]：

    * 寻址设备和网络。

    * 填充路由表或静态路由。

    * 对进出数据进行排队并根据为这些数据包设置的质量服务约束转发它们。

    * 不同子网之间的互联。

    * 尽力将数据包交付到目的地。

    * 提供面向连接和无连接机制。


    网络层由在 `IoT` 中被认为有用的协议组成，例如 `IPv4`，它是部署最广泛的互联网协议。该协议使用 32 位寻址方案，允许总共 `2³²` 个地址。但随着越来越多的设备连接到互联网，这些地址在
    2011 年耗尽。因此，一个新版本的协议应运而生。`IPv6` 是互联网协议最新版本，也是 `IPv4` 的继任者。该协议使用 128 位寻址方案，允许总共
    `2¹²⁸` 个地址。另一个协议是 `6LoWPAN`，这是一个有些拗口的缩写，组合了互联网协议的最新版本 (`IPv6`) 和低功耗无线个人局域网 (`LoWPAN`)。该协议使具有有限处理能力的小型设备能够使用互联网协议无线传输信息。它工作在
    2.4 GHz 频率范围，提供约 250 Kb/s 的数据传输速率。因此，该协议被认为比其他协议更适用于资源和电力受限的设备。


    `IoT` 中网络层漏洞被归类为以下攻击：

    * `Routing attack` 在此攻击中，攻击者可能会更改路由信息以创建路由环路，从而显著降低服务质量，因为路由信息未加密。

    * `Eavesdropping attack` 是攻击者能够访问通信信道时的攻击。它是一种被动攻击，除非攻击者修改接收到的数据包并将其发送回源头。这种方法称为重放攻击，它是欺骗的非常常见的子类型。

    * `Replay attack` 是一种攻击，攻击者获取一个签名的数据包，无论他能否解密它，都通过在稍后时间重新发送数据包来获得目标实体的信任。

    * `Sinkhole attack` 是一种攻击，其中某些节点比其他正常节点对网络流量更具吸引力。当数据包到达 sinkhole 节点时，消息可能会被丢弃并以更改内容转发。

    * `Wormhole attack` 是一种攻击，其中恶意创建了一个虫洞、低延迟链路，攻击者可以通过该链路重放消息。攻击者在网络的一个点接收数据包并将其发送到网络的另一个点，然后从该点重放。

