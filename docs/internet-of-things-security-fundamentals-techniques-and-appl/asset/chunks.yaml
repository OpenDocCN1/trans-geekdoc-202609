    models.


    Bob and Dave do not need to establish trust relationships among their authentication
    and authorization systems. Bob’s house appliance recognizes the access token created
    by Bob and Dave has only to prove that he is the subject (grantee) identified
    by the capability token as entitled to do specific housekeeping activities for
