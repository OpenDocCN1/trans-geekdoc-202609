  trans: '

    一个经常被我们这些在 1990 年之前成年的人所特别频繁忽视的方面是虚拟世界的重要性。今天，儿童的虚拟身份对他们而言的重要性与现实世界身份一样重要，甚至更重要。在虚拟世界中，存在着我们在现实世界中发现的大部分甚至全部事物，包括物体、机器、货币等。`IoT`
    包含现实世界和虚拟世界，事实上，它能够在两者之间建立重要的桥梁。这一桥梁很可能会增长，并在未来公民的生活中变得更加相关。像 `Google Glass` 或未来智能交通系统（`ITSs`）在汽车中的应用等新设备将提出“增强现实”，其中数字信息与现实世界信息的整合被用来构建复杂的应用程序。这一趋势进一步凸显了安全和隐私的需求，因为虚拟世界中的数据泄露可能在现实世界中产生后果。在某些环境和应用中，安全和隐私威胁甚至可能成为安全威胁，对公民的生命造成更严重的后果。作为一个概念性示例，现实世界中的执行器可能在“智能家居”内被远程设置以引发火灾或洪水。


    ## 2.2 活动链 05 概述 – 治理、隐私和安全问题


    欧洲 `IoT` 研究集群创建了多个活动链，以促进解决 `IoT` 主题的项目之间的密切合作，并为就重要研究挑战进行思想交流和开放对话形成一个平台。活动链被定义为工作流，将合作伙伴或合作伙伴中的特定参与者围绕明确的技术活动进行分组，这些活动将产生至少一个输出或交付物，用于解决
    IERC 目标。IERC 活动链 05 是一个跨项目活动，专注于在 EC 资助的 `IoT` 领域研究项目中对 `IoT` 隐私、安全和治理做出有价值的贡献。如
    \[3\] 中所述，三个方面密切相互关联“隐私、安全和竞争已被确定为与 IOT 治理相关的三大主要问题；然而，这些问题不应单独或孤立地讨论” \[3\]。在同一参考中，还强调了为
    `IoT` 的治理定义一个共同商定定义的挑战。同样，安全和隐私的概念在文献中也没有统一的定义，即使对这些概念存在共同的共识。总体而言，活动链 05 的主要目标是确定研究挑战和主题，这些挑战和主题可以使
    `IoT` 对用户（即公民、企业和政府）更安全，保证用户的隐私并支持 `IoT` 市场的自信、成功和可信发展。与欧洲或全球层面的 `IoT` 计划（例如 IGF）相比，活动链
    05 不定义政府政策，而是专注于研究（最终可用于支持政策或标准化活动）。以下各节提供了与活动链 05 相关的欧洲委员会资助项目对 `IoT` 隐私、安全和治理所做贡献的概述。


    ## 2.3 来自 FP7 项目的贡献


    ### 2.3.1 FP7 iCore 访问框架（iCore 贡献）


    `iCore` 认知框架基于这样一个原则：任何现实世界对象和任何可用的、可访问的、可观察的或可控制的数字对象都可以在“物联网”中具有虚拟表示，称为虚拟对象（`VO`）。`VOs`
    主要针对技术异构性的抽象，并包括功能语义描述，使能够根据情况感知地选择和使用对象。复合虚拟对象（`CVOs`）使用 `VOs` 的服务。`CVO` 是语义上可互操作的
    `VOs` 的认知 mash-up，其呈现的服务符合用户/利益相关者的视角和应用要求。


    `iCore` 项目的整体分层方法在 图 2.1 中给出。第一个认知管理层（`VO` 级认知框架）负责在整个生命周期中管理 `VOs`，确保与现实世界对象/实体（例如传感器、执行器、设备等）的链接的可靠性。例如，在物流相关场景中，跟踪温控货物运输，单个货物箱由
    `VOs` 表示，而卡车运输的集装箱是 `VO`，卡车本身也是 `VO`。`IoT` 相关应用程序可以出于不同的服务原因分别与这些 `VOs` 中的每一个进行接口。


    ![图 2.1 iCore 框架.](img/fig2_1.jpg)


    图 2.1 iCore 框架。


    第二个认知管理层（`CVO` 级认知框架）负责将 `VOs` 组合成 `CVO`。`CVOs` 将使用 `VO` 的服务来组合更复杂的对象。在我们的示例中，卡车和所运输货物的组合在认知框架中表示为
    `CVO`。


    第三层（用户级认知框架）负责与用户/利益相关者进行交互。认知管理框架将通过收集和分析用户资料和利益相关者合同（例如服务水平协议）来记录用户的需求和要求（例如人类意图），并代表用户创建/激活相关的
    `VO`/`CVOs`。


    ### 2.3.2 IoT@Work 基于能力的访问控制系统（IoT@Work 贡献）


    `IoT` 预见了新的安全挑战，包括在访问控制领域，这些挑战很难通过现有安全解决方案来满足。事实上，`IoT` 在可扩展性和可管理性方面是一个更苛刻的环境，这既是由于物（资源和主体）数量可能无界，也是由于预期最相关的需要支持不同服务的编排和集成、短暂的、通常是偶然的和/或自发的交互模式的相关性、上下文的相关性等。


    下面，我们简要提供在欧盟 `FP7` `IoT@Work` 项目中开发的基于能力的访问控制（以下称为 `CapBAC`）系统的描述。`CapBAC` 是根据基于能力的授权模型设计的，其中能力是一种可通信的、不可伪造的授权令牌。该令牌唯一标识授予的权利、可以行使权利的对象以及可以行使该权利的主体。如
    图 2.2 所示，基于能力的系统逆转了传统方法，现在由用户负责向服务提供商出示其授权令牌，而在传统的 `ACL` 或 `RBAC` 系统中，是服务提供商必须检查用户是否直接或间接有权对请求资源执行请求操作。


    ![图 2.2 ACL 与基于能力的授权模型.](img/fig2_2.jpg)


    图 2.2 ACL 与基于能力的授权模型。


    `CapBAC` 系统借鉴了先前工作的思想和方法 \[4\]，并将其扩展和调整以适应 `IoT` 要求，特别是 `IoT@Work` 项目设想的要求。`CapBAC`
    提供了以下额外功能，构成了相对于先前基于能力技术的本质创新：


    1. 委托支持：主体可以将访问权授予另一主体，以及授予进一步委托已授予权利全部或部分权利的权利。委托深度可以在每个阶段进行控制。

    '
