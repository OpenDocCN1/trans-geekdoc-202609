- raw: '*   To remotely access Linux accounts, Telnet login should be disabled, and
    SSH should be used.


    *   The networks devices are less prone to attacks if are being continuously updated
    and login credentials are changed with time.


    *   It is important that strong encryption standards are implemented for the IoT
    system, so as to prevent their accessibility by attackers.


    ## **1.3** **Business Aspects in IoT**


    With the emergence of IoT, the business processes can become smooth and robust
    at the fundamental level and can reach greater heights with smart devices and
    automated products. IoT has the power to transform the business applications.
    The business aspects of IoT have focuses on the following key elements:


    *   Smarter products in companies: The pocket size smart phones bear a lot of
    things of the world inside it. The smart devices result in the quick and instantaneous
    processing of applications and execute business activities in a comparatively
    short period of time.


    *   Enable smarter business operations and smarter decisions: The feedback process
    becomes easy and prediction of future impacts can be judged.


    *   Change in business model: The primitive producer–consumer trend has been greatly
    revolutionized by IoT. It offers time-saving business solutions.


    ## **1.4** **Industrial IoT (IIoT)**


    The extension of IoT to the manufacturing industry is defined by the term IIoT.
    It radically changes the process of manufacturing by empowering the addition and
    accessibility of huge amount of data at extremely high speeds and in a systematic
    and cost-effective manner. Many of the companies are now implementing IIoT to
    incorporate sensor data, to constantly and accurately capture the communicating
    data, and for the efficient monitoring of the overall supply chain, quality control,
    to store information about equipments, vehicles, and containers and for the traceability
    of industrial processes.


    IIoT produces data which are exponentially large compared to that of generated
    by IoT. For example, around 500GB data can be produced by a single turbine compressor
    blade in one single day. And therefore, IIoT requires combining not only computers
    and Internet but also the modern day technologies of Big Data, Cloud Computing,
    and Machine Learning. There is also an important remark associated with IIoT,
    which can be understood as IoT is important but not critical while IIoT failure
    might result in life-threatening or other emergency situations. IIoT is thus a
    very promising technology and it assures the emergence of the next industrial
    revolution by creating a platform of connectivity and to drive industrial solutions
    with IoT.


    The key elements in IIoT are:


    *   Exchange of information is between business to business, rather than from
    business to consumers.


    *   The market segments of IIoT are huge enterprises compared to small business
    or limited enterprise of IoT.


    *   The data volume of IoT is termed Big Data. In IIoT, there are limited but
    specific data.


    *   IoT focuses on consumer convenience and consumer needs. IIoT aims to cut down
    the investments and improvement of return costs.


    ### **1.4.1** **Security Requirements in IIoT**


    The industrial Internet aims at improving the efficiency and productivity of the
    production process throughout the supply chain ([Figure 1.2](#Ch01.xhtml#fig1_2)).
    IIoT encompasses those areas with high stake industries, for e.g., oil and gas
    supply chains, power grids, heavy machineries, and sensors. Any security breach
    in these applications could cause a huge impact on business solutions. There could
    be a threat to data security.


    ![Figure 1.2 IIoT operations.](Images/fig1_2.jpg)


    [**Figure** **1.2**](#Ch01.xhtml#bck_fig1_2) IIoT operations.


    Ignoring security and privacy issues could endanger not only the user activities
    but also the operation and functionality of devices. IIoT security includes the
    concern for safety and reliability.


    ## **1.5** **Vehicular Sensor Networks (VANETs)**


    A vehicular *ad hoc* network (VANET) considers a vehicle as a node that transmits
    messages among vehicles. It is a subset of IoT that could be termed IoV. Vehicles
    are smart objects, equipped with sensors, and have IP-based connectivity. A VANET
    transmits messages between intra-vehicle components, vehicle to vehicle, and vehicle
    to people. The processing of messages is based on sensing capabilities of vehicles.


    A VANET boosts the foundation of an Intelligent Transportation System (ITS), which
    has the potential to offer a rich set of applications to its customers, which
    acts as a roadside infrastructure for using security and services.


    ### **1.5.1** **Sensors in VANET**


    Sensors in VANET can be classified into two categories:


    1.  Autonomous Sensors: These sensors include acceptance range threshold (ART)
    and mobility grade threshold (MGT). These parameters take into consideration the
    maximum communication range and restrict the number of entities in a particular
    area.


    2.  Co-operative Sensors: These sensors include steps and measures for practice
    exchange of neighbor tables among peer vehicles about their data and position.


    ### **1.5.2** **Security in VANET**


    The security of a VANET depends on cost, trust, privacy, and its deployment. Certain
    countries assign electronic license plates (ELPs) to vehicles, which is a cryptographically
    verifiable number.


    The PKI in context of VANET is termed VPKI, which is a certification key distribution,
    certificate revocation, data recording, etc.


    ## **1.6** **IoT-Enabled Wearable Devices**


    The market of wearable smart devices is a widely talked topic in the world of
    Internet. These devices have a full range of capabilities for various IoT solutions.
    Current trends of wearable devices have large scope in the health care and fitness
    sector. Biometric-oriented wearable devices can measure heart rate and oxygen
    levels in bloodstream, track body temperature, and report the possibility of catching
    flu or cold. A wearable device could tell if the back seat of a car is not properly
    adjusted and causing strain on back. In the form of a wristband, it can measure
    perspiration levels and thus can offer an alarm for adjusting temperature and
    humidity in an AC room or car. IoT wearable used nowadays are: fitness trackers,
    smart watches, smart glasses, baby monitoring gadgets, and clothing-based wearables.
    A survey revealed that 43% will replace their smart phones by wearables.


    ## **1.7** **IoT in Smart Homes/Cities**


    A smart city based on the paradigm of IoT uses a number of communication protocols
    for different data representations. It also utilizes the concepts of artificial
    intelligence to model the data processing. The smart city or smart home collects
    data from numerous data sources which are basically sensors. These sensors might
    be scattered around cities, offices, gardens, public places, and markets. Data
    arrive from smart phones, smart cards, wearable sensors, vehicles, etc. A smart
    city IoT network aims for efficient management of energy, water, and electrical
    supplies in buildings. It also lays down the activities for improving public transport,
    traffic analysis, and population density statistics. Waste management is also
    a rising concern in rural and urban areas. This could be successfully done with
    the aid of smart homes and smart cities.


    ## **1.8** **Green IoT**


    Green IoT is a term used for integrating the Greenhouse industry with IoT. It
    encompasses the procedures which are energy efficient and are utilized to reduce
    the greenhouse effect of existing systems.


    It offers the advantage of managing the following activities:


    *   Crop management by evaluating farming and environment conditions.


    *   To improve the yield of crops by prolonged production period and monitoring
    less use of chemicals and fertilizers.


    *   To judge and analyze the requirements of soil, water supply, and humidity.


    *   To monitor the temperature changes.'
