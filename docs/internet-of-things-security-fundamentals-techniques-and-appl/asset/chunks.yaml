    accounts with weak passwords and they do not even change the default passwords
    given by vendors for the devices. All IoT devices and application which allow
    users to control objects in the IoT infrastructure must also require proper authentication
    and authorization to make sure that the system is monitored and controlled by
    the right person.


    #### 4.2.1.4 Transport encryption

    In IoT, the devices are connected and communicate with each other by transferring
    data from one device to another device over the Internet. Many of the devices
    do not encrypt the data and hence an addition to the security issues. Transport
    encryption is where information which is being sent from one device to another
    device is in an encrypted form. Transport encryption is very crucial because most
    of the devices are transmitting data all the time. Many devices failed to encrypt
    data, even when the devices were using the Internet. Encryption is needed for
    the given amount of information which is being shared between the device, the
    cloud, and mobile applications.


    #### 4.2.1.5 User interface

    Web interfaces of the devices can also raise security concern. Some issues in
    the web interface that can raise problem are persistent cross-site scripting,
    poor session management, weak default credentials, etc. Using these methods, hackers
    are able to identify valid user accounts and take control over them using password
    reset features.


    #### 4.2.1.6 Firmware update

    IoT devices do not use encryption when downloading software or firmware updates.
    IoT devices also require proper authorization for updating the firmware of devices.
    If the firmware or software is not protected, an attacker can easily gain control
    over the device and then the whole network as the device, in this case, will open
    a door for the attacker to enter in the system and access to confidential information
    [[2](#Ch04.xhtml#ref4_2)].


    ### 4.2.2 Confidentiality, Integrity, and Availability

    Confidentiality, integrity, and availability also known as CIA triad is a model
    which is designed to guide policies for information security. This model is also
    sometimes referred to as the AIC triad (availability, integrity, and confidentiality)
    to avoid confusion with the Central Intelligence Agency. The three elements of
    the triad are considered the most crucial components of security.


    Here the confidentiality is a set of rules that limit access to information, integrity
    is the assurance that the information is trustworthy and accurate, and availability
    is a guarantee of reliable access to the information by authorized people. Three
    of these also play an important role in IoT since the information and data in
    IoT is also crucial [[3](#Ch04.xhtml#ref4_3)].


    #### 4.2.2.1 Confidentiality

    Confidentiality is used to prevent sensitive information from reaching the wrong
    people. In order to make sure that the right people can reach it, the access must
    be restricted to authorized users to view and access the data. The data must be
    categorized and stringent measures should be implemented according to those categories.


    The IoT-related confidentiality issues are unauthorized access, use, disclosure,
    and modification of private and sensitive information. The eavesdropping attacks
    in the IoT infrastructure give rise to confidentiality issues. Eavesdropping,
    at the communication level, refers to intentionally listening to private conversations
    over the communication links. This attack may provide sensitive information to
    attacker from the unencrypted or unprotected communication. The information that
    transmits between either two IoT devices or between the IoT client and the IoT
    server may contain information such as username, password, access control information,
    device configuration information, shared network password, and other sensitive
    information which is critical to the system. The attacker tries to steal information
    that transmits between two IoT devices or IoT devices and cloud to gain control
    over the IoT system. In this attack, the attacker takes advantage of unsecured
    network communications to get access to the data being sent and received in the
    IoT infrastructure. It is difficult to detect eavesdropping attacks because these
    attacks do not cause network transmissions to appear to be operating abnormally.
    Therefore, to avoid such an attack, the communication must be encrypted and protected.


    #### 4.2.2.2 Integrity

    Integrity includes maintaining the consistency, accuracy, and trustworthiness
    of data during its entire life cycle. Data must not be changed in transit, and
    necessary steps must be taken to ensure that data cannot be altered by unauthorized
    users. These measures include file permissions and user access controls. Version
    control can also be used to prevent erroneous changes or accidental deletion by
    authorized users. Some policies also require detecting any changes in data that
    might occur as a result of non-human-caused events such as an electromagnetic
    pulse (EMP) or server crash. It is also secure to use cryptographic checksums
    on data for verification of integrity.


    The military application of IoT may be taken as an example for integrity. The
    Military IoT sometimes also known as M-IoT is the application of IoT where all
    objects of the battlefield such as troops, tanks, weapons, vehicles, aircrafts,
    etc., are equipped with various sensors and connected to each other via the Internet
    and share real-time data. In the military IoT, the military gathers data from
    various sensors on a variety of platforms such as aircraft, weapon systems, ground
    vehicles, and troops in the battlefield. The sources of data in military IoT are
    command, control, intelligence, surveillance, and reconnaissance systems that
    process and disseminate the mission-critical information, such as the position
    of an incoming threat. IoT-connected sensors and radars collect and transmit data
    of the position and movements of troops and enemies and other events in the battlefield.
    The IoT for military makes it attractive and more useful but it also makes such
    a framework vulnerable. In M-IoT, it becomes necessary to maintain a secure environment
    which supports safe exchange of information with accuracy, trustworthiness, and
    in real time. Therefore, all the information shared in the battlefield must be
    maintained for data integrity.


    As illustrated in [Figure 4.1](#Ch04.xhtml#fig4_1), the location information of
    the battlefield by the sensor on an aircraft is sent to soldiers in real time.
    This information has to be precise and thus such communication requires integrity.
    Although M-IoT requires various measures of IoT security, the following are in
    relation to integrity:


    ![Figure 4.1 Location-based communication at battlefield.](Images/fig4_1.jpg)


    Figure 4.1 Location-based communication at battlefield.


    Table 4.1 Integrity measure in M-IoT location-based communication application


    | Security Measure  || Action |

    | --- | --- |

    | * * * |

    | Consistency || Data delivery in the battlefield. |

    | --- | --- |

    | * * * |

    | Accuracy || Location data, alerts, and commands from control unit |

    | * * * |

    | Trustworthiness || Origin of data from sensors and control unit |


    The software integrity of IoT devices as discussed by Echard [[4](#Ch04.xhtml#ref4_4)]
    may also be considered in the military application of IoT as it focuses on detection
    and prevention of modification of the original software of the IoT devices, so
    that the device cannot be used for unintended purposes because these devices are
    used to send vital information of the battlefield upon which further necessary
    actions may be taken.


    #### 4.2.2.3 Availability

