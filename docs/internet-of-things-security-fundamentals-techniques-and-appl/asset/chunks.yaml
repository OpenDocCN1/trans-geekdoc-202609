    软件和云组件也为攻击者提供了进入物联网系统的入口点。因此，为了保护系统免受攻击，必须对其有充分的理解。设备的 `Firmware` 是攻击者进入物联网系统的重要工具。攻击者可能能够使用十六进制编辑器或其他工具在固件中找到有价值的信息、网络的
    `user ID` 和 `password`。固件的不安全更新也可能导致安全问题。由于固件存在于物联网传感器设备上，攻击者可以损坏设备，从而阻止任何数据提交到服务器或促成错误数据提交到服务器，这可能导致向用户显示无信息或容易出错的信息。这必须使用密码学来保护。


    `Web Application Dashboard` 也是一个重要的关注领域。物联网应用的仪表板是整个物联网系统的控制单元。如果攻击者以某种方式控制了仪表板，整个系统都可能遭受很大损害。这种攻击必须通过强密码加密技术和安全的会话管理来保护。大多数物联网应用为其用户提供的
    `Mobile Interface`，以便用户使用智能手机轻松访问系统，如果没有一些强有力的安全技术保护，也会成为攻击者的入口点。


    ### 4.6.3 无线通信


    由于物联网传感器设备大多依赖于无线电通信，例如 `Wi-Fi`、`BLE`、`Cellular`、`Zigbee`、`ZWave` 和 `6LoWPAN`。不安全的无线电通信也允许攻击者获得对系统的访问权限。许多攻击，例如拒绝服务
    (`DoS`)、基于密码的攻击、无线钓鱼、中间人攻击、密钥泄露攻击、嗅探攻击、无线入侵者、rogue APs、端点攻击和 evil twin APs 都可以针对无线电通信进行。因此，它必须使用密码学和防火墙进行保护。


    ## 4.7 安全特性


    在讨论的每一层中，物联网中使用了各种协议 (`Figure 4.3`)。每一层都使用这些协议执行特定任务。有些安全功能已内置于这些协议中的某些协议中，本节将对其进行讨论。


    ### 4.7.1 TLS/SSL


    传输层安全 (`TLS`) 及其前身安全套接字层 (`SSL`) 合称为 SSL。这些是提供计算机网络上通信安全的密码协议。协议的许多版本用于诸如网页浏览、电子邮件应用、互联网传真、即时消息和语音-over-IP
    (VoIP) 等应用中。网站使用 `TLS` 来保护服务器和网络浏览器之间的所有通信。传输层安全协议在相互通信的两个计算机应用程序之间提供数据完整性和隐私。由
    `TLS` 保护的客户端-服务器通信具有一个或多个属性，例如连接是私有的或安全的，因为对称密码学用于加密传输的数据。服务器和客户端在传输第一个数据字节之前就商定加密算法和使用的密码密钥的细节。这种共享秘密的协商是安全可靠的。相互通信的客户端-服务器的身份使用公钥密码学进行身份验证。连接确保完整性，因为每个传输的消息都使用消息认证码进行消息完整性检查，以防止数据在传输过程中未被检测到的丢失或修改
    [13]。需要将其与物联网案例联系起来。`TLS` 在物联网中是如何使用的？哪个服务器（云？）和哪个客户端（例如，哪个设备）？信用卡信息在网络上使用 `TLS`，那么是否有任何物联网需要
    `TLS`？


    `TLS` 在物联网中具有重要作用。下一节中讨论的 `MQTT` 协议通常被实现为在 `TLS` 上运行。`MQTT` 代理可以配置为对 `MQTT` 客户端进行基于证书的身份验证。使用它，`MQTT`
    代理将 `MQTT` 客户端 `X.509` 证书中的信息映射以确定客户端有权订阅或发布的主题。现实世界的例子是 `IBM Watson IoT platform`’s
    `MQTT API`，其在端口 `8883` 或 `443` 上加密通信。该平台需要 `TLS`。在平台上注册设备需要使用 `TLS` 连接，因为 `MQTT`
    密码会传回客户端，而该客户端受 `TLS` 隧道保护 [5]。


    ### 4.7.2 MQTT（消息队列遥测传输）


    `MQTT` 协议是一种发布/订阅消息协议，专为通常称为物联网协议的 M2M 通信而设计。`MQTT` 协议由 `MQTT` 客户端组成，客户端可以是运行有
    `MQTT` 库的任何微控制器设备，以及客户端通过网络连接到的 `MQTT` 代理。`MQTT` 客户端可以是发布者或订阅者或两者兼有。`MQTT` 代理是发布/订阅活动的核心，可以处理多达数千个并发连接的
    `MQTT` 客户端，主要负责接收消息、过滤它们，然后将消息发送给所有订阅的客户端。`MQTT` 代理提供一个或多个主题，允许 `MQTT` 客户端向相关主题发布/订阅消息。主题通常是一个小令牌，可能存储有价值的信息。`MQTT`
    安全有三个基本概念：身份、身份验证和授权。身份是关于提供身份以获得授权和授予权限。身份验证是关于证明身份，而授权是关于管理身份。身份 – 通过其 `client
    identifier`、`user ID` 或 `public digital certificate` 识别 `MQTT` 客户端。这些属性中的一个或另一个定义了客户端身份。`MQTT`
    服务器使用 `SSL` 协议对客户端发送的证书进行身份验证，并使用客户端设置的密码。通过此服务器可以根据客户端的身份控制客户端可以访问的资源。`MQTT`
    服务器通过其 `IP address` 和 `digital certificate` 将自身标识给客户端。`MQTT` 客户端使用 `SSL` 协议验证
    `MQTT` 服务器发送的证书。


    `Authentication` 由 `MQTT` 服务器和客户端共同完成。客户端使用 `SSL` 协议对服务器进行身份验证。`MQTT` 服务器使用 `SSL`
    协议或密码或两者对客户端进行身份验证。如果客户端对服务器进行身份验证，但服务器不对客户端进行身份验证，则客户端被称为匿名客户端。可能可以通过 `SSL` 建立匿名客户端连接，之后它会使用由
    `SSL` 会话加密的密码对客户端进行身份验证。由于证书分发和管理问题，客户端可以用密码而不是客户端证书进行身份验证。`MQTT` 客户端服务器通信是安全可靠的，其过程如下。


    *   `MQTT` 客户端对服务器进行身份验证，以确保其连接到正确的服务器。它通过 `SSL` 协议使用服务器证书来完成此操作。


    *   `MQTT` 服务器验证其是否连接到正确的客户端。它通过使用 `SSL` 协议对客户端证书进行身份验证，或通过使用密码对客户端身份进行身份验证来完成此操作。


    `Authorization` 不是 `MQTT` 协议的一部分，但由 `MQTT` 服务器提供。授权取决于服务器所做的事情。`MQTT` 服务器是发布/订阅代理。服务器上的
    `MQTT` 授权规则控制可以连接到服务器的客户端以及客户端可以发布或订阅的主题 [14]。


