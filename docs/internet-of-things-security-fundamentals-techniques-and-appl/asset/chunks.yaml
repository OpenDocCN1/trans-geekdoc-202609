- raw: "*   Trend analysis: These services allow collecting and analyzing historical\
    \ parking data and provide trend reports to parking managers.\n\n*   Demand-response\
    \ pricing: This service allows the ability to change pricing depending on the\
    \ demand for each space.\n\nThe security goals for the smart parking system could\
    \ be:\n\n*   Maintaining the authentication of the customers and parking managers.\n\
    \n*   Maintaining the authorization of who can change the parking spot pricing.\n\
    \n*   Maintaining the roles of parking managers, attendants, administrators, and\
    \ enforcement officers.\n\n*   Maintaining the delegation of administrators.\n\
    \n*   Maintaining integrity of all data collected by the system.\n\n*   Maintaining\
    \ confidentiality of sensitive data of the system.\n\n*   Maintaining the availability\
    \ of the whole system and all of its components.\n\nThe functioning of the parking\
    \ system is described in the following points:\n\n1.  The customer purchases the\
    \ parking spot \n\n    *   The customer installs the parking application on his/her\
    \ smartphone.\n\n    *   The customer registers the payment information to perform\
    \ the transaction.\n\n    *   The application provides real-time information of\
    \ available nearby parking spots and pricing details.\n\n    *   The customer\
    \ selects the spots and drives to the spot.\n\n    *   The customer uses the application\
    \ to pay for the spot.\n\n2.  The parking enforcement officer is alerted to non-payment\
    \ incidents \n\n    *   The parking application records the parking session start\
    \ time and also records the overstayed time spent by the vehicle at the parking\
    \ spot.\n\n    *   IP video cameras capture the video of the vehicle overstayed\
    \ in the parking spot.\n\n    *   The parking application correlates the video\
    \ of the vehicle in the parking spot with start time and duration for parking\
    \ transaction flags for video confirmation if the transaction duration has expired.\n\
    \n    *   The parking application then transmits an alert to enforcement application\
    \ of the overstayed vehicle.\n\n    *   The enforcement officer receives an SMS\
    \ alert and proceeds to ticket the vehicle.\n\nThe following diagram shows the\
    \ overall system architecture:\n\n![Figure 4.4 Smart parking system architecture\
    \ \\[5\\].](Images/fig4_4.jpg)\n\n**Figure** **4.4** Smart parking system architecture\
    \ \\[5\\].\n\nThe security controls that are needed to be implemented in the smart\
    \ parking system are the following: \n\n **Table 4.2** Smart parking system security\
    \ requirement \n\n| Attack on Smart Parking System  || Type of Attack || Requirement\
    \ of Security Control |\n\n| --- | --- | --- |\n\n| \n\n* * *\n\n |\n\n| The attacker\
    \ gains control over customer’s account and charges the customer for parking time\
    \ || Spoofing || Authentication |\n\n| --- | --- | --- |\n\n| \n\n* * *\n\n |\n\
    \n| Through unauthorized access, the attacker uses the parking spot for free of\
    \ charge || Tempering || Authentication and integrity |\n\n| \n\n* * *\n\n |\n\
    \n| The attacker uses the parking spot for free by claiming that the system has\
    \ malfunctioned || Repudiation || Non-repudiation and integrity |\n\n| \n\n* *\
    \ *\n\n |\n\n| The attacker gains access to customer’s payment details || Information\
    \ disclosure || Authentication and confidentiality |\n\n| \n\n* * *\n\n |\n\n\
    | The attacker shuts down the smart parking system through the DoS attack || Denial\
    \ of service || Availability |\n\n| \n\n* * *\n\n |\n\n| The attacker disrupts\
    \ smart parking operations by implanting the rootkit on backend servers || Elevation\
    \ of privilege || Authorization |\n\n### **4.8.2** **Key Management**\n\nIt is\
    \ the technique used to manage cryptographic keys in a cryptosystem. It facilitates\
    \ in generation, exchange, storage, use, and replacement of keys. KM includes\
    \ cryptographic protocol designs, key servers, user procedures, and other relevant\
    \ protocols. A key or cryptography key is a piece of information also called a\
    \ parameter which determines the functional output of a cryptographic algorithm.\
    \ Cryptographic systems may use different types of keys and one system may use\
    \ more than one keys. The keys may be symmetric or private keys or asymmetric\
    \ or public keys. In a symmetric key algorithm, the keys involved are the same\
    \ for both encrypting and decrypting a message. Keys must be chosen carefully\
    \ and also distributed and stored in a secured manner. Asymmetric keys, in contrast,\
    \ are two distinct keys which are mathematically linked. They are typically used\
    \ in conjunction to communicate. A Key Management System Security Policy provides\
    \ the rules that can be used to protect keys and metadata. The key management\
    \ is very important in IoT as it protects confidentiality, integrity, and availability\
    \ and the process is secure \\[[17](#Ch04.xhtml#ref4_17)\\].\n\n## **4.9** **IoT-based\
    \ Smart Home and Security Issues**\n\nThis section discusses Smart Home as the\
    \ IoT model. A Smart Home can be defined an environment that has lighting, appliances,\
    \ heating, air conditioning, TVs, computers, entertainment systems, and security\
    \ and camera systems each of which is capable of communicating with one another.\
    \ For example, a system to alert the user on his smartphone through a camera feed\
    \ whenever a doorbell or letterbox is used or any unauthorized access to smart\
    \ lock. All the connected “things” in a smart home can also be controlled remotely\
    \ anytime, from any room in the home itself and as well as remotely from any location\
    \ in the world by a phone or any device connected to the Internet. Because in\
    \ smart home, all things are connected to each other via the Internet; it therefore\
    \ also exposes security threats. The common security threats in smart home are\
    \ confidentiality, authentication, and access. *Confidentiality* threat may result\
    \ in unwanted release of private and sensitive information. *Authentication* threat\
    \ can lead to tempering of sensing and control information. For example, through\
    \ an unauthenticated alert, an attacker can confuse the house controller forcing\
    \ him to open door into thinking of an emergency situation. *Access* is the greatest\
    \ type of threat. It enables attackers to gain control of a system particularly\
    \ at administrative level thus making system insecure.\n\nA smart home may be\
    \ vulnerable due to insecure firmware upgrade to IoT devices, unencrypted information\
    \ sharing between the system components, etc. There are three of the most important\
    \ security concerns for the smart homes. They must be carefully considered when\
    \ designing the smart home to protect against being misused. First, smart home\
    \ should not be equipped with *hackable connected devices*. As it has been observed,\
    \ many of the devices in smart home used today are hackable. These devices include\
    \ thermostats, smart TV, security camera, smart switch, smart door locks, home\
    \ appliances, etc. All of these devices must be protected against all the possible\
    \ attacks. If an attacker gains control over these devices, it can produce inconvenience\
    \ to the user of the home. Even the computers and smartphones used to control\
    \ the smart home system must be protected with a strong security policy. Second,\
    \ smart home should not contain *compromised security systems.* The security system\
    \ of smart home must also be protected using cryptography techniques, strong passwords,\
    \ and firewalls."
