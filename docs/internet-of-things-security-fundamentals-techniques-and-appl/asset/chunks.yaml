    IoT systems contain varieties of devices with diverse hardware, IoT data are not
    only voluminous, but they also exhibit the following characteristics:


    *   Heterogeneous


    *   Multi-dimensional


    *   Continuous with high velocity


    *   Dynamic and inconsistent


    *   Real-time and streaming


    *   Volatile and ad hoc


    *   Strong spatial and temporal dependency


    *   Varying data quality


    *   Diverse data structures and data types


    ## **3.3** **Challenges in IoT Data Processing**


    The IoT is still in its adolescent stage, but considering the amount of data it
    generates, it is already imposing daunting challenges to the traditional data
    processing technologies. The specific properties mentioned in the previous section
    set additional challenges and make it difficult to process IoT data by using traditional
    data processing approaches and platforms. Some of the prominent challenges are:


    *   Limited or no processing power


    *   Communication restraints


    *   Limited memory size


    *   Real-time processing


    *   Handling high ingestion rate


    *   Preserving situation and context-awareness


    *   Energy constraint


    *   Supporting scalability


    *   Providing fault tolerance


    *   Ensuring security and privacy


    ## **3.4** **IoT Data Processing Architectures**


    ### **3.4.1** **Grid Computing**


    Grid computing is a distributed system that allows seamless access to a computing
    grid made of a collection of computing resources connected through a network.
    Grid computing offers supercomputing like computing power utilizing intra- and/or
    inter-organizational computing resources such as desktops, clusters, RAIDs, etc.
    Grid computing is particularly suited for organizational IoT. It requires demanding
    computing infrastructure to process, store, and evaluate IoT data which surely
    raise the IT budget overwhelmingly. Instead of spending on third-party computing
    resources (e.g., the Cloud), organizations can make use of their existing IT infrastructure.
    In-house computing resources such as desktops and employees’ personal portable
    computers including smartphones and tablets can be utilized to form a grid or
    pool of resources. IoT data should be gathered by a designated central entity
    that will assign, distribute, and schedule processing jobs to the potential computing
    sites. After completion, results are collected, assembled, and sent to concerned
    entities. Using grid computing to process IoT data entices many advantages such
    as:


    *   Better utilization of existing infrastructure, do not require additional setup.


    *   Less expensive compared to other options, do not have to pay out for external
    services.


    *   Self-sufficient, do not have to rely on third-party services.


    *   Just-in-time processing of IoT data, hence better response time.


    *   Communication cost and delay are avoided.


    But the obvious drawback of grid computing is that the organizations have to bear
    the overhead of managing and maintaining the infrastructure, applications, and
    data. Hence, small and medium and also rookie organizations may not prefer this
    option.


    ### **3.4.2** **Cloud Computing**


    Cloud computing has been the most favorable platform for IoT data processing.
    It provides centralized access to computing resources at a lower cost. Applications
    and services are hosted in the Cloud. IoT data are collected and sent to the Cloud
    for processing, storing, and analysis. Users and applications either subscribe
    for events prior or query to the Cloud for desired services. Powerful processors
    and massive storage are the lucrative options offered by Cloud computing that
    IoT leverages. Thanks to Cloud’s scalable services, IoT can collect data from
    any number of devices and store them indefinitely and most importantly securely.
    IoT can harness powerful Cloud-based applications and Big Data techniques, e.g.,
    HBase and MapReduce for processing and analysis \[[3](#Ch03.xhtml#ref3_3)\]. Cloud
    computing for IoT is widely accepted especially to those organizations who do
    not have sufficient existing IT infrastructure and also unwilling in upfront investment
    on this account.


    **Problem with Cloud Computing as Processing Architecture for IoT Data:** One
    aspect of concern for which Cloud computing may not go well with IoT data is the
    fact that in most of the IoT systems, the operated data are real-time and the
    applications which consume these data are non-delay-tolerant. For example, disaster
    monitoring and control systems or industrial automation or smart trafficking all
    require real-time access to the sensor data. These applications cannot afford
    to carry the raw data to be processed on a remote site. In these cases, generated
    data should be processed at a site that is close at hand to the devices, so that
    the processing latency is minimized for immediate response. Another problem with
    Cloud computing is that all the IoT data are sent to the Cloud server for processing.
    This puts an immense burden on the underlying network. And the worst part is that
    the most of these data may not be needed to be processed at all. Actually, in
    the early phase of IoT evolution, application logic was embedded into the IoT
    devices’ firmware and the processing was done at the device \[[4](#Ch03.xhtml#ref3_4)\].
    Though it allowed real-time processing and instantaneous response, it was hard
    to upgrade and reprogram those devices if any changes to the application had to
    be instigated \[[5](#Ch03.xhtml#ref3_5)\]. And also, because of resource limitation,
    sophisticated algorithms could not be run on the IoT devices. Hence, it was recommended
    to take the application logic and processing out of the data-originating devices
    and delegate to a Cloud server \[[6](#Ch03.xhtml#ref3_6)\]. So, now the entire
    raw IoT data are transported to and processed in the Cloud instead of the device.
    Since the data processing task has been moved out from the local network to a
    remote data center, this concept is called “*out-of-network processing*” \[5\].
    But, as we have seen, this has introduced typical complications of network congestion
    and latency. To get rid of these problems, researchers pondered an intermediate
    approach and came out with an innovative solution as “*in-network processing*.”
    They proposed to carry out the processing task on the way, i.e., somewhere in
    between the devices and the Cloud. Advancement of network devices in terms of
    processing and storage capacity has fueled the concept to be effective. These
    devices are generally placed at the edge of the network, hence also called edge
    device. Due to close proximity to the IoT devices, real-time processing can be
    achieved. And since most of the data are being processed before being sent to
    the Cloud, network congestion has reduced significantly. In-network data processing
    would be exceptionally rewarding for the sensor networks.


    Since the sensor nodes expense most of their energy in sending and/or receiving
    data streams \[[7](#Ch03.xhtml#ref3_7)\], transferring all the sensed data to
    a remote site would squeeze the battery power of the devices \[[8](#Ch03.xhtml#ref3_8)\].
    As the concept has been popularized, people have come up with different “in-network
    processing” strategies, although the fundamental objectives of all of them are
    same. The main reason to coin different terms to describe the same concept is
    the lack of standard agreement on network edge \[[9](#Ch03.xhtml#ref3_9)\]. In
    the following sections, we shall discuss such three architectures named *Fog computing,
    Mobile-edge computing,* and *Cloudlets*.


    ### **3.4.3** **Fog Computing**'
