    ## 2.4 结论

    物联网应用和支持方利益相关者都可从建立可信的物联网中互利互惠。信任意味着为隐私、安全和治理建立合适的保障措施。建立和维护信任意味着满足当今的需求，同时提供足够的未来保障以满足自然演进的利益相关者需求和期望。形成成功标准和指南所需的共识只能通过对话实现。活动链
    05 提供了一个信息交流和相互理解的平台，同时提供有价值的领导力。活动链 05 内的研究项目都为推进物联网采用做出贡献，其中一些具有通用物联网应用价值，而另一些则为特定物联网应用组提供了显著增强。使这一格局更清晰、随着物联网发展识别进一步研究的差距以及协助研究向标准化和采用的进展，仍是活动链
    05 的主要挑战。活动链 05 的另一个作用是提高认识，并在 IERC 的其他活动链以及更广泛的利益相关者社区中促进对物联网隐私、安全和治理的充分考虑。


