    DOI: 10.1201/9781003338642-2


    ## 2.1 Introduction

    Internet of Things (IoT) is a broad term, which indicates the concept that increasingly
    pervasive connected devices (embedded within, attached, to or related to “Things”)
    will support various applications to enhance the awareness and the capabilities
    of users. For example, users will be able to interact with home automation systems
    to remotely control the heating or the alarm system.


    The possibility of implementing “intelligence” in these pervasive systems and
    applications has also suggested the definition of “Smart” contexts, where digital
    and real-world objects cooperate in a cognitive and autonomic way to fulfill specific
    goals in a more efficient way than basic systems implemented on static rules and
    logic. While full cognitive and autonomic systems may still be years away, there
    are many automated processes and automated Internet process which we take for
    granted every day. So why should the Internet of Things (IoT) require special
    attention when it comes to privacy, security, and governance? Does not the established
    Internet have these matters dealt with sufficiently already, given that through
    just about every smartphone anywhere there are already a wide variety of sensors
    capturing information which we share on the Internet, e.g., photos, videos, etc.?
    Why is IoT any different?


    First, IoT is different because it will be possible and likely that objects will
    autonomously manage their connections with the Internet or, this will be done
    upon the request of someone or something remotely. When someone shares a video
    or a photo taken on their mobile phone over the Internet, they “call the shots.”
    With IoT, potentially someone else is in charge. For reasons largely similar to
    this, the topics of privacy, security, and governance are very important if not
    vital to the success of IoT in order to establish and maintain stakeholder trust
    and confidence. Yes, there is a large overlap between IoT and Internet in many
    areas pertaining to trust; however, IoT brings many new specific dimensions too.


    The adoption of IoT essentially depends upon trust. Moreover this trust must be
    established and maintained with respect to a broad group of stake-holders; otherwise,
    IoT will face, to some degree or other, challenges which may restrict adoption
    scope or delay its timing. Note that with social media you make the conscious
    choice to publish; some IoT applications may adopt the same or similar model but
    there may be other instances or applications where this will not be the case.
    This remote control is not essentially bad. For example, if you were incapacitated
    due to an accident, it could be advantageous that rescue services would be able
    to access objects in your environment to locate you or communicate with you. However,
    if these devices were configured to automatically inform your children what presentations
    had been bought or not bought, this could spoil much of the excitement of receiving
    gifts.


    Facebook’s withdrawn Beacon^()


    The future of IoT is not only influenced by users. The potential autonomy of IoT
    or lack of control over IoT by those it impacts will doubtless generate IoT adoption
    resistance potentially manifested by public protests, negative publicity campaigns,
    and actions by governments. Indeed, many IoT foundation technologies have been
    influenced during the last 10 years by the developing concerns which have been
    labeled as “threats to privacy.” Privacy itself is multidimensional. Popular definitions
    focus upon individual freedoms, or the “right to be left alone.” In reality, privacy
    encompasses the interests of individuals, informal groups, and including all forms
    of organizations and is therefore a complex multidimensional subject.


    In an age of social media, it is interesting to see growing examples of how industry
    groups and governments begin to encourage greater individual responsibility for
    protecting our own privacy, defending our virtual representation in order to protect
    our identity and diminish the challenges of real-world or virtual-world authentications
    and authorization processes. Through IoT, this may become an increasingly “hard
    sell” as individuals begin to realize that any efforts individuals take to protect
    their own identities have almost no influence due to the amounts of information
    smart objects are collecting and publishing on the Internet. Ideally, IoT would
    provision for flexibility enabling it to be suitably synchronized with the evolution
    of the development and use of the wider Internet and the general real-world environment.


    One specific challenge in IoT is the control of the information collected and
    distributed by mobile devices which are increasingly small and pervasive like
    RFID or future micro–nano sensors, which can be worn or distributed in the environment.
    In most cases, such devices have the capability of being wireless connected and
    accessible. In this context, the challenge is to ensure that the information collected
    and stored by micro/nano-RFID and micro/nano sensors should be visible only to
    authorized users (e.g., the owner or user of the object); otherwise, there could
    be a breach of security or privacy. For example, the owner of a luxury good may
    not want anybody to know that the luxury good is in a suitcase. The watch in the
    suitcase may be hidden from view, but it can be easily tracked and identified
    through wireless communication. In a similar way, the information collected by
    the body sensors applied to an elderly person should not be accessible by other
    persons apart from the doctor. Access control mechanisms for these wireless devices
    should be implemented and deployed in the market, but security and privacy solutions
    are not easy to implement in micro–nano devices because of the limitations in
    computing power and storage. At the same time, security and privacy should not
    hamper business development of micro–nano technologies. Keys’ management and deployment
    can also be complex to implement. Tradeoffs should be identified and described.
    These are goals for research activity.

