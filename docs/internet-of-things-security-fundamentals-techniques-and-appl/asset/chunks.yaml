    1. The system is secure against association rule mining, even though the parameters
    are public.

    2. The model generates huge frequent sets that are hard to determine the future
    parameters for sessions.

    3. The key construction policy may help to suggest future keys/parameters for
    `AVK` using a convenient approach.


    ### 6.4.2 Experimental Setup for Association Rule Analysis

    In the data collection step, the online survey questions are designed to test
    the parameter usage and analyze the behavior of the changing parameter. The following
    list of 23 questions is asked to know about potential parameters which are used
    commonly by users (\* indicates mandatory response):

    1. Do you use your first or last name in a form (nickname)?\*

    2. Do you use your DOB, anniversary date, etc.?\*

    3. Do you use your login name in any form (as-is, reversed, capitalized, doubled,
    etc.)?\*

    4. Do you use your spouse’s or child’s name?\*

    5. Do you use other information which can be easily obtained about you, such as
    license plate numbers and house numbers?\*

    6. Do you use PAN number, Aadhar number, Social Security Number, Passport number,
    etc.?\*

    7. Do you use telephone numbers?\*

    8. Do you use brand of your automobile and vehicle number?\*

    9. Do you use a password that consists of all digits, or all alphabets?\*

    10. Do you use a word from language dictionaries, spelling lists, or other lists
    of words?\*

    11. Do you use a password shorter than six characters?\*

    12. Do you use a password with mixed-case alphabets?\*

    13. Do you use a password with no alphabetic characters, e.g., digits or punctuation?\*

    14. Do you use a password that is easy to remember, so you don’t have to write
    it down?\*

    15. Do you use a password that you can type quickly, without having to look at
    the keyboard? This makes it harder for someone to steal your password by watching
    over your shoulder?\*

    16. Do you use DOB of your girlfriend/boyfriend/spouse?\*

    17. Do you use name of your favorite leader/actor/movie/game in password?\*

    18. Do you use station code/country code/area code?\*

    19. Do you use your institute name/office name (in some form)?\*

    20. Do you use the first letter of each word from a line of a song/book or poem?\*

    21. Do you use your residential address, city name, state name, country name,
    etc.?\*

    22. Do you use your ID numbers provided by different institutions such as roll
    number, subscription number, or exam id?\*

    23. Do you use any other type of personal information for constructing a field/parameter
    of password/key?


    The responses of these questions may be taken as a log of information for prediction
    of parameters. In real-world parameters, we have received responses as a probable
    parameter for key generation on a five-point Likert scale. For sample size `N`
    = 100, the responses are considered in the format: (I never use it) 1 2 3 4 5
    (I always use it)


    The parameter set is denoted in subscripted notations by `P = {p[1], p[2], …,
