    # 作者简介


    ## Dr. Shishir Kumar Shandilya

    是知名学者和活跃的研究人员，在教学和研究方面成绩斐然。他是剑桥大学认证的专业教师和培训师，美国电气电子工程师学会（IEEE-USA）高级会员，并当选为 IEEE
    产业推广委员会-印度执行委员。Dr. Shandilya 获得了印度教学学会班加罗尔分会颁发的“IDA 教学卓越奖”，以表彰其在教学中对技术的卓越运用，并由印度科学大会和中央邦科学与技术委员会连续两年（2005
    年和 2006 年）授予“青年科学家奖”。他撰写了七本国际知名书籍（出版于美国、丹麦和印度），并发表了 50 多篇高质量研究论文。他是 20 多个国际专业机构的活跃成员。他也是一名优秀的程序员，并主导了多个软件项目。他还担任高级顾问，为信息技术提供咨询服务。他最近在英国牛津发表了关于“Opinion
    Mining”的专家讲座。


    ## Dr. Soon Ae Chun

    是纽约市立大学信息系统与信息学项目的教授兼主任，也是该校研究生中心计算机科学博士项目的教师。她是美国国家科学基金会资助的信息安全研究与教育实验室（iSecure
    Lab）的负责人。她是富布赖特学者，并获得 CSI 海豚奖杰出学术成就奖。她曾担任数字政府学会主席。Professor Chun 的研究兴趣包括安全与隐私、语义网、数据集成、社会数据分析以及工作流。Dr.
    Chun 目前的研究项目包括网络安全本体开发、多模态网络安全教育数据的关联数据开发，以及医疗保健领域社会数据分析研究。她的研究得到 NSF、NOAA、新泽西州政府机构、CUNY
    和富布赖特的资助。Professor Chun 在安全和数据库期刊上发表论文，如 Journal of Computer Security、IEEE Transactions
    on Dependable and Secure Computing、Journal of Distributed and Parallel Databases、Journal
    of Information Sciences，以及应用信息学期刊如 Government Information Quarterly 和 Information
    Polity。Dr. Chun 曾担任国际数字政府研究会议和 IFIP 数据库与应用安全与隐私会议的会议主席，ACM 应用计算研讨会语义网应用分会的分会主席，以及国际数字政府研究会议的程序主席。Professor
    Chun 是 IEEE 高级会员，也是 ACM、数字政府学会和贝塔伽马西格玛荣誉学会的成员。


    ## Dr. Smita Shandilya

    是杰出学者和充满活力的研究人员，教学和研究技能优秀。她迄今为止教授的所有科目均取得优异成绩。她在国际和国内期刊及会议上发表了 20 多篇高质量研究论文。她在享有盛誉的全国研讨会上发表了多次受邀演讲。她的研究兴趣为电力系统规划和智能微电网。她是其所在学院研究与发展部门的核心成员之一。她还参与了多个项目，如在学院建立能源实验室（中央邦任何私立学院中的首个），以及与
    iEnergy 合作建立培训与孵化中心。


    ## Prof. Edgar Weippl

    是 SBA Research 的研究主任，也是维也纳工业大学的副教授（Privatdozent）。他的研究重点是信息技术安全和电子学习的实用概念。在维也纳工业大学获得博士学位后，Edgar
    在一家研究初创公司工作了两年。随后他在威斯康星州贝洛伊特学院担任助理教授任教一年。2002 年至 2004 年，在软件供应商 ISIS Papyrus 任职期间，他在纽约州纽约市、奥尔巴尼以及德国法兰克福担任顾问。2004
    年，他加入维也纳工业大学，并与 A Min Tjoa 和 Markus Klemen 一起创立了 SBA Research 研究中心。Edgar R. Weippl（CISSP,
    CISA, CISM, CRISC, CSSLP, CMC）是 Computers and Security（COSE）期刊编委会成员，主办 ARES 会议，并担任
    SACMAT 2015 的大会主席、Esorics 2015 的程序委员会主席、ACM CCS 2016 的大会主席，以及 ACM SACMAT 2017
    的程序委员会主席。


