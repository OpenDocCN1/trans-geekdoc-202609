  fmt: '

    # Blockchain Glossary


    Ethereum is a blockchain-based decentralized platform for apps that run smart
    contracts, and is aimed at solving issues associated with censorship, fraud, and
    third party interference.


    ## `EVM`

    The Ethereum Virtual Machine (`EVM`) is a Turing complete virtual machine that
    allows anyone to execute arbitrary EVM Byte Code. Every Ethereum node runs on
    the EVM to maintain consensus across the blockchain.


    ## F


    ### `Fork`

    Forks create an alternate version of the blockchain, leaving two blockchains to
    run simultaneously on different parts of the network.


    ## G


    ### `Genesis Block`

    It is the first or first few blocks of a blockchain.


    ## H


    ### `Hard Fork`

    It is a type of fork that renders previously invalid transactions valid, and vice
    versa. This type of fork requires all nodes and users to upgrade to the latest
    version of the protocol software.


    ### `Halving`

    Bitcoins have a finite supply, which makes them a scarce digital commodity. The
    total amount of bitcoins that will ever be issued is 21 million. The number of
    bitcoins generated per block is decreased 50% every four years. This is called
    “halving.” The final halving will take place in the year 2140.


    ### `Hash`

    It is the act of performing a hash function on the output data. This is used for
    confirming coin transactions.


    ### `Hash Rate`

    Measurement of performance for the mining rig is expressed in hashes per second.


    ### `Hybrid PoS/PoW`

    A hybrid `PoS`/`PoW` allows for both proof of stake and proof of work as consensus
    distribution algorithms on the network. In this method, a balance between miners
    and voters (holders) may be achieved, creating a system of community-based governance
    by both insiders (holders) and outsiders (miners).


    ## I


    ### `Initial Coin Offering (ICO)`

    An initial coin offering (also called an `ICO`) is an event in which a new cryptocurrency
    sells advance tokens from its overall coinbase, in exchange for upfront capital.
    `ICOs` are frequently used for developers of a new cryptocurrency to raise capital.


    ## L


    ### `Ledger`

    It is an append-only record store, where records are immutable and may hold more
    general information than financial records.


    ### `Litecoin`

    It is a peer-to-peer cryptocurrency based on the `Scrypt` proof-of-work network.
    Sometimes it is referred to as the silver of bitcoin’s gold.


    ## M


    ### `Mining`

    Mining is the act of validating blockchain transactions. The necessity of validation
    warrants an incentive for the miners, usually in the form of coins. In this cryptocurrency
    boom, mining can be a lucrative business when done properly. By choosing the most
    efficient and suitable hardware and mining target, mining can produce a stable
    form of passive income.


    ### `Multi-Signature`

    Multi-signature addresses provide an added layer of security by requiring more
    than one key to authorize a transaction.


    ## N


    ### `Node`

    It is a copy of the ledger operated by a participant of the blockchain network.


    ## O


    ### `Off-Ledger Currency`

    It is a currency minted off-ledger and used on-ledger. An example of this would
    be using distributed ledgers to manage a national currency.


    ### `On-Ledger Currency`

    It is a currency minted on-ledger and used on-ledger. An example of this would
    be the cryptocurrency, Bitcoin.


    ### `Oracles`

    Oracles work as a bridge between the real world and the blockchain by providing
    data to the smart contracts.


    ## P


    ### `Peer to Peer`

    Peer to peer (`P2P`) refers to the decentralized interactions between two parties
    or more in a highly interconnected network. Participants of a `P2P` network deal
    directly with each other through a single mediation point.


    ### `Public Address`

    A public address is the cryptographic hash of a public key. They act as email
    addresses that can be published anywhere, unlike private keys.


    ### `Private Key`

    A private key is a string of data that allow you to access the tokens in a specific
    wallet. They act as passwords that are kept hidden from anyone but the owner of
    the address.


    ### `Proof of Stake`

    It is a consensus distribution algorithm that rewards earnings based on the number
    of coins you own or hold. The more you invest in the coin, the more you gain by
    mining with this protocol.


    ### `Proof of Work`

    It is a consensus distribution algorithm that requires an active role in mining
    data blocks, often consuming resources, such as electricity. The more “work” you
    do or the more computational power you provide, the more coins you are rewarded
    with.


    ## R


    ### `Ripple`

    It is a payment network built on distributed ledgers that can be used to transfer
    any currency. The network consists of payment nodes and gateways operated by authorities.
    Payments are made using a series of IOUs, and the network is based on trust relationships.


    ### `Replicated Ledger`

    It is a ledger with one master (authoritative) copy of the data and many slave
    (non-authoritative) copies.


    ## S


    ### `Scrypt`

    `Scrypt` is a type of cryptographic algorithm and is used by `Litecoin`. Compared
    to `SHA256`, this is quicker as it does not use up as much processing time.


    ### `SHA-256`

    `SHA-256` is a cryptographic algorithm used by cryptocurrencies such as Bitcoin.
    However, it uses a lot of computing power and processing time, forcing miners
    to form mining pools to capture gains.


    ### `Smart Contracts`

    Smart contracts encode business rules in a programmable language onto the blockchain
    and are enforced by the participants of the network.


    ### `Soft Fork`

    A soft fork differs from a hard fork in that only previously valid transactions
    are made invalid. Since old nodes recognize the new blocks as valid, a soft fork
    is essentially backward-compatible. This type of fork requires most miners upgrading
    in order to enforce, while a hard fork requires all nodes to agree on the new
    version.


    ### `Solidity`

    `Solidity` is Ethereum’s programming language for developing smart contracts.


    ## T


    ### `Testnet`

    It is a test blockchain used by developers to prevent expending assets on the
    main chain.


    ### `Transaction Block`

    It is a collection of transactions gathered into a block that can then be hashed
    and added to the blockchain.


    ### `Transaction Fee`

    All cryptocurrency transactions involve a small transaction fee. These transaction
    fees add up to account for the block reward that a miner receives when he successfully
    processes a block.


    ### `Turing Complete`

    Turing complete refers to the ability of a machine to perform calculations that
    any other programmable computer is capable of. An example of this is the Ethereum
    Virtual Machine (`EVM`).


    ## U


    ### `Unpermissioned ledgers`

    Unpermissioned ledgers such as Bitcoin have no single owner – indeed, they cannot
    be owned. The purpose of an unpermissioned ledger is to allow anyone to contribute
    data to the ledger and for everyone in possession of the ledger to have identical
    copies. This creates censorship resistance, which means that no actor can prevent
    a transaction from being added to the ledger. Participants maintain the integrity
    of the ledger by reaching a consensus about its state.


    ## W


    ### `Wallet`

    It is a file that houses private keys. It usually contains a software client which
    allows access to view and create transactions on a specific blockchain that the
    wallet is designed for.


    ## References


    * [1] Available at: https://blockgeeks.com/guides/blockchain-glossary-from-a-z/

    * [2] Available at: http://www.blockchaintechnologies.com/blockchain-glossary


    ## About the Editors

