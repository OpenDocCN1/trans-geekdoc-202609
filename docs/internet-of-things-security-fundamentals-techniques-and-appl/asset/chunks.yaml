    # 6 基于 AVK 的物联网密码系统和客户端加密视角的隐秘挖掘


    **Shaligram Prajapat**


    International Institute of Professional Studies, Madhya Pradesh, India Devi Ahilya
    University, Indore, Madhya Pradesh, India


    DOI: 10.1201/9781003338642-6


    基于自动可变密钥（AVK）的加密方案声称在物联网设备之间的通信和信息交换中具有节能性。本章介绍了基于对称密钥的加密算法的参数化版本。AVK 的参数化版本强调密钥的生成和仅基于参数的使用。密钥构造的常用方法依赖于数字密钥。在这里，密钥构造过程已扩展用于生成字母数字密钥以及参数域（基于用户个人信息选择）。使用数字或字母系列、递推关系或位置信息是很常见的，这可能会危及系统的安全性。隐秘模型为用户提供了参数选择和参数变化的自由。本章从关联规则挖掘的角度介绍了
    AVK 基于对称密码系统的参数化模型的分析视角。来自隐秘关联规则挖掘测试的有用推断和结果支持了审计加密算法的观点，并确定了使用大量参数进行物联网设备之间安全信息交换的能力。


    ## 6.1 引言

