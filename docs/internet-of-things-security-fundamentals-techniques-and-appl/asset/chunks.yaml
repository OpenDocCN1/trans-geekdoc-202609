    ### 6. Faster transactions

    The superior feature of Blockchain is its computing time. Blockchain models the
    P2P communication by public key cryptography. Centralized databases create more
    computing overhead.


    ### 7. Lower transaction costs

    The costs of transactions reduce significantly since there is no intermediate
    third party.


    ## 5.6 Challenges of Blockchain in IoT


    ![](Images/fig0002.jpg)


    1. **Scalability:** The ever-growing IoT network might lead to the issue of centralization
    in the near future, and with the growing pace of time, it might require the management
    of records which would be a dark cover on the future of this promising technology.

    2. **Issues of legal and compliance contracts:** The current Blockchain models
    in the IoT environment are not bounded by compliance regulations, but the service
    providers and IoT manufacturers might face some serious problems since IoT is
    entirely a new ecosystem. Certain business threats cannot be escaped by the use
    of Blockchain technology.

    3. **Lack of skills:** The concept of Blockchain is an emerging trend and not
    much experts are available for its implementation domain. Industries require hiring
    of teams and proficient engineers for deploying and maintaining the Blockchain
    model.

    4. **Storage:** The Blockchain model drives out the centralized server for storing
    device ID’s and transactions, but the block of valid records or the ledger must
    be stored at devices only. The subsequent storage of ledgers elevates the size
    of storage required. Most of the smart devices such as sensors do not have enough
    storage potential and thus concern for sufficient storage space arises. In the
    end of 2016, the Blockchain size reached more than 90 GB. Thus, storage is an
    important disadvantage.

    5. **Processing time and power:** The IoT systems being integrated with Blockchain
    lead to the overhead of processing of algorithms for encryption and thus induce
    the pressure of time computation at a desired speed for different encryption algorithms.


    ## 5.7 Application of Blockchain in IoT Smart Devices


    With the aid of Blockchain, the unique history of smart devices can be tracked.
    The distributed ledger records data exchanges, and Blockchain empowers them to
    work independently and autonomously. The record of history would help to monitor
    each and every action of devices. These smart devices could be a laundry machine,
    a dishwasher, and robo vacuum cleaners.


    The smart vehicles can keep a maintenance record for itself. It can have a maintenance
    schedule, diagnosis record, and payment details incurred on it. Blockchain networks
    abstract themselves with potential to become independent agents, and refer themselves
    as “Distributed Autonomous Corporations.”


    Some of the Blockchains in IoT applications are as follows:


    1. **Online shopping**

    Blockchain improves workflow and status of shipments in real time. Online shopping
    manages and handles many elements on warehouse end as well as on customers end.
    Contents in container, bills, invoices, carriers, etc., need to be monitored.
    Blockchain helps buyer and seller parties to establish a transparency. Errors
    and frauds are reduced. Time spent by the products in shipping process and transit
    is reduced and management of inventory is improved, thus ultimately reducing cost.

    2. **Blockchain in a supply-chain ecosystem**

    The immutable framework of Blockchain is a security-rich and highly transparent
    network, and provides the participants with an end-to-end visibility. The progress
    of goods through supply chains can be viewed by each participant. Bills and invoices
    can be seen at any time. Modification and deletion of any record are not possible
    without consensus of involved parties in the network. Thus, Blockchain stimulates
    a sustainable transport of goods by aggregating shipping processes, and thus offers
    a trusted access to merchandize.

    3. **Blockchain in diamond business**

    Blockchain will revolutionize the future of digital assets. Blockchain has the
    power to run business transactions around the globe by reducing friction and enhancing
    trust. Diamond mining industry is an example of it.

    Diamonds being extremely precious and highly rare face the threats of smuggling,
    fraud, counterfeit diamonds, and unethical mining of stones. Blockchain in future
    would enable a more transparent system. Blockchain can be configured for the following
    processes:

    * A photo with high resolution of each diamond can be kept in records.

    * Real-time transactions can be maintained for every payment transaction.

    * Authentication certificate can be designed and hold by parties involved in transactions.

    * The serial number of diamond pieces, their weight, clarity, and carat can be
    maintained.


    ## 5.8 Summary


    The IoT ecosystem needs to coordinate and collaborate with network connectivity
    by keeping the concerns of time, cost, and security. In this chapter, we have
    discussed Blockchain as a model to provide the secure data exchanges among connected
    IoT devices. All the devices that have been integrated must comply with the processing
    of the Blockchain model along with the network infrastructure and IoT framework.
    The Blockchain is a good mechanism to preserve the data integrity in an IoT network.
    With the enhancing domain of IoT technologies, Blockchain ensures that smart devices
    get autonomous functioning. The Blockchain model in the IoT framework enhances
    the security aspects for device authentication and data verification, and encrypts
    and verifies valid transactions at all levels. This way, the IoT framework can
    be secured and safeguarded with the Blockchain if a few shortcomings of it are
    overcome.


