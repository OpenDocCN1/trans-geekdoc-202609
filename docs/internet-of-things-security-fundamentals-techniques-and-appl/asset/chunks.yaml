    ## Dedication

    *To our little master “Samarth Koshagra Shandilya”*

    — S. K. S., S. S.


    *To my beloved family, James, Alex, and Catherine.*

    — S. A. C.


    # Foreword

    The world has witnessed tremendous growth in machine-to-machine (M2M) communication
    technology in the last decade. As a result of this, a large range of M2M communication
    techniques have emerged and changed the entire scenario. These M2M-enabled nodes
    have created a highly sophisticated and hi-tech Internet of thing (IoT) environment
    for many purposes.


    IoT security is collection of tools and techniques for safeguarding connected
    devices and networks in IoT domain. But, this important thing generally remains
    unconsidered in the IoT design. The IoT products are often implemented with old
    or missing security functionalities. Also, the clients are often failed to change
    even the default passwords of smart devices. Security experts keep warning the
    organizations and people for the potential risk of having a large number of unsecured
    devices and breach of privacy due to this. One such security measure to avoid
    such risks is Identity of Things (IDoT), which assigns unique identifiers (UIDs)
    to the smart devices as per the associated metadata and then only allows them
    to communicate with each other. Identity of things is an essential component of
    the IoT, in which almost anything imaginable can be addressed and networked for
    exchange of data online.


    There are not many books on IoT Security; the few that have published deal mostly
    only with the installation of secured IoT. This book not only discusses the IoT
    Security techniques in detail but also tries to provide a comprehensive picture
    on the subject which is necessary to build highly secure and feature-rich IoT
    applications.


    Finally, I would like to say that the presented book is a comprehensive and well-written
    guide on the topic. I believe that students and practitioners will especially
    enjoy reading this work.


    *Prof. Atulya Nagar holds the Foundation Chair as Professor of Mathematical Sciences
    and is the Dean of Faculty of Science at Liverpool Hope University in United Kingdom.
    Professor Nagar is an internationally recognized scholar working at the cutting
    edge of theoretical computer science, applied mathematical analysis, operations
    research, and systems engineering, and his work is underpinned by strong complexity-theoretical
    foundations.*


    # Preface

    IoT security is the area of endeavor concerned with safeguarding connected devices
    and networks in the Internet of things (IoTs). It involves the increasing prevalence
    of objects provided with unique identifiers and the ability to automatically transfer
    data over a network. Much of the increase in IoT communication comes from computing
    devices and embedded sensor systems used in industrial machine-to-machine (M2M)
    communications, smart energy grids, home and building automation, vehicle-to-vehicle
    communication, and wearable computing devices.


    The main problem is that because the idea of networking appliances and other objects
    is relatively new, security has not always been considered in the product design.
    IoT products are often sold with old embedded operating systems and software.
    To improve security, an IoT device that needs to be directly accessible over the
    Internet should be segmented into its own network and have network access restricted.
    The network segment should then be monitored to identify potential anomalous traffic,
    and actions should be taken if there is a problem. This issue is an open research
    problem, and only few references are available on this subject.


    This book is focused on current research while highlighting the empirical results
    along with theoretical concept to provide a good comprehensive reference for students,
    researchers, scholars, professionals, and practitioners in the field of advanced
    Security and IoT.


    We express our heartfelt gratitude to all the authors, reviewers, and River Publishers
    personnel, especially Mr. Mark De Jongh for their kind support. Special thanks
    to Professor Atulya Nagar, Dr. Suresh Jain, and Dr. Ganga Agnihotri, for their
    endless motivation and patience. We hope that this book will be beneficial to
    all concerned readers.


    Shishir Kumar Shandilya VIT Bhopal University, India

