    # RIVER PUBLISHERS SERIES IN SECURITY AND DIGITAL FORENSICS


    ## Series Editors


    WILLIAM J. BUCHANAN

    Edinburgh Napier University, UK


    ANAND R. PRASAD

    NEC, Japan


    ## Indexing

    All books published in this series are submitted to the Web of Science Book Citation
    Index (BkCI), to CrossRef and to Google Scholar.


    ## Series Description

    The “River Publishers Series in Security and Digital Forensics” is a series of
    comprehensive academic and professional books which focus on the theory and applications
    of Cyber Security, including Data Security, Mobile and Network Security, Cryptography
    and Digital Forensics. Topics in Prevention and Threat Management are also included
    in the scope of the book series, as are general business Standards in this domain.


    Books published in the series include research monographs, edited volumes, handbooks
    and textbooks. The books provide professionals, researchers, educators, and advanced
    students in the field with an invaluable insight into the latest research and
    developments.


    ## Topics Covered

    Topics covered in the series include, but are by no means restricted to the following:


    * Cyber Security

    * Digital Forensics

    * Cryptography

    * Blockchain

    * IoT Security

    * Network Security

    * Mobile Security

    * Data and App Security

    * Threat Management

    * Standardization

    * Privacy

    * Software Security

    * Hardware Security


    For a list of other books in this series, visit www.riverpublishers.com


