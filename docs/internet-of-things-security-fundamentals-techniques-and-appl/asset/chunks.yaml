- raw: 'Cisco has emerged as the largest player in offering “in-network processing”
    solution that provides an environment for IoT data processing and analysis close
    to the devices \[[10](#Ch03.xhtml#ref3_10), [11](#Ch03.xhtml#ref3_11)\]. Cisco
    has given a fascinating term of this computing paradigm – Fog Computing – as if
    the cloud has come down to the earth (edge of the network) as fog. The processing
    is done on the edge devices such as switches, routers, set-top boxes, etc., which
    are placed at the edge of the local area network. That’s why this computing paradigm
    is also known as *Edge Computing*. Within the network, IoT data are collected,
    processed, and stored at Fog/edge node, also referred as the IoT gateway through
    which the Fog interacts with the Cloud. Fog computing is not meant to replace
    the Cloud rather complement it. The transient data that are required to be processed
    immediately for an instant response or the data that need to be stored for a short
    period only are processed in the Fog. If the IoT data need to be stored for a
    longer duration for further processing such as analysis and mining, they are forwarded
    to a Cloud server. Depending on the data type and processing type, different strategies
    are adopted by Fog computing \[[12](#Ch03.xhtml#ref3_12)\]. Fog computing relieves
    the network from being overloaded by performing the preliminary processing at
    the ground, filtering out the unnecessary data, and letting pass only the data
    that are required to be further processed or stored. This approach has a far-reaching
    impact when large numbers of connected devices (according to Cisco that could
    be 50 billion by 2020) are linked to the Cloud. Interconnecting several context-related
    Fog nodes gives a panoramic opportunity for sophisticated and context-aware data
    analysis. Fog computing offers better privacy and reliability than Cloud. Connecting
    to the Cloud depends on the external network which may go down occasionally. Local
    computing facility will be a great prospect for mission-critical IoT applications
    in those unfortunate conditions.


    ### **3.4.4** **Mobile-edge Computing**


    Mobile phones, especially smartphones, are becoming an integral part of IoT, both
    as the source and sink of data and services. Today’s smartphones are boasted with
    a number of sensors which make smartphones as a prominent outlet of data generation,
    along with social network data. From the end-user perspective, events are notified
    to the smartphones as well as users may instruct and control the “things” through
    their smartphones. If the IoT devices could be connected to the mobile networks
    directly (i.e., avoiding going to the Cloud), the mobile users’ quality of experience
    (QoE) would be significantly improved. Considering that, lately, MEC (Mobile-Edge
    Computing^()


    ### **3.4.5** **Cloudlets**


    The concept of Cloudlet has emerged from the convergence of mobile computing and
    Cloud computing. Developed at Carnegie Mellon University, Cloudlet is envisioned
    as the middle-tier between mobile devices and Cloud \[[16](#Ch03.xhtml#ref3_16)\].
    It aims to slash end-to-end latency by getting Cloud computing services closer
    to the edge. A Cloudlet is a miniature Cloud data center which emulates the Cloud
    facility much closer to the devices. A Cloudlet is ideally, one hop (Wi-Fi) distant
    from the mobile devices. It allows just-in-time response to computing intensive
    mobile applications. Architecturally, Cloudlets possess adequate computing power
    in the form of multicore CPU cluster, RAM, and cache and offer Cloud-like virtualization
    to run the computational jobs from mobile devices. They carry out the resource-intensive
    computational jobs delegated by resource-constrained mobile devices. A client
    application installed on the mobile device searches for the nearest available
    Cloudlet. The executable jobs are offloaded to the Cloudlet, cached, processed,
    or aggregated there and the result is sent back to the device or forwarded to
    the Cloud. Cloudlets are generally well connected to a Cloud server. They do not
    store the computations and results but only cache temporarily (hence referred
    as a soft state) and transfer them to the Cloud if necessary. But what happens
    if no Cloudlet is found in the proximity? Does it fail? No, not exactly. The application
    will react in such a way that there were no Cloudlets ever. Either the job will
    be executed on the device only or it will be routed to the Cloud. In the latter
    case, the application has to tolerate the expected delay. As mentioned in the
    previous section, smart mobile devices, equipped with a number of sensors, have
    made IoT ubiquitous and have become a significant source of IoT data. Hence, Cloudlets
    are becoming a genuine potential for processing these huge near-real-time data,
    having said that the potential of Cloudlets need not be limited to mobile IoT
    applications only. Cloudlets can be leveraged to process data from other IoT devices
    as well, provided having suitable interface and middleware.


    ### **3.4.6** **On-site Processing**


    On-site processing is a technique that is typically deployed on the sensor devices
    so that the sensed data are processed in and by the sensor devices themselves.
    This contrasts with the other approaches mentioned earlier, where the source of
    the data and the processing unit are separate. Typically, the sensor devices do
    not have enough computing resource; that is why the sensed data are driven to
    some external system for processing. In the previous sections, we have seen few
    options that we have when it comes to real-time or near-real-time data processing
    provided that there is available required infrastructure in the proximity. But
    ubiquitous and pervasive consumption of IoT may get us into situations where neither
    such computing facility is available nearby nor there is enough bandwidth to send
    the data across to a Cloud server. Let us consider two separate cases \[15\]:


    1.  Commercial jets generate 10 TB for every half an hour of flight which should
    be analyzed for various flight-related operations including to run the flight
    in auto-pilot mode.


    2.  Offshore oil rigs generate 500 GB of data weekly and required to be analyzed
    to monitor pipelines and seismic sensors.


    In the first case, data processing should be in hard real time, and generally,
    there is no in-network processing facility available within the aircraft. In the
    second case, data may be processed in soft real time but in such environments,
    the available bandwidth for data transmission is very limited. So, sending a huge
    amount of data to a remote location for processing is exceedingly strenuous. In
    both the environments, it is necessary for the sensor devices to have *in situ*
    data processing capability. This will save a lot of energy and will lengthen the
    lifetime/operating period of the devices. To execute the tasks like data aggregation,
    the sensor devices may solicit the help of their close neighbors. Also, if most
    of the data are processed locally, they do not have to be deported to the upper
    layers. The volume of data transported over the network will be considerably lessened,
    which becomes decisive where communication facility is not enough. On-site data
    processing should also be a preferable choice in those IoT applications where
    IoT data need not be archived, centrally processed, or coalesced from multiple
    sources.


    ### **3.4.7** **In-memory Computing**'
