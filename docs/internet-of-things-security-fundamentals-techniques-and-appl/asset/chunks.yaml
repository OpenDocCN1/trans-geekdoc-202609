    # 1 IoT Security: An Introduction

    Shishir Kumar Shandilya[¹](#fn1)

    DOI: 10.1201/9781003338642-1

    With the ability to get connected, the IoT has spread its arena while facilitating
    the users with more comfort to get connected to several devices at one go, to
    share data and control. This ability to connect, communicate, and management has
    opened a wide door of opportunities for futuristic technologies to work collaboratively.
    These communication links are now coming out from closed secured networks to open
    public Internet networks. This is making a big security issue for the IoT system
    as devices are becoming intelligent day by day and their interconnection among
    them is raising the inevitable possibilities of intrusion and interferences. A
    bunch of customizable strong IoT protection mechanisms are therefore needed to
    avoid such compromise on privacy and to safeguard the IoT users’ data. The presented
    chapter analyzes these security issues and discusses the security challenges posed
    by IoT devices with the approaches for respective solutions.


    ## 1.1 Introduction

    Organizations are essentially required to be completely convinced regarding the
    security issues before implementing IoT in the existing system or creating an
    entirely new system. Therefore, the IoT solution providers face many challenges
    to create faith on the technology. Every organization visualizes and conceptualizes
    the IoT deployment differently which creates more restlessness and disbelieve
    on the appropriateness of security measures.

