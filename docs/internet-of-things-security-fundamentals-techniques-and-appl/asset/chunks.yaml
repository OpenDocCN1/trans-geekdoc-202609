    ### 1.5.2 Security in VANET

    The security of a VANET depends on cost, trust, privacy, and its deployment. Certain
    countries assign electronic license plates (ELPs) to vehicles, which is a cryptographically
    verifiable number.

    The PKI in context of VANET is termed VPKI, which is a certification key distribution,
    certificate revocation, data recording, etc.


