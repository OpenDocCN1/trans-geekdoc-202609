  trans: "\n## 4.8 智能停车系统\n\n### 趋势分析和需求响应定价\n* 趋势分析：这些服务允许收集和分析历史停车数据，并向停车管理人员提供趋势报告。\n\
    * 需求响应定价：此服务允许根据每个车位的需求更改价格。\n\n### 安全目标\n智能停车系统的安全目标可能包括：\n* 维护客户和停车管理人员的身份认证。\n\
    * 维护谁可以更改停车位价格的授权。\n* 维护停车管理人员、收费员、管理员和执法人员的角色。\n* 维护管理员的委派。\n* 维护系统收集的所有数据的完整性。\n\
    * 维护系统敏感数据的保密性。\n* 维护整个系统及其所有组件的可用性。\n\n### 系统功能\n停车系统的功能描述如下：\n1. 客户购买停车位\n \
    \  * 客户在其智能手机上安装停车应用程序。\n   * 客户注册付款信息以完成交易。\n   * 应用程序提供附近可用停车位和价格详情的实时信息。\n\
    \   * 客户选择车位并驾车前往。\n   * 客户使用应用程序支付车位费用。\n2. 停车执法人员收到未付款事件的警报\n   * 停车应用程序记录停车会话开始时间，并记录车辆在停车位停留的超时时间。\n\
    \   * IP 视频摄像头捕捉车辆在停车位超时的视频。\n   * 停车应用程序将停车位中车辆的视频与开始时间和停车交易持续时间相关联，以便在交易持续时间已过期时进行视频确认标记。\n\
    \   * 然后停车应用程序将警报传输到超时车辆的执法应用程序。\n   * 执法人员收到短信警报并对车辆进行开罚单。\n\n### 系统架构\n下图显示了整体系统架构：\n\
    \n![图 4.4 智能停车系统架构 \\[5\\]。](Images/fig4_4.jpg)\n\n**图 4.4 智能停车系统架构 [5]。**\n\n\
    ### 安全控制\n需要在智能停车系统中实施的安全控制如下：\n\n**表 4.2 智能停车系统安全要求**\n\n| 针对智能停车系统的攻击 | 攻击类型\
    \ | 安全控制要求 |\n|---|---|---|\n| 攻击者控制客户账户并向客户收取停车时间费用 | 欺骗 | 身份认证 |\n| 通过未经授权的访问，攻击者免费使用停车位\
    \ | 篡改 | 身份认证和完整性 |\n| 攻击者声称系统出现故障而免费使用停车位 | 否认 | 不可否认性和完整性 |\n| 攻击者获取客户付款详情 |\
    \ 信息泄露 | 身份认证和保密性 |\n| 攻击者通过 DoS 攻击关闭智能停车系统 | 拒绝服务 | 可用性 |\n| 攻击者通过在后端服务器植入 rootkit\
    \ 来破坏智能停车运营 | 权限提升 | 授权 |\n\n### 4.8.2 密钥管理\n它是在密码系统中管理加密密钥所使用的技术。它促进密钥的生成、交换、存储、使用和替换。KM\
    \ 包括密码协议设计、密钥服务器、用户程序和其他相关协议。密钥或密码密钥是一段信息，也称为参数，决定了密码算法的功能输出。密码系统可能使用不同类型的密钥，一个系统可能使用多个密钥。密钥可以是对称密钥或私钥，也可以是非对称密钥或公钥。在对称密钥算法中，涉及的密钥对加密和解密消息是相同的。密钥必须谨慎选择，并且以安全的方式分发和存储。相比之下，非对称密钥是两个在数学上相关联的独立密钥。它们通常结合使用以进行通信。密钥管理系统安全策略提供了可用于保护密钥和元数据的规则。密钥管理在物联网中非常重要，因为它保护保密性、完整性和可用性，并且该过程是安全的\
    \ [17]。\n\n## 4.9 基于物联网的智能家居及安全问题\n本节讨论智能家居作为物联网模型。智能家居可以定义为具有照明、电器、供暖、空调、电视、计算机、娱乐系统以及安全和摄像系统等环境的每个系统都能够相互通信。例如，一个系统可通过摄像头画面在门铃或信箱被使用或智能锁被未经授权访问时向用户智能手机发出警报。智能家居中所有连接的“物”也可以随时远程控制，无论是从家中任何房间，还是通过电话或连接到互联网的任何设备从世界任何地方远程控制。因为在智能家居中，所有事物都通过互联网相互连接；因此也暴露出安全威胁。智能家居的常见安全威胁是保密性、身份认证和访问。*保密性*威胁可能导致私人敏感信息被非预期释放。*身份认证*威胁可能导致传感和控制信息的篡改。例如，通过未经身份验证的警报，攻击者可以混淆房屋控制器，迫使其打开门，以为是紧急情况。*访问*是最严重的威胁类型。它使攻击者能够控制系统，特别是管理级别，从而使系统不安全。\n\
    \n智能家居可能因物联网设备不安全的固件升级、系统组件之间未加密的信息共享等而存在漏洞。智能家居有三个最重要的安全问题。在设计智能家居时必须仔细考虑，以防止被滥用。首先，智能家居不应配备\
    \ *可被黑客攻击的连接设备*。正如所观察到的，今天智能家居中使用的许多设备都是可被黑客攻击的。这些设备包括恒温器、智能电视、安防摄像头、智能开关、智能门锁、家用电器等。所有这些设备必须防止所有可能的攻击。如果攻击者控制了这些设备，可能会给家庭用户带来不便。用于控制智能家居系统的计算机和智能手机也必须使用强大的安全策略进行保护。其次，智能家居不应包含\
    \ *受损的安全系统*。智能家居的安全系统也必须使用密码技术、强密码和防火墙进行保护。\n"
