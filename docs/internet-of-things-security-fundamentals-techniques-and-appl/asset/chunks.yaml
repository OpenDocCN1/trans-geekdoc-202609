- raw: 'IoT has influenced our lives in a great way and in future also it will continue
    to do so. Future IoT devices will be truly ubiquitous and will be used more pervasively
    than today. The increasing number of IoT devices will generate abundant of data.
    To utilize IoT to its true capacity, these data are to be processed effectively.
    For that, suitable data capturing and processing architectures are needed. In
    this chapter, we have discussed a few of such architectures. We have seen that
    processing IoT data is a challenging job. We have also assessed the security and
    privacy aspects of each architecture. We have seen if the data are processed within
    the home network (e.g., Grid and Fog), the risk is less because the longer the
    data stays at the public network (i.e., Internet), the more it invites the risk.
    If the data are sent to the remote centralized server (Cloud) through the outer
    network, the risk is maximum. We also reasoned that not only the IoT security,
    we should also an emphasis on conserving data privacy. There should be standardized
    policy and framework for IoT applications in organizational as well as Government
    levels. As a concluding remark, for a good reason, it will be wise to refrain
    from connecting everything to the IoT that can be.


