- raw: "*   [\\[31\\] Morris, I., “ETSI Drops ‘Mobile’ From MEC,” available at: http://www.lightreading.com/mobile/mec-(mobile-edge-computing)/etsi-drops-mobile-from-mec/d/d-id/726273\
    \ \\[Accessed 27 December 2016\\].](#Ch03.xhtml#bck_ref3_31)\n\n#  4   **Safeguarding\
    \ the Connected Future: Security in Internet of Things (IoT)**  \n\n**Priti Maheshwary\
    \ and Timothy Malche**\n\nDepartment of CSE, Rabindranath Tagore University (formerly\
    \ known as AISECT University), Bhopal, MP, India\n\nDOI: 10.1201/9781003338642-4\n\
    \nOvercoming security issues are one of the main challenges for the Internet of\
    \ things (IoT). There are different security issues that are related to IoT in\
    \ the context of sensor nodes, system network, IoT cloud, IoT backend database,\
    \ IoT applications, system software, and firmware. IoT applications have real-time\
    \ requirements and expected to deliver a high level of reliability. The IoT applications\
    \ operate in safety–critical environment and therefore need justification extreme\
    \ security measures. This chapter discusses the need for security in IoT, IoT\
    \ architecture and attacks on each layer of the IoT architecture, attack surface\
    \ in IoT, IoT protocols, built-in security features in protocols, and security\
    \ management. The aim of this chapter is to provide a thorough understanding of\
    \ major security concerns that are necessary in building secure IoT.\n\n## **4.1**\
    \ **Introduction**\n\nInternet of things (IoT) is a technological revolution that\
    \ serves as a global network of intelligent physical objects. In this network,\
    \ all intelligent objects exchange information and services over the Internet\
    \ where some information or services are private and some are publicly accessible.\
    \ In IoT, these objects are called “things.” A “thing” can be any object embedded\
    \ with sensors, electronics, software, and network connectivity. A “thing” has\
    \ an IP address and has the ability to transfer data over the Internet. Some examples\
    \ of IoT applications include connected human body, connected home, connected\
    \ industry, connected environment, connected city, etc. At present, there are\
    \ billions of objects exist on Earth. Through IoT, all kinds of objects ranging\
    \ from simplest (such as coffee cup, umbrella, cloths, etc.) to more complex (such\
    \ as watch, car, refrigerator, washing machines, airplanes, smartphones, computers,\
    \ etc.) will be able to connect, interact, and communicate. IoT is a very complex\
    \ platform for connecting things. There are many objects, sensors, actuators,\
    \ and technologies available for building the IoT ecosystem. It is estimated that\
    \ there will be around 50 billion connected objects by the year 2020. At present,\
    \ 80% of the connected objects are exposed to security threats and vulnerability.\
    \ In the IoT ecosystem, all objects are connected to the Internet all the time\
    \ sensing and sharing information. In order to be more useful, IoT devices must\
    \ make real-time bi-directional connections to the Internet instead of only uploading\
    \ the data. Therefore, this type of communication must be secure enough; otherwise,\
    \ it will be easier for the attacker to get into the system and gain control over\
    \ it and steal sensitive information. Demand for security also raises when IoT\
    \ is used in many important domains such as medical, military, and even many smart\
    \ city applications, where data are more sensitive and systems are more open for\
    \ remote access and control. Thus, it becomes very important to understand security\
    \ requirements when designing the IoT system in order to make our connected world\
    \ safe and secure.\n\nThis chapter discusses the IoT architecture and security\
    \ needs. However, the main focus of this chapter is to understand security issues\
    \ in the IoT which will help in developing more secure connected future. This\
