- raw: 'One aspect which often gets overlooked particularly frequently by those of
    us who entered adulthood before the year 1990 is the importance of the virtual-world.
    Today, the virtual identities of children are as important to them if not more
    so than their real-world identities. Within the virtual-world, there exists most
    if not all of the things we find in the real-world including objects, machines,
    money, etc. IoT includes the real- and virtual-worlds, and indeed, it is capable
    of establishing an important bridge between the two. This bridge is likely to
    grow and become more relevant in the life of citizens in the future. New devices
    like Google Glass or future Intelligent Transportation Systems’ (ITSs) applications
    in cars will propose “augmented reality” where the integration of digital and
    real-word information is used to compose sophisticated applications. This trend
    highlights even more the need for security and privacy, because data breaches
    in the virtual-world can have consequences in the real-world. In some contexts
    and applications, security and privacy threats can even become safety threats
    with more dramatic consequences for the lives of the citizen. As a conceptual
    example, actuators in the real-world may be set remotely within a “smart house”
    to provoke fires or flooding.


    ## **2.2** **Overview of Activity Chain 05 – Governance, Privacy, and Security
    Issues**


    The European Research Cluster on the IoT has created a number of activity chains
    to favor close cooperation between the projects addressing IoT topics and to form
    an arena for exchange of ideas and open dialog on important research challenges.
    The activity chains are defined as work streams that group together partners or
    specific participants from partners around well-defined technical activities that
    will result into at least one output or delivery that will be used in addressing
    the IERC objectives. IERC Activity Chain 05 is a cross-project activity focused
    on making a valued contribution to IoT privacy, security, and governance among
    the EC funded research projects in the area of IoT. As described in \[[3](#Ch02.xhtml#ref2_3)\],
    the three aspects are closely interlinked “Privacy, security, and competition
    have been identified as the main issues related to IOT Governance; however, those
    issues should not be discussed in a separate or isolated way” \[3\]. In the same
    reference, it was also highlighted the challenge to define a common agreed definition
    for Governance of IoT. In a similar way, the concepts of security and privacy
    do not have a uniform definition in the literature even if there is a common agreement
    on these concepts. Overall, the main objective of the Activity Chain 05 is to
    identify research challenges and topics, which could make IoT more secure for
    users (i.e., citizen, business, and government), to guarantee the privacy of users
    and support the confident, successful, and trusted development of the IoT market.
    In comparison to IoT initiatives in Europe or at a global level (e.g., IGF), Activity
    Chain 05 does not define government policies but focuses upon research (which
    could eventually be used to support policies or standardization activities). The
    following sections provide an overview of some contributions which European Commission
    funded projects associated with Activity Chain 05 have made to IoT privacy, security,
    and governance.


    ## **2.3** **Contribution from FP7 Projects**


    ### **2.3.1** **FP7 iCore Access Framework (iCore Contribution)**


    The iCore cognitive framework is based on the principle that any real-world object
    and any digital object that is available, accessible, observable, or controllable
    can have a virtual representation in the “Internet of Things,” which is called
    virtual object (VO). The VOs are primarily targeted to the abstraction of technological
    heterogeneity and include semantic description of functionality that enables situation-aware
    selection and use of objects. Composite virtual objects (CVOs) use the services
    of VOs. A CVO is a cognitive mash-up of semantically interoperable VOs that render
    services in accordance with the user/stakeholder perspectives and the application
    requirements.


    The overall layered approach of the iCore project is provided in [Figure 2.1](#Ch02.xhtml#fig2_1).
    The first cognitive management layer (VO level cognitive framework) is responsible
    for managing the VOs throughout their lifecycle, ensuring reliability of the link
    to the real-world object/entity (e.g., sensors, actuators, devices, etc.). They
    represent, for example, in a logistic related scenario, tracking temperature-controlled
    goods’ transport, individual goods’ boxes are represented by VOs and the container
    transported by a truck is a VO as is the truck itself. IoT-related applications
    can interface for different service reasons each of these VOs separately.


    ![Figure 2.1 iCore framework.](Images/fig2_1.jpg)


    [**Figure** **2.1**](#Ch02.xhtml#bck_fig2_1) iCore framework.


    The second cognitive management layer (CVO level cognitive framework) is responsible
    for composing the VOs in CVO. CVOs will be using the services of VO to compose
    more sophisticated objects. In our example, the combination of the truck and the
    transported goods is represented in the cognitive framework as a CVO.


    The third level (user level cognitive framework) is responsible for interaction
    with users/stakeholders. The cognitive management frameworks will record the users’
    needs and requirements (e.g., human intentions) by collecting and analyzing the
    user profiles and stakeholders’ contracts (e.g., service level agreements) and
    will create/activate relevant VO/CVOs on behalf of the users.


    ### **2.3.2** **IoT@Work Capability-based Access Control System (IoT@Work Contribution)**


    The IoT envisages new security challenges, including in the area of access control
    that can hardly be met by existing security solutions. Indeed, IoT is a more demanding
    environment in terms of scalability and manageability due both to the potentially
    unbounded number of things (resources and subjects), the expected most relevant
    need to support the orchestration and integration of different services, the relevance
    of short-lived, often casual and/or spontaneous interaction patterns, the relevance
    of contexts, etc.


    In the following, we shortly provide a description of the capability-based access
    control (in the following, referred to as CapBAC) system developed within the
    EU FP7 IoT@Work project. The CapBAC is devised according to the capability-based
    authorization model in which a capability is a communicable, unforgeable token
    of authority. This token uniquely identifies the granted right(s), the object
    on which the right(s) can be exercised, and the subject that can exercise it/them.
    As depicted in [Figure 2.2](#Ch02.xhtml#fig2_2), a capability-based system reverses
    the traditional approach being now the user in charge of presenting his/her/its
    authorization token to the service provider, while in a traditional ACL or RBAC
    system, it is the service provider that has to check if the user is, directly
    or indirectly, authorized to perform the requested operation on the requested
    resource.


    ![Figure 2.2 ACL vs. capability-based authorization models.](Images/fig2_2.jpg)


    [**Figure** **2.2**](#Ch02.xhtml#bck_fig2_2) ACL vs. capability-based authorization
    models.


    The CapBAC system borrows ideas and approaches from previous works \[[4](#Ch02.xhtml#ref2_4)\]
    extending and adapting them to IoT requirements and, specifically, the ones envisaged
    by the IoT@Work project. The CapBAC provides the following additional features
    that constitute the essential innovation over previous capability-based techniques:


    1.  Delegation support: A subject can grant access rights to another subject,
    as well as grant the right to further delegate all or part of the granted rights.
    The delegation depth can be controlled at each stage.'
