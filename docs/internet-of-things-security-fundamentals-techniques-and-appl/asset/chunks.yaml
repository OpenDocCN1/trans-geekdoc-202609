  trans: '

    Cisco 已成为提供“in-network processing”解决方案的最大参与者，该解决方案为靠近设备的 IoT 数据处理和分析提供环境 [10,
    11]。Cisco 为这一计算范式赋予了一个引人入胜的术语——Fog Computing——仿佛云已经降临到地面（网络边缘）化为雾。处理是在边缘设备上进行的，例如交换机、路由器、机顶盒等，它们放置在局域网的边缘。因此，这一计算范式也被称为
    *边缘计算*。在网络内部，IoT 数据在 Fog/边缘节点收集、处理和存储，也称为 IoT 网关，Fog 通过它与 Cloud 交互。雾计算并非旨在取代云，而是对其进行补充。需要立即处理以实现即时响应或仅需短期存储的数据在雾中处理。如果
    IoT 数据需要更长时间存储以进行进一步处理，如分析和挖掘，则会转发到云服务器。根据数据类型和处理类型，雾计算采用不同的策略 [12]。雾计算通过在本地进行初步处理，过滤掉不必要的数据，仅让需要进一步处理或存储的数据通过，从而减轻网络过载。当大量连接设备（根据
    Cisco 的说法，到 2020 年可能达到 500 亿）连接到云时，这种方法具有深远影响。互连多个上下文相关的 Fog 节点为复杂且感知上下文的数据分析提供了全景机会。雾计算比云提供更好的隐私和可靠性。连接到云依赖于外部网络，该网络偶尔会中断。在这些不幸情况下，本地计算设施将成为关键任务
    IoT 应用的巨大前景。


    ### 3.4.4 移动边缘计算

    移动电话，尤其是智能手机，正在成为物联网不可或缺的一部分，既是数据和服务的来源也是汇聚点。今天的智能手机配备了众多传感器，使其成为数据生成的重要出口，同时还有社交网络数据。从终端用户角度来看，事件会通知到智能手机，同时用户也可以通过智能手机指示和控制“物”。如果物联网设备能够直接连接到移动网络（即避免经过云），移动用户的体验质量（QoE）将得到显著改善。考虑到这一点，最近，MEC（移动边缘计算^()


    ### 3.4.5 云计算微节点

    云计算微节点的概念源于移动计算和云计算的融合。由卡内基梅隆大学开发，Cloudlet 被设想为移动设备与云之间的中间层 [16]。其目标是通过将云计算服务更靠近边缘来大幅降低端到端延迟。Cloudlet
    是一个微型云数据中心，它在更靠近设备的设施上模拟云。理想情况下，Cloudlet 与移动设备相距一跳（Wi-Fi）。它允许对计算密集型移动应用实现即时响应。在架构上，Cloudlets
    具备多核 CPU 集群、RAM 和缓存形式的充足计算能力，并提供类似云的虚拟化以运行来自移动设备的计算任务。它们执行由资源受限的移动设备委派的资源密集型计算任务。安装在移动设备上的客户端应用程序会搜索最近可用的
    Cloudlet。可执行作业被卸载到 Cloudlet，在那里进行缓存、处理或聚合，结果被发送回设备或转发到云。Cloudlets 通常与云服务器很好地连接。它们不存储计算和结果，而只临时缓存（因此称为软状态），必要时将其传输到云。但如果附近找不到
    Cloudlet 会怎样？它会失败吗？不，也不是完全如此。应用程序将以从未存在 Cloudlet 的方式做出反应。要么作业仅在设备上执行，要么被路由到云。在后一种情况下，应用程序必须容忍预期的延迟。如前一节所述，配备众多传感器的智能移动设备使物联网无处不在，并成为物联网数据的重要来源。因此，Cloudlets
    正在成为处理这些庞大的近实时数据的真正潜力，话虽如此，Cloudlets 的潜力不必仅限于移动物联网应用。只要具备合适的接口和中间件，Cloudlets 也可以用于处理其他物联网设备的数据。


    ### 3.4.6 现场处理

    现场处理是一种通常部署在传感器设备上的技术，以便感知数据在传感器设备内部并由其自身处理。这与前面提到的其他方法形成对比，在那些方法中，数据源和处理单元是分离的。通常，传感器设备没有足够的计算资源；这就是为什么感知数据会被送到某个外部系统进行处理。在前几节中，我们已经看到了在实时或近实时数据处理方面可供选择的几种方案，前提是附近有所需的基础设施。但物联网的无处不在和普及使用可能使我们陷入这样的情况：附近既没有此类计算设施，也没有足够的带宽将数据发送到云服务器。让我们考虑两个独立的案例
    [15]:

    1. 商业喷气式飞机每飞行半小时产生 10 TB 数据，需要对其进行分析，以用于各种飞行相关操作，包括自动驾驶模式下的飞行。

    2. 海上油井每周产生 500 GB 数据，需要对其进行分析以监测管道和地震传感器。

    在第一种情况下，数据处理应在硬实时进行，而且通常飞机内部没有网络内处理设施。在第二种情况下，数据可以软实时处理，但在这种环境中，可用于数据传输的带宽非常有限。因此，将大量数据发送到远程位置进行处理是极其费力的。在这两种环境中，传感器设备必须具备
    *原位* 数据处理能力。这将节省大量能源并延长设备的使用寿命/运行周期。为了执行诸如数据聚合之类的任务，传感器设备可能会寻求其近邻的帮助。此外，如果大部分数据在本地处理，就不必将其传输到上层。在网络上传输的数据量将大大减少，这在通信设施不足的情况下变得至关重要。在那些物联网数据无需归档、集中处理或从多个来源合并的物联网应用中，现场数据处理也应是首选。


    ### 3.4.7 内存计算

    '
