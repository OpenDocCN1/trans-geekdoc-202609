    - Data are centralized with individuals and devices.

    - Service providers compete to connect trusted peers.

    - Marketplace improvement increases efficiency of sharing resources and determines
    fairer rate of exchange.


    ### 5.2.4 Bitcoin and Blockchain

    The world of Internet uses electronic payment system and the money flows in the
    form of digital asset or crypto currency, known as a `Bitcoin` [[1](#Ch05.xhtml#ref5_1)].
    The system of `Bitcoin` is self-organized in the form of a transaction bill. The
    miners in the `Blockchain` collect only those transactions which are valid. These
    valid transactions are identified by a private/public key pair, designed using
    the hash algorithm.


    The concept of `BitCoin` is mostly derived from the most promising feature of
    `Blockchain`, which is decentralization of verification of transactions along
    with suitable cryptographic procedures. The common peer-to-peer `BitCoin` system
    works on the shared `Blockchain` ledger. `BitCoin` uses digital signatures for
    maintaining the security and the `Blockchain` model facilitates the fully secured
    digital transactions.


    ### 5.2.5 Transaction Fees

    Payment of transaction fees is optional to transactions. Miners handle the tasks
    of prioritizing transactions to process them according to those transactions that
    pay a higher fee. The fee is decided by the storage space required by the generating
    transactions and depends on the number of inputs that are required to create a
    transaction. The higher priority is given to those transactions that have pending
    inputs.


    ### 5.2.6 Security Aspects of Blockchain

    The discussion in this text revolves around the “public” `Blockchain`, in which
    a ledger can be viewed as the virtual book to store all previous transactions.
    To handle the disorganization of continuously generating valid transaction blocks,
    `Blockchain` needs a protocol to achieve consistency of these blocks. There is
    a “miner” network node in the `Blockchain` network, whose role is to validate
    the new transactions. A new transaction is first validated by the miner before
    being added to the chain, and is then broadcasted to the entire `IoT` network.
    `Blockchain` applies a specific key to the block which contains valid transactions
    and then stores them into the distributed ledger. Validating a new transaction
    means verifying the entire ledger.


    The miners are required to complete a proof of work (`PoW`) over all data blocks.
    This `PoW` is a `hashcash` function and it acts as a vote in the `Blockchain`
    to validate transaction log of `Blockchain`. This `PoW` makes it tougher for the
    nodes of the `IoT` network to predict which a computer generates the next block.
    Rather the `Blockchain` keeps on updating and every node can view the ledger.


    ## 5.3 Evaluating Blockchain

    The present-day `IoT` solutions are expensive because of the high infrastructure
    and maintenance cost associated with centralized clouds, large server farms, and
    networking equipment. The communication cost is handled according to the pace
    of growth of `IoT` devices.


    The issues identified in centralized approach are solved by the distributed ledger
    approach in decentralized mechanism of `Blockchain` [[3](#Ch05.xhtml#ref5_3)].
    It adopts a uniform peer-to-peer communication model to execute billions of transactions.
    It also offers the advantage of reduced costs of installing and maintaining data
    centers by distributing computation and storage needs across all devices of the
    `IoT` network, thus preventing the entire network to collapse even if a single
    node goes down.


    Establishing a peer-to-peer communication model also presents a few challenges,
    but it has emerged out to be a suitable solution to maintain secured data transactions
    in huge `IoT` networks. The valid transactions prevent theft and spoofing.


    ## 5.4 Blockchain in Business

    1. Banking industry is relying on the `Blockchain` model because of its potential
    of maintaining secured transactions. It provides increased transparency and reduces
    the costs per transaction by eliminating the presence of any intermediate third
    party and due to its nature of the distributed and shared database. The ledger
    being distributed in nature records transactions with enhanced trust levels among
    communicating parties [[4](#Ch05.xhtml#ref5_4)]. Since `Blockchain` verifies each
    and every transaction flowing through the `IoT` network, it does not allow the
    communicating members to manipulate the transactions, and thus improves security.


    `Blockchain` designates the task of approving transactions to all the members
    of the network and restricts a single entity to hold the power of controlling
    the entire system. `ICICI` bank in India adopted this security model for ensuring
    secured bank transactions.


    2. IBM used a concept termed “`ADEPT`,” a system developed in collaboration with
    Samsung uses `Blockchain` technology. IBM “`ADEPT`” uses the element of `Bitcoin`
    underlying design to build a distributed network of devices – a decentralized
    `IoT`. This concept of `ADEPT` (Autonomous Decentralized Peer-to-Peer Telemetry)
    taps `Blockchains` to provide the backbone of the system, utilizing a mix of `proof-of-work`
    and `proof-of-stake` to secure transactions. Using the `ADEPT` system, Samsung
    Washing machine `W9000` uses `smart contracts` to order detergent supplies by
    automatic payment and keeps track of its shipment and deliveries. All this information
    is also shared by the system to the owner.


    3. `CISCO JASPER`: Jasper, now part of Cisco, offers a cloud-based software platform
    for the Internet of Things (`IoT`) and, more explicitly, to enable product businesses
    to become `IoT` service businesses. It integrates the `Blockchain` technology
    in its business processes.


    `CISCO JASPER` helps enterprises to enhance their impact on supply chains by using
    an `IoT` framework to launch, manage, and monetize the enterprise services. It
    offers an effective increase in efficiency by a predictive maintenance for performance
    analytics, and real-time maintenance through the Control Center, thus resulting
    in better revenues and better customer experiences.


    ## 5.5 Benefits of Blockchain

    The `Blockchain` can bridge the missing link to address the issues of privacy,
    security, and reliability of Internet of Things industry. `Blockchain` could be
    used to track billions of network devices and enable the processing of transactions
    and coordination between devices, thus leading to significant savings to the `IoT`-based
    manufacturing industry. The major advantages of `Blockchain` can be summarized
    as:


    1. **Public in nature:** Every participating node can view the blocks and also
    the transactions stored in them. The actual content of transactions is encrypted.


    2. **Secure:** `Blockchain` uses a ledger which cannot be tampered and cannot
    be modified by the intruders since the blocks do not exist at the central location.
    There is no single thread of communication that could be deciphered, hence making
    the man-in the middle attack difficult to occur [[2](#Ch05.xhtml#ref5_2)]. The
    algorithms that have been implemented prevent cryptographic attacks and accelerate
    the growth of business by building trust between communicating parties.


    3. **Decentralized:** The right to approve transactions is not held by a single
    authority. And thus the servers have autonomous capabilities. The decentralized
    and autonomous capabilities of the `Blockchain` make it an ideal component to
    become a foundational element of `IoT` solutions. There is a single public ledger,
    and hence the costs and storage demand reduce compared to multiple ledgers.


    4. **Transparency and immutability:** Although any changes in the distributed
    ledger can be viewed by all the nodes present in the `IoT` network (transparency),
    none of them can be deleted by any of the nodes (immutability).


    5. **High-quality data and longevity:** The data output by the `Blockchain` is
    accurate, consistent, and available to all participating nodes. This strengthens
    the data against failure and malicious attacks.

