- raw: 'After the evaluation of climatic and geographic conditions, the green IoT
    aims to launch the set of activities that would yield better crop production and
    would enhance the sustainability of farming lands. Not only this, it also launches
    activities to reduce deforestation and to increase the greener land areas. Certain
    models of Green IoT use the ZigBee sensor network, for tracking temperature, humidity,
    and soil control levels. Their threshold levels are stored in the cloud. When
    the sensor parameters rise above or fall below the threshold, the network raises
    an alarm. The humidity sensor of a greenhouse generates an alarm upon any change
    in the humidity level.


    ## **1.9** **Video Streaming and Data Security from Cameras**


    The pace with which video data get generated is much faster than that of other
    data. The surveillance and security cameras constantly generate video data. The
    video data hold a high asset value for business.


    The complex element of management of video data is its unstructured form. The
    structured video data are easily manageable. Companies and business processes
    focus on using Video Management Software (VMS) to search these big data for analytical
    processing of statistics. This processing is based on times, locations, people,
    and certain keywords. A constraint should be kept in mind regarding loss in the
    prevention of critical information, during the processing of marketing, operations,
    and customer service.


    Cameras are a useful tool for majority of business applications and in most of
    the use cases. The wide dynamic range (WDR) property of cameras provides greater
    details to analytics for deciphering information. With a HD and HDTV camera, the
    resolution increases to a better range. However, higher resolutions increase storage
    consumption, and thus require video compression algorithms. The security levels
    or range of a network camera is analyzed and optimized in real time. The cameras
    are used to continuously store the information. Certain data in this information
    might be unimportant and not so useful. The data are filtered according to the
    purpose. The filtration is done by analytics. Analytics technology is the brain
    of interconnected IoT devices.


    The role of analytics is to evaluate security aspects of video data. It offers
    the power of security from passive monitoring to intelligent analysis systems.
    The data obtained can be optimized for the management of daily life activities
    and for traffic analysis. The benefits of secured video streaming are utilized
    for remote access and third party integration and to implement security policies
    in design and implementation of the IoT network video system. Therefore, the current
    smart camera suppliers are equipped with advanced features, bug fixes, and security
    patches.


    ## **1.10** **IoT Security Activities**


    ### **1.10.1** **Device Manipulation**


    A device manipulation attack threatens the configuration, control, authenticity,
    and monitoring of IoT devices. Certain devices need timely updation. The update
    time of a device is prone to cause device failures or might also increase the
    system downtime. Thus, it is essential that the devices be reconfigured and updated
    in such a way that the revenue of the IoT network does not get affected.


    Device manipulation looks after the secured establishment of the device identity
    in such a way that the device can be trusted. Thus, the goal of device manipulation
    is to monitor:


    *   Authentication


    *   Service provisioning


    *   Configuration and version control


    *   Maintenance of software updates.


    ### **1.10.2** **Risk Management**


    Risk is a dynamic issue which concerns not only the vulnerabilities but also the
    impact of a threat on economy, privacy, and growth of the network. The risk assessment
    and a pre-planned strategy for risk avoidance are important, so that the legal
    compliances of companies, their business processes, standards, and infrastructure
    do not get shattered upon an unexpected external event.


    #### **1.10.2.1** **Elements under risk management**


    The factors studied under risk management are:


    1.  Vulnerability: It is an application, a service, a configuration, or a hardware
    device of an IoT which can be exploited by an attacker, and is threat prone. Lack
    of computing power, inefficient encryption algorithms, etc., are vulnerabilities
    of a system.


    2.  Intent: Attackers conduct attacks to attain social, financial, or political
    benefits. The impact of the attack is as per their desires. The intent reflects
    the terror-oriented and malicious motives of the attacker.


    3.  Consequences: It is a tradeoff between the level of exploitation an attack
    can cause and the ability of a system to cope up with its impact. Certain attacks
    are intended for a prank but certain can cause huge economical harm as well as
    may lead to loss of lives.


    #### **1.10.2.2** **Steps for risk management**


    Authentication and encryption mechanisms are used for risk management. Weak authentication
    opens the door to the outside world for attacks on the network. It is easy to
    obtain the login credentials and to masquerade the false identity. Inefficient
    encryption algorithms can be breached, and thus it is needed that encryption algorithms
    are strong enough to be computationally infeasible to be hacked.


    #### **1.10.2.3** **Loopholes of current risk management techniques**


    1.  In the world of cyber security, weak authentication is still a major problem
    that persists.


    2.  Passwords can be hacked and cracked in seconds.


    3.  Additional computing resources and memory are required for the implementation
    of strong encryption algorithms.


    4.  Key management is a difficult and complex task.


    #### **1.10.2.4** **IoT risk management for data and privacy**


    The amount of data increases exponentially with IoT, and thus it raises the space
    requirements for transferring and storing these data. Data protection is although
    a burden task, but it is essential for business policies and decisions. The Iota
    network when scaled up has a higher degree of risks. Iota risk management for
    data concerns for segregating the individual and aggregate data, the important
    and unimportant data.


    Iota risk management helps to determine the unacceptable risk conditions and their
    intensity of impact on safety and privacy of IoT network users.


    ## **1.11** **Machine Learning in IoT**


    Machine Learning is the key to almost all the recent technologies developing nowadays.
    It is basically based on the concept of making use of all data that are collected
    by the machine for analysis. This data source ranges from entirely raw data to
    more processed information and also varies in size ranging till multiple terabytes.
    However, the implementation of such an advanced machine learning system specifically
    for IoT Security is not an easy task. It requires an amalgamation of fast processors,
    efficient classification algorithms, and most importantly effective decision making
    process based on the statistics. There is a phenomenal growth in IoT deployments
    around the globe, which is attracting the focus on IoT Security, exactly as the
    Cyber Security was followed by the growth of Internet in last few decades. Most
    of the technologists, researchers, and practitioners believe that securing IoT
    systems would be the prime most concern in coming years, which is to be dealt
    intelligently through machine learning approaches.'
