- raw: 'In-memory Computing (IMC) is quite a different computing archetype in essence
    than of those discussed prior. The concept of IMC is not new at all but it was
    not explored extensively until recently. In traditional computing, data are brought
    to the computational unit which is a time-consuming and resource-intensive process
    \[[17](#Ch03.xhtml#ref3_17)\]. The traditional way of data processing is to first
    store the data on the hard disk and then transfer a part of it to the primary
    memory (RAM) from where processor would fetch it (probably via cache) for processing.
    After completion, the processed data are sent back to the hard disk and the subsequent
    part is loaded into the RAM and the cycle continues until the entire chunk of
    the data on the disk that is to be processed is completed. The major bottleneck
    in this process is the data transferring delay (a) from disk to RAM and vice versa
    and (b) from CPU to RAM and vice versa. So, it is obvious that that total processing
    time will increase commensurate with the data in the disk to be processed. That
    is why disk-based technologies are seemed to be impotent in sustaining the exigencies
    of real-time IoT data deluge. IMC tries to curb the latency by transposing the
    traditional computing principle. It aims to bring the processing unit where the
    data are in the RAM, usually bypassing the disk. It is realized by placing the
    processor and RAM very close to each other, favorably on the same chip. By this
    tactic, data movement will be minimized which results in reduced memory latency.
    Also, the lack of data movement keeps the system bus free and always available.
    All these gains ensure a significantly bettered processing speed. This is the
    reason why IMC has been considered as the most appropriate solution for real-time
    IoT data processing. IMC should be ideal, especially, to generate live events
    out of streaming data.


    To analyze the streaming data, we require on-the-fly processing systems those
    can process real-time data without storing them on the disk. In fact, IMC is probably
    the only means to deal with the in-flight data efficiently \[17\]. DRAMs (dynamic
    RAM) are sufficiently faster than data stream sources to handle the data in the
    flow. If a sufficient number of DRAMs are employed and utilized pertinently, astonishing
    speed performance can be achieved. The larger the RAM size, the faster the processing.
    A cluster of these high-speed DRAMs will be capable of providing us with a super
    fast high-performance computing amenity. With memory cost dipping 30% per year
    \[[18](#Ch03.xhtml#ref3_18)\], the performance–cost ratio of DRAM has dramatically
    increased. This has aided organizations to attain lower TCO (total cost of ownership)
    for data processing systems with a consummate performance experience. The utilization
    of high-performance in-memory computing is not merely limited to streaming data
    processing but it can be leveraged to apply real-time analytics to operational
    datasets as well \[18\]. At the rate the organizations are flooded with data from
    different sources including IoT, much of the insights may remain unearthed if
    the processing capability is not at par. IMC enables businesses and organizations
    to discover patterns and solutions in near real time and in timely decision making.
    By identifying and analyzing customer preferences and behaviors in near real time,
    businesses can dish upwell-timed service providing improved QoS, thus enriching
    customers’ QoE. Adopting IMC, the possibilities organizations can draw from its
    data are endless and can attain business benefits that were infeasible before
    \[17\]. Most of the IT giants like Oracle, Microsoft, SAP, IBM, Tableau Software,
    Tibco Software, etc., are offering Big Data solutions, especially Big Data analytics
    tools based on IMC platform \[[19](#Ch03.xhtml#ref3_19)\]. Organizations can build
    in-house in-memory data computing with the help of Amazon Spark that offers open
    source platform for in-memory data processing. GridGain provides an in-memory
    processing platform that works for both data grid and computing grid \[[20](#Ch03.xhtml#ref3_20)\].


    We assume that by now few questions might be knocking on your judicious mind.
    First is very obvious that DRAM being a volatile memory how does it pledge to
    not losing data? The simple resolution is to keep backups and sync them continually.
    An alternative option is to use non-volatile RAMs. Second, can’t we apply the
    same logic to have in-cache computing? After all, the cache is at least three
    times faster than DRAM, so we could have even faster processing. Theoretically,
    that would be a wonderful option but the physical limitation of cache is the main
    obstructive factor why in-cache computing is not feasible, at least for the current
    computer architecture \[20\]. And since that is not going to change in foreseeable
    future, IMC will continue to be a great prospect for real-time data processing
    and analysis in coming years.


    ## **3.5** **Security and Privacy Issues Involved in Each Archetype**


    **Grid computing:** Since in grid computing, the IoT data remain within the organization
    and behind the firewall, there is a minimal concern for security and privacy.
    Intrusion detection techniques can be applied to any probable external threat.
    Also, there is the least possibility of being affected by a DoS (denial-of-service)
    attack. But if the grid is made of inter-organizational and inter-administrative
    domains, the security and privacy may be compromised.


    **Cloud computing:** Cloud is a public service; hence, the security and privacy
    concerns are always there. There is every possibility of a security breach for
    on-transmission data. Privacy is not guaranteed since data are located on a foreign
    server. One noteworthy problem in Cloud known as account hijacking is that fraudulent
    people access the services that are billed to other’s account by hijacking one’s
    account \[[21](#Ch03.xhtml#ref3_21)\]. This can be really damaging to organizations
    as it can hamper their integrity and reputation. The organization may incur a
    significant loss if confidential data are leaked or forged. In another form of
    attack called service traffic hijacking, an attacker eavesdrops on the users’
    activities and transactions if they get access to users’ credentials. They can
    manipulate or divert the processable data to undesirable locations. Another more
    common form of assault that the Cloud has to deal with more often is the DoS attack
    where Cloud services are denied to the legitimate users. Hence, processing IoT
    data will not be a good idea with respect of security unless strong security measures
    are adopted at the Cloud end.


    **Fog computing:** In Fog, the preliminary processing is done within the network.
    Hence, it is supposed to be more secure than Cloud. When the pre-processed data
    are sent to the Cloud for storing and further processing and analyzing, it is
    exposed to the threat. But Fog devices which are at the edge of the home network
    and connect to the public network are vulnerable. Attackers may target these devices
    to inject malicious code into the system. They can introduce man-in-the-middle
    attack by replacing (virtually) genuine Fog device by the forged ones \[[22](#Ch03.xhtml#ref3_22)\].
    So, it is essential to protect these gateway devices in the Fog.


    **Mobile-edge computing:** MEC servers are not really in-house properties. If
    these servers are forfeited, data security is also be conceded. Also, in MEC,
    mobile networks are used for data communication which is not hard to intercept.
    That is a concern for data privacy.


    **Cloudlet:** The security and privacy aspects of Cloudlets are very much similar
    to Fog. Unless the Cloudlets and the gateway devices in the Cloudlets are not
    breached, the IoT data should be secure. But like Fog, the data might be unprotected
    when they are transported to the central Cloud.'
