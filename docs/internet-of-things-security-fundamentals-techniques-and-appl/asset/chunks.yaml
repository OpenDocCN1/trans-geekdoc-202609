- raw: 'The software and cloud components are also available for attackers as the
    entry point for the IoT system. Therefore, in order to secure the system from
    an attack, it must be well understood. The *Firmware* of the device is an important
    tool for the attacker to enter into the IoT system. An attacker may be able to
    find valuable information, user ID and password of the network, in the firmware
    using hex editor or other tools. The insecure update of firmware can also lead
    to security issues. Since the firmware is present on the IoT sensor device, the
    attacker can damage the device and thus prevent any data from being submitted
    to the server or facilitate wrong data to be submitted to the server, which can
    lead to no information or error prone information displayed to user. This must
    be protected using cryptography.


    *Web Application Dashboard* is also an important area of concern. The dashboard
    of the IoT application is the control unit of the overall IoT system. If somehow
    an attacker gains control to the dashboard, much harm can be made to the whole
    system. This kind of attack must be protected with the strong password encryption
    technique and secure session management. *Mobile Interface* provided by most IoT
    applications to its users to give users an easy way to access the system using
    their smartphones is also an entry point to the attacker if it is not protected
    with some strong security techniques.


    ### **4.6.3** **Radio Communication**


    Since the IoT sensor devices mostly rely on radio communication such as Wi-Fi,
    BLE, Cellular, Zigbee, ZWave, and 6LoWPAN. The insecure radio communication also
    allows an attacker to gain access to the system. Many attacks such as denial of
    service (DoS), password-based attacks, wireless phishing, man-in-the-middle attack,
    compromised-key attack, sniffer attack, wireless intruders, rogue APs, endpoint
    attacks, and evil twin APs can be carried against the radio communication. Thus,
    it must be protected using cryptography and firewalls.


    ## **4.7** **Security Features**


    There are various protocols used in IoT at each of the discussed layers (Figure
    4.3). Each layer performs a specific task using these protocols. There are some
    security features which are already built in to some of these protocols which
    are discussed in this section.


    ### **4.7.1** **TLS/SSL**


    Transport layer security (TLS) and its predecessor, secure sockets’ layer (SSL),
    are collectively known as SSL. These are the cryptographic protocols that offer
    communication security over a computer network. Many versions of the protocols
    are used in applications such as web browsing, email application, Internet faxing,
    instant messaging, and voice-over-IP (VoIP). Websites use TLS to secure all communications
    between servers and web browsers. The transport layer security protocol provides
    data integrity and privacy between two computer applications that communicate
    with other. The communication of client–server which is secured by TLS has one
    or more of the properties such as connection which is private or secure because
    symmetric cryptography is used to encrypt the transmitted data. The server and
    client agree upon the details of the encryption algorithm and cryptographic keys
    that are used before the first byte of data is transmitted. This negotiation of
    a shared secret is secure and reliable. The identity of the client–server that
    communicates with each other is authenticated using public-key cryptography. The
    connection ensures integrity because each message transmitted undergoes message
    integrity check using a message authentication code to prevent undetected loss
    or modification of the data during transmission \[[13](#Ch04.xhtml#ref4_13)\].
    There is a need to relate to the IoT case. How is the TLS used in IoT? Which server
    (cloud?) and which client (e.g., which device)? Credit card info on the web is
    using TLS, then is there anything IoT that requires TLS?


    TLS has an important role in IoT. The MQTT protocol, discussed in next section,
    is often implemented to operate over TLS. The MQTT broker can be configured for
    certificate-based authentication of the MQTT client. Using it, the MQTT broker
    maps the information in the MQTT client X.509 certificate to determine the topics
    to which the client has permission to subscribe or publish. The real-world example
    is IBM Watson IoT platform’s MQTT API that encrypted communications on ports 8883
    or 443. The platform requires TLS. The registration of devices on the platform
    requires the use of the TLS connection, as the MQTT password is transmitted back
    to the client which is protected by the TLS tunnel \[5\].


    ### **4.7.2** **MQTT (Message Queuing Telemetry Transport)**


    MQTT protocol is a publish/subscribe messaging protocol designed for M2M communication
    often known as IoT protocol. MQTT protocol consists of an MQTT client, which can
    be any microcontroller device that has an MQTT library running on it and an MQTT
    broker to which the client connects over the network. The MQTT client can be a
    publisher or subscriber or both. The MQTT broker is the heart of publish/subscribe
    activity and can handle up to thousands of concurrently connected MQTT clients
    and is primarily responsible for receiving messages, filtering them, and then
    sending the message to all subscribed clients. The MQTT broker provides one or
    more topics that allow an MQTT client to publish/subscribe a message to a related
    topic. The topic is generally a small token that may store valuable information.
    MQTT security has three fundamental concepts, identity, authentication, and authorization.
    Identity is about providing identification for being authorized and given authority.
    Authentication is about proving the identity and authorization is about managing
    the identity. Identity – Identify an MQTT client by its client identifier, user
    ID, or public digital certificate. One or other of these attributes defines the
    client identity. The MQTT server authenticates the certificate sent by the client
    using the SSL protocol, with a password set by the client. Using this server can
    control the resources which the client can access based on the identity of the
    client. The MQTT server identifies itself to the client with its IP address and
    digital certificate. The MQTT client uses the SSL protocol to validate the certificate
    sent by the MQTT server.


    *Authentication* is done by both the MQTT server and client. A client authenticates
    a server with the SSL protocol. An MQTT server authenticates a client with the
    SSL protocol, or with a password, or both. If the client authenticates the server,
    but the server does not authenticate the client, then the client is known as an
    anonymous client. It may be possible to establish an anonymous client connection
    over SSL, and after that, it authenticates the client with a password which is
    encrypted by the SSL session. The client can be authenticated with a password
    rather than a client certificate, because of the certificate distribution and
    management problem. The MQTT client server communication is safe and secure as
    it happens in the following steps.


    *   The MQTT client authenticates the server to make sure that it is con nected
    to the right server. It does it by the server certificate with the SSL protocol.


    *   The MQTT server verifies that it is connected to the correct client. It does
    by authenticating the client certificate with the SSL protocol, or by authenticating
    the client identity with a password.


    *Authorization* is not part of the MQTT protocol but it is provided by MQTT servers.
    Authorization depends on the server in what the server does. MQTT servers are
    publish/subscribe brokers. The MQTT authorization rules on the server control
    the clients that can connect to the server and topics which a client can be publish
    or subscribe \[[14](#Ch04.xhtml#ref4_14)\].


    ### **4.7.3** **DTLS (Datagram Transport Layer Security)**'
