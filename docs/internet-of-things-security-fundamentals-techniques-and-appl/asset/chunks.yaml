    # Glossary


    ## Numbers

    `51% Attack`:

    When more than half of the computing power of a cryptocurrency network is controlled
    by a single entity or group, this entity or group may issue conflicting transactions
    to harm the network, should they have the malicious intent to do so.


    ## A

    `Address`:

    Addresses (Cryptocurrency addresses) are used to receive and send transactions
    on the network. An address is a string of alphanumeric characters, but can also
    be represented as a scannable QR code.

    `Agreement Ledger`:

    An agreement ledger is distributed ledger used by two or more parties to negotiate
    and reach agreement.

    `Attestation Ledger`:

    A distributed ledger provides a durable record of agreements, commitments, or
    statements, providing evidence (attestation) that these agreements, commitments,
    or statements were made.

    `ASIC`:

    ASIC is an acronym for “Application Specific Integrated Circuit.” ASICs are silicon
    chips specifically designed to do a single task. In the case of bitcoin, they
    are designed to process SHA-256 hashing problems to mine new bitcoins.


    ## B

    `Bitcoin (Uppercase)`:

    It is the well-known cryptocurrency, based on the proof-of-work blockchain.

    `bitcoin (Lowercase)`:

    It is the specific collection of technologies used by Bitcoin’s ledger, a particular
    solution. Note that the currency is itself one of these technologies, as it provides
    the miners with the incentive to mine.

    `Blockchain`:

    A blockchain is a type of distributed ledger, composed of unchangeable, digitally
    recorded data in packages called blocks (rather like collating them on to a single
    sheet of paper). Each block is then “chained” to the next block, using a cryptographic
    signature. This allows block chains to be used like a ledger, which can be shared
    and accessed by anyone with the appropriate permissions.

    `Block Height`:

    Block height refers to the number of blocks connected together in the block chain.
    For example, Height 0, would be the very first block, which is also called the
    Genesis Block.

    `Block Reward`:

    It is the reward given to a miner which has successfully hashed a transaction
    block. Block rewards can be a mixture of coins and transaction fees, depending
    on the policy used by the cryptocurrency in question, and whether all of the coins
    have already been successfully mined. The current block reward for the Bitcoin
    network is 25 bitcoins for each block.


    ## C

    `Confirmation`:

    It is the successful act of hashing a transaction and adding it to the blockchain.

    `Consensus`:

    Consensus is achieved when all participants of the network agree on the validity
    of the transactions, ensuring that the ledgers are exact copies of each other.

    `Cryptocurrency`:

    Also known as tokens, cryptocurrencies are representations of digital assets.

    `Cryptographic Hash Function`:

    Cryptographic hashes produce a fixed-size and unique hash value from variable-size
    transaction input. The SHA-256 computational algorithm is an example of a cryptographic
    hash.


    ## D

    `Dapp`:

    A decentralized application (Dapp) is an application that is open source, operates
    autonomously, has its data stored on a blockchain, incentivized in the form of
    cryptographic tokens, and operates on a protocol that shows proof of value.

    `DAO`:

    Decentralized autonomous organizations can be thought of as corporations that
    run without any human intervention and surrender all forms of control to an incorruptible
    set of business rules.

    `Distributed Ledger`:

    Distributed ledgers are ledgers in which data are stored across a network of decentralized
    nodes. A distributed ledger does not have to have its own currency and may be
    permissioned and private.

    `Distributed Network`:

    It is a type of network where processing power and data are spread over the nodes
    rather than having a centralized data center.

    `Difficulty`:

    This refers to how easily a data block of transaction information can be mined
    successfully.

    `Digital Signature`:

    It is a digital code generated by public key encryption that is attached to an
    electronically transmitted document to verify its contents and the sender’s identity.

    `Double Spending`:

    Double spending occurs when a sum of money is spent more than once.


    ## E

    `Ethereum`

