  trans: '

    在信息安全中，数据分类取决于其敏感程度。它还取决于影响程度，即数据在未经授权的情况下被披露、更改或销毁。适当用于保护数据的主要安全控制措施是通过数据分类来确定的。所有数据都应被归类为三个敏感级别之一，例如
    `Restricted Data` 被称为受限数据，当未经授权披露、更改或销毁该数据可能导致相当大的风险时。受限数据的示例是国防组织的数据。应将最高级别的安全控制措施应用于受限数据。`Private
    Data` 可被归类为私有，当未经授权披露、更改或销毁该数据可能导致中等程度的风险时。默认情况下，所有未明确归类为受限或公共数据的数据均可视为私有数据。必须对私有数据应用合理级别的安全控制措施。`Public
    Data` 可被归类为公开，当未经授权披露、更改或销毁该数据可能导致很少或没有风险时。公共数据的示例包括新闻稿、课程信息和研究出版物、天气信息、铁路/航班信息等。保护公共数据保密可能不需要或只需要很少的控制措施。需要控制级别来防止未经授权的修改或销毁。控制级别包括身份验证、授权和数据完整性。`Authentication`
    是保护数据的方式。身份验证是一个过程，其中用户提供的凭据与授权用户数据库中可用的凭据进行比较。身份验证在智能家居等物联网应用中很重要。只有经过身份验证的用户才可能访问智能家居系统。`Authorization`
    是提供与信息安全相关的数据和资源访问权限的过程。它还用于指定特定物联网系统中的访问控制。为了指定谁有权访问系统，许多物联网应用都需要授权。例如智能电网系统，该系统要求只有授权用户才能访问系统。`Data
    integrity` 是维护和保证数据的准确性和一致性。数据完整性适用于数据的整个生命周期。对于存储、处理或检索数据的任何物联网系统的设计、实现和使用而言，这是一个关键方面。由于数据是物联网系统中采取行动和做出决策的基础，因此数据完整性在此上下文中发挥着重要作用。


    身份验证和数据完整性可以通过使用数字签名来实现，如第 2.2.4 节所述。授权也可以通过此类数字签名实现，因为只有持有有效签名的人才会被授予在物联网基础设施中的特定物联网设备上的访问权。


    `MQTT` 协议也可以用于实现授权。`MQTT`，发布/订阅协议，允许客户端写入和读取主题。在此过程中，所有 `MQTT` 客户端都没有权限写入主题；同样，所有客户端也没有读取权限。可以使用
    `MQTT` 代理进行控制，通过为主题保留访问控制列表来限制此类权限给 `MQTT` 客户端。`MQTT` 代理可以使用客户端 ID 或其他任何技术对 `MQTT`
    客户端进行授权，并通过主题查找授予对主题的访问权限，以确定 `MQTT` 客户端是否被授权读取、写入或订阅主题。


    ## 4.6 IoT 中的攻击面


    物联网中的攻击面是攻击者进入物联网系统窃取信息甚至控制系统的入口。因此，为了使物联网系统安全，必须识别、保护并限制这些面免受恶意和未经授权的访问 \[10\]。


    ### 4.6.1 接口


    嵌入式设备具有许多能够交换信息的电路。这些信息是使用对通用协议的约定进行交换的，该协议可分为两组：串行和并行。串行和并行是允许多位数据交换并需要大量引脚的接口，而在串行接口中，一次传输一位数据，这比并行慢，但具有需要较少引脚的优势。使用串行通信的一些流行协议示例有通用串行总线
    (`USB`)、以太网、UART、SPI 和 I2C。任何物联网设备中的串行接口对攻击者来说相当有用，因为它为攻击者提供了进入系统并与设备交互的入口，即使设备看起来完全被锁定。可用的接口各不相同，可能因设备而异。


    物联网设备接口上的调试测试引脚是对攻击者来说最有效的物理硬件攻击向量。最知名的接口是 `UART`（通用异步收发器），它通常被称为串行接口协议，允许在无需外部时钟的情况下传输数据，因此称为异步。UART
    在并行和串行接口之间充当中介。它特别适用于嗅探调试和启动消息和日志、获取 shell 访问等。在现实世界的物联网设备中，UART 允许直接获得未经身份验证的
    root 访问权限，这反过来又允许攻击者进入系统。`SPI`（串行外设接口）与 UART 不同，是一种同步串行通信接口。它需要时钟来促进通信。它可用于从设备转储固件。SPI
    工作在主-从架构上。在此架构中，一个设备发送数据，另一个设备接收数据。SPI 上的引脚命名为 MISO（master out slave in）和 MOSI（master
    out slave in）。`I2C`（集成电路间）也工作在主-从架构上，允许多个从芯片与一个主芯片通信。其用法与 SPI 非常相似 \[11\]。`JTAG`
    是一个硬件访问点，允许一个或多个设备通过外部引脚连接以用于调试目的。JTAG 用于两个主要目的，首先称为边界扫描，其次称为调试访问。边界扫描是一种简单的调试形式，可确保所有设备正确连接。调试访问提供了一种与智能设备通信并捕获其原始实时计算的方法。这非常强大，因为它允许访问寄存器、内存内容、中断以及暂停和重定向指令流的能力。当物联网设备上存储有某些秘密时，此技术可使用调试访问实际读取内存内容并将该秘密从内存芯片中提取出来。一些
    CPU 内置了 JTAG 接口，而一些则没有。许多板卡设计师通过易于访问的引脚公开这些 CPU 功能以用于调试目的 \[12\]。


    ### 4.6.2 软件和云组件

