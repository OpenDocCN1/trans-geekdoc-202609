    \ communicated to them. The consent acknowledgment form must remind the participants\
    \ of their possibility to refuse or withdraw without any negative impact for them.\n\
    \n4.  finally both a feedback collection and a specific complaint process have\
    \ been designed to offer the possibility to the participants to raise any issue\
