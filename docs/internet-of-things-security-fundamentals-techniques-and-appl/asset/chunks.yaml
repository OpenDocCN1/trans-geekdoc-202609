    ## 6.4 Experimental Analysis of Parametric Cryptosystem


    For the extended parametric AVK model (with key variation by changing parameters),
    the objective of the cryptosystem designer is to make it as difficult as possible
    for a hacker to make informed guesses about the chosen parameters or keys. Thus,
    there is no alternative but a brute-force search, trying every possible combination
    of letters, numbers, and punctuation. A search of this sort, even conducted on
    a machine that could try one million keys per second (most machines can try less
    than 100 per second), requires, on an average, over 100 years to complete. The
    ease of method is also essential that is possible only when the parameters are
    taken from the neighborhood of the user. With this as a goal, and using the information
    in the preceding text, a survey of patterns used for key formation has been discussed
    in subsequent sections. It is better to reconsider the features of AVK model before
    going to the next section.


    ### 6.4.1 Features of Automatic Variable Key


    1. Fix the key with an optimum size and change the key from session to session.
    In the parametric AVK version, it can be achieved by varying the parameters.


    2. Additional level of security can be implemented by sharing only parameters
    on a public network, instead of exchanging keys.


    3. By changing parameters, the session keys (AVK) are generated. A new key is
    considered by changing some parameters in the previous key.


    `K[0]`←`Initial Key`


    `K[i+1]`←`K[i]`⊙{`p[i]`, `p[j]`, `p[k]` …}


    Where ⊙ represents concatenation or manipulation in some parameters `p[i]`, `p[j]`,
    `p[k]` → of key `K[i]` to construct `K[i+1]`


    In Fibo-Q approach, a key is varied with parameter = `n` along with computation
    of `f(n)`, `f(n-1)` and `f(n + 1)`. It uses any number of parameters between 1
    to `n` for the next key if `n` < 35. Otherwise choose random `n` with a mutual
    agreement by the sender and the receiver. In Sparse approach, a key is varied
    with location parameters `p[ij]` = location (`i`, `j`) (This approach is applicable
    for moving devices, where the next location coordinates will produce the next
    key).


    In general, for a cryptosystem `S`, if parameters are from a domain set


    `p` = {`p[1]`, `p[2]`, …,`p[n]`} and by choosing the number of parameters to a
    minimum 3 to maximum 7 keys can be constructed and shared among communicating
    parties. Since parameters are exchanged over a public network and may be found
    or recorded on the log, the security of the parameterized model can be tested
    with mining techniques. For testing of the parametric model using mining techniques,
    the following information has been collected from a public domain (e.g., a department
    of university). The broad view of responses has been highlighted as suggestions
    to the cryptic system designer for the parametric model.

