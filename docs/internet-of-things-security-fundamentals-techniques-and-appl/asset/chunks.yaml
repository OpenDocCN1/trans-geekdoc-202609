    \ used to predict the parameters and also the final key. The next section deals\
    \ with basic association rules and examples and presents mining and frequent patterns\
    \ discovery for the proposed parametric AVK model analysis.\n\n### **6.3.1** **Apriori\
    \ Approach for Parameter Prediction**\n\nConventionally, the association rule\
    \ *X → Y* indicates that if the key (antecedent) appears, then the parameter set\
    \ (consequent) *p*[*i*], *p*[*j*]*, …, p*[*k*] also tends (with highly probable)\
    \ to appear, where *X* and *Y* may be single parameters or set of parameters (in\
    \ which the same parameter does not appear in both sets) \\[[10](#Ch06.xhtml#ref6_10)\\\
    ]. In other words, *X* and *Y* would be found together frequently in the given\
    \ training set and they do not show a causal relationship \\[[11](#Ch06.xhtml#ref6_11)\\\
    ].\n\nFor example, the number of parameters in session [Table 6.1](#Ch06.xhtml#table6_1)\
