- raw: '*   *Sybil attack* is an attack in which the attacker uses sensor nodes or
    devices with multiple identities. This results in traffic which seems to have
    many sources. This attack corrupts resource usage, redundancy, or voting concepts
    originally present in the infrastructure.


    *   *Node replication:* In this attack, the attacker copies the identity of a
    sensor node and creates another virtual sensor node with the same identity in
    order to send false through random routes to disrupt the network.


    ### **4.4.3** **Transport Layer**


    The transport layer provides peer-to-peer and end-to-end connections between two
    processes on remote hosts. The transport layer takes data from the upper layer
    (i.e., application layer) and then divides it into smaller size of segments, then
    numbers each byte, and hands over to the lower layer (network layer) for delivery.
    This layer performs the following functions:


    *   It breaks the information data provided by the application layer into smaller
    units called segments. It numbers every byte in the segment and maintains their
    accounting.


    *   It ensures that data must be received in the same sequence as they were sent.


    *   It provides end-to-end delivery of data between hosts which do not belong
    to the same subnet.


    *   All server processes that communicate over the network are provided with Transport
    Service Access Points (TSAPs) also known as port numbers.


    The transport layer has two of the most important protocols in reference to IoT.
    *TCP (Transmission Control Protocol)* is the connection-oriented protocol. TCP
    enables two devices to establish a connection and exchange streams of data. TCP
    guarantees delivery of data and also guarantees that packets will be delivered
    in the same order in which they were sent. It helps avoiding network congestion
    and congestion collapse. It provides reliable, ordered, and error-checked delivery
    of a stream of data between applications running on hosts and communicating by
    an IP network. *UDP (User Datagram Protocol)* is the connectionless protocol.
    It is used for time-sensitive applications. It is a transaction-oriented and stateless
    protocol which does not guarantee packet delivery. It provides fast data transmission
    with a constant dataflow but does not provide reliability.


    This layer is also vulnerable to the following attacks related to IoT:


    *   *Session Hijacking* is also known as TCP session Hijacking. It is a way of
    taking control over user session by secretly obtaining user’s session ID and pretending
    to be the authorized user for accessing the data.


    *   *TCP Land Attack* is the attack in which the attacker sends an SYN packet
    to the host server which usually has an open TCP port.


    *   *UDP Flooding Attack* is the attack in which the attacker floods the server
    machine with countless requests; this makes the machine to think that the attacker,
    which pretends to be the authorized user, really needs service urgently and the
    server machine starts providing the services to the attacker; as a result, the
    users who actually need the service are often overlooked.


    *   *TCP and UDP Port Scanning* is a technique in which the attacker performs
    the port scanning of various tools of the host machine to find the open ports
    on the machine and after the ports are identified, it is used to attack the server.


    ### **4.4.4** **Application Layer**


    The application layer is the top layer where the actual communication is initiated
    and reflects. This layer does not serve any other layers but takes the help of
    transport and all layers below it to communicate or transfer its data to the remote
    host. This layer prepares communication between devices for data transmission
    over the network and initiates the data transfer. It receives data from the network
    and prepares it for use. The application layer consists of various protocols suitable
    for IoT devices. The protocols at this layer are *HTTP* (*Hyper Text Transfer
    Protocol*) which is the stateless protocol that follows the request–response model
    and uses URI (Universal Resource Identifiers). *Constrained Application Protocol
    (CoAP)* is a transfer protocol designed for use with constrained devices and constrained
    networks in the IoT. The protocol is designed for M2M applications such as smart
    energy and building automation. It runs over UDP instead of TCP and follows the
    request–response model. *WebSocket* is another computer communication protocol
    which provides full-duplex communication channels over a single TCP connection.
    It is based on TCP and it allows streams of messages to be sent back and forth
    between the client and the server.


    *Message Queuing Telemetry Transport* (MQTT) is a lightweight messaging protocol
    which is very useful in resource-constrained environment. This protocol simply
    distributes telemetry information over the network. It uses a publish/subscribe
    communication pattern, and is most widely used for M2M communication. It plays
    an important role in the IoT. *XMPP* (*Extensible Messaging and Presence Protocol*)
    is a protocol which is based on Extensible Markup Language (XML). This protocol
    is used mostly for instant messaging (IM) and online presence detection application.
    It is also sometimes called jabber protocol. It is used for real-time communication
    and streaming of XML data. It is most widely used in applications like gaming,
    multi-party chat, and voice/video calls. It is a decentralized protocol which
    is very useful for IoT devices. *Advanced Message Queuing Protocol (AMQP)* is
    an open standard message-oriented protocol. It supports both point-to-point and
    publisher subscriber models and is used for routing and queuing data over the
    network.


    The application layer in IoT is also open for several attacks as the following:


    *   *Malicious code injection:* The attacker injects malicious code from unknown
    location into the system and tries to steal or manipulate the data of the authorized
    user.


    *   *Denial-of-service attack:* The attacker pretends to be an authenticated user
    who logs into the system and interrupts the working of the network.


    *   *Phishing attack:* The attacker gains credentials of the system and accesses
    the system and damages the data.


    *   *Sniffing attack:* The attacker uses a sniffer application to attack the network
    of the system and read the unencrypted packets.


    ## **4.5** **Security Classification and Access Control**


    The following are the security classification and access control that must be
    the subject of consideration in the IoT \[[9](#Ch04.xhtml#ref4_9)\].


    ### **4.5.1** **Data Classification**'
