    # 4 Safeguarding the Connected Future: Security in Internet of Things (IoT)


    Priti Maheshwary and Timothy Malche


    Department of CSE, Rabindranath Tagore University (formerly known as AISECT University),
    Bhopal, MP, India


    DOI: 10.1201/9781003338642-4


    Overcoming security issues are one of the main challenges for the Internet of
    things (IoT). There are different security issues that are related to IoT in the
    context of sensor nodes, system network, IoT cloud, IoT backend database, IoT
    applications, system software, and firmware. IoT applications have real-time requirements
    and expected to deliver a high level of reliability. The IoT applications operate
    in safety–critical environment and therefore need justification extreme security
    measures. This chapter discusses the need for security in IoT, IoT architecture
    and attacks on each layer of the IoT architecture, attack surface in IoT, IoT
    protocols, built-in security features in protocols, and security management. The
    aim of this chapter is to provide a thorough understanding of major security concerns
    that are necessary in building secure IoT.


    ## 4.1 Introduction


    Internet of things (IoT) is a technological revolution that serves as a global
    network of intelligent physical objects. In this network, all intelligent objects
    exchange information and services over the Internet where some information or
    services are private and some are publicly accessible. In IoT, these objects are
    called “things.” A “thing” can be any object embedded with sensors, electronics,
    software, and network connectivity. A “thing” has an IP address and has the ability
    to transfer data over the Internet. Some examples of IoT applications include
    connected human body, connected home, connected industry, connected environment,
    connected city, etc. At present, there are billions of objects exist on Earth.
    Through IoT, all kinds of objects ranging from simplest (such as coffee cup, umbrella,
    cloths, etc.) to more complex (such as watch, car, refrigerator, washing machines,
    airplanes, smartphones, computers, etc.) will be able to connect, interact, and
    communicate. IoT is a very complex platform for connecting things. There are many
    objects, sensors, actuators, and technologies available for building the IoT ecosystem.
    It is estimated that there will be around 50 billion connected objects by the
    year 2020. At present, 80% of the connected objects are exposed to security threats
    and vulnerability. In the IoT ecosystem, all objects are connected to the Internet
    all the time sensing and sharing information. In order to be more useful, IoT
    devices must make real-time bi-directional connections to the Internet instead
    of only uploading the data. Therefore, this type of communication must be secure
    enough; otherwise, it will be easier for the attacker to get into the system and
    gain control over it and steal sensitive information. Demand for security also
    raises when IoT is used in many important domains such as medical, military, and
    even many smart city applications, where data are more sensitive and systems are
    more open for remote access and control. Thus, it becomes very important to understand
    security requirements when designing the IoT system in order to make our connected
    world safe and secure.


    This chapter discusses the IoT architecture and security needs. However, the main
    focus of this chapter is to understand security issues in the IoT which will help
    in developing more secure connected future. This chapter is divided into the following
    sections:


    *   Need for security – This section discusses about security challenges, confidentiality,
    integrity, availability, and non-repudiation.

    *   IoT architecture – This section discusses about the fundamental IoT architecture
    such as Device–device, Device–Cloud, Device–Gateway, Gateway–Cloud, and Cloud–Backend–Applications.

    *   IoT protocols – This section discusses about IoT protocol stack layers such
    as link layer, network layer, transport layer, application layer, and protocols
    at each layer.

    *   Security classification and access control – This section discusses about
    the classification of data used in IoT and also privacy issues in IoT.

    *   Attack surface in IoT – This section discusses about the attack surface in
    IoT from hardware and software to communication links between objects.

    *   Security features in IoT protocols – This section discusses built-in security
    features of protocols on transport layer such as SSL/TLS and DTLS and protocols
    on application layer such as MQTT, CoAP, XMPP, and AMQP.

    *   Security management – This section discusses two of the most important security
    management techniques, identity and access management and key management.

    *   IoT-based smart home and security issues – This section discusses IoT smart
    home and security issues in the smart home.


    ## 4.2 Need for Security


    IoT security is the area of major concern. Security in IoT deals with safeguarding
    connected objects and networks in the IoT. The IoT involves the growing collection
    of objects known as things with unique identifiers. These objects have the ability
    to automatically transfer data over a network. Most of the increase in IoT communication
    comes from computing devices and embedded sensor systems which are used in industrial
    machine-to-machine (M2M) communication, home and building automation, vehicle-to-vehicle
    communication, smart energy grids, and wearable devices. The main problem is that
    because the idea of connecting all objects to the Internet is relatively new,
    and therefore security has not always been measured in product design. Most of
    the IoT products sold have old and unpatched embedded operating systems and software
    and users often fail to change the default passwords on smart devices or fail
    to select sufficiently strong passwords. To improve security, an IoT device that
    is directly accessible over the Internet should be distributed in the network
    and have network access restricted. The distributed components should also be
    monitored to identify potential risk, and actions should be taken if problem arises.
    According to Proofpoint [[1](#Ch04.xhtml#ref4_1)], an enterprise security firm,
    the 25% of connected devices are IoT botnet. The botnet was made up of devices
    other than computers, including baby monitors, smart TV, and household appliances,
    etc., which require more security.


    ### 4.2.1 Security Challenges in IoT


    #### 4.2.1.1 Vulnerability points


    As more and more devices are getting connected to the IoT, these devices can create
    a potential security and privacy risk as they are the potential doorway for the
    IT infrastructure and data. A study by Fortify shows that 70% of the devices connected
    in the IoT today are vulnerable to the security issues.


    #### 4.2.1.2 Privacy


    There are many devices that are connected in the IoT and can collect some valuable
    and personal information of the user or surrounding environment from the sensor
    device or from the application. Some of the devices even transmit this information
    via the network or the Internet without any encryption or proper authentication.
    This makes the data extremely vulnerable to misuse and theft if it is accessed
    by an unauthorized person. Privacy is the major concern in the IoT system like
    Smart Home, Smart Grid, Smart City, Defense System, etc. Many information in the
    Smart Industry and Research must also require privacy of data.


