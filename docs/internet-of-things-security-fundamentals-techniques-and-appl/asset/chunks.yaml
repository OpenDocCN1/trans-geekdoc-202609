    # 4 保障互联未来：物联网 (IoT) 中的安全


    Priti Maheshwary and Timothy Malche


    计算机科学与工程系，拉宾德拉纳特·泰戈尔大学（前称 AISECT 大学），印度博帕尔，MP


    DOI: 10.1201/9781003338642-4


    克服安全问题是物联网的主要挑战之一。物联网在传感器节点、系统网络、物联网云、物联网后端数据库、物联网应用、系统软件和固件等背景下存在不同的安全问题。物联网应用具有实时性要求，并预期提供高水平的可靠性。物联网应用运行在安全关键环境中，因此需要采取极端的安全措施。本章讨论物联网中安全的需求、物联网架构及各层架构上的攻击、物联网中的攻击面、物联网协议、协议中的内置安全特性以及安全管理。本章旨在提供对构建安全物联网所必需的主要安全问题的透彻理解。


    ## 4.1 引言


    物联网 (IoT) 是一场技术革命，充当智能物理对象的全球网络。在该网络中，所有智能对象通过互联网交换信息和服务，其中某些信息或服务是私有的，有些是公开可访问的。在物联网中，这些对象被称为“事物”。“事物”可以是嵌入传感器、电子设备、软件和网络连接的任何对象。“事物”具有
    IP 地址并能够通过互联网传输数据。物联网应用的示例包括连接的人体、连接的家庭、连接的工业、连接的环境、连接的城市等。目前地球上存在数十亿个对象。通过物联网，从最简单的对象（如咖啡杯、雨伞、衣服等）到更复杂的对象（如手表、汽车、冰箱、洗衣机、飞机、智能手机、计算机等）都将能够连接、交互和通信。物联网是连接事物的非常复杂的平台。构建物联网生态系统有许多对象、传感器、执行器和技术可用。据估计，到
    2020 年将有约 500 亿个连接对象。目前，80% 的连接对象暴露于安全威胁和漏洞之下。在物联网生态系统中，所有对象全天候连接到互联网进行感知和共享信息。为了更有用，物联网设备必须与互联网建立实时双向连接，而不仅仅是上传数据。因此，这种类型的通信必须足够安全；否则，攻击者更容易进入系统并控制它并窃取敏感信息。当物联网用于医疗、军事以及许多智能城市应用等许多重要领域时，对安全的需求也会增加，在这些领域中数据更敏感且系统更易于远程访问和控制。因此，在设计物联网系统时，了解安全需求变得非常重要，以便使我们的互联世界安全可靠。


    本章讨论物联网架构和安全需求。然而，本章的主要重点是了解物联网中的安全问题，这将有助于开发更安全的互联未来。本章分为以下几个部分：


    *   需要安全 – 本节讨论安全挑战、保密性、完整性、可用性和不可否认性。

    *   物联网架构 – 本节讨论基础物联网架构，如设备-设备、设备-云、设备-网关、网关-云以及云-后端-应用。

    *   物联网协议 – 本节讨论物联网协议栈层，如链路层、网络层、传输层、应用层，以及各层的协议。

    *   安全分类和访问控制 – 本节讨论物联网中使用的数据分类以及物联网中的隐私问题。

    *   物联网中的攻击面 – 本节讨论物联网中的攻击面，从硬件和软件到对象之间的通信链路。

    *   物联网协议中的安全特性 – 本节讨论传输层协议如 SSL/TLS 和 DTLS 以及应用层协议如 MQTT、CoAP、XMPP 和 AMQP 的内置安全特性。

    *   安全管理 – 本节讨论两种最重要的安全管理技术，即身份和访问管理以及密钥管理。

    *   基于物联网的智能家居及安全问题 – 本节讨论物联网智能家居以及智能家居中的安全问题。


    ## 4.2 安全需求


    物联网安全是主要关注的领域。物联网中的安全涉及保护物联网中的连接对象和网络。物联网涉及以唯一标识符为特征的被称为事物的对象不断增长的集合。这些对象能够通过网络自动传输数据。物联网通信的大部分增长来自计算设备和嵌入式传感器系统，这些系统用于工业机器对机器
    (M2M) 通信、家庭和建筑自动化、车辆对车辆通信、智能电网和可穿戴设备。主要问题是，由于将所有对象连接到互联网的想法相对较新，因此安全性在产品设计中并不总是被衡量。市场上销售的大多数物联网产品具有旧的且未修补的嵌入式操作系统和软件，用户经常未能更改智能设备上的默认密码或未能选择足够强大的密码。为了提高安全性，直接通过互联网可访问的物联网设备应分布在网络中并限制网络访问。分布式组件还应被监控以识别潜在风险，并在出现问题时采取行动。据企业安全公司
    Proofpoint [1] 称，25% 的连接设备是物联网僵尸网络。该僵尸网络由除计算机之外的设备组成，包括婴儿监视器、智能电视和家用电器等，这些设备需要更多安全保障。


    ### 4.2.1 物联网中的安全挑战


    #### 4.2.1.1 漏洞点


    随着越来越多的设备连接到物联网，这些设备可能造成安全和隐私风险，因为它们是 IT 基础设施和数据的潜在入口。Fortify 的一项研究显示，今天物联网中连接的
    70% 设备容易出现安全问题。


    #### 4.2.1.2 隐私


    物联网中连接的许多设备可以从传感器设备或应用程序收集用户或周围环境的宝贵和个人信息。一些设备甚至通过网络或互联网在没有任何加密或适当身份验证的情况下传输这些信息。这使得数据如果被未经授权的人访问，则极易被滥用和窃取。隐私是物联网系统如智能家居、智能电网、智慧城市、国防系统等的主要关注点。智能工业和研究中的许多信息也必须要求数据隐私。


    #### 4.2.1.3 身份认证与授权

