  trans: '

    -   数据集中在个人和设备上。

    -   服务提供商竞争连接可信的对等方。

    -   市场改进提高了共享资源的效率，并决定了更公平的交换比率。


    ### 5.2.4 比特币与区块链

    互联网世界使用电子支付系统，资金以数字资产或加密货币的形式流动，被称为 `Bitcoin` [1]。`Bitcoin` 的系统以交易账单的形式自我组织。`Blockchain`
    中的矿工只收集有效的交易。这些有效交易由使用哈希算法设计的私钥/公钥对标识。


    `BitCoin` 的概念主要源于 `Blockchain` 最有前景的特性，即交易验证的去中心化以及合适的加密程序。常见的点对点 `BitCoin` 系统运行在共享的
    `Blockchain` 账本上。`BitCoin` 使用数字签名来维护安全性，而 `Blockchain` 模型则促进了完全安全的数字交易。


    ### 5.2.5 交易费用

    支付交易费用对交易而言是可选的。矿工负责优先处理交易，根据支付更高费用的交易来处理它们。费用由生成交易所需的存储空间决定，并取决于创建交易所需的输入数量。具有待处理输入的交易获得更高优先级。


    ### 5.2.6 区块链的安全性

    本文中的讨论围绕“public” `Blockchain` 展开，其中账本可被视为存储所有先前交易的虚拟账簿。为了处理持续生成有效交易区块的无序性，`Blockchain`
    需要一种协议来实现这些区块的一致性。`Blockchain` 网络中存在一个“miner”网络节点，其作用是验证新交易。新交易首先由矿工验证，然后添加到链中，然后广播到整个
    `IoT` 网络。`Blockchain` 对包含有效交易的区块应用特定密钥，然后将其存储到分布式账本中。验证新交易意味着验证整个账本。


    矿工需要对所有数据区块完成工作量证明 (`PoW`)。此 `PoW` 是一个 `hashcash` 函数，并在 `Blockchain` 中充当投票以验证
    `Blockchain` 的交易日志。此 `PoW` 使 `IoT` 网络的节点更难以预测哪台计算机生成下一个区块。相反，`Blockchain` 不断更新，每个节点都可以查看账本。


    ## 5.3 评估区块链

    当前 `IoT` 解决方案昂贵，因为与集中式云、大型服务器场和网络设备相关的基础设施和维护成本很高。通信成本根据 `IoT` 设备的增长速度来处理。


    集中式方法中识别出的问题通过 `Blockchain` 去中心化机制中的分布式账本方法得到解决 [3]。它采用统一的点对点通信模型来执行数十亿笔交易。它还通过将计算和存储需求分布到
    `IoT` 网络的所有设备上，提供降低安装和维护数据中心成本的优势，从而即使单个节点宕机也能防止整个网络崩溃。


    建立点对点通信模型也带来了一些挑战，但它已成为维护庞大 `IoT` 网络中安全数据交易的合适解决方案。有效交易可防止盗窃和欺骗。


    ## 5.4 区块链在业务中的应用

    1. 银行业依赖 `Blockchain` 模型，因为其具有维护安全交易的潜力。它提供了更高的透明度，并通过消除任何中间第三方的存在以及其分布式和共享数据库的特性来降低每笔交易的成本。账本具有分布式特性，以通信各方之间增强的信任水平记录交易
    [4]。由于 `Blockchain` 验证流经 `IoT` 网络的每一笔交易，因此不允许通信成员操纵交易，从而提高了安全性。


    `Blockchain` 将批准交易的任务指定给网络中的所有成员，并限制单一实体控制整个系统的权力。印度 `ICICI` 银行采用了这种安全模型以确保银行交易安全。


    2. IBM 使用了一个名为“`ADEPT`”的概念，与三星合作开发的系统使用 `Blockchain` 技术。IBM “`ADEPT`” 使用 `Bitcoin`
    底层设计的元素来构建分布式设备网络——一个去中心化的 `IoT`。`ADEPT`（Autonomous Decentralized Peer-to-Peer
    Telemetry）的概念利用 `Blockchains` 为系统提供骨干，使用 `proof-of-work` 和 `proof-of-stake` 的混合来保护交易。使用
    `ADEPT` 系统，三星洗衣机 `W9000` 使用 `smart contracts` 通过自动支付订购洗涤剂供应并跟踪其运输和交付。所有这些信息也由系统与所有者共享。


    3. `CISCO JASPER`: Jasper 现为 Cisco 的一部分，提供面向物联网 (`IoT`) 的基于云的软件平台，更明确地说，是为了使产品业务成为
    `IoT` 服务业务。它在其业务流程中整合了 `Blockchain` 技术。


    `CISCO JASPER` 通过使用 `IoT` 框架来启动、管理和货币化企业服务，帮助企业增强其对供应链的影响。它通过性能分析的预测性维护以及通过控制中心进行的实时维护提供有效效率提升，从而带来更好的收入和更好的客户体验。


    ## 5.5 区块链的优势

    `Blockchain` 可以弥合缺失的环节，以解决物联网行业的隐私、安全和可靠性问题。`Blockchain` 可用于跟踪数十亿网络设备并实现交易处理和设备之间的协调，从而为基于
    `IoT` 的制造业带来显著节省。`Blockchain` 的主要优势可总结如下：


    1. **本质上公开：** 每个参与节点都可以查看区块以及其中存储的交易。交易的实际内容是加密的。


    2. **安全：** `Blockchain` 使用的账本无法被篡改，也无法被入侵者修改，因为区块不存在于中心位置。没有单一的通信线程可以被破译，因此使中间人攻击难以发生
    [2]。已实施的算法可防止密码攻击，并通过在通信各方之间建立信任来加速业务增长。


    3. **去中心化：** 批准交易的权利不由单一机构持有。因此服务器具有自主能力。`Blockchain` 的去中心化和自主能力使其成为成为 `IoT` 解决方案基础元素的理想组件。只有一个公共账本，因此与多个账本相比，成本和存储需求降低。


    4. **透明性和不可变性：** 尽管分布式账本中的任何更改都可以被 `IoT` 网络中存在的所有节点查看（透明性），但没有任何节点可以被任何节点删除（不可变性）。


    5. **高质量数据和持久性：** `Blockchain` 输出的数据准确、一致，并可供所有参与节点使用。这增强了数据对故障和恶意攻击的抵抗力。

    '
