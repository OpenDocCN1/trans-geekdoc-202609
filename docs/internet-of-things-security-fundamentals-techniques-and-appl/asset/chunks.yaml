    `p[6]`→`p[2]`, `p[6]`→`p[4]`, `p[4]`, `p[6]`→`p[2]`, `p[2]`, `p[6]`→`p[4]`, `p[2]`,
    `p[2]`, `p[4]`→`p[6]`, `p[5]`→`p[7]`, `p[5]`→`p[9]`, `p[7]`→`p[5]`, `p[7]`→`p[9]`,
    `p[7]`, `p[9]`→`p[5]`, `p[5]`, `p[9]`→`p[7]`, `p[5]`, `p[7]` `p[9]`, `p[2]`→`p[3]`,
    和 `p[3]`→`p[2]` （注意规则已被分解，如 `p[4]`→`p[2]`, `p[6]` 被两条规则 `p[4]`→`p[2]` 和 `p[4]`→`p[6]`
    分解）。


    ## 6.4 参数化密码系统的实验分析


    对于扩展的参数化 AVK 模型（通过改变参数使密钥变化），密码系统设计者的目标是使黑客对所选参数或密钥做出有根据的猜测尽可能困难。因此，别无选择，只能进行暴力搜索，尝试每一种可能的字母、数字和标点符号组合。即使在每秒可尝试一百万个密钥的机器上进行此类搜索（大多数机器每秒尝试的密钥少于
    100 个），平均也需要超过 100 年才能完成。该方法的简便性也是必不可少的，只有当参数取自用户附近时才有可能。以此为目标，并利用前文中的信息，后续章节讨论了用于密钥形成的模式的调查。在进入下一节之前，最好重新考虑
    AVK 模型的特征。


    ### 6.4.1 自动可变密钥的特征


    1. 以最佳大小固定密钥，并在会话之间更改密钥。在参数化 AVK 版本中，可通过改变参数来实现。


    2. 可通过在公共网络上仅共享参数而不是交换密钥来实现额外的安全级别。


    3. 通过改变参数生成会话密钥（AVK）。新密钥被视为在前一个密钥中改变某些参数。


    `K[0]`←`Initial Key`


    `K[i+1]`←`K[i]`⊙{`p[i]`, `p[j]`, `p[k]` …}


    其中 ⊙ 表示对密钥 `K[i]` 的某些参数 `p[i]`、`p[j]`、`p[k]` 进行连接或操作以构造 `K[i+1]`


    在 Fibo-Q 方法中，密钥随参数 = `n` 变化，同时计算 `f(n)`、`f(n-1)` 和 `f(n + 1)`。如果 `n` < 35，则使用
    1 到 `n` 之间的任意数量的参数用于下一个密钥。否则由发送方和接收方相互协商选择随机 `n`。在 Sparse 方法中，密钥随位置参数 `p[ij]`
    = 位置 (`i`, `j`) 变化（该方法适用于移动设备，其中下一个位置坐标将产生下一个密钥）。


    一般而言，对于密码系统 `S`，如果参数来自域集


    `p` = {`p[1]`, `p[2]`, …,`p[n]`} 并通过选择参数数量在最小 3 到最大 7 之间可以构造并在通信方之间共享密钥。由于参数在公共网络上交换并且可能被发现或记录在日志中，参数化模型的安全性可以用挖掘技术进行测试。为了使用挖掘技术测试参数化模型，以下信息已从公共领域（例如大学的一个系）收集。响应的总体观点已被突出显示，作为对参数化模型的密码系统设计者的建议。

