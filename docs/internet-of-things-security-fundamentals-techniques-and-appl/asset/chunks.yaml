    ].\n\nDesigning a good cryptosystem not only requires encryption algorithms and\
    \ key management protocols but also requires necessary testing to test the design\
    \ under cryptic pattern discovery and mining.\n\nThe parametric Fibo-Q model uses\
    \ parameter n as input for computation of key. Sparse approach uses location (i,\
    \ j) as two parameters for computation of keys. The keys used in these approaches\
    \ were numeric keys. To extend the idea over alphanumeric keys, the parameters\
    \ like\n\n*p*[1] = part of vehicle number, *p*[2] = nickname, and *p*[3] = date\
    \ of birth of spouse, can be used. The possible key samples may be *mp09t!nku020284,\
    \ mp09b0b020284, mp09t!nku020286,* etc. The keys generated in this fashion are\
    \ {P[1]P[2]P[3], P[1]P’[2]P[3], P[1]P[2]P’[3,] P’[1]P[2]P’[3…]}. Hence, by changing\
    \ parameter values, variable keys can be generated. The alphanumeric mixed key\
    \ construction using this approach is to be analyzed from the hacker’s perspective.\
    \ The parameters from the possible parameter set used in different sessions can\
    \ be found through association rules. The parameters may be associated with the\
    \ device location of IoT and used to generate its secret key for secure communication.\
    \ The keys may also be used as OTP for authentication. To simplify the situation,\
    \ we have taken real-world persons as a device and associated information of the\
