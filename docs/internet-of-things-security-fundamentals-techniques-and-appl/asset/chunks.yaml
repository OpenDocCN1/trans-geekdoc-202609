    # 6 Cryptic Mining for AVK-based IoT Cryptosystem and Client-side Encryption Perspective


    **Shaligram Prajapat**


    International Institute of Professional Studies, Madhya Pradesh, India Devi Ahilya
    University, Indore, Madhya Pradesh, India


    DOI: 10.1201/9781003338642-6


    Automatic variable key (AVK)-based enciphering schemes have claimed to be energy
    efficient for communication and information exchange among IoT-based devices.
    This chapter presents parametric versions of symmetric key-based encryption algorithms.
    The parametric version of AVK emphasizes on generation and usage of key solely
    based on the parameter. The common method of key construction relies on numeric
    keys. Here, the key construction process has been extended for generation of alphanumeric
    keys and a domain of parameters (selected based on user’s personal information).
    It is very common to use numeric or alphabetic series, recurrence relations, or
    location information which can jeopardize the safety of a system. The cryptic
    model gives freedom to the user for the parameter selection and variation in the
    parameters. This chapter presents the analytics perspective of the parametric
    model in the light of association rule mining for the AVK-based symmetric cryptosystem.
    Useful inferences and results from testing of cryptic association rule mining
    support the view of auditing encryption algorithm and identify the power of using
    a large number of parameters for secure information exchange among IoT devices.


    ## 6.1 Introduction

