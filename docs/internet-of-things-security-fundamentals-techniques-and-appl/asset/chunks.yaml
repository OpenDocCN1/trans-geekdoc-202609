- raw: '*   Secure distributed query processing: On top of the resulting set of connected
    and access-controlled local data storages, the GAMBAS middleware enables distributed
    query processing in a secured manner. Toward this end, the query processing engine
    makes use of authentication mechanisms and encryption protocols that are bootstrapped
    by means of novel key exchange mechanisms that leverage the existing web-infrastructure
    that is already used by the users.


    ### **2.3.4** **IoT-A Architecture (IoT-A Contribution)**


    Security is an important cornerstone for the IoT. This is why, in the IoT-A project,
    we deemed as very important to thoroughly address security and privacy issues
    in various aspects. A set of requirements based on the input of external and internal
    stakeholders was used as a basis for the identification of the mechanisms and
    functionalities that guarantee user data privacy and integrity, user authentication,
    and trustworthiness of the system.


    These functionalities were analyzed and orchestrated in Functional Groups (FG)
    and Functional Components (FC) in the frame of WP1. High-level PS&T specifications
    were integrated in the frame of the IoT-A Architectural Reference Model (ARM)
    and then passed to vertical WPs dealing with communication protocols (WP3), infrastructure
    services (WP4), as well as hardware aspects (WP5). Due to the highly heterogeneous
    environment provided by the IoT and the huge number of connected, (autonomous)
    devices foreseen by analysts, a strong focus was placed on scalability and interoperability.


    The ARM document \[[5](#Ch02.xhtml#ref2_5)\] paves the way for understanding and
    adopting the open architecture of IoT-A, as well as provides the overall definition
    of IoT security, privacy, and trust design strategies that we adopted. Then, in
    WP3, we analyzed the security of communication in the peripheral part of the IoT
    and its impact on the overall communication architecture. In this context, we
    investigated HIP and HIP-BEX protocols, as well as considered issues like mobility,
    collaborative key establishment, and securing network entry with PANA/EAP.


    Then, within the framework of WP4 \[[6](#Ch02.xhtml#ref2_6)\], we developed a
    secure resolution infrastructure for IoT-A. It ensures privacy and security for
    the resolution functions and offers the basis for other security functionalities
    outside the resolution infrastructure. It controls the access to IoT resources,
    to real-world entities, and to the related information including their respective
    identifiers. In addition, the resolution infrastructure also provides support
    for pseudonymity: A user does not need to reveal his/her identity when using an
    IoT resource or a higher level service. To achieve all this, various security
    components were developed ([Figure 2.6](#Ch02.xhtml#fig2_6)). They deal with authorization
    and authentication, key exchange and management, trust and reputation, and identity
    management.


    ![Figure 2.6 Components for privacy and security in the IoT-A resolution infrastructure.](Images/fig2_6.jpg)


    [**Figure** **2.6**](#Ch02.xhtml#bck_fig2_6) Components for privacy and security
    in the IoT-A resolution infrastructure.


    Finally, WP5 deals with privacy and security at a device level. In particular,
    it describes the mechanisms needed to authenticate RFID devices and to provide
    confidentiality of the communication between the reader and the tag.  The PS&T
    features of the IoT-A architecture will be tested in the forthcoming IoT-A eHealth
    use case.


    ### **2.3.5** **Governance, Security, and Privacy in the Butler Project (Butler
    Contribution)**


    The goal of the BUTLER project is the creation of an experimental technical platform
    to support the development of the IoT. The main specificity of the BUTLER approach
    is its targeted “horizontality”: The vision behind BUTLER is that of a ubiquitous
    IoT, affecting several domains of our lives (health, energy, transports, cities,
    homes, shopping, and business) all at once. The BUTLER platform must therefore
    be able to support different “Smart” domains, by providing them with communication,
    location, and context awareness abilities, while guaranteeing their security and
    the privacy of the end users. The issue of security and privacy is therefore central
    in the BUTLER project and develops in several requirements, the main requirements
    relate to:


    *   Standard issues of data security, both at a data storage level and at a data
    communication level, exist in IoT applications. The diversity and multiplicity
    of the “things” connected by the IoT and of the data exchanged further amplify
    and complicate these requirements.


    *   The application enabled by the IoT may pose additional privacy issues in the
    use that is made of the data from the collection of data by the applications (which
    should be conditioned by an “informed consent” agreement from the user), to the
    profiling, exchange, and sharing of these data necessary to enable true “context
    awareness.”


    Data technical protection^()


    However, privacy and security do not only refer to security of the exchange of
    data over the network but shall also include: (a) Protection of the accuracy of
    the data exchanged, (b) protection of the server information, (c) protection of
    the usage of the data by explicit, dynamic authorization mechanisms, (d) selected
    disclosure of data, and (e) the implementation of “transparency of data usage”
    policies.


    The BUTLER project also addresses the security and privacy challenges from the
    point of view of their implication on business models. To specify the horizontal
    IoT platform envisioned in BUTLER, the project started from the gathering and
    analysis of the requirements from up to 70 use cases. The analysis of these use
    cases not only produced requirements for the specification of the platform but
    also valuable information on the potential socio-economic impact of the deployment
    of a horizontal IoT and on the impact on the associated business models.


    If treated accordingly, the ethics and privacy issues transform from a threat
    to an opportunity. A better understanding of the service by the user increases
    acceptance and creates trust in the service. This trust becomes a competitive
    advantage for the service provider that can become a corner stone of his business
    model. In turn, the economic interest of the service providers for ethics and
    privacy issues, derived from this competitive advantage, becomes a guarantee for
    the user that his privacy will be respected. The BUTLER project research on the
    implication of the ethics, privacy, and data security on the business models and
    socio-economic impact will be published in Deliverable 1.4 (May 2013) and Deliverable
    1.3 (September 2014).


    The involvement of end users in proof of concepts and field trials is another
    specificity of the BUTLER project. The end user involvement is key not only to
    validate the technical qualities of the BUTLER platform (technology feasibility,
    integration and scaling) but also to assess the perception of end user and their
    acceptance of the scenario envisioned for the future “horizontal” IoT.


    However, the involvement of end users in the scope of the project requires handling
    their data and privacy concerns carefully. The detailed specification of the field
    trials and proof of concept are described in Deliverable 1.2 (scheduled for end
    of May 2013). The following issues must be considered in the organization of end
    user involvement:


    1.  Technical security mechanisms must be set up to ensure the security and privacy
    of the participants. This involves secured data communication and storage, and
    in the scope of the BUTLER project, it is addressed by the enabling security technologies
    developed and integrated in the BUTLER platform.


    2.  The participants must be well informed of the scope and goal of the experiment.
    In the case of BUTLER, this involves specific efforts to explain the scope and
    goal of the project to a larger public.'
