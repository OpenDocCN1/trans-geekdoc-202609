    ## 1.12 Conclusions

    The fourth industrial revolution has opened a broad pathway for machine-to-machine
    (M2M) communication to facilitate the extreme automation. Now, machines can communicate
    and share information to understand each other for specific objectives. These
    objectives are required to be well programmed to maintain the privacy and to be
    well equipped for possible security breaches. However, many times due to the minimum
    human intervention in this whole scenario, the security is considerably compromised.
    Therefore, advanced techniques need to be implemented at negotiation, authentication,
    execution, and information exchange points in M2M communication. These technologies
    are now becoming intelligent to sense and detect the security attacks while improving
    the overall system and making it more resilient against modern IoT attacks. This
    situation is more vulnerable because of version incompatibility issues, and versioning
    of machines and firmwares. The presented chapter discussed the conceptual framework
    for these technologies and related issues.


