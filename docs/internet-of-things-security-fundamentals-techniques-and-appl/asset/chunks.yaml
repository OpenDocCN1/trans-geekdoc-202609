    数据报传输层安全（DTLS）是一种为基于数据报的应用提供安全性的通信协议。为此，它允许应用程序通信以防止窃听、篡改或消息伪造。DTLS 协议基于面向流的传输层安全（TLS）协议。DTLS
    提供与 TLS 类似的安全保证。DTLS 协议数据报保留了传输的语义，使得应用程序不必承受与流协议相关的延迟，但它必须处理数据包重排序、数据报丢失以及大于数据报网络数据包大小的数据。考虑安全时有三个主要要素，即完整性、身份验证和保密性。DTLS
    都能实现。DTLS 解决了两个问题，重排序和数据包丢失。DTLS 增加了三种机制：第一，数据包重传，第二，在握手期间分配序列号，第三，重放检测。与网络层安全协议不同，DTLS
    在应用层保护端到端通信。端到端通信保护会使攻击者难以访问通过受损节点传递的所有文本数据。DTLS 还避免了在较低层安全协议中出现的密码开销问题。


    ### 4.7.4 CoAP（受限应用协议）

    受限应用协议（CoAP）现已成为物联网应用的标准和流行协议。安全性始终是保护设备间通信的主要关注点。它是一种为物联网应用中的机器对机器通信而设计的轻量级协议。CoAP
    使用数据报传输层安全（DTLS）作为通信协议。CoAP 默认绑定到 UDP，可选绑定到 DTLS，提供高水平的通信安全 \[15\]。


    ### 4.7.5 XMPP（可扩展消息和存在协议）

    安全性一直是 XMPP 的关键问题。XMPP 中的安全考虑包括高安全性、证书验证、客户端-服务器通信、服务器-服务器通信、协议层、防火墙和 base64。*高安全性*是指在提供基于证书的身份验证时，在通信双方之间保持的相互保密性。如果颁发了证书，则只有授权的证书才应被接受。*证书验证*是指当颁发证书时，应由通信双方进行审查。在*客户端-服务器通信*中，客户端必须支持
    TLS 和简单身份验证和安全层（SASL）协议以连接到服务器。XML 流的加密使用 TLS 进行，而身份验证由 SASL 支持。服务验证后，只有客户端才应与服务器通信。客户端通信的
    IP 地址应保持私密，以便防止入侵者进入通道。


    在*服务器-服务器通信*中，与客户端不同，服务器应支持 TLS 和 SASL 协议以便于通信。数据的身份验证和完整性通过在服务器通信中使用 SASL 得到保证。*协议层*由四个协议组成，按安全实现中所述用于
    XMPP。这些协议是 TCP、TLS、SASL 和 XMPP，其中 TCP 是基础层，在该层建立客户端与服务器之间的连接。TLS 对 XML 流进行加密，SASL
    提供身份验证，XMPP 是应用层。对于*防火墙*，TCP 广泛用于 XMPP 通信。客户端到服务器通信使用端口 5222，服务器到服务器通信使用端口 5269。*Base64*
    有助于识别受信任的客户端和服务器。服务器验证客户端，如果发现任何数据无关，则不予接受。这提高了数据完整性并传递正确的数据。


    ## 4.8 安全管理

    它是保护数据免受未经授权访问、控制用户操作活动、设置安全规则、监控安全事件等的一组功能。存在许多安全管理技术，其中两个最重要的将在此处讨论，可用于物联网。


    ### 4.8.1 身份和访问管理（IAM）

    它是使正确资源在正确的时间因正确的原因被正确个人访问的安全学科。此管理任务关键，要求确保在日益异构的技术环境中正确授予对资源的访问权限，并满足日益严格的合规要求。它涵盖与安全相关的许多问题，例如用户如何获得身份、用户身份的保护，以及支持该保护的技术（例如，网络协议、数字证书、密码等）。IAM
    具有以下功能:-


    *   纯身份功能，包括在不考虑访问或授权的情况下创建、管理和删除用户身份。

    *   用户访问（登录）功能，定义适当的用户如何凭提供的凭据获得系统访问权限。

    *   服务功能，包括一个系统，该系统向用户和设备提供个性化、基于角色的、在线的、按需的、多媒体内容和基于 presence 的服务。

    *   身份联合，包括一个依赖于联合身份以在不知道其密码的情况下对用户进行身份验证的系统。身份联合由一个或多个系统组成，这些系统关联用户访问并允许用户基于对联合中操作的其中一个系统进行身份验证来登录。


    除了创建、删除和修改用户身份数据外，身份管理还控制用于应用程序的附加实体数据，例如联系信息或位置。IAM 的系统功能包括身份验证、授权、角色、委派和互换。*身份验证*是使用密码或生物识别设备对用户进行验证。*授权*是管理授权信息，该信息定义了在特定应用程序上下文中谁可以访问什么操作。*角色*是授予用户的操作组。角色通常与特定工作或工作职能相关。例如，用户管理员有权重置用户的密码，而系统管理员可能有权将用户分配到特定服务器。*委派*允许本地管理员在没有全局管理员的情况下执行系统修改。它也可能意味着一个用户可以代表其他用户执行操作。*互换*是使用安全断言标记语言（SAML）协议在两个身份域之间交换身份信息
    \[16\]。


    IAM 可以通过基于物联网的智能停车系统来说明。智能停车系统是一个物联网参考系统，因为它包含多个捕获数据并将其发送到物联网服务器上的数据库存储的端点。该系统还提供数据分析和决策。在此示例中，智能停车系统，如
    Russell 等人 \[5\] 所讨论，具有以下功能：


    *   面向消费者的服务：此服务允许客户查找空闲停车位和价格。

    *   支付灵活性：此服务允许客户使用多种支付方式为停车位付费，例如信用卡、现金/硬币和移动支付服务。

    *   授权执行：此服务允许跟踪已购买停车位的停放时间、确定到期时间、感知停车位超期停放时间，并将违规行为通知停车执法人员。

