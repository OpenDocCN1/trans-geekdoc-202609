- raw: 'The TCP/IP protocol stack is at the heart of the Internet. The protocol stack
    in IoT is divided into four layers. These layers are link layer, network layer,
    transport layer, and application layer. Each layer is responsible to perform a
    specific task with the help of different protocols. Figure 4.3 represents the
    four layers and protocols used at each layer.


    ### **4.4.1** **Link Layer**


    This layer is responsible for transferring data between IoT devices. This layer
    hides the details of underlying hardware and represents itself to the upper layer
    as the medium to communicate. The link layer converts data stream to signals bit
    by bit and send it to the underlying hardware. At the receiving end, this layer
    receives data from the hardware in the form of electrical signals, assembles it
    in a recognizable frame format, and hands over to the upper layer. The link layer
    works between two hosts which are directly connected. This direct connection could
    be point to point or broadcast. The link layer performs the following tasks:


    *   *Framing*: The link layer takes packets from the network layer and encapsulates
    them into frames. Then, it sends each frame bit by bit on the hardware. At the
    receiving end, the data link layer picks up signals from hardware and assembles
    them into frames.


    *   *Addressing*: The data link layer provides hardware addressing mechanism.
    Hardware address is assumed to be unique on the link.


    *   *Synchronization*: As soon as data frames are sent on the link, it synchronizes
    the transfer for both ends.


    *   *Error Control*: Whenever signals encounter problem in transition, it detects
    errors and attempted to recover actual data bits and also provides error reporting
    mechanism to the sender.


    *   *Flow Control*: IoT devices on the same link may have different speeds or
    capacities. The link layer ensures flow control that enables communicating devices
    to exchange data on the same speed.


    *   *Multi-Access*: There may be a high probability of collision. The link layer
    provides mechanisms such as CSMA/CD to ensure that data are shared among multiple
    devices. The link layer consists of the following protocols which determine how
    the data are physically sent over the network. The following are the IEEE standards
    in the link layer.


    *   *802.3 Ethernet* is a collection of wired Ethernet standard for Ethernet networks.
    It defines the media access control (MAC) of wired Ethernet. It has 802.3 as coaxial
    cable, 802.3.i as copper twisted-pair connections, 802.3.j as fiber optics connections,
    802.3.ae as fiber, etc. These standards provide data rate from 10 Mb/s to 40 Gb/s
    and even higher. *802.11 Wi-Fi* is a set of specifications for wireless LAN (WLAN)
    technology. 802.11 specifies an over-the-air interface between a wireless client
    and a base station or between two wireless clients. 802.11 has several specifications
    that are used in IoT. The standard 802.11a operates at 5 GHz, 802.11b/g operates
    at 2.4 GHz, 802.11n operates at 2.4/5 GHz, 802.11ac operates at 5 GHz, and 802.11ad
    operates at 60 GHz. These provide data rates from 1 Mb/s to 6.75 Gb/s. *802.16
    WiMax* is a series of wireless broadband standards which provide data rates from
    1.5 Mb/s to 1 Gb/s, mobile stations provide till 100 Mb/s and fixed station till
    1 Gb/s. *802.15.4 LR-WPAN* is a technical standard which defines the operation
    of low-rate wireless personal area networks (*LR*\-*WPANs*). It provides data
    rates around 40 Kb/s to 250 Kb/s. This standard provides low-cost and low-speed
    communication suitable for powered constrained IoT devices. These are very useful
    for remote sensing data. *2G/3G/4G* are the mobile communication standards where
    2G includes GSM and CDMA, 3G includes UMTS and CDMA2000, and 4G includes LTE.
    IoT devices based on these standards can communicate over a cellular network.
    These standards provide data rates from 9.6 Kb/s to 100 Mb/s \[[7](#Ch04.xhtml#ref4_7)\].


    This layer is highly prone to several attacks on IoT devices. These attacks are
    the following:


    *   *Address Resolution Protocol (ARP) spoofing* is a technique by which an attacker
    sends ARP messages onto the network with an aim to associate the attacker’s MAC
    address with the another host such as gateway causing traffic of IP sent to the
    attacker. This attack allows the attacker to intercept data frames on network,
    modifies and stops the traffic, and opens door for other attacks.


    *   *Denial of Service (DoS) attack* is an attack in which an attacker makes sensor
    node or network resource unavailable by disturbing the service.


    ### **4.4.2** **Network Layer**


    It is also called the Internet layer in the IoT which is responsible for sending
    IP datagrams from the source network to the destination network. This layer performs
    host addressing and packet routing. The datagram contains source and destination
    addresses which are used to rout them from the source to the destination across
    multiple networks. The host identification is done using hierarchical IP addresses
    scheme such as IPv4 or IPv6, etc. The network layer is responsible for performing
    the following tasks \[[8](#Ch04.xhtml#ref4_8)\]:


    *   Addressing devices and networks.


    *   Populating routing tables or static routes.


    *   Queuing incoming and outgoing data and forwarding them according to quality
    of service constraints set for those packets of data.


    *   Internetworking between two different subnets.


    *   Delivering packets to destination with best efforts.


    *   Providing connection-oriented and connectionless mechanism.


    The network layer consists of protocols which are considered useful in IoT such
    as IPv4 which is the most deployed internet protocol. This protocol uses 32-bit
    addressing schemes that allow the total 2^(32) addresses. But as more and more
    devices connected to the Internet, these addresses got exhausted in 2011. As a
    result, a new version of protocol comes into play. The IPv6 is the newest version
    of internet protocols and a successor of IPv4. This protocol uses 128-bit addressing
    schemes that allow the total 2^(128) addresses. Another protocol is *6LoWPAN*
    a somewhat contorted acronym that combines the latest version of the internet
    protocol (IPv6) and low-power wireless personal area networks (LoWPAN). This protocol
    enables smallest devices that have a limited processing ability to transmit information
    wirelessly using an internet protocol. It operates on a 2.4 GHz frequency range
    and provides data transfer rates around 250 Kb/s. Thus, this protocol is considered
    more useful than the other for resource- and power-constrained devices.


    The network layer vulnerabilities in IoT are categorized as the following attacks:


    *   *Routing attack* in this attack an attacker may change the routing infor mation
    to create routing loops which significantly deteriorates quality of service since
    the routing information is not encrypted.


    *   *Eavesdropping attack* is an attack when an attacker can gain access to a
    communication channel. It is a passive attack unless the attacker modifies the
    received packets and sends it back to the source. This method is called replay
    attack and it is a very common subtype of spoofing.


    *   *Replay attack* is an attack in which an attacker obtains a signed packet,
    and apart from whether he can decrypt it, it gains the trust of the destined entity
    by re-sending the packet at a later time.


    *   *Sinkhole attack* is an attack in which some nodes are made more attrac tive
    to network traffic than other normal nodes. When packets reach the sinkhole node,
    the messages may get dropped and forwarded with altered content.


    *   *Wormhole attack* is an attack in which a wormhole is maliciously made, low
    latency link, over which the attacker can replay messages. The attacker receives
    packets at one point in the network and sends it to another point in the network,
    and then replays it from that point.'
