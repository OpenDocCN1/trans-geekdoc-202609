- raw: 'In information security, data classification depends upon its level of sensitivity.
    It is also depending on the level of impact such that data should be disclosed,
    altered, or destroyed without authorization. The main security controls which
    are appropriate for safeguarding data are determined with the help of classification
    of data. All data should be classified into one of the three sensitivity levels,
    or classifications such as *Restricted Data* are said to be restricted when the
    unauthorized disclosure, alteration, or destruction of that data could cause a
    considerable level of risk. An example of restricted data is data for defense
    organization. The highest level of security controls should be applied to restricted
    data. *Private Data* can be classified as private when the unauthorized disclosure,
    alteration, or destruction of that data could result in a moderate level of risk.
    By default, all data that are not explicitly classified as restricted or public
    data may be treated as private data. A reasonable level of security controls must
    be applied to private data. *Public Data* can be classified as public when the
    unauthorized disclosure, alteration, or destruction of that data may result in
    little or no risk. Examples of public data are press releases, course information
    and research publications, weather information, rail/flight information, etc.
    There may be little or no controls required to protect the confidentiality of
    public data. The level of control is required to prevent unauthorized modification
    or destruction. The levels of controls are authentication, authorization, and
    data integrity. *Authentication* is the way of protecting the data. Authentication
    is a process in which the credentials provided by users are compared with those
    available in the database of authorized users. Authentication is important in
    IoT applications such as Smart Home. Only the authenticated user may be able to
    access the Smart Home system. *Authorization* is the process of providing access
    rights to data and resources related to information security. It is also used
    to specify access control in a particular IoT system. Authorization is required
    for many IoT applications in order to specify who has the access to the system.
    The example is the Smart Grid system which requires only the authorized user to
    access the system. *Data integrity* is the maintenance and the assurance of the
    accuracy and consistency of data. Data integrity applies to the entire life cycle
    of data. It is a critical aspect to the design, implementation, and usage of any
    IoT system which stores, processes, or retrieves data. Because data are the most
    important in IoT systems upon which actions are taken and decisions are made,
    the data integrity plays an important role in this context.


    Authentication and data integrity can be achieved by using digital signature as
    described in Section 2.2.4. The authorization may also be achieved using such
    digital signature as person with valid signature will only be granted to have
    an access right on a particular IoT device in the IoT infrastructure.


    MQTT protocol can also be used to achieve authorization. MQTT, publish/subscribe
    protocol, allows clients to write and read topics. In this process, all MQTT clients
    do not have permission to write the topics; similarly, all do not have permission
    to read. A control can be put using an MQTT broker that restricts such permission
    to MQTT clients by keeping access control list to topics. The MQTT broker can
    authorize MQTT clients using client ID or any other technique and grant access
    to topic by topic lookup to determine whether MQTT clients are authorized to read,
    write, or subscribe to topics.


    ## **4.6** **Attack Surface in IoT**


    The attack surface in IoT is a doorway for attackers to enter into the IoT system
    and steal information and even take control over the system. Thus, for making
    IoT systems secure, these surfaces must be identified, protected, and restricted
    from malicious and unauthorized access \[[10](#Ch04.xhtml#ref4_10)\].


    ### **4.6.1** **Interfaces**


    Embedded devices have a number of circuits which enable to exchange information.
    This information is exchanged using the agreement on common protocols that can
    be divided into two groups, serial and parallel. Serial and parallel are the interfaces
    that allow multiple bits of data exchange and require a large number of pins,
    whereas in a serial interface, one bit of data is transferred at a time, which
    is slower than parallel, but has an advantage of requiring a less number of pins.
    Some of the popular examples of protocols which use serial communication are Universal
    Serial Bus (USB), Ethernet, UART, SPI, and I2C. Serial interfaces in any IoT device
    are fairly useful for the attacker because it provides a doorway for the attacker
    to step in the system and interact with the device even if the device appears
    totally locked. There are different interfaces available that may vary from device
    to device.


    The debugging test pins on the interface of the IoT device are most effective
    physical hardware attack vectors available to an attacker. The most known interfaces
    are *UART* (Universal Asynchronous Receiver/Transmitter) which is popularly known
    as a serial interfacing protocol which allows data to be transferred without the
    requirement of external clock and thus it is called asynchronous. UART acts as
    an intermediary between a parallel and a serial interface. It is particularly
    useful to sniff debug and boot up messages and logs, obtain shell access, etc.
    In the real-world IoT devices, UART grants to directly obtain unauthenticated
    root access which in turn allows an attacker to enter into the system. *SPI* (serial
    peripheral interface) is, unlike UART, a synchronous serial communication interface.
    It requires a clock to facilitate communication. It can be used for dumping the
    firmware from the device. SPI works on the master–slave architecture. In this
    architecture, one device sends data and the other device receives data. The pinouts
    on SPI are named MISO (master out slave in) and MOSI (master out slave in). *I2C*
    (inter-integrated circuit) also works on the master–slave architecture and allows
    multiple slave chips to communicate with one master. The usage is pretty similar
    to SPI \[[11](#Ch04.xhtml#ref4_11)\]. *JTAG* is a hardware access point that enables
    one or more devices to connect over externally facing pins for debugging purposes.
    JTAG is used for two main purposes, first is called boundary scan and second is
    called debug access. The boundary scan is a simple form of debugging that makes
    sure that all of the devices are connected correctly. Debug access provides a
    way to talk to intelligent devices and catch its raw live computation. This is
    very powerful since it allows the access to registers, memory contents, interrupts,
    and the ability to pause and redirect flow of instruction. When an IoT device
    has some secret on it, this technique can use debug access to actually read the
    contents of memory and pull that secret out of the memory chip. Some CPUs have
    JTAG interfaces built into it and some don’t. Many board designers expose these
    CPU capabilities with easy to access pins for debugging purposes \[[12](#Ch04.xhtml#ref4_12)\].


    ### **4.6.2** **oftware and Cloud Components**'
