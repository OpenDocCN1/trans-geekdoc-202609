- raw: 'Most of the vendors are more focused on the solutions they can provide to
    the organization by the pool of sensors, data collection and analysis servers,
    and optimization subroutines. They are little less concern about the security
    issues after implementing the system, which is more important issue. Mere providing
    a customized suite of compatible electronic components with software services
    in IoT implementation is certainly not enough for the organization looking out
    for technology upgrade. Every IoT vendor is aware that security has become the
    prime most concern of organizations since last few years and they have to provide
    the IoT solution equipped with safe and reliable operations through a number of
    firewalls and security protocols. However, there is no common security phenomenon
    by which they can convince their clients on security issues, rather it would require
    a more personalized approach with customized security constraints. To make the
    IoT more effective, the organization should rely on it with confidence which is
    only possible when the vendors have designed the IoT system and implement the
    security measures in line with the organization. So, it is also about the psychological
    faith on the technology and vendors are essentially required to achieve that.


    ## **1.2** **Security: A Major Concern**


    Security has been always a chief concern ever since the beginning of computing.
    People reply more on the technologies which offer them more secured environment
    to work while protecting their privacy and identity. Since IoT came into picture,
    the computing scenario has been shifted from stand-alone computing to more flexible
    collaborative computing. This has raised the security concern once again with
    intensified treat toward the intrusion. It ranges from individual personal information
    hacks to interfered financial transactions and spoofing. Intelligent devices which
    are driven by sophisticated programs are more prone to get ill-programmed. Also,
    the hand-shaking and common collaborative platforms among these devices increase
    the probability of compromising the security measures. However, this is not only
    the opportunity for malicious users but also for programmers to achieve the highest
    level of security to mitigate these security treats.


    Since its evolution, the smart devices of the IoT framework have been efficiently
    delivering their operations. But they also face certain threats to users and their
    personal data because of the ever expanding network.


    ### **1.2.1** **Confidentiality**


    The IoT framework encompasses interconnection of devices, sensors, information,
    and software services. Confidentiality refers to the property of ensuring that
    data or network transactions are readable only by the destination they are meant
    for. The prime goal of confidentiality is to keep focus on identification of devices,
    communication, and sensing, and on the services concerning semantics. The identification
    process handles the task of matching network services to the demand of users.
    Communication deals with linking objects of heterogeneous nature to the specific
    set of services. In the sensing process, the information obtained from various
    smart devices is computed according to the user’s demand and is sent to the IoT
    database or cloud as sensed data. This aggregated block of communication and computation
    is the processing unit of IoT. IoT networks widely use the Datagram Transport
    Layer Security (DTLS) protocol for achieving confidentiality. It provides two-way
    authentication, and its underlying principle could be symmetric encryption and
    elliptic curve cryptography. Data confidentiality is achieved through the implementation
    of HTTPS protocol by enabling an encrypted and secure communication path between
    IoT devices to gateway and from gateway to cloud.


    ### **1.2.2** **Authentication**


    Authentication ensures the validity of a user in the IoT network. An authenticated
    user is identified provided that it possesses the authority of communication among
    its peers. The session keys are generated using session key distribution schemes
    to enforce authenticity and access control. Public key infrastructure (PKI) has
    always been the nerve of Internet security. It ensures the mutual trust and device
    authentication.


    ### **1.2.3** **Data Integrity**


    This property of a secured IoT network deals with the data contained in the devices
    as well as the data flowing between communicating nodes ([Figure 1.1](#Ch01.xhtml#fig1_1)).
    If the data integrity is compromised, it will consecutively result in the exploitation
    of network devices and the entire IoT platform. The data in transit require to
    be protected against modifications. Data integrity can be achieved by using keyed-Hash
    message authentication code technique (HMAC) whose principle is to keep a shared
    private key; since it needs a shared private key, it must be protected just like
    any other cryptographic key.


    ![Figure 1.1 IoT network infrastructure.](Images/fig1_1.jpg)


    [**Figure** **1.1**](#Ch01.xhtml#bck_fig1_1) IoT network infrastructure.


    ### **1.2.4** **Cyber Threats and Their Detection**


    The IoT technology has brought a number of security challenges along with its
    attractive offerings. From a user’s perspective, it has made our daily life activities
    easier and accurate by smart devices. But from a network’s perspective, the expanding
    nature of IoT networks is vulnerable to powerful cyberattacks.


    The cyberattacks can be aimed for:


    *   Deteriorating physical devices and appliances connected to the IoT network.


    *   Misusing the incoming and outgoing network traffic.


    *   Halting the network operation.


    Various attack detection techniques can be deployed at routers and switch levels.
    For example,


    *   Intrusion prevention systems (IPSs)


    *   Firewalls


    *   Intrusion detection systems (IDSs)


    *   Access control lists (ACLs)


    IDS is a potential solution for threat detection and prohibits the misuse of IoT
    smart devices. The IDS is implemented on the border routers. It monitors the in–out
    network traffic and alarms upon the detection of malicious activities. This proactive
    detection mechanism is, however, not a suitable solution for deep packet inspection.


    ### **1.2.5** **Threat Mitigation**


    It is a reactive measure after a threat has been reported. It investigates the
    impact of a threat on the network and the infected areas of the IoT network. The
    current IoT networks require models for combined cyber security and physical security.
    For example, the banking industry has information security that uses Honeypots
    to know the loopholes that could be targeted points for an attacker. Honeypot
    focuses on a number of services, such as HTTP, SMPT, SSH, FTP, etc. It offers
    the advantage of presenting a transparent outlook of prediction of current and
    future attacks.


    ### **1.2.6** **Malware Resistance**


    A malware in an IoT network poses itself as a legitimate network user/device and
    attempts to authenticate with common username and password. It successfully bypasses
    the login mechanism, and then raises destructive commands to exploit data integrity
    and to lead to disruptive device chapters. It could further kill the Internet
    connection and make the device unusable. It could either over-write device configurations
    or erase it and may also wipe out the external hard drives.


    A Mirai malware launched a destructive attack on October 2016, which was a category
    of DDoS. It was written in C, and targeted the embedded devices with Linux-based
    platforms such as-CCTVs, DVRs, routers, etc. It had the property of self-propagation
    by brute-force telnet passwords. The malware launches malicious code. This code
    can arrive in a device via spam mail or images and automatically triggers the
    installation when it opens.


    Defense against Mirai:


    *   By securing IoT devices with a strong password. Timely backups should be done,
    and network traffic should be captured and analyzed with expert professionals.'
