    ### **6.5.1** **Observation for Association Rules Mining (ARM)**


    1.  The rules show the possibility of picking the parameter combination and with
    respect to their correlation.


    2.  For support of less than 10% and confidence of 80% and above, the numbers
    of rules are high in number and item set cardinality is outsized. This indicates
    the possibility of picking the similar parameters for key by a small number of
    people, and the combinations are too large to evaluate.


    3.  With support greater than 10% and less than 40%, and confidence of 80% and
    above, the number of rules is rational but needs rigorous efforts to evaluate.
    However, its usefulness is doubtful as many parameters are out of consideration
    due to high support.


    4.  With support greater than 40%, and confidence level of greater than or equal
    to 80%, although rules are very few and have limited parameters, it is easy to
    evaluate, but at the same time, chances of finding the natural rules are high.


    Enabling the cryptanalyst with advanced tools is always in demand for identification
    of weakness and further improvement of cryptosystem. In polynomial time, cryptanalyst
    is interested in extracting useful guesses for detecting original information,
    from huge corpus of ciphers. The cryptanalyst may have captured large database
    and corpus containing a variety of ciphers and hash files. When a cipher text
    is inserted into this dataset, it might get mixed within other ciphers generated
    from various other schemes, including variations in key size, protocol, type of
    cipher generation algorithm, degree of exposures of information concerned with
    key space, and lots of other information related to plaintext, ciphertext, and
    relationship between them. The cryptanalyst may develop a mechanism that will
    classify, sort, and group according to cipher type.


    ## **6.6** **Conclusion**


    Success of any IoT application relies on the security of associated information
    and their testing frameworks. To design more secured and attack-proof IoT-enabled
    information system, more specific cryptographic approaches are needed. Also, data
    retrieval and processing are the integral parts of the whole IoT-based information
    system that need to be protected through high-level encryption. More advanced
    wireless protocols with strict keys are available for IoT security deployment.
    One such approach is based on the usage of an AVK, which is discussed in this
    chapter with a detailed analysis with variation in support and confidence. Although
    even after using the best encryption scheme, the device or network of the IoT
    system will remain vulnerable against the attacks. If there is no way to establish
    the authenticity of the data being communicated to and from an IoT device, the
    security may certainly be compromised. To resolve this issue, the AVK schemes
    may be useful for building. The proposed model has been tested and analyzed with
    multiple parameters, number of frequent sets, and number of association rules
    to be generated. The proposed AVK-based parametric model is user-friendly and
    yet harder from cryptic mining perspectives.


