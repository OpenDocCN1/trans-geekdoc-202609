- raw: "6.  **Faster transactions:** The superior feature of Blockchain is its computing\
    \ time. Blockchain models the P2P communication by public key cryptography. Centralized\
    \ databases create more computing overhead.\n\n7.  **Lower transaction costs:**\
    \ The costs of transactions reduce significantly since there is no intermediate\
    \ third party.\n\n## **5.6** **Challenges of Blockchain in IoT**\n\n![](Images/fig0002.jpg)\n\
    \n1.  **Scalability:** The ever-growing IoT network might lead to the issue of\
    \ centralization in the near future, and with the growing pace of time, it might\
    \ require the management of records which would be a dark cover on the future\
    \ of this promising technology.\n\n2.  **Issues of legal and compliance contracts:**\
    \ The current Blockchain models in the IoT environment are not bounded by compliance\
    \ regulations, but the service providers and IoT manufacturers might face some\
    \ serious problems since IoT is entirely a new ecosystem. Certain business threats\
    \ cannot be escaped by the use of Blockchain technology.\n\n3.  **Lack of skills:**\
    \ The concept of Blockchain is an emerging trend and not much experts are available\
    \ for its implementation domain. Industries require hiring of teams and proficient\
    \ engineers for deploying and maintaining the Blockchain model.\n\n4.  **Storage:**\
    \ The Blockchain model drives out the centralized server for storing device ID’s\
    \ and transactions, but the block of valid records or the ledger must be stored\
    \ at devices only. The subsequent storage of ledgers elevates the size of storage\
    \ required. Most of the smart devices such as sensors do not have enough storage\
    \ potential and thus concern for sufficient storage space arises. In the end of\
    \ 2016, the Blockchain size reached more than 90 GB. Thus, storage is an important\
    \ disadvantage.\n\n5.  **Processing time and power:** The IoT systems being integrated\
