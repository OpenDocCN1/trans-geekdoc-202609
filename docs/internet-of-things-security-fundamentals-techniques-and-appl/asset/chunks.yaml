    2.4](#Ch02.xhtml#fig2_4)):

    * The resource object of the capability (`Service A` in Figure 2.4); it can be
    a specific data or device, a service, or any accessible element that can be univocally
    identified and/or actable on (like resource);

    * The authorization capability that details the granted rights (and which ones
    can be delegated and, in case, their delegation depths), the resource on which
    those rights can be exercised, the grantee’s identity, as well as additional information
    (e.g., capability validity period, `XACML` conditions, etc.). An authorization
    capability is valid as specified within the capability itself or until it is explicitly
