- raw: 'With the boom of the Internet of things (IoT), cybercrime will not only be
    limited to gaining information of credit card details and database information
    associated with it, but also penetration to items of real life and the human body.
    IoT has enabled computer moving on the wheels (self-driving cars) and flying computing
    devices (smart aero-gadgets and planes) to scanners (MRI) and insulin pumps. However,
    it is difficult to estimate and analyze how secure these instruments are compared
    to stand-alone/connected stationary computers. There are fair chances that cybercriminals
    and hackers may control the human-less cars and even pacemakers from remote locations.
    By proactive alertness, such security issues can be improved. Apart from IoT perspectives
    of information security, the cloud-based security issue is also a growing concern.
    The rationale for considering cloud perspective is that IoT data are stored and
    processed in the cloud that provides the benefit of agility, storage capacity,
    performance, and high availability. The third party providing this service needs
    to explore secure storage of this massive stored information. The protection of
    data on to the cloud is not an easy job. Many organizations protect the data that
    live in traditional on-site data centers, but with cloud-based IoT information
    repository, there are a different set of challenges due to dependence on the cloud.


    The level of responsibility and degree of information to be secured are a big
    challenge together with the following issues in storing and retrieving from the
    available alternatives:


    1.  *Lack of resource utilization:* When organizations move only non-critical
    data to the cloud, the potential of the cloud is underutilized and it limits the
    growth of business.


    2.  *Application of existing solutions to the cloud:* By using intelligent application
    of the encryption process across the cloud infrastructure, data can be secured.
    Organizations take their current data center security solution and apply them
    to the cloud. The data stored on the cloud are shared by multiple organizations
    and managed by administrators or employees of the organizations. However, the
    sharing of cloud infrastructure may have several issues like: Data governance,
    regulatory, and compliance issues. These solutions focus on parameter security
    and access control. They do not protect the data itself. With multi-tenancy in
    the cloud, it needs radically different concepts of parameters and access control
    for protection of data. Cloud data protection is considered to be the biggest
    roadblocks for organizations planning to the cloud. Using efficient encryption
    techniques is the only choice for securing your data in cloud, because your data
    are kept on a machine that is shared by multiple machines. It significantly reduces
    the risk associated with many data governance and regulatory compliance issues.


    3.  *Prevention and risk mitigation*: An organization must follow the necessary
    measures to prevent the loss of information and must be prepared to fortify its
    security against malicious attempts to steal organization’s confidential information.


    4.  *Understand what is being shared and who is taking care of* information security
    at cloud: The organization must have full knowledge and vision about facilities
    from cloud service providers.


    Besides the above four points for securing information, *encryption at end-user-service*
    is also another alternative. The encryption at the user end is the approach of
    encoding data at the origin (user end), and then it is sent to the cloud storage
    provider. The encryption key of the user is not available to the cloud service
    provider, making it hard or impossible for cloud storage provider to decipher
    data at the cloud. This schema allows the maintaining zero-knowledge system whose
    host is unable to access the data, and ensures a high level of privacy and exceptionally
    robust data security strategy. It eliminates the secret data to be viewed by third
    entity including service provider, and client-side encryption ensures that data
    and files that are stored in the cloud can be viewed only on the client side of
    the exchange. This prevents data loss and the unauthorized disclosure of private
    or personal files, providing increased peace of mind for both personal and business
    users. Thus, confidentiality, integrity, and authenticity of information can be
    achieved to protect IoT data. Recently, many organizations are providing this
    facility (Confidentiality, Integrity and Authenticity of information). As of the
    beginning of 2016, none of the big-giants are providing client-side encryption.


    The biggest challenge of leaving security at the client side or end-user side
    is mishandling of keys, poor selection, and choice of keys or passwords. An example
    of a poor key would be typically having a key like “1234abcd” or date of birth
    or “qwerty” or a similar random password chosen by users that risks the safety
    of the system. It basically results in choosing a key from information that is
    available from public–social domain, or easy to guess.


    ## **6.2** **The Classical Model of Automatic Variable Key (AVK)**


    “Perfect Secrecy” is the requirement of a cryptosystem, where after a cryptogram
    is attacked by an intruder, the posterior probability of this cryptogram is the
    same as the prior probability of the same messages before the interception \[[1](#Ch06.xhtml#ref6_1),
    [2](#Ch06.xhtml#ref6_2)\]. It reveals that perfect secrecy is surely achievable
    but the condition is that if the number of messages is finite, then the same number
    of possible keys should be there, or if the message is thought of being constantly
    generated at a given rate, the key must be generated at the same or at a higher
    rate \[2–[5](#Ch06.xhtml#ref6_5)\].


    Secured transport of information over the network is a pertaining research challenge
    in today’s context. The problem continues to aggregate with an increasing volume
    of network traffic, which is evident from several research studies \[[12](#Ch06.xhtml#ref6_12),
    [14](#Ch06.xhtml#ref6_14), [15](#Ch06.xhtml#ref6_15)\]. Security basically refers
    to the protection of the data against intentional modification, loss or damage,
    and fabrication of data and/or deliberate disclosure of data to unauthorized persons
    or miscreants. In the classical paper on Information Security, Shannon, the father
    of Information theory has already established that perfect security can be achieved
    only when the key is made to vary from session to session and/or data to data
    \[[6](#Ch06.xhtml#ref6_6), [7](#Ch06.xhtml#ref6_7)\].


    ## **6.3** **Mechanism of Variation in Key of Automatic Variable Key (AVK) Framework**


    Realization of the time variable key is difficult to achieve, as a key must be
    communicated between the sender and the receiver \[1, [3](#Ch06.xhtml#ref6_3)\]
    from time-to-time. The automatic variable key (AVK) for a session between Alice
    and Bob is to be sent initially as K[0], and they exchange data D[0]. The key
    is now variable, and after every transmission, it changes dynamically such that:
    with initial key *K*[0] *initial secret key*, the future keys can be constructed
    by *K*[*i*] = *K*[*i*−1] ⊕ *D*[*i*−1], ∀[*i*−1] > 0, where *D*[*i*−1] *and K*[*i*−1]
    *are data and key of* (*i*–1)*th session.*'
