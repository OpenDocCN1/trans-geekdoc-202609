    受损的安全系统会导致智能家居系统中的安全漏洞暴露。设想一下，如果攻击者能够控制门上的安全摄像头并记录用户输入的门锁密码，那么攻击者就可以轻松利用这些信息在用户不在家时进入家中。因此，房屋中的所有安全系统都必须得到充分保护。第三，智能家居不应允许
    *窥探通信系统*。大多数家庭通信系统都配备了视频会议设备、计算机、打印机、电话等设备。用户能够使用这些设备与家外的其他设备和其他人进行通信。攻击者可以通过被动攻击窃取有价值的信息，即用于在不实际更改任何数据或代码的情况下获得未经授权访问的攻击。这可能导致监控电话通话和电子邮件信息，并追踪人们如何与设备交互。因此，所有通信系统也必须对安全漏洞给予高度重视。


    ## 4.10 Conclusion

    安全是物联网的主要关注点。由于数十亿台设备正在连接到互联网，这些设备的安全问题也在日益增加。本章讨论了包括设备、接口以及软件和云组件在内的攻击点，并讨论了用于保护物联网设备之间通信（客户端与服务器、机器对机器等）的通信层安全协议，如
    SSL/TLS 和 DTLS、MQTT、CoAP、XMPP 和 AMQP。安全是物联网的重要方面，因为它有助于保护有价值的数据并避免数据被滥用。如本章所述的安全问题，必须在当前正在运行的以及未来开发的所有物联网系统中得到充分识别和实施。通过执行这些安全问题，可以开发出安全且适合更好生活的物联网系统，从而保障互联的未来。


