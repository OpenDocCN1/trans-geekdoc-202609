    considered as a safe option for IoT data processing. But as usual, if the processed
    output is sent to the central repository, it might be exposed to a security threat.


    ## **3.6** **A General Discussion on the Security and Privacy Issues in IoT**


    IoT has attracted ample attention of people from every sector. Everyone is in
    the flurry to taste the water and be among the forerunners in wringing the juice,
    without much planning and consideration. But it will be hazardous to overlook
    the additional security menaces that it brings to the cyber world. In the consumer
    IT space, IoT has immense promise in the areas of Smart Grid, intelligent transportation
    system, smart healthcare, intelligent water and waste management, and intelligent
    public safety and surveillance. All these above components form an integral part
    of the smart city that many governments are now planning to launch. Consequently,
    due to the inherent communication ability of these smart devices, the consideration
    of security and privacy of the exchange of data between the device and the controlling
    unit becomes paramount. As healthcare industry is likely to be a major beneficiary
    of IoT-enabled devices, the protection of patient sensitive data is critical for
    the wider adoption of IoT.


    Most of the IoT devices are easy to access that makes them vulnerable to attacks.
    Security attacks like data tampering, deactivation, and tag detaching can make
    the scenario really challenging for IoT systems along with usual networking threats
    such as spoofing, eavesdropping, denial of service, etc. The key vulnerable areas
    are – an insecure web interface, insufficient authentication/authorization, insecure
    network services, and lack of transport encryption. IoT exposes users to identity
    theft and security breaches. IoT devices are easier to hack compared to the other
    typical target devices (e.g., computers, tablets, and smartphones), mainly because
    IoT devices are with a limited capacity and cannot afford to run protective applications
    (e.g., complex encryption and decryption techniques and anti-virus software) on
    their own. Hackers require minimal resources to bring down any IoT system, say,
    by launching DDoS (distributed denial of service) attacks. IoT botnets are becoming
    as favorite armament to carry out this and are shoving their feet even deeper
    with the proliferation of IoT adoptions.


    The existing security technologies may be handy to some extent but they are not
    enough. For example, since the IoT devices shall communicate with each other and
    with the controller using the telecom network or other open networks, the current
    network authentication mechanisms (e.g., IMEI \[[23](#Ch03.xhtml#ref3_23)\] and
    ESN \[[24](#Ch03.xhtml#ref3_24)\]) may not be sufficient. Novel approaches and
    technologies (e.g., blockchain \[[25](#Ch03.xhtml#ref3_25)\]) are required to
    ensure the privacy and security of IoT data. Because of the heterogeneity of the
    devices, it is essential that we are prepared for new attacks and plan innovative
    defenses. Government and organizations should deploy risk assessment frameworks
    (e.g., NIST \[[26](#Ch03.xhtml#ref3_26)\] and COSO \[[27](#Ch03.xhtml#ref3_27)\])
    and opt for an effective policy framework for safeguarding their sensitive data.
    Countries are at different stages of implementation of regulatory guidelines depending
    upon their threat perception. The regulators play a crucial role in operationalizing
    IoT framework including the guidelines for data transfer and storage. Governments
    must step into the scenario for regulating and controlling IoT security. The Government
    not only should set security standards but also set standards for the IoT devices
    that come into the market and frame strict policies and rules that are to be followed
    by all the stakeholders \[[28](#Ch03.xhtml#ref3_28)\]. Though this will be difficult
    to implement for a globally networked system like Internet due to several in intercontinental
    obligations, technologies such as blockchain can play a big role in it thanks
    to its qualities that include completely decentralized and P2P, autonomous, open,
    and secure \[[29](#Ch03.xhtml#ref3_29)\].


    ## **3.7** **An Off-the-wall Outlook on Security and Privacy Concerns for IoT**


    As more people are coming across IoT, more we are hearing about the dangers of
    its security vulnerability. The popular presumption is that the widespread and
    pervasive adoption of IoT with the lack of security standards, measures, and practices
    offers the picnic party to the hackers. They can explode the refrigerator at home,
    take control of our car while we are driving, set the whole city into the dark
    by taking hold of the Smart Grid, get hold of weapons of our soldiers, and so
    on \[[30](#Ch03.xhtml#ref3_30)\]. In short, they can take down anything that has
    been connected. But aren’t we reacting aberrantly? Since inventing the Internet
    and the WWW, we have been connected. Have we really faced that kind of cyber devastation?
    Then why are we losing nerve now? Not every IoT systems are that risky and some
    of them require the least attention in that aspect. The security risk should be
    assessed based on the IoT application. For example, suppose someone is playing
    remotely with my home electricity connection by connecting and disconnecting my
    home line to the Grid and in another case, he has put the whole city into darkness
    for a week by making an irreparable fault in the Grid. Of course, both cases are
    scary but the second case is of more concern. Consider another case that it would
    be much more concerning if somebody takes control of my car while I am driving
    rather than if someone has hacked into the car’s music system and playing it a
    whole night while it is in the garage. The point is that it is to be understood
    that every IoT use case has different security apprehension, and instead of being
    frenzied about the whole IoT, appropriate precautionary measures should be applied
    case basis based on the degree of the risk.


    While we are more concern about the fictional ghoul who can get hold of the IoT
    and we shall be doomed, we may have been overlooking the bigger menace pertaining
    to our privacy. IoT has set its foot in every territory of our life including
    our bedroom. It records our eating and sleeping habits, it records our health
    status and medical history, it records our purchasing behaviors, it records where
    we are traveling, and it records our digital footprints and what not! In short,
    it keeps an eye on whatever we are doing in our daily life. If unscrupulous people
    can get their hands on these data, we would be perturbingly exposed to them. Using
    advanced analytical tools, they can uncover every detail of us of which we ourselves
    may not be aware of. And to do this, it is not necessary to be always illegal.
    Because the data are everywhere, the hunter just has to tap in the right place.
    So, instead of that imaginary devil who can breach the security of our IoT devices,
    we should be more concern about all those existing devils that are after our personal
    data \[30\].


    ## **3.8** **Conclusion**'
