- raw: ": Ethereum is a blockchain-based decentralized platform for apps that run\
    \ smart contracts, and is aimed at solving issues associated with censorship,\
    \ fraud, and third party interference. \n\n*EVM* \n\n: The Ethereum Virtual Machine\
    \ (EVM) is a Turing complete virtual machine that allows anyone to execute arbitrary\
    \ EVM Byte Code. Every Ethereum node runs on the EVM to maintain consensus across\
    \ the blockchain. \n\n **F**\n\n*Fork* \n\n: Forks create an alternate version\
    \ of the blockchain, leaving two blockchains to run simultaneously on different\
    \ parts of the network. \n\n**G**\n\n*Genesis Block* \n\n: It is the first or\
    \ first few blocks of a blockchain. \n\n**H**\n\n*Hard Fork* \n\n: It is a type\
    \ of fork that renders previously invalid transactions valid, and vice versa.\
    \ This type of fork requires all nodes and users to upgrade to the latest version\
    \ of the protocol software. \n\n*Halving* \n\n: Bitcoins have a finite supply,\
    \ which makes them a scarce digital commodity. The total amount of bitcoins that\
    \ will ever be issued is 21 million. The number of bitcoins generated per block\
    \ is decreased 50% every four years. This is called “halving.” The final halving\
    \ will take place in the year 2140. \n\n*Hash* \n\n: It is the act of performing\
    \ a hash function on the output data. This is used for confirming coin transactions.\
    \ \n\n*Hash Rate* \n\n: Measurement of performance for the mining rig is expressed\
    \ in hashes per second. \n\n*Hybrid PoS/PoW* \n\n: A hybrid PoS/PoW allows for\
    \ both proof of stake and proof of work as consensus distribution algorithms on\
    \ the network. In this method, a balance between miners and voters (holders) may\
    \ be achieved, creating a system of community-based governance by both insiders\
    \ (holders) and outsiders (miners). \n\n**I**\n\n*Initial Coin Offering (ICO)*\
    \ \n\n: An initial coin offering (also called an ICO) is an event in which a new\
    \ cryptocurrency sells advance tokens from its overall coinbase, in exchange for\
    \ upfront capital. ICOs are frequently used for developers of a new cryptocurrency\
    \ to raise capital. \n\n **L**\n\n*Ledger* \n\n: It is an append-only record store,\
    \ where records are immutable and may hold more general information than financial\
    \ records. \n\n*Litecoin* \n\n: It is a peer-to-peer cryptocurrency based on the\
    \ Scrypt proof-of-work network. Sometimes it is referred to as the silver of bitcoin’s\
    \ gold. \n\n**M**\n\n*Mining* \n\n: Mining is the act of validating blockchain\
    \ transactions. The necessity of validation warrants an incentive for the miners,\
    \ usually in the form of coins. In this cryptocurrency boom, mining can be a lucrative\
    \ business when done properly. By choosing the most efficient and suitable hardware\
    \ and mining target, mining can produce a stable form of passive income. \n\n\
    *Multi-Signature* \n\n: Multi-signature addresses provide an added layer of security\
    \ by requiring more than one key to authorize a transaction. \n\n**N**\n\n*Node*\
    \ \n\n: It is a copy of the ledger operated by a participant of the blockchain\
    \ network. \n\n**O**\n\n*Off-Ledger Currency* \n\n: It is a currency minted off-ledger\
    \ and used on-ledger. An example of this would be using distributed ledgers to\
    \ manage a national currency. \n\n*On-Ledger Currency* \n\n: It is a currency\
    \ minted on-ledger and used on-ledger. An example of this would be the cryptocurrency,\
    \ Bitcoin. \n\n*Oracles* \n\n: Oracles work as a bridge between the real world\
    \ and the blockchain by providing data to the smart contracts. \n\n**P**\n\n*Peer\
    \ to Peer* \n\n: Peer to peer (P2P) refers to the decentralized interactions between\
    \ two parties or more in a highly interconnected network. Participants of a P2P\
    \ network deal directly with each other through a single mediation point. \n\n\
    \ *Public Address* \n\n: A public address is the cryptographic hash of a public\
    \ key. They act as email addresses that can be published anywhere, unlike private\
    \ keys. \n\n*Private Key* \n\n: A private key is a string of data that allow you\
    \ to access the tokens in a specific wallet. They act as passwords that are kept\
    \ hidden from anyone but the owner of the address. \n\n*Proof of Stake* \n\n:\
    \ It is a consensus distribution algorithm that rewards earnings based on the\
    \ number of coins you own or hold. The more you invest in the coin, the more you\
    \ gain by mining with this protocol. \n\n*Proof of Work* \n\n: It is a consensus\
    \ distribution algorithm that requires an active role in mining data blocks, often\
    \ consuming resources, such as electricity. The more “work” you do or the more\
    \ computational power you provide, the more coins you are rewarded with. \n\n\
    **R**\n\n*Ripple* \n\n: It is a payment network built on distributed ledgers that\
    \ can be used to transfer any currency. The network consists of payment nodes\
    \ and gateways operated by authorities. Payments are made using a series of IOUs,\
    \ and the network is based on trust relationships. \n\n*Replicated Ledger* \n\n\
    : It is a ledger with one master (authoritative) copy of the data and many slave\
    \ (non-authoritative) copies. \n\n**S**\n\n*Scrypt* \n\n: Scrypt is a type of\
    \ cryptographic algorithm and is used by Litecoin. Compared to SHA256, this is\
    \ quicker as it does not use up as much processing time. \n\n*SHA-256* \n\n: SHA-256\
    \ is a cryptographic algorithm used by cryptocurrencies such as Bitcoin. However,\
    \ it uses a lot of computing power and processing time, forcing miners to form\
    \ mining pools to capture gains. \n\n *Smart Contracts* \n\n: Smart contracts\
    \ encode business rules in a programmable language onto the blockchain and are\
    \ enforced by the participants of the network. \n\n*Soft Fork* \n\n: A soft fork\
    \ differs from a hard fork in that only previously valid transactions are made\
    \ invalid. Since old nodes recognize the new blocks as valid, a soft fork is essentially\
    \ backward-compatible. This type of fork requires most miners upgrading in order\
    \ to enforce, while a hard fork requires all nodes to agree on the new version.\
    \ \n\n*Solidity* \n\n: Solidity is Ethereum’s programming language for developing\
    \ smart contracts. \n\n**T**\n\n*Testnet* \n\n: It is a test blockchain used by\
    \ developers to prevent expending assets on the main chain. \n\n*Transaction Block*\
    \ \n\n: It is a collection of transactions gathered into a block that can then\
    \ be hashed and added to the blockchain. \n\n*Transaction Fee* \n\n: All cryptocurrency\
    \ transactions involve a small transaction fee. These transaction fees add up\
    \ to account for the block reward that a miner receives when he successfully processes\
    \ a block. \n\n*Turing Complete* \n\n: Turing complete refers to the ability of\
    \ a machine to perform calculations that any other programmable computer is capable\
    \ of. An example of this is the Ethereum Virtual Machine (EVM). \n\n**U**\n\n\
    *Unpermissioned ledgers* \n\n: Unpermissioned ledgers such as Bitcoin have no\
    \ single owner – indeed, they cannot be owned. The purpose of an unpermissioned\
    \ ledger is to allow anyone to contribute data to the ledger and for everyone\
    \ in possession of the ledger to have identical copies. This creates censorship\
    \ resistance, which means that no actor can prevent a transaction from being added\
    \ to the ledger. Participants maintain the integrity of the ledger by reaching\
    \ a consensus about its state. \n\n **W**\n\n*Wallet* \n\n: It is a file that\
    \ houses private keys. It usually contains a software client which allows access\
    \ to view and create transactions on a specific blockchain that the wallet is\
    \ designed for. \n\n## **References**\n\n*   \\[1\\] Available at: https://blockgeeks.com/guides/blockchain-glossary-from-a-z/\n\
    \n*   \\[2\\] Available at: http://www.blockchaintechnologies.com/blockchain-glossary\n\
