  trans: "\n\n# 数据科学手绘笔记\n\n**Raymond Lim**  \n@MinuteData  \n\n版权所有 © 2025 Raymond\
    \ Lim  \n保留所有权利。未经作者明确书面许可，本书或其任何部分不得以任何形式复制或使用，书评中引用简短片段除外。\n\nISBN 9798317027308\
    \  \n通过 Amazon KDP 出版\n\n---\n\n## 简介\n\n2018 年的一个春日，我漫步经过儿时的母校小学。我透过窗户张望，想看看能否认出当年的老师。没有——那是一位年轻的老师正热情地教一年级学生认识形状……用的是\
    \ PowerPoint！说我老派也好，但当形状只需在 PowerPoint 幻灯片上神奇地出现时，孩子们该如何学会画图呢？！\n\n快进到 2024 年。我正通过在线课程、YouTube\
    \ 视频和手机应用准备数据科学面试。然而，作为一个在智能手机普及前上学的千禧一代，被动地刷屏在线内容根本行不通。\n\n不久，我开始制作 TikTok 视频，用彩色记号笔手绘数据科学主题，希望其他人能跟着一起画。本书即是那些手绘笔记的汇编。\n\
    \n**适读人群：** 曾学习过统计学、机器学习、计量经济学、SQL，想通过生动的单页笔记复习巩固的人群（可视为闪卡！）。本书有意保持非正式、多彩且原生态的风格。你会看到涂鸦、修正、难以辨认的手写字迹，这些都将促使你更主动地学习。\n\
    \n**关注社交媒体配套视频！**\n\n- tiktok.com/@MinuteData\n- youtube.com/@MinuteData\n- instagram.com/MinuteData\n\
    - facebook.com/MinuteData\n- minutedata22@gmail.com\n\n**关于作者：** Raymond Lim 毕业于哥伦比亚大学，那时尚未开设数据科学课程。他在学术界担任经济学研究员、医疗领域担任生物统计师、Meta\
    \ 和 Google 担任数据科学家，累计工作 15 年以上。他还是一位拉丁舞舞者！\n\n---\n\n## 目录\n\n### 第 1 部分：监督学习\n\
    \n1. 监督学习 vs 无监督学习\n2. K 近邻算法\n3. 决策树\n4. 随机森林\n5. 梯度提升树\n6. 梯度下降\n7. 支持向量机\n\
    8. 偏差-方差权衡\n9. 交叉验证\n10. 正则化 - Lasso 回归 vs Ridge 回归\n11. 超参数调优\n12. 逐步特征选择\n13.\
    \ 朴素贝叶斯\n14. 协同过滤\n15. Bagging vs Boosting vs Stacking\n16. 多臂老虎机\n\n### 第 2 部分：无监督学习\n\
    \n17. K 均值聚类\n18. 层次聚类\n19. 密度聚类\n20. 如何确定簇数量？Calinski 指数\n21. 树状图\n22. 距离度量\n\
    23. 余弦相似度\n24. 字符串距离\n25. 土方距离\n26. 主成分分析\n27. 主题建模 - 隐含狄利克雷分布\n\n### 第 3 部分：概率与统计\n\
    \n28. 测量层级\n29. 伯努利分布 vs 二项分布\n30. 大数定律 vs 中心极限定理\n31. 贝叶斯定理\n32. 蒙提霍尔问题\n33.\
    \ 方差、标准差\n34. 置信区间\n35. 标准正态分布\n36. 变异系数\n37. P 值\n38. 第一类错误 vs 第二类错误\n39. 双变量检验\n\
    40. 皮尔逊相关系数\n41. 卡方检验\n42. 方差分析 (ANOVA)\n43. 秩和检验\n44. Wilcoxon 符号秩检验\n45. 准确率、精确率、召回率\n\
    46. ROC 曲线\n47. 标准化、特征缩放\n48. 异常值检测\n49. 对数变换\n50. 温莎化处理\n51. 缺失数据\n52. 切换回溯实验\
    \ / Switchback Test\n53. Kolmogorov-Smirnov 检验\n54. 信度、效度\n55. 样本量计算\n56. 多重比较\n\
    57. 区组抽样 vs 分层抽样\n58. Anscombe 四重奏\n59. 幂律分布\n60. 幸存者偏差\n61. 荟萃分析\n\n### 第 4 部分：计量经济学\n\
    \n62. 线性回归\n63. OLS 推导\n64. 交互效应\n65. Chow 检验 (结构性断点)\n66. 线性概率模型\n67. 逻辑回归\n\
    68. 有序逻辑回归\n69. 截尾回归 (Tobit 模型)\n70. 泊松回归\n71. R 平方\n72. 异方差\n73. 多重共线性、方差膨胀因子\n\
    74. 标准化系数\n75. 向均值回归\n76. 样条回归\n77. 辛普森悖论\n78. 固定效应 vs 随机效应\n79. Hausman 检验\n\
    80. 作为能力的固定效应\n81. 因果推断\n82. 倾向得分匹配\n83. 双重差分法\n84. 回归不连续设计\n85. 两阶段最小二乘法；工具变量\n\
    86. Heckman 选择模型\n\n### 第 5 部分：SQL\n\n"
