    # 结束语


    在线课程、教育应用和 AI 摘要让学习变得触手可及。我们获取的信息比以往任何时候都多，却几乎只能记住其中的一半。下次学习新知识时，把它写下来！画图、涂鸦、擦除、划掉、随意绘画！你可能会惊讶地发现，自己能记住的东西会多得多！


