    \ through Amazon KDP\n\nIntroduction\n\nOne spring day in 2018, I strolled past\
    \ my childhood elementary school. I glanced through the windows to see if I’d\
    \ recognized the teacher. Nope - it was a young teacher enthusiastically teaching\
    \ first graders shapes… using PowerPoint! Call me old-school, but how are kids\
    \ learning how to draw shapes when they just magically appear on PowerPoint slides?!\n\
    \nFast forward to 2024. I was preparing for data science interviews using online\
    \ courses, YouTube videos and mobile apps. However, as a millennial who went to\
    \ school before smartphones, passively scrolling through online content did not\
    \ work.\n\nI soon created TikToks drawing out data topics with colorful markers,\
    \ hoping others would draw along. This book is a compilation of those drawings.\n\
    \nWho this book is for: People who previously learned statistics, machine learning,\
    \ econometrics, SQL, and want to refresh with colorful one-pagers (think flash\
    \ cards!). This book is intentionally informal, colorful and raw. You’ll find\
    \ scribbles, corrections, obscure handwriting that will make you learn more actively.\n\
    \nWatch the accompanying videos on social media!\n\ntiktok.com/@MinuteData\n\n\
    youtube.com/@MinuteData\n\ninstagram.com/MinuteData\n\nfacebook.com/MinuteData\n\
    \nminutedata22@gmail.com\n\nAbout the author: Raymond Lim graduated from Columbia\
    \ University before data science classes even existed. He worked for 15+ years\
    \ as an economics researcher in academia, biostatistician in healthcare, data\
    \ scientist at Meta and Google. He’s also a latin ballroom dancer!\n\nTable of\
