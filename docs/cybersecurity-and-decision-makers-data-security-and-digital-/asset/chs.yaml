  # 引言：财务与网络绩效


  为什么不按照其财务和非财务绩效（治理和 `CSR` – 企业社会责任）一样来评估公司的网络绩效呢？


  为什么不通过审计师（其介入对某些规模的公司是强制性的）像认证财务绩效一样认证公司的网络绩效呢？


  尽管取得了一些进展，但大多数股东（因此董事会和管理层）主要关注公司的财务绩效。


  然而，数字时代正在给公司及其生态系统带来剧变。事实上，“全数字化”关乎所有利益相关者、行政部门、公共服务以及国家和国际基础设施、国防和情报部门。


  我们已经到了一个不可不回的阶段，这提供了重要的机会，但也是脆弱性和重大风险的源头，特别是因为网络威胁者正变得越来越专业化，并拥有大量的资源来进行欺诈、间谍活动和破坏。


  公司面临的风险是系统性的：股东在财务上面临风险，而负责制定战略和确保可持续性的董事，如果他们不了解数据安全和信息系统保护，且不确保建立起高水平的网络安全组织、程序和工具，则将在法律上面临风险。


  没有所谓的零风险，说，但如果公司在网络安全领域未采取行动，且攻击对公司的正常运行、盈利和声誉产生了重大影响，那么董事会的疏忽将与此相关。


  财务绩效不应再是首要任务。财务绩效和网络绩效现在应该是治理机构的两个首要任务。


  我们是否应该重新定义由国家行动指定的治理机构，即其能力、运作、议程和合作伙伴？


  五十年来，我们一直在穿过技术海啸：


  - – 1970 年代：大型机；

  - – 1980 年代：`PC`（个人电脑）和客户端/服务器架构；

  - – 1990 年代：`Internet`和电子商务；

  - – 2000–2010 年：移动端和云服务；

  - – 2010–2020 年：“物联网”和人工智能；

  - – 2020–2030 年：量子计算和区块链。


  数字世界是无国界且无实体的，威胁是不可见的。


  数字化及相关新技术正在改变公司的运营方式和商业模式。


  根据美国国家档案馆和记录管理局（`National Archives and Records Administration`）2018 年进行的一项研究，93%丢失数据
  10 天或以上的公司在灾难当年破产，半数（50%）在攻击后立即申请破产。






  问题不在于“我们何时会受到攻击？”，在于“我们能做什么尽可能地保护公司？在发生攻击时我们能做什么？我们如何尽可能快地恢复系统？”


  网络风险是公司以及个人组织不可或缺的一部分（每个人无论作为个体还是作为组织成员都关注此问题）。它不仅仅是一个技术风险。


  人是整个安全链中最薄弱（也是最强大）的环节点。


  本书并不涉及工具（硬件、软件、服务器、架构），而是涉及组织、流程和行为，没有这些，公司就无法提高其性能、安全性、事件或危机管理能力以及韧性。


  它关乎公司行使它们的数字责任，并维护或提高利益相关者的信任：客户、供应商、合作伙伴和投资者。


  仅在 30 年前，我曾见证了个人电脑的到来（当时存在计算机和文字处理软件，但尚未在公司中部署）、财务业务的数字化（会计、成本会计、银行关系和现金管理、税务报表、报告工具、会计和管理合并、与客户和供应商的财务关系），以及人力资源管理的数字化（工资单、社保申报、招聘、培训）、内部外部通信（特别是社交网络的出现）、生产（连接工厂和扩展型企业）、当然还有营销销售以及物流。


  现在，所有公司职能都涉及其中，以及与所有利益相关者的关系：客户、供应商、服务提供商、分包商、股东（个人投资者、投资基金）、董事会、审计师、员工、子公司、代理顾问（对公司股东大会提议发表公开评论的治理顾问）。


  公司已完全数字化：它们的数据、操作、账户、流程是无形的；它们的内部和外部通信、其产品是互联的。


  组织和工作习惯已经改变，技能在不断演变，工具经历了转型，而文档和人的分类有时（往往如此？）被遗忘了。


  得益于超快速通信手段，公司能够实现国际化。我们可以与街对面的公司交流，也可以与美国或中国的人交流：只有时差是无法压缩的。


  公司与其客户、供应商、员工、股东、子公司等共享数据。数字环境为公司提供了创造新业务、新产品和服务以及新客户的机会，以便优化其组织、降低成本、改进其与供应商、服务提供商、分包商、投资者、客户的内部和外部流程（取决于其运营的业务行业）。


  公司的标准取决于其财务表现：账户、结果、资产负债表、现金状况、股价、增长和盈利潜力、非财务表现（其治理及其和社会环境表现），但是……


  它们的网络表现又如何？数据治理、数据安全：完整性、机密性和可用性、对收集、使用和存档的个人数据的保护、对允许交换、存储和修改这些数据的计算机系统的保护。


  公司在财务上可能是成功的，但其 IT 系统或数字安全的故障会严重影响其销售或生产、向供应商付款的能力、与分包商交换的能力，从而损害其财务结果、声誉以及股东和利益相关者的信心。


  网络风险并非公司内部少数专家的特权，而是影响整体治理。除了有关数据安全的监管外，还关乎保护公司免受价值损失的风险，例如与机密信息泄露相关的风险。


  “全连接、全投入、全责任”是 Guillaume Poupard 在 2019 年 FIC[¹] 上作为 ANSSI 传达的口号，涵盖了私营或公共组织的从上到下：董事会、执行委员会和所有团队。


  大国之间的贸易战的媒体关注度高于网络战争，网络战争是国家、恐怖主义和犯罪组织或公司（间谍）广泛使用的武器。此外，数据收集是 21 世纪数字经济的核心，围绕数据价值化构建。这种经济目前由中美互联网巨头主导。最后，网络犯罪分子利用数字工具的许多漏洞、由于未适应的组织产生的人性漏洞、未更新的流程以及未经过培训的员工的人性漏洞。


  受害者中存在网络死亡案例。网络沉默是意识的障碍。最后，有太多高管和董事在掩耳求生。


  1. 国际网络安全论坛（FIC）第 11 届。


  # 1 一个日益脆弱的世界


  ## 1.1 背景


  ### 1.1.1 技术颠覆与全球化


  技术颠覆大多具有数字本质：自动化知识、物联网、先进机器人、3D 打印、云计算（85% 的公司将数据存储在云端；这种做法变得越来越普遍）、移动互联网、自动驾驶车辆。


  直到 2011 年，数字风险或网络风险尚未出现在世界经济论坛的主要风险排名中。


  根据 2019 年世界经济论坛的研究，技术在未来十年中将在风险格局中发挥基础性作用，包括数据窃取（个人数据、公司、公共组织和政府的数据）、身份盗窃和网络攻击，以及致命的“漏洞”，正如波音
  737 MAX 坠机所示。根据《华盛顿邮报》，飞行系统软件中发现了几个缺陷。关于埃塞俄比亚航空坠机的初步调查报告明确地将这一事故归咎于 `MCAS` 失速保护系统的故障，而该系统在五个月前的狮子航空事故中已被识别出来。不仅探头发送的信息是错误的，而且飞行员无法控制飞机。


  这起事故显示了技术或数字故障的风险，以及由独立机构对其进行测试和认证的必要性。它还表明数字事故并不是攻击的结果，而是人为故障（编程、人机交互、流程、组织）：工具通常有“良好的后盾”。


  网络空间由计算机设备（计算机、网络、连接对象、服务器、打印机、路由器等）、软件、应用程序、信息系统以及通过数字工具交换或存储的所有信息组成。连接和流量的发展使得安全成为重大问题，无论是对于国家、公司还是公民。


  ![图 1.1 数字化对所有公司信息系统的影响（根据 CESIN）。要查看此图的彩色版，请访问 www.iste.co.uk/defreminville/cybersecurity.zip](img/image24_c2956.jpg)


  **图 1.1.** *数字化对所有公司信息系统的影响（根据 CESIN）。要查看此图的彩色版，请访问 [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*






  许多技术盲点是数据泄露的根源：


  * – 基于多种不同网络的完全去中心化结构（根据 2019 年 6 月 12 日《时报》纸的报道，6 月初“瑞士电信的数据经过了中国”，荷兰运营商 KDN 的客户，以及法国运营商
  Bouygues 和 Numéricable 的客户也受了影响）；

  * – IP 地址和域名的架构；

  * – 设备的“后门”；

  * – 电信运营商服务设计中的违规之处；

  * – 软件和设备加密工具不足。


  #### 1.1.2 处于工业生产力核心的数据


  随着工业 4.0 技术——`ERP`（企业资源计划）、`CRM`（客户关系管理）、`3D 打印`、扩展型企业——以及数字营销技术——网站、`cookies`、标签管理——或连接式产品和安全监控摄像头，数据已置于各项活动的核心。不同部门在计算机系统和软件中收集并记录大量数据，而公司对所有数据流和映射并没有详细了解。


  理解数据流的地理分布并掌握数据，是企业竞争力以及我们防御能力的一项基础性战略挑战。


  可靠信息和数字身份验证对于公司、用户和 IT 服务提供商至关重要。


  #### 1.1.3 网络空间：一个无边界区域


  黑客很难被识别，攻击者与目标之间存在着真实的不对称性：攻击者虽然资源很少但拥有许多有效武器，而目标拥有更多资源，却无法保证完美的防御。


  网络安全涉及每个国家、每个公司和每个公民的安全与数字主权。它具有重大的政治、经济和社会意义，因此必须从不同角度解决：教育、法律与监管、社会、技术、军事、组织、个人和集体（国家和国际）。


  某些攻击的可能是致命的：例如 2016 年 4 月至 5 月间对`SWIFT`银行间网络进行的攻击，导致孟加拉发生了数千万美元的欺诈盗用；或者 2016 年 10
  月 21 日对`Dyn`服务器的拒绝服务攻击（一种允许动态 IP 用户访问域名的服务），导致美国部分互联网网络瘫痪数小时，并严重干扰了相关的经济活动。


  #### 1.1.4 IT 资源


  对 IT 工具（硬件、软件、网络）的全面了解是企业面临的结构性挑战：他们在过去几十年开发和管理 IT 基础设施的方式——碎片化、孤岛化、在风险较低的时期——使得他们更难进行全球监控，而这对于有效的网络安全管理至关重要。


  ## 1.2 网络犯罪


  ### 1.2.1 网络犯罪的概念


  简而言之，指的是在新技术背景下的犯罪行为。我们也在谈论计算机欺诈。网络犯罪包括非法获取私人、个人或敏感信息。网络犯罪还包括所有准备或执行过程中涉及电子数据处理系统的犯罪，如破坏、间谍活动和数据拦截。


  网络空间提供了犯罪机会：数字服务和基础设施是恶意意图的门户。任何连接设备都可能被破解；有必要确保物理安全与网络安全之间的连续性。


  至于计算机攻击（或网络攻击），媒体每周都会在各大洲、所有行业（工业、银行、医院、酒店、在线销售等）揭示新的案例，涉及所有类型的公司：从初创公司到大型上市集团团，以及任何其他实体，如协会、基金会、市政厅、公共机构和基础设施，甚至是连接物体（监控摄像头、心脏起搏器、儿童玩具）。而媒体揭露的只是冰山一角。公司方面存在沉默的氛围，这是可以理解的：没有公司想透露自己的困境，尤其是他们的网络漏洞。


  计算机的不稳定或入侵之所以成为可能，一方面是因为新技术日益整合到我们生活的方方面面（移动、家居自动化、购物、旅行、银行等）以及公司生活（销售、生产、通信、安全、财务操作、行政、客户关系、供应商、员工、投资者、银行等），另一方面也是公共服务的数字化以及计算机攻击日益复杂化的推动。


  根据埃森哲的一项研究，尽管信息系统受到了越来越多的保护，阻止了更多攻击（从数量和比例而言），但 2018 年的入侵次数与 2017 年相比保持稳定。


  如`图 1.2`所示，计算机攻击并非新现象；它们始于 30 多年前，随着计算机网络和随后互联网的诞生。


  ![Figure 1.2. History (source: Starboard Advisory)](img/image27_c2957.jpg)


  需要注意的是，硬件和软件有时会带有后门自愿出售，这允许软件开发者或硬件制造商利用它们来监控甚至控制软件。这就像建筑商在卖给你房子的同时，手里留着隐藏门的钥匙。


  这些后门使得高效执行维护操作成为，或者在与客户发生分歧时（未支付许可费）禁用软件。


  它们也可以被黑客安装，以复制或破坏价值数据（ID、密码、社会安全号码、银行详情、支付方式、机密信息），或控制计算机并用于执行恶意行动（计算机病毒、拒绝服务、勒索等）。


  攻击者会组织并分工：有些人开门让其他人进入并夺取数据或组织金融欺诈。他们提供的服务（开门）在暗网上进行拍卖。


  最后，关于这个后门问题，各国持有不同意见。俄罗斯立法为出版者提供访问加密通信的方法。“五眼”联盟国家（美国、澳大利亚、新西兰、英国和加拿大的情报机构）也希望引入软件漏洞。


  主要的官方目标是能够破译与恐怖活动相关的某些通信，并在情报机构之间共享信息。它同时也允许国家间谍活动、获取商业秘密以及侵犯个人自由。风险在于这些漏洞可能被恶意分子利用。


  因此，数字信任取决于公司保护系统和数据的能力，也取决于对整个生态系统的保护，包括政府实施的数字战略以及信息系统安全机构为保护设备、应用程序、网络和软件所做的工作。


  ### 1.2.2 五类威胁






  法国国家安全局（ANSSI）确定了 2018 年在法国和欧洲观察到的五大主要网络威胁趋势。


  一些被认为不太可能成为目标的活动领域现在正成为攻击目标。根据 ANSSI 局长吉约姆·普帕尔德（Guillaume Poupard）的说法，例如食品行业正面临这种情况，这意味着没有哪家公司是幸免的。


  2019 年 4 月 10 日至 11 日夜夜，Fleury Michon（一家中型的、家族所有的独立公司，专门从事熟食肉类、即食食品和新鲜鱼糜的制备）遭受了计算机病毒的袭击。为了防止病毒扩散，所有系统均已断开。工厂及物流部门于
  4 月 11 日关闭。经过分析，公司采取了适当的安全措施，以使活动于 4 月 15 日恢复。


  负责烹饪辅助剂的部门于 4 月 16 日早晨重新启动。该公司在 2019 年 4 月 15 日的新闻稿中表示：“从今天起，我们客户的订单已重新交付。目前正在量化的影响是有限的，并将由为此目的购买的保险涵盖”。


  ### 1.2.2.1. 网络间谍


  根据 ANSSI 的数据，网络间谍是组织面临的最大风险。


  这些攻击具有很强的针对性且技术复杂，并日益针对关键活动领域和特定的关键国家基础设施，例如国防、医疗或研究。


  吉约姆·普帕尔德在 4 月 17 日在法国董事会学院的演讲中提到：“每年有十到二十起非常严重的案件。我们不谈论它，但这些攻击确实存在。它们的沉默造成了认知偏差！”他说道。


  如今获取机密信息的最佳方式是通过计算机攻击。受害者发现攻击，有时是偶然，有时是由于第三方发现，有时是得益于 ANSSI。有时，受害者在五年后才发现攻击。随后，管理人员发现他们所有的邮件都可以被读取。发现攻击的平均时间为[未提供数据]。网络间谍正在逐渐侵蚀企业的价值：通过渗透技术获取关键活动领域或无形资产，网络间谍是针对世界
  500 强企业的攻击，它会破坏某些关键基础设施，它会获取关键活动领域或特定的国家基础设施的资产。


  TeamViewer 是全球领先的、用于远程控制的软件之一。由于在 2018 年被感染了`恶意软件`，德国蒂森克鲁伯和拜尔制药巨头等公司也遭遇了此类攻击的报告。


  ### 1.2.2.2. 间接攻击


  根据 ANSSI 的数据，间接攻击在 2018 年显著增加。间接攻击是针对合作伙伴或服务商，由于其在保护 IT 系统或内部组织和程序方面较为脆弱，从而成为攻击者的目标。


  攻击者利用合作伙伴的漏洞进入目标网络。这种攻击通常是由于获取目标资产的价值，为了通过渗透合作伙伴来进入目标，这吸引了攻击者。


  ### 1.2.2.3. 破坏


  根据 ANSSI 的数据，破坏行为在政治领域以及恐怖主义领域非常活跃。这种行为在 2018 年显著增加。破坏行为并不一定针对组织，而是为了破坏某些关键国家基础设施的可用性。自
  2007 年针对爱沙尼亚的银行系统的攻击以来，Aramco`、TV5 Monde 等也发生了此类事件。


  ### 1.2.2.4. 货币欺骗或加密货币挖掘


  这种类型的攻击在 2018 年观察到大量案例，即利用受害者的计算机进行加密货币挖掘，受害者在不知情的情况下被利用。


  ### 1.2.2.5. 在线欺诈与网络犯罪


  在线欺诈是针对公司和大型组织的持续性网络威胁。在线欺诈在 2018 年通过`网络钓鱼`攻击针对了政府机构或医疗部门。


  欺骗者认为这是一个很好的机会向个人获取捐款。在 2019 年 4 月 15 日，为了重建圣母院教堂，出现了一个欺骗网站，它使用了伪造的“法国遗产基金”标志，并附带了银行账户（RIB），呼吁“法国的朋友”捐款。这是欺骗的。






  这种类型的活动运动可能不会产生直接的财务影响，但可能会产生巨大的媒体影响，从而严重损害公司及其高管和董事的声誉。


  ### 1.2.3 出于间谍或破坏目的的竞争对手（或国家）


  网络间谍非常常见，中小企业（SMEs）也无法幸免。


  Ruag 是一家由联邦政府拥有的瑞士军备和国防系统公司，与其他公司一样，它是计算机攻击的目标，并已被恶意软件渗透了数月。瑞士联邦国防部发言人 Renato Kalbermatten
  表示：“根据初步证据，针对 Ruag 的网络间谍软件攻击于 2014 年 12 月。”


  根据媒体报道，针对 Ruag 的网络攻击允许黑客访问了数万份敏感信息。瑞士联邦信息安全报告与分析中心（MELANI）在其网站 `melani.admin.ch`
  发布的技术报告中描述了这次复杂的网络攻击。


  以下是该报告的节选：


  > 瑞士联邦委员会决定发布此报告，以便各机构检测到其网络中是否存在类似的感染，并强调攻击者的运作模式。攻击者在渗透和横向移动过程中非常有耐心。他们只针对自己感兴趣的目标，并采取各种措施（目标
  IP 列表以及初始感染前后的完整数字指纹）。进入网络后，他们通过感染其他设备和获取更高权限来进行横向移动。他们的主要目标之一是 `Active Directory`，这允许他们利用适当组的权限和成员身份控制其他设备并访问他们感兴趣的数据。恶意软件使用
  `HTTP` 将数据传输到外部。


  ### 1.2.34 员工：最频繁的威胁


  威胁可能来自负责处理不当的员工，这并不一定是恶意的：例如将信息发送给预期接收者以外的接收者（员工有时是高级经理，由于匆忙、压力大、注意力不集中）。


  这有时是无害的，有时是严重的，无论如何，对于形象和声誉来说都不是理想的。培训（特别是在招聘期间）、意识和警惕是关键因素。但工具并非一切。


  威胁可能来自粗心的员工：他们并不是真的有恶意，但他们对自己所处理的信息或对公司的保护并不关心。他们不够“投入”，并且可能没有得到足够的监督。经理和高管有责任实施防止错误的规则和工具，并培养一种文化来提高员工的参与度。


  它可能来自未经培训的员工，他们缺乏必要的警惕性：招聘经理打开了虚假候选人发送的 `CV`（有必要确保来源，但有时很困难，且攻击变得日益复杂）；董事/总裁收到一份来自其
  `Wikipedia` 的虚假更新，并匆忙打开以阅读关于他/她的公开信息。


  它可能来自恶意的员工：向外部发送文件、点击恶意邮件，并在外部世界的同谋下打开大门。


  最后，它可能来自受勒索受害的员工；优秀的侦探小说 *Tension extrême* 很好地解释了入侵是如何成功的，即使在极安全的环境中，这归功于对人类弱点或过度膨胀自尊心的利用。


  无论如何，只有机制、工具、组织、程序、培训和投入的协调，才能使抵御攻击成为可能。


  ### 1.2.35 国家


  本书的主题不是网络战，但它可能对公司产生重大影响（已经发生过多次）。网络冲突正在改变地缘政治格局，在企业战略中必须予以考虑。


  国家之间的网络战争不再是秘密，而是许多出版物和声明的主题。法国国防部长 Florence Parly 于 2019 年 1 月 18 日首次公开展示了法国进攻性计算机战争理论的框架，并发表了一项很大程度上适用于公司的声明。


  以下是该声明的节选，它标志着国家立场的变化：


  > 被盗取的数据。间谍邮箱。被洗劫的服务器和被破坏的信息系统。网络空间已成为一个与其他地方一样的对抗场所。一个成千上万的黑客在无人察觉的情况下推进的地方。一个某些国家躲在其中进行攻击的免责之地。一个充满巨大暴力、可能永久封锁我们的地方。


  > 回想 `WannaCry`，它影响了 150 个国家。


  > 这种现象正在恶化 \[]。而且我们可能什么还没见过。





  今天，法国选择为其军事行动全面配备网络武器。我们将网络武器视为一种独立的作战武器。从责任的角度来看，这是一个必要的选择。我们将根据比例（*proportionately*）使用它，但那些企图攻击我们武装部队的人应该知道，我们并不畏惧使用它。


  法国部长之所以表述得如此明确，是因为网络威胁对国家、企业和公民来说都是严峻的挑战。美国于 1989 年创建的网络空间，其声明目标是改善无国界协作世界中流式信息和通信的共享，但它已逐渐演变成一个以各种形式网络犯罪增长为特征的领域。


  预计网络犯罪在 2021 年的损失将达到 6 万亿美元，远高于 2015 年的 3 万亿美元，其利润率将超过全球非法毒品贸易。


  在法国担任 G7 主席国期间，受邀参加由经济财政部和法国银行组织的网络安全会议，Scor 再保险公司首席执行官丹尼斯·凯斯勒（Denis Kessler）表示：“再保险行业认为网络风险与自然灾害风险同样重要。这让我们对我们所面临的威胁规模有了直观认识”。


  因此，建立数字空间治理至关重要，例如数据保护、创建数字身份（这尤其有助于识别犯罪分子）、建立有关发布信息内容和数字隐私的标准的与规则。


  ## 1.3. 网络安全市场


  ### 1.3.1. 市场规模及其演变

  网络安全市场（硬件、软件和服务）规模仍然较小：它目前占全球 GDP 的 2%以下（估计为 1200 亿美元），但它一直在强劲增长：自 2016 以来每年增长 10%。根据
  Cybersecurity Ventures 的预测，由于企业数字化的快速发展以及监管要求的增加（个人数据保护、遵守国际标准的义务以及行业监管规定），预计该市场从
  2019 年到 2021 年将增长 15–20%。


  技术在不断演进，人工智能、大数据和云计算的发展正迫使参与者快速更新解决方案。


  黑客正在完善他们的方法和工具，迫使公司、其 IT 供应商以及所有网络安全从业者不断改进解决方案，以更有效地防御自己。


  ### 1.3.2. 按活动部门划分市场

  网络安全市场在不同领域的发展并不均衡。IDC（国际数据公司）2018 年的报告指出，三个部门将在 2019 年增加投资：银行、工业和政府（行政机构）。


  电信部门到 2022 年将成为 IT 安全投资的第四大部门。


  在法国，IT 安全市场预计在 2017 年（26 亿）到 2021 年（36 亿）之间平均每年增长 8%，并在 2021 年占 IT 市场的 6.5%，而 2017
  年占比仅为 5.2%。


  这是一个年轻的市场，拥有众多供应商。网络安全博览会上充斥着新成立的供应商。对于网络安全经理和 IT 服务提供商来说，提供的选择非常丰富，甚至过于丰富。要小心解决方案的兼容性，或者说解决方案的不兼容性；同样，要警惕“奇迹型”解决方案，它们昂贵且无法保护你。最后，即使你拥有一扇质量卓越（因此昂贵）的防盗门和极其复杂的锁，如果你向任何人敞开门，你大门的强度也将无用武处。


  安全建立在一个包含工具、组织、程序和技能（因此包括培训）的系统之上。


  供应商的整合是不可避免的。投入巨资的大公司将进入优化、合理化和采购集中的阶段，以避免分散和额外成本，同时提高系统的效率。


  ### 1.3.3. 采购与投资类型

  专门用于监控和保护信息系统的解决方案（包括内部或外部的 SOC，安全运营中心）将成为机构今年主要的投资领域。第二个投资领域是网络安全设备（防火墙、入侵检测与防御技术）。大规模数据泄露事件的增加和高级持续性威胁（APT）攻击是组织部署防御性和主动解决方案的主要原因。最后，公司还将依赖集成服务以及用于固定和移动终端的安全软件。


  这个市场仍处于幼年阶段，目前正在组织，特别是按业务类型：云端服务、审计、培训、服务、认证与检查、情报等。


  ### 1.3.4. 地理分布

  根据 IDC（国际数据公司）的一项研究，从地理分布来看，全球市场目前 40%在美国，25%在欧洲。


  中国是第二大市场。国家（或地方政府）、电信和中央政府部门的安全支出占总额的 45%。


  日本和英国是另外两个重要市场。


  预计 2019 年三分之二的 IT 安全支出将来自大型公司。


  ## 1.4. 网络事件


  ### 1.4.1. 事实

  请记住，计算机事件或事故并不一定与攻击或黑客行为有关。事实上，其原因是多样的，恶意的或偶然的，内部或外部。火灾或洪水将影响公司或客户公司的信息系统或数据（如果公司托管客户数据），其影响与计算机攻击相同，可能是巨大的。


  物理安全与计算机安全因此紧密相连。然而，鉴于组织的数字化和信息系统向世界的开放，网络犯罪呈指数级增长，确实是一个主要的新的风险来源。根据 Cybersecurity
  Ventures 的数据，到 2021 年，每 11 秒就会有一家公司成为勒索攻击的目标。


  网络攻击目前影响 20 亿人，微软估计影响人数将在 2021 年翻倍达到 40 亿。


  #### 1.4.1.1. 网络犯罪信息

  咨询公司、网络安全供应商或安全经理、IT 经理或 IT 安全经理俱乐部每周都会发布许多研究。这些研究存在几种偏差：


  - 有些倾向于商业目的（销售产品或服务）或政治目的（增强行动者权力）；

  - 与整个经济部门相比，调查的样本规模较小；

  - 答案是声明性的；调查有时是电话调查的结果；

  - 访谈者尽管调查人员承诺保密，他们是否知道或会说关于攻击次数、严重程度、入侵成功率或事件起源的真实事实？

  - 一般来说，大多数公司尚未准备好提供有关漏洞、计算机事件、欺诈或数据窃取的信息，这是可以理解的。





  * – 公司通常不提投诉：可能是出于保密考虑和/或因为他们不指望得到警察的支持（警察无法追踪到攻击源头），或者因为缺乏足够的资源，又因为要实施的手段不成比例。


  尽管如此，信息的质量仍在不断提高，这得益于：


  *   – 向 `CNIL` 或 `ICO` 报告数据泄露的规定和义务（作为 `GDPR` 即通用数据保护条例的一部分），或根据从公司中提取的数据性质向客户报告；

  *   – 向 `ANSSI`（法国国家网络安全局）提交的声明，这些声明每年都会列出并报告；

  *   – 保险（保险公司和经纪人）是信息质量改进的一个来源。事实上，保险公司正在开发其网络风险覆盖产品，尽管由于历史数据匮乏且风险评估困难，这是一个充满挑战的市场。越来越多的公司正在研究将其保单范围扩大到网络风险，而且事件数据变得更加可靠，即使保险公司本身对事件结果保持谨慎态度。


  更令人恼的是，当高管对自己隐瞒真相，或者向股东和董事会隐瞒现状时。“我们遭受了攻击，我们度过了危机，恢复了业务”。我们可以称他们为“网络规避者”。


  媒体并不一定需要知道，但当影响重大且风险威胁到公司的可持续性时，董事会和股东必须知情。


  供应商、与其客户合作的专家、保险公司、审计机构和数字调查公司（计算机取证，使用专门用于数字信息收集、识别、描述、安全保护、提取、认证、分析、解释和说明的技术）对趋势有相当可靠的观察：他们掌握事实信息，这使他们能够推断事件的起源、影响和发展情况。


  ### 1.4.1.2. 威胁的来源


  计算机事件的主要原因如下：


  *   – 系统用户：大多数情况下，他或她不想破坏系统的完整性，但其行为助长了危险；

  *   – 恶意个人：他或她无论合法与否进入系统，并访问其不应访问的数据或程序（例如通过系统内部使用但未经过妥善保护的软件）；

  *   – 恶意软件：在系统上安装了（无意或恶意地）旨在损害或滥用系统资源的软件，为入侵打开了大门或修改了数据；机密数据在用户不知情的情况下被收集并用于恶意目的；

  *   – 灾难（盗窃、火灾、水灾），由于处理不当或恶意意图导致设备和/或数据丢失。


  公布的数据令人震惊：每 40 秒就有一家公司遭受攻击¹，33%的赎金受害者无法完全恢复其数据，20%支付了赎金的受害者无法恢复数据²。


  ### 1.4.1.3. 实施


  组织犯罪正在增长，因为它利润高且风险低：犯罪分子位于其活动既不受监控也不起诉的国家。


  ![图 1.3. 公司每年面临的五种不同类型的攻击（来源：根据 CESIN)](img/image42_c2871.jpg)


  **图 1.3. 公司每年面临的五种不同类型的攻击** ¶ *(来源：根据 CESIN)*


  #### 勒索软件


  想象一下一个小偷偷走了你公司所有的敏感文件，并承诺在你支付赎金后将它们还给你。这就是目前通过数字手段采用的方法。文件没有被带走，而是被加密，导致无法访问。


  网络攻击活动是全球性的；数据被攻击者加密（现在已是深度加密），并导致受攻击公司或机构的数据丢失，除非备份系统未受影响且可以在不支付赎金的情况下恢复数据。


  要求的赎金金额通常很低，许多客户选择支付是因为这些金额低于数据丢失或信息系统停工带来的影响。政府建议不要支付，特别是因为这会助长网络犯罪，但公司的务实做法通常导致他们支付赎金并尽快重启活动，以便能够销售和生产、交付给客户并向供应商付款。


  在大多数情况下，攻击者在收集赎金后会解密数据，允许公司继续活动。事实上，受攻击者会通过其 IT 服务提供商向那些未能恢复备份的人传播好消息：“信任黑客。如果你付钱，他们就会恢复你数据和计算机系统的访问”。


  然而，需要注意的是，在大多数情况下，勒索软件可以通过支付 2000 欧元至 4000 欧元的供应商来解密获取数据，这通常远低于网络犯罪分子索要的金额。


  #### 钓鱼


  研究表明，70% 到 90% 的网络攻击及导致的数据泄露始于“钓鱼”，这意味着点击恶意邮件的员工应对大多数成功的攻击负责任。


  不同研究之间的数字有所差异，但在经历过计算机事件的公司所引用的原因中，排名始终相同：欺诈邮件、数据访问、恶意软件、计算机设备丢失或被盗、欺诈（挪用或诈骗）是遇到的最常见威胁。攻击可以是大规模的，也可以是针对性的。


  ### 1.4.1.4. 目标


  ![图 1.4 遭受网络攻击影响的公司比例仍然非常高（来源：根据 CESIN)](img/image44_c2872.jpg)


  **图 1.4. 遭受网络攻击影响的公司比例仍然非常高** ¶ *(来源：根据 CESIN)*


  网络风险不再是技术风险，而是企业、国际风险，也是政府和公共机构的风险。它现在是业务现实不可或缺的一部分，就像火灾或建筑安全。


  网络风险格局不断变化。网络风险复杂且难以量化，特别是由于技术环境的快速变化以及缺乏理赔的历史数据。


  大型公司（如 `KPMG`、`Deloitte` 或 `Airbus`）、城市、政党甚至政府也是脆弱的并会遭受攻击的。那些做好准备的人正在管理危机，尽可能少地沟通，并避免泄露。


  所有公司都是潜在的受害者，无论其规模、活动还是地理位置，且背景多样，正如这组示例所示：


  *   – 核工业“并非例外”，国际原子能机构 (`IAEA`) 总主任在 2016 年表示“发生过针对核电站的随机恶意攻击”。

  *   – 太空工业，通过对控制中心进行“地面攻击”、对发射器或接收器的无线电进行干扰、数据拦截、接管（通过卫星发送的劫持、复制、盗取或修改的信息）。根据《世界报》2018
  年 9 月 7 日的报道，法国国防部长弗洛伦斯·帕里透露，俄罗斯卫星 `Luch-Olymp` 在 2017 年靠近一颗法比卫星“离得太近了”。






  - – 2019 年 5 月，《巴黎报》（*Le Parisien*）宣布，“Picoty SA 是一家在法国中部偏远地区克吕兹（Creuse）经营燃料配送的公司遭受了勒索攻击：该公司的计算机系统受到文件加密系统的攻击。网络犯罪分子随后索要
  50 万欧元，以便公司恢复对系统的访问权限”；


  - – 2019 年 6 月 14 日，据法新社（AFP）报道，比利时承包商 Asco Industries 在泽文特姆（Zaventem）警察区提交了针对勒索系统遭受网络攻击的诉状，该公司是空客、波音、隆巴达和洛克希德·马丁等主要制造商的包商。该比利时工厂关闭了几天；美国、加拿大和德国的其他站点也已关闭。该公司发言人表示：“我们目前正在努力让业务尽快恢复运行并为客户提供服务”。


  ## 1.4.1.5. *世界上最糟糕的鞋匠*


  在 2019 年 4 月 17 日，据报道，主要在以色列运营的美国监控和网络情报领先者 Verint 公司遭到了`ransomware`攻击，而大多数高层人员正在意大利参加一个会议。这次攻击本可以很快被识别，安全团队本可以迅速反应。没有人是安全的。


  2019 年 2 月 13 日的《鸭子日报》（*Le Canard enchaîné*）揭露了 CLUSIF（法国信息安全专家俱乐部）的数据泄露事件，该公司并未采取必要的预防措施。


  事实上，超过 2,200 名主要 IT 安全总监和会议参与者的姓名及个人详情（姓、名、电子邮件地址、手机号码）在 CLUSIF 网站上可以自由获取。


  《鸭子日报》宣布，这份名单包含了共和国总统府首席信息安全官（`CISO`）的联系方式，以及核安全局（`NSA`）官员、武装部队参谋部、马蒂尼（Matignon）、参议院、武器制造商或银行专的联系方式。


  要获取此列表，只需使用关键词“Clusif”和“csv”进行搜索即可。该文件由 CLUSIF 托管，但没有得到良好保护。这是网站管理中常见的人为错误。


  为了防止敏感数据泄露，虽然遵守安全规则至关重要，但由专业人员监督这些标准的执行也至关重要。


  ## 1.4.2. *证言与沉默*


  除了在 2015 年遭受攻击的 TV5 Monde 首席执行官伊夫·比戈（Yves Bigot）外，很少有企业领袖愿意就危机、信息系统的故障、流程、员工培训、对攻击风险和后果的意识缺乏、所需的投资、需要实施的纪律以及分配的预算公开证言。


  在这些几乎毁了 TV5 Monde 生计的事件之后，伊夫·比戈在多次会议上发言。没有比这种证言更能理解风险并采取必要措施来避免此类创伤性经历了。


  在法国，也有“圣戈班（Saint-Gobain）之前”和“圣戈班之后”。圣戈班首席执行官皮埃·安德烈·沙兰达（Pierre-André Chalendar）在这家法国大公司遭受攻击时并未发表公开证言。


  另一方面，他向 `CAC 40` 公司的董事会和执行委员会进行了机密证言，以便董事和高管能够关注这一议题。因此，此类证言很罕见，这很遗憾，因为它们是有效的。


  沉默是最常见的做法；它不利于能够做出更好、更快速反应的信息传播。


  IT 安全或安全经理的俱乐部是有德德的；它们允许你进行交流、学习、进步并更好地保护自己。


  ## 1.4.3. *趋势*


  ### 1.4.3.1. *网络犯罪手段*


  网络攻击正在改进和演变。攻击面正在扩大：移动性、云端、联网设备，与此同时，攻击者的防御能力也在增强。


  目标越来越多地通过其供应商、合作伙伴遭受攻击；这变得更加复杂。


  ### 1.4.3.2. *攻击者*


  攻击者正在进步并始终领先一步：`IoT`（物联网）网络、`APT`（高级持续性威胁）发动攻击。


  目标现在已成为重点。这更有可可也更高效。


  ### 1.4.3.3. *联网设备*


  为了提高意识并鼓励日本公民更好地保护自己，信息通信技术研究院从 2019 年 2 月开始尝试对 2 亿台联网设备进行渗透：路由器和摄像头将成为目标。


  该计划可能会持续五年。


  ### 1.4.3.4. *网络战*


  间谍活动和破坏行动以及信息战现在通过数字手段进行，并处于战略行动的前沿，正如让·路易·格戈林和利奥·伊萨克·多尼在 2018 年出版的书《网络：持久战》中所述。数字技术使得这种新型战争形式的远程行动成为可能，并提供了瘫痪和可逆的能力。此外，它显著增强了全球范围、即时速度以及情报影响力和秘密行动能力（难以溯源），成本较低（显著改变了大国之间的平衡），且具有高目标能力。


  国家之间的网络战不仅影响政府，还会严重影响关键国家基础设施（能源、电信、国防等）以及间接或直接影响公司。


  2014 年，由 29 个北约成员国组成的联盟将网络空间认定为作战领域，如同陆、空、海一样。2018 年底，成员国宣布北约将建立网络空间行动中心，以协调北约的网络。北约还讨论了将各国
  IT 能力整合到联盟行动中。


  2018 年 9 月，白宫警告外国黑客，将作为新的国家网络安全战略的一部分增加进攻措施。美国情报官员预计在 11 月 6 日选举前会有一系列数字攻击。


  美国于 2019 年宣布将代表北约使用进攻和防御 IT 能力。


  ## 1.4.4. *示例*


  ### 1.4.4.1. *信息泄露*


  信息泄露可能是由于误用或疏忽导致的，包括经理、顾问或 IT 服务提供商：数据错误发送给一个联系人而非另一个、数据库访问管理不可靠、密码暴露在外或易于猜测、密码未定期更新、软件未更新、未遵守双重认证建议、机密数据可访问、传输和复制。网站也不安全。





  因此，公司必须首先对其数据进行治理：收集了哪些数据、由谁收集、为什么收集、存储何何、由谁存储？


  数据是如何分类的？机密程度如何？谁有访问权限？谁可以修改？谁管理授权？


  因此，数据安全首要取决于良好的数据治理：公司内部谁负责？规则是什么？规则是否为人知并得到执行？


  ## 1.4.4.2. 某些著名攻击的示例


  ### 第一次攻击：Wannacry


  它发生于 2017 年 5 月和 6 月；这是一种`ransomware`，它瘫痪了全球数十万台计算机，影响了英国医疗系统、德国铁路或雷诺汽车工厂。


  这次攻击是全球性的。在 100 多个国家，病毒封锁了计算机，直到支付了 300-600 美元的比特币作为赎金为止。50 家英国医院（国家医疗服务体系）部分瘫痪，电信公司（沃达丰、西班牙移动）、罗马尼亚情报部门、雷诺汽车及其组装线、日本本田汽车集团的工厂等，仅列举几例。


  在德国，德国铁路也受到了波及：在德国车站显示火车时刻表的屏幕上，显示了赎金请求信息。


  Wannacry 病毒引起了巨大轰动，产生了惊人的影响，但并未让攻击者收回数百万美元（在法国仅收回 30,000 美元），主要是因为支付系统构建得糟糕。


  另一方面，公司重启系统、更换计算机、聘请 IT 安全专家以及保护信息系统以避免再次受害的成本要高得多。目前尚无汇总信息可用。在英国，医院的估计成本估计为 9000
  万英镑。


  ### 第二次攻击：NotPetya


  这是一次破坏性、蓄意性的攻击。这种恶意软件删除了它访问的计算机上的文件，伪装成`ransomware`。主要的已知的法国受害者是圣戈贝莱集团（Saint-Gobain），其利润损失估计为
  2.5 亿欧元。其年度报告显示，对营业收入的影响为 8000 万欧元；而对非经常性收入的影响尚未量化。


  “那一年以 6 月 27 日的网络攻击为标志，该集团能够迅速做出反应以恢复正常运营活动，同时也加强了防御。2017 年营业收入的影响估计为 8000 万欧元：


  > 总体而言，网络攻击的影响约有一半分布在建筑销售，其余部分在工业中心，特别是建筑产品；从地理上看，西欧国家受影响最严重，其中北欧国家、德国和法国受影响最大”（Saint-Gobain
  2017）。


  “NotPetya 病毒通过公司必须连接的乌克兰税务管理软件污染了计算机，”该法国集团的二号人物 Claude Imauven 在 2018 年 2 月 9 日接受
  `L’Usine nouvelle` 采访时表示。在几分钟内，成千上条数据被加密且无法恢复。计算机化的订购和发票系统被封锁。该集团的分销网络 `Point P`
  和 `Lapeyre` 不得回到纸笔书写采购订单并手动传输。他们花了四天进行危机管理，用了 10 天业务才完全恢复。


  根据 Claude Imauven 的说法：“学习在降级模式下工作以防中断连续性，是良好风险管理最核心的方面。”这涉及优先考虑各种资产的关键性并采取预防措施，识别各种备选方案，并动员内部的各个团队。


  钓鱼行动、渗透测试……如今，公司定期组织全方位测试，以让员工意识到各种威胁。此外，圣戈贝莱集团现在要求直接连接集团系统的供应商必须具备网络美德，”首席执行官说，“这对我们今天来说是一个`sine
  qua non`（必要条件）”。


  同时，这 1 在事件发生时还未涵盖此类风险的公司已承诺投保网络攻击保险。


  ### 法国的 Altran 和 挪威的 Hydro


  技术咨询集团 Altran 在遭受 2019 年 1 月 23 日的计算机黑客攻击后，被迫退出了重大的一步。这段停滞期对集团来说可能非常昂贵，尤其是在形象方面。


  Altran 的一位发言人表示，公司遭到了勒索，这就是为什么它必须“立即”断开计算机网络及其所有应用程序以防止扩散。Altran 正在与 `ANSSI`（法国政府信息系统安全局）联系：


  > 我们动员了独立的、国际认可的技术和调查专家，我们与他们进行的调查没有发现数据被盗，也没有发现事件传播到我们客户的情况。


  特别是，Altran 为大型能源和运输集团（包括空客）执行 R&D（研发）任务。因此，对公司的攻击可能是为了获取其客户的商业秘密。


  在接受 `Le Parisien` 采访时，Guillaume Poupard 报告了来自“国家、私营或恐怖分子的攻击，他们目前的目标不是破坏，而是为了建立并特别是研究计算机系统”，涵盖了能源、电信和运输三大主要领域。


  `Le Monde informatique` 还指出，尽管有这些建议，Altran 已支付了超过 300 个比特币（约近 100 万欧元）以获取文件的解密密钥。根据
  `L’Express`，截至二 月底尚未交付，该报还引用了一位金融分析师的话，他估计攻击 Altran 的成本已达到 2000 万欧元。


  正是这种名为 `LockerGoga` 的勒索软件加密了计算机文件并索要资金以重新提供服务，导致 2019 年 3 月 18 日，挪威第三大水电生产商以及全球最大的铝生产商之一
  `Norsk Hydro` 部分瘫痪。攻击是在午夜左右通过服务器异常活动被发现的。


  由于与主网隔离（这是关键设施的良好做法），电力生产未受影响。受攻击影响，Hydro 的网站无法访问；Hydro 通过其 Facebook 页面进行交流。


  几家挤压厂（将铝锭加工成汽车制造商或建筑行业使用的金属零件）已经关闭，而其位于挪威、卡塔尔和巴西等国的巨型熔炉已改为手动操作。


  引用 `NSM` 的信息，挪威公共广播机构 `NRK` 在其网站上报道，勒索者向 `Norsk Hydro` 索要资金，该集团尚未证实这一点。我们将在第 6 章中详细回顾
  Hydro 实施的危机管理。


  ## 1.5. 特别易受影响部门示例


  ### 1.5.1. 电影


  2014 年 11 月，当索尼影视公司员工打开计算机时，屏幕上出现了一个骨架图像并并随着勒索信息：目标是阻止电影《面试》（The Interview）的放映。随后黑客广播了未来几个月内上映的四部电影。索尼的总损失超过了
  2 亿美元。


  此外，索尼影视公司员工的个人数据被黑客盗取：姓名、地址、社会安全号、驾照号、护照号或国家身份标识、银行账户号码、差旅费用信用卡信息、用户名和密码、薪酬和其他就业相关信息，以及医疗数据。





  自该事件以来，电影行业的公司已变得极其谨慎：外部服务提供商（如配音公司）接收加密文件，文件读取需要双重或三重认证，且任务被分离，使得只有极少数的人可以访问整部电影。编辑室、配音室和录音室的安全性很高（通过证或人脸识别访问）。信息流受到持续监控。因此，可以快速检测到异常，并识别和制裁犯罪者。


  ## 1.5.2. 银行


  虽然没有哪个银行能完全避免意外，但多年来银行一直在加强其 IT 安全，特别是在 `EBA`（欧洲银行管理局）或 `ACPR`（法国审慎监管和决议局）的授权下，这些机构将此视为主要风险，特别是因为银行、金融市场、客户和供应商的信息系统是互联的。


  银行的所有业务分支都受到数字化转型的影响：它们的市场活动、个人（BtoC）或企业（BtoB）客户的操作、融资的设立以及数据处理（银行处理的数据量非常巨大），这在服务开发、新产品以及竞争优势方面是一个至关重要的问题。


  网络安全威胁因此是银行关注重点，银行被要求加强 IT 资源和控制系统。近年来针对银行或银行网络的网络攻击凸显了这一风险，以及对银行生产或品牌形象的潜在影响。


  数字信任对银行来说至关重要：如果银行不能确保支付手段的运行和安全、无法获取高质量信息、如果成为盗窃的受害者、如果在在其不知情的情况下发生转账且如果无法保护客户，客户如何信任银行呢？


  `ACPR`（`Autorité de contrôle prudentiel et résolution`）识别了三个主要风险：信息系统的组织及其安全、信息系统的运行以及信息系统安全。


  `FINMA`（瑞士联邦市场监管局）将网络攻击视为银行的主要风险（2018 年 3 月 27 日）。`FINMA` 负责人指出，防御系统的有效性取决于其最弱的一环，并邀请该行业的从业者加倍努力。


  瑞士信息保障报告与分析中心（`MELANI`）发布的最新统计数据显示，所有网络攻击的三分二涉及金融部门。


  瑞士每天对网上银行解决方案的攻击多达 100 次。


  网络问题是大型银行管理层关注的首要之务。根据 `Accenture` 对七个国家（法国、意大利、日本、美国、德国和澳大利亚）254 家公司进行的研究，金融机构计算机系统的入侵次数在过去几年中增加了三倍。


  银行和其他保险公司每年平均遭受 125 次入侵，而 2012 年仅为 40 次；相比之下，银外行业每年平均遭受 130 次入侵。这些攻击似乎没有产生财务影响，但反复的安全漏洞会导致收入损失，它们还破坏了服务并威胁到客户数据和资产的完整性。它们对服务质量（“服务暂停由于维护操作引起”）以及客户对银行的信心产生了影响。如何将你的钱交给一家经常提供无法访问的在线服务的银行？


  拒绝服务的范围可以定义如下：`Accenture` 表示，“与其他经济参与者相比，银行对如恶意软件等传统攻击具有更强的韧性，但它们对饱和其系统并导致拒绝服务的攻击仍然非常敏感”。2018
  年 1 月底，`ING`、`Rabobank` 和 `ABN Amro` 遭受了“拒绝服务”攻击（服务器发送大量请求）：这些银行在荷兰无法提供几个小时的在线服务访问。


  这种更复杂的威胁也是最昂贵的。根据研究，机构平均花费 250,000 美元来处理拒绝服务，而使用劫持数据的软件（勒索软件）或其他任何恶意软件的攻击费用则低于 100,000
  美元。


  这导致了网络犯罪成本的通胀，金融行业的这一成本在过去三年中大幅增加。根据研究，公司在 2017 年花费了 1828 万美元来保护自己，而 2014 年为 1297
  万美元。这些金额远超工业、航空、技术和医疗健康领域行业参与者的投入：报告估计，所有行业部门每年投入 1170 万美元来保护自己。


  随着移动银行和新技术的兴起，威胁预计将增加。


  正如 `BPCE` 集团现任首席执行官 `Laurent Mignon` 在 2018 年 2 月 16 日于 `Les Échos` 上所述——他当时是 `Natixis`
  的首席执行官——银行系统唯一的系统性风险是网络风险”，同时补充道：“金融系统比其他行业更意识到这一风险。监管机构多年来一直确保考虑在内”。


  2019 年 5 月，欧洲中央银行（`ECB`）执行委员会成员 `Sabine Lautenschläger` 报告，在 2017 年 7 月到 2018 年
  9 月之间，`ECB` 收到 66 起重大 IT 安全事件。“我担心我们手头的事件报告将无法提供形势的概述”，她补充道。


  回顾一下，首次针对欧洲银行机构的大型网络攻击发生在 2016 年：英国超市链子公司 `Tesco Bank` 的 40,000 名客户账户被破解，据报道其中 20,000
  名的资金被诈骗提取。2017 年 1 月，一次拒绝服务攻击针对几家主要的英国银行，导致 `Lloyds Bank` 的在线服务中断两天。


  2019 年 6 月，据法国当局宣布，G7 成员将首次组织一次金融跨境网络攻击演习。该演习由法国银行（`Banque de France`）协调，将涉及来自七国家的
  24 个金融机构（中央银行、监管机构、财政部、市场当局）。法国、意大利、德国和日本的私营部门代表也将参与：


  > 此外，根据 `François Villeroy de Galhau` 的说法，有必要对网络事件进行“共同分类”，并提供更多信息来衡量威胁的强度、复杂性及其演变。


  “金融机构是时候采取激进措施来加强对网络攻击的战斗了，”法国财政部长 `Bruno Lemaire` 在 2019 年 5 月表示，“这既昂贵又复杂，但绝对必要”。


  ## 1.5.3. 健康


  医疗部门，特别是医院，是遭受反复攻击的领域之一，且安全投入不足，尽管医疗设备供应商认为网络安全是一个大问题。


  事实上，病历记录还包括与互助保险或保险合同的信息以及账单信息，这为身份盗窃和利润丰厚的欺诈提供了便利。





  医院往往保护不足：资源匮乏、预算不足、行政负担重、治理困难（医疗专业人员与职能部门之间的权力平衡），而且由于对患者风险的显而易见的考虑，他们无法停止活动。因此，它们成为了网络犯罪分子的关注目标。


  网络安全创业公司（Cybersecurity Ventures）预测，通过勒索的计算机攻击（将个人数据作为人质的恶意软件：它加密个人数据并要求所有者发送资金以换解密密钥）将在
  2018 年至 2021 年之间增长五倍。


  在美国，美国食品食品药品管理局（`FDA`）于 2019 年 3 月 21 日警告说，美敦力（`Medtronic`）的一些连接医疗设备（包括植入式心脏除颤器）存在网络安全漏洞。


  它强调，“公司必须采取措施监控和评估网络安全漏洞风险，并主动披露这些漏洞”。


  它回顾道，“任何连接到通信网络的医疗设备”都可能发生安全泄露，尽管这些设备和软件“也可以提供更安全、更方便、更快速的医疗服务”。


  截至 2018 年 10 月，`Medtronic` 发现系统易受到网络攻击，因此禁用了全球医疗保健专业人员使用的 34,000 台 `CareLink` 编程设备的互联网更新，以便其访问现有的起搏器。


  ### 1.5.4. 旅游与商务酒店


  旅游和商务酒店行业近年来多次受到攻击：2018 年 10 月，`Radisson Rewards` 计划成员的姓名、邮寄地址、电子邮件、公司名称和电话号码泄露。他们已收到通知以便检测任何可疑活动，丽笙（`Radisson`）建议他们不要响应
  `Rewards` 计划关于其个人信息（包括用户名和密码）的任何请求。


  2018 年 6 月，雅高（`AccorHotels`）的子公司酒店预订网站 `Fastbooking` 被入侵，数百酒店客户的姓名、电子邮件地址和信用卡号被盗取（2017
  年 5 月和 6 月的预订）。


  2018 年 3 月，优步旅（`Expedia`）的子公司 `Orbitz` 意识到其在 2016 年 1 月至 2017 年 12 月期间遭受了一场大规模盗窃。因此，在近
  24 个月里，这个专门预订机票和在线旅行网站一直存在安全漏洞。


  2016 年，凯悦酒店集团（`Hyatt Hotels Corporation`）报告 250 家酒店的信用卡数据被盗。同年，希尔顿（`Hilton`）、文华东方（`Mandarin
  Oriental`）、特朗普酒店（`Trump Hotels`）和万豪酒店度假集团（`Starwood Hotels & Resorts Worldwide`）都是计算机攻击的目标。


  连锁酒店持有的个人数据泄露对于可能成为欺诈和身份盗受害者的人来说是一个问题；有时这也是涉及人物行程的机密。


  ### 1.5.5. 国家关键基础设施


  #### 1.5.5.1. 军事计划法


  归因于国家关键基础设施的 IT 问题可能会对国家及其它的运行产生系统性影响：在法国，约有 200 个实体被认为是交通、能源、金融、医疗和电信领域的国家关键基础设施。这些公司受到国家的特别监督，并须遵守监管义务：2013
  年通过的 `LPM`（即军事计划法）、2015 年发布的法令以及 2016 年通过的欧洲 `NIS` 指令。


  `ANSSI` 的使命是支持重要业务运营者确保其敏感信息系统的安全。该系统能够识别运行或使用被认为对国家生存至关重要的设施的私人和公共国家关键基础设施。


  2013 年的 `LPM` 规定了若干与国家关键基础设施网络安全相关的规则，并定义了它们在保护关键信息系统方面的责任和义务。


  因此，它要求国家关键基础设施由合格机构（`SSI audit providers`）对其 `VISs`（重要信息系统）进行审计，并实施网络安全措施。


  国家关键基础设施的各种网络安全规则涉及系统的安全（`ISS`）以及事件管理（映射、检测异常、事件处理、危机管理、访问管理、安装新设备或实施新服务）。


  #### 1.5.2. 问题


  由于合规是董事会的关注重点，国家关键基础设施的董事会需要理解风险并确保符合这些规则。


  非关键基础设施公司的董事会也可以利用这些规则来提高其网络安全水平。


  ## 1.6. 董事的责任


  所有行业都涉及其中，公司的可持续性面临着风险，因为攻击可能是严重的，公司价值可能受到巨大影响，上市公司或大型家族企业的利益相关者因此可能会合理质疑董事会是否关注了这一问题并采取了必要的措施。


  他们胜任吗？他们问了正确的问题？他们收到了什么信息？





  > 不言而喻，网络安全主题必须是企业领导者和董事会关注的重点。它直接关系到公司的形象、可持续性、战略和商业定位，因此完全符合公司的利益。


  良好治理的主要目标是确保股东和所有利益相关者对公司的可持续性充满信心，某些人是因为他们投资了公司，其他人是因为他们作为员工或分包商为公司工作，或者因为它是关键合作伙伴（如参与信贷的银行、税务机关或社会组织）。


  治理是一套组织股东、董事会和管理层之间关系与权力的系统，以确保公司的适当管理、价值创造、风险限制、战略决策引导、监督战略的有效执行以及控制公司绩效，从而确保股东的最大利益，同时有助于维护所有利益相关者的利益。


  董事会发挥着着关的作用：它代表股东、指导战略、任命并控制管理层。由于经济复杂性的增加（特别是与国际竞争有关）、国际监管环境的加强，以及正在改变业务模式、公司组织及其生态系统的新技术的出现，董事的角色也随之增加。所有这些现象产生的新风险增加了董事会的责任，其技能必须随之演进，警惕的领域也同样如此。


  经济的数字化转型对股东、董事会和所有利益相关者获取的信息产生了影响。公司治理机构面临着诸多挑战：电子声誉、价格波动、业务去物质化、董事信息保护、去中间化以及新参与者的出现，这些都对公司的估值产生重大影响。


  ## 2.2. 股东


  除了与新竞争者进入相关的战略风险外，公司的数字化转型、信息系统与客户、供应商、银行和行政部门的连接增加了 IT 风险、欺诈风险和攻击脆弱性，这些可能导致运营问题或数据泄露。


  ### 2.2.1. 公司估值


  公司的估值取决于其战略和执行的质量。所有维度的数字化战略至关重要：数字化转型本身不是目的，而是进入新市场、开发新产品和服务，以及改进销售、生产和管理流程的手段。


  此外，公司的韧性（即其重启信息、生产或销售系统的能力，保护这些系统的能力、预测危机、建立检测和响应事件的解决方案，以及在攻击后采取正确纠正措施的能力）对于股东和价值创造也是至关重要的。


  根据 `PwC France`（普华永道法国））2018 年对约 30 起事件进行的研究，超过一半的公司在事件发生一个多月后遭受了 10% 到 20% 的股市损失，并导致市场信心的丧失。对于约
  20% 的公司，价格在最初 10 天内下降了 6%，但得益于良好的危机管理、网络安全措施的实施和投资，以及对这些措施的沟通有助于恢复市场信心，价格在随后的 6-12
  个月内回升。


  如果网络攻击是由于过失导致的，会对股价产生影响，例如美国的 `Equifax`（价格下跌了 40%；`Equifax` 未遵循管理层关于软件更新的建议）或英国的
  `Talk Talk`（价格下跌了 30%，因为敏感数据未加密）；但如果在管理方面（总管理层、IT 和 IT 安全部门、安全策略、培训、加强 IT 和安全预算）采取了措施，且没有失去客户的信任，则对股价不会产生持久影响。


  因此，市场的反应将取决于董事会和管理层在事事后的警惕性、其技能和反应能力，以及他们对数字化问题的意识、董事会组织的反馈机制以及建立的程序（特别是风险映射程序）。


  董事会中的“网络规避者”对股东来说不是资产，无论在哪个风险领域，特别是对于所有网络安全和数据保护问题。


  相反，尽管没有公司能完全不受攻击、计算机崩溃和数据泄露的影响，但预测、警惕和实施网络安全系统将成为公司声誉和所有利益相关者信任的资产。


  ### 2.2.2. 网络评分机构


  网络评分机构在美国开发总部位于欧洲。其目标是突出与组织资产网络安全相关的事实和事件，并将其与最佳网络安全标准和实践进行比较。


  此外，由机构投资者、投资基金或行动派股东组成的群体，也表现出更强的意愿参与公司治理。行动派股东将希望知道他们投资的公司是否安全良好。事实上，网络安全将日益成为股东关注的话题（价值损失的风险）。


  由于这种重大的价值损失风险，股东将日益寻求了解公司采取了哪些措施，要求提供有关风险和补救措施的信息，并对新法规的遵守情况以及客户对公司保护数据（特别是客户数据）能力的信任保持警惕。这种信任将取决于公司在收集和保护其持有数据（特别是客户数据）方法方面的透明度。


  在 `Standard & Poor’s` 关注到网络风险（特别是银行业）之后，现在轮到 `Moody’s` 将网络安全纳入评估公司的标准中。涉及的风险之大，使得投资者必须获知针对网络攻击的保护水平。


  “我们预计公司建立网络安全指导机构，”`Moody` 在 2015 年 11 月底警告道。IT 安全经理不再是唯一拉响警报的人了。


  ### 2.2.3. 内幕交易


  在网络事件发生后，需要对内幕交易风险加强警惕。`Equifax` 的案例是一个著名的不效之反教材。2017 年 9 月，美国信贷机构 `Equifax` 遭受了一次重大数据泄露：受害者达
  1.43 亿。这次数据泄露在 5 月旬至 7 月间发现，并在 9 月初向市场公布。由于这一公告，`Equifax` 的价值下降了 40%。


  美国证券交易所委员会 `SEC`（美国股市警察）指控了几名 `Equifax` 高管在个人数据（姓名、社会安全号码、出生日期等）被黑客入侵的消息公布前出售股票。


  据称，这次盗版行为给公司带来了超过 1.5 亿美元的损失，并在声誉和客户方面产生了重大影响，调查揭示了管理层在网络安全系统方面的疏忽。





  另一个在 2017 年底引起美国媒体关注的案例是，英特尔（Intel）首席执行官在英特尔处理器关键漏洞披露之前，出售了其部分股份，套得 3900 万美元（资本收益
  2500 万美元），而此时距离他发现这些漏洞已过去几个月。


  此外，美国证券交易委员会（SEC）认为网络安全是所有组织至关重要的问题。它要求上市公司通过发布一份表格，详细说明其遭受的网络攻击，以告知市场，因为这些事件可能会危及公司的未来。


  SEC 制定的规则禁止上市公司管理人员在获知可能影响股价的信息时出售其股票。


  因此，建议持有股份或股票期权的员工应了解有关出售这些股份的规则，这取决于每年的时间点以及他们可能掌握的关于可能影响股价的事件信息。


  ### 2.2.4. 激进股东


  所谓的“激进型”投资基金所管理的资金在 2007 年到 2017 年间从 270 亿美元增长到 1630 亿美元。这些激进基金的特征之一是干预上市公司的管理，并具有短期或长期的战略愿景。


  最近的一些欧洲案例包括：TCI（儿童投资基金）挑战了赛峰（Safran）对捷空（Zodiac）的收购，这次收购被认为“价格过高”且“不理性”，并且“鼓励”了空客出售其在达索航空的股份。Third
  Point 要求对雀巢的战略进行重大调整，并出售其持有的欧莱雅（L’Oréal）的股份。来自瑞典的激进基金 Cevian Capital 收购了瑞塞尔的股份，修改了其执行委员会并启动了资产处置计划。Cevian
  Capital 还领导 ABB（瑞士先进技术领导者，数字工业全球领导者，在各自的领域拥有四个领先业务部门：电气、工业自动化、移动和机器人技术）出售电网业务，这占了其业务的三分之一。


  激进基金进入资本股对于任何上市公司来说绝非小事。他们在媒体上的干预旨在谴责他们想要纠正的缺陷，以加速价值的创造（通常是短期内的）并与股东共享。


  从战略角度来看，数字化转型以及公司适应新市场准入、竞争、产品和服务供应以及生产能力的速度，是避免激进基金的最佳手段。


  从公司声誉以及客户和利益相关者信任的角度来看，确保信息系统和数据保护也是避免损害、激进基金进入资本以及公司遭受剧烈重组的最佳方法。


  对于董事而言，在发生网络安全事件和股价下跌后，真正的问题才开始：股东诉讼、资本重组以及激进股东的股权投资，这些股东从股价下跌中获益。


  分心于危机管理、IT 资源运行、与客户和媒体的沟通、以及涉及责任的纠纷和调查的公司，将同时受到这些股东的干扰，这些股东会公开要求主要董事辞职。


  高管辞职和/或股东纠纷已经影响了 Target、温锦环球酒店（Wyndham Worldwide）、TJX 和心地支付系统（Heartland Payment
  Systems）。其他公司也将随之而来。


  ### 2.2.5. 证券交易所机构


  作为美国证券交易所监管机构的 SEC 对网络犯罪对公司的影响非常关注。它在 2018 年 10 月发布了名为《针对上市公司的网络相关欺诈报告》，该报告是根据对九家网络欺诈受害的上市公司进行的调查，这些欺诈通过来自高管或供应商的虚假邮件，金额从
  100 万到 4500 万美元不等（向境外账户付款）。


  其中许多欺诈并不复杂。正如网络攻击中常见的情况一样，犯罪分子依赖技术，同时也依赖流程缺陷和人性的脆弱性，导致控制环境失效。


  程序有时是正确的，但员工没有经过培训，也不了解网络犯罪带来的风险，例如新技术允许的身份盗窃。


  鉴于网络犯罪高度恶意的性质，SEC 将继续在监管美国公司网络安全实践方面发挥领先作用。


  ### 2.2.6. 年度报告


  年度报告是股东了解公司治理、战略、账目、风险以及应对这些风险的计划，以及将这些风险转移给保险的手段。


  法国金融市场管理局（*AMF*）要求上市公司发布某些信息。在股东大会上，仅要求提供年度财务报告：该文件包括年度公司和合并财务报表、管理报告以及法定审计师的报告。


  注册文件提供了关于公司更完整的信息。它比年度报告更详尽，例如包含了对市场活动、产品和服务服务的描述、集团组织图、财务状况分析、主要股东、公司和合并财务报表及其附录。


  这些内容非常丰富，包含了会计准则和方法，以及关于公司财务状况、有形和无形资产、合作伙伴公司持股等许多要素。还提供了按部门或地理区域划分的盈利。


  因此，这是一个极佳来源，整合了有关风险（包括与信息系统相关的风险）和所采取措施的信息。著名的 2017 年攻击（`Notpetya`和`Wannacry`）是法国大多数
  CAC 40 强公司进行此类沟通的起点。


  奇怪的是，仍有少数大公司没有提到该主题，仿佛网络风险不存在一样。事实是公司不想在公共场合暴露自己的脆弱性。


  尽管如此，让股东了解负责委员会非常重要，并让他们知道这些问题是否已列入董事会或委员会的议程，以及是否聘请了独立专家对组织、流程、系统和安全策略进行审计。


  最后，年度报告描述了董事会的组成、每位董事的职业履、技能、委员会的组成以及年度开展的工作。


  对于那些仅简要讨论这些话题、董事会缺乏相关技能、且其专门委员会每年至少讨论一次该主题的公司，董事应该引起关注。法律风险正在增加，我们将在第三章（#c03.xhtml#head3）中详细介绍。


  ### 2.3. 董事会


  ### 2.3.1. 事实情况


  75%的公司对这种情况没有做好准备，并且不够警惕。Spencer Stuart2016 年的一项研究显示，在调查的 4000 名管理者中，网络安全风险是第二威胁（过度监管之后）。


  Spencer Stuart2017 年对美国董事会网络安全的调查揭示了以下事实：


  * 大多数董事（69%）将监督网络安全的责任分配给董事会的一个委员会，而 26%的人表示由董事会整体管理网络安全风险。





  * – 57% 的受访者表示审计委员会监控网络安全。在其他董事会中，网络安全风险由风险委员会（7%）、技术委员会（4%）或提名与治理委员会（2%）监督；

  * – 64% 的受访者报告，董事会或其委员会在过去一年内针对网络侵侵害制定了危机管理计划。


  ### 2.3.2. 董事会的四项使命


  董事在董事会内部举行会议，通过集体决策的方式参与公司管理，即确定公司的方向和政策（这些政策的执行由高级管理层确保），并对其运营进行控制。


  董事必须“监督”，从而向利益相关者保证公司的管理是出于其可持续性和可持续绩效的考虑。董事会是信任的关键因素。


  ![图 2.1. 董事会的四项使命 ¶ (来源: Starboard Advisory)](img/image70_c2876.jpg)


  **图 2.1.** 董事会的四项使命 ¶ (来源: Starboard Advisory)


  信息技术的发展涉及董事会的所有维度：


  * – 战略目标的制定：市场准入、商业模式、通过数字渠道进行营销、新产品设计、生产、配送和管理；

  * – 管理人员的任免：考虑实现目标所需的技能、如何改变公司文化以及通过培训支持变革；

  * – 账目的关闭需要确保信息的质量，因此信息系统的质量；

  * – 风险格局将考虑到网络风险及其对财务绩效的潜在影响、合规性风险和声誉风险，特别是在数据泄露后（个人数据、知识产权、战略数据）。


  ### 2.3.3. 民事与刑事责任


  ![图 2.2. 管理人员的民事与刑事责任 ¶ (来源: Starboard Advisory)](img/image71_c2877.jpg)


  **图 2.2.** 管理人员的民事与刑事责任 ¶ (来源: Starboard Advisory)


  重大灾难可能会影响公司的财务状况及其资产，并使经理面临法院的责任。


  如果由于经理的过错（例如缺乏备份）导致公司遭受了对其极其不利的数据损失，则该经理需承担民事责任。如果证明缺乏对公司信息系统的组织措施或保护，也将产生民事责任。


  根据 2004 年 8 月 6 日法国法律第 2004-801 号关于数据处理、文件和自由的第 34 条：


  > 控制者要求根据数据的性质和处理带来的风险，采取一切必要措施，以维护数据安全，特别是防止数据被扭曲、损坏或被未经授权的第三方访问。


  未能遵守这些数据安全义务还可能导致 `CNIL` 实施严厉的财务罚款：2019 年 4 月 17 日，Optical Center 被处以 200,000 欧元的罚款。


  因此，经理必须实施技术和组织措施，保护其在活动过程中收集的个人数据免受未经授权、意外或非法的破坏、丢失、篡改、传播或访问：阻止入侵和病毒尝试（防火墙、防病毒软件）、更新、密码管理、访问管理、加密、匿名化、去匿名化、确保物理
  IT 基础设施的安全（场所安全）。


  此外，经理必须采取法律措施：IT 工具和网络的使用章程（用户和管理员章程）、安全许可政策和程序、数据保留和归档政策、应用程序的使用、网站连接、供应商或分包商的访问、移动性、使用公司设备因个人原因访问互联网以及事件管理政策。


  还建议在经理与 `CIO`（首席信息官)/`CISO`（首席信息安全官）之间建立授权机制，确保像任何授权一样，这些经理拥有履行其职责所需的、技能、权和手段，并且该授权是明确、有限且精确的。


  让我们回顾一下法国《刑法》第 226-17 条：“任何负责个人数据计算机处理的人员必须采取适应数据性质和处理所面临风险的物理（场所安全）和逻辑（信息系统安全）措施”。


  未能遵守这一安全义务将受到法国刑法第 226-17 条的严厉制裁：处最高五年监禁和 300,000 欧元罚款。


  ### 2.3.4. 董事会与网络安全


  为什么董事会必须接管网络风险？主要出于财务、法律和声誉考虑。三个优先事项是韧性、伦理和合规。与网络攻击相关的风险可能很高，董事成员不应等到攻击发生时才评估公司所面临的风险。


  `Institut Montaigne`（由 Claude Bébéar 创建，Henri de Castries 主席）汇集了企业高管、高级公务员、学者和社会界代表。这是一个反思的空间，不受任何政治和经济限制的影响。


  根据该学院 2018 年 10 月发布的一份报告（基于 `Wavestone` 的研究），只有 25% 的 `CAC 40` 集团在执行委员会层面直接处理网络安全问题。只有
  12% 的 `CAC 40` 公司报告其已启动网络安全计划。在 2017 年，只有 58% 的 `CAC 40` 公司在注册文件中提到过 `GDPR`。


  该学院强调管理层缺乏意识，且网络安全与公司战略缺乏整合。它建议编制一份供董事使用的机密（非公开）网络风险报告，并在年度中部分整合这些风险和应对措施。


  根据 `Opinion Way`的一项研究，54% 的企业领袖认为网络安全是 IT 管理的问题，只有 24% 认为是高级管理层的问题。然而，这是董事会的战略问题，而不是某些董事所声称的运营问题。


  #### 2.3.4.1. 接管公司的数字命运


  有效的网络安全始于董事成员和高管对风险的意识，他们必须意识到公司随时可能受到攻击。因此，风险评估是起点。


  网络风险是你们必须习惯的风险。确保已建立相关机制使公司更具韧性（特别是确保系统的可用性、正常运行、信息的机密性和完整性）。董事和管理人员负责控制这一风险。


  董事会负有法律义务，至少包括监督公司风险管理系统的有效性。对于网络风险，因此有必要确保运营人员意识到相关风险和新法规，并在公司规模允许的情况下为公司提供全局风险管理系统。





  最后，风险分析可能导致将风险转移给保险。尽管网络风险复杂且难以量化（特别是由于缺乏历史损失数据以及可能发生的事件类型繁多），但保险公司正活跃于这一市场，并拥有一套分析网格，使公司能够更好地了解自身的风险水平和保护状况。


  正如第 2.2.2 节 所讨论，评级是董事会（特别是审计委员会）的工具和警惕点。它们允许进行快速审计并监控改进进度。在这些评级公开之前对它们进行预判将会更好。


  ## 2.3.4.2. 重塑董事会？


  董事成员并非非 IT 专家，也不打算成为专家。除了数字战略和业务模式的转型外，理解法律、威胁、风险、后果、角色与职责以及保护公司的方法仍然是必要的。


  董事会和管理层面临的困难，特别在于缺乏一种所有人都能理解的关于网络安全问题的通用词汇，也缺乏用于评估、管理、比较和就网络表现决策的客观数据。


  首先，这是一个改进 IT 部门与公司其他部分沟通的问题：四位 IT 决策者中有一位在发生网络攻击时不会通知其管理层。


  公司董事会可以设立数字委员会（如施耐德电气在 2017 年所做的）或安全委员会（如瑞士历力华集团 Richemont 所做的），能够能够管理和控制网络风险及危机管理，并为董事提供更多数字培训：


  *   施耐德电气的数字委员会致力于数字战略和表现。它每年至少召开三次会议，包括与审计风险委员会共同审查网络安全风险。它通过深入研究七个主题为董事会的工作做准备：数字业务的发展与增长、集团客户和合作伙伴数字体验的改进与转型、通过有效利用培训技术和数字自动化能力提升施耐德电气的运营效率、网络风险评估以及提升集团在网络安全地位（与审计委员会共同完成）、评估可能的并购对集团数字战略的贡献、数字环境的监测与分析（竞争对手和处理商、威胁与机会），以及验证公司是否拥有数字化转型所需的人力资源；


  *   历力华集团（瑞士奢侈品行业）创建了战略安全委员会（SSC），每年会议四次。其职责是就安全政策的所有方面向董事会提供建议；其目标是保护公司资产（包括机密信息和知识产权）以及运营免受侵入性行为。委员会还监督财产和人员。


  ## 2.3.5. 董事会与数据保护


  众所周知，我们已经进入了大数据时代，这包括捕获、分析、共享和存储数字数据。大数据由电子商务驱动，未来服务将由物联网、自动驾驶汽车或无人机驱动。


  越来越多的公司正经历着网络攻击和数据泄露，例如 Yahoo!、Equifax、Facebook 或英国航空。这两项观察引发了数字信任问题，因此也引发了数字责任问题。


  `GDPR`（通用数据保护条例）在此背景下是一个关键框架。


  ## 2.3.6. 法审计师


  法审计师的主要任务是认证财务报告的合性和真实性。这是一项持续工作，并包括对合作伙伴的义务。通过对公司程序的了解，审计师与他们之间可以发挥真正的作用。


  法国注册审计师协会（CNCC）开发了 `CyberAUDIT©` 工具，该工具可以衡量公司对网络风险的暴露程度和成熟度，评估财务影响并为管理层准备报告。




  除了公司的安全性和可持续性外，董事会（以及如果已成立的数字委员会）将负责确保数字化战略对社会和环境的影响。


  ## 2.4. 客户与供应商


  在 BtoC（企业对消费者）活动（如在线销售或在线银行）中，客户满意度与其产品或服务提供商所实施的网络安全和数据保护措施的质量密切相关。


  客户对供应商的信任不仅与其所购买的产品或服务的质量有关，还与网站的质量和安全性、支付方式、供应商在交易过程中收集和存储的数据保护水平，以及在连接网站时对所给予或拒绝的同意的尊重情况有关。


  这些在网络安全和客户数据保护方面的努力既有成本，也是一项核心的竞争优势。


  根据森森哲数字转型学院 2018 年对 6,000 名消费者的一项研究，网络安全和数据保护是选择在线供应商时第三重要的标准，仅次于产品或服务的质量及可用性，优于销售价格和折扣、品牌声誉以及产品缺陷或损坏时提供更换或退款的保证。


  在客户请求中，最常见的包括以下几项：


  - – 对保存数据的加密；

  - – 请求密码；

  - – 数据隐私政策的清晰度；

  - – 控制存储数据及数据归档期限的可能性；

  - – 使用防病毒软件；

  - – 在网站和应用程序中使用加密工具；

  - – 双重认证（使用手机或指纹）。


  该研究还显示：


  - – 消费者对网络安全和数据保护努力的感知低于其供应商声称或认为已达到的水平；

  - – 如果有更多保障，消费者将进行更多在线购物。


  导致这种差异的主要原因是：


  - – 联网设备故障、职责分离不当、基础设施陈旧、安全工具不足、脆弱的支付系统、缺乏数据加密以及人为错误；

  - – 供应商对所做努力缺乏沟通；

  - – 对数据泄露缺乏透明度（2015 年至 2017 年间，40% 的在线零售商发生个人和机密数据泄露）。事实上，31% 的供应商（零售商）在收到媒体报道之前并未通知客户。`GDPR`
  条例将提高这种透明度，因为在发生高风险（例如信用卡被盗）时，公司有 72 小时通知当局（例如法国的 `CNIL`、`Commission nationale de
  l’informatique et des libertés` 以及英国的 `ICO` 信息专专员）并通知客户。


  该研究的结论侧重于获得客户信任并提高每位客户带来营业额的建议：


  - – 理解他们的期望，走在网络安全设备的前沿并领先黑客；将精力放在保护收集的数据上；

  - – 监控并审计信息系统和交易以检测异常；

  - – 定期对员工进行系统性培训（电子商务活动的人员流动率高）；

  - – 加强安全措施：防病毒（防火墙）和认证系统（具有足够的密码长度）。


  在数据泄露后，电子商务公司通常关注两个主要行动：实施解决方案以免受 `APTs`（高级持续性威胁）的影响，以及建立 `SOC`（安全运营中心）以检测和防止欺诈。然而，以下行动未被视为优先事项：数据成本、系统和网络重新设计、专家招聘和司法调查。


  ## 2.5. 运营管理


  ### 2.5.1 数字化转型的影响


  董事会必须反思运营管理数字技能的问题，该部门负责定义战略并向董事会提：在数字化革命与管理层技能之间寻找正确的平衡，可以加强管理委员会的实力，重新平衡其并在新技术方面对其培训。


  事实上，这些提供了新的机会，并对工作方法、公司组织和文化、层级关系以及与外部的关系产生巨大影响。数字化转型也带来了重大风险：缺乏互动、意义丧失、国际化、权力移交、价值链变化、新职业的出现以及传统职业的消失。


  数字化转型还需要调整薪酬机制：多渠道改变了营业额比例。工具实现了信息共享和生产力提高，生产方法和质量控制基于信息系统。


  这种转型需要技能、培训、组织变革和投资。


  它并非没有风险：矩阵式组织、中间管理减少、加速和短期管理、协调会议的增加，当然还有技术挑战、网络攻击风险、投资金额、与客户接触的减少以及质量和在价值链中定位的下降。


  ### 2.5.2 数字化战略


  在公司实施治理和数字化战略以应对安全挑战是管理者的责任：数据、产品和信息系统安全（通用 IT、生产、销售、支持部门）、数据识别和关键系统。


  这也是董事会的责任，董事会必须审查数字技术提供的新机会，并审查目标以确保公司的可持续性。然后，必须选择最佳战略来实现这些目标，监控其执行情况并分析风险以控制风险。


  数字技术的使用本身不是目的，而是获取新客户和市场、提供新产品和服务、甚至提高公司绩效、获得效率并优化业务模式（销售价格、成本价格、投资等）的手段。


  尽管它本身不是目的，董事会也无法忽略从机会和风险两个角度通过数字化视角对目标和战略进行审查。这种审查对于每个行业和每种类型的公司会有所不同。


  对客户及其习惯和需求的演变、竞争对手、新进入者以及行业创新的深入分析，以及公司流程可能发生的转型，对于董事来说是至关重要的。这种监控的结果和对这些信息的分析应由董事会共享。


  收集的数据质量以及对数据的分析对于开发商业报价、客户关系和支付方法至关重要。





  另一方面，如果竞争对手进展更快并夺取市场份额，如果执行层面（商业或生产端）质量不高，或者对分发平台的依赖程度过高（在这种情况下，平台的去中心化对公司可能是致命的），以及公司成为网络攻击或互联网上虚假信息的受害者，这可能构成重大的战略风险。


  董事会不会系统性地保留数字技术，他们可能倾向于与客户保持密切的接触，同时在他们愿意时提供使用数字工具的可能性。复杂性是安全性的敌人。


  ### 2.5.2.1. 几种可能且互补的对


  #### 安全与敏捷性之间的妥协


  一项全范围的研究显示，94% 的 `CIOs` 和 `CISOs` 为了避免影响公司业务，在安全方面做出了妥协。


  我们都会在个人安全或公司安全与风险承担之间做出妥协。IT 安全也不例外这一现实。但就像家庭的物理安全一样，根据居住地的不同，我们有无法偏离的规则。投资安装 `digicode`
  并在 `Facebook` 上发布代码，或者安装对讲机却在不询问姓名的情况下让每个人进入，都是没有意义的。


  同样，最先进的监控工具、`antivirus programs` 和 `firewalls`，如果没有严格管理 `access management`（移除给予外部服务提供商、`fixed-term
  employees`、`temporary workers`、实习生的的临时访问权限），如果 `passwords` 不定期更新，如果信息没有根据公司安全策略通过
  `access management` 进行分类，以及如果机密信息的交换（例如 `board of directors’ information`）没有严格保留给授权人员，且没有进行安全存储和适当的
  `encryption`，那么它们也是毫无用处的。


  超安全解决方案的销售在介绍他们的奇迹方案时会立即说明：工具的管理、`access`、`flows` 以及是否 `encrypt` 的 `decision` 并不是他们的责任。因此，仅仅购买工具是不够的，还有必要分析需求，检查其与现有
  `IT environment` 的集成情况，培训用户工具的功能、目标和警惕点，然后任命一名 `administrator`，该人员可以定义规则、组织和流程，并被授权修改、更新、添加或删除文档。


  更新是妥协来源的一个良好例子：根据同样的研究，81% 的受访者表示，他们已经克制了部署“重大”更新的打算，52% 的人表示曾多次这样做，以避免影响公司运营和避免
  `downtime`，避免影响 `legacy systems`，或者由于公司其他部门的内部压力（对于这些部门，公司的弹性不是首要任务）：客户是优先事项，直到无法为客户提供服务或收费的那一天为止。


  #### 从“设计安全”项目开始的安全保障


  新工具的实施需要项目管理，而在项目管理阶段必须考虑信息的安全约束（`confidentiality`、完整性、`accessibility`），通过定义这些规则、组织、程序以及随时间推移的管理。这被称为
  `Privacy by Design`。当从项目开始就考虑这些安全约束时，可以避免在项目完成或在使用期间出现安全漏洞和合规性工作。


  此外，在设计阶段还需要考虑选项：在特定预算下，我们决定：将门换成 `armored door` 吗？在特定预算下，我们决定：将门换成 `armored door`
  吗？


  ### 2.5.3. 性能低下的后果


  为了确保符合法规，必须识别收集的数据哪些是敏感的，特别是 `GDPR`。


  ### 2.5.4. 网络安全


  等一下，让我根据 `GDPR` 重新检查一下文本文本。




  法律部门的介入至关重要，负责确保符合国际法规、法律和标准；财务部门的介入也同样重要，他们必须预测成本和生产力收益、财务投资，并预测额外的安全成本：`SOC`（安全运营中心）、`CERT`（计算机应急响应小组）或外包监控，具体取决于公司的规模和活动范围，以及培训、渗透测试和审计。


  内部治理需要明确角色和职责，并建立：


  - 安全程序和策略（仅有一位优秀的 `CISO`是不够的）；

  - 深度防御：门+报警器，而不是简单的防盗门；

  - 设计安全（Security by Design）：安全必须从项目开始就进行设计，这比在项目期间或项目完成后再集成要容易得多且便宜得多；

  - 连续性计划，以确保公司能够继续销售、生产和管理活动。


  在此背景下，首席财务官（CFO）关注的问题非常广泛。网络犯罪对公司造成的财务后果包括财务资产、知识产权、品牌和互联网存在、声誉、业务连续性、个人数据被窃和非法处理、机密信息泄露、欺诈、赎金支付、数据完整性、遭受攻击时的调查成本，以及客户、员工、股东或合作伙伴发起的诉讼成本。


  对真正的网络预防文化的需求涉及整个经济结构，特别是中小企业（SMEs），它们受保护较少，在统计学上是首要目标，并且往往是进入大型公司的门户。


  例如，对于瑞士的中小企业，`ICTswitzerland`提供了在线安全测试以及保护公司的基本建议。


