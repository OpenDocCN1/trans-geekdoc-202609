  ## 2.5.5. 合并收购交易


  最后是合并收购交易特殊特殊，必须进行特定的网络尽职调查。


  事实上，这至关重要：


  - 评估 IT 管理、服务提供商、工具和流程的质量，以及检测和响应事件的能力；

  - 进行审计：网络事件、漏洞、攻击的数据恢复计划、数据保护水平、存储位置及数据传输期间的访问管理；

  - 与公司专家或外部审计师一起，核实“目标公司”的网络成熟度、数据的性质及其战略价值、对 IT 法规和标准的合规性、深网和暗网上的 IT 事件痕迹、网络保险政策；

  - 估计安全系统、培训技术团队和人员（多功能和多站点）的成本。


  收购完成后，必须整合、传播并执行集团程序、映射风险、实施网络安全战略以保护关键资产、管理第三方，并验证响应事件指令的存在，确保公司在遭受攻击时的韧性。


  ## 2.5.6. 治理与数据保护、网络安全


  ### 2.5.6.1. 内部数据


  为了优化数据收集、更新和存档工作，并确保分析至关重要的数据质量，必须定义数据治理：识别战略性和非战略性数据，收集业务和部门的需求，定义公司内部每项数据的角色和职责，以及更新规则（谁、何时、文档记录）和访问规则（写、读）。


  这是一个真正的项目，但如果公司成功，将节省大量时间和提高质量。这需要听取所有参与者的需求，理解他们并做出妥协，以便实现共享。


  如果要让所有参与者对他人产生的数据质量充满信心，高度的纪律和严格规则的应用是至关重要的。对于组织在孤岛中的公司来说，这是一个挑战，因为他们担心失去权力而不与他人共享数据，但如果数据生产者能够朝着共同目标采取行动，这就是创造价值的进步。


  如果在数据治理的基础上，加上网络安全资源的适当治理（涉及 IT 职能、运营经理以及财务、人力资源和法律职能）以及文化的转型，数字转型将获得成功。


  ### 2.5.6.2. 客户数据


  客户数据的收集可以通过多个渠道进行：通过销售团队的关系、商店和网站进行。所有这些数据的汇总本身就是一个课题，需要建立一个销售组织，使其能够通过不同渠道联系客户而不会让他们感到被骚扰，同时有必要确保所有客户都在一个公共数据库中。


  这里的问题不在于处理这种商业数据组织，而在于出于合规和伦理考虑确保此类数据的保护。这个问题将在后续章节中讨论。


  ### 2.5.6.3. 开放数据与个人数据保护


  行政机构产生或收集数据并必须使能够能够自由使用。同时，它们受到 `GDPR` 的约束。即使经过匿名化处理，数据有时也可以归因于某个人，例如通过交叉引用。


  这是一个极其敏感的话题，除了信息系统的保护外，还需要特定的数据处理和精确的控制，以避免不符合法律的处理。


  ### 2.5.6.4. 公共数据 – 严重的监视？


  许多城市和交通公司正在建立视频监控系统。“Smart cities` 收集数据以改善交通流量或能源消耗。


  目标通常是合法的（安全、降低成本），有时仅是商业性的（一家瑞士初创公司开发了适应路人特征的广告板）。涉及的是数据所有者的同意以及保护数据的能力：提供商是私人公司。监控公司和
  IT 服务提供商如何处理这些数据？它们存储在哪里？保留多久？谁有权访问？如何安全？产生了许多问题。这些数据的机密性、完整性和安全性由公共和私人领域共同。整个生态系统的质量极其重要。


  多伦多实施了许多传感器，并收集了运营所需的公共和私人数据，该城市的项目公司（一家 Google 系公司 `Sidewalk Labs`）可以识别身份并将数据用于商业目的。


  多伦多的居民对这些数据的使用有何保证？它们是如何被管理的、由谁管理以及为了什么目的？城市与服务提供者之间有何合同和财务联系？居民是否参与以及他们是否有发言权？这些都是城市的治理问题。






  “网络风险”这一术语具有误导性。实际上，风险是由于 IT 因素导致的业务风险：风险在于无法销售、无法生产、无法支付或无法收到付款，因为培训系统在支付赎金之前被锁定，或者因为数据被加密了。


  声誉损害（无论是由于数据丢失还是网络诽谤）都可能对公司的业务产生影响。网络风险的格局在不断变化，且难以量化（缺乏历史数据）。


  不存在所谓的零风险。问题不是“我们是否会成为网络攻击的受害者？”，而是“我们何时会成为网络攻击的受害者？”。网络风险是一种元风险，影响公司的所有职能。


  ### 管理网络风险与尽职调查


  网络风险必须接受特定的尽职调查：系统、技能、治理、预算、服务提供商质量、供应商、子公司、保险以及对网络事件、漏洞和发生攻击时的数据恢复计划的定期审计。


  仅识别战略性系统是不够的；战略性数据的分析、此类数据在存储位置和传输过程中的保护，以及访问控制，也是至关重要的参数。


  评估技术、人员（内部和外部：供应商和服务提供商）、财务和法律风险；评估网络安全治理和管理参与的风险，网络安全在信息系统和日常运营中的考虑程度；建立事件报告机制；估计安全系统和数据的成本，培训技术团队和员工，都是管理层和董事会的职责。


  董事会除其他义务外，还有法律义务监控公司风险管理系统的有效性，并特别要确保执行行动计划以补救这些风险（通过设定优先级）。


  因此，运营经理必须意识到这些风险，为公司提供一个全局风险管理系统（`ERM`，企业风险管理），并将协调工作委托给风险经理（针对大型公司），风险经理的使命是实施补救和预防政策，以及通过保险转移，这些有助于增强公司的韧性。


  网络风险的控制是复杂的；网络安全是一个跨学科主题，需要风险治理方法、明确的责任承担以及所有利益相关者的参与。管理方法与技术方法的一致性是成功的关键因素。


  某些活动领域（例如 BtoC 或医疗领域）比其他领域面临更高的风险。每家公司都必须实施信息系统安全策略（`ISSP`）：保证系统的可用性、其正常运行、信息的机密性和完整性。


  挑战最终将不再仅仅限于关键环境，而是要认证可靠的系统和产品。


  网络风险不再是技术风险，而是业务风险，因此必须定义公司网络安全资源的治理和组织，涉及 IT 职能、运营经理和支持职能。这是公司韧性的前提。


  无论公司从事什么活动，必须建立流程以确保机密性、完整性、数据安全、适当治理（角色和责任：谁有访问权限、谁授予数据访问权限、谁可以传输以及传输给谁、谁保留等）、这些数据的分类（机密程度、敏感性、对业务的价值），并因此由
  `CISO` 决定相应的保护水平。


  网络安全团队的主要任务是保护所有维度（个人和战略）的数字信息，并根据公司拥有的数据为运营部门开发新产品或服务提供建议，同时确保其安全。最大化利用数据的潜力还可以带来财务收益、生产力提高和员工效率的提升。


  ## 3.2. 背景


  根据 Ponemon Institute 的项调查，每两个组织中就有一个机构不定期进行网络韧性测试。77%（法国为 82%）受访的 IT 专业人员表示，他们没有在整个公司范围内一致地应用计算机安全事件响应计划（`CSIRP`）。然而，IT
  安全测试的频率不规律——网络韧性——对公司来说是昂贵的。


  数字技术、交换速度、公司规模和国际化导致了国家主权的丧失、对信息控制权的丧失以及对预先分类信息的安全问题以及使用的转型；现在是全方位透明共享（包括社交网络）的时代，透明度被视为功能故障的解决方案。


  运营的速度、人员的减少、任务的复杂性以及缺乏互动往往会导致员工参与度降低和对问题的理解不足。犯罪分子乐在其中。后果首先是经济性的。


  ## 3.3. 漏洞


  漏洞是可以被犯罪分子利用的安全漏洞。某些漏洞是零日漏洞，即已知但没有补丁。某些漏洞是已知且有可用的补丁。


  基于漏洞数据库的自动化分析软件可识别网络、应用程序、服务器或系统中的潜在漏洞。完成分析后，工具将报告所有检测的问题并建议修复措施。先进的工具将有助于根据业务运营和安全性决定是修复还是接受风险。分析可以与
  `SIEM`（安全信息和事件管理）解决方案集成，以提供更全面的分析。


  渗透测试也是漏洞分析的补充，允许我们了解漏洞是否可以被利用以及产生什么影响。它们还可以识别软件、应用程序或其他漏洞，并完善零日漏洞和已知漏洞列表。


  主要目标是评估风险并制定修复行动计划。由于 IT 安全团队的资源通常有限，他们必须根据公司（或公共组织）运营和职能经理确定的优先级来规划其行动：


  *   对于零日漏洞，可能决定隔离应用程序或系统部分，并在等待补丁期间进行额外检查。这样在发生攻击时影响将有限；

  *   对于已知漏洞，可以根据公司业务、职能以及监管要求确定的优先级建立修复计划（优先级根据针对识别漏洞的攻击概率和估计影响定义）。


  与运营经理优先考虑行动非常重要，他们必须意识到风险、理解风险，并在与安全经理配合的情况下积极实施解决方案或承担风险。


  ### 3.3.1. *针对总裁的诈骗*






  针对总裁的诈骗在法国每年造成的损失达 4.8 亿欧元。这种诈骗包括网络犯罪分子伪装成公司经理，通常要求会计师或财务人员向境外转账大笔资金（根据目标公司的规模，金额从
  100 万到 2000 万欧元不等），用于一项非常机密且紧急的操作（如公司收购）。得益于对公司及其组织架构、流程和项目的充分了解，通过“利用”员工的恐惧或自尊心、在假期期间或管理层变动期间，诈骗者成功实施了这些在按照流程操作时本不应被批准的交易。


  Pathé 集团在 2018 年 3 月遭受了一场超过 1900 万欧元的诈骗，目的是在迪拜进行一项虚假收购。数千家公司都是受害者：KPMG 在 2012 年损失了
  720 万欧元；空中客在德国损失了 300 万欧元；米其林、Intermarché 和可口可乐也中了手；而在年初，创纪录的 4200 万欧元被转入了一家名为 FACC
  的奥地利航空设备制造商手中。


  保险公司并不将此类诈骗视为网络诈骗，尽管经常存在身份盗取的“虚假邮件”；然而，这些诈骗是通过数字手段辅助实施的：通过电子邮件传输的订单、使用“声码器”模拟经理声音的电话，以及银行监控的削弱。


  ### 3.3.2. 供应商诈骗


  供应商诈骗非常简单：诈骗者联系公司的供应商，伪装成公司的会计或审计师，向其索取待付款发票的信息。然后，诈骗者联系公司，伪装成其供应商并要求更改银行账户。接着他/她会通知你银行账户变更，并发送带有新账户号码和电话详情的供应商抬头信发票。


  与针对总裁的诈骗一样，供应商诈骗也受到组织松散、财务与业务脱节（外包共享服务，有时甚至在遥远的国家）、能够通过电子邮件误导财务团队的能力（身份盗取）、通过电子邮件发送虚假文件（已不再是纸质原件）、以及对程序、规避陷阱和执行检查缺乏培训的影响。


  财务部门往往是链条的最后一环；公司试图节约、重组、数字化，但必须关注团队质量、他们对公司合作伙伴的了解以及对业务的理解。


  数字化必须伴清晰的培训和流程：向供应商进行回电、身份验证（通过电话和电子邮件）、与银行核实、由经理签名确认新银行账户、限制在互联网和电子邮件上传播信息。


  诈骗者极具想象力且执着不扣，几乎总是利用人性的弱点。


  ### 3.3.3. 其他经济影响


  ![图图 3.1. 历史：网络攻击对目标公司业务的影响增大（来源：CESIN）。有关此图的彩色版本，见 www.iste.co.uk/defreminville/cybersecurity.zip](img/image96_c2893.jpg)


  **图 3.1.** 历史：网络攻击对目标公司业务的影响增大（来源：CESIN）。有关此图的彩色版本，请访问 `www.iste.co.uk/defreminville/cybersecurity.zip`


  除了诈骗，公司还会经历（来源：埃森哲）：


  * 机密信息泄露（63%）：知识产权、竞争优势、客户数据的损失；

  * 声誉的负面影响（38%）；

  * 运营损失（30%）；

  * 直接财务损失（28%）；

  * 勒索赎金的财务（17%）。


  2015 年，数半的信息被泄露或被盗。


  网络攻击涉及的不仅是大型公司网络，还有 80 亿条信息。


  网络犯罪每年产生 4450 万欧元的损失，而在过去 10 年中，电信诈骗造成的损失高达 1.6 亿欧元。


  诈骗对公司的财务后果（在全球范围内平均）涉及：


  * 财务资产：通过诈骗、身份盗取和勒索；

  * 知识产权和商业秘密：通过间谍；

  * 品牌和形象：通过破坏网站、诽谤；

  * 业务连续性：通过破坏和运营服务；

  * 个人数据：通过非法处理；

  * 机密信息泄露：通过并购收购等；

  * 赎金；

  * 数据完整性；

  * 声誉：通过攻击引发客户、股东或合作伙伴的诉纷；

  * 法律成本：通过调查和防御。


  因此必须被视为公司的战略资产。


  ## 3.4. 法律风险


  ### 3.4.1. 集体诉讼


  2017 年 6 月，美国最大的医疗保健公司之一 Anthem 同意支付 1.15 亿美元解决集体诉讼，该次数据泄露涉及 8000 万名用户的个人信息。


  近年来出现了许多其他重要的数据泄露监管。2016 年至 2017 年，家得宝就违规行为支付了 1950 万美元。同样，Target 在 2015 年和 2016
  年支付了 1.05 亿美元解决集体诉讼。


  2014 年，Morrisons 的一名高级审计师下载了包含近 10 万份员工数据的文件，包括姓名、地址、出生日期、电话号码和银行账户。尽管公司采取了网络安全控制，法院仍判定其承担责任，因为这是由员工自发行为造成的。在英国劳动法中，替代责任是指雇主对其员工行为所承担的责任。


  2018 年 10 月 8 日，华住的一名股东在加利福尼亚州中央区对华住发起了证券集体诉讼。该诉讼与数据泄露有关，具有许多有趣的特征。华住在中国经营酒店，其股票在纳斯达克上市。2018
  年 8 月 28 日，上海警方在社交媒体上发布声明，称他们接到了有关该公司可能发生数据泄露的报警。根据媒体报道，“近 5 亿条信息被发布在一个黑网论坛的消息中以待出售”：1.23
  亿条华住官方网站的注册数据，如姓名、手机号、身份证号和连接 ID；24 亿条酒店入住数据，如姓名、信用卡号、手机号、入住离店时间、消费金额和房间号。出售尝试未成功。






  诉状指控公司对投资者缺乏透明度，公司没有足够的安全措施来保护客户信息，且将面临诉讼风险增加和成本的上升。公司向股东提供的有关公司活动、运营和前景的信息实质上是虚假的，甚至具有误导性。未来集体诉讼的数量很可能会增加。


  ### 3.4.2. CNIL 和 ICO 的制裁


  随着 `GDPR` 在 2018 年 5 月的引入，2018 年成为记录性年，特别是在投诉数量方面（增长了 32%）。`CNIL`（法国国家信息技术与自由委员会）被“明确标识为专业人士和公众的参考信息来源”。


  在提交的 11,077 投诉中，有三分之一涉及互联网上发布的数据，21% 涉及营销推销，其次是人力资源和银行。我们还可以提到对视频设备图像远程监控（尤其是由雇主进行），这指向了对员工过度监控的风险；在护理单元安装摄像头，从而为了“安全”对弱势群体进行拍摄；银行或在线内容服务的客户希望行使数据可携带性权利；个人数据的安全；以及不仅限于互联网，还对手机应用程序可以访问手机中数据的担忧。现在约
  20% 的投诉是欧洲合作的主题。


  `CNIL` 在 2018 年进行了 310 次检查。在大多数情况下，其干预导致了机构的合规：2018 年共处出了 10 笔罚款（其中 9 公开，7 涉及违反个人数据安全）和
  1 次非公开警告。


  英国航空于 2019 年 7 月 8 日宣布，由于 2018 年数十万客户的数据被盗（包括姓名、地址和信用卡数据，包括卡号、有效期和三位安全代码），预计将向英国信息专员办公室
  (`ICO`）支付 1.83 亿英镑（2.04 亿欧元）的罚款。


  `ICO` 估计约有 50 万客户的数据被“处理”，并将其归于“公司安全系统薄弱”。`ICO` 专员伊丽莎白·丹汉（Elizabeth Denham）表示：“人们的个人数据必须保持如此”。


  她说：“当你被赋予个人数据时，你必须保护它。那些不履行的人将受到 `ICO` 起诉，以确保他们已采取适当适当措施”。


  `ICO` 处的罚款金额占英国航空 2017 年年营业额的 1.5%。


  攻击者使用的方法是通过向网站预订页面注入计算机代码来吸取数据。该代码记录支付页面上的鼠标移动和点击，允许黑客重构用户输入的信息。


  ### 3.5. 风险制图的目标


  主要目标是采取适当措施确保公司的可持续性，从而确保其绩效。


  风险制图必须基于公司的战略目标。它必须主要关注系统、信息和流程。


  正如我们已经看到的，公司是脆弱的，因为与其环境相连，不存在零风险，而且目标不是将公司变成一个拥有几层围墙的坚固堡垒。


  安全系统有三个目标：


  *   – 数据安全：数据保护、数据存档（数字和纸质）、个人和/或共享存档、文件（电子邮件或文件夹中）和电子邮件分类、备份（频率、质量、完整性）、保留期以及必须遵守的公司规则；

  *   – 机密性：机密数据的识别，根据主题和机密性水平或法律风险选择合适的通信或共享方法（电子邮件、会议、纸质、短信、社交网络）（在发生程序时，电子邮件会留下痕迹
  [字数过多]）；

  *   – 完整性：访问权限的管理（读取、输入、管理）以及证明数据质量的文档。


  ### 3.6. 不同的风险分析方法


  信息系统存在不同的风险分析方法：重要的是使用适当的方法，使其适应公司，让公司的不同职能和/或运营部门，并确保它不会变成常规工作。目标不是遵循该方法，而是使其成为交换信息、识别主要风险并做出补救这些风险的决策的工具，明确责任（谁负责什么以及何时负责），并根据保险公司提供的条件将某些风险转移保险。


  在英国，`CRAMM` 是一种由英国政府机构 `CCTA`（中央通信与电信局）开发的风险分析方法。这是英国政府首选的风险分析方法，但也也被许多其他国家使用。


  在其名为《提高计算机韧性的最低标准》（“Norme minimale pour améliorer sa résilience informatique”）的文件中，`DEFR`（瑞士联邦经济、教育和研究部）区分了工业控制系统
  (`ICSs`) 和信息通信技术 (`ICTs`)，并建议应用国际标准（`ISO`, `COBIT`）以及 `NIST`（美国国家标准与技术研究院）框架，其包含：


  *   – 识别；

  *   – 保护；

  *   – 检测；

  *   – 响应；

  *   – 恢复。


  美国使用由卡内基·梅隆大学开发的 `OCTAVE`（运营关键威胁、资产和漏洞评估）。


  国际上使用 `ISO/IEC 27005`，这是一项逐步满足 `ISO/IEC 27001` 要求的国际标准。它是最新的标准，由于其实用性而易于应用。


  在法国，最常用由法国信息系统安全局 (`ANSSI`) 开发的 `EBIOS` 方法（需求表达和安全目标识别）。该方法可用于绘制公司及其生态系统的风险图，也可用于管理
  IT 项目或公司开发的产品或服务的风险。


  该方法具有几个优点：它是务实且具有可操作性的，它涉及业务部门，让工作组有机会清点所使用的 IT 系统，想象威胁可能来自哪里，描述担忧的事件，为业务部门、IT 部门和
  IT 安全部门识别的风险制定措施计划，从最可能的开始（无法访问的数据、网站、快递服务、生产停工、欺诈）。总结将提交给执行管理层，以便其理解、裁决、优先排序并可能释放资源（人力和财务）来实施建议的战略。


  所有这些方法必须根据公司的行业和规模进行调整。无论是公司、公共机构、协会还是基金会，采用这种方法并让公司的各种参与者定期评估影响系统可用性、完整性或机密性的 IT
  风险至关重要。


  确保这种风险管理工作不会常规化（即更新六个月或一年前做过，而不挑战风险等级、威胁和场景）也同样重要。因此，必须修改团队组成，保留一些能够回顾之前分析推理的人员，并引入内部或外部人员，他们将对问题提供新的视角、批判性的眼光和新的视野。






  ## 3.7. 风险评估（识别）


  **表 3.1.** *2017 年世界经济论坛风险框架*


  | **网络事件的影响** | | **网络事件的概率** |

  | --- | --- |

  | **面临风险的资产** | **损失** | **脆弱性** | **威胁** |

  | **无形资产：知识产权；声誉；合规性** | 机密性 | 文化与员工 | 不满的员工 |

  | 人为错误 | | | |

  | 内部交易 | | | |

  | 激进主义活动 | | | |

  | **有形资产：财务；股票；生产系统；基础设施设施** | 完整性 | 组织与流程 | 犯罪活动 |

  | 供应商或合作伙伴的行为 | | | |

  | 破坏行为 | | | |

  | **公共利益：个人安全；隐私；个人自由** | 可用性 | 技术与基础设施 | 间谍活动 |

  | 恐怖主义 | | | |

  | 网络战 | | | |


  ### 3.7.1. 主要参与者


  系统、软件、应用程序或流程的业务部门和主要用户必须理解 IT 风险所在的位置，因为这些风险可能会影响其运营活动的运行。第一步是想象如果信息系统遭到破坏、由于攻击导致数据质量恶化，或者由于勒索软件导致数据不可用，公司在运营（销售、生产、物流）、财务（营业额损失、欺诈）、法律（纠纷）和声誉（质量问题、无法交付、健康问题）方面会产生什么影响。


  运营经理对潜在的恶意内部或外部威胁也应该有自己的见解。


  换句话说，对于一家消费品配送公司来说，网站被封锁三天且无法销售产品的后果会是什么？质量控制问题（无论是恶意还是非恶意的）对乳制品生产行业产生什么影响，可能导致消费者食物中毒？对于一家律所或税务事务所来说，如果连续几周无法访问完全数字化的文件会有什么后果？


  风险经理、IT 经理和 IT 安全经理不能是负责风险评估的负责人。这些评估应由运营经理和 IT 安全经理系统地共同签署，然后由大型公司的风险经理或高层管理进行整合，甚至进行优先级排序。


  ### 3.7.2. 步骤


  第一项行动是对设备和资源进行盘点，这将提供对系统架构的理解，包括工业系统与公司网络之间的连接（必须受到限制和保护）、工作站清单（必须以一致的方式配置并符合通用规则）以及内部外部信息流的完整概述。


  `ISO2700x` 系列标准将“资产”定义为对组织具有价值的任何元素：主要或生产资产（上游物流、制造、下游物流、营销与销售、服务、流程、信息）和次要资产（服务器、软件、网络、采购、研发、技能、IT）。对要保护的资产进行优先级是第一步。


  这些设备的物理安全旨在防止恶意入侵以访问、盗取、修改、破坏或损坏信息，无论设备是固定的（例如服务器）还是移动的（计算机、电话等）。


  它还旨在保护它们免受火灾、洪水或恐怖主义行为等事故的影响。系统并不总是受到保护。


  ### 3.8. 保护


  系统的保护需要：


  - `firewall`、`logs`、`authentication`

  - `passwords`、`USB`

  - `audits`、`training`


  ### 3.9. 监测


  攻击发生而不被察觉的情况很少。有必要识别连接尝试、组织数据并告警。


  ### 3.10. 响应


  在发生攻击时你是否有干预计划？公司团队是否知道该干预计划？他们知道在出现异常时通知谁吗？他们知道如何应对？给谁打电话？拨哪个号码？拔掉插头，断开手机连接？





  恢复是一个主要步骤；它包括重启系统、服务，并使数据重新可用，同时保持初始的机密性和完整性。


  ## 3.12. 去中心化映射


  ### 3.12.1. 内部威胁


  正如前面多次提到的，威胁往往源于内部，有时是出于恶意的，通常是由于疏忽或信息误导。百分之七十五的内部事件据报告是意外和无意的。


  前员工（或处于离职阶段的人员）是一个警惕点：每四起内部事件中就有一个源自（前）恶意员工。如何识别他们并防止他们实施恶意行为？


  各部门（IT、人力资源、法务和合规）是否与业务部门共同工作，以建立网络安全文化和问责机制？是否实施了定期培训，以确保了解指令并识别威胁？


  最有效的意识和培训方法是什么？游戏化？结合增强现实并适应公司环境的在线学习？向所有员工发送欺诈性虚假邮件活动？


  分发给所有员工的关于数据、系统和移动设备的书面程序？


  网络事件是否会自发报告（安全环境）？


  在招聘、培训、流动和对网络问题的理解方面，人力资源政策如何从一个职能转移到另一个？当人员自愿或离开公司时，对其持有和处理的数据采取了哪些预防？


  访问控制、加密、备份或流量监控是否到位且有效？


  关于公司信息机密的法律环境是什么？劳动合同如何？内部规定如何？法律部门是否参与了针对内部威胁的网络计划？


  黑客知道如何识别目标员工：拥有重要权限的系统管理员、IT 帮助台人员、管理委员会成员。受困于高度针对性的钓鱼攻击，他们是访问公司基础设施的有效途径。


  妥善管理访问权限并应用最小权限原则（将用户权限严格限制在其工作需求范围内），对于尽量减少用户账户被破解后的风险至关重要：拥有的权限越少，攻击效果就越差。


  第三方、服务商、供应商和分包商的管理比员工更困难，必须接受特殊对待。


  ### 3.12.2. 工业风险


  工业系统的安全性远低于 IT 设备。工业环境中的技术非常异构化。网络访问并不总是被列出，数据未加密，系统仍在使用默认密码配置，而工业领域缺乏安全文化使得攻击者更容易得手。


  工业设施的生命周期很长；因此，它们更容易受到新风险的影响，而且业务部门/安全经理有时（通常？）太薄弱了。


  Hervé Guillou 在 2016 年提到过这一点：


  > 公司的网络风险具有横向性质。但我们看到的是，不幸的是，它往往与公司的通用 IT 相关联，而与其工业生产环境关联较少，且几乎从未（银行除外）与公司的产品和服务（运营
  IT）相关。很多时候，一家公司的网络安全经理（如果有的话）就是 CIO/首席信息官本人，或者更糟，是隶属于他的人。这行不通！¹


