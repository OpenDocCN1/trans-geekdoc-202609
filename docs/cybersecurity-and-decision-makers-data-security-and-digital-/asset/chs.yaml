  ### 联网玩具


  “对于儿童玩具、智能手表和机器人存在一系列问题，关于录制和传输数据，”欧洲消费者组织（BEUC）副总监乌苏拉·帕赫尔（Ursula Pachl）解释道。


  半径 15 米内的任何人都可以连接到‘Cayla’ 玩具，”报告解释道，“只需在手机上打开蓝牙并按下玩具名称即可通过远程播放任何音频文件。”


  这意味着家外的人将有能力连接、提取玩具内存中的数据并向其注入自己的信息，”乌苏拉·帕赫尔总结道。


  ### 语音助手


  数以百万计的人使用语音助手寻找音乐、开关灯或询问路线。


  根据 Bloomberg 2019 年 4 月 11 日的报告，[Amazon.com](http://Amazon.com)在全球范围内雇用了数百人来改进 `Alexa`
  语音助手。这些人听取来自家里或办公室的录音，并将其整合到软件中，以便理解不同语言的请求。员工签署了保密协议，Amazon 拥有相关程序确保系统不会偏离录音或在遇到特定情况（人员风险、犯罪等）时访问隐私信息（信用卡号、健康状况、政治或宗教观点等）。根据
  Amazon，员工无法识别他们听到的内容。但为什么这种助手已经商业化？


  集成这些语音助手的公司声誉可能会受到影响：`Orange` 的联网扬声器、`Qualcomm` 的耳机、`US Bank` 的银行服务以及 `Legrand`
  的开关。终端用户知情吗？在销售产品时，Amazon 的听取是否发生了？最终客户是否给予了并在并在注册时都得到了提醒？


  保密规则（用户与注册之间）是什么？


  客户是否被清楚告知可以拒绝听取？集成语音助手的公司是否有能力审计以确保 Amazon 不听取这些？


  关于数据目前的规则是什么？录音是否安全地传输到 Amazon，它们被存储在哪里（存储多久），还是被销毁？


  除了合规问题外，用户还会面临这些问题。Amazon 在营销演示和隐私政策中并未清楚说明录音会被其团队听取。


  用户可以禁用录制功能，但 Amazon 表示录音仍然可以被“手动”分析。这些录音在传输时带有所有者的姓名和设备序列号。


  ### 联网设备的安全措施


  个人或专业用户可以提供最低的安全保障：关闭不必要的端口并不惜避免默认密码、在设备启动时立即接受自动更新、避免未加密通信（联网设备的卖家应让用户注意这些问题）。加州是美国第一个采用联网设备法的州。


  这项法律将于 2020 年生效，要求任何联网设备制造商提供保护设备及其包含的信息免受未经授权的访问、破坏、使用、修改或披露的功能，适用于加州销售的所有设备。设备必须具有唯一密码，用户在首次登录时必须定义密码。不再有网络黑客轻易猜到的通用默认标识符。


  ### 3.13 保险


  保险开始针对网络风险的许多潜在危害提供应对：数据恢复成本、危机管理援助、形象修复援助、以及数据被黑客攻击者的企业责任索赔费用。


  ![图 3.5. 公司日益购买网络保险（源：CESIN）。有关此图的彩色版本，请查看 www.iste.co.uk/defreminville/cybersecurity.zip](img/image116_c2907.jpg)


  **图 3.5.** *公司日益购买网络保险（源：CESIN）。有关此图的彩色版本，请查看 [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


  这些风险的保险并不总是落实。被盗数据的价值评估复杂，保险单不会阻止攻击，而是介入处理网络攻击的财务和其他后果。


  因此，建议检查合同是否涵盖网络事件、信息系统和业务中断成本、了解事实的审计、被破坏部分的重建、对第三方的损害以及形象风险。






  2018 年，仅有 24%的公司购买了与网络风险相关的保险。更新保险合同将验证保护系统的质量、安全策略以及潜在的漏洞。


  网络风险格局不断变化。网络风险错复杂且难以量化，特别是由于技术环境的瞬息万变以及缺乏网络索赔的历史数据。


  正如 Scor 保险与再保险公司首席执行官丹尼斯·凯斯勒（Denis Kessler）在 2017 年 4 月发布的一份文件中所说：


  > 考虑到风险领域，有三类风险：“天灾”（Acts of God），涉及自然事件；人为行为”（Acts of men），技术进步的结果；以及“魔鬼行为”（Acts
  of the devil），包括犯罪、战争行为和恐怖袭击。网络风险是当今复杂风险的完美范例，因为网络是新兴的、无形的、不可见的、跨国的，并且以与技术同步的速度快速发展。在网络语境下，“人为行为”包括具有无意图损害或后果的意外事件，而“魔鬼行为”则指网络犯罪。²


  因此，建议检查我们是否能回答这些问题：我的合同是否涵盖了网络事件？信息系统是否在合同涵盖范围内？保险是否涵盖了上述提到的所有后果？


  亿滋（Mondelez）与苏黎世再保险（Zurich Re）之间纠纷的结果值得关注。此案确实可能开启先例：


  - 亿滋在 2017 年失去了 1,700 台服务器和 24,000 台被 NotPetya 恶意软件感染的电脑。亿滋签署的保险合同规定，它涵盖了“物理损失或材料损坏的所有风险”，以及“对电子数据、程序或软件造成的物理损失或损坏，包括由于恶意引入机器生成的指令或代码造成的损失或损坏”；


  - 妙妙（Toblerone）、奥利（Oreo）和吉百（Cadbury）品牌的亿滋，向苏黎世再保险的美国子公司苏黎世美国保险公司索赔 1 亿美元；


  - 苏黎世再保险最初为亿滋提供 1000 万美元的赔偿，最终拒绝了任何赔偿，引用了其财产保险保单中的一项排除条款，该条款排了由“主权政府或势力”发起的“敌对行为或战争行为”造成的损害；


  - 这次大规模的网络攻击——勒索软件类型——确实被归因于俄罗斯黑客旨在破坏乌克兰政府的行动，尽管俄罗斯政府一直否认其是其源头。苏黎世美国保险公司采纳了这一论点，将
  NotPetya 视为“一种战争行为”；


  - 亿滋集团正在起诉苏黎世美国保险公司。


  如果苏黎世再保险未被定罪，这将对所有公司产生立即影响，这些公司将不再寻求将网络风险转移给保险，或将寻求让保险公司涵盖战争行为的后果。


  ## 3.14 非合规风险与伦理


  非合规风险非常新：它们主要追溯到 2018 年 5 月 GDPR 的生效，尽管法国的《数据保护法》或瑞士的《LPD》等法律已经规定了个人数据的处理（无论自动还是非自动的）。


  GDPR 考虑了自 1989 年互联网出现以来巨大的数字化发展、数字社会对数据的收集，以及此类数据在经济、政治或犯罪目的上使用的指数级增长。


  因此，非合规风险对公司而言是重大的，制裁措施也可能是巨大的。


  此外，消费者将对其数据的使用方式变得日益敏感，他们对供应商的信任将取决于对其同意（或不同意）的尊重、对收集和处理这些数据的透明度，最后取决于这些公司所采取的保护措施。


