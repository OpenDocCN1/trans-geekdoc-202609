  联网设备的发展为网络犯罪分子提供了了日益增长的机遇，因为在面向大众的联网设备设计中，安全性并非首要考虑：它被视为一种成本，而用户并不愿意为更安全的设备支付更多费用。


  工业级联网设备构成了新的攻击面，因此也带来了新的安全风险，公司必须考虑这些因素。


  `Mirai` 恶意软件在该领域广为人知：受 `Mirai` 感染的设备会在互联网上搜索与联网设备对应的 IP 地址。一旦发现，它们就会被用于攻击目标，且目标很难发现这些攻击。


  联网设备的民主化可能会引发新的诈骗或破坏加密货币的新可能性。它还将引发新的监管：英国数字事务秘书玛玛戈特·詹姆斯（Margot James）于 2019 年 5
  月提出了一项应对网络攻击的法案。这项新法将要求所有连接到互联网的设备（如家用电器、摄像头或智能恒温器）在销售时必须带有唯一密码，而它们目前是带有硬编码的默认密码出售的。该法律还要求制造商提供公开的联系点，以便研究人员提交有关联网设备的漏洞报告。他们还必须告知消费者设备的安全更新时间。最后，这项法律将导致一种“设计安全”的新标签系统，确保产品从设计阶段就具有安全性。


