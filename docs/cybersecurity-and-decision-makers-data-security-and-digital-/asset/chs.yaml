  2. 2 根据 2017 年 Scor 会议：“不断上升的网络风险：从无形威胁到有形的（再）保险解决方案”。


  # 4 监管


  ## 4.1. 背景


  五十年前，我们还不会接受自己的信件被拆封，但电子邮件可以被看作是一封没有信封寄出的明信片。如果我们的行踪被知晓、支出被追踪、阅读和购买被第三方研究，我们会做出强烈的反应。


  全球产的 90%的数据是在过去两年内产生的。


  主要的数据生产者是公司的数字平台和连接物体：智能手机、起搏器、电梯、冰箱或吸乳奶器。


  个人数据（信用卡、社会安全号码、电子邮箱地址等）具有价值。个人数据对公司、国家和黑客感兴趣。服务数字化的快速演变和全球化创造了一种新的数据经济：公司收集的客户数据越多，它就能为客户提供越多的服务或产品。


  作为免费提供给网站出版者、社交网络、出租车或公寓平台、搜索引擎或在线分销网站的个人信息的交换，个人数据保护的新挑战已经出现。


  技术允许私营公司和公共机构都使用个人数据。越来越多的人正在让自己的信息在公共和全球范围内公开，且大多数时候并没有意识到这些数据被用于商业、政治、社会或犯罪目的。


  这是社会和全球格局的重大剧变：数字服务和产品的平台及供应商主要来自美国（GAFAM）或中国（BATX）。作为我们给予他们数据的回报，在并不真正知道我们给了他们什么的情况下，他们有殖民欧洲的能力，他们了解我们的口味、消费和旅行习惯、我们的生活方式和健康数据、我们的财务状况、朋友、兴趣、职业背景和计划、我们入住的酒店、我们去的餐厅、我们访问的网站（实体和数字）、我们阅读的书籍和报纸、我们观看的电影。


  ### 4.1.1 向 CNIL 提出的投诉


  向 CNIL（负责确保个人数据使用得当）提出的投诉数量在 2018 年增加了超过 32%，主要是由于 2018 年 5 月《通用数据保护条例》（GDPR）的生效：`法国信息与自由委员会`在
  2018 年记录了 11077 次投诉，而 017 年为 8300 次。


  在 2018 年进行的 310 次检查中，有 49 次导致警告。例如，保险公司和从事移动应用程序精准广告的公司是首批目标行业：实施了 11 项制裁，其中包括 10
  笔罚款，其中 7 笔涉及个人数据安全违规。`Uber`、`Bouygues Telecom`、`Dailymotion`和`Optical Center`是受裁公司之一。


  超过三分之一（35.7%）的投诉涉及网上数据的传播，要求删除此类身份数据、账户、照片或视频。


  贸易和营销是第二个投诉部门，占总数的 21%，特别是短信营销的投诉“急剧增加”，这种营销通常在没有事先同意的情况下进行。


  在其他部门中，人力资源（特别是过度视频监控或定位）占投诉的 16.5%。





  正如 CNIL（法国国家数据保护委员会）2018 年度活动报告所述，“公民希望其个人数据以透明的方式被收集和使用，并用于他们接受用途。公司努力将合规视为一项能够为其提供独特竞争优势的要求，并借此增强利益相关者的信任。”


  欧洲已决定通过 GDPR（通用数据保护条例）保护其公民，公司必须遵守该条例，保护其收集的个人数据并确保信息系统的安全。


  ### 4.1.2. Vectaury


  Vectaury 专注于零售分析，即对分销行业客户数据的分析。Vectaury 成立于 2014 年 10 月，拥有约 70 人，声称与 100 多个品牌和机构合作。


  这家初创公司创建了一种地理位置 Cookie，当你下载某些应用程序（如游戏以及天气或某些媒体服务）时，会在不经意的情况下将其安装在智能手机上。


  收集的数据随后会被交叉引用和分析，以便 Vectaury 的客户（如家乐福等连锁店）根据人们访问过的地方，在其终端上投放定向广告。


  像 Vectaury 这样的初创公司直接与应用程序发行商谈判，将他们的 Cookie 作为服务包的一部分集成到应用程序中。


  用户会收到一条短信息，告知其存在用于广告精准投放或营销目的的 Cookie，并必须给予同意。


  对于 CNIL 而言，通过下载应用程序来接受 Cookie 的存在是不够的。因此，当用户下载包含 Vectaury Cookie 的应用程序时，应当被告知并允许对其地理位置数据进行持续跟踪（即使在应用程序关闭时），以用于广告目的。


  对于 CNIL 而言，这种同意“未被有效收集”；该指出，Vectaury 据此从 32,000 多个应用程序中收集了“超过 4200 万广告标识符和地理位置数据”。由于收集的数据揭示了人们的活动以及他们的生活方式，Vectaury
  有三个月根据 GDPR 实施同意请求并删除其不当收集的数据。否则，CNIL 可能会实施制裁。事实上，违反欧洲法律（GDPR）会导致重大的制裁风险：高达年度全球总营业额的
  4% 或 2000 万欧元的罚款。


  遵守公司规章和规则是股东、评级机构、董事、审计师以及所有利益相关者（客户、供应商、员工等）信任的基础。


  ### 4.1.3. Optical Center


  2017 年 7 月，CNIL 收到有关 Optical Center 公司的“重大数据泄露”报告。


  通过在浏览器地址栏输入多个 URL，可以访问该公司客户的数百份发票。这些发票包含了姓、名、邮寄地址和健康数据（眼科矫正），或在某些情况下涉及人员的社会安全号码。


  [www.optical-center.fr](http://www.optical-center.fr) 网站存在安全漏洞，这在 2015 年就已经被报告过。该网站在显示发票之前，缺乏验证客户是否正确连接到其个人空间（“客户空间”）的功能。


  CNIL 处以了 250,000 欧元的罚款，并决定公开该决定。


  ### 4.1.4. Dailymotion


  2016 年 12 月，一篇新闻报道了与 Dailymotion 有的重大数据泄露，该漏洞允许他们访问 8250 万个凭据。


  攻击者利用了 Dailymotion 在 `GitHub` 上的代码漏洞。这使得执法机构（联邦或地方，包括市政）能够获取个人的个人数据。CNIL 处以了 50,000
  欧元的罚款，理由是该公司未能履行其保护个人数据的义务。该公司本不应以明文形式在 `GitHub` 上或通过 `VPN` 存储标识符。


  ## 4.2. 不同的国际监管条例（数据保护）


  在全球范围内，数据保护（在某些国家有时被称为数据机密性）正在发展。法律文本通常受到欧盟的影响，欧盟被认为是数据保护的基准。


  全球有 100 多国家拥有数据保护立法，包括欧盟的 28 个成员国。


  虽然美国（加利福尼亚州除外）拒绝保护用户并允许互联网服务提供商向营销机构出售订阅者的个人数据（浏览历史、地理位置、使用应用程序的时间等），但其他国家包括中国正在采取欧洲的领先做法。


  与欧洲法律不同，美国的监管按行业部门或个人类别进行组织。


  ### 4.2.1. 美国


  与欧洲法律不同，美国的监管按行业部门或个人类别进行组织：金融服务、医疗部门、信贷机构、保险有特定的法规，例如 `Fair and Accurate Credit
  Transactions Act`（公平准确信用交易法）和 `Health Insurance Portability and Accountability`（健康保险可携带性与责任法，注：原文此处中断，但我将这些术语视为实体，尽管它们指的是
  `FCRA` 和 `HIPAA`）。


  对于个人，有一项法规专门涉及儿童：`Children’s Online Privacy Protection`（儿童在线隐私保护法）限制了从 13 岁以下儿童收集的信息。


  ，`Clarifying Lawful Overseas Use of Data Act (CLOUD Act)` 是美国 2018 年 3 月 23 日通过的联邦法，关于监控个人数据（包括云端）。它允许执法机构（联邦或地方，包括市政）在不通知个人、其居住国或数据存储国的情况下获取个人的个人数据。


  `CLOUD Act` 使得获取存储在美国服务器（包括海外服务器）上的任何电子邮件或其他数字数据合法。主要的本地云服务商及其子公司必须遵守该法律。


  如果公司想配备一套高安全的解决方案来管理其数据，因此选择云服务提供商至关重要。


  ### 4.2.2. 中国


  中国首部关于网络安全和个人数据保护的主要法律于 2012 年引入。


  2016 年通过的法律禁止“未经被收集信息人员同意”出售服务用户的个人数据，公司像欧洲一样，只能收集与其提供的服务所需的数据。


  与美国相似且与欧洲及许多国家不同，中国对数据保护采取部门方法。许多规定涉及系统安全、系统控制和跨境传输。在数据保护方面，法规适用于网络运营商。




  中国对互联网的限制也非常严格。事实上，互联网服务提供商受政府控制，政府已立法能够屏蔽某些网站的内容，并监控中国境内居民和外籍人士的互联网访问。百度、腾讯和阿里巴巴作为全球该领域最大的公司之一，受益于在中国市场上封锁国际竞争对手（尤其是美国公司）的益。中国于
  2019 年封锁了对维基百科的访问。


  ### 4.2.3. 亚洲

  在韩国和日本，以及其他亚洲国家、香港、台湾、菲律宾或新加坡，进展也非常非常快，且向欧洲法律的方向迈进，尽管个人数据的概念略有不同。印度也受到了欧洲法律的启发。


  ### 4.2.4. 欧洲

  在欧洲，新的《通用数据保护条例》（`GDPR`，下文将进行详细描述）已于 2018 年 5 月 25 日在整个欧盟（EU）范围内生效。在某些情况下，它也适用于位于欧盟以外的公司。例如，瑞士公司如果处理居住在欧盟境内的个人个人数据，且处理活动与向这些个人提供商品或服务（无论是否付费）或监控这些个人的行为有关，则必须遵守
  `GDPR`。


  ## 4.3. 网络安全法规，NIS 指令

  欧洲 `NIS` 指令（网络和信息系统安全）旨在通过建立国家、监控中心和“数字消防队”之间的合作，显著增强数字欧洲的韧性。


  与物理安全一样，如果投资者、公司和个人无法信任基础设施、管理部门、服务和产品，他们如何被吸引到欧洲呢？


  数字信任是经济的主要资产。


  `NIS 指令`涉及所有参与者，特别是“关键服务运营者”，例如能源、交通、银行、金融市场基础设施、医疗、饮用水供应和分配部门的某些参与者，以及“数字服务提供商”。


  因此，关键服务运营者以及在线市场平台、搜索引擎和云服务将面临新的安全和事件报告要求。主要目标是确保整个欧盟范围内网络和信息系统具有高水平的安全。


  `NIS 网络安全指令`要求大量私营公司遵守新的安全和事件通知。它还规定，“关键基础设施运营者”（即公用事业、交通和金融服务公司）必须采取适当措施管理安全风险，并向国家机构或应急
  IT 团队报告严重事件。


  ## 4.4. 行业法规

  ### 4.4.1. 银行业业

  除了 2016 年发布的 `NIS 指令` 外，G7 国家还建立了一份金融部门网络安全基础要素清单、关于评估网络安全的建议，以及与其他关键部门协调的建议。`CPMI-IOSCO`（支付和市场基础设施委员会与国际证券监管机构组织联合会）于
  2016 年 6 月发布了《金融市场基础设施的网络韧性》指南。


  2017 年 6 月 19 日，`ECB` 在法兰克福组织了一场关于网络韧性的高级别会议。在发言中，`ECB` 执行委员会成员本诺特·库雷（Benoît Coeuré）了与公共部门代表、关键服务提供者和金融市场基础设施代表举行此次会议的目标。


  他强调了攻击的不可避免性，以及绝对必要采取行动以确保整个系统的韧性，每个国家的系统都与其他系统相连。他宣布成立一个高级网络韧性论坛，特别是为了确保网络安全不仅是监管机构的问题，而且是为了：


  * – 更好地了解欧洲的威胁，特别是金融部门；

  * – 共享网络战略并解释 `ECB` 处理银行网络韧性问题的方法；

  * – 建立合作并营造信任环境。


  事实上，巴塞尔规则旨在加强银行的稳定性，但由于每个国家的系统都与其他相连，这种稳定性是至关重要的。不稳定的来源并非金融，而是技术性的：整个系统基于数字。网络韧性指南还建议危机演练、准备、持续改进和学习。


  除了压力测试外，2018 年 5 月 2 日，`ECB` 发布了一项测试金融系统 `TIBER-EU`（基于威胁情报的伦理红蓝对抗）韧性的框架。`TIBER-EU`
  测试模拟针对实体关键功能和底层系统的网络攻击：这些测试将帮助实体评估保护、检测和响应方面的能力。


  `ECB` 干预银行机构，无论是作为预防措施还是在事件发生后，并且最可能访问了 `BNP`，该公司在两个月内发生了两次大故障（2019 年初，系统瘫痪三天），原因是“简单的网络事件”。作为国家关键基础设施，银行对其可用性有严格要求，无论故障原因如何（硬件或软件故障、计算机攻击）。


  `ECB` 银行业监管对网络韧性给予高度重视，”萨宾·劳滕谢格（Sabine Lautläger）警告道。因此，欧洲监管机构对 IT 风险管理进行审计，对最佳实践进行现场检查，并建立了事件报告系统。


  ### 4.4.2. 医疗

  健康数据是特殊的个人数据，因为它们被认为是敏感数据。


  互联、交换和数据共享增加了安全风险：数据泄露或滥用、系统锁定、联网医疗设备被攻击等。


  某些医院的预约日程被黑客入侵，他们联系患者告知已取消，并提供了一个昂贵的电话进行重新预约。现在，扫描仪、磁共振设备或婴儿培养箱都是联网的，因此可能会被攻击。


  为了更好地了解攻击数量的增加，医疗机构要求通过健康事件报告门户报告所有攻击。团结健康部联合地区卫生署（ARS）和 ASIP Santé 建立了一个运营支持小组来帮助他们。


  该文中还提到了要通过认证机构对个人数据保护进行认证。


  医疗行业与银行业不同，并没有领先。然而，与其他行业一样，它极度依赖信息技术，无论是对于医疗干预、行政管理还是患者病历的存储。


  医疗机构信息系统是网络分子的理想目标。其影响可能是经济上的，也是运营上的：操作系统故障同样会危及生命。2017 年英国发生的攻击导致了多家医院影像部门和患者文件的完全瘫痪。





  问题非常严峻且日益复杂：随着门诊和居家医院的发展，各机构之间的联系日益紧密。


  为了确保整个健康部门符合 GDPR，适当工具（如匿名化和区块链）、定期的安全审计（物理和 IT）、医护人员培训、适当的流程，以及数据保护和系统安全的预算都是十分必要的。


  ## 4.5. 通用数据保护条例 (GDPR)


  《通用数据保护条例》(GDPR) 将欧盟国家现有的数据保护法规统一到单部法律下，引入了关于公司如何管理个人身份信息的指南。


  GDPR 有几个主要目标：


  * – 强化个人权利，特别是提高其数据使用情况的透明度，允许其同意或不同意将其数据数据，并建立个人数据可携带权；

  * – 明确处理个人数据的员工（数据控制者和分包商）的责任；

  * – 加强数据保护机构之间的合作，当数据处理操作跨国时，他们特别可以采取联合决策（特别是在制裁方面）。


  下文解释，GDPR 允许消费者了解其个人数据的使用情况，并同意或拒绝允许将其数据用于特定目的。


  公司必须确保已采取适当的安全解决方案、程序和政策，否则将面临因违规导致的巨额罚款，最高达 2000 万欧元，或对于公司而言上一年度全球总营业额的 4%（以较高者为准）。


  罚款金额取决于违规行为的性质、严重程度持续持续，并考虑到相关处理操作的范围或目的，以及影响的人数及其遭受的损害程度。控制者或处理者的责任程度也会被考虑内，以及已实施的确保公司合规的各种技术和组织措施。


  GDPR 引入了公司及其组织最高层经济活动者在数据治理、IT 风险管理和防止大规模数据泄露方面的责任概念。


  对于公司来说，这是一个合规性问题、一个财务问题（罚款、失去客户）以及一个数字信任问题（数据泄露会导致声誉损害）。


  ### 4.5.1. 基础


  基础如下：


  * – 强化个人权利：这要求收集并保留对个人数据处理的同意；

  * – 告知义务：要求遭受个人数据黑客攻击的机构必须在 72 小时内通知 `CNIL` 和信息被盗的数据主体；

  * – 严厉制裁：设立了威慑性的制裁，最高达 2000 万欧元或机构全球营业额的 4%。保留较高的一的金额；

  * – 数据收集最小化原则：要求仅收集对于处理目的所严格需要的信息；

  * – 数据可携带权：信息被收集的人员有权要求接收有关自己的个人数据；

  * – 数据登记：强制组织跟踪在组织内进行的所有个人数据处理操作。


  ### 4.5.2. 个人数据的定义


  需要区分不同类别的数据：


  * – 个人数据：姓、名、电子邮件、电话、匿名化名称、`IP address`、指纹；

  * – 财务数据：`GNI`、薪水、交易、消费模式、观点、政策或工会数据；

  * – 健康相关数据：医疗记录、病假、护理、体重、体育活动、饮食习惯等；

  * – 与计算机习惯相关的数据：互联网浏览、社交网络、兴趣、联系人、照片等；

  * – 上下文数据：地理位置定位、移动轨迹、`Wi-Fi` 连接。


  ### 4.5.3. 所谓的“敏感”数据


  敏感数据需要 GDPR 的增强措施（影响分析、增强信息、征得同意等）。这些信息包括：


  * – 揭示涉嫌的种族或民族起源；

  * – 涉及政治、哲学或宗教观点；

  * – 涉及工会成员身份；

  * – 健康或性取向；

  * – 遗传或生物识别；

  * – 关于犯罪或刑事判决的数据。


