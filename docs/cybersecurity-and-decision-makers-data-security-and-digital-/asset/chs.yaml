  # 前言


  与 `HEC Gouvernance` 举办圆桌会议以及与 `瑞士女性董事会`（`Cercle Suisse des Administratrices`）举办研讨会，是本书为决策者提供的起点：即公司、公共机构、基金会或协会的经理和董事。


  公司战略数据和信息系统的保护是董事、高管以及公司内部运营和职能部门（以及公司外部）决策者的责任。


