  ### 4.5.4. GDPR 原则


  #### 4.5.4.1. 透明性


  因此公司必须精确了解其对数据的用途，因为它必须通过重新调整（特别是通信方面）来保持透明化，并能够响应人们的权利请求。


  #### 4.5.4.2. 最小化


  公司必须确保数据收集不超出其设定用途的严格必要范围。因此，任何对处理无用且不合理的数据都不应被收集（如果已获取，则应删除）。


  #### 4.5.4.3. 数据安全


  必须通过技术和组织措施加强确保适当数据保护的手段。


  在设计新的处理操作时，必须强制将数据安全流程结构化。


  发生可能危害权利和自由的个人数据泄露，必须在 72 小时内向 `ICO` 通知此类违规行为。


  #### 4.5.4.4. 问责制


  公司必须证明其了解新法规的要求，并已：


  * 对员工进行了培训；

  * 启动了自愿合规流程；

  * 实施了数据处理特别是高风险处理的职责义务；

  * 制定了有期限的计划以实现完全合规。


  ### 4.5.5. 符合 GDPR 的五项行动


  通过以下措施符合 GDPR：


  * – 公司数据映射：了解收集了哪些数据，数据在哪里被处理和存储；

  * – 数据保护：限制授权用户访问合法任务；

  * – 访问控制，这是前一点的必要推论；

  * – 操作日志，以便证明诚信；

  * – 数据销毁：被销毁的数据是无法被盗的数据。


  ### 4.5.6. 处理登记簿


  作为合规的基石（起点、监控工具，甚至是某些方面的合规证明），客户和监管机构可能要求提供登记簿。


  登记簿需要回答的问题如下：


  * – 为什么：处理的什么？

  * – 谁：谁负责处理？

  * – 什么：涉及哪些数据以及涉及哪些人员？

  * – 哪里：数据托管何处？

  * – 多久：数据存储多久？

  * – 如何：数据如何存储，以及有哪些安全措施？


  ### 4.5.7. 需要执行的五项行动


  #### 4.5.7.1. 任命 DPO






  数据保护官（DPO）负责合规工作，是监管机构的联系点。对于员工人数达到 250 人及以上的的公司，这一职位是强制性的。该角色并不一定对应公司内部的一个新职位，它可以被委托给
  `IT` 或 `CIO` 经理、法务经理或公司外部的合格人员。


  `DPO` 的角色负责内部合规监控、提供数据保护义务建议以及处理与监管机构和数据主体之间的关系，其工作内容复杂且广泛。


  通过定期进行安全审计并提出建议，以确保整个组织符合法规和最佳实践，`DPO` 还负责确保员工知晓合规要求，并对数据处理人员进行培训，使其意识到这些要求。


  ### 4.5.7.2. 合规计划


  该行动计划对应公司内部数据治理的实施：


  - – 组织：谁负责数据的收集、处理、访问管理以及保护与安全？

  - – 文档记录：如何记录处理操作的目的和操作内容？

  - – 流程对齐：公司内部有哪些流程？

  - – 培训/沟通：谁负责培训？培训计划是什么？何时进行培训？


  该行动计划必须与公司的各部门共同制定（团队将取决于公司的规模和业务类型）：`DPO`、人力资源部门、销售营销部门、`IT` 经理以及 `IT` 安全经理。


  仅仅了解 `GDPR` 是不够的，理解公司的环境、活动、运营所需的数据，以及法律限制、公司的 `IT` 系统和程序至关重要。


  能够进行内部和外部沟通，并能够定义和实施与例如被遗忘权或数据可携带性权相关的程序也同样重要。


  遵守 `GDPR` 需要公司所有职能部门的：`IT`、营销、人力资源以及公司的大多数其他部门。


  ### 4.5.7.3. 生成/更新个人数据处理


  公司、`DPO` 及其各个职能/操作必须验证并告知他们收集用户数据的目的、数据的性质（个人、敏感等）以及保留期限。


  收集日益数字化，并以数字方式存储。也可以通过电话进行然后以数字方式存储。


  一旦数据完成映射，必须识别其存储位置、介质以及涉及的分包商。


  ### 4.5.7.4. 更新网站/文档


  网站和应用程序必须更新新的法律声明，并对同意情况进行明确管理，同时提醒处理操作的目的，更不用说反对和取消的选项。


  ### 4.5.7.5. 致受影响的分包商和合作伙伴信


  公司必须关注与其合作的软件发行商、数据托管商和 `IT` 服务提供商，并确保按照法律采取措施。


  `DPO` 角色的复杂性之一（除遵守 `GDPR` 之外）在于评估公司对其承诺的履行情况。


  事实上，要求客户同意（或不同意）公司或第三方出于明确目的收集、存储和使用其个人数据是一回事，而检查公司是否尊重了客户的意愿则是另一层事。


  例如：


  - – 如果客户拒绝，`DPO` 是否能确保公司不收集和存储其数据？

  - – 如果客户拒绝第三方 cookie，`DPO` 能否确保第三方无法访问连接公司网站的客户个人信息？

  - – 如果子公司或供应商（如快递公司）收集了客户信息，在客户获得服务和交付后，这些信息将如何何处？对这些信息的访问是否安全？与供应商的合同是否允许公司审计其供应商、合作伙伴或不受控子公司（如果是合资企业）的系统和程序质量？


  此外，要求网站或应用程序发行商遵守 `GDPR` 是一回事，验证第三方（如广告代理）是否充分告知客户的同意或拒绝并尊重这一反馈则是另一回事。


  ### 4.5.8. Cookies


  `Cookies` 允许您识别是哪台电脑、平板电脑或智能手机正在查看互联网上的内容。网站访问者的轨迹，特别是当与服务器接收的其他信息相结合时，可用于创建画像并识别他们。


  网页浏览数据随后可用于创建高性能的定向和/或个性化广告，并根据他们的兴趣领域建立消费者或专业人士的画像，以便为他们提供几乎“量身定制”的画像化商业报价。


  根据 `GDPR`，并不禁止画像处理；但必须对被画像的人员进行事先告知，并特别说明反对权（`GDPR` 第 21.2 条）。互联网用户必须被明确告知，并有机会拒绝使用其数据。


  某些“技术性” `cookies` 有助于改进网站的导航。另一些则允许网站发行商识别用户并向其发送广告。广告商有时也会在网站放置 `cookies`。因此，公司监控在有或无公司同意的情况下位于网站与访问者之间的第三方（广告板和广告商）的活动至关重要，通过合同形式化与网站发行商的关系，并在这些合同中包含网站发行商与广告商之间的授权链接。


  这些访问者的意见是否得到尊重？公司对客户的承诺是否得到尊重？开发工具（`cookie 跟踪器`）用于管理客户协议以及第三方活动，以验证其是否获得公司和客户的授权，以及合同关系是否适配并得到尊重。


  ## 4.6. 对公司和董事会的影响


  董事和高管人员了解消费趋势和购买标准至关重要。事实上，根据 `Internet Society` 和 `Consumers International` 2019
  年 3 月进行的调查，在法国、英国、美国、加拿大和澳大利亚的 6381 名访问者中，面对家中日益增多的这些潜在“间谍”，消费者对他们的隐私和个人数据表示担忧。88%
  的受访成人希望政府建立一个专门针对联网设备安全和隐私的`法律框架`。






  此外，除了商业问题外，必须制定一套合规行动计划：组织架构、文档记录、处理操作对齐、培训/沟通、负责人姓名、授权日期。该行动计划将根据公司本身及其与首席信息官（CIO）、业务部门、人力资源和客户管理的互动来定义。


  特别是，有必要：


  * – 产生/更新个人数据处理情况：目的、用户、责任人、性质、保留期限；

  * – 绘制数据地图，识别存储位置、介质以及涉及的分包商；

  * – 使用新的法律公告更新网站和文件，并对同意书进行明确管理，同时提醒处理操作的目的，更不用说反对选项；

  * – 涉及影响的分包商和合作伙伴：软件发行商、数据托管商、IT 服务提供商。


  在刑事诉讼中，如果证明管理人员存在疏忽或个人过错，他们可能需要承担责任。涉及的罪名包括侵犯隐私、不符合形式要求（请求同意）、未经授权的情况下处理敏感数据、未向
  IT 服务提供商通报安全漏洞、通过欺诈手段收集个人数据以及未经同意的情况下保留敏感数据。


  # 5. 董事会的最佳实践


  需要提供的回答是多方面的：个人和集体的、教育性的、技术性的、法律和监管的。


  必须避免许多陷阱：


  * – 你们有首席信息安全官（CISO），一切都正常；

  * – 网络安全是一个 IT 问题；

  * – 工具（防病毒软件、防火墙、SOC 和 CERT）已经到位；

  * – 公司太小，不会受到攻击；

  * – BYOD（自带设备办公）政策是“安全”的；

  * – 威胁只来自外部；

  * – 公司是 100% 安全的，不需要审计或测试；

  * – 我们的数据在云端，一切都正常；

  * – 我们的数据没有价值；

  * – 我们的服务提供商会负责；

  * – 工业基础设施不涉及其中；

  * – 我们没有什么好隐藏的。


  ## 5.1. 数字化技能


  尽管许多公司董事将网络安全视为运营问题，但如果由于网络安全问题、缺乏风险管理和内部控制导致公司的可持续性面临风险，董事会可能会被追究责任。


  “董事会的组成必须适应公司面临的挑战，”`APIA`（独立董事专业协会）表示，“因此，必须根据成员的技能和经验对董事会的成员性进行分析，特别是在面对数字挑战时”。


  这种数字化能力对于战略问题、网络风险评估，以及对执行管理层数字化技能、其改变内部组织的能力、客户关系、生产工具和公司文化的评估都是必要的（数字原生代渴望一个比权力一代更快、更透明、更具协作性的组织，这是掌权的一代无法忽视的）。


  董事并不需要成为数字化专家来行使职责，并通过数字视角理解战略和风险。他们对问题的理解、人脉网络以及与公司专家、内部或外部审计师和风险管理人员互动的能力，现在对所有公司和组织来说都是至关重要的。


  当董事会内部提出数字化技能这一问题时，答案往往发人深省：


  * – 董事不具备数字化技能；

  * – 这不属于董事会负责的主题；

  * – 这是一个运营问题；

  * – 我们没有时间处理这些问题；董事会的议程侧重于战略和财务表现。


  相对于数字问题，董事会的演变太慢了。法规和董事会中发现的新技能是实现其转型的主要因素。


  所有利益相关者、投资者、财务分析师和客户都欢迎在该领域任命一名胜任的董事。


  ## 5.2. 情境感知


  对状况的良好了解是董事会和执行管理层有效的第一步，无论是从内容还是速度。


  因此，有必要定义共享的信息、频率和手段。数字化工具使得减少董事会与执行管理层之间的信息不对称成为可能。事实上，董事可以通过媒体、`Google alerts`
  和社交网络实时访问有关公司、竞争对手、关键国家或供应商或主要客户的信息。


  此外，与执行管理层实时共享某些数据的可能性，应该促进董事与管理人员之间的交流，尽管有必要注意每个人的责任，以及董事会从日常生活中保持某种距离（危机情况除外）并关注长期发展方向的重要性。


  ### 5.2.1. 主要问题


  在 2018 年，美国证券交易委员会（`SEC`）向上市公司发布了关于网络安全披露的指导。随着网络事件越来越多地登上头条新闻，公司和监管机构意识到，网络事件不是一种转瞬即逝的趋势，而是我们新型且可持续的经济中固有的风险。`SEC`
  对董事会角色的观点在近年来发生了演变，并导致了 2018 年指导性文件的发布。公司董事现在被要求参与进来，因此必须对那些通常被呈现为黑暗且非常复杂、最好留给技术人员处理的领域要求更高的透明度。尽管这篇文件对要采取的行动描述并不具体（这些行动取决于每家公司），但可以识别出一些建议。


  #### 5.2.1.1. 从 CEO 开始！——自上而下的基调


  如果首席执行官不理解网络安全的重要性，董事将难以行使职责，并无法确保适当的基于风险的措施已到位并运行。风险往往被最小化，管理人员可能在损害发生后才意识到潜在影响。后果可能是即时的，有时是灾难性的。


  因此，董事会必须采取积极措施，确保首席执行官将网络安全准备成为组织的首要任务。没有 `CEO` 提供的领导和日常目标，任何网络安全计划都可能失败。董事会的行动或缺失也将受到审查。


  #### 5.2.1.2. 避免使用检查清单的方法


  负责公司网络安全计划的日常执行绝不是董事会的任务。但董事会必须参与其中，利用可用资源，理解并评估所采取措施的充分性，并要求主动且持续的可见性。


  在网络安全方面，与其他其他话题一样，“勾选”可能会产生虚假的安全感。董事面临的关键问题是：公司是否有网络安全计划？该计划是否有效？为了评估这些问题，董事成员必须透过表面，力求了解现有政策和程序是否真正适应了组织独特的需求。





  董事会必须确定公司的管理层是否认为网络安全不是一个主要由 IT 部门处理的问题。


  ### 5.2.1.3. 在董事会层面分配明确的监督职责


  根据 2018 年的指南，公司必须在披露中描述董事会如何管理其风险监督职能。与其他审计和风险问题一样，董事会从逻辑上可以将此监督工作分配给其现有的审计委员会或风险委员会。


  然而，在某些特别敏感的公司，建议任命一个新的董事会委员会，专门处理网络安全问题：网络保险、事件响应计划、业务连续性计划、内部威胁和“恶意退出”（指离开公司并构成威胁的人员，例如通过破坏技术系统）、第三方网络安全领域的尽职调查；针对勒索软件的预防与响应；IT
  人员招聘；网络安全培训；数据安全预算等。


  如果董事会没有网络安全专家，则应考虑聘请外部专家，就像由独立专家进行财务审计一样。


  ### 5.2.1.4. 要求评估、测试和报告


  每季度或每半年发布一次关于公司网络安全计划状态和状况、培训、人员配置、评估、测试结果或其他第三方对公司网络安全整体状况的独立报告是关重要的，这证明了董事会如何履行其在这一日益重要的领域监控风险的责任。


  董事会对网络安全审计的监督不仅应包括对风险和安全评估、渗透测试报告以及其他相关网络安全的深入审查，还应包括未来将实施的纠正工作或措施。


  同样，董事会还要求管理层参与实际演练，让组织分析可能的紧急情况。


  董事会必须仔细检查公司模拟演练的有效性、及时性、频率整体结果，更重要的是分析这些演练后采取的纠正措施。


  ### 5.2.1.5. 随时保持警惕


  仅有最新且有效的解决方案是不够的。它们必须被正确部署，并且并将整合员工意识和培训的计划纳入网络设备。所有员工必须保持警惕，并鼓励他们在发现问题时及时报告。响应速度至关重要，是恢复的关键。


  董事会应获取有关 IT 安全培训频率和有效性的信息：包括董事成员在内的培训人员名单、测试（欺诈邮件活动和测试结果）、数据访问策略和 IT 章程。


  ### 5.2.1.6. 了解并理解事件


  检测和响应网络事件的能力是关重要的，并对结果产生决定性影响。有效的计划可以使公司能够快速恢复，并使其免受声誉损害。


  另一方面，失败的计划可能会进一步加剧底层事件，使公司面临重大的法律风险和声誉损害。当发现严重的 IT 事件时，公司管理层必须立即通知董事会。这将表明董事会已充分参与，并认真对待其治理责任。


  `SEC Directives 2018` 强化了这种警报董事会的理念。`SEC` 主席杰·克莱顿（Jay Clayton）曾就 `SEC` 遭受的数据泄露向国会作证，他明确遗憾
  `SEC` 员工未分享有关数据泄露的一些关键信息。


  董事会必须理解任何影响公司、其竞争对手或其他利益相关者的网络安全历史事件。


  ### 5.2.1.7. 预判


  随着 2018 年指南的发布，`SEC` 呼吁公司董事会觉醒。网络安全风险已明显升至企业议程的首位，事实上，董事会现在必须对网络安全事件的规划和响应进行仔细且严谨的监督。


  鉴于目前与网络安全相关的集体诉讼形势，数据安全事件不仅产生监管责任，还可能产生管理者的个人责任。


  首要任务是监控这些风险，正如监控财务风险一样。


  ### 5.2.2. 保险


  如上所述，更新保险合同将使得检查保护系统的质量、安全策略和潜在漏洞成为可能。


  许多指南可以供公司参考，特别是中小企业（它们通常没有 IT 安全专家）或国际集团的子公司（它们并不总能处于母公司的关注范围内）。


  这些指南将使自评估成为可能，这是咨询经纪人或保险公司的必要前提，因为后者将拒绝为在网络安全方面未做到最低要求的公司提供保险。


  保险方法是有益的；它使得通过回答保险公司的问卷来对公司的安全性进行评估成为可能，有时还会有保险经纪人的支持。如果保险公司拒绝为您的合同增加网络扩展，请予以担心。


  `FFA`（`Fédération française de l’assurance`，法国保险协会）指南受政府和 `ANSSI` 推崇。它提供了许多实用的建议。


  ## 5.3. 内部治理


  ### 5.3.1. CISO（首席信息安全官）


  仅仅找到稀有的明珠——一位优秀的 `CISO` 是不够的。后者必须与业务和支持职能互动，并与执行委员会和董事会“对接”。


  他/她是执行委员会和董事会的联系人（有时通过审计和风险委员会），并向他们告知公司面临的风险、事件以及将实施的措施。


  `CISO` 充分了解项目并参与运营和职能部门（例如采购、并购）是至关重要的，以便在衡量措施的有效性后，能够提供全局视角，调整战略和行动计划。


  他或她依靠公司内部的 `CISO` 渠道（分机构、子公司），建立集团内部的安全政策，发布该政策并确保其与内部审计部门配合执行。`CISO` 拥有一份集团所有受控法律实体的联系人名单是重要的，以便传达安全政策、执行这些政策并在发生事件时获得信息。


  在合资企业或财团的情况下，在建立这些实体时，通过股东协议定义将适用哪些安全政策、谁能够审计其执行情况，以及由谁来任命 `CIO` 和 `CISO`。负责谈判股东协议的人员应意识到这些方面。


  有些公司已将网络安全总监整合进执行委员会，就像其他公司在董事会设立了数字委员会一样。





  其范围非常广泛，因为它涉及所有的信息系统：工业、管理、商业系统，以及站点保护和扩展企业保护，涵盖了集团开展活动的所有国家的供应商、分包商、服务提供商和子公司。企业（SMEs）未能逃脱数字化潮流，但并不总是拥有足够的资源来确保运营安全：这些公司中存在着“网络死亡”。


  网络安全经理是链条中至关重要的一环，但其有效性和性能取决于组织整体以及与公司主要的内部外部利益相关者的互动。


  他们的使命是多方面的，是开发和维护利益相关者（客户、供应商、员工、股东、伙伴等）对公司及其产品服务的数字信任目标的一部分：寻找信赖的伙伴，在资源和预算有限的情况下确保公司的弹性。在成本削减、自动化和优化的背景下，保护战略性和个人数据是网络安全经理面临的挑战。


  需要了解如何保护战略、财务和个人信息，以及如何从设计阶段介入（`Privacy & Security by Design`），为业务应用和服务的开发提供建议，使其能够开发数字化活动并创造价值，成为传统及新客户的信赖伙伴，为合规性做出贡献（特别是在
  `GDPR` 或 `NIS` 指令背景下），通过相对化各种风险来建立网络风险的综合：工业系统缺乏安全对公司产生的影响可能比非战略或非敏感数据的泄露严重得多。


  ### 5.3.2. CISO 与公司


  在网络安全领域，每个人承担自己的责任至关重要：董事会、经理、IT 部门、CISO，以及业务运营、职能、员工、扩展公司（供应商、分包商、IT 服务提供商），更不用说（基础设施、教育、调查、标准、认证和法规）。


  公司内部经理往往处于孤岛状态工作，而安全（无论是物理还是数字）是每个人的事务，需要 360 度的全景。


  业务部门必须参与风险映射以及待实施的解决方案、战略资产的识别以及安全标准的定义，以便在安全与敏捷、安全与效率之间找到正确的平衡。


  威胁演变迅速，这要求保持敏捷和响应。它们可能是强大且具有破坏性的。如果公司的主要参与者没有做好准备，如果他们没有理解并意识到网络威胁，他们将无法正确应对并避免影响。


  ![图 5.1. 根据 CISO 的说法，意识到网络安全但参与度不高的员工（来源：根据 CESIN）](img/image150_c2910.jpg)


  **图 5.1.** 根据 CISO 的说法，意识到网络安全但参与度不高的员工（来源：根据 CESIN）


  “我们都关关其中！你必须投资。雷电可能击中任何人。我们必须预测、预防并减轻影响，”Guillaume Poupard 经常强调这一点，特别是在 4 月 17 日在法国行政人员学院（IFA）座无虚席的会议室上。


  保护自己是可能的；这需要努力：你必须从理解开始。然后遵守一些主要原则，而且根据行业，内部治理必须考虑到公司，网络安全不是一门专业，而必须整合到所有项目中：


  - **人力资源问题**：人员管理、培训和专业知识开发。

  - **财务挑战**：网络安全预算分配、网络暴露风险评估以及保险覆盖。

  - **法律问题**：`GDPR` 合规、内部规章的起草以及与第三方合同的管理。

  - **业务挑战**：与业务线和职能部门的协调，以确保在不损害服务质量的情况下安全运营。


  各种参与者（`CIO`、`CISO`、`DPO`、风险经理）与业务线（工业现场、产品创新、销售、支持职能）、外部服务提供商之间的协调是一项困难，但这是董事会负责的必要工作。


  安全的组织和治理必须对所有人定义得精确且清晰：谁做什么？`CIO`、`RSI`、风险经理、内部审计和外部审计的角色和职责是什么？谁负责识别威胁（`threat
  intelligence`）、监控攻击、干预、定义安全库以及执行它？谁隶属于谁？监督机构的独立程度如何？


  建议将 `CISO` 安置在一个使他/她能够有效行动且确保其/她独立性的位置。对于这位安全主管，必须应用以下三个原则：


  - 明确的授权。

  - 贴近执行委员会。

  - 行动自由（因此也有预算自由）。


  不建议 `CISO` 依赖于 `IT 总监`，后者的目标是让信息系统易于使用、快速且高效。相反，安全措施往往会减慢对工作站（密码、双重认证）、应用程序（密码、更新）和计算机处理的访问。


  内部组织必须是全球性的，不能忽略有时被遗忘的公司部分。内部组织的警惕点特别包括：


  - **信息系统**：网络保护架构（隔离不同的信息系统、隔离公司与工业网络、使用检查和入侵检测工具）、服务器位置、敏感数据的备份。

  - **工厂**：硬件和软件、带有身份验证和授权以及加密的数据访问、物理与数字安全的协调、更新、USB 盘、增强现实工具。

  - **管理员和用户**：工具和访问权限规则（密码、移动性、如何通信、数据归档——多久、在哪里、分类？——备份）、经过认证的 `NCSC`（国家网络安全中心）或
  `NCCIC`（国家网络安全与通信集成中心）服务提供商。






  请注意，首席信息安全官（CISO）面临着巨大的压力，在发生成功攻击时，他们往往被视为责任人。面对他们所面临的威胁爆炸式增长、由于员工 IT 卫生习惯差而需要在内部管理的网络风险，以及
  `GDPR` 的紧箍之咒，这种压力是非常巨大的。


  事实上，正如赛门信（Symantec）与伦敦大学及咨询公司 Thread 针对欧洲范围内开展的一项研究所示，欧洲 82% 的安全经理正处于崩溃边缘，法国的这一比例略高（85%），高于其他地区（英国和德国为
  81%）。有 8% 的人计划辞职，而德国的这一比例为 64%，英国为 60%。


  大量需要处理的告警、保护海量入出数据的义务，以及需要保护的领域过广，加上资源匮乏，是导致这种不安的主要原因。由于决策者参与不足，CISO 必须自己评估风险、提出解决方案并做出决策。CISO
  是业务合作伙伴，而不是决策者。


  ### 5.3.3. 明确职责


  遭受攻击的公司经常会在执行委员会和董事会层面提出网络安全问题：事件、设备、风险和危机管理。


  这证明了这一新挑战处于领导者层面，而不仅仅是安全经理。很多时候，责任落在后者身上，由他们负责估计风险、提出解决方案、选择并实施方案。这对于一个人来说任务太重了；公司正处于危险之中。描述了这种普遍情况的这位
  CISO，其所属公司在 2019 年第一季度也遇到了严重问题。


  ![图 5.2. 大多数公司在云端存储至少部分数据……其中大多数存储在公云中 ¶（来源：参考 CESIN）](img/image154_c2911.jpg)


  **图 5.2.** 大多数公司在云端存储至少部分数据……其中大多数存储在公云中 ¶（来源：参考 CESIN）


  网络安全是决策者的议题。我们必须能够进行权衡。我们必须在执行委员会中讨论它，并用易于理解的方式进行讨论。需要的是与法律、商业、技术和财务官员共同做出知情决策。网络安全占整体
  IT 预算的 5–10%，包含所有费用。它和其他任何其他风险一样，风险必须整合到风险映射中，且风险分析必须更新。开发了 `Ebios Risk Manager`
  方法是为了从网络安全视角来评估风险。


  执行委员会的一名成员必须负责安全事务，并作为网络安全经理的联系人。后者不能依赖于 IT 或数字化总监，后者被要求保持敏捷、创新和高效。安全往往是一种约束：它会减慢速度并增加成本。


  数字化转型与安全之间的融合至关重要。它们必须共同前进。这就是为什么从一开始就讨论这两个主题是非常重要的，并且要避免“过去更好”的诱惑。


  云对 CISO 来说*确实*是复杂的，但必须以安全的方式来处理，以分析云合作伙伴的服务。


  对云端外包数据和服务的识别不能外包。这就像战略一样。


  ### 5.3.4. 精简供应商组合


  2018 年，54% 的 IT 安全经理与 10 家或更少的解决方案供应商合作。现在这个数字是 63%。


  根据美国网络设备制造商 `Cisco` 及其 2019 年关于 CISO 活动的报告¹，趋势将是简化 IT 安全系统，因为它们过于复杂且多样化，无法实现有效和高效。


  该调查针对 18 个国家（包括法国）的 3,259 名 CISO 和 CIO 进行。79% 的受访者仍然认为协调来自多个供应商的告警非常困难，如果不是非常复杂的话。这是导致他们感到不安的主要原因。CISO
  必须评估风险、提出解决方案并做出决策，由于决策者缺乏参与。CISO 是业务合作伙伴，而不是决策者。






  加强云端数据安全的主要措施包括：


  - 在迁移数据之前对数据进行识别和分类；

  - 云服务提供商的挑选；

  - 数据加密；

  - 对围绕这些数据的用户活动进行监控；

  - 强化安全规则；

  - 员工培训；

  - 数据分类必须由决策者共同完成，不能仅是 `CIO` 或 `CISO` 人的责任。企业必须理解相关问题、数据风险和替代解决方案。


  ## 5.3.5.2. 自带设备 (BYOD) 策略


  远程办公、协同办公以及新型 BYOD 类型用途的出现正迫使公司开发新的工作方式和工具，从而调整其安全系统。


  必须部署新的保护解决方案，并让员工意识到良好的做法，同时对新工具进行培训。


  这对公司来说是一项真正的挑战。实施限制措施至关重要：防止访问某些网站，禁止将业务文档传输到个人邮箱，并确保公司应用程序和信息系统的外部访问安全。同时，如果规则过于繁琐复杂，员工会抱怨限制过多。因此，有必要保持灵活性，并在情况下培训用户，使他们知道例如如何识别恶意邮件、识别存在风险的网站以及避免连接不安全的
  Wi-Fi 网络。


  在极端情况下，某些公司可以从军事部门的公司获得灵感，这些公司的计算机和工业现场未连接互联网。


  ## 5.3.6. 人


  ![图 5.4. 在 CISO 看来，人为干预仍然是必要的（来源：根据 CESIN）。此图的彩色版本请参见 www.iste.co.uk/defreminville/cybersecurity.zip](img/image159_c2913.jpg)


  **图 5.4.** 在 CISO 看来，人为干预仍然是必要的（来源：根据 CESIN）。此图的彩色版本请参见 `www.iste.co.uk/defreminville/cybersecurity.zip`


  强纽带是人，而人也可能是弱环节：所有人都必须从上到下、从下到上接受培训。因此，有必要启动年度培训活动，且必须具有教育意义：解释威胁和限制，要求遵守规则（必要时严厉打击），并涉及全公司。


  所有团队的投入是减少内部威胁的最佳方法。对于组织复杂的大型公司来说，这是一项真正的挑战，其中 75% 的员工没有意识到这一战略。意义的丧失和缺乏投入会直接影响每个人保护公司的警惕性。


  正如多次提到的，组织、角色职责和授权的明确、网络安全专家、专业领域与职能之间的协作、在工业或商业数字化转型项目或并购运营中与网络安全专家的合作，以及决策过程，对于公司的成功及其可持续表现至关重要。


  所有大型公司都需要在所有部门、站点和子公司部署网络安全计划。


  在小型企业中，组织没有那么复杂。尽管如此，培训、安全文化、战略资产识别、与 IT 服务提供商结合考虑安全规则、管理者的风险映射以及对流程重要性的认识至关重要。这是时间的投入而非工具的投入。使用信誉良好的服务商至关重要。附录
  2 中提供了良好实践列表。


  ## 5.4. 数据保护


  数据治理从每个业务部门识别关键资产并对信息的机密程度进行分类开始。没有必要对所有信息进行同等对待。


  共享共享对于提高效率：不需要每个部门都将另一个部门的信息输入到自己的数据库中。那是既耗时又昂贵且易错的浪费。两个信息源可能会提供不同的信息。


  大型公司中常见的现象是因为权力（信息就是力量）、更新频率（一个职能对另一个职能的要求不同）、范围、机密性、所需的质量水平或组织原因（更新数据库的人员可用性）？


  数字化转型需要共同的愿景、资源、流程实施和变更管理，以便提高效率和可靠性。


  在流程方面，必须指定负责人、赋予读取或写入权限、管理这些访问的更新、保护访问、维护数据、确保数据完整性（例如记录更改）、防止数据被篡改或破坏、确保其一致性、可靠性和相关性、管理和监控日志及流量（控制访问、跟踪活动、管理数据违规、减少漏洞、必要时进行匿名化处理等）。


  ![图 5.5. 为了保护存储在公云中的数据，CISO 不仅使用服务提供商提供的工具 ¶（来源：根据 CESIN）](img/image161_c2914.jpg)


  **图 5.5.** 为了保护存储在公云中的数据，`CISO` 不仅使用服务提供商提供的工具 ¶（来源：根据 CESIN）


  ### 5.4.1. 电子邮件


  邮件从未完全保密，一直以来需要采取预防措施以确保信件、信息或合同只有少数人知道（仅限发送者和收件人，仅限合同的两个签署人）。电子邮件也是如此，但意识到这一点的人比例是多少？


  如何控制公司内部的信息流？如何确保今天写给客户或供应商的邮件在发生纠纷时不会损害公司？如何限制法律和财务影响？如何确保遵守现行的授权规定，根据个人在公司中的职位、劳动合同和雇主法律实体来定义每个人的权限和责任？


  今天，谁对某个项目了解什么？信息流是否已知并管理？是否有任何规则和授权？通常在发生纠纷、审计或司法调查时，我们才会意识到一个项目中交换的邮件数量。


  有些人很好了这一点；他们从不写，从不回：他们确信自己不会被发现。但他们如何履行职责呢？然而，并不是所有事情都有风险。在知道邮件和附件可能被阅读并担心谁可能滥用它们的情况下进行写作，是其使用的基本规则。


  与某些加密通信的安全消息（但注意，WhatsApp 消息曾被认为是安全的，但似乎并非如此）不同，电子邮件是不安全的。


  因此，我们必须找到工具——工具是存在的——并将其实施。为此目的推荐了一些解决方案²](#c05.xhtml#pg140fne0c1)：


  - `ProtonMail`：位于瑞士，`ProtonMail` 是一种设计精美的开源网页邮箱，提供不同级别的加密。在 `ProtonMail` 用户之间，消息会自动端到端加密（内容和附件）。还可以向其他消息系统的用户发送端到端加密消息；


  - `Tutanota`：位于德国，`Tutanota` 是类似于 `ProtonMail` 的开源网页邮箱。设计非常稳重且优雅。在 `Tutanota` 用户之间，消息会自动从头到尾加密。提供强身份验证。






  *   Mailfence 位于比利时，是一家专有的网页邮箱服务。它的设计不如前两个服务美观，但非常有效。消息可以使用 `OpenPGP` 或对称加密进行端到端加密。它还提供强力身份验证。


  ### 5.4.2 工具


  对于“旧”系统，或者对于微软发布的常用工具（例如 `Active Directory`），操作并非总是那么易如。ANSSI 在 2014 年的技术笔记中指出：“需要注意的是，`Active
  Directory` 包含用户机密，例如他们的身份信息。事实上，对于恶意攻击者来说这是一个特权目标”。


  `Active Directory` 是微软为 Windows 操作系统实现的目录服务。`Active Directory` 的主要目标是为使用 Windows
  系统的计算机网络提供中心化的身份识别和认证服务。它还允许管理员进行策略分配和执行，以及安装关键更新。


  如果攻击者拥有域管理员权限，他们就可以随心所欲执行所有所需的操作，例如数据提取或破坏行为。因此，一个具有特权的账户被攻破可能会导致信息系统完全控制权的丢失。


  该目录的复杂性使得恶意个人可以以各种或或微妙、且对某些人来说难以检测的方式隐藏在其中。


  这种个人随后能够在信息系统的多个服务和应用程序中留有后门。这导致了持续性复杂攻击的巨大风险。


  以这种方式被攻破的信息系统有时无法清理，必须完全重建，这需要消耗大量的资金和人力资源。


  因此，控制和保护你的 `Active Directory` 至关重要。主要的保护工具必须根据数据的价值和信息系统的关键性进行调整。


  保护工具（防病毒软件和防火墙）是基础，必须每天自动更新，此外还有“异常”行为检测工具，它们会分析工作站或服务器上的下载行为和可疑操作，更不用说监控输入输出以检测恶意入侵的过滤工具了。


  不存在 100% 安全的系统，因此你必须那些试图闯入的人，并尽可能地发现他们：在白天发现比在五年后发现要好得多：后果是不相同的。


  这种监控可以外包和共享。识别、保护、检测、响应和恢复的工具类型列在附录 3 中。


  ### 5.4.3 双重身份验证：更好，但并非 100% 可靠


  建议使用双重身份验证。这种技术被银行使用，现在已涉及越来越多的敏感公司：双重身份验证是指在你尝试连接其中一个在线账户或你的工作站时，通过短信或应用程序向你的手机发送代码。这种技术提供了一层额外的保护，在原则上非常可靠：谁还能拥有你的手机并复制你收到的代码呢？


  遗憾的是，如果恶意人员发现了运营商寄送你的 SIM 卡的邮件，或者通过盗用你的身份获取了 SIM 卡的副本，你收到的短信将将显示在你黑客的手机上。虽然他们需要找到隐藏在你联系人中的（很糟糕地隐藏）用户名和密码，但有时这并不困难，因为大多数用户为了方便访问应用程序，使用一个唯一的密码。


  ## 5.5 选择你的服务提供商


  责任不能委托给外部服务提供商；一旦发生 IT 事件，公司及其企业管理人员仍需承担责任。安全机构已根据能力和信任的标准制定了资质要求（产品和服务），这两者都是必不可少的。


  IT 通常由外部人员部分或全部管理，这些人员拥有过多的访问权限来管理大公司的系统。


  攻击者的目标是那些触达客户的提供商。因此，很难区分授权的连接和未经授权的连接。因此，网络安全必须包含在提供商的合同中。


  ## 5.6 预算


  它通常代表信息系统部门预算的 5% 到 10%，但根据公司的活动而异：对于国防企业、OIV、知识产权重要且拥有大量个人数据的公司，其数字化程度和历史，预算会更高。


  预算包括四个主要项目：网络防御（保护、检测、响应）、技术手段维护、流程演进以及信息、意识和培训活动。


  特别是在大型公司，合理化网络安全工具和服务供应商的数量（例如选择互操作的工具），使得优化投资和服务预算成为可能，从而将精力放在技术观察、监控和人工智能上。网络安全不应仅被视为成本；它应该被视为业务的杠杆、竞争力和性能的工具，以及组织健康的晴雨表。与任何投资一样，高管和管理员能够跟踪与数字化转型、IT
  安全和数据保护相关的费用。可以设立一个限期的特定技能投资或创新委员会，用于建立技术观察、监督初创实验室或加速器、管理数字项目、成本、风险及其绩效。该委员会可能还负责合规性、内部治理、风险和保险事务。


  ## 5.7 网络文化


  全连接、全参与、全负责：网络安全经理是公司关键的业务伙伴。网络安全是每个人的事务。监管机构和投资者特别关注公司如何依赖人才和文化来提高性能并确保其可持续性。


  新的英语治理规范建议董事会评估文化并监控其演变。同样，荷兰和日本也修订了他们的治理规范，并强调了文化的重要性：如何定义它、衡量它以及监控其演变。


  COSO 汇集了美国各种会计师和内部审计师协会，并提供企业风险管理指南，它承认企业文化在风险管理中的基础性作用。COSO 强调了董事会和管理层在确保公司价值观被定义以及这种文化传遍整个公司中的作用，特别是确保规则及其应用符合这种文化。以身作则是高德的；“听我说的，别照我所做的”是许多疏忽或恶意行为的门径，这对价值具有很大的破坏性。


  适用于文化的通用法则也适用于网络文化：董事会自身的组成、动态和文化必须反映企业文化及其战略目标。如果一个促进数字化转型、网络安全和创新的董事会没有获得适当的技能并任命一位能够领导这种转型、理解问题并控制风险的领导者，他们又如何？他们花费了足够的时间吗？薪酬方法是否随着这些新范式而演进？






  职业的分散以及对员工支持的缺乏，导致了网络安全实践与公司期望的网络文化之间存在着巨大的鸿沟。


  对于所有公司而言，对网络安全的文化认同至关重要，但在实践中，员工通常是防范钓鱼攻击的唯一屏障，他们却缺乏保护公司所需的必要文化。


  正如《数字企业信息系统治理审计指南》（`ISACA`）开展的调查所示，95% 的公司认为其当前的网络安全文化与理想文化之间存在差距。在实践中，员工没有得到充分的培训（如果根本没有培训），并且可能产生疏忽，这证实了网络安全中的人为因素仍然至关重要。


  然而，80% 的机构报告称他们对员工进行培训并传达行为准则以改进网络文化。但参考研究显示，后者仍然匮乏。虽然网络安全文化是“理想的”，但它受限于 41% 的员工认同度不足以及
  39% 的业务部门间存在差异。


  网络安全不仅是 `CIO` 和 `CISO` 的事务。`ISACA` 的调查显示，文化变革是 `CIO` 以及人力资源部门的责任。为了分担安全责任并缩小差距，安全文化必须具有包容性，这意味着建议让员工参与网络安全讨论，在新员工入职流程早期就为其定义安全协议，根据部门的风险状况定义安全需求，并组织模拟网络攻击演习。


  ## 5.8. 管理人员和董事的仪表板


  仪表板（Dashboard）是一种很好的做法。当然，它必须根据公司类型（其所属行业）、规模和接收者进行调整。它必须被视为一种工作工具、通信工具和决策工具。根据接收者的不同（董事会、执行委员会、业务部门、IT
  部门、`CISO`），其综合程度会有所不同。它将根据需求、优先级和对问题的理解不断演变。它将与执行委员会的每位成员共享。明确谁对提供的信息和采取的行动负责非常重要。


