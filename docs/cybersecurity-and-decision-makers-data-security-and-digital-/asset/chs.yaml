  ## 6.2. CERT 的定义


  `CERT`（计算机应急响应小组）是负责警报和响应网络攻击的能力中心。它汇总安全事件后的协助请求，处理警报，建立并维护漏洞数据库，发布降低风险的预防信息，并确保与网络能力中心、运营商、互联网提供商以及国家级
  `CERT` 的协调。


  `CERT` 的任务是持续改进：更好地了解状况以便预测和快速反应。


  ## 6.3. SOC 的定义


  `SOC`（安全运营中心）是一个监控系统，旨在确保对事件进行检测和分析，并定义安全事件的响应策略。


  其专家持续分析系统报告的事件并识别潜在的网络安全风险。其主要目标是对系统提供 24/7 监控。大型公司有时会有自己的 `SOC`，但这些服务通常是外包并共享的，使专家能够拥有跨公司的视角。


  ## 6.4. ENISA 的角色






  在危机发生之前，必须识别通信方式、联系人、关键工具和重要信息。唯一的解决方案是让自己处于这种情境中：想象明天早上，你的电子邮件系统将不再运行，你将无法访问联系人，你最先进的工厂将关闭，你将无法为客户提供服务（如银行服务），你的存储或交付提供商的信息系统将被勒索软件锁定，你客户的个人数据（护照、社会安全号码或信用卡号）将被盗取，而你正在处理的文件（法律和税务咨询公司）将在三周内无法访问。


  鉴于网络事件或攻击的潜在后果、其有时具有系统性特征，以及反应速度的紧迫性，为危机做准备至关重要。这种准备也有其益处：它让人们能够意识到、构建情景、识别风险并评估这些风险水平，然后制定在危机当天部署的行动计划，最后考虑为避免重大危机发生而采取的措施。


  因此，有必要识别内部和外部的关键职能关键人员，为这种危机管理做好准备，并能够建立危机当天（D-Day）的程序。谁负责什么？什么时候负责？谁应该被通知——是否应该通知董事会？根据危机的严重程度，谁来通知董事会？公司内部各级和外部的沟通策略是什么？


  每家公司将建立特定的危机情景，这些情景取决于其活动、基础设施和组织。


  在发生攻击或 IT 事件时，最重要的是确保业务连续性：重启系统和恢复数据。必须应用严格的程序和规则。


  ## 6.6. 危机管理


  ### 6.6.1. 准备


  关于危机准备工作，存在几个问题：


  - 危机何时开始？我们如何识别起点？我们如何进行快速诊断？

  - 员工是否在警报响起时知道该做什么？

  - 是否进行过任何演习？

  - 我们如何避免丢失历史记录，以便我们获得保险覆盖或承担责任？

  - 我们能够恢复最近的备份吗？

  - 我们是否有手段进行内部通信？例如，一个工具、一个消息系统和联系人？如果我们没有联系人的数字或纸质记录，我们将无法拨打任何电话。我们能背下多少个电话号码？越来越少。


  就像火灾或船上的落水演习一样，最有效的方法是模拟和重复。即使演习有时会让你微笑，且专注程度并非最佳，但这些模拟能让你意识到问题，与所有相关团队一起准备程序，并重复一些关键行动。


  大型公司，特别是关键运营者，会进行这些演习，其几个目标：


  - 想象情景，定义第一步；

  - 识别公司内部管理危机的关键人员（他们将 100% 有空）。必须记录他们的日程和电话号码。这些人必须有确定的备份人员，传递信息，根据影响类型、公司类型（规模、活动领域）通知合作伙伴（律师、服务提供商）、当局（国家网络安全中心
  [`NCSC]`、ICO）并做出决策。决策链必须短并围绕 `CIO` ；

  - 测试参与者管理技术问题（网络中断）和组织问题（向所有受攻击影响的服务商通报事件）的能力，并与团队进行总结；

  - 准备应急通信手段：安全消息传递；

  - 沟通：影响是什么？发生了哪些事件？泄露了哪些数据？沟通对象是员工、媒体和利益相关者。


  ### 6.6.2. 走出僵局状态


  我们知道网络危机可能发生，就像火灾可能发生，或者人可能从船上掉进海里。


  如果提前准备了行动，并尽可能严肃地模拟了危机，恐慌将得到控制，行动计划将按计划进行。


  危机永远不会与模拟的完全相同：发生的地点、首批涉及的人员、发生的时间。


  意识到这种危机可能发生，使得预判“响应”成为：防止危机蔓的首要措施、恢复活动、资产负债表（数据丢失、系统、设备损坏、财务损失）、调查和追责、内部和外部沟通。


  最重要的杠杆之一是信任。如果对所有可能的情况都做好准备，副作用将减少，反应能力将保持完好。


  ### 6.6.3. 确保业务连续性


  首要紧急任务是恢复公司生产、销售、支付和收款的能力。


  快速恢复系统并不总是可能的。在这种情况下，有必要建立以降级（或严重降级）模式工作的能力。


  Yves Bigot 的证言具有巨大的价值，他是同意就 2015 年 4 月攻击 `TV5 Monde` 作证言的企业领导人之一：以下证言来自 2017 年 `HEC
  Gouvernance` 组织的一场会议，以及此次攻击后媒体上发表的各种文章。


  所有屏幕都变黑。如果受攻击的机器没有立即断开，所有系统和库存都可能被毁。“公司可能会被完全摧毁，”该频道总经理 Yves Bigot 说。


  无法非常快地重启让 `TV5 Monde` 的广播者拥有中断广播合同的法律可能。因此，首要目标是交付内容，无论质量如何。


  `ANSSI` 在 `TV5 Monde` 留了六周，以了解攻击过程并帮助恢复服务。应该，`TV5 Monde` 的防护被 `ANSSI` 认为是“正确的”。“我们很幸运，”Yves
  Bigot 说，他承认了“心理上的未准备”。


  然而，根据其自身的承认，信息系统尚未实现 100% 安全。“我们仍在部署防护系统并定期对其进行加固。最初几个月对我们来说是糟糕的，因为这些新系统的安装产生了副作用”。


  在财务方面，这种安全性是有成本的：占 `TV5 Monde` 总预算的 4%。在 Yves Bigot 看来，这是一个合理的成本：“危险是真实的，但问题在于它是无形的。每个人都关注这个问题，但同时并不是每个人都准备好采取必要的措施来保护自己”。


  危机之后，团队们不得不在没有互联网的情况下工作了近六个月，工作方法发生了长期改变，特别是在信息、文件和电视制作交换方面，物理安全也得到了显著提高。


  ### 6.6.4. TV5 Monde 攻击故事


  2015 年被派往该电视频道救援的代理首次讲述了他们是如何应对这场前所未有的攻击的。






  # 2015 年 4 月 8 日，凌晨三点左右


  在 Mercure 大楼，即法国网络安全局（ANSSI）位于巴黎的极保密办公区内，电话响了。电话线端端是 TV5 Monde。这家法语电视电台的技术人员已经与一场前所未有的计算机攻击战斗了几个小时：其网站和社交网络账户正在播放圣战分子宣传内容，图像制作系统无法使用，广播被中断。这家向
  20 个国家、5000 万观众提供服务的电台，正显示着一片黑屏。


  黎明时分，会议举行了。圆桌旁坐着 TV5 Monde 团队、专门负责网络犯罪的国家警察部门、国内情报机构以及 ANSSI。该机构负责防御国家关键 IT 系统和最敏感的企业，理论上他们并不参与针对电视电台的攻击。但这次事件是前所未有的，且已经公开，并触及了世界上“法国之声”之一：当局决定紧急派遣
  ANSSI 的“计算机消防员”前往电台现场。


  这些干预对这些人员来说是常有的事，他们每年大约执行 20 次类似的行动。在正常时期，这些行动——在关键企业或基础国家系统中——都是在完全保密的情况下进行的。TV5
  Monde 是一个特例：损害是即时且高度可见的。这是 ANSSI 成员的工作首次如此大规模地为人所知。在该事件发生两年后，他们于 6 月 9 日在勒芒举行的信息与通信安全研讨会（SSTIC）上详细介绍了这次干预行动。这是
  ANSSI 首次在公众场合进行此类展示活动。


  这也是 ANSSI 首次公开给予自己一个分享经验的机会。


  ## 在前 48 小时内


  这群人数在 9 到 15 人之间的人员（被动员了数周）寻找寻找攻击者留下的最显眼的线索。就像在敌军离开后穿梭于街道上的拆弹专家一样，他们也担心“逻辑炸弹”的存在——即攻击者留下的代码行，这些代码设计用于在受感染系统重启时激活，旨在进一步瘫痪网络。这种恐惧最终并没有发生。


  从调查的最初几个小时开始，人员的注意力被 TV5 Monde 计算机网络上的一个英文账户吸引，该账户配置为法语，且拥有巨大的权限。问题是：它不属于 TV5 Monde
  的技术团队，而是属于黑客。调查人员成功重构了它的最后操作，并意识到它连接到了 TV5 Monde 网络之外互联网上的未知服务器。他们获取了 IP 地址，即该服务器在互联网上的标识符。这是试图理解谁是这次攻击背后巨大拼图的第一碎片。


  在调查过程中，ANSSI 收集了大量数据进行分析，包括黑客在网络上执行的所有操作进度。他们花了几周时间才详细理解攻击者是如何渗透 TV5 Monde 网络并摧毁路径上几乎所有东西的。


  ## 攻击过程


  进攻始于 1 月 23 日。攻击者从远处观察 TV5 Monde 的网络基础设施。他们发现可以通过虚拟专用网络（`VPN`）从外部连接到电台的内部网络。他们正是这样做的，使用了属于电台分包商的标识符和密码。他们是如何获得这些信息的？这是调查中少数几个未知数之一。事实是，攻击者已经渗透了他们正在仔细监控的
  TV5 Monde 网络。


  一旦进入内部，他们就赋予了自己全权的权限：这种追踪允许他们定位两个非常特定的服务器，这些服务器控制着电视机的摄像头。黑客使用这两个服务器中的一个连接到系统，该系统负责决定网络上的每台计算机允许做什么或不能做什么。圣杯：一旦进入内部，他们就能赋予自己全权的权限。


  ## 渗透与数据去标识名化


  然后，黑客开始四处窥探。他们沉浸在 TV5 Monde IT 部门的内部文档、消息传递和搜索中，寻找任何可以允许他们继续渗透的信息。他们输入的关键词非常精确：他们想知道网络是如何组织和配置的，具体来说是管理电台广播视频流的那个网络。从一开始，他们对这家法语电台的图像传输系统感兴趣。


  这次收获是成功的，黑客找回了大量信息，包括各种机器的 ID 和密码。在过去的几周里，黑客表现得非常谨慎。这段期间没有记录到任何活动。ANSSI 官员怀疑这段时间被用于分析、理解甚至翻译收集到的数据。这样做是为了更有针对性地回来，首先是检查已找回要素的有效性。攻击者检查了访问社交网络的密码是否有效。那时是
  4 月 6 日，即攻击本身发生前两天。


  4 月 8 日下午 3:40，黑客对 TV5 Monde 网络进行了最后检查。他们在显眼位置放置了标准的间谍软件。奇怪的是，后者从未被激活。根据 ANSSI 官员的说法，这种任何在网上的人都能轻松获取的恶意软件可能是被留着作为诱饵，以误导调查人员。


  ## 进攻的开始


  晚上 7:57，袭击者开始了他的“拆除工作”。他修改了复用器的参数——即管理和引导电台大负量视频流的计算机——导致它们无法重启。这种更改在这些设备被关闭之前是不可见的，而电台仍在继续传输。第一个可见的动作发生在晚上
  8:58，当时社交网络账户变成了一个神秘“网络哈里发国”的颜色，并展示了对“伊斯兰国”组织的支持。TV5 Monde 的视频流被中断，屏幕一片黑暗。


  晚上 9:48，另一次攻击发生。攻击者连接到 TV5 Monde 网络的几个关键部分并并毁了使其运行的软件。TV5 Monde 的视频流被中断，屏幕一片黑暗。


  在不幸中，TV5 Monde 也是幸运的：一个新频道刚刚上线，许多技术人员深夜仍在现场庆祝它的开通。他们立即做出了反应。他们的任务因黑客的新一轮攻击变得复杂，黑客在晚上
  10:40 关闭了公司的内部消息系统。此时，TV5 Monde 的团队已完全失去对网络的控制。午夜前不久，他们采取了停止攻击的唯一决定：将网络与世界完全隔离开。


  黑客失了手，但 ANSSI 成员在清晨抵达时，面对的是一片数字废墟。他们来帮助那些无助但有能力且非常配合的技术团队。这些以行事著称的 ANSSI 专家们从未面对过如此巨大的媒体压力。摄像机驻守在电台的门口。TV5
  Monde 的记者们的工作占据了头条，试图从他们那里获取信息，这损害了调查最初几个小时的极端敏感性。官员们不得不密封他们为此准备的危机室玻璃门，以防被看到，躲避走廊里的摄像机，并在摄像机冲进房间时躲到桌子下隐藏屏幕。





  ANSSI 代理和 TV5 Monde 团队正努力收回对网络的控制权。他们的任务在技术上也极其复杂。为了理解攻击者的手段，他们需要非常迅速熟悉音视频领域的特定设备。虽然攻击者有几周的时间，但
  ANSSI 代理面临的最后期限仅以小时计算。他们到达的那一刻，目标就设定了：我们必须尽快恢复广播，并为员工提供一个临时但安全的工作方案。最重要的是，要尽一切确保黑客不再踏足该频道的网络。压力是巨大的：没有进行卫星广播的每一分钟都会让该电视台损失数千欧元。


  第一批运行状况良好的电脑已为 TV5 Monde 的记者安装完毕。从那天晚上 8 点开始，TV5 Monde 再次开始广播，但仅播放录制内容。与此同时，清理工作开始了：受感染的机器被丢弃并更换新设备。代理们布置了一个小房间，让记者能够恢复工作：五台
  Mac，上面贴着明显的标签：“绝对且无条件禁止：勿连接任何设备”。


  在此阶段，ANSSI 代理仍然担心黑客会回来。随着时间的推移，工作站不断增加，很快就为记者们形成了新的新闻编辑室。几周以来，该公司的员工被这段经历创伤了：当 ANSSI
  取消了过旧且容易受到攻击的密码时，公司爆发了恐慌潮。随后这些密码变得无法使用，许多记者认为黑客回来了。


  ## 高风险等级


  在一个月的时间里，ANSSI 代理、TV5 Monde 团队及其分包商致力于绘制网络地图，并为切换到没有攻击痕迹的安全系统做准备。后者发生在 5 月 11 日，即攻击发生一个月后。从下午
  5 点到第二天凌晨 5 点，他们执行了这项极其微妙的操作，期间无法断开网络，因为 TV5 Monde 再次无法停止广播。专家甚至每四小时不得不中断一次技术操作，以避免干扰新闻节目的播放。


  这段动荡经历后的两年非常具有启发性。黑客利用了安全漏洞：TV5 Monde 将其大部分网络外包给了分包商，稀释了对网络的了解，而且一些基础良好实践没有得到遵守。ANSSI
  代理表示，这些缺陷在大多数法国大公司中都是相同的，而他们恰好非常了解这一点。


  对 TV5 Monde 的攻击也加剧了这些国家专家的担忧。“我们现代社会对信息技术重要性有了真正的认识，”一位 ANSSI 代理在 SSTIC 大会的舞台上解释道，“曾出现过几次警告，TV5
  Monde 就是其中之一。如今，没有攻击者真的想杀死法国的任何人，但请记住，总有一天这可能会造成巨大的伤害。”


  总计，这次攻击将使电视台在五年内损失约 2000 万欧元。谁是幕后黑手？如常一样，ANSSI 对这一极具政治色彩的问题没有给出建议，将其交给反恐检察官在攻击当晚启动的司法调查，以追溯到可能的领导者或资助者。


  尽管频道网站和社交网络上发布了声称，他们指向了黑客组织 `APT28`，该组织在 2015 年 6 月通过司法渠道获了《世界报》的消息。后者被怀疑是克里姆林在互联网上的武装力量。


  ## 6.6.5. 最初几个小时的管理


  ### 6.6.5.1. 应急措施


  最初几个小时应致力于应急措施：在突然断开观察到事件的设备之前，通知 IT 和 IT 安全专家；进行内部和外部沟通；通知当局（必要时通知 `ANSSI`、`ICO`）；出于责任和保险考虑保留证据。


  `CIO` 和 `CISO` 将做出决策阻止扩散并隔离受影响的部分，包括公司的关键系统和站点，并在必要时停止它们以确保这种隔离。


  事实上，停止活动一天以保护最关键的站点和活动，并重启可以恢复的部分会更好。


  应由预先指定的人员确保与公司经理和高管进行定期沟通，解释事件及其影响，提供恢复措施的信息以及初步时间表。参与系统保护和恢复团队的实际工作也必须得到组织。


  必须在危机之前建立联系人名单：不要忘记法律部门和律师、管理层、董事会（董事会是否指示了他们希望获知的严重程度？）、独立司法调查员、保险公司、外部审计师、危机沟通顾问（其应在危机发生前已确定；其介入费用会较低；他/她将了解公司、业务和主要风险），同时不要忘记投资者和客户。


  网络攻击发生后通常是一片沉默：一份简短的新闻稿，然后是漫长的沉默。


  `Hydro` 的案例（在 2019 年 3 月受到与 `Altran` 相同的恶意软件攻击）在此方面有所不同：Hydro 在攻击发生后立即广泛沟通，并向公众告知所采取的措施。一旦网站重启，Hydro
  定期向其客户、供应商和投资者告知成本（网站显示 2019 年第一季度的财务影响在 4000 万至 5000 万欧元之间）、进展和待解决的问题。特别是，Hydro
  要求他们在收到公司请求时要极其警惕，例如修改银行账户，并联系 Hydro 服务以核实此类请求的来源。


  正如 Frédéric Charles (`Green SI`) 告诉我们的：


  > 从 3 月 19 日到 4 月初，公司在其网站上发布了一个专门的页面，上面有新闻稿和定期更新。3 月 19 日还举行了新闻发布会，说明了事件对公司各项活动的影响状况，并告知能源生产未受影响。


  在恢复手动程序以继续处理正确订单方面也提供了透明度。业务连续性计划显然发挥了作用。


  4 月 2 日，当情况好多多时，公司甚至在 YouTube 上发布了一段视频，受影响的首批员工讲述了他们的经历。他们解释了是如何意识到发生了严重事情的，无论职业如何都为业务连续性做出贡献，以及他们如何度过夜晚和周末重启业务。


  这次攻击将导致至少 4000 万欧元的收入损失和重启信息系统所需的两周的额外 IT 服务成本，但在未来几个月内无疑还会出现其他成本。Hydro 宣布他们没有支付赎金，这本应是一笔额外成本。


  向 `AIG` 投的保单将涵盖这部分运营损失。股价在危机初期下跌后已回升至原有水平。





  - – 公司信息系统与生产系统之间的连接：应避免连接以防止感染扩散。因此，必须组织公司各部门与生产地之间的信息流（双向），以确保生产地不受影响；

  - – 所采取的措施：隔离恶意软件以防止其进一步扩散；

  - – 逐台恢复工作站备份的措施，因为勒索软件修改了每台受感染工作站的管理员权限。


  由于网络攻击，挪威水电集团（Norsk Hydro Group）董事会将第一季度业绩发布推迟至 6 月 5 日（原定 4 月 30 日），该攻击导致了一些行政流程的延迟，包括报告和账单系统。


  ### 6.6.5.2. 赎金的支付


  2019 年 5 月 8 日，“罗宾汉德”勒索软件锁定了美国巴尔蒂摩市的许多计算机系统。攻击背后的黑客要求支付赎金以换解密，但市当局拒绝了这一请求，他们不想向勒索妥协。两周后，行政服务仍处于阻塞状态：税收缴纳、电子邮件访问、许可证移交或财产分配。黑客已经控制了属于该城市的
  10,000 台计算机。


  根据专家意见，对于最复杂的系统，服务的恢复可能需要几周到几个月：“巴尔蒂摩市长表示我们的目标是恢复最重要的服务，同时确保最大的安全性，以防攻击再次发生”。


  如上文所述，不建议支付赎金。然而，除了防病毒软件、系统更新以及对不安全网站或应用程序的限制访问外，还建议对员工进行培训并在两个不同的地点组织每日自动备份，测试备份质量并保护恢复程序以防止其被病毒感染。


  ### 6.6.5.3. 中期管理


  一旦采取了应急措施，就到了调查阶段：对原因和责任进行调查、向保险公司报备、就事实进行反复的内部外部沟通，以及改进安全流程和设备以防止事件再次发生。


  ### 6.6.5.4. 长期管理


  纠正措施、诉讼管理、反馈以及安全与数据保护的改进以及通信管理将进入公司的议程，不应忽视：

  - – 主要教训是什么：我们是如何发现事件的？从外部？还是从内部？

  - – 我们是否有关于被盗取或被损坏内容的信息？

  - – 影响是什么？

  - – 是否有任何操作受到损害？

  - – 我们的危机管理计划是否按计划执行？

  - – 通知了谁？还应该通知谁？法律部门是否参与并做好了准备？

  - – 采取了哪些措施来确保攻击者不再访问数据？我们对黑客是谁了解多少吗？

  - – 攻击者利用了哪些漏洞？为什么？

  - – 可以采取哪些措施来避免发生同类型的第二次攻击？

  - – 可以采取哪些措施来减少此类事件的影响？


  ## 6.7 危机模拟


  最好的危机准备是通过危机模拟。它使得人们能够意识到攻击的影响，准备响应计划、应急措施并组建团队。


  与火灾或地震演习一样，一些敏感行业模拟了网络危机，以测试为应对危机而准备的程序。


  危机情景必须根据公司的业务领域、流程和地点进行调整，因此应受网络风险映射的启发，以尽可能真实且有效（索索金和无法访问数据、网站无法访问、消息无法发送、生产地停机、云服务商停止服务）。


  危机情景使得对危机的整体管理进行实验，或检查团队的成熟度，以便在不恐慌的情况下集体根据预先准备的程序做出反应：

  - – 应急管理（避免扩散）；

  - – 激活危机系统和团队；

  - – 应用程序；

  - – 危机沟通（媒体、客户、员工、当局等）；

  - – 连续性与业务恢复。


  对所有团队、基础设施和工具的模拟允许我们测试并改进流程和反应，以及在发生事件时实施的程序。事件永远不会完全相同，但反应将是相似的。


  # 结论：数字委员会


  只要互联网不受监管和治理，用户（个人和企业）将一直处于不安全状态。政府必须在保护人权与以安全之名（恐怖主义、恋童癖等）监控通信之间取得平衡。


  此外，新技术被用于国际冲突（商业或政治）以进行渗透和破坏。端到端加密技术使得拦截通信变得困难，从而难以渗透情报网络。


  因此，不存在所谓的零风险。尽管如此，董事会和执行层参与这一战略性课题是关重要的：如果在上游解决安全问题并做出明智决策，数字转型就能创造价值，这需要高管和董事具备明智地理解和引导战略的技能。


  一个基于财务审计委员会的数字委员会将是一个很好的做法。它可以对网络安全系统进行审计：与数字战略相关的组织、流程、工具和培训，正如审计委员会通过其独立视角支持管理层一样，通过确保财务信息的质量、风险映射和内部控制，以使公司成为一个更具竞争力和更高效的组织。这一治理机构将加强治理实践，从而增强利益相关者的数字信任。


  数字委员会将在独立专家（网络审计师）的协助下，确保：

  - – 网络安全系统的相关性；

  - – 风险管理和流程实施过程的可靠性：识别、保护、检测、响应、恢复；

  - – 威胁、技术发展和网络安全最佳实践的监控。


  该数字委员会将与 `CISO` 以及风险委员会或审计委员会挂钩，以确保风险映射考虑到网络威胁和漏洞，以及物理安全问题。


  在不久的将来，公司可能被迫对其安全安排进行审计，而且在一定规模以上必须任命审计师，这将使董事会及时获所遇到的困难。


  数字委员会可能会在特定操作中干预或让网络监听参与：

  - – 审查合并/收购/处置交易；

  - – 安全政策审查；

  - – 关键供应商的选择；

  - – 合规性审查；

  - – 危机后调查。


  最后，数字委员会能够监控数字化转型带来的社会环境影响、技能发展以及网络安全文化，使其与战略和社会企业责任（CSR）保持一致。


  数字化转型尚未导致董事会的真正转型，无论是在其组成、运作模式，还是对这些新风险风险的考虑上。


  是时候转型董事会和执行委员会了。






