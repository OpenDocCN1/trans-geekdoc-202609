    恢复是一个主要步骤；它包括重启系统、服务，并使数据重新可用，同时保持初始的机密性和完整性。


    ## 3.12. 去中心化映射


    ### 3.12.1. 内部威胁


    正如前面多次提到的，威胁往往源于内部，有时是出于恶意的，通常是由于疏忽或信息误导。百分之七十五的内部事件据报告是意外和无意的。


    前员工（或处于离职阶段的人员）是一个警惕点：每四起内部事件中就有一个源自（前）恶意员工。如何识别他们并防止他们实施恶意行为？


    各部门（IT、人力资源、法务和合规）是否与业务部门共同工作，以建立网络安全文化和问责机制？是否实施了定期培训，以确保了解指令并识别威胁？


    最有效的意识和培训方法是什么？游戏化？结合增强现实并适应公司环境的在线学习？向所有员工发送欺诈性虚假邮件活动？


    分发给所有员工的关于数据、系统和移动设备的书面程序？


    网络事件是否会自发报告（安全环境）？


    在招聘、培训、流动和对网络问题的理解方面，人力资源政策如何从一个职能转移到另一个？当人员自愿或离开公司时，对其持有和处理的数据采取了哪些预防？


    访问控制、加密、备份或流量监控是否到位且有效？


    关于公司信息机密的法律环境是什么？劳动合同如何？内部规定如何？法律部门是否参与了针对内部威胁的网络计划？


    黑客知道如何识别目标员工：拥有重要权限的系统管理员、IT 帮助台人员、管理委员会成员。受困于高度针对性的钓鱼攻击，他们是访问公司基础设施的有效途径。


    妥善管理访问权限并应用最小权限原则（将用户权限严格限制在其工作需求范围内），对于尽量减少用户账户被破解后的风险至关重要：拥有的权限越少，攻击效果就越差。


    第三方、服务商、供应商和分包商的管理比员工更困难，必须接受特殊对待。


    ### 3.12.2. 工业风险


    工业系统的安全性远低于 IT 设备。工业环境中的技术非常异构化。网络访问并不总是被列出，数据未加密，系统仍在使用默认密码配置，而工业领域缺乏安全文化使得攻击者更容易得手。


    工业设施的生命周期很长；因此，它们更容易受到新风险的影响，而且业务部门/安全经理有时（通常？）太薄弱了。


    Hervé Guillou 在 2016 年提到过这一点：


    > 公司的网络风险具有横向性质。但我们看到的是，不幸的是，它往往与公司的通用 IT 相关联，而与其工业生产环境关联较少，且几乎从未（银行除外）与公司的产品和服务（运营
    IT）相关。很多时候，一家公司的网络安全经理（如果有的话）就是 CIO/首席信息官本人，或者更糟，是隶属于他的人。这行不通！¹


    ![图 3.2. 网络风险：业务风险 ¶（来源：Naval Group)](img/image109_c2903.jpg)


    **图 3.2.** 网络风险：业务风险 ¶（来源：Naval Group）


    ![图 3.3. IT 领域的互连互通（来源：Naval Group）。如需此图的彩色版本，请参阅 www.iste.co.uk/defreminville/cybersecurity.zip](img/image110_c2905.jpg)


    **图 3.3.** IT 领域的互连互通（来源：Naval Group）。如需此图的彩色版本，请参阅 [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)


