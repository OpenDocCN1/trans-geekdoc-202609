    it is essential to prepare for the crisis. This preparation also has virtues:
    it makes it possible to become aware, build scenarios, identify risks and assess
    the level of this risk, then set up the action plan to be deployed on the day
    of the crisis and finally consider the measures to be taken to avoid a major crisis.


    It is therefore necessary to identify the key functions and key people, internally
    and externally, to prepare for this crisis management and to be able to set up
    the procedures for D-Day. Who is in charge of what and when? Who should be informed
    – should the board of directors be informed? Depending on the severity of the
    crisis, who will inform the board of directors? What will be the internal communication
    strategy at all levels of the company and externally?


    Each company will build specific crisis scenarios, which will depend on its activities,
    infrastructure and organization.


    In the event of an attack or IT incident, the most important thing is to ensure
    business continuity: restarting systems and restoring data. Strict procedures
    and rules will have to be applied.


    ## 6.6. Crisis management


    ### 6.6.1. The preparation


    Several questions arise regarding crisis preparedness:


    - When does the crisis start and how do we identify the starting point and how
    do we make a quick diagnosis?

    - Do employees know what to do when the alarm goes off?

    - Have any exercises been done?

    - How can we avoid losing track of the history so that we can be covered by insurance
    or take responsibility?

    - Are we able to restore a recent back-up?

    - Do we have the means to communicate internally? A tool, a messaging system and
    contacts, for example? If we do not have a digital or paper record of our contacts,
    we will not be able to call anyone. How many phone numbers do we know by heart?
    Fewer and fewer.


    As with fires, or man overboard exercises in boats, the most effective way is
    to simulate and repeat. Even if the exercise sometimes makes you smile and the
    concentration is not optimal, these simulations allow you to become aware, to
    prepare procedures with all the teams concerned and to repeat some essential actions.


    Large companies, especially vital operators, practice these exercises, which have
    several objectives:


    - imagining scenarios, defining the first steps;

    - identifying the key people in the company to manage the crisis (they will be
    100% available). Their schedules and telephone numbers must be recorded. These
    people must have an identified back-up, relay the information, inform partners
    (lawyers, service providers), authorities (The National Cyber Security Centre
    [`NCSC]`, ICO), according to the type of impact, the type of company (size, sector
    of activity) and taking decisions. Decision-making circuits must be short and
    organized around the `CIO`;

    - testing the participants’ ability to manage technical (network outages) and
    organizational problems (communicate the incident to all service providers affected
    by the attack) and debriefing with the teams;

    - preparing emergency means of communication: secure messaging;

    - communicating: what are the impacts? What incidents have occurred? What data
    has been leaked? The communication is aimed at employees, the press and stakeholders.


    ### 6.6.2. Exiting the state of sideration


    We know that a cyber crisis can happen, just as a fire can happen, or a person
    can fall off a boat into the sea.


    If the actions have been prepared in advance, and the crisis has been simulated,
    as seriously as possible, panic will be controlled and the action plan will proceed
    as planned.


    The crisis will never be exactly the one that has been simulated: the place where
    it occurs, the first people involved, the time at which it occurs.


    Being aware that this crisis can occur makes it possible to anticipate the “response”:
    the first measures to prevent the crisis from spreading, the restoration of the
    activity, the balance sheet (loss of data, systems, damaged equipment, financial
    losses), investigations and the search for responsibilities, internal and external
    communication.


    One of the most important levers is trust. If one is prepared for all possible
    scenarios, the side effect will be reduced and the ability to react will be intact.


    ### 6.6.3. Ensuring business continuity


    The first emergency is to restore the company’s ability to produce, sell, pay
    and be paid.


    The ability to restore systems very quickly is not always possible. In this case,
    it is necessary to set up an ability to work in degraded (or very degraded) mode.


    The testimony of Yves Bigot, one of the only business leaders who agreed to testify
    about the attack on `TV5 Monde` in April 2015, is of great value: the following
    testimony comes from a conference organized by `HEC Gouvernance` in 2017 and from
    various articles published in the press following this attack.


    All screens have gone black. All systems and stocks could have been destroyed
    if the attacked machine had not been disconnected immediately. “The company could
    have been completely destroyed”, says Yves Bigot, the channel’s general manager.


    The inability to restart very quickly gave `TV5 Monde` broadcasters the legal
    possibility to interrupt their broadcasting contracts. The number one objective
    was therefore to deliver content, regardless of the quality of the content.


    `ANSSI` stayed with its teams for six weeks within `TV5 Monde` to understand the
    course of the attack and help restore services. It should be noted that `TV5 Monde`
    had protection deemed “correct” by `ANSSI`. “We are fortunate”, says Yves Bigot,
    who acknowledges a “mental unpreparedness”.


    However, by its own admission, the information system is not yet 100% secure.
    “It’s a very long and tedious job. We are still in the process of deploying our
    protection system and hardening it regularly, in stages. The first few months
    were appalling for us because the installation of these new systems produces side
    effects”.


    Financially, this security has a cost: about 4% of `TV5 Monde`’s total budget.
    A legitimate cost according to Yves Bigot: “There is a real danger, but the problem
    is that it is immaterial. Everyone is concerned by this issue and, at the same
    time, not everyone is ready to take the necessary steps to protect themselves”.


    Following the crisis, the teams had to continue working without the Internet for
    almost six months, working methods were changed on a long-term basis, particularly
    as regards the exchange of information, documents and television productions,
    while physical security was also significantly improved.


    ### 6.6.4. Story of the TV5 Monde attack


    For the first time, the agents sent to the television channel’s rescue in 2015
    tell how they responded to this unprecedented cyber-attack.

    '
  trans: '


    在危机发生之前，必须识别通信方式、联系人、关键工具和重要信息。唯一的解决方案是让自己处于这种情境中：想象明天早上，你的电子邮件系统将不再运行，你将无法访问联系人，你最先进的工厂将关闭，你将无法为客户提供服务（如银行服务），你的存储或交付提供商的信息系统将被勒索软件锁定，你客户的个人数据（护照、社会安全号码或信用卡号）将被盗取，而你正在处理的文件（法律和税务咨询公司）将在三周内无法访问。


    鉴于网络事件或攻击的潜在后果、其有时具有系统性特征，以及反应速度的紧迫性，为危机做准备至关重要。这种准备也有其益处：它让人们能够意识到、构建情景、识别风险并评估这些风险水平，然后制定在危机当天部署的行动计划，最后考虑为避免重大危机发生而采取的措施。


    因此，有必要识别内部和外部的关键职能关键人员，为这种危机管理做好准备，并能够建立危机当天（D-Day）的程序。谁负责什么？什么时候负责？谁应该被通知——是否应该通知董事会？根据危机的严重程度，谁来通知董事会？公司内部各级和外部的沟通策略是什么？


    每家公司将建立特定的危机情景，这些情景取决于其活动、基础设施和组织。


    在发生攻击或 IT 事件时，最重要的是确保业务连续性：重启系统和恢复数据。必须应用严格的程序和规则。


    ## 6.6. 危机管理


    ### 6.6.1. 准备


    关于危机准备工作，存在几个问题：


    - 危机何时开始？我们如何识别起点？我们如何进行快速诊断？

    - 员工是否在警报响起时知道该做什么？

    - 是否进行过任何演习？

    - 我们如何避免丢失历史记录，以便我们获得保险覆盖或承担责任？

    - 我们能够恢复最近的备份吗？

    - 我们是否有手段进行内部通信？例如，一个工具、一个消息系统和联系人？如果我们没有联系人的数字或纸质记录，我们将无法拨打任何电话。我们能背下多少个电话号码？越来越少。


    就像火灾或船上的落水演习一样，最有效的方法是模拟和重复。即使演习有时会让你微笑，且专注程度并非最佳，但这些模拟能让你意识到问题，与所有相关团队一起准备程序，并重复一些关键行动。


    大型公司，特别是关键运营者，会进行这些演习，其几个目标：


    - 想象情景，定义第一步；

    - 识别公司内部管理危机的关键人员（他们将 100% 有空）。必须记录他们的日程和电话号码。这些人必须有确定的备份人员，传递信息，根据影响类型、公司类型（规模、活动领域）通知合作伙伴（律师、服务提供商）、当局（国家网络安全中心
    [`NCSC]`、ICO）并做出决策。决策链必须短并围绕 `CIO` ；

    - 测试参与者管理技术问题（网络中断）和组织问题（向所有受攻击影响的服务商通报事件）的能力，并与团队进行总结；

    - 准备应急通信手段：安全消息传递；

    - 沟通：影响是什么？发生了哪些事件？泄露了哪些数据？沟通对象是员工、媒体和利益相关者。


    ### 6.6.2. 走出僵局状态


    我们知道网络危机可能发生，就像火灾可能发生，或者人可能从船上掉进海里。


    如果提前准备了行动，并尽可能严肃地模拟了危机，恐慌将得到控制，行动计划将按计划进行。


    危机永远不会与模拟的完全相同：发生的地点、首批涉及的人员、发生的时间。


    意识到这种危机可能发生，使得预判“响应”成为：防止危机蔓的首要措施、恢复活动、资产负债表（数据丢失、系统、设备损坏、财务损失）、调查和追责、内部和外部沟通。


    最重要的杠杆之一是信任。如果对所有可能的情况都做好准备，副作用将减少，反应能力将保持完好。


    ### 6.6.3. 确保业务连续性


    首要紧急任务是恢复公司生产、销售、支付和收款的能力。


    快速恢复系统并不总是可能的。在这种情况下，有必要建立以降级（或严重降级）模式工作的能力。


    Yves Bigot 的证言具有巨大的价值，他是同意就 2015 年 4 月攻击 `TV5 Monde` 作证言的企业领导人之一：以下证言来自 2017 年
    `HEC Gouvernance` 组织的一场会议，以及此次攻击后媒体上发表的各种文章。


    所有屏幕都变黑。如果受攻击的机器没有立即断开，所有系统和库存都可能被毁。“公司可能会被完全摧毁，”该频道总经理 Yves Bigot 说。


    无法非常快地重启让 `TV5 Monde` 的广播者拥有中断广播合同的法律可能。因此，首要目标是交付内容，无论质量如何。


    `ANSSI` 在 `TV5 Monde` 留了六周，以了解攻击过程并帮助恢复服务。应该，`TV5 Monde` 的防护被 `ANSSI` 认为是“正确的”。“我们很幸运，”Yves
    Bigot 说，他承认了“心理上的未准备”。


    然而，根据其自身的承认，信息系统尚未实现 100% 安全。“我们仍在部署防护系统并定期对其进行加固。最初几个月对我们来说是糟糕的，因为这些新系统的安装产生了副作用”。


    在财务方面，这种安全性是有成本的：占 `TV5 Monde` 总预算的 4%。在 Yves Bigot 看来，这是一个合理的成本：“危险是真实的，但问题在于它是无形的。每个人都关注这个问题，但同时并不是每个人都准备好采取必要的措施来保护自己”。


    危机之后，团队们不得不在没有互联网的情况下工作了近六个月，工作方法发生了长期改变，特别是在信息、文件和电视制作交换方面，物理安全也得到了显著提高。


    ### 6.6.4. TV5 Monde 攻击故事


    2015 年被派往该电视频道救援的代理首次讲述了他们是如何应对这场前所未有的攻击的。


    '
