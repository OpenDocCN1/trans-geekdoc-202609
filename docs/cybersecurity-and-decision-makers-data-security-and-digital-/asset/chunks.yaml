    ## 3.7. Risk assessment (identify)


    **Table 3.1.** *2017 World Economic Forum Risk Framework*


    | **Impact of cyber incidents** || **Probability of cyber incidents** |

    | --- | --- |

    | **Assets at risk** | **Loss of** | **Vulnerabilities** | **Threats** |

    | **Intangible assets: intellectual property; reputation; conformity** | Confidentiality
    | Culture and staff | Dissatisfied employees |

    | Human error | | | |

    | Insider trading | | | |

    | Activism | | | |

    | **Material assets: financial; stocks; systems of production; infrastructure
    facility** | Integrity | Organization and processes | Criminality |

    | Action of suppliers or partners | | | |

    | Sabotage | | | |

    | **Common good: personal safety; privacy; personal freedoms** | Availability
    | Technology and infrastructure | Spying |

    | Terrorism | | | |

    | Cyberwarfare | | | |


    ### 3.7.1. The main actors


    It is essential that the business lines and main users of a system, software,
    application or process understand where the IT risks are located, which can affect
    the functioning of their operational activities. The first step is to imagine
    what the impacts would be on the company in terms of operations (sales, production,
    logistics), finance (loss of turnover, fraud), law (disputes) and reputation (quality
    problem, inability to deliver, health problem) if an information system were corrupt,
    or the quality of data deteriorated as a result of an attack, or data was not
    available due to the activation of a ransom.


    Operations managers also have a vision of potential threats, internal or external,
    that could act in a malicious manner.


    In other words, what are the consequences of a three-day blockade of the website
    and the inability to sell its products for a consumer goods distribution company?
    What would be the impacts of a quality control problem (of malicious or non-malicious
    origin) on a dairy production industry that could lead to consumer food poisoning?
    What would be the consequences for a law firm or a tax firm of no longer being
    able to access files, which have been completely dematerialized, for several weeks?


    Risk managers, IT managers and IT security managers cannot be the only people
    in charge of risk assessment. These assessments should be systematically co-signed
    by operations managers and IT security managers, and then consolidated or even
    prioritized by risk managers for large companies or by senior management.


    ### 3.7.2. The steps


    The first action consists of an inventory of equipment and resources, which will
    also provide an understanding of the system architecture, including connections
    between industrial systems and the company network (which must be limited and
    protected), an inventory of workstations (which must be configured in a consistent
    manner and comply with common rules) and a complete overview of internal and external
    information flows.


    The `ISO2700x` family of standards defines “assets” as any element having a value
    for the organization: primary or production assets (upstream logistics, manufacturing,
    downstream logistics, marketing and sales, services, processes, information) and
    secondary assets (servers, software, networks, purchasing, research and development,
    skills, IT). Prioritizing the assets to be protected is the first step.


    The physical security of this equipment is intended to prevent malicious intrusions
    to access, steal, modify, destroy or damage information, whether the equipment
    is fixed (servers, for example) or mobile (computers, telephones, etc.).


    It also aims to protect them from accidents such as fires, floods or acts of terrorism.
    The system may not always be protected.


    ### 3.8. Protecting


    The protection of systems requires:


    - `firewall`, `logs`, `authentication`

    - `passwords`, `USB`

    - `audits`, `training`


    ### 3.9. Detecting


    It is rare that an attack occurs without being noticed. It is necessary to identify
    connection attempts, organize data, and alerts.


    ### 3.10. Reacting


    Do you have an intervention plan in case of an attack? Is this intervention plan
    known to the company’s teams? Do they know who to notify in case of an anomaly?
    Do they know how to react? Who to call? On which number? Unplug, disconnect your
    mobile?

