    The `NIS Cybersecurity Directive` requires a wide range of private sector companies
    to comply with new security and incident notifications. It also stipulates that
    “critical infrastructure operators”, i.e. public utilities, transport and financial
    service companies, must deploy appropriate measures to manage security risks and
    report serious incidents to a national authority or to the emergency IT response
    team.


    ## 4.4. Sectoral regulations

    ### 4.4.1. The banking industry

    In addition to the `NIS Directive`, published in 2016, the G7 countries have established
    a list of fundamental elements of cybersecurity for the financial sector, recommendations
    on the need to assess cybersecurity and coordination with other critical sectors.
    The `CPMI-IOSCO` (Committee on Payments and Market-International Organization
    of Securities Commissions Infrastructures) published the `Cyber resilience for
    financial market infrastructures` guide in June 2016.


    On June 19, 2017, the `ECB` organized a high-level meeting on cyber resilience
    in Frankfurt. In his speech, Benoît Coeuré, a member of the `ECB`’s Executive
    Board, spoke about the objectives of this meeting with representatives of public
    authorities, critical service providers and financial market infrastructures.


    He stressed the inevitability of the attacks and the absolute need to take action
    to ensure the resilience of the system as a whole, with each country’s system
    linked to the others. He announced the creation of a High-level Cyber Resilience
    Forum, in particular, to ensure that cybersecurity is not only a matter for regulators
    but also tp:


    * – better understand the threat in Europe, particularly the financial sector;

    * – share the cyber strategy and explain the `ECB`’s approach to addressing the
    issue of cyber resilience for banks;

    * – establish cooperation and create an environment of trust.


    Indeed, the Basel rules aim to strengthen the stability of banks, but the other
    source of instability is not financial, it is technological: the whole system
    is based on digital operation, the risk is systemic and cybersecurity is vital.
    The `ECB` therefore has requirements in terms of governance, identification measures,
    protection measures, detection capabilities, as well as response and recovery
    solutions after the cyber crisis. Cyber-resilience guides also recommend crisis
    simulation, communication preparation, continuous improvement and learning.


    In addition to financial stress tests, on May 2, 2018, the `ECB` published a European
    framework for testing the resilience of the financial system to `TIBER-EU` (Threat
    Intelligence Based Ethical Red Teaming) cyber-attacks: `TIBER-EU`-based tests
    simulate a cyber-attack against an entity’s critical functions and underlying
    systems, such as the people it employs, the processes it implements and the technologies
    it uses. These tests will help the entity assess its capabilities in terms of
    protection, detection and response to potential cyber-attacks.


    The `ECB` intervenes in banking institutions either as a preventive measure or
    following an incident, and most probably visited `BNP`, where two major breakdowns
    occurred in two months, in early 2019 (three days of blackout of the information
    system for the second breakdown), due to a “simple network incident”, says `BNP`.
    A bank has strict obligations regarding the availability of its service, in line
    with its status as a critical national infrastructure, no matter the cause of
    the incidents (hardware or software failure, network failure or computer attack).


    “The `ECB`’s banking supervision attaches great importance to cyber resilience”,
    warns Sabine Lautenschläger. The European supervisor thus conducts audits concerning
    IT risk management, on-site control of the implementation of best practices and
    has set up a reporting system for IT incidents.


    ### 4.4.2. Health

    Health data are specific personal data because they are considered sensitive.


    Interconnection, increased exchanges and data sharing increase security risks:
    data theft or misuse, system blocking, hacking of connected medical devices, etc.


    The appointment schedules of some hospitals were hacked by criminals, who contacted
    patients to tell them that their consultation was cancelled and gave them a premium
    number to call to reschedule. Today, scanners, MRIs or incubators for premature
    babies are connected and can therefore be hacked.


    To better understand the increase in the number of attacks, health facilities
    are required to report all attacks through the Adverse Health Event Reporting
    Portal. The Ministry of Solidarity and Health, in conjunction with the regional
    health agencies (ARS) and ASIP Santé, has set up an operational support unit to
    help them.


    The text provides, among other things, for the certification of personal data
    protection by an accredited body.


    The health sector, unlike the banking industry, is not ahead of the curve. And
    yet, like other sectors, it is extremely dependent on information technology,
    both for medical interventions, administrative management and the storage of patients’
    medical records.


    Healthcare facility information systems are a perfect target for cybercriminals.
    The impacts can be both economic and operational: a failure in the operating system
    can equally endanger patients’ lives. The 2017 attack in the United Kingdom caused
    a complete paralysis of the imaging departments and the opening of patient files
    from various hospitals.

