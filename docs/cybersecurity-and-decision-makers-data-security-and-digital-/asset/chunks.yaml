- raw: '## **3.7. Risk assessment (identify)**


    **Table 3.1.** *2017 World Economic Forum Risk Framework*


    | **Impact of cyber incidents**  || **Probability of cyber incidents** |


    | --- | --- |


    | **Assets at risk** || **Loss of** || **Vulnerabilities** || **Threats** |


    | **Intangible assets: intellectual property; reputation; conformity** || Confidentiality
    || Culture and staff || Dissatisfied employees |


    | Human error |


    | Insider trading |


    | Activism |


    | **Material assets: financial; stocks; systems of production; infrastructure
    facility** || Integrity || Organization and processes || Criminality |


    | Action of suppliers or partners |


    | Sabotage |


    | **Common good: personal safety; privacy; personal freedoms** || Availability
    || Technology and infrastructure || Spying |


    | Terrorism |


    | Cyberwarfare |


    ### **3.7.1. *The main actors***


    It is essential that the business lines and main users of a system, software,
    application or process understand where the IT risks are located, which can affect
    the functioning of their operational activities. The first step is to imagine
    what the impacts would be on the company in terms of operations (sales, production,
    logistics), finance (loss of turnover, fraud), law (disputes) and reputation (quality
    problem, inability to deliver, health problem) if an information system were corrupt,
    or the quality of data deteriorated as a result of an attack, or data was not
    available due to the activation of a ransom.


    Operations managers also have a vision of potential threats, internal or external,
    that could act in a malicious manner.


    In other words, what are the consequences of a three-day blockade of the website
    and the inability to sell its products for a consumer goods distribution company?
    What would be the impacts of a quality control problem (of malicious or non-malicious
    origin) on a dairy production industry that could lead to consumer food poisoning?
    What would be the consequences for a law firm or a tax firm of no longer being
    able to access files, which have been completely dematerialized, for several weeks?


    Risk managers, IT managers and IT security managers cannot be the only people
    in charge of risk assessment. These assessments should be systematically co-signed
    by operations managers and IT security managers, and then consolidated or even
    prioritized by risk managers for large companies or by senior management.


    ### **3.7.2. *The steps***


    The first action consists of an inventory of equipment and resources, which will
    also provide an understanding of the system architecture, including connections
    between industrial systems and the company network (which must be limited and
    protected), an inventory of workstations (which must be configured in a consistent
    manner and comply with common rules) and a complete overview of internal and external
    information flows.


    The ISO2700x family of standards defines “assets” as any element having a value
    for the organization: primary or production assets (upstream logistics, manufacturing,
    downstream logistics, marketing and sales, services, processes, information) and
    secondary assets (servers, software, networks, purchasing, research and development,
    skills, IT). Prioritizing the assets to be protected is the first step.


    The physical security of this equipment is intended to prevent malicious intrusions
    to access, steal, modify, destroy or damage information, whether the equipment
    is fixed (servers, for example) or mobile (computers, telephones, etc.).


    It also aims to protect them from accidents such as fires, floods or acts of terrorism.
    The system may not always be protected, but the information can be duplicated
    and backed up on different sites and systems.


    This first step is essential: without a clear understanding of strategic assets
    (tangible and intangible), strategic processes, security policies, governance
    (who is responsible for what), company IT equipment (hardware, network, software)
    and security equipment and/or solutions, as well as internal and external skills,
    solutions to prioritize risks and provide solutions are unlikely to be appropriate.


    ## **3.8. Protecting**


    The protection of systems and data requires the implementation of:


    *   – security tools related to the network (firewall, anti-spam), detection (monitoring
    and log logs), access (authentication) and access management (who has access to
    what);


    *   – security rules: passwords, access to websites, USB key, Wi-Fi;


    *   – control (regular audits, intrusion tests, application of rules);


    *   – training throughout the chain, from top to bottom and bottom to top, not
    to mention the many temporary or permanent external staff. Indeed, the major risk
    is between the chair and the table: credulity, lack of vigilance, incompetence,
    negligence, etc. Training from the moment of recruitment is a good practice.


    ## **3.9. Detecting**


    It is rare that a burglary or bank robbery takes place without prior identification
    of the premises, habits, schedules, access possibilities and conditions, holiday
    dates, change of managers.


    Surveillance therefore makes it possible to act before pirates attack. It is necessary
    to identify connection attempts, abnormal data leaks (harmless at first, they
    will increase if no one notices anything, as in the case of financial fraud).
    When external service providers are authorized to connect to the network, to information
    systems, it is important to set up special procedures and to be able to detect
    unauthorized connections. As companies are better protected, attackers go through
    connected suppliers or subcontractors.


    Incidents can come from different sources, tools or people. It is therefore necessary
    to analyze the data (including access) and organize these alerts.


    Care must be taken not to neglect the sharing of information with other companies,
    circles of safety managers and service providers, which makes it possible to improve
    the alert system.


    Beware of holiday and festive periods, as these are the preferred times for attackers.


    ## **3.10. Reacting**


    Do you have an intervention plan in case of an attack?


    Is this intervention plan known to the company’s teams? Do they know who to notify
    in case of an anomaly? Do they know how to react? Who to call? On which number?
    Unplug, deactivate the connection?


    For obscure reasons, security is too often in the hands of a few people, instead
    of being everyone’s business. How many companies have issued IT security instructions
    to all staff in the event of receiving a fraudulent email (destroy it? forward
    it to security?), in the event of opening a fraudulent attachment (notify who?
    Unplug your computer? Disconnect your mobile?) or in the event of ransom messages
    or suspicious phone calls?


    An IT service provider calls you and “on instructions from the IT department”
    comes to perform maintenance operations, or take control of your computer remotely.


    A president receives an email about updating his Wikipedia; he rushes to look
    at what Wikipedia will publish about him, proud to be part of this prestigious
    club. He clicks and the attacker has managed to break through; he will read his
    emails for weeks, months or even years.


    Avoiding attacks is not possible; avoiding bad reactions is possible. Vigilance
    is based on the awareness of these different scenarios, the implementation of
    procedures and the application of these procedures by all. Some managers, particularly
    in France, consider that the procedures are applicable for all except them.


    Mistakes are human; no one is safe. The question is: how can we prevent the error
    from having no impact? And what to do immediately?


    The incident must be understood: where did the attack come from? What are the
    consequences? What was the objective? What lessons can be learned from this? What
    are the vulnerabilities and how can they be fixed? Was the response plan effective
    and how could it be improved?


