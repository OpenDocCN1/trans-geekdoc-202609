    *   File integrity monitoring: tracking changes to file and folder creation, access,
    viewing, deletion, modification, renamed files, real-time alerts on changes occurring
    on files and folders.

    *   Reverse proxy/load balancer: additional security layer for servers authenticating
    users through internal authentication sources.


    ## A3.5. Reacting


    Security automation and orchestration tools designed to improve the productivity
    and efficiency of security operation centers and analysts (collection and correlation
    of data from different security systems, coordination of incident response and
    management life cycles, incident detection and processing).


