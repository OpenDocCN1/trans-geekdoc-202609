  trans: '

    *   集中化管理服务器，处理三类信息：移动类信息（通过电子邮件、即时消息或网页发布）、存储类信息（服务器上的静态数据）和处理类信息（例如从计算机传输到 USB
    闪存或通过打印传输）。将对此类信息的集中化管理制定公司内部策略。

    *   邮件流控制，以及将敏感邮件重定向至经理处，由经理随后决定是否发送该邮件。

    *   网络控制器：用于扫描网络活动、定位并控制信息的服务器。它能够根据公司内部策略阻止某些违规行为并停止任何不希望的活动。

    *   主机入侵检测系统（Host IDS）或机器入侵检测系统。

    *   文件完整性监控：跟踪文件和文件夹的创建、访问、查看、删除、修改、重命名等更改，并对文件和文件夹发生的变化进行实时告警。

    *   反向代理/负载均衡器：服务器的额外安全层，通过内部身份验证源进行用户验证。


    ## A3.5. 响应


    安全自动化与编排工具，旨在提高安全运营中心（SOC）和分析师的生产力与效率（收集和关联来自不同安全系统的数据、协调事件响应和管理生命周期、事件检测与处理）。


    ## A3.6. 恢复


    *   备份。

    *   恢复。


    # 术语表


    **ANSSI**:

    法国国家信息安全局 [法国信息系统安全机构]


    **APT**:

    高级持续性威胁，一种隐蔽且耗费长时间的入侵手段，目的是在不引起注意的情况下获取数据。


    **BATX**:

    百度、阿里巴巴、腾讯和小米，还应加上“华为”的“H”，即中国的互联网巨头企业。


    **Botnet**:

    机器人网络，在网络上执行任务的计算机机器人网络。


    **CERT**:

    计算机应急响应小组。


    **CIO**:

    首席信息官。


    **CISO**:

    首席信息安全官。


    **CNIL**:

    法国国家信息与自由委员会 [法国监管机构，负责确保数据隐私法应用在个人数据的收集、存储和使用中]。


    **COSO**:

    由信德威委员会赞助组织（COSO）定义的内部控制框架。


    **CRM**:

    客户关系管理。


    **DoS**:

    拒绝服务攻击。


    **ENISA**:

    欧盟网络安全局。


    **ERP**:

    企业资源计划。


    **FINMA**:

    瑞士金融市场监管局。


    **GAFAM**:

    谷歌、苹果、脸、亚马逊和微软。


    **GDPR**:

    通用数据保护条例。


    **IoT**:

    物联网，互联网与物体、地点和物理环境之间的互连。


    **IT**:

    信息技术。


    **LPM**:

    法国军事编程法。


    **MELANI**:

    瑞士信息保障注册与分析中心。


    **NIS**:

    网络与信息安全，2016 年 7 月 6 日通过的关于网络和信息系统安全的欧盟指令。


    **Phishing**:

    钓鱼诈骗，通过发送伪装来自信誉良好的公司的电子邮件，诱导个人个人信息（如密码、信用卡号或登录信息）。


    **Ransomware**:

    勒索软件，通过锁定计算机或加密其数据来向用户索钱的恶意程序；利用网络在多台计算机上自我复制。


    **Rootkits**:

    根内核包，允许远程访问和录制（摄像头）。


    **SEC**:

    美国证券交易委员会。


    **SIEM**:

    安全信息和事件管理。


    **SOC**:

    安全运营中心。


    **Spyware**:

    间谍软件，或安装在计算机或移动设备中以收集和传输其所在环境信息的恶意软件，通常在用户不知情的情况下；记录键盘和屏幕数据。


    **Trojan horse**:

    木洛马，接管你计算机的程序。


    **Virus**:

    病毒，与另一个程序关联并导致其功能故障的程序。


