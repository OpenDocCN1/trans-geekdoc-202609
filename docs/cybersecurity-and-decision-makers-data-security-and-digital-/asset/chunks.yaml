    It is no secret that we entered the era of Big Data, which consists of capturing,
    analyzing, sharing and storing digital data. Big Data is powered by e-commerce,
    and services will be powered by the Internet of Things, autonomous cars or drones
    in the future.


    More and more companies are experiencing cyber-attacks and data leaks, such as
    Yahoo!, Equifax, Facebook or British Airways. These two observations raise the
    problem of digital trust and therefore that of digital responsibility.


    The `GDPR` (General Data Protection Regulation) is a key framework in this context.


    ## 2.3.6. The statutory auditors


    The main mission of the statutory auditors is to certify the regularity and sincerity
    of the accounts. It is permanent and includes obligations toward partners. Through
    their knowledge of companies’ procedures, the auditor has a real role to play
    with them.


    The `Compagnie nationale des commissaires aux comptes` (`CNCC`) has developed
    the `CyberAUDIT©` tool, which measures the company’s exposure and maturity to
    cyber-risks, assesses the financial impacts and prepares a report for managers.


    ## 2.3.7. The numerical responsibility of the board of directors


    Beyond cybersecurity and data protection issues, the board of directors must reconcile
    its social and environmental responsibility with its digital responsibility.

    '
  trans: '

    最后，风险分析可能导致将风险转移给保险。尽管网络风险复杂且难以量化（特别是由于缺乏历史损失数据以及可能发生的事件类型繁多），但保险公司正活跃于这一市场，并拥有一套分析网格，使公司能够更好地了解自身的风险水平和保护状况。


    正如第 2.2.2 节 所讨论，评级是董事会（特别是审计委员会）的工具和警惕点。它们允许进行快速审计并监控改进进度。在这些评级公开之前对它们进行预判将会更好。


    ## 2.3.4.2. 重塑董事会？


    董事成员并非非 IT 专家，也不打算成为专家。除了数字战略和业务模式的转型外，理解法律、威胁、风险、后果、角色与职责以及保护公司的方法仍然是必要的。


    董事会和管理层面临的困难，特别在于缺乏一种所有人都能理解的关于网络安全问题的通用词汇，也缺乏用于评估、管理、比较和就网络表现决策的客观数据。


    首先，这是一个改进 IT 部门与公司其他部分沟通的问题：四位 IT 决策者中有一位在发生网络攻击时不会通知其管理层。


    公司董事会可以设立数字委员会（如施耐德电气在 2017 年所做的）或安全委员会（如瑞士历力华集团 Richemont 所做的），能够能够管理和控制网络风险及危机管理，并为董事提供更多数字培训：


    *   施耐德电气的数字委员会致力于数字战略和表现。它每年至少召开三次会议，包括与审计风险委员会共同审查网络安全风险。它通过深入研究七个主题为董事会的工作做准备：数字业务的发展与增长、集团客户和合作伙伴数字体验的改进与转型、通过有效利用培训技术和数字自动化能力提升施耐德电气的运营效率、网络风险评估以及提升集团在网络安全地位（与审计委员会共同完成）、评估可能的并购对集团数字战略的贡献、数字环境的监测与分析（竞争对手和处理商、威胁与机会），以及验证公司是否拥有数字化转型所需的人力资源；


    *   历力华集团（瑞士奢侈品行业）创建了战略安全委员会（SSC），每年会议四次。其职责是就安全政策的所有方面向董事会提供建议；其目标是保护公司资产（包括机密信息和知识产权）以及运营免受侵入性行为。委员会还监督财产和人员。


    ## 2.3.5. 董事会与数据保护


    众所周知，我们已经进入了大数据时代，这包括捕获、分析、共享和存储数字数据。大数据由电子商务驱动，未来服务将由物联网、自动驾驶汽车或无人机驱动。


    越来越多的公司正经历着网络攻击和数据泄露，例如 Yahoo!、Equifax、Facebook 或英国航空。这两项观察引发了数字信任问题，因此也引发了数字责任问题。


    `GDPR`（通用数据保护条例）在此背景下是一个关键框架。


    ## 2.3.6. 法审计师


    法审计师的主要任务是认证财务报告的合性和真实性。这是一项持续工作，并包括对合作伙伴的义务。通过对公司程序的了解，审计师与他们之间可以发挥真正的作用。


    法国注册审计师协会（CNCC）开发了 `CyberAUDIT©` 工具，该工具可以衡量公司对网络风险的暴露程度和成熟度，评估财务影响并为管理层准备报告。

    '
