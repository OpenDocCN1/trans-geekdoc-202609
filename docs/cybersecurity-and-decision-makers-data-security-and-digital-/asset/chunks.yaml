- raw: "Be careful, there is strong pressure on CISOs, who are too often considered\
    \ responsible in the event of a successful attack. Between the explosion of threats\
    \ they face, the cyber-risks to be managed internally due to employees with poor\
    \ IT hygiene or the hammer of the GDPR, the pressure is high.\n\nIndeed, as shown\
    \ by a study conducted by Symantec on a European scale in collaboration with the\
    \ University of London and the consulting firm Thread, 82% of security managers\
    \ in Europe are on the verge of burn-out, a little more in France (85%) than elsewhere\
    \ (81% in the United Kingdom and Germany). Eight percent plan to resign versus\
    \ 64% in Germany and 60% in the United Kingdom.\n\nMany alerts to process, the\
    \ obligation to secure excessive volumes of incoming/outgoing data and too vast\
    \ an area to protect along with a lack of resources are the main causes of this\
    \ unease. CISOs must assess risks, propose solutions and decide, due to the lack\
    \ of involvement of decision makers. CISOs are business partners, not decision\
    \ makers.\n\n### **5.3.3. *Clarifying responsibilities***\n\nThe companies under\
    \ attack regularly raise cybersecurity issues at the executive committee and board\
    \ level: incidents, devices, risks and crisis management.\n\nThis is proof that\
    \ this new challenge is at the level of leaders, not just security managers. Too\
    \ often, responsibilities lie with the latter, who are responsible for estimating\
    \ risks, proposing solutions, choosing them and implementing them. That is a lot\
    \ for one person; the company is in danger. The CISO who described this all too\
    \ common situation is also in a company that encountered serious problems in the\
    \ first quarter of 2019.\n\n ![Figure 5.2. Most companies store at least some\
    \ of their data in a cloud… most of them in public clouds ¶ (source: after CESIN)](image/image154_c2911.jpg)\n\
    \n**Figure 5.2.** *Most companies store at least some of their data in a cloud…\
    \ most of them in public clouds* ¶ *(source: after CESIN)*\n\nCybersecurity is\
    \ a decision maker’s subject. We must be able to make trade-offs. We have to talk\
    \ about it in the executive committee. And talk about it in an understandable\
    \ way. What is needed is to make informed decisions with legal, commercial, technical\
    \ and financial officials. Cybersecurity represents 5–10% of the overall IT budget,\
    \ all inclusive. It is a risk like any other, and risk must be integrated into\
    \ risk mapping, and the risk analysis must be renewed. The Ebios Risk Manager\
    \ method has been developed to assess risks using a cyber prism.\n\nA member of\
    \ the executive committee must be in charge of security matters and will be the\
    \ referent of the cybersecurity manager. The latter cannot depend on the IT or\
    \ digital director, who is required to be agile, innovative and efficient. Safety\
    \ is often a constraint: it slows down and costs money.\n\nConvergence between\
    \ digital transformation and security is essential. They must move forward together.\
    \ This is why it is important to talk about the two subjects together from the\
    \ outset and avoid the temptation of “it was better before”.\n\nThe cloud *is*\
    \ complicated for CISOs, but it is necessary to deal with in a secure way to analyze\
    \ the services of cloud partners.\n\nThe identification of outsourced data and\
    \ services in the cloud cannot be outsourced. It is like strategy.\n\n### **5.3.4.\
    \ *Streamlining the supplier portfolio***\n\nIn 2018, 54% of IT security managers\
    \ worked with 10 or fewer solution providers. They are 63% now.\n\nAccording to\
    \ the American network equipment manufacturer Cisco and its 2019 report on CISO[¹](#c05.xhtml#pg133fne0c1)\
    \ activity, the trend would be to simplify IT security systems, which are too\
    \ complex and diversified to be effective and efficient.\n\nThe survey was conducted\
    \ with 3,259 CISOs and CIOs in 18 countries, including France. Seventy-nine percent\
    \ of respondents still find it difficult, if not very complicated, to orchestrate\
    \ alerts from multiple suppliers. This is the main reason why more CISOs are now\
    \ concerned about the reduction of the number of their suppliers, in order to\
    \ better manage third-party risks and optimize costs.\n\nAlso, 51% of respondents\
    \ estimate the financial impact of a security breach on their organization to\
    \ be less than $500,000. On the other hand, it would be higher than this amount\
    \ for 45% of respondents.\n\nThe “non-integrated” solutions are too diverse and\
    \ undermine the process of prioritizing, managing and responding to security alerts.\n\
    \nIn addition, 75% also rely on automation to manage IT security priorities, a\
    \ rate down eight points from 2018. Dependence on disruptive technologies has\
    \ also declined. Thus, 67% (compared to 77% in 2018) say they use machine learning.\
    \ In addition, 66% (74% in 2018) report using other artificial intelligence (AI)\
    \ applications.\n\n![Figure 5.3. Companies deploy more than a dozen cybersecurity\
    \ solutions on average ¶ (source: according to Cesin)](image/image156_c2912.jpg)\n\
    \n**Figure 5.3.** *Companies deploy more than a dozen cybersecurity solutions\
    \ on average* ¶ *(source: according to Cesin)*\n\n### **5.3.5. *Security policies\
    \ and procedures***\n\nAn employee who inadvertently opens an attachment containing\
    \ a virus is the primary cause of attacks. The first weapons of defense are internal\
    \ information and the implementation of procedures.\n\nThe attacks are becoming\
    \ increasingly sophisticated. Surveillance is essential. It is based on tools\
    \ and everyone’s vigilance: setting up a hotline and a dedicated team, communicating\
    \ to all users about their role to play (detect, question before acting and inform).\n\
    \nThe training of all users at all levels (lead by example) is essential: the\
    \ reminder of rules, good practices and processes (examples: fraud on the president,\
    \ monitoring processes even in emergencies, checking the origin of instructions).\n\
    \nThe existence of an IT security policy and procedures within the company is\
    \ a good sign. Nevertheless, it is important to update them regularly, especially\
    \ in the rapidly changing IT field.\n\nIn addition, policy coherence must be ensured\
    \ across the group: for historical reasons, this is not always the case.\n\nFinally,\
    \ the existence of the security policy is not enough; it must be disseminated\
    \ to all concerned, including small subsidiaries, and its implementation must\
    \ be monitored, which means auditing it regularly and monitoring the implementation\
    \ of recommendations.\n\nThe security policy is based on the recipients:\n\n*\
    \   – the IT charter for users with the rules to be respected (Internet, emails,\
    \ passwords, social media, confidentiality, data management, mobility, authentication);\n\
    \n*   – the information systems and network security policy;\n\n*   – security\
    \ policies, relating to equipment: personal computers (PCs), printers, servers,\
    \ Wi-Fi, network, telephone;\n\n*   – security policies toward suppliers and subcontractors;\n\
    \n*   – back-up policies.\n\n#### 5.3.5.1. *The cloud strategy*\n\nWhile the cloud\
    \ has become the central architecture of today’s IT, it has also been considered\
    \ one of the main vulnerabilities, particularly since the United States adopted\
    \ the CLOUD Act (March 2018).\n\nInternal private cloud, cloud management and\
    \ outsourced private cloud are becoming increasingly important and provide access\
    \ to advanced security technologies.\n\nThe choice of these solutions is structuring,\
    \ but the choice of the technical solution (interoperability with the company’s\
    \ systems) is far from sufficient. A risk analysis must also be conducted (such\
    \ as Ebios or Enisa, as mentioned above).\n\nThese are also questions:\n\n*  \
    \ – Strategic: what data will be stored on this cloud? What processing will go\
    \ through the cloud? What back-ups? What availability, reversibility/portability?\n\
    \n*   – Legal: which contract, which guarantees? Does the service provider comply\
    \ with the regulations in force? Does the company have the right to audit? Where\
    \ are the data located? What guarantees of security and confidentiality?\n\n*\
    \   – Financial: annual costs, cost of specific services."
