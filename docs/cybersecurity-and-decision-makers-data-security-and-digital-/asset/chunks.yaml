    The intervention of the legal department, which ensures compliance with international
    regulations, laws and standards, is essential, as is that of the finance department,
    which will have to anticipate costs and productivity gains, finance investments
    and forecast additional security costs: the `SOC` (Security Operation Center),
    the `CERT` (Computer Emergency Response Team) or outsourced monitoring, depending
    on the size of the company and its activity, as well as training, intrusion tests
    and audits.


    Internal governance requires clarifying roles and responsibilities, as well as
    setting up:


    - security procedures and policies (an excellent `CISO` is not enough);

    - a defense in depth: the door + alarm, rather than the armored door;

    - Security by Design: security must be designed from the start of a project, it
    is much easier and less expensive than integrating it during the project, or once
    the project is completed;

    - a continuity plan, to ensure that the company will be able to continue its sales,
    production and administration activities.


    In this context, the CFO’s concerns are very broad. The financial consequences
    of cybercrime for companies include financial assets, intellectual property, brand
    and Internet presence, reputation, business continuity, theft and illegal processing
    of personal data, disclosure of confidential information, fraud, ransom payments,
    data integrity, investigation costs in the event of an attack, the cost of litigation
    initiated by customers, employees, shareholders or partners.


    The need for a real culture of cyber prevention concerns the entire economic fabric,
    particularly in the SMEs, which are less protected, are statistically the first
    targets and often the gateway to large companies.


    For Swiss SMEs, for example, online security tests are provided by `ICTswitzerland`,
    as well as basic recommendations to protect companies.


    ![Figure 2.4. Cyber-risk governance ¶ (source: Starboard Advisory)](image/image87_c2891.jpg)


    **Figure 2.4.** Cyber-risk governance ¶ (source: Starboard Advisory)


    ## 2.5.5. Merger and acquisition transactions


    Finally, there is the particular case of mergers and acquisition transactions,
    which must be subject to cyber-specific due diligence.


    Indeed, it is critical:


    - to assess the quality of IT management, service providers, tools and processes,
    as well as the ability to detect and respond to incidents;

    - to conduct an audit: cyber incidents, vulnerabilities, data recovery plans in
    the event of an attack, level of data protection, access management, at storage
    locations and during data transfers;

    - to verify, in conjunction with the company’s experts or external auditors, the
    cyber maturity of the “target”, the nature of the data and their strategic value,
    compliance with IT regulations and standards, traces of IT incidents on the deep
    and darknet, cyber insurance policies;

    - estimate the costs of securing systems, training technical teams and personnel
    (multifunctional and multi-site).


    Once the acquisition is completed, it will be necessary to integrate, disseminate
    and enforce group procedures, map risks, implement the cybersecurity strategy
    to protect key assets, manage third parties and verify the existence of instructions
    to respond to incidents and ensure the company’s resilience in the event of an
    attack.


    ## 2.5.6. Governance and data protection, cybersecurity


    ### 2.5.6.1. Internal data


    To optimize data collection, updating and archiving efforts, as well as to ensure
    the quality of data essential for their analysis, it is necessary to define data
    governance: identify strategic and non-strategic data, collect the needs of businesses
    and functions, define the roles and responsibilities in the company for each data,
    as well as update rules (who, when, documentation) and access rules (writing,
    reading).


    It is a real project, but if the company succeeds, it saves a lot of time and
    quality. This requires listening to the needs of all actors, understanding them
    and making compromises so that sharing is possible.


    High discipline and the application of rigorous rules are essential if all actors
    are to have confidence in the quality of the data produced by others. This is
    a challenge for companies organized in silos, which do not share data with others,
    for fear of losing power, but it is a value-creating progress if data producers
    can act with a common objective.


    If we add to this data governance, adequate governance of cybersecurity resources,
    involving IT functions, operational managers and finance, human resources and
    legal functions and a transformation of culture, the digital transformation will
    be successful.


    ### 2.5.6.2. Customer data


    The collection of customer data can be done through several channels: relationships
    via sales teams, stores and websites. The pooling of all this data is a subject
    in its own right and requires the establishment of a sales organization that makes
    it possible to address the customer via different channels, without him/her feeling
    harassed, and, at the same time, it is necessary to ensure that all customers
    are in a common base.


    The issue here is not to deal with this organization of commercial data, but rather
    to ensure the protection of such data, both for compliance and ethical reasons.
    This issue is discussed in the following chapters.


    ### 2.5.6.3. Open data and personal data protection


    Administrations produce or collect data and must make them freely reusable. And,
    at the same time, they are subject to the `GDPR`. Even when anonymized, data can
    sometimes be attributed to a person, for example, by cross-referencing data.


    This is an extremely sensitive subject, which, beyond the protection of information
    systems, requires specific data processing and precise controls to avoid processing
    that does not comply with the law.


    ### 2.5.6.4. Public data – acute spying?


    Many cities and transport companies are setting up video surveillance systems.
    `Smart cities` collect data to improve car flows or energy consumption.


    The objectives are often legitimate (security, cost reduction), sometimes only
    commercial (a Swiss start-up develops advertising panels that adapt to the profile
    of passersby). What is at stake is the consent of the data owner and the ability
    to protect the data: the providers are private companies. What do monitoring companies
    and IT service providers do with these data? Where do they store them? How long
    do they keep them? Who has access to it? How are they secured? Many questions
    arise. The responsibility for the confidentiality, integrity and security of these
    data is shared between the public and private spheres. The quality of the entire
    ecosystem is extremely important.


    The City of Toronto has implemented many sensors and collected public and private
    data necessary for its operation, which could identify individuals and use the
    data for commercial purposes by the city’s project company, a company in the Google
    galaxy, `Sidewalk Labs`.


    What guarantees do Toronto residents have about the use of this data? How are
    they administered, by whom and for what purpose? What are the contractual and
    financial links between the city and the service provider? Are residents involved
    and do they have a voice? These are governance issues for cities.

    '
  trans: '

    法律部门的介入至关重要，负责确保符合国际法规、法律和标准；财务部门的介入也同样重要，他们必须预测成本和生产力收益、财务投资，并预测额外的安全成本：`SOC`（安全运营中心）、`CERT`（计算机应急响应小组）或外包监控，具体取决于公司的规模和活动范围，以及培训、渗透测试和审计。


    内部治理需要明确角色和职责，并建立：


    - 安全程序和策略（仅有一位优秀的 `CISO`是不够的）；

    - 深度防御：门+报警器，而不是简单的防盗门；

    - 设计安全（Security by Design）：安全必须从项目开始就进行设计，这比在项目期间或项目完成后再集成要容易得多且便宜得多；

    - 连续性计划，以确保公司能够继续销售、生产和管理活动。


    在此背景下，首席财务官（CFO）关注的问题非常广泛。网络犯罪对公司造成的财务后果包括财务资产、知识产权、品牌和互联网存在、声誉、业务连续性、个人数据被窃和非法处理、机密信息泄露、欺诈、赎金支付、数据完整性、遭受攻击时的调查成本，以及客户、员工、股东或合作伙伴发起的诉讼成本。


    对真正的网络预防文化的需求涉及整个经济结构，特别是中小企业（SMEs），它们受保护较少，在统计学上是首要目标，并且往往是进入大型公司的门户。


    例如，对于瑞士的中小企业，`ICTswitzerland`提供了在线安全测试以及保护公司的基本建议。


    ![图 2.4. 网络风险治理 ¶ (来源: Starboard Advisory)](img/image87_c2891.jpg)


    **图 2.4.** 网络风险治理 ¶ (来源: Starboard Advisory)


    ## 2.5.5. 合并收购交易


    最后是合并收购交易特殊特殊，必须进行特定的网络尽职调查。


    事实上，这至关重要：


    - 评估 IT 管理、服务提供商、工具和流程的质量，以及检测和响应事件的能力；

    - 进行审计：网络事件、漏洞、攻击的数据恢复计划、数据保护水平、存储位置及数据传输期间的访问管理；

    - 与公司专家或外部审计师一起，核实“目标公司”的网络成熟度、数据的性质及其战略价值、对 IT 法规和标准的合规性、深网和暗网上的 IT 事件痕迹、网络保险政策；

    - 估计安全系统、培训技术团队和人员（多功能和多站点）的成本。


    收购完成后，必须整合、传播并执行集团程序、映射风险、实施网络安全战略以保护关键资产、管理第三方，并验证响应事件指令的存在，确保公司在遭受攻击时的韧性。


    ## 2.5.6. 治理与数据保护、网络安全


    ### 2.5.6.1. 内部数据


    为了优化数据收集、更新和存档工作，并确保分析至关重要的数据质量，必须定义数据治理：识别战略性和非战略性数据，收集业务和部门的需求，定义公司内部每项数据的角色和职责，以及更新规则（谁、何时、文档记录）和访问规则（写、读）。


    这是一个真正的项目，但如果公司成功，将节省大量时间和提高质量。这需要听取所有参与者的需求，理解他们并做出妥协，以便实现共享。


    如果要让所有参与者对他人产生的数据质量充满信心，高度的纪律和严格规则的应用是至关重要的。对于组织在孤岛中的公司来说，这是一个挑战，因为他们担心失去权力而不与他人共享数据，但如果数据生产者能够朝着共同目标采取行动，这就是创造价值的进步。


    如果在数据治理的基础上，加上网络安全资源的适当治理（涉及 IT 职能、运营经理以及财务、人力资源和法律职能）以及文化的转型，数字转型将获得成功。


    ### 2.5.6.2. 客户数据


    客户数据的收集可以通过多个渠道进行：通过销售团队的关系、商店和网站进行。所有这些数据的汇总本身就是一个课题，需要建立一个销售组织，使其能够通过不同渠道联系客户而不会让他们感到被骚扰，同时有必要确保所有客户都在一个公共数据库中。


    这里的问题不在于处理这种商业数据组织，而在于出于合规和伦理考虑确保此类数据的保护。这个问题将在后续章节中讨论。


    ### 2.5.6.3. 开放数据与个人数据保护


    行政机构产生或收集数据并必须使能够能够自由使用。同时，它们受到 `GDPR` 的约束。即使经过匿名化处理，数据有时也可以归因于某个人，例如通过交叉引用。


    这是一个极其敏感的话题，除了信息系统的保护外，还需要特定的数据处理和精确的控制，以避免不符合法律的处理。


    ### 2.5.6.4. 公共数据 – 严重的监视？


    许多城市和交通公司正在建立视频监控系统。“Smart cities` 收集数据以改善交通流量或能源消耗。


    目标通常是合法的（安全、降低成本），有时仅是商业性的（一家瑞士初创公司开发了适应路人特征的广告板）。涉及的是数据所有者的同意以及保护数据的能力：提供商是私人公司。监控公司和
    IT 服务提供商如何处理这些数据？它们存储在哪里？保留多久？谁有权访问？如何安全？产生了许多问题。这些数据的机密性、完整性和安全性由公共和私人领域共同。整个生态系统的质量极其重要。


    多伦多实施了许多传感器，并收集了运营所需的公共和私人数据，该城市的项目公司（一家 Google 系公司 `Sidewalk Labs`）可以识别身份并将数据用于商业目的。


    多伦多的居民对这些数据的使用有何保证？它们是如何被管理的、由谁管理以及为了什么目的？城市与服务提供者之间有何合同和财务联系？居民是否参与以及他们是否有发言权？这些都是城市的治理问题。


