    -   视频监控摄像头可以转换为僵尸网络，这是一种在所有者不知情的情况下被使用的机器网络，用于对公司实施拒绝服务攻击（通过同时发送成千上万次请求来耗尽公司的服务器）。


    联网设备的发展为网络犯罪分子提供了了日益增长的机遇，因为在面向大众的联网设备设计中，安全性并非首要考虑：它被视为一种成本，而用户并不愿意为更安全的设备支付更多费用。


    工业级联网设备构成了新的攻击面，因此也带来了新的安全风险，公司必须考虑这些因素。


    `Mirai` 恶意软件在该领域广为人知：受 `Mirai` 感染的设备会在互联网上搜索与联网设备对应的 IP 地址。一旦发现，它们就会被用于攻击目标，且目标很难发现这些攻击。


    联网设备的民主化可能会引发新的诈骗或破坏加密货币的新可能性。它还将引发新的监管：英国数字事务秘书玛玛戈特·詹姆斯（Margot James）于 2019 年
    5 月提出了一项应对网络攻击的法案。这项新法将要求所有连接到互联网的设备（如家用电器、摄像头或智能恒温器）在销售时必须带有唯一密码，而它们目前是带有硬编码的默认密码出售的。该法律还要求制造商提供公开的联系点，以便研究人员提交有关联网设备的漏洞报告。他们还必须告知消费者设备的安全更新时间。最后，这项法律将导致一种“设计安全”的新标签系统，确保产品从设计阶段就具有安全性。


    ![图 3.4. 安全漏洞，IoT 的显著特征（源：CESIN）](img/image113_c906.jpg)


    **图 3.4.** *安全漏洞，IoT 的显著特征（源：CESIN）*


    ### 联网玩具


    “对于儿童玩具、智能手表和机器人存在一系列问题，关于录制和传输数据，”欧洲消费者组织（BEUC）副总监乌苏拉·帕赫尔（Ursula Pachl）解释道。


    半径 15 米内的任何人都可以连接到‘Cayla’ 玩具，”报告解释道，“只需在手机上打开蓝牙并按下玩具名称即可通过远程播放任何音频文件。”


    这意味着家外的人将有能力连接、提取玩具内存中的数据并向其注入自己的信息，”乌苏拉·帕赫尔总结道。


    ### 语音助手


    数以百万计的人使用语音助手寻找音乐、开关灯或询问路线。


    根据 Bloomberg 2019 年 4 月 11 日的报告，[Amazon.com](http://Amazon.com)在全球范围内雇用了数百人来改进
    `Alexa` 语音助手。这些人听取来自家里或办公室的录音，并将其整合到软件中，以便理解不同语言的请求。员工签署了保密协议，Amazon 拥有相关程序确保系统不会偏离录音或在遇到特定情况（人员风险、犯罪等）时访问隐私信息（信用卡号、健康状况、政治或宗教观点等）。根据
    Amazon，员工无法识别他们听到的内容。但为什么这种助手已经商业化？


    集成这些语音助手的公司声誉可能会受到影响：`Orange` 的联网扬声器、`Qualcomm` 的耳机、`US Bank` 的银行服务以及 `Legrand`
    的开关。终端用户知情吗？在销售产品时，Amazon 的听取是否发生了？最终客户是否给予了并在并在注册时都得到了提醒？


    保密规则（用户与注册之间）是什么？


    客户是否被清楚告知可以拒绝听取？集成语音助手的公司是否有能力审计以确保 Amazon 不听取这些？


    关于数据目前的规则是什么？录音是否安全地传输到 Amazon，它们被存储在哪里（存储多久），还是被销毁？


    除了合规问题外，用户还会面临这些问题。Amazon 在营销演示和隐私政策中并未清楚说明录音会被其团队听取。


    用户可以禁用录制功能，但 Amazon 表示录音仍然可以被“手动”分析。这些录音在传输时带有所有者的姓名和设备序列号。


    ### 联网设备的安全措施


    个人或专业用户可以提供最低的安全保障：关闭不必要的端口并不惜避免默认密码、在设备启动时立即接受自动更新、避免未加密通信（联网设备的卖家应让用户注意这些问题）。加州是美国第一个采用联网设备法的州。


    这项法律将于 2020 年生效，要求任何联网设备制造商提供保护设备及其包含的信息免受未经授权的访问、破坏、使用、修改或披露的功能，适用于加州销售的所有设备。设备必须具有唯一密码，用户在首次登录时必须定义密码。不再有网络黑客轻易猜到的通用默认标识符。


    ## 3.13 保险


    保险开始针对网络风险的许多潜在危害提供应对：数据恢复成本、危机管理援助、形象修复援助、以及数据被黑客攻击者的企业责任索赔费用。


    ![图 3.5. 公司日益购买网络保险（源：CESIN）。有关此图的彩色版本，请查看 www.iste.co.uk/defreminville/cybersecurity.zip](img/image116_c2907.jpg)


    **图 3.5.** *公司日益购买网络保险（源：CESIN）。有关此图的彩色版本，请查看 [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


    这些风险的保险并不总是落实。被盗数据的价值评估复杂，保险单不会阻止攻击，而是介入处理网络攻击的财务和其他后果。


    因此，建议检查合同是否涵盖网络事件、信息系统和业务中断成本、了解事实的审计、被破坏部分的重建、对第三方的损害以及形象风险。


