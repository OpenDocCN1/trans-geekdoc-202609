    \ Security at UNIL (*université de Lausanne*) and Director of the Swiss Cyber\
    \ Security Advisory and Research Group;\n\n*   – Philippe Gaillard, Director of\
    \ Technical and Cyber-risks at Axa France;\n\n*   – Alain Robic, Partner Enterprise\
    \ Risks and Services at Deloitte – Information Systems Security.\n\nIn December\
    \ 2018, “Cybercrime and personal data protection: what good practices for the\
    \ board of directors and managers?”:\n\n*   – Isabelle Falque-Pierrotin, President\
    \ of the CNIL (*Commission nationale de l’informatique et des liberté*s) since\
    \ 2011, elected in 2017 in Hong Kong, President of the World Conference of Data\
    \ Protection and Privacy Commissioners;\n\n*   – Philippe Castagnac, President\
    \ of the Management Board of Mazars, an international, integrated and independent\
    \ organization specializing in audit, advice and accounting, tax and legal services;\n\
    \n*   – Annick Rimlinger, Executive Director of the CDSE (*Club des directeurs\
    \ de sécurité et sûreté des entreprises*), founding member of Cercle K2 and member\
    \ of the board of directors of Hack Academy;\n\n*   – Éliane Rouyer, independent\
    \ director, President of the Audit Committee and member of the Compensation Committee\
    \ of Legrand, independent director of Vigéo Eiris.\n\nI would like to thank all\
