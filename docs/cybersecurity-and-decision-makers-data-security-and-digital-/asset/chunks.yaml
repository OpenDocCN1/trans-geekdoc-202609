- raw: 'The DPO (Data Protection Officer), in charge of compliance, is the contact
    point for the authorities. This is mandatory for a company with 250 or more employees.
    This role does not necessarily correspond to a new position in the company. It
    can be entrusted to the IT or CIO manager, a legal manager or a qualified person
    outside the company.


    Responsible for internal compliance monitoring, advice on data protection obligations
    and the relationship with supervisory authorities and data subjects, the role
    of the DPO is complex and extensive.


    By conducting regular security audits and making recommendations to ensure compliance
    with regulations and best practices throughout the organization, the DPO also
    ensures that employees are informed of compliance requirements and that data processing
    personnel are trained and made aware of them.


    #### 4.5.7.2. *Compliance plan*


    This action plan corresponds to the implementation of data governance within the
    company:


    *   – Organization: who are the persons responsible for the collection, processing
    of data, access management, and protection and security?


    *   – Documentation: how are the purposes of the processing operations and the
    content of the operations documented?


    *   – Alignment of processes: what are the processes across the company?


    *   – Training/communication: who is responsible for the training? What is the
    training plan? When will the training take place?


    This action plan must be defined with the various managers of the company (the
    team will depend on the size of the company and its type of activity): the DPO,
    human resources, the sales and marketing department, the IT manager and the IT
    security manager.


    It is not enough to know the GDPR; it is essential to understand the environment,
    activities, data required for operations, as well as the legal constraints, IT
    systems and procedures of the company.


    It is also important to be able to communicate internally and externally and to
    be able to define and implement procedures relating, for example, to the right
    to forget or the right to data portability.


    Compliance with the GDPR requires the involvement of all company functions: IT,
    marketing, human resources and most other departments of the company.


    #### 4.5.7.3. *Produce/update the processing of personal data*


    The company, the DPO and its various functions/operations must verify and communicate
    the purpose for which they collect user data, the nature of the data (personal,
    sensitive, etc.) and the duration of their retention.


    Collection is increasingly digital and stored digitally. It can also be done by
    phone and then stored digitally.


    Once the data has been mapped, the location of the storage and the media, as well
    as the subcontractors involved, must be identified.


    #### 4.5.7.4. *Update websites/documents*


    Websites and applications must be updated with the new legal notices and an explicit
    management of consent with a reminder of the purpose of the processing operation,
    not to mention the option of opposition and unsubscription.


    #### 4.5.7.5. *Write to subcontractors and partners affected*


    The company must take care of the software publishers, data hosts and IT service
    providers with whom it works and ensure that the steps are taken in accordance
    with the law.


    One of the complexities of the DPO’s role, beyond compliance with the GDPR, is
    to assess the company’s compliance with its commitments.


    Indeed, it is one thing to ask customers to consent (or not) to the collection,
    storage and use of their personal data by the company or third parties with a
    clear purpose; it is another to check whether the company respects the customer’s
    wishes.


    For example:


    *   – if the customer refuses, does the DPO ensure that the company does not collect
    and store its data?


    *   – if the customer refuses third-party cookies, is the DPO able to ensure that
    third parties do not have access to the personal information of customers who
    connect to the company’s website?


    *   – if subsidiaries or suppliers (e.g. delivery companies) collect customer
    information, what happens to this information once the customer is served and
    delivered? Is access to this information secure? Do contracts with suppliers allow
    the company to audit the quality of the systems and procedures of its suppliers,
    partners or uncontrolled subsidiaries (if they are joint ventures)?


    Moreover, it is one thing to ask site or application publishers to comply with
    the GDPR and another thing to verify that third parties, such as advertising agencies,
    are well informed of the consent or refusal of customers and the respect of this
    response.


    ### **4.5.8. *Cookies***


    Cookies allow you to know which computer, tablet or smartphone is viewing which
    content on the Internet. Traces of website visitors, especially when combined
    with other information received by servers, can be used to create profiles of
    individuals and to identify them.


    Web browsing data can then be used to create high-performance targeted and/or
    personalized advertising and to establish profiles of consumers or professionals
    according to their areas of interest in order to offer them profiled commercial
    offers that are almost “tailor-made”.


    In accordance with the GDPR, profiling is not prohibited; it must only be the
    subject of prior information to the profiled person and a special mention of the
    right of objection (Article 21.2 GDPR). The Internet user must be clearly informed
    and have the opportunity to say no to the use of his/her data.


    Some “technical” cookies help to improve navigation on a website. Others allow
    website publishers to identify users and then send them advertising. Advertisers
    may also sometimes place cookies on the site. It is therefore essential for the
    company to monitor the activity of third parties (advertising boards and advertisers)
    who place themselves with or without the company’s agreement between the website
    and site visitors, to contractually formalize relations with site publishers and
    to include in these contracts the authorized links between site publishers and
    advertisers.


    Is the agreement of these visitors respected and are the company’s commitments
    to its customers respected? Tools (cookie trackers) are developed for the management
    of customer agreements and also for the activity of third parties, in order to
    verify that they are authorized by the company and the customer and that contractual
    relationships are adapted and respected, both financially and operationally.


    ## **4.6. Consequences for the company and the board of directors**


    It is essential for directors and officers to be aware of consumer trends and
    purchasing criteria. Indeed, according to the Internet Society and Consumers International
    study conducted in March 2019, among 6,381 people in France, the United Kingdom,
    the United States, Canada and Australia, consumers were concerned about their
    privacy and personal data in the face of the intrusion of these potential snitches
    that are multiplying within the home. Eighty-eight percent of the adults surveyed
    want governments to set up a “legal framework”, “dedicated to security and privacy
    for connected objects”. Sixty percent of them state that “the existence of a label
    or information specifying the guarantee of data security compliance has an influence
    on the purchasing act”. Seventy-three percent of French people “are afraid that
    their data will be used without their prior consent”.


    Eighty-three percent of the French respondents believe that manufacturers must
    guarantee data confidentiality and user safety by “exclusively offering” products
    that preserve these values. Manufacturers, at least some of them, have understood
    these concerns well.'
