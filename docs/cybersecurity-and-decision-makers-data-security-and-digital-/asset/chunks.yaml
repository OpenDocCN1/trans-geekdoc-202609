- raw: 'Fraud against the president represents 480 million euros per year in France.
    It consists of cybercriminals posing as managers of a company, usually by asking
    an accountant or treasurer to make a transfer abroad for a substantial amount
    (from 1 to 20 million depending on the size of the target company) for a very
    confidential and very urgent operation (acquisition of a company). Thanks to good
    information about the company, its organization, its processes and projects, by
    “playing” on the fear or ego of employees, during holiday periods, or during changes
    of managers, scammers manage to get operations done, which should normally not
    be authorized if the processes were followed.


    Pathé was the victim of a fraud of more than 19 million euros committed in March
    2018, intended for an alleged acquisition in Dubai. Thousands of companies were
    victims: KPMG in 2012 for €7.2 million, Airbus in Germany for €3 million, Michelin,
    Intermarché, Coca-Cola also, while a record €42 million was diverted at the beginning
    of the year to an Austrian aerospace equipment manufacturer called FACC.


    Insurance companies do not consider these frauds as cyber frauds, although there
    is often identity theft “false emails”; however, they are facilitated by digital
    means: an order transmitted by email, a telephone call reproducing the manager’s
    voice using a “vocoder”, and reduced controls by banks.


    ### **3.3.2. *Supplier fraud***


    Supplier fraud is quite simple: the fraudster contacts a company’s supplier, posing
    as the company’s accountant or auditor and asking him/her for information on invoices
    awaiting payment. The fraudster then contacts the company, posing as its supplier,
    and asks to change the bank account. He/she then notifies you of a change of bank
    account and sends the supplier’s letterhead invoices with the new account number
    and telephone details.


    Like fraud against the president, supplier fraud is facilitated by a dispersed
    organization, accounting that is remote from operations (outsourced shared services,
    sometimes in distant countries), the ability to mislead accounting teams with
    emails (identity theft), fake documents sent by email (they are no longer paper
    originals), a lack of training on procedures, traps to avoid and checks to perform.


    Accounting departments are often the last wheel of the carriage; the company tries
    to save, restructure, digitalize, but pay attention to the quality of the teams,
    their knowledge of the company’s partners and their understanding of the activities.


    Digitization must be accompanied by clear training and processes: counter-call
    to the supplier, identity verification (by telephone and email), verification
    with the bank, signature of a manager for validation of the new bank account,
    limitation of communication of information on the Internet and by email.


    Fraudsters are very imaginative and persistent and almost always exploit the human
    fault line.


    ### **3.3.3. *Other economic impacts***


    ![Figure 3.1. History: the greater impact of cyber-attacks on the business of
    targeted companies (source: CESIN). For a color version of this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image96_c2893.jpg)


    **Figure 3.1.** *History: the greater impact of cyber-attacks on the business
    of targeted companies (source: CESIN). For a color version of this figure, see
    [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


    Apart from fraud, companies also experience (source Accenture):


    *   – disclosures of confidential information (63%): loss of intellectual property,
    competitive advantage, customer data;


    *   – a negative impact on reputation (38%);


    *   – operating losses (30%);


    *   – direct financial losses (28%);


    *   – financial extortion with ransom (17%).


    In 2015, half a billion pieces of personal information were lost or stolen worldwide.


    The points of attack are multiplying: not only the networks of small and large
    companies but also our telephones, tablets, connected objects, fitness bracelets
    and refrigerators to automated metro trains are all targets.


    Cybercrime costs $445 million a year, while natural disasters have represented
    “only” $160 million in damage on average over the past 10 years worldwide.


    The financial and reputational consequences for companies therefore concern:


    *   – financial assets – through fraud, theft and extortion: “president’s fraud”,
    which evolves through artificial intelligence (recent example of identity theft
    through voice reproduction), fraudulent change of supplier account;


    *   – intellectual property and trade secrets – through spying;


    *   – the brand and its presence on the Internet – through boycott, defamation
    and damage to the image (modification of the website);


    *   – business continuity – through sabotage or disruption of operations (website
    and customer services, production);


    *   – theft and illegal processing of personal data;


    *   – the disclosure of confidential information (internal instructions, strategic
    data, mergers and acquisitions, etc.);


    *   – the ransoms;


    *   – data integrity;


    *   – the costs of investigation in the event of an attack and disputes initiated
    by customers, employees, shareholders or partners and defense costs;


    *   – reputation: more than three-quarters of customers have little or no confidence
    in the companies and suppliers that process and manage their personal data. Ethics,
    in its legal and societal components, must therefore be considered as a strategic
    asset for companies.


    ## **3.4. Legal risks**


    ### **3.4.1. *Class actions***


    In June 2017, Anthem, Inc. one of the largest US healthcare companies, agreed
    to pay a record $115 million to settle class actions following a data breach involving
    the personal information of nearly 80 million customers in 2015.


    There have been a number of other important data breach regulations in recent
    years. In 2016 and 2017, Home Depot settled the class actions based on the violation
    for $19.5 million. Similarly, in 2015 and 2016, Target paid $105 million to settle
    data breach class actions.


    In 2014, a Morrisons senior internal auditor downloaded a file containing nearly
    100,000 personal data of Morrisons employees, including names, addresses, dates
    of birth, telephone numbers, bank account numbers and salaries. The court found
    the company liable, even though it had cybersecurity controls, and the offense
    was caused by an employee acting on his/her own initiative. In British labor law,
    vicarious liability refers to the liability of the employer for the actions of
    its employee.


    On October 8, 2018, a shareholder filed a security class action against the Chinese
    group Huazhu. This legal action, linked to a data breach, has a number of interesting
    features. Huazhu operates hotels in China. Its shares are listed on the Nasdaq.
    On August 28, 2018, Shanghai police issued a statement on social media stating
    that they had been alerted to a possible data breach in the company. According
    to media reports, “nearly 500 million pieces of information from the group had
    been published in an online message”: 123 million pieces of registration data
    on the official Huazhu website, such as name, mobile number, identity number and
    connection ID code; 240 million pieces of hotel stay data, such as name, credit
    card number, mobile phone number, arrival and departure times, consumption amount
    and room number. In its statement of September 17, the company added that “the
    police arrested the suspects who posted the reported message on a dark web forum
    in order to sell certain data”. The attempted sale was unsuccessful.


    On October 8, 2018, a shareholder of Huazhu filed a class action in the Central
    District of California against Huazhu and the company’s chief executive officer.
    The complaint alleges that the company’s share price decreased by more than 12%
    during the five trading days following the announcement of the customer data leak.'
