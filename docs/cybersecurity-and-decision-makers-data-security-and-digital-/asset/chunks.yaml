- raw: "The question is not “when will we be attacked?” but “what can we do to protect\
    \ the company as much as possible, what can we do in the event of an attack, what\
    \ can we do to restore systems as quickly as possible?”\n\nCyber-risk is an integral\
    \ part of companies and also of personal organizations (everyone is concerned\
    \ individually and as a member of an organization). It is not just a technical\
    \ risk.\n\nPeople are the weakest (and strongest) link in the entire safety chain.\n\
    \nThis book does not deal with tools (hardware, software, servers, architecture),\
    \ but with organizations, processes and behaviors, without which the company cannot\
    \ improve its performance, security, incident or crisis management, and resilience.\n\
    \nIt is about companies exercising their digital responsibility and maintaining\
    \ or improving the trust of their stakeholders: customers, suppliers, partners\
    \ and investors.\n\nOnly 30 years ago, I experienced the arrival of personal computers\
    \ (computers and word processing existed, but were not deployed in companies),\
    \ the digitization of financial operations (accounting, cost accounting, banking\
    \ relations and cash management, tax returns, reporting tools, accounting and\
    \ management consolidation, financial relations with customers and suppliers),\
