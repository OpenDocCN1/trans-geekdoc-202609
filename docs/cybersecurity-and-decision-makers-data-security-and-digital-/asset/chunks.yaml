    The question is not “when will we be attacked?” but “what can we do to protect
    the company as much as possible, what can we do in the event of an attack, what
    can we do to restore systems as quickly as possible?”


    Cyber-risk is an integral part of companies and also of personal organizations
    (everyone is concerned individually and as a member of an organization). It is
    not just a technical risk.


    People are the weakest (and strongest) link in the entire safety chain.


    This book does not deal with tools (hardware, software, servers, architecture),
    but with organizations, processes and behaviors, without which the company cannot
    improve its performance, security, incident or crisis management, and resilience.


    It is about companies exercising their digital responsibility and maintaining
    or improving the trust of their stakeholders: customers, suppliers, partners and
    investors.


    Only 30 years ago, I experienced the arrival of personal computers (computers
    and word processing existed, but were not deployed in companies), the digitization
    of financial operations (accounting, cost accounting, banking relations and cash
    management, tax returns, reporting tools, accounting and management consolidation,
    financial relations with customers and suppliers), as well as the digitization
    of human resources management (payroll, social declarations, recruitment, training),
    internal and external communication, particularly with the arrival of social networks,
    production (connected factories and extended companies), marketing and sales of
    course, and logistics.


    All company functions are now concerned, as well as the relations with all stakeholders:
    customers, suppliers, service providers, subcontractors, shareholders (individual
    investors, investment funds), board of directors, auditors, employees, subsidiaries,
    proxy advisers (governance advisers who publicly comment on the proposals made
    by companies for their general meetings).


    Companies are completely digitalized: their data, operations, accounts, processes
    are intangible; their internal and external communications, their products are
    connected.


    Organizations and work habits have changed, skills have evolved, tools have been
    transformed, the classification of documents and people has sometimes (often?)
    fallen into oblivion.


    Companies have been able to internationalize, thanks to the ultra-fast means of
    communication. We talk to the company across the street as well as to those in
    the United States or China: only the time difference is incompressible.


    Companies share their data with their customers, suppliers, employees, shareholders,
    subsidiaries, etc. The digital environment provides companies with opportunities
    to create new businesses, new products and services and new customers, in order
    to optimize their organizations, reduce their costs, improve their internal and
    external processes, with their suppliers, service providers, subcontractors, investors,
    customers, depending on the business sector in which they operate.


    Companies are judged on their financial performance: their accounts, their results,
    their balance sheet, their cash position, their share price, their growth and
    earnings potential, their non-financial performance (their governance and their
    social and environmental performance), but…


    What about their cyber performance? Data governance, data security: integrity,
    confidentiality and accessibility, protection of the personal data they collect,
    use and archive, protection of computer systems that allow the exchange, storage
    and modification of these data.


    A company may be financially successful, but a failure of its IT system or digital
    security can seriously affect its ability to sell or produce, to pay its suppliers,
    to exchange with its subcontractors and thus degrade its financial results, its
    reputation and the confidence of shareholders and stakeholders.


    Cyber-risks are not the prerogative of a handful of specialists in the company
    but affect overall governance. In addition to the regulatory obligations regarding
    data security, it is a matter of protecting the company against the risk of loss
    of value, linked, for example, to the dissemination of confidential information.


    “All connected, all committed, all responsible” is the slogan communicated by
    Guillaume Poupard, ANSSI‘s Director General at FIC 2019[¹], from top to bottom
    and from bottom to top of private or public organizations: the board of directors,
    the executive committee and all the teams.


    The trade war between major powers is more media-intensive than cyberwarfare,
    which is a weapon widely used by States, terrorist and criminal organizations,
    or corporations (spying). In addition, data collection is at the heart of the
    digital economy of the 21st Century, built around data valorization. This economy
    is currently dominated by the American and Chinese Internet giants. Finally, cybercriminals
    exploit the many vulnerabilities of digital tools, the human vulnerabilities generated
    by organizations that have not adapted, processes that have not been updated and
    collaborators that have not been trained.


    There are cyberdeaths among the victims. Cyber-silence is a barrier to awareness.
    Finally, there are too many executives and directors burying their heads in the
    sand.


    1. 11th edition of the International Cybersecurity Forum (FIC).


    # 1 An Increasingly Vulnerable World


    ## 1.1 The context


    ### 1.1.1 Technological disruptions and globalization


    Technological disruptions are mostly digital in nature: automated knowledge, networks
    of connected objects, advanced robotics, 3D printing, cloud computing (85% of
    companies store data in a cloud; this practice is becoming more commonplace),
    mobile Internet, autonomous vehicles.


    Until 2011, digital risks, or cyber-risks, did not appear in the World Economic
    Forum’s major risk ranking.


    According to the 2019 World Economic Forum study, technology will play a fundamental
    role in the risk landscape over the next decade, including data theft (personal
    data, data from companies, public organizations and governments), identity theft
    and cyber-attacks, as well as deadly “bugs”, as shown by the Boeing 737 MAX crashes.
    According to the *Washington Post*, several flaws were discovered in the software
    of the aircraft’s flight system. The preliminary investigation report on the Ethiopian
    Airlines crash clearly blames this accident on a failure of the `MCAS` stall protection
    system, which had already been identified in the Lion Air accident five months
    earlier. Not only was the information sent by the probes incorrect, but it was
    not possible for the pilots to take control of the aircraft.


    This accident shows the risks of technological or digital failures, as well as
    the need to have them tested and certified by independent authorities. It also
    shows that digital accidents are not necessarily the result of attacks, but of
    human failures (programming, man–machine link, processes, organization): tools
    often have “good backs”.


    Cyberspace consists of computer equipment (computers, networks, connected objects,
    servers, printers, routers, etc.), software, applications, information systems
    and all information exchanged or stored via digital tools. It is the development
    of connections and flows that make security issues major issues, whether for States,
    companies or citizens.


    ![Figure 1.1. The impact of digital transformation on the security of information
    systems in all companies (source: according to CESIN). For a color version of
    this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image24_c2956.jpg)


    **Figure 1.1.** *The impact of digital transformation on the security of information
    systems in all companies (source: according to CESIN). For a color version of
    this figure, see [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*

