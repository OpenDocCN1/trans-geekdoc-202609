    that the company did not have adequate security measures to protect customer information,
    that it would be exposed to an increased risk of litigation and higher costs.
    The information provided by the company to shareholders about the company’s activities,
    operations and prospects was substantially false or even misleading. The number
    of class actions is certainly likely to increase in the future.


    ### **3.4.2. *Sanctions by the CNIL and the ICO***


    With the introduction of the GDPR in May 2018, 2018 was a record year, particularly
    in terms of the number of complaints (+32%). The CNIL (*Commission nationale de
    l*’*informatique et des libertés*) is “clearly identified as a source of reference
    information for professionals and the general public”.


    A third of the 11,077 complaints lodged concerned data published on the Internet,
    21% concerned prospecting, followed by human resources and banks. We can also
    mention the remote viewing of images from video devices, in particular by the
    employer, pointing to a risk of excessive surveillance of employees, the installation
    of cameras in care units, thus filming people vulnerable for their “security”,
    the desire of customers of banks or online content services to use their right
    to the portability of their data, the security of their personal data, and not
    only on the Internet, fears about the data to which mobile applications can have
    access in a smartphone. Approximately 20% of complaints are now the subject of
    European cooperation.


    The CNIL carried out 310 inspections in 2018. In the majority of cases, its intervention
    resulted in compliance by the organization: 10 financial penalties (nine public
    and seven concerning breaches of personal data security) and one non-public warning
    were issued in 2018.


    British Airways announced on July 8, 2019, that it was expected to pay a fine
    of £183 million (€204 million) to the UK’s Information Commissioner’s Office (ICO)
    following the theft in 2018 of hundreds of thousands of customers’ data, including
    their name, address and credit card data, including number, expiry date and three-digit
    security code.


    The ICO estimated that about 500,000 customers had seen their data “computed”
    and attributed it to “poor security systems in the company”. “People’s personal
    data must remain so”, said ICO Commissioner Elizabeth Denham.


    “When you are given personal data, you must protect it. Those who do not will
    be prosecuted by the ICO to verify that they have taken the appropriate measures”,
    she said.


    The amount of the fine imposed by the ICO represents 1.5% of British Airways’
    annual turnover in 2017.


    The method used by the attackers allows the data to be sucked up by injecting
    computer code into the site’s reservation pages. This code records mouse movements
    and clicks on payment pages, allowing hackers to reconstruct the information entered
    by users.


    ## **3.5. The objectives of risk mapping**


    The main objective is to take appropriate measures to ensure the company’s sustainability
    and therefore its performance.


    Risk mapping must be based on the company’s strategic objectives. It must primarily
    focus on critical systems, information and processes.


    As we have already seen, the company is vulnerable, because connected to its environment,
    there is no such thing as zero risk, and the aim is not to transform the company
    into a fortified castle with several levels of ramparts.


    The security system has three objectives:


    *   – data security: data protection, data archiving (digital and paper), individual
    and/or shared archiving, file (in emails or folders) and email classification,
    backups (frequency, quality, integrity), retention period and company rules to
    be respected;


    *   – confidentiality: the identification of confidential data, the choice of
    appropriate communication or sharing methods (email, meeting, paper, SMS, social
    networks) according to the subjects and the level of confidentiality or legal
    risk (in the event of a procedure, emails leave traces \[too much writing\]);


    *   – integrity: the management of access rights (reading, input, administration)
    and the documentation that justifies the quality of the data.


    ## **3.6. The different methods of risk analysis**


    Different methods of risk analysis on the information system exist: the important
    thing is to appropriate a method, adapt it to the company, involve the different
    functions and/or operations of the company and ensure that it does not become
    a routine. The aim is not to follow the method, the aim is to make it a tool for
    exchanging information, identifying major risks and making decisions to remedy
    these risks, clarify responsibilities (who is in charge of what and when) and
    transfer certain risks to insurance, according to the conditions proposed by insurance
    companies.


    In England, CRAMM is a risk analysis method developed by the British government
    organization CCTA (Central Communication and Telecommunication Agency). This is
    the risk analysis method preferred by the British government, but it is also used
    by many other countries.


    In its document “*Norme minimale pour améliorer sa résilience informatique*” (“Minimum
    Standard to Improve IT Resilience”), the DEFR (*Département fédéral de l’économie,
    de la formation et de la recherche de la confédération suisse*) distinguishes
    between industrial control systems (ICSs) and information and communication technologies
    (ICTs) and recommends the application of international standards (ISO, COBIT),
    as well as the NIST (National Institute of Standards and Technology) framework,
    consisting of:


    *   – identify;


    *   – protect;


    *   – detect;


    *   – react;


    *   – recover.


    The United States uses OCTAVE (Operationally Critical Threat, Asset, and Vulnerability
    Evaluation), developed by Carnegie Mellon University.


    Internationally, ISO/IEC 27005 is used, which is an international standard that
    meets the requirements of the ISO/IEC 27001 certification step by step. It is
    the most recent standard and is easily applicable because it is pragmatic.


    In France, the EBIOS method (expression of needs and identification of security
    objectives) developed by the *Agence nationale de la sécurité des systèmes d*’*information*
    (ANSSI) is most often used. This method can be used to map the risks of the company
    and its ecosystem, as well as to manage the risks of an IT project, or of a product
    or service developed by the company.


    This method has several advantages: it is pragmatic and operational, it involves
    the business lines, it gives working groups the opportunity to inventory the IT
    systems used, to imagine where threats can come from, to describe the feared events,
    to define a plan of measures for the risks identified by the business lines, the
    IT department and the IT security department, starting with the most likely (inaccessible
    data, websites, courier services, production stoppages, fraud). The synthesis
    will be presented to the executive management so that it can understand, arbitrate,
    prioritize and possibly release resources (human and financial) for the implementation
    of the proposed strategy.


    All these methods must be adapted to the sector and size of the company. It is
    important, whatever the company, public organization, association or foundation,
    to adopt this method and to have the various actors in the company regularly assess
    the IT risks that could hinder the availability, integrity or confidentiality
    of the systems.


    It is also essential that this risk management work does not become routine, updating
    what was done six months or a year ago, without challenging the risk hierarchy,
    threats and scenarios. It is therefore necessary to modify the composition of
    the teams, by keeping a few people who will be able to recall the reasoning made
    during previous analyses, and by including internal or external people, who will
    have a new eye, a critical look and a new vision of the issues.'
