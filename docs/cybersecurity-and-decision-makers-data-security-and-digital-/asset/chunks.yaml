- raw: 'The problem is serious and increasingly complex: with the development of outpatient
    and home-based hospitals, institutions are increasingly connected.


    Appropriate tools, such as anonymization and blockchain, regular security audits
    (physical and IT), training of medical personnel, appropriate processes, a budget
    for data protection and system security are necessary for the compliance of the
    GDPR by the entire health sector.


    ## **4.5. The General Data Protection Regulation (GDPR)**


    The General Data Protection Regulation (GDPR) unifies existing data protection
    regulations in EU countries under a single law, introducing guidelines on how
    companies will have to manage personally identifiable information.


    The GDPR has several objectives:


    *   – strengthen the rights of individuals, in particular by improving transparency
    on the use of their data, the possibility of giving their consent or not to the
    use of their data and the creation of a right to the portability of personal data;


    *   – make accountable the employees processing the personal data (data controllers
    and subcontractors);


    *   – develop cooperation between data protection authorities, which may in particular
    adopt joint decisions (in particular on sanctions) when data processing operations
    are transnational.


    The GDPR, as explained below, therefore allows the consumer to become aware of
    the use of his or her personal data, to give consent or to refuse to allow his
    or her data to be used for a particular purpose.


    Companies must ensure that they have appropriate security solutions, procedures
    and policies in place, at the risk of incurring severe penalties for non-compliance,
    up to €20 million or, in the case of a company, 4% of the previous year’s total
    worldwide turnover (whichever is higher).


    The amount of the fines will vary according to the nature, gravity and duration
    of the violation and taking into account the scope or purpose of the processing
    operation concerned, as well as the number of persons affected and the level of
    damage they have suffered. The degree of responsibility of the controller or processor
    is also taken into account, as well as the various technical and organizational
    measures already in place to ensure the company’s compliance.


    The GDPR introduces the notion of the responsibility of economic actors at the
    highest level of the company and its organization, in data governance, IT risk
    management and the prevention of massive data leaks.


    For companies, it is a question of compliance, a financial issue (fine, loss of
    customers) and a question of digital trust (reputation damaged in the event of
    a data leak).


    ### **4.5.1. *The foundations***


    The foundations are as follows:


    *   – the strengthening of individuals’ rights: it requires the collection and
    retention of consent to the processing of personal data;


    *   – the obligation to inform: it requires structures that are victims of hacking
    of personal data to inform the CNIL and the data subjects whose information has
    been stolen within 72 hours;


    *   – heavy sanctions: it sets up dissuasive sanctions, up to €20 million or 4%
    of an organization’s worldwide turnover. The higher amount is the one retained;


    *   – the principle of minimization of the data collected: it requires only the
    information strictly necessary for the purposes for which it is processed to be
    collected;


    *   – the right of data portability: persons whose information has been collected
    have the right to request to receive personal data concerning them;


    *   – the data register: it obliges organizations to track all personal data processing
    operations carried out within the organization.


    ### **4.5.2. *Definition of personal data***


    Different categories of data need to be distinguished:


    *   – personal data: name, first name, email, telephone, pseudonym, IP address,
    fingerprints;


    *   – financial data: GNI, salary, transactions, consumption patterns, opinion,
    policy or union data;


    *   – health-related data: medical records, sick leave, care, weight, sports activity,
    eating habits, etc.;


    *   – data relating to computer habits: Internet browsing, social networks, interests,
    contacts, photos, etc.;


    *   – context data: geolocation, movements, Wi-Fi connections.


    ### **4.5.3. *The so-called “sensitive” data***


    Sensitive data require enhanced measures that are required under the GDPR (impact
    analysis, enhanced information, consent gathering, etc.). This is the information:


    *   – revealing alleged racial or ethnic origin;


    *   – relating to political, philosophical or religious opinions;


    *   – relating to trade union membership;


    *   – concerning health or sexual orientation;


    *   – genetic or biometric;


    *   – data on offenses or criminal convictions.


    ![Figure 4.1. Complying with the GDPR (source: Starboard Advisory). For a color
    version of this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image133_c2961.jpg)


    **Figure 4.1.** *Complying with the GDPR (source: Starboard Advisory). For a color
    version of this figure, see [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


    ### 4.5.4. *The principles of the GDPR*


    #### 4.5.4.1. *Transparency*


    The company must therefore be precisely aware of the uses it has of the data because
    it must be transparent by reworking, in particular, its communication and be able
    to respond to people’s requests for rights.


    #### 4.5.4.2. *Minimization*


    The company must ensure that the data collection does not go beyond what is strictly
    necessary for the purpose set for your use. Any data not useful for processing
    and not justified should therefore not be collected (or deleted if already recovered).


    #### 4.5.4.3. *Data security*


    It is necessary to strengthen the means to ensure proper data protection through
    technical and organizational measures.


    It is mandatory to structure the data security process as soon as a new processing
    operation is designed.


    In the event of a leak of personal data likely to create a risk for rights and
    freedoms, you must notify this violation to the ICO within 72 hours.


    #### 4.5.4.4. *Accountability*


    The company must demonstrate that it is aware of the requirements of the new regulations
    and that it has:


    *   – sensitized its employees;


    *   – initiated a voluntary compliance process;


    *   – implemented the duties and obligations for data processing and in particular
    high-risk processing;


    *   – established a time-bound action plan to achieve full compliance.


    ### 4.5.5. *The five actions to be in compliance with the GDPR*


    Compliance with the GDPR is achieved through:


    *   – mapping company data: knowing what data is collected, where the data is
    processed and stored;


    *   – data protection: restrict access to authorized users for legitimate tasks;


    *   – access control, which is the essential corollary of the previous point;


    *   – logging of operations, in order to be able to prove good faith;


    *   – data destruction: destroyed data is data that cannot be stolen from you.


    ### **4.5.6. *The processing register***


    As the cornerstone of compliance (starting point, monitoring tool, or even proof
    of compliance on certain aspects), the register may be required by customers and
    supervisory authorities.


    The questions to be answered by the processing register are as follows:


    *   – Why: what is the purpose of the processing?


    *   – Who: who is responsible for the processing?


    *   – What: which data are concerned and who are concerned?


    *   – Where: where are the data hosted?


    *   – How long: until when are the data stored?


    *   – How: how is the data stored, and what are the security measures?


    ### **4.5.7. *The five actions to be carried out***


    #### 4.5.7.1. *Appointment of a DPO*'
