- raw: 'The company must therefore first govern its data: what data is collected,
    by whom, why, where it is stored, by whom?


    How is the data classified, how confidential is it, who has access to it, who
    can modify it, who manages authorizations?


    Data security therefore depends first and foremost on good data governance: who
    is responsible in the company, what are the rules, are the rules known and applied?


    #### 1.4.4.2. *Some examples of famous attacks*


    *The first attack: Wannacry*


    It struck in May and June 2017; it is a *ransomware* that has paralyzed hundreds
    of thousands of computers around the world, affecting the British healthcare system,
    German railways or Renault factories.


    The attack is global. In more than 100 countries, a virus blocked computers until
    a ransom of $300–600 was paid in bitcoins. Fifty British hospitals (National Health
    Service) were partially paralyzed, telecommunications companies (Vodafone, Telefonica),
    the Romanian intelligence services, Renault and its assembly lines, the factories
    of the Honda automobile group in Japan, to name but a few.


    In Germany, Deutsche Bahn was reached: on the screens displaying train timetables
    in German stations, the ransom request message was displayed.


    The Wannacry virus made a lot of noise, had spectacular impacts, but did not allow
    the attackers to recover millions (30,000 dollars would have been recovered in
    France), mainly because of a poorly built payment system.


    On the other hand, the costs to companies for restarting systems, replacing computers,
    hiring IT security experts and securing information systems to avoid becoming
    a victim again are much higher. Consolidated information is not available. In
    England, the estimated cost to hospitals is estimated at £90 million.


    *The second attack: NotPetya*


    This is an attack of destruction, sabotage. This malware deleted the files from
    the computers it was visiting, posing as *ransomware*. The main known French victim
    is Saint-Gobain, whose loss of earnings is estimated at 250 million euros. Its
    annual report indicates an impact of 80 million on operating income; the impact
    on non-recurring income is not quantified.


    “The year was also marked by the cyber-attack of 27 June, to which the group was
    able to react very quickly to restore normal operational activities but also to
    strengthen its defenses. The impact on operating income for 2017 is estimated
    at €80 million:


    > Overall, about half of the effects of the cyber-attack were spread over building
    distribution and the rest in industrial centers, particularly construction products;
    geographically, it was the countries of Western Europe that were most affected,
    with the Nordic countries, Germany and France being the most affected” (Saint-Gobain
    2017).


    “The NotPetya virus has contaminated computers via Ukrainian tax administration
    software to which companies must connect”, says Claude Imauven, number 2 of the
    French group, interviewed by *L’Usine nouvelle* on February 9, 2018. In a few
    minutes, thousands of data were encrypted and impossible to recover. Computerized
    ordering and invoicing systems were blocked. The group’s distribution networks,
    Point P and Lapeyre, had to return to pen and paper to write purchase orders and
    transmit them manually. It took four days of crisis management and 10 days for
    the business to fully resume.


    According to Claude Imauven: “Learning to work in a degraded mode so as not to
    break continuity is the most central aspect of good risk management”. This involves
    prioritizing the criticality of the various assets and taking preventive actions,
    identifying the various fallback solutions and mobilizing the various teams internally.


    Phishing operations, intrusion tests … Today, the company regularly organizes
    full-scale tests to make employees aware of the various threats. In addition,
    Saint-Gobain now requires suppliers, who directly connect to the group’s system,
    to be cybervirtuous “a *sine qua non* condition for us today”, says the CEO.


    At the same time, the company that was not covered against this type of risk at
    the time of the event undertook to insure itself against cyber-attacks.


    *Altran in France and Hydro in Norway*


    The technology consulting group Altran is forced to take a significant step back
    following the computer hacking of which it was the victim on January 23, 2019.
    This slow period can be very expensive for the group, especially in terms of image.


    An Altran spokesman said that the company had been hit by a ransom, which is why
    it had to disconnect its computer network and all its applications “immediately”
    to prevent a spread. Altran is in contact with ANSSI, the French government information
    systems security agency:


    > We have mobilized independent, internationally recognized technical and investigative
    experts, and the investigation we conducted with them has revealed no data theft
    or cases of propagation of the incident to our customers.


    In particular, Altran carries out R&D (research and development) missions for
    major energy and transport groups, including Airbus. An attack on the company
    could therefore be aimed at gaining access to its customers’ trade secrets.


    In an interview with *Le Parisien*, Guillaume Poupard reports attacks “by State,
    private or terrorist actors who do not yet aim to destroy, but to set up and above
    all to study computer systems” in the three major sectors of energy, telecommunications
    and transport.


    *Le Monde informatique* also indicates that, despite these recommendations, Altran
    has paid more than 300 bitcoins, or nearly 1 million euros, to receive the decryption
    key for the files. By the end of February, it had not been delivered, according
    to *L’Express*, which also quotes a financial analyst who estimates that the cost
    of the attack on Altran would already amount to 20 million euros.


    It was this same ransom, LockerGoga, encrypting computer files and demanding money
    to make them available again, that partially paralyzed Norway’s third largest
    hydropower producer and one of the world’s largest aluminum producers, Norsk Hydro,
    on March 18, 2019. The attack was detected after abnormal activity on its servers
    around midnight. This cyber-attack intensified overnight, targeting the IT systems
    of most of the group’s activities.


    Isolated from the main grid, this being a good practice for critical installations,
    electricity production has not been affected. As a result of the attack, Hydro’s
    website is inaccessible; Hydro communicates via its Facebook page.


    Several extrusion plants, which transform aluminum ingots into metal parts for,
    for example, car manufacturers or the construction sector, have been closed, while
    its giant foundries in several countries such as Norway, Qatar and Brazil have
    switched to manual operation.


    Quoting a message from the NSM, the Norwegian public broadcaster NRK reports on
    its website that pirates have demanded money from Norsk Hydro to stop their attack,
    which the group has not confirmed. We will return in detail to the crisis management
    implemented by Hydro in [Chapter 6](#c06.xhtml#head6).


    ## **1.5. Examples of particularly exposed sectors of activity**


    ### **1.5.1. *Cinema***


    In November 2014, when Sony Pictures Entertainment employees turned on their computers,
    a skeleton image appeared, accompanied by a message of blackmail: the objective
    was to prevent the screening of the film *The Interview*. The pirates then broadcast
    four films that were to be released in the following months. The total loss for
    Sony amounted to more than 200 million dollars.


    In addition, the personal data of Sony Pictures Entertainment employees were stolen
    by the hackers: name, address, social security number, driver’s license number,
    passport number and/or other national identifier, bank account number, credit
    card information for business travel expenses, user name and passwords, remuneration
    and other employment related information, as well as medical data.'
