  trans: '


    针对总裁的诈骗在法国每年造成的损失达 4.8 亿欧元。这种诈骗包括网络犯罪分子伪装成公司经理，通常要求会计师或财务人员向境外转账大笔资金（根据目标公司的规模，金额从
    100 万到 2000 万欧元不等），用于一项非常机密且紧急的操作（如公司收购）。得益于对公司及其组织架构、流程和项目的充分了解，通过“利用”员工的恐惧或自尊心、在假期期间或管理层变动期间，诈骗者成功实施了这些在按照流程操作时本不应被批准的交易。


    Pathé 集团在 2018 年 3 月遭受了一场超过 1900 万欧元的诈骗，目的是在迪拜进行一项虚假收购。数千家公司都是受害者：KPMG 在 2012
    年损失了 720 万欧元；空中客在德国损失了 300 万欧元；米其林、Intermarché 和可口可乐也中了手；而在年初，创纪录的 4200 万欧元被转入了一家名为
    FACC 的奥地利航空设备制造商手中。


    保险公司并不将此类诈骗视为网络诈骗，尽管经常存在身份盗取的“虚假邮件”；然而，这些诈骗是通过数字手段辅助实施的：通过电子邮件传输的订单、使用“声码器”模拟经理声音的电话，以及银行监控的削弱。


    ### 3.3.2. 供应商诈骗


    供应商诈骗非常简单：诈骗者联系公司的供应商，伪装成公司的会计或审计师，向其索取待付款发票的信息。然后，诈骗者联系公司，伪装成其供应商并要求更改银行账户。接着他/她会通知你银行账户变更，并发送带有新账户号码和电话详情的供应商抬头信发票。


    与针对总裁的诈骗一样，供应商诈骗也受到组织松散、财务与业务脱节（外包共享服务，有时甚至在遥远的国家）、能够通过电子邮件误导财务团队的能力（身份盗取）、通过电子邮件发送虚假文件（已不再是纸质原件）、以及对程序、规避陷阱和执行检查缺乏培训的影响。


    财务部门往往是链条的最后一环；公司试图节约、重组、数字化，但必须关注团队质量、他们对公司合作伙伴的了解以及对业务的理解。


    数字化必须伴清晰的培训和流程：向供应商进行回电、身份验证（通过电话和电子邮件）、与银行核实、由经理签名确认新银行账户、限制在互联网和电子邮件上传播信息。


    诈骗者极具想象力且执着不扣，几乎总是利用人性的弱点。


    ### 3.3.3. 其他经济影响


    ![图图 3.1. 历史：网络攻击对目标公司业务的影响增大（来源：CESIN）。有关此图的彩色版本，见 www.iste.co.uk/defreminville/cybersecurity.zip](img/image96_c2893.jpg)


    **图 3.1.** 历史：网络攻击对目标公司业务的影响增大（来源：CESIN）。有关此图的彩色版本，请访问 `www.iste.co.uk/defreminville/cybersecurity.zip`


    除了诈骗，公司还会经历（来源：埃森哲）：


    * 机密信息泄露（63%）：知识产权、竞争优势、客户数据的损失；

    * 声誉的负面影响（38%）；

    * 运营损失（30%）；

    * 直接财务损失（28%）；

    * 勒索赎金的财务（17%）。


    2015 年，数半的信息被泄露或被盗。


    网络攻击涉及的不仅是大型公司网络，还有 80 亿条信息。


    网络犯罪每年产生 4450 万欧元的损失，而在过去 10 年中，电信诈骗造成的损失高达 1.6 亿欧元。


    诈骗对公司的财务后果（在全球范围内平均）涉及：


    * 财务资产：通过诈骗、身份盗取和勒索；

    * 知识产权和商业秘密：通过间谍；

    * 品牌和形象：通过破坏网站、诽谤；

    * 业务连续性：通过破坏和运营服务；

    * 个人数据：通过非法处理；

    * 机密信息泄露：通过并购收购等；

    * 赎金；

    * 数据完整性；

    * 声誉：通过攻击引发客户、股东或合作伙伴的诉纷；

    * 法律成本：通过调查和防御。


    因此必须被视为公司的战略资产。


    ## 3.4. 法律风险


    ### 3.4.1. 集体诉讼


    2017 年 6 月，美国最大的医疗保健公司之一 Anthem 同意支付 1.15 亿美元解决集体诉讼，该次数据泄露涉及 8000 万名用户的个人信息。


    近年来出现了许多其他重要的数据泄露监管。2016 年至 2017 年，家得宝就违规行为支付了 1950 万美元。同样，Target 在 2015 年和 2016
    年支付了 1.05 亿美元解决集体诉讼。


    2014 年，Morrisons 的一名高级审计师下载了包含近 10 万份员工数据的文件，包括姓名、地址、出生日期、电话号码和银行账户。尽管公司采取了网络安全控制，法院仍判定其承担责任，因为这是由员工自发行为造成的。在英国劳动法中，替代责任是指雇主对其员工行为所承担的责任。


    2018 年 10 月 8 日，华住的一名股东在加利福尼亚州中央区对华住发起了证券集体诉讼。该诉讼与数据泄露有关，具有许多有趣的特征。华住在中国经营酒店，其股票在纳斯达克上市。2018
    年 8 月 28 日，上海警方在社交媒体上发布声明，称他们接到了有关该公司可能发生数据泄露的报警。根据媒体报道，“近 5 亿条信息被发布在一个黑网论坛的消息中以待出售”：1.23
    亿条华住官方网站的注册数据，如姓名、手机号、身份证号和连接 ID；24 亿条酒店入住数据，如姓名、信用卡号、手机号、入住离店时间、消费金额和房间号。出售尝试未成功。


