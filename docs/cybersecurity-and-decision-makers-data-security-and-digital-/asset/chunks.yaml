- raw: 'Its scope is broad, since it deals with all information systems: industrial,
    management, commercial, as well as site protection, and extended enterprise protection,
    with suppliers, subcontractors, service providers and subsidiaries in all the
    countries where the group has deployed activities. SMEs, which do not escape digitization,
    do not always have sufficient resources to ensure the security of their operations:
    there are “cyberdeaths” among these companies.


    The cybersecurity manager is an essential link in the chain, but their effectiveness
    and performance depend on the organization as a whole and on their interaction
    with the company’s main internal and external stakeholders.


    Their missions are multiple and are part of the objective of developing and maintaining
    the digital trust that stakeholders (customers, suppliers, employees, shareholders,
    partners, etc.) have in the company, its products and services: finding trusted
    partners, ensuring the company’s resilience with limited resources and budgets.
    Protecting strategic and personal data is a challenge for cybersecurity managers
    in a context of cost reduction, automation and optimization.


    It is necessary to know how to protect strategic, financial and personal information,
    as well as how to intervene from the design stage (Privacy & Security by Design),
    to advise the business in the development of applications and services that make
    it possible to develop digital activities and create value, by becoming a trusted
    partner for traditional and new customers, to contribute to compliance, particularly
    in the context of the GDPR or the NIS directive, to establish the synthesis of
    cyber-risks by relativizing the various risks: a lack of security in industrial
    systems can have much more serious consequences for the company than a leak of
    non-strategic or non-sensitive data.


    ### **5.3.2. *The CISO and the company***


    In cybersecurity, it is essential that everyone assumes their responsibilities:
    the board of directors, managers, the IT department, the CISO, as well as the
    business operations, functions, employees, the extended company (suppliers, subcontractors,
    IT service providers), not to mention the State (infrastructures, education, investigations,
    standards, certifications and regulations).


    Managers within the company too often work in silos, while security, physical
    or digital, is everyone’s business and requires a 360-degree panoramic view.


    The business must be involved in risk mapping and also in the solutions to be
    implemented, in the identification of strategic assets and in the definition of
    security standards, allowing the right balance to be found between security and
    agility, security and efficiency.


    Threats evolve quickly, which requires being agile and responsive. They can be
    strong and destabilizing. If the main actors of the company are not prepared,
    and if they have not understood and become aware of the cyber threat, then they
    will not be able to respond correctly and avoid impacts.


    ![Figure 5.1. Employees who are aware of cybersecurity, but who are not very involved
    according to the CISOs ¶ (source: according to CESIN)](image/image150_c2910.jpg)


    **Figure 5.1.** *Employees who are aware of cybersecurity, but who are not very
    involved according to the CISOs* ¶ *(source: according to CESIN)*


    “We are all concerned! You have to invest. Lightning can strike anyone. We must
    anticipate, prevent, and mitigate the effects”, Guillaume Poupard regularly insists,
    particularly on April 17 in front of a packed room at the Institut français des
    administrateurs (IFA).


    Protecting yourself is possible; it requires an effort: you have to start by understanding.
    And then to respect some major principles, and also, depending on the sector of
    activity, the regulations. Cybersecurity is not a specialist’s business, it must
    be integrated into all the company’s projects.


    Internal governance must take into account the safety issues for the company,
    of course, as well as the issues for the company’s functions and the business:


    *   – human resource issues: management involvement in cybersecurity governance
    and the establishment of a security culture aimed at promoting key people and
    key skills, all-round training and the development of expertise;


    *   – the financial challenges: allocate more budgets to cybersecurity, measure
    cyber-risk exposure and make the necessary investments, including the implementation
    of insurance coverage, collect objective data to assess and manage their cyber
    performance, compare themselves and decide;


    *   – legal issues: GDPR compliance, as well as the drafting of an IT charter
    and internal regulations, the management of complaints (those of the company in
    the event that it is attacked, those of third parties if they have suffered damage
    and consider the company liable), the development of contracts with suppliers
    and subcontractors;


    *   – business challenges and business continuity: the security teams, in coordination
    with the business lines and functions, aim to guarantee safe operation at all
    times, without compromising either the quality of service or environmental and
    human protection;


    *   – the quality and safety of suppliers, customers, partners and IT service
    providers.


    The coordination of the various actors (CIO, CISO, DPO, risk manager) with the
    various business lines of the company (industrial sites, product innovation, sales,
    support functions), external service providers, users, is a difficulty, but it
    is a necessity that is the responsibility of the managers, and must be monitored
    by the board of directors.


    The organization and governance of security must be defined precisely and clearly
    for all: who does what? What are the roles and responsibilities of the CIO, RSI,
    risk manager, internal audit and external audit? Who is in charge of identifying
    threats (threat intelligence), monitoring attacks, intervening, defining the security
    repository, enforcing it, verifying its application? Who depends on whom? What
    are the reporting lines? What are the degrees of independence of the supervisory
    bodies?


    It is recommended to place the CISO where he/she will have the means to act effectively
    and where his/her independence will be ensured. The following three principles
    must be applied for this safety manager:


    *   – a clear mandate;


    *   – proximity to the executive committee;


    *   – freedom of action (and therefore of budget).


    It is not recommended that the CISO should be dependent on the IT director whose
    objective is to make information systems easy to use, fast and efficient. Rather,
    security measures tend to slow down access to workstations (password, double authentication),
    applications (passwords, updates) and computer processing.


    The internal organization must be global and not ignore entire parts of the company
    that are sometimes forgotten. The points of vigilance of the internal organization
    are in particular the following:


    *   – information systems, throughout the company: cyber protection architecture
    (isolating the various information systems, isolating the company and the industrial
    network, using inspection and intrusion detection tools), server location, back-up
    of sensitive data, etc.;


    *   – factories: hardware and software, network access, data access with authentication
    and authorization plus encryption, physical and digital security coordination,
    updates, USB sticks, augmented reality tools;


    *   – administrators (tools and access rights rules), users (passwords, mobility,
    how to communicate, data archiving – how long, where, classification? – back-ups),
    certified NCSC (National Cyber Security Centre) or NCCIC (National Cybersecurity
    and Communications Integration Center) service providers;


    *   – decision-making processes and delegations of authority: who makes decisions
    in terms of tools, product design, access to information, recruitment, procedures
    (password renewal), choice of service providers and contracts?'
