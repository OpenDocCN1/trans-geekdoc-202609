    As stated in the CNIL’s 2018 activity report, “citizens aspire to see their personal
    data collected and used in a transparent manner and for uses they accept. Companies
    must strive to experience regulation as a requirement that can provide them with
    a distinctive competitive advantage” and increased stakeholder confidence.


    Europe has decided to protect its citizens with the GDPR, and companies must comply
    therewith, protect the personal data they collect and secure their information
    systems.


    ### 4.1.2. Vectaury


    Vectaury operates in retail analytics, i.e. the analysis of customer data for
    the distribution sector. Founded in October 2014, Vectaury employs approximately
    70 people and claims to work with more than 100 brands and agencies.


    The start-up has created a geolocation cookie that you install on your smartphone
    without realizing it when you download certain applications, such as games and
    services such as weather or certain media.


    The data collected is then cross-referenced and analyzed so that Vectaury’s customers
    (store chains such as Carrefour) display targeted advertising on people’s terminals
    from the places they have visited.


    Start-ups like Vectaury directly negotiate with application distributors to integrate
    their cookies into the application, as a package that comes with the service.


    The user receives a short message informing him/her of the presence of cookies
    for advertising targeting or marketing purposes, and must give his/her consent.


    For the CNIL, accepting the presence of cookies by downloading an application
    is not enough. When a user downloads an application containing the cookie of Vectaury,
    it should therefore be informed and allow the continuous tracking of its geolocation
    data (even when the application is closed) for advertising purposes.


    For the CNIL, consent is “not validly collected”; the institution states that
    Vectaury has thus collected “more than 42 million advertising identifiers and
    geolocation data from more than 32,000 applications”. As the data collected reveal
    the movements of people and therefore their lifestyle, Vectaury has three months
    to implement consent requests in accordance with the GDPR and delete the data
    it had improperly collected. Otherwise, the CNIL may impose a sanction. Indeed,
    non-compliance with European law (GDPR) leads to a significant risk of sanction:
