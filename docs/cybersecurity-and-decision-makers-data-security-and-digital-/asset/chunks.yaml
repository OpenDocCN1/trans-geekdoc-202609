    not consider cybersecurity to be a problem that is primarily addressed by the
    IT department.


    #### 5.2.1.3. *Assigning clear supervisory responsibilities at the board level*


    According to the 2018 guidelines, the company must include – in its disclosures
    – a description of how the board of directors manages its risk oversight function.
    As with other audit and risk issues, the board could logically assign this oversight
    to its existing audit or risk committee.


    However, in some particularly sensitive companies, it is recommended that a new
    board committee be appointed to deal exclusively with cybersecurity issues: cyber
    insurance, incident response plans, business continuity plans, internal threats
    and “bad exits” (those who leave a company and pose a threat, for example by disrupting
    technological systems), due diligence in the field of third-party cybersecurity;
    prevention and response against ransomware; recruitment of IT staff; training
    in cybersecurity; data security budget, etc.


    If a board does not have an expert in cybersecurity, it should consider using
    an external expert, just as the review of the accounts is carried out by an independent
    expert.


    #### 5.2.1.4. *Requiring evaluations, tests and reports*


    The implementation of independent quarterly or semi-annual reports on the status
    and health of the company’s cybersecurity program, training, staffing, assessments,
    test results or other third-party comments on the overall state of the company’s
    cybersecurity are essential and will demonstrate how the board of directors fulfills
    its responsibility to monitor risks in this increasingly important area.


    Board oversight of cybersecurity audits should include not only a thorough review
    of risk and security assessments, penetration test reports and other similar audits
    related to cybersecurity but also corrective efforts or measures that will be
    implemented in the future.


    Similarly, boards should also ask management to participate in practical exercises
    that allow organizations to analyze potential emergencies.


    Boards must carefully examine the effectiveness, timeliness, frequency and overall
    results of a company’s simulation exercise and, more importantly, analyze the
    corrective actions taken after these exercises.


    #### 5.2.1.5. *Remaining vigilant at all times*


    The most recent and efficient solutions are not enough. They must be properly
    deployed, and a program that integrates employee awareness and training must be
    incorporated into the cyber device. All employees must be vigilant and encouraged
    to report perceived problems as they arise. Speed of response is essential and
    is the key to recovery.


    Boards should obtain information on the frequency and effectiveness of IT security
    training programs: list of trained individuals, including board members, tests
    (fraudulent email campaigns and test results), data access policy and IT charters.


    #### 5.2.1.6. *Being informed and understanding incidents*


    The ability to detect and respond to a cyber incident is essential and can be
    critical to the results. An effective program can position the company for a rapid
    recovery and isolate it from reputation damage.


    On the other hand, a failed program may further exacerbate the underlying incident,
    exposing the company to significant legal risks and reputation damage. Boards
    of directors must be immediately informed by the company’s management when a serious
    IT incident has been identified. This will demonstrate that the board is fully
    involved and takes its governance responsibilities seriously.


    SEC Directives 2018 reinforce this notion of alerting the board. SEC President
    Jay Clayton, who testified before Congress about a data breach suffered by the
    SEC, clearly deplored that SEC staff did not share some critical information about
    the data breach.


    The board of directors must understand any historical events in cybersecurity
    that may have affected the company, its competitors or other stakeholders.


    #### 5.2.1.7. *Anticipating*


    With the publication of its guidelines for 2018, the SEC has issued a call for
    companies’ boards of directors to wake up. The risk of cybersecurity has clearly
    risen to the top of the corporate agenda and, in reality, boards of directors
    must now engage in careful and rigorous oversight of the planning and response
    to cybersecurity incidents.


    Given the current landscape of class actions related to cybersecurity issues,
    data security incidents not only create regulatory liability, but can also create
    personal liability for administrators.


    The priority is to monitor these risks, exactly as for financial risks.


    ### **5.2.2. *Insurance***


    As mentioned above, updating the insurance contract will make it possible to check
    the quality of the protection system, security policies and potential vulnerabilities.


    There are many guides that can be consulted by companies, especially SMEs, which
    often do not have an IT security expert, or subsidiaries of international groups,
    which are not always on the radar of their parent company.


    These guides will make it possible to carry out a self-assessment, an essential
    prerequisite for consulting a broker or an insurance company, which will refuse
    to insure a company that has not done the minimum in terms of cybersecurity.


    The insurance approach is virtuous; it makes it possible to carry out an assessment
    of the company’s security by answering the insurance company’s questionnaire,
    sometimes with the support of the insurance broker. If the insurance company refuses
    to implement a cyber extension of your contract, worry.


    The guide of the FFA (*Fédération française de l*’*assurance*) is recommended
    by the government and ANSSI. It gives many practical recommendations.


    ## **5.3. Internal governance**


    ### **5.3.1. *The CISO***


    It is not enough to have found the rare pearl: an excellent CISO. The latter must
    interact with the business and support functions and be “connected” to the executive
    committee and the board of directors.


    He/she is the contact person for the executive committee and the board of directors,
    sometimes via the audit and risk committee, and informs them of the company’s
    exposure to risks, incidents and the measures to be implemented.


    It is essential that the CISO is well informed about projects and involved with
    operational and functional departments (e.g. purchasing, mergers and acquisitions),
    in order to be able to provide a transversal vision, adjust strategies and action
    plans, after having measured the effectiveness of the measures.


    He or she relies on a CISO channel within the company (branches, subsidiaries),
    establishes the security policy applicable within the group, disseminates it and
    ensures that it is applied in conjunction with the internal audit department.
    It is important that the CISO has a list of correspondents in all the controlled
    legal entities of the group, in order to be able to communicate security policies,
    enforce them and be informed in the event of an incident.


    In the case of joint ventures or consortia, it is important to define when setting
    up these entities, within the shareholders’ agreements, which security policies
    will apply, who will be able to audit their application, and who will appoint
    the CIO and the CISO. The persons in charge of negotiating shareholder agreements
    should be made aware of these aspects.


    Some companies have integrated the director of cybersecurity into the executive
    committee, just as other companies have created a digital committee on the board
    of directors.'
