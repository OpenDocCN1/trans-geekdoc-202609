- raw: 'The term “cyber-risk” is misleading. In reality, risks are business risks
    with an IT cause: the risk is not to sell, not to produce, not to be able to pay
    or be paid, because the training systems are blocked until a ransom is paid, or
    because the data is encrypted.


    Reputation damage, whether as a result of data loss or online defamation, may
    also have an impact on the company’s business. The landscape of cyber-risks is
    constantly changing, and they are difficult to quantify (lack of history).


    There is no such thing as zero risk. The question is not “are we going to be victims
    of a cyber-attack?” but “when are we going to be victims of a cyber-attack?” Cyber-risk
    is a meta-risk, which affects all the company’s functions.


    Cyber-risks must be subject to specific due diligence: systems, skills, governance,
    budgets, quality of service providers, suppliers, subsidiaries, insurance and
    regular audits of cyber incidents, vulnerabilities and data recovery plans in
    the event of an attack.


    The identification of strategic systems is not sufficient; the analysis of strategic
    data, the protection of this data, at storage locations and during data transfers,
    as well as access, are also essential parameters.


    Assessing technical, human (internal and external: suppliers and service providers),
    financial and legal risks; assessing risks in cybersecurity governance and management
    involvement, the degree to which cybersecurity is taken into account in information
    systems and daily operations; setting up incident reporting; estimating the costs
    of securing systems and data, training technical teams and staff are part of the
    responsibilities of managers and boards.


    The boards of directors have, among other things, a legal obligation to monitor
    the effectiveness of the company’s risk management system and will in particular
    ensure the implementation of an action plan to remedy these risks (by setting
    priorities).


    Operations managers must therefore be aware of the risks, provide the company
    with a global risk management system (ERM, Enterprise Risk Management), entrust
    its coordination to the risk manager (for large companies), whose mission is to
    implement remediation and prevention policies, as well as the transfer to insurance,
    which contribute to the company’s resilience.


    The control of cyber-risks is complex; cybersecurity is a transversal subject
    that requires a risk governance approach, assumed responsibilities and the involvement
    of all stakeholders. The coherence of managerial and technological approaches
    is a key factor for success.


    Some sectors of activity (BtoC or health, for example) are more exposed than others.
    Each company must implement an information system security policy (ISSP): guarantee
    the accessibility of the system, its proper functioning, the confidentiality of
    information and its integrity.


    Far from being reserved only for critical environments, the challenge will ultimately
    be to certify trusted systems and products.


    Cyber-risk is no longer a technical risk but a business risk, and it is therefore
    necessary to define a governance and organization of the company’s cybersecurity
    resources, involving IT functions, operations managers and support functions.
    This is a prerequisite for the company’s resilience.


    The company, whatever its activity, must put in place processes that guarantee
    confidentiality, integrity, data security, appropriate governance (roles and responsibilities:
    who has access, who gives access to which data, who can transfer it and to whom,
    who keeps it, etc.), the classification of these data (degree of confidentiality,
    sensitivity, interest for the business) and therefore the right level of protection,
    to be decided with the CISO.


    The main mission of cybersecurity teams is to protect digital information in all
    its dimensions – personal and strategic – and to advise operational departments
    in the development of new products or services based on the data owned by the
    company, while ensuring their protection. Maximizing the potential of the data
    used can also result in financial gains, productivity gains and improved employee
    efficiency.


    ## **3.2. The context**


    More than one organization in two does not regularly perform cyber resilience
    testing, according to a Ponemon Institute survey. Seventy-seven percent (82% in
    France) of IT professionals surveyed stated that they do not consistently apply
    a Computer Security Incident Response Plan (CSIRP) throughout the company. However,
    the irregular frequency of IT security tests – cyber resilience – can be costly
    for companies.


    Digital technology, the speed of exchanges, the size of companies and the internationalization
    of operations have led to the loss of sovereignty of states, a loss of control
    over information flows in large companies, the disappearance of national rules
    concerning many previously classified information and a transformation of uses;
    it is now the reign of all-round exchange sharing, including on social networks,
    and transparency: native digital people see transparency as a solution to the
    world’s dysfunction.


    The speed of operations, the reduction in staff, the separation of tasks, the
    complexity of organizations and the lack of proximity often make employee engagement
    less important and the understanding of the issues less important. Criminals enjoy
    themselves. The consequences are first and foremost economic.


    ## **3.3. Vulnerabilities**


    A vulnerability is a security breach that can be exploited by a criminal. Some
    vulnerabilities are zero-day, i.e. known, but for which there is no patch. Some
    vulnerabilities are known, and there are patches to be applied.


    Automated analysis software, based on databases of known vulnerabilities, can
    be used to identify potential vulnerabilities in networks, applications, servers,
    systems or equipment. Once the analyses have been conducted, the tool reports
    on all the problems detected and suggests actions to close the gaps. The most
    advanced tools will help to decide whether to correct or accept risk based on
    the impact on business operations and security. The analysis can be integrated
    with a SIEM (Security Information and Event Management) solution to provide a
    more complete analysis.


    Penetration tests are also a complement to vulnerability analysis and allow us
    to know whether the vulnerability can be exploited and with what impacts. They
    also make it possible to identify software, application or other vulnerabilities
    and to complete the list of zero-day vulnerabilities and known vulnerabilities.


    The main objective is to assess the risks and establish the corrective action
    plan. As IT security teams’ resources are generally limited, they will have to
    plan their actions according to the priorities defined in conjunction with the
    company’s (or public organization’s) operational and functional managers:


    *   – regarding a zero-day vulnerability, it may be decided to isolate applications
    or parts of the system, and perform additional checks, pending a patch. The impacts
    will thus be limited, in the event of an attack;


    *   – concerning known vulnerabilities, a corrective action program can be established
    based on priorities defined with the company’s businesses and functions, and regulatory
    requirements (priorities are defined according to the probability of the occurrence
    of the attack on the identified vulnerabilities and the estimated impact).


    It is very important to prioritize actions with operations managers, who must
    be aware of the risks, understand them and be active in implementing solutions
    or taking risks, in coordination with safety managers.


    ### 3.3.1. *Fraud against the president*'
