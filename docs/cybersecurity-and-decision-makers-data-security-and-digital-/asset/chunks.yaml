    before midnight, they took the only possible decision to stop the attack: they
    completely isolated it from the rest of the world.


    The pirates lost their hand, but it was in a field of digital ruins that ANSSI
    agents arrived in the early morning. They came to help the helpless but competent
    and very cooperative technical teams. Never had ANSSI experts, whose discretion
    was proverbial, had to face such media pressure. Television cameras camped in
    front of the entrance of the television channel. TV5 Monde journalists, whose
    workplace made the headlines, tried to extract information from them, to the detriment
    of the extreme sensitivity of these first hours of investigation. Officers needed
    to seal the glass doors of their crisis room, set up for the occasion, so as not
    to be seen, flee the cameras in the corridors, and even take refuge under their
    desk to hide their screens when the cameras broke into the room.

    '
