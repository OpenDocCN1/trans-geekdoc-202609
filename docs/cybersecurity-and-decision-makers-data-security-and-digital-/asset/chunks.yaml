    \ to improve compliance with the GDPR (General Data Protection Regulation), not\
    \ to mention the implementation of cyber programs through companies, associations,\
    \ foundations and public bodies.\n\nMarie DE FRÉMINVILLE  \n\nDecember 2019\n\n\
    # Introduction: Financial and Cyber Performance\n\nWhy not assess the cyber performance\
    \ of companies in the same way as their financial and non-financial performance\
    \ (governance and CSR – corporate social responsibility)?\n\nWhy not certify the\
    \ cyber performance of companies in the same way as their financial performance\
    \ via auditors, whose intervention is mandatory for companies of a certain size?\n\
    \nDespite some progress, the vast majority of shareholders, and therefore the\
    \ board of directors and management, are primarily interested in the company’s\
    \ financial performance.\n\nHowever, the digital age is introducing upheavals\
    \ in the company and in its ecosystem. Indeed, the “all-digital” concerns all\
    \ stakeholders, administration, public services and national and international\
    \ infrastructures, defense and intelligence services.\n\nWe have reached a stage\
    \ of non-return, which offers important opportunities, but which is also a source\
    \ of fragility and major risks, particularly because cyber threat actors are becoming\
    \ more professional and have significant resources to defraud, spy and sabotage.\n\
    \nThe risks for companies are systemic: shareholders are financially exposed and\
    \ directors, in charge of defining their strategy and ensuring their sustainability,\
    \ are legally exposed if they do not inform themselves about the quality of data\
    \ security and information system protection and if they do not ensure that an\
    \ organization, procedures and tools for a high level of cybersecurity are in\
    \ place.\n\nThere is no such thing as zero risk, but the negligence of a board\
    \ of directors would be associated with it if no action were taken in the field\
    \ of cybersecurity of the company and if the attacks had significant consequences\
    \ for its proper functioning, profitability and reputation.\n\nFinancial performance\
    \ should therefore no longer be the only priority. Financial performance and cyber\
    \ performance should now be the two priorities of corporate governance bodies.\n\
    \nShould we therefore reinvent the governance body designated by the national\
    \ actions, namely its competences, its functioning, its agenda and its partners?\n\
    \nFor 50 years, we have been wading through a technological tsunami:\n\n*   –\
    \ 1970: mainframe;\n\n*   – 1980: PC (Personal Computer) and client/server;\n\n\
    *   – 1990: Internet and e-commerce;\n\n*   – 2000–2010: mobile and cloud;\n\n\
    *   – 2010–2020: Internet of Things and artificial intelligence;\n\n*   – 2020–2030:\
    \ quantum computing and blockchain.\n\nThe digital world is borderless and immaterial,\
    \ and the threats are invisible.\n\nDigital and related new technologies are transforming\
    \ the way companies operate and business models.\n\nThe main cyber-risks are risks\
    \ of malfunctioning of the industrial or commercial process, financial risks,\
    \ as well as risks of loss of considerable confidential information (strategic\
    \ information, personal information) which affect different sectors: hospitals,\
    \ autonomous cars, banks, telecom operators, energy, etc., with potential human\
    \ consequences.\n\nAccording to a study conducted in the United States by the\
    \ National Archives and Records Administration in 2018, 93% of companies that\
    \ lost their data for 10 or more days declared bankruptcy in the year of the disaster\
    \ and half (50%) filed for bankruptcy immediately after the attack."
