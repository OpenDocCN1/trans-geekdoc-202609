- raw: 'As stated in the CNIL’s 2018 activity report, “citizens aspire to see their
    personal data collected and used in a transparent manner and for uses they accept.
    Companies must strive to experience regulation as a requirement that can provide
    them with a distinctive competitive advantage” and increased stakeholder confidence.


    Europe has decided to protect its citizens with the GDPR, and companies must comply
    therewith, protect the personal data they collect and secure their information
    systems.


    ### **4.1.2. *Vectaury***


    Vectaury operates in retail analytics, i.e. the analysis of customer data for
    the distribution sector. Founded in October 2014, Vectaury employs approximately
    70 people and claims to work with more than 100 brands and agencies.


    The start-up has created a geolocation cookie that you install on your smartphone
    without realizing it when you download certain applications, such as games and
    services such as weather or certain media.


    The data collected is then cross-referenced and analyzed so that Vectaury’s customers
    (store chains such as Carrefour) display targeted advertising on people’s terminals
    from the places they have visited.


    Start-ups like Vectaury directly negotiate with application distributors to integrate
    their cookies into the application, as a package that comes with the service.


    The user receives a short message informing him/her of the presence of cookies
    for advertising targeting or marketing purposes, and must give his/her consent.


    For the CNIL, accepting the presence of cookies by downloading an application
    is not enough. When a user downloads an application containing the cookie of Vectaury,
    it should therefore be informed and allow the continuous tracking of its geolocation
    data (even when the application is closed) for advertising purposes.


    For the CNIL, consent is “not validly collected”; the institution states that
    Vectaury has thus collected “more than 42 million advertising identifiers and
    geolocation data from more than 32,000 applications”. As the data collected reveal
    the movements of people and therefore their lifestyle, Vectaury has three months
    to implement consent requests in accordance with the GDPR and delete the data
    it had improperly collected. Otherwise, the CNIL may impose a sanction. Indeed,
    non-compliance with European law (GDPR) leads to a significant risk of sanction:
    a fine of up to 4% of annual worldwide turnover or €20 million.


    Compliance with corporate regulations and rules is a condition of trust for shareholders,
    rating agencies, directors, auditors and all stakeholders – customers, suppliers,
    employees, etc.


    ### **4.1.3. *Optical Center***


    In July 2017, the CNIL was informed of a “significant data leak” concerning the
    company Optical Center.


    By entering several URLs in a browser’s address bar, it was possible to access
    hundreds of invoices from the company’s customers. These invoices contained data
    such as surname, first name, postal address and health data (ophthalmological
    correction) or, in some cases, the social security number of the persons concerned.


    The [www.optical-center.fr](http://www.optical-center.fr) website had a security
    breach, which had already been reported in 2015. It did not include a feature
    to verify that a customer is properly connected to his/her personal space (“customer
    space”) before displaying his/her invoices.


    The CNIL imposed a financial penalty of 250,000 euros and decided to make its
    decision public.


    ### 4.1.4. *Dailymotion*


    In December 2016, a press article reported a major data leak related to the Dailymotion
    platform, which indicated that the data breach was the result of a multi-step
    attack involving 82.5 million email addresses and 18.3 million encrypted passwords.


    The attackers were able to access the credentials of an administrator account
    in the company’s database, stored in plain text on the collaborative development
    platform “GitHub”. The attackers then exploited a vulnerability found in the code
    of the Dailymotion platform on “GitHub”. This vulnerability allowed them to use
    the administrator account to remotely access the company’s database and extract
    users’ personal data.


    The CNIL imposed a financial penalty of 50,000 euros, considering that the company
    had failed to comply with its obligation to protect personal data. The company
    should not have stored identifiers for an administrator account in its source
    code in plain text; since people outside the company had to remotely connect to
    the internal computer network, it should have framed these connections by an IP
    address filtering system or a virtual private network (VPN).


    ## **4.2. The different international regulations (data protection)**


    Worldwide, data protection legislation (sometimes referred to as data confidentiality
    in third countries) is developing. Legislative texts are often influenced by European
    Union regulations, which are considered the benchmark for data protection.


    More than 100 countries worldwide have data protection legislation, including
    the 28 member states of the European Union.


    While the United States (the State of California is an exception) refuses to protect
    users and allows Internet service providers to sell their subscribers’ personal
    data (browsing history, geolocation, time spent on an application, etc.) to marketing
    agencies, other states, including China, are taking the European lead, in order
    to protect citizens or residents, and make companies that process their personal
    data accountable.


    The State of California in the United States, Brazil, India and Canada have their
    own regulations. Recent data misuse scandals are accelerating this trend. So,
    there is a global awareness.


    ### **4.2.1. *The United States***


    Unlike European law, American regulation is organized by sector of activity or
    category of individuals: financial services, health sectors, credit institutions,
    insurance have specific regulations, Fair and Accurate Credit Transactions Act,
    Health Insurance Portability and Accountability. For individuals, one regulation
    specifically concerns children: Children’s Online Privacy Protection restricts
    the use of information collected from children under 13 years of age by websites.


    In addition, the Clarifying Lawful Overseas Use of Data Act (CLOUD Act) is a US
    federal law passed on March 23, 2018, on the monitoring of personal data, including
    in the cloud. It allows law enforcement agencies (federal or local, including
    municipal) to obtain an individual’s personal data without the individual being
    informed, nor their country of residence, nor the country where the data are stored.


    The CLOUD Act makes it legal to capture any email or other digital data stored
    on US servers, including those abroad. Major local cloud players and their subsidiaries
    must comply with it, as well as foreign companies operating in the United States.


    If a company wants to equip itself with a highly secure solution to manage its
    data, the choice of a cloud service provider is therefore essential.


    ### **4.2.2. *China***


    China’s first major laws on cybersecurity and personal data protection were introduced
    in 2012.


    The law adopted in 2016 prohibits the sale of personal data of service users “without
    the consent of the person whose information has been collected”, and companies,
    as in Europe, can only collect data necessary for the services they provide.


    As in the United States, and unlike Europe and many countries, China has a sectoral
    approach to data protection. Many provisions deal with system security, system
    control and data transfers abroad. With regard to data protection, the regulations
    apply to network operators.'
