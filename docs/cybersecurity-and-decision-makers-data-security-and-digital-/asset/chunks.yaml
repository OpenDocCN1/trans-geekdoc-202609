- raw: 'The National Cybersecurity Agency of France (ANSSI) identified five major
    cyber threat trends observed in France and Europe in 2018.


    Some sectors of activity, considered unlikely targets, are now being targeted.
    This is the case, for example, for the agri-food sector, which means that no company
    is immune, according to Guillaume Poupard, ANSSI’s Director General.


    During the night of April 10–11, 2019, Fleury Michon (a mid-sized, family-owned
    and independent company specializing in the preparation of deli meats, ready meals
    and fresh surimi) was hit by a computer virus. To avoid its spread, all systems
    were disconnected. The plants, as well as the logistics unit, were shut down on
    April 11. After analysis, appropriate security measures were deployed to allow
    the activity to restart on April 15.


    The unit dedicated to culinary aids was relaunched the morning of April 16. “Our
    customers’ orders have been delivered again since this morning. The impacts, which
    are currently being quantified, will be limited and covered by insurance taken
    out for this purpose”, the company stated in a press release dated April 15, 2019.


    #### 1.2.2.1. *Cyber espionage*


    Cyber espionage is the highest risk for organizations, according to ANSSI.


    The attacks are highly targeted and technically sophisticated and increasingly
    target critical sectors of activity and specific critical national infrastructure,
    such as defense, health or research.


    Guillaume Poupard mentioned, during his speech at the French Institute of Directors
    on April 17: “ten to twenty very serious cases per year. We don’t talk about it,
    but these attacks exist. Their silence creates a perception bias!” he says.


    The best way to access confidential information today is through a computer attack.
    Victims discover the attacks, sometimes by chance, sometimes by third parties,
    sometimes thanks to ANSSI. Sometimes, victims discover the attack five years later.
    The managers then discovered that all their emails could be read. The average
    time to discover an attack is about a 100 days; it has decreased, but it is still
    important. Meanwhile, the pirates are taking action.


    Cyber espionage is gradually eroding the value of companies and even destabilizing
    some of them: it is large-scale economic spying using cyber infiltration techniques
    to steal the most valuable assets (strategic files, business proposals, managers’
    email boxes, etc.). Eighty percent of the value of Fortune 500 companies is made
    up of industrial property and other intangible assets, and cyber espionage is
    a perfect way to access them.


    TeamViewer is one of the world’s leading suppliers of software for the remote
    control of computers and servers. It was the victim of user account diversions,
    reported by many customers as originating from Chinese IP addresses, and reportedly
    infected with Winnti malware in late 2016, as well as German steel producer ThyssenKrupp
    and pharmaceutical giant Bayer, which acknowledged a hacking attack in 2018, during
    which the Winnti malware program was also deployed.


    #### 1.2.2.2. *Indirect attacks*


    Indirect attacks increased significantly in 2018, according to ANSSI. As large
    companies are more secure, attackers target suppliers or service providers, who
    are more vulnerable, to reach their final targets. When it comes to an IT service
    provider, it is difficult to distinguish whether the connections come from the
    service provider or from an attacker who has broken into the service provider’s
    premises. Through this partner or service provider, it is possible to enter several
    of its customers’ premises.


    It is therefore essential to carefully select suppliers, to contract security
    requirements and to audit the level of protection of their IT systems, their organization,
    employee training, as well as their security policy and processes.


    #### 1.2.2.3. *Sabotage*


    These operations are deployed in the political arena, as well as in the corporate
    sector. They increased significantly in 2018. They are not necessarily sophisticated,
    but make the service of their target unavailable and can go as far as sabotage.


    Some of these attacks can be likened to acts of war or terrorism. It is therefore
    a matter of national security and resilience: given the purpose of these attacks
    (governmental organizations and vital operators), they generally target products
    and/or services that are vital to the nation. The attack, attributed to Russia,
    on Estonia’s banking infrastructure in 2007, is a first concrete event. Since
    then, Stuxnet, Aramco and TV5 Monde have been more recent examples.


    #### 1.2.2.4. *Cryptojacking or cryptocurrency mining*


    This type of cyber-attack consists of using the power of the victim’s computer
    to undermine cryptocurrency.


    In 2018, many such attacks were observed: increasingly organized attackers were
    taking advantage of security breaches to compromise their targets’ equipment,
    by depositing cryptomarket miners without their victims’ knowledge.


    #### 1.2.2.5. *Online fraud and cybercrime*


    Online fraud is a permanent cyber threat, both for companies and large organizations
    and for individuals. Large companies are better protected: they invest, detect
    and protect themselves.


    The attackers then turn to less exposed but more vulnerable targets, such as local
    authorities or health sector actors, who were thus the targets of numerous *phishing*
    attacks in 2018.


    A recent and emblematic example of the exceptional reactivity of cybercriminals:
    the burning of Notre-Dame on April 15, 2019, the State set up a site to collect
    donations from individuals, with a view to reconstruction.


    This is a good opportunity for fraudsters, the money will flow. With a fake “*Fondation
    du Patrimoine*” logo, but with a real RIB (bank account details), an email urged
    the “friends of France” to make donations for a “symbol of our history”. The site
    (created in Italy) was fraudulent and tried to surf the wave of generosity. It
    is not the only initiative; other scams have been identified and reported.


    ### **1.2.3. *Five types of attackers***


    #### 1.2.3.1. *Looking for easy money*


    Targets are identified according to two main criteria: they have assets (data
    with a *darknet* value or good financial performance) and they are fragile from
    the point of view of protecting IT systems and/or internal organization and procedures.


    #### 1.2.3.2. *Cyberactivists/hacktivists*


    The best-known cyberactivist or hacktivist movement is the Anonymous movement,
    created in 2006, better known since 2008, which is looking for hackers because
    of the principle of anonymity, lack of hierarchy and freedom of expression. The
    most common type of hacktivist attack is the degradation of websites, in order
    to insert a political message.


    Anonymous launches denial of service (DoS) attacks against the sites of targeted
    companies, considered as enemies of the values defended by the movement. In December
    2010, attacks were carried out on the MasterCard site following MasterCard’s decision
    to no longer provide services to WikiLeaks, a non-governmental organization founded
    by Julian Assange in 2006, whose objective is to publish documents, some of which
    are confidential, as well as political and social analyses on a global scale.
    Its purpose is to give an audience to alerters and information leaks, while protecting
    its sources. Several million documents relating to corruption, spying and human
    rights violation scandals involving dozens of countries around the world have
    been published on the website since its inception.


    In late 2010 and early 2011, the group was involved in attacks against countries
    with high levels of Internet censorship.


    On April 2, 2011, Anonymous launched an operation called “#opsony” against Sony
    and the PlayStation Network, to denounce the legal proceedings against hackers
    who had managed to bypass the digital protections of the PlayStation.'
