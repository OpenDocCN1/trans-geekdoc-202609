- raw: '*   – companies often do not file complaints: either because of confidentiality
    concerns and/or because they do not expect support from the police, who will be
    unable to trace the origin of the attack, or because of a lack of competent resources
    or because the means to be implemented are disproportionate.


    The quality of the information is nevertheless improving, thanks to


    *   – regulations and obligations to report data leaks to the CNIL or ICO (as
    part of the GDPR, General Data Protection Regulation), or to customers depending
    on the nature of the data that has been removed from the company;


    *   – declarations to ANSSI (National Cybersecurity Agency of France), which are
    also listed and reported annually;


    *   – a source of improvement in the quality of information represented by insurance
    (insurance companies and brokers). Indeed, insurance companies are developing
    their cyber-risk coverage offers, although this is a difficult market, given the
    weak history and the difficulty of estimating risks. More companies are studying
    the extension of their insurance policies to cyber-risks, and incident data are
    more reliable, even if the insurance companies themselves are discreet about the
    outcome of incidents.


    What is more annoying is when executives hide the truth from themselves, or when
    they hide the situation from their shareholders and board of directors. “We were
    attacked, we went through the crisis, back to business”. We could call them “cyber
    avoiders”.


    The press does not necessarily need to know, but the board of directors and shareholders
    must be informed when the impacts are significant and the risks threaten the company’s
    sustainability.


    Suppliers, experts who work with their customers, insurance companies, audit firms
    and digital investigation firms (computer forensics, which use techniques specialized
    in the collection, identification, description, security, extraction, authentication,
    analysis, interpretation and explanation of digital information) have a relatively
    reliable view of trends: they hold factual information, which allows them to extrapolate
    the origins of incidents, impacts and developments.


    #### 1.4.1.2. *The origin of the threats*


    The main causes of computer incidents are as follows:


    *   – a system user: most of the time, he or she does not want to compromise the
    integrity of the system, but his or her behavior promotes danger;


    *   – a malicious individual: he or she enters the system, legitimately or not,
    and accesses data or programs to which he or she is not supposed to have access
    (via software used within the system, but not properly secured, for example);


    *   – malicious software: software designed to harm or abuse system resources
    is installed (inadvertently or maliciously) on the system, opening the door to
    intrusions or modifying data; confidential data may be collected without the user’s
    knowledge and reused for malicious purposes;


    *   – a disaster (theft, fire, water damage), caused by improper handling or malicious
    intent, results in the loss of equipment and/or data.


    The figures published are frightening: a company is attacked every 40 seconds[¹](#c01.xhtml#pg20fne0c1),
    33% of ransom victims will not fully recover their data, 20% of paid victims will
    not recover their data either[²](#c01.xhtml#pg20fne0c2).


    #### 1.4.1.3. *Their implementation*


    Organized crime is growing because it is profitable and low-risk: criminals are
    based in countries where their activities are neither monitored nor prosecuted.


    ![Figure 1.3. The five different types of attacks that companies face each year
    ¶ (source: according to CESIN)](image/image42_c2871.jpg)


    **Figure 1.3.** *The five different types of attacks that companies face each
    year* ¶ *(source: according to CESIN)*


    *Ransom software*


    Imagine a burglar stealing all your company’s sensitive files and promising to
    bring them back to you if you pay a ransom. This is the method applied today with
    digital means. Files are not taken away, but encrypted, making them inaccessible.


    Cyber-attack campaigns are global; data is encrypted by attackers (now well encrypted)
    and results in the loss of data from attacked companies or organizations, unless
    the backup system is not affected and the data can be restored without having
    to pay a ransom.


    The ransoms requested are often low, and many customers pay because the amounts
    are lower than the impact resulting from the loss of data or the shutdown of their
    information systems. The State recommends not to pay, in particular, because it
    encourages cybercrime, but the pragmatism of companies usually leads to paying
    the ransom and restarting their activity as soon as possible, to be able to sell
    and produce, deliver to their customers and pay their suppliers.


    Attackers, in most cases, decrypt the data once the ransom has been collected,
    allowing companies to continue their activities. Indeed, the attacked spread the
    good news to those who failed to restore their backups, via their IT service providers:
    “Trust the hackers. If you pay, they will give you back access to your data and
    computer systems”.


    However, it should be noted that, in most cases, ransomware can be decrypted to
    retrieve the data by a provider paid between €2,000 and €4,000, which is often
    much less than the amounts requested by cybercriminals.


    *Phishing*


    Studies show that between 70 and 90% of cyber-attacks, and resulting data leaks,
    start with “phishing”, which means that employees who clicked on malicious emails
    are responsible for most successful attacks.


    The figures vary from study to study, but the ranking is always the same in the
    causes cited by companies that have experienced computer incidents: fraudulent
    emails, data access, malware, loss or theft of computer equipment, fraud (embezzlement
    or scam) are the most common threats encountered. Attacks can be massive or targeted.


    #### 1.4.1.4. *The targets*


    ![Figure 1.4. Still a very high rate of companies affected by cyber-attacks ¶
    (source: according to CESIN)](image/image44_c2872.jpg)


    **Figure 1.4.** *Still a very high rate of companies affected by cyber-attacks*
    ¶ *(source: according to CESIN)*


    Cyber-risk is no longer a technical risk but a corporate, international risk,
    and also a risk for governments and public organizations. It is now an integral
    part of business reality, such as fire risk or building safety.


    The cyber-risk landscape is constantly changing. Cyber-risks are complex and difficult
    to quantify, particularly because of the rapidly changing technological environment
    and the lack of historical data on cyber-claims.


    Large companies, such as KPMG, Deloitte or Airbus, cities, political parties and
    even governments are also vulnerable and victims of attacks. Those who have prepared
    themselves are managing the crisis, communicating as little as possible, and avoiding
    leaks in the press.


    All companies are potential victims, regardless of their size, activity or location,
    and come from a wide variety of backgrounds, as this sample of examples shows:


    *   – the nuclear industry “is no exception”; “there have been cases of random
    malware attacks against nuclear power plants”, said the Director General of the
    International Atomic Energy Agency (IAEA) in 2016;


    *   – the space industry, via “ground attacks” on control centers, jamming of
    radio waves from a transmitter or receiver, data interception, takeover (information
    sent over the Internet via a satellite hijacked, copied, stolen or modified).
    On September 7, 2018, according to *Le Monde*, French Defense Minister Florence
    Parly revealed that the Russian satellite Luch-Olymp had approached a Franco-Italian
    satellite “a little too close” in 2017;'
  fmt: "\n* – companies often do not file complaints: either because of confidentiality\
    \ concerns and/or because they do not expect support from the police, who will\
    \ be unable to trace the origin of the attack, or because of a lack of competent\
    \ resources or because the means to be implemented are disproportionate.\n\nThe\
    \ quality of the information is nevertheless improving, thanks to:\n\n*   – regulations\
    \ and obligations to report data leaks to the `CNIL` or `ICO` (as part of the\
    \ `GDPR`, General Data Protection Regulation), or to customers depending on the\
    \ nature of the data that has been removed from the company;\n*   – declarations\
    \ to `ANSSI` (National Cybersecurity Agency of France), which are also listed\
    \ and reported annually;\n*   – a source of improvement in the quality of information\
    \ represented by insurance (insurance companies and brokers). Indeed, insurance\
    \ companies are developing their cyber-risk coverage offers, although this is\
    \ a difficult market, given the weak history and the difficulty of estimating\
    \ risks. More companies are studying the extension of their insurance policies\
    \ to cyber-risks, and incident data are more reliable, even if the insurance companies\
    \ themselves are discreet about the outcome of incidents.\n\nWhat is more annoying\
    \ is when executives hide the truth from themselves, or when they hide the situation\
    \ from their shareholders and board of directors. “We were attacked, we went through\
    \ the crisis, back to business”. We could call them “cyber avoiders”.\n\nThe press\
    \ does not necessarily need to know, but the board of directors and shareholders\
    \ must be informed when the impacts are significant and the risks threaten the\
    \ company’s sustainability.\n\nSuppliers, experts who work with their customers,\
    \ insurance companies, audit firms and digital investigation firms (computer forensics,\
    \ which use techniques specialized in the collection, identification, description,\
    \ security, extraction, authentication, analysis, interpretation and explanation\
    \ of digital information) have a relatively reliable view of trends: they hold\
    \ factual information, which allows them to extrapolate the origins of incidents,\
    \ impacts and developments.\n\n### 1.4.1.2. The origin of the threats\n\nThe main\
    \ causes of computer incidents are as follows:\n\n*   – a system user: most of\
    \ the time, he or she does not want to compromise the integrity of the system,\
    \ but his or her behavior promotes danger;\n*   – a malicious individual: he or\
    \ she enters the system, legitimately or not, and accesses data or programs to\
    \ which he or she is not supposed to have access (via software used within the\
    \ system, but not properly secured, for example);\n*   – a malicious software:\
    \ software designed to harm or abuse system resources is installed (inadvertently\
    \ or maliciously) on the system, opening the door to intrusions or modifying data;\
    \ confidential data may be collected without the user’s knowledge and reused for\
    \ malicious purposes;\n*   – a disaster (theft, fire, water damage), caused by\
    \ improper handling or malicious intent, results in the loss of equipment and/or\
    \ data.\n\nThe figures published are frightening: a company is attacked every\
    \ 40 seconds[¹](#c01.xhtml#pg20fne0c1), 33% of ransom victims will not fully recover\
    \ their data, 20% of paid victims will not recover their data either[²](#c01.xhtml#pg20fne0c2).\n\
    \n### 1.4.1.3. Their implementation\n\nOrganized crime is growing because it is\
    \ profitable and low-risk: criminals are based in countries where their activities\
    \ are neither monitored nor prosecuted. \n\n![Figure 1.3. The five different types\
    \ of attacks that companies face each year ¶ (source: according to CESIN)](image/image42_c2871.jpg)\n\
    \n**Figure 1.3. The five different types of attacks that companies face each year**\
    \ ¶ *(source: according to CESIN)*\n\n#### Ransom software\n\nImagine a burglar\
    \ stealing all your company’s sensitive files and promising to bring them back\
    \ to you if you pay a ransom. This is the method applied today with digital means.\
    \ Files are not taken away, but encrypted, making them inaccessible.\n\nCyber-attack\
    \ campaigns are global; data is encrypted by attackers (now well encrypted) and\
    \ results in the loss of data from attacked companies or organizations, unless\
    \ the backup system is not affected and the data can be restored without having\
    \ to pay a ransom.\n\nThe ransoms requested are often low, and many customers\
    \ pay because the amounts are lower than the impact resulting from the loss of\
    \ data or the shutdown of their information systems. The State recommends not\
    \ to pay, in particular, because it encourages cybercrime, but the pragmatism\
    \ of companies usually leads to paying the ransom and restarting their activity\
    \ as soon as possible, to be able to sell and produce, deliver to their customers\
    \ and pay their suppliers.\n\nAttackers, in most cases, decrypt the data once\
    \ the ransom has been collected, allowing companies to continue their activities.\
    \ Indeed, the attacked spread the good news to those who failed to restore their\
    \ backups, via their IT service providers: “Trust the hackers. If you pay, they\
    \ will give you back access to your data and computer systems”.\n\nHowever, it\
    \ should be noted that, in most cases, ransomware can be decrypted to retrieve\
    \ the data by a provider paid between €2,000 and €4,000, which is often much less\
    \ than the amounts requested by cybercriminals.\n\n#### Phishing\n\nStudies show\
    \ that between 70 and 90% of cyber-attacks, and resulting data leaks, start with\
    \ “phishing”, which means that employees who clicked on malicious emails are responsible\
    \ for most successful attacks.\n\nThe figures vary from study to study, but the\
    \ ranking is always the same in the causes cited by companies that have experienced\
    \ computer incidents: fraudulent emails, data access, malware, loss or theft of\
    \ computer equipment, fraud (embezzlement or scam) are the most common threats\
    \ encountered. Attacks can be massive or targeted.\n\n### 1.4.1.4. The targets\n\
    \n![Figure 1.4. Still a very high rate of companies affected by cyber-attacks\
    \ ¶ (source: according to CESIN)](image/image44_c2872.jpg)\n\n**Figure 1.4. Still\
    \ a very high rate of companies affected by cyber-attacks** ¶ *(source: according\
    \ to CESIN)*\n\nCyber-risk is no longer a technical risk but a corporate, international\
    \ risk, and also a risk for governments and public organizations. It is now an\
    \ integral part of business reality, such as fire risk or building safety.\n\n\
    The cyber-risk landscape is constantly changing. Cyber-risks are complex and difficult\
    \ to quantify, particularly because of the rapidly changing technological environment\
    \ and the lack of historical data on cyber-claims.\n\nLarge companies, such as\
    \ `KPMG`, `Deloitte` or `Airbus`, cities, political parties and even governments\
    \ are also vulnerable and victims of attacks. Those who have prepared themselves\
    \ are managing the crisis, communicating as little as possible, and avoiding leaks\
    \ in the press.\n\nAll companies are potential victims, regardless of their size,\
    \ activity or location, and come from a wide variety of backgrounds, as this sample\
    \ of examples shows:\n\n*   – the nuclear industry “is no exception”; “there have\
    \ been cases of random malware attacks against nuclear power plants”, said the\
    \ Director General of the International Atomic Energy Agency (`IAEA`) in 2016;\n\
    *   – the space industry, via “ground attacks” on control centers, jamming of\
    \ radio waves from a transmitter or receiver, data interception, takeover (information\
    \ sent over the Internet via a satellite hijacked, copied, stolen or modified).\
    \ On September 7, 2018, according to *Le Monde*, French Defense Minister Florence\
    \ Parly revealed that the Russian satellite `Luch-Olymp` had approached a Franco-Italian\
    \ satellite “a little too close” in 2017;\n"
  trans: '


    * – 公司通常不提投诉：可能是出于保密考虑和/或因为他们不指望得到警察的支持（警察无法追踪到攻击源头），或者因为缺乏足够的资源，又因为要实施的手段不成比例。


    尽管如此，信息的质量仍在不断提高，这得益于：


    *   – 向 `CNIL` 或 `ICO` 报告数据泄露的规定和义务（作为 `GDPR` 即通用数据保护条例的一部分），或根据从公司中提取的数据性质向客户报告；

    *   – 向 `ANSSI`（法国国家网络安全局）提交的声明，这些声明每年都会列出并报告；

    *   – 保险（保险公司和经纪人）是信息质量改进的一个来源。事实上，保险公司正在开发其网络风险覆盖产品，尽管由于历史数据匮乏且风险评估困难，这是一个充满挑战的市场。越来越多的公司正在研究将其保单范围扩大到网络风险，而且事件数据变得更加可靠，即使保险公司本身对事件结果保持谨慎态度。


    更令人恼的是，当高管对自己隐瞒真相，或者向股东和董事会隐瞒现状时。“我们遭受了攻击，我们度过了危机，恢复了业务”。我们可以称他们为“网络规避者”。


    媒体并不一定需要知道，但当影响重大且风险威胁到公司的可持续性时，董事会和股东必须知情。


    供应商、与其客户合作的专家、保险公司、审计机构和数字调查公司（计算机取证，使用专门用于数字信息收集、识别、描述、安全保护、提取、认证、分析、解释和说明的技术）对趋势有相当可靠的观察：他们掌握事实信息，这使他们能够推断事件的起源、影响和发展情况。


    ### 1.4.1.2. 威胁的来源


    计算机事件的主要原因如下：


    *   – 系统用户：大多数情况下，他或她不想破坏系统的完整性，但其行为助长了危险；

    *   – 恶意个人：他或她无论合法与否进入系统，并访问其不应访问的数据或程序（例如通过系统内部使用但未经过妥善保护的软件）；

    *   – 恶意软件：在系统上安装了（无意或恶意地）旨在损害或滥用系统资源的软件，为入侵打开了大门或修改了数据；机密数据在用户不知情的情况下被收集并用于恶意目的；

    *   – 灾难（盗窃、火灾、水灾），由于处理不当或恶意意图导致设备和/或数据丢失。


    公布的数据令人震惊：每 40 秒就有一家公司遭受攻击¹，33%的赎金受害者无法完全恢复其数据，20%支付了赎金的受害者无法恢复数据²。


    ### 1.4.1.3. 实施


    组织犯罪正在增长，因为它利润高且风险低：犯罪分子位于其活动既不受监控也不起诉的国家。


    ![图 1.3. 公司每年面临的五种不同类型的攻击（来源：根据 CESIN)](img/image42_c2871.jpg)


    **图 1.3. 公司每年面临的五种不同类型的攻击** ¶ *(来源：根据 CESIN)*


    #### 勒索软件


    想象一下一个小偷偷走了你公司所有的敏感文件，并承诺在你支付赎金后将它们还给你。这就是目前通过数字手段采用的方法。文件没有被带走，而是被加密，导致无法访问。


    网络攻击活动是全球性的；数据被攻击者加密（现在已是深度加密），并导致受攻击公司或机构的数据丢失，除非备份系统未受影响且可以在不支付赎金的情况下恢复数据。


    要求的赎金金额通常很低，许多客户选择支付是因为这些金额低于数据丢失或信息系统停工带来的影响。政府建议不要支付，特别是因为这会助长网络犯罪，但公司的务实做法通常导致他们支付赎金并尽快重启活动，以便能够销售和生产、交付给客户并向供应商付款。


    在大多数情况下，攻击者在收集赎金后会解密数据，允许公司继续活动。事实上，受攻击者会通过其 IT 服务提供商向那些未能恢复备份的人传播好消息：“信任黑客。如果你付钱，他们就会恢复你数据和计算机系统的访问”。


    然而，需要注意的是，在大多数情况下，勒索软件可以通过支付 2000 欧元至 4000 欧元的供应商来解密获取数据，这通常远低于网络犯罪分子索要的金额。


    #### 钓鱼


    研究表明，70% 到 90% 的网络攻击及导致的数据泄露始于“钓鱼”，这意味着点击恶意邮件的员工应对大多数成功的攻击负责任。


    不同研究之间的数字有所差异，但在经历过计算机事件的公司所引用的原因中，排名始终相同：欺诈邮件、数据访问、恶意软件、计算机设备丢失或被盗、欺诈（挪用或诈骗）是遇到的最常见威胁。攻击可以是大规模的，也可以是针对性的。


    ### 1.4.1.4. 目标


    ![图 1.4 遭受网络攻击影响的公司比例仍然非常高（来源：根据 CESIN)](img/image44_c2872.jpg)


    **图 1.4. 遭受网络攻击影响的公司比例仍然非常高** ¶ *(来源：根据 CESIN)*


    网络风险不再是技术风险，而是企业、国际风险，也是政府和公共机构的风险。它现在是业务现实不可或缺的一部分，就像火灾或建筑安全。


    网络风险格局不断变化。网络风险复杂且难以量化，特别是由于技术环境的快速变化以及缺乏理赔的历史数据。


    大型公司（如 `KPMG`、`Deloitte` 或 `Airbus`）、城市、政党甚至政府也是脆弱的并会遭受攻击的。那些做好准备的人正在管理危机，尽可能少地沟通，并避免泄露。


    所有公司都是潜在的受害者，无论其规模、活动还是地理位置，且背景多样，正如这组示例所示：


    *   – 核工业“并非例外”，国际原子能机构 (`IAEA`) 总主任在 2016 年表示“发生过针对核电站的随机恶意攻击”。

    *   – 太空工业，通过对控制中心进行“地面攻击”、对发射器或接收器的无线电进行干扰、数据拦截、接管（通过卫星发送的劫持、复制、盗取或修改的信息）。根据《世界报》2018
    年 9 月 7 日的报道，法国国防部长弗洛伦斯·帕里透露，俄罗斯卫星 `Luch-Olymp` 在 2017 年靠近一颗法比卫星“离得太近了”。


    '
