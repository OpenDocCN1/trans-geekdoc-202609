- raw: 'On the other hand, it can constitute a major strategic risk if competitors
    go faster and take market share, if the execution (commercial or production side)
    is not of good quality or if the dependence on distribution platforms is too high
    (the dereferencing of the platform can, in this case, be fatal to the company)
    and if the company is the victim of cyber-attacks or false information on the
    Internet.


    The digital technology will not be systematically retained by the boards of directors,
    who may prefer to maintain a significant amount of proximity to customers, while
    offering them the possibility of using digital tools, if they so wish. Complexity
    is the enemy of security.


    #### 2.5.2.1. *Several possible and complementary answers*


    *Compromises between security and agility*


    A Censuswide study shows that 94% of CIOs and CISOs make compromises with security
    to avoid affecting the company’s business.


    We all make compromises with our safety or with the safety of the company and
    risk taking. IT security is no exception to this reality. But, as with the physical
    security of a home, there are rules from which we cannot deviate, depending on
    where we live. Investing in a digicode and publishing the code on Facebook, or
    installing an intercom and letting everyone in without asking their name, would
    make no sense.


    Similarly, the most sophisticated surveillance tools, antivirus programs and firewalls
    are not useful if access management is not rigorously administered (remove temporary
    access given to external service providers, fixed-term employees, temporary workers,
    interns), if passwords are not updated regularly, if the information is not classified
    with access management in accordance with the company’s security policies and
    if the exchange of confidential information (e.g. board of directors’ information)
    is not strictly reserved for authorized persons, with secure storage and appropriate
    encryption.


    Sellers of ultra-secure solutions say it immediately when they present their miracle
    solution: the management of the tool, access, flows, the decision to encrypt or
    not is not their responsibility. It is therefore not enough to buy tools; it is
    also necessary to analyze the need, check the integration into the existing IT
    environment, train users in the functionalities of the tool, its objectives and
    points of vigilance and then appoint an administrator, who can define the rules,
    organization and processes, who is authorized to modify, update, add, delete a
    document.


    Updates are a good example of a source of compromise: according to the same study,
    81% of respondents indicate that they have already refrained from deploying a
    “significant” update and 52% from doing so several times, in order not to affect
    the company’s operations and avoid downtime, to avoid affecting legacy systems,
    or as a result of internal pressures from other company departments, for which
    the company’s resilience is not a priority: customers are the priority until the
    day when customers can no longer be served or billed.


    *Security from the start of the Security by Design project*


    The implementation of a new tool requires project management, and it is at the
    time of project management that the security constraints (confidentiality, integrity,
    accessibility) of information must be taken into account, by defining the rules,
    organization, procedures and administration over time of these rules. This is
    called *Privacy by Design*. When these security constraints are taken into account
    from the beginning of the project, this avoids security breaches and compliance
    work once the project is completed or in use.


    Moreover, at the time of design, options are also to be taken: for a given budget,
    what do we decide: to replace our door with an armored door, or with an unarmored
    door and an alarm system? Keep our identity and property documents and “family
    jewelry” in an easily accessible drawer, in an on-site safe or in an outdoor safe?


    Each project, whether it is an email, a website, an application or software implementation,
    requires a prior analysis of the risks and solutions to be implemented. What data
    will be collected, exchanged, saved?


    Is all this data useful? Which of these data are critical, sensitive, personal
    and confidential? Which ones should be protected? Who will have access to what?
    Are we in compliance with the law, the GDPR, in particular?


    ### **2.5.3. *The consequences of poor digital performance***


    To ensure compliance with regulations, it is necessary to identify the data collected,
    verify that they are collected with the consent of users and that they are stored
    in secure conditions (in conjunction with the CISO). These new regulations, which
    focus on the end user, can be considered as opportunities for business.


    Regardless of its size, the company is responsible: its managers and board of
    directors cannot rely on the CIO, the CISO or its IT service providers and must
    consider the organization, tools and processes to protect their strategic assets,
    their reputation and the (digital) trust that the company (the foundation or the
    association) enjoys from its customers and suppliers. Trust is slowly earned.


    A computer attack, improper handling, poor data access management, lack of data
    classification, lack of training and awareness of the value of information can
    have serious consequences. The confidence of customers and suppliers will be permanently
    reduced.


    It is recommended to use qualified service providers (especially for SMEs that
    do not have internal resources) to audit systems, organization and processes,
    raise awareness among internal and external stakeholders, recommend action plans
    and monitor their implementation.


    The company can also use tools, which can be used to assess the level of compliance
    and cybersecurity of the company that the company is about to acquire, as well
    as to manage risk mitigation indicators and solutions in accordance with the company’s
    operational and functional departments, all of which are data holders and therefore
    concerned by their protection.


    ### 2.5.4. *Cybersecurity*


    Cyberspace is becoming a battleground: it is not science fiction, it is a reality.
    A factory can explode with a bomb and also with computer equipment, as industries
    are connected. A connection means the risk of a computer attack.


    Cybersecurity involves many functions within organizations: general management,
    financial management, legal management, risk management, IT management, etc. Dialogue
    with project managers, sales or technical departments is essential: exchange on
    safety issues (what are the risks?) and solutions make it possible to become aware
    of potential safety problems and make informed decisions.


    The CISO is a partner and guardian of the temple; he/she should not forget this
    function and ask for arbitration if he/she thinks that certain measures or systems
    do not comply with the company’s rules. As with the security of property and people,
    IT security must be respected by all.


    ![Figure 2.3. Background: CISOs are not very confident in the ability of their
    COMEX to take into account cybersecurity issues (source: according to CESIN).
    For a color version of this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image85_c2890.jpg)


    **Figure 2.3.** *Background: CISOs are not very confident in the ability of their
    COMEX to take into account cybersecurity issues (source: according to CESIN).
    For a color version of this figure, see [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


    Internal governance is therefore essential: what are the roles and responsibilities
    of the various functions? Is the CISO dependent on the CIO? Who is the arbitrator
    in the event of a dispute? If the CISO is independent of the CIO, which is recommended,
    how does the CISO interact with the CIO, operations and functions, who does he/she
    report to and who arbitrates?'
