    This type of activist movement may not have a direct financial impact, but might
    have a significant media impact and therefore an impact that seriously damages
    the company’s reputation, as well as the reputation of its officers and directors.


    ### 1.2.3 Competitors (or States) for the purpose of espionage or sabotage


    Cyber espionage is very common, and small- and medium-sized enterprises (SMEs)
    are not immune.


    Ruag, a Swiss armaments and defense systems company, owned by the confederation,
    like other companies, is the target of computer attacks and has been infiltrated
    by malware for months. “According to initial evidence, the cyber-spyware attack
    on Ruag began in December 2014”, said Renato Kalbermatten, spokesman for the Federal
    Department of Defense.


    According to press reports, the cyber-attack on Ruag allowed hackers to access
    tens of thousands of pieces of sensitive information. MELANI, the Reporting and
    Analysis Centre for Information Assurance of the Swiss Confederation, describes
    this sophisticated cyber-attack in the technical report published on its website,
    `melani.admin.ch`.


    Here is an excerpt from the report:


    > The Swiss Federal Council has decided to publish this report to enable organizations
    to detect the presence of similar infections on their networks and highlight the
    attackers’ modus operandi. The attackers were very patient during the infiltration
    and lateral movement. They only addressed the targets of interest to them, using
    various measures (list of target IPs and complete digital fingerprint before and
    after initial infection). After entering the network, they made lateral movement
    by infecting other devices and obtaining higher privileges. One of their main
    targets was the `Active Directory`, which allowed them to control other devices
    and access data of interest to them using the rights and membership of the appropriate
    groups. The malware used `HTTP` to transfer the data to the outside.


    ### 1.2.34 Employees: the most frequent threat


    The threat may come from employees responsible for improper handling, which is
    not necessarily malicious: sending information to a recipient other than the one
    who was supposed to receive the information (the employee is sometimes a senior
    manager, in a hurry, stressed, inattentive).


    It is sometimes harmless, sometimes serious, and in any case, it is not ideal
    for image and reputation. Training (especially during recruitment), awareness
    and vigilance are key factors. But tools are not everything.


    The threat can come from careless employees: they are not really malicious, but
    they do not feel concerned about the information they are handling or the protection
    of their company. They are not “committed” and may not be sufficiently supervised.
    There is a responsibility on the part of managers and executives to implement
    rules and tools that prevent mistakes, as well as a culture to develop to improve
    employee engagement.


    It can come from untrained employees who will not have the necessary vigilance:
    recruitment manager who opens a `CV`, sent by a fake candidate (it is necessary
    to ensure the origin but it is sometimes difficult, and attacks are increasingly
    sophisticated), director/president who receives a fake update from his `Wikipedia`,
    and who hastily opens it to read the public information about him/her.


    It can come from malicious employees: sending files outside, clicking on a malicious
    email and opening doors with the complicity of the outside world.


    Finally, it can come from employees who are victims of blackmail; the excellent
    detective novel *Tension extrême* explains very well how intrusions succeed, even
    in ultra-secure environments, thanks to the exploitation of human weaknesses or
    oversized egos.


    In any case, it will be the coherence of the mechanisms, tools, organization,
    procedures, training and commitment that will make it possible to resist attacks.


    ### 1.2.35 The States


    The main subject of this book is not cyberwarfare, but it can have considerable
    impacts on companies (it already has several times). The cyber conflict is changing
    the geopolitical landscape, and it is to be taken into account in corporate strategy.


    The cyber war between States is no longer a secret and is the subject of many
    publications and declarations. The French Minister of Defense, Florence Parly,
    publicly presented, for the first time on January 18, 2019, the framework of France’s
    offensive computer warfare doctrine, and made a statement that could largely apply
    to companies.


    Here are some excerpts from this statement, which marks a change in the stance
    of States:


    > Stolen data. Spy mailboxes. Looted servers and disrupted information systems.
    Cyberspace has become a place of confrontation like any other. A place where thousands
    of hackers advance undetected. A place of impunity where some nations hide to
    attack better. A place of immense violence, which can permanently block us.


    > Let us recall `WannaCry`, which reached 150 countries.


    > This phenomenon is getting worse \[]. And we probably haven’t seen anything
    yet.

    '
  trans: '


    这种类型的活动运动可能不会产生直接的财务影响，但可能会产生巨大的媒体影响，从而严重损害公司及其高管和董事的声誉。


    ### 1.2.3 出于间谍或破坏目的的竞争对手（或国家）


    网络间谍非常常见，中小企业（SMEs）也无法幸免。


    Ruag 是一家由联邦政府拥有的瑞士军备和国防系统公司，与其他公司一样，它是计算机攻击的目标，并已被恶意软件渗透了数月。瑞士联邦国防部发言人 Renato
    Kalbermatten 表示：“根据初步证据，针对 Ruag 的网络间谍软件攻击于 2014 年 12 月。”


    根据媒体报道，针对 Ruag 的网络攻击允许黑客访问了数万份敏感信息。瑞士联邦信息安全报告与分析中心（MELANI）在其网站 `melani.admin.ch`
    发布的技术报告中描述了这次复杂的网络攻击。


    以下是该报告的节选：


    > 瑞士联邦委员会决定发布此报告，以便各机构检测到其网络中是否存在类似的感染，并强调攻击者的运作模式。攻击者在渗透和横向移动过程中非常有耐心。他们只针对自己感兴趣的目标，并采取各种措施（目标
    IP 列表以及初始感染前后的完整数字指纹）。进入网络后，他们通过感染其他设备和获取更高权限来进行横向移动。他们的主要目标之一是 `Active Directory`，这允许他们利用适当组的权限和成员身份控制其他设备并访问他们感兴趣的数据。恶意软件使用
    `HTTP` 将数据传输到外部。


    ### 1.2.34 员工：最频繁的威胁


    威胁可能来自负责处理不当的员工，这并不一定是恶意的：例如将信息发送给预期接收者以外的接收者（员工有时是高级经理，由于匆忙、压力大、注意力不集中）。


    这有时是无害的，有时是严重的，无论如何，对于形象和声誉来说都不是理想的。培训（特别是在招聘期间）、意识和警惕是关键因素。但工具并非一切。


    威胁可能来自粗心的员工：他们并不是真的有恶意，但他们对自己所处理的信息或对公司的保护并不关心。他们不够“投入”，并且可能没有得到足够的监督。经理和高管有责任实施防止错误的规则和工具，并培养一种文化来提高员工的参与度。


    它可能来自未经培训的员工，他们缺乏必要的警惕性：招聘经理打开了虚假候选人发送的 `CV`（有必要确保来源，但有时很困难，且攻击变得日益复杂）；董事/总裁收到一份来自其
    `Wikipedia` 的虚假更新，并匆忙打开以阅读关于他/她的公开信息。


    它可能来自恶意的员工：向外部发送文件、点击恶意邮件，并在外部世界的同谋下打开大门。


    最后，它可能来自受勒索受害的员工；优秀的侦探小说 *Tension extrême* 很好地解释了入侵是如何成功的，即使在极安全的环境中，这归功于对人类弱点或过度膨胀自尊心的利用。


    无论如何，只有机制、工具、组织、程序、培训和投入的协调，才能使抵御攻击成为可能。


    ### 1.2.35 国家


    本书的主题不是网络战，但它可能对公司产生重大影响（已经发生过多次）。网络冲突正在改变地缘政治格局，在企业战略中必须予以考虑。


    国家之间的网络战争不再是秘密，而是许多出版物和声明的主题。法国国防部长 Florence Parly 于 2019 年 1 月 18 日首次公开展示了法国进攻性计算机战争理论的框架，并发表了一项很大程度上适用于公司的声明。


    以下是该声明的节选，它标志着国家立场的变化：


    > 被盗取的数据。间谍邮箱。被洗劫的服务器和被破坏的信息系统。网络空间已成为一个与其他地方一样的对抗场所。一个成千上万的黑客在无人察觉的情况下推进的地方。一个某些国家躲在其中进行攻击的免责之地。一个充满巨大暴力、可能永久封锁我们的地方。


    > 回想 `WannaCry`，它影响了 150 个国家。


    > 这种现象正在恶化 \[]。而且我们可能什么还没见过。


    '
