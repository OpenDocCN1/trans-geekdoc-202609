    threat to the 4000 administrators surveyed are cybersecurity risks (after overregulation).


    Spencer Stuart’s survey of cybersecurity on boards of directors in the United
    States in 2017 reveals the following facts:


    * – most boards (69%) assign the responsibility for the oversight of cybersecurity
    to a committee of the board, while 26% say that the board as a whole manages cybersecurity
    risks.

