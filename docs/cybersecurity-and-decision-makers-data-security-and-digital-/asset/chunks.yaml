    ## 3.12. Decentralized mapping


    ### 3.12.1. The internal threat


    As already mentioned several times, the threat is very often internal, sometimes
    malicious, often negligent or misinformed. Seventy-five percent of internal incidents
    are reported to be accidental and unintentional.


    Former employees (or those in the departure phase) are a point of vigilance: one
    out of four internal incidents comes from a (former) malicious employee. How to
    identify them and prevent them from committing malicious acts?


    Do the functions (IT, human resources, legal and compliance) work together and
    with the business lines to establish a culture of cybersecurity and accountability?
    Has regular training been implemented to know the instructions and recognize threats?


    What are the most effective methods of awareness and training? Games? E-learning
    with augmented reality and adapted to the company’s environment? Fraudulent fake
    email campaigns sent to all staff?


    Written procedures distributed to all staff on data, systems, and mobile equipment?


    Are cyber incidents reported spontaneously (safe environment)?


    What human resources policies in terms of recruitment, training, mobility and
    understanding of cyber issues transfer from one function to another? When a person
    leaves the company voluntarily or not, what precautions are taken on the data
    they hold and process?


    Are access controls, encryption, backups or traffic monitoring in place and effective?


    What is the legal environment regarding the confidentiality of company information?
    The employment contract? The internal regulations? Is the legal department involved
    in the cyber plan for internal threats?


    Hackers know how to identify the employees to target: system administrators, with
    important privileges, IT helpdesk staff, management committee members. Trapped
    by highly targeted phishing attacks, they are an effective way to access the company’s
    infrastructure.


    Proper administration of access rights and the application of the principle of
    least privilege (rights of a user strictly limited to the needs of his/her work)
    remain essential to minimize the risks following the compromise of a user account:
    the fewer rights he/she has, the less effective the attack will be.


    Third parties, service providers, suppliers and subcontractors are more difficult
    to manage than employees, and must be subject to special treatment.


    ### 3.12.2. Industrial risks


    Industrial systems are much less secure than IT installations. Technologies are
    very heterogeneous in industrial environments. Network access is not always listed,
    data is not encrypted, systems are still configured with default passwords, while
    the lack of a security culture in industry makes it easier for attackers.


    The life cycles of industrial installations are long; so, they are more vulnerable
    to new risks, and the business links/security managers are sometimes (often?)
    too weak.


    Hervé Guillou stated this in 2016:


    > The cyber-risk for the company is of a transversal nature. But what we see is
    that it is unfortunately all too often associated with the company’s general IT
    and much less so with its industrial production environment, and almost never
    (except in banks) with the company’s products and services (operational IT). All
    too often, the cybersecurity manager of a company, when there is one, is the CIO/Chief
    Information Officer himself or, even worse, someone attached to him. It doesn’t
