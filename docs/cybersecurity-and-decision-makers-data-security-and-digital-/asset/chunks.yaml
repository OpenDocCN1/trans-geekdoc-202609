    H are often poorly protected: lack of resources, lack of budget, administrative
    burdens, governance difficulties (balance of power between the medical profession
    and functional teams) and furthermore cannot afford to stop their activities,
    for obvious reasons of risk to patients. They are therefore interesting targets
    for cybercriminals.


    Cybersecurity Ventures predicts that computer attacks through ransom (malware
    that takes personal data hostage: it encrypts personal data and then asks its
    owner to send money in exchange for the key to decrypt it) will increase fivefold
    between 2018 and 2021.


    In the United States, the U.S. Food and Drug Administration (`FDA`) warned on
    March 21, 2019, that some of `Medtronic`’s connected medical devices, including
    implantable cardiac defibrillators, had cybersecurity vulnerabilities.


    “Companies must take steps to monitor and assess cyber security vulnerability
    risks, and be proactive in disclosing them”, it insists.


    It recalls that “any medical device connected to a communication network” may
    have security breaches, although these devices and software “may also offer a
    safer, more convenient and faster delivery of care”.


    By October 2018, `Medtronic` had to disable Internet updates for some 34,000 `CareLink`
    programming devices for healthcare professionals worldwide to access existing
    pacemakers, as it found the system vulnerable to cyber-attacks.


    ### 1.5.4. Tourism and business hotels


    The tourism and business hotel sector has been attacked many times in recent years:
    the theft of names, postal addresses and emails, the company name and telephone
    number of `Radisson Rewards` program members were disclosed in October 2018. They
    were notified so that they could detect any suspicious activity, and `Radisson`
    recommended that they not respond to any requests from the `Rewards` program regarding
    their personal information, including usernames and passwords.


    In June 2018, the hotel reservation site `Fastbooking`, a subsidiary of `AccorHotels`,
    was hacked, and the names, email addresses and credit card numbers of hundreds
    of hotels’ customers were hacked (reservations of May and June 2017).


    In March 2018, `Orbitz`, a subsidiary of `Expedia`, became aware of a major piracy
    that targeted it between January 2016 and December 2017. For nearly 24 months,
    a security breach was therefore present on the site specialized in booking flights,
    as well as online travel.


    In 2016, `Hyatt Hotels Corporation` reported a theft of credit card data from
    250 hotels. In the same year, `Hilton`, `Mandarin Oriental`, `Trump Hotels` and
    `Starwood Hotels & Resorts Worldwide` were the target of computer attacks.


    The hacking of personal data held by hotel chains is a problem for people who
    can then be victims of fraud and identity theft; sometimes, it is also confidential
    data concerning the movement of personalities.


    ### 1.5.5. Critical national infrastructure


    #### 1.5.5.1. Military Programming Act


    IT problems that could be attributed to critical national infrastructure could
    have systemic consequences on the functioning of the country and beyond: approximately
    in France, 200 entities are considered as critical national infrastructure in
    the transport, energy, finance, health and telecommunications sectors. These companies
    are particularly supervised by the State and are subject to regulatory obligations:
    `LPM`, or Military Programming Law, adopted in 2013, decree published in 2015
    and European `NIS` directive, adopted in 2016.


    `ANSSI`‘s mission is to support operators of vital importance in securing their
    sensitive information systems. This system has made it possible to identify private
    and public critical national infrastructure that operate or use facilities considered
    essential for the nation’s survival.


    The 2013 `LPM` imposes a number of rules relating to the cybersecurity of critical
    national infrastructure and defines their responsibilities and obligations in
    terms of protecting their critical information systems.


    It thus requires critical national infrastructure to have their `VISs` (vital
    information systems) audited by qualified organizations (`SSI audit providers`)
    and to implement security measures for information systems and qualified detection
    systems. Critical national infrastructure must also immediately report `ISS` incidents
    that significantly affect their `ISS`.


    The various cybersecurity rules of the critical national infrastructure concern
    the control of information systems (mapping and maintaining security conditions),
    the management of security incidents (logs of key events and analysis of these
    logs, implementation of sensors to detect anomalies, implementation of an incident
    management organization, processing of alerts, incident processing, crisis management)
    and system protection (identification, authentication, access management, administrator
    account management, information system partitioning, flow management, remote access,
    update management, procedures for installing new equipment or implementing new
    services).


    #### 1.5.2. Issues for officers and directors


    Since compliance is a major point of vigilance for the board of directors, the
    directors of qualified critical national infrastructure companies will be required
    to understand the risks and ensure compliance with these rules.


    Directors of companies that are not critical to national infrastructure can also
    use these rules as a model to improve the cybersecurity maturity of their companies.


    ## 1.6. Responsibilities of officers and directors


    All sectors are concerned, and the sustainability of the company is at stake,
    because attacks can be serious, the value of the company can be brutally impacted,
    and the shareholders of a listed company or a large family business, as well as
    stakeholders, can therefore legitimately question whether the board of directors
    and shareholders have been concerned about this issue and have taken the necessary
    measures.


    Are they competent? Did they ask the right questions? What information do they
    receive?


