    - video surveillance cameras can be transformed into botnets, a network of machines
    used without the owner’s knowledge to carry out denial of service attacks against
    companies (simultaneous sending thousands of requests in order to saturate servers
    within companies).


    The development of connected objects is a growing opportunity for cybercriminals,
    as security is not the priority in the design of connected objects for the general
    public: it represents a cost, and users are not willing to pay more for a more
    secure object.


    Industrially connected objects constitute a new attack surface and therefore new
    security risks, which must be taken into account in companies.


    `Mirai` malware is known in this field: devices infected by `Mirai` search the
    Internet for IP addresses corresponding to connected objects. Once spotted, they
    are used to attack a target and are difficult for the target to spot.


    The democratization of connected objects should give rise to new scams or new
    possibilities to undermine cryptocurrency. It will also give rise to new regulations:
    Margot James, the British Digital Secretary, introduced a bill in May 2019 to
    counter cyber-attacks. This new law will require all devices connected to the
    Internet, such as household appliances, webcams or smart thermostats, to be sold
    with a unique password, whereas they are currently sold with hard-coded default
    passwords. The law will also require manufacturers to provide a public contact
    point so that researchers and hackers can submit vulnerabilities of the connected
    devices. They will also have to inform consumers of the safety update times for
    each device. Finally, this law will lead to the creation of a new labeling system
    in the form of security by design, to ensure that products have integrated safety
    features from the design stage.


    ![Figure 3.4. Security breaches, the most striking feature of IoTs ¶ (source:
    according to CESIN)](image/image113_c2906.jpg)


    **Figure 3.4.** *Security breaches, the most striking feature of IoTs* ¶ *(source:
    according to CESIN)*


    ### Connected toys


    “There are a whole series of serious problems concerning children’s toys, connected
    watches and intelligent robots, with the possibility of recording and transferring
    data”, explains Ursula Pachl, Deputy Director General of the European Consumer
    Organization (BEUC).


    Anyone within a 15 meter radius can connect to the “my friend Cayla” doll, the
    report explains. “Simply turn on the Bluetooth on your phone and press the doll’s
    name to be able to play any audio file via the doll, which then turns into a remotely
    connected speaker”.


    This means that a stranger outside the doll’s home would have the ability to connect,
    extract the data contained in the toy’s memory and inject their own messages into
    it. “So a stranger can take control of the toy to communicate with your child”,
    concludes Ursula Pachl.


    ### Voice assistants


    Tens of millions of people use voice assistants to find and play music, turn on
    the light or ask for directions.


    According to a Bloomberg report dated April 11, 2019, [Amazon.com](http://Amazon.com)
    employs hundreds of people worldwide to improve the `Alexa` voice assistant. These
    people listen to the recordings from the users’ homes or offices, and are then
    integrated into the software, in order to improve the understanding of the human
    voice in different languages and thus provide a better response to the request.


    Employees sign confidentiality agreements, and Amazon has procedures in place
    to ensure that the system is not diverted from its purpose and that employees
    can either cut passages from the recording or share information when they witness
    particular situations (people at risk, abuse, crime, etc.) or have access to confidential
    information (credit card number, health, political or religious opinions, etc.).


    According to Amazon, employees cannot identify the people they are listening to.
    But why has this voice assistant been commercialized when it is not yet working
    well?


    The reputation of the company that integrates these voice assistants could be
    impacted: `Orange` for its connected speakers, `Qualcomm` and its headsets, `US
    Bank` and its banking services, `Legrand` and its switches. Are end-users informed?
    Did Amazon’s listening take place, in agreement with the company selling the product?
    Has the final customer given his or her consent and is he or she alerted each
    time he or she is registered?


    What are the rules of confidentiality (link between the user and the registration)?


    Is the customer well informed of the ability to say no to listening and does the
    company that integrates the voice assistant into its products have the ability
    to audit, to ensure that Amazon does not listen to those who have said no?


    What are the current rules regarding data? Are the recordings transmitted to Amazon
    studios securely, and are they stored (and for how long) or destroyed?


    Beyond compliance issues, these are questions that arise for users. Amazon, in
    its marketing presentations and privacy policies, does not clearly explain that
    the recordings will be listened to by its teams.


    Users have the ability to disable the ability to record their voices, but Amazon
    indicates that the recordings can still be analyzed “manually”. These are transmitted
    with the owner’s first name and the serial number of the device.


    Amazon is not the only company to market this type of device: `Google Home` and
    `HomePod` appeared before `Alexa`. A total of 78 million voice assistants were
    sold in 2018.


    ### Security measures for connected objects


    A minimum of security can be provided by the user, individual or professional:
    close unnecessary ports and avoid default passwords at all costs, accept automatic
    updates as soon as their device is switched on, avoid unencrypted communications,
    a technical capacity available today on very inexpensive systems. Sellers of connected
    objects should draw users’ attention to these issues. California is the first
    state in the United States to adopt a law on connected objects.


    This law will come into force in 2020, will require any manufacturer of connected
    objects to provide it with functions to “protect the device and the information
    it contains against unauthorized access, destruction, use, modification or disclosure”,
    and will apply to all objects sold in California.


    The device must have a unique password, and the user must define a password when
    logging in for the first time. There are no longer generic default identifiers
    that are too easy for cyber pirates to guess.


    ## 3.13 Insurance


    Insurance is beginning to offer a response to the many potential harms of cyber-risk:
    data recovery costs, crisis management assistance, image recovery assistance,
    cost of corporate liability claims by those who have had their data hacked.


    ![Figure 3.5. Companies are increasingly subscribing to cyber insurance (source:
    according to CESIN). For a color version of this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image116_c2907.jpg)


    **Figure 3.5.** *Companies are increasingly subscribing to cyber insurance (source:
    according to CESIN). For a color version of this figure, see [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


    The insurance of these risks is not always implemented. The value of stolen data
    is complicated to assess, and the insurance policy will not prevent attacks but
    will intervene to deal with the financial and other consequences of cyber-attacks.


    It is therefore recommended to check whether the contract covers cyber events,
    the information system and the cost of business interruption, the audit to understand
    the facts, the reconstruction of what has been destroyed, damage to third parties,
    and image risk.

