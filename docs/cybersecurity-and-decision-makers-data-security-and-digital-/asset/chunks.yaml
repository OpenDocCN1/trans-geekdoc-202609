    # 2015 年 4 月 8 日，凌晨三点左右


    在 Mercure 大楼，即法国网络安全局（ANSSI）位于巴黎的极保密办公区内，电话响了。电话线端端是 TV5 Monde。这家法语电视电台的技术人员已经与一场前所未有的计算机攻击战斗了几个小时：其网站和社交网络账户正在播放圣战分子宣传内容，图像制作系统无法使用，广播被中断。这家向
    20 个国家、5000 万观众提供服务的电台，正显示着一片黑屏。


    黎明时分，会议举行了。圆桌旁坐着 TV5 Monde 团队、专门负责网络犯罪的国家警察部门、国内情报机构以及 ANSSI。该机构负责防御国家关键 IT 系统和最敏感的企业，理论上他们并不参与针对电视电台的攻击。但这次事件是前所未有的，且已经公开，并触及了世界上“法国之声”之一：当局决定紧急派遣
    ANSSI 的“计算机消防员”前往电台现场。


    这些干预对这些人员来说是常有的事，他们每年大约执行 20 次类似的行动。在正常时期，这些行动——在关键企业或基础国家系统中——都是在完全保密的情况下进行的。TV5
    Monde 是一个特例：损害是即时且高度可见的。这是 ANSSI 成员的工作首次如此大规模地为人所知。在该事件发生两年后，他们于 6 月 9 日在勒芒举行的信息与通信安全研讨会（SSTIC）上详细介绍了这次干预行动。这是
    ANSSI 首次在公众场合进行此类展示活动。


    这也是 ANSSI 首次公开给予自己一个分享经验的机会。


    ## 在前 48 小时内


    这群人数在 9 到 15 人之间的人员（被动员了数周）寻找寻找攻击者留下的最显眼的线索。就像在敌军离开后穿梭于街道上的拆弹专家一样，他们也担心“逻辑炸弹”的存在——即攻击者留下的代码行，这些代码设计用于在受感染系统重启时激活，旨在进一步瘫痪网络。这种恐惧最终并没有发生。


    从调查的最初几个小时开始，人员的注意力被 TV5 Monde 计算机网络上的一个英文账户吸引，该账户配置为法语，且拥有巨大的权限。问题是：它不属于 TV5
    Monde 的技术团队，而是属于黑客。调查人员成功重构了它的最后操作，并意识到它连接到了 TV5 Monde 网络之外互联网上的未知服务器。他们获取了 IP
    地址，即该服务器在互联网上的标识符。这是试图理解谁是这次攻击背后巨大拼图的第一碎片。


    在调查过程中，ANSSI 收集了大量数据进行分析，包括黑客在网络上执行的所有操作进度。他们花了几周时间才详细理解攻击者是如何渗透 TV5 Monde 网络并摧毁路径上几乎所有东西的。


    ## 攻击过程


    进攻始于 1 月 23 日。攻击者从远处观察 TV5 Monde 的网络基础设施。他们发现可以通过虚拟专用网络（`VPN`）从外部连接到电台的内部网络。他们正是这样做的，使用了属于电台分包商的标识符和密码。他们是如何获得这些信息的？这是调查中少数几个未知数之一。事实是，攻击者已经渗透了他们正在仔细监控的
    TV5 Monde 网络。


    一旦进入内部，他们就赋予了自己全权的权限：这种追踪允许他们定位两个非常特定的服务器，这些服务器控制着电视机的摄像头。黑客使用这两个服务器中的一个连接到系统，该系统负责决定网络上的每台计算机允许做什么或不能做什么。圣杯：一旦进入内部，他们就能赋予自己全权的权限。


    ## 渗透与数据去标识名化


    然后，黑客开始四处窥探。他们沉浸在 TV5 Monde IT 部门的内部文档、消息传递和搜索中，寻找任何可以允许他们继续渗透的信息。他们输入的关键词非常精确：他们想知道网络是如何组织和配置的，具体来说是管理电台广播视频流的那个网络。从一开始，他们对这家法语电台的图像传输系统感兴趣。


    这次收获是成功的，黑客找回了大量信息，包括各种机器的 ID 和密码。在过去的几周里，黑客表现得非常谨慎。这段期间没有记录到任何活动。ANSSI 官员怀疑这段时间被用于分析、理解甚至翻译收集到的数据。这样做是为了更有针对性地回来，首先是检查已找回要素的有效性。攻击者检查了访问社交网络的密码是否有效。那时是
    4 月 6 日，即攻击本身发生前两天。


    4 月 8 日下午 3:40，黑客对 TV5 Monde 网络进行了最后检查。他们在显眼位置放置了标准的间谍软件。奇怪的是，后者从未被激活。根据 ANSSI
    官员的说法，这种任何在网上的人都能轻松获取的恶意软件可能是被留着作为诱饵，以误导调查人员。


    ## 进攻的开始


    晚上 7:57，袭击者开始了他的“拆除工作”。他修改了复用器的参数——即管理和引导电台大负量视频流的计算机——导致它们无法重启。这种更改在这些设备被关闭之前是不可见的，而电台仍在继续传输。第一个可见的动作发生在晚上
    8:58，当时社交网络账户变成了一个神秘“网络哈里发国”的颜色，并展示了对“伊斯兰国”组织的支持。TV5 Monde 的视频流被中断，屏幕一片黑暗。


    晚上 9:48，另一次攻击发生。攻击者连接到 TV5 Monde 网络的几个关键部分并并毁了使其运行的软件。TV5 Monde 的视频流被中断，屏幕一片黑暗。


    在不幸中，TV5 Monde 也是幸运的：一个新频道刚刚上线，许多技术人员深夜仍在现场庆祝它的开通。他们立即做出了反应。他们的任务因黑客的新一轮攻击变得复杂，黑客在晚上
    10:40 关闭了公司的内部消息系统。此时，TV5 Monde 的团队已完全失去对网络的控制。午夜前不久，他们采取了停止攻击的唯一决定：将网络与世界完全隔离开。


    黑客失了手，但 ANSSI 成员在清晨抵达时，面对的是一片数字废墟。他们来帮助那些无助但有能力且非常配合的技术团队。这些以行事著称的 ANSSI 专家们从未面对过如此巨大的媒体压力。摄像机驻守在电台的门口。TV5
    Monde 的记者们的工作占据了头条，试图从他们那里获取信息，这损害了调查最初几个小时的极端敏感性。官员们不得不密封他们为此准备的危机室玻璃门，以防被看到，躲避走廊里的摄像机，并在摄像机冲进房间时躲到桌子下隐藏屏幕。


    '
