- raw: 'Since this incident, companies in the film industry have become extremely
    secure: external service providers, such as dubbing companies, receive encrypted
    files, file reading requires double or triple authentication and tasks are separated
    so that a very limited number of people have access to the entire film. Access
    to the editing, dubbing and recording rooms is very secure (access by badge or
    facial recognition). Information flows are constantly monitored. An anomaly can
    thus be quickly detected and the perpetrator identified and sanctioned.


    ### **1.5.2. *Banks***


    Although no bank is immune to an incident, banks have strengthened their IT security
    over many years, particularly under the authority of the EBA (European Banking
    Authority) or the ACPR (French Prudential Supervision and Resolution Authority),
    which consider this risk as a main risk, in particular, because the information
    systems of banks, financial markets, customers and suppliers are interconnected.


    All the banks’ branches of activity are affected by digital transformation: their
    market activities, the operations of their individual (BtoC) or corporate (BtoB)
    customers, the setting up of financing and data processing (the volume of data
    processed by banks is huge) which is a crucial issue in terms of the development
    of services, new products and therefore of competitive advantage.


    Cybersecurity threats are therefore a major concern for banks, which are required
    to strengthen their IT resources and control systems. Cyber-attacks on banks or
    banking networks in recent years have highlighted this risk and the potential
    impacts on banks’ production or brand image.


    Digital trust is critical for banks: how can customers trust a bank, if it does
    not ensure the functioning and security of means of payment, accessibility to
    quality information, if it is a victim of theft, if transfers are made without
    its knowledge and without its customers’ knowledge and if it cannot protect its
    customers’ data?


    The ACPR (*Autorité de contrôle prudentiel et de résolution*) has identified three
    main risk themes: organization of the information system and its security, operation
    of the information system and information system security.


    FINMA (Swiss Federal Financial Market Supervisory Authority) sees cyber-attacks
    as the main risk for banks (March 27, 2018). The head of FINMA points out that
    the effectiveness of a defense system is measured by its weakest link and invites
    the players in the sector to redouble their efforts in this area.


    The latest statistics published by the Reporting and Analysis Centre for Information
    Assurance (MELANI) in Switzerland show that two-thirds of all cyber-attacks recorded
    concern the financial sector.


    There are up to 100 attacks per day on e-banking solutions in Switzerland.


    The cyber subject is at the top of the concerns of the managers of the big banks.
    The number of intrusions into financial institutions’ computer systems has tripled
    over the past five years, according to a study conducted by Accenture and the
    American research institute Ponemon among 254 companies in seven countries (France,
    Italy, Japan, the United States, Germany, Italy and Australia).


    Banks and other insurers are subjected to an average of 125 intrusions into their
    systems each year, compared with just 40 in 2012, compared with an average of
    130 intrusions into companies outside the banking sector each year. It seems that
    these attacks have no financial impact (at least that is what the banks say).


    But while these repeated security breaches result in few revenue losses, they
    disrupt service and threaten the integrity of customers’ data and assets. They
    have an impact on the quality of service (“service suspensions are due to maintenance
    operations”) and on the confidence that customers have in their banks. How to
    entrust your money to a bank that regularly offers online services that are inaccessible?


    The spectrum of denial of service can be defined as follows: “Banks have become
    more resilient than other economic actors to traditional attacks such as malware,
    but they remain very sensitive to attacks that saturate their systems and cause
    denial of service”, said Accenture. At the end of January 2018, ING, Rabobank
    and ABN Amro banks were attacked by “denial of service” (server sending massive
    simultaneous requests): these banks were unable to provide access to their online
    services in the Netherlands for several hours.


    This more sophisticated type of threat is also the most expensive[³](#c01.xhtml#pg33fne0c1).
    On average, according to the study, institutions spend $250,000 to deal with a
    denial of service compared to less than $100,000 for an attack using software
    that takes data hostage (ransom) or any other malicious software.


    This encourages the inflation of cybercrime costs, which have increased considerably
    over the last three years in the financial sector. On average, according to the
    study, companies spent $18.28 million in 2017 to protect themselves, compared
    to $12.97 million in 2014. These amounts far exceed those committed by players
    in industry, aeronautics, technology and health: the report estimates that all
    sectors of activity commit $11.7 million per year to protect themselves.


    With the rise of mobile banking and new technologies, the threat promises to increase.


    As Laurent Mignon, current CEO of the BPCE group, stated on February 16, 2018,
    in *Les Échos* – he was then CEO of Natixis – “the only systemic risk for the
    banking system is cyber-risk”, while adding: “The financial system is more aware
    of this risk than other industries. The regulator has been ensuring that it has
    been taken into account for many years”.


    In May 2019, Sabine Lautenschläger, member of the Executive Board of the European
    Central Bank (ECB), reported that between July 2017 and September 2018, 66 major
    IT security incidents were reported to the ECB. “I am afraid that the incident
    report we have at our disposal will not provide an overview of the situation”,
    she added.


    As a reminder, the first major cyber-attack targeting a European banking institution
    occurred in 2016: the accounts of 40,000 customers of Tesco Bank, a subsidiary
    of the British supermarket chain, had been hacked, 20,000 of whom were reportedly
    fraudulently withdrawn. In January 2017, a denial of service attack targeted several
    major British banks and made Lloyds Bank’s online services unavailable for two
    days.


    In June 2019, for the first time, a simulation of a cross-border cyber-attack
    in finance is being organized by G7 members, as announced by the French authorities.
    Coordinated by the Banque de France, this exercise must involve 24 financial authorities
    (central banks, supervisors, ministries of finance, market authorities) from seven
    countries. Representatives of the private sector in France, Italy, Germany and
    Japan will also be involved:


    > Beyond that, according to François Villeroy de Galhau, it is also necessary
    to work on a ‘common categorization’ of cyber incidents and to provide more information
    to measure the intensity and sophistication of threats and their evolution.[⁴](#c01.xhtml#pg34fne0c1)


    “It is time for financial institutions to take radical measures to strengthen
    their fight against cyber-attacks. It is expensive and complex, but absolutely
    necessary”, said Bruno Lemaire, the French Finance Minister, in May 2019.


    ### **1.5.3. *Health***


    The health sector, and, in particular, hospitals, is one of the sectors that is
    subject to repeated attacks and in which security investments are insufficient,
    although cybersecurity is considered a major issue by health equipment suppliers.


    Indeed, medical records also include information relating to mutual insurance
    or insurance contracts, and billing information, which allows us to identity theft
    and lucrative fraud.'
