    *   Centralized management server, which processes three types of information:
    moving information (broadcast by email, instant messaging, or on the Web), stored
    information (static data on a server) and processed information (transmitted from
    computers to USB sticks or by printing, for example). An internal company policy
    will be defined on the centralized management of this information.

    *   Control of email flows and redirection of sensitive emails to a manager who
    will then agree whether or not to send the email.

    *   Network controller: server that scans web activity, locates and controls information.
