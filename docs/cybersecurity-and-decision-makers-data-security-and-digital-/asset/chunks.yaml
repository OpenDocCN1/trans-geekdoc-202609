- raw: '*   – In May 2019, *Le Parisien* announced that “Picoty SA, a company specializing
    in fuel distribution in the Creuse, a remote area in the center of France, was
    the victim of a ransom attack: the company’s computer system was attacked by a
    file encryption system. Cybercriminals then demanded 500,000 euros so that the
    company could recover access to it”;


    *   – On June 14, 2019, according to AFP, a complaint about a cyber-attack on
    the ransom system was filed in the Zaventem police zone by Asco Industries, a
    Belgian subcontractor, in particular, of major manufacturers such as Airbus, Boeing,
    Bombardier and Lockheed Martin. The Belgian plant was closed for several days;
    the other sites in the United States, Canada and Germany were also shut down.
    “We are currently working hard to get our business up and running as quickly as
    possible and to serve our customers”, said a company spokeswoman.


    #### 1.4.1.5. *The worst shoemakers in the world*


    On April 17, 2019, the American company Verint, a leader in surveillance and cyber
    intelligence, operating mainly in Israel, was reportedly attacked by *ransomware*,
    while most of the leaders were attending a conference in Italy. The attack would
    have been identified very quickly and the security teams could have reacted quickly.
    No one is safe.


    *Le Canard enchaîné* from February 13, 2019, revealed data leaks from CLUSIF (*Club
    des experts en sécurité informatique français*), which did not take the necessary
    precautions.


    Indeed, more than 2,200 names and personal details (surnames, first names, email
    addresses, mobile phone number) of the main IT security directors and conference
    participants were freely accessible on the CLUSIF website.


    This list included the contact details of the CISO (Chief Information Security
    Officer) of the Presidency of the Republic, as well as the contact details of
    officials of the Nuclear Safety Authority (NSA), experts from the Armed Forces
    Staff, Matignon, the Senate, arms manufacturers or banks, declares *Le Canard
    enchainné*.


    To retrieve this list, all you had to do was search with the keywords “Clusif”
    and “csv”. The file was hosted by CLUSIF, but not well protected. A common human
    error in website management.


    To prevent the leakage of sensitive data, while compliance with security rules
    is essential, supervision by competent persons of the application of these standards
    is essential.


    ### **1.4.2. *Testimonials versus silence***


    With the exception of Yves Bigot, CEO of TV5 Monde, who was attacked in 2015,
    few business leaders agreed to publicly testify about the crisis, the failures
    of its information systems, its processes, the training of its employees, the
    lack of awareness of the risks and consequences of an attack, the investments
    to be made, the discipline to be implemented and the budgets to be allocated.


    Following these incidents, which almost cost TV5 Monde their livelihood, Yves
    Bigot spoke at numerous conferences. There is nothing like this testimony to understand
    the risks and put in place the necessary measures to avoid such a traumatic experience.


    In France, there is also a “before Saint-Gobain” and “after Saint-Gobain”. Pierre-André
    Chalendar, CEO of Saint-Gobain, did not publicly testify when this major French
    company was attacked.


    On the other hand, he testified, confidentially, to the boards of directors and
    executive committees of CAC 40 companies so that the directors and officers could
    take up the subject. Testimonies are therefore rare, which is a pity, because
    they are effective.


    Silence is the most common practice; it is detrimental to the divulgation of information
    that would allow for a better and faster response.


    The clubs of IT safety or security managers are virtuous; they allow you to exchange,
    learn, progress and defend yourself better.


    ### **1.4.3. *Trends***


    #### 1.4.3.1. *Cybercriminal methods*


    Cyber-attacks are improving and evolving. The attack surfaces are growing: mobility,
    cloud, connected objects and, at the same time, the ability of targets to monitor,
    detect and protect themselves from attackers are increasing.


    Targets are therefore increasingly attacked often via their suppliers, subcontractors,
    partners and service providers: it has become more complicated to go through the
    door; so, the attacker will go through the window.


    #### 1.4.3.2. *The attackers*


    Attackers are progressing; they are always one step ahead: cryptomining, IoT (Internet
    of Things) networks to launch attacks, APT (Advanced Persistent Threats) are the
    techniques recently developed to reach targets, their computer systems and data,
    destabilize (disclose customer IDs, passwords and personal data) and sabotage
    critical systems (industrial system shutdowns).


    Targeting victims is now a priority over massive attacks. It is more lucrative
    and more efficient.


    #### 1.4.3.3. *Connected objects*


    To raise awareness and encourage citizens in Japan to better protect themselves,
    the National Institute of Information and Communications Technology has tried
    to hack into citizens’ connected objects, starting in February 2019: the organization
    will try to use default passwords and other basic passwords from dictionaries
    to try to infiltrate 200 million connected objects randomly selected from households
    across the country.


    Initially, routers and webcams will be targeted. Thereafter, the government will
    attack the connected objects of the Smart Home.


    Owners of successfully hacked devices will – in principle – be informed and asked
    to urgently change their passwords for more reliable identifiers. However, they
    will not be forced to do so. The initiative could be extended for the next five
    years.


    #### 1.4.3.4. *Cyberwarfare*


    Spying and sabotage operations, as well as information warfare, are now carried
    out by digital means and are at the forefront of strategic action, as Jean-Louis
    Gergorin and Léo Isaac-Dognin explain in their book *Cyber. La guerre permanente*,
    published in 2018. They very clearly detail this new form of warfare: digital
    technology makes it possible to act at a distance and offers a paralyzing and
    reversible capability. Moreover, it considerably increases the global reach, instantaneous
    speed and power of intelligence, influence and clandestine action (difficulty
    of attribution) with a low cost (which significantly modifies the balances between
    major powers) and a high targeting capacity.


    Cyberwarfare between States can impact not only governments but also sensitive
    public organizations and, more seriously, critical national infrastructure (energy,
    telecommunications, defense, etc.) and by extension (or directly) companies.


    The alliance of 29 NATO member countries recognized cyberspace as a domain of
    war, as well as land, air and sea, in 2014. In late 2018, member countries declared
    that NATO would establish a cyberspace operations center to coordinate NATO’s
    cyber activities. NATO also discussed integrating each country’s IT capabilities
    into Alliance operations.


    In September 2018, the White House warned foreign hackers that it would increase
    offensive measures as part of a new national cyber security strategy. US intelligence
    officials were expecting a series of digital attacks before the November 6 elections.


    The United States announced in 2019 that it will use offensive and defensive IT
    capabilities on behalf of NATO.


    ### 1.4.4. *Examples*


    #### 1.4.4.1. *Information leaks*


    Information leaks can be the result of misuse or negligence, including by managers,
    consultants or IT service providers: data are sent by mistake to one contact instead
    of another, database access management is unreliable, passwords are left visible,
    or easy to guess, passwords are not updated regularly, software is not updated,
    double authentication recommendations are not respected, confidential data is
    accessible, transferable and able to be copied. Websites are not secure either.'
