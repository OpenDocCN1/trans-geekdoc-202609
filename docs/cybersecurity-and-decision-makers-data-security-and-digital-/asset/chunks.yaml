    The dispersion of professions and the lack of employee support create a significant
    gap between cybersecurity practices and the cyberculture desired by companies.


    For all companies, cultural adherence to cybersecurity is essential, but in practice,
    employees, who are usually the only barrier against phishing attacks, do not have
    the necessary culture to protect their company.


    As revealed by the survey conducted by the Audit Guide to Digital Enterprise Information
    System Governance (`ISACA`), 95% of companies believe that there is a gap between
    their current cybersecurity culture and the desired culture. In practice, employees
    are not sufficiently trained, if at all, and can be negligent, confirming that
    the human aspect of cybersecurity remains essential.


    Yet, 80% of organizations report that they train their employees and communicate
    rules of behavior to improve their cyberculture. But the reference study shows
    that the latter is lacking. While the cybersecurity culture is “desirable”, it
    is limited by the lack of employee buy-in at 41% and the disparity of business
    units at 39%.


    Cybersecurity is not only a matter for the `CIO` and `CISO`. The `ISACA` survey
    shows that cultural changes are the responsibility of `CIOs`, as well as of human
    resources. To share the sense of responsibility for security and to bridge the
    gap, the security culture must be inclusive, which means that it is recommended
    to involve employees in cybersecurity discussions, define security protocols for
    new employees as early as their integration process, define security needs based
    on departmental risk profiles and organize simulated cyber-attack exercises.


    ## 5.8. The dashboard for officers and directors


    The dashboard is a good practice. It must, of course, be adapted to the type of
    company (its sector of activity), its size and the recipients. It must be considered
    as a work tool, a communication tool and a decision-making tool. It will be more
    or less synthetic depending on the recipients: board of directors, executive committee,
    business lines, IT department, `CISO`. It will evolve according to needs, priorities
    and understanding of the issues. It will be shared with each member of the executive
    committee. It is important to indicate who is responsible for the information
    provided and the actions taken.


    An example of a dashboard is provided in [Appendix 1](#b02.xhtml#app1-1).


    1. [1](#c05.xhtml#pg133a1) Source: `CISO` Benchmark Study 2019.

    2. [2](#c05.xhtml#pg140a1) Source: Gilbert Kallenborn, article published on April
    13, 2019, in 01Net.com.


    # 6 Resilience and Crisis Management


    ## 6.1. How to ensure resilience?


    Among the organizations that manage a large `CSIRP`, 54% (53% in France) do not
    conduct regular stress tests. More than one in two organizations admit to having
    been the target of an incident or data breach in the past 12 months.


    However, according to another `IBM`-sponsored `Ponemon Institute` study, companies
    that contained a data breach in less than 30 days saved more than $1 million on
    the total cost of the incident.


    Guides or assessment tools have been developed for SMEs by national information
    system security agencies (or equivalent) to help companies assess their needs
    and put in place the main measures to ensure the company’s resilience.


    The Swiss Confederation has developed an `ICT` standard, which provides Swiss
    companies, particularly critical infrastructure operators in Switzerland, with
    guidelines for improving the resilience of their IT systems and infrastructures
    to cyber-risks.


    The standard includes a reference guide with organizational or technical principles
    to protect against cyber threats. In addition, it provides a tool that allows
    companies to assess the degree of their IT resilience (or have it audited by external
    parties).


    It also provides companies with a framework that provides users with a series
    of concrete measures to implement: identify, protect, detect (set up permanent
    network monitoring to detect potential cybersecurity incidents, as well as to
    ensure that malware can be detected), react, ensure that the lessons learned from
    previous cybersecurity incidents are integrated into their response plans and
    recover (restore back-ups, restart systems).


    ![Figure 6.1. Preparing for a major cyber-attack: less than one in two companies
    feels able to manage such a cyber-attack (source: according to CESIN). For a color
    version of this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image170_c2916.jpg)


    **Figure 6.1.** Preparing for a major cyber-attack: less than one in two companies
    feels able to manage such a cyber-attack (source: according to `CESIN`). For a
    color version of this figure, see [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)


    Finally, a database will also allow a company to compare itself anonymously with
    others in its sector. This standard exists for the electricity sector.


    The development of a minimum IT security standard for energy suppliers is seen
    as a way to reduce the vulnerability of the Swiss energy sector to cyber-attack
    that could lead to a cyber blackout. After the electricity sector, other sectors
    will follow, including waste water disposal, gas supply, logistics and telecommunications.


    ![Figure 6.2. Cyber resilience ¶ (source: Starboard Advisory)](image/image171_c2917.jpg)


    **Figure 6.2.** Cyber resilience ¶ (source: Starboard Advisory)


    ## 6.2. Definition of a CERT


    The `CERT` (Computer Emergency Response Team) is a competence center in charge
    of alerts and reactions to cyber-attacks. It centralizes requests for assistance
    following security incidents, processes alerts, establishes and maintains a database
    of vulnerabilities, disseminates information on precautions to be taken to minimize
    risks and ensures coordination with other entities such as network competence
    centers, operators and Internet service providers and national and international
    `CERTs`.


    `CERT`’s mission is continuous improvement: a better understanding of the situation
    in order to be able to anticipate and react quickly.


    ## 6.3. Definition of a SOC


    The `SOC` (Security Operations Center) is a supervision system whose purpose is
    to ensure the detection and analysis of incidents, as well as to define the response
    strategy to the security incident.


    Its experts continuously analyze the events reported by the system and identify
    potential cybersecurity risks. Its main objective is to provide 24/7 monitoring
    of the information system. Large companies sometimes have their own `SOC`, but
    these services are often outsourced and shared, allowing experts to have a multi-company
    vision.


    ## 6.4. The role of ENISA


    In addition, the European Parliament and the Council of Europe jointly agreed
    in September 2017 to provide the European Union with robust cybersecurity, based
    on resilience, deterrence and defense measures. This European cyber resilience
    strategy has given the `European` `Network` and `Information Security` `Agency`
    (`ENISA`) a permanent and broadened mandate to strengthen the European Union’s
    cyber resilience and response capacity to cyberspace challenges, in particular
    through regular monitoring of the threat landscape and a response capacity to
    cross-border incidents.


    ## 6.5. The business continuity plan

