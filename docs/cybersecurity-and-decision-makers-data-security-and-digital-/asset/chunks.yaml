    职业的分散以及对员工支持的缺乏，导致了网络安全实践与公司期望的网络文化之间存在着巨大的鸿沟。


    对于所有公司而言，对网络安全的文化认同至关重要，但在实践中，员工通常是防范钓鱼攻击的唯一屏障，他们却缺乏保护公司所需的必要文化。


    正如《数字企业信息系统治理审计指南》（`ISACA`）开展的调查所示，95% 的公司认为其当前的网络安全文化与理想文化之间存在差距。在实践中，员工没有得到充分的培训（如果根本没有培训），并且可能产生疏忽，这证实了网络安全中的人为因素仍然至关重要。


    然而，80% 的机构报告称他们对员工进行培训并传达行为准则以改进网络文化。但参考研究显示，后者仍然匮乏。虽然网络安全文化是“理想的”，但它受限于 41% 的员工认同度不足以及
    39% 的业务部门间存在差异。


    网络安全不仅是 `CIO` 和 `CISO` 的事务。`ISACA` 的调查显示，文化变革是 `CIO` 以及人力资源部门的责任。为了分担安全责任并缩小差距，安全文化必须具有包容性，这意味着建议让员工参与网络安全讨论，在新员工入职流程早期就为其定义安全协议，根据部门的风险状况定义安全需求，并组织模拟网络攻击演习。


    ## 5.8. 管理人员和董事的仪表板


    仪表板（Dashboard）是一种很好的做法。当然，它必须根据公司类型（其所属行业）、规模和接收者进行调整。它必须被视为一种工作工具、通信工具和决策工具。根据接收者的不同（董事会、执行委员会、业务部门、IT
    部门、`CISO`），其综合程度会有所不同。它将根据需求、优先级和对问题的理解不断演变。它将与执行委员会的每位成员共享。明确谁对提供的信息和采取的行动负责非常重要。


    仪表板的示例见附录 1。


    1. 1 来源：`CISO` 2019 年基准研究。

    2. 2 来源：Gilbert Kallenborn，2019 年 4 月 13 日发布在 01Net.com 的文章。


    # 6 韧性与危机管理


    ## 6.1. 如何确保韧性？


    在管理大型 `CSIRP`（计算机安全响应计划）的组织中，54%（法国为 53%）没有进行定期压力测试。超过一半的组织承认在过去 12 个月内曾是事件或数据泄露的目标。


    然而，根据另一项由 `IBM` 赞助的 `Ponemon Institute` 研究显示，在 30 天内遏制数据泄露的公司在事件总成本上节省了超过 100
    万美元。


    各国信息系统安全机构（或同机构）已为中小企业开发了指南或评估工具，以帮助公司评估其需求并实施确保公司韧性的主要措施。


    瑞士联邦政府开发了一项 `ICT` 标准，为瑞士公司（特别是瑞士的关键基础设施运营者）提供了提高其 IT 系统和基础设施抵御网络风险韧性的指南。


    该标准包含了一份参考指南，包含了组织或技术原则，以防御网络威胁。此外，它提供了一个工具，允许公司评估其 IT 韧性程度（或由外部进行审计）。


    它还为公司提供了一个框架，为用户提供系列可实施的具体措施：识别、保护、检测（建立永久网络监控以检测潜在的网络安全事件，并确保能够检测到恶意软件）、响应、确保从以往的网络安全事件中汲教训整合到响应计划中，以及恢复（恢复备份、重启系统）。


    ![图 6.1. 准备重大网络攻击：不到一半的公司认为自己能够应对此类网络攻击（来源：根据 CESIN）。如需查看此图的彩色版，请访问 www.iste.co.uk/defreminville/cybersecurity.zip](img/image170_c2916.jpg)


    **图 6.1.** 准备重大网络攻击：不到一半的公司认为自己能够应对此类网络攻击（来源：根据 `CESIN`）。如需查看此图的彩色版，请访问 [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)


    最后，数据库还将允许公司匿名与其所属行业的其他公司进行比较。该标准已适用于电力行业。


    为能源供应商制定最低 IT 安全标准被视为减少瑞士能源部门遭受可能导致网络停电的网络攻击之脆弱性的方法。在电力行业之后，其他行业也将紧随其后，包括废水处理、天然气供应、物流和电信。


    ![图 6.2. 韧性 ¶（来源：Starboard Advisory)](img/image171_c2917.jpg)


    **图 6.2.** 韧性 ¶（来源：Starboard Advisory）


    ## 6.2. CERT 的定义


    `CERT`（计算机应急响应小组）是负责警报和响应网络攻击的能力中心。它汇总安全事件后的协助请求，处理警报，建立并维护漏洞数据库，发布降低风险的预防信息，并确保与网络能力中心、运营商、互联网提供商以及国家级
    `CERT` 的协调。


    `CERT` 的任务是持续改进：更好地了解状况以便预测和快速反应。


    ## 6.3. SOC 的定义


    `SOC`（安全运营中心）是一个监控系统，旨在确保对事件进行检测和分析，并定义安全事件的响应策略。


    其专家持续分析系统报告的事件并识别潜在的网络安全风险。其主要目标是对系统提供 24/7 监控。大型公司有时会有自己的 `SOC`，但这些服务通常是外包并共享的，使专家能够拥有跨公司的视角。


    ## 6.4. ENISA 的角色


