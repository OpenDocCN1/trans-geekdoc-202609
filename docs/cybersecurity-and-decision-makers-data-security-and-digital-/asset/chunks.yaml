- raw: 'The main measures taken to strengthen data security in the cloud are:


    *   – identification and classification of data, before migrating them;


    *   – the choice of the cloud provider;


    *   – data encryption;


    *   – monitoring user activity around this data;


    *   – the reinforcement of safety rules;


    *   – employee training;


    *   – the classification of data must be done with decision makers and cannot
    be the sole responsibility of the CIO or CISO. Businesses must understand the
    issues, data risks and alternative solutions.


    #### 5.3.5.2. *The bring your own device (BYOD) strategy*


    Teleworking, co-working and the emergence of new BYOD-type uses are forcing companies
    to develop new ways of working and new tools and therefore to adjust their security
    systems.


    New protection solutions must be deployed, and employees must be made aware of
    good practices and trained in new tools.


    This is a real challenge for companies. It is essential to impose limits: prevent
    access to certain sites, prohibit the transfer of business documents to personal
    addresses, and secure outside access to the company’s applications and information
    system. At the same time, if the rules are very cumbersome and complex, employees
    complain about too many constraints. It is therefore necessary to maintain flexibility
    and, in this case, to train users so that they know, for example, how to identify
    malicious emails, identify sites that present risks and avoid connections to unsecured
    Wi-Fi networks.


    In the extreme, some companies could be inspired by companies operating in the
    military sector, whose computers and industrial sites are not connected to the
    Internet.


    ### **5.3.6. *The human being***


    ![Figure 5.4. Human intervention remains necessary in the eyes of CISOs (source:
    according to CESIN). For a color version of this figure, see www.iste.co.uk/defreminville/cybersecurity.zip](image/image159_c2913.jpg)


    **Figure 5.4.** *Human intervention remains necessary in the eyes of CISOs (source:
    according to CESIN). For a color version of this figure, see [www.iste.co.uk/defreminville/cybersecurity.zip](http://www.iste.co.uk/defreminville/cybersecurity.zip)*


    The strong link is the human being, who can also be the weak link: all must be
    formed, from top to bottom, and from bottom to top. It is therefore necessary
    to launch an annual training campaign and the latter must be educational: explain
    the threats and constraints, demand compliance with the rules (crack down if necessary)
    and involve the entire company.


    The commitment of all teams is the best way to reduce the internal threat. This
    is a real challenge for large companies with complex organizations, where 75%
    of employees are not aware of the strategy. The loss of meaning and lack of commitment
    have a direct impact on everyone’s vigilance to protect the company.


    As mentioned several times, organization, clarification of roles, responsibilities
    and delegations of authority, collaboration between cybersecurity experts, professions
    and functions, cooperation with cybersecurity experts in the conduct of industrial
    or commercial digital transformation projects, or in M&A operations, as well as
    decision-making processes are essential to the success of the company and its
    sustainable performance.


    A cybersecurity program deployed in all departments, sites and subsidiaries is
    required in all large companies.


    In SMEs, the organization is less complex. Nevertheless, training, safety culture,
    identification of strategic assets, consideration of safety rules in conjunction
    with IT service providers, risk mapping by managers and awareness of the importance
    of processes are essential. It is an investment in time rather than tools. The
    use of trusted service providers is essential. A list of good practices is provided
    in [Appendix 2](#b03.xhtml#app2-1).


    ## **5.4. Data protection**


    Data governance begins with each business identifying critical assets and classifying
    the degree of confidentiality of information. It is not necessary to treat all
    information in the same way.


    Sharing information is essential for greater efficiency: there is no need for
    each department to enter information from another department into its own database.
    It is a waste of time that is costly and error-prone. Two sources of information
    may provide different information.


    It is common in large companies that information is not shared for reasons of
    power (information is power), frequency of updates (the requirements from one
    function to another are not the same), scope, confidentiality, level of quality
    required or organization (availability of people who update databases).


    Digital transformation requires a shared vision, resources, process implementation,
    and change management so that it can lead to greater efficiency and reliability.


    With regard to processes, it is necessary to designate persons in charge, give
    reading or writing rights, manage the updating of these accesses, secure access,
    safeguard data, ensure data integrity (document changes, for example), prevent
    data from being altered or destroyed, ensure their consistency, reliability, and
    relevance, administer and monitor logs and flows (control access, track activity,
    manage data violations, reduce vulnerabilities, make them anonymous if necessary,
    etc.).


    ![Figure 5.5. To secure data stored in a public cloud, the CISO does not only
    use the tools offered by the service provider ¶ (source: according to CESIN)](image/image161_c2914.jpg)


    **Figure 5.5.** *To secure data stored in a public cloud, the CISO does not only
    use the tools offered by the service provider* ¶ *(source: according to CESIN)*


    ### **5.4.1. *Emails***


    Mail has never been totally confidential, and it has always been necessary to
    take precautions to ensure that a letter, information or contract is known only
    to a few people (the sender and recipient only, the two signatories of a contract
    only). It is the same with email, but what is the proportion of people who are
    aware of it?


    How to control the flow of information within a company? How to ensure that emails
    written today to a customer or supplier do not turn against the company in the
    event of a dispute? How to limit the legal and financial impacts? How to ensure
    compliance with the delegations of authority in place, defining the authorizations
    and responsibilities of each person according to the position in the company,
    the employment contract and the employer legal entity?


    Today, who knows who wrote what about a given project? Are information flows known
    and managed? Are there any rules and authorizations? It is usually in the event
    of a dispute, audit or judicial investigation that we are aware of the amount
    of emails exchanged on a project.


    Some have understood it well; they never write, they never answer: they are sure
    they will not be caught. But how do they exercise their responsibilities? Not
    everything is risky, however. Writing with the knowledge that emails and attachments
    can be read, and wondering who might misuse them, are the basic rules of their
    use.


    Unlike some secure messaging (but beware, WhatsApp messaging was considered secure
    and does not seem to be), which encrypts communications, email is not secure.


    We must therefore find tools – they exist – and put them in place. Some solutions
    are recommended for this purpose[²](#c05.xhtml#pg140fne0c1):


    *   – ProtonMail: based in Switzerland, ProtonMail is an open source webmail with
    a sleek design that offers different levels of encryption. Between ProtonMail
    users, messages are automatically encrypted end-to-end (content and attachments).
    It is also possible to send end-to-end encrypted messages to users of other messaging
    systems;


    *   – Tutanota, based in Germany, is an open-source webmail similar to ProtonMail.
    The design is quite sober and elegant. Between Tutanota users, messages are automatically
    encrypted from start to finish. Strong authentication is available;'
