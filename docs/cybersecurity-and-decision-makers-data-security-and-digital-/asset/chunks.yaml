    team, communicating to all users about their role to play (detect, question before
    acting and inform).


    The training of all users at all levels (lead by example) is essential: the reminder
    of rules, good practices and processes (examples: fraud on the president, monitoring
    processes even in emergencies, checking the origin of instructions).


    The existence of an IT security policy and procedures within the company is a
    good sign. Nevertheless, it is important to update them regularly, especially
    in the rapidly changing IT field.


    In addition, policy coherence must be ensured across the group: for historical
    reasons, this is not always the case.


    Finally, the existence of the security policy is not enough; it must be disseminated
    to all concerned, including small subsidiaries, and its implementation must be
    monitored, which means auditing it regularly and monitoring the implementation
    of recommendations.


    The security policy is based on the recipients:


    *   – the IT charter for users with the rules to be respected (Internet, emails,
    passwords, social media, confidentiality, data management, mobility, authentication);

    *   – the information systems and network security policy;

    *   – security policies, relating to equipment: personal computers (PCs), printers,
    servers, Wi-Fi, network, telephone;

    *   – security policies toward suppliers and subcontractors;

    *   – back-up policies.


    #### 5.3.5.1. The cloud strategy


    While the cloud has become the central architecture of today’s IT, it has also
    been considered one of the main vulnerabilities, particularly since the United
    States adopted the `CLOUD Act` (March 2018).


    Internal private cloud, cloud management and outsourced private cloud are becoming
    increasingly important and provide access to advanced security technologies.


    The choice of these solutions is structuring, but the choice of the technical
    solution (interoperability with the company’s systems) is far from sufficient.
    A risk analysis must also be conducted (such as `Ebios` or `Enisa`, as mentioned
    above).


    These are also questions:


    *   – Strategic: what data will be stored on this cloud? What processing will
    go through the cloud? What back-ups? What availability, reversibility/portability?

    *   – Legal: which contract, which guarantees? Does the service provider comply
    with the regulations in force? Does the company have the right to audit? Where
    are the data located? What guarantees of security and confidentiality?

    *   – Financial: annual costs, cost of specific services.

