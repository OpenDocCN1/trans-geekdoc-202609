    ISBN 978-1-78630-519-0\n\n# Foreword\n\nDirectors and executives are now at the\
    \ heart of cybersecurity issues. This is my conviction; this is my experience\
    \ gained by launching one of the first cybersecurity companies in 2005 and by\
    \ meeting many executives. This is my conviction as the director of a defense\
    \ company that is particularly exposed to these risks, as well as active in the\
    \ development of new protection strategies.\n\nLet us make this expertise a driving\
    \ force for differentiating our companies and France as a safe place to do business.\
    \ This is where this book written by Marie de Fréminville takes on its full importance.\n\
    \nIt brings together five years of work and exchanges between experts and leaders,\
    \ between the State and industrial actors who forge our conviction that the issue\
    \ of cybersecurity can no longer remain confined to the circles of geeks, but\
    \ that it has become a real issue of economic resilience.\n\nThe issue is obviously\
    \ much broader, and corporate governance must address it in all its dimensions:\
    \ economic resilience, vulnerability of extended business strategies, customer\
    \ protection, human issues, infrastructure development, insurance policy, crisis\
    \ management, etc."
