- raw: 'Another case that made headlines in the United States at the end of 2017 was
    the sale by Intel’s CEO of part of his shares for $39 million ($25 million capital
    gain), before the disclosure of critical vulnerabilities in Intel processors,
    and several months after he discovered these vulnerabilities.


    In addition, the SEC considers cybersecurity to be a vital issue for all organizations.
    It requires listed companies to inform the markets by publishing a form detailing
    the cyber-attacks they have been subjected to, as these events may jeopardize
    a company’s future.


    The rules established by the SEC prohibit managers of listed companies from selling
    their shares when they become aware of information that could affect the share
    price.


    It is therefore recommended that employees holding shares or stock options be
    informed of the rules governing the sale of these shares, depending on the time
    of year and the information they may hold on events that may have an impact on
    the share price.


    ### 2.2.4. *Activist shareholders*


    The amounts managed by so-called “activist” investment funds increased from $27
    billion to $163 billion between 2007 and 2017. One of the characteristics of these
    activist funds is to interfere in the management of listed companies, with a strategic
    vision in the short or long term.


    Some recent European examples include TCI (The Children’s Investment Fund), which
    challenged Safran’s takeover of Zodiac, which was considered “overpaid” and “non-rational”
    and which also “encouraged” Airbus to sell its shares in Dassault. Third Point
    called for a major reorientation of Nestlé’s strategy and the sale of its stake
    in L’Oréal. Cevian Capital, an activist fund of Swedish origin, acquired a stake
    in Rexel, modified its executive committee and launched an asset disposal program.
    Cevian Capital is also leading ABB (the Swiss leader in advanced technologies,
    a world leader in digital industries with four leading business sectors in their
    respective fields: electrification, industrial automation, mobility and robotics)
    to sell Power Grids, representing one-third of its activities.


    The arrival of an activist fund in the capital is never a trivial event for a
    listed company. Their interventions in the media aim to denounce the flaws they
    intend to correct, in order to accelerate the creation of value (often in the
    short term) and its sharing with shareholders.


    From a strategic point of view, digital transformation and the speed with which
    companies adapt to new market access, competition, product and service offerings
    and production capacity are the best means of avoiding activist funds.


    From the point of view of the company’s reputation and the trust of customers
    and stakeholders, securing information systems and data protection are also the
    best ways to avoid impairment, the inflow of activist funds into the capital and
    the brutal restructuring of the company.


    For administrators, it is following a cybersecurity incident and a drop in share
    prices that the real problems begin: shareholders lawsuits, capital restructuring
    and equity investments by activist shareholders, who benefit from the decline
    in the share price.


    The company distracted by the crisis management, the functioning of IT resources,
    communication with customers and the media, disputes and investigations on the
    responsibilities involved, will at the same time be disrupted by shareholders
    who will publicly call for the resignation of the main directors.


    Resignations of senior executives and/or shareholder disputes have already affected
    Target, Wyndham Worldwide, TJX and Heartland Payment Systems. Others will follow.


    ### **2.2.5. *The stock exchange authorities***


    The SEC, the US stock exchange authority, is very attentive to the impacts of
    cybercrime on companies. It published a Cyber-Related Frauds Perpetrated Against
    Public Companies report in October 2018, following a survey of nine listed companies
    that have been victims of cyberfraud, ranging from $1 million to $45 million (payments
    to foreign accounts) through fake emails from executives or suppliers.


    Many of these frauds were not sophisticated. As is often the case in cyber-attacks,
    criminals have relied on technology, as well as on procedural flaws and human
    vulnerabilities, making the control environment ineffective.


    Procedures are sometimes correct, but staff are not trained and are not aware
    of the risks associated with cybercrime, such as identity theft, allowed by new
    technologies.


    Given the highly malicious nature of cybercrime, the SEC will continue to play
    a leading role in regulating the cyber practices of American companies.


    ### **2.2.6. *The annual report***


    The annual report is a means for shareholders to learn about the company’s governance,
    strategy, accounts, risks and programs to address these risks, as well as the
    transfer of these risks to insurance.


    The *Autorité des marchés financiers* (AMF) requires listed companies to publish
    certain information. At the general meeting, only the annual financial report
    is required: this document includes the annual corporate and consolidated financial
    statements, a management report, as well as a report from the statutory auditors.


    The registration document provides more complete information about the company.
    More voluminous than the annual report, it includes, for example, a description
    of market activities, products and services, a group organization chart, an analysis
    of its financial situation, its main shareholders, its corporate and consolidated
    financial statements and their appendices.


    These are very rich and include accounting rules and methods, as well as many
    elements on the company’s financial situation, its tangible and intangible fixed
    assets, its holdings in partner companies, etc. The profitability by sector or
    geographical area is also presented.


    It is therefore an excellent source of information, integrating information on
    risks (including risks related to information systems) and measures put in place.
    The famous 2017 attacks (Notpetya and Wannacry) were the starting point for these
    communications for most CAC 40 companies in France.


    Strangely enough, there are still a few large companies that do not mention the
    subject, as if cyber-risks did not exist. It is true that companies do not want
    to spread their vulnerabilities in the public arena.


    Nevertheless, it is important that shareholders are informed of the committees
    in charge and that they know whether these issues have been placed on the agenda
    of the board of directors or its committees, whether independent experts have
    been appointed to audit the organization, processes, systems and security policies.


    Finally, the annual report describes the composition of the board of directors,
    the career path of each director, their skills, the composition of the committees
    and the work carried out during the year.


    It is important to be concerned about a company that discusses these topics very
    briefly, does not have the appropriate skills on its board of directors and whose
    specialized committees (audit/risks) have not discussed the subject at least twice
    a year. Legal risks are increasing, as we will see in detail in [Chapter 3](#c03.xhtml#head3).


    ## **2.3. The board of directors**


    ### **2.3.1. *The facts***


    Seventy-five percent of companies are not prepared for such a situation and are
    not sufficiently suspicious. A 2016 study by Spencer Stuart shows that the second
    threat to the 4,000 administrators surveyed are cybersecurity risks (after overregulation).


    Spencer Stuart’s survey of cybersecurity on boards of directors in the United
    States in 2017 reveals the following facts:


    *   – most boards (69%) assign the responsibility for the oversight of cybersecurity
    to a committee of the board, while 26% say that the board as a whole manages cybersecurity
    risks;'
  fmt: '

    Another case that made headlines in the United States at the end of 2017 was the
    sale by Intel’s CEO of part of his shares for $39 million ($25 million capital
    gain), before the disclosure of critical vulnerabilities in Intel processors,
    and several months after he discovered these vulnerabilities.


    In addition, the SEC considers cybersecurity to be a vital issue for all organizations.
    It requires listed companies to inform the markets by publishing a form detailing
    the cyber-attacks they have been subjected to, as these events may jeopardize
    a company’s future.


    The rules established by the SEC prohibit managers of listed companies from selling
    their shares when they become aware of information that could affect the share
    price.


    It is therefore recommended that employees holding shares or stock options be
    informed of the rules governing the sale of these shares, depending on the time
    of year and the information they may hold on events that may have an impact on
    the share price.


    ### 2.2.4. Activist shareholders


    The amounts managed by so-called “activist” investment funds increased from $27
    billion to $163 billion between 2007 and 2017. One of the characteristics of these
    activist funds is to interfere in the management of listed companies, with a strategic
    vision in the short or long term.


    Some recent European examples include TCI (The Children’s Investment Fund), which
    challenged Safran’s takeover of Zodiac, which was considered “overpaid” and “non-rational”
    and which also “encouraged” Airbus to sell its shares in Dassault. Third Point
    called for a major reorientation of Nestlé’s strategy and the sale of its stake
    in L’Oréal. Cevian Capital, an activist fund of Swedish origin, acquired a stake
    in Rexel, modified its executive committee and launched an asset disposal program.
    Cevian Capital is also leading ABB (the Swiss leader in advanced technologies,
    a world leader in digital industries with four leading business sectors in their
    respective fields: electrification, industrial automation, mobility and robotics)
    to sell Power Grids, representing one-third of its activities.


    The arrival of an activist fund in the capital is never a trivial event for a
    listed company. Their interventions in the media aim to denounce the flaws they
    intend to correct, in order to accelerate the creation of value (often in the
    short term) and its sharing with shareholders.


    From a strategic point of view, digital transformation and the speed with which
    companies adapt to new market access, competition, product and service offerings
    and production capacity are the best means of avoiding activist funds.


    From the point of view of the company’s reputation and the trust of customers
    and stakeholders, securing information systems and data protection are also the
    best ways to avoid impairment, the inflow of activist funds into the capital and
    the brutal restructuring of the company.


    For administrators, it is following a cybersecurity incident and a drop in share
    prices that the real problems begin: shareholders lawsuits, capital restructuring
    and equity investments by activist shareholders, who benefit from the decline
    in the share price.


    The company distracted by the crisis management, the functioning of IT resources,
    communication with customers and the media, disputes and investigations on the
    responsibilities involved, will at the same time be disrupted by shareholders
    who will publicly call for the resignation of the main directors.


    Resignations of senior executives and/or shareholder disputes have already affected
    Target, Wyndham Worldwide, TJX and Heartland Payment Systems. Others will follow.


    ### 2.2.5. The stock exchange authorities


    The SEC, the US stock exchange authority, is very attentive to the impacts of
    cybercrime on companies. It published a Cyber-Related Frauds Perpetrated Against
    Public Companies report in October 2018, following a survey of nine listed companies
    that have been victims of cyberfraud, ranging from $1 million to $45 million (payments
    to foreign accounts) through fake emails from executives or suppliers.


    Many of these frauds were not sophisticated. As is often the case in cyber-attacks,
    criminals have relied on technology, as well as on procedural flaws and human
    vulnerabilities, making the control environment ineffective.


    Procedures are sometimes correct, but staff are not trained and are not aware
    of the risks associated with cybercrime, such as identity theft, allowed by new
    technologies.


    Given the highly malicious nature of cybercrime, the SEC will continue to play
    a leading role in regulating the cyber practices of American companies.


    ### 2.2.6. The annual report


    The annual report is a means for shareholders to learn about the company’s governance,
    strategy, accounts, risks and programs to address these risks, as well as the
    transfer of these risks to insurance.


    The `Autorité des marchés financiers* (AMF) requires listed companies to publish
    certain information. At the general meeting, only the annual financial report
    is required: this document includes the annual corporate and consolidated financial
    statements, a management report, as well as a report from the statutory auditors.


    The registration document provides more complete information about the company.
    More voluminous than the annual report, it includes, for example, a description
    of market activities, products and services, a group organization chart, an analysis
    of its financial situation, its main shareholders, its corporate and consolidated
    financial statements and their appendices.


    These are very rich and include accounting rules and methods, as well as many
    elements on the company’s financial situation, its tangible and intangible fixed
    assets, its holdings in partner companies, etc. The profitability by sector or
    geographical area is also presented.


    It is therefore an excellent source of information, integrating information on
    risks (including risks related to information systems) and measures put in place.
    The famous 2017 attacks (`Notpetya` and `Wannacry`) were the starting point for
    these communications for most CAC 40 companies in France.


    Strely enough, there are still a few large companies that do not mention the subject,
    as if cyber-risks did not exist. It is true that companies do not want to spread
    their vulnerabilities in the public arena.


    Nevertheless, it is important that shareholders are informed of the committees
    in charge and that they know whether these issues have been placed on the agenda
    of the board of directors or its committees, whether independent experts have
    been appointed to audit the organization, processes, systems and security policies.


    Finally, the annual report describes the composition of the board of directors,
    the career path of each director, their skills, the composition of the committees
    and the work carried out during the year.


    It is important to be concerned about a company that discusses these topics very
    briefly, does not have the appropriate skills on its board of directors and whose
    specialized committees (audit/risks) have not discussed the subject at least twice
    a year. Legal risks are increasing, as we will see in detail in Chapter 3 (#c03.xhtml#head3).


