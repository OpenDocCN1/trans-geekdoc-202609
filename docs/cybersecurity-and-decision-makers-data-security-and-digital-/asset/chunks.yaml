    ## Appendix 2: Ensuring Cybersecurity in Practice and on a Daily Basis


    * – Managing passwords.

    * – Managing access rights to systems and applications.

    * – Partitioning uses.

    * – Defining rules for digital partners and service providers.

    * – Regularly updating the software of all hardware.

    * – Training staff (including avoiding the use of a `USB stick of unknown origin,
    installing software without prior authorization, default configurations and unused
    features).

    * – Disseminating a charter of good conduct.

    * – Disabling or removing default accounts, ports (`USB` or other) and unused
    removable media, non-essential web services, etc.

    * – Backing up data and software regularly on separate media.

    * – Updating operating systems and security applications.

    * – Controlling access to production equipment via personalized passwords.

    * – Protecting physical and digital access to `SCADA` (Supervisory Control and
    Data Acquisition) development stations, programming consoles, `PLCs` (programmable
    logic controllers), handheld terminals, etc.

    * – Mapping information flows, filtering them with firewalls, tracing and analyzing
    connection failures.

    * – Separating networks (office automation, workshops, etc.) and connections between
    production islands.

    * – Disabling remote access, vulnerable and unsecured protocols and features.

    * – Separating development tools from production servers or operator stations.

    * – Identifying the documents to be archived and the archiving conditions.

    * – Encrypting sensitive data.

    * – Testing back-up recovery processes.

    * – Disconnecting back-ups from the information system and keeping back-ups on
    multiple physical media.

    * – Ensuring that subcontractors meet acceptable cybersecurity requirements in
    relation to those required.

    * – Ensuring the protection of customer data, in the case of marketing connected
    objects, integrating appropriate encryption mechanisms.

    * – Having the conformity of products and services certified and audited by a
    third party such as a national center for IT Security Evaluation and Certification.

    * – Using products certified by the National Cybersecurity Agency: data erasure,
    secure storage, operating and virtualization systems, firewalls, intrusion detection,
    antivirus, malware protection, security administration and supervision, identification,
    authentication and access control, secure communication, secure messaging, embedded
    hardware and software, secure execution environment, `PLCs`, industrial switch.


    ## Appendix 3: Tools to Identify, Protect, Detect, Train, React and Restore


    ### A3.1 Identify

    * – Threat identification.

    * – Asset management.

    * – Vulnerability management.

    * – Penetration testing.


    ### A3.2 Protecting

    * – Antivirus email, firewall protecting the web application server.

    * – `IPS/IDS` intrusion detection/prevention systems (`IDS`) analyzing network
    traffic to detect signatures corresponding to known cyber-attacks.

    * – Data: encryption/decryption tools, key management, `PKI` (public key infrastructure).

    * – Multifactor authentication.

    * – Identity and access management.

    * – Update management.

    * – Limiting access of certain websites to specific users in order to maintain
    and comply with the organization’s policies and standards (endpoint protection).

    * – Secure `DNS`.

    * – Web filtering: limiting access to websites (threatening the organization’s
    IT security), reducing malware infections, reducing incident tickets and reducing
    the burden on IT resources.

    * – Virtual private network (`VPN`) is a system that allows you to create a direct
    link between remote computers by isolating this traffic. This term is particularly
    used in teleworking, for access to cloud computing structures, as well as in `MPLS`
    (Multiprotocol Label Switching) services.


    ### A3.3 Training and governance

    * – Change management.

    * – Governance risk and compliance monitoring.

    * – `GDPR` compliance.

    * – Cybersecurity training.


    ### A3.4 Detecting

    * – Log management: log collection, centralized log aggregation, long-term storage
    and retention time, log file rotation, log analysis (in real time and in bulk
    after a storage period), log reports and study, network monitoring.

    * – `honeypot`: active defense which consists of attracting, on resources (server,
    program, service), declared or potential opponents in order to identify them and
    possibly neutralize them.

    * – `DLP` (Data Loss Prevention).

