    Its scope is broad, since it deals with all information systems: industrial, management,
    commercial, as well as site protection, and extended enterprise protection, with
    suppliers, subcontractors, service providers and subsidiaries in all the countries
    where the group has deployed activities. SMEs, which do not escape digitization,
    do not always have sufficient resources to ensure the security of their operations:
    there are “cyberdeaths” among these companies.


    The cybersecurity manager is an essential link in the chain, but their effectiveness
    and performance depend on the organization as a whole and on the interaction with
    the company’s main internal and external stakeholders.


    Their missions are multiple and are part of the objective of developing and maintaining
    the digital trust that stakeholders (customers, suppliers, employees, shareholders,
    partners, etc.) have in the company, its products and services: finding trusted
    partners, ensuring the company’s resilience with limited resources and budgets.
    Protecting strategic and personal data is a challenge for cybersecurity managers
    in a context of cost reduction, automation and optimization.


    It is necessary to know how to protect strategic, financial and personal information,
    as well as how to intervene from the design stage (`Privacy & Security by Design`),
    to advise the business in the development of applications and services that make
    it possible to develop digital activities and create value, by becoming a trusted
    partner for traditional and new customers, to contribute to compliance, particularly
    in the context of the `GDPR` or the `NIS` directive, to establish the synthesis
    of cyber-risks by relativizing the various risks: a lack of security in industrial
    systems can have much more serious consequences for the company than a leak of
    non-strategic or non-sensitive data.


    ### 5.3.2. The CISO and the company


    In cybersecurity, it is essential that everyone assumes their responsibilities:
    the board of directors, managers, the IT department, the CISO, as well as the
    business operations, functions, employees, the extended company (suppliers, subcontractors,
    IT service providers), not to mention the State (infrastructures, education, investigations,
    standards, certifications and regulations).


    Managers within the company too often work in silos, while security, physical
    or digital, is everyone’s business and requires a 360-degree panoramic view.


    The business must be involved in risk mapping and also in the solutions to be
    implemented, in the identification of strategic assets and in the definition of
    security standards, allowing the right balance to be found between security and
    agility, security and efficiency.


    Threats evolve quickly, which requires being agile and responsive. They can be
    strong and destabilizing. If the main actors of the company are not prepared,
    and if they have not understood and become aware of the cyber threat, then they
    will not be able to respond correctly and avoid impacts.


    ![Figure 5.1. Employees who are aware of cybersecurity, but who are not very involved
    according to the CISOs ¶ (source: according to CESIN)](image/image150_c2910.jpg)


    **Figure 5.1.** Employees who are aware of cybersecurity, but who are not very
    involved according to the CISOs ¶ (source: according to CESIN)


    “We are all concerned! You have to invest. Lightning can strike anyone. We must
    anticipate, prevent, and mitigate the effects”, Guillaume Poupard regularly insists,
    particularly on April 17 in front of a packed room at the Institut français des
    administrateurs (IFA).


    Protecting yourself is possible; it requires an effort: you have to start by understanding.
    And then to respect some major principles, and also, depending on the sector,
    internal governance must take into account the company, and cybersecurity is not
    a specialty but must be integrated into all the projects:


    - **Human resource issues**: management of people, training, and development of
    expertise.

    - **Financial challenges**: allocation of budgets for cybersecurity, assessing
    cyber-exposure, and insurance coverage.

    - **Legal issues**: `GDPR` compliance, drafting of internal regulations, and management
    of contracts with third parties.

    - **Business challenges**: coordination with business lines and functions to ensure
    safe operation without compromising service quality.


    The coordination of the various actors (`CIO`, `CISO`, `DPO`, `risk manager`)
    with the business lines (industrial sites, product innovation, sales, support
    functions), external service providers is a difficulty but it is a necessity that
    is the responsibility of the board of directors.


    The organization and governance of security must be defined precisely and clearly
    for all: who does what? What are the roles and responsibilities of `CIO`, `RSI`,
    `risk manager`, internal audit and external audit? Who is in charge of identifying
    threats (`threat intelligence`), monitoring attacks, intervening, defining the
    security repository, enforcing it? Who depends on whom? What are the degrees of
    independence of the supervisory bodies?


    It is recommended to place the `CISO` where he/she will have the means to act
    effectively and where his/her independence will be ensured. The following three
    principles must be applied for this safety manager:


    - A clear mandate.

    - Proximity to the executive committee.

    - Freedom of action (and therefore of budget).


    It is not recommended that the `CISO` should be dependent on the `IT director`
    whose objective is to make information systems easy to use, fast and efficient.
    Rather, security measures tend to slow down access to workstations (password,
    double authentication), applications (password, updates) and computer processing.


    The internal organization must be global and not ignore entire parts of the company
    that are sometimes forgotten. The points of vigilance of the internal organization
    are in particular the following:


    - **Information systems**: cyber protection architecture (isolating various information
    systems, isolating the company and the industrial network, using inspection and
    intrusion detection tools), server location, back-up of sensitive data.

    - **Factories**: hardware and software, network access, data access with authentication
    and authorization plus encryption, physical and digital security coordination,
    updates, USB sticks, augmented reality tools.

    - **Administrators and users**: tools and access rights rules (passwords, mobility,
    how to communicate, data archiving – how long, where, classification? – back-ups),
    certified `NCSC` (National Cyber Security Centre) or `NCCIC` (National Cybersecurity
    and Communications Integration Center) service providers.

