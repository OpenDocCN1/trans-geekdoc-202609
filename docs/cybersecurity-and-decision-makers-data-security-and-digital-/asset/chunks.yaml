- raw: '*   – Mailfence, based in Belgium, is a proprietary webmail service. Its design
    is less pleasant than the two previous ones, but it is effective. Messages can
    be encrypted end-to-end using OpenPGP or symmetric encryption. Strong authentication
    is available.


    ### **5.4.2. *The tools***


    It is not always easy with “old” systems, nor with tools commonly used, published
    by Microsoft (Active Directory, for example). The ANSSI technical note, dated
    2014, states: “It is important to note that an Active Directory contains user
    secrets, such as their identification information. In fact, it is a privileged
    target for a malicious person”.


    Active Directory is Microsoft’s implementation of directory services for Windows
    operating systems. The main objective of Active Directory is to provide centralized
    identification and authentication services to a network of computers using the
    Windows system. It also allows policy allocation and enforcement, as well as the
    installation of critical updates by administrators.


    If he/she has domain administration rights, an attacker is free to carry out all
    the desired operations, such as data extraction or sabotage. The compromise of
    a single account with privileged rights can thus result in the loss of total control
    of the information system.


    The complexity of this directory is such that a malicious individual can hide
    his/her presence in it in various more or less subtle and, for some, difficult
    to detect ways.


    Such an individual is then able to leave backdoors in multiple services and applications
    of the information system. This results in a significant risk of persistent complex
    attacks.


    An information system that has been compromised in this way is sometimes impossible
    to clean up and must be completely rebuilt, requiring significant financial and
    human resources.


    Therefore, it is essential to control and secure your Active Directory. The main
    protection tools must be adapted to the value of the data and the criticality
    of the information system.


    Protection tools (antivirus and firewall) are the essential basis, to be updated
    daily and automatically, as well as “abnormal” behavior detection tools, which
    analyze download behavior and suspicious actions on workstations or servers, not
    to mention filtering tools, which monitor inputs and outputs, to detect malicious
    intrusions.


    There is no 100% safe system, so you have to detect those who try to pass and
    detect them as quickly as possible: during the day; it is much better than five
    years later: the consequences are not the same.


    It is possible to outsource and share this monitoring. The types of tools to identify,
    protect, detect, react and restore are listed in [Appendix 3](#b04.xhtml#app3-1).


    ### **5.4.3. *Double authentication: better, but not 100% reliable***


    The use of two-factor authentication is recommended. Used by banks, it now concerns
    more and more sensitive companies: double authentication consists of sending a
    code to your smartphone, by SMS or via an application, when you try to connect
    to one of your online accounts or your workstation. This technique offers an additional
    layer of protection, in principle very reliable: who else can have your phone
    and reproduce the code you received?


    Unfortunately, if a malicious person finds the mail from your operator sending
    you your SIM card or obtains a copy of your SIM card by stealing your identity,
    the SMS messages you receive will be displayed on your hacker’s phone. While it
    is necessary for them to find your username and password (badly) hidden in your
    contacts, sometimes this is not so difficult, as most users, to simplify access
    to their applications, have a unique password.


    ## **5.5. Choosing your service providers**


    Responsibility cannot be delegated to external service providers; the company
    and its corporate officers remain liable in the event of an IT incident. Qualifications
    (products and services) have been put in place by security agencies based on criteria
    of competence and trust, both of which are necessary.


    IT is often managed partially or totally by external parties, who have too many
    access rights to administer the systems of large companies.


    It is the providers who are targeted to reach their customers. It is then difficult
    to distinguish an authorized connection from an unauthorized connection. Cyber
    requirements must therefore be included in providers’ contracts.


    ## **5.6. The budget**


    It generally represents between 5% and 10% of the budget of the information systems
    department but varies according to the company’s activity: it is higher for defense
    players, OIVs, companies whose intellectual property is important and which possess
    a lot of personal data, its level of digitization and its age.


    The budget includes four main items: cyber defense (protection, detection, response),
    technical means maintenance, process evolution and information, awareness and
    training campaigns.


    In large companies in particular, the rationalization of the number of providers
    of cybersecurity tools and services, such as the selection of interoperable tools,
    makes it possible to optimize investment and service budgets, to focus efforts
    on technology watch, surveillance tools and artificial intelligence, the resources
    made available to operations and functions to ensure the roles of business partner
    and “temple guardian” from the start of projects.


    Cybersecurity should not be seen only as a cost; it should be seen as a lever
    for doing business, a tool for competitiveness and performance and a barometer
    of the organization’s good health.


    As with any investment, executives and administrators will be able to track expenses
    related to digital transformation, IT security and data protection.


    An investment or innovation committee may be set up for a limited period of time,
    with specific skills, to set up a technology watch, supervise a start-up laboratory
    or accelerator, manage digital projects, costs, risks and their performance. This
    committee may also be responsible for compliance, internal governance, risk and
    insurance matters.


    ## **5.7. Cyberculture**


    All connected, all involved, all responsible: the cybersecurity manager is an
    essential business partner of the company. Cybersecurity is everyone’s business.
    Regulators and investors are paying particular attention to how companies rely
    on talent and culture to improve their performance and ensure their sustainability.


    The new English governance code recommends that boards of directors evaluate the
    culture and monitor its evolution. Similarly, the Netherlands and Japan have revised
    their codes of governance and insist on the importance of culture: how to define
    it, measure it and monitor its evolution.


    COSO, which brings together various American associations of accountants and internal
    auditors and provides guidance on enterprise risk management, recognizes the fundamental
    role of corporate culture in risk management. COSO emphasizes the role of the
    board of directors and management in ensuring that the company’s values are defined
    and that this culture is disseminated throughout the company, in particular by
    ensuring that the rules and the application of these rules are in line with this
    culture. Leadership by example is virtuous; “do as I say, don’t do as I do” is
    a doorway to many negligent or malicious acts, which is very destructive of value.


    What applies to culture, in general, applies to cyberculture: the composition,
    dynamics and culture of the board of directors itself must reflect the corporate
    culture and its strategic objectives. What about a board of directors that promotes
    digital transformation, cybersecurity and innovation if it has not acquired the
    appropriate skills and appointed a leader capable of leading this transformation,
    understanding the issues and controlling the risks? Do they spend enough time
    on it? Has the method of remuneration evolved in line with these new paradigms?'
