    通用管理层及其董事会不仅要意识到这一点，还必须根据各自的职责行动，以建立必要的组织、风险治理以及公司的保护体系。正是这种“良知的呼唤”必须引起读者的共鸣，读者随后必须找到适当的解决方案：本书将为你提供可能的解决方案，并启示你在决策时需要考虑的风险，以提供决策支持。


    正如交班时说的那样：现在轮到你来照顾了……


    Hervé GUIOU

    总裁兼首席执行官

    海军集团（Naval Group）


    # 前言


    与 `HEC Gouvernance` 举办圆桌会议以及与 `瑞士女性董事会`（`Cercle Suisse des Administratrices`）举办研讨会，是本书为决策者提供的起点：即公司、公共机构、基金会或协会的经理和董事。


    公司战略数据和信息系统的保护是董事、高管以及公司内部运营和职能部门（以及公司外部）决策者的责任。


    这些圆桌会上不同发言者的意见已收录书中。


    ## 2016 年 10 月，“理解与预防网络风险：当务之重”：


    - – Hervé Guillou，海军集团（`Naval Group`）总裁兼首席执行官；

    - – Alain Juillet，对外安全局（`DGSE`）情报局长，国家安全与数字系统局（`SGDSN`）经济情报高级经理以及企业安全总俱乐部（`CDSE`）主席；

    - – Guillaume Poupard，法国信息系统安全局（`ANSSI`）局长；

    - – Alain Bouillé，信息与数字安全专家俱乐部（`CESIN`，`Club des experts de la sécurité de l’information
    et du numérique`）主席；

    - – Alexandre Montay，中型企业协会（`Mouvement des entreprises de taille intermédiaire`）秘书长。


    ## 2017 年 6 月，“网络风险：一个需要治理的主题”：


    - – Yves Bigot，世界法语电视网（`TV5 Monde`）总经理；

    - – Brigitte Bouquot，风险管理协会（`Association pour le management des risques et des
    assurances de l’entreprise`）主席；

    - – Frédérick Douzet，巴黎八大学法国地缘政治学院（`IFG`）大学教授，网络战略卡斯特克斯教授；

    - – Solange Ghernaouti，洛桑大学（`UNIL`）信息安全教授，瑞士网络安全咨询与研究小组主管；

    - – Philippe Gaillard，法国安信（`Axa France`）技术与网络风险总监；

    - – Alain Robic，德信（`Deloitte`）企业风险与服务合伙人。


    ## 2018 年 12 月，“网络犯罪与个人数据保护：董事会和经理有哪些良好实践？”：


    - – Isabelle Falque-Pierrotin，2011 年以来法国信息信息自由委员会（`CNIL`，`Commission nationale
    de l’informatique et des liberté`s）主席，2017 年在香港当选世界数据保护与隐私专员国际会议主席；

    - – Philippe Castagnac，马赛锡（`Mazars`）管理委员会主席，马赛锡是一家专门从事审计、咨询、会计、税务和法律服务的国际、综合且独立的组织；

    - – Annick Rimlinger，企业安全总俱乐部（`CDSE`，`Club des directeurs de sécurité et sûreté
    des entreprises`）执行董事，`Cercle K2` 创始成员以及 `Hack Academy` 董事会成员；

    - – Éliane Rouyer，独立董事，乐事朗（`Legrand`）审计委员会主席及薪酬委员会成员，`Vigéo Eiris` 独立董事。


    我想感谢所有发言者的贡献与支持，并感谢 Marc Triboulet（我在 `HEC Gouvernance` 的同事，我与共同发起了这一圆桌会议系列）。


    我在空中客车（`Airbus`）集团为子公司董事和经理开发的培训、为这些会议开展的工作，以及在圆桌会议期间的交流，通过过去五年的研究、参与工作小组（例如瑞士的网络安全战略）、对网络安全领域若干初创企业的支持、培训的实施、在巴黎高等学院（`HEC
    Paris`）、瑞士管理类大学以及公司或服务商的演讲、风险地图的实施、旨在提高 `GDPR`（《通用数据保护条例》）合规性的措施定义与部署，更不用通过公司、协会、基金会和公共机构实施网络计划。


    Marie DE FRÉMINVILLE

    2019 年 12 月


    # 引言：财务与网络绩效


    为什么不按照其财务和非财务绩效（治理和 `CSR` – 企业社会责任）一样来评估公司的网络绩效呢？


    为什么不通过审计师（其介入对某些规模的公司是强制性的）像认证财务绩效一样认证公司的网络绩效呢？


    尽管取得了一些进展，但大多数股东（因此董事会和管理层）主要关注公司的财务绩效。


    然而，数字时代正在给公司及其生态系统带来剧变。事实上，“全数字化”关乎所有利益相关者、行政部门、公共服务以及国家和国际基础设施、国防和情报部门。


    我们已经到了一个不可不回的阶段，这提供了重要的机会，但也是脆弱性和重大风险的源头，特别是因为网络威胁者正变得越来越专业化，并拥有大量的资源来进行欺诈、间谍活动和破坏。


    公司面临的风险是系统性的：股东在财务上面临风险，而负责制定战略和确保可持续性的董事，如果他们不了解数据安全和信息系统保护，且不确保建立起高水平的网络安全组织、程序和工具，则将在法律上面临风险。


    没有所谓的零风险，说，但如果公司在网络安全领域未采取行动，且攻击对公司的正常运行、盈利和声誉产生了重大影响，那么董事会的疏忽将与此相关。


    财务绩效不应再是首要任务。财务绩效和网络绩效现在应该是治理机构的两个首要任务。


    我们是否应该重新定义由国家行动指定的治理机构，即其能力、运作、议程和合作伙伴？


    五十年来，我们一直在穿过技术海啸：


    - – 1970 年代：大型机；

    - – 1980 年代：`PC`（个人电脑）和客户端/服务器架构；

    - – 1990 年代：`Internet`和电子商务；

    - – 2000–2010 年：移动端和云服务；

    - – 2010–2020 年：“物联网”和人工智能；

    - – 2020–2030 年：量子计算和区块链。


    数字世界是无国界且无实体的，威胁是不可见的。


    数字化及相关新技术正在改变公司的运营方式和商业模式。


    根据美国国家档案馆和记录管理局（`National Archives and Records Administration`）2018 年进行的一项研究，93%丢失数据
    10 天或以上的公司在灾难当年破产，半数（50%）在攻击后立即申请破产。


