  fmt: '

    In 2018, only 24% of companies had taken out insurance related to cybersecurity
    risks. Updating the insurance contract will verify the quality of the protection
    system, security policies and potential vulnerabilities.


    The cyber-risk landscape is constantly changing. Cyber-risks are complex and difficult
    to quantify, particularly because of the rapidly changing technological environment
    and the lack of historical data on cyber-claims.


    As Denis Kessler, CEO of Scor Insurance and Reinsurance Company, states in a document
    published in April 2017:


    > In view of the risk universe, there are three type of risks: ‘Acts of God’,
    which relate to natural events, ‘Acts of men’, which are the result of technological
    progress, and ‘Acts of the devil’, which include crimes, acts of war and terrorist
    attacks. Cyber-risk is a perfect example of how complex risks can be today, as
    cyber is recent, intangible, invisible, cross-border, and rapidly developing,
    at a pace with technology. In a cyber context, ‘Acts of men’ include accidental
    events with unintended damages or consequences, while ‘Acts of the devil’ refer
    to cybercrime.[²](#c03.xhtml#pg95fne0c1)


    It is therefore recommended to check that we can answer these questions: does
    my contract cover cyber events and is the information system covered by my contract?
    Does the insurance cover all the consequences just mentioned?


    The outcome of the dispute between Mondelez and Zurich Re is interesting to follow.
    This case may indeed set a precedent:


    - Mondelez lost 1,700 servers and 24,000 computers infected with NotPetya malware
    in 2017. The insurance contract subscribed by Mondelez stipulates that it is covered
    for “all risks of physical loss or material damage”, as well as for “physical
    loss or damage caused to electronic data, programs, or software, including loss
    or damage caused by the malicious introduction of an instruction or code generated
    by a machine”;


    - Mondelez, which owns the Toblerone, Oreo and Cadbury brands, claims $100 million
    from Zurich American Insurance Company, Zurich Re’s American subsidiary;


    - Zurich Re first offered Mondelez compensation of USD 10 million and finally
    rejected any compensation, invoking an exclusion clause in its property damage
    insurance policy for damage caused by “a hostile act or act of war” by “a sovereign
    government or power”;


    - this massive cyber-attack – of the ransomware type – had indeed been attributed
    to an action by Russian hackers aimed at destabilizing the Ukrainian government,
    although the Russian government has always denied being at the origin. An argument
    adopted by Zurich American Insurance Company, which considers NotPetya as “an
    act of war”;


    - the Mondelez Group is suing Zurich American Insurance Company.


    If Zurich Re is not convicted, this will have an immediate impact on all companies,
    which will not seek to transfer cyber-risks to insurance or will seek to obtain
    from their insurance company that the consequences of acts of war are covered.


    ## 3.14 Non-compliance risks and ethics


    The risks of non-compliance are quite recent: they mainly date back to the entry
    into force of the GDPR in May 2018, even if other laws such as the Data Protection
    Act in France or the LPD in Switzerland already regulated the processing, automatic
    or not, of personal data.


    The GDPR takes into account the considerable digital developments since the emergence
    of the Internet in 1989, the collection of data by digital societies and the exponential
    growth in the use of such data for economic, political or criminal purposes.


    The risks of non-compliance are therefore significant for companies, and sanctions
    can be significant.


    In addition, consumers will be increasingly sensitive to the use made of their
    data, and the trust they place in their supplier will depend on both respect for
    their consent (or non-consent), transparency on the collection and processing
    of this data, and finally on the protection measures put in place by these companies.


    1. [1](#c03.xhtml#pg87a1) HEC Gouvernance round table on October 13, 2016.

    2. [2](#c03.xhtml#pg95a1) According to the Scor Conference 2017: “Cyber risk on
    the rise: from intangible threat to tangible (re)insurance solutions”.


    # 4 Regulations


    ## 4.1. The context


    Fifty years ago, we would not have accepted that our mail should be opened, but
    an email can be considered a postcard sent without an envelope. We would have
    reacted strongly if our movements had been known, our expenses tracked, our readings
    and purchases studied by third parties.


    90% of the data produced worldwide have been produced in the last two years.


    The main data producers are the digital platforms of companies and connected objects:
    smartphones, pacemakers, elevators, refrigerators or breast pumps.


    Personal data (credit cards, social security number, email address, etc.) have
    a value. Personal data is of interest to companies, the State and hackers. The
    rapid evolution of the digitization of services and globalization has created
    a new data-based economy: the more data a company collects about its customers,
    the more services or products it can offer them.


    In return for their personal information, given free of charge to site publishers,
    social networks, taxi or apartment platforms, search engines or online distribution
    sites, new challenges for the protection of personal data have emerged.


    Technologies allow both private companies and public authorities to use personal
    data. Increasingly, individuals are making information about themselves publicly
    and globally accessible, most of the time without being aware of the use of such
    data for commercial, political, social or criminal purposes.


    This is a major upheaval in society and global balances: the platforms and providers
    of digital services and products are mainly American (GAFAM) or Chinese (BATX).
    In return for the data we have given them, without really knowing what we are
    giving them, they have the ability to colonize Europe, they know our tastes, consumption
    and travel habits, our lifestyle and health data, our financial resources, our
    friends, our interests, our professional background and projects, the hotels in
    which we stay, the restaurants we frequent, the sites (physical and digital) we
    visit, the books and newspapers we read, the films we watch.


    ### 4.1.1 Complaints filed with the CNIL


    The number of complaints filed with the CNIL, which is responsible for ensuring
    the proper use of personal data, increased by more than 32% in 2018, mainly due
    to the entry into force of the European Data Protection Regulation (GDPR) in May
    2018: the `Commission nationale de l’’informatique et des libertés` registered
    11,077 complaints in 2018, compared with 8,300 in 2017.


    Of the 310 controls carried out in 2018, 49 resulted in a formal notice. For example,
    we saw insurance companies and companies specializing in advertising targeting
    via mobile applications among the first sectors targeted: 11 sanctions were imposed,
    including 10 financial penalties, 7 of which concerned breaches of personal data
    security. `Uber`, `Bouygues Telecom`, `Dailymotion` and `Optical Center` are among
    the companies sanctioned.


    More than a third (35.7%) of the complaints received concerned the dissemination
    of data on the Internet, with a request to delete such data, whether identity
    data, accounts, photos or videos.


    Trade and marketing is the second most complaining sector, accounting for 21%
    of the total, with in particular a “very sharp increase in complaints concerning
    SMS prospecting”, which is most often done without prior consent.


    Among the other sectors concerned, human resources, in particular excessive video
    surveillance or geolocation, are the subject of 16.5% of complaints.

