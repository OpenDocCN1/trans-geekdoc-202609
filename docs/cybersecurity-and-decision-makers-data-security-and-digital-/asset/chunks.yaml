- raw: '> Today, France chooses to fully equip itself with cyber weapons for its military
    operations. We consider the cyber weapon as an operational weapon in its own right.
    It is a necessary choice, in terms of responsibility. We will use it proportionately,
    but those who are tempted to attack our armed forces should know that we will
    not be afraid to use it.


    The French Minister has expressed herself so clearly because the cyber threat
    is a serious one, for States, businesses and citizens alike. The cyberspace created
    by the United States in 1989, whose stated objective was to improve the sharing
    of fluid information and communications across a borderless and collaborative
    world, has gradually evolved into an area marked by the growth of cybercrime in
    all its forms.


    Cybercrime is expected to cost $6 trillion in 2021, up from $3 trillion in 2015,
    and will be more profitable than the global trade in illegal drugs.


    Invited to a conference on cybersecurity organized by the Ministry of the Economy
    and Finance and the Banque de France, as part of France’s G7 presidency, Denis
    Kessler, CEO of the reinsurance company Scor, said that “the reinsurance industry
    believes that cyber-risk is as important as the risk of natural disasters. This
    gives an idea of the magnitude of the threat we face”.


    The establishment of governance of the digital space is therefore essential, such
    as data protection, the creation of a digital identity, which would make it possible,
    in particular, to identify criminals, the establishment of standards and rules
    concerning the content of published information and digital privacy.


    ## **1.3. The cybersecurity market**


    ### **1.3.1. *The size of the market and its evolution***


    The cybersecurity market (hardware, software and services) is still small: it
    currently represents less than 2% of global GDP (estimated at 120 billion), but
    it has been growing strongly: +10% per year since 2016, and according to Cybersecurity
    Ventures forecasts, it is expected to grow by 15–20% from 2019 to 2021, due to
    the rapid development of corporate digitization, as well as due to the growth
    in regulations: personal data protection, obligation to respect international
    standards and sectoral regulations.


    Technologies are constantly evolving, and the development of artificial intelligence,
    Big Data and cloud computing is forcing players to quickly renew solutions.


    Hackers are perfecting their methods and tools, forcing companies, their IT providers
    and all cybersecurity actors to constantly improve their solutions to defend themselves
    more effectively.


    ### **1.3.2. *The market by sector of activity***


    The cybersecurity market has developed unevenly across sectors. The 2018 report
    by IDC (International Data Corporation) indicates that three sectors will increase
    their investments in 2019: banks, industry and governments (administrations).


    The telecommunications sector will become the fourth largest sector in terms of
    IT security investments by 2022.


    In France, the IT security market is expected to grow by an average of 8% per
    year between 2017 (2.6 billion) and 2021 (3.6 billion) and represent 6.5% of the
    IT market in 2021, compared to 5.2% in 2017.


    This is a young market, with a multitude of suppliers. Cybersecurity fairs are
    full of recently created suppliers. For cybersecurity managers and IT service
    providers, the offer is wide, too wide. Be careful about the compatibility of
    solutions, or rather the incompatibility of solutions; also, be careful about
    “miracle” solutions, which are expensive and do not protect you. Finally, even
    if you have an excellent quality (and therefore expensive) armored door and highly
    sophisticated locks, if you open the door to just anyone, the strength of your
    door will not be very useful.


    Security is based on a system that includes tools, organizations, procedures and
    skills, and therefore training.


    The consolidation of the many suppliers is inevitable. Large companies that have
    invested heavily will enter a phase of optimization, rationalization and centralization
    of purchasing, to avoid dispersion and additional costs, while improving the efficiency
    of the systems.


    ### **1.3.3. *Types of purchases and investments***


    Solutions dedicated to monitoring and protecting information systems (including
    SOCs, Security Operation Centers), internally or externally, will represent the
    main investment for organizations this year. The second area of investment will
    be network security equipment (firewalls, intrusion detection and prevention technologies).
    The increase in massive data leaks and Advanced Persistent Threat (APT) attacks
    are the main reasons for organizations to deploy defensive and proactive solutions.
    Finally, companies will also rely on integration services and security software
    for fixed and mobile terminals.


    This market, which is still in its infancy, is currently being organized, particularly
    by type of business: cloud offers, audit, training, services, certification and
    inspection, intelligence, etc.


    ### 1.3.4. *Geographical distribution*


    In terms of geographical distribution, 40% of the world market is currently in
    the United States and 25% in Europe, according to an IDC (International Data Corporation)
    study.


    China is the second largest market. Expenditure on security by the State (or local
    governments), telecommunications and central government accounts for 45% of the
    total.


    Japan and the United Kingdom are the other two most important markets.


    Two-thirds of IT security spending in 2019 is expected to come from large companies.


    ## **1.4. Cyber incidents**


    ### **1.4.1. *The facts***


    Remember that a computer incident or accident is not necessarily linked to an
    attack or hacking. Indeed, the causes are diverse, malicious or accidental, internal
    or external. A fire or flood will affect the information systems or data of the
    company or client companies (if the company hosts its customers’ data), with the
    same impacts, which can be significant, as a computer attack.


    Physical security and computer security are therefore closely linked. Nevertheless,
    given the digitization of organizations and the opening up of information systems
    to the outside world, cybercrime is growing exponentially and is indeed a major
    new source of risk. According to Cybersecurity Ventures, a company will be the
    victim of a ransom every 11 seconds by 2021.


    Cyber-attacks currently affect 2 billion people, and Microsoft estimates that
    the number of people affected will double by 2021 to 4 billion.


    #### 1.4.1.1. *Information on cybercrime*


    Many studies are published weekly by consulting firms, cybersecurity providers
    or clubs of security managers, IT managers or IT security managers.


    These studies have several biases:


    *   – some are oriented toward commercial purposes (selling products or services)
    or political purposes (empowering actors);


    *   – the samples on which the survey is carried out are reduced in comparison
    to the overall economic sector;


    *   – the answers are declarative; the surveys are sometimes the result of telephone
    surveys;


    *   – the interviewees, although there is a promise of confidentiality from the
    investigators, do they know/say the reality of the facts about the number of attacks,
    their severity, the success of the intrusions or the origin of the incidents?


    *   – in general, most companies are not ready to provide information about their
    vulnerabilities, computer incidents, fraud or data theft, and that is understandable.
    This is quite logical; how can customers, shareholders, suppliers and bankers
    trust a company whose computer systems are malfunctioning and which can no longer
    sell, produce or communicate?'
