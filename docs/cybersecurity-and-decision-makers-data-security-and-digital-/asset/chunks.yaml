- raw: 'ANSSI agents and TV5 Monde teams were working to regain control of their network.
    Their task was also technically complex. To understand the attackers’ modus operandi,
    they needed to familiarize themselves very quickly with equipment specific to
    the audiovisual sector. While the attackers have had several weeks, the deadlines
    imposed on ANSSI agents could be counted in hours. The objective was set as soon
    as they arrived: we must resume broadcasting as soon as possible and offer employees
    a temporary but secure solution to work. And above all, do everything possible
    to ensure that hackers do not set foot in the channel’s network again. The pressure
    was enormous: every minute that passed without satellite broadcasting cost the
    television channel thousands of euros.


    The first healthy computers were installed for TV5 Monde journalists. From that
    evening, at 8:00 p.m., TV5 Monde broadcasted again, but only with pre-recorded
    content. In the meantime, the clean-up began: infected machines were discarded
    and replaced by new equipment. The agents set up a small room so that journalists
    could resume their work: five Macs with an explicit sticker: “Absolute and unconditional
    prohibition: do not connect anything”.


    At this stage, ANSSI agents were still afraid that the pirates would return. As
    the days went by, workstations were added and soon formed the new newsroom for
    journalists. For weeks, the chain’s employees were traumatized by this episode:
    a wave of panic blew over the company when the ANSSI canceled passwords that were
    too old and therefore vulnerable. They then became unusable, and many journalists
    believed that the pirates were back.


    *A high-risk scale*. For one month, ANSSI agents, TV5 Monde teams and their subcontractors
    worked to map the network and prepare the switchover to a secure system, free
    of traces of the attack. The latter took place on May 11, one month after the
    attack. From 5 p.m. to 5 a.m., they carried out this extremely delicate operation
    without being able to disconnect the network, because TV5 Monde could not – once
    again – stop broadcasting. The experts even had to interrupt their technical operations
    every four hours to avoid disrupting the broadcasting of news programs.


    The two years after this turbulent episode have been instructive. The hackers
    took advantage of security breaches: TV5 Monde had outsourced large parts of its
    network to subcontractors, diluting knowledge about the network, and some basic
    good practices were not being followed. But these defects are identical in most
    large French companies, the ANSSI agents say, who are well placed to know this.


    The attack on TV5 Monde also fueled the concerns of these state experts. “There
    is a real awareness of the importance of information technology in our modern
    societies”, explains one of ANSSI‘s agents on stage at SSTIC: “There were several
    warning shots, TV5 Monde was one of them. Today, no attacker really wanted to
    kill anyone in France, but keep in mind that one day it could hurt a lot”.


    In total, this attack will have cost the television channel approximately €20
    million over five years. Who is behind this attack? As usual, ANSSI did not make
    any suggestions on this eminently political issue, leaving it to the judicial
    inquiry, opened by the anti-terrorist prosecutor’s office on the evening of the
    attack, to trace it back to possible leaders or sponsors.


    The latter, despite the claims posted on the channel’s website and social networks,
    turned to the pirate group APT28 that had learned of *Le Monde* from a judicial
    source in June 2015. The latter is suspected of being the armed arm of the Kremlin
    on the Internet.


    ### **6.6.5. *Management of the first few hours***


    #### 6.6.5.1. *Emergency measures*


    The first few hours should be devoted to emergency measures: alerting IT and IT
    security experts before abruptly disconnecting the devices on which the incidents
    have been observed, communicating internally and externally, notifying the authorities
    (ANSSI, ICO if necessary), preserving evidence, for reasons of responsibility
    and insurance.


    The CIO and CISO will make decisions to block the spread and isolate what has
    been affected, the company’s critical systems and sites and, if necessary, stop
    them to ensure this separation.


    Indeed, it is better to stop the activity for one day to protect the most critical
    sites and activities and restart what can be restored.


    Regular communication to the company’s managers and executives should be ensured
    by a person designated in advance, with explanations of incidents and impacts,
    information on restoration measures and a provisional schedule. The practical
    aspects of the teams involved in system protection and restoration must also be
    organized.


    The list of persons to contact must be established before the crisis: do not forget
    the legal department and lawyers, the general management, the board of directors
    (has the board of directors indicated the degree of seriousness at which it wishes
    to be informed?), an independent judicial investigator, the insurance company,
    the external auditors, the crisis communication advisor, who will have been identified
    before a crisis occurs (the cost of his/her intervention will be lower; he/she
    will know the company, its activity and the main risks), without forgetting investors
    and clients.


    Silence generally reigns after cyber-attacks: a laconic press release and then
    great silence.


    The case of Hydro, which was hit in March 2019 by the same malware as Altran,
    is different from this point of view: Hydro communicated widely as soon as the
    attack occurred and informed the public of the measures taken. Once its site was
    reopened, Hydro regularly informed its customers, suppliers and investors of the
    costs (the website indicates a financial impact of between 40 and 50 million euros
    for the first quarter of 2019), progress and outstanding issues. In particular,
    Hydro asks them to be extremely vigilant when they receive requests from the company,
    for example, to modify bank accounts and to contact Hydro services to verify the
    origin of this request.


    As Frédéric Charles (Green SI) tells us:


    > From March 19 until early April, the company published a dedicated page on its
    website with a press release and regular updates. A press web conference was also
    held on March 19 to give a situation of the impact on the company’s various activities
    and inform that energy production was not affected.


    Transparency was also provided on the return to manual procedures to continue
    processing the right production orders. The business continuity plan obviously
    worked.


    On April 2, when everything was much better, the company even launched a video
    on YouTube where the employees of the first affected site told how they experienced
    it. They explained how they understood that something serious was going on, how
    they all contributed to the continuity of the service regardless of their profession
    and how they spent nights and a weekend restarting their business.


    This attack will have cost at least $40 million in lost revenue and additional
    IT service costs to restart the IS for two weeks, but other costs will certainly
    appear for several months to come. Hydro announced that it had not paid the ransom,
    which would have been an additional cost.


    An insurance policy taken out with AIG will cover part of this operating loss.
    The stock price has returned to the same level after falling at the beginning
    of the crisis.


    This crisis that Hydro has had to face is instructive both for the way the communication
    was organized and for:


    *   – IT architecture: avoid the lack of centralized IT. Indeed, the Active Directory,
    necessarily centralized, was the means for the rapid spread of the virus;'
