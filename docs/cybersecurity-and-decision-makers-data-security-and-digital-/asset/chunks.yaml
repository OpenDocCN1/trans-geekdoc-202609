- raw: 'A number of technical black spots are at the root of data leaks:


    *   – the totally decentralized structure of the Internet, based on a multitude
    of different networks (at the beginning of June “Swisscom’s data passed through
    China”, the customers of the Dutch operator KDN, as well as those of the French
    operators Bouygues and Numéricable, were also affected, according to the newspaper
    *Le Temps* on June 12, 2019);


    *   – the architecture of IP addresses and domain names;


    *   – the “backdoors” of the equipment;


    *   – irregularities in the design of telecom operators’ services;


    *   – insufficient cryptographic tools for software and equipment.


    ### **1.1.2. *Data at the heart of industrial productivity***


    With industry technologies 4.0 – ERP (Enterprise Resource Planning), CRM (Customer
    Relationship Management), 3D printing, extended enterprise – with digital marketing
    technologies – websites, cookies, tag management – or with connected products
    and security cameras, data has been put at the heart of activities. Many data
    are collected and recorded in computer systems and software by different departments,
    without the company having detailed knowledge of all data flows and mapping.


    Understanding the geography of flows and mastering data is a fundamental strategic
    challenge for the competitiveness of companies, as well as for our defense capability.


    Reliable information and the verification of digital identities are critical for
    companies, users and IT service providers.


    ### **1.1.3. *Cyberspace, an area without boundaries***


    Hackers are difficult to identify, and there is a real asymmetry between attackers,
    who have many and effective weapons, despite few resources, and targets who have
    much greater resources, but who do not guarantee perfect defense.


    Cybersecurity is about the security and digital sovereignty of every State, every
    company and every citizen. It is of major political, economic and social importance
    and must therefore be addressed from different angles: educational, legal and
    regulatory, social, technical, military, organizational, individual and collective
    (national and international).


    The consequences of some attacks can be critical: for example, the attack on the
    SWIFT interbank network between April and May 2016, which led to fraudulent misappropriations
    of several tens of millions of dollars in Bangladesh, or the denial of service
    attack of October 21, 2016 on Dyn servers (a service that allows the users of
    a dynamic IP address to access a domain name), which paralyzed part of the Internet
    network in the United States for several hours and seriously disrupted the economic
    activities concerned.


    ### **1.1.4. *IT resources***


    Comprehensive knowledge of IT tools (hardware, software, network) is a structural
    challenge for companies: the way they have developed and managed their IT infrastructures
    in recent decades – fragmentary, in *silos*, at a time when risks were low – makes
    it more difficult for them to supervise them globally, which is essential for
    effective cybersecurity management.


    ## **1.2. Cybercrime**


    ### **1.2.1. *The concept of cybercrime***


    In short, it refers to criminal acts in the context of new technologies. We are
    also talking about computer fraud. Cybercrime includes, among other things, the
    illegal acquisition of private, personal or sensitive information. Cybercrime
    includes all crimes whose preparation or execution involves electronic data processing
    systems, such as sabotage, espionage and data interception.


    Cyberspace offers criminal opportunities: digital services and infrastructures
    are a gateway to malicious intent. Any connected equipment is hackable; it is
    necessary to ensure continuity between physical security and cybersecurity.


    As for computer attacks, or cyber-attacks, every week, new cases are revealed
    by the press, on all continents, in all sectors of activity (industry, banking,
    hospitals, hotels, online sales, etc.), for all types of companies: from start-ups
    to large listed groups, any other entities such as associations, foundations,
    town halls, public administrations and infrastructures, or even connected objects
    (surveillance cameras, pacemakers, children’s toys). And the press only reveals
    the tip of the iceberg. There is a veil of silence on the part of companies, which
    is understandable: none of them want to divulge their difficulties and especially
    not their cyber weaknesses.


    Computer instabilities or intrusions are made possible both by the increasing
    integration of new technologies into all aspects of our lives (mobility, home
    automation, purchasing, travel, banking, etc.) and into the lives of companies
    (sales, production, communication, security, financial operations, administration,
    customer relations, suppliers, employees, investors, banks, etc.) and encouraged
    by the digitization of public services, as well as by the increasing sophistication
    of computer attacks.


    Although information systems are increasingly protected, allowing more attacks
    to be blocked (in number and percentage), the number of intrusions was stable
    in 2018 compared to 2017, according to an Accenture study.


    As the graph in [Figure 1.2](#c01.xhtml#fig1-2) illustrates, computer attacks
    are not a new phenomenon; they started more than 30 years ago, with the birth
    of computer networks and then the Internet.


    They have then intensified due to the increase in vulnerabilities related to the
    digitization of economic operations, the opening up of computer networks, data
    exchanges, mobility, the development of applications and connected objects, and
    the widespread networking of computers.


    ![Figure 1.2. History ¶ (source: Starboard Advisory)](image/image27_c2957.jpg)


    **[Figure 1.2.](#c01.xhtml#fig1_2)** *History* ¶ *(source: Starboard Advisory)*


    It should be noted that hardware and software are sometimes sold voluntarily with
    “backdoors”, which allow software developers or hardware manufacturers to use
    them to monitor or even take control of the software’s activities, or to take
    control of the computer. It is like a house builder selling you a house while
    keeping the key to a hidden door.


    These backdoors make it possible to carry out maintenance operations efficiently
    or to disable the software in the event of disagreement with its customer (non-payment
    of license).


    They can also be installed by hackers to copy or destroy valuable data (IDs, passwords,
    social security numbers, bank details, means of payment, confidential information)
    or take control of a computer and use it to carry out malicious actions (computer
    viruses, denial of service, ransom demands, etc.).


    Attackers organize and specialize: some open the door to allow others to break
    in and take the data or organize financial fraud. The service provided (open the
    door) is sold at auction on the darknet.


    Finally, on this backdoor issue, States have different opinions. Russia has legislated
    to provide publishers with a way to access encrypted communications. The member
    states of the Five Eyes alliance (intelligence services of the United States,
    Australia, New Zealand, the United Kingdom and Canada) also wish to impose the
    introduction of software vulnerabilities.


    The main and official objective is to be able to decipher certain communications
    that could be linked to terrorist activities and to share information between
    intelligence services. It also allows State spying, access to trade secrets and
    the infringement of individual freedoms. The risk is that these vulnerabilities
    may be exploited by malicious people.


    Digital trust therefore depends on the ability of companies to protect systems
    and data, as well as on the protection of the entire ecosystem, including digital
    strategies put in place by governments and the work undertaken by information
    system security agencies to ensure the protection of equipment, applications,
    networks and software.


