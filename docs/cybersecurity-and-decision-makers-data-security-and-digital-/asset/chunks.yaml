    # Glossary


    **ANSSI**:

    Agence nationale de sécurité des systèmes d’information française [French security
    agency for information systems]


    **APT**:

    Advanced Persistent Threats, discreet and time-consuming intrusion to take data
    without attracting attention


    **BATX**:

    Bidu, Alibaba, Tencent and Xiaomi, to which should be added the “H” of “Huawei”,
    the Internet giants of China


    **Botnet**:

    network of computer robots that perform tasks on a network


    **CERT**:

    Computer Emergency Response Team


    **CIO**:

    Chief Information Officer


    **CISO**:

    Chief Information Security Officer


    **CNIL**:

    Commission nationale française de l’informatique et des libertés [French regulatory
    body to ensure that data privacy laws are applied for the collection, storage
    and use of personal data]


    **COSO**:

    internal control framework defined by the Committee of Sponsoring Organizations
    of the Treadway Commission


    **CRM**:

    Customer Relationship Management


    **DoS**:

    Denial-of-Service attack


    **ENISA**:

    European Union Agency for Cybersecurity


    **ERP**:

    Enterprise Resource Planning


    **FINMA**:

    Swiss Financial Market Supervisory Authority


    **GAFAM**:

    Google, Apple, Facebook, Amazon and Microsoft


    **GDPR**:

    General Data Protection Regulation


    **IoT**:

    Internet of Things, interconnection between the Internet and objects, places and
    physical environments


    **IT**:

    Information Technology


    **LPM**:

    French Military Programming Act


    **MELANI**:

    Swiss registration and analysis center for information assurance


    **NIS**:

    Network and Information Security, European directive adopted on July 6, 2016,
    on network and information systems security


    **Phishing**:

    the fraudulent practice of sending emails apparently from reputable companies
    in order to induce individuals to reveal personal information, such as passwords
    and credit card numbers or login information


    **Ransomware**:

    malicious program that locks a computer or encrypts its data in order to extort
    money from the user; reproduces on several computers using the network


    **Rootkits**:

    they allow remote access and recording (camera)


    **SEC**:

    Securities and Exchange Commission, in the United States


    **SIEM**:

    Security Information and Event Management


    **SOC**:

    Security Operation Center


    **Spyware**:

    or malware that installs itself in a computer or mobile device to collect and
    transfer information about the environment in which it has settled, very often
    without the user’s knowledge; logs keyboard and screen data


    **Trojan horse**:

    a program that takes control of your computer


    **Virus**:

    a program that associates itself with another program and causes it to malfunction


