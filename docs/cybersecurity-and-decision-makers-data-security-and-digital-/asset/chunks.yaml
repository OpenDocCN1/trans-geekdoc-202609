    the burning of Notre-Dame on April 15, 2019, the State set up a site to collect
    donations from individuals, with a view to reconstruction.


    This is a good opportunity for fraudsters, the money will flow. With a fake `Fondation
    du Patrimoine` logo, but with a real `RIB` (bank account details), an email urged
    the “friends of France” to make donations for a “symbol of our history”. The site
    (created in Italy) was fraudulent and tried to surf the wave of generosity. It
    is not the only initiative; other scams have been identified and reported.


    ### 1.2.3. Five types of attackers


    #### 1.2.3.1. Looking for easy money


    Targets are identified according to two main criteria: they have assets (data
    with a `darknet` value or good financial performance) and they are fragile from
    the point of view of protecting IT systems and/or internal organization and procedures.


    #### 1.2.3.2. Cyberactivists/hacktivists


    The best-known cyberactivist or hacktivist movement is the Anonymous movement,
    created in 2006, better known since 2008, which is looking for hackers because
    of the principle of anonymity, lack of hierarchy and freedom of expression. The
    most common type of hacktivist attack is the degradation of websites, in order
    to insert a political message.


    Anonymous launches denial of service (`DoS`) attacks against the sites of targeted
    companies, considered as enemies of the values defended by the movement. In December
    2010, attacks were carried out on the MasterCard site following MasterCard’s decision
    to no longer provide services to WikiLeaks, a non-governmental organization founded
    by Julian Assange in 2006, whose objective is to publish documents, some of which
    are confidential, as well as political and social analyses on a global scale.
    Its purpose is to give an audience to alerters and information leaks, while protecting
    its sources. Several million documents relating to corruption, spying and human
    rights violation scandals involving dozens of countries around the world have
    been published on the website since its inception.


    In late 2010 and early 2011, the group was involved in attacks against countries
    with high levels of Internet censorship.


    On April 2, 2011, Anonymous launched an operation called `#opsony` against Sony
    and the PlayStation Network, to denounce the legal proceedings against hackers
    who had managed to bypass the digital protections of the PlayStation.

    '
