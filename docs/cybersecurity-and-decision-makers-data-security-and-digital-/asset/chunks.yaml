    learn, progress and defend yourself better.


    ## 1.4.3. *Trends*


    ### 1.4.3.1. *Cybercriminal methods*


    Cyber-attacks are improving and evolving. The attack surfaces are growing: mobility,
    cloud, connected objects and, at the same time, the ability of attackers to detect
    and protect themselves is increasing.


    Targets are increasingly attacked via their suppliers, partners and service providers;
    it has become more complicated to go.


    ### 1.4.3.2. *The attackers*


    Attackers are progressing and always one step ahead: `IoT` (Internet of Things)
    networks, `APT` (Advanced Persistent Threats) to launch attacks.


    Targeting is now a priority. It is more lucrative and more efficient.


    ### 1.4.3.3. *Connected objects*


    To raise awareness and encourage citizens in Japan to better protect themselves,
    the National Institute of Information and Communications Technology has tried
    to infiltrate 200 million connected objects starting in February 2019: routers
    and webcams will be targeted.


    The initiative could be extended for the next five years.


    ### 1.4.3.4. *Cyberwarfare*


    Spying and sabotage operations, as well as information warfare, are now carried
    out by digital means and are at the forefront of strategic action, as Jean-Louis
    Gergorin and Léo Isaac-Dognin explain in their book *Cyber. La guerre permanente*,
    published in 2018. They very clearly detail this new form of warfare: digital
    technology makes it possible to act at a distance and offers a paralyzing and
    reversible capability. Moreover, it considerably increases the global reach, instantaneous
    speed and power of intelligence, influence and clandestine action (difficulty
    of attribution) with a low cost (which significantly modifies the balances between
    major powers) and a high targeting capacity.


    Cyberwarfare between States can impact not only governments but also sensitive
    public organizations and, more seriously, critical national infrastructure (energy,
    telecommunications, defense, etc.) and by extension (or directly) companies.


    The alliance of 29 NATO member countries recognized cyberspace as a domain of
    war, as well as land, air and sea, in 2014. In late 2018, member countries declared
    that NATO would establish a cyberspace operations center to coordinate NATO’s
    cyber activities. NATO also discussed integrating each country’s IT capabilities
    into Alliance operations.


    In September 2018, the White House warned foreign hackers that it would increase
    offensive measures as part of a new national cyber security strategy. US intelligence
    officials were expecting a series of digital attacks before the November 6 elections.


    The United States announced in 2019 that it will use offensive and defensive IT
    capabilities on behalf of NATO.


    ## 1.4.4. *Examples*


    ### 1.4.4.1. *Information leaks*


    Information leaks can be the result of misuse or negligence, including by managers,
    consultants or IT service providers: data are sent by mistake to one contact instead
    of another, database access management is unreliable, passwords are left visible
    or easy to guess, passwords are not updated regularly, software is not updated,
    double authentication recommendations are not respected, confidential data is
    accessible, transferable and able to be copied. Websites are not secure either.

    '
  trans: '


    - – 2019 年 5 月，《巴黎报》（*Le Parisien*）宣布，“Picoty SA 是一家在法国中部偏远地区克吕兹（Creuse）经营燃料配送的公司遭受了勒索攻击：该公司的计算机系统受到文件加密系统的攻击。网络犯罪分子随后索要
    50 万欧元，以便公司恢复对系统的访问权限”；


    - – 2019 年 6 月 14 日，据法新社（AFP）报道，比利时承包商 Asco Industries 在泽文特姆（Zaventem）警察区提交了针对勒索系统遭受网络攻击的诉状，该公司是空客、波音、隆巴达和洛克希德·马丁等主要制造商的包商。该比利时工厂关闭了几天；美国、加拿大和德国的其他站点也已关闭。该公司发言人表示：“我们目前正在努力让业务尽快恢复运行并为客户提供服务”。


    ## 1.4.1.5. *世界上最糟糕的鞋匠*


    在 2019 年 4 月 17 日，据报道，主要在以色列运营的美国监控和网络情报领先者 Verint 公司遭到了`ransomware`攻击，而大多数高层人员正在意大利参加一个会议。这次攻击本可以很快被识别，安全团队本可以迅速反应。没有人是安全的。


    2019 年 2 月 13 日的《鸭子日报》（*Le Canard enchaîné*）揭露了 CLUSIF（法国信息安全专家俱乐部）的数据泄露事件，该公司并未采取必要的预防措施。


    事实上，超过 2,200 名主要 IT 安全总监和会议参与者的姓名及个人详情（姓、名、电子邮件地址、手机号码）在 CLUSIF 网站上可以自由获取。


    《鸭子日报》宣布，这份名单包含了共和国总统府首席信息安全官（`CISO`）的联系方式，以及核安全局（`NSA`）官员、武装部队参谋部、马蒂尼（Matignon）、参议院、武器制造商或银行专的联系方式。


    要获取此列表，只需使用关键词“Clusif”和“csv”进行搜索即可。该文件由 CLUSIF 托管，但没有得到良好保护。这是网站管理中常见的人为错误。


    为了防止敏感数据泄露，虽然遵守安全规则至关重要，但由专业人员监督这些标准的执行也至关重要。


    ## 1.4.2. *证言与沉默*


    除了在 2015 年遭受攻击的 TV5 Monde 首席执行官伊夫·比戈（Yves Bigot）外，很少有企业领袖愿意就危机、信息系统的故障、流程、员工培训、对攻击风险和后果的意识缺乏、所需的投资、需要实施的纪律以及分配的预算公开证言。


    在这些几乎毁了 TV5 Monde 生计的事件之后，伊夫·比戈在多次会议上发言。没有比这种证言更能理解风险并采取必要措施来避免此类创伤性经历了。


    在法国，也有“圣戈班（Saint-Gobain）之前”和“圣戈班之后”。圣戈班首席执行官皮埃·安德烈·沙兰达（Pierre-André Chalendar）在这家法国大公司遭受攻击时并未发表公开证言。


    另一方面，他向 `CAC 40` 公司的董事会和执行委员会进行了机密证言，以便董事和高管能够关注这一议题。因此，此类证言很罕见，这很遗憾，因为它们是有效的。


    沉默是最常见的做法；它不利于能够做出更好、更快速反应的信息传播。


    IT 安全或安全经理的俱乐部是有德德的；它们允许你进行交流、学习、进步并更好地保护自己。


    ## 1.4.3. *趋势*


    ### 1.4.3.1. *网络犯罪手段*


    网络攻击正在改进和演变。攻击面正在扩大：移动性、云端、联网设备，与此同时，攻击者的防御能力也在增强。


    目标越来越多地通过其供应商、合作伙伴遭受攻击；这变得更加复杂。


    ### 1.4.3.2. *攻击者*


    攻击者正在进步并始终领先一步：`IoT`（物联网）网络、`APT`（高级持续性威胁）发动攻击。


    目标现在已成为重点。这更有可可也更高效。


    ### 1.4.3.3. *联网设备*


    为了提高意识并鼓励日本公民更好地保护自己，信息通信技术研究院从 2019 年 2 月开始尝试对 2 亿台联网设备进行渗透：路由器和摄像头将成为目标。


    该计划可能会持续五年。


    ### 1.4.3.4. *网络战*


    间谍活动和破坏行动以及信息战现在通过数字手段进行，并处于战略行动的前沿，正如让·路易·格戈林和利奥·伊萨克·多尼在 2018 年出版的书《网络：持久战》中所述。数字技术使得这种新型战争形式的远程行动成为可能，并提供了瘫痪和可逆的能力。此外，它显著增强了全球范围、即时速度以及情报影响力和秘密行动能力（难以溯源），成本较低（显著改变了大国之间的平衡），且具有高目标能力。


    国家之间的网络战不仅影响政府，还会严重影响关键国家基础设施（能源、电信、国防等）以及间接或直接影响公司。


    2014 年，由 29 个北约成员国组成的联盟将网络空间认定为作战领域，如同陆、空、海一样。2018 年底，成员国宣布北约将建立网络空间行动中心，以协调北约的网络。北约还讨论了将各国
    IT 能力整合到联盟行动中。


    2018 年 9 月，白宫警告外国黑客，将作为新的国家网络安全战略的一部分增加进攻措施。美国情报官员预计在 11 月 6 日选举前会有一系列数字攻击。


    美国于 2019 年宣布将代表北约使用进攻和防御 IT 能力。


    ## 1.4.4. *示例*


    ### 1.4.4.1. *信息泄露*


    信息泄露可能是由于误用或疏忽导致的，包括经理、顾问或 IT 服务提供商：数据错误发送给一个联系人而非另一个、数据库访问管理不可靠、密码暴露在外或易于猜测、密码未定期更新、软件未更新、未遵守双重认证建议、机密数据可访问、传输和复制。网站也不安全。


    '
