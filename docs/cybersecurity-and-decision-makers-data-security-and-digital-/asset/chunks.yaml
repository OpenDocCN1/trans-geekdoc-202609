    In addition, besides commercial issues, an action plan for compliance must be
    put in place: organization, documentation, alignment of processing operations,
    training/communication, name of the person in charge, date of commissioning. This
    action plan will be defined depending on the company and its activity with the
    CIO, the business lines, HR and customer management.


    In particular, it will be necessary to:


    * – produce/update the processing of personal data: purpose, users, responsible,
    nature, retention period;

    * – map the data, identify the location of the storage, the media and the subcontractors
    involved;

    * – update websites and documents with the new legal notices and explicit management
    of consent with a reminder of the purpose of the processing operation, not to
    mention the option of opposition;

    * – involve subcontractors and partners affected: software publishers, data hosts,
    IT service providers.


    In the event of criminal proceedings, the managers may be held liable if it is
    shown that they were negligent or that they were personally at fault. The offenses
    concerned are invasion of privacy, non-compliance with formalities (request for
    consent), processing of sensitive data when it has not been authorized, failure
    to communicate security breaches to IT service providers, collection of personal
    data by fraudulent means and retention of sensitive data without consent.


    # 5. Best Practices of the Board of Directors


    The responses to be provided are multiple: individual and collective, educational,
    technical, legal and regulatory.


    Many pitfalls are to be avoided:


    * – you have a CISO, everything is fine;

    * – cybersecurity is an IT problem;

    * – the tools (antivirus, firewall, SOC and CERT) are in place;

    * – the company is too small to be attacked;

    * – BYOD (Bring Your Own Device) policy is “safe”;

    * – the threats come only from the outside;

    * – the company is 100% secure, no need for audit or testing;

    * – our data is in the cloud, everything is fine;

    * – our data has no value;

    * – our service providers are responsible;

    * – industrial infrastructure is not concerned;

    * – we have nothing to hide.


    ## 5.1. Digital skills


    Although many corporate directors consider cybersecurity to be an operational
    issue, the liability of the board of directors may be sought in the event of negligence
    or mismanagement, if the sustainability of the company is at risk, as a result
    of cybersecurity issues, lack of risk management and internal control.


    “The composition of the board of directors must be adapted to the company’s challenges”,
    says `APIA` (`Association professionnelle des administrateurs indépendants*).
    “The diversity of the Board’s members must therefore be analyzed in the light
    of their skills and experience, particularly in the face of digital challenges”.


    This digital competence is necessary both for strategic issues, for the assessment
    of cyber-risks and also for the assessment of the executive management’s digital
    skills, its ability to change the internal organization, its customer relations,
    the production tool and the company’s culture (digital natives aspire to a faster,
    more transparent and more collaborative organization than the generations in power
    cannot ignore).


    Administrators do not need to be digital experts to exercise their responsibilities
    and understand strategy and risk through a digital lens. Their understanding of
    the issues, their network, and their ability to interact with the company’s experts,
    internal or external auditors, and risk managers are now essential for all companies
    and organizations.


    When this issue of the digital skills of the boards of directors is raised in
    director circles, the answers are edifying:


    * – administrators do not have digital skills;

    * – it is not a subject that goes back to the board;

    * – this is an operational issue;

    * – we do not have time to address these issues; the board’s agenda focuses on
    strategy and financial performance.


    The evolution of the boards of directors is far too slow in relation to digital
    issues. Regulations and new skills found among the boards are the main factors
    enabling their transformation.


    All stakeholders, investors, financial analysts and clients will welcome the appointment
    of a competent director in this area.


    ## 5.2. Situational awareness


    A good knowledge of the situation is the first step in the effectiveness of the
    board of directors and executive management, both in terms of content and speed.


    It is therefore necessary to define the information to be shared, the frequency
    and the means. Digital tools make it possible to reduce the information asymmetry
    between the board of directors and executive management. Indeed, administrators
    have direct and real-time access, via the press, `Google alerts` and social networks,
    to information about the company, competitors, critical countries or suppliers
    or main customers.


    In addition, the possibility of sharing certain data in real time with executive
    management should facilitate exchanges between directors and officers, even if
    it is necessary to remain attentive to the responsibilities of each and every
    one and to the importance for the board of directors to maintain a certain distance
    from daily life (except in the event of a crisis) and to keep an eye on the long-term
    course.


    ### 5.2.1. The main issues


    In 2018, the United States Securities and Exchange Commission (`SEC`) issued guidance
    for listed companies on cybersecurity disclosures. As cyber incidents are increasingly
    making the headlines, companies and regulators recognize that cyber incidents
    are not a passing trend, but rather a risk inherent in our new and sustainable
    economy. The `SEC`’s view of the role of the board of directors has evolved in
    recent years and resulted in the publication of the 2018 guidance document. Corporate
    directors are now expected to get involved and, therefore, must demand greater
    visibility for what is often presented as a dark and very complex area that is
    best left to technologists. Even if this document is not very specific about the
    actions to be taken (these are specific to each company), some recommendations
    can be identified.


    #### 5.2.1.1. It starts with the CEO! –tone from the top


    If the chief executive officer does not understand the importance of cybersecurity,
    the board will have difficulty exercising its responsibilities and ensuring that
    appropriate risk-based measures are in place and functioning. The risk is often
    minimized, and managers may become aware of the potential impacts when the damage
    has already been done. The consequences can be immediate and sometimes catastrophic.


    Therefore, boards of directors must take proactive steps to ensure that the chief
    executive officer makes cybersecurity preparedness an organizational priority.
    Without the leadership and day-to-day objectives given by the `CEO`, any cybersecurity
    program is likely to fail. The actions of the board of directors or their absence
    will also be examined.


    #### 5.2.1.2. Avoiding the method of checking checklists of checkpoints


    It is certainly not the task of the board of directors to be responsible for the
    day-to-day implementation of the company’s cybersecurity program. But the board
    of directors must be involved, use available resources, understand and evaluate
    the adequacy of the measures taken and require active and continuous visibility.


    In cybersecurity, as with other topics, “ticking the box” can help create a false
    sense of trust. The key questions for the boards are: does the company have a
    cybersecurity program in place? Is this program effective? To assess these questions,
    board members must look beyond the surface and seek to understand whether the
    policies and procedures in place are truly adapted to meet the organization’s
    unique needs.

