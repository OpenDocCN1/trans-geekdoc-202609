- raw: 'Beyond the security and sustainability of the company, it will therefore be
    the responsibility of the board of directors, and the digital committee if it
    is formed, to ensure the social and environmental impacts of the digital strategy.


    ## **2.4. Customers and suppliers**


    Customer satisfaction in a BtoC (Business to Consumer) activity, such as online
    sales or online banking, is closely linked to the quality of the cybersecurity
    and data protection measures implemented by their product or service providers.


    The trust that customers place in their suppliers is not only linked to the quality
    of the products or services purchased but also to the quality and security of
    the website, the means of payment, the level of protection of the data collected
    and stored by the supplier in the course of these transactions, as well as the
    respect of consents given or refused when connecting to the website.


    These cybersecurity and customer data protection efforts have a cost, as well
    as an essential competitive advantage.


    According to a 2018 Capgemini Digital Transformation Institute study of 6,000
    consumers, cybersecurity and data protection are the third most important criterion
    when choosing an online supplier, after product or service quality and availability,
    and before selling price and price discounts, brand reputation and the guarantee
    that the product will be replaced or refunded if it is defective or damaged.


    Among the customer requests, the most frequent ones are the following:


    *   – encryption of saved data;


    *   – password request;


    *   – clarity of the data privacy policy;


    *   – possibility of controlling the stored data and the duration of the archiving
    of this data;


    *   – use of antivirus software;


    *   – use of encryption tools on websites and applications;


    *   – double authentication, with a mobile phone or a fingerprint.


    This study also shows that:


    *   – consumers have a perception of cybersecurity and data protection efforts
    that is lower than the level that their suppliers say or believe they have reached;


    *   – consumers would buy more online if they had more guarantees.


    The main reasons for this discrepancy are:


    *   – failures in connected objects, poor segregation of duties, old infrastructure,
    inadequate security tools, vulnerable payment systems, lack of data encryption
    and employee errors;


    *   – a lack of communication from suppliers on the efforts undertaken;


    *   – a lack of transparency on data theft (40% of online retailers had leaks
    of personal and confidential data between 2015 and 2017). Indeed, 31% of suppliers
    (retailers) did not notify their customers before they were informed by the press.
    The GDPR regulation should improve this transparency, since companies have 72
    hours to inform the authorities (CNIL, *Commission nationale de l*’*informatique
    et des libertés* in France, for example, and ICO, Information Commissioner, in
    the UK) and to inform their customers, in case of high risk (theft of credit cards,
    for example).


    The conclusion of this study focuses on recommendations to gain the trust of their
    customers and to obtain a better turnover with each of them:


    *   – understand their expectations, be at the forefront of cybersecurity devices
    and be ahead of hackers; focus efforts on protecting the data collected;


    *   – monitor and audit information systems and transactions on a daily basis
    to detect anomalies;


    *   – train employees regularly and systematically train new employees (high staff
    turnover in e-commerce activities);


    *   – strengthen security measures: antivirus (firewalls) and authentication systems
    (with a sufficient password length).


    Following a data leak, e-commerce companies generally focus on two main actions:
    implementing solutions to protect themselves from APTs (Advanced Persistent Threats)
    and setting up a SOC (Surveillance Operation Center) to detect and prevent fraud.
    However, the following actions are not considered priorities: data costing, systems
    and network redesign, recruitment of experts and judicial investigation.


    ## **2.5. Operational management**


    ### **2.5.1. *The impacts of digital transformation***


    The board of directors must ask itself the question of the operational management’s
    digital skills, which is in charge of defining the strategy and proposing it to
    the board of directors: the search for the right balance between the digital revolution
    and the skills of the general management can lead to strengthening the Management
    Board, rebalancing it and training it in new technologies.


    Indeed, these offer new opportunities, as well as have a strong influence on working
    methods, the organization and culture of the company, hierarchical links and relations
    with the outside world. Digital transformations also present significant risks:
    lack of proximity, loss of meaning, internationalization, displacement of power,
    changes in the value chain, the emergence of new professions and the disappearance
    of traditional ones.


    Digital transformation also requires an adaptation of remuneration methods: multi-channel
    changes the proportion of turnover coming from physical sites and individual commercial
    approaches. The tools allow information sharing and productivity gains, production
    methods, cost and deadline improvements and quality controls are based on the
    introduction of information systems and numerical controls.


    This transformation requires skills, training, organizational change and investment.


    It is not without risks: matrix organizations, reduction in intermediate management,
    acceleration and short-term management, multiplication of coordination meetings
    and, of course, technological challenges, risks of cyber-attacks, amount of investments,
    loss of proximity with customers, decrease in quality and positioning in the value
    chain.


    ### **2.5.2. *The digital strategy***


    Implementing governance and digital strategy in the company to meet security challenges
    is a responsibility of managers: data, product and information system security
    (general IT, production, products, sales, support functions), data identification
    and critical systems.


    It is also a responsibility of the board of directors, which must examine the
    new opportunities offered by digital technologies and review the objectives to
    ensure the company’s sustainability. It must then choose the best strategy to
    achieve these objectives, monitor its execution and analyze the risks to control
    them.


    The use of new digital technologies is not an end in itself, but a means to reach
    new customers and markets, to offer new products and services, and even to improve
    the company’s performance, gain efficiency and optimize the business model (selling
    prices, cost prices, investments, etc.).


    Even if it is not an end in itself, the board of directors cannot ignore the examination
    of objectives and strategy with a digital prism, both from an opportunity and
    a risk point of view. This review will of course be different for each sector
    of activity and each type of company.


    An in-depth analysis of customers and the evolution of their habits and requirements,
    competitors, new players and innovations in their sector of activity, as well
    as possible transformations of the company’s processes, will be essential for
    directors. The results of this monitoring and the analyses of this information
    should be shared by the board of directors.


    Digital technology offers new commercial channels and can make it possible to
    switch from a BtoB model to a BtoC model, to internationalize, to communicate
    widely and quickly (websites, social networks) to strengthen one’s brand and improve
    competitiveness by reducing costs (production, inventory management, information
    exchanges with suppliers and subcontractors, quality improvement).


    The quality of the data collected and the analysis of this data will be essential
    to develop commercial offers, customer relations and payment methods.'
