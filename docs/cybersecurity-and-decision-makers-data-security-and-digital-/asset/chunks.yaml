- raw: 'Finally, the risk analysis may lead to a transfer of risks to insurance. Although
    cyber-risks are complex and difficult to quantify, particularly because of the
    lack of historical loss data and the wide variety of incidents that can occur,
    insurance companies are positioning themselves in this market and have an analytical
    grid that allows the company to better understand its level of risk and protection.


    Ratings, as discussed in [section 2.2.2](#c02.xhtml#head2-2-2), are a tool and
    a point of vigilance for boards of directors, and in particular audit committees.
    They allow a quick audit to be carried out and the progress of improvements to
    be monitored. It would be better to anticipate these ratings before they become
    public.


    #### 2.3.4.2. *Reinventing the board of directors?*


    Directors are not IT experts and are not intended to be. Beyond the digital strategy
    and the transformation of the business model, it is nevertheless necessary to
    understand the laws, threats, risks, consequences, roles and responsibilities,
    and methods to protect the company.


    The difficulty for the board of directors and managers stems in particular from
    a lack of a common vocabulary on cybersecurity issues that is understandable by
    all, as well as objective data to assess, manage, compare and decide on cyber
    performance.


    First of all, it is a question of improving communication between the IT department
    and the rest of the company: one in four IT decision makers do not inform their
    management in the event of cyber-attacks.


    Corporate boards of directors can set up a digital committee, as Schneider Electric
    did in 2017, or a security committee, as the Richemont group in Switzerland has
    done, capable of managing and controlling cyber-risks and crisis management, and
    offer more digital training to directors:


    *   – Schneider Electric’s digital committee is dedicated to digital strategy
    and performance. It holds at least three meetings per year, including the joint
    review of cybersecurity risks with the audit and risk committee. It prepares the
    Board’s work by examining seven subjects in greater depth: development and growth
    of the digital business, improvement and transformation of the digital experience
    of the group’s customers and partners, improvement of Schneider Electric’s operational
    efficiency through the effective use of training technologies and digital automation
    capabilities, cyber-risk assessment and improvement of the Group’s position in
    cybersecurity (jointly with the audit committee), assessment of the contribution
    of possible M&A transactions to the Group’s digital strategy, monitoring and analysis
    of the digital environment (competitors and processors, threats and opportunities),
    and verification that the company has the appropriate human resources for digital
    transformation;


    *   – the Richemont group (luxury industry in Switzerland) has created a Strategic
    Security Committee (SSC), which meets four times a year. Its responsibility is
    to advise the board of directors on all aspects of security policies; its objective
    is to protect the company’s assets, including confidential information and intellectual
    property, as well as its operations against intrusive actions. The committee also
    supervises property and persons.


    ### **2.3.5. *The board of directors and data protection***


    It is no secret that we entered the era of Big Data, which consists of capturing,
    analyzing, sharing and storing digital data. Big Data is powered by e-commerce,
    and services will be powered by the Internet of Things, autonomous cars or drones
    in the future.


    More and more companies are experiencing cyber-attacks and data leaks, such as
    Yahoo!, Equifax, Facebook or British Airways. These two observations raise the
    problem of digital trust and therefore that of digital responsibility.


    The risks are high enough for investors, and in particular responsible investment,
    to get involved. NEI Investments, Canada’s leading provider of responsible investment
    solutions, owned Facebook securities in three of its funds.


    At Facebook’s general shareholders’ meeting in 2018, NEI Investments voted against
    all members of the board of directors, considering that they had failed to protect
    their users’ data.


    The GDPR (General Data Protection Regulation) could be expensive, very expensive
    for Web giants and other actors. Complaints have been filed against Google and
    Facebook. In total, $8.8 billion is being claimed from the two American companies.


    Concerning the company’s compliance with the GDPR, there are two main topics:


    *   – what do companies do with the data collected; have they received user consent
    and for which services have they received consent?


    *   – how are data and information systems protected?


    In conclusion, the board of directors shall:


    *   – acquire the skills and committees adapted to its sector of activity, strategy
    and risks;


    *   – check that the cyber-risk is on the CEO’s agenda (it starts with the CEO!);


    *   – inform itself (be diligent) and challenge the managers;


    *   – regularly audit the systems (organization, processes, tools and teams),
    with the help of trusted and long-term service providers;


    *   – include cyber information in the annual report.


    ### **2.3.6. *The statutory auditors***


    The main mission of the statutory auditors is to certify the regularity and sincerity
    of the accounts. It is permanent and includes obligations toward the partners.
    Through their knowledge of companies’ procedures and systems, the auditor has
    a real role to play with them, in particular to measure the company’s exposure
    and maturity to cyber-risks, assess the financial impacts (ransoms, fraud against
    the president, fraud against “false RIBs”, fines) and write a report for the attention
    of managers.


    In particular, their role is to alert management so that the company can modify
    the rules and improve the application of security rules when it has identified
    breaches of IT security standards that may damage the company’s financial assets.


    If necessary, the external auditors/internal auditors may recommend to the CFO
    or audit committee an audit of the company’s information systems and processes
    by an external expert.


    The *Compagnie nationale des commissaires aux comptes* (CNCC) has developed the
    CyberAUDIT© tool, which measures the company’s exposure and maturity to cyber-risks,
    assesses the financial impacts and prepares a report for managers.


    The auditors can be considered as partners of the board of directors, both for
    the certification of the accounts and also for the company’s cyber performance:
    its processes, its organization and its information systems.


    ### **2.3.7. *The numerical responsibility of the board of directors***


    Beyond cybersecurity and data protection issues, the board of directors must reconcile
    its social and environmental responsibility with its digital responsibility.


    Indeed, digital transformation, automation and robotization have consequences:


    *   – societal: employment (elimination of certain jobs, as well as relocation
    of certain industries), skills, employability of personnel, organization of the
    company, working methods, labor legislation (teleworking, disappearance of borders
    between the workplace and the home, etc.), training;


    *   – environmental: depletion of non-renewable resources, energy costs (IT is
    a major consumer of electricity, and energy costs are increasing in line with
    the digital transformations of society as a whole), recycling of equipment.


    This increase in energy consumption linked to digital technology can be offset
    by remote working (videoconferencing, teleworking, working in coworking centers)
    to limit the cost of travel, dematerialization of documents, eco-design of products
    and software, staff awareness of ecoresponsible behavior, purchases of equipment
    that uses less energy, better building management, adaptation and optimization
    of behavior, and therefore a better ecological and energy transition.'
