    In other boards, cybersecurity risk is overseen by the risk committee (7%), technology
    committee (4%) or nominating and governance committee (2%);


    *   – 64% of respondents reported that the board of directors or a committee had
    developed a crisis management plan for cyber-infringement in the past year.


    ### **2.3.2. *The four missions of the board of directors***


    The directors, meeting within the board of directors, participate in the management
    of the company, in a collegial manner, by determining its orientations and policies
    (the implementation of which is ensured by the general management) and by controlling
    its operation.


    Directors must “watch over” and thus guarantee stakeholders that the company is
    managed with a view to its sustainability and sustainable performance. The board
    of directors is an essential factor of trust.


    ![Figure 2.1. The four missions of the board of directors ¶ (source: Starboard
    Advisory)](image/image70_c2876.jpg)


    **Figure 2.1.** *The four missions of the board of directors* ¶ *(source: Starboard
    Advisory)*


    The development of information technologies concerns the board of directors in
    all its dimensions:


    *   – the definition of strategic objectives: market access, business model, marketing
    via digital channels, design of new products, production, distribution and management;


    *   – the appointment of managers: consider the skills needed to achieve objectives,
    how to change the company’s culture and support change through training;


    *   – the closing of the accounts requires that the quality of the information
    and therefore of the information systems be ensured;


    *   – the risk landscape will take into account cyber-risks and their potential
    impacts on financial performance, non-compliance risks and reputational risks,
    particularly following a data leak (personal, intellectual property, strategic
    data).


    ### 2.3.3. *Civil and criminal liability*


    ![Figure 2.2. Civil and criminal liability of executives ¶ (source: Starboard
    Advisory)](image/image71_c2877.jpg)


    **Figure 2.2.** *Civil and criminal liability of executives* ¶ *(source: Starboard
    Advisory)*


    A major disaster can impact the company’s financial health and its own assets
    and make managers liable before the courts.


    The manager’s civil liability is engaged if, through a fault on his/her part –
    such as the lack of backup – the company suffers a loss of data that is very harmful
    to him/her. Civil liability is also incurred in the event of a proven lack of
    organizational measures or protection of the company’s information system.


    According to article 34, French law no. 2004-801 of August 6, 2004, relating to
    data processing, files and freedoms:


    > The controller is required to take all necessary precautions, having regard
    to the nature of the data and the risks presented by the processing, to preserve
    the security of the data and, in particular, to prevent them from being distorted,
    damaged or accessed by unauthorized third parties.


    Failure to comply with these data security obligations may also result in severe
    financial penalties imposed by the CNIL: on April 17, 2019, Optical Center was
    fined 200,000 euros.


    Managers must therefore implement technical and organizational measures to protect
    the personal data they collect in the course of their activities against unauthorized,
    accidental or unlawful destruction, loss, alteration, dissemination or access:
    blocking intrusion and virus attempts (firewall, antivirus), updates, password
    management, access management, encryption, anonymization, pseudonymization, securing
    physical IT infrastructures (premises security).


    In addition, managers must take legal measures: charters for the use of IT tools
    and networks (user and administrator charters), security clearance policies and
    procedures, data retention and archiving policies, use of applications, connection
    to websites, access by suppliers or subcontractors, mobility, use of personal
    tools, access to the Internet for personal reasons using company equipment and
    an incident management policy.


    It is also recommended to set up delegations of authority between the manager
    and the CIO (Chief Information Officer)/CISO (Chief Information Security Officer),
    ensuring, as with any delegation of authority, that these managers have the technical
    skills, authority and means to exercise their responsibilities and that the delegation
    is express, limited and precise.


    Let us recall article 226-17 of the French Criminal Code: “Any person responsible
    for the computer processing of personal data must adopt physical (security of
    premises) and logical (security of information systems) measures adapted to the
    nature of the data and the risks presented by the processing”.


    Failure to comply with this safety obligation is heavily sanctioned by French
    article 226-17: up to five years’ imprisonment and a fine of 300,000 euros.


    ### **2.3.4. *The board of directors and cybersecurity***


    Why does the board of directors have to take over cyber-risks? Mainly for financial,
    legal and reputational reasons. The three priorities are resilience, ethics and
    compliance. The stakes associated with cyber-attacks can be high, and board members
    should not wait until an attack occurs to assess the risks to which their company
    is exposed.


    The *Institut Montaigne* (created by Claude Bébéar, chaired by Henri de Castries)
    brings together business executives, senior civil servants, academics and representatives
    of civil society. It is a space for reflection, free and independent of any political
    and economic constraints.


    According to a report published in October 2018 by the Institute, based on a Wavestone
    study, only 25% of CAC 40 groups directly address cybersecurity issues at the
    executive committee level. Only 12% of CAC 40 companies report that they have
    launched a cybersecurity program. Only 58% of CAC 40 companies mentioned the GDPR
    in their registration documents in 2017.


    The institute underlines the lack of awareness among management teams and the
    lack of integration of cybersecurity into corporate strategy. It proposes to encourage
    the preparation of a confidential (non-public) report on cyber-risks available
    to directors and to partially integrate these risks and countermeasures into the
    annual report.


    According to an Opinion Way study, 54% of business leaders believe that cybersecurity
    is a matter for IT management and only 24% for senior management. However, this
    is a strategic issue for the board of directors and not an operational one, as
    some directors claim.


    #### 2.3.4.1. *Taking charge of the company’s digital destiny*


    Effective cybersecurity begins with risk awareness on the part of board members
    and senior executives who must recognize that the company can be attacked at any
    time. Risk mapping is therefore the starting point.


    Cyber-risk is a risk that you will have to get used to living with. Ensure that
    mechanisms are in place to enable the company to be more resilient (in particular
    to guarantee the accessibility of the system, its proper functioning, the confidentiality
    of information and its integrity). Directors and officers are responsible for
    controlling this risk.


    The board of directors has, among other things, a legal obligation to monitor
    the effectiveness of the company’s risk management system. With regard to cyber-risks,
    it is therefore necessary to ensure that operational managers are aware of the
    risks and new regulations, and if the size of the company allows it, provide the
    company with a global risk management system.'
