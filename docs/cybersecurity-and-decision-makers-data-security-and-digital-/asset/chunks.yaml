- raw: 'On April 8, 2015, around three in the morning. In the Mercure tower, the ultra-secure
    Parisian premises of ANSSI, a telephone rings. At the end of the line, TV5 Monde.
    The technicians of the French-speaking television channel have been fighting for
    a handful of hours against an unprecedented computer attack: the website and accounts
    on social networks broadcast jihadist propaganda, the image production system
    is unusable and the broadcasting is interrupted. The channel, which broadcasts
    in 200 countries for 50 million viewers, displays a black screen.


    At dawn, a meeting is held. Around the table, TV5 Monde teams, the national police
    unit specializing in cybercrime, the domestic intelligence services and ANSSI.
    This agency, which is responsible for defending the State’s critical IT systems
    and the most sensitive companies, is not theoretically involved in an attack on
    a television channel. But the episode was unprecedented, already public and touched
    one of the “voices of France” in the world: the decision was taken to send ANSSI’s
    “computer firefighters” to the station’s premises as a matter of urgency.


    These interventions are common for these agents, who carry out similar operations
    about 20 times a year. In normal times, these maneuvers – in critical companies
    or fundamental state systems – are carried out in complete secrecy. TV5 Monde
    is a special case: the damage was immediate and highly visible. This was the first
    time that the work of ANSSI agents came to light so much. Two years after this
    incident, they presented in detail this intervention at the Symposium on Information
    and Communications Security (SSTIC) in Rennes on June 9. This was the first time
    that ANSSI has done such an exercise in public.


    It was also the first time that ANSSI had publicly given itself the opportunity
    to share its experience.


    During the first 48 hours, the agents – between 9 and 15, who were mobilized for
    several weeks – looked for the most obvious clues left by the attackers. Like
    bomb disposal experts who criss-cross the streets after the departure of an enemy
    army, they also feared the presence of “logic bombs”, lines of code left by the
    attackers, designed to be activated when infected systems are restarted and intended
    to further paralyze the network. This fear did not materialize in the end.


    From the very first hours of the investigation, agents’ attention was drawn to
    an account name in English on TV5 Monde’s computer network, configured in French
    and with very broad powers. Problem: it does not belong to TV5 Monde’s technical
    teams but to pirates. The investigators managed to reconstruct its last actions
    and realized that it had connected to an unknown server on the Internet, outside
    TV5 Monde’s network. They got their hands on the IP address, the identifier of
    this server on the Internet. A first piece of a huge puzzle to try to understand
    who was behind this attack.


    During their investigations, ANSSI agents collected large quantities of data to
    analyze, including the progress of all actions carried out by hackers on the network.
    It took them several weeks to understand in detail how the attackers were able
    to penetrate TV5 Monde’s networks and destroy almost everything in their path.


    *The course of the attack*. The offensive began on January 23. The attackers observed,
    from a distance, TV5 Monde’s network infrastructure. They discovered that it was
    possible to connect to the chain’s internal network from outside, using a virtual
    private network (VPN). This is what they did, by means of the identifier and password
    belonging to a subcontractor in the chain. How did they obtain this information?
    It is one of the few unknowns in the investigation. The fact remained that the
    attackers had infiltrated TV5 Monde’s network, which they were carefully monitoring.


    Once inside, they granted themselves full powers: this tracking allowed them to
    locate two very specific servers, which control the cameras on the television
    sets. Hackers used one of these two servers to connect to the system, which was
    responsible for determining what each computer on the network is allowed to do
    or not to do. The grail: once inside, it was possible for them to grant themselves
    full powers.


    Then, the pirates snooped around. They immersed themselves in the internal documentation
    of TV5 Monde’s IT departments and their messaging and search for any information
    that would allow them to continue their infiltration. The keywords they entered
    were precise: they wanted to know how the network was organized and configured,
    and more specifically, the one that manages the video streams broadcast by the
    channel. From the beginning, they were interested in the French-language channel’s
    image distribution system.


    This harvest was successful, and hackers recovered a lot of information, including
    IDs and passwords from various machines. For several weeks, the pirates were very
    discreet. No activity was recorded in this interval. ANSSI officials suspected
    that this period was spent analyzing, understanding and even translating the data
    collected. It was only to come back better, first to check the validity of the
    recovered elements. The attackers checked that the passwords for accessing social
    networks worked well. It was then April 6, two days before the attack itself.


    On April 8, at 3:40 p.m., the hackers made a final check on TV5 Monde’s network.
    They placed standard spyware software in a prominent place. Strangely, the latter
    was never activated. According to ANSSI officials, it was possible that this malware,
    widely accessible to anyone online, was left to be used as a decoy and to mislead
    investigators.


    *The beginning of the offensive*. At 7:57 p.m., the assailant started his demolition
    business. He modified the parameters of the multiplexers – the computers that
    manage and direct the chain’s heavy video streams – to make it impossible to restart
    them. This change was invisible until the latter were switched off, and the channel
    continued to transmit. The first visible action occurred at 8:58 p.m., when accounts
    on social networks took on the colors of a mysterious “cyber caliphate” and showed
    their support for the “Islamic State” organization. All TV5 Monde video streams
    were interrupted, and the screens turned black.


    At 9:48 p.m., another assault. The attackers connected to several critical parts
    of TV5 Monde’s network and destroyed the software that made them operate. All
    TV5 Monde video streams were interrupted, and the screens turned black.


    In its misfortune, TV5 Monde was lucky: a new thematic channel had just been launched,
    and many technicians were still on the premises at a late hour to celebrate its
    arrival. They reacted immediately. Their task was complicated by a new attack
    by hackers, who suppressed the company’s internal messaging at 10:40 p.m. At this
    point, TV5 Monde’s teams had completely lost control of their network. Shortly
    before midnight, they took the only possible decision to stop the attack: they
    completely isolated it from the rest of the world.


    The pirates lost their hand, but it was in a field of digital ruins that ANSSI
    agents arrived in the early morning. They came to help the helpless but competent
    and very cooperative technical teams. Never had ANSSI experts, whose discretion
    was proverbial, had to face such media pressure. Television cameras camped in
    front of the entrance of the television channel. TV5 Monde journalists, whose
    workplace made the headlines, tried to extract information from them, to the detriment
    of the extreme sensitivity of these first hours of investigation. Officers needed
    to seal the glass doors of their crisis room, set up for the occasion, so as not
    to be seen, flee the cameras in the corridors, and even take refuge under their
    desk to hide their screens when the cameras broke into the room.'
