    systems: to be avoided to prevent the spread of infection. It is therefore necessary
    to organize the flow of information between the company’s departments and the
    production sites (in both directions) so that the sites are not affected;


    *   – the measures taken: isolate the malware to prevent it from spreading further;


    *   – measures to restore back-ups workstation by workstation because the ransomware
    had modified administrator access on each infected workstation.


    The Norsk Hydro Group’s Norwegian board of directors postponed the publication
    of its first quarter results to June 5 (instead of April 30) due to the cyber-attack,
    which caused delays in some administrative processes, including reporting and
    billing systems.


    #### 6.6.5.2. *The payment of the ransom*


    On May 8, 2019, the “Robin Hood” ransom software blocked many computer systems
    in the city of Baltimore, United States. The hackers behind the attack demanded
    a ransom in exchange for the decryption, which was refused by the city authorities,
    who do not want to give in to blackmail. Two weeks later, the administrative services
    are still blocked: payment of taxes, access to emails, surrender of permits or
    allocation of property. The hackers have taken control of 10,000 computers belonging
    to the city.


    According to experts, the recovery of services could take from several weeks to
    several months for the most complex systems: “our objective is to restore the
    most important services, while ensuring maximum security so that the attack cannot
    happen again”, says the mayor of Baltimore.


    It is not advisable, as explained above, to pay the ransoms. However, in addition
    to antivirus software, updates and limited access to unsecured sites or applications,
    it is recommended to train employees and organize daily automatic back-ups in
    two different locations, test the quality of the back-ups and protect recovery
    programs to prevent them from being infected by a virus.


    #### 6.6.5.3. *Medium-term management*


    Once the emergency measures have been taken, the time has come for investigations:
    investigation of causes and responsibilities, declarations to insurance companies,
    recurrent internal and external communications on the facts and improvement of
    security processes and devices to prevent a recurrence of the incident.


    #### 6.6.5.4. *Long-term management*


    Corrective actions, litigation management, feedback and improvement of security
    and data protection, as well as communication management will be on the company’s
    agenda and should not be neglected:


    *   – What are the main lessons: how did we discover the incident? From the outside?
    Or internally?


    *   – Do we have any information on what was stolen? Deteriorated?


    *   – What were the impacts?


    *   – Have any operations been compromised?


    *   – Did our crisis management plan work as planned?


    *   – Who was notified? Who should be notified? Is the legal department involved
    and prepared?


    *   – What actions have been taken to ensure that attackers no longer have access
    to data? Do we have any idea who the hacker is?


    *   – What vulnerabilities have been exploited by the attacker? And why is that?


    *   – What actions can be taken to avoid a second attack of the same type?


    *   – What actions can be taken to reduce the impact of this incident?


    ## **6.7. Crisis simulation**


    The best crisis preparation is through crisis simulation. It makes it possible
    to become aware of the impacts of an attack, to prepare response plans, emergency
    measures and the formation of teams.


    As with fire or earthquake exercises, some sensitive companies have simulated
    cyber crises, which test the procedures prepared to deal with a crisis.


    Crisis scenarios must be adapted to the business sector, process and location
    of the company, and therefore be inspired by cyber-risk mapping, to be as likely
    and effective as possible (ransom request and inability to access data, inaccessible
    website, unavailable messaging, production site down, cloud provider out of service).


    Crisis scenarios make it possible to experiment with the overall management of
    a crisis or to check the maturity of the teams in order to react without panicking,
    collectively, and according to procedures prepared in advance:


    *   – emergency management (avoidance of spread);


    *   – activation of crisis systems and teams;


    *   – application of procedures;


    *   – crisis communication (media, clients, staff, authorities, etc.);


    *   – continuity and business recovery.


    The simulation of all teams, infrastructures and tools allows us to test and improve
    the processes and reflexes, as well as the programs to be implemented in case
    of an incident. The incidents will never be the same, but the reactions will be
    similar.


    # Conclusion: The Digital Committee


    So long as the Internet is not regulated and governed, users (individuals and
    businesses) will remain insecure. Governments must balance the protection of human
    rights with the monitoring of communications in the name of security (terrorism,
    pedophilia, etc.).


    In addition, new technologies are used in international conflicts (commercial
    or political) to spy and sabotage. End-to-end encryption techniques make it difficult
    to intercept communications, and therefore to infiltrate intelligence networks.


    There is therefore no such thing as zero risk. Nevertheless, it is essential for
    boards and executives to be involved in this strategic subject: digital transformation
    creates value if security issues are addressed upstream, and informed decisions
    are made, which requires that executives and directors have the skills to understand
    and guide strategy in an informed way.


    A digital committee, based on the financial audit committee, would be a good practice.
    It would make it possible to audit cybersecurity systems: organizations, processes,
    tools, and training related to the digital strategy, just as the audit committee
    makes it possible, through its independence of view, to support management, in
    order to make the company a more competitive and efficient organization, by ensuring
    the quality of financial information, risk mapping and internal control. This
    governance body would strengthen governance practices, and thus the digital trust
    of stakeholders.


    The digital committee would contribute, with the assistance of an independent
    expert (cyber auditor), to ensuring:


    *   – the relevance of the cybersecurity system;


    *   – the reliability of risk management and process implementation processes:
    identify, protect, detect, respond, restore;


    *   – the monitoring of threats, technological developments and best practices
    in cybersecurity.


    This digital committee would be linked to the CISO and the risk committee or audit
    committee to ensure that risk mapping takes into account cyber threats and vulnerabilities,
    as well as physical security issues.


    It is likely that companies will be forced to have their cybersecurity arrangements
    audited in the near future, as well as the appointment of auditors is mandatory,
    above a certain size, which will allow the board of directors to be informed promptly
    of any difficulties encountered.


    The digital committee may intervene or involve the cyber listener in particular
    operations:


    *   – review of merger/acquisition/disposal transactions;


    *   – security policy review;


    *   – choice of critical suppliers;


    *   – compliance reviews;


    *   – post-crisis investigations.


    Finally, the digital committee will be able to monitor the social and environmental
    impacts of the digital transformation, the development of skills and a cybersecurity
    culture, in line with the strategy and CSR.


    Digital transformation has not yet led to a real transformation of the board of
    directors, either in its composition, its mode of operation or in the consideration
    of these new risks to be assumed.


    It is time to transform the board of directors and the executive committee.'
