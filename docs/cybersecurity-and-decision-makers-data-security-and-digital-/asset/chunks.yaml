- raw: "The dispersion of professions and the lack of employee support create a significant\
    \ gap between cybersecurity practices and the cyberculture desired by companies.\n\
    \nFor all companies, cultural adherence to cybersecurity is essential, but in\
    \ practice, employees, who are usually the only barrier against phishing attacks,\
    \ do not have the necessary culture to protect their company.\n\nAs revealed by\
    \ the survey conducted by the Audit Guide to Digital Enterprise Information System\
    \ Governance (ISACA), 95% of companies believe that there is a gap between their\
    \ current cybersecurity culture and the desired culture. In practice, employees\
    \ are not sufficiently trained, if at all, and can be negligent, confirming that\
    \ the human aspect of cybersecurity remains essential.\n\nYet, 80% of organizations\
    \ report that they train their employees and communicate rules of behavior to\
    \ improve their cyberculture. But the reference study shows that the latter is\
    \ lacking. While the cybersecurity culture is “desirable”, it is limited by the\
    \ lack of employee buy-in at 41% and the disparity of business units at 39%.\n\
    \nCybersecurity is not only a matter for the CIO and CISO. The ISACA survey shows\
    \ that cultural changes are the responsibility of CIOs, as well as of human resources.\
    \ To share the sense of responsibility for security and to bridge the gap, the\
    \ security culture must be inclusive, which means that it is recommended to involve\
    \ employees in cybersecurity discussions, define security protocols for new employees\
    \ as early as their integration process, define security needs based on departmental\
    \ risk profiles and organize simulated cyber-attack exercises.\n\n## **5.8. The\
    \ dashboard for officers and directors**\n\nThe dashboard is a good practice.\
