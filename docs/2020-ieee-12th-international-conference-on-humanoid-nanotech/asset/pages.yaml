    In this study, variety grand and Chinese lettuce-leaf seeds were used. For machine
    learning models, K-nearest neighbors (KNN), classification tree (DTC), naive Bayes
    (NB), and support vector machine (SVM) were configured to differentiate seeds
    in grand rapid or Chinese lettuce-leaf on the selected spectral-morphological
    features.


    # A. Seed Material and Image Acquisition


    Grand and Chinese lettuce-leaf are the two varieties of lettuce to be examined
    in this study to verify its variability in the market (21). 200 filtered seeds
    were captured using a digital camera-based approach using a 57 megapixel smartphone
    camera with a camera lens distance of 6 inches at an arm radius under daylight
    condition and light-gray background to capture the dark color of the seeds.


    The images were processed using an image extractor with 50, exposure time of 1.00
    ms, 0 f exposure speed. Image properties include spatial resolution of 2992 x
    2992 pixels (96 dpi) and bit depth of 24-bit RGB. Color compression and 0.95 ratio
    were compressed for each seed in JPG format for the local machine for analysis.


    # B. Seed Roundness, Compactness, and Shape Factors


    The input to the feature-based classification seed variety machine learning model
    is image of single-kernel leaf (Fig. 1). It is processed by color thresholding,
    spectral-morphological extraction and hybrid selection, and the development of
    the vision-based classification model.


    Extended seed phenotypes in this study reports multiple parameters analyzed in
    high level for morphological traits. Combination of extended seed phenotypes including
    solidity (S), roundness (R), compactness (C), and shape factor (SF)


    The primary output of this model is the classification labeling of lettuce seed
    variants. Or to extended seed phenotype of solidity, compactness, and shape factors
    were also addressed in this study as secondary output.


