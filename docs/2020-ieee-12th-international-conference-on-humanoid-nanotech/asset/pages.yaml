    # B. Classification of Lettuce Seeds Using Feature-Based Machine Learning


    The use of feature-based learning models in classifying lettuce seed variant is
    successful as yielded high accuracy and almost negligible error (Tables 2 and
    3). One encoding was used to representively represent lettuce seed variants, namely
    for grand and for Chinese lettuce-loose. The use of 20% of sampled single-kernel
    images was sufficient for KNN classification. The model classified one Chinese
    loose-leaf grand as grand (Fig. 7a and 7c), and DTC and SV seed variants classified
    perfectly (Fig. 7b and 7d). Thus DTC and SV are the best classification models
    in terms of accuracy.


