    分类。在研究中，由于农业设备成本高昂，高光谱数据的使用比消费级图像更频繁。


    尽管在种子分类和集成中缺乏比较方法，但计算机视觉和计算智能在长期提高提高准确性方面具有巨大潜力。结果，本研究表明了使用集成相机的机器学习模型对生菜类型进行分类，这是首次，但仍是一个开放领域。


    图 2. 生菜（A）和中国生菜（B）精美的外部结构。


    # II. 材料与方法


    ### A. 种子材料与图像采集


    大生菜和中国生菜是本研究检查的两种生菜品种，以验证其市场变异性 [21]。使用 5700 万像素手机相机拍摄了 200 颗过滤后的种子，相机镜头距离为 6
    英寸，在日光条件下并在浅灰色背景下以捕捉深色种子。


    使用图像提取器进行处理，参数为 50，曝光时间为 1.00 ms，光圈为 0。图像属性包括空间分辨率 2992 x 2992 像素（96 dpi），位深为
    24 位 RGB。每个种子均以 JPG 格式以 0.95 比例进行压缩，用于本地机器进行分析。


