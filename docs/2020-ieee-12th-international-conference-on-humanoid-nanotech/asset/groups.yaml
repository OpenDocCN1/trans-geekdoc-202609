    另一方面，数字 RGB 图像已用于分类水米表型，预测小麦、油菜、亚麻和白芥末种子的颜色和纹理 [21]，通过多层分类器对单倍体和二倍体种子进行深度分类 [22]，柑橘种内多样性分析
    [24]，通过反向传播神经网络（BPNN）识别 Takong 9 种子 [25]，通过模糊逻辑区分灯笼和辣椒 (26)。我们在识别小麦粒 [27] 和种子
    [28] 中使用了 RGB、SWIR 和各种近红外图像。VGG16 深度神经网络架构已用于区分小麦粒表示。


