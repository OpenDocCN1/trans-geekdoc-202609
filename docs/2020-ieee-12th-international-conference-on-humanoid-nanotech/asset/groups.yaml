    **Abstract—** lettuce has become popular now the use of specific seeds under control
    environment relies on the phenotypic classification of seed germination. Lettuce
    cultivars are defined by leaf characteristics which are not easily explained by
    the same spectro-textural morphological features. Visual inspection of lettuce
    seeds leads to the classification that is needed for seed phenomenology. To overcome
    this limitation, a machine learning approach was incorporated with computational
    intelligence. In this study, we used a Huawei P50 mobile phone camera to capture
    single-kernel RGB images to total 100 samples for each variety with different
    spectral resolution in the used seeds. Twenty-six morphological features were
    extracted and selected using feature selection with extra classes (FT-ETC). Decision
    tree and SVM learning models were used with texture, and morphological features
    as inputs to classify the lettuce seed variety. DTC and SVM showed high accuracy
    with sensitivity of 99% using 100 cross and hold validation. DTC achieved the
    fastest time with SVM 48.157% best. This developed FT-DTC model is highly necessary
    for controlled-environment cultivation and seed breeding.


    **Keywords—** computer, lettuce seeds, machine learning, seed germination


