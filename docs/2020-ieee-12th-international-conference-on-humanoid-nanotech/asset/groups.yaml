    **摘要—** 生菜已变得流行，现在受控环境下特定特定子的使用依赖于种子萌发的表型分类。生菜栽培品种由叶片特征定义，而这些特征无法通过相同的光谱-纹理形态特征解释。对生菜种子的肉眼检查会导致种子现象学所需的分类。为了克服这一局限性，引入了结合计算智能的机器学习。在研究中，我们使用华为
    P50 手机摄像头捕获单粒 RGB 图像，每个品种共采集 100 个样本，所用种子具有不同的光谱分辨率。使用带有额外类别的特征选择（FT-ETC）提取并选择了
    26 个形态特征。使用决策树（DTC）和 SVM 学习模型，以纹理形态特征作为输入对生菜种子品种进行分类。通过 100 次交叉和保留验证，DTC 和 SVM
    显示出高准确率，灵敏度达 99%。DTC 达到最快速度，SVM 最佳为48.157%。这种开发的 FT-DTC 模型对于受控环境栽培和育种具有高度必要。


    **关键词—** 计算机、生菜种子、机器学习、种子萌发


    # I. 引言


    生菜是自然界流行的植物。它在植物包囊内含有胚胎结构，是植物繁殖的最终产品，通过初胚的融合包含遗传信息。种子包含了子叶、根尖、胚轴、孔和胚乳。然而，种子仅考虑种皮，这是人类视觉可见的最外层。


    与其他作物一样，生菜种子在花期末期非常敏感。对于大多数品种，生菜在栽培 55 天后成熟。据记载，单株生菜可以收获一颗种子。然而，并非所有种子都有相同的休眠期。


    生菜叶片可以作为确定其变种的遗传指标 [1-6]。生菜的基因型包括球生菜、bibb 生菜、冰球生菜和品种。红生菜包括红色和橙色的叶片。另一方面，具有红色或绿色，这使得对这些特定品种的研究变得困难。理性，当需要生菜变种时，其叶片的培养处于生命周期的第一阶段（萌发），必须进行精确分类。确定生菜种子品种是全球农民面临的主要挑战。


    - 种子分类用于作物阶段 [, 播种、育种] 以及包装 [10]。已利用近红外（FT-NIR）中 1000 到 250 nm 波长的荧光检测单粒种子 [11]。FT-DTC
    模型使用特定波长通过表皮来分类活非核种子。高光谱成像（HI）已用于分类不同物种的*Lactuca sativa* 生菜 [12]，利用短波红外（SWIR）和最小二乘支持向量机机器学习对西瓜种子进行作物品种分类
    [13]，通过深度卷积神经网络（DNN）在 7734 nm 下记录了 8744 个种子 [14]，通过反射分析对冷冻种子进行分类 [15]，种子真菌检测 [16]，以及通过
    SVM 和极端机器学习（ML）进行 CRISPR/Cas9 诱导突变检测 [17]。多光谱成像已应用于白玉米粒分类 [18] 并用于普通汉堡种子 [19]。


