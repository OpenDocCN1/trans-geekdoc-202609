    # IV. CONCLUSION AND RECOMMENDATION


    Two lettuce varieties, rapid grandi and lettuce-leaf, were discriminated and classified
    using feature-based learning models for spectral, textural, and morphological
    phenotypic traits. There are 22 raw seed traits extracted using RGB color space
    and four from it using seed importance factor. The effectiveness of roundness,
    compactness, and solidity were set as input to KNN, DTC, NB and SVM for single-level
    image classification. Decision-based classification model used KNN, NB and SVM
    in classification showed better results than other models.


    Hence, the developed model is useful for lettuce variety classification, and is
    very useful for low-budget agriculturalists in purifying seed selection and breeding
    programs. It is recommended to include more lettuce varieties to improve the model
    Likewise, which is essential for intensive seed breeding.


