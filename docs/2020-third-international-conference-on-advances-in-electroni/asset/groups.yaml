    # # Prediction and Analysis of Permanent Magnet Synchronous Motor parameters using
    Machine Learning Algorithms


    Rushank Savant

    School of Electronics Engineering

    Vellore Institute of Technology,

    Vellore, India


    Abhiraj Ajith Kumar

    School of Electrical Engineering

    Vellore Institute of Technology,

    Vellore, India


    Aditya Ghatak

    School of Electrical Engineering

    Vellore Institute of Technology,

    Vellore, India


    **Abstract—** The widespread acceptance of PMSM as the motor choice for electric
    vehicles, along with other applications demands the need of stringent monitoring
    to avoid increased temperatures. Temperatures vary by a specific range which can
    lead to operational problems in Permanent Magnet Synchronous Motor. This paper
    compares the performance of three different values of Machine Learning Algorithms
    in the estimation of parameters in a Permanent Magnet Synchronous Motor. Using
    a pre-existing dataset, the models are compared: Support Vector Regression, Random
    Forest Regression and Polynomial Regression. Highest values of independent variables
    explained by induction provides a particular regression model which improves the
    accuracy of the model.


    stator helps in maximizing the output without failing the motor.


    A PMSM follows almost the same construction as that of synchronous motors with
    one key difference. PMSMs utilise magnets to create the field poles whereas traditional
    synchronous motors achieve this field through windings. Depending on the configuration
    PMSMs are classified into two categories: Surface Mounted PMSM and Interior PMSM.
    In either, the air gap is consistent due to similar permeability of the magnet
    and the air gap. The motor does not move to an orientation where the reactance
    decreases, and torque produces better performance, despite the lack of robustness.
    In case of Interior PMSM, the magnets are present in the rotor, and not fixed
    onto the surface, which makes them more robust and suitable for fulfilling high
    speed requirements.


    **Keywords—** PMSM; Random Forest; Polynomial Regression


    # I. INTRODUCTION


    The Permanent Magnet Synchronous Motor(PMSM) is used widely in the industry today.
    Due to the wide range of characteristics PMSMs possesses, they are widely used
    after The incorporation of magnet in motors has resulted an improvement in efficiency.
    Other factors such as reduction in the power consumed and improvement in performance
    has resulted in these motors finding in electric vehicles. PMSMs have become very
    popular in their use as a substitute for servo drives.


    u, d, q are components of stator voltage in a rotating frame while i, d, q are
    components of stator in a stationary frame. The current and voltage parameters
    monitor the functions of a Permanent Magnet Synchronous Motor. The electric losses
    are dissipated as heat which causes motor deterioration. Monitoring the temperature
    of the rotor and


    aims at predicting the torque, rotor temperature of permanent magnet synchronous
    motor (PMSM) using three machine learning algorithms, Support Vector Regression
    (SVR), Random Forest and Polynomial Regression. A comparison is drawn between
    the performance of the three models based on their results, and their R squared
    values [1]. The data used for analysis and prediction includes sensor data of
    a permanent magnet synchronous motor (PMSM). The PMSM represents a general OEM''s
    type department at Paderborn University.'
  - '[PAGE 1]


    # II. RELATED WORK


    A lot of work has been done regarding estimations of PMSM parameters.


    [2] uses an incremental method to tackle the challenge posed by dependent parameters
    in the predictive modelling and control. Initial analysis is done on the traditional
    Predictive Control method which goes to handle inconsistencies in parameters lead
    to values of predicted current. An incremental model is then proposed.


    [3] uses a predictive control method to handle the speed of PMSM servo systems.
    In the first system, q axis is used as the reference model. The second option
    also a control loop. Due to poor performance of PFC systems, an improvement is
    proposed which incorporates an Extended State to minimize the nullptr of disturbances.


    [4] proposes a torque based prediction method for control of three phase PMSM.
    The voltage vectors are taken on the basis of position and direction of torque
    to minimise the effects of harmonics. Furthermore, the number of vectors used
    for prediction can also be reduced for factor.


    [5] analyzes the effect of error in parameters in the calculation of characteristics
    of PMSM. Methodologies for predicting reactance and inductance(both r and q axes)
    are proposed along with a prediction model that studies the effect of cores.A
    comparison between the proposed model and the conventional ones


    [6] evaluates and compares different machine learning algorithms to identify faults
    in motors by testing it under different operating conditions. Tests were tested
    using Naive Bayes performed the best result.


    [7] investigates the feasibility of sequential learning to predict highly dynamic
    parameters in PMSM using deep recurrent and convolutional networks. Neural profiles
    were modeled for key factor stator, winding, and yoke as well as the rotor''s
    magnets with a ground truth data for comparison. It methods of lumped-parameter
    thermal networks, without a requirement of expensive experiments, simplifies the
    design.


    [8] uses machine learning models like and weighted weighted squares, SVR, k-nearest
    neighbors, randomized trees and neural networks to predict temperature profiles
    and test their performance based on estimation accuracy. The paper concludes that
    models based only on collected data meet estimation performance of classical models
    built on thermodynamic theory.


    [9] presents a comparison of various learning models based on voltage,current
    and temperature of different components of the motor. These results are used to
    adjust the input current of the motor in order to keep a constant torque. The
    paper concludes that the optimal offered by the decision tree method using a causal
    tree hierarchy.


    [10] compares the absolute error in different models using like regression, k
    nearest neighbors, random forest, and decision tree algorithms.the paper notes
    that stator yoke shows promising performance.


    [11] uses Artificial Neural Networks (ANN) for fault detection in stator windings
    of PMSM, where the weights are adjusted using Particle swarm optimization.


    [12]describes a state space model for estimating Permanent Magnet Transformer,with
    the model using a linear identity to identify the control parameter. The magnet
    magnet meter parameter estimation is done simultaneously using maximization particle
    filter the linear model is arrived and Kalman filter is applied for permanent
    magnet transformer.


    [13] diagnoses rotor fault using random algorithms in a line art using multiple
    statistical time domains. Random forests classifies the fault of the motor with
    an accuracy of 98.8%. It concludes that the method can be used for faults.


    [14] aims to propose torque control in an improved method for regulating torque
    using stator flux. This was achieved by mapping a relationship between the rotor
    stator flux magnitude and phase angle. The voltage vector deadat compensation
    which with the help of delay time reduce the complexity of calculations for torque
    and flux. This employs a cost function for tracking of stator flux and optimal
    voltage vector, the validation performance performed the proposed of solution.


    [15] focuses on controlling torque and torque ripples in Permanent Magnet Synchronous
    Motor(PMSM). Which also includes magnet sweeping on electromagnetic motor torque
    which was analysed in 20-pole-three, configuration of PMSMs having the same output
    frequency and output characteristic characteristics a finite-element technique
    is used.


    [16] discusses a method to minimize calculations within Finite set-model methodology
    for predictive control and reduce the computation time. The application is extended
    to PMSM drives that are fed by many converters, and the results verified experimentally.'
