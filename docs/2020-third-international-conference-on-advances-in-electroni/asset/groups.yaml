    # III. PROPOSED SOLUTION


    The three target variables namely Torque, Rotor Temperature, and Stator Winding
    are predicted using Machine Learning Random Forest Algorithm. During the prediction
    process, feature selection played a vital role in the final output results and
    overall accuracy of the model. Following is the data visualisation using scatter
    plots in python


    For torque, the variables which were found to have some mathematical relationship
    with torque were; voltage component(u_q), voltage component(u_d), current component(i_q),
    current component(i_d) and motor_speed. The respective plots of data-points are
    shown below:


    ![](img/ec8f0a0db6884f5a5ca05adeb3c0eea6_2_0.png)


    ![](img/ec8f0a0db6884f5a5ca05adeb3c0eea6_2_1.png)


    ![](img/ec8f0a0db6884f5a5ca05adeb3c0eea6_2_2.png)


    ![](img/ec8f0a0db6884f5a5ca05adeb3c0eea6_2_3.png)


    Fig2: Plot of Torque vs Voltage d component


    Fig5: Plot of Torque vs Current d component


    Fig3: Plot of Torque vs Voltage q component


    Fig6: Plot of Torque vs motor speed


    ![](img/ec8f0a0db6884f5a5ca05adeb3c0eea6_2_4.png)


    A similar analysis was made for Rotor Temperature and Stator Temperature prediction
    as well. For Rotor temperature, the ''ambient temperature'', ''coolant temperature''
    and ''stator temperature'' were found to contribute to the prediction model. Similarly
    for Stator Winding temperature the ''ambient temperature'', ''coolant temperature''
    and ''stator temperature'' was employed to make predictions.


    After deciding the features for prediction, the dataset was divided into training
    and testing sets. Where the train set consisted of 80% of total data and rest(20%)
    was the test set.


    Fig5: Plot of Torque vs Current q component'
  - '[PAGE 3]


    The train_test_split from sklearn was imported to execute the data splitting.

    To make predictions for the target variables (torque, motor rotor temperature
    and motor stator temperature) three algorithms were used, and the performance
    of each algorithm was analyzed using r2-value over the set. The R-squared values
    are used as its statistical measure to find how close the fitted regression line
    comes to known ''coefficient of determination''.


    # Total Variation


    Table I compares the R2 values for different algorithms. The R2 values it is observed
    that the Random Forest regressor performed better than the Support Vector regressor
    and Polynomial Regression. Fig.7 shows the plots of the actual and predicted values
    of the parameters for all three algorithms.


    # Uexplained Variation


    The algorithms employed in the production process were:


    +   * Support Vector Regressor (SVR)

    * The kernel used - ''rbf'' (Radial Basis Function)

    For two samples x and x'', r is defined as:

    * Random Forest Regression with n ''estimators''=200

    * Polynomial Regression of 4th degree


    ```

    K(x,x'') = exp(-|x-x''|^2/2r)

    ```


    Where |x-x''| is square Euclidean distance between two vectors and r is a free
    parameter.


    # IV. RESULT


    | TABLE I Parameter R2 VALUES FOR DIFFERENT ALGORITHMS USED |

    | Algorithm | Rotor Temperature | Stator Winding temperature | Torque |

    |---|---|---|--|

    | Support Vector Regressor | 0.895 | 0.936 | 0.998 |

    | Random Forest Regressor | 0.993 | 0.993 | 0.999 |

    | Polynomial Regression | 0.869 | 0.932 | 0.999 |


