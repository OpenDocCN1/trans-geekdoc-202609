    ## III. 提出的解决方案


    三个目标变量（即转矩、转子温度和定子绕组）均使用机器学习随机森林算法进行预测。在预测过程中，特征选择对最终输出结果和模型的整体精度起了至关重要的作用。以下是使用
    Python 散点图进行的数据可视化。


    对于转矩，发现与转矩具有某种数学关系的变量有：电压分量(u_q)、电压分量(u_d)、电流分量(i_q)、电流分量(i_d) 以及电机速度(motor_speed)。相应的数据点图所示所示：


