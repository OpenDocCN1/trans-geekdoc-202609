    ## V. 结论


    国际电机与驱动器会议 (IEMDC), DC, USA, 2019, pp. 1436-1446, doi: 10.1109/IEMDC.2019.8875109.


    本文提出的预测模型展示了低复杂性，允许用于各种实验测试。基于模型的训练，可以预测温度和数值范围，以分析永磁电机 (PMSM) 的性能并采取预防措施。与电机速度相比，永磁电机
    (PMSM) 性能缺乏 AC 支持已在工业层面检测。因此，定子温度可以实现对 AC 的估计和控制，从而按比例控制电机速度。


