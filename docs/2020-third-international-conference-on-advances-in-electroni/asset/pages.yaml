- pgno: 3
  md: 'The train_test_split from sklearn was imported to execute the data splitting.

    To make predictions for the target variables (torque, motor rotor temperature
    and motor stator temperature) three algorithms were used, and the performance
    of each algorithm was analyzed using r2-value over the set. The R-squared values
    are used as its statistical measure to find how close the fitted regression line
    comes to known ''coefficient of determination''.


    # Total Variation


    Table I compares the R2 values for different algorithms. The R2 values it is observed
    that the Random Forest regressor performed better than the Support Vector regressor
    and Polynomial Regression. Fig.7 shows the plots of the actual and predicted values
    of the parameters for all three algorithms.


    # Uexplained Variation


    The algorithms employed in the production process were:


    +   * Support Vector Regressor (SVR)

    * The kernel used - ''rbf'' (Radial Basis Function)

    For two samples x and x'', r is defined as:

    * Random Forest Regression with n ''estimators''=200

    * Polynomial Regression of 4th degree


    ```

    K(x,x'') = exp(-|x-x''|^2/2r)

    ```


    Where |x-x''| is square Euclidean distance between two vectors and r is a free
    parameter.


    # IV. RESULT


    | TABLE I Parameter R2 VALUES FOR DIFFERENT ALGORITHMS USED |

    | Algorithm | Rotor Temperature | Stator Winding temperature | Torque |

    |---|---|---|--|

    | Support Vector Regressor | 0.895 | 0.936 | 0.998 |

    | Random Forest Regressor | 0.993 | 0.993 | 0.999 |

    | Polynomial Regression | 0.869 | 0.932 | 0.999 |


