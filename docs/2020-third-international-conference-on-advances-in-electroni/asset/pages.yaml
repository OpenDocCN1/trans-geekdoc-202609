    # V. CONCLUSION


    International Electrical Machines & Drivers Conference (IEMDC), DC, USA, 2019,
    pp. 1436-1446, doi: 10.1109/IEMDC.2019.8875109.


    The prediction models presented in this paper demonstrate the low complexity it
    allowed to be used in various experimental tests. Based on the training of the
    model the temperature and value ranges can be predicted to analyse the performance
    of the PMSM and prevent measures. The lack of AC support in the performance of
    Permanent Magnet Motor (PMSM) has detected at industrial level compared to motor
    speed. Hence the stator temperatures can enable estimation and control of AC that
    can proportionally control motor speed.


