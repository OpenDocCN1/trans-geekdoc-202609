    Fig2: Plot of Torque vs Voltage d component


    Fig5: Plot of Torque vs Current d component


    Fig3: Plot of Torque vs Voltage q component


    Fig6: Plot of Torque vs motor speed


    ![](img/ec8f0a0db6884f5a5ca05adeb3c0eea6_2_4.png)


    A similar analysis was made for Rotor Temperature and Stator Temperature prediction
    as well. For Rotor temperature, the ''ambient temperature'', ''coolant temperature''
    and ''stator temperature'' were found to contribute to the prediction model. Similarly
    for Stator Winding temperature the ''ambient temperature'', ''coolant temperature''
    and ''stator temperature'' was employed to make predictions.


    After deciding the features for prediction, the dataset was divided into training
    and testing sets. Where the train set consisted of 80% of total data and rest(20%)
    was the test set.


