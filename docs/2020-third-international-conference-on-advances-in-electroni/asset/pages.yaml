  md: '# III. PROPOSED SOLUTION


    The three target variables namely Torque, Rotor Temperature, and Stator Winding
    are predicted using Machine Learning Random Forest Algorithm. During the prediction
    process, feature selection played a vital role in the final output results and
    overall accuracy of the model. Following is the data visualisation using scatter
    plots in python


    For torque, the variables which were found to have some mathematical relationship
    with torque were; voltage component(u_q), voltage component(u_d), current component(i_q),
    current component(i_d) and motor_speed. The respective plots of data-points are
    shown below:


