    # Securing Access Using AAA


    This chapter will focus on the following topics:


    +   - AAA security strategy:

    +   - authentication,

    +   - authorization,

    +   - traceability;

    +   - the AAA authentication types:

    +   - local AAA authentication,

    +   - AAA authentication based on a server;

    +   - AAA authorizations:

    +   - introduction,

    +   - configuring AAA authorizations;

    +   - AAA traceability:

    +   - introduction,

    +   - configuration of AAA traceability.


    # 4.1. Introduction


    AAA (Authentication, Authorization, Accounting) is a security policy implemented
    in some Cisco routers that performs three functions: authentication, authorization,
    and traceability. With:'
  - '[PAGE 83]


    +   - authentication: this consists of verifying the identity of the user or the
    machine;

    +   - authorization: this consists of determining user rights on different resources;

    +   - traceability: this consists of preserving information on the use of resources
    by the user.


    AAA users may be created on a local host on the router or the switch, just as
    they can be created on an external server (which has the added advantage of centralizing
    access configuration).


    # ## 4.2. AAA authentication


    # ### 4.2.1. Local AAA authentication


    Local authentication enables simple and quick management of user accounts. However,
    this proves inefficient when there is a large number of users.


    The local authentication process can be summarized as follows:


    +   1) the user establishes a connection with the router;

    +   2) the router prompts the users to enter a username and password. The user
    authentication is then validated from a local database.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_83_0.png)


    Figure 4.1. The local AAA authentication process


    To configure a router to use local AAA authentication, proceed as follows:


    | Command | Description |

    |---|---|

    | Router(config)# username username privilege level secret password | Creates
    a user in the local database and allocates a password to the user. |

    | Router(config)# aaa new-model | Creates a new AAA model. |'
  - '[PAGE 84]


    | Router(config)# aaa authentication login { default | list-name } { method1 [
    method2 ...]} | Defines the authentication method to be used when accessing console,
    VTY or aux lines. The authentication method includes local, local-case and Enable.
    |

    | --- | --- |

    | Router(config)# aaa authentication username-prompt text-string | Replace the
    “Username” message with another message. If this contains spaces, they must be
    surrounded by double quotation marks. |

    | Router(config)# aaa authentication password-prompt text-string | Replace the
    “Password” message with other text. |

    | Router(config)# aaa local authentication attempts max-fail number | Secure the
    AAA accounts by locking accounts that have exceeded the pre-defined maximum number
    of failed attempts. The account remains locked until it is activated by an administrator
    using the command: clear aaa local user lockout. |


    # 4.2.2. AAA authentication based on a server


    AAA users can reside on an external server. It is possible to use two types of
    servers based on the Radius or Tacacs + protocols:


    +   - the radius protocol: an open protocol based on the UDP;

    +   - the Tacacs+ protocol: a proprietary protocol based on TCP.


    The differences between the two protocols include:


    | | Tacacs+ | Radius s |

    |---|---|---|

    | Protocol | TCP on port 49 | UDP on ports: – 1812 or 1645 for authentication
    and authorization; – 1813 or 1646 for traceability |

    | Encryption | Encrypts all information | Only encrypts the passwords |

    | AAA architecture | The AAA strategies are independent | Combines authentication
    and traceability |

    | Challenge/response | Bidirectional | Unidirectional |

    | Proprietor | Cisco system | Open source |'
