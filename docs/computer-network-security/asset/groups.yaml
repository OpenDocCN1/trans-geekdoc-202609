    # 10.1.6.7. AAA configuration


    - An ASA may be configured to authenticate itself using a local user database
    or an external server, or by using both methods.


    - In order to activate AAA authentication for access to exec, http, SSH or telnet
    mode, proceed as follows:


    | Command | Description |

    |---|---|

    | ciscoasa(config)# aaa authentication enable console LOCAL | Activates AAA authentication
    for access to the EXEC mode using the local database |

    | ciscoasa(config)# aaa authentication http console LOCAL | Activates AAA authentication
    for http access using the local database |

    | ciscoasa(config)# aaa authentication ssh console LOCAL | Activates AAA authentication
    for ssh access using the local database |

    | ciscoasa(config)# aaa authentication telnet console LOCAL | Activates AAA authentication
    for telnet access using the local database |


    - To activate AAA authentication using an external server, proceed as follows:


    | Command | Description |

    |---|---|

    | ciscoasa(config)# aaa-server server-tag protocol [ tacacs+ | radius ] | Creates
    a group of TACACS + or RADIUS servers |

    | ciscoasa(config-aaa-server-group)# aaa-server server-tag [ (interfacename) ]
    host { server-ip | name } [ key ] | Defines the settings of the AAA server |

    | ciscoasa(config)# aaa authentication { enable | http | ssh | telnet } console
    server-tag [ LOCAL ] | Activates AAA authentication based on the external server
    |'
