    # Preface


    This book is meant for students preparing for the CCNA security exam (210-260
    IINS), whether they are in professional training centers, technical faculties
    or in training centers associated with the “Cisco Academy” program. Nevertheless,
    it may also prove useful to anyone who is interested in information security,
    whether they work in a professional setting or are simply an IT user.


    The book covers all subjects listed in the syllabus for the Cisco exam mentioned
    above. However, we have also integrated certain practical cases from the real
    work of networks that we deemed important.


    Each chapter begins by presenting a theoretical concept related to a pre-determined
    security objective and then provides the CLI commands and screenshots of the GUI
    needed to secure the network component. Practical tasks are suggested at the end
    to help the student apply this configuration and gain mastery over the concept
    presented.


    This book was developed in collaboration with a training and certification team
    from Cisco in order to ensure that the content was clear and simple. The book
    aims to present, in a single volume, the state-of-the-art and good practices to
    put in place a secure information system.


    We hope that the book meets the expectations of our students and helps them obtain
    their certification while also allowing anyone interested in this topic to better
    understand the different concepts of information security.


    Ali SADIQUI

    November 2019'
