    \ 使用 AAA 保护访问\n\n本章将重点介绍以下主题：\n\n- AAA 安全策略：\n  - 身份验证，\n  - 授权，\n  - 可追溯性；\n\
    - AAA 身份验证类型：\n  - 本地 AAA 身份验证，\n  - 基于服务器的 AAA 身份验证；\n- AAA 授权：\n  - 简介，\n  -\
    \ 配置 AAA 授权；\n- AAA 可追溯性：\n  - 简介，\n  - AAA 可追溯性的配置。\n\n### 4.1. 简介\n\nAAA（身份验证、授权、计费）是某些\
    \ Cisco 路由器中实施的安全策略，执行三个功能：身份验证、授权和可追溯性。具体如下：\n- 身份验证：即验证用户或机器的身份；\n- 授权：即确定用户对不同资源的权限；\n\
    - 可追溯性：即保留用户对资源使用情况的信息。\n\nAAA 用户可以在路由器或交换机的本地主机上创建，也可以在外部服务器上创建（后者的额外优势是集中化访问配置）。\n\
    \n### 4.2. AAA 身份验证\n\n#### 4.2.1. 本地 AAA 身份验证\n\n本地身份验证可实现用户账户的简单快速管理。但是，当用户数量庞大时，此方法效率较低。\n\
    \n本地身份验证过程可总结如下：\n- 1) 用户与路由器建立连接；\n- 2) 路由器提示用户输入用户名和密码。随后从本地数据库验证用户身份。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_83_0.png)\n\
    \n图 4.1. 本地 AAA 身份验证过程\n\n要将路由器配置为使用本地 AAA 身份验证，请执行以下操作：\n\n| Command | Description\
    \ |\n|---|---|\n| Router(config)# username username privilege level secret password\
    \ | 在本地数据库中创建用户并为用户分配密码。 |\n| Router(config)# aaa new-model | 创建新的 AAA 模型。 |\n\
    | Router(config)# aaa authentication login { default \\| list-name } { method1\
    \ [ method2 ...]} | 定义访问控制台、VTY 或 AUX 线路时使用的身份验证方法。身份验证方法包括 local、local-case 和\
    \ Enable。 |\n| Router(config)# aaa authentication username-prompt text-string\
    \ | 将“用户名”消息替换为另一条消息。如果该消息包含空格，必须用双引号括起来。 |\n| Router(config)# aaa authentication\
    \ password-prompt text-string | 将“密码”消息替换为其他文本。 |\n| Router(config)# aaa local\
    \ authentication attempts max-fail number | 通过锁定超过预定义最大失败次数的账户来保护 AAA 账户。账户将保持锁定状态，直到管理员使用命令\
    \ clear aaa local user lockout 将其激活。 |\n\n#### 4.2.2. 基于服务器的 AAA 身份验证\n\nAAA 用户可以位于外部服务器上。可以基于\
    \ RADIUS 或 TACACS+ 协议使用两种类型的服务器：\n- RADIUS 协议：基于 UDP 的开放协议；\n- TACACS+ 协议：基于 TCP\
    \ 的专有协议。\n\n两种协议之间的区别包括：\n\n| | Tacacs+ | Radius |\n|---|---|---|\n| 协议 | 端口 49\
    \ 上的 TCP | UDP 端口：– 1812 或 1645 用于身份验证和授权；– 1813 或 1646 用于可追溯性 |\n| 加密 | 加密所有信息\
    \ | 仅加密密码 |\n| AAA 架构 | AAA 策略独立 | 结合身份验证和可追溯性 |\n| 质询/响应 | 双向 | 单向 |\n| 所有者 |\
    \ Cisco 系统 | 开源 |\n\nAAA 策略允许将用户集成到“Active directory”数据库中，以便受益于集中式管理。\n\n使用服务器进行身份验证可总结如下：\n\
    - 1) 用户通过用户名和密码与路由器建立连接；\n- 2) 路由器将用户标识符转发给外部 AAA 服务器；\n- 3) AAA 服务器验证数据；\n- 4)\
    \ 路由器发送回连接结果并验证数据。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_85_0.png)\n\n图\
    \ 4.2. 基于服务器的身份验证\n\n要将路由器配置为在服务器上使用 AAA 身份验证，请执行以下操作：\n\n| Command | Description\
    \ |\n|---|---|\n| R1(config)# tacacs-server host { hostname \\| host-ip-address\
    \ } [ key string ] [ port [ integer ] ] [ single-connection ] [ timeout [ seconds\
    \ ] ] | 配置 TACACS+ 服务器的 IP 地址（或主机名）。其他参数为可选项。 |\n| R1(config)# radius-server host\
    \ { hostname \\| host-ip-address } [ auth-port port-number ] [ acct-port port-number\
    \ ] [ key password ] | 配置 RADIUS 服务器的 IP 地址（或主机名）。其他参数为可选项。 |\n\n可选地，可以将服务器分组，以加速用户身份验证过程或确保负载冗余或平衡。\n\
    \n"
