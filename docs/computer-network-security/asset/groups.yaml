    # 7.2.4. VLAN hopping attacks.


    VLAN hopping attacks consist of connecting to a particular VLAN and attempting
    to access network traffic belonging to other VLANs. By using VLAN hopping, an
    attacker may capture another VLAN''s network traffic or send data from one VLAN
    to another.


    There are two types of VLAN hopping attacks, namely: “Switch spoofing” and “Double
    Tagging” attacks.


    # 7.2.4.1. Switch spoofing attack


    # Overview of the DTP protocol


    DTP is the protocol used to dynamically create trunks (aggregated links) between
    two switches. This may be configured in three modes: “Dynamic Desirable”, “Dynamic
    Auto” or “Trunk”.


    # Overview of the attack


    This attack consists of connecting to the interface of a switch and generating
    DTP messages from a program to create a “trunk” link between the attacker’s computer
    and the switch. The attacker can now capture data from all other VLANs.


    This attack can also take place through the introduction of a “spoofed switch”,
    configured for using the DTP protocol.


    # Countermeasures


    The following features are used to prevent this kind of attack:


    | Command | Description |

    |---|---|

    | S1(config)#interface range gigabitethernet 0/0 - 20 S1(config-if-range)#switchport
    mode access | Configures the ports of a switch connected to hosts as access ports.
    |

    | S1(config-if)# switchport mode trunk | Explicitly enables the aggregation links.
    |

    | S1(config-if)# switchport nonegotiate | Disables DTP and prevents DTP messages
    from being generated. |

    | S1(config)#interface range gigabitethernet 0/26 - 32 S1(config-if)# switchport
    access vlan Vlan S1(config-if)# shutdown | Assigns the unused ports to a dedicated
    VLAN and disables them. |'
  - '[PAGE 144]


    # 7.2.4.2. Double tagging attack


    # Overview of the attack


    This attack consists of connecting to an interface that belongs to a native VLAN
    on a “trunk” port and sending a frame by inserting the fields related to the VLAN
    twice in an Ethernet frame.


    Indeed, a double-tagging attack takes place in three steps:


    +   1) the attacker generates and sends a 802.1Q frame, marked by double tags,
    to switch 1:

    +   - the first tag carries the native VLAN identifier of the “trunk” port;

    +   - the second tag carries the VLAN identifier of the target host.


    | Data | Native VLAN ID | Target VLAN ID |

    | --- | --- | --- |


    # Figure 7.1. Frame 802.1Q, marked by two tags


    2) switch 1 will remove the native VLAN tag. The attacker’s frame will now only
    contain the VLAN tag for the target host.


    | Data | Target VLAN ID |

    | --- | --- |


    # Figure 7.2. Frame 802.1Q marked by the VLAN tag on the host target


    3) switch 2 will send the frame to the port of the target host.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_144_0.png)


    # Figure 7.3. The steps in a double-tagging attack'
  - '[PAGE 145]


    — In figures 7.1, 7.2 and 7.3, the “data” field represents the information connected
    to an Ethernet frame, in addition to the other information from the packet and
    without taking into account the order of their succession in a 802.1Q frame.


    — This type of attack is unidirectional and only works if the hacker is connected
    to a port in the same VLAN as the native trunk port VLAN.


    # Countermeasures


    The “native VLAN” feature is used to prevent this kind of attack.


    | Command | Description |

    |---|---|

    | Switch(config-if)# switchport trunk native vlan vlan | Create a dedicated VLAN
    for native VLAN traffic separated from user traffic. |


    # 7.2.5. STP-based attacks


    # Overview of the STP


    STP is a network protocol that makes it possible to create a loopless network
    topology by blocking certain paths in the LAN, consisting of multiple switches.
    Its function can be summarized as follows:


    +   - selecting a “root bridge” switch for each VLAN;

    +   - defining “root ports” that allow interconnection between the “root” switch
    and other switches;

    +   - defining ports authorized to transmit data;

    +   - blocking certain ports on the switches.


    # Overview of the attack


    This attack consists of introducing a “spoofed switch”, which will attempt to
    position itself as the “root bridge” by sending false “PDU” messages that contain
    a minimal “BID”. This will have the effect of modifying the STP topology and changing
    the role of the ports. From now on, the attacker can use the ports which were
    blocked earlier, in order to capture all the traffic passing through the network.


    # Countermeasures


    The “guard root” feature is used to prevent this kind of attack:'
  - '[PAGE 146]


    | Command | Description |

    |---|---|

    | S1(config-if)# spanning-tree guard root | Protects against the replacement of
    the original “root bridge” by another switch. |


    NOTE.--

    – “bpdu guard” and “guard root” are similar, but have different impacts:

    – bpdu guard disables the ports when receiving bpdu messages if the “portfast”
    option is activated on the port. You must manually reactivate the port or configure
    a “deactivation time”.

    – guard root allows bpdu messages to travel across a port to maintain STP topology,
    unless another switch attempts to become the “root bridge”. The port is reactivated
    when the other switch stops its attempts.


    # 7.3. The best security practices for protecting Layer 2


    The best practices to protect Level 2, for each type of attack, include:


    | Type of attack | Description | Countermeasures |

    |---|---|---|

    | MAC address attacks | – MAC address flooding

    – MAC address spoofing | – Using port security for access ports.

    – Configure the **DAI** feature. |

    | STP attacks | – Modification of STP topology | – Configuring the **portfast**
    feature.

    – Configuring the **bpdu guard** feature.

    – Configure the **guard root** feature. |

    | VLAN hopping attacks | – Using DTP

    – Double tagging attack | – Disable DTP on the access ports.

    – Explicitly configure the “trunk” ports.

    – Always use a dedicated native VLAN.

    – Deactivate all unused ports and place them in an unused VLAN.

    – Avoid using VLAN 1. |'
