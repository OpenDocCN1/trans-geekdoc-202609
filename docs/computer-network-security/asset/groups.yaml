    | ciscoasa(config)# access-group acl-id { in | out } interface interface-name
    | Activates an ACL on an interface |


    ### 10.1.6.6. NAT service configuration


    - ASA supports the following NAT types:


    - Dynamic NAT: consists of translating several private IP addresses into several
    public IP addresses;

    - Dynamic PAT: consists of translating several private IP addresses into a single
    public IP address;

    - Static NAT: consists of translating a single private IP address to a single
    public IP address.


    - To configure a dynamic NAT on an ASA, proceed as follows:


    | Command | Description |

    |---|---|

    | ciscoasa(config)# object network public-pool-obj | Creates a network object
    for the pool of public IP addresses |

    | ciscoasa(config-network-object)# {host ip_addr | subnet net_addr net_mask |
    range ip_addr_1 ip_addr_2 } | Defines the pool of public IP addresses using a
    host address, a subnet or a range of IP addresses |

    | ciscoasa(config)# object network private-pool-obj | Creates another network
    object for the pool of private IP addresses |

    | ciscoasa(config-network-object)# { subnet net_addr net_mask | range ip_addr_1
    ip_addr_2 } | Defines the pool of internal IP addresses using a subnet or a range
    of addresses |

    | ciscoasa(config-network-object)# nat ( real-ifc , mapped-ifc ) dynamic public-pool-object
    | Activates dynamic NAT between the two interfaces |


    - To configure dynamic PAT on the ASA, proceed as follows:


    | Command | Description |

    |---|---|

    | ciscoasa(config)# object network pat-obj-name | Creates a network object for
    the pool of internal IP addresses |

    | ciscoasa(config-network-object)# { subnet net_addr net_mask | range ip_addr_1
    ip_addr_2 } | Defines the pool of internal IP addresses using a subnet or a range
    of addresses |

    | ciscoasa(config-network-object)# nat ( real-ifc , mapped-ifc ) dynamic [ interface
    | ip-address ] | Activates dynamic PAT between this interface and the public interface
    |


    - To configure static NAT on ASA, proceed as follows:


    | Command | Description |

    |---|---|

    | ciscoasa(config)# object network static-nat-obj-name | Creates a network object
    for the internal IP address |

    | ciscoasa(config-network-object)# host ip_addr | Defines the internal IP address
    of the host |

    | ciscoasa(config-network-object)# nat ( real-ifc , mapped-ifc ) static mapped-ip-addr
    | Activates the static NAT between the internal IP address and the public interface
    |


