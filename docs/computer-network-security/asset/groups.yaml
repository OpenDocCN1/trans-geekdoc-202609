    # Securing a Local Network


    This chapter will focus on the following topics:


    +   - the types of attacks on Layer 2:

    +     - MAC address flooding attacks;

    +     - MAC address spoofing attack;

    +     - DHCP starvation attack;

    +     - VLAN hopping attack;

    +     - STP-based attacks;


    +   - best security practices to protect Layer 2:

    +     - configuring port security;

    +     - configuring the DAI feature;

    +     - configuring the “portfast” feature;

    +     - configuring the “bpdu guard” feature;

    +     - configuring the “guard root” feature.


    # 7.1. Introduction


    A LAN, generally comprising one or more Layer 2 switches may be the target of
    several attacks based on any gaps that may exist in Layer 2. An attacker may attempt
    to interrupt, copy, redirect or compromise Level 2 data transmission and, consequently,
    may affect any type of protocol used on the upper layers.'
  - '[PAGE 141]


    # 7.2. Types of attacks on Layer 2


    In this chapter we will study several security threats that target Layer 2 of
    an OSI model and discuss countermeasures that can be used to protect against these
    risks. This is part of securing the “data plane”.


    # 7.2.1. MAC address flooding attacks


    # Overview of the attack


    An attacker connects to a switch port and floods it using a large number of frames
    with fake source MAC addresses. Once the switch table is saturated, the switch
    acts as a hub. The attacker can then capture sensitive data from the network.


    # Countermeasures


    The “port security” feature is a countermeasure that can prevent MAC address flooding
    attacks.


    | Command | Description |

    | :--- | :--- |

    | Switch(config-if)# switchport mode access<br>Switch(config-if)# switchport port-security
    | Enables port security and assign the current MAC address to the port.

    The default port security values are:

    – only one MAC address can be assigned;

    – the violation action is set to the

    deactivation of the port. |

    | Switch(config-if)# switchport port-security maximum value | Defines the maximum
    possible number of MAC addresses secured for the interface. |

    | Switch(config-if)# switchport port-security mac-address mac-address | Manually
    assigns the MAC addresses that can connect to this port. |

    | Switch(config-if)# switchport port-security violation { protect | restrict |

    shutdown [shutdown vlan ] } | Configures the action that must be taken when

    the number of MAC addresses exceeds the

    pre-defined maximum. |

    | Switch(config-if)# errdisable recovery

    interval seconds. | Configures the period of deactivation of a

    port. |'
  - '[PAGE 142]


    # 7.2.2. MAC spoofing attack


    # Overview of the attack


    A MAC address spoofing (ARP spoofing) attack consists of sending false ARP messages
    within a local network, with the aim of deviating and intercepting network traffic.


    # Countermeasures


    The “DAI” (Dynamic ARP Inspection) feature is used to prevent ARP spoofing attacks.
    It makes it possible to verify the mapping between the IPv4 addresses and the
    MAC addresses. In case of any anomaly from an unreliable port, the spoofed ARP
    packets will be ignored.


    | Command | Description |

    |---|---|

    | switch(config)#ip arp inspection vlan vlan | Enables dynamic ARP inspection
    (DAI) on a specific VLAN. |

    | switch(config)#interface g0/0 switch(config-if)#ip arp inspection trust | Configures
    a port to be a reliable port. |


    # 7.2.3. The DHCP starvation attack


    # Overview of the attack


    A DHCP starvation attack consists of broadcasting a large number of DHCP requests
    with spoofed source MAC addresses. Once the number of IP addresses available in
    the DHCP server is exhausted, the attacker may introduce their DHCP server to
    respond to new DHCP requests on the network. The attacker can now capture sensitive
    data using a man-in-the-middle (MITM) attack.


    # Countermeasures


    The “DHCP snooping” feature is used to prevent attacks of this type by filtering
    unreliable DHCP messages.


    | Command | Description |

    |---|---|

    | S1(config)#ip dhcp snooping | Enables the “DHCP snooping” feature on all VLANs.
    |

    | S1(config)#ip dhcp snooping vlan vlan | Enables the “DHCP Snooping” feature
    on a specific VLAN. |

    | S1(config)#interface g0/0 S1(config-if)#ip dhcp snooping trust | Configures
    a reliable port. |

    | S1#show ip dhcp snooping | Displays the “DHCP snooping” configuration. |'
