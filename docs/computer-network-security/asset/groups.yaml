    \n非对称加密基于复杂的数学算法，因此计算时间比对称算法更长。\n\n非对称加密用于确保机密性和认证。\n\n### 8.6.2. 工作原理\n\n| 保密性\
    \ | 保密性 → 公钥（加密）+ 私钥（解密） |\n|:---|:---|\n| | – 公钥用于加密；相应的私钥用于解密。 |\n| | – 鉴于私钥仅存在于单个系统上，此过程保证保密性。\
    \ |\n| | – 此场景常用于密钥交换。 |\n| 认证 | 认证 → 私钥（加密）+ 公钥（解密） |\n| | – 私钥用于加密；相应的公钥用于解密。\
    \ |\n| | – 鉴于私钥仅存在于一个系统上，当其公钥解密消息时，认证得到保证。 |\n\n图 8.4. 总结了确保**保密性**的流程。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_167_0.png)\n\
    \n**图 8.4.** 只有 A 可以读取 B 发送的消息\n\n图 8.5. 介绍了确保**认证**的流程。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_168_0.png)\n\
    \n图 8.5. 只有 A 可能发送了这条消息\n\n### 8.6.3. 数字签名\n\n### 8.6.3.1. 简介\n\n数字签名可以确保电子文档的完整性并验证文档作者的身份。它具有以下特性：\n\
    \n- 无法伪造；\n- 它是签署文档的一部分，不能移动到另一个文档；\n- 已签署的文档不能再被修改。\n\n数字签名提供三个安全功能：\n\n- 签名者的真实性：签名者的身份已得到最终确认；\n\
    - 数据完整性：数字签名保证文档自传输以来始终保持完整；\n- 不可否认性：签名者不能否认对文档的签名。\n\n### 8.6.3.2. 工作原理\n\n\
    验证由用户 A 发送给用户 B 的已签署文档的过程可以总结如下：\n\n### 步骤 1：签署文档\n\n第一个用户“A”将：\n\n- 1) 生成一个私钥\
    \ **Kpr** 和一个公钥 **Kpb**；\n- 2) 使用哈希函数 **H** 计算文档的哈希值；\n- 3) 使用其私钥 **Kpr** 加密哈希值；\n\
    - 4) 向接收者“B”发送以下信息：\n  - 公钥 **Kpb**；\n  - 文档；\n  - 函数 H；\n  - 加密后的哈希值。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_169_0.png)\n\
    \n**图 8.6.** 文档的签名\n\n### 步骤 2：验证已签署的文档\n\n第二个用户“B”将：\n\n- 2) 使用哈希函数 H 计算文档的哈希值；\n\
    - 3) 比较文档生成的消息摘要和使用公钥 Kpb 先前解密的消息摘要。如果两个消息摘要相同，则签名有效。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_170_0.png)\n\
    \n图 8.7. 验证已签署的文档\n\n### 8.6.4. 公钥基础设施\n\n### 8.6.4.1. 简介\n\n公钥基础设施（PKI）是一组服务，可以确保组织中数据的机密性、完整性和认证，并基于非对称加密的基本原理。PKI\
    \ 解决方案基于数字证书和可靠第三方的担保。\n\n### 8.6.4.2. 术语\n\n| 概念 | 定义和特性 |\n|:---|:---|\n| **证书颁发机构（CA）**\
    \ | – 证书颁发机构是一家可靠组织，能够将公钥与用户、公司、设备等关联。<br>– 该机构负责对这些公钥进行数字签名和发布，并保证其真实性。<br>–\
    \ 证书颁发机构可以是私营组织（例如 VeriSign、Cisco 等）或公共组织。 |\n| **证书** | – 一种将用户名或组织名与公钥关联的电子文档。<br>–\
    \ 数字证书由证书颁发机构进行数字签名。<br>– 除了相关实体的公钥之外，数字证书还包含证书的有效期、用于签署证书的算法等信息。 |\n| **证书吊销列表（CRL）**\
    \ | – CRL 是不再有效的证书列表。<br>– 证书可能因多种原因失效：<br>  - 有效期届满；<br>  - 与证书关联的私钥或公钥被泄露；<br>\
    \  - 证书持有者名称中至少一个字段发生更改；<br>  - 其他。 |\n\n### 8.6.4.3. PKI 标准\n\n最广泛使用的 PKI 规范包括：\n\
    \n- X.509：这是由 ITU-T 组织创建的标准，用于定义公钥证书、证书吊销列表（CRL）及其他证书属性的基本标准格式；\n- **公钥加密标准（PKCS）**：这些是由“RSA”实验室设计的一套规范，用于实施公钥加密技术。IT\
    \ 界中最常采用的 PKCS 包括：\n\n"
