    签名微引擎执行以下操作：


    - 为一类签名分配一组范围或可接受值；

    - 使用路由器内存来编译、加载和合并签名。


    思科为这些微引擎使用的几类签名定义了分类，包括：


    | 签名类别 | 描述 |

    |---|---|

    | Atomic | 支持检查简单数据包。 |

    | Service | 支持检查系统是否正在受到攻击。 |

    | String | 支持检查多种协议的数据包，同时指定必须验证的表达式以触发签名。 |

    | Multi-string | 支持通过指定一系列必须验证的表达式来检查数据包，以便触发签名。 |


    注：还有其他类别的签名，可用于检查其他类型的流量。


    ## 6.9. 签名严重性级别


    IPS 签名数据库中的每个签名都与一个严重性级别相关联。这使得可以根据检测到的严重性级别配置 IPS 以采取不同操作。一个签名可能与四个严重性级别相关联。


    | 严重性级别 | 描述 |

    |---|---|

    | Information | 触发签名的活动不被视为迫在眉睫的威胁，但所提供的信息有用。 |

    | Weak | 已检测到异常网络活动。这可能被视为恶意，但不太可能是迫在眉睫的威胁。 |

    | Medium | 已检测到异常网络活动。这可能被视为恶意，并且迫在眉睫的威胁可能存在。 |

    | High | 检测到用于访问或引发拒绝服务（DoS）攻击的攻击，且迫在眉睫的威胁极有可能存在。 |


    ## 6.10. 监控和管理告警与警报


    IPS 生成的警报通常会发送到实时监控系统，以分析、显示和归档信息。事件的监控和管理可能托管在单个服务器上，也可能针对大型部署托管在多个独立服务器上。有多种协议可用于生成告警，特别是
    SDEE（安全设备事件交换）、Syslog 服务器和 SNMP。


    ## 6.11. 攻击期间应采取的操作列表


    当 IPS 检测器检测到恶意活动时，它可以选择以下一种操作：


    | 操作 | 描述 |

    |---|---|

    | Deny attacker inline | 在指定时间内阻止来自攻击者 IP 地址的数据包。 |

    | Deny connection inline | 阻止属于此 TCP 流的当前和未来数据包。 |

    | Deny packet inline | 阻止触发警报的数据包。 |

    | Log attacker packets | 开始记录包含攻击者 IP 地址的数据包。 |

    | Log pair packets | 开始记录包含攻击者 IP 地址以及受害者 IP 地址的数据包。 |

    | Log victim packets | 开始记录包含受害者 IP 地址的数据包。 |

    | Produce alert | 开始将事件记录为警报。 |

    | Produce verbose alert | 开始将事件记录为警报。但是，这还包括触发警报的数据包副本。 |

    | Request block connection | 某些检测器可能依赖另一个网络元素在给定时刻阻止来自攻击者的网络流量。此设备称为“阻塞设备”，可能是使用
    ACL 的 IOS 路由器、使用 VACL 的交换机等。此操作会向“阻塞设备”发送请求以阻止此连接。 |

    | Request block host | 向“阻塞设备”发送请求以阻止攻击者主机。 |

    | Request SNMP trap | 向事件日志发送 SNMP 通知和警报。 |

    | Reset TCP connection | 重置并终止 TCP 连接。 |


    ## 6.12. IOS IPS 的配置


    1. 要使用 CLI 命令配置基本 IPS，请按以下步骤操作：


    在 Flash 存储器中创建 IPS 配置目录。


    | 命令 | 描述 |

    |---|---|

    | Router# mkdir flash: dir-name | 创建配置目录。 |


    将 IPS 签名包复制到 Flash 存储器中。


    | 命令 | 描述 |

    |---|---|

    | Router# copy ftp://myuser:my-pass@ftp-server/IOS-Sxxx-CLI.pkg flash: dir-name
    idconf | 将签名包从 FTP 服务器复制到 Flash 中的目录。 |

    | Router# copy tftp://tftp-server/IOS-Sxxx-CLI.pkg flash: dir-name idconf | 将签名包从
    TFTP 服务器复制到 Flash 目录。 |

    | Router# copy usbflash0:/IOS-Sxxx-CLI.pkg flash: dir-name idconf | 将签名包从 USB
    复制到 Flash 目录。 |


    创建 IPS 规则并指定 IPS 签名文件的位置。


    | 命令 | 描述 |

    |---|---|

    | Router(config)# ip ips name ips-name [name acl] | 为 IPS 规则创建名称。注：使用 ACL 是可选的。它可用于过滤将被分析的流量。
    |

    | Router(config)# ip ips config location flash: dir-name | 指定 IPS 签名文件的位置。 |


    ### 激活 SDEE 协议和日志记录。


    | 命令 | 描述 |

    |---|---|

    | Router(config)# ip http server | 激活 HTTP 服务器（使用 SDEE 时必需）。 |

    | Router(config)# ip ips notify sdee | 激活 SDEE 事件通知。 |

    | Router(config)# ip ips notify log | 激活日志记录。 |


    ### 修改签名类别。


    按类别对签名进行参数化：


    | 命令 | 描述 |

    |---|---|

    | Router(config)# ip ips signature-category | 进入 IPS 签名类别配置模式。 |

    | Router(config-ips-category)# category { all \| ios_ips \| basic \| advanced
    } | 指定要修改的签名类别。 |

    | Router(config-ips-category-action)# retired { false \| true } | 指示签名或签名类别是否要加载到路由器内存中。<br>-
    True：从内存中删除此类别中的所有签名。<br>- False：将签名类别编译到内存中并用于分析流量。 |

    | Router(config-ips-category-action)# event-action action | 修改指定签名类别要采取的操作。这些操作包括以下内容：<br>-
    deny-attacker-inline；<br>- deny-connection-inline；<br>- deny-packet-inline；<br>-
    produce-alert；<br>- reset-tcp-connection。 |

    | Router(config-ips-category-action)# alert-severity { high \| medium \| low \|
    informational } | （可选）修改签名或特定签名类别的警报严重性级别。 |


    ### 修改签名。


    | 命令 | 描述 |

    |---|---|

    | R1(config)# ip ips signature-definition<br>R1(config-sigdef)# signature ID_of_signature<br>ID_of_sub-signature<br>R1(config-sigdef-sig)#
    status<br>...<br>R1(config-sigdef-sig)# engine<br>... | 此命令使用多个参数，特别是：<br>**签名
    ID**：分配给签名的唯一数值。签名 ID 列表可在思科网站上查询。<br>**子签名 ID**：分配给子签名的唯一数值。<br>**引擎**：使可以定义签名使用的引擎以及功能特性。<br>**状态**：指示签名是处于活动状态还是已删除。
    |


    ### 在接口上激活 IPS 规则。


    将 IPS 规则应用到所需接口并指定方向：


    | 命令 | 描述 |

    |---|---|

    | Router(config-if)# ip ips ips-name { in \| out } | 将 IPS 规则应用到接口<br>- IN：仅检查入站流量；<br>-
    OUT：仅检查出站流量。 |


    ## 6.13. 推荐实践


    实施 IPS 的最佳实践包括：


    - 实施 IPS 以分析发送到服务器、路由器等关键网络组件的流量；

    - 在必要时重新配置 IPS，以考虑流量或拓扑的变化；

    - 建议使用专用设备执行 IPS 任务，而非使用基于模块或 IOS 系统功能的 IPS；

    - 使用自动化签名更新，而不是手动应用；

    - 利用全局相关性来提升对潜在攻击的抵御能力；

    - 组合使用多种入侵检测技术以加强安全性。


