    # 3.2. Implementing an NTP server


    # 3.2.1. Introduction to the NTP


    The Network Time Protocol or NTP makes it possible to synchronize the local clock
    of a component of the computer network with that of a reference server (a public
    time server on the Internet on an internal time source).


    # 3.2.2. How the NTP works


    # 3.2.2.1. The different NTP levels


    There are NTP servers at different levels (or strata) that correspond to different
    specifications. Atomic clocks make up Stratum 0 and are directly connected to
    the servers on Stratum 1; these servers are only accessible to servers on Stratum
    2 or Stratum 3. In addition, some of these servers are freely accessible.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_57_0.png)


    Figure 3.1. The different NTP levels'
  - '[PAGE 58]


    # ### 3.2.2.2. The modes of communication of the NTP


    A client may use several modes to synchronize the clock:


    +   - client / server mode: the client synchronizes with the server time;

    +   - symmetric mode: priority is given to the station that has the shortest synchronization
    distance.

    +   - multicast mode: This enables the client to get a response from multiple
    servers.


    # ### 3.2.3. NTP configuration


    # #### 3.2.3.1. Configuring an NTP master


    To configure a router as an NTP master router, proceed as follows:


    | Command | Description |

    | :--- | :--- |

    | Router(config)# ntp master stratum | Configures the router so it becomes the
    NTP master. The number of strata is optional. |

    | Router(config)# ntp authenticate | Activates NTP authentication. |

    | Router(config)# ntp authentication-key key-number md5 key-value | Defines the
    key ID and the NTP password and encrypts it using MD5. |

    | Router(config)# ntp trusted-key key-number | Identifies the key on the master.
    In order to synchronize, an NTP client must provide the appropriate key ID and
    password. |


    # #### 3.2.3.2. Configuring an NTP client


    To configure a router as an NTP client, we proceed as follows:


    | Command | Description |

    | :--- | :--- |

    | Client(config)# ntp server ntp-server-address | Defines the NTP master router
    with which the client will synchronize. |

    | Client(config)# ntp authentication-key key-number md5 key-value | Defines the
    key ID and the NTP password and encrypts it using MD5. |

    | Client(config)# ntp trusted-key key-number | Identifies the trust key. |


    NOTE.— You can now attempt Exercise 3.'
