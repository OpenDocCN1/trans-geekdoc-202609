    | Command | Description |

    |---|---|

    | ciscoasa(config)# interface vlan vlan-id | Creates an SVI |

    | ciscoasa(config-if)# nameif { inside | outside | name } | Gives the SVI a name
    |

    | ciscoasa(config-if)# security-level level | Defines or modifies the security
    level of the SVI |

    | ciscoasa(config-if)# ip address ip-address netmask | Assigns an IP address and
    mask to the SVI |

    | ciscoasa(config-if)# no forward interface vlan vlan-id2 | Prevents routing of
    traffic between the two VLANs |


    – To configure a Layer 2 interface on the ASA, proceed as follows:


    | Command | Description |

    |---|---|

    | ciscoasa(config)# interface interface/number | Accesses the interface |

    | ciscoasa(config-if)# switchport access vlan vlan-id | Assigns it to a VLAN |

    | ciscoasa(config-if)# no shutdown | Activates the interface |


