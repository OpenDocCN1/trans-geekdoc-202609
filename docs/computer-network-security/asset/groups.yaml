    \ 协议。NTP 使同步网络元素上的时间成为可能，从而保证被监督元素数据的可靠性。\n\n### 3.2. 实现 NTP 服务器\n\n#### 3.2.1.\
    \ NTP 简介\n\n网络时间协议（NTP）使计算机网络中组件的本地时钟与参考服务器（互联网上的公共时间服务器或内部时间源）的时钟同步成为可能。\n\n\
    #### 3.2.2. NTP 的工作原理\n\n##### 3.2.2.1. 不同的 NTP 层级\n\n存在不同层级（或称为层）的 NTP 服务器，分别对应不同的规范。原子钟构成第\
    \ 0 层（Stratum 0），并直接连接到第 1 层（Stratum 1）的服务器；这些服务器仅可被第 2 层或第 3 层的服务器访问。此外，其中一些服务器可自由访问。\n\
    \n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_57_0.png)\n\n图 3.1. 不同的 NTP 层级\n\n\
    ##### 3.2.2.2. NTP 的通信模式\n\n客户端可以使用多种模式来同步时钟：\n\n- 客户端/服务器模式：客户端与服务器时间同步；\n- 对称模式：优先级授予同步距离最短的站点。\n\
    - 多播模式：这使客户端能够从多个服务器获得响应。\n\n##### 3.2.3. NTP 配置\n\n###### 3.2.3.1. 配置 NTP 主服务器\n\
    \n要将路由器配置为 NTP 主路由器，请按以下步骤操作：\n\n| 命令 | 描述 |\n| :--- | :--- |\n| Router(config)#\
    \ ntp master stratum | 将路由器配置为 NTP 主服务器。层级数量为可选项。 |\n| Router(config)# ntp authenticate\
    \ | 激活 NTP 身份验证。 |\n| Router(config)# ntp authentication-key key-number md5 key-value\
    \ | 定义密钥 ID 和 NTP 密码，并使用 MD5 对其进行加密。 |\n| Router(config)# ntp trusted-key key-number\
    \ | 标识主服务器上的密钥。为了同步，NTP 客户端必须提供适当的密钥 ID 和密码。 |\n\n###### 3.2.3.2. 配置 NTP 客户端\n\
    \n要将路由器配置为 NTP 客户端，请按以下步骤操作：\n\n| 命令 | 描述 |\n| :--- | :--- |\n| Client(config)#\
    \ ntp server ntp-server-address | 定义客户端将与之同步的 NTP 主路由器。 |\n| Client(config)# ntp\
    \ authentication-key key-number md5 key-value | 定义密钥 ID 和 NTP 密码，并使用 MD5 对其进行加密。\
    \ |\n| Client(config)# ntp trusted-key key-number | 标识受信任密钥。 |\n\n注意。—— 现在你可以尝试练习\
    \ 3。\n\n### 3.3. 实现 Syslog 服务器\n\n#### 3.3.1. Syslog 简介\n\n- Syslog 协议用于收集设备或应用程序生成的日志消息。这些消息有时可能是澄清某些设备故障原因的唯一方式。\n\
    - Syslog 消息通常发送到：\n  - 控制台行；\n  - 终端行；\n  - Syslog 服务器。\n- Syslog 服务器可用于执行以下任务：\n\
    \  - 集中管理不同网络设备（路由器、交换机、服务器等）的所有日志文件；\n  - 在安全位置存档日志，以便进行处理；\n  - 对日志进行搜索和排序，以便于分析。\n\
    \n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_59_0.png)\n\n图 3.2. 在 Syslog 服务器上集中日志文件\n\
    \n#### 3.3.2. Syslog 的工作原理\n\n##### 3.3.2.1. Syslog 严重性级别\n\n严重性级别表示错误消息的性质。共有八个严重性级别，从\
    \ 0 到 7，其中 0（零）为最严重，7 为最不严重。这些级别如下所述：\n\n| 代码 | 严重性 | 描述 |\n|---|---|---|\n| 0\
    \ | 紧急 | 系统无法操作。 |\n| 1 | 警报 | 需要立即干预。 |\n| 2 | 严重 | 关键系统错误。 |\n| 3 | 错误 | 操作错误。\
    \ |\n| 4 | 警告 | 警告（如果不采取措施，可能会发生错误）。 |\n| 5 | 通知 | 必须报告的正常事件。 |\n| 6 | 信息 | 用于信息。\
    \ |\n| 7 | 调试 | 调试消息。 |\n\n##### 3.3.2.2. Syslog 消息的格式\n\n- Syslog 格式的日志按顺序提供以下信息：Seq\
    \ num:timestamp%FACILITY-SEVERITY-MNEMONIC: message：\n- Seq num：表示事件的序列号。仅在执行了\
    \ service sequence-numbers 命令时，此信息才会出现。\n- timestamp：表示事件发生的日期和时间。仅在运行了 service\
    \ timestamps 命令时，此信息才会出现。必须注意的是，该命令默认处于激活状态；\n- FACILITY：表示生成消息的组件、协议或进程。例如，SYS\
    \ 表示操作系统，IF 表示接口，等等；\n- SEVERITY：一个介于 0 和 7 之间的数字，表示所报告事件的严重程度；\n- MNEMONIC：一个标识\
    \ Syslog 消息的代码；\n- message：触发 Syslog 消息的事件的描述。\n- 示例：待分析的 Syslog 消息如下。\n\n```\n\
    39345: May 22 13:56:35.811: %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial0/0/1,\
    \ changed state to down\n```\n\n- Seq num：39345；\n- Timestamp：May 22 13:56:35.811；\n\
    - FACILITY：LINEPROTO；\n- SEVERITY 级别：5 (notification)；\n- MNEMONIC：UPDOWN；\n-\
    \ 消息文本：Line protocol on Interface Serial0/0/1, changed state to down。\n\n####\
    \ 3.3.3. 配置 Syslog 客户端\n\n要将路由器配置为 Syslog 客户端，请按以下步骤操作：\n\n| 命令 | 描述 |\n|---|---|\n\
    | Router(config)# service timestamps log datetime msec | 在调试和日志消息上激活时间戳。 |\n|\
    \ Router(config)# logging host [ ip-address \\| hostname ] | 标识 Syslog 服务器的地址或其主机名。\
    \ |\n| Router(config)# logging trap level | 根据所需的严重级别限制发送到 Syslog 功能的消息。默认值为 6\
    \ (0 到 6)。 |\n| Router(config)# logging on | 激活要记录的消息的发送。默认值为“on”。 |\n| Router#\
    \ show logging | 显示日志状态。 |\n\n### 3.4. 实现简单网络管理协议 (SNMP)\n\n#### 3.4.1. SNMP 简介\n\
    \n- 简单网络管理协议 (SNMP) 允许您远程监控、诊断和管理网络设备。\n- SNMP 的目标可总结如下：\n  - 监控网络性能并了解设备的总体状态（活动、非活动、部分运行、运行、网络拥塞等）；\n\
    \  - 检测网络问题并管理异常事件（网络链路丢失、设备突然停止工作等）；\n  - 配置设备。\n- SNMP 在 OSI 模型的应用层工作，并使用端口\
    \ 162 上的 UDP 协议。\n- 许多软件包使用 SNMP 生成图表，以描绘网络流量或计算机系统的变化（Centreon、NetCrunch 5、MRTG\
    \ 等）。\n\n#### 3.4.2. SNMP 的工作原理\n\n##### 3.4.2.1. SNMP 系统的组件\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_62_0.png)\n\
    \n图 3.3. SNMP 系统的组件\n\nSNMP 系统由三个组件组成：\n\n- SNMP 管理器：运行 SNMP 管理软件的主机。在大多数情况下，这是用于监控网络的计算机；\n\
    - SNMP 代理：运行在网络设备（路由器、交换机、服务器等）上的软件，使其能够被监控；\n- 管理信息基 (MIB)：由 SNMP 代理管理的一组对象集合。每个集合包含一定数量的变量，可由\
    \ SNMP 管理器查询或修改。\n\n"
