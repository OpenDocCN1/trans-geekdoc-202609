    ```


    3.5. 如何仍然可以连接到 R1？


    ### 4. 使用本地 AAA 服务器配置身份验证。


    4.1. 在 AAA 服务器上：


    - 激活 AAA 服务；

    - 创建客户端“R1”，密码为“R@duis00”；

    - 创建客户端“R2”，密码为“R@duis01”；

