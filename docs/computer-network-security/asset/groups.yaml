    # 3.4.2.2. The structure of the management information database


    The MIB has a hierarchical structure. Each object has an identifier (OID), which
    is a series of numbers separated by dots. This makes it possible to give it a
    unique identifier. For example, 1.3.6.1.2.1.2.2.1.2 is the OID for ifDescr. This
    value makes it possible to describe a network interface (e.g. FastEthernet0 /
    0 on a Cisco router).


    One of the best-known MIBs is MIB-II, described in RFC 1213. Figure 3.4 this depicts
    a part of the OID tree for MIB-II.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_63_0.png)


    **Figure 3.4.** The structure of the MIB-II. For a color version of this figure,
    see www.iste.co.uk/sadiqul/computer.zip


    # 3.4.2.3. The different versions of SNMP


    SNMP comes in three main versions: SNMP version 1, SNMP version 2c, and SNMP version
    3.


    +   - SNMPv1: this is the original version and it is recommended that this not
    be used on a network as it has security gaps.


    +   - SNMPv2c: this is an updated version of the initial protocol and offers certain
    improvements. However, the security that it provides is based only the community
    string, which is simply a plaintext password (non-encrypted), vulnerable to hacking.
    SNMPv2c has two types of community strings:


    +   - read-only (RO): this option provides read-only access to MIB objects. This
    is the recommended option for secured configuration;'
  - '[PAGE 64]


    - **read-write (RW)**: this option gives Read and Write access to MIB objects.
    This method provides the ability to modify the configuration of a network element.


    – **SNMPv3**: this version has signification improvements, aimed at addressing
    the security vulnerabilities present in the earlier versions. The concept of the
    community chain gave way to new security features. However, even though this version
    offers better security, SNMPv2c still remains the most frequently used version.


    # 3.4.2.4. SNMP messages


    SNMP messages makes it possible to carry out the following operations:


    +   - **searching for data related to the SNMP agent**: SNMP makes it possible
    to search for data that is linked to an agent using the messages:


    +   - **GET**: this makes it possible to extract a value from a MIB element;


    +   - **GetNext**: it makes it possible to retrieves the next value of the MIB
    element;


    +   - **GetBulk**: (from version SNMPv2c and higher) this operation is used by
    the SNMP manager to efficiently retrieve large amounts of data from the SNMP agent;


    +   **– the modification of data connected to the SNMP agent**: SNMP makes it
    possible to modify data connected to the agent by using the message:


    +   - **SET**: this makes it possible to define a value for a MIB element;


    +   **– Sending alerts and notifications**: SNMP also provides different notification
    (rerouting) operations that can be used by SNMP to warn the SNMP manager about
    an important event:


    +   - **Trap**: this notification is used to send a message that does not need
    a read-receipt from the SNMP agent to the SNMP manager (NMS) when a preset condition
    is fulfilled;


    +   - **Inform**: is used to send a message with read-receipt to the SNMP manager
    now. This feature was introduced in SNMPv2c to address the read-receipt problem
    when using Trap.


    # 3.4.3. SNMP configuration


    To configure a router to use SNMP, proceed as follows:'
  - '[PAGE 65]


    | Command | Description |

    |---|---|

    | Router(config)#snmp-server community name_community [ro|rw] | Configures the
    “community” identifier and its access level (read only or read/write). |

    | Router(config)#snmp-server enable traps name_traps | Activates an SNMP “trap”.
    |

    | Router(config)#snmp-server host IP address of agent name_community | Supervises
    a device. |

    | Router#show snmp | Verifies the SNMP configuration. |


