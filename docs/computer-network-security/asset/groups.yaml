    # ## 4.3. AAA authorizations


    AAA authorization strategies define the access parameters for a user on a router
    or in a network.


    | Command | Description |

    |---|---|

    | Router(config)# aaa authorization { exec | network | commands level } { default
    list-name } { method1 [ method2 ...]} | Defines the authorization strategy to
    be used at the time the following modes are accessed: - exec, which allows a user
    to run a command in this mode; - network, which sets authorized access requests
    related to the network, such as PPP; - commands, which sets authorized commands
    for a specific level of privilege. |


    # ## 4.4. AAA traceability


    AAA traceability makes it possible to log all actions carried out by a user in
    the events log. By doing this, it will be possible to consult the logs to verify
    user actions or to identify the author of a given action in order to rapidly intervene
    in the case of a problem. AAA supports six different types of traceability: system,
    network, exec, commands, connection and resource.'
