    # 8.6.4.4. PKI topologies


    A PKI infrastructure can be implemented using three topologies:


    +   - simple topology: in this topology, a single certification authority (the
    root certification authority) is responsible for issuing all certificates to the
    end users. This model offers the advantage of being simple. However, it also presents
    the following drawbacks:


    +   - it is difficult to manage a topology in a large environment;


    +   - requires strictly centralized administration;


    +   - has a critical vulnerability in the use of a single-signature private key.
    If this key is compromised or stolen, the entire infrastructure will collapse.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_172_0.png)


