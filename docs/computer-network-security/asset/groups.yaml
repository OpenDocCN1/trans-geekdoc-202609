    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_249_0.png)


    ### 1.4. Exploit the victim’s machine.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_249_1.png)


    ### Countermeasure


    Apply all patches for the applications and operating systems.


    ## Part C: exploiting the execution of a “Trojan Horse”


    ### Overview of the attack


    A Trojan horse (or Trojan) is malicious code that contains two functionalities:
    the first carries out a useful task and the second can lead to data espionage
    or even deletion of data.


    ### Tools used to test the attack


    - Metasploit.

    - Armitage.


    ### 1. Preparing for the attack.


    ### 1.1. Release station PC1.


    ### 1.2. Create the Trojan.


    From the list of attacks, choose the following path: “windows/meterpreter/reverse_tcp”
    and double-click. Then, from the drop-down option “Output”, choose the “.exe”
    option and click on the “Launch” button.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_250_0.png)


    Note down the value of the LPORT parameter (9,257). This value could be any value
    of your choice between 1024 and 65,536.


    Save the resulting file as “Trojan” on your desktop.


    ### 1.3. Activate the vulnerability.


    Copy the file “Trojan.exe” onto PC1 and run it.


    NOTE.— In practice, the file already created will either be integrated into another
    program that appears legitimate (a game, a screensaver etc.) or will be linked
    to an office file (pdf, Word etc.) or even an image and will then be triggered
    when executed by the user.


    ### 2. Launch the attack.


    From the directory of attacks, choose the following path: “exploit/multi/handler”
    and double-click.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_251_0.png)


    Set the LPORT parameter to the value that is already configured on the reception
    ports and click on the “Launch” button.


    ### 3. Exploit the victim’s machine.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_251_1.png)


    ### Countermeasure


    - Install and update the anti-virus software.

    - Do not run programs from unreliable sources.


    ## Part D: exploiting the vulnerability of an unsecured connection


    ### Overview of the attack


    The “Man-in-the-middle” attack consists of placing oneself between two network
    elements to try to take advantage of unencrypted data exchanged. Among other things,
    the attacker can steal the login and password details from an unsecured connection
    between the client and the server.


    ### Tool used to test the attack


    **Setoolkit** is suite of custom tools that focuses solely on attacks on network
    elements for personal use (PC, tablet, phone, etc.). These allow the creation
    of “Man-in-the-middle” attacks, among others.


    NOTE.— For this part, you will need to modify your network settings to connect
    to the Internet.


    ### 1. Configuring the basic settings on the PCs.


    ### 1.1. Release station PC1.


    ### 1.2. Modify the VMware network settings on both PCs.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_252_0.png)


    Make sure both stations have an Internet connection.


    ### 2. Launch the attack.


    ### 2.1. Start a terminal and enter the “setoolkit” command.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_252_1.png)


    ### 2.2. Type in the following choices consecutively: 1; 2; 3.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_253_0.png)


    ### 2.3. Type in the following choice: 2 and type in the following parameters:


    - retain the default IP address;

    - type in the link: https://www.facebook.com/.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_253_1.png)


    ### 3. Activate the vulnerability.


    - Launch the browser on the client station and type in the following link: http://192.168.1.25
    (the IP address of the Kali-Linux station). Ensure that your browser indicates
    that your connection is not secure.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_253_2.png)


    NOTE.— In practice, the attacker uses a public IP address linked to a domain name
    that is very close to the name of the targeted site, for instance: facebook.com,
    facebooke.com.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_254_0.png)


    - Type in the login: test@yahoo.fr and the password: 1234 in the indicated fields,
    then validate. Note that you will be redirected to the site www.facebook.com.

    - On the Kali-Linux station, type in Ctrl+C to stop the attack.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_254_1.png)


    - Open the report generated by the tool and check that the login and password
    have been captured and saved (open the ".html" file saved with the path /root/.set/report/).


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_254_2.png)


    ### Countermeasure


    Ensure that connection to a sensitive site is secured by the https protocol.


    ## Part E: exploiting the vulnerability of simple passwords


    ### Overview of the attack


    The purpose of a password attack is to discover usernames and passwords to access
    various resources. There are two commonly used methods for this type of an attack:
    a dictionary attack and brute force attacks.


    ### Tools used to test the attack


    - Crunch: this is a tool that can generate all possible combinations of a given
    set of characters. It is used in the brute force password attacks.

    - Hydra: this is a tool that can carry out password attacks and supports many
    network protocols. It is very fast and flexible, and new modules can be easily
    added.


    NOTE.— For this section, you will need to use GNS3 to complete the exercise.


    ### 1. Configure the basic settings on the PCs and on R1.


    ### Topology


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_255_0.png)


    For a color version of this figure, see www.iste.co.uk/sadqui/computer.zip


    ### 1.1. Configure the IP addresses at the interfaces of both PCs based on the
    topology.


    ### 1.2. Test the connectivity between the two elements.


    ### 1.3. Type in the following commands on R1:


    ```

    R1(config)#username admin password 1234

    R1(config)#line vty 0

    R1(config-line)#login local

    ```


    ### 2. Prepare for the attack.


    ### 2.1. Generate a list of passwords.


    Start a terminal on Kali-Linux and type in the following command:


    ```

    root@kali:~#crunch 4 4 1234 -o /root/PassList.txt

    ```


    NOTE.— For simplicity’s sake, we will restrict ourselves to creating passwords
    with 4 characters, composed of combinations of the digits: 1, 2, 3 and 4.


    ### 2.2. Generate a list of users.


    ```

    root@kali:~#echo admin >> /root/listeUser.txt

    root@kali:~#echo cisco >> /root/listeUser.txt

    root@kali:~#echo administrateur >> /root/User.List.txt

    ```


    ### 3. Launch the attack.


    Launch the attack by using only the “admin” account combined with all the possible
    passwords generated earlier.


    ```

    root@kali:~#hydra -l -t 4 -l admin -P /root/PassList.txt 192.168.34.10 telnet

    ```


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_256_0.png)


    ### NOTES.—


    - To use the “UserList” file, simply type in the command:


    ```

    root@kali:~#hydra -l -t 4 -L /root/UserList.txt -P /root/pass0.txt 192.168.34.10
    telnet

    ```


    - The “Xhydra” tool is the graphical interface of the hydra utility. It simplifies
    the execution of attacks of this type. However, it offers fewer options than command
    line.


    ### Countermeasure


    - Ensure that passwords are hard to guess, that they contain a high level of complexity,
    and that they have a minimum length of 8 characters.

    - Install IPS to detect this type of attack.


    ## References


    - Anandh, V., Vinod, M., Singh, G.D. (2018). *CCNA Security 210-260 Certification
    Guide*. Packt Publishing, Birmingham.

    - Cisco (2018). *Cisco Networking Academy* [Online]. Available at: https://www.netacad.com/fr.

    - Frahim, J., Santos, O., Ossipov, A. (2012). *Cisco ASA: All-in-one Next-Generation
    Firewall, IPS, and VPN Services*, 3rd edition. Cisco Press, Indianapolis.

    - Keith, B., Scott, M. (2012). *CCNA Security 640-554 Official Cert Guide*. Cisco
    Press, Indianapolis.

    - Santos, O., Stuppi, J. (2015). *CCNA Security 210-260 Official Cert Guide*.
    Cisco Press, Indianapolis.

    - Vachon, B. (2012). *CCNA Security Portable Command Guide*. Cisco Press, Indianapolis.

