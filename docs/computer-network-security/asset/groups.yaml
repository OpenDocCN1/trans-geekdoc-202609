    # Introduction


    # Introduction to CCNA Security


    The “CCNA Security” certificate is a test that validates the knowledge and qualifications
    required to secure a network made up of Cisco infrastructure.


    This allows a network professional to demonstrate the skills required to develop
    security infrastructure, recognize threats to the network and vulnerabilities
    in the network, and mitigate these threats in order to maintain integrity, confidentiality
    and the availability of data and devices.


