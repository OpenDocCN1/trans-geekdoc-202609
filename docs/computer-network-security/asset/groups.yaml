  mdcn: "\n\n## 3.4.2.2. 管理信息库的结构\n\nMIB 具有层次结构。每个对象都有一个标识符（OID），即一系列由点分隔的数字。这样可以为其分配唯一标识符。例如，1.3.6.1.2.1.2.2.1.2\
    \ 是 ifDescr 的 OID。此值可用于描述网络接口（例如，思科路由器上的 FastEthernet0/0）。\n\n最著名的 MIB 之一是 MIB-II，在\
    \ RFC 1213 中有描述。图 3.4 描绘了 MIB-II 的 OID 树的一部分。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_63_0.png)\n\
    \n**图 3.4.** MIB-II 的结构。有关本图的彩色版本，请参见 www.iste.co.uk/sadiqul/computer.zip\n\n\
    ## 3.4.2.3. SNMP 的不同版本\n\nSNMP 有三个主要版本：SNMP 版本 1、SNMP 版本 2c 和 SNMP 版本 3。\n\n-\
    \ SNMPv1：这是原始版本，不建议在网络中使用，因为它存在安全漏洞。\n- SNMPv2c：这是初始协议的更新版本，提供了某些改进。但是，它提供的安全性仅基于社区字符串，后者本质上是一个明文密码（未加密），容易受到黑客攻击。SNMPv2c\
    \ 有两种社区字符串类型：\n  - 只读 (RO)：此选项提供对 MIB 对象的只读访问。这是安全配置的推荐选项。\n  - 读写 (RW)：此选项授予对\
    \ MIB 对象的读写权限。此方法提供修改网络元素配置的能力。\n- SNMPv3：此版本有重大改进，旨在解决早期版本中存在的安全漏洞。社区字符串的概念已被新的安全功能取代。但是，尽管此版本提供了更好的安全性，SNMPv2c\
    \ 仍然是使用最频繁的版本。\n\n## 3.4.2.4. SNMP 消息\n\nSNMP 消息可用于执行以下操作：\n\n- 搜索与 SNMP 代理相关的数据：SNMP\
    \ 可使用以下消息搜索与代理链接的数据：\n  - GET：此操作可从 MIB 元素提取值；\n  - GetNext：可检索 MIB 元素的下一个值；\n\
    \  - GetBulk：（SNMPv2c 及更高版本）SNMP 管理器使用此操作从 SNMP 代理高效检索大量数据；\n- 修改与 SNMP 代理连接的数据：SNMP\
    \ 可使用以下消息修改与代理连接的数据：\n  - SET：此操作可为 MIB 元素定义值；\n- 发送警报和通知：SNMP 还提供不同的通知（重定向）操作，SNMP\
    \ 可使用这些操作向 SNMP 管理器发出重要事件警告：\n  - Trap：当满足预设条件时，此通知用于向 SNMP 管理器 (NMS) 发送无需 SNMP\
    \ 代理回执的消息；\n  - Inform：用于向 SNMP 管理器发送带回执的消息。此功能在 SNMPv2c 中引入，以解决使用 Trap 时的回执问题。\n\
    \n## 3.4.3. SNMP 配置\n\n要配置路由器以使用 SNMP，请执行以下操作：\n\n| Command | Description |\n\
    |---|---|\n| Router(config)# snmp-server community name_community [ro|rw] | 配置“community”标识符及其访问级别（只读或读/写）。\
    \ |\n| Router(config)# snmp-server enable traps name_traps | 激活 SNMP“trap”。 |\n\
    | Router(config)# snmp-server host IP address of agent name_community | 监督设备。\
    \ |\n| Router# show snmp | 验证 SNMP 配置。 |\n\n## 3.5. 应用练习\n\n### 练习 3。\n\n### 拓扑\n\
    \n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_65_0.png)\n\n有关本图的彩色版本，请参见 www.iste.co.uk/sadiqui/computer.zip\n\
    \n### 寻址表\n\n| Device | Interface | IP address | Subnet Mask | Gateway |\n|---|---|---|---|---|\n\
    | R1 | G0/0 | 192.168.0.1 | /24 | - |\n| | S0/0 | 192.168.2.1 | /30 | - |\n| R2\
    \ | G0/0 | 192.168.1.1 | /24 | - |\n| | S0/0 | 192.168.2.2 | /30 | - |\n| PC1\
    \ | NIC | 192.168.0.2 | /24 | 192.168.0.1 |\n| NTP_syslog Server | NIC | 192.168.0.3\
    \ | /24 | 192.168.0.1 |\n| PC2 | NIC | 192.168.1.2 | /24 | 192.168.1.1 |\n\n###\
    \ 目标\n\n- 保护密码；\n- 设置连接限制；\n- 保护控制平面；\n- 配置 NTP；\n- 配置 syslog 协议。\n\n### 使用的软件\n\
    \n- Packet Tracer。\n\n### 部分 A：设置基本设备配置\n\n- 1. 配置基本设备设置。\n  - 1.1. 按拓扑图所示配置主机名。\n\
    \  - 1.2. 根据寻址表将 IP 地址应用于设备接口。\n  - 1.3. 将串行接口的时钟值设置为 128 000。\n\n- 2. 使用 OSPF\
    \ 协议配置路由。\n  - 2.1. 在两台路由器上使用进程 ID 1 启用 OSPF。\n  - 2.2. 将 R1 的 RID 值设置为 1.1.1.1，R2\
    \ 的 RID 值设置为 2.2.2.2。\n  - 2.3. 将所有网络添加到区域 0。\n  - 2.4. 检查 PC1 和 PC2 之间的连通性。\n\
    \  - 2.5. 使用“show ip ospf interface”命令显示为 s0/0 接口配置的身份验证类型。\n\n```\nR1# show ip\
    \ ospf interface s0/0\nSerial0 is up, line protocol is up\nInternet Address 192.168.2.1/24,\
    \ Area 0\n...\n...\nSuppress hello for 0 neighbor(s)\nSimple password authentication\
    \ enabled\n```\n\n- 2.6. 解释下划线行的含义：\n\n### 部分 B：保护密码\n\n- 1. 设置最小密码长度为 8 个字符。\n\
    \n```\nR1(config)# security passwords min-length 8\n```\n\n- 2. 配置特权模式密码。\n\n\
    ```\nR1(config)# enable secret Ci$c0ena\n```\n\n- 3. 配置控制台、辅助端口和虚拟访问线路。\n  - 3.1.\
    \ 为控制台端口设置密码，并将非活动间隔设置为 5 分钟。\n\n```\nR1(config)# line console 0\nR1(config-line)#\
    \ password Ci$c0con\nR1(config-line)# exec-timeout 5 0\nR1(config-line)# login\n\
    R1(config-line)# logging synchronous\n```\n\n  - 3.2. 在 VTY 线路上设置密码，并将非活动间隔设置为\
    \ 2 分钟。\n\n```\nR1(config)# line vty 0 4\nR1(config-line)# password Ci$c0vty\n\
    R1(config-line)# exec-timeout 2 0\nR1(config-line)# login\n```\n\n  - 3.3. 禁用辅助端口。\n\
    \n```\nR1(config)# line aux 0\nR1(config-line)# no exec\n```\n\n- 4. 加密所有密码。\n\
    \n```\nR1(config)# service password-encryption\n```\n\n### 部分 C：使用 SSH 保护对 VTY\
    \ 线路的访问\n\n- 1. 配置 SSH 连接。\n\n使用以下选项配置 SSH 连接：\n\n- 域名：tri.local；\n- 用户名：sshadmin，密码：Ci$c0ssh；\n\
    - RSA 加密密钥为 1024 位；\n- 使用的 SSH 版本为版本 2；\n- 等待时间为 90 秒；\n- 登录尝试次数为 3 次；\n- 允许 SSH\
    \ 和 VTY 会话。\n\n- 2. 配置连接参数。\n\n使用“login block-for”命令，如果在 30 秒内两次连接尝试失败，则阻止连接 60\
    \ 秒。\n\n```\nR1(config)# login block-for 60 attempts 2 within 30\n```\n\n### 部分\
    \ D：保护控制平面\n\n- 1. 复习控制平面的定义。\n\n- 2. 为 OSPF 协议配置 MD5 身份验证。\n\n  - 2.1. 在 R1 上激活\
    \ MD5 身份验证。\n\n```\nR1(config)# interface S0/0\nR1(config-if)# ip ospf message-digest-key\
    \ 1 md5 Ci$c0ospf\nR1(config-if)# exit\nR1(config)# router ospf 1\nR1(config-router)#\
    \ area 0 authentication message-digest\n```\n\n  - 2.2. 在 R2 上重复相同的配置。\n\n- 2.3.\
    \ 重复使用“show ip ospf interface”命令显示为 s0/0 接口配置的身份验证类型。\n\n```\nR1# show ip ospf\
    \ interface s0/0\nSerial0 is up, line protocol is up\nInternet Address 192.168.2.1/24,\
    \ Area 0\n....\n....\nSuppress hello for 0 neighbor(s)\nMessage digest authentication\
    \ enabled\nYoungest key id is 1\n```\n\n- 2.4. 解释下划线行的含义：\n\n### 部分 E：配置 NTP\n\
    \n- 1. 复习 NTP 的作用。\n\n- 2. 配置 NTP 服务器。\n\n在 NTP_Syslog 服务器上激活 NTP 服务。\n\n- 3.\
    \ 显示系统日期。\n\n  - 3.1. 在 R1 上显示系统日期。\n\n```\nR1# show clock detail\n```\n\n  -\
    \ 3.2. 根据上一命令的输出，填写以下表格：\n\n| 日期 | |\n|---|---|\n| 时间 | |\n| 时区 | |\n| 时间源 | |\n\
    \n- 4. 将 R1 和 R2 配置为 NTP_Syslog 服务器的 NTP 客户端。\n\n```\nR1(config)# ntp server 192.168.0.3\n\
    R1(config)# ntp update-calendar\n```\n\n"
