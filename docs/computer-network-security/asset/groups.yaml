    \ commonly used between IPsec gateways (Cisco routers or ASA firewalls).\n\n##\
    \ 9.2. IKE protocol\n\n### 9.2.1. Introduction\n\nInternet Key Exchange (IKE)\
    \ is a protocol used to dynamically negotiate the security settings associated\
    \ with IPSec communication. It must be noted that an IPsec implementation can\
    \ also support the manual management of this exchange of settings. However, the\
    \ IKE protocol is considered faster and more secure.\n\nIKE is available in two\
    \ versions. The version v2 offers several advantages, including, among others,\
    \ the fixing of vulnerabilities in IKEv1 and optimal bandwidth use.\n\n### 9.2.2.\
    \ Components of IKE\n\nIKE is the combination of three protocols, namely: ISAKMP,\
    \ SKEME and Oakley. These protocols are grouped together to ensure negotiation\
    \ and the establishment of a secured communication.\n\n- ISAKMP: makes it possible\
    \ to negotiate SAs between two ends of an IPsec communication.\n- Oakley: uses\
    \ the Diffie-Hellman algorithm to carry out key exchanges between both sides of\
    \ the IPsec connection.\n- SKEME: defines key exchange techniques that ensure\
    \ anonymity and non-repudiation.\n\n### 9.2.3. IKE phases\n\nThe IKE protocol\
    \ operates in two main phases to create a secured communication channel between\
    \ the two IPsec points. The first phase makes it possible to negotiate the tunnel\
    \ security settings, while the second phase ensures the secured transmission of\
    \ data.\n\n### 9.2.3.1. Phase 1 of IKE\n\nThe characteristics of phase 1 can be\
    \ summarized as follows:\n\n- the objective is to establish an ISAKMP SA (or IKE\
    \ SA). IKE negotiates the security options for the communication such as the encryption\
    \ algorithm, the hash function, the authentication method and the Diffie-Hellman;\n\
    - the SA negotiations are in both directions;\n- this phase produces three keys.\
    \ Two keys are used to protect the ISAKMP SA messages and the third key is used\
    \ to produce two other keys used for protecting IPsec exchanges;\n- to prove their\
    \ identity, the sender sends a hash of the key associated with the identity and\
    \ with all previous messages. The identity key is either a shared secret or a\
    \ pair of private/public keys;\n- the fact that multiple keys are generated guarantees\
    \ data confidentiality. Even if the shared key is known in the future (or even\
    \ if the public key used is compromised) the data will always be protected as\
    \ it is encrypted by the session key. The session key is a combination of the\
    \ identity key with a random (nonce) value and several other values that are difficult\
    \ to predict;\n- this phase can be established in two modes:\n  - main mode; this\
    \ consists of six messages. It guarantees anonymity on both sides by encrypting\
    \ the last two messages;\n  - aggressive mode: this consists of only three messages.\
    \ It is, therefore, faster, but does not offer the advantages of the Main Mode.\n\
    \n### 9.2.3.2. Phase 2 of IKE\n\nThe characteristics of phase 2 can be summarized\
    \ as follows:\n\n- the objective is to establish an IPsec SA;\n- the SA negotiations\
    \ are *unidirectional*.\n\nThe only mode defined for this phase is the *Quick\
    \ Mode*.\n\n### 9.2.3.3. The differences between the two IKE versions\n\nThe main\
    \ differences between versions 1 and 2 include:\n\n- simplified exchange of messages:\n\
    \  - IKEv1 exchanges nine messages (phase 1 = 6, phase 2 = 3);\n  - IKEv2 exchanges\
    \ six messages (phase 1 = 4, phase 2 = 2);\n- security:\n  - IKEv1 is susceptible\
    \ to denial-of-service (DoS) attacks;\n  - IKEv2 is protected against DoS attacks.\
    \ A request is only processed if the applicant is identified.\n\n## 9.3. The site-to-site\
    \ VPN configuration\n\n### 9.3.1. Introduction\n\nA site-to-site VPN connects\
    \ two remote LANs in order to securely share resources *via* the internet. It\
    \ is set up between two sides of a VPN connection in a transparent way for internal\
    \ hosts.\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_193_0.png)\n\n**Figure 9.3.\
    \ Site-to-Site VPN**\n\n### 9.3.2. Configuration of IPsec VPN\n\n### Steps to\
    \ be followed\n\nTo configure a site-to-site VPN using CLI commands, use the following\
