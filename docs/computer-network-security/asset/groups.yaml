    | R1(config)# crypto isakmp key PassVPN address 44.113.202.129 | Defines the shared\
    \ key and the IP address for the other side of the VPN tunnel. |\n\n- 4) create\
    \ the IPsec policy required for Phase 2.\n\n| Command | Description |\n|---|---|\n\
    | R1(config)# crypto ipsec transform-set R1-to-R2-SET esp-sha-hmac esp-aes 128\
    \ | Defines the communication settings for Phase 2. |\n\n- 5) create the encryption\
    \ map and configure the parameters of the crypto map.\n\n| Command | Description\
