  mdcn: "\n\n## 6.14. 应用练习\n\n### 练习 8。\n\n### 拓扑\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_127_0.png)\n\
    \n如需查看此图的彩色版本，请访问 www.iste.co.uk/sadiqui/computer.zip\n\n### 寻址表\n\n| 设备 | 接口\
    \ | IP 地址 | 子网掩码 | 网关 |\n| :--- | :--- | :--- | :--- | :--- |\n| R1 | G0/0 | 192.168.0.1\
    \ | /25 | - |\n| R1 | G0/1 | 192.168.0.129 | /25 | - |\n| R1 | G0/2 | 192.168.1.1\
    \ | /24 | - |\n| R1 | S0/0 | 192.168.100.1 | /30 | - |\n| R1 | S0/1 | 192.168.200.1\
    \ | /30 | - |\n| R2 | G0/0 | 192.168.10.1 | /24 | - |\n| R2 | S0/0 | 192.168.100.2\
    \ | /30 | - |\n| R3 | G0/0 | 192.168.20.1 | /24 | - |\n| R3 | S0/0 | 192.168.200.2\
    \ | /30 | - |\n| PC1 | NIC | 192.168.0.2 | /25 | 192.168.0.1 |\n| PC2 | NIC |\
    \ 192.168.0.130 | /25 | 192.168.0.129 |\n| PC3 | NIC | 192.168.10.2 | /24 | 192.168.10.1\
    \ |\n| FTP_server | NIC | 192.168.1.2 | /24 | 192.168.1.1 |\n| Server-HTTP | NIC\
    \ | 192.168.1.3 | /24 | 192.168.1.1 |\n| Server-HTTP2 | NIC | 192.168.20.2 | /24\
    \ | 192.168.20.1 |\n\n### 目标\n\n配置基于区域的防火墙。\n\n### 使用的软件\n\nPacket Tracer。\n\n\
    ### 部分 A：设置基本设备配置\n\n- 1. 配置基本设备设置。\n  - 1.1. 按拓扑图所示配置主机名。\n  - 1.2. 根据寻址表将 IP\
    \ 地址应用于设备接口。\n  - 1.3. 将串行接口的时钟值设置为 128000。\n- 2. 使用 OSPF 协议配置路由。\n  - 2.1. 在路由器上启用\
    \ OSPF，进程 ID 使用值 1。\n  - 2.2. 将 R1 的 RID 值设置为 1.1.1.1，R2 设置为 2.2.2.2，R3 设置为 3.3.3.3。\n\
    \  - 2.3. 将所有网络添加到 OSPF 协议。\n  - 2.4. 测试所有网络元素之间的连通性。\n\n### 部分 B：配置基于区域的防火墙\n\
    \n- 1. 在 R1 上创建安全区域。\n  创建以下安全区域：\n\n  | 安全区域名称 | 描述 |\n  | :--- | :--- |\n  |\
    \ IN-ZONE-Z10 | 服务 1 网络 |\n  | IN-ZONE-Z20 | 服务 2 网络 |\n  | DMZ-ZONE | DMZ 区域网络\
    \ |\n  | OUT-ZONE | 互联网网络 |\n  | HEAD-ZONE | 总部网络 |\n\n- 2. 创建定义需监控内部流量的 ACL。\n\
    \  - 2.1. 创建一个编号的 ACL，授权 http、FTP 和 icmp 流。\n    ```\n    R1(config)# access-list\
    \ 101 permit tcp 192.168.0.0 0.0.0.127 host 192.168.1.2 eq www\n    R1(config)#\
    \ access-list 101 permit tcp 192.168.0.0 0.0.0.127 host 192.168.1.2 eq ftp\n \
    \   R1(config)# access-list 101 permit icmp 192.168.3.0 0.0.0.127 any\n    ```\n\
    \  - 2.2. 创建一个编号的 ACL，允许 FTP 流。\n    ```\n    R1(config)# access-list 102 permit\
    \ tcp any host 192.168.1.2 eq ftp\n    R1(config)# access-list 102 permit icmp\
    \ any host 192.168.1.2\n    ```\n  - 2.3. 创建一个编号的 ACL，允许指向总部的 http 和 icmp 流。\n\
    \    ```\n    R1(config)# access-list 103 permit tcp 192.168.0.0 0.0.0.255 host\
    \ 192.168.20.2 eq www\n    R1(config)# access-list 103 permit icmp 192.168.0.0\
    \ 0.0.0.255 host 192.168.20.2\n    ```\n\n- 3. 创建 Class-Map 以识别授权流量。\n  - 3.1.\
    \ 创建 CMAP-IN-TO-DMZ Class-Map 并识别授权流量。\n    ```\n    R1(config)# class-map type\
    \ inspect match-any CMAP-IN-TO-DMZ\n    R1(config-cmap)# match access-group 101\n\
    \    R1(config-cmap)# exit\n    ```\n  - 3.2. 创建 CMAP-IN-TO-HEAD Class-Map 并识别授权流量。\n\
    \    ```\n    R1(config)# class-map type inspect match-any CMAP-IN-TO-HEAD\n \
    \   R1(config-cmap)# match access-group 103\n    R1(config-cmap)# exit\n    ```\n\
    \  - 3.3. 创建 CMAP-OUT-TO-DMZ Class-Map。\n    ```\n    R1(config)# class-map type\
    \ inspect match-any OUT-TO-DMZ\n    R1(config-cmap)# match access-group 102\n\
    \    R1(config-cmap)# exit\n    ```\n\n- 4. 创建 Policy-Map 以应用 Class-Maps。\n  -\
    \ 4.1. 创建 Policy-Map 以应用 CMAP-IN-TO-DMZ Class-Map。\n    ```\n    R1(config)# policy-map\
    \ type inspect PMAP-IN-TO-DMZ\n    R1(config-pmap)# class type inspect CMAP-IN-TO-DMZ\n\
    \    R1(config-pmap-c)# pass\n    ```\n  - 4.2. 同样，创建以下 Policy-Maps：\n    - 用于\
    \ CMAP-OUT-TO-DMZ Class-Map 的 PMAP-OUT-TO-DMZ\n    - 用于 CMAP-IN-TO-HEAD Class-Map\
    \ 的 PMAP-IN-TO-HEAD\n\n- 5. 定义区域对。\n  创建以下区域对：\n\n  | 区域对名称 | 源 | 目标 | 要应用的策略\
    \ |\n  | :--- | :--- | :--- | :--- |\n  | IN-to-DMZ | IN-ZONE-Z10 | DMZ-ZONE |\
    \ PMAP-IN-TO-DMZ |\n  | OUT-to-DMZ | OUT-ZONE | DMZ-ZONE | PMAP-OUT-TO-DMZ |\n\
    \  | IN1-to-HEAD | IN-ZONE-Z10 | HEAD-ZONE | PMAP-IN-TO-HEAD |\n  | IN2-to-HEAD\
    \ | IN-ZONE-Z20 | HEAD-ZONE | PMAP-IN-TO-HEAD |\n\n- 6. 将接口分配到区域。\n\n  | 接口名称\
    \ | 安全区域名称 |\n  | :--- | :--- |\n  | G0/0 | IN-ZONE-Z20 |\n  | G0/1 | IN-ZONE-Z10\
    \ |\n  | G0/2 | DMZ-ZONE |\n  | S0/0 | OUT-ZONE |\n  | S0/1 | HEAD-ZONE |\n\n\
    - 7. 验证 R1 的配置。\n  使用“show running-config”命令，验证配置的所有参数。\n\n- 8. 测试防火墙的配置。\n  -\
    \ 检查是否可以从 PC2 和 PC3 访问 Server-HTTP。\n  - 检查是否只能从 PC1 访问 Server-HTTP2。\n  - 检查是否只能从\
    \ PC1 访问 Server-FTP 服务。\n    ```\n    PC1:> ftp 192.168.1.3\n    ```\n  - 检查是否可以从\
    \ PC1 向 Server-HTTP 发送 ping 请求。\n  - 检查是否可以从 PC1 向 PC3 发送 ping 请求。\n\n- 9. 修改\
    \ R1 防火墙的参数。\n  添加授权并检测 IN-ZONE-Z20 与 Server-HTTP 之间流量所需的修改。\n\n### 练习 9。\n\n\
    ### 拓扑\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_131_1.png)\n\n如需查看此图的彩色版本，请访问\
    \ www.iste.co.uk/sadiqui/computer.zip\n\n### 寻址表\n\n| 设备 | 接口 | IP 地址 | 子网掩码 |\
