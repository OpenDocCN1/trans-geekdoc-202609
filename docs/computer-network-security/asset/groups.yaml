    ## Securing Network Devices


    This chapter studies the following topics:


    - the types of network traffic:

    - the management plane,

    - the control plane,

    - the data plane;

    - securing the management plane:

    - securing passwords,

    - implementing connection restrictions,

    - securing access through control lines, VTY and auxiliaries,

    - assigning administrative roles: protecting access using privilege levels;

    - protecting access through the management of “views” and “super-views”:

    - securing configuration files and the system,

    - using automated security features;

    - securing the control plane.


    ## 2.1. Types of network traffic


    Cisco has categorized the different types of network traffic into different “planes”
    of communication. It has defined three such planes: the management plane, the
    control plane and the data plane.


    - the management plane: this includes traffic used by a network administrator
    to configure network devices. It is generally made up of protocols, such as **Telnet**,
    **SSH** and **SNMP**;

    - the control plane: this includes traffic between the network devices, transmitted
    to each other for discovery and/or for automatically configuring the network,
    such as the traffic of updating **routing protocols** or ARP protocol, for instance.

    - the data plane: this is the actual traffic of end users in the network.


    ## 2.2. Securing the management plane


    Securing the management plane includes, among others, the following:


    - applying a secure password policy;

    - securing console, VTY and auxiliary access;

    - securing and archiving configurations;

    - enabling logging to record all changes;

    - using NTP (Network Time Protocol) to synchronize clocks on network devices.


    ## 2.3. Securing passwords


    The following must be taken into account when applying a password policy:


    - change passwords often;

    - include alphanumeric characters, uppercase letters, lowercase letters, symbols
    and spaces in passwords;

    - do not use passwords that will be easy to detect;

    - encrypt all passwords;

    - set a minimum of 10 characters for passwords;


    | Command | Description |

    | --- | --- |

    | Router(config)# service password-encryption | Encrypts all passwords. |


    | Command | Description |

    | --- | --- |

    | Router(config)# security passwords min-length length | Applies a minimum length
    to all new passwords. Existing passwords will not be affected. The length can
    be from 1 to 16. It is recommended to have 10 or more characters. |

    | Router(config)# enable algorithm-type {md5|scrypt|sha256} secret password |
    Encrypts the password with your preferred mode, using the MD5 algorithm. |


    ## 2.4. Implementing connection restrictions


    ### 2.4.1. Configuring a login banner


    A banner is a feature used on Cisco systems that makes it possible to display
    a text message when a Cisco machine is being used. Cisco recommends that a legal
    notification banner be displayed in all interactive sessions. There are two main
    reasons for this:


    - the banner must be used to alert intruders as well as users to the security
    policy that is applied, to which they are subject;

    - the banner must be used to quickly identify the terminal being accessed.


    | Command | Description |

    | --- | --- |

    | banner exec | Defines a personalized banner that is displayed each time that
    the EXEC mode is initiated. |

    | banner login | Defines a personalized banner that is displayed before the username
    and password are entered. |

    | banner motd | Defines a personalized “message-of-the-day” banner. |


    ### 2.4.2. Configuring connection parameters


    | Command | Description |

    | --- | --- |

    | login block-for X attempts Y within Z | This blocks access for “X” seconds after
    “Y” login attempts within “Z” seconds. |

    | login quiet-mode access-class {acl-name|acl-number} | Defines an ACL to authorize
    connections when access is blocked by the login block-for. |


    | Command | Description |

    | --- | --- |

    | login delay second | Sets up a delay between successive attempts to login. |

    | login on-failure log [every login] | Creates an entry in the event log every
    time a connection attempt fails. This command may be customized. |

    | login on-success log [every login] | Creates an entry in the event log every
    time there is a successful login attempt. |


    ## 2.5. Securing access through console lines, VTY and auxiliaries


    ### 2.5.1. Securing access through the console line and deactivating the auxiliary
    line


    | Command | Description |

    | --- | --- |

    | Router(config)# username name privilege level secret password | Creates a database
    of local users and encrypt their passwords. |

    | Router(config)# line vty 0 4 Router(config-line)# login local | – |

    | Router(config-line)# exec-timeout minutes seconds | Sets the inactivity period
    to a specific value. The default value is 10 minutes. |

    | Router(config-line)# line aux 0 | Access the “auxiliary line” mode. |

    | Router(config-line)# no exec | Disables the auxiliary port. |


    ### 2.5.2. Securing VTY access with ssh


    | Command | Description |

    | --- | --- |

    | Router(config)# ip ssh version [1|2] | It is recommended that version 2 be used.
    |

    | Router(config)# ip ssh time-out seconds | Defines the number of seconds to wait
    before the SSH client responds during the negotiation phase. The default value
    is set to 120 seconds. |

    | Router(config)# ip ssh authentication-retries integer | Limits the number of
    login attempts. The default value is 3. |

    | Router(config)# login block-for seconds attempts tries within seconds | Secures
    the VTY connection. |

    | Router(config-line)# transport input ssh | Uniquely authorizes the SSH sessions.
    |

    | Router(config-line)# access-class ACL-number | Applies an ACL to control access
    to the VTY line. |

