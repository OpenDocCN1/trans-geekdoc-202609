  md: "\n## 6.14. Exercises for application\n\n### EXERCISE 8.\n\n### Topology\n\n\
    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_127_0.png)\n\nFor a color version of\
    \ this figure, see www.iste.co.uk/sadiqui/computer.zip\n\n### Addressing table\n\
    \n| Device | Interface | IP address | Subnet mask | Gateway |\n| :--- | :--- |\
    \ :--- | :--- | :--- |\n| R1 | G0/0 | 192.168.0.1 | /25 | - |\n| R1 | G0/1 | 192.168.0.129\
    \ | /25 | - |\n| R1 | G0/2 | 192.168.1.1 | /24 | - |\n| R1 | S0/0 | 192.168.100.1\
    \ | /30 | - |\n| R1 | S0/1 | 192.168.200.1 | /30 | - |\n| R2 | G0/0 | 192.168.10.1\
    \ | /24 | - |\n| R2 | S0/0 | 192.168.100.2 | /30 | - |\n| R3 | G0/0 | 192.168.20.1\
    \ | /24 | - |\n| R3 | S0/0 | 192.168.200.2 | /30 | - |\n| PC1 | NIC | 192.168.0.2\
    \ | /25 | 192.168.0.1 |\n| PC2 | NIC | 192.168.0.130 | /25 | 192.168.0.129 |\n\
    | PC3 | NIC | 192.168.10.2 | /24 | 192.168.10.1 |\n| FTP_server | NIC | 192.168.1.2\
    \ | /24 | 192.168.1.1 |\n| Server-HTTP | NIC | 192.168.1.3 | /24 | 192.168.1.1\
    \ |\n| Server-HTTP2 | NIC | 192.168.20.2 | /24 | 192.168.20.1 |\n\n### Objectives\n\
    \nConfiguring a zone-based firewall.\n\n### Software to be used\n\nPacket tracer.\n\
    \n### Part A: setting up the basic device configuration\n\n- 1. Configure the\
    \ basic device settings.\n  - 1.1. Configure the host names as shown in the topology.\n\
    \  - 1.2. Apply the IP addresses to the device interfaces according to the addressing\
    \ table.\n  - 1.3. Set the clock value to 128000 for the serial interfaces.\n\
    - 2. Configure the routing using the OSPF protocol.\n  - 2.1. Enable OSPF on the\
    \ routers using the value 1 as the process ID.\n  - 2.2. Set the RID value to\
    \ 1.1.1.1 for R1, to 2.2.2.2 for R2 and to 3.3.3.3 for R3.\n  - 2.3. Add all networks\
    \ to the OSPF protocol.\n  - 2.4. Test connectivity between all network elements.\n\
    \n### Part B: configuring a zone-based firewall\n\n- 1. Create security zones\
    \ on R1.\n  Create the following security zones:\n\n  | Name of the security zone\
    \ | Description |\n  | :--- | :--- |\n  | IN-ZONE-Z10 | Network for Service 1\
    \ |\n  | IN-ZONE-Z20 | Network for Service 2 |\n  | DMZ-ZONE | Network for the\
    \ DMZ zone |\n  | OUT-ZONE | Internet network |\n  | HEAD-ZONE | The headquarters\
    \ network |\n\n- 2. Create ACLs that define the internal traffic to be monitored.\n\
    \  - 2.1. Create a numbered ACL that authorizes http, FTP and icmp streams.\n\
    \    ```\n    R1(config)# access-list 101 permit tcp 192.168.0.0 0.0.0.127 host\
    \ 192.168.1.2 eq www\n    R1(config)# access-list 101 permit tcp 192.168.0.0 0.0.0.127\
    \ host 192.168.1.2 eq ftp\n    R1(config)# access-list 101 permit icmp 192.168.3.0\
    \ 0.0.0.127 any\n    ```\n  - 2.2. Create a numbered ACL that allows the FTP stream.\n\
    \    ```\n    R1(config)# access-list 102 permit tcp any host 192.168.1.2 eq ftp\n\
    \    R1(config)# access-list 102 permit icmp any host 192.168.1.2\n    ```\n \
    \ - 2.3. Create a numbered ACL that allows http and icmp streams towards the headquarters.\n\
    \    ```\n    R1(config)# access-list 103 permit tcp 192.168.0.0 0.0.0.255 host\
    \ 192.168.20.2 eq www\n    R1(config)# access-list 103 permit icmp 192.168.0.0\
    \ 0.0.0.255 host 192.168.20.2\n    ```\n\n- 3. Create Class-Maps to identify authorized\
    \ traffic.\n  - 3.1. Create a CMAP-IN-TO-DMZ Class-Map and identify authorized\
    \ traffic.\n    ```\n    R1(config)# class-map type inspect match-any CMAP-IN-TO-DMZ\n\
    \    R1(config-cmap)# match access-group 101\n    R1(config-cmap)# exit\n    ```\n\
    \  - 3.2. Create a CMAP-IN-TO-HEAD Class-Map and identify authorized traffic.\n\
    \    ```\n    R1(config)# class-map type inspect match-any CMAP-IN-TO-HEAD\n \
    \   R1(config-cmap)# match access-group 103\n    R1(config-cmap)# exit\n    ```\n\
    \  - 3.3. Create a CMAP-OUT-TO-DMZ Class-Map.\n    ```\n    R1(config)# class-map\
    \ type inspect match-any OUT-TO-DMZ\n    R1(config-cmap)# match access-group 102\n\
    \    R1(config-cmap)# exit\n    ```\n\n- 4. Create the Policy-Map to apply the\
    \ Class-Maps.\n  - 4.1. Create a Policy-Map to apply the CMAP-IN-TO-DMZ Class-Map.\n\
    \    ```\n    R1(config)# policy-map type inspect PMAP-IN-TO-DMZ\n    R1(config-pmap)#\
    \ class type inspect CMAP-IN-TO-DMZ\n    R1(config-pmap-c)# pass\n    ```\n  -\
    \ 4.2. Similarly, create the following Policy-Maps:\n    - PMAP-OUT-TO-DMZ for\
    \ the CMAP-OUT-TO-DMZ Class-Map\n    - PMAP-IN-TO-HEAD for the CMAP-IN-TO-HEAD\
    \ Class-Map\n\n- 5. Define the zone pairs.\n  Create the following zone pairs:\n\
    \n  | Name of the zone pair | Source | Destination | Strategy to apply |\n  |\
    \ :--- | :--- | :--- | :--- |\n  | IN-to-DMZ | IN-ZONE-Z10 | DMZ-ZONE | PMAP-IN-TO-DMZ\
    \ |\n  | OUT-to-DMZ | OUT-ZONE | DMZ-ZONE | PMAP-OUT-TO-DMZ |\n  | IN1-to-HEAD\
    \ | IN-ZONE-Z10 | HEAD-ZONE | PMAP-IN-TO-HEAD |\n  | IN2-to-HEAD | IN-ZONE-Z20\
    \ | HEAD-ZONE | PMAP-IN-TO-HEAD |\n\n- 6. Assign the interfaces to the zones.\n\
    \n  | Name of the interface | Name of the security zone |\n  | :--- | :--- |\n\
    \  | G0/0 | IN-ZONE-Z20 |\n  | G0/1 | IN-ZONE-Z10 |\n  | G0/2 | DMZ-ZONE |\n \
    \ | S0/0 | OUT-ZONE |\n  | S0/1 | HEAD-ZONE |\n\n- 7. Verify the configuration\
    \ of R1.\n  Using the “show running-config” command, verify all the parameters\
    \ of your configuration.\n\n- 8. Test the configuration of your firewall.\n  -\
    \ Check that it is possible to access the Server-HTTP from PC2 and PC3.\n  - Check\
    \ that it is only possible to access Server-HTTP2 from PC1.\n  - Check that it\
    \ is only possible to access the Server-FTP service from PC1.\n    ```\n    PC1:>\
    \ ftp 192.168.1.3\n    ```\n  - Check that it is possible to send a ping request\
    \ to Server-HTTP from PC1.\n  - Check that it is possible to send a ping request\
    \ from PC1 to PC3.\n\n- 9. Modify the parameters of your R1 firewall.\n  Add the\
    \ modifications required to authorize and inspect the traffic between IN-ZONE-Z20\
    \ and the Server-HTTP.\n\n### EXERCISE 9.\n\n### Topology\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_131_1.png)\n\
