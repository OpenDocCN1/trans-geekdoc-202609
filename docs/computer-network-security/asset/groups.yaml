    A signature micro-engine carries out the following operations:


    +   - allocates a set of ranges or acceptable values to a category of signatures;


    +   - uses the router memory to compile, load and merge signatures.


    Cisco has defined several categories of signatures used by these micro-engines,
    including:


    | Category of signatures | Description |

    |---|---|

    | Atomic | Makes it possible to inspect simple packets. |

    | Service | Makes it possible to inspect whether a system is being attacked. |

    | String | Makes it possible to inspect packets for multiple protocols, while
    specifying an expression that must be verified to trigger the signature. |

    | Multi-string | Makes it possible to inspect packets by specifying a series of
    expressions that must be verified in order to trigger the signature. |


    NOTE.— There are other categories of signatures that make it possible to inspect
    other types of traffic.


    # 6.9. Severity levels of the signatures


    Each signature in the IPS signatures database is associated with a severity level.
    This makes it possible to configure an IPS to take different actions depending
    on the severity level detected. A signature may be associated with four severity
    levels.


    | Severity levels | Description |

    |---|---|

    | Information | The activity that triggers a signature is not considered an immediate
    threat, however the information supplied is useful. |

    | Weak | Abnormal network activity has been detected. This may be perceived as
    malicious, however it is not likely to be an immediate threat. |'
  - '[PAGE 123]


    | Medium | Abnormal network activity has been detected. This may be perceived
    as malicious and an immediate threat is probable. |

    |---|---|

    | High | Attacks that are used to access or provoke a denial of service (DoS)
    attack are detected and an immediate threat is extremely probable. |


    # 6.10. Monitoring and managing alarms and alerts


    Alerts generated by an IPS are, in general, sent to a real-time monitoring system
    to analyze, display and archive information. The surveillance and management of
    events may be hosted on a single server or on several separate servers for larger
    deployment. Several protocols are available to generate alarms, especially SDEE
    (Security Device Event Exchange), Syslog server and SNMP.


    # 6.11. List of actions to be taken during an attack


    When an IPS detector detects malicious activity, it can choose one of the following
    actions:


    | Action | Description |

    |---|---|

    | Deny attacker inline | Blocks packets coming from the attacker’s IP address
    for a specified period. |

    | Deny connection inline | Blocks the current and future packets belonging to
    this TCP stream. |

    | Deny packet inline | Blocks the packet that triggered the alert. |

    | Log attacker packets | Initiates the logging of packets that contain the IP
    address of the attacker. |

    | Log pair packets | Initiates the logging of packets that contain the IP address
    of the attacker as well as that of the victim. |

    | Log victim packets | Initiates the logging of packets that contain the IP address
    of the victim. |

    | Produce alert | Initiates the logging of events as alerts. |

    | Produce verbose alert | Initiates the logging of events as alerts. However,
    this also includes a copy of the packets that triggered the alert. |'
  - '[PAGE 124]


    | Request block connection | Certain detectors may rely on another network element
    to block traffic in the network from the attacker, at a given moment. This device
    is called the “blocking device” and may be an IOS router using ACLs, a switch
    using VACLs, etc. This action causes a request to be sent to the “blocking device”
    to block this connection. |

    | Request block host | Sends a request to a “blocking device” to block the attacker’s
    host. |

    | Request SNMP trap | Sends an SNMP notification and an alert to the events log.
    |

    | Reset TCP connection | Resets and terminates a TCP connection. |


    # 6.12. Configuration of an IOS IPS


    1. To configure a basic IPS using CLI commands, proceed as follows:


    Create an IPS configuration directory in the Flash memory.


    | Command | Description |

    | Router# mkdir flash: dir-name | Creates a configuration directory. |


    Copy the IPS signatures package into the Flash memory.


    | Command | Description |

    | Router# copy ftp://myuser:my-pass@ftp-server/IOS-Sxxx-CLI.pkg flash: dir-name
    idconf | Copy the signature package from an FTP server into the directory in Flash.
    |

    | Router# copy tftp://tftp-server/IOS-Sxxx-CLI.pkg flash: dir-name idconf | Copy
    the signature package from a TFTP server into the Flash directory. |

    | Router# copy usbflash0:/IOS-S xxx -CLI.pkg flash: dir-name idconf | Copy the
    signature package from a USB into the Flash directory. |


    Create an IPS rule and specify the location of the IPS signature file.


    | Command | Description |

    | Router(config)# ip ips name ips-name [name acl ] | Creates a name for the IPS
    rule. NOTE.—the use of ACLs is optional. It makes it possible to filter the traffic
    that will be analyzed. |

    | Router(config)# ip ips config location flash: dir-name | Specifies the location
    of the IPS signature file. |'
  - '[PAGE 125]


    # Activate the SDEE protocol and logging.


    | Command | Description |

    | :--- | :--- |

    | Router(config)# ip http server | Activates the http server (required when using
    SDEE). |

    | Router(config)# ip ips notify sdee | Activates the SDEE event notification.
    |

    | Router(config)# ip ips notify log | Activates logging. |


    # Modify the signature categories.


    Parameterization of signatures per category:


    | Command | Description |

    | :--- | :--- |

    | Router(config)# ip ips signature-category | Enters into the configuration mode
    for IPS signature categories. |

    | Router(config-ips-category)# category { all | ios_ips | basic | advanced ] }
    | Specifies the signature category to be modified. |

    | Router(config-ips-category-action)# retired { false | true } | Indicates whether
    a signature or signature category is to be loaded or not in the router memory.

    – True: removes all signatures within this category from the memory.

    – False: compiles the signature category in memory and uses it to analyze traffic.
    |

    | Router(config-ips-category-action)# event-action action | Modifies the actions
    to be taken for a specified signature category. These actions include the following:

    – deny-attacker-inline;

    – deny-connection-inline;

    – deny-packet-inline;

    – produce-alert;

    – reset-tcp-connection. |

    | Router(config-ips-category-action)# alert-severity { high | medium | low | informational
    } | (Optional) Modify the severity level of an alert for a signature or specific
    signature category. |'
  - '[PAGE 126]


    # Modify a signature.


    | Command | Description |

    |---|---|

    | R1(config)# ip ips signature-definition<br>R1(config-sigdef)#signature _ID_of_signature<br>ID_of_sub-signature<br>R1(config-sigdef-sig)#status<br>...<br>R1(config-sigdef-sig)#engine<br>...
    | This command uses several parameters, in particular:

    **Signature ID**: a unique numerical value assigned to a signature. The list of
    signature IDs is available on the Cisco website.

    **Sub-signature ID**: a unique numerical value assigned to a sub-signature.

    **Engine**: makes it possible to define the engine used by the signature and the
    functional characteristics.

    **Status**: indicates whether the signature is active or removed. |


    # Activates the IPS rules on an interface.


    Apply the IPS rule to a desired interface and specify the direction:


    | Command | Description |

    |---|---|

    | Router(config-if)# ip ips ips-name { in | out } | Applies an IPS rule to an
    interface

    – IN: only inspects incoming traffic;

    – OUT: only inspects outgoing traffic. |


    # 6.13. Recommended practices


    The best practices for implementing IPS include:


    +   - implement IPS to analyze traffic sent towards critical network components
    such as servers, routers etc.;

    +   - reconfigure IPS, when necessary, to take into account changes in flow or
    topology;

    +   - it is recommended that you use dedicated devices for IPS tasks instead of
    using IPS that are based on modules or on the features of the IOS system;

    +   - use automated signature updates instead of applying them manually;

    +   - make use of global correlation to improve your resistance to possible attacks;

    +   - use a combination of intrusion detection technologies to reinforce security.'
