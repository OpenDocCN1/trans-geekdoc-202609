    # Using Firewalls


    This chapter will focus on the following topics:


    +   - the role a firewall plays;

    +   - the types of firewalls:

    +     - NAT firewall,

    +     - packet-filtering firewall,

    +     - stateful firewall,

    +     - application firewall;

    +   - setting up a firewall;

    +   - different firewall strategies;

    +   - ACL-based firewalls:

    +     - IPv4 ACLs,

    +     - IPv6 ACLs;

    +   - zone-based firewalls:

    +     - the types of security zones in a network,

    +     - rules applied to inter-zone traffic,

    +     - configuring a ZFW.'
  - '[PAGE 95]


    # 5.1. Introducing firewalls


    A firewall is a software or hardware system put in place between a reliable network
    and an unreliable one. The main purpose of putting in place a firewall is to filter
    out and prevent unwanted traffic from crossing the firewall barrier. In order
    to do this, a firewall must comply with the following recommendations:


    +   - it must be resistant to attacks;

    +   - it must be the only transit point between two networks;

    +   - it must ensure that the organization’s access control strategy is applied.


    # 5.2. Types of firewalls


    There are different kinds of firewalls. Some of these are:


    +   - NAT firewall: this hides a private IP address by translating it into a public
    IP address;

    +   - packet-filtering firewall: this makes it possible to filter packets from
    Layers 3 or 4 of the OSI model. This kind of firewall is simple to configure but
    is also vulnerable to identity-theft attacks;

    +   - stateful firewall: this carries out the same function as a packet-filtering
    firewall and also keeps track of the state of network connections (i.e. the TCP
    and UDP sequence numbers), thereby making it more secure;

    +   - application firewall (proxy firewall): This is usually a server that carries
    out this type of filtering of information located in layers 3, 4, 5 and 7.


    # 5.3. Setting up a firewall


    The best practices for setting up a firewall include:


    +   - place the firewall at the security boundaries to separate different domains
    of communication;

    +   - only allow the traffic of necessary services;

    +   - monitor firewall logs;

    +   - put in place a variety of firewall technologies in order to provide comprehensive
    multilayer access control;'
  - '[PAGE 96]


    +   - do not rely on only a firewall for security;

    +   - ensure that physical access to the firewall is monitored;

    +   - practice change management for firewall configuration.


    # 5.4. Different firewall strategies


    In general, access rules are implemented using an ACLs (ACL). When you define
    access rules, you can use several criteria as your starting point:


    +   - rules based on the service: these determine the type of services that may
    be accessed by incoming or outgoing traffic. The firewall may filter traffic depending
    on the IP address and the TCP port number.

    +   - rules based on direction: these determine the direction in which requests
    towards a specific service may be initiated and authorized.

    +   - rules based on behavior: these control the manner in which specific services
    will be used. For example, the firewall may filter emails to eliminate spam.


    # 5.5. ACL-based firewalls


    # 5.5.1. Introduction


    An Access Control List is a sequential set of authorization or denial instructions
    that are applied to addresses or higher layer protocols. ACLs make it possible
    to control incoming or outgoing traffic in a network.


    # 5.5.2. The location of ACLs


    ACLs may be put in place in two directions:


    +   - incoming ACLs: the router processes incoming packets before sending them
    onto the output interface.

    +   - outgoing ACLs: the router directs incoming packets towards the output interface
    and then processes them by applying outgoing ACLs.


    # 5.5.3. IPv4 ACLs


    Routers support two types of IPv4 ACLs.'
  - '[PAGE 97]


    # – Standard ACLs:


    +   - filter IP packets based only the source IP address;

    +   - can be numbered or named;

    +   - the range of valid numbers extends from 1–99 and 130–1999.


    # – Extended ACLs:


    +   - filter IP packets based on the source and destination IP addresses, the
    source and destination UDP and TCP ports and the ICMP message types etc.;

    +   - can be numbered or named;

    +   - valid number ranges include 100–199 and 2000–2699.


    – To configure standard ACLs, proceed as follows:


    | Command | Description |

    |---|---|

    | R1(config)# access-list number [deny|permit] source [generic mask] | Creates
    a numbered standard ACL. |

    | R1(config)# ip access-list standard name_ACL | Creates a standard named ACL.
    |

    | R1(Config-if)# ip access-group [ number | name [ in | out ] ] | Activates an
    ACL on an interface. |


    – To configure extended ACLs, proceed as follows:


    | Command | Description |

    |---|---|

    | R1Config)# access-list number { deny | permit } protocol source [generic mask]
    destination [generic mask] | Creates a numbered extended ACL. |

    | R1(config)# ip access-list extended name_ACL | Create a named extended ACL.
    |

    | R1 ( config-if)# ip access-group {number|name} {in|out} | Activates an ACL on
    an interface. |


    # 5.5.4. IPv6 ACLs


    – The list of IPv6 Access Control Lists are similar to IPv4 Access Control Lists,
    with some specific features presented below:'
  - '[PAGE 98]


    | IPv4 Access Control Lists | IPv6 Access Control Lists |

    |---|---|

    | Standard<br>Numbered<br>Named<br>Extended<br>Numbered<br>Named | Named only<br>Function
    as IPv4 extended ACL access control lists. |

    | Use a generic mask | No generic mask. |

    | The IP access-group command makes it possible to apply an IPv4 access control
    list to an IPv4 interface | IPv6 uses the ipv6 traffic-filter command to perform
    the same task on IPv6 interfaces. |

    | There is an implicit deny any or deny any instruction | permit icmp any any
    nd-na<br>permit icmp any any nd-ns |


    - To configure IPv6, ACLs, proceed as follows:


    | Command | Description |

    |---|---|

    | R1(config)# ipv6 access-list *name* | Creates an IPv6 ACL. |

    | R1(config-ipv6-acl) # {deny|permit} protocole ipv6-source/CIDR [{eq|neq|gt|lt|range}
    port] ipv6-destination/CIDR [{eq|neq|gt|lt|range} port] | Configures an IPv6 ACL.
    |

    | R1(config)#interface *type number*<br>R1(config-if)#ipv6 traffic-filter *name_ACL*
    {in|out} | Activates an IPv6 ACL on an interface. |


    # 5.5.5. ACL recommendation


    When implementing ACLs it is important to consider the following points:


    +   - the instructions in an ACL are processed in sequential order, taking into
    account their order;

    +   - the most specific instructions must be placed in the first lines in an ACL;

    +   - by default, new instructions in an existing ACL are added to the last lines;

    +   - it must be ensured that the last instruction is a refusal of any other unspecified
    traffic;

    +   - only a single ACL is authorized per interface, per protocol or per direction;'
  - '[PAGE 99]


    +   - the packets generated by the routers are not processed by outgoing ACLs;

    +   - standard ACLs must be placed as close to the destination as possible;

    +   - extended ACLs must be placed as close to the source as possible.


    NOTE.— You can now attempt Exercise 6.


    # 5.6. Zone-based firewalls


    # 5.6.1. Introduction


    A Zone-based Policy Firewall (ZFW) is a firewall solution based on an IOS router.
    This allows a network to be protected against external threats based on the separation
    of the different network types into distinct zones and enables the specification
    of the kind of traffic that may pass from one zone to another. One of the chief
    advantages of this solution includes the simplicity of defining access strategies.


    # 5.6.2. Types of security zones in a network


    In general, there are three kind of security zones that may be applied to an organization''s
    network:


    +   - the internal zone: this is the production network in an organization. This
    is a zone whose access must be strictly controlled. Direct, uncontrolled access
    from another zone must not be permitted;


    +   - the external zone: as a general rule, this corresponds to the Internet.
    This is a non-secured zone which presents a constant source of danger to the organization''s
    internal network;


    +   - the DMZ (demilitarized) zone: this is a zone that is used to enable Internet-based
    access to certain servers (web messaging services etc.) while avoiding any direction
    connection with the internal network. This zone presents several security breach
    risks and requires strict access control for the following traffic:


    +   - incoming traffic from the internet to the hosts in the DMZ zone;

    +   - outgoing traffic from the hosts in the DMZ zone towards the internet;

    +   - incoming traffic from the internal network to the hosts in the DMZ zone;

    +   - outgoing traffic from the hosts in the DMZ zone towards the internal network.'
  md: "\n## Using Firewalls\n\nThis chapter will focus on the following topics:\n\n\
