    | Command | Description |

    |---|---|

    | ciscoasa(config-network-object)# {host ip_addr | subnet net_addr net_mask |
    range ip_addr_1 ip_addr_2 } | Defines the pool of public IP addresses using a
    host address, a subnet or a range of IP addresses |

    | ciscoasa(config)# object network private-pool-obj | Creates another network
    object for the pool of private IP addresses |

    | ciscoasa(config-network-object)# { subnet net_addr net_mask | range ip_addr_1
    ip_addr_2 } | Defines the pool of internal IP addresses using a subnet or a range
    of addresses |

    | ciscoasa(config-network-object)# nat ( real-ifc , mapped-ifc ) dynamic public-pool-object
