    \ |\n| PKCS#10 | 证书请求标准 |\n\n## 8.6.4.4 PKI 拓扑\n\nPKI 基础设施可以使用三种拓扑实现：\n\n- 简单拓扑：在此拓扑中，单个证书颁发机构（根证书颁发机构）负责向最终用户颁发所有证书。该模型的优点是简单。然而，它也存在以下缺点：\n\
