    the pool of IP addresses to assign to internal users |

    | ciscoasa(config)# dhcpd domain domain-name | Configures the domain name |

    | ciscoasa(config)# dhcpd dns dns-ip-address | Configures the DNS IP Address |

    | ciscoasa(config)# dhcpd lease seconds | Configures the lease duration |

    | ciscoasa(config)# dhcpd enable interface-name | Enables the DHCP Server Service
