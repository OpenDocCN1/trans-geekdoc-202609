    The main differences between versions 1 and 2 include:


    +   – simplified exchange of messages:


    +   - IKEv1 exchanges nine messages (phase 1 = 6, phase 2 = 3);


    +   - IKEv2 exchanges six messages (phase 1 = 4, phase 2 = 2);


