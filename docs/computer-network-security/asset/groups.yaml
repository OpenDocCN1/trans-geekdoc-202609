  mdcn: "\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_100_0.png)\n\n## 图 5.1. 不同类型网络划分至独立区域\n\
    \n## 5.6.3. 应用于区域间流量的规则\n\n路由流量时，会对 ZFW 应用以下规则：\n\n- 必须先创建安全区域，然后才能为其分配接口；\n-\
    \ 一个接口可以分配给单个安全区域；\n- 默认情况下，属于同一区域的接口之间允许流量；\n\n必须预先配置安全策略，才能授权流量在两个区域之间传递。可采取三种操作：\n\
    \n- **放行**：允许流量从一个区域 transite 到另一个区域；\n- **检查**：允许流量并检查返回流量；\n- **丢弃**：删除流量；\n\
    \n除非明确禁止，否则任何指向路由器接口（“自身区域”）的流量均获授权。\n\n## 5.6.4. 术语\n\nZFW 的访问策略需要三个基本组件：\n\n\
    - 类映射：允许根据某些条件识别流量；\n- 策略映射：允许应用先前创建的“类映射”策略；\n- 服务策略：允许定义应用先前创建的策略映射的位置。\n\n\
    ## 5.6.5. 配置 ZFW\n\n可按以下步骤依次配置 ZFW：\n\n- 1) 创建区域；\n- 2) 创建类映射以识别授权流量；\n- 3) 创建策略映射以应用类映射；\n\
    - 4) 定义区域对；\n- 5) 将策略映射应用到区域对；\n- 6) 将接口分配给区域。\n\n## 5.7. 创建区域\n\n| Command |\
    \ Description |\n|---|---|\n| Router(config)# zone security zone-name | 创建安全区域。\
    \ |\n\n## 5.8. 创建类映射\n\n| Command | Description |\n|---|---|\n| Router(config)#\
    \ class-map type inspect { match-any | match-all } class-map-name | 创建类映射并定义这些选项。match-any：数据包必须满足其中一条匹配条件。match-all：数据包必须满足所有匹配条件。\
    \ |\n| Router(config-cmap)# match protocol protocol | 根据协议定义匹配条件。 |\n\n## 5.9.\
    \ 创建应用类映射的策略映射\n\n| Command | Description |\n|---|---|\n| Router(config)# policy-map\
    \ type inspect policy-map-name | 创建策略映射并定义这些选项。 |\n| Router(config-pmap)# class\
    \ type inspect class-map-name | 将其与一个（或多个）类映射关联。 |\n| Router(config-pmap-c)# {drop\
    \ | inspect | pass } | 定义要执行的操作。 |\n\n## 5.10. 定义区域对\n\n| Command | Description\
    \ |\n|---|---|\n| Router(config)# zone-pair security zone-pair-name source { source-zonename\
    \ | self | default } destination { destination-zone-name | self | default } |\
    \ 创建区域对，允许在两个区域之间应用单向“策略映射”。 |\n\n## 5.11. 将策略映射应用到区域对\n\n| Command | Description\
    \ |\n|---|---|\n| Router(config-sec-zone-pair)# service-policy type inspect policymap-name\
    \ | 将策略映射策略应用到区域对。 |\n\n## 5.12. 将接口分配给区域\n\n| Command | Description |\n|---|---|\n\
