    \n### 9.8. 为什么现在可以将 R2 视为 IPS？\n\n## 保护本地网络\n\n本章将重点介绍以下主题：\n\n- 第 2 层攻击类型：\n\
    \  - MAC 地址泛洪攻击；\n  - MAC 地址欺骗攻击；\n  - VLAN 跳跃攻击；\n  - 基于 STP 的攻击；\n- 保护第 2 层的最佳安全实践：\n\
    \  - 配置端口安全；\n  - 配置 DAI 功能；\n  - 配置“portfast”功能；\n  - 配置“bpdu guard”功能；\n  -\
    \ 配置“guard root”功能。\n\n## 7.1. 简介\n\n局域网（LAN）通常由一个或多个第 2 层交换机组成，可能成为基于第 2 层中可能存在的任何漏洞的多种攻击的目标。攻击者可能尝试中断、复制、重定向或破坏第\
    \ 2 层数据传输，并因此可能影响上层使用的任何类型的协议。\n\n## 7.2. 第 2 层攻击类型\n\n在本章中，我们将研究针对 OSI 模型第 2\
    \ 层的多种安全威胁，并讨论可用于防范这些风险的对策。这是保护“data plane”的一部分。\n\n### 7.2.1. MAC 地址泛洪攻击\n\n\
    #### 攻击概述\n\n攻击者连接到交换机端口，并使用大量带有伪造源 MAC 地址的帧对其进行泛洪。一旦交换机表被填满，交换机就会充当集线器。攻击者随后可以捕获网络中的敏感数据。\n\
    \n#### 对策\n\n“端口安全”功能是一种可防止 MAC 地址泛洪攻击的对策。\n\n| Command | Description |\n| :---\
    \ | :--- |\n| Switch(config-if)# switchport mode access<br>Switch(config-if)#\
    \ switchport port-security | 启用端口安全并将当前 MAC 地址分配到端口。<br>端口安全的默认值为：<br>– 只能分配一个\
    \ MAC 地址；<br>– 违规操作设置为禁用端口。 |\n| Switch(config-if)# switchport port-security maximum\
    \ value | 定义接口可能的最大安全 MAC 地址数量。 |\n| Switch(config-if)# switchport port-security\
    \ mac-address mac-address | 手动分配可以连接到此端口的 MAC 地址。 |\n| Switch(config-if)# switchport\
    \ port-security violation { protect | restrict | shutdown [shutdown vlan ] } |\
    \ 配置当 MAC 地址数量超过预定义最大值时必须采取的操作。 |\n| Switch(config-if)# errdisable recovery<br>interval\
    \ seconds. | 配置端口禁用的时间段。 |\n\n### 7.2.2. MAC 欺骗攻击\n\n#### 攻击概述\n\nMAC 地址欺骗（ARP\
    \ 欺骗）攻击包括在本地网络内发送虚假 ARP 消息，其目的是拦截并截获网络流量。\n\n#### 对策\n\n“DAI”（动态 ARP 检测）功能用于防止\
    \ ARP 欺骗攻击。它可以验证 IPv4 地址与 MAC 地址之间的映射。如果来自不可信端口出现任何异常，伪造的 ARP 数据包将被忽略。\n\n| Command\
    \ | Description |\n|---|---|\n| switch(config)#ip arp inspection vlan vlan | 在特定\
    \ VLAN 上启用动态 ARP 检测 (DAI)。 |\n| switch(config)#interface g0/0<br>switch(config-if)#ip\
    \ arp inspection trust | 将端口配置为可信端口。 |\n\n### 7.2.3. DHCP 饥饿攻击\n\n#### 攻击概述\n\n\
    DHCP 饥饿攻击包括广播大量带有伪造源 MAC 地址的 DHCP 请求。一旦 DHCP 服务器中可用的 IP 地址数量耗尽，攻击者可以引入其自身的 DHCP\
    \ 服务器来响应网络上的新 DHCP 请求。攻击者现在可以使用中间人（MITM）攻击来捕获敏感数据。\n\n#### 对策\n\n“DHCP 侦听”功能通过过滤不可靠的\
    \ DHCP 消息来防止此类攻击。\n\n| Command | Description |\n|---|---|\n| S1(config)#ip dhcp\
    \ snooping | 在所有 VLAN 上启用“DHCP 侦听”功能。 |\n| S1(config)#ip dhcp snooping vlan vlan\
    \ | 在特定 VLAN 上启用“DHCP 侦听”功能。 |\n| S1(config)#interface g0/0<br>S1(config-if)#ip\
    \ dhcp snooping trust | 配置可信端口。 |\n| S1#show ip dhcp snooping | 显示“DHCP 侦听”配置。\
    \ |\n\n"
