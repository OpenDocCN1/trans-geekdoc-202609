    \ zones in a network,\n  - rules applied to inter-zone traffic,\n  - configuring\
    \ a ZFW.\n\n### 5.1. Introducing firewalls\n\nA firewall is a software or hardware\
    \ system put in place between a reliable network and an unreliable one. The main\
    \ purpose of putting in place a firewall is to filter out and prevent unwanted\
    \ traffic from crossing the firewall barrier. In order to do this, a firewall\
    \ must comply with the following recommendations:\n\n- it must be resistant to\
    \ attacks;\n- it must be the only transit point between two networks;\n- it must\
    \ ensure that the organization’s access control strategy is applied.\n\n### 5.2.\
    \ Types of firewalls\n\nThere are different kinds of firewalls. Some of these\
    \ are:\n\n- NAT firewall: this hides a private IP address by translating it into\
    \ a public IP address;\n- packet-filtering firewall: this makes it possible to\
    \ filter packets from Layers 3 or 4 of the OSI model. This kind of firewall is\
    \ simple to configure but is also vulnerable to identity-theft attacks;\n- stateful\
    \ firewall: this carries out the same function as a packet-filtering firewall\
    \ and also keeps track of the state of network connections (i.e. the TCP and UDP\
    \ sequence numbers), thereby making it more secure;\n- application firewall (proxy\
    \ firewall): This is usually a server that carries out this type of filtering\
    \ of information located in layers 3, 4, 5 and 7.\n\n### 5.3. Setting up a firewall\n\
    \nThe best practices for setting up a firewall include:\n\n- place the firewall\
    \ at the security boundaries to separate different domains of communication;\n\
    - only allow the traffic of necessary services;\n- monitor firewall logs;\n- put\
    \ in place a variety of firewall technologies in order to provide comprehensive\
    \ multilayer access control;\n- do not rely on only a firewall for security;\n\
    - ensure that physical access to the firewall is monitored;\n- practice change\
    \ management for firewall configuration.\n\n### 5.4. Different firewall strategies\n\
    \nIn general, access rules are implemented using an ACLs (ACL). When you define\
    \ access rules, you can use several criteria as your starting point:\n\n- rules\
    \ based on the service: these determine the type of services that may be accessed\
    \ by incoming or outgoing traffic. The firewall may filter traffic depending on\
    \ the IP address and the TCP port number.\n- rules based on direction: these determine\
    \ the direction in which requests towards a specific service may be initiated\
    \ and authorized.\n- rules based on behavior: these control the manner in which\
    \ specific services will be used. For example, the firewall may filter emails\
    \ to eliminate spam.\n\n### 5.5. ACL-based firewalls\n\n### 5.5.1. Introduction\n\
    \nAn Access Control List is a sequential set of authorization or denial instructions\
    \ that are applied to addresses or higher layer protocols. ACLs make it possible\
    \ to control incoming or outgoing traffic in a network.\n\n### 5.5.2. The location\
    \ of ACLs\n\nACLs may be put in place in two directions:\n\n- incoming ACLs: the\
    \ router processes incoming packets before sending them onto the output interface.\n\
    - outgoing ACLs: the router directs incoming packets towards the output interface\
    \ and then processes them by applying outgoing ACLs.\n\n### 5.5.3. IPv4 ACLs\n\
    \nRouters support two types of IPv4 ACLs.\n\n### Standard ACLs:\n\n- filter IP\
    \ packets based only the source IP address;\n- can be numbered or named;\n- the\
    \ range of valid numbers extends from 1–99 and 1300–1999.\n\n### Extended ACLs:\n\
    \n- filter IP packets based on the source and destination IP addresses, the source\
    \ and destination UDP and TCP ports and the ICMP message types etc.;\n- can be\
    \ numbered or named;\n- valid number ranges include 100–199 and 2000–2699.\n\n\
    To configure standard ACLs, proceed as follows:\n\n| Command | Description |\n\
    |---|---|\n| R1(config)# access-list number [deny\\|permit] source [generic mask]\
    \ | Creates a numbered standard ACL. |\n| R1(config)# ip access-list standard\
    \ name_ACL | Creates a standard named ACL. |\n| R1(config-if)# ip access-group\
    \ [ number \\| name [ in \\| out ] ] | Activates an ACL on an interface. |\n\n\
    To configure extended ACLs, proceed as follows:\n\n| Command | Description |\n\
    |---|---|\n| R1(config)# access-list number { deny \\| permit } protocol source\
    \ [generic mask] destination [generic mask] | Creates a numbered extended ACL.\
    \ |\n| R1(config)# ip access-list extended name_ACL | Create a named extended\
    \ ACL. |\n| R1(config-if)# ip access-group {number\\|name} {in\\|out} | Activates\
    \ an ACL on an interface. |\n\n### 5.5.4. IPv6 ACLs\n\nThe list of IPv6 Access\
    \ Control Lists are similar to IPv4 Access Control Lists, with some specific features\
    \ presented below:\n\n| IPv4 Access Control Lists | IPv6 Access Control Lists\
    \ |\n|---|---|\n| Standard<br>Numbered<br>Named<br>Extended<br>Numbered<br>Named\
    \ | Named only<br>Function as IPv4 extended ACL access control lists. |\n| Use\
    \ a generic mask | No generic mask. |\n| The IP access-group command makes it\
    \ possible to apply an IPv4 access control list to an IPv4 interface | IPv6 uses\
    \ the ipv6 traffic-filter command to perform the same task on IPv6 interfaces.\
    \ |\n| There is an implicit deny any or deny any instruction | permit icmp any\
    \ any nd-na<br>permit icmp any any nd-ns |\n\nTo configure IPv6 ACLs, proceed\
    \ as follows:\n\n| Command | Description |\n|---|---|\n| R1(config)# ipv6 access-list\
    \ name | Creates an IPv6 ACL. |\n| R1(config-ipv6-acl) # {deny\\|permit} protocol\
    \ ipv6-source/CIDR [{eq\\|neq\\|gt\\|lt\\|range} port] ipv6-destination/CIDR [{eq\\\
    |neq\\|gt\\|lt\\|range} port] | Configures an IPv6 ACL. |\n| R1(config)#interface\
    \ type number<br>R1(config-if)#ipv6 traffic-filter name_ACL {in\\|out} | Activates\
    \ an IPv6 ACL on an interface. |\n\n### 5.5.5. ACL recommendation\n\nWhen implementing\
    \ ACLs it is important to consider the following points:\n\n- the instructions\
    \ in an ACL are processed in sequential order, taking into account their order;\n\
    - the most specific instructions must be placed in the first lines in an ACL;\n\
    - by default, new instructions in an existing ACL are added to the last lines;\n\
    - it must be ensured that the last instruction is a refusal of any other unspecified\
    \ traffic;\n- only a single ACL is authorized per interface, per protocol or per\
    \ direction;\n- the packets generated by the routers are not processed by outgoing\
    \ ACLs;\n- standard ACLs must be placed as close to the destination as possible;\n\
    - extended ACLs must be placed as close to the source as possible.\n\nNOTE: You\
    \ can now attempt Exercise 6.\n\n### 5.6. Zone-based firewalls\n\n### 5.6.1. Introduction\n\
    \nA Zone-based Policy Firewall (ZFW) is a firewall solution based on an IOS router.\
    \ This allows a network to be protected against external threats based on the\
    \ separation of the different network types into distinct zones and enables the\
    \ specification of the kind of traffic that may pass from one zone to another.\
    \ One of the chief advantages of this solution includes the simplicity of defining\
    \ access strategies.\n\n### 5.6.2. Types of security zones in a network\n\nIn\
    \ general, there are three kind of security zones that may be applied to an organization's\
    \ network:\n\n- the internal zone: this is the production network in an organization.\
    \ This is a zone whose access must be strictly controlled. Direct, uncontrolled\
    \ access from another zone must not be permitted;\n- the external zone: as a general\
    \ rule, this corresponds to the Internet. This is a non-secured zone which presents\
    \ a constant source of danger to the organization's internal network;\n- the DMZ\
    \ (demilitarized) zone: this is a zone that is used to enable Internet-based access\
    \ to certain servers (web messaging services etc.) while avoiding any direction\
    \ connection with the internal network. This zone presents several security breach\
    \ risks and requires strict access control for the following traffic:\n  - incoming\
    \ traffic from the internet to the hosts in the DMZ zone;\n  - outgoing traffic\
    \ from the hosts in the DMZ zone towards the internet;\n  - incoming traffic from\
    \ the internal network to the hosts in the DMZ zone;\n  - outgoing traffic from\
    \ the hosts in the DMZ zone towards the internal network.\n"
  mdcn: "\n## 使用防火墙\n\n本章将重点介绍以下主题：\n\n- 防火墙的作用；\n- 防火墙的类型：\n  - NAT 防火墙，\n  - 包过滤防火墙，\n\
    \  - 有状态防火墙，\n  - 应用防火墙；\n- 配置防火墙；\n- 不同的防火墙策略；\n- 基于 ACL 的防火墙：\n  - IPv4 ACL，\n\
    \  - IPv6 ACL；\n- 基于区域的防火墙：\n  - 网络中的安全区域类型，\n  - 应用于区域间流量的规则，\n  - 配置 ZFW。\n\n\
    ### 5.1 防火墙简介\n\n防火墙是部署在可靠网络和不可靠网络之间的软件或硬件系统。部署防火墙的主要目的是过滤并阻止不需要的流量跨越防火墙屏障。为此，防火墙必须遵守以下建议：\n\
    \n- 它必须能抵御攻击；\n- 它必须是两个网络之间唯一的中转点；\n- 它必须确保组织的访问控制策略得到应用。\n\n### 5.2 防火墙类型\n\n\
    有不同种类的防火墙。其中包括：\n\n- NAT 防火墙：通过将私有 IP 地址转换为公共 IP 地址来隐藏它；\n- 包过滤防火墙：可以过滤 OSI 模型第\
    \ 3 层或第 4 层的数据包。此类防火墙配置简单，但也容易受到身份盗用攻击；\n- 有状态防火墙：其功能与包过滤防火墙相同，同时跟踪网络连接状态（即 TCP\
    \ 和 UDP 序列号），从而使其更安全；\n- 应用防火墙（代理防火墙）：通常是一台服务器，用于对第 3、4、5 和 7 层中的信息进行此类过滤。\n\n\
    ### 5.3 配置防火墙\n\n配置防火墙的最佳实践包括：\n\n- 将防火墙部署在安全边界以分隔不同的通信域；\n- 仅允许必要服务的流量；\n- 监控防火墙日志；\n\
    - 部署多种防火墙技术以提供全面的多层访问控制；\n- 不要仅依赖单个防火墙来保障安全；\n- 确保对防火墙的物理访问受到监控；\n- 对防火墙配置实施变更管理。\n\
    \n### 5.4 不同的防火墙策略\n\n通常，访问规则使用 ACL 实现。定义访问规则时，可以使用多个条件作为起点：\n\n- 基于服务的规则：这些规则决定入站或出站流量可访问的服务类型。防火墙可根据\
    \ IP 地址和 TCP 端口号过滤流量。\n- 基于方向的规则：这些规则决定对特定服务的请求可发起和授权的方向。\n- 基于行为的规则：这些规则控制特定服务的使用方式。例如，防火墙可过滤电子邮件以消除垃圾邮件。\n\
    \n### 5.5 基于 ACL 的防火墙\n\n### 5.5.1 简介\n\n访问控制列表是一组应用于地址或高层协议的授权或拒绝指令的有序集合。ACL\
    \ 可以控制网络中的入站或出站流量。\n\n### 5.5.2 ACL 的位置\n\nACL 可以在两个方向上应用：\n\n- 入站 ACL：路由器在将数据包发送到输出接口之前处理入站数据包。\n\
    - 出站 ACL：路由器将入站数据包定向到输出接口，然后通过应用出站 ACL 对其进行处理。\n\n### 5.5.3 IPv4 ACL\n\n路由器支持两种类型的\
    \ IPv4 ACL。\n\n标准 ACL：\n\n- 仅根据源 IP 地址过滤 IP 数据包；\n- 可以编号或命名；\n- 有效编号范围为 1–99 和\
    \ 1300–1999。\n\n扩展 ACL：\n\n- 根据源和目的 IP 地址、源和目的 UDP 和 TCP 端口以及 ICMP 消息类型等过滤 IP\
    \ 数据包；\n- 可以编号或命名；\n- 有效编号范围包括 100–199 和 2000–2699。\n\n配置标准 ACL，请按以下步骤操作：\n\n\
    | 命令 | 描述 |\n|---|---|\n| R1(config)# access-list number [deny\\|permit] source\
    \ [generic mask] | 创建编号的标准 ACL。 |\n| R1(config)# ip access-list standard name_ACL\
    \ | 创建命名的标准 ACL。 |\n| R1(config-if)# ip access-group [ number \\| name [ in \\\
    | out ] ] | 在接口上激活 ACL。 |\n\n配置扩展 ACL，请按以下步骤操作：\n\n| 命令 | 描述 |\n|---|---|\n| R1(config)#\
    \ access-list number { deny \\| permit } protocol source [generic mask] destination\
    \ [generic mask] | 创建编号的扩展 ACL。 |\n| R1(config)# ip access-list extended name_ACL\
    \ | 创建命名的扩展 ACL。 |\n| R1(config-if)# ip access-group {number\\|name} {in\\|out}\
    \ | 在接口上激活 ACL。 |\n\n### 5.5.4 IPv6 ACL\n\nIPv6 访问控制列表与 IPv4 访问控制列表类似，以下列出了一些特定功能：\n\
    \n| IPv4 访问控制列表 | IPv6 访问控制列表 |\n|---|---|\n| 标准<br>编号<br>命名<br>扩展<br>编号<br>命名\
    \ | 仅命名<br>作为 IPv4 扩展 ACL 访问控制列表。 |\n| 使用通配符掩码 | 没有通配符掩码。 |\n| IP access-group\
    \ 命令可将 IPv4 访问控制列表应用到 IPv4 接口 | IPv6 使用 ipv6 traffic-filter 命令在 IPv6 接口上执行相同任务。\
    \ |\n| 存在隐式 deny any 或 deny any 指令 | permit icmp any any nd-na<br>permit icmp\
    \ any any nd-ns |\n\n配置 IPv6 ACL，请按以下步骤操作：\n\n| 命令 | 描述 |\n|---|---|\n| R1(config)#\
    \ ipv6 access-list name | 创建 IPv6 ACL。 |\n| R1(config-ipv6-acl) # {deny\\|permit}\
    \ protocol ipv6-source/CIDR [{eq\\|neq\\|gt\\|lt\\|range} port] ipv6-destination/CIDR\
    \ [{eq\\|neq\\|gt\\|lt\\|range} port] | 配置 IPv6 ACL。 |\n| R1(config)#interface\
    \ type number<br>R1(config-if)#ipv6 traffic-filter name_ACL {in\\|out} | 在接口上激活\
    \ IPv6 ACL。 |\n\n### 5.5.5 ACL 建议\n\n实施 ACL 时，需要考虑以下要点：\n\n- ACL 中的指令按顺序处理，同时考虑其顺序；\n\
    - 最具体的指令必须放在 ACL 的前几行；\n- 默认情况下，现有 ACL 中的新指令将添加到最后几行；\n- 必须确保最后一条指令是拒绝任何其他未指定的流量；\n\
    - 每个接口、每个协议或每个方向仅授权一个 ACL；\n- 路由器生成的数据包不由出站 ACL 处理；\n- 标准 ACL 必须放置在尽可能靠近目的地的位置；\n\
    - 扩展 ACL 必须放置在尽可能靠近源的位置。\n\n注意：现在可以尝试练习 6。\n\n### 5.6 基于区域的防火墙\n\n### 5.6.1 简介\n\
    \n基于策略的区域防火墙（ZFW）是基于 IOS 路由器的防火墙解决方案。这允许将不同类型的网络分隔到不同区域，从而保护网络免受外部威胁，并能够指定哪些流量可以从一个区域传递到另一个区域。该解决方案的主要优势之一是定义访问策略的简单性。\n\
    \n### 5.6.2 网络中的安全区域类型\n\n通常，组织网络中可应用三种安全区域：\n\n- 内部区域：这是组织的生产网络。这是一个访问必须严格控制的区域。不得允许来自其他区域的直接、不受控制的访问；\n\
    - 外部区域：通常情况下，这对应于 Internet。这是一个不安全的区域，对组织的内部网络构成持续威胁；\n- DMZ（非军事化）区域：这是一个用于实现对某些服务器（Web\
    \ 消息传递服务等）的基于 Internet 的访问，同时避免与内部网络任何直接连接的区域。此区域存在多种安全漏洞风险，并要求对以下流量实施严格访问控制：\n\
    \  - 来自 Internet 到 DMZ 区域主机的入站流量；\n  - 来自 DMZ 区域主机到 Internet 的出站流量；\n  - 来自内部网络到\
