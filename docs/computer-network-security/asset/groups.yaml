  mdcn: "\n- 隧道模式：\n  - 原始 IP 数据包的完整性受到保护；\n  - IPSec 封装原始数据包，对其加密，添加新的 IP 头，然后将其发送到\
    \ VPN 隧道另一端；\n  - 隧道模式最常用于 IPsec 网关之间（Cisco 路由器或 ASA 防火墙）。\n\n## 9.2. IKE 协议\n\
    \n### 9.2.1. 简介\n\nInternet 密钥交换 (IKE) 是一种用于动态协商与 IPSec 通信相关的安全设置的协议。必须注意的是，IPsec\
    \ 实现也可以支持对这类设置交换的手动管理。但是，IKE 协议被认为更快且更安全。\n\nIKE 有两个版本可用。版本 v2 提供多项优势，包括（但不限于）修复\
    \ IKEv1 中的漏洞以及优化带宽使用。\n\n### 9.2.2. IKE 组件\n\nIKE 是三种协议的组合，即：ISAKMP、SKEME 和 Oakley。这些协议被组合在一起以确保协商和建立安全通信。\n\
    \n- ISAKMP：使能够协商 IPsec 通信两端之间的安全关联（SA）。\n- Oakley：使用 Diffie-Hellman 算法在 IPsec\
    \ 连接双方之间进行密钥交换。\n- SKEME：定义确保匿名性和不可否认性的密钥交换技术。\n\n### 9.2.3. IKE 阶段\n\nIKE 协议在两个主要阶段运行，以在两个\
    \ IPsec 点之间创建安全通信通道。第一阶段用于协商隧道安全设置，而第二阶段确保数据的安全传输。\n\n### 9.2.3.1. IKE 第 1 阶段\n\
    \n第 1 阶段的特征可总结如下：\n\n- 目标是建立一个 ISAKMP SA（或 IKE SA）。IKE 协商通信的安全选项，例如加密算法、哈希函数、身份验证方法和\
    \ Diffie-Hellman；\n- SA 协商是双向的；\n- 此阶段生成三个密钥。两个密钥用于保护 ISAKMP SA 消息，第三个密钥用于生成另外两个用于保护\
    \ IPsec 交换的密钥；\n- 为证明其身份，发送方发送与身份及所有先前消息相关联的密钥的哈希值。身份密钥要么是共享密钥，要么是一对私钥/公钥；\n-\
    \ 生成多个密钥这一事实保证了数据机密性。即使将来共享密钥已知（或所使用的公钥被攻破），数据也始终会受到保护，因为它是由会话密钥加密的。会话密钥是身份密钥与随机（nonce）值以及其他几个难以预测的值的组合；\n\
    - 此阶段可以在两种模式下建立：\n  - 主模式；由六条消息组成。它通过加密最后两条消息来保证双方的匿名性；\n  - 激进模式：仅由三条消息组成。因此，它更快，但不提供主模式的优势。\n\
    \n### 9.2.3.2. IKE 第 2 阶段\n\n第 2 阶段的特征可总结如下：\n\n- 目标是建立一个 IPsec SA；\n- SA 协商是\
    \ *单向的*。\n\n此阶段定义的唯一模式是 *快速模式*。\n\n### 9.2.3.3. 两个 IKE 版本之间的差异\n\n版本 1 和 2 之间的主要差异包括：\n\
    \n- 消息交换简化：\n  - IKEv1 交换九条消息（第 1 阶段 = 6，第 2 阶段 = 3）；\n  - IKEv2 交换六条消息（第 1 阶段\
    \ = 4，第 2 阶段 = 2）；\n- 安全性：\n  - IKEv1 易受拒绝服务 (DoS) 攻击；\n  - IKEv2 受到 DoS 攻击防护。仅在申请者经过身份识别后才处理请求。\n\
    \n## 9.3. 站点到站点 VPN 配置\n\n### 9.3.1. 简介\n\n站点到站点 VPN 连接两个远程局域网，以便安全地通过 *互联网* 共享资源。它以内部主机透明的方式设置在\
    \ VPN 连接的两侧之间。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_193_0.png)\n\n**图 9.3.\
    \ 站点到站点 VPN**\n\n### 9.3.2. IPsec VPN 配置\n\n### 要遵循的步骤\n\n要使用 CLI 命令配置站点到站点 VPN，请执行以下步骤：\n\
    \n- 1) 通过创建扩展 ACL 识别“感兴趣流量”；\n- 2) 创建 IKE 策略并配置第 1 阶段所需的设置；\n- 3) 指定 PSK 共享密钥并识别\
    \ VPN 隧道另一端的 IP 地址；\n- 4) 创建第 2 阶段所需的 IPsec 策略；\n- 5) 创建加密映射并配置加密映射的具体内容；\n- 6)\
    \ 将加密映射应用到接口；\n- 7) 验证 VPN 隧道设置。\n\n注意：此顺序对所有步骤并非必需。\n\n### 配置示例\n\n考虑以下网络拓扑：\n\
    \n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_194_0.png)\n\n要在两个站点之间配置 VPN 链路，请按以下步骤操作：\n\
    \n- 1) 创建 ACL 以识别感兴趣的流量。\n\n| 命令 | 说明 |\n|---|---|\n| R1(config)# ip access-list\
    \ extended VPN-ACL | 创建扩展 ACL。 |\n| R1(config-ext-nacl)# permit ip 192.168.1.0\
    \ 0.0.0.255 192.168.2.0 0.0.0.255 | 识别“感兴趣流量”。 |\n\n- 2) 创建 IKE 策略并配置第 1 阶段所需的设置。\n\
    \n| 命令 | 说明 |\n|---|---|\n| R1(config)# crypto isakmp policy 10 | 创建 IKE 策略。 |\n\
    | R1(config-isakmp)# authentication pre-share | 定义身份验证方法。 |\n| R1(config-isakmp)#\
    \ encr aes 128 | 定义加密协议。 |\n| R1(config-isakmp)# hash sha | 定义哈希函数。 |\n| R1(config-isakmp)#\
    \ group 5 | 定义要使用的 DH 组。 |\n| R1(config-isakmp)# lifetime 86400 | 定义 IKE 超时。 |\n\
    \n- 3) 指定共享密钥 (PSK) 并识别 VPN 隧道另一端的 IP 地址。\n\n| 命令 | 说明 |\n|---|---|\n| R1(config)#\
    \ crypto isakmp key PassVPN address 44.113.202.129 | 定义共享密钥和 VPN 隧道另一端的 IP 地址。\
    \ |\n\n- 4) 创建第 2 阶段所需的 IPsec 策略。\n\n| 命令 | 说明 |\n|---|---|\n| R1(config)# crypto\
    \ ipsec transform-set R1-to-R2-SET esp-sha-hmac esp-aes 128 | 定义第 2 阶段的通信设置。 |\n\
    \n- 5) 创建加密映射并配置加密映射的参数。\n\n| 命令 | 说明 |\n|---|---|\n| R1(config)# crypto map R1-to-R2-MAP\
    \ 10 ipsec-isakmp | 创建与 IKE 策略编号 10 连接的加密映射。 |\n| R1(config-crypto-map)# set transform-set\
    \ R1-to-R2-SET | 定义第 2 阶段所需的 IPsec 策略标识符。 |\n| R1(config-crypto-map)# set peer\
    \ 44.113.202.129 | 设置 VPN 隧道另一端的 IP 地址。 |\n| R1(config-crypto-map)# match address\
