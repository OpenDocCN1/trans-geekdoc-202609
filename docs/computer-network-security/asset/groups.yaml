    | FTP_server | NIC | 192.168.1.2 | /24 | 192.168.1.1 |\n| Server-HTTP | NIC |\
    \ 192.168.1.3 | /24 | 192.168.1.1 |\n| Server-HTTP2 | NIC | 192.168.10.2 | /24\
