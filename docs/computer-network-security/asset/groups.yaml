    \  - signature-based detection,\n  - strategy-based detection,\n  - anomaly-based\
    \ detection,\n  - reputation-based detection;\n- severity levels of signatures;\n\
    - monitoring and management of alarms and alerts;\n- the list of actions to take\
    \ during an attack;\n- the configuration of the IOS IPS.\n\n### 6.1. Introduction\
    \ to a detector\n\nA detector is a network device that analyzes network traffic\
    \ in order to classify it as normal or malicious, based on predefined rules.\n\
    \nAn Intrusion Detection System (IDS) is a detector that can analyze packets travelling\
    \ over one or more network connections in order to detect suspicious activity.\
    \ Its role is limited to alerting the system administrator to the trace of any\
    \ abnormal activity on a host or on the network. It does not prevent intrusion\
    \ attempts.\n\nAn Intrusion Prevention System (IPS) is a detector that can detect\
    \ and prevent any potential attack on a host or on the network.\n\n### 6.2. The\
    \ differences between an IDS and an IPS\n\nThe following table presents some characteristics\
    \ of the two detectors: IPS and IDS.\n\n| | IDS | IPS |\n|---|---|---|\n| Processing\
    \ packets | Receives only one copy of the original packets for processing. | All\
    \ packets are processed by the system before reaching the network or host. |\n\
    | Impact on latency | There is no delay in the original traffic. | There is a\
    \ slight delay before the traffic is sent on to the network. |\n| Impact caused\
    \ if the system is out of service | No negative impact. | All traffic passing\
    \ through the system may be negatively affected. |\n| Ability to protect the network\
    \ | No protection against malicious traffic. | An IPS can protect traffic based\
    \ on a set of pre-established rules. |\n\nNOTE.— Section 6.3 will focus on IPS\
    \ detectors.\n\n### 6.3. Types of IPS\n\nDepending on where they are positioned\
    \ in a network, the IPS may be placed to protect a host (Host-IPS or HIPS) or\
    \ the entire network (Network-IPS or NIPS). Each type presents advantages and\
    \ disadvantages.\n\n| | Advantages | Disadvantages |\n|---|---|---|\n| Host-IPS\
    \ | Can protect a specific host. Can protect the Operating System and applications.\
    \ | Depends on an Operating System. Must be installed on all hosts. |\n| Network-IPS\
    \ | A less expensive solution. Independent of the Operating System. | Impossible\
    \ to examine encrypted traffic. |\n\n### 6.4. Cisco IP solutions\n\nThe IPS solutions\
    \ offered by Cisco are designed so that they can be adapted to different environments\
    \ and offer high availability and efficiency.\n\nDeployment options include dedicated\
    \ equipment, IPS modules for switches and routers, and software-based solutions.\n\
    \n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_118_0.png)\n\nFigure 6.1. The AIP-SSM\
    \ module (a modular IPS) that can be integrated into a router1. For a color version\
    \ of this figure, see www.iste.co.uk/sadiqui/computer.zip\n\n### 6.5. Modes of\
    \ deploying IPS\n\nAn IPS may be deployed in two modes:\n\n- promiscuous mode:\
    \ the IPS is limited to analyzing network traffic and reporting anomalies (i.e.\
    \ the IPS plays the role of an IDS);\n- inline mode: the traffic is directed towards\
    \ the IPS in order to be analyzed. The IPS blocks part of this traffic based on\
    \ pre-configured parameters.\n\n1 Cisco Networking Academy, the official Cisco\
    \ training site, can be found at the following address: https://www.netacad.com.\n\
    \n### 6.6. Types of alarms\n\nAttacks on a network may generate four types of\
    \ alarms, coded as follows:\n\n| True positive | An alarm triggered by an intrusion\
    \ that occurred and was detected by the IPS. |\n|---|---|\n| True negative | No\
    \ intrusion took place and no action was taken by the IPS. |\n| False positive\
    \ | An alarm is triggered by normal traffic or an insignificant action. |\n| False\
    \ negative | No alarm was triggered when an intrusion took place. |\n\nAn administrator\
    \ is required to ensure that the “false positive” alarms are adjusted and that\
    \ the “false negative” alarms are corrected.\n\nNOTE.— You can now attempt Exercise\
    \ 8.\n\n### 6.7. Detecting malicious traffic\n\n### 6.7.1. Modes of detection\n\
    \nAn IPS may detect malicious traffic using several methods, including signature-based\
    \ detection, strategy-based detection, anomaly-based detection and reputation-based\
    \ detection.\n\n### 6.7.2. Signature-based detection\n\n### 6.7.2.1. Definition\
    \ of a signature\n\nA signature is a set of rules configured on an intrusion prevention\
    \ system that allows it to detect intrusions. Cisco has grouped together signatures\
    \ with similar characteristics into categories for easy management and analysis.\n\
    \n### 6.7.2.2. Types of signatures\n\nThere are two types of signatures:\n\n-\
    \ atomic: an attempt has been made to access a specific port on a specific host\
    \ and the malicious content is in a single packet;\n- composite: a sequence of\
    \ operations distributed over multiple hosts over an arbitrary period.\n\n###\
    \ 6.7.2.3. Characteristics of this detection mode\n\nIn general, signature-based\
    \ detection is the most commonly used method to identify malicious software in\
    \ the Cisco intrusion-prevention/detection systems.\n\nAdvantages:\n\n- easy to\
    \ configure and implement;\n- by default, an IPS has several pre-installed signatures;\n\
    - other, additional signatures, can be downloaded and implemented to mitigate\
    \ new types of attacks.\n\nDisadvantages:\n\n- does not detect attacks that fall\
    \ outside the predefined rules.\n- may generate “false positive” alarms;\n- signatures\
    \ must be periodically updated.\n\n### 6.7.3. Other modes of detecting malicious\
    \ traffic\n\n### 6.7.3.1. Strategy-based detection\n\nStrategies are created and\
    \ configured onto the IPS based on the network security policy. Any traffic that\
    \ is detected as being outside this policy will generate an alarm and/or be blocked.\n\
    \nAdvantages:\n\n- simple, reliable and highly customizable;\n- only allows traffic\
    \ based on the network security policy, which may prevent unknown attacks.\n\n\
    Disadvantages:\n\n- the strategy must be manually created;\n- difficult to apply\
    \ in the case of large networks.\n\n### 6.7.3.2. Anomaly-based detection\n\nThe\
    \ IPS generally looks for network traffic that deviates from the norm. A statistical\
    \ reference must be developed to define the normal behavior of network traffic.\n\
    \nAdvantage: can detect new types of attacks.\n\nDisadvantages:\n\n- difficult\
    \ to accurately standardize the traffic on extremely large networks;\n- may cause\
    \ “false positive” alarms if valid network traffic changes significantly.\n\n\
    ### 6.7.3.3. Reputation-based detection\n\nCisco Global Correlation is a feature\
    \ that allows Cisco IPS detectors to filter network traffic using the “reputation”\
    \ of the source IP address of a packet.\n\nThe reputation of an IP address, among\
    \ other elements, is computed by the “Cisco SensorBase” service, specialized in\
    \ this domain, based on this IP address’ previous actions. This information is\
    \ gathered from the flows of over 1.5 million Cisco IPS detectors and firewalls,\
    \ among other devices, deployed worldwide. This feature supplies the network with\
    \ valuable information that helps in detecting, preventing and reacting to recently–detected\
    \ threats.\n\nAdvantages:\n\n- makes use of the experience of other existing security\
    \ systems;\n- considered to be an early-warning system.\n\nDisadvantage: requires\
    \ continuous updates.\n\n### 6.8. Signature micro-engines\n\nA signature micro-engine\
    \ is a component in an IPS (or IDS) detector that supports a particular category\
    \ of signatures. All signatures from a signature micro-engine are scanned in parallel,\
    \ which increases the efficiency and fluidity of the data.\n"
  mdcn: "\n\n## 构建入侵防御系统（IPS）\n\n本章将重点介绍以下主题：\n- 探测器的作用；\n- IDS 与 IPS 的区别；\n- IPS\
    \ 的类型：\n  - 基于主机的 IPS，\n  - 基于网络的 IPS；\n- 使用 IPS 的模式：\n  - 混杂模式，\n  - 内联模式；\n\
    - 警报的类型；\n- 检测恶意流量的模式：\n  - 基于签名的检测，\n  - 基于策略的检测，\n  - 基于异常的检测，\n  - 基于声誉的检测；\n\
    - 签名的严重级别；\n- 警报和警示的监控与管理；\n- 攻击期间应采取的行动列表；\n- IOS IPS 的配置。\n\n### 6.1. 探测器简介\n\
    \n探测器是一种网络设备，它根据预定义规则分析网络流量，以将其归类为正常流量或恶意流量。\n\n入侵检测系统（IDS）是一种探测器，可分析通过一个或多个网络连接传输的数据包，以检测可疑活动。其作用仅限于向系统管理员发出关于主机或网络上任何异常活动痕迹的警报。它不防止入侵尝试。\n\
    \n入侵防御系统（IPS）是一种探测器，可以检测并防止针对主机或网络的任何潜在攻击。\n\n### 6.2. IDS 与 IPS 的区别\n\n下表列出了两种探测器（IPS\
    \ 和 IDS）的一些特性：\n\n| | IDS | IPS |\n|---|---|---|\n| 处理数据包 | 仅接收原始数据包的一个副本进行处理。\
    \ | 在数据包到达网络或主机之前，系统会处理所有数据包。 |\n| 对延迟的影响 | 原始流量无延迟。 | 流量发送到网络之前会有轻微延迟。 |\n| 系统停止服务时造成的影响\
    \ | 无负面影响。 | 通过系统的所有流量可能会受到负面影响。 |\n| 保护网络的能力 | 对恶意流量无保护。 | IPS 可以根据一套预先建立的规则保护流量。\
    \ |\n\n注释。——第 6.3 节将重点介绍 IPS 探测器。\n\n### 6.3. IPS 的类型\n\n根据 IPS 在网络中的部署位置，它可以部署在主机（Host-IPS\
    \ 或 HIPS）或整个网络（Network-IPS 或 NIPS）以进行保护。每种类型都有其优缺点。\n\n| | 优点 | 缺点 |\n|---|---|---|\n\
    | Host-IPS | 可以保护特定主机。可以保护操作系统和应用程序。 | 依赖于操作系统。必须在所有主机上安装。 |\n| Network-IPS |\
    \ 更经济的解决方案。独立于操作系统。 | 无法检查加密流量。 |\n\n### 6.4. Cisco IP 解决方案\n\nCisco 提供的 IPS 解决方案设计旨在适应不同环境，并提供高可用性和高效率。\n\
    \n部署选项包括专用设备、交换机和路由器的 IPS 模块以及基于软件的解决方案。\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_118_0.png)\n\
    \n图 6.1. 可集成到路由器1中的 AIP-SSM 模块（一种模块化 IPS）。有关此图的彩色版本，请参阅 www.iste.co.uk/sadiqui/computer.zip\n\
    \n### 6.5. 部署 IPS 的模式\n\nIPS 可以部署在两种模式下：\n\n- 混杂模式：IPS 仅限于分析网络流量并报告异常（即 IPS 扮演\
    \ IDS 的角色）；\n- 内联模式：流量被定向到 IPS 进行分析。IPS 根据预配置的参数阻止部分流量。\n\n¹ Cisco Networking\
    \ Academy（Cisco 官方培训网站）可在以下网址找到：https://www.netacad.com。\n\n### 6.6. 警报的类型\n\n\
    网络攻击可能会生成四种类型的警报，编码如下：\n\n| 真正例 | 由已发生且被 IPS 检测到的入侵触发的警报。 |\n|---|---|\n| 真负例\
    \ | 未发生入侵，且 IPS 未采取任何操作。 |\n| 假正例 | 正常流量或无关紧要的操作触发了警报。 |\n| 假负例 | 发生入侵时未触发任何警报。\
    \ |\n\n管理员需要确保对“假正例”警报进行调整，并对“假负例”警报进行更正。\n\n注释。——现在你可以尝试练习 8。\n\n### 6.7. 检测恶意流量\n\
    \n### 6.7.1. 检测模式\n\nIPS 可以使用多种方法检测恶意流量，包括基于签名的检测、基于策略的检测、基于异常的检测和基于声誉的检测。\n\n\
    ### 6.7.2. 基于签名的检测\n\n### 6.7.2.1. 签名定义\n\n签名是配置在入侵防御系统上的一组规则，用于检测入侵。Cisco 已将具有相似特征的签名分组到各个类别中，以便于管理和分析。\n\
    \n### 6.7.2.2. 签名的类型\n\n存在两种类型的签名：\n\n- 原子：尝试访问特定主机上的特定端口，且恶意内容包含在单个数据包中；\n- 复合：在任意一段时间内分布在多个主机上的一系列操作。\n\
    \n### 6.7.2.3. 此检测模式的特性\n\n通常，基于签名的检测是 Cisco 入侵防御/检测系统中识别恶意软件最常用的方法。\n\n优点：\n\n\
    - 易于配置和实现；\n- 默认情况下，IPS 包含多个预安装的签名；\n- 可以下载并实施其他附加签名，以缓解新类型的攻击。\n\n缺点：\n\n- 不检测超出预定义规则范围的攻击。\n\
    - 可能会生成“假正例”警报；\n- 签名必须定期更新。\n\n### 6.7.3. 检测恶意流量的其他模式\n\n### 6.7.3.1. 基于策略的检测\n\
    \n根据网络安全策略在 IPS 上创建和配置策略。检测到的超出此策略的任何流量都将生成警报和/或被阻止。\n\n优点：\n\n- 简单、可靠且高度可定制；\n\
    - 仅允许基于网络安全策略的流量，这可能防止未知攻击。\n\n缺点：\n\n- 策略必须手动创建；\n- 在大型网络中难以应用。\n\n### 6.7.3.2.\
    \ 基于异常的检测\n\nIPS 通常会查找偏离常态的网络流量。必须开发统计参考来定义网络流量的正常行为。\n\n优点：可以检测新类型的攻击。\n\n缺点：\n\
    \n- 在极大型网络上难以准确标准化流量；\n- 如果有效网络流量发生显著变化，可能会引起“假正例”警报。\n\n### 6.7.3.3. 基于声誉的检测\n\
    \nCisco 全局关联是一项功能，允许 Cisco IPS 探测器使用数据包源 IP 地址的“声誉”来过滤网络流量。\n\nIP 地址的声誉（以及其他因素）由“Cisco\
    \ SensorBase”服务根据该 IP 地址的先前行为进行计算，该服务专门从事此领域。这些信息从全球部署的超过 150 万台 Cisco IPS 探测器和防火墙等设备的流量中收集。此功能为网络提供有价值的信息，有助于检测、防止和应对最近发现的威胁。\n\
    \n优点：\n\n- 利用其他现有安全系统的经验；\n- 被视为早期预警系统。\n\n缺点：需要持续更新。\n\n### 6.8. 签名微引擎\n\n签名微引擎是\
    \ IPS（或 IDS）探测器中支持特定签名类别的组件。来自签名微引擎的所有签名均并行扫描，这提高了数据的效率和流畅性。\n\n"
