    \ | Windows 7 或更高版本 | 192.168.0.1 |\n\n### 目标\n\n- 保护密码。\n- 设置连接限制。\n- 通过管理“视图”和“超级视图”来保护访问。\n\
    - 保护配置文件和 IOS 系统。\n- 使用自动化安全功能。\n\n### 使用的软件\n\n- GNS3。\n\n### Part A: 建立基本设备配置\n\
