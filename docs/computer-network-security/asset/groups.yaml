  - '[PAGE 158]


    This chapter will focus on the following topics:


    +   – basic concepts in cryptography;

    +   – different classifications in cryptography:

    +     - traditional cryptography,

    +     - modern cryptography,

    +     - symmetric and asymmetric encryption;

    +   – key management:

    +     - Diffie-Hellman key exchange;

    +   – hash functions;

    +   – HMAC codes;

    +   – asymmetric cryptography:

    +     - numerical signatures,

    +     - public key infrastructure.


    # 8.1. Basic concepts in cryptography


    # 8.1.1. Definition


    Cryptography is a computer science discipline that makes it possible to protect
    messages that are judged to be confidential. If the message is intercepted by
    an unauthorized person, it should be incomprehensible and difficult to decipher.'
  - '[PAGE 159]


    The four objectives of cryptography are:


    +   - authentication: verifying the identity of the source and destination before
    beginning transmission;

    +   - integrity: ensuring that the data transmitted has not been modified during
    the transmission;

    +   - confidentiality: ensuring that only authorized persons can consult the data;

    +   - non-repudiation: ensuring that a message transmitted between two people
    cannot be questioned by one of the two parties.


    # 8.1.2. Terminology


    +   - Plain text: denotes all data that we wish to transmit before modification.
    Plain text may include text, images, videos, audio etc.

    +   - Encryption: transforms plain text into incomprehensible data.

    +   - Encrypted text: refers to text obtained after applying the encryption algorithm
    on the plain-text, also cryptogram.

    +   - Decryption: refers to the recovery of plain text from encrypted text.

    +   - Encrypt: denotes a sequence of operations to encrypt and decrypt the data.

    +   - Key: refers to a parameter that allows the encryption and decryption of
    the data.

    +   - Cryptanalysis: refers to all the techniques and methods used to try to recover
    the plaintext from the encrypted text.


    # 8.2. The different classifications of cryptology


    Cryptography is an ancient technique that is used, in particular, to ensure the
    confidentiality of text messages deemed critical. With the advent of computers
    nowadays, the field of cryptography has developed enough to allow the encryption
    of any type of data, in addition to providing encryption algorithms that are difficult
    to break.


    Figure 8.1 presents the main features of the different classifications of cryptology.'
  - '[PAGE 160]


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_160_0.png)


    Figure 8.1. The different classifications in cryptology


    # ## 8.2.1. Traditional cryptography


    The encryption methods commonly used by this cryptography include:


    # ### 8.2.1.1. Substitution encryption


    There are two kinds of substitution encryption:


    — mono-alphabetic substitution: this consists of replacing a character by only
    one other character to avoid ambiguity during decryption. The oldest and best-known
    encryption methods in this category we find:


    +   - the Caesar cipher: based on a simple shifting of letters;


    +   - the Atbash cipher: based on writing the alphabet in reverse.


    NOTE.— To make this method harder to decipher, it is possible to choose only certain
    letters to be replaced. The exact substitution method can be called an encryption
    key.


    — the polyalphabetic substitution consists of replacing one character with another,
    which is chosen dynamically, determined by the encryption key, instead of being
    chosen in a fixed manner.


    Example: let us encrypt the word “ABCABD” using the key “123” which indicates
    that the first character will be shifted by one space, the second by two and the
    third by three spaces and so on. This will give the following result: “BDFBDG”.'
  - '[PAGE 161]


    # 8.2.1.2. Transposition encryption


    Among other things, this method uses the rearrangement of the order of letters
    following well-defined rules.


    Example: let us encrypt the text “ISTA BAB TZIMI” using the key “7514263”, using
    transposition encryption.


    In order to do this, we create the following table:


    +   – the first line consists of the key values;


    +   – we then fill the table by filling in the letters of the message to encrypt.
    The last line may remain incomplete.


    Result:


    | 7 | 5 | 1 | 4 | 2 | 6 | 3 |

    |---|---|---|---|---|---|---|

    | I | S | T | A | B | A | B |

    | T | I | Z | I | M | I | |


    The result is the concatenation of characters following the order of the columns
    from 1 to 7: TZBM BAIS IAII T.


    NOTE.— In some cases the encryption case may be defined as a series of characters.
    In this case, each character will be associated with a numerical value and the
    previous procedure will then be applied.


    # 8.2.2. Modern cryptography


    # 8.2.2.1. Block cipher


    A block cipher XE consists of dividing data into chunks, whose size is generally
    fixed (between 32 and 512 bits), and which are then encrypted one after another.
    The general principle underlying a block cipher can be summarized as follows:


    +   1) replacing the characters using a binary code;


    +   2) dividing this chain into blocks of a given length.


    +   3) encrypting a block bit by bit based on a key;


    +   4) repeat Step 3 as many times as needed;


    +   5) move on to the next block.'
  - "[PAGE 162]\n\n+   A non-exhaustive list of block cipher algorithms includes:\n\
    +   \n+   - Digital Encryption Standard (DES);\n+   - Advanced Encryption Standard\
    \ (AES);\n+   - Triple Digital Encryption Standard (3DES);\n+   - Blowfish;\n\
    +   - International Data Encryption Algorithm (IDEA).\n\n# 8.2.2.2. Stream cipher\n\
    \nA stream cipher consists of continuously acting on the data without needing\
    \ to gather a block of data to start the operation. This type of encryption is\
    \ often used for real-time communication as it has the property of being faster.\
    \ A non-exhaustive list of block ciphers includes the RC4 and SEAL standards.\n\
    \n# 8.2.3. Symmetric and asymmetric encryption\n\n# 8.2.3.1. Symmetric encryption\n\
    \n+   - In symmetric encryption, the same key is used for encryption and decryption,\
    \ resulting in the need to keep the key confidential.\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_162_0.png)\n\
    \n+   - A non-exhaustive list of symmetric encryption algorithms includes:\n+\
    \   - DES;\n+   - 3DES;"
  - '[PAGE 163]


    +   - AES;

    +   - IDEA;

    +   - RC2, RC4, RC5, RC6;

    +   - Blowfish.


    — Symmetric encryption algorithms are most commonly used for data protection as
    they offer a quick processing-time and a reasonably high level of security in
    the presence of a large key. However, its vulnerability lies in the method used
    to exchange the shared key.


    # 8.2.3.2. Asymmetric encryption


    — In asymmetric encryption (or public key encryption) a different key is used
    for the encryption and decryption of data and it is impossible to generate one
    from the other.


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_163_0.png)


    Figure 8.3. Asymmetric encryption


    Asymmetric encryption algorithms include:


    +   — RSA: named for the initials of its creators: Rivest, Shamir and Adleman;

    +   — DH: DH (Diffie-Hellman) is an asymmetric encryption algorithm that enables
    two hosts to exchange shared, secret keys over an unreliable network. This protocol
    is often combined with symmetric algorithms such as 3DES and AES;

    +   — DSA: the digital signature algorithm developed by the National Security
    Agency of the United States.'
  - '[PAGE 164]


    - Asymmetric algorithms are slower compared to symmetric algorithms. They are
    typically used in cases of low-volume encryption, such as digital signatures and
    key exchange.


    NOTE.— A more detailed account of asymmetric encryption is provided later in this
    chapter (see section 8.6).


    # 8.3. Key management


    # 8.3.1. Introduction


    The objectives of cryptography rely to a great extent on the protection of encryption
    keys. It is very important to put in place an efficient and reliable management
    for securely storing and distributing encryption keys. This management is vital
    for the success of any encryption project.


    There are two approaches to key management to help address this problem:


    +   - manual management: consists of manually configuring, on each device, all
    the parameters of a secured link including encryption keys. This approach has
    proven to be relatively practical in a static and small environment. However,
    it is not appropriate for a large network;


    +   - automatic management: this consists of using a protocol (e.g. ISAKMP) to
    dynamically configure all parameters of a secured link.


    # 8.3.2. Diffie-Hellman key exchange


    Diffie-Hellman (DH) is a method that allows two network elements to put in place
    a system by which they can exchange their secret keys in a protected manner. This
    method makes it possible to create a new, common secret key based on the two initial
    secret keys, without using a secure channel to exchange them.


    # Functioning


    | Step | U1 | U2 |

    | :--- | :--- | :--- |

    | 1 | The two users choose together:

    - a prime number _p_;

    - an integer _g_, such that 1 ≤ g ≤ p–1.

    Note: this exchange does not need to be secure. | |'
