    39345: May 22 13:56:35.811: %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial0/0/1,
    changed state to down

    ```


    +   - Seq num: 39345;

    +   - Timestamp: May 22 13:56:35.811;

    +   - FACILITY: LINEPROTO;

    +   - SEVERITY level: 5 (notification);

    +   - MNEMONIC: UPDOWN;

    +   - message text: Line protocol on Interface Serial0/0/1, changed state to down.


    # 3.3.3. Configuring a Syslog client


    To configure a router as a Syslog client, proceed as follows:


    | Command | Description |

    |---|---|

    | Router(config)# service timestamps log datetime msec | Activates the timestamps
    on the debug and log messages. |

    | Router(config)# logging host [ ip-address | hostname ] | Identifies the address
    of the Syslog server or its host name. |

    | Router(config)# logging trap level | Limits the messages sent to the Syslog
    function depending on the desired severity. The default value is 6 (0 to 6). |

    | Router(config)# logging on | Activates the despatch of messages to be logged.
    The default value is “on”. |

    | Router# show logging | Displays the logging status. |


    # 3.4. Implementing the Simple Network Management Protocol (SNMP)


    # 3.4.1. Introducing the SNMP


    – The Simple Network Management Protocol (SNMP) allows you to monitor, diagnose,
    and manage network equipment remotely.


    – SNMP’s objectives can be summarized as follows:


    +   – monitoring the performance of the network and knowing the overall state
    of the devices (active, inactive, partially operational, operational, network
    gridlocked etc.);'
  - '[PAGE 62]


    +   - detecting problems on the network and managing exceptional events (loss
    of a network link, an equipment suddenly ceasing to function etc.);

    +   - configure equipment.


    – The SNMP works on the application layer of the OSI model and uses the UDP protocol
    on port 162.


    – Many software packages use SNMP to produce graphs that depict the evolution
    of network traffic or computer systems (Centreon, NetCrunch 5, MRTG, etc.).


    # 3.4.2. How SNMP works


    # 3.4.2.1. The components of an SNMP system


    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_62_0.png)


    Figure 3.3. The components of an SNMP system


    An SNMP system is made up of three components:


    +   – the SNMP manager: this is a host that executes the SNMP management software.
    In most cases, this is a computer that is used to monitor the network;


    +   – the SNMP agent: this is a software that runs on a network device (router,
    switch, server etc.) allowing it to be monitored;


    +   – the Management Information Base (MIB): This is a set of object collections
    managed by the SNMP agent. Each of these collections contains a certain number
    of variables that may be consulted or modified by the SNMP manager.'
