    \ host target\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_144_0.png)\n\n### Figure\
    \ 7.3. The steps in a double-tagging attack\n\n— In figures 7.1, 7.2 and 7.3,\
    \ the “data” field represents the information connected to an Ethernet frame,\
    \ in addition to the other information from the packet and without taking into\
    \ account the order of their succession in a 802.1Q frame.\n\n— This type of attack\
    \ is unidirectional and only works if the hacker is connected to a port in the\
    \ same VLAN as the native trunk port VLAN.\n\n### Countermeasures\n\nThe “native\
    \ VLAN” feature is used to prevent this kind of attack.\n\n| Command | Description\
    \ |\n|---|---|\n| Switch(config-if)# switchport trunk native vlan vlan | Create\
    \ a dedicated VLAN for native VLAN traffic separated from user traffic. |\n\n\
    ### 7.2.5. STP-based attacks\n\n### Overview of the STP\n\nSTP is a network protocol\
    \ that makes it possible to create a loopless network topology by blocking certain\
    \ paths in the LAN, consisting of multiple switches. Its function can be summarized\
    \ as follows:\n\n- selecting a “root bridge” switch for each VLAN;\n- defining\
    \ “root ports” that allow interconnection between the “root” switch and other\
    \ switches;\n- defining ports authorized to transmit data;\n- blocking certain\
    \ ports on the switches.\n\n### Overview of the attack\n\nThis attack consists\
    \ of introducing a “spoofed switch”, which will attempt to position itself as\
    \ the “root bridge” by sending false “PDU” messages that contain a minimal “BID”.\
    \ This will have the effect of modifying the STP topology and changing the role\
    \ of the ports. From now on, the attacker can use the ports which were blocked\
    \ earlier, in order to capture all the traffic passing through the network.\n\n\
    ### Countermeasures\n\nThe “guard root” feature is used to prevent this kind of\
    \ attack:\n\n| Command | Description |\n|---|---|\n| S1(config-if)# spanning-tree\
    \ guard root | Protects against the replacement of the original “root bridge”\
    \ by another switch. |\n\nNOTE.\n- “bpdu guard” and “guard root” are similar,\
    \ but have different impacts:\n- bpdu guard disables the ports when receiving\
    \ bpdu messages if the “portfast” option is activated on the port. You must manually\
    \ reactivate the port or configure a “deactivation time”.\n- guard root allows\
    \ bpdu messages to travel across a port to maintain STP topology, unless another\
    \ switch attempts to become the “root bridge”. The port is reactivated when the\
    \ other switch stops its attempts.\n\n## 7.3. The best security practices for\
    \ protecting Layer 2\n\nThe best practices to protect Level 2, for each type of\
    \ attack, include:\n\n| Type of attack | Description | Countermeasures |\n|---|---|---|\n\
    | MAC address attacks | – MAC address flooding<br>– MAC address spoofing | – Using\
    \ port security for access ports.<br>– Configure the **DAI** feature. |\n| STP\
    \ attacks | – Modification of STP topology | – Configuring the **portfast** feature.<br>–\
    \ Configuring the **bpdu guard** feature.<br>– Configure the **guard root** feature.\
    \ |\n| VLAN hopping attacks | – Using DTP<br>– Double tagging attack | – Disable\
    \ DTP on the access ports.<br>– Explicitly configure the “trunk” ports.<br>– Always\
    \ use a dedicated native VLAN.<br>– Deactivate all unused ports and place them\
    \ in an unused VLAN.<br>– Avoid using VLAN 1. |\n\n## 7.4. Exercises for application\n\
    \nEXERCISE 10.–\n\n### Topology\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_147_0.png)\n\
    \nFor a color version of this figure, see www.iste.co.uk/sadiqui/computer.zip\n\
    \n### Addressing table\n\n| Device | Interface | IP address | Subnet mask | Gateway\
    \ |\n|---|---|---|---|---|\n| S1 | VLAN1 | 192.168.0.2 | /24 | 192.168.0.1 |\n\
    | S2 | VLAN1 | 192.168.0.3 | /24 | 192.168.0.1 |\n| S3 | VLAN1 | 192.168.0.4 |\
    \ /24 | 192.168.0.1 |\n| PC1 | NIC | 192.168.0.5 | /24 | 192.168.0.1 |\n| PC2\
    \ | NIC | 192.168.0.6 | /24 | 192.168.0.1 |\n| dhcp-server | NIC | 192.168.0.7\
    \ | /24 | 192.168.0.1 |\n\n### Objectives\n\n- Securing passwords;\n- Putting\
    \ in place connection restrictions;\n- Securing the local network against Level\
    \ 2 attacks.\n\n### Software to be used\n\n- Packet Tracer.\n\n### Part A: establishing\
    \ the basic device configuration.\n\n- 1. Configure the names of the host as indicated\
    \ in the topology.\n- 2. Apply the IP addresses to the device interfaces according\
    \ to the addressing table.\n\n### Part B: securing passwords\n\n### On switch\
    \ S1\n\n- 1. Set the password “Ci$c0ena” for the privileged mode.\n- 2. Configure\
    \ the console ports and virtual access lines.\n- 2.1. Set “Ci$c0con” as the password\
    \ for the console port and set the inactivity interval to 5 minutes.\n- 2.2. Set\
    \ “Ci$c0vty” as the password on the VTY lines and set the inactivity interval\
    \ to 2 minutes.\n- 3. Encrypt all passwords.\n\n### Part C: securing access to\
    \ VTY lines using ssh\n\n- 1. Configure ssh connections.\n\n### On switch S1\n\
    \n- Use the following options to configure the ssh connections:\n  - domain name:\
    \ tri.local;\n  - the user name: sshadmin with the password: Ci$c0ssh;\n  - the\
    \ RSA encryption key is 1024 bits;\n  - the SSH version used is version 2;\n \
    \ - the wait time is 90s;\n  - the number of login attempts is 3;\n  - only authorize\
    \ ssh sessions.\n\n- 2. Configure the connection parameters.\n\nUse the “login\
    \ block-for” command to configure the connection being blocked for **60s** if\
    \ two connection attempts have failed within **30s**.\n\n### Part D: securing\
    \ the local network against Layer 2 attacks\n\n### On switch S2\n\n### 1. Secure\
    \ LAN against MAC address flooding attacks.\n\n### 1.1. Explain this type of an\
    \ attack.\n\n### 1.2. Set the maximum number of secured MAC addresses to be 2\
    \ on the FastEthernet ports 0/4 to 0/16.\n\n```\nS2(config)# int range f0/4-16\n\
    S2(config-if)# switchport mode access\nS2(config-if)# switchport port-security\n\
    S2(config-if)# switchport port-security maximum 2\n```\n\n### 1.3. Block the frames\
    \ received on the ports in case of access violation.\n\n```\nS2(config-if)# switchport\
    \ port-security violation protect\n```\n\n### 1.4. Manually assign the MAC address\
    \ of the Server_dhcp to port f0/3.\n\n```\nS2(config)# int f0/3\nS2(config-if)#\
    \ switchport mode access\nS2(config-if)# switchport port-security\nS2(config-if)#\
    \ switchport port-security mac-address mac-address_server_dhcp\n```\n\n### 1.5.\
    \ Deactivate the unused FastEthernet ports 0/17 to 0/24.\n\n```\nS2(config)# int\
    \ range f0/17-24\nS2(config-if)# shutdown\n```\n"
  mdcn: "\n\n## 7.2.4. VLAN 跳跃攻击。\n\nVLAN 跳跃攻击包括连接到特定 VLAN 并尝试访问属于其他 VLAN 的网络流量。通过使用\
    \ VLAN 跳跃，攻击者可能会捕获另一个 VLAN 的网络流量，或将数据从一个 VLAN 发送到另一个 VLAN。\n\nVLAN 跳跃攻击有两种类型，即：“交换机欺骗”和“双重标记”攻击。\n\
    \n### 7.2.4.1. 交换机欺骗攻击\n\n### DTP 协议概述\n\nDTP 是用于在两台交换机之间动态创建中继（聚合链路）的协议。可以配置三种模式：“动态可取”、“动态自动”或“中继”。\n\
    \n### 攻击概述\n\n该攻击包括连接到交换机接口，并从程序生成 DTP 消息，在攻击者的计算机和交换机之间创建“中继”链路。现在，攻击者可以捕获所有其他\
    \ VLAN 的数据。\n\n该攻击还可以通过引入配置为使用 DTP 协议的“欺骗交换机”来实现。\n\n### 防御措施\n\n以下功能可用于防止此类攻击：\n\
    \n| Command | Description |\n|---|---|\n| S1(config)#interface range gigabitethernet\
    \ 0/0 - 20 S1(config-if-range)#switchport mode access | 将连接到主机的交换机端口配置为访问端口。 |\n\
    | S1(config-if)# switchport mode trunk | 显式启用聚合链路。 |\n| S1(config-if)# switchport\
    \ nonegotiate | 禁用 DTP 并防止生成 DTP 消息。 |\n| S1(config)#interface range gigabitethernet\
    \ 0/26 - 32 S1(config-if)# switchport access vlan Vlan S1(config-if)# shutdown\
    \ | 将未使用的端口分配到专用 VLAN 并禁用它们。 |\n\n### 7.2.4.2. 双重标记攻击\n\n### 攻击概述\n\n该攻击包括连接到“中继”端口上属于原生\
    \ VLAN 的接口，并在以太网帧中两次插入与 VLAN 相关的字段来发送帧。\n\n实际上，双重标记攻击分为三个步骤：\n\n- 1) 攻击者生成并向交换机\
    \ 1 发送带有双重标记的 802.1Q 帧：\n  - 第一个标记携带“中继”端口的原生 VLAN 标识符；\n  - 第二个标记携带目标主机的 VLAN\
    \ 标识符。\n\n| 数据 | 原生 VLAN ID | 目标 VLAN ID |\n| --- | --- | --- |\n\n### 图 7.1.\
    \ 带有两个标记的 802.1Q 帧\n\n2) 交换机 1 将删除原生 VLAN 标记。攻击者的帧现在将仅包含目标主机的 VLAN 标记。\n\n| 数据\
    \ | 目标 VLAN ID |\n| --- | --- |\n\n### 图 7.2. 由目标主机上的 VLAN 标记标记的 802.1Q 帧\n\n\
    ![](img/6cc1cc8bbb23ba3014958aee841c4ff5_144_0.png)\n\n### 图 7.3. 双重标记攻击的步骤\n\n\
    — 在图 7.1、7.2 和 7.3 中，“data”字段表示与以太网帧相关的信息，此外还包含数据包中的其他信息，而不考虑它们在 802.1Q 帧中出现的顺序。\n\
    \n— 此类攻击是单向的，仅当黑客连接到与原生中继端口 VLAN 相同 VLAN 的端口时才有效。\n\n### 防御措施\n\n“原生 VLAN”功能用于防止此类攻击。\n\
    \n| Command | Description |\n|---|---|\n| Switch(config-if)# switchport trunk\
    \ native vlan vlan | 为原生 VLAN 流量创建专用 VLAN，使其与用户流量分离。 |\n\n### 7.2.5. 基于 STP 的攻击\n\
    \n### STP 概述\n\nSTP 是一种网络协议，通过阻止由多台交换机组成的局域网中的某些路径，从而创建无环网络拓扑。其功能可概括如下：\n\n- 为每个\
    \ VLAN 选择“根桥”交换机；\n- 定义“根端口”，以允许“根”交换机与其他交换机之间的互连；\n- 定义获准传输数据的端口；\n- 阻止交换机上的某些端口。\n\
    \n### 攻击概述\n\n该攻击包括引入“欺骗交换机”，该交换机将通过发送包含最小“BID”的虚假“PDU”消息，试图将自身定位为“根桥”。这将导致修改\
    \ STP 拓扑并更改端口角色。从此，攻击者可以使用先前被阻止的端口，以捕获通过网络的所有流量。\n\n### 防御措施\n\n“保护根”功能用于防止此类攻击：\n\
    \n| Command | Description |\n|---|---|\n| S1(config-if)# spanning-tree guard root\
    \ | 防止其他交换机替换原始“根桥”。 |\n\n注释。\n- “BPDU 防护”和“保护根”功能相似，但影响不同：\n- 如果在端口上激活了“PortFast”选项，则“BPDU\
    \ 防护”在接收 BPDU 消息时会禁用端口。您必须手动重新激活端口或配置“禁用时间”。\n- “保护根”允许 BPDU 消息跨端口传输以维护 STP 拓扑，除非另一台交换机试图成为“根桥”。当另一台交换机停止尝试时，端口将重新激活。\n\
    \n## 7.3. 保护第 2 层的最佳安全实践\n\n保护第 2 层的最佳实践，针对每种攻击类型，包括：\n\n| 攻击类型 | 描述 | 防御措施 |\n\
    |---|---|---|\n| MAC 地址攻击 | – MAC 地址泛洪<br>– MAC 地址欺骗 | – 对访问端口使用端口安全功能。<br>– 配置\
    \ **DAI** 功能。 |\n| STP 攻击 | – 修改 STP 拓扑 | – 配置 **端口快速** 功能。<br>– 配置 **BPDU 防护**\
    \ 功能。<br>– 配置 **保护根** 功能。 |\n| VLAN 跳跃攻击 | – 使用 DTP<br>– 双重标记攻击 | – 在访问端口上禁用 DTP。<br>–\
    \ 显式配置“中继”端口。<br>– 始终使用专用原生 VLAN。<br>– 禁用所有未使用的端口并将其放置在未使用的 VLAN 中。<br>– 避免使用\
    \ VLAN 1。 |\n\n## 7.4. 应用练习\n\n练习 10.–\n\n### 拓扑\n\n![](img/6cc1cc8bbb23ba3014958aee841c4ff5_147_0.png)\n\
    \n该图的彩色版本，请参见 www.iste.co.uk/sadiqui/computer.zip\n\n### 寻址表\n\n| 设备 | 接口 | IP\
    \ 地址 | 子网掩码 | 网关 |\n|---|---|---|---|---|\n| S1 | VLAN1 | 192.168.0.2 | /24 |\
    \ 192.168.0.1 |\n| S2 | VLAN1 | 192.168.0.3 | /24 | 192.168.0.1 |\n| S3 | VLAN1\
    \ | 192.168.0.4 | /24 | 192.168.0.1 |\n| PC1 | NIC | 192.168.0.5 | /24 | 192.168.0.1\
    \ |\n| PC2 | NIC | 192.168.0.6 | /24 | 192.168.0.1 |\n| dhcp-server | NIC | 192.168.0.7\
    \ | /24 | 192.168.0.1 |\n\n### 目标\n\n- 保护密码；\n- 实施连接限制；\n- 保护本地网络免受第 2 层攻击。\n\n\
    ### 使用的软件\n\n- Packet Tracer。\n\n### 部分 A：建立基本设备配置。\n\n- 1. 按照拓扑中指示配置主机名称。\n-\
    \ 2. 根据寻址表将 IP 地址应用到设备接口。\n\n### 部分 B：保护密码\n\n### 在交换机 S1 上\n\n- 1. 为特权模式设置密码“Ci$c0ena”。\n\
    - 2. 配置控制台端口和虚拟访问线路。\n- 2.1. 将“Ci$c0con”设置为控制台端口的密码，并将非活动间隔设置为 5 分钟。\n- 2.2. 将“Ci$c0vty”设置为\
    \ VTY 线路的密码，并将非活动间隔设置为 2 分钟。\n- 3. 加密所有密码。\n\n### 部分 C：使用 SSH 保护对 VTY 线路的访问\n\n\
    - 1. 配置 SSH 连接。\n\n### 在交换机 S1 上\n\n- 使用以下选项配置 SSH 连接：\n  - 域名：tri.local；\n  -\
    \ 用户名：sshadmin，密码：Ci$c0ssh；\n  - RSA 加密密钥为 1024 位；\n  - 使用的 SSH 版本为版本 2；\n  -\
    \ 等待时间为 90s；\n  - 登录尝试次数为 3；\n  - 仅授权 SSH 会话。\n\n- 2. 配置连接参数。\n\n使用“login block-for”命令，如果在\
    \ **30s** 内两次连接尝试失败，则将连接阻止 **60s**。\n\n### 部分 D：保护本地网络免受第 2 层攻击\n\n### 在交换机 S2\
    \ 上\n\n### 1. 防御局域网免受 MAC 地址泛洪攻击。\n\n### 1.1. 解释此类攻击。\n\n### 1.2. 将 FastEthernet\
    \ 端口 0/4 至 0/16 上的安全 MAC 地址最大数量设置为 2。\n\n```\nS2(config)# int range f0/4-16\n\
    S2(config-if)# switchport mode access\nS2(config-if)# switchport port-security\n\
    S2(config-if)# switchport port-security maximum 2\n```\n\n### 1.3. 在发生访问违规时阻止在端口上接收到的帧。\n\
    \n```\nS2(config-if)# switchport port-security violation protect\n```\n\n### 1.4.\
    \ 将 Server_dhcp 的 MAC 地址手动分配给端口 f0/3。\n\n```\nS2(config)# int f0/3\nS2(config-if)#\
    \ switchport mode access\nS2(config-if)# switchport port-security\nS2(config-if)#\
    \ switchport port-security mac-address mac-address_server_dhcp\n```\n\n### 1.5.\
    \ 禁用未使用的 FastEthernet 端口 0/17 至 0/24。\n\n```\nS2(config)# int range f0/17-24\n\
    S2(config-if)# shutdown\n```\n\n"
