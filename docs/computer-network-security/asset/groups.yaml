    \ set transform-set R1-to-R2-SET | Defines the identifier of the IPsec policy\
    \ required for Phase 2. |\n| R1(config-crypto-map)# set peer 44.113.202.129 |\
    \ Sets the IP address for the other side of the VPN tunnel. |\n| R1(config-crypto-map)#\
    \ match address VPN-ACL | Sets the ACL ID for the traffic of interest. |\n\n-\
    \ 6) apply the encryption map to an interface.\n\n| Command | Description |\n\
    |---|---|\n| R1(config)# interface s0/0<br>R1(config-if)# crypto map R1-to-R2-MAP\
    \ | Selects an interface and applies the encryption map. |\n\n- 7) verify the\
    \ VPN tunnel settings.\n\n| Command | Description |\n|---|---|\n| R1# show crypto\
    \ isakmp transform-set | Displays the configuration for the IPsec policy required\
    \ for Phase 2. |\n| R1# show crypto map | Displays the encryption map configuration.\
    \ |\n| R1# show crypto ipsec sa | Displays the established IPsec tunnels. |\n\n\
