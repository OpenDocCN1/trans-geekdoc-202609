  \ 37014.\n\n# 6 EHR 中的缺失问题\n\n## 引言\n\n在使用 EHR 数据库进行任何统计推断和预测之前，我们需要解决的一个严峻挑战是 EHR\
  \ 和数据数据集中的数据缺失问题。这些数据库包含疾病诊断、药物、临床事件和实验室检查等多个表格，所有数据在出现缺失时都会变得复杂。例如，在 Cerner 数据库中，实验结果表和临床事件表是最大的两个表，但存在大量数据缺失。特别是实验表中，实验室检查表可能非常稀疏，因为某些实验结果没有正确输入，或者某些实验室检查只针对少数患者进行了，导致其他患者出现缺失值。\n\
  \n此外，临床事件表可能没有包含所有患者的记录。根据我们对 Cerner 数据库的初步评估，大约 60% 的患者没有一条临床事件记录，这可能是因为 Cerner\
  \ 直到 2009 年才开始记录临床事件。\n\n临床事件表对于推断或预测分析至关重要，因为它包含了患者的生命体征和可能的关键临床事件。该数据库的另一个问题是患者的纵向信息随住院状态（住院或门诊）而不同。因此，从所有表格中提取的任何数据集其缺失率可能高达\
  \ 10%–99%。\n\n\n\n\n文献中存在许多推断和估计方法，即使在存在缺失数据的情况下，也可以直接应用于统计预测模型。这些方法包括通过期望极大化（EM）方法的基于似然的方法\
  \ [1]]，以及通过马尔可夫链蒙特卡洛（MCMC）方法的贝叶斯方法 [2]]。然而，这些方法仅能处理较小的缺失比例，且计算量巨大，特别是对于大型和高维数据集。因此，在本章中，我们将重点关注插补方法，以便在缺失率较高或对电子健康记录（EHR）数据集的计算需求较低的情况下生成完整数据集，从而允许应用所有的标准的统计、机器学习或深度学习预测模型。\n\
  \n在本章中，我们首先简要回顾了不同类型的缺失数据机制。然后，我们回顾了常用的插补方法，包括链式方程多重插补（MICE） [3]], MissForest [4]],均值和中位数插补，以及一些新的机器学习和深度学习应用。最后，我们将这些方法应用于一个从\
  \ Cerner 数据库提取的示例，以说明这些方法的性能和效率。\n\n### ![image](img/inline1_1.jpg)\n\n## 6.2 缺失数据机制\n\
  \n根据缺失的根本原因，我们可能会面临不同类型的缺失数据，每种数据都有特定的缺失机制。此外，理解缺失机制对于采用正确的缺失数据插补策略和方法至关重要。本节简述了缺失数据机制和文献中常见的现有插补方法。\n\
  \n缺失数据机制可以分为三类：完全随机缺失（MCAR）、随机缺失（MAR）和非随机缺失（MNAR）。MCAR 正如其名称所示，是指缺失数据是完整数据集的随机子集的情况\
  \ [5]]。也就是说，缺失数据机制与缺失数据本身以及观测数据都是无关的。MCAR 的典型例子是问卷随机丢失，或实验样本结果意外丢失。当缺失数据依赖于观测数据时，就会发生\
  \ MAR。例如，只有女性可能进行乳腺癌诊断测试，而男性则有前列腺癌的相关测试结果。因此，缺失依赖于观测变量性别。MNAR（或不可忽略缺失）发生在缺失趋势依赖于未观测数据本身的情况下。例如，一个人可能会拒绝回答有争议或不舒服的问题，例如来自低社会经济背景的个体不回答有关收入的问题。\n\
  \n然而，在实践中，由于 EHR 数据始终包含大量变量，在没有患者先验和随访信息的情况下 [6]]，我们无法识别缺失数据机制。通常情况下，我们可以假设 EHR\
  \ 数据主要是 MAR 数据，因为每个患者都有数千个可用变量，并且可能存在与缺失数据高度相关的观测信息。幸运的是，MAR 可以简单的朴素插补方法进行插补，如总体均值、单插补和多重插补方法\
  \ [7]]。\n\n### ![image](img/inline1_1.jpg)\n\n## 6.3 处理不完整 EHR 数据的方法\n\n### 6.3.1\
  \ 朴素方法\n\n朴素分析方法包括“完整案例”（Complete-Case）和“可用数据”方法。在完整案例法中，任何带有缺失信息的受试者都会从数据集中删除。当缺失比例小且缺失数据为\
  \ MCAR 时，这种方法既简单又高效。如果缺失数据不是 MCAR，这种方法会导致统计推断和感兴趣的预测模型产生偏差。由于 EHR 数据库具有极高维度，且缺失类型通常不是\
  \ MCAR，这种方法可能不适用于 EHR 数据。\n\n可用数据方法通常用于具有缺失观测值的纵向数据分析，以及当缺失数据比例随变量而异的情况，因为它使用可用数据进行插补。该方法常用于具有缺失观测值的纵向数据分析，以及不同变量之间的缺失数据比例不同的情况，因为它利用可用数据进行插补。例如，对于某些数据，使用广义估计方程（GEE）\
  \ [8]] [9]] 或广义线性混合模型（GLMM）来处理缺失数据并插补值。显然，这些方法仅适用于单变量分析，不适用于 EHR 数据。\n\n### 6.3.2\
  \ 使用模型进行插补\n\n如果可以假设缺失数据为 MAR，则可以使用统计模型或机器学习模型进行插补。方法包括单插补和多重插补；在后者中，我们会考虑预测方差，通过\
  \ `m (>1)` 次预测缺失值。插补方法也可以分为参数模型（如广义线性模型）和非参数模型（如核估计模型）。参数模型包括线性回归、逻辑回归回归模型。\n\n\
  在本节的剩余部分，我们将简要介绍每种插补方法及其优缺点。\n\n#### I. 单插补\n\n单插补的计算量比多重插补小，因为它只进行一次迭代插补。然而，使用这种方法存在低估方差的风险，因为它假设真实模型是可用的\
  \ [10]]。我们在下面介绍了不同的单插补方法。\n\n##### a. 均值（位数）插补\n\n单插补最简单的方法是用描述性统计量（如均值、位数或位数）替换缺失单元。\n\
  \n- **优点**：只要每个变量至少有一个观测值即可使用。\n- **缺点**：该方法忽略了不同变量之间的关系；如果某个变量的缺失率很高，插补可能会偏差。\n\
  - **在 EHR 数据集中**：这是最简单的插补方法，可以作为应用于缺失数据（通常比例较高）的 EHR 数据集的首选方法之一。应将其与更复杂的插补方法进行比较，以探索偏差的程度，当结果一致时，可以使用较简单的方法。\n\
  \n##### b. 最后观测向前法 (LOCF)\n\n这种方法有时也称为“最后值向前”，使用个体最近的观测反应作为插补值。这种方法常用于处理不完整的纵向数据。\n\
  \n- **优点**：减少了从分析中删除的受试者，因为它使用最近的非缺失值填充空白，并允许使用单个端点代表随时间的数据点。\n- **缺点**：不建议这种方法作为处理缺失数据的主要方法，因为所需的假设很少成立。例如，其中一个假设是受试者在退出后结果将保持相同的趋势，而我们没有工具可以直接检查或验证这一假设\
  \ [11]]。\n\n\n\n该方法对于纵向变量的受试内数据插补非常有用。然而，电子健康记录（EHR）的时间戳并不标准，本身需要一个清晰的策略来处理（参见第\
  \ 4 章）。例如，最后一次可血压测量值可能追溯到一年前一次危住院的记录。对于常规体检中当前缺失的血压测量值，该测量值并不是合理的候选对象。\n\n#####\
  \ c. 其他插补方法\n\n#### 使用相关观测信息：\n\n该方法使用相关观测值来粗略填充缺失信息。例如，如果缺失的信息是关于父亲的，我们将用母亲的信息填充空白单元格。这是一种合理的策略，尽管这些插补可能会传播测量误差，因为我们可以合理地假设父母的信息（如生活方式和习惯）在某种程度上是相似的。\n\
  \n#### 单插补方法总结：\n\n* **优点**\n  单插补方法易于理解和使用。\n* **缺点**\n  由于插补值被视为已知值，无论我们是否知道缺失的原因，模型都会低估方差。\n\
  * **在 EHR 数据集中**\n  单插补模型是高维且高缺失率 EHR 数据集中可以使用最简单的方法。尽管它们有缺点，但我们可以将其结果作为比较的参考。\n\
  \n#### II. 多重插补\n\n多重插补基于不同的估计底层分布生成多个单插补数据集。每个插补后的版本都可以被视为完整数据集，我们可以对其应用标准的统计学方法。如果我们假设数据缺失机制为\
  \ `MAR`，则每个估计值都是无偏的，因此我们可以简单地取估计值的平均值，从而获得关联性的合并估计值。合并估计的方差可以使用 `Rubin’s formula`\
  \ 计算，该公式将在后续章节中详细讨论。多重插补方法结合了插补所用模型中的采样方差和对回归参数的不确定性。\n\n#### 基本步骤：\n\n* **步骤 1**：生成\
  \ `m` (`>1`) 个完整数据集。\n* **步骤 2**：将选的模型应用于所有 `m` 个完整数据集。\n* **步骤 3**：合并并汇总来自 `m`\
  \ 个完整数据集的结果。\n\n在本节的余下部分中，我们将描述两种常用的多重插补方法：常规多变量插补和迭代回归插补，以及它们的优缺点。\n\n#### a. 常规多变量插补\n\
  \n该方法使用多变量回归模型来插补缺失值，可用于插补多个变量中的缺失值。为了构建多变量模型，我们为每个变量假设一个分布函数，通常对于连续结果使用多元正态分布或\
  \ `t` 分布，对于二分类和分类结果使用 `binomial` 和 `multinomial` 分布，对于计数数据使用 `Poisson` 分布。\n\n*\
  \ **优点**\n  该方法实现简单且易于解释，是进一步进一步插补的良好起点。\n* **缺点**\n  构建一个合理的多变量回归模型通常很困难。\n* **在\
  \ EHR 数据集中**\n  由于 EHR 数据通常包含大量变量，假设 `MAR` 是非常合理的。因此，这种方法可以是一个安全的选择。然而，由于 EHR 数据中缺失率很高，寻找并拟合合理的多变量模型是一项重大挑战。\n\
  \n### b. 迭代回归插补\n\n该方法通过迭代拟合回归模型来预测缺失观测值，一次将一个具有缺失值的变量作为结果。它假设变量 `Y[1]`、`Y[2]`...`Y[k]`\
  \ 受缺失值的影响，且设计矩阵 `X` 包含了所有完全观测的变量。最初，它使用一组随机选择的 `X` 列逐个插补 `Y[1]`、`Y[2]`...`Y[k]`；然后，它使用\
  \ `{Y[i]; i != j & X}` 插补每个 `Y[j]`，直到得到一个完整数据集。\n\n* **优点**\n  由于它在每一步都使用单变量响应模型，而不是高维多变量响应模型，这种方法更容易理解和解释；与早期的简单方法相比，它能够允许交互作用。\n\
  * **缺点**\n  每个单变量模型必须是合理的，且所有模型必须保持一致性。\n* **在 EHR 数据集中**\n  虽然这种方法可以用于 EHR 数据集，但可能在大多数\
  \ EHR 数据集中并不可行或适用，因为它们通常有数千个带有缺失值的变量，且没有变量是完全观测的。\n\n#### III. 统计模型\n\n为了应用统计回归和预测模型插补缺失数据，需要满足几个假设。首先，缺失机制应为\
  \ `MAR`，这意味着缺失仅取决于观测数据；其次，数据模型的参数与缺失指示器模型的参数是彼此区分的。用于缺失插补的回归方法包括参数模型和非参数模型，下文将分别简要描述。\n\
  \n### a. 参数模型的基本步骤\n\n链方程多重插补 (`MICE`) 是插补缺失数据最常用的参数方法。它迭代地使用多个回归模型来插补不同类型变量（如数值、分类和计数数据）的缺失值。为了插补每个变量中的缺失值，根据所选响应变量的类型构建回归模型（`Generalized\
  \ Linear Models` 的成员）。具体而言，对于连续、计数或二分类响应，`MICE` 分别将使用 `ordinary linear regression`、`log-linear`\
  \ 或 `logistic regression` 模型。为了构建每个插补回归模型，协变量集可以是其他现有变量，也可以根据它们与结果的相关性选定的变量列表。我们可以将插补假设为连续的变量\
  \ `Y[j]` 的 `MICE` 程序总结如下：\n\n```\n步骤 1：拟合模型\nE(Y[j]|Y[1],...Y[j-1]) = β[0] + β[1]*Y[1]\
  \ + ... + β[j-1]*Y[j-1]\n使用普通最小二法 (OLS) 得到系数 β 的估计值 bbox 以及其协方差矩阵 σ[j]²，其中 σ[j]²\
  \ 是残差方的估计。\n```\n\n```\n步骤 2：从参数 bbox 和 σ[j]² 的后验分布中模拟新的回归参数 β[0],...,β[j-1] 和 σ[j]²。\n\
  ```\n\n```\n步骤 3：使用以下公式插补 Y[j] 的缺失值\nY[j] = β[0] + β[1]*Y[1] + ... + β[j-1]*Y[j-1]\
  \ + z[i]*σ[j]\n其中 Y[1], Y[2],...Y[j-1] 是协变量的取变量值，z[i] 是来自标准正态分布的随机值。\n```\n\n重复步骤\
  \ 1 到 3 直到插补所有缺失值。通过重复这些步骤 `m` 次获得多次插补。当响应是离散的时，我们可以使用广义线性模型代替线性模型。\n\n### b. 非参数模型的基本步骤\n\
  \n```\n步骤 1：创建一个指示变量 R[j] = I(Y[j] 已观测)\n```\n\n```\n步骤 2：拟合逻辑回归模型\nlogit(p[j])\
  \ = β[0] + β[1]*Y[1] + ... + β[j-1]*Y[j-1]\n其中 p[j] = P(R[j]=0|Y[1],Y[2],...Y[j-1])\n\
  ```\n\n```\n步骤 3：为每个观测值创建一个倾向评分（即给定其他变量时缺失的概率）以估计\n```\n\n\n\n\n# 第 4 ：根据这些倾向评分将观测分为固定数量的组（通常为五组）\n\
  \n# 第 5 ：对每组应用近似贝叶斯自助插补\n\n在组 `k` 中，假设 `Y[obs]` 表示具有非缺失 `Y[j]` 值的 `n[1]` 个观测值，`Y[mis]`\
  \ 表示缺失 `Y[j]` 的 `n[0]` 个观测值。近似贝叶斯自助插补从 `Y[obs]` 中随机有回抽取 `n[1]` 个观测值创建一个创建一个数据集 `Y^(*)[obs]`。这是从参数后验预测分布中抽取参数的非参数类比。然后，从\
  \ `Y^(*)[obs]` 中随机有回抽取 `n[0]` 个值作为 `Y[mis]` [14]。\n\n对每个具有缺失值的变量顺序重复步骤 1–5。\n\n\
  #### 优点\n这些方法比线性模型或 `GLMs` 等参数方法更灵活，且在描述变量间关系时所需的假设更少。\n\n#### 缺点\n当数据集是高维时，参数方法可能需要估计许多参数，这可能导致无法收敛。\n\
  \n### 在 EHR 数据集中\n非参数模型可以用于 EHR 数据集。例如，我们可以应用常用的基于树的方法。临床记录之间的依赖关系可能更加复杂，仅使用线性参数数据无法对其进行建模；在这种情况下，非参数方法是非常有用的。我们将在接下来的章节中讨论细节。\n\
  \n### c. 合并多次插补的估计值\n假设 `Q̂[i]` 和 `Ŵ[i]` (`i = 1, …, m`) 代表由迭代 `i` 得到的 p 维参数 `Q`\
  \ 的点估计和协方差矩阵估计。那么，`Q` 的合并点估计为 $\\overline{Q} = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}{\\\
  widehat{Q}}\\_{i}$，合并方差矩阵由 $T_{0} = \\overline{W} + \\left( 1 + \\frac{1}{m} \\\
  right)B$ 给出，其中 $\\overline{W} = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}{\\widehat{W}}\\\
  _{i}$ 是插补内方差，$B = \\frac{1}{m - 1}\\sum\\limits_{i = 1}^{m}{\\left( {\\\\widehat{Q}}\\\
  _{i} - \\overline{Q} \\right)\\left( {\\\\widehat{Q}}\\_{i} - \\overline{Q} \\right)^{\\\
  prime}}$ 是插补间方差。\n\n## 6.3.3 机器学习与深度学习模型\n\n### 1. 基于树的方法\n决策树学习是预测建模中的方法，它使用决策树从观测值对目标值做出决策。分类回归树可用于统计预测，无需假设参数回归模型\
  \ [15]。树通常通过根据协变量对受试者（响应值）进行二分类来创建。此过程是迭代的，在每次迭代中，根据目标函数选择一个协变量，将响应值聚类到多个（通常是两个）簇中。每个叶子节点代表多个协变量配置下的响应簇。\n\
  \n开源数据“IRIS” [16,17] 的分类树示例如图 6.1 所示。散点图（顶部面板）显示了三种鸢尾花，（在底部）使用了花瓣宽度和花萼宽度等变量来迭代构建树。\n\
  \n![图 6.1 IRIS 数据的散点图和分类树示例。](img/fig6_1.jpg)\n\n**图 6.1**\nIRIS 数据的散点图和分类树示例。\n\
  \n如果响应变量是连续的，则为回归树；如果响应变量是分类的，则是分类树。基于树的模型理论是识别响应同质的节点，根据产生响应变量变量减少最大的预测变量值分离样本。假设结果变量为\
  \ `Y`，预测变量向量为 `X`，则模型中的参数为 `T` 和 `θ`，其中 `T` 是具有 `R` 个节点或叶子的树。因此，为了预测结果类别 `Y`，模型的参数向量可以表示为\
  \ `θ ℄=℄{θ[1],ↆ…,ↄθ[R]}`，其中 `θi` 是每个叶子节点 `i` 的参数。如果预测变量 `X` 在叶子节点 `r` 中，则 `Y|X`\
  \ 根据概率 `p(Y|θ[r])` 分布，该概率将用于确定预测结果。\n\n#### 优点\n基于树的插补变得流行，因为它是一种非参数方法，不需要我们对数据分布做出任何假设（正如我们在参数模型中可能需要的那样）。此外，它不需要指定的数据结构或变量类型。因此，我们不需要担心模型误设定和离群值，因为非参数模型可以产生稳健的结果。\n\
  \n#### 缺点\n如果数据集仅具有平滑边界，决策树的效果并不理想；此外，它们的灵活性会导致更高的方差。\n\n### EHR 数据集\n由于 EHR 数据集始终包含混合类型（包括连续或分类），且变量之间的依赖关系往往被预假设模型错误指指，我们可以考虑使用基于树的插补来分析\
  \ EHR 数据。\n\n#### II. 插补中的深度学习方法\n第 1 节和第 2 节描述的传统插补方法大部分适用于临床试验数据集，这些数据集可能不是高维的或没有缺失率。在\
  \ EHR 数据中，虽然传统的插补有系统且成熟的计算方法可用，但它们可能会在插补结果中产生噪声。机器学习是人工智能的一种应用，系统通过从经验中学习自动获得新知识并改进。深度学习是机器学习的一个子集，模仿人类大脑处理数据和学习新材料的方式。它们在预测领域非常流行，最近已被应用于缺失数据问题。\n\
  \n#### a. 自动编码器\n自动编码器是一种特定的神经网络 [18]，其输入和输出相同。它们将输入编码为低维代码，并使用该表示来重建输出。自动编码器背后的思想是让\
  \ AI 从输入层学习，其中隐藏层的数量少于输入层的数量，强制模型从输入中压缩知识。此外，如果输入数据存在某些结构，AI 在我们需要压缩输入时会学习这种结构。然而，由于学习过程，我们需要考虑准确构建重建与简单记忆训练数据之间的权衡。模型将包含两个部分：1)\
  \ 让模型从输入学习的损失函数；2) 避免记忆训练数据的正则化函数。放在正则化函数之前的缩放参数调节这种权衡。\n\n```\nL(x,x̂)℄+℄regularization\n\
  ```\n\nBeaulieu-Jones 等人实现了用于 EHR 缺失插补的自动编码器方法 [19]。他们使用了重建层 z 与输入 x 之间的修改二交叉熵代价\
  \ [20]。他们使用了指示器 m，数据存在时值为 1，缺失时值为 0。然后，每个存在特征的平均成本估计如下\n\n\n\n\n\n$\\mathit{cost}\
  \ = - \\sum\\limits\\_{k = 1}^{d}{\\\\left\\lbrack {x\\_{k}}\\log\\left( z\\_{k}\
  \ \\right)m\\_{k} + \\left( {1 - x\\_{k}} \\right)\\\\log\\left( {1 - z\\_{k}} \\\
  right)m\\_{k}} \\right\\rbrack/\\\\mathit{count}\\\\left( m \\right).}$\n\n如果在 100\
  \ 个 epoch 内没有达到新的最小成本，训练将停止。\n\nBeaulieu-Jones 等人还将带有 dropout 的多层自动编码器与其他插值方法（在人工构建的缺失数据上包括\
  \ KNN、均值、中位数、SI 和 SVD）进行了比较，并设计了旨在同时适用于 MCAR 和 MNAR 情况的实验。带有 dropout 的自动编码器显示出最稳健的插值性能。尽管这些方法似乎是很好的解决方案，但它们仍然存在一些问题。自动编码器是计算密集型的，计算时间随观测数量的增加而线性增长，且其结论受样本大小和数据结构。\n\
  \n#### b. 自然语言处理 (NLP)\n\n人工智能的另一个分支——自然语言处理（NLP）试图让计算机理解人类语言。大多数 NLP 算法依赖于机器学习方法来推导人类语言的规则。NLP\
  \ 通常被视为黑箱，但理解其工作原理非常重要。通常，NLP 识别并提取自然语言规则，然后通过句法分析和语义分析将自然语言转换为计算机语言。语法指的是如词序和语法等使句子传达一致含义的规则，NLP\
  \ 使用句法分析根据语法规则对自然语言进行评估。语义指的是对自然语言句子组成部分的理解，而语义分析问题目前尚未被完全解决。\n\n作为 NLP 在 EHR（电子健康记录）数据中应用的示例，克利夫兰诊所的\
  \ EHR 系统通过名为“My Chart”的门户允许患者访问。“MyChart”让患者能够查看医疗记录、预约挂、接收提醒，并自由地向医生及医疗团队的其他成员撰写信息\
  \ [21]。尽管这可能被视为缺失数据解决方案的一种颖应用，但我们认为这些文本注释可能提供患者记录其他部分可能缺失的可靠信息。由于人类语言的特殊性，NLP 对计算机来说仍然是一个难题，在我们能够构建出全面理解人类语言的\
  \ NLP（这是 NLP 的最终目标）之前，可能还需要一段时间时间。\n\n#### c. 生成对抗网络 (GAN)\n\n生成对抗网络（GAN）是一种用于插值缺失数据的新方法。GAN\
  \ 由 Ian J. Goodfellow 在其 2014 年的论文《Generative Adversarial Nets》[22] 中首次提到。自那以后，GAN\
  \ 已被用于图像或音频生成。GAN 是一种通过对抗过程估计生成模型的方法，包括两个模型——用于捕捉数据分布的生成器模型 `G`，以及判别器模型 `D`，后者估计样本来自训练数据而非\
  \ `G` 的概率。`G` 的训练过程是最大化 `D` 犯错的概率 [22]，之后，生成网络将学习将潜空间中的数据点映射到某些分布，而判别网络将学习将这些产物与真实数据分布区分开来。对于使用\
  \ `GAN` 进行缺失插值，生成器根据从观测值中学到的信息来插值缺失值，而判别器旨在识别完成向量中的观测值和插值值。[23]\n\n尽管 `GAN` 是一种新方法，特别是对于处理缺失数据来说非常新，但一些研究人员已经尝试在现实数据中应用\
  \ `GAN`，并与其他现有插值方法进行了比较。下一段将介绍一个在缺失数据中使用 `GAN` 的示例。\n\nJinsung Yoon 等人 [23] 在各种数据集上使用了\
  \ `GAN`，并在各种设置下与其他插值算法进行了评估，使用了均方误差（RMSE）和受试者工作曲线下面积（AUC）。他们将该方法称为生成对抗插网络（GAIN）。结果显示，随着缺失率的增加，`GAIN`\
  \ 比 `MissForest` 更稳健；且样本数量的增加，`GAIN` 的性能得到了提升。`GAIN` 也被应用于具有不同维度的数据集，解决了 `MissForest`\
  \ 在维度较小时面临的问题。当缺失率较高时，`GAIN` 也比其他两种方法获得了 AUC 值。Yonghong Luo 等人在一项对比研究中使用了 `GAN`\
  \ [24]，显示 `GAIN` 优于其他三种方法（“末值填充”、“零填充”和“均值填充”）。\n\n总之，`GAN` 可以处理复杂的数据结构，例如 EHR 数据集。还有改进的\
  \ `GAN` 变体 [25] 可以结合迁移学习（下文所述）和其他方法进行探索。\n\n#### d. 迁移学习\n\n迁移学习是一种机器学习方法，它与传统机器学习方法的区别在于，它将第一个任务中开发的模型用于第二个任务。迁移学习包括选择源任务、开发源模型以及微调模型。目前，迁移学习已用于图像数据（例如\
  \ Oxford `VGG` 模型和 Google `inception` 模型）以及语言数据（例如 Google 的 `word2vec` 模型和 Stanford\
  \ 的 `GloVe` 模型）。尽管关于 EHR 研究中迁移学习的文章较少，随着迁移学习的发展，我们相信这种新方法可能会为不同领域（包括 EHR 数据分析）提供更多贡献。由于迁移学习模型实际上从预训练模型中借用信息并生成新模型，似乎它可以处理缺失数据问题，但还需要进一步的研究。\n\
  \n### 6.3.4 选择 EHR 最佳方法\n\n如前所述，单次插值法（如均值或中位数插值）可用于 EHR 数据分析，因为它们是最简单的填充单元单元的方法之一。然而，这些方法只利用单个变量的信息，并且独立于其他变量将所有内容总结为一个值，但没有考虑变量之间的关系。此外，多重插值法（如\
  \ MICE）已应用于许多 EHR 研究 [3]。这些方法考虑了不同变量之间的关系。除了这些传统方法外，决策树模型也可以用于 EHR 数据集的缺失插值，而且机器学习方法在处理缺失问题方面开启了具有巨大潜力的新视野。\n\
  \n\n\n\nEHR（电子健康记录）数据集具有高维度且缺失率极高，某些甚至高达 95%，这使得插值工作极具挑战性。另一方面，选择一组缺失率较低的变量并忽略其他变量可能会导致统计插值模型的拟合效果较差。换之，在保留所有变量和/或运行更精确的插值之间存在权衡。尽管如此，由于有数千个变量可用，我们可以假设数据为随机缺失（MAR），并且有足够的观测值来构建插值模型。因此，设定缺失率阈值来包含或排除插值模型中的变量有助于平衡这两。为了在上述所有方法中选择合适的阈值和插值方法，我们在此建议一种逐步的策略。\n\
  \n### 步骤 1：选择插值方法。如果计算上可行，我们可以选择多种插值方法。\n\n### 步骤 2：选择一个初始缺失率阈值（`(0,1)`范围内接近 1 的任意值），并删除所有缺失率大于该阈值的变量。\n\
  \n### 步骤 3：使用步骤 1 中选择的方法进行插值。\n\n### 步骤 4：使用插值后的数据集拟合预测模型（根据研究目的），计算 `AUC`。\n\n\
  ### 步骤 5：重复步骤 2 到步骤 4，并在步骤 2 中使用较小的阈值；例如，将阈值降低 5%。\n\n### 步骤 6：最后，选择对应最高 `AUC` 的阈值。示例见图\
  \ 6.2。\n\n![图 6.2 使用 MissForest 方法时随阈值变化引起的 AUC 变化。注意，此处选择 AUC 是因为感兴趣的问题具有预测性，且针对二分类响应模型。然而，可以使用其他准确性指标代替\
  \ AUC。](img/fig6_2.jpg)\n\n**图 6.2**\n\n使用 MissForest 方法随阈值变化引起的 AUC 变化。注意，此处选择\
  \ AUC 是因为感兴趣的问题具有预测性，且针对二分类响应模型。然而，可以使用其他准确性指标代替 AUC。\n\n### ![image](img/inline1_1.jpg)\n\
  \n## 6.4 案例研究\n\n在本节中，我们使用从 Cerner 健康数据库提取的数据集，通过四种方法（MICE、Miss Forest、均值和位数）进行插值。我们使用的数据集是一个高维组合表，由实验室和临床事件表（见第\
  \ 3 章，这些数值表）与人口统计学变量、药物、诊断和手术表合并而成。原始研究的目的是预测院内死亡率，这是一个二分类响应。\n\n### 6.4.1 EHR 数据中的缺失情况\n\
  \n在本节中，我们使用根据第 5 章 数据处理与准备中的建议规则准备的数据集，来预测蛛膜下出血（SAH）患者的院内死亡率。我们使用了所有六版本的准备数据，即 `Last24hrs`、`Last48hrs`、`Last72hrs`、`First24hrs`、`First48hrs`\
  \ 和 `First72hrs`，并对上述四种插值程序进行了比较分析。然而，为了本章，我们仅使用了临床事件、实验室结果和人口统计学变量。表 6.1 显示了六个数据框的原始样本量。每个数据框的队列规模和总体缺失率在\
  \ 74–78% 之间，并列在表 6.2 中。\n\n**表 6.1** 不同表版本的样本量\n\n| **表版本** || **队列规模（主题数量）** ||\
