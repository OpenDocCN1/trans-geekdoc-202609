  \n\n\n\n\n### 2.1.1 什么是项目管理？\n\n\n\n\n\n- 该特定项目的管理计划是什么？\n- 交付物是什么，每个交付物的的预期质量如何？\n\
  - 潜在的风险和问题有哪些？\n- 允许多大程度的变更以继续项目？\n- 如何监控项目进度？\n- 项目将如何完成？\n\n解决这些问题的手段和方法被称为项目管理\
  \ (Munns et al. 1996)。\n\n### 2.1.2 为什么我们需要项目管理？\n\n与通用管理不同，项目管理侧重于具有资源和时间限制的较小目标。考虑这些局限性并定义可实现的目标是项目管理的基石。在过去的几十年里，人们注意到项目管理是任何组织管理中高效且至关重要的部分。由于项目经理关注更小的目标，对于单个项目而言，他/她是更快、更好的决策者，并能够更高效地监督团队成员。项目经理与团队成员之间增加的互动增强了前者识别每个团队成员优点的能力。所有这些益处都有助于项目的进展并提高成功率。此外，项目管理专注于完成单项或有限数量的任务，但如果执行得当，在这些项目期间开发的工具和方法可以在更高规模上（即组织管理层面）用于未来的项目。项目经理应该与组织管理人员进行有效的沟通与协作，以决定项目的哪些部分具有成为相应组织其他项目的潜力。这意味着项目经理心中应该有一个大局，使所开发的方法具有灵活性通用性，否则他/她项目的副产品将会被浪费，且对组织而言将不具备效益。\n\
  \n### 2.1.3 项目管理目标和原则\n\nEHR 研究项目的每一步都是耗耗时的。此外，在多个研究组设置的情况下，跟踪项目资源（如文件）的变化以及管理多个团队可能具有挑战性。EHR\
  \ 项目管理的目标是让整个过程更高效、资源可重用，以便我们在开发某种处理每个项目初始步骤的半自动流水线时减少错误和差错。在本章中，我们根据经验描述了当前的项目和文件管理方法，还讨论了管理多个\
  \ EHR 研究项目的自定义方法。本章的重点是描述如何管理 EHR 项目以使资源可重用、可复现、可扩展和通用。\n\n\n## 2.2 EHR 研究中的项目与子项目\n\
  \n通常，多个 EHR 研究团队在同一个 EHR 数据库的不同部分工作。这些研究团队中的每个团队通常关注一种或一组密切相关的疾病。在这种情况下，主项目将是研究团队选定的患者队列（例如，一个针对所有\
  \ HIV 阳性患者的项目），而子项目是基于同一组患者的不同目标（例如，子项目 1：HIV 对癌症的影响；子项目 2：HIV 与心理障碍的关联，等）。\n\n\
  由于数据通常来自单个 EHR 数据库或数据仓库，数据的结构（表和数据格式）在大多数情况下保持不变。这意味着，如果用于数据提取、数据质量评估、数据清洗甚至数据准备的算法已经根据通用性指南被仔细开发出来，那么这些相同的算法（仅对设置进行微调）就可以重用，以满足大多数研究团队的需求\
  \ (Oussous et al. 2018)。\n\n另一方面，并不罕见的是，即使在报告编写期间（这被认为是研究的后期阶段之一），研究团队也会注意到数据提取过程中存在错误，或者他们想要修改数据池。这意味着提取出的数据需要更改，所有的步骤都需要重新进行。这个问题尤其为棘手，特别是当存在多个团队成员使用相同的提取数据时。如果需要开发代码，且由于有多个团队成员使用相同的提取数据，这种问题会变得非常麻烦。这些问题可以归类为文件夹、代码和管理。\n\
  ![image](img/inline1.jpg)\n\n## 2.3 数据、代码与管理\n\n### 2.3.1 数据丢失预防\n\n研究团队需要解决的首要挑战之一是如何防止数据丢失。数据丢失通常发生在以下场景：\n\
  \n- **硬件故障**：尽管在生产更可靠、更持久的数据存储，但所有硬件总都会故障。为了防止这种数据丢失，数据经理可以使用 RAID(1)（特别是 RAID 5、10）和备份服务器。\n\
  - **病毒/恶意软件/勒索软件攻击**：这是最令人痛苦的数据丢失场景之一。你不仅可能丢失数据，数据还可能被未经授权的用户获取。这对于包含敏感信息的 EHR 数据尤为重要。建议使用防火墙和安全软件硬件来保护你的数据。\n\
  - **用户的故意或无意数据操作**：EHR 数据团队通常涉及许多处理数据的用户。用户可能会将文件移动到存储器的不同位置，或者将其删除。当另一个用户想要运行代码并发现找不到运行代码所需的数据时，问题就出现了。在这种情况下，版本控制系统（VCS）是防止此类数据丢失的最优工具。\n\
  \n### 2.3.2 命名规范\n\n在 EHR 项目开始创建文件和文件夹命名规范是重要的，原因有三：\n\n1. 文件数量可能会迅速增加。对文件夹结构达成共识并遵循这些规则有助于所有团队成员更快地找到文件。\n\
  2. 在 EHR 数据团队创建的初期，开发并遵循这种规范更容易。重新组织已经创建并命名的文件文件夹是耗时且具有挑战性的。\n3. 文件、文件夹甚至数据字段的命名规范提高了开发人员的性能。开发人员在编写代码时只需遵循相同的规范，即使团队更新了文件，这些代码也不容易报错。此外，开发人员只需要记住文件或数据字段的名称，就可以遵循这些文件的路径和文件名的格式。\n\
  \n有些人可能认为第 2.7 节中提出的示例规范有些极端，但请记住，组织的需求随着时间的推移而增长，高估未来需求比低估好。在接下来的步骤中，首先我们简要回顾主要的版本控制系统类型，然后我们将描述为什么整个小组遵循标准的编码方案是重要的。\n\
  \n\n\n\n版本控制是一种用于跟踪和记录单个文件或一组文件更改的系统。它允许用户将文件或一组选定的文件恢复到之前的版本，将整个项目回溯到之前的阶段，比较项目或文件已做的更改，查看最后一次修改文件的人等。通常情况下，版本控制系统（VCS）会记录文件的所有更改并带有时间戳进行存储。版本控制系统主要有类型：\n\
  \n1. **本地 VCS（Local VCS）：** 修订控制系统（`RCS`）是此类中最具代表性的。这是一种早期的 VCS，用途非常局限。它易于使用但缺乏安全特性。所有的更改都将存储在用户的本地计算机上，不建议用于具有多个用户的大型项目（Chacon\
  \ et al. 2014）。\n\n2. **集中式 VCS（Centralized VCS）：** 这些系统是为使用不同系统的开发者小组开发的。`CVS`、`Subversion`\
  \ 和 `Perforce` 是一些著名的集中式 VCS。该系统拥有一个包含所有版本文件的单一服务器，每个客户端访问主服务器以检查版本并撤销更改。与上一代相比，这是一项重大改进。主要的缺点是它对单个服务器的依赖（Chacon\
  \ et al. 2014）。\n\n3. **分布式 VCS（Distributed VCS）：** 在这类 VCS 中，每个客户端都拥有文件历史的完整副本。`Git`\
  \ 是该类别中最为人知的 VCS 之一。由于每个客户端都有仓库的副本，该系统对服务器故障不敏感，事实上，通过客户端计算机上的副本重新构建服务器仓库是轻而易见的（Chacon\
  \ et al. 2014）。\n\n`Git` 是世界上使用最广泛的版本控制系统。`Git` 是一个开源且活跃维护的项目，最初由 Linus Torvalds（Linux\
  \ 操作系统内核的创建者）开发。`Git` 具有分布式架构，被认为是一种分布式版本控制系统（DVCS）。`Git` 的开发考虑了性能、安全性和灵活性（Atlassian\
  \ Git Tutorial 2019）。\n\n如今，几乎所有的服务器都安装了某种版本的 VCS（不安装是不明智的），但在配合 EHR（电子健康记录）数据库使用\
  \ VCS 时需要注意。由于 EHR 数据本质上的敏感性以及 1996 年的《健康保险可流动性与责任法案》（HIPAA 法），原始 EHR 数据的所有者可能禁止您的组织在客户端计算机上创建全部甚至部分数据的副本，或禁止将其上传到云存储服务器。这些限制减少了可用软件或应用程序的范围。因此，分布式\
  \ VCS 如 `Git` 以及云平台如 `Google Cloud` 或 `Amazon Web Services` (`AWS`）可能不是从 EHR 数据库提取的文件的版本控制的选择。在这种情况下，集中式\
  \ VCS 可能是更好的选择。\n\n### 2.3.4 编码规范\n\n由于 EHR 研究小组的团队成员需要依赖其他成员的代码和输出，因此强烈建议所有团队成员遵循标准的编码方案。网络上有许多关于如何在编码中遵循标准格式的优质资源。这里我们列出其中一些重要的：\n\
  \n* 序言注释（Prologue comments）：程序员名称、程序描述、日期等。\n* 为每个变量和常量编写文档。使用有意义的变量（不要使用单字母变量）。\n\
  * 使用标准的缩进和间距。\n* 使用注释描述您的代码。\n\n#### 面向对象或非对象编程\n\n在面向对象编程（OOP）中，计算机程序从类创建对象，这种范式有助于与其他\
  \ OOP 代码进行交互（Potok et al. 1999）。许多开发者推荐使用面向对象编程。由于 EHR 数据通常被多个开发者或团队成员使用，且这是一个多步过程，面向对象的编码可以提供良好的支持。在这种设置下，面向对象的编码是更好的选择。面向对象的代码可以被团队成员调用，并需要跟踪。\n\
  \n\n\n\n\n### 3. 数据管理员\n数据管理员负责数据服务器或多个服务器的维护，以确保数据库的功能、质量、完整性和稳定性。有时，数据管理员也可以兼任\
  \ IT 支持工作。对于电子健康记录（EHR）数据研究，建议数据管理员从医学或临床角度熟悉 EHR 数据库的常见结构以及各数据字段之间的关系。\n\n### 4.\
  \ 数据科学家与统计学家\n这些团队成员在如何使用高级分析方法从数据中提取洞解方面具有所需的专业知识。他们通常拥有强大的编程能力，并对统计学有深入的理解。因此，数据科学家应该在计算机科学和统计学方面拥有深厚的背景。对于\
  \ EHR 大数据研究，建议数据科学家既熟悉生物统计学方法，又具备医学术语背景。\n\n### 5. 医学与临床专业人员\n任何 EHR 研究项目都至少需要一个具有临床知识和对当前项目特定主题具有专业知识的团队成员。临床医生应该从研究开始就开始参与，以便指导团队完成\
  \ EHR 数据研究的各个方面（从数据提取到分析和生成交付物，参见上方的图 2.1）。\n\n### 6. 健康管理人员\n对于 EHR 研究中的某些特定主题，引入具有健康管理系统知识的团队成员将极具价值。此类团队成员可以明确数据的生成过程、定义数据源、识别哪些数据源更可靠、描述哪些数据字段之间存在相互关系等。例如，存在不同类型的编码系统（如\
  \ ICD-9、ICD-10、CPT、HCPCS 等），具有健康管理经验/知识的团队成员可以告诉哪种编码系统对于获取所需信息价值。\n\n### 7. 其他团队成员\n\
  EHR 数据研究的每个方面通常需要一个以上的团队成员。根据项目的复杂性，多个团队成员可以担任数据管理员、数据科学家等角色。在这种情况下，建议从上述每个类别中各选一名高级成员担任小组小组。\n\
  \n\n\n用于最终数据分析的数据处理和准备步骤。\n\n通常情况下，一个由经验丰富的团队成员组成的小型团队比一个由缺乏经验的团队成员组成的大团队更高效。但是，如果项目经理犹豫是否加入新团队成员，他/她将限制发现创新想法的概率。最好的方法可能是建立一个由经验成员和新成员组成的平衡团队，以兼顾两者的优势。\n\
  \n### 2.4.2 如何高效地管理多学科团队？\n\n\n*   **不要假设所有团队成员都有相同的目标。** 在多学科团队中，每个团队成员都有不同的技能和能力，并且他们可能有不同的背景。因此，他们对项目目标的理解可能有所不同。例如，临床医生可能更关注项目的临床应用，而统计学家可能对方法论感兴趣（即使该方法可能没有实际应用）。\n\
  *   **了解团队成员的能力。**（注：内容根据上下文合并）。\n*   **使用正确的资源和工具。**（注：内容根据上下文合并）。\n*   **为团队创建一个社区。**（注：内容根据上下文合并）。\n\
  \n### 2.4.3 任务管理\n任务管理是项目经理的基本职责之一。良好的任务管理会提高生产力。项目经理应该：\n\n1. 定义任务及其要求。\n2. 为每项任务设置优先级。\n\
  3. 根据可用资源为每项任务设置合理的完成时间。\n4. 为可能延迟或改变任务的意外情况留出缓冲时间。\n5. 根据团队成员的能力分配任务。\n6. 跟踪每个任务的进度。\n\
  7. 有时更新任务及其优先级。\n8. 创建项目进度报告并与团队成员讨论。\n\n对于 EHR 数据研究等复杂项目，建议团队使用任务管理工具更好地监控进度。甘特图已成为任务可视化的标准方法（参见图\
  \ 2.2）。在下一节（2.5 节）中，我们将回顾此目的的一些知名工具。\n![任务管理的甘特图示例。](img/fig2_2.jpg)\n\n## 2.5 管理方法与软件工具\n\
  在本节中，我们对目前用于项目和文件管理的常用方法/工具进行要介绍。我们将描述如何利用这些工具开发一个示例的数据/项目管理框架。请记住，我们在本章后续章节（2.6\
  \ 节）中描述的框架可以（并且应该）经过修改以满足每个研究团队的具体需求。\n\n有很多项目管理工具，但在本节中介绍了三种最流行的工具的简要描述。我们应该强调，尽管后两种软件工具主要用于创建一个协作工作平台，并在团队之间以及团队成员之间共享文件和内容（因此不被视为纯项目管理软件），但它们有足够的能力作为项目管理框架。\n\
  \n*   **Microsoft Project**：该工具是一种设计在本地计算机上运行的项目管理软件。Microsoft Project 是一款知名的项目管理软件，具有一些高级功能。然而，它是为本地计算机设计的，不建议用于\
  \ EHR 项目管理。\n\n\n\n\n\n*   **用于项目管理的 Slack：** `Slack` 是一种云端项目管理/协作软件。目前，它是可用的第二常用的项目管理/协作软件。团队成员共享和协作文件、即时消息、群聊以及视频会议是该软件的主要卖点。与我们的下一种项目管理软件相比，`Slack`\
  \ 的设置更加简单。\n\n*   **Microsoft Teams：** 这个云端项目管理/协作工具是最常用的。`Microsoft Teams` 的功能与\
  \ `Slack` 类似，但限制更少。例如，与 `Slack` 相比，`Microsoft Teams` 可以参与视频会议的人数更多。此外，它与其他 Microsoft\
  \ 产品兼容（如 `Microsoft Office` 套件），并且在 `Microsoft Teams` 中可以使用越来越多的扩展插件。因此，`Microsoft\
  \ Teams` 是大型组织更受青睐的项目管理/协作工具。\n\n与上节节讨论的论点类似，如果 EHR（电子健康记录）数据所有者强制要求，团队成员应避免在任何云端存储服务器（如\
  \ `Slack` 或 `Microsoft Teams`）上共享患者数据文件。共享一组患者的报告或论文通常是可以接受的，但团队负责人应该熟悉与 EHR 数据所有者的合同细节，以防止法律和伦理问题。\n\
  \n对于单个项目，项目管理软件的选择通常由组织规定。大多数情况下，为一个或少数项目购买新的项目管理软件或工具在时间和成本上并不高效（请记住，新软件意味着需要对团队成员培训）。因此，项目管理软件的选择非常有限。如果项目经理有选择项目管理软件/工具的自由，由于上述原因，`Microsoft\
  \ Teams` 可以是一个很好的选择。\n\n\n## 2.6 数据管理框架示例\n\n在本章的剩余部分中，我们将描述一种由我们德克萨斯州大学健康科学中心休斯顿公共卫生学院团队使用的数据管理框架。我们有多个团队致力于不同的\
  \ EHR 研究项目和其他大数据项目（例如，`Cerner`、`UK Biobank`、`GEO` 等等）。每个团队都专注于一个或多个患有特定疾病的患者队列（例如基于\
  \ `Cerner` EHR 数据库的 `蛛网膜下出血 (SAH)` 项目或 `HIV/AIDS` 项目），且每个项目都有一个或多个子项目（例如 SAH 项目内的收缩血管比较和死亡率预测子项目）。`SAH`\
  \ 队列由 EHR 数据库中 2000 年至 2018 年间有 `蛛网膜下出血 (SAH)` 诊断史的所有患者组成，包含约 50,000 名患者。`AIDS`\
  \ 队列由 EHR 数据库中同一时期 HIV 阳性检测的所有患者组成，包含约 100,000 名患者。\n\n在本节中，我们将根据我们在这些正在进行的 EHR\
  \ 研究项目中的经验描述一个数据管理框架。我们假设您的数据管理团队已经建立了可靠的数据泄露防护结构，并且您的组织准备好了协作/项目管理工具。我们从一个建议的文件夹结构（非\
  \ Windows 操作系统中的目录结构）开始，并将对文件夹和文件的命名方式设定一个约定。\n\n### 2.6.1 文件夹管理\n\n以下命名和文件夹结构约定应被视为示例。每个组织都应根据其需求创建自己的文件和文件夹结构以及命名约定。以下规则可以作为一个良好的起点。\n\
  \n#### 命名\n\n文件和文件夹名称的通用格式有两种主要方法。第一种方法是使用 `separate_each_word_with_underscore`（下划线分隔每个单词），第二种方法是使用\
  \ `CamelCaseTheFirstLetter`（首字母大驼峰）。通常推荐第一种方法，因为它使名称更具可读性。在该框架中，我们将使用第一种。在建议的方法中，文件夹名称中的每个单词应以大写字母开头，后跟小写字母（“and”、“of”等除）。允许字符是区分大小写的字母数字（A-Z,\
  \ a-z, 0–9）和 `_`（下划线）。\n\n避免在名称中使用 `\" \"`（空格），因为这可能会导致某些代码或软件出错。使用缩写词将缩短名称长度，非常建议这样做。不要将日期作为文件夹名称的一部分，因为通常没有意义，如果必要，可以在我们稍后描述的数据管理框架中单独添加。以下示例显示了某些可接受和不可接受的文件夹名称：\n\
  \n*   `SAH`、`Cerner`、`UK_Biobank`、`HT_and_HF`：**接受且推荐。**\n\n*   `Hypertension_and_Heart_Failure`、`SubarachnoidHemorrhage`：**接受但不推荐。**\n\
  \n*   `UK Biobank`、`SAH_20190128`、`Cerner$`：**不可接受。**\n\n#### 结构\n\n你应该创建一个文件夹来包含你部门或研究中心的所有文件。出于安全和维护考虑，最好不要在这些文件夹中包含实际数据库名称。在这个示例中，包含所有数据的主文件夹命名为\
  \ `CBD_HS`，这代表我们的健康科学大数据中心 (CBD-HS)。子文件夹的通用结构如图 2.3\n\n\n\n\n文件夹的通用结构。\n\n\n\n\n\
  SAH 项目的一部分及其主要的上下级子文件夹。\n\n图 2.4 显示了死亡率预测子项目的一部分及其主要的上下级子文件夹。在后续部分，将介绍每类型子文件夹的细节。\n\
  \n在此框架中，我们定义了四个用户组。后续章节将描述每个用户组的详细信息，但访问权限将在每个文件夹旁边描述。这些用户组是：\n\n*   `Super_admin`。\n\
  \n*   `Admin`。\n\n*   `Project_manager`。\n\n*   `Regular_user`。\n\n##### 主文件夹\n\n\
  ###### `CBD_HS`\n\n这是包含所有项目数据的根文件夹。\n\n*   具有读取/执行权限的用户组：`Super_admin`、`Admin`、`Project_manager`、`Regular_user`。\n\
  \n*   具有写入权限的用户组：`Super_admin`、`Admin`。\n\n每个小组或团队在 `CBD_HS` 中都有自己的文件夹。只有管理员可以创建小组（通过创建新文件夹）。项目经理对其对应小组的内容拥有写入权限，但不能创建小组。\n\
  \n每个小组或团队应至少有一个主项目，每个主项目应至少有一个子项目。例如，在图 2.5 中，我们创建了一个名为“Brownsville”的新研究小组。我们处于该研究的探索阶段。为了保持\
  \ `CBD_HS` 文件夹的正确结构，我们创建了一个名为 `Exploration` 的文件夹作为主项目，并在内部创建了名为 `Explore_1` 的文件夹。在创建文件夹树时保持这一约定至关重要，否则我们的数据管理框架可能会分类错误。\n\
  \n\n**图 2.5**\n\n\n\n向文件夹结构中添加新的小组或团队。\n\n###### `Public_Folder`\n\n\n\n\n\n项目经理无法访问个人用户文件夹，因此\
  \ `public_folder` 充当所有工作组或研究团队的共享媒体。用户可以将他们想要放置的文件存储在 `CBD_HS` 文件夹中，并通知相应的项目经理，然后由项目经理将这些文件移动到合适的位置。建议尽快执行这些操作，以防\
  \ `public_folder` 被文件填满。或者，您也可能想使用服务器的共享文件夹来实现此目的。\n\n- 具有读取/执行权限的用户组：`Super_admin`、`Admin`、`Project_manager`、`Regular_user`。\n\
  - 具有写入权限的用户组：`Super_admin`、`Admin`、`Project_manager`、`Regular_user`。\n\n## Admin\n\
  \n此文件夹供管理员使用：\n\n- 具有读取权限的用户组：`Super_admin`、`Admin`。\n- 具有写入权限的用户组：`Super_admin`、`Admin`。\n\
  \nAdmin 文件夹包含三个子文件夹（图 2.6）：\n\n1. 数据管理框架 (`DMF`)。此文件夹包含：\n    - `DMF` 核心。\n    -\
  \ 归档子文件夹，用于存储 `DMF` 核心的旧版本。\n2. `Network`。此文件夹包含：\n    - 当前网络状态。\n    - 当前网络状态图对象。\n\
  \    - 归档子文件夹，用于存储网络结构和状态的旧版本。\n3. `Manual`。此文件夹包含：\n    - 为管理员准备的数据管理框架设置和使用手册。\n\
  \    - `Extras` 子文件夹，用于存储手册中图像和额外文件。\n    - 归档子文件夹，用于存储手册的旧版本。\n\n\n**图 2.6**\n\n\
  Admin 文件夹结构。\n\n## Useful_Info\n\n创建此文件夹是为了共享教育和其他材料，例如 `ICD-9` 或 `ICD-10` 字典，这些材料对所有工作组或团队都有用。\n\
  \n- 具有读取/执行权限的用户组：`Super_admin`、`Admin`、`Project_manager`、`Regular_user`。\n- 具有写入权限的用户组：`Super_admin`、`Admin`。\n\
  \n`DMF` 不映射此文件夹的内容。如果此文件夹中的任何文件被任何项目使用，应将该文件的副本放在 `CBD_HS/Working_Group/Project/Sub_Project/Raw_Data/Extras/`\
  \ 文件夹中，并使用此路径处理依赖。依赖关系和 `DMF` 的概念将在后面讨论。\n\n### Group Folders\n\n每个研究组或团队应创建一个文件夹（例如\
  \ `Cerner`、`UK_Biobank`）。这些文件夹包含了所有的项目和数据。\n\n- 具有读取/执行权限的用户组：`Super_admin`、`Admin`、相应的\
  \ `Project_manager`。\n- 具有写入权限的用户组：`Super_admin`、`Admin`。\n\n### Project Folders\n\
  \n此文件夹用于工作组中的每个项目。它包含至少一个子项目和一个 `Main_Raw_File` 文件夹，用于存储从数据库中提取的数据。此主原始文件供所有子项目共享。\n\
  \n- 具有读取权限的用户组：`Super_admin`、`Admin`、相应的 `Project_manager`、同一项目的用户。\n- 具有写入权限的用户组：`Super_admin`、`Admin`、相应的\
  \ `Project_manager`。\n\n### Sub_Project Folders\n\n- 具有读取权限的用户组：`Super_admin`、`Admin`、相应的\
  \ `Project_manager`、同一项目的用户。\n- 具有写入权限的用户组：`Super_admin`、`Admin`、相应的 `Project_manager`。\n\
  \n每个子项目应创建以下子文件夹（文件夹开头的数字用于显示数据的分步处理过程）：\n\n1. `01_Raw_Data`：\n    - 它包含针对每类提取的原始数据的多个文件夹。建议为不同类别的原始数据创建单独的文件夹（它们可以是空的），以提醒可能需要从数据库中提取数据的表，并便于未来的扩展。如果子项目正在使用\
  \ `Main_Raw_Data`，则这些文件夹将是空的。但如果子项目需要其特定的数据，则应将其放在这些文件夹中，以防止多个子项目之间产生混淆。即使主项目中只有一个子项目，也应该应用相同的规则，因为未来可能会添加其他子项目。每个类别中的都应该有一个\
  \ `Archived` 子文件夹来存储旧版本（图 2.6）。\n    - `Extras` 子文件夹，用于存储杂项文件或从 `Useful_Info` 主文件夹复制的文件。\n\
  2. `02_Cleaned_Data`：\n    - 与 `Raw_Data` 相同，包含针对每类清洗数据的多个文件夹。\n    - `Extras` 子文件夹，用于存储杂项文件。\n\
  3. `03_Prepared_Data`：\n    - 与 `Raw_Data` 相同，包含针对每类准备好的数据的多个文件夹。如果文件是通过使用多个清洗或原始文件准备的，并且包含关于多个类别数据的信息，则应由相应的项目经理判断大多数字段的类别，并将其放在合适的文件夹中。最好避免创建新文件夹或将其放在\
  \ `Extras` 文件夹中。\n    - `Extras` 子文件夹，用于存储杂项文件。\n4. `Reports`：\n    - 它包含针对每个报告的多个子文件夹。这些文件夹中的每一个都应该有一个\
  \ `Archived` 子文件夹来存储旧版本。\n    - `Extras` 子文件夹用于存储杂项文件。\n5. `Papers`：\n    - 它包含针对每篇论文的多个子文件夹。这些文件夹中的每一个都应该有一个\
  \ `Archived` 子文件夹来存储旧版本。\n    - `Extras` 子文件夹用于存储杂项文件（图 2.7）。\n\n\n**图 2.7**\n\n\
  SAH 项目、预测子项目的原始数据结构。\n\n### 2.6.2 文件管理\n\n#### 命名\n\n与文件夹命名方式相同，文件名中的每个单词应以大写字母开头，后跟小写字母（“and”、“of”等除外）。允许的字符为字母数字（A-Z,\
  \ a-z, 0-9）和 `_`。文件名包含四个部分。每个部分之间用 `_` 分隔：Project_Category_Extra_YYYYMMDD\n\n1.\
  \ 项目/子项目名称：（例如 `SAH`、`HT` 等）。尽可能短。此部分应在所有文件中重复。例如，如果 `Mortality_Prediction` 子项目的项目经理决定以\
  \ `SAH_Mortality` 开始命名文件，则该文件夹中的每个文件都应以 `SAH_Mortality` 开头。\n2. 类别：文件所属的类别（例如 `Demographic`、`Labs`\
  \ 等）。\n3. 额外：应尽量减少使用。长文件名在可视化时效果不好，并增加代码行数。\n4. 日期（也称为版本）：以 `YYYYMMDD` 格式的文件。这种格式有助于按日期排序文件。你可以使用版本代替日期，但日期包含的信息更多且不易歧义。\n\
  \n添加文件类型（raw_data, cleaned_data, ...）是没有必要的，也不推荐的。例如：\n\n- `SAH_Mortality_Demographic_20190110.csv`：**可以接受且推荐。**\n\
  - `SAH_Demographic_version_1_reduced_20190110.csv`：**可以接受但不推荐。**\n- `SAH_Demographic.csv`：**无效（缺少日期）。**\n\
  - `SAH_Demographic_2019_01_10.csv`：**无效（日期格式错误）。**\n- `SAH_Demographic_20193005.csv`：**无效（日期格式错误，日期在前于月份）。**\n\
  \n如果文件得到了更新但数据结构保持相同（字段名称和格式相同），项目经理应仅文件名中的日期部分，保持其他部分不变。更改文件的其他部分将被 `DMF` 识别为具有不同格式。\n\
  \n#### 结构\n\n\n\n\n文件数据结构应尽可能保持固定。例如，如果某一列被格式化为整数，那么最好保持为整数。更改列格式可能会导致其他代码出现错误。如果需要更改列格式且这种变化不可避免，项目经理应该更改文件名（例如在文件名中添加版本号），或通知管理员将\
  \ DMF 中的文件状态设置为 `Updated (New structure)`，以便受影响的用户可以更新其代码并进行相应的更改。\n\n列名中的每个单词应全为小写字母，除非是缩写。允许的字符是区分大小写的字母数字（A–Z,\
  \ a-z, 0–9）和 `_`（下划线）。列名中不应重复。\n\n对于 `date_time` 字段，应使用 `YYYY-MM-DD HH:MM:SS` 格式。如果\
  \ `date_time` 字段仅日期日期，则 `HH:MM:SS` 部分应为 `00:00:00`。这种方法可以减少代码的复杂性和错误。`Project_managers`应该双检文件的数据结构，并确保数据没有结构性变化。\n\
  \n### 文件提交\n\n如前所述，在创建新文件（报告、论文、数据）后，用户应通知相应的项目经理，然后将文件复制到 `Public_Folder`。项目经理将把文件移动到相应的文件夹中。每个文件都应该带有一个\
  \ readme 文件和一个代码（如果适用）。readme/code 文件名应与主文件相同，但在日期之前添加 `Readme/Code`。例如：\n\n* 主文件：`SAH_Mortality_Demographic_20190110.csv`\n\
  * Readme 文件：`SAH_Mortality_Demographic_Readme_20190110.docx`\n* 文件的代码：`SAH_Mortality_Demographic_Code_20190110.R`\n\
  \n用户应使用附录中的标准文件提交表作为 readme 文件的模板。\n\n\n#### 用户组\n\n该框架定义了四种用户组（图 2.8）：\n\n1. **超级管理员\
  \ (Super Admin):** 我们研究部门或中心的负责人（例如，`CBD-HS Director`）。拥有所有的管理员权限 + 并可以添加/删除管理员账户。这通常是一个法律实体。\n\
  2. **管理员 (Admin):** 拥有所有的项目经理权限 + 可以创建 `project_manger_group` 并将用户添加到这些组中 + 可以添加/删除新组（例如，Cerner,\
  \ UK biobank）。主要责任是 DMF 及相关文件的运行/更新/维护以及用户管理。\n3. **项目经理 (Project managers):** 可以创建项目特定的文件夹和文件。主要责任（除通用的项目经理职责外）是保持文件名称和结构的一致性，并在时向管理员报告更改。\n\
  \n   每个项目都有一个独立的项目经理用户组。例如，`Cerner_SAH_Project_Manager` 是 Cerner 组中 SAH 项目的用户组。该组的成员负责管理\
  \ `CBD_HS/Cerner/SAH` 文件夹中的文件和文件夹。\n4. **普通用户 (Regular users):** 负责项目的不同方面。\n\n\n\
  **图 2.8**\n\n用户组层级结构。\n\n每个文件夹的访问管理已在上节（第 2.6.1 节）中讨论过。\n\n### 2.6.4 数据管理框架\n\n\
  现在我们有了一个可靠且安全的服务器，并有一套详细的命名和组织文件文件夹的约定，但仍然存在一个非常重要的问题——可复现性。能够从 EHR 研究项目中重现数据文件、报告和结果是至关重要的。你组织的其他部分或其他外部组织想要查看你是如何产生特定结果的，并不罕见。拥有混乱的数据会让这项任务具有挑战性甚至不可能。我们在上一节中描述的步骤为创建数据管理框架奠定了基础。首先，我们需要注意\
  \ EHR 数据分析是一个多步骤的项目，每一步通常依赖于上一步的数据（参见 图 2.1 和 第 1 章）。这意味着每个数据文件或报告都依赖于其他数据或报告。我们可以使用有向无环图来可视化这些依赖关系，并创建一个半自动框架来重现数据和分析结果。为了描述这个框架，我们从一个示例项目开始（图\
  \ 2.9）。\n\n\n**图 2.9**\n\nDMF 中数据结构的示例。\n\n为了保持简单，我们描述了来自 Cerner EHR 工作组的 SAH 项目的一个虚拟子项目（死亡率预测）。实际的网络更大、更复杂，但框架的功能对所有项目都是相同的。如你所见，我们可以将数据层级分层排列。图中的每个形状被视为一个节点。研究中心（`CBD_HS`）、小组（`Cerner`）、项目（`SAH`）和子项目（死亡率预测）层不是数据节点，但它们帮助我们跟踪更改并组织下游节点（特定节点下方的节点）。提取的数据（例如，提取的实验室表）、清洗的数据（清洗后的实验室表）、准备的数据（准备好的实验室表）、报告（1）、论文（1）被视为数据节点。\n\
  ![图 2.10 DMF 中的边和节点属性](img/fig2_10.jpg)\n\n**图 2.10**\n\nDMF 中的边和节点属性。\n\n在图 10\
  \ 中，我们展示了 SAH 项目中下游死亡率预测项目的网络部分。在这个网络中，每个节点和每条边都有特定的属性。边的属性是连接上游节点到下游节点的代码。例如，连接清洗的药物（上游节点）到准备的药物（下游节点）的边具有属性\
  \ `准备代码 1(PC1)`。边的某些属性是网络固有的，例如由边连接的节点。我们没有在图中显示这些基本属性。边的另一个添加项可以是执行时间，这样未来管理员可以计算更新\
  \ DMF 中所有节点所需的大致估计时间。\n\n同样，每个节点都关联以下属性元素：\n\n**名称:** 不包含日期部分的文件名（根据文件夹和文件命名约定去掉最后八位）。DMF\
  \ 可以在扫描 `CBD_HS` 文件夹时记录它。\n\n**类型:** 节点所属的层。同样，此元素可以由 DMF 在扫描 `CBD_HS` 文件夹时生成。\n\
  \n**依赖关系:** 生成当前节点所需的上游节点。创建文件的用户（或用户）应通知项目经理或管理员依赖关系。这些依赖关系应包含在数据提交表（附录）中。\n\n\
  **代码（如适用）:** 在依赖关系上执行以创建当前节点所需的代码。当用户创建文件并将其放入 DMF 时，应提交运行该代码的代码或命令。\n\n\n\n\n**Users：**\
  \ 参与生成当前节点的节点。此属性将根据数据提交表进行记录。可以使用 `User ID` 获取用户（们）的邮箱地址。\n\n**Date：** 根据文件夹和文件命名规范，文件名的最后八位字符。它可以在\
  \ `DMF` 扫描 `CBD_HS` 文件夹时记录。\n\n在图 2.10 中，我们展示了每层中一个节点的属性。`DMF` 中的每个节点都具有相似的属性结构和信息。\n\
  \n你可以通过三种不同的方式设置 `DMF` 来更新网络：\n\n1. 当文件添加到 `CBD_HS` 文件夹或子文件夹时，立即更新网络。\n\n2. 在预定义的日期和时间更新网络（例如每天午夜）。\n\
  \n3. 当 `DMF` 管理员运行 `update command` 时更新网络。\n\n现在，我们将描述 `DMF` 在以下场景中的行为：\n\n### 场景\
  \ 1—添加新文件\n在此场景下，`DMF` 将扫描 `CBD_HS` 文件夹及其子文件夹，并检测新文件。通过使用规范，它可以决定将新文件（新节点）放在哪层，并可以根据上述描述的文件提交表创建新节点的属性（见图\
  \ 2.11）。\n\n**图 2.11**  \n\n场景 1：将新提取的程序数据添加到 DMF。\n\n### 场景 2—更新文件（相同的数据结构）\n在此场景下，`DMF`\
  \ 将扫描 `CBD_HS` 文件夹及其子文件夹，检测更新日期（文件名的最后八位字符），并将其标记为“已更新”（相同结构）节点。然后，`DMF` 将检测所有受新更改影响的下游节点，并将它们标记为“需要更新”。如果下游节点是由代码生成的，它可以重新生成下游节点；否则，该节点将保持在“需要更新”状态（图\
  \ 2.12）。通过使用受影响节点的属性，`DMF` 将（通过电子邮件或其他消息服务）通知所有受影响的用户。在图 2.12 中，带有白色圆圈的边具有关联代码。\n\
  \n**图 2.12**  \n\n场景 2：更新文件（相同的数据结构）。\n\n### 场景 3—更新文件（新的数据结构）\n在此场景下，`DMF` 将扫描\
  \ `CBD_HS` 文件夹及其子文件夹，并检测新的文件名。如果它是作为新文件提交的，则继续场景 1；但如果它是根据文件提交表具有新数据结构的现有文件（即代码无法应用于它），则应将其标记为“已更新”（新结构）节点。然后，`DMF`\
  \ 将检测所有受新更改影响的下游节点，并将它们标记为“需要更新”（图 2.13）。通过使用受影响节点的属性，`DMF` 将（通过电子邮件或其他消息服务）通知所有受影响的用户。\n\
  \n**图 2.13**  \n\n场景 3：更新文件（新的数据结构）。\n\n该数据管理框架 (`DMF`) 将是半自动的，并在适用时更新数据文件和报告。`DMF`\
  \ 管理员可以添加一个功能，使用哈希函数为每个文件创建一个唯一 ID，用以存储文件的名称和日期。创建此类 ID 可以消除在编码中使用长路径的需要，并有助于保持良好的数据结构。\n\
  \n## 2.7 讨论与总结\n\n对于每个 EHR 研究项目，高效地管理数据、计算机代码、文件、报告和产品至关重要，这样资源就可以被共享和利用，并确保研究结果的可重复性。我们总结了一些关于\
  \ EHR 项目管理的建议如下：\n\n**确保您的数据安全**。采取必要措施，通过使用备份、版本控制系统以及防病毒软件和防火墙（硬件和软件）确保您的数据安全。\n\
  \n**尽早制定规范**。正如我们在本章中讨论的，尽早制定文件、文件夹和编码规范更好。在收集大量文件后重新组织文件并重写代码可能是一项挑战性任务。\n\n**征求团队成员对规范的意见**。每位数据科学家在存储文件和编码方面都有自己的习惯（因此有些人的习惯更乱）。适应新的编码习惯、`变量`\
  \ 命名以及文件和文件夹的命名对某些人来说可能是困难的，他们可能会犹豫于这样做。在项目初期，让尽可能多的成员参与规范的制定是非常重要的。通过这样做，首先，你可以制定出更好的规范；其次，你的团队成员采用新规范将变得更容易。\n\
  \n**遵守规范**。在确定规范后，每个人必须遵守它。如果某些成员不遵守规范，可能会让其他成员感到气馁。请记住，任何项目和数据管理框架都依赖于预定义的规范。\n\
