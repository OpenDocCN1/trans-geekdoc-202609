  \n\n\n\n\n机器学习（ML）的含义对于不同研究和应用领域的人来说可能有所不同。简单而言之，这里的机器学习指的是一类广泛用于数据探索和分析的统计与计算方法、理论和工具。与传统的统计方法相比，机器学习方法主要是以数据为驱动的，并且可能不依赖于预先指定的机制模型。以从数据中提取隐藏知识为目标，通常可用于学习任务的样本数量越大，机器学习算法的性能越好。得益于其强大和灵活性，机器学习成为研究人员和科学家解决涉及大量变量的大集的各种复杂问题的流行选择。总的来说，机器学习方法可以分为几类：监督学习、无监督学习、半监督学习和强化学习。\n\
  \n如 Shobha and Rangaswamy (2018) 所述，监督学习主要采用两类技术：1) 分类技术，用于预测离散响应（二分类或多分类）；例如，患者患上某种疾病或状况的风险类别；2)\
  \ 回归技术，主要用于预测连续响应；例如患者生命体征的变化（如血压或体温）。常用于分类和/或回归的机器学习算法示例包括 k-近邻（KNN）、朴素贝叶斯、线性模型、袋装和提升决策树、随机森林、支持向量机（SVM）以及神经网络。\n\
  \n如今，监督学习已广泛应用于医疗保健领域，如疾病诊断、疾病风险预测或死亡率/结局预测。一些示例包括研究人员利用电子健康记录（EHR）数据库中的丰富信息预测心脏病导致的住院（Dai\
  \ et al. 2015）、预测 2 型糖尿病风险（Mani et al. 2012）或预测癌症患者 6 个月死亡率（Parikh et al. 2019）。在前两个章节中，我们讨论了用于\
  \ EHR 数据分析和预测的统计方法、神经网络和深度学习方法。在本章中，我们关注一些选定的监督学习技术。我们将简要描述这些监督学习技术，然后通过一个关于蛛网膜下出血（SAH）患者死亡预测的\
  \ EHR 应用项目来说展示它们的用处。我们还将基于 SAH 数据集比较这些机器学习方法的性能。\n\n## 10.2 机器学习方法\n\n### 随机森林\n\
  \n为了理解随机森林，我们需要从定义决策树的概念开始。简而言之，决策树是一种利用分支树状图的决策工具。令 `S` 为包含 `n` 个样本 `(x[1], y[1]),\
  \ …, (x[n], y[n])` 的训练集，其中 `x[i]` ∈ `X` 是输入实例，`y[i]` ∈ `Y` 是与每个 `x[i]` 相关的类别标签。决策树是一个分类器\
  \ `h: X → Y`，它通过在树结构上做出系列决策来预测 `x` 的标签 `y`。一个典型的决策树从根节点开始，算法随后根据训练集中所有属性的多数票表决结果为该节点分配一个标签。当我们从根节点移动到叶子节点时，必须执行一系列测试。对于每个测试，我们检查分裂单个分支节点的影响。熵（或增益）用于帮助算法找到最适合分裂的数值或类别特征。然后算法查看与每次分裂产生的增益相关的改进；在所有可能的分裂中，我们选择增益最大的那一个，或者如果进一步分裂没有导致增益增加，我们就停止。如果达到预设的树的最大深度，该过程也可以结束。\n\
  \n简单决策树的示例见图 10.1。典型的决策树从根节点开始，算法随后根据训练集中所有属性的多数票决结果为该节点分配一个标签。当我们从根节点移动到叶子节点时，必须执行一系列测试。对于每个测试，我们检查分裂单个分支节点的影响。熵（或增益）用于帮助算法找到最适合分裂的数值或类别特征。然后算法查看与每次分裂产生的增益相关的改进；在所有可能的分裂中，我们选择增益最大的那一个，或者如果进一步分裂没有导致增益增加，我们就停止。如果达到预设的树的最大深度，该过程也可以结束。\n\
