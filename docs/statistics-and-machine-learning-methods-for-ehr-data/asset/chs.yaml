  \ 6% 的匿名纵性患者记录。数据收集追溯到 1994 年，具有国家级代表性 | `EHR` | ~750 万患者 |\n| | [`www.the-health-improvement-network.com/`](https://www.the-health-improvement-network.com)\
  \ | |\n| Amplity Health RealHealthData | `RealHealthData` 网络通过各种真实世界证据数据构建提供患者状况和双方互动独特角的数据库\
  \ | `EHR` | 大约 60%（住院）和 40%（门诊） |\n| | [`realhealthdata.com/`](https://realhealthdata.com)\
  \ | |\n\n在这本书中，我们根据探索和挖掘 `Cerner` `EHR` 数据库的经验，介绍了统计方法和机器学习方法。`Cerner` 是一家美国健康技术公司，为全球超过\
  \ 27,500 家机构提供各种服务，支持不同组织的临床、财务和运营需求。根据 `KLAS Research` 报告（Tate and Warburton 2019`），2018\
  \ 年 `Cerner` 在 `EHR` 系统市场占据了近 26% 的份额，与其他 EHR 公司相比，`Cerner` 与公立医院的合作更多。它的主产品是 `Cerner\
  \ Millennium`，这是一个允许医生或医院实时查看患者数据的 `EHR` 平台。\n\n\n### 3.3 EHR/EMR 数据库设计与结构：数据库查询\n\
  \n大多数 `EHR/EMR` 数据库系统基于关系数据库设计。`Oracle` 和 `Microsoft SQL server` 是大多数 `EHR/EMR`\
  \ 供应商常用的数据库管理系统 (`DBMS`)。当从供应商获取或购买医疗数据时，数据格式通常为文本文件（或 `csv` 文件）。例如，当我们购买 2018 版\
  \ Health Facts 数据库时，我们以 `csv` 文件格式接收了 EHR 数据。同样，公开可见的免费医疗数据通常以文本文件格式存在。此外，某些供应商（包括\
  \ `Cerner`）通过数据字典和数据库架构图提供其数据库结构的设计细节。我们从 `Cerner` 接收的数据字典文档解释了 Health Facts 中的数据集和数据元素，而数据库架构定义了数据库表、字段和关系。利用数据库设计的细节，可以创建一个数据库系统，用于托管和管理用于研究目的的医疗数据。\n\
  \n#### 3.3.1 数据库构建\n\n\n\n通常情况下，数据库系统的开发过程可以分为三个阶段：数据库设计、实现和数据库维护。数据库设计始于概念数据模型，并产生逻辑模式的规范。该阶段的输出是详细的关系型规范，即\
  \ `logical schema`，它包含了满足概念数据模型中数据描述所需的所有表和约束。实现包括根据 `logical schema` 规范构建数据库，这包括适当的存储模式规范、安全强化、外部模式等。最后，是数据库维护（包括运行维护），其目的是为了确保数据库系统的性能维持在可接受的水平，这需要团队成员之间进行有效的沟通，以根据需要确定并实施变更。\n\
  \n用于研究目的的 EHR（电子健康记录）数据库系统设计和构建应遵循从供应商处获得的模式文档描述。传统的关系型数据库设计最常见，但分布式数据库设计也是高效数据管理的有效选择。\n\
  \n### 3.3.2 传统关系型数据库系统\n\n基于关系数据模型的数据库系统在医疗数据管理中最为常用。在关系模型中，数据以表格的形式组织，通过关系关联，并受约束控制。著名的关系型数据库管理系统示例包括\
  \ `Oracle`、`Microsoft SQL server` 和 `PostgreSQL`。\n\n创建用于管理医疗数据的自定义数据库系统的步骤包括：\n\
  \n* 设置数据库环境（数据库服务器配置）\n* 创建模式和表\n* 在表中填充数据\n* 运行数据库服务器（启动服务器进程）\n\n### 3.3.3 分布式数据库系统\n\
  \n随着数据库规模的快速增长，为了提高数据处理、在线分析处理（`OLAP`）和在线事务处理（`OLTP`）的性能，`Apache Hadoop` 被作为一个在通用硬件集群上运行应用的框架。`Hadoop`\
  \ 提供了分布式文件系统（`HDFS`），在计算节点上存储数据，并实现了一种名为 `Map/Reduce` 的计算范式，其中应用程序被分成若干个小工作片段，每个片段可以在集群中的任何节点上执行或重新执行。`Apache\
  \ HBase` 建立在 `Hadoop HDFS` 之上，提供了实时读写大数据的能力。作为一种开源的分布式非关系数据库管理系统，`HBase` 参考了 `Google’s\
  \ Bigtable: A Distributed Storage System for Structured Data`，由 Chang 等人开发（Fay et\
  \ al., 2008）。\n\n与传统的 SQL 数据库（例如 `Oracle`、`Microsoft SQL`、`MYSQL`、`PostgreSQL`）不同，NoSQL\
  \ 数据库（例如 `HBase`、`MongoDB`、`Cassandra DB`）为非结构化数据（例如照片、视频、文档和文章）提供了更灵活的解决方案。它们通常是面向文档的。通过这种方式，非结构化数据可以存储在易于查找的文档中，但不一定会被分类到关系数据库的字段中。\n\
  \n对于 Cerner EHR 数据库，我们主要出于性能考虑采用了 `HBase` 框架，因为许多表具有数十亿条巨大的记录。在 `HBase Cluster`\
  \ 中，查询和分析性能得到了显著增强。对比显示，在双节点集群上速度提升了约 7 倍。\n\n![image](img/inline1_1.jpg)\n\n##\
  \ 3.4 数据提取\n\n### 3.4.1 定义数据提取的纳入/排除标准\n\nEHR/EMR 数据为研究人员提供了丰富的宝贵信息。挖掘这种潜力需要领域专家之间的协作。这一过程需要需要领域专家（例如临床医生）与数据分析师之间的合作，以识别重要课题。EHR/EMR\
  \ 数据是一个起点。领域专家和统计学家有必要合作以识别问题或假设。\n\n现在是确定问题或数据是否足够的时候，即要识别问题或标准。另一方面，领域专家和数据科学家紧密合作至关重要。这一过程有时并非易事，可能需要多次迭代，直到找到一个良好的假设。关于此点的更多讨论可以参见第\
  \ 1 章。一旦确定了问题或假设并明确了项目目标，就可以开始提取数据。为了目标问题提取适当的数据，我们需要明确定义纳入/排除标准。如果识别的问题或假设涉及疾病，则需要从\
  \ EHR/EMR 数据库中提取所有的诊断代码（例如 `ICD-9 codes`）。这可能不容易，因为有很多与疾病相关的诊断代码。在这种情况下，也可以使用自然语言处理（`NLP`）方法。有时，通过查看药物、治疗程序或实验结果记录，患者可能是确诊病例，但由于数据缺失或其他错误，记录中并没有疾病诊断代码或\
  \ `ICD-9 code`。在这种情况下，可以通过药物、程序和实验表识别更多与该疾病相关的患者。然而，这需要领域知识。最后，有必要通过严谨的程序通过正式的疾病表型来确认病例，将在下一节中讨论。\n\
  \n其他纳入/排除标准可能还涉及患者人口统计学（如年龄、性别或种族），或其他 EHR/EMR 表的数据（如药物、程序、实验、临床事件、生命体征或微生物表）。这些数据或变量中，一些准确，另一些具有很高的不确定性、缺失或错误率。准确识别符合所有纳入/排除标准的目标队列是很有挑战性的。\n\
  \n### 3.4.2 表型：队列识别\n\n从 EHR 数据库中提取数据的根本步骤之一是定义患者队列。特别是根据疾病诊断定义的队列，被称为电子“表型”。表型在不同的研究设计（如横断面研究、病例对照研究和实验性研究）中具有重要应用，用于识别具有感兴趣的患者队列。此外，表型也应用于生物信息学领域。将基因组数据与\
  \ EHR 衍生表型相结合的应用称为表型组，并在人类表型项目中进行了详细讨论（Denny 2013；Freimer and Sabatti, 2003）。\n\n\
  \n\n尽管如此，由于输入错误、计费编码偏差、数据缺失以及许多其他因素，准确识别感兴趣的研究队列并非易事。根据 EHR 数据类型，电子表型算法可以从基于结构化数据的基础基于规则的方法，到在非结构化数据上使用无监督模型的先进方法不等（表\
  \ 3.2）。基本上，表型学的通用方法包括基于规则的方法、机器学习（例如：自然语言处理 (NLP)、监督学习方法、潜变量方法、无监督学习方法）以及结合不同策略的混合方法（例如：基于规则和机器学习）。\n\
  \n## 1. 基于规则的方法\n\n当我们开始进行数据提取时，最直接的方法是利用目标疾病的国际疾病分类（`ICD`）计费代码从 EHR 数据库系统中获取数据。自\
  \ 1999 年以来，研究人员一直使用 `ICD-9` 代码来识别急性心肌梗死的患者（Petersen et al. 1999）。但 `ICD` 代码是为了计费目的，它们可能无法反映更复杂的慢性疾病的真实状态，这可能导致许多意外之外的分类错误。因此，在开发识别目标患者队列的规则或定义时，我们需要考虑更多变量，例如实验室结果、诊断代码和药物。在现实中，开发表型规则的过程通常涉及一位或多位医生根据具有明确诊断代码的结构化\
  \ EHR 数据库指定入和排除标准。开发表型标准是一个繁琐的过程，可能需要 6–8 个月才能完成（Kirby et al. 2016）。由于其复杂性，公开共享表型，以供其他医疗保健机构和研究机构进行验证和实施至关重要。这就是创建\
  \ `PheKB`（表型知识库）的原因。这是一个表型存储库，包含了 44 种不同疾病的开源表型。`PheKB` 上的大多数表型来自 `eMERGE`（电子病历与基因组学）网络。该网络是多个医疗中心的协作，专注于开发用于基因组研究的\
  \ EHR 表型定义（Gottesman et al. 2013）。`eMERGE` 负责大量的表型目录，包括 2 型糖尿病、心血管疾病和硬化症（Kho et\
  \ al. 2012, Ritchie et al. 2010）。例如，为了识别 2 型糖尿病（`T2DM`）患者，西北大学的研究人员开发了一种 2 型糖尿病的\
  \ `eMERGE` 定义（排除 `T1DM` cases），该定义考虑了 `HbA1c` 高于 6.5%、至少一个 `T2DM` 诊断代码以及至少一种降血糖药物。在三个不同的地点进行验证后，与临床医生审查相比，该定义产生的识别\
  \ `T2DM` 患者的正预测值达到了 98%（Kho et al. 2012）。因此，`eMERGE` 表型被认为是许多病例/队列研究中用于 `T2DM` 分类的可靠算法。\n\
  \n## 2. 机器学习方法\n\n由于许多临床环境中 EHR 数据的高缺失率，基于规则的方法可能敏感性较低。此外，基于规则的方法不具通用性。例如，糖尿病的定义无法用于甲状腺功能亢进。在存在大量疾病和综合征的情况下。\n\
  \n为了实现高通量表型分析，越来越多的研究使用机器学习来定义患者。自 2013 年以来，研究人员开始关注使用深度学习采用标准化术语。根据 Martin-Sanchez\
  \ 等人的研究，EHR 中捕获的数据 80% 是非结构化的（临床笔记、病理报告、出院摘要）。NLP 是一种经常与基于规则的方法相结合的有用技术。Xu et al.\
  \ 2010 开发了一种新的语言处理系统（`MedEx`），有助于从临床笔记中提取药物信息。Soysal et al. 2017](#ch03.xhtml#ref3_30)\
  \ 创建了 `CLAMP`（临床语言标注、建模和处理）作为一种多功能工具。Open Health NLP (`OHNLP`）是一个公共资源，研究人员可以在那里找到上述工具。使用这些\
  \ NLP 工具，Carroll et al. 2011 将 NLP 衍的概念提及与结构化数据相结合，为类风性关节炎创建了一个支持向量机（`SVM`）分类器。机器学习用于表型还有许多其他用例。Hubbard\
  \ et al. 2019 引入了一种贝叶斯潜表型方法，在没有金标准数据的情况下处理不完善和缺失。Huang et al. 2004 使用了一种名为 `FSSMC`（通过监督模型构建进行特征选择）的过程将\
  \ 410 个结构化变量减少到 47 个变量，然后对这些识别糖尿病患者性能最高的特征进行排序。Glicksberg et al. 2018](#ch03.xhtml#ref3_3)\
  \ 比较了使用不同机器学习方法对肝肾综合征进行表型分析的 AUC 性能。Beaulieu-Jones and Greene 2016](#ch03.xhtml#ref3_1)\
  \ 应用了嵌入方法来定义疾病队列，并采用去噪自动编码器来实现表型目标。\n\n除了标准的 ML 模型外，深度学习也被用于表型分析。深度学习方法的优势是它不需要任何特征选择，并且可以学习具有具有特征空间和大量患者的大型\
  \ EHR 数据集内部模式。Lipton et al. 2015](#ch03.xhtml#ref3_23) 使用循环神经网络（`RNNs`）对 128 种诊断进行多标签分类。Lasko\
  \ et al. 2013](#ch03.xhtml#ref3_21) 使用高斯过程回归对脏乱的纵向临床数据执行深度学习方法，产生了 AUC 为 0.97 的最终表型模型。更多关于\
  \ EHR 中深度学习方法的用例和综述可以在 Alzoubi et al. 2019](#ch03.xhtml#ref3_9) 中找到。\n\n在无监督学习方法中，使用\
  \ `Limestone`（一种非负张量分解技术）将未标记的数据聚类成具有未知医疗状况的不同患者组（Ho et al. 2014）。该方法的作者随后医学专家审查并验证顶层表型候选组的状况。\n\
  \n\n\n\n机器学习以及其他配备模型选择技术用于表型分析的统计方法，其一个很好的优点是它们可以推广到许多疾病。但其缺点是缺乏对分类结果的有效验证。研究人员通常使用基于规则的方法作为标记的金标准，然后基于标记的训练数据集构建基于机器学习的表型模型。Li\
  \ 等人 (2013) 使用了源自 eMERGE 定义的 2 型糖尿病（T2DM）患者的标记数据，并在标记数据上训练了 `Apriori` 算法，开发出名为 `ARM`（关联规则挖掘）的表型算法。该算法被认为是一种混合方法（结合了基于规则的方法和机器学习的方法），其性能优于单纯基于规则的方法。同样，Carroll、Yu\
  \ 等人 (2015) 使用来自两个公共网站 Medscape 和 Wikipedia 的医学概念作为金标准，从 EHR 中筛选特征。所提出的特征通过 NLP\
  \ 技术，仅保留 EHR 现有临床记录中提到的特征进行过滤。最后，作者将 `ICD-9` 代码和额外的注释加入特征空间，以构建最终的逻辑回归模型。\n\n####\
  \ 表 3.2 表型方法与数据类型\n\n| **方法** | **结构化数据** | **非结构化数据** |\n| --- | --- | --- |\n\
  | 基于规则 | ✓ | |\n| 机器学习 | | |\n| NLP | | ✓ |\n| 机器学习 | ✓ | ✓ |\n| 深度学习 | ✓ | ✓ |\n\
  | 无监督学习 | ✓ | ✓ |\n| 混合方法 | ✓ | ✓ |\n\n无论基于基于规则、基于机器学习还是混合方法，疾病诊断的最终识别都应该由临床专家评审进行验证。为了进一步实现自动化以减少医学专家的人工审核过程，Henderson\
  \ 等人 (2017) 开发了 `PheKnow–Cloud`，允许研究人员利用医学文献的无监督学习来自动化输出表型的验证过程。电子表型分析是一个新兴领域，是\
  \ EHR 研究的关键步骤。因此，预计在未来几年内，将看到比本节讨论的更多的表型方法和工具。\n\n如果目标队列不仅由疾病诊断定义，入组/排除标准还可能涉及 EHR\
  \ 数据库中的其他变量，如患者人口统计学（年龄、性别或种族）、药物、手术、实验室检查、临床事件、生命体征或微生物测试，可以采用类似的方法进行疾病表型分析。然而，需要仔细考虑不确定性和数据错误（包括数据缺失问题）。相关文献较少，有必要对该主题进行更多的未来工作。\n\
  \n### ![image](img/inline1_1.jpg)\n\n## 3.5 数据提取报告\n\n一旦确定了患者队列并从 EHR 数据库中提取了相关数据，通过表格、图表和插图生成摘要统计数据是至关重要的。摘要报告是促进研究合作者之间协作与沟通的有效方式。因此，我们强烈建议编写摘要报告。下面我们与读者分享一个摘要报告模板，以突出报告应包含的主要部分。\n\
  \n**本报告的目的：**\n用于与临床或流行病学特定领域的专家进行初步沟通，以识别科学问题或假设。\n\n**数据提取标准：**\n明确指定用于提取数据并生成此报告的初始入组/排除标准。\n\
  \n**基本摘要统计数据：**\n带有详细说明的表格和图表\n1. 疾病类型或亚类型：患者分布及按日历年\n2. 品种分布和疾病患病率分布\n3. 性别分布和疾病患病率分布\n\
  4. 年龄分布和疾病患病率分布\n5. 区域分布和疾病患病率分布：\n    * 患者人数\n    * 医院数量\n6. 医院分布\n7. 就诊次数：按患者和按日历年的分布\n\
  8. 数据间隔的时间长度（从任何事件首次发生开始）：按患者分布（基于数据库）\n9. 死亡率\n10. 按患者和按日历年的计数\n    * 药物\n    *\
  \ 手术\n    * 临床事件\n    * 实验室检查\n    * 微生物测试\n11. 患者类型分布（住院或门诊）及年份\n\n**项目特定统计数据：**\n\
  示例 1：所有项目\n1. CT 扫描\n2. 夹闭术和治疗\n3. 血管收缩药物\n4. 并发症\n    * 脑痉挛 (CV)\n    * 延迟性脑缺血\
  \ (DCI)\n示例 2：糖尿病\n1. 血糖水平\n2. HbA1c 水平\n\n**研究计划：**\n* 潜在的科学问题或假设\n* 下一步计划\n\n\
  ### ![image](img/inline1_1.jpg)\n\n## 3.6 示例：蛛膜下出血 (SAH) 项目\n\n### 3.6.1 EHR 数据库设计与构建\n\
  \n下面我们分享设计和构建托管 EHR 数据数据库系统的经验。虽然大多数医疗数据库系统（包括 EHR 系统）基于 `Oracle` 或 `Microsoft SQL\
  \ server`，但可以使用任何现有的数据库工具来构建数据库系统。我们采用了 `PostgreSQL`，这是一种免费开源的对象数据库系统，具有传统数据库的功能。安装包可以从\
  \ `https://www.postgresql.org/download/` 下载。\n\n是构建医疗数据数据库系统的步骤：\n* 设置数据库：可以使用 `Docker`\
  \ 容器部署 `PostgreSQL`。容器化非常流行，因为容器灵活、轻量、可移植且安全。\n* 创建架构和表：EHR/EMR 供应商可能提供用于构建表的 SQL\
  \ 文件。但你可能需要对语句进行一些修改以匹配你选择的 DBMS。例如，Cerner 使用 `Oracle`，如果你使用 `PostgreSQL`，则需要将 `NUMERIC(P,S)`\
  \ 替换为 `DECIMAL(P,S)`。\n* 上传数据文件：一旦准备好 SQL 文件，可以使用 `pgAdmin` 或 `DataGrip` 等客户端工具运行。客户端工具也可用于将\
  \ `csv` 文件加载到数据库表中。然而，如果 `csv` 文件很大，或者有大量大型 `csv` 文件等待导入，创建批脚本来处理将更高效。\n* 查询数据库：当执行数据库查询时，程序通常从服务器进程获取所有记录并将其传输到客户端进程。如果查询返回海量数据，客户端将分配大量的内存。如果数据集大到无法在客户端侧实际处理，则创建服务器端过程。这将允许向客户端传输受控的数据，以便在不将整个数据集保留在内存中的情况下进行检查。\n\
  \n### 3.6.2 SAH 队列识别与数据提取\n\n为了说明从 EHR 数据库中识别队列和提取数据的过程，我们分享了项目——蛛膜下出血（SAH）治疗分析与预测的示例。\n\
  \n\n\n\n我们的蛛网膜下出血（SAH）患者队列最初是使用传统的基于规则的方法定义的通过识别 `ICD-9/10` 代码，获取所有相关数据（如患者就诊、诊断、药物等）从\
  \ `Cerner EHR` 数据库中获得，这些数据针对特定疾病。我们采用两种方法来获取 `ICD-9/10` 代码：1) 在诊断描述中进行关键词搜索；2) 在线或通过临床医生查找相应的\
  \ `ICD-9/10` 代码。一旦确定了 SAH 的 `ICD` 代码，就可以通过利用不同标识符与 ICD 代码之间的关系，推导出所有信息表。例如，我们可以首先提取所有包含这些\
  \ SAH ICD 代码的就诊记录。然后使用提取出的就诊中的就诊 ID 来提取所有与药物、手术、临床事件、实验室检查等相关的表格。\n\n尽管一些文献讨论并列出了\
  \ SAH 的 `ICD` 代码，但为了给我们的项目提取尽可能相关的 `ICD` 代码，我们对 EHR 数据库中的诊断描述进行了关键词搜索。最终，收集了 192\
  \ 个与 SAH 相关的唯一 `ICD-9/10` 代码。这些唯一的 `ICD` 代码随后根据原因、症状和特征被分为六组代码。详见下方的 表 3.3。\n\n\
  **表 3.3** 代码组及其描述\n\n| **ICD 代码** | **描述** |\n| --- | --- |\n| 800.X-804.X | 颅骨折伴蛛网膜、硬膜下硬膜外出血\
  \ |\n| 430/I60.X | 非外伤性蛛网膜下出血 |\n| P52.5/P10.3/772.2 | 婴儿蛛网膜下出血 |\n| 852.0–852.2\
  \ | 损伤后蛛网膜下出血 |\n| S06.6X | 外伤性蛛网膜下出血 |\n| I69.0X | 非外伤性蛛网膜下出血后症 |\n\n在与临床医生讨论后，我们将\
  \ ICD 代码组 `800.X–804.X` 和 `852.0–852.2` 分类为外伤性蛛网膜下出血，并删除了诊断为 `P52.5/P10.3/772.2`\
  \ 的患者，因为这些代码与婴儿有关。因此，过滤后的 ICD 代码组及其描述如下（见 表 3.4）。\n\n**表 3.4** 合并的 ICD 代码组及其描述\n\
  \n| **ICD 代码** | **描述** |\n| --- | --- |\n| 800.X-804.X/S06.6X/852.0–852.2 | 外伤性蛛网膜下出血\
  \ |\n| 430/I60.X | 非外伤性蛛网膜下出血 |\n| I69.0X | 非外伤性蛛网膜下出血后症 |\n\n然而，外伤性 SAH 和非外伤性 SAH\
  \ 呈现不同的临床症状和并发症。通过后续分析将这两种 SAH 视为同疾病会产生偏差的结果。我们还对因 SAH 入院的患者感兴趣，而不是 SAH 后遗症。为了进一步完善分析队列，我们还删除了唯一诊断代码为非外伤性蛛网膜下出血后症的患者。在检查单个患者的历史\
  \ SAH 诊断后，出现了一个问题。特定患者可能具有在 表 3.4 中列出的不同 SAH ICD 代码组组合。这里的历史 SAH 诊断是指在患者历史就诊记录中显示的\
  \ SAH 诊断记录。关于属于不同 SAH ICD 代码组组合的患者人数，请见 图 3.1。\n\n![图 3.1 不同 SAH ICD 代码组组合的患者人数。](img/fig3_1.jpg)\n\
  \n**图 3.1**\n\n不同 SAH ICD 代码组组合的患者人数。\n\n从 图 3.1 我们可以看到，大多数患者只有一种 SAH 诊断。但仍然有相当数量的患者具有外伤性\
  \ SAH 诊断和非外伤性 SAH 诊断，或其他 SAH 诊断代码组合。如果目标队列仅仅一种类型的 SAH，我们可以简单地删除具有两种以上 SAH 诊断的患者吗？我们认为，简单地从分析中删除患者会引入偏差或为队列研究产生误导性结果。为了更好地解决这个问题，我们可能考虑使用所有患者的首次\
  \ SAH 就诊数据。见 图 3.2，其首次 SAH 诊断属于不同 SAH ICD 代码组组合的患者人数。\n\n![图 3.2 患者首次就诊时不同 SAH ICD\
  \ 代码组组合的患者人数。](img/fig3_2.jpg)\n\n**图 3.2**\n\n患者首次就诊时不同 SAH ICD 代码组组合的患者人数。\n\n\
  在这个 SAH 项目中，我们最终分析限制在首次 SAH 诊断为非外伤性 SAH 的患者上。我们将同时具有非外伤性蛛网膜下出血后症诊断代码组和非外伤性蛛网膜下出血诊断代码组的患者视为非外伤性\
  \ SAH 患者。在该项目中，我们确定了 29,889 名首次 SAH 诊断为非外伤性 SAH 的患者。\n\n\n\n\n# EHR（电子健康记录）数据库中发现的错误\n\
  \n任何数据库中包含错误都是不可避免的。例如：\n\n* 一次就诊可能映射到多个患者标识符，这显然是一个错误。\n* 由于错误，一个患者标识符可能有多个种族或性别。\n\
  \n## 我们在数据提取过程中犯的错误\n\n* 在根据入院时间提取蛛网下出血（SAH）患者的首次就诊时，由于错误，某些就诊的入院时间可能相同，导致无法区分首次就诊。同样，药物、实验室检查或操作的时间戳可能包含错误或可能缺失，我们在提取由时间戳指定的数据时应保持谨慎。\n\
