  \n### 5.3.6 队列精炼 (Cohort Refining)\n\n在项目开始时，应根据拟定的研究目标或目的良好地定义患者群体或队列。然后，可以为初始数据提取建立纳入和排除标准（详情请参见第\
  \ 3 章）。然而，由于错误和数据问题，并非所有符合初始纳入和排除标准的患者都符合最终数据分析条件。我们需要探索初始提取的数据，并进一步评估所有受试者对于最终数据分析的资格。由于数据不确定性、错误和其他数据问题，某些受试者可能无法用于分析。例如，如上述小节所示，某些患者由于数据缺失或错误无法归类到任何感兴趣的比较组。在这种情况下，可能需要将这些患者排除在进一步分析之外。另一个例子是，如果患者的终点或结果定义不明或缺失，我们可能需要从进一步的数据分析中删除该患者，除非使用某些缺失处理方法处理响应变量的缺失问题。因此，根据初始纳入和排除标准从\
  \ EHR 数据库提取的队列队列，并非所有患者都符合最终数据分析的条件。需要根据提取的数据或数据探索进行进一步评估，以便在数据准备步骤进一步精炼队列。\n\n\
  例如，在上述讨论的 SAH 项目中，有 40 名患者被排除在收缩剂治疗的比较分析之外，因为他们最初被分配了多种收缩剂，而我们不知道这些患者应该被分配到哪些治疗组。少数结果（死亡率）缺失的患者也被排除在进一步的数据分析之外（尽管另一种策略是解决数据问题以使他们符合参与者资格）。在这项\
  \ SAH 研究中，一项纳入/排除标准是年龄在 17 岁及以上。在我们提取符合该年龄标准的患者数据后，发现两名患者的诊断记录均为儿童疾病。在咨询临床专家后，我们怀疑这可能是由记录错误导致的。因此，这两名患者不符合资格，被排除在分析之外。因此，根据初始纳入和排除标准从\
  \ EHR 数据库提取的 SAH 队列共有 4850 人。经过队列精炼，总共排除了 247 人，最终有 4603 人纳入数据分析。请参见下方的图 5.9 SAH\
  \ 项目队列精炼的工作流。\n\n```\n![Figure 5.9 Cohort refining for the SAH project.\n```\n```\n\
  \n**图 5.9 SAH 项目队列精炼。**\n\n### 5.3.7 泄露检测 (Leakage Detection)\n\n信息泄露或数据泄露被认为是“数据挖掘十大常见错误之一”(Nisbet,\
  \ Elder and Miner 2009)。当使用训练集之外的信息或响应变量的部分信息（在预测情况下不可用）来开发或训练预测模型时，建立的预测模型通常过于乐观。特别是在结构化的\
  \ EHR 数据库中，医疗记录或数据存储在不同的表中，泄露变量或预测因子（如结果的直接触发因素和潜在后果）可能隐藏在不同表中大量的变量和因子之中。有时识别泄露变量是非常困难的。对于\
  \ EHR 数据库中大量的候选变量，评估或检查每一个是不可能的。Kauf 等人提出了几种检测泄露候选的方法，包括探索性数据分析 (EDA)、结果检查以及初始模型的早期现场测试\
  \ (Kaufman et al. 2012)。可疑的高预测准确率可能指示存在的信息泄露或数据泄露，需要进行调查。\n\n\n\n\n\nSAH 研究的另一个目标是开发一个\
  \ SAH 患者死亡率的预测模型，该模型由 SAH 就诊的出院去定义（详细见上文第 5.3.1 节）。我们可以使用入院时的诊断、药物、操作、临床事件和实验室检查变量等变量来预测\
  \ SAH 患者的死亡风险。在确定就诊时间间隔、合并就诊记录并精炼队列后（参见上文第 5.3.3–5.3.6 节），我们必须识别潜在的泄漏变量和预测因子，以建立真实的预测模型。为了从\
  \ EHR 数据库大量的医疗记录变量中筛选出潜在的泄漏变量或预测因子，我们迭代地进行了探索性数据分析和泄漏变量筛选。例如，在 SAH 研究中，我们首先计算了所有二分类或分类预测因子每个条件或类别的死亡率。如果某个二分类或分类预测因子的某个条件或类别的死亡率接近\
  \ 100%，则该预测因子被认为是潜在的泄漏因子，并建议通过咨询临床专家进一步调查以确认。预测建模方法，特别是那些能够对预测因子重要性排序的模型，也可以用于筛选潜在的泄漏预测因子。例如，我们首先在\
  \ SAH 项目中实现了 L1 惩罚逻辑回归（LASSO）模型来预测死亡率，然后根据优势比（odds ratio）对所有显著预测因子进行排名。排名高的预测因子是我们必须进一步研究的潜在泄漏变量。\n\
  \n此外，某些疾病诊断、药物或临床状况几乎等于预测结果，尽管由于病例较少，可能无法通过上述筛选方法轻易检测。例如，在 SAH 研究中，我们发现脑死（ICD-9-CM,\
  \ 348.82）和姑息治疗记录（ICD-9-CM, V66.7）也是死亡率的潜在预测因子，但这两个诊断几乎等同于死亡，应从死亡率预测列表中排除。在诊断表中，其他指定的器官或组织捐献（ICD-9-CM,\
  \ V59.8）、未指定的器官或组织捐献（ICD-9-CM, V59.9）、肝脏捐献（ICD-9-CM, V59.6）和角膜捐献（ICD-9-CM, V59.5）是死亡的潜在指示符，也应从预测因子中排除。住院时间与\
  \ SAH 死亡率密切相关，且在现实世界中无法用于未来预测，因此任何与住院时间相关的变量（如操作变量，包括少于 96 小时的连续侵入性机械通气和 96 小时以上的连续侵入性机械通气）都应从预测因子中排除。\n\
  \n总之，数据或信息泄漏是使用 EHR 数据开发机器学习预测模型时必须解决的重要问题。否则，建立的模型在测试期间表现良好，但在现实情况下可能无法达到同样的性能水平。由于\
  \ EHR 数据的高维性，这个问题可能并不容易处理。当预测模型的性能看起来好得不可置信时，必须保持谨慎。\n\n### 5.3.8 针对不同分析目的的数据准备\n\
  \n对于处理特定科学问题或具有不同目标的项目，可能需要使用不同的统计方法和预测模型。不同的统计方法或模型可能需要不同的数据输入格式。对于一个项目，我们可能需要准备多种格式的同一份数据，以满足这些不同需求。例如，我们可以使用传统的逻辑回归模型或死亡时间生存模型进行死亡率预测，但逻辑回归模型和生存模型的输入格式是不同的。因此，我们需要为不同的分析分析目的准备不同格式的数据。数据准备既针对特定项目也针对特定方法。\n\
  \n通常，EHR 数据可以通过两种方式准备：横截面格式和纵向格式。对于横截面数据格式，可以根据整理数据原则准备（参见上文第 5.2.1 节），即每行代表一个患者或患者的一次就诊，每列代表一个变量。对于纵向数据格式，每个患者或就诊可能有多个行观测值，每列为一个变量。\n\
  \n我们以 SAH 项目的死亡率预测为例，演示不同数据分析目的的数据准备步骤。SAH 项目死亡率预测的主要目标是预测两种场景下的死亡：场景 1，使用入院后 24\
  \ 小内的 EHR 数据预测 SAH 患者的死亡风险；场景 2，使用出院或死亡前 24 小时的 EHR 数据预测 SAH 患者的死亡。因此，场景 1 中的观察窗口长度固定为\
  \ 24 小时；而场景 2 中的预测窗口长度固定为 24 小时。为了探索观察窗口长度对死亡准确率的影响，我们还在场景 1 中预测了在 48 小时和 72 小时入院的\
  \ SAH 患者的死亡风险，详情请见图 10。\n\n![图 10 两种场景下的观察窗口和预测窗口；T0 和 Te 表示起始和结束时间。](img/fig10.jpg)\n\
  \n对于该项目，我们需要准备六个数据集，即每种场景对应三类情况：\n\n- 入院后 24 小时的 EHR 记录\n- 入院后 48 小时的 EHR 记录\n-\
  \ 入院后 72 小时的 EHR 记录\n- 出院或死亡前最后 24 小时的 EHR 数据\n- 出院或死亡前最后 48 小时的 EHR 数据\n- 出院或死亡前最后\
  \ 72 小时的 EHR 数据\n\n设 `R[t]` 为用于记录的时间，`V[t]` 为分配血管收缩剂的时间，`T[0]` 为 SAH 就诊开始时间，`T[e]`\
  \ 为 SAH 就诊结束时间。在场景 1 中，用于 SAH 死亡率预测的记录满足以下三个条件，在此情况下阈值分别为 24、48 或 72 小时：\n\n```\n\
  T[0] <= R[t] <= T[0] + threshold\nT[0] <= V[t] <= T[0] + threshold\nT[e] - T[0]\
  \ > threshold\n```\n\n在场景 2 中，用于 SAH 死亡率预测的记录满足以下两个条件，在此情况下阈值同样为 24、48 和 72 小时：\n\
  \n```\nT[0] <= R[t] <= T[e] - threshold\nT[0] <= V[t] <= T[e] - threshold\n```\n\
  \n\n\n\n\n在 EHR 数据库中，药物、实验室检查、临床事件和操作表中的变量具有时间戳，通过这些时间戳我们可以确定某个变量是否在观察窗内被测量。因此，这些变量可以被视为死亡的候选预测因子。表\
  \ 5.4 显示了数据准备后，两种场景下不同情况的可用样本量（患者人数）。\n\n### 表 5.4 不同预测情况的样本量\n\n| **场景** | **预测情况**\
  \ | **样本量** |\n| --- | --- | --- |\n| 场景 1 | 预测前 24 小时 | 1810 |\n| | 预测前 48 小时 |\
  \ 2356 |\n| | 预测前 72 小时 | 2376 |\n| 场景 2 | 预测未来 24 小时 | 3958 |\n| | 预测未来 48 小时 |\
  \ 3527 |\n| | 预测未来 72 小时 | 3272 |\n\n场景 1 的第一种情况使用前 24 小时的 EHR 数据预测 SAH 死亡，样本量为\
  \ 1810。注意，在第 5.3.6 节的队列精炼步骤后，我们拥有 4603 名患者。该病例共有 2793 名（61%）患者被排除。这是因为入此病例的患者符合性要求：1）患者的记录或数据应超过\
  \ 24 小时（排除入院 24 小时内死亡或出院的患者），2）患者在入院 24 小时后接受了收缩血管药物（参见上述场景 1 中的三个条件）。这也解释了为什么对于不同的预测情况，观察窗越大，样本量就越大。\n\
  \n对于特定的项目，可能需要以不同的方式准备多个版本的分析数据。有时，可能需要为不同的情况或场景准备数据，包括出于敏感性分析的目的。这里我们仅提供了一些示例来说明这一数据准备原则。\n\
  \n## 5.4 数据处理/准备中的错误、陷阱及解决方案\n\n数据处理和准备（如数据重组、探索、检查、进一步的数据或受试者筛选以及队列精炼）是特定于项目的。它们非常耗时，但对于任何数据分析项目都是至关重要的，特别是对于\
  \ EHR 数据的二次分析项目。在这种情况下，研究人员没有参与数据收集过程，对于研究人员（特别是数据科学家）来说，熟悉特定的 EHR 数据库通常其学习曲线通常更加陡峭。数据处理和准备中的错误是不可避免的。我们总结了在基于大型\
  \ EHR 数据库的数据处理和准备项目中遇到并从中汲取经验的错误和陷阱如下：\n\n*   在药物表中，药物的通用名称混合了大写和小写，在进行进一步的数据清洗、处理和准备之前，需要对其进行统一和清洗。\n\
  *   对于某些项目或研究，需要根据与“就诊”（encounters）相关的纳入/排除标准提取数据，就诊被定义为患者与医疗提供人员之间为了提供医疗服务或评估患者健康状况而进行的交互。然而，一个患者的多次就诊在时间变量上可能无法清晰分开。两个就诊重叠或非常接近是非常常见的。在这种情况下，将这两个就诊视为医疗提供人员与患者之间的“两次交互”会令人困惑。因此，有必要根据项目特定需求适当处理和清洗就诊\
  \ ID。例如，在 SAH 项目中，我们根据 24 小时规则将重叠或时间接近的就诊合并为一个更大的就诊或临床访问（详情见第 5.3.4 节）。\n*   某些记录（包括药物、实验室检查和操作）已下单但后来被取消，所有这些取消的记录都应从分析中删除。例如，在我们使用的\
  \ EHR 数据库药物表中，我们使用 `order status` 来过滤已取消的订单。我们删除了 `order status ID=2` 或 `14` 的药物，这些标记为“已取消的药物订单”。此外，我们使用药物的\
  \ `consumed quantity` 来过滤掉消耗量标记为零的药物。消耗量可以计算为收费数量减去贷方数量。对于侧于治疗评估的项目，移除已取消的药物是非常重要的。同样，在实验室操作表中，我们使用实验室\
  \ `cancellation time` 来过滤掉已取消的实验室操作订单。如果实验室取消时间是一个有效时间，我们就会从下游数据分析中删除相应的实验室记录。\n\
  *   尽管对黑箱机器学习模型的预测结果进行解释可能容易也不可行，但我们仍然需要对许多 EHR 数据分析项目的结果进行解释。因此，在数据准备步骤中正确命名不同\
  \ EHR 表的变量和预测因子非常重要，以便我们方便找到这些变量和预测因子的描述。例如，来自不同表（如诊断表、药物表、操作表、实验室操作表和临床事件表）的变量通常由编码\
  \ ID（表中变量唯一标识符）标记，这需要研究人员通过词表映射到描述。当我们合并不同 EHR 表的变量为最终分析和建模准备数据时，我们可能需要通过添加适当的“前缀”来重命名这些变量（或\
  \ ID），例如 `DIAG####`、`MED####`、`PROC####`、`LAB####` 和 `CLIN####`（其中 `####` 分别表示诊断、药物、操作、实验室操作和临床事件表的原始名称或\
  \ ID），这样我们就可以轻松地识别或映射对应的描述。\n*   诊断表中的诊断代码没有时间戳。然而，某些诊断被标记为就诊入院或出院。因此，就诊入院或出院时间可以近似诊断时间。\n\
  \n我们目前学到的这些陷阱和经验仍然有限。我们预计未来将扩展这一列表。根据我们的经验，我们意识到数据处理和准备需要与其他步骤（包括数据提取、清洗和数据分析步骤）迭代进行。数据处理和准备是枯燥的，有时需要重复执行多次。因此，记录并跟踪数据处理和准备步骤中的所有更改至关重要，以确保\
  \ EHR 数据二次分析的可重复性和科学严谨性。\n\n\n\n\n一份详细的报告对于记录和跟踪数据处理与准备步骤的所有数据处理程序、方法、更改和理由非常且必要。根据我们的经验，我们为\
  \ EHR（电子健康记录）项目开发了一套数据预处理和数据准备报告模板。一份数据预处理和准备报告应包含几个关键部分，例如 EHR 项目的背景和目标、数据提取和数据清洗步骤的摘要、数据预处理和准备细节、带有描述以及用于数据处理和准备的计算机代码准备数据文件。我们设计的报告模板如下。\n\
  \n# 数据预处理和准备报告模板\n\n## EHR 项目：项目标题\n### 数据预处理和准备报告\n### 版本 1.0\n\n您的姓名\n所属机构\n日期\n\
  \n## 项目背景和目标\n\n数据预处理和准备针对特定项目，不同的目标可能需要以不同的方式对数据进行处理和准备。因此，提供项目背景和目标的清晰描述至关重要。有时也有必要将科学或临床目标制定为统计框架，以便我们能够根据不同目标的不同数据分析方法，合理地证明我们的数据处理和准备程序及方法。\n\
  \n## 数据提取和数据清洗摘要\n\n数据处理和准备通常在数据提取和数据清洗步骤之后进行。总结数据提取和数据清洗的结果及关键点（包括数据提取的纳入/排除标准），对于防止数据处理和准备步骤出错至关重要。必须指定使用哪个版本的清洗后数据（来自数据清洗步骤）用于数据处理和准备。可以参考数据提取和数据清洗步骤的报告（如果可用）获取更多详细信息。\n\
  \n## 数据预处理和准备\n\n需要详细描述数据预处理和准备的每一个步骤，以确保准备数据的最终版本是可重复的。如果针对不同目标的不同分析方法准备了多个版本的数据集，也应在此处进行妥善记录。以下是可能包含的内容示例：\n\
  \n1. 定义就诊的开始和结束时间\n2. 就诊合并\n3. 如果适用，对结果标记\n4. 如果需要，对治疗或暴露进行标记\n5. 队列筛选或精炼\n6. 如果需要，进行泄露检测\n\
  7. 变量编码\n8. 特征提取和降维\n9. 最终队列统计统计\n    * 患者人数\n    * 每个患者的就诊次数\n    * 临床就诊时长\n  \
  \  * 死亡率\n    * 种族分布和疾病流行率分布\n    * 性别分布和疾病流行率分布\n    * 年龄分布和疾病流行率分布\n    * 每个医疗表格的变量数量，即药物、诊断或操作的数量\n\
  \    * 患者类型描述分布（住院或门诊）及按历年划分\n    * 特定疾病的重要性临床变量摘要\n\n## 准备的数据文件\n\n`Data_file 1`:\
  \ 描述\n`Data_file 2`: 描述\n……\n\n## 数据处理和准备代码\n\n由于数据处理和准备可能需要多次执行，并与其他步骤进行迭代，因此拥有良好的版本控制至关重要，以确保所有研究人员或数据分析师都使用最新版本的准备数据。我们建议报告应包含所有用于数据处理和准备的计算机代码以及适当的文档，以便他人能够轻松重复和重现准备的数据。这对于其他人也是必重要的。\n\
  \n## 5. 总结\n\n![image](img/inline1.jpg)\n\n### 5.6 总结\n\n在本章中，我们讨论了 EHR 预处理和准备的原则，并根据经验展示了一些实际示例。在这里我们对必须完成的数据预处理任务给出了清晰的定义。参见第\
  \ 5.1 节，这对通用社区非常重要。在完成数据处理后，我们需要为不同的目的准备数据。准备步骤可能需要进行针对特定项目和目标驱动的数据清洗、预处理和分析。这一步骤还需要与其他步骤进行迭代执行，包括\
  \ EHR 数据，如缺失值插补、特征提取和降维。数据准备步骤不需要复杂的统计方法，但需要更多关于 EHR 系统的知识。执行数据准备的人员还需要很好地理解下一步，即数据分析。他/她可能需要努力以正确的格式理解数据。HR\
  \ 项目的数据预处理和准备步骤为了更好地管理项目并在团队成员之间进行沟通。\n\n理想情况下，由同一个人或一组人完成准备和分析。清晰地定义和区分预处理与准备是重要的，因为\
  \ EHR 分析通常需要多学科团队的紧密协作。数据预处理和准备步骤都是特定项目的，并且需要目标驱动。我们预计在积累了更多 EHR 项目经验后，这两个步骤可以增加更多内容和任务，并开发更多的原则和方法。\n\
