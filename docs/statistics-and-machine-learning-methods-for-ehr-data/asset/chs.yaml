  | First48hrs | 0.74 |\n| First72hrs | 0.75 |\n\n通过该数据集，我们可以确信地假设某些变量至少可以解释其他列数据的缺失机制，因此，在我们的研究中，我们假设缺失机制为\
  \ MAR。许多人也根据样本量得出了相同的假设 [21]。\n\n### 6.4.2 EHR 数据集中的插值\n\n在本节中，我们将展示使用六表版本之一的 `Last24hrs`\
  \ 的结果，以探索选择最佳缺失率阈值的影响，然后使用上述四种插值方法找到处理真实 EHR 数据中缺失数据的“最佳方法”。\n\n图 6.3 可视化了 `Last24hrs`\
  \ 数据集中的缺失情况，以及从 1 到 0.8 不同阈值的缺失变化。\n\n```\n![图 6.3 使用 MissForest 方法时随阈值变化引起的 AUC\
  \ 变化。](img/fig6_2.jpg)\n```\n\n\n\n\n在我们的研究中，我们使用了 `MICE` 插补方法，然而它未能返回完整的数据集，部分原因是某些变量的缺失率极高。对此的一种可能解释是可用响应（受试者）的数量较少，不足以估计所有模型参数。例如，`Aerosol\
  \ O2` 的初始缺失率为 99%，`MICE` 仅基于 1% 的可用数据就失败了，如图 6.5 所示。\n\n#### II. MissForest 插补\n\
  \n与 `MICE` 不同，`MissForest` 总是能返回完整的数据集，这是因为它不需要任何模型训练或参数估计。\n\n#### III. 平均值和中位数插补\n\
  \n我们考虑了两种补方法中的朴素方法，它们在插补后都能提供完整的数据集。我们使用这两种方法作为参考方法来比较 `AUC` 值。\n\n![图 6.5 临床事件“氧气与雾化治疗”在插补前后的缺失情况。](img/fig6_5.jpg)\n\
  \n**图 6.5**\n\n临床事件“氧气与雾化治疗”在插补前后的缺失情况。\n\n### 6.4.3 评估插补方法和阈值的性能\n\n院内死亡率是一个二分类变量，是本研究关注的响应，我们使用带有\
  \ `LASSO` 正则化的逻辑回归，应用于不同阈值和插补方法处理后的插补数据集。这些模型的性能通过 `AUC` 进行评估。\n\n表 6.4 显示了不同模型中\
  \ `AUC` 的结果：`AUC` 从 85%（在移除任何变量之前应用 `MICE`）变化到 89%（在阈值为 0.8 的 `MICE` 下），显示出随着阈值的降低，平均\
  \ `AUC`（四种方法）明显增加（图 6.6）。这表明移除这些变量不仅保留了预测死亡指数的有用信息，还显著减少了数据噪声。现在的问题是，我们是否能找到一个截止阈值，在此之后任何降低都会减少有用信息和\
  \ `AUC`？\n\n**表 6.4** 每个模型中的 `AUC` 值\n\n| || **平均值** | **中位数** | **MICE** | **MissForest**\
