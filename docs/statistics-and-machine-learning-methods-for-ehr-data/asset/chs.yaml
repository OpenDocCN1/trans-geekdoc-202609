  \n\n\n\nTPOT 通过从几个简单且随机选择的管道（种群）开始来优化管道。在优化过程的每次迭代（代）中，TPOT 会对种群中当前性能最好的管道创建多个副本，然后对它们进行随机更改（例如，添加或删除操作，或调整某个操作的参数设置）。在每一代结束时，性能最差的管道将从种群中移除，TPOT\
  \ 进入下一代。在固定数量的代之后，TPOT 会推荐其在优化过程中创建的性能最佳管道。TPOT 非常用户友好，即使是没有数据分析经验的人也可以轻松学习和使用它。你只需要指定想要生成的代数和种群数量即可。\n\
  \n### Auto-sklearn\n\nAuto-sklearn 也是一个基于 `scikit-learn` 库的开源 AutoML 工具包。该包的主要目标是自动选择算法并调优参数。该包包含了\
  \ 4 种数据处理方法、14 处理方法和 15 种分类算法（Feurer et al. 2015）。\n\n在我们的应用示例中，我们使用的算法是逻辑回归、`SVM`、随机森林、梯度提升和\
  \ `Xgboost`。我们使用了 5 折交叉验证和相同的调优时间来比较不同机器学习算法之间的 `AUC`（见下文下一节）。Auto-sklearn 在定义训练时间和调优选项方面非常灵活，且代码易于理解，如下例所示：\n\
  \n![image](img/inline10_9.jpg)\n\n此示例还展示了如何使用 5 折交叉验证。需要提的一点是，在计算 `AUC` 之前，必须重新加载数据并使用\
  \ `refit` 函数，以便使交叉验证正常工作。\n\n![image](img/inline10_10.jpg)\n\n## 10.4 应用示例：SAH 项目\n\
  \n在本节中，我们将根据来自 EHR (Cerner) 数据库的蛛网膜下出血 (SAH) 患者死亡预测的应用示例，分享我们的经验并评估不同的机器学习方法和包的性能。\n\
  \n### 预测场景\n\n对于 SAH 项目，我们打算针对以下六种情况开发 SAH 死亡率预测模型（更多细节请参见 第 5 章）：\n\n1. 使用入院后前\
  \ 24 小时的 EHR 数据：1263 例患者用于训练，545 例测试，917 个虚拟变量（预测因子）\n2. 使用入院后前 48 小时的 EHR 数据：1665\
  \ 例患者用于训练，689 例测试，930 个虚拟变量（预测因子）\n3. 使用入院后前 72 小时的 EHR 数据：1661 例患者用于训练，714 例测试，975\
  \ 个虚拟变量（预测因子）\n4. 使用出院或死亡前 24 小时内的 EHR 数据：2773 例患者用于训练，1183 例测试，1473 个虚拟变量（预测因子）\n\
  5. 使用出院或死亡前 48 小时内的 EHR 数据：2486 例患者用于训练，1058 例测试，1421 个虚拟变量（预测因子）\n6. 使用出院或死亡前 72\
  \ 小时内的 EHR 数据：2284 例患者用于训练，987 例测试，1375 个虚拟变量（预测因子）\n\n### 预测因子和结果数据\n\n对于这次预测，我们包含了来自药物、程序、诊断和人口统计学表中的变量。在\
  \ k 折交叉验证中，我们将特定值 `k` 为 5，然后将训练数据随机分为 5 组，使用其中一折作为验证集，其余四折作为训练集来训练我们的模型，并反复此过程，直到每一折都曾作为一次验证集。通过这种方式，我们将获得\
  \ 5 个性能指标（每折一个），最终性能是这 5 个性能指标的平均值。在本项目中，我们将重点关注死亡率预测：“死亡”编码为 1，“存活”编码为 0。\n\n###\
  \ 模型训练\n\n训练机器学习模型可能非常复杂，不同的超参数可能会产生非常不同的结果。在这里我们列出了需要精调的超参数以及用于训练预测模型时使用的调优范围（图\
  \ 10.8）。\n\n![Figure 10.8 随机森林超参数范围。](img/fig10_8.jpg)\n\n**图 10.8**\n随机森林超参数范围。\n\
  \n![Figure 10.9 GBM 超参数范围。](img/fig10_9.jpg)\n\n**图 10.9**\nGBM 超参数范围。\n\n![Figure\
  \ 10.10 XGBoost 超参数范围。](img/fig10_10.jpg)\n\n**图 10.10**\nXGBoost 超参数范围。\n\n###\
