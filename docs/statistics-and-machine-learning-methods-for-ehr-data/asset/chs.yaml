  \ 6.6 展示了四种不同插补方法和不同缺失率阈值预测死亡率的 AUC。](img/fig6_6.jpg)\n\n**图 6.6**\n\n展示了四种不同插补方法和不同缺失率阈值预测死亡率的\
  \ AUC。\n\n图 6.7 也展示了四种方法在不同阈值值之间 `AUC` 的整体变化。实线表示平均值插补法，虚线表示中位数插补法，划线表示 `MICE` 插补，点划线表示\
  \ `MissForest` 插补方法。\n\n![图 6.7 AUC 随阈值的变化。](img/fig6_7.jpg)\n\n**图 6.7**\n\n`AUC`\
  \ 随阈值的变化。\n\n对于 `MICE` 插补，`AUC` 值随着阈值的增加而明显下降。原因是，当阈值接近 1 时，会有许多高缺失率的列，`MICE` 在拟合预测缺失值的回归模型会遇到困难。例如，对于一个样本量为\
  \ 2000 但只有 5 个观测值的变量，`MICE` 将无法估计多元回归模型中的许多系数。`MissForest` 插补在这四种方法中表现出稳健的性能，`AUC`\
  \ 值随阈值的增加略有上升，这意味着我们可以保留更多的列。\n\n对于阈值，我们可以在每种方法在 0.9 到 0.95 之间找到小峰值，这个峰值给了我们在考虑丢弃高缺失率变量与保留更多信息之间的权衡后的结果，只有这样才能从阈值中获得满意的结果。\n\
  \n## 6.5 讨论与结论\n\n尽管在统计分析中（使用常规数据集）处理缺失数据并不是新挑战，但最近解决 EHR 数据集中缺失问题的研究和方法论开发引起了越来越多的关注。这部分是因为\
  \ EHR 数据集的性质，例如它们是高维的。在本章中，我们阐述了 EHR 数据中的基本问题。\n\n## 参考文献\n\n1. Dempster, A. P.,\
