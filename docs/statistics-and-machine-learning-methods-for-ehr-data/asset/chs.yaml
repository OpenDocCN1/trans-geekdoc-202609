  \ | 毫摩尔/升 |\n\nEHR（电子健康记录）数据的另一个主要问题是数据输入过程中的不一致性，这也是给相似字段分配不同格式的重要原因。例如，在我们的示例中，“毫米/升”的简短描述为\
  \ `mm/L`（表 4.1，第 9 行）。我们注意到某些电解质浓度报告为“毫米/升”（而不是常见的毫摩尔/升，表 4.1 第 3, 10, 14, 18 行）。对数值和分布进行仔细检查后，我们确定操作员误选择了\
  \ `mm/L`。在这种情况下，我们简单地调整了测量单位。\n\n数据输入中的另一个常见错误是混合和混淆用于计数结果与百分比实验室结果的实验室 ID。这个问题在白细胞（WBC）测量中更为常见。例如，我们的数据库对淋巴细胞百分比（占白细胞总数的百分比）和淋巴细胞计数有不同的实验室\
  \ ID 代码。由于操作员的误解或不知，有时淋巴细胞计数报告的是淋巴细胞百分比，且测量单位被选择了百分比。我们没有简单地删除这些值（这会增加缺失和偏差），而是开发了一张映射表，将此类结果映射到相应的实验室\
  \ ID。更具体地说，我们开发了一个转换映射来整合数据并使报告格式统一。该策略将在下一节中讨论。\n\n### 开发转换映射\n\n在本节中，我们解释开发转换映射的策略及其结构。在整个过程中，我们使用血清钾水平作为示例。图\
  \ 4.3 显示了实验室单位统一算法的流程图。\n\n![图 4.3 实验室单位统一算法的流程图。](img/fig4_3.jpg)\n\n**图 4.3**\n\
  \n实验室单位统一算法的流程图。\n\n表 4.2 显示转换映射的一个示例。前四列直接从 EHR 数据库中提取血清钾水平 ID 和单位，其余列描述了我们对这些列的处理策略：**表\
