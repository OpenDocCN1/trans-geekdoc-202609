  生物统计学与数据科学系，UTHealth 公卫生学院，美国德克萨斯州休斯顿\n\n**朱根（Gen Zhu），硕士，学士**\n生物统计学与数据科学系，UTHealth\
  \ 公卫生学院，美国德克萨斯州休斯顿\n\n# 引言：利用 EHR 数据进行科学发现——挑战与机遇\n\n吴湖林（Hulin Wu）\n\n\n## 1.1 真实世界数据与真实世界证据：实践中的大数据\n\
  \n在先进数字技术的新时代，各行各业都在迅速产生大量数据。特别是生物医学研究领域和患者护理实践产生的数据，对于改善公共健康和生活质量具有极高的价值。大数据往往是真实实践和日常业务运营的产物，并非专门为了研究目的而收集的。为了利用（或重复利用）这些真实世界数据来提取科学发现的有意义见解，需要解决许多技术、分析和解释方面的挑战与问题。同时，巨大的机遇也存在。\n\
  \n真实世界数据（如来自电子病历（EMR）或电子健康记录（EHR）系统的数据）可以为重要的临床和科学问题提供真实世界证据。这些数据可以对设计良好的实验和随机对照试验（RCT）的数据形成补充，而后者被认为是临床研究和循证医学的金标准（Van\
  \ Poucke et al.\n\n2016, Frieden 2017）。通常，设计实验和 RCT 的环境和条件与真实世界不同，且许多 RCT 的入组排除标准非常严格，因为设计实验和\
  \ RCT 试图控制噪声水平并平衡研究组间的潜在混杂因素。通常，混杂因素（包括未知或未测量的混杂因素）在治疗组和对照组之间随机平衡，因此设计良好的实验和 RCT\
  \ 的结论在统计学和科学上是有效的。然而，设计良好的实验和 RCT 也有一些局限性。首先，由于以下原因，设计实验和 RCT 的泛化性可能有限：1) 入组排除标准可能过于严格；2)\
  \ 设计实验和 RCT 的环境可能与真实情况不同；3) 同意参加临床试验的受试者特征特征与普通人群存在显著差异；4) 为了受试者招募、研究实施和伦理考虑，特定人群中的样本量有限的。此外，RCT\
  \ 的结论通常基于人群的平均效应，而忽略了治疗或干预的个体效应。此外，RCT 通常非常昂贵，在人力和时间上成本高昂，有时由于伦理问题和其他原因，RCT 是不可行的。这就是为什么目前\
  \ RCT 仅能为 10–20% 的临床决策提供支持（Mills, Thorlund, and Ioannidis 2013, Tricoci et al. 2009,\
  \ McGinnis et al. 2013）。有必要使用观察性研究数据和真实世界数据为临床决策提供补充证据。一些文献表明，RCT 的结果与非随机观察性研究的结果具有强的一致性（Anglemyer,\
  \ Horvath, and Bero 2014, Ioannidis et al. 2001）。此外，我们还期望真实世界数据可以更好地设计和指导 RCT。\n\
  \n利用大型医院出院记录、疾病登记数据库、重症监护室（ICU）数据库和保险理赔数据库在临床和流行病学研究中变得越来越流行。然而，研究人员很难获取完整且大型的真实世界临床实践数据库（包括许多医院和诊所的住院和门诊数据）。这种\
  \ EHR 数据可以为患者的健康记录提供更全面的画像。利用大数据 EHR 允许研究人员研究罕见病、低频率状况长期不良事件，并解决个性化治疗和精准医学中的许多重要问题。\n\
  \n真实世界数据通常具有“大数据”的特征（Laney 2001），包括海量、高多样性和高速度（大数据的“3V”特征）。同时，真实世界数据通常存在噪声且变异性大，我们还需要评估它们的可靠性（真实性），以确保分析结果的可重复性。我们期望如果进行适当的分析并仔细处理偏倚和混杂因素，真实世界数据可以产生巨大的价值。\n\
  \n在书中，我们关注 EHR 数据，即来自患者护理系统（包括住院医院和门诊诊所）的真实世界数据。EMR 或 EHR 系统最初是为了临床实践、记录和计费目的设计的。因此，EMR\
  \ 或 EHR 数据并非为了研究或分析目的而收集的。如果我们尝试重复利用 EMR 或 EHR 数据来解决临床或科学问题，我们需要克服许多障碍并处理真实数据中的许多问题。在书中，我们将分享解决这些科学发现问题的经验。\n\
  \n\n\n\n\n本书主要基于作者从 `Cerner Health Facts` 数据库（Cerner 2020）获得的经验，这是一个去标识的纵向电子健康记录（EHR）数据库，旨在促进研究。我们当前版本的\
  \ `Cerner EHR` 数据库涵盖了 2000 年至 2018 年间美国 85 个系统、共 750 家医院和医疗机构的所有医疗记录（跨越 19 年的记录）。`Cerner`\
  \ 中的主要患者级数据包括纵向就诊记录，包含诊断、药物、临床事件、操作和实验室检查的详细记录。它代表了全美总计 6900 万名独特患者。在 6900 万名患者中，52%\
  \ 为女性，42% 为男性（6% 性别不明）。6900 万名患者的种族结构为：52.8% 白种人、11.8% 非裔美国人、3.0% 拉丁裔、1.8% 亚洲人、0.7%\
  \ 美洲印住民、6.1% 其他种族（包括亚洲/太平洋岛民、双族裔、中东印度人、太平洋岛民）以及 23.7% 种族状态未知。该数据库总共包含 48700 万次就诊记录和\
  \ 93900 万条国际疾病分类（ICD-9 和 ICD-10）编码的诊断记录。数据库还拥有 67400 万条药物记录、1180 万条操作记录、53 亿条临床事件记录和\
  \ 42 亿条实验室操作记录。\n\n到 2016 年，我们与生物医学信息学专家合作，开始研究较早版本的 `Cerner EHR` 数据库。我们启动了一个使用循环神经网络（RNN）机器学习模型进行心力衰竭预测的\
  \ EHR 项目（Rasmy et al. 2018）。另一个合作项目是基于 `Cerner EHR` 数据库中所有患者的疾病共存情况建立疾病-疾病网络。2017\
  \ 年秋，在德克萨斯大学休斯顿健康科学中心（UTHealth）公共卫生学院生物统计与数据科学系新成立的健康大数据中心的支持下，我们正式成立了 EHR 工作小组。该工作小组由来自\
  \ UTHealth 公共卫生学院、生物医学信息学院、McGovern 学院和 Cizik 护理学院的统计学家、生物医学信息学家、数据科学家、数据管理员、计算机程序员、流行病学家、临床医生和其他研究人员组成。多学科团队（包括教职员工、研究助理、学生和研究人员）开始合作利用大\
  \ EHR 数据库进行科学发现。EHR 工作小组启动了第一个关于蛛网膜下出血（SAH）患者血管收缩药物治疗评估的项目，该项目由我们的临床合作者 George Williams\
  \ 博士（医学博士、FCCP 副教授，UTHealth McGovern 学院麻醉科重症监护室主任）于 2017 年 11 月提出。2018 年夏季，招募了四名博士生开始为\
  \ SAH 项目进行 `Cerner EHR` 数据清洗。该 SAH 项目已在生物医学期刊和统计学期刊上发表论文（Williams et al. 2020, Yu\
  \ et al. 2020, Brown et al. 2020）。2019 年 4 月，我们获取了包含 2000 年至 2018 年记录的新版本 `Cerner\
  \ EHR` 数据库，并基于该新版本的 `Cerner EHR` 数据库启动了几个新的 EHR 项目，包括艾滋病、医院感染与抗生素耐药性以及糖尿病项目。本书主要基于过去几年这些已完成和正在进行的项目积累的经验。\n\
  \n\n## 1.2 将 EMR/EHR 数据库用于研究和科学发现：流程与生命周期\n\n电子医疗记录（EMR）是医院、诊所或医生办公室纸质病历的数字化版本。`EMR`\
  \ 系统通常包含患者的医疗和治疗史，以帮助临床医生做出诊断和治疗决策。EMR 允许临床医生更好地随时间推追踪患者数据、识别并提醒患者进行预防性检查和疾病筛查、监测患者并提高医疗质量。电子健康记录（EHR）的范围比\
  \ EMR 广得多，除了 EMR 外，还包含患者的所有相关健康数据，可能可能来自实验室、专家、养老院和其他医疗提供者的数据。EHR 系统还设计用于用于与所有授权的临床医生、护理人员、利益相关者甚至患者本人共享患者数据。因此，功能完善的\
  \ EHR 系统使所有授权的医疗提供者能够随时随地访问患者的最新信息，从而为患者及时提供更协调、以患者为中心的护理。同时，EHR 也作为行政和计费目的文档。近期，EHR\
  \ 数据已成为真实证据的主要来源之一，用于评估治疗效果、改进诊断和医疗质量、减少药物副作用和不良事件、预测疾病风险和治疗结果、优化并个性化患者护理（MIT 2016）。\n\
  \n由于 EHR 数据非常复杂且充满噪声，分析和解释需要复杂的统计方法和数据科学技术，以及数据科学家与领域专家之间的多学科协作。此外，还需要一种新的数据驱动研究范式和先进方法，以利用大\
  \ EHR 数据库将其转化为临床知识。根据我们的经验并从系统的角度，我们将使用 EHR 数据库进行研究和科学发现的流程和生命周期总结为以下步骤：\n\n1. 启动项目：提出一个具有潜在高影响力的生物医学或临床假设的研究课题\n\
  2. 数据查询与提取\n3. 数据清洗\n4. 数据预处理或处理\n5. 数据准备\n6. 数据分析、建模与预测\n7. 结果验证\n8. 结果解释\n9. 发表与传播\n\
  \n这一流程与数据库中用于知识发现发现（KDD）的数据挖掘流程非常相似（McLachlan 2017, Fayyad, Piatetsky-Shapiro, and\
  \ Smyth 1996, Fernández-Arteaga et al. 2016, Holzinger, Dehmer, and Jurisica 2014,\
  \ [Mitra, Pal, and Mitra 2002]）。我们将在后续章节中提供每个步骤的详细说明和解释。\n\n### 1.2.1 启动项目\n\n启动项目时，首先应提出一个研究方向或课题，通常关注特定的疾病、治疗方法、药物或其他状况。理想情况下，多学科团队中的特定领域临床医生、流行病学家或生物医学科学家可以根据一些潜在的生物医学或临床假设或科学问题启动项目，尽管这不需要非常具体。由于\
  \ EHR 数据库通常包含大量患者的数据，并涵盖许多不同的疾病、治疗和状况，很容易提出许多临床、生物医学或流行病学问题。然而，确定一个好问题并不容易。\n\n\
  什么是好问题？根据我们的经验，基于 EHR 的良好研究问题应满足以下标准：\n\n*   如果：如果我们能够回答该问题或证明/反驳假设，结果和结论将具有临床重要性和高影响力，以便我们能够在高影响因子期刊上发表结果。\n\
  \n\n\n\n\n-   适用于可用的 EHR 数据以解决问题：EHR 数据对于解决所提的问题或假设是合适的，甚至是最佳的数据。有时，可用的 EHR 数据对于某个问题或假设可能并非理想或最佳。如果能证明\
  \ `EHR` 数据是解决所提问题或假设的唯一途径，且没有其他替代方案，将是理想的。\n\n-   可用且可靠的终点或结局数据：对于所提的问题或假设，可以从 `EHR`\
  \ 数据库中获取或得出合适的终点或结局数据。对于任何临床或科学问题和假设，必须定义并识别合适的终点或结局，有时可以使用良好的标志物。有必要确认这些终点或结局数据在\
  \ `EHR` 数据库中可用且可靠。例如，要将死亡作为结局或终点来评估疾病治疗，研究人员需要仔细评估 `EHR` 系统是否能可靠地记录大多数因治疗导致的死亡病例。然而，对于慢性病治疗，这可能并非事实，因为随访时间通常不足以让\
  \ `EHR` 系统捕捉到因慢性病导致的死亡。\n\n-   样本量足够：`EHR` 数据库中的样本量（受试者数量、事件和/或测量次数）通常很大。然而，对于特定的问题或假设，我们必须根据入组/排除标准筛选受试者。对于罕见病或罕见事件的问题或假设，样本量可能是一个问题。因此，根据所提的问题或假设仔细定义研究队列，并制定合适的入组/排除标准以确保样本量足够至关重要。\n\
  \n观察性研究的类型包括：1) 个案研究或病例报告：对一个或一系列特殊或独特病例的描述性报告，是产生假设的好来源，而不是为了探索任何关联或因果关系；2) 横断面研究：通过问卷或其他方法，在给定的时间点从特定人群中同时收集暴露、干预/预防治疗及结局的数。这类研究通常用于定义疾病或结局的发生率、患病率和相关风险因素，但很难通过横断面研究识别因果关系；3)\
  \ 病例对照研究：基于历史数据，选择对照组受试者并在重要因素上与病例组匹配，以便在某些方面公平地比较这两组的结局。这种研究可以用于比较暴露、治疗和预防/干预策略的有效性，但由于观察性研究存在样本选择偏倚和潜在的混杂因素，必须加小心；4)\
  \ 队列研究：包括前瞻性和回顾性队列研究，在一段时间内收集纵纵向数据。这类研究可以提供有关暴露与结局之间因果关系的某些证据；以及 5) 真实世界数据研究：如 `EHR`\
  \ 数据等是为了业务运营、报告和实践目的而收集的。这些数据并非为了研究目的而收集，但可以基于真实世界数据制定上述四种类型的研究。此外，`EHR` 和保险理赔数据库等真实世界数据可用于开发未来疾病负担和结局的准确预测模型，并利用其长期随访期和大样本量进行药物警戒以检测罕见的药物不良事件。\n\
  \n注意，某些问题（如治疗评估或组间比较）可能无法通过回顾性 `EHR` 数据解决。这是因为患者没有被随机分配到比较组，且结果可能会受到许多因素的干扰，包括 `EHR`\
  \ 数据库中可能无法提供的病情严重程度。因果推断方法可以在一定程度上解决这些混杂问题。因此，在制定良好的研究问题或假设时，应尽量避免组间比较，除非数据能够证明或支持这种公平的比较。\n\
  \n基于 `EHR` 数据库确定良好的临床研究问题需要领域临床/流行病学科学家与数据科学家之间的紧密合作。初始数据探索是必要的，在确定出良好的问题或假设之前，可能需要特定领域临床医生/流行病学家与数据科学家之间进行多次迭代交互。问题或假设在数据探索过程中甚至在数据分析阶段都被修改或更改。关于疾病、治疗或状况的模糊或通性问题可以作为统计学家和数据科学家开始数据探索的初始目标。数据探索结果可以展示给临床或流行病学专家，以便逐渐识别出更具体的问题或假设。可以起草一份数据提取汇总统计报告（详情请参见第\
  \ 3 章），作为数据科学家与特定领域临床医生/流行病学家之间的沟通渠道。根据数据探索的结果，初始的临床或流行病学问题可能会被修改、改进甚至完全改变。有时，临床问题或假设可能在完成最终数据分析之前无法定稿。数据可视化和描述性/汇总统计通常用于初始数据探索，以确定良好的临床问题或假设。\n\
  \n我们这里的重点是临床或科学研究项目。人们也可以基于 `EHR` 数据库启动统计或计算方法研究项目。方法学研究项目的程序或生命周期是不同的，书中不会讨论。\n\
  \n### 1.2.2 数据查询与数据提取\n\n`EHR` 数据库应转换为结构化的关系型数据库，以便查询和提取数据。理想情况下，将数据库转换为 `OMOP 通用数据模型`\
  \ `OHDSI 2020`，这允许对不同的观察性数据库进行系统分析。`OMOP 通用数据模型` (`CDM`) 的核心理念是将来自不同数据库的数据转换为通用格式（数据模型）和通用表示（术语、词表、编码方案等），以便可以使用基于通用格式编写的标准分析程序库进行系统分析。\n\
  \n有时查询数据库以提取特定临床研究问题的相关数据并非易事。为了建立数据提取的入组/排除标准，需要熟悉数据库结构以及疾病、药物、临床事件、生命体征、实验室检查、手术等的术语、词表和编码系统。\n\
  \n\n\n\n有必要开发和使用更稳健的数据提取方法，以避免或减少数据提取错误，因为如果数据提取错误或不确定性太大，数据分析结果和结论将不可不可的。有时，可能需要通过人员和/或多种方法进行冗余数据提取，以避免错误或偏差。为了利用\
  \ EHR 数据库中的数据来解决临床问题或假设，数据提取的一个关键原则是提取所有相关数据，在仔细探索数据之前不要丢弃任何数据。这意味着应该从所有相关的 EHR\
  \ 表中提取所有受试者的所有数据。应该考虑并探索所有 EHR 表中的每个变量。应该仔细审查不同就诊（encounters）的数据。对于特定的临床问题或假设，应该明确定义数据提取的时间范围。\n\
  \n另一个数据提取问题是 EHR 数据库中任何变量的数据可能包含错误。例如，如果尝试提取 18 岁及以上患者的数据，患者的 `age`（年龄）或 `birth\
  \ date`（出生日期）可能包含错误。由于错误，提取的数据可能包含某些年龄小于 18 岁患者的数据。如果从特定疾病患者中提取数据，`disease diagnosis`（疾病诊断）也可能包含错误。如何确认患者患有特定疾病也并非易事。由于这些错误来自\
  \ EHR 系统的历史数据，且受试者无法溯，这些错误都难以验证和纠正。因此，根据领域专家提供的入组/排除标准提取目标患者队列的数据时，始终存在某种程度的不确定性。EHR\
  \ 表型分析方法（Banda et al. 2018, Glicksberg et al. 2018, Hubbard et al. 2019, Gronsbell\
  \ et al. 2019），包括基于规则的方法、自然语言处理或文本挖掘方法、回归和机器学习方法以及潜变量方法，可用于队列识别（详情请参阅第 3 章）。如有必要，可能需要在数据清洗（下一步）之后进行表型分析。此外，在后续数据分析中考虑数据提取错误和不确定性具有挑战性。\n\
  \n### 1.2.3 数据清洗\n\n我们仔细定义了“数据清洗”，并将其与数据处理/预处理以及数据准备区分来。数据清洗是消除冗余、纠正错误、标准化编码系统的不一致性、统一变量单位以及合并被错误分散在不同表格或错误位置的数据或变量的过程。数据清洗的示例包括：\n\
  \n* 某些患者可能来自不同临床就诊（`encounters`）的多且冲突的 `race`（种族）、`gender`（性别）或 `birthdate`（`age`\
  \ 年）记录，需要进行统一。\n* 疾病诊断表可能使用不同的疾病编码系统，如 `ICD-9`、`ICD-10` 或 `ICD-10-CM`，需要标准化。\n*\
  \ 同一种药物的通用名称可能有不同的拼写方式。\n* 某些实验室检查结果或临床事件测量在不同患者的不同就诊中可能不同的单位。\n* `procedure`（操作）、`surgical\
  \ procedure`（手术操作）等表可能也使用不同的编码系统，需要标准化。\n\n数据清洗不依赖于特定的项目或数据分析的特定目的，应该针对整个 EHR 数据库进行，因为所有项目和所有数据分析都需要它，除非某个项目旨在研究\
  \ EHR 数据输入或数据管理的错误。数据清洗的一个挑战是，我们可能无法从数据中识别所有可能的错误，且某些错误并不容易检测。因此，清洗后的数据可能仍然容易出错，这可能并不容易处理。\n\
  \n### 1.2.4 数据预处理或处理\n\n在执行正式数据分析以解决临床或科学问题之前，我们必须对数据进行处理、汇总数据或从数据中提取有用特征，以便分析数据或为数据拟合统计模型。数据预处理或处理可能包括以下任务：\n\
  \n* 将数据汇总为新的数据变量，或从原始数据生成一些衍生变量。\n* 处理数据问题：例如，缺失数据插补或冗余数据合并。\n* 临床就诊（`encounter`）、药物、临床事件、`procedure`\
  \ 或其他事件有多个时间戳，且一些时间戳缺失。每个事件需要一个标准化的时间戳。\n* 临床就诊（`encounter`）、药物、临床事件、`procedure`\
  \ 或其他事件有多个时间戳，且一些时间戳缺失。每个事件需要一个标准化的时间戳。\n* 根据重复测量推导出不同的特征。\n* 使用特征工程和降维提取特征。\n\n\
  数据预处理或处理是针对特定项目的。不同的项目可能需要以各种方式处理数据。通常，这一步可能需要与下一步（数据准备）迭代执行，这两个步骤之间可能没有清晰的边界。\n\
  \n### 1.2.5 数据准备\n\n在数据清洗和数据处理之后，我们需要为不同的目的准备各种格式的数据。数据准备是目标驱动的，项目的不同目标可能要求以不同的方式准备数据。因此，即使对于一个特定项目，也需要为不同的分析准备多个版本的数据。数据准备可能包括但不限于以下任务：\n\
  \n* 用于数据准备的项目特定清洗：例如，患者的某些就诊可能相互重叠或时间间隔接近，我们可能需要合并或分离这些重叠的就诊。\n* 为不同的结果或终点定义、分类和标记患者。\n\
  * 定义数据的就诊或时间间隔。\n* 为不同的场景或情况准备数据，包括敏感性分析。\n\n如前所述，数据准备和数据处理可能需要迭代执行。由于在此步骤创建许多版本的准备数据，记录或标记最新版本的准备数据非常重要，确保所有团队成员在最终数据分析中使用正确版本的准备数据。\n\
  \n### 1.2.6 数据分析、建模与预测\n\n\n\n在正式的数据分析步骤中，必须仔细处理许多许多问题。首先，为特定的科学问题选择统计模型或方法具有挑战性，因为针对某一问题有许多可用模型和方法。不同的模型和不同的分析方法可能会产生不同的结果和结论，因此，选择合适的模型和数据分析方法至关重要。敏感性分析可能是必要的，以确保结果的可重复性和可靠性。\n\
  \n其次，我们有许多需要解决的数据分析问题。例如，从 EHR（电子健康记录）数据库中可以获得许多变量，包括疾病诊断、药物、临床事件（包括生命体征）、实验室结果、医疗操作等。我们不仅要处理高维数据问题，而且这些变量中的许多仍然是二分类或分类（序数）数据，且具有高缺失率。许多变量之间还存在高度相关性，这在数据分析之前可能需要新的降维方法。当我们使用观察性\
  \ EHR 数据进行组比较时，调整高维混杂因素也是具有挑战性的。需要一些新的因果推断和分析方法来解决这个问题。如上述，从 EHR 数据库中提取的数据包含错误和不确定性，因此队列或受试人群可能定义得并不准确。有必要开发新方法，在随后的数据分析和推理中考虑这些不确定性。\n\
  \n预测是大 EHR 数据分析中的重要任务之一。“预测”一词在大数据或数据科学社区中并没有明确定义。有时“预测”（prediction）和“估计”（estimation）这两个术语互换使用。为了更好地交流，我们需要清晰地定义“预测”的含义：根据在该未来事件之前发生或收集的历史数据，预测未来某个未知数量或事件的发生。在这种情况下，我们需要清晰地定义历史数据的时间间隔（观察窗口）和预测窗口（从历史数据的最后一个时间点到需要预测的事件或数量首次出现的时间点）。如果人的意图是估计观察窗口内的某个数量、参数或事件，我们应该称之为“估计（estimation）”而不是“预测（prediction）”。遵循工程学概念，如果我们试图估计历史数据最后一个时间点的状态或数量，我们可以称之为“滤波（filtering）”，**filtering**意味着过滤掉观测噪声。基于这一澄清，我们需要在预测模型中明确引入“时间戳”，并确保预测是基于历史数据对未来某个数量、参数或事件的估计或预测。\n\
  \n起草数据分析报告也很重要，要详细记录假设、模型、方法、结果和结论。报告可能还包括对整个项目的简要介绍、数据分析目标、研究设计、数据提取的纳入/排除标准，以及数据清洗、处理和准备步骤的总结。分析模型和方法及其相应的假设应详细记录，并根据数据分析的目的进行合理证明。主要的数据分析结果应通过适当的可视化方法（图表）进行详细说明，尽管某些结果（包括图表）如果体量过大，可以推迟附录或作为在线材料。可能会提供一些结论和讨论，并可能需要承认和讨论\
  \ EHR 数据和分析方法的局限性。参考文献应包含在报告末尾。注意，数据分析报告与用于发表的稿件不同。数据分析报告应详细记录所有关键步骤、过程、模型、方法和结果，但并非所有结果都可以发表。数据分析报告可能还包含有利于多篇论文发表的成果。因此，数据分析报告充当了\
  \ EHR 项目所有利益相关者的记录和/或通信渠道。\n\n### 1.2.7 结果验证\n\n由于 EHR 数据是为支持临床实践以及记录或计费目的而收集的观察性数据，从\
  \ EHR 数据得出的结果可能偏或或许多因素的干扰。有必要通过内部和外部数据源来验证结果。内部验证可以通过交叉验证完成，即将数据分为训练集和测试集，使用训练集得出结果，并使用测试集来测试或验证结果。由于\
  \ EHR 数据通常具有非常大的样本量，划分数据通常不会对统计检验的效力产生实质性的负面影响。理想情况下，可以使用不同的数据源（例如不同的 EHR 数据库或随机临床试验）进行外部验证，尽管这将需要更多的精力和成本。\n\
  \n### 1.2.8 结果解释\n\n我们还需要仔细解释从 EHR 数据中得出的结果，正如我们上面所建议，EHR 数据存在一些局限性和偏倚。我们必须承认这些局限性，并进行必要的验证以确认结果。领域临床专家、流行病学专家以及数据科学家需要共同努力，仔细解释结果。\n\
  \n### 1.2.9 发表与传播\n\n最后，必须起草一份稿件或报告，以便将结果传播给研究社区或公众。研究团队需要共同决定结果的哪些部分（如果不是全部）应该包含在用于发表的稿件或报告中。在选择和确定用于发表的结果时，应考虑可靠性和可重复性。应避免发表偏倚。\n\
  \n以系统的方法考虑所有上述步骤至关重要。我们将在后续章节中介绍并讨论每个步骤的详细方法。我们相信，系统性思维对于利用和挖掘 EHR 数据进行科学和知识发现至关重要。\n\
  ![image](img/inline1_1.jpg)\n\n## 1.3 挑战与机遇\n\n\n\n\n\n尽管电子健康记录（EHR）数据通常丰富且反映了真实世界的实践，但从方法论和实践的角度来看，利用\
  \ EHR 数据进行研究和科学发现面临着许多挑战和障碍。首先，为了研究目的获取或访问一个完整且通用的 EHR 数据库并不容易。尽管 `MIMIC` ([Johnson\
  \ et al. 2016) 是一个开放的电子病历（EMR）数据库，但它仅包含贝斯以色列弥尔西教士医学中心（BIDMC）ICU 的 EMR 数据，规模和范围都有限。通用的商业\
  \ EHR 和保险理赔数据库通常不对研究人员免费开放，某些数据库可以购买但成本高昂，通常超出了大多数个人研究人员的承受能力。公开共享 EHR 数据的主要障碍包括为了保护隐私而对数据进行去标识化的困难以及数据安全问题。幸运的是，我们机构能够以负担得起的成本获得去标识化的\
  \ `Cerner EHR` 数据库 ([Cerner 2020)，尽管在对数据进行研究和科学发现的分析之前，仍需投入巨大的精力进行处理和清洗。我们当前版本的\
  \ `Cerner EHR` 数据库的一个主要局限性是它只包含结构化 EHR 数据；非结构化数据如临床笔记、放射和病理图像，以及包括 EEG 和 ECG 数据在内的高频数据我们无法获取。在本书，我们将分享基于\
  \ `Cerner` 结构化 EHR 数据的 EHR 数据处理、清洗和分析经验。\n\n由于 EHR 数据并非为了研究或科学发现目的而收集的，数据收集可能倾向于其\
  \ EHR 系统的原始目的，即用于患者管理、文档记录和账单结算。某些对研究问题重要但可能对患者管理、文档记录或账单不重要的数据或变量可能没有被收集。因此，我们我们需要在数据分析和结果解释中考虑数据收集偏差。\n\
  \n## 方法论上的挑战\n\n从方法论的角度来看，正如我们上面讨论的那样，从数据提取到数据分析和预测的每个研究步骤都存在许多挑战。我们可能还需要应对来自 EHR\
  \ 数据的某些新挑战。例如，由于数据缺失问题以及缺乏确认的诊断或测试结果，很难确认具有特定疾病诊断或特征的患者，而这些特征可能是分析的纳入标准的一部分。在这种情况下，由于数据错误，包含在数据分析中的某些患者可能不满足纳入/排除标准，这可能会导致分析偏差。EHR\
  \ 数据库中许多变量和因素的高缺失率是另一个不易处理的问题。缺失率范围从 1% 到 99% 不等，且缺失可能不是随机的。还有许多对临床结果重要但未收集的因素或变量。在这种情况下，由于\
  \ EHR 数据库中未测量或未收集的混杂因素，进行治疗或组间比较可能并不容易。因此，基于回溯性观察研究的数据来证明比较结果通常是困难的。\n\n## 实际资源需求\n\
  \n由于 EHR 数据的复杂性，需要一个多学科团队来应对挑战，不仅是在数据分析，还包括数据提取、清洗和处理。一个良好的协作团队可能包括数据库专家、计算机科学家或信息学专家、统计学家、数据科学家、临床医生和流行病学家。招聘熟悉\
  \ EHR 系统以及医院或诊所数据录入程序的专家也同样重要。对于大量的 EHR 数据，具有高容量存储的高计算设施是必要的。因此，为了将 EHR 数据用于研究和科学发现，在人员和计算设备方面的成本很高。\n\
  \n## 研究中的机遇\n\n尽管利用 EHR 数据进行研究和科学发现面临许多挑战和限制，但也存在充足的机遇。通常，EHR 数据库包含了大量具有不同特征和状况的患者数据，可以用于解决许多临床和流行病学问题，特别是针对罕见疾病。虽然治疗或干预策略的金标准是随机试验，但基于\
  \ EHR 数据库反映了更多真实世界的状况，可以产生许多良好的假设。同时， EHR 数据的分析结果可以作为改进随机试验设计的先验。统计学家和数据科学家还有许多机会应对\
  \ EHR 数据的局限性和挑战。\n\n\nAnglemyer, Andrew, Horvat Hacsi, and Bero Lisa. Clinical outcomes\
