  \ (3.79) | 5.51 (4.12) | |\n\n## 7.3 中介分析\n\n### 7.3.1 中介分析介绍\n\n有很多方法可以假设变量之间的因果关系。例如，在上述\
  \ SAH 研究示例中，我们假设血管收缩剂与死亡率之间的关联受到中介的影响。中介概念在社会科学和心理学文献中已使用了几十年（例如，Rucker et al. 2011）。中介分析试图刻画暴露或治疗如何影响中间变量，以及受影响的中间变量如何影响结果。这为暴露或治疗影响结果的生物学机制或途径提供了见解。在我们的\
  \ SAH 示例中，血管药物可能通过涉及不同中间阶段的过程影响患者结果。我们可以建立并测试这样的中介模型，但这超出了本章的范围。\n\n与上述方法类似，中介可以通过可以通过“反事实”框架来说说明，该框架现在被广泛用于因果推断、统计学、经济学等正式方法论工作的工具。该框架作为描述因果关系的正式和技术性符号。在本节中，我们不使用“反事实”框架的正式符号来介绍中介分析。相反，我们将直观地描述基于回归的中介，而无需诉诸反事实形态的技术符号。对于感兴趣的读者，有几本书提供了关于反事实框架的更多细节。\n\
  \n### 7.3.2 乘法\n\n\n\n\n乘积法深受 Baron 和 Kenny 研究工作的影响（Baron and Kenny 1986）。在 Baron\
  \ and Kenny 1986 中使用的因果图（图 7.2）是一个极简的图表，阐述了原因、中介变量和结果之间的关系，其中 `A` 代表暴露变量，`M` 代表中介变量，`Y`\
  \ 代表结果变量。假设其他基线变量为 `C`。考虑结果和中介变量均为连续的情况。以下回归模型可以帮助解释“有中介”和“无中介”的效果。\n\n![图 7.2 中介模型。](img/fig7_2.jpg)\n\
  \n**图 7.2** 中介模型。\n\n*E*(*M*|*A*a*,*C*=*c*) = *β*[0]  + *β*[1]*a*  + *β*[2]^′*c*(7.3)\n\
  \n*E*(*Y*|*A*=*a*,*M*=*m*,*C*=*c*) = *θ*[0]  + *θ*[1]*a*  + *θ*[2]*m*  + *θ*[4]^′*c*(7.4)\n\
  \n`θ*[1]` 可用于获取直接效应，它是衡量原因在不通过中介变量的情况下对结果产生的指标。但在这里，中介变量和其他协变量的影响应该通过将它们直接合并到一个回归模型中来控制。这可以理解为在中介变量特定水平下对结果的处理效应。或者，可以将估计的结果效应\
  \ `θ*[1]` 视为直接相对于感兴趣的中间变量的效果。可能还有其他中间变量或机制解释了原因对结果的其他方面的影响（T. VanderWeele 2015）。通过中间变量对结果产生的影响是间接效应。根据这个定义，`β*[1]*θ*[2]`\
  \ 是间接效应的估计，即模型 7.3 中暴露的系数乘以模型 7.4 中中介的系数。\n\n### 7.3.3 差分法\n\n差分法在流行病学和生物医学领域被广泛应用。我们将继续使用两个回归模型进行解释。考虑以下回归模型：\n\
  \n*E*(*Y*|*A*=*a*,*C*=*c*) = *ϕ*[0]  + *ϕ*[1]*a*  + *ϕ*[4]^′*c*(7.5)\n\n*E*(*Y*|*A*=*a*,*M*=*m*,*C*=*c*) = *θ*[0]\
  \  + *θ*[1]*a*  + *θ*[2]*m*  + *θ*[4]^′*c*(7.6)\n\n如果不含中介变量的模型 7.5 的暴露系数 `ϕ*[1]`\
  \ 与含中介变量的模型 7.4 的暴露系数 `θ*[1]` 相比显著下降，则可能表明存在中介效应，因为中介变量 `M` 似乎对暴露导致的结果产生了影响（T. J.\
  \ VanderWeele 2016）。差值 `ϕ*[1]` 表明了中介作用。\n\n当结果和中介变量是连续变量时，如果不含中介变量的模型 7.5 的暴露系数\
  \ `ϕ*[1]` 与含中介变量的模型 7.4 的暴露系数 `θ*[1]` 相比显著下降，则可能表明存在中介效应，因为中介变量 `M` 似乎对暴露导致的结果产生了影响（T.\
  \ J. VanderWeele 2016）。差值 `ϕ*[1]` 表明了中介作用。\n\n当结果和中介变量是连续变量时，如果不含中介变量的模型 7.5 的暴露系数\
  \ `ϕ*[1]` 与含中介变量的模型 7.4 的暴露系数 `θ*[1]` 相比显著下降，则可能表明存在中介效应，因为中介变量 `M` 似乎对暴露导致的结果产生了影响（T.\
  \ J. VanderWeele 2016）。差值 `ϕ*[1]` 表明了中介作用。\n\n当结果和中介变量是连续变量时，使用线性回归法来估计效应是可行的。考虑\
  \ 图 7.3. 中的因果模型。工具变量 `Z` 意用于估计处理 `T` 对结果 `Y` 的影响。然而，`T` 和 `Y` 都可能受到混杂因素 `U` 的影响。为了消除混杂因素\
  \ `U` 的影响，我们使用工具变量 `Z`。观测变量只有 `T` 和 `Z`。\n\n## 7.4 存在未观测混杂因素时的工具变量估计\n\n### 7.4.1\
  \ 工具变量框架\n\n工具变量（IV）框架是处理未观测混杂因素的一类流行方法（Awan et al. 2020）。考虑 图 7.3. 中的因果模型。工具变量\
  \ `Z` 意用于估计处理 `T` 对结果 `Y` 的影响。然而，`T` 和 `Y` 都可能受到混杂因素 `U` 的影响。为了消除混杂因素 `U` 的影响，我们使用工具变量\
  \ `Z`。观测变量只有 `T` 和 `Z`。工具变量方法的成功需要满足以下三个假设：\n\n1. 工具变量 `Z` 与处理变量 `T` 相关。\n2. 在给定处理变量\
  \ `T` 的情况下，工具变量 `Z` 与结果 `Y` 独立。\n3. 工具变量 `Z` 不通过其他因素影响结果 `Y`。\n\n由于某些假设未满足，需要进行敏感性分析（VanderWeele\
  \ 2011, VanderWeele 2017](#ch07.xhtml#ref7_67)）。\n\n### 7.4.2 线性模型的二阶段最小二乘法\n\n\
  工具变量分析的方法包括二阶段最小二乘法（2SLS）（Angrist, Graddy, and Imbens 2000）、广义矩估计法（Hansen 1982,\
  \ Bennett, Kallus, and Tobias 2019）、系数比率法（Burgess, Small, and Thompson 2017）以及基于似然的方法（Hayashi\
  \ 2000）。在本章中，我们重点介绍最流行的 2SLS 方法。\n\n#### 线性模型\n\n考虑 图 7.3. 中的因果模型。\n\n![图 7.3 估计效应的工具变量模型。](img/fig7_3.jpg)\n\
  \n**图 7.3** 估计效应的工具变量模型。\n\n\n\n\n`T` = `β`[`T`|`G`]*G + `β`[`T`|`U`]*U*(7.7)\n\n\
  `Y` = `β`[`Y`|`T`]*T + `β`[`Y`|`U`]*U*,((7.8)\n\n其中 `T` 代表处理变量，`Y` 是结果，`U` 是混杂变量，`G`\
  \ 是工具变量。我们假设工具变量 `G` 与混杂变量 `U` 独立且与处理变量 `T` 相关。工具变量（IV）法估计处理变量 `T` 对结果 `Y` 的因果效应。\n\
  \n### 协方差分析\n\n在不失一般的情况下，我们可以假设 `Var(G)` = 1 且 `Var(T)` = 1。根据非混杂变量 `U` 与工具变量 `G`\
  \ 独立的假设，我们得出 `cov(G,U)` = 0。（图 7.3）\n\n对方程 (7.7)的两边取与 `G` 的协方差，得到：\n\n`cov(T,G)`\
  \ = `β`[`T`|`G`].(7.9)\n\n同样，对方程 (7.8)的两边取与 `G` 的协方差，我们得到：\n\n`cov(Y,G)` = `β`[`Y`|`T`]*cov(T,G)，这意味着\n\
  \n$\\beta\\_{Y|T} = \\frac{\\\\mathit{cov}\\left( {Y,G} \\right)}{\\mathit{cov}\\\
  left( {T,G} \\right)}.(7.10)\n\n定义 `Y` 对 `G` 的回归：\n\n`Y` = `β`[`Y`|`G`]*G.*(7.11)\n\
  \n取与 `G` 的协方差，我们得到：\n\n`cov(Y,G)` = `β`[`Y`|`G`].(7.12)\n\n将方程 (7.9) 和 (7.12) 代入方程\
  \ (7.10)，得到：\n\n$\\beta\\_{Y|T} = \\frac{\\beta\\_{Y|G}}{\\beta\\_{T|G}}.$\n\n处理变量\
  \ `T` 对结果 `Y` 的因果效应通过 ${\\widehat{\\\\beta}}\\_{\\mathit{Y|T}} = \\frac{\\beta\\\
  _{\\mathit{Y|G}}}{\\beta\\_{\\mathit{T|G}}}$ 进行估计。\n\n### 广义最小二乘估计量\n\n用于方程 (7.7)\
  \ 和 (7.8)中建模 IV 模型的结构方程为：\n\n-Y + `β`[`Y`|`T`]*T + `β`[`Y`|`U`]*U + `ε1`=0,(7.13)\n\
  -T + `β`[`T`|`G`]*G + `β`[`T`|`U`]*U + `ε2`=0(7.14)\n\n其中 `ε1`, `ε2` 与 `U` 不相关。令\n\
  \n`β`[`Y`|`U`]*U + `ε1`=`e1`,(7.15)\n`β`[`T`|`U`]*U + `ε2`=`e2`.(7.16)\n\n将方程 (7.13)\
  \ 和 (7.16) 代入方程 (7.13) 和 (7.14)，我们得到：\n\n-Y + `β`[`Y`|`T`]*T + `e1`=0,(7.17)\n-T\
  \ + `β`[`T`|`G`]*G + `e2`=0,(7.18)\n\n其中 `y`, `T` 是内生变量（其值由一个或多个独立变量决定或影响），用 `W=`yT`\
  \ 表示，`G` 是外生变量（不受其他变量影响的变量），`e1`, `e2` 与 `G` 不相关。\n\n令 $\\Gamma = \\begin{bmatrix}\
  \ -1 & 0 \\\\ \\beta_{Y|T} & -1 \\end{bmatrix}$，$B = [\\begin{matrix} 0 & \\beta_{T|G}\
  \ \\end{matrix}]$，$E = \\begin{bmatrix} e_{1} & e_{2} \\end{bmatrix}$，则 $\\Gamma^{-1}\
  \ = \\begin{bmatrix} -1 & -\\beta_{Y|T} \\\\ 0 & -1 \\end{bmatrix}$。此时，方程 (7.17)\
  \ 和 (7.18) 可以重写为矩阵形式：\n\n`W`$\\Gamma$ + `G`$B$ + `E`=0.(7.19)\n\n在方程 (7.19)的两边乘以\
  \ $\\Gamma^{-1}$，得到：\n\n`W` + `G`$B$$\\Gamma^{-1}$ + `E`$\\Gamma^{-1}$=0，可以简化为：\n\
  \n`W` = `G`$B$$\\Gamma^{-1}$ - `E`$\\Gamma^{-1}$ = `G`$\\Pi$ + $V$*(7.20)\n\n其中\
  \ $\\Pi = -B\\Gamma^{-1}$$\\begin{bmatrix} 0 & \\beta_{T|G} \\end{bmatrix}$，$V =\
  \ E\\Gamma^{-1}$。使用最小二乘法求解优化问题 (7.20)，得到：\n\n$\\Pi$ = (`G`$^T$*`G`)$^{-1}$*G`$^T$*`W`.(7.21)\n\
  \n利用关系 $\\Pi\\Gamma$ = $-B$，得到 (`G`$^T$*`G`)$^{-1}$*G`$^T$*`W`$\\Gamma$ = $-B$，这意味着\n\
  \n$G^T\\begin{bmatrix} Y & T \\end{bmatrix}\\begin{bmatrix} -1 & 0 \\\\ \\beta_{Y|T}\
  \ & -1 \\end{bmatrix} = -G^T\\begin{bmatrix} 0 & \\beta_{T|G} \\end{bmatrix}$(7.22)\n\
  \n展开方程 (7.22)，得到\n\n$G^T\\begin{matrix} Y + \\beta_{Y|T} & T \\end{matrix} = G^T\\\
  begin{matrix} 0 & \\beta_{T|G} \\end{matrix}$。因此，我们有\n\n`G`$^T$*`Y` = `G`$^T$*`β`[`Y`|`T`]*(7.23)\n\
  `G`$^T$*`T` = `G`$^T$*`β`[`T`|`G`]*(7.24)\n\n方程 (7.23) 和 (7.24)可以重写为：\n\n$G^T\\\
  begin{bmatrix} Y & T \\end{bmatrix} = G^T\\begin{bmatrix} \\beta_{Y|T} & \\beta_{T|G}\
  \ \\end{bmatrix}$(7.25)\n\n方程 (7.17) 和 (7.18)重写为：\n\n$\\begin{bmatrix} Y \\\\ T\
  \ \\end{bmatrix} = \\begin{bmatrix} T & 0 \\\\ 0 & G \\end{bmatrix}\\begin{bmatrix}\
  \ \\beta_{Y|T} \\\\ \\beta_{T|G} \\end{bmatrix} + \\begin{bmatrix} e_1 \\\\ e_2\
  \ \\end{bmatrix} = Z\\delta + e.$7.26)\n\n其中 $Z = \\begin{bmatrix} T & 0 \\\\ 0\
  \ & G \\end{bmatrix}$，$\\delta = \\begin{bmatrix} \\beta_{Y|T} \\\\ \\beta_{T|G}\
  \ \\end{bmatrix}$且 $e = \\begin{bmatrix} e_1 \\\\ e_2 \\end{bmatrix}$。\n\n将方程 (7.26)的两边均乘以\
  \ `G`$^T$，得到：\n\n`G`$^T$*`W`$^T$ = `G`$^T$*`Z`$\\delta$ + `G`$^T$*`e`.(7.27)\n\n\
  注意 $\\Sigma = (`G`$^T$*`e`,`G`$^T$*`e`) = `G`$^T$*$\\Lambda$*`G`*(7.28)\n\n其中 $\\\
  Lambda = \\begin{bmatrix} (\\beta_{Y|U})^{2}\\sigma_{U}^{2} + \\sigma_{\\varepsilon_{1}}^{2}\
  \ & \\beta_{Y|U}\\beta_{T|U}\\sigma_{U}^{2} \\\\ \\beta_{Y|U}\\beta_{T|U}\\sigma_{U}^{2}\
  \ & (\\beta_{T|U})^{2}\\sigma_{U}^{2} + \\sigma_{\\varepsilon_{2}}^{2} \\end{bmatrix}$\n\
  \n使用加权最小二乘法，我们得到广义最小二乘估计量：\n\n$\\hat{\\delta} = [Z^T G(G^T \\Lambda G)^{-1} Z^T]^{-1}\
  \ Z^T G(G^T \\Lambda G)^{-1} G^T W^T.(7.29)$\n\n如果假设 $\\Lambda = \\sigma² I$，则方程\
  \ (7.29)简化为：\n\n$\\hat{\\delta} = [Z^T G(G^T G)^{-1} Z^T]^{-1} Z^T G(G^T G)^{-1}\
  \ G^T W^T.(7.30)$\n\n### 两阶段最小二乘法\n\n现在我们研究广义最小二乘估计量与两阶段最小二乘估计量之间的关系。\n\n令 $\\hat{Z}\
  \ = \\begin{bmatrix} \\hat{T} & 0 \\\\ 0 & G \\end{bmatrix},(7.31)\n\n其中 `hat{T}`\
  \ = (`G`$^T$*`G`)$^{-1}$*`X`。[方程 (7.31) 可以简化为：\n\n$\\hat{Z} = \\begin{bmatrix} G(G^T\
  \ G)^{-1}G^T X & 0 \\\\ 0 & G \\end{bmatrix} = \\left( G \\right)^{T}G^{-1}Z$.7.32)\n\
  \n考虑两阶段最小二乘估计量：\n\n第一阶段\n\n求解回归 `T` = `G`*$\\hat{\\beta}$[`T`|`G`] + `e`,(7.33)\n\
  \n我们得到 `$\\hat{\\beta}$[`T`|`G`]` = (`G`$^T$*`G`)$^{-1}$*`T` 和 `hat{T}` = (`G`$^T$*`G`)$^{-1}$*`T`。(7.34)\n\
  \n第二阶段\n\n求解回归 `W`$^T$ = `hat{Z}`*$\\hat{\\delta}$ + `e`。(7.35)\n\n将方程 (7.32) 代入方程\
  \ (7.35)，得到：\n\n$\\begin{array}{l} \\hat{\\delta} = (\\hat{Z}^T \\hat{Z})^{-1} \\\
  hat{Z}^T W^T \\\\ \\quad = \\left( \\begin{bmatrix} T & 0 \\\\ 0 & G \\end{bmatrix}\
  \ \\right)^T \\left( \\begin{bmatrix} T & 0 \\\\ 0 & G \\end{bmatrix} \\right)^{-1}\
  \ \\begin{bmatrix} T & 0 \\\\ 0 & G \\end{bmatrix}^T W^T, \\\\ \\end{array}$(7.36)\n\
  \n\n\n\n\n其中 `Y` 是结果变量，`T` 是处理变量，`X` 是协变量向量，`g(.,.)` 是非线性函数，`e` 是包含不可观测混杂因素的误差项。我们假设\
  \ `E[e] = 0`。我们还假设处理变量是内生的，且与误差相关，即 `E[e|X,T] ≠ 0` 且 `E[e^T|X] ≠ 0`。\n\n![图 7.4\
  \ 用于 IV 和处理效应估计的通用图模型](img/fig7_4.jpg)\n\n**图 7.4**  \n\n用于 IV 和处理效应估计的通用图模型。\n\n\
  定义潜在结果预测函数（Hartford et al. 2017）\n\n```\nh(T,X) = g(T,X) + E[e|X].(7.38)\n```\n\n\
  记得我们假设处理变量与误差不相关，即：\n\n```\nE[e|T,X] ≠ E[e|X],(7.39)\n```\n\n这意味着：\n\n```\nE[Y|T,x]\
  \ = g(T,X) + E[e|T,X] ≠ g(T,X) + E[e|X] = h(T,X).(7.40)\n```\n\n由于 `E[e|X,T] ≠ 0`\
  \ 且未知，方程 (7.40) 显示 `E[Y|T,x]` 无法被直接估计，也无法通过 `h(T,X)` 进行估计。两个未知量 `g(T,X)` 和 `E[e|T,X]`\
  \ 需要两个方程来求解。类似于线性模型中的 2SLS，我们引入了工具变量（IV），以允许建立两个方程。之前 IV 方法的核心假设需要修改，以考虑协变量。新的三个假设（Hartford\
  \ et al. 2017）为：\n\n**步骤 1：**\n\n（相关性）：在给定 `X` 和 `Z` 的情况下，处理 `T` 的分布 `F(T|X,Z)`\
  \ 在 `Z` 上不是常数，即 `F(T|X,Z)` 取决于 `Z`。\n\n**步骤 2：**\n\n```\nZ ⫫ Y|(X,T,e).\n```\n\n\
  **步骤 3：**\n\n**(无混杂工具）：** 在给定协变量 `X` 的情况下，工具变量 `Z` 与误差独立，即 $Z⫫ e|X$。该假设意味着：\n\n\
  ```\nE[e|X,Z] = E[e|X].(7.41)\n```\n\n由方程 (7.37) 得：\n\n```\nE[Y|X,Z] = E[g(T,X)|X,Z]\
  \ + E[e|X,Z].(7.42)\n```\n\n根据条件分布的定义，我们得到：\n\n```\nE[g(T,X)|X,Z] = ∫g(T,X)dF(T,X|X,Z)\
  \ = ∫g(T,X)dF(T|X,Z).(7.43)\n```\n\n根据假设 3，我们得到：\n\n```\nE[e|X,Z] = ∫E[e|X,Z]dF(T|X,Z)\
  \ = ∫E[e|X]dF(T|X,Z).(7.44)\n```\n\n结合方程 (7.42)–(7.44)，我们得到：\n\n```\nE[Y|X,Z] =\
  \ ∫[g(T,X) + E[e|X]]dF(T|X,Z) = ∫h(T,X)dF(T|X,Z).(7.45)\n```\n\n为了通过方程 (7.45) 求解\
  \ `h(T,X)`，我们求解以下优化问题：\n\n```\nmin_{h(T,X)∈H Σ_{i=1}^n (Y_i - ∫h(T,X)dF(T_i,Z_i))².(7.46)\n\
  ```\n\n其中 `H` 是函数空间。\n\n为了消除处理与误差（混杂因素）之间的相关性，我们将估计分为两个阶段。在第一阶段，我们估计给定工具变量 `Z` 和协变量\
  \ `X` 时处理 `T` 的条件分布 `F(T|X,Z)`。然后，在将 `F(T|X,Z)` 替换为 `F(T|X,Z)` 后，求解优化问题 [(7.46)]。\n\
  \n在节 7.4.2 节讨论的线性模型下：\n\n```\nY = αT + βX + ε[Y].(7.47)\nT = τZ + γX + ε[T].(7.48)\n\
  ```\n\n其中假设 `E[ε]|X,Z = 0`, `E[ε]|X,Z = 0`。\n\n在线性模型下，我们得到：\n\n```\n∫ĥ(T,X)dF(T|X,Z)\
  \ = ∫(g(T,X) + E[e|X])dF(T|X,Z) = αE[T|X,Z] +..4)\n```\n\n将方程 (7.48) 代入方程 (7.49)，我们得到：\n\
  \n```\n∫ĥ(T,X)dF(T|X,Z) = α(τZ+γX) +.50\n```\n\n因此，我们首先使用最小二乘法求解回归问题 [(7.48)]，得到估计量\
  \ `τ` 和 `γ`。然后，我们将 `τ` 和 `γ` 代入[方程 (7.50)]。最后，我们将[方程 (7.50)] 代入优化问题 [(7.46)] 的目标函数中，并使用最小二乘法求解该优化问题。该优化问题的解重现了\
  \ 7.4.2 节中的结果。\n\n现在我们介绍使用非线性模型求解优化问题 [(7.46)] 的一些原理。令：\n\n```\nL(θ) = Σ_{i=1}^n\
  \ (Y_i - ∫h(T,X,θ)dF(T_i,Z_i))².(7.51)\n```\n\n其中非线性函数 `h(T,X,θ)` 可以通过深度神经网络实现，`θ`\
  \ 是神经网络的参数。基于梯度的算法常用于求解优化问题 [(7.51)]。`L(θ)` 的梯度为：\n\n```\n∂L(θ)/∂θ = 2Σ_{i=1}^n\
  \ (Y_i - ∫h(T,X,θ)dF(T_i,Z_i)) ∫∂h(T,X,θ)/∂θdF(T|X_i,Z_i).(7.52)\n```\n\n可以通过蒙特卡洛积分计算。细节超出了本章的范围。读者请\
  \ Mohamed et al. (2019)。\n\n条件分布 `F(T|X_i,Z_i)` 可以通过 CGAN（7.2.3.4 节）生成，其中 `X` 和\
  \ `Z` 是条件变量，`T` 是目标变量。生成的 (`T,X,Z`) 将代入[方程 (7.52)] 以计算梯度。\n\n\n\n\n在本节中，我们提出了一种替代匹配法（matching）来插补反事实并估计治疗效应的方案。在这里，我们引入了生成对抗网络（GANs）来估计反事实和治疗效应（Goodfellow\
  \ et al. 2014）。与从观测数据中估计平均治疗效应的经典非神经网络方法不同，GAN 估计个体化治疗效应（ITEs）（(Yoon, Jordon, and\
  \ Schaar 2018），这是迈向“精准医学”的重要一步。估计 ITE 的一个巨大挑战是消除混杂因素对治疗效应估计的偏差，其中混杂因素会影响治疗分配和结果。我们展示了\
  \ GAN 的扩展，用于在存在隐混杂因素的情况下对 ITEs 进行估计。GAN 和条件对抗网络（CGANs）是插补缺失数据的强大工具。下一节将介绍 CGANs\
  \ 作为一种插补反事实和估计 ITEs 的通用框架。\n\n## 7.5.2 作为个体化治疗效应估计通用框架的 CGANs\n\n估计 ITE 的挑战在于对反事实进行无偏估计。反事实永远无法被观测到，也无法通过数据测试，因为真实的反事实是未知的。最近提出的\
  \ GAN 和 CGANs 开启了深度学习的革命。GAN 和 CGANs 为缺失数据插补提供了强大的工具。GAN 和 CGANs 有可能在给定部分观测和数据中其他信息的情况下准确准确生成缺失数据的分布。因此，我们可以使用\
  \ GAN 和 CGANs 来产生潜在的反事实。\n\nGAN 和 CGANs 由两部分组成：称为生成器（generator）的“生成”部分和称为判别器（discriminator）的“对抗”部分。两者都通过神经网络实现。通常，将一个可能是均匀分布或正态分布的\
  \ K 维噪声向量输入到生成器网络，该网络利用非线性变换理论将噪声向量转换为新的所需假数据实例。然后，将生成的新假数据实例输入到判别器网络以进行真实性评估。生成器不断学习生成更好的假数据实例，而判别器则不断获取真实和假数据，并提高对真实性评估的准确性。\n\
  \n### 用于生成潜在结果的 CGANs 架构\n\n观测到的事实和协变量为估计反事实提供了基本信息。因此，我们使用 CGANs 作为 ITE 估计的通用框架。用于\
  \ ITE 估计的 CGANs 由两个块组成。第一个块用于插补反事实，称为插补块（imputation block）。第二个 ITE 块使用插补块产生的预测完整数据集来估计治疗效应的分布。CGANs\
  \ 的架构如图图 7.5` 以及 K 维随机向量 `z[*G*]` 的非线性函数，其中均匀分布的 `z[*G*]`  ∼ `U*((−1,1)^(*K*))`\
  \ 且 ${\\overline{Y}}^{f} = {\\overline{Y}}^{\\eta}$。生成器产生的潜在结果表示为\n\n```\n\\widetilde{Y}\
  \ = G({X,{\\overline{Y}}_{f},{T \\odot W \\odot z}_{G}},\\theta_{G})\n```\n\n其中输出\
  \ `Ỹ` 代表 `G` 的一个样本。它可以取二进制值、类别值或连续值。`1` 是全 1 向量，`⊙` 表示逐元素相乘，`θ[*G*]` 是生成器中的参数。生成器由神经网络实现。我们使用\
  \ `Y` 表示通过用 ${\\overline{Y}}^{f}$ 替换 `Y^(*η*)` 完整数据集。\n\n`Ỹ` 的分布取决于非线性变换函数 $G({\\\
  overline{Y}}^{f},T,z_{G},\\theta_{G})$ 雅可比矩阵的行列式（Ross, n.d.）。改变变换函数可以改变生成的反事实的分布。令\
  \ `P[*Y**|**x*,t*,w*,y^(*f*)]` 为给定 `X=x`, `T=t`, `W=w`, `Y^(*f*))=y` 时潜在结果的条件分布。生成器的目标是学习神经网络\
  \ `G` 使得：\n\n```\nG(x,y^(*f*),t,w,z[*G*],θ[*G*]) ~ P[*Y**|**x*,t*,w*,y^(*f*)])\n\
  ```\n\n与标准 CGANs 中的判别器（评估输入数据的真实性，即真实或假数据）不同，反事实判别器 `D[*G*]` 将对 `(x,y)` 映射到 `[0,1]^(*k*)`\
  \ 中的向量，试图将事实部分与反事实区分开。反事实判别器 `D[*G*]` 的输出是区分事实与反事实的结果。（此处原文逻辑似乎略有混乱，已按语义翻译）\n\n\
  注：`Ỹ` 的分布取决于非线性变换函数 $G({\\overline{Y}}^{f},T,z_{G},\\theta_{G})$ 雅可比矩阵的行列式。改变变换函数可以改变生成的反事实的分布。令\
  \ `P[*Y**|**x*,t*,w*,y^(*f*)]` 为给定 `X=x`, `T=t`, `W=w`, `Y^(*f*))=y` 时潜在结果的条件分布。生成器的目标是学习神经网络\
  \ `G` 使得：\n\n```\nG(x,y^(*f*),t,w,z[*G*],θ[*G*]) ~ P[*Y**|**x*,t*,w*,y^(*f*)])\n\
  ```\n\n与标准 CGANs 中的判别器（评估输入数据的真实性，即真实或假数据）不同，反事实判别器 `D[*G*]` 将对 `(x,y)` 映射到 `[0,1]^(*k*)`\
  \ 中的向量，试图将事实部分与反事实区分开。反事实判别器 `D[*G*]` 的输出是区分事实与反事实的结果。\n\n（注：原文后半部分存在重复及逻辑跳跃，翻译时尽量遵循原文结构并修正了术语对应关系）\n\
  \n\n\n遵循标准的 CGAN，我们定义判别器 `D[I]` 为非线性分类器，其输入为对 `(X,Y^*)=*Y*)` 或 `(X,Y^*)=*Ŷ)`，其输出为一个标量，表示\
  \ `Y^*` 来自完整数据集 $\\overline{D}$ 的概率。\n\n### 损失函数\n\nITE 块的损失函数定义为\n\n*V**I* = *E*[*X* ∼ *P*(*x*)]\\\
  [*E*[*Y^* ∼ *P*[*Y|*X*]](y*)*)\\logD*I**)**E*[*ZI�����������*((ⅅ−��1,��K]))]K(11logDD**D*XXYY*)*)\\\
