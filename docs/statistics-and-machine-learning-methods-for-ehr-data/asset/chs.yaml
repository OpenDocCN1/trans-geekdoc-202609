  \ `AUC` 来评估不同模型和算法的性能。`AUC` 越高，模型性能越好。当 `AUC` 等于 `0.5` 时，表明模型的效果等同于随机猜测。\n\n图 10\
  \ 展示了不同模型 `AUC` 的的大致情况。理想情况下，如果一个模型被认为是良好的，那么曲线必须靠近左上角；如果曲线位于从左下角到右上角的对角线附近，则该模型的\
  \ `AUC` 约为 `0.5`，表明模型性能不佳。对于我们的模型，结果通常被认为是好的。大多数 `AUC` 值都高于 `0.8`，某些结果甚至高于 `0.9`。\n\
  \n比较这六种情况的结果表明，我们使用的数据越多，预测就越准确。\n\n## 10.5 结论与建议\n\n从上述可以看出，没有通用的最佳包，且包的性能会随模型和数据输入而异。我们必须在运行时间与性能指标之间进行权衡。`TPOT`、`H2O`\
  \ 和 `Caret` 提供结果的速度较快，而通过 `Auto-sklearn` 训练模型需要更多时间（默认运行时间为一个小时）。\n\n在我们特定的问题中，`Auto-sklearn`\
  \ 中的 `SVM` 性能最佳。此外，`逻辑回归`并没有产生最佳性能。对于 `随机森林`，`H2O` 生成的结果比其他三个包都好，但在 `first 48` 数据版本除外，那里\
  \ `caret` 模型略优于 `H2O`。`TPOT` 在 `逻辑回归` 模型上比其他三个包具有更高的 `AUC`，但在 `cut 72` 数据版本除外。`TPOT`\
  \ 在 `SVM` 模型上也比其他三个包具有更高的 `AUC`，但在 `first 24` 数据版本除外。\n\n`extra tree` 和 `random\
  \ forest` 等树模型在我们的数据集中表现不佳，如果你想在特定项目中使用树模型，我们推荐 `H2O`。对于 R 用户，`H2O` 和 `Caret` 文档齐全且易于使用。对于\
  \ Python 用户，如果你有 `scikit-learn` 经验，`TPOT` 和 `Auto-sklearn` 会很熟悉。通常情况下，如果有足够尝试所有的包，它可以给你更好的模型性能估计，但上述任何包在特定项目中都可以产生合理的结果。\n\
