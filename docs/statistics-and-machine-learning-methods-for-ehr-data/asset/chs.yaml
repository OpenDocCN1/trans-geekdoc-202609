  \ 4 章中讨论的方法进一步执行更多针对特定项目的数据清洗。数据分析的不同目的可能要求数据进行不同的预处理或准备，而这些通常是项目特定的。例如，不同项目的不同分析目的可能需要以方式定义或重新定义结果或预测因子，并且可能需要更具体的数据清洗和处理以更好地确定结果或预测变量。\n\
  \n![图 5.1 涉及多个迭代步骤的数据分析框架。](img/fig5_1.jpg)\n\n**图 5.1**\n\n涉及多个迭代步骤的数据分析框架。\n\n\
  数据预处理和数据处理通常被互换使用。在这里，我们将区分数据预处理/处理与数据准备，尽管这两个步骤有时难以区分。\n\n### 5.1.1 数据预处理/处理的定义\n\
  \n在我们进行正式的数据分析以解决临床或科学问题之前，我们需要对数据进行处理、汇总或从从中提取有用的特征。数据预处理或处理可能包括以下任务：\n\n* 将数据汇总为新的数据变量，或从原始数据中生成派生变量\n\
  * 处理数据问题：例如，缺失值填补或冗余数据合并\n* 根据某些变量的重复测量值推导出不同的特征\n* 使用降维或其他特征工程方法提取特征\n\n数据预处理步骤是项目特定的。不同的项目可能需要不同的方式处理数据。通常，数据处理步骤可能需要与数据准备迭代进行，在某些情况下，这两个步骤可能没有清晰的边界。理想情况下，我们应该从原始数据中提取尽可能多的特征，以便识别埋在原始数据中的信号和信息，用于下游分析。\n\
  \n### 5.1.2 数据准备的定义\n\n在数据清洗和数据处理之后，我们必须根据不同的分析目的准备不同格式的数据。数据准备是以目标为驱动的，一个项目的不同目标可能要求以不同的方式准备数据。因此，即使对于一个特定的项目，也可能为不同的分析目的准备多个版本的数据集。数据准备可能包括但不限于以下任务：\n\
  \n* 用于数据准备的特定项目数据清洗：例如，如果患者的某些就诊记录可能重叠或在时间上非常接近，那么我们可能需要合并或分离重叠的就诊，以满足特定数据分析的目标\n\
  * 为不同的结果、治疗或状况对患者定义、分类和标记\n* 定义就诊或时间间隔，以为不同的分析目的准备数据\n* 为不同的场景或案例准备数据，包括用于敏感性分析\n\
  \n如前所述，数据准备和数据处理需要迭代进行。可能需要为不同的分析目的准备多个版本的准备数据。\n\n## 5.2 数据处理\n\n![image](img/inline_1)\n\
  \n### 5.2.1 整洁数据（Tidy Data）的原则\n\n变量编码的主要目标是将原始数据转换为适用于统计分析的格式。整洁数据有三个原则：\n\n* 每个变量有一列\n\
  * 每个观测值有一行\n* 每个单元格有一个值\n\n对于结构化数据，我们可能需要合并来自这些表中的变量。在图 5.2 中，展示了如何创建整洁数据集的图。然而，许多其他表（例如药物表）可能不是整洁格式，而是长格式（long\
  \ format）。例如，共 4 种治疗将生成 4 列。通过就诊 ID 合并药物表和就诊表后，整洁数据的每行代表患者的一次就诊。\n\n![图 5.2 从结构化\
  \ EHR 数据创建整洁数据的图。在这里我们将药物变量视为二分类变量。](img/fig5_2.jpg)\n\n**图 5.2**\n\n从结构化数据创建整洁数据的图。在这里我们将药物变量视为二分类变量。\n\
  \n\n\n\n\n这里我们提供了一个来自 EHR 项目的变量编码的具体示例，即针对蛛膜下出血（SAH）患者的血管收缩药物治疗评估和死亡率预测。蛛膜下出血（SAH）是一种罕见且危及生命的卒中，约占美国所有中风病例的\
  \ 5% 到 10%。SAH 后一种特别严重且常见的并发症是延迟性脑缺血，延迟性脑缺血的发展会导致 SAH 患者具有更高的死亡率和残疾率。当临床怀疑延迟性脑缺血时，除非血压已经升高，否则通常建议诱导高血压以维持脑灌注（Connolly\
  \ Jr et al 2012）。虽然通常会使用血管收缩药物来维持脑灌注，但尚不知道哪种血管收缩药物对改善结局最有效。在本项目中，我们以死亡率为终点，评估了非创伤性蛛膜下出血患者初始使用不同血管收缩药物的情况。基于该人群\
  \ EHR 数据库中可用变量和潜在预测因子开发了一个死亡率预测模型。我们将使用此项目作为示例，阐述本章中的数据处理和准备原则及方法。\n\n在该 SAH 研究中，我们使用了药物的通用名称，并将药物变量处理为二分类预测因子，即如果患者接受过该药物则为“1”，否则为“0”。诊断、实验室检查和临床事件也被视为二分类变量。同时，这些某些变量（如临床事件表中的实验室检查和生命体征）也可以视为分类或连续变量。例如，血糖测量值或血压具有数值，可以被视为连续变量。\n\
  \n### 5.2.2 特征提取：派生变量\n\n在 EHR 数据中，某些变量（如实验室检查结果、临床事件和生命体征）在不规则的时间间隔内重复测量，而对对患者仅测量一次。某些生命体征（如血压或心率）经过密集测量或监测。在某些情况下，我们需要将这些重复测量的变量与患者单次测量变量相结合，用于预测和其他统计模型。有必要对这些变量进行汇总（即具有重复测量值的变量转换为汇总统计量），或使用某些特征提取或特征工程方法从中提取特征，以便为下游分析创建“整洁数据”（tidy\
  \ data）。\n\n首先，我们可以从个体变量的重复测量中提取简单且有意义的特征。这些特征可以是简单的汇总统计量，例如每个变量重复测量值的平均值、中位数、最小值、最大值、范围、分位数、标准差或方差。其他简单特征可能与测量时间有关，例如第一次测量、最后一次测量或治疗后的后续测量。这些简单特征每一个都反映了变量多次测量的部分信息，并且具有可解释性。如果我们能收集所有可能的特征，希望所有重复测量变量的信息都能包含在分析模型中，并最大限度地减少信息损失。例如，表\
  \ 5.1 提供了从 EHR 数据库的实验室检查变量中提取的特征列表。图 5.4 显示了具有重复测量的实验室检查变量的特征提取结果。\n\n**表 5.1**\
  \ 重复测量实验室检查的派生特征示例\n\n| 特征名称 | 描述 |\n| :--- | :--- |\n| FirstTime | 第一次 |\n| LastTime\
  \ | 最后一次 |\n| Duration | 最后一次时间 - 第一次时间 |\n| Counts | 总计数 |\n| Frequency | 多少天？\
  \ |\n| FirstTimeToT0 | 从第一次到 T0 |\n| LastTimeToTe | 最后一次到测试 |\n| Mean | 平均值 |\n\
  | Median | 中位数 |\n| Min | 最小值 |\n| Max | 最大值 |\n| Var | 方差 |\n| Mode | 众数 |\n| 1Quartile\
  \ | 第 1 分位数 |\n| 3Quartile | 第 3 分位数 |\n| IQR | 四分位间距 |\n| QCD | 离散系数 |\n| STdev\
  \ | 标准差 |\n| CV | 变异系数 |\n| Skew | 偏度 |\n| Kurt | 峰度 |\n| Peaks | 分布的峰值计数 |\n\n\
  **图 5.4** 从具有重复测量的实验室检查变量中可以提取如平均值、方差、实验室检查频率和测试时间等简单特征。\n\n\n\n\n\n| LMV | 至少存在一个测量值\
  \ |\n| --- | --- |\n| Lab0 | 该患者未上传任何实验室数据 |\n| NM | 未测量 |\n| MM | 已测量但存在缺失 |\n\
  | FM | 已测量但未派生特征 |\n\n![image](img/inline5_4.jpg)\n\n在这里，我们只讨论了从单个变量派生的衍生变量和提取的特征。某些特征可以从两个或多个变量派生。例如，体重指数（`BMI`）是一个根据体重和身高计算的知名衍生变量。类似的特征也可以从多个变量派生。一旦为所有变量和所有患者生成了特征，这些特征就可以重命名为新变量或作为下游数据分析的潜在预测因子。\n\
  \n### 5.2.3 降维\n\n降维方法可以用于生成特征，尽管这些方法生成的大多数特征可能并不容易解释。特别是在临床和人口健康实践中，它们可能不便于用于干预或预防目的。然而，降维方法仍然广泛用于从高维数据中提取特征以用于预测和聚类。它对于减少预测因子数量以提高预测准确性和可解释性也是很有用的。\n\
  \n#### 变量分组或聚类\n\n维度灾难是我们需要解决的 EHR 数据问题之一。这是因为许多 EHR 变量，如疾病诊断、药物、实验室检查、临床事件、生命体征和操作都是高维的。如果我们能将这些变量分组或聚类为更高级别的组，维度就可以显著降低。\n\
  \n例如，对于疾病诊断，`ICD-9-CM` 系统包含一万多个代码。根据 `ICD-9-CM` 编码系统的分级结构，我们可以使用仅包含三位数字的高级 `ICD-9-CM`（`<1000`\
  \ 个疾病组）。此外，表型全组关联研究（`PheWAS`）将 `ICD-9` 代码分成了 `<2000` 个疾病组（`phecodes`），而美国医疗研究与质量机构的\
  \ `ICD-9-CM` 临床分类软件（`CCS`）将所有 `ICD-9-CM` 代码分成了 `<300` 个类别。Wei 等人利用电子健康记录（`EHR`）数据进行了一项研究，评估了用于表型全关联研究的\
  \ `ICD-9-CM`、`CCS` 和 `phecode` 编码系统[Wei et al. 2017]）。他们的结果表明，尽管所有的 `ICD-9-CM`、`CCS`\
  \ 和 `phecodes` 都可以用于 `PheWas` 研究，但 `phecodes` 系统产生的分析结果更优（[Wei et al. 2017]）。此外，`phecodes`\
  \ 与临床实践中常用的疾病类别更一致。最新版本的 `phecodes` 将 15,558 个 `ICD-9-CM` 代码（包括三位和五位代码）分成了 1,866\
  \ 个疾病类别（[Denny et al. 2013]）。同样，我们可以将其他类型的 `EHR` 变量（如药物、实验室检查和操作）分组为更高层次的类别，从而降低变量的维度。此外，某些类别变量的类别过多，也可以被分组或合并为更大的类别，以确保每个类别的样本量对于下游分析来说不会太小。例如，种族有\
  \ 99 个类别，而小类别的受试者很少。在这种情况下，我们可能会合并这些小类别，以获得进一步分析所需的足够样本量。然而，当我们尝试通过将变量和类别合并为较大的类别来降低维度时，必须考虑分析结果的分率与样本量之间的平衡。这需要根据具体情况进行考虑。\n\
  \n#### 主成分分析（主成分分析法）\n\n降维方法可以用于生成特征，尽管这些方法生成的大多数特征可能并不容易解释。特别是在临床和人口健康实践中，它们可能不便于用于干预或预防目的。然而，降维方法仍然广泛用于从高维数据中提取特征以用于预测和聚类。它对于减少预测因子数量以提高预测准确性和可解释性也是很有用的。\n\
  \n主成分分析（`PCA`）是一种多变量技术，用于通过旋转数据集将相关变量转换为不相关的变量。`PCA` 通过一个正交变换，将高维数据转换为新的特征。这种变换将数据集旋转到一个正交的坐标系，使得最大的变异位于第一个方向（第一个\
  \ `PC` 组），第二大的变异位于位于第二个方向，依此类推。对于 `PCA 降维`，我们可能会保留前 `q` 个 `PC`（`q < p`），使得这些成分能够解释\
  \ `X` 中的大部分变异。可以通过公式计算第 `i` 个 `PC` 的变异解释百分比：$PC = \\frac{\\lambda_{i}}{\\sum_{k\
  \ = 1}^{p}\\lambda_{k}}$\n\n在许多情况下，大型 `p` 的 80% 变异可以归于前几个 `PC`，这有助于我们在不损失过多信息的情况下通过这些组件减少数据集的维度（[Jolliffe\
  \ 2011]）。然而，如果我们在预测模型中使用 `PCs` 作为预测因子，可能很难从临床角度解释结果和预测 因子，这是使用 `PCA` 进行降维的缺点。在这里只讨论了线性模型和高斯假设下的\
  \ `PCA` 方法。其他降维方法，请参见 `Li` 的著作（[Li 2018]）。\n\n#### 嵌入与深度学习\n\n`EHR` 数据具有高维且稀疏的医学代码，如药物、诊断和操作。有效地降低数据维度可以提高数据分析和预测的性能。嵌入是一种降维方法，将二进制和类别变量转换为连续特征向量。对于二进制或类别变量，基本的编码方法是独热编码或哑编码：每个变量被表示为一个有一个“1”和多个“0”的向量。然而，独热编码有一些缺点。在高维设置中，它很容易过拟合，导致预测模型的泛化性能不佳。在图\
  \ 5.5 中，我们展示了独热编码和嵌入向量之间的区别。对于 6 个医学代码，独热编码需要一个长度为 6 的向量来表示每个代码，而嵌入向量只需要 3 个维度。在实际应用中，可以根据需要选择嵌入向量的维度以获得更好的性能。\n\
  \n**图 5.5**\n\n说明嵌入方法的图示。\n\n\n\n\n\n为了提高使用电子健康记录（EHR）数据的预测准确性，在嵌入方法方面做了许多努力。某些方法很大程度上借鉴了自然语言处理（NLP）技术的词嵌入思想，例如连续词袋模型（CBOW）和\
  \ Skip-gram（Mikolov et al. 2013）。CBOW 的目标是根据周围的词预测当前词。相反，Skip-gram 用于在给定当前词的情况下预测周围的词。Choi\
  \ 等人提出了 `Med2vec`，它可以用于从大型 EHR 数据集中学习医疗代码和就诊记录的分布式表征（Choi, Bahadori, Searles, et\
  \ al. 2016）。\n\n## 5.2.4 缺失值插补\n\n在数据处理步骤处理缺失数据至关重要。EHR 数据库通常是为了实际操作或计费目的而设计的，而不是为了数据分析或研究目的，数据缺失问题在\
  \ EHR 数据中非常普遍。目前已经提出了通过期望极大（EM）方法的基于似然法（Dempster, Laird, and Rubin 1977）和通过 MCMC\
  \ 技术的贝叶斯法（Andrieu et al. 2003）在各种回归模型下直接处理缺失数据，但对于大型 EHR 数据分析来说，这些方法的计算开销过大。另一种策略是使用“缺失值插补”方法生成一个“完整数据集”，可用于后续步骤的数据分析。缺失值插补方法包括链式方程多重插补（MICE)（Azur\
  \ et al. 2011）、随机森林（Stekhoven and Bühlmann 2012）以及矩阵/张量完成（MC/TC）（（Phien et al. 2016）方法，例如谱正则化算法（Mazumder,\
  \ Hastie, and Tibshirani 2010）和结构化矩阵完成（SMC）（（Zhang et al. 2016）等。这些方法的性能和效率取决于许多因素，包括缺失类型（MCAR,\
  \ MAR, MNAR）、数据的相关结构、缺失比例以及变量类型。我们将在下一章讨论这些方法的细节。\n\n![image](img/inline1_1.jpg)\n\
  \n## 5.3 数据准备\n\n### 5.3.1 定义终点或结局\n\n对于特定的项目，确定终点或结局变量至关重要。例如，如果项目的目标是预测在某些条件或治疗下患者的死亡率，则“死亡率”需要根据患者就诊结束时的出院状态来定义。死亡可能没有在就诊出院处置中被明确标记。例如，在\
  \ SAH（蛛膜下出血）项目中，在接受至少一种三种缩血管药物（丙上腺酚、去甲肾上腺素和多巴胺）之一的 SAH 患者队列中，共发现了 24 种患者出院状态，见下表\
  \ Table 5.3。如果患者分配了以下 5 类出院状态中的任何一种，我们就定义该患者死亡（Williams et al. 2020）：\n\n```\n\\\
  begin{cases}\n1. & 死亡\n2. & 临终关怀/医疗机构\n3. & 在医疗机构死亡。仅限医疗补助(Medicaid)\n4. & 在家中死亡。仅限医疗补助(Medicaid)\n\
  5. & 临终关怀/家中\n\\end{cases}\n```\n\n**表 5.3** 接受缩血管药物的 SAH 患者出院描述列表及人数\n\n| 索引 |\
  \ 出院描述 | 人数 |\n| :--- | :--- | :--- |\n| 1 | 死亡 | 1803 |\n| 2 | 转至康复中心 | 884 |\n\
  | 3 | 出院 | 800 |\n| 4 | 转至 SNF（专业护理机构） | 366 |\n| 5 | 转至长期护理医院 | 217 |\n| 6 | 转至家中\
  \ | 115 |\n| 7 | 转至短期医院 | 110 |\n| 8 | 转至其他类型的护理 | 59 |\n| 9 | 转至其他类型的医疗机构 | 54\
  \ |\n| 10 | 临终关怀/医疗机构 | 49 |\n| 11 | 转至 ICF（独立护理设施） | 49 |\n| 12 | 在医疗机构死亡。仅限医疗补助(Medicaid)\
  \ | 21 |\n| 13 | 转至指定中心或医院 | 19 |\n| 14 | 在家中死亡。仅限医疗补助(Medicaid) | 19 |\n| 15 |\
  \ 在该机构住院 | 18 |\n| 16 | 临终关怀/家中 | 13 |\n| 17 | 转至医疗补助认证但非 Medicare 认证 | 10 |\n|\
  \ 18 | 医嘱出院 (AMA) | 8 |\n| 19 | 转至联邦医疗机构 | 8 |\n| 20 | 转至精神科医院 | 6 |\n| 21 | 预计返回门诊服务\
  \ | 3 |\n| 22 | 转至法院/执法场所 | 2 |\n| 23 | 转至机构内 Medicare 批准病床 | 1 |\n| 24 | 转至关键通道医院\
  \ (CAH) | 1 |\n\n在另一个例子中，项目旨在预测高血压或糖尿病患者的心衰。终点是“心衰”，这需要根据诊断代码进行定义。在 `ICD-9` 或 `ICD-10`\
  \ 编码系统中，我们需要识别所有对应“心衰”的代码。此外，我们需要考虑一个心衰代码是否足以确认该患者为“心衰”患者（Choi, et al. 2016, a）。在文献中，12\
  \ 个月内的三个心衰疾病代码对于宣布一个确诊的心衰病例是必要的（Gurwitz et al. 2013）、Ng et al. 2016）、Choi, Bahadori,\
  \ Sun et al. 2016）。有时，正式的表型识别方法（Banda et al. 2018）、Glicksberg et al. 2018）、Hubbard\
  \ et al. 2019）、Gronsbell et al. 2019）可能需要正式确认疾病诊断（疾病表型识别详见第 3.4 节）。终点或结局也可以根据实验室结果、临床事件、生命体征或微生物测试来定义。我们需要仔细评估用于得出终点或结局的变量的可靠性和不确定性。如果终点或结局变量定义不好，可能会导致偏差和误导性结论。\n\
  \n### 5.3.2 处理医疗记录时间戳\n\n EHR 包含患者各种时间临床信息，如手术、药物、实验室检查和临床测量。给定一个特定的治疗或疾病，我们可能期望评估患者治疗或疾病发生后的临床状况或结局；或者我们可能想根据\
  \ EHR 数据比较有和无特定治疗/疾病患者的临床状况或结局。在这种情况下，准确确定治疗和其他临床记录的时间戳对于构建预测模型或进行因果推理分析非常重要。然而，原始\
  \ EHR 数据中的时间戳通常是有噪声且不完整的。我们需要仔细处理和清理医疗记录的时间戳，以便基于清理后的时间戳进行不同的时间建模任务和分析。\n\n\n\n\n\
  \n通常，电子健康记录（EHR）数据库中一条医疗记录会有多个时间戳。例如，一条实验室检验记录通常标记有多个时间戳，如检验开单时间、采血时间、接收时间、执行时间、完成时间、验证时间以及取消时间。对于大多数项目和数据分析，每条医疗记录只需要一个时间戳。直观上，我们可能会使用干预、治疗或检验样本实际在患者身上执行或采集的时间。因此，在上述七个时间戳中，我们优先将“采血时间”（drawn\
  \ time）作为化检验记录的时间标签。然而，对于某些化检验记录，`drawn time`可能会缺失或错误。在这种情况下，我们可能需要处理缺失和错误的时间戳。如果由于输入错误或故障导致化检验的`drawn\
  \ time`缺失或错误，可以使用其他的其他时间戳来估算采血时间。例如，我们可以按照执行、完成、接收、验证和开单时间的优先级顺序来估算采血时间，以第一个可用且有效的时间为准。我们可能需要评估上述时间戳是否超出了合理的时间间隔，或者是因为由于输入错误或故障导致的离群值（例如，某些时间戳在就诊时间间隔之外，甚至在患者患者所有其他医疗记录的时间窗之外）。有时，确定一个时间戳为离群值或错误并非易事，这可能需要复杂的算法。幸运的是，离群值引起的错误非常罕见。处理此问题的简单策略是预定义时间戳的有效性规则。也就是说，如果时间戳完全缺失或为离群值，则将其标记为无效（我们还需要一个明确的离群值定义规则）。例如，在\
  \ SAH 研究中，我们如下所示处理并填充了化检验时间戳：\n\n*   如果实验室记录被标记有`canceled time`，则从分析中移除，因为这些化检验可能被取消了。\n\
  *   如果`drawn time` 可用且有效，则将其作为化检验时间戳。否则，使用其他可用且有效的时间戳，按照执行、完成、接收、验证和开单时间的优先级顺序来估算`drawn\
  \ time`。\n*   如果所有时间戳均缺失或无效，则将化检验时间戳标记为缺失。\n\n同样，我们可以对临床事件的时间戳进行处理和清洗。每个临床事件记录的时间最初标记为执行时间、事件开始时间、事件结束时间和验证时间。理想情况下，我们倾向于使用执行时间作为临床事件的时间戳。如果执行时间不可用，我们可以按照优先级顺序依次使用事件开始时间、事件结束时间和验证时间来估算执行时间。我们还可以使用类似的策略对药物、操作和其他医疗记录的时间戳进行处理和清洗。\n\
  \n### 5.3.3 定义就诊时间间隔\n\n就诊（encounter）被定义为患者与医疗保健提供者之间的互动，目的是提供医疗服务或评估患者的健康状况（HL7®）。通常，EHR\
  \ 系统中的每次就诊都有定义良好的入院和出院时间。理想情况下，具有相同就诊 ID 的所有医疗记录或事件都在入院和出院时间的时间间隔内，请参见图 5.6 的良好示例。\n\
  \n![图 5.6 具有良好定义就诊时间的就诊（入院和出院时间）。具有相同就诊 ID 的所有医疗记录或事件都在时间间隔内。](img/fig5_6.jpg)\n\
  \n**图 5.6** 具有良好定义就诊时间的（入院和出院时间）。具有相同就诊 ID 的所有医疗记录或事件都在时间间隔内。\n\n然而，在现实中，准确就诊时间间隔存在许多问题。我们注意到，如果存在错误和离群值，入院和出院时间可能不准确。为了解决上述问题，我们可能需要重新定义就诊的开始时间和结束时间：\n\
  \n*   某些入院或出院时间缺失；参见下方的图 5.7。\n*   入院或出院时间存在某些错误和离群值；参见下方的图 5.7。\n*   某些医疗记录或事件位于时间间隔之外；参见下方的图\
  \ 5.7。\n\n相同的`encounter ID`\n\n![图 5.7 具有问题起始和结束时间的就诊：(a)入院或出院时间缺失；(b)入院或出院时间有错误；(c)医疗记录或事件位于时间间隔之外；(d)医疗记录或事件为离群值。](img/fig5_7.jpg)\n\
  \n**图 5.7** 具有问题起始和结束时间的就诊：(a)入院或出院时间缺失；(b)入院或出院时间有错误；(c)医疗记录或事件位于时间间隔之外；(d)医疗记录或事件为离群值。\n\
  \n为了解决上述问题，我们可能需要提取所有带有时间戳的医疗记录或事件，例如药物、实验室、操作和临床事件（包括生命体征）。直观上，具有相同就诊 ID 的第一个医疗记录或事件的时间可以定义为就诊的开始时间\
  \ `T[o]`，而最后一个医疗记录或事件的时间可以定义为就诊的结束时间 `T[e]`。然而，由于医疗记录和事件的时间存在错误和离群值，这可能是挑战性的。我们可能需要开发算法来处理医疗记录中的错误和离群值。\n\
  \n为了说明，在 SAH 研究中，我们开发了一种特有的方法使用两个参数来筛选离群值：一个是连续医疗记录/事件之间的时间差阈值 `d`，用于将医疗记录/事件划分为类；另一个是类的大小\
  \ `p`，即类中医疗记录或事件数量占就诊总记录数量的比例。例如，如果 `d` 固定为 10 天，且只有两个药物记录/事件的连续时间差大于 10 天，那么所有的医疗记录/事件在该次就诊中分为两类。如果\
  \ `d` 增加，类的数量会更少，类的大小将更加不平衡（某些类会有非常多或很少记录或事件）。我们假设同一就诊内两条医疗记录之间的连续时间差是很小的。当 `p`\
  \ 足够小且 `d` 足够大时，我们将较小的医疗记录或事件类视为离群值，从而从该就诊中排除。\n\n\n\n\n给定一次就诊的连续记录时间 `t[0]`、`t[1]`、`t[2]`...`t[n]`，连续的时间差可以计算为\
  \ `d[1] = t[1] - t[0]`，`d[2] = t[2] - t[1]`，`..., `d[n] = t[n] - t[n-1]`。\n\n* \
  \  **就诊初的离群值**：假设 `d[i] > d` 天的 `d[i]` 索引为 `i[1]`、`i[2]`、`...`i[b]`，则 `[t[0], t[i[j]]]`\
  \ 中的记录被视为离群值，如果 `[t[0], t[i[j]]]` 中的记录数少于 `[t[0], t[n]]` 总记录数的 `p` 倍，则 `i[j] ∈ {i[1],i[2],...i[b]}`。\n\
  \n*   **就诊末的离群值**：假设 `d[i] > d` 天的 `d[i]` 索引为 `i[1]`、`i[2]`、`...`i[e]`。如果 `[t[i[j]],t[n]]`\
  \ 中的记录数少于 `[t[0], t[n]]` 总记录数的 `p` 倍，则记录被视为离群值，`i[j] ∈ {i[1],i[2],...i[e]}`。\n\n\
  在排除就诊医疗记录的离群值后，剩余记录从最小到大的有序标记为 `t[0]'`、`t[1]'`、`t[2]'`...`t[n]'`，则就诊开始时间 `T[0]`\
  \ 定义为 `T[0] = t[0]'`，而就诊结束时间 `T[e]` 定义为 `T[e] = t[n]′` 。\n\n举例来说，在 SAH 患者死亡率预测项目中，我们需要为每次\
  \ SAH 就诊重新定义 `(T[0], T[e])`。虽然 EHR 数据库中每次就诊都有入院和出院时间，但由于上述所有问题，我们无法使用这些时间来定义就诊时间范围。在该\
  \ SAH 队列中，某些就诊的入院时间或出院时间缺失。事实上，有 6 次就诊（患者）缺失入院时间，41 次就诊（患者）缺失出院时间，示例参见图 5.7(a)。同时，我们发现某些就诊的入院时间比该就诊中的任何医疗记录或事件都要早一天，示例参见图\
  \ 5.7(b)。我们还发现，在该 SAH 队列中，41% 的就诊（患者）至少有一条用药记录早于入院时间；而 20% 的就诊（患者）中至少有一条用药记录晚于出院时间，示例参见图\
  \ 5.7(c–d)。\n\n在这项 SAH 研究中，根据我们的初步数据探索，我们将 `d` 设置为 3 天，`p = 10%`。在进行进一步的数据处理和分析之前，我们重新定义了每次就诊的开始和结束时间。\n\
  \n### 5.3.4 就诊合并\n\n在 EHR 数据库中，每个患者的所有医疗记录和事件都以纵向和层次化的方式组织成就诊。每个患者在 EHR 数据库中可能有多次就诊……（此处原文重复内容过多已省略）\n\
