  \ {X,\\overline{Y},T,W,Z_{\\omega}} \\right) = \\overline{Y} \\odot W + G_{\\mathit{iy}}\\\
  left( {X,{\\overline{Y}}^{f},T \\odot W,\\left( {1 - W} \\right) \\odot Z_{\\omega}}\
  \ \\right) \\odot \\left( {1 - W} \\right).(7.85)\n\n![图 7.7 用于估计 ITE 的 MisGAN 架构。](img/fig7_7.jpg)\n\
  \n**图 7.7**\n\n用于估计 ITE 的 MisGAN 架构。\n\n插补反事实的损失函数定义为：\n\n$V_{i}\\left( {D_{i},G_{i},G_{Y}}\
  \ \\right) = E_{Z_{G}\\sim P_{Z}}\\left\\lbrack {D_{i}\\left( {G_{Y}\\left( {X,{\\\
  overline{Y}}^{f},T,Z_{G}} \\right)} \\right)} \\right\\rbrack - E_{{({Y,W})\\sim\
  \ P_{\\mathit{data}},,Z_{\\omega}\\sim P_{\\omega}}}\\left\\lbrack {D_{i}\\left(\
  \ G \\right)_{i}\\left( {X,\\overline{Y},T,W,Z_{\\omega}} \\right) \\right)\\rbrack.(7.86)\n\
  \n为了估计 ITEs，我们联合求解以下优化问题：\n\nmin[`G`[*i*]]max[`D`[*i*] ∈ `F`[*i*]]`V`*i*,(7.87),\n\
  \nmin[`G`[*Y*]]max[`D`[*Y*] ∈ `F`[*Y*]]`V`*Y*  +  `β``V`*i*,(7.88),\n\nmin[`G`[*W*]]max[`D`[*W*] ∈ `F`[*W*]]`V`*W*\
  \  +  `λ``V`*Y*.(7.89)\n\n### 7.5.5 最优治疗选择\n\n#### 用于生物标志物识别的稀疏技术\n\nLASSO（最小绝对值收缩和选择算子）能够通过同时执行变量选择和正则化来增强结果的预测准确性和可解释性，可用于选择优化治疗的生物标志物（Diamond\
  \ and Sekhon 2013, Ge et al. 2020）。让 `y[t]^(i)` 和 `X^((i))` 分别表示第 `i^(th** 个 个体的估计治疗效应和特征向量。令$Y_{T}\
  \ = \\begin{bmatrix} y_{t}^{(1)} \\\\ \\vdots \\\\ y_{t}^{(n)} \\\\ \\end{bmatrix},\\\
  mathit{X} = \\begin{bmatrix} x_{1}^{(1)} & \\cdots & x_{q}^{(1)} \\\\ \\vdots &\
  \ \\vdots & \\vdots \\\\ x_{1}^{(n)} & \\cdots & x_{q}^{(n)} \\\\ \\end{bmatrix},\\\
  beta = \\begin{bmatrix} \\beta_{1} \\\\ \\vdots \\\\ \\beta_{q} \\\\ \\end{bmatrix}.$。\n\
  \n如果潜在结果是二值的，神经网络的输出通常是连续函数。因此，我们假设无论潜在结果的数据类型如何，治疗效应都是连续的。\n\n用于发现预测治疗效应的生物标志物的\
  \ LASSO 估计量为 widehat{\\beta}}_{\\lambda} = \\underset{\\beta}{\\text{argmin}}{||Y_{T}\
  \ - X\\beta||_{2}} + \\lambda\\sum_{j = 1}^{q}|\\beta_{j}|$.非零元素 `beta[j]\\neq 0`\
  \ 的对应项 `X[j]` 代表治疗效应的生物标志物。\n\n#### 用于最优治疗的生物标志物识别\n\n考虑 `K` 种治疗。令 $\\hat{Y}^{(i)}\
  \ = [\\hat{Y}^{(i)}(T[1]), \\dots, \\hat{Y}^{(i)}(T[K])]$ 为第 `i^(th)` 个体估计结果的 `K`-维向量，$z_i\
  \ = [1, \\dots, K]$ 为第 `i^(th)` 个最优潜在结果的索引。为了选择用于最优治疗的生物标志物，我们定义以下 LASSO：$\\|\\\
  widehat{Y}\\|^{i}\\left( T_{z_{i}}^{i} \\right) - \\sum_{j = 1}^{q}x_{j}^{(i)}\\\
  beta_{j}\\|^{2} + \\lambda\\sum_{j = 1}^{q}|\\beta_{j}|$.。\n\n求解上述 LASSO，我们获得一组对应于治疗选择的非零系数\
  \ $\\hat{l}\\neq 0, l=1,\\dots,n$。用于治疗选择的![image](img/inline1.jpg)\n\n7.6 治疗效应估计中的去混杂\n\
  \n### 7.6.1 引言\n\n处理同时影响治疗和结果的混杂因素（confound）是治疗效应估计的核心问题（Vanderele 2015, Zhang et\
  \ al. 2019, Lee, Mastronarde, and van Schaar 2018）。考虑一个例子，假设吸烟是治疗 `T`，死亡是结果 `Y`，而性别是混杂因素\
  \ `X`（图 7.8）。假设男性比女性更容易吸烟，也更容易去世。吸烟者和非吸烟者之间的死亡差异可能由于性别，也可能由于两者都有。在这种情况下，性别是混杂因素。这个例子展示了在存在混杂因素时估计治疗效应会有偏的。\n\
  \n![图 7.8 (a) 无混杂因素的因果图。(b) 有混杂因素的因果图。](img/inline.jpg)\n\n### 7.6.2 带有潜在混杂因素的因果模型\n\
  \n我们引入带有未观测混杂因素的因果模型（Lee, Mastronarde, and van Schaar 2018）。我们假设一个潜在混杂因素 `Z` 同时影响治疗变量\
  \ `T`（二元治疗）和结果变量 `Y`。假设存在一个代理变量 `X` 可以近似潜在变量 `Z`（图 7.8b）。我们收集的数据表示为 `D=(X[i], T[i],\
  \ Y[i]), i=1,\\dots,n`。结果 `Y` 是治疗 `T`、特征向量（协变量）`X`、混杂因素 `Z` 的函数：\n\n$Y = G(X,T,Z).(7.90)\n\
  \n\n\n`P`(`Y`,`Z`,`X`,`T`)  ≈ `q``E`  = `P``data`*`q``E`,(7.91)\n\n`P`(`Y`,`Z`,`X`,`T`)\
  \  ≈ `q``P`  = `P``data`*`q``I`*`q``P`.(7.92)\n\n公式 (7.39) 显示联合分布 `P(`Y`,`Z`,`X`,`T`)可以通过编码器-解码器生成，其中分布\
  \ `q``E` 是由所有原始数据集 (*Y*,*X*,*T*) 映射的整个潜空间的分布。因此，生成的潜空间包含了混杂因子部分和非混杂因子部分。公式 (7.40)\
  \ 意味着联合分布 `P(`Y`,`Z`,`X`,`T`)可以通过预测原理近似生成，生成的潜空间仅包含混杂因子。为了确定混杂因子，我们可以让两个分布 `q``E`\
  \ 和 `q``P` 相等。可以使用对抗学习网络来实现（Lee, Mastronarde, and van der Schaar 2018, Dumoulin\
  \ et al. 2019, Chen et al. 2019）。\n\n个体的个体治疗效应（ITE）定义为\n\n`ITE`(`X`)  = `E`[`Y`|`X`,`T`=1`]\
  \  − `E`[`Y`|`X`,`T`=0`].(7.93)\n\n由于混杂因子 `Z` 同时影响 `Y` 和 `T`，使用全概率公式，可以将条件概率 `P(`Y`|`X`,`T`)`\
  \ 表示为\n\n$\\begin{array}{l} {P\\left( Y \\middle| X, T \\right) = \\\\int{P\\left(\
  \ Y,Z \\middle| X,T \\right)dz}} \\\\\\\\ {\\\\quad = \\\\int{P\\left( Z \\middle|\
  \ X,T \\right)P\\left( Y \\middle| Z,X,T \\right)dz}.} \\\\\\\\ \\\\end{array}$(7.94)\n\
  \n由于我们假设 `Z`→`T`，我们得到\n\n`P`(`Z`|`X`,`T`)  = `P`(`Z`|`X`）。(7.95)\n\n将公式 (7.43) 代入公式\
  \ (7.42)，我们得到\n\n`P`(`Y`|`X`,`T`)  = ∫`P`(`Z`|`X`)*`P`(`Y`|`Z`,`X`,`T`)*d`z`。(7.96)\n\
  \n使用公式 (7.44)，我们可以计算 `ITE`(`X`)。\n\n### ### 7.6.3 对抗学习混杂因子\n\n对抗学习混杂因子的基本思想是通过双向模型和对抗学习将联合分布\
  \ `q``E` 与联合分布 `q``P` 匹配（Lee, Mastronarde, and van der Schaar 2018, Chen et al.\
  \ 2019, Dumoulin et al. 2019）。成对域联合分布 `q``E` 和 `q``P` 由两个类似于自动编码器的生成模型产生。产生联合分布\
  \ `q``E` 的生成模型称为重构网络，而产生联合分布 `q``P` 的生成模型称为预测网络。对抗学习推理用于匹配成对域联合分布（图 7.9）。\n\n![图\
  \ 7.9 用于混杂因子和 ITE 估计的对抗学习推理网络架构。](img/fig7_9.jpg)\n\n**图 7.9**\n\n用于混杂因子和 ITE 估计的对抗学习推理网络架构。\n\
  \n重构网络可以产生联合分布 `q``E`，该分布分解为两个部分：`P``data` 和 `q``E`。从分布 `P``data` 采样的数据 (*Y*,*X*,*T*)\
  \ 输入到编码器以生成遵循分布 `q``E` 的潜变量 `Z`。潜变量 `Z̃` 表示为 `Z̃`  = `G``E`。\n\n\n\n考虑一个二分类处理，令\
  \ `Y[1]` 表示暴露因素后的结果，`Y[0]` 表示没有暴露因素的结果。为了消除混杂因素，G 计算（G-computation）和倾向评分法利用条件概率来处理混杂。G\
  \ 计算依赖于给定暴露和协变量的预测条件期望，`E[Y|A,X]`。倾向评分法估计在给定观测混杂因素 `X` 条件下暴露的条件期望，`P(A=1|X)`。TMLE\
  \ 包含了两者，并且如果 `E[Y|A,X]` 或 `P(A=1|X)` 中任何一个被一致估计，它将提供无偏估计（即双重稳健性）。如果不是，只要暴露机制可以被一致估计，最终的\
  \ ATE 仍然是无偏的。当结果机制和暴露机制都被一致估计时，TMLE 是一个渐近有效的替代估计量，并且对离群值和稀疏性更具鲁棒性。最后，许多算法和机器学习方法可以整合到\
  \ TMLE 中，与使用设定不当的回归相比，这些方法有助于减少偏差。\n\n图 7.10 显示了 TMLE 的工作原理。首先，计算给定暴露和协变量的结果的条件期望，`E[Y|A,X]`。这第一个估计用于代表两种暴露水平下结果的估计。然后是“目标化”（targeting）步骤，它涉及暴露机制的估计，`P(A=1|X)`。该估计用于在预定义的工作回归模型之前改进估计。最后，使用改进后的期望值\
  \ `E[Y|A,X]` 生成更新的潜在结果对。ATE 值的新估计将是跨跨个体的暴露对之间的平均差异。\n\n![图 7.10 TMLE 工作流程图 (Schuler\
  \ et al. 2016)。](img/fig7_10.jpg)\n\n**图 7.10**\n\nTMLE 工作流程图 (Schuler et al. 2016)。\n\
  \n总之，TMLE 是 ATE 的双重稳健估计量，双重稳健的性质确保了估计量的无偏性。TMLE 统一了极大似然估计和基于估计函数的估计，并将它们结合以获得改进的结果。最后，TMLE\
  \ 可以使用机器学习算法实现，这使得该方法适用于 EHR 数据等复杂数据集。\n\nTMLE 方法可以使用 R 语言中的“tmle”包 (Gruber and\
  \ van der Laan 2012) 进行（R Foundation for Statistical Computing, Vienna, Austria）。\n\
  \n### ![image](img/inline1_1.jpg)\n\n# 7.8 补充说明 A\n\n### 7.8.1 Wasserstein GAN\n\
  \n#### A1 不同的距离量\n\n学习生成模型有两种方法。一种方法是通过极大似然函数直接学习概率密度函数 `p[θ]`。另一种方法是学习一个函数，通过 `p[θ]\
  \ = Gθ` 将现有的分布 `z` 转换为密度函数 `p[θ]`。为了详尽阐述，我们首先研究极大似然估计。\n\n##### A1.1 极大似然估计\n\n\
  假设给定真实数据样本 `{x[1], …, x[n]}`，其密度函数为 `p_r(x)`。我们定义一个参数族 `pθ`。极大似然估计 (MLE) 是最大化数据的似然概率：\n\
  \n```\nmax_theta 1/n sum_{i=1}^n log p_theta(i)\n```\n\n这意味着\n\n```\nlim_{n->∞}\
  \ max_theta 1/n sum_{i=1}^n log p_theta(i) = max_theta int p_theta(x)\n```\n\n记得两个分布\
  \ `p_r(x)` 和 `p_theta(x)` 之间的 KL 距离定义为：\n\n```\nKL(p_r|p_theta) = int p_r(x) log(p_r(x)/p_theta(x))\n\
  ```\n\n因此，方程 (A2) 可以转换为以下优化问题：\n\n```\nlim_{n->∞} max_theta 1/n sum_{i=1}^n log\
  \ p_theta(i) = min_theta int p_r(x) log(p_r(x)/p_theta(x)) = min_theta KL(p_r|p_theta)\
  \ \n```\n\n方程 (A3) 显示 MLE 等同于 KL 距离的最小化。生成模型 MLE 的主要局限性是当两个分布 `p_theta` 和 `p_r`\
  \ 不重叠时，例如当 `p_theta[0]=0` 而 `p_r[0]>0` 时，KL 距离趋于 +∞。通用解是开发一个非线性函数映射 `g[θ]: Z → χ`，将具有已知分布\
  \ `p(z)`（通常为均匀分布或正态分布）的随机变量 `Z` 转换为特定的分布 `p[θ]`。通过改变 `θ`，我们可以让分布 `p[θ]` 接近真实数据分布\
  \ `p_r`。为了衡量接近程度，我们需要在两个分布 `p[θ]` 和 `p_r` 之间开发不同的距离量。\n\n#### A1.2 总变距离 (TV Distance)\n\
  \n假设 `p_r` 和 `p_theta` 是定义在空间 `Ω` 两个概率分布。那么两个分布之间的总变距离定义为：\n\n```\nδ(p_r, p_theta)\
  \ = sup_{A ∈ Γ} |p_r(A) - p_theta(A)|\n```\n\n其中 `A ∈ Γ` 是 `Ω` 的子集。\n\n**示例 1.1**\n\
  \n考虑定义在概率空间 `R²` 上的分布。令 `Z ~ U[0,1]` 为单位区间上的均匀分布。令 `p[0]` 为定义在 `(0, Z)`，而 `p[θ]`\
  \ 为定义在 `(θ, Z)`，其中 `θ` 是单个实数参数。定义 `A = {(0, z), z ∈ [0,1]}`。\n\n那么，当 `θ ≠ 0` 时，`p0\
  \ = z` 且 `pθ = 0`。因此，当 `θ ≠ 0` 时，我们有\n\n```\n|p_r(A) - p_theta(A)| = z\n```\n\n\
  #### A1.3 Kullback-Leibler (KL) 散度\n\n两个分布之间的 Kullback-Leibler (KL) 散度定义为：\n\n```\n\
  KL(p_r|p_theta) = int p_r(x) log(p_r(x)/p_theta(x))\n```\n\n**示例 1.1 续**\n\n由于当\
  \ `θ ≠ 0` 时 `p_theta[0]=0`，我们得到\n\n```\nKL(p_r|p_theta) = +∞\n```\n\n#### A1.4 Jenson-Shannon\
  \ (JS) 散度\n\n令 `p_m = (p_r + p_theta)/2`。Jenson-Shannon (JS) 散度定义为：\n\n```\nJS(p_r|p_theta)\
  \ = KL(p_r|p_m) + KL(p_theta|p_m)\n```\n\n**示例 1.1 续**\n\n当 `θ ≠ 0` 且 `p_r[0] ≠\
  \ 0` 时，我们有 `p_m = p_r/2`。同样，当 `θ ≠ 0` 且 `p_theta[0] ≠ 0` 时，我们有 `p_m = p_theta/2`。\n\
  \n\n\n\n\n当我们考虑离散概率分布时，Wasserstein 距离也被形象地称为推土机距离（earth mover’s distance, EMD）。考虑两个离散分布\
  \ `p[r]` 和 `p[θ]`，它们各有一个可能的 `l` 个状态 `x` 或 `y`。分布 `pr` 定义为每个点拥有的概率质量，分布 `pθ` 可以以同样定义。我们的目标是通过移动质量来将分布\
  \ `pr` 变为 `pθ`。联合分布 `r(x,y)` 可以被视为一种传输计划，将 `r(x,y)` 质量从 `x` 移动到 `y`。从 `x` 到 `y`\
  \ 的距离表示为 `||x−y||`。将 `r(x,y)` 质量从 `x` 移动到 `y` 的代价等于 `r(x,y)||x−y||`。移动计划 `r(x,y)`\
  \ 应该满足以下约束：`pr = ∑[y]r(x,y)` 和 `pθ = ∑[x]r(x,y)`。\n\n令 `Π(p[r],p[θ])` 为所有边缘分布为 `pr`\
  \ 和 `pθ` 的可能联合分布集合。那么，EMD 定义为将 `r(x,y)` 质量从 `x` 移动到 `y` 所需的最小代价：\n\n```\nW(p[r],p[θ])\
  \ = inf[r ∈ Π(p[r], p[θ])]∑[x]∑[y]r(x,y)||x−y|| = inf[r ∈ Π(p[r], p[θ])]E[(x, y)\
  \ ∼ r][||x−y||].(A7)\n```\n\n如果变量是连续的，方程 (A7) 可以扩展为：\n\n```\nW(p[r],p[θ]) = inf[r\
  \ ∈ Π(p[r], p[θ])]∫[x]∫[y]r(x,y)||x−y||dxdy.(A8)\n```\n\n### 示例 1.1 (续)\n\n考虑两个分布\
  \ `p0` 和 `pθ`，其中 `Z ∼ U(0,1)`。令 `x = [0,z]` 和 `y = [θ,z]`。显然，如果沿着平行于 x 轴的直线移动，`||x−y||\
  \ = |θ|`。\n\n### #### A2 Wasserstein GAN\n\n使用 Kantorovich-Rubinstein 对偶性理论，我们可以证明\
  \ (Rachev 1990):\n\n```\nW(p[r],p[θ]) = sup[||f||[L ≤ 1]]E[x ∼ p[r]]f(x) − E[x ∼\
  \ p[θ]]f(x),(A9)\n```\n\n其中 `f` 是 1-Lipschitz 函数。\n\n优化问题 (A9) 是一个约束优化问题。在常数为 1\
  \ 的 Lipschitz 约束下求解该优化问题是不可行的。为了缓解这个问题，我们将常数为 1 的 Lipschitz 约束放宽常数为 `K` 的 Lipschitz\
  \ 约束，即 `||f(x[i])−f(x[j])||≤K||x[i]−x[j]||`。\n\n令 $g(x) = \\frac{f(x)}{K}$。那么我们有\
  \ `||g(x[i])−g(x[j])||≤||x[i]−x[j]||`，即 `g(x)` 是常数为 1 的 Lipschitz 函数。\n\n对于 `K`-Lipschitz\
  \ 约束的上确界仍然难以实现，但它允许更容易近似。考虑一个参数化函数族 `{f[w]w ∈ W]`，其中 `W` 是所有可能权重集合。这些函数也是 `K`-Lipschitz\
  \ 函数。那么，我们有 `sup[||f||[L ≤ K]]E[x ∼ p[r]]f(x) − E[x ∼ p[θ]]f(x) = Ksup[||g||[L ≤\
  \ 1]]E[x ∼ p[r]]g(x) − E[x ∼ p[θ]]g(x) = K W(p[r],p[θ])`，这意味着 `max[w ∈ W]E[x ∼ p[r]]f(x)\
  \ − E[x ∼ p[θ]]f(g(z)) ≤ sup[||f||[L ≤ K]]E[x ∼ p[r]]f(x) − E[x ∼ p[θ]]f(x) = K\
  \ W(p[r],p[θ])`。\n\n因此，优化问题 (A9) 可以被近似为：\n\n```\nmax[w ∈ W]E[x ∼ p[r]]f(x) − E[x\
  \ ∼ p[θ]]f(x).(A10)\n```\n\n令 `x = g(z)`。(A11)\n\n将方程 (A11) 代入方程 (A10)，我们得到：\n\n\
  ```\nW(p[r],p[θ]) ≥ max[w ∈ W]E[x ∼ p[r]]f(x) − E[z ∼ p(z)]f(g(z)).(A12)\n```\n\n\
  两个函数 `fw` 和 `gθ` 都可以通过神经网络进行建模，参数 `w` 和 `θ` 是神经网络中的权重。我们的目标是找到生成器 `gθ`，使得真实数据的分布\
  \ `p[r]` 与生成器分布 `p[θ]` 之间的 Wasserstein 距离尽可能小，即：\n\n```\nmin[θ]W(p[r],p[θ]).(A13)\n\
  ```\n\nWasserstein 距离通过方程 (A12) 的下界计算。总而言，为了找到生成器 `gθ`，我们求解以下优化问题：\n\n```\nmin[θ]\
  \ max[w ∈ W]E[x ∼ p[r]]f(x) − E[z ∼ p(z)]f(g(z)).(A14)\n```\n\n数值上，优化问题 (A13)可以通过算法\
  \ 2 (Arjovsky and Bottou 2019) 求解。\n\n#### A3 算法 (WGAN)\n\n输入：`α`学习率；`c`裁剪参数；`m`批次大小；`n[d]`每次生成器迭代时判别器神经网络更新的次数。`w[0]`函数\
  \ `f[w]` 网络的初始权重参数；`θ[0]`生成器的初始参数。\n\n当 `θ` 未收敛时循环：\n\n对于 `t = 0, ..., n[d]` 执行：\n\
  \n从真实数据中采样批次 `{x^(i)}[i=1]^(m) ∼ p[r]`。\n\n从噪声中采样批次 `{z^(i)}[i=1]^(m) ∼ p(z)`。\n\
  \n```\ng_w←∇_w[\\frac{1}{m}\\sum_{i = 1}^{m}f_w(x^{(i)}) - \\frac{1}{m}\\sum_{i\
  \ = 1}^{m}f_w(x^{(i)})]\n```\n\n\n\n\n\nBurgess, Stephen, Dylan S. Small, and Simon\
