  \ 9 | meq/L | 24_13 | 24_7 | 0 | 0 |\n| 14 | 24 | 9 | mmol/L | 24_14 | 24_7 | 3.5\
  \ | 5.1 |\n| 15 | 24 | 9 | ng/mL | 24_15 | 24_7 | | |\n| 16 | 24 | 12 | | | | |\
  \ |\n| 17 | 24 | 12 | meq/L | 24_17 | 24_7 | 3.6 | 5 |\n| 18 | 24 | 12 | mmol/L\
  \ | 24_18 | 24_7 | 3.5 | 5.1 |\n\n#### 转换映射 ID\n该列是每个格式的程序 ID_ 结果类型 ID_ 单位拼接。开发此特定字段是为了简化我们工具的编程部分并更好地解释结果。\n\
  \n#### 转换到\n该列显示了将转换到的最终格式。此字段的目的是将数据统一到实验室结果最常用的格式，或根据专业知识适用于该实验室结果的单位。对于血清钾示例，我们选择了\
  \ `24_7` `。\n\n#### 转换公式\n`Conversion_equation` 字段中的数据将用于计算目标值（与 `convert_to` 特性兼容）。代码将从该字段获取公式并用于数学计算。创建实验室转换公式的策略如下：\n\
  \n1. 检查当前格式的分布、下限和上限，并与 `convert_to` 格式的分布、下限和上限进行比较。如果它们相同，则转换公式为 `x`（即 `f(x) =\
  \ x`，不需要数学运算）。转换映射的一个重要规则是使用 `x` 作为变量（与 `f(x)` 中的 `x` 相同）。如果我们想对数据进行数学计算，可以使用标准方程：\n\
  \n```\n\\left. f(x) = (((x - 4)/8)\\*5x) \\right.\\hat{}2.\n```\n\n在开发工具的阶段，我们手动比较分布。也可以开发一种自动方法来评估分布之间的差异，如果不显著，则在转换公式字段中填入\
  \ `x`。\n\n\n\n\n2. 如果分布不同，我们首先尝试根据文献找到一个 `conversion_equation`。如果我们无法找到可靠的方法，将向临床医生寻求指导。\n\
  \n3. 如果我们无法为某个记录找到合适的映射，我们的工具将按当前格式保留该记录。例如，当单位未知（未映射、未知、null、等）时，我们会遇到诸如 `24_7_Not\
  \ Mapped` 这样的 `conversion_map_IDs`，对于这些 ID，我们无法确定其 `conversion_equation`。\n\n4.\
  \ 如果某个格式看起来完全错误且看起来无效，则将 `conversion_equation` 设置为 `omit`。代码将删除该值并视为缺失。\n\n####\
  \ 下限与上限\n\n根据医学科学期刊的文献，对于某些实验室结果，存在与生命兼容的可能值范围；也就是说，超出这些范围的值对于活体来说是不正常的的，甚至是不可能的的。为了包含极端情况，我们可以设置一个比文献中报告的数值更宽的范围。我们的工具首先根据\
  \ `conversion_equation` 计算值，然后如果结果在上限和下限之间，则记录该结果；否则，报告该值为缺失。表 4.3 显示了根据文献的一些实验室的可能值\
  \ (Clot-Silla et al. 2011) 以及我们假设的上下限。我们需要强调，这个可选步骤是数据处理的一部分，我们将其包含在数据清洗工具中，是为了促进更快且计算强度较低的数据处理。\n\
  \n**表 4.3** 某些实验室与生命不兼容的值以及 Conversion_Map 中使用的范围\n\n| **实验室（血浆）** | | **与生命不兼容或不可能的值**\
  \ | | **Conversion_Map 范围限制** |\n| --- | --- | --- | --- | --- |\n| | | 下限 | 上限\
  \ |\n| 氯化物 | <65 and > 138 mmol/L | 60 | 140 |\n| --- | --- | --- | --- |\n| 乙醇\
  \ | >97.6 mmol/L | 0 | 105 |\n| pH | < 6.8 and >7.8 | 6 | 8 |\n| 钾 | < 1.3 and >9.0\
  \ mmol/L | 1 | 10 |\n| 钠 | < 100 and >191 mmol/L | 90 | 200 |\n| FiO[2] | < 21 and\
  \ >100% | 10 | 100 |\n| SpO[2] | < 0 and > 100% | 0 | 100 |\n\n### 实验室日期和时间\n\n\
  对于某些事件通常有多个时间/日期标记，记录从医嘱到执行（或取消）药物、手术或实验室操作的时间。例如，实验室表中的每条记录可能具有以下七个日期/时间戳之一或多个：\n\
  \n1. 实验室采集日期时间\n2. 实验室接收日期时间\n3. 实验室执行日期时间\n4. 实验室完成日期时间\n5. 实验室验证日期时间\n6. 实验室医嘱日期时间\n\
  7. 实验室取消日期时间\n\n对于纵向分析，我们需要为每个记录事件提供一致的时间戳。某些时间戳在临床上更合理，且上述字段没有完整信息（即其中某些字段缺失日期）。因此，我们可以定义以下策略为每个事件提供一致的时间/日期标记。\n\
  \n1. 如果实验室表中记录的日期/时间为 01/01/1900，则应视为缺失日期/时间，且 Lab Cancelled Date Time 字段中具有有效日期/时间的实验室值将从记录中删除。\n\
  2. 从前六条目（根据上述 1–6 的顺序）中选择第一个有效的日期时间值，并记录为实验室记录的时间戳。\n3. 如果用户提供了两个时间（例如入院和出院时间）作为每次患者就诊的下限\
  \ `t[0]` 和上限 `t[e]`，代码将包含一个额外的验证步骤来选择正确的时间戳。实验室日期时间验证算法的细节见图 4.4。再次强调，这个可选过程是数据处理的一部分，我们的工具可以灵活地在数据清洗过程中包含或排除此步骤。\n\
  \n![图 4.4 日期/时间验证算法流程图；t0 和 te 是用户定义的每次患者就诊的上限和下限；可选步骤为虚线框。](img/fig4_4.jpg)\n\n\
  **图 4.4**\n\n日期/时间验证算法流程图；`t[0]` 和 `t[e]` 是用户定义的每次患者就诊的上限和下限；可选步骤为虚线框。\n\n### 用户输入表和报告生成器\n\
  \n为了方便没有编程技能的科学家使用我们的数据清洗工具，我们开发了一个友好的界面。图 4.5 是用户界面的示例。\n\n![图 4.5 实验室单位输入表](img/fig4_5.jpg)\n\
  \n**图 4.5**\n\n实验室单位输入表。\n\n*(注：原文中存在大量重复的段落，根据不重复输出原文的要求，此处仅翻译核心内容并保持格式一致。)*\n\n\
  \n\n最终结果将使实验室值的分布更加均匀。例如，图 4.8 显示了对 D-二聚体实验室结果进行数据清洗的结果。如你所见，实验室结果的范围大幅缩小，并且看起来更加均匀。\n\
  \n![图 4.8 D-二聚体实验室结果数据清洗的结果。上方图表是某患者队列在清洗前的 D-二聚体分布情况，下方图表是数据清洗后的分布情况。注意范围的缩小，这是通过移除不可能的值和统一单位实现的。](img/fig4_8.jpg)\n\
  \n**图 4.8**\n\nD-二聚体实验室结果数据清洗的结果。上方图表是某患者队列在清洗前的 D-二聚体分布情况，下方图表是数据清洗后的分布情况。注意范围的缩小，这是通过移除不可能的值和统一单位实现的。\n\
  \n### 4.3.4 临床事件表\n\n临床事件表（特别是生命体征子组）的结构与实验室表相似，数据清洗工具的所有步骤都可以适用于它。然而，该表中还存在其他不一致之处，大多数是特定于项目的，需要临床专业知识，我们将在本节中讨论。\n\
  \n#### 变量合并\n\n由于我们的示例数据库被许多医疗机构使用，因此对于同一个事件，通常会有各种标签或描述的扩展。我们结合统计技术和临床专业知识来处理这个问题，并建议合并描述相同事件的代码。例如，血气分析测试有\
  \ 46 个不同的事件代码 ID，其中某些描述非常相似，例如：碱剩余（Base Excess）、动脉碱剩余（Base Excess Arterial）、静脉碱剩余（Base\
  \ Excess Venous）。对于蛛网膜下出血（SAH）患者队列，表 4.4 | 3029 | 310 |\n| --- | --- | --- |\n|\
  \ 动脉碱剩余 (Base Excess, Arterial) | 7027 | 493 |\n| 静脉碱剩余 (Base Excess, Venous) |\
  \ 277 | 88 |\n\n![图 4.9 具有碱剩余、动脉碱剩余和静脉碱剩余记录的患者维恩图。](img/fig4_9.jpg)\n\n**图 4.9**\n\
  \n碱剩余、动脉碱剩余和静脉碱剩余记录的患者维恩图。\n\n![图 4.10 测试结果的箱线图和直方图。(1) 碱剩余，(2) 动脉碱剩余，(3) 静脉碱剩余清洗。](img/fig4_10.jpg)\n\
  \n**图 4.10**\n\n测试结果的箱线图和直方图。(1) 碱剩余，(2) 动脉碱剩余，(3) 静脉碱剩余清洗。\n\n#### 信息恢复\n\n某些事件会产生多个结果，见图\
  \ 11。然而，并非每次都会记录所有结果。\n\n#### 不同表之间的重叠\n\n在比较临床事件表和实验室表时，我们可能会注意到这两个表之间存在某种程度的重叠。这可能是因为某些检查工作是在临床病房执行的。为了解决这个问题，我们可以创建一个映射表。\n\
  \n#### 错误信息纠正\n\n我们可能会在临床事件表和实验室表中发现许多事件标签不一致的情况，这很可能发生在数据输入过程中。如何应对这一问题的细节将在第 6\
  \ 章中介绍。\n\n#### 案例研究\n\n用于预测压疮的布登评分（Braden scale）由六部分组成：感觉知、皮肤湿度、活动、摩擦和剪切以及营养。\n\
  \n### 4.3.5 诊断和药物表\n\n我们数据库中的其他表（如诊断表和药物表）大部分是代码和标签，而不是具体数值。尽管上述描述的数据清洗方法（针对实验室和临床事件表）既不需要也不适用于它们，但这些表有其特定的不一致之处和问题需要解决。\n\
  \n\n\n\n我们在诊断表中面临的主要问题是诊断代码（`ICD-9`、`ICD-10`）数量巨大，并且每条记录都没有关联特定的日期（数据库中记录的所有诊断代码都与出院日期时间戳相关联）。在在使用统计模型时，我们可能会决定使用更高级别的代码，即\
  \ `ICD-9` 代码的前 3 位。由于 `ICD-10` 的设计更优，这种方法在处理 `ICD-10` 代码时更为合适。在使用循环神经网络（`RNN`）模型时，减少唯一诊断代码的数量并不是问题。事实上，我们比较了基于两种代码层级的相同模型，并发现没有显著差异。为了理解诊断的顺序（按时间顺序或重要性排序），我们使用了“入院时存在”（Present-at-admission）和“疾病优先级”（disease-priority）两列提供的信息。前者为我们提供了一种对特定时间之前的诊断进行聚类的方法，这在使用因果推断和倾向性模型时是必要的。\n\
  \n## 4.3.6 手术表\n\n### 手术代码数据简介\n\n手术代码是医疗分类的一个子类型，用于识别特定的手术、医疗或诊断干预。它们应该与诊断代码（`ICD-9`\
  \ 或 `ICD-10`）兼容，以防止 `BC/BS` 或 Medicare 等保险公司拒绝赔。在我们的示例数据库中，数据文件使用了三种类型的手术代码。本节将首先简要描述\
  \ EHR 数据库中常见的分类代码类型：\n\n*   `ICD-9` 手术代码\n    *   它们由两个数字组成，后跟一个小数点，然后是一个或两个数字（这与以\
  \ 3 个字母数字开头的 `ICD-9` 诊断代码不同）。\n    *   它们根据解剖区域或身体系统进行分类。\n    *   它们的类别比 `CPT`\
  \ 和 `HCPCS` 更广泛（`ICD-9` 手术代码远少于 `CPT` 手术代码）。\n    *   它们只能用于住院环境。\n\n*   `CPT` 代码\n\
  \    *   它们被称为 Level 1 `HCPCS` 编码系统。\n    *   `CPT` 是一种医疗代码集，用于向医生、健康保险公司和认证组织等实体报告医疗、手术和诊断程序和服务。\n\
  \    *   它们与 `ICD-9-CM` 或 `ICD-10-CM` 结合使用。在电子医疗结算过程中进行数值诊断编码。\n    *   它们由五个数字组成。\n\
  \    *   与 `ICD` 不同，`CPT` 代码中的每个数字并不对应特定的程序或技术。\n\n*   `HCPCS` Level II 代码\n   \
  \ *   `HCPCS` 的 Level II 是一种标准化编码系统，主要用于识别 `CPT` 代码未包含的产品、用品和及，例如在医生办公室外使用的急救护车服务和耐用医疗设备。\n\
  \    *   Level II 代码也称为字母数字代码，因为它们由一个字母后跟 4 位数字数字组成，而 `CPT` 代码使用 5 位数字进行标识。\n\n\
  ### 手术表数据清洗\n\n数据清洗团队可以尝试将某些 `CPT` 或 `HCPCS` Level II 代码转换为等效的 `ICD-9` 手术代码，但通常无法轻松实现，即\
  \ `CPT` 代码和 `HCPCS` Level II 代码不符合任何 `ICD-9` 手术代码。因此，我们可以决定不对手术表执行任何数据操作，且对手术表的数据清洗可能是必要的。\n\
  \n![image](img/inline1_1.jpg)\n\n## 4.4 讨论\n\n以下是本章的要点：\n\n**检查数据库结构。** 数据清洗的第一步是确保数据库具有正确的关系数据库模式（schema）。如果研究人员处理的是数据库副本而非原始功能数据库，这一步就至关重要。原始数据库应该具有基本正确的数据库结构，否则它无法运行，但副本数据的部署容易出现结构性问题。如果数据库模式出现任何问题，应首先进行修复，否则任何其他数据清洗程序都会在数据中引入更多错误或变得不必要的困难。\n\
  \n**寻求领域专家的指导。** 与任何其他研究领域一样，建议让在该领域具有足够知识的人士加入数据清洗团队。在 EHR 数据中，我们建议在数据清洗领域包含具有临床知识和保健管理背景的团队成员。\n\
  \n**在研究早期进行初步/探索性分析。** 正我们在本章之前的章节中讨论过的，在任何基于 EHR 的研究项目中，应该回答的前两个问题是：\n\n1. 数据是否有足够的患者数量来回答研究的主要目的？\n\
  2. 数据质量是否足以进行研究并会产生良好结果？\n\n出于此目的，我们建议编写一份数据清洗汇总统计报告。在研究早期阶段创建此报告将回答上述问题，并帮助研究团队决定数据是否足够用于研究。这对于防止在对特定研究无用的的数据集上浪费数据清洗时间至关重要。\n\
  \n**数据清洗（通常）是一个永无止境的过程.** 数据清洗始于识别错误。通常，你为针对特定的患者队列制定处理错误的策略，在研究的后期阶段，你会发现更多错误。此外，当你转移到其他患者队列时，可能会识别出特定于该人群的新错误。准备好频繁返回数据清洗步骤。\n\
  \n**记录数据清洗的每一步。** 数据清洗通常是一个迭代过程，在修改某些步骤时可能需要返回。记录每一步和每个操作。当你需要回来并可能记得做过什么时，这将非常有帮助。此外，E\
  \ 研究团队通常很大，人员流动是不可避免的。通过保持详细且组织良好的清洗文档，你可以节省时间并防止不必要的挑战。\n\n**专注且高效。** 请记住，你不需要清洗整个数据库。如果你有能力做到那是很好，但通常需要数年，等你完成时，数据库已经更新了新的错误。你的数据清洗程序应该基于当前研究进行聚焦。例如，如果研究重点是阿尔茨海默症，你不需要清洗有关以前关节脱臼的数据。此外，当你发现某些数据记录在你的患者队列中很少出现，如果在临床上是合理的，你可能想要删除这些记录。例如，假设我们想研究体重对骨关节炎发展的影响，在第一次汇总统计报告期间，我们发现只有\
  \ 2% 的患者有皮肤真菌感染记录。由于皮肤真菌感染与骨关节炎的发展在临床上无关，且在你的数据中非常稀疏，删除这些记录可能是更好的。进行这种初步变量选择将减少计算和人员/时间成本。\n\
  \n\n\n\n# 没有通用的解决方案。\n\n遗憾的是，数据清洗没有通用的解决方案。每种电子健康记录（EHR）数据库都有独特的错误，几乎不可能开发出一个通用的工具来清理所有类型的\
  \ EHR 数据。但是，可以实施诸如本节提供的方法等策略来处理数据清洗工作。\n\n针对 EHR 数据的首次数据清洗将非常耗时，但如果将重点放在开发更具通用性的数据清洗方法上，未来项目的数据清洗步骤将变得更容易、更快速。这是因为：首先，数据清洗团队的成员将熟悉数据库结构和常见错误；其次，如果你在第一次数据清洗中修复了许多错误，那么下一个项目只会多出几个错误。将数据清洗视为一项长期投资是有益的。随着\
  \ EHR 研究团队开展更多的项目，数据清洗团队的效率会变得更高，花在数据清洗步骤上的时间随之缩短。没有数据清洗，任何 EHR 研究都无法进行，而在开发一个通用、高效且准确的数据清洗框架上花费时间，考虑到未来项目及时开展的潜在收益，是完全合理的。\n\
  \n正如我们所讨论的，数据清洗很少有结束。数据清洗团队经常寻找新策略来更高效、更准确地处理数据清洗。当适用且计算上可行时，你的数据清洗团队可以专注于将已开发的通用方法应用于整个数据库。此外，每个项目都会带来新的挑战。未来，我们可能会更新本章以反映这些新错误并介绍新开发的策略。\n\
