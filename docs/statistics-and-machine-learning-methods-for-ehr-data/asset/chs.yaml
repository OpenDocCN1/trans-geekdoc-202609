  \ ~ P[data]]DW - E[ε ~ P[ε]]DW)`,(81)\n\n$V_{Y}(D_{Y},G_{Y},G_{W}) = E_{({Y,W})\\\
  sim P_{data}}[D_{Y}(f_{\\tau}(W))} - E_{Z\\sim P_{Z},\\varepsilon\\sim P_{\\varepsilon}}[D_{Y}(f_{\\\
  tau}(G_{Y}(X,Y^{f},T,Z_{G}),G_{W}(\\varepsilon)))]$,(82)\n\n\n\n\nmin[`G`[*Y*]]max[`D`[*Y*] ∈ `F`[*Y*]]`V`*Y*,(7.83)\n\
  \nmin[`G`[*W*]]max[`D`[*W*] ∈ `F`[*W*]]`V`*W* + `λ``V`*Y*,(7.84)\n\n其中 `F[Y], F[W]`\
  \ 是 1-Lipschitz 连续函数族，`λ` 通常被设置为 `λ` = 0.2。\n\n最后，我们研究了反事实的插补（ imputation）。我们将根据条件分布\
  \ $P\\left( {\\overline{Y}}^{\\mathit{cf}} \\middle| {\\overline{Y}}^{f} \\right)$，通过向图\
  \ 7.5 添加插补器 `G[i]` 和判别器 `D[i]` 来插补反事实。MisGANs 构建的新型架构如图图 7.7 所示。插补器 `G[i]` 是协变量\
