  \n\n\n\n\n# EHR 数据清洗\n\n![image](img/inline1_1.jpg)\n\nYashar Han Yuefan Vahed TalebiFengHuangMaroufy\n\
  \n## 4.1 引言\n\n数据清洗（也称为数据 `cleansing` 或 `scrubbing`）是检测并修复数据集中错误和不一致之处的过程，以减少异质性并提高数据质量。它是为统计分析和/或模型构建准备数据的过程中、数据提取之后的第二步。尽管数据清洗耗力且耗时，但对于任何基于\
  \ EHR 数据库的建模和分析都至关重要。然而，研究人员有时会忽视这一点，在这种情况下，不一致和错误可能会对结果的精确性和准确性产生显著影响。\n\n清洗 EHR\
  \ 数据与其他大数据和小数据研究的清洗方法不同。与基于 EHR 数据库的大数据分析不同，在传统的临床研究环境中（如实验研究和临床试验），数据收集是受控的，因此如果需要，数据清洗并不是一项繁琐的任务。另一方面，清洗来自其他大数据管理系统的数据可能没有\
  \ EHR 大数据清洗那样敏感。例如，电影推荐算法（如在线流服务使用的算法）在包含或排除离群值方面更有灵活性。这些算法的最坏情况是向观众推荐一个不喜欢的电影标题。相比之下，在\
  \ EHR 数据分析中，研究人员没有这种丢弃或更改数据的自由。从临床研究数据中排除可能的（但非可能的）值可能会导致结果产生偏差，从而以潜在的危害方式改变临床决策。\n\
  \n正如引言章节提到的，直到最近，将 EHR 数据作为科学研究的来源一直被忽视，部分原因是因为 EHR 数据库的主要目的不是研究或临床决策。相反，软件开发人员针对法律和计费目的优化数据库系统，主要考虑三个主要目标：医疗保健管理的财务、医护人员的用户友好性以及准备法律文档的实用性。此外，由于一个数据库被数百个医疗提供系统使用，数据的异质性和在数据中发现错误的可能性是不容忽视的。此外，《健康保险流动性与责任法案》（`HIPAA\
  \ law`）要求在将 EHR 数据提供给研究人员之前进行适当的去标识化。这种去标识过程使得检测和修复错误变得更加困难。因此，EHR 数据并非主要面向研究友好型，这使得数据清洗成为此类研究中最挑战性的步骤之一（`Nobles\
  \ et al. 2015`）。\n\n在本章中，我们首先回顾了专门为 EHR 数据清洗开发的现有方法和工具。然后我们列出并讨论了 EHR 数据库中常见的挑战和数据清洗问题，并演示了解决这些问题的方法。最后，我们以对\
  \ EHR 数据定制的数据清洗策略的一些一般性建议结束本章。\n\n数据清洗的主要目标是发现并纠正错误以及减少数据异质性。EHR 包含了各种数据，使得单个数据库可以用于多种类型的研究。因此，开发一种可重现的、更重要的是对于对应不同研究项目的不同数据集是可重复的数据清洗程序是有帮助的。开发通用的、独立于项目的数据清洗方法在时间和精力方面可能是昂贵的的，但回报将是巨大的。\n\
  \n## 4.2 现有数据清洗方法和工具回顾\n\n已有许多关于 EHR 数据清洗的发表论文和软件包，大部分集中在来自单个或少数医疗机构的数据集上。此外，有些工具相当局限，只处理数据清洗中的单项任务，例如统一某些实验室结果的测量单位。此外，我们应该强调，数据清洗和数据准备之间的界限非常狭窄。一些以数据清洗工具形式呈现的现有工具实际上是数据准备工具。例如，`IntelliClean`\
  \ 使用基于知识的系统创建两条记录之间的相似性量，如果它们的相似性超过预定义的阈值，则将它们合并（`Lee et al. 2000`）。这种方法在应用于大型 EHR\
  \ 数据库时具有很强的挑战性，因为它对所选阈值非常敏感。如果将 `IntelliClean` 以特定项目的方式应用于较窄的队列并利用领域知识，它可能会更可靠。然而，在本章中，我们处理可以应用于整个数据库的通用数据清洗。现有的数据清洗工具可以分为两大类：通用整理工具（wranglers）和特定的数据清洗工具。\n\
  \n### 4.2.1 数据整理工具 (Data Wranglers)\n\n这些工具通常是从事数据清洗的研究小组的作品。数据整理工具最早的例子之一最初由斯坦福可视化实验室开发的\
  \ `DataWrangler`，后由斯坦福/伯克利研究项目发布（`Kandel et al. 2011`）。该工具的免费版于 2012 年完成，随后开发了名为\
  \ `Trifacta` 的商业化版本（`Wrangler Editions 2019`）。\n\n另一个例子是由加州大学伯克利分校开发的 `Potter’s\
  \ wheel`（`Apers et al. 2001`）。该工具具有图形界面，可以最大限地减少编码，并让没有专业技能的用户更容易进行数据操作。该工具具有类似于电子表格的界面，用户可以在其中定义不同类型的转换，然后创建这些转换的流水线。`Potter’s\
  \ wheel` 针对大型数据集进行了优化。快速可视化（即使在加载整个数据之前）、某些类型的数据质量指标和自动差异检测是该工具的主要特征（`Apers et al.\
  \ 2001`）。\n\n还有其他既商业化又公开可见的数据整理工具，每种工具都有自己的优缺点（`Adu-Manu-Sarpong et al. 2013`）。这些工具的开发是为了处理各种不同类型的数据。它们的主要功能是重新格式化或转换数据。这种程序在处理日期/时间字段和地理位置信息时特别有用。这两种类型的数据都可能有不同或复杂的格式，将它们转换为更统一、方便的格式是非常重要的。此外，某些工具还提供数据提取功能。检测模式和正则表达式以及重新格式化是这些工具专门处理的另一个领域。一些更先进的（通常是付费的）工具可以帮助处理缺失值问题，并通过丢弃离群值来清洗数据。这些工具的另一个强大特性是能够通过其良好且优化的代码快速处理和可视化大数据。\n\
  \n尽管这些工具的通用性是其主要卖点之一，但也是它们的主要缺点。尽管处理 EHR 数据有其自身的复杂性，且整理工具会在数据中留下一些不一致之处，但仍然需要进行专门处理。因此，专门为\
  \ EHR 数据开发的数据清洗工具在大多数情况下可能是更好的选择。\n\n### 4.2.2 针对 EHR 数据集的数据清洗工具\n\n\n\n\nEHR 数据库系统可能有不同的设计和实现方式。它们可能使用不同的数据字典，而且作为关系型数据库，其架构之间也存在差异。例如，一个数据库可能使用世界卫生组织的\
  \ ICD-10 代码列表（包含约 14,000 个不同代码），而另一个可能使用 ICD-10-CM 代码列表（包含超过 70,000 条目）。日期可能以欧洲格式（dd/mm/yyyy）或美国格式（mm/dd/yyyy）输入。不同国家的邮政格式不同；因此，地理位置数据可能是数据清洗团队的另一项挑战任务。由于\
  \ EHR 数据库系统之间存在这些差异，数据清洗工具通常是针对特定的 EHR 数据库开发的，可能无法直接应用于其他数据库。然而，对研究小组的方法、经验及其工具进行研究，对于开发自己的数据清洗工具的研究人员来说始终是有益且具有启发性的。\n\
  \n这类工具的一个示例是由英国人员使用 `r` 统计软件开发的“`rEHR`”包。英国在过去的 20 多年里，全科医生在全科医疗中实施了近乎普及的 EHR 部署（Springate\
  \ et al. 2017）。以下数据库被用于创建这个通用的 EHR 数据库：\n\n*   临床实践研究数据链 (CPRD，以前称为全科医疗研究数据库 GPRD)\n\
  *   健康改进网络 (THIN)\n*   QResearch\n*   医生独立网络 (DIN-LINK)\n*   Research One\n\n该数据库已完全去标识化，并供研究使用（Springate\
  \ et al. 2017）。\n\n`rEHR` 包是 SQL 查询的封装器，用于方便快速地与底层数据库进行交互，并带有一些额外功能。它可以从数据库中提取数据，并将纵向数据转换为适用于生存分析的队列数据集。`rEHR`\
  \ 可以创建具有匹配的对照组和病例组的数据，并根据随时间变化的协变量对队列数据进行切分。另一个额外功能是该代码能够统一 HbA1c 的测量单位。\n\n文献中也有一些用于数据清洗的统计方法。例如，人们已经开发出相应的算法，利用患者生命中不同阶段的中位数身高来检测和清洗不准确的成年人身高（Muthalagu\
  \ et al. 2014）。这种方法简单且易于实现，但会丢失病史中令人惊讶且显著的信息点。例如，我们既不预期患者的高度会出现负变化，也不预期在青春期后身高显著增加。然而，我们应该记住，尽管概率极低，但上述假设存在例外。例如，如果患者接受了双侧下肢截肢手术，高度变化将为负；另一方面，如果患者接受了脊柱重建手术，他/她即使在成年后也可能增加身高（Spencer\
  \ et al. 2014）。这些情况虽然罕见，但取决于研究类型和目标人群，在数据清洗过程中忽略它们可能会删除一些关键数据点，并给研究引入偏倚。\n\n###\
  \ 4.2.3 数据质量评估\n\n研究者面临的首要挑战之一是可用数据是否合适且足够好以开展感兴趣的研究。这个问题的答案至关重要，结果通常在数据清洗过程的初始阶段就会显而易见。例如，我们可能感兴趣使用多中心\
  \ EHR 数据库系统研究一种罕见传染病。起初，我们发现数据库有足够的记录和受试者来进行研究。然而，在随后的数据检查中，我们可能会发现大多数记录记录错误，并且包含极高的数据缺失率。这些发现可能迫使研究小组从研究删除某些记录块，最终可能导致用于继续研究的受试者数量减少。Kahn\
  \ 等人提出了数据质量指标来评估可用数据的合适性（Kahn et al. 2012）。他们将这些指标分为五大类别：\n\n1. **属性域约束（Attribute\
  \ domain constraints）：** 该指标衡量每个目标属性的基本汇总统计量，并评估其分布情况。如果临床知识建议某个属性具有确定可能的取值范围的分布，我们就可以估计数据库中该特定属性的误差水平。例如，脉搏氧饱和值通常在\
  \ 95% 以上，我们知道值的可能范围是从 0% 到 100%。因此，如果我们发现这些属性存在大量负值或超过 100% 的值，则可能表明数据质量较差（错误数量多）（Elder\
  \ et al. 2015）。\n\n2. **关系完整性规则（Relational integrity rules）：** 该指标涉及我们提取数据所在的数据库结构。例如，如果我们发现每个患者的主键（在\
  \ Cerner 中称为 `Patient_sk [super_key]`）对某些患者不是唯一的，我们可以得出数据库存在结构性问题的结论，且这种差异的比例越高，表明数据质量越低。\n\
  \n3. **历史数据规则（Historical data rules）：** 该指标评估随时间变化的属性的质量，例如在不同时间点是否使用相同的格式。\n\n\
  4. **状态依赖规则（State-dependent rules）：** 该指标评估对象生命周期中的变化是否遵循预期的转换。例如，如果患者在某时间点被标记为已死亡，那么我们在之后的时间点不应有关于其/她生存状态的任何记录。一个例子是在报告死亡时间后记录了血压。然而，我们应该记住，某些结果即使在此类情况发生后也会出现在数据库中，例如性报告。\n\
  \n5. **属性依赖规则（Attribute dependency rules）：** 该指标衡量依赖属性的质量。例如，如果我们在一个具有多次男性记录的患者身上观察到怀孕诊断，我们可能会质疑数据的质量（Kahn\
  \ et al. 2012）。\n\n这种数据质量评估可以指导我们解决以下问题：\n\n*   使用可用数据集进行特定研究是否可行？\n*   数据清洗过程有多困难和枯燥？\n\
  *   数据清洗团队应该优先考虑领域？\n\n一些研究使用该框架评估数据质量，并主要通过删除某些记录或属性来清洗数据（Dziadkowiec et al. 2016），尽管这种方法简单直接，但对最终结果产生了偏倚。\n\
  \n![image](img/inline1_1.jpg)\n\n## 4.3 常见的 EHR 数据错误与修复方法\n\n在本节中，我们将要回顾 EHR 数据库中可能的错误和不一致之处，并给出示例。在每个案例中，我们描述了减少不一致性和解决问题的方法。\n\
  \n\n\n\n大多数 EHR（电子健康记录）数据库都存有用于存储患者就诊、实验室结果、临床事件、诊断、药物、操作和手术操作信息的表。在所有信息中，只有就诊表（包含人口统计学变量）、实验室结果表和临床事件表（包括生命体征）具有定量结果，因此它们将是我们数据清洗工具的重点。然而，其余表格——主要包含作为诊断代码的记录（例如\
  \ `ICD-9`、`ICD10`）、药物代码/名称（例如 `NDC`、通用名称）、操作代码（例如 `CPT`）——也并非没有问题。我们也处理了这些问题，并提供了处理这些问题的简单程序。此外，我们将使用基于\
  \ Cerner 数据库的 SAH（亚网膜出血）和 AIDS 队列项目示例（如第 2 章中提到的）。由于我们处理的是不特定于特定数据/项目的通用数据错误，因此相同的方法（经过某些修改）也可以适用于其他数据库。最后，我们描述了我们新开发的半自动工具，用于处理\
  \ EHR 数据库中的主要错误和不一致之处。\n\n### 4.3.1 EHR 数据库中的常见错误列表\n\n*   **人口统计学表**\n    *   性别不一致。\n\
  \    *   种族不一致。\n    *   患者键字段不唯一。\n    *   记录年龄错误。\n*   **实验室表**\n    *   同一实验室有多个测量单位。\n\
  \    *   单条记录对应多个日期/时间。\n    *   某些测量单位是不可能的。\n    *   超出范围错误。\n    *   分配了错误的 `Lab\
  \ ID`。\n*   **临床事件**\n    *   与实验室表重叠。\n    *   同一特征对应多个临床事件代码。\n    *   同一组测量值具有不同的时间点。\n\
  \    *   分配了错误的临床事件 ID。\n*   **药物、诊断、操作表**\n    *   同一种药物有多种格式。\n    *   诊断代码分类过多。\n\
  \    *   操作有多种类型的代码。\n\n### 4.3.2 人口统计学表\n解决人口统计表的问题尤为重要，因为任何数据质量评估都很大程度上取决于此表。此外，人口统计学表对于追踪其他表中数据清洗的错误和根源至关重要。\n\
  \n#### 多重种族和性别\n可能会遇到的问题之一是患者种族和/或性别的不一致。这种错误是任何 EHR 数据库中常见的错误之一。在初始清洗后，HIV-癌症队列中性别和种族不一致的几率分别为\
  \ 0.3% 和 22%。除了数据录入期间的错误外，我们认为跨性别者（估计占美国总人口的 0.3%（Gates 2011））和多族族患者（估计占美国的 6.9%（Parker\
  \ et al. 2019））的报告错误可能导致这些不一致性。\n\n为了理解不一致的根源，描述数据库如何记录患者的种族和性别将很有帮助。如图 4.1 所示，每个患者在我们的数据库中都有一个唯一的\
  \ `Patient SK`（它应该是唯一的，但正如我们稍后讨论的，这部分存在错误）。每个 `Patient SK` 拥有一个或多个关联的 `Patient IDs`，每个\
  \ `Patient ID` 拥有一个或多个 `Encounter IDs`。患者的性别和种族被记录为 `Patient ID` 的一个特征。同一个 `Patient\
  \ SK` 可能对应多个 `Patient ID`。如果个人人口统计信息随新的就诊发生变化，则会在 `Patient Table` 中添加一条包含新 `Patient\
  \ ID` 的记录。虽然罕见，但同一个“人”在不同就诊期间随时间可能有不同的种族/性别记录。通常，当这种情况发生时，是因为某条记录存在空白或未知值，而该字段将在另一个患者记录中填充。\n\
  \n![图 4.1 用于患者 SK、患者 ID 和就诊 ID 的示例 EHR 数据库结构。](img/fig4_1.jpg)\n\n**图 4.1**\n用于患者\
  \ SK、患者 ID 和就诊 ID 的示例 EHR 数据库结构。\n\n我们修复此种错误的方法是：\n\n1. 对于每个 `Patient SK`，我们选择所有的\
  \ `Patient IDs`。\n2. 我们丢弃所有的 `NULL`/`null`//`Not Mapped` 值。\n3. 如果患者的性别或种族有多个值，我们对性别和种族进行多数投票，并将其设置为正确的患者性别和种族。\n\
  4. 如果多数投票结果没有定论（即每个性别/种族类别的数量相等），我们选择首次记录的性别和种族作为患者的正确性别和种族。\n\n#### 同一就诊 ID 的多个患者键\n\
  我们可能发现的另一个错误是多个 `Patient SKs` 链接到单个 `Encounter ID`（本应相反相反）。如果此类错误在任何数据库中的比例很高，说明数据库结构是不可靠的，并将导致数据质量大幅下降。此类错误应在进行任何进一步分析/数据清洗之前修复。在我们的案例研究中，由于我们遇到这种错误的概率仅为\
  \ 0.02%，我们直接将其从数据库中删除了。\n\n#### 多个计算出的出生日期\n在此示例数据库中，每次就诊的患者年龄保存在多个字段中：\n\n1. 以年计年龄\n\
  2. 以月计年龄\n3. 以周计年龄\n4. 以天计年龄\n5. 以小时计年龄\n\n在我们的案例研究中，对于每个记录的年龄遇到了三种不同的场景（见图 4.2）：\n\
  \n*   第一场景：所有字段为空（缺失年龄）\n*   第二场景：仅 `age in years` 字段已填充（年）\n*   第三场景：所有字段已填充（年/天）\n\
  \n![图 4.2 选择出生日期的不同案例。](img/fig4_2.jpg)\n\n**图 4.2**\n选择出生日期的不同案例。\n\n每个患者可能有多次就诊。通过使用该就诊的日期和第一或第二场景的年龄，我们可以分别计算精确或近似的出生日期。\n\
  \n如果我们为单个患者获得多个精确或近似的出生日期，我们使用以下步骤确定哪一个是可能的出生日期：\n\n*   案例 1：如果所有患者年龄符合第一场景，则出生日期缺失。\n\
  *   案例 2：如果所有患者年龄符合第二场景，则出生日期通过多数投票（案例 2a）或首次记录年龄（案例 2b）决定，类似于性别/种族的方法。\n*   案例\
  \ 3：如果患者有一个（案例 3a）或多个（案例 3b）符合第三场景的估计出生日期，则使用首次记录的日期计算患者出生日期。\n\n### 4.3.3 实验室表\n\
  如前，大型 EHR 数据库被多个医疗机构（例如医院和诊所）使用，每个机构可能使用不同的试剂或设备来评估实验室测量（例如血钾）。某些设备对同一实验室测量有不同的参考范围，且\
  \ EHR 系统供应商可能允许每个实体使用自定义的数据输入结构。这两个因素导致了使用多种格式报告同一种测量。在我们的示例数据库中，`Procedure ID`\
  \ 列包含实验室程序的数字代码。结果根据数字 `Result Type ID` 字段记录，并可能以不同的格式（例如字母数字、数字、文本等）存储。例如，表 4.1\
  \ 显示了我们的示例数据库报告血钾（编码为 Procedure ID = 24）的不同格式，同一个 `Procedure ID` 有多个 `Result Type\
  \ IDs`（分别为 1, 7, 9, 12）。\n\n\n\n\n\n## 表 4.1 示例数据库中血清钾水平的不同报告格式\n\n| **编号** | **程序\
