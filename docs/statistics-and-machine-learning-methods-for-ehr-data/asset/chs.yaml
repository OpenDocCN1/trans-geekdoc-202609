  \ Y_{i}^{f} - {\\\\widetilde{Y}_{i}^{\\eta})^{2} \\right..$(7.60)\n\n优化问题 (7.4)\
  \ 可以通过以下方式实现：\n\n$\\min\\limits_{D_{G}}{- \\widehat{V}\\left( {D_{G},G} \\right)},$(7.61)\n\
  \n$\\min\\limits_{G}{\\widehat{V}\\left( {D_{G},G} \\right) + \\lambda l\\left(\
  \ G \\right)}.(7.62)\n\n优化问题 (7.10) 和 (7.11) 可以反向传播（随机梯度下降）算法求解。算法的细节见补充说明 A。\n\n\
  ### ITE 块优化\n\nITE 块意在使用观测结果和插补的反事实结果来估计反事实。其性能指标定义为$L\\left( G_{I} \\right) = \\\
  frac{1}{n}\\sum\\_{i = 1}^{n}\\left| \\left| {Y_{i} - {\\\\widehat{Y}_{i}} \\right|\
  \ \\right|\\_{2}^{2}$。\n\n`VI` 的采样公式为${\\widehat{V}_{I}\\left( {D_{I},G_{I}} \\\
  right) = \\frac{1}{n}\\sum\\_{i = 1}^{n}\\left\\lbrack \\log{D_{I}\\left( X_{i},Y_{i}^{\\\
  ast} \\right) + \\log\\left( \\left. 1 - D_{I}\\left( X_{i},Y_{i}^{\\ast} \\right)\
  \ \\right) \\right.$\n\nITE 的优化问题 (7.7) 可以重新表述为：\n\n$\\min\\limits_{D_{I}}{- \\\
  widehat{V}\\left( {D_{I},G_{I}} \\right)},$(7.63)\n\n$\\min\\limits_{G_{I}}{{\\\
  widehat{V}\\left( {D_{I},G_{I}} \\right) + \\gamma L\\left( G_{I} \\right)}.(7.64)\n\
  \n同样，可以使用随机梯度下降来求解优化问题 (12) 和 (13)。它们的数值实现算法与插补块相似。\n\n### 用于估计生存分析中 ITE 的 CGANs\n\
  \n#### 生存分析背景\n\n生存分析中的一个关键问题是处理处理截数据。让 $\\overline{Y}_{i} = [\\overline{Y}¹,\\\
  dots,\\overline{Y}^K]^T$ 为关联于 *i* 个体的潜在结果向量，其中 $\\overline{Y}_{i}^{k}$ 是 *i* 个体接受\
  \ *k* 次治疗的生存时间。我们只观测到接受治疗的实然结果，并记为 $Y_{i}^f$。未观测的潜在结果（生存时间）被称为反事实结果，记为 $Y_{i}^{cf}$。实然结果\
  \ $Y_{i}^f$ 可以表示为$Y_{i}^f = \\sum\\_{k = 1}^{K}W^{k}\\overline{Y}_{i}^{k}$。每个潜在结果（生存时间）$Y_{i}^{k}$\
  \ 都关联于 `X[i]`，这是 *i* 个体的协变量。为了简单起见，省略了个体的下标 *i*。\n\n接下来考虑截断。截断的原因包括：1) 失访；2) 其他原因死亡。让\
  \ `L[i]` 为截断指示变量，其中 `l[i]=1` 表示 *i* 个体未被截断，`l[i]=0` 表示 *i* 个体被截断。让 `C[i]` 为 *i*\
  \ 个体的截断时间。事件（死亡或截断）的潜在时间 `Z=[Z¹,\\dots,Z^K]` 定义为：\n\n$Z^{k} = \\min{\\{{\\overline{Y}^{k},C}\
  \ \\}},k = 1,\\ldots,K$(7.65)\n\n实然（观测）事件时间为：\n\n$Z^{f} = \\sum\\_{k = 1}^{K}W^{k}Z^{k}}.(7.66)\n\
  \n定义 *k* 次潜在生存时间的截断指示变量表示其小于截断时间：\n\n$\\delta^{k} = I\\left( {C \\geq {\\overline{Y}^{k}}}\
  \ \\right)$(7.67)\n\n所有潜在生存时间的截断指示变量为：\n\n$\\delta = \\sum\\_{k = 1}^{K}W^{k}\\\
  delta^{k}}.(7.68)\n\n截断生存时间的治疗效应估计的数据为 `(Y,W,T,X,\\delta,Z)`。假设 `Z⫫Y^*|(X,T,e)`\
  \ 假设需要扩展到截断数据。\n\n步骤 1：在给定协变量的情况下，治疗分配与截断和未截断生存时间独立。形式上，我们假设：\n\n$\\left( \\overline{Y},Z\
  \ \\right)⫫W|X.(7.69)\n\n与治疗分配假设类似，我们还对截断时间与生存时间和协变量的独立性做了如下假设：\n\n步骤 2：$\\left(\
  \ \\overline{Y},Z,X \\right)⫫C|W.$\n\n#### 用于估计生存分析中 ITE 的 CGANs 的损失函数\n\n生存分析数据由两部分组成：1)\
  \ 非截断数据 `D[nc]` 和 2) 截断数据 `D[c]`。在生存分析中，生成器在公式 (7.3)中产生的潜在结果应改为\n\n$\\widetilde{Y}\
  \ = G{({X,{\\overline{Y}_{f}},T \\odot W,\\left( {1 - W} \\right) \\odot z_{G},l,\\\
  theta_{G}})}.(7.70)\n\n非截断数据 `D[nc]` 的损失函数给出：\n\n\n\n\n\n$\\begin{array}{l} {V\\\
  left( {D_{G}, G, D_{nc}} \\\\right) = E_{{({x,t,w,y^{f}})}\\sim P\\_{D_{nc}}{({x,t,w,y^{f}})}}E_{z\\\
  _{G}\\\\sim u({({- 1,1)^{K}})}}\\\\left\\\\lbrack W \\odot \\log D_{G}(X,\\\\widetilde{Y},T,\
  \ W, l = 1) \\right\\\\rbrack} \\\\\\\\ {\\\\left. + (1 - W) \\\\odot \\log(1 -\
  \ D_{G}\\\\left( {X,\\\\widetilde{Y},T, W,l = 1} \\right)) \\right\\\\rbrack.} \\\
  \\\\\\ \\\\end{array}$(7.71)\n\n对于删失数据 `D[c]`，我们需要引入第二个损失函数 `V(D[c])` 来强制执行约束 $Z^{k}\
  \ = \\min{\\left\\\\{ {{\\overline{Y}}^{k},C} \\\\right\\\\},\\\\mathit{k} = 1,\\\
  \\ldots,\\\\mathit{K}}$：\n\n$V\\left( {D_{G},G,D}_{c} \\right) = E_{{({x,t,w,y^{f}})}\\\
  sim P\\_{D_{c}(x,t,w,}y^{f})}\\\\left\\\\lbrack \\\\max\\\\left( 0, \\\\right.C\
  \ - G{({X,{\\overline{Y}}\\_{f},{T \\odot W,\\\\left( {1 - W} \\right) \\\\odot\
  \ z}\\_{G},l = 0,\\\\theta_{G}})}. \\\\right.$(7.72)\n\n使用拉格朗日乘子，可以将约束整合到损失函数 (7.20)\
  \ 中，以获得用于生存分析中估计 ITE 的 CGANs 总损失函数：\n\n`V(D[G],G,D[nc],D[c])` = `V(D[G],G,D[nc])` + `λV(D[G],\
  \ G, D[c])`,(7.73)\n\n其中 `λ` 是一个控制删失和非删失损失函数之间平衡的调节参数。我们通常设置 `λ` = 1。\n\n为了获得生存分析中的\
  \ ITEs，我们求解以下优化问题：\n\n$\\min\\limits_{G}{\\max\\limits_{D_{G}}{V\\left( {D_{G},G,D_{nc},D_{c}}\
  \ \\right)}}.$7.74)\n\n### 7.5.3 用于估计个体治疗效应的 Wasserstein GAN\n\n众周知，训练 GAN 是困难的，因为我们经常面临收敛性和模型崩溃等限制。Wasserstein\
  \ GANs (WGANs) 可以用来克服这些限制（Arjovsky and Bottou 2019）。WGANs 和 GAN 的主要区别在于损失函数。我们只需要为\
  \ WGANs 引入一个损失函数。神经网络的架构与第 7.2.3 节](#ch07.xhtml#sec7_02_03) 中的相同。WGANs 用于填充反事实的损失函数\
  \ `V(D[G],G,θ)` 给出如下：\n\n`V[D[G],G,θ] = E[x,t,w,y^f] ~ P[data(x,t,w,y^f)] E[z ~\
  \ u((-1,1)^K)] W ⊙ D[G-(1-W) ⊙ DG]`,(75)\n\n其中 `Ỹ = G(X,Y^f,T⊙W,(1-W)⊙Z)` 且 `D[G]`\
  \ 是 1-Lipschitz 函数的集。我们通常使用神经网络来实现 `D[G]`，它满足 1-Lipschitz 条件。为了填充反事实，我们求解以下优化问题：\n\
  \n$\\min\\limits_{G}{\\max\\limits_{D_{G}}{V\\left( {D_{G},G,\\theta_{d}} \\right)}}.$7.6)\n\
  \n### 7.5.4 用于估计个体治疗效应的 MisCGANs\n\n#### 不完全观测数据的通用过程\n\n不完全观测数据的通用过程可以通过两个随机向量进行统计学描述（S.\
  \ C.-X. [Li, Jiang, and Marlin 2019, Little and Rubin 2002）。令 `X ∈ R^n` 为完整数据向量，`M\
  \ ∈ {0,1}^n` 为一个 `n`-维掩码向量，用于指示数据向量中的分量是否缺失。描述不完全观测数据的统计模型给出：\n\n`X ~ P[θ(X)]` 和\
  \ `M ~ P[M|X]`。为了刻画数据的缺失机制，完整数据集 `X` 被分解为 `X` 的观测部分 `X[obs]` 和缺失部分 `X[mis]`，即 `X\
  \ = [X[obs], X[mis]]`。因此，掩码向量的分布可以表示为 `P[M|X[obs], X[mis]]`。基于完整数据 `X` 和掩码 `M` 之间的关系，缺失机制可分为三种情况（Little\
  \ and Rubin 2002）：\n\n1. 如果掩码与完整数据独立，即 `P[M] = P[M]`，则是完全随机缺失 (MCAR)；\n2. 如果掩码与观测数据独立，即\
  \ `P[M|X] = P[M|X[obs]]`，则是随机缺失 (MAR)；\n3. 如果缺失取决于完整数据 `X`，则是非随机缺失 (NMAR)。在本章中我们只考虑\
  \ MCAR。此时联合概率 `P(X,M)` 可以分解为 `P(X)`。\n\n#### 用于反事实填充的 MisGAN\n\n在本节中，我们研究了 MisGAN\
  \ (S. C.-X. Li, Jiang and Marlin 2019) 用于 ITE 问题。ITE 问题中的缺失数据是由反事实引起的。完整数据为 `Y_f`。换句话说，如果\
  \ `W[i] = 1` 则结果可见，如果 `W[i] = 0` 则反事实未观测。用常量 `τ` 填充反事实的掩码算子定义为：\n\n`Y = Y_f + τ(1\
  \ - W)`,(78)\n\n我们首先生成掩码 `W` 的分布。用于掩码分布的 MisGAN 架构如图 7.6](#ch07.xhtml#fig_6)。我们定义\
  \ `D[Y]` 为：\n\n`Ỹ = G_Y(X,Y^f,T,Z_G)`(79)\n\n![图 7.6 用于掩码分布的 MisGAN 架构](img/fig7.jpg)\n\
  \n掩码 `Ŵ`（治疗分配）由 `G[Y]` 生成，`G[W]` 由神经网络实现。与只有一个生成器-判别器对的标准 CGAN 不同，MisGANs 有两个生成器-判别对\
  \ `(G[W], D[W])` 和 `(G[Y], D[Y])`分别用于掩码（治疗分配）和潜在结果。由于假设治疗分配和潜在结果是独立的，我们有两个独立的噪声\
