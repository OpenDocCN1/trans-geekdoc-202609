- "# EHR 数据的统计与机器学习方法\n\n\n\n\n\n\n**Christopher Yang**，美国德雷州大学\n\n\n*Hulin Wu, Jose-Miguel\
  \ Yamal, Ashraf Yaseen, Vahed Maroufy*\n\n\n\n编辑：\nHulin Wu, Jose-Miguel Yamal,\
  \ Ashraf Yaseen 以及 Maroufy Vahed\n\n\n\n\n\n\n\n\n由 MPS Limited, Dehradun 使用 Palatino\
  \ 字体字体\n\n\n\n\n# \n\n\n# 前言\n\n电子病历（EMRs）是在诊所、医院收集的数字化临床图表和信息，主要由医疗保健提供人员用于诊断和治疗。EMRs\
  \ 允许临床医生随时间跟踪患者数据，识别需要预防性访问和筛查的患者，监测患者并提高医疗保健质量。电子健康记录（EHRs）的建立是为了超越医疗保健提供者办公室或诊所收集的标准临床数据；相反，EHR\
  \ 系统在健康相关收集方面要广泛得多。EHRs 包含了来自参与护理的所有临床医生的患者数字化数据和信息。EHR 系统还设计用于与所有授权的临床医生、医护人员和患者本人共享数据和信息。EHRs\
  \ 还可能包含供该地区甚至整个国家的实验室、专家、养老院和其他医疗提供者访问的数据。凭借功能完备的 EHR，任何地点或任何机构的所有授权医疗保健提供者都可以随时获取患者的最新信息，从而实现更协调的、以患者为中心的护理。\n\
  \n尽管 EMR 系统始于 20 世纪 60 年代，但它们在这一世纪互联网变得更加流行后变得更加人注目。作为《美国恢复与再投资法案》的一部分，所有公共和私立医疗保健提供者都要求在\
  \ 2014 年 1 月 1 日之前证明 EMR 的“有意义的使用”。EMR 系统最初的设计主要目的是记录、计费和临床实践支持。将 EMR 或 EHR 数据用于研究和科学进步仍处于起步阶段。利用\
  \ EMR 或 EHR 数据生成真实世界证据以支持临床实践和科学研究中的决策过程具有挑战性，但也充满前景。在本书书中，我们打算根据我们的经验解决一些挑战，特别是从统计学和数据科学的角度。到目前，用于\
  \ EMR/EHR 数据处理和分析的统计文献仍然稀少，尽管有很多数据处理和分析问题及挑战需要统计学家和数据科学家更多关注。我们确定了初步 EHR 数据探索和分析需要解决的一些重大问题和争议。在本书中，我们主要关注分享我们在\
  \ EHR 数据处理和分析方面的经验，并以通用方法论和方法的概述作为补充。\n\n\n\n\n*电子健康记录（EHR）数据的统计与机器学习方法：从数据提取到数据分析*是由德克萨斯大学健康科学中心休斯顿分校（UTHealth\
  \ SPH）公共卫生学院新成立的健康大数据中心（CBD-HS）发起的大数据项目之一。我们在 2017 年秋季成立了 EHR 工作组，成员来自 UTHealth\
  \ 的公共卫生学院、生物信息学院、麦戈弗医学院（McGovern Medical School）以及 Cizik 护理学院的教职员工、学生和研究人员。EHR 工作组于\
  \ 2017 年 11 月启动了第一个关于蛛网膜下出血（SAH）患者血管收缩药物治疗评估的项目，该项目由我们的临床合作者 George Williams 博士（医学博士、FCCP、教授，UTHealth\
  \ 麦戈弗医学院麻醉科重症监护中心部门主任）提出。从 2018 年至 2020 年，有 20 多名教职员工和学生加入了 EHR 工作组，并开始进一步探索大型全国性\
  \ EHR 数据库 (`Cerner Health Facts`)，以开展更多的研究项目和科学发现。\n\n在本书书中，我们将以系统的方法回顾并阐述 EMR/EHR\
  \ 数据的处理和分析方法。全书由 11 章组成。第 1 章在在对 EHR 数据的挑战与机遇进行简要介绍后，我们提出并讨论了 EHR 研究项目的整个周期。第 2\
  \ 章介绍了 EHR 项目管理。由于大型 EHR 数据库可用于许多研究项目，因此有必要高效地管理这些项目，以便利用资源并确保结果的可重复性。第 3 至 5 章描述了在进行任何正式数据分析之前，提取、清洗、处理和准备\
  \ EHR 数据的三个重要步骤。根据我们的经验，这些步骤可能非常耗时且枯燥。在这三章中，我们将通过 EHR 研究项目的案例，分享我们在数据提取、清洗、处理和准备方面的经验。缺失值数据和许多混杂因素是观察性研究中的两个主要问题，且对\
  \ EHR 数据而言更具挑战性。第 6 章和第 7 章提供了处理这两个问题的方法论概述。我们在第 8 章中回顾了用于 EHR 数据探索和分析的一些基础统计方法。第\
  \ 9 章和第 10 章重点关注机器学习方法，包括基于 EHR 数据进行结果预测的神经网络和深度学习方法。最后，我们在第 11 章中简讨论了 EHR 数据研究的未来趋势。书中使用了真实的\
  \ EHR 研究项目和案例来说明这些方法，并提供了实现这些方法的计算机代码。本书建立了一个网站（[`sph.uth.edu/dept/bads/ehr-research`](http://sph.uth.edu)），用于提供更新并与读者分享计算机代码和其他信息。\n\
  \n对于 EMR/EHR 数据和数据库经验少的读者，应该仔细阅读第 1 至 5 章，因为这些章节提供了 EHR 数据特征和处理挑战的概述。对于熟悉基础统计方法、缺失值处理以及处理混杂因素的因果推断的统计学家，可以跳过第\
  \ 6 至 8 章的部分内容。第 9 至 10 章通过真实数据示例，提供了用于 EHR 数据分析和预测的机器学习方法概述，这对于不熟悉这些方法及其在 EHR 数据应用的读者很有帮助。读者可能会从中获得对未来趋势的一些灵感。\n\
