  \n数值求解优化问题 (7.4) 和 (7.7) 的算法包含以下步骤。\n\n为了解决优化问题 (7.4) 和 (7.7)，我们需要使用采样公式来近似期望。因此，我们首先讨论插补块（imputation\
  \ block）的实现。\n\n### 插补块优化\n\n假设采样了 *n* 个个体。`V(D[G],G)` 的采样近似给出：\n\n$\\widehat{V}\\\
  left( {D_{G},G} \\right) \\approx \\frac{1}{n}\\sum\\_{i = 1}^{n}{\\left\\lbrack\
  \ W \\right.\\_{i}^{T}\\log{\\left( {D_{G}\\left( X_{i},T_{i},{\\widetilde{Y}_{i},W_{i},\\\
  theta_{d} \\right.} \\right) + \\left( 1 - W_{i})^{T}\\log{\\left( 1 - D_{G}\\left(\
  \ {X_{i},T_{i},{\\widetilde{Y}_{i},W_{i},\\theta_{d}} \\right) \\right)\\rbrack}\
  \ \\right.}},$(7.59)\n\n其中 `Ỹ`  =  `G(X,Y^*(f),T ⊙ W*,ↆ(1−W*) ↆ⊙ Z[G],θ[G])`。\n\
  \n为了强制确保估计的实然结果 `Ỹ[i]^(η*)` 尽可能接近观测到的实然结果 `Y[i]^(f*)` (Yoon, Jordon, and Schaar\
