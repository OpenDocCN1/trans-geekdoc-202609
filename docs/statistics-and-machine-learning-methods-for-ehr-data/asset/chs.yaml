  \n[content]\n机器学习（ML）的含义对于不同研究和应用领域的人来说可能有所不同。简单而言，这里的机器学习指的是一类广泛用于数据探索和分析的统计与计算方法、理论和工具。与传统的统计方法相比，机器学习方法主要是以数据为驱动的，并且可能不依赖于预先指定的机制模型。以从数据中提取隐藏知识为目标，通常可用于学习任务的样本数量越大，机器学习算法的性能越好。得益于其强大和灵活性，机器学习成为研究人员和科学家解决涉及大量变量的大集的各种复杂问题的流行选择。总的来说，机器学习方法可以分为几类：监督学习、无监督学习、半监督学习和强化学习。\n\
  \n如 Shobha and Rangaswamy (2018) 所述，监督学习主要采用两类技术：1) 分类技术，用于预测离散响应（二分类或多分类）；例如，患者患上某种疾病或状况的风险类别；2)\
  \ 回归技术，主要用于预测连续响应；例如患者生命体征的变化（如血压或体温）。常用于分类和/或回归的机器学习算法示例包括 k-近邻（KNN）、朴素贝叶斯、线性模型、袋装和提升决策树、随机森林、支持向量机（SVM）以及神经网络。\n\
  \n如今，监督学习已广泛应用于医疗保健领域，如疾病诊断、疾病风险预测或死亡率/结局预测。一些示例包括研究人员利用电子健康记录（EHR）数据库中的丰富信息预测心脏病导致的住院（Dai\
  \ et al. 2015）、预测 2 型糖尿病风险（Mani et al. 2012）或预测癌症患者 6 个月死亡率（Parikh et al. 2019）。在前两个章节中，我们讨论了用于\
  \ EHR 数据分析和预测的统计方法、神经网络和深度学习方法。在本章中，我们关注一些选定的监督学习技术。我们将简要描述这些监督学习技术，然后通过一个关于蛛网膜下出血（SAH）患者死亡预测的\
  \ EHR 应用项目来说展示它们的用处。我们还将基于 SAH 数据集比较这些机器学习方法的性能。\n\n## 10.2 机器学习方法\n\n### 随机森林\n\
  \n为了理解随机森林，我们需要从定义决策树的概念开始。简而言之，决策树是一种利用分支树状图的决策工具。令 `S` 为包含 `n` 个样本 `(x[1], y[1]),\
  \ …, (x[n], y[n])` 的训练集，其中 `x[i]` ∈ `X` 是输入实例，`y[i]` ∈ `Y` 是与每个 `x[i]` 相关的类别标签。决策树是一个分类器\
  \ `h: X → Y`，它通过在树结构上做出系列决策来预测 `x` 的标签 `y`。一个典型的决策树从根节点开始，算法随后根据训练集中所有属性的多数票决结果为该节点分配一个标签。当我们从根节点移动到叶子节点时，必须执行一系列测试。对于每个测试，我们检查分裂单个分支节点的影响。熵（或增益）用于帮助算法找到最适合分裂的数值或类别特征。然后算法查看与每次分裂产生的增益相关的改进；在所有可能的分裂中，我们选择增益最大的那一个，或者如果进一步分裂没有导致增益增加，我们就停止。如果达到预设的树的最大深度，该过程也可以结束。\n\
  \n一个简单决策树的示例所示图 10.1。典型的决策树从根节点开始，算法随后根据训练集中所有属性的多数票决结果为该节点分配一个标签。当我们从节点节点移动到叶子节点时，必须执行一系列测试。对于每个测试，我们检查分裂单个分支节点的影响。熵（或增益）用于帮助算法找到最适合分裂的数值或类别特征。然后算法查看与每次分裂产生的增益相关的改进；在所有可能的分裂中，我们选择增益最大的那一个，或者如果进一步分裂没有导致增益增加，我们就停止。如果达到预设的树的最大深度，该过程也可以结束。\n\
  \n\n\n极端随机树（ERT）由 Geurts, Ernst and Wehenkel (2006) 对于 ERT 算法，每次划分都是随机选择的，而在随机森林方法中，每次划分都是最优的。因此，在\
  \ ER 中构建的树更具多样性。ii) ERT 中的每棵树都是使用整个学习样本构建的，而在随机森林中，每棵决策树都是通过自助采样（bootstrapped）学习样本构建的。\n\
  \n单棵树的方差可能很高，使用集成方法可以减少这种方差。在这些集成方法中，袋法（bagging）引入的方差减少小于随机森林和 ERT，因为平均高度相关树（如袋法方法所示）比平均不相关树的方差减少效果要小。ERT\
  \ 倾向于以增加偏差（bias）为代价大幅减少方差。在实践中，人们需要在方差和偏差之间找到最佳平衡，这被称为偏差与方差权衡（bias and variance\
  \ trade-off）。过拟合是决策树模型的常见问题，尤其是当树具有许多层时。为了解决这个问题，推荐的方法是使用本节随机森林部分之前描述的袋法。\n\n###\
  \ 梯度提升 (Gradient Boosting)\n\n什么是提升？简单来说，它是一种类似于袋法的基于委员会的程序。在袋法中，我们计算自助采样所有预测的平均值。因此，袋法是可以并行的。然而，提升是一种顺序方法，不能像袋法那样以并行并行（即上一次迭代的残差是当前迭代的输入）。它获取多个弱分类模型（通常是决策树）的输出，并将它们组合形成一个更强大的“委员会”。\n\
  \n在梯度提升中，我们分阶段地构建决策树集成，并使用函数梯度下降（FGD）过程来最小化损失。在 FGD 中，我们对树进行参数化，并通过沿着梯度下降算法建议的方向移动，每一步都减少残差损失节\
  \ Hastie, Tibshirani and Friedman 2009](#ch10.xhtml#ref10_8）]。\n\n在图 10.4 的伪代码中，可以看到通过插入不同的损失准则\
  \ `L(y, f(x))`，我们可以对梯度提升进行自定义实现。\n\n![图 10.4 梯度提升的伪代码，由 Hastie, Tibshirani, and\
  \ Friedman (2009) 修改。](img/fig10_4.jpg)\n\n**图 10.4**\n\n由 Hastie, Tibshirani, and\
  \ Friedman (2009) 修改的梯度提升伪代码。\n\n### XgBoost\n\n提升（Boosting）是一种非常流行且有效的机器学习方法，通常用作基准方法。记住，提升是一种集成方法，但它不是并行训练所有模型，而是以顺序方式构建模型，使得新模型的构建是为了纠正前一个模型所犯的错误。\n\
  \n在进入细节之前，有必要指出梯度树提升等同于梯度提升机（GBM）或梯度提升回归树（GBRT），而 XGBoost 是极端梯度提升的别名。XGBoost 是由陈天奇在一个作为分布式（深度）机器学习社区（DMLC）小组一部分的研究项目中提出的\
  \ (Chen et al. 2015]。提升算法的训练时间可能非常慢，因为需要顺序地训练和构建模型；因此，此类方法不易扩展。因此，XGBoost 同时关注执行速度和模型性能。XGBoost\
  \ 可以针对甚至无法放入可用内存的大型数据集进行并行树构建和核心外计算。技术上讲，XGBoost 是一种正则化方法，因此它可以控制过拟合并可能有更好的性能。此外，XGBoost\
  \ 引入了一种新的稀疏感知算法，以最优方式从数据中学习以处理缺失值，并统一处理不同类型的稀疏模式（例如由于缺失值导致的稀疏、频繁的零条目或独热编码引起的伪影）。通过在正则梯度提升中引入许多吸引人的特征，XGBoost\
  \ 为许多数据科学问题提供了一种高效的并行树提升解决方案。\n\n### 支持向量机 (SVM)\n\nSVM 算法首次由 Vapnik (1995) 在“统计学习理论框架”论文引入。Cortes\
  \ and Vapnik (1995) 后将 SVM 用于二分类问题。此后，SVM 框架已显著扩展到各种问题，包括回归、排序和聚类。\n\n在许多机器学习任务中，随着特征空间维度的增加，我们经常面临样本复杂度问题。SVM\
  \ 算法通过寻找半空间划分器来解决样本复杂度问题。\n\n我们可以查看图 10.5，源自此处 中的简单示例，我们可以知道蓝色和红色超平面共同分离了绿色和黄色的示例数据点。我们将这些超平面线称为半空间划分器。\n\
  \n![图 10.5 SVM 的简单示例，由 Shalev-Shwartz and Ben-David (2014) 修改。](img/fig10_5.jpg)\n\
  \n**图 10.5**\n\n由 Shalev-Shwartz and Ben-David (2014) 修改的 SVM 简单示例。\n\n为了选择最优半空间，我们需要最大化两个簇的间隔。从上面的示例来看，我们更倾向于蓝色超平面，因为蓝色线具有更大的间隔，这意味着更好的分离。间距被定义为训练集中点与超平面之间的最小距离。\n\
  \n硬 SVM 是一种遍历训练集以寻找并返回最大间隔半空间（最佳分离预定义类别训练集的超平面）的学习算法。硬 SVM 的伪代码在图 10.6 中描述。\n\n\
  直观地说，`w` 是间距，`b` 是偏差，硬 SVM 在所有分离数据的向量中搜索范数最小的 `w`，对于所有 `i`，`|⟨w,x[i]⟩+b| ≥ 1`。由此，硬\
  \ SVM 的输出确实是具有最大间隔的分类平面。换句话说，寻找最大间隔半空间变成了寻找范数最小的 `w` 的问题。\n\n硬 SVM 公式要求训练集是线性可分的严格条件，这在现实世界数据中通常并非如此。当训练集同质但不可线性分离时，软\
  \ SVM 更加合适。\n\n\n\n\n\n如 Shalev-Shwartz, and Ben-David (2014) 所述，图 10.6](#ch10.xhtml#fig10_6)中方程\
  \ (10.1) 的优化函数强制要求所有 `i` 满足硬约束 `y``i``℄≥℄1。为了解决这个问题，软-SVM 允许在训练集中的某些数据点上放宽该约束。这可以通过引入非负松弛变量\
  \ `ξ`[`i`]`w`**i**t**h*` `i`℄=℄1,ↆ…,ↆ`m` 来建模，该变量衡量了约束 `y``i``℄≥℄1 被违反的程度。然后，算法通过如图\
  \ 10.7 中函数 (10.2) 所示，将每个约束 `y``i``℄≥℄1 替换为 `y``i``℄≥℄1 − `ξ`[`i`]`。软-SVM 同时最小化 `w`\
  \ 的范数（边缘间隔）和 `ξ`[`i*]` 的平均值（约束的违反情况）。参数 `λ` 控制这两个项之间的权衡。软-SVM 的伪代码如图 10.7 所示。\n\n\
  ![图 10.6 基于 Shalev-Shwartz and Ben-David (2014) 修改的硬 SVM 伪代码。](img/fig10_6.jpg)\n\
  \n**图 10.6**\n\n基于 Shalev-Shwartz and Ben-David (2014) 修改的硬 SVM 伪代码。\n\n![图 10.7\
  \ 基于 Shalev-Shwartz and Ben-David (2014) 修改的软 SVM 伪代码。](img/fig10_7.jpg)\n\n**图\
  \ 10.7**\n\n基于 Shalev-Shwartz and Ben-David (2014) 修改的软 SVM 伪代码。\n\n我们看到软-SVM 算法对图\
  \ 10.7 中的方程 (10.2) 使用了正则化损失最小化，以便它不仅能够惩罚训练误差。因此，软-SVM 通常用于处理齐次半半空间。更多细节，请参阅 Shalev-Shwartz\
  \ and Ben-David (2014)。\n\n对于非线性和不可分的数据，我们需要使用核函数技巧（Kernel trick）来帮助 SVM 构建非线性边界。核函数技巧是如何工作的？首先，将原始数据通过非线性映射形成高维空间中的新数据。然后，我们对进行非线性映射后的数据执行函数以取其点积。该函数就是核函数（Jakkula\
  \ 2011）。不同的 SVM 算法使用不同类型的核函数，如`linear, nonlinear, sigmoid, polynomial, and radial\
  \ basis function (RBF).`。最流行的是 RBF，因为它在整个 x 轴上实现了局部化并限制了响应。（Hill and Lewicki 2006）。\n\
  \n![image](img/fig10_1)\n\n## 10.3 机器学习工具\n\n对于非线性和不可分的数据，我们需要使用核函数技巧来帮助 SVM 构建非线性边界。核函数技巧是如何工作的？首先，将原始数据通过非线性映射形成高维空间中的新数据。然后，我们对进行非线性映射后的数据执行函数以取其点积。该函数就是核函数（Jakkula\
  \ 2011）。不同的 SVM 算法使用不同类型的核函数，如`linear, nonlinear, sigmoid, polynomial, and radial\
  \ basis function (RBF).`。最流行的是 RBF，因为它在整个 x 轴上实现了局部化并限制了响应。（Hill and Lewicki 2006）。\n\
  \n![image](img/fig10_1)\n\n## 10.3 机器学习工具\n\n对于非线性和不可分的数据，我们需要使用核函数技巧来帮助 SVM 构建非线性边界。核函数技巧是如何工作的？首先，将原始数据通过非线性映射形成高维空间中的新数据。然后，我们对进行非线性映射后的数据执行函数以取其点积。该函数就是核函数（Jakkula\
  \ 2011）。不同的 SVM 算法使用不同类型的核函数，如`linear, nonlinear, sigmoid, polynomial, and radial\
  \ basis function (RBF).`。最流行的是 RBF，因为它在整个 x 轴上实现了局部化并限制了响应。（Hill and Lewicki 2006）。\n\
  \n### H2O\n\nH2O 是一个 Python 的开源 AutoML 软件包，基于 scikit-learn 库构建。H2O 的目标是自动化机器学习流水线的设计和实现，使用随机优化过程使机器学习对非专家更友好、更易获取。\n\
