  \ 训练生成对抗网络的改进技术。*Statistics in Medicine* **19**, 1006–1008.\n\n## 7.1 引言\n\n###\
  \ 7.1.1 为什么需要因果推断\n\n电子健康记录（EHR）是人口统计学信息、药物、程序和实验室检查的重要来源。无偏估计的金标准是随机对照试验（RCT）。然而，取决于临床环境，RCT\
  \ 通常是昂贵且耗时的，甚至是不可行的或违反伦的。RCT 的替代方案是将因果推断应用于 EHR。\n\nEHR 数据面临独特的挑战。为了无偏推理而整合 EHR\
  \ 数据既是挑战也是重点。在本章中，我们将首先介绍几种常用方法：倾向评分法、工具变量和中介分析。然后，我们将介绍深度学习方法，如生成对抗网络。随后，介绍一种特别适用于大数据的现代因果推断——目标最小损失。\n\
  \n### 7.1.2 因果推断方法概述：Rubin 模型\n\n从观测数据推断治疗效应的主流通用框架是潜在结果框架，其中每个个体都有一组潜在结果（Rubin\
  \ 1978, Ray and Szabó 2019）。RCM 也称为尼曼-鲁宾因果反事实框架，该框架最初由 Neyman (1923) 和 Rubin (1974)\
  \ 创建。Rubin 因果模型的核心思想是潜在结果概念（Shadish, Cook and Campbell 2002）。个体仅观察与其分配治疗相对应的潜在结果，这被称为事实结果。其他潜在结果是缺失且未观测的；这些未观测的潜在结果被称为反事实结果或反事实。例如，在分析收缩压对\
  \ SAH 患者死亡的影响时，我们想知道患者在接受治疗（收缩压）时的潜在结果与未接受治疗时的潜在结果之间的差异。因果效应定义为这两个潜在结果之间的差异。反事实框架的关键假设是目标人群中的每个个体在每个治疗状态下都有潜在结果。现实中，一个人只能观察一种治疗状态下的一个潜在结果，因为患者只能被分配到治疗组或对照组。在这个框架内，估计问题本质上变成了缺失数据问题，其中估计治疗效应需要妥善插补反事实（Ding\
  \ and Li 2018）。\n\n\n\n\n\n在这一反事实范式下，已经开发了大量的统计方法用于因果推断。估计反事实的一种常用方法是简单的根据底层风险因素对患者进行匹配，这是一种通过从匹配受试者中借用信息来近似归补反事实的系统方法（Paul\
  \ Rosenbaum and Rubin 1983, Luo and Zhu 2019）。已开发的匹配方法包括马哈拉宾斯距离匹配、倾向性评分匹配 (Rosenbaum\
  \ and Rubin 1985)）、全匹配 (Rosenbaum 1991)）、遗传匹配 (Diamond and Sekhon 2013)以及深度工具变量网络\
  \ (Hartford et al. 2017)）。\n\n### 7.1.3 因果关系的基本框架：潜在结果框架\n\n在电子健康记录（EHR）数据库中，治疗的比较通常比简单的两组比较更复杂。例如，在比较给给的药物时，可能会给予多种药物，剂量各异，并有各种类型的结局来评估这些治疗的有效性或安全性。我们引入了一个通用框架，允许考虑多种治疗方案、离散和连续治疗，以及二元和连续结局\
  \ (Ge et al. 2020)。考虑 `K` 种治疗。让 `W[i]` = `[W[i]¹,...,.,W[i]^(K)]^(T)` 为 `i^(th)`\
  \ 个体的治疗分配向量，其中 `W[i^(k)` = 1 表示 `i^(th)` 个体接受了第 `k^(th)` 种治疗，而 `W[i^(k)` = 0 表示\
  \ `i^(th)` 个体没有接受第 `k^(th)` 种治疗。我们假设向量 `W[i]` 精好有一个非零分量，其索引为 `η`，即 `W[i^(η)` = 1。因此，我们有\
  \ $\\sum_{k = 1}^{K}{W_{i}^{k} = 1}$。定义治疗向量 `T[i]` = `[T[i]¹,…,*T[i]^(K)]^(T)`，其中\
  \ `T[i^(k)` 是 `i^(th)` 个体接受的第 `k^(th)` 种治疗变量。它可以是二元的、分类的或连续的。只有 `T[i^(η)]` 是给定的，治疗向量\
  \ `T[i]` 的其他分可以是任意的。让 $\\overline{Y}_{i} = [\\overline{Y}_{i}^{1},\\ldots,\\overline{Y}_{i}^{K}]^{T}$\
  \ 为 `i^(th)` 个体的潜在结果向量，其中 $\\overline{Y}_{i}^{k}$ 是如果 `i^(th)` 个体接受第 `k^(th)` 种治疗时的潜在结果。我们只能观测潜在结果向量\
  \ $\\overline{Y}_{i}$ 中对应于分配治疗 `W[i^(η)]` 的分量，这被称为事实结局并记为 $\\overline{Y}_{i}^{f}$，其中\
  \ `f` = `η`。其他未观测到的潜在结果被称为反事实结局，或简单的反事实，记为 $\\overline{Y}_{cf}$。事实结局 $\\overline{Y}_{i}^{f}$\
  \ 可以表示为 $\\overline{Y}_{i}^{f} = \\sum_{k = 1}^{K}{W_{i}^{k}\\overline{Y}^{k}}$。\n\
  \n例如，如果 $W_{i} = \\begin{bmatrix} 0 \\\\ 1 \\\\ \\end{bmatrix}$，那么 `η` = 2 且 $\\\
  overline{Y}_{i} = \\begin{bmatrix} \\overline{Y}_{cf} \\\\ \\overline{Y}_{f} \\\\\
  \ \\overline{Y}_{cf} \\end{bmatrix}$。每个个体与 `K` 个潜在结果 $\\overline{Y}_{i}^{k}$ 相关，但只有一个是可以观测的\
  \ $\\overline{Y}_{f}$。我们假设一个 `p` 协变量向量 `X[i]` = $[x1],…x[ip]^{T}$ 与 `i^(th)` 个体相关，包括患者人口学和临床变量。假设\
  \ `n` 个个体。\n\n我们做出以下假设 (Rubin 1980, Rosenbaum and Rubin 1983)：\n- **假设 1**: 对于所有\
  \ `X` 和所有 `k`，有 $P(W_{i}^{k}=1|X) > 0$。\n- **假设 2**: 无混杂性。给定 `X`，潜在结果 $\\overline{Y}$\
  \ 是独立的。\n- **假设 3**: 稳定单位值假设 (SUTVA)。个体间没有干扰。\n\n#### 平均治疗效应与个体效应\n\n对于多种治疗，最常用的治疗效应衡量是个体效应\
  \ $\\xi^{(i)} = \\overline{Y}^{j} - \\overline{Y}^{k}$，平均治疗效应 (ATE) 定义为 $\\tau =\
  \ E[\\xi^{(i)}|T]$。本章的重点是给定 `X` 的治疗效应条件分布。假设 `n` 个个体。\n\n## 7.2 倾向评分\n\n### 7.2.1\
  \ 简介\n\n倾向性评分方法是最常用的因果推断方法之一。倾向性评分通过创建与观测到的混杂因素相似但在接受治疗或暴露方面不同的比较组，试图消除分析非随机观察性研究时产生的偏差\
  \ (Yanovitzky, Zanutto, and Hornik 2005)。它涉及两个步骤：步骤 1) 拟合倾向模型以估计治疗概率以获得平衡评分；步骤 2)\
  \ 使用平衡评分调整偏差以获得因果推断。调整方法包括结果模型中的分层、匹配和逆概率加权 (IPW)，每种方法都有充分研究的优点和局限性 (Austin and\
  \ Stuart 2015)。\n\n![image](img/inline1_1.jpg)\n\n\n\n\n\n源自 EHR（电子健康记录）比较有效性研究的治疗可能是二元的、序数的或命名的（即互斥的）。针对\
  \ EHR 生成的研究调整倾向评分，需要解释针对多种治疗的现有方法（Imai and Van Dyk 2004, Brown et al. 2020, Fong,\
  \ Hazlettand, and Imai 2018)）、高维混杂因素以及现有文献中显示出前景的机器学习适配方法（Mccaffrey et al. 2013,\
  \ Burgette, Griffin, and Mccaffrey 2020, Ju et al. 2019, Brown et al. 2020)）。\n\n\
  ### 7.2.2 二元治疗的倾向评分\n\n对于二元治疗，倾向评分（或平衡评分）可以通过逻辑回归、Probit 回归（Rosenbaum and Rubin\
  \ 1983）或最近的机器学习算法，如随机森林、神经网络和广义梯度提升法（GBM）（McCaffrey, Ridgeway, and Morral 2004,\
  \ Setoguchi et al. 2008, Mccaffrey et al. 2013)）进行估计。生成的倾向评分随后用于调整协变量不平衡（Imbens\
  \ 2000）。这使得能够在步骤 2 中，对我们感兴趣的两个因果估计量进行估计（此处针对 K 多种治疗的情况给出）。\n\n治疗组的平均治疗效应（ATT），`ATT`[`k`|`k``��*``k`^′′] = `E`(`Y``i`) − `Y``i`|`Y`[`i]`=`k``]，是指接受治疗\
  \ `k` 的人群在治疗 `k` 与 `k^′` 之间的预期结果。McCaffrey 等人 (2013) 与 ATE 不同，ATT 区分了人群中谁是参考组 (`k`)）。存在\
  \ (`K`/2) 种 ATE 和 `K!` 种 ATT。\n\n### 7.2.3 多种治疗的倾向评分\n\n在治疗对疾病结局影响的研究中，通常会对多种治疗感兴趣，因此应用多种治疗倾向评分方法将是\
  \ EHR 数据的常态。多种治疗倾向评分比上述的二元情况更复杂。事实上，与二元设定相比，目前还没有提出一种通用的标量平衡评分来捕捉所有 K 治疗中反事实与平衡混杂因素之间的复杂关系，而这是产生上述定义的\
  \ ATE/ATT 所要求的。这是因为任何多种治疗倾向模型都会产生一个向量（而非标量）的“广义倾向评分”（GPS），即 `${\\widehat{\\mathbf{P}}}\\\
  _{\\mathbf{i},\\mathbf{GPS}} = {({{\\widehat{p}}\\_{i,1},\\ldots,{\\widehat{p}}\\\
  _{i,K}})}`，这可能源于多项回归或机器学习模型，例如，`$\\mathit{\\log}{\\lbrack{P\\frac{Z\\_{i} = \\mathit{k|}X\\\
  _{i} = x\\_{i}}{Z\\_{i} = k^{\\prime}|X\\_{i} = x\\_{i}}}\\\\rbrack}$`= `θ`[`k]` + `β`[`k]`，其中左侧是治疗分配\
  \ `k` 对协变量 `X` 的回归，`θ`[`k]` 是常数，而 `β`[`k]` 是向量（Joffe and Rosenbaum 1999, Rassen\
  \ et al. 2013, Tu, Jiao, and Koh 2013, Seya and Yoshida 2017, Lopez and Gutman 2017,\
  \ Imbens 2000, Imai and Van Dyk 2004)）。每个 GPS 元素都是接受治疗 `k` 的条件概率。虽然在步骤 2 中将 GPS\
  \ 向量还原为标量尚属偶然且研究不足，但最近的工作已使用距离量和聚类工具对 GPS 进行分层或匹配。例如，一旦在步骤 1 获取了 GPS，就可以最小化马哈拉斯多变量距离（Imbens\
  \ 2000, Imai and Van Dyk 2004)），进行“三组”距离（针对 K=3），或使用聚类技术将相似的 GPS 分组（Tu, Jiao, and\
  \ Koh 2013, Lopez and Gutman 2017)）。这些调整方法基本上是二元设定的扩展，通常限于治疗的数量和允许的调整类型（例如支持匹配）。可重复研究也表明，基于距离的方法不适用于高维协变量向量（Gu\
  \ and Rosenbaum 1993, Stuart 2010)），而这在 EHR 中很常见。在估计 ATE 或 ATT 时，必须仔细选择应用那种方法——现有的距离/聚类方法是分别对每个治疗水平估计平均潜在结果，而不是构建平衡层或匹配对（Yang\
  \ et al. 2016)）。事实上，某些方法是专门为 ATT 设计的，这可能是某个特定 EHR 比较有效性研究感兴趣的量（因为 ATT 仅适用于参考组中的受试者）。最后，某些方法在计算上不可行的（Huang\
  \ et al. 2005, Tu, Jiao, and Koh 2013)），仅适用于某些结局类型，可能无法产生良好的平衡评分，且当 K > 3 时无效（Harder,\
  \ Stuart, and Anthony 2010, Fong, Hazlettand, and Imai 2018)）。\n\n#### 7.2.4 序数治疗的倾向评分\n\
  \n\n\n\n\n序数倾向性评分（Ordinal propensity scoring）是上述描述的多重治疗倾向性评分的一种特殊实例，这种方法可能出现在电子健康记录（EHR）数据中。例如，人们可能对第二代选择性\
  \ 5 羟色胺再摄取抑制剂（SSRI）的剂量对抑郁症状缓解的影响，或者他汀类药物剂量对预防心力衰竭、其他心血管结局或死亡的影响。显然，序数倾向性评分的方法将不同于多重治疗的情况；例如，它们可能会利用自然的底层治疗结构，如治疗与协变量之间的剂量-反应关系。在序数倾向性评分中，挑战同时出现在\
  \ `Step 1.` 选择合适的倾向性模型以及 `Step 2.` 调整平衡性/倾向性评分以获得平均处理效应（ATEs）。虽然来自多项处理的 GPS 方法在此处适用（Imbens\
  \ 2000, Imai and Van Dyk 2004），但研究人员通过利用治疗/协变量之间关系的序数性质，可以提高因果估计的效率。比例优势（PO）回归模型是二分类逻辑回归在序数结果方面的重要扩展，是实现这一目标最明显的方法——它可以用于为给定的协变量向量\
  \ `X[i]` 生成一个标量平衡评分，即线性预测值 $\\mathbf{X}_{i}\\widehat{\\mathbf{\\beta}}$，患者可以基于此值进行匹配或分层（B.\
  \ Lu et al. 2001, Zanutto, Lu, and Hornik 2005, Greene et al. 2017）。在 `Step 2.`\
  \ 中，人们可以根据此平衡评分的值以及观测到的（实际）治疗水平的值应用非二分匹配（B. Lu et al. 2001）。这种马哈拉诺斯（Mahalonobis-type）度量有助于匹配接受了不同水平序数治疗的患者。如果倾向性模型中的每个变量都符合\
  \ PO 假设，从而能产生“良好”的平衡评分，那么 `X[i]β̂` 将是标量平衡评分的极佳降维度。然而，考虑到当代统计分析中相关的噪声大数据挑战，严格的参数化倾向性模型用处较小（McCaffrey,\
  \ Ridgeway, and Morral 2004, Mccaffrey et al. 2013）。相比之下，机器学习倾向性模型是很有用的替代方案（如 Burgette,\
  \ Griffin, and Mccaffrey 2020, Ju et al. 2019, Wyss et al. 2018, Mccaffrey et al.\
  \ 2013, Greene et al. 2020），因为它们能够适应高维协变量空间、多阶项，并在 `Step 1.` 中纳入了一些隐式交互。因此，`Step\
  \ 2.` 中的倾向性评分调整方法必须经过改进以便与 `Step 1` 中拟合的机器学习倾向性模型无缝使用，以促进大数据因果分析。在许多且复杂的协变量空间背景下，针对序数治疗的调整方法仍在开发中。\n\
  \n### 7.2.5 复杂数据集的倾向性评分估计\n\n源自 EHR 数据的研究可能会产生“复杂的”混杂因素-治疗关联，例如，高维协变量空间、交互作用、高阶和非线性项可能同时作用于治疗分配以及结果。倾向性评分估计的非参数机器学习方法类，包括集成方法、随机森林、递归划分和神经网（如\
  \ Setoguchi et al. 2008, Li and Stuart 2018, McCaffrey, Ridgeway, and Morral 2004,\
  \ Mccaffrey et al. 2013, Ju et al. 2019），对于此类数据的分析都是有用的，并且在多维设置中应考虑应用。特别是，GBM 最近被应用于多项处理设置，以捕捉参数模型无法捕捉的复杂治疗/协变量关联（Burgette,\
  \ Griffin, and Mccaffrey 2020](#ch07.xhtml#ref7_9), Brown et al. 2020）。该软件还产生了用于评估倾向性评分所需的诊断结果。在\
  \ `Step 1` 中使用哪种机器学习方法（例如集成方法、随机森林或神经网）通常不是重点，因为模型选择和过度参数化在倾向评分中问题并不严重。因此，人们广泛接受，这些能够自动纳入变量的方法在多维研究中至少能产生等效的倾向性评分。机器学习倾向性模型通常与\
  \ `Step 2` 中的 IPW 结合（Imai and Ratkovic 2013](#ch07.xhtml#ref7_30), Brown et al.\
  \ 2020, Mccaffrey et al. 2013, Ju et al. 2019），因为 IPW 对倾向性模型的误设定最为敏感。然而，一些研究表明，当倾向性模型（以及结果模型）可能被误设定时，会导致\
  \ ATE 估计偏差（Rubin 2004; Stuart 2010, Imai and Ratkovic 2013, Greene et al. 2020）。此外，匹配和分层对误设定不那么敏感，而且当数据库中有大量的对照治疗时（这对于\
  \ EHR 研究通常是如此），前者可能是更有有用的调整方法。\n\n### 7.2.6 示例说明：蛛网膜下出血（SAH）项目\n\n\n\n\n\n我们介绍了一项基于\
  \ Cerner Health Facts 数据库的研究，该研究确定了血管收缩剂与非创伤性和创伤性动脉瘤蛛网膜下出血（SAH）患者死亡率之间的关联。该研究人群此前已有描述（Williams\
  \ et al. 2020）。简而言之，查询了 2000 年至 2015 年 Cerner Health Facts EHR 数据库，筛选出根据 ICD-9 代码\
  \ `430` 新诊断为动脉瘤性 SAH 的成年患者（17 岁以上）。仅接受过`多巴胺`、`苯乙肾上`或`去甲肾上腺素`输水的患者被纳入研究人群（Williams\
  \ et al. 2020）。在符合上述入组标准的 4850 名患者中，有 40 名患者出现了多次首次血管收缩剂治疗，因此被排除在队列之外。此外，诊断包含创伤性\
  \ SAH 原因（基于 ICD 9 代码：`800.2x`、`800.7x`、`801.2x`、`801.7x`、`803.2x`、`803.7x`、`804.2x`、`804.7x`、`852.x`）或死亡状态未知的患者也被排除在研究人群之外，最终队列剩余\
  \ 2634 名患者。\n\n此处介绍的倾向评分分析包含 2417 名具有人口统计学变量（年龄、性别、种族和婚姻状况）完整数据以及 170 个治疗前药物变量的患者。在纳入分析的患者中，分别有\
  \ 492、1253 和 672 名患者接受了`多巴胺`、`苯乙肾上`和`去甲肾上腺素`。所有人口统计学变量和治疗前变量均已输入 `GBM` 模型。关于变量选择以及倾向模型中包含的精确变量的更多细节，可以参考之前的研究（Williams\
  \ et al. 2020, Brown et al. 2020）。\n\n由于所有患者均符合三种治疗的条件，`ATE`（平均处理效应）是我们感兴趣的估计量。首先，应用\
  \ `IPW` 后实现的协变量平衡的视觉表示如图图 7.1 所示。标准化均差（`SMD`）是比较匹配样本中受试者相似性的指标（Austin 2011）。在每个比较组中（例如`多巴胺`\
  \ 对比 `苯乙肾上腺`），可以为每个协变量计算 `SMD`。左图显示了每个潜在治疗前混杂因素的最大成对 `SMD`。同样，右图显示了平均成对 `SMD`，它是通过对跨治疗对的每个潜在治疗前混杂因素的\
  \ `SMD` 取平均值计算得。文献表明，平均 `SMD` 小 0.2 表示协变量不平衡水平较低（Mccaffrey et al. 2013）。基于这一截断值，大多数协变量均达到了合理的平衡（图\
  \ 7.1）。\n\n![图 7.1 在未加权和加权数据中通过标准化均差（SMD）衡量的协变量平衡的图表表示。在两幅图中，通过逆概率加权实现的平衡明显优于原始未加权数据。](img/fig7_1.jpg)\n\
