  \n# 用于研究的 EHR 数据：未来\n\nHulin Wu\n\n### ![image](img/inline1_1.jpg)\n\n### 11.1 未来\
  \ EHR 研究\n\n在之前的章节中，我们关注了用于研究和科学发现的结构化 EHR 数据的方法和方案。然而，如果能将非结构化 EHR 数据（如临床笔记、病理图像和来自医疗设备的高频数据\
  \ `EEG`、`ECG` 等）与结构化数据整合进行分析，将将会更加强大。通常情况下，非结构化数据更难获取，因为不容易进行去匿名化。此外，由于其复杂性和海量，非结构化数据的分析也更具挑战性。\n\
  \nEHR 研究的另一个趋势是将来自不同来源的其他类型数据与 EHR 数据整合，以改进疾病风险预测、诊断和患者护理质量。其他类型的数据可能包括基因组数据、来自可穿戴设备的实时监测数据、来自人口普查、人口或社区研究的健康社会决定因素\
  \ (`SDoH`)、公共或政府数据库，以及来自其他研究项目（包括实验室实验、观察性研究和临床试验）的数据。由于这些数据来自不同的来源，将它们与 EHR 数据进行整合或标准化具有挑战性。这些其他类型的数据通常仅适用于\
  \ EHR 系统中的部分患者，在分析过程中可能也需要考虑选择偏倚。理想情况下，如果来自其他来源的任何数据都能帮助患者护理的临床决策，就应该使用并整合这些数据，并开发临床决策支持\
  \ (`CDS`）系统以改进患者管理。这将使得研究结果能够快速转化为医疗保健实践。\n\n英国生物样本库 (`https://www.ukbiobank.ac.uk/`)\
  \ 是一个大型且开放访问的匿名化数据库，能够整合来自 50 万名志愿者（于 2006-2010 年间在英国招募）的健康结果（包括来自初级保健、医院住院患者、死亡登记和癌症登记的\
  \ EHR 数据），以及基因组、影像、生物学、身体活动、认知、行为和心理健康、24 小时饮食回顾和环境数据。这个能够将 EHR 数据与其他类型数据合并的大型数据库为研究人员整合异构数据进行生物医学和健康科学研究提供了极资源资源。然而，这个队列也有其局限性。特别是英国生物样本库研究并非旨在代表总体，且随访稀少。为了通过研究改善医疗保健，美国国立卫生研究院\
  \ (`NIH`) 最近启动了一项类似的研究计划，“All of Us”计划 (`https://allofus.nih.gov/`)，旨在招募一百万参与者并收集上述许多数据类型。然而，这些数据可能在未来几年后才可用于分析。\n\
  \n\n\n\n患者隐私和数据安全是利用电子健康记录（EHR）数据进行研究和科学发现面临的主要挑战。为了解决这一重要问题，除了开发高效可靠的数据去标识方法和手段外，利用模拟技术生成合成\
  \ EHR 数据有助于确保数据隐私并防止数据安全问题。虽然要基于合成 EHR 数据来证明科学发现并非易事，但模拟方法对于培训、教育、EHR 方法论测试，以及模拟和研究新医疗政策及干预策略非常有用。工业界与学术界合作伙伴已经合作提出并开发了\
  \ EHR 模拟系统。\n\n早期的电子病记录（EMR）模拟使用真实的 EMR 数据来识别患者护理模型或模式，并生成患者身份和基本信息，从而合成完整的 EMR\
  \ 数据 (Moniz et al. 2009, Buczak, Babin, and Moniz 2010)）。另一个名为“Synthea”的模拟 EHR 数据系统是利用公共数据开发的\
  \ (McLachlan, Dube, and Gallagher 2016, Walonoski et al. 2018)，例如来自美国人口普查局的人口统计数据、来自疾病控制与预防中心的疾病患病率和发病率、健康发生统计、NIH\
  \ 报告、临床实践指南（CPGs）和方案以及医学编码字典。Synthea 的开发没有使用真实的 EHR 数据。该系统可以用于模拟合成患者的整个寿命，但它可能无法反映\
  \ EMR 或 EHR 系统中的患者记录。最近，生成对抗网络（GAN）被提出用于合成 EHR 数据 (Choi et al. 2017, Baowaly et\
  \ al. 2019)；然而，该模型并非用于生成不规则且多的原始 EHR 数据，而是用于生成一个模拟源自 EHR 数据库变量和因素的规则数据矩阵。一个显而易见的挑战是如何评估模拟\
  \ EHR 数据库的好坏，因为目前还没有量化标准或评估方法来定义一个“良好的”合成 EHR 数据集。为此，可能需要针对不同的目的开发不同的 EHR 模拟系统。通常情况下，一个良好的合成\
  \ EHR 数据集应该是真实的且适用于实现目标目标的，尽管评估模拟 EHR 数据的质量非常困难。\n\nEHR 数据共享的方法之一是使用由观察健康数据科学与信息学（OHDSI）组织开发的观察医疗结果伙伴关系（OMOP）共同数据模型（CDM）([`www.ohdsi.org/`](https://www.ohdsi.org))。这种方法背后的思想是将来自不同\
  \ EHR 数据库的数据转换为通用格式（数据模型）以及通用表示（术语、词汇、编码方案），并利用基于通用格式开发的标准分析程序库，系统地派生并执行汇总统计和分析。这些来自不同\
  \ EHR 数据库的汇总统计和分析结果可以在不共享个体层面原始原始数据的情况下共享，从而避免患者隐私和数据安全问题。然而，该方法的一个挑战在于高效整合来自不同\
  \ EHR 数据库的汇总统计和分析结果并非易事，为此可能需要开发新的统计方法。一种方法包括了分布式统计推理和分析方法 (Zhang, Duchi, and Wainwright\
  \ 2013, Chen and Xie 2014, Neiswanger, Wang, and Xing 2013, Lee et al. 2015, Wang\
  \ and Dunson 2013, Battey et al. 2018, Jordan, Lee, and Yang 2019, Fan et al. 2019)，这些方法利用分布式计算和分治策略来处理上述大数据分析挑战。这些方法可以进一步改进，以结合和整合来自不同\
  \ EHR 数据库的分析结果以进行有效的统计推理，这是未来研究的推荐方向。\n\n尖端的人智能（AI）技术近期在解决医疗问题方面发挥了重要作用。例如，AI 技术已用于支持疾病诊断、识别疾病风险因素、预测治疗结果、推荐治疗、患者参与以及医疗管理\
  \ (Davenport and Kalakota 2019)。在某些任务中，AI 的表现与人类相当甚至优于人类。用于医疗的大多数 AI 技术都是统计方法、传统的机器学习方法以及我们在本书前面的章节中讨论的新深度学习技术。这些基于统计的机器学习或\
  \ AI 技术利用现有的 EHR 和其他相关医疗数据来训练或拟合预测或分类模型，以识别疾病的风险因素或最佳方案，使疾病诊断更高效并改善治疗结果 (Rajkomar\
  \ et al. 2018, Shimapukuro et al. 2017)。特别是，深度学习方法已被证明在通过医学图像识别模式方面优于人类 (Fakoor\
  \ et al. 2013, Vial et al. 2018)。我们在书中讨论的其他 AI 技术包括传统的基于规则的临床专家系统和自然语言处理（NLP）技术。特别是，语义和基于统计或机器学习（包括深度学习）的\
  \ NLP 技术对于处理临床记录、临床实践指南（CPG）、医学文献和文档等非结构化 EHR 数据非常有用。NLP 仍然是一个活跃的研究领域 (Mehta and\
  \ Devarakonda 2018)。AI 技术还可以用于自动化 EHR 数据的提取、清洗、处理、准备和分析。此外，可以使用 NLP 技术自动生成分析报告。预计这将加速我们将\
  \ EHR 大数据的知识和医疗效益。由于许多实施障碍、伦理问题和监管问题，AI 技术在取代医生和护理人员之前还有很长的路要走。\n\n### ![image](img/inline1_1.jpg)\n\
  \n## 11.2 研究后实践\n\n\n\n\n\n## 1. 在可行的情况下，设计随机试验进行进一步的验证和确认\n随机对照试验 (`RCT`) 仍然是评估治疗、药物和其他干预措施效果的金标准。如果可行，理想情况下，从回顾性\
  \ EHR（电子健康记录）数据中得出的结果和结论应该通过设计良好的、随机且前瞻性的临床试验进行验证和确认。EHR 数据和数据分析结果可为 `RCTs` 的设计提供信息，并可能为此开发一些方法论。我们也认识到，由于伦理问题、患者招募困难和实施障碍等许多原因，有时进行临床试验是不实际或不可行的。\n\
  \n## 2. 设计并开发用于实施和实践的用户友好工具\n为了让临床医生和患者护理人员能够在临床实践中使用基于 EHR 数据的研究结果，并改善患者护理结果，有必要开发易于使用的工具或临床决策支持\
  \ (`CDS`) 系统，以实现临床实践中的分析、建模和预测算法。这可能还需要专业软件工具开发者的参与，以确保工具符合行业标准。\n\n## 3. 部署与实际使用\n\
  在开发软件工具或临床决策支持系统 (`CDS`) 之后，可能需要寻找一家医院或诊所，在实际环境中测试软件工具或 `CDS` 系统。\n\n## 4. 用户反馈与进一步评估\n\
  需要收集用户反馈和评估，以进一步改进软件工具或 `CDS` 系统的设计。可以根据用户的反馈修复任何错误或问题。如有必要，可以设计并进行正式的随机试验，以评估 `CDS`\
  \ 系统在临床结果方面的有效性。\n\n## 5. 迭代改进\n上述研究和研究后的实践程序可能需要迭代更新，以便在临床实践过程中进行持续改进。\n\n我们期望从\
  \ EHR 数据获得的结果和临床证据能够快速转化为对患者护理的有益影响。为了缩短从研究到临床实践的时间，需要研究人员、临床调查员、护理人员、行业伙伴和政府监管机构之间的密切合作。\n\
  \n### ![image](img/inline1_1.jpg)\n\n## 11.3 总结\n利用 EHR 数据进行研究和科学发现仍处于初期阶段。从隐私角度来看，提供科学研究数据非常有挑战性，且许多数据集成和统计方法论问题仍需解决。先进的数据科学方法、计算算法和\
  \ AI 技术对于利用和将 EHR 大数据转化为可获取的实践知识也是必要的。许多研究人员（包括本书的作者）正在积极开发这些前沿的方法新技术，以满足查询 EHR\
  \ 数据时的需求和挑战。\n\n### ![image](img/inline1_1.jpg)\n\n## References\n\nBaowaly, Mrinal\
