  \n# 8\n\n![image](img/inline1_1.jpg)\n\n# EHR 数据探索、分析与预测：统计模型与方法\n\nGen Frances\
  \ Stacia M. Vahed ZhuBritoDeSantisMaroufy\n\n### ![image](img/inline1_1.jpg)\n\n\
  ## 8.1 引言\n\n### 8.1.1 EHR 数据的统计挑战\n\n与从实验研究和临床试验获得的传统数据集不同，EHR 数据集具有规模巨大、混乱、稀疏、超高维以及高缺失率等特点。这些问题在统计数据分析和预测过程中往往挑战。然而，如果对数据集进行清洗和处理，标准的统计方法仍然适用且可行。此外，由于\
  \ EHR 数据集的超高维性和潜在的大样本量，复杂精密的统计方法在计算上几乎是无法实现的。因此，在本章中，我们将关注用于 EHR 数据分析的标准且计算上可行的统计模型，例如广线性模型、生存模型和线性混合效应模型。我们希望让读者相信，这些模型结合新颖高效的变量选择和降维方法，可以有效且精确地分析\
  \ EHR 数据。\n\n### 8.1.2 现有方法概述\n\n在数据提取、清洗和处理之后，建议通过探索性数据分析（EDA）进行数据探索和可视化，以选择最适合推理或预测的统计模型。在本节中，我们将简要介绍并回顾用于分析\
  \ EHR 数据的常用技术和方法。\n\n多种统计模型已 EHR 数据分析，但广线性模型（GLM）被证明更为高效有效，因为它们也是开发预测模型最常用的算法（Goldstein\
  \ et al. 2017）。GLM 是许多其他高级模型的基础，研究人员开发了系统理论和软件工具包，使得 GLM 的应用变得快速快捷。近期文献中有许多 GLM\
  \ 应用于 EHR 数据。例如，通过开发高维线性模型的新型假设检验，Cai, Cai, and Guo (2019)尝试根据给定患者的概况预测个体化治疗效应。Wu\
  \ et al. (2018)实现了逻辑回归和其他机器学习方法，探索与重度抑郁症（MDD）复发相关的风险因素。Backenroth et al. (2017)使用逻辑回归确定与高血压相关的药物。\n\
  \n另一方面，尽管 GLM 常用于 EHR 数据建模，但在遇到事件时间问题时，它们显得力从心且往往匮缺。此类分析的一个示例是：使用实验室结果和临床事件测量等纵向临床记录，预测蛛网膜下出血患者的院死亡时间。生存回归模型通常是建模此类数据集更好的选择（参见\
  \ Wu et al. 2019, Vinzamuri and Reddy 2013, Ranganath et al. 2015）。当然，需要考虑生存分析的几个重要组成部分，如事件时间、研究起点和删失类型。此外，标准的生存模型由于以下限制无法直接应用于数据分析（Ranganath\
  \ et al. 2016, Vinzamuri and Reddy 2013):\n\n- 协变量缺失\n- 研究起点的确定\n- 协变量与事件之间的关系假设为线性的\n\
  - 高维数据的结构稀疏性\n- 删失复杂性\n\n为了克服这些限制，一些研究开发了新的生存模型。例如，Dempsey and McCullagh (2018)和\
  \ Ranganath et al. 2016 都考虑从感兴趣的事件反向对齐，而不是从起始时间向前测量。Ranganath et al. 2016 还使用了过程指数族来处理缺失数据。Vinzamuri\
  \ and Reddy (2013)提出了一个新的正则化线性模型来解决高维数据的结构稀疏性。\n\nEHR 数据的另一个特点是数据格式的多样性。它包含了横面数据和纵向数据。对于传统的预测建模，忽略这些时间信息会导致模型偏差（Singh\
  \ et al. 2015）。因此，利用能够处理纵向数据的现有统计方法对 EHR 数据进行建模至关重要。在统计学中，方差分析（ANOVA）、广义估计方程（GEE）和混合效应模型常用于解决这个问题（H.\
  \ Goldstein et al. 1995）。然而，在处理复杂的缺失数据、不规则时间数据和重复测量相关性时，混合模型表现通常优于 ANOVA 或 GEE（Garcia\
  \ and Marder 2017）。此外，混合模型是医学研究中处理纵向数据最常用的技术。因此，我们将关注混合效应模型。尽管关于将其应用于 EHR 数据的文献较少，为了缓解高计算成本，一项模拟研究（Rhodes\
  \ et al. 2018）提供了不同的技术来提高在 EHR 数据上运行混合效应模型的效率。事件时间与纵向数据的联合模型也已应用于 EHR 数据（Gasparini\
  \ et al. 2020, Paige et al. 2018, Maziarz et al. 2017）。\n\n\n\n\n在处理纵向电子健康记录（EHR）数据时仍然存在一个问题：我们应该如何使用时间戳（事件时间和记录时间）？Hripcsak,\
  \ Albers, and Perotte (2011) 说明将时钟时间转换为序列时间是提高预测性能的好方法。为了表征并利用 EHR 中的时间变量，研究者提出了许多预处理和建模方法，包括时间序列构建、时间参数化、受试者归一化、时间变量差分，以及解释变量引入和回归模型(Levine,\
  \ Albers, and Hripcsak 2018)。在本章中，我们将专注于回归模型。在文献中，许多时间序列方法已应用于临床时间数据。Levine, Albers,\
  \ and Hripcsak (2016; 2018) 研究了如何利用滞后线性回归从实验室检查中检测药物的生理效应。Cheng et al. 2020, Pimentel\
  \ et al. (2013) 使用高斯过程模型来反映某些临床事件或实验室测量的时间模式。在下一节将回顾滞后回归模型和高斯过程。\n\n维数灾难是使用 EHR\
  \ 数据时的另一大挑战。包括诊断、临床事件、实验室检查和药物的数据集很容易包含数千个变量。这在预测建模和因果推理分析方面尤为引起关注。克服高维度带来的计算成本的策略之一是确定哪些显著因素与感兴趣的结果（响应变量）相关。然而，传统的变量选择方法对于超高维问题效果并不理想。Fan\
  \ and Lv (2007) 提出了一种双尺度变量选择框架——确定性独立性筛选（SIS），它由大规模筛选和中等规模的常用变量选择方法组成。这里的常用变量选择方法是指对系数带有不同类型惩罚项的回归模型。最小绝对收缩和选择算子（`LASSO`\
  \ (Tibshirani 1996)）和岭回归（(Hoerl and Kennard 1970)）是 EHR 预测分析中处理“大数据”最常用的惩罚回归模型(Zhang\
  \ and Hong 2017; Wu et al. 2017; Stein et al. 2019)。决定如何消除混杂变量的影响成为 EHR 因果推理的关键问题。例如，为了评估治疗效果，Shortreed\
  \ and Ertefaie (2017) 将变量选择方法与倾向评分匹配法结合以解决高维度问题。\n\n除了高维度外，EHR 数据集通常具有较大的样本量。这需要额外的计算能力和时间来拟合模型。复杂的统计模型如联合建模、非共轭贝叶斯方法以及需要数值似然极大化的统计模型通常过于复杂且数值计算速度缓慢。此外，这些模型中的大多数在针对\
  \ EHR 数据库查询的大型临床数据上在数值上是无法实现的(Chen and Xie 2014)。分治治法可能为将这些模型应用于大型 EHR 数据集提供解决方案。事实上，已经提出了许多新颖方法来处理规模问题。这些包括“分而治之”技术和子采样方法(Rhodes\
  \ et al. 2018)。然而，处理此类问题的文献有限，尽管最近提出了处理 EHR 数据的加权回归和元分析技术。\n\n此外，一旦模型拟合完成，评估结果是否受到数据不确定性的影响是\
  \ EHR 因果推理的关键。因此，敏感性分析和模型验证是必要的。\n\n## 8.2 数据探索与可视化\n\n探索性数据分析（EDA）是对数据的一种初步分析，有助于理解数据，并关注曲线下面积（AUC）和接收者特征（ROC）。通常情况下，EDA\
  \ 强调数据的图形化表示，这可以追溯到 Tukey (1977)。在现代时代，随着计算机的快速发展，研究人员可以使用不同的可视化工具来探索数据，这已成为一种哲学。许多软件可以帮助\
  \ EDA，例如 Tableau、Infogram、Datawrapper、R 语言中的 `ggplot2` 以及 Python 中的 `matplotlib`。大多数\
  \ EDA 技术利用直方图、密度图、箱线图、茎叶图和散点图。Grolemund (2016) 指出，EDA 是一个循环，由生成问题、可视化和转换数据以及进一步完善问题组成。\n\
  \n对于 EHR 数据，第 3 章中提到的汇总统计报告是 EDA 过程的基本输出。该报告是 EHR 特有的，总结了提取数据中的重要信息。尽管分析师可以从数据得出许多摘要，但报告中的项目被认为更具信息量，因为它们是根据我们的实验精炼的。例如，在研究\
  \ SAH 患者的显著药物时，我们发现仅对药物进行排名是不够的，因为 SAH 患者的药物频率可能与普通人群遵循相同的模式，如表 8.1（ch08.xhtml#table8_1）所示。\n\
  \n表 8.1 SAH 患者与 Cerner 通用人群药物频率排名\n\n| Cerner 通用人群药物 | SAH 患者药物 |\n| :--- | :---\
  \ |\n| Lvp 液 | Lvp 液 |\n| 奥司西琼 | 奥司西琼 |\n| 乙酰氨基 | 氯化钠 |\n| 氯化钠 | 乙酰氨基 |\n| 吗啡 |\
  \ 氯钾 |\n| 芬太尼 | 芬太尼 |\n| 利多卡因 | 普萘洛 |\n| 咪唑 | 吗啡 |\n| 高洛吗啡 | 海肝 |\n| 乙酰氨基/氢柯 | 咪唑\
  \ |\n\n## 8.3 用于 EHR 的统计模型\n\n### 8.3.1 联列表\n\n\n\n\n列联表（也称为交叉分类表或交叉表）汇总了按分类变量分类受试者的频率。例如，表\
  \ 8.2 列出了有/无 SAH（蛛膜下出血）记录与多巴胺/`Non_doapmine`治疗的人数二二计数表。在这里，`Non-SAH patients`代表在\
  \ Cerner 数据库中至少有一个诊断或一种药物记录，但没有 SAH 诊断的患者。列联表揭示了不同分类变量之间的关系，是针对许多问题进行初步统计分析的有效函数。\n\
  \n### 表 8.2 SAH 患者与非 SAH 患者的多巴胺交叉交叉计数\n\n|   | **多巴胺** | **非多巴胺** |\n| --- | ---\
  \ | --- |\n| SAH 患者 | 991 | 27304 |\n| --- | --- | --- |\n| 非 SAH 患者 | 210547 |\
  \ 17448416 |\n\n我们简要说明一下列联表统计检验的机制。假设 `X` 和 `Y` 是分类变量，每个变量有两个类别，且表的每行（每列）代表 `X`（`Y`）的一个类别。那么每行和每列的交点被称为一个单元格。因此，表\
  \ 8.3 中的全部四个单元格（`X[1]`, `Y[1]`）、(`X[1]`, `Y[2]`）、(`X[2]`, `Y[2]`）和 (`X[2]`, `Y[2]`）展示了两个变量\
  \ `X` 和 `Y` 之间所有可能的组合。\n\n### 表 8.3 列联表\n\n|    | `Y[1]` | `Y[2]` |\n| --- | ---\
  \ | --- |\n| `X[1]` | `n[11]` | `n[12]` |\n| --- | --- | --- |\n| `X[2]` | `n[21]`\
  \ | `n[22]` |\n\n假设从总体中随机选择的受试者落在列联表中某一个单元格的概率为 `π[i**j] = P(X=i,Y=j)`。将边缘分布 `P(X=i)`\
  \ 和 `P(Y=j)` 分别记为 `{π[i+]}` 和 `{π[ j]}`，其中 `π[i+] = π[i1] + π[i2]` 且 `π[ j] = π[1j]\
  \ + π[2j]`。同样，将 `n[i**j]` 和 `p[i**j]` 分别记为样本的观测单元格计数和比例。那么 `n[i**j]` 和 `p[i**j]`\
  \ 服从\n\n$$p_{\\\\mathit{ij}} = \\frac{n\\_{\\mathit{ij}}}{n},$$\n\n其中 `n = \\sum[*I,\
  \ j*]n[i**j]` 是总样本量。为了注释，令 `n[i+] = n[i1] + n[i2]` 且 `n[ j] = n[1j] + n[2j]`。变量\
  \ `X` 可以称为暴露，变量 `Y` 可以称为反应或结果。\n\n对于队列研究，研究人员通常想知道暴露是否与结果相关。例如，根据表 8.2，研究人员想知道为\
  \ SAH 患者处方多巴胺是否比为非 SAH 患者处方更值得调查。在这里，疾病 SAH 是暴露，反应是多巴胺的给。在统计学中，我们倾向于通过比较 `给定 X[1]\
  \ 的 Y 分布` 是否与 `给定 X[2] 的 Y 分布` 相同来建立这个问题。这也被称为独立性检验。对于二二列联表，`给定 X[1] 的 Y 分布` 服从二项分布。对于行\
  \ 1 中的受试者，令 `π[1]` 表示成功的概率（假设 `Y[1]` 代表成功），则 `1-π[1]` 为失败概率。同样，令 `π[2]` 表示行 2 受试者的成功概率。为了回答这个统计问题，比例差\
  \ `π[1]-π[2]` 是我们的目标。我们可以使用 Wald 检验基于样本差异 `p[1]` 和 `p[2]` 误差获得 P 值和置信区间，其中 $p_i\
  \ = \\frac{n_{i}}{n_{i+}}$。读者可以在 (Agresti 1996) 中找到 Wald 检验的更多细节。\n\n### 8.3.2 卡检验\n\
  \nWald 检验的替代检验是卡检验。如果我们感兴趣每个单元格的概率是否等于假设值 `{π[**j]}`（我们称之为零假设 `H[0]`），一种直接的方法是比较观测单元格计数\
  \ `{n**j]}` 和期望频率 `{μ**j = nπ[**j]}`，其中 `n` 是总样本量。Karl Pearson 通过提出著名的卡方统计量实现了这一观点：\n\
  \n$$X^{2} = \\frac{\\sum\\\\left( {n_{\\mathit{ij}} - \\mu_{\\mathit{ij}}} \\right)^{2}}{\\\
  mu_{\\mathit{ij}}}.$$\n\n可以看到，更大的 `{n**j]-μ**j}` 差异会导致更大的 `X²` 值以及更反对 `H[0]` 的证据。可以通过计算\
  \ `P(X²>d)`  P 值。为了应用卡检验，必须知道 `{μ[**j]}` 的值。但在现实中，情况并不总是如此。在双向列联表中，在统计独立零假设下，`π[**j]`\
  \ 可以简化。我们可以通过样本边缘 `n_{i+}/n` 和 `n_{+j}/n` 估计未知的边缘概率 `π[i+]` 和 `π[ j]`。因此，估计频率为：\n\
  \n$$\\hat{\\mu}_{\\mathit{ij}} = n\\frac{n_{i+}}{n}\\frac{n_{+ j}}{n} = \\frac{\\\
  \\left( {n_{i1} + n_{i2}} \\right)\\\\left( {n_{1j} + n_{2j}} \\right)}{n}.$$\n\n\
  将 `\\hat{\\mu}[**j]` 代入卡方统计量，可以获得 P 值，因为卡方统计量 `X²` 服从卡分布。对于每种药物，该 P 值都可以指示药物的重要性。注意，独立性卡检验具有局限性。当某些单元格的期望频率小于\
  \ 5 时，卡方近似往往精确。可以采用超几何检验（Fisher 精确检验）。\n\n### 8.3.3 超几何检验\n\n卡检验使用了中心极限理形式的大数定律。当卡检验的基本假设不成立时，可以使用超几何检验（Fisher\
  \ 精确检验）。给定总样本量 `n`、边缘行大小 `n[1+]` 和 `n[2+]` 以及单元格计数 `n[11]`，就可以确定整个表，这意味着可以计算所有其他单元格计数。单元格计数的概率服从超几何分布。表的概率仅用\
  \ `n[11]` 表示：\n\n$$\\left( n_{11} \\\\right) = \\frac{\\\\begin{pmatrix} n_{1 +}\
  \ \\\\ n_{11} \\\\ \\\\end{pmatrix}\\\\begin{pmatrix} n_{2 +} \\\\ {n_{+ 1} - n_{11}}\
  \ \\\\ \\\\end{pmatrix}}{\\\\begin{pmatrix} n \\\\ n_{+ 1} \\\\ \\\\end{pmatrix}}.$$\n\
  \n其中 `\\begin{pmatrix} a \\\\ b \\\\end{pmatrix}` 是二项式系数。P 值是 `P(n(*))` 之和，其中 `n[11]\
  \ ≤ n(*) ≤ min(n[+1],n[1+])`。\n\nP 值可以用于对 EHR 队列研究中的药物或诊断进行排名。例如，根据超几何检验的 P 值，SAH\
  \ 患者中的领先药物列在表 8.4 中。排名由 P 值的显著性给出。\n\n### 表 8.4 使用超几何检验的药物调整排名\n\n| 药物 | p\\_value\
  \ |\n| --- | --- |\n| Nicardipine | 0 |\n| Mannitol | 0 |\n| Glucagon | 0 |\n| Enalapril\
  \ | 0 |\n| Alteplase | 0 |\n| 乙二醇 3350 | 0 |\n| Vasopressin | 0 |\n| Esomeprazole\
  \ | 0 |\n| 局部凝血蛋白 | 0 |\n| Codeine | 0 |\n| APAP/丙妥酮/咖啡因 | 0 |\n| 葡萄酸钙 | 0 |\n|\
  \ 氧化镁 | 0 |\n| 腻霉素 | 0 |\n| 维生素 B1 | 0 |\n| 景洛碱 | 0 |\n\n\n\n\n\n| 柠檬酸/碳酸氢钾 | 0\
  \ |\n| 凝血因子 VIIa | 0 |\n| 维生素 E 外用 | 0 |\n| 阿巴比妥 | 0 |\n| 素 | 2.12E-11 |\n\n然而，由于非蛛网膜下出血（SAH）患者数量很大，与\
  \ SAH 患者相比，许多药物的 `P-values` 为 0。我们可以利用相对风险重新调整排名，这将在 8.3.4 节中解释。\n\n在第 8.3.1 节中，我们提到\
  \ `Wald test` 可检验比例 `π`[1] 和 `π`[2] 之间的差异。[相对风险](https://en.wikipedia.org/wiki/Relative_risk)\
  \ 是评估差异的另一个有用指标，尽管没有通用的统计检验来验证其显著性。对于 2x2 表，相对风险（`RR`）是比例$\\\\mathit{RR} = \\\\\
  frac{\\\\pi\\_{1}}{\\\\pi\\_{2}}.$。\n\n其中 `RR` 为 1，意味着 `π`[1] 等于 `π`[2]，我们可以推断响应与暴露是独立的。`RR`\
  \ 越离 1 远，比例 `π`[1] 和 `π`[2] 之间的差异越大。因此，它为我们更多证据，表明两行之间的成功概率差异更大。在实践中，我们通常使用样本比例\
  \ `p`[1] 和 `p`[2] 来估计 `RR` 并获得样本相对风险 $\\frac{p\\_{1}}{p\\_{2}}$。例如，在表 8.2 中，样本风险比为\
  \ 2.94。SAH 患者多巴胺的样本比例比非 SAH 患者高出 194%。根据数据，这表明多巴胺可能是对 SAH 患者特别有益的药物。在临床上，多巴胺也是常用的血管收缩剂，用于增加血压以防止\
  \ SAH 患者发生迟性脑缺血（`DCI`）。同样地，我们可以使用 `RR` 对所有其他药物进行排序。\n\n### ![image](img/inline1_1.jpg)\n\
  \n## 8.4 GLM\n\n在确定使用哪些统计模型处理 EHR（电子健康记录）数据时，线性回归（`OLR`）是一个很好的起点。它简单易于实现；我们可以从数据中获得有价值的信息，并为其他高级模型提供基准结果。接下来，我们将要介绍\
  \ `OLR` 和 `GLMs`。\n\n在 `OLR` 中，响应变量 `y`[*i*]与协变量 `x`[*i*]之间的关系假设为\n*E*(`y`[*i*]|**x**[*i*]) = **x**[*i*]^(*T*)**β**。\n\
  \n`GLM` 是普通线性模型的泛化，它引入了连接函数 `f`(`x*)`来将关系扩展为\n*f*(`E`(`y`[*i*]|**x**[*i*])) = **x**[*i*]^(*T*)**β**。\n\
  \n常用的连接函数包括 `identity` 函数、`log` 和 `logit` 函数。如果将 `identity` 函数视为连接函数，则 `GLM` 就是一个\
  \ `OLR`。如果连接函数是 `logit` 函数，$\\log\\left( \\frac{x}{1 - x} \\right),$，则 `GLM` 变成了熟悉的逻辑模型，\n\
  $\\begin{matrix} {\\\\log\\\\left( \\\\frac{\\pi\\\\left( \\\\mathbf{x} \\\\right)}{1\
  \ - \\\\pi\\\\left( \\\\mathbf{x} \\\\right)} \\\\right) = \\\\mathbf{x}\\}_{i}^{T}\\\
  \\beta,}} \\\\end{matrix}$\n其中 `π`[*i*]`= `E`(`y`[*i*])。`Logistic regression` 是建模响应变量为二分类数据的有用工具。由于遵循\
  \ `Bernoulli` 分布的二分类变量期望等于“成功”概率，`π`[*i*] 可以被解释为在 `x`[*i*] 处的“成功”概率。方程 (8.1)意味着\n\
  $\\pi\\left( \\mathbf{x}\\}_{i} \\right) = {\\\\frac{\\exp\\\\left( \\\\mathbf{x}\\\
  }_{i}^{T}\\\\beta \\\\right)}{1 + \\\\exp\\\\left( \\\\mathbf{x}\\}_{i}^{T}\\\\\
  beta \\\\right)}.$\n\n那么“成功”的优势比为\n$\\begin{matrix} {\\\\pi\\\\left( \\\\mathbf{x}\\\
  }_{i} \\right)}{1 - \\\\pi\\\\left( \\\\mathbf{x} \\\\right)} = \\\\exp\\\\left(\
  \ \\\\mathbf{x}\\}_{i}^{T}\\\\beta \\\\right)} \\\\end{matrix}$\n因此，“成功”的优势比（`OR`）等于\
  \ `exp`(`β`[*p*])，这意味着在调整其他协变量（保持不变）的情况下，`X`[*p*] 每增加一个单位，成功的优势是 `X`[*p*] 时优势的 `exp`(`β`[*p*]`)\
  \ 倍。优势比表示在给定其他协变量的情况下一个协变量对优势的影响。对于 EHR 研究中的大多数预测建模，`logistic regression` 更常用。\n\
  \n`logistic regression` 的泛化是 `multinomial logistic regression`，用于具有两个以上类别的分类结果。这些模型可以用于命名响应和有序响应。让我们假设类别数量为\
  \ `J`。让 {`π`[1],…`π*[J]} 表示响应 `y`[*i*] 落在类别 {1,…`J`} 的概率，其中 ∑[*j]*`π`[*j]=1，且 `i`\
  \ 表示第 `i` 个主体。命名响应的最常用模型是 `baseline-category logits model`，其中最后一个类别 `J` 被选为基准，通过将每个响应类别与参考类别配对构建\
  \ `J−1` 个 `logit models`。每个 `logit model` 是 $\\log\\left( \\frac{\\pi_{j}}{\\pi_{J}}\
  \ \\right)$ 之间的线性关系。\n\n\n\n\n\n在实际上，我们通常希望将事件时间与协变量 `x` 联系起来。在电子健康记录（EHR）中，协变量\
  \ `x` 可以包括一些人口统计学变量或其他记录变量，例如实验室检查。Cox 模型提供了一种将风险函数与协变量相结合的方法。具体而言，其形式为：\n\n*h*(*t*|**x**) = *h*0exp (*β*^′**x**)\n\
  \n其中 `h*0` 是基线风险。\n\n### ![image](img/inline1_1.jpg)\n\n8.6 混合效应模型\n\n当响应不独立或存在纵向协变量时，GLM\
  \ 无法拟合数据并学习数据中所有的结构和信息。在这里，我们引入混合效应模型来处理 EHR 数据中常见的纵向数据。我们通过一个与血压测量临床事件记录相关的示例来简要说明这些模型。\n\
  \n假设我们想为一组特定的 *m* 个患者使用几个解释变量对血压趋势进行建模。令 *y*[*i**j*], *j*  = 1, 2, …*n* 代表第 *i**t***\
  \ 个患者血压的重复测量，其中 *j* 代表测量次数。为了简单起见，我们假设所有患者的总测量次数相同，即 *n*。那么，响应与解释变量之间的关系可以建模为：\n\
  \n*y*[*i**j*]  = **x**[*i**j*]^(*T*)**β**  + **z**[*i**j*]^(*T*)**b**[*i*]  + *ϵ*[*i**j*,]\n\
  \n其中 `x[*i**j*]^(*T*)` 和 `β` 分别表示固定效应协变量和固定效应系数，`z[*i**j*]^(*T*)` 和 `b[*i*]` 分别表示固定效应协变量和随机效应向量，`b[*i*]`\
  \ 服从 `N*(0,**D*)`，且 `ϵ[*i**j*]` 表示第 *i**t*** 患者第 *j* 次测量的误差。可以看出，混合效应模型是 OLR 模型的扩展。将固定效应部分解释为总体平均值，将随机效应部分解释为特定受试相对于总体平均值的偏差。在我们的示例中，总体平均值可以是一般的血压模式（例如以\
  \ 90 为中心的平滑曲线），而偏差可以是特定受试围绕平均曲线的波动。通过引入随机效应，血压重复测量之间的相关性变得显而易见得到了描述。关于混合效应模型的更多细节，读者可以参考\
  \ (Wu and Zhang 2006, Diggle et al. 2002)。\n\n### ![image](img/inline1_1.jpg)\n\n\
  8.7 时间序列分析\n\n### 8.7.1 AR, MA 和 ARMA 模型\n\n直接对 EHR 数据中的时间模式建模的方法是使用常见的时间序列模型。时间序列模型是用于拟合相关响应特定模型，其相关结构处理重复的纵向测量。例如，假设某个实验室检查当前值\
  \ *y[*t*]* 与之前的测量值 *y[*t* − 1]*, *y[*t* − 2]*,  …, *y[*t* − *p*]* 是合理的，这些值被称为滞后值（在特定的时间持续范围内）。标准的时间序列模型是自回归（AR）和移动平均（MA）。AR\
  \ 反映了不同时间响应测量值之间的线性关系，其形式如下：\n\n*y*[*t*]  = *ϕ*[0]  + *ϕ*[1]*y*[*t* − 1]  + *ϕ*[2]*y*[*t* − 2]\
  \  +… + *ϕ*[p*]*y*[*t* − *p*]  + *a*[*t*]\n\n其中 `a[*t*]` 是误差项，*p* 是 `y[*t*]` 的滞后阶阶。\n\
  \nMA 模型将 `y[*t*]` 与白噪声序列 `{a[*t*]}` 联系起来，这意味着这是一系列具有有限均值和方差的独立同分布随机变量。MA(q) 模型为：\n\
  \n*y*[*t*]  = *c*[o*]  + *a*[*t*]  − *θ*[1]*a*[*t* − 1]  − *…* − *θ*[q*]*a*[*t* − *q*],*\n\
  \n其中 *q* 是 `a[*t*]` 的滞后阶。\n\n在某些情况下，AR 或 MA 模型可能需要带有许多参数的高阶滞后项来充分描述数据的动态结构 (Tsay\
  \ 2010)。\n\n\n\n\n通常，变量选择方法分为两类。其中一类可以总结为使用普通最小二法（`OLS`）的线性回归变量子集选择。在这种方法中，对模型系数进行统计假设检验被用作最终变量选入模型的常用标准。逐步回归和目的性变量选择等方法就是该类方法的示例。尽管\
  \ `OLS` 可以产生无偏的预测结果，但它面临着估计方差大和解释性不尽理想的问题，特别是在高维问题中。研究者提出了惩罚技术以改进传统的基于 `OLS` 的变量选择方法。有许多基于惩罚的方法，其中最常用的方法是\
  \ `LASSO` 及其扩展，如平滑裁剪绝对偏差（`SCAD`）、最小极凸惩罚（`MCP`）等。在本节中，我们将简要介绍这些方法。\n\n### 8.8.1 逐步变量选择\n\
  \n逐步变量选择可以分为前向逐步选择或反向逐步选择。这两种方法遵循相同的变量选择策略：在迭代步骤中添加或删除变量。它们之间的在于调整模型的方向。前向逐步选择从截距开始构建模型，而反向逐步选择从全模型开始并减少冗余变量。\n\
  \n前向逐步选择的算法包含以下 4 步：\n\n第 1 步从空模型开始，该模型不包含任何预测变量，只有截距（在这种情况下为结果的均值）。\n\n第 2 步考虑所有通过增加一个尚未选择的预测变量来扩展上一个的模型。\n\
  \n第 3 步选择比上一个模型改进的模型，通常由残差平方和（`RSS`）确定。\n\n第 4 步重复步骤 2 到 3，直到达到某些停止规则。例如，规则可以是最终模型所需的变量数量。\n\
  \n反向逐步选择从包含所有预测变量的全模型开始。创建所有包含除一个之外的所有变量的模型。选择具有最小 `RSS` 的模型，该模型少了一个变量。重复此过程，直到从模型中进一步减少任何变量会导致\
  \ `RSS` 在统计学意义上显著增加。\n\n#### 8.8.2 目的性变量选择\n\n两种逐步方法完全基于统计显著性标准，但完全忽略协变量对感兴趣的响应回归的实际意义。因此，有时与响应有明确临床关系的变量会被从模型中排除。为了解决这个问题，研究者提出了目的性变量选择程序（Hosmer\
  \ and Lemeshow 2000）。该方法使用显著性和估计变化标准进行变量选择，允许分析人员在建模过程的每一步做出变量选择决策。\n\n第 1 步执行单变量分析以识别潜在协变量。`P-value`\
  \ < `0.25` 的变量以及具有临床意义的变量将被纳入步骤 2 的进一步多变量分析。\n\n第 2 步使用步骤 1 选择的所有变量拟合一个多元模型。此外，从多元模型中消除\
  \ `P-value` > `0.05` 的变量，并拟一个新的较小的模型。然后使用部分似然比检验比较这两个模型。\n\n第 3 步使用估计变化标准识别混杂变量。因此，比较大模型和小模型，以识别任何其他系数估计值的变化是否达到\
  \ 20%，在这种情况下，每个丢弃的变量都会重新加回模型。重复此过程几次，直到所有重要变量都包含在模型中。\n\n第 4 步将步骤 1 中未选中的每个变量添加到步骤\
  \ 3 的模型中。在步骤 4 中识别的所有显著变量都保留在模型中。\n\n第 5 步检查连续变量的线性假设，并进行适当的修正。\n\n第 6 步研究交互作用，并将重要的交互项包含在模型中。\n\
  \n第 7 步对最终模型进行拟合度检验。\n\n### 8.8.3 Sis\n\n在早些章节中描述的所有模型（收缩方法外）都假设观测次数远大于模型的维度（变量数量）。\n\
  \n然而，在电子健康记录（EHR）数据由于由于成千上万个变量，这一假设通常被忽略。维度灾难导致了预测变量之间的共性和计算成本等问题。为了解决这个问题，一种方法是使用收缩方法，如\
  \ `LASSO`。另一种处理此问题的方法是 `SIS` (Fan and Lv 2007)，它被认为适用于超高维问题。对于线性回归模型\n\n**y** =\
  \ **X****β** + **ϵ**\n\n假设 **y** (`y*[1],…,*y*[n]) 是维度为 `n` 的响应向量，**X** (**x**[(1)],…,**x**[(p)])\
  \ 是 `n`×`p` 的设计矩阵，**x**[(i)] 是 `p` 个协变量中的第 `i` 个协变量，**β** (`β*[1],ↆ,*β*[p])^T* 是\
  \ `p` 维回归系数向量，**ϵ** (`ϵ*[1],…,*ϵ*[n]) 是 `n` 维误差向量。\n\n`SIS` 的核心思想是对每个协变量进行回归。然而，如果不能满足\
  \ `SIS` 的假设，可能会导致一些问题。例如，与重要变量高度相关的无关预测变量被 `SIS` 选择的优先级可能高于与响应相关的其他重要变量。迭代 `SIS`\
  \ (`ISIS`) 被提出克服 `SIS` 的缺点。它包含两个步骤。在第一步中，使用基于 `SIS` 的模型选择方法（如 `SIS-LASSO`）选择变量子集\
  \ **C**[1]。在第二步中，将步骤 1 的残差作为新的响应，对剩余变量 (**x**[(1)],…,**x**[(p)]) ∖ **C**[1] 应用相同的\
  \ `SIS` 方法，从而产生变量子集 **C**[2]。重复上述两个步骤，直到不相交子集 **C**[1],ↆ…**C**[**l**] 的并大小小于 **n**。读者可以查看\
  \ (Fan and Lv 2007) 了解更多细节。\n\n### 8.8.4 基于惩罚的方法\n\n基于惩罚的变量选择方法可以概括为以下优化问题：\n\n\n\
  \n\n\n$\\min\\limits\\_{\\mathbf{\\beta}}\\\\left\\| {\\\\mathbf{y} - \\mathbf{X}\\\
  mathbf{\\beta}} \\right|\\_{2}^{2} + \\sum\\limits\\_{i = 1}^{p}{P\\_{\\lambda}\\\
  \\left( \\beta\\_{i} \\right).}$\n\n其中 ∥•∥[2] 表示 L-2 范数，`P``λ` 是施加在系数 `β`[`i`] 上的惩罚函数。惩罚函数的形式导致了两种主要的基于惩罚的方法：基于范数的正则化方法和基于凸函数的正则化方法。\n\
  \n基于范数的正则化方法包括使用 L1 惩罚 |`β`[`i`]| 的 [LASSO](https://en.wikipedia.org/wiki/LASSO)\
  \ 以及使用 `L`2 惩罚 ∥`β`[`i`]`∥[2]² 的岭回归回归（ridged regression）。如果 `P``λ` (Fan and Li 2001)\
  \ 和极小极大凸惩罚 (MCP) (C.-H. Zhang 2010)。具体而言，对于 SCAD，\n\n$P\\_{\\lambda}\\left( \\beta\
  \ \\right) = \\left\\{ {\\\\begin{matrix} {\\\\lambda,} & {\\\\mathit{if}\\\\left|\
  \ \\beta \\right| \\leq \\lambda} \\\\\\\\ {\\\\frac{a\\\\lambda - \\left| \\beta\
  \ \\right|}{a - 1},} & {\\\\mathit{if}\\\\lambda < \\left| \\beta \\right| < a\\\
  \\lambda} \\\\\\\\ {0,} & {\\\\mathit{if}\\\\left| \\beta \\right| \\geq a\\\\lambda}\
  \ \\\\\\\\ \\\\end{matrix}.} \\right.$\n\n对于 MCP，\n\n$P\\_{\\lambda}\\left( \\beta\
  \ \\right) = \\left\\{ \\begin{matrix} {\\\\lambda\\left| \\beta \\right| - \\frac{x^{2}}{2\\\
  \\gamma},} & {\\\\mathit{if}\\\\left| \\beta \\right| \\leq \\\\gamma\\\\lambda}\
  \ \\\\\\\\ {0.5\\\\gamma\\\\lambda^{2},} & {\\\\mathit{if}\\\\left| \\beta \\right|\
  \ > \\\\gamma\\\\lambda} \\\\\\\\ \\\\end{matrix} \\right.$\n\n在所有正则化方法中，LASSO 被应用于各个科学领域，包括统计学、机器学习、计量经济学、工程学等。LASSO\
  \ 与岭回归相比的一个重要优势是，当调优参数 `λ` 足够大时，LASSO 具有将某些系数压缩为精确零的优势，从而进行变量选择并降维。这是由于 公式 (8.3)\
  \ 中惩罚函数的形式。具体而言，对于 LASSO，公式 (8.3) 简化为\n\n$\\min\\limits\\_{\\mathbf{\\beta}}\\left\\\
  | {\\\\mathbf{y} - \\mathbf{X}\\mathbf{\\beta}} \\right|\\_{2}^{2} + \\sum\\limits\\\
  _{i = 1}^{p}{\\lambda\\left| \\beta\\_{i} \\right|.}$\n\n|`β`[`i`]| 将引入所谓的“软收缩”，而岭回归将按比例压缩系数\
  \ (Hastie, Tibshirani, and Friedman 2009)。已经提出了 LASSO 的许多扩展方法。例如，分组 LASSO (Grouped\
  \ LASSO) 是解决协变量属于预定义组的问题的方法之一 (Yuan and Lin 2006)。自适应 LASSO (Adaptive LASSO) 采用形式为\
  \ $\\sum\\limits\\_{i = 1}^{p}{\\omega\\_{j}\\left| \\beta\\_{i} \\right|}$ 的加权惩罚，具有\
  \ oracle 属性，即系数的一致估计和真模型的正确恢复 (Zou 2006)。弹性网络 (Elastic Net) 方法的动机是为了是将相关变量压缩为零，为了实现这一目标，它引入了灵活的惩罚函数\
  \ $\\sum\\limits\\_{i = 1}^{p}{({\\alpha\\left| \\beta\\_{i} \\right| + \\left(\
  \ {1 - \\alpha} \\right)\\beta\\_{i}^{2}})}$ (Zou 2006)。\n\nLASSO 也可以扩展到广义线性模型 (GLMs)、广义估计方程、Cox\
  \ 模型等。由于许多研究使用带有 L1 惩罚的逻辑模型对 EHR 数据进行统计分析，我们介绍了 LASSO 在逻辑模型的扩展。在线性回归模型中，LASSO 在最小二乘函数（一种损失函数）中添加\
  \ L1 惩罚。因此对于逻辑回归 (8.1)，一旦确定了损失函数，将 L1 正则化与其结合就会导致带有 LASSO 惩罚的逻辑回归。逻辑回归的损失函数是负对数似然函数。逻辑回归\
  \ (8.1) 的正则化机制可以描述为\n\n$\\min\\limits\\_{\\mathbf{\\beta}}{n^{- 1}\\sum\\limits\\\
  _{\\_{i = 1}^{n}\\left( {\\\\left. - y\\_{i}\\left( \\mathbf{x} \\right.\\_{i}^{T}\\\
  mathbf{\\beta} \\right) + \\log⁡\\left( 1 + \\exp⁡\\left( \\mathbf{x}\\_{i}^{T}\\\
  mathbf{\\beta} \\right) \\right)} \\right)} + \\sum\\limits\\_{i = 1}^{p}{\\lambda\\\
  left| \\beta\\_{i} \\right|.}$\n\n如果我们将惩罚改为 $\\sum\\limits\\_{i = 1}^{p}\\lambda\\\
  left\\| \\beta\\_{i} \\right\\|\\_{2}^{2}$，则正则化就变成了岭回归。这种 L2 正则化也广泛用于 EHR 数据分析。同样，分组\
  \ LASSO、自适应 LASSO 和弹性网络也可以推广到 GLMs。获得正则化方法益处的一个主要代价是为了获得更小的方差而牺牲了无偏系数估计。与 GLMs 不同，LASSO\
  \ 不保证系数的无偏估计，然而，LASSO 的后期变体（如自适应 LASSO）解决了这个问题。读者可以参考 (Hastie, Tibshirani, and Friedman\
  \ 2009) 以进一步了解 LASSO。\n\n## ![image](img/inline1_1.jpg) \n\n## 8.9 分治法\n\n如果我们使用开发良好的计算包，上述所有方法都可以直接应用于大型\
  \ EHR 数据。然而，更复杂的方法（如非线性模型和联合模式）对于大数据在计算上是不可行的。克服计算问题的一种方法是将统计方法与并行计算方法和分治法相结合。在后者中，将大数据（通常是随机地）划分为较小的数据，然后将所有方法的统计结果汇总。\n\
  \n## ![image](img/inline1_1.jpg) \n\n## 8.10 验证\n\n将初始变量筛选迭代法 (Iterative SIS) 与上述提出的任何方法（例如逐步法、LASSO\
  \ 和自适应 LASSO）相结合，为预测和识别风险因素提供了多个模型，且每个模型都利用不同的数学和计算准则进行变量选择。然而，比较和评估这些不同的模型和方法是重要的，以便在实践中选择并使用最终的预测模型。特别是对于连续结果，均方误差\
  \ (MSE) 是评估预测性能的常用指标。MSE 的公式为\n\n$\\frac{1}{\\\\mathbf{n}}\\sum\\limits\\_{\\mathbf{i}\
  \ = 1}^{\\\\mathbf{n}}{\\left( {\\\\mathbf{Y}\\_{\\mathbf{i}} - \\\\widehat{\\\\\
  mathbf{Y}\\_{\\mathbf{i}}}} \\right)^{2},$\n\n其中 **Y**[**i**] 和 $\\widehat{\\{\\\
  mathbf{Y}\\_{\\mathbf{i}}}$ 分别是 n 个观测值的观测和预测响应。对于二分类结果，ROC 曲线的 (AUC) 常用于比较不同模型的预测准确性，这将在\
  \ 8.10.1 节中介绍。\n\n\n\n\n\n许多指标被用于评估不同模型的性能。对于二分类，`AUC` 是最常用的标准。以逻辑回归为例：在我们拟合模型后，可以将模型的估计系数代入公式\
  \ `π(x[i])` (2) 中，以获得新观测值 `x[i]` 的“成功”的估计概率 `π̂(x[i])`。根据 `π̂(x[i])`，我们可以将主体 `i`\
  \ 分为第 1 类（即 `ŷ[i] = 1`）或第 0 类（即 `ŷ[i]=0`）。对于这种分类，假设一个阈值值 `π[T]`，如果 `π̂(x[i])`\
  \ 大于或等于 `π[T]`，则 `ŷ[i] = 1`；否则，`ŷ[i] = 0`。对于特定的截断点 `π[T]`，我们可以计算敏感性（sensitivity）和特异性（specificity）。敏感性定义为\
  \ `P(ŷ=1|y=1)`，特异性定义为 `P(ŷ=0|y=0)`。在实际数据分析中，正预测所捕捉的正样本占总正样本的比例被用来替代真实的敏感性概率，这有时被称为真阳性率（true\
  \ positive rate）。负预测所捕捉的负样本占总负样本的比例则用于估计真实的特异性概率，这有时被称为真阴性率（true negative rate）。这里正样本是指第\
  \ 1 类中的主体，负样本是指第 0 类中的主体。因此，对于任何 `π[T]` 阈值值，都可以获得敏感性和 1-特异性。对于一系列阈值，我们可以使用敏感性和 1-特异性作为坐标绘制散点曲线，如图图\
  \ 8.1 所示，该图生成自 SAH 研究，在该研究中我们利用患者信息预测出院时的死亡状态。绘制的曲线名为 `ROC`。ROC 下的面积为 `AUC`。对于给定的特异性，较高的敏感性意味着更好的预测能力。因此，ROC\
  \ 下的面积越大，表明模型的预测性能越好。\n\n![图 8.1 SAH 研究中预测死亡的 ROC AUC 曲线。](img/fig8_1.jpg)\n\n**图\
  \ 8.1**\n\nSAH 研究中预测死亡的 ROC AUC 曲线。\n\n### ![image](img/inline1_1.jpg)\n\n### 8.11\
  \ 结果与示例\n\n在这里，我们使用 SAH 研究作为逻辑回归、多元逻辑回归、逐步回归和 LASSO 的示例。在这项研究的一个项目中，我们检查了施给 4810\
  \ 名符合条件的 SAH 患者的第一种血管收缩药物（Williams et al. 2020）。使用意向治疗分析（intention-to-treat approach），根据患者最初收到的血管收缩药物将其分为特定的治疗组（多巴胺、苯丙肾醇或去甲肾上腺素），无论他们随后是否接受了不同的血管收缩药物。预测因子包括年龄、种族、婚姻状况、性别、750\
  \ 种药物、查尔森合并症指数 (`CCI`) 和总静脉注射量。结局是院内死亡。\n\n由于协变量数量众多，我们实施了 `LASSO` 和逐步回归来降维。结果见表\
  \ 8.5。\n\n| 方法 | OR |\n| :--- | :--- |\n| 多巴胺 vs 苯丙肾醇 | 2.0 |\n| LASSO vs 去甲肾上腺素\
  \ | 0.86 |\n| 逐步回归 + 逻辑回归 | 1.98 |\n\n在这项研究的另一个项目中，我们的目的是预测出院时的死亡状态。使用用于医疗时间序列的稀疏多输出高斯过程，我们预测了死亡风险。`ROC`\
  \ 曲线生成自 SAH 研究，在该研究中我们利用患者信息预测出院时的死亡状态。`ROC` 下的面积为 `AUC`。对于给定的特异性，较高的敏感性意味着更好的预测能力。因此，ROC\
  \ 下的面积越大，表明模型的预测性能越好。\n\n![图 8.1：SAH 研究中预测死亡的 ROC AUC 曲线。](img/fig8_1.jpg) \n\n\
  12 讨论与结论\n\n在本章中，我们回顾了适用于纵向数据的常用方法。然而，在高维特征空间中仍然面临巨大挑战。例如，对于超高维特征空间，必须进行“确定独立性筛选（Sure\
  \ independence screening）”。例如，针对极量数据的“分治法（split-and-conquer）”方法是非常用的。\n\n## 参考文献\n\
