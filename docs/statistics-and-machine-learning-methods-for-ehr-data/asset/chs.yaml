  \n![9](img/inline_1.jpg)\n\n# 用于 EHR 数据的神经网络和深度学习方法\n\nDuo Ashraf Xi YuYaseenLuo\
  \ 本章回顾了 EHR 数据分析中深度学习方法的最新和新兴文献。它涵盖了与结构化数据相关的选定方法列表，并讨论了它们在各种应用场景和研究目标中的优缺点。使用了两个示例和脚本来展示我们应用深度学习分析\
  \ EHR 数据。\n\n## ![](img/inline_1.jpg)\n\n## 9.1 引言\n\n深度学习（DL）是一种机器学习建模技术，它采用多个层次的人工神经元形成网络（通常称为人工神经网络\
  \ ANN），以学习输入输出之间复杂的“规则”。层数可以从几层到几倍不等，形成深度连接神经网络。因此，此类模型被称为深度学习。深度学习的历史可以在许多在线资源或期刊文章中找到。该领域领先研究者的近期综述包括\
  \ (LeCun, Bengio, and Hinton 2015, Hinton 2018, Esteva et al. 2019)。本章将首先介绍 DL 的简要概述，然后将重点转向\
  \ DL 在我们应用相关的 EHR 数据分析方面的方面。有关 EHR 分析中 DL 的更详细、全面的综述，请参阅 (Shickel et al. 2018, Miotto\
  \ et al. 2018)。\n\nDL 模型结构的类型在过去几年中发展迅速。尽管文献中增加的类型数量爆炸式增长，但基础模型结构可以在图 9.1 中表述如下。\n\
  \n![图 9.1 单隐藏层的神经网络。](img/inline_1.jpg)\n\n图 9.1 单隐藏层的神经网络。\n\n如图所示，我们使用四个隐藏层（深灰色），使用以下形式预测单个输出\
  \ `y`：\n\n`z = w * x + θ`\n\n其中 `x` 和 `z` 是向量，`w` 是权重矩阵，`θ` 是截距向量。在各层之间选择相同的激活函数没有限制，尽管通常它们被选择为相同的，最后一层外，最后一层的激活函数选择要与结果兼容。多层感知器（MLP）是一种前馈人工神经网络（ANN），它利用名为反向传播的监督学习技术进行训练。它的多层结构和非线性激活将\
  \ MLP 与线性感知器区分开来。MLP 通常包含比图中所示单层更多的隐藏层。选择非线性激活函数的优势是允许 MLP 捕捉输入与输出之间的非线性关系。稍后将讨论更多激活函数的选择。还将介绍一个如何实现\
  \ MLP 的示例。\n\n`σ(·)` 可以采取多种形式，包括线性、sigmoid 或双曲正切（tanh）。sigmoid 函数定义为：\n\n```\nσ(x)\
  \ = 1 / (1 + e^(-x))\n```\n\n双曲正切函数定义为：\n\n```\nσ(x) = (e^(2x) - 1) / (e^(2x) +\
  \ 1)\n```\n\n通常，DL 方法根据其目标分为类：\n\n1. **监督学习**：旨在寻找预测模式以准确预测结果。示例包括从图像中识别数字/文本、预测诊断和治疗结果。该类\
  \ DL 技术与逻辑回归和随机森林等其他经典机器学习具有相同的目标。\n2. **强化学习**：采用计算机代理通过重复试验中的奖励和惩罚执行特定任务，直到算法很好地完成任务。著名的例子可能是\
  \ AlphaGo，一种基于深度学习的算法，它击败了顶尖的人类围棋大师 ([Silver et al. 2016])。\n3. **无监督学习**：旨在一组变量中搜索重要模式，而没有直接目标预测存储在其他变量中的结果。“学到的”模式也可以输入到监督学习算法。这被认为是一个未来需要更多发展的领域。\n\
  \n在 EHR 数据分析中，第一类可能是最开发的，正如在许多其他深度监督学习应用中一样，我们随后的示例项目将关注这一类。我们将在下一节讨论各种 DL 技术的优缺点。\n\
  \nEHR 数据分析面临许多挑战，这些挑战有时对 DL 技术带来的负担比经典机器学习方法更轻。\n\n\n\n首先，EHR 数据通常由结构化数据（例如人口统计学、诊断代码、药物、实验室检查）和非结构化数据（例如医生笔记、图像）组成，有时在存储容量方面，第二种类型可能占据大部分。传统的机器学习方法在对第一类数据建模方面是有效的，因为它们可以基于维度相对较小的矩阵/向量输入进行有效计算。对于包含图像和文本的\
  \ EHR 数据，深度学习（DL）方法已经得到了发展并取得了良好成果。例如，深度学习被应用于临床笔记分类（Weng et al. 2017）和医学图像分析（Lundervold\
  \ and Lundervold 2019, Suzuki 2017, Lee et al. 2017）。\n\n其次，EHR 数据包含了医院 EMR 系统采集的海量变量。如果结合时间变量或医疗就诊，待分析的变量数量可能会进一步增加。这些变量在本质上是异质的，包括人口统计表或就诊表中的二元、分类和连续变量，以及诊断表、药物表和实验室检查表中的变量。传统方法需要领域专家和统计学家共同努力，基于原始\
  \ EHR 数据设计并提取重要特征，例如血压在连续就诊期间的上升或下降。这一步在传统机器学习领域有时被称为“特征工程”。然而，由于 EHR 数据的复杂性，这项任务可能是艰巨且耗时的，更不用说专家可能会忽略许多埋在数以万计的医疗就诊中的复杂模式。另一方面，深度学习可以直接从数据中学习有用的特征，有时其效果超过了使用最先进机器学习预测算法所使用的现有特征（LeCun,\
  \ Bengio, and Hinton 2015）。\n\n第三，从单个患者处收集的 EHR 数据在时间和变量上都是稀疏的。例如，一个患者可能连续几个月没有就诊记录，然后在某一周内有多次就诊。以诊断结果另一个例子，一个患者在单次就诊中可能在数千个\
  \ ICD 诊断代码中仅有几个。这些特征使得 EHR 不同于传统的研究设计，后者在大致规律的时间间隔测量有限的预定义变量（至少对于预测因子而言）。处理这一挑战的一种现有深度学习技术是将这些稀疏编码数据嵌入到公共空间中，并取得了良好的成果（Rajkomar\
  \ et al. 2018）。考虑到这一点，构建具有长期依赖性的传统机器学习算法可能具有挑战性且难以调整，而已经开发出多种深度学习技术来模拟长期或短期时间依赖性（Hochreiter\
  \ and Schmidhuber 1997, Chung et al. 2014）。\n\n最后，EHR 主要为计费和管理目的而设计，有时可能会缺失详细的医疗信息（例如临床笔记）。深度学习的一个大问题是其可解释性。尽管取得了成功，深度学习模型可能仍然缺乏解释其预测的能力。在解决这个问题方面已经取得了一些进展，例如注意力机制。另一个挑战是需要大量数据来有效训练深度学习模型。\n\
  \n本章的其余部分结构如下：我们将回顾现有的深度学习方法并介绍一些应用。由于专注于 EHR，我们将回顾范围限制在结构化数据上，并以讨论和未来方向结束本章。\n\n\
  ## 9.2 深度学习方法\n\n深度学习技术可以根据其网络结构进行分类。我们将简要介绍常用的模型。\n\n深度学习模型的基本类型是多层感知器（`MLP`）（[Hastie,\
  \ Tibshirani, and Friedman 2001]),它在 20 世纪 80 年代非常流行。顾顾义，它由多个层组成，输入通过神经元。`MLP` 通常用于预测（Shickel\
  \ et al. 2018）。\n\n第一种现代深度学习方法可能是深度卷积网络（LeCun, Bengio, and Hinton 2015）。`CNN` 通常在输入上采用卷积层，以便考虑相邻输入之间的相关性，并通过池化层进一步降低数据维度。`CNN`\
  \ 的应用包括疾病风险（Goldstein, Navar, and Pencina 2016）、诊断（Haenssle et al. 2018）和再入院（Nguyen\
  \ et al. 2017）。`CNN` 模型也可以通过对 EHR 的语义理解应用于疾病预测，图 9.2。\n\n为了处理时间输入，开发了循环神经网络（`RNN`）用于从不同时间点收集的序列输入中学习。为了适应输入可能的长期或短期时间依赖，开发了长短期记忆（`LSTM`）（Hochreiter\
  \ and Schmidhuber 1997）和门控循环单元（`GRU`）（Chung et al. 2014），以允许自动将过去和当前输入连接的类似于“记忆”的能力（图\
  \ 9.3）。`RNN` 的应用示例包括预测发病（Rasmy et al. 2018, Maragatham and Devi 2019）和再入院。某些 `GRUs`（Che\
  \ et al. 2018）还解决了 EHR 时间序列数据中的缺失值问题。\n\n\n\n\n\n深度学习中另一种令人兴奋的技术可能是生成对抗网络（GAN）。这种技术同时训练两个竞争性的神经网络。其中一个网络（生成器）旨在尽可能地模拟真实数据，而另一个网络（判别器）则旨在区分模拟数据和真实数据点。GAN\
  \ 在电子健康记录（EHR）中的应用包括合成数据}(Baowaly et al. 2019)和疾病预测}(Hwang, Choi, and Yoon 2017)（图\
  \ 9.4）。\n\n![图 9.4 基础生成对抗网络（GAN）框架。](img/fig9_4.jpg)\n\n**图 9.4**\n\n一个基础生成对抗网络（GAN）框架。\n\
  \n选择深度学习架构应取决于数据和建模目标，不同的架构都有其优缺点。`CNN` 有助于处理数据的空间和时间依赖性，因此它是这种依赖性很强的图像和文本的自然选择。通常，`CNN`\
  \ 的训练速度很快，但它受限于局部依赖结构。`RNN` 擅于处理长期和短期依赖关系。它能够对具有复杂依赖的长时间序列进行更好的建模，尽管在计算上收敛较慢。`GAN`\
  \ 在一个框架中整合两个子架构（生成器和判别器），因此选择 `GAN` 可能允许用户完成比预测之外的任务。对于子架构，可以使用 `CNN`、`RNN` 或其他架构。然而，通常\
  \ `GAN` 的训练要困难得多，而且次优的结构和实现可能由于收敛失败而导致模拟和预测的性能不佳。我们建议用户根据其目标、数据结构的复杂性（例如依赖关系）、计算基础设施、数据量以及在深度学习训练方面的经验来选择深度学习架构。\n\
  \n## 9.3 深度学习软件工具与实现\n\n现在有许多用于构建和实现深度学习网络的软件工具，并且通常是开源的。一些流行的包包括 `TensorFlow`、`Torch/Pytorch`、`CNTK`、`Keras`、`Caffe`\
  \ (2)、`Theano`、`MXNet` 和 `H2O`。通常，由于这些包被许多大型科技公司使用，随着时间的推移一直在不断完善。网上或书籍中有大量的教程。例如，`TensorFlow`\
  \ 为不同水平的用户提供了在线教程([`www.tensorflow.org/tutorials`](https://www.tensorflow.org/tutorials))。这些使得为\
  \ EHR 数据分析和预测快速开发新的深度学习算法成为可能。根据我们的经验，Python 包 `TensorFlow` 和 `pytorch` 是 EHR 数据分析的良好选择。`TensorFlow`\
  \ 的最新版本包含了 `Keras`。这两个软件工具的优缺点总结如下：\n\n*   `TensorFlow` 由 Google 持续开发并有社区贡献。它是一个成熟的框架，拥有大量的社区支持，可以部署在不同的平台上（例如手机、服务器）。\n\
  \    *   优点：成熟、易用（特别是集成了 `TensorFlow` 2 中的 `Keras`）、社区支持大、生产就绪、可视化界面（Tensor Board）。\n\
  \    *   缺点：不够 Python 风格（特别是使用基础 `TensorFlow` 时）、向后兼容（`TensorFlow` 2 相比于 1，尽管有转换脚本）、在某些支持\
  \ GPU 的平台上难以安装。\n*   `pytorch` 开发由 Facebook 领导并有社区贡献。\n    *   优点：成熟、易学（大部分就像普通的\
  \ Python 代码）、易安装、易调试、控制更详细。\n    *   缺点：代码工作量大（如果不使用 `Keras`）、速度取决于自定义。\n\n## 9.4\
  \ 应用示例\n\n### 案例研究 1：MLP 在死亡预测中的应用\n\n我们使用之前章节描述的蛛膜下出血（SAH）应用示例来说明深度学习技术。在该应用中，我们的目标是探索\
  \ `MLP` 预测死亡的性能。这里的死亡定义为未来 24 小内的死亡。预测因子包括人口统计学、血管收缩剂的使用、药物、操作、基础诊断以及入院前的观察窗口汇总信息。在这个示例中，`MLP`\
  \ 模型使用 `H2O` 包在 `R` 中实现，并使用 `Auto-ML` 平台进行参数调优。参数包括激活函数、隐藏层数、迭代次数、神经元数量、学习率、丢弃率等。第一步，我们需要将训练和测试数据集导入\
  \ `R` 并检查每个数据集的维度：\n\n![image](img/inline9_1.jpg)\n\n然后我们开始在 `R` 中使用 `H2O` 包：\n\n\
  ![image](img/inline9_2.jpg)\n\n原始数据使用 `R` 的 `data.frame` 存储。为了在 `H2O` 中实现 `MLP`，我们将训练和测试数据集转换为\
  \ `H2OFrame`，然后对结果和预测因子进行标记：\n\n![image](img/inline9_3.jpg)\n\n在清洗和预处理数据后（详情见第 4\
  \ 章和第 5 章），我们从 EHR 数据库中提取了 3956 名患者的 1475 个预测因子。`Auto-ML` 选择了一个单隐藏层神经网络模型，测试集的 `AUC`\
  \ 为 0.94（95% CI: 0.92–0.95）。实现的 `R` 代码和相应结果所示：\n\n![image](img/inline9_4.jpg)\n\n\
  ### 案例研究 2：RNN 在高血压患者心衰预测中的应用\n\n对于慢性病人，可以使用多次就诊和长期随访的 EHR 数据。`RNN` 是 ANN 模型的一个良好选择，可以利用纵向就诊中的丰富信息。然而，我们应该指出，应用经典的纵向模型（例如混合效应回归模型）并不简单，因为结果变量和预测因子是在不规则的时间测量的，时间间隔也可以提供结果信息。在这个示例中，我们展示了一个使用循环神经网络（RNN）模型预测心衰（HF）的项目。\n\
  \n#### 实验设置\n\n本研究的目标是将动态变量（来自诊断、药物、操作、实验室检查程序和手术表的变量）和静态预测因子（例如年龄、性别、种族、就诊次数、时间跨度和访问密度）相结合，以预测高血压患者的心衰发。本研究的纳入标准为：未本质高血压患者，即符合以下\
  \ ICD-9 代码之一：“401”、“401.0”、“401.1”、“401.9”。为了节省计算时间，我们随机抽取了 40,000 名高血压患者进行心衰发的建模和预测。\n\
  \n心衰病例定义：心衰发的标准采用了之前的疾病预测研究}(Gurwitz et al. 2013, Ng et al. 2016, Choi 等人)。要确认患者的心衰病例，患者记录中的心衰相关\
  \ ICD-9 代码应在 12 个月内出现三次或以上的临床就诊。首次出现心衰相关 ICD-9 代码的日期被设定为该患者的心衰发。\n\n心衰对照组定义：符合纳入标准但未被分类为心衰病例的高血压患者。\n\
