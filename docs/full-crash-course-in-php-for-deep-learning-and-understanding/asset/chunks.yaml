    ![](Images/image00874.jpeg)


    # Full crash course in PHP for deep learning and understanding


    Dean Grey


    ## A Short Introduction to PHP


    PHP stands for Hypertext Processor. It is a server side scripting language that
    is used to produce dynamic web content among other things. This means that everything
    `PHP` does is not done on the computer that is used to view the web pages, called
    the client, but a specialised computer called a server that houses all the webpages
    that you are viewing on the client machine.


    Being a scripting language means that `PHP` can’t really be used to make standalone
    applications that run on your computer as it is designed to only do things when
    an event happens within web pages like; clicking on a link or getting form data
    when a web form is sent.


    You can embed `PHP` into your `HTML` web pages and produce pages that are customised
    according to the information you get from your users. This ends up making webpages
    more exciting than if they were just static. `PHP` can be used to produce web
    pages because its final output is `HTML`.


    It is very efficient in the server side, widely used, cross-platform (runs on
    `Windows`, `Linux`, `UNIX`, `Mac OS X`, etc.) and easier to learn than any other
    fully featured language like `C`, `Java` or `Perl`.


    `PHP` is also very powerful. If you ever doubt its power, just look carefully
    at the link in your browser next time you decide to log on to `Facebook`. You
    will notice that the largest social networking site on the planet is powered by
    `PHP`! Even `Wikipedia` (That site which tells you everything you need to know)
    is powered by `PHP`. That is the power that is behind `PHP`, and it makes it a
    good alternative to its competitors such as Microsoft’s Active Server Pages (`ASP`).


    It also has an active community that can really help you in a bind and always
    active. According to the [`http://www.w3schools.com ]](http://www.w3schools.com)
    `PHP` page; this is what `PHP` will allow you to do:


    * `PHP` can generate dynamic page content

    * `PHP` can create, open, read, write, delete, and close files on the server

    * `PHP` can collect form data

    * `PHP` can send and receive cookies

    * `PHP` can add, delete, modify data in your database (that is why it is a perfect
    match for `MySQL`)

    * `PHP` can be used to control user-access

    * `PHP` can encrypt data


    ## A Short Introduction to MySQL


    `MySQL` is a popular open source relational database that uses `SQL` as its base.
    It enables you to store, retrieve and manipulate data. It is a highly efficient
    and scalable solution that is also cost effective.


    Many web based programs (including computer programs) use databases to store their
    information. Things like social applications need a place to store user information,
    pictures, posts, comments etc. that is where a database like `MySQL` comes in
    handy and makes storing and retrieving large amounts of information a breeze.


    `SQL`, often pronounced as sequel, stands for Structured Query Language. It is
    simply a language designed for management of data by databases like `MySQL`. They
    use `SQL` to send and retrieve data using specialised commands that really aren’t
    all that hard to learn. And most importantly, for this book, you can embed `SQL`
    into programming languages like `PHP`.


    Also, `MySQL` is open source and is available for free and can be changed by modifying
    the source code, if particular features don’t suit your fantacy.


    ## What We Will Cover in This Book


    This book is separated into four main chapters or hours that help you get to the
    heart of `PHP` and `SQL` and send you on your way to being a master in no time.


    In the first hour we will spend time installing the much needed web server package
    called `XAMPP`. I recommend that you download it here: [`https://www.apachefriends.org/index.html
    ]](https://www.apachefriends.org/index.html) before we start that chapter. This
    will enable us to run examples throughout this book. Then we shall pick a text
    editor for our `PHP` code. Then we will look at how to run `PHP` scripts and,
    finally, we shall cover some of the basics of `PHP`, such as comments, variables,
    constants and operators.


    The examples in this book can be typed out or, to save time, copied and then pasted
    into your code editor or command line interface.


    In the second hour, we shall continue with `PHP` and cover conditional statements,
    `Loops`, `Arrays` and functions. After this chapter, you should consider yourself
    well acquainted with `PHP` to tackle further advanced topics.


    You can take a break after this part and let it all sink in and make another cup
    of coffee.


    In the third hour we tackle `MySQL` and its commands, but first we learn how to
    access the command line. Then we move on to the commands that let us create and
    delete databases; create, alter and delete tables; insert, select, update and
    delete data in the tables.


    Finally, in the final hour, we put `PHP` and `MySQL` together and create a simple
    website to to show you how these two work together hand in hand.


    Let us get to it. Grab your first cup of coffee!


    # Chapter 1 - Hour 1: Installing and PHP Basics


    “The way to get started is to take the first step with dream-powered optimism.”
    - Debasish Mridha


    ![](Images/image00875.jpeg)![](Images/image00876.jpeg)This chapter we will cover:

    * Installing a web server

    * Installing a text editor


    ![](Images/image00877.jpeg)Starting Apaches to run `PHP` scripts


    ![](Images/image00878.jpeg)Creating and running a `PHP` script


    ![](Images/image00879.jpeg)`PHP` basics (comment, variables, operators, constants,
    strings)


    Bear with me a little. I know that the first chapter of every programming book
    piles on the theory to make sure you know what you are getting into. But that
    is for later on. For now you need to install the server and choose an appropriate
    text editor!


    ## Installing a Web Server


    Your first real step to `PHP` mastery has led you here. You can’t just run `PHP`
    in a browser like you do with `HTML`. To run `PHP`, you are going to need a server
    installed on your local machine in order for the browser to parse `PHP` scripts
    and run `MySQL` queries to the database to return results. Alternatively, you
    can use a host that supports `PHP` and `MySQL` so that they can upload it to their
    server and you can test and deploy your dream site right there. But I’m guessing
    you really want to test it locally. So, we will install a local server that makes
    your very own computer become a test server.


    There are many servers you can install on your local machine such as `XAMP`, `WAMP`
    (for windows), and `MAMP` for `Mac OS X`, etc., but this book covers `XAMP`. It
    is a free open source cross platform web server package available for Windows,
    Mac and Linux.


    Go to this website [https://www.apachefriends.org/index.html](http://www.apachefriends.org/index.html)
    and download the latest version of `XAMP` for windows (the same steps can be easily
    translated to Mac or Linux). Once the download is finished, locate the file on
    your local machine and double-click it to install it.


    Simple! Now `PHP` and `MySQL` are ready for use.


    **NOTE**: If you have an antivirus running at this time, it may interfere with
    the process. You might want to switch it off until the server is done installing
    to avoid any potential problems.


    ## Installing a Text Editor


    Now, you will need a text editor to write some beautiful `PHP`. Ideally, any text
    editor would do, even the default notepad on windows or terminal for Mac OS X
    can be used when writing `PHP`. We will use `notepad++` because it has some nifty
    features which can contribute towards writing clean and efficient code in a fast
    way, such as syntax highlighting and auto complete.


    Plus it’s free!

    '
