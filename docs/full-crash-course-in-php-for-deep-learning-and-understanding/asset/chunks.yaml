    +–––––—+––––-+––––—+–––––-+


    | Parachutes      | Coldplay    | 1999-07-10   |             10 |


    | Prospekts March | Coldplay    | 2008-09-21   |              8 |


    | X & Y           | Coldplay    | 2005-06-01   |             13 |


    +–––––—+––––-+––––—+–––––-+


    NOTE: This example was done on a text field, hence, the single quotes on the value
    we want to check against. You can check against numeric fields too. Just remove
    the single quotes and make sure you type a numeric value that corresponds to the
    numeric data type of that field.


    You can further filter out the record using the ANDandOR operators to narrow down
    the results further:


    The AND operator displays records that match both conditions of the criterion:


    SELECT AlbumName, AlbumArtist,AlbumType


    FROM Albums


    WHERE AlbumArtist \= ‘Coldplay’ AND AlbumType \= ‘A’;


    The output should display results where the AlbumName is Coldplay and the AlbumType
    is


    ‘L’. If any record doesn’t match that criterion, it will be excluded:


    +––––+––––-+–––—+


    | AlbumName  |AlbumArtist | AlbumType |


    +––––+––––-+–––—+


    | Parachutes | Coldplay    | A         |


    | X & Y      | Coldplay    | A         |


    +––––+––––-+–––—+


    The OR operator is used to return records that match either of the one of the
    criterion specified.


    SELECT AlbumName, AlbumArtist, AlbumType


    FROM Albums


    WHERE AlbumType \= ‘E’ OR AlbumType \= ‘M’;


    In the above example, any record that has either AlbumType of ‘E’ or AlbumType
    of ‘M’ will be displayed. The rest will be excluded. The output should be as follows:


    +––––––-+––––-+–––—+


    | AlbumName         | AlbumArtist | AlbumType |


    +––––––-+––––-+–––—+


    | Back to the Woods | Angel Haze  | M         |


    | Prospekts March   | Coldplay    | E         |


    +––––––-+––––-+–––—+


    The ORDER BY Keyword


    In order to sort the result\_set (the table returned by a SELECT statement) by
    one or more columns, we use the ORDER BY keyword and specify whether it should
    be in descending or ascending order:


    SELECT AlbumName, AlbumArtist


    FROM Albums


    ORDER BY AlbumArtist ASC;


    NOTE: By default, they are sorted in ascending order. This means that if we leave
    out the ASC keyword, it would not make a difference. We can sort them in descending
    order by replacing ASC with DESC in the above example.


    That should output records in ascending order based on the name of the artist
    of the album:


    +–––––––––+––––—+


    | AlbumName                 | AlbumArtist  |


    +–––––––––+––––—+


    | Dirty Gold                | Angel Haze   |


    | Back to the Woods         | Angel Haze   |


    | Parachutes                | Coldplay     |


    | Prospekts March           | Coldplay     |


    | X & Y                     | Coldplay     |


    | Rush of Blood to the Head | Coldplays    |


    | Random Access Memories    | Daft Punk    |


    | 1989 (Delux Edition)      | Taylor Swift |


    +–––––––––+––––—+


    The UPDATE Statement


    Looking back at the some of the records we have displayed so far, it seems we
    made a mistake and named Coldplay as Coldplays in one of the records. This can
    be corrected by updating that record using the UPDATE statement..


    If we output the record now with the following code:


    SELECT AlbumID, AlbumName, AlbumArtist


    FROM Albums;


    The output should be:


    +–––+–––––––––+––––—+


    | AlbumID | AlbumName                 | AlbumArtist  |


    +–––+–––––––––+––––—+


    |       1 | Rush of Blood to the Head | Coldplays    |


    |       2 | Dirty Gold                | Angel Haze   |


    |       3 | Back to the Woods         | Angel Haze   |


    |       4 | Parachutes                | Coldplay     |


    |       5 | 1989 (Delux Edition)      | Taylor Swift |


    |       6 | Prospekts March           | Coldplay     |


    |       7 | Random Access Memories    | Daft Punk    |


    |       8 | X & Y                     | Coldplay     |


    +–––+–––––––––+––––—+


    We update that recode like this:


    UPDATE Albums


    SET AlbumArtist \= ‘Coldplay’ WHERE AlbumID \= 1;


    Warning: Don’t omit the WHERE clause or all the records in the table will be updated.


    If we output it now, we should see the record has been updated:


    +–––+–––––––––+––––—+


    | AlbumID | AlbumName                 | AlbumArtist  |


    +–––+–––––––––+––––—+


    |       1 | Rush of Blood to the Head | Coldplay     |


    |       2 | Dirty Gold                | Angel Haze   |


    |       3 | Back to the Woods         | Angel Haze   |


    |       4 | Parachutes                | Coldplay     |


    |       5 | 1989 (Delux Edition)      | Taylor Swift |


    |       6 | Prospekts March           | Coldplay     |


    |       7 | Random Access Memories    | Daft Punk    |


    |       8 | X & Y                     | Coldplay     |


    +–––+–––––––––+––––—+


    Deleting Records in a Tables


    To delete records in a table, we use the DELETE statement. The following example
    deletes the record/row from the table with an AlbumID of 1:


    DELETE FROM Albums


    WHERE AlbumID \= 1;


    Warning: Don’t omit the WHERE clause or all the records in the table will be deleted.


    Now we output the records in the table. We will limit the number of columns to
    only AlbumID, AlbumName and AlbumArtist. The record with an AlbumID of 1 should
    be missing from the result\_set because it has been deleted.


    +–––+––––––––+––––—+


    | AlbumID | AlbumName              | AlbumArtist  |


    +–––+––––––––+––––—+


    |       2 | Dirty Gold             | Angel Haze   |


    |       3 | Back to the Woods      | Angel Haze   |


    |       4 | Parachutes             | Coldplay     |


    |       5 | 1989 (Delux Edition)   | Taylor Swift |


    |       6 | Prospekts March        | Coldplay     |


    |       7 | Random Access Memories | Daft Punk    |


    |       8 | X & Y                  | Coldplay     |


    +–––+––––––––+––––—+


    If you want to delete all records in the table, the following DELETE statement
    will do just that:


    DELETE from Albums;


     Summary


    Okay, now that you are familiar with basics of MySQL and can access it using the
    command line and use it to create and delete databases; create, alter and delete
    tables; select, insert, update, and delete table data; and do other neat things
    with data like filtering it and ordering it the way you want using MySQL commands,
    it is the time to move on


    and look at how we can use PHP and MySQL together and create a very simple website
