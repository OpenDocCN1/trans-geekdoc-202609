    Let us break this down and look at the most interesting bits.


    We have to check if the information was submitted by the form before we work with
    it. We do this with an if statement and use the isset() built in PHP function
    that checks if a variable is null. We pass in the associative array $\_POSTas
    a parameter. It contains all values inputted into the form found in form.php.
    The array is passed to the script via the post method of the form:


    if(isset($\_POST\[‘submit’\])) {


    }


    Inside the conditional statement, we then declare an array to check if we happen
    to have missed any if the form inputs:


    $null\_fields \= array();


    Next we start checking if any the values in the array are empty before we send
    them to the database. If so, we add them to the $null\_fields array if not, we
    create a variable and store them there. We will just look at one of the if…else
    statements because the rest a similar:


    if (empty($\_POST\[‘first\_name’\])) {


    $null\_fields\[\] \= ‘First Name’;


    } else {


    $first\_name \= trim($\_POST\[‘first\_name’\]);


    }


    We do this for the rest of values in the $\_POST array.


    Warning: This may not be the most secure way of verifying data before it goes
    to the database. For that we need to use regular expressions and that is an advanced
    topic. We are just trying to keep things simple.


    Next we have to check if the $null\_fields array turned out empty. This means
    all the data was submitted:


    if (empty($null\_fields)) {


    }


    If we are inside that condition, it means that all the data was submitted and
    we can query the database. We use the INSERT TO statement to insert the data into
    the FamilyMembers table. We follow the rules used to insert data into a table
    by making sure the variables are in the same order as they are defined in the
    tables. We declared an extra variable before the creating the query string to
    pass in as a null value for the primary. We also make sure the number of parameters
    match the number of fields in the table:


    $null\_variable \= NULL;


    $sql \= “INSERT INTO FamilyMembers VALUES (‘$null\_variable’, ‘$first\_name’,


    ‘$last\_name’, ‘$age’, ‘$gender’, ‘$relationship’)”;


    Next, we use query database using the mysqli\_query(), passing in the connection
    and query string as parameters, while simultaneously checking for any errors return
    by the function. It returns FALSE on failure. If errors are found, we display
    them so they can be fixed. If not errors are found, we echo a success message:


    if (!mysqli\_query($conn, $sql)) {


    die (‘Error: ‘ . mysqli\_error($conn));


    }else {


    echo “Family member has been entered!”;


    }


    So now we are done with what happens when the player inputs all the data, but
    if he misses any, we should display to him the fields he missed by looping through
    the


    $null\_fields array using a foreach loop and echoing them to the screen.


    else {


    echo “You need to enter the follwing missing data: <br />”;


    foreach ($null\_fields as $null\_field) {


                  echo $null\_field . “<br />”;


    }


    }


    Then after that, we exit the condition that checks if the $\_POST array is empty
    and close the connection to the database:


    mysqli\_close($conn);


    Then right after the closing PHP tag we display the form again that allows for
    the PHP script to call itself so that we can continue inputting data or re-enter
    data in case we forgot some fields.


    And we are done! Now we should be able to add family members and view them. We
    should also be able to navigate between pages using the buttons on the top right
    corner of the forms or table that allow you switch between the pages.


    Start up the index page and go to the form page to add some data


    ![](Images/image00931.jpeg)


    Click the ADD button to add the member to database. You should see the success
    message:


    ![](Images/image00932.jpeg)


    Click the View Members button to verify. The below window should display with
    the new member added:


    ![](Images/image00933.jpeg)


    Summary


    So there you have it! Before this chapter we looked at PHP and MySQL separately
    and in this chapter was aimed at consolidating the two, and showing how to use
    them to produce dynamic content. It should not be that hard to modify the website
    to do whatever you need it to do as you are now capable.


    In the chapter we created a configuration file that stored the connection to the
    database and used it all throughout the website to establish a connection to the
    database and query it to store and retrieve data. We created a page that enables
    you to view information about the family members you have added to database. We
    also created a page with a form for inputting the data and a page that has the
    PHP needed to process the data when the form is submitted.'
