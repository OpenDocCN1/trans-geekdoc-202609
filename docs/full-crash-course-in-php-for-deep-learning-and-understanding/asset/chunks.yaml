  trans: "\n另一种值得的数组类型是多维数组。这些是包含其他数组的数组。但这是一个高级主题，你可以进一步研究。\n\n## 总结\n\n恭喜你！你现在已经熟悉\
    \ PHP 的基础知识。到目前，你应该能够看到 PHP 为你提供的强大。在本章中，我们讨论了条件语句，它允许你编写的代码根据指定的条件做出决策。然后，我们查看了循环，它会执行代码块，直到指定的条件返回假或元素耗尽。接下来，我们讨论了如何通过将代码放入函数并在程序中多次调用，以及如何向它们传递信息并让它们返回值。最后，我们研究了数值数组和关联数组。我们通过直接访问它们或遍历它们来创建它们并返回值。\n\
    \n现在，你准备好从 PHP 中休息一下，去泡杯咖啡了。这只会变得更有趣！\n\n# 第 3 章 - 第 3 小时：MySQL 基础\n\n[“告诉我，我会忘记；教我，我可能会记得；让我参与，我就会学会。”\
    \ - 班杰明·富兰林](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)\n\n\
    [富兰林](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)\n\n在本章中我们将涵盖：\n\
    \n![](img/image00910.jpeg) 启动 MySQL\n![](img/image00911.jpeg) 创建和删除数据库\n![](img/image00912.jpeg)\
    \ 创建、读取、更新和删除表 (CRUD)\n\n既然我们已经研究了 PHP，让我们看看是什么让 PHP 能够在网页中填充内容。那就是如 `MySQL` 这样的数据库。我们将学习你认为自己\
    \ `MySQL` 基础大师需要知道的大部分内容，并完成你实现梦想的下一步所需的操作。\n\n这将是轻而易举，因为我们将学习如何使用数据库做一些非常酷的事情。\n\
    \n下面我们将将在数据库中创建并使用的表图片。我们只是向音乐数据库中添加专辑。你可以在最上方看到表名，表名下方是字段或列。\n\n### Albums（专辑）\n\
    \n![](img/image00913.jpeg) `AlbumID` `AlbumName` `AlbumArtist` `AlbumType` `NumberOfTracks`\
    \ `DateReleased`\n\n## 启动 MySQL 客户端\n\n我们这一小时要做的的是使用 `XAMPP` 自带的 `MySQL` 客户端命令行输入\
    \ `MySQL` 命令，只需打开 Windows 命令提示符并导航到 `XAMPP` 安装的根文件夹。\n\n当你打开命令提示符时，输入以下命令导航到“C”\
    \ 盘（假设 `XAMPP` 安装在那里），然后按回车：\n\n```bash\ncd \\\n```\n\n现在，导航到客户端执行文件安装的位置以启动它。通过输入以下命令并按回车进入\
    \ `xampp->mysql->bin`：\n\n```bash\ncd xampp\\mysql\\bin\n```\n\n到达那里后，输入以下命令：\n\
    \n```bash\nmysql -u your_username -p\n```\n\n将 `your_username` 替换为你的实际用户名。默认是\
    \ `root`。然后你会被要求输入密码。输入完毕后，按回车。默认情况下密码为空，出于安全考虑，你真的应该更改它。但这超出了此本书的范围。\n\n如果你注意到命令行提示符显示的是一个名为\
    \ `MariaDB` 的东西。不要困惑，因为它只是 `MySQL` 关系型数据库管理系统的社区开发分支。大量的 `SQL` 命令仍然有效，而且与之前的 `MySQL`\
    \ 提示符不同，它会让你知道选择了哪个数据库。\n\n现在我们准备好开始了！\n\n**提示**：或者，你可以使用 `phpmyadmin` 界面只需点击几次即可创建数据库和表。你也可以在那里输入\
    \ `SQL` 命令，但由于我们想要尽快进入硬核阶段，我们不会那样做。此外，希望这一小时的内容到目前为止都不难。\n\n## 创建和删除数据库\n\n让我们从输入以下命令来创建一个数据库开始：\n\
    \n```sql\nCREATE DATABASE music;\n```\n\n始终记住这一点：\n\n![](img/image00914.jpeg)\
    \ 从这里开始，输入的所有语句和命令都应该以分号或 `/` 结尾。否则客户端会认为你仍在输入命令而不会执行。\n\n![](img/image00915.jpeg)\
    \ 虽然不是强制的，因为命令行不区分大小写，但 `MySQL` 命令使用大写字母输入以区分它们。\n\n删除数据库很简单：\n\n```sql\nDROP\
    \ database_name;\n```\n\n现在我们已经创建了数据库，我们需要选择它：\n\n```sql\nUSE music;\n```\n\n\
    **警告**：命令行提示符看起来 own 像 `music>`。\n\n## 创建、修改和删除表\n\n现在我们已经选择了数据库，让我们创建一些表。\n\n\
    ### 创建表\n\n```sql\nCREATE TABLE Album (\n    AlbumID smallint unsigned NOT NULL\
    \ AUTOINCREMENT PRIMARY KEY,\n    AlbumName varchar(255) NOT NULL,\n    AlbumArtist\
    \ varchar(80) NOT NULL,\n    AlbumType ENUM('A', 'E', 'M') NOT NULL,\n    NumberOfTracks\
    \ varchar(3) NOT NULL,\n    DateReleased DATE NOT NULL\n);\n```\n\n**提示**：在输入长命令时很容易出错。使用键盘上的上箭头调出之前的命令，并使用左、右箭头导航到出错的地方并进行修复。\n\
    \n要查看你数据库中的表列表，输入：\n\n```sql\nSHOW TABLES;\n```\n\n你看到以下输出：\n\n```\n+----------------+\n\
