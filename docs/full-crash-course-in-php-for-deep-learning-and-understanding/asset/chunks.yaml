    \ 20”，因为它满足了第二个条件：\n\n```php\n<?php\n$x = 50;\nif ($x < 10) {\n    echo \"$x 小于\
    \ 10!\";\n} else if ($x > 20) {\n    echo \"$x 大于 20!\";\n}\n?>\n```\n输出：\n50\
    \ 大于 20\n\n### If…elseif…else 语句\n\n`if…elseif…else` 语句与 `if…else` 语句相同，区别在于当所有条件都失败时，会执行最后一个代码块。下面的示例将输出“15\
    \ 在 10 到 20 之间”，因为 `$x` 是 15。它需要小于 10 以满足第一个条件，大于 20 以满足第二个条件，否则它在 10 到 20 之间：\n\
    \n```php\n<?php\n$x = 15;\nif ($x < 10) {\n    echo \"$x 小于 10!\";\n} else if\
