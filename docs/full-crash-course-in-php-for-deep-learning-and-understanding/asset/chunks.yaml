    \  | Null | Key | Default | Extra          |\n\n+––––—+–––––––—+––+–—+–––+–––––-+\n\
    \n| MemberID     | int(10) unsigned      | NO   | PRI | NULL    | auto\\_increment\
    \ |\n\n| FirstName    | varchar(80)           | NO   |     | NULL    |              \
    \  |\n\n| LastName     | varchar(80)           | NO   |     | NULL    |              \
    \  |\n\n| Age          | int(3) unsigned       | NO   |     | NULL    |              \
    \  |\n\n| Gender       | enum(‘Male’,‘Female’) | NO   |     | NULL    |              \
    \  |\n\n| Relationship | varchar(80)           | NO   |     | NULL    |              \
    \  |\n\n+––––—+–––––––—+––+–—+–––+–––––-+\n\nThen we insert values into the tables:\n\
    \nINSERT INTO FamilyMembers VALUES\n\n(NULL, ‘Robert’, ‘Williams’, 52, ‘Male’,\
    \ ‘Father’), (NULL, ‘Martha’, ‘Williams’, 49, ‘Female’, ‘Mother’), (NULL, ‘Doreen’,\
    \ ‘Williams’, 18, ‘Female’, ‘Sister’), (NULL, ‘Jace’, ‘Williams’, 13, ‘Female’,\
    \ ‘Adoptive Sister’), (NULL, ‘Benson’, ‘Williams’, 22, ‘Male’, ‘Brother’), (NULL,\
    \ ‘Timothy’, ‘James’, 23, ‘Male’, ‘Cousin’);\n\nWhen we select all the records\
    \ in the table, we see something like this:\n\n+–––-+–––—+–––-+–—+––—+–––––—+\n\
    \n| MemberID | FirstName | LastName | Age | Gender | Relationship    |\n\n+–––-+–––—+–––-+–—+––—+–––––—+\n\
    \n|        1 | Robert    | Williams |  52 | Male   | Father          |\n\n|      \
    \  2 | Martha    | Williams |  49 | Female | Mother          |\n\n|        3 |\
    \ Doreen    | Williams |  18 | Female | Sister          |\n\n|        4 | Jace    \
    \  | Williams |  13 | Female | Adoptive Sister |\n\n|        5 | Benson    | Williams\
    \ |  22 | Male   | Brother         |\n\n|        6 | Timothy   | James    |  23\
    \ | Male   | Cousin          |\n\n+–––-+–––—+–––-+–—+––—+–––––—+\n\nNow we are\
    \ done with the command line (but not MySQL), so we can close that.\n\nCreate\
    \ PHP configuration File for the Website\n\nWe must first create a folder and\
    \ name it “Family” and place in it in the htdocs folder. This folder is located\
    \ in the root directory of our XAMPP installation. Then we create a file called\
    \ config.php and place it in the root folder of our website\n\nWarning: for security\
    \ purpose this file needs to be placed outside of the server because, while it\
    \ is not easy to read PHP through the browser, it can happen if the server is\
    \ misconfigured. But since we want to keep this as simple as possible, we will\
    \ place it here.\n\nNext we define the constants needed to establish out connection\
    \ string that we shall use too connect to the music database:\n\n<?php\n\n             \
    \ define(‘DB\\_NAME’, ‘Family’);\n\n              define(‘DB\\_USER’, ‘root’);\n\
    \n              define(‘DB\\_PASSWORD’, ”); \n\n              define(‘DB\\_HOST’,\
    \ ‘localhost’);\n\n?>\n\nWarning: for security reason, putting in a plain text\
    \ password is a major security risk. You can use hash() and store the hash in\
    \ the configuration file config.php. Then you can check if the entered password\
    \ matches the hash when logging in.\n\nThen we establish the connection string\
    \ by passing in the constants; host name, username, password, and database name\
    \ to the method that establishes the connection:\n\n<?php define(‘DB\\_NAME’,‘Family’);\
    \ define(‘DB\\_USER’,‘root’); define(‘DB\\_PASSWORD’,”); define(‘DB\\_HOST’,‘localhost’);\n\
    \n$conn \\= @mysqli\\_connect(DB\\_HOST, DB\\_USER, DB\\_PASSWORD, DB\\_NAME);\n\
    \n?>\n\nNow we need to check if the connections succeeded or not. If it didn’t,\
    \ we display the appropriate error message and stop execution of the PHP script:\n\
    \n<?php define(‘DB\\_NAME’,‘Family’); define(‘DB\\_USER’,‘root’); define(‘DB\\\
    _PASSWORD’,”); define(‘DB\\_HOST’,‘localhost’);\n\n$conn \\= @mysqli\\_connect(DB\\\
    _HOST, DB\\_USER, DB\\_PASSWORD, DB\\_NAME);\n\nif (!$conn) {\n\n             \
    \ die(‘Could not connect: ‘ . mysqli\\_connect\\_error());\n\n}\n\n?>\n\nAnd that’s\
    \ it for establishing the connection string. This script will be required by every\n\
    \nPHP script that needs to connect to the database to work with the data.\n\n\
     Creating the Index Page\n\nNow we need to create the landing page which shall\
    \ list the family members that are in\n\nour family database in a table. We are\
    \ going to add some CSS (by linking to external style sheets) to create an attractive\
    \ table to display our data in.\n\nWe create a file named index.php and place\
    \ it root directory of the website. The code for file should look something like\
    \ this:\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<link rel=“stylesheet” type=“text/css”\
    \ href=“css/main.css”>\n\n<link rel=“stylesheet” type=“text/css” href=“css/table\\\
    _styling.css”>\n\n</head>\n\n<body>\n\n<div id=“container”>\n\n<div id=“header”>\n\
    \n<h2>My Family</h2>\n\n</div>\n\n<div id=“btn\\_add”>\n\n<a href=“form.php”>ADD</a>\n\
    \n</div>\n\n<div id=“content”>\n\n<?php\n\nrequire\\_once(‘config.php’);\n\n                                         \
    \ $sql \\= “SELECT MemberID, FirstName, LastName, Age, Gender, Relationship\n\n\
                                                                          FROM FamilyMembers”;\n\
    \n$response \\= @mysqli\\_query($conn, $sql);\n\n                                         \
    \ if ($response){\n\necho ‘<table>\n\n                                                                     \
    \ <tr>\n\n                                                                                   \
    \ <th>Member ID</th>\n\n                                                                                   \
    \ <th>First Name</th>\n\n                                                                                   \
    \ <th>Last Name</th>\n\n                                                                                   \
    \ <th>Age</th>\n\n                                                                                   \
    \ <th>Gender</th>\n\n                                                        \
    \                            <th>Relationship</th>\n\n                                                                     \
    \ </tr>’;\n\n                                                       while ($row\
    \ \\= mysqli\\_fetch\\_array($response)){\n\n                                                                     \
    \ echo ‘<tr>\n\n                                                                                   \
    \ <td>’ . $row\\[‘MemberID’\\] .\n\n‘</td>\n\n                                                                                   \
    \ <td>’ . $row\\[‘FirstName’\\] .\n\n‘</td>\n\n                                                                                   \
    \ <td>’ . $row\\[‘LastName’\\] .\n\n‘</td>\n\n                                                                                   \
    \ <td>’ . $row\\[‘Age’\\] . ‘</td>\n\n                                                                                   \
    \ <td>’ . $row\\[‘Gender’\\] . ‘</td>\n\n                                                                                   \
    \ <td>’ . $row\\[‘Relationship’\\] .\n\n‘</td>\n\n                                                                     \
    \ </tr>’;\n\n                                                        }\n\n                                                       \
    \ echo ‘</table>’;\n\n                                          }\n\n                     \
    \                     else {\n\n                                                       \
    \ echo “Cound not get a response from database ” . mysqli\\_error($conn);\n\n\
                                              }\n\n                                         \
    \ mysqli\\_close($conn);"
  fmt: "\n# Create the Database\n\nCreate the Database by entering the following code:\n\
    \n```sql\nCREATE DATABASE Family;\n```\n\nThen select the database in order to\
    \ use it:\n\n```sql\nUSE Family;\n```\n\n## Create and Inserting Values into the\
    \ Family Members Table\n\nNow we create the table that stores the information.\
    \ It should look like this:\n\n| Family Members |\n| --- |\n| Member ID |\n| First\
    \ Name |\n| Last Name |\n| Age |\n| Gender |\n| Relationship |\n\nThe code to\
    \ create the tables looks as follows:\n\n```sql\nCREATE TABLE FamilyMembers\n\
    (\nMemberID int unsigned NOT NULL auto_increment PRIMARY KEY, FirstName varchar(80)\
    \ NOT NULL,\nLastName varchar(80) NOT NULL, Age int(3) unsigned NOT NULL,\nGender\
    \ ENUM (‘Male’, ‘Female’) NOT NULL, Relationship varchar(80) NOT NULL\n);\n```\n\
    \nWhen we describe the table we get something like this:\n\n| Field | Type | Null\
    \ | Key | Default | Extra |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| MemberID\
    \ | int(10) unsigned | NO | PRI | NULL | auto_increment |\n| FirstName | varchar(80)\
    \ | NO | | NULL | |\n| LastName | varchar(80) | NO | | NULL | |\n| Age | int(3)\
    \ unsigned | NO | | NULL | |\n| Gender | enum(‘Male’,‘Female’) | NO | | NULL |\
    \ |\n| Relationship | varchar(80) | NO | | NULL | |\n\nThen we insert values into\
    \ the tables:\n\n```sql\nINSERT INTO FamilyMembers VALUES\n(NULL, ‘Robert’, ‘Williams’,\
    \ 52, ‘Male’, ‘Father’), (NULL, ‘Martha’, ‘Williams’, 49, ‘Female’, ‘Mother’),\
    \ (NULL, ‘Doreen’, ‘Williams’, 18, ‘Female’, ‘Sister’), (NULL, ‘Jace’, ‘Williams’,\
    \ 13, ‘Female’, ‘Adoptive Sister’), (NULL, ‘Benson’, ‘Williams’, 22, ‘Male’, ‘Brother’),\
    \ (NULL, ‘Timothy’, ‘James’, 23, ‘Male’, ‘Cousin’);\n```\n\nWhen we select all\
    \ the records in the table, we see something like this:\n\n| MemberID | FirstName\
    \ | LastName | Age | Gender | Relationship |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 1 | Robert | Williams | 52 | Male | Father |\n| 2 | Martha | Williams\
    \ | 49 | Female | Mother |\n| 3 | Doreen | Williams | 18 | Female | Sister |\n\
    | 4 | Jace | Williams | 13 | Female | Adoptive Sister |\n| 5 | Benson | Williams\
    \ | 22 | Male | Brother |\n| 6 | Timothy | James | 23 | Male | Cousin |\n\nNow\
    \ we are done with the command line (but MySQL), so we can close that.\n\n## Create\
    \ PHP File for Website\n\nWe must first create a folder and name it `Family` and\
    \ place it in the `htdocs` folder. This folder is located in the root directory\
    \ of XAMPP installation. Then we create a file called `config.php` and place it\
    \ in root folder of our website.\n\nWarning: for security purpose this file needs\
    \ to be placed outside of the server because while it is easy to read PHP through\
    \ the browser, it can happen if the server is misconfigured. Since we want to\
    \ keep this as simple, we will place it here.\n\nNext we define constants needed\
    \ to establish connection string that we shall use to connect to database:\n\n\
    ```php\n<?php\ndefine('DB_NAME', 'Family');\ndefine('DB_USER', 'root');\ndefine('DB_PASSWORD',\
    \ '');\ndefine('DB_HOST', 'localhost');\n?>\n```\n\nWarning: for security reason,\
    \ putting in plain text password is a major risk. You can use `hash()` and store\
    \ the hash in `config.php`. Then you can check if the entered password matches\
    \ the hash when logging in.\n\nThen we establish the connection string by passing\
    \ in host, username, database name to the method that establishes the connection:\n\
    \n```php\n<?php\ndefine('DB_NAME', 'Family');\ndefine('DB_USER', 'root');\ndefine('DB_PASSWORD',\
    \ '');\ndefine('DB_HOST', 'localhost');\n$conn = @mysqli_connect(DB_HOST, DB_USER,\
    \ DB_PASSWORD, DB_NAME);\n?>\n```\n\nNow we need to check if the connections succeeded\
    \ or. If it didn’t, we display the appropriate message and stop execution:\n\n\
    ```php\n<?php\ndefine('DB_NAME', 'Family');\ndefine('DB_USER', 'root');\ndefine('DB_PASSWORD',\
    \ '');\ndefine('DB_HOST', 'localhost');\n$conn = @mysqli_connect(DB_HOST, DB_USER,\
    \ DB_PASSWORD, DB_NAME);\nif (!$conn) {\n    die(mysqli_connect_error());\n}\n\
    ?>\n```\n\nAnd that’s it for establishing the connection string. This script will\
    \ be required by every PHP script that needs to connect to the database to work\
    \ with the data.\n\n## Creating the Index Page\n\nNow we need to create the landing\
    \ page which shall list the family members that are in our family database in\
    \ a table. We are going to add some CSS (by linking to external style sheets)\
    \ to create an attractive table to display our data in. We create a file named\
    \ `index.php` and place it root directory of the website. The code for file should\
    \ look something like this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/main.css\">\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"css/table_styling.css\">\n</head>\n<body>\n<div id=\"\
    container\">\n<div id=\"header\">\n<h2>My Family</h2>\n</div>\n<div id=\"btn_add\"\
    >\n<a href=\"form.php\">ADD</a>\n</div>\n<div id=\"content\">\n<?php\nrequire_once('config.php');\n\
    $sql = \"SELECT MemberID, FirstName, LastName, Age, Gender, Relationship FROM\
    \ FamilyMembers\";\n$response = @mysqli_query($conn, $sql);\nif ($response){\n\
    \    echo '<table>';\n    echo '<tr>\n    <th>Member ID</th>\n    <th>First Name</th>\n\
    \    <th>Last Name</th>\n    <th>Age</th>\n    <th>Gender</th>\n    <th>Relationship</th>\n\
    </tr>';\n    while ($row = mysqli_array($response)){\n        echo '<tr>';\n \
    \       echo '<td>' . $row['MemberID'] . '</td>';\n        echo '<td>' . $row['FirstName']\
    \ . '</td>';\n        echo '<td>' . $row['LastName'] . '</td>';\n        echo\
    \ '<td>' . $row['Age'] . '</td>';\n        echo '<td>' . $row['Gender'] . '</td>';\n\
    \        echo '<td>' . $row['Relationship'] . '</td>';\n        echo '</tr>';\n\
    \    }\n    echo '</table>';\n} else {\n    echo \"Cound not get a response from\
    \ database \" . mysqli_error($conn);\n}\nmysqli_close($conn);\n?>\n</div>\n</div>\n\
    </body>\n</html>\n```\n"
  trans: "\n\n# 创建数据库\n\n通过输入代码创建数据库：\n\n```sql\nCREATE DATABASE Family;\n```\n\n\
    然后选择该数据库以便使用：\n\n```sql\nUSE Family;\n```\n\n## 创建并向 Family Members 表插入值\n\n现在我们创建一个存储信息的表。它看起来应该是这样的：\n\
    \n| Family Members |\n| --- |\n| 成员 ID |\n| 名 |\n| 姓 |\n| 年龄 |\n| 性别 |\n| 关系 |\n\
    \n创建表的代码如下：\n\n```sql\nCREATE TABLE FamilyMembers\n(\nMemberID int unsigned NOT\
    \ NULL auto_increment PRIMARY KEY, FirstName varchar(80) NOT NULL,\nLastName varchar(80)\
    \ NOT NULL, Age int(3) unsigned NOT NULL,\nGender ENUM (‘Male’, ‘Female’) NOT\
    \ NULL, Relationship varchar(80) NOT NULL\n);\n```\n\n当我们描述该表时，会得到类似这样的结果：\n\n\
    | Field | Type | Null | Key | Default | Extra |\n| :--- | :--- | :--- | :--- |\
    \ :--- | :--- |\n| MemberID | int(10) unsigned | NO | PRI | NULL | auto_increment\
    \ |\n| FirstName | varchar(80) | NO | | NULL | |\n| LastName | varchar(80) | NO\
    \ | | NULL | |\n| Age | int(3) unsigned | NO | | NULL | |\n| Gender | enum(‘Male’,‘Female’)\
    \ | NO | | NULL | |\n| Relationship | varchar(80) | NO | | NULL | |\n\n然后我们向表中插入值：\n\
    \n```sql\nINSERT INTO FamilyMembers VALUES\n(NULL, ‘Robert’, ‘Williams’, 52, ‘Male’,\
    \ ‘Father’), (NULL, ‘Martha’, ‘Williams’, 49, ‘Female’, ‘Mother’), (NULL, ‘Doreen’,\
    \ ‘Williams’, 18, ‘Female’, ‘Sister’), (NULL, ‘Jace’, ‘Williams’, 13, ‘Female’,\
    \ ‘Adoptive Sister’), (NULL, ‘Benson’, ‘Williams’, 22, ‘Male’, ‘Brother’), (NULL,\
    \ ‘Timothy’, ‘James’, 23, ‘Male’, ‘Cousin’);\n```\n\n当我们查询表中的所有记录时，我们会看到类似这样的内容：\n\
    \n| MemberID | FirstName | LastName | Age | Gender | Relationship |\n| :--- |\
    \ :--- | :--- | :--- | :--- | :--- |\n| 1 | Robert | Williams | 52 | Male | Father\
    \ |\n| 2 | Martha | Williams | 49 | Female | Mother |\n| 3 | Doreen | Williams\
    \ | 18 | Female | Sister |\n| 4 | Jace | Williams | 13 | Female | Adoptive Sister\
    \ |\n| 5 | Benson | Williams | 22 | Male | Brother |\n| 6 | Timothy | James |\
    \ 23 | Male | Cousin |\n\n现在我们已经完成了命令行（但 MySQL）的操作，可以将其关闭了。\n\n## 为网站创建 PHP 文件\n\
    \n我们必须先创建一个文件夹并命名为 `Family`，将其放置在 `htdocs` 文件夹中。该文件夹位于 XAMPP 安装的根目录下。然后我们创建一个名为\
    \ `config.php` 的文件并将其放置在网站的根目录下。\n\n警告：出于安全考虑，此文件需要放置在服务器外部，虽然通过浏览器读取 PHP 很容易，但如果服务器配置不当，这种情况可能会发生。为了保持简单，我们将将其放在这里。\n\
    \n接下来，我们定义建立连接字符串所需的常量，我们将使用它来连接数据库：\n\n```php\n<?php\ndefine('DB_NAME', 'Family');\n\
    define('DB_USER', 'root');\ndefine('DB_PASSWORD', '');\ndefine('DB_HOST', 'localhost');\n\
    ?>\n```\n\n警告：出于安全考虑，使用明文密码是一个主要风险。你可以使用 `hash()` 并哈希值存储在 `config.php` 中。然后你可以在登录时检查输入的密码是否匹配哈希值。\n\
    \n然后通过将主机、用户名和数据库名称传递给建立连接的方法来建立连接字符串：\n\n```php\n<?php\ndefine('DB_NAME', 'Family');\n\
    define('DB_USER', 'root');\ndefine('DB_PASSWORD', '');\ndefine('DB_HOST', 'localhost');\n\
    $conn = @mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD, DB_NAME);\n?>\n```\n\n\
    现在我们需要检查连接是否成功。如果未成功，我们将显示适当的消息并停止执行：\n\n```php\n<?php\ndefine('DB_NAME', 'Family');\n\
    define('DB_USER', 'root');\ndefine('DB_PASSWORD', '');\ndefine('DB_HOST', 'localhost');\n\
    $conn = @mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD, DB_NAME);\nif (!$conn)\
    \ {\n    die(mysqli_connect_error());\n}\n?>\n```\n\n建立连接字符串就此完成。每个需要连接数据库并处理数据的\
    \ PHP 脚本都需要此脚本。\n\n## 创建索引页\n\n现在我们需要创建一个落地页，它将以表格的形式列出我们家庭数据库中的家庭成员。我们将添加一些 CSS（通过链接外部样式表）来创建一个漂亮的表格来显示我们的数据。我们创建一个名为\
    \ `index.php` 的文件并将其放置在网站的根目录下。文件代码应该如下：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/main.css\">\n<link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/table_styling.css\">\n</head>\n\
    <body>\n<div id=\"container\">\n<div id=\"header\">\n<h2>My Family</h2>\n</div>\n\
    <div id=\"btn_add\">\n<a href=\"form.php\">ADD</a>\n</div>\n<div id=\"content\"\
    >\n<?php\nrequire_once('config.php');\n$sql = \"SELECT MemberID, FirstName, LastName,\
    \ Age, Gender, Relationship FROM FamilyMembers\";\n$response = @mysqli_query($conn,\
    \ $sql);\nif ($response){\n    echo '<table>';\n    echo '<tr>\n    <th>Member\
    \ ID</th>\n    <th>First Name</th>\n    <th>Last Name</th>\n    <th>Age</th>\n\
    \    <th>Gender</th>\n    <th>Relationship</th>\n</tr>';\n    while ($row = mysqli_fetch_array($response)){\n\
    \        echo '<tr>';\n        echo '<td>' . $row['MemberID'] . '</td>';\n   \
    \     echo '<td>' . $row['FirstName'] . '</td>';\n        echo '<td>' . $row['LastName']\
    \ . '</td>';\n        echo '<td>' . $row['Age'] . '</td>';\n        echo '<td>'\
    \ . $row['Gender'] . '</td>';\n        echo '<td>' . $row['Relationship'] . '</td>';\n\
    \        echo '</tr>';\n    }\n    echo '</table>';\n} else {\n    echo \"Cound\
    \ not get a response from database \" . mysqli_error($conn);\n}\nmysqli_close($conn);\n\
    ?>\n</div>\n</div>\n</body>\n</html>\n```\n\n"
