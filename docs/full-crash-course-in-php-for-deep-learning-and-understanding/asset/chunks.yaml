    The `ENUM` type is a string object that has a set of values. In our case, the
    allowed values are ‘L’ (Long Play), ‘E’ (Extended Play) and ‘M’ (mix).


    ### Adding `numTracks`

    If this seems wrong, you have been paying attention! This field is used to store
    the number of tracks and should be a numeric type not a string type. This was
    done intentionally to demonstrate how to change the data type and name of a field
    later.


    ### Adding `DateReleased`

    The last line created stores the date the album was released. The date type is
    used to store values. Let us look at common data types you will be using:


    #### Numeric Types

    - `INT`: whole number

    - `FLOAT`: 1E38 to -1E37

    - `Double`: 1E38 to -1E37


    #### String Types

    - `CHAR`: fixed length

    - `VARCHAR`: variable length

    - `ENUM`: A string that has a limited number of total values you must define


    #### Date and Time

    - `DATE`: YYYY-MM-DD

    - `TIME`: HH:MM:SS

    - `DATETIME`: YYYY-MM-DD HH:MM:SS

    - `YEAR`: YYYY


    ### Altering Tables

    Sometimes you can make a mistake or may wish to change things in your table. Luckily,
    you can do so with `ALTER` statements. We will look at changing table names and
    data types. First, we need to look at the table we just created by typing the
    following command to describe our table:


    ```

    DESC Album;

    ```


    You should see the following output:

    ```

    +------+------+------+------+----+

    | Field | Type | Null | Key | Extra |

    +------+------+------+------+----+

    | AlbumID | smallint(5) unsigned | NO | PRI | auto_increment |

    | AlbumName | varchar(255) | NO | | |

    | AlbumArtist | varchar(80) | NO | | |

    | AlbumType | enum(''A'',''E'',''M'') | NO | | |

    | numTracks | varchar(3) | NO | | |

    | DateReleased | date | NO | | |

    +------+------+------+------+----+

    ```


    Looks like we can indeed change a few things:


    #### 1. Changing the Table Name

    The singular form “Album” doesn’t make sense as a table is used to store multiple
    records. We should use the plural form and change it from `Album` to `Albums`
    so it makes more sense. Here is how we change the table name:


    ```

    RENAME TABLE Album to Albums;

    ```


    If we enter the `show tables` command we should see the table name has changed:

    ```

    +----------------+

    | Tables_in_music |

    +----------------+

    | albums |

    +----------------+

    ```


    #### 2. Changing The Data Type of `numTracks`

    The field `numTracks` should not be a string type but numeric. The following code
    should change its data type to the appropriate one:


    ```

    ALTER TABLE Albums

    MODIFY COLUMN numTracks smallint(2) NOT NULL;

    ```


    #### 3. Changing the Column Name for `numTracks`

    It seems we are still not done with the field `numTracks`. We need to change it
    to make it a little more readable by changing it from `numTracks` to `NumberOfTracks`.


    ```sql

    ALTER TABLE Albums

    CHANGE numTracks NumberOfTracks smallint(2) NOT NULL;

    ```

    NOTE: we still have to define the data type when changing the name of the column.
    With the following changes, when we enter the statement to describe the table,
    we should see:


    ```

    +------+------+------+------+----+

    | Field | Type | Null | Key | Extra |

    +------+------+------+------+----+

    | AlbumID | smallint(5) unsigned | NO | PRI | auto_increment |

    | AlbumName | varchar(255) | NO | | |

    | AlbumArtist | varchar(80) | NO | | |

    | AlbumType | enum(''A'',''E'',''M'') | NO | | |

    | NumberOfTracks | smallint(2) | NO | | |

    | DateReleased | date | NO | | |

    +------+------+------+------+----+

    ```

    That looks better!


    ### Deleting Tables

    The code below can be used to delete a table and all its data from the database:


    ```

    DROP TABLE table_name;

    ```

    Where `table_name` is the name of the table you wish to delete.


    ### Inserting Records into a Table

    We use the `INSERT INTO` statement to insert new records in a table:


    ```

    INSERT INTO Albums VALUES

    (NULL, ''Rush Blood to the Head'', ''Coldplays'', ''A'', 12, ''2002-08-02''),

    (NULL, ''Dirty Gold'', ''Angel Haze'', ''A'', 16, ''2013-12-30''),

    (NULL, ''Back to the Woods'', ''Angel Haze'', ''M'', 13, ''2015-09-15''),

    (NULL, ''Parachutes'', ''Coldplay'', ''A'', 10, ''1999-07-10''),

    (NULL, ''1989 (Delux Edition)'', ''Taylor Swift'', ''A'', 15, ''2014-10-27''),

    (NULL, ''Prokts March'', ''Coldplay'', ''E'', 8, ''2008-09-21''),

    (NULL, ''Random Access Memories'', ''Daft Punk'', ''A'', 14, ''2013-05-13''),

    (NULL, ''X & Y'', ''Coldplay'', ''A'', 13, ''2005-06-01'');

    ```

    Seems we like Coldplay a bit too much. Who doesn’t?


    ### The SELECT Statement

    The `SELECT` statement allows you to retrieve data from a database. The following
    example demonstrates how to use `SELECT` to retrieve all the records from the
    `Albums` table:


    ```

    SELECT * FROM Albums;

    ```


    The output should be something like this:

    ```

    +----------+-----------+---------------------------+---------------+

