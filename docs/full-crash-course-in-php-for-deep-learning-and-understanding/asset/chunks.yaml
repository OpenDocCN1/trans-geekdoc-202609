- raw: "                            ?>\n\n</div>\n\n</div>\n\n</body>\n\n</html>\n\
    \nThere is quite a lot going on here but we will not get into it all. We also\
    \ won’t be discussing any of the HTML and CSS as this book assuming you have some\
    \ basic knowledge of those and how to link external style sheets.\n\nFirstly,\
    \ in the PHP code, we include the config.php file by calling the require\\_once\
    \ function and passing the path to the file as a parameter (we pass in a relative\
    \ path since the configuration file). This will allow us to access our database\
    \ connection we defined in that file:\n\nrequire\\_once(‘config.php’);\n\nNext\
    \ we create the query string that will be used to retrieve data from database\
    \ using SQL\n\nand assign it to the variable$sql:\n\n$sql \\= “SELECT MemberID,\
    \ FirstName, LastName, Age, Gender, Relationship FROM FamilyMembers”;\n\nWe use\
    \ aSELECTstatement to select the fields we wish to display from the FamilyMemberstable\
    \ following the same syntax rules we would use on the command line.\n\nThen we\
    \ send the query to the database using the mysqli\\_query function and pass in\
    \ the connection variable, which is now accessible because we included the config.php,\
    \ and the query string then assign the return value to the $response variable:\n\
    \n$response \\= @mysqli\\_query($conn, $sql);\n\nAfter that, we check if we got\
    \ a response from the database using an if statement:\n\nif ($response){\n\n}\n\
    \nIf we got a response from the database, we create a with a table row and table\
    \ headers by embedding HTML in PHP code and echoing that inside the if statement:\n\
    \necho ‘<table>\n\n<tr>\n\n              <th>Member ID</th>\n\n              <th>First\
    \ Name</th>\n\n              <th>Last Name</th>\n\n              <th>Age</th>\n\
    \n              <th>Gender</th>\n\n              <th>Relationship</th>\n\n</tr>’;\n\
    \nOkay, that does it for the columns. Now we need to display the rows one by one\
    \ dynamically in case we have many. The following code does that:\n\nwhile ($row\
    \ \\= mysqli\\_fetch\\_array($response)){\n\necho ‘<tr>\n\n              <td>’\
    \ . $row\\[‘MemberID’\\] . ‘</td>\n\n              <td>’ . $row\\[‘FirstName’\\\
    ] . ‘</td>\n\n              <td>’ . $row\\[‘LastName’\\] . ‘</td>\n\n             \
    \ <td>’ . $row\\[‘Age’\\] . ‘</td>\n\n              <td>’ . $row\\[‘Gender’\\\
    ] . ‘</td>\n\n              <td>’ . $row\\[‘Relationship’\\] . ‘</td>\n\n</tr>’;\n\
    \n}\n\nIn the above code, we use a loop to go through an array we get from the\
    \ response using the mysqli\\_fetch\\_array()function and passing in the $response\
    \ variable as a parameter. We assign the value (which is also an array contain\
    \ the fields of the row) we get from the function into the variable $row and embed\
    \ HTML around them to create new table rows dynamically as many as they are elements\
    \ in the array.\n\nThen we close of the table off and that is it for displaying\
    \ the data dynamically:\n\necho ‘</table>’;\n\nBut what if there was no response\
    \ for the database because something went wrong? That could happen. In that case\
    \ we add an else statement after our if statement to display the error message\
    \ using the mysqli\\_error function and we pass in our connection as a parameter:\n\
    \nelse{\n\necho “Cound not get a response from database ” .              mysqli\\\
    _error($conn);\n\n}\n\nLastly, we close the database connection using the mysqli\\\
    _close function, passing in the connection as a parameter and we are done with\
    \ the index page:\n\nmysqli\\_close($conn);\n\nGo into the browser and enter that\
    \ path to the index.php as follows then press Enter:\n\n[https://localhost/Family/index.php](https://localhost/Family/index.php)\n\
