- raw: "|  $x %= $y ||  $x \\= $x % $y ||  Gets the remainder of $x divided by$y and\
    \ sets the result into $x |\n\nComparison Operators\n\nComparison operators in\
    \ PHP are used to compare two values:\n\n|  EXAMPLE ||  NAME ||  RESULT |\n\n\
    | --- | --- | --- |\n\n|  $x \\== $y ||  Equal ||  Returns true if both $x and\
    \ $y are equal |\n\n|  $x \\=== $y ||  Identical ||  Returns true if both $x and\
    \ $y are equal, and have the same data type |\n\n|  $x != $y ||  Not equal ||\
