    ![](img/image00874.jpeg)


    # PHP 深度学习与理解速成课程


    Dean Grey


    ## PHP 简析


    PHP 代表 Hypertext Processor（超文本处理器）。它是一种服务器端脚本语言，主要用于生成动态网页内容等。这意味着 `PHP` 执行的所有操作并不是在用于查看网页的计算机（称为客户端）上完成的，而是在一台称为服务器的专用计算机上完成的，服务器托管了你在客户端机器上查看的所有网页。


    作为一种脚本语言，`PHP` 实际上不能用于制作在你的计算机上运行的独立应用程序，因为它被设计为仅在网页内发生事件时执行操作，例如：点击链接或提交 Web
    表单时获取表单数据。


    你可以将 `PHP` 嵌入到你的 `HTML` 网页中，并根据从用户处获得的信息生成自定义页面。这使得网页比纯静态页面更具趣味。`PHP` 可用于生成网页，因为它的最终输出是
    `HTML`。


    它在服务器端非常高效，被广泛使用，跨平台（运行在 `Windows`、`Linux`、`UNIX`、`Mac OS X` 等），并且比任何其他全功能语言（如
    `C`、`Java` 或 `Perl`）都更容易学习。


    `PHP` 也非常强大。如果你怀疑它的威力，下次当你决定登录 `Facebook` 时，仔细看看浏览器中的地址栏即可。你会发现，全球最大的社交网站是由 `PHP`
    驱动的！甚至 `Wikipedia`（那个能告诉你所有所需知识的网站）也是由 `PHP` 驱动的。这就是 `PHP` 背后的力量，使其成为微软 Active
    Server Pages (`ASP`) 等竞争对手的极佳替代方案。


    它还拥有一个非常活跃的社区，可以在你困难时为你提供真正的帮助，并且一直活跃。根据 [`http://www.w3schools.com ]](http://www.w3schools.com)
    的 `PHP` 页面；`PHP` 允许你完成以下操作：


    * `PHP` 可以生成动态页面内容

    * `PHP` 可以在服务器上创建、打开、读取、写入、删除和关闭文件

    * `PHP` 可以收集表单数据

    * `PHP` 可以发送和接收 cookie

    * `PHP` 可以对你的数据库进行添加、删除、修改数据（这就是为什么它是 `MySQL` 的完美搭档）

    * `PHP` 可以用于控制用户访问

    * `PHP` 可以加密数据


    ## MySQL 简析


    `MySQL` 是一个流行的开源关系型数据库，以 `SQL` 为基础。它允许你存储、检索和操作数据。它是一个高效且可扩展的解决方案，而且具有成本效益。


    许多基于 Web 的程序（包括计算机程序）使用数据库来存储信息。社交应用程序需要一个地方来存储用户信息、图片、帖子、评论等，这时像 `MySQL` 这样的数据库就派上用场了，存储和检索大量信息变得轻而易举。


    `SQL` 通常读作 "sequel"，代表结构化查询语言。它是一种为像 `MySQL` 之类的数据库管理数据设计的语言。它们使用 `SQL` 通过特殊的命令来发送和检索数据，这些命令其实并不难学。最重要的是，对于这本书的读者来说，你可以将
    `SQL` 嵌入到 `PHP` 等编程语言中。


    此外，`MySQL` 是开源的，免费提供，如果某些特定功能不符合你的设，可以通过修改源代码进行更改。


    ## 本书将涵盖的内容


    本书分为四个主要章节（或四个“小时”），帮助你进入 `PHP` 和 `SQL` 的核心，并让你在很快成为大师。


    在第一个小时里，我们将花时间安装非常需要的名为 `XAMPP` 的 Web 服务器包。我建议在开始该章节之前，先在这里下载它：[`https://www.apachefriends.org/index.html
    ]](https://www.apachefriends.org/index.html)。这将使我们能够运行书中的示例。然后，我们将为 `PHP` 代码选择一个文本编辑器。接着我们将学习如何运行
    `PHP` 脚本，最后我们将涵盖一些 `PHP` 的基础知识，如注释、变量、常量和操作符。


    书中的示例可以手动输入，或者为了节省时间复制并粘贴到你的代码编辑器或命令行界面中。


    在第二个小时里，我们将继续学习 `PHP` 并涵盖条件语句、循环 (`Loops`)、数组 (`Arrays`) 和函数。在本章之后，你应该认为自己已经很熟悉了
    `PHP`，可以处理进一步更高级的主题了。


    这一部分你可以休息一下，让大脑吸收一下，然后再去泡杯咖啡。


    在第三个小时里，我们将处理 `MySQL` 及其命令，但首先我们要学习如何访问命令行。然后我们进入允许我们创建和删除数据库的命令；创建、修改和删除表；在表中插入、选择、更新和删除数据。


    最后，在最后一个小时里，我们将 `PHP` 和 `MySQL` 结合起来，创建一个简单的网站，向你展示这两者是如何协同工作的。


    让我们开始吧。拿起你的第一杯咖啡！


    # 第 1 章 - 第 1 小时：安装与 PHP 基础


    “开始的方法是带着梦想驱动的乐观迈出第一步。” - Debasish Mridha


    ![](img/image00875.jpeg)![](img/image00876.jpeg)本章将涵盖：

    * 安装 Web 服务器

    * 安装文本编辑器


    ![](img/image00877.jpeg)启动 Apache 以运行 `PHP`


    ![](img/image00878.jpeg)创建并运行 `PHP` 脚本


    ![](img/image00879.jpeg)`PHP` 基础（注释、变量、操作符、常量）


    请耐心一下。我知道编程书的第一章都会堆砌一些理论，以确保你知道自己在面对什么。但那是以后的事。现在你需要安装服务器并选择一个合适的文本编辑器！


    ## 安装 Web 服务器


    通往 `PHP` 大师之路的第一真正步在这里。你不能像运行 `HTML` 那样直接在浏览器中运行 `PHP`。为了运行 `PHP`，你需要在本地安装一个服务器，以便浏览器解析
    `PHP` 脚本并向数据库运行 `MySQL` 查询以返回结果。或者，你可以使用支持 `PHP` 和 `MySQL` 的主机，这样你可以将其上传到他们的服务器并在那里部署你的梦想网站。但我猜你真的想在本地测试。因此，我们将安装一个让你的电脑变成测试服务器的本地服务器。


    本地可以安装很多服务器，例如 `XAMP`、适用于 Windows 的 `WAMP` 以及适用于 Mac OS X 的 `MAMP` 等，但本书涵盖 `XAMP`。它是一个适用于
    Windows、Mac 和 Linux 的免费开源跨平台服务器包。


    访问网站 [`www.apachefriends.org/index.html`](http://www.apachefriends.org/index.html)
    下载最新版本的 Windows 版 `XAMP`（步骤同样适用于 Mac 或 Linux）。下载完成后，在本地机器上找到该文件并双击安装。


    简单！现在 `PHP` 和 `MySQL` 已准备就绪。


    **注意**：如果你此时运行着杀病毒软件，它可能会干扰安装过程。你可能需要在服务器安装完成之前将其关闭，以避免任何潜在问题。


    ## 安装文本编辑器


    现在，你需要一个文本编辑器来编写优美的 `PHP`。理想情况下，任何文本编辑器都可以，甚至 Windows 默认的记事本或 Mac OS X 的终端都可以用于编写
    `PHP`。我们将使用 `notepad++`，因为它有一些非常实用的功能，有助于快速编写整洁高效的代码，例如语法高亮和自动补全。


    而且它是免费的！


    '
