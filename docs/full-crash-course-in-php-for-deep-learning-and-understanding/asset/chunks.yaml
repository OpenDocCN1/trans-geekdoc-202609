  fmt: "\nThere is quite a lot going on here but we will not get into it all. We also\
    \ won’t be discussing any of the HTML and CSS as this book assuming you have some\
    \ basic knowledge of those and how to link external style sheets.\n\nFirstly,\
    \ in the PHP code, we include the `config.php` file by calling the `require_once`\
    \ function and passing the path to the file as a parameter (we pass in a relative\
    \ path since the configuration file). This will allow us to access our database\
    \ connection we defined in that file:\n\n```php\nrequire_once('config.php');\n\
    ```\n\nNext we create the query string that will be used to retrieve data from\
    \ database using SQL and assign it to the variable `$sql`:\n\n```php\n$sql = “SELECT\
    \ MemberID, FirstName, LastName, Age, Gender, Relationship FROM FamilyMembers”;\n\
    ```\n\nWe use a `SELECT` statement to select the fields we wish to display from\
    \ the `FamilyMembers` table following the same syntax rules we would use on the\
    \ command line.\n\nThen we send the query to the database using the `mysqli_query`\
    \ function and pass in the connection variable, which is now accessible because\
    \ we included the `config.php`, and the query string then assign the return value\
    \ to the `$response` variable:\n\n```php\n$response = @mysqli_query($conn, $sql);\n\
    ```\n\nAfter that, we check if we got a response from the database using an `if`\
    \ statement:\n\n```php\nif ($response){\n\n}\n```\n\nIf we got a response from\
    \ the database, we create a with a table row and table headers by embedding HTML\
    \ in PHP code and echoing that inside the `if` statement:\n\n```php\necho ‘<table>\n\
    <tr>\n    <th>Member ID</th>\n    <th>First Name</th>\n    <th>Last Name</th>\n\
    \    <th>Age</th>\n    <th>Gender</th>\n    <th>Relationship</th>\n</tr>’;\n```\n\
    \nOkay, that does it for the columns. Now we need to display the rows one by one\
    \ dynamically in case we have many. The following code does that:\n\n```php\n\
    while ($row = mysqli_fetch_array($response)){\necho ‘<tr>\n    <td>’ . $row['MemberID']\
    \ . ‘</td>\n    <td>’ . $row['FirstName'] . ‘</td>\n    <td>’ . $row['LastName']\
    \ . ‘</td>\n    <td>’ . $row['Age'] . ‘</td>\n    <td>’ . $row['Gender'] . ‘</td>\n\
    \    <td>’ . $row['Relationship'] . ‘</td>\n</tr>’;\n}\n```\n\nIn the above code,\
    \ we use a loop to go through an array we get from the response using the `mysqli_fetch_array()`\
    \ function and passing in the `$response` variable as a parameter. We assign the\
    \ value (which is also an array contain the fields of the row) we get from the\
    \ function into the variable `$row` and embed HTML around them to create new table\
    \ rows dynamically as many as they are elements in the array.\n\nThen we close\
    \ of the table off and that is it for displaying the data dynamically:\n\n```php\n\
    echo ‘</table>’;\n```\n\nBut what if there was no response for the database because\
    \ something went wrong? That could happen. In that case we add an `else` statement\
    \ after our `if` statement to display the error message using the `mysqli_error`\
    \ function and we pass in our connection as a parameter:\n\n```php\nelse{\necho\
    \ “Cound not get a response from database ” . mysqli_error($conn);\n}\n```\n\n\
    Lastly, we close the database connection using the `mysqli_close` function, passing\
    \ in the connection as a parameter and we are done with the index page:\n\n```php\n\
    mysqli_close($conn);\n```\n\nGo into the browser and enter that path to the `index.php`\
    \ as follows then press Enter:\n\n`https://localhost/Family/index.php`\n\nThe\
    \ below window should display:\n\n![](Images/image0929.jpeg)\n\nAs you can see;\
    \ it is displaying the records we entered and generated the table dynamically.\
    \ Neat!\n\n### CSS for index Page\n\nCreate a folder inside websites root called\
    \ `css` and create two files called `main.css` and `table_styling.css`. These\
    \ are external style sheets for the page.\n\nWe enter the following code into\
    \ `main.css` to style the body, headers, and links. It also centers the content:\n\
    \n```css\nbody {\nbackground-color: #EEE;\n}\n#container {\n    width: 900px;\n\
    \    margin-left: auto;\n    margin-right: auto;\n}\n#header {\n    color: #2ca089;\n\
    \    text-align: center;\n    font-size: 2em;\n}\n/* links */\na:link, a:visited\
    \ {\n    background-color: #2ca089;\n    color: white;\n    padding: 5px 12px;\n\
    \    text-align: center;\n    text-decoration: none;\n    display: inline-block;\n\
    }\na:hover, a:active {\n    background-color: #AFDC1;\n}\n#btn_add {\n    padding:\
    \ 5px 0px;\n    text-align: right;\n}\n```\n\nThen we enter the following code\
    \ into `table_styling.css` to style the table:\n\n```css\ntable {\nborder-collapse:\
    \ collapse;\nwidth: 100%;\n}\nth, td {\ntext-align: left;\npadding: 8px;\n}\n\
    tr:nth-child(even){\n    background-color: white;\n}\nth {\nbackground-color:\
    \ #2ca089;\ncolor: white;\n}\n```\n\n### Creating the Form to Input Data\n\nWe\
    \ create a file called `form.php` and place it the root folder of the website.\
    \ Then we place the code below:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/main.css\">\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/form_styling.css\">\n</head>\n<body>\n\
    <div id=\"container\">\n<div id=\"content\">\n<form action=\"member_added.php\"\
    \ method=\"post\">\n<div id=\"header\">\n<h3>Add Family Member</h3>\n</div>\n\
    <div id=\"btn_add\">\n<a href=\"index.php\">View Members</a>\n</div>\n<label for=\"\
    fname\">First Name</label>\n<input type=\"text\" id=\"first_name\" name=\"first_name\"\
    \ maxlength=\"80\">\n<label for=\"lname\">Last Name</label>\n<input type=\"text\"\
    \ id=\"last_name\" name=\"last_name\" maxlength=\"80\">\n<label for=\"age\">Age</label>\n\
    <input type=\"number\" id=\"age\" name=\"age\" min=\"1\" max=\"100\">\n<label\
    \ for=\"gender\">Gender</label>\n<select id=\"gender\" name=\"gender\">\n<option\
    \ value=\"Male\">Male</option>\n<option value=\"Female\">Female</option>\n</select>\n\
    <label for=\"relationship\">Relationship</label>\n<input type=\"text\" id=\"relationship\"\
    \ name=\"relationship\" maxlength=\"80\">\n<input type=\"submit\" name=\"submit\"\
    \ value=\"ADD\">\n</form>\n</div>\n</div>\n</body>\n</html>\n```\n\nNothing out\
    \ of the ordinary is happening here. This just your basic HTML form which we will\
    \ use to send the data inputted into the fields to the database. The form has\
    \ the two attributes which are of interest to us:\n\n- `action`: This tells the\
    \ form to send the form-data to the `member_added.php` script (which we shall\
    \ create in a moment) that will process the information when the ADD button is\
    \ pressed\n- `method=\"post\"`: Tells the form to send the form-data as an HTTP\
    \ post transaction. This means that the data is appended inside the body of the\
    \ HTTP request URL. This is good for sending sensitive data (things like passwords)\
    \ unlike the `get` method which just appends the data to the URL and anyone one\
    \ can see it.\n\nGo into the browser and display the index page. Click the ADD\
    \ button at top right of the table and the following page should display with\
    \ the form to add family members:\n\n![](Images/image0930.jpeg)\n\n### CSS for\
    \ Form Page\n\nCreate a CSS file called `form_styling.php` and place it in the\
    \ root directory of the website. Place the following style rules in that file\
    \ to style the form using this external style sheet:\n\n```css\ninput[type=text],\
    \ input[type=number], select {\nwidth: 100%;\npadding: 12px 20px;\nmargin: 8px\
    \ 0;\ndisplay: inline-block;\nborder: 1px solid #ccc;\nborder-radius: 4px;\nbox-sizing:\
    \ border-box;\n}\ninput[type=submit] {\nwidth: 100%;\nbackground-color: #2ca089;\n\
    color: white;\npadding: 14px 20px;\nmargin: 8px 0;\nborder: none;\nborder-radius:\
    \ 4px;\ncursor: pointer;\n}\ninput[type=submit]:hover {\nbackground-color: #2ca089;\n\
    }\n```\n\n### Creating the Member Added Page\n\nFinally, you need to create one\
    \ final PHP script for to process the data sent by the form. We create a new PHP\
    \ script and called `member_added` and place in the root directory of our website.\
    \ Then we place the following code in the script:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/main.css\"\
    >\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/form_styling.css\">\n\
    </head>\n<body>\n<div id=\"container\">\n```\n"
  trans: "\n这里涉及的内容很多，但我们不会一一详介绍。我们不会讨论任何 HTML 和 CSS，因为本书假设你已经具备这些方面的基础知识，并知道如何链接外部样式表。\n\
    \n首先，在 PHP 代码中，我们通过调用 `require_once` 函数来包含 `config.php` 文件，并将文件路径作为参数传递（由于是配置文件，我们传递的是相对路径）。这将允许我们访问在该文件中定义的数据库连接：\n\
    \n```php\nrequire_once('config.php');\n```\n\n接下来，我们创建一个查询字符串，用于使用 SQL 从数据库中检索数据，并将其赋值给变量\
    \ `$sql`：\n\n```php\n$sql = “SELECT MemberID, FirstName, LastName, Age, Gender,\
    \ Relationship FROM FamilyMembers”;\n```\n\n我们使用 `SELECT` 语句从 `FamilyMembers`\
    \ 表中选择我们想要显示的字段，其语法规则与我们在命令行中使用的规则相同。\n\n然后，我们使用 `mysqli_query` 函数将查询发送到数据库，并传入连接变量（由于我们已经包含了\
    \ `config.php`，现在该变量是可访问的），随后将查询的返回值赋值给变量 `$response`：\n\n```php\n$response =\
    \ @mysqli_query($conn, $sql);\n```\n\n之后，我们使用 `if` 语句检查是否收到了来自数据库的响应：\n\n```php\n\
    if ($response){\n\n}\n```\n\n如果收到了数据库的响应，我们将在 PHP 代码中嵌入 HTML 并在 `if` 语句内部输出它，创建一个带有表行和表头的表格：\n\
    \n```php\necho ‘<table>\n<tr>\n    <th>Member ID</th>\n    <th>First Name</th>\n\
    \    <th>Last Name</th>\n    <th>Age</th>\n    <th>Gender</th>\n    <th>Relationship</th>\n\
    </tr>’;\n```\n\n好了，列的部分完成了。现在我们需要动态地逐显示行，以防有很多数据。以下代码可以实现这一点：\n\n```php\nwhile\
    \ ($row = mysqli_fetch_array($response)){\necho ‘<tr>\n    <td>’ . $row['MemberID']\
    \ . ‘</td>\n    <td>’ . $row['FirstName'] . ‘</td>\n    <td>’ . $row['LastName']\
    \ . ‘</td>\n    <td>’ . $row['Age'] . ‘</td>\n    <td>’ . $row['Gender'] . ‘</td>\n\
    \    <td>’ . $row['Relationship'] . ‘</td>\n</tr>’;\n}\n```\n\n在上述代码中，我们使用循环通过\
    \ `mysqli_fetch_array()` 函数遍历从响应中获取的数组，并将 `$response` 变量作为参数。我们将从函数获取的值（也是一个包含该行字段的数组）赋值给变量\
    \ `$row`，并在周围嵌入 HTML，以根据数组中元素的数量动态创建相应数量的表格行。\n\n然后，我们关闭表格，动态显示数据的工作就此完成：\n\n\
    ```php\necho ‘</table>’;\n```\n\n但如果由于某些错误导致数据库没有响应呢？这种情况是有可能的。在这种情况下，我们在 `if`\
    \ 语句之后添加一个 `else` 语句，使用 `mysqli_error` 函数显示错误信息，并将我们的连接作为参数：\n\n```php\nelse{\n\
    echo “Cound not get a response from database ” . mysqli_error($conn);\n}\n```\n\
    \n最后，我们使用 `mysqli_close` 函数关闭数据库连接，传入连接作为参数，索引页的工作就完成了：\n\n```php\nmysqli_close($conn);\n\
    ```\n\n进入浏览器并输入如下路径以访问 `index.php`，然后按回车：\n\n`https://localhost/Family/index.php`\n\
    \n下面的窗口应该显示：\n\n![](img/image029.jpeg)\n\n你可以看到它显示了我们输入的记录并生成的表格。真棒！\n\n### index\
    \ 页的 CSS\n\n在网站根目录下创建一个 `css` 文件夹，并创建两个文件 `main.css` 和 `table_styling.css`。这些是页面的样式表。\n\
    \n我们在 `main.css` 中输入以下代码来设置主体、表头和链接。它还将内容居中：\n\n```css\nbody {\nbackground-color:\
    \ #EEE;\n}\n#container {\n    width: 900px;\n    margin-left: auto;\n    margin-right:\
    \ auto;\n}\n#header {\n    color: #2ca089;\n    text-align: center;\n    font-size:\
    \ 2em;\n}\n/* links */\na:link, a:visited {\n    background-color: #2ca089;\n\
    \    color: white;\n    padding: 5px 12px;\n    text-align: center;\n    text-decoration:\
    \ none;\n    display: inline-block;\n}\na:hover, a:active {\n    background-color:\
    \ #AFDC1;\n}\n#btn_add {\n    padding: 5px 0;\n    text-align: right;\n}\n```\n\
    \n然后我们在 `table_styling.css` 中输入以下代码来设置表格：\n\n```css\ntable {\nborder-collapse:\
    \ collapse;\nwidth: 100%;\n}\nth, td {\ntext-align: left;\npadding: 8px;\n}\n\
    tr:nth-child(even){\n    background-color: white;\n}\nth {\nbackground-color:\
    \ #2ca089;\ncolor: white;\n}\n```\n\n### 创建数据的表单\n\n我们在网站根目录创建一个名为 `form.php`\
    \ 的文件，然后放置以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"css/main.css\">\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"css/form_styling.css\">\n</head>\n<body>\n<div id=\"container\">\n<div\
    \ id=\"content\">\n<form action=\"member_added.php\" method=\"post\">\n<div id=\"\
    header\">\n<h3>Add Family Member</h3>\n</div>\n<div id=\"btn_add\">\n<a href=\"\
    index.php\">View Members</a>\n</div>\n<label for=\"fname\">First Name</label>\n\
    <input type=\"text\" id=\"first_name\" name=\"first_name\" maxlength=\"80\">\n\
    <label for=\"lname\">Last Name</label>\n<input type=\"text\" id=\"last_name\"\
    \ name=\"last_name\" maxlength=\"80\">\n<label for=\"age\">Age</label>\n<input\
    \ type=\"number\" id=\"age\" name=\"age\" min=\"1\" max=\"100\">\n<label for=\"\
    gender\">Gender</label>\n<select id=\"gender\" name=\"gender\">\n<option value=\"\
    Male\">Male</option>\n<option value=\"Female\">Female</option>\n</select>\n<label\
    \ for=\"relationship\">Relationship</label>\n<input type=\"text\" id=\"relationship\"\
    \ name=\"relationship\" maxlength=\"80\">\n<input type=\"submit\" name=\"submit\"\
    \ value=\"ADD\">\n</form>\n</div>\n</div>\n</body>\n</html>\n```\n\n这里没有发生任何异常。这只是你的基础\
    \ HTML 表单，我们将用它将输入字段中的数据发送到数据库。表单有两个我们感兴趣的属性：\n\n- `action`：告诉表单将数据发送到 `member_added.php`\
    \ 脚本（稍后我们将创建），它将在点击 ADD 按钮时处理信息。\n- `method=\"post\"`：告诉表单通过 HTTP POST 发送数据。这意味着数据被附加在\
    \ HTTP 请求的体内部。这对于发送敏感数据（如密码）很有用，而 `get` 方法只是将数据附加到 URL，任何人都能看到。\n\n进入浏览器显示 index\
    \ 页。点击表格右上角的 ADD 按钮，应该显示如下带有添加家庭成员表单页面：\n\n![](img/image030.jpeg)\n\n### 表单页的\
    \ CSS\n\n创建一个名为 `form_styling.css` 的 CSS 文件并将其放在网站的根目录下。在该文件中放置以下规则以使用此外部样式表设置表单：\n\
    \n```css\ninput[type=text], input[type=number], select {\nwidth: 100%;\npadding:\
    \ 12px 20px;\nmargin: 8px 0;\ndisplay: inline-block;\nborder: 1px solid #ccc;\n\
    border-radius: 4px;\nbox-sizing: border-box;\n}\ninput[type=submit] {\nwidth:\
    \ 100%;\nbackground-color: #2ca089;\ncolor: white;\npadding: 14px 20px;\nmargin:\
    \ 8px 0;\nborder: none;\nborder-radius: 4px;\ncursor: pointer;\n}\ninput[type=submit]:hover\
    \ {\nbackground-color: #2ca089;\n}\n```\n\n### 创建添加成员页面\n\n最后，你需要创建一个最终的 PHP 脚本来处理表单发送的数据。我们创建一个名为\
