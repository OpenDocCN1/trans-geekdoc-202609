    - 它们对大小写不敏感\n- 在页面加载时，除非被某些代码调用，否则它们不会自动执行\n- PHP 拥有超过 1000 个内置函数，可以满足你的需求\n\n\
    ### 创建函数\n\n创建你自己的函数很容易；只需以关键字 `function` 开始，后面跟函数名和括号。之后，将你的代码放在两个大括号 `{` 和 `}`\
    \ 之间，分别称为左括号和右括号。现在你可以根据需要多次使用该函数。这节省了你每次都要重新输入代码的麻烦。\n\n下面的代码演示了一个向屏幕输出消息的函数：\n\
    \n```php\n<?php\nfunction echoMessage() {\n    echo “Hello, I am a PHP function!”\n\
    }\nechoMessage();\n?>\n```\nOutput:\nHello, I am a PHP function!\n\n### 函数参数\n\
    \n有时你可以将信息传递给函数以便对它们进行操作。这些信息被称为参数，并放在括号中。你可以通过逗号分隔来添加多个参数。下面的示例显示了一个减去两个作为参数数字的函数：\n\
    \n```php\n<?php\nfunction subFunction($num1, $num2) {\n    $diff = $num1 - $num2;\n\
    \    echo “The difference between $num1 and $num2 is: ” . $diff;\n}\nsubFunction(5,\
    \ 6);\n?>\n```\nOutput:\nThe difference between 5 and 6 is: -1\n\n### 返回值的函数\n\
    \n函数不仅可以接受信息，还可以以返回值的的形式将其交回。只需编写 `return` 关键字，后跟你希望函数返回的值。这会停止函数的执行。在接下来的示例中，我们使用函数进行加法并将结果赋值给\
    \ `$return_val`，然后输出到屏幕：\n\n```php\n<?php\nfunction addFunction($num1, $num2)\
    \ {\n    $sum = $num1 + $num2;\n    return $sum;\n}\n$return_val = addFunction(20,\
    \ 15);\necho “The value returned by the function is: ” . $return_val;\n?>\n```\n\
    Output:\nThe value returned by the function is: 35\n\n在没有传递任何参数的情况下，我们可以为参数指定一个默认值。在下面的示例中：\n\
    \n```php\n<?php\nfunction PrintName($name = “Jack”) {\n    echo “Hi, my name is\
    \ $name;\n}\n//(); // 使用默认值\nPrintName(“Jill”);\nPrintName(“Adam”);\n?>\n```\n\
    Output:\nHi, my name is Jack\nHi, my name is Jill\nHi, my name is Adam\n\n## Arrays\n\
    \n数组是一种可以在单个变量中存储多个值的数据结构。每个值都与键相关联。\n\n### 数字数组\n\n这些数组使用数字作为索引。索引默认从零开始。创建数字数组有两种方法：\n\
    1. 这种方法自动分配索引：`$dairy = array(“yoghurt”, “ice cream”, “cheese cake”);`\n2. 这种方法手动分配索引：`$dairy[0]\
    \ = “yoghurt”`, `$dairy[1] = “ice cream”`, `$dairy[2] = “cheese cake”`\n\n示例显示了如何使用索引从数字数组获取值：\n\
    \n```php\n<?php\n$dairy = array(“yoghurt”, “ice cream”, “cheese cake”);\n// 通过索引访问值\n\
    echo “I to eat ” . $dairy[0] . “, ” . $dairy[1] . “ and ” . $dairy[2] . “!”;\n\
    $arrayCount = count($dairy); // 返回数组数量的内置函数\n// 使用 for 循环遍历数字数组\nfor ($i = 0;\
    \ $i < $arrayCount; $i++) {\n    echo $dairy[$i] . “<br />”;\n}\n?>\n```\nOutput:\n\
    I to eat yoghurt, ice cream and cheese cake!\nyoghurt\nice cream\ncheese cake\n\
    \n### 关联数组\n\n使用字符串作为索引，这使得键和值之间建立了强关联。创建关联数组有两种方法。我们将通过使用奇装的价格来演示：\n1. 第一种方法：`$suit_prices\
    \ = array(“batman” => 4000, “arrow” => 1500, “superman” => 0);`\n2. 第二种方法：`$suit_prices[\"\
    batman\"] = 4000;`, `$suit_prices[\"arrow\"] = 1500;`, `$suit_prices[\"superman\"\
    ] = 0;`\n\n注意：输出关联数组的值时，不要将数组放在双引号内，否则值无法输出。下面的示例演示了如何访问关联数组的值：\n\n```php\n<?php\n\
    $suit_prices = array(“batman” => 4000, “arrow” => 1500, “superman” => 0);\necho\
    \ “The Bat suit costs: ” . $suit_prices['batman'] . “<br />”;\necho “The Green\
    \ Arrow suit costs: ” . $suit_prices['arrow'] . “<br />”;\necho “The Superman\
    \ is free. It suit costs: ” . $suit_prices['superman'] . “<br />”;\n?>\n```\n\
    Output:\nThe Bat suit costs: 4000\nThe Green Arrow suit costs: 1500\nThe Superman\
    \ is free. It suit costs: 0\n\n"
