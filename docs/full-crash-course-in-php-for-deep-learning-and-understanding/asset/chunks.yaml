    ;\n}\n?>\n```\n输出：\n15 在 10 到 20 之间\n\n### Switch 语句\n\n`switch` 语句将表达式的值与多个 case\
    \ 进行匹配。如果匹配，则执行该 case 相关的代码。如果没有找到匹配，则使用 `default` 语句。`break` 语句防止代码跳转到下一个 case。下面的示例将检查\
    \ `$lunch` 的值与所有 case 的匹配。在这种情况下，输出将是“汉堡很好吃！”，因为那是对应的 case：\n\n```php\n<?php\n\
    $lunch = \"burger\";\nswitch ($lunch) {\n    case \"cereal\":\n        echo \"\
    麦片？你午饭吃早餐了吗？\";\n        break;\n    case \"salad\":\n        echo \"沙拉是一份健康的午餐！\"\
    ;\n        break;\n    case \"burger\":\n        echo \"汉堡很好吃！\";\n        break;\n\
    \    default:\n        echo \"看起来你错过了午餐。这不太好！\";\n}\n?>\n```\n\n循环只要指定的条件保持为真，就会重复执行代码块。下面的代码显示了\
