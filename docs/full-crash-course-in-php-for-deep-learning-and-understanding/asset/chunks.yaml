    | NumberOfTracks | smallint(2)          | NO   |     | NULL    |                |


    | DateReleased   | date                 | NO   |     | NULL    |                |


    +–––––-+–––––––-+––+–—+–––+–––––-+


    That looks much better!


    Deleting Tables


    The code below can be used to delete a table and all its data from the database:


