    \ will do. So even if you don’t have notepad++, you can use whatever you like.\n\
    \nStarting Apache to run PHP scripts\n\nNow that you have installed XAMPP, you\
    \ need to start the apache web service in order for the browser to be able to\
    \ run PHP scripts. To do this, open up the Control Panel of\n\nXAMPP by double\
    \ clicking on its icon. By default, it should start Apache automatically, but\
    \ you can start it manually by clicking “Start” as in the picture below:\n\n![](Images/image00880.jpeg)\n\
    \nNOTE: Some other applications installed on your computer can cause Apache not\
    \ to start because they are using the same port Apache is configured to e.g. Skype.\
    \ If that is the case, just stop those services and start Apache again.\n\n Creating\
    \ Your First PHP Script\n\nThis part is fairly easy to do. All you have to do\
    \ is follow these steps:\n\nStep 1 - Create the PHP file\n\nOpen up your text\
    \ editor and create a regular text file and place the following code into it:\n\
    \n<!DOCTYPE html>\n\n<html>\n\n              <body>\n\n              <?php\n\n\
                                              echo “My first PHP script!”;\n\n                           \
    \ ?>\n\n</body>\n\n</html>\n\nThe file still looks like your basic HTML file except\
    \ that you embed PHP code between tags <?php and ?>. The echo statement just outputs\
    \ everything that comes after it to the screen. In our case, this will be “My\
    \ first PHP script!”. We shall see this in action in a moment.\n\nAnd all you\
    \ have to remember is that every PHP statement ends with a semicolon (Except for\
    \ comments. We will look at those later in the hour).\n\nSave the file as “example.php”.\n\
    \nStep 2 - Place it in the Root Directory of XAMPP\n\nGrab the file “example.php”\
    \ that you just created and place it in the root directory of your server in the\
    \ folder named “htdocs”, and Whalla! You are ready to run it in your browser.\n\
    \nTIP: To find the root directory, you can look for it on your local machine or\
    \ you could just open up the XAMPP Control Panel and click the “Explorer” button,\
    \ as shown in the picture below, to bring up the root folder and then locate the\
    \ htdocs folder and place the file in there:\n\n![](Images/image00881.jpeg)\n\n\
    NOTE: The folder to place your PHP files will be different with each server. For\
    \ example; you place them in the folder named www if you are using WAMP.\n\nStep\
    \ 3 - Run It in the Browser\n\nOpen up your browser (Google Chrome or Firefox\
    \ are recommended) and type the following:\n\n[http://localhost/example.php](http://localhost/example.php)\n\
    \nPress Enter and you should see the following window below:\n\n![](Images/image00882.jpeg)\n\
    \nThere you go! If you follow those steps, you should be able to run all other\
    \ scripts created in this chapter.\n\n PHP Basics\n\nComments\n\nWant to leave\
    \ messages for your future self or other members of your team? Then comments save\
    \ you the trouble of having to remember your train of thought and make for an\
    \ excellent way to document what your thoughts were at the time. They can also\
    \ be used to exclude certain pieces of code all together.\n\n// This is a single\
    \ line comment\n\n# This is another single line comment\n\n/\\*\n\n             \
    \ This is a comment block. Everything in here will be ignored and can             \
    \ \n\nspan multiple lines.\n\n\\*/\n\nVariables\n\nTo build your dream website,\
    \ you will need data and a way to store this data. It can be a name, a number,\
    \ a date or a picture. PHP offers a way for you to store them in memory by using\
    \ a variable.\n\nEach variable in PHP is preceded by the $ sign followed by the\
    \ variable name without any spaces in between the sign and variable name:\n\n\
    $myInt \\= 10;\n\nLet us see some of this in action with the following code:\n\
    \n<!DOCTYPE html>\n\n<html>\n\n              <body>\n\n                           \
    \ <?php\n\n                                          $txt \\= “My second PHP script!”;\n\
    \n                                          echo $txt;\n\n                           \
    \ ?>\n\n              </body>\n\n</html>\n\nIf you run this script in the browser,\
    \ it should out put the following:\n\n“My second PHP script!”;\n\nFew more things\
    \ to remember about variables:\n\n![](Images/image00883.jpeg)They are case sensitive.\
    \ This means $name and $naMe are two different variables\n\n![](Images/image00884.jpeg)They\
    \ must always start with a letter or underscore\n\n![](Images/image00885.jpeg)They\
    \ cannot start with numbers\n\n![](Images/image00886.jpeg)They can only contain\
    \ alpha numeric values\n\nPHP is a loosely type language and therefore you don’t\
    \ need to define the data types for variables. PHP will automatically convert\
    \ the variable to the correct data type depending on the value assigned to it.\n\
    \nHere is a list of the common data types you will work with:\n\n![](Images/image00887.jpeg)![](Images/image00888.jpeg)![](Images/image00889.jpeg)![](Images/image00890.jpeg)Integer\
    \ – Whole numbers Float – Decimal numbers String – String or characters Boolean\
    \ – true or false\n\n![](Images/image00891.jpeg)Array – Multiple items\n\n![](Images/image00892.jpeg)Object\
    \ – An Object defined by a class\n\nYou can achieve the same result as the example\
    \ above by using variables:\n\n<!DOCTYPE html>\n\n<html>\n\n              <body>\n\
    \n                            <?php\n\n                                         \
    \ $txt \\= “third”;\n\n                                          echo “My ” .\
    \  $txt .” PHP script!”;\n\n                            ?>\n\n              </body>\n\
    \n</html>\n\nIn this example we are joining two strings together using the period\
    \ (.) as it is used to concatenate two strings together and outputting the concatenated\
    \ string to the screen.\n\nConstants\n\nConstants are like variables except that\
    \ their values cannot be changed or undefined.\n\nWhen define a constant we use\
    \ define() method followed by parameters in the parenthesis that give it a name\
    \ and a value. The following example shows how to define a constant:\n\n<?php\n\
    \n              define(“MESSAGE”, “Happy Learning!”); //function that defines\
    \ a constant\n\n              echo MESSAGE;\n\n?>\n\nOutput:\n\nHappy Learning!\n\
    \nUnlike variables, you can actually specify whether you want the constant to\
    \ be case- insensitive or not by adding one more parameter, that takes a Boolean,\
    \ after the value is defined (default is false):\n\n<?php\n\n              define(“MESSAGE”,\
    \ “Happy Learning!”, true,);\n\n              echo message;\n\n?>\n\nSome rules\
    \ to remember about constants:\n\n![](Images/image00893.jpeg)They must start with\
    \ a letter and an underscore (they don’t need to start with the $ sign)\n\n![](Images/image00894.jpeg)They\
    \ global across the entire script automatically\n\nOperators\n\nPHP uses operators\
    \ to perform various operations of variables and values. We shall now look at\
    \ the operators used by PHP in groups.\n\nArithmetic Operators\n\nThese are operators\
    \ that perform mathematical operations on values and return calculated results:\n\
    \n|  EXAMPLE ||  OPERATOR ||  RESULT |\n\n| --- | --- | --- |\n\n|  $x + $y ||\
    \  Addition ||  Sum of $x and $y |\n\n|  $x \\- $y ||  Subtraction ||  The difference\
    \ between $x and $y |\n\n|  $x \\* $y ||  Multiplication ||  The Product of $x\
    \ and $y |\n\n|  $x / $y ||  Division ||  The dividend of $x and $y |\n\n|  $x\
    \ / $y ||  Modulus ||  The remainder of $x divided by $y |\n\n|  $x \\*\\* $y\
    \ ||  Exponent ||  Result of $x to $y’th power (New to PHP5.6) |\n\nAssignment\
    \ Operators\n\nThese operators are used to set values to variables:\n\n|  ASSIGNMENT\
    \ ||  SAME AS: ||  DESCRIPTION |\n\n| --- | --- | --- |\n\n|  $x \\= $y ||  $x\
    \ \\= $y ||  Gets the value of $y and sets it to $x |\n\n|  $x += $y ||  $x \\\
    = $x + $y ||  Gets the sum of $x and $y and sets the result into $x |\n\n|  $x\
    \ \\-= $y ||  $x \\= $x \\- $y ||  Gets the difference of $x and $y and sets the\
    \ result into $x |\n\n|  $x \\*= $y ||  $x \\= $x \\* $y ||  Gets the product\
    \ of $x and $y and sets the result into $x |\n\n|  $x /= $y ||  $x \\= $x / $y\
    \ ||  Gets the dividend of $x and $y and sets the result into $x |"
  fmt: "\nThis text editors will save you time and a world of pain by just downloading\
    \ it here Installing a Text Editor and installing it. Just remember that any text\
    \ will do. So even if you don’t have `notepad++`, you can use whatever you like.\n\
    \n# Starting Apache to run PHP scripts\n\nNow that you have installed `XAMPP`,\
    \ you need to start the `apache` web service in order for the browser to be able\
    \ to run PHP scripts. To do this, open up the Control Panel of `XAMPP` by double\
    \ clicking on its icon. By default, it should start Apache automatically, but\
    \ you can start it manually by clicking “Start” as in the picture below:\n\n![](Images/image0088.jpeg)\n\
    \nNOTE: Some other applications installed on your computer can cause Apache not\
    \ to start because they are using the same port Apache is configured to e.g. Skype.\
    \ If that is the case, just stop those services and start Apache again.\n\n##\
    \ Creating Your First PHP Script\n\nThis part is fairly easy to do. All you have\
    \ to do is follow these steps:\n\n### Step 1 - Create the PHP file\n\nOpen up\
    \ your text editor and create a regular text file and place the following code\
    \ into it:\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <?php\n  \
    \          echo “My first PHP script!\";\n        ?>\n    </body>\n</html>\n```\n\
    \nThe file still looks like your basic HTML file except that you embed PHP code\
    \ between tags `<?php` and `?>`. The `echo` statement just outputs everything\
    \ that comes after it to the screen. In our case, this will be “My first PHP script!”.\
    \ We shall see this in action in a moment.\n\nAnd all you have to remember is\
    \ that every PHP statement ends with a semicolon (Except for comments. We will\
    \ look at those later in the hour).\n\nSave the file as “example.php”.\n\n###\
    \ Step 2 - Place it in the Root Directory of XAMPP\n\nGrab the file `example.php`\
    \ that you just created and place it in the root directory of your server in the\
    \ folder named `htdocs`, and Whalla! You are ready to run it in your browser.\n\
    \nTIP: To find the root directory, you can look for it on your local machine or\
    \ you could just open up the `XAMPP` Control Panel and click the “Explorer” button,\
    \ as shown in the picture below, to bring up the root folder and then locate the\
    \ `htdocs` folder and place the file in there:\n\n![](Images/image00881.jpeg)\n\
    \nNOTE: The folder to place your PHP files will be different with each server.\
    \ For example; you place them in the folder named `www` if you are using WAMP.\n\
    \n### Step 3 - Run It in the Browser\n\nOpen up your browser (Google Chrome or\
    \ Firefox are recommended) and type the following: `http://localhost/example.php`\n\
    \nPress Enter and you should see the following below:\n\n![](Images/image0882.jpeg)\n\
    \nThere you go! If you follow those steps, you should be able to run all other\
    \ scripts created in chapter.\n\n# PHP Basics\n\n## Comments\n\nWant to leave\
    \ messages for your self or other members of your team? Then comments save you\
    \ trouble of having to remember your train of thought and make an excellent way\
    \ to document what your thoughts were at the time. They can also be used to exclude\
    \ certain pieces of code together.\n\n```php\n// This is a single line comment\n\
    # This is another single line\n\n/* This is a block. Everything in here will be\
    \ ignored and span multiple lines. */\n```\n\n## Variables\n\nTo build your dream\
    \ website, you will need data and a way to store this data. It can be a name,\
    \ a number, or a picture. PHP offers a way for you to store them in memory using\
    \ a variable. Each variable in PHP is preceded by the `$` sign followed by the\
    \ variable name without any spaces between sign and name:\n\n```php\n$myInt =\
    \ 10;\n```\n\nLet us see some of this in action with the following:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n    <body>\n        <?php\n            $txt = “My second\
    \ script!\";\n            echo $txt;\n        ?>\n    </body>\n</html>\n```\n\n\
    If you run this script in the browser, it should output the following: “My second\
    \ script!”\n\nFew more things to remember about variables:\n\n- (Images/image0883.jpeg)\
    \ They are case sensitive. This means `$name` and `$naMe` are two different variables.\n\
    - (Images/image0884.jpeg) They must always start with a letter or underscore.\n\
    - (Images/image0885.jpeg) They cannot start with numbers.\n- (Images/image0886.jpeg)\
    \ They can only contain alphanumeric values.\n\nPHP is a loosely type language\
    \ and therefore you don’t need to define the data types for variables. PHP will\
    \ automatically convert the variable to the correct data type depending on the\
    \ value assigned to it. Here is a list of common data types you will work with:\n\
    \n- (Images/image0887.jpeg) Integer – Whole numbers\n- (Images/image0888.jpeg)\
    \ Float – Decimal numbers\n- (Images/image0889.jpeg) String – String or characters\n\
    - (Images/image0890.jpeg) Boolean – true or false\n- (Images/image0891.jpeg) Array\
    \ – Multiple items\n- (Images/image0892.jpeg) Object – An Object defined by a\
    \ class\n\nYou can achieve the same result as the example above by using variables:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <?php\n            $txt\
    \ = “third”;\n            echo $txt . “ PHP script!\";\n        ?>\n    </body>\n\
    </html>\n```\n\n## Constants\n\nThe file still looks like your basic HTML file\
    \ except that you embed PHP code between tags `<?php` and `?>`. The `echo` statement\
    \ just outputs everything that comes after it to the screen. In our case, this\
    \ will be “My first PHP script!”. We shall see this in action in a moment.\n\n\
    The folder to place your PHP files will be different with each server. For example;\
    \ you place them in the folder named `www` if you are using WAMP.\n\nConstants\
    \ are like variables except that their values cannot be changed. When we define\
    \ a constant we use `define()` followed by a name and a value:\n\n```php\ndefine(\"\
    MESSAGE\", \"Happy Learning!\");\n```\n\nOutput: Happy Learning! Unlike variables,\
    \ you can specify whether you want the constant to be true or false by adding\
    \ one parameter:\n\n```php\ndefine(\"MESSAGE\", \"Happy Learning!\", true);\n\
    echo MESSAGE;\n```\n\nSome rules to remember about constants:\n\n- (Images/image0893.jpeg)\
    \ They must start with a letter and underscore\n- (Images/image0894.jpeg) They\
    \ global across the entire automatically\n\n## Operators\n\nPHP uses operators\
    \ to perform various operations of variables and values. We shall now look at\
    \ the operators used by groups.\n\n### Arithmetic Operators\n\nThese are operators\
    \ that perform mathematical operations on values and return calculated results:\n\
    \n| EXAMPLE | OPERATOR | RESULT |\n| --- | --- | --- |\n| `$x + $y` | Addition\
    \ | Sum of $x$ and $y$ |\n| `$x - $y` | Subtraction | The difference between $x$\
    \ and $y$ |\n| `$x * $y` | Multiplication | The Product of $x$ and $y$ |\n| `$x\
    \ / $y` | Division | The dividend of $x$ and $y$ |\n| `$x % $y` | Modulus | The\
    \ remainder of $x$ divided by $y$ |\n| `$x ** $y` | Exponent | Result of $x$ to\
    \ $y$th power (New to PHP.6) |\n\n### Assignment Operators\n\nThese operators\
    \ are used to set values to variables:\n\n| ASSIGNMENT | SAME AS: | DESCRIPTION\
    \ |\n| --- | --- | --- |\n| `$x = $y` | `$x = $y` | Gets the value of $y$ and\
    \ sets it to $x$ |\n| `$x += $y` | `$x = $x + $y` | Gets the sum of $x$ and $y$\
    \ and sets the result into $x$ |\n| `$x -= $y` | `$x = $x - $y` | Gets the difference\
    \ of $x$ and $y$ and sets the result into $x$ |\n| `$x *= $y` | `$x = $x * $y`\
    \ | Gets the product of $x$ and $y$ and sets the result into $x$ |\n"
  trans: "\n\n这些文本编辑器将通过此处下载并安装来为你节省时间并避免许多痛苦。下载一个文本编辑器并安装它。只需记住，任何编辑器都可以。所以即使你没有\
    \ `notepad++`，也可以使用任何你喜欢的工具。\n\n# 启动 Apache 以运行 PHP 脚本\n\n现在你已经安装了 `XAMPP`，你需要启动\
    \ `apache` Web 服务，以便浏览器能够运行 PHP 脚本。要执行此操作，请双击 `XAMPP` 图标打开其控制面板。默认情况下，它应该会自动启动\
    \ Apache，但你可以像下面图片所示点击“Start”来手动启动：\n\n![](img/image0088.jpeg)\n\n注意：你电脑上安装的其他应用程序可能会导致\
    \ Apache 无法启动，因为它们使用了与 Apache 配置相同的端口，例如 Skype。如果出现这种情况，只需停止那些服务并重新启动 Apache 即可。\n\
    \n## 创建你的第一个 PHP 脚本\n\n这部分非常简单。你只需要按照以下步骤操作：\n\n### 步骤 1 - 创建 PHP 文件\n\n打开你的文本编辑器，创建一个普通的文本文件，并将以下代码粘贴其中：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <?php\n            echo\
    \ “My first PHP script!\";\n        ?>\n    </body>\n</</html>\n```\n\n该文件看起来仍然像你的基础\
    \ HTML 文件，不同之处是你在标签 `<?php` 和 `?>` 之间嵌入了 PHP 代码。`echo` 语句仅会将其之后的所有内容输出到屏幕上。在我们的案例中，这将是“My\
    \ first PHP script!”。我们稍后将看到它的运行效果。\n\n你只需要记住，每个 PHP 语句都以分号结束（注释除外。我们将在本节的晚些时候讨论它们）。\n\
    \n将文件保存为“example.php”。\n\n### 步骤 2 - 将其放在 XAMPP 的根目录下\n\n获取你刚刚创建的 `example.php`\
    \ 文件，并将其放在服务器根目录下名为 `htdocs` 的文件夹中，完成！你已经准备好在浏览器中运行它了。\n\n提示：要找到根目录，你可以在本地机器上查找它，或者直接打开\
    \ `XAMPP` 控制面板并点击“Explorer”按钮（如下图所示）来调出根文件夹，然后找到 `htdocs` 文件夹并将文件放在其中：\n\n![](img/image00881.jpeg)\n\
    \n注意：放置 PHP 文件的文件夹对于每个服务器都不同。例如；如果你使用 WAMP，则将它们放在名为 `www` 的文件夹中。\n\n### 步骤 3 -\
    \ 在浏览器中运行\n\n打开你的浏览器（推荐使用 Google Chrome 或 Firefox）并输入：`http://localhost/example.php`\n\
    \n按下回车键，你应该能看到下面的内容：\n\n![](img/image0882.jpeg)\n\n大搞定！如果你遵循了这些步骤，你应该能够运行在本章节中创建的所有其他脚本。\n\
    \n# PHP 基础\n\n## 注释\n\n想为你自己或团队的其他成员留下留言吗？那么注释可以省去你记忆思维轨迹的烦恼，并成为记录你当时想法的绝佳方式。它们还可以被用于批量排除某些代码块。\n\
    \n```php\n// 这是一个单行注释\n# 这是另一个单行注释\n\n/* 这是一个块注释。这里的所有内容都将被忽略，并跨越多行。 */\n```\n\
    \n## 变量\n\n为了构建你梦想中的网站，你需要数据以及存储这些数据的方法。它可以是一个名称、数字或图片。PHP 提供了一种方法让你使用变量将它们存储在内存中。PHP\
    \ 中的每个变量都以 `$` 符号开头，后跟变量名，且符号与名称之间没有任何空格：\n\n```php\n$myInt = 10;\n```\n\n让我们通过以下内容来看一些实际应用：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <?php\n            $txt\
    \ = \"My second script!\";\n            echo $txt;\n        ?>\n    </body>\n\
    </html>\n```\n\n你只需要记住，每个 PHP 语句都以分号结束（注释除外。我们将在本节的晚些时候讨论它们）。\n\n关于变量的几点注意事项：\n\
    - (Images/image0883.jpeg) 它们是大小敏感的\n- (Images/image0884.jpeg) 它们必须以字母开头\n- (Images/image0885.jpeg)\
    \ 它们可以是数字\n- (Images/image0886.jpeg) 它们可以包含\n\nPHP 是一种弱类型语言，会根据值自动进行类型转换。通过赋值操作可以实现相同的结果。以下是常用的数据类型：\n\
    \n- (Images/image887.jpeg) 整数 (Integer)\n- (Images/image888.jpeg) 浮点数 (Float)\n\
    - (Images/image889.jpeg) 字符串 (String)\n- (Images/image890.jpeg) 布尔值 (Boolean)\n\
    - (Images/image891.jpeg) 数组 (Array)\n- (Images/image892.jpeg) 对象 (Object)\n\n\
    你可以通过使用以下内容来实现相同的结果：\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n       \
    \ <?php\n            $txt = \"My third script!\";\n            echo $txt;\n  \
    \      ?>\n    </body>\n</html>\n```\n\n## 常量\n\n文件看起来仍然像你的基础 HTML 文件，不同之处是你在标签\
    \ `<?php` 和 `?>` 之间嵌入了 PHP 代码。`echo` 语句仅会将其之后的所有内容输出到屏幕上。在我们的案例中，这将是“My first\
    \ PHP script!”。我们稍后将看到它的运行效果。\n\n常量与变量不同，它们的值不能被更改。使用 `define()` 配合一个名称和一个值：\n\
    \n```php\ndefine(\"MESSAGE\", \"Happy Learning!\");\n```\n\n输出：Happy Learning!\n\
    \n你可以指定一个常量是否为真值：\n\n```php\ndefine(\"MESSAGE\", \"Happy Learning!\", true);\n\
    echo MESSAGE;\n```\n\n关于常量的规则：\n\n- (Images/image0893.jpeg) 它们必须以字母开头\n- (Images/image0894.jpeg)\
    \ 它们是全局的\n\n## 运算符\n\nPHP 使用运算符对变量和值进行各种操作。我们现在来看组使用的运算符。\n\n### 算术运算符\n\n这些运算符对值进行数学运算并返回计算结果：\n\
    \n| 示例 | 运算符 | 结果 |\n| --- | --- | --- |\n| `$x + $y` | 加法 | $x$ 和 $y$ 的和 |\n\
    | `$x - $y` | 减法 | $x$ 和 $y$ 之间的差 |\n| `$x * $y` | 乘法 | $x$ 和 $y$ 的积 |\n| `$x\
    \ / $y` | 除法 | $x$ 除以 $y$ 的商 |\n| `$x % $y` | 取模 | $x$ 除以 $y$ 的余数 |\n| `$x **\
    \ $y` | 幂 | $x$ 的 $y$ 次方（PHP.6 新增） |\n\n### 赋值运算符\n\n这些运算符用于为变量赋值：\n\n| 赋值 | 等同于\
    \ | 描述 |\n| --- | --- | --- |\n| `$x = $y` | `$x = $y` | 获取 $y$ 的值并将其赋值给 $x$ |\n\
    | `$x += $y` | `$x = $x + $y` | 获取 $x$ 和 $y$ 的和并将结果赋值给 $x$ |\n| `$x -= $y` | `$x\
    \ = $x - $y` | 获取 $x$ 和 $y$ 的差并将结果赋值给 $x$ |\n| `$x *= $y` | `$x = $x * $y` | 获取\
    \ $x$ 和 $y$ 的积并将结果赋值给 $x$ |\n\n"
