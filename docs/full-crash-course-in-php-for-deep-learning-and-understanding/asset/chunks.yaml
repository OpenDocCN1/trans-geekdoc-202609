    allowed. In our case, the allowed values are ‘L’ for Long Play (LP), ‘E’ for Extended
    Play (EP) and ‘M’ for a mix tape.


    6\.  Adding the numTracks Field


    If this seems wrong to you, then you have been paying attention! This field is
    used to store the number of tracks the album has and should be a numeric type
    and not a string type. This was done intentionally to demonstrate how to change
    the data type and name of a field/column later of in the chapter.


    7\.  Adding DateReleased Field


    The last line created stores the date the album was released. The date data type
    is used to store date values.


    Let us look at some of the common data types that you will be using:


    ![](Images/image00920.jpeg)Numeric Types


    1\.  INT: whole number 2^31 to \-2^31 – 1


    2\.  FLOAT: Decimal spaces 1.1E38 to \-1.1E37


    3\.  Double: Decimal spaces 1.7E308 to \-1.7E307


    ![](Images/image00921.jpeg)String Types


    1\.  CHAR: fixed length character string


    2\.  VARCHAR: Character string with a variable length


    3\.  ENUM: A character string that has a limited number of total values which
    you must define


    ![](Images/image00922.jpeg)Date and Time


    1\.  DATE: YYYY:MM:DD


    2\.  TIME: HH:MM:SS


    3\.  DATETIME:YYYY\-MM-DD HH:MM:SS


    4\.  YEAR: YYYY


    Altering Tables


    Sometime you can make a mistake or may just wish to changes things in your table.
    Luckily, you can do so with MySQL by altering the table using MySQL statements.
    We will look at changing table and column names, and changing data types.


    First we need to look at the table we just created by the typing following command
    to describe our table. We should be able to see its structure in the command line:


    DESCRIBE Album;


    You should see the following output:


    +––––—+–––––––-+––+–—+–––+–––––-+


    | Field        | Type                 | Null | Key | Default | Extra          |


    +––––—+–––––––-+––+–—+–––+–––––-+


    | AlbumID      | smallint(5) unsigned | NO   | PRI | NULL    | auto\_increment
    |


    | AlbumName    | varchar(255)         | NO   |     | NULL    |                |


    | AlbumArtist  | varchar(80)          | NO   |     | NULL    |                |


    | AlbumType    | enum(‘A’,‘E’,‘M’)    | NO   |     | NULL    |                |


    | numTracks    | varchar(3)           | NO   |     | NULL    |                |


    | DateReleased | date                 | NO   |     | NULL    |                |


    +––––—+–––––––-+––+–—+–––+–––––-+


    Looks like we can indeed change a few things:


    1\.  Changing the Table Name


    Seems the singular form “Album” doesn’t make much sense as a table is used to
    store multiple records. We should use the plural form and change it from Album
    to Albums. Just so it makes more sense.


    Here is how we change the table name:


    RENAME TABLE Album to Albums;


    If we enter the show tables command we should see the table name has changed:


    +–––––—+


                  | Tables\_in\_music |


                  +–––––—+


                  | albums          |


                  +–––––—+


    2\.  Changing The Data Type of numTracks


    The field numTracks should not be a string type but numeric. The following code
    should change its data type to the appropriate one:


    ALTER TABLE Albums


                  MODIFY COLUMN numTrackssmallint(2) NOT NULL;


    3.   Changing the Column Name fornumTracks


    It seems we are still not done with the field numTracks. We need to change it
    to make it a little more readable by changing it from numTracks to NumberOfTracks.


    ALTER TABLE Albums


                  CHANGE numTracksNumberOfTrackssmallint(2) NOT NULL;


    NOTE: we still have to define the data type even when changing the name of the
    column


