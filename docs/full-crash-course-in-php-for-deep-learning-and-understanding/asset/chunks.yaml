- raw: 'The other type of array worth mentioning is a multidimensional array These
    are arrays that contain other arrays. But they are an advanced topic that you
    can look into further.


    Summary


    Congratulations! You are now acquainted with the basics of PHP. By now you should
    be able see the power PHP offers you. In this chapter we discussed conditional
    statements that allow the code you write to make decisions based on specified
    conditions. Then we


    looked at loops that execute a block of code until a condition specified return
    false or until they run out elements. Next we discussed how to call code multiple
    times in a program by putting them in a function, and also how to pass them information
    and have them return values to us. Finally, we looked into numeric and associative
    arrays. We created them and returned values by either accessing them directly
    or looping through them.


    Now you are ready to take a breather from PHP and make another cup of coffee.
    This only gets more interesting!


    Chapter 3 - Hour 3: MySQL Basics  


    [“Tell me and I forget, teach me and I may remember, involve me and I learn.”
    \- Benjamin](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)


    [Franklin](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)


    In this chapter we will cover:


    ![](Images/image00910.jpeg)Start MySQL


    ![](Images/image00911.jpeg)Create and Deleting Databases


    ![](Images/image00912.jpeg)Creating, Reading, Updating and Deleting Tables (CRUD)


    Now that we have looked into PHP, let’s look at what enables the PHP to populate
    webpages with content. That would be a database such as MySQL. We will look at
    most of the things you need to know in order to consider yourself a master of
    the basics of MySQL and do what you need to for that next step in achieving your
    dreams.


    This will be a breeze as we will learn how to do some really cool things with
    databases.


    Below is a picture of the table we will create and be working with in the database.
    We will just be adding albums to a music database. You have the table name at
    the very top and the fields or columns below the table name.


    Albums


    ![](Images/image00913.jpeg)AlbumID AlbumName AlbumArtist AlbumType NumberOfTracks
    DateReleased


     Starting MySQL Client


    What we are to be doing for this hour is entering MySQL commands using the command-
    line of the MySQL client that comes with XAMPP by opening up Windows command prompt
    and navigating to the root folder of where XAMPP is installed.


    When you open command prompt, enter the below command to navigate to the “C” drive,
    Assuming XAMPP is installed there, and then press enter after that:


    cd \\


    Now, navigate to where the executable for the client is installed to start it.
    That is in


    xampp->mysql->bin by entering the following command and then pressing enter:


    cdxampp\\mysql\\bin


    Once there, type the following command:


    mysql \-u your\_username \-p


    Replace “your\_username” with your actual username. This is “root” by default.
    You will then be asked to enter your password. Once you do that, press enter.
    The password is blank by default and you really ought to change that for security
    reasons. But that is beyond the scope of this book.


    If you notice with command-line is being prompted by something called MariaDB.
    Don’t get confused because it is just a community-developed fork of the MySQL
    relational database management system. A large number of SQL commands will still
    work and unlike the previous MySQL prompt, it lets you known which database you
    have selected.


    Now we are ready to get started!


    TIP: Alternatively you can use the phpmyadmin interface to create databases and
    table with just a few clicks. You can also type SQL commands there but since we
    want to get hard-core as fast as possible, we won’t be doing that. Besides, nothing
    in this hour has been hard so far, I hope.


    Creating and Deleting a Database


    Let’s start by creating a database by entering the following command:


    CREATE DATABASE music;


    Always remember this:


    ![](Images/image00914.jpeg)From here onwards, all statements and commands typed
    should end with semicolon or /g. Otherwise the client will think you are still
    typing the command and it won’t execute


    ![](Images/image00915.jpeg)Although not required, because command line is not
    case sensitive, MySQL commands are typed in uppercase letters to distinguish between
    commands and things like database names, table names, columns and rows


    To delete the database it is as easy as entering:


    DROP database\_name;


    Where “database\_name” is the name of the database you want to drop.


    Now that we have created our database, we need to select it in order to create
    tables. We type the following into you command line to select the database we
    just created, and then press enter:


    USE music;


    WARNING: Don’t forget to select the database otherwise you will get errors when
    you try to create tables etc.


    NOTE: the command-line prompt will let you know which database you have selected.
    It should look something like this “Maria DB \[music\]>”.


     Creating, Altering and Deleting Tables


    Now that we have selected out database, let’s create some tables. The first table
    we will create is about information on the artist.


    It is good practice (and headache saving) to first check if any tables with the
    same name exists because you can’t create two tables with the same name in the
    same database. If one is found, it is deleted along with its data. So, be careful
    with this command especially if


    the table is related to other tables.


    Creating Tables


    We create the table as follows:


    CREATE TABLE Album


    (


                  AlbumIDsmallint unsigned NOT NULL auto\_increment PRIMARY KEY,


                  AlbumNamevarchar(255) NOT NULL,


                  AlbumArtistvarchar(80) NOT NULL,


                  AlbumType ENUM(‘A’, ‘E’, ‘M’) NOT NULL,


                  numTracksvarchar(3) NOT NULL,


                  DateReleasedDATE NOT NULL


    );


    TIP: When typing large commands it is easy to mess up. Especially when using thecommand
    line. If this happens just press the up arrow on your keyboard to bring up previous
    commands and use the left and right arrows to navigate to where you messed up
    and fix.


    To see the list of tables in you database, enter the following piece of code:


    SHOW tables;


    You see the following output:


    +–––––—+


    | Tables\_in\_music |


    +–––––—+


    | album           |


    +–––––—+


    When you press Enter, the following table will be added to the music database.
    Let us break down what is happening:


    1\.  Creating the Album Table


    CREATE TABLE Artists () creates a new table and the lines inside the parenthesis
    define the table’s structure.


    2\.  Giving Each Album a Unique ID


    The field (or column) AlbumsID has the following properties:


    ![](Images/image00916.jpeg)smallint unsigned (unsigned small integer) – this means
    we can store artists in


    the range 32,278 to – 32,767.We will look at the common data types that you will
    be working with later on in the chapter.


    ![](Images/image00917.jpeg)NOT NULL – this means the field cannot be left blank
    when creating a record.


    ![](Images/image00918.jpeg)auto\_increment – this just means that you don’t have
    to enter anything in the field. When a record is created, it will be assigned
    a new value by MySQL.


    ![](Images/image00919.jpeg)PRIMARY KEY \-Each table can only have one Primary
    Key. It is used to uniquely identify a record/row in a database and, once created,
    it can never be changed. This makes it quicker to find (at the expense of some
    storage space).


    3\.  Adding the AlbumName Field


    Next we create a field to store the name of the album. The data type varcharstands
    for variable number of character and stores a string of up to 225 characters.


    4\.  Adding the AlbumArtist Field


    This field also stores a variable number of characters and its string is limited
    to only 80 characters.


    5\.  Adding the AlbumType Enumerated Type Field'
