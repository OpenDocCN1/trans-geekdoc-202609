  \n## 总结\n\n就是这样！在本章之前，我们分别学习了 PHP 和 MySQL，而本章旨在整合这两者，并展示如何使用它们生成动态内容。由于你现在已经具备了能力，修改网站以满足你的需求应该并不难。\n\
  \n在本章中，我们创建了一个存储数据库连接的配置文件，并在整个网站中使用它来建立数据库连接并查询以存储和检索数据。我们创建了一个页面，让你能够查看添加到数据库的家庭成员信息。\n\
