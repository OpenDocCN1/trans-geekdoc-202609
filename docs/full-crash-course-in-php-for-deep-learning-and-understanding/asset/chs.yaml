- "# PHP 深度学习与理解完全教程\n\n\n\n![](img/image00874.jpeg)\n\n\n\n## PHP 简析\n\nPHP 代表 Hypertext\
  \ Processor（超文本处理器）。它是一种服务器端脚本语言，主要用于生成动态网页内容等。这意味着 `PHP` 执行的所有操作并不是在用于查看网页的计算机（称为客户端）上完成的，而是在一台称为服务器的专用计算机上完成的，服务器托管了你在客户端机器上查看的所有网页。\n\
  \n作为一种脚本语言，`PHP` 实际上不能用于制作在你的计算机上运行的独立应用程序，因为它被设计为仅在网页内发生事件时执行操作，例如：点击链接或提交 Web\
  \ 表单时获取表单数据。\n\n你可以将 `PHP` 嵌入到你的 `HTML` 网页中，并根据从用户处获得的信息生成自定义页面。这使得网页比纯静态页面更具趣味。`PHP`\
  \ 可用于生成网页，因为它的最终输出是 `HTML`。\n\n它在服务器端非常高效，被广泛使用，跨平台（运行在 `Windows`、`Linux`、`UNIX`、`Mac\
  \ OS X` 等），并且比任何其他全功能语言（如 `C`、`Java` 或 `Perl`）都更容易学习。\n\n`PHP` 也非常强大。如果你怀疑它的威力，下次当你决定登录\
  \ `Facebook` 时，仔细看看浏览器中的地址栏即可。你会发现，全球最大的社交网站是由 `PHP` 驱动的！甚至 `Wikipedia`（那个能告诉你所有所需知识的网站）也是由\
  \ `PHP` 驱动的。这就是 `PHP` 背后的力量，使其成为微软 Active Server Pages (`ASP`) 等竞争对手的极佳替代方案。\n\n\
  它还拥有一个非常活跃的社区，可以在你困难时为你提供真正的帮助，并且一直活跃。根据 [`http://www.w3schools.com ]](http://www.w3schools.com)\
  \ 的 `PHP` 页面；`PHP` 允许你完成以下操作：\n\n* `PHP` 可以生成动态页面内容\n* `PHP` 可以在服务器上创建、打开、读取、写入、删除和关闭文件\n\
  * `PHP` 可以收集表单数据\n* `PHP` 可以发送和接收 cookie\n* `PHP` 可以对你的数据库进行添加、删除、修改数据（这就是为什么它是\
  \ `MySQL` 的完美搭档）\n* `PHP` 可以用于控制用户访问\n* `PHP` 可以加密数据\n\n## MySQL 简析\n\n`MySQL` 是一个流行的开源关系型数据库，以\
  \ `SQL` 为基础。它允许你存储、检索和操作数据。它是一个高效且可扩展的解决方案，而且具有成本效益。\n\n许多基于 Web 的程序（包括计算机程序）使用数据库来存储信息。社交应用程序需要一个地方来存储用户信息、图片、帖子、评论等，这时像\
  \ `MySQL` 这样的数据库就派上用场了，存储和检索大量信息变得轻而易举。\n\n`SQL` 通常读作 \"sequel\"，代表结构化查询语言。它是一种为像\
  \ `MySQL` 之类的数据库管理数据设计的语言。它们使用 `SQL` 通过特殊的命令来发送和检索数据，这些命令其实并不难学。最重要的是，对于这本书的读者来说，你可以将\
  \ `SQL` 嵌入到 `PHP` 等编程语言中。\n\n此外，`MySQL` 是开源的，免费提供，如果某些特定功能不符合你的设，可以通过修改源代码进行更改。\n\
  \n## 本书将涵盖的内容\n\n本书分为四个主要章节（或四个“小时”），帮助你进入 `PHP` 和 `SQL` 的核心，并让你在很快成为大师。\n\n在第一个小时里，我们将花时间安装非常需要的名为\
  \ `XAMPP` 的 Web 服务器包。我建议在开始该章节之前，先在这里下载它：[`https://www.apachefriends.org/index.html\
  \ ]](https://www.apachefriends.org/index.html)。这将使我们能够运行书中的示例。然后，我们将为 `PHP` 代码选择一个文本编辑器。接着我们将学习如何运行\
  \ `PHP` 脚本，最后我们将涵盖一些 `PHP` 的基础知识，如注释、变量、常量和操作符。\n\n书中的示例可以手动输入，或者为了节省时间复制并粘贴到你的代码编辑器或命令行界面中。\n\
  \n在第二个小时里，我们将继续学习 `PHP` 并涵盖条件语句、循环 (`Loops`)、数组 (`Arrays`) 和函数。在本章之后，你应该认为自己已经很熟悉了\
  \ `PHP`，可以处理进一步更高级的主题了。\n\n这一部分你可以休息一下，让大脑吸收一下，然后再去泡杯咖啡。\n\n在第三个小时里，我们将处理 `MySQL`\
  \ 及其命令，但首先我们要学习如何访问命令行。然后我们进入允许我们创建和删除数据库的命令；创建、修改和删除表；在表中插入、选择、更新和删除数据。\n\n最后，在最后一个小时里，我们将\
  \ `PHP` 和 `MySQL` 结合起来，创建一个简单的网站，向你展示这两者是如何协同工作的。\n\n让我们开始吧。拿起你的第一杯咖啡！\n\n\n\n\n\
  \n\n\n请耐心一下。我知道编程书的第一章都会堆砌一些理论，以确保你知道自己在面对什么。但那是以后的事。现在你需要安装服务器并选择一个合适的文本编辑器！\n\n\
  ## 安装 Web 服务器\n\n通往 `PHP` 大师之路的第一真正步在这里。你不能像运行 `HTML` 那样直接在浏览器中运行 `PHP`。为了运行 `PHP`，你需要在本地安装一个服务器，以便浏览器解析\
  \ `PHP` 脚本并向数据库运行 `MySQL` 查询以返回结果。或者，你可以使用支持 `PHP` 和 `MySQL` 的主机，这样你可以将其上传到他们的服务器并在那里部署你的梦想网站。但我猜你真的想在本地测试。因此，我们将安装一个让你的电脑变成测试服务器的本地服务器。\n\
  \n本地可以安装很多服务器，例如 `XAMP`、适用于 Windows 的 `WAMP` 以及适用于 Mac OS X 的 `MAMP` 等，但本书涵盖 `XAMP`。它是一个适用于\
  \ Windows、Mac 和 Linux 的免费开源跨平台服务器包。\n\n访问网站 [`www.apachefriends.org/index.html`](http://www.apachefriends.org/index.html)\
  \ 下载最新版本的 Windows 版 `XAMP`（步骤同样适用于 Mac 或 Linux）。下载完成后，在本地机器上找到该文件并双击安装。\n\n简单！现在\
  \ `PHP` 和 `MySQL` 已准备就绪。\n\n**注意**：如果你此时运行着杀病毒软件，它可能会干扰安装过程。你可能需要在服务器安装完成之前将其关闭，以避免任何潜在问题。\n\
  \n## 安装文本编辑器\n\n现在，你需要一个文本编辑器来编写优美的 `PHP`。理想情况下，任何文本编辑器都可以，甚至 Windows 默认的记事本或 Mac\
  \ OS X 的终端都可以用于编写 `PHP`。我们将使用 `notepad++`，因为它有一些非常实用的功能，有助于快速编写整洁高效的代码，例如语法高亮和自动补全。\n\
  \n而且它是免费的！\n\n\n\n\n\n这些文本编辑器将通过此处下载并安装来为你节省时间并避免许多痛苦。下载一个文本编辑器并安装它。只需记住，任何编辑器都可以。所以即使你没有\
  \ `notepad++`，也可以使用任何你喜欢的工具。\n\n# 启动 Apache 以运行 PHP 脚本\n\n现在你已经安装了 `XAMPP`，你需要启动\
  \ `apache` Web 服务，以便浏览器能够运行 PHP 脚本。要执行此操作，请双击 `XAMPP` 图标打开其控制面板。默认情况下，它应该会自动启动 Apache，但你可以像下面图片所示点击“Start”来手动启动：\n\
  \n![](img/image0088.jpeg)\n\n注意：你电脑上安装的其他应用程序可能会导致 Apache 无法启动，因为它们使用了与 Apache 配置相同的端口，例如\
  \ Skype。如果出现这种情况，只需停止那些服务并重新启动 Apache 即可。\n\n## 创建你的第一个 PHP 脚本\n\n这部分非常简单。你只需要按照以下步骤操作：\n\
  \n### 步骤 1 - 创建 PHP 文件\n\n打开你的文本编辑器，创建一个普通的文本文件，并将以下代码粘贴其中：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n    <body>\n        <?php\n            echo “My first PHP script!\"\
  ;\n        ?>\n    </body>\n</</html>\n```\n\n该文件看起来仍然像你的基础 HTML 文件，不同之处是你在标签 `<?php`\
  \ 和 `?>` 之间嵌入了 PHP 代码。`echo` 语句仅会将其之后的所有内容输出到屏幕上。在我们的案例中，这将是“My first PHP script!”。我们稍后将看到它的运行效果。\n\
  \n你只需要记住，每个 PHP 语句都以分号结束（注释除外。我们将在本节的晚些时候讨论它们）。\n\n将文件保存为“example.php”。\n\n### 步骤\
  \ 2 - 将其放在 XAMPP 的根目录下\n\n获取你刚刚创建的 `example.php` 文件，并将其放在服务器根目录下名为 `htdocs` 的文件夹中，完成！你已经准备好在浏览器中运行它了。\n\
  \n提示：要找到根目录，你可以在本地机器上查找它，或者直接打开 `XAMPP` 控制面板并点击“Explorer”按钮（如下图所示）来调出根文件夹，然后找到 `htdocs`\
  \ 文件夹并将文件放在其中：\n\n![](img/image00881.jpeg)\n\n注意：放置 PHP 文件的文件夹对于每个服务器都不同。例如；如果你使用\
  \ WAMP，则将它们放在名为 `www` 的文件夹中。\n\n### 步骤 3 - 在浏览器中运行\n\n打开你的浏览器（推荐使用 Google Chrome\
  \ 或 Firefox）并输入：`http://localhost/example.php`\n\n按下回车键，你应该能看到下面的内容：\n\n![](img/image0882.jpeg)\n\
  \n大搞定！如果你遵循了这些步骤，你应该能够运行在本章节中创建的所有其他脚本。\n\n# PHP 基础\n\n## 注释\n\n想为你自己或团队的其他成员留下留言吗？那么注释可以省去你记忆思维轨迹的烦恼，并成为记录你当时想法的绝佳方式。它们还可以被用于批量排除某些代码块。\n\
  \n```php\n// 这是一个单行注释\n# 这是另一个单行注释\n\n/* 这是一个块注释。这里的所有内容都将被忽略，并跨越多行。 */\n```\n\n\
  ## 变量\n\n为了构建你梦想中的网站，你需要数据以及存储这些数据的方法。它可以是一个名称、数字或图片。PHP 提供了一种方法让你使用变量将它们存储在内存中。PHP\
  \ 中的每个变量都以 `$` 符号开头，后跟变量名，且符号与名称之间没有任何空格：\n\n```php\n$myInt = 10;\n```\n\n让我们通过以下内容来看一些实际应用：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <?php\n            $txt\
  \ = \"My second script!\";\n            echo $txt;\n        ?>\n    </body>\n</html>\n\
  ```\n\n你只需要记住，每个 PHP 语句都以分号结束（注释除外。我们将在本节的晚些时候讨论它们）。\n\n关于变量的几点注意事项：\n- (Images/image0883.jpeg)\
  \ 它们是大小敏感的\n- (Images/image0884.jpeg) 它们必须以字母开头\n- (Images/image0885.jpeg) 它们可以是数字\n\
  - (Images/image0886.jpeg) 它们可以包含\n\nPHP 是一种弱类型语言，会根据值自动进行类型转换。通过赋值操作可以实现相同的结果。以下是常用的数据类型：\n\
  \n- (Images/image887.jpeg) 整数 (Integer)\n- (Images/image888.jpeg) 浮点数 (Float)\n\
  - (Images/image889.jpeg) 字符串 (String)\n- (Images/image890.jpeg) 布尔值 (Boolean)\n\
  - (Images/image891.jpeg) 数组 (Array)\n- (Images/image892.jpeg) 对象 (Object)\n\n你可以通过使用以下内容来实现相同的结果：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <?php\n            $txt\
  \ = \"My third script!\";\n            echo $txt;\n        ?>\n    </body>\n</html>\n\
  ```\n\n## 常量\n\n文件看起来仍然像你的基础 HTML 文件，不同之处是你在标签 `<?php` 和 `?>` 之间嵌入了 PHP 代码。`echo`\
  \ 语句仅会将其之后的所有内容输出到屏幕上。在我们的案例中，这将是“My first PHP script!”。我们稍后将看到它的运行效果。\n\n常量与变量不同，它们的值不能被更改。使用\
  \ `define()` 配合一个名称和一个值：\n\n```php\ndefine(\"MESSAGE\", \"Happy Learning!\");\n\
  ```\n\n输出：Happy Learning!\n\n你可以指定一个常量是否为真值：\n\n```php\ndefine(\"MESSAGE\", \"Happy\
  \ Learning!\", true);\necho MESSAGE;\n```\n\n关于常量的规则：\n\n- (Images/image0893.jpeg)\
  \ 它们必须以字母开头\n- (Images/image0894.jpeg) 它们是全局的\n\n## 运算符\n\nPHP 使用运算符对变量和值进行各种操作。我们现在来看组使用的运算符。\n\
  \n### 算术运算符\n\n这些运算符对值进行数学运算并返回计算结果：\n\n| 示例 | 运算符 | 结果 |\n| --- | --- | --- |\n\
  | `$x + $y` | 加法 | $x$ 和 $y$ 的和 |\n| `$x - $y` | 减法 | $x$ 和 $y$ 之间的差 |\n| `$x *\
  \ $y` | 乘法 | $x$ 和 $y$ 的积 |\n| `$x / $y` | 除法 | $x$ 除以 $y$ 的商 |\n| `$x % $y` | 取模\
  \ | $x$ 除以 $y$ 的余数 |\n| `$x ** $y` | 幂 | $x$ 的 $y$ 次方（PHP.6 新增） |\n\n### 赋值运算符\n\
  \n这些运算符用于为变量赋值：\n\n| 赋值 | 等同于 | 描述 |\n| --- | --- | --- |\n| `$x = $y` | `$x = $y`\
  \ | 获取 $y$ 的值并将其赋值给 $x$ |\n| `$x += $y` | `$x = $x + $y` | 获取 $x$ 和 $y$ 的和并将结果赋值给\
  \ $x$ |\n| `$x -= $y` | `$x = $x - $y` | 获取 $x$ 和 $y$ 的差并将结果赋值给 $x$ |\n| `$x *=\
  \ $y` | `$x = $x * $y` | 获取 $x$ 和 $y$ 的积并将结果赋值给 $x$ |\n\n\n\n\n\n| `$x %= $y ||\
  \ $x \\= $x % $y` | 获取 `$x` 除以 `$y` 的余数并将结果赋值给 `$x` |\n\n## 比较运算符\n\nPHP 中的比较运算符用于比较两个值：\n\
  \n| 示例 | 名称 | 结果 |\n| :--- | :--- | :--- |\n| `$x \\== $y` | 等于 | 如果 `$x` 和 `$y`\
  \ 都相等，则返回 true |\n| `$x === $y` | 相同 | 如果 `$x` 和 `$y` 相等且数据类型相同，则返回 true |\n| `$x\
  \ != $y` | 不等于 | 如果 `$x` 和 `$y` 不相等，则返回 true |\n| `$x <> $y` | 不等于 | 如果 `$x` 和 `$y`\
  \ 不相等，则返回 true |\n| `$x !== $y` | 不相同 | 如果 `$x` 和 `$y` 不相等或它们的数据类型不同，则返回 true |\n\
  | `$x > $y` | 大于 | 如果 `$x` 大于 `$y`，则返回 true |\n| `$x < $y` | 小于 | 如果 `$x` 小于 `$y`，则返回\
  \ true |\n| `$x >= $y` | 大于等于 | 如果 `$x` 大于或等于 `$y`，则返回 true |\n| `$x <= $y` | 小于等于\
  \ | 如果 `$x` 小于或等于 `$y`，则返回 true |\n\n## 逻辑运算符\n\n逻辑运算符是我们用于组合条件语句（我们将在下一小时介绍）以获得\
  \ true 或 false 结果的：\n\n| 示例 | 名称 | 结果 |\n| :--- | :--- | :--- |\n| `$x && $y` |\
  \ 与 | 如果 `$x` 和 `$y` 都为 true，则返回 true |\n| `$x || $y` | 或 | 如果 `$x` 或 `$y` 其中为 true，则返回\
  \ true |\n| `!$x` | 非 | 如果 `$x` 不为 true，则返回 true |\n| `$x and $y` | 与 | 如果 `$x`\
  \ 和 `$y` 都为 true，则返回 true |\n| `$x or $y` | 或 | 如果 `$x` 或 `$y` 其中为 true，则返回 true\
  \ |\n| `$x xor $y` | 异或 | 如果 `$x` 小于 `$y`，则返回 true |\n\n## 增/减（三元）运算符\n\n这些运算符也称为三元运算符，用于增加/减少变量的值\
  \ 1\n\n| 示例 | 名称 | 结果 |\n| :--- | :--- | :--- |\n| `++$x` | 前自增 | 给 `x` 加 1，然后返回\
  \ `$x` |\n| `$x++` | 后自增 | 返回 `$x`，然后给 `$x` 加 1 |\n| `--$x` | 前自减 | 从 `x` 减 1，然后返回\
  \ `$x` |\n| `$x--` | 后自减 | 返回 `$x`，然后从 `$x` 减 1 |\n\n## 字符串运算符\n\n这些是专门为字符串设计的运算符：\n\
  \n| 示例 | 名称 | 结果 |\n| :--- | :--- | :--- |\n| `$str1 . $str2` | 拼接 | 返回 `$str1`\
  \ 和 `$str2` 的拼接结果 |\n| `$str1 .= $str2` | 拼接赋值 | 将 `$str2` 追加到 `$str1` |\n\n## 数组运算符\n\
  \n这些是用于比较数组的运算符（我们将在下一小时讨论）：\n\n| 示例 | 运算符 | 结果 |\n| :--- | :--- | :--- |\n| `$x\
  \ + $y` | 并集 | `$x` 和 `$y` 的并集 |\n| `$x \\== $y` | 等于 | 如果 `$x` 和 `$y` 具有相同的键值对，则结果为\
  \ true |\n| `$x === $y` | 恒等 | 如果 `$x` 和 `$y` 具有相同顺序的相同键值对且数据类型相同，则结果为 true |\n\
  | `$x != $y` | 不等于 | 如果 `$x` 的值不等于 `$y` 的值，则返回 true |\n| `$x <> $y` | 不等 | 如果 `$x`\
  \ 的值不等于 `$y` 的值，则返回 true |\n| `$x !== $y` | 非相同 | 如果 `$x` 和 `$y` 不相同，则返回 true |\n\
  \n## 总结\n\n到为止，我们已经涵盖了为了开始学习并看到 PHP 运行所需了解的大量内容。我们安装了一个名为 XAMPP 的服务器，它带有 Apache\
  \ 服务，允许我们在浏览器中运行 PHP 脚本。你现在应该非常熟悉创建和运行 PHP 脚本，并了解了如何向屏幕输出信息。我们还涵盖了 PHP 的一些基础知识，如变量和常量，并查看了一些运算符；其中一些在下一小时将很有用。让我们继续前进吧！\n\
  \n\n“空谈是廉的。给我看代码” – Thomas C. Gale\n\n在这一章中我们将涵盖：\n- 条件语句\n- 循环\n\n这一部分我们将深入探讨 PHP\
  \ 的基础，并进行许多酷炫的操作。你完成了基础知识的“沙拉部分”，现在是“肉菜部分”。\n\n### 条件语句\n\n条件语句允许代码中进行一些决策。它们根据程序员指定的条件被求值为为\
  \ true 还是 false 来执行不同的操作。以下是 PHP 中使用的条件语句列表：\n\n- If 语句\n- If…else 语句\n- If…else…else\
  \ 语句\n- Switch 语句\n\n### If 语句\n\n`if` 语句评估一个表达式并如果表达式求值为 true 则执行代码块。如果表达式求值为 false，则忽略该代码块。下面的示例将输出“5\
  \ 小于 10”，如果条件成立：\n\n```php\n<?php\n$x = 5;\nif ($x < 10) {\n    echo \"$x 小于 10!\"\
  ;\n}\n?>\n```\n输出：\n5 小于 10\n\n### If…else 语句\n\n`if…else` 语句评估一个表达式并如果表达式求值为 true\
  \ 则执行代码块。如果第一个条件不成立，则执行另一个代码块。下面的示例将输出“50 大于 20”，因为它满足了第二个条件：\n\n```php\n<?php\n\
  $x = 50;\nif ($x < 10) {\n    echo \"$x 小于 10!\";\n} else if ($x > 20) {\n    echo\
  \ \"$x 大于 20!\";\n}\n?>\n```\n输出：\n50 大于 20\n\n### If…elseif…else 语句\n\n`if…elseif…else`\
  \ 语句与 `if…else` 语句相同，区别在于当所有条件都失败时，会执行最后一个代码块。下面的示例将输出“15 在 10 到 20 之间”，因为 `$x`\
  \ 是 15。它需要小于 10 以满足第一个条件，大于 20 以满足第二个条件，否则它在 10 到 20 之间：\n\n```php\n<?php\n$x =\
  \ 15;\nif ($x < 10) {\n    echo \"$x 小于 10!\";\n} else if ($x > 20) {\n    echo\
  \ \"$x 大于 20!\";\n} else {\n    echo \"$x 在 10 到 20 之间!\";\n}\n?>\n```\n输出：\n15\
  \ 在 10 到 20 之间\n\n### Switch 语句\n\n`switch` 语句将表达式的值与多个 case 进行匹配。如果匹配，则执行该 case\
  \ 相关的代码。如果没有找到匹配，则使用 `default` 语句。`break` 语句防止代码跳转到下一个 case。下面的示例将检查 `$lunch` 的值与所有\
  \ case 的匹配。在这种情况下，输出将是“汉堡很好吃！”，因为那是对应的 case：\n\n```php\n<?php\n$lunch = \"burger\"\
  ;\nswitch ($lunch) {\n    case \"cereal\":\n        echo \"麦片？你午饭吃早餐了吗？\";\n   \
  \     break;\n    case \"salad\":\n        echo \"沙拉是一份健康的午餐！\";\n        break;\n\
  \    case \"burger\":\n        echo \"汉堡很好吃！\";\n        break;\n    default:\n\
  \        echo \"看起来你错过了午餐。这不太好！\";\n}\n?>\n```\n\n循环只要指定的条件保持为真，就会重复执行代码块。下面的代码显示了\
  \ `$x` 的值如果小于或等于 5。如果条件为真，它将被输出到屏幕并再次递增，直到条件返回假：\n\n```php\n<?php\n$x = 1;\nwhile\
  \ ($x <= 5) {\n    echo $x;\n    $x++;\n}\n?>\n```\n\n\n\n\n\n```php\nwhile ($x\
  \ <= 5) {\n    echo “The value of x is: ” . $x . “<br />”;\n    $x++;\n}\n?>\n```\n\
  Output:\nThe value of x is: 1\nThe value of x is: 2\nThe value of x is: 3\nThe value\
  \ of x is: 4\nThe value of x is: 5\n\n### Do Loop\n\n至少执行一次代码块，然后循环执行直到指定的条件变为假。下面的示例显示了将\
  \ `$x` 的值输出到屏幕，然后至少减一，然后检查它是否大于零。如果是，则重复该过程，直到它小于零为止：\n\n```php\n<?php\n$x=5;\n\
  do {\n    echo “The value of x is: ” . $x . “<br />”;\n    $x--;\n} while ($x >=\
  \ 0);\n?>\n```\nOutput:\nThe value of x is: 5\nThe value of x is: 4\nThe value of\
  \ x is: 3\nThe value of x is: 2\nThe value of x is: 1\nThe value of x is 0\n\n##\
  \ For Loop\n\n循环执行代码块指定的次数。为了使循环工作，需要三个要素。下面的示例包含了所有这些要素：\n\n1. **初始化**：在这里声明一个变量来启动循环计数器。在我们的示例中，它是\
  \ `$x=1`。这意味着 `$x` 是初始化器，并被设置为 1。\n2. **条件**：这是循环的第二部分，我们在这里检查循环计数器是否仍然符合条件。当它返回假时，循环停止对代码块的执行。我们在下面的示例中的条件是\
  \ `$x <= 5`。\n3. **递增**：当循环结束时，这部分代码将执行一次，然后循环循环。在这里我们可以对循环计数器进行一些操作。在我们的情况下，我们通过\
  \ `$x++` 将 `$x` 的值增加 1。\n\n```php\n<?php\nfor ($x = 1; $x <= 5; $x++) {\n    echo\
  \ “The value of x is: ” . $x . “<br />”;\n}\n?>\n```\nOutput:\nThe value of x is:\
  \ 1\nThe value of x is: 2\nThe value of x is: 3\nThe value of x is: 4\nThe value\
  \ of x is: 5\n\n## For each Loop\n\n一种遍历数组中找到每个元素的循环。它会对数组找到的每个元素执行一次代码块，直到用完为止。下面的代码遍历数组中的所有元素，然后将元素的值输出到屏幕：\n\
  \n```php\n<?php\n$foods = array(“cereal”, “salad”, “burgers”, “fries”);\nforeach\
  \ ($foods as $food) {\n    echo “$food <br />”;\n}\n?>\n```\n\n## Functions\n\n\
  函数是程序中可以反复使用的代码段。函数接收一个或多个称为参数（也称为参数）的输入，并对它们进行某些操作。函数在处理完成后有时可以返回一个值。\n\n关于函数有需要记住的几点：\n\
  - 它们对大小写不敏感\n- 在页面加载时，除非被某些代码调用，否则它们不会自动执行\n- PHP 拥有超过 1000 个内置函数，可以满足你的需求\n\n###\
  \ 创建函数\n\n创建你自己的函数很容易；只需以关键字 `function` 开始，后面跟函数名和括号。之后，将你的代码放在两个大括号 `{` 和 `}` 之间，分别称为左括号和右括号。现在你可以根据需要多次使用该函数。这节省了你每次都要重新输入代码的麻烦。\n\
  \n下面的代码演示了一个向屏幕输出消息的函数：\n\n```php\n<?php\nfunction echoMessage() {\n    echo “Hello,\
  \ I am a PHP function!”\n}\nechoMessage();\n?>\n```\nOutput:\nHello, I am a PHP\
  \ function!\n\n### 函数参数\n\n有时你可以将信息传递给函数以便对它们进行操作。这些信息被称为参数，并放在括号中。你可以通过逗号分隔来添加多个参数。下面的示例显示了一个减去两个作为参数数字的函数：\n\
  \n```php\n<?php\nfunction subFunction($num1, $num2) {\n    $diff = $num1 - $num2;\n\
  \    echo “The difference between $num1 and $num2 is: ” . $diff;\n}\nsubFunction(5,\
  \ 6);\n?>\n```\nOutput:\nThe difference between 5 and 6 is: -1\n\n### 返回值的函数\n\n\
  函数不仅可以接受信息，还可以以返回值的的形式将其交回。只需编写 `return` 关键字，后跟你希望函数返回的值。这会停止函数的执行。在接下来的示例中，我们使用函数进行加法并将结果赋值给\
  \ `$return_val`，然后输出到屏幕：\n\n```php\n<?php\nfunction addFunction($num1, $num2) {\n\
  \    $sum = $num1 + $num2;\n    return $sum;\n}\n$return_val = addFunction(20, 15);\n\
  echo “The value returned by the function is: ” . $return_val;\n?>\n```\nOutput:\n\
  The value returned by the function is: 35\n\n在没有传递任何参数的情况下，我们可以为参数指定一个默认值。在下面的示例中：\n\
  \n```php\n<?php\nfunction PrintName($name = “Jack”) {\n    echo “Hi, my name is\
  \ $name;\n}\n//(); // 使用默认值\nPrintName(“Jill”);\nPrintName(“Adam”);\n?>\n```\nOutput:\n\
  Hi, my name is Jack\nHi, my name is Jill\nHi, my name is Adam\n\n### Arrays\n\n\
  数组是一种可以在单个变量中存储多个值的数据结构。每个值都与键相关联。\n\n### 数字数组\n\n这些数组使用数字作为索引。索引默认从零开始。创建数字数组有两种方法：\n\
  1. 这种方法自动分配索引：`$dairy = array(“yoghurt”, “ice cream”, “cheese cake”);`\n2. 这种方法手动分配索引：`$dairy[0]\
  \ = “yoghurt”`, `$dairy[1] = “ice cream”`, `$dairy[2] = “cheese cake”`\n\n示例显示了如何使用索引从数字数组获取值：\n\
  \n```php\n<?php\n$dairy = array(“yoghurt”, “ice cream”, “cheese cake”);\n// 通过索引访问值\n\
  echo “I to eat ” . $dairy[0] . “, ” . $dairy[1] . “ and ” . $dairy[2] . “!”;\n$arrayCount\
  \ = count($dairy); // 返回数组数量的内置函数\n// 使用 for 循环遍历数字数组\nfor ($i = 0; $i < $arrayCount;\
  \ $i++) {\n    echo $dairy[$i] . “<br />”;\n}\n?>\n```\nOutput:\nI to eat yoghurt,\
  \ ice cream and cheese cake!\nyoghurt\nice cream\ncheese cake\n\n### 关联数组\n\n使用字符串作为索引，这使得键和值之间建立了强关联。创建关联数组有两种方法。我们将通过使用奇装的价格来演示：\n\
  1. 第一种方法：`$suit_prices = array(“batman” => 4000, “arrow” => 1500, “superman” =>\
  \ 0);`\n2. 第二种方法：`$suit_prices[\"batman\"] = 4000;`, `$suit_prices[\"arrow\"] =\
  \ 1500;`, `$suit_prices[\"superman\"] = 0;`\n\n注意：输出关联数组的值时，不要将数组放在双引号内，否则值无法输出。下面的示例演示了如何访问关联数组的值：\n\
  \n```php\n<?php\n$suit_prices = array(“batman” => 4000, “arrow” => 1500, “superman”\
  \ => 0);\necho “The Bat suit costs: ” . $suit_prices['batman'] . “<br />”;\necho\
  \ “The Green Arrow suit costs: ” . $suit_prices['arrow'] . “<br />”;\necho “The\
  \ Superman is free. It suit costs: ” . $suit_prices['superman'] . “<br />”;\n?>\n\
  ```\nOutput:\nThe Bat suit costs: 4000\nThe Green Arrow suit costs: 1500\nThe Superman\
  \ is free. It suit costs: 0\n\n\n\n\n另一种值得的数组类型是多维数组。这些是包含其他数组的数组。但这是一个高级主题，你可以进一步研究。\n\
  \n## 总结\n\n恭喜你！你现在已经熟悉 PHP 的基础知识。到目前，你应该能够看到 PHP 为你提供的强大。在本章中，我们讨论了条件语句，它允许你编写的代码根据指定的条件做出决策。然后，我们查看了循环，它会执行代码块，直到指定的条件返回假或元素耗尽。接下来，我们讨论了如何通过将代码放入函数并在程序中多次调用，以及如何向它们传递信息并让它们返回值。最后，我们研究了数值数组和关联数组。我们通过直接访问它们或遍历它们来创建它们并返回值。\n\
  \n现在，你准备好从 PHP 中休息一下，去泡杯咖啡了。这只会变得更有趣！\n\n\n[“告诉我，我会忘记；教我，我可能会记得；让我参与，我就会学会。” - 班杰明·富兰林](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)\n\
  \n[富兰林](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)\n\n在本章中我们将涵盖：\n\
  \n![](img/image00910.jpeg) 启动 MySQL\n![](img/image00911.jpeg) 创建和删除数据库\n![](img/image00912.jpeg)\
  \ 创建、读取、更新和删除表 (CRUD)\n\n既然我们已经研究了 PHP，让我们看看是什么让 PHP 能够在网页中填充内容。那就是如 `MySQL` 这样的数据库。我们将学习你认为自己\
  \ `MySQL` 基础大师需要知道的大部分内容，并完成你实现梦想的下一步所需的操作。\n\n这将是轻而易举，因为我们将学习如何使用数据库做一些非常酷的事情。\n\
  \n下面我们将将在数据库中创建并使用的表图片。我们只是向音乐数据库中添加专辑。你可以在最上方看到表名，表名下方是字段或列。\n\n### Albums（专辑）\n\
  \n![](img/image00913.jpeg) `AlbumID` `AlbumName` `AlbumArtist` `AlbumType` `NumberOfTracks`\
  \ `DateReleased`\n\n## 启动 MySQL 客户端\n\n我们这一小时要做的的是使用 `XAMPP` 自带的 `MySQL` 客户端命令行输入\
  \ `MySQL` 命令，只需打开 Windows 命令提示符并导航到 `XAMPP` 安装的根文件夹。\n\n当你打开命令提示符时，输入以下命令导航到“C”\
  \ 盘（假设 `XAMPP` 安装在那里），然后按回车：\n\n```bash\ncd \\\n```\n\n现在，导航到客户端执行文件安装的位置以启动它。通过输入以下命令并按回车进入\
  \ `xampp->mysql->bin`：\n\n```bash\ncd xampp\\mysql\\bin\n```\n\n到达那里后，输入以下命令：\n\n\
  ```bash\nmysql -u your_username -p\n```\n\n将 `your_username` 替换为你的实际用户名。默认是 `root`。然后你会被要求输入密码。输入完毕后，按回车。默认情况下密码为空，出于安全考虑，你真的应该更改它。但这超出了此本书的范围。\n\
  \n如果你注意到命令行提示符显示的是一个名为 `MariaDB` 的东西。不要困惑，因为它只是 `MySQL` 关系型数据库管理系统的社区开发分支。大量的 `SQL`\
  \ 命令仍然有效，而且与之前的 `MySQL` 提示符不同，它会让你知道选择了哪个数据库。\n\n现在我们准备好开始了！\n\n**提示**：或者，你可以使用\
  \ `phpmyadmin` 界面只需点击几次即可创建数据库和表。你也可以在那里输入 `SQL` 命令，但由于我们想要尽快进入硬核阶段，我们不会那样做。此外，希望这一小时的内容到目前为止都不难。\n\
  \n## 创建和删除数据库\n\n让我们从输入以下命令来创建一个数据库开始：\n\n```sql\nCREATE DATABASE music;\n```\n\n\
  始终记住这一点：\n\n![](img/image00914.jpeg) 从这里开始，输入的所有语句和命令都应该以分号或 `/` 结尾。否则客户端会认为你仍在输入命令而不会执行。\n\
  \n![](img/image00915.jpeg) 虽然不是强制的，因为命令行不区分大小写，但 `MySQL` 命令使用大写字母输入以区分它们。\n\n删除数据库很简单：\n\
  \n```sql\nDROP database_name;\n```\n\n现在我们已经创建了数据库，我们需要选择它：\n\n```sql\nUSE music;\n\
  ```\n\n**警告**：命令行提示符看起来 own 像 `music>`。\n\n## 创建、修改和删除表\n\n现在我们已经选择了数据库，让我们创建一些表。\n\
  \n### 创建表\n\n```sql\nCREATE TABLE Album (\n    AlbumID smallint unsigned NOT NULL\
  \ AUTOINCREMENT PRIMARY KEY,\n    AlbumName varchar(255) NOT NULL,\n    AlbumArtist\
  \ varchar(80) NOT NULL,\n    AlbumType ENUM('A', 'E', 'M') NOT NULL,\n    NumberOfTracks\
  \ varchar(3) NOT NULL,\n    DateReleased DATE NOT NULL\n);\n```\n\n**提示**：在输入长命令时很容易出错。使用键盘上的上箭头调出之前的命令，并使用左、右箭头导航到出错的地方并进行修复。\n\
  \n要查看你数据库中的表列表，输入：\n\n```sql\nSHOW TABLES;\n```\n\n你看到以下输出：\n\n```\n+----------------+\n\
  | Tables_in_music |\n| album           |\n+----------------+\n```\n\n\n\n\n`ENUM`\
  \ 类型是一个拥有一组值的字符串对象。在我们的案例中允许的值为‘L’（长久播放 Long Play）、‘E’（扩展播放 Extended Play）和‘M’（混音\
  \ mix）。\n\n### 添加 `numTracks`\n如果你觉得这不对，说明你观察得很敏锐！这个字段用于存储曲目数量，它应该是数值类型而不是字符串类型。这样做是有意意的，为了演示以后如何更改字段的数据类型和名称。\n\
  \n### 添加 `DateReleased`\n最后一行创建的代码存储了专辑发布的日期。使用日期类型来存储值。让我们来看你将用到的常用数据类型：\n\n####\
  \ 数值类型\n- `INT`: 整数\n- `FLOAT`: 1E38 到 -1E37\n- `Double`: 1E38 到 -1E37\n\n#### 字符串类型\n\
  - `CHAR`: 固定长度\n- `VARCHAR`: 可变长度\n- `ENUM`: 总值数量有限的字符串，你必须定义它们\n\n#### 日期和时间\n\
  - `DATE`: YYYY-MM-DD\n- `TIME`: HH:MM:SS\n- `DATETIME`: YYYY-MM-DD HH:MM:SS\n- `YEAR`:\
  \ YYYY\n\n### 修改表\n有时候你会犯错，或者想要更改表中的内容。幸运的是，你可以通过 `ALTER` 语句来实现。我们将查看更改表名和数据类型。首先，我们需要通过输入以下命令来查看我们刚刚创建的表：\n\
  \n```\nDESC Album;\n```\n\n你应该看到如下输出：\n```\n+------+------+------+------+----+\n\
  | Field | Type | Null | Key | Extra |\n+------+------+------+------+----+\n| AlbumID\
  \ | smallint(5) unsigned | NO | PRI | auto_increment |\n| AlbumName | varchar(255)\
  \ | NO | | |\n| AlbumArtist | varchar(80) | NO | | |\n| AlbumType | enum('A','E','M')\
  \ | NO | | |\n| numTracks | varchar(3) | NO | | |\n| DateReleased | date | NO |\
  \ | |\n+------+------+------+------+----+\n```\n\n看起来我们确实可以更改其中的一些东西：\n\n#### 1.\
  \ 修改表名\n单数形式“Album”作为表是不合理的，因为表是用来存储多条记录的。我们应该使用复数形式并将其从 `Album` 改为 `Albums`，这样更符合逻辑。以下是更改表的方法：\n\
  \n```\nRENAME TABLE Album to Albums;\n```\n\n如果我们输入 `show tables` 命令，应该能看到表名已经更改：\n\
  ```\n+----------------+\n| Tables_in_music |\n+----------------+\n| albums |\n+----------------+\n\
  ```\n\n#### 2. 修改 `numTracks` 的数据类型\n`numTracks` 字段不应该是字符串类型而应该是数值。以下代码将其数据类型更改为合适的类型：\n\
  \n```\nALTER TABLE Albums\nMODIFY COLUMN numTracks smallint(2) NOT NULL;\n```\n\n\
  #### 3. 修改 `numTracks` 的列名\n看来我们还没有处理完 `numTracks` 字段。我们需要将其从 `numTracks` 改为 `NumberOfTracks`，以使其更具可读性。\n\
  \n```sql\nALTER TABLE Albums\nCHANGE numTracks NumberOfTracks smallint(2) NOT NULL;\n\
  ```\n注意：更改列名时我们仍然需要定义数据类型。通过以下更改，当我们输入描述表的语句时，应该会看到：\n\n```\n+------+------+------+------+----+\n\
  | Field | Type | Null | Key | Extra |\n+------+------+------+------+----+\n| AlbumID\
  \ | smallint(5) unsigned | NO | PRI | auto_increment |\n| AlbumName | varchar(255)\
  \ | NO | | |\n| AlbumArtist | varchar(80) | NO | | |\n| AlbumType | enum('A','E','M')\
  \ | NO | | |\n| NumberOfTracks | smallint(2) | NO | | |\n| DateReleased | date |\
  \ NO | | |\n+------+------+------+------+----+\n```\n这看起来好多多了！\n\n### 删除表\n下面的代码可以删除数据库中的表及其所有数据：\n\
  \n```\nDROP TABLE table_name;\n```\n其中 `table_name` 是你想要删除的表名。\n\n字体 向表中插入记录\n我们使用\
  \ `INSERT INTO` 语句向表中插入新记录：\n\n```\nINSERT INTO Albums VALUES\n(NULL, 'Rush Blood\
  \ to the Head', 'Coldplays', 'A', 12, '2002-08-02'),\n(NULL, 'Dirty Gold', 'Angel\
  \ Haze', 'A', 16, '2013-12-30'),\n(NULL, 'Back to the Woods', 'Angel Haze', 'M',\
  \ 13, '2015-09-15'),\n(NULL, 'Parachutes', 'Coldplay', 'A', 10, '1999-07-10'),\n\
  (NULL, '1989 (Delux Edition)', 'Taylor Swift', 'A', 15, '2014-10-27'),\n(NULL, 'Prokts\
  \ March', 'Coldplay', 'E', 8, '2008-09-21'),\n(NULL, 'Random Access Memories', 'Daft\
  \ Punk', 'A', 14, '2013-05-13'),\n(NULL, 'Random Access Memories', 'Coldplay', 'A',\
  \ 13, '2005-06-01');\n```\n\n### SELECT 语句\n`SELECT` 允许从表中检索数据。以下示例展示了如何使用 `SELECT`\
  \ 表，输出应该是这样的：\n\n```\n+----------+-------------+---------------+\n| AlbumID | AlbumName\
  \ | AlbumArtist | AlbumType | DateReleased |\n+----------+-------------+---------------+---------------+---------------+\n\
  | 1 | Rush Blood to the Head | Coldplays | A | 2002-08-02 |\n| 2 | Dirty Gold |\
  \ Angel Haze | A | 2013-12-30 |\n| 3 | Back to the Woods | Angel Haze | M | 2015-09-15\
  \ |\n| 4 | Parachutes | Coldplay | A | 1999-07-10 |\n| 5 | 1989 (Delux Edition)\
  \ | Taylor Swift | A | 2014-10-27 |\n| 6 | Prots March | Coldplay | E | 2008-09-21\
  \ |\n| 7 | Random Access Memories | Daft Punk | A | 2013-05-13 |\n| 8 | X & Y |\
  \ Coldplay | A | 2005-06-01 |\n+----------+-------------+---------------+---------------+---------------+\n\
  ```\n选择特定的列，我们使用：\n\n```sql\nSELECT AlbumName, AlbumArtist, DateReleased, NumberTracks\n\
  FROM Albums;\n```\n\n输出应该是：\n```\n+-----------+-------------+---------------+---------------+\n\
  | AlbumName | AlbumArtist | DateReleased | NumberTracks |\n+-----------+-------------+---------------+---------------+\n\
  | Rush Blood to the Head | Coldplays | 2002-08-02 | 12 |\n| Dirty Gold | Angel Haze\
  \ | 2013-12-30 | 16 |\n| Back to the Woods | Angel Haze | 2015-09-15 | 13 |\n| Parachutes\
  \ | Coldplay | 1999-07-10 | 10 |\n| 1989 (Delux Edition) | Taylor Swift | 2014-10-27\
  \ | 15 |\n| Prots March | Coldplay | 2008-09-21 | 8 |\n| Random Access Memories\
  \ | Daft Punk | 2013-05-13 | 14 |\n| X & Y | Coldplay | 2005-06-01 | 13 |\n+-----------+-------------+---------------+---------------+\n\
  ```\n\n#### WHERE 子句\n有时你需要过滤记录，只选择符合特定标准的记录。这就是 `WHERE` 子句发挥作用的地方，如下例所示：\n\n```sql\n\
  SELECT AlbumName, AlbumArtist, DateReleased, NumberTracks\nFROM Albums\nWHERE AlbumArtist\
  \ = 'Coldplay';\n```\n\n这应该输出：\n```\n+-----------+-------------+---------------+---------------+\n\
  | AlbumName | AlbumArtist | DateReleased | NumberTracks |\n+-----------+-------------+---------------+---------------+\n\
  | Parachutes | Coldplay | 1999-07-10 | 10 |\n| Prots March | Coldplay | 2008-09-21\
  \ | 8 |\n| X & Y | Coldplay | 2005-06-01 | 13 |\n+-----------+-------------+---------------+---------------+\n\
  ```\n\n\n\n\n\n| AlbumName | AlbumArtist | DateReleased | NumberOfTracks |\n| :---\
  \ | :--- | :--- | :--- |\n| Parachutes | Coldplay | 1999-07-10 | 10 |\n| Prospekts\
  \ March | Coldplay | 2008-09-21 | 8 |\n| X & Y | Coldplay | 2005-06-01 | 13 |\n\n\
  注意：此示例是在文本字段上完成的，因此对我们想要检查的值使用了单引号。你也可以也可以对数值字段进行检查。只需删除单引号并确保你输入的是与该字段数值数据类型相对应的数值即可。\n\
  \n你可以使用 `AND` 和 `OR` 运算符进一步过滤记录以进一步缩小结果范围：\n\n`AND` 运算符显示同时符合标准中两个条件的记录：\n\n```sql\n\
  SELECT AlbumName, AlbumArtist,AlbumType\nFROM Albums\nWHERE AlbumArtist = 'Coldplay'\
  \ AND AlbumType = 'A';\n```\n\n输出应该显示 `AlbumName` 为 `Coldplay` 且 `AlbumType` 为 ‘L’\
  \ 的结果。如果任何记录不符合该标准，它将被排除：\n\n| AlbumName | AlbumArtist | AlbumType |\n| :--- | :---\
  \ | :--- |\n| Parachutes | Coldplay | A |\n| X & Y | Coldplay | A |\n\n`OR` 运算符用于返回符合指定标准中任一标准的记录。\n\
  \n```sql\nSELECT AlbumName, AlbumArtist, Album Type\nFROM Albums\nWHERE AlbumType\
  \ = 'E' OR AlbumType = 'M';\n```\n\n在上面的示例中，任何 `AlbumType` 为 ‘E’ 或 `AlbumType` 为\
  \ ‘M’ 的记录都将被显示。其余的将被排除。输出如下：\n\n| AlbumName | AlbumArtist | AlbumType |\n| :---\
  \ | :--- | :--- |\n| Back to the Woods | Angel Haze | M |\n| Prospekts March | Coldplay\
  \ | E |\n\n### ORDER BY 关键字\n\n为了按一个或多个列对结果集（`SELECT` 语句返回表）进行排序，我们使用 `ORDER BY`\
  \ 关键字并指定应该是降序还是升序：\n\n```sql\nSELECT AlbumName, AlbumArtist\nFROM Albums\nORDER\
  \ BY AlbumArtist ASC;\n```\n\n注意：默认情况下，它们按升序排序。这意味着如果我们省略 `ASC` 关键字，也不会产生任何影响。我们可以根据专辑名称通过将上述示例中的\
  \ `ASC` 替换为 `DESC` 来按降序排序：\n\n| AlbumName | AlbumArtist |\n| :--- | :--- |\n| Dirty\
  \ Gold | Angel Haze |\n| Back to the Woods | Angel Haze |\n| Parachutes | Coldplay\
  \ |\n| Prospekts March | Coldplay |\n| X & Y | Coldplay |\n| Rush of Blood to the\
  \ Head | Coldplays |\n| Random Access Memories | Daft Punk |\n| 1989 (Delux Edition)\
  \ | Taylor Swift |\n\n### UPDATE 语句\n\n回看我们目前为止显示的记录，似乎我们犯了一个错误，在其中一条记录中将其命名为 `Coldplays`。可以通过\
  \ `UPDATE` 语句更新该记录来纠正这一点。如果我们现在用以下代码输出记录：\n\n```sql\nSELECT AlbumID, AlbumName,\
  \ AlbumArtist\nFROM Albums;\n```\n\n输出应该是：\n\n| AlbumID | AlbumName | AlbumArtist\
  \ |\n| :--- | :--- | :--- |\n| 1 | Rush of Blood to the Head | Coldplays |\n| 2\
  \ | Dirty Gold | Angel Haze |\n| 3 | Back to the Woods | Angel Haze |\n| 4 | Parachutes\
  \ | Coldplay |\n| 5 | 1989 (Delux Edition) | Taylor Swift |\n| 6 | Prospekts March\
  \ | Coldplay |\n| 7 | Random Access Memories | Daft Punk |\n| 8 | X & Y | Coldplay\
  \ |\n\n我们像这样更新该记录：\n\n```sql\nUPDATE Albums\nSET AlbumArtist = 'Coldplay' WHERE\
  \ AlbumID = 1;\n```\n\n警告：不要省略 `WHERE` 子句，否则表中的所有记录都将被更新。如果我们现在输出它，我们应该看到记录已更新：\n\
  \n| AlbumID | AlbumName | AlbumArtist |\n| :--- | :--- | :--- |\n| 1 | Rush of Blood\
  \ to the Head | Coldplay |\n| 2 | Dirty Gold | Angel Haze |\n| 3 | Back to the Woods\
  \ | Angel Haze |\n| 4 | Parachutes | Coldplay |\n| 5 | 1989 (Delux Edition) | Taylor\
  \ Swift |\n| 6 | Prospekts March | Coldplay |\n| 7 | Random Access Memories | Daft\
  \ Punk |\n| 8 | X & Y | Coldplay |\n\n### 删除表中的记录\n\n要删除表中的记录，我们使用 `DELETE` 语句。下面的示例删除了表中\
  \ `AlbumID` 为 1 的行：\n\n```sql\nDELETE FROM Albums\nWHERE AlbumID = 1;\n```\n\n警告：不要省略\
  \ `WHERE` 子句，否则表中的所有记录都将被删除。如果我们现在输出它，我们应该看到记录已删除：\n\n| AlbumID | AlbumName | AlbumArtist\
  \ |\n| :--- | :--- | :--- |\n| 2 | Dirty Gold | Angel Haze |\n| 3 | Back to the\
  \ Woods | Angel Haze |\n| 4 | Parachutes | Coldplay |\n| 5 | 1989 (Delux Edition)\
  \ | Taylor Swift |\n| 6 | Prospekts March | Coldplay |\n| 7 | Random Access Memories\
  \ | Daft Punk |\n| 8 | X & Y | Coldplay |\n\n*(注：此处原文表格中 ID 1 行已删除，译文保持此逻辑)*\n\n\
  ## 总结\n\n 好的，现在你已经熟悉了 MySQL 的基础，可以使用命令行访问它并创建和删除数据库；创建、修改和删除表；查询、插入、更新和删除数据；并对数据进行过滤和排序。\n\
  \n## 第 4 章 - 第 4 节：PHP 与 MySQL：黄金搭档\n\n“一种不影响你思考方式的语言是不值得知道的” —— Alan J. \n\n在本章中，我们将涵盖：\n\
  - `Images/00923.jpeg` 创建家庭数据库\n- `Images/00924.jpeg` 创建并向家庭成员表插入值\n- `Images/00925.jpeg`\
  \ 创建网站 PHP 配置\n- `Images/00926.jpeg`, `Images/00927.jpeg`, `Images/00928.jpeg` 创建索引页、创建输入数据的表单、创建成员添加页面\n\
  \n想象一下你最喜欢的艺人共同表演。这就是我们现在的感受，因为我们正准备看到 PHP 和 MySQL 如何共同工作来创建一个网站。\n\n网站非常简单；假设你想在线上记录你的家庭成员。我们将创建一个简单的网站，让你把他们（如果你喜欢他们的话）添加到数据库中，这样你就不需要总是记住他们。为了保持简单，我们放弃了许多安全功能，但这个简单的示例已经足够让你入门了。\n\
  \n### 创建家庭数据库\n\n打开命令行并启动 MySQL 客户端，以 ‘root’ 身份登录（见第 3 章）。\n\n\n\n\n\n### 创建数据库\n\
  \n通过输入代码创建数据库：\n\n```sql\nCREATE DATABASE Family;\n```\n\n然后选择该数据库以便使用：\n\n```sql\n\
  USE Family;\n```\n\n### 创建并向 Family Members 表插入值\n\n现在我们创建一个存储信息的表。它看起来应该是这样的：\n\
  \n| Family Members |\n| --- |\n| 成员 ID |\n| 名 |\n| 姓 |\n| 年龄 |\n| 性别 |\n| 关系 |\n\
  \n创建表的代码如下：\n\n```sql\nCREATE TABLE FamilyMembers\n(\nMemberID int unsigned NOT\
  \ NULL auto_increment PRIMARY KEY, FirstName varchar(80) NOT NULL,\nLastName varchar(80)\
  \ NOT NULL, Age int(3) unsigned NOT NULL,\nGender ENUM (‘Male’, ‘Female’) NOT NULL,\
  \ Relationship varchar(80) NOT NULL\n);\n```\n\n当我们描述该表时，会得到类似这样的结果：\n\n| Field\
  \ | Type | Null | Key | Default | Extra |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| MemberID | int(10) unsigned | NO | PRI | NULL | auto_increment |\n|\
  \ FirstName | varchar(80) | NO | | NULL | |\n| LastName | varchar(80) | NO | | NULL\
  \ | |\n| Age | int(3) unsigned | NO | | NULL | |\n| Gender | enum(‘Male’,‘Female’)\
  \ | NO | | NULL | |\n| Relationship | varchar(80) | NO | | NULL | |\n\n然后我们向表中插入值：\n\
  \n```sql\nINSERT INTO FamilyMembers VALUES\n(NULL, ‘Robert’, ‘Williams’, 52, ‘Male’,\
  \ ‘Father’), (NULL, ‘Martha’, ‘Williams’, 49, ‘Female’, ‘Mother’), (NULL, ‘Doreen’,\
  \ ‘Williams’, 18, ‘Female’, ‘Sister’), (NULL, ‘Jace’, ‘Williams’, 13, ‘Female’,\
  \ ‘Adoptive Sister’), (NULL, ‘Benson’, ‘Williams’, 22, ‘Male’, ‘Brother’), (NULL,\
  \ ‘Timothy’, ‘James’, 23, ‘Male’, ‘Cousin’);\n```\n\n当我们查询表中的所有记录时，我们会看到类似这样的内容：\n\
  \n| MemberID | FirstName | LastName | Age | Gender | Relationship |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 1 | Robert | Williams | 52 | Male | Father |\n\
  | 2 | Martha | Williams | 49 | Female | Mother |\n| 3 | Doreen | Williams | 18 |\
  \ Female | Sister |\n| 4 | Jace | Williams | 13 | Female | Adoptive Sister |\n|\
  \ 5 | Benson | Williams | 22 | Male | Brother |\n| 6 | Timothy | James | 23 | Male\
  \ | Cousin |\n\n现在我们已经完成了命令行（但 MySQL）的操作，可以将其关闭了。\n\n### 为网站创建 PHP 文件\n\n我们必须先创建一个文件夹并命名为\
  \ `Family`，将其放置在 `htdocs` 文件夹中。该文件夹位于 XAMPP 安装的根目录下。然后我们创建一个名为 `config.php` 的文件并将其放置在网站的根目录下。\n\
  \n警告：出于安全考虑，此文件需要放置在服务器外部，虽然通过浏览器读取 PHP 很容易，但如果服务器配置不当，这种情况可能会发生。为了保持简单，我们将将其放在这里。\n\
  \n接下来，我们定义建立连接字符串所需的常量，我们将使用它来连接数据库：\n\n```php\n<?php\ndefine('DB_NAME', 'Family');\n\
  define('DB_USER', 'root');\ndefine('DB_PASSWORD', '');\ndefine('DB_HOST', 'localhost');\n\
  ?>\n```\n\n警告：出于安全考虑，使用明文密码是一个主要风险。你可以使用 `hash()` 并哈希值存储在 `config.php` 中。然后你可以在登录时检查输入的密码是否匹配哈希值。\n\
  \n然后通过将主机、用户名和数据库名称传递给建立连接的方法来建立连接字符串：\n\n```php\n<?php\ndefine('DB_NAME', 'Family');\n\
  define('DB_USER', 'root');\ndefine('DB_PASSWORD', '');\ndefine('DB_HOST', 'localhost');\n\
  $conn = @mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD, DB_NAME);\n?>\n```\n\n现在我们需要检查连接是否成功。如果未成功，我们将显示适当的消息并停止执行：\n\
  \n```php\n<?php\ndefine('DB_NAME', 'Family');\ndefine('DB_USER', 'root');\ndefine('DB_PASSWORD',\
  \ '');\ndefine('DB_HOST', 'localhost');\n$conn = @mysqli_connect(DB_HOST, DB_USER,\
  \ DB_PASSWORD, DB_NAME);\nif (!$conn) {\n    die(mysqli_connect_error());\n}\n?>\n\
  ```\n\n建立连接字符串就此完成。每个需要连接数据库并处理数据的 PHP 脚本都需要此脚本。\n\n### 创建索引页\n\n现在我们需要创建一个落地页，它将以表格的形式列出我们家庭数据库中的家庭成员。我们将添加一些\
  \ CSS（通过链接外部样式表）来创建一个漂亮的表格来显示我们的数据。我们创建一个名为 `index.php` 的文件并将其放置在网站的根目录下。文件代码应该如下：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"css/main.css\">\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/table_styling.css\"\
  >\n</head>\n<body>\n<div id=\"container\">\n<div id=\"header\">\n<h2>My Family</h2>\n\
  </div>\n<div id=\"btn_add\">\n<a href=\"form.php\">ADD</a>\n</div>\n<div id=\"content\"\
  >\n<?php\nrequire_once('config.php');\n$sql = \"SELECT MemberID, FirstName, LastName,\
  \ Age, Gender, Relationship FROM FamilyMembers\";\n$response = @mysqli_query($conn,\
  \ $sql);\nif ($response){\n    echo '<table>';\n    echo '<tr>\n    <th>Member ID</th>\n\
  \    <th>First Name</th>\n    <th>Last Name</th>\n    <th>Age</th>\n    <th>Gender</th>\n\
  \    <th>Relationship</th>\n</tr>';\n    while ($row = mysqli_fetch_array($response)){\n\
  \        echo '<tr>';\n        echo '<td>' . $row['MemberID'] . '</td>';\n     \
  \   echo '<td>' . $row['FirstName'] . '</td>';\n        echo '<td>' . $row['LastName']\
  \ . '</td>';\n        echo '<td>' . $row['Age'] . '</td>';\n        echo '<td>'\
  \ . $row['Gender'] . '</td>';\n        echo '<td>' . $row['Relationship'] . '</td>';\n\
  \        echo '</tr>';\n    }\n    echo '</table>';\n} else {\n    echo \"Cound\
  \ not get a response from database \" . mysqli_error($conn);\n}\nmysqli_close($conn);\n\
  ?>\n</div>\n</div>\n</body>\n</html>\n```\n\n\n\n\n这里涉及的内容很多，但我们不会一一详介绍。我们不会讨论任何\
  \ HTML 和 CSS，因为本书假设你已经具备这些方面的基础知识，并知道如何链接外部样式表。\n\n首先，在 PHP 代码中，我们通过调用 `require_once`\
  \ 函数来包含 `config.php` 文件，并将文件路径作为参数传递（由于是配置文件，我们传递的是相对路径）。这将允许我们访问在该文件中定义的数据库连接：\n\
  \n```php\nrequire_once('config.php');\n```\n\n接下来，我们创建一个查询字符串，用于使用 SQL 从数据库中检索数据，并将其赋值给变量\
  \ `$sql`：\n\n```php\n$sql = “SELECT MemberID, FirstName, LastName, Age, Gender,\
  \ Relationship FROM FamilyMembers”;\n```\n\n我们使用 `SELECT` 语句从 `FamilyMembers` 表中选择我们想要显示的字段，其语法规则与我们在命令行中使用的规则相同。\n\
  \n然后，我们使用 `mysqli_query` 函数将查询发送到数据库，并传入连接变量（由于我们已经包含了 `config.php`，现在该变量是可访问的），随后将查询的返回值赋值给变量\
  \ `$response`：\n\n```php\n$response = @mysqli_query($conn, $sql);\n```\n\n之后，我们使用\
  \ `if` 语句检查是否收到了来自数据库的响应：\n\n```php\nif ($response){\n\n}\n```\n\n如果收到了数据库的响应，我们将在\
  \ PHP 代码中嵌入 HTML 并在 `if` 语句内部输出它，创建一个带有表行和表头的表格：\n\n```php\necho ‘<table>\n<tr>\n\
  \    <th>Member ID</th>\n    <th>First Name</th>\n    <th>Last Name</th>\n    <th>Age</th>\n\
  \    <th>Gender</th>\n    <th>Relationship</th>\n</tr>’;\n```\n\n好了，列的部分完成了。现在我们需要动态地逐显示行，以防有很多数据。以下代码可以实现这一点：\n\
  \n```php\nwhile ($row = mysqli_fetch_array($response)){\necho ‘<tr>\n    <td>’ .\
  \ $row['MemberID'] . ‘</td>\n    <td>’ . $row['FirstName'] . ‘</td>\n    <td>’ .\
  \ $row['LastName'] . ‘</td>\n    <td>’ . $row['Age'] . ‘</td>\n    <td>’ . $row['Gender']\
  \ . ‘</td>\n    <td>’ . $row['Relationship'] . ‘</td>\n</tr>’;\n}\n```\n\n在上述代码中，我们使用循环通过\
  \ `mysqli_fetch_array()` 函数遍历从响应中获取的数组，并将 `$response` 变量作为参数。我们将从函数获取的值（也是一个包含该行字段的数组）赋值给变量\
  \ `$row`，并在周围嵌入 HTML，以根据数组中元素的数量动态创建相应数量的表格行。\n\n然后，我们关闭表格，动态显示数据的工作就此完成：\n\n```php\n\
  echo ‘</table>’;\n```\n\n但如果由于某些错误导致数据库没有响应呢？这种情况是有可能的。在这种情况下，我们在 `if` 语句之后添加一个\
  \ `else` 语句，使用 `mysqli_error` 函数显示错误信息，并将我们的连接作为参数：\n\n```php\nelse{\necho “Cound\
  \ not get a response from database ” . mysqli_error($conn);\n}\n```\n\n最后，我们使用 `mysqli_close`\
  \ 函数关闭数据库连接，传入连接作为参数，索引页的工作就完成了：\n\n```php\nmysqli_close($conn);\n```\n\n进入浏览器并输入如下路径以访问\
  \ `index.php`，然后按回车：\n\n`https://localhost/Family/index.php`\n\n下面的窗口应该显示：\n\n![](img/image029.jpeg)\n\
  \n你可以看到它显示了我们输入的记录并生成的表格。真棒！\n\n### index 页的 CSS\n\n在网站根目录下创建一个 `css` 文件夹，并创建两个文件\
  \ `main.css` 和 `table_styling.css`。这些是页面的样式表。\n\n我们在 `main.css` 中输入以下代码来设置主体、表头和链接。它还将内容居中：\n\
  \n```css\nbody {\nbackground-color: #EEE;\n}\n#container {\n    width: 900px;\n\
  \    margin-left: auto;\n    margin-right: auto;\n}\n#header {\n    color: #2ca089;\n\
  \    text-align: center;\n    font-size: 2em;\n}\n/* links */\na:link, a:visited\
  \ {\n    background-color: #2ca089;\n    color: white;\n    padding: 5px 12px;\n\
  \    text-align: center;\n    text-decoration: none;\n    display: inline-block;\n\
  }\na:hover, a:active {\n    background-color: #AFDC1;\n}\n#btn_add {\n    padding:\
  \ 5px 0;\n    text-align: right;\n}\n```\n\n然后我们在 `table_styling.css` 中输入以下代码来设置表格：\n\
  \n```css\ntable {\nborder-collapse: collapse;\nwidth: 100%;\n}\nth, td {\ntext-align:\
  \ left;\npadding: 8px;\n}\ntr:nth-child(even){\n    background-color: white;\n}\n\
  th {\nbackground-color: #2ca089;\ncolor: white;\n}\n```\n\n### 创建数据的表单\n\n我们在网站根目录创建一个名为\
  \ `form.php` 的文件，然后放置以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"css/main.css\">\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"css/form_styling.css\">\n</head>\n<body>\n<div id=\"\
  container\">\n<div id=\"content\">\n<form action=\"member_added.php\" method=\"\
  post\">\n<div id=\"header\">\n<h3>Add Family Member</h3>\n</div>\n<div id=\"btn_add\"\
  >\n<a href=\"index.php\">View Members</a>\n</div>\n<label for=\"fname\">First Name</label>\n\
  <input type=\"text\" id=\"first_name\" name=\"first_name\" maxlength=\"80\">\n<label\
  \ for=\"lname\">Last Name</label>\n<input type=\"text\" id=\"last_name\" name=\"\
  last_name\" maxlength=\"80\">\n<label for=\"age\">Age</label>\n<input type=\"number\"\
  \ id=\"age\" name=\"age\" min=\"1\" max=\"100\">\n<label for=\"gender\">Gender</label>\n\
  <select id=\"gender\" name=\"gender\">\n<option value=\"Male\">Male</option>\n<option\
  \ value=\"Female\">Female</option>\n</select>\n<label for=\"relationship\">Relationship</label>\n\
  <input type=\"text\" id=\"relationship\" name=\"relationship\" maxlength=\"80\"\
  >\n<input type=\"submit\" name=\"submit\" value=\"ADD\">\n</form>\n</div>\n</div>\n\
  </body>\n</html>\n```\n\n这里没有发生任何异常。这只是你的基础 HTML 表单，我们将用它将输入字段中的数据发送到数据库。表单有两个我们感兴趣的属性：\n\
  \n- `action`：告诉表单将数据发送到 `member_added.php` 脚本（稍后我们将创建），它将在点击 ADD 按钮时处理信息。\n- `method=\"\
  post\"`：告诉表单通过 HTTP POST 发送数据。这意味着数据被附加在 HTTP 请求的体内部。这对于发送敏感数据（如密码）很有用，而 `get` 方法只是将数据附加到\
  \ URL，任何人都能看到。\n\n进入浏览器显示 index 页。点击表格右上角的 ADD 按钮，应该显示如下带有添加家庭成员表单页面：\n\n![](img/image030.jpeg)\n\
  \n### 表单页的 CSS\n\n创建一个名为 `form_styling.css` 的 CSS 文件并将其放在网站的根目录下。在该文件中放置以下规则以使用此外部样式表设置表单：\n\
  \n```css\ninput[type=text], input[type=number], select {\nwidth: 100%;\npadding:\
  \ 12px 20px;\nmargin: 8px 0;\ndisplay: inline-block;\nborder: 1px solid #ccc;\n\
  border-radius: 4px;\nbox-sizing: border-box;\n}\ninput[type=submit] {\nwidth: 100%;\n\
  background-color: #2ca089;\ncolor: white;\npadding: 14px 20px;\nmargin: 8px 0;\n\
  border: none;\nborder-radius: 4px;\ncursor: pointer;\n}\ninput[type=submit]:hover\
  \ {\nbackground-color: #2ca089;\n}\n```\n\n### 创建添加成员页面\n\n最后，你需要创建一个最终的 PHP 脚本来处理表单发送的数据。我们创建一个名为\
  \ `member_added` 的新 PHP 脚本，并将其放在网站的根目录下。然后在我们在脚本中放置以下代码：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/main.css\"\
  >\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/form_styling.css\">\n</head>\n\
  <body>\n<div id=\"container\">\n```\n\n\n\n\n<div id=\"content\">\n\n```php\n<?php\n\
  \nrequire_once('config.php');\n\nif(isset($_POST['submit'])) {\n    $null_fields\
  \ = array();\n    if (empty($_POST['first_name'])) {\n        $null_fields[] = 'First\
  \ Name';\n    } else {\n        $first_name = trim($_POST['first_name']);\n    }\n\
  \n    if (empty($_POST['last_name'])) {\n        $null_fields[] = 'Last Name';\n\
  \    } else {\n        $last_name = trim($_POST['last_name']);\n    }\n\n    if\
  \ (empty($_POST['age'])) {\n        $null_fields[] = 'Age';\n    } else {\n    \
  \    $age = $_POST['age'];\n    }\n\n    if (empty($_POST['gender'])) {\n      \
  \  $null_fields[] = 'Gender';\n    } else {\n        $gender = $_POST['gender'];\n\
  \    }\n\n    if (empty($_POST['relationship'])) {\n        $null_fields[] = 'Reliationship';\n\
  \    } else {\n        $relationship = $_POST['relationship'];\n    }\n\n    if\
  \ (empty($null_fields)) {\n        $null_variable = NULL;\n        $sql = \"INSERT\
  \ INTO FamilyMembers VALUES ('$null_variable', '$first_name', '$last_name', '$age',\
  \ '$gender', '$relationship')\";\n        if (!mysqli_query($conn, $sql)) {\n  \
  \          die ('Error: ' . mysqli_error($conn));\n        }\n        echo \"Family\
  \ member has been entered!\";\n        mysqli_close($conn);\n    } else {\n    \
  \    echo \"You need to enter the follwing missing data: <br />\";\n        foreach\
  \ ($null_fields as $null_field) {\n            echo $null_field . \"<br />\";\n\
  \        }\n    }\n}\n?>\n\n<<div>\n<form action=\"member_added.php\" method=\"\
  post\">\n    <div id=\"header\">\n        <h3>Add Family Member</h3>\n    </div>\n\
  \    <div id=\"btn_add\">\n        <a href=\"index.php\">View Members</a>\n    </div>\n\
  \    <label for=\"fname\">First Name</label>\n    <input type=\"text\" id=\"first_name\"\
  \ name=\"first_name\" maxlength=\"80\">\n    <label for=\"lname\">Last Name</label>\n\
  \    <input type=\"text\" id=\"last_name\" name=\"last_name\" maxlength=\"80\">\n\
  \    <label for=\"age\">Age</label>\n    <input type=\"number\" id=\"age\" name=\"\
  age\" min=\"1\" max=\"100\">\n    <label for=\"gender\">Gender</label>\n    <select\
  \ id=\"gender\" name=\"gender\">\n        <option value=\"Male\">Male</option>\n\
  \        <option value=\"Female\">Female</option>\n    </select>\n    <label for=\"\
  relationship\">Relationship</label>\n    <input type=\"text\" id=\"relationship\"\
  \ name=\"relationship\" maxlength=\"80\">\n    <input type=\"submit\" name=\"submit\"\
  \ value=\"ADD\">\n</form>\n</div>\n</div>\n</body>\n</html>\n\n# 让我们来拆解一下并看看最有趣的部分。\n\
  \n在处理信息之前，我们必须检查该信息是否由表单提交。我们通过一个 `if` 语句并使用 PHP 内置函数 `isset()` 来实现，该函数用于检查变量是否为空。我们将关联数组\
  \ `$_POST` 作为参数传递。它包含了在 `form.php` 表单中输入的所有值。该数组通过表单的 `post` 方法传递给脚本：\n\n```php\n\
  if(isset($_POST['submit'])) {\n}\n```\n\n在条件语句内部，我们声明了一个数组来检查我们是否遗漏了任何表单输入：\n\n\
  ```php\n$null_fields = array();\n```\n\n接下来，在将值发送到数据库之前，我们开始检查数组中的任何值是否为空。如果是，我们就将其添加到\
  \ `$null_fields` 数组中；否则我们创建一个变量并将它们存储在其中。我们只需要看一个 `if…else` 语句，因为其他的都是相似的：\n\n```php\n\
  if (empty($_POST['first_name'])) {\n    $null_fields[] = 'First Name';\n} else {\n\
  \    $first_name = trim($_POST['first_name']);\n}\n```\n\n我们对 `$_POST` 数组中的其余值执行同样的操作。\n\
  \n**警告**：这可能不是最安全的。\n\n在处理信息之前，我们必须检查该信息是否由表单提交。我们通过一个 `if` 语句并使用 PHP 内置函数 `isset()`\
  \ 来实现，该函数用于检查变量是否为空。我们将关联数组 `$_POST` 作为参数传递。它包含了在 `form.php` 表单中输入的所有值。\n\n所以，如果数组为空，我们就关闭数据库连接：\n\
  \n```php\nmysqli_close($conn);\n```\n\n紧接着在 PHP 结束标签之后，我们再次显示表单，允许 PHP 脚本调用自身，以便我们可以在忘记某些字段时继续输入或重新输入数据。\n\
