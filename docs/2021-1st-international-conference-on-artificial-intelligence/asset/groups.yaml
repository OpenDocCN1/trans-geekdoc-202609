    **Abstract**—Congestive heart failure (CHF) is one of the diseases with high burden
    on the healthcare systems. Patients visits and follow-up at the patient-clinic
    are associated with direct and indirect costs and affect treatment outcomes. This
    study aims to use machine learning models to predict the risk level and class
    of CHF patients to confidently extend the time for the next-outpatient visit.
    The data were statistically analyzed using Waikato Enrichment Knowledge Analysis
    Version 3.4 using each different learning model. Among the best models tested,
    the Random Forest and Logistic Regression showed the best performance. Overall
    performance of the models with these excellent measures (Precision, Recall, F-measure,
    and ROC) for the dataset achieved an accuracy around 0.89. Future work with more
    balanced datasets and records are needed to test such models which could help
    the healthcare systems avoid direct and indirect costs and improve patients''
    outcomes.


    **Keywords:** Congestive heart failure (CHF); Random Forest; Machine Learning;
    Predictive Model


    # I. INTRODUCTION


    Cardiovascular diseases (CVD) are a leading cause of death. In 2017, 17.8 million
    people died due to CVD. This is expected to jump to more than 22.2 million deaths
    annually by 2030. The direct and indirect costs associated with CVD and stroke
    between 2014 and 2015 were reported to be $35.1 billion in the United States.
    Heart failure (CHF) is one of the most common CVD and can be described as a clinical
    syndrome characterized by the reduced ability of the heart to pump and fill blood.
    Physiologically, it is an inadequate cardiac output to meet the metabolic demands
    of the body. Its prevalence is 1-2% and up to 10% in the elderly population. A
    recent study showed that the 60-day mortality for discharged HF patients was around
    8.6% and the combined mortality/hospitalization rate to 36.2% [5]. Locally, a
    Saudi multicenter study showed that the 12 months all-cause mortality to around
    9% and rehospitalization rate 39 [%].


    rehospitalization rate 39 [%]. Reports show that the 30-day admission rates for
    HF need need improvement [7]. Early follow-up after hospitalization is associated
    with lower 30-day admission rates for HF patients [8]. Thus, guidelines recommend
    a close follow-up (7-14 days) after discharge [9]. Recent advances in machine
    learning and deep learning led to their utilization in various medical conditions;
    therefore different machine learning techniques have been used to improve HF outcomes.
    In this study, we are aiming to use machine learning to classify CHF patients.
    This classification will help in predicting we will be able to extend the time
    to the next visit for CHF patients post-hospital discharge. The main research
    question-How can we extend the time of the next visit for CHF patients?


    # II. LITERATURE REVIEW


    We have available machine learning techniques currently studied by different researchers
    to diagnose or identify heart failure. Moloud et al. (2015) confirmed that the
