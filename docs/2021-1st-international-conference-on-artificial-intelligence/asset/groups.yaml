    # V. DISCUSSION


    In our study, we tried to test and use machine learning to extensively predict
    the risk level and class of CHF patients in clinical data. We observed that the
    RandomForest and Logistic regression models were the best with confidence to predict
    the best timing for the next visit with high accuracy of around 89%. We future
    work with more datasets and more patient records are needed to test such models
