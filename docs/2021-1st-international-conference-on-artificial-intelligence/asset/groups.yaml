    Machine learning models have been used as a tool to assist in heart failure decision
    making. We used the model to predict in different classes and levels of risk to
    help clinicians decide the next best visit. The machine learning models: ZeroR,
    NaiveBayes, IBK, Logistic Regression, Decision Tree, AdaBoost, and RandomForest;
    were tested by Weka. Overall performance of the models with these excellent measures,
    like Random Forest and Logistic regression, could be enhanced by data balancing
    techniques.


    ## V. DISCUSSION


    In our study, we tried to test and use machine learning to extensively predict
    the risk level and class of CHF patients in clinical data. We observed that the
    RandomForest and Logistic regression models were the best with confidence to predict
    the best timing for the next visit with high accuracy of around 89%. We future
    work with more datasets and more patient records are needed to test such models
    which could save the healthcare system a significant lot of direct and indirect
    costs and improve patients'' outcomes.


