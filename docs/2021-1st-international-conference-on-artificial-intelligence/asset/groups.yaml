    ## 五、 讨论


    在我们的研究中，我们尝试测试并使用机器学习对临床数据中的充心性心衰竭（CHF）患者的风险水平和类别进行广泛预测。我们观察到随机森林和逻辑回归模型在预测下次就诊时间方面最具可靠性，准确率约为
    89%。未来需要更多的数据集和患者记录来测试此类模型，这些模型可以为医疗系统节省大量的直接和间接成本并改善患者预后。


