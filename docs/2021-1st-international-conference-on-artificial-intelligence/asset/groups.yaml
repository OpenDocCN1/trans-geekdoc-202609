    NASSER ALQAHTANI

    临床药剂师

    利雅得，沙特阿拉伯

    Lnasserm@gmail.com


    **摘要**—心力衰竭（CHF）是医疗保健系统负担沉重的疾病之一。患者在诊所的就诊和随访与直接间接成本有关并影响治疗结果。本研究旨在使用机器学习模型预测心力衰竭患者的风险水平和分类，以有信心地延长患者下次门诊的时间。使用
    Waikato Enrichment Knowledge Analysis Version 3.4（Weka）通过不同的学习模型对数据进行统计分析。在测试的最佳模型中，随机森林（Random
    Forest）和逻辑回归（Logistic Regression）表现出最佳性能。模型在这些优秀指标（精确率、召回率、F 值和 ROC）上的整体准确率达到了
    0.89 左右。未来需要更多平衡的数据集和记录来测试此类模型，这将有助于医疗保健系统避免直接和间接成本并改善患者的预后。


    **关键词：** 心力衰竭（CHF）；随机森林；机器学习；预测模型


    # I. 引言


    心血管疾病（CVD）是首要死因。2017 年，有 1780 万人死于 CVD。预计到 2030 年，每年死亡人数将跃至 2220 万以上。据报道，2014
    年至2015 年间与 CVD 和中风相关的直接和间接成本在美国为 351 亿美元。心力衰竭（CHF）是最常见的 CVD 之一，可以描述为一种以心脏泵血和充血能力下降为特征的临床综合征。生理上，它是心脏输出量不足以满足身体代谢需求。其患病率为
    1-2%，在老年人群中高达 10%。最近的一项研究显示，出院心衰竭患者的 60 天死亡率约为 8.6%，死亡/住院合并率为 36.2% [5]。在当地，一项沙特多中心研究显示，12
    个月内全因死亡率约为 9%，再住院率为 39%。报告显示，心力衰竭的 30 天入院率仍需改进 [7]。住院后的早期随访与心力衰竭患者较低的 30 天入院率有关
    [8]。因此，指南建议出院后进行密切随访（7-14 天）[9]。机器学习和深度学习的最新进展使其被应用于各种医疗状况；因此，不同的机器学习技术已被用于改善心力衰竭的预后。在本研究中，我们旨在使用机器学习对心力衰竭患者进行分类。这种分类有助于预测我们能够延长心力衰竭患者出院后下次就诊的时间。主要研究问题是——我们如何延长心力衰竭患者下次就诊的时间？


    # II. 文献综述


    我们目前有不同人员研究的可用机器学习技术。Moloud 等（2015）通过使用不同的模型识别心力衰竭，证实了 CHF 的准确率达到了 93%。在这些数据集上，具有这些优秀指标（精确率、召回率、F
    值和 ROC）的模型整体准确率达到了 0.89。Fais（2019）显示，决策树（DT）的准确率达到了 92% [23]。相比之下，朴叶贝叶斯（Naive
    Bayes）准确率为 90%。


    # III. 方法


    我们的研究使用了多种可用的机器学习技术。


    ### A. 数据管理


    数据使用 Waikato Enrichment Knowledge Analysis Version 3.4（Weka）进行统计分析。在应用模型之前，对数据进行了清理和处理。


    ### B. 模型验证


    我们使用了 10 折交叉验证来测试模型 [18]。未来需要更多平衡的数据集和记录来测试此类模型，这将有助于医疗保健系统避免直接和间接成本并改善患者的预后。


