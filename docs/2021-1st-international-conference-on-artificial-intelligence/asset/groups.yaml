    Fig. 2. Heart failure stages distributed by gender


    # B. Model Validation


    We have 100-fold cross-validation with Waikato Knowledge Analysis Engine (Weka
    version 3.4) for testing the dataset since it''s a relatively small dataset [18].
    Every portion of the data had the chance to be in training and testing. Precision,
    Recall, F-measure, and Area Under Curve (ROC) were used to predict the probability
    of CHF. We used Multiple algorithms to statistically analyze the Zero(majority
    classifier), Naive Bayes, Instance Based Learner (IBK), Logistic Regression, MultilayerPerceptron
    (ANN), Decision Tree J4, Random Forest (Predictive Value), Recall (Completeness),
    F-, and Receiver Curve (ROC) are used to find out the probability of CHF.


    # IV. RESULTS


    We found that the best model predict class and risk level between the tested models
    was the Random Forest and logistic regression classifier; almost the same results.
    It has a precision of 0.89, a recall of 0.90, an F-measure of 0.89 and overall
    weighted receiver curve (ROC) is 0.88. For AdaBoost comes in place, with precision,
    recall, and F-measure, and (ROC) was 0.84. Other algorithms are under this list
    ZeroR which comes at the bottom of the model list with (ROC) of 0.48 shown in
    table 1.


