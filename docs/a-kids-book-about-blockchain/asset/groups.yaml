    # # Words To Know


    +   **Bitcoin:** A digital currency that can be exchanged between people without
    the need for a bank.


    +   **Centralized:** To concentrate power and authority in a single central organization.


    +   **Cryptocurrency (or crypto):** A digital asset that is given value and used
    in exchange for goods or services.


    +   **Data:** Information about all sorts of stuff that is sometimes saved in
    digital form.


    +   **Database:** A collection of data that can be searched by using a computer.


    +   **Decentralized:** Sharing the control of an action or organization among
    multiple people.


    +   **Democracy:** A government in which the people vote to elect their representatives
    at routinely-held free elections.


    +   **Digital:** Something you can access only by using an electronic device,
    like a computer or smartphone.'
