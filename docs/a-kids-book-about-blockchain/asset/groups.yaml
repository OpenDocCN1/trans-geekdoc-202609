    ISBN: 978-1-953955-92-0


    设计：Gabby Nguyen

    编辑：Jennifer Goldstein


    献给我的“小狮子”们 Carter 和 Camryn，以及我那不可替代的爸爸。


    ## 简介


    作为成年人，有 3 个神奇的词语可以用来探索那些可能永远改变我们的想法。我。不知道。


    “我不知道”这个短语可以解锁关键信息，消除期望，并创造学习新事物的机会。当我们对孩子使用这个神奇短语时，它让我们能够设身处地为他们着想，并通过他们的视角努力得出答案。这就是我编写这本关于区块链的书所想要做的。


    我为这本书设定的目标不是拥有所有答案，而是提供区块链技术可以并且将会如何在我们及我们孩子的生活中被使用的例子。区块链是许多我们可能每天都会听到的新应用的基础。从
    NFT（非同质化代币）到元宇宙，越来越多的区块链用例正在被创造。


    这本书的编写旨在帮助围绕这项革命性技术展开对话，并为成年人和孩子创造机会，去探索区块链有潜力改善和提升我们生活许多方面的可能性。


    如果我告诉你


    ## 区块链


    是未来的技术？


    ## 总有一天，你会到处使用它？


    当你去上学时。

    当你玩你最喜欢的电子游戏时。

    当你购买东西时。

    甚至当你创作艺术时！


    你可能还不知道区块链是什么，但没关系——我保证。


    因为猜猜看？

    很多成年人也还不知道区块链是什么！


    酷的地方在于，读完这本书之后，你和你的成年人都会对这项名为区块链的新奇激动人心的技术有更多了解。


    *我们会在本书中介绍很多术语。每次你看到带下划线的单词（比如 technology），你就知道可以在书末找到更多相关信息。*


    而且，也许，

    你会有一些想法，

    关于你如何

    利用它

    改变

    世界。


    ## 那么你可能会问自己，什么是区块链？


    让我来解释。


    ## 区块链是


    一种全新的、不同的存储或保存数据的方式。


    现在我想让你思考一下你把东西放在哪里。


    你可能把衣服放在衣柜里。

    你的餐具放在碗柜里。

    你的书放在书包里或书架上。


    但是说到数据，你把它存储在数据库中。


    我知道所有这些关于数据的谈话听起来可能有点无聊。


    但事实完全不是这样。


    因为当我们谈论数据和区块链时，事情就变得非常有趣。


    你看，区块链是一种令人惊奇的新型数据库。


    它比其他类型的数据库更公平、更透明。


    旧数据库通常由一个人或一家公司控制，这意味着它们是集中式的。


    但区块链数据库是分散式的，这意味着它们由许多人或多家公司控制。


    你知道吗？区块链数据库允许世界上任何人，任何人，查看其内部，以便指出问题并保持公平？


    关于区块链的另一个酷之处在于，没有任何东西会被删除。永远不会！


    每次向数据库添加新信息时，就会创建一个新的数据块。


    这就是它被称为区块链的原因。


    然后将这个新块添加到之前的块中（这就是单词中“链”部分的含义来源）。


    ## 所有数据都相互连接！


    随着链条变长，

    存储更多信息

    并建立连接。


    而且猜猜看？！


    这一切都是公开的，这使得作弊几乎不可能。


    为什么？


    因为这不是秘密！


    好，好，好……这确实很酷，但还是有点复杂，对吧？


    ## 让我们来谈谈区块链当前的一些应用方式！


    ## 你知道吗，音乐家们正在使用区块链出售他们的歌曲，这样他们的粉丝就可以拥有它们？


    使用区块链，

    粉丝不仅可以

    播放歌曲，

    还可以在歌曲播放时

    获得收入。


    ## 你知道吗，艺术家们正在使用区块链出售他们的艺术品？


    使用区块链，

    艺术家可以制定一条规则

    ——使用智能合约——

    即他们每卖出一件

    艺术品就能获得报酬。

    （这意味着每次这件艺术品易手时。）


    你知道吗，有些国家已经在使用加密货币作为其官方货币形式之一？


    使用区块链，

    数字货币和资产

    （称为加密货币），

    可以像纸币或硬币一样

    被创建和使用。


    ### 为什么这一切都很重要？


    ### 为什么任何人今天都应该使用区块链？


    因为...


    - 区块链是透明的。每笔交易对所有人都可见。

    - 区块链促进信任。作弊系统的空间更小了。

    - 区块链是分散式的。没有只有一个人知道规则。


    现在让我们来畅想一下，有了区块链，未来会是什么样子。


    未来，也许更多的人会使用区块链和比特币或以太坊等加密货币来购买东西。


    这可以帮助世界上 17 亿没有银行账户的人。


    ## 未来，也许**所有人**都将在选举中使用区块链投票。


    想象一下，在区块链上看到你的投票被计数，并看到民主在行动。


    ## 未来，也许你玩的视频游戏将使用区块链来构建你的角色。


    这样你就可以将该角色带入你想玩的任何游戏。


    ## 未来，你会想出利用区块链来创造、制作、构建和发现的新奇精彩方式。


    ## 但何必等待？


    ## 未来就是现在！


    ## 结语


    呼！我们做到了！如果你正在阅读这一页，说明你已经读完了《一本关于区块链的儿童读物》，至少现在你能更好地应对那些人们谈论加密货币的假日聚餐了。


    希望这本书能帮助你从“我不知道”转变为“告诉我更多”，当你和你的孩子踏上这段新奇激动人心的冒险之旅时。随着你进一步探索如何使用区块链技术，请记住，虽然这项技术对成年人来说可能是新事物，但我们的孩子正在成长于一个数字时代，在那里它的用途更为普遍。无论你是决定深入了解
    NFT 还是涉足元宇宙，都请务必带着审慎和开放的心态迈出下一步。


    ## 需要知道的词汇


    - **比特币：** 一种无需银行即可在个人之间交换的数字货币。

    - **集中式：** 将权力和权威集中在单一中央组织中。

    - **加密货币（或 crypto）：** 一种被赋予价值并用于交换商品或服务的数字资产。

    - **数据：** 关于各种事物的信息，有时以数字形式保存。

    - **数据库：** 可使用计算机搜索的数据集合。

    - **分散式：** 将行动或组织的控制权在多个人之间共享。

    - **民主：** 一种政府形式，人民在定期举行的自由选举中投票选举其代表。

    - **数字：** 只能通过使用电子设备（如计算机或智能手机）才能访问的东西。


