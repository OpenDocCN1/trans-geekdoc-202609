    To my “Little Leos”, Carter and Camryn, and my non-fungible dad.


    ## Intro


    As grownups, there are 3 magic words we can use to explore ideas that can change
    us forever. I. Don''t. Know.


    The phrase “I don’t know” can unlock vital information, erase expectations, and
    create opportunities to learn new things. When we use that magic phrase with our
    kids, it allows us to put ourselves in their shoes and work to arrive at an answer
    through their lens. That is what I set out to do with this book about blockchain.


    My goal for this book is not to have all of the answers but rather to give examples
    of how blockchain technology can—and will—be used in our lives and the lives of
    our kids. Blockchain is fundamental to many new applications that we may hear
    about on a daily basis. From NFTs (non-fungible tokens) to the metaverse, more
    and more cases for the use of blockchain are being created.


    This book was written to help start conversations around this revolutionary technology
    and create opportunities for grownups and kids to explore how blockchain has the
    potential to enhance and improve many aspects of our lives.


    What if I told you that


    ## BLOCKCHAIN


    is the technology of the future?


    ## That someday, you''ll use it everywhere?


    When you go to school.

    When you play your favorite video game.

    When you buy something.

    And even when you make art!


    You probably don''t know what blockchain is yet, but that''s OK—I promise.


    Because guess what?

    A lot of grownups don''t know what blockchain is yet either!


    The cool thing is that by the end of this book, both you and your grownup will
    know more about this new and exciting technology called blockchain.


    *We''ll cover lots of terms in this book. Each time you see an underlined word
    (like technology), you''ll know you can find out more about it at the end of the
    book.*


    And maybe, just maybe,

    you''ll have some ideas

    about how you can

    change the

    world with it.


    ## So you might be asking yourself, what is blockchain?


    Let me explain.


    ## Blockchain is


    a new and different way to store or keep data.


    Now I want you to think about where you store your things.


    You probably put your clothes in a closet.

    Your dishes go in a cupboard.

    Your books go in a backpack or on a bookshelf.


    But when it comes to data, you store it in a database.


    I know all this talk about data can sound kind of boring.


    But that couldn''t be further from the truth.


    Because when we talk about data and blockchain, things get really interesting.


    You see, blockchain is an amazing new kind of database.


    It is more fair and transparent than other types of databases.


    Older databases are often controlled by one person or company, meaning they are
    centralized.


    But blockchain databases are decentralized, which means they''re controlled by
    many people or companies.


    Did you know that a blockchain database allows anyone in the world, ANYONE, to
    see inside it in order to call out problems and keep things fair?


    And another cool thing about blockchain is that nothing is deleted. Ever!


    Every time new information is added to the database, a new data block is created.


    That''s why it''s called blockchain.


    That new block is then added to the previous blocks (that’s where the "chain"
    part of the word comes from).


    ## ALL OF THE DATA IS CONNECTED!


    As the chain gets longer,

    more information is stored

    and connected.


    And guess what?!


    It’s ALL public, which makes it nearly impossible to cheat.


    Why?


    Because it isn’t a secret!


    OK, OK, OK...this is cool and all, but still kind of complicated, right?


    ## Let''s talk about some of the ways blockchain is being used today!


    ## Did you know musicians are using blockchain to sell their songs so their fans
    can own them?


    With blockchain,

    fans are able to

    not only play the song,

    but also get money

    when the song is played.


    ## Did you know artists are using blockchain to sell their art?


    With blockchain,

    the artist can make a rule

    —using a smart contract—

    that they get paid for every sale

    of each piece of their artwork.

    (That means every time the piece of art changes hands.)


    Did you know some countries are already using cryptocurrency as one of their official
    forms of money?


    With blockchain,

    digital money and assets

    (called cryptocurrencies),

    can be created and used

    just like paper money or coins.


    ### Why does all of this matter?


    ### Why should anyone use blockchain today?


    Because...


    - blockchain is transparent. Each transaction is visible to everyone.

    - Blockchain promotes trust. There is less room to cheat the system.

    - Blockchain is decentralized. There isn''t only one person who knows the rules.


    Now let''s dream up what the future could look like with blockchain.


    In the future, maybe more of us will buy things using blockchain with cryptocurrencies
    like Bitcoin or Ethereum.


    This could help the 1.7 billion people around the world who don''t have access
    to a bank.


    ## In the future, maybe **ALL** of us will vote in elections with blockchain.


    Imagine seeing your vote count on the blockchain and seeing democracy in action.


    ## In the future, maybe the video games you play will use blockchain to build
    your character.


    That way you can take that character into any game you want.


    ## In the future, you''ll think of new and amazing ways to use blockchain to create,
    make, build, and discover.


    ## BUT WHY WAIT?


    ## THE FUTURE IS NOW!


    ## Outro


    When! We did it! If you''re reading this page, you made it to the end of A Kids
    Book About Blockchain, and at the very least, you will now be able to better navigate
    those holiday dinners where people talk about crypto.


    Hopefully this book has helped you move from “I don’t know” to “Tell me more”
    as you and your kid embark on this new and exciting adventure. As you further
    explore ways to use blockchain technology, remember that while this technology
    may be new to grownups, our kids are growing up in a digital era where its uses
    are more common. Whether you decide to dive into NFTs or venture out into the
    metaverse, be sure to take those next steps with discernment and an open mind.


    ## Words To Know


    - **Bitcoin:** A digital currency that can be exchanged between people without
    the need for a bank.

    - **Centralized:** To concentrate power and authority in a single central organization.

    - **Cryptocurrency (or crypto):** A digital asset that is given value and used
    in exchange for goods or services.

    - **Data:** Information about all sorts of stuff that is sometimes saved in digital
    form.

    - **Database:** A collection of data that can be searched by using a computer.

    - **Decentralized:** Sharing the control of an action or organization among multiple
    people.

    - **Democracy:** A government in which the people vote to elect their representatives
    at routinely-held free elections.

    - **Digital:** Something you can access only by using an electronic device, like
    a computer or smartphone.

