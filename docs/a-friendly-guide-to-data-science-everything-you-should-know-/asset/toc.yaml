  - 最常使用的技能：人际技巧至关重要。数据科学部门让人们望而畏，因此提供及时且透明的有助于建立信任。利益相关者不知道自己需要什么。他学会在人们向他索要信息时真实需求——他如何提出正确的问题。最后一项技能是方法论，诸如做好笔记、记录和组织等行为。回顾和重用之前的能力可以节省时间。
