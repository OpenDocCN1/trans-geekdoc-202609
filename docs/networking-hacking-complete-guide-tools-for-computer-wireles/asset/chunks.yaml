    ## 2. 制定一个在特定时刻开始并结束的计划。黑客攻击时间线也应该以具体的和日期的形式列出。


    建立所有目标可能需要一些时间；尽管如此，这一切都是值得的。目标将提供一些指导。如果你有任何疑虑，应该始终参考你所制定的所有目标，以便保持在正轨。


    ## 如何确定要破解的特定系统


    你可能拥有许多计算机网络，但你无法同时评估所有的网络。确保黑客项目已拆分成若干部分，以便使整个过程易于管理。你可以根据已进行的分析来决定你想要测试的特定系统。在此过程中，你应该回答的一些问题包括：


    1. 哪些系统是最关键的？某些系统在没有相应授权的情况下被访问会导致某些麻烦，你还可能遭受巨大损失。

    2. 哪些系统看起来容易被破解？

    3. 哪些系统没有相应的文档记录？


    在制定完所有目标后，你现在可以决定想要测试的特定系统。制定目标的主要原因是它们能帮助你勾勒预期，你还可以对整个过程中将使用的时间和资源做出更好的估算。你可能需要测试的一些设备包括：![路由器和交换机的图像结果](img/rsrcFA.jpg)


    1. 路由器和交换机 - 交换机连接网络上的计算机，而路由器将许多网络连接在一起。

    2. 防火墙

    3. Web 服务器、应用程序和数据库服务器

    4. 无线访问点和桥器

    5. 电子邮件和文件

    6. 工作站、平板电脑和笔记本电脑

    7. 用于存储机密的移动设备

    8. 客户端和服务器操作系统


    当你处理一个小型网络时，可能测试所有内容。应该测试一些面向公众的主机，它们包括 Web 服务器和电子邮件。此外，道德黑客过程也是灵活的，这很好。始终从看起来脆弱的网络开始。此外，还要考虑以下因素：


    1. 运行网络使用的特定操作系统

    2. 网络中存在的应用程序

    3. 存储在网络上的关键信息数量


    ## 攻击树分析


    攻击树分析是黑客创建一个流程图的过程，概述他们将如何攻击某个网络。攻击树分析通常由安全团队在进行高级风险分析时使用。在大多数情况下，这种分析是在规划新网络项目时进行的。如果你想提高自己的黑客技巧，你应该有方法论地计划每种攻击方法。主要问题是绘制攻击树所需的时间。此外，在这种情况下需要大量的专业知识。现在，也可以使用计算机来生成攻击树。你可能使用的工具包括
    `SecurITree`。攻击树分析的示例所示所示![示例 SecurITy 攻击树分析的图像结果](img/rsrcGA.jpg)


    与漏洞评估相比，道德黑客更加详细。作为一名道德黑客，你应该寻找关于不同系统的大量信息。例如，你应该寻找有关组织及其网络的信息。由于道德黑客是灵活的；你可以利用不同的黑客技术。如果你不确定从哪里开始，应该评估一个可见性高的系统。你也可以更多地关注特定网络的防火墙。


    ## 制定测试标准


    当沟通不畅时，执行道德黑客测试时系统很容易崩溃。为了避免此类挑战，你应该制定文档测试标准。标准应该包括：


    1. 正在进行的特定测试

    2. 测试执行的时间以及总测试时间

    3. 你对特定系统的了解程度

    4. 每项测试将如何执行以及将使用的 `IP address`

    5. 发现不同漏洞后采取的最优步骤


