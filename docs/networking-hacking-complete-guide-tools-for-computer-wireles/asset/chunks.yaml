  trans: "\n\n# 第 4 章：黑客攻击方法论\n\n在本章中，重点将放在：\n- 检查黑客过程中的某些成功步骤\n- 如何获取有关组织的信息\n- 扫描网络\n\
    - 寻找网络上的漏洞\n\n在专注于成为伦理黑客之前，你需要具备如何制定有效方法的基础知识。伦理黑客不仅包括渗透网络，还包括对其进行修复。一些经过证明的技巧也可以在你专注于学习更多黑客攻击知识时，为你提供指导。当你使用特定的方法论时，你可以轻松实现目标。此外，你将能够以专业的方式操作，并从你的时间和精力中获得丰厚回报。\n\
    \n## 为测试做好准备\n\n在过去，黑客过程主要是手动操作的。如今，人们可以利用不同的工具来完成各种目标。其中一些工具可以确保你执行测试，并减少测试过程中涉及的步骤。尽管这些工具非常方便，但更多地了解背后发生的情况也是好的。\n\
    \n伦理黑客也可以比作软件测试过程。你必须能够逻辑性地思考，以便在与系统组件进行交互的同时，也更多地了解它们是如何工作的。你应该收集碎片化的信息。此外，当你开始测试网络时，你会有许多目标和测试要运行。你将不断接近，直到发现所有现有的安全漏洞。\n\
    \n伦理黑客过程中使用的流程与恶意黑客使用的流程大体相同。主要区别在于恶意黑客和伦理黑客的目标和动机。此外，每个人的实现目标的方式也不同。主要的区别还在于，伦理黑客会尝试查看系统中存在的漏洞，并解决这些每一个问题。而对于恶意黑客来说，他们会利用现有的漏洞，并访问不同的信息来为自己谋利。\n\
    \n如今，恶意人员的攻击可能从不同的角度进行。建议测试每一个可能的点，包括客户端网络、合作伙伴和供应商。其他可以测试的区域还包括笔记本电脑、无线局域网（LAN）和家庭用户。当你开始作为伦理黑客测试你的技能时，你应该跟踪你所进行的所有测试。此外，还要留意你一直在使用的工具以及你获得的结果。\n\
    \n你记录的信息可以从以下方式帮助你：\n1. 跟踪以前执行测试时哪些方法是有效的。\n2. 这些信息有助于证明你没有出于恶意意图攻击系统。\n3. 在出现任何问题时，将测试与入侵检测系统以及其他日志文件进行关联。\n\
    4. 你还应该记录最终报告。\n\n删除记一些通用笔记外，你还可以对结果进行截图，因为它们可能也很有用。截图可以在以后使用，因为它们证明了某些情况的发生。此外，在编制财务报告时，它们也会很有用。根据你所使用的特定工具\
    \ set，截图将作为你的证据。这种证据在尝试展示网络中存在不同的利用程序和漏洞时也很有用。\n\n你的主要焦点应该是模拟和收集可能损害系统的信息。在执行测试时，你可以对网络中的其中一台计算机进行部分攻击。在某些情况下，你也可以继续攻击整个网络。你主要在寻找可以被恶意用户利用的弱点。还还应该对内部系统进行全面评估。在寻找漏洞时，检查每个系统是如何相互互连的，以及一些私有系统是如何运行的。你应该研究那些未免受恶意用户侵害的信息。\n\
    \n在执行伦理黑客攻击时，你可能会进行盲测，并从公司名称等基础信息开始。这种方法确保了你是从零基础开始的，你也将能够获取黑客也可以轻松访问的敏感信息。主要问题是，这种技术可能会花费更长时间，你可能无法注意到网络中存在的某些安全漏洞。伦理黑客不应该总是担心他们的数字足迹被追踪，因为他们正在合法地执行每项任务。虽然这样的黑客可能在合法地行动，但建议采取隐蔽的工作。黑客用来隐藏每项行动的某些技巧将在后续章节中详细讨论。\n\
    \n## 观察他人所见\n\n你获得了大量关于公司及其计算机系统的信息。这些信息也可以被轻松地访问，这是通过一种被称为“足迹探测”（foot printing）的技术实现的。还可以通过以下方式收集信息：\n\
    1. 使用网络浏览器搜索有关特定组织的信息。在这种情况下，某些如 `Google` 这样的搜索引擎非常有用。\n2. 执行网络扫描、评估漏洞并探测开放端口，以确定关于网络的各种信息。如果你是从内部访问网络，可以使用包括\
    \ `GFI LanGuard` 在内的端口扫描器，这样你也可以看到哪些是可访问的。无论你使用何种探测技术，都应该限制你对特定组织 supposed 收集的信息。你花费的时间也重要。需要考虑的一些主要因素还包括组织的大小以及组织内部信息的复杂性。\n\
    \n## 收集公开信息\n\n有关特定组织及其网络的大量信息可以在互联网上轻松获取。你的主要任务是找到这些信息。此类信息确保黑客可以轻松针对组织内的特定区域。他们可能更多地关注特定的个人，例如公司的高管。用于收集目标组织信息的一些技术包括：\n\
    \n1. **网络搜索**：当你对一个组织进行网络搜索时，你可以获取以下信息：\n    - 员工姓名及其联系方式\n    - 一些相关的公司日期\n \
    \   - 注册文件\n    - SEC 文件\n    - 合并与收购\n    - 关于组织变更、重大行动和新产品的新闻稿\n    - 专利和商标\n\
    \    - 演示文稿、网络直播文章\n\n微软正在确保他们在搜索领域取得进展。`Bing` 是一个搜索引擎，该公司位居第二。对于许多黑客来说，他们倾向于使用\
    \ `Google`。该搜索引擎免费且易于访问，大多数黑客都知道如何利用这个工具为自己谋利。在使用 `Google` 时，可以使用以下技术：\n- 输入关键词。你可以找到存在于数百万页面中的相关信息。也可以访问电话号码、文件和地址。\n\
    \n"
- fmt: '

    ### 1. Advanced Web Search

    * Performing an advanced web search. `Google` has some advanced search options,
    and you can also find some sites that can also be linked back to the specific
    company’s website. Such a search will ensure that you have gained access to relevant
    pieces of information about the vendors, partners, and clients within the target
    company.

    * By using switches so that you may dig deeper into the firm’s website.


    ### 2. Web Crawling

    The web crawling utilities include the website copier, `HTTrack`, and you can
    also mirror a company by also downloading some of the files that can be accessed
    publicly. You can also inspect the website while offline. You can dig into the
    following areas:

    * The layout and configuration of the website.

    * The files and directories that may not be easily accessible.

    * The script source code and the HTML codes and also be easily accessed.

    * Command fields.


    Some of the comment fields also contain certain pieces of information that may
    prove to be useful including email addresses and names of the internal IT personnel,
    developers, software versions, server names, some comments on how the code works,
    and IP addressing schemes.


    ### 3. Websites

    There are some websites can provide different pieces of information about various
    organizations as well as their employees.


    ### 4. Mapping the Network

    When you map a network, you can go ahead and search some of the public resources
    and databases, and you can see what people may know about your network. Some of
    these websites include `Whois` tools that are readily available on the Internet
    that can also be used to check some of the domains that are available on the Internet.
    Such a tool comes in handy when starting a social engineering attack or when scanning
    a network.


    ### 5. Google Groups

    `Google Groups` can help to reveal some network information about an organization.
    Some of the information that is accessible through such a platform is the IP addresses,
    domain names, and usernames. You can also gain access to other forms of private
    information, including:

    * A message board that displays too much information about the current network
    and computer systems. There are many people who post messages on such platforms
    but they are not aware that the messages are being shared to the entire world.

    * Confidential information about the company and it may be posted by the clients
    and employees.


    After discovering that some confidential information has been shared on some online
    platforms, you should remove it.


    ### 6. Privacy Policies

    Always check the privacy policies on your website. All your users need to know
    about the information that is collected when they visit your site. Also, they
    should know how their information is protected. The privacy policies are normally
    written by lawyers and they do not go-ahead to look into the information regarding
    your security infrastructure.


    ### 7. Scanning Systems

    By engaging in active information gathering, you may be able to produce more details
    about your network and you can also see things from the perspective of a hacker.
    For example, you can do the following:

    * Utilize the information that you may have gathered using the `Whois` searches
    so that you may also test each of the hostnames and IP addresses that are closely
    related. The information includes the determination of hostnames, IP addresses,
    running protocols, available shares, open ports, applications, and running services.

    * Scan the internal hosts and adhere to the scope of your testing. Some of the
    outsiders cannot view some of these hosts; nevertheless, you need to test them
    so that you can see what some of the rogue individuals may be able to access.


    In some instances, the hacker may have already accessed the system, and they can
    manipulate anything from the inside. To be safe, you should examine the entire
    system to look for any weaknesses. If you do not believe that your scanning systems
    are reliable, you can use different systems are run them on the virtual machine
    software.


    ### 8. Hosts

    During the scanning process, also document some of the hosts that may be accessible
    within the internal network. Always start by pinging some host names using some
    of these tools:

    * A basic `ping` utility that is located within the operating system.

    * Third-party utilities allow people to ping multiple addresses and they include
    the `SuperScan` and `NetScanTools Pro`. You can also use sites such as `whatisipaddress.com`
    to show you how your gateway IP address appears as you browse on the Internet.
    The website will allow you to see the IP address that can be seen by outsiders.


    ### 9. Open Ports

    You can scan for the open ports using different tools, including:

    * `Nmap` and `Superscan` can help to scan network ports.

    * You can use a network analyzer to listen to the network traffic. Some of the
    tools that you can include `Wireshark` and `OmniPeek`.


    It is easy to carry out a scan internally. You should connect your computer to
    the network and load different forms of software. You can also carry out scans
    outside the network, and you should start by assigning a public IP address to
    your computer before you can plug it into the router. In such an instance, your
    computer is not connected to the Internet. The connection will work regardless
    of whether you are connected to the Internet or not. Also, you need to determine
    what is running on the open ports. As an ethical hacker, you should gain access
    to such pieces of information:

    * The protocols being used

    * The services that are running on the hosts which may include database applications,
    web servers, and e-mails

    * The remote access services that are available which may include remote desktop

    * VPN services

    * Authentication that required for network shares


    ### Assessing Vulnerabilities

    After finding all the security loopholes, you should go ahead and look into some
    of the vulnerabilities that are present in your network. Before the testing process,
    you should also perform a manual search. You can conduct some research on the
    message boards used by hackers, vulnerability databases, and websites. Some classified
    sites help to list different vulnerabilities. When looking for some of these vulnerabilities,
    you will realize that some of these vulnerabilities are somewhat generic. At times,
    you may also be forced to look into some of the vendor’s sites so that you can
    learn more about the present vulnerabilities. Some of the sites that can help
    to showcase different vulnerabilities include [`www.sans.org/top20](http://www.sans.org/top20).
    The site helps to showcase more than 20 vulnerabilities. The list of vulnerabilities
    is compiled by the SANS organization.


    1. **Manual Assessment**: You will be able to assess some of the potential vulnerabilities
    by establishing a connection to the ports. Some systems can also be assessed manually
    including some web applications. If you have a lot of time to spare, you can perform
    each of these tests manually.

