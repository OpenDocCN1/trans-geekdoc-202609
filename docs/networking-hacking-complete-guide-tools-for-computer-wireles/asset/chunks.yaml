    Some of the suitable practices when carrying out ethical hacking include:


    ### Timing

    It is all about the timing. The timing concept applies to activities such as ethical
    hacking. When carrying out some tests, you should ensure that the business processes
    within an organization are not affected. Harmful situations that should be avoided
    include miscommunication. It is also good to avoid causing a `Dos` attack on an
    e-commerce site that has high traffic, especially during the day. If many people
    are working on a specific project, they should agree on the timing so that they
    may achieve their end goal. At times, it is good to always notify the `ISP` (Internet
    Service Providers). After they are aware that you are going to test the system
    to look for some vulnerabilities, they will not block any of your traffic in case
    they have suspected any malicious behavior that normally appears on the firewall.
    The testing timeline should comprise of some short-term dates when carrying out
    different tests. The milestones should also be outlined. You can come up with
    a timeline and key in the data into a spreadsheet so that it may offer some suitable
    form of guidance.


    ### Specific Tests

    You may be tasked with carrying out a penetration test. Also, you may want to
    perform some specific tests including cracking passwords and trying to gain access
    to different web applications. At times, people also carry out social engineering
    tests while assessing the network. Regardless of the specific test, you may not
    want to reveal some information about the specifics of the test. The main reason
    why documenting is important is that it helps to get rid of any form of miscommunication
    that may arise in the future. Sometimes, people also make use of screen actions.
    You may not possess any knowledge about the general tests that you are supposed
    to perform; however, if you use automated tools, it may be impossible to learn
    more about the tests that you have conducted.


    ### Blind Versus Knowledge Assessments

    It is good to possess huge amounts of knowledge about the system that you are
    supposed to test. Although such knowledge may not be necessary, you should at
    least possess a basic understanding of the system that you are supposed to hack
    for you to easily protect yourself by making sure that you have not left any digital
    footprints that can be traced back to you. It is not hard to gain access to such
    information; you just have to survey so that you may gain a better understanding
    of the system that you are supposed to access. When you carry out some background
    research, you will not be hacking into the system blindly. When carrying out an
    assessment, the techniques that you use are always dependent on your needs. The
    most suitable approach is to plan on carrying out unlimited attacks. A hacker
    with a malicious motive does not hack into a system when using a limited scope.
    It is also good to confirm whether you want to carry out the tests and that they
    should not be detected by the network administrators as well as the security providers.
    You must also carry out physical security tests and social engineering. If there
    are too many people who know that you are about to test the system, they may change
    their habits, and the results of the test will not be accurate. However, that
    does not mean that you should not inform anyone. You should have a main contact
    within the organization and that they should have an authoritative position.


    ### Location

    The tests that you are carrying out dictate the location that you should run them
    from. The main goal is for the network to be tested from a location that can be
    easily accessed by malicious hackers. You can also determine whether the network
    will be hacked by someone within the organization; as a result, it is good to
    ensure that all the bases have been covered. You can combine different tests and
    you can execute them both internally and externally. Some of the tests that you
    can carry out include cracking passwords and assessing the network infrastructure.
    At times, seeking the services of an outsider who may possess knowledge about
    how to hack into a network is advisable for they can perform tests on gadgets
    such as firewalls, routers, and different web applications. As for the external
    attacks, you should have a stable Internet connection. In some instances, you
    may also have to make use of an external proxy server. You can also assign a suitable
    `IP address` to your computer that cannot be traced back to you. To get a better
    view of the network, you should have it plugged into the network outside the firewall.
    Internal tests are quite easy since you only need to have some physical access
    to the network and the organization’s servers. You can also use a `DLS` line or
    a cable modem.


    ### How to React to the Vulnerabilities Present in the Network

    When it comes to vulnerabilities, you need to come up with a sensible technique
    that you could use to seal the security loopholes that are present within the
    organization. You should not necessarily hack into the system forever since it
    will end up crashing in the process. You need to follow the path that you have
    outlined until you can no longer access the network. If you have any doubts, you
    should have outlined your goals and should stop after making sure that each of
    your goals has been achieved. If you discover a certain loophole, you should contact
    the right people so that they can fix the problem fast. If you do not fix the
    problem on time, some people may take advantage of the current loopholes and they
    can cause some irreversible damage. The employees should also try to ensure that
    they have not violated their employment agreement.


    ### Silly Assumptions

    When you assume things, you may fail to achieve your objectives. Below are some
    assumptions that people make when they are supposed to hack into a network:


    1. The networks are available during the testing process.

    2. You can assume that you have all the necessary testing tools.

    3. The testing tools that you utilize may minimize the possibility of the network
    crashing.

    4. You may know all the risks of each test.


    You should have documented all the assumptions that you have.


    ### Selecting Tools to Carry Out Security Assessment

    The security assessment tools that you use depend on different factors depending
    on the tests that you are supposed to run. You can perform some ethical hacking
    tests using a telephone or a network. When performing a comprehensive test, you
    must have the necessary tools. If you do not know the specific tools that you
    should use, you will learn more about some of the tools used when hacking into
    a network in the preceding chapters. Some of these tools are free or commercial;
    you can use them accordingly to achieve your goals. You must know about the applications
    of all the hacking tools that are at your disposal. Some of these tools are also
    accompanied by manuals, while some have manuals that are not well-documented,
    and that can be frustrating. You can go ahead and search for some newsgroups as
    well as message boards to learn more about how some of these tools operate. Some
    of the tools may prove to be hazardous since they may affect the health of your
    network. You should be careful when using some of these tools. You should have
    an in-depth understanding of all the available options. You should not use any
    tools during the testing process if you do not have an in-depth understanding
    of some of these tools. Some of these precautions ensure that you will not be
    affected by `Dos` conditions. Also, you will not lose any data in the process.
    You may also not understand the importance of some of the open-source tools. If
    some of the freeware tools prove they are not worth it, you can go ahead and purchase
    the commercial versions since they may prove to be effective. Some of these tools
    may be expensive; however, what matters most is their functionality. Always make
    sure that you have gotten value for your money.

