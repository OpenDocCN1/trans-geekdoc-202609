    All the listed options also have `.onion` domains and you can access them using
    the `TOR browser`. The regular browsers cannot work in this case.


    ### About the Dark Web Search Engine

    The `.onion` domains can only be used on the dark web. They are somewhat similar
    to the normal domains and they cannot be accessed using regular browsers. Some
    harmless `.onion` addresses exist. There are many sites on the dark web and you
    have to put in some effort so that you can find them. You should also note that
    you may stumble upon some illegal activities on the dark web.


    ### Is It Safe to Play On the Dark Web?

    It may be exciting to try and explore the unknown; however, it is good to come
    to terms with some of the present dangers on the dark web. The bad guys will always
    be on the lookout to access various pieces of information. The law enforcement
    officers will also be on the dark web trying to capture some of the individuals
    engaging in illegal activities.


    ### The Security Guide for Accessing the Dark Web

    We have noted that there are many terrifying things taking place on the Dark Web.
    You may take some necessary precautions so that you can avoid them. To stay safe,
    utilize the following guidelines:


    1. Ensure the `Tor browser` is up-to-date. Use the `Tor browser` when accessing
    the `.onion` domain sites that are present on the Dark Web. Also, your `Tor Browser`
    should be updated so that you may be safe while accessing some of these sites.


    ![](rsrcCW.jpg)


    2. Use a reputable `VPN`. The importance of using a `VPN` was discussed earlier.
    The `VPN` conceals your location whereas the `Tor browser` helps to hide your
    identity. The `VPN` you are using should be reputable. Some examples were also
    highlighted including the `ExpressVPN`.


    3. Do not use macros. The macros normally run scripts including `JavaScript`.
    Using macros can open some worms, and the risk level will be high. If you are
    asked to enable scripts while surfing on the dark web, you should always think
    twice since you will be exposed to different forms of malware.


    4. Be careful with what you download. The main agenda is to avoid malware and
    viruses. Some hackers attach some malicious codes on different files, and people
    cannot easily know until it is too late. You may use a virtual machine so that
    you may stay safe.


    5. Always change your mindset. There are many people who may assume that the dark
    web is safe since the cybersecurity experts may be working on ensuring that the
    Internet is free from cybercrime. Always change your mindset since the dark web
    is not safe. You should be cautious and must not trust anyone that you meet on
    the platform.


    Some people are faint-hearted. They may opt to act as tourists on the dark web.
    If you have ever visited the dark web, you will realize that most of the information
    about the platform is true and no rumors. There are many illegal activities taking
    place on the platform, and that is why you should ensure that you are safe. You
    should also be cautious since some of the people on the dark web will always try
    to take advantage of some the ignorant individuals. Hackers like the dark web
    since they can easily discuss anything on the platform. They make use of message
    board and social media sites that have `.onion` domains. Most of the malicious
    users take advantage of some people’s ignorance. They also know more about some
    of the aspects of the real-world security. Hackers usually take different approaches
    as follows:


    1. Most of the computer networks are not properly managed; some computer systems
    are not patched properly, monitored, or hardened. The attackers can easily gain
    access to such a network even though a firewall may be present as well as an access
    control system. The actions of some malicious users may not be tracked in any
    way. Additionally, they may have full access to the network and that means they
    can exploit it to their benefit.


    2. Most of the security and network administrators may be unable to keep up with
    some of the attack methods and new vulnerabilities within the system. In some
    instances, the network administrators may be occupied to an extent that they cannot
    keep track of every activity on the network. Additionally, they may fail to notice
    some unusual activity on the network since they may have failed to set goals and
    their time management skills may also be poor.


    3. Information systems become more complex with time. At times, the network and
    security administrators may be unable to keep track of everything happening on
    the network since the information systems become complex with time. An attacker
    will always use such information to their advantage. They will always attack during
    a period when the network and security administrator is unaware.


    4. The attacks are usually carried out slowly and they cannot be easily detected.


    5. The attacks may also be carried out after business hours and that means that
    the network and security administrator may not be present to keep track of the
    activities taking place within the network.


    To learn more about how hackers penetrate these networks, you may keep track of
    the magazines that talk about hacking and they may also be produced at least once
    or twice a month. Most of the hackers learn from their mistakes. When they make
    a mistake, they always know they are one step closer to gaining access to a certain
    network. They always use the knowledge they have gained to plan future attacks.
    As an ethical hacker, you will also have to learn from your mistakes.


    ### Managing Anonymity

    Smart hackers want to ensure that their identity is concealed. A hacker always
    prioritizes more on covering their tracks. The success of a hacker is dependent
    on whether they have remained unnoticed. They should also not raise any form of
    suspicion so that they can also go ahead to access the system as they wish in
    the future. Some of the resources that hackers use to remain anonymous include:


    1. `VPN` accounts that may be owned by previous employers or friends

    2. Public computers in malls, schools, or even libraries

    3. Internet proxies

    4. Open wireless networks

    5. Anonymous e-mail accounts

    6. Unsecured computers

    7. Open e-mail relays


    If a hacker develops a well-crafted plan, they cannot be easily traced.


    ## Chapter 3: Coming Up With a Hacking Plan

    This chapter will focus on the following areas:

    - Coming up with ethical hacking goals

    - Selecting the networks to test

    - Examining some of the hacking tools


    As a hacker, you must come up with a plan before you commence on the hacking process.
    The plan will ensure that you have penetrated the network at ease and gives you
    confidence about what you are doing. Since there is a lot of seriousness when
    carrying out hacking, it is good to come up with a well-crafted plan. You may
    start by testing a program on your computer while outlining, documenting, and
    defining your goals. Make sure that you have determined your testing standards
    while also familiarizing and gathering different tools that will help you to facilitate
    the entire hacking process. In this chapter, you will get a step-by-step guide
    on how you can create a good hacking environment that can enhance your success
    levels when hacking into a network. As an ethical hacker, an approval from your
    clients and the management should be received before you implement the hacking
    plan that you had formulated.


    ### Establishing Your Goals

    As a hacker, your goals should be outlined accordingly. The main goals that you
    may have as an ethical hacker entail looking into the vulnerabilities that are
    present within a network since the main focus is in ensuring that it has become
    more secure. Some of the steps that help you to outline your goals include:


    1. Define some of the specific goals. Align all your goals with the business objectives
    within the organization. Look into what the management is trying to get at the
    end of the entire process.

