    所有列出的选项都有 `.onion` 域名，你可以使用 `TOR browser` 访问它们。普通浏览器在这些情况下无法工作。


    ### 关于暗网搜索引擎

    `.onion` 域名只能在暗网上使用。它们与普通域名有些相似，且无法通过普通浏览器访问。存在一些无害的 `.onion` 地址。暗网上有很多网站，你必须花费一些精力才能找到它们。你还应该注意，你可能会在暗网上无意中遇到非法活动。


    ### 在暗网上玩耍（上网）安全吗？

    尝试探索未知可能很令人兴奋；然而，接受暗网上现有的某些危险是明智之举。坏人总是会时刻寻找机会以获取各种信息。执法人员也会出现在暗网上，试图捕获一些参与非法活动的个人。


    ### 访问暗网的安全指南

    我们注意到，暗网上正在发生许多可怕的事情。你可以采取一些必要的预防措施来避免它们。为了保持安全，请利用以下指南：


    1. 确保 `Tor browser` 是最新版本。访问暗网上的 `.onion` 域名站点时，请使用 `Tor browser`。此外，你的 `Tor Browser`
    也应该保持更新，以便在访问某些站点时确保安全。


    ![](img/rsrcCW.jpg)


    2. 使用信誉良好的 `VPN`。之前讨论过使用 `VPN` 的重要性。`VPN` 隐藏你的位置，而 `Tor browser` 有助于隐藏你的身份。你使用的
    `VPN` 应该是信誉良好的。文中还强调了一些示例，包括 `ExpressVPN`。


    3. 不要使用宏。宏通常运行包括 `JavaScript` 在内的脚本。使用宏可能会打开蠕虫，风险水平将很高。如果你在暗网上浏览时被要求启用脚本，你应该反复考虑，因为你将暴露在不同形式的恶意软件之下。


    4. 小心你下载的内容。首要任务是避免恶意软件和病毒。一些黑客会在不同的文件中植入恶意代码，人们在太晚之前无法轻易得知。你可以使用虚拟机来保持安全。


    5. 始终改变你的心态。许多人可能认为暗网是安全的，因为网络安全专家可能致力于确保互联网免受网络犯罪。要始终改变你的心态，因为暗网并不安全。你应该保持警惕，绝不要信任在平台上遇到的任何。。


    有些人胆子较小。他们可能选择在暗网上充当游客。如果你曾经访问过暗网，你会发现关于平台的大部分信息都是真实的，并非传言。平台上发生了许多非法活动，这就是为什么你应该确保自己安全。你还应该保持警惕，因为暗网上的某些总是试图利用某些无知的人。黑客喜欢暗网，因为他们可以轻松在平台上讨论任何内容。他们利用了具有
    `.onion` 域名的留言板和社交媒体网站。大多数恶意用户利用了一些人的无知。他们对现实世界安全的某些方面也了解得更多。黑客通常采取以下不同方法：


    1. 大多数计算机网络没有得到妥善管理；某些计算机系统没有经过适当的补丁、监控或加固。即使有防火墙和访问控制系统，攻击者也可以轻松访问此类网络。某些恶意用户的行为可能无法以任何方式被追踪。此外，他们可能拥有网络的完全访问权限，这意味着他们可以利用它来牟利。


    2. 大多数的安全和网络管理员可能跟不上系统内部某些攻击方法和新漏洞。在某些情况下，网络管理员可能忙到无法跟踪网络上的每项活动。此外，他们可能没有注意到网络上的某些异常活动，因为他们可能未能设定目标，且时间管理能力也较差。


    3. 信息系统随时间推移变得越来越复杂。由于信息系统随时间推移变得复杂，网络和安全管理员可能无法跟踪网络上发生的一切。攻击者总是会利用这种信息为自己获利。他们总会在网络和安全管理员未察到的期间进行攻击。


    4. 攻击通常缓慢进行，无法被轻易检测。


    5. 攻击也可能在下班后进行，这意味着网络和安全管理员可能不在场跟踪网络内发生的活动。


    要了解更多关于黑客如何渗透这些网络的信息，你可以关注讨论黑客的杂志，这些杂志每月至少出版一、两次。大多数黑客都从错误中学习。当他们犯错时，他们总是知道自己离进入特定网络又近了一步。他们总是利用所获得的知识来规划未来的攻击。作为一名道德黑客，你也必须从自己的错误中学习。


    ### 管理匿名性

    聪明的黑客想要确保他们的身份被隐藏。黑客优先考虑隐藏踪迹。黑客的成功取决于他们是否被察觉。他们不应该引起任何形式的怀疑，以便未来能够随心访问系统。黑客使用的一些资源包括：


    1. 雇主或朋友拥有的 `VPN` 账户

    2. 商场、学校或图书馆的公共计算机

    3. 代理服务器

    4. 开放无线网络

    5. 匿名电子邮件账户

    6. 不安全的计算机

    7. 开放的电子邮件中继


    如果黑客制定了一份良好的计划，他们就不会被轻易追踪。


    ## 第 3 章：制定黑客计划

    本章将关注以下领域：

    - 制定道德黑客目标

    - 选择测试的网络

    - 检查某些黑客工具


    作为黑客，在开始黑客过程之前必须制定计划。计划将确保你能够轻松渗透网络，并对你所做的充满信心。由于执行黑客非常严肃，制定一份良好的计划是好的。你可以从在计算机上测试程序开始，同时概述、记录并定义你的目标。确保你已经确定了测试标准，并识别和收集有助于促进整个黑客过程的工具。在本章中，你将获得一个指南，介绍如何创建一个良好的黑客环境以增强你进入网络时的成功率。作为一名道德黑客，在实施你制定的攻击计划之前，应该获得客户和管理的批准。


    ### 建立你的目标

    作为黑客，你的目标应该相应概述。作为道德黑客，你可能的主要目标包括研究网络中存在的漏洞，因为重点是确保它变得更安全。帮助你概述目标的一些步骤包括：


    1. 定义一些特定目标。将你的所有目标与业务目标对齐。查看管理层在整个过程结束时想要什么。


