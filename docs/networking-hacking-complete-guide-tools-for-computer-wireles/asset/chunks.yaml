    ## 2. 自动化评估


    手动评估在您想要学习时特别适用，然而，主要问题是大多数人没有时间处理所有这些手动步骤。你可以自动扫描漏洞。还有许多漏洞评估工具可以使用可以使用，它们在 `UNIX`
    和 `Windows` 等平台上可用。你也可以在无线和有线网络上使用这些评估工具中的某一个。在使用这些工具时，你还可以绘制一张业务逻辑图。软件人员也可以使用其中一些工具来测试他们的代码行是否存在不同的缺陷。使用这些工具的主要问题是，它们只扫描单个漏洞。


    如今，某些工具支持事件关联，可以一次性扫描多个漏洞。你可以用来扫描漏洞的工具包括 `QualysGuard Suite`。这些工具可以用于扫描端口，同时寻找任何存在的漏洞。此外，如果你使用
    `QualysGuard Suite`，则不需要电脑，因为该工具以 `SaaS`（软件服务）的形式提供。你可以随时登录 `Qualys` 网站并注册账户。你需要支付一定的费用，因为该工具是用于商业目的。然后你输入需要测试的特定
    `IP` 地址。你也可以将 `QualysGuard Suite` 安装到你的网络中，它随后将扫描所有内部系统。评估可以进行计划，系统将在运行测试的同时生成一些详细报告。报告将包含一些有关扫描的通用信息。现有漏洞的细节也将列出。当使用如
    `QualysGuard Suite` 等工具评估网络中存在的漏洞时，你必须具备一些后续专业知识，因为你不能仅仅依靠扫描结果。漏洞报告应该经过验证。你应该全面研究这些报告，并对系统进行批判性测试。


    ### 渗透系统


    你可以通过以下方式识别你网络中的某些安全漏洞：


    1. 确保你已经获取了关于宿主机和当前存在数据的足够信息。

    2. 确保存在远程命令提示符。

    3. 启动或停止某些应用程序。

    4. 访问不同的系统。

    5. 禁用不同的安全控制。

    6. 截屏。

    7. 访问某些敏感文件。

    8. 以管理员身份发送电子邮件。

    9. 执行一些 `SQL` 注入攻击。

    10. 发起 `DoS` 攻击。

    11. 上传文件以证明你的胜利。


    你可以使用 `Metasploit` 框架利用某些漏洞。这些漏洞中的某些允许你完全渗透系统。你需要决定是否想要完全渗透你的系统，并确保你已经证明了某些漏洞。


    ## 第 5 章：社会工程学


    在本章中，重点将放在以下领域：

    - 社会工程学

    - 社会工程学的后果

    - 学习更多不同的社会工程技术

    - 如何保护你的组织免受社会工程学的攻击


    社会工程学是一种利用组织内部某些弱环节的技巧。重点通常在安全防御上。社会工程学可以比作“人肉破解”。它涉及对人类拥有的信任性的恶意利用。黑客确保他们可以获取一些个人信息，并将其用于利。社会工程学的主要问题是它需要大量时间，而且人必须熟练，因为他们面对的是完全陌生的人。在本章中，重点将社会工程学的后果。我们还将介绍一些保护你的组织免受社会工程攻击的方法。


    ### 关于社会工程学


    恶意用户通常伪装成其他人，以便获取通过其他手段无法的个人信息。他们可以使用已访问的信息来入侵特定网络。他们访问的信息允许他们偷取和删除不同的文件。恶意用户还可以进行其他形式的欺诈。社会工程学与物理实施的各种利用也不同。一些众知的物理利用包括翻垃圾桶（dumpster
    diving）和窥视屏幕（shoulder surfing）。不同的社会工程学示例包括：


    - **虚假支持人员**：他们通常声称必须在目标计算机上安装某些新软件版本。他们通常诱导用户以便他们可以下载软件。之后，恶意用户就可以远程访问网络。

    - **虚假供应商**：他们声称需要更新特定系统，并向你要管理员密码以便他们也能获得完全访问权限。

    - **钓鱼邮件**：此类邮件通常由外部黑客发送。他们主要收集各种形式的信息，包括目标用户的 ID 和密码。密码随后可以被用于访问目标的银行账户等。有时，外部攻击者可以执行跨站脚本。关于
    Web 应用安全的讨论也将在后续章节中出现。

    - **虚假员工**：在大多数情况下，他们通常联系保安台并编造各种谎言。他们可能会说他们落了钥匙，无法进入机房。随后他们将获得一把钥匙并进入机房。之后，他们可以获取有关组织的一系列电子和物理信息，网络就会变得脆弱。


    '
- fmt: '

    At times, social engineers pose as well-knowledgeable employees. For instance,
    they can act as managers or even executives. They may even go ahead and pose as
    naïve employees. Some of the roles that they can assume include acting as maintenance
    individuals and IT consultants. The social engineers also fit into different roles.
    They always switch into different modes depending on the people that they are
    dealing with.


    Effective information security involves making sure that the organization is not
    prone to social engineering attacks. To ensure that your organization is not prone
    to such attacks, you need to keep track of all your users. Some of the measures
    that can be deployed include making sure that there are firewalls, encryption
    and intrusion detection systems. Organizations can secure their information through
    the mentioned techniques. If an external attacker manages to get past all these
    defense systems the network within your organization will be vulnerable.


    Social engineering requires great skill, and it is highly dependent on a person’s
    personality and the knowledge that they possess about the target organization.
    If social engineering does not occur naturally for you, you should first need
    to learn more about this art. You can also hire a third party who can help to
    gather information about the target organization. After learning more about social
    engineering, you can devise certain techniques that will come in handy when ensuring
    that your organization’s network is secure.


    Social engineering can also harm the reputation of certain individuals since it
    involves a collection of people’s personal information. The reputation of different
    people may be at stake since the external hackers will focus more on obtaining
    some confidential information about these people. It is good to proceed with caution
    and that you should have thought about the consequences of your actions before
    you can act.


    There are numerous ways through which you can conduct a social engineering attack.
    In this book, we will not focus on training people about how to carry out social
    engineering attacks. The main focus will be on some of the social engineering
    techniques that have proven to be fruitful as in the case of different external
    attackers. You can also use some of these techniques so that they may suit your
    situation depending on your needs.


    If you want to carry out some of these techniques within your organization, you
    may want to act as an outsider, but the main issue may be that most of the people
    within the company know you. Recognition is a major risk. In some instances, it
    is good to outsource some of these services from trusted individuals so that they
    can conduct some of these tests on your behalf. The individuals handling the testing
    process should also be trusted. If you are seeking the services of an outsider,
    you may start by seeking references. After that, background checks may come in
    handy.


    ## Reasons Why External Attackers Use Social Engineering


    Most of the external hackers use social engineering attacks because they can.
    They want to make sure that the network hacking process is as easy as possible.
    When a social engineer is determined to hack into a network, they will get past
    the access controls, firewalls, and each of the present authentication devices.
    In most cases, social engineers act slowly since they want to avoid getting caught.
    Also, they do not want to raise any form of suspicion. The social engineers will
    always gather small bits of information progressively and they will use all this
    information to create a bigger picture depending on the type of attack that they
    are planning.


    It is possible to carry out a personal attack through an e-mail or a phone call.
    The methods used during a social engineering attack normally depend on the abilities
    of the attacker. Social engineers are also conversant with the fact that some
    of these organizations do not have formal data classifications, incidence response
    plans, access control systems, and security awareness programs. They will always
    take advantage of such weaknesses, and they will exploit them to their advantage.


    Social engineers also possess some bits of information about the organization
    both internally and externally. The knowledge they possess helps them to facilitate
    each of these attacks. When a social engineer gathers a lot of information about
    an organization, they can easily pose as employees or any other trusted individuals
    within the organization. The knowledge that a social engineer possesses will give
    them an upper hand and will have an in-depth understanding of how the employees
    within the organization operate.


    ## Understanding the Consequences of Social Engineering


    Many organizations have competitors. Some of these competitors may turn into enemies
    at some point; these enemies may also see it fit to cause some trouble through
    social engineering. Besides competitors, the enemies may also be in the form of
    former employees or people currently working within the organization. At times,
    a hacker may carry out a social engineering attack since they want to prove their
    expertise. Regardless of the person causing the trouble, the main factor to consider
    is that each organization is always at risk.


    The Internet can facilitate the information gathering process while also facilitating
    different types of attacks. The most vulnerable companies are the widespread ones;
    nevertheless, the networks in smaller companies may also be attacked. Each of
    the employees within the organization may also be victims of social engineering
    attacks regardless of their position within the organization. As for the help
    desk employees, they are highly vulnerable since they are tasked with issuing
    different pieces of information.


    All social engineering attacks have different consequences. The main objective
    of the attack is to gather the information that will also be used to attack the
    network in an organization. A social engineer can effectively gather the following
    bits of information:


    * User passwords

    * Security badges that can be used to access the computer room

    * Intellectual property

    * Confidential financial reports

    * A list of consumers and sales prospects


    If any of the listed pieces of information is leaked, the company may undergo
    some financial losses, employees may be demoralized, there will be some regulatory
    and legal compliance issues, and clients may also lose their trust in the specific
    organization.


    Social engineering attacks are not easily documented and that is why they cannot
    be easily prevented. The main issue about social engineering attacks is that a
    lot of methods can be used. The firewalls also create a sense of security that
    is false. As for social engineering, you can never predict the specific method
    that will be used by the attackers. The best step to take is making sure that
    you have remained vigilant while also trying to understand the methods used by
    external hackers. By doing so, you can raise some awareness within the organization.


    ## Carrying Out Social Engineering Attacks


    The process of carrying out a social engineering attack is quite simple. Social
    engineers need to look into some of the organizational processes and also the
    information systems before they can go ahead and perform an attack. When an attacker
    has such pieces of information, they can go ahead and formulate their goals since
    they will be having a sense of direction. The steps used by social engineers during
    the attack process are as follows:


    1. Perform some research

    2. Build trust

    3. Exploit some relationships to gain different pieces of information

    4. Use the information that has been gathered to engage in some malicious attacks

