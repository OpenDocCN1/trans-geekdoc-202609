- fmt: "\n# Cracking Passwords\n\nThe external attackers enjoy the password hacking\
    \ process. They mainly enjoy the sense of exploration that is present during the\
    \ password cracking process. Although you may not be interested in exploring the\
    \ passwords of numerous individuals, it is good to approach the hacking process\
    \ using such a mindset. After obtaining one password, it is easy to gain access\
    \ to other multiple passwords that can allow you to access the network easily.\
    \ Most attackers will mainly target the root and administrator passwords. The\
    \ administrator passwords are important since they will grant the external attackers\
    \ more access to the network. As long as you have administrative access, you can\
    \ manipulate and access anything on the network. When you are looking for the\
    \ password vulnerabilities within the organization, always start by testing the\
    \ high access levels such as the network administrator. Most of the attackers\
    \ will use such a tactic. You can exploit the system in different ways. You can\
    \ use high and low tech methods. Some of the low tech methods are as follows:\n\
    \n## Low Tech\n\n### Social Engineering\nThis is a low-tech method and it is also\
    \ very popular when it comes to gathering passwords. The social engineering topic\
    \ has already been covered in previous chapters. As for social engineering, it\
    \ focuses on exploiting the trusting nature of people. After gaining access to\
    \ the passwords and other pieces of information, an attacker can go ahead and\
    \ use such information for their own personal gain.\n\n**Techniques:** To access\
    \ a password when using social engineering, you just have to ask for it. Since\
    \ the technique involves manipulation, you just pose as an employee within the\
    \ organization and ask for the password using an email or any other technique.\
    \ At times, the users can issue their passwords to the individuals responsible\
    \ for the security testing process. Passwords should always be reset after the\
    \ testing phase is over. After resetting the passwords, you will not be accountable\
    \ for any information that may be lost within the network afterward.\n\n**Countermeasures:**\
    \ Ensure that you have brought about awareness through security training programs;\
    \ that way, you can easily ensure that the attacker cannot gather any information\
    \ through social engineering. The individuals who have access to the network should\
    \ be trained on how they can spot attackers. For instance, they should know that\
    \ attackers make use of fake phone calls and spam emails. They should ignore each\
    \ of these emails. It is also good to notify the security administrator about\
    \ any suspicious activity such as the presence of some suspicious phone calls.\n\
    \n### Shoulder Surfing\nThis is a technique that involves looking over a person’s\
    \ shoulder. The attacker will mainly do so in a bid to gain access to the passwords\
    \ being used to access the network.\n\n**Techniques:** To coordinate such an attack,\
    \ the attacker should be close to the target and they will try to conceal their\
    \ hidden motives. They will collect the password by monitoring the keyboard and\
    \ the screen of the users as they log in into the network. An external attacker\
    \ that has a good eye will easily gain access to the password. Shoulder surfing\
    \ is quite easy and you can also try it on your own.\n\n**Countermeasures:** Always\
    \ encourage the users to be on the lookout so that an external attacker cannot\
    \ gain access to their passwords. They should not key in their passwords whenever\
    \ they spot some strange activities within their environment. If a person is looking\
    \ over your shoulder, you should have dismissed them politely. Make sure that\
    \ they cannot see your password as you type it.\n\n### Inference\nIt is the situation\
    \ whereby the attacker can guess the passwords depending on the information that\
    \ they have gathered about the users. Some of the details include the date of\
    \ birth, phone numbers, and even favorite television shows. The main issue with\
    \ the external attackers is that they are very determined to achieve their goals.\
    \ The best defense mechanism is to educate the users appropriately about the creation\
    \ of secure passwords that do not also relate to some personal information such\
    \ as the date of birth. The users should also be reminded constantly about the\
    \ importance of secure password creation.\n\n## Weak Authentication\nMalicious\
    \ users and external attackers will try to obtain passwords through different\
    \ means. They may also take advantage of some of the past operating systems since\
    \ they do not require any passwords during the login process. Some phones are\
    \ not secured using passwords.\n\n## High Tech\n\n### High-Tech Password Cracking\n\
    High-tech password cracking entails the use of different programs to guess the\
    \ passwords that can be used to access the network. The tools ensure that it is\
    \ possible to come up with different password combinations. Some of the high-tech\
    \ techniques are used to access database files that are protected by passwords.\
    \ The major password cracking techniques include brute-force attacks, dictionary\
    \ attacks, and rainbow attacks.\n\n### Hacking WPA2 Wi-Fi\nThe techniques used\
    \ to crack the `WPA2` networks have not changed over the years. The latest techniques\
    \ require you to interact less and make sure that you are well-informed as compared\
    \ to some of the previous techniques. You can also access various networks although\
    \ they may not be connected. `WPA2` network can be accessed using the `PMKID`.\
    \ Some of the tools that you can use include `Hashcat`. The tool will enable you\
    \ to crack the `WPA2` Wi-Fi passwords. Also, when using such tools, you can easily\
    \ identify some the networks that have weak passwords.\n\n#### Old Techniques\
    \ Used to Crack WPA2 Passwords\nThe old techniques have been used for many years\
    \ and you should disconnect a connected device momentarily from the access point\
    \ that you want to crack. As a hacker, you have to understand some of essential\
    \ points. The main challenge is that someone must be connected to the network\
    \ so that you may launch an attack. The password that has been used should also\
    \ be weak so that the attacker may break in. If there is no connected device,\
    \ it will be hard to connect to the network since you will lack the opportunity\
    \ to capture handshake, and that is why you will be unable to hack the network.\
    \ The other challenge of such technique is that it is legally troubling and noisy.\
    \ You will be forced to send some packets intentionally that you may disconnect\
    \ an authorized user from the network. You will be launching `DoS` attack, and\
    \ as a result, the network will be jammed. You may also get into trouble since\
    \ you can easily caught.\n\n#### New Methods Used to Hack WPA2 Wi-Fi\nInstead\
    \ of trying to intercept the two-way communication that is present between Wi-Fi\
    \ devices so that you can crack the password, the attacker can use new techniques\
    \ to communicate directly with the access point. Some of the tools that can be\
    \ used by attackers include `Hashcat`. The tool can be used to launch brute-force\
    \ attack, and it mainly collects information. As always, the attacker needs to\
    \ be close to the Wi-Fi network that they planning to attack. The main objective\
    \ will be to use a compatible wireless adapter, and it will be possible to gain\
    \ access to certain information. The wireless attack has also proven to be more\
    \ efficient compared to `aircrack-ng` and `aireplay-ng`.\n\n#### Using hcxtools\
    \ and Hashcat\n`hcxpcaptool` and `hcxdumptool` are tools that are used to carry\
    \ out penetration testing on Wi-Fi networks and also carrying out audit. When\
    \ using these tools, you can easily capture handshake and `PMKID` hashes. Minimal\
    \ arguments are required when launching an attack when using the command line.\
    \ The tool can also be run against some convenient targets. Devices such as `Raspberry\
    \ Pi` can also be used although they do not have screens. After capturing the\
    \ `PMKID`, the hash should be loaded into `Hashcat` in a bid to crack the `WPA2`\
    \ Wi-Fi password. The `hcxpcaptool` is used to convert the `PCAPNG` file to a\
    \ version that can be compatible with `Hashcat`. The brute force attempts can\
    \ then take place. When using this technique, the success rate is not as high\
    \ depending on the complexity of all the passwords on the targeted `WPA2` networks.\
    \ \n\n## What Do You Need?\nWhen performing such attack, you have to use `Kali\
    \ Linux`. Also, you should be able to access a wireless adapter and it should\
    \ support packet injection and monitor mode. Many guides come in handy when you\
    \ are trying to select a compatible wireless adapter. Apart from the network adapter\
    \ offered by `Kali Linux`, the system should be fully updated and upgraded. Failure\
    \ to do so, you will find that some packages are out of date and some issues encountered.\n\
    \n### Step 1: Install Hashcat and hcxtools\nFirst, you should install the tools\
    \ that you need. To download the necessary tools, key in the following text on\
    \ the terminal:\n```bash\nsudo apt install hashcat hcxtools\n```\nAfter the installation\
    \ process is complete, you will then install `hcxtools`. To do so, open the terminal\
    \ window and paste everything line by line. If an error occurs, type `sudo` before\
    \ the text. You will then install `Hashcat`. Make sure that you have installed\
    \ the latest version of `Hashcat`.\n\n### Step 2: Preparing the Wireless Adapter\n\
    After you have plugged in the wireless adapter, you can find the names of the\
    \ `WPA2` networks by typing `ip a` or `ipconfig`. The network names usually vary.\
    \ First, make sure that the card has been put into wireless monitor mode. You\
    \ will then be able to listen to Wi-Fi traffic. You should type the following\
    \ commands into the terminal window and you should also substitute the name of\
    \ the wireless adapter:\n```bash\nhcxdumptool -i wlan1 -o galleria.pcapng --enable_status=1\n\
    ```\nThe name of the wireless adapter may also be `wlan1`. It helps to save PMKIDs\
    \ that have been captured and they are saved in a file known as `galleria.pcapng`.\
    \ The status value can be specified.\n`warning: Network Manager is running with\
    \ pid 555`\n`warning: wpa_supplicant is running with pid 611`\n`warning: wlanmon\
    \ is probably a monitor interface`\n`start capturing (stop with ctrl+c)`\n`INTERFACE:\
    \ wlanmon`\n`FILTERLIST: 0 entries`\nThe wireless network adapter should also\
    \ be in the monitor mode.\n\n### Step 3: Use hcxdump When Capturing the PMKIDs\
    \ That Are From the Local Networks\nYou can capture the PMKIDs of the devices\
    \ that you want to try to attack. Some of the commands that you can execute include:\n\
    ```bash\nhcxdump --i wlan1\n```\nAfter gathering enough information, you can end\
    \ the attack. A `PCAPNG` file will then be produced and it will contain all the\
    \ information you need to facilitate the brute-force attack. The information should\
    \ also be converted into format easily understood by the `Hashcat` tool.\n\n###\
    \ Step 4: Using hcxpcaptool to Convert the Dump for Hashcat\nThe `hcxpcaptool`\
    \ is used to convert the `PCAPNG` file. A few arguments are also specified. In\
    \ the same folder where the `PCAPNG` files are saved, you should key in the following\
    \ commands in the terminal window:\n```bash\nhcxpcaptool -r galleria.pcapng -o\
    \ galleriaHC.16800\n```\nAfter running the command, the terminal window will showcase\
    \ the following pieces of information: The context shows that you have gathered\
    \ at least 21 PMKIDs within a short period. The `galleriaHC.16800` file can now\
    \ be used to crack the network passwords.\n\n### Step 5: Select a Password List\
    \ and Use the Brute Force With Hashcat\nWhen you start attacking the Wi-Fi networks\
    \ that you have managed to capture, you must start by picking a good password\
    \ list. After picking a good password list, you can put all the passwords in a\
    \ similar folder with the `.16800` file after you have converted it. You should\
    \ then run the following commands in the terminal window:\n```bash\nhashcat -m\
    \ 27000 galleriaHC.16800 wordlist.txt\n```\n`Hashcat` should be started in the\
    \ `16800` mode. The attack on the `WPA-PMKID-PBKDF2` network protocols will then\
    \ be attacked. You should also specify the name of the files that you need to\
    \ crack which in this instance we using `galleriaHC.16800`. The `--force` option\
    \ will then ignore any warnings that appear when proceeding with the attack. The\
    \ brute force attack is quite effective and in this context we using `toppass.txt`.\
    \ The time needed to complete the attack depends on the size of password list\
    \ and hardware. To see updates, you should always press `S`.\n\n### Step 6: Interpreting\
    \ the Results\nAs `Hashcat` tries to crack passwords, you can also check the progress.\
    \ As password list comes to end, `Hashcat` adjusts the workload and you will get\
    \ a final report. If you have managed to crack some passwords, you will notice\
    \ all of them.\n\n## Password-Cracking Tools\n\nYou can use different tools to\
    \ crack the passwords and operating systems in different organizations. Some of\
    \ the renowned cracking tools include:\n\n### Cain & Abel\n`Cain & Abel` password\
    \ recovery tool is meant for the operating system. It allows people to recover\
    \ passwords since the tool sniffs a network of your choice. It also cracks passwords\
    \ using dictionary attacks, brute force, decoding passwords, revealing password\
    \ boxes, recovering wireless keys, analyzing routing protocols. The latest version\
    \ of `Cain & Abel` also has features including `APR` and enables a person to sniff\
    \ on the switched area networks. It also cracks passwords including `HTTPS`, specific\
    \ authentications, password decoders, and utilities related to network security.\n\
    \n**Who Should Use Cain & Abel Tool?** The specific target audience for `Cain\
    \ & Abel` is network administrators, penetration testers, teachers, forensic staff,\
    \ and security vendors.\n\n**Requirements:** To successfully install `Cain & Abel`,\
    \ your system should have the following:\n- A hard disk space of at least10MB\n\
    - Microsoft Windows XP/2000/Vista\n- `Winpcap` Packet Driver\n- `Aircap` Packet\
    \ Driver\n\n**Installation:** You should start by downloading `Cain & Abel`. Run\
    \ the executable file and follow each of the installation instructions.\n\n###\
    \ Brutus\n`Brutus` is a popular tool used to crack passwords. It is quite flexible\
    \ and fast. The password cracking tool is also free of charge and can only be\
    \ used on the Microsoft operating systems. It supports the following formats:\
    \ `POP3`, `HTTP (Form, HTML)`, `CGI`, `SMB`, `FTP`, `IMAP`, `Telnet`, `NetBus`,\
    \ and `NNTP`. You can also create your authentication types. The tool is also\
    \ widely known since it supports multistage authentication engines. You can also\
    \ resume and load different options after pausing some of the current activities.\n\
    \n### RainbowCrack\nThe password cracking tool cracks passwords at a fast rate\
    \ compared to other tools used to launch brute-force attacks. The tool makes use\
    \ of large memory in the form of a computational process that calculates the hash\
    \ pairs and plain text. `RainbowCrack` uses selected hash algorithms. After the\
    \ computation process is over, the results appear under rainbow table. The process\
    \ takes a lot of time. After the table is ready, you can crack any `WPA2` network\
    \ passwords fast compared to when you are using brute force tools. You have to\
    \ come up with rainbow tablets individually. The people who developed `RainbowCrack`\
    \ had generated the `NTLM` and `LM` rainbow tables. Other tables that were also\
    \ produced include `Sha 1` and `MD5` rainbow tables. The tables are also available\
    \ for free and come in handy during the password cracking process. This tool is\
    \ available for both Linux and Microsoft Windows systems.\n\n### Wfuzz\n`Wfuzz`\
    \ is also used to crack passwords. The tool makes use of brute-force attack. It\
    \ can also be used to find some of hidden resources including scripts, directories,\
    \ and servlets. The tool can also be used to identify different types of injections\
    \ including `XSS Injection`, `SQL Injection`, and `LDAP Injection` in different\
    \ web applications. Major features of the `Wfuzz` tool:\n- Post, headers and authentication\
    \ data brute-forcing\n- Capability of injection via multiple points with multiple\
    \ dictionary\n- Time delay between requests\n- Proxy and `SOCK` Support, multiple\
    \ proxy support\n- Output in colored HTML\n- POST and GET brute-forcing\n- Brute\
    \ force HTTP password\n- Multi-Threading\n- Cookies fuzzing\n\n### John the Ripper\n\
    `John the Ripper` is a password cracking tool that is very popular for Linux systems.\
    \ It is used to crack passwords by various methods. The tool supports many types\
    \ of hashes and can be updated regularly. It is also open-source. You can use\
    \ it to crack the Linux passwords. John the Ripper is a powerful tool and far\
    \ as it is.\n"
