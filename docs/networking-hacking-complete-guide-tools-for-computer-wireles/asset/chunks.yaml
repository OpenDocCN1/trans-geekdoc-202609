    # Chapter 7: Passwords


    In this chapter, the discussion will revolve around the following areas:

    - Looking into the password vulnerabilities

    - Examining password hacking techniques and tools

    - Hacking files that have been protected by passwords

    - How to protect the system from password hacking


    A hacker can easily gain access to a network through password hacking. They will
    focus more on the user administrator passwords so that they can easily access
    the entire network. Some people use strong passwords; a hacker who is determined
    to hack the passwords regardless of the time it will take to crack the password.
    In a security chain, a password is the weakest link. In most cases, the passwords
    rely on secrecy. Once the password is compromised, many people can easily access
    the network. It is good to make sure that you are accountable for all your passwords.


    External attackers can hack your passwords using different techniques. They can
    access your passwords by asking for them. They can also carry out shoulder surfing.
    In some instances, the attackers can also use password cracking software. To obtain
    passwords, the external attackers will make use of keyloggers and network analyzers.
    In this chapter, you will realize how external attackers can easily gain access
    to your passwords by penetrating your network. Some of the password vulnerabilities
    will also be mentioned and the suitable countermeasures will also be outlined.
    The countermeasures will ensure that external attackers cannot easily exploit
    your system. If you carry out some of the vulnerability tests and also implement
    the mentioned countermeasures, you will be able to secure the passwords that can
    be used to access your network.


    ## Password Vulnerabilities


    After balancing the cost of the security and the value of the information within
    your company, the passwords being used within the company will be adequate. Passwords
    will issue a false sense of security. The attackers will always try to crack the
    passwords when they are trying to penetrate the network. The main issue about
    relying on passwords to secure valuable pieces of information is that many people
    will have access to the password. The main issue is that you cannot know a person
    fully. Also, although a person may know the passwords, they may not be authorized
    users. There are also two classifications of password vulnerabilities and they
    include:


    1. **User Vulnerabilities**: This classification entails the lack of policies
    that are meant to protect the passwords. Additionally, the lack of security awareness
    is also not advisable.

    2. **Technical Vulnerabilities**: This involves the use of encryption methods
    that are weak. Also, the passwords may also be stored unsecurely.


    Securing the physical environment is also among the best ways to protect the network
    passwords. The technique was working well. The main issue is that nowadays computers
    also have network connectivity and the physical security is now gone.


    ## Organizational Password Vulnerabilities


    Convenience matters a lot especially if a person has to remember numerous passwords
    at a go. The passwords are hard to maneuver and external attackers experience
    many challenges during the password cracking process. The main advantage that
    attackers have is that people normally come up with passwords that they can remember
    easily. They always come up with different combinations until they come across
    the correct password. After that, they can access the network easily.


    The users should be educated and also reminded about the importance of using strong
    passwords. The main problem is that some users come up with passwords that are
    easy to guess. Users rarely change their passwords. The passwords are reused to
    secure numerous points within the network. After an attacker gains access to a
    password hat has been reused, they can access many points within the system. They
    may be written down in places that are not secure. Difficult passwords cannot
    be easily cracked. The main issue is that when a person comes up with a complex
    password, there is a high likelihood that they will write it down. When the attackers
    gain access to these passwords, they will go ahead and use such information against
    you.


    ## Technical Password Vulnerabilities


    After exploiting some of the organizational password vulnerabilities, you may
    also find some technical vulnerabilities and they include:


    - **Weak password encryption schemes**: The hackers can use some strong mechanisms
    to crack weak passwords. In this chapter, we will also discuss more about some
    of the techniques used by external attackers to crack passwords. There are many
    vendors who believe that passwords are usually safe as long as they have not published
    the source code that they have used during the formulation of the encryption algorithms.
    Some of the patient hackers who are also persistent will take their time to crack
    each of the security protocols as fast as they can. After cracking the code, they
    will take advantage of the weak encryption.

    - **Programs that normally store the passwords in unsecured files and databases
    that are easily accessible.**

    - **The user applications that normally display the passwords on the screens when
    a person is typing.**

