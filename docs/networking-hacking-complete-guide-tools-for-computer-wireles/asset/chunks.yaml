    # 引言


    恭喜你下载《网络黑客》（Networking Hacking）。我很高兴你选择通过我们的手册学习网络黑客知识。在手手册中，重点将放在网络黑客上。你将学习更多不同的黑客技术，这些技术可以用来访问特定的网络。我们还将讨论如何发现某些安全漏洞，以及如何修复网络中存在的某些缺陷。


    黑客分为两种：白帽黑客和黑帽黑客。白帽黑客从事道德黑客。本文的重点将是道德黑客。计算机和网络安全是一个非常复杂的学科。你应该始终领先一步，以确保你的网络没有被外部攻击者非法访问。本文还将概述一些用于确保网络安全的工具和技术。确保网络安全的最好方法是理解外部攻击者的思维模式。你可以利用你所得的知识来保护你的网络。


    本文中的道德黑客行为还将更多地关注白帽黑客或安全专家使用的某些渗透技术。我们还把更多地关注漏洞测试。其中一些测试可以帮助你识别网络中存在的某些安全缺陷。这些漏洞也可以被封堵，以确保外部攻击者无法访问网络并获取他们用于获利的各种类型的信息。有时，你不需要对预算非常严苛，而是要看它对你生活的影响。


    # 第 1 章：计算机网络基础


    网络黑客是指不断操纵特定网络连接行为的技术努力。负责网络黑客的人被称为黑客。黑客被视为一种建设性的技术工作，并不完全基于计算机系统的基础。黑客通常与恶意程序相关，这些程序被用于通过互联网攻击不同的网络。


    ## 关于黑客的起源


    “Hacking”一词起源于 20 世纪 50 年代和 60 年代在麻省理工学院（M.I.T.）的一些工程师。这些黑客甚至会破解大型机计算机。麻省理工学院以外的人也开始黑客。后来，互联网和计算机网络获得了一定的普及，从事黑客活动的人数剧增。大多数从事黑客活动的人从小就开始此类活动。


    ## 常见的网络黑客技术


    在执行网络黑客操作时，人们利用脚本和不同的网络软件。网络软件是专门设计的，用于操纵通过特定网络的各种形式的数据。黑客可以获取一些信息，让他们能够更多地了解特定系统是如何运行的。网上发布了许多脚本，任何人都可以访问。寻找预包脚本的人是初级黑客。大多数高级黑客都会努力研究每一个脚本，并可以根据自己的意愿修改它们。有很多技能丰富的黑客，他们被商业公司聘佣以保护公司内部的软件使其无法被未经授权的人员访问。


    除了黑客，还有其他渗透技术，包括创建 `DoS`（拒绝服务）攻击和蠕虫。采取了不同的措施，以确保计算机和网络不受网络钓鱼、恶意软件和特洛马的影响。


    ## 黑客技能


    要成为一名专业的黑客，你应该具备某些性格特质和技术技能：


    - 你必须能够处理数字。黑客活动涉及阅读大量的代码、数据和各种算法。

    - 你必须具备逻辑推理和记忆力，因为在策划攻击时，必须整合细小的细节和事实。

    - 你必须有耐心。黑客过程非常复杂，你可能花费大量时间尝试制定一个可执行的计划。


    网络指南重要的主要原因是：

    - 学生可以更多地了解网络的优势。

    - 它有助于学生在进入网络开发阶段阶段时地进行规划。

    - 它还提供了一个标准的网络 `model`。


    # 网络基础


    计算机网络由一组连接在一起的计算机和其他设备组成，它们还相互通信。下图展示了一个网络示例，由一个连接计算机到互联网以及各种服务器的局域网组成。


    ![](img/rsrc5Y.jpg)


    网络有两种类型，如下：


    1. **点对点网络 (Peer-To-Peer Networks)**：它们通常实现在少于 10 台计算机的区域，不一定采用严格的安全措施。每台计算机具有相同的状态，它们很容易相互通信。共享不同的文件，包括电子表格和文字处理文档可以在整个网络共享。此外，网络上的每台计算机都共享相同的设备，包括扫描仪和打印机。

    2. **客户端/服务器网络 (Client/Server Networks)**：它们非常适合较大的网络。有一台中心计算机作为 `server`。它存储整个网络共享的所有应用程序和文件。与普通计算机相比，服务器拥有更多的功能。它可以控制连接到网络的计算机的访问。普通计算机通常供学校的老师和学生使用，而网络管理员可以访问整个服务器。


    ## 网络组件


    网络由以下组件组成：


    - 至少两台计算机。

    - 用于连接计算机彼此的电缆。

    - 每台计算机都将有一个网络接口设备。

    - 一个用于将数据从一个点切换到另一个点的 `Switch`。

    - 一种网络操作系统软件。


    '
- fmt: '

    # Structured Cabling

    The most popular cabling techniques include the thin coax and the twisted-pair.


    ## Hubs and Switches

    These are devices used to connect a computer to a network. The hub usually directs
    information around the network and it also facilitates communication between all
    the connected devices. The switch is classified as a ‘smart hub’. The switches
    and hubs connect all the devices.


    When using `switches`, you can ensure that you have gotten a “dedicated bandwidth”
    while also operating at full speed. The hub usually shares the bandwidth across
    different connections and the activities from one PC can lower the Internet connection
    on the hub.


    ## About Wireless Networks

    The term ‘wireless network’ normally refers to many computers that are communicating
    with each other using a standard network protocol and no cabling present. The
    computers can also use wireless radio signals while sending information from one
    network to another.


    ### A Wireless Local Area Network (WLAN)

    The network is made up of two primary components and they include a wireless card
    and an access point. It is possible to transmit information between two computers
    as long as they are close to each other.


    #### Advantages of a Wireless Local Area Network:

    * It is easy to add workstations.

    * It is possible to ensure that the areas where cabling is not possible can access
    the network.

    * The installation process is fast and also easy. No cabling through the ceilings
    and walls is required.

    * The network can also be accessed from anywhere as long as a person is within
    the access point.

    * It comes in handy especially when ensuring that portable networks have access
    to the network.

    * It is cheaper to install.

    * It possesses long term cost benefits.


    #### Disadvantages of a Wireless Local Area Network:

    * The data transfer rate is always slower depending on the number of computers
    that have been connected to the network.

    * Standards change regularly and the wireless cards may also need to be replaced
    after some time.

    * Lowering wireless bandwidths will lower the effectiveness of the network.

    * The security of the network cannot be guaranteed and some configuration must
    be carried out.

    * Devices can only operate within a limited distance from a certain access point.

    * A wired local area network also provides a backbone to the wireless local area
    network.

    * In a static environment, it is harder to achieve the long-term cost benefits.


    ## The Components of a Wireless Network

    There are numerous components used to configure a wireless local area network.
    Some of these components are also used when configuring a wired LAN. In both the
    wireless LAN and wired LAN, network adapter cards are used. The `wireless LAN
    PC card` normally contains a built-in antenna. It is then used to connect the
    computer to a surrounding wireless network. There is a slot where it should be
    inserted in the computer. It is also possible to connect a desktop computer to
    a wireless network.


    In a wireless network, there is the ‘access point’ and it has a similar function
    to the hub that is present in the wired networks. It normally receives and broadcasts
    a signal through an adapter card. The major difference between wireless and wired
    networks is that in a wireless network, the computers are connected using cables.
    As for the wireless network, there are no cables needed to formulate a connection
    between different computers. The network is made up of two primary components
    and they include a wireless card and an access point. It is possible to transmit
    information between two computers as long as they are close to each other.


    ## The Configurations of a Wireless Network

    A wireless network can be configured using a local area network or a peer-to-peer
    arrangement. `Peer-to-peer configuration` is termed as the most basic wireless
    network configuration. It normally relies on the use of wireless network adapters
    that are installed within the computers and they can easily communicate with each
    other. For the computers to connect, they should be within then transmitting range.
    If there are many computers connected, they should be close to each other. As
    for this type of network configuration, there is no network administration overhead.
    The configuration is mostly suitable for small installations.


    ## The Benefits of Wireless Configurations

    In a wired local area network, people take more time carrying out the cabling.
    As for the wireless configuration, it possesses the following benefits:

    1. The amount of work required to install the wireless local area network is minimal.

    2. The wireless network can also be accessed in areas where it would be difficult
    to carry out wiring. The network downtime is also minimized.

    3. When there is a wireless network, it is possible to stay connected to the network
    all the time regardless of the location of the equipment.

    4. The wireless network operates over in a spherical manner.

    5. It is possible to share documents over a wireless network.


    ### Additional Advantages of a Wireless Network:

    1. **Speed**: The network is quite convenient when it comes to sharing different
    files over the network. When a network is not available, documents can only be
    transferred from one point to another using flash disks and other physical mediums.
    When using physical mediums to transfer documents, the process is quite time consuming.

    2. **Cost**: There are numerous software programs and they are cost-effective.

    3. **Centralized Software Management**: When installing a network, it is possible
    to install the software on the file server and it can be used by all the computers
    that are connected in the network, meaning that the wireless network helps to
    save on time.

    4. **Resource Sharing**: It is possible to share resources on a network whereby
    numerous computers are connected.

    5. **Flexible Access**: People can access different files on any computer that
    has been connected to the specific network.

    6. **Security**: The files and programs on the network can be safegu using the
    “copy inhibit” feature. Passwords can also be used to safeguard different documents.


    ### The main challenges encountered when installing a network include:

    1. **Costs**: Although a wireless network is supposed to be cost-effective; however,
    the initial investment is costly since you will also have to hire a technician.

    2. **Administrative time is required**: A network should be maintained properly.
    A network administrator should be hired to handle such issues.

    3. **File server may fail**: A file server is quite susceptible in different ways.
    When the file server fails, the whole network cannot operate. Different files
    and programs may be lost in the process.


    ## About CISCO

    CISCO is a company that offers networking for the Internet. The company has been
    operational since 1984. The network was also established by two scientists who
    were studying at Stanford University. The networking solutions offered by CISCO
    are being utilized by different service providers as well as numerous small and
    medium enterprises. The networking solutions offered by the company normally connect
    computing devices, people, and computer networks. People can now connect with
    others while also sharing different pieces of information. A large percent of
    Internet traffic has also been traveling across the CISCO systems. The company
    has also been using the Internet to run its own business online from managing
    inventories to product orders. When using the Internet, CISCO can also keep track
    of the travel and staff expenses. When exploring different possibilities that
    can be beneficial to your business, you should opt for the CISCO systems since
    the company has a better understanding of how you can get your business online.
    By taking advantage of the experience and knowledge that CISCO possesses, you
    can enhance the progressive growth of your business.

