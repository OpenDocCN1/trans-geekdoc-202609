- fmt: '

    ## 2. Automated Assessment


    Manual assessments are suitable especially when you want to learn, however, the
    main issue is that most people do not have time to handle all these manual steps.
    You can scan for-vulnerabilities automatically. There are also many vulnerability
    assessments tools that you can use and they are available on platforms such as
    `UNIX` and `Windows`. It is also possible to use each of these assessment tools
    on both wireless and wired networks. When using these tools, you can also come
    up with a map of the business logic. The software developers can also use some
    of these tools to test whether their lines of codes have different flaws. The
    main issue when using these tools is that they only scan individual vulnerabilities.


    Nowadays, some tools enable event-correlation, and multiple vulnerabilities can
    be scanned at a go. Some of the tools that you can use to scan vulnerabilities
    include `QualysGuard Suite`. The tools can be used to scan ports while also looking
    for any present vulnerabilities. Also, there is no need to use a computer if you
    are using the `QualysGuard Suite` since the tool is available as a `SaaS` (Software
    as a Service). You can always log in to the `Qualys` website and sign up for an
    account. You will have to pay a certain amount of money because the tool is meant
    for commercial purposes. You will then key in the specific `IP` address that you
    need to test. It is also possible to install the `QualysGuard Suite` into your
    network, and it will then scan all the systems internally. The assessments can
    then be scheduled and the system will then run the tests while also generating
    some detailed reports. The report will contain some general information about
    the scan. The details of the present vulnerabilities will also be listed. When
    assessing the vulnerabilities that are present with a network using tools such
    as the `QualysGuard Suite`, you must have some follow-up expertise since you cannot
    solely rely on the results of the scans alone. The vulnerability reports should
    be validated. You should study the reports comprehensively and test the systems
    critically.


    ### Penetrating the System


    You can identify some of the security loopholes within your network through the
    following ways:


    1. Make sure you have obtained enough information about the host and the present
    data.

    2. Ensure there is a remote command prompt.

    3. Start or stop some applications.

    4. Access different systems.

    5. Disabling different security controls.

    6. Capturing screenshots.

    7. Accessing some sensitive files.

    8. Sending an email as an administrator.

    9. Performing some `SQL` injection attacks.

    10. Launching a `DoS` attack.

    11. Uploading a file to prove your victory.


    You can exploit some of the vulnerabilities using the `Metasploit` framework.
    Some of these vulnerabilities allow you to penetrate the system completely. You
    need to decide on whether you want to penetrate your system fully and to make
    sure that you have proven that some vulnerabilities.


    ## Chapter 5: Social Engineering


    In this chapter, the main focus will be on the following areas:

    - Social Engineering

    - The aftermath of social engineering

    - Learning more about different social engineering techniques

    - How to protect your organization against social engineering


    Social engineering is a technique meant to take advantage of some of the weak
    links within an organization. The main focus is normally on the security defenses.
    Social engineering can be likened to “people hacking”. It involves the malicious
    exploitation of the trusting nature that human beings possess. Hackers make sure
    that they can obtain some personal information, and they use it for their gain.
    The main issue with social engineering is that it takes a lot of time, and a person
    must be skilled since they are also dealing with total strangers. In this chapter,
    the main focus will be on the consequences of social engineering. We will also
    look into some of the ways through which you can protect your organization from
    social engineering attacks.


    ### About Social Engineering


    Malicious users normally pose as another person so that they may gain access to
    some personal information that they cannot access through other means. They can
    use the information they have accessed to hack into a certain network. The information
    they have accessed can allow them to steal and delete different files. Malicious
    users can also go ahead and commit other forms of fraud. Social engineering is
    also different as compared to different exploits that are carried out physically.
    Some of the well-known physical exploits include dumpster diving and shoulder
    surfing. Different examples of social engineering include:


    - **False support personnel**: They normally claim that they have to install some
    new software versions on the target’s computer. They normally lure the user so
    that they may download the software. After that, the malicious users can then
    access the network remotely.

    - **False vendors**: They claim they need to update a specific system and they
    will ask for the administrator passwords so that they may also gain full access.

    - **Phishing e-mails**: Such e-mails are normally sent by some external hackers.
    They mainly gather different forms of information including IDs and passwords
    of the target users. The passwords can then be used to access the bank accounts
    of the targets among other things. At times, the external attackers can carry
    out cross site scripting. A discussion about web application security will also
    come about in the forthcoming chapters.

    - **False employees**: In most cases, they normally contact the security desk
    and they can issue different lies. They may say that they have left their keys
    and they cannot access the computer room. They will then be issued a set of keys
    and they can go ahead and access the computer room. After that, they can access
    some sets of electronic and physical information about an organization and the
    network will then be vulnerable.

    '
