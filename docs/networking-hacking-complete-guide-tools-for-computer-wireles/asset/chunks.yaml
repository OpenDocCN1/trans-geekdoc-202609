    *   获取外部人员无法获取的某些信息

    *   提出一些奇怪的问题

    *   使用组织内部的俚语

    *   拼写某些单词


    一名专业的社会工程师会确保自己行不粗率，并隐藏自己的动机。他们会先给受害者一个人情，然后反过来向他们帮助过的人员请求一些协助。这种技巧已被证明是极其有效的。有时，这些人还会实施“反向社会工程”。当在处理特定问题时，他们会提供帮助。在解决问题后，他们会被称为英雄。社会工程师主要针对一些毫无防备的员工，并会向他们寻求帮助。许多人掉入了这个陷阱。对于社会工程师来说，伪装是轻而易举的。他们拥有伪证和
    `ID`，这样就可以轻松地融入目标组织。


    ## 利用技术进行欺骗


    技术使得某些事情变得更容易，特别是对于社会工程师来说。某些恶意请求是通过计算机或任何电子设备发出的。伪造电子邮件地址、计算机名称、网络地址和传真号码等细节也很容易。黑客可以利用技术轻易欺骗他们的目标。他们可以使用电子邮件向受害者索取一些关键信息。社会工程师通常会在这些电子邮件中附加链接，受害者会被重定向到一个看起来合法且体面的网站。使用上述技术可以访问的一些信息包括密码、`user
    IDs` 和社会安全号码。外部攻击者可能还会在 `Myspace` 和 `Facebook` 等平台上使用这种技术。一些网络钓鱼和垃圾邮件信息利用了这种技术。用户被迫使用不同的技术降低警惕，他们最终可能会打开某些附件。电子邮件也呈现得非常专业。受害者被骗泄露不同的信息。黑客在访问网络后总是会部署一些此类社会工程技术，以便他们轻松地发送一些消息并创建一些弹出窗口。在进行手机短信时也可以使用这些技巧。在某些情况下，外部攻击者会伪装成
    `Microsoft` 员工或供应商。在受害者安装了“补丁”后，他们的计算机将被 `Trojans` 和 `worms` 等不同程序感染。攻击者随后可以在网络内部创建一个后门来获取不同的信息。后门将允许攻击者利用受害者的计算机自由访问不同的信息，他们还可以发起不同的攻击。`worms`
    和 `Trojans` 在执行社会工程攻击时会非常好用。`worms` 有不同的类型。在受害者打开某些垃圾邮件后，一切都太迟了。计算机已经被感染，他们将无法实现最初想要的目标。使用技术进行的某些社会工程攻击是匿名进行的。攻击者将利用
    `Internet proxy server`、`remailers`、`anonymizers` 和一些 `SMTP servers` 来确保存在开放中继。当人们成为本应提供某些机密个人信息的受害者时，他们应该知道自己无法追踪社会工程攻击的来源。


    ## 如何反击社会工程攻击


    有多种方法可以保护你的网络免受社会工程攻击。虽然安全系统可能也很强大，但某些天真的网络管理员可能会被社会工程师操纵。某些安全策略可以确保社会工程师无法访问网络，这些包括：


    *   数据分类

    *   为所有员工和承包商设置 `user IDs`

    *   删除不再组织内工作的员工的 `IDs`

    *   建立可接受计算机使用规范

    *   重置并设置密码

    *   妥善处理机密信息

    *   相应响应某些安全事件

    *   护同客人


    这些政策中的一些可以在组织内的所有员工中执行。政策还应对组织内的所有个人保持更新。还应通知终端用户某些政策的变化。在试图防止社会工程攻击时，最佳防线是拥有经过良好的员工，他们知道如何应对不同的社会工程攻击。通过确保你已经提高了意识，社会工程攻击可能就不会发生。在培训过程中，重点应更多放在某些安全策略上。你也可以外包安全培训服务。员工也应该认真对待安全培训。帮助你从长期来看消除社会工程攻击的一些提示包括：


    *   安全意识和培训应被视为业务投资。

    *   用户也应接受培训随时意识到某些安全策略。

    *   确保员工负责公司内部的一些隐私和安全任务。

    *   确保培训内容根据你的组织需求量身定制。

    *   制定与你的业务功能相一致的社会工程意识计划。

    *   确保你的信息是非技术性的。

    *   为报告和防止某些事件制定激励计划。

    *   始终以身作则。


    还有一些你可以与公司员工分享的提示：


    *   除非你能验证他们确实是他们声称的身份，否则你不能与其他分享某些机密信息。有时，可以通过电话提出请求，在这种情况下，你应该先验证拨打者的身份。

    *   不要点击任何将你重定向到需要更新的网站的电子邮件链接。某些此类邮件通常来自不可信的来源。

    *   在 `LinkedIn` 和 `Facebook` 等不同网站上共享某些机密信息要始终谨慎。时刻留意那些声称是你的“朋友”的人，他们中的某些可能有恶意意图。

    *   永远不要打开完全陌生人的电子邮件附件。

    *   护同建筑内的每一位客人。

    *   不要泄露你的任何密码。


    其他合适的建议包括：


    *   无论是有线还是无线网络，陌生人都不应轻易访问你的网络。攻击者在访问网络几秒钟后，可以在网络中放置一些 `malware` 和 `network analyzer`。

    *   所有信息都应该进行分类。员工还应接受有关如何处理不同信息的培训。

    *   制定一些旨在对计算机上的媒体和文档执行的政策。这些政策将确保数据可以被仔细处理，并留在它们应该待在的地方。

    *   首选的碎纸机应执行交叉粉碎。有些公司提供碎纸服务，并且他们提供高质量的服务。在强化正式培训内容时，一些有效的技巧包括：


    *   培训启动和员工入职培训

    *   包含有关如何生存社会工程攻击信息的手册

    *   可以作为鼠标垫、屏幕保护程序和便利签的小物品


