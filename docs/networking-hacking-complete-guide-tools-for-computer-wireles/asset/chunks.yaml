- fmt: "\n# Chapter 4: Hacking Methodologies\n\nIn this chapter, the main focus will\
    \ be on:\n- Examining some of the successful steps during the hacking process\n\
    - How to obtain information about organizations\n- Scanning a network\n- Looking\
    \ for loopholes on a network\n\nBefore you focus on becoming an ethical hacker,\
    \ you need to have basic knowledge on how to formulate methods that can work well.\
    \ Ethical hacking entails penetrating a network and also patching it. Some of\
    \ the proven techniques can also guide you as you focus on learning more about\
    \ hacking. When you use a specific methodology, you can easily achieve your goals.\
    \ Also, you will be able to operate professionally and will gain a lot form your\
    \ time and efforts. \n\n## Setting the Stage for the Testing\n\nIn the past, the\
    \ hacking process was quite manual. Nowadays, people can utilize different tools\
    \ so that they can accomplish various goals. Some of these tools ensure that you\
    \ can perform the tests and there will be fewer steps involved during the testing\
    \ process. Although these tools come in handy, it is also good to learn more about\
    \ what happens in the background.\n\nEthical hacking can also be likened to the\
    \ software testing process. You must be able to think logically so that you can\
    \ easily interact with the system components while also learning more about how\
    \ they work. You are supposed to gather information in small bits. Also, when\
    \ you begin testing the network, you will have many goals and tests to run. You\
    \ will move closer until you can discover all the present security vulnerabilities.\n\
    \nThe processes used during the ethical hacking process are somewhat the same\
    \ as the ones used by malicious hackers. The main difference is the goals and\
    \ the motivation of the malicious and ethical hackers. Also, each individual attains\
    \ their goals differently. The main difference also is that the ethical hacker\
    \ will try to look into the vulnerabilities present in the system and they will\
    \ also address each of these issues. As for the malicious hackers, they will exploit\
    \ the present vulnerabilities and they will also access different pieces of information\
    \ that they will use to their own advantage.\n\nNowadays, attacks by malicious\
    \ individuals can come from different angles. It is advisable to test each possible\
    \ point which includes the client networks, partners, and vendors. Other areas\
    \ that can also be tested include laptops, wireless LANs, and home users. When\
    \ you begin to put your skills to the test as an ethical hacker, you should keep\
    \ track of all the tests that you have been carrying out. Also, keep tabs on the\
    \ tools that you have been using as well as the results that you have obtained.\n\
    \nThe information that you record can help you in the following ways:\n1. Tracking\
    \ what has worked when carrying out tests previously.\n2. The information helps\
    \ to prove that you did not hack the system with malicious motives.\n3. Correlating\
    \ the tests with the intrusion detection systems as well as other log files is\
    \ any questions arise.\n4. You should also document the final report.\n\nBesides\
    \ taking some general notes, you can also take screenshots of your results since\
    \ they may also come in handy. The screenshots can be used at a later period since\
    \ they prove that certain occurrences took place. Additionally, they also come\
    \ in handy when you are formulating the financial report. Depending on the specific\
    \ set of tools that you have used, the screenshots will act as your evidence.\
    \ Such evidence also comes in handy while trying to showcase that different exploits\
    \ and vulnerabilities are present in the network.\n\nYour main focus should be\
    \ on the simulation and gathering of information that may compromise the system.\
    \ When carrying out the tests, you can carry out a partial attack on one of the\
    \ computers in the network. In some instances, you can also go ahead and attack\
    \ the entire network. You are mainly looking for weaknesses that can be exploited\
    \ by malicious users. The internal system should also be assessed comprehensively.\
    \ When looking for vulnerabilities, check how each of the systems is interconnected\
    \ and how some of the private systems are operating. You should have looked into\
    \ the information that has not been protected from malicious users.\n\nWhen performing\
    \ ethical hacking, you may carry out a blind assessment, and you may start with\
    \ basic pieces of information such as the name of the company. Such an approach\
    \ ensures that you have started from the ground up and you will also able to gain\
    \ access to sensible pieces of information that can also be easily accessed by\
    \ the hacker. The main issue is that such a technique can take longer and you\
    \ may also fail to notice some of the security vulnerabilities that are present\
    \ within the network. An ethical hacker should not always worry about making sure\
    \ that their digital footprints being traced since they are performing each task\
    \ legitimately. Although such a hacker may be acting legitimately, it is advisable\
    \ to work stealthily. Some of the techniques that hackers use to conceal each\
    \ of their actions will also be discussed in detail in the forthcoming chapters.\n\
    \n## Seeing What Other People See\n\nYou gain access to a lot of information about\
    \ a company and its computer systems. They can also be easily accessed, and this\
    \ is done using a technique known as foot printing. Information can also be gathered\
    \ in the following ways:\n1. Using a web browser to search for information about\
    \ a certain organization. Some of the search engines such as `Google` come in\
    \ handy in such cases.\n2. Carrying out network scans, assessing vulnerabilities,\
    \ and probing open ports so as to determine various pieces of information about\
    \ the network. If you are accessing the network internally, you can use port scanners\
    \ including `GFI LanGuard` so that you can also see what is accessible. Regardless\
    \ of the probing technique that you use, you should limit the information that\
    \ you are supposed to gather about a specific organization. The amount of time\
    \ that you will use also matters. Some of the major factors to consider also include\
    \ the size of the organization as well as the complexity of the information present\
    \ within the organization.\n\n## Gathering Public Information\n\nThe amount of\
    \ information that you have been gathering about a specific organization as well\
    \ as their network may be readily available on the Internet. Your main task is\
    \ to find the present information. Such information ensures that a hacker can\
    \ easily target specific areas within an organization. They may also focus more\
    \ on specific individuals such as executives within the company. Some of the techniques\
    \ that can be used to gather information about the target organization include:\n\
    \n1. **Web Search**: When you perform a web search about an organization, you\
    \ can gain access to the following pieces of information:\n    - The names of\
    \ the employees and their contact information\n    - Some of the relevant company\
    \ dates\n    - Incorporation filings\n    - SEC filings\n    - Mergers and acquisitions\n\
    \    - Press releases about some of the organizational changes, major moves, and\
    \ new products\n    - Patents and trademarks\n    - Presentations, webcasts, and\
    \ articles\n\nMicrosoft is ensuring that they have made headway in the search\
    \ arena. `Bing` is a search engine, and the company falls second in line. As for\
    \ many hackers, they prefer using `Google`. The search engine is free and easily\
    \ accessible, and most of the hackers know how to use this tool to their won advantage.\
    \ When using `Google`, you can use the following techniques:\n- Typing the keywords.\
    \ You can find the relevant pieces of information that is present in millions\
    \ of pages. It is also possible to access phone numbers, files, and addresses.\n"
