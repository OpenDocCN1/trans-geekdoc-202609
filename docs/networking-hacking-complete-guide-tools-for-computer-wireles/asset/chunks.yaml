    access to the passwords and other pieces of information, an attacker can go ahead
    and use such information for their own personal gain. Techniques: To access a
    password when using social engineering, you just have to ask for it. Since the
    technique involves manipulation, you just pose as an employee within the organization
    and ask for the password using an email or any other technique. At times, the
    users can issue their passwords to the individuals responsible for the security
    testing process. Passwords should always be reset after the testing phase is over.
    After resetting the passwords, you will not be accountable for any information
    that may be lost within the network afterward. Countermeasures: Ensure that you
    have brought about awareness through security training programs; that way, you
    can easily ensure that the attacker cannot gather any information through social
    engineering. The individuals who have access to the network should be trained
    on how they can spot attackers. For instance, they should know that attackers
    make use of fake phone calls and spam emails. They should ignore each of these
    emails. It is also good to notify the security administrator about any suspicious
    activity such as the presence of some suspicious phone calls. Shoulder Surfing
    This is a technique that involves looking over a person’s shoulder. The attacker
    will mainly do so in a bid to gain access to the passwords being used to access
    the network. Techniques: To coordinate such an attack, the attacker should be
    close to the target and they will try to conceal their hidden motives. They will
    collect the password by monitoring the keyboard and the screen of the users as
    they log in into the network. An external attacker that has a good eye will easily
    gain access to the password. Shoulder surfing is quite easy and you can also try
    it on your own. Countermeasures: Always encourage the users to be on the lookout
    so that an external attacker cannot gain access to their passwords. They should
    not key in their passwords whenever they spot some strange activities within their
    environment. If a person is looking over your shoulder, you should have dismissed
    them politely. Make sure that they cannot see your password as you type it. Inference
    It is the situation whereby the attacker can guess the passwords depending on
    the information that they have gathered about the users. Some of the details include
    the date of birth, phone numbers, and even favorite television shows. The main
    issue with the external attackers is that they are very determined to achieve
    their goals. The best defense mechanism is to educate the users appropriately
    about the creation of secure passwords that do not also relate to some personal
    information such as the date of birth. The users should also be reminded constantly
    about the importance of secure password creation. Weak Authentication Malicious
    users and external attackers will try to obtain passwords through different means.
    They may also take advantage of some of the past operating systems since they
    do not require any passwords during the login process. Some phones are not secured
    using passwords. High-Tech Password Cracking High-tech password cracking entails
    the use of different programs to guess the passwords that can be used to access
    the network. The tools ensure that it is possible to come up with different password
    combinations. Some of the high-tech techniques are used to access database files
    that are protected by passwords. The major password cracking techniques include
    brute-force attacks, dictionary attacks, and rainbow attacks. Hacking WPA2 Wi-Fi
    The techniques used to crack the WPA2 networks have not changed over the years.
    The latest techniques require you to interact less and make sure that you are
    well-informed as compared to some of the previous techniques. You can also access
    various networks although they may not be connected. WPA2 network can be accessed
    using the PMKID. Some of the tools that you can use include Hashcat. The tool
    will enable you to crack the WPA2 Wi-Fi passwords. Also, when using such tools,
    you can easily identify some of the networks that have weak passwords. The Old
    Techniques Used to Crack the WPA2 Passwords The old techniques have been used
    for many years and you should disconnect a connected device momentarily from the
    access point that you want to crack. As a hacker, you have to understand some
    of these essential points. The main challenge is that someone must be connected
    to the network so that you may launch an attack. The password that has been used
    should also be weak so that the attacker may break in easily. If there is no connected
    device, it will be hard to connect to the network since you will lack the opportunity
    to capture a handshake, and that is why you will be unable to hack into the network.
    The other challenge of such a technique is that it is legally troubling and noisy.
    You will be forced to send some packets intentionally so that you may disconnect
    an authorized user from the network. You will be launching a DoS attack, and as
    a result, the network will be jammed. You may also get into trouble since you
    can be easily caught. New Methods Used to Hack the WPA2 Wi-Fi Instead of trying
    to intercept the two-way communication that is present between two Wi-Fi devices
    so that you can crack the password, the attacker can use new techniques to communicate
    directly with a vulnerable access point. Some of the tools that can be used by
    attackers include Hashcat. The tool can be used to launch a brute-force attack,
    and it mainly collects information that can facilitate such an attack easily.
    As always, the attacker needs to be close to the WPA Wi-Fi network that they are
    planning to attack. The main objective will be to use a compatible wireless network
    adapter, and it will be possible to gain access to certain pieces of information
    that can be used to facilitate the attack. The wireless attack tool has also proven
    to be more efficient as compared to Aircarck-ng and Aireplay-ng. Using Hcxtools
    and Hashcat Hcxpcaptool and hcxdumptool are tools that are used to carry out penetration
    testing on Wi-Fi networks and also carrying out an audit. When using these tools,
    you can easily capture a WPA2 handshake and PMKID hashes. Minimal arguments are
    required when launching an attack when using the command line. The tool can also
    be run against some convenient targets. The attack over the SSH can also be executed.
    Devices such as Raspberry Pi can also be used although they do not have screens.
    After capturing the PMKID, the hash should be loaded into the Hashcat in a bid
    to crack the WPA2 Wi-Fi password. The hcxpcaptool is used to convert the PCAPNG
    file to a version that can be compatible with the Hashcat. The brute force attempts
    can then take place. To attack each network when using this technique could not
    be possible. The success rate is not as high depending on the complexity of all
    the passwords on the targeted WPA2 Wi-Fi networks. Various factors determine whether
    you can access the PMKID. What Do You Need? When performing such an attack, you
    have to use the Kali Linux software. Also, you should be able to access a wireless
    network adapter and it should also support the packet injection and monitor mode.
    Many guides come in handy when you are trying to select a compatible wireless
    network adapter. Apart from the network adapter offered by Kali Linux, the system
    should be fully updated and upgraded. Failure to do so, you will find that some
    of the packages are out of date and some issues during the capturing process will
    be encountered. Step 1: Install the Hashcat and Hxctools First, you should install
    the tools that you need. To download the necessary tools, key in the following
    text on the terminal window. ![](rsrc15N.jpg)After the installation process is
    complete, you will then install the hxctools. To do so, open the terminal window
    and also paste everything line by line. If an error occurs, type the sudo command
    before the text. ![](rsrc15U.jpg)You will then install the Hashcat tool. The process
    should be easy. Make sure that you have installed the latest version of the Hashcat
    tool. ![](rsrc15Y.jpg)Step 2: Preparing the Wireless Network Adapter After you
    have plugged in the wireless network adapter, you can find the names of the WPA2
    networks by typing ip a or ipconfig. The network names usually vary. First, make
    sure that the card has been put into the wireless monitor mode. You will then
    be able to listen to the Wi-Fi traffic. You should type the following commands
    into the terminal window and you should also substitute the name of the wireless
    network adapter. hcxdumptool -i wlan1tue -o galleria.pcapng –enable\_\_status=1
    The name of the wireless adapter may also be wlan1tue. It helps to save PMKIDs
    that have been captured and they are saved in a file known as “galleria.pcapng.”
    The status value can be specified. warning: Network Manager is running with pid
    555 warning: wpa\_supplicant is running with pid 611 warning: wlan1mon is probably
    a monitor interface start capturing (stop with ctrl+c) INTERFACE.…………: wlan1mon
    FILTERLIST………….: 0 entries The wireless network adapter should also be in the
    monitor mode. Step 3: Use the Hxcdump When Capturing the PMKIDs That Are From
    the Local Networks You can capture the PMKIDs of the devices that you want to
    try to attack. Some of the commands that you can execute include: ![](rsrc16E.jpg)After
    gathering enough information, you can end the attack. A PCAPNG file will then
    be produced and it will contain all the information that you need to facilitate
    the brute-force attack. The information should also be converted into a format
    can be easily understood by the Hashcat tool. Step 4: Using the Hxcpcaptool to
    Convert the Dump for Hashcat The hcxpcaptool is used to convert the PCAPNG file.
    A few arguments are also specified. In the same folder where the PCAPNG files
    are saved, you should key in the following commands in the terminal window. ![](rsrc16P.jpg)After
    running the command, the terminal window will showcase the following pieces of
    information: ![](rsrc16U.jpg)The context show that you have gathered at least
    21 PMKIDs within a short period. The "galleriaHC.16800" file can now be used to
    crack the network passwords. Step 5: Select a Password List and Use the Brute
    Force With Hashcat When you start attacking the Wi-Fi networks that you have managed
    to capture, you must start by picking a good password list. After picking a good
    password list, you can put all the passwords in a similar folder with the .16800
    file after you have converted it. You should then run the following commands in
    the terminal window: ![](rsrc172.jpg)The Hashcat should be started in the 16800
    mode. The attack on the WPA-PMKID-PBKDF2 network protocols will then be attacked.
    You should also specify the name of the files that you need to crack of which
    in this instance we are using the "galleriaHC.16800." The –force option will then
    ignore any warnings that appear when proceeding with the attack. The brute force
    attack is quite effective and in this context, we are making use of the "topwifipass.txt."
    ![](rsrc178.jpg)The time needed to complete the attack depends on the size of
    the password list and the hardware speed. To see the status updates, you should
    always press the S key. Step 6: Interpreting the Results As the Hashcat command
    tries to crack the Wi-Fi passwords, you can also check the present progress. ![](rsrc17F.jpg)As
    the password list comes to an end, the Hashcat adjusts the workload and you will
    get a final report afterwards. ![](rsrc17M.jpg)If you have managed to crack some
    passwords, you will notice that you can see all of them there. As for the test
    run, the PMKIDs that were gathered contained passwords in the password list, so
    it’s impossible to crack any of the hashes. When hacking into certain networks,
    you may come across such issues especially when there is a strong password. The
    PMKID Hashcat Attacks Ensure the Wi-Fi Attacks Are Easier Although this technique
    has proven to be effective, some of the past tactics to crack WPA2 Wi-Fi passwords
    are still effective. If the network does not support some of the security elements
    that contain the PMKID, the Wi-Fi hacking process may not be successful. You can
    use the hcxtools to first audit your network and learn whether they are susceptible
    to attacks. Although your network may be vulnerable, there should be a strong
    password so that the efforts of the attacker to attack the network may prove to
    be futile. Most of these attacks rely on guessing some passwords that may be used
    to access the Wi-Fi network, during the guessing process, you may start by guessing
    some default passwords which may include “password” and “12345678”. Such passwords
    can be easily cracked. During the guessing process, you can also go ahead and
    try to utilize some breached data. Some techniques used to access such data include
    carrying out a social engineering attack since it will help to recover some sensitive
    information. The passwords may also be reused on different accounts. Such a technique
    may also prove to be very effective. Password-Cracking Tools You can use different
    tools to crack the passwords and operating systems in different organizations.
    Some of the renowned password cracking tools include: Cain & Abel The Cain & Abel
    password recovery tool is meant for the Microsoft operating system. It allows
    people to recover passwords since the tool sniffs a network of your choice. You
    can also crack different passwords using the Cain & Abel dictionary, cryptanalysis
    attacks, brute force, decoding scrambled passwords, recording VoIP conversations,
    revealing password boxes, recovering wireless network keys, analyzing routing
    protocols, and uncovering cached passwords. The tool is updated regularly and
    the latest version has numerous features including APR and enables a person to
    sniff on the switched local area networks. You can also launch a Man-in-the-Middle
    attack. The sniffer can also analyze some of the encrypted protocols including
    HTTPS and SSH-1. They also contain filters that capture the credentials of specific
    users. The latest version of Cain & Abel also ships the route extractors, routing
    protocols, brute-force, and  dictionary attacks for the common hashing algorithms
    numerous password calculators, specific authentications, password decoders, cryptanalysis
    attacks, and some utilities commonly related to the network security. Who Should
    Use the Cain & Abel Tool? The specific target audience for the Cain & Abel tool
    is network administrators, professional penetration testers, teachers, forensic
    staff, security professionals, and security software vendors. Requirements: To
    successfully install Cain & Abel, your system should have the following specifications:
    ➢         A hard disk space of at least 10MB ➢         Microsoft Windows XP/ 2000/Vista
    ➢         Winpcap Packet Driver ➢         Airpcap Packet Driver Installation:
    You should start by downloading Cain & Abel. Run the executable file and follow
    each of the installation instructions. ![Image result for cain and abel password
    cracking tool](rsrc189.jpg)Brutus Brutus is a popular tool used to crack passwords.
    It is quite flexible and fast. The password cracking tool is also available free
    of charge and can only be used on the Microsoft Windows operating systems. It
    supports the following formats: POP3, HTTP (Form, HRML, CGI), SMB, FTP, IMAP,
    Telnet, NetBus, and NNTP. You can also create your authentication types. The tool
    is also widely known since it supports multi-stage authentication engines. You
    can also resume and load different options after pausing some of the current activities.
    RainbowCrack The password cracking tool cracks passwords at a fast rate as compared
    to other tools used to launch brute-force attacks. The tool makes use of a large
    time memory in the form of a computational process that calculates the hash pairs
    and plain text. RainbowCrack makes use of selected hash algorithms. After the
    computation process is over, the results will appear under the rainbow table.
    The process takes a lot of time. After the table is ready, you can crack any WPA2
    network passwords fast as compared to when you are using the brute force tools.
    You have to come up with rainbow tablets individually. The people who developed
    the RainbowCrack had generated the NTLM rainbow tables and the LM rainbow tables.
    Other tables that were also produced include the Sha 1 rainbow tables and the
    MD5 rainbow tables. The tables are also available for free and come in handy during
    the password cracking process. This tool is available for both Linux and Microsoft
    Windows systems. Wfuzz Wfuzz is also used to crack passwords. The tool makes use
    of brute-force attack. It can also be used to find some of the hidden resources
    including scripts, directories, and servlets. The tool can also be used to identify
    different types of injections including XSS Injection, SQL Injection, and LDAP
    Injection in different web applications. The major features of the Wfuzz tool:
    ➢         Post, headers and authentication data brute-forcing ➢         Capability
    of injection via multiple points with multiple dictionary ➢         Time delay
    between requests ➢         Proxy and SOCK Support, multiple proxy support ➢        
    Output in colored HTML ➢         POST and GET brute-forcing ➢         Brute force
    HTTP password ➢         Multi-Threading ➢         Cookies fuzzing John the Ripper
    This tool is widely known since it is open source and compatible with other platforms
    including Linux, Mac OS, and UNIX. A Microsoft Windows version is also available.
    The tool is mainly used during the detection of weak passwords. There is a pro
    version and it has more features. ![Image result for john the ripper](rsrc192.jpg)Figure
    1: Zip password cracking using John the Ripper THC Hydra THC Hydra has gained
    a lot of popularity since the tool is fast when it comes to the password cracking
    process. It has been compared to other tools and that is has been issued a positive
    review. It is also easy to install new modules into the password cracking tool.
    The modules come in handy when enhancing the features of THC Hydra. The tool can
    be used on different platforms including FreeBSD, Microsoft Windows, Linux, Solaris,
    and OS X. THC Hydra also supports numerous network protocols including AFP, Asterisk,
    Cisco, Cisco auth, AAA, CVS, Cisco enable, FTP, Firebird, HTTP-FORM-POST, HTTP-FORM-GET,
    HTTP-HEAD, HTTPS-FORM-GET, HTTP-GET, HTTPS-FORM-POST, HTTP-PROXY, HTTP-Proxy,
    HTTPS-GET, ICQ, HTTPS-HEAD, IRC, IMAP, MYSQL, LDAP, MS-SQL, NNTP, NCP, Oracle
    SID, Oracle Listener, POP3, PC-Anywhere, RDP, PCNFS, Rlogin, Oracle, Rexec, POSTGRES,
    SAP/R3, rsh, SMTP Enum, SMTP, SIP, SOCKS5, SMB, Telnet, SSH (v1 and v2), SNMP,
    VMware-Auth, , Subversion, VNC, Teamspeak (TS2), and XMPP. Developers are also
    encouraged to contribute towards the development of the THC Hydra password hacking
    tool. ![](rsrc19B.jpg)Medusa Medusa is somewhat similar to THC Hydra. It supports
    numerous network protocols including FTP, HTTP, IMAP, MYSQL, POP3, NNTP, CVS,
    pcAnywhere, AFP, rsh, SMTP, MS SQL, PostgreSQL, SMB, SSH, NCP, SNMP, VmAuthd,
    rlogin, Telnet, VNC, and SVN. Medusa is in the form of a command-line tool, so
    you need to first learn about the commands. The network connectivity determines
    the efficiency of the Medusa password cracking tool. When trying to penetrate
    a local network, Medusa can crack at least 2,000 passwords in one minute. When
    using this tool, you can perform a parallel attack. It also comes in handy when
    cracking the passwords of multiple email accounts at a go. You should come up
    with a password list and a username list. Ophcrack This password-cracking tool
    is meant for the Microsoft Windows operating system. It is also the most popular
    password-cracking tool for the Windows platform. It can also be used on the Mac
    OS and Linux operating systems and comes in handy when cracking the NTLM and LM
    hashes. There are also rainbow tables and they are free. L0phtCrack It can be
    used as an alternative for the Ophcrack. It normally cracks passwords on the Windows
    platform. When cracking passwords, it uses the network servers, Windows workstations,
    active directory, and the domain controllers. The tool makes use of brute-force
    and dictionary attacks to generate and guess passwords. Some of the features present
    include the schedule routine audit feature. It can be set weekly or even monthly
    when carrying out an audit. Depending on the scheduled time, the tool starts the
    scan on time. ![](rsrc19M.jpg)![](rsrc19S.jpg)The password-cracking tools normally
    take a set of passwords that may be compiled through guesswork and run each one
    of them through an algorithm. Encrypted hashes come about in the process and then
    compared at a high speed to the password hashes that have been extracted from
    the initial password database. After finding a match, it means that the network
    password has been cracked. The external attacker can then gain access to the network
    and launch different attacks while also gathering various pieces of information.
    Some of the password-cracking tools also try to hack into a network using some
    of the usernames and passwords that may have been predefined. The dictionary attacks
    work in such a manner and they include Brutus among other password-cracking tools.
    In most cases, the predetermined passwords eventually lose. The main advantage
    is that these tools are easily accessible; you can use it when testing whether
    a network is secure. You have to look for the weaknesses within the network before
    the malicious users can. During the password cracking process, some of the user
    accounts may be locked out and there might be some interruptions in the process.
    In some instances, there will be a DoS attack and users will not be able to access
    the network. Passwords are normally encrypted. They are also stored on the computer
    using specific encryption algorithms such as MD5 and DES. The hashed passwords
    are represented by encrypted strings that are fixed in length and by the same
    passwords. The hashes cannot be reversed which means that it is impossible to
    decrypt the passwords. Some of the passwords in platforms such as Linux normally
    have a random value commonly known as “salt” and it makes sure there is a degree
    of randomness. As a result, although two people have the same password, each password
    will not have the same hash value. '
