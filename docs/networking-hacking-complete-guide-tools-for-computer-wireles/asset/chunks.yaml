  trans: "\n\n有时，社会工程师会伪装成知识渊博的员工。例如，他们可以充当经理甚至高管。他们甚至可能伪装成天真的员工。他们可以承担的角色包括充当维护人员和\
    \ IT 顾问。社会工程师还适应不同的角色。他们总是会根据他们所接触的人切换不同的模式。\n\n有效的信息安全涉及确保组织不会受到社交工程攻击。为了确保你的组织不会易受此类攻击的侵害，你需要跟踪所有的用户。可以部署的某些措施包括确保有防火墙、加密和入侵检测系统。组织可以通过上述技术来保障其信息安全。如果外部攻击者成功绕过所有这些防御系统，你所在组织内部的网络将变得脆弱。\n\
    \n社会工程需要高超的技巧，而且它高度取决于一个人的性格以及他们对目标组织的了解。如果社交工程对你来说并不自然而然，你首先需要学习更多关于这种艺术。你也可以聘请第三方来帮助收集有关目标组织的信息。在进一步了解社交工程之后，你可以设计出某些技术，这些技术在确保组织网络安全时将派上用场。\n\
    \n社交工程还会损害某些个人的声誉，因为它涉及了人的个人信息的收集。由于外部黑客将更多地关注获取有关这些人的机密信息，不同人的声誉可能会面临风险。谨慎行事是好事，在采取行动之前你应该考虑到你行为的后果。\n\
    \n有许多方法可以进行社交工程攻击。在本书中，我们不会侧重于培训人们如何执行社交工程攻击。主要重点将放在某些被证明是有成的社交工程技术上，例如不同外部攻击者的案例。你也可以使用这些技术中的某些，以便根据你的需求适用于你的情况。\n\
    \n如果你想在组织内部执行这些技术中的，你可能希望采取局外人的身份，但主要问题可能是公司内部的大多数人都认识你。身份识别是一个主要风险。在某些情况下，从信任的人员那里外包某些服务是明智的，让他们可以代表你进行这些测试。处理测试过程的人员也应该是值得信任的。如果你正在寻求外部人员的服务，可以从寻求参考介绍开始。之后，背景检查可能会派上用场。\n\
    \n## 外部攻击者使用社交工程的原因\n\n大多数外部黑客使用社交工程攻击是因为他们可以这样做做。他们想要确保网络黑客攻击过程尽可能简单。当一个社会工程师下心要黑入网络时，他们将绕过访问控制、防火墙以及每一个现有的身份验证设备。在大多数情况下，社会工程师行动缓慢，因为他们想避免被捕获。此外，他们不想引起任何形式的怀疑。社会工程师总是会渐进地收集少量碎片信息，并会根据他们计划的攻击类型使用所有这些信息来构建一个更大的蓝图。\n\
    \n通过电子邮件或电话进行个人攻击是可能的。社交工程攻击期间使用的方法通常取决于攻击者的能力。社会工程师也熟悉事实，某些组织没有正式的数据分类、事件响应计划、访问控制系统和安全意识计划。他们总是会利用此类弱点，并利用它们来为自己谋利。\n\
    \n社会工程师还拥有关于该组织内部和外部的一些信息。他们所拥有的知识有助于他们促进这些攻击中的每一个环节。当一个社会工程师收集了大量关于组织的信息时，他们可以轻松伪装成员工或组织内的任何其他信任的人员。社会工程师拥有的知识将使他们处于优势地位，并对组织内员工的运作方式有深入理解。\n\
    \n## 理解社交工程的后果\n\n许多组织都有竞争对手。其中某些竞争对手在某一点可能会变成敌人；这些敌人也可能认为通过社交工程制造麻烦是合适的。除了竞争对手，敌人也可能是前员工或在组织内工作的人。有时，黑客可能会发动社交工程攻击因为他们想证明自己的专业水平。无论制造问题的人是谁，主要的的因素是每个组织始终处于风险之中。\n\
    \n互联网可以促进信息收集过程同时也促进不同类型的攻击。最脆弱的公司是那些大型公司；然而，小型网络也可能受到攻击。组织中的每个员工都可能成为社交工程攻击的受害者。对于帮助台员工，由于他们负责发布不同的信息，他们是非常脆弱的。\n\
    \n所有的社交工程攻击都有不同的后果。攻击的主要目标是收集将用于攻击网络的信息。社会工程师可以有效地收集以下信息：\n\n* 用户密码\n* 可用于进入机房的安全证\n\
    * 知识产权\n* 机密财务报告\n* 客户名单和销售意向\n\n如果列出的任何信息发生泄露，公司可能会遭受财务损失，员工可能会情绪低落，会出现监管和法律合规问题，客户也可能失去对特定组织的信任。\n\
    \n社交工程攻击不容易被记录，因此无法被轻易防止。社交工程攻击的主要问题可以使用很多方法。防火墙也营造了一种虚假的安全感。对于社交工程，你永远无法预测攻击者将使用的特定方法。采取最好的步骤是确保保持警惕，同时努力理解外部黑客使用的方法。通过，你可以提高组织内的安全意识。\n\
    \n## 执行社交工程攻击\n\n执行社交工程攻击的过程相当简单。社会工程师需要在执行攻击之前，研究组织的一些流程以及信息系统。当攻击者拥有了此类信息时，他们就可以着制定他们的目标，因为他们将拥有方向感。社会工程师在攻击过程中使用的步骤如下：\
    \ \n\n1. 进行一些研究\n2. 建立信任\n3. 利用某些关系来获取不同的信息\n4. 使用收集到的信息进行某些恶意攻击\n\n"
