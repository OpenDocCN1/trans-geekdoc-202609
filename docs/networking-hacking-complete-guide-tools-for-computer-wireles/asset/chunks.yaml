    这些步骤中的某些还包含许多子步骤，并且在过程中需要使用不同的技术。这一切取决于正在执行的特定攻击。在外部攻击者执行社会工程攻击之前，他们必须制定不同的目标。这些目标确保了他们正在朝着特定的目标努力。在目标形成过程中，攻击者应该问自己他们想要实现什么，以及他们正试图黑入什么。有时，重点可能放在安全胸章和服务器密码上。在某些情况下，黑客可能试图证明自己的实力。


    ## 钓鱼信息

    在社会工程工程师想出一些目标后，他们就可以从容地开始攻击。他们将开始收集有关受害者的信息。为了避免引起任何警觉，社会工程工程师总是行动得非常缓慢。由于信息收集是社会工程中的一个重要步骤，因此加强某些可能阻碍此类过程的安全措施是可行的。无论黑客使用何种研究方法，黑客过程中需要的重要信息包括内部电话号码、员工列表和公司日历。


    ### 使用互联网

    互联网被用作基础研究媒介。通过搜索引擎可以访问大量信息。最重要的是你需要收集正确的关键词。通过收集不同的信息片段，你可以进行社会工程攻击。有时，人们会向某些专业人士支付一定的费用，让他们进行全面的背景调查。搜索可以让你获取有关特定人员的私人信息和公共信息。


    ### 翻垃圾桶

    翻垃圾桶在某种程度上具有风险，而且很杂乱；尽管如此，在寻找特定信息时它是非常有效的。当使用这种方法时，你必须翻遍垃圾桶来寻找有关特定公司的信息。翻垃圾桶还可以让你获取一些机密信息，因为员工可能会认为，当某些信息被扔进垃圾桶时，其他人无法访问的。你丢弃的一切都可能隐藏着一些重要的信息片段。社会工程工程师总是寻找以下类型的文档：


    * 组织结构图

    * 内部电话列表

    * 重点是安全政策的员工手册

    * 密码列表

    * 网络拓扑图

    * 电子表格和报告

    * 会议记录

    * 包含敏感信息的电子邮件打印件


    然而，碎纸机派用场，但只有在纸张被碎成无法重新组装的小碎片时才适用。有些碎纸机会将纸张碎成长条。社会工程工程师总是重新组合这些纸张，从而获取一些机密信息。他们只需要花一些时间并使用透明胶带，文档就会拼在一起。黑客还可以从咖啡馆或餐厅等场所发生的对话中收集一些机密信息。敏感信息也可以从那些通话时说话大大的人那里收集。在某些情况下，外部攻击者还会寻找放在垃圾桶里的
    DVD 和 CD-ROM。


    ### 电话系统

    攻击者可以使用语音信箱系统中内置的按名称拨号功能获取不同的信息。在通过某人的信箱联系公司后，按 `0` 即可访问此类功能。这种技巧在下班时间尤为有用。在这些时间，没有人会接你的电话。攻击者还会使用某些技术来确保他们的身份被隐藏。黑客使用的一些技术包括：


    * 住宅电话：此类电话可以帮助隐藏用户的来电显示。你只需要在拨想要打的特定号码之前拨 `*67` 即可。

    * 办公电话：在任何业务中，使用电话交换机可能很难伪造。攻击者需要组织内部电话交换机软件的用户指南以及管理员密码。在某些交换机中，可以输入源号码。号码也可以被伪造。

    * VoIP 服务器：可以找到许多开源服务器，它们也可以用于配置任何号码。社会工程工程师在使用此类技术时可以发现一些重要信息。攻击者可以通过播客和语音信箱监听不同的信息。他们还可以研究受害者的声音，当需要物理访问该机构时，他们将能够完美地伪装。


    ## 建立信任

    信任无法轻易获得，也可以轻易失去。社会工程高度依赖信任。除非情况危急，否则人们彼此是信任的。在大多数情况下，人们是善良的，如果他们之间建立了一些信任，某些请求可能看起来是合理的。人们在工作场所喜欢团队合作。主要问题是，其中一些人并不理解在向“信任”的源源发布大量信息时可能产生的后果。社会工程工程师利用这种信任，他们将确保无论如何都能实现目标。一些社会工程工程师可以轻松获得组织内某些员工的信任。社会工程工程师使用以下技术来赢得人们的信任：


    * 亲和力：与好的人很容易产生共鸣，这就是为什么社会工程工程师非常友好。他们在任何情况下都不会表现过头，因此可以轻松地获取他们所需的信息。社会工程工程师还会花时间与有共同兴趣的人建立关系。他们可以利用获得的信息来确定受害者的喜好。

    * 可信度：社会工程工程师倾向于知道自己是否具有亲和力。社会工程工程师总是利用伪装来让自己有利。他们可以装成新员工，并总是接触组织内那些物理上不认识他们的人。他们非常有影响力，并且可以做一些好事，以此相应地引诱他们的目标。有时，他们可能也装成团队合作者，试图与组织内的某些员工建立关系。


    ### 利用关系

    在获得某些员工的信任后，社会工程工程师可以轻易胁迫他们提供不同的信息，这些信息在网络黑客过程中可能很有用。


    ## 言语和行为的欺骗

    社会工程工程师将通过不同的技术从他们的每个受害者那里获取一些内部信息。他们会发起对话并确保受害者不会怀疑任何事情。如果社会工程工程师在执行社会工程攻击时动作粗留，很容易被发现。一些警觉信号包括：


    * 提到公司内知名员工的名字

    * 表现得很急切

    * 吹嘘自己在组织内的权威性

    * 发出某些威胁

    * 表现得紧张（肢体语言传达了很多信息，并且很容易让他们露马脚）

    * 经历不同的心理变化

    * 对某些细节进行强调

    * 看起来可能像是在被催促

    * 拒绝提供某些信息

    * 在回答未被问到的问题的同时，主动提供不同的信息

