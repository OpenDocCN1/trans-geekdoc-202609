    \ \n\n![Tor Browser](rsrcBU.jpg)\n\n*   Use a Virtual Private Network (VPN). A\
    \ virtual private network ensures that you can browse through the Internet anonymously.\
    \ Your current location will be masked and you will be in a supposed location.\
