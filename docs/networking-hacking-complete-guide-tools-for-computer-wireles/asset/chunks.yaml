    \ where it should be inserted in the computer. It is also possible to connect\
    \ a desktop computer to a wireless network. In a wireless network, there is the\
    \ ‘access point’ and it has a similar function to the hub that is present in the\
    \ wired networks. It normally receives and broadcasts a signal through an adapter\
    \ card. The major difference between wireless and wired networks is that in a\
    \ wireless network, the computers are connected using cables. As for the wireless\
    \ network, there are no cables needed to formulate a connection between different\
    \ computers. The network is made up of two primary components and they include\
    \ a wireless card and an access point. It is possible to transmit information\
    \ between two computers as long as they are close to each other. The Configurations\
    \ of a Wireless Network A wireless network can be configured using a local area\
    \ network or a peer-to-peer arrangement.  Peer-to-peer configuration is termed\
    \ as the most basic wireless network configuration. It normally relies on the\
    \ use of wireless network adapters that are installed within the computers and\
    \ they can easily communicate with each other. For the computers to connect, they\
    \ should be within then transmitting range. If there are many computers connected,\
    \ they should be close to each other. As for this type of network configuration,\
    \ there is no network administration overhead. The configuration is mostly suitable\
    \ for small installations . The Benefits of Wireless Configurations In a wired\
    \ local area network, people take more time carrying out the cabling. As for the\
    \ wireless configuration, it possesses the following benefits: \n\n1.  The amount\
    \ of work required to install the wireless local area network is minimal. \n\n\
    2.  The wireless network can also be accessed in areas where it would be difficult\
    \ to carry out wiring. The network downtime is also minimized. \n\n3.  When there\
    \ is a wireless network, it is possible to stay connected to the network all the\
    \ time regardless of the location of the equipment. \n\n4.  The wireless network\
    \ operates over in a spherical manner. \n\n5.  It is possible to share documents\
    \ over a wireless network. \n\nAdditional Advantages of a Wireless Network: \n\
    \n1.  Speed: The network is quite convenient when it comes to sharing different\
    \ files over the network. When a network is not available, documents can only\
    \ be transferred from one point to another using flash disks and other physical\
    \ mediums. When using physical mediums to transfer documents, the process is quite\
    \ time consuming. \n\n2.  Cost: There are numerous software programs and they\
    \ are cost-effective. \n\n3.  Centralized Software Management: When installing\
    \ a network, it is possible to install the software on the file server and it\
    \ can be used by all the computers that are connected in the network, meaning\
    \ that the wireless network helps to save on time. \n\n4.  Resource Sharing: It\
    \ is possible to share resources on a network whereby numerous computers are connected.\
    \ \n\n5.  Flexible Access: People can access different files on any computer that\
    \ has been connected to the specific network. \n\n6.  Security: The files and\
    \ programs on the network can be safeguarded using the “copy inhibit” feature.\
    \ Passwords can also be used to safeguard different documents. \n\nThe main challenges\
    \ encountered when installing a network include: \n\n1.  Costs: Although a wireless\
    \ network is supposed to be cost-effective; however, the initial investment is\
    \ costly since you will also have to hire a technician. \n\n2.  Administrative\
    \ time is required: A network should be maintained properly. A network administrator\
    \ should be hired to handle such issues. \n\n3.  File server may fail: A file\
    \ server is quite susceptible in different ways. When the file server fails, the\
    \ whole network cannot operate. Different files and programs may be lost in the\
    \ process. \n\nAbout CISCO CISCO is a company that offers networking for the Internet.\
    \ The company has been operational since 1984. The network was also established\
    \ by two scientists who were studying at Stanford University. The networking solutions\
    \ offered by CISCO are being utilized by different service providers as well as\
    \ numerous small and medium enterprises. The networking solutions offered by the\
    \ company normally connect computing devices, people, and computer networks. People\
    \ can now connect with others while also sharing different pieces of information.\
    \ A large percent of Internet traffic has also been traveling across the CISCO\
    \ systems. The company has also been using the Internet to run its own business\
    \ online from managing inventories to product orders. When using the Internet,\
    \ CISCO can also keep track of the travel and staff expenses. When exploring different\
    \ possibilities that can be beneficial to your business, you should opt for the\
    \ CISCO systems since the company has a better understanding of how you can get\
    \ your business online. By taking advantage of the experience and knowledge that\
    \ CISCO possesses, you can enhance the progressive growth of your business. "
