    *   建筑外的当地电信线是位于地面以上还是地面以下？根据它们的位置，是否有人可以接入电信线？任何挖掘活动是否会损坏电信线？如果电信线位于电线杆上，它们是否容易受到交通事故的影响而发生位移？


    **应对措施**：在物理脆弱性评估期间，邀请一些专家参与是有益的。他们在设计过程中也能提供帮助。主要的布局位置包括：


    *   主要公用控制设备的位置。它们应该位于带锁的闭门区域内。

    *   建筑内的任何人是否都能方便地访问这些控制设备？开关的盖罩可以作为有效的防御机制。


    ### 办公室布局与用途

    办公室的设计和使用在确保物理安全时可以大大用用场。


    **攻击点**：外部攻击者将利用办公室的一些漏洞。应该考虑的某些攻击点包括：


    *   查看保安员或接待员是否监控建筑内的人流量。

    *   员工的桌上是否放置了任何机密信息？他们的邮件和不同的包裹是否遗落在四周，以至于其他外部人员可以轻易访问？

    *   垃圾桶的位置也很。垃圾箱不应让外部人员轻易访问。此外，办公内是否有碎纸机？


    外部攻击者在寻找可能被轻率处理的信息时，总是会进行翻垃圾。他们总是会寻找备忘录和电话列表。翻垃圾是非常危险的，因为它可能会让你的公司陷入非常不利的地地。


    *   复印室和邮件室安全吗？如果外部攻击者可以轻松进入这些房间，他们就可以窃取一些重要信息并以此对付你。✓

    *   摄像头（CCTV）是否处于全天候监控状态？✓

    *   门窗存在哪些访问控制？部署了哪些安全措施？如果是普通钥匙，谁可以访问？不同的用户通常会共享一些信息，包括可编程键盘的组合。这需要问责制。始终确保你记录了使用某些钥匙和组合的人数。


    **应对措施**：可以实施一些措施来减少组织的暴露风险，其包括：


    *   保安和接待员应该记录出入建筑的人。这种应对措施至关重要。确保每位访客都签了到。此外，对一些不可信任的人也应该进行护送。执行某些政策，让员工始终质问陌生人，同时报告建筑内发生的任何异常行为。还应该放置一些显示“员工专用”的标牌。✓

    *   建筑内应该有一个唯一的出入口。✓

    *   摄像头 ✓

    *   垃圾箱应放置在安全区域。✓

    *   在处理包含敏感信息的纸质文档时，建议使用断孔碎纸机。✓

    *   组合的数量也应该受到限制。✓

    *   生物识别系统应该是有效的。


    ### 网络组件与用途

    在外部攻击者进入建筑后，他们将从**机房**开始：


    *   防火墙和交换机是否安装在可锁的机架中？

    *   笔记本电脑是否储存在安全的办公桌内？

    *   密码是否写在桌面的便利签上？

    *   备份媒体是否在保险箱内？保险箱是否防火？谁可以访问保险箱？

    *   计算机媒体是否容易被盗？


    **攻击点**：进入机房后，他们将寻找以下设备：


    *   路由器。

    *   防火墙。

    *   集线器。

    *   交换机。

    *   可移动存储设备。

    *   硬盘。

    *   网线。

    *   USB 端口。


    这些设备中的某些没有受到组织内部某些安全协议的保护。这些设备中的某些使得外部攻击者很难尝试访问这些设备中的信息。需要考虑的一些主要因素：


    *   无线访问点的信号是否可以被轻易访问？如果不安全，请确保你已经配置了必要的安全协议。✓

    *   路由器、防火墙、集线器和交换机是否可以被轻易访问？这些考虑是非常重要的，以便网络不会被外部攻击者轻易访问。✓


    **应对措施**：上述某些应对措施很容易实施；尽管如此，执行起来可能困难，因为需要人员频繁进行跟进。


    *   这要求你在离开电脑后锁定屏幕。✓

    *   始终使用强密码。✓

    *   笔记本电脑用户应该妥善存放他们的电脑，以免被第三方访问。✓

    *   整台笔记本电脑都需要你使用加密技术。✓

    *   机房应该关闭并受到监控。✓

    *   应该保留一份组织内使用的软件和硬件清单。✓

    *   应使用适当的技术确保计算机媒体的安全。✓

    *   确保网络内所有的安全漏洞都已修补。✓


