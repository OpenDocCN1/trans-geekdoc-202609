    # 第 6 章：物理安全


    在本章中，重点将是：

    - 学习物理安全的重要性

    - 寻找不同的漏洞

    - 针对可能的攻击实施某些应对措施


    物理安全涉及保护物理形式的财产。重点应放在非技术性的组件和技术性组件上。在某些情况下，物理安全会被忽视，但它是信息安全计划中的重要组成部分。如果你能从物理上保护你的场所，你也能轻松地保护不同的信息。


    在本章中，我们将讨论一些目前的物理安全缺陷及其与信息和计算机网络安全的关系。我们还将概述一些合适的应对措施，它们将帮助减少你业务中的物理漏洞。在进行物理安全测试时，你应该尝试入侵系统。从局外者的视角来看很好。在测试阶段，你还可以发现一些需要封堵的安全漏洞。


    ## 物理漏洞


    无论你的计算机网络使用什么技术，它都可能通过不同的技术被黑入，这就是为什么我们正在研究一些物理安全漏洞以及如何修复它们，以便外部攻击者无法利用这些漏洞。在某些小型公司中，某些物理漏洞可能不是主要问题。影响不同物理漏洞的因素包括：


    - 建筑的数量

    - 建筑的大小

    - 员工人数

    - 出口点的位置

    - 机密信息的放置


    存在许多物理安全漏洞。外部攻击者将时刻监视这些物理漏洞。为了保持安全，你应该首先寻找这些物理漏洞。之后，你可以为这些安全问题寻找合适的解决方案。组织内部存在的一些物理漏洞包括：


    - 缺乏前台接待员

    - 未能在建筑内护送访客

    - 某些员工可能会信任某些访客，因为他们可能穿着供应商的制服，并可能声称是为了处理机房的某些问题。

    - 门可能缺乏访问控制。

    - 安全录像可能可以通过网络访问。

    - 机房可能被公众轻易进入。

    - 门被敞敞着。

    - 备份媒体可能存储得非常随意。

    - 可能存在不安全的笔记本电脑和其他计算机硬件。

    - 包含敏感信息的 `DVDs` 和 `CDs` 可能被轻率地丢进垃圾桶。


    当某些物理安全漏洞被利用时，最终可能会发生一些坏事。主要问题是未经授权的人员可能会进入建筑。入侵者进入建筑后，可以进入机房，在此过程中组织的网络将受到破坏。未经授权的用户可能还会窃取某些信息，并利用这些信息来获利。外部攻击者还将利用所有的物理漏洞，包括办公室布局、建筑基础设施和机房设计中可能存在的弱点。


    在某些情况下，你还应该考虑某些因素，例如建筑与警察局和消防站等设施的距离。地区的犯罪统计数据也重要，因为它们能确保你理解你所理解的内容。如果某些物理漏洞被利用，最终可能会发生一些坏事。外部攻击者还会考虑建筑中可能存在的某些弱点。


    ## 建筑基础设施


    建筑的一些关键组件包括 `windows`、`doors` 和 `walls`。外部攻击者将利用这些基础设施。一些攻击点包括：


    - `doors` 是开着的吗？

    - `sensors` 位于哪里？

    - 施工过程中使用了哪些 `materials`？

    - `walls` 是否足够坚固？

    - `hinges` 位于哪里？

    - 施工过程中使用了哪种类型的 `glass`？

    - `windows` 是 `glass` 做的吗？

    - 是否有 `drop ceilings`（吊顶）？

    - 是否有可以推开的 `tiles`？


    ## 应对措施


    某些应对措施可能需要进行一些维护。你可以聘请一些专家在建筑设计过程中协助你。确保你的建筑内部安全达到顶尖水平的技术包括：


    - 使用坚固的 `doors` 和 `locks`。

    - 确保 `alarm system` 受到持续监控。在所有访问点还应放置一些基于网络的 `CCTV cameras`。

    - `computer room` 应该有没有 `windows` 的 `walls`。

    - `exit points` 应有适当照明。

    - 在建筑内的某些点还应放置 `Mantrap`（人笼）。

    - `fence` 可以由 `barbed wire` 制成。


    ## 设施


    考虑 `computer room` 中使用的某些设施是好的。这些设施包括 `power`、`fire suppression` 和 `water`。在物理安全评估过程中应始终考虑这些因素。这些设施在应对火灾事故时非常有用。


    ### 攻击点（与设施相关）


    入侵者可以利用一些与设施相关的漏洞。通常被忽视的一些常见攻击点包括：


    - `power-protection equipment`，包括 `generators` 和 `surge protectors`。有时，它们很容易触及，外部攻击者可以轻易地开启和关闭它们。

    - 当发生停电时，采取了哪些物理安全机制？始终评估物理安全机制是否运行良好，因为在停电时，人们可以轻易进入 `computer room`。

    - 正在使用哪些 `fire suppression` 和 `detection devices`，它们位于哪里？这些设备包括 `fire extinguishers`、`alarm
    sensors` 和 `sprinkler systems`。始终确定外部攻击者是否可以操纵这些设备每一个。

    - `gas` 和 `water shutoff valves` 位于何处？可以轻易访问吗？


