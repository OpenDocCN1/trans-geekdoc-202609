    \ the attack at ease. They will start gathering some information about the victims.\
    \ To avoid raising any red flags, the social engineers always act slowly. Since\
    \ information gathering is an important step in social engineering, reinforcing\
    \ some security measures that may hinder such processes is possible. Regardless\
    \ of the research method being used by a hacker, the important pieces of information\
    \ needed during the hacking process include internal phone numbers, a list of\
    \ employees, and a company calendar. Using the Internet The Internet is used as\
    \ a basic research medium. A lot of information can be accessed using the search\
    \ engines. What matters most is you need to gather correct keywords. By gathering\
    \ different pieces of information, you can carry out a social engineering attack.\
    \ At times, people pay a certain amount of money to some professionals who may\
    \ carry out a comprehensive background check. The search can allow you to gain\
    \ access to private and public information about specific people. Dumpster Diving\
    \ Dumpster diving is risky to some extent and is also messy; nevertheless, it\
    \ is very effective when looking for specific pieces of information. When using\
    \ this method, you will have to ravage through trash cans while looking for information\
    \ about a specific firm. Dumpster diving can also allow you to gain access to\
    \ some confidential pieces of information since the employees may try to assume\
    \ that, when some information is sent to the trash can, it is not accessible by\
    \ other individuals. Everything that you throw away may harbor some important\
    \ pieces of information. A social engineer will always look for the following\
    \ types of documents: \n\n*   Organizational charts \n\n*   Internal phone lists\
    \ \n\n*   Employee handbooks in which the main focus will be on the security policies\
    \ \n\n*   Password lists \n\n*   Network diagrams \n\n*   Spreadsheets and reports\
    \ \n\n*   Meeting notes \n\n*   E-mail printouts that contain some sensitive information\
    \ \n\nPaper shredding comes in handy, however, it is only suitable if the papers\
    \ are shredded into tiny bits that cannot be reassembled. Some shredders shred\
    \ papers into long strips. The social engineers will always assemble these papers\
    \ and they will then gain access to some confidential pieces of information. They\
    \ will just have to spare some time and use some clear tape and the documents\
    \ will be pieces back together. A hacker can gather some confidential pieces of\
    \ information from conversations that also took place in areas such as coffee\
    \ shops or restaurants. Sensitive pieces of information can also be gathered from\
    \ the people who also speak loudly when they are conversing over the phone. In\
    \ some instances, the external attackers also look for the DVDs and CD-ROMs that\
    \ have been placed in the trash can. Phone Systems An attacker can gain access\
    \ to different pieces of information using the dial-by-name feature that is inbuilt\
    \ into the voicemail systems. Such a feature can be accessed by pressing 0 after\
    \ you have contacted the company using a person’s mailbox. Such a trick comes\
    \ in handy especially during the afterhours. During such hours, there will be\
    \ no one present to answer your phone calls. Attackers will also use certain techniques\
    \ to make sure that their identity has been concealed. Some of the techniques\
    \ used by hackers include: \n\n*   Residential Phones: Such phones can help to\
    \ conceal the user’s caller ID. You just have to dial \\*67 before dialing the\
    \ specific number that you want to call. \n\n*   Business Phones: In any business,\
    \ it may be difficult to spoof when you are using a phone switch. The attacker\
    \ needs a user guide as well as the administrator passwords for the phone switch\
    \ software being used within the organization. In some switches, a source number\
    \ can be keyed in. The number may also be falsified. \n\n*   VoIP Servers: Many\
    \ servers can be found as open source and they can also be used to configure any\
    \ number. The social engineers can find some important pieces of information when\
    \ using such a technique. The attacker can listen to different pieces of information\
    \ through podcasts and voicemail messages. They can also study the voices of the\
    \ victims and they will also be able to impersonate them perfectly when the time\
    \ comes to visit the organization physically. \n\nBuilding Trust Trust cannot\
    \ be easily gained and it can also be easily lost. Social engineering relies heavily\
    \ on trust. People trust each other unless the situation is dire. In most cases,\
    \ people are kind-hearted, and if they have built some trust amongst each other,\
    \ some requests may seem reasonable. People like to work together in teams while\
    \ at the workplace. The main issue is that some of these people do not understand\
    \ the repercussions that may arise when they issue many pieces of information\
    \ to a “trusted” source. Social engineers take advantage of the trust, and they\
    \ will make sure that they have achieved their goals either way. Some of the social\
    \ engineers can gain the trust of some of the employees within the organization\
    \ easily. The social engineers use the following techniques to earn peoples trust:\
    \ \n\n*   Likability: It is easy to relate with a nice person and that is why\
    \ social engineers are friendly. They do not go overboard in any instance so they\
    \ can easily gain access to the information that they need. Social engineers will\
    \ also take time to build a relationship with people whom they share common interests.\
    \ They can use the information that have gained to determine the likes of the\
    \ victims. \n\n*   Believability: Social engineers tend to know whether they are\
    \ likeable or not. Social engineers will always use impersonation to their advantage.\
    \ They can pose as new employees and they will always approach people that do\
    \ not know them physically within the organization. They are also very influential\
    \ and they can do nice things so that they may lure their targets accordingly.\
    \ At times, they may also pose as team players as they try to build a relationship\
    \ with some of the employees within the organization. \n\nExploiting a Relationship\
    \ After gaining the trust of some of the employees, the social engineers can easily\
    \ coerce them to give up different pieces of information that may come in handy\
    \ during the network hacking process. Deceit Using Words and Actions Social engineers\
    \ will gain access to some inside information from each of their victims by using\
    \ different techniques. They will initiate a conversation and make sure that the\
    \ victim cannot suspect anything. If a social engineer makes a sloppy move when\
    \ carrying out a social engineering attack, they can easily get caught. Some of\
    \ the red flags include: \n\n*   Mentioning some names of the prominent employees\
    \ within the firm \n\n*   Acting eager \n\n*   Bragging about the authority they\
    \ have within an organization \n\n*   Issuing certain threats \n\n*   Acting nervous\
    \ (the body language tells a lot and it can easily give them away) \n\n*   Experiencing\
    \ different psychological changes \n\n*   Placing some emphasis on certain details\
    \ \n\n*   May appear like they are being rushed \n\n*   Refusal to issue some\
    \ information \n\n*   Volunteering to issue different pieces of information while\
    \ also answering some questions that they have not been asked "
