  trans: "\n\n1. 有巨大的人口正在使用互联网。\n2. 计算机网络提供了某种形式的匿名性。\n3. 目前有大量的黑客工具。\n4. 有许多无线网络确保了黑客可以轻松隐藏他们的数字足迹。\n\
    5. 在目前开发的某些数据库中，代码库已经变得复杂。\n6. 大多数儿童都拥有计算机知识。\n7. 黑客在被捕后不太可能受到调查。\n\n某些攻击很少被报道，而且当黑客被捕获时，他们不会被起诉。当黑客被捕获时，他们主要会谈论他们的服务对社会有何益。他们还会说明他们正在研究目前的一些漏洞。无论黑客是否被捕获，他们关心的是获得了“名声和荣誉”。当他们被当局捕获时，他们通常赖生存的奖励机制就会受到威胁。当黑客未被捕时，他们的恶意活动将不会被察觉。有时，为了股东保持沉默是好事，因为他们在获得此类负面消息时可能会恐慌。目前的隐私和安全法律正在快速变化，因为必须提供泄露通知。内部泄露案例也变得越来越常见，它们有助于展示某些机构内部发生发生的情况。当发生内部泄露时，责任方被迫辞职。目前，当发生泄露时，联邦州和国际法律法规规定此类活动应向相关部门报告。无论泄露是内部还是外部，还是备份带丢失，都应该报告，因为它们会以这种或其他方式影响你的业务。\n\
    \n# 计划与执行攻击\n黑客使用不同的攻击风格。某些黑客通常会提前为大型攻击做准备。他们总是先收集各种信息。他们收集信息的技巧是有方法论的。追踪使用这种技术的黑客也很困难。其他黑客，主要是“脚本小子”（script\
    \ kiddies），总是在尝试考虑其行为后果之前采取行动。这样的黑客可能会尝试在甚至不隐藏身份的情况下访问特定的网络。要捕获这样的黑客很容易，因为他们总是在没有计划的情况下行动。恶意用户是众所周知的，他们拥有关于组织内部计算机网络的知识。有时，此类黑客会尝试对他们非法访问的网络进行试探和刺探。他们有时也会做一些愚蠢事，网络管理员也可以追踪到他们。尽管黑客已经形成了地下社区，但大多数黑客都克制与他人分享信息。他们大多数时候都是独立工作。当黑客进行通信时，他们通常利用私密留言板、黑客网站、匿名邮箱地址和互联网中聊天（`IRC`）。你可以登录这些网站之一，并了解更多关于黑客正在做什么；这些网站可以在暗网上找到。\n\
    \n# 关于暗网以及如何使用 Tor 浏览器访问\n万维网非常庞大。它包含了大量信息，为了浏览所有信息，你可能花费大量时间。有表面网和暗网/深层网。一些常见的网站包括\
    \ `Wikipedia` 和 `Google`。暗网属于那些避免公开曝光的政府和公司。在暗网中，你可以找到政府报告、医疗记录和财务记录。此类信息无法通过搜索引擎访问，并且受到强大的防火墙保护。在暗网中，你将暴露在各种形式的危险之中。\n\
    \n## 暗网被隐藏的主要原因\n存储在暗网上的某些信息并不是公众查看的；这就是暗网被隐藏的原因。只要这些信息被隐藏，它们推测就是安全的。主要问题是这些信息存在于网上，因为它们是以表面网应用程序的形式存在的。至于暗网，它有点复杂。尽管它是万维网的一部分，但它运行在私有服务器上，且只能通过特定方式访问信息。\n\
    \n## 如何访问暗网网站\n在表达对访问暗网的兴趣之前，你应该了解该平台上存在许多非法活动。你可以采取必要的措施；然而，完全匿名是不可能的。请自担访问该平台。\n\
    \n*   下载并安装 Tor 浏览器。Tor 浏览器允许你访问暗网。该平台的创建是为了保护美国的情报信息。通过浏览器，你可以访问位于暗网的 `.onion`\
    \ 网站。在使用 `Tor` 时，你可以匿名浏览。该浏览器还会让用户了解可能暴露其身份的不同情况。\n\n![Tor Browser](img/rsrcBU.jpg)\n\
    \n*   使用虚拟专用网络 (`VPN`）。虚拟专用网络确保你可以匿名浏览互联网。你的当前位置会被掩盖，并将处于一个假设的位置。要注意 `Tor` 只掩盖身份，但该平台不掩盖你的位置。有很多\
    \ VPN 服务，可以使用 `NordVPN` 或 `ExpressVPN`。\n\n*   `DuckDuckGo`。在导航暗网时，`DuckDuckGo`\
    \ 是你的朋友。它是一个帮助你操作暗网的搜索引擎。你可以通过 DuckDuckGo 搜索引擎轻松访问暗网索引网站。\n\n*   始终注册安全的邮箱地址。某些邮箱地址是安全的且不可追溯的。你可以使用这些邮箱地址注册\
    \ `.onion` 网站。你可能会考虑的一些安全邮箱平台包括：\n    *   `TORbox`\n    *   `ProtonMail`\n   \
    \ *   `Mail2Tor`\n\n"
