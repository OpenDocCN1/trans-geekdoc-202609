    执行伦理黑客攻击时，一些合适的实践包括：


    ### 时机

    关键在于时机。时机概念适用于伦理黑客攻击等活动。在进行某些测试时，你应该确保组织内部的业务流程不受影响。应该避免的有害情况包括沟通误解。此外，避免对高流量的电子商务网站造成
    `Dos` 攻击也是好的，特别是在白天。如果许多人正在进行某个特定项目，他们应该对时机达成一致，以便实现最终目标。有时，始终通知 `ISP`（互联网服务提供商）是有益的。在他们意识到你将要测试系统以寻找某些漏洞后，他们就不会阻止你的任何流量，以防他们怀疑防火墙上出现了通常的任何恶意行为。测试时间线应该包含执行不同测试的某些短期日期。还应该概述里程碑。你可以制定一个时间表并将数据输入电子表格，以便为其提供某种适当形式的指导。


    ### 特定测试

    你可能被要求执行渗透测试。此外，你可能想进行某些特定测试，包括破解密码和尝试访问不同的 Web 应用程序。有时，人们在评估网络时还会进行社会工程测试。无论进行什么种测试，你可能都不想泄露有关测试细节的某些信息。记录重要的主要原因是它有助于消除未来可能出现的任何形式的误解。有时，人们还会利用屏幕操作。你可能对本应执行的通用测试一无知；然而，如果你使用自动化工具，可能无法更多地了解你所执行的测试。


    ### 盲测与已知评估

    对你将要测试的系统拥有大量知识是有益的。虽然这种知识可能并非必须，但你至少应该对你要攻击的系统有基本的了解，以便通过确保你没有留下任何可以追溯到你的数字足迹来轻松地保护自己。获取此类信息并不困难，你只需要调查，以便对你想要访问的系统有更好的理解。当你进行一些背景研究时，你将不会盲目地攻击系统。在进行评估时，你使用的技术始终取决于你的需求。最合适的方法是计划进行无限攻击。具有恶意意图的黑客在使用有限范围时不会攻击系统。此外，确认你是否想要执行测试，以及这些测试不应被网络管理员以及安全提供商检测也是好的。你还必须执行物理安全测试和社会工程测试。如果有太多人知道你正要测试系统，他们可能会改变习惯，导致测试结果不准确。然而，这并不意味着你不应该通知任何人。你应该组织内有一个主要联系人，并且他们应该具有权威。


    ### 位置

    你正在执行的测试决定了你应该从哪里运行它们。主要目标是从恶意黑客可以轻松访问的位置对网络进行测试。你也可以确定网络是否会被组织内部的人黑入；因此，确保所有基础都已覆盖是好的。你可以结合不同的测试，并可以在内部和外部执行它们。你可以执行的某些测试包括破解密码和评估网络基础设施。有时，寻求可能了解如何黑入网络的外部人员的服务是明智的，因为他们可以对防火墙、路由器和不同的
    Web 应用程序等设备进行测试。对于外部攻击，你应该有一个稳定的互联网连接。在某些情况下，你可能还必须使用外部代理服务器。你也可以为你的电脑分配一个无法追溯到你的适当
    `IP address`。为了获得更好的网络视图，你应该将其插入到防火墙外的网络中。内部测试相当简单，因为你只需要对网络和组织的服务器拥有某些物理访问权限。你还可以使用
    `DLS` 线路或电缆调制解调器。


    ### 如何应对网络中漏洞

    涉及到漏洞时，你需要一种合理的技术来封堵组织内部存在的安全漏洞。你不一定需要一直黑入系统，因为这最终会导致系统崩溃。你需要遵循你概述的路径进行，直到你无法再访问网络为止。如果你有任何疑问，你应该已经概述了目标，并在确保每个目标都已实现后停止。如果你发现了某个漏洞，你应该联系合适的人，以便他们能够快速修复问题。如果你不及时修复问题，某些人可能会利用当前的漏洞，并造成一些不可逆转的损害。员工也应该尝试确保他们没有违反他们的雇佣协议。


    ### 愚蠢的假设

    当你假设某些事情时，你可能无法实现你的目标。以下是人们在应该黑入网络时产生的一些假设：


    1. 网络在测试过程中是可用的。

    2. 你可以假设你拥有所有必要的测试工具。

    3. 你利用的测试工具可能会尽量减少网络崩溃的可能性。

    4. 你可能知道每项测试的所有风险。


    你应该记录你所拥的所有假设。


    ### 选择工具执行安全评估

    你使用的安全评估工具取决于根据你将运行的测试而的不同因素。你可以使用电话或网络进行一些伦理黑客测试。在进行全面测试时，你必须具备必要的工具。如果你不知道应该使用的特定工具，你将在前面的章节中学习更多关于黑入系统时使用的某些工具。这些工具有些是免费的，有些是商业的；你可以相应地使用它们来实现目标。你必须了解你所掌握的所有黑客工具的应用。某些工具还附有说明书，而某些工具的说明书编写得不好，这可能令人沮丧。你可以搜索一些新闻组和留言板，以更多地了解某些工具的运行方式。某些工具可能证明是有害的，因为它们可能会影响网络的健康。在使用某些工具时，你应该小心。你应该对所有可用选项有深入的了解。如果你对某些工具没有深入的了解，在测试过程中就不应使用任何工具。这些预防措施可以确保你不会受到
    `Dos` 条件的影响。此外，你不会在过程中丢失任何数据。你可能还不理解某些开源工具的重要性。如果某些免费软件工具证明不值当，你可以去购买商业版本，因为它们可能证明是有效的。某些工具可能很贵；但最重要的是它们的功能。始终确保你的钱物有所值。

