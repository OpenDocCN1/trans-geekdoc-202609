    \n# Planning and Performing an Attack\nThere are different attacking styles used\
    \ by hackers. Some hackers normally prepare for a large attack in advance. They\
    \ always gather various bits of information first. The techniques they use to\
    \ gather information are methodological. It is also difficult to track a hacker\
    \ who uses such a technique. Other hackers and mostly the script kiddies always\
    \ act before trying to look into the consequences of their actions. Such a hacker\
    \ may try to access a specific network without even concealing their identity.\
    \ It is easy to catch such a hacker since they always proceed without a plan.\
    \ Malicious users are widely known, and they possess a lot of knowledge about\
    \ computer networks within organizations. At times, such hackers try to carry\
    \ out prodding and poking into a network that they are accessing illegally. They\
    \ also do stupid things sometimes, and a network administrator can also track\
    \ them down. Although hackers have formed underground communities, most of the\
    \ hackers refrain from sharing information with other people. They work independently\
    \ most of the time. When hackers are communicating, they normally make use of\
    \ private message boards, hacker websites, anonymous email addresses, and the\
    \ Internet Relay Chat (`IRC`). It is possible to log into one of these sites,\
    \ and you may learn more about what hackers are doing; these sites are found on\
    \ the Dark Web.\n\n# About the Dark Web and how to Access It Using the Tor Browser\n\
    The World Wide Web is quite large. It contains a lot of information and to peruse\
    \ through all this information, you might take a lot of time. There is the surface\
    \ web and the dark web/deep web. Some of the common sites include `Wikipedia`\
    \ and `Google`. The dark web belongs to the governments and the corporates who\
    \ are avoiding public exposure. In the dark web, you can find government reports,\
    \ medical records, and financial records. Such information cannot be accessed\
    \ using search engines and it is also protected using powerful firewalls. In the\
    \ dark web, you will be exposed to various forms of danger.\n\n## The Main Reason\
    \ Why the Dark Web Is Hidden\nSome of the pieces of information stored on the\
    \ dark web are not meant for the public eye; that is why the dark web is hidden.\
    \ As king as such information is hidden, it is presumably safe. The main issue\
    \ is that the information is present on the Internet since it is in the form of\
    \ surface web applications. As for the Dark Web, it is somewhat complicated. Although\
    \ it is a part of the World Wide Web, it runs on the private servers, and information\
    \ can only be accessed through specific means. The high anonymity levels come\
    \ in handy and the authorities cannot easily shut down some of these sites. Since\
    \ the Dark Web ensures there are high anonymity levels, people have taken advantage\
    \ of the situation and they are even engaging in the sale of illegal substances\
    \ such as drugs. You may have come across the term `cybercrime`. Also, you may\
    \ have heard of some cybercriminals who are mainly after money. They collect various\
    \ forms of data including personal information and credit card information. All\
    \ these pieces of information can be traded on the dark web. There are also illegal\
    \ business dealings taking place on the Dark Web. Some of these dealings include\
    \ the sale of drugs, firearms, and illegal wildlife.\n\n## How Do You Access the\
    \ Dark Web Sites?\nBefore you express your interest in accessing the dark web,\
    \ you should understand that there are many illegal things happening on the platform.\
    \ You may take the necessary precautions; however, it is not easy to stay fully\
    \ anonymous. Access the platform at your own risk.\n\n*   Download the Tor Browser\
    \ and Install It. The Tor browser allows you to gain access to the dark web. The\
    \ platform was created to ensure that the intelligence information in the United\
    \ States was safeguarded. Using the browser, you can access `.onion` websites\
    \ that are situated on the dark web. When using `Tor`, you can browse anonymously.\
    \ The browser will also enlighten a user about the different things that can reveal\
    \ their identity.\n\n![Tor Browser](rsrcBU.jpg)\n\n*   Use a Virtual Private Network\
    \ (`VPN`). A virtual private network ensures that you can browse through the Internet\
