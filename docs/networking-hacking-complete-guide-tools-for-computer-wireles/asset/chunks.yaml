    * Having access to some pieces of information that cannot be accessed by outsiders

    * Asking some queer questions

    * Using some slang used within the organization

    * Misspelling some words


    A professional social engineer will see to it that they are not sloppy and they
    will conceal their motives. They have accorded the victim a favor first and they
    will, in turn, ask for some assistance from the person that they had helped. Such
    a trick has proven to be very effective. At times, such people also carry out
    reverse social engineering. They will offer their assistance when it comes to
    handling a specific problem. After fixing the problem, they can be termed as heroes.
    Social engineers mainly target some of the unsuspecting employees and they will
    ask for a favor. Many people fall into this trap. To the social engineers, impersonation
    is easy. They have a fake badge and `ID` so that they can fit easily within the
    target organization.


    ## Deceit Using Technology


    Technology makes sure that some things are easier especially for social engineers.
    Some of the malicious requests are issued through a computer or any other electronic
    device. It is also easy to spoof details such as e-mail addresses, computer names,
    network addresses, and fax numbers. Hackers can easily deceive their targets using
    technology. They can use e-mails while asking victims for some critical information.
    The social engineers usually attach links to these e-mails and the victim will
    be redirected to a website that looks legitimate and presentable. Some of the
    pieces of information that can be accessed using the above technique include passwords,
    `user IDs`, and social security numbers. The external attackers may also use such
    a technique on platforms such as `Myspace` and `Facebook`. Some of the phishing
    and spam messages make use of such a technique. The users are forced to let their
    guard down using different techniques, and they may end up opening some of the
    attachments. The e-mails are also presented professionally. A victim is duped
    into disclosing different bits of information. A hacker will always deploy some
    of these social engineering techniques after they have accessed the network so
    they can easily send some messages and create some pop-up windows. Some of these
    tricks can also be used when engaging in cellphone messaging. In some instances,
    the external attackers will pose as `Microsoft` employees, posing as a vendor.
    After the victim has installed the “patch,” their computers will be infected by
    different programs such as `Trojans` and `worms`. The attacker can then gain access
    to different pieces of information by creating a backdoor within the network.
    The backdoor will allow the attacker to gain access to different pieces of information
    freely using the victim’s computer and they can also launch different attacks.
    The `worms` and `Trojans` can come in handy when performing a social engineering
    attack. There are different types of `worms`. After the victim opens some of the
    spam emails, it will be too late. The computer will be already infected and they
    will not achieve what they initially wanted. Some of the social engineering attacks
    that are conducted using technology are performed anonymously. The attacker will
    make use of an `Internet proxy server`, `remailers`, `anonymizers`, and some `SMTP
    servers` to make sure that there is an open relay. When people become victims
    of instances whereby they are supposed to issue some personal information that
    is also confidential, they should know that they cannot track the source of the
    social engineering attack.


    ## How to Counter Social Engineering Attacks


    There are different ways through which you can safeguard your network from a social
    engineering attack. Although the security systems may also be strong, some of
    the naïve network administrators may be manipulated by the social engineer. Some
    security policies can ensure that social engineers cannot access the network,
    and they include:


    * Data classification

    * Setting up `user IDs` for all the employees and contractors

    * Getting rid of the `IDs` of the employees who are no longer working within the
    organization

    * Establishing acceptable computer usage

    * Resetting and also setting password

    * Handling confidential information appropriately

    * Responding to some security incidents accordingly

    * Escorting guests


    Some of these policies can be enforced for all the employees within the organization.
    The policies should also be kept up to date for all the individuals within the
    organization. The end-users should also be notified about some of the policy changes.
    The best line of defense when trying to prevent a social engineering attack is
    to have well-trained employees who know how they should respond to different social
    engineering attacks. By ensuring that you have raised awareness, it is possible
    that the social engineering attacks do not take place. During the training process,
    the focus should be more on some of the security policies. You can also outsource
    the security training services. The employees should also take security training
    seriously. Some of the tips that can help you to get rid of social engineering
    attacks on a long-term basis include:


    * Security awareness and training should be termed as a business investment.

    * The users should also be trained to be always aware of some of the security
    policies.

    * Ensure that the employees are responsible for some of the privacy and security
    tasks within the company.

    * Ensure that the training content has been tailor made depending on the needs
    of your organization.

    * Come up with a social engineering awareness program that also aligns with your
    business functions.

    * Make sure that your messages are non-technical.

    * Come up with incentive programs for reporting and preventing some incidents.

    * Always lead by example.


    There are also some tips that you can share with the employees within the company:


    * You cannot share some confidential bits of information with other people unless
    you can verify that they are indeed they claim to be. At times, a request can
    be made through a phone call in such instance, you should verify the identity
    of the caller first.

    * Do not click any e-mail links that will redirect you to a website that needs
    to be updated. Some of these emails are usually from some sources that cannot
    be trusted.

    * Always be cautious when sharing some confidential information on different sites
    including `LinkedIn` and `Facebook`. Always be on the lookout for people who claim
    to be your “friends”. Some of them may have some malicious motives.

    * Never open an e-mail attachment from a total stranger.

    * Escort each of the guests within the building.

    * Do not give out any of your passwords.


    Other suitable suggestions include:


    * Strangers should not easily access your network regardless of whether it is
    wired or wireless. An attacker can place some `malware` and a `network analyzer`
    into the network after accessing it for a few seconds.

    * All information should be classified. The employees should also be trained on
    how to handle different pieces of information.

    * Develop some policies that are supposed to enforce the media and documents on
    the computer. The policies will make sure that the data can be handled carefully
    and it will also stay where it should be.

    * The preferred paper shredded should carry out cross-shredding. There are some
    companies that carry out paper shredding and they offer quality services. Some
    techniques that come in handy when reinforcing the content on formal training
    include:


    * The training launches and the employee orientation

    * Brochures that contain some information about how to survive social engineering
    attacks

    * Trinkets that can also be used as mouse pads screen savers, and sticky notes

