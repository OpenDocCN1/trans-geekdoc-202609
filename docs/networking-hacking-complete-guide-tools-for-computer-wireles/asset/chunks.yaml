    ## 2. Come up with a schedule that will start and end at a specific moment. The
    hacking timeline should also be outlined in the form of specific times and dates.


    It may take some time to establish all of your goals; nevertheless, it will all
    be worth it. The goals will offer some guidance. If you have any concerns, you
    should always refer to all of the goals that you have formulated so that you may
    stay on track.


    ## How to Determine the Specific System to Hack


    You may have numerous computer networks, but you cannot assess all of them at
    the same time. Ensure that the hacking project has been broken down into bits
    so that the entire process may be easily manageable. You can decide the specific
    systems that you want to test based on the analysis that you have carried out.
    Some of the questions that you should answer in the process include:


    1. Which are the most critical systems? There are some systems which when accessed
    without the necessary authorization will cause some trouble and you may also incur
    great losses.

    2. Which systems look like they can be easily hacked?

    3. Which systems have not been documented accordingly?


    After formulating all of your goals, you can now decide the specific system that
    you want to test. The main reason why the formulation of goals is important is
    that they help you to outline your expectations and you can also make a better
    estimate of the time and resources that you will use during the entire process.
    Some of the devices that you may need to test include: ![Image result for routers
    and switches](rsrcFA.jpg)


    1. Routers and switches - a switch connects computers on one network whereas routers
    connect numerous networks together.

    2. Firewalls

    3. Web, applications, and database servers

    4. Wireless access points and bridges

    5. E-mail and files

    6. Workstations, tablets, and laptops

    7. Mobile devices used to store confidential pieces of information

    8. Client and server operating systems


    When you are dealing with a small network, it is possible to test everything.
    Some of the public facing hosts should be tested, and they include the web servers
    and emails. It is also good to that the ethical hacking process is also flexible.
    Always start with the networks that seem vulnerable. Also, consider the following
    factors:


    1. The specific operating system used to run the network

    2. The applications present in the network

    3. The specific amount of critical information that has been stored on the network


    ## Attack Tree Analysis


    The attack tree analysis is the process whereby a hacker creates a flow chart
    that outlines how they will attack a certain network. The attack tree analysis
    is normally used by security teams when they are performing a high-level risk
    analysis. In most cases, such an analysis is carried out when planning out a new
    network project. If you want to improve your hacking skills, you should have planned
    each of your attacks methodologically. The main issue is the amount of time needed
    to draw the attack trees. Also, a lot of expertise is needed in such a case. Nowadays,
    it is also possible to use a computer to come up with the attack tree. Some of
    the tools that you may use include the `SecurITree`. An example of the attack
    tree analysis is as shown below. ![Image result for a sample SecurITy attack tree
    analysis.](rsrcGA.jpg)


    Ethical hacking is more detailed as compared to vulnerability assessments. As
    an ethical hacker, you are supposed to look for a lot of information about different
    systems. For instance, you should look for information about the organization
    and its network. Since ethical hacking is flexible; you can utilize different
    hacking techniques. If you are undecided on where to start, you should assess
    a system that has great visibility. You may also focus more on the firewall of
    the specific network.


    ## Formulating Testing Standards


    When there is miscommunication, the system can easily crash when carrying out
    ethical hacking tests. To avoid coming across such challenges, you should come
    up with document testing standards. The standards should include:


    1. Specific tests that are being performed

    2. When are the tests being performed as well as the overall test time

    3. The amount of knowledge that you possess about a specific system

    4. How each of the tests will be performed and the `IP address` that will be used

    5. The best step to take after discovering different vulnerabilities

