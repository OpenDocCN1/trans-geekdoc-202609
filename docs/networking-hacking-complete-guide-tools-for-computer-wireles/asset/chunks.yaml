    ### 1. 高级网页搜索

    * 执行高级网页搜索。`Google` 提供了一些高级搜索选项，你也可以找到一些可以链接回特定公司网站的站点。此类搜索将确保你获取了有关目标公司内部的供应商、合作伙伴和客户的相关信息。

    * 通过使用某些开关，你可以对公司网站进行深层次的挖掘。


    ### 2. 网页爬取

    网页爬取工具包括网站复制器 `HTTrack`，你也可以通过下载一些公开访问的文件来镜像一个公司。你还可以在离线状态下检查网站。你可以深入研究以下领域：

    * 网站的布局和配置。

    * 可能较难访问的文件和目录。

    * 脚本源代码以及 HTML 代码，也可以被轻松访问。

    * 命令字段。


    某些注释字段还包含某些可能证明有用的信息，包括电子邮件地址、内部 IT 人员姓名、开发者、软件版本、服务器名称、关于代码运行方式的注释以及 IP 划分方案。


    ### 3. 网站

    有些网站可以提供有关各种组织及其员工的各种信息。


    ### 4. 网络映射

    当你对网络进行映射时，可以去搜索一些公共资源和数据库，并查看人们对你的网络了解多少。其中一些网站包含了互联网上随处可见的 `Whois` 工具，这些工具也可用于检查互联网上某些域名。在启动社会工程学攻击或扫描网络时，这种工具会非常有用。


    ### 5. Google Groups

    `Google Groups` 可以帮助揭示有关组织的一些网络信息。通过此类平台可以访问的一些信息包括 IP 地址、域名和用户名。你还可以获取其他形式的私有信息，包括：

    * 显示了过多关于当前网络和计算机系统信息的留言板。有许多人在此类平台上发布信息，但他们并没有意识到这些信息正在分享给全世界。

    * 关于公司的机密信息，这些可能由客户和员工发布。


    在发现某些机密信息已分享在某些在线平台上后，你应该将其删除。


    ### 6. 隐私政策

    务必始终检查你网站上的隐私政策。你的所有用户都需要知道他们在访问你的网站时被收集的信息。此外，他们应该知道自己的信息是如何受到保护的。隐私政策通常由律师编写，他们通常不会深入研究有关你安全基础设施的信息。


    ### 7. 系统扫描

    通过参与主动信息收集，你可能获得有关你网络的更详细的信息，你还可以从黑客的角度来看待问题。例如，你可以执行以下操作：

    * 利用通过 `Whois` 搜索收集到的信息，测试每个密切相关的主机和 IP 地址。这些信息包括主机名的确定、IP 地址、运行的协议、可用共享、开放端口、应用程序和正在运行的服务。

    * 扫描内部主机并遵守你的测试范围。某些外部人员无法查看这些主机中的某些；尽管如此，你仍需要测试它们，以便查看某些违规人员可能访问哪些内容。


    在某些情况下，黑客可能已经访问了系统，并且可以从内部操纵一切。为了安全起见，你应该检查整个系统以寻找任何漏洞。如果你不相信你的扫描系统是可靠的，可以使用不同的系统并在虚拟机软件上运行它们。


    ### 8. 主机

    在扫描过程中，也要记录一些内部网络内可以访问的主机。始终从使用这些工具 ping 一些主机开始：

    * 位于操作系统中的基本 `ping` 工具。

    * 第三方工具允许人们 ping 多个地址，包括 `SuperScan` 和 `NetScanTools Pro`。你还可以使用如 `whatisipaddress.com`
    等站点，向你展示你在浏览互联网时网关 IP 地址的呈现方式。该网站将让你看到外部人员可以看到的 IP 地址。


    ### 9. 开放端口

    你可以使用不同的工具扫描开放端口，包括：

    * `Nmap` 和 `Superscan` 可以帮助扫描网络端口。

    * 你可以使用网络分析器监听网络流量。你可以包含的一些工具包括 `Wireshark` 和 `OmniPeek`。


    在内部执行扫描很容易。你应该将计算机连接到网络并加载不同形式的软件。你也可以在网络外部进行扫描，在插入路由器之前，你应该先为你的计算机分配公网 IP 地址。在这种情况下，你的计算机没有连接到互联网。无论你是否连接到互联网，连接都将有效。此外，你需要确定开放端口上运行着什么。作为一名伦理黑客，你应该获取此类信息信息：

    * 正在使用的协议

    * 在主机上运行的服务，可能包括数据库应用程序、Web 服务器和电子邮件

    * 可用的远程访问服务，可能包括远程桌面

    * VPN 服务

    * 网络共享所需的身份认证


    ### 漏洞评估

    在找到所有安全漏洞后，你应该继续研究你的网络中存在的某些漏洞。在测试过程之前，你还应该进行手动搜索。你可以对黑客使用的留言板、漏洞数据库和网站进行一些研究。某些分类网站有助于列出不同的漏洞。在寻找这些漏洞时，你会发现某些漏洞是通用的。有时，你可能被迫查看某些厂商的网站，以便了解更多关于当前漏洞的信息。可以帮助展示不同漏洞的站点包括
    [`www.sans.org/top20](http://www.sans.org/top20)。该网站帮助展示超过 20 种漏洞。漏洞列表由 SANS 组织编制。


    1. **手动评估**：通过与端口建立连接，你可以评估一些潜在的漏洞。某些系统也可以手动评估，包括一些 Web 应用程序。如果你有充足的时间，可以手动执行这些测试。


