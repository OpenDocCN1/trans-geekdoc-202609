    *   Are the local telecom wires running outside the building situated above or
    below the ground? Depending on their location, can someone tap into the telecom
    wires? Can any digging activity damage the telecom wires? If the telecom wires
    are situated on telephone poles, are they vulnerable to traffic accidents that
    may displace them?


    **Countermeasures**: It is good to involve some experts during the physical vulnerabilities
    assessment period. They will also help during the design process. The major placements
    include:


    *   The location of the major utility controls. They should be located in closed
    doors that are also lockable.

    *   Can the controls be accessed easily by anyone in the building? The covers
    for the on and off switches act as effective defense mechanisms.


    ### Office Layout and Usage

    The design of the office and the usage can come in handy when ensuring that there
    is physical security.


    **Attack Points**: The external attackers will take advantage of some of the office
    vulnerabilities. Some of the attack points that should be considered include:


    *   Look into whether the security guard or the receptionist monitors the traffic
    within the building.

    *   Do the employees possess any confidential information that is placed on their
    desks? Are their mails and different packages left around lying around such that
    they can be easily accessed by other external parties?

    *   The location of the trash cans also matters. The dumpsters should not be easily
    accessed by external parties. Also, are there are shredders within the office?


    The external attackers will always carry out dumpster diving when looking for
    some information that may have been disposed recklessly. They will always look
    for memos and phone lists. Dumpster diving is dangerous since it may expose your
    company badly.


    *   Are the copy and mail rooms secure? If an external attacker can easily access
    these rooms, they can steal some important pieces of information and they will
    use it against you. ✓

    *   Are the CCTV cameras being monitored on a full-time basis? ✓

    *   Which access controls are present on the windows and doors? Which security
    measures have been deployed? If there are regular keys, who can access them? Different
    users normally share some pieces of information including the programmable keypad
    combinations. There needs to be accountability. Always make sure that you have
    kept track of the number of people that have used certain keys and combinations.


    **Countermeasures**: There are some measures that can be implemented to reduce
    the exposure of your organization and they include:


    *   The security guard and receptionist should keep track of the people entering
    and exiting the building. Such a countermeasure is critical. Make sure that each
    visitor has signed the register. Also, some of the people who cannot be trusted
    should also be escorted. Enforce some policies whereby the employees should always
    question the strangers while also reporting any strange behavior that has been
    taking place in the building. Some signs showcasing Employees Only should also
    be put in place. ✓

    *   There should be a single entry and exit point within the building. ✓

    *   CCTV cameras ✓

    *   The dumpsters should be placed in secure areas. ✓

    *   It is advisable to use the cross-cut shredders when getting rid of hard copy
    documents that contain some sensitive information. ✓

    *   The number of combinations should also be limited. ✓

    *   The biometrics system should be effective.


    ### Network Components and Usage

    After an external attacker has gained access to the building, they will start
    by the **computer room**:


    *   Are the firewalls and switches mounted in lockable racks?

    *   Are the laptops stored in secured desks?

    *   Are the passwords stored on sticky notes on the desktop?

    *   Are the backup media in safes? Are the safes rated for fire? Who can access
    the safe?

    *   Is the computer media susceptible to theft?


    **Attack Points**: After gaining access to the computer room, they will look for
    the following devices:


    *   The routers.

    *   The firewalls.

    *   The hubs.

    *   The switches.

    *   The removable storage.

    *   The hard drives.

    *   The network cables.

    *   The USB ports.


    Some of these devices are not protected by some security protocols within the
    organization. Some of these devices such that an external attacker will have a
    hard time trying to access the information present in these devices. Some major
    factors to consider:


    *   Can the wireless access point signal be easily accessed? If it is not secure,
    make sure that you configured the necessary security protocols. ✓

    *   Can the routers, firewalls, hubs, and switches be easily accessible? Such
    considerations are important so that the network cannot be easily accessed by
    external attackers. ✓


    **Countermeasures**: Some of the mentioned countermeasures are easy to implement;
    nevertheless they may be difficult to enforce since a person is supposed to make
    a follow up frequently.


    *   They require you to lock your screen after leaving your computer. ✓

    *   Always use strong passwords. ✓

    *   The laptop users should store their laptops well so that they cannot be accessed
    by third parties. ✓

    *   The entire laptop will require you to use encryption technologies. ✓

    *   The computer room should be closed and monitored. ✓

    *   An inventory of the software and hardware being used within the organization
    should be kept. ✓

    *   The computer media should be secured using some appropriate techniques. ✓

    *   Make sure that all the security loopholes within the network have been sealed.
    ✓

