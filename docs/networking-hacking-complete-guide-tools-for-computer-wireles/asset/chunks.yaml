    \ vulnerability databases, and websites. Some classified sites help to list different\
    \ vulnerabilities. When looking for some of these vulnerabilities, you will realize\
    \ that some of these vulnerabilities are somewhat generic. At times, you may also\
    \ be forced to look into some of the vendor’s sites so that you can learn more\
    \ about the present vulnerabilities. Some of the sites that can help to showcase\
    \ different vulnerabilities include  [www.sans.org/top20](http://www.sans.org/top20)\
    \ . The site helps to showcase more than 20 vulnerabilities. The list of vulnerabilities\
    \ is compiled by the SANS organization.  If you do not see any need of looking\
    \ into some of the present vulnerabilities in the network, you can go ahead and\
    \ carry out the penetration testing. Some of the options that you have include\
    \ : \n\n1.  Manual Assessment: You will be able to assess some of the potential\
    \ vulnerabilities by establishing a connection to the ports. Some systems can\
    \ also be assessed manually including some web applications. If you have a lot\
    \ of time to spare, you can perform each of these tests manually. "
