    # Chapter 2: Introduction Into Hacking


    There are different types of hacking techniques and hacker categories. In this
    book, the main focus will be on ethical hacking. We will also look into network
    hacking to be precise. Some of the methods used to test the computers and their
    network for any security issues will also be discussed. All these vulnerabilities
    are going to be outlined since hackers use some of these loopholes to gain access
    to a network.


    As for ethical hacking, it mainly involves utilizing some of the professionally
    proven security techniques that are used to ensure that a network is secure. The
    tests are carried out by IT professionals and they perform such duties after receiving
    authorization from the owner of the network system.


    ## Different Terminologies Used in Hacking


    - **Hackers**: These are people who try to compromise sensitive information that
    they have also obtained illegally. Some of the hackers usually target the systems
    that they deem well-protected since they want to elevate their status within their
    circles.

    - **Malicious Internal Users**: They are also referred to as internal attackers.
    They normally try to compromise sensitive information since they can easily access
    it within the organization.

    - **Ethical Hackers**: They are the good guys. They can hack into a system and
    ensure that they have notified the user about the present vulnerabilities. The
    owner of the network can then take the necessary measures to ensure that the computer
    systems and sensitive information cannot be accessed by malicious individuals.


    The term `hacker` can be defined in two ways. Traditionally, this term showcases
    that such individuals like to tamper with different electronic and software systems,
    and they also like to look into how a computer operates. At the moment, a `hacker`
    is a person who breaks into a system maliciously for their gain; these individuals
    usually gain access to critical forms of information and they use it to take advantage
    of other people.


    ## Types of Hackers


    1. **Black-Hat Hackers**: The hackers who usually harbor ulterior motives.

    2. **White-Hat Hackers**: They are the good guys and they usually carry out ethical
    hacking.

