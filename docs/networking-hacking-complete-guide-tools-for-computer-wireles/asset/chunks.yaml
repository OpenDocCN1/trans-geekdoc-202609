    \ within the company: \n\n*   You cannot share some confidential bits of information\
    \ with other people unless you can verify that they are indeed who they claim\
    \ to be. At times, a request can be made through a phone call in such an instance,\
    \ you should verify the identity of the caller first. \n\n*   Do not click any\
    \ e-mail links that will redirect you to a website that needs to be updated. Some\
    \ of these emails are usually from some sources that cannot be trusted. \n\n*\
    \   Always be cautious when sharing some confidential information on different\
    \ sites including LinkedIn and Facebook. Always be on the lookout for people who\
    \ claim to be your “friends”. Some of them may have some malicious motives. \n\
    \n*   Never open an e-mail attachment from a total stranger. \n\n*   Escort each\
    \ of the guests within the building. \n\n*   Do not give out any of your passwords.\
    \ \n\nOther suitable suggestions include: \n\n*   Strangers should not easily\
    \ access your network regardless of whether it is wired or wireless. An attacker\
    \ can place some malware and a network analyzer into the network after accessing\
    \ it for a few seconds. \n\n*   All information should be classified. The employees\
    \ should also be trained on how to handle different pieces of information. \n\n\
    *   Develop some policies that are supposed to enforce the media and documents\
    \ on the computer. The policies will make sure that the data can be handled carefully\
    \ and it will also stay where it should be. \n\n*   The preferred paper shredded\
    \ should carry out cross-shredding. There are some companies that carry out paper\
    \ shredding and they offer quality services. \n\nSome techniques that come in\
    \ handy when reinforcing the content on formal training include: \n\n*   The training\
    \ launches and the employee orientation \n\n*   Brochures that contain some information\
    \ about how to survive social engineering attacks \n\n*   Trinkets that can also\
    \ be used as mouse pads screen savers, and sticky notes "
