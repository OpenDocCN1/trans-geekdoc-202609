    and $3.1 trillion in 2030. Additionally, the Bank of Spain thinks blockchain technology
    would help them save $20 billion in accounting expenses by 2022. All of those
    statistics show how important blockchain is to company digitalization.


    # The Mechanism of How Blockchain Technology Was Applied in the Digital Transformation
    of Enterprises


