    常与“智能工厂”和“工业4.0”相提并论。区块链是一种去中心化、加密且带时间戳的数字账本，可用于以不可篡改的方式记录计算机之间的交易。


    工业4.0的多个方面仍未被充分理解和解释。得益于这项新技术，智能制造解决方案的未来影响将得到增强。从当前部署和早期销售经验中已经学到了很多。它通过使用和整合许多被宣传为公司资源的新技术，为分销提供了一种全面的方法。区块链技术可以帮助中小企业（SMEs）通过使专利环境更加精简、透明且无中介来保护其创新。这将促进那些难以进入专利领域的企业之间的竞争。它将使人们能够通过自由协商的协议生产绿色能源（Liu
    et al., 2020; Esmaeilian et al., 2020; Sikorski et al., 2017; Singh, 2021; Singh,
    Bansal, and Sharma 2022）。


    这项尖端技术消除了商业交易中对中介的需求，这可能会导致商品和服务分销更加精简和经济。由于此记录与链中前一条记录相关联，它永远不会被修改或删除。未经授权、开放且可参与的论坛即所谓的去中心化论坛。这种类型的论坛允许任何人读写交易。相比之下，区块链技术是专门为某些用户设计的，并具有在封闭网络上读写的优势。在考虑用户角色和参与系统的激励措施时，私有区块链与公有区块链之间的差异最为明显。供应链是一个不断发展的框架，由许多公司组成，它们通过在从采购原材料到交付成品的每个生产环节提供价值来协作满足消费者需求。供应链生态系统（Kapitonov
    et al., 2018; Fernández-Caramés et al., 2018）由次级链和三级链组成，它们共同支撑主链。金融交易和信息交易都对链的复杂性有所贡献，链必须保持平衡状态。有必要相信区块链可以在整个供应链中保持连续性并提供可追溯性。他们调查了区块链技术在工业4.0中可能发挥的关键作用，并还考察了是否可以设计并提出与其他技术的链接框架，以及跨行业的各种应用。


    中本聪据称在2008年银行业崩溃后创建了一种去中心化电子货币系统的协议。区块链分布式账本系统构建在此协议之上。区块链可以被视为一个全球电子表格或账本。由于它缺乏集中式数据库，并在全球志愿者捐赠的计算机上运行，因此它是去中心化的。区块链的分布式特性意味着任何人随时都可以查看它，而不是仅限于单一实体。如果您想保障数字交易的安全，可以使用区块链，它经过加密，并依赖公私钥系统。若要安全可靠地向另一个人或组织汇款，而无需通过银行或其他金融机构，可以使用区块链。


    ## 研究目标


    - 1. 研究区块链在工业4.0背景下的重要性、相关性和关键性。

    - 2. 找出可以应用区块链的不同行业。

    - 3. 了解区块链中使用的技术类型。

    - 4. 找出区块链在一般情况及特定领域中的问题。


    ## 区块链在工业4.0背景下的重要性


    使用分布式账本在受邀群体中记录“协议/交易”可促进贸易和业务。多个用户之间的重复记录可以验证同步的协议或交易。


    自2008年以来，比特币的兴起展示了区块链应用。这种流行的加密货币解决了去中心化信任问题。交易是永久的、可验证的且不可追踪的。不再需要集中式银行，因为每个协议、方法、任务和交易都有可以被检测、验证、归档和共享的数字记录和签名。仅包含有效交易的区块将被收集并永久封存。


    此数字交易的去中心化特性消除了对任何中介的需求，包括经纪人、代理人甚至银行家。最终，人类、企业和机器人将能够在统一且安全的环境中协作，在无需人工干预的情况下完成交易，并保持畅通的沟通渠道。在这方面，区块链技术希望能提供帮助。最终，人类、企业和机器人将能够在统一且安全的环境中协作，在无需人工干预的情况下完成交易，并保持畅通的沟通渠道。在这方面，区块链技术希望能提供帮助。


