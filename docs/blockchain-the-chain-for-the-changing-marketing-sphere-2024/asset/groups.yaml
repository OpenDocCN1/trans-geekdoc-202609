    Technically, digital data is recorded and transmitted via a relatively new technology
    called the blockchain. Blockchain in digital marketing offers financial and data
    transfers with accessibility, security, and openness (Erragcha & Babay (2021).
    Consumers may gain from better digital marketing, while businesses may profit
    from spending less money on expensive digital advertising efforts. With the use
    of this recently developed technology, consumers may now own and sell their data
    directly to marketers and advertising.


    Today, the market is driven by data. Blockchain technology can give data owners
    back control over the advertising data they use (Urban et al., 2019). Direct data
    interchange between customers and brands is developing as a result. High-quality
    surveillance used to monitor user activity leads to increased consumer data usability
    and confidence.


    # History and Working of Blockchain


    The year 2008 saw the creation of the first decentralized blockchain by Satoshi
    Nakamoto, a person or set of individuals. Nakamoto greatly improved the architecture
    by timestamping blocks without requiring them to be validated by a third party.
    To limit the rate at which blocks are added to the blockchain, he also established
    a hard level. The next year, Nakamoto put the creation into use as a key component
    of the cryptocurrency Bitcoin, serving as the channel''s main public record for
    all transactions. The terms ‘block’ and ‘chain’ were used separately in Satoshi
    Nakamoto’s first paper, but by 2016, the term “blockchain” had become more common.
    As it happens, each activity is recorded as a “block” of data (Singh, 2021; Singh,
    Bansal, and Sharma 2022).


    ![](img/8a4db8a9db41498a2c603e52324b2beb_22_0.png)


    Source: Financial Times.


