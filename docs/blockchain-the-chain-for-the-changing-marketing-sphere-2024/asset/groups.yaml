    ## 社交媒体平台带来的益处


    ### 解读


    图 2 显示，在 70 名受访者中，34 人通过使用社交媒体平台获得 30%-50% 的益处，18 人获得 10%-30% 的益处；仅 10 人获得 50%-70%
    的益处，仅 8 人通过使用社交媒体平台获得不到 10% 的益处。


    ![](img/8a4db8a9db41498a2c603e52324b2beb_139_0.png)


    ### 图 2. 社交媒体平台带来的益处。


    ## 社交媒体平台有利于商业


    ### 表 7. 社交媒体平台有利于商业


    | | 频数 | 百分比 | 有效百分比 | 累计百分比 |

