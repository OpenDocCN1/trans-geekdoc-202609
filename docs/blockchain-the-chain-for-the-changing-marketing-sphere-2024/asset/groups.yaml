    # Chapter 9


    # # Blockchain and the Digital Transformation of Businesses: A Review of the Literature
    and Future Research


    # Jaskiran Kaur*


    Lovely Professional University, Phagwara, Punjab, India


    # Abstract


    The digital economy has grown rapidly in the era of Dazhiyiyun (big data, artificial
    intelligence, mobile Internet, and cloud computing), and based on technical supremacy,
    the digital transformation of firms has become a hot subject in the sector. The
    significance, mechanism, application scenarios, restrictions, and countermeasures
    of blockchain technology for the digital transformation of organizations are picked
    out from the literature on the digital transformation of enterprises in this study.
    The majority of the literature suggests that blockchain technology aids in the
    digital transformation of businesses, but there is a dearth of evidence and actual
    studies to back this up. It is also discovered that there is no systematic theoretical
    framework and experience summary, the dynamics of the digital transformation of
    organizations are not taken into consideration, and the evolution of firms after
    digital transformation is understudied.


    **Keywords:** blockchain; digital transformation; digital economy


    * Corresponding Author''s Email: er.kaur.jaskiran@gmail.com.


    In: Blockchain

    Editors: Amandeep Singh, Sandhir Sharma, Amrinder Singh et al.

    ISBN: 979-8-89113-219-1

