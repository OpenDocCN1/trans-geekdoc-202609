    # Increased Trust


    As a member of a blockchain-enabled members-only network, you can be confident
    that you are receiving accurate and timely data, and that your sensitive blockchain
    records will be shared only with network members to whom you have explicitly granted
    access.


    # Increased Security


    Because confirmed transactions are permanently recorded, all network participants
    must agree on data veracity. No one, not even the system administrator, may erase
    a transaction.


    # More Efficiencies


    With a distributed ledger shared by network participants, time-consuming record
    reconciliations are avoided. A smart contract is a set of rules that may be written
    on the blockchain and implemented automatically to speed up transactions.


