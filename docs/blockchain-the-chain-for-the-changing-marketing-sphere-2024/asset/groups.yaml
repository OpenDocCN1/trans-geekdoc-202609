    ## About the Editors


    ### Dr. Amandeep Singh


    Dr. Amandeep Singh has obtained his BIT, MBA, and Ph.D. and is also UGC-NET qualified.
    He has served as dean/principal in various reputable universities and colleges.
    Dr. Singh is currently a professor at Chitkara Business School, Chitkara University,
    Punjab, India. He has more than 15 years of teaching experience and was named
    "Best Teacher" in 2008. He is also part of the board of studies of various B-Schools
    and leading universities in northern India. He has published 35 research papers
    in various journals and conferences indexed in Scopus, Web of Science, and ICI.
    In addition, he has edited nine books with renowned publishers like Wiley, Nova,
    and IGI Global. Dr. Singh is on the editorial board for three international journals
    and has also chaired many national and international conferences. His main area
    of research is marketing with a special focus on digital marketing.


    ### Dr. Sandhir Sharma


    Dr. Sandhir Sharma is a Ph.D. in Strategic Management with nearly 22 years of
    experience in higher education and 5 years in the Telecom industry. With more
    than 43 research papers to his credit published in various journals and conferences
    at the national & international levels, Dr. Sharma has developed his core expertise
    in the area of Strategy formulation. His research has been widely published in
    various newspapers. Currently, he is serving as Pro Vice-Chancellor, at Chitkara
    Business School, Chitkara University, Punjab, India & visiting faculty at Binus
    University, Indonesia, and University of Applied Sciences, Osnabruck, Germany.
    He has been instrumental in scaling Chitkara Business School operations from 60
    students & one program to 1200 plus students & more than 12 programs within 8
    years. He has guided more than 5000 students in the field of business management
    across streams of Commerce and Management so far. He is serving as a consultant
    to various SME organizations in the area of strategy formulation. He is Major
    Guide to 8 Ph.D. Scholars from Academia and Industry. He has filed 14 patents
    in the fields of Health sciences, life sciences, social sciences, technology,
    and industrial products.


    ### Dr. Amrinder Singh


    Dr. Amrinder Singh is currently holding the position of Associate Professor at
    Jain University, Bangalore. He has done a Master''s in Business Administration
    and Doctorate in Business Studies from Punjabi University, Patiala. Having teaching
    experience of more than 15 years under his belt, he is a personality to reckon
    with in the field of Marketing and Research. He has about more than 30 research
    papers published to his credit in various National and International journals
    of repute. He has also published one book. He is a member of academic and administrative
    bodies of various Universities and Institutions nationally and internationally.


    ### Dr. Geetika Madaan


    Dr. Geetika Madaan is working as Assistant Professor, at the University Centre
    for Research and Development Chandigarh University, Mohali, India.


