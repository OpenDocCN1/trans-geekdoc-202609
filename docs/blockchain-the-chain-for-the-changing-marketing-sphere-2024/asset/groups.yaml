    最近的计算机进步为公共领域和各种组织提供了改变游戏规则的机会。数据和通信机械也在更高层面上解决了住房、气候变化、福祉和人类迁移等关键社会问题（Ambika,
    2021; Khezr et al., 2019）。区块链是一种用于存储数据的透明、分布式和不可篡改的方法。它可以通过两种方式创建区块链，每种方式都有其自身特征，但具有不同的认证和记录程序——许可型（也称为私有或联盟区块链）和无许可型（也称为公有区块链）。在多个组织之间，私有和公共区块链可用于解决保密性问题，从私有区块链开始，再过渡到公有区块链（图1）。


    区块链是一种共享记录，存储区块链中所有已提交的交易。当新块添加到该链时，它会不断增长。通过一个引用（本质上是前一个块的哈希代码，称为父块），每个块都链接到之前的块。原始块（没有父块）是区块链中的第一个块。块头和块体构成一个块。业务输入和交易创建块格式。块大小和每个交易的大小决定其可以包含的最大交易数量。它采用加密程序来验证交易是否已通过身份验证（图2）。


    ![](img/8a4db8a9db41498a2c603e52324b2beb_35_0.png)


    图1. 区块链架构（Krichen, Ammi, Mihoub, & Almutiq, 2022）。


    研究人员高度关注比特币（Vranken, 2017）可以对冲或分散股票、债券、货币或商品等传统资产的风险。数值信息通过分布式账本中的点对点系统进行同步、复制、分散和共享。每个连接设备都保存共享账本的最新版本。它只能通过向链中添加新块来扩展数据库，账本的主要特征是其安全性。在计算上不可能更改已注册到链中的记录（图3）。


    ![](img/8a4db8a9db41498a2c603e52324b2beb_36_0.png)


    图2. 区块链流程（Siyal, 等, 2019）。


