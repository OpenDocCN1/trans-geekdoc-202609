    ### 摘要\n\n员工必须是公司最重要的资产。但是，为了在长期取得成功，公司维持客户并根据其需求为其提供最佳服务/产品至关重要。客户细分正是为此而存在。为了发挥最佳水平，公司必须选择并划分目标受众群体。这一做法被称为客户细分。本文讨论了客户细分的各种优势，以及改进它的某些策略。最后，建立了客户细分与满意度之间的关系。\n\
    \n关键词：客户细分，满意度，关系，优势，大数据，确定，方面，产品，服务\n\n- 通讯作者电子邮件：drsanjaytaneja1@gmail.com.\n\
