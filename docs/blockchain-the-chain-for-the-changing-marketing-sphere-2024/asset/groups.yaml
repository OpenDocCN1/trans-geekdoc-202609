    EMR 份额的节点，然后才能尝试浏览 EMR。交织解码器将在 EMR 子部分被重建后对已恢复的 EMR 子部分进行解码，从而得到原始 EMR R。之后，授权客户可以出于各种目的处理这些已恢复的
    EMR。利用存储的 EMR 份额的索引，创建然后链接在一起形成区块链的块。授权数据用户或机构可以通过从区块链节点请求至少 t 个份额来恢复 EMR。


    ## 供应链


    去中心化结构、分布式节点和存储机制、共识算法、智能合约以及非对称区块链加密确保了网络安全性、透明度和可见性。区块链是一种将这些功能独特地结合在一起的技术。区块链有望彻底改变供应链（SC）功能，包括
    SC 溯源、业务流程再造和安全性增强。通过在公共账本中创建无可辩驳的记录，区块链实现了分布式共识机制，使所有相关方都能了解每个事件和交易。给定供应链成员网络的需求端和供应端构成了供应网络。“供应端”一词是指直接或间接为主要公司做出贡献的任何供应链组件。产品在其到达最终消费者的过程中所遇到的所有供应链成员构成了需求端。


