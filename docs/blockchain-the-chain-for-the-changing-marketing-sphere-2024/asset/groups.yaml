    ### 解读


    表 7 显示，在 70 名受访者中，43 人认为社交媒体平台有利于商业用途，而 22 人认为它有时有利但并非始终如此，5 人认为社交媒体平台不利于商业用途。


    ## 年龄对使用 Facebook 作为社交媒体平台的影响


    ### 表 8. 年龄对使用 Facebook 作为社交媒体平台的影响


    | | 平方和 | 自由度 | 均方 | F | 显著性 |

    |---|---|---|---|---|---|

    | 组间 | .138 | 1 | .138 | .370 | .545 |

    | 组内 | 25.305 | 68 | .372 | | |

    | 总计 | 25.443 | 69 | | | |


    ### 解读


    ANOVA f 比值和显著性值表明，年龄对使用 Facebook 作为社交媒体平台没有显著影响，f(1,68) = .370，p > .05（表 8）。


    ## 年龄对使用 Instagram 作为社交媒体平台的影响


    ### 表 9. 年龄对使用 Instagram 作为社交媒体平台的影响


