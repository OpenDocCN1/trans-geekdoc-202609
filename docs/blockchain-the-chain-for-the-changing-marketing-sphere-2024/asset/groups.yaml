  mdcn: "\n\n## 第 6 章\n\n## 区块链技术：商业、战略和环境中的关键角色\n\nDivya Bansal*，博士 与 Mona Chaudhary\n\
    \n阿米蒂大学，诺伊达，印度\n\n## 摘要\n\n区块链技术是构建在信息和计算技术之上的一种颠覆性突破，且仍在快速增长。\n\n这种基础性颠覆技术使各方（即使不一定互相信任）能够共享数字历史记录并进行更新，同时避免了协调所需的中央可信机构。\n\
    \n从加密货币的起步开始，区块链已经在银行、法律、教育、医疗保健、供应链和制造业等多个行业中找到应用案例。\n\n比以往任何时候都更甚，营销人员必须学习如何使用新技术并快速部署。\n\
    \n但是，尽管区块链技术诞生已十余年，学术营销研究者对此关注甚少。\n\n由于区块链的独特特征——透明度、去中心化和不可篡改性——它可以为个人和公司营造一个更安全、以客户为中心和开放的市场。\n\
    \n本研究的主要目标是增加知识并填补与区块链创建和使用相关的知识空白。\n\n其旨在为学者和行业专业人士提供一个平台，以批判性地审视、调查和解释区块链技术所采取的新模式和形式，以及技术与企业、供应链及其利益相关者之间的交互。\n\
    \n本研究认为，区块链是营销人员应当充分了解并准备使用的技术，因为它有能力改变企业。\n\n我们希望就区块链技术在五个不同领域（加密货币、数字平台、供应链和在线营销）的影响产生讨论并开展未来研究。\n\
    \n关键词：区块链技术、策略、供应链、数字平台\n\n* 通讯作者电子邮件：Divyadogra26@gmail.com。\n\n收录于：区块链\n编辑：Amandeep\
    \ Singh、Sandhir Sharma、Amarinder Singh 等\nISBN: 979-8-89113-219-1\n© 2024 Nova\
    \ Science Publishers, Inc.\n\n## 介绍\n\n区块链是一种分布式、不可篡改的数据库，它简化了企业网络中交易的记录和资产的跟踪。\n\
    \n无形资产可以与有形资产（如房屋、汽车、现金或土地）（知识产权、专利、版权和品牌）并存。\n\n区块链网络可以追踪和出售几乎任何有价值的东西，降低所有相关方的风险和成本。\n\
    \n信息是公司的命脉。信息接收得越早、越准确，效果越好。\n\n区块链非常适合分发该信息，因为它提供即时、可共享且完全透明的数据，记录在不可篡改账本上，只有拥有权限的网络成员才能读取。\n\
    \n区块链网络还可以追踪订单、付款、账户和产出。\n\n此外，由于成员对真相有统一的认识，你可以从头到尾查看交易的所有方面，从而增强信心并带来额外的效率和机会。\n\
    \n## 区块链的优势\n\n必须改变什么：重复的记录保存和第三方验证通常会浪费运营中的时间和精力。欺诈和网络攻击可以利用记录保存系统。缺乏透明度可能会阻碍数据验证。而且，自引入物联网以来，交易量激增。所有这一切都会减缓业务并降低利润，强调了对更好解决方案的需求。区块链技术应运而生。\n\
    \n### 增强信任\n\n作为区块链支持的会员专属网络的一员，你可以确信自己接收到的是准确且及时的数据，且你的敏感区块链记录仅会共享给你明确授权访问的网络成员。\n\
    \n### 增强安全性\n\n由于已确认的交易被永久记录，所有网络参与者必须就数据真实性达成一致。没有人，甚至系统管理员，都不得删除交易。\n\n### 提高效率\n\
    \n借助网络参与者共享的分布式账本，避免了耗时的记录对账。智能合约是一组可以编写在区块链上并自动实现的规则，以加快交易速度。\n\n## 区块链的工作原理\n\
    \n- 1. 每笔交易发生时，都会作为“数据块”被记录。\n  这些交易显示资产的流动，资产可以是有形的（产品）或无形的（服务）（知识产权）。\n  数据块可以记录任何类型的信息，例如谁、什么、何时、何地、多少，甚至状态——例如，食品运输的温度。\n\
    \n- 2. 每个区块都与其前后的区块相连。\n  这些区块在资产从一个位置移动到另一个位置或所有权转移时，构建了一条数据链。区块确认交易的时间和顺序，并被安全地链接在一起，以防止任何区块被篡改或插入两个现有区块之间。\n\
    \n- 3. 区块链是一条连接交易的不可逆链。\n  每个后续区块都会强化对前一个区块（进而对整个区块链）的验证。这使得区块链防篡改，赋予了其不可篡改的关键优势。这消除了恶意行为者操纵的可能性，为你和其他网络用户创建了可靠的交易记录（Singh,\
    \ 2021; Singh, Bansal and Sharma 2022）。\n\n## 区块链的优势\n\n- 1. 应改变什么：\n  重复的记录保存和第三方验证通常会浪费运营中的时间和精力。欺诈和网络攻击可以利用记录保存系统。缺乏透明度可能会阻碍数据验证。而且，自引入物联网以来，交易量激增。所有这一切都会减缓业务并降低利润，强调了对更好解决方案的需求。区块链已经到来。\n\
    \n- 2. 增强信任：\n  作为区块链支持的会员专属网络的一员，你可以确信自己接收到的是准确且及时的数据，且你的敏感区块链记录仅会共享给你明确授权访问的网络成员。\n\
    \n- 3. 增强安全性\n  作为区块链支持的会员专属网络的一员，你可以确信自己接收到的是准确且及时的数据，且你的敏感区块链记录仅会共享给你明确授权访问的网络成员。\n\
    \n- 4. 耗时\n  借助网络参与者共享的分布式账本，消除了记录对账。智能合约是一组可以编写在区块链上并自动实现的规则，以加快交易速度。\n\n## 区块链对营销的影响\n\
    \nB2C 商业中最重要的发展之一是具有移动功能的现代电子商务系统的兴起。电子商务的引入改变了许多传统的组织结构，并彻底改变了价值创造过程。与此同时，在营销中使用新技术（例如区块链）改变了品牌营销的传统动态。互联网为营销人员提供了众多选择，以建立新的在线市场并扩展到其现有市场的新领域。另一方面，区块链的到来导致人们和组织使用互联网的方式发生了巨大变化。\n\
    \n在这种情况下，了解区块链技术对营销的影响概述将帮助你熟悉区块链如何现在和未来彻底改变营销。\n\n## 区块链对营销的影响\n\n区块链技术引起了广泛关注，并通过多个行业中的实际应用案例证明了其价值。例如，区块链在金融、医疗保健、房地产和供应链管理方面找到了主要应用。因此，营销并非潜在区块链用例中的例外。大多数正在寻求“区块链在营销中如何应用？”这一问题答案的人，都会在区块链技术的特性中找到答案。\n\
    \n## 区块链为何适合营销？\n\n2008 年全球金融危机动摇了传统银行业的根基。在此期间，点对点电子现金系统比特币的出现展示了密码学技术在金融交易处理中的应用。比特币的密码学机制包括哈希、共识程序、非对称加密和时间戳。\n\
    \n比特币解决了双重支付问题，同时还为在在线环境中进行金融交易和交换价值建立了新标准。此外，区块链在营销中的影响\n\n"
