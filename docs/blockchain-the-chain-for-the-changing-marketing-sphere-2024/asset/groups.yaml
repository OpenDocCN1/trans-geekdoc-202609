    7(4), 8-10.

    - Chillakuri, B. and VS Prakash, A. (2022). 区块链在人力资源应对新常态中的作用. *组织分析国际期刊*, 30(6),
    1359-1378.

    - Grover, P., Arpan, K., Marijn, J., and P. Vigneswara, I. (2019). 感知有用性、易用性和用户对数字交易区块链技术的接受度——来自Twitter用户生成内容的洞察.
    *企业信息系统*, 13(6), 771-800.

    - Kamble, S., Angappa, G., and Himanshu, A. (2019). 理解供应链中的区块链技术采用——印度背景. *生产研究国际期刊*,
    57(7), 2009-2303.

    - Norman, AT. (2017). 区块链技术解释：关于区块链钱包、挖矿、比特币、以太坊、莱特币、Zcash、门罗币、瑞波币、达世币、IOTA和智能合约的终极初学者指南，126.
