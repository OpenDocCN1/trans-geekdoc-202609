    ## 第9章


    ## 区块链与企业数字化转型：文献综述与未来研究


    Jaskiran Kaur*


    Lovely Professional University, Phagwara, Punjab, India


    ### 摘要


    数字经济在 Dazhiyiyun（大数据、人工智能、移动互联网和云计算）时代迅速增长，基于技术优势，企业的数字化转型已成为该领域的热门议题。本研究从企业数字化转型文献中梳理了区块链技术在组织数字化转型中的意义、机制、应用场景、局限性及对策。大多数文献表明，区块链技术有助于企业数字化转型，但缺乏证据和实际研究来支持这一观点。同时也发现，缺乏系统的理论框架和经验总结，未考虑组织数字化转型的动态，且企业数字化转型后的演变研究不足。


    **关键词：** 区块链; 数字化转型; 数字经济


    * Corresponding Author''s Email: er.kaur.jaskiran@gmail.com.


    In: Blockchain

    Editors: Amandeep Singh, Sandhir Sharma, Amrinder Singh et al.

    ISBN: 979-8-89113-219-1

    © 2024 Nova Science Publishers, Inc.


    ### 引言


    大数据、人工智能、云计算、区块链等技术正在快速发展，这体现在印度数字经济的快速步伐、广泛覆盖和深远影响。根据2021年《中国数字经济发展白皮书》，2020年中国数字经济整体规模为39.2万亿元人民币，占GDP的38.6%，并在国家经济中占据越来越大的份额。《数字经济发展第十四个五年规划》也提出了实施全面“上云用数赋智”服务（即上云、用数、赋智）、加快企业数字化转型升级，以及使区块链等技术在银行、证券、保险等领域更合理地应用的建议。自2017年以来，邮政储蓄银行、招商银行、蚂蚁金服、腾讯等企业也已在资产托管、跨境人民币清算、信用证结算、中小企业融资等领域应用区块链技术。因此，通过技术使企业实现数字化转型已成为该领域的普遍趋势和热门话题。区块链技术如何帮助企业实现数字化？转型过程中的局限性是什么？数字化转型是否有可行的替代方案？这些都是需要解决的关键问题。本文对区块链技术在企业数字化转型中的重要性、机制和应用场景进行了总结。同时探讨了区块链技术与数字化转型之间的联系，为企业以信息化方式转型提供了未来研究方向。现有文献已被整理，以提供关于区块链技术在数字化转型中的约束和提升方案的见解。


    ### 文献综述


    为解决用户信息获取不均的问题，采用信息技术（IT）。随着兴趣量的增加和访问限制的减少，每个人都可能从更窄的数字鸿沟中获益。它侧向于发布大量信息，并改变了信息在互联网上的传输方式。数字技术有潜力减少互联网上仍然存在且信息技术无法解决的社会信用问题。此外，它对区块链技术的引入和发展至关重要。各种技术自然融合形成了区块链技术。通过整合分布式存储、共享协议、共识算法、加密算法等技术，创建了一种高度安全、可追溯、防篡改且去中心化的数据存储方式。（Zhang
    et al., 2020）。此外，它以最低风险和零信任成本创造了新的信用、交易和规则系统（Zhao, 2020）。数字化转型是指利用数字技术改变企业，特别是改变其组织结构、管理模式和生产标准等。它帮助企业重塑原有的商业理念。


    ### 区块链技术在企业数字化转型中的重要性


    许多学者关注区块链的技术优势及其在企业数字化转型中的有益实际应用。Huang (2019) 声称，区块链的非对称加密技术可以保障企业数据的安全性和可靠性，帮助企业数据资产化，加速数据流动和变现，使企业能够保留和追溯数据来源，并实现其可管性和可控性。根据
    Lu et al. (2021)，去中心化、去中介化、集体维护和可靠数据库是区块链技术的四大优势，可用于创建金融黑名单和白名单，以提升现有金融信用参考系统的有效性。根据
    Yang (2019)，实施“区块链+大数据”金融模式有助于降低融资风险、增加提供资金的意愿，并改善资源配置效率。Tan and Wu (2018) 指出，专用链账本、共享链账本、证书管理和SaaS层服务等链上数字价值转移技术，有可能简化现有流程、降低业务风险并提高数据准确性。根据
    Chen et al. (2019)，政府和企业在数字化方面的投资可以使区块链应用更容易改善企业内部资本市场的有效性。金融机构利用区块链技术，提高了中小企业（SMEs）伪造信用信息和价差所需付出的成本。Silva
    and Santos (2022) 断言，区块链技术可以提高供应链的效率和透明度，其去中心化结构为供应链各环节提供了不可变性，密码学也保障了安全性。CAICT
    (2021) 表示，以粤港澳大湾区为例，创建跨境贸易金融区块链平台可以解决跨境贸易背景真实性的问题，提高商业银行跨境贸易结算的服务有效性，并增加商业银行跨境贸易金融业务的安全性。根据
    Fang and Hu (2017)，区块链通过使产业链各方清晰了解货物、资金和信息的流动，提高了银行和贸易融资业务的交易效率，使整个贸易融资渠道更加顺畅。根据
    PWC 的最近分析，区块链可能帮助保险业节省50亿至100亿美元的成本，即其总成本的15%至20%（Zhao, 2020）。根据 Gartner Group
    的预测，区块链的市场价值将在2025年达到约1760亿美元，2030年达到3.1万亿美元。此外，西班牙银行认为，区块链技术可帮助其在2022年节省200亿美元的会计费用。所有这些统计数据都表明区块链对企业数字化的重要性。


    ### 区块链技术在企业数字化转型中的应用机制


    根据 Zhang et al. (2020)，使用分布式数据账本、去中心化网络、共识机制、加密哈希算法和数字证据存储等技术可以帮助企业实现数字化转型，他们以碧桂园控股为例。通过打破数据孤岛并加速数据流动，这些技术可以有助于防止企业信息操纵和恶意欺诈等道德风险，如
    Gong, Ban, and Zhang (2021) 所指出。Liao (2021) 提出了一种逻辑相关性模型，强调区块链技术可以通过推动数字化产业化、产业数字化、数字化治理和数字化环境的发展来促进数字经济的发展。Huang
    (2019) 建议，区块链技术的防篡改性和实时交易


