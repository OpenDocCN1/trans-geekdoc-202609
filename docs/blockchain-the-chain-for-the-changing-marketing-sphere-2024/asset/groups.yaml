    renewable energy. Low-carbon technologies receive close to 80% of public research
    and development funding, and this number is increasing. Global energy utilization
    decreased by 4.5 percent in 2020 because of the COVID-19 epidemic, but it increased
    by nearly 5% in 2021. According to the current investment trends, there is a shortfall
    in the infrastructure industry of over $15 trillion, or 0.55% of GDP. This divide
    is greater in some parts of the world than others. Beyond investing, there are
    substantial problems that need to be solved globally in the areas of infrastructure
    and energy.


    ### Problems That Need to Be Fixed in the Energy Sector


    Systems for managing energy are changing. They are increasingly dispersed and
    computerized. Governments and businesses must expand their research into, consideration,
    and rapid deployment of dispersed technology to keep up with this trend. Emerging
    technologies based on ICT are already improving the energy markets, with ideas
    like prosumers, smart grids, smart meters, dynamic pricing, and microgrids gaining
    traction. This brings up the underlying issues that were discussed in the ICT
    industry part, as well as issues of control, trading practices, customer service,
    and resource sharing.


    ### Challenges That Need to be Addressed in the Infrastructure Sector


    Despite several efforts by international governments and bodies, a significant
    funding shortfall remains to power the world''s infrastructure.


    The economy, poverty, the environment, and sustainability are all related to infrastructure.
    Proper attention must be paid to expanding power generation capacity, telecommunications,
    sanitation, rail and road infrastructure, and supply lines, especially for water.


    ### Marketing and Sales


    Blockchain might be used in conjunction with AI and ML to help businesses better
    respond to consumer trends and personal preferences. At the same time, businesses
    can protect the privacy of specific consumers thanks to blockchain technology.


    Today, the majority of firms undergo digital change, but manufacturing disruption
    is considerably more obvious. Industry 4.0 extends virtual data and processes
    and goes through significant advancements. The change has started, and it will
    likely have a big impact. Technical, economic, and social advancements are projected
    across the entire industrial ecosystem. Workers begin switching from nearshoring
    to offshore as a result. Numerous variables, including 3D printing, automation,
    IoT, and the digitization of supply chains, contribute to the Industry 4.0 revolution
    (Haleem et al., 2020; Teslya & Ryabchikov, 2017; Holland et al., 2018). The next
    technology that can assist raise the level of the digital revolution is blockchain.
    Blockchain can also benefit Industry 4.0 in situations where several partners
    in a business network must transact, exchange, and transmit data while maintaining
    a trustworthy environment.


    Blockchain technology has the potential to be applied in a wide range of other
    industries, including smart meters that allow for safer management of building
    energy efficiency certificates or more efficient usage of electricity. It bases
    its working principles on permanence, record, and protection. Blockchain technology
    opens up a wide range of opportunities as an intelligent network in Industry 4.0.
    Due to the flexibility of the network, blockchain transactions promise a higher
    level of automation and reduced interparty frictions, which will lower costs and
    speed up processes (Khan et al., 2021; Leng & Jiang 2018; Zhang et al., 2017).
    It may be used in a variety of supply chain systems in a variety of ways to bring
    enormous benefits to all parties involved. Customers have a great deal of freedom,
    and businesses can become more competitive by real-time controlling supply and
    demand (Pinheiro et al., 2019; Kuhi et al., 2018; Saberi et al., 2019). The efficiency
    attained in business operations is demonstrated by the label features of immutability,
    traceability, safety, resilience, and openness.


    ### Application of Blockchain Technology to the Energy Industry


    The energy markets are being seriously disrupted by blockchain-based solutions.
    Here are a few potential advantages of blockchain-based energy solutions.


    - a) Billing: Automated invoicing for dispersed generators and customers may be
    possible with blockchain-based technologies like smart contracts and smart meters.

