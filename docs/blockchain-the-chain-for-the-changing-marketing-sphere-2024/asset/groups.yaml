    市场研究报告表明，公司使用社交媒体平台来建立良好的客户关系。对于任何公司来说，建立品牌形象非常重要，而社交媒体平台是业务推广组合的重要组成部分。


    随着社交网络站点充当定位客户并将市场转变为基于用户内容的技术平台的平台，人们彼此之间以及与企业之间的沟通方式发生了转变（Lorenzo-Romero et
    al., 2014）。为了推广品牌和分享有关品牌内容的信息，使用了社交媒体渠道，结果表明，纳入企业品牌名称、功能和情感诉求以及信息搜索提示，增加了品牌内容的受欢迎程度（Swani
    et al., 2017）。


    已确定公司或品牌使用社交媒体平台有三个因素，即：通过聊天或讨论板与其他策划者轻松快速地共享信息，与其他会议策划者沟通查询以及问题解决方案和意见，并在会议后从人们那里获得反馈（Lee,
    Tyrrell and Erdem, 2018）。


    还指出，公司规模与其使用社交媒体作为平台的频率之间没有直接关系，但与此同时，使用社交媒体作为平台的原因各不相同，因为中小型企业主要将其用于客户服务，而大型公司则将其用于品牌建设（Olivas-Lujan
    et al., 2013）。


    企业通过使用社交媒体平台来提升其业务曝光度和品牌知名度，并创建一个庞大的客户池，为组织员工提供适当的访问权限（He et al., 2017; Wizig
    et al., 2012）。


    信息沟通是让客户满意的重要方面。它还通过强调消费者对持续信息可用性和及时性的期望，将这一点作为确保客户满意度的重要方面，给予了重视。


    此外，还有一项研究发现，消费者在使用社交媒体平台进行在线购物时面临一些信任问题。


    结果表明，缺乏可见的利益、缺乏知识，以及对将社交媒体作为发展业务平台的消极情绪/看法（Olivas-Lujan et al., 2013）。


    像Instagram这样的社交网络平台是更有效的营销平台，因为它有助于影响购买行为，因为更注重视觉的社交网站有利于快速的情感反应（Leng et al.,
    2013; Jensen et al., 2015）。


    在文献综述之后，研究者提出了以下假设


    - *H01: 社交媒体对业务运营没有显著影响。*

    - *H02: 年龄对使用社交媒体进行业务没有显著影响。*


    ## 研究方法


    为了检验所提议的假设，开发了一份调查问卷。数据通过分层随机抽样从70名用于商业目的的在线社交媒体的在线客户中收集，分层是根据受访者的年龄组形成的。总共直接向消费者分发了100份问卷。从哈里德瓦尔使用在线社交媒体进行商业目的的消费者中收集了总共70份可用的调查问卷。那些不将在线社交媒体平台用于商业目的的消费者被排除在研究之外。为了减少回应偏差，要求用户在调查中不透露自己的姓名。


    基于这些调查，提出了以下研究问题以展示社交媒体对企业的影响。


    - *研究问题 1: 社交媒体的存在是否会影响企业？如果是，对总销售额贡献多大？*

    - *研究问题 2: 企业从社交媒体平台获得哪些好处？*

    - *研究问题 3: 哪种社交媒体最适合开展业务？*


