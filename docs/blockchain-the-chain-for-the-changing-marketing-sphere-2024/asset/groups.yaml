    therefore things are improving. With the size, variety, and complexity of providing
    public services as India’s administration currently faces, blockchain offers a
    unique option. The blockchain economy needs technological innovation. The development
    of the technology required for just a blockchain-based digital economy requires
    strong collaboration between the government and all levels of management. It must
    also convey the potential of this technology. If the government and organisations
    adopt blockchain deployment tools, the COVID-19-caused supply chain disruption
    as well as the current economic difficulties in India can be fixed. Blockchain
    technology can change India’s FinTech landscape and how digital transactions are
    carried out going forward. India can gain a lot by implementing blockchain technology.


