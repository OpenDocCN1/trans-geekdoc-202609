    # Abstract


    Blockchain technology is a disruptive breakthrough built on information and computing
    technology that is still growing very quickly. This fundamental disruptive technology
    enables a shared digital history and record updating between parties who may not
    necessarily trust each other while avoiding the need for a central trusted agent
    for coordination. From its beginnings in cryptocurrency, blockchain is already
    finding use cases across a variety of industries, such as banking, law, education,
    healthcare, supply chains, and manufacturing. More than ever, marketers must learn
    how to use new technology and deploy them quickly.


