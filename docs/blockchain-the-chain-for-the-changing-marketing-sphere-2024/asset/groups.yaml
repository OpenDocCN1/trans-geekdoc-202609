    A blockchain is a communal record that stores all committed transactions in a
    blockchain. When new blocks are added to this chain, it keeps growing. Through
    a reference, which is fundamentally the hash code of the preceding block, known
    as the parent block, each block links to the block that came before it. The original
    block, which does not have a parent block, is the first block in the blockchain.
    The block header and the block body make up a block. A business input and transactions
    create the block format. The block size and the size of each transaction determine
    the maximum number of transactions it can contain. It employs a cryptographic
    procedure to verify that transactions have been authenticated (Figure 2).


