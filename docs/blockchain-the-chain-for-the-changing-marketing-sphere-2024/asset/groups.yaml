    Gcoin 区块链上。由于 Gcoin 区块链中存储了关于未花费交易输出（UTXO）的欺诈信息，任何非法分销商向买方出售假药的行为都将被视为无效。使用正确的私钥，未经授权的人员可以使用此系统购买药品。因此，任何交易异常都会立即被买方或卖方察觉。


