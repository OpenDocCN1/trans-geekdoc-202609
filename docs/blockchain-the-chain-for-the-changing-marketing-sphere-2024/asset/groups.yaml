    fault tolerance rate, a low consensus efficiency, and a small data capacity, which
    limit the effectiveness of an enterprise’s digital transformation. According to
    Gong et al. (2021), blockchain technology is still in its developmental stage,
    with limited empirical research and data available. More research is needed to
    assess its impact on marketing and business administration, as well as to address
    challenges such as scalability, privacy and security concerns, software defects,
    cyber-attacks, high investment costs, and the absence of legal regulations. Given
    its relative youth and immaturity, many experts stress the importance of establishing
    an international technical standard for blockchain technology.


    ## Countermeasures


    To increase the data transparency of SMEs in logistics, money flow, and information
    flow, Lu et al. (2021) proposed applying the blockchain-distributed ledger to
    all nodes of company production and operation and adopting “blockchain+ credit
    reference” technology. According to Yang et al. (2020), building an intellectual
    property data platform, a trading platform, and a valuation platform were all
    effective ways to boost the value of SMEs. These steps included determining the
    developmental stage of businesses using the “blockchain+ big data” model, assessing
    their needs for financing and financial stability, and identifying the SMEs’ developmental
    stage. Tang (2018) used the digital transformation of SMEs in Germany as an example
    to suggest that the nation should create a unified framework for digital transformation,
    develop a mechanism for Internet regulation, strengthen trust and security in
    data processing, place a premium on and increase investment in R&D, and offer
    opportunities for vocational training. Zhang (2021) asserts that SMEs need to
    strengthen their capabilities, nurture their talents in digital management, technology,
    and business, and use benchmark enterprises to guide their use of key industry
    businesses as a point of breakthrough for digital transformation. They should
    also develop an open and shared industrial Internet platform.


    ## Conclusion


    The relevance, method, application scenarios, challenges, and mitigation strategies
    of blockchain technology for the digital transformation of organizations are briefly
    reviewed in this study. (1) Blockchain technology has a favorable effect on businesses’
    digital transformation, particularly through distributed data ledgers, asymmetric
    cryptography, decentralization, and consensus mechanisms, among other things.
    (2) The existing literature provides more references on the relationship between
    blockchain technology and enterprise informatization, but most of the articles
    stay in the stage of theoretical explanation, and the significance of their relationship
    has not been tested by empirical studies; and (3) When it comes to counter-matter,
    there is often little discussion about the technical details and principles behind
    the mechanism. Additionally, the associated risks and constraints are often overlooked.


    According to recent studies, the following matters require more attention:


    - 1) The security of citizens’ information throughout the digital transformation
    of businesses needs to be given top priority in the “Dazhizhiyun” age. Enterprises’
    use of data not only increases marketing precision but also exposes customer privacy.
    Can blockchain be enhanced in terms of enhancing data security and standardizing
    technology? How should the legal framework and particular technological requirements
    for blockchain technology be established? Further research on these problems is
    required.


    - 2) More research is needed to confirm how blockchain impacts businesses during
