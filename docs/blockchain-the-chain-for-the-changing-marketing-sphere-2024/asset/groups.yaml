    their business (Olivàs-Lujan et al., 2013).


    Social networking platform like Instagram is more effective marketing platform
    as it helps in influencing purchase behavior because social networking sites that
    are more visual-centric favor quick emotive response (Leng, et al., 2013; Jensen
    et al., 2015).


    After going through a review of the literature, the researcher proposed the following
    hypothesis


    *H01: There is no significant impact of social media on business operations.*


    *H02: There is no significant impact of age on using social media for business.*


    # # Research Methodology


    For examining the hypothesis proposed, a survey questionnaire was developed. The
    data were collected from 70 online customers who are using online social media
    for business purposes by using stratified random sampling in which strata were
    formed according to the age group of respondents. In total 100 questionnaires
    were distributed directly to the consumers. A total of 70 usable surveys were
    collected from consumers who are using online social media for business purposes
    in Haridwar. The consumers, who are not using the online social media platform
    for business purposes, were excluded from the study. To reduce response bias,
    users were asked not to reveal their names in the survey.


    Based on these surveys, the following research question has been set to present
    the impact of social media on businesses.


    *Research Question 1: Does presence on social media impact a business? If yes,
    how much it contributes to total sales?*


    *Research Question 2: What benefits does a business derive from social media platforms?*


    *Research Question 3: Which social medium is best for doing business?*'
