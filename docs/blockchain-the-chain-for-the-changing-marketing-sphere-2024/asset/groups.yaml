    ## 关于编辑


    ### 阿曼迪普·辛格博士


    阿曼迪普·辛格博士已获得BIT、MBA和博士学位，并通过了UGC-NET资格认证。他曾在多所知名大学和学院担任院长/校长。辛格博士目前是印度旁遮普邦奇特卡拉大学奇特卡拉商学院教授。他拥有15年以上的教学经验，并于2008年被评为“最佳教师”。他还是印度北部多所商学院和知名大学教学委员会的成员。他在Scopus、Web
    of Science和ICI收录的各种期刊和会议上发表了35篇研究论文。此外，他还与Wiley、Nova和IGI Global等知名出版社合作编辑了九本书籍。辛格博士担任三本国际期刊的编辑委员会成员，并主持过许多国家和国际会议。他的主要研究领域是营销，特别关注数字营销。


    ### 桑迪尔·夏尔马博士


    桑迪尔·夏尔马博士是战略管理博士，在高等教育领域拥有近22年的经验，在电信行业有5年的经验。在全国及国际各类期刊和会议上发表40多篇研究论文，夏尔马博士在战略制定领域发展了其核心专长。他的研究已广泛发表于各类报纸。目前，他担任印度旁遮普邦奇特卡拉大学奇特卡拉商学院协理校长，同时也是印度尼西亚比纳斯大学和德国奥斯纳布吕克应用科学大学的客座教授。他在8年内将奇特卡拉商学院的运营规模从60名学生和一个课程扩展到1200多名学生和12个以上课程，功不可没。迄今为止，他在商务管理领域（涵盖商业和管理各个方向）指导了5000多名学生。他目前担任多家中小型企业组织的战略制定顾问。他是来自学术界和工业界8名博士生的主要指导教师。他在健康科学、生命科学、社会科学、技术和工业产品领域申请了14项专利。


    ### 阿姆林德·辛格博士


    阿姆林德·辛格博士目前担任班加罗尔贾恩大学副教授。他从旁遮普大学帕蒂亚拉分校获得工商管理硕士和商学研究博士学位。拥有超过15年的教学经验，他在市场营销和研究领域是举足轻重的人物。他在各类国家和国际知名期刊上发表了约30篇研究论文，还出版了一本书。他在国内外多所大学和机构的学术和行政机构中担任成员。


    ### 吉提卡·马丹博士


    吉提卡·马丹博士是印度莫哈里昌迪加尔大学大学研究与发展中心助理教授。


