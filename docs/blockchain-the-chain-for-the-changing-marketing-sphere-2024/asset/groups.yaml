    \ Kaur | 133 |\n| | 编辑简介 | | 143 |\n| | 索引 | | 145 |\n\n## 前言\n\n营销在过去十年里发生了很大变化，但得益于区块链，它即将迎来另一场革命。是的，虽然我们大多数人将数字营销与人工智能和分析等事物联系起来，但区块链可能是迄今为止对各行业营销人员最具颠覆性的技术。区块链正在改变数字营销，谁将受益可能会让你惊讶。在过去几年中，区块链对技术造成了剧烈变化，被称为分布式账本技术\
    \ (DLT)，通过去中心化和加密哈希，使任何计算机资源的历史记录不可更改且透明。理解区块链技术的一个简单关系是 Google Doc。当我们创建文档并与一群人共享时，文档是分布式的，而不是复制或移动。确实，区块链在数字营销中的真正影响不仅在于正在开发的新用例。它在于这些用例将如何影响整个系统，这些系统已成为管理数字市场的一种方式。在数字营销似乎每时每刻都在变化和增长的时代，区块链正在以颠覆性、甚至可能不可逆转的方式改变数字营销。\n\
    \n本书将对所有涉及使用区块链技术的人员以及研究人员和政策制定者有用。毫无疑问，区块链技术的中介及其营销人员也将从阅读本书中受益。假定本书将向学生提供关于区块链技术的适当见解，并在相关主题上引起兴趣。\n\
    \n"
