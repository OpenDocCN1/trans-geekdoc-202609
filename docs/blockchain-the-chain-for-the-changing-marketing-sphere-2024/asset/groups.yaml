    ## Chapter 5


    ### A Study on Blockchain Technology and Its Role in Digital Economy – An Indian
    Perspective


    R. Vennila*, PhD and Reshma Sultana, PhD


    School of Commerce Studies, Jain Deemed to be University, Bangalore, India


    ### Abstract


    Blockchain is one of the emerging technologies for accessing and sharing transactional
    data across a vast peer-to-peer network, where non-trusting users can communicate
    with each other without an intermediary in a verifiable manner. The fundamentals
    of blockchain, its uses, kinds, and operation are reviewed in this essay. Security,
    privacy, and the Consensus processes of this technology are also significant and
    cause for concern, and they are the primary drivers behind this novel technique.
    Anonymity, integrity, scalability, and transparency are a few of the key benefits
    of blockchain technology. A variety of technical, social, economic, and regulatory
    hurdles make large-scale integration of blockchain complicated. The article describes
    blockchain technology, how it affects the Indian economy, and its role in shifting
    the economy to a digital economy.


    Keywords: block chain, digital economy, digital transformation


    ### Introduction


    “A blockchain is essentially a distributed database of records, or public ledger,
    of all executed transactions or digital events that have been transmitted among
    participating parties.” A majority of the system’s users must agree on every transaction
    before it can be recorded in the public ledger. Additionally, data that has been
    entered cannot ever be deleted. On the blockchain, every transaction that has
    ever been made is recorded in a precise and verifiable manner. In a straightforward
    analogy, it is simpler to steal a cookie from a jar that is hidden away than it
    is to steal it from one that is visible to hundreds of people in a market. Probably
    the most well-known use of blockchain technology is Bitcoin. As a major factor
    in the growth of an unregulated, multibillion-dollar global industry for anonymous
    commerce, it is also the most controversial. As a result, it has to deal with
    a wide range of regulatory issues that affect financial institutions and national
    governments. Blockchain technology, on the other hand, is not contested and has
    persistently operated flawlessly over time. It is successfully being used for
    both financial and non-financial applications in the real world.


    Reliance on a recognised authority is the basis of the present digital economy.
    Every online transaction relies on a reliable source telling us the truth. This
    may be a social media site like Facebook alerting us that our posts have only
    been read by acquaintances, or it might be a bank ensuring us that our money has
    indeed been moved to our account in a trustworthy manner. The fact is that because
    we depend on a third party for said security and privacy of digital assets, we
    live in a dangerous environment in the digital world. Nonetheless, it is accurate
    that these additional sources could be controlled, hacked, or infiltrated. In
    this case, blockchain technology is useful. By offering a distributed consensus
    that will enable any future time for the verification of any past or present online
    transaction involving digital assets, it has the potential to completely revolutionise
    the digital world. It accomplishes this without jeopardising the confidentiality
    of the parties or the relevant digital assets. A key feature of blockchain technology
    is distributed consensus, as well as anonymity.


    ### Significance of the Study


    The sharing economy notion has developed over the last ten years, and at the moment
    we use shared services like Ola, Uber, Oyo, etc. Blockchain technology is already
    revolutionising society in a few specific cases. Theoretically, buyers should
    be able to learn about a laptop’s location, current value, and condition if they
    register it on the Blockchain and choose to sell it on Olx. Imagine that a client
    purchases your laptop and asks for insurance. In such case, he can quickly share
    the blockchain data with the insurance company, including “what it is,” “how much
    it costs”, “what condition it’s in”, etc., and acquire insurance as a result.
    When items are kept around for a long period without being used, renting them
    out is less expensive than retaining them. In the coming years, blockchain will
    increase the efficiency and security of the sharing economy. Although there has
    been a slow uptake of blockchain technology, numerous countries have gradually
    adopted regulations that support it and virtual currencies. India is gradually
    embracing blockchain technology with the introduction of the new programme “National
    Digital Health Mission (NDHM)” as well as the adoption of a brand-new education
    policy. A database for quick deployment is what the government is attempting to
    give.


    ### Literature Review


    - It has made it easier to comprehend the blockchain’s technological viability
    to perceive it as a “distributed ledger,” which is its most fundamental and crucial
    definition (Tan et. al., 2021).


    - For instance, the Institute of Electrical and Electronics Engineers has given
    this new technical instrument a lot of thought, especially during its 6th International
    Conference on Big Data (Varghese et. al., 2019; Poonia et. al., 2021). However,
    it has only lately been looked into whether it would be financially feasible to
    use this technology as just a prototype for secure digital transactions. (Parekh
    et. al., 2021)


    - There is an anticipated trillion-dollar industry in place that can take advantage
    of this technical advance, particularly in the context of ambitious developments
    like digital India (Singh, 2021; Singh, Bansal and Sharma 2022).


    - Examining and understanding how secure digital transaction dimensions could
    be enhanced and developed is vital to providing a secure and scalable infrastructure
    that really can meet the demands of a growing economy. (Kamble et.al., 2019).


    ### Objectives of the Study


    - To understand the impact that blockchain technology has on the Indian economy.

    - To evaluate the impact of blockchain on the Indian economy

    - To give suitable suggestions.


    ### Indian Economy and the Blockchain


    The seventh-largest economy in the world right now is India. To combat corruption,
    the government abruptly announced a global demonetization on November 8, 2016,
    and outlawed all Rs. 500 and Rs. 1000 banknotes. Since then, the situation has
    already appeared bleak. A nation of 1.2 billion people had to switch overnight
    to cashless and digital transactions. Due to the difficult GST implementation,
    COVID lockdowns in 2020, and Demonetization, the Indian economy has developed
    slowly. A new UN study predicts that this coronavirus scenario would result in
    a 5.9% decline in India’s economy in 2020.


    The tremendous expansion and also rise of digital or cashless modes of payments
    stand out even though there have only been a few bright spots, which have undoubtedly
    been eclipsed by challenging conditions and situations in Indian economy is currently
    facing. It’s seen that the fintech industry has experienced tremendous growth
    and has contributed in some way to economic expansion. According to the World
    Economic Forum (WEF), the government has greatly benefited from the explosion
    in digital transactions that has occurred in India as a result of the demonetization
    strategy. The capacity to track the movement of money inside the economy will
    be improved as a result, which is why it is. Additionally, the entry of blockchain
    technology and cryptocurrencies is a huge benefit. Even though the government
    abruptly decided to prohibit 80% of the country’s currency in 2018, the restriction
    on cryptocurrency transactions was met with a wave of fraud in the months that
    followed. Cryptocurrency exchanges challenged the ban in court, and in March 2020
    they were granted a reprieve (Alaeddin and Rana, 2008).


    The Indian government must find long-term answers to the problems preventing the
    spread of a smoother and fluid cashless economy, as will be the case for any government
    in the globe if it hopes to expand its cashless economy. Financial inclusion,
    high setup and transaction fees, plus protracted transaction delays are some of
    these difficulties. Fundamentally, blockchain is a good place to start because
    the government sorely needs an alternative to traditional financial solutions
    to manage a cashless economy. Blockchain technology virtually eliminates the need
    to be a part of a traditional financial structure to be monetarily included. By
    fostering transparency between government and private sector interfaces, it can
    also facilitate easier business collaboration and a better quality of life for
    Indian citizens. To tap into new sources of efficiency and value, Additionally,
    technology can completely transform current practices (Chillakuri and VS Prakash,
    2022; Grover et. al., 2019).


    India has improved dramatically since 2015, moving up 79 positions to be placed
    63rd in the 2020 edition of the “Ease of Doing Business,” but it still performs
    appallingly poorly in several other areas that require immediate attention, including
    “enforcing contracts” (“ranking 163 out of 190 countries”), “property registration,”
    (“154 out of 190 countries”), and “opening a business” (“136 out of 190 countries”).
    The solution to these issues and the long-term saviour of the Indian economy could
    be the introduction of blockchain technology and Bitcoin transactions. In terms
    of the entire world, it is predicted that by 2030, Blockchain would have produced
    $3 trillion in annual economic value. 10% of the world’s GDP is expected to be
    held on blockchain by 2025, according to WEF predictions. Blockchain is also featured
    as one of the seven technologies that are anticipated to revolutionise a variety
    of facets of our life. Adopting and accepting cutting-edge technologies is the
    cornerstone of the sharing economy’s solution.


    ### Role of Blockchain in the Digital Economy in India


    - Blockchain usage is accelerating in several industries across India and the
    rest of the world. By 2024-2025, Blockchain technology can greatly contribute
    to India’s GDP growth of $5 trillion by 2022.

