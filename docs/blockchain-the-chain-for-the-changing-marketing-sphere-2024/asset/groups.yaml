    从技术角度看，数字数据是通过一种相对较新的技术（称为区块链）进行记录和传输的。区块链在数字营销中提供具有可访问性、安全性和开放性的金融和数据转移（Erragcha
    & Babay, 2021）。消费者可能从更好的数字营销中受益，而企业则可能通过减少在昂贵的数字广告活动上的支出而获利。借助这项新近开发的技术，消费者现在可以直接将其数据出售给营销人员和广告商。


    当今，市场由数据驱动。区块链技术可以让数据所有者重新掌控其使用的广告数据（Urban et al., 2019）。因此，客户与品牌之间的直接数据交换正在发展。用于监控用户活动的高质量监控提高了消费者数据的可用性和信心。


    ## 区块链的历史与运作


    2008年，由中本聪（一个人或一群人）创建了第一个去中心化的区块链。中本聪通过对区块进行时间戳标记而无需第三方验证，极大地改进了架构。为了限制区块添加到区块链的速度，他还设立了难度等级。第二年，中本聪将该创建作为比特币（加密货币）的关键组成部分投入使用，作为该渠道所有交易的主要公共账本。在中本聪的第一篇论文中，“块”和“链”这两个术语是分开使用的，但到2016年，“blockchain”这一术语变得更加常见。事实上，每项活动都作为一块“数据块”被记录（Singh,
    2021; Singh, Bansal, and Sharma, 2022）。


    ![](img/8a4db8a9db41498a2c603e52324b2beb_22_0.png)


    来源：金融时报。


    ## 图1. 使用区块链。


    这些交换显示资产的传输，资产可以是有形或无形的。包括谁、什么、何时、何地以及多少等数据的选择，以及状态，都可以记录在数据块中。前后相连的区块相互关联。随着资产从一处移动到另一处或管理发生变化，这些区块构建了一条数据链。这些区块保证操作的精确时间和顺序，并安全地链接在一起，防止任何区块被更改或一个区块被插入到两个已知区块之间。在像区块链这样不可破坏的链中，几项操作是被禁止的。每个新区块都会加强前一个区块的有效性，从而加强整个区块链的有效性。结果，区块链获得其基本的不可逆性特征，变得不可篡改。用户和其他远程用户可以通过这种方式建立可靠的交易记录，并减少恶意行为者进行操纵的可能性（图1）。


    ## 数字营销


    数字营销利用互联网、社交网络、便携设备、浏览器以及其他渠道来接触客户。参与式数字营销的目标是特定用户群细分市场。数字营销将营销与客户反馈或与客户的双向对话相结合（Rabby
    et al., 2022）。它涉及付费推文、邮件广告和Google搜索结果广告，并且越来越流行。数字营销可以在便携设备上、通过视频游戏或通过智能手机应用程序采取行动，尽管互联网营销是在线进行的。在数字营销中，收到相关广告的个人通常被称为接收者，而广告主通常被称为提供者。


    数字营销是经济中变化最快的领域之一。随着区块链技术的出现，数字营销策略将采取一种新的方式，促进开放，并为公司提供开始在其运营中进行创新的潜力。区块链技术旨在作为一种机制融入营销中，让公司能够追踪数据的转移并确保其真实性。区块链技术便于监控和安全，使我们能够更快地响应问题、找到精确的答案，并为客户提供更出色的互联网形象。在涉及信息安全和开放性时，区块链是数字营销领域在信息安全和开放性方面的最佳合作伙伴。


    ## 营销的重要性


    要理解区块链对营销的重要性，首先要掌握客户管理的重要性。当今高度竞争的企业对消费者（B2C）市场要求企业与客户进行沟通。此外，客户必须能够向其他客户阐明其商品或服务的价值。企业渠道在不同时期有所进步，尽管不同行业有所差异。但无论时间范围如何，营销人员确实会坚持与客户联系相关的相同主要目标和风险（Sharma
    et al., 2021）。随着互联网向分布式系统发展，对于蓬勃发展的企业来说，加密货币广告活动的需求似乎显而易见。由于现代创新，必须优先考虑安全性、透明度、可靠性和保密性。多年来，用户的冷漠和可靠性问题显著增加。


    ## 区块链在营销中的适用性


    2008年的全球金融危机削弱了公众对传统银行业的信心。在这个时期，被称为比特币的点对点（P2P）虚拟货币的发明，展示了密码学方法可用于管理金融交易。BTC为数字现实中的货币和可衡量概念创造了具有约束力的先例，同时也解决了双重支出问题（Schulze
    et al., 2020）。软件的工作方法侧重于认证活动的有效性，这是分布式账本技术对营销的影响最明显的另一个领域。随着交易逐渐以带时间戳的捆绑形式结构化，现有区块链交易的数据无法被更改。区块链营销人员可能会从根本上改变客户与企业的互动方式。加密货币提供了多种技术的优势；然而，其最好的方面是区块链网络用户所进行活动的去中心化数据库（Verma
    & Kaur, 2022）。尽管它可能用于多种其他经济过程，但分布式账本技术的主要目标是资产认证。


    ## 区块链在数字营销中的作用


    区块链技术吸引了大量关注，并通过有记录的用例在多个不同行业中证明了其有效性。例如，在金融、医疗、租赁物业和供应链管理领域，区块链已有几种知名的实现。因此，营销是区块链的可能应用之一。


    ## 增强数字广告活动和营销


    区块链使零售商与广告商之间建立连接，实现数据透明、点击和互动，减少欺诈，并消除中间商。由于数字广告活动数据有时不可靠，因此增强效果可能具有挑战性。区块链使得实时跟踪营销活动并收集可靠信息成为可能。


    联合利华等领先品牌正在成功使用区块链来提高数字广告的效果。该技术将投入全面生产，之后它将与IBM一起推出区块链广告解决方案。


    ## 欺诈预防


    区块链网络允许跟踪公认的数字渠道，并将登记表与经过测试的广告实践进行比较以防止欺诈。只有授权的利益相关者才能安全地访问这些指标。欺诈可能发生在数字广告、机器人、点击农场和幽灵网站等场所。聘请第三方会增加人为错误、网络安全漏洞和数据丢失的风险。为了减少其数字广告活动中的欺诈，丰田等主要企业一直在数字营销中使用区块链应用程序。他们注意到，网站访问量随时间增加了。


    '
