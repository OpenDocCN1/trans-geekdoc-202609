    # Introduction


    Blockchain is a distributed, immutable database that simplifies the recording

    of transactions and the tracking of assets in a corporate network. Intangible

    assets can exist alongside tangible assets (such as a house, car, cash, or land)

    (intellectual property, patents, copyrights, and branding). A blockchain

    network can track and sell nearly anything of value, cutting risk and cost for

    all parties involved.


    The lifeblood of a company is information. The sooner and more precisely

    it is received, the better. Blockchain is ideal for distributing that information

    because it provides immediate, shareable, and completely transparent data

    recorded on an immutable ledger that network members with permission may

    only read. A blockchain network, among other things, can track orders,

    payments, accounts, and output. Furthermore, because members have a

    unified view of the truth, you can see all aspects of a transaction from start
    to

    end, providing you with increased confidence as well as additional efficiencies

    and opportunities.


