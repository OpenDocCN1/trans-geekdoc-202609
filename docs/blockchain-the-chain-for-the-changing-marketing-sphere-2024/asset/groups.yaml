    Figure 10. System Architecture (Dwivedi et al., 2019).


    To implement the framework (Khatoon, 2020), it will use a decentralized application
    (DApp) with a back-end distributed file system (DFS) and private blockchain network
    support (Figure 10). The innovative blockchain contract system for healthcare
    has been implemented using Ethereum. It creates contracts with metadata about
    record ownership, permissions, and data integrity. The system''s blockchain transactions
    cryptographically sign instructions for managing these properties. Policies are
    carried out by state-transition contract functions only when legitimate transactions
    enforcing data change occur. These regulations can implement rules governing a
    particular medical record as long as it can be computationally represented. It
    is possible to create a smart contract stored on the blockchain containing all
    the conditions, including managing various permissions and data access. Smart
    contracts have rules for authorizing data. It can also assist in tracking every
    activity with a unique identifier from beginning to completion. The hash of the
    data is the data element of the block committed to the chain, and all medical
    record data is stored in local database storage to maintain performance and economic
    viability. The private key of the owner is used to sign the data transactions.
    The system''s block content represents a peer-to-peer private network''s data
    ownership and viewership permissions. The use of smart contracts, which enable
    us to automate and track specific state transitions, is supported by blockchain
    technology. Patients can consent to share records between providers, and providers
    can add a new description for a particular patient. To manage identity verification,
    it uses a DNS-like implementation that maps the user’s Ethereum address to an
    already existing and widely accepted form of identification like their name or
    social security number.


    Peer nodes in the MedChain network (Shen, Guo, & Yang, 2019) fall into two categories:
    edge and super peers (Figure 11). Servers from smaller providers, like community
    clinics, that only store the actual patient data make up the edge nodes. There
    are two subnetworks within it: a directory service and a blockchain service network
    with various information derived from healthcare data. A super peer’s resources
    are divided into three modules: healthcare database, directory service, and blockchain
    service. The blockchain server maintains a complete blockchain for auditing and
    data integrity verification. The directory server manages data-sharing sessions
    and keeps track of user healthcare data’s inventory, location, and storage location.
    Two sub-networks are formed by the two types of servers on all super-peers. The
    actual patient healthcare information is stored in the final component, HDB.


    ![](img/8a4db8a9db41498a2c603e52324b2beb_49_0.png)


    Figure 11. System Architecture (Shen, Guo, & Yang, 2019).


    ![](img/8a4db8a9db41498a2c603e52324b2beb_50_0.png)


    Figure 12. System Architecture (Fu, Wang, & Cai, 2020).


    A lightweight privacy-preserving mechanism for a healthcare blockchain system
    is included in the framework (Fu, Wang, & Cai, 2020). To encrypt the original
    EMRs, an interleaving encoder is utilized. It was mostly made up of two main parts:
    recovery and use of EMRs and the creation and storage of shares of EMRs (Figure
    12). The primary participants in the initial EMRs are the patient and medical
    professional. An authorized data user must first search the EMR’s index on the
    blockchain to locate all the nodes that store the EMR’s shares before attempting
    to explore an EMR. The interleaving decoder will decode the recovered subsections
    of the EMR after the subsections of the EMR have been reconstructed, and the original
    EMR R will be obtained. After that, authorized customers can process these recovered
    EMRs for various purposes. Utilizing the indexes of the stored EMR shares, blocks
    that are then chained together to form a blockchain is created. An EMR can be
    recovered by authorized data users or institutions requesting at least t shares
    from the blockchain nodes.


    ## Supply Chain


    The decentralized structure, distributed nodes and storage mechanism, consensus
    algorithm, smart contracting, and asymmetric blockchain encryption ensure network
    security, transparency, and visibility. Blockchain is a technology with a singular
    combination of these features. Supply chain (SC) functions, including SC provenance,
    business process reengineering, and security enhancement, have enormous potential
    to be transformed by blockchain. By creating an irrefutable record in the public
    ledger, the blockchain enables a distributed consensus mechanism that makes it
    possible for all parties involved to be informed of every event and transaction.
    The demand side and supply side of a given supply chain member’s network make
    up the supply network. The term “supply side” refers to any supply chain components
    that contribute directly or indirectly to the primary company. All supply chain
    members that the product encounters on its way to the final consumer make up the
    demand side.


    A user service framework (Jamil et al., 2019) is the foundation for the developed
    application, which uses a distributed ledger and smart contract as middleware.
    The end user uses the application to send the transaction proposal to call backend
    services like medical prescription, profile management, appointment, EDR, data
    sharing, pharmacy management, etc., provided by the blockchain network that is
    being proposed (Figure 13). Complete CRUD operations transform the ongoing data
    between the connected nodes in the blockchain transaction. The user identity manager
    provides certificates for user enrollment and authentication. The consensus’s
    consent manager controls the transaction order and connects a department to a
    subnetwork through a provided interface. A distributed ledger and nodes make up
    a drug delivery blockchain’s departments. The node is equipped with a smart contract
    that either approves the transaction proposal or writes a transaction block to
    the ledger. The immutable and transparent transactions, logs, and histories of
    all network events and actions are recorded by distributed ledger technology.
    The blockchain’s node comprises an intelligent contract, blocks, a state database,
    and policies. The ledger’s state at a given time is represented and stored in
    the state database. The connection between the state database and the block is
    shown in the sample white box representation of a node. Because it is a computer
    program that can execute transactions and access blockchain blocks and history,
    an intelligent contract adds functionality to the blockchain.


    The Gcoin blockchain (Tseng et al., 2018) records the manufacturers’ direct transfer
    of transaction data to drug receivers (Figure 14). The chain verifies the drug
    information, the number of drugs, and the transaction data of the digital signatures
    of the seller and buyer. The digest of all of this data is then hashed and stored
    on the Gcoin blockchain. Due to the presence of fraudulent information regarding
    unspent transaction outputs (UTXO) stored in the Gcoin blockchain, any attempt
    by an illegal distributor to sell counterfeit drugs to buyers will be deemed invalid.
    With the correct private key, unauthorized personnel can use this system to purchase
    drugs. As a result, any transaction irregularities would be immediately apparent
    to the buyer or seller.

