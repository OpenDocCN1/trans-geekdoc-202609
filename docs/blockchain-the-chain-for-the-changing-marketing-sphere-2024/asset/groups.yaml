    ### 解读


    ANOVA f 比值和显著性值表明，年龄对使用 Instagram 作为社交媒体平台没有显著影响，f(1,68) = .825，p > .05（表 9）。


    ## 年龄对使用 WhatsApp 作为社交媒体平台的影响


    ### 解读


    ANOVA f 比值和显著性值表明，年龄对使用 WhatsApp 没有显著影响，f(1,68) = .115，p > .05（表 10）。


    ### 表 10. 年龄对使用 WhatsApp 作为社交媒体平台的影响


    | | 平方和 | 自由度 | 均方 | F | 显著性 |

