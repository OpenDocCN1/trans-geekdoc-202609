- pgno: 16
  md: '# **Realtime Examples of Companies Using Blockchain Technology**


    # **Banking Sector**


    In the last few decades as technology has advanced scams, frauds, and threats
    have also taken advantage of the technology. There have been so many fraudulent
    activities going on via phone calls, the internet, e-mails, messages, etc. With
    one touch the hackers try to steal the money of the common public. But bankers
    provide safety and security to the consumers'' financial transactions and interests.
    They effectively provide a global platform to help clients transfer money as an
    alternative to physical cash. Bitcoin cryptocurrency has been popular in recent
    years, it can be replaced in place of currencies that are currently put in use.
    Despite its increasing popularity, cryptocurrency is currently only accepted by
    a limited number of businesses. This is mainly due to its complex nature, which
    has resulted in a lack of basic knowledge among the general public regarding cryptocurrency
    and its uses. Nevertheless, cryptocurrency has the potential to pave the way for
    the digitalization of transactions, as demonstrated by Figures 1 and 2 (Howell,
    2022).


    # **IBM**


    It uses blockchain technology to analyze the demand supply and advertising chain.
    Their goal is to eliminate unnecessary expenses on third parties or intermediaries.
    And they also use this technology to keep an eye on the fil fraudulent activities
    taking place, like exposing fake data, advertisements, etc., which improves their
    goodwill (Singh, 2021; Singh, Bansal, and Sharma 2022).


    # **The Telecom Sectors**


    The Telecom Regulatory Authority of India (TRAI) is slowly integrating blockchain
    technology to combat the rise of fake messages, spam, hoax calls, and fraudulent
    activities that have become prevalent since the advent of mobile phones. This
    technology helps filter out unregistered fake callers and'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'messages. As blockchain technology is often used in conjunction with Artificial
    Intelligence (AI), it can effectively address the weaknesses of organizations,
    according to Daley (2022).


    # SEBI


    The Securities Exchange Board of India (SEBI), in its earlier stages they have
    faced many fraudulent activities, and third-party intrusion, later they broke
    down into listed and unlisted companies to avoid these activities which made a
    huge difference and it brought transparency among the stock and securities. After
    the incorporation of blockchain technology, they can bring more transparency to
    their record-keeping, and monitoring of securities.


    # Conclusion


    Despite the advancements in technology, there are still numerous instances of
    fraudulent activities taking place online. Unfortunately, many unsuspecting customers
    fall victim to these scams. It''s important to note that technology itself cannot
    be held responsible for these occurrences. However, companies and banks have taken
    steps to strengthen their safety and security measures. They are constantly reminding
    consumers through ads on social media, television, and other platforms not to
    trust fake ads or messages. Therefore, consumers need to remain vigilant and thoroughly
    check any offers or benefits provided by these technologies before taking any
    action.


