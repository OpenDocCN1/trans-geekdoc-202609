    # Introduction


    In today’s era of Web 3.0 where users retrieve and share information through personalized
    searches; and results are based on the user’s behavior learned by the browser.
    Hence, Web 3.0 has upgraded the traditional internet to a more open, connected,
    and intelligent internet.


    Web 3.0 has made the Internet artificially intelligent, which means, unlike Web
    2.0 internet doesn’t give search results that a business wants to showcase to
    the customers, but it shows the result that the customer wants from a business.
    The best example is Google search, earlier, based on our keywords Google used
    to show the best relevant results. However, now Google considers our - past keywords,
    click-on search results, preferences, field of interest, influencers, online connections,
    how we connect with others, and more. And based on the compiled information, Google
    shows the most accurate results.


    Social media platforms are websites and mobile applications-based online tools
    that enable people to create & share content (like data, pictures, audio, and
    videos) quickly and interact with new people in real time. It has made communication
    easier than ever before.


    According to McKinsey 2018, Indians spend 17 hours per week on social media websites
    like Facebook, Instagram, Twitter, and others; which is the highest in the world.
    As per a report by Statista 2017, because of growing digitalization, access to
    cheap Android smartphones, and a 4G network, more than 462 million people across
