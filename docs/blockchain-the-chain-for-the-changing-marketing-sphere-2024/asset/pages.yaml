    # Review of Literature


    # Impact of Social Media on Business and Consumer


    Social media platforms are a focal point that has been gaining significant importance
    for quite some time. Both present and future e-vendors in India are interested
    in expanding their business through online social media platform as they capture
    the large market and also helps to cover customers irrespective of their geographic
    factors also, they have been blessed with various set of policies that exist for
    the growth of such e-vendors. India has been focusing on technological entrepreneurship
    that would enhance the contributions of Information Technology and Communication
    (ICT) (Singh, 2021; Singh, Bansal and Sharma 2022).


    Social media richness could be defined into parts like blogs, content communities
    (YouTube), collaborative projects (Wikipedia), virtual game worlds, and social
    networking sites (Facebook, Instagram) (Kaplan and Haenlein, 2010).


    In such a competitive environment, business need to think of some smart and intelligent
    solutions for e-business and e-marketing communication, both internal and external;
    in addition, at the same time, they set new pressures to address the “multilayerdness”
    of contemporary business relationships (Gronroos, 1994; Paswan, Blankson, and
    Guzman, 2011).


    It shows that social media could be divided into public social media and enterprise
    social media based on ownership. Where the public social media has been divided
    into three parts, social networking sites, web-based'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'community, and the virtual world while enterprise social media has also been
    divided into three parts which are enterprise-owned social, enterprise social
    bookmarking systems, and enterprise wikis (Wang et al., 2017).


    With the advent of the internet, consumers’ interests are increasing in purchasing
    products via online social media platforms. It also helps to connect domestic
    as well as international business. It helps in marketing communication as social
    media platforms reduce the gap between domestic and international business communication
    (Costa e Silva and Elo, 2018).


    Market research reports suggested that companies use social media platforms for
    building good customer relationships. As for any company, it is important to build
    brand image and social media platforms are an important part of the promotion
    mix of business.


    There has been a shift in how people communicate with each other and with businesses
    as social networking sites act as a platform for targeting customers and transforming
    the market into a technology platform with content that is according to users
    (Lorenzo-Romero et al., 2014). To promote brands and for sharing information regarding
    brand content social media channels are used and results indicate that the inclusion
    of corporate brand names, functional and emotional appeals, and information search
    cues has increased the popularity of brand content (Swani et al., 2017).


    It has been identified that there are three factors for a company or brand to
    use social media platforms and these are; to share information with other planners
    easily and quickly through chat or discussion boards, to communicate queries and
    solutions to problems and opinions with other meeting planners and to get feedback
    from people after the meeting (Lee, Tyrrell and Erdem, 2018).


    It was also stated that there was no direct relation between the size of the company
    and their frequency to use social media as a platform but at the same time reasons
    for using social media as a platform are different because small and medium size
    firms mainly use it for customer services while large size company uses it for
    brand building (Olivas-Lujan et al., 2013).


    The business focuses on increasing its business exposure and brand awareness through
    the use of social media platforms and creates a large pool of client and provide
    proper access to employees of the organization (Heetal, 2017; Wizigetal, 2012).


    Information communication is an important aspect of making customers satisfied.
    It also gave importance to this issue by highlighting the expectation of consumers
    through continuous availability of information and timeliness to be an important
    aspect when securing customer satisfaction.'
