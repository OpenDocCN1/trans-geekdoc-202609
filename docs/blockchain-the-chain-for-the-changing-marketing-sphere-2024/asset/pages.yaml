- pgno: 116
  md: '# Chapter 7


    # Big Data Analytics in Customer Segmentation and Customer Satisfaction


    # Sanjay Taneja^{1*}, PhD

    and Prince Marwaha^{2}, PhD


    ^1USB-BBA, Chandigarh University, Mohali, Punjab, India

    ^2Arya College, Ludhiana, Punjab, India


    # Abstract


    Employees must be the most essential assets of a company. However, for a company
    to achieve success in the long run, it is important to sustain customers and provide
    them with the best services/products based on their demands. This is where customer
    segmentation comes in. For a company to deliver its best, the target audience
    must be selected and divided into groups. This practice is known as customer segmentation.
    In this paper, various advantages of customer segmentation have been discussed
    along with certain strategies to make it better. Lastly, a relationship between
    customer segmentation and satisfaction has been established.


    Keywords: customer segmentation, satisfaction, relationship, advantages, big data,
    determining, aspects, products, services


    * Corresponding authors'' email: drsanjaytaneja1@gmail.com.


    In: Blockchain

    Editors: Amandeep Singh, Sandhir Sharma, Amrinder Singh et al.

    ISBN: 979-8-89113-219-1

    © 2024 Nova Science Publishers, Inc.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Introduction


    The process by which a business enterprise, company, or organization divides its
    customer bases into similar, relevant, and different groups is known as the method
    of customer segmentation. The division of such measures of the customer groups
    is done by the business organizations to put more emphasis and focus on their
    customer bases as well as their customers. Business organizations present all
    over the world, have an organizational goal of expanding their business and increasing
    their sales. To do so or attain their organizational goals, they have to know
    the tastes and demands of their customers and assess what is needed by their various
    customer bases. The bigger the business enterprise, company, or business organization
    would be, the bigger would its business bases, and the bigger would be the emphasis
    and assessment of its customer demands. In order to know the customer bases, business
    organizations assess and analyze the preferences, tastes, and various demands
    of their customers. One of the first principles and strategies of a business company
    or business organization is to identify their customers and put more focus on
    attaining them. Customer segmentation is done by using the tactic or strategy
    of customer segmentation management. This method helps business companies and
    business organizations to divide their customers into separate distinctive groups.
    The division is done by the business organizations based on the similar and relevant
    tastes and demands of their customers and segments them into similar groups. The
    marketing departments and the executive departments of a business company or business
    organization implement the process of customer segmentation within their business
    organization. These departments have the authority of implementing customer segmentation
    because eventually, it helps the business organizations to assess their customer
    behaviors and get information about who is buying or using their products and
    services.


    # Customer Segmentation


    Customer segmentation is a crucial, major, and one of the most important procedures
    of a business company or a business organization. Business organizations separate
    and divide their customers into separate distinctive groups by assessing their
    demands and characteristics. Various marketing tactics and strategies are used
    to attain the organizational goal of putting the'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'data of customers into separate customer segments. This procedure could be
    undertaken by the market analyst of an organization or business company (Christy
    et al., 2021). Business organizations undertake this method of customer segmentation
    to increase their sales and profit margins. This also helps them in greater response
    from their customers who are divided into different segments and helps them retain
    their customers by emphasizing and meeting their demands. This process of customer
    segmentation is also done by various business organizations present all over the
    world to maintain and manage relations between their customers and their organization.
    The process of customer segmentation in a way helps different business organizations
    in various ways. Business organizations get help in designing their marketing
    plans and sales strategies based on their assessment and implementation of customer
    segmentation. The brand image, value, and brand loyalty of an organization or
    business company are also increased along with customer satisfaction of that business
    organization. These are all done under the various needs and demands of their
    segmented customer bases. However, customer segmentation is considered the first
    step towards customer satisfaction by all the business organizations and business
    companies in the industry. The method of customer segmentation that is undertaken
    by various indifferent business organizations as a part of their marketing strategies
    gives them certain perks. Business organizations get to know and acquire the ability
    to understand different patterns and several different differences among their
    customer bases (An et al., 2018; Taneja et al., 2023a, 2023b, 2023c, 2023d, 2023e
    2023f).


    # Beneficial Aspects


    There are different beneficial aspects to undertaking the method of customer segmentation
