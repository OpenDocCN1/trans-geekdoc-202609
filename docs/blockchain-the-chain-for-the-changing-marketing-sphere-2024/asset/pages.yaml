  md: '# # Preface


    Marketing has changed a lot in the past decade, but it is about to go through
    another revolution, thanks in large part to the blockchain. Yes, while most of
    us associate digital marketing with things like AI and analytics, blockchain may
    be the most disruptive technology yet to hit marketers in every industry. Blockchain
    is changing digital marketing, and you may be surprised who will benefit. Blockchain
    has brought a drastic change to the technology in the last few years and it is
    referred to as Distributed Ledger Technology (DLT), making the historical backdrop
    of any computerized resource unalterable and straightforward using decentralization
    and cryptographic hashing. A straightforward relationship for comprehension of
    blockchain innovation is a Google Doc. At the point when we make a record and
    offer it to a gathering of individuals, the archive is dispersed rather than replicated
    or moved. Indeed, the real impact of blockchain in digital marketing is not just
    in the new use cases being developed. It is how those use cases will impact entire
    systems that have popped up as a way to manage the digital marketplace. In a time
