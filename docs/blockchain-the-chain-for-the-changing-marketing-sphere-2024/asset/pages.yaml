  md: '# About the Editors


    **Dr. Amandeep Singh** has obtained his BIT, MBA, and Ph.D. and is also UGC-NET
    qualified. He has served as dean/principal in various reputable universities and
    colleges. Dr. Singh is currently a professor at Chitkara Business School, Chitkara
    University, Punjab, India. He has more than 15 years of teaching experience and
    was named "Best Teacher" in 2008. He is also part of the board of studies of various
    B-Schools and leading universities in northern India. He has published 35 research
    papers in various journals and conferences indexed in Scopus, Web of Science,
    and ICI. In addition, he has edited nine books with renowned publishers like Wiley,
    Nova, and IGI Global. Dr. Singh is on the editorial board for three international
    journals and has also chaired many national and international conferences. His
    main area of research is marketing with a special focus on digital marketing.


    **Dr. Sandhir Sharma** is a Ph.D. in Strategic Management with nearly 22 years
    of experience in higher education and 5 years in the Telecom industry. With more
    than 43 research papers to his credit published in various journals and conferences
    at the national & international levels, Dr. Sharma has developed his core expertise
