  md: '# Chapter 1


    # Blockchain Technology in the Marketing Sphere


    V. Varisha Begum and M. Kavitha*, PhD


    Department of Commerce, VELS Institute of Science, Technology & Advanced Studies,
    Pallavaram, Chennai, India


    # Abstract


    E-commerce refers to the buying and selling of goods and services, and the transfer
    of funds or data via computer networks. There are different types of e-commerce
    transactions, including business-to-consumer, business-to-business, consumer-to-business,
    and consumer-to-consumer. E-commerce has been around since the early days of computer
    technology, but it has become more prevalent in the last two decades with the
    advent of new technologies. One popular form of e-commerce is online retail shopping,
    or “e-tail,” which allows customers to purchase everyday items online.


    This chapter provides an overview of blockchain technology, including how it works
    and its various applications. With real-life examples, the chapter explores the
    usefulness of blockchain technology for both organizations and the general public.


    Keywords: e-mail, e-commerce, blockchain technology


    * Corresponding Author''s Email: kavitha.sms@velsuniv.ac.in.


    In: Blockchain Editors: Amandeep Singh, Sandhir Sharma, Amrinder Singh et al.
    ISBN: 979-8-89113-219-1 © 2024 Nova Science Publishers, Inc.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Introduction


    In the wake of technology and computers, a customer-centric market is essential.
    Organizations have used many methodologies to communicate with consumers over
    the decades. For example, it was a barter system earlier, then it transformed
    into coins and currencies, later after the dawn of computers, artificial intelligence
    (AI), robotics, etc., there have been novel applications say, e-tail (electronic
    retail shopping), e-commerce, online services, feedbacks and rectification of
    errors over audio voiceovers. The internet has provided a wide scale of services
    to satisfy their basic needs. The introduction of blockchain has shown some impact
    in the environmental sphere as well as the marketing sphere.


    Blockchain gained its fame through bitcoin cryptocurrency at the beginning stages.
    But nowadays blockchain is not only used in digital currencies. It is a decentralized
    ledger for recording, sharing, and confidential maintenance of transactions that
    cannot be changed or disrupted. The data are stored digitally in blocks i.e.,
    the customers’ data are stored in digital format, which cannot be altered by any
    common person.


    # How Blockchain Technology Works


    All information entered is stored in blocks. Only authorized persons can access
    the data. That specified person can input data. All the transactions are saved
    in a hash. The first created block does not have a hash. Each block contains a
    hash that stores all transactions. Each block contains the date and time of the
    transactions taken over by each owner. These blocks are securely linked to one
    another which means that the transactions cannot be altered or misused. This process
    is called an irreversible blockchain.


    The data entered is first encrypted i.e., transformed into digital codes which
    can be saved digitally easily. Then the details of a customer are saved in each
    separate block, the transactions are stored with all dates, times, and events
    mentioned clearly. These data cannot be accessed by unauthorized persons, it cannot
    be changed or removed. It is first coded i.e., encrypted, and later when the customer
    needs their information this technology decodes the block by cryptography, so
    it reaches the customer.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Blockchain Applications


    Blockchain is used in the following areas,


    +   1. Cybersecurity

    +   2. Supply chain

    +   3. Accounting

    +   4. Health sector

    +   5. Cryptocurrency

    +   6. Logistics

    +   7. Educational sector


    The emergence of blockhain technology has made a significant impact in various
    industries such as banking, IT, healthcare, and the travel industry. E-commerce
    has been greatly transformed through mobile applications that have altered the
    perspective of consumers toward business, branding, and marketing. While there
    are various technologies and applications used in e-commerce, let us focus on
    the transformative power of blockchain technology. It was first developed by Satoshi
    Nakamoto in 2007, who also introduced Bitcoin cryptocurrency to the market. In
    today’s world marketing field is at its peak. A product to sustain itself in the
    market must be given various catchy advertisements, billboards, hoardings, attractive
    slogans, etc.


    For example, if we take the travel industry, blockchain technology plays a major
    role in organizing tours and travel for the public. As we know, how hectic and
    segregated the process of arranging for tours or trips whether it is international
    or local. This blockchain technology helps in bringing together and making the
    booking for tours hassle-free. In 2017, a private industry named Winding Tree
    was established in Switzerland. This website enables the public to easily book
    travel tickets, flight tickets, hotel accommodations, tour guides, and more. It
    eliminates the need for gatekeepers and allows for all bookings to be made on
    one site. This helps prevent extra expenses when planning tours and travel.


    In the last recent decades, there has been hype for branding and online marketing.
    Companies have started advertising and marketing via social media after the advancement
    of computers and online resources like various social media like Facebook, WhatsApp,
    YouTube, etc., in the last few decades. Since there are many easier options to
    reach the end consumers it is easy for the companies to popularize their brands
    by providing frequent offers, attractive discounts, coupons, and gifts, etc. Placing
    orders online and purchasing goods has lately become a fashion which also led
    to many online threats. Here'
  merge: -1
  img_proc: true
- pgno: 15
