  md: '# Chapter 6


    # Blockchain Technology: A Critical Player in Business, Strategy, and the Environment


    Divya Bansal*, PhD and Mona Chaudhary


    Amity University, Noida, India


    # Abstract


    Blockchain technology is a disruptive breakthrough built on information and computing
    technology that is still growing very quickly. This fundamental disruptive technology
    enables a shared digital history and record updating between parties who may not
    necessarily trust each other while avoiding the need for a central trusted agent
    for coordination. From its beginnings in cryptocurrency, blockchain is already
    finding use cases across a variety of industries, such as banking, law, education,
    healthcare, supply chains, and manufacturing. More than ever, marketers must learn
    how to use new technology and deploy them quickly.


    However, despite the advent of blockchain technology more than ten years ago,
    academic marketing researchers have paid very little attention. Because of the
    distinctive characteristics of blockchain—transparency, decentralization, and
    immutability—it can foster a safer, customer-focused, and open marketplace for
    both individuals and companies.


    This study’s primary goals are to increase knowledge and fill in knowledge gaps
    related to the creation and use of blockchains. It is meant to serve as a platform
    for academics and industry professionals to critically examine, investigate, and
    explain new models and forms that


