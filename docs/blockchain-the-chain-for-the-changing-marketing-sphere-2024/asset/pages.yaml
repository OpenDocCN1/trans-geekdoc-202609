  md: '# Chapter 9


    # # Blockchain and the Digital Transformation of Businesses: A Review of the Literature
    and Future Research


    # Jaskiran Kaur*


    Lovely Professional University, Phagwara, Punjab, India


    # Abstract


    The digital economy has grown rapidly in the era of Dazhiyiyun (big data, artificial
    intelligence, mobile Internet, and cloud computing), and based on technical supremacy,
    the digital transformation of firms has become a hot subject in the sector. The
    significance, mechanism, application scenarios, restrictions, and countermeasures
    of blockchain technology for the digital transformation of organizations are picked
    out from the literature on the digital transformation of enterprises in this study.
    The majority of the literature suggests that blockchain technology aids in the
    digital transformation of businesses, but there is a dearth of evidence and actual
    studies to back this up. It is also discovered that there is no systematic theoretical
    framework and experience summary, the dynamics of the digital transformation of
    organizations are not taken into consideration, and the evolution of firms after
    digital transformation is understudied.


    **Keywords:** blockchain; digital transformation; digital economy


    * Corresponding Author''s Email: er.kaur.jaskiran@gmail.com.


    In: Blockchain

    Editors: Amandeep Singh, Sandhir Sharma, Amrinder Singh et al.

    ISBN: 979-8-89113-219-1

    © 2024 Nova Science Publishers, Inc.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Introduction


    Big data, artificial intelligence, cloud computing, blockchain, and other technologies
    are developing quickly, and this is reflected in the rapid pace, broad reach,
    and profound effect of India''s digital economy. According to the White Paper
    on the Development of the Chinese Digital Economy in 2021, the overall size of
    the Chinese digital economy in 2020 was 39.2 trillion yuan or 38.6% of GDP, and
    it was taking up more and more space in the country''s economy. The 14th Five-Year
    Plan for the Development of the Digital Economy also included proposals to implement
    the comprehensive “Shangyun Yongshu Fuzhi” service (i.e., put on the cloud, use
    data, and render intelligence), speed up enterprise digital transformation and
    upgrade, and make it easier to rationally apply blockchain and other technologies
    in banking, securities, insurance, and other fields. Since 2017, Postal Savings
    Bank, Merchants Bank, Ant Financial, Tencent, and other businesses have also used
    blockchain technology in asset custody, cross-border RMB clearing, letter of credit
    settlement, SME finance, and other areas. Thus, enabling businesses to undergo
    a digital transformation through technology has become a general trend and hot
    topic in the sector. How can blockchain technology aid businesses in becoming
    digital? What are the limitations of the transformation process? Are there viable
    alternatives for digital transformation? These are all crucial issues that require
    resolution. This piece presents a summary of the importance, mechanism, and application
    scenarios of blockchain technology for enterprise digital transformation. It also
    explores the connection between blockchain technology and digital transformation,
    offering a future research direction to enable enterprises to transform in an
    information-based manner. Existing literature has been organized to provide insights
    into the constraints and elevation schemes of blockchain technology for digital
    transformation.


    # Review of the Literature


    To overcome the problems with users’ uneven access to information, information
    technology (IT) is used. Everyone might profit from a narrower digital gap thanks
    to an increase in interest volume and fewer access restrictions. It focuses on
    giving out a ton of information and alters how information is sent over the Internet.
    Digital technology has the potential to lessen social credit difficulties that
    are still present on the Internet and cannot'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'be resolved by information technology. Additionally, it is essential to the
    introduction and advancement of blockchain technology. A variety of technologies
    have naturally merged to create blockchain technology. A highly secure, traceable,
    tamper-free, and decentralized method of data storage is created by merging distributed
    storage, sharing protocol, consensus algorithm, encryption algorithm, and other
    technologies. (Zhang et al., 2020). Additionally, it has created new credit, transaction,
    and rule systems with minimal risk and no cost of trust (Zhao, 2020). Digital
    transformation is the use of digital technologies to alter businesses, particularly
    in terms of changing their organizational structure, management style, and production
    standards, among other things. It helps the firm reshape an original business
    concept.


    # The Significance of Applying Blockchain Technology to

    the Digital Transformation of Enterprises


    Many academics concentrate on the technical benefits of blockchain and its beneficial
    practical application to the digital transformation of businesses. Huang (2019)
    claims that the blockchain’s asymmetric encryption technology can guarantee the
    security and dependability of business data, help business data become assets,
    speed up the flow and encashment of data, allow enterprises to preserve and trace
    data to its source, and realize its manageability and controllability. According
    to Lu et al., (2021), the decentralized, disintermediation, collective maintenance,
    and reliable database are four benefits of blockchain technology that can be used
    to create a financial blacklist and whitelist to improve the effectiveness of
    the current financial credit reference system. According to Yang (2019), the implementation
    of the “blockchain+ big data” finance model was beneficial for lowering financing
    risks, increasing the readiness to provide money, and improving the effectiveness
    of resource allocation. On-chain digital value transfer technologies, such as
    exclusive chain ledgers, shared chain ledgers, certificate management, and SaaS
    layer services, have been noted by Tan and Wu (2018) as having the potential to
    streamline current processes, lower business risks, and enhance data accuracy.
    According to Chen et al., (2019), government and business investments in digitization
    can make it easier for blockchain applications to improve the effectiveness of
    the internal capital market for businesses. Financial institutions used blockchain
    technology to increase the cost paid by small and medium-sized enterprises (SMEs)
    to falsify'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'credit information and price differentials. Silva and Santos (2022) claimed
    that blockchain technology can improve the efficiency and transparency of the
    supply chain, and the decentralized structure offered invariable properties to
    all parts of the supply chain. Cryptography also guaranteed security. CAICT (2021)
    asserted that the creation of a cross-border trade financial blockchain platform
    can resolve the issue of the veracity of cross-border trade background, improve
    the service effectiveness of cross-border trade settlement of commercial banks,
    and increase the security of cross-border trade finance business of commercial
    banks, using the Guangdong-Hong Kong-Macao Greater Bay Area as an example. According
    to Fang and Hu (2017), blockchain increased the transaction efficiency of banks
    and trade financing businesses and made the entire trade financing channel more
    unhindered by enabling all parties of the industrial chain to clearly understand
    the flow of goods, capital, and information. According to a recent analysis by
    PWC, blockchain might help the insurance business save $5 billion to $10 billion
    in costs, or 15% to 20% of its overall cost (Zhao, 2020). And according to the
    Gartner Group’s projection, the market value of blockchain will be around $176
    billion in 2025 and $3.1 trillion in 2030. Additionally, the Bank of Spain thinks
    blockchain technology would help them save $20 billion in accounting expenses
    by 2022. All of those statistics show how important blockchain is to company digitalization.


    # The Mechanism of How Blockchain Technology Was Applied in the Digital Transformation
    of Enterprises


    The use of technologies such as distributed data ledgers, decentralized networks,
    consensus mechanisms, cryptography hash algorithms, and digital evidence storage
    can aid businesses in achieving digital transformation, according to Zhang et
    al., (2020), who cited Country Garden Holdings as an example. By breaking down
    data silos and speeding up data flow, these technologies can contribute to preventing
    moral hazards like enterprise information manipulation and malicious fraud, as
    noted by Gong, Ban, and Zhang (2021). Liao (2021) proposed a logical correlation
    model that highlights how blockchain technology can promote the development of
    the digital economy by spurring digital industrialization, industrial digitization,
    digital governance, and the digital environment. Huang (2019) suggested that blockchain
    technology’s tamper-proof nature and real-time transaction'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'capability could benefit peer-to-peer lending. Chen et al., (2019) explored
    the application of Fabric technology in certain business sectors by fusing consortium
    blockchain technology with hyper-ledger fabric and using the forfeiting industry
    as an example. They also introduced a novel blockchain information-sharing scheme
    that incorporated homomorphic encryption to address security concerns. Chen et
    al., (2021) noted that cross-border blockchain service platforms can increase
    payment efficiency by providing equal access to information for all users in the
    supply chain, which eliminates the need for banks to rely on intermediary companies
    to obtain actual information and saves time, money, and human resources. These
    platforms share data with banks and other financial institutions, including enterprise
    loan information, capital flow information, credit information, and logistics
    information, sourced from various government departments such as the State Administration
    of Foreign Exchange, tax authorities, and logistics offices.


    # The Application Scenarios of Blockchain in the Digital Transformation of Enterprises


    As well as applications in safe storage, access control, and auditing in the fields
    of intelligent medicine, intelligent transportation, the smart city, and supply
    chain management, Yang et al., (2020) analyzed the typical application framework
    of blockchain technology in data sharing scenarios. By establishing a technical
    inspection model and applying blockchain technology to the digital landscape of
    the marine industry, Yang (2019) concluded that the use of and further advancement
    of blockchain technology can have a significant influence on sectors associated
    with shipping. Emphasizing the need to further investigate the issue of data security,
    especially data security in the manufacturing industry, Pal (2021) noted that
    blockchain technology can make the processing of transactional data in the manufacturing
    field more intelligent and flexible through appropriate fusion with the Internet
    of Things technology. According to Lu et al., (2021), the “blockchain+ agricultural
    internet of things” model, “blockchain+ agricultural supply chain” model, “blockchain+
    agricultural data sharing model,” etc., are examples of applications of blockchain
    technology in agricultural data management. Zhang (2020) looked at how blockchain
    technology may be used for several business and trade-related issues, including
    letters of credit, cross-border payment, supply chain financing, digital logistics,
    commodities traceability, and digital'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'customs and management. By creating an asymmetric consortium blockchain system,
    Fu et al., (2021) facilitated the effective and timely execution of cross-border
    transactions. They created a new smart contract to lessen each node’s opportunity
    loss and improved the method for distributing profits. They then used the system
    in actual cross-border transaction situations in Shenzhen and Hong Kong to confirm
    its efficacy and viability. According to Zhang et al., (2019), Country Garden
    Holdings and Ant Financial should work together to develop application scenarios
    such as a blockchain-based e-invoicing platform, a platform for tracking agricultural
    products, and a platform for exchanging interest and credit rights. According
    to Nie et al., (2017), the issue of Internet financial risk control may be solved
    by advancing blockchain technology to the “dual-channel” credit reference technology
    of “decentralized+ centralized” based on big data. According to Guo (2019), the
    Chinese insurance sector has entered an age dominated by digital technologies
    including big data and blockchain. The digital transformation of insurance firms
    has the potential to improve the synergy between them and linked businesses, spur
    innovation in insurance products, optimize customer experience scenarios, and
    change the way insurance organizations operate. Large-scale banks like J.P. Morgan,
    HSBC, and Bank of America, among others, have successfully used blockchain technology,
    and now they are looking for technical innovation. This technology demonstrated
    great efficacy, economy, and directness and also examined the method by which
    banks used blockchain technology to improve transaction security and banking safety.
    The uses of blockchain technology in commercial banks, supply chain finance, cross-border
    payments, risk management, and the capital market were enumerated. Chen et al.,
    (2021) developed an e-commerce payment platform security algorithm, improved the
    standard payment procedure, and used blockchain finance to optimize the safe payment
    method (Singh, 2021; Singh, Bansal, and Sharma 2022).


    # Constraints on the Application of Blockchain in the Digital Transformation of
    Enterprises


    CAICT (2021) noted that the complexity of cross-border trade financial business
    itself can bring, including the enforceability of smart contracts, standardization,
    and security of technology, etc., is due to the delay in the unveiling of regulatory
    laws on blockchain technology and the absence of a'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'unified technical standard for blockchain applications. It was required to
    create a framework for blockchain regulation and standardize the technological
    requirements. The benefits of blockchain technology in reducing transaction costs,
    reducing counterparty risk, and decentralizing contract enforcement, among other
    things. It also had issues with safety, technological dangers, and risks from
    governmental regulations. Blockchain technology, according to Zhang et al., (2020),
    has certain flaws, including tamper-proofness, a poor fault tolerance rate, a
    low consensus efficiency, and a small data capacity, which limit the effectiveness
    of an enterprise’s digital transformation. According to Gong et al., (2021), blockchain
    technology is still in its developmental stage, with limited empirical research
    and data available. More research is needed to assess its impact on marketing
    and business administration, as well as to address challenges such as scalability,
    privacy and security concerns, software defects, cyber-attacks, high investment
    costs, and the absence of legal regulations. Given its relative youth and immaturity,
    many experts stress the importance of establishing an international technical
    standard for blockchain technology.


    # Countermeasures


    To increase the data transparency of SMEs in logistics, money flow, and information
    flow, Lu et al., (2021) proposed applying the blockchain-distributed ledger to
    all nodes of company production and operation and adopting “blockchain+ credit
    reference” technology. According to Yang et al., (2020), building an intellectual
    property data platform, a trading platform, and a valuation platform were all
    effective ways to boost the value of SMEs. These steps included determining the
    developmental stage of businesses using the “blockchain+ big data” model, assessing
    their needs for financing and financial stability, and identifying the SMEs’ developmental
    stage. Tang (2018) used the digital transformation of SMEs in Germany as an example
    to suggest that the nation should create a unified framework for digital transformation,
    develop a mechanism for Internet regulation, strengthen trust and security in
    data processing, place a premium on and increase investment in R&D, and offer
    opportunities for vocational training. Zhang (2021) asserts that SMEs need to
    strengthen their capabilities, nurture their talents in digital management, technology,
    and business, and use benchmark enterprises to guide their use of key industry
    businesses as a point of breakthrough for digital'
