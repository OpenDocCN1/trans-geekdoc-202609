    is one of the most critical issues. Why is it essential? One of the causes of
    patient EHRs (Electronic Health Records) or digital personal medical records (DPMR)
    that don''t match is this. When data is moved between medical systems, up to 50%
    of a patient''s medical records are incorrect, according to statistics. Even within
    the same healthcare system, one out of every five patient records cannot be reliably
    linked. More than 176 million patient records are thought to have been compromised
    as a result of data security breaches between 2009 and 2018. It contains both
    genomic test results and banking information. The worrying development is that
    healthcare data breaches increased by 44.44% (monthly over a month) in October
