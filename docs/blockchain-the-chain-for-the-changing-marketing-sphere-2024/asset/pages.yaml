- pgno: 23
  md: 'These exchanges show the transmission of an asset, which could be something
    tangible or immaterial. The selection of data, including who, what, when, where,
    and how much, as well as the state, can be recorded in the data block. The blocks
    that are placed before and after one another are connected. These blocks build
    a chain of data as an asset moves from one place to another or as management changes.
    The blocks guarantee the precise time and order of operations, and they safely
    link together to prevent any block from changing or a block from being inserted
    between two known blocks. In an unbreakable chain, such as the blockchain, several
    operations are forbidden. Every new block strengthens the validity of the previous
    block and, consequently, of the blockchain as a whole. As a result, the blockchain
    acquires its essential irreversibility feature and becomes corrupted. Users and
    other distant users may establish a reliable record of transactions and reduce
    the possibility of manipulation by malicious actors by doing this (Figure 1).


    # # Digital Marketing


    Internet, social networks, portable devices, browsers, as well as other channels
    are all used in digital marketing to reach out to customers. A specific user group
    segment is the target of participatory digital marketing. Digital marketing mixes
    marketing with client feedback or a two-way conversation with the customer (Rabby
    et al., 2022). It involves paid tweets, mail advertisements, and Google results
    advertisements and is becoming more popular. Digital marketing can take action
    on portable devices, via video games, or through smartphone applications, although
    internet marketing occurs online. In digital marketing, individuals who get relevant
    advertisements are frequently alluded to as recipients while advertisers are frequently
    alluded to as suppliers.


    Digital marketing is one sector of the economy that is changing quickly. With
