- "# 机器学习：人工智能时代的架构\n\n\n\n\n\n\n\n\n\n\n\n\n委约编辑：Clare Holloway\n\n助理编辑：Scarlet Furness\n\
  \n制作：Richard Blackburn\n\n室内设计与排版：Studio Kalinka\n\n\n\n\n\n\n前言\n\n# 致谢\n\n当 RIBA\
  \ 联系我，询问我是否有兴趣写一本关于人工智能对建筑行业影响的书时，我惊讶地发现，另一位名气更大的专家（不具名）拒绝了类似的提议；显然，对他来说，前景实在太黯淡了。然而，正如以《差异引擎》闻名的科幻小说作家\
  \ William Gibson 所说：“未来已经在这里，只是分布不均匀。”人工智能的新兴技术也是如此，它们存在于那些建筑师的手机中（因此也存在于他们的口袋里），而这些建筑师未来可能会被我们早期的机器人主宰所裁雇。\n\
  \n当我开始这个项目时，并没有意识到这需要我回到几十年前的计算根源。那时，我是耶鲁大学一位反叛传统的年轻年轻教授 Roger Schank 的本科生，他在教授计算机理解语言方面拥有一些最早的基础性思想。在研究生期间，计算虽然是新兴的，但在很大程度上未被认可，我当时的导师\
  \ Bob Frew 顺应我对早期计算机（这些计算机几乎无法任任何有用的图形任务）进行项目管理的兴趣。在研究生最后一年级的后期，我在加利福尼亚度假期间，我的叔叔\
  \ Edward Bernstein 是一个总是追求最新电子产品的人，他给了我一周时间使用他全新的 `Apple II Plus`，上面运行着一个名为 `VisiCalc`\
  \ 的新软件，这是第一个电子表格程序。突然，数值建模不再需要硬编码，我在假期结束后就向 Bob 展示了一个完成的项目，令他大吃一惊。两年后在旧金山，建筑师 Plerb\
  \ McLaughlin 几次派我去往帕罗奥托，研究一种名为“专家系统”的新技术，这是一种极具挑衅性但完全无法实现的技术。大约同时，我购买了他的公司的第一台个人电脑——不是为了生成图纸，而是为了管理进度和费用提案。我意识到，用于生成表格和图像的计算是不可抵拒的，但在设计之外的建筑过程中，数字工具同样具有同等甚至更多的主导性。\n\
  \n在 César Pelli 和他的合伙人 Fred Clarke 处从事了十二主流实践后，我加入了 Autodesk 并担任副总裁，并在那里建立了许多我至今保持的科技界关系。Jim\
  \ Lynch 现在是高级副总裁，是我的亲密朋友、智囊顾问以及从公司获得许多帮助和见解的来源。Sam Omans 现在是 Autodesk 建筑/工程/施工业务的行业经理（可能是科技领域极少数拥有建筑理论博士学位的学者之一），他帮助我澄清思路，在\
  \ Autodesk 的迷宫中定位信息，并追寻那些阐明正文的关键图像。来自 Autodesk 知识产权团队的 Grace Liu 在完成所有必要的图像许可方面提供了无价的帮助。\n\
  \n我对人工智能技术现状的思考归功于太平洋西北国家实验室的 Mark Greaves，他也撰写了序言。2020 年秋季，我经常通过 Zoom 与 Mark、NBBJ\
  \ 的 Steve McConnell 以及作家 Cliff Pearson 会面。我们称这些定期的“人工智能沙龙”，通常配有少许威士忌，这在很大程度上帮助我理清了智能机器发展可能出的令人敬畏的轨迹。\n\
  \n如今在耶鲁大学，我开始依赖 Hass Arts 图书馆优秀的建筑图书馆管理员 Tess Colwell，没有她，我无法应对大学广博但往往不透明的资源。在我带领建筑学院度过全球流行病期间努力完成手稿时，Deborah\
  \ Berke 院长一如既往地提供支持。我在 RIBA Publishing 的编辑们——Clare Holloway、Scarlet Furness、Liz\
  \ Webster、Richard Blackburn 和 Ramona Lamport——是专业精神和耐心的典范，特别是面对我那不固定的日程。当我请求我的老朋友兼合作伙伴编辑\
  \ Andreas Muller 加入项目并作为额外的一双眼睛把关时，Clare 丝毫不动。Andreas 曾编辑过我的上一份手稿，他提供了定期、清晰且非常有帮助的建议，以改进论点的流畅性和逻辑性。\n\
  \n最后，感谢我的伴侣 Nancy Alexander，她总是能为完成重要工作创造空间，并提醒我为何坚持下去是如此重要。没有她无尽的支持，这些项目都不可能实现。\n\
  \n# 序言\n\n当我第一次开始与 Phil 合作时，我对建筑的印象仅停留在单一的层面，正如他在书中早期提到的：建筑作为一种将欲望和资本转化为可居住空间的学科。虽然这种说法真实且简洁，但这种表述让像我这样的计算机科学家非常容易将建筑师视为机械地执行半正式转换函数的人。Phil\
  \ 和他那些耐心的同事们通过几次关于建筑和人工智能的 Zoom 讨论和威士忌助兴，才轻轻地纠正了我这种狭隘且还原论的观点。我自己建筑观念的转变，与人工智能近期戏剧性的演变十分相似，这正是为什么这本书对于我们的两个行业来说都是如此及时的原因。在过去的十年里，人工智能已从精心编写的规则系统快速进步到深度学习网络和自监督方法等极其复杂的世界。现代机器学习系统不再依赖于为特定任务手动编写的复杂规则集合，而是将其输出基于自动分析海量数据集所产生的极其复杂的模式。人工智能生成的设计曾在很大程度上只是以不同方式结合规则的学术练习，现在可以产生许多更加微妙且引人入胜的作品。\n\
  \n\n\n\n因此，在 AI 时代对建筑进行反思的需求比五年前要紧迫得多。尽管机器学习不会让专业建筑师过时，但它的影响绝非为零。Phil 对建筑专业的深厚知识与他出色的\
  \ AI 技能相结合，使他能够研究这两个极端之间的空间，并探索现代 AI 如何影响支撑建筑交付的复杂信息结构。Phil 还在苦苦应对那个“显而易见的问题”：AI\
  \ 是否能充分理解场所的深层的人性语境，能否复制建筑师对形式主义与创造力的独特融合，并对建筑的安全性和适用性负责？为了解决这个问题，Phil 的分析超越了通常的还原论式批判，并考虑了现代\
  \ AI 不仅能让建筑的整体价值链变得更快或更高效，还能让整个建筑行业变得更加强大。我认为这本书极具启发性，也希望你也有同感。\n\nMark Greaves，华盛顿州墨瑟尔岛\n\
  \n## 引言\n\n大约半个世纪前，我还是一个志在成为建筑师的本科生，就读于一所设计工作室仅留给高年级学生的学校，而我们其他人则完成通识课程。对计算机的早期兴趣引导我选择了一门名为“计算机图形学导论”的基础课程，根据教学大纲，我们要在前三个枯燥的周里通过编程示波器来画圆；并在早期的图形显示器上进行计算机辅助设计（CAD）练习——这些显示器显然只有\
  \ 6 英寸宽，如图图 0.1\n\n0.1 阴极射线示波器，约 1996 年，与其 1975 年的前型相比没有太大变化 [由 MAKEHAVEN INC. 提供]\n\
  \n![0.2: PDP-11 计算机早期版本，未着火](img/fig00004.jpg)\n\n0.2: PDP-11 计算机早期版本，未着火\n\n我那个学期的项目是编写一个程序，接收当时被称为“新闻稿社”（一种源自电打字机、提供国家来源新闻的文本流服务）的关于油轮船事故及溢泄漏特定主题的输入，然后回答相关的简单问题。我们的解决方案本质上是“硬编码”了从英语句子中提取含义的过程，并构建了语义结构，机器可以从中执行我们认为的推理推理，这一切都是基于这样一个假设：我们正在数字化人类同样使用的思维过程。我的解决方案虽然足够用，但并不是\
  \ Google 的早期版本。到学期结束时，我很清楚我在计算机系的日子已寥寥无几，因为教授正确地观察到我的特定方案无法区分油轮事故和车祸。下学期，我逃到了完全模拟的建筑课程中。\n\
  \n与我的早期学术经历一样，建筑师与计算之间的关系一直是矛盾的。在计算机辅助设计的早期，我们担心古老的绘画艺术会流失。随着行业在 20 年代转型到 3D 数字表示，特别是建筑信息模型（BIM），焦虑增加了：当数字建筑组件变得标准化，并被日益强大的工具轻松地融入我们的设计时，人们担心这些工具会削弱设计师的作者主权。现在，计算已变得无处不在，机器正在学习通过人工智能执行知识工作，这个行业再次认为自己正面临威胁。虽然牛津大学的理查德（Richard）和丹尼尔·苏斯金德（Daniel\
  \ Susskind）在探索人工智能对专业人士工作的影响时曾建议，“我们既不需要，也不希望专业人士按照他们在 20 世纪及以前的方式进行工作”，但当今计算智能对建筑实践的影响微乎其微。然而，我们依然感到担忧。我们正走向一个计算机完全取代建筑师的世界吗？一定有理由说明这种情况不会发生？\n\
  \n这里有一个例子。当计算机设计建筑时，公众将遭受损失。为什么？因为当建筑师想象一座建筑时，是从底部向上的。你看到的是一个从底部到顶部创建的想象图像。真实的建筑向我们展示了一个整体结构，从基础一直延伸到顶端，从地基到屋顶，以此类推。如果我们不知道建筑的基础，我们就不知道被卖的是什么，也无法理解我们在看什么。底线是，没有灵魂的建筑几乎或完全没有美学价值，因此对数字建筑的负面观点是没有根据的。\n\
  \n为什么？因为当建筑师想象一座建筑时，是从底部向上的。你看到的是一个从底部到顶部创建的想象图像。真实的建筑向我们展示了一个整体结构，从基础一直延伸到顶端，从屋顶到地基，以此类推。如果我们不知道建筑的基础，我们就不知道被卖的是什么，也无法理解我们在看什么。底线是，没有灵魂的建筑几乎或完全没有美学价值，因此对数字建筑的负面观点是没有根据的。\n\
  \n我看到了数字建筑缺乏美感的两个原因。首先，它完全是一个技术过程。如果你试图让创造建筑的过程变得美化，将投入大量工作，而且你不会节省多少时间。其次，数字建筑将软件作为建筑过程中的唯一元素，而我们知道它是不可靠的。软件远非容易理解，以至于我们甚至无法识别它为软件。我们看不见它试图传达的信息中的任何一个字。所以，仅仅通过观察建筑，很难判断它是否是由计算机设计的。设计工作不是我们可以简单扔进计算机里就能产出像宝马那样的东西。\n\
  \n\n\n数字建筑师试图将创造建筑的过程变成某种美感，但他们最终并没有实现这一目标。数字建筑还存在其他问题。为了让建筑更加“真实”，你需要软件来操纵建筑将要使用的材料。在过去，材料从未经过数字化设计，因此当一个数字建筑师从计算机中取出材料时，软件并不知道如何处理它，结果只是一个底部带有“空闲”区域的“棺材”。数字建筑首先只能带你领到模型阶段，一旦模型建成，它只会将模型保留在模型中，并用它创造出完全不同的东西。数字建筑可以给你提供更好的清晰度，但是以牺牲美学为代价的。它从未产生过看起来像真实建筑的东西。\n\
  \n亲爱的读者，希望在这一简短的斜体插曲之后，你仍然关注我。这段文字完全（且未经过我编辑）由一种名为 `GPT-3` 的技术生成的，它是生成式预训练变换器（Generative\
  \ Pre-Trained Transformer）的第三代，是一种人工智能（AI）系统，能够根据提示生成原始文本。在本例中，提示是“当计算机设计建筑时，公众将遭受损失”。`GPT-3`\
  \ 是我反向运行的油罐程序——它不再仅仅是吸收叙事以某种方式理解，而是创建一个叙事。它运行在强大几个数量级的计算机上，这些计算机由更有才华的人编程。\n\n上面的示例输出与连贯的英语有着不可人的相似之处，具有一个“原始”论点的宏观框架，甚至引用了具体的例子。它具有一种抓狂的易懂性：你越觉得自己理解了它，它就越晦涩。`GPT-3`\
  \ 技术是当代的机器智能，它通过吸收互联网的海量文本来“学习”语言并“自教”底层的语义结构。这与大部分可靠的 `Google Translate` 将网页从英语翻译成西班牙语时使用的策略相同，但通过快速进步的机器学习（`ML`）得到了极大的加速。然而，我早期的努力以及上述的\
  \ `GPT-3` 都缺乏真正的连贯性，阅读上述文本的时间越长，它似乎就越不合逻辑。`GPT-3` 确实比我 1976 年的方法要高效得多，但缺少了宏大的哲学断言。然而，这里的可能性是引人注目的。计算机能很好地设计一整栋建筑吗？为本书撰写序的计算机科学家\
  \ Mark Greaves 将使用 `GPT-3` 等工具自然语言生成的进展描述为具有“流利性和表现力”：\n\n> >> 使用现代的 `ML` 技术，机器开始在语言等领域成功地执行创造性的、原创的任务，而这些领域曾是人类特有的领域。基于更传统的\
  \ AI 确实取得了一些有限的成就并被称为“创造性”，例如 `Deep Blue` 在与加里·卡斯帕罗夫的国际象棋赛中下出的著名的“上帝之手”。但这些是非常罕见的……这些系统似乎表现出机器过去未达到的创造力、表现力和语言艺术造诣。而且，在游戏领域，基于\
  \ `ML` 的 `AlphaGo` 也展现了真正的创造力。\n\n然而，创造力和连贯性并不等同于胜任，这至少包含了本书将探讨的问题的部分答案。也就是说，建筑专业应当如何考虑并应对由人工智能进步带来的可能未来，即所谓的“第二次机器时代”？在审慎地（尽管有些不情愿）走遍了\
  \ `CAD` 和 `BIM` 时代之后，我们是否能提出一条有意的、设计的路线——一种专业策略——在承认智能机器在设计、施工和建筑资产运营的每个维度中占据主地位必然性的同时，保持人类建筑师适当的角色？\n\
  \n这并不是一个新问题，至少在机器智能及其对大写 Design（设计）的影响的关系方面是如此——这始终是建筑理论在面对大问题时首先访问的地方。然而，对建筑实践（而非结果）的影响尚未被审视。如果设计师解决的是正如\
  \ Peter Rowe（引用 Horst Rittel 的话）所描述的具有开放式开头且没有固定结论的“棘手问题”，那么胜任的实践需要在宽泛的技术和美学问题上进行启发式引导。这似乎是一种纯人类特有的策略。然而，在机器学习的赋能下，计算机越来越能够学习这些技术，而当它们这样做时，专业策略和方法——以及设计师本身的价值——将发生不可改变的蜕变。\n\
  \n对于建筑实践而言，这种变化的影响尚处于萌芽阶段。机器学习算法正在评估抵贷款申请、读取常规 X 光片、发明前未有的棋类策略，甚至正危险地接近构思连贯的想法。然而，基于\
  \ AI 的设计生成现在才开始显现，且没有任何一个在商业上可行。正如 Daniel Susskind 在他的第二本书中所预测的那样，计算机越来越胜任任务，而非整个工作。在建筑师提供的整个服务范围内，存在大量任务自动化的机会。这意味着建筑工作将被取代，还是相反，被能力计算机所增强？与其纠结于我们是否会被机器完全取代这一大问题，或许可以找到一条更智能的路线，让计算机协助实践中关键但更平庸的方面：那些驱动项目交付、技术精度和性能可预测性的方面。\n\
  \n在这一时刻，建筑专业本身并没有面临生存威胁，但它也没有为学习机器的必然到来制定策略。这种策略的范畴应当扩展到我们对作为设计师身份的常规顾虑之外，更广泛地审视强大的计算如何影响我们在建筑的制定、构想、交付和使用中的角色，从而影响建筑专业本身的核心价值。为此，本文将探讨即将到来的计算机智能时代实践的三个方面，这些方面共同为我们提供了审视命运的视角：\n\
  \n1. 实践的过程和方法可能会改变。\n2. 这些变化对我们与建筑环境交付系统的`关系`意味着什么。\n3. 有哪些机会可以重构和改进我们努力的`结果`。\n\
  \n这些内容将尝试为未来进入机器智能时代的专业发展提出一种策略。\n\n# 01 过程\nDOI: 10.4324/9781003297192-1\n\n> »\
  \ 在高强度自动化的压力（和可能性）下，建筑工作的过程和方法论将如何改变？我们的工作在哪里最能被增强，在哪里不可避免地被取代？«\n\n## 1.1 工具与技术\n\
  \n\n> » 在过去的二十十年里，计算机的部署主要是为了更高效的描绘和表现。人工智能将焦点从表现一个设计转向对设计进行数字推理——在某些情况下不需要人类操作员，甚至不需要太多的人类干预。这对于用于建筑的工具的演变意味着什么？«\n\
  \n### 技术分类\n\n\n\n\n许多学者都编写过建筑专业领域的技术史，但在此处详细重述这段历史已超出了本项目的范畴。¹ 然而，我们可以看到这段历史是沿着两个轴线组织的：构成建筑工具箱的技术的演进，以及这些工具所支持的用途的分类法。人工智能——广义上定义为能够执行复杂的认知任务，且其产生的结果类似于人类思维的能力——是这种分类法中所描述的各种工具的推动者。\n\
  \n在第一个轴线上上，对我们学科技术史的极度简化可以追溯到公元前 2150 年，那是一个美索不达米亚统治者 `Gudea` 的雕像，它描绘了其膝盖上放着一张建筑图纸，^(2)，这被认为是设计模拟绘制的最早证据。在随后的至少\
  \ 42 个世纪里，建筑师通过在纸张上显式或隐式地按比例描绘设计来抽象他们的想法。马里·卡波（Mario Carpo）从数字术语的角度映射了这一过程，认为图纸和等高图标记作为设计信息的载体，实际上是利用手动图形提供的极其有限的“中央处理单元（CPU）周期”处理数据的一种。^(3)通过极少的能量消耗，在纸上画两条平行线的行为——建筑师就可以暗示在真实的建筑中建造一堵三维的、构造性的、实体化的墙，并为负责该建造的整个企业记录下这一丰富的想法以供参考。\n\
  \n![1.1.1: GUDEA, WITH A PLAN DRAWING IN HIS LAP, C. 2150 BC](img/fig00005.jpg)\n\
  \n1.1.1: GUDEA, WITH A PLAN DRAWING IN HIS LAP, *C*. 2150 BC^(4)\n\n### 计算机辅助设计\n\
  \n在 20 世纪的倒数十年，建筑师们开始认真投入到数字计算机辅助设计（`CAD`，有时被称为计算机辅助绘图）的首次尝试中，在纸上刻画线条、弧线和圆的机械过程被通过输入数字线条在虚拟平面上创建这些线条的过程所取代。虽然对计算机和绘图仪的大量投入使得这种转型感觉具有里程碑意义，但实际上它更多地是将现有绘图技术翻译成虚拟形式，其目标仍然是生产图纸——但更加精确。大型打印设备（如绘图仪）的技术演进与电子绘图工具（如\
  \ `AutoCAD©`）并行发展。\n\n向计算机绘图的转变开启了一个由于 `CAD` 提供的更精确几何形状而突然变得更容易绘制——在较小程度上也更容易建造的建筑时代，但这并没有解决设计定义、建筑师意图与建造者最终的建造责任之间的信息鸿沟，这种鸿沟在文艺复兴时期由阿尔伯蒂在*De\
  \ re aedificatoria*中被界定。^(5) 根据卡波的说法，阿尔伯蒂提出了一个命题：建筑师绘图，建造者不加偏差地遵循这些图纸。`CAD` 为建筑师提供了一个更快绘图、更具图形一致性的机会，甚至可以在多张图纸或多个项目之间复用某些表示（如\
  \ `AutoCAD©` 块）。\n\n> 简而言之，设计定义、建筑师意图与建造者最终的建造责任之间的信息鸿沟，这种鸿沟在文艺复兴时期由阿尔伯蒂在*De re\
  \ aedificatoria*中被界定。^(5) 根据卡波的说法，阿尔伯蒂提出了一个命题：建筑师绘图，建造者不加偏差地遵循这些图纸。`CAD` 为建筑师提供了一个更快绘图、更具图形一致性的机会，甚至可以在多张图纸或多个项目之间复用某些表示（如\
  \ `AutoCAD©` 块）。\n\n大约 20 年后，技术发生了下一次飞跃：建筑信息模型（`BIM`）。在理论上，`BIM` 代表了传统策略的翻转：Gudea\
  \ 平面图的 `3D` 表示原本存在他的脑海中，现在作为“报告”被提取。理论上，团队的每个成员都可以向模型添加信息。然而在实践中，流程和结果的不兼容实际上使得\
  \ `BIM` 了一个主要用于生产比 `CAD` 更好的图纸的工具。\n\n![1.1.2: EARLY CAD DRAWING BY PELLI CLARKE\
  \ PELLI ARCHS](img/fig00006.jpg)\n\n1.1.2: EARLY CAD DRAWING BY PELLI CLARKE PELLI\
  \ ARCHS\n\n过去的 10 年，现代生活的许多方面经历了爆炸性的数字化，设计和建设也不例外。在云端无处不在的大容量存储和 `CPU` 力的推动，以及通过互联网虚拟交付这些能力的能力，建筑/工程/施工/运营（`AECO`）行业正在采用各种计算工具，尽管这种采用是缓慢的。\n\
  \n设计师拥有一系列：\n- 建模\n- 渲染\n- 数据管理\n- 分析平台。\n\n在项目现场配备数字平板电脑的建造者：\n- 依赖过去是纸张专有领域的数字版本\n\
  - 使用数据工具管理构成施工过程的系列行政事务\n- 部署无人机和 `LiDAR`（激光雷达）来记录施工进度。\n\n建筑所有者：\n- 要求完工项目的数字化文档，以取代竣工后的图纸卷\n\
  - 从其建筑控制系统的传感器网络中汇集数据以优化建筑性能。\n\n### 数字间隙\n\n总来看，`AECO` 行业似乎进入了某种“计算间歇期”，交付连续体中的各种过程正在数字化。结果是程序、平台、数据类型和支持硬件的多样性变得与分散的建筑行业本身一样多样且无组织。1970\
  \ 年，尼古拉斯·尼格罗庞特（Nicholas Negroponte）预见到这种状态，他认为任何向计算的转型首先直接模仿其拟取代的模拟过程。^(7)结果，我们可能会看到更多充满兴奋和困惑的岁月，因为建筑行业在努力进入数字未来的同时，放弃了由纸质模拟过程所提供的简单“互操作性”。^(8)\n\
  \n\n\n\n建筑业通常组织得不够良好，也无法形成足够的市场影响力，以便在技术或创新方案引入后立即采纳。它通常必须等到硬件、软件或业务模式足够成熟，让建筑师、工程师和建造者采用、调整并改进这些系统以供其使用。`CAD`\
  \ 平台就是如此，它们起源于航空航天行业，必须移植到便宜的个人电脑上才能让 AECO（建筑、工程、施工）客户能够负担得。同样，`BIM` 或高分辨率渲染等建模平台在这些技术进入经济范围后，最终吸收了制造业和电影制作的工具^(9)\n\
  \n![1.1.3: 施工中的 LiDAR 扫描，映射到 BIM 数据集中。导管（绿色）和风管（蓝色）是来自模型的数字扫描的虚拟添加内容。](img/fig00007.jpg)\n\
  \n1.1.3: 施工中的 LiDAR 扫描，映射到 BIM 数据集集中。导管（绿色）和风管（蓝色）是来自模型的数字扫描的虚拟添加内容。\n\n### 迈向机器智能\n\
  \n作为这一本是可靠经验法则的例外，建筑师在最早版本的机器驱动设计中起到了带头作用：脚本。作为技术的首批倡导者（如 `McNeel Grasshopper` 以及后来的\
  \ `Autodesk Dynamo`），建筑师定义并详细阐述了现在被称为参数化设计或生成式设计的理念，在这种设计中，计算机脚本驱动几何引擎（如 `Grasshopper`\
  \ 控制 `Rhino`）。然而，在经历了 20 年这样的工作后，脚本能力很大程度上被用于相对较小的问题，例如形状生成或窗墙几何形状，而不是系统性的替代方案生成或分析评估。虽然像\
  \ `Hypar`^(10) 等后一代工具已开始加速生成式设计的理念，但由于缺乏评估由脚本生成的替代方案的分析工具，其用途通常被限制在形状生成上。\n\n机器学习和人工智能是我们时间线轴上最近的工具，它们可能会遵循典型路径进入建筑师领域。虽然大型公司已经在将\
  \ `AI/ML` 能力整合到其核心运营策略中，^(11)，但建筑师能够获得的人工智能大多是通过他们的智能手机提供的，就在我们在在线点晚餐或叫车去办公室时。少数有前景的初创公司和其他实验正在施工现场的各种任务上测试技术（例如通过计算机视觉进行工人安全检查）或项目管理（例如管理大量的变更单和信息请求），这表明我们仍仍处于早期阶段。\n\
  \n![1.1.4: AUTODESK SPACEMAKER AI 的设计与评估界面](img/fig00008.jpg)\n\n1.1.4: AUTODESK\
  \ SPACEMAKER AI 的设计与评估界面\n\n然而，有迹象表明这种等待可能不会持续多久了。当我 2020 年 11 月编写这一章时，我的前雇主 `Autodesk`\
  \ 宣布收购 `Spacemaker`，这是一种 AI 驱动的设计生成工具，它可以评估场地和建筑限制并生成初步设计方案（见 1.1.4）。\n\n### 用法分类\n\
  \n在之前的工作中，我提出了一种分类法，将大量施工相关的任务分为四类：\n\n1. `Representation`（数字描绘）\n2. `Analysis and\
  \ simulations`（数据评估）\n3. `Realisation`（建筑形式）\n4. `Collaboration`（信息分发）\n\n#### Representation（表示）\n\
  \n图纸、文本、图像和物理模型是数字时代之前的表示工具，随后是 `CAD` 以及最后的 `BIM`。在一个日益数字化的世界里，智能机器需要设计数据来引导它们。同样，生成式设计的早期尝试表明，生成算法正成为越来越重要的部分。\n\
  \n#### Analysis and Simulation（分析与仿真）\n\n计算非常适合检查来自表示的数据。通过据称的力量扩展，这种能力可以被 `Agrawal`、`Gans`\
  \ 和 `Goldfarb` 更准确地描述为：预测：使用表示和其他数据来评估设计的影响并预测结果。\n\n#### Realisation（实现）\n\n设计数据是数字化施工过程的逻辑基础。随着在\
  \ `AI/ML` 辅助下施工变得自动化，建筑过程被学习如何建造的机器吸收，这一点尤为真实。映射到 BIM 系统中的施工 LiDAR 扫描就是一个例子。\n\n\
  #### Collaboration（协作）\n\n从早期的基于互联网的数据管理到如今常用的 `BIM 360`、`Procore` 甚至 `Google Docs`\
  \ 等工具，项目团队无论格式如何，都需要组织、传输和管理数字资产。然而，当我们渡过数字过渡期时，对索引、定位和理解所有这些数据的需求日益增长，就像现代搜索引擎寻找信息一样，用户无需担心格式或位置。随着时间的推移，数字设计和施工将要求企业内部联邦化的项目信息，将不同格式的数据结构连接起来，形成一个具有不同部分的协调整体。\n\
  \n\n\n\n随着我们的职业从该网格的左上角移动到右下角，计算能力、对自动化的依赖、数据分辨率的深度与广以及精度都急剧增加。随着机器接管了建筑师部分（但不是全部）的任务，设计自主性的某些方面将发生重构。插图\
  \ 1.1.6 描述了其中一些可能性，将我们四类技术的演变与设计企业的数据丰富性（顶部曲线）以及设计流程的自动化（底部曲线）进行了对比。\n\n![1.1.6:\
  \ 人类 VS 机器自动化](img/fig00010.jpg)\n\n1.1.6: 人类 VS 机器自动化\n\n此处认为，随着工具功能的不断增强，所产生信息的粒度和复杂性也会随之并行增加，并且数字时代还存在计算自动化的潜力。例如，在绘图时代，信息的复杂性仅随着建筑本身技术需求的类似变化而增加，即现代建筑系统和复杂交付模式的引入。当时完全没有自动化可用。`CAD`\
  \ 的出现允许额外的几何复杂性、更广泛的文档记录（理论上），以及通过 `CAD` 程序内部的标准组件库和脚本工具实现某些自动化，例如早期 `AutoCAD` 中的\
  \ `AutoLISP`。那些早期的脚本工具允许 `AutoCAD` 的功能被记录和重复；它们在 `Rhino` 中的继者则控制了几何模型的尺寸参数，并赋予了设计师生成新形式的能力。\n\
  \n然而，随着 `BIM` 的出现，这两条曲线上都出现了巨大的飞跃，因为表示方式从绘图的抽象转向虚拟 3D 模型，并伴随着参数化 `BIM` 族和数据集，以及通过成熟脚本实现的生成式设计方法，这些将记录曾经依赖人工干预的流程和程序。`CAD`\
  \ 内的脚本仅仅操纵几何形状，而像 `Dynamo` 的工具允许设计师参数化地操纵设计组件（如窗户尺寸）及其与整体建筑的关系（如窗户在外墙内的位置）。在过渡时期，我们将看到大量数字数据的生成，以及原本相互孤立的各种流程的间歇性自动化。\n\
  \n向大规模 `AI/ML` 的转型将极大增强其前序数字源的数量和价值，成为智能机器学习的数据湖。同时，计算机将开始训练自己来执行机器自动化的任务。这些相同的机器将自学组成项目的异构数据集之间的关系，并创建一个“互操作性”的\
  \ AECO 数据星座。\n\n这些趋势预示着，随着建筑复杂性和计算机能力的并行进步，实践正面临着一条可能令人生畏但完全必要的轨迹。结合起来，经由机器智能增强的复杂数字建模可能会将设计、施工和建筑运行的各种力量汇到一个单一的整合努力中，围绕着从诞生到拆除的建筑过程数据凝聚。正如\
  \ Carpo 所推测的：\n\n> » 鉴于数字模拟前未有的力量，人们可能会推测，在某，虚拟模型可能会成为它们所代表建筑的完美复制品和替代品——体现并执行它们的每一个方面。届时，设计师可以像以前建造者建造实际建筑一样制作数字模型，而从模型到建筑的最终翻译将不再产生任何智力（或信息）增值。**¹⁵**«\n\
  \n结果是建筑所需的信息和知识将发生巨大的变化。但将如何变化呢？\n\n## 1.2 什么是人工智能 (AI)？\n\n\n> » 计算机可能极大增强人类的能力——或者可能完全取代我们——这种想法很多年前了。在阐述\
  \ AI 对建筑实践的机遇和威胁之前，本章将简要介绍该技术的历史，并提出一种分类法，以便理解和预测其存在及未来。“«\n\n### 老式人工智能的起源\n\n\
  计算机科学家约翰·麦锡通常被认为在 1956 年创造了“人工智能”一词，认为计算机器可以以某种方式模拟人类的功能。在计算进入主流执业建筑师的触及范围之前的很久多时候，Nicholas\
  \ Negroponte 等人已经在探索数字设计的想法。早在 1964 年，Walter Gropius 就承认这些新机器在行业中可能发挥某种作用，并建议“这无疑取决于建筑师如何明智地利用它们作为优越机械控制手段，这可能为我们的创作过程提供更大的自由”。([1]](#Reference2.xhtml#ref0136))\n\
  \n1958 年，心理学家弗兰克·罗森布拉特提出了“感知器”理论，这是今天神经网络的先驱。罗森布拉特假设，理论上可以通过“教”一个人类神经元的粗糙仿品来表示视觉信息，从而以易于访问的形式编码人类知识。十年后，该理论受到了麻省理工学院马文·明斯基的挑战，他认为“更深层”的模型（具有更多层此类神经元）永远不会产生可靠的结果，这预示了\
  \ AI 策略中一个部分延续至今的论点。\n\n![1.2.1: NICHOLAS NEGROPONTE 的 URBAN 5 SEEK，由 THE ARCHITECTURE\
  \ MACHINE GROUP 创作，展于纽约犹太博物馆，197\\u27bd](img/fig00011.jpg)\n\n1.2.1: NICHOLAS NEGROPONTE\
  \ 的 URBAN 5 SEEK，由 THE ARCHITECTURE MACHINE GROUP 创作，展于纽约犹太博物馆，197\\u27bd\n\n在此此同时，Nicholas\
  \ Negroponte 在他的 MIT 实验室“建筑机器实验室”中探索更具实践意义的问题。作为一名受过训练的建筑师，Negroponte 在技术和设计的早期应用中进行了广泛实验，预见到了对大屏幕、视频和摄像头、机器智能和沉浸式环境等工具的使用。他的努力预见了人工智能的早期策略，设定了“一个我们最终将居住并最终环绕我们人的智能环境”的可能性。([2]](#Reference2.xhtml#ref0137))\n\
  \n当 Negroponte 检查 3D 空间的表示、生成和操纵问题时，其他对理解人类思维的核心工作探讨了所谓的“自然语言处理”：计算机理解并创建书面文字。([3]](#Reference2.xhtml#ref0138))\
  \ 计算机科学家试图将人类认知的突发理论翻译成软件，创建计算和语义结构以从文本中提取理解，并从由此产生的知识进行推论推理。这建立了此后被称为“GOFAI”或“老式人工智能”的概念，([4]](#Reference2.xhtml#ref0139))因为人们正试图建立人类认知模型。\n\
  \n\n\n\n到 20 世纪 80 年代中期，AI 研究机构和软件公司正试图将这些理论推演为商业化的“专家系统”。在这些系统中，特定领域的知识由人类程序员刻苦地编码到算法中，以便将详细的领域知识传输到计算机中，从理论上讲，计算机可以取代人类。这些努力迅速触及了理论效能以及硬件处理与存储能力的极限。随后引发了“AI\
  \ 寒冬”，在许多多年里，人们的关注（以及资金）逐渐减少，AI 的承诺似乎未能实现。^(5)\n\n### 超越感知\n\n到 20 世纪 90 年代，计算机变得越来越快速、更廉价且更易获得，一种不同的\
  \ AI 策略应运而生：神经网络和机器学习。得益于云端巨大的计算能力以及同样庞大的存储容量，AI 系统开始基于人类记忆的数字仿真，在日益复杂的层中编码信息和关系，这些层可以像超智能数据库一样被索引和访问。^(6)\
  \ 计算的力量复兴了感知器理论。专家系统的定义可以从“人类编码的理解”转变为通过从海量数据集中“学习”的程序实现的“计算机生成的专业”。机器学习程序凭借其处理海量示例数据的能力，可以创建近似学习的统计相关性。^(8)\
  \ 机器学习 AI 的目标不再是以某种方式模拟人类理解的机制，而是成为能够深度学习——而非被被动告知——世界的软件。⁹\n\n![1.2.2: 基于 AI 的\
  \ X 射线评估 7](img/fig00012.jpg)\n\n1.2.2: 基于 AI 的 X 射线评估^(7)\n\n如今，“深度学习”涵盖了 AI 领域的大部分学术和商业工作，并且经常与该术语更广泛的定义相混淆。在来自一系列互联网源的海量数据集喂养下的云计算基础设施，以及底层学习算法的重大进展，将\
  \ AI 带入了日常生活，从智能手机到谷歌翻译。计算机现在是世界级象棋冠军手、胜任的放射科医生和信用评分员。后一代 ML 程序可以通过简单的进行数百万次模拟比赛并测试最佳方案，来学习双陆棋等游戏的规则。\n\
  \n尽管这些系统看起来非常强大，但它们实际上并不理解任何东西，而是构建了信息关系的半可靠统计相关性。在高度受限的语境下（例如，有一个定义的训练集，如游戏或一组特定的图像），ML\
  \ 系统的效果惊地有效，特别是在今天的自然语言领域，正如谷歌翻译所展示的那样。因此，今天 AI/ML 的大部分工作都在追求这种经验主义策略。然而，AI/ML 系统完全缺乏对世界运作方式的基础理解，或任何某种程度上类似于常识的东西。\n\
  \n有人怀疑，如果没有这种对语境的理解，AI 系统就无法真正变得好用或可靠，因此它们是否将挑战例如建筑师的存在。心理学家兼企业家加里·马库斯（Gary Marcus）得出结论，这些“窄智能”策略是有缺陷的：\n\
  \n> » （l）认为在语音识别和物体标记等领域（主要围绕分类展开）运行得良好的东西，一定能在语言理解和高层次推理中可靠地运行，这是一个错误的假设。诚然，许多语言基准已经被打破，但仍然缺少某些深层的东西。目前的深度学习系统可以学习任意信息点之间无尽的相关性，但仍然无法进一步；它们无法代表世界的丰富性，甚至缺乏对外部世界确实存在的理解。^(10)\
  \ «\n\n马库斯认为，工作应该考虑回归 AI 领域的初衷——模拟人类认知——并将深度学习系统的数据收集和分析能力与新的感知和推理模型相结合。虽然在这一方面取得了一些进展，但此类系统目前并不存在，并将取决于对新理论特别是因果关系的数字化。^(11)\n\
  \n### 建筑师的智能工具\n\n随着 AI 变得越来越强大，今天的建筑师面临着一系列可以用于手工艺的智能来源：\n\n*   » 其^(12) 才华、技能和经验（例如通过其专业项目证实）\n\
  *   » 实现特定目的硬编码程序（例如能量分析或结构工程）\n*   » 机器学习系统（可能会从来自完工建筑中的数据中学习），以及\n*   » 最终关于能够在语境内推理的系统的预测性前景（目前仅见于科幻小说）。\n\
  \n后三者基于技术，总结在图 1.2.3 中。\n\n![1.2.3: 智能类型的对比](img/fig00013.jpg)\n\n1.2.3: 智能类型的对比\n\
  \n今天建筑师使用的计算机在直接解决问题方面比斯坦福安德森（Anderson）所谓的“担忧问题”更擅长，在创建设计的同时解决目标，^(14) 这了内格庞特（Negroponte）和彼得·罗（Peter\
  \ Rowe）对启发式方法作为解决棘手问题策略的兴趣。^(15) 硬编码软件单一地解决特定问题；你的成本估算系统不会告诉你关于设计的任何信息，它也不具备如何学习。新兴的\
  \ AI/ML 系统正应用于建筑环境问题，可能会评估或甚至预测特定语境下的问题，但显然还没有准备好设计整个建筑，无论是通过启发式。^(16) 而且，到本文为止，认知系统的信徒花了几十年建立“真实世界知识”作为下一代推理系统的基础，但成功有限。^(17)\n\
  \n虽然这里没有考虑人类意识的问题，但将智能（人工或其他）描述为：在语境下对异构知识集合进行收集、组织和逻辑推理的能力是合理的。马库斯认为，这种鲁健性目前无法通过\
  \ AI 系统实现，因为它们无法灵活动态地对世界进行推理，将一个语境中学到的东西转移到另一个，正如我们对普通成年人的预期那样。^(18) 建筑师的工作在马库斯的术语中无疑属于“高层次推理”，因为他暗示，“如果没有对基本概念的连贯因果理解，可能无法在复杂的现实环境中工程化鲁健性”。^(19)\n\
  \n然而，早期的尝试开始出现，以 Autodesk 收购 Spacemaker AI 为主要例子。该工具结合建模、分析算法和 AI 来生成并评估规划方案，然后通过汇总分析结果和人类设计师选择最佳方案时所获得的结果来“学习”最佳实践。\n\
  \n\n\n\n\nAI 专家 Mark Greaves 描述了当前 AI 系统的能力，将其处于从评估（理解信息的含义）到模拟（利用信息在不同语境下近似相似的情况），再到生成（创造新想法）的连续体中。我在他的分类基础上（这些分类通常基于布鲁姆教育分类法，我们稍后会回到这一点）增加了第四种一种更早出现但深度较浅的能力，即“理解”，系统可以在此阶段定位、访问和部署信息。\n\
  \n目前具备能力的经验主义 AI/ML 系统在评估方面表现出色（例如，当系统读取常规 X 光片时），在某些情况下甚至擅长模拟（这通过能力极强的围棋程序得到了最好的证明）。然而，真正的“生成”案例非常有限，除了偶尔在运用从未见过的围棋步法时展现出才光一现外，目前还没有任何情况下是计算机能够生成一组涵盖设计像建筑这样复杂对象的原创构思。\n\
  \n![1.2.4: MODIFIED GREAVES’S MODEL OF AI CAPABILITIES23](img/fig00014.jpg)\n\n\
  #### 1.2.4：修改后的 Greaves AI 能力模型\n\n然而，这仅仅是现状，是经验主义 AI 系统的功能，它们只能基于海量数据的相关性进行“推断”。随着哲学家、神经科学家、计算机科学家及其商业领域的同仁构建出日益强大的机器，向通用\
  \ AI（即 Pedro Domingos 所称的“主算法”）迈进，以服务于现在被称为“通用人工智能”的——既能学习又能根据语境对世界进行推理的机器，可能随着时间的推移，经验主义将让位于对认知的模拟。今天，我们离这种功能还很远，但它仍然是\
  \ AI 开发最宏大的目标。\n\n当 Marcus 的“鲁棒性”遇到 Greaves 的生成能力时，建筑师（以及正如 Daniel Susskind 所暗示的大多数劳动力）会有许多担忧，因为“（其）简单来说，如果我们无法依靠\
  \ AI 表现得可靠，我们就不应该信任它”。因此，在此之前，人类建筑师的工作是协调他们才华的组合工具，将一系列包括 BIM 和新兴深度学习工具在内的软件工具，整合成连贯且有价值的实践，以备未来认知平台变得触手可及的那一天。届时，希望该行业将牢固地掌握可用技术以及引导这些技术的方法。\n\
  \n# 1. 专业信息与知识\n\n\n> » 鉴于建筑领域的专业知识是一个难以捉摸的构建，因为专业建筑师的大部分能力和决策是基于培训、洞察力，最重要的是判断力。技术知识既没有良好的组织，也不容易获取。假设\
  \ AI 使专业人士的能力和知识库变得更加易于获取，那么专业知识将不再仅仅存在于受过高水平训练的建筑师脑海中。“ «\n\n### 专业人士与专业主义\n\n\
  在《职业的未来》（*The Future of the Professions*）中，Richard 和 Daniel Susskind 探讨了在人工智能日益强大的世界中，职业领域可能消亡的趋势。在书中，你可以找到以下这一完整（尽管略带开玩笑性质）的定义，解释了为什么社会创造并赋能了一类专业人士，建筑界或其他领域（**强调内容**）：\n\
  \n> » 为了认可并报答他们的专业知识、经验和判断——我们期望他们将这些应用于提供负担得起、易于获取且最新的、令人安心且可靠的服务——并基于他们将策划和更新其知识与方法、培训成员、设定并执行工作质量标准，且仅允许合格的人员加入其行列，并且他们将始终诚实、诚信地行事，将客户利益置于自身利益之上的理解。我们（社会）对专业领域信以信任，并授予其在广泛的具有社会意义的服务和活动中的独占权，方法是支付他们公平的工资，赋予他们独立性、自主权、自决权，并给予他们尊重和地位。“\
  \ «\n\n这里定义了一种社会契约：运行我们的世界似乎既需要由公共信任加持的非凡专业知识，因此我们提升了一小群受过高等教育、获得认证且据称高薪的个体的地位，让他们去完成非常特殊的事情。建筑学，作为一种将欲望和资本转化为居住空间的职业，似乎属于这一范畴。尽管有人暗示这种权力和影响力未能服务于其旨在服务的公众，但建筑师仍然是面临同样挑战的建筑行业生态系统中至关重要的一环组成部分。该系统在第\
  \ 1.6 节中有更深入的探讨，它很大程度上是为了制造产品——即建筑和其他物理基础设施而组织的，但建筑师作为其中的专业参与者，具有截然不同的角色：他们是提供判断并对判断结果承担个人责任的专家级个人。\n\
  \n哲学家 Donald Schön 研究了专业人士如何学习和部署专业知识，他认为建筑师和其他专业人士的工作方式与制度化程度较低的职业不同，这归功于他所谓的“反思性实践”（*reflective\
  \ practice*），或者通过对“在人类重要事务上的非凡知识”中获得的内隐理解来应用洞察力并做出决策的能力。Schön 所说的“在场所的隐性认知”（*tacit\
  \ knowing in place*）我们可以称之为直觉，或者正如 Rittel 描述的解决设计“棘手问题”（*wicked problems*）所所需的启发式方法。我们稍后将探讨\
  \ AI 是否能实现`非凡知识`，但就这次对专业主义的特定探讨而言，让我们假设建筑师的综合角色由于其专业责任，无法完全被今天的经验主义 AI 甚至是未来可能以某种方式`学习`的认知系统所取代。\n\
  \n然而——对于 AI 来说，似乎总是有一个“然而”建筑的规划、设计、采购、施工和运营充满了程序化和数据驱动的任务，从工程量计算到调节温度和湿度。如此，运行这些过程的系统无疑会受到自主计算的影响，甚至被部分转型。建筑师面临的问题是，未来的\
  \ AI 辅助建筑师到底在哪里、如何以及需要知道什么？\n\n### 什么是专业知识？\n\n\n\n\n\n2020 年秋季，我参加了一场由从业者、教育者和学生组成的在线小组讨会，探讨毕业生的职业前景，当时我们希望这正处于全球疫情的后期。在讨论后期，当地一家公司的负责人与纽约某学院一位备受尊敬的左翼院长之间进行了交流，比较了他们对近期毕业生专业知识的预期。出乎意料的是，那位执业建筑师疑惑，为什么他新招佣的人对`建筑是如何组合在一起的`（这是一个熟悉的调调）或执业的流程和程序知之甚少。院长则在想，为什么她要让学生为一个目前似乎如此无法应对时代挑战（社会、经济、环境）的职业做准备，并暗示她的工作培养学生不是为了支持当下的实践，而是为了在未来和为未来进行彻底的改革。我不愿错过这个探讨我最感兴趣的话题的机会，于是我询问那位从业者，建筑行业如何在要求毕业生掌握更多知识——并让学校让他们以`微型建筑师`的身份培养他们的同时——付给他们的薪水却如此低。回答耐人寻味：在当地这家公司，获得执照意味着薪水增加\
  \ 1000 美元，或者略低于我预计他支付给最资浅员工工资的 2%。\n\n### 那么，成为建筑师需要了解什么？\n\n小组成员的观点可以作为一个很好的起点：教育者认为年轻建筑师开始职业生涯需要了解什么，而专业执业考试和要求的编写者又是怎么想的？当然，这种时间点并不完全对应，因为英国和美国的执照都需要在完成教育后获得专业经验，但尽管如此，对这两个构想进行比较仍然具有启发性。为了本次考核，我将我非常熟悉的课程（耶鲁大学建筑学院的课程）与英国\
  \ `ARB Part 3` 考试所列出的研究生阶段执业能力，以及美国类似的标准——由美国国家建筑师注册委员会协会（`NCARB`）管理的建筑师注册考试（`ARE`）进行了对比。\n\
  \n### 耶鲁大学课程分类\n\n在耶鲁大学，我们要求`Part 2`候选人（即获得学后建筑硕士学位的人）在以下课程类别方面具备能力：\n\n*   **建筑设计**：在建筑设计创作中的传统工作室教学法，主要关注工作的概念和方案阶段。\n\
  *   **可视化**：通过模拟和数字手段对建筑设计构想进行描述。\n*   **环境系统**：建筑结构、机械、电气和其他技术子系统的设计与整合。\n*   **历史/理论**：理解建筑学科的历史和理论平台。\n\
  *   **建筑技术**：观察并执行建筑的技术体现，包括复杂系统的整合、施工图纸制作以及现场施工经验。\n*   **城市设计与景观**：理解建筑在城市和场地背景下的运作方式。\n\
  *   **专业执业**：职业介绍，包括伦理、法律、项目管理和业务交付方面。\n\n### NCARB 能力列表\n\n`NCARB` 相应的能力列表既详尽又有些互不兼容，包含六个大类和\
  \ 100 项子能力：\n\n*   **实践管理**\n*   **项目管理**\n*   **项目程序与分析**\n*   **项目规划与设计**\n* \
  \  **项目开发与文档**\n*   **施工与评估**\n\n### ARB 标准\n\n`ARB` 作为一个较为简练的考官，类别较少，子能力也较少（50\
  \ 项）：\n\n*   **专业精神**\n*   **客户、用户与服务交付**\n*   **法律框架与流程**\n*   **实践与管理**\n*   **建筑采购**\n\
  \n### 比较分析\n\n将子能力与课程类别进行非正式映射，产生了一种有趣的脱节，特别是关于英国标准，如图 1.3.1 所示。\n\n似乎，有关实际执行的问题，特别是关于专业执业的业务和流程，被\
  \ `ARB` 强力强调。假设建筑课程在全球范围内大是一致的（因为它们都源自类似的学院派来源），那么当学生离开学校的工作室进入执业领域时，重点通常会发生剧烈变化，由此产生的紧张关系在我们的小组讨会中得到了体现。\n\
  \n![1.3.1: 比较课程与能力，美国和英国的 NCARB、ARB 和耶鲁 Part 2](img/fig00015.jpg)\n\n\n\n\n\n在最近对人工智能影响的探索中，计算机科学家斯图亚特·罗塞尔（Stuart\
  \ Russell）认为，人类推理的一个基本特征，以及随之的人类知识的特征，是我们能够以`几十个抽象层次`分层地部署我们的理解以服务于行动。他进一步引用了亚里士多德的`实践推理`（practical\
  \ reasoning）概念，即知识和行动被理性地部署，用以实现某个特定的目标。对于建筑师来说，这些目标可能局限于`确保这扇门向正确的方向开启`，也可能高大到`试图通过这种空间体验触动灵魂`。完成前者所需的知识需要对门是如何运作的有基础的了解（可能是在建筑规范的背景下），而后者则可能需要一生工作积累的集体洞察。无论何种情况，每个目标都有一个共同要求，即建筑师必须引用正确、当前且相关的信息，并在使用时运用她的判断。\n\
  \n一位才华横溢的设计师以既诗意又技术的方式运用她管理这些`几十个抽象层次`的技能，而目前建筑人工智能研究的大部分工作（特别是在学术界）集中于前者。在成千上万份精美的平面图上训练机器学习系统以生成新方案，或使用\
  \ AI 策略创建新颖的美学解决方案，无疑是一条有效的探索途径。然而，这并不是此类系统在短期内对实践产生最直接或最重要影响的地方，因此不是本文考察其余部分的重点。\n\
  \n开发一套完整的认识论——无论是美学上的还是技术上的——是他人的任务，但就本文考察而言，我们或许可以得出：建筑知识的范围了从详细的技术信息，到对程序和流程的理解，再到在职业生涯中不断应用、精炼和综合而获得的洞察。\n\
  \n\n\n同样的原则可能适用于另一个建筑知识的棘手问题，即跨数字系统的信息互操作性。图 1.3.4 描述了当今数字信息的一种潜在数组，这些信息可以通过人工智能进行合理化并生成新的输出。人工智能处理过程非常适合索引、交叉引用和关联此类数据，因此可以成为\
  \ AEC（建筑、工程与施工）信息的隐式互操作工具，从而开始为后续系统（包括学科和计算系统）的演进构建一个更连贯的信息平台。计算机科学中一个类似的概念——`glue\
  \ code`（胶水代码）就是一个先例。胶水代码由在大型系统中低级运行的计算机指令，用于连接大型程序中不同的部分，将数据从一个子程序传递到另一个子程序。虽然这并不新奇，但人工智能极可能是未来建筑知识的胶水代码。\n\
  \n### 知识的新模型\n\n本文后续部分将进一步构建的论点大纲应该是显而易见的：在人工智能变得对建筑师有用、更不用说成为生存威胁之前，还有很多工作要做，路还很长要走。让我们假设实用性优于毁灭，建筑过程（正如许多行业的许多过程）日益依赖计算，且真正有用的人工智能系统必须依赖这些数据。可能会有一个时刻，也许是十年或更以后，计算和认识论的一致性将为建筑相结合，标准不一、不兼容的数字流程以及无法获取的洞察时代将结束。\n\
  \n这些工作可能会源于实践的重点，正如上述的，这些重点很大程度上关注更务实、程序化和琐事的事务。随着建筑交付过程中其他部分（例如可行性研究、精确成本建模、施工自动化和自主数字建筑运营）通过数字化程度的提高不断演进，建筑师将需要理解如何管理和访问信息，将其部署于随之产生的新职责和职业义务之中。今天的建筑师依赖于对不断增加的信息池的熟悉，结合专业判断和直觉；而未来的建筑师可能需要人工智能提供的中介能力来进行设计。\n\
  \n# 1. 4 设计及其他领域中的 AI 与流程变革\n\n\n> » 新兴的人工智能技术为日益数字化的建筑行业中的设计师创造了一系列机会，同时也为定义他们的角色和责任引入了巨大的不确定性。在一个加速自动化的流程领域中，随着人工智能变得越来越强大，该行业目前拥有的技术将如何发生变革？«\n\
  \n我在建筑事务所的第一个真正正式工作是在前数字时代，远在计算机在行业中普及之前。我们在北卡罗来纳州的一家小型事务所的合伙人在一个夏天下午，在看了一个名为“计算机辅助制图”的新技术演示后回到工作室。虽然他对整个想法（尤其是成本）深表怀疑，但他注意到看着绘图仪绘制一张图是令人着迷的，“就像一个真实的绘图员^(1)\
  \ 在处理图纸的一个部分，然后是另一部分”。他还明确表示，在可预见的未来，没有任何一台机器会取代我们办公室里那些在聚酯片上铺塑料膜的人。\n\n我的老老板离比文字处理系统更复杂的设备还有几年之遥。就在十年前，远见的技术专家尼古拉斯·尼尼格罗庞特（Nicholas\
  \ Negroponte）和他的同事们在麻省理工研究“建筑机器”，而主流实践界对技术仍持有早期的持续不确定态度。\n\n![1.4.1 早期绘图仪，C](img/fig00019.jpg)\n\
  \n1.4.1 早期绘图仪，198θ*5\n\n在尼格罗庞特的研究和我的第一份绘图工作之间，人们可以找到这种矛盾心态的核心双重焦虑：坚信建筑师的工作是独特价值的贡献，同时又对能力的机器将无情地取代我们感到偏执——这就是我们行业对机器智能及其对设计过程所谓影响的焦虑之源。然而，正如斯坦福计算机科学家罗伊·阿马拉（Roy\
  \ Amara）据说过的，“我们倾向于高估技术在短期内的影响，而低估其长期影响，”^(3)建筑目前对人工智能的关注恰恰如此。今天的技术状况与四十年前截然不同，但这种矛盾合理地依然存在。\n\
  \n对人工智能对实践的影响产生的担忧涵盖了从设计理论到就业经济学的各个领域。尼尔·李奇（Neil Leach）思考启用 AI 的计算机是否具有创造力，^(4)，而安托万·皮孔（Antoine\
  \ Picon）在谨慎地拥抱机器辅助设计机会的同时，担心人工智能重构劳动力：\n\n> » *直到最近，人们认为自动化只会影响低技能工作。情况可能并非如此。建筑可能是受影响最严重的学科之一。这种高度脆弱性的原因是，建筑是所有艺术中最形式化的之一。机械部分比其他领域更强，因此该学科处于艺术与技术门槛之间的传统位置。*\n\
  \n劳动经济学家丹尼尔·苏斯金德（Daniel Susskind）（引用英格兰银行行长）将这种现象称为“聪明人才的屠杀”^(6)，并对专业人士的价值价值挑战：\n\
  \n> » 我们认为职业将经历两并行的变化。第一将由自动化主。传统的工作方式将通过技术应用被简化和优化。第二将由创新主。日益强大的系统将改变专业人士的工作，产生分享实践知识的新方式。从长远来看，后者将占据主导地位，我们的职业将被逐步拆解。^(7)«\n\
  \n理论推测与日常实践之间可能存在巨大的鸿沟，因此现在是连接这两者的良好时机，以免拆解真正开始。除了对这项新技术的可能性进行理论化——要么希望它会绕过我们，要么对抗知识工作不可避免的自动化——我们应该检查设计过程与机器智能之间的关系，以确定它们在最坏的情况下如何共存，在最好的情况下如何互为补充。\n\
  \n### 流程与平台\n\n\n\n\n\n随着建筑业日益数字化，一种关于数据输入、算法过程和潜在 AI 辅助输出的新兴分类法正在出现。随着行业对计算机的依赖日益增加，产生了大量的数字信息池。这些数据通过所谓的`common\
  \ data environment`（共同数据环境）平台进行访问，这些平台对生成的信息进行组织、索引和引用。它们系统化了由行业通用`automated process`（自动化过程）工具（如\
  \ `CAD`、`BIM`、分析引擎、电子表格等）集合创建的输入和输出。随着 AI 工具进入 AECO（建筑、工程、施工和运营）领域，一套新的`autonomous\
  \ process`（自主过程）工具将会出现，它们创建结果时不再需要其自动化前身所必需直接输入和控制。这三种过程平台——共同数据环境、自动化过程工具和自主过程的结合，将产生一系列新的潜在`outcomes`（结果），可能会从根本上改变设计流程以及建筑师对结果的责任。\n\
  \n请参见图 1.4.1 所示这些关系的图表。\n\n![1.4.2: 输入、过程转换与结果](img/fig00020.jpg)\n\n#### 1.4.2:\
  \ 输入、过程转换与结果\n\n由于建筑工具日益基于计算机，如今的建筑项目产生了海量的数字信息。虽然在 20 世纪 80 年代和 90 年代初，最相关的数字输出是由\
  \ `CAD` 或文字处理工具创建的（分别由 `AutoCAD^©` 和 `WordPerfect` 创建），但今天，设计-建造-运营-使用连续体中的几乎每个部分都有某些元素被数字化了。在新冠疫情期间，建筑专业领域完全转向远程办公的简易程度表明，设计工作可以在很大程度上实现数字化，并且很可能永久地保持这种状态。\n\
  \n正如我们在上一章中看到的，如今的人工智能系统主要基于经验主义平台，必须消耗大量的数字信息才能达到某些基础水平。遗憾的是，这些数据今天以各种形式和格式存在，其异构性远没有达到数千局国际棋的记录或数百万张猫的照片。\n\
  \n然而，可以根据当前实践以及数字技术和过程可能的演变，对数字建筑信息进行分类，以便为 AI 在设计的未来开发智能输入策略。这些类别包括：\n\n> **设计表现**，以模型、图纸、研究、项目管理文档以及作为资产设计、协调和施工创建结果的其他元数据的形式存在。表现信息由设计师、建造者和建筑运营商生成，用于正式记录意图。建筑信息模型（`BIM`）属于这一类，由于稍后将探讨的其他原因也非常重要。\n\
  \n> **实景捕获信息**，记录现有物理现实，包括地形和 GIS 数据，以及视频记录、照片（2D 和 3D）以及来自现有状况和施工中现场的扫描点云数据，所有这些共同共同将建筑的物理世界转化为可访问的数字形式。\n\
  \n> **评估、模拟和分析数据**，包括支持设计、工程和施工管理的参考数据集，用于确定性能的分析模型，以及使用设计表现作为输入对项目开发过程中行为的模拟。结构工程分析软件、能量建模和计算流体力学模型是安德鲁·维特所谓的“技术科学”模型的良好例子。(8)\n\
  \n![1.4.3: 建筑信息模型 (BIM)](img/fig00021.jpg)\n\n#### 1.4.3: 建筑信息模型 (BIM)\n\n![1.4.4:\
  \ 激光雷达扫描](img/fig00022.jpg)\n\n#### 1.4.4: 激光雷达扫描\n\n![1.4.5: 数字化分析与模拟](img/fig00023.jpg)\n\
  \n#### 1.4.5: 数字化分析与模拟\n\n![1.4.6: AUTODESK B36θ 成本管理跟踪系统](img/fig00024.jpg)\n\n\
  ### 1.4.6: AUTODESK B36θ 成本管理跟踪系统\n\n![1.4.7: AUTODESK TANDEM 数字孪生](img/fig00025.jpg)\n\
  \n#### 1.4.7: AUTODESK TANDEM 数字孪生\n\n> **控制与协调信息**，由过程控制、监控和跟踪协议生成，例如施工管理数据系统、项目控制网站和成本估算/管理系统。\n\
  \n> **资产运营、系统性能和使用信息**，由建筑管理控制系统和其他运行资产的传感器生成，以及描述用户与资产本身交互的物联网（`loT`）信息。随着既有资产包含越来越多的各种数字基础设施，产生的数据将累积成为一种记录，未来的设计可以据此开发。\n\
  \n> 这些数据源结合在一起是不连贯的，它们仅通过“项目企业”这一抽象概念联系在一起，该概念源于起源、实现、运营和使用已建成资产。然而，从个体来看，它们组织良好、有索引、保持一致，因此作为机器智能系统的数据源是完全可，在某些情况下，它们可能由此类系统自行生成。\n\
  \n### 过程转换\n\n将数据流转换为新的、数字化赋能的结果的核心，是既有和新的软件、平台和计算机化程序，它们协同工作，将建筑师的工作推向其由三个元素组成的数字未来。\n\
  \n1. **共同数据环境：** 输入流汇聚在一个名为共同数据环境（或 `CDE`）的环境中，它被正式定义为“用于任何给定项目或资产的收集、管理和传播每个信息容器的约定信息源”。(9)\
  \ 该信息结构为组织、定位、版本控制和部署资产创建过程中的各种数字制品（上称为“容器”）创建了一个索引引用系统，并为项目资产创建期间积累的各种输入流和数据集合提供了可引“容器”（使用\
  \ `CDE` 术语）。项目的设计师、建造者和运营商随后有了两类工具来创建或支持他们在创建建筑过程中的各自角色：“自动化的”工具和“自主的”工具。在本书的剩余部分，定义这一区别对于理解\
  \ AI 工具如何为建筑师提供不同的机会和威胁至关重要。\n\n2. **自动化过程：** 自动化工具是大多数建筑师今天熟悉的数字仪器，它们直接属于“算法”机器智能的类别。今天，任何作为直接操作其能力的结果、并根据特定输入生成结果和数据的软件工具，都可以概括为“自动化的”。为了讨论的起见，我们可以用\
  \ `BIM` 的例子来说明这一点。\n\n\n\n\n\n使用 BIM 工具开发设计的设计建筑师在很大程度上完全控制着数据创建过程。她决定项目需要门、墙、窗户和地板，并通过指令其\
  \ BIM 软件以数字化的方式创建这些元素。这些元素中的每一个都通过算法编码以具有特定的特性；例如，门与墙之间存在某种特定的约束关系，从这个意义上说，它具有特定的构造“智能”，建筑师在创建模型时会部署这种智能。当她将门实例化到\
  \ BIM 中时，部署该门的过程是自动化的，它在各种模态下的表现——平面图、立面图、剖面图、详图、进度表——会自动在相应的位置为她生成。如今建筑师使用的多数传统软件工具都是此类“自动化”过程。\n\
  \n#### 3. 自主过程\n然而，人工智能工具与其自动化对应品的不同之处在于，它们可以在没有设计者直接干预的情况下处理并生成结果，进行自主运行。例如，当上述支持\
  \ BIM 的建筑师在网上搜索产品信息时，搜索引擎的 AI 驱动过程不仅结合了它作为机器通过之前的搜索所学到的关于网络建筑产品信息领域的知识，还根据其之前的搜索模型以及对最初发起搜索目标的结论，结合了她可能的特定兴趣。因此，这种产品搜索以及今天所有此类基于\
  \ AI/ML 系统的工具都是“自主”的，与她的 BIM 创作体验有所区别。\n\n# 新一代的成果\n\n随着基于 AI 的系统可以访问日益庞大、组织良好的数据集，我们可以推测随着此类系统变得越来越强大且可用，建筑师在未来十年可能会看到的系列自主机会。这些类别我们暂称之为“自主输出”，形成了一个推测框架，我们可以从该框架开始针对对行业的影响制定策略，并可能包括以下内容：\n\
  \n> **设计任务自动化：** 某些需要设计者直接干预的程序和协议未来可能会是自主的。虽然目前大多数代码检查是手动过程，但该程序可以通过将数字模型提交到代码检查工具来支持，该工具使用\
  \ AI 来评估代码合规性，将更传统的“建筑”模型与技术科学的对应品相结合。\n\n![1.4.8: UPCODES CODECHECKING SOFTWARE](img/fig00026.jpg)\n\
  1.4.8: UPCODES 规范检查软件\n\n> 以后，这种基于 AI 的规范检查器可能潜伏在 BIM 过程的背景中，在设计者创建方案时预判规范相关问题。类似的自主协议可能会跨越建筑的整个交付和运营寿命。\n\
  \n> **替代方案生成与探索：** 设计替代方案曾完全通过直接操作设计信息来创建，如图 1.4.9 所示的纸板模型。如今，这一过程由脚本辅助，这是一种“自动化”控制模型中某些数字控制参数的形式，以改变其特性并从而创建各种解决方案。这些脚本有时与分析软件（如能量分析）相结合，以评估和优化结果。脚本创建了未来由\
  \ AI 生成设计的参数。\n\n> **施工自动化：** 随着 AI 辅助控制系统加速了机器人技术的发展，加上计算机视觉的增强以及由于借自制造业的工业化施工流程的出现，曾经仅由人类工人执行的施工任务将得到现场自主设备的增强，在某些情况下将会被取代。最近一个极佳的例子是\
  \ `PictoBot`，这是一种 AI 驱动的机器人，它与人类监督员一起工作，粉刷室内墙，而无需其他辅助。虽然此类工作的图案、位置和面层可能在建筑师的建筑模型中指定，但翻译设计者对具有特定特征表面的意图需要一种取决于上下文的操作，这种操作只能通过某种计算智能有效地机械化。\n\
  \n> **自主建筑功能：** 如果建筑师和工程师的初始 BIM 是建筑的第一性功能描述，可能包含其系统的性能目标（以及实现该性能的控制基础设施的设计），那么该建筑的空气、水、废物和信号系统会产生另一组数字数据，结合实时分析可以用于校准和优化这些系统。提供此类建筑基础设施的公司（如\
  \ `Johnson Controls`）构建的不只是空气分配系统，还构建了与基于 AI 的显示器通信的系统数字控制，显示器记录并优化系统输出和能源使用（从而减少碳）。当然，由\
  \ AI 解释的生成的分析数据集也可以为后续建筑及其组件设备的设计提供见解。\n\n![1.4.9: MANUALLY CONSTRUCTED STUDY MODELS,\
  \ C. 1993](img/fig00027.jpg)\n1.4.9: 手工制作的研究模型，1993 年左右\n\n![1.4.10: SCRIPTING TOOLS\
  \ TO GENERATE A BUILDING ENCLOSURE](img/fig00028.jpg)\n1.4.10: 生成建筑围护结构的脚本工具\n\n\
  ![1.4.11 PICTOBOT, AN AUTONOMOUS PAINTING ROBOT, AS PROPOSED BY E. ASADI, B. LI\
  \ AND I. CHEN](img/fig00029.jpg)\n1.4.11 PICTOBOT，由 E. ASADI, B. LI 和 I. CHEN 建议的自主粉刷机器人\n\
  \n\n\n\n\n当理查德和丹尼尔·苏斯金德在 2015 年的著作《职业的未来》（*The Future of the Professions*）中认为人工智能将取代社会对专业人士的需求时，建筑师们理应感到担忧。我们的职业是一个不稳定的行业，规模更小、政治影响力更弱，而且薪酬显然低于同样面临威胁的法律或医学同行，后者在允许自己被自动化淘汰之前，无疑会进行更激烈的抵抗。苏斯金德夫妇在论文的开头就宣布：\n\
  \n> »……我们正处于一个社会专家知识提供方式发生根本性且不可逆转变化的时期边缘。技术将是这一变化的主要驱动力。从长远来看，我们既不需要也不希望专业人士按照他们在\
  \ 20 世纪及以前的方式工作。^(1)«\n\n他们观察到，社会建立专业人士是为了提供专家知识，在此过程中，这些专业人士囤积专家信息，控制访问权限，并以可以被智能机器轻松自动化的方式部署它们。放射科医生将位于更耐心、更准确读取诊断图像的算法；律师将不再需要搜索文档寻找证据、准备常规法律安排，甚至在纠纷中代表客户；而建筑师将不再需要设计、记录或帮助建造项目。^(2)\n\
  \n当我在 2021 年写这些文字时，距离这一灭绝宣言已经过去了六年，超级智能机器对这些领域任何一个学科的工作尚未出现显著的侵入。然而，最好不要太乐观，因为技术变革对于整个建筑行业，特别是建筑业来说要缓慢得多。^(3)\n\
  \n### 离散任务 vs. 完整工作：ALM 假设\n\n对建筑师及我们提供的服务的侵入可能在丹尼尔·苏斯金德随后的著作中得到了更好的描述，书中认为，计算机消除的可能是离散的`tasks`而非整个）`jobs`（工作）。他根据经济学家大卫·奥托（David\
  \ Autor）、弗兰克·列维（Frank Levy）和理查德·穆纳恩（Richard Murnane）的工作得出了所谓的“ALM 假设”，区分了整个`jobs`与`tasks`，以及常规与非常规`tasks`之间的区别。\n\
  \n常规`tasks`（如工业革命期间许多通过机械化自动化的任务）需要`ALM`理论所谓的“显性”知识，这些知识易于记录、解释和重复。而这些任务是基于“隐性”知识的，例如需要专业建筑师的创造力和判断力，这些将不会被自动化，因为无法用`algorithms`（算法）等逻辑表达式表达的规则来捕捉此类工作。^(4)\n\
  \n苏斯金德将这种思考应用于当今新兴的`AI`时代，认为机器很有可能侵入隐性知识的领域：\n\n> » 人们倾向于说，因为机器不能像我们一样推理，所以它们永远不会做出判断；因为它们不能像我们一样思考，所以永远不会发挥创造力；因为它们不能像我们一样感受，所以永远不会产生共情。这些可能都是的。但它没有考虑到，当人类执行某些需要共情、判断或创造力的任务时，机器仍然可能完成——只需通过某种完全不同的方式来完成。^(5)«\n\
  \n如今的经验主义、基于深度学习的系统开始模拟创造力，但显然还没有达到这种程度，例如，人们可能愿意委托这种`algorithm`来完全取代建筑师的专业判断。与此同时，更重要的是通过当今专业服务的视角，审视`AI`可能影响专业工作`tasks`的结构。\n\
  \n### 机器学习架构\n\n如果今天最强大的智能机器是基于各种深度学习策略的，我们可以根据它们被训练能做什么来评估其能力。马克·格里夫斯（Mark Greaves）在第\
  \ 1.2 章中描述的机器能力分类法，源于许多教师为人知的经典参考——布鲁姆分类法（Bloom's Taxonomy of learning），该分类定义了从所谓的“低阶思维”（如记忆）到“高阶思维”（如创造新事物）的能力层级结构。布鲁姆创建这种方法是作为课堂里选择教学策略的指南，他的学生安德森（Anderson）和克拉索沃尔尔（Krathwohl）随后完善了这一层级，使用了当今教师非常熟悉的术语，^(6)，并在表\
  \ 1.5.1 中进行了对比汇总。\n\n可以认为，今天最成功的深度学习系统——那些发明新游戏策略并因此消灭人类对手、能够可靠地将英语翻译成日语，甚至创作音乐或绘画的系统——以某种方式爬上了布鲁姆金字塔，已经远远超过了记忆甚至测试数据，达到了“创造”新概念阶段。在某些极其有限的范围内，例如围棋的特定规则，或数千幅画的习得模式，也许这是事实。然而，一个程序好了一套严谨规则的机器可以被认为拥有大量的显性知识，因此它仅以非常有限的方式进行“创造”，特别是因为成功的标准——如赢得比赛或识别放射影像上的肿瘤——是如此具体的。\n\
  \n### 1.5.1: 学习分类法 \n\n| || BLOOM | ANDERSON/KRATHWOHL | GREAVES |\n| --- | ---\
  \ | --- | --- |\n| 高阶思维 | **CREATE** (创造) | DESIGN (设计) FORMULATE (制定) DEVELOP (开发)\
  \ | | | | CREATE (创造) |\n| --- | --- | --- | --- | --- | --- |\n| **EVALUATE** (评估)\
  \ | DEFEND (辩护) JUDGE (判断) SELECT (选择) | | SIMULATE (模拟) |\n| **ANALYSE** (分析) |\
  \ COMPARE (比较) DISCRIMATE (辨别) TEST (测试) | | EVALUATE (评估) |\n| 低阶思维 | **APPLY**\
  \ (应用) | CHOOSE (选择) DEMONSTRATE (演示) SKETCH (画 Sketch)/SOLVE (解决) | |\n| **UNDERSTAND**\
  \ (理解) | CLASSIFY (分类) LOCATE (定位) TRANSLATE (翻译) | UNDERSTAND (理解) |\n| **REMEMBER**\
  \ (记忆) | DEFINE (定义) DUPLICATE (复制) MEMORISE (记忆) | |\n\n因此，让我们在接下来的几页中假设苏斯金德的任务自动化论是未来对建筑实践最可能的影响，并且专业行业提供的服务中的某些`tasks`可能会被智能计算机增强、加速甚至取代。苏斯金德断言，那些`tasks`易于识别：它们服务于可以容易衡量的明确目标（以确定成功），并且机器需要大量数据来学习如何实现目标。^(7)\
  \ 人们认为许多建筑任务符合这一点，包括诸如：“该项目是否符合消防规范？”或“这个吊顶空间是否能容纳所有建筑设备？”如果有足够的数据和适当的训练，计算机可以实现这些目标吗？或者更好，不仅回答问题，而且生成满足这些需求的设计方案？\n\
  \n如果简单如此，我们现在就可以开始在机器中构建建筑智能。然而，任务自动化还有另一个维度，即斯图特·罗塞尔（Stuart Russell）所说的层次规划与管理：\n\
  \n\n\n\n\n> » *跨越长时间尺度的智能行为需要分层规划和管理活动的能力，横跨越多个抽象层级——从攻读博士学位（涉及一万亿次行动）到在申请求职信输入单个字符时发送给单个手指的电机控制指令。*\n\
  \n为了实现特定目标（即使是那些需要明确知识且具有清晰、可衡量结果的目标），智能机器必须能够以集成的顺序部署一系列（自动）任务以实现该目标，并在此过程中确保任务能够朝着既定目标协同工作。如今建筑师的职责中，极少（即使是那些仅依赖明确知识的职责）可以通过这种方式实现自动化，因此在短期到中期，大范围的设计服务不太可能得到满意的自动化。\n\
  \n### 建筑服务\n\n现代建筑师提供的服务处于一个典型的连续体，从项目定义开始，一直延伸到设计和施工。在英国，此类服务由 `RIBA Plan of Work`\
  \ 有明确的定义；在美国，则由 `AlA` 的《业主-建筑师协议 B101》定义为“基本服务”。两者在[图 1.5.2]中进行了比较。\n\n总而言，每个范围都规定了一条通过标准任务集的路线，这些任务可以被归类为项目定义、设计、生产等类别。工作的每个阶段由一系列子任务组成，这些子任务随阶段而异，并根据规范建筑服务的预期、交付物和专业标准进行调整。这些子任务本身可以分类为执业管理、项目管理等通用大类，并横跨多个服务阶段。与服务类别对齐的此类示例任务的粗略映射，可以在[图\
  \ 1.5.3]中找到。\n\n![1.5.2: RIBA AMD AIA SCOPE OF SERVICES](img/fig00030.jpg)\n\n1.5.2:\n\
  \n### AI 支持的服务\n\n我们可以从图 1.5.3 的列表中提取几个示例任务，以测试这一论点：项目过程中的某些特定职责比其他职责更适合自主技术。通过使用我们上面的分类法选择几个主要是程序性的示例，我推测了\
  \ `AI` 系统可能如何与其人类建筑师同伴协同工作。\n\n这个快速的草图化问题表明，至少在短期内，`AI` 系统的范围将受到限制，需要大量目前无法获得的数据，并且可能会增强而非消除建筑师的核心工作。这在短期内是一个令人安心的结论，但随着\
  \ `AI` 系统在理论上从经验能力向认知能力演进，这一结论还需要进一步考虑。\n\n![](img/fig00032.jpg)![1.5.3: TASK COMPONENTS\
  \ IN TRADITIONAL SCOPES OF SERVICE](img/fig00033.jpg)\n\n[1.5.3:](# TASK COMPONENTS\
