  \ |\n\n 现状、近期未来及以后\n\n遵循苏斯金德（Susskind）定义的经验主义 AI 系统开始出现在如今的“建筑科技”（BuildTech）市场中，其中许多系统关注于狭义定义的程序，这些程序需要清晰可衡量的目标、显性的逻辑和大量的数据。下表描述了截至\
  \ 2021 年中旬出现的一些此类公司：\n\n### 1.5.5：建筑领域基于 AI 的创业企业，2θ21\n\n| 公司 | 目标 | 逻辑 | 数据 |\n\
  | :--- | :--- | :--- | :--- |\n| SPACEMAKER AI | 优化场地内的多单元建筑配置 | 调整建筑尺寸参数以优化用途和配置\
  \ | 场地规划和空间利用分析输出 |\n| PLANIT IMPACT | 测量并减少建筑的能源和水消耗 | 将建筑特征转化为能源和雨水的输入与输出 | 能源模型、使用数据、场地基础设施信息\
  \ |\n| JOIN | 从概念到完成组织、优化并控制项目施工成本 | 分析并管理成本输入和项目历史以实现成本目标 | 成本估计历史、当地经济状况、市场信息\
  \ |\n| ENVELOPE | 确定城市场地的最大允许建筑面积 | 将建筑分区条例转化为建筑配置 | 分区代码、参数化建筑模板 |\n\n随着这些系统变得越来越强大，能够收集数据并在其神经网络中构建复杂的关联数据结构，它们的逻辑很可能会扩展到更广泛的特定任务中。\n\
  \n## 1.6 交付、手段与方法\n\n> 建筑师在交付系统中运行，与客户、建筑商以及最终公众有着特定的关系和义务。当技术向自主计算发展时，建筑师作为专业人士的角色会发生怎样的变化？\n\
  \n“项目交付”一词包含两个两个核心方面：\n\n1. 客户（创造建筑需求并随后运营和使用建筑）、建筑师（设计建筑）和承包商（采购、制造、组装和建造建筑）的组合。\n\
  2. 这些参与者如何根据其各自的角色、职责和风险管理能力，在一套定义的专业、信息和法律关系中进行排列。\n\n### **项目交付类型**\n\n在一个完美的世界里，将确定一个与项目需求和参与者能力匹配的交付模型。然而，由于权力动态和政治在此类决策中所起的作用与技术考虑同等重要，交付系统的选择并不总是完美适用于参与者或项目本身，这在项目初期引入了信息不连续性，这些中断往往贯穿始终，且效果甚微。\n\
  \n在整个 20 世纪，特别是当建筑演变成一个真正的行业之后，这些交付模型中的关键参与者形成了原型的角色。客户希望将资本转化为物理资产，但缺乏所需的技术能力，因此他们聘请建筑师来定义需求，并聘请承包商将这些定义转化为建筑。由于利益不一致等多种原因，这些系统产生了不尽人意的结果，因此在改革这些系统方面进行了广泛的实验。\n\
  \n\n\n\n\n正如第 1.3 节中所述，这种错位结合建筑师和建造者的典型角色，使得双方处于对立状态。建筑师以判断的形式提供专业服务，因此他们很大程度上从事的是创造和分发想法（设计）的业务；而承包商则交付产品，因此他们的首要任务是制造物体（建筑）。在这种语境下，这些区别是重要的。如果建筑师承担着“提出想法”的角色，而承包商则以某种方式“处置”这些想法，无疑会产生紧张局势。然而，随着建筑环境日益数字化，设计者与建造者之间的分界显得毫无必要——既不服务于建筑师、建造者，也不服务于他们的共同客户。尽管驱动经济的许多产品——汽车、飞机、家用电器、电子产品——在几十年前已经经过了数字化优化，但建筑行业一直落后。这种差距正随着建筑工业化而开始缩小^(3)。\n\
  \n因此，人工智能的自主机会可能会影响建筑师在交付系统中提供的服务，以及这些服务如何转换为建成世界的物理实物。\n\n现代建筑交付动态的挑战已通过多种策略得到了解决，从设计、成本估算、施工和供应商之间关系的重构（如公私合营模式\
  \ PPP 等模型以及近期对集成项目交付 IPD 的实验中所示），到尝试使用革命性的联合设计/施工表示手段（如建筑信息模型 BIM）——甚至是将这些者结合。然而，问题的核心早在\
  \ 1963 年在为英国建筑业准备的一份报告中就被确定了：\n\n> 施工控制的基本决策往往是不完整或过于仓促的，因为必要信息没有提前充分提供，或者不够完整。在许多情况下，施工团队的成员本可以但并没有通过提供数据来促进他人准备更完整、更有用的信息来缓解这一问题。建筑施工在工业活动中显著特点是缺乏关于其进行过程的详细信息。在了解更多信息之前，就不有改进的基础。*⁴*\
  \ «\n\n每个致力于交付交付的参与者都需要特定分辨率的信息、在特定时间、具有精确的完整度。每个人都创建、消费、部署和/或分配这些信息，以履行他们的义务、获取利润并避免承担不可管理的风险。因此，项目是在一组相互依赖但互不兼容的信息结构和责任阵列中交付的。在数字时代，各种技术潜伏在交付表面之下，希望平滑并改进它。人工智能正加入这一拥挤的求婚者领域。我们可以预计人工智能将增强——但也可能取代——建筑师的能力，并生成和组织连接建筑与施工的信息结构。\n\
  \n### 设计意图\n\n这些问题的核心是定义建筑师对交付过程本身的根本责任。这项职责最好通过“设计意图”概念来理解，该概念由英国皇家建筑师学会工作计划（RIBA\
  \ Plan of Work）定义为“(设计团队描述建筑系统的方式，以便让专业分包商能够设计该系统”。^(5) 如果你好奇建筑中任何特定系统的设计者究竟是谁，那么你并不孤单。建筑师和他们合作的顾问（工程师等）会根据明确其意图（无论其意图为何）所需的所需的细节水平，列出关于设计在完成后应该什么样以及如何运行的信息。在“设计”准备好在现场实现之前，还需要许多中间步骤，包括材料和组件的特定细节、建筑的精确程序和流程（称为施工的“手段和方法”）以及承包商做出的许多大大小小的决策。对大西洋两岸现代建筑的性质进行概括，可以客观地得出结论：建筑已经变得技术过于复杂，以至于单一实体——设计者或建造者——无法完全负责。即使是最小的项目也有一个由分包商、产品制造商和材料供应商组成的群体，而且成本一直是考虑中之重。在这些互动规则下对理想安排的最乐观描述中，建筑师给出的想法足够详细以指导建造者，而承包商则解决所有的具体细节。许多内容在翻译过程中流失了。\n\
  \n过去并非总是如此。在 18 世纪晚期的英国，以及直到 100 年后（即 19 世纪）的美国，建筑师完全负责施工的各个方面。Higgin 和 Jessop 在图\
  \ 1.6.2 中描述了项目交付模型。\n\n![1.6.2: 18 世纪英国的项目交付 6](img/fig00036.jpg)\n\n1.6.2: 18 世纪英国的项目交付^(6)\n\
  \n遗憾的是，对项目协调和预算管理的担忧与失败，以及城市和工业时代建筑日益增长的复杂性，使 19 世纪的情况变得更加现状^(7)，并在 20 世纪仅有微调，如图\
  \ 1.6.3 所示。\n\n注意造价师（管理成本）和总承包（采购和协调工作）的出现，这两个角色都反映了当前的实践。随着这些模型的演变，建筑所需的信息粒度和分辨率不断增加，事实证明，随着项目与采购流程、承包商及其下属（包括制造建筑系统的分包商）的对接，最好的办法是“最终”设计本身。⁸\n\
  \n随着建筑业从图纸转向 BIM，3D 信息的可用性反而加剧而非缓解了这种系统的内在紧张关系。建筑师抱怨说，他们既没有专业知识也没有费用在他们的设计意图 BIM\
  \ 数据中提供极端的施工细节，建造者则声称生成的 BIM 交付物不适合建筑。因此，尽管插入了一种旨在增加透明度和协作的技术，古老的病态依然存在。\n\n然而，还有其他力量在起作用，可能通过技术最终弥合这一古老的鸿沟。在一个日益趋向于更多的市场中……\n\
  \n![1.6.3: 19 世纪和 20 世纪英国的项目交付 9](img/fig00037.jpg)\n\n1.6.3: 19 世纪和 20 世纪英国的项目交付^(9)\n\
  \n\n\n\n\n效率与生产力，以及对传统交付方式结果的不，使得建筑业向数字化制造和工业化流程的转型已成为不可必然。特别是当自动化技术正推动行业向如今所谓的“工业化建筑”迈进，并利用制造策略进行加速时(10)。这导致了对高质量数字交付物的显性需求，以铺平道路。然而，建筑师及其咨询工程师能够交付这些内容吗？人工智能能否在弥合专业鸿沟方面发挥作用呢？\n\
  \n### 职业关系\n\n这个问题必须在建筑师所有义务（包括信息和其他方面）的背景下进行审。为此，我们可以把图 1.6.1 中的传统交付模型图由内向外翻，观察建筑师在任何此类结构中的具体连接，如图\
  \ 1.6.2 所示。将假设的建筑师置于关系的中心，我们可以看到需要四种不同的角色（参见图 1.6.4）。\n\n**业主的代理**，在过程中担任客户的中间人，生成设计并管理设计，凭借其“设计意图”的描述贯穿整个施工过程，并作为业主的代理确保建筑符合该意图。\n\
  \n**设计团队的领导**，负责协调和整合各个咨询公司的工作，旨在创建一个连贯、协调且准确的设计，并将其传递给建造者。\n\n**建造者的引导**，阐述项目目标，并帮助施工团队代表客户，阐释、澄清并最终审查和批准设计意图——当这些意图被转化为更详细的信息以支持施工时。负责特定建筑系统的分包商通常会创建极其详尽的信息来支持该系统的制造（深化图），但建筑师必须在制造商开始之前审查并批准此类提议。\n\
  \n**公众的保护者**，包括项目的特定用户，以及那些与建筑师没有特定合同义务、但建筑师仍需对在其设计中居住的人的健康、安全和福祉负责的人。\n\n![1.6.4:\
  \ 交付模型中的建筑师关系\\* * 如需了解此图表的更多详细信息，请参见图 2.2.1。](img/fig00038.jpg)\n\n1.6.4: 交付模型中的建筑师关系\\\
  * * 如需了解此图表的更多详细信息，请参见图 2.2.1。\n\n因此，建筑师要么生成、审查，要么受围绕一个简单建筑企业的海量信息的影响。尽管努力对其进行严格标准化，这些信息仍以各种格式、版本和详细程度出现，并且必须经过理解、协调并通常从源端到接收端进行转换才能有用。人工智能的一个即时机会——在本文写作时尚未探索——是尝试“理解”这些数据之间的关系，并以结构化、可访问且高效的方式部署它们。\n\
  \n### 关系、交付与计算\n\n因此，也许有一天将使信息的流动合理化，因为足够的数据可以被组织并访问。但在不久将来，人工智能如何增强或消除表 1.6.5 中定义的建筑师工作？\n\
  \n![1.6.5: 人工智能对建筑师交付角的影响](img/fig00039.jpg)\n\n1.6.5: 人工智能对建筑师交付角的影响示例\n\n### 手段与方法\n\
  \n现在看来，设计、施工和建筑运营过程正在快速数字化；交付参与者的义务可能会随之演变，特别是设计师和建造者的义务；这些过程产生了大量数据，这些数据可以被那些渴望学习如何（慈悲地）提供的人工智能系统所消耗；而数字鸿沟最大的鸿沟在于设计与施工之间。\n\
  \n\n\n\n虽然 Tombesi 未能超越 BIM 技术可能的范围进行推测，但他的论点很容易扩展到此类情况：即其流程节点中的某些数据和程序方面通过 AI 一部分自动化，而建筑师则承担起部署这些能力以协调和整合结果的角色。此外，灵活专业化交付结构所蕴含的多源数据流，需要一个理性的平台来组织、标准化和监控这些信息，这正是\
  \ AI 能力的一个强有力潜在用途。\n\n最后，在建筑的即时相互依赖流程之外，还存在着涵盖原材料和加工材料的庞大供应链。建筑师兼历史学家安德鲁·拉贝内克（Andrew\
  \ Rabeneck）甚至认为，设计师和建造者仅仅是钢材或水泥等建筑商品资本流动的这种“新政治经济”中的“偶然参与者”。^(12) 根据拉贝内克的说法，工业生产知识产权的控制权是由那些承担了开发这些系统风险的人所掌握，结果，“对科学知识和过程的工业控制在材料和产品制造公司中稳步增长”。^(13)\
  \ 他将这一论点延伸认为，这种对供应链及其组成部分的知识和理解的转移，是建筑师自身更大范围价值和影响力流的一部分。\n\n随着建筑手段和方法的日益工业化，拉贝内克所称的建筑专业能力衰落可能会加速，进一步拉大意图与执行之间的差距。这种可能性加强了这样一种论点：AI\
  \ 的工具——这些工具可以显著增强建筑师对建筑流程、程序和信息要求的理解，并允许这种洞察力指导并支持设计——可以被部署到交付系统中，以增强或消除建筑师。\n\n\
  ![1.6.6: TOMBESI 的灵活专业化概念](img/fig00040.jpg)\n\n1.6.6: TOMBESI 的灵活专业化概念\n\n# 02\
  \ 关系\n\n\n> » 建筑企业依赖于一系列实现的以产生结果的网络。顾问和建造者的专业团队是其中一个网络；他们的风险关系、经济交换和数据网络是其他例子。然而，第三组网络——构成\
  \ AI/ML 系统的神经网络——很快将覆盖这些结构并使它们发生转型。“«\n\n## 2.1 经济学、补偿与价值\n\n\n> » 像所有技术一样，AI 可能为价值创造和生产力提供新机会，同时也消除了对人类建筑师执行某些任务的需求。传统商品化压力带来的危险可能被新能力抵消，而通过这些能力，实践中出现了交付价值——以及提高盈利能力——的新机会。“«\n\
  \n建筑师在建筑行业更大的经济模型内运作，该行业一直长期于为其参与者创造一致的价值主张。大多数建筑是在一个经济准则下产生的：通过优化最低初始成本这一单一变量来获得最终产品。客户通常通过对费用进行价格套利来选择建筑师；建筑师也以同样的方式选择他们的咨询工程师。承包商通常根据最低报价进行选择，并将这种逻辑传递给整个供应链，直到远远的建筑产品制造商、加工商和供应商。最终项目对参与创作的人员或最终对客户的价值，并没有反映在实现它的经济交易中。随着人工智能改变了项目建筑师的能力、义务和结果，经济主张将如何随之演变？\n\
  \n### 经典模型\n\n正如第一次工业革命期间理解的那样，技术破坏了就业模式和薪酬。机械化农机取代了耕者和牛，工业织布机让手织者失业。这是 20 世纪中期奥地利经济学家约瑟夫·熊彼特（Joseph\
  \ Schumpeter）定义的“创造性破坏”，即新的经济系统（通常由新技术催化）摧毁并取代其前者，从而提高了所有人的经济表现。^(1) 尽管随着推销新技术的竞争者的加入这些改进可能是暂时的，但创造性破坏的概念可以与丹尼尔·苏斯金德（Daniel\
  \ Susskind）描述的所谓“经典就业模型”相结合，在该模型中，“新技术`不可能`让熟练或非熟练工人变得更糟；技术进步总是提高每个人的工资，尽管在某些时候有些人受益更大”。^(2)\n\
  \n随着建筑手段和方法日益工业化，拉贝内克所谓的建筑专业能力衰落可能会加速，进一步拉大意图与执行之间的差距。这种可能性加强了这样一种论点：AI 的工具——这些工具可以显著增强建筑师对建筑流程、程序和信息要求的理解，并允许这种洞察力指导并支持设计——可以被部署到交付系统中，以增强或消除建筑师。\n\
  \n如果人工智能是建筑实践中创造性破坏的催化剂，那么可以得出设计工作将被其假设的能力所消除的结论。然而，经典经济模型认为，这些工作更多地被支持和支持新技术所需的新工作所取代。因此，你可能失去了在建筑师事务所从事分区分析、规范分析和规划研究的工作，但你（或其他人）无疑会被许多创建此类任务软件的\
  \ AI 公司之一聘用。^(3)\n\n\n\n\n实践中两个近期的技术转型证明了这种困境。随着 `Auto CAD^©` 等计算机辅助绘图工具在 20 世纪\
  \ 90 年代初开始流行，硬件和软件的资本投入是巨大的。4。为了抵消这些成本，公司通常会向客户收取“CAD 服务”的小小时费，这被视为一种类似于差旅或蓝图绘制的项目费用。然而，随着时间的推移，客户们看穿了这种做法并拒绝支付这些费用，认为计算机的精确性和效率带来的收益属于建筑师，而不是他们自己。当然，这种观点并没有反映出\
  \ CAD 生成的交付物更高的准确性或一致性，也没有反映出他们能够创造出更复杂的的设计解决方案，而且建筑师们（再次）未能将服务质量的提高转化为费用的增加，而费用持续面临着“低价优先”竞争的压力。\n\
  \n由 BIM 带来的第二波技术浪带来了类似的后果（尽管在结构上有所不同），至少在美国是如此。图 2.1.2\n\n2.1.1: CESAR PELLI & ASSOCIATES\
  \ 办公室内岗位上开心的 CAD 操作员（现为 PELLI CLARKE PELLI ARCHITECTS），2000 年\n\n![2.1.2: COMPARING\
  \ REVENUE, BIM ADOPTION AND EMPLOYMENT IN TWO RECENT YEARS5](img/fig00042.jpg)\n\
  \n2.1.2: 近两年收入、BIM 采用率和就业对比 5\n\n数据似乎表明，这些建筑师通过使用新技术（推测如此），通过用更少的人完成相同的工作量，将其生产能力提高了\
  \ 10% 以上。从业者的轶事数据表明，虽然危机后工作量稳步增长，但费用倍数一直处于低位，这表明这些数字可能无法完全反映 BIM 技术带来的生产率提高。在图 2.1.3\
  \ 中对利润、BIM 采用率和生产率指标（每位员工净费用收入）进行更仔细的分析表明，生产率随着 BIM 采用率的提高而加速，但遗憾的是，盈利能力与此没有关联。这是一个确定的错失的机会。\n\
  \n![2.1.3: PRODUCTIVITY, PROFITABILITY AND BIM ADOPTION6](img/fig00043.jpg)\n\n\
  2.1.3: 生产率、盈利能力和 BIM 采用率 6\n\n因此，这里有一个案例：新技术（BIM）带来了新的能力和效率，但该行业似乎并没有在任何实质性的经济方式上直接受益。如果\
  \ AI 具有类似的影响，本质上收缩了建筑师服务的商品化价值，可能会导致一个极度衰弱的行业。然而，至少有三种策略——自动化、分析和预测——由于新兴 AI 的技术潜力成为可能，可以帮助我们避免这种命运。\n\
  \n### 重新定义生产率\n\n上述分析是根据技术采用（工具的使用）与产生特定费用额所需的员工职位数量之间的相关性，作为对建筑生产率假定改进的一种虚构指标。目前还没有用于衡量此类生产率的通用认可标准，这既是由于设计过程的棘手本质，也是由于研究人员（特别是专业协会内部的研究人员）对这类问题缺乏普遍关注。7\
  \ 在我的职业实践中，我以不同的方式提出这个问题：如果你是这个事务的经理，比，这需要多长时间？如果设计是一个“棘手问题”的过程，那么过程本身的“棘手”性质使得很难给出准确回答。因此，任何针对生产力的智能策略都应该采取不同的方法，从三个维度入手——自动化、分析和预测。\n\
  \n#### 自动化\n随着 `Auto CAD^©` 等计算机辅助绘图工具在 20 世纪 90 年代初开始流行，硬件和软件的资本投入是巨大的。为了抵消这些成本，公司通常会向客户收取“CAD\
  \ 服务”的小小时费，这被视为一种类似于差旅或蓝图绘制的项目费用。\n\n由 BIM 带来的第二波技术浪带来了类似的后果（尽管在结构上有所不同），至少在美国是如此。图\
  \ 2.1.2 中所定义。\n\n#### 分析\n数据似乎表明，这些建筑师通过使用新技术（推测如此），通过用更少的人完成相同的工作量，将其生产能力提高了 10%\
  \ 以上。从业者的轶事数据表明，虽然危机后工作量稳步增长，但费用倍数一直处于低位，这表明这些数字可能无法完全反映 BIM 技术带来的生产率提高。在图 2.1.3\
  \ 中对利润、BIM 采用率和生产率指标（每位员工净费用收入）进行更仔细的分析表明，生产率随着 BIM 采用率的提高而加速，但遗憾的是，盈利能力与此没有关联。这是一个确定的错失的机会。\n\
  \n`分析` 正在创建更复杂的手段来衡量和理解决策的结果。\n\n#### 预测\n`预测` 正在结合自动化和分析的能力，以预测最终结果。\n\n\n\n\n\n\
  在这一提议系统的终极表现中（即我们图中的“第三部分”），系统已经对建筑内安全条件的综合特征汇聚了足够稳健的理解，使其能够有限但不断扩展地，根据其建筑师大师提供的初步模型生成一系列安全解决方案。如果有许多这样的建筑师在培训这样一个能力不断增强的系统，它将随着时间的推移而“学习”并优化答案。\n\
  \n此处提出的系统具有以下几个显著特征：\n\n* » 它正在处理一个棘手的、具有技术挑战性且结果可衡量的离散问题。\n* » 它正在解决的问题并不涉及建筑师的设计能力。\n\
  * » 如果它运行良好，它将为建筑师节省时间、精力和脑力，从理论上讲，建筑师可以将产生的工作周期转化为利润（通过简单地将其`cashing them them`），或者将其应用于改进设计本身的“棘手”特征。无论何种方式，这位建筑师都将她新的\
  \ AI 赋能设计助手的能力转化为价值，无论是经济价值或其他价值^(8)\n\n### 超越生产力与性能\n\n一套足够有效的 AI 工具集，兼顾方案选择与准确预测能力，将建筑师的价值主张带入了一个全新的领域，将报酬与所卖时间的价值完全解耦，并允许设计师根据其建筑的最终性能获得报酬。这是一种微妙但具有丰厚回报的策略，在这种策略下，设计服务不再是交付链中的商品化交易，而是与项目行为紧密相关。由此产生的承诺不应受限于美感、体验或美学问题，而应侧重于计算机通过长期训练能够准确预测的各类技术行为。\n\
  \n尽管不考虑生产力和流程策略，在日益依赖 AI 的世界中，另一个即时价值机会是该过程本身的燃料——数据，有时被称为“新石油””。^(9) 建筑业因缺乏数据标准、存储库或参与者之间的共享访问手段而臭名昭著。然而，存在一种具有启发性的数据层次，这些数据将在建筑企业自身的各个维度积累，并在图\
  \ 2.1.5 中以图形描述。\n\n对我们而言，这个宇宙的中心是建筑师事务所内部收集的数据，如果数量足够，可能对事务所提高其 AI 系统的能力有用。然而，由于此类系统需要海量数据，更有可能是建筑数据本身会在该行业内部被收集。此外，机器学习平台的训练和参考数据可以在项目层面进行聚合，例如按建筑类型，甚至跨越整个从设计到建设的市场。最终，所有此类数据都将存在于整个建筑业的背景下，包括设计、施工、采购和运营信息，最终可在所有实施\
  \ AI 的参与者之间进行引用。\n\n![2.1.5: AECO 中具有交换价值的数据领域](img/fig00045.jpg)\n\n2.1.5:AECO\
  \ 中具有交换价值的数据领域\n\n这种提议的数据储备具有巨大的经济价值，既作为洞察的来源，也作为就业的来源。训练 AI 系统需要连贯、一致且“干净”的数据，有人认为，符合数据标准所需的精力与构建\
  \ AI 软件本身一样多，甚至更多^(10)。正如“规范模型”所示，策划和管理这些数据可能是建筑师就业的来源，新的角色将从产生的创造性破坏中涌现。\n\n然而，这些数据不应简单地赠送给行业，因为它具有巨大的内在价值，也存在潜在的误用风险。创建一个由独立的非营利第三方调解和管理的数据信托，可以为未来可能产生的海量数字建筑信息创建一个必要的平台，成为能力\
  \ AI 系统的饲料^(11)\n\n### 替代经济模型\n\n如果苏斯金德（Susskind）是正确的，未来十年将看到一系列建筑任务被 AI 系统增强，并在许多情况下被取代。是否会导致整个工作被取代仍是一个争论的话题。精通象棋或围棋等游戏——具有非常具体的规则、先例和高度受限的背景——对于管理任何胜任建筑师所具备各种任务、责任和合成过程来说，并不是先决条件。可能总体来看，实践的生产和分析功能将在某种程度上被自主计算取代，以至于需要更少的建筑师来设计世界环境。然而，或许从平庸的琐事中解放出来，设计师的力量将足够增强，以至于建筑师和建筑的影响力和重要性将通过技术而非被技术削弱而扩大。在技术创新与流程改进的交叉点进行仔细且有目标的规划，是使这种结果成为现实唯一途径。\n\
  \n## 2.2 法律、政策与风险\n\n\n> \\>> 建筑师传统上被要求遵循普通法的“合理注意”标准，这基于他们在特定背景下行使良好判断的责任。随着这些责任随着更智能的技术而演变，法律标准、针对建筑的公共政策以及建筑师的表现将如何相应变化？\
  \ <<\n\n在我们等待智能机器浪潮来改变建筑行业时，AI/ML 技术已广泛用于设定保险费率、评估放射影像、确定贷款和其他政府福利的资格，甚至通过人脸识别捕捉嫌疑罪犯。鉴于这些算法的不可知性（它们通过数据池“自我学习”以生成结果，例如数十万保险索赔，或从互联网上抓取的数潜在罪犯肖像），无法解析它们做出决策的底层逻辑。糟糕的是，这种逻辑对于部署它的专业人员来说也难以理解。\n\
  \n律师米歇尔·吉尔曼（Michele Gilman）代表在不透明的美国医疗系统中争取权利的贫困患者，这套官僚体系现在由于 AI 分配资源而变得更加不可渗透。这在马里兰州巴尔的摩最近的一个案件中得到了体现，正如麻理工科技评论（MIT\
  \ Technology Review）最近的一篇文章所描述：\n\n> * » 直到他们站在法庭参加听证会时，代表政府的证人才才透露政府刚刚采用了一种新算法。该证人是一名护士，她无法对此做出任何解释。“当然不——他们是从架上买的，”吉尔曼说，“至少她是个护士，而不是计算机科学家。她无法回答其中包含哪些因素。它是如何权重的？你们想要的结果是什么？于是，我带着我的学生律师在我的诊所里和我在一起，感觉就像是：‘噢，我要交叉质询一个算法吗？’”**¹**«\n\
  \n这个小故事生动地捕捉了专业人士工作自动化时，监管机构、公众、法院、建筑师及其客户所面临的一系列挑战：机器决策产生的影响由谁或什么负责？这些决策是否能被充分理解，以便将公众福祉托付给它们照顾？\n\
  \n\n\n\n英国和美国共同拥有普通法传统，该传统确立了建筑师的胜任标准（强调部分）：\n\n> >> 建筑师/顾问应具备与在规模、性质和复杂性类似的项目中提供此类服务的经验建筑师/顾问所预期的合理技能、谨慎心和勤勉。（RIBA\
  \ 标准专业服务合同 2018：建筑服务） *²*\n\n> 建筑师履行其服务时应与在相同或相似地区、在相同或相似情况下执业的建筑师通常提供的专业技能和谨慎心保持一致。建筑师应在符合此类专业技能、谨慎心以及项目有序进展的情况下尽快提供其服务。（AIA\
  \ 文档 B101-2017：业主与建筑师之间的标准协议格式） *³*\n\n在任何情况下，衡量建筑师表现的标准是其表现与相同情况下其他胜任执业人员的对比。这一标准并未以任何其他形式通过法律界定，而是在法庭上通过专家证人的证词确定的，这些专家证人会对正确的专业行为和对适当先例的应用给出陈述。\n\
  \n正如第 1.3 节所示，建筑师与公众之间的关系本质上是信任的交换：建筑师被授权对公众的健康、安全和福祉做出重要决策，并因此享有这种专业地位的特殊特权；可能的影响力、自主权报酬。作为交换，他们必须对自己的行为承担个人责任，而不能像公司那样委托责任，因为在公司中是由公司而非个人对错误的决策负责。\n\
  \n公共政策规定，设计专业人士参与建筑项目，是为了确保建筑环境中的公众福祉得到保护，并且至少目前，有一个负责的人被追责。美国和英国的要求之间略有不同：在英国，任何涉及一个以上建筑承包商的项目必须指定一名“首席设计师”^(4，而在大多数美国司法管辖区，持证建筑师必须对任何面积大于约\
  \ 275 平方米的人居建筑进行设计.^(5)\n\n在履行职责时，建筑师承担了两类风险：\n\n1. 业务风险：服务义务可能比合同规定的资源更多，特别是费用方面。\n\
  2. 专业责任：判断错误可能导致违反注意义务的专业疏忽的指控。\n\n建筑领域中机器智能的业务风险更具生存性，这些将在本章的后后部分进行讨论。更具直接、实务意义的问题是专业责任、注意义务，以及机器在支持（增强）或替代（自动化）人类建筑师方面做出复杂决策所产生的影响。\n\
  \n### 技术与技术责任\n\n尽管速度被公认为缓慢，但今天设计和施工供应链的很大范围内正在通过一系列程序、自动化和数据管理工具实现数字化。在建筑领域，`BIM`\
  \ 是此类工具中最具代表性的一个，^(6)，但这种软件在很大程度上属于自动化而非自主性的范畴。虽然其功能的某些方面是完全自主的（例如进度表和视图的生成），但 `BIM`\
  \ 依赖于与设计师的细微交互来实例化设计数据，且对这种交互结果的责任归属是明确的：使用该工具的建筑师对其输出负责。这符合 `ARB`^(7) 和 `NCARB`^(8)\
  \ 确立的责任控制概念。\n\n即使在负责的设计师依赖技术进行大部分技术分析的情况下，也不能假设权威已授予软件或其生产者。这种关系的一个生动例子在相关的结构工程学科中，像\
  \ `Tekla Structures` 这样的软件多年来一直用于载荷的常规计算和结构细节的生成。对这种技术的反复使用（以及专业验证）使工程师依赖它来产生建筑赖以立足的计算结果，但无论计算机输出如何，记录工程师仍对该工作承担个人责任。\n\
  \n像 `BIM` 这样的表示工具或像结构工程软件这样的分析工具，与其潜在的 AI 继任者相比有两个重要区别：\n\n1. 给此类软件的一组给定输入可以可靠地产生一组结果，在两者之间的关系中建立了可预测性和可靠性。\n\
  2. 如果必要，底层软件代码的创建者可以精确地解释特定输入产生特定输出的基础逻辑，潜在的异常至少在理论上是可以重复的，并在时进行诊断和纠正。\n\n然而，未来的基于机器学习的工具既不具备这些令人安心的特征。由于其底层代码随着接触更多数据而不断演变，算法可能会根据相同的约束条件、参数或输入在不同时间做出不同的选择。而且由于深度学习系统尤其以晦涩而闻名——因为它们构建了自己的内部逻辑——将无法判断为什么做出某个特定的决策。\n\
  \n当然，随着建筑师经验的增加，她也可能对完全相同的情况做出不同的决策，并产生不同的结果。区别在于，如果她犯了错误，我们知道该由谁负责。但软件的情况并非如此。\n\
  \n### 算法的责任\n\n事实上，情况恰恰相反。在被允许访问任何商业软件之前，你被要求承认该软件的“最终用户许可协议”，即 `EULA`。`EULA` 用晦涩的语言解释了你对所许可软件具体可以做什么、不能做什么，以及可以期待什么.^(9)\n\
  \n我的前雇主 `Autodesk` 在全球拥有数百万用户，包括许多建筑师、工程师和承包商。在可能让你们因无聊而翻页或完全放弃本章的风险下，我在下文中详细引用了标准\
  \ `Autodesk` `EULA` 中的两段相关但经过删减的段落，并添加了强调（粗体）。虽然读起来很痛苦，但它们具有启发性：\n\n\n\n\n\n> X5.2\
  \ 免责声明。除第 5.1 节（有限责任保证）中提供的明示有限保证外，在适用法律允许的最大范围内，AUTODESK 及其供应商不提供、且被许可人不接受任何形式的（无论是明示还是内示的）保证、陈述或条件（包括但不限于任何关于销售性、特定用途适用性或不侵权的任何内示保证，或根据法律、交易惯例或贸易惯例暗示的其他保证），这些涉及任何\
  \ AUTODESK 材料、关系计划或服务（根据关系计划或或其他方式）……AUTODESK 不保证：……许可材料或服务的运行或输出将是不中断的、无错误的、安全的、准确的、可靠的或完整的，无论是否处于关系计划下或是否获得\
  \ AUTODESK 或任何第三方的支持……\n\n> X6.1 功能限制。许可材料和服务……是旨在仅供受过培训的专业人士使用的商业专业工具。特别是在商业专业用途的情况下，许可材料和服务的不能作为被许可人专业判断或独立测试的替代。许可材料和服务的目的仅协助许可人进行其设计、分析、模拟、估算、测试和/或其他活动，而不能替代许可人自身的独立设计、分析、模拟、估算、测试和/或其他活动，包括关于产品压力、安全和实用性的活动。\n\
  \n为了完全确保用户理解本免责声明的重要性，该声明以全大写字母打印，而“功能限制”章节则使用大小写混合。如果在这里得得足够清楚，那么终端用户在使用本软件时同意了两个重要的概念。首先，你完全自担风险使用该软件，公司对其用途的适用性、准确性或其他输出不承担任何责任。鉴于软件订阅的成本，这对于被许可人来说往往难以接受。\n\
  \n其次，仿佛这还不够，`EULA` 规定软件应由受过培训的专业人士使用，他们据称理解该软件的目的和功能。它进一步解释说，此类专业人士对该工具的使用并不能替代专业判断本身。你可能拥有一些强大的数字仪器可用，但关怀责任仍然存在——你仍需承担责任。请确保你的订阅处于有效状态。\n\
  \n为了对我的前雇主（以及他们的供应商兄弟们）公平，这种合同交易是有其逻辑的。虽然负责的软件公司在发布前会对其产品进行广泛测试，但根本无法预料软件在使用过程中可能需要适应的每种用户交互和设计条件的组合。事实上，在我为一家建筑事务所谈判合期间，当客户要求图纸的数字版本时，我使用了类似的“用途适用性”语言，因为我不知道他们可能会用这些数据做什么，以及他们可能会如何试图让我的公司对其不受控的使用负责。我还要求他们依赖相同图纸的纸质版本。目前没有什么可行的方法可以预测或管理在野外不受限制的数据所产生的责任。\n\
  \n挑战当然是，当软件作为机器学习算法不断演进时，包含用户输入和软件输出的数据交互的复杂性其复杂程度高出一个数量级。历史表明，软件供应商将作为回应，在他们的下一代工具中进一步远离责任。\n\
  \n### 执行失败\n\n建筑行业中的失败随处可见，从更典型的进度延误和预算超支，到罕见但具有灾难性的事故，如伦敦西部的格林费尔塔火灾。在这些极端情况之间，存在建筑在技术、环境、社会和背景方面保持恰当的责任。无疑，技术可以在帮助建筑专业人士——特别是建筑师等首席设计师——在取得此类成果方面发挥重要作用。对于这次特定的探索而言，问题在于，AI\
  \ 驱动工具在多大程度上增加或减少了管理项目执行产生风险的责任。\n\n这些风险在图 2.2.1 中概述。基于图 1.6.5，该图描述了当 AI 被用来协助建筑师执行其四个基本角色时的失败风险：\n\
  \n![2.2.1: ROLES AMD RISK](img/fig0046.jpg)\n\n[2.2.1:] 角色及其风险\n\n\n\n\n\n对于我们日益依赖的技术的开发、部署和效能，公共政策必须尽可能跟上机器智能飞速发展的步伐。正如政府对医疗器械和药物、空中交通和飞机安全，以及公共健康、安全和福利的各个方面建立、控制和执行法规一样，它也必须支持为建筑行业所依赖的系统和算法创建标准和认证协议，包括可能作为相关信息存储库的数据信任（data\
  \ trusts）。正如美国保险商实验室（Underwriter Laboratories）在法律上负责认证电气设备的安全性一样，也应为数字化赋能的设计和建筑建立类似的结构。\n\
  \n### 业务风险及其他\n\n关于设计专业领域中机器智能业务风险的最后一点说明，在本文的其它地方曾提到过，特别是第 1.5 节。\n\n短期内，某些公司可能会通过早期采用\
  \ AI 建立一种可行但短暂的竞争优势，通过能力或效率使其服务脱颖而出。随着更多公司效仿其后，这种优势将会消失。\n\n然而，从长远来看，建筑师可能会像其他知识工作者一样，面临认知自动化带来的颠覆和取代的相同问题，^(15)，尽管上面的论点表明我们的毁灭时间表可能会减轻。然而，通过利用\
  \ AI 技术的能力增加我们服务的价值——隐含地增加建筑环境本身的价值——并让社会更多地依赖建筑师以及协助他们的机器（按这一顺序），我们的消亡可能在很大程度上被消除。\n\
  \n## 2.3 对专业人才的需求\n\n\n> >> 如果机器可以取代知识工作者，建筑行业或广义的社会是否真的需要建筑师？有一项理论认为，我们作为建筑师的大部分工作——毕竟我们声称设计了世界上极少数的建筑——可以很容易被自动化。也许建筑专业知识可以通过智能机器更广泛地分布，而不是通过建筑师更广泛的影响范围和机构？或者，这些机器及其日益强大的能力可以被视为真正提升建筑师的工具？<<\n\
  \n当英国健康安全执行局（HSE）制定了要求建筑师参与的标准时，它承认了工作在三个不同阶段的体现。在 2015 年之前，当设计、施工和管理（`CDM`）法规生效时，这些被认为是理想的但并非必要的。这与美国形成了鲜明对比，在美国，这些阶段是由建筑师定义的，尽管在建筑生命周期中是如此的：\n\
  \n-   规划、管理和协调\n-   帮助并建议\n-   消除风险\n-   确保沟通和协作\n-   在施工阶段提供相关信息\n\n\n\n\n\n设计与施工不同，它本质上是启蒙时代关于人类如何制造事物的思想。莱昂·巴西·阿尔伯蒂在\
  \ 1450 年左右对建筑进行了定义，他写道，建筑应该“在脑海中构思，由线条和角度组成，并在博学的心智和想象力中完善”(5)，然后由建造者不加偏差地执行，建造者的工作是将设计图纸转化为建筑的现实。(6)\
  \ 尽管有人认为，建筑长期以来依赖从维特鲁威秩序到现成的商店橱窗系统等结构化、形式化的系统(7)，这些系统使得 AI 易于攻破解，但当今建筑师所承担的想象力义务（特别是在工作定义的超级阶段）已经超出了算法的系统化输出能力。其中存在太多的不确定性、对判断和权衡的需求，以及在各种规模上解决棘手问题的需求。\n\
  \n![](img/fig00048.jpg)\n\n如今的 AI/ML 系统凭借这些系统可以获得的海量数据，能够看到模式（特别是人类无法洞察的模式），但它们仅在具有可以遵循的特定计算模板（如象棋或围棋的规则）时具有投影性。它们预测未来状态（例如建筑设计的未来）的能力，取决于过去的经验（由其他项目产生的数据定义）以及它们被程序设定为遵循的任何规则集。当今系统完全缺乏反事实推理的能力或理解因果关系（为什么某事发生或没有发生）与相关性（某事可能发生是因为从统计学上说，它在以前的情况下发生过）的区别。讽刺的是，这一观点由计算机科学家朱迪亚·珀尔（Judea\
  \ Pearl）表达得最有说，他发明了名为贝叶斯网络的统计理论，而当今依赖相关性的机器学习神经网络系统正是基于此理论。(8)\n\n珀尔坚信，除非机器能够进行因果推理并爬上他所说的“因果阶梯”（参见图\
  \ 2.3.2），否则真正的智能机器是不可能的。这把阶梯有三级：\n\n关联（理解是观察数据的函数）；干预（可以根据对未来影响的投影采取行动）；以及反事实（其理解导致了不仅基于行动，还基于对未来的反事实断言的构想）。如今的系统稳固地停留在最底部的一级。\n\
  \n这把阶梯是前文提到的罗杰·申克（Roger Schank）理论的复杂继任者。申克认为，任何智能机器的真正测试是推性推理的能力——这是对珀尔关于“干预”和“反事实推理”断言的另一种解读。他认为推理逻辑是人类语言和认知的核心。如果机器能够通过“理解”蕴含逻辑来得出结论，那么可以说它正在像人类一样推理。遗憾的是，这一理论受到我们在\
  \ 20 世纪 70 年代编写的粗糙机器以及显式编码所有产生的认知逻辑的需求的严重限制。申克的理论随着 20 世纪 80 年代的“AI 寒冬”而消声。\n\n\
  珀尔的阶梯不仅仅是 21 世纪 AI 系统的软件路线图，而是关于智能本质的另一个断言，这种断言将人类与其他物种区分开来：\n\n![2.3.2: 珀尔因果阶梯](img/fig0049.jpg)\n\
  \n2.3.2 珀尔因果阶梯\n\n> *人类拥有而其他物种所缺乏的是环境心理表征——一种他们可以随意操纵以规划和学习的表征（他们拥有）环境心理表征，通过想象对其进行扭曲，最后问“如果……会怎样？”*\n\
  \n珀尔猜测，历史上最重要的思想是“狂野建模”（如早期天体物理学）的结果，而仅仅将数据拟合场景的算法永远无法产生此类概念(10)。“想象假设的环境”，或者用更通俗的话说就是“项目定义”，是优秀建筑师的核心价值，并且要求机器不太可能实现的第三级才华。事实上，如果机器达到了第二级，我们可能会获得帮助处于阶梯顶端的建筑师的工具。\n\
  \n## **技术压缩**\n\n如果投影性将人类牢牢根于项目定义的责任，那么我们未来在技术定义中的参与就不那么明确了。一旦设计策略被定义——选择和协调系统、生成连贯且协调的文档、分析性能和成本、以及从设计师向建造者组织和传输信息——这些都是更适合自动化的格式协议。随着数字项目历史作为数据源可用，经验主义系统或达到珀尔“干预”级认知能力的系统，可能会承担更多技术集成的责任。数字自动化施工和制造系统可以消耗设计端\
  \ AI 对应系统系统性生成的数据。这一切表明，技术开发超级阶段比其前身项目定义阶段更容易被 AI 取代。\n\n然而，这里有一个重要的警告。健康和安全考量是健康、安全与福利部门（HSE）对首席设计师的首要要求，尽管\
  \ AI 工具可能会变得更加明智，引导项目朝着更安全的方向发展，但将这一责任完全分配给算法是毫无益处的的，因为算法远未能够做出决策并承担相应的义务。\n\n###\
  \ 健康、安全、福利与未来\n\n\n\n\n\n在 2020 年夏天，学术管理人员（如我）面临着在全球大疫情的背景下规划即将到来的学年的艰巨任务。在“手里只有锤子，看什么都像钉子”的原则下，我们建筑学院的团队开始寻找一种建筑策略来应对流行病学危机。我们知道，如果我们能将公共卫生参数（由公共卫生学院的同事建立）的空间需求转化为具体，我们就有机会保持学生们理所当然的教学形式。经过一整个假日的周密规划，我们制定出了一份包含\
  \ 50 页建筑和工程分析的运营计划——这让我们能够开放建筑，让我们的学生在工作室工作时可以使用我们的设施。每间教室都经过了评估和重新调整，以便那些能够面对面教学的教职员工可以授课。系统经过了评估和调整，制定并执行了安全的人数计划。学年结束时，我们的学生中几乎没有阳性病例。\n\
  \n21 世纪的建筑师面临着一系列类似的挑战，这些挑战使该行业必须远离对为富人创造美学物品的痴迷。清单首位是气候变化，紧随其后的是住房不公、建成环境（尤其是城市）中的结构性种族主义，甚至是建筑供应链中的现代奴隶问题。^(13)\n\
  \n总而言，这些挑战构成了对公众健康、安全和福利的新定义，这一理念催生了英国对首席设计师的需求，并作为美国职业执照的基础。将这些问题视为一组空间挑战，需要罗塞尔式的直觉、洞察和直觉等本质上属于人类的能力，这些能力是机器短期内无法提供的，更无法及时以应对这些问题所需的“野性建模策略”来攻克它们。正如丹尼特明智地指出的，AI\
  \ 生产者应该“制造工具，而不是同事”。^(14) 建筑师比以往任何时候都更需要，并且被这些工具所赋能。\n\n![2.3.3: 耶鲁建筑学院工作室空间规划（由\
  \ APICELLA + BUNTON ARCHITECTS 提供）](img/fig00050.jpg)\n\n### 2.3.3: 耶鲁建筑学院工作室空间规划（由\
  \ APICELLA + BUNTON ARCHITECTS 提供）\n\n![](img/fig00051.jpg)\n\n## 2.4 教育、认证与培训\n\
  \nDOI: 10.4324/9781003297192-12\n\n> >> 技术本身很少能扭转建筑教育或认证的弧度。新工具改变了建筑过程的本质，尽管非常缓慢，而职业学校、专业协会和执照委员会的知识基础设施反应甚至更为缓慢。智能机器的出现和对\
  \ 21 世纪设计的需求将要求这些机构重新思考建筑师的培养方式、认证他们的标准以及该行业自身的知识基础设施。 <<\n\n我到此为止一直在论证，虽然 AI 系统可能会增强并损害建筑师的工作，但它们不太可能取代我们设计师的身份，这种能力需要通用人工智能（AGI）的发展。数据科学家赫伯特·罗特布拉特（Herbert\
  \ Roitblat）将 AGI 与这种解决设计这一“棘手”问题的能力联系起来，认为“要拥有真正通用的智能，计算机需要具备定义和结构化自身问题的能力”，^(1)这是刻画才华设计师价值的极佳方式。\n\
  \n当然，建筑师在日常设计业务中面临着许多问题，这些问题结构良好，适合新兴的、经验主义的机器学习系统。随着建筑学和科学学科的发展，这种情况将变得日益真实。尽管应对气候变化、材料性能甚至建筑社会经济动态所需的依赖数据的分析工具，与`CAD`或`BIM`等表现性工具相比相去甚远，后者在学术界和办公室中被视为表达工具，它们的出现意味着建筑的两极——学术和专业机构必须规划产生的影响。\n\
  \n### 学习目标\n\n我们将首先触及培养建筑师的人与建立执照的人之间熟悉且充满争议的领域。人才提供者、认证者和实践中的人才消费者之间不稳定的和平源于一个基本矛盾：什么是胜任？粗略地总结竞争者的观点，教育者认为建筑最好被理解为一种文化，而且培训既困难又耗时还昂贵。与此同时，执照机构根据公众健康、安全和福利定义胜任，而市场相关的能力的专业协会推动了这一需求。\n\
  \n这些竞争性诉求对建筑师的要求手段包括：\n\n- 课程和认证限制（在学院内部）\n- 考试、经验和继续职业教育（由执照机构负责）\n- 入会资格和更多继续教育（由专业协会负责）\n\
  \n虽然标准和结构略有不同，这些安排在英国和美国大体相同，并汇总在图 2.4.1](#Ch010.xhtml#cap_lbl049)。2.4.1: 建筑师的知识需求](Images/fig00052.jpg)\n\
  \n#### 2.4.1: 建筑师的知识需求\n\n处于建筑师中间的竞争群体对胜任能力持有分歧的立场，并使用不同的工具来执行。新技术的出现至少到目前并没有怎么改变这些立场（如果说有的话），因为那些技术在很大程度上只是表现性目的的技术手段（软件）。然而，一旦计算机开始增强（或取代）胜任能力，比赛规则就需要改变。\n\
  \n### 工具术语\n\n`BIM`的出现证明了这种固执，并为即将来的 AI 时代提供了潜在借鉴。当该技术在 2010 年左右开始广泛采用时（当时软件已足够成熟，机器具备能力且英国\
  \ BIM 指令等推动因素成为关注焦点），人们广泛讨论了新的数据密集表现方式如何赋能建筑师和整个建筑行业。然而，早期的学术热忱很快消灭，尽管对软件和硬件投入了巨资，设计教学法仍基本没有。^(2)\
  \ 虽然大多数学校都在不情愿地教授`BIM`，但这是为了让学生做好实践工作的必要恶，而关于`BIM`对设计教学法可能影响的广泛研究在某些未开发的领域。^(3)\n\
  \n\n\n\n\n我认为，在设计课程中对全面引入 BIM 的冷淡，反映了教育者一种普遍的倾向，即将技术仅视为工具或仪器，尽管对于那些有此类倾向的人，已经有专门的研究生级\
  \ BIM 技术学位。由于 BIM 加入了一个日益拥挤的“表现性”工具领域（直接用于描绘设计），而且这些软件在很大程度上是为了服务于形式和图像的，因此这一结论是可以理解的。在我的机构，我们非常严谨地表示，我们教授的是原理和理论，而不是工具；课程中没有哪一部分（除了一项外）可以通过学习工具来获得学位学分的。\n\
  \n然而，这种保持距离的关系从长远来看对学生或整个专业行业都是无益的，而能够从事知识工作的机器的出现，是教育者和其他行业领袖现在应该面对的。随着智能机器从高效的描绘和数据管理（`CAD`、`BIM`）转向分析、洞察和评估（`AI/ML`），学术界必须面对两项并行的义务：\n\
  \n1. 在设计教学中引入一种不同的设计洞察来源。\n2. 为这些新智能工具所需的数据源和用途提供基础研究。\n\n这两个目标是互为加强的；通过在设计事业中确立智能数字能力的正确术语，学术界可以设定它们在市场上的使用方向。\n\
  \n在这里，区分“设计事物本身的算法”与“提供支持作用的算法”至关重要。认同早期关于“我们需要工具而非同事”的观点，当今建筑/机器学习交叉领域最有趣的研究之一，关注的是我们可以从算法生成的建筑平面图或房间布局中学习到什么，例如哈佛大学设计学院的\
  \ Stanislas Chaillou 的研究（见图 2.4.2）。\n\n这项工作的重要性在于，它可能会产生对建筑组织甚至是优化的洞察。它允许设计者从不同的角度看待问题，但它并不能解决这些问题本身。斯图特·罗塞尔（Stuart\
  \ Russell）认为，“……AI 研究侧重于更擅做决策的系统，但这等同于做出更好的决策”。因此，在一个对设计工作进行结构化、科学化和技术化质询与评估日益增加的世界里，这项研究可能不会产生最直接的。\n\
  \n最后，最近的毕业生往往会将新的技术和方法引入实践，而对技术的迟疑是由于保守的工作流程、长期的项目周期、实施成本和低利润率造成的。如果建筑领域的 AI 策略可以在学术界孵化，或许它们可以由技术上最熟练的新员工带入常规实践。\n\
  \n### 职业特权、认证与需求\n\n离开学术界后，我们未来的建筑师进入了专业领域及其不同的主宰者领域：注册机构、专业协会和认证机构，它们在认证能力方面都起着作用，因此也定义了专业建筑师必须具备的知识和技能。然而，当技术曾经减轻了建筑师履行某些琐碎义务的负担（例如图纸上一致的手写字体和线宽，这些对认证者来说并不重要），或者甚至\n\
  \n![2.4.2: 基于 AI 的平面图生成](img/fig00053.jpg)\n\n[2.4.2:] 基于 AI 的平面图生成\n\n在 `CAD` 图纸上正确协调标注的作用，其在分发和生成支持设计过程的知识方面的作用应该引起更仔细的关注。\n\
  \n在美国，国家建筑注册委员会委员会（National Council of Architectural Registration Boards）是一个由 54\
  \ 个美国司法管辖区的许可机构组成的组织，它负责制定建筑注册的认证标准。作为他们建立测试和经验标准协议的一部分，并影响建筑学院认证者的努力，他们准备了一份《建筑实践分析》，以确定执业建筑师和教育者认为近期毕业生和持业人员必须掌握的技能，无论是在学校还是其他地方。即使在\
  \ 2012 年（上一次分析完成的年份，见图 2.4.3），人们也达成强烈共识，技术技能对于被视为胜任是必要的，仅仅是为了实现各种表现性目的（如图纸）。\n\n\
  在我们等待 2020 年的分析时，可以推断 2032 年的分析将包含 `AI` 应用的知识和技能，整体能力总结将反映这样一个观点：建筑师的某些功能（特别是与建筑科学相关的）将由机器执行，并由建筑师管理和整合到项目过程中。\n\
  \n![2.4.3: NCARB 2012 年知识/技能实践分析](img/fig00054.jpg)\n\n[2.4.3:] NCARB 2012 年知识/技能实践分析\n\
  \n英国国家级 2 BIM 标准的教训可能具有启发，该标准规定了在 `BIM` 驱动下设计过程的信息输出和性能水平。它由一个行业联盟创建，并从仅限英国的模板（`PAS\
  \ 1192`）演变为国际标准（`ISO 19650`）。虽然英国的一些从业者可能避免从事 `BIM`，但任何政府资助的项目对于他们资助的大量行业项目都需要它，在\
  \ `BIM` 技术和数据策略被实例化胜任从业者应具备的专业关怀标准之前只是时间问题。\n\n\n\n\n\n这表明，认证机构在建立机器智能应用方面，其最重要的角色不应源于确定或驱动\
  \ AI 支持的建筑实践的特定独特需求，而应是与更大的行业合作者协作，由这些合作者优先考虑最重要的目标和这些新系统的用途。这种方法不仅是理想的，而且是必要的，因为与通过使用来生成数据的\
  \ `BIM` 工具不同，AI/ML 系统需要大型且经过良好策划的数据集进行训练和优化，而当这些数据跨越整个交付链贡献时，才最有用。认证机构所要求的培训义务不仅是对专业人士的要求，也是对机器学习系统的要求。\n\
  \n像 `RIBA` 或 `AIA` 这样的专业协会对会员资格的认证想法较为模糊，因为此类考虑主要设计用于确保成员在市场中具有公信力。持续专业发展（CPD）的要求仅要求执业建筑师定期接触广泛的技术和专业问题，并规定了通用类别（例如，在美国的“健康、安全与福利”）以及参加的小时。在接下来的十年里，随着建筑客户在业务或政府运营中依赖基于\
  \ AI 的流程，这些客户可能会对他们的建筑师提出同样的要求，而专业教育和 CPD 认证将无疑遵循客户群的需求。\n\n### 洞察的紧迫问题\n\n市场目前正建筑业施加碳和气候变化的压力，这一挑战为我们提供了一个很好的机会，去推测在机器智能时代建筑学术和专业平台可能会如何应对。想象以下场景：\n\
  \n2032 年，司法部对威敏斯特的一个新总部大楼发布了招标。该项目必须遵守最近更新的 `ISO 19650`（即所谓的“智能 3 级 BIM”指令），并反映负责任环境设计的最佳实践，包括确保项目将实现净零排放、产生至少\
  \ 500 个建筑就业机会，并在劳动力或材料实践中不含有任何现代奴隶的证据。\n\n建筑业委员会在 `RIBA`、`ARB` 以及包括剑桥、利物浦、曼彻斯特和建筑协会在内的大学联盟的参与下，认证了一套用于评估隐含碳和劳动力供应链的人工智能平台。这些系统是基于该联盟的研究，由\
  \ M4 走廊（所谓的“英国硅谷”）的几家公司建立，并使用 2026 年由 `基础设施和项目管理局` 创建并策划、由英国全球设计和建设行业提供数据的 `国家建筑数据信托`\
  \ 进行训练。\n\n`RFP`（招标书）规定，提交的建筑师必须拥有 `RIBA` 3 级结果机器数据分析认证，并能够部署 AI 平台评估提交方案在气候、经济和劳动力性能方面的合规性。团队必须必须至少两名在\
  \ `ARB` 最近批准的 `SPLC`（特殊专业执照认证）中气候变化建模和供应链管理评估领域注册的建筑师。来自利兹和利物浦的几位研究生候选人已参加并获得了这些特殊注册。\n\
  \n`SPLC` 项目是与健康安全执行局在 2029 年建立的“首席设计师”新定义共同创建的，该定义将环境和劳动力公平纳入了该设计的责任范围。许多公司一直在尝试使用两个\
  \ AI 平台：`smartTALLY`（见 *图 2.4.4）和 `buiidFRDM`（见 *图 2.4.5），它们评估 3 级 BIM 方案的隐含碳和强迫劳动，并收集有关设计决策和策略的信息，贡献给\
  \ `国家建筑数据信托`。`HSE` 进一步规定，大于 300 平方米的人类居住项目必须指定一名执业建筑师担任首席设计师，这导致国内一些建筑/设计经理的恐慌——因为他们没有获得过数据驱动设计方法的认证。\n\
  \n这种被认为是乐观的场景假定我们的行业以目前所未见的方式组织起来，以实现三个目标：\n\n1. 对关键社会挑战的战略性关注\n2. 为该关注重点服务的技术的智能化部署\n\
  3. 学术、专业和技术资源的整合，并共同朝着这些目标努力。\n\n在这种情况下，AI 技术不仅是一个可用的工具，更重要的是标准、关系和流程变化的催化剂，也是同步教育、认证以及随后的适用于\
  \ 21 世纪设计和建筑的技术专业培训的机会。\n\n![2.4.4: TALLY CARBON BIM 评估工具，用于从 REVIT 中的数字概念设计评估建筑材料的隐含碳](img/fig00055.jpg)\n\
  \n2.4.4: TALLY CARBON BIM 评估工具，用于从 REVIT 中的数字概念设计评估建筑材料的隐含碳\n\n![选项 1: 波纹瓦片外墙](img/fig00056.jpg)\n\
  \n选项 1：波纹瓦片外墙\n\n![选项 2: 半透明面板外墙（已选择）](img/fig00057.jpg)\n\n选项 2：半透明面板外墙（已选择）\n\n\
  ![](img/fig00058.jpg)\n\n按生命周期阶段划分，按 CSI 分部列出\n\n![2.4.5: FRDM，一种基于 AI 的工具，用于在制造供应链中寻找强迫劳动](img/fig00059.jpg)\n\
  \n2.4.5: FRDM，一种基于 AI 的工具，用于在制造供应链中寻找强迫劳动\n\n# 03 结果\n\nDOI: 10.4324/9781003297192-13\n\
  \n正如当今计算机加速的存储和处理能力赋予了机器智能，这些能力反过来又为设计带来了更精确、更具洞察力的协议的潜力，这表明计算机（以及，希望它们的人类主宰）可能变得不仅擅长预测未来状态，而且擅长预测其行为。\n\
  \n## 3.1 设计目标\n\nDOI: 10.4324/9781003297192-14\n\n建筑业中人工智能工具和“大数据”不可避免的增加，将挑战未来的建筑师去重新审视他们定义“设计意图”的义务的经典定义。在这一阶段，建筑师将他们想法的许多影响——对于施工以及最终的建筑运营——留给他人来解决和完善。AI\
  \ 工具可能会加速数据驱动证据的使用，以增强设计的精确性，让建筑师对项目交付的多个维度的性能有更深入的理解，并提高对结果预期。\n\n\n\n\n\n> *»\
  \ 设计师首先需要图纸和模型来探索、孕育和开发建筑构思……（这些）模型还应用于咨询专家并寻求他们的建议；随着修订、修正和新版本的积累，设计随着时间的推移而变化；整个项目必须经过反复检查和重新审查……只有当每个部分都经过如此彻底的检查，以至于任何进一步的、减少或改变只会导致变差时，才能获得最终确定的版本。*³*\
  \ *«*\n\n在卡波（Carpo）的解读中，我们发现了三个重要的建筑策略：\n\n1.  以模型和图纸的形式使用抽象，使理念铭记。\n2.  在完成设计时引入外部专业知识，以确保符合施工要求。\n\
  3.  通过连续的迭代进行设计，不断完善项目，直到其无法再被改进为止。(4)\n\n如今的建筑师使用着类似的方法，并得到了各种数字武器的助力，但当这些工具成为设计的代理人时，发生发生什么？\n\
  \n# AI 赋能的设计师\n\n让我们假设，到 2030 年，一位建筑师拥有一套 AI 赋能工具，并且建模平台在分辨率、精度和灵活性方面取得了重大进展，人们希望这些平台是今天\
  \ `BIM` 的逻辑继任者。虽然未来的某个时刻，在我所描述的“认知” AI 平台可能会产生概念性突破（这些平台可以对构成建筑的复杂相互作用进行推理），但让我们假设到\
  \ 2030 年，我们仅处于这类“无可争议地单方面成功”的(5) 平台的实用建筑版本阶段，例如今天的语言和游戏软件，如 `GPT-3` 或 `AlphaGo`。(6)\
  \ 此类系统将与设计建模/表现平台及其数据紧密结合，并接受来自其他信息源的，例如工程系统、来自 `LIDAR` 或 `GIS` 的环境真实数据采集、描述承包商流程和结果的施工管理来源，以及由传感器驱动的建筑管理控制系统控制的现有项目建筑运行数据。这些系统可能是半自主的、基于云的代理，在建筑师流程的后台运行，当建筑师需要某些见解或分析时出现。\n\
  \n虽然无法准确预测这套新的 AI 赋能工具将包含什么，但表 3.1.1 总结了一些推测性的建议，旨在勾勒自主的基于 AI 工具的潜在未来。\n\n值得注意的是，列表中（除了最后一项外）缺少负责为项目生成（任何规模）整个设计解决方案的系统。本书的核心论点是，此类系统在遥远的未来之前是不可用的——如果有的话。它们无法提供有用的见解，并对建筑师构成了不必要的生存威胁。世界上已经充斥着许多不合格或勉强合格的建筑；创建一个甚至能处理简单建筑的设计生成器，可能会对该行业带来意想不到且令人不快的后果。既然有如此多的机会，精力最好放在其他地方——即增强设计过程以提高设计和建筑的性能和结果。(7)\n\
  \n# 设计的新三个维度\n\n这些示例表明，建筑师的角色——表现、迭代和专业知识——将发生变革，正如阿尔伯蒂的(8) 决策那样，至少在部分需要证据来证明。今天许多客户依赖\
  \ AI 数据系统来运营其企业，建筑师被要求也这样做，以证明构成设计的决策。数字形式信息的广泛可用性结合 AI 系统的预测能力，将使设计决策的角色更加明显。\n\
  \n3.1.1 未来的基于 AI 的工具\n\n| 基于 AI 工具 | 功能 | 训练数据 |\n| :--- | :--- | :--- |\n| `分区与规划分析器`\
  \ | 评估与特定规划和分区的符合情况 | 司法辖区、其他项目案例 |\n| `建筑规范评估器` | 检查新兴方案的建筑安全性能 | 规范、当地实施、其他项目案例\
  \ |\n| `空间协调器` | 检查冲突问题的 3D 协调 | 当前设计、其他项目分析 |\n| `碳影响计算器` | 计算设计中的产生碳和隐含碳 | 能源和标准、其他项目记录\
  \ |\n| `手段与方法评估器` | 检查施工性/顺序以及施工给定部件的必要程序 | 模拟、产品制造商 |\n| `产品推荐与规范生成器` | 检查特征并推荐可能的材料和产品，协调必要的规范\
  \ | 过去项目记录、材料和规范数据库 |\n| `成本监控` | 施工和运营成本 | 供应商和过去项目 |\n| `供应链可用性探测` | 与产品推荐器配合。评估产品选择的供应链限制，包括可用性、成本和强制劳动问题\
  \ | 制造和供应链运输及运单、认证数据、当地条件的劳动标准输入、过去项目模型 |\n| `草图问题求解器` | 根据设计师设置的参数，为特定的设计问题生成方案，并提供性能衡量和适用性\
  \ | 设计模型或现有建筑中的类似情况案例 |\n\n\n\n\n像布鲁内莱斯基那样的建造大师，作为所有设计与施工的核心存储库以及每一个决策的制定者，正让位给建筑师——即完整、不可更改且清晰描绘的想法生成者。\n\
  \n愿能如此。启蒙运动的理想与现代建筑的现实之间存在着深刻的错位：在现实中，设计文件经常是争议的来源，建筑师为了更好的控制名义沦为承包商的次级顾问，而建造者不仅对设计有意见，而且拥有控制权。然而，AI\
  \ 的到来为建筑师提供了一个有趣的机会，可以弥补这一差距，并以高保真度实现设计理念，甚至对设计施工关系拥有更大的控制。\n\n如果建筑师能够从专注于特定任务的\
  \ AI 系统中受益，那么我们在建筑领域的同事也可能看到类似的进展，AI 驱动的系统将通过机器人和数字化驱动机制的工业化方法在现场`自动化施工的某些方面`。例如，一个棋艺完美的\
  \ AI 可能被控制安装幕墙的机器人。通过这样做，建筑师常被指责缺乏的程序化知识将以数字形式实例化，并作为其设计成效的评估/执行衡量标准供其使用。^(11)在与\
  \ AI 共享“思维和想象力”的同时，建筑师可以根据对如何建造的大量新获取的理解来完善设计。\n\n最后，部署证据结合 AI 系统的预测能力将使`性能`成为现代设计过程及其交付物的深远目标。今天建筑师的操作模式可以被描述为“隐性”性能：我们的工作流程经过组织和校准，以产生物理实体（图纸），从而引导出一个物体（建筑），并希望在完成后能实现某些目标，而这些目标很少被明确定义为可衡量的目标或结果。设计过程隐含了预期：这些目标将实现、成本将满足、文件按时完成、材料规范并符合标准。同时，产生的建筑消耗资源并产生碳排放，需要定期的维护和人员配置，组织人和材料的流动，最重要的是为所有者的目标创造平台：学生学习、患者治愈、商品销售。它们对当地的环境、经济健康和社会织理做出贡献（或产生损害）。随着\
  \ AI 系统从源自建筑环境的数据中学习，并在这些特征优于在预测性 AI 系统中被建模的范围内，建筑师获得了“显式”设计项目以改进目标的能力，通过结果仿真从*先验*上证明此类结果是设计本身的结果。虽然最早的机会可能在技术上更具局限（如表\
  \ 3.1.1 所示），但更复杂的系统将建模并评估更大、更复杂的背景。\n\n这种预测能力可能是 AI 对设计过程最重要的意义。预计 AI 技术以及训练它所需的建筑行业数据，到\
  \ 2030 年将供应充足。根据对 AI 在业务中实施的最新分析，预测“获取你拥有的信息（通常称为‘数据’），并用它生成你所没有的信息”。^(12)“你没有的信息”可能是当今建筑业的格言。\n\
  \n## 告别阿尔伯蒂的设计协议\n\n阿尔伯蒂关于表现、迭代和知识实例化的设计协议并没有被前几波技术（甚至包括 BIM）发生剧性的变化。表现仍然集中于图纸的创建，虽然产生的许多信息现在是数字化的，但其生成手段——通过外部专家顾问的指导进行迭代完善——今天与约\
  \ 1450 年所断言的完全一致。第三波数字工具（即智能计算驱动的工具）将随之而来，但将从根本上打破这些传统。\n\n![3.1.2: AI 支持生成办公室布局的策略](img/fig00060.jpg)\n\
  \n### 3.1.2: AI 支持生成办公室布局的策略\n\nAI 的表现将扩展“模型”的定义，该定义曾指等比例物理实体（模型）、几何形状的数学仿真（`CAD`）或注入元数据的建筑组件仿真`BIM`）。AI\
  \ 对设计的评估将成为一种预测模型，证实通过更传统手段表示的设计决策，但同时也会扩展建筑师服务工具的范围。这些 AI 模型将用于验证，并作为进一步训练其他 AI\
  \ 的大型数据库的贡献。\n\n我曾合作的一位建筑师将当前的设计迭代过程比作螺旋楼。从正上方看，你似乎在绕圈子，但随着每一次循环，你都在缓慢向目标迈进。在今天的设计环境中，数字模型的固有灵活性和访问性加速了这些流程步骤，并通过被称为“生成式设计”的新兴策略得到了增强，即计算机脚本通过改变方案的特定特征来生成替代方案。如果得到适当限制——以避免像塞萨尔·佩利曾描述误用`CAD`那样导致“系统性生成无用的替代方案”——AI\
  \ 支持的生成式设计将设定自身的限制。它将根据之前批准方案的逻辑作为训练集提供指导，并对其自己的结果提供评估。设计探索仍需要人类做出决策来解决“棘手”问题，但这一过程将更加智能和系统。\n\
  \n连接表现、迭代和实例化的生成策略可能是未来 AI 支持的设计过程最重要的意义。今天的建模和分析工具只能周期性地优化设计挑战的有限参数——例如，调整遮阳板的尺寸以限制暴露，从而减小冷却系统的尺寸——但这绝不是建筑围护完整的策略。随着时间的推移，AI\
  \ 系统将能够管理多个变量，评估建筑师和工程师创建的表现，在实例化知识的同时，推荐符合设计目标的替代解决方案。随着设计师选择解决方案，这些系统将学习哪些组合策略是最好的，从而提高它们的性能以及它们的建筑师大师的性能。\n\
  \n\n\n\n\n考虑一个建筑师在项目中协调机械/电气间（MER）设计的情况。这个房间永远不会大到能满足那些将其填满复杂设备和连接的工程师们的需求，它必须与项目的其他部分进行\
  \ 3D 整合。她必须确保所有系统都能容纳，为设备维护留出足够的空间，并且建筑、结构、照明和灭火系统都不会干扰系统的位置和路径。一个在许多类似房间及其经常填充其中的组件上进行过训练的智能\
  \ AI，其功能不仅限于检查 MER 布局的碰撞（这是当今 BIM 的常见功能），还能识别潜在的运行问题、推荐潜在的配置，甚至为系统的如何进行排序和安装制定策略。对这些问题进行快速模拟和评估将加速这一过程，并增加成功的概率，随着\
  \ AI 系统“学习”到什么是最佳方案，方案将随时间的推移而改进。我们的建筑师可以利用出来的额外时间来解决立面比例的问题。\n\n20 世纪 80 年代早期的\
  \ AI 尝试试图创建“专家系统”，将人类的知识和见解记录在计算机代码中。无论是理论还是技术都无法完成这项任务。相比之下，在我们 AI 赋能的设计未来，如今几乎完全由人类顾问提供的专业知识将通过计算机可以提供的分析见解得到极大扩展。虽然本质上更具战略性的概念性决策最好由能够评估系统方法和大规模选择的人类专家来做出，但对于根据良好规则产生的特定输入产生的特定任务，可以为这些任务提供特定的输出。在上面的示例中，评估生命安全代码合规性的细节（以及随之而来的火喷淋或额定走廊的布置）可能由具有该专业知识的顾问提供。我们未来的设计师将向她的设计中应用\
  \ AI 叠加层，以获得非常相同的结果，但速度更快，并允许对方案进行进一步的迭代和实时解决。她的决策将由辅助 AI 归类，并指导后续工作。\n\n## 新目标，新输出\n\
  \nAI 引起的设计过程目标发生的潜在未来变化，其核心在于数据及其产生的影响。如今的建筑师使用数字工具创建数据，将其转换为图纸或规范等各种形式，并将其作为其设计决策的证据发布出来。当机器能够消费、创建和部署数据来协助这些决策时，它们创建的模型将延伸并与设计本身的描述符交织在一起。由此产生的能力可以使设计结果更加精确、透明和可预测。本节其余部分将探索如何通过这些实现这些能力，从而进一步赋能建筑师。\n\
  \n![3.1.3: 为现代医院在 BIM 中建模的机械基础设施](img/fig00061.jpg)\n\n3.1.3: 为现代医院在 BIM 中建模的机械基础设施\n\
  \n## 3.2 数据的创建、消费与策展\n\nDOI: 10.4324/9781003297192-15\n\n> \\>> 建筑业的数字化使数据更易于便携、传输，并且在某种程度上具有可替代性。AI\
  \ 系统需要此类大量数据，首先用于训练，然后用于执行。特定的项目由不同的参与者以各种格式、比例和分辨率水平产生数据，这些参与者对于分享或不分享数据有各种不同的动机。随着\
  \ AI 改变了建筑师对数字信息的需求和消费，这将是如何改变他们的职责和流程的？ <<\n\n1994 年，我以前雇主 Autodesk 组织了 AECO 行业的大约十家公司，以应对日益增长的关注。该公司日益无处不在的\
  \ CAD 平台 `AutoCAD^©` 正在通过其专有的文件格式 `.DWG` 成为建筑业的数据标准。与此同时，该公司正在建立一个第三方开发人员全球生态系统，在\
  \ `AutoCAD^©` 平台上创建额外的功能，而其他软件公司也正寻求在自己的系统中消费 `AutoCAD^© DWGs`。文件格式本身显然被 Autodesk\
  \ 热热地捍卫，因为他们的大部分知识产权都包含每个文件中。\n\n这 12 家公司（包括建筑师、机械设备制造商、工程师和至少一家房地产开发商）将他们的财团命名为“国际互操作性联盟”，并在\
  \ 1995 年向所有成员开放。（1）。它们的使命是实现在应用程序之间无缝移动数据，而无需翻译或需要重复 `DWG` 功能。BuildingSMART 在 2005\
  \ 年更品牌后，该全球联盟编写并分发了一种名为“行业基础类”（IFCs）的数据标准，试图创建一个公分母交换，可以在任何已编写用于生成或消费它的软件之间传输相关数据。过去，BuildingSMART\
  \ 的努力已从 CAD 数据（`DWG`）转向 BIM，(2)，创建了旨在让 BIM 更加开放的标准数据交换和库。\n\n尽管 BuildingSMART 付出了令人赞叹的全球努力，在建筑业实现互操作标准仍然是一项艰巨的任务。到\
  \ 20 世纪 90 年代后期，`DWG` 已成为设计和施工中数据交换的标准，这由两种不同的现实推动：行业正在转向数字工具（主要是 `AutoCAD^©`），但更重要的是，建筑师和工程师的信息交换媒介很大程度上仍然是图纸，而不是健健的数据。这使得通过\
  \ `IFC` 传输信息相对简单，使用几何的通用定义，并略带有关于该几何的元数据。鉴于今天数字工具的爆炸，问题要复杂得多，而且 AECO 行业尚未建立认可的非专有数据标准。（3)\n\
  \n### 更多软件，更多数据，更少协作\n\n转向 BIM 只是整个 AECO 不可避免的数字化部分之一。建筑是一项信息丰富的企业，建筑师等其他人不得不等到机器和网络足够强大以处理所需的数据。云计算、高速互连和功能强大的移动设备都推动了数字工具、格式、流程甚至硬件的真正爆炸。（4)\
  \ 建筑信息标准（模拟或其他其他）在不同国家之间差异巨大。这使得 BuildingSMART 的任务更具挑战性，尽管它们被重新品牌为“建成资产行业数字化工作方式充分效益”的推动者。（5)\n\
  \n然而，随着建筑师及其合作者开始使用更大的数字工具集合，事实证明，数据交换和关系不仅仅是技术标准的功能。建筑过程的每个组成部分都有自己的合同和风险模型、工具、数据预期、表示模式、内容和业务预期，并按照自己的节奏和条款进行数字化。\n\
  \n\n\n\n\n2004 年，美国国家标准与技术研究院（NIST）发布了一份报告，声称建筑资本项目行业因软件互操作性每年损失了高达 158 亿美元的成本。该报告引起了极大关注，并确实让人们对建筑用软件之间缺乏互操作性导致的流程低效表示关注。然而，它未能解决行业中深层的结构性问题——业务模式的不连续、供应链的碎片化、风险管理策略冲突以及项目交付中缺乏优化激励——这些问题困扰着建筑业，而且这些都是与数据协作的强大阻碍。\n\
  \n这种关于合作与集成的挑战在建筑行业的数据结构和使用中更为广泛，特别是对建筑师而言。为了谨慎确保不给施工带来过多的责任或风险，同时在使用有限的费用来产生信息，设计数据在发布时往往被紧紧锁住。其他受过良好训练的职业领域会仔细地生成、策划和消费关于其学科的知识：例如法例数据库、关于治疗和结果的医学研究，或药效数据。一位为客户研究法律先例的律师可以探索一个完整的、涵盖法学历史上每一个相关法律决定的交叉引用数据库（参见图\
  \ 1.3.3）。建筑师则无法获得这样的中心数据。向互操作性的迈进是对“和谐相处”的请求，但并不是分享任何玩具。\n\n![3.2.1: 20137 年想象的\
  \ BIM 互操作性未来](img/fig00062.jpg)\n\n### 3.2.1: 2013 年想象的 BIM 互操作性未来\n\n### 互操作数据的先决条件\n\
  \n基于机器学习的 AI 系统的出现，要求我们的行业不仅要分享玩具，还要建立一个可以在其中玩耍的新沙盒。这是建筑师和其他建筑企业其他参与者迈向并充分利用 AI\
  \ 力量的首要且最重要的前提条件。利用 AI 潜力的能力在于专业行业要与可能获益的行业伙伴紧密合作，并以负责任共享数据来实现目标。\n\n当然，问题在于其他外部因素，其中最主要的是共享数据的底层动机（或缺乏动机）。我们将在第\
  \ 3.5 章中讨论一些结构性的风险和回报问题，但为了讨论起见，该问题在图 3.2.2 中示意，该图代表了四个互不相关的假设建筑项目。虽然有一定的动力让你办公室生成的项目数据在项目领域内更自由地流动，但在这种有限用途之外，并没有结构或激励来组织或共享这些数据。\n\
  \n![3.2.2: 建筑行业潜在数据信的组件](img/fig00063.jpg)\n\n### 3.2.2: 建筑行业潜在数据信的组件\n\n图表的中心是一个解决此问题的建议，只有解决了这个问题，AI\
  \ 在建筑或相关的建筑学科中才有真正被采用或使用的机会：一个跨行业的数据信，它将成为全球建筑行业信息资源的托管人。数据信的概念在过去几年中演变，旨在解决信息一致性、隐私和受托责任问题，在这些情况下，个人贡献个人数据，而这些数据被第三方用于商业目的。数据信是一个独立的第三方，负责收集、管理、匿名化并提供对此类大规模数据集的访问：\n\
  \n> » 数据共享的典型用例包括金融服务中的欺诈检测、提高整个供应链的速度和可见性、改进产品开发和客户体验，以及结合遗传学、保险数据和患者数据以开发新的数字健康解决方案和洞察。事实上，研究显示所有行业中\
  \ 66%的公司愿意共享数据。尽管如此，共享敏感的公司数据（特别是个人客户数据）受到严格的监管限制，并容易产生重大的财务和声誉风险。\n\n虽然现在不太可能有\
  \ 66%的建筑师（或承包商）愿意共享数据，但访问一个经过适当归属化处理（脱敏）的全球项目数据中心仓库，其收益是巨大到无法错过的，因为它既是一个实用的参考工具，又是认真开展\
  \ AI 的必要信息基础设施。当然，必须克服欧洲数据共享标准带来的挑战。\n\n这样一个数据信必然是跨学科的，并包括来自设计师、建造者、分包商、产品制造商和供应商以及运营建筑所有者的信息；即构建资产的整个供应链。对于建筑师来说，“仅限建筑”的数据集边际效用有限，因为它们可能是稀疏且策划不一致的。如果我多年作为技术供应商的经验说明了什么，大多数建筑师对新的、颠覆性的技术持高度怀疑态度——并且不愿意付费——特别是与他们在建筑供应链中的同事（工程师、承包商、分包商）相比。建筑业务规模较小，利润率较低，且通常不愿意投资颠覆性技术，这在建立人工智能的必要基础时造成了经典的“鸡生蛋”蛋的困境。因此，跨行业合作对于数据汇编和\
  \ AI 平台都是必要的。除了 `Autodesk` 决定最初向 `Revit` 投资 1.33 亿美元，然后首先为建筑师开发该平台之外，在技术领域，很少有针对建筑师本身的新软件或平台进行大规模投资的记录。因此，虽然“投资于取代建筑师作为个人贡献者的\
  \ AI 可能太贵了”这种想法或许能带来短期的慰藉，但适用于整个行业的数据源和 AI 平台显然有益处，而且投资更有可能是为了应对更广泛的客户市场进行的。\n\n\
  ### 构建与使用可信赖的数据\n\n![3.2.3: 数据信项目数据流](img/fig00064.jpg)\n\n### 3.2.3: 数据信项目数据流\n\
  \n让我们假设，在行业灵感、政府支持和学术研究的共同作用下，在我们想象的 2030AI 时代，产生了一个全球建筑行业数据信。公司通过贡献数据获得报酬，作为交换，可以访问这些数据以及使用这些数据训练的\
  \ AI。我们进一步假设，数据信中有足够有用的数据，使其开始被广泛采用，并随着全球范围内每一个重大设计或建造的项目而增长。设计师、建造者、其供应链和建筑所有者都贡献其工作产生的数据。\n\
  \n\n\n\n项目团队创建的数据源（包括建模、分析以及建筑设计其他产物的数据）将会被贡献给数据信托（data trust）。假设其使用已变得广泛，我们可能会预期软件的某种标准化，但我怀疑，行业广泛的数字化将导致工具的持续爆炸，这将使标准化变得具有挑战性。更有可能的是，`AI`\
  \ 本身可能会提供手段，在将建筑师等人的项目数据提交到共同事业之前，对其进行标准化和规范化处理。\n\n训练一个 `AI` 来识别跨这些数据集的表示形式，例如\
  \ `BIM` 模型中的窗、采购订单或施工图纸（如果未来存在此类物品），是一个模式匹配问题——这正是机器学习系统所擅长的。人们可以想象图中所示的一个基于 `AI`\
  \ 的“交易层”，它将收集、翻译并标准化项目数据，将其转化为一致的关系和格式；对于监督学习来说，这将是一个极佳的机会，并结合 `BIM` 和其他不断演变的模型类型，可以催生下一代\
  \ `AI` 平台。如果这种能力能够演进，它还将改进个人建筑师使用的基于项目的共同数据环境（CDE），在这些数据在适当的时间点流入数据信托本身之前，创建出项目的集成表示。\n\
  \n因此，在这种构建下，建筑师通过三种方式访问和消费信息：\n\n1. 在`单个项目`层面，作为设计开发的结果。\n2. 从`数据信托`获取，用于参考以及部署\
  \ AI 辅助工具（例如之前描述的成本估计和分析工具）。\n3. 来自`外部数据源`，这些数据可以指导设计的开发，如项目背景的经济模型、天气数据或关于现场公用设施可用性的信息。\n\
  \n### 设计信誉\n\n当结构工程师开始依赖软件进行例行计算时，这些结果的可信度与其说取决于技术供应商的监管或承诺，不如说取决于工程师本人对这些系统的输出以及由于使用这些系统可能导致的任何错误负责。正如\
  \ `BIM` 现在已成为一种建筑师在关怀义务下被预期在项目使用的工具一样，`AI` 生成的结果将成为建筑师专业判断不可或缺的一部分。\n\n然而，至少在如今的\
  \ `AI` 系统中，构成神经网络的数据结构的复杂性太大，人类无法真正理解；这些系统使用海量数据集进行训练，并根据输出的有效性进行衡量，而不是产生输出的特定计算。撰写\
  \ `AI` 挑战文章的凯特·克劳福德（Kate Crawford）很好地描述了这一挑战：“在 `AI` 的情况下，没有单一可以打开的黑箱，没有需要暴露的秘密，而是许多交织的权力系统。因此，完全的透明是不可能的目标。”^(9)\n\
  \n在我看来，不透明将使建筑师或其他无法在不对结果进行某种第三方验证的情况下依赖这些系统。如果建筑行业（以建筑师作为重要贡献者）决定建立一个全球数据信托来驱动\
  \ `AI`，那么该信托的一个组成部分将包括此类实体，它们将在这些结果发布到市场之前进行广泛的测试和认证。`BuildingSMART` 的未来领导者面临着一项更宏大的事业。\n\
  \n除了专业效能和认证等迫切关注之外，目前有大量工作正在理解和评估 `AI` 在决策中的社会和伦理维度。这项工作有两个重要的维度。首先，`AI` 系统的训练数据是“真实世界”输入的结果。目前的自然语言系统（如\
  \ `GPT-3`）或脸识别系统通过抓取互联网上的数据、文本或照片来构建网络，因此这些数据本质上带有其贡献者的结构性偏见。研究这一观点的普斯顿计算机科学家将其称为“真实”（veridical）偏见，^(10)并表明这种偏见不仅根植其中，而且是数据本身的潜在看板。^(11)\n\
  \n`AI` 的第二个维度现在开始被理解：其对环境的影响。在导致她被 Google 解雇的著名论文中，计算机科学家蒂尼特·格布鲁（Timnit Gebru）指出，构建\
  \ `AI` 系统的环境影响被低估了，并损害了无法从中受益的弱势社区。由于 `Google` 越来越依赖 `GPT-3` 等自然语言 `AI` 为“随机鹦鹉”，格布鲁及其合作者建议\
  \ `AI` 系统的设计应其对大气碳的巨大贡献。鉴于例如，拟数据信托中的许多内容可能源自西方项目，仔细维护这些数据以消除新自由主义动态将至关重要。^(12) 克劳福德进一步认为，为了构建\
  \ `AI` 巨大的计算基础设施所需的提取性采矿对环境的损害是一种外部性，应该反映在其成本和开发中。^(13)\n\n### 数据的未来\n\n随着人工智能系统的出现，建筑行业应该更有动力去共享数据，而不仅仅是为了格式不兼容导致的短期效率问题。生成、消费和适当维护数字设计、施工和建筑运营数据将使这些系统得到充分训练，从而释放计算的真实力量。这样做对于建筑师及其行业合作者来说是一个巨大的机会，但也伴随着许多陷阱。然而，也许下一代技术的优势最终将促使他们解决创建此类数据源所要求的协作与整合等更大问题，以及伦理和环境责任。\n\
  \n\n\n\n2018 年，建筑科技初创公司 Doxel 宣布了其首款产品：一种人工智能驱动的机器人。它像一个微型坦克一样滚动，能够跨越崎岖地形甚至爬楼梯，通过扫描和计算机视觉对施工现场进行检查。它将结果与基于\
  \ `BIM` 的设计信息进行对比，以确定现场施工进度。该系统以“建筑生产力的工智能——检查质量并跟踪进度的软件，让您在几分钟而非几个月做出做出”为口号，声称能够自动评估现场已工程的完整性、精确度和安装价值。\n\
  \n与此同时，在人类的模拟世界中，建筑师的标准服务合同规定了建筑师对施工管理的责任（强调处为后注）：\n\n> » 根据合同详情中第 F 项的规定，进行现场目视检查，以审查与建筑设计相关的工程总进度和质量，并向客户发布现场检查报告。（RIBA\
  \ 标准专业服务合同 2020）\n\n> 建筑师应造访现场……以通常地熟悉已完成工程部分的进度和质量，并从上判断观察到的工程执行方式是否表明该工程在完全完成后将符合合同文件。然而，建筑师不要求进行详尽或持续的现场检查以检查工程的质量或数量。（AIA\
  \ B101-2017）\n\n虽然在美国，我们显然倾向于使用更冗长的合同定义——这是多年建筑缺陷及随之诉讼的结果——但其重叠之处是显而易见的。Doxel 的基于深度学习的系统旨在大幅增强或完全消除人工检查施工进度的需求。它是人工智能在“从设计到施工”连续过程中潜力的完美示例：Doxel\
  \ 机器人使用计算机视觉和来自其他项目及相关 `BIM` 的机器学习，寻找非常特定的目标（“那根柱子安装在正确的位置吗？”），并比每天走两次施工现场的人员更快、更便宜、更准确地创建分析结果——而这种义务在\
  \ `AIA` 对施工观察的定义中是被明确排除的。\n\n### 错位的焦虑\n\nDoxel 的价值主张——更快、更准确地理解和管理施工——符合建筑行业人工智能可能遵循的若干趋势。对人工智能\
  \ 系统的早期投资包括：\n\n* » 主要集中在建筑领域（那里的投入更多，且收益空间更大）\n* » 专注于具有技术输入和输出的定义明确的问题，以及\n* »\
  \ 运行在原始数字设计数据与施工执行的交汇点（从 `BIM` 开始，添加计算机视觉，然后测量进度）。\n\n![3.3.2: DOXEL ANALYSIS OF\
  \ CONSTRUCTION COMPLETENESS6](img/fig00066.jpg)\n\n3.3.2: DOXEL 对施工完整性的分析⁶\n\n该系统以及许多后续系统的技术重点，在建筑师\
  \ Patrick MacLeamy 在上一次向 `BIM` 的技术转型早期就已被预见到，他创建了现在被称为“麦克莱米曲线”（MacLeamy Curve）的内容，如图\
  \ 3.3.3 所示。\n\nMacLeamy 最初是为 `BIM` 对建筑师的有效性辩护。他认为，由于建筑师工作的最大价值在于设计过程的早期——此时，重要决策最有机会在不干扰进度的情况下产生积极影响——因此我们大部分的工作流程和价值应该转移到设计到施工进度中的更早阶段。此外，他预测\
  \ `BIM` 将自动化承包商所需的大部分技术文档和其他信息的生产，使得该服务范围内的部分工作价值大大降低。\n\n![3.3.3: THE MACLEAMY\
  \ CURVE](img/fig00067.jpg)\n\n3.3.3: 麦克莱米曲线\n\n像 Doxel 这样自主执行曾经需要人类完成的技术任务的人工智能系统，是这一论点的逻辑延伸。然而，尽管施工进度的评估将明显受益于额外的数字化的帮助，但施工现场在技术、地理以及在某种程度上政治上是复杂的，这是我们的“小坦克”可能无法理解的。因此，我们的人类建筑师在施工期间代表客户维护其利益，将在此继续发挥作用（尽管正如第\
  \ 1.5 节所述，在创建施工图期间人类所需的任务将会减少）。无论如何，由于设计和施工的技术方面——包括文档生产和协调、合规性或协调等技术评估以及管理施工过程的信息流——最有可能成为人工智能驱动的任务自动化的候选对象，我坚信，建筑师对于被自主人工智能取代设计师的焦虑充其是错位的，这一论点\
  \ MacLeamy 在 2003 年就预见到了。\n\n### 重新考虑关系\n\n在第 1.6 节中，我根据建筑师与四个关键利益相关者的关系定义了建筑师：\n\
  \n1. 作为公众健康、安全和福利的保护者。\n2. 作为客户的专家代理。\n3. 作为设计意图对建筑者的引导和翻译者。\n4. 作为设计团队其他成员的经理/领导/整合者。\n\
  \n这些角色中的每一个都需要人类天生的能力来理解上下文、管理关系并进行权衡和判断；这些任务恰恰与人工智能的能力相反，特别是那些需要在大型、经过良好的数据集进行训练的神经网络。因此，如本文定义所示，建筑师多维度的责任不太可能被计算机完全取代，这与\
  \ Susskind 关于任务取代的观点是一致的：有限的任务可能会被取代，但绝不会被自主计算机代理完全取代。\n\n\n\n\n在将建筑师牢牢锚定在项目交付模型四种原型关系中，此类技术任务自动化将最显著地改变建筑师与承包商/建筑供应链之间的关系与义务。这种关系在所有者中最具交易性，其主要特征是信息交换，且精确程度和完整性水平往往会产生争议。AI\
  \ 系统将刻画、编目并最终衡量这些互动和连接的质量，以使这些交换更加有效。随着施工过程通过 AI 辅助设备和系统进一步自动化，对适用于这些系统输入的特定设计信息的需求将会增加，从而以效率之名将建筑设计与施工生产更紧密地联系在一起。在气候变化时代，随着对更智能供应链决策和管理的需求，以及减少毒性甚至尝试减少强迫劳动的增加，建筑师对材料的规范将与对供应链本身的理解结合得更加紧密。因此，承包商将依靠建筑师做出此类智能决策。这与\
  \ 20 世纪 90 年代变形体（blob-makers）时代出现的技术与设计的关系是倒置的——当时建筑师的数字塑形工具使得日益复杂的形状成为可能，而这些形式则交给工程师和建造者来实现。\n\
  \n英国倾向于设计后将建筑师合同转让给承包商，这种做法同时让这位美国建筑师感到困惑和恐惧，但这与以下结论一致：设计和施工可以在合同、程序和技术上在操作中更紧密地绑定。随着施工过程越来越依赖基于\
  \ AI 的自动化，对设计信息与决策之间逻辑关系的需求将自然向设计-施工界面倾斜。\n\n### 流程化生产及其可能性\n\n因此，包含 MacLeamy 论点的这一推理路线的延伸，结合对建筑师工作的任务分析（完整版本请见图\
  \ 1.5.3，生产性工作请见图 3.3.4），表明了基于 AI 的任务增强或自动化的最可能机会位于设计生产阶段的深处，即项目从设计意图转换为提供给承包商的准备就信息的阶段。\n\
  \n选定施工图生产任务的自动化是迄今为止 BIM 在设计中影响的最佳案例。如今的施工图比其 `CAD` 前身更精确、协调得更好、更准确且对承包商更有用，而 `BIM`\
  \ 作为一个良好的平台，既作为一种表示方案也作为训练场，让 AI 继续延续这一趋势。\n\n由于施工图阶段的许多任务本质上是程序性的，因此训练 AI 执行这些任务应该是相对直接的。设计师与建造者之间交接的其他目标仍需要建筑师的判断和协调，而在大型数据集、模式匹配、复杂计算和预测算法可以发挥最大用处的领域，将获得机器智能的支持。\n\
  \n![3.3.4: 建筑师工作技术/生产阶段的任务分析](img/fig00068.jpg)\n\n3.3.4: 建筑师工作技术/生产阶段的任务分析\n\n\
  为了这一目标，考虑施工成本预测问题，特别是设计师与建造者之间经常就符合目标成本的情况进行的激烈谈判。这种涉及数据、判断和计算的复杂舞步的维度在图 3.3.5 中被勾勒。\n\
  \n正如 `BIM` 预期会通过自动化工程量清单和计算任务来加速成本估算的某些方面一样，基于细致分析结合专业判断的汇聚成成本估算的各种分析任务，如果 AI 能以以下方式提供，则可以在成本预测中产生更具洞察力和精确度的：\n\
  \n![3.3.5: 施工成本的分析要素](img/fig00069.jpg)\n\n3.3.5: 施工成本的分析要素\n\n> **工程量测量：** 设计文件定义了设计意图，建造者必须插值精确的系统特性、未指定的材料和隐含的施工元素以便定价。通过在将施工文件映射到详细之前的工程量清单的数据集上进行训练，AI\
  \ 可以从施工图中创建这些映射，并创建更准确且具有历史参考的材料清单。产生的数据集将成为进一步训练这些系统的基础。\n\n> **市场状况：** 宏观经济条件给施工定价引入了极端的波动。全球或局部情况对劳动可用性或材料成本的变化速度快于项目资金计划的响应速度。这种波动通过制造商的材料购买价格与美国建造者在仓库中积的成本之间的差异得到了体现，如图\
  \ 3.3.6 所示。在写作时，由于美国经济从疫情中恢复，材料价格自 2021 年 1 月以来上涨了高达 40%（木材）；2008 年危机的恢复中也看到了类似的模式。基于之前的经济模型和定价配置的\
  \ AI 分析和预测，可以阐明影响成本模型的定价、投标和市场状况的潜在影响。\n\n> **人工和材料成本：** 人工和材料成本传统上根据历史信息估算，但建造者生成的项目实际定价是历史数据（特别是基于建造者能力的竞争优劣势）以及更大市场力量（如熟练工可用和其他竞争压力）的结合。特定的建造者或行业可以从过去项目的组合中训练\
  \ AI，以对此类成本创建更可靠、准确的预测，并将预测成本映射到设计师的数字模型中，在项目过程中提供持续成本建模。\n\n> **供应链状况：** 建筑材料的可用性、价格、性能和适用性取决于交付供应链中的许多条件，从源头采购到制造到交付。嵌入碳和运输成本的碳影响、毒性和劳动公平（现代奴隶制）都影响了给定材料能够正常供应到项目的可能性。AI\
  \ 系统可以在工业材料流模型、货运单、子系统材料清单，甚至劳动力评估上进行训练，将这些问题纳入建筑资产的成本预测中。\n\n> **施工进度：** 由于绝大多数建造者都会为项目模拟施工进度以计划和管理建造，此类进度可以作为\
  \ AI 系统的训练集，从而建立建筑类型、施工地点、特定分包商和制造商组合与施工成本之间的模式和关系。提供给建造者的洞察可以预先提供给设计团队，以了解特定设计是否难以建造或成本更高。此类信息在概念阶段特别有用，但在技术生产期间也可以提供有效的性能评估。\n\
  \n\n\n\n\n> **施工策略：** 随着承包商日益使用复杂的系统对施工顺序和方法进行建模，这些“5D”数据集在宏观尺度上实例化了施工逻辑库。在足够大的训练集下，它们可以成为\
  \ AI 生成施工规划的基础。如果最终生成的投影建模器（它们将熟悉各种施工方法和建筑类型）能够通过 AI 驱动的模拟器充当“可施工性评估员”，并供建筑师使用，那么阿尔伯蒂所定义的意图与执行之间的鸿沟将得到进一步弥合。\n\
  \n上述示例是从设计与施工之间这种虽关键但尚未优化的依赖关系的视角进行的推测，旨在强化这样一个观点：AI 系统将首先出现，并且在设计向技术性能的转化过程中（特别是在施工方面）发挥出最大的用和效能。鉴于建筑行业是低效且不可预测的这一这一广为人知的结论，此类改进将受到建筑师、建造者及其客户的欢迎和拥抱。(9)\n\
  \n### 构建自动化\n\n我们在`第 1.4 章` 中研究的绘画机器人标志着设计师面临的重要变化，其中最重要的一点是他们的项目可能会装饰应用更精确的色彩和纹理。正如内格罗庞特在他对机器自动化流程的早期探索中所言，引入数字技术的第一步是利用它来模拟模拟过程，而这无疑正是我们绘画机器人的起点。然而，内格罗庞特进一步推测道，一旦这些过程被完全整合和理解，其能力将远超其创始者的预期。(10)\
  \ 我们的绘画机器人将通过反复涂刷表面，并与其他在项目中执行相同任务的机器人分享成功与失败的教训来提高其技术。来自 `Doxel` 制造的施工机器人及其不可避免的竞争对手的数据将提供进一步的见解。最终，机器人画家将拥有\
  \ AI 自动化的自主同事来安装和组装建筑项目的其他部分，而它们生成的程序和协议可以组合为一个易于获取、不断演化的施工洞察来源，从而实现建筑的现代化。\n\n\
  ![3.3.6: 2006-2111 美国材料价格波动](img/fig00070.jpg)\n\n`3.3.6:` 2006-2111 美国材料价格波动(11)\n\
  \n对于建筑师来说，这是一个深远的意义。能够弥合设计意图与施工执行之间差距的，与其说是他们的任务，不如说是建造者的任务——这种差距是阿尔伯蒂六世纪年前定义的并在此后泛化或困扰着我们的行业。施工逻辑的实例化不仅让现场执行它的机器人可用，也让配置这些机器人工作最终结果的设计师可用。如今建筑师通过建筑信息模型预测其设计的最终状态，那么这种设计可以由连接到施工模拟器的\
  \ `BIM` 提供指导，该模拟器可以回答各种问题，从这个意义上说，AI 的任务自动化潜力扩大而非缩小了设计的潜力。\n\n![](img/fig00071.jpg)\
  \ `3.3.6: FOSTER + PARTNERS 使用 BOSTON DYNAMICS 进行分析`(Images/fig00072.jpg) `3.3.7:\
  \ FOSTER + PARTNERS 使用 BOSTON DYNAMICS 进行分析`\n\n## 3. 设计劳动力\n\n## **设计的劳动力**\n\n\
  > **设计的劳动力：** `设计的劳动力`\n\n我的第一份全职工作是在 1979 年，因为那时设计工作很少。我们在绘图室大约有 20 多人——我我不于称之为工作室，因为当时设计工作很少。（注：原文此处存在大量重复的段落，译文已根据逻辑进行精简处理）。\n\
  \n在我在这家公司工作 15 个月的后后期，办公室经理开始研究一种被称为“计算机辅助制图”的新想法，而绘图员们完全将其视为一种噱头。\n\n二十年后，这类明智但未注册的绘图员在很大程度上已经从实践中消失了，他们无法转向\
  \ `CAD`。他们的工作被那些不怕计算机并具备使用它绘图技能的年轻数字化 `CAD` 操作员所取代。那时建筑事务所几乎不再以绘图员身份进行培训或招聘；接受培训的设计师取代了这些角色。\n\
  \n### 从绘图桌到 BIM 技术与设计劳动力\n\n![3.4.1: 1958 年芝加哥 SKIDMORE, OWINGS & MERRILL 办公室的绘图室](img/fig00073.jpg)\n\
  \n如今，事务所完全依赖各种技术，因此出现了网络管理专家，甚至是 `BIM` 数据协调员，但此类角色是有限的，且显然不计入计费工作。\n\n\n\n\n机器学习工具的出现将扭转这一趋势。它将为不同类型的建筑工作者创造需求。正如我所论证（参见第\
  \ 2.4 章），通用人工智能（AGI）还遥远于未来，特别是能够胜任专业建筑师多维度角色的 AGI——建筑领域的 AI 系统将针对特定任务，本质上是技术性的，并将支持更广泛的设计业务。这些系统要求对输入、输出、数据需求以及\
  \ AI 系统与更广泛的设计信息基础设施之间的关系有专业的理解。这些是作为通才受训的建筑师不太可能理解的、而且坦率地说，也没有多少参与的技能：此类系统的输出将引起极大兴趣；但其生成过程则没那么吸引。如果能直接询问\
  \ 2030 年版本的 Alexa，“我的项目包含了多少碳？”那就好了，但通往该答案的路径可能会复杂得多。\n\n### 技术、供给与需求\n\n到为止，我一直在论证\
  \ AI 系统可能会自动化技术制图生产、数据和文档管理以及信息控制中更常规的。正如今天生成高分辨率渲染图的 3D 建模平台在很大程度上让专业（模拟和）数字渲染师破产一样，办公室里的这些工作也将消失。\n\
  \n然而，将会产生新的工作。建筑业需要专家能够在生产中管理这些系统，特别是与相关的 AI 流程有关，这些流程将从施工将知识和见解带回设计。复杂的工程分析和建筑性能评估将成为设计生成的必要元素。对于建筑事务所而言，困境在于如何将处理此类工作的专家需求与与可用的人才供给进行匹配。如果一个基于\
  \ AI 系统在概念设计阶段帮助优化您的建筑的碳足迹或无强迫劳动的供应链采购，那么这项工作充其上是偶发性的，并且可能以与其他智能系统的交互为间歇。在第 3.2\
  \ 章中提出的数据信任将提供无处不在的数据，但如何好使用它们将是一个挑战。\n\n在最近对欧洲和中东建筑和工程专业人员的一项调查中，70% 的公司报告称大数据、数据科学和机器学习是重要的新兴技术。(1)\
  \ 实际上对此采取行动的公司的要少得多。那些试图从 AI 实现实际工作的公司正在与全球对数据科学家和机器学习专家的需求进行竞争——我怀疑成功非常有限——其中许多人的起薪远高于英国事务所的职员建筑师。(2)\
  \ 尽管 AI 领域的专业知识在未来十年内将增长，但供需双方的匹配将是一项挑战。\n\n正如丹尼尔·苏斯金德（Daniel Susskind）在《没有工作的世界：技术、自动化以及我们应该如何应对》（《职业的未来：技术将如何变革人类专家的工作》的续作）中所指出的，机器智能将随着时间的推移接管任务的责任，而不是整个工作。然而，建筑领域任务的总体消除将消除工作，原因很简单：诸如创建施工图或管理施工管理数据等生产相关活动，至少在美国至少占了建筑师服务典型费用的\
  \ 35%。(([3)\n\n### 人才、供给与需求\n\n\n\n\n与任何颠覆性技术一样，AI 为建筑师的知识工作带来了机遇与威胁。正如我的耶鲁大学的同事佩奇·迪默（Peggy\
  \ Deamer）所言，许多建筑从业者，特别是那些没有执照或经验较少的人，可能成为不不定的工作者；他们的职业生活因长时间加班、低薪、竞争以及许多建筑师在学校设计工作室中学到的普遍糟糕的人力资源管理而变得不稳定（在学校里，时间被视为一种无限资源)^(9)）。AI\
  \ 与过去的许多自动化技术一样，可以为了冷酷的效率而被部署，而很少考虑工者的福利；询问任何今天在亚马逊仓库工作的人，^(10)。事实证明，将工人与工作匹配的系统会实例化数据集中的偏见（例如雇佣工的简历），拒绝让合格申请者获得基于机器的招聘系统所产生的机会。驱动现代计算的采性行业的工人往往受到剥削，不太可能从他们所提供的计算机中获得任何收益。\n\
  \n在为 Google 撰写的那篇不幸的论文中，蒂姆尼特·格布鲁（Timnit Gebru）指出，AI 的发展必须与对其广泛影响的理解并行进行。她建议：\n\n\
  > 对合成人类行为的研究是伦理 AI 开发中的一条界线，需要对下游效应进行理解和建模，以防止对社会和社会社会群体造成可预见的伤害。因此，还需要对模仿人类的益处、危害和风险进行学术研究，并基于足够具体的用例对目标任务进行深思的设计，以便与受影响的社区协作设计。*¹¹*\n\
  \n建模下游效应可能是 AI 赋能的设计未来的面貌。在建筑领域中，受影响的社区——包括我们的客户、我们的工人以及整个行业——如果能与提供者和学术界通力合作，将最好地遵循她的建议，并从今天开始规划通往公平\
  \ AI 的路线。\n\nALM 假说（如第 1.5 节所述）提出，一旦机器承担知识工作，高技能工人——如那些创建、开发和管理 AI 的人员——将继续被需要。极低技能但高度本地化的工作（如个人服务或餐饮业）也将继续存在。在萨斯金德的“伯特人大屠杀”中，介于两者之间的许多工作将被消除。在这种情况下，大多数建筑工作可能是安全的，但我们为之建筑设计的社会可能会受到巨大影响。与其他社会公平性问题一样，最好将这一问题加入到该行业必须解决的列表中，以负责任地设计未来的建筑环境。\n\
  \n## 3.5 价值主张与商业模式\n\n数字对象标识符: 10.4324/9781003297192-18\n\n> 建筑的技术变革改变了流程，但没有改变建筑师服务的价值，而起源于几个世纪前的执业商业模式却顽固地维持现状。随着下一波由智能机器自动化引发的新工具和能力显现出来，该行业拥有通过重新审视并修正其与更广泛建筑业的价值关系，来打破这一循环的最佳机会。“\n\
  \n在乔治·巴内内特·约翰斯（George Barnett Johnston）关于美国建筑实践的卓越著作《组装建筑师：专业实践的历史与理论》（*Assembling\
  \ the Architect: The History and Theory of Professional Practice*）中，他通过一个名叫汤姆·萨达克（Tom\
  \ Thumtack）的视角，探索了 20 世纪初美国建筑师的心理。汤姆是建筑师弗雷德里克·斯奎尔（Frederick Squires）的虚构化身，后者撰写了一本关于实践的插图，名为《建筑学：建筑师汤姆·萨达克的故事》（*Architec-tonics:\
  \ The Tales of Tom Thumtack, Architect*）。汤姆引用约翰逊的话阐述了对费用的焦虑：\n\n> » 我们按成本的百分比报酬，但有能力的建筑师是那些降低成本的人。因此，通过尽最大努力，他减少了自己的报酬……客户想降低成本，他的建筑师必须帮助他，但特定工作的成本越低，他的报酬就越少。“\n\
  \n汤姆解释了这种报酬体系看似不合逻辑，因为它包含两个深刻矛盾：首先，当建筑师的费用是基于成本的百分比时，建筑师越努力使项目符合成本，报酬就越少；其次，特定工作的成本越低，报酬就越少，其执行的美感也就越低。*¹*\
  \ «\n\n建筑师应按成本比例报酬的观点似乎起源于几个世纪前。约翰斯探讨了这一轨迹，并引用了本杰明·拉特罗（Benjamin Latrobe），这位所谓的美国第一建筑师、受过欧洲培训的移民：\n\
  \n> » 在法国、德国和英国，建筑师的惯例（在许多法院判决确认）是对作品收取费用：1. 按执行总金额的 5% 佣金；2. 如果提供了图纸，根据难度、数量或美感收取固定金额；3.\
  \ 如果工作距离建筑师居住地远，收取差旅费，并按时间损失收取固定金额。*²* «\n\n这些在这里显而易见，并且在大西洋两岸依然存在。³\n\n### 商品化抵抗\n\
  \n很难想象另一个现代企业，即使是像建筑这样不愿现代化的行业，其商业模式与 18 世纪的先例相比基本没有变化。然而，建筑像许多建筑行业一样，受限于最低成本的根本价值策略，服务以类似于钢材、石膏板或地毯的方式进行竞标和购买：对竞争性价格给予最大压力，而对交付的价值（特别是在项目生命周期内的价值）关注得少得多。\n\
  \n考虑到我们看似顽固的商业模式，AI 对实践的两种直接影响对建筑师来说都不乐观。提高生产力可能会为早期采用者带来短期利益，但当这些优势最终对市场上的所有竞争者可用时，它们是短暂的，并很快会消失.^(4)\
  \ 如果 AI 取代了建筑事务所的工作，商品化的费用将按比例下降，甚至更糟.^(5) 面对这种必然的经济逻辑，寻找新的价值主张和商业模式不仅是这些新技术带来的良好益处，而是该行业自身的生存必然需求。如果\
  \ CAD 或 BIM 未能激发这种变化，AI 会吗？\n\n![3.5.1: KENT ROCKWELL’S 'FEES: A REDUCTIO ABSURDUM’\
  \ FROM ARCHITECTURE AND BUILDING, 46, 19146](img/fig00076.jpg)\n\n3.5.1: KENT ROCKWELL’S\
  \ 'FEES: A REDUCTIO ABSURDUM’ FROM ARCHITECTURE AND BUILDING, 46, 1914^(6)\n\n\n\
  \n\n毫无疑问，这些技术改进了建筑服务的流程，并在某些方面改进了结果。`CAD` 使制图更加准确、高效，同时让建筑师能够描绘在技术和形式上更复杂的项目。`BIM`\
  \ 让交付团队的所有成员能够以极高的分辨率和透明度生成、组织、整合和交换设计信息。它还以某种微小的方式，开始弥合设计与施工之间的信息鸿沟；看到 `3D` 数据价值的建造者开始要求这些数据以协助他们的工作。其他数字技术改进了信息交换和面向客户的项目展示（例如渲染图，甚至是虚拟现实模型）。然而，尽管有了这些改进，延续了世纪的建筑计算方法在很大程度上仍保持原样，这表明这些改进的服务并没有转化为业务收益或利润。正如第\
  \ 3.3 节所描述的，“`MacLeamy Curve`”表明设计工作的真正价值在于交付过程的早期，尽管与生产和交付阶段相比，该阶段的投入程度相对较小。也许\
  \ `AI` 将开启这种价值的转移。\n\n如果我们愿意审查新服务的创新业务策略、组织策略甚至新产品，并对以下问题应用同样的创造力：“建筑服务的价值在哪里能最好地转化为业务模式？”那么就可以将\
  \ `AI` 的威胁转化为提升我们专业水平和业务结果的机遇。这些项目仅需符合两个条件：提议必须基于一名胜任的建筑师能够提供的内容，且报酬策略必须完全放弃任何商品化定价的痕迹，因此不允许通过固定费用或按小时收费来盈利。\n\
  \n根据定义，第二个限制消除了任何推演传统实践的可能性，这在某种程度上是一种教学上的自负，旨在让学生们远离他们凭借专业经验和教授们经营的大多数业务而熟悉的舒适区。然而，这并不意味着没有将传统实践模式向受技术启发的价值进行转型的方法，我们将在本章稍后部分讨论这一观点。\n\
  \n在教授这门课几年后，从学生的研究中得出了几个一致的战略主题，涵盖了服务、组织和产品的机遇。^(7)。这些想法的共同点在于，它们可以根据建筑师、客户和建造者之间的关系进行制图，正如图\
  \ 3.5.2 图形所示，并包括：\n\n* `垂直化策略`（verticalisation strategies），建筑师承担其角色以及至少一个其他传统的交付角色。\n\
  * `支持策略`（supporting strategies），建筑师利用特殊技能、才华（通常是技术）为供应链的某些（包括其他建筑师）提供服务。\n* `跨越策略`（spanning\
  \ strategies），企业通过在交付模型的两个部门之间建立重要联系来获取价值。\n\n如果 `AI` 减少了对建筑师的需求，这些方法为其他机遇提供了一份大致的路线图。然而，它们也表明，通过智能机器实现的自主计算的破坏性可能会为建筑师在建筑的整体过程中创造新的杠杆和力量。例如：\n\
  \n*一个稳健的、基于制造和组装程序化知识的 AI 驱动设计方案，旨在利用预制化和工业化建筑*，将建筑师拉近施工手段和方法，使他们能够履行分包甚至施工管理职责。目前已经尝试以类似于当前先例的方式利用\
  \ `BIM`，将设计策略与施工紧密结合，例如 `SHoP Architects` 在其纽约的 `Porter House` 项目中，早期直接向外围护制造商提供数字化制造数据。\n\
  \n![3.5.2 替代建筑实践的交付关系与策略（源自耶尔大学 2230B 课程/ 探索设计实践的新价值主张）以及根据此类分类法学生建议的几个示例企业](img/fig00077.jpg)\n\
  \n### 3.5.2 替代建筑实践的交付关系与策略（源自耶尔大学 2230B 课程/ 探索设计实践的新价值主张）以及根据此类分类法学生建议的几个示例企业\n\n\
  ![3.5.3: SHOP ARCHITECTS, PORTER HOUSE ADDITION, ELEVATION](img/fig00078.jpg)\n\n\
  #### 3.5.3: SHOP ARCHITECTS, PORTER HOUSE ADDITION, ELEVATION\n\n*针对特定技术设计目标的基于\
  \ AI 的决策系统进行大量投资的公司，通过将产生的专业知识提供给面临类似挑战的其他公司，或作为其他设计的验证服务提供给客户，从而收回投资并盈利*。在特定领域（例如医疗设计）具有深厚专业知识的建筑师，可能已经投资开发了基于\
  \ AI 的分析系统，以评估或生成该建筑类型的解决方案。例如，一家医疗实践机构可能将其对手术室布局的深度知识转移到一个通过全球数据信任（带有正反面案例）训练的\
  \ `AI` 中。虽然他们的竞争优势在于将分析结果应用于医院整体解决方案的更大背景中，但该 `AI` 平台——对手术室非常“了解”——可以提供给其他从事工作的公司（可能在竞争不是问题的另一个地理位置），或者作为对当前医院客户的业务，以评估其现有设施。这本身可能是一项盈利的业务，也是一种创造新机遇的有效业务发展策略。正如第\
  \ 2.4 节提到的，今天的先例是费城的的建筑师事务所 `Kieran Timberlake`，他们通过其 `Tally©` 碳评估工具分享其在能源评估方面的专业知识。\n\
  \n\n\n\n\n一位与机构客户（如大学或零售运营商）保持长期合作关系的建筑师，已为他们设计了众多建筑。通过将设计模型数据与建筑控制运营系统的数据流进行映射，她收集了该客户建筑群的庞大数据库，结合信托（trust）的数据，使该事务所能够创建一种基于\
  \ AI 的优化工具，该工具既可以应用于未来的设计，也可以用于当前资产的运行调整。由此产生的合同对投资组合中的每栋建筑在交付后以每五年为一个区块进行扩展，这要求建筑师管理和评估来自项目的数据流，评估运营优化情况并向客户提供建议。除了年度服务合同费外，建筑师还将获得由于这些服务在能源、维护和人员方面节省成本所产生的小比例收益。如今，建筑师\
  \ EskewDumezRipple 预留了 2% 的费用来为客户提供交付后服务，以此发现改进未来项目的策略，并为新项目建立信誉。^(8)\n\n![3.5.4:\
  \ TALLY© 碳足迹工具](img/fig00079.jpg)\n\n### 3.5.4: TALLY© 碳足迹工具\n\n### 转型基础服务\n\n这些简短的旨在引发人们的思考：在\
  \ AI 新能力的支撑下，建筑师未来的替代性价值主张可能是什么样的。然而，更重要的是考虑，当我们与智能机器共同工作时，我们价值的核心建筑师基础服务——直接设计建筑环境——如何演变（如果可以演变的话）。如果认为建筑师可以完全免受这些系统不可避免带来的带来的生产力提高压力和知识工作被替代的影响，那是天真的；而且，认为一个自电力发明以来一直以基本相同业务模式运行的职业，能够在在一个代之内转向根本性的新业务策略，也是如此。我们受限于现有的东西，但我们能修复它吗？\n\
  \n面对这些现实（包括将我们的工作作为商品进行交付的持续竞争压力），有两种方法可以改革而非完全取代现有的按服务计费的方法：可靠性和结果。项目不确定性——即对项目流程将导致意料之外和不幸结果的担忧——是建筑师、客户和建筑商共同关注的焦点。\n\
  \n2014 年在美国进行的一项研究量化了这些担忧，确定了这些利益相关者感知的项目不稳定的首要原因。虽然对挑战清单有普遍共识，但对其相对重要性存在巨大分歧，这从图\
  \ 3.5.5 中的数据中可以看出。\n\n![3.5.5: 根据美国交付参与者调查，项目不确定性因素](img/fig00080.jpg)\n\n3.5.5:\
  \ 根据美国交付参与者调查，项目不确定性因素^(9)\n\n在该列表中，有两个因素是建筑师的直接责任（设计错误、遗漏），还有几个因素涉及建筑师以某种方式的深度参与（业主变更、工期加速和施工协调）。导致的结果项目在某些方面未能达到预期表现，如图\
  \ 3.5.6](#Ch015.xhtml#cap_lbl0077)所示。\n\n图 3.5.5 中的焦虑预示了图 3.5.6 中结果的失败。\n\n建筑领域新兴的\
  \ AI 策略为我们指明了可能的发展线索。我在 Autodesk 的前同事正在开发一种系统，将机器学习应用于施工管理数据，以提前识别现场的潜在问题——无论是在生产过程中还是针对特定承包商。图\
  \ 3.5.7](#Ch015.xhtml#cap_lbl0078)显示了一个仪表板。\n\n另一家引发思考的初创公司 SmartVid.io 开发了一种工具，结合机器学习和计算机视觉来扫描施工现场的活动并识别潜在的安全违规行为，如图\
  \ 3.5.8](#Ch015.xhtml#cap_lbl0079)所示。\n\n请注意，这两家公司都没有使用 AI 来取代人类施工协调员、风险经理或安全负责人的工作，而是增强了他们的能力，允许他们显著提高绩效。没有理由认为这种应用于建筑设计过程的方法，不能直击客户和承包商在设计过程中的不确定性核心，无论是检查协调良好的施工图纸、成本预测、用于耐用性/价格权衡的材料生命周期建模，甚至是组成施工合同的文档中缺失的信息。\n\
  \n![3.5.6: 项目何时符合预期（或未符合）10](img/fig00081.jpg)\n\n3.5.6: 项目何时符合预期（或未符合）^(10)\n\n\
  ![3.5.7: 来自 BIM 360 的问题仪表板](img/fig00082.jpg)\n\n3.5.7: 来自 BIM 360 的问题仪表板\n\n即使是生成方案的生成式设计，在\
  \ AI 驱动的智能评估系统进行筛选之前也不可能真正有用。这些系统可以从数学上衡量生成方案的性能，但选择、完善和实施这些决策将超出它们的能力范围。\n\n###\
  \ 数字能力、信誉价值\n\nEskewDumas 的可持续发展与性能总监 Smith 认为，成功的关键之一是建筑师具备他所谓的“数字能力”（numeracy）：“文盲是关于语言的，数盲是关于数字的。我们不喜欢数字。这不是人们进入建筑行业时认为自己会面对的。但如果你想建造一座好建筑，就必须这样做。”^(11)\
  \ 建筑师在很大程度上根据无形的“好”与“坏”设计来衡量项目的成功，并据此评估竞争。正如三家全球最大的公司的首席技术官在一次关于 BIM 的早期讨论中对我所说：“我们不在技术上相互竞争。我们在设计上击胜对方。”\n\
  \n好设计的定义必须至少部分转向成本、质量和进度等基于数字的方面——更不用说环境和社会影响——而 AI 系统的正确设计和实施是这一转变的关键。具备数字能力且才华的设计师以及他们创造的结果将产生双重利益：增加建筑师的信誉并巩固我们在建筑供应链中的价值。也许，通过\
  \ AI 辅助设定性能目标——并为此付费——将实现 Latrobe 近三个世纪前所抱怨的价值与业务模式的对齐。\n\n![3.5.8: SMARTVID. 10\
  \ 安全分析](img/fig00083.jpg)\n\n3.5.8: SMARTVID. 10 安全分析\n\n![](img/fig00084.jpg)\n\
  \n## 结论\n\nDOI: 10.4324/9781003297192-19\n\n> 哲学家亚瑟·I·米勒将创造力定义为“从现有知识中产生新知识……并通过解决问题来实现”。^(1)\
  \ 在这一句话中，他捕捉了当人工智能技术成熟时建筑师所面临的挑战本质。\n\n\n\n\n我们的职业核心是一项创造性事业，其价值在于我们能够以独特、恰当且美的方式定义并解决问题。使用\
  \ `AI` 应当扩展而非消灭我们对客户及整个公众承担的义务。\n\n虽然这可能需要一段时间才能触及设计与建筑行业的偏远角落，但 `AI/ML` 的模式分析、自主处理和数据评估能力最终将出现在建筑景观中。我们可以*先验*地宣称，这项技术对建筑师构成了生存威胁；我们也可以利用我们解决问题的能力，设计一种决定他们最终命运和用途的策略。通过这种方式，我们可以增强建筑师在客户面前的影响力和信誉，修复与施工合作者之间数十来的破裂关系，甚至可能打破我们商品化的价值主张和停滞不前的收费结构性循环。\n\
  \n任何引导建筑领域 `AI` 系统开发和使用的策略都应服务于两个目标：提高建筑环境的质量，以及增强人类建筑师的相关性。考虑到下一代技术很可能定义建筑实践的未来，该行业必须建立手段来宣布其需求和方向，而不是听从软件提供者的商业意图，后者的动机最终将优先考虑利润和股东。^(2)\
  \ 建筑师过去是以客户的身份分别发声，而不是作为重要用户的集体采取统一行动。他们应该组织起来，与监管机构、客户、设计师和建造者合作，宣布一项优先考虑最重要数据和\
  \ `AI/ML` 能力的行业技术战略，并要求行业提供这些能力。与常识相反，软件提供者实际上更喜欢这种方法，因为这为他们节省了大量且通常不完全的需求研究的时间和精力。英国从\
  \ 2010 年开始的国家 `BIM` 倡议现在已成为全球技术采用的模板，是这种规模化实施方式的极佳案例。^(3)\n\n2. **明确引导将塑造未来实践技术的定义和创建。**\
  \ 鉴于下一代技术很可能定义建筑实践的未来，该行业必须建立手段来宣布其需求和方向，且不再受限于软件提供者的商业喜好。从 20 世纪初的生命安全，到 21 世纪初的能源性能，建筑师必须处理的性能范围将继续扩大。由数据驱动的\
  \ `AI` 系统可以赋予建筑师能力，将更广泛的参数集成到他们的设计过程中，将解决方案的生成与例如占用、经济、流行病学影响、内嵌碳甚至隐含劳动力等性能模型连接起来。^(4)\
  \ 这些考虑并没有取代传统意义上设计的重要性，而是扩展了它，同时提升了建筑的有效性和建筑师的信誉。\n\n3. **创建可以作为设计平台的数据基础设施。** 今天的设计师已经通过\
  \ `BIM` 创建了数万个项目的数字模型，这些模型为 `AI` 生成的洞察提供了巨大的资源。承包商也通过无人机扫描、施工的计算机视觉分析和数字化施工管理工具进行同样的事情。建筑控制系统正在产生关于系统性能的海量数字信息湖。如果没有组织和访问这些资源的策略，这些资源的潜力将完全无法实现，特别是在该行业充满争议且规避风险的交付模式中。上述的协作组织可以引导软件战略，并为收集、组织、访问和使用这些数据创建政策和平台，表面上通过一个由第三方信托人管理且所有人共享的全球建筑数据信托来实现。\n\
  \n4. **改变设计、施工与资产运营之间的关系。** `BIM` 在 2004 年左右作为一个被广泛理解的概念出现，这与集成项目交付新模式的发展相吻合，这种模式基于假设易于获取、透明的项目信息源将加速所有者、设计师和建造者之间的合作，而这种协作的缺失是建筑行业为人知的病态。^(5)\
  \ 15 年后，这一承诺在很大程度上仍未实现。各方创建的数字数据可能更具传输性，但它们往往互不兼容且少少。^(6) `AI` 平台可以开发、管理和整合这些各种表示与过程之间的数据关系，它可以成为催化剂，允许建筑师跨越划分项目定义、设计、施工和资产运营的传统边界，并使设计意图与施工之间实现知识共享。工具可能提供了机会，但从业者必须想要拥抱它。\n\
  \n5. **转变设计的价值主张。** 建筑师服务的商品化是阻碍该行业创新和价值创造的主要因素。^(7) 战略性部署于性能增强设计解决方案服务中的人工智能工具，可以成为改变事务所基本业务模式的催化剂，将建筑师服务的价值从交付物和固定费用转变为基于结果的交付模式及服务。`AI/ML`\
  \ 系统可以从根本上加速当今算法驱动软件工具预测项目未来状态的能力，通过模拟产生最佳价值。只要通过实施前四项策略，可靠的基于 `AI` 的工具变得广泛可用，建筑师就可以拥抱建筑和社会最大的挑战，并最终摆脱商品化收费、资源有限以及公众对他们设计的建筑价值表示怀疑的统治。\n\
  \n\n\n\n建筑师 Eyal Weizman 领导着一个名为 `Forensic Architecture`（法医建筑）的伦敦研究团队，这个词也被他用来描述他的“调查性实践”，这种实践“将我们人造环境的共同元素——建筑、细节、城市和景观，以及它们在媒体中的表现形式和数据数据——视为切入点，借此审视当代进程，并对未来提出主张”。他的团队使用受复杂数据收集和分析支持的建筑方法，来研究政府管辖权和武力使用等政治问题。这项工作并非传统建筑，因为它利用数字工具和分析，解构了信息源并以一种原本可能无法被理解的方式将其重新重组。`Forensic\
  \ Architecture` 的工作——可以理解，这极具争议，特别是对于他所揭露的政府而言——是整个建筑领域 AI 战略的一个模板。`Forensic Architecture`\
  \ 为分析而收集的数据碎片是对未来状态进行推测的基础，这是建筑师的一项基本责任，特别是那些设计建成环境的建筑师。正如 Weizman 所言，为了对设计行动如何体现做出此类主张，建筑师需要对世界信息的收集、使用和部署持有批判性立场。\n\
  \n如果对数据结果缺乏这种批判性视角而盲目依赖，可能会导致灾难性的后果，特别是在建筑设计这样一个声称保护公共福利的领域。在神经网络应用于医疗治疗的早期研究中（当时此类系统的内部逻辑尚清晰可见），那些做出生死决定的\
  \ ML 平台（即使这些系统通常是可靠的）曾导致医院完全拒绝使用 AI。当系统报告哮喘患者患肺炎后遭受严重后果的概率更低而非更高时，他们变得怀疑，这显然是一个违背直觉的结果。显然，这些患者在疾病早期就被立即转入重症监护室，因此结果要好得多。神经网络连接了输入和输出，但对中间发生了什么一无所知。做出此类决策的系统必须是透明的，而且在像建筑这样涉及专业判断的情况下，必须经过外部验证。\n\
  \n如果能够收集到必要的数据并验证系统，建筑可以极大地扩展其职责范围。在最近一篇探讨建筑与监禁之间紧张关系的文中，非营利设计联盟 `Designing Justice\
  \ + Designing Spaces` 的负责人 Garrett Jacobs 和 Deanna Van Buren 表示，建筑师必须运用技能“消除根根于建成环境的种族主义”。为了给洛杉矶的“替代监禁计划”创建原型，他们实施了一种深度依赖复杂相互关联数据源的设计流程，并解释道：“我们正在与数据可视化、地图和研究机构合作，以理解各种系统——如医疗保健、应急响应、捕前分流、住房、监禁后重新进入等——如何在区域尺度上相互作用。”在数字时代之前，即使是收集这些数据是不可能的，更不用说评估或将其作为新设计的依据了。在当前经验主义系统凸显但认知很大程度上缺失的关头，人类设计师发挥着不可替代的作用，来引导和整合数据。只有这样，计算与设计的结合策略才能实现人类创造的、改善我们状况的全新结果。这是计算与设计结合的最优结果。\n\
