  trans: "\n\n- 使用最新数据创建/更新所有表和视图\n\n- **数据集 (Datasets)**：Delta Live Table 流水线有两种数据集：\n\
    \n    - **视图 (Views)**：Delta Live Table 中的视图与 SQL 中的临时视图相同。视图通过将复杂查询分解为更简单、更小的查询来简化查询。视图仅在流水线运行期间存在，无法进行交互式查询。\n\
    \n    - **表 (Tables)**：Delta Live Table 以 delta 格式创建表，并确保它们根据查询生成的结果进行更新。如果表是增量表，则数据将持续摄入表中。\n\
    \n      我们还可以像如下所示创建临时表，以防止发布不应供外部访问的表：\n\n      ![](img/Figure-5.3.jpg)\n\n \
    \     **图 5.3**：临时表\n\n- **连续和触发式流水线 (Continuous and triggered pipelines)**：我们可以使用连续型和触发式流水线创建\
    \ Delta Live Tables。\n\n    - **触发式流水线 (Triggered pipelines)**：当 Delta Live Table\
    \ 有可用数据时，它将更新表。在数据更新完成后，它还会停止集群。Delta Live Table 会分析表之间的依赖关系。当依赖表被更新时，流水线将更新这些表。\n\
    \n    - **连续流水线 (Continuous pipeline)**：每当输入数据发生变化时，连续流水线都会持续更新表。连续流水线的优势是数据始终可用且可访问，但它需要集群始终运行。\n\
    \n      我们可以使用流水线设置中的 `continuous` 标记来配置执行模式标记。默认情况下，执行模式为 `triggered only`（仅触发），如所示：\n\
    \n      ![](img/Figure-5.4.jpg)\n\n      **图 5.4**：Delta Live Table 执行模式\n\n \
    \     执行模式与所计算的表类型无关。我们还可以配置表的更新频率，以便在数据摄入表时设置延迟：\n\n      ![](img/Figure-5.5.jpg)\n\
    \n      **图 5.5**：Delta Live Table 触发间隔\n\n      为了在创建流水线时优化负载，我们可以在 `Development`（开发）模式和\
    \ `Production`（生产）模式之间切换执行模式。\n\n      如下截图所示，我们可以从流水线 UI 界面在 `Development` 和\
    \ `Production` 模式之间切换：\n\n      ![](img/Figure-5.6.jpg)\n\n      **图 5.6**：Delta\
    \ Live Table 执行模式\n\n    - **开发模式 (Development mode)**：在此模式下，Delta Live Table\
    \ 系统会重启集群以避免重启开销。\n\n      它还会禁用的检测和修复错误的重试间隔。\n\n    - **生产模式 (Production mode)**：它仅针对特定错误重启集群。\n\
    \n- **发布表 (Publish tables)**：我们还可以发布 Delta Live Table 的输出以便供查询。我们可以在 Delta Live\
    \ Table 设置中指定目标设置：\n\n      ![](img/Figure-5.7.jpg)\n\n      **图 5.7**：Delta Live\
    \ Table 发布表\n\n      当我们指定 `target` 属性时，它将仅发布表及其关联元数据。视图不会被发布。\n\n- **流水线实现 (Pipeline\
    \ implementation)**：现在我们将详细探索 Delta Live Table 流水线的实现。\n\n- **笔记本 (Notebooks)**：我们可以使用\
    \ Databricks 笔记本在流水线中实现 Delta Live Table。我们可以使用 Python 或 SQL 使用单个笔记本或多个笔记本。\n\n\
    - **查询 (Queries)**：我们可以使用 Databricks 笔记本在流水线中实现 Delta Live Table。我们可以使用 Python\
    \ 或 SQL 使用单个笔记本或多个笔记本。\n\n      在以下示例中，我们使用 `dlt.table` 来定义一个表：\n\n      ```python\n\
    \      import dlt\n      @dlt.table\n      def my_table():\n          return dlt.read_stream(\"\
    source_table\")\n      ```\n\n      或者，使用 SQL：\n\n      ```sql\n      CREATE OR\
    \ REPLACE LIVE TABLE my_table AS\n      SELECT * FROM STREAM(source_table)\n \
    \     ```\n\n"
- fmt: "\n* `expect_all`: We can use `expect_all` to specify various data quality\
    \ constraints when records that don’t meet the expectation criteria need to be\
    \ included in the `target` dataset:\n```python\n@dlt.expect_all({“valid_count”:\
    \ “count > 0”, “valid_account_no”: “current_account_no IS NOT NULL AND current_account_name\
    \ IS NOT NULL”})\n```\n\n* `expect_all_or_drop`: We can use `expect_all_or_drop`\
    \ to specify multiple data quality constraints when records that fail the validation\
    \ should be dropped from the `target` dataset:\n```python\n@dlt.expect_all_or_drop({“valid_count”:\
    \ “count > 0”, “valid_account_no”: “current_account_no IS NOT NULL AND current_account_name\
    \ IS NOT NULL”})\n```\n\n* `expect_all_or_fail`: We can use `expect_all_or_fail`\
    \ to specify the constraints when the record fails validation and then halt the\
    \ pipeline:\n\n```python\n@dlt.expect_all_or_fail({“valid_count”: “count > 0”,\
    \ “valid_account_number”: “current_account_number IS NOT NULL AND current_account_name\
    \ IS NOT NULL”})\n```\n\nAfter understanding the fundamental concepts of Delta\
    \ Live Table, let us understand the workflow of Delta Live Table pipelines to\
    \ test and debug the transformation logic in the `development`, `test`, `acceptance`,\
    \ and `production` environment.\n\nWe can create a generic pipeline to combine\
    \ the Delta Live Table functionality with the Databricks `Repos`:\n\n```json\n\
    {\n  “name”: “Data Ingest to Development”,\n  “target”: “customers_dev”,\n  “libraries”:\
    \ [“/Repos/user@databricks.com/ingestion/etl.py”],\n}\n{\n  “name”: “Data Ingest\
    \ to Production”,\n  “target”: “customers_production”,\n  “libraries”: [“/Repos/production/ingestion/etl.py”],\n\
    }\n```\n\nWe can also create parameters in the pipeline using the pipeline settings.\
    \ Parameterization enables the following use cases:\n\n* Faster testing\n* Reduce\
    \ the amount of data processing\n* Reuse the transformation logic\n\nFor example,\
    \ we can create and use pipeline variable `country` to get the value of country\
    \ dynamically:\n\n**SQL**\n```sql\nCREATE LIVE TABLE countries\nAS SELECT * FROM\
    \ all_countries WHERE country = ${mypipeline.country};\n```\n\n**Python**\n```python\n\
    @dlt.table\ndef countries():\n  start_date = spark.conf.get(“mypipeline.country”)\n\
    \  return read(“sourceTable”).where(col(“date”) > start_date)\n```\n\nMany applications\
    \ also want to ingest the data incrementally in near real time. We can use Delta\
    \ Live Table to incrementally load the data which will reduce the cost of data\
    \ ingestion and make sure that the data is available for access without any delays.\n\
    \n**Python**\n```python\n@dlt.table\ndef streaming_ingest_table:\n  return dlt.read_stream(“streaming_ingestion_table”).where(...)\n\
    ```\n\n**SQL**\n```sql\nCREATE INCREMENTAL LIVE TABLE streaming_ingestion_table\n\
    AS SELECT * FROM STREAM(LIVE.streaming_bronze_table)\nWHERE ...\n```\n\nIf you\
    \ want to refresh the data, then go to the *Pipeline Details* page and click on\
    \ the *Refresh* button to select the `Full Refresh` option.\n\n# Creating Delta\
    \ Live Tables using Python and SQL\n\nNow, let us also explore in detail how to\
    \ create Delta Live Tables using Python and SQL:\n\n### Python\n\n1. Create table\
    \ using Python. We have to use `@table` decorator to create a table:\n![](images/Figure-5.13.jpg)\n\
    **Figure 5.13:** Delta Live Table - create table using Python\n\n2. **Create view:**\
    \ View can be created using the `@view`:\n![](images/Figure-5.14.jpg)\n**Figure\
    \ 5.14:** Delta Live Table - create view using Python\n\nIf we want to install\
    \ the Python libraries while creating the Delta Live Table, we can use the magic\
    \ command `%pip install`. Once we install the Python package, every Python notebook\
    \ used in the pipeline has access to the installed libraries:\n![](images/Figure-5.15.jpg)\n\
    **Figure 5.15:** Delta Live Table - install Python packages\n\n### SQL\n\n1. Create\
    \ table:\n![](images/Figure-5.16.jpg)\n**Figure 5.16:** Delta Live Table - create\
    \ table using SQL\n\n2. Create view:\n![](images/Figure-5.17.jpg)\n**Figure 5.17:**\
    \ Delta Live Table - create view using SQL\n\nDelta Live Table also supports API\
    \ to `create`, `edit`, `delete`, `start`, and `view` details about the pipeline.\n\
    \n3. Create pipeline using API:\n**Endpoint name**: `2.0/pipelines`\n**HTTP Method**:\
    \ `POST`\nWhen we execute the pipeline, it will create a new pipeline:\n**Example**\n\
    The following example will create pipeline named `Data pipeline (SQL)`:\n```json\n\
    {\n  “name”: “Data pipeline (SQL)”,\n  “storage”: “/Users/username/data”,\n}\n\
    ```\n\n4. Edit pipeline:\n**Endpoint name**: `2.0/pipelines`\n**HTTP Method**:\
    \ `PUT`\nThis endpoint will allow us to update the existing pipeline.\n**Example**\n\
    ```json\n{\n  “name”: “Data pipeline (SQL)”,\n  “storage”: “/Users/username/data”,\n\
    \  “clusters”: [\n    {\n      “label”: “default”,\n      “autoscale”: {\n   \
    \     “min_workers”: 1,\n        “max_workers”: 5\n      }\n    }\n  ],\n  “libraries”:\
    \ [\n    {\n      “notebook”: {\n        “path”: “/Users/username/DLT Notebooks/Delta\
    \ Live Tables”\n      }\n    }\n  ],\n  “target”: “_ingestion”,\n  “continuous”:\
    \ false\n}\n```\n\n5. Delete pipeline:\n**Endpoint name**: `2.0/pipelines`\n**HTTP\
    \ Method**: `DELETE`\nWe can delete the pipeline using this endpoint.\n**Example**\n\
    ```bash\ncurl --request DELETE://<databricks-instance>/api/2.0/pipelines/{pipeline}\n\
    ```\nHere, we have to replace `<databricks-instance>` with actual Databricks workspace\
    \ name.\n\n6. Get pipeline details:\n**Endpoint name**: `2.0/pipelines`\n**HTTP\
    \ Method**: `GET`\nWe can get the pipeline details using these endpoints.\n**Example**\n\
    Sample response of the endpoint looks as follows:\n```json\n{\n  “pipeline_id”:\
    \ “{pipelineid}”,\n  “spec”: {\n    “id”: “{id}”,\n    “name”: “Data pipeline\
    \ (SQL)”,\n    “storage”: “/Users/username/data”,\n    “clusters”: [\n      {\n\
    \        “label”: “default”,\n        “autoscale”: {\n          “min_workers”:\
    \ 1,\n          “max_workers”: 5\n        }\n      }\n    ],\n    “libraries”:\
    \ [\n      {\n        “notebook”: {\n          “path”: “/Users/username/DLT Notebooks/Delta\
    \ Live Tables”\n        }\n      }\n    ],\n    “target”: “data_ingestion”,\n\
    \    “continuous”: false\n  },\n  “state”: “IDLE”,\n  “cluster_id”: “{clusterid}”,\n\
    \  “name”: “Data Ingestion pipeline”,\n  “creator_user_name”: “username”,\n  “latest_updates”:\
    \ [\n    {\n      “update_id”: “{update_id}”,\n      “state”: “COMPLETED”,\n \
    \     “creation_time”: “2021-11-06T00:37:30.279Z”\n    },\n    {\n      “update_id”:\
    \ “{update_id}”,\n      “state”: “CANCELED”,\n      “creation_time”: “2021-11-06T00:35:51.902Z”\n\
    \    },\n    {\n      “update_id”: “{update_id}”,\n      “state”: “FAILED”,\n\
    \      “creation_time”: “2021-11-06T00:33:38.565Z”\n    }\n  ]\n}\n```\n"
