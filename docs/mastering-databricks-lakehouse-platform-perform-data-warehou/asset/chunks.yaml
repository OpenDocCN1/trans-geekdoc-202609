    A dataset is a strongly typed, immutable collection of data. Similar to a `DataFrame`,
    the data in a `Dataset` is mapped to a defined schema. It is more about `type
    safety` and is `object-oriented`.


    `Dataset` has helpers, often called `encoders`. These are encoding utilities that
    convert data inside each object into a compressed binary format, resulting in
    the reduction of memory usage, reducing the number of bytes during network transfer.


    As mentioned earlier `Datasets` and `DataFrame` both compile to generate `RDD`
    in a highly optimized way.


    # Directed Acyclic Graph (DAG)


    `DAG` is a finite directed graph with no directed cycles. There are finitely many
    vertices and edges, where each edge is directed from one vertex to another.


    `DAG` contains a finite set of vertices and edges in sequence. Every edge in `DAG`
    is directed from top to bottom in the sequence.


    This is why it’s great for generating multistage scheduling layers that implement
    stage-based scheduling. As the number of layers and depth can be more than two
    but `finite`, it’s better and optimized than the older `Map and Reduce` programs,
    which run in two stages only: `Map` and `Reduce`.


    # How does DAG work in Spark?


    The `interpreter` is the first layer, using a `Scala interpreter`, Spark interprets
    the code with some modifications. Spark creates an operator graph when you enter
    your code in the Spark console. When we call an `Action` on Spark `RDD` at a high
    level, Spark submits the operator graph to the `DAG scheduler`.


    Divide the operators into stages of the task in the `DAG scheduler`. A stage contains
    tasks based on the partition of the input data. The `DAG scheduler` pipelines
    operators together. For example, `map` operators schedule in a single stage. The
    stages pass on to the `task scheduler`. It launches tasks through cluster manager.
    The dependencies of stages are unknown to the `task scheduler`.


    The `workers` execute the task on the slave. The following diagram briefly describes
    the steps of how DAG works in the Spark job execution:


    ![](images/Figure-3.4.jpg)


    **Figure 3.4**: Databricks audit: RDD filtration


    *   **Driver program**: The Apache Spark engine calls the main program of an application
    and creates `Spark Context`. A `Spark Context` consists of all the basic functionalities.
    `RDD` is created in the `Spark Context`.


    *   **Spark Driver**: It contains various other components, such as `DAG scheduler`,
    `task scheduler`, `backend scheduler`, and `block manager`, which are responsible
    for translating the user-written code into jobs that are actually executed on
    the cluster.


    *   **Cluster manager**: `Cluster manager` does the resource allocating work.


    # Execution mechanism


    Spark `Driver` and `Spark Context` collectively watch over the job execution within
    the cluster. Spark driver works with the `cluster manager` to manage various other
    jobs. The `cluster manager` does the resource allocating work, and then the job
    is split into multiple smaller tasks, which are further distributed to worker
    nodes. Whenever an `RDD` is created in the `Spark Context`, it can be distributed
    across many worker nodes and can also be cached there. Worker nodes execute the
    tasks assigned by the `cluster manager` and return them to the `Spark Context`.


    An `executor` is responsible for the execution of these tasks. The lifetime of
    executors is the same as that of the Spark application. If we want to increase
    the performance of the system, we can increase the number of workers so that the
    jobs can be divided into more logical portions.


    # Spark execution flow


    ![](images/Figure-3.5.jpg)


    **Figure 3.5**: Databricks audit: Spark execution flow


    Databricks is a seamless way to utilize Spark to its full potential. As it is
    built over Spark, it supports all the languages that Spark supports, which are
    `Python`, `R`, `Scala`, `Java`, and `SQL`.


    # Processing data using Databricks pipeline


    ## Extract, transform, and load data by using Azure Databricks


    To start with, we will use a simple use case of loading semi-structured exam data
    from SQL server to `Azure Data Lake Gen2` as a structured output to be consumed
    and queried in a variety of formats easily, giving you a varied idea of how to
    process data in Databricks using multiple ways.


    We will be using a stand-alone instance of SQL Server table holding JSON formatted
    data. We will start with fetching semi-structured JSON data, filtering, and transforming
    it to finally generate a structured delta table to query and further process data.


    To achieve it, we will be using notebooks, which is the most used and easiest
    way of programming with Spark-based systems and Databricks.


    For programming language, we have mostly used `Scala`, considering there are easy
    examples available online, and they are just a Google search away. However, we
    have tried to put a viable balance of `Scala`, `SQL`, and `Python` just to make
    sure you understand the examples over and above the language boundaries and will
    be confident to code in any of these based on example available or organizational
    constraints.


    ## Creating a notebook in Databricks


    To create a notebook in Databricks, you can refer to the following screenshot
    and navigate to the `Data Science & Engineering` option to use the notebook feature.
    This also should appear in the common task section, as shown in the following
    screenshot.


    Notebooks are the easiest and most popular way of programming for even hardcore
    programmers. It comes up with a single page with blocks called `cells`. Results
    and objects of the execution of one cell at the top are available to other cells
    below for consumption.


    As in Databricks, there are many languages to work with. You can use `%{language
    Name}` to let the compiler know in which language the cell (block) of the notebook
    is, all the variables over the cells in that language will be available.


    If you want to change the language and use it, the best way to do it is after
    you persist your data so that it can be accessed easily in the language of your
    choice.


    Once you create a notebook, use the `+` icon at the center to create a new cell
    and start writing your code by choosing your program of preference:


    ![](images/Figure-3.6.jpg)


    **Figure 3.6**: Databricks audit: Databricks home


    In the following section, we will try to understand the data pipeline development
    from the lens of Databricks simple notebook-based scripts, which can be written
    in multiple languages, that is, `Scala`, `Python`, `SQL`, and `Java`.


    ## Connecting with a SQL Server data source


    **A similar operation can be performed while connecting with different OLTP data
    sources.**


    To fetch the exam data, the first thing we need to do is connect to the SQL server
    database where the exam data is stored:


    *   Search for the connector available for a data source.


    *   Find if the class for the connector is available in the instance.

