  trans: "\n\n**查询：** 此组件作为 Databricks SQL 接口的一部分可用。将其想象为创建一个笔记本。当你点击笔记本时，它会提示你通过将其附加到集群来创建一个新笔记本。同样，当你选择查询时，它将打开一个\
    \ SQL 编辑器，并提示选择一个 SQL 端点（一个无服务器计算），该端点需要附加到 SQL 编辑器并可以运行 `ad hoc queries`（临时查询）。\n\
    \n# Databricks SQL 的功能\n\n以下是相关功能：\n\n* 使用户能够使用多云湖仓（lake house）架构，与传统的数据仓库和/或数据湖架构相比，该架构更廉价且更快。\n\
    * 在具有数据仓库能力和性能的湖仓数据湖上使用 SQL 查询：\n  ![](img/Figure-1.5.jpg)\n  **图 1.5**：Databricks\
    \ SQL 查询执行\n* 为 Databricks 平台设置 SQL 分析所需的管理和配置更加简单。\n  Databricks 平台本身决定实例类型和配置，以降低成本并提高\
    \ SQL 查询的性能。\n  Databricks SQL 内置功能，可以轻松地管理用户访问、数据和资源，包括监控、查询历史和细粒度访问管理：\n  ![](img/Figure-1.6.jpg)\n\
    \  **图 1.6**：Databricks SQL - 主页\n* 使用首的 BI 工具对 Databricks Lakehouse 平台上的可用数据进行分析：\n\
    \  ![](img/Figure-1.7.jpg)\n  **图 1.7**：Databricks SQL - 连接器\n* 使用 SQL 查询进行高效的数据发现和访问，并利用可视化能力快速分享新见解：\n\
    \  ![](img/Figure-1.8.jpg)\n  **图 1.8**：Databricks SQL - 仪表板\n\n# 用于 Databricks\
    \ SQL 的 SQL 端点\n\nSQL 端点（SQL endpoint）是一种允许终端用户执行 SQL 命令的计算资源。\n\n打开 Databricks\
    \ SQL 并从左侧高亮的窗格中选择 `SQL Endpoints`，如下：\n  ![](img/Figure-1.9.jpg)\n  **图 1.9**：Databricks\
    \ SQL - SQL 端点\n\n默认情况下，Databricks SQL 有一个名为 `Starter Endpoint` 的内置端点，用于在 Databricks\
    \ 平台上运行 SQL 查询：\n  ![](img/Figure-1.10.jpg)\n  **图 1.10**：Databricks SQL - SQL\
    \ 端点列表\n\n如果你点击 SQL 端点，我们可以看到更多关于该端点的配置信息。\n\n* **概述 (Overview)**\n  ![](img/Figure-1.11.jpg)\n\
    \  **图 1.11**：Databricks SQL 端点概览页\n* **连接详情 (Connection details)**\n  ![](img/Figure-1.12.jpg)\n\
    \  **图 1.12**：Databricks SQL 端点连接详情\n* **监控 (Monitoring)**\n  ![](img/Figure-1.13.jpg)\n\
    \  **图 1.13**：Databricks SQL 端点监控\n\n1. 如果你想创建一个新的 SQL 端点，点击 `Create SQL Endpoint`\
    \ 按钮：\n  ![](img/Figure-1.14.jpg)\n  **图 1.14**：Databricks SQL 端点\n  在这里，我们需要提供以下信息来创建\
    \ SQL 端点：\n  * `Name`：提供 SQL 端点名称。\n  * `Cluster Size`：提供集群大小。\n  * `Auto Stop`：提供自动停止时间。\n\
    \  * `Scaling`：提供自动伸缩的最小和最大集群：\n    ![](img/Figure-1.15.jpg)\n    **图 1.15**：创建\
    \ Databricks SQL 端点\n2. 现在，点击 `Advanced options` 以配置额外信息：\n  ![](img/Figure-1.16.jpg)\n\
    \  **图 1.16**：创建 Databricks SQL 端点 - 高级选项\n3. 现在，只要你点击 `Create` 按钮，就会弹出一个对话框，让你获取创建端点的权限：\n\
    \  ![](img/Figure-1.17.jpg)\n  **图 1.17**：Databricks SQL 端点 - 创建\n4. 现在，新的 SQL\
    \ 端点已成功创建：\n  ![](img/Figure-1.18.jpg)\n  **图 1.18**：Databricks SQL 端点已创建\n5.\
    \ 从 SQL 端点列表中，我们可以根据需要启动和停止 SQL 端点：\n  ![](img/Figure-1.19.jpg)\n  **图 1.19**：Databricks\
    \ SQL 端点 - 启动/停止\n6. 一旦创建了 SQL 端点，就可以点击其进行编辑：\n  ![](img/Figure-1.20.jpg)\n  **图\
    \ 1.20**：Databricks SQL 端点 - 编辑\n7. 如果你想配置并管理 SQL 端点，请从主页点击 `Settings`，如下所示：\n\
    \  ![](img/Figure-1.21.jpg)\n  **图 1.21**：Databricks SQL 端点 - 设置\n  在这里，我们可以配置\
    \ `General` 属性：\n  ![](img/Figure-1.22.jpg)\n  **图 1.22**：Databricks SQL 端点 -\
    \ 通用\n8. 我们可以针对故障配置告警，以便快速响应：\n  ![](img/Figure-1.23.jpg)\n  **图 1.23**：Databricks\
    \ SQL 端点 - 告警\n9. 我们可以根据存储属性配置 SQL 端点的访问：\n  ![](img/Figure-1.24.jpg)\n  **图 1.24**：Databricks\
    \ SQL 端点 - 存储\n\n# Databricks 组件\n\n到目前为止，我们讨论了 Databricks 及其架构。接下来，我们将深入探讨 Databricks\
    \ 的核心组件，这些组件提供了 Databricks 的全方位视图。\n\n# 工作空间 (Workspace)\n\n**工作空间**是一个包含笔记本、库和机器学习实验的环境。单个用户可以访问\
    \ `dev`、`staging` 和 `prod` 等多个 Databricks 工作空间。这些工作空间可以通过 Databricks UI、API 和\
    \ Databricks CLI 访问。\n\nDatabricks 资产/对象可以与所有用户或特定用户共享。如果这些对象针对特定用户，则需要创建在 `Users`\
    \ 文件夹中。如果这些对象需要与工作空间内的多个用户共享，则这些对象必须放置在 `Shared` 文件夹下：\n  ![](img/Figure-1.25.jpg)\n\
    \  **图 1.25**：Databricks 工作空间\n\nDatabricks 资产/对象如下：\n* 笔记本\n* 库\n* 文件夹\n* 机器学习实验\n\
    \  ![](img/Figure-1.26.jpg)\n  **图 1.26**：Databricks 工作空间概览\n\n# 笔记本 (Notebooks)\n\
    \n**笔记本**是一个基于 Web 的编程文档或界面。这些文档包含可以操作文件、表格、可视化和叙述文本的可单元单元。这些单元按顺序执行，要在当前单元格中引用上一个单元格的输出，需要先执行上一个单元格：\n\
    \  ![](img/Figure-1.27.jpg)\n  **图 1.27**：Databricks 工作空间文件夹\n\n下图表示了三个不同的笔记本单元格，包含了可视化、叙述文本和代码（从上到下）：\n\
    \  ![](img/Figure-1.28.jpg)\n  **图 1.28**：Databricks 工作空间笔记本\n\n# 库 (Libraries)\n\
    \n**库**是包含本地构建代码的 Databricks 笔记本或文件。这些库可以被导入，也可以在其他笔记本（交互式）或作业（非交互式）中使用。这些库也可以直接上传到集群；通过这种方式，这些库对于使用该集群的笔记本都是可用的：\n\
    \  ![](img/Figure-1.29.jpg)\n  **图 1.29**：Databricks 集群库\n\n# 文件夹 (Folder)\n\n\
    它是用于存储文件或文档的虚拟位置：\n  ![](img/Figure-1.30.jpg)\n  **图 1.30**：Databricks 工作空间文件夹结构\n\
    \n# MLflow 实验 (ML experiment)\n\n"
