    # Let’s connect the operations with the basic operations of Spark and Databricks.


    If you go back to what you learned at the beginning of the chapter, you will recall
    that any syntax that we pass through the query or command through the cells inside
    these notebooks is going to get converted into jobs to be submitted to the Spark
    engine for processing.


    Let us slice and dice into the steps that each of these commands follows. The
    last command that we passed was to get a result from the delta table:


    | `%sql``select * from deltaresultstore where passstate = “1” and userid !=”null”`
    |


