    The `visualizer` also gives you options to show additional metrics around the
    job that got executed so that you can optimize your steps further as well as the
    compute, memory, and storage requirements. After clicking on one of the blocks,
    you can reach a report where it gives you the capability to analyze the execution
    metrics based on `scheduler delay`, `result time`, `JVM heap`, `peak` `storage
    memory`, `pool memory`, `record size aggregated`, and so on:


    ![](images/Figure-3.16.jpg)


    **Figure 3.16:** Databricks audit: DAG example


    Now, the next thing you can do is to click on `Job` again; that’s where you found
    breaking things into multiple stages and jobs at a lower level like directed acyclic
    graph, as suggested in the book at the beginning. One job can be completed in
    multiple stages, depending on how complex the operation is and how it processes.
    In `Spark 2.0` and above as this case, these jobs, and also the underlying processing,
    is mostly automatic. However, analyzing each of these steps gives you opportunity
    to understand more about it and further optimize your operation. While the example
    here is already optimized by `Spark` engine beneath Databricks as we are just
    querying delta lake, when you dig down to stages and cells in notebook where data
    collections and filtering from different sources are happening, you will start
    optimizing your data flow effectively frugally. The `visualizer` is so easy to
    understand that you just have to shift between stages and jobs a couple of times,
    and then see execution statistics, such as `number of completed jobs`, `descriptions`,
    `filtration`:


    ![](images/Figure-3.17.jpg)


    **Figure 3.17:** Databricks audit: The list


    The most important job is `job` when results from different stages are collected
    to finally provide you with the result. In `job`, it’s all collection and union
    to produce the result. At end stage here, we see it is doing `projection`, `shuffling`,
    `merging`, and `union` to complete the task. Note the term `union` here and try
    finding it in the preceding diagrams in the same chapter; you will be able to
