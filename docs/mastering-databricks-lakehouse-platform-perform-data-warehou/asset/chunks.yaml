  trans: "\n\n我们还可以创建查询片段（query snippets）来创建查询分段，以便共享并使用自动补全进行触发：\n\n![](img/Figure-9.29.jpg)\n\
    \n**图 9.29:** Databricks SQL - 查询片段\n\n所有的查询历史都可以从 Databricks SQL 窗的 `Query History`（查询历史）部分进行可视化：\n\
    \n![](img/Figure-9.30.jpg)\n\n**图 9.30:** Databricks SQL - 查询片段\n\nDatabricks\
    \ SQL 安全模型基于 SQL 数据库的安全模型，可以使用标准 SQL 语句 `GRANT` 和 `REVOKE` 配置来创建细粒度权限。\n\nDatabricks\
    \ 表访问控制允许终端用户保护 Databricks SQL 中的各种对象：\n\n* `CATALOG`：对数据目录进行细粒度访问控制\n* `DATABASE`：对数据库进行细粒度访问控制\n\
    * `TABLE`：对托管/外部表进行细粒度访问控制\n* `VIEW`：对 SQL 视图访问控制\n* `ANY FILE`：对底层文件系统访问控制\n\n\
    只有 Databricks 管理员和对象所有者可以为可安全对象提供访问权限：\n\n* Databricks 管理员可以为目录中的所有对象和文件系统提供访问。\n\
    * 目录所有者只能为目录中的所有对象提供访问。\n* 数据库所有者可以为数据库中的所有对象提供访问。\n* 表所有者只能为 Databricks SQL 中的表提供访问。\n\
    \n# 将 Databricks 作为数据源配合 Tableau\n\n我们还可以使用 Tableau 作为 Databricks 的数据源，创建有说力的交互式分析，将数据工程和数据科学家的工作带给业务分析师。\n\
    \nTableau 有四个工具：\n\n* Tableau Desktop\n* Tableau Server\n* Tableau Online\n* Tableau\
    \ Prep\n\n我们可以从 Tableau Desktop 和服务器连接到 Databricks。我们可以使用个人访问令牌（personal access\
    \ token）在 Tableau 中验证 Databricks 的身份。我们也可以使用 `username` 和 `password` 进行身份验证。建议使用个人访问令牌进行身份验证。\n\
    \n现在，让我们从 Tableau 连接到 Databricks 的每一个步骤：\n\n1. 获取 Databricks 连接详细信息：\n    * Databricks\
    \ 服务器名称\n    * HTTP 路径\n2. 在 Tableau 中配置 Databricks 连接。\n\n打开 `Tableau` 应用程序，转到\
    \ `Connect` -> `To a Server` 并选择 `Databricks` 连接器：\n\n![](img/Figure-9.31.jpg)\n\
    \n**图 9.31:** 从 Tableau 连接 Databricks\n\n3. 现在，在 Databricks 对话框中，输入服务器主机名和 HTTP\
    \ 路径。在身份验证中，选择正确的验证方法：`OAuth / Azure AD`, `Personal Access Token` 和 `Username\
    \ / Password`：\n\n![](img/Figure-9.32.jpg)\n\n**图 9.32:** Tableau Databricks 配置对话框\n\
    \n**Azure Databricks 不支持 OAuth/Azure 认证。**\n\n根据所选的身份验证类型配置相应的参数：\n\n* Personal\
    \ Access Token：在密码字段中输入 `Databricks` 令牌并按 `sign in`。\n* Username/Password：输入用户名和密码并点击\
    \ `sign in` 按钮。\n\n一旦创建了报告，我们就可以发布到 Tableau online。让我们快速浏览一下如何发布报告到 Tableau online。\n\
    \n## 前提条件\n\n* Tableau Desktop 工作簿\n* Tableau online 账号\n\n## 发布到 Tableau 的步骤\n\
    \n1. 点击 `Data` -> `{datasourcename}` -> `Extract Data` 从 Tableau Desktop 提取工作簿数据。\n\
    2. 现在，从本地机器浏览位置以存储提取的数据。\n3. 要将工作簿数据发布到 Tableau online，点击 `Server` -> `Publish\
    \ Data Source` -> `{datasourcename}`。\n4. 如果未登录，请登录在线 Tableau 服务器。\n5. 现在，转到 `Publish\
    \ Data Source to Tableau Online` 选项并点击 `edit` 链接选项。\n6. 将弹出一个框；更改 `Refresh` 启用状态。\n\
    7. 选择 `Update` 以使用数据源。\n8. 点击 `Publish` 按钮发布工作簿。\n\nTableau online 会根据配置监控数据源。\n\
    \n# Power BI 配合 Databricks DirectQuery\n\nMicrosoft Power BI 是一项可视化服务，利用 Databricks\
    \ 可扩展平台带来更深层次的洞察。\n\nDatabricks DirectQuery 是为了更好的可视化效果，我们可以通过 Power BI 访问 Databricks\
    \ 工作空间。\n\n现在，让我们快速查看如何从 Power BI 连接到 Databricks：\n\n* 获取 Databricks 连接信息\n  \
    \  获取 Databricks 服务器名称、HTTP 路径和个人访问令牌（PAT）\n* 在 Power BI 中配置 Databricks 连接\n \
    \   打开 Power BI Desktop，点击 `File` 菜单并选择 `Get data`：\n\n![](img/Figure-9.30.jpg)\n\
    \n**图 9.33:** Power BI 获取数据\n\n点击 `Get data` 选项后将打开一个对话框。在左侧选择 `Azure`，选择 `Databricks`\
    \ 并点击 `Connect` 按钮。\n\n**之前的截图提到了 Azure Databricks，我们也可以通过 Power BI 连接它。**\n\n\
    ![](img/Figure-9.34.jpg)\n\n**图 9.34:** Power BI 获取数据\n\n现在，如所示输入 Databricks 服务器主机名和\
    \ HTTP 路径。选择配置相关的数据连接模式。\n\n## 数据连接模式\n\n* **Import**：选定的表和列将导入到 Power BI Desktop。\n\
    * **DirectQuery**：数据不会导入 Power BI Desktop。它将被实时查询：\n\n![](img/Figure-9.35.jpg)\n\
    \n**图 9.35:** Power BI Azure 配置\n\n一旦点击 `OK`，将出现身份验证提示。输入 Databricks 用户名和密码，并输入\
    \ Databricks 令牌：\n\n![](img/Figure-9.36.jpg)\n\n**图 9.36:** Power BI Azure 表\n\
    \n在 Power BI 中使用 DirectQuery 有许多益处：\n\n* DirectQuery 允许即使在使用大型数据集的情况下构建可视化，而无需先导入数据。\n\
    * 在 Power BI 中使用的数据需要刷新以反映更改。DirectQuery 始终使用当前数据并避免不必要的数据传输。\n* 1 GB 数据限制不适用于\
    \ DirectQuery。\n\n# Qlik 配合 Databricks DirectQuery\n\n**Qlik** 是一种数据分析和集成解决方案工具，可以将原始数据转换为明智决策。Qlik\
    \ 可以从 `Oracle`、`Microsoft SQL Server`、`SAP`、`mainframe` 等源提取数据到 Databricks 湖。\n\
    \n现在，让我们检查如何从 Qlik 工具连接到 Databricks：\n\n* 生成 Databricks 令牌，因为我们需要该令牌来验证身份并连接到\
    \ Qlik。\n* 启动用于集成的集群。\n\n当我们使用 Qlik 进行数据分析时，它会将数据写入 `S3 bucket`。Databricks 集群随后将从\
    \ S3 桶读取数据。\n\n为了访问 AWS 资源，我们必须使用带有实例文件的 Databricks 集成集群。`instance profile` 将具有访问\
    \ AWS S3 桶的权限，我们可以在其中写入 Delta 表。\n\n"
