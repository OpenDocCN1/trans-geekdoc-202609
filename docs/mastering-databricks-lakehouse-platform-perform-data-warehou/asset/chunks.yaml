  trans: "\n\n## **模型监控**：应该监控模型的预测性能，以检查模型性能并采取主动措施：\n\n![](img/Figure-7.2.jpg)\n\
    \n**图 7.2：** ML Ops 生命周期\n\n正如我们在 ML Ops 生命周期的图化表示中所所示，它涉及多个步骤：\n\n这些步骤涉及的自动化程度决定了机器学习过程的成熟度。这种自动化程度可以决定在数据上训练新模型的速度。\n\
    \n让我们来看端到端机器学习流水线实现中涉及的步骤。\n\n在较高层次上，机器学习过程涉及以下步骤：\n\n* 源码控制\n* 测试并构建 ML 服务\n\
    * ML 模型部署\n* 模型注册表\n* 特征库\n* 元数据存储库\n* ML 流水线执行\n\n![](img/Figure-7.3.jpg)\n\n\
    **图 7.3：** 机器学习过程的自动化 CI/CD 流水线\n\n上一个图显示了自动化 CI/CD 流水线的阶段：\n\n* **开发**：数据科学家和机器学习工程师尝试开发机器学习模型，并在其中对实验步骤进行编排。该步骤的输出将推送到仓库的源码。\n\
    * **持续集成流水线**：一旦源码准备就绪，将在创建包并测试后将其提交到仓库。该阶段的输出是部署到后续阶段的包。\n* **持续交付流水线**：一旦 CI\
    \ 流水线准备就绪，CD 流水线会将 CI 阶段产生的产物部署到目标环境。\n* **自动化生产部署**：CI/CD 流水线将根据计划或触发在生产环境中自动执行。\n\
    * **持续交付**：一旦训练好的模型准备就绪，它将部署到预测服务中以提供预测功能。\n* **监控**：通过监控，我们可以根据实时数据监控模型性能。该阶段的输出是根据模型性能阈值执行流水线。\n\
    \n数据分析仍然是一个手动步骤，由数据工程师/数据分析师在源码中流水线执行之前完成。\n\n## 机器学习项目的持续集成设置\n\n在机器学习项目的持续集成流水线设置中，组件被构建、测试并并到到源码仓库中。CI\
    \ 流水线还包含以下步骤：\n\n* 针对特征工程实现的源码进行单元测试。\n* 针对机器学习模型实现的函数进行单元测试。\n* 模型训练覆盖率测试。\n\
    * 流水线组件的集成测试。\n\n## 机器学习项目的持续交付设置\n\n持续交付流水线实现了快速且可靠的流水线和模型：\n\n* 验证模型与目标基础设施的兼容性。\n\
    * 使用 API 测试机器学习模型端点。\n* 将模型自动部署到更高环境：**测试**、**验收**和**生产**环境。\n\n为了实现高效的模型管理，Databricks\
    \ 使用了 `MLflow`，这是一个用于机器学习生命周期的开源平台。\n\nMLflow 模型注册表是一个中心化的模型存储库，用于管理机器学习模型的完整周期。MLflow\
    \ 还提供了模型血缘、模型版本控制和阶段转换：\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4：** MLflow\n\nMLflow\
    \ 是一个开源机器学习平台，具有以下两个基本特性：\n\n* **开源**：供开发者和终端用户使用的开源项目。MLflow 的开放格式使其更容易在组织之间共享模型。\n\
    * **开放的用户界面**：MLflow 可以与任何 ML 库、算法、部署工具或语言配合。MLflow 基于 REST API，能够与各种工具轻松集成。我们还可以将现有的\
    \ ML 代码添加到 MLflow 中，通过使用 ML 库共享代码并在组织内共享。\n* MLflow 具有以下主要组件：\n    * `Tracking`\n\
    \    * `Projects`\n    * `Models`\n    * `Repositories`\n\nMLflow 主要设计用于与任何类型的机器学习库协同工作，检查需要遵循的代码规范，并检查与现有源码集成所需的更改。MLflow\
    \ 还使代码能够被不同的数据科学家复现和重用。\n\nMLflow 的一些用例包括：数据科学家可以使用 MLflow 跟踪在本地机器上跟踪实验，大型组织可以使用\
    \ MLflow 共享项目、模型和结果。\n\nMLflow 支持与各种工具集成：\n\n![](img/Figure-7.5.jpg)\n\n**图 7.5：**\
    \ MLflow\n\n如果你想安装 MLflow，可以使用以下命令：\n\n```\npip install mlflow\n```\n\n以下组织正在使用\
    \ MLflow：\n\n![](img/Figure-7.6.jpg)\n\n**图 7.6：** 使用 MLflow 的公司\n\nDatabricks\
    \ Lakehouse 平台使用 Databricks 运行时。如果你使用 databricks runtime ML，MLflow 将被预安装。\n\n\
    如果你未使用 Databricks 运行时，我们也可以从 `pypi` 仓库安装 MLflow 包。\n\n## 使用 MLflow 管理模型生命周期\n\n\
    Databricks Lakehouse 平台拥有完全托管和托管的 MLflow 版本，具有高安全性、可用性以及与 Databricks 特性的兼容性。我们可以使用\
    \ MLflow 管理端到端的机器学习生命周期：\n\n* **跟踪 (Tracking)**：我们可以随时间跟踪机器学习实验并比较结果。\n* **模型\
    \ (Models)**：终端用户可以管理多个平台上来自各种 ML 库的机器学习模型。\n* **项目 (Projects)**：我们可以使用 MLflow\
    \ 项目封装机器学习项目，以便多个数据科学家共享和使用。\n* **MLflow 模型注册表**：我们可以创建一个中心化的模型存储库，管理从开发到生产、版本控制等模型周期。\n\
    * **模型服务 (Model serving)**：允许终端用户使用 REST 端点托管 MLflow 模型。\n\n当我们进入 Databricks 主页界面时，可以选择\
    \ `Machine Learning` 选项，如下所示：\n\n![](img/Figure-7.7.jpg)\n\n**图 7.7：** Databricks\
    \ 机器学习工作区\n\nDatabricks 机器学习主页具有选择笔记本、AutoML 等选项：\n\n![](img/Figure-7.8.jpg)\n\
    \n**图 7.8：** Databricks 机器学习主页\n\n"
