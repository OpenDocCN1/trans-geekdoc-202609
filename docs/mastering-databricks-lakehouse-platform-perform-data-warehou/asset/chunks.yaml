  trans: '

    Databricks 的核心在于处理各种类型的数据，无论是实时数据还是批数据。数据处理一直是一项挑战，通常分为多个步骤完成，例如：识别源和数据本身、连接源、对数据进行验证和识别问题、清洗和重构，最后使其能够被流分析引擎、流式解决方案、数据库、存储或诸如
    `Power BI` 或 `QlikView` 等报告工具等消费。


    在之前的两个章节中，我们探索了 Databricks 的基础和基本知识，包括 Databricks 架构、使用 Databricks Lakehouse 平台进行数据科学与工程，以及
    Databricks SQL。在本章中，你将学习 Spark 到 Databricks 的演进，并学习如何使用笔记本（notebook）在 Databricks
    中构建 ETL 流水线来安全地处理经过验证的数据。


    # 结构


    在本章中，我们将涵盖 Databricks Lakehouse 平台的以下方面：


    *   Apache Spark 简介

    *   使用 Databricks 为流式和批处理数据构建 ETL 流水线

    *   实施策略和实践以安全管理数据

    *   使用 Databricks 构建数据质量审计框架


    # 目标


    学习完本章后，你应该能够理解 Apache Spark 及其向 Databricks 的演进，使用 Databricks 中的笔记本构建你的 ETL 流水线，实施数据安全策略，并通过各种方法和示例练习在
    Databricks 中构建一个应对数据质量审计框架的数据处理框架。


    # Apache Spark 简介


    Apache Spark 已经演变为一个用于大规模数据处理的开源统一分析引擎。`Spark` 并不是存储解决方案，而是一个多语言引擎，作为数据处理解决方案，用于在单节点机器或机器组（通常称为
    `clusters` 集）上执行数据工程、数据科学和机器学习。它提供了一个分布式编程接口，可以动态地扩展到多台计算机，以实现具有高容错性的隐式数据并行。


    # 历史


    早在 `2009` 年，`Hadoop 1.0` 已经发布，但它缺乏一个良好的集群管理器。


    `伯克利大学` `AMPLab` 的研究团队正努力通过一个更好的集群管理器来缓解这个问题，这导致了 `Mesos` 作为新型集群管理器的诞生。


    Mesos 已经演变为一个分布式系统内核，其构建原理与 Linux 内核类似，但抽象层级不同。Mesos 内核运行在每台机器上，并为 `Hadoop`、`Spark`、`Kafka`
    等分布式应用程序提供 API，用于跨本地或云端整个数据中心的资源管理和调度。


    **来源**：Apache `[`mesos.apache.org/`](https://mesos.apache.org/)`。


    该团队通过引入一个构建在 `Scala` 之上的`新引擎` 继续测试 Mesos 的威力，该引擎的性能优于 Map Reduce，这促成了 `Matei Zaharia`
    在 `加利福尼亚大学伯克利分校`的 `AMPLab ([[`en.wikipedia.org/wiki/AMPLab`](https://en.wikipedia.org/wiki/AMPLab)))`  开发出
    Spark。


    `2013` 年，该项目被捐赠给了 `Apache 软件基金会`，成为一个顶级 Apache 项目。在本书编写时，Spark 的当前版本是 `3.2`。


    # 向 Databricks 的演进


    Databricks 起源于 `加利福尼亚大学伯克利分校` 的 `AMPLab` 项目，其团队几乎与参与开发 Apache Spark 的成员相同（Spark
    是一个基于 `Scala` 构建的开源分布式计算框架）。该公司由以下人员创立：`Ali Ghodsi ([`en.wikipedia.org/wiki/Ali_Ghodsi`](https://en.wikipedia.org/wiki/Ali_Ghodsi))`、`Andy
    Konwinski`、`Arsalan Tavakoli-Shiraji`、`Ion Stoica ([`en.wikipedia.org/wiki/Ion_Stoica`](https://en.wikipedia.org/wiki/Ion_Stoica))`、`Patrick
    Wendell`、`Reynold Xin ([`en.wikipedia.org/wiki/Reynold_Xin`](https://en.wikipedia.org/wiki/Reynold_Xin))`
    以及 `Matei Zaharia`。


    `Matei Zaharia` 现在是 Databricks 的首席技术官，他在`加利福尼亚大学伯克利分校`攻读博士期间创建了 Apache Spark，随后成为`斯坦福大学
    ([`en.wikipedia.org/wiki/Stanford_University`](https://en.wikipedia.org/wiki/Stanford_University)))`
    的教授。Databricks 团队采用并优化了 Spark，使其能够作为一个 `SaaS` 平台运行。


    年来，Databricks 一直致力于扩展开源项目并简化大数据和机器学习。Databricks 提供了一个云优化的平台，可以在 Amazon Web Services
    和 Azure 上运行 Spark 和 ML 应用。


    `2017 年 11 月`，该公司通过集成 Azure Databricks，被宣布为 Microsoft Azure 的一项原生服务。该公司开发了 `Delta
    Lake`，这是一个开源项目，旨在为机器学习和其他数据科学用例中的数据湖带来可靠性。


    # Apache Spark 发生了什么？


    Spark 继续发光发热，目前已由 `1751` 名贡献者提交了超过 `13830` 次提交，成为 `Apache 软件基金会`中最活跃的项目之一。


    来源：GitHub `[`github.com/apache/Spark`](https://github.com/apache/Spark)`。Spark
    受全球主要供应商和公司的支持，包括 `Yahoo`、`Conviva`、`Amazon`、`阿里巴巴`、`NTT Data`、`EBay`、`百度` 和 `Databricks`。


    从 Databricks 开始，一个主要的云平台通过以下（以下方案）推出了 Apache Spark 的无服务器版本：


    *   Data Mechanics

    *   Oracle Data Flow

    *   阿里云弹性 MapReduce (EMR)


    # Apache Spark 的特性


    *   在处理大规模数据时，Spark 比 `Hadoop MapReduce` 快 `100` 倍。它通过受控分区来实现这种速度，因此在速度上具有优势。

    *   简单的编程层提供了强大的缓存和磁盘持久化功能。

    *   可以通过多种方案进行分布式部署和执行，如 `Mesos`、通过 `YARN` 的 `Hadoop` 或 Spark 自身的集群管理器。

    *   由于其内存计算能力，Spark 提供了实时计算和低延迟。

    *   Spark 代码可以通过其高级 API 或 Scala 和 Python 脚本使用多种语言（`Java`、`Scala`、`Python` 和 `R`）编写。由于支持多种语言，它经常与“多语言”一词联系在一起。


    # 书籍改写与翻译比喻


    ![](img/Figure-3.1.jpg)


    **图 3.1：Databricks 审计：并行处理的书籍改写比喻**


    假设 `Merry` 是一个故事迷，是一个狂热的书虫。`Merry` 最近遇到了一份用不同语言编写的古老菜单，她现在想将其改写成正常的英语。


    她想请几个朋友帮助改写和翻译。我们将此称为**改写与翻译项目**。


    `Merry` 非常敏捷，为了给朋友们节省时间，她通过将手稿分成多个部分来实现最大并行化，以便每个人都能以速度、可追溯性、独立性和恢复性并行完成改写和翻译任务。


    `Merry` 是一个优秀的规划者和领导。为了确保执行完美无缺，她以领导节点的身份负责，创建了一个分阶段或循环的最佳执行计划。我们更倾向于将其称为**分配阶段**。

