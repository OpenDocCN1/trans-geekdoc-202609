    \ our model has been deployed, and it will make batch predictions using the same.\n\
    \nApart from deploying and serving models using the AWS Cloud, we can perform\
    \ real-time serving with `Fast API` or `REST API`. Once the model is deployed\
    \ locally or on cloud, we can use it to make offline or online batch predictions:\n\
    \n![](images/Figure-7.32.jpg)\n\n**Figure 7.32:** REST API working\n\n# Log model\
    \ metrics\n\nMLflow tracking is an API and UI for logging parameters, code versions,\
    \ metrics, and output files while running the machine learning code and related\
    \ visualization. With MLflow tracking, we can log and query experiments using\
    \ Python, REST API, R, and Java:\n\n![](images/Figure-7.33.jpg)\n\n**Figure 7.33:**\
    \ MLflow tracking\n\n**Source**: **[https://mlflow.org/](https://mlflow.org/)**\n\
    \nMLflow tracking is organized around the concept of runs, which are the executions\
    \ of the piece of machine learning/Data Science code. Each piece of code records\
    \ a piece of information:\n\n* **Code version**: If it was a run from the MLflow\
    \ project, then the Git commit hash is used.\n* **Start and end time**: It displays\
    \ the start and end time of the MLFlow experiment run.\n* **Source**: It is the\
    \ name of the file that is required to launch the MLflow project. It is, basically,\
    \ the trigger point to run the MLflow project.\n* **Parameters**: Parameters are\
    \ normally in the form of key-value pairs. Both the key and values are in the\
    \ form of string.\n* **Metrics**: Each defined metric for the MLflow experiment\
    \ can be updated during the MLflow run, and MLflow records and visualizes the\
    \ full metric history.\n* **Artifacts**: Artifacts from the MLflow run can be\
    \ in any format.\n\n# Conclusion\n\nIn this chapter, we explored machine learning\
    \ model management with Databricks in detail. We took a quick tour of how to implement\
    \ end-to-end machine learning solutions using Databricks and MLflow. In addition\
    \ to end-to-end implementation, we covered the basics of MLOps and MLflow. We\
    \ also went through the concepts of getting started with the MLfLow environment,\
    \ feature engineering with Databricks, setting up the MLflow project with the\
    \ model repository, and training and deploying the machine learning model.\n\n\
    # Multiple choice questions\n\n1. What are the main components of MLflow?\n  \
    \  1. Tracking\n    2. Projects\n    3. Models\n    4. Model Repository\n    5.\
    \ All of the above\n2. How can you install the MLflow package in Databricks?\n\
    \    1. `pip install mlflow`\n    2. `pip install mflw`\n3. Can we use MLflow\
    \ to log the artifacts?\n    1. Yes\n    2. No\n4. Which MLflow component do we\
    \ use to record the results and model parameters?\n    1. Tracking\n    2. Projects\n\
    5. Which MLflow component do we use to package machine learning models?\n    1.\
    \ Tracking\n    2. Models\n    3. Projects\n    4. All of the above\n\n# Answers\n\
    \n1. **e**\n2. **a**\n3. **b**\n4. **a**\n5. **c**\n\n# CHAPTER 8\n\n# Continuous\
    \ Integration and Delivery with Databricks\n\nContinuous Integration and Delivery\
    \ enables enterprise organizations to swiftly iterate on the software changes\
    \ while maintaining the overall performance and stability of the platform. Adoption\
    \ of CI/CD entitles organizations to improve productivity, code quality, and software\
    \ delivery.\n\nIn the previous chapter, we explored machine learning model management\
    \ with Databricks in detail. We learned about MLOps and MLflow, and we also understood\
    \ model life cycle management with MLflow. In this chapter, we will explore how\
    \ to enable continuous integration and delivery with Databricks.\n\n# Structure\n\
    \nThis chapter deals with:\n* Repos\n* Automated CI/CD for all environments\n\n\
    # Objectives\n\nAfter studying this chapter, you should be able to understand\
    \ the integration of Databricks with tools like Git.\n\n# Repos for Git integration\n\
    \nA best practice while working with Data Science and Data Engineering is to use\
    \ `Databricks repos` to maintain versions.\n\nWith `Databricks repos`, we can\
    \ use all of the following features:\n* Clone remote\n* Mange branches\n* Create\
    \ push/pull request\n* Visually compare changes\n* Check history of changes\n\n\
    `Databricks repos` also have in-built security features to improve:\n* Control\
    \ access to whitelisted resources\n* Auto detect confidential information in plain\
    \ text format\n\n`Databricks repos` also log all events when we create, delete,\
    \ or update.\n\n`Databricks repos` supports the following Git providers:\n* GitHub\n\
    * Bitbucket\n* GitLab\n* Azure DevOps\n\nIn order to integrate version controlling\
    \ with Databricks using `Databricks repos`, Git server must be accessible from\
    \ Databricks. We can’t connect to private Git servers from Databricks.\n\nNow,\
    \ let’s understand how to configure Git integration with Databricks:\n\n1. First,\
    \ go to the `Settings` tab on the home page of Databricks and click on `User settings`:\n\
    \   ![](images/Figure-8.1.jpg)\n   **Figure 8.1:** Databricks user settings\n\
    2. Now, click on the `User Settings` option and select the `Git Integration` tab:\n\
    \   ![](images/Figure-8.2.jpg)\n   **Figure 8.2:** Databricks repos - Git integration\n\
    3. Select the Git providers as per your convenience: **Azure DevOps**, **GitHub**,\
    \ **GitLab**, or **Bitbucket**.\n4. `If the organization has SAML SSO enabled\
