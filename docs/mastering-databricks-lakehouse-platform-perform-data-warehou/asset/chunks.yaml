  trans: "\n\n1. 安装 `cookiecutter`：\n\n```bash\npip install cookiecutter\ncookiecutter\
    \ https://github.com/databrickslabs/cicd-templates.git\n```\n\n2. 将 Databricks\
    \ token 和工作空间 URL 提供 GitHub secrets，并将流水线提交到 GitHub 仓库。\n\n一旦配置了上述步骤，每当我们把代码提交到仓库时，Databricks\
    \ labs CI/CD 流水线会自动为所有的 Databricks notebooks 运行测试。代码开发和测试完成后，我们可以创建一个 GitHub release，它将使用模板自动打包并将流水线部署为\
    \ Databricks 任务（job）。\n\n如下图所示，数据科学家和数据工程师可以使用 Databricks labs CI/CD 模板对 notebooks\
    \ 进行测试和部署。它为终端用户提供了可重用且通用的数据项目模板，以开始新用例的开发。\n\n在开发生命周期结束时，可以通过在 GitHub 中创建 release\
    \ 将整个 Databricks 项目部署到生产环境：\n\n![](img/Figure-8.36.jpg)\n\n**图 8.36:** Databricks\
    \ 部署生命周期\n\n# 结论\n\n在本章中，我们探索了如何使用 Databricks repos 功能来集成 CI/CD 流水线。这将确保我们始终使用最新版本的\
    \ Databricks 代码，以避免任何差异。\n\n在探索了用于 Git 集成的 Databricks repos 后，我们还学习了如何创建 CI/CD\
    \ 流水线，以自动化测试并将代码部署到开发、测试、验收和生产环境。\n\n最后，我们探索了将 Databricks 与 Azure DevOps、GitLab、Bitbucket\
    \ 和 GitHub 等各种版本控制工具进行集成。\n\n在下一章中，我们将查看 Databricks 平台的可视化，以及各种第三方 BI 工具如何轻松集成到\
    \ Databricks Lakehouse 平台。\n\n# 单选题\n\n1. 我们可以将 Azure Databricks 与 Azure DevOps\
    \ 集成吗？\n   1. 是\n   2. 否\n\n2. 我们可以使用 Azure DevOps CI/CD 自动化 Databricks notebook\
    \ 的部署吗？\n   1. 是\n   2. 否\n\n3. 如何在 Databricks 中创建密钥范围（secret scope）？\n   1. Key\
    \ vault 备份的密钥范围\n   2. Databricks 备份的密钥范围\n   3. 两者都是\n\n4. 我们可以使用 Git 集成创建非 Databricks\
    \ 的文件吗？\n   1. 是\n   2. 否\n\n5. 我们可以使用 Databricks CLI 创建 Azure Key Vault 备份的密钥范围吗？\n\
    \   1. 是\n   2. 否\n\n# 答案\n\n1. a\n2. a\n3. c\n4. a\n5. a\n\n# 第 9 章\n\n# 使用 Databricks\
    \ 进行可视化\n\nDatabricks 平台原生支持多种 BI 工具，如 `Power BI`、`Tableau`、`Looker`、`Qlik`、`TIBCO`、`Microstrategy`、`ThoughtSpot`、`Mode`\
    \ 和 `SQL` 工作台。我们可以利用 Databricks 平台中的数据工具创建交互式可视化。\n\n在上一章中，我们探索了在 Databricks 平台上启用持续集成和交付。在本章中，你将学习如何使用\
    \ Power BI 和 Tableau 等各种可视化工具在 Databricks Lakehouse 平台上进行可视化。\n\n# \n\n在本章中，你将学习\
    \ Databricks Lakehouse 平台可视化的以下方面：\n\n* Databricks SQL Analytics\n* 将 Databricks\
    \ 作为 Tableau 的数据源\n* Power BI 的 Databricks 直接查询\n* Qlik 的 Databricks 交互式分析\n\n\
    # 目标\n\n学习本章后，你应该能够理解 Databricks SQL Analytics 的基础。你还将学习如何使用 BI 工具结合 Databricks\
    \ 创建可视化。\n\n# Databricks SQL Analytics\n\nDatabricks 同样原生支持 SQL 语言，这允许开发者使用 Databricks\
    \ SQL UI 和 BI 工具开发 SQL 应用程序。\n\n让我们来看看 Databricks SQL UI 和 BI 工具之间的区别：\n\n| Databricks\
    \ SQL UI | BI 工具 |\n| --- | --- |\n| 使用 SQL 命令对数据湖进行即时分析 | 用于数据分析的无代码界面 |\n| 创建仪表板以证实业务需求\
    \ | 创建企业级报告和仪表板 |\n| 告警监控仪表板 | 创建带有过滤和高级自定义的关联仪表板 |\n\n**表 9.1:** Databricks SQL\
    \ 与 BI 工具的对比\n\n我们可以使用 Data Explorer 访问 Databricks 中的数据库和表。通过 Data Explorer，我们可以查看架构详细信息并查看示例数据和表详情。管理员还可以更改对象级权限以管理\
    \ Databricks 中的数据访问。\n\n我们可以通过以下步骤从 Data Explorer 访问数据库：\n\n. 点击 Databricks UI\
    \ 上的 ![](img/c09Clip-1.jpg) 图标，这将显示数据库列表：\n\n   ![](img/Figure-9.1.jpg)\n\n  \
    \ **图 9.1:** Databricks 首页\n\n2. 我们还可以使用 Data Explorer 查看带有示例数据的表架构。如上一个截图所示，进入高亮的\
    \ `display Databases` 页面，并选择表，这将显示表的架构、其属性以及示例数据的预览：\n\n   ![](img/Figure-9.2.jpg)\n\
    \n   **图 9.2:** Databricks - 访问数据库和表\n\n3. 为了在 Databricks 工作时创建可视化，我们首先通过以下 SQL\
    \ 打开 SQL 查询器：\n\n   ![](img/Figure-9.3.jpg)\n\n   **图 9.3:** Databricks - SQL\
    \ 查询器\n\n4. 现在，打开 SQL 查询器并执行 SQL 查询；它将以表格格式显示结果：\n\n   ![](img/Figure-9.4.jpg)\n\
    \n   **图 9.4:** Databricks - 执行 SQL 查询\n\n5. 现在，点击 `Add Visualization` 按钮创建可视化。这将打开可视化编辑器页面，根据我们的需求进行配置：\n\
    \n   ![](img/Figure-9.5.jpg)\n\n   **图 9.5:** Databricks SQL - 可视化\n\n   可以在可视化编辑器中配置以下属性：\n\
    \n   * `Visualization Type`：`Chart`、`Cohort`、`Counter`、`Details View`、`Funnel`、`Map`\n\
    \   * `Visualization Name`：可视化名称\n   * `General`：图表类型、X/Y 列、分组（Group By）、错误列\n\
    \   * `X-Axis`：设置比例\n   * `Y-Axis`：设置左/右 Y 轴\n   * `Series`：显示数据\n   * `Color`：颜色\n\
    \   * `Data Labels`：显示不同格式的数据标签\n\n6. 一旦点击 `Save` 按钮，可视化将以可视化名称保存。\n\n7. 我们还可以将可视化添加到仪表板。点击如下截图所示的高亮的三个点，选择\
    \ `Add to Dashboard`：\n\n   ![](img/Figure-9.6.jpg)\n\n   **图 9.6:** 将 Databricks\
    \ SQL 可视化添加到仪表板\n\n8. 编写仪表板名称并点击 `OK`；它会将可视化添加到特定的仪表板：\n\n   ![](img/Figure-9.7.jpg)\n\
    \n   **图 9.7:** Databricks SQL 仪表板\n\n   你还可以将图表可视化下载为图像文件。\n\n   Databricks SQL\
    \ 中有多种可视化类型：\n\n   * 箱线图（Boxplot）\n   * 图表：柱状图、面积图、饼图\n   * 留存（Cohort）\n   * 计数（Counter）\n\
    \   * 漏斗图（Funnel）\n   * 地图（Map）\n   * 透视表（Pivot table）\n   * 桑基图（Sankey）\n   *\
    \ 旭日图（Sunburst）\n   * 字云（Word cloud）\n\n使用 X 和 Y 轴的 Databricks SQL 可视化被称为图表。我们可以在\
    \ Databricks SQL 中创建各种图表。\n\n我们可以将 Databricks 可视化与文本框结合，以提供数据说明。要查看可用仪表板列表，请点击侧边栏中的\
    \ dashboards，如下截图所示：\n\n   ![](img/Figure-9.8.jpg)\n\n   **图 9.8:** Databricks\
    \ 仪表板 - 显示仪表板列表\n\n9. 点击 `Create Dashboard` 按钮创建一个仪表板：\n\n"
