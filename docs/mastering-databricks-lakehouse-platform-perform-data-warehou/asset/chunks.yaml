- fmt: "\n*   `operation` parameters, such as if this operation would append or overwrite\
    \ the data within the table.\n*   The table version is associated with this transaction\
    \ commit.\n*   The `ClusterID` notebook identifies which Databricks cluster and\
    \ notebook executed this commit, and the `userID`, `userName` `ID`, and `name`\
    \ of the user executing the operation. add information.\n\n# Reading the transaction\
    \ log via code\n\n*   Read the transaction log of a specific version:\n\n    ```python\n\
    \    %>%python\n    log = Spark.read.json(\"//.../00000…2.json\")\n    ```\n\n\
    *   The Delta transaction log commits metadata can be read using the following\
    \ code snippets:\n\n    ```python\n    %python # Commit Information\n    display(log.select(\"\
    commitInfo\").where(\"commitInfo is not null\"))\n    ```\n\n*   The Delta transaction\
    \ log adds metadata that can be read using the following code snippets:\n\n  \
    \  ```python\n    %python # Commit Information\n    display(log.select(\"add\"\
    ).where(\"add is not null\"))\n    ```\n\nDelta Lake can optimize their queries,\
    \ affecting the number of files being important, especially in cases like dynamic\
    \ partition pruning, as it can be read from the preceding high-level primer.\n\
    \nAs the Delta Lake transaction log tracks the files and other metadata to ensure\
    \ both atomic transactions and data reliability, it does not eagerly remove the\
    \ files from the disk, even though the underlying data files from the table are\
    \ removed. The `VACUUM` operation can be used to delete the files that are no\
    \ longer needed.\n\nFor large-scale systems built on batch or streaming, Spark\
    \ may create a lot of small files to maintain atomicity; this often leads to a\
    \ small-file problem where it becomes ever more inefficient to query the transaction\
    \ log folder (that is, delta log subdirectory). To handle this issue, Delta Lake\
    \ creates a checkpoint file in Parquet format after it creates the `10^(th)` commit\
    \ or transaction. \n\nCreating a transaction log after every `10^(th)` commit\
    \ helps save the entire state of the table at a point in time in native Parquet\
    \ format. This makes it quick and easy for Spark to read and handle the small\
    \ file problem.\n\n# Time travel\n\nAs you write into a Delta table or directory,\
    \ every operation is automatically versioned. You can access the different versions\
    \ of the data in two different ways:\n\n*   Delta Lake time travel allows you\
    \ to safely remove data from your Delta Lake, reverse it in case there are mistakes,\
    \ and track the progress through the Delta Lake transaction log.\n*   This not\
    \ only helps in handling audibility issues but also major governance and compliance\
    \ tracking in a case where it’s required to delete a specific user data from everywhere\
    \ and sometimes go back to a certain past state of the table to verify what was\
    \ there.\n\nConsider GDPR, *How would you avoid drowning in data requests use\
    \ cases?*\n\n# Rollbacks and time travel\n\nRollbacks via time travel also make\
    \ it easy to reset your data to a previous snapshot, either using a timestamp\
    \ or using a version number.\n\nEvery table in Delta Lake is the sum total of\
    \ all of the commits recorded in the Delta Lake transaction log. The transaction\
    \ log can be considered as a step-by-step guide that details exactly how to get\
    \ from the table’s certain state to a required state.\n\nThis helps to recreate\
    \ the state of a table at any point in time by starting with an original table\
    \ and processing backwards or forward.\n\n# Handling upstream changes\n\nMany\
    \ times, we need to see the state of the table at a certain point. We can use\
    \ the `DESCRIBE` command to see the history:\n\n```sql\nDESCRIBE HISTORY table\n\
    ```\n\nIf we want to query data at a specific version, we can use the `VERSION\
    \ AS` or `TIMESTAMP AS` clauses:\n\nTo query by a version number:\n```sql\nSELECT\
    \ * FROM table VERSION AS 5\n```\n\nTo query by a timestamp:\n```sql\nSELECT *\
    \ FROM table TIMESTAMP AS '2023-01-01 00:00:00'\n```\n"
  raw: "*   `operation` parameters, such as if this operation would append or overwrite\
    \ the data within the table.\n\n*   The table version is associated with this\
    \ transaction commit.\n\n*   **ClusterID** notebook identifies which Databricks\
    \ cluster and notebook executed this commit, and the **userID**, **userName**\
    \ **ID**, and **name** of the user executing the operation. add information.\n\
    \n# Reading the transaction log via code\n\n*   Read the transaction log of a\
    \ specific version:\n\n    ` >%python`\n\n    `log = Spark.read.json(“/.../00000…2.json”)`\n\
    \n*   The Delta transaction log commits metadata can be read using the following\
    \ code snippets:\n\n    `%python # Commit Information display(log.select(“commitInfo”).where(“commitInfo\
    \ is not null”))`\n\n*   The Delta transaction log adds metadata that can be read\
    \ using the following code snippets:\n\n    `%python # Commit Information`\n\n\
    \    `display(log.select(“add”).where(“add is not null”))`\n\nDelta Lake can optimize\
    \ their queries, affecting the number of files being important, especially in\
    \ cases like dynamic partition pruning, as it can be read from the preceding high-level\
    \ primer.\n\nAs the Delta Lake transaction log tracks the files and other metadata\
    \ to ensure both atomic transactions and data reliability, it does not eagerly\
    \ remove the files from the disk, even though the underlying data files from the\
    \ table are removed. The `[VACUUM`] operation can be used to delete the files\
    \ that are no longer needed.\n\nFor large-scale systems built on batch or streaming,\
    \ Spark may create a lot of small files to maintain atomicity; this often leads\
    \ to a *small-file* problem where it becomes ever more inefficient to query the\
    \ **transaction log** folder (that is, **delta log subdirectory**). To handle\
    \ this issue, Delta Lake creates a checkpoint file in Parquet format after it\
    \ creates the *10^(th)* commit or transaction.\n\nCreating a transaction log after\
    \ every *10^(th)* commit helps save the entire state of the table at a point in\
    \ time in native Parquet format. This makes it quick and easy for Spark to read\
    \ and handle the small file problem.\n\n# [Time travel](#toc.xhtml#s78a)\n\nAs\
    \ you write into a Delta table or directory, every operation is automatically\
    \ versioned. You can access the different versions of the data in two different\
    \ ways:\n\n*   Delta Lake time travel allows you to safely remove data from your\
    \ Delta Lake, reverse it in case there are mistakes, and track the progress through\
    \ the Delta Lake transaction log.\n\n*   This not only helps in handling audibility\
    \ issues but also major governance and compliance tracking in a case where it’s\
    \ required to delete a specific user data from everywhere and sometimes go back\
    \ to a certain past state of the table to verify what was there.\n\nConsider GDPR,\
    \ *How would you avoid drowning in data requests use cases?*\n\n# Rollbacks and\
    \ time travel\n\nRollbacks via time travel also make it easy to reset your data\
    \ to a previous snapshot, either using a **timestamp** or using a **version number**.\n\
    \nEvery table in Delta Lake is the sum total of all of the commits recorded in\
    \ the Delta Lake transaction log. The transaction log can be considered as a *step-by-step\
    \ guide* that details exactly how to get from the table’s certain state to a required\
    \ state.\n\nThis helps to recreate the state of a table at any point in time by\
    \ starting with an original table and processing backwards or forward toward commits\
    \ made prior to that point. This ability is known as **time travel** or **data\
    \ versioning**.\n\n# Handling upstream changes\n\nMany a times, data engineers\
    \ are caught unprepared by such upstream data changes, so they struggle to reproduce\
    \ to the right state. Verifying changes via navigating through `HISTORY` can be\
    \ of great help in understanding what happened and what was instantly changed\
    \ that started breaking the pipeline.\n\nTo review the historical data, you can\
    \ run the `DESCRIBE HISTORY` command:\n\n`%sql DESCRIBE HISTORY deltaresultstore;`\n\
    \nYou can also provide the timestamp or date string as an option to the DataFrame\
    \ reader using the following syntax:\n\n`%sql`\n\n`-- Query metastore-defined\
    \ Delta table by timestamp`\n\n`SELECT * FROM deltaresultstore TIMESTAMP AS OF\
    \ “2021-12-32”`\n\n`or`\n\n`SELECT * FROM deltaresultstore TIMESTAMP AS OF date_sub(current_date(),\
    \ 1)`\n\nAs every write has a version number, you can also use the version number\
    \ to travel back in time:\n\n` %sql -- Query metastore-defined Delta table by\
    \ version`\n\n`SELECT COUNT(*) FROM deltaresultstore VERSION AS OF 2`\n\n`SELECT\
    \ COUNT(*) FROM deltaresultstore @v2 72`\n\n# Data governance and time travel\n\
    \nThe role of governance is to set the direction of protecting information in\
    \ the form of **policies**, **standards**, and **guidelines**. One of the most\
    \ common scenarios surrounding governance to protect people’s information is the\
    \ need to perform a delete request as part of any **GPDR** or **CCPA** compliance.\
    \ What that means for data engineers is that you need to locate the records from\
    \ your Delta Lake and delete them within the specified time period.\n\nUsers can\
    \ run `DESCRIBE HISTORY` to see metadata around the changes that were made. An\
    \ example of this scenario is how a company implements governance, risk, and control\
    \ for Delta Lake.\n\n# Audit and compliance with Delta Lake transaction logs\n\
    \nAs the definitive record of every change ever made to a table, the Delta Lake\
    \ transaction log offer users a verifiable data lineage that is useful for governance,\
    \ audit, and compliance purposes. It can also be used to trace the origin of an\
    \ inadvertent change or a bug in a pipeline back to the exact action that caused\
    \ it. Users can also run `DESCRIBE HISTORY` to see metadata around the changes\
    \ that were made.\n\n# [Conclusion](#toc.xhtml#s79a)\n\nIn this chapter, you learned\
    \ about Spark and its transformation to Databricks, Databricks architecture, and\
    \ how parallel data processing works. You learned about different ways to program\
    \ with Databricks using a notebook, writing pipeline, understanding the execution\
    \ matrix, and further diving into the Delta Lake and its internals. Understanding\
    \ the topics covered in this chapter will bring you confidence in developing context\
    \ around how data processing in Databricks works in general, building data quality\
    \ audit frameworks, and getting a know-how of the internals of handling audit\
    \ and compliance with features like time travel and transaction logs.\n\nIt is\
    \ now easy for you to navigate to other chapters in this book as well as to learn\
    \ and understand the advanced concepts of Databricks and Spark through Databricks\
    \ original documentation at **[https://docs.databricks.com/](https://docs.databricks.com/)**.\n\
    \n# [Multiple choice questions](#toc.xhtml#s80a)\n\n1.  Is Apache Spark 100 times\
    \ faster than Hadoop MapReduce for large-scale data processing? \n\n    1.  Yes\n\
    \n    2.  No\n\n2.  What are the components of Apache Spark? \n\n    1.  **Resilient\
    \ Distributed Dataset** (**RDD**)\n\n    2.  Data sets and data frames\n\n   \
    \ 3.  **Directed Acyclic Graph** (**DAG**)\n\n    4.  All of the above\n\n3. \
    \ \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ is a seamless way by\
    \ which we can use spark with its full potential? \n\n    1.  Data Frame\n\n \
    \   2.  Databricks\n\n    3.  Apache Hadoop\n\n    4.  Mapreduce\n\n4.  In Databricks,\
    \ how do we make the compiler know which language the cell of the notebook is\
    \ using? \n\n    1.  `@``{language Name}`\n\n    2.  `%{language Name}`\n\n  \
    \  3.  `${language Name}`\n\n    4.  `&{language Name}`\n\n# [Answers](#toc.xhtml#s81a)\n\
    \n1.  **a**\n\n2.  **d**\n\n3.  **b**\n\n4.  **b**\n\n# [CHAPTER 4](#toc.xhtml#c04)\n\
    \n# [Data Sharing and Orchestration with Databricks](#toc.xhtml#c04)\n\nDatabricks\
    \ is all about processing data of different kinds, be it real-time or batch-based\
    \ data."
