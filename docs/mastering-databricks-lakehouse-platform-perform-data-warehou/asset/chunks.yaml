  trans: "\n3. 我们还可以为开发工作创建不同的分支，创建拉请求（pull requests），并在与远程仓库集成后解决冲突：\n\n![](img/Figure-8.4.jpg)\n\
    \n**图 8.4:** Databricks 仓库 - 克隆远程仓库\n\n4. 如果你想在工作区中移动 notebook 或文件夹，请导航到该 notebook\
    \ 或文件夹，并在下拉菜单中选择 `Move`，如下所示：\n\n![](img/Figure-8.5.jpg)\n\n**图 8.5:** Databricks\
    \ 仓库 - 移动文件夹/notebook\n\n5. 一旦创建了分支，就可以点击 `Repos` 按钮并点击想要创建 notebook 或文件夹的分支来创建一个新的\
    \ notebook 或文件夹：\n\n![](img/Figure-8.6.jpg)\n\n**图 8.6:** Databricks 仓库 - 克隆远程仓库\n\
    \n我们还可以在 Databricks notebook 的单个单元格中导入 SQL 或 Python 文件：\n\n*   在 SQL 文件的顶部使用注释行\
    \ `- - Databricks notebook source`\n*   在 Python 文件的顶部使用注释行 `# Databricks notebook\
    \ source`\n\n正如章节开头讨论的，通过在 Databricks Lakehouse 平台集成 Databricks 仓库，我们还可以处理非 notebook\
    \ 文件。右键点击分支并点击 `File` 选项来创建一个新文件：\n\n![](img/Figure-8.7.jpg)\n\n**图 8.7:** Databricks\
    \ 仓库 - 创建新的非 Databricks 文件\n\n为了上传现有文件，请选择分支并点击 `Upload File(s)`：\n\n![](img/Figure-8.8.jpg)\n\
    \n**图 8.8:** Databricks 仓库 - 上传新的非 Databricks 文件\n\n我们还可以通过程序方式引用仓库中的文件，例如来自 notebook\
    \ 的 `.csv` 或 `.json` 文件。我们只能读取非 Databricks 文件，但不能在 notebook 中创建或编辑文件：\n\n```python\n\
    import pandas as pd\ndf = pd.read_csv(\"./sampledata.csv\")\n```\n\n我们还可以使用 Spark\
    \ 访问仓库中的文件。仓库中任何文件的绝对文件路径为：`/Workspace/Repos/<user_folder>/<repo_name>/file`。\n\
    \n```python\nimport os\nspark.read.format(\"csv\").load(f\"file:/Workspace/Repos/<user_folder>/<repo_name>/my_data.csv\"\
    )\n```\n\n为了与远程 Git 仓库同步，我们可以使用 git 对话框，它允许你从远程 Git 仓库拉取更改并将更改提交到远程仓库。我们可以从 Databricks\
    \ notebook 访问 Git 对话框，如下：\n\n![](img/Figure-8.9.jpg)\n\n**图 8.9:** Databricks\
    \ 仓库 - Git 对话框\n\n一旦你点击分支，就会出现 Git 对话框，如下：\n\n![](img/Figure-8.10.jpg)\n\n**图\
    \ 8.10:** Databricks 仓库 - Git 对话框提交和推送请求\n\n完成代码更改后，你可以打开 Git 对话框并将更改提交并推送到仓库：\n\
    \n![](img/Figure-8.11.jpg)\n\n**图 8.11:** Databricks 仓库 - 提交并推送更改\n\n如果你想从远程仓库拉取源代码内容，请点击\
    \ `Pull` 按钮从远程仓库拉取更改：\n\n![](img/Figure-8.12.jpg)\n\n**图 8.12:** Databricks 仓库\
    \ - 拉取更改\n\n点击 `Confirm` 提交拉取请求：\n\n![](img/Figure-8.13.jpg)\n\n**图 8.13:** Databricks\
    \ 仓库 - 确认拉取更改\n\n使用非 Databricks notebook 文件及其与 Databricks 仓库集成具有多种优势。\n\n### Git\
    \ 集成非 Databricks notebook 文件的优势如下。\n\n以下图片显示了 Databricks 仓库的非 Databricks 文件：\n\
    \n![](img/Figure-8.14.jpg)\n\n**图 8.14:** Databricks 仓库 - 非 Databricks 文件\n\n\
    *   **代码可重用性**：可以在仓库以及 Databricks notebooks 中通过 `import` 函数引用现有的 Python 和 R 模块。\n\
    *   **随代码一起存储环境特定信息**：\n    *   为了在处理 Databricks notebook 时创建通用代码库，我们通常创建配置文件来存储环境特定值，以及用于安装依赖库的\
    \ `requirement.txt` 文件。\n    *   随着非 Databricks notebook 文件的引入，我们可以减少手动管理环境的负担并消除人为错误。\n\
    *   **多环境的自动化部署**：我们可以在配置文件中存储环境特定信息（例如作业和集群），并可以使用配置文件实现跨多个环境的自动化部署。\n\n我们还可以配置和管理\
    \ Databricks 仓库的权限。管理员可以管理允许列表，以限制哪些远程用户可以在分支中提交和推送更改。\n\n进入 `Settings`，选择管理员\
    \ `console`，选择 `Workspace settings` 选项卡，并选择 `Enable repos Git URL Allow List`\
    \ 选项。\n\n拥有权限的用户可以向 Git 仓库提交并推送更改。默认设置为空，由管理员配置的用户可以向仓库提交更改：\n\n![](img/Figure-8.15.jpg)\n\
    \n**图 8.15:** Databricks 工作区设置 - 启用仓库 URL 列表\n\n在了解不同的功能和配置方法后，让我们探索使用 Databricks\
    \ 仓库的最佳实践。我们将尝试理解在 Databricks Lakehouse 平台上工作的最佳实践：\n\n*   Databricks 工作区管理员\n\
    *   数据科学与工程团队\n*   Git 集成\n\n为了实施最佳实践，我们需要在 Databricks 平台中配置一些设置，并在 Git 工具中进行一些配置：\n\
    \n![](img/Figure-8.16.jpg)\n\n**图 8.16:** Git 集成的 Databricks 最佳实践\n\n#### Databricks\
    \ 工作区管理员\n当我们使用 Databricks 时，平台上有两种类型的文件夹：\n\n*   **用户级文件夹**：为所有首次登录平台的用户自动创建用户级文件夹。\n\
    *   **根目录（非用户级）**：\n    *   非用户级文件夹只能由管理员创建，并由拥有权限的用户管理。\n    *   顶层目录的最常见用例是创建\
    \ `dev`、`staging` 和 `production` 文件夹，分别包含开发、测试和生产环境的版本控制/分支仓库：\n\n        ![](img/Figure-9.17.jpg)\n\
    \n        **图 8.17:** Databricks 工作区\n\n#### 数据科学与工程团队\n数据工程师或数据科学家可以从克隆仓库或使用\
    \ Databricks 仓库创建一个新仓库开始。下一步是创建一个相应的功能分支或使用现有分支。选择分支后，数据工程师或数据科学家可以进行所需的更改并提交到分支。一旦代码就绪，他们可以创建拉请求来审核并合并更改到\
    \ Git。\n\n#### Git 集成\n在使用 Databricks 进行开发活动时，推荐的实践是使用 Databricks 仓库启用 Git 集成。为每个新功能开始创建功能分支并与远程仓库同步。代码更改完成后，向主分支创建合并/拉取请求：\n\
    \n将 Databricks 仓库与 Git 工具集成的有多种方法：\n\n1. **使用 Databricks 仓库 Git 集成功能**\n   我们可以从\
    \ Git 版本控制工具本身配置 Databricks 仓库。让我们以从 Azure DevOps 工具配置 Databricks 仓库为例。\n\n  \
    \ 进入您的 Azure DevOps 组织，选择要配置的仓库，并复制克隆仓库的链接。\n"
- fmt: "\nNow, go to the `user settings` from the Databricks UI and select the `Git\
    \ Integration` tab, as shown in the following screenshot:\n\n![](images/Figure-8.19.jpg)\n\
    \n**Figure 8.19:** Databricks user settings - Git integration\n\nNow, select the\
    \ notebook, click on `Revision history`, and input the Git repo link, including\
    \ the branch and input path.\n\n## 2. Using Databricks CLI\n\nIt is a tedious\
    \ task to manually push the individual notebooks to the remote repository. We\
    \ can also use the `Databricks CLI` to download the code onto the local machine\
    \ and upload it to the repository using the `Git` command line.\n\nOnce the code\
    \ is exported to the local machine, use the `git` command to check-in the code\
    \ to the remote Azure DevOps repo:\n\n```bash\ngit init\ngit add *\ngit commit\
    \ -m “commit code”\ngit remote add origin https://<xxxx/yyyy>//_git/SyncDatabricks\n\
    git push -u origin master\n```\n\nAfter understanding the features and best practices\
    \ of working with Databricks repos, let’s also explore the limitations of this\
    \ feature:\n\n* **Missing merge functionality with Git dialog**: When the development\
    \ branch falls behind the master branch from the remote repo, it is not possible\
    \ to update the branch from the Databricks to avoid the merge conflicts during\
    \ the pull request.\n* **Syncing of delete branches from the remote repos**: After\
    \ integrating the repos with Databricks platform, even though the branches are\
    \ deleted from the remote repos, they won’t be deleted from the list of branches\
    \ with the Databricks repos.\n\n# Automated multi environment CI/CD deployment\
    \ with DevOps\n\nThe CI/CD way of working is a modern software development practice\
    \ that focuses on the frequent incremental code changes with `automated testing`,\
    \ `package screening`, `static code analysis`, and so on to improve the code quality\
    \ of the deliverables.\n\nContinuous integration pipeline automates build and\
    \ tests steps to ensure that the request code changes are as per the standard\
    \ and reliable before merging the changes to the master branch.\n\nOnce the continuous\
    \ integration pipeline is successful, it will trigger the release pipeline to\
    \ deploy the code/merged changes from the master branch to higher environments:\n\
    \n![](images/Figure-8.20.jpg)\n\n**Figure 8.20:** Continuous integration and deployment\n\
    \nLet’s first understand the high-level steps involved in implementing continuous\
    \ integration and deployment while working with the Databricks platform:\n\n*\
    \ **Continuous integration**\n    1. **Databricks notebooks and source code interaction**:\n\
    \        1. Develop the source code and perform tests using Databricks platform\
    \ or using IDEs\n        2. Perform unit, integration, and regression tests\n\
    \        3. Commit the source code and changes to the `Git` branch\n    2. **Build\
    \ pipeline for continuous integration**:\n        1. Pull the new code changes\
    \ temporarily\n        2. Run automated tests\n        3. Merge the requested\
    \ changes to the master branch\n        4. Build the package/libraries from the\
    \ source code\n    3. **Create artifacts to trigger the release process:**\n \
    \       Create artifacts and trigger the release pipeline for the deployment\n\
    * **Continuous deployment**\n    1. **Deploy Databricks notebooks for continuous\
    \ deployment**:\n        1. Deploy the Databricks notebooks to the respective\
    \ environment, along with the configuration files and related package dependencies\n\
    \        2. Deploy libraries for code reusability\n    2. **Automated testing**\n\
    \        Run automated tests in respective environments and repost the test results\n\
    \    3. **Operationalize Databricks notebooks**:\n        Once the notebooks are\
    \ deployed, schedule the notebooks for your data and AI workload as per the requirements\n\
    \nAfter understanding the high-level steps of implementing CI/CD pipeline with\
    \ Databricks, let us understand how to create, build, and release pipeline:\n\n\
    ## 1. Integration with Git tools\n\nThe first step is to integrate your Databricks\
    \ notebooks with the `Git` tools using the `Databricks repos` feature. We can\
    \ sync the work done in Databricks with the remote repos of various `Git` providers\
    \ to utilize various features of `version controlling`, `branch policies`, and\
    \ so on.\n\nRefer to the *Repos for Git Integration* section to understand how\
    \ to configure Databricks repos and best practices to implement the `Git` integration.\n\
    \nOnce the `Git` integration is successful, the next step is to create build pipelines:\n\
    \n![](images/Figure-8.21.jpg)\n\n**Figure 8.21:** CI/CD with Git\n\n## 2. Build\
    \ pipeline\n\nWe need to configure build pipelines for the artifacts to be deployed.\
    \ We can use `Azure DevOps`, `Jenkins`, and other tools:\n\n### Build pipeline\
    \ in Azure DevOps\n\nAzure DevOps is a cloud-based interface for CI/CD. First,\
    \ go to `Azure DevOps`, select `Pipelines`, and click on `New Pipeline`:\n\n![](images/Figure-8.22.jpg)\n\
    \n**Figure 8.22:** Databricks - Azure DevOps build pipeline\n\nClick on `New Pipeline`\
    \ button to open the pipeline editor and build the `azure-pipelines.yml` file.\
    \ Then, configure the build agent and set up the pipeline, including downloading\
    \ the artifacts, performing the automation test, and creating a package to deploy.\n\
    \n* **Configure build agent**\n```yaml\ntrigger:\n- release\npool:\n  name: Hosted\
    \ Ubuntu 1604\n```\n\n* **Set up the pipeline to install Python and related packages**:\n\
    ```yaml\n# Use Python\n- task: UsePythonVersion@0\n  displayName: 'Use Python\
    \ 3.7'\n  inputs:\n    versionSpec: '3.7'\n\n# Install dependencies\n- script:\
    \ |\n    pip install pytest requests setuptools wheel\n    pip install -U databricks-connect==6..*\n\
    \  displayName: 'Install Python Dependencies'\n\n# Use environment variables for\
    \ Databricks Connect\n- script: |\n    echo “y\n    $(WORKSPACE-REGION-URL)\n\
    \    $(CSE-DEVELOP-PAT)\n    $(EXISTING-CLUSTER-ID)\n    $(WORKSPACE-ORG-ID)\n\
    \    15001” | databricks-connect configure\n  displayName: 'Configure Databricks\
    \ Connect'\n```\n\n* **Generate and store deployment artifacts**:\n```yaml\n-\
    \ task: ArchiveFiles@2\n  inputs:\n    rootFolderOrFile: '$(Build.BinariesDirectory)'\n\
    \    includeRootFolder: false\n    archiveType: 'zip'\n    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'\n\
    \    replaceExistingArchive: true\n\n- task: PublishBuildArtifacts@1\n  inputs:\n\
    \    ArtifactName: 'PublishArtifacts'\n```\n\n### Build pipeline using Jenkins\n\
    \nJenkins has different project types to create CI/CD pipelines. First of all,\
    \ go to the Jenkins UI to define multiple stages in the pipeline:\n\n![](images/Figure-8.23.jpg)\n\
    \n**Figure 8.23:** Databricks - Build pipeline in Jenkins\n\nThe next step is\
    \ to write a pipeline definition in the text file that is checked into the project’s\
    \ source control repository. In the setup stage, configure the `Databricks CLI`\
    \ connection with the connection information. Finally, create a stage to generate\
    \ and store the deployment artifacts to trigger the release pipelines.\n"
