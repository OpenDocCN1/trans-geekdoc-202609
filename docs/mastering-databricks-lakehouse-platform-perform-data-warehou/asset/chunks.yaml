    \ true`\n\n*   **Connect to the cluster using the JDBC/ODBC connections**: We\
    \ can use JDBC URL and HTTP path to connect to the Databricks cluster to Qlik\
    \ using the JDBC/ODBC properties.\n*   **Configure Qlik with Databricks**: Configure\
    \ the Qlik with Databricks to connect to the Databricks workspace.\n\nApart from\
