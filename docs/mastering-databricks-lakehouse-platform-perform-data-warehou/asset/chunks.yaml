    \ which requires us to use *non-relational tools* to our toolset. It has become\
    \ an initial and critical step not only for data warehousing but also for machine\
    \ learning and AI related activities, making Databricks the most famous tool for\
    \ the community.\n\nIf you want to start with the free trial of Databricks instance,\
    \ register for the Databricks Community Edition. When you open the Databricks\
    \ front page, Databricks UI for `Data Science & Engineering` as follows:\n\n![](images/Figure-1.2.jpg)\n\
    \n**Figure 1.2**: Databricks for Data Science and Data Engineering\n\nAs highlighted\
    \ below, from the side bar, you can select the persona to use from the Databricks\
    \ platform: `Data Science & Engineering`, `Machine Learning`:\n\n![](images/Figure-1.3.jpg)\n\
    \n**Figure 1.3**: Databricks - Data Science and Engineering\n\nYou can click on\
    \ the `Help` button if you need any help to work with the Databricks Lakehouse\
    \ platform:\n\n![](images/Figure-1.4.jpg)\n\n**Figure 1.4**: Databricks settings\n\
    \nBefore we start working with Data Science and Engineering workloads on Databricks\
    \ Lakehouse platform, we need to understand the fundamental concepts to use the\
    \ Databricks workspace efficiently:\n\n*   **Workspace**: Environment for accessing\
    \ all the Databricks assets.\n\n*   **Interface**: Graphical interface to work\
    \ with Databricks platform.\n\n*   **Data management**: Store data to perform\
    \ analytics and build machine learning models.\n\n*   **Computation management**:\
    \ Computations used to run jobs and notebooks in Databricks.\n\n*   **Machine\
    \ learning**: To perform machine learning-related activities.\n\n*   **Authentication\
    \ and authorization**: Manage authentication and authorization of the Databricks\
    \ Lakehouse platform.\n\n# [Databricks SQL](#toc.xhtml#s10a)\n\nDatabricks SQL\
    \ is an integrated query execution tool for running *ad-hoc queries* and creating\
    \ a dashboard on the data that is stored on Data Lake.\n\nDatabricks SQL contains\
    \ two main components:\n\n*   SQL endpoint\n\n*   Query\n\nThey are explained\
    \ as follows:\n\n*   **SQL endpoint:** SQL Endpoint is a serverless compute service.\
    \ For executing SQL queries, we will use SQL endpoints for computation that will\
    \ help us run SQL commands on data objects within the Databricks environment.\n\
    \n    Classic SQL endpoint (default SQL endpoint) uses the computational resources\
    \ in AWS Cloud.\n\n    We can also create Databricks managed SQL endpoints, called\
    \ **Serverless SQL endpoints,** that utilize compute resources in Databrick cloud\
    \ accounts. Using serverless endpoints simplifies SQL endpoint management and\
    \ accelerates launch times."
