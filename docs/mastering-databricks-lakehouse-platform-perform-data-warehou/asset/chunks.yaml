  trans: "\n\n**图 5.27:** Delta Live Table - 可查询\n\n7. 一完成配置后，启动流水线；这将数据输出到表中，如下所示：\n\
    \n![](img/Figure-5.28.jpg)\n\n**图 5.28:** Delta Live Table 输出表\n\n在了解 Delta Live\
    \ Table 的开发流程后，让我们来看看 Delta Live Table 实现的用例：\n\n*   **实现合规性要求**：我们可以为了分析和审计目的捕捉有关表的所有信息。我们还可以了解数据如何流动以满足合规性要求。\n\
    *   **简化数据流水线的开发、部署和测试**：我们可以捕获并维护数据血缘信息，以保持各处的数据都是最新的。我们可以在所有环境中查询相同的数据。\n* \
    \  **支持批处理和流式数据降低操作复杂性**：我们可以构建并创建批处理和流式流水线来捕获并自动刷新数据，这将节省大量时间并降低复杂性。\n*   内置数据质量、日志和实时数据更新的高效监控。\n\
    \n# Delta Live Table 配置\n\nDelta Live Table 配置设置包含了一列表 Databricks 笔记本，这些笔记本实现了流水线和参数，这些参数指定了如何在开发、测试、验收和生产等环境中执行流水线。\n\
    \n我们可以以 JSON 的形式指定 Delta Live Table，也可以从 Delta Live Table UI 中修改设置。\n\n现在，让我们详细探索不同的\
    \ Delta Live Table 设置：\n\n| 字段名称 | 类型 | 说明 |\n| --- | --- | --- |\n| `id` | string\
    \ | 流水线唯一标识符 |\n| `name` | string | 流水线名称 |\n| `storage` | string | 流水线执行输出的 DBFS\
    \ 位置或云存储 |\n| `configuration` | object | Spark 集群配置 |\n| `Libraries` | object\
    \ array | Databricks 笔记本数组 |\n| `clusters` | object array | 运行流水线的集群 |\n| `continuous`\
    \ | string | 检查流水线运行是否持续持续的标志 |\n| `target` | string | 持久化流水线输出的数据库名称 |\n\n**表\
    \ 5.1:** Delta Live Table 设置\n\n我们还可以用 JSON 格式配置流水线使用的集群。我们可以为 `default cluster`（默认集群）和\
    \ `maintenance cluster`（维护集群）指定配置：\n\n**示例：**\n\n```\n{\n“clusters”: [\n{\n“label”:\
    \ “default”,\n“node_type_id”: “c5.4xlarge”,\n“driver_node_type_id”: “c5.4xlarge”,\n\
    “num_workers”: 20,\n“spark_conf”: {\n“spark.databricks.io.parquet.nativeReader.enabled”:\
    \ “false”\n},\n“aws_attributes”: {\n“instance_profile_arn”: “arn:aws:...”\n}\n\
    },\n{\n“label”: “maintenance”,\n“aws_attributes”: {\n“instance_profile_arn”: “arn:aws:...”\n\
    }\n}\n]\n}\n```\n\n我们还可以在流水线中配置多个笔记本。我们必须使用 `libraries` 字段来配置包含多个笔记本的流水线。按顺序添加笔记本是灵活的，因为\
    \ Delta Live Table 会分析数据集之间的依赖关系，以构建流水线的处理图。\n\n例如，以下配置将创建一个流水线，该流水线包含 `notebook_1`\
    \ 和 `notebook_2` 中定义的数据集：\n\n```json\n{\n“name”: “pipeline”,\n“storage”: “dbfs:/pipeline-examples/storage-location/example”,\n\
    “libraries”: [\n{ “notebook”: { “path”: “/notebook_1” } },\n{ “notebook”: { “path”:\
    \ “/notebook_2” } }\n]\n}\n```\n\n以下示例将创建配置，使用 DBFS 进行存储并在单节点集群上运行在 `notebook_1`\
    \ 中实现的流水线：\n\n```json\n{\n“name”: “pipeline”,\n“storage”: “dbfs:/pipeline-examples/storage-location/example1”,\n\
    “clusters”: [\n{\n“num_workers”: 1,\n“spark_conf”: {}\n}\n],\n“libraries”: [\n\
    {\n“notebook”: { “path”: “/Users/user@databricks.com/notebook_1” }\n}\n],\n“continuous”:\
    \ false\n}\n```\n\n**我们无法为集群配置指定 spark 版本。Delta Live Table 集群在自定义版本的 Databricks\
    \ 运行时上运行，该运行时会随之更新以获取最新的补丁。**\n\n# 结论\n\n在本章中，我们详细探讨了 delta live table 的概念及其功能和组件。你还详细了解了如何使用\
    \ Python、SQL 和 REST API 创建 Delta Live Table 流水线。此外，你还概述了创建 Delta Live Table 流水线时如何配置不同的组件。\n\
    \n# 单选题\n\n1. 下列中哪一项可以使用 Delta Live Table 实现？\n    1. 编排\n    2. 集群管理\n    3.\
    \ 监控\n    4. 以上所有\n2. 我们可以使用 Delta Live Table 实现自动化测试吗？\n    1. 是\n    2. 否\n\
    3. 什么类型的数据集可以用于 Delta Table？\n    1. 表\n    2. 视图\n    3. 两者都有\n4. 是否可以使用 REST\
    \ API 创建 Delta Table 流线？\n    1. 是\n    2. 否\n5. 在创建 Delta Table 流水线时可以配置存储？\n\
    \    1. 是\n    2. 否\n\n# 答案\n\n1. **d**\n2. **a**\n3. **c**\n4. **a**\n5. **a**\n\
    \n# 第 6 章\n\n# 使用 Delta Lake 实现 SCD 类型 2\n\nDatabricks Lakehouse 平台具有启用实时数据的能力。在上一章中，我们探索了如何使用\
    \ Delta Live Tables 简化数据工程。在本章中，你将学习使用 *structured streaming* 进行数据的实时流处理。\n\n\
    # 结构\n\n在本章中，你将学习 Databricks Lakehouse 的以下方面：\n\n*   使用结构化流处理数据\n*   变更数据馈\n\n\
    # 目标\n\n学习本章后，我们将能够使用 Databricks 实现 **SCD 类型 2** 数据的历史化。\n\n# 使用结构化流处理数据\n\n处理流式数据与处理批数据不同。Apache\
    \ Spark 结构化流构建在 **Spark API** 之上以利用其优化。通过流式处理，我们可以从源近实时处理数据并输出到外部系统：\n\n![](img/Figure-6.1.jpg)\n\
    \n**图 6.1:** 流式处理：输入、流式引擎、输出\n\n流式处理有三个主要组件：\n\n![](img/Figure-6.2.jpg)\n\n**图\
    \ 6.2:** 流式处理组件\n\n*   **源输入**：输入源可以是流式 **Kafka**、**Flume**、**HDFS** 等。\n*   **流式引擎**：流式引擎处理来自各种输入源的入数据。\n\
    *   **输出**：输出负责存储来自流式引擎的处理数据，如 HDFS、关系型数据库或 NoSQL 数据库。\n\n让我们将流式处理理解为无边界表，新数据将在未来到达时追加：\n\
    \n![](img/Figure-6.3.jpg)\n\n**图 6.3:** 作为无边界表的流式数据\n\nSpark 以*微批*的形式处理数据，这些微批由处理数据的触发器定义。考虑一个例子：当我们定义触发器为\
    \ *1 分钟*时，spark 每分钟创建一个微批并进行相应处理。在根据触发器摄数据时，我们可以以多种模式输出数据：\n\n*   **追加模式 (Append\
    \ mode)**：在追加模式下，Spark 只输出上一次触发器处理的新记录。\n*   **更新模式 (Update mode)**：在此模式下，Spark\
    \ 将输出上一次触发器更新的行。如果没有启用对流式数据的聚合，则其行为与追加模式相似。\n\n"
- fmt: "\n**Complete mode**: In this mode, `Spark` will output all the rows that have\
    \ been processed so far:\n\n![](images/Figure-6.4.jpg)\n\n**Figure 6.4:** Streaming\
    \ output modes\n\nLet’s take an example of building the streaming application\
    \ using **Spark streaming**:\n\n1. First, list down all the files from the sample\
    \ dataset path: `/databricks-datasets/structured-streaming/events/`.\n\n   There\
    \ are around **50** JSON files in the sample dataset. Each JSON file contains\
    \ records in the form of key-value pairs.\n\n   **An example is as follows:**\n\
    \n   `{\"time”:1469501107,”action”:”Open”}`\n   `{\"time”:1469501147,”action”:”Open”}`\n\
    \   `{\"time”:1469501202,”action”:”Open”}`\n   `{\"time”:1469501219,”action”:”Open”}`\n\
    \n   ![](images/Figure-6.5.jpg)\n\n   **Figure 6.5:** Sample dataset streaming\
    \ data\n\n2. The next step in attempting to process the data is to query the input\
    \ data interactively. In order to do that, we first need to create the `DataFrame`\
    \ on the files and give the table name.\n\n   Reference code is as follows:\n\n\
    \   ```python\n   from pyspark.sql.types import *\n   inputPath = \"/databricks-datasets/structured-streaming/events/\"\
    \n   # Create the schema\n   jsonSchema = StructType([StructField(\"time\", TimestampType(),\
    \ True), StructField(\"action\", StringType(), True)])\n   # Create the data frame\n\
    \   InputDF = (spark.read.schema(jsonSchema).json(inputPath))\n   display(InputDF)\n\
    \   ```\n\n   ![](images/Figure-6.6.jpg)\n\n   **Figure 6.6:** DataFrame output\n\
    \n3. Now, we can compute the number of `open` and `close` actions within the `1\
    \ hour` window:\n\n   ```python\n   from pyspark.sql.functions import *\n   #\
    \ Create the DataFrame and cache it\n   CountsDF=(InputDF.groupBy(InputDF.action,window(InputDF.time,”1\
    \ hour”)).count())\n   CountsDF.cache()\n   # Register the DataFrame\n   CountsDF.createOrReplaceTempView(\"\
    Counts\")\n   ```\n\n4. We can now use the SQL to query the table:\n\n   ![](images/Figure-6.7.jpg)\n\
    \n   **Figure 6.7:** Total counts across all hours\n\n5. After understanding the\
    \ data interactively, let’s convert it to the streaming query, which will continuously\
    \ update the data as it comes. We need to create the streaming example by emulating\
    \ the stream of data by reading one file at a time:\n\n   ```python\n   from pyspark.sql.functions\
    \ import *\n   streamingInputDF=(spark.readStream.schema(jsonSchema).option(“maxFilesPerTrigger”,\
    \ 1).json(inputPath))\n   streamingCountsDF=(streamingInputDF.groupBy(streamingInputDF.action,\
    \ window(streamingInputDF.time, “1 hour”)).count())\n   streamingCountsDF.isStreaming\n\
    \   Out[3]: True\n   ```\n\n   From the preceding code, we can see that the `DataFrame`\
    \ `streamingCountsDF` is a streaming `DataFrame`. We can now start the streaming\
    \ computation by defining the sink:\n\n   ![](images/Figure-6.8.jpg)\n\n   **Figure\
    \ 6.8:** Streaming DataFrame\n\n6. Here, **the query** continuously picks up the\
    \ files and updates the `window` counts:\n\n   ![](images/Figure-6.9.jpg)\n\n\
    \   **Figure 6.9:** Streaming DataFrame visualization dashboards\n\n**Event time**\
    \ is the time embedded in the data itself. Many applications want to operate in\
    \ near *real time*. For example, if we want to get the number of events generated\
    \ by the IOT device every minute, we want to use the time when the data was generated\
    \ rather than the time when `Spark` received the data. Delivering end to end exactly\
    \ one semantics is one of the major goals of structured streaming:\n\n![](images/Figure-6.10.jpg)\n\
    \n**Figure 6.10:** Windowed grouped aggregation\n\n**Aggregation** with the sliding\
    \ event window is straightforward with the structure streaming, and it is very\
    \ similar to the grouped aggregations. **Grouped aggregations** aggregate the\
    \ value maintained for each unique value. In case of **window-based aggregations**,\
    \ aggregate values are maintained for each window.\n\nStructured streaming in\
    \ Databricks has built-in support for many streaming data sources and sinks. Let’s\
    \ take an example of Delta Lake structured streaming with Amazon Kinesis. Here,\
    \ we will use `kinesis` as a streaming source with `Delta Lake` and `apache structured\
    \ streaming`.\n\n**Amazon Kinesis** makes it easy to collect, process, and analyze\
    \ real-time, streaming data so we can get timely insights and react quickly to\
    \ new information. Amazon Kinesis offers key capabilities to cost-effectively\
    \ process streaming data at any scale, along with the flexibility to choose the\
    \ tools that best suit the requirements of your application:\n\n![](images/Figure-6.11.jpg)\n\
    \n**Figure 6.11:** Amazon Kinesis\n\n**Amazon Kinesis** is also known as **KDS**.\
    \ It is a popular choice for the streaming data service on AWS since it provides\
    \ ease of use and serverless setup. It has individual throughput units known as\
    \ **shards**.\n\nOnce we collect the data in `KDS`, we can use structured streaming\
    \ for applications such as **Analytics**, **Clickstream**, and **Real Time Insights**.\
    \ Before we deep dive, let’s look at the reference architecture. In order to understand\
    \ the use case, we first understand the `kinesis` as a streaming source. Key considerations\
    \ and best practices are as follows:\n\n![](images/Figure-6.12.jpg)\n\n**Figure\
    \ 6.12:** Kinesis fetcher\n\n*   **Databricks runtime**: Databricks recommends\
    \ using **Databricks runtime 6.5** or above.\n*   **Optimize prefetching**: The\
    \ kinesis source executes the Spark jobs in a background thread to pre-fetch data\
    \ and cache it in the memory of the Spark executors. Default setting for the `shardsPerTask`\
    \ configuration parameter is `5`. This might be a good starting point.\n*   **Reduce\
    \ rate limit errors**: An amount of data read from `kinesis` can be reduced by\
    \ *half* each time it encounters a rate limiting error and records events in the\
    \ log. In **Databricks Runtime 6.4** and below, consistent kinesis rate limiting\
    \ can lead to a stream being consumed at *1 kb/sec*.\n*   **Enable S3 VPC endpoints**:\
    \ `Databricks`’s recommendation is to enable S3 VPC endpoints to ensure that all\
    \ S3 traffic is routed on the AWS network:\n\n    ![](images/Figure-6.14.jpg)\n\
    \n    **Figure 6.14:** Reference architecture: Structured streaming with KDS\n\
    \n*   **Monitor streaming applications**: Databricks recommends using Spark’s\
    \ **Streaming Query Listener** implementation to monitor streaming applications.\
    \ Observable metrics are named **arbitrary aggregate functions**, which can be\
    \ defined on a `DataFrame`.\n\nThe listener depends on the execution mode:\n\n\
    *   **Batch mode**: `QueryExecutionListener` is called when the query completes.\
    \ Access the metrics using the `QueryExecution.observedMetrics map`:\n*   **Streaming**:\
    \ `StreamingQueryListener` is called when the streaming query completes an *epoch*.\
    \ Databricks does not support continuous execution streaming.\n"
