  trans: "\n要更新多任务格式作业的设置，你必须使用唯一的 `Task key` 字段来识别新任务设置。请参考[创建 ([`docs.databricks.com/data-engineering/jobs/jobs-api-updates.html#create-job)`](https://docs.databricks.com/data-engineering/jobs/jobs-api-updates.html#create-job)，查看一个指定多个任务的作业设置示例。\n\
    \n- **重置 (Reset)**：要使用 jobs API 中的 `覆盖作业的所有设置操作 (POST /jobs/reset)` 来重写单任务格式作业的设置，无需更改现有的客户端。\n\
    - **列出 (List)**：使用 jobs API 中的 `获取作业列表 (GET /jobs/list)` 来获取作业列表。对于多任务格式作业，大多数设置定义在任务级别而非作业级别。集群配置可以设置在任务级别或作业级别，以便修改客户端以访问作业作业结构中返回的多任务格式作业的集群或任务设置：\n\
    \    - 解析多任务格式作业的 `job_id` 字段。\n    - 将 `job_id` 传递给 jobs API 中的作业操作 (`GET /jobs/get`)\
    \ 以检索作业详情。\n- **获取 (Get)**：使用 jobs API 中的 `获取作业操作 (GET /jobs/get)`。多任务格式作业返回一个包含任务设置的任务数据结构数组。如果你需要访问任务级别的详细信息，需要修改客户端以遍历任务数组并提取所需的字段。\n\
    \n这些只是帮助你开始使用作业 API 的几个示例。如需了解更详细的知识，你可以参考 Databricks 文档。\n\n**https://docs.databricks.com/dev-tools/api/**\n\
    \n# 结论问题\n\n1. 下列哪种云工具集可以用于编排 Databricks 工作流？\n    1. AWS 上的 Airflow（Amazon 管理\
    \ apache airflow）\n    2. Azure 上的 Data Factory\n    3. Delta Live tables\n  \
    \  4. 以上所有\n2. 使用 Data Factory 进行编排的不同方法有哪些？\n    1. 导入 Databricks notebook 并在\
    \ Azure data factory 流水线中执行\n    2. 使用 `Notebook` 或 `Python` 活动\n    3. 使用 Azure\
    \ functions 导入流水线文件\n3. 如何在 Databricks 中创建作业？\n    1. 通过 jobs UI\n    2. 通过 jobs\
    \ API\n    3. 通过 Azure CLI\n    4. 通过 Databricks CLI\n4. Databricks 维护的作业运行历史长达\
    \ \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 天？\n    1. 30 天\n    2. 50 天\n    3. 60 天\n \
    \   4. 100 天\n\n# 答案\n\n1. **d**\n2. **a, b**\n3. **a, b, d**\n4. **c**\n\n# 第\
    \ 5 章：使用 Delta Live Tables 简化 ETL\n\n**Live Tables** 是一个帮助数据工程团队构建可靠数据流水线的框架，以便在\
    \ delta lake 上提供高质量数据。Delta live tables 通过自动测试和端到端流水线监控的可见性，简化了 ETL 流水线的开发。\n\n\
    在上一章中，我们探索了如何从 Databricks Lakehouse 平台进行数据共享。你还详细学习了如何使用 Databricks UI 以及 API\
    \ 调度和管理作业。\n\n# 结构\n\n本章涉及 Delta Live Tables 组件以及如何使用它们来实现和运行 Delta Live Tables\
    \ 流水线。本章涵盖的主题有：\n- Delta Live Tables 概念\n- 使用 Delta Live Tables 开发工作流\n- Delta\
    \ Live Table 配置\n\n# 目标\n\n学习本章后，你应该能够详细理解 Delta Live Tables 的基础知识。我们还将查看创建一个开发工作流，使用\
    \ Delta Live Tables 构建 ETL 流水线，以简化开发、测试和监控。此外，我们将探索如何配置 Delta Live Tables。\n\n\
    # Delta Live Table 概念\n\n**Delta Live Table** 是在 Lakehouse 平台上创建可靠、可维护且稳定的数据处理流水线的基础。它使得设计数据质量变得更容易。\n\
    \nDelta Live Table 可用于创建简化的 ETL 流水线：\n- 编排\n- 集群管理\n- 监控\n- 数据质量\n- 高效错误处理\n\n\
    Delta Live Table 的功能如下：\n- **创建流水线的便利性**：通过 Live Table，我们可以轻松创建端到端流水线（参见..），从数据源获取数据到转换逻辑再到输出到目的地，无需手动集成这些阶段：\n\
    ```\n图 5.1\n```\n图 5.1：Live Table 流水线\n\n- **自动测试**：使用 Live Table 可以实现 BI、数据科学和机器学习用例。我们还可以随着时间增强并监控数据质量趋势，以了解数据如何演变。\n\
    - **恢复与详细监控**：通过启用自动错误处理，我们可以减少停机时间并实现一键快速部署：\n```\n图 5.2\n```\n图 5.2：恢复与端到端监控\n\
    \n图片来源：https://databricks.com/product/delta-live-tables\n\n# Delta Live Table\
    \ 组件\n\n让我们了解 Delta Live Table 的组件以及如何组合它们创建一个 Delta Live Table 流水线：\n- **流水线\
    \ (Pipeline)**：流水线是 Delta Live Table 执行的基本单元。流水线可以被视为有向无环图 (DAG)，连接源数据集到目标数据集的数据。\n\
    可以使用 SQL 查询或 Python 创建 delta live tables。我们还需要配置作业设置来运行作业，包括数据集的数据质量约束。\n\n流水线的子组件定义如下：\n\
    - **查询 (Queries)**：流水线查询包含使用 Python 或 SQL 从源数据集到目标数据集的数据转换实现逻辑。\n- **期望 (Expectations)**：我们可以指定数据质量期望来控制数据集的数据质量。期望提供了灵活性，即使记录不符合标准也可以处理这些记录。我们可以定义期望在记录失败时保留/删除记录或挂起流水线。\n\
    - **作业设置 (Pipeline settings)**：我们可以以 JSON 格式定义作业设置，包含运行作业所需的参数：\n    - 库\n   \
    \ - 云存储位置\n    - 其他依赖 Python 包\n- **流水线更新 (Pipeline update)**：一旦创建了流水线，就可以启动更新来运行流水线。更新将执行以下活动：\n\
    \    - 启动 Databricks 集群\n    - 发现所有表和视图"
- fmt: "\n- Create/update all tables and views with the most recent data\n\n- **Datasets**:\
    \ Delta Live Table pipeline has two types of datasets:\n\n    - **Views**: Views\
    \ in the Delta Live Table are the same as temporary views in SQL. Views simplify\
    \ the query by breaking down the complex queries into the simpler and smaller\
    \ queries. Views exist only during the pipeline run and can’t be queries interactively.\n\
    \n    - **Tables**: Delta Live Table creates tables in the delta format and makes\
    \ sure they are updated with the results which the query creates. If table is\
    \ an incremental table, then data will be continuously ingested into the table.\n\
    \n      We can also create temporary tables, as follows, to prevent the publishing\
    \ of tables that should not be accessed for external use:\n\n      ![](images/Figure-5.3.jpg)\n\
    \n      **Figure 5.3**: Temporary table\n\n- **Continuous and triggered pipelines**:\
    \ We can create Delta Live Tables with continuous and triggered pipelines. \n\n\
    \    - **Triggered pipelines**: It will update the table when the data is available\
    \ for the Delta Live Table. It will also stop the cluster once the data update\
    \ is done. Delta Live Table analyzes the dependencies between the tables. Tables\
    \ will be updated by the pipeline when the dependent tables are updated.\n\n \
    \   - **Continuous pipeline**: Continuous pipelines will update the tables continuously\
    \ whenever the input data changes. The advantage of a continuous pipeline is that\
    \ most recent data will be available and accessible, but it requires always running\
    \ clusters.\n\n      We can configure the execution mode flag using the `continuous`\
    \ flag in the pipeline setting. By default, the execution mode is `triggered only`,\
    \ as shown here:\n\n      ![](images/Figure-5.4.jpg)\n\n      **Figure 5.4:**\
    \ Delta Live Table execution mode\n\n      The execution mode is independent of\
    \ the type of table being computed. We can also configure the update frequency\
    \ for tables in order to put delay while ingesting the data to the table:\n\n\
    \      ![](images/Figure-5.5.jpg)\n\n      **Figure 5.5:** Delta Live Table trigger\
    \ interval\n\n      In order to optimize the workload while creating the pipeline,\
    \ we can switch the execution mode between the `Development` and `Production`\
    \ mode.\n\n      As shown in the following screenshot, we can switch between the\
    \ `Development` and `Production` mode from the pipeline UI:\n\n      ![](images/Figure-5.6.jpg)\n\
    \n      **Figure 5.6:** Delta Live Table execution mode\n\n    - **Development\
    \ mode**: In this mode, the Delta Live Table system restarts the cluster to avoid\
    \ restart overhead.\n\n      It also disables the retry interval to detect and\
    \ fix the error.\n\n    - **Production mode**: It restarts the cluster only for\
    \ specific errors.\n\n- **Publish tables**: We can also publish the output of\
    \ Delta Live Table to make it available for the query. We can specify the target\
    \ settings in the Delta Live Table settings:\n\n      ![](images/Figure-5.7.jpg)\n\
    \n      **Figure 5.7:** Delta Live Table publish tables\n\n      When we specify\
    \ the `target` property, it will only publish the table and the metadata associated\
    \ with it. Views will not be published.\n\n- **Pipeline implementation**: Now,\
    \ we will explore Delta Live Table pipeline implementation in detail.\n\n- **Notebooks**:\
    \ We can use Databricks notebooks to implement the Delta Live Table in the pipeline.\
    \ We can use a single notebook or multiple notebooks using Python or SQL.\n\n\
    - **Queries**: We can use Databricks notebooks to implement the Delta Live Table\
    \ in the pipeline. We can use a single notebook or multiple notebooks using Python\
    \ or SQL.\n\n      In the following example, we use `dlt.table` to define a table:\n\
    \n      ```python\n      import dlt\n      @dlt.table\n      def my_table():\n\
    \          return dlt.read_stream(\"source_table\")\n      ```\n\n      Alternatively,\
    \ using SQL:\n\n      ```sql\n      CREATE OR REPLACE LIVE TABLE my_table AS\n\
    \      SELECT * FROM STREAM(source_table)\n      ```\n"
