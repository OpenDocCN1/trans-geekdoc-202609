    \n        **Figure 2.25:** Databricks cluster policies assignment\n\n        Similarly,\
    \ we can create multiple cluster policies based on use cases within Databricks\
    \ to keep cluster configurations and management consistent across the Databricks\
    \ workspace:\n\n        *   Cluster policy to define T-Shirt sized cluster configurations.\n\
    \n        *   Cluster policy for cluster configurations based on the workload\
    \ types.\n\n        *   Cluster policy for cost reduction with **auto scaling**,\
    \ **auto termination**, **expensive instance types**, and **worker node counts.**\n\
    \n        *   Use of instance type for cost reduction.\n\n        While creating\
    \ a Databricks cluster, you also have an option to configure if you want to use\
    \ spot instances to reduce the cost. If spot instances are expelled due to unavailability,\
    \ on-demand instances will be deployed to replace those instances:\n\n       \
    \ ![](images/Figure-2.26.jpg)\n\n        **Figure 2.26:** Databricks cluster -\
    \ spot instances\n\n    *   **Cluster tags**: Enforcing cluster tags for Databricks\
    \ workspace helps enterprise organizations to monitor the cost of cloud resources.\
    \ Cluster tags can be specified in the form of *key-value pairs* during the cluster\
    \ creation.\n\n        By default, Databricks applies the following tags for each\
    \ cluster:\n\n        *   `Vendor`\n\n        *   `Creator`\n\n        *   `ClusterName`\n\
    \n        *   `ClusterId`"
