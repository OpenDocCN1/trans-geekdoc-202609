    ```python\npredictions = predict_model(loaded_model, data=data_unseen)\n# View\
    \ predictions\npredictions.head()\n```\n\n```\n\n现在，使用前面的代码段，我们的模型已经部署，它将使用该模型进行批量预测。\n\
    \n除了使用 AWS Cloud 部署和服务模型外，我们还可以使用 `Fast API` 或 `REST API` 进行实时服务。一旦模型部署在本地或云端，我们就可以它进行离线或在线批量预测：\n\
    \n![](img/Figure-7.32.jpg)\n\n**图 7.32:** REST API 工作原理\n\n# 记录模型指标\n\nMLflow\
    \ tracking 是一个 API 和 UI，用于在运行机器学习代码和相关可视化时，记录参数、代码版本、指标和输出文件。通过 MLflow tracking，我们可以使用\
    \ Python、REST API、R 和 Java 来记录和查询实验：\n\n![](img/Figure-7.33.jpg)\n\n**图 7.33:**\
    \ MLflow tracking\n\n**来源**: **[`mlflow.org/`](https://mlflow.org/)**\n\nMLflow\
    \ tracking 围绕“运行”（runs）的概念组织，运行是指机器学习/数据科学代码的执行。每段代码都会记录一条信息：\n\n* **代码版本**：如果是来自\
    \ MLflow 项目的运行，则使用 Git 提交哈希值。\n* **开始和结束时间**：显示 MLFlow 实验运行的开始和结束时间。\n* **来源 (Source)**：它是启动\
    \ MLflow 项目所需的文件名称。基本上，它是运行 MLflow 项目的触发点。\n* **参数 (Parameters)**：参数通常以键值对的形式存在。键和值都采用字符串形式。\n\
    * **指标 (Metrics)**：MLflow 实验中定义的每个指标都可以在 MLflow 运行期间更新，MLflow 会记录并可视化完整的指标历史。\n\
    * **产物 (Artifacts)**：来自 MLflow 运行的产物可以是任何格式。\n\n# 结论\n\n在本章中，我们详细探讨了如何使用 Databricks\
    \ 进行机器学习模型管理。我们快速浏览了如何使用 Databricks 和 MLflow 实现端到端的机器学习解决方案。除了端到端的实现，我们还涵盖了 MLOps\
    \ 和 MLflow 的基础知识。我们还学习了入门 MLflow 环境、在 Databricks 中进行特征工程、使用模型库设置 MLflow 项目，以及训练和部署机器学习模型的概念。\n\
    \n# 单选题\n\n1. MLflow 的主要组件有哪些？\n    1. Tracking（跟踪）\n    2. Projects（项目）\n   \
    \ 3. Models（模型）\n    4. Model Repository（模型仓库）\n    5. 以上所有\n2. 如何在 Databricks\
    \ 中安装 MLflow 包？\n    1. `pip install mlflow`\n    2. `pip install mflw`\n3. 我们能使用\
    \ MLflow 记录产物（artifacts）吗？\n    1. 能\n    2. 否\n4. 我们使用哪个 MLflow 组件来记录结果和模型参数？\n\
    \    1. Tracking\n    2. Projects\n5. 我们使用哪个 MLflow 组件来打包机器学习模型？\n    1. Tracking\n\
    \    2. Models\n    3. Projects\n    4. 以上所有\n\n# 答案\n\n1. **e**\n2. **a**\n3.\
    \ **b**\n4. **a**\n5. **c**\n\n# 第 8 章\n\n# 使用 Databricks 进行持续集成与交付\n\n持续集成和交付（CI/CD）允许企业组织在软件更改上进行快速迭代，同时保持平台的整体性能和稳定性。采用\
    \ CI/CD 的组织能够提高生产力、代码质量和软件交付能力。\n\n在上一章中，我们详细探讨了如何使用 Databricks 进行机器学习模型管理。我们学习了\
    \ MLOps 和 MLflow，并理解了使用 MLflow 进行模型生命周期管理。在本章中，我们将探索如何使用 Databricks 启用持续集成和交付。\n\
    \n# 结构\n\n本章涉及：\n* Repos（代码库）\n* 针对所有环境的自动化 CI/CD\n\n# 目标\n\n学习本章后，你应该能够理解 Databricks\
    \ 与 Git 等工具的集成。\n\n# 用于 Git 集成的 Repos\n\n在进行数据科学和数据工程工作时，最佳实践是使用 `Databricks repos`\
    \ 来维护版本。\n\n通过 `Databricks repos`，我们可以使用所有功能：\n* 克隆远程仓库（Clone remote）\n* 管理分支（Manage\
    \ branches）\n* 创建推送/拉取请求（Create push/pull request）\n* 可视化比较更改\n* 检查更改历史\n\n`Databricks\
    \ repos` 还有内置的安全功能，可以改进：\n* 控制对白名单资源的访问\n* 自动检测明文格式的敏感信息\n\n`Databricks repos`\
    \ 还会在我们创建、删除或更新时记录所有事件。\n\n`Databricks repos` 支持以下 Git 供应商：\n* GitHub\n* Bitbucket\n\
    * GitLab\n* Azure DevOps\n\n为了使用 `Databricks repos` 将版本控制与 Databricks 集，Git 服务器必须能够从\
    \ Databricks 访问。我们无法从 Databricks 连接到私有的 Git 服务器。\n\n现在，让我们了解如何配置 Databricks 的\
    \ Git ：\n\n1. 首先，进入 Databricks 首页的 `Settings` 标签并点击 `User settings`：\n   ![](img/Figure-8.1.jpg)\n\
    \   **图 8.1:** Databricks 用户设置\n2. 现在，点击 `User Settings` 选项并选择 `Git Integration`\
    \ 标签页：\n   ![](img/Figure-8.2.jpg)\n   **图 8.2:** Databricks repos - Git 集成\n\
    3. 根据需要选择 Git 供应商：**Azure DevOps**、**GitHub**、**GitLab** 或 **Bitbucket**。\n4.\
    \ `如果 GitHub 启用了 SAML SSO，我们应该使用授权的个人令牌（token）。`\n\n此外，我们还可以启用在 Databricks repos\
    \ 中配置任意文件的支持，包括将 Databricks notebook 与远程 Git 仓库同步。\n\n为了在 Databricks repos 中配置非笔记本\
    \ 文件，Databricks 运行时应为 *8.4 或更高版本*。\n\n在 Databricks repo 中启用非笔记本文件的步骤如下：\n\n1.\
    \ 进入管理控制台并点击 `Workspace settings`。\n2. 在 `Advanced` 部分，点击 `Files in Repos: Disabled`\
    \ 选项：\n   ![](img/Figure-8.3.jpg)\n   **图 8.3:** Databricks repos - 启用仓库中的文件\n\
    3. 克隆远程 Git 仓库：\n    1. 从菜单点击 `Repos` 标签页，提供远程 Git 仓库 URL，并点击 `Create` 按钮保存配置。\n\
    \    2. 一旦克隆了远程 Git 仓库，我们就可以与远程 Git 仓库同步创建或处理笔记本。\n\n"
