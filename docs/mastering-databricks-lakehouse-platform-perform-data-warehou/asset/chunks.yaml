    \n    **We need to start pipeline from the Delta Live Tables tab of the jobs’\
    \ user interface. Clicking on the** ***Run*** **icon to run the pipeline will\
    \ return an error.**\n\n    ![](images/Figure-5.24.jpg)\n\n    **Figure 5.24:**\
    \ Delta Live Table - pipeline results\n\n6.  Click on the dataset on the pipeline\
    \ result to find the schema information about the dataset:\n\n    ![](images/Figure-5.25.jpg)\n\
