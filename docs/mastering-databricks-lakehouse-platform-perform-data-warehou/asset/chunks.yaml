    \  **a**\n\n3.  **b**\n\n4.  **a**\n\n5.  **c**\n\n# [CHAPTER 8](#toc.xhtml#c08)\n\
    \n# [Continuous Integration and Delivery with Databricks](#toc.xhtml#c08)\n\n\
    Continuous Integration and Delivery enables enterprise organizations to swiftly\
    \ iterate on the software changes while maintaining the overall performance and\
    \ stability of the platform. Adoption of CI/CD entitles organizations to improve\
    \ productivity, code quality, and software delivery.\n\nIn the previous chapter,\
    \ we explored machine learning model management with Databricks in detail. We\
    \ learned about MLOps and MLflow, and we also understood model life cycle management\
    \ with MLflow. In this chapter, we will explore how to enable continuous integration\
    \ and delivery with Databricks Lakehouse platform.\n\n# [Structure](#toc.xhtml#s119a)\n\
    \nThis chapter deals with how to implement DevOps CI/CD with Databricks. Here\
    \ are the topics that will be covered:\n\n*   Repos for Git integration\n\n* \
    \  Automated multi-environment CI/CD deployment with DevOps\n\n# [Objectives](#toc.xhtml#s120a)\n\
    \nAfter studying this chapter, you should be able to understand the integration\
    \ of Databricks platform with versioning tools like Git and Azure DevOps. You\
    \ will also learn how to enable the CI/CD way of working with Databricks deployment\
    \ and deploy components to all environments in a generic way.\n\n# [Repos for\
    \ Git integration](#toc.xhtml#s121a)\n\nA best practice while working with Data\
    \ Science and Data Engineering workload is to enable the integration with version\
    \ controlling tools to maintain code versions as well as history. Databricks Lakehouse\
    \ platform provides an in-built feature named **Databricks repos** that provides\
    \ repository-level integration with the Git providers.\n\nWith Databricks repos,\
    \ we can develop the code in the Databricks notebooks and sync it with a remote\
    \ Git repository. Databricks repos support all the following features of the version\
    \ controlling Git functionalities:\n\n*   Clone remote repos\n\n*   Mange branches\n\
    \n*   Create push/pull request for code changes\n\n*   Visually compare version\
    \ changes\n\n*   Check history of code changes\n\nDatabricks repos also have in-built\
    \ API capabilities to integrate the CI/CD pipelines. With Databricks repos, we\
    \ can make sure that we can programmatically update the Databricks repos using\
    \ APIs to always use the most recent version of the code.\n\nDatabricks repos\
    \ also have additional in-built security features, listed as follows, to improve\
    \ security:\n\n*   Control access to the Git repositories only for the whitelisted\
    \ resources\n\n*   Auto detect confidential information in a plain text format\
    \ in source code\n\nWe can also enable audit logging while enabling Databricks\
    \ repos, which will then log all the audit events when we create, delete, or update\
    \ the Databricks repos.\n\nDatabricks supports the following Git providers for\
    \ version controlling:\n\n*   GitHub\n\n*   Bitbucket\n\n*   GitLab\n\n*   Azure\
    \ DevOps\n\nIn order to integrate version controlling for Databricks platform\
    \ using the Databricks repos, Git server must be accessible from Databricks. We\
    \ can’t connect to private Git servers from the Databricks platform.\n\nNow, let’s\
    \ understand how to configure Git integration with the Databricks Lakehouse platform:\n\
    \n1.  First, go to the `Settings` tab on the home page of Databricks UI and click\
    \ on `User settings`:\n\n    ![](images/Figure-8.1.jpg)\n\n    **Figure 8.1:**\
    \ Databricks user settings\n\n2.  Now, click on the `User Settings` option and\
    \ select the `Git Integration` tab:\n\n    ![](images/Figure-8.2.jpg)\n\n    **Figure\
    \ 8.2:** Databricks repos - Git integration\n\n3.  Select the Git providers as\
    \ per your convenience: **Azure DevOps**, **GitHub**, **GitLab**, or **Bitbucket**.\n\
    \n4.  `If the organization has SAML SSO enabled in the GitHub, we should use authorized\
    \ personal access token for SSO.`\n\nAdditionally, we can enable the support for\
    \ configuring arbitrary files in the Databricks repos, including syncing Databricks\
    \ notebooks with the remote Git repository.\n\nIn order to configure non-Databricks\
    \ notebook files with the Databricks repos, Databricks runtime version should\
    \ be more than *8.4 or above*.\n\nThe steps to enable non-Databricks notebooks\
    \ files with Databricks repo are as follows:\n\n1.  Go to the admin console and\
    \ click on the `Workspace settings`.\n\n2.  In the `Advanced` section, click on\
    \ the `Files in Repos: Disabled` option:\n\n    ![](images/Figure-8.3.jpg)\n\n\
    \    **Figure 8.3:** Databricks repos - Enable files in repos\n\n3.  In order\
    \ to clone the remote git repository: \n\n    1.  Click on the `Repos` tab from\
    \ the menu, provide the remote Git repo URL, and click on the `Create` button\
    \ to save the configurations.\n\n    2.  Once the remote Git repository is cloned,\
    \ we can create or work with the notebooks in sync with the remote Git repository."
