    \ 2.  No\n\n# [Answers](#toc.xhtml#s134a)\n\n1.  **a**\n\n2.  **a**\n\n3.  **d**\n\
    \n4.  **a**\n\n5.  **b**\n\n# [CHAPTER 10](#toc.xhtml#c10)\n\n# [Best Security\
    \ and Compliance Practices of Databricks](#toc.xhtml#c10)\n\nNot only intruders\
    \ but even employees within a company can attack enterprise data with the company’s\
    \ system or external private actors. So, whatever solutions enterprise organizations\
    \ adapt must mitigate the risk to address issues. An application must comply with\
    \ the best practices of Databricks.\n\nIn the previous chapter, we explored the\
