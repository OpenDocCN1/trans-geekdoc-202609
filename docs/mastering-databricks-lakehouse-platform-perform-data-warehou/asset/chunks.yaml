    Details of all the subcomponents of the control plane will be explained as follows:


    *   **Notebooks**: These are web-based interface that contains executable code,
    powered visualizations, and narrative texts. They are ideally used for ETLs, machine
    learning, and much more.

    *   **Cluster management**: Most of the tasks related to provisioning and maintaining
    of clusters is done by Databricks cluster manager on its own based on user inputs
    on certain parameters like quantification of worker nodes, specification of memory,
    and runtime version of spark as well as auto scaling.

    *   **Jobs**: These are scheduled or immediate executable tasks to run a notebook
    on Databricks cluster. These are a non-interactive way to run a notebook containing
    executable code or visualizations.

    *   **Queries**: Databricks SQL is a web-based query editor, which can be used
    to execute SQL queries and also helps in visualizing data.


    # Data plane


    It resides in the client’s cloud (ideally, it is compatible with AWS, Azure, and
    GCP). Data plane is the only way to connect control plane with customers’ data.
    Data plane contains clusters, and it is the place where the data is processed.
    Using Databricks connectors, we can also connect to multiple external sources
    and ingest from streaming data sources.


    Now, let’s understand the Databricks Lakehouse platform architecture and its components
    in detail:


    ![](images/Figure-1.1.jpg)


    **Figure 1.1:** Databricks Lakehouse architecture


    [Photo credits]: **[https://docs.databricks.com/getting-started/overview.html](https://docs.databricks.com/getting-started/overview.html)**


    # How does it work?


    In order to understand Databricks better, we will consider a scenario where a
    data engineer wants to perform an ETL operation over the data that resides over
    AWS S3 and writes the results back to AWS S3.


    # Prerequisite


    Both S3 and Databricks are already residing on the client’s AWS account:


    *   After signing in to Databricks web application that is inside the control
    plane, we will go to the cluster manager and create a simple cluster with minimal
    configuration. Control plane uses AWS APIs to create a Databricks cluster, which
    is made of new AWS EC2 instances residing in the data plane.

    *   Once the cluster is provisioned, the Data Engineer creates ETL code in a notebook
    and runs it.

    *   Upon execution, Cluster Manager sends the code to the cluster to execute this
    code, which, in turn, extracts data from AWS S3, transforms it, and writes the
    results back to AWS S3.

    *   Later, cluster will report status and any output back to the cluster manager.


    If you have observed the preceding flow mentioned, a data engineer has to only
    manage their code for getting the desired outcome. Everything with regards to
    infra, networking, scaling, and all the underlying process has been taken care
    of.


    # Databricks for Data Engineers and Data Scientists


    Many of us have been engineering data their entire career. Since the last few
    years, the term `data engineering` has become a buzz word for moving and transforming
    voluminous data from multiple sources in a variety of formats.


    *   **Data Engineering** is used to refer to the tasks (ETL or ELT tasks) done
    by engineers on huge data.

    *   **Data Science** is the process of extracting insights from data.


    Databricks Lakehouse provides a unified platform for all workloads. It combines
    the flexibility of a data lake with the performance and structure of a data warehouse.


    *   **Data Engineering**: Focus on ETL/ELT tasks.

    *   **Data Science**: Focus on building models and analytical insights.

    *   **SQL Analytics**: Focus on querying and dashboarding data.

    '
