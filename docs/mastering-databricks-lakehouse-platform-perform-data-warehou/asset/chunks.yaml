    Once you have your SQL connection ready, you can start querying the specific database;
    in this case, its table `[oltpstore]` from a self-hosted SQL server instance that
    stores semi-structured data in a structured format based on a key pair.


    You would be happy to know that the following script in Scala and similar in Python
    is simply running a `select * from oltpstore`. The table in the SQL Server database
    and storing the output in a variable `ExamdataFromSQLDB`:


    | `%scala``//Load the exam_data in the Exam_Data_From_SQLServer_DB variable``val
