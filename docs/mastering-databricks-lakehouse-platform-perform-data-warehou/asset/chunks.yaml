  trans: "\n\n数据治理成功的关键标准之一是确保企业组织内部的数据安全。数据团队应该能够看到数据是如何被企业组织访问的。建立数据治理解决方案有助于保护数据免受未经授权的访问，并帮助满足合规性要求。企业组织面临的主要挑战之一是确保数据安全，并确保其按照组织内部定义的安全控制进行管理。全球各监管机构正在改变我们获取和存储数据的方式。企业组织面临的典型挑战如下：\n\
    \n* 当前工具是否支持对云端数据进行访问控制？它们是否支持对数据上发生的活动进行内置日志记录？\n* 安全和监控解决方案现在能够随着数据湖（Data Lake）中数据需求的增长而扩展吗？为少数用户配置和监控数据访问应该是容易的。但当我们把数据湖开放给大量用户时，会发生什么？\n\
    * 如何主动监控数据访问策略？\n* 如何识别现有数据安全解决方案中的差距？\n\nDatabricks 通过多种方式解决了上述挑战：\n\n### 管理对数据和对象的访问\n\
    \n**Unity Catalog** 集中存储数据、元数据和组织数据。无论企业组织使用多少个工作空间或商业智能工具，数据治理规则都可以扩展。它允许工作空间访问每个元数据存储，并在一处管理数据的访问：\n\
    \n![](img/Figure-10.16.jpg)\n\n**图 10.16：** 数据治理框架\n\n**参考：[`databricks.com/blog/2021/05/26/introducing-databricks-unity-catalog-fine-grained-governance-for-data-and-ai-on-the-lakehouse.html`](https://databricks.com/blog/2021/05/26/introducing-databricks-unity-catalog-fine-grained-governance-for-data-and-ai-on-the-lakehouse.html)**\n\
    \nDelta sharing (`[`docs.databricks.com/data-sharing/delta-sharing/index.html`](https://docs.databricks.com/data-sharing/delta-sharing/index.html)`)\
    \ 是 Databricks 开发的一种开放协议，用于与其他组织安全地交换数据，无论计算平台如何：\n\n![](img/Figure-10.17.jpg)\n\
    \n**图 10.17：** Delta sharing\n\n表访问控制允许终端用户应用数据治理来控制数据。Databricks 工作空间管理员只能通过\
    \ `Admin Console` (`[`docs.databricks.com/security/access-control/index.html`](https://docs.databricks.com/security/access-control/index.html)`)\
    \ 或 `Permissions API` (`[`docs.databricks.com/dev-tools/api/latest/permissions.html`](https://docs.databricks.com/dev-tools/api/latest/permissions.html)`)\
    \ 来启用 ACL（访问控制列表）。\n\n凭证透传（Credential passthrough）功能允许用户使用登录 Databricks 的身份，从\
    \ Databricks 工作空间集群验证 `S3 buckets` 或 `Azure Data Lake Storage Gen2`：\n\n![](img/Figure-10.18.jpg)\n\
    \n**图 10.18：** Databricks 凭证透传\n\n### 使用 Delta Lake 实现 GDPR 和 CCPA 合规\n\n通过 Databricks\
    \ Delta Lake，企业组织可以处理数据的 `通用数据保护`（`GDPR`）和 `CCPA` 合规性。Delta Lake 简化了定位个人数据的能力，因为\
    \ Delta Lake 具有一个事务层，在数据之上提供了结构化数据：\n\n![](img/Figure-10.19.jpg)\n\n**图 10.19：**\
    \ GDPR 合规\n\n企业组织面临的一个主要挑战是管理包含个人信息的大数据。对这些大数据实现 GDPR 和 CCPA 合规是一项艰巨的任务。其主要原因如下：\n\
    \n* 我们可以以分布式方式在多个数据集上存储个人信息。查找数据的即席查询是昂贵的，因为它们需要全扫描。\n* 数据湖无法执行行级 `delete` 或 `update`\
    \ 操作，因此我们必须重写数据分区。它不提供 `ACID` 能力。\n* 数据湖中的数据卫生具有挑战性，因为数据湖在设计上支持可用性和分区容错：\n\n![](img/Figure-10.20.jpg)\n\
    \n**图 10.20：** CCPA 合规\n\nDatabricks Delta Lake 以如下方式解决上述挑战：\n\n* 数据匿名化，使得个人信息无法从存储在数据湖中的数据中追溯。\n\
    * 通过流水线和存储桶策略移除原始数据，有助于符合规则要求。\n* 定位并移除标识符以破坏关联的机制。\n* `ACID` 事务能力，防止终端用户在记录被更新或删除时出现问题。\n\
    \n让我们考虑一个使用 Databricks Delta Lake 删除个人数据的用例。考虑一个名为 `customers` 的表，其架构如下：\n\n```\n\
    -- c_customer_id: string (nullable = true)\n-- c_addr_sk: integer (nullable =\
    \ true)\n-- c_shipto_date_sk: integer (nullable = true)\n-- c_sales_date_sk: integer\
    \ (nullable = true)\n-- c_first_name: string (nullable = true)\n-- c_last_name:\
    \ string (nullable = true)\n-- c_birth_day: integer (nullable = true)\n-- c_birth_month:\
    \ integer (nullable = true)\n-- c_birth_year: integer (nullable = true)\n-- c_birth_country:\
    \ string (nullable = true)\n-- c_email: string (nullable = true)\n```\n\n1. 第一步是使用以下命令将表转换为\
    \ `delta` 格式：\n\n```\nCONVERT TO delta\n```\n2. 第二步是删除那些请求删除 PII 信息的用户：\n\n```\n\
    DELETE FROM customers AS t1 WHERE EXISTS (SELECT c_customer_id FROM cust_dlt_keys\
    \ WHERE t1.c_customer_id = c_customer_id)\n```\n3. 最后一步是清理过期数据。根据从数据湖删除数据的时间，我们需要删除表历史和底层数据。默认情况下，使用以下命令可以删除\
    \ 7 天的数据：\n\n```\nVACUUM customers\n```\n4. 如果我们想移除 7 小时之前的存档，使用以下命令：\n\n此外，还建议设置保留策略以避免存储任何非必要的个人数据。\n\
    \n### 总结\n\n在本章中，你学习了如何使用 `Hyperopt` 对 Delta Lake 进行超参数调优。我们详细了解了如何进行访问控制和密钥管理。然后，我们对集群配置及其策略进行了快速介绍。随后，我们详细了解了数据治理的重要性以及\
    \ Databricks 如何帮助我们创建良好的数据解决方案。最后，我们还探索了 Databricks Delta Lake 解决方案如何帮助企业组织实现\
    \ GDPR 和 CCPA 合规。\n\n### 单选题\n\n1. 是否可以使用凭证透传直接验证 ADLS Gen2？\n   1. 是\n   2. 否\n\
    2. 哪种格式用于存储策略？\n   1. JSON\n   2. CSV\n   3. ORC\n   4. 以上所有\n3. 是否可以在 Databricks\
    \ 平台中启用访问控制列表进行细粒度访问管理？\n   1. 是\n   2. 否\n4. Delta Lake 是否支持 `ACID` 事务？\n   1.\
    \ 是\n   2. 否\n5. 是否可以使用 API 创建 Databricks 工作空间集群？\n   1. 是\n   2. 否\n\n### 答案\n\
    \n1. a\n2. a\n3. b\n4. b\n5. b\n\n"
