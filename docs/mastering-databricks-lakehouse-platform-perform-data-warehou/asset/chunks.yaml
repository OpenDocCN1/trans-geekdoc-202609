    # [Interface](#toc.xhtml#s19a)


    It is a way to interact with the Databricks services. Databricks supports three
    interfaces.


    # [Databricks UI](#toc.xhtml#s20a)


    It is a simple web-based graphical user interface. Here, we will interact with
    all the Databricks computational resources and workspaces. This is usually recommended
    while working on interactive data processing or machine learning. The following
    is Databricks web-based GUI; it is very simple to navigate among different Databricks
    options:


    ![](images/Figure-1.33.jpg)


    **Figure 1.33:** Databricks overview


    # [Databricks API](#toc.xhtml#s21a)


    Databricks services can be triggered using Databricks supported REST API. It has
    two versions of **API REST API 1.2** and **REST API 2.0**. Out of these versions,
    **REST API 2.0** is the latest version and supports the latest functionality:


    ![](images/Figure-1.34.jpg)


    **Figure 1.34**


    Refer to the following link for better insights into the API:


    **[https://docs.databricks.com/dev-tools/api/latest/index.html](https://docs.databricks.com/dev-tools/api/latest/index.html)**


    # [Databricks CLI](#toc.xhtml#s22a)


    It is an open-source CLI built on top of Databricks API. This tool is entirely
    built using Python.


    # [Data management](#toc.xhtml#s23a)


    In this section, we will talk about the components that hold different types of
    data, which will be used while performing data engineering and machine learning
    processes.


    # [DBFS](#toc.xhtml#s24a)


    **Databricks File System** (**DBFS**) is a distributed file system, which is the
    same as **Hadoop Distributed File System** (**HDFS**). DBFS is built on top of
    cloud provider’s object storage. For example, if a Databricks is being accessed
    from AWS, DBFS will, by default, use **S3** as its object storage. The same holds
    for **Azure Blob** in Azure and **GCS** in GCP. DBFS can contain images, data
    files, and libraries, and so on. DBFS also allows mounting of different storages
    with DBFS as folders. The data in DBFS is accessible by the clusters; this data
    is persisted even after the cluster is terminated:


    ![](images/Figure-1.35.jpg)


    **Figure 1.35:** Create new table


    # [Tables](#toc.xhtml#s25a)


    **Tables** are representation of data in a structured format of rows and columns.
    They can be queried using Apache Spark SQL and Apache Spark APIs:


    ![](images/Figure-1.36.jpg)


    **Figure 1.36:** Create table option


    # [Database](#toc.xhtml#s26a)


    Logical grouping of all the tables.


    # [Metastore](#toc.xhtml#s27a)


    Metastore holds the metadata related to all data stored in Databricks, such as
    tables. Metastore contains the partition information and the serializers/deserializers
    to be used while accessing the data, and so on. It has two main functionalities:
    **data abstraction** and **data discovery**.


    Without the metastore, whenever a user tries to access the data in a table, they
    should provide the table format, loaders, and the corresponding files where the
    data is stored. With data abstraction, all the preceding information is stored
    in metastore and is being used whenever data is read/written. Data discovery helps
    the user to discover and explore relevant data from the data warehouse. Databricks
    has a built-in central hive metastore, but it can also support using external
    hive metastore instance and **AWS Glue** data catalog.


    # [Computation management](#toc.xhtml#s28a)


    In this section, we will talk about different computation concepts.


    # [Cluster](#toc.xhtml#s29a)


    It is a computation resource on which notebooks or jobs are executed:


    ![](images/Figure-1.37.jpg)


    **Figure 1.37:** Databricks Compute


    While creating a cluster, it will require some properties to be set. Databricks
    provides two types of clusters: `All-purpose clusters` and `Job clusters`:


    ![](images/Figure-1.38.jpg)


    **Figure 1.38:** Databricks compute clusters


    # [All-purpose cluster](#toc.xhtml#s30a)


    It can be created using Databricks UI, Databricks API, and Databricks CLI. This
    cluster is majorly used for interactive processing of the data. This type of cluster
    can be shared across multiple users for collaboratively computing the notebooks.
    These clusters can be manually restarted or terminated.


    # [Job cluster](#toc.xhtml#s31a)


    The Databricks job scheduler creates a job cluster automatically whenever any
    data processing job is triggered. These clusters terminate automatically once
    the job is completed. These clusters are not accessible by user, and hence, cannot
    be used for interactive data processing:


    ![](images/Figure-1.39.jpg)


    **Figure 1.39:** Databricks job clusters


    # [Pools](#toc.xhtml#s32a)


    A **pool** is, essentially, a group of warm computing instances that a cluster
    can pull from while it’s spinning up or scaling up. To utilize the pool instances,
    a cluster needs to be attached with the pool; once it is attached, based on the
    availability, cluster will allocate driver and worker nodes from the pool. If
    there is any additional demand from a cluster for more resources, the pool will
    try to expand by allocating new instances. Once the cluster is terminated, all
    the resources or instances that were used will be returned to pool and will be
    used by other attached clusters.


    **Databricks does not charge for the computing instances which are idle, but the
    instance provider does charge for it.**


    ![](images/Figure-1.40.jpg)


    **Figure 1.40:** Cluster pools


    # [Databricks runtime](#toc.xhtml#s33a)


    It is an environment in which a set of software components, including Apache Spark,
    is available and running on the clusters. Databricks runtime is fully managed
    by Databricks. Databricks constantly updates the runtime, which, in turn, improves
    the usability, performance, and security of big data processing or advanced analytics
    in Databricks environment. There are multiple types of runtime offered by Databricks:


    ![](images/Figure-1.41.jpg)


    **Figure 1.41:** Databricks runtime


    # [Databricks runtime](#toc.xhtml#s34a)


    This runtime consists of Apache Spark and other components like:


    *   Delta Lake, a next gen storage layer built on Apache Spark that offers ACID
    transactions


    *   Installed Python, Scala, Java, and R libraries


    *   GPU libraries for GPU enabled clusters:


    ![](images/Figure-1.42.jpg)


    **Figure 1.42:** Databricks Runtime - Standard


    # [Databricks runtime for machine learning](#toc.xhtml#s35a)


    This runtime consists of all the components from Databricks runtime and all the
    popular machine learning libraries like `pytorch`, `tensorflow`, `keras,` and
    `XGBoost`. This runtime also ensures the proper library compatibility. Using this
    runtime speeds up the cluster creation process:


    ![](images/Figure-1.43.jpg)


    **Figure 1.43:** Databricks runtime - ML


    # [Photon](#toc.xhtml#s36a)


    **Photon** is native vectorized query engine. It is written using C++. Photon
    engine is compatible with all Apache Spark API and Spark SQL. Vectorized way of
    data processing helps in efficiently utilizing the CPU of the underlying hardware
    as this runtime is a part of high-performance runtime.


    There are some limitations of this runtime:


    *   Does not support spark structured streaming.


    *   Does not support Spark UDF’s.


    *   This runtime is not recommended while querying small amounts of data.


    *   Window and sort functions are not supported by photon high performance runtime.'
