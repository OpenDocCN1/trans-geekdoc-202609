    \n    | `update_id` || STRING || Unique update identifier |\n\n    | `creation_time`\
    \ || STRING || Timestamp when the update was created |\n\n# [Development workflow\
    \ with Delta Live Table](#toc.xhtml#s95a)\n\nDuring the traditional ETL pipeline\
    \ development, we define a series of Apache Spark tasks. However, Delta Live Table\
    \ manages how the data is transformed based on the target schema for each processing\
    \ step.\n\nWe can create Delta Live Table pipelines using the Databricks notebook.\
