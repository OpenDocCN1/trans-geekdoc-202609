  trans: '


    作业任务支持使用 notebook、Delta Live Tables 流水线或 Python、Java 和 Scala 进行实现。作业可以运行基于 notebook
    的隔离脚本，并包含各种任务，如 *第 3 章，Spark、Databricks 和构建数据质量框架* 所示。这可以是任何形式，例如运行从云存储摄取数据的 Python
    脚本、使用 Delta Live Tables 流水线准备数据、使用 notebook 创建仪表板，或处理基于数据科学和机器学习的用例。


    可以通过作业 UI、作业 API 或 Databricks CLI 创建作业。作业 UI 集成了详细的监控工具，允许你监控、测试和排除运行中及已完成作业的故障。


    #### 创建作业

    要创建作业，你需要点击侧边栏中的 `Jobs`。


    请参考下图中的 `红色图标`。要创建你的作业，你需要创建任务并将其与你在 notebook 中编写的脚本关联。


    如果你有参数，将根据需要进行配置，并进一步选择执行这些作业的活动集群：


    1. 为你的作业输入一个作业名称。

    2. 在 `Task name` 字段中输入任务名称；例如 `get data from sql`。

    3. 在 `Type` 下拉菜单中选择 `Notebook`。

    4. 使用文件浏览器找到你创建的第一个 notebook，点击 notebook 名称并点击 `Confirm`；这里是 `DBDemo`，是我们在 *第
    3 章，Spark、Databricks 和构建数据质量框架* 中用过的。

    5. 点击 `Create task`。

    6. 点击 ![](img/image055.jpg) 后的你刚刚创建的任务以添加另一个任务。

    7. 在 `Task name` 字段中输入任务名称；例如 `filter-baby-names`。

    8. 在 `Type` 下拉菜单中选择 `Notebook`。

    9. 使用文件浏览器找到你创建的第二个 notebook，点击 notebook 名称并点击 `Confirm`。

    10. 点击 `Parameters` 下方的 `Add`。在 `Key` 字段中以键值对格式输入参数。

    11. 点击 `Create task`：


    ![](img/Figure-4.30.jpg)

    **图 4.30：** Databricks 工作排：作业


    ![](img/Figure-4.31.jpg)

    **图 4.31** Databricks 工作排：作业


    ## 运行作业

    要立即运行作业，点击右上角的 ![](img/image061.jpg)。你也可以通过点击 `Runs` 标签并点击 `Active Runs` 表中的 `Run
    Now` 来运行作业。


    ## 查看运行详情

    ![](img/Figure-4.32.jpg)

    **图 4.32：** Databricks 工作排：作业运行


    Databricks 保留你的作业运行历史长达 *60 天*。如果你需要保留作业运行，Databricks 建议你在结果过期前将其导出：


    1. 点击 `Runs` 标签，点击 `Active Runs` 表或 `Completed Runs (past 60 days)` 表中的运行链接。

    2. 点击任意任务以查看输出和详情。例如，点击 `filter-baby-names` 任务以查看过滤任务的状态和输出。


    对于编排多个任务的作业，点击任务可以查看任务运行详情，包括运行任务的集群、该任务的作业 UI、任务日志以及任务指标。


    完成后，你可以点击作业 ID 值返回该作业的 `Runs` 标签。点击作业运行 ID 值返回作业运行详情。


    ## 任务依赖

    当启用多个任务的编排时，你可以使用下拉菜单中的 `Depends` 定义作业中任务的执行顺序。你可以将此字段设置为作业中的*一个*或*多个*任务。


    ## Delta Live tables

    要调度 Delta Live table 作业，请导航到 *Delta Live* 部分。在这里，你可以根据 JSON 配置和你想顺序或并行运行的 notebook
    建立工作流：


    ![](img/Figure-4.33.jpg)

    **图 4.33：** Databricks 工作排：Delta Live tables


    根据 Databricks 官方文档：


    *Delta Live Tables (DLT) 是第一个使用简单声明式方法构建可靠数据流水线并自动规模化基础设施的 ETL 框架，使数据分析师和工程师能够减少在工具上的花费，并专注于从数据中获取价值。通过
    DLT，工程师能够将数据视为代码，并应用现代软件工程最佳实践（如测试、错误处理、监控和文档）来部署可靠的流水线。*


    Delta Live table 通过让你能够开发与生产环境隔离的环境、在部署前轻松进行测试以及使用参数化部署和管理环境的能力，加速了 ETL 开发。人们可以轻松进行单元测试，简化
    ETL 流水线的开发、测试、部署、运维和监控。


    通过交付带有内置质量控制、测试、监控和强制执行的可靠数据，确保准确且实用的 BI、数据科学和机器学习，带来了对数据的信心。这有助于防止坏数据流入表，随时间跟踪数据质量，并提供粒度流水线可观测性工具来排除坏数据的故障。这为你提供了流水线的高保真血缘图，让你能够跟踪依赖关系并聚合所有数据的质量指标。你可以轻松地使用
    `Job` 部分进行配置。


    ![](img/Figure-4.34.jpg)

    **图 4.34：** Databricks 工作排：作业设置


    '
- fmt: "To update the settings of a multi-task format job, you must use the unique\
    \ `Task key` field to identify new task settings. See, create ([https://docs.databricks.com/data-engineering/jobs/jobs-api-updates.html#create-job](https://docs.databricks.com/data-engineering/jobs/jobs-api-updates.html#create-job)),\
    \ for an example job settings specifying multiple tasks.\n\n- **Reset**: To overwrite\
    \ the settings of a single-task format job with the `Overwrite all settings for\
    \ a job operation (POST /jobs/reset)` in the jobs API, you do not need to change\
    \ existing clients.\n- **List**: To `Retrieve a list of jobs using (GET /jobs/list)`\
    \ in the jobs API. For multi-task format jobs, most settings are defined at the\
    \ task level and not the job level. Cluster configuration may be set at the task\
    \ or job level to modify clients to access cluster or task settings for a multi-task\
    \ format job returned in the job structure:\n    - Parse the `job_id` field for\
    \ the multi-task format job.\n    - Pass the `job_id` to get a job operation (`GET\
    \ /jobs/get`) in the jobs API to retrieve job details.\n- **Get**: To `Get a job\
    \ operation (GET /jobs/get)` in the jobs API. Multi-task format jobs return an\
    \ array of task data structures containing task settings. If you require access\
    \ to task-level details, you need to modify your clients to iterate through the\
    \ tasks array and extract the required fields.\n\nThese are just a few examples\
    \ to help you start with job API. For a detailed understanding, you can refer\
    \ to the Databricks documentation.\n\n**https://docs.databricks.com/dev-tools/api/**\n\
    \n# Conclusion Questions\n\n1. Which of the following cloud-based tool sets can\
    \ be used to orchestrate Databricks workflows?\n    1. Airflow on AWS (Amazon\
    \ managed apache airflow)\n    2. Data Factory on Azure\n    3. Delta Live tables\n\
    \    4. All the above\n2. What are the different ways to use Data Factory for\
    \ orchestration?\n    1. Importing the Databricks notebook and executing in the\
    \ Azure data factory pipeline\n    2. Using `Notebook` or `Python` activity\n\
    \    3. Import pipeline file using Azure functions\n3. How jobs can be created\
    \ in Databricks?\n    1. Through jobs UI\n    2. Through jobs API\n    3. Through\
    \ Azure CLI\n    4. Through Databricks CLI\n4. Databricks maintains a history\
    \ of our job runs for up to \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ days?\n    1. 30 days\n\
    \    2. 50 days\n    3. 60 days\n    4. 100 days\n\n# Answers\n\n1. **d**\n2.\
    \ **a, b**\n3. **a, b, d**\n4. **c**\n\n# CHAPTER 5: Simplified ETL with Delta\
    \ Live Tables\n\n** Live Tables** is a framework that helps the data engineering\
    \ teams to build reliable data pipelines to cater high quality data on the delta\
    \ lake. Delta live tables simplify the ETL pipeline development with automatic\
    \ testing and visibility for end-to-end pipeline monitoring.\n\nIn the last chapter,\
    \ we explored how to perform data sharing from the Databricks Lakehouse platform.\
    \ You also learned in detail about how to schedule and manage the jobs using the\
    \ Databricks UI as well as API.\n\n# Structure\n\nThis chapter deals with Delta\
    \ Live Tables components and how to use them to implement and run a Delta Live\
    \ Tables pipeline. Here are the topics covered in the chapter:\n- Delta Live Tables\
    \ concepts\n- Development workflow with Delta Live Tables\n- Delta Live Table\
    \ configurations\n\n# Objectives\n\nAfter studying this chapter, you should be\
    \ able to understand in detail the fundamentals of Delta Live Tables. We will\
    \ also look at creating a development workflow to build ETL pipelines with the\
    \ Delta Live Tables to simplify development testing and monitoring. Additionally,\
    \ we will explore how to configure Delta Live Tables.\n\n# Delta Live Table concepts\n\
    \n**Delta Live Table** is the foundation for creating reliable, maintainable,\
    \ and stable data processing pipelines with Databricks Lakehouse platform. Delta\
    \ Live Table makes it easier to design the data pipelines and control the quality\
    \ of data.\n\nDelta Live Table can be used for creating simplified ETL pipelines:\n\
    - Orchestration\n- Cluster management\n- Monitoring\n- Data quality\n- Efficient\
    \ error handling\n\nFeatures of Delta Live Table are as follows:\n- **Ease of\
    \ creating data pipelines**: With the Live Table, we can easily create an end-to-end\
    \ pipeline (refer to 5..), starting from getting data from the source to transformation\
    \ logic and storing the output to destination so that we don’t have to manually\
    \ integrate these stages:\n```\nFigure 5.1\n```\n**Figure 5.1**: Live Table pipelines\n\
    \n- **Automated testing**: Use of the Live Table enables the use case for BI,\
    \ data science, and ML use cases. We can also enhance and monitor the data quality\
    \ trends over time to know more about how the data is evolving.\n- **Ease of recovery\
    \ and detailed monitoring**: We can reduce downtime by enabling automatic error\
    \ handling and make faster deployment with one-click:\n```\nFigure 5.2\n```\n\
    **Figure 5.2**: Ease of recovery and end-to-end monitoring\n\nImage source: https://databricks.com/product/delta-live-tables\n\
    \n# Components of the Delta Live Table\n\nLet’s understand the components of the\
