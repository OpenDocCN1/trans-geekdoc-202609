    \ Array of pipeline library || Notebook containing pipeline with dependent Python\
    \ packages |\n\n    | `target` || STRING || Database name to keep the pipeline\
    \ output |\n\n    | `development` || Boolean || Flag to check if we need to run\
    \ pipeline in development or not |\n\n    | `continuous` || Boolean || Flag if\
    \ it is a continuous pipeline |\n\n*   **Pipeline state information:** \n\n  \
    \  | **Field name** || **Type** || **Description** |\n\n    | --- | --- | ---\
    \ |\n\n    | `state` || STRING || Pipeline status |\n\n    | `pipeline_id` ||\
    \ STRING || Pipeline identifier |\n\n    | `cluster_id` || STRING || Unique cluster\
