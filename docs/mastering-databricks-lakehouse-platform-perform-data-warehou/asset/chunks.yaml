  trans: "\n\n`Feature definitions` 被应用于原始数据以生成数据帧形式的机器学习特征，并使用特征存储 API 将数据帧保存到特征注册表中。存储在特征存储中的特征定义具有版本控制，使能够根据需要提供追溯性、重现性和审计：\n\
    \n```\ndef compute_features(data):\nfeatures = ShopSales()\nfv_mnths = features.total_sales.multiply(“i_category”,\
    \ [“Dance”, “Rent”, “Clothes”]).multiply(“month_id”, [202012, 202011, 202010])\n\
    df = append_features(src_df, [features.collector], fv_mnths)\nreturn df\n\nfeatures_df\
    \ = compute_features(src_df)\n```\n\n前面的示例代码展示了如何创建特征定义并将这些特征注册到特征存储中。\n\n# 基础特征定义\n\
    \nSpark API 提供了强大的数据工程函数，可以通过封装器进行特征工程，以降低复杂性并提高重用性。Feature 类提供了一个包含以下组件的特征定义接口：\n\
    \n* `_base_col`: 作为列表达式的列或其他特征。\n* `list of conditions`: 如果表达式为 `True`，则 `_base_col`\
    \ 中定义的逻辑被视为特征。否则，特征将使用 `_negative_value` 计算。\n* `_negative_value`: 当 `_filter`\
    \ 返回 `False` 时进行评估。\n* `_agg_func`: 将定义用于聚合基础列的 Spark SQL 函数。\n\n# 特征模块化\n\n数据科学家在执行特征工程时面临的最常见挑战是：数据科学团队正在定义自己的特征，但这些特征定义没有良好的文档记录，其他数据科学团队难以发现和访问，以进行重用。\n\
    \n由于特征共享缺乏可见性，导致了重复工作，以及具有相同用途但逻辑和结果不同的代码和特征。特征模块化可以帮助数据科学家克服上述挑战。\n\n模块以 `feature\
    \ family`（特征族）的形式实现，我们可以认为特征的集合。每个特征都定义了 `read-only` 属性以便于访问。特征族扩展了 `ImmutableDictBase`\
    \ 类，该类是通用的，可以作为特征、过滤器和其他对象的基类。\n\n# 特征操作\n\n特征可以扩展为包含高阶函数，从而减少冗余、实现重用并改进特征定义。\n\
    \n# 特征向量\n\n通过将具有相同操作的特征存储在向量中可以进一步简化特征操作。可以通过列出特征名称从特征字典创建特征向量。\n\n例如所示：\n\n\
    ```\nfeatures = Features()\nfvctr = FeatureVector.create_by_names(features, [`“total_cost”`,\
    \ `“total_transactions”`])\n\n# 特征定义治理\n\nDatabricks notebook 管理并跟踪特征定义的版本，这些版本可以与\
    \ GitHub 仓库集成。自动化作业将对新创建的特征运行功能和集成测试。我们还可以进行额外的压力测试以确定其对性能的影响。一旦完成所有类型的测试并通过代码，特征定义将部署到生产环境。\n\
    \n`MLflow 跟踪并记录` ([`www.mlflow.org/docs/latest/tracking.html`](https://www.mlflow.org/docs/latest/tracking.html))\
    \ 从特征构建模型时的代码版本和源数据。`mlflow.spark.autolog()` 启用并配置 Spark `data source path`, version`,`and\
    \ format.` 的记录。\n\n# 特征探索\n\n随着特征数量的增加，浏览和查找特定的特征定义变得困难。一个 `abstracted feature`\
    \ 类将帮助我们为每个特征添加描述属性。\n\n下面的图片显示了使用之前提到的过程从原始数据创建机器学习特征的整体映射：\n\n![](img/Figure-7.18.jpg)\n\
    \n**图 7.18:** 带有 ML 特征的原始数据特征工程映射\n\n# 使用模型库设置 MLflow 项目\n\nMLflow 模型注册表提供了用户界面和\
    \ API，用于集中管理机器学习模型及其生命周期。\n\n模型注册表有几个概念来描述 MLflow 模型的完整生命周期：\n\n* **模型（Model）**:\
    \ MLflow 模型是通过使用机器学习模型 flavor 的 `mlflow.<model_flavor>.log_model()` 方法从记录的实验创建的。一旦被记录，模型将注册到模型注册表中。\n\
    * **注册模型（Registered model）**: 我们可以将 MLflow 模型注册到模型注册表中。注册模型具有唯一的名称，由唯一名称、版本、模型血缘和元数据组成。\n\
    * **模型版本（Model version）**: 每个注册的机器学习模型都有一个或多个版本。当我们向模型注册表添加新模型时，它将作为 `version\
    \ 1` 添加。每当为同一个模型注册新模型时，相同的模型名称就会增加版本号。\n* **模型阶段（Model stage）**: 我们可以随时为不同的模型版本分配一个阶段。MLflow\
    \ 有多种预定义的阶段，如 `staging`（暂存）、`production`（生产）和 `archived`（存档）。我们可以轻松地从一个阶段移动到另一个。\n\
    * **注释和描述（Annotations and descriptions）**: 我们可以使用 markdown 对顶层模型和版本进行注释，包括描述和其他相关信息：\n\
    \n![](img/Figure-7.19.jpg)\n\n**图 7.19:** 使用 Databricks 服务 MLflow 模型\n\n现在，让我们详细探索模型注册表工作流是如何工作的。\n\
    \n我们必须使用数据库支持的存储通过 API 或用户界面访问模型注册表。\n\n# UI 工作流\n\n* **将模型注册到 MLflow**\n\n  为了注册模型，请从\
    \ `Run` 详情页的 `Artifacts` 部分选择已记录的模型：\n\n  ![](img/Figure-7.20.jpg)\n\n  **图 7.20:**\
    \ 注册 MLflow 模型\n\n  然后，点击 `Register Model` 按钮将模型注册到模型注册表中。点击按钮后，会弹出一个对话框。在 `Model\
    \ Name` 字段中，提供标识模型的唯一名称。如果想选择现有模型，请从下拉菜单中进行选择：\n\n  ![](img/Figure-7.21.jpg)\n\
    \n  **图 7.21:** 注册 MLflow 模型\n\n* **使用模型注册表**\n\n  为了查看模型属性，导航到 `Registered Models`\
    \ 页面：\n\n  ![](img/Figure-7.22.jpg)\n\n  **图 7.22:** 注册的 MLflow 模型\n\n  为了了解更多模型信息，进入运行详情页的\
    \ `Artifacts` 部分并点击右上角的模型版本以查看创建的版本：\n\n  ![](img/Figure-7.23.jpg)\n\n  **图 7.23:**\
    \ Artifacts\n\n  每个模型都有一个 *overview*（概述）页面，显示活动版本：\n\n  ![](img/Figure-7.24.jpg)\n\
    \n  **图 7.24:** MLflow 模型概述\n\n  现在，点击 `Version 1` 了解更多关于版本的信息：\n\n  ![](img/Figure-7.25.jpg)\n\
    \n  **图 7.25:** MLflow 模型版本详情\n\n  从 *Version details* 页面，我们可以查看模型版本详情和模型的当前阶段。在左上角，有一个下拉菜单显示模型如何从一个阶段转换到另一个有效阶段：\n\
    \n  ![](img/Figure-7.26.jpg)\n\n  **图 7.26:** MLflow 模型阶段\n\n# API 工作流\n\n与模型注册表交互的另一种方式是使用\
    \ MLflow 模型 flavor 或 MLflow 客户端跟踪 API 接口进行 API 工作流。\n\n有多种方法可以将模型添加到注册表：\n\n"
- fmt: "\n### 1. Using the `mlflow.<model_flavor>.log_model()` method:\n\n```python\n\
    import mlflow\nimport mlflow.sklearn\nwith mlflow.start_run(run_name=”RUN_NAME”)\
    \ as run:\n    params = {\"n_estimators”: 10, “random_state”: 30}\n    # Log parameters\
    \ and metrics using the MLflow APIs\n    mlflow.log_params(params)\n    mlflow.log_param(“param_1”,\
    \ randint(0, 50))\n    mlflow.log_metrics({\"metric_1”: random(), “metric_2”:\
    \ random() + 1})\n```\n\n### 2. Using `mlflow.register_model()`:\nUsing the code\
    \ block, we can register the model to MLflow model registry:\n\n```python\nresult\
    \ = mlflow.register_model(\n    “runs:/xxxxxxxxxxxx/sklearn-model”,\n    “sk-learn-reg”\n\
    )\n```\n\nIf the registered model with the given name doesn’t exist, the preceding\
    \ method registers the new model and creates `version 1`. If the model already\
    \ exists, then the method creates a new model version and returns the version\
    \ object.\n\n### 3. Using `create_registered_model`:\nWhen we use this method,\
    \ the method will throw an MLflow `exception` if the model name exists because\
    \ this method requires a unique name:\n\n```python\nfrom mlflow.tracking import\
    \ MlflowClient\nclient = MlflowClient()\nclient.create_registered_model(“regression-reg-model”)\n\
    ```\n\nOnce the MLflow model is registered, we can fetch the model using `mlflow.<model_flavor>.load_model()`,\
    \ or using `load_model()`.\n\nLet’s look at various ways to fetch models from\
    \ the MLflow model registry:\n\n#### 3.1 Fetch specific model version\nApply the\
    \ version number as a part of model URI to fetch the specific model from the MLflow\
    \ model registry:\n\n```python\nimport mlflow.pyfunc\nmodel_name = “regression-reg-model”\n\
    model_version = 1\nmodel = mlflow.pyfunc.load_model(\n    model_uri=f”models:/{model_name}/{model_version}”\
    \ )\nmodel.predict(data)\n```\n\n#### 3.2 Fetch latest model version for a specific\
    \ stage\nIn order to fetch the latest model version from a specific stage, we\
    \ have to provide the model URI that will fetch the most recent version of the\
    \ model:\n\n```python\nimport mlflow.pyfunc\nmodel_name = “regression-reg-model”\n\
    stage = ‘Staging’\nmodel = mlflow.pyfunc.load_model(\n    model_uri=f”models:/{model_name}/{stage}”\n\
    )\nmodel.predict(data)\n```\n\nOnce the model is registered in the MLflow model\
    \ registry, we can serve the MLflow model from the `model` registry, add or update\
    \ MLflow model descriptions, rename the MLflow model, or transition an MLflow\
    \ model’s stage.\n\n#### 3.3 Serve MLflow model from the model registry\nOnce\
    \ the MLflow model is registered with the model registry, we can serve the model\
    \ as a service on the host:\n\n```sh\n#!/usr/bin/env sh\n# Set environment variable\
    \ for Model Registry URL\nexport MLFLOW_TRACKING_URI>=http://localhost:5000\n\
    # Serve the production model from the model registry\nmlflow models serve -m “models:/linear-reg-model/Production”\n\
    ```\n\n#### 3.4 Add/update MLflow model descriptions\nWe can update the model\
    \ version’s description using the `update_model_version()`:\n\n```python\nclient\
    \ = MlflowClient()\nclient.update_model_version(\n    name=”sk-learn-random-forest-reg-model”,\n\
    \    version=1,\n    description=”This model version is a linear regression machine\
    \ learning model”\n)\n```\n\n#### 3.5 Rename MLflow model from the model registry\n\
    We can use the `rename_registered_model()` method to rename the existing MLflow\
    \ model stored in the MLflow model registry:\n\n```python\nclient = MlflowClient()\n\
    client.rename_registered_model(\n    name=”linear-reg-model”,\n    new_name=”linear-reg-model-100”\n\
    )\n```\n\n#### 3.6 MLflow model stage transition\nOver time, as the model evolves,\
    \ the model life cycle also changes. We can transition the registered models to\
