- fmt: "\n**Query:** This component is available as part of the Databricks SQL interface.\
    \ Imagine this as creating a notebook. When you click on notebook, it will prompt\
    \ you to create a new notebook by attaching it to a cluster. Similarly, when you\
    \ select query, it will open a SQL editor that will prompt to select a SQL endpoint\
    \ (a serverless compute) which needs to be attached to the SQL editor and can\
    \ run `ad hoc queries`.\n\n# Features of Databricks SQL\n\nFollowing are the features:\n\
    \n* Enables customers to work with the multi-cloud lake house architecture which\
    \ is cheaper and faster compared to the conventional data warehouse and/or Data\
    \ Lake architecture.\n* Use SQL queries on the Data Lake house with the data warehousing\
    \ capabilities and performance:\n  ![](images/Figure-1.5.jpg)\n  **Figure 1.5**:\
    \ Databricks SQL query execution\n* Less complex administration and configurations\
    \ to set up SQL analytics for Databricks platform.\n  Databricks platform itself\
    \ determines the instance types and configurations to reduce the cost and improve\
    \ the performance of the SQL queries.\n  Databricks SQL has in-built features\
    \ to easily manage user access, data, and resources including monitoring, query\
    \ history, and fine-grained access management:\n  ![](images/Figure-1.6.jpg)\n\
    \  **Figure 1.6**: Databricks SQL - homepage\n* Use preferred BI tool to perform\
    \ analytics on the top of data available in the Databricks Lakehouse platform:\n\
    \  ![](images/Figure-1.7.jpg)\n  **Figure 1.7**: Databricks SQL - connectors\n\
    * Efficient data discovery, access using SQL queries, and quickly share new insights\
    \ with the visualization capabilities:\n  ![](images/Figure-1.8.jpg)\n  **Figure\
    \ 1.8**: Databricks SQL - dashboards\n\n# SQL endpoints for Databricks SQL\n\n\
    SQL endpoint is a computation resource that enables end users to execute the SQL\
    \ commands.\n\nOpen Databricks SQL and select `SQL Endpoints` from the left pane\
    \ highlighted, as follows:\n  ![](images/Figure-1.9.jpg)\n  **Figure 1.9**: Databricks\
    \ SQL - SQL endpoints\n\nBy default, Databricks SQL has an in-built endpoint named\
    \ `Starter Endpoint` to run SQL queries on the Databricks platform:\n  ![](images/Figure-1.10.jpg)\n\
    \  **Figure 1.10**: Databricks SQL - SQL endpoints lists\n\nIf you click on the\
    \ SQL endpoint, we can see more configuration information about the endpoint.\n\
    \n* **Overview**\n  ![](images/Figure-1.11.jpg)\n  **Figure 1.11**: Databricks\
    \ SQL endpoints overview page\n* **Connection details**\n  ![](images/Figure-1.12.jpg)\n\
    \  **Figure 1.12**: Databricks SQL endpoints connection details\n* **Monitoring**\n\
    \  ![](images/Figure-1.13.jpg)\n  **Figure 1.13**: Databricks SQL endpoints monitoring\n\
    \n1. If you want to create a new SQL endpoint, click on the `Create SQL Endpoint`\
    \ button:\n  ![](images/Figure-1.14.jpg)\n  **Figure 1.14:** Databricks SQL endpoints\n\
    \  Here, we have to provide the following information to create the SQL endpoints:\n\
    \  * `Name`: Provide SQL endpoint name.\n  * `Cluster Size`: Provide the cluster\
    \ size.\n  * `Auto Stop`: Provide the auto termination time.\n  * `Scaling`: Provide\
    \ minimum and maximum clusters for auto scaling:\n    ![](images/Figure-1.15.jpg)\n\
    \    **Figure 1.15**: Create Databricks SQL endpoints\n2. Now, click on `Advanced\
    \ options` to configure additional information:\n  ![](images/Figure-1.16.jpg)\n\
    \  **Figure 1.16:** Create Databricks SQL endpoints - Advanced options\n3. Now,\
    \ as soon as you click on the `Create` button, you will get a pop-up box to manage\
    \ the permissions for the created SQL endpoints:\n  ![](images/Figure-1.17.jpg)\n\
    \  **Figure 1.17:** Create Databricks SQL endpoints - Manage Permissions\n4. Now,\
    \ a new SQL endpoint has been created successfully:\n  ![](images/Figure-1.18.jpg)\n\
    \  **Figure 1.18:** Databricks SQL endpoints created\n5. From the list of SQL\
    \ endpoints, we can start and stop the SQL endpoints based on our requirement:\n\
    \  ![](images/Figure-1.19.jpg)\n  **Figure 1.19:** Start/stop Databricks SQL endpoints\n\
    6. It is also possible to edit the SQL endpoint configurations once it is created.\
    \ Click on the `dotted` button and use the `Edit` option to edit the configurations:\n\
    \  ![](images/Figure-1.20.jpg)\n  **Figure 1.20:** Edit Databricks SQL endpoints\n\
    7. If you want to configure and administer the SQL endpoints, click on the `Settings`\
    \ page from the homepage and select `SQL Admin Console`, as shown in the following\
    \ screenshot:\n  ![](images/Figure-1.21.jpg)\n  **Figure 1.21:** Databricks SQL\
    \ endpoints - SQL Admin Console\n  Here, we can configure the `General` settings\
    \ highlighted, as follows:\n  ![](images/Figure-1.22.jpg)\n  **Figure 1.22:**\
    \ Databricks SQL Admin Console - General\n8. We can also configure alerts with\
    \ multiple channels for proactive monitoring and respond swiftly in case of failure:\n\
    \  ![](images/Figure-1.23.jpg)\n  **Figure 1.23:** Databricks SQL Admin Console\
    \ - Alerts\n9. We can also configure data security options to manage the storage\
    \ access with the meta store properties to the service principal:\n  ![](images/Figure-1.24.jpg)\n\
    \  **Figure 1.24:** Databricks SQL Admin Console - Settings\n\n# Databricks components\n\
    \nSo far, we have discussed about Databricks and their architecture. Moving on,\
    \ we will deep dive into the core components of Databricks, which we can refer\
    \ to as building blocks of Databricks. These components give a 360 degree view\
    \ about Databricks and their capabilities.\n\n# Workspace\n\n**Workspace** is\
    \ an environment that contains all the Databricks assets/objects like notebooks,\
    \ libraries, and ML experiments organized into folders. A single user can have\
    \ access to multiple Databricks workspaces like `dev`, `staging`, and `prod`.\
    \ These workspaces can be accessed via Databricks UI, Databricks API, and Databricks\
    \ CLI.\n\nDatabricks assets/objects can be either shared with all the users or\
    \ a specific user within the workspace. If these objects needed to be user specific,\
    \ then it needs to be created/placed `Users` folder. If these objects need to\
    \ be shared across multiple users in the same workspace, these objects must be\
    \ placed/created under `Shared` folder:\n  ![](images/Figure-1.25.jpg)\n  **Figure\
    \ 1.25:** Databricks workspace\n\nDatabricks assets/objects are as follows:\n\
    * Notebooks\n* Libraries\n* Folder\n* ML experiments\n  ![](images/Figure-1.26.jpg)\n\
    \  **Figure 1.26:** Databricks workspace overview\n\n# Notebooks\n\nA **notebook**\
    \ is a web-based programmable document (or) interface. These documents contain\
    \ runnable cells (commands) that can operate on files, tables, visualizations,\
    \ and narrative texts. All these cells are executed in a series, and to refer\
    \ to the output of the previous cell in the current cell, the previous cell needs\
    \ to be executed first:\n  ![](images/Figure-1.27.jpg)\n  **Figure 1.27:** Databricks\
    \ workspace folders\n\nThe following image represents three different notebook\
    \ cells that contain visualization, narrative text, and code (top to bottom):\n\
    \  ![](images/Figure-1.28.jpg)\n  **Figure 1.28:** Databricks workspace notebooks\n\
    \n# Libraries\n\nA **library** is a Databricks notebook (or) file containing code\
    \ that is built locally. These libraries can be imported as well as used in other\
    \ **notebooks** (interactive way) or **jobs** (non-interactive way). These libraries\
    \ can also be uploaded directly to the cluster; this way, all these libraries\
    \ will be available to the notebooks that use the particular cluster:\n  ![](images/Figure-1.29.jpg)\n\
    \  **Figure 1.29:** Databricks cluster libraries\n\n# Folder\n\nIt is a virtual\
    \ location to store your files or documents:\n  ![](images/Figure-1.30.jpg)\n\
    \  **Figure 1.30:** Databricks workspace folder structure\n\n# MLflow experiment\n"
