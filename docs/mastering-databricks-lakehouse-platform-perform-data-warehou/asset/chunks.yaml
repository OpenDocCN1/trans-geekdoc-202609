    \n     **Figure 4.30:** Databricks orchestration: Jobs\n\n     ![](images/Figure-4.31.jpg)\n\
    \n     **Figure 4.31** Databricks orchestration: Jobs\n\n# Run the job\n\nTo run\
    \ the job immediately, click on ![](images/image061.jpg)in the upper-right corner.\
    \ You can also run the job by clicking on the `Runs` tab and clicking on `Run\
    \ Now` in the `Active Runs` table.\n\n# View run details\n\n![](images/Figure-4.32.jpg)\n\
    \n**Figure 4.32:** Databricks orchestration: Job runs\n\nDatabricks maintains\
