    \nWe can deploy these configurations using the API endpoints in the cluster and\
    \ permission API. Using the following endpoint, we can create a cluster.\n\n**Endpoint**:\
    \ `https://<databricks-instance>/api/2.0/clusters/create`\n\nHere’s an **example**:\n\
    \n`{`\n\n`“autoscale”: {`\n\n` “min_workers”: 5,`\n\n` “max_workers”: 30`\n\n\
