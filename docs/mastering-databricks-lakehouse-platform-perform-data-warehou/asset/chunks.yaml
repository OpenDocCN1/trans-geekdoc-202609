  trans: "\n\n- **凭据透传**：Databricks 具有 `credential passthrough` 功能，允许用户使用其登录 Databricks\
    \ 工作空间时的相同身份，自动验证到 AWS S3 或 Azure Data Lake Storage Gen2 等外部存储服务。这不是一个 `compulsory`\
    \ 选项，但如果你想启用它，可以在 Databricks 中创建集群时进行设置。\n\n# 高并发集群的凭据透传\n\n![](img/Figure-2.17.jpg)\n\
    \n**图 2.17:** Databricks 集群 - 凭据透传高并发集群\n\n# 标准集群的凭据透传\n\n![](img/Figure-2.18.jpg)\n\
    \n**图 2.18:** Databricks 集群 - 凭据透传标准集群\n\n考虑数据工程团队需要向 Data Lake Storage Gen2 读写数据的情景。第一步是在\
    \ Databricks 中创建一个高并发集群，并关联一个具有 Data Lake Storage Gen2 所需权限的实例配置文件（instance profile），为数据工程团队提供集群权限。现在，假设我们希望\
    \ `adls gen2` 容器仅允许数据工程团队的某些成员访问以向容器写入数据，并让其他用户仅具有读取权限。传统上，我们可以创建多个集群并根据需求添加相应的用户来限制访问。然而，这并不是一种具有成本效益且可持续的解决方案，因为我们无法为企业组织中的不同需求创建并管理多个集群。我们可以使用\
    \ Databricks 的凭据透传功能来满足此类需求。\n\n- **访问审计**：审计和管理数据访问是使用 Databricks 平台创建数据治理解决方案的强制性步骤。Databricks\
    \ 拥有一套内置审计事件集，用于记录用户在 Databricks 中的活动，并对 Databricks 平台上的所有活动进行主动监控。Databricks\
    \ 提供了两种类型的审计日志：\n\n    - 工作区级审计日志\n    - 账户级审计日志\n\n根据云提供商（AWS/Azure/GCP），我们可以为\
    \ Databricks 工作区配置并启用审计日志。配置完成后，审计日志将在 `72 小时` 内将审计日志递送至 `s3 bucket/adls gen2`。（注：原文为\
    \ 72 hours）\n\n我们还可以扩展审计日志以监控存储，从而获取更细粒度的访问细节。这将使我们能够回答监管机构要求的几个问题：\n\n    - 访问了哪些数据？是谁访问的？\n\
    \    - 未授权的读/写/删除数据尝试\n    - 从 Databricks 平台中聚合或淘汰数据源\n\n`Databricks` 和 `Immuta`\
    \ 还有协作解决方案，用于创建具有数据安全的端到端数据治理解决方案。该解决方案的主要关注领域细粒度安全以及安全共享数据的易用性。以下是 Databricks\
    \ 和 Immuta 构建的端到端数据治理解决方案的一些特定功能：\n\n    - **细粒度访问控制**：解决方案具有强大的数据掩码和匿名化技术，可以动态生成掩码数据。此功能将允许更多用户访问数据，从而带来业务洞察并满足合规性。\n\
    \    - **自助服务数据目录**：通过自助服务数据目录，所有 Databricks 数据的发现变得更加容易：\n\n        ![](img/Figure-2.19.jpg)\n\
    \n        **图 2.19:** 自助服务数据目录\n\n    - **针对各项法规的无代码策略**：策略的创建和编写不会强制任何开发者编写代码。可以通过编写句子来创建策略。一旦创建策略，它们将由\
    \ Databricks 平台原生执行：\n\n        ![](img/Figure-2.20.jpg)\n\n        **图 2.20:**\
    \ 无代码策略\n\n    - **基于属性的访问控制**：可以使用用户属性创建并管理对数据对象的细粒度访问。\n\n# Databricks 集群管理\n\
    \n正如我们在本开头讨论的 Databricks 集群，Databricks 集群是一组用于在 Databricks 平台上运行数据解决方案的计算资源和配置。\n\
    \nDatabricks 具有多种选项可以以最佳性能和低成本创建并配置集群。让我们探索集群考虑因素，以便高效管理 Databricks 集群：\n\n- **通用集群和作业集群**：通用集群可以在数据探索和开发阶段由多个用户共享。开发完成后，建议切换到作业集群（job\
    \ cluster），因为作业集群会在作业结束时终止，从而降低成本。\n- **集群模式**：Databricks 具有标准、高并发和单节点集群模式。标准集群是使用\
    \ `spark` 处理大数据的理想选择。对于非分布式工作负载，建议使用单节点集群。当用户想要共享资源或运行即时作业（ad-hoc jobs）时，高并发集群是理想选择。\n\
    - **按需和竞价实例**：根据用例，我们可以尽可能选择竞价实例（spot instances）而不是按需实例，从而显著降低成本：\n\n        ![](img/Figure-2.21.jpg)\n\
    \n        **图 2.21:** Databricks 集群竞价实例\n- **自动伸缩**：Databricks 集群的自动伸缩功能根据工作负载自动调整集群配置。与固定大小的集群相比，它可以根据工作负载降低成本并提高性能：\n\
    \n        ![](img/Figure-2.22.jpg)\n\n        **图 2.22:** Databricks 集群自动伸缩\n\
    - **集群策略**：Databricks 集群策略简化了 Databricks 管理员在 Databricks 工作区中管理集群配置和创建的工作。集群策略强制标准集群配置，并通过防止过度使用资源以及为特定工作负载预配置的集群配置来降低成本：\n\
    \n        ![](img/Figure-2.23.jpg)\n\n        **图 2.23:** Databricks 集群策略\n- **标签强制**：创建集群策略以强制执行标签，确保在创建集群时使用\
    \ `custom_tags.<tag-name>` 属性创建标签：\n\n        ![](img/Figure-2.24.jpg)\n\n   \
    \     **图 2.24:** Databricks 创建集群策略\n\n一旦创建了标签定义，我们可以为用户、组或服务主体分配权限：\n\n     \
    \   ![](img/Figure-2.25.jpg)\n\n        **图 2.25:** Databricks 集群策略分配\n\n    \
    \    同样，我们可以根据 Databricks 内部用例创建多个集群策略，以保持 Databricks 工作区内集群配置的一致性：\n\n      \
    \  - 定义尺码（T-Shirt sized）集群配置的集群策略。\n        - 基于工作负载类型的集群策略。\n        - 通过`自动伸缩`、`自动终止`、`昂贵实例类型`和`工作节点数量`降低成本的集群策略。\n\
    \        - 使用实例类型。\n\n在创建 Databricks 集群时，您还可以配置是否使用竞价实例来降低成本。如果竞价实例因不可用而被驱逐，将部署按需实例来替换这些实例：\n\
    \n        ![](img/Figure-2.26.jpg)\n\n        **图 2.26:** Databricks 集群 - 竞价实例\n\
    - **集群标签**：为 Databricks 工作区强制集群标签有助于企业组织监控云资源的成本。在创建集群期间可以以`键值对`的形式指定集群标签。\n\n\
    默认情况下，Databricks 为每个集群应用以下标签：\n\n        - `Vendor`（供应商）\n        - `Creator`（创建者）\n\
    \        - `ClusterName`（集群名称）\n        - `ClusterId`（集群 ID）\n\n"
- fmt: "\n\n* `RunName` (only applicable for job cluster)\n* `JobId` (only applicable\
    \ for job cluster)\n* `SqlEndpointId` (only applicable for Databricks SQL resources)\n\
    \nWe can add the custom tags to Databricks cluster by referring to the *cluster\
    \ configuration* page. Click on `Advanced settings` from the cluster configuration\
    \ page and select the `Tags` tab. Now, we can add the key-value pair to add the\
    \ tags to the Databricks cluster, highlighted as follows.\n\nIt is also a recommended\
    \ practice to enforce a few mandatory tags for each cluster creation to proactively\
    \ monitor the cost for the Databricks cluster:\n\n![](images/Figure-2.27.jpg)\n\
    \n**Figure 2.27:** Databricks cluster - tags\n\n### Cluster node initialization\
    \ scripts\nWe can also create a shell script, which will be started automatically\
    \ during the cluster initialization before the spark driver starts.\n\nWe can\
    \ use this `init scripts` to automate various tasks during the cluster restart\
    \ process:\n\n* Automatically install the `python` package to Databricks cluster.\n\
    * Change JVM system `classpath.`\n* Set environment variables and system properties\
    \ to Databricks cluster.\n* Change spark configurations.\n\nDatabricks supports\
    \ two types of `init` scripts:\n\n#### Cluster-scoped init scripts\nScope for\
    \ `cluster-scoped init scripts` is only limited to specific Databricks clusters\
    \ that are configured. It is more preferable to use `cluster-scoped init scripts`.\n\
    \nCluster-scope init scripts can be created for both interactive and job clusters.\
    \ Cluster scoped init scripts can be configured using Databricks UI, Databricks\
    \ CLI, and using cluster APIs. Cluster launch also fails if the configured `init`\
    \ script fails during the cluster restart process. As highlighted in the following\
    \ screenshot, you can go to edit cluster, and under `Advanced Options`, we can\
    \ configure cluster `config init` scripts:\n\n![](images/Figure-2.28.jpg)\n\n\
    **Figure 2.28:** Databricks cluster config init scripts\n\n#### Global init scripts\n\
    Global init scripts once configured will be applicable to all the Databricks clusters.\
    \ It imposes consistent cluster configurations across all Databricks clusters.\
    \ Global init scripts can be created and configured only by the Databricks workspace\
    \ administrator.\n\nGlobal init scripts can be created from the `Settings` ->\
    \ `Admin Console` tab from the Databricks UI from the `Global init scripts`, highlighted\
    \ as follows:\n\n![](images/Figure-2.29.jpg)\n\n**Figure 2.29:** Databricks cluster\
    \ config init scripts\n\nExecution order for the init script is as follows:\n\n\
    * Global\n* Cluster-named\n\ninit scripts can leverage the following Databricks\
    \ environment variables in the script:\n\n* `DB_CLUSTER_ID`: Cluster ID on which\
    \ the script is running\n* `DB_CONTAINER_IP`: Spark container private IP address\n\
    * `DB_CLUSTER_NAME`: Cluster name on which the script is running\n* `DB_PYTHON_VERSION`:\
    \ Cluster Python version\n* `DB_IS_JOB_CLUSTER`: Check if it is a job cluster\n\
    \nFor example, if you want to run `init` script only on specific Databricks instance\
    \ types, we can use the following script:\n\n```bash\necho DB_INSTANCE_TYPE\n\
    if [[ $DB_INSTANCE = “TRUE”]]; then\n<run this part only on driver>\nelse\n<run\
    \ this part only on driver>\nfi\n```\n\nWhen we create init scripts, script details\
    \ are captured in the cluster logs, and script start/stop events are also captured\
    \ in the cluster event logs:\n\n* **Garbage collection**: Working with big RAM\
    \ helps us to improve the cluster performance but it also leads to delay during\
    \ the garbage collection process. Such delays can be minimized by avoiding deploying\
    \ the clusters with large amounts of RAMs. If we need more memory for the computation,\
    \ it is recommended to deploy more cluster instances with smaller RAM sizes.\n\
    * **Cluster access control**: When the Databricks workspace is created, all users\
    \ can create and edit the clusters. Databricks workspace administrators can configure\
    \ cluster access control to restrict the cluster permission at user level: \n\n\
    ![](images/Figure-2.30.jpg)\n\n**Figure 2.30:** Databricks cluster, pool, job\
    \ access control\n\nFirst, Databricks administrator has to enable the cluster,\
    \ pool, and job access control to configure cluster access control. We can configure\
    \ two types of cluster permissions:\n\n* Cluster creation permission\n* Cluster-level\
    \ permission for users to attach, restart, resize, and manage the cluster\n\n\
    To configure cluster access control, go to computer from the Databricks workspace\
    \ UI, click on `Edit cluster`, and go to `Advanced options`:\n\n![](images/Figure-2.31.jpg)\n\
    \n**Figure 2.31:** Databricks cluster access control\n\nWe can assign the following\
    \ permission to users to manage the granular level of cluster permissions:\n\n\
    * `No Permissions`\n* `Can Attach To`\n* `Can Restart`\n* `Can Manage`\n\n# Databricks\
    \ SQL Analytics administration\n\nDatabricks SQL enables SQL users to run *ad\
    \ hoc SQL queries* on data lake and create multiple visualization types to query\
    \ results with different dimensions. Users can use Databricks SQL analytics from\
    \ the Databricks workspace if the following requirements are met:\n\n* Premium\
    \ Databricks workspace\n* E2 version of Databricks platform\n* Databricks SQL\
    \ access entitlement\n\nFrom the Databricks workspace UI, select persona: SQL,\
    \ as follows:\n\n![](images/Figure-2.32.jpg)\n\n**Figure 2.32:** Databricks SQL\n\
    \nWhen we log in, the Databricks SQL page looks as follows. There are multiple\
    \ options available for admins as well as Databricks SQL to run SQL queries, export\
    \ available data, and import the dashboards. We can also write SQL queries using\
    \ the SQL Query Editor and connect to BI tools like Tableau, Power BI, and so\
    \ on. Databricks SQL also has various sample data and in-built dashboards, which\
    \ we can play around with to start working with the Databricks SQL.\n\nIf you\
    \ want to access cloud storage data using Databricks SQL, we have to create an\
    \ instance profile. Additional instance profile and configuration is not required\
    \ if we want to use Databricks-managed tables:\n\n![](images/Figure-2.33.jpg)\n\
    \n**Figure 2.33:** Databricks SQL - home page\n\nUsing access control list, we\
    \ can configure permission to access Databricks SQL alerts, dashboards, data,\
    \ queries, and SQL endpoints. Databricks workspace administrator can manage the\
    \ following granular level of permissions for users:\n\n* Alert access control\n\
    * Dashboard access control\n* Data access control\n* Query access control\n* SQL\
    \ endpoint access control\n\nDatabricks SQL has an in-built feature to encrypt\
    \ queries as well as the query result:\n\n* **Custom key to encrypt queries and\
    \ query history**: We can use our own custom key to encrypt the Databricks SQL\
    \ queries and query history. If a custom key is already configured to encrypt\
    \ data for the managed services, no configuration is required. Custom encryption\
    \ key only encrypts the data at rest; it doesn’t the data in transit.\n* **Custom\
    \ key to encrypt query result:** It is also possible to encrypt the query result\
    \ to avoid exposing sensitive data during the query execution with Databricks\
    \ SQL. Now, let us see how to create a table with records from the Databricks\
    \ dataset and allow users to access the table. We can add the users using the\
    \ admin console and by clicking on the `Add User` button from the `Users` tab,\
    \ as follows:\n\n![](images/Figure-2.34.jpg)\n\n**Figure 2.34:** Databricks admin\
    \ console - add users\n"
