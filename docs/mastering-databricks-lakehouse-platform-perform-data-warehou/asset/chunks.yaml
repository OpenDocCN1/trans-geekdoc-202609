    \ |\n\n    | `name` || STRING || Pipeline name |\n\n    | `storage` || STRING\
    \ || DBFS directory |\n\n    | `configuration` || Map of `STRING:STRING` || Spark\
    \ configuration key-value pair to run the pipeline |\n\n    | `clusters` || Array\
