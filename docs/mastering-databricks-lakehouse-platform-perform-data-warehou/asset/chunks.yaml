    \nvelocity [102](#c03.xhtml#page102)\n\nveracity [102](#c03.xhtml#page102)\n\n\
    versioning [102](#c03.xhtml#page102)\n\nA\n\nabstracted feature class [217](#c07.xhtml#page217)"
