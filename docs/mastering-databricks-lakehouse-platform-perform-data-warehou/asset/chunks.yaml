    \ working\n\n# [Log model metrics](#toc.xhtml#s115a)\n\nMLflow tracking is an\
    \ API and UI for logging parameters, code versions, metrics, and output files\
    \ while running the machine learning code and related visualization. With MLflow\
    \ tracking, we can log and query experiments using Python, REST API, R, and Java:\n\
    \n![](images/Figure-7.33.jpg)\n\n**Figure 7.33:** MLflow tracking  \n\n**Source**:\
    \ **[https://mlflow.org/](https://mlflow.org/)**\n\nMLflow tracking is organized\
    \ around the concept of runs, which are the executions of the piece of machine\
    \ learning/Data Science code. Each piece of code records a piece of information:\n\
    \n*   **Code version**: If it was a run from the MLflow project, then the Git\
    \ commit hash is used.\n\n*   **Start and end time**: It displays the start and\
    \ end time of the MLFlow experiment run.\n\n*   **Source**: It is the name of\
    \ the file that is required to launch the MLflow project. It is, basically, the\
    \ trigger point to run the MLflow project.\n\n*   **Parameters**: Parameters are\
    \ normally in the form of key-value pairs. Both the key and values are in the\
    \ form of string.\n\n*   **Metrics**: Each defined metric for the MLflow experiment\
    \ can be updated during the MLflow run, and MLflow records and visualizes the\
    \ full metric history.\n\n*   **Artifacts**: Artifacts from the MLflow run can\
    \ be in any format.\n\n# [Conclusion](#toc.xhtml#s116a)\n\nIn this chapter, we\
    \ explored machine learning model management with Databricks in detail. We took\
    \ a quick tour of how to implement end-to-end machine learning solutions using\
