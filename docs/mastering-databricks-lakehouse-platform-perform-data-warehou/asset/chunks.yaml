    \  Can we create non-Databricks files using the Git integration? \n\n    1.  Yes\n\
    \n    2.  No\n\n5.  Can we create Azure Key Vault backed secret scope using Databricks\
    \ CLI? \n\n    1.  Yes\n\n    2.  No\n\n# [Answers](#toc.xhtml#s124a)\n\n1.  **a**\n\
    \n2.  **a**\n\n3.  **c**\n\n4.  **a**\n\n5.  **a**\n\n# [CHAPTER 9](#toc.xhtml#c09)\n\
    \n# [Visualization with Databricks](#toc.xhtml#c09)\n\nDatabricks platform has\
    \ native support of various BI tools like **Power BI**, **Tableau**, **Looker**,\
    \ **Qlik**, **TIBCO**, **Microstrategy**, **ThoughtSpot**, **Mode**, and **SQL**\
    \ workbench. We can create interactive visualizations using the data present in\
    \ the Databricks platform with these BI tools.\n\nIn the previous chapter, we\
    \ explored enabling continuous integration and delivery with Databricks platform.\
    \ In this chapter, you will learn about visualizations with Databricks Lakehouse\
    \ platform with various visualization tools, like Power BI and Tableau.\n\n# [Structure](#toc.xhtml#s125a)\n\
    \nIn this chapter, you will learn the following aspects of visualizations with\
    \ Databricks Lakehouse Platform:\n\n*   Databricks SQL Analytics\n\n*   Databricks\
    \ as a data source with Tableau\n\n*   Databricks direct query with Power BI\n\
    \n*   Databricks interactive analysis with Qlik\n\n# [Objectives](#toc.xhtml#s126a)\n\
    \nAfter studying this chapter, you should be able to understand the basics of\
    \ Databricks SQL Analytics. You will also learn about how to create visualizations\
    \ using Databricks with BI tools.\n\n# [Databricks SQL Analytics](#toc.xhtml#s127a)\n\
    \nDatabricks also has native support of SQL language, which allows developers\
    \ to develop SQL applications using the Databricks SQL UI and BI tools.\n\nLet’s\
    \ look at the differences between Databricks SQL UI and BI tools:\n\n| **Databricks\
    \ SQL UI** || **BI tools** |\n\n| --- | --- |\n\n| Ad hoc analysis of Data Lake\
    \ using SQL commands || No code interface for data analysis |\n\n| Create dashboards\
    \ to corroborate business requirements || Create enterprise-wide reports and dashboards\
    \ |\n\n| Monitor dashboards with alerts || Create interrelated dashboards with\
    \ filtering and advanced customizations |\n\n**Table 9.1:** Comparison Databricks\
    \ SQL and BI tools\n\nWe can use the Data Explorer to access databases and tables\
    \ in Databricks. Using Data Explorer, we can view schema details and see sample\
    \ data and table details. Administrators can also change the object-level permission\
    \ to manage data access in Databricks.\n\nWe can access databases from the Data\
    \ Explorer using these steps:\n\n1.  Click on the ![](images/c09Clip-1.jpg)icon\
    \ from the Databricks UI. which will display a list of databases:\n\n    ![](images/Figure-9.1.jpg)\n\
    \n    **Figure 9.1:** Databricks home page\n\n2.  We can also view table schema\
    \ with sample data using the Data Explorer. Go to the *display* `Databases` page,\
    \ as highlighted in the preceding screenshot, and select the table that will display\
    \ table schema with its properties and a preview of the sample data:\n\n    ![](images/Figure-9.2.jpg)\n\
    \n    **Figure 9.2:** Databricks - access database and tables\n\n3.  In order\
    \ to create visualizations while working with Databricks SQL, you can first open\
    \ `SQL query editor` using the Databricks SQL:\n\n    ![](images/Figure-9.3.jpg)\n\
    \n    **Figure 9.3:** Databricks - SQL query editor\n\n4.  Now, open `SQL query\
    \ editor` and execute the SQL query highlighted in the following screenshot; it\
    \ will display the result in a tabular format:\n\n    ![](images/Figure-9.4.jpg)\n\
    \n    **Figure 9.4:** Databricks - execute SQL query\n\n5.  Now, click on the\
    \ `Add Visualization` button to create a visualization. This will open up the\
    \ `Visualization Editor` page, which can be configured according to our requirements:\n\
    \n    ![](images/Figure-9.5.jpg)\n\n    **Figure 9.5:** Databricks SQL - visualization\n\
    \n    We can configure the following properties in the visualization editor:\n\
    \n    *   `Visualization Type`: `Chart`, `Cohort`, `Counter`, `Details View`,\
    \ `Funnel`, `Map`\n\n    *   `Visualization Name`: Name of the visualization\n\
    \n    *   `General`: `Chart type`, `X/Y Column`, `Group By`, `Error Column`\n\n\
    \    *   `X-Axis`: Set scale\n\n    *   `Y-Axis`: Set left/right Y-axis\n\n  \
    \  *   `Series`: Display the data\n\n    *   `Color`: Display the data\n\n   \
    \ *   `Data Labels`: Show labels with different data/time formats\n\n6.  Once\
    \ you click on the `Save` **button**, visualizations will be saved with the visualization\
    \ name.\n\n7.  We can also add the visualization to the dashboard. Click on the\
    \ *three vertical dots,* as highlighted in the following screenshot, and select\
    \ `Add to Dashboard`:\n\n    ![](images/Figure-9.6.jpg)\n\n    **Figure 9.6:**\
    \ Add Databricks SQL Visualization to Dashboard\n\n8.  Write the dashboard name\
    \ and click on `OK`; it will add visualization to a specific dashboard:\n\n  \
    \  ![](images/Figure-9.7.jpg)\n\n    **Figure 9.7:** Databricks SQL Analytics\
    \ dashboard\n\n    You can also download the chart visualization as an image file.\n\
    \n    There are multiple types of visualizations available in Databricks SQL:\n\
    \n    *   **Boxplot**\n\n    *   **Charts: bar, area, pie**\n\n    *   **Cohort**\n\
    \n    *   **Counter**\n\n    *   **Funnel**\n\n    *   **Map**\n\n    *   **Pivot\
    \ table**\n\n    *   **Sankey**\n\n    *   **Sunburst**\n\n    *   **Word cloud**\n\
    \n    Databricks SQL visualizations that use *X* and *Y axes* are known as **charts**.\
    \ We can create multiple types of charts in Databricks SQL.\n\n    We can combine\
    \ Databricks visualizations with text boxes to provide explanation about the data.\
    \ To view the list of available dashboards, click on **dashboards** in the left\
    \ pane, as highlighted in the following screenshot:\n\n    ![](images/Figure-9.8.jpg)\n\
    \n    **Figure 9.8:** Databricks dashboards - display list of dashboards\n\n9.\
    \  Click on the `Create Dashboard` button to create a new dashboard:"
