    \ email notifications:\n\n     ![](images/Figure-9.18.jpg)\n\n     **Figure 9.18:**\
    \ Configure alert destination\n\n     We can also create favorites and tags to\
    \ efficiently filter and search queries and dashboards available in the Databricks\
    \ SQL.\n\n     In order to create a favorite query or dashboard, click on the\
    \ *Star* button to the left of the title in the query and dashboard. Once we click\
    \ on the *Favorite* button, it will turn *yellow*:\n\n     ![](images/Figure-9.19.jpg)\n\
    \n     **Figure 9.19:** Databricks SQL - favorite dashboard\n\n16.  We can create\
    \ meaningful tags to queries and dashboard for our project. Hover over to the\
    \ dashboard in Databricks SQL, as shown in the following screenshot, and click\
    \ on the `+Add tag` button:\n\n     ![](images/Figure-9.20.jpg)\n\n     **Figure\
    \ 9.20:** Databricks SQL - dashboard tags\n\n     This will open the pop-up box,\
    \ as follows, where we can add new tags or edit the existing ones. Once it is\
    \ done, click on `Save`:\n\n     ![](images/Figure-9.21.jpg)\n\n     **Figure\
    \ 9.21:** Databricks SQL - add dashboard tags\n\n     Additionally, Data Explorer\
    \ in the Databricks SQL enables us to explore and manage permissions on the databases\
    \ and tables. We can view the schema details, preview the sample data, and see\
    \ the table details and properties:\n\n     ![](images/Figure-9.22.jpg)\n\n  \
    \   **Figure 9.22:** Databricks SQL - Data Explorer\n\n     As highlighted in\
    \ the preceding screenshot, once you click on the Data Explorer, it will display\
    \ the list of available databases.\n\n     In the Data Explorer, we can also view\
    \ the schema of the table, preview the sample data, and table properties:\n\n\
    \     ![](images/Figure-9.23.jpg)\n\n     **Figure 9.23:** Databricks SQL - Data\
    \ Explorer tables\n\n17.  Once you select one of the tables available in the database,\
    \ it will display the table schema, as follows:\n\n     ![](images/Figure-9.24.jpg)\n\
    \n     **Figure 9.24:** Databricks SQL - table schema preview\n\n18.  Click on\
    \ **sample data** if you want to preview the sample data. It will display a few\
    \ sample records for each column of the table:\n\n     ![](images/Figure-9.25.jpg)\n\
    \n     **Figure 9.25:** Databricks SQL - table preview\n\n19.  Click on the `Details`\
    \ tab to view the location of the table files, type of the table, and its properties:\n\
    \n     ![](images/Figure-9.26.jpg)\n\n     **Figure 9.26:** Databricks SQL - table\
    \ details\n\n20.  Click on the `Queries` **button** in the left pane to view the\
    \ list of saved queries:\n\n![](images/Figure-9.27.jpg)\n\n**Figure 9.27:** Databricks\
    \ SQL - table queries\n\nAs shown in the following screenshot, you can filter\
    \ the list of queries using different views, like `All Queries`, `My Queries`,\
    \ `Favorites`, `Trash`, and `Admin View`:\n\n![](images/Figure-9.28.jpg)\n\n**Figure\
    \ 9.28:** Databricks SQL - display saved queries\n\nWhile writing queries in Databricks\
    \ SQL, we can also create query parameters whose value can be substituted into\
    \ the query at any time. Any string between the double curly braces **{{ }}**\
    \ is treated as a query parameter.\n\nWe can create the following types of query\
    \ parameters while writing the Databricks SQL queries:\n\n*   **Text** (**[https://docs.databricks.com/sql/user/queries/query-parameters.html#text](https://docs.databricks.com/sql/user/queries/query-parameters.html#text)**)\n\
    \n*   **Number** (**[https://docs.databricks.com/sql/user/queries/query-parameters.html#number](https://docs.databricks.com/sql/user/queries/query-parameters.html#number)**)\n\
    \n*   **Date, Date and Time, Date and Time (with seconds)** (**[https://docs.databricks.com/sql/user/queries/query-parameters.html#date-date-and-time-date-and-time-with-seconds](https://docs.databricks.com/sql/user/queries/query-parameters.html#date-date-and-time-date-and-time-with-seconds)**)\n\
    \n*   **DateRange, Date and Time Range, Date and Time Range (with seconds)** (**[https://docs.databricks.com/sql/user/queries/query-parameters.html#daterange-date-and-time-range-date-and-time-range-with-seconds](https://docs.databricks.com/sql/user/queries/query-parameters.html#daterange-date-and-time-range-date-and-time-range-with-seconds)**)\n\
    \n*   **Dropdown List** (**[https://docs.databricks.com/sql/user/queries/query-parameters.html#dropdown-list](https://docs.databricks.com/sql/user/queries/query-parameters.html#dropdown-list)**)\n\
    \n*   **Query Based Dropdown List** (**[https://docs.databricks.com/sql/user/queries/query-parameters.html#query-based-dropdown-list](https://docs.databricks.com/sql/user/queries/query-parameters.html#query-based-dropdown-list)**)\n\
    \nFor example, to create a text parameter, we can create a query, as follows:\n\
    \n`SELECT * FROM users WHERE name={{ text_param }}`"
