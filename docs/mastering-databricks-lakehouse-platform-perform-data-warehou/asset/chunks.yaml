- fmt: "\nThe next step is to create a table using the Databricks datasets. On the\
    \ home page of Databricks SQL, click on the `Create` button and select the query:\n\
    \n![](images/Figure-2.35.jpg)\n\n**Figure 2.35:** Databricks SQL - create table\n\
    \nPut the following query in the Query Editor and execute it:\n\n```sql\nCREATE\
    \ TABLE default.people10m OPTIONS (PATH ‘dbfs:/databricks-datasets/learning-spark-v2/people/people-10m.delta’)\n\
    ```\n\n![](images/Figure-2.36.jpg)\n\n**Figure 2.36:** Databricks SQL - execute\
    \ query\n\nOnce the query execution is completed, configure the access to the\
    \ table using the data explorer or query editor. When you click on the ![](images/c02Clip-1.jpg)button,\
    \ you will be able to see the query history in the sidebar. Once the table is\
    \ created, we can run the SQL query and create a visualization.\n\nGo to the home\
    \ page of Databricks SQL and execute the query to retrieve the data from the table.\
    \ Once the query result appears on the screen, click on the `Add Visualization`\
    \ button to create visualization on the query output:\n\n![](images/Figure-2.37.jpg)\n\
    \n**Figure 2.37:** Databricks SQL - create visualizations\n\nIt is also possible\
    \ to save this visualization and create a dashboard out of it, which can be shared\
    \ with other users.\n\nDatabricks SQL has the following components:\n\n* **Interface**\n\
    \    * **UI**: Graphical interface to create dashboards and queries, SQL endpoints,\
    \ query history, and alerts.\n    * **REST API**: Interface allows you to automate\
    \ tasks on the Databricks SQL objects.\n* **Data management**\n    * **Visualization**:\
    \ Graphical representation of the results after query execution.\n    * **Dashboard**:\
    \ Query visualization with description.\n    * **Alert**: Query notification when\
    \ query threshold reaches.\n* **Computation management**\n    * **Query**: Valid\
    \ SQL statement for execution.\n    * **SQL endpoint**: Computation resource to\
    \ execute SQL queries.\n    * **Query history**: History of executed SQL queries.\n\
    * **Authentication and authorization**\n    * **Users and groups**: Individual\
    \ users and group of users who has system access.\n    * **Personal access token**:\
    \ Confidential string to authenticate REST API and connect to BI Tools using the\
    \ SQL endpoints.\n    * **Access control list**: Set of permissions attached to\
    \ the principal that requires access to the object.\n\n**SQL endpoint** is a computation\
    \ resource to run the SQL commands on Databricks environment. There are two types\
    \ of SQL endpoints in Databricks: \n\n* **Classic SQL endpoint**: Classic SQL\
    \ endpoint uses the compute resources in the AWS account.\n* **Serverless SQL\
    \ endpoint**: Databricks-managed SQL endpoints are called serverless SQL endpoints\
    \ that use the compute resources from the Databricks cloud account. It is much\
    \ easier to manage endpoints with serverless SQL endpoints and avoid delays in\
    \ the launch time.\n\nThe following are the permissions are required to create\
    \ the SQL endpoint in Databricks workspace:\n\n* Cluster creation permission in\
    \ Databricks Data Science and Engineering.\n* Can manage permission in Databricks\
    \ SQL.\n\nSQL endpoints can be viewed using the ![](images/c02Clip-2.jpg)icon\
    \ of SQL endpoints, as follows:\n\n![](images/Figure-2.38.jpg)\n\n**Figure 2.38:**\
    \ Databricks SQL endpoints\n\nWe can also create and manage alerts destinations\
    \ for proactive monitoring. When the configured alerts will be invoked, it will\
    \ blob of related data to configured alert destinations. Only a Databricks admin\
    \ can configure and manage the alerts.\n\nBy default, alert notification will\
    \ be sent to email. No additional configurations are required to get alert notifications\
    \ via email. In order to configure alert destination, we can go to the `Settings`\
    \ page and select `User Settings`:\n\n![](images/Figure-2.39.jpg)\n\n**Figure\
    \ 2.39:** Databricks SQL settings\n\nThen, select the alert destinations:\n\n\
    ![](images/Figure-2.40.jpg)\n\n**Figure 2.40:** Databricks SQL alert destinations\n\
    \nUsing Databricks SQL endpoints, we can connect to business intelligence tools\
    \ to create interactive visualizations and dashboards using the following tools:\n\
    \n* Power BI\n* Tableau\n* Looker\n* Qlik\n* TIBCO\n* MicroStrategy\n* ThoughtSpot\n\
    * Mode\n* SQL Workbench\n\nDatabricks SQL also supports REST API to manage the\
    \ queries and SQL endpoints. We can create a maximum of `30 REST API` requests\
    \ for each workspace. If we make more than `30 requests`, we can get a `429 error\
    \ code`.\n\nDatabricks SQL has a rich set of SQL commands, which can be used to\
    \ execute SQL queries. Let’s go through a few SQL commands for reference.\n\n\
    * **DDL statements**: Following are the data definition language commands: \n\
    \    * `ALTER DATABASE`\n    * `ALTER TABLE`\n    * `ALTER VIEW`\n    * `CREATE\
    \ DATABASE`\n    * `CREATE FUNCTION`\n    * `CREATE TABLE`\n    * `CREATE VIEW`\n\
    \    * `DELETE DATABASE`\n    * `DROP DATABASE`\n    * `DROP TABLE`\n    * `DROP\
    \ FUNCTION`\n    * `DROP VIEW`\n* **DML statements**: Following are the data manipulation\
    \ language commands: \n    * `DELETE FROM`\n    * `INSERT INTO`\n    * `INSERT\
    \ OVERWRITE`\n    * `MERGE INTO`\n* **Data retrieval statements**: Following are\
    \ the data retrieval commands: \n    * `Query`\n    * `Select`\n    * `Values`\n\
    * **Delta lake statements**: Following are the delta lake commands: \n    * `CACHE\
    \ SELECT`\n    * `CONVERT TO DELTA`\n    * `DESCRIBE HISTORY`\n    * `GENERATE`\n\
    \    * `OPTIMIZE`\n    * `RESTORE`\n    * `VACUUM`\n* **Auxiliary statements**:\
    \ Following are the list of auxiliary commands: \n    * `Analyze TABLE`\n    *\
    \ `DESCRIBE FUNCTION`\n    * `DESCRIBE TABLE`\n    * `DESCRIBE DATABASE`\n   \
    \ * `DESCRIBE QUERY`\n    * `SHOW DATABASES`\n    * `SHOW FUNCTIONS`\n    * `SHOW\
    \ GROUPS`\n    * `SHOW PARTITIONS`\n    * `SHOW TABLE`\n    * `SHOW TABLES`\n\
    \    * `SHOW USERS`\n    * `SHOW VIEWS`\n"
