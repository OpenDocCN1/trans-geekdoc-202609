  trans: "\n\n### 1. 使用 `mlflow.<model_flavor>.log_model()` 方法：\n\n```python\nimport\
    \ mlflow\nimport mlflow.sklearn\nwith mlflow.start_run(run_name=”RUN_NAME”) as\
    \ run:\n    params = {\"n_estimators”: 10, “random_state”: 30}\n    # 使用 MLflow\
    \ API 记录参数和指标\n    mlflow.log_params(params)\n    mlflow.log_param(“param_1”,\
    \ randint(0, 50))\n    mlflow.log_metrics({\"metric_1”: random(), “metric_2”:\
    \ random() + 1})\n```\n\n### 2. 使用 `mlflow.register_model()`：\n通过代码块，我们可以将模型注册到\
    \ MLflow 模型注册中心：\n\n```python\nresult = mlflow.register_model(\n    “runs:/xxxxxxxxxxxx/sklearn-model”,\n\
    \    “sk-learn-reg”\n)\n```\n\n如果不存在给定名称的注册模型，前一种方法将注册新模型并创建 `version 1`。如果模型已存在，该方法将创建一个新的模型版本并返回版本对象。\n\
    \n### 3. 使用 `create_registered_model`：\n当我们使用此方法时，如果模型名称存在，该方法将抛出 MLflow `exception`，因为此方法需要唯一的名称：\n\
    \n```python\nfrom mlflow.tracking import MlflowClient\nclient = MlflowClient()\n\
    client.create_registered_model(“regression-reg-model”)\n```\n\n一旦 MLflow 模型被注册，我们可以使用\
    \ `mlflow.<model_flavor>.load_model()` 或 `load_model()` 获取模型。\n\n让我们看看从 MLflow\
    \ 模型注册中心获取模型的各种方式：\n\n#### 3.1 获取特定的模型版本\n将版本号作为模型 URI 的一部分，从 MLflow 模型注册中心获取特定模型：\n\
    \n```python\nimport mlflow.pyfunc\nmodel_name = “regression-reg-model”\nmodel_version\
    \ = 1\nmodel = mlflow.pyfunc.load_model(\n    model_uri=f”models:/{model_name}/{model_version}”\
    \ )\nmodel.predict(data)\n```\n\n#### 3.2 获取特定阶段的最新模型版本\n为了从特定阶段获取最新的模型版本，我们必须提供能够获取模型最新版本的模型\
    \ URI：\n\n```python\nimport mlflow.pyfunc\nmodel_name = “regression-reg-model”\n\
    stage = ‘Staging’\nmodel = mlflow.pyfunc.load_model(\n    model_uri=f”models:/{model_name}/{stage}”\n\
    )\nmodel.predict(data)\n```\n\n一旦模型在 MLflow 模型注册中心注册，我们就可以从 `model` 注册中心提供 MLflow\
    \ 模型、添加或更新 MLflow 模型描述、重命名 MLflow 模型或转换 MLflow 模型的阶段。\n\n#### 3.3 从模型注册中心提供 MLflow\
    \ 模型\n一旦 MLflow 模型在注册中心注册，我们可以在主机上作为服务提供模型：\n\n```sh\n#!/usr/bin/env sh\n# 设置模型注册\
    \ URL 的环境变量\nexport MLFLOW_TRACKING_URI>=http://localhost:5000\n# 从模型注册中心提供生产模型\n\
    mlflow models serve -m “models:/linear-reg-model/Production”\n```\n\n#### 3.4\
    \ 添加/更新 MLflow 模型描述\n我们可以使用 `update_model_version()` 更新模型版本的描述：\n\n```python\n\
    client = MlflowClient()\nclient.update_model_version(\n    name=”sk-learn-random-forest-reg-model”,\n\
    \    version=1,\n    description=”This model version is a linear regression machine\
    \ learning model”\n)\n```\n\n#### 3.5 从模型注册中心重命名 MLflow 模型\n可以使用 `rename_registered_model()`\
    \ 方法重命名存储在 MLflow 模型注册中心的现有 MLflow 模型：\n\n```python\nclient = MlflowClient()\n\
    client.rename_registered_model(\n    name=”linear-reg-model”,\n    new_name=”linear-reg-model-100”\n\
    )\n```\n\n#### 3.6 MLflow 模型阶段转换\n随着时间的推移，随着模型的演进，模型的生命周期也会发生变化。我们可以将注册的模型转换到以下阶段之一：`Staging`（暂存）、`Production`（生产）或\
    \ `Archived`（归档）：\n\n![](img/Figure-7.27.jpg)\n\n**图 7.27:** MLflow 模型阶段生命周期\n\
    \n#### 3.7 搜索 MLflow 模型\n我们可以使用以下方法搜索并获取注册中心中所有注册模型的列表：\n\n```python\nfrom pprint\
    \ import pprint\nclient = MlflowClient()\nfor rm in client.registered_models():\n\
    \    pprint(dict(rm), indent=5)\n```\n\n#### 3.8 归档 MLflow 模型\n如果需要，我们还可以将模型版本从生产阶段移动到归档阶段：\n\
    \n```python\n# 将版本 3 模型从 Production 归档到 Archived\nclient = MlflowClient()\nclient.transition_model_version_stage(\n\
    \    name=”regression-model”,\n    version=3,\n    stage=”Archived”\n)\n```\n\n\
    #### 3.9 删除 MLflow 模型\n也可以删除模型：\n\n```python\n# 删除注册的模型\nclient.delete_registered_model(name=\"\
    model-name\")\n```\n\n### 4. 部署策略\n\n一旦 MLflow 模型注册，我们可以使用 `mlflow.<model_flavor>.load_model()`\
    \ 或 `load_model()` 获取模型。\n\n一旦模型在 MLflow 模型注册中心注册，我们可以从 `model` 注册中心提供 MLflow\
    \ 模型、添加或更新 MLflow 模型描述、重命名 MLflow 模型或转换 MLflow 模型的阶段。\n\n**模型部署**可以被视为在环境中提供训练好的机器学习模型的过程。有多种方法可以将机器学习模型部署到环境中：\n\
    \n1. **离线预测**：离线预测通常发生在本地机器，直接通过 Python 代码生成预测。离线预测的一个示例是在黑客期间对测试集进行预测。\n\n2.\
    \ **批量预测**：在批量预测中，我们通过定期定期以文件作为输入来执行一组预测：\n\n   ![](img/Figure-7.30.jpg)\n\n \
    \  **图 7.30:** 机器学习部署类型\n\n3. **实时预测**：也可以通过对云端提供的模型进行 HTTP 调用来实现按需预测。例如，有一个检测对象的网站。我们必须将图片作为输入上传到网站并检测对象作为输出：\n\
    \n   ![](img/Figure-7.31.jpg)\n\n   **图 7.31:** 实时数据处理\n\n4. **流式预测**：流式处理与批量和实时处理相似，但它有一个额外的队列来处理数据量，并能够无论到达速率如何都提供处理速率。\n\
    \n我们还可以使用第三方工具如 `mlflow.<deploy-type>.deploy()` 来部署模型。\n\n"
