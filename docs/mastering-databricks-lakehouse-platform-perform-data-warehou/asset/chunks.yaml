    Imagine MLflow `Experiment` as a folder that contains multiple model training
    runs as status files. Each MLflow model training run contains the status of execution
    of ML code and its metadata, artifacts information, and so on:


    ![](images/Figure-1.31.jpg)


    **Figure 1.31:** Machine learning experiments


    From the MLflow `Experiment` perspective, we can visualize and search all these
    runs and compare them with other experiment runs. We can also download artifacts
    and metadata of each model training run from the experiment. Overall, MLflow `Experiment`
    lets you organize all the MLflow model training runs:


    ![](images/Figure-1.32.jpg)


    **Figure 1.32:** Machine learning experiments overview


    # Interface


    It is a way to interact with the Databricks services. Databricks supports three
    interfaces.


    ## Databricks UI


    It is a simple web-based graphical user interface. Here, we will interact with
    all the Databricks computational resources and workspaces. This is usually recommended
    while working on interactive data processing or machine learning. The following
    is Databricks web-based GUI; it is very simple to navigate among different Databricks
    options:


    ![](images/Figure-1.33.jpg)


    **Figure 1.33:** Databricks overview


    ## Databricks API


    Databricks services can be triggered using Databricks supported REST API. It has
    two versions of `API REST API 1.2` and `REST API 2.0`. Out of these versions,
    `REST API 2.0` is the latest version and supports the latest functionality:


    ![](images/Figure-1.34.jpg)


    **Figure 1.34**


    Refer to the following link for better insights into the API:


    [https://docs.databricks.com/dev-tools/api/latest/index.html](https://docs.databricks.com/dev-tools/api/latest/index.html)


    ## Databricks CLI


    It is an open-source CLI built on top of Databricks API. This tool is entirely
    built using Python.


    ## Data management


    In this section, we will talk about the components that hold different types of
    data, which will be used while performing data engineering and machine learning
    processes.


    ## DBFS


    **Databricks File System** (`DBFS`) is a distributed file system, which is the
    same as **Hadoop Distributed File System** (`HDFS`). DBFS is built on top of cloud
    provider’s object storage. For example, if a Databricks is being accessed from
    AWS, DBFS will, by default, use `S3` as its object storage. The same holds for
    `Azure Blob` in Azure and `GCS` in GCP. DBFS can contain images, data files, and
    libraries, and so on. DBFS also allows mounting of different storages with DBFS
    as folders. The data in DBFS is accessible by the clusters; this data is persisted
    even after the cluster is terminated:


    ![](images/Figure-1.35.jpg)


    **Figure 1.35:** Create new table


    ## Tables


    **Tables** are representation of data in structured format of rows and columns.
    They can be queried using Spark SQL and Spark APIs:


    ![](images/Figure-1.36.jpg)


    **Figure 1.36:** Create table


    ## Database


    Logical grouping of all


    ## Metastore


    Metastore holds the metadata related to all in Databricks, such as tables. It
    has two main functionalities: **data abstraction** and **data discovery**. Without
    the metastore, cluster cannot access the data. With the metastore, user can explore
    the data. Databricks constantly updates the metastore, which, in turn, improves
    the usability, performance, and security of big data processing. environment.


    ## Computation management


    In this section, we will talk about different concepts.


    ## Cluster


    It is a resource on which notebooks or jobs are executed:


    ![](images/Figure-1.37.jpg)


    **Figure 1.37:** Compute


    ## All-purpose cluster


    It is used for interactive processing. This type of cluster can be manually restarted
    or terminated:


    ![](images/Figure-1.38.jpg)


    **Figure 1.38:** Compute clusters


    ## Job cluster


    This cluster is created whenever any job is triggered. These clusters terminate
    once the job is completed:


    ![](images/Figure-1.39.jpg)


    **Figure 1.39:** Job clusters


    ## Pools


    A **pool** is, essentially, a group of warm instances that cluster can pull from.
    To utilize the pool, cluster needs to be attached. If there is any additional
    demand from cluster, the pool will expand by allocating new instances. Once the
    cluster is terminated, all instances that were used will be returned to pool.
    **Databricks does not charge for instances which are idle.**


    ![](images/Figure-1.40.jpg)


    **Figure 1.40:** Pools


    ## Databricks runtime


    It is an environment in which a set of software components, including Apache Spark,
    is available and running on the clusters. Databricks runtime is fully managed
    by Databricks. Databricks constantly updates the runtime, which, in turn, improves
    the usability, performance, and security of big data processing. There are multiple
    types of runtime offered by Databricks:


    ![](images/Figure-1.41.jpg)


    **Figure 1.41:** Runtime


    ## Databricks runtime


    This runtime consists of Apache Spark and other components like:


    *   Delta Lake, a next gen storage layer built on Apache Spark that offers ACID
    transactions

    *   Installed Python, Scala, Java, and R libraries

    *   GPU libraries for GPU enabled clusters:


    ![](images/Figure-1.42.jpg)


    **Figure 1.42:** Runtime - Standard


    ## Databricks runtime for machine learning


    This runtime consists of all the components from Databricks runtime and all the
    popular machine learning libraries like `pytorch`, `tensorflow`, `keras`, and
    `XGBoost`. This runtime also ensures the proper library compatibility. Using this
    runtime speeds up the cluster creation process:


    ![](images/Figure-1.43.jpg)


    **Figure 1.43:** Runtime - ML


    ## Photon


    **Photon** is native vectorized query engine. It is written using C++. Photon
    engine is compatible with all Apache Spark API and Spark SQL. Vectorized way of
    data processing helps in efficiently utilizing the CPU of the underlying hardware
    as this runtime is a part of high-performance runtime.


    There are some limitations of this runtime:


    *   Does not support spark structured streaming.

    *   Does not support Spark UDF’s.

    *   This runtime is not recommended while querying small amounts of data.

    *   Window and sort functions are not supported by photon high performance runtime.

