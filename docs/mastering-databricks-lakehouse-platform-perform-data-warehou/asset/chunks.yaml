    \n    `git push -u origin master`\n\n    After understanding the features and\
    \ best practices of working with Databricks repos, let’s also explore the limitations\
    \ of this feature:\n\n    *   **Missing merge functionality with Git dialog**:\
    \ When the development branch falls behind the master branch from the remote repo,\
    \ it is not possible to update the branch from the Databricks to avoid the merge\
    \ conflicts during the pull request.\n\n    *   **Syncing of delete branches from\
    \ the remote repos**: After integrating the repos with Databricks platform, even\
    \ though the branches are deleted from the remote repos, they won’t be deleted\
    \ from the list of branches with the Databricks repos.\n\n# Automated multi environment\
    \ CI/CD deployment with DevOps\n\nThe CI/CD way of working is a modern software\
    \ development practice that focuses on the frequent incremental code changes with\
    \ **automated testing**, **package screening**, **static code analysis**, and\
    \ so on to improve the code quality of the deliverables.\n\nContinuous integration\
    \ pipeline automates build and tests steps to ensure that the request code changes\
    \ are as per the standard and reliable before merging the changes to the master\
    \ branch.\n\nOnce the continuous integration pipeline is successful, it will trigger\
    \ the release pipeline to deploy the code/merged changes from the master branch\
    \ to higher environments:\n\n![](images/Figure-8.20.jpg)\n\n**Figure 8.20:** Continuous\
    \ integration and deployment\n\nLet’s first understand the high-level steps involved\
    \ in implementing continuous integration and deployment while working with the\
    \ Databricks platform:\n\n*   **Continuous integration** \n\n    1.  **Databricks\
    \ notebooks and source code interaction**: \n\n        1.  Develop the source\
    \ code and perform tests using Databricks platform or using IDEs\n\n        2.\
    \  Perform unit, integration, and regression tests\n\n        3.  Commit the source\
    \ code and changes to the Git branch\n\n    2.  **Build pipeline for continuous\
    \ integration**: \n\n        1.  Pull the new code changes temporarily\n\n   \
    \     2.  Run automated tests\n\n        3.  Merge the requested changes to the\
    \ master branch\n\n        4.  Build the package/libraries from the source code\n\
    \n    3.  **Create artifacts to trigger the release process:**\n\n        Create\
    \ artifacts and trigger the release pipeline for the deployment\n\n*   **Continuous\
    \ deployment** \n\n    1.  **Deploy Databricks notebooks for continuous deployment**\
    \ \n\n        1.  Deploy the Databricks notebooks to the respective environment,\
    \ along with the configuration files and related package dependencies\n\n    \
    \    2.  Deploy libraries for code reusability\n\n    2.  **Automated testing**\n\
    \n        Run automated tests in respective environments and repost the test results\n\
    \n    3.  **Operationalize Databricks notebooks**\n\n        Once the notebooks\
    \ are deployed, schedule the notebooks for your data and AI workload as per the\
    \ requirements\n\nAfter understanding the high-level steps of implementing CI/CD\
    \ pipeline with Databricks, let us understand how to create, build, and release\
    \ pipeline:\n\n1.  **Integration with Git tools**\n\n    The first step is to\
    \ integrate your Databricks notebooks with the Git tools using the Databricks\
    \ repos feature. We can sync the work done in Databricks with the remote repos\
    \ of various Git providers to utilize various features of **version controlling**,\
    \ **branch policies**, and so on.\n\n    Refer to the *Repos for Git Integration*\
    \ section to understand how to configure Databricks repos and best practices to\
    \ implement the Git integration.\n\n    Once the Git integration is successful,\
    \ the next step is to create build pipelines:\n\n    ![](images/Figure-8.21.jpg)\n\
    \n    **Figure 8.21:** CI/CD with Databricks\n\n2.  **Build pipeline**\n\n   \
    \ We need to configure build pipelines to trigger the scanning for the artifacts\
    \ to be deployed in the higher environments. We can use Azure DevOps, Jenkins,\
    \ and other such tools to define the build pipelines:\n\n    *   **Build pipeline\
    \ in Azure DevOps**\n\n        Azure DevOps is a cloud-based interface for defining\
    \ the stages for the CI/CD environments. We can create classic build pipelines\
    \ or YAML pipelines. Build pipeline runs the automated tests and creates the build\
    \ pipeline artifacts.\n\n        First, go to Azure DevOps, select `Pipelines`,\
    \ and click on the `Pipelines` option:\n\n        ![](images/Figure-8.22.jpg)\n\
    \n        **Figure 8.22:** Databricks - Azure DevOps build pipeline\n\n      \
    \  Click on the `New Pipeline` button to open the pipeline editor and build the\
    \ `azure-pipelines.yml` file.\n\n        Then, configure the build agent and set\
    \ up the build pipeline, including downloading the artifacts locally, performing\
    \ the automation test results, and creating a package to deploy the Databricks\
    \ notebook changes to higher environments.\n\n    *   **Configure build agent**\
    \ \n\n        *   `# Azure Databricks build pipeline - azure-pipelines.yml:`\n\
    \n            ` trigger:`\n\n            ` - release`\n\n            ` pool:`\n\
    \n            ` name: Hosted Ubuntu 1604`\n\n    *   **Set up the pipeline to\
    \ install Python and related packages**:\n\n        `# Install Python`\n\n   \
    \     `steps:`\n\n        `- task: UsePythonVersion@0`\n\n        `displayName:\
    \ ‘Use Python 3.7’`\n\n        `inputs:`\n\n        `versionSpec: 3.7`\n\n   \
    \     `# Install required modules including packages required to execute a unit\
    \ tests`\n\n        `- script: |`\n\n        `pip install pytest requests setuptools\
    \ wheel`\n\n        `pip install -U databricks-connect==6.4.*`\n\n        `displayName:\
    \ ‘Install Python Dependencies’`\n\n        `# Use environment variables for Databricks\
    \ Connect`\n\n        `- script: |`\n\n        `echo “y`\n\n        `$(WORKSPACE-REGION-URL)`\n\
    \n        `$(CSE-DEVELOP-PAT)`\n\n        `$(EXISTING-CLUSTER-ID)`\n\n       \
    \ `$(WORKSPACE-ORG-ID)`\n\n        `15001” | databricks-connect configure`\n\n\
    \        `displayName: ‘Configure Databricks Connect’`\n\n    *   **Generate and\
    \ store deployment artifacts**:\n\n        `- task: ArchiveFiles@2`\n\n      \
    \  `inputs:`\n\n        `rootFolderOrFile: ‘$(Build.BinariesDirectory)’`\n\n \
    \       `includeRootFolder: false`\n\n        `archiveType: ‘zip’`\n\n       \
    \ `archiveFile: ‘$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip’`\n\n\
    \        `replaceExistingArchive: true`\n\n        `- task: PublishBuildArtifacts@1`\n\
    \n        `inputs:`\n\n        `ArtifactName: ‘PublishArtifacts’`\n\n    *   **Build\
    \ pipeline using Jenkins**\n\n        Jenkins has different project types to create\
    \ CI/CD pipelines. First of all, go to the Jenkins UI to define multiple stages\
    \ in the pipeline:\n\n        ![](images/Figure-8.23.jpg)\n\n        **Figure\
    \ 8.23:** Databricks - Build pipeline in Jenkins\n\n        The next step is to\
    \ write a pipeline definition in the text file that is checked into the project’s\
    \ source control repository. In the setup stage, configure the Databricks CLI\
    \ connection with the connection information. Finally, create a stage to generate\
    \ and store the deployment artifacts to trigger the release pipelines.\n\n   \
    \ *   **Create release pipelines for deployment**"
