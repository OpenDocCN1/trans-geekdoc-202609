    \ records from the table and use delta-live table expectations to create a new\
    \ table that contains cleansed data\n\n*   Use records from cleaned data table\
    \ to make Delta Live Table queries\n\nOnly prerequisite to start creating Delta\
    \ Live Tables using the Databricks notebook is to have a cluster creation permission\
    \ to start the pipeline. Delta Live Tables runtime creates a cluster before it\
    \ runs the pipeline and fails if the permission doesn’t exist.\n\n# Creating Delta\
    \ Live Table using Databricks notebook\n\n1.  First, import the required Python\
    \ packages to create Delta Live Tables in the Databricks notebooks:\n\n    `import\
    \ dlt`\n\n    `from pyspark.sql.functions import *`\n\n    `from pyspark.sql.types\
    \ import *`\n\n2.  The next step is to ingest the raw data using the delta table:\n\
    \n    `json_path = “/datasets/wikipedia/clickstream.json”`\n\n    `@dlt.create_table(`\n\
    \n    `comment=”The raw wikipedia dataset for click stream”`\n\n    `)`\n\n  \
    \  ![](images/Figure-5.18.jpg)\n\n    **Figure 5.18:** Databricks Delta Live Tables\n\
    \n3.  Once the delta table is created, prepare the data with expectations:\n\n\
    \    `@dlt.table(`\n\n    `comment=”Wikipedia clickstream data prepared for analysis.”`\n\
    \n    `)`\n\n    `@dlt.expect_or_fail(“valid_count”, “click_count > 1”)`\n\n \
