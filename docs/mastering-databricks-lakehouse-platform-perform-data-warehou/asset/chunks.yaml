  trans: "\n数据处理一直是一项挑战，分为多个步骤进行，例如识别数据源和数据本身、连接源、验证并识别数据问题、清洗和重构，最后使其能够被消费者使用，例如流式分析引擎、流式解决方案、数据库、存储或如\
    \ Power BI 或 Qlik view 等报告工具。\n\n在过去的三个章节中，我们探索了 Databricks 的基础和基本知识、Databricks\
    \ 架构、使用 Databricks Lakehouse 平台进行数据科学和工程，以及 Databricks SQL。我们还查看了 Spark 到 Databricks\
    \ 的演进，以及如何使用笔记本在 Databricks 中构建 ETL 流来安全地处理经过验证的数据。\n\n在本章中，你将理解编写在多个笔记本中的工作流编排，这些工作流可以通过定义的步骤以并行或顺序的方式进行自动化。\n\
    \n`Automation`（自动化）和 `orchestration`（编排）是互为补充的。`Automation`是指机器能够在没有人工干预的情况下完成工作流中嵌入的一个任务或一组任务。`orchestration`是对多个任务进行配置，将这些任务执行为一组端到端的流程。目前有多种工具可以帮助数据团队通过一个可以实现工作负载自动化的框架，充分释放编排的优势。\n\
    \n# 在 Databricks 中编排数据和机器学习流水线\n\nDatabricks 可以轻松编排多个任务，以便轻松构建数据和机器学习工作流。数据团队可以轻松地创建和管理用于转换和精炼数据的多步流水线，或者他们可以使用由笔记本、Python\
    \ 脚本和其他支持语言组成的相互依赖且模块化的任务来训练机器学习算法，从而节省大量的时间、精力和上下文切换成本：\n\n![](img/Figure-4.1.jpg)\n\
    \n**图 4.1:** Databricks 编排：典型的编排工作流\n\n在上一个示例中，你可以看到为典型电子商务网站生成个性化报价的多个任务被编排并组合成一个工作流链。\n\
    \n要编排 Databricks 工作流和流水线，你可以使用多种云端工具，例如：\n\n*   AWS 上的 `Airflow` (`Amazon managed\
    \ apache airflow`)\n*   Azure 上的 `Data factory`\n*   `Delta Live tables`\n*  \
    \ Databricks 提供的任务管理接口和 API\n\n在本章中，我们将涵盖编排的所有四个主要方案，从 Amazon Managed Workflow\
    \ 开始，然后转向 Azure 上的 Data factory、Databricks 任务接口以及 Delta Live tables。\n\n# 使用 Amazon\
    \ Managed Airflow 运行 Databricks 任务\n\nAmazon 中的 `Apache Airflow` 可以通过 Amazon `Managed\
    \ Workflows for Apache Airflow` (`MWAA`) 使用。\n\n这是一个 Apache Airflow 的托管编排服务。它利用\
    \ AWS 的安全性、可用性和扩展性来管理开源的 Apache Airflow 平台。`MWAA` 为用户提供了额外好处，即通过预现有插件轻松与 AWS 服务以及各种第三方服务集成，允许客户创建复杂的数据处理流水线。Databricks\
    \ 笔记本脚本可以通过 `airflow` 轻松配置和编排以实现编排：\n\n![](img/Figure-4.2.jpg)\n\n**图 4.2:** Databricks\
    \ 编排：使用 Airflow 和 Databricks API\n\n在之前的图中，你会注意到 API 的可用性允许 Amazon Managed Apache\
    \ Airflow 能够轻松地在 Databricks 集群上执行不同的任务并获取监控数据。\n\n步骤如下：\n\n1.  在 Airflow 内部创建令牌：\n\
    \    ![](img/Figure-4.3.jpg)\n    **图 4.3:** Databricks 编排：设置\n2.  将 DAG 链接到 Databricks：\n\
    \    ![](img/Figure-4.4.jpg)\n    **图 4.4:** Databricks 编排：设置\n3.  在 MWAA 中触发\
    \ DAG。\n4.  一旦触发，你的任务应该出现在 Databricks 中：\n    ![](img/Figure-4.6.jpg)\n    **图\
    \ 4.6:** Databricks 编排：Databricks 任务日志\n\nDatabricks 任务是独立的，并且是 Databricks 不或缺的一部分。编排工具（如\
    \ Airflow 和 Data Factory）在上方创建了一个层级，为你提供了编排通过不同工具创建的多个任务的机会。\n"
- fmt: "\nFigure 4.10: Databricks orchestration: Copy path\n\n**If you are importing\
    \ the notebook from an example source, you may have to make sure that the imported\
    \ notebook has all the Data Lake blob and database connectivity setup as per your\
    \ environment.**\n\n# Create an Azure Databricks linked service\n\nLinked service\
    \ contains the connection information for Databricks, enabling Azure Data Factory\
    \ to communicate with Azure Databricks:\n\n![](images/Figure-4.11.jpg)\n\nFigure\
    \ 4.11: Databricks orchestration: Data Factory home\n\nNavigate to the `linked\
    \ service` section and choose `Azure Databricks`:\n\n![](images/Figure-4.12.jpg)\n\
    \nFigure 4.12: Databricks orchestration: Azure Databricks\n\n![](images/Figure-4.13.jpg)\n\
    \nFigure 4.13: Databricks orchestration: Setting up linked service\n\nNote that\
    \ the access token will be the token you generated in Databricks.\n\nWorkers can\
    \ be more than two based on the execution speed you want, the budget you have,\
    \ and the type of load you need to run in the background.\n\nOnce the linked service\
    \ is created, one can call the notebook in the pipeline to execute the Databricks\
    \ task along with other data factory tasks.\n\nThe number of tasks and different\
    \ linked services depends on how you are accessing the source and what type of\
    \ services you are using for the same. For example, using the blob storage, `synapse`\
    \ or `s3 bucket` will need a separate linked service to connect as a source or\
    \ sink.\n\n## Creating your ADF pipeline\n\n1. You can start by validating your\
    \ settings:\n\n    ![](images/Figure-4.14.jpg)\n\n    Figure 4.14: Databricks\
    \ orchestration: ADF pipeline setup availability flag\n\n    Setting up an availability\
    \ flag at the starting of the flow will make sure all the input datasets are ready.\n\
    \n    For a better pre-validated workflow, it’s important that we set up a validation\
    \ task at the beginning of the Data Factory pipeline. This will make sure all\
    \ connections and resources are available before the next task in the data factory\
    \ pipeline starts.\n\n2. To find the template, choose one of the templates related\
    \ to Databricks from the `template` section on your Data Factory home page:\n\n\
    \    ![](images/Figure-4.15.jpg)\n\n    Figure 4.15: Databricks orchestration:\
    \ Setting up linked service\n\n3. Now, choose any one of the Databricks templates;\
    \ for example, here, we have chosen the one highlighted:\n\n    ![](images/Figure-4.16.jpg)\n\
    \n    Figure 4.16: Databricks orchestration: Template gallery\n\n4. Once you set\
    \ up the template, you will get the `Linked service` option, as follows:\n\n \
    \   ![](images/Figure-4.17.jpg)\n\n    Figure 4.17: Databricks orchestration:\
    \ Linked service\n\n5. Once you set up the linked service as mentioned previously,\
    \ you can move to the validation steps to check the availability of source datasets:\n\
    \n    ![](images/Figure-4.18.jpg)\n\n    Figure 4.18: Databricks orchestration:\
    \ Pipeline\n\n6. After the availability check is done, you can move to the next\
    \ step of moving files to the blob:\n\n    ![](images/Figure-4.19.jpg)\n\n   \
    \ Figure 4.19: Databricks orchestration: Pipeline source activity\n\n7. Further,\
    \ provide the sink settings, such as `Sink dataset`, as a destination, along with\
    \ `Copy behavior`, `Max concurrent connections`, `Block size (MB)`, and so on\
    \ to make the output ready to be processed by the database’s transformation task\
    \ in the next steps:\n\n    ![](images/Figure-4.20.jpg)\n\n    Figure 4.20: Databricks\
    \ orchestration: Pipeline sink activity\n\n8. Once your source files are ready\
    \ to be consumed by Databricks, the next step is to call the Databricks notepad\
    \ operation to process the files for transformation. To make sure it runs perfectly,\
    \ the first step is to connect to the Databricks linked service:\n\n    ![](images/Figure-4.21.jpg)\n\
    \n    Figure 4.21: Databricks orchestration: Databricks task\n\n9. The next step\
    \ is to set up the notebook path that was copied initially:\n\n    ![](images/Figure-4.22.jpg)\n\
    \n    Figure 4.22: Databricks orchestration: Setting up path\n\n    ![](images/Figure-4.23.jpg)\n\
    \n    Figure 4.23: Databricks orchestration: Base parameters\n\n    Make sure\
    \ you set up the input path `@pipeline().parameters.inputpath`, output path, filename,\
    \ and `runid` correctly:\n\n    * Notebook path is the path that you copied from\
    \ the step in [Figure 4.9].\n    * Input value should be `@pipeline().parameters.inputpath`.\n\
    \    * Output value should be `@pipeline().parameters.outputpath`.\n    * Filename\
    \ value should be `@pipeline().parameters.fileName`.\n    * `PipelineRunId` value\
    \ should be `@pipeline().Runid`.\n\n# Via notebook or Python activity\n\nYou can\
    \ also run a Data Factory activity through a slightly different route, which is\
    \ running via notebook or Python activity. This is almost the same as the preceding\
    \ transformation task, but with an easy and specific way to execute different\
    \ types of Databricks code written in notebook, low-level JAR, or Python files.\n\
    \nTo do that, you can follow the given steps:\n\n1. Create a Data Factory.\n2.\
    \ Create a Data factory linked service, as described in the earlier option in\
    \ this chapter.\n3. Create a pipeline that uses Databricks notebook activity:\n\
    \n    ![](images/Figure-4.24.jpg)\n\n    Figure 4.24: Databricks orchestration:\
    \ Independent Databricks activity execution\n\n4. Once you choose to select Databricks\
    \ notebook activity, you need to configure the same with proper linked service\
    \ and your Databricks code or notebook path copied from the steps in [Figure 4.9].\n\
    5. Once you are all set, you need to validate and publish the ADF activity to\
    \ be further able to execute or debug it:\n\n    ![](images/Figure-4.25.jpg)\n\
    \n    Figure 4.25: Databricks orchestration: Details task\n\n6. The next step\
    \ is to trigger a pipeline run by the following steps:\n\n    ![](images/Figure-4.26.jpg)\n\
    \n    Figure 4.26: Databricks orchestration: Setup path\n\n7. Once the pipeline\
    \ is triggered, the next step is to monitor the pipeline run:\n\n    ![](images/Figure-4.27.jpg)\n\
    \n    Figure 4.27: Databricks orchestration: Pipeline run\n\n8. All the runs can\
    \ be monitored in detailed from the job and cluster section in Databricks:\n\n\
    \    ![](images/Figure-4.28.jpg)\n\n    Figure 4.28: Databricks Orchestration:\
    \ Cluster running status\n\n    ![](images/Figure-4.29.jpg)\n\n    Figure 4.29:\
    \ Databricks orchestration: Databricks jobs\n\n# Jobs in Databricks\n\nAs job\
    \ orchestration is fully integrated into Databricks, it does not require any other\
    \ cloud-based tools, such as Data Factories or logic apps, to sequence and orchestrate\
    \ multiple tasks.\n\nOne can even use the `jobs API` or `UI` to create and manage\
    \ jobs and features, such as setting up multiple tasks either written inside Databricks,\
    \ or outside Databricks, and sending email alerts for monitoring. With its powerful\
    \ API-based approach, Databricks jobs can orchestrate anything that has an API\
    \ (for example, pull data from Google Analytics or a third-party application or\
    \ even Delta Live Tables).\n\nIf you are a beginner and don’t have any specific\
    \ constraints to orchestrate your pipeline outside Databricks interface, you can\
    \ easily use the job interface inside Databricks for all your orchestration needs.\n\
    \nJobs in Databricks get executed inside a Databricks cluster, which has elasticity\
    \ and scalability on its own and runs completely under your security periphery\
    \ of virtual networks. The jobs can consist of a single task or can be a large,\
    \ multi-task application with complex dependencies. Once your jobs are configured\
    \ properly, Databricks can manage the task orchestration, cluster management,\
    \ monitoring, and error reporting for all the jobs. These jobs can run immediately,\
    \ periodically or can be scheduled.\n"
