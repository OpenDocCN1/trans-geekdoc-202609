    \ data. It doesn’t provide *ACID* transactional capabilities.\n\n*   Data hygiene\
    \ in the data lake is challenging since Data Lakes, by design, support availability\
    \ and partition tolerance:\n\n    ![](images/Figure-10.20.jpg)\n\n    **Figure\
    \ 10.20:** CCPA compliance\n\nDatabricks Delta Lake addresses the above-mentioned\
    \ challenges as follows:\n\n*   Data anonymization so that personal information\
