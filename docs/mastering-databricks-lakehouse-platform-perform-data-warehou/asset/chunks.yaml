  trans: '

    Dataset 是一个强类型、不可变的数据集合。与 `DataFrame` 类似，`Dataset` 中的数据被映射到定义的架构（schema）上。它更侧于`类型安全`并且是`面向对象`的。


    `Dataset` 拥有辅助方法，通常被称为 `encoders`（编码器）。这些是编码工具，用于将每个对象内部的数据转换为压缩的二进制格式，从而减少内存占用，并减少网络传输过程中的字节数。


    如前所述，`Datasets` 和 `DataFrame` 都能以高度优化的方式编译生成 `RDD`。


    # 有向无环图 (DAG)


    `DAG` 是一个没有有向环的有限有向图。它包含有限的顶点和边，每条边都从一个顶点指向另一个顶点。


    `DAG` 按顺序包含一组有限的顶点和边。`DAG` 中的每条边都按照顺序从上到下定向。


    这就是为什么它非常适合生成实现基于阶段调度的多阶段调度层。由于层数和深度可以超过两层但是`有限的`，因此它比旧的仅运行两个阶段（`Map` 和 `Reduce`）的
    `Map and Reduce` 程序更好且经过优化。


    # DAG 在 Spark 中如何工作？


    `interpreter`（解释器）是第一层，使用 `Scala interpreter`，Spark 对代码进行一些修改后进行解释。当你在 Spark 控制台中输入代码时，Spark
    会创建一个算子图。当我们高层地对 Spark `RDD` 调用 `Action` 时，Spark 会将算子图提交给 `DAG scheduler`（DAG
    调度器）。


    在 `DAG scheduler` 中将算子划分为任务阶段。一个阶段包含基于输入数据分区的任务。`DAG scheduler` 将算子流水线化。例如，`map`
    算子在单个阶段中调度。阶段传递给 `task scheduler`（任务调度器）。它通过集群管理器启动任务。`task scheduler` 并不知道阶段之间的依赖关系。


    `workers`（工作节点）在从机上执行任务。下面的图简要描述了 DAG 在 Spark 作业执行中的工作步骤：


    ![](img/Figure-3.4.jpg)


    **图 3.4**: Databricks 审计：RDD 过滤


    *   **Driver 程序**：Apache Spark 引擎调用应用程序的主程序并创建 `Spark Context`。`Spark Context`
    包含所有基本功能。`RDD` 在 `Spark Context` 中创建。


    *   **Spark Driver**：它包含各种其他组件，如 `DAG scheduler`、`task scheduler`、`backend scheduler`
    和 `block manager`，它们负责将用户编写的代码翻译成在集群上实际执行的任务。


    *   **Cluster manager（集群管理器）**：`Cluster manager` 执行资源分配工作。


    # 执行机制


    Spark `Driver` 和 `Spark Context` 共同监控集群内的作业执行。Spark driver 与 `cluster manager`
    协作管理其他各种作业。`cluster manager` 执行资源分配工作，然后作业被分成多个较小的任务，进一步分发到工作节点。每当在 `Spark Context`
    中创建 `RDD` 时，它都可以分布到许多工作节点上，也可以缓存在那里。工作节点执行由 `cluster manager` 分配的任务并返回给 `Spark
    Context`。


    `executor`（执行器）负责这些任务的执行。执行器的生命周期与 Spark 应用程序相同。如果我们想提高系统性能，可以增加工作节点的数量，以便作业可以被分成更多的逻辑部分。


    # Spark 执行流


    ![](img/Figure-3.5.jpg)


    **图 3.5**: Databricks 审计：Spark 执行流


    Databricks 是充分利用 Spark 潜力的无缝方式。由于它是基于 Spark 构建的，它支持 Spark 支持的所有语言，即 `Python`、`R`、`Scala`、`Java`
    和 `SQL`。


    # 使用 Databricks Pipeline 处理数据


    ## 使用 Azure Databricks 、转换和加载数据


    首先，我们将使用一个简单的用例：从 SQL Server 加载半结构化的考试数据到 `Azure Data Lake Gen2`，作为结构化输出以便以各种格式轻松地消费和查询，这让你对如何使用多种方法在
    Databricks 中处理数据有多样化的理解。


    我们将使用一个独立的 SQL Server 表实例，其中持有 JSON 格式的数据。我们将从获取半结构化的 JSON 数据开始，进行过滤和转换，最后生成一个结构化的
    delta 表，以查询并进一步处理数据。


    为了实现这一点，我们将使用 notebooks（笔记本），这是与基于 Spark 的系统和 Databricks 进行编程最常用且最简单的方法。


    在编程语言方面，我们主要使用了 `Scala`，考虑到网上有很多示例，只需 Google 搜索即可找到。然而，我们尝试在 `Scala`、`SQL` 和 `Python`
    之间取得可行的平衡，以确保你理解超越语言边界的示例，并能够根据可用示例或组织限制地使用其中任何一种语言编写代码。


    ## 在 Databricks 中创建 notebook


    在 Databricks 中创建 notebook，可以参考以下截图并导航到 `Data Science & Engineering` 选项来使用 notebook
    功能。这应该也会出现在常见任务部分，如下所示所示。


    即使对于硬核程序员来说，notebook 也是最简单、最流行的编程方式。它提供了一个包含名为 `cells`（单元格）块的单页。单元格执行的结果和对象位于顶部，供方的单元格使用。


    在 Databricks 中，有很多语言可以操作。你可以使用 `%{language Name}` 让编译器知道笔记本单元格（块）使用的是哪种语言，该语言跨单元格的所有变量都将可用。


    如果你想更改语言并使用它，最好的方法是在持久化数据之后，以便用你选择的语言轻松访问。


    一旦创建了 notebook，使用中间的 `+` 图标创建一个新单元格，并根据你喜好的程序开始编写代码：


    ![](img/Figure-3.6.jpg)


    **图 3.6**: Databricks 审计：Databricks 首页


    在接下来的部分中，我们将尝试从 Databricks 简单笔记本脚本的角度理解数据流水线开发，这些脚本可以使用多种语言编写，即 `Scala`、`Python`、`SQL`
    和 `Java`。


    ## 连接 SQL Server 数据源


    **连接不同的 OLTP 数据源时也可以执行类似的操作。**


    为了获取考试数据，我们需要做的第一件事是连接到存储考试数据的 SQL Server 数据库：


    *   搜索数据源可用的连接器。


    *   查找实例是否存在连接器的类。

