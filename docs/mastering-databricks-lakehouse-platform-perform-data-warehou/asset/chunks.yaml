  trans: "\n\n**图 6.16:** Spark 流处理用例\n\n**示例如下**：\n\n```scala\nval obs_ds = ds.observe(“my_event”,\
    \ count(lit(1)).as(“rc”), count($”error”).as(“erc”))\nobs_ds.writeStream.format(“...”).start()\n\
    // 使用监听器监控指标\nspark.streams.addListener(new StreamingQueryListener() {\n  override\
    \ def onQueryProgress(event: QueryProgressEvent): Unit = {\n    event.progress.observedMetrics.get(“my_event”).foreach\
    \ { row =>\n      // 如果错误数量超过 5% 则触发\n      val num_rows = row.getAsLong\n   \
    \   val num_error_rows = row.getAsLong\n      val ratio = num_error_rows.toDouble\
    \ / num_rows\n      if (ratio > 0.05) {\n        // 触发告报\n      }\n    }\n  }\n\
    })\n```\n\n我们也可以通过 UI 监控指标。如果你正在使用 `Databricks Runtime 7.0` 或更高版本，请使用 Spark UI\
    \ 中的 `Streaming` 标签页。如果你使用的是 `Databricks Runtime 6.x`，可以使用 Spark 的可观测 API。\n\n\
    *   **重分区（Resharding）**：结构化流也支持重分区。在使用结构化流时，需要增加分片数量。我们不需要切换流或创建临时流来平衡流量。\n\n\
    # 数据更改馈 (Change Data Feed)\n\n关系型数据库中捕获的业务事务对于理解业务运营至关重要。组织需要一种在数据生成时对其分析的方法：\n\
    \n![](img/Figure-6.17.jpg)\n\n**图 6.17:** 数据更改馈\n\n**时间敏感数据**是云迁移期间的重点，因为数据在不断变化且会导致应用程序关闭。在正常情况下，IT\
    \ 组织使用批处理模式每天移动一次或多次数据。`batch pattern`（批处理模式）的缺点是它会引入延迟，并降低组织通过数据可用性可以带来的运营价值。\n\
    \n**数据更改捕获**（`CDC`）被认为是从 `Oracle`、`Azure SQL DB` 和 `SQL Server` 等关系型数据库到传统数据仓库、数据湖（Data\
    \ Lakes）或其他数据库构建近实时数据移动方案的理想解决方案。**数据更改捕获**是一种可以轻松识别和跟踪数据库中数据变化的软件过程。它通过在事件发生时持续移动和处理数据，提供数据的`近乎实时移动`：\n\
    \n![](img/Figure-6.18.jpg)\n\n**图 6.18:** 带有示例的数据更改捕获\n\n通常，我们在数据摄取到分析架构的过程中看到数据捕捉的变化，这也被称为\
    \ `medallion architecture`（奖章架构）。该架构从源系统获取原始数据，并通过铜（bronze）、银（silver）和金（gold）表对其进行精炼。CDC\
    \ 和奖章架构为终端用户提供了多处好处，因为只需要处理更改或添加/删除的数据。此外，Databricks 在 Delta Lake 中还有一项令人兴奋的新功能——**数据更改馈**（`CDF`），它使得这种架构的实现更加简单，并使\
    \ Delta Lake 的 `MERGE` 操作和日志版本控制成为可能：\n\n![](img/Figure-6.19.jpg)\n\n**图 6.19:**\
    \ Databricks 数据更改馈功能\n\n参考如下：\n\n**[`databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html`](https://databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html)**\n\
    \n许多企业组织使用 Databricks 实现端到端的数据更改捕获，因为与其它实现和技术相比，使用 Delta Lake 实现起来非常简单。有时，使用正确的工具实现\
    \ CDC 也是困难的。但通过 Databricks CDF 功能，实现可以变得更简单，并能轻松解决与 CDC 相关的几个挑战：\n\n*   **数据质量问题**：在不同版本之间处理行级变化非常困难：\n\
    \n    ![](img/Figure-6.20.jpg)\n\n    **图 6.20:** 常见的数据质量问题\n\n*   **效率低下**：处理未变化的行是无效的，因为当前版本是在文件级别发生变化的，而不是在行级别发生变化。\n\
    \n上述挑战将通过 Databricks 的数据更改馈功能来解决：\n\n*   **简单性**：它提供了一种易于使用的模式来识别更改，使得代码简单且易用。\n\
    \n*   **高效性**：它使得下游对 merge、delete 和 update 操作的处理变得高效。\n\n数据更改馈在启用后，仅从 Delta 表（Delta\
    \ Table）捕获更改，且仅向前瞻性。\n\n通过数据更改馈功能，数据被摄取到 `bronze` 表，随后在 `silver` 表中进行预处理，最后根据\
    \ `silver` 表中更改的数据在 `gold` 表中生成聚合值。\n\n现在，让我们了解如何在 Databricks 中启用 CDF 功能：\n\n\
    1.  `要启用 CDF 功能，我们必须先在` `指定的表上启用该功能。以下是创建创建表时为 bronze 表启用 CDF 的示例`：\n\n    ```sql\n\
    \    Create Table bronze (...) USING DELTA TBLPROPERTIES (delta.enableDataFeed=true)\n\
    \    ```\n\n2.  一旦启用了数据更改馈功能，为了查询数据，我们可以使用 `table_changes`：\n\n    ![](img/Figure-6.21.jpg)\n\
    \n    **图 21:** 数据更改馈：已合并数据\n\n先前的示例包含了插入的行，以及分别代表更新行的两个版本图像，以便我们在需要时评估差异。\n\n\
    让我们理解数据更改馈的用例：\n\n*   **银表和金表**：通过仅处理 `MERGE`、`UPDATE` 或 `DELETE` 操作后的行级更改来提高性能，用于创建\
    \ ETL 流水线：\n\n    ![](img/Figure-622.jpg)\n\n    **图 22:** 铜、银和金表\n\n*   **物化视图**：我们可以创建聚合视图以用于商业智能和高级分析，而无需重新处理底层表：\n\
    \n    ![](img/Figure-623.jpg)\n\n    **图 23:** 物化视图\n\n*   **为下游应用提供数据**：另一个用例是将更改馈发送到\
    \ `Kafka` 或 `RDBMS` 等下游应用，我们可以在管道的后期进行增量处理：\n\n    ![](img/Figure-624.jpg)\n\n\
    \    **图 24:** 用于下游应用的 CDF\n\n*   **审计追踪**：我们可以捕获数据更改以查看随时间的变化，包括何时发生删除、进行了哪些更新以及添加了哪些记录。\n\
    \n为了启用更改馈，我们需要对现有表和新表进行以下配置：\n\n*   **现有表**：首先，我们需要使用 `ALTER TABLE` 命令设置表属性 `delta.enableDataFeed\
    \ = true`：\n\n    ```sql\n    ALTER TABLE myTable SET TBLPROPERTIES (delta.enableDataFeed=true)\n\
    \    ```\n\n*   **新表**：我们需要在 `CREATE TABLE` 命令中使用 `delta.enableDataFeed = true`\
    \ 启用表属性。\n\n    **示例**：\n\n    ```sql\n    CREATE TABLE std (year INT, name STRING,\
    \ age INT) TBLPROPERTIES (delta.enableDataFeed=true)\n    ```\n\n*   **所有新表**：如果我们想为所有表设置更改馈，我们需要配置以下属性：\n\
    \n    ```sql\n    set spark.databricks.delta.properties.defaults.enableDataFeed\
    \ = true;\n    ```\n\n在我们启用数据更改馈之前需要考虑以下几点：\n\n*   一旦表的**数据更改馈**选项被*启用*，我们就可以读取该表；我们无法使用\
    \ **Databricks Runtime 8.1** 或更低版本写入该表。\n\n*   CDF 功能无法捕获表的过去的更改。只有在我们启用数据更改馈后，才会捕获数据更改。\n\
    \n"
- fmt: "\nAnother use of Change Data Feed is in a `MERGE` statement. Aggregate `MERGE`\
    \ statements can be very complex by nature, but changing the data feed feature\
    \ makes the coding more simple and efficient:\n\n![](images/Figure-6.25.jpg)\n\
    \n**Figure 6.25:** CDF MERGE statement\n\n**Reference**:\n\n**[https://databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html](https://databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html)**\n\
    \nAs we can see in the preceding diagram, CDF makes it simpler for us to understand\
    \ which rows have been changed as it only performs the aggregations on the data\
    \ that has been changed or using the `table_change` operation.\n\nUsing the following\
    \ query, we can understand how to use the changed data to determine dates and\
    \ stock symbols that have been changed.\n\n**Example**:\n\n```\nSelect DISTINCT\
    \ date,stock_symbol from tables_changes (‘silver’,2)\n```\n\n## Conclusion\n\n\
    In this chapter, we explored the Spark streaming offering of Databricks Lakehouse\
    \ platform in detail. We also learned in detail about Spark streaming use case\
    \ to implement it end to end. Additionally, we understood in detail the Change\
    \ Data Capture feature and how easily it can be implemented using the Change Feed\
    \ Feature. So, we can enable near real-time solutions using the Spark streaming\
    \ with the Databricks Lakehouse platform.\n\n## Multiple choice questions\n\n\
    1. What are the three main components of structured streaming?\n    1. Input source\n\
    \    2. Streaming engine\n    3. Sink\n    4. All of the above\n\n2. Does Change\
    \ Data Capture maintain the history of data?\n    1. Yes\n    2. No\n\n3. What\
    \ are output modes of streaming data?\n    1. `Append`\n    2. `Update`\n    3.\
    \ `Complete`\n    4. `All of the above`\n\n4. `Does Databricks runtime support\
    \ Amazon Kinesis as source?`\n    1. `Yes`\n    2. `No`\n\n5. `Does Databricks\
    \ have an out`-of`-the`-`box` feature to capture data history?`\n    1. `Yes`\n\
    \    2. `No`\n\n## Answers\n\n1. d\n2. a\n3. d\n4. a\n5. b\n\n## CHAPTER 7: Machine\
    \ Learning Model Management with Databricks\n\nEnterprise organizations nowadays\
    \ use `CI/CD pipelines` to deploy their workload to all the environments using\
    \ the best practices and various DevOps tools. `MLOps` is a process of leveraging\
    \ the best practices and technologies which provides scalable, centralized, and\
    \ governed solutions to deploy machine learning applications in different environments.\
    \ MLOps is an open-source platform for managing the end-to-end machine learning\
    \ lifecycle.\n\nIn the previous chapter, we explored the `SCD Type 2` implementation\
    \ using the Databricks Delta Lake. We also learned how to work with streaming\
    \ data using structured streaming. In this chapter, we will explore the MLOps\
    \ and `MLflow` with Databricks Lakehouse platform and learn in detail about the\
    \ model life cycle management with `MLflow`.\n\n## Structure\n\nIn this chapter,\
    \ we will learn end-to-end implementation of machine learning solutions using\
    \ the Databricks Lakehouse platform. Here are the topics we will cover:\n\n* Introduction\
    \ to MLOps and `MLflow`\n* Model life cycle management with `MLflow`\n    * Getting\
    \ started with `MLflow` environment\n    * Feature engineering with Databricks\n\
    \    * Setting up `MLflow` project with model repository\n    * Train and deploy\
    \ the model\n    * Log model metrics\n\n## Objectives\n\nAfter studying this chapter,\
    \ you should be able to understand the fundamentals of MLOps and `MLflow` functionality\
    \ with Databricks Lakehouse platform. We will also explore the model lifecycle\
    \ management with `MLflow` in detail.\n\n## Introduction to MLOps and MLflow\n\
    \nOrganizations nowadays use the process to deploy the code automatically from\
    \ the development environments to higher environments: **test**, **acceptance**,\
    \ and **production** environments. Organizations have DevOps teams who develop\
    \ continuous integration and continuous delivery pipelines using tools like `Azure\
    \ DevOps/Jenkins`, and so on. Databricks Lakehouse platform has in-built integration\
    \ available with DevOps tools like `Azure DevOps` or `Jenkins`, which makes the\
    \ overall integration and deployment easier and faster.\n\nFor machine learning\
    \ projects, most of the enterprise organizations don’t have such a process in\
    \ place to enable faster application deployment. Possible reasons for inefficient\
    \ process are as follows:\n\n* Data Science teams don’t follow the machine learning\
    \ development life cycle, like the software development life cycle followed by\
    \ the developers.\n* Since machine learning development and related initiatives\
    \ are new to organizations, processed around machine learning are not fully integrated.\n\
    * Data Science teams don’t manage the artifacts efficiently as a separate entity.\n\
    * Data Scientists use many tools that might not be as per the organization’s standards.\n\
    \nIn order to manage the Data Science workloads efficiently and address the previously\
    \ mentioned problems for the Data Science workloads, we can use `MLflow`, an open-source\
    \ platform to manage machine learning cycle. While working with machine learning\
    \ and Data Science projects for solving complex, real-world projects and getting\
    \ business insights out of data, Data Scientists and Data Engineers have to tackle\
    \ the following challenges:\n\n* Handle large volumes of data\n* Management of\
    \ compute resources\n* Accelerators to speed up machine learning\n* Rapid advances\
    \ in the machine learning fields\n\nMLOps is an engineering process to create\
    \ sustainable and unified machine learning development and operations.\n\nThe\
    \ following diagram shows the steps involved in the machine learning process:\n\
    \n![](images/Figure-7.1.jpg)\n\n**Figure 7.1:** Elements of machine learning\n\
    \nIn order to decrease the time to market for the machine learning workloads,\
    \ it is advised to enable continuous integration of the source control, unit testing,\
    \ integration testing, and the continuous delivery of the package, but there are\
    \ significant differences, as follows:\n\n* CI pipeline focuses more on testing\
    \ and validating the data, data schemes, and machine learning models.\n* Continuous\
    \ deployment pipeline for machine learning workload should automatically deploy\
    \ the artifacts to other services.\n* Continuous testing is concerned with automatically\
    \ retraining and serving the machine learning model.\n\nTypical traditional Data\
    \ Science machine learning projects consist of the following steps:\n\n* **Data\
    \ extraction**: Extract relevant data from the different data sources and integrate\
    \ them to create data usable for the machine learning projects.\n* **Data analysis**:\
    \ Perform data analytics on the top of data stored to use in the machine learning\
    \ model:\n    * Understand the data.\n    * Identify the data preparation and\
    \ feature engineering for the data model.\n    * **Data preparation**: Data preparation\
    \ steps involve data cleansing, split data for the training and validation, and\
    \ apply data transformation.\n    * **Model training**: Data Scientists create\
    \ machine learning algorithms to work on the prepared data. Output of the phase\
    \ is the trained machine learning model.\n    * **Model evaluation**: Machine\
    \ learning model is evaluated based on the dataset to evaluate the quality of\
    \ the data.\n    * **Model validation**: Model validation step is used to validate\
    \ the machine learning model.\n    * **Model serving**: Once the machine learning\
    \ model is valid and ready for serving, the validated model should be deployed\
    \ to the target environment to serve the predictions. There are multiple ways\
    \ to serve the machine learning models.\n\n        ▪ Micro service implementation\
    \ with REST API\n        ▪ Embedded model to mobile device\n        ▪ Batch system\n"
