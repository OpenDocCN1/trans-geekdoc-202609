    \ up the MLflow project with the model repository, and training and deploying\
    \ the machine learning model.\n\n# [Multiple choice questions](#toc.xhtml#s117a)\n\
    \n1.  What are the main components of MLflow? \n\n    1.  Tracking\n\n    2. \
