  trans: "\n\n现在，从 Databricks UI 进入 `user settings`（用户设置）并选择 `Git Integration`（Git\
    \ 集成）标签页，如下：\n\n![](img/Figure-8.19.jpg)\n\n**图 8.19:** Databricks 用户设置 - Git\
    \ 集成\n\n现在，选择笔记本，点击 `Revision history`（修订历史），输入 Git 仓库链接，包括分支和输入路径。\n\n## 2. 使用\
    \ Databricks CLI\n\n手动将单个笔记本推送到远程仓库是一项繁琐的任务。我们还可以使用 `Databricks CLI` 将代码下载到本地机器，并使用\
    \ `Git` 命令行将其上传到仓库。\n\n一旦代码导出到本地机器，请使用 `git` 命令将代码提交到远程 Azure DevOps 仓库：\n\n```bash\n\
    git init\ngit add *\ngit commit -m “commit code”\ngit remote add origin https://<xxxx/yyyy>//_git/SyncDatabricks\n\
    git push -u origin master\n```\n\n在了解了使用 Databricks 仓库的功能和最佳实践后，让我们也探索一下该功能的局限性：\n\
    \n* **缺少 Git 对话框的合并功能**：当开发分支落后于远程仓库的主分支时，无法从 Databricks 更新分支，以避免在拉请求（pull request）期间发生合并冲突。\n\
    * **远程仓库删除分支的同步**：在仓库与 Databricks 平台集成后，即使分支从远程仓库中删除，也不会从 Databricks 仓库的分支列表中删除。\n\
    \n# 使用 DevOps 实现多环境 CI/CD 部署\n\nCI/CD 工作流是一种现代软件开发实践，侧重于通过`自动化测试`、`包筛选`、`静态代码分析`等频繁的增量代码更改来提高交付物的质量。\n\
    \n持续集成流水线自动化构建和测试步骤，以确保请求的代码更改在合并到主分支之前符合标准且可靠的。\n\n一旦持续集成流水线执行成功，它将触发发布流水线，将代码/合并后的更改从主分支部署到更高环境：\n\
    \n![](img/Figure-8.20.jpg)\n\n**图 8.20:** 持续集成与部署\n\n让我们首先了解在操作 Databricks 平台时实现持续集成和部署涉及的高级步骤：\n\
    \n* **持续集成**\n    1. **Databricks 笔记本与源代码的交互**：\n        1. 使用 Databricks 平台或\
    \ IDE 开发源码并进行测试\n        2. 执行单元测试、集成测试和回归测试\n        3. 将源代码和更改提交到 `Git` 分支\n\
    \    2. **持续集成构建流水线**：\n        1. 临时拉取新的代码更改\n        2. 运行自动化测试\n        3.\
    \ 将请求的更改合并到主分支\n        4. 从源码构建包/库\n    3. **创建产物以触发发布过程**：\n        创建产物并触发部署的发布流水线\n\
    * **持续部署**\n    1. **用于持续部署的 Databricks 笔记本**：\n        1. 将 Databricks 笔记本部署到相应的环境，以及配置文件和相关的包依赖项\n\
    \        2. 部署库以实现代码复用\n    2. **自动化测试**\n        在相应环境中运行自动化测试并重新发布测试结果\n   \
    \ 3. **Databricks 笔记本运行化**：\n        一旦笔记本部署完成，根据需求为你的数据和 AI 工作负载调度笔记本执行\n\n在了解了使用\
    \ Databricks 实现 CI/CD 流水线的高级步骤后，让我们来了解如何创建、构建和发布流水线：\n\n## 1. 与 Git 工具集成\n\n第一步是使用\
    \ `Databricks repos` 功能将你的 Databricks 笔记本与 `Git` 工具集成。我们可以将 Databricks 中完成的工作与各种\
    \ `Git` 提供者的远程仓库同步，以利用版本控制、分支策略等各种功能。\n\n请参考 *Repos for Git Integration* 章节，以了解如何配置\
    \ Databricks 仓库以及实现 `Git` 集成的最佳实践。\n\n一旦 `Git` 集成成功，下一步是创建构建流水线：\n\n![](img/Figure-8.21.jpg)\n\
    \n**图 8.21:** 结合 Git 的 CI/CD\n\n## 2. 构建流水线\n\n我们需要为要部署的产物配置构建流水线。我们可以使用 `Azure\
    \ DevOps`、`Jenkins` 和其他工具：\n\n### Azure DevOps 中的构建流水线\n\nAzure DevOps 是一个用于 CI/CD\
    \ 的云端界面。首先，进入 `Azure DevOps`，选择 `Pipelines` 并点击 `New Pipeline`（新建流水线）：\n\n![](img/Figure-8.22.jpg)\n\
    \n**图 8.22:** Databricks - Azure DevOps 构建流水线\n\n点击 `New Pipeline` 按钮打开流水线编辑器并构建\
    \ `azure-pipelines.yml` 文件。然后配置构建代理并设置流水线，包括下载产物、执行自动化测试以及创建一个用于部署的包。\n\n* **配置构建代理**\n\
    ```yaml\ntrigger:\n- release\npool:\n  name: Hosted Ubuntu 1604\n```\n\n* **设置流水线安装\
    \ Python 和相关包**：\n```yaml\n# 使用 Python\n- task: UsePythonVersion@0\n  displayName:\
    \ 'Use Python 3.7'\n  inputs:\n    versionSpec: '3.7'\n\n# 安装依赖\n- script: |\n\
    \    pip install pytest requests setuptools wheel\n    pip install -U databricks-connect==6..*\n\
    \  displayName: 'Install Python Dependencies'\n\n# 使用环境变量配置 Databricks Connect\n\
    - script: |\n    echo “y\n    $(WORKSPACE-REGION-URL)\n    $(CSE-DEVELOP-PAT)\n\
    \    $(EXISTING-CLUSTER-ID)\n    $(WORKSPACE-ORG-ID)\n    15001” | databricks-connect\
    \ configure\n  displayName: 'Configure Databricks Connect'\n```\n\n* **生成并存储部署产物**：\n\
    ```yaml\n- task: ArchiveFiles@2\n  inputs:\n    rootFolderOrFile: '$(Build.BinariesDirectory)'\n\
    \    includeRootFolder: false\n    archiveType: 'zip'\n    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'\n\
    \    replaceExistingArchive: true\n\n- task: PublishBuildArtifacts@1\n  inputs:\n\
    \    ArtifactName: 'PublishArtifacts'\n```\n\n### 使用 Jenkins 构建流水线\n\nJenkins\
    \ 有不同类型的项目来创建 CI/CD 流水线。首先，进入 Jenkins UI 为流水线定义多个阶段：\n\n![](img/Figure-8.23.jpg)\n\
    \n**图 8.23:** Databricks - Jenkins 中的构建流水线\n\n下一步是在项目源码仓库的文本文件中编写流水线定义。在设置阶段，使用连接信息配置\
    \ `Databricks CLI` 连接。最后，创建一个阶段来生成并存储部署产物，以触发发布流水线。\n\n"
- fmt: "\nOnce the build pipeline is completed and artifacts are ready for the deployment,\
    \ release pipeline will be triggered to deploy the Databricks artifacts to all\
    \ the environments with automated testing stages in between:\n\n![](images/Figure-8.24.jpg)\n\
    \n**Figure 8.24:** Databricks - Build pipeline in Jenkins\n\nBased on the choice\
    \ of deployment tool, we can create release pipelines in either Azure DevOps or\
    \ Jenkins. We will take an example of Azure DevOps tool to create a release pipeline\
    \ and understand how we can use it to deploy artifacts across all the environments.\n\
    \n*   Create a release pipeline in Azure DevOps with stages for each environment,\
    \ including the testing stages:\n\n    ![](images/Figure-8.25.jpg)\n\n    **Figure\
    \ 8.25:** Azure DevOps - Create release pipeline\n\n### Add deployment tasks to\
    \ pipeline stages\n\nOnce the release pipeline is created, we have to add tasks\
    \ to the pipeline that will perform the actual deployment of Databricks artifacts\
    \ to the respective environments.\n\n1.  Add `Use Python Version task` to make\
    \ sure that the Python version we are installing the Python version on the pipeline\
    \ agent with the Python version of the Databricks notebooks:\n\n    ![](images/Figure-8.26.jpg)\n\
    \n    **Figure 8.26:** Azure DevOps - Install Python version\n\n2.  Add the `Extract\
    \ files` task to extract the Databricks notebooks and related files from the ZIP\
    \ artifacts files. We have to provide an `archive file pattern` to `*zip` and\
    \ destination folder name:\n\n    ![](images/Figure-8.27.jpg)\n\n    **Figure\
    \ 8.27:** Azure DevOps Extract file task\n\n3.  Add the `Azure PowerShell` task\
    \ to get the bearer token from the key vault:\n\n    ![](images/Figure-8.28.jpg)\n\
    \n    **Figure 8.28:** Azure DevOps Extract file task\n\n    PowerShell script:\n\
    \n    ```\n    $BearerToken= (Get-AzKeyVaultSecret -VaultName “$(KeyVaultName)”\
    \ -Name “$(adb_token_secret_name)”).SecretValueText\n    write-host “##vso[task.setvariable\
    \ variable=BearerToken]$BearerToken”\n    ```\n\n    Here, we have to provide\
    \ the following details using pipeline variables or initialize these variables\
    \ during runtime:\n\n    `KeyVaultName` = Name of the Azure Key Vault\n\n    `adb_token_secret_name`\
    \ = Key vault secret name for Databricks token\n\n4.  Add the `Databricks Deploy\
    \ Notebooks` task to deploy the Databricks notebook. We have to provide `Azure\
    \ region name` and `Databricks` bearer token. Additionally, we have to provide\
    \ `source file path` that contains the path where Databricks notebook resides\
    \ in the artifact and the `target file path` that is the desired path within the\
    \ Azure Databricks workspace directory structure:\n\n    ![](images/Figure-8.29.jpg)\n\
    \n    **Figure 8.29:** Azure Databricks: Deploy Databricks notebooks\n\n### Deploy\
    \ configuration files and libraries to Databricks DBFS\n\nAdd task `Databricks\
    \ files to DBFS` to deploy the libraries and configuration files to Databricks\
    \ DBFS. Apart from the `Azure region and Databricks token`, we have to provide\
    \ a `local root folder` of the path which contains Python libraries and the `target\
    \ folder` that is the path in DBFS where we want to keep libraries and configuration\
    \ files:\n\n    ![](images/Figure-8.30.jpg)\n\n    **Figure 8.30:** Azure Databricks:\
    \ Deploy libraries/config files\n\n*   Finally, add the task `Python script`,\
    \ which is a custom Python code, to install Python `wheel/egg` files to the Databricks\
    \ cluster:\n\n    ![](images/Figure-8.31.jpg)\n\n    **Figure 8.31:** Azure Databricks:\
    \ Deploy libraries/config files\n\nSo, we have created an Azure DevOps release\
    \ pipeline to deploy all Databricks artifacts to all environments with the click\
    \ of a button. Entire Azure DevOps CD pipeline tasks per environment stage looks\
    \ as follows:\n\n    ![](images/Figure-8.32.jpg)\n\n    **Figure 8.32:** Azure\
    \ Databricks deployment\n\nOnce the Databricks artifacts are deployed to the development\
    \ environment, stages with `integration tests` will be triggered. Integration\
    \ steps with Azure Databricks notebook can be implemented using Databricks REST\
    \ API, as follows:\n\n1.  **Configure the staging environment**\n\n    Create\
    \ a command line task to create the directories for the notebook execution logs.\n\
    \n2.  **Run the Databricks notebook**\n\n    Add the task `Python script`, which\
    \ will run the integration test cases for the integration testing. We have to\
    \ provide a path for the Databricks notebooks and relevant parameters.\n\n3. \
    \ **Generate test results**\n\n    We have to again add a Python `script` task\
    \ in the release pipeline, which will generate the relevant test results.\n\n\
    If the test result execution is successful, the release pipeline will proceed\
    \ with the deployment and will continue to deploy to higher environments using\
    \ the same tasks we created for the development environment using the task groups.\n\
    \nOverall, Azure DevOps CD pipeline, including all the stages and integration\
    \ tests, can be visualized as follows:\n\n    ![](images/Figure-8.33.jpg)\n\n\
    \    **Figure 8.33:** Azure Databricks deployment pipeline\n\nIt is recommended\
    \ to use a secret scope to store to manage secrets while working with Azure Databricks.\
    \ We can create two types of secret scope with Azure Databricks:\n\n1.  **Azure\
    \ Key Vault backed secret scope**\n\n    We can use Azure Key Vault backed secret\
    \ scope to reference the secrets stored in the Key Vault by the key vault name.\
    \ We can create Azure Key Vault backed secret scope using this URL: `https://<databricks-instance>#secrets/createScope`:\n\
    \n    ![](images/Figure-8.34.jpg)\n\n    **Figure 8.34:** Azure Databricks deployment\n\
    \n    Here, we have to fill in the DNS name for the key vault and the resource\
    \ ID. You can find it by selecting the Key Vault resource from the portal:\n\n\
    \    ![](images/Figure-8.35.jpg)\n\n    **Figure 8.35:** Azure Databricks deployment\n\
    \n    Azure Key Vault backed secret scope can also be created using Databricks\
    \ CLI. You can use this Databricks command:\n\n    ```\n    databricks secrets\
    \ create-scope --scope <scope-name> --backend-type AZURE_KEYVAULT --resource-id\
    \ <azure-keyvault-resource-id> --dns-name <azure-keyvault-dns-name>\n    ```\n\
    \n2.  **Databricks backed secret scope**\n\n    Databricks backed secret scope\
    \ is stored in an encrypted format in the back end by a database in Azure Databricks.\
    \ Databricks secret scope name should be unique within the Databricks workspace\
    \ name.\n\n    Databricks backed secret scope can be used by the following Databricks\
    \ CLI command:\n\n    ```\n    databricks secrets create-scope --scope <scope-name>\n\
    \    ```\n\nSo, irrespective of any tools you use, the team can follow the classic\
    \ Git flow or GitHub flow cycle during the development with Databricks Lakehouse\
    \ platform:\n\n*   Developers can develop individual features using the feature\
    \ branch.\n*   Once the local develop is completed, we can commit the changes\
    \ to the master branch that will trigger the CI/CD pipeline.\n*   CI/CD pipeline\
    \ will trigger the Databricks repos APIs to update the project to the latest version.\n\
    *   CI pipeline downloads the artifacts and performs integration testing.\n* \
    \  Once the testing is successful, the release pipeline will deploy the notebooks\
    \ and artifacts to higher environments.\n\nDatabricks labs continuous integration\
    \ and deployment templates are the open-source tools that we can use during the\
    \ software development activity to use the existing CI tooling with Databricks\
    \ jobs. This open-source tool also has various pipeline templates considering\
    \ the best practices of working with Databricks Lakehouse platform.\n\nThese pipeline\
    \ templates enable developers to focus on writing the code for the application\
    \ development on public cloud platforms like AWS, Azure, and so on.\n\nThe following\
    \ are the steps to use Databricks labs CI/CD templates:\n"
  raw: "        Once the build pipeline is completed and artifacts are ready for the\
    \ deployment, release pipeline will be triggered to deploy the Databricks artifacts\
    \ to all the environments with automated testing stages in between:\n\n      \
    \  ![](images/Figure-8.24.jpg)\n\n        **Figure 8.24:** Databricks - Build\
    \ pipeline in Jenkins\n\n        Based on the choice of deployment tool, we can\
    \ create release pipelines in either Azure DevOps or Jenkins. We will take an\
    \ example of Azure DevOps tool to create a release pipeline and understand how\
    \ we can use it to deploy artifacts across all the environments.\n\n    *   Create\
    \ a release pipeline in Azure DevOps with stages for each environment, including\
    \ the testing stages:\n\n        ![](images/Figure-8.25.jpg)\n\n        **Figure\
    \ 8.25:** Azure DevOps - Create release pipeline\n\n    *   **Add deployment tasks\
    \ to pipeline stages**\n\n        Once the release pipeline is created, we have\
    \ to add tasks to the pipeline that will perform the actual deployment of Databricks\
    \ artifacts to the respective environments.\n\n        1.  Add `Use Python Version\
    \ task` to make sure that the Python version we are installing the Python version\
    \ on the pipeline agent with the Python version of the Databricks notebooks:\n\
    \n            ![](images/Figure-8.26.jpg)\n\n            **Figure 8.26:** Azure\
    \ DevOps - Install Python version\n\n        2.  Add the `Extract files` task\
    \ to extract the Databricks notebooks and related files from the ZIP artifacts\
    \ files. We have to provide a**rchive file pattern** to `*zip` and destination\
    \ folder name:\n\n            ![](images/Figure-8.27.jpg)\n\n            **Figure\
    \ 8.27:** Azure DevOps Extract file task\n\n        3.  Add the `Azure PowerShell`\
    \ t**ask** to get the bearer token from the key vault:\n\n            ![](images/Figure-8.28.jpg)\n\
    \n            **Figure 8.28:** Azure DevOps Extract file task\n\n            PowerShell\
    \ script:\n\n            `$BearerToken= (Get-AzKeyVaultSecret -VaultName “$(KeyVaultName)”\
    \ -Name “$(adb_token_secret_name)”).SecretValueText`\n\n            `write-host\
    \ “##vso[task.setvariable variable=BearerToken]$BearerToken”`\n\n            Here,\
    \ we have to provide the following details using pipeline variables or initialize\
    \ these variables during runtime:\n\n            `KeyVaultNam`e = Name of the\
    \ Azure Key Vault\n\n            `adb_token_secret_name` = Key vault secret name\
    \ for Databricks token\n\n        4.  Add the `Databricks Deploy Notebooks` task\
    \ to deploy the Databricks notebook. We have to provide **Azure region name**\
    \ and **Databricks** b**earer** t**oken**. Additionally, we have to provide **source\
    \ file path** that contains the path where Databricks notebook resides in the\
    \ artifact and the **target file path** that is the desired path within the Azure\
    \ Databricks workspace directory structure:\n\n            ![](images/Figure-8.29.jpg)\n\
    \n            **Figure 8.29:** Azure Databricks: Deploy Databricks notebooks\n\
    \n    *   **Deploy configuration files and libraries to Databricks DBFS**\n\n\
    \        Add task **Databricks** f**iles to DBFS** to deploy the libraries and\
    \ configuration files to Databricks DBFS. Apart from the **Azure region and Databricks**\
    \ t**oken, we have to provide** a local root folder of the path which contains\
    \ Python libraries and the target folder that is the path in DBFS where we want\
    \ to keep libraries and configuration files:\n\n        ![](images/Figure-8.30.jpg)\n\
    \n        **Figure 8.30:** Azure Databricks: Deploy libraries/config files\n\n\
    \    *   Finally, add the task **Python script**, which is a custom Python code,\
    \ to install Python `wheel/egg` files to the Databricks cluster:\n\n        ![](images/Figure-8.31.jpg)\n\
    \n        **Figure 8.31:** Azure Databricks: Deploy libraries/config files\n\n\
    \        So, we have created an Azure DevOps release pipeline to deploy all Databricks\
    \ artifacts to all environments with the click of a button. Entire Azure DevOps\
    \ CD pipeline tasks per environment stage looks as follows:\n\n        ![](images/Figure-8.32.jpg)\n\
    \n        **Figure 8.32:** Azure Databricks deployment\n\nOnce the Databricks\
    \ artifacts are deployed to the development environment, stages with **integration\
    \ tests** will be triggered. Integration steps with Azure Databricks notebook\
    \ can be implemented using Databricks REST API, as follows:\n\n1.  **Configure\
    \ the staging environment**\n\n    Create a command line task to create the directories\
    \ for the notebook execution logs.\n\n2.  **Run the Databricks notebook**\n\n\
    \    Add the task **Python** s**cript**, which will run the integration test cases\
    \ for the integration testing. We have to provide a path for the Databricks notebooks\
    \ and relevant parameters.\n\n3.  **Generate test results**\n\n    We have to\
    \ again add a Python **script** task in the release pipeline, which will generate\
    \ the relevant test results.\n\nIf the test result execution is successful, the\
    \ release pipeline will proceed with the deployment and will continue to deploy\
    \ to higher environments using the same tasks we created for the development environment\
    \ using the task groups.\n\nOverall, Azure DevOps CD pipeline, including all the\
    \ stages and integration tests, can be visualized as follows:\n\n![](images/Figure-8.33.jpg)\n\
    \n**Figure 8.33:** Azure Databricks deployment pipeline\n\nIt is recommended to\
    \ use a secret scope to store to manage secrets while working with Azure Databricks.\
    \ We can create two types of secret scope with Azure Databricks:\n\n1.  **Azure\
    \ Key Vault backed secret scope**\n\n    We can use Azure Key Vault backed secret\
    \ scope to reference the secrets stored in the Azure Key Vault. We can refer to\
    \ all the secrets stored in the key vault by the key vault secret name. We can\
    \ create Azure Key Vault backed secret scope using this URL: **https://<databricks-instance>#secrets/createScope**:\n\
    \n    ![](images/Figure-8.34.jpg)\n\n    **Figure 8.34:** Azure Databricks secret\
    \ scope\n\n    Here, we have to fill in the DNS name for the key vault and the\
    \ resource ID. You can find it by selecting the Azure Key Vault resource from\
    \ the portal:\n\n    ![](images/Figure-8.35.jpg)\n\n    **Figure 8.35:** Azure\
    \ Databricks secret scope\n\n    **Azure Key Vault backed secret scope can also\
    \ be created using Databricks CLI. You can use this Databricks CLI command:**\n\
    \n    `databricks secrets create-scope --scope <scope-name> --scope-backend-type`\n\
    \n    `AZURE_KEYVAULT --resource-id <azure-keyvault-resource-id> --dns-name <azure-keyvault-dns-name>`\n\
    \n2.  **Databricks backed secret scope**\n\n    Databricks backed secret scope\
    \ is stored in an encrypted format in the back end by a database in Azure Databricks.\
    \ Databricks secret scope name should be unique within the Databricks workspace\
    \ name.\n\n    Databricks backed secret scope can be used by the following Databricks\
    \ CLI command:\n\n    `databricks secrets create-scope --scope <scope-name>`\n\
    \nSo, irrespective of any tools you use, the team can follow the classic Git flow\
    \ or GitHub flow cycle during the development with Databricks Lakehouse platform:\n\
    \n*   Developers can develop individual features using the feature branch.\n\n\
    *   Once the local develop is completed, we can commit the changes to the master\
    \ branch that will trigger the CI/CD pipeline.\n\n*   CI/CD pipeline will trigger\
    \ the Databricks repos APIs to update the project to the latest version.\n\n*\
    \   CI pipeline downloads the artifacts and performs integration testing.\n\n\
    *   Once the testing is successful, the release pipeline will deploy the notebooks\
    \ and artifacts to higher environments.\n\nDatabricks labs continuous integration\
    \ and deployment templates are the open-source tools that we can use during the\
    \ software development activity to use the existing CI tooling with Databricks\
    \ jobs. This open-source tool also has various pipeline templates considering\
    \ the best practices of working with Databricks Lakehouse platform.\n\nThese pipeline\
    \ templates enable developers to focus on writing the code for the application\
    \ development on public cloud platforms like AWS, Azure, and so on.\n\nThe following\
    \ are the steps to use Databricks labs CI/CD templates:"
