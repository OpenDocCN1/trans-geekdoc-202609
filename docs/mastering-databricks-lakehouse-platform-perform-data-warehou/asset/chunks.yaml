  trans: "\n\n更改数据馈（Change Data Feed）的另一个用途是在 `MERGE` 语句中。聚合 `MERGE` 语句本身非常复杂，但更改数据馈功能使得编码变得更加简单高效：\n\
    \n![](img/Figure-6.25.jpg)\n\n**图 6.25:** CDF MERGE 语句\n\n**引用**:\n\n**[`databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html`](https://databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html)**\n\
    \n正如我们在前面的图中所示，CDF 让我们更容易更容易理解哪些行发生了变化，因为它只对已更改的数据或使用 `table_change` 操作的数据进行聚合。\n\
    \n通过以下查询，我们可以了解如何使用更改的数据来确定已更改的日期和股票代码。\n\n**示例**:\n\n```\nSelect DISTINCT date,stock_symbol\
    \ from tables_changes (‘silver’,2)\n```\n\n## 结论\n\n在本章中，我们详细探讨了 Databricks Lakehouse\
    \ 平台的 Spark 流处理功能。我们还详细学习了实现端到端 Spark 流处理用例。此外，我们详细了解了更改数据捕获（Change Data Capture）功能以及如何使用更改馈功能轻松地实现它。因此，我们可以使用\
    \ Databricks Lakehouse 平台上的 Spark 流来实现近实时解决方案。\n\n## 多选题\n\n1. 结构化流处理（structured\
    \ streaming）的三个主要组件是什么？\n    1. 输入源\n    2. 流引擎\n    3. 终端（Sink）\n    4. 以上所有\n\
    \n2. 更改数据捕获维护数据历史吗？\n    1. 是\n    2. 否\n\n3. 流式数据的输出模式有哪些？\n    1. `Append`\n\
    \    2. `Update`\n    3. `Complete`\n    4. 以上所有\n\n4. `Databricks 运行时支持 Amazon\
    \ Kinesis 作为源吗？`\n    1. `是`\n    2. `否`\n\n5. `Databricks 是否具有箱箱功能来捕获数据历史？`\n\
    \    1. `是`\n    2. `否`\n\n## 答案\n\n1. d\n2. a\n3. d\n4. a\n5. b\n\n## 第 7 章：使用\
    \ Databricks 进行机器学习模型管理\n\n如今，企业组织使用 `CI/CD 流水线`，通过最佳实践和各种 DevOps 工具将工作负载部署到所有环境中。`MLOps`\
    \ 是一个利用最佳实践和技术的过程，提供可扩展的、集中且受治理的解决方案，以便在不同的环境中部署机器学习应用程序。MLOps 是一个用于管理端到端机器学习生命周期的开源平台。\n\
    \n在上一章中，我们探索了使用 Databricks Delta Lake 实现 `SCD Type 2`。我们还详细学习了如何使用结构化流处理处理流数据。在本章中，我们将结合\
    \ Databricks Lakehouse 平台探索 MLOps 和 `MLflow`，并详细学习使用 `MLflow` 进行模型生命周期管理。\n\n\
    ## 结构\n\n在本章中，我们将学习使用 Databricks Lakehouse 平台实现机器学习解决方案的端到端实现。我们将涵盖的主题有：\n\n*\
    \ MLOps 和 `MLflow` 简介\n* 使用 `MLflow` 进行模型生命周期管理\n    * 从 `MLflow` 环境开始\n    *\
    \ 使用 Databricks 进行特征工程\n    * 带有模型库的 `MLflow` 项目设置\n    * 训练并部署模型\n    * 记录模型指标\n\
    \n## 目标\n\n学习本章后，你应该能够理解 Databricks Lakehouse 平台上的 MLOps 基础和 `MLflow` 功能。我们还将详细探索使用\
    \ `MLflow` 进行模型生命周期管理。\n\n## MLOps 和 MLflow 简介\n\n现在的组织使用该流程将代码从开发环境自动部署到更高环境：**测试**、**验收**和**生产**环境。组织拥有\
    \ DevOps 团队，使用 `Azure DevOps/Jenkins` 等工具开发持续集成和持续交付流水线。Databricks Lakehouse 平台内置了与\
    \ `Azure DevOps` 或 `Jenkins` 等 DevOps 工具的集成，这使得整体集成和部署变得更加简单和快速。\n\n对于机器学习项目，大多数企业组织尚未建立此类流程以实现更快的应用程序部署。流程效率下的可能原因如下：\n\
    \n* 数据科学团队没有遵循机器学习开发生命周期（类似于开发者遵循的软件开发生命周期）。\n* 由于机器学习开发和相关倡议对组织来说是新的，围绕机器学习的流程尚未完全整合。\n\
    * 数据科学团队没有将产物（artifacts）作为独立实体进行高效管理。\n* 数据科学家使用的许多工具可能符合组织的标准。\n\n为了高效管理数据科学工作负载并解决上述数据科学工作负载的问题，我们可以使用\
    \ `MLflow`，这是一个用于管理机器学习的开源平台。在处理机器学习和数据科学项目以解决复杂的现实项目并从数据中获取业务洞察时，数据科学家和数据工程师必须应对以下挑战：\n\
    \n* 处理海量数据\n* 计算资源的管理\n* 加速机器学习的加速器\n* 机器学习领域的快速发展\n\nMLOps 是一项用于创建可持续且统一的机器学习开发和运行的工程过程。\n\
    \n下图显示了机器学习过程中涉及的步骤：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:** 机器学习的要素\n\n为了缩短机器学习工作负载的上市时间，建议启用源代码控制、单元测试、集成测试以及包的持续交付，但它们之间存在显著差异如下：\n\
    \n* CI 流水线侧重于测试和验证数据、数据方案以及机器学习模型。\n* 机器学习工作负载的持续部署流水线应自动将产物部署到其他服务。\n* 持续测试关注机器学习模型的自动重新训练和提供。\n\
    \n典型的数据科学机器学习项目由以下步骤组成：\n\n* **数据提取**：从不同的数据源提取相关数据并将其整合，以创建可用于机器学习项目的数据。\n* **数据分析**：对存储的数据进行数据分析，以便在机器学习模型中使用：\n\
    \    * 理解数据。\n    * 确定数据模型的数据准备和特征工程。\n    * **数据准备**：数据准备步骤涉及数据清洗、划分训练和验证数据以及应用数据转换。\n\
    \    * **模型训练**：数据科学家创建机器学习算法来处理准备好的数据。该阶段的输出是训练好的机器学习模型。\n    * **模型评估**：根据数据集对机器学习模型进行评估，以评估数据的质量。\n\
    \    * **模型验证**：模型验证步骤用于验证机器学习模型。\n    * **模型服务**：一旦机器学习模型有效并准备好服务，应将验证的模型部署到目标环境中提供预测。有多种提供机器学习模型的方法。\n\
    \n        ▪ 使用 REST API 实现微服务\n        ▪ 嵌入移动设备模型\n        ▪ 批处理系统\n\n"
- fmt: "\n## **Model monitoring**: Model predictive performance should be monitored\
    \ to check the performance of the model and take proactive actions:\n\n![](images/Figure-7.2.jpg)\n\
    \n**Figure 7.2:** ML Ops life cycle\n\nAs we can see in the pictorial representation\
    \ of the ML Ops life cycle, there are multiple steps involved:\n\nThe amount of\
    \ automation involved in these steps determines the maturity of the machine learning\
    \ process. This automation can determine the velocity of training new models on\
    \ the data.\n\nLet’s look at the steps involved in the end-to-end machine learning\
    \ pipeline implementation.\n\nAt a higher level, the machine learning process\
    \ involves the following steps:\n\n* Source control\n* Testing and build ML service\n\
    * ML model deployment\n* Model registry\n* Feature store\n* Metadata store\n*\
    \ ML pipeline execution\n\n![](images/Figure-7.3.jpg)\n\n**Figure 7.3:** Automated\
    \ CI/CD pipeline for machine learning process\n\nThe preceding diagram shows the\
    \ stages of an automated CI/CD pipeline:\n\n* **Development**: Data Scientists\
    \ and machine learning engineers try to develop machine learning models where\
    \ the experiment’s steps are orchestrated. Output of this step is the source code\
    \ that will be pushed to the repository.\n* **Continuous integration pipeline**:\
    \ Once the source code is ready, it will be committed to the repository after\
    \ creating the package and testing. Output of this stage is the package that will\
    \ be deployed to the later stage.\n* **Continuous delivery pipeline**: Once the\
    \ CI pipeline is ready, CD pipeline will deploy the artifacts produced by the\
    \ CI stage to the target environments.\n* **Automated production deployment**:\
    \ CI/CD pipeline will be executed automatically in the production environment\
    \ based on the schedule or trigger.\n* **Continuous delivery**: Once the trained\
    \ model is ready, it will be deployed to the prediction service to enable service\
    \ for the predictions.\n* **Monitoring**: With monitoring, we can monitor the\
    \ model performance based on the live data. Output of this stage is to execute\
    \ the pipeline based on the model performance threshold.\n\nData analysis is still\
    \ a manual step that will be performed by the Data Engineers/Data Analysts based\
    \ on the before the pipeline execution in the source code.\n\n## Continuous integration\
    \ setup for machine learning projects\n\nIn the continuous integration pipeline\
    \ setup for the machine learning projects, components are built, tested, and packaged\
    \ to the source code repository. CI pipeline also has the following steps:\n\n\
    * Unit testing of the source code for the feature engineering implementation.\n\
    * Unit testing of the implemented functions of the machine learning models.\n\
    * Model training test coverage.\n* Integration testing for the pipeline components.\n\
    \n## Continuous delivery setup for machine learning projects\n\nContinuous delivery\
    \ pipeline enables rapid and reliable pipelines and models:\n\n* Verify the compatibility\
    \ of the model with the target infrastructure.\n* Test the machine learning model\
    \ endpoint with API.\n* Automated model deployments to the higher environments:\
    \ **test**, **acceptance**, and **production**\n\nTo enable efficient model management,\
    \ Databricks uses `MLflow`, an open-source platform for the machine learning life\
    \ cycle.\n\nMLflow model registry is a centralized model store to manage the complete\
    \ life cycle of the machine learning models. MLflow provides model lineage, model\
    \ versioning, and stage transitions as well:\n\n![](images/Figure-7.4.jpg)\n\n\
    **Figure 7.4:** MLflow\n\nMLflow is an open-source machine learning platform that\
    \ has the following two basic features:\n\n* **Open source**: Open-source projects\
    \ that can be used by developers and end users. MLflow’s open format makes it\
    \ easier to share models across organizations.\n* **Open user interface**: MLflow\
    \ can work with any ML library, algorithm, deployment tools, or language. MLflow\
    \ is based on the REST APIs and enables easy integration with various tools. We\
    \ can also add existing ML code to the MLflow to share code using the ML library\
    \ to share across the organization.\n* MLflow has the following main components:\n\
    \    * `Tracking`\n    * `Projects`\n    * `Models`\n    * `Repositories`\n\n\
    MLflow is mainly designed to work with any type of machine learning library, check\
    \ the code conventions to be followed, and check the required changes to integrate\
    \ with the existing source code. MLflow also makes the code reproducible and reusable\
    \ by different data scientists.\n\nFew use cases of the MLflow can be: Data Scientists\
    \ can use MLflow tracking to track the experiments locally on the machine, and\
    \ large organizations can share projects, models, and results using the MLflow.\n\
    \nMLflow supports integration with various tools:\n\n![](images/Figure-7.5.jpg)\n\
    \n**Figure 7.5:** MLflow\n\nIf you want to install MLflow, you can use the following\
    \ command:\n\n```\npip install mlflow\n```\n\nThe following organizations are\
    \ using MLflow:\n\n![](images/Figure-7.6.jpg)\n\n**Figure 7.6:** Companies using\
    \ MLflow\n\nDatabricks Lakehouse platform uses the Databricks runtime. If you\
    \ use the databricks runtime ML, MLfLow will be pre-installed.\n\nIf you don’t\
    \ use Databricks runtime, we can also install the MLflow package from the `pypi`\
    \ repository.\n\n## Model life cycle management using MLflow\n\nDatabricks Lakehouse\
    \ platform has a fully managed and hosted version of MLflow, with high-level security,\
    \ availability, and compatibility with Databricks features. We can manage an end-to-end\
    \ machine learning cycle using MLflow:\n\n* **Tracking**: We can track machine\
    \ learning experiments over time and compare the results.\n* **Models**: End users\
    \ can manage machine learning models from various ML libraries on multiple platforms.\n\
    * **Projects**: We can package the machine learning project using MLflow projects\
    \ so that it can be shared and used by multiple Data Scientists.\n* **MLflow model\
    \ registry**: We can create a centralized model store for managing the model lifecycle\
    \ starting from development to production, versioning, and so on.\n* **Model serving**:\
    \ Enables end users to host the MLflow models using the REST endpoints.\n\nWhen\
    \ we go to the Databricks home page UI, we can select the `Machine Learning` option,\
    \ as follows:\n\n![](images/Figure-7.7.jpg)\n\n**Figure 7.7:** Databricks machine\
    \ learning workspace\n\nDatabricks machine learning home page has options to select\
    \ notebooks, AutoML, and so on:\n\n![](images/Figure-7.8.jpg)\n\n**Figure 7.8:**\
    \ Databricks machine learning home page\n"
