    Once you have the results and your stream of JSON object has been structured,
    you will think of using it, and some of the common work may be to push it in to
    another table, display it as a report via a tool like Power BI or Tableau, or
    save it in multiple formats, such as **CSV**, **TSV**, **Parquet**, **Excel**,
    or even delta table.


    To do that, one most important thing that you need to do is to connect with a
    storage solution, be it cloud storage such as **S3 buckets**, **File Share**,
    **Azure Blob** storage, or something that is built for the purpose of a data warehouse,
    that is a **Data Lake** or **synapse**.


    In an extended enterprise environment where the security, governance, and traceability
    are very important, one of the most accepted ways is to bind your storage source
    with active directory and set up mount point as per the following example.


    To achieve this, you can provision an azure blob storage, enabling folder hierarchy
    to enable Azure Data Lake services smart capabilities.


    To create a data lake storage, you can refer to this master article by Microsoft:


    **docs.microsoft.com/en-us/azure/storage/blobs/create-data-lake-storage-account**


    Once that is ready, you will have to enable it with active directory.


    Alternatively, you can refer to the following link for binding your storage with
    active directory and **outh2.0** authentication via Databricks:


    **docs.databricks.com/data/data-sources/azure/adls-gen2/azure-datalake-gen2-sp-access.html**'
