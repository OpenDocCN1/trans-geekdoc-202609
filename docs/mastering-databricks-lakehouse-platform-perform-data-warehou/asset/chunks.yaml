    \ `Task key` field to identify new task settings. See, create (**[https://docs.databricks.com/data-engineering/jobs/jobs-api-updates.html#create-job](https://docs.databricks.com/data-engineering/jobs/jobs-api-updates.html#create-job)**),\
    \ for an example job settings specifying multiple tasks.\n\n*   **Reset**: To\
    \ overwrite the settings of a single-task format job with the `Overwrite all settings\
    \ for a job operation (POST /jobs/reset)` in the jobs API, you do not need to\
    \ change existing clients.\n\n*   **List**: To `Retrieve a list of jobs using\
    \ (GET /jobs/list)` in the jobs API. For multi-task format jobs, most settings\
    \ are defined at the task level and not the job level. Cluster configuration may\
    \ be set at the task or job level to modify clients to access cluster or task\
    \ settings for a multi-task format job returned in the job structure: \n\n   \
    \ *   Parse the `job_id` field for the multi-task format job.\n\n    *   Pass\
    \ the `job_id` to get a job operation (`GET /jobs/get`) in the jobs API to retrieve\
    \ job details.\n\n*   **Get**: To `Get a job operation (GET /jobs/get)` in the\
    \ jobs API. Multi-task format jobs return an array of task data structures containing\
    \ task settings. If you require access to task-level details, you need to modify\
    \ your clients to iterate through the tasks array and extract the required fields.\n\
    \n**These are just a few examples to help you start with job API. For a detailed\
    \ understanding, you can refer to the Databricks documentation.**\n\n**[https://docs.databricks.com/dev-tools/api/](https://docs.databricks.com/dev-tools/api/)**\n\
    \n# [Conclusion](#toc.xhtml#s86a)\n\nIn this chapter, you learned how to orchestrate\
    \ workflows written in multiple ways. You learnt about running Databricks processes\
    \ written in different ways, such as notebook JAR and in multiple languages. You\
    \ also learned to sequence and orchestrate dataflow and data processing tasks\
    \ using cloud based tools provided by different cloud vendors such as Data Factory\
    \ on Azure, and, Apache Airflow on AWS working outside but in situ with the Databricks\
    \ implementation specific to that cloud vendor. This chapter have further helped\
    \ you in understanding general concepts around working with Databricks native\
    \ jobs and Delta Live tables. While there is still a lot of reading that you may\
    \ have to **do before you find yourself to be an expert on this topic, this chapter\
    \ gave you a nice kickstart in working effectively with Databricks jobs**.\n\n\
    # [Multiple choice questions](#toc.xhtml#s87a)\n\n1.  Which of the following cloud-based\
    \ tool sets can be used to orchestrate Databricks workflows? \n\n    1.  Airflow\
    \ on AWS (Amazon managed apache airflow)\n\n    2.  Data Factory on Azure\n\n\
    \    3.  Delta Live tables\n\n    4.  All the above\n\n2.  What are the different\
    \ ways to use Data Factory for orchestration? \n\n    1.  Importing the Databricks\
    \ notebook and executing in the Azure data factory pipeline\n\n    2.  Using Notebook\
    \ or Python activity\n\n    3.  Import pipeline file using Azure functions\n\n\
    3.  How jobs can be created in Databricks? \n\n    1.  Through jobs UI\n\n   \
    \ 2.  Through jobs API\n\n    3.  Through Azure CLI\n\n    4.  Through Databricks\
    \ CLI\n\n4.  Databricks maintains a history of our job runs for up to \\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_ days? \n\n    1.  30 days\n\n    2.  50 days\n\n    3.\
    \  60 days\n\n    4.  100 days\n\n# [Answers](#toc.xhtml#s88a)\n\n1.  **d**\n\n\
    2.  **a, b**\n\n3.  **a, b, d**\n\n4.  **c**\n\n# [CHAPTER 5](#toc.xhtml#c05)\n\
    \n# [Simplified ETL with Delta Live Tables](#toc.xhtml#c05)\n\n**Delta Live Tables**\
    \ is a framework that helps the data engineering teams to build reliable data\
    \ pipelines to cater high quality data on the delta lake. Delta live tables simplify\
    \ the ETL pipeline development with automatic testing and visibility for end-to-end\
    \ pipeline monitoring.\n\nIn the last chapter, we explored how to perform data\
    \ sharing from the Databricks Lakehouse platform. You also learned in detail about\
    \ how to schedule and manage the jobs using the Databricks UI as well as API.\n\
    \n# [Structure](#toc.xhtml#s89a)\n\nThis chapter deals with Delta Live Tables\
    \ components and how to use them to implement and run a Delta Live Tables pipeline.\
    \ Here are the topics covered in the chapter:\n\n*   Delta Live Tables concepts\n\
    \n*   Development workflow with Delta Live Tables\n\n*   Delta Live Table configurations\n\
    \n# [Objectives](#toc.xhtml#s90a)\n\nAfter studying this chapter, you should be\
    \ able to understand in detail the fundamentals of Delta Live Tables. We will\
    \ also look at creating a development workflow to build ETL pipelines with the\
    \ Delta Live Tables to simplify development testing and monitoring. Additionally,\
    \ we will explore how to configure Delta Live Tables.\n\n# [Delta Live Table concepts](#toc.xhtml#s91a)\n\
    \n**Delta Live Table** is the foundation for creating reliable, maintainable,\
    \ and stable data processing pipelines with Databricks Lakehouse platform. Delta\
    \ Live Table makes it easier to design the data pipelines and control the quality\
    \ of data.\n\nDelta Live Table can be used for creating simplified ETL pipelines:\n\
    \n*   Orchestration\n\n*   Cluster management\n\n*   Monitoring\n\n*   Data quality\n\
    \n*   Efficient error handling\n\n**Features of Delta Live Table are as follows:**\n\
    \n*   **Ease of creating data pipelines**: With the Delta Live Table, we can easily\
    \ create an end-to-end data pipeline (refer to *[Figure 5.1](#c05.xhtml#fig5_1)*),\
    \ starting from getting data from the data source to transformation logic and\
    \ storing the output to destination so that we don’t have to manually integrate\
    \ these stages explicitly:\n\n    ![](images/Figure-5.1.jpg)\n\n    **Figure 5.1:**\
    \ Delta Live Table pipelines\n\n*   **Automated testing:** Use of the Delta Live\
    \ Table enables the use case to ensure that we are working with the quality data\
    \ for BI, data science, and ML use cases for the consumers. We can also enhance\
    \ and monitor the data quality trends over time to know more about how the data\
    \ is evolving.\n\n*   **Ease of recovery and detailed monitoring:** We can reduce\
    \ downtime by enabling automatic error handling and make faster deployment with\
    \ one-click deployment:\n\n    ![](images/Figure-5.2.jpg)\n\n    **Figure 5.2:**\
    \ Ease of recovery and end-to-end monitoring\n\n    **Image source**: [https://databricks.com/product/delta-live-tables](https://databricks.com/product/delta-live-tables)\n\
    \n# [Components of the Delta Live Table](#toc.xhtml#s92a)\n\nLet’s understand\
    \ the components of the Delta Live Table and how we can build them together to\
    \ create a Delta Live Table pipeline:\n\n*   **Pipeline**: Pipeline is a fundamental\
    \ unit of execution in the Delta Live Table. Pipeline can be considered as a **Directed\
    \ Acyclic Graph** (**DAG**), which links the data from the source dataset to target\
    \ datasets.\n\n    We can create delta live tables using SQL queries or Python.\
    \ We also need to configure the pipeline settings to run the pipeline, including\
    \ the data quality constraints with datasets.\n\n    Pipeline subcomponents can\
    \ be defined as follows:\n\n    *   **Queries**: Pipeline queries contain the\
    \ actual implementation logic for the data transformations from the source dataset\
    \ to the target dataset using Python or SQL.\n\n    *   **Expectations**: We can\
    \ specify the data quality expectations to control the data quality of the dataset.\
    \ Expectations provide flexibility to process the records even though records\
    \ don’t meet the criteria. We can define expectations to **retain/drop records\
    \ or hold the pipeline** when the records fail.\n\n*   **Pipeline settings**:\
    \ We can define the pipeline settings in the JSON format with parameters required\
    \ to run the pipeline: \n\n    *   Libraries\n\n    *   Cloud storage location\n\
    \n    *   Other dependent Python packages\n\n    *   Optional spark cluster configuration\n\
    \n*   **Pipeline update:** Once the pipeline is created, we can start the update\
    \ to run the pipeline. Update will execute these activities: \n\n    *   Start\
    \ Databricks cluster\n\n    *   Discover all tables and views"
