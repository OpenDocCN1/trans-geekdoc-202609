  trans: "\n\n*   `operation` 参数，例如此操作是追加还是覆盖表中的数据。\n*   表格版本与此事务提交关联。\n*   `ClusterID`\
    \ 笔记本标识是哪个 Databricks 集群和笔记本执行了此提交，以及执行操作的用户 `userID`、`userName`、`ID` 和 `name`。添加相关信息。\n\
    \n# 通过代码读取事务日志\n\n*   读取特定版本的事务日志：\n\n    ```python\n    %>%python\n    log =\
    \ Spark.read.json(\"//.../00000…2.json\")\n    ```\n\n*   可以使用以下代码片段读取 Delta 事务日志提交的元数据：\n\
    \n    ```python\n    %python # Commit Information\n    display(log.select(\"commitInfo\"\
    ).where(\"commitInfo is not null\"))\n    ```\n\n*   可以使用以下代码片段读取 Delta 事务日志添加的元数据：\n\
    \n    ```python\n    %python # Commit Information\n    display(log.select(\"add\"\
    ).where(\"add is not null\"))\n    ```\n\nDelta Lake 可以优化其查询，这影响了重要文件的数量，特别是在动态分区裁剪等情况下，你可以从之前的入门指南中读到。\n\
    \n由于 Delta Lake 事务日志跟踪文件和其他元数据以确保原子事务和数据可靠性，即使表的底层数据文件被删除，它也不会从磁盘上立即删除这些文件。可以使用\
    \ `VACUUM` 操作来删除不再需要的文件。\n\n对于构建在批或流处理的大型系统，Spark 可能会创建许多小文件以维护原子性；这通常会导致小文件问题，使得查询事务日志文件夹（即\
    \ delta log 子目录）变得越来越低效。为了处理这个问题，Delta Lake 在创建第 `10^(th)` 次提交或事务后，会创建一个 Parquet\
    \ 格式的检查文件。\n\n每隔 `10^(th)` 次提交创建一个事务日志，有助于以原生 Parquet 格式保存某一时刻表的完整状态。这使得 Spark\
    \ 能够快速读取并处理小文件问题。\n\n# 时间旅行\n\n当你向 Delta 表或目录写入数据时，每个操作都会自动进行版本控制。你可以通过两种方式访问数据的不同版本：\n\
    \n*   Delta Lake 时间旅行允许你安全地从 Delta Lake 中删除数据，在发生错误时撤销，并通过 Delta Lake 事务日志跟踪进度。\n\
    *   这不仅有助于处理审计问题，在需要从所有地方删除特定用户数据，且有时需要回到表的某个过去状态以验证之前的内容的情况下，还有助于主要的治理和合规性跟踪。\n\
    \n考虑 GDPR，*你将如何避免淹没在数据请求用例中？*\n\n# 回滚与时间旅行\n\n通过时间旅行进行回滚也可以轻松使用时间戳或版本号将你的数据重置为之前的快照。\n\
    \nDelta Lake 中的每个表都是 Delta Lake 事务日志中记录的所有提交的总和。事务日志可以被视为一份分步指南，详细说明了如何从表的特定状态转换到所需状态。\n\
    \n这有助于通过从原始表开始并向后或向前处理，来重建表在任何时间点的状态。\n\n# 处理上游更改\n\n很多时候，我们需要查看表在特定时刻的状态。我们可以使用\
    \ `DESCRIBE` 命令查看历史：\n\n```sql\nDESCRIBE HISTORY table\n```\n\n如果切换想查询特定版本的数据，可以使用\
    \ `VERSION AS` 或 `TIMESTAMP AS` 子句：\n\n通过版本号查询：\n```sql\nSELECT * FROM table VERSION\
    \ AS 5\n```\n\n通过时间戳查询：\n```sql\nSELECT * FROM table TIMESTAMP AS '2023-01-01\
    \ 00:00:00'\n```\n"
- fmt: "Processing data has always been a challenge and is performed in multiple steps,\
    \ such as identifying the source and data itself, connecting the source, validating\
    \ and identifying issues with the data, cleaning and restructuring, and finally,\
    \ enabling it to be consumed by a consumer, such as a stream analytics engine,\
    \ streaming solutions, database, storage, or reporting tools like Power BI or\
    \ Qlik view.\n\nIn the last three chapters, we explored the foundation and basics\
    \ of Databricks, Databricks architecture, usage of Databricks Lakehouse platform\
    \ for Data Science and Engineering, and Databricks SQL. We also looked at the\
    \ evolution of spark to Databricks and processing validated data securely by building\
    \ an ETL pipeline in Databricks using notepad.\n\nIn this chapter, you will understand\
    \ the orchestration of the workflows written in multiple notepads, which can be\
    \ automated in defined steps either in parallel or in sequence.\n\n`Automation`\
    \ and `orchestration` are complementary to each other. `Automation` is when a\
    \ machine is able to complete a task or a set of tasks embedded in the workflow\
    \ without human intervention. `Orchestration` is the configuration of multiple\
    \ tasks that can be executed into one set of end-to-end processes. A variety of\
    \ tools exist to help data teams unlock the full benefit of orchestration with\
    \ a framework through which workloads can be automated.\n\n# Orchestrating Data\
    \ and Machine Learning pipelines in Databricks\n\nDatabricks makes it easy to\
    \ orchestrate multiple tasks in order to easily build Data and Machine Learning\
    \ workflows. Data teams can easily create and manage multi-step pipelines that\
    \ transform and refine data, or they can train machine learning algorithms, saving\
    \ immense time, effort, and context switching using interdependent and modular\
    \ tasks consisting of notebooks, Python scripts, and other supporting languages:\n\
    \n![](images/Figure-4.1.jpg)\n\n**Figure 4.1:** Databricks orchestration: Typical\
    \ orchestration workflow\n\nIn the preceding example, you can see multiple tasks\
    \ for personalized offer generation for a typical e-commerce website orchestrated\
    \ and clubbed into a chain of workflow.\n\nTo orchestrate Databricks workflow\
    \ and pipeline, you can use multiple cloud-based tools, such as:\n\n*   `Airflow`\
    \ on AWS (`Amazon managed apache airflow`)\n*   `Data factory` on Azure\n*   `Delta\
    \ Live tables`\n*   Interface and API provided by Databricks for job management\n\
    \nIn this chapter, we will cover all four major options for orchestration by starting\
    \ with Amazon Managed Workflow and then moving on to Data factory on Azure, Databricks\
    \ job interface, and Delta Live tables.\n\n# Running Databricks tasks using Amazon\
    \ Managed Airflow\n\n`Apache Airflow` in Amazon can be used via Amazon `Managed\
    \ Workflows for Apache Airflow` (`MWAA`).\n\nIt is a managed orchestration service\
    \ for Apache Airflow. This manages the open-source Apache Airflow platform with\
    \ the security, availability, and scalability of AWS. `MWAA` gives users additional\
    \ benefits of easy integration with AWS services and a variety of third-party\
    \ services via pre-existing plugins to allow customers to create complex data\
    \ processing pipelines. Databricks notebook scripts can be easily configured and\
    \ orchestrated through the `airflow` for orchestration purposes:\n\n![](images/Figure-4.2.jpg)\n\
    \n**Figure 4.2:** Databricks orchestration: With Airflow and Databricks API\n\n\
    In the preceding diagram, you will notice that the availability of API allows\
    \ Amazon Managed Apache Airflow to easily execute different tasks on Databricks\
    \ cluster and get instrumentation.\n\nSteps are as follows:\n\n1.  Create a token\
    \ inside Airflow:\n    ![](images/Figure-4.3.jpg)\n    **Figure 4.3:** Databricks\
    \ orchestration: Setup\n2.  Link the DAG to Databricks:\n    ![](images/Figure-4.4.jpg)\n\
    \    **Figure 4.4:** Databricks orchestration: Setup\n3.  Trigger the DAG in MWAA.\n\
    4.  Once triggered, your job should show in Databricks:\n    ![](images/Figure-4.6.jpg)\n\
    \    **Figure 4.6:** Databricks orchestration: Databricks job log\n\nDatabricks\
    \ jobs are independent and are an integral part of Databricks. The orchestrator\
    \ tool, such as Airflow and Data Factory, creates a layer above it to provide\
    \ you with the opportunity of orchestrating multiple tasks created through different\
    \ tools.\n"
  raw: "Processing data has always been a challenge and is performed in multiple steps,\
    \ such as identifying the source and data itself, connecting the source, validating\
    \ and identifying issues with the data, cleaning and restructuring, and finally,\
    \ enabling it to be consumed by a consumer, such as a stream analytics engine,\
    \ streaming solutions, database, storage, or reporting tools like Power BI or\
    \ Qlik view.\n\nIn the last three chapters, we explored the foundation and basics\
    \ of Databricks, Databricks architecture, usage of Databricks Lakehouse platform\
    \ for Data Science and Engineering, and Databricks SQL. We also looked at the\
    \ evolution of spark to Databricks and processing validated data securely by building\
    \ an ETL pipeline in Databricks using notepad.\n\nIn this chapter, you will understand\
    \ the orchestration of the workflows written in multiple notepads, which can be\
    \ automated in defined steps either in parallel or in sequence.\n\n**Automation**\
    \ and **orchestration** are complementary to each other. **Automation** is when\
    \ a machine is able to complete a task or a set of tasks embedded in the workflow\
    \ without human intervention. **Orchestration** is the configuration of multiple\
    \ tasks that can be executed into one set of end-to-end processes. A variety of\
    \ tools exist to help data teams unlock the full benefit of orchestration with\
    \ a framework through which workloads can be automated.\n\n# [Orchestrating Data\
    \ and Machine Learning pipelines in Databricks](#toc.xhtml#s82a)\n\nDatabricks\
    \ makes it easy to orchestrate multiple tasks in order to easily build Data and\
    \ Machine Learning workflows. Data teams can easily create and manage multi-step\
    \ pipelines that transform and refine data, or they can train machine learning\
    \ algorithms, saving immense time, effort, and context switching using interdependent\
    \ and modular tasks consisting of notebooks, Python scripts, and other supporting\
    \ languages:\n\n![](images/Figure-4.1.jpg)\n\n**Figure 4.1:** Databricks orchestration:\
    \ Typical orchestration workflow\n\nIn the preceding example, you can see multiple\
    \ tasks for personalized offer generation for a typical e-commerce website orchestrated\
    \ and clubbed into a chain of workflow.\n\nTo orchestrate Databricks workflow\
    \ and pipeline, you can use multiple cloud-based tools, such as:\n\n*   Airflow\
    \ on AWS (Amazon managed apache airflow)\n\n*   Data factory on Azure\n\n*   Delta\
    \ Live tables\n\n*   Interface and API provided by Databricks for job management\n\
    \nIn this chapter, we will cover all four major options for orchestration by starting\
    \ with Amazon Managed Workflow and then moving on to Data factory on Azure, Databricks\
    \ job interface, and Delta Live tables.\n\n# [Running Databricks tasks using Amazon\
    \ Managed Airflow](#toc.xhtml#s83a)\n\n**Apache Airflow** in Amazon can be used\
    \ via Amazon **Managed Workflows for Apache Airflow** (**MWAA**).\n\nIt is a managed\
    \ orchestration service for Apache Airflow. This manages the open-source Apache\
    \ Airflow platform with the security, availability, and scalability of AWS. MWAA\
    \ gives users additional benefits of easy integration with AWS services and a\
    \ variety of third-party services via pre-existing plugins to allow customers\
    \ to create complex data processing pipelines. Databricks notebook scripts can\
    \ be easily configured and orchestrated through the airflow for orchestration\
    \ purposes:\n\n![](images/Figure-4.2.jpg)\n\n**Figure 4.2:** Databricks orchestration:\
    \ With Airflow and Databricks API\n\nIn the preceding diagram, you will notice\
    \ that the availability of API allows Amazon Managed Apache Airflow to easily\
    \ execute different tasks on Databricks cluster and get instrumentation and execution\
    \ status through Databricks API, which is further integrated with AWS Cloud Watch\
    \ and **Simple Notification Service** (**SNS**) to notify users on different events.\n\
    \n**Steps are as follows**:\n\n1.  Create a token inside Databricks and configure\
    \ the Databricks connection in MWAA: \n\n    ![](images/Figure-4.3.jpg)\n\n  \
    \  **Figure 4.3:** Generate token\n\n    ![](images/Figure-4.4.jpg)\n\n    **Figure\
    \ 4.4:** Databricks orchestration: Setup Airflow for Databricks\n\n2.  Configure\
    \ the connection in MWAA. Create a notebook script and wrap it under DAG:\n\n\
    \    **For example**:\n\n    `from airflow import DAG`\n\n    `from airflow.providers.databricks.operators.databricks\
    \ import DatabricksSubmitRunOperator, DatabricksRunNowOperator`\n\n    `from datetime\
    \ import datetime, timedelta`\n\n    `#Define params for Submit Run Operator`\n\
    \n    `new_cluster = {`\n\n    `‘spark_version’: ‘7.3.x-scala2.12’,`\n\n    `‘num_workers’:\
    \ 4,`\n\n    `‘node_type_id’: ‘Node Compute Size EC2 Instance, Large, Medium,\
    \ Micro’,`\n\n    ` “aws_attributes”: {`\n\n    `“instance_profile_arn”: “arn:aws:iam::XXXXXXX:instance-profile/databricks-data-role”`\n\
    \n    `}`\n\n    `}`\n\n    `notebook_task = {`\n\n    `‘notebook_path’: ‘/Users/xxxxx@XXXXX.com/user’,`\n\
    \n    `}`\n\n    `#Define params for Run Now Operator`\n\n    `notebook_params\
    \ = {`\n\n    `“Variable”: Any Parameter that you need to Pass`\n\n    `}`\n\n\
    \    `default_args = {`\n\n    `‘owner’: ‘airflow’,`\n\n    `‘depends_on_past’:\
    \ False,`\n\n    `‘email_on_failure’: False,`\n\n    `‘email_on_retry’: False,`\n\
    \n    `‘retries’: 1,`\n\n    `‘retry_delay’: timedelta(minutes=5)`\n\n    `}`\n\
    \n    `with DAG(‘databricks_dag’,`\n\n    `start_date=datetime(2022, 5, 5),`\n\
    \n    `schedule_interval=’@weekely’,`\n\n    `catchup=False,`\n\n    `default_args=default_args`\n\
    \n    `) as dag:`\n\n    `opr_submit_run = DatabricksSubmitRunOperator(`\n\n \
    \   `task_id=’submit_run’,`\n\n    `databricks_conn_id=’databricks_default’,`\n\
    \n    `new_cluster=new_cluster,`\n\n    `notebook_task=notebook_task`\n\n    `)`\n\
    \n    `opr_submit_run`\n\n3.  Save it to an S3 bucket or a file source.\n\n4.\
    \  Link the DAG to Airflow:\n\n    ![](images/Figure-4.5.jpg)\n\n    **Figure\
    \ 4.5:** Databricks orchestration: Setup DAG\n\n5.  Trigger the DAG in Airflow\
    \ MWAA.\n\n6.  Once triggered, your job should show in Databricks jobs:\n\n  \
    \  ![](images/Figure-4.6.jpg)\n\n    **Figure 4.6:** Databricks orchestration:\
    \ Databricks job running log\n\nDatabricks jobs are *independent* and are an integral\
    \ part of Databricks. The orchestrator tool, such as Airflow and Data Factory,\
    \ creates a layer above it to provide you with the opportunity of orchestrating\
    \ multiple tasks created through different tools to seamlessly integrate with\
    \ Databricks jobs.\n\n# [Run and orchestrate the Databricks tasks using Data Factory](#toc.xhtml#s84a)\n\
    \nIn this section, we will understand the options to orchestrate and trigger Databricks\
    \ tasks through **Azure Data Factory**:\n\n![](images/Figure-4.7.jpg)\n\n**Figure\
    \ 4.7:** Databricks orchestration: ADF example\n\nThis is a typical example of\
    \ orchestrating and executing Databricks scripts and tasks using a Data Factory\
    \ workflow.\n\nThere are multiple ways to use a Data Factory for orchestration:\n\
    \n*   Via importing the Databricks notebook and executing in the Azure Data Factory\
    \ pipeline\n\n*   Via notebook or Python activity\n\n# Via importing the Databricks\
    \ notebook and executing in the Azure Data Factory pipeline\n\nThe prerequisites\
    \ are as follows:\n\n*   An Azure Blob storage account with a container.\n\n*\
    \   Set up a sink by noting the storage account name, container name, and access\
    \ key.\n\n*   An Azure Databricks workspace.\n\n*   An access token from Azure\
    \ Databricks to link it to Azure Data Factory using link service.\n\n*   Notebook\
    \ import from Azure Databricks and noting the location.\n\nSteps are as follows:\n\
    \n1.  If you don’t have a working notebook, import a notebook to Databricks for\
    \ transformation; else, create a notebook, execute and test in Databricks, and\
    \ further use it in the Azure Databricks pipeline for execution:\n\n    ![](images/Figure-4.8.jpg)\n\
    \n    **Figure 4.8:** Databricks orchestration: Import notebook 1\n\n    ![](images/Figure-4.9.jpg)\n\
    \n    **Figure 4.9:** Databricks orchestration: Import notebook 2\n\n2.  To use\
    \ an existing notebook, make sure you note the path; this will be required later\
    \ when you set this notebook to execute in the pipeline:\n\n    ![](images/Figure-4.10.jpg)"
