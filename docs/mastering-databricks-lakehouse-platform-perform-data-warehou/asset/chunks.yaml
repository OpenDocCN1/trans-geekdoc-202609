  trans: "\n\n- **显示集群**：如下方所示，在 Databricks 主页上选择 `Compute`，这将显示 Databricks 中所有现有集群，并包含集群名称、状态、节点、运行时、驱动程序和集群所有者等详情：\n\
    \n  ![](img/Figure-2.4.jpg)\n\n  **图 2.4：** Databricks - 显示集群\n\n- **集群活动**：我们可以从\
    \ Databricks 集群显示页的 `Actions` 面板对 Databricks 集群进行终止、重启、克隆和编辑集群策略：\n\n  ![](img/Figure-2.5.jpg)\n\
    \n  **图 2.5：** Databricks - 集群活动\n\n  集群创建后，集群定义以 `JSON` 格式存储。此外，我们还可以使用 `JSON`\
    \ 格式定义通过 API 自动在 Databricks 中创建集群。我们可以通过点击集群名称打开集群。然后将打开集群配置页面。您可以点击 `JSON` 按钮以\
    \ `JSON` 格式查看集群定义。\n\n**在编辑集群后，Notebook 和作业将始终保持与集群的关联。即使集群处于运行状态，我们也可以编辑集群配置。**\n\
    \n  ![](img/Figure-2.6.jpg)\n\n  **图 2.6：** Databricks - 集群配置\n\n# 集群治理\n\n通过仅向某些用户提供\
    \ `Can Restart`（可以重启）或 `Can Attach To`（可以附加）权限，而不是创建和管理权限，我们可以禁用集群配置。集群策略可用于管理细粒度的集群权限。集群管理员可以配置集群策略以限制用户管理集群的访问。\n\
    \n在 Databricks 中启用集群策略后，我们可以管理以下内容：\n\n* 通过仅允许的配置设置限制用户创建集群的权限\n* 仅允许特定用户在 Databricks\
    \ 中创建集群\n* 设置集群成本阈值以降低集群成本\n\n从 Databricks 的 `Display Cluster` 页面，使用 `Cluster\
    \ Policies` 标签页，我们可以创建一个集群策略：\n\n  ![](img/Figure-2.7.jpg)\n\n  **图 2.7：** Databricks\
    \ - 集群策略创建\n\n您可以使用 `JSON` 格式定义集群策略。例如，如下图高亮所示，我们创建了一个集群策略，它仅允许用户创建具有 Databricks\
    \ 运行时环境 `7.3.x-scala2.12` 的集群，并且由于隐藏标志被设置为 `true`，该属性将从 Databricks UI 中隐藏。\n\n\
    在 Databricks 中使用集群策略具有以下优势：\n\n* 强制执行治理和标准的集群配置。\n* 避免资源的过度使用。\n* 使用标签节省成本并确保准确的费用分摊。\n\
    * 通过为用户提供特定类型工作负载的预配置集群，加速数据处理：\n\n  ![](img/Figure-2.8.jpg)\n\n  **图 2.8：** 已创建的\
    \ Databricks 集群策略 - 固定集群大小\n\n实施集群策略将完全改变用户使用 Databricks 的体验。实施集群策略的高级步骤如下：\n\n\
    * 通知所有用户集群策略的更改，并他们他们针对工作负载测试集群配置。\n* 实施分阶段发布。\n* 以 `Agile` 方式在组织范围内逐步引入更多策略。\n\
    * 在整个组织范围内完成实施。\n\n## 平台架构、安全与数据保护\n\n通过仅向某些用户提供 `Can Restart` 或 `Can Attach To`\
    \ 权限，而不是创建和管理权限，我们可以禁用集群配置。集群策略可用于管理细粒度的集群权限。集群管理员可以配置集群策略以限制用户管理集群的访问。\n\n##\
    \ 平台架构与数据保护\n\nDatabricks 是一个统一的分析平台，连接了数据科学和数据工程团队：\n\n  ![](img/Figure-2.9.jpg)\n\
    \n**图 2.9：** Databricks 架构\n\n在我们探索 Databricks 的功能及其安全性之前，让我们先探索 Databricks 的高层架构：\n\
    \nDatabricks 有两个主要组件：\n\n- `Control pane`（控制面）：`Control pane` 作为 Notebook 和 SQL\
    \ 端点的后端。\n- `Data plane`（数据平面）：`Data plane` 由在 AWS 账户中管理的计算资源组成。数据平面有两种类型：\n \
    \ - `Classic data plane`（经典数据平面）：Databricks 使用经典数据平面用于 Notebook、作业和 SQL 端点。\n\
    \  - `Serverless data plane`（无服务器数据平面）：启用 Databricks SQL 时使用。\n\n我们可以使用连接器从外部源摄取批或流式数据。当我们交互式执行\
    \ Notebook 时，笔记本结果将存储在控制面以及存储账户中。但出于安全考虑，如有需要，也可以将交互式笔记本结果仅存储在客户工作空间中。\n\n## 平台安全\n\
    \nDatabricks 平台提供端到端安全，保护数据，包括为数据工程师、数据科学家和数据分析师提供的隔离 Databricks 工作空间。\n\nDatabricks\
    \ 平台使用云原生身份提供者的内置身份管理来提高平台安全性。\n\nDatabricks 平台具有内置的安全加速器，以提高数据安全、工作空间安全、身份管理和合规性。\n\
    \n- **数据安全**：通过使用自定义 VNET 部署，Databricks 控制面板将在客户云账户的隔离 VNET 中管理集群。可以使用现有的身份提供程序来明数据湖中的访问策略。Databricks\
    \ 集群始终以加密格式存储数据。Databricks 还具有 AWS S3 和 Azure Data Lake 的无缝集成和安全数据访问。\n- **Databricks\
    \ 工作空间**：我们可以创建自定义 VNET 并在其中部署 Databricks 工作空间，以限制 VNET 内的数据访问和处理，从而符合数据治理策略并遵守监管规定。使用带有\
    \ IP 白名单的自定义 VNET 也可以限制进出 Databricks 工作空间的流量。\n- **身份管理**：Databricks 使用云原生身份提供者具有内置身份管理，支持用于身份验证和授权的\
    \ SAML 协议，以及**跨域身份管理系统** (**SCIM**)。\n\n"
- fmt: "\n- **Compliance**: Databricks platform has built-in controls to meet the\
    \ industry standards compliance requirements.\n\n# Data Protection\n\nDatabricks\
    \ platform comprises the following data protection features for data security:\n\
    \n- **Data encryption at rest using user and system managed keys**: Databricks\
    \ platform has isolated compute and storage resources. Databricks clusters are\
    \ compute resources that are impermanent in nature, which will be started when\
    \ the data processing starts and terminated once the data processing is completed.\
    \ Databricks storage services support data encryption, customer managed keys with\
    \ key vault backed integration and file/folder level granular access.\n\n- **Data\
    \ encryption in transit**: When we execute notebooks or jobs in Databricks, all\
    \ the traffic from the cluster will be redirected from the control pane to customer\
    \ subscription and this traffic is always TLS encrypted. When clusters access\
    \ the data, TLS protocol is used for the communication to ensure that the data\
    \ encryption in transit.\n\n- **File and folder level access control mechanism**:\
    \ We can also enable file- and folder-level granular access management while working\
    \ with Databricks platform. For example, while working with Azure Databricks,\
    \ we can enable the `ADLS passthrough` option. When this option is enabled, authentication\
    \ automatically takes place in `Azure Data Lake Storage` using `Azure Active Directory\
    \ Identity`, by which we logged in to the Azure Databricks workspace. We can read\
    \ and write data to ADLS without configuring service principal credentials or\
    \ any other additional configurations. User access management will be managed\
    \ based on ACLs applied at the file or folder level:\n\n    ![](images/Figure-2.10.jpg)\n\
    \n    **Figure 2.10:** Databricks cluster - credential passthrough\n\n    As shown\
    \ in the preceding screenshot, we can configure Databricks cluster with credential\
    \ passthrough while creating the cluster.\n\n- **Access control tables**: When\
    \ table access control is enabled in the Databricks workspace, we can programmatically\
    \ grant and revoke access to the data while working with Databricks notebook in\
    \ `SQL`, `Python`, and `pyspark`. By default, all the users in the Databricks\
    \ workspace can access the data stored in the cluster managed table. Once the\
    \ table access control is enabled, users can access restricted data objects based\
    \ on the assigned permissions.\n\n    We can create view-based access control\
    \ model using the following privileges:\n\n    - `SELECT`: Read access to an object.\n\
    \    - `CREATE`: Create an object.\n    - `MODIFY`: Add/delete/modify data to/from\
    \ an object.\n    - `READ_METADATA`: View an object and its metadata.\n    - `CREATE_NAMED_FUNCTION`:\
    \ Create a UDF in an existing catalog or database.\n    - `ALL PRIVILEGES`: Gives\
    \ all privileges.\n\n    We can apply these privileges to the following classes\
    \ of objects:\n\n    - `CATALOG`: Control permission for the data catalog.\n \
    \   - `DATABASE`: Controls access to a database.\n    - `TABLE`: Controls access\
    \ to a managed/external table.\n    - `VIEW`: Controls access to SQL views.\n\
    \    - `FUNCTION`: Controls access to function.\n    - `ANONYMOUS FUNCTION`: Controls\
    \ access to anonymous functions.\n    - `ANY FILE`: Controls access to the underlying\
    \ file system.\n\n- **Secret management with Databricks**: While working with\
    \ the Databricks platform, we have to. Databricks provides a secure way to store\
    \ sensitive information such as API keys, passwords, and certificates. We can\
    \ manage secrets at the cluster, folder, or notebook level. Databricks also integrates\
    \ with external secret managers like Azure Key Vault, AWS Secrets Manager, and\
    \ Google Cloud Secret Manager.\n\n    ![](images/Figure-2.10.jpg)\n\n    **Figure\
    \ 2.10:** Databricks cluster - credential passthrough\n"
  raw: "*   **Compliance**: Databricks platform has built-in controls to meet the\
    \ industry standards compliance requirements.\n\n# [Data Protection](#toc.xhtml#s55a)\n\
    \nDatabricks platform comprises the following data protection features for data\
    \ security:\n\n*   **Data encryption at rest using user and system managed keys**:\
    \ Databricks platform has isolated compute and storage resources. Databricks clusters\
    \ are compute resources that are impermanent in nature, which will be started\
    \ when the data processing starts and terminated once the data processing is completed.\
    \ Databricks storage services support data encryption, customer managed keys with\
    \ key vault backed integration and file/folder level granular access.\n\n*   **Data\
    \ encryption in transit**: When we execute notebooks or jobs in Databricks, all\
    \ the traffic from the cluster will be redirected from the control pane to customer\
    \ subscription and this traffic is always TLS encrypted. When clusters access\
    \ the data, TLS protocol is used for the communication to ensure that the data\
    \ encryption in transit.\n\n*   **File and folder level access control mechanism**:\
    \ We can also enable file- and folder-level granular access management while working\
    \ with Databricks platform. For example, while working with Azure Databricks,\
    \ we can enable the `ADLS passthrough` option. When this option is enabled, authentication\
    \ automatically takes place in **Azure Data Lake Storage** using the **Azure Active\
    \ Directory Identity**, by which we logged in to the Azure Databricks workspace.\
    \ We can read and write data to ADLS without configuring service principal credentials\
    \ or any other additional configurations. User access management will be managed\
    \ based on ACLs applied at the file or folder level: \n\n    ![](images/Figure-2.10.jpg)\n\
    \n    **Figure 2.10:** Databricks cluster - credential passthrough\n\n    As shown\
    \ in the preceding screenshot, we can configure Databricks cluster with credential\
    \ passthrough while creating the cluster.\n\n*   **Access control tables**: When\
    \ table access control is enabled in the Databricks workspace, we can programmatically\
    \ grant and revoke access to the data while working with Databricks notebook in\
    \ **SQL**, **Python**, and **pyspark**. By default, all the users in the Databricks\
    \ workspace can access the data stored in the cluster managed table. Once the\
    \ table access control is enabled, users can access restricted data objects based\
    \ on the assigned permissions.\n\n    We can create view-based access control\
    \ model using the following privileges:\n\n    *   `SELECT`: Read access to an\
    \ object.\n\n    *   `CREATE`: Create an object.\n\n    *   `MODIFY`: Add/delete/modify\
    \ data to/from an object.\n\n    *   `READ_METADATA`: View an object and its metadata.\n\
    \n    *   `CREATE_NAMED_FUNCTION`: Create a UDF in an existing catalog or database.\n\
    \n    *   `ALL PRIVILEGES`: Gives all privileges.\n\n    We can apply these privileges\
    \ to the following classes of objects:\n\n    *   `CATALOG`: Control permission\
    \ for the data catalog.\n\n    *   `DATABASE`: Controls access to a database.\n\
    \n    *   `TABLE`: Controls access to a managed/external table.\n\n    *   `VIEW`:\
    \ Controls access to SQL views.\n\n    *   `FUNCTION`: Controls access to function.\n\
    \n    *   `ANONYMOUS FUNCTION`: Controls access to anonymous functions.\n\n  \
    \  *   `ANY FILE`: Controls access to the underlying file system.\n\n*   **Secret\
    \ management with Databricks**: While working with the Databricks platform, we\
    \ have to work with confidential information to configure and access data from\
    \ various storage accounts. We can securely access secrets using the **Databricks\
    \ backed** or **key-vault backed**. Databricks secrets will be stored securely.\
    \ If someone tries to display the output of the secret in the notebook, then it\
    \ will be automatically replaced by `[REDACTED]`.\n\n    For example, we can create\
    \ secret score in Azure Databricks from the portal using the URL, as shown in\
    \ following screenshot:\n\n    ![](images/Figure-2.11.jpg)\n\n    **Figure 2.11:**\
    \ Databricks secret scope\n\n    Best recommended practice while working with\
    \ the Databricks platform is to use Databricks secret scope to refer confidential\
    \ secrets from the secret scope.\n\n# [Databricks data access management](#toc.xhtml#s56a)\n\
    \nIn this section, we will walk through the points to consider for data governance\
    \ while working with the Databricks platform and best practices to be used to\
    \ implement them to build an enterprise solution using Databricks.\n\n# Need of\
    \ data governance with Databricks platform\n\nData governance consists of a collection\
    \ of policies and practices to manage sensitive data securely for the enterprise\
    \ organization. We can increase data security by providing the data teams more\
    \ visibility and control of the user data and protecting the same from unauthorized\
    \ users by configuring the required rules to meet the regulatory requirements:\n\
    \n![](images/Figure-2.12.jpg)\n\n**Figure 2.12:** Data governance\n\n# Data access\
    \ management challenges\n\nWhile building any data solutions for enterprise organizations,\
    \ security teams, and platform administrators have to make sure that data is accessed\
    \ in a secure manner and governed as per the regulatory bodies. Regulatory bodies\
    \ all over the world have defined the way to capture and store the data.\n\nLet’s\
    \ go through the challenges when considering the security and availability of\
    \ the data while working with the cloud:\n\n*   Support of **Access Control List**\
    \ (**ACL**) for the data stored in the cloud.\n\n*   Audit logging of the data\
    \ access on cloud platform.\n\n*   Scalability of the security and monitoring\
    \ solutions with growing data.\n\n*   Proactive monitoring of data access policies.\n\
    \n*   Identify gaps in data governance solution.\n\n# Databricks managed data\
    \ governance solution\n\nNow, let’s take a look at Databricks managed data governance\
    \ solution:\n\n*   ACL to manage fine-grained access to data. Databricks has cloud\
    \ backbone state-of-the-art AWS security to simplify users and secure access to\
    \ the data lake.\n\n*   Databricks has cluster policies to control access to the\
    \ compute resources.\n\n*   Databricks has REST API to automate provisioning and\
    \ permission management.\n\n*   Robus audit logging to audit and track workspace\
    \ operations.\n\n*   AWS Cloud Native Databricks workspace can provide data access\
    \ information across the deployment account using **AWS CloudTrail** and **CloudWatch**.\n\
    \nNow, let’s explore in detail the setting up the data governance solution using\
    \ the in-built Databricks features:\n\n*   **Access control setup**: We can set\
    \ up fine-grained access to data storage using the access control list. Using\
    \ `Instance Profile`, we can secure data access on S3 bucket. We can select the\
    \ instance profile when we launch a cluster in Databricks: \n\n    ![](images/Figure-2.13.jpg)\n\
    \n    **Figure 2.13:** Databricks cluster instance profile\n\n    Once the Databricks\
    \ cluster is created, make sure that only authorized users have access to attach\
    \ the notebooks using the cluster permission setting:\n\n    ![](images/Figure-2.14.jpg)\n\
    \n    **Figure 2.14:** Databricks cluster permission settings\n\n*   **Table access\
    \ control**: Table access control is used in Databricks to grant, deny, and revoke\
    \ access to the data using the Spark SQL API. We can also manage a granular level\
    \ of access to table objects like databases, tables, views, and functions.\n\n\
    \    For example, Data Analysts want to create regulatory reporting reports using\
    \ sensitive information. You only restrict access to sensitive data to certain\
    \ data analysts and disable access to other users in the group. We can achieve\
    \ the same by implementing the table access control:\n\n    ![](images/Figure-2.15.jpg)\n\
    \n    **Figure 2.15:** Databricks table access control - GRANT access\n\n    Similarly,\
    \ we can deny access to all user `sagar.lad` using the following command:\n\n\
    \    ![](images/Figure-2.16.jpg)\n\n    **Figure 2.16:** Databricks table access\
    \ control - DENY access\n\n    It is also possible to define fine-grained access\
    \ control to specific tables or views."
