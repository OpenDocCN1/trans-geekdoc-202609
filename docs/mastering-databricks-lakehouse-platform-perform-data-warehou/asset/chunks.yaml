  raw: '**Data Quality Audit Framework** are not just needed for compliance and regulatory
    requirements but also to make sure your system is fault-tolerant and can be validated,
    audited, and traced to a certain point without compromising velocity.


    While this can be achieved by building and extending your system to handle schema
    changes with DDL and DML audits to a certain extent, you also need to assure that
    you are able to time travel to a certain point to find out if what was there before
    is present or absent now.


    This is not always possible without building a system that is based on transactional
    logs, be it a **Data Definition** or **Data Manipulation** based change. Luckily,
    Delta Lake seamlessly and naturally provides the feature of maintaining a history
    of changes via transaction logs.


    Delta Lake transaction log serves as a single source of truth that is able to
    track all changes that users make to the table. One could compare this transaction
    log feature in Delta Lake as something like a source code repository that maintains
    all changes in an incremental form.


    # How does Delta Lake maintain transaction logs?


    A typical way to store a delta formatted data is in **Parquet** files; consider
    it as one set of data with a certain schema being maintained inside one folder,
    and each folder has an incremental and partitioned entry of records in Parquet
    format and a folder that maintains the logs of changes, be it a **Data Definition**
    or **Data manipulation**.


    Each incremental change is versioned with a unique file number and partition in
    a **delta log** folder associated and unique to specific datasets so that it’s
    always easy for concurrent and consistent writing.


    To simplify this, you can correlate each of these sets of data as tables in databases
    to be able to perform a set of unique operations, such as the following:


    *   **Adding file**: Used and mentioned when a data file, for example, **Parquet**
    files, are added


    *   **Removing file**: Whenever a removal happens, similar to drop or truncation


    *   **Updating metadata**: Whenever someone updates the table’s metadata (for
    example, changing the table’s name, schema, or partitioning)


    *   **Setting transaction**: Records commits


    *   **Commit info**rmation: Contains information around the commit


    The transaction logs in Delta Lakes guarantee *atomicity* - if there is no record
    in the transaction log, it means that the transaction was never done.


    By only recording transactions that execute fully and completely, the Delta Lake
    transaction log allows users to have fundamental trustworthiness on the final
    state of data, and being parallel, it can guarantee atomicity at a petabyte scale.


    Whenever an **INSERT**, **DELETE**, **UPDATE,** or **MERGE** operation similar
    to what we see in the databases is performed, Delta Lake breaks that operation
    down into multiple actions.


    As and when the change occurs in the table, those changes are recorded as ordered
    atomic commits in the transaction log.


    Each commit is written out as a **JSON** file, starting with `000000…..00.json`.
    Additional changes to the table generate subsequent JSON files in ascending order
    so that the next commit is written out as `000001.json`, the following as `00000….2.json`,
    and so on. Each numeric JSON file that got incrementally written denotes a new
    version of the table.


    In a real example from the operation that we did previously, you can notice the
    CRC and JSON files being created sequentially:


    ![](images/Figure-3.21.jpg)


    **Figure 3.21:** Databricks Audit: Transaction log structure delta tables, delta
    lakes


    An important thing to understand is that the transaction log is the single source
    of truth for your **delta table**.


    If we break the operations between reading and writing, in a parallel situation,
    we may have multiple readers reading and writing to a delta table.


    So, any reader that’s reading through basic operations on Delta Lakes, your delta
    table will take a look at the transaction log first based on commits as incremental
    JSON files and subsequently, the version of Parquet files, which are already mentioned
    in JSON files in the transaction log in sequential order.


    Any modification being done in the delta table, be it adding or removing records,
    changing schema, and so on, is going to create a new version with the delta operations,
    allowing the delta table to construct the final consistent output.


    Even if it is a void operation like adding a record in one transaction and deleting
    the same record in another transaction, which, in fact, *nullifies* the insert
    action it would still be recorded.


    Let’s say you first insert an item, The transaction would automatically be added
    to the transaction log, saved to disk as commit `0000000..x.json` (`x` denotes
    the incremental number) mentioning *add* operation with the corresponding Parquet.
    Later, you decide to remove those files (for example, run a `DELETE` from table
    operation), those actions would be recorded as the next commit and table version
    in the transaction log, as `00000..x+1.json` with a new Parquet file, implementing
    atomicity in Delta Lake.


    Even though the two Parquets are no longer part of our Delta Lake table, their
    addition and removal are still recorded in the transaction log because those operations
    were performed at some point in time.


    This unique feature makes sure that you can time travel to a past point. There
    is *atomicity* in the transaction, and the operations performed on a delta table
    are fully auditable.


    To understand this, refer to the following **add** and **remove** operation from
    a single transaction log:


    **Add**


    ![](images/Figure-3.22.jpg)


    **Figure 3.22:** Databricks audit: Transaction log 1


    **Remove**


    ![](images/Figure-3.23.jpg)


    **Figure 3.23:** Databricks Audit: Transaction log 2


    **Commit information**


    ![](images/Figure-3.24.jpg)


    **Figure 3.24:** Databricks Audit: Transaction log 3


    The corresponding Parquet files are being affected by the transaction:


    ![](images/Figure-3.25.jpg)


    **Figure 3.25:** Databricks Audit: Transaction log 4


    *Why add and delete in the same log?*


    If you review the operation related to the delta table in the preceding *data
    flow* section, you will see that we applied overwrite, which means that the last
    Parquet file was overwritten, removing and adding operations subsequently.


    This also matches with the `void` operation example in this section:


    | `df = Spark.sql(‘select * from parquetresultstore’)``df.write.format(“delta”).mode(‘overwrite’).option(“overwriteSchema”,
    “true”).save(“abfss://dbdemo@{storagename}.dfs.core.windows.net/RAW/parquetresultstore.delta”)``Spark.sql(“CREATE
    TABLE IF NOT EXISTS deltaresultstore USING DELTA LOCATION ‘abfss://dbdemo@dbstoragegen2mc4u.dfs.core.windows.net/RAW/parquetresultstore.delta’”)`
    |


    | --- |


    **Code 3.19**: Databricks Audit: Overwrite option and how it reflects in log


    # Reviewing the transaction log structure


    The transaction contains many pieces of information stored as strings or columns
    within the transaction log JSON.


    Typically, this can be divided into operations, (*what was added*, *what was removed*,
    and *commit information* for that specific and atomic transaction).


    If you review a simple **add** operation in the log, you can clearly see the `parquet`
    file that was created, for which this log has been generated, size, time, type
    of change, stats, and so on:


    ![](images/Figure-3.26.jpg)


    **Figure 3.26:** Databricks Audit: Transaction log 5


    And the minimum and maximum values in the file:


    ![](images/Figure-3.27.jpg)


    **Figure 3.27:** Databricks Audit: Transaction log 6


    The metadata contains a lot of interesting information, for example:


    *   The type of operation that is occurring in the preceding image is `{}add`.


    *   How many files were added (`numAddedFiles`), removed (`numRemovedFiles`),
    output row’s (`numOutputRows`), and output bytes (`numOutputBytes`).'
