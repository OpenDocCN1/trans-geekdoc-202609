    \n    `.withColumn(“click_count”, expr(“CAST(n AS INT)”))`\n\n    `.withColumnRenamed(“curr_title”,\
    \ “current_page_title”)`\n\n    `.select(“current_page_title”, “click_count”)`\n\
    \n    `)`\n\n# Create pipeline\n\n1.  Go to the `Jobs` tab from the Databricks\
