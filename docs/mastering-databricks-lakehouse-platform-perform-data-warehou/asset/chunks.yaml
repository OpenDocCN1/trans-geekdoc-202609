    **Figure 10.13:** Databricks cluster policy during cluster creation\n\nIt is also\
    \ possible to automatically provision the cluster and grant permissions to the\
    \ cluster. Using the REST API for cluster and permissions endpoint, it is easy\
    \ to provision and grant permission to cluster resources for users and groups.\
    \ Additionally, we can use an instance profile to the cluster for direct access\
    \ to any corresponding storage.\n\nThe following is an example of a configuration\
    \ that might be applicable for the new analytics project team.\n\nThe requirements\
