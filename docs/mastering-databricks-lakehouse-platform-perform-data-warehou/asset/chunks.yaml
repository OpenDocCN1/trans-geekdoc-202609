    \n    **Figure 5.8:** Delta Live Table publish tables\n\n    Apart from reading\
    \ the data from the external files, we can access the datasets defined in the\
    \ pipeline with the Delta Live Table `read()` function:\n\n    ![](images/Figure-5.9.jpg)\n\
    \n    **Figure 5.9:** Delta Live Table publish tables\n\n    Delta Live Table\
    \ internally takes care of dependency between the datasets. Delta Live table uses\
