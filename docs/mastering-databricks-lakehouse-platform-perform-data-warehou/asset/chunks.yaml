  trans: "\n图 4.10：Databricks 编排：复制路径\n\n**如果你是从示例源导入 notebook，你可能需要确保导入的 notebook\
    \ 已经根据你的环境设置了所有数据湖 存储和数据库连接。**\n\n# 创建 Azure Databricks 链接服务\n\n链接服务包含 Databricks\
    \ 的连接信息，使 Azure Data Factory 与 Azure Databricks 通信：\n\n![](img/Figure-4.11.jpg)\n\
    \n图 4.11：Databricks 编排：Data Factory 主页\n\n导航到 `linked service` 部分并选择 `Azure Databricks`：\n\
    \n![](img/Figure-4.12.jpg)\n\n图 4.12：Databricks 编排：Azure Databricks\n\n![](img/Figure-4.13.jpg)\n\
    \n图 4.13：Databricks 编排：设置链接服务\n\n请注意，访问令牌（access token）将是你在 Databricks 中生成的令牌。\n\
    \n根据你所需的执行速度、预算以及需要在后台运行的负载类型，工作节点（Workers）可以超过两个。\n\n一旦创建了链接服务，就可以流水线中调用 notebook\
    \ 来执行 Databricks 任务以及其他数据工厂任务。\n\n任务的数量和不同的链接服务取决于你如何访问源，以及你针对这些使用了什么类型的服务。例如，使用\
    \ blob 存储、`synapse` 或 `s3 bucket` 需要单独的链接服务来连接源或汇。\n\n## 创建你的 ADF 流水线\n\n1. 你可以从验证设置开始：\n\
    \n    ![](img/Figure-4.14.jpg)\n\n    图 4.14：Databricks 编排：ADF 流水线设置可用性标记\n\n\
    在流程开始设置可用性标记（availability flag）将确保所有输入数据集都已就绪。\n\n为了获得更好的预验证工作流，在 Data Factory\
    \ 流水线的开头设置验证任务是非常关重要的。这将确保在数据 Factory 流水线中的下一个任务启动之前，所有的连接和资源均可用。\n\n2. 要找到模板，请从\
    \ Data Factory 主页上的 `template` 部分选择一个与 Databricks 相关的模板：\n\n    ![](img/Figure-4.15.jpg)\n\
    \n    图 4.15：Databricks 编排：设置链接服务\n\n3. 现在，选择任何一个 Databricks 模板；例如，这里我们选择了高亮显示的那个：\n\
    \n    ![](img/Figure-4.16.jpg)\n\n    图 4.16：Databricks 编排：模板库\n\n4. 一旦设置好模板，你将获得如下\
    \ `Linked service` 选项：\n\n    ![](img/Figure-4.17.jpg)\n\n    图 4.17：Databricks\
    \ 编排：链接服务\n\n5. 一旦按照之前的说明设置了链接服务，你就可以进入验证步骤来检查源数据集的可用性：\n\n    ![](img/Figure-4.18.jpg)\n\
    \n    图 4.18：Databricks 编排：流水线\n\n6. 可用性检查完成后，你可以移动到移动文件到 blob 的下一步：\n\n    ![](img/Figure-4.19.jpg)\n\
    \n    图 4.19：Databricks 编排：流水线源活动\n\n7. 进一步，提供汇设置（例如 `Sink dataset`）作为目标，并结合 `Copy\
    \ behavior`、`Max concurrent connections`、`Block size (MB)` 等，以便输出输出准备好在后续步骤的数据库转换任务中处理：\n\
    \n    ![](img/Figure-4.20.jpg)\n\n    图 4.20：Databricks 编排：流水线汇活动\n\n8. 一旦你的源文件准备好被\
    \ Databricks 使用，下一步是调用 Databricks notebook 操作来处理文件进行转换。为了确保它完美运行，第一步是连接到 Databricks\
    \ 链接服务：\n\n    ![](img/Figure-4.21.jpg)\n\n    图 4.21：Databricks 编排：Databricks\
    \ 任务\n\n9. 下一步是设置最初复制的 notebook 路径：\n\n    ![](img/Figure-4.22.jpg)\n\n    图 4.22：Databricks\
    \ 编排：设置路径\n\n    ![](img/Figure-4.23.jpg)\n\n    图 4.23：Databricks 编排：基础参数\n\n\
    确保你正确设置了输入路径 `@pipeline().parameters.inputpath`、输出路径、文件名和 `runid`：\n\n    * Notebook\
    \ 路径是你从 [图 4.9] 步骤中复制的路径。\n    * 输入值应为 `@pipeline().parameters.inputpath`。\n \
    \   * 输出值应为 `@pipeline().parameters.outputpath`。\n    * 文件名值应为 `@pipeline().parameters.fileName`。\n\
    \    * `PipelineRunId` 值应为 `@pipeline().Runid`。\n\n# 通过 notebook 或 Python 活动运行\n\
    \n你也可以通过稍不同的路由运行 Data Factory 活动，即通过 notebook 或 Python 活动运行。这与之前的转换任务几乎相同，但提供了一种简单且特定的方式，来执行编写在\
    \ notebook、低级 JAR 或 Python 文件中的不同类型的 Databricks 代码。\n\n要做到这一点，你可以遵循以下步骤操作：\n\n\
    1. 创建一个 Data Factory。\n2. 创建 Data factory 链接服务，如本章较早选项所述。\n3. 创建一个使用 Databricks\
    \ notebook 活动的流水线：\n\n    ![](img/Figure-4.24.jpg)\n\n    图 4.24：Databricks 编排：独立\
    \ Databricks 活动执行\n\n4. 一旦你选择选择 Databricks notebook 活动，你需要使用正确的链接服务以及从 [图 4.9]\
    \ 复制的 Databricks 代码或 notebook 路径进行配置。\n5. 一旦设置就绪，你需要验证并发布 ADF 活动以便进一步执行或调试它：\n\
    \n    ![](img/Figure-4.25.jpg)\n\n    图 4.25：Databricks 编排：详情任务\n\n6. 下一步是通过以下步骤触发流水线运行：\n\
    \n    ![](img/Figure-4.26.jpg)\n\n    图 4.26：Databricks 编排：设置路径\n\n7. 一旦流水线被触发，下一步是监控流水线运行：\n\
    \n    ![](img/Figure-4.27.jpg)\n\n    图 4.27：Databricks 编排：流水线运行\n\n8. 所有的运行都可以在\
    \ Databricks 的作业和集群部分进行详细监控：\n\n    ![](img/Figure-4.28.jpg)\n\n    图 4.28：Databricks\
    \ 编排：集群运行状态\n\n    ![](img/Figure-4.29.jpg)\n\n    图 4.29：Databricks 编排：Databricks\
    \ 作业\n\n# Databricks 中的作业\n\n由于作业编排完全集成在 Databricks 中，它不需要任何其他云端工具（如 Data Factory\
    \ 或逻辑应用）来排序和编排多个任务。\n\n人们甚至可以使用 `jobs API` 或 `UI` 来创建和管理作业以及功能，例如设置在 Databricks\
    \ 内部或外部编写的多个任务，并发送邮件警报进行监控。凭借其强大的 API 方法，Databricks 作业可以编排任何具有 API 的内容（例如，从 Google\
    \ Analytics 或第三方应用程序提取数据，甚至是 Delta Live Tables）。\n\n如果你是初学者，并且没有特定的限制要在 Databricks\
    \ 界面之外编排流水线，你可以轻松地使用 Databricks 内部的作业界面满足所有的编排需求。\n\nDatabricks 中的作业在 Databricks\
    \ 集群内部执行，该集群本身具有弹性和扩展性，并完全运行在你的虚拟网络安全范围内。作业可以由单个任务组成，也可以是具有复杂依赖的多任务应用程序。一旦你的作业配置恰当，Databricks\
    \ 可以管理所有作业的任务编排、集群管理、监控和错误报告。这些作业可以立即运行、定期运行或按计划运行。\n"
- fmt: '

    The job tasks support implementation using notebooks, Delta Live Tables pipelines,
    or Python, Java, and Scala applications. Jobs can exhaust notebook-based segregated
    scripts and can consist of varied tasks, as described in *[Chapter 3, Spark, Databricks,
    and Building a Data Quality Framework](#c03.xhtml)*. This can be anything from
    running a Python script that ingests data from cloud storage, prepares the data
    with a Delta Live Tables pipeline, and creates a dashboard with a notebook or
    handles a Data Science and Machine Learning-based use case.


    The job can be created through the jobs UI, the jobs API, or the Databricks CLI.
    The jobs UI has detailed monitoring tools integrated that allow you to monitor,
    test, and troubleshoot the running and completed jobs.


    ## Create a Job

    To create a job, you need to click on `Jobs` in the sidebar.


    Refer to the `Red Icon` in the following diagram. To create your jobs, you need
    to create tasks and associate with your scripts written in a notebook.


    If you have parameters, you will have to configure as per requirements and further
    select the active cluster where these jobs will be executed:


    1. Add a name for your job with your job name.

    2. In the `Task name` field, enter a name for the task; for example, `get data
    from sql`.

    3. In the `Type` drop-down, select `Notebook`.

    4. Use the file browser to find the first notebook you created, click on the notebook
    name, and click on `Confirm`; here, it’s `DBDemo`, which we used in *[Chapter
    3, Spark, Databricks, and Building a Data Quality Framework](#c03.xhtml)*.

    5. Click on `Create task`.

    6. Click on ![](images/image055.jpg)following the task you just created to add
    another task.

    7. In the `Task name` field, enter a name for the task; for example, `filter-baby-names`.

    8. In the `Type` drop-down, select `Notebook`.

    9. Use the file browser to find the second notebook you created, click on the
    notebook name, and click on `Confirm`.

    10. Click on `Add` under `Parameters`. In the `Key` field, enter parameters in
    key and value format.

    11. Click on `Create task`:


    ![](images/Figure-4.30.jpg)

    **Figure 4.30:** Databricks orchestration: Jobs


    ![](images/Figure-4.31.jpg)

    **Figure 4.31** Databricks orchestration: Jobs


    ## Run the job

    To run the job immediately, click on ![](images/image061.jpg)in the upper-right
    corner. You can also run the job by clicking on the `Runs` tab and clicking on
    `Run Now` in the `Active Runs` table.


    ## View run details

    ![](images/Figure-4.32.jpg)

    **Figure 4.32:** Databricks orchestration: Job runs


    Databricks maintains a history of your job runs for up to *60 days*. If you need
    to preserve job runs, Databricks recommends that you export results before they
    expire:


    1. Click on the `Runs` tab and click on the link for the run in the `Active Runs`
    table or in the `Completed Runs (past 60 days)` table.

    2. Click on either task to see the output and details. For example, click on the
    `filter-baby-names` task to view the status and output for the filter task.


    For a job that orchestrates multiple tasks, click on a task to view task run details,
    including the cluster that ran the task, the job UI for the task, logs for the
    task, and the metrics for the task.


    Once done, you can click on the job ID value to return to the `Runs` tab for the
    job. Click on the job runs ID value to return to the job run details.


    ## Task dependencies

    When orchestration of multiple tasks is enabled, you can define the order of execution
    of tasks in a job using `Depends` in the dropdown. You can set this field to *one*
    or *more* tasks in the job.


    ## Delta Live tables

    To schedule a Delta Live table jobs, navigate *to the Delta Live* section. Here,
    you can set up a workflow based on JSON configuration and the number of notebooks
    you want to run in sequence or in parallel:


    ![](images/Figure-4.33.jpg)

    **Figure 4.33:** Databricks orchestration: Delta Live tables


    As per Databricks official documentation:


    *Delta Live Tables (DLT) is the first ETL framework that uses a simple declarative
    approach to building reliable data pipelines and automatically managing your infrastructure
    at scale so data analysts and engineers can spend less time on tooling and focus
    on getting value from data. With DLT, engineers are able to treat their data as
    code and apply modern software engineering best practices like testing, error
    handling, monitoring, and documentation to deploy reliable pipelines at scale.*


    Delta Live table accelerates ETL development by giving you the ability to develop
    an environment separate from production, easily test before deployment, and deploy
    and manage environments using parameterization. One can conduct unit testing easily,
    simplifying the development, testing, deployment, operations, and monitoring of
    ETL pipelines.


    This brings confidence in your data by delivering reliable data with built-in
    quality controls, testing, monitoring, and enforcement to ensure accurate and
    useful BI, Data Science, and ML. This helps prevent bad data from flowing into
    tables, tracks data quality over time, and provides tools to troubleshoot bad
    data with granular pipeline observability. This gives you a high-fidelity lineage
    diagram of your pipeline and lets you track dependencies and aggregate data quality
    metrics across all of it. You can easily configure it using the `Job` section.


    ![](images/Figure-4.34.jpg)

    **Figure 4.34:** Databricks orchestration: Job settings

    '
