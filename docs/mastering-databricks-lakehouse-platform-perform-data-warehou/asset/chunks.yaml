    ![](images/Figure-9.9.jpg)


    **Figure 9.9:** Databricks dashboards - create dashboards


    10. Once you click on the `Create Dashboard` button, enter the `dashboard name`;
    it will open the dashboard, as follows:


    ![](images/Figure-9.10.jpg)


    **Figure 9.10:** Databricks dashboards - add visualization and textbox


    11. Once the dashboard is open, you can add visualizations and text as per your
    requirement. After adding a textbox and visualizations to the sample dashboard,
    Databricks dashboard looks as follows:


    ![](images/Figure-9.11.jpg)


    **Figure 9.11:** Databricks sample dashboards


    12. Once you are done with the editing, click on the `three vertical dots`, as
    highlighted in the following screenshot, to edit, clone, download the dashboard
    as `PDF` or to delete the dashboard:


    ![](images/Figure-9.12.jpg)


    **Figure 9.12:** Databricks sample dashboards


    13. If you want to refresh the dashboard data manually, click on the `Refresh`
    button, and the data will be refreshed.


    We can also automate the data refresh using the `Schedule` option. Once you click
    on the `Schedule` button, you have an option to configure the `refresh schedule
    time`, `SQL endpoint,`, and `subscribers` who will get the report in email. Click
    on the `Save` button to save these configurations to automate the schedule of
    refresh data:


    ![](images/Figure-9.13.jpg)


    **Figure 9.13:** Databricks data refresh schedule


    If you want to temporarily pause the schedule of refresh data, you can disable
    the `Enabled` button.


    As an administrator, you can also delete the dashboard permanently or transfer
    the ownership of a dashboard if required.


    Visualizations and dashboard with Databricks also provide an option to configure
    alerts to proactively monitor the dashboard for threshold and notification via
    different modes of communication.


    In order to create alerts, we have to create a schedule query. When the schedule
    query reaches its threshold, alerts will be created based on the notification
    configuration:


    ![](images/Figure-9.14.jpg)


    **Figure 9.14:** View alerts


    14. To display the list of existing alerts, select `Alerts` from the sidebar:


    ![](images/Figure-9.15.jpg)


    **Figure 9.15:** Display alerts


    15. Now, click on the `Create Alert` button to create alerts using the query that
    will be executed when the specified conditions are met:


    ![](images/Figure-9.16.jpg)


    **Figure 9.16:** Create alerts


    There are multiple ways to get alert notifications. In order to configure notification,
    we have to first create an alert destination. Once you select the `alert type`,
    we have to configure relevant details to get an email notification. Once `alert
    destinations` are created, we can use it to get notifications when the threshold
    reaches.


    We can also set alerts based on the multiple columns of the query using the `case..when`
    statement in the SQL query. When the Databricks SQL sends the notifications to
    the chosen destinations, it changes the status of alert from `OK` to `TRIGGERED`.
    Based on the frequency of the alert, alert will be set on a specific day:


    ![](images/Figure-9.17.jpg)


    **Figure 9.17:** Create alert destination


    Here, we have to configure alert destination configurations to receive email notifications:


    ![](images/Figure-9.18.jpg)


    **Figure 9.18:** Configure alert destination


    We can also create favorites and tags to efficiently filter and search queries
    and dashboards available in the Databricks SQL.


    In order to create a favorite query or dashboard, click on the `Star` button to
    the left of the title in the query and dashboard. Once we click on the `Favorite`
    button, it will turn `yellow`:


    ![](images/Figure-9.19.jpg)


    **Figure 9.19:** Databricks SQL - favorite dashboard


    16. We can create meaningful tags to queries and dashboard for our project. Hover
    over to the dashboard in Databricks SQL, as shown in the following screenshot,
    and click on the `+Add tag` button:


    ![](images/Figure-9.20.jpg)


    **Figure 9.20:** Databricks SQL - dashboard


    This will open the pop-up, as follows, where we add new ones. Once done, click
    on `Save`:


    ![](images/Figure-9.21.jpg)


    **Figure 9.21:** Databricks - tags


    Additionally, `Schedule` in Databricks allows us to manage the existing ones.


    ![](images/Figure-9.22.jpg)


    **Figure 9.22:** Databricks - tags


    In the `Data Explorer`, we can view the schema of:


    ![](images/Figure-9.23.jpg)


    **Figure 9.23:** Databricks - Data Explorer


    17. Once you select the `table`, it will display the schema:


    ![](images/Figure-9.24.jpg)


    **Figure 9.24:** Databricks - table


    18. Click on the `sample data` if you want to preview the data:


    ![](images/Figure-9.25.jpg)


    **Figure 9.25:** Databricks - sample data


    19. Click on the `Details` tab to view the location of:


    ![](images/Figure-9.26.jpg)


    **Figure 9.26:** Databricks - Details


    20. Click on the `Queries` button in the left pane to view the list of:


    ![](images/Figure-9.27.jpg)


    **Figure 9.27:** Databricks - queries


    As shown in the following screenshot, you can filter the list of queries using
    different views, like `All Queries`, `My Queries`, `Favorites`, and `Admin`:


    ![](images/Figure-9.28.jpg)


    **Figure 9.28:** Databricks - queries


    While writing queries in Databricks SQL, we can also create query parameters whose
    value can be substituted into the query at any time. Any string between the double
    braces `{{ }}` is treated as a query parameter.


    We can create the following types of query parameters while writing the Databricks
    SQL:


    * `Text`

    * `Number`

    * `Date`, `Date and Time`, `Date and Time (with seconds)`

    * `DateRange`, `Date and Time Range`, `Date and Time Range (with seconds)`

    * `Dropdown List`

    * `Query Based Dropdown List`


    For example, to create a text parameter, we can create a query, as follows:


    ```sql

    SELECT * FROM users WHERE name={{ text_param }}

    ```

