    \ pull requests, and resolve conflicts after the integration with remote repos:\n\
    \n![](images/Figure-8.4.jpg)\n\n**Figure 8.4:** Databricks repos - Clone remote\
    \ repo\n\n4. If you want to move the notebook or folder in the workspace, navigate\
    \ to the notebook or folder and select `Move` from the drop-down menu, as follows:\n\
    \n![](images/Figure-8.5.jpg)\n\n**Figure 8.5:** Databricks repos - Move folder/notebook\n\
    \n5. Once the branch is created, you can create a new notebook or a folder by\
    \ clicking on the `Repos` button and clicking on the branch where we want to create\
    \ notebook or folder:\n\n![](images/Figure-8.6.jpg)\n\n**Figure 8.6:** Databricks\
    \ repos - Clone remote repo\n\nWe can also import the SQL or Python file in a\
    \ single cell inside the Databricks notebook:\n\n*   Use comment line `- - Databricks\
    \ notebook source at the top of SQLfile`\n*   Use comment line `# Databricks notebook\
    \ source at the top of python file`\n\nAs discussed at the beginning of the chapter,\
    \ we can also work with the non-notebook files with the integration of Databricks\
    \ repos in the Databricks Lakehouse platform. Right-click on the branch and click\
    \ on the `File` option to create a new file:\n\n![](images/Figure-8.7.jpg)\n\n\
    **Figure 8.7:** Databricks repos - Create new non-Databricks file\n\nIn order\
    \ to upload an existing file, select the branch and click on `Upload File(s)`:\n\
    \n![](images/Figure-8.8.jpg)\n\n**Figure 8.8:** Databricks repos - Upload new\
    \ non-Databricks file\n\nWe can also programmatically refer to the files in the\
    \ repo, such as `.csv` or `.json` files from the notebook. We can only read the\
    \ non-Databricks files, but we can’t create or edit the files in the notebook:\n\
    \n```python\nimport pandas as pd\ndf = pd.read_csv(\"./sampledata.csv\")\n```\n\
    \nWe can also use Spark to access the files in the repo. Absolute file path of\
    \ any file in the repo is: `/Workspace/Repos/<user_folder>/<repo_name>/file`.\n\
    \n```python\nimport os\nspark.read.format(\"csv\").load(f\"file:/Workspace/Repos/<user_folder>/<repo_name>/my_data.csv\"\
    )\n```\n\nTo sync with the remote Git repository, we can use the git dialog, which\
    \ will enable you to pull changes from the remote Git repository and commit changes\
    \ to the remote repos. We can access the Git dialog from the Databricks notebook,\
    \ as follows:\n\n![](images/Figure-8.9.jpg)\n\n**Figure 8.9:** Databricks repos\
    \ - Git dialog\n\nOnce you click on the branch, the Git dialog appears, as follows:\n\
    \n![](images/Figure-8.10.jpg)\n\n**Figure 8.10:** Databricks repos - Git dialog\
    \ commit and push request\n\nOnce you are done with the code changes, you can\
    \ open the Git dialog and commit and push changes to the repo:\n\n![](images/Figure-8.11.jpg)\n\
    \n**Figure 8.11:** Databricks repos - Commit and push changes\n\nIf you want to\
    \ pull the source code content from the remote repo, click on the `Pull` button\
    \ to pull changes from the remote repo:\n\n![](images/Figure-8.12.jpg)\n\n**Figure\
    \ 8.12:** Databricks repos - Pull changes\n\nClick on `Confirm` to commit the\
    \ pull request:\n\n![](images/Figure-8.13.jpg)\n\n**Figure 8.13:** Databricks\
    \ repos - Confirm pull changes\n\nThere are various benefits of working with non-Databricks\
    \ notebook files and its integration with Databricks repos.\n\n### Advantages\
    \ of Git integration for non-Databricks notebook files are as follows.\n\nThe\
    \ following image shows the non-Databricks files for Databricks repos:\n\n![](images/Figure-8.14.jpg)\n\
    \n**Figure 8.14:** Databricks repos - non-Databricks files\n\n*   **Code reusability**:\
    \ Existing Python and R modules can be referenced using the `import` function\
    \ in the repos as well Databricks notebooks.\n*   **Store environment specific\
    \ information with code**:\n    *   In order to create a generic code base while\
    \ working with Databricks notebook, we normally create the configuration files\
    \ to store environment-specific values as well as `requirement.txt` files to install\
    \ the dependent libraries.\n    *   With the introduction of non-Databricks notebooks\
    \ files, we can reduce the burden of managing the environments manually and eliminating\
    \ the manual errors.\n*   **Automate deployments for multiple environments**:\
    \ We can store environment specific information, such as jobs and clusters, in\
    \ configuration files, and we can use the configuration files to automate the\
    \ deployment across multiple environments.\n\nWe can also configure and manage\
    \ the permission to Databricks repos. Admin can manage the allowed list of users\
    \ to limit which remote users can commit and push the changes in the branch.\n\
    \nGo to `Settings`, select the admin `console`, choose the `Workspace settings`\
    \ tab, and `Enable repos Git URL Allow List` option.\n\nUsers who have permission\
    \ can commit and push the changes to the Git repositories. Default setting will\
    \ be empty, and users configured by the admin can commit the changes to the repo:\n\
    \n![](images/Figure-8.15.jpg)\n\n**Figure 8.15:** Databricks workspace settings\
    \ - Enable repos URL list\n\nAfter understanding different features and ways to\
    \ configure, let’s explore the best practices of working with Databricks repos.\
    \ We will try to understand the best practices of working with Lakehouse platform\
    \ with Databricks repos:\n\n*   Databricks workspace admin\n*   Data Science and\
    \ Engineering team\n*   Git integration\n\nIn order to implement the best practices,\
    \ we have to configure a few settings in Databricks platform as well as a few\
    \ configurations in the Git tools:\n\n![](images/Figure-8.16.jpg)\n\n**Figure\
    \ 8.16:** Databricks Best practices for Git integration\n\n#### Databricks workspace\
    \ admin\nWhen we work with Databricks, there are two types of folders available\
    \ on the platform:\n\n*   **User level folders**: User-level folders are created\
    \ automatically for all the users who access the platform during the first-time\
    \ login.\n*   **Root folders (non-user level)**:\n    *   Non-user level folders\
    \ can only be created by the workspace admin and managed by users who have permission.\n\
    \    *   The most common use case for the top-level folders is to create `dev`,\
    \ `staging`, and `production` folders, which contain repos for versioning/branching\
    \ for development, staging, and production environments, respectively:\n\n   \
    \     ![](images/Figure-9.17.jpg)\n\n        **Figure 8.17:** Databricks workspace\
    \ folders\n\n#### Data Science and Engineering team\nData Engineers or Data Scientists\
    \ can start by cloning the repo or creating a new repo using the Databricks repos.\
    \ The next step is to create a corresponding feature branch or use an existing\
    \ branch. After selecting the branch, Data Engineers or Data Scientists can make\
    \ the required changes and commit them to the branch. Once the code is ready,\
    \ they can create a pull request to review and merge the changes to Git.\n\n####\
    \ Git integration\nA recommended practice while working with Databricks for development\
    \ activity is to enable Git integration using Databricks repos. Start creating\
    \ feature branches for each new feature and sync it with the remote repository.\
    \ Create a merge/pull request to the master branch once the code changes are done:\n\
    \nThere are different ways to integrate the Databricks repos with Git tools:\n\
    \n1. **Using Databricks repos Git integration feature**\n   We can configure Databricks\
    \ repos from the Git versioning tool itself. Let’s take an example of configuring\
    \ Databricks repos from the Azure DevOps tool.\n\n   Go to your Azure DevOps organizations,\
    \ select the repo that you want to configure, and copy the link to clone the repository.\n"
  raw: "    3.  We can also create different branches for the development work, create\
    \ pull requests, and resolve conflicts after the integration with remote repos:\n\
    \n        ![](images/Figure-8.4.jpg)\n\n        **Figure 8.4:** Databricks repos\
    \ - Clone remote repo\n\n4.  If you want to move the notebook or folder in the\
    \ workspace, navigate to the notebook or folder and select `Move` from the drop-down\
    \ menu, as follows:\n\n    ![](images/Figure-8.5.jpg)\n\n    **Figure 8.5:** Databricks\
    \ repos - Move folder/notebook\n\n5.  Once the branch is created, you can create\
    \ a new notebook or a folder by clicking on the `Repos` button and clicking on\
    \ the branch where we want to create notebook or folder:\n\n    ![](images/Figure-8.6.jpg)\n\
    \n    **Figure 8.6:** Databricks repos - Clone remote repo\n\nWe can also import\
    \ the SQL or Python file in a single cell inside the Databricks notebook:\n\n\
    *   Use comment line **\\- - Databricks notebook source at the top of SQLfile**\n\
    \n*   Use comment line **\\# Databricks notebook source at the top of python file**\n\
    \nAs discussed at the beginning of the chapter, we can also work with the non-notebook\
    \ files with the integration of Databricks repos in the Databricks Lakehouse platform.\
    \ Right-click on the branch and click on the `File` option to create a new file:\n\
    \n![](images/Figure-8.7.jpg)\n\n**Figure 8.7:** Databricks repos - Create new\
    \ non-Databricks file\n\nIn order to upload an existing file, select the branch\
    \ and click on `Upload File(s)`:\n\n![](images/Figure-8.8.jpg)\n\n**Figure 8.8:**\
    \ Databricks repos - Upload new non-Databricks file\n\nWe can also programmatically\
    \ refer to the files in the repo, such as `.csv` or `.json` files from the notebook.\
    \ We can only read the non-Databricks files, but we can’t create or edit the files\
    \ in the notebook:\n\n`import pandas as pd`\n\n`df = pd.read_csv(“./sampledata.csv”)`\n\
    \n`We can also use Spark to access the files in the repo. Absolute file path of\
    \ any file in the repo is: /Workspace/Repos/<user_folder>/<repo_name>/file.`\n\
    \n`import os`\n\n`spark.read.format(“csv”).load(f”file:/Workspace/Repos/<user_folder>/<repo_name>/my_data.csv”)`\n\
    \n`To sync with the remote Git repository, we can use the git dialog`, which`\
    \ will enable you to pull changes from the remote` G`it repository and commit\
    \ changes to the remote repos. We can access the` G`it dialog from the` D`atabricks\
    \ notebook`, as follows:\n\n![](images/Figure-8.9.jpg)\n\n**Figure 8.9:** Databricks\
    \ repos - Git dialog\n\nOnce you click on the branch, the Git dialog appears,\
    \ as follows:\n\n![](images/Figure-8.10.jpg)\n\n**Figure 8.10:** Databricks repos\
    \ - Git dialog commit and push request\n\nOnce you are done with the code changes,\
    \ you can open the Git dialog and commit and push changes to the repo:\n\n![](images/Figure-8.11.jpg)\n\
    \n**Figure 8.11:** Databricks repos - Commit and push changes\n\nIf you want to\
    \ pull the source code content from the remote repo, click on the `Pull` **button**\
    \ to pull changes from the remote repo:\n\n![](images/Figure-8.12.jpg)\n\n**Figure\
    \ 8.12:** Databricks repos - Pull changes\n\nClick on `Confirm` to commit the\
    \ pull request:\n\n![](images/Figure-8.13.jpg)\n\n**Figure 8.13:** Databricks\
    \ repos - Confirm pull changes\n\nThere are various benefits of working with non-Databricks\
    \ notebook files and its integration with Databricks repos.\n\n**Advantages of\
    \ Git integration for non-Databricks notebook files are as follows**.\n\nThe following\
    \ image shows the non-Databricks files for Databricks repos:\n\n![](images/Figure-8.14.jpg)\n\
    \n**Figure 8.14:** Databricks repos - non-Databricks files\n\n*   **Code reusability**:\
    \ Existing Python and R modules can be referenced using the **import** function\
    \ in the repos as well Databricks notebooks.\n\n*   **Store environment specific\
    \ information with code**: \n\n    *   In order to create a generic code base\
    \ while working with Databricks notebook, we normally create the configuration\
    \ files to store environment-specific values as well as `requirement.txt` files\
    \ to install the dependent libraries.\n\n    *   With the introduction of non-Databricks\
    \ notebooks files, we can reduce the burden of managing the environments manually\
    \ and eliminating the manual errors.\n\n*   **Automate deployments for multiple\
    \ environments**: We can store environment specific information, such as jobs\
    \ and clusters, in configuration files, and we can use the configuration files\
    \ to automate the deployment across multiple environments.\n\nWe can also configure\
    \ and manage the permission to Databricks repos. Admin can manage the allowed\
    \ list of users to limit which remote users can commit and push the changes in\
    \ the branch.\n\nGo to `Settings`**,** select the admin **console**, choose the\
    \ `Workspace settings` tab, and `Enable repos Git URL Allow List` option.\n\n\
    Users who have permission can commit and push the changes to the Git repositories.\
    \ Default setting will be empty, and users configured by the admin can commit\
    \ the changes to the repo:\n\n![](images/Figure-8.15.jpg)\n\n**Figure 8.15:**\
    \ Databricks workspace settings - Enable repos Git URL allow list\n\nAfter understanding\
    \ different features and ways of configuring various Git tools, let’s explore\
    \ the best practices of working with Databricks repo for Git integration and implementing\
    \ the end-to-end CI/CD flow for the Databricks workloads.\n\nWe will try to understand\
    \ the best practices of working with Data Lakehouse platform with Databricks repos\
    \ feature with three different flows:\n\n*   Databricks workspace admin\n\n* \
    \  Data Science/Data Engineering team\n\n*   Git integration for Databricks developers\n\
    \nIn order to implement the recommended best practices, we have to configure a\
    \ few settings in Databricks platform itself as well as a few configurations in\
    \ the Git integrations tools:\n\n![](images/Figure-8.16.jpg)\n\n**Figure 8.16:**\
    \ Databricks – Best practices for the Git integration\n\n*   **Databricks workspace\
    \ admin**: When we work with Databricks platform, there are two types of folders\
    \ available on the platform:\n\n*   **User level folders**: User-level folders\
    \ are created automatically for all the users who access the platform during the\
    \ first-time login.\n\n*   **Root folders (non-user level folders)**: \n\n   \
    \ *   Non-user level folders can only be created by the workspace admin and managed\
    \ by users who have permission set by the workspace admin.\n\n    *   The most\
    \ common use case for the top-level folders is to create folders for `dev`, `staging`,\
    \ and `production` folders, which contain repos for versioning/branching for development,\
    \ staging, and production environments, respectively:\n\n        ![](images/Figure-9.17.jpg)\n\
    \n        **Figure 8.17:** Databricks workspace folders\n\nIn order to make sure\
    \ that repos always use the latest version, we can set up the Git automation to\
    \ call the repos API:\n\n*   **Data Science and Data Engineering team**: Data\
    \ Engineers or Data Scientists can start by cloning the repo or creating a new\
    \ repo using the Databricks repos. The next step is to create a corresponding\
    \ feature branch or use an existing branch. After selecting the branch, Data Engineers\
    \ or Data Scientists can make the required changes and commit them to the branch.\
    \ Once the code is ready, they can create a pull request to review and merge the\
    \ changes to Git.\n\n*   **Git integration**: A recommended practice while working\
    \ with Databricks for development activity is to enable Git integration using\
    \ Databricks repos. Start creating feature branches for each new feature and sync\
    \ it with the remote repository. Create a merge/pull request to the master branch\
    \ once the code changes are done:\n\n![](images/Figure-8.18.jpg)\n\n**Figure 8.18:**\
    \ Databricks Git integration\n\nThere are different ways to integrate the Databricks\
    \ repos with Git tools:\n\n1.  **Using Databricks repos Git integration feature**\n\
    \n    We can configure Databricks repos from the Git versioning tool itself. Let’s\
    \ take an example of configuring Databricks repos from the Azure DevOps tool.\n\
    \n    Go to your Azure DevOps organizations, select the repo that you want to\
    \ configure, and copy the link to clone the repository."
