    ## Feature engineering with Databricks


    Machine learning algorithms use input data to run against the machine learning
    model to generate output. Input data is mainly in the form of structured data
    with columns. Machine learning algorithms require columns in certain formats to
    use it by the machine learning model to predict the outcome and business insights.
    This process of transforming the columns in a specific format so that it can be
    used by the machine learning model is called `feature engineering`.


    With feature engineering activity, we can achieve the following:


    * Prepare and transform input data to make it compatible with the machine learning
    model

    * Optimize and improve the performance of the machine learning model


    According to the survey in `Forbes`, Data Scientists spend more than `80% of time`
    in data preparation, which is quite a significant amount of time. This fact proves
    the importance of feature engineering in the overall machine learning lifecycle
    process:


    ![](images/Figure-7.12.jpg)


    ## Figure 7.12: Data preparation


    [https://www.forbes.com/sites/gilpress/2016/03/23/data-preparation-most-time-consuming-least-enjoyable-data-science-task-survey-says/?sh=539744866f63](https://www.forbes.com/sites/gilpress/2016/03/23/data-preparation-most-time-consuming-least-enjoyable-data-science-task-survey-says/?sh=539744866f63)


    Feature engineering is one of the most important and time-consuming steps of the
    machine learning process. Data Scientists and Data Analysts spend an extensive
    amount of time to find the different combinations of the features to improve the
    overall performance of the machine learning model and generate business insights
    reports. Bigger the size of the datasets, the more time Data Scientists and Data
    Analysts have to spend on feature engineering.


    The major challenges of features engineering faced by Data Scientists are as follows:


    * Define feature in a consistent way

    * Reuse existing features

    * Maintain and track features and machine learning models

    * Manage the feature life cycle


    The following diagram shows the overall workflow of feature engineering in the
    overall machine learning process. The major steps involved are as follows:


    * Extract features from the raw data

    * Store the features


    ![](images/Figure-7.13.jpg)


    ## Figure 7.13: Feature engineering workflow


    Considering the importance of feature engineering, let’s understand the following
    techniques:


    `pandas` and `numpy`


    There are multiple ways to handle outliers:


    ![](images/Figure-7.14.jpg)


    ## Figure 7.14: Data imputation


    If we want to transform the data, we can use the following command:


    ```

    data = data.fillna(0)

    ```


    * **Handle outliers**: Records that have outliers will be removed.

    * **Replace value**: We can also use this method.

    * **Capping**: We can use the maximum and minimum values.

    * **Discretization**: Discretization is the process of converting continuous variables
    into discrete ones.


    To prepare the best input for machine learning model, we should scale the features.
    There are two commonly used ways of scaling:


    * **Normalization**: With the normalization technique, all record values will
    be scaled in the range of `0` and `1` using the `min-max approach`. It has no
    influence on the feature distribution, but it affects the outliers due to the
    lower standard deviations.

    * **Standardization**: It is a process of scaling values while considering the
    standard deviation. If the standard deviation feature differs, the range of those
    features will also differ.


    To transform the skewed distribution into the normal distribution, we use `log
    transform` method:


    ![](images/Figure-7.15.jpg)


    ## Figure 7.15: Log transform


    Log transform method is mainly used to handle data when the data becomes more
    approximate.


    * **One-hot encoding**: One-hot encoding is a type of encoding when the element
    of the certain set is represented by the index in the set where one element has
    its index set to `1` and other elements are assigned the index in the range of
    `0` to `n-1`. On the other hand, in binary encoding, we only assign two values:
    `0` and `1`.


    ![](images/Figure-7.16.jpg)


    ## Figure 7.16: One-hot encoding

