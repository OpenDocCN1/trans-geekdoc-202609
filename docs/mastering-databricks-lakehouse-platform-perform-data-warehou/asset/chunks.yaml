    \n```sql\nCREATE TABLE default.people10m OPTIONS (PATH ‘dbfs:/databricks-datasets/learning-spark-v2/people/people-10m.delta’)\n\
    ```\n\n![](img/Figure-2.36.jpg)\n\n**图 2.36:** Databricks SQL - 执行查询\n\n查询执行完成后，可以使用数据资源管理器（data\
    \ explorer）或查询编辑器配置表的访问权限。当你点击 ![](img/c02Clip-1.jpg) 按钮时，你将能够在侧边栏中看到查询历史记录。一旦表创建完成，我们就可以运行\
    \ SQL 查询并创建可视化视图。\n\n回到 Databricks SQL 主页并执行查询从表中检索数据。当查询结果显示在屏幕上时，点击 `Add Visualization`\
    \ 按钮在查询输出上创建可视化图形：\n\n![](img/Figure-2.37.jpg)\n\n**图 2.37:** Databricks SQL -\
    \ 创建可视化图形\n\n还可以保存此可视化图形并在此基础上创建仪表板，然后将其与其他用户共享。\n\nDatabricks SQL 包含以下组件：\n\n\
    * **Interface (接口)**\n    * **UI**: 用于创建仪表板、查询、SQL 端点、查询历史记录和告警的图形界面。\n    * **REST\
    \ API**: 该接口允许你自动化处理 Databricks SQL 对象上的任务。\n* **Data management (数据管理)**\n  \
    \  * **Visualization (可视化)**: 查询执行后结果的图形化表示。\n    * **Dashboard (仪表板)**: 带有描述的查询可视化。\n\
    \    * **Alert (告警)**: 查询达到阈值时的查询通知。\n* **Computation management (计算管理)**\n  \
    \  * **Query (查询)**: 用于执行的有效 SQL 语句。\n    * **SQL endpoint (SQL 端点)**: 执行 SQL\
    \ 查询的计算资源。\n    * **Query history (查询历史记录)**: 已执行 SQL 查询的历史记录。\n* **Authentication\
    \ and authorization (身份验证与授权)**\n    * **Users and groups (用户和组)**: 拥有系统访问权限的个人用户的用户组。\n\
    \    * **Personal access token (个人访问令牌)**: 用于验证 REST API 并通过 SQL 端点连接到 BI 工具的机密字符串。\n\
    \    * **Access control list (访问控制列表)**:附加到需要访问对象的主体上的权限集。\n\n**SQL endpoint**\
    \ 是在 Databricks 环境中运行 SQL 命令的计算资源。Databricks 中有两种类型的 SQL 端点：\n\n* **Classic SQL\
    \ endpoint (经典 SQL 端点)**: 经典 SQL 端点使用 AWS 账户中的计算资源。\n* **Serverless SQL endpoint\
    \ (无服务器 SQL 端点)**: 由 Databricks 管理的 SQL 端点被称为无服务器 SQL 端点，它们使用来自 Databricks 云端账户的计算资源。使用无服务器\
    \ SQL 端点管理端点简单得多，并且可以避免启动时间的延迟。\n\n在 Databricks 工作区中创建 SQL 端点需要以下权限：\n\n* Databricks\
    \ Data Science and Engineering 中的集群创建权限（Cluster creation permission）。\n* Databricks\
    \ SQL 中的管理权限（Can manage permission）。\n\n可以使用 ![](img/c02Clip-2.jpg) SQL 端点图标查看\
    \ SQL 端点，如下：\n\n![](img/Figure-2.38.jpg)\n\n**图 2.38:** Databricks SQL 端点\n\n\
    我们还可以创建和管理告警目的地以进行主动监控。当配置的告警被触发时，它会将相关数据块发送到已配置的告警目的地。只有 Databricks 管理员可以配置和管理告警。\n\
    \n默认情况下，告警通知将发送到电子邮件。通过电子邮件接收告警通知不需要额外配置。要配置告警目的地，我们可以进入 `Settings` 页面并选择 `User\
    \ Settings`：\n\n![](img/Figure-2.39.jpg)\n\n**图 2.39:** Databricks SQL 设置\n\n\
    然后，选择告警目的地：\n\n![](img/Figure-2.40.jpg)\n\n**图 2.40:** Databricks SQL 告警目的地\n\n\
    使用 Databricks SQL 端点，我们可以连接到商业智能工具，使用以下工具创建交互式可视化和仪表板：\n\n* Power BI\n* Tableau\n\
    * Looker\n* Qlik\n* TIBCO\n* MicroStrategy\n* ThoughtSpot\n* Mode\n* SQL Workbench\n\
    \nDatabricks SQL 还支持通过 REST API 管理查询和 SQL 端点。每个工作区最多可以创建 `30 REST API` 请求。如果我们的请求超过\
    \ `30 requests`，则将收到 `429 error code`。\n\nDatabricks SQL 拥有一丰富的 SQL 命令集，可执行 SQL\
    \ 查询。让我们查看几个 SQL 命令作为参考。\n\n* **DDL statements (DDL 语句)**: 以下是数据定义语言命令：\n    *\
    \ `ALTER DATABASE`\n    * `ALTER TABLE`\n    * `ALTER VIEW`\n    * `CREATE DATABASE`\n\
    \    * `CREATE FUNCTION`\n    * `CREATE TABLE`\n    * `CREATE VIEW`\n    * `DELETE\
    \ DATABASE`\n    * `DROP DATABASE`\n    * `DROP TABLE`\n    * `DROP FUNCTION`\n\
    \    * `DROP VIEW`\n* **DML statements (DML 语句)**: 以下是数据操作语言命令：\n    * `DELETE\
    \ FROM`\n    * `INSERT INTO`\n    * `INSERT OVERWRITE`\n    * `MERGE INTO`\n*\
    \ **Data retrieval statements (数据检索语句)**: 以下是数据检索命令：\n    * `Query`\n    * `Select`\n\
    \    * `Values`\n* **Delta lake statements (Delta lake 语句)**: 以下是 delta lake 命令：\n\
    \    * `CACHE SELECT`\n    * `CONVERT TO DELTA`\n    * `DESCRIBE HISTORY`\n  \
    \  * `GENERATE`\n    * `OPTIMIZE`\n    * `RESTORE`\n    * `VACUUM`\n* **Auxiliary\
    \ statements (辅助语句)**: 以下是辅助命令列表：\n    * `Analyze TABLE`\n    * `DESCRIBE FUNCTION`\n\
    \    * `DESCRIBE TABLE`\n    * `DESCRIBE DATABASE`\n    * `DESCRIBE QUERY`\n \
    \   * `SHOW DATABASES`\n    * `SHOW FUNCTIONS`\n    * `SHOW GROUPS`\n    * `SHOW\
    \ PARTITIONS`\n    * `SHOW TABLE`\n    * `SHOW TABLES`\n    * `SHOW USERS`\n \
    \   * `SHOW VIEWS`\n\n"
- fmt: '

    Databricks is all about processing data of different kinds, be it real-time or
    batch-based data. Processing data has always been a challenge and is done in multiple
    steps, such as identifying the source and data itself, connecting the source,
    validating and identifying issues with the data, cleaning and restructuring, and
    finally, enabling it to be consumed by a consumer like a stream analytics engine,
    streaming solutions, database, storage or reporting tools such as `Power BI` or
    `QlikView`.


    In the previous two chapters, we explored the foundation and basics of Databricks,
    Databricks architecture, usage of the Databricks Lakehouse platform for Data Science
    and Engineering, and Databricks SQL. In this chapter, you will learn about the
    evolution of Spark to Databricks, and you will process validated data securely
    by building an ETL pipeline in Databricks using a notebook.


    # Structure


    In this chapter, we will cover the following aspects of the Databricks Lakehouse
    platform:


    *   Introduction to Apache Spark

    *   Build ETL pipeline with Databricks for streaming and batch data

    *   Implement policies and practices to securely manage data

    *   Build data quality audit framework with Databricks


    # Objectives


    After studying this chapter, you should be able to understand Apache Spark and
    its evolution to Databricks, use notebooks in Databricks to build your ETL pipeline,
    implement data security policies, and practice with approaches and examples to
    build a data processing framework in Databricks that confronts the data quality
    audit framework.


    # Introduction to Apache Spark


    Apache Spark has evolved as an open-source unified analytics engine for large-scale
    data processing. `Spark` is not a storage solution but a multi-language engine
    as a data processing solution for executing Data Engineering, Data Science, and
    Machine Learning on single-node machines or groups of machines often called `clusters`.
    It provides an interface for distributed programming scaled up to multiple computers
    dynamically to enable implicit data parallelism with high fault tolerance.


    # History


    Back in `2009`, `Hadoop 1.0` was already out, but it was lacking a good cluster
    manager.


    A team of researchers at `Berkeley’s` `AMPLab` were working to mitigate this with
    a better cluster manager, which led to the birth of `Mesos` as a new cluster manager.


    Mesos has evolved as a distributed systems kernel built using similar principles
    as the Linux kernel, with a different level of abstraction. The kernel in Mesos
    runs on every machine and provides distributed applications like `Hadoop`, `Spark`,
    `Kafka`, and so on with APIs for resource management and scheduling across the
    entire data center either on-premises or on the cloud.


    **Source**: Apache `[https://mesos.apache.org/](https://mesos.apache.org/)`.


    The team continued to test the power of Mesos by introducing a `New Engine` built
    on top of `Scala` that can perform better than map Reduce leading to the development
    of Spark by `Matei Zaharia` at the `University of California`, `Berkeley’s` `AMPLab
    ([[https://en.wikipedia.org/wiki/AMPLab](https://en.wikipedia.org/wiki/AMPLab)))`.


    In `2013`, the project was donated to the `Apache Software Foundation,`, becoming
    a top-level Apache project. At the time of writing this book, the current version
    of `Spark is 3.2`.


    # Evolution to DataBricks


    Databricks grew out of the `AMPLab` project at the `University of California Berkeley`
    with almost the same team that was involved in making Apache Spark, an open-source
    distributed computing framework built atop `Scala`. The company was founded by:
    `Ali Ghodsi ([https://en.wikipedia.org/wiki/Ali_Ghodsi](https://en.wikipedia.org/wiki/Ali_Ghodsi))`,
    `Andy Konwinski`, `Arsalan Tavakoli-Shiraji`, `Ion Stoica ([https://en.wikipedia.org/wiki/Ion_Stoica](https://en.wikipedia.org/wiki/Ion_Stoica))`,
    `Patrick Wendell`, `Reynold Xin ([https://en.wikipedia.org/wiki/Reynold_Xin](https://en.wikipedia.org/wiki/Reynold_Xin))`,
    and `Matei Zaharia`.


    `Matei Zaharia` now the chief technologists of Databricks originalycreated Apache
    Spark while a PhD candidate at the `University of California, Berkeley,` and then
    a professor at `Stanford University ([https://en.wikipedia.org/wiki/Stanford_University](https://en.wikipedia.org/wiki/Stanford_University)))`.
    Databricks team adopted and optimized Spark to be able to run as a `SaaS` platform.


    During the years, Databricks has worked to expand the open-source project and
    simplify big data and machine learning. Databricks provides a cloud-optimized
    platform to run Spark and ML applications on Amazon Web Services and Azure.


    In `November 2017`, the company was announced as a first-party service on Microsoft
    Azure via the integration of Azure Databricks. The company develops `Delta Lake`,
    an open-source project aimed at bringing reliability to data lakes for machine
    learning and other data science use cases.


    # What happened to Apache Spark?


    Spark continues to shine and currently has more than `13830` commits by `1751`
    contributors, making it one of the most active projects in the `Apache Software
    Foundation`.


    Source: GitHub `[https://github.com/apache/Spark](https://github.com/apache/Spark)`.
    Spark is supported by major vendors and companies across the globe, including
    `Yahoo`, `Conviva`, `Amazon`, `Alibaba`, `NTT Data`, `EBay`, `Baidu`, and `Databricks`.


    Starting with Databricks, a major cloud platform has come up with a serverless
    version of Apache Spark:


    *   Data Mechanics

    *   Data Flow by Oracle

    *   Alibaba Cloud Elastic MapReduce (EMR)


    # Features of Apache Spark


    *   Spark is up to `100` times faster than `Hadoop MapReduce` for large-scale
    data processing. It can also achieve this speed through controlled partitioning;
    hence, it wins on speed.

    *   A simple programming layer provides powerful caching and disk persistence
    capabilities.

    *   It can be deployed through multiple solutions for distributed deployment and
    execution, such as `Mesos`, `Hadoop` via `YARN`, or Spark’s own cluster manager.

    *   Spark offers real-time computing and low latency because of its in-memory
    computation capabilities.

    *   Spark code can be written in multiple languages (`Java`, `Scala`, `Python`,
    and `R`) via its high-level APIs or via shell scripting in Scala and Python.

    *   It’s often associated with the term `polyglot` because of its capabilities
    to support multiple programming languages.


    # The book paraphrase and translation analogy


    ![](images/Figure-3.1.jpg)


    **Figure 3.1:** Databricks audit: Book rephrase analogy for parallel processing


    Let’s assume that `Merry` is a story freak and a voracious reader. `Merry` recently
    encountered an ancient menu script written in a different language, and now she
    wants to get that rephrased into normal English.


    She wants to take help from a few of her friends to paraphrase and translate it.
    Let’s call it a **Rephrase and Translate Project**.


    `Merry`, being agile and to save time for her friends, tries to achieve maximum
    parallelism by breaking the manuscript into multiple portions so that everyone
    is able to achieve their rephasing and translation tasks in parallel, with velocity,
    traceability, independence, and resiliency.


    `Merry` is a good planner and program leader. To ensure that everything is executed
    perfectly, she takes the lead as the leader node and creates the best fit execution
    plan broken into phases or cycles. We prefer to call this **assignment phase**.

