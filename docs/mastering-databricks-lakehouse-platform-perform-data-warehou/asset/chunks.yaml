  trans: "\n\n* `expect_all`: 当需要将不符合预期标准的记录包含在 `target` 数据集中时，我们可以使用 `expect_all`\
    \ 来指定各种数据质量约束：\n```python\n@dlt.expect_all({“valid_count”: “count > 0”, “valid_account_no”:\
    \ “current_account_no IS NOT NULL AND current_account_name IS NOT NULL”})\n```\n\
    \n* `expect_all_or_drop`: 当未通过验证的记录应该从 `target` 数据集中被丢弃时，我们可以使用 `expect_all_or_drop`\
    \ 来指定多个数据质量约束：\n```pythonpython\n@dlt.expect_all_or_drop({“valid_count”: “count\
    \ > 0”, “valid_account_no”: “current_account_no IS NOT NULL AND current_account_name\
    \ IS NOT NULL”})\n```\n\n* `expect_all_or_fail`: 当记录验证失败并停止流水线时，我们可以使用 `expect_all_or_fail`\
    \ 来指定约束：\n\n```python\n@dlt.expect_all_or_fail({“valid_count”: “count > 0”, “valid_account_number”:\
    \ “current_account_number IS NOT NULL AND current_account_name IS NOT NULL”})\n\
    ```\n\n在理解了 Delta Live Table 的基础概念后，让我们了解 Delta Live Table 流水线的流程，以便在 `development`、`test`、`acceptance`\
    \ 和 `production` 环境中测试和调试转换逻辑。\n\n我们可以创建一个通用流水线，将 Delta Live Table 的功能与 Databricks\
    \ `Repos` 结合：\n\n```json\n{\n  “name”: “Data Ingest to Development”,\n  “target”:\
    \ “customers_dev”,\n  “libraries”: [“/Repos/user@databricks.com/ingestion/etl.py”],\n\
    }\n{\n  “name”: “Data Ingest to Production”,\n  “target”: “customers_production”,\n\
    \  “libraries”: [“/Repos/production/ingestion/etl.py”],\n}\n```\n\n我们还可以使用流水线设置在流水线创建参数。参数化实现了以下用例：\n\
    \n* 更快的测试\n* 减少数据处理量\n* 重用转换逻辑\n\n例如，我们可以创建并使用流水线变量 `country` 来动态获取国家的值：\n\n**SQL**\n\
    ```sql\nCREATE LIVE TABLE countries\nAS SELECT * FROM all_countries WHERE country\
    \ = ${mypipeline.country};\n```\n\n**Python**\n```python\n@dlt.table\ndef countries():\n\
    \  start_date = spark.conf.get“mypipeline.country”)\n  return read(“sourceTable”).where(col(“date”)\
    \ > start_date)\n```\n\n许多应用还希望近实时增量摄入数据。我们可以使用 Delta Live Table 增量加载数据，这将降低数据摄入的成本，并确保数据可以无延迟访问。\n\
    \n**Python**\n```python\n@dlt.table\ndef streaming_ingest_table:\n  return dlt.read_stream“streaming_ingestion_table”).where(...)\n\
    ```\n\n**SQL**\n```sql\nCREATE INCREMENTAL LIVE TABLE streaming_ingestion_table\n\
    AS SELECT * FROM STREAM(LIVE.streaming_bronze_table)\nWHERE ...\n```\n\n如果您想刷新数据，请转到\
    \ *Pipeline Details*（流水线详情）页面并点击 *Refresh*（刷新）按钮以选择 `Full Refresh`（全刷新）选项。\n\n\
    # 使用 Python 和 SQL 创建 Delta Live Tables\n\n现在，让我们也详细探索如何使用 Python 和 SQL 创建 Delta\
    \ Live Tables：\n\n### Python\n\n1. 使用 Python 创建表。我们必须使用 `@table` 装饰器来创建表：\n![](img/Figure-5.13.jpg)\n\
    **图 5.13:** Delta Live Table - 使用 Python 创建表\n\n2. **创建视图：** 使用 `@view` 创建视图：\n\
    ![](img/Figure-5.14.jpg)\n**图 5.14:** Delta Live Table - 使用 Python 创建视图\n\n如果我们想在创建\
    \ Delta Live Table 时安装包，可以使用 `%pip install`。一旦安装了 Python 包，流水线就可以访问：\n![](img/Figure-5.15.jpg)\n\
    **图 5.15:** Delta Live Table - 安装 Python\n\n### SQL\n\n1. 创建表：\n![](img/Figure-5.16.jpg)\n\
    **图 5.16:** Delta Live Table - 使用 SQL 创建表\n\n2. 创建视图：\n![](img/Figure-5.17.jpg)\n\
    **图 5.17:** Delta Live Table - 使用 SQL 创建视图\n\nDelta Live Table 还支持 API API `create`、`delete`、`start`\
    \ 和 `view` 操作：\n\n3. 使用 API 创建流水线：\n**端点** `2.0/pipelines`\n**方法** `POST`\n当我们执行流水线时，将创建一个新的：\n\
    ```json\n{\n  “name”: “Data pipeline (SQL)”,\n  “storage”: “/Users/data”,\n```\n\
    \n4. 编辑流水线：\n**端点** `2.0/pipelines`\n**方法** `PUT`\n此端点允许我们更新现有的流水线：\n```json\n\
    {\n  “name”: “Data pipeline (SQL)”,\n  “storage”: “/Users/data”,\n  “clusters”:\
    \ [\n    {\n      “label”: “default”,\n      “autoscale”: {\n        “min_workers”:\
    \ 1,\n        “max_workers”: 5\n      }\n    }\n  ],\n  “libraries”: [\n    {\n\
    \      “notebook”: {\n        “path”: “/Users/username/DLT Notebooks”\n      }\n\
    \    }\n  ],\n  “target”: “ingestion”,\n  “continuous”: false\n}\n```\n\n5. 删除流水线：\n\
    **端点** `2.0/pipelines`\n**方法** `DELETE`\n我们可以使用此端点删除流水线：\n```bash\ncurl --request\
    \ DELETE://<databricks-instance>/api/2.0/pipelines/{pipeline}\n```\n在这里，我们需要将\
    \ `<databricks-instance>` 替换为实际的 Databricks 工作空间名称。\n\n6. 获取流水线详情：\n**端点** `2.0/pipelines`\n\
    **方法** `GET`\n我们可以通过这些端点获取流水线详情。\n端点的示例响应如下：\n```json\n{\n  “pipeline_id”: “{pipelineid}”,\n\
    \  “spec”: {\n    “id”: “{id}”,\n    “name”: “Data pipeline (SQL)”,\n    “storage”:\
    \ “/Users/data”,\n    “clusters”: [\n      {\n        “label”: “default”,\n  \
    \      “autoscale”: {\n          “min_workers”: 1,\n          “max_workers”: 5\n\
    \        }\n    }\n    ],\n    “libraries”: [\n      {\n        “notebook”: {\n\
    \          “path”: “/Users/username/DLT Notebooks”\n        }\n      }\n    ],\n\
    \    “target”: “data_ingestion”,\n    “continuous”: false\n  },\n  “state”: “IDLE”,\n\
    \  “cluster_id”: “{clusterid}”,\n  “name”: “Data Ingestion pipeline”,\n  “creator_user_name”:\
    \ “username”,\n  “latest_updates”: [\n    {\n      “update_id”: “{update_id}”,\n\
    \      “state”: “COMPLETED”,\n      “creation_time”: “2021-11-06T00:37:30.279Z”\n\
    \    },\n    {\n      “update_id”: “{update_id}”,\n      “state”: “CANCELED”,\n\
    \      “creation_time”: “2021-11-06T00:35:51.902Z”\n    },\n    {\n      “update_id”:\
    \ “{update_id}”,\n      “state”: “FAILED”,\n      “creation_time”: “2021-11-06T00:33:38.565Z”\n\
    \    }\n  ]\n}\n```\n"
- fmt: "\n## 7. Fetch update details\n\n**Endpoint name**: `2.0/pipelines/{pipeline_id}/updates/{update_id}`\n\
    \n**HTTP method**: `GET`\n\nWe can get all details about the pipeline update using\
    \ this endpoint.\n\n**Example:**\n\nSample response of the endpoint looks as follows:\n\
    \n```json\n{\n  \"update\": {\n    \"pipeline_id\": \"{pipelineid}\",\n    \"\
    update_id\": \"{updateid}\",\n    \"config\": {\n      \"id\": \"{id}\",\n   \
    \   \"name\": \"Streaming Data pipeline\",\n      \"storage\": \"/Users/username/data/streaming\"\
    ,\n      \"configuration\": {\n        \"pipelines.numStreamRetryAttempts\": \"\
    5\"\n      },\n      \"clusters\": [\n        {\n          \"label\": \"default\"\
    ,\n          \"autoscale\": {\n          \"min_workers\": 1,\n          \"max_workers\"\
    : 5\n        }\n      }\n    ],\n      \"libraries\": [\n      {\n        \"notebook\"\
    : {\n          \"path\": \"/Users/username/DLT Notebooks/Delta Live Tables Streaming\
    \ Data\"\n        }\n      }\n    ],\n    \"target\": \"streaming_data\",\n  \
    \  \"filters\": {},\n    \"email_notifications\": {},\n    \"continuous\": false,\n\
    \    \"development\": false\n  },\n  \"cause\": \"API_CALL\",\n  \"state\": \"\
    COMPLETED\",\n  \"creation_time\": 16433815050279,\n  \"full_refresh\": true\n\
    }\n}\n```\n\n# Delta Live Table components\n\nLet’s also understand the data structure\
    \ of the Delta Live Table components:\n\n* **Notebook library**:\n\n| Field name\
    \ | Type | Description |\n| --- | --- | --- |\n| Path | STRING | Absolute notebook\
    \ path |\n\n* **Pipeline library:**\n\n| Field name | Type | Description |\n|\
    \ --- | --- | --- |\n| `notebook` | Notebook library | Notebook path where the\
    \ Delta Live Table definition is created |\n\n* **Pipeline settings**:\n\n| Field\
    \ name | Type | Description |\n| --- | --- | --- |\n| `id` | STRING | Unique pipeline\
    \ identifier |\n| `name` | STRING | Pipeline name |\n| `storage` | STRING | DBFS\
    \ directory |\n| `configuration` | Map of `STRING:STRING` | Spark configuration\
    \ key-value pair to run the pipeline |\n| `clusters` | Array of pipeline clusters\
    \ | Cluster to run the pipeline |\n| `libraries` | Array of pipeline library |\
    \ Notebook containing pipeline with dependent Python packages |\n| `target` |\
    \ STRING | Database name to keep the pipeline output |\n| `development` | Boolean\
    \ | Flag to check if we need to run pipeline in development or not |\n| `continuous`\
    \ | Boolean | Flag if it is a continuous pipeline |\n\n* **Pipeline state information**:\n\
    \n| Field name | Type | Description |\n| --- | --- | --- |\n| `state` | STRING\
    \ | Pipeline status |\n| `pipeline_id` | STRING | Pipeline identifier |\n| `cluster_id`\
    \ | STRING | Unique cluster identifier |\n| `name` | STRING | Pipeline name |\n\
    | `latest_updates` | Array of `UpdateStateInfo` | Most recent update status of\
    \ pipeline |\n| `creator_user_name` | STRING | Pipeline creator name |\n\n* **Update\
    \ status information**:\n\n| Field name | Type | Description |\n| --- | --- |\
    \ --- |\n| `state` | STRING | Pipeline status |\n| `update_id` | STRING | Unique\
    \ update identifier |\n| `creation_time` | STRING | Timestamp when the update\
    \ was created |\n\n# Development workflow with Delta Live Table\n\nDuring the\
    \ traditional ETL pipeline development, we define a series of Apache Spark tasks.\
    \ However, Delta Live Table manages how the data is transformed based on the target\
    \ schema for each processing step.\n\nWe can create Delta Live Table pipelines\
    \ using the Databricks notebook. Let us take an example to create Delta Live Table\
    \ pipeline on the dataset with the following steps:\n\n* Read the JSON file into\
    \ a table\n* Read the records from the table and use delta-live table expectations\
    \ to create a new table that contains cleansed data\n* Use records from cleaned\
    \ data table to make Delta Live Table queries\n\nOnly prerequisite to start creating\
    \ Delta Live Tables using the Databricks notebook is to have a cluster creation\
    \ permission to start the pipeline. Delta Live Tables runtime creates a cluster\
    \ before it runs the pipeline and fails if the permission doesn’t exist.\n\n#\
    \ Creating Delta Live Table using Databricks notebook\n\n1. First, import the\
    \ required Python packages to create Delta Live Tables in the Databricks notebooks:\n\
    \n```python\nimport dlt\nfrom pyspark.sql.functions import *\nfrom pyspark.sql.types\
    \ import *\n```\n\n2. The next step is to ingest the raw data using the delta\
    \ table:\n\n```python\njson_path = \"/datasets/wikipedia/click\"\n```\n\n3. Once\
    \ the delta table is created, prepare the data:\n\n```python\n@dlt.table(comment=\"\
    The raw data\")\ndef clickstream():\n    return dlt.read.json(\"/datasets/wikipedia/click\"\
    )\n\n@dlt.table(comment=\"Wikipedia expectations\")\ndef prepared():\n    return\
    \ dlt.table(\"clickstream\").expect(\"valid_count\", \"click_count > 0\")\n```\n\
    \n# Create pipeline\n\n1. Go to the `Jobs` tab from the Databricks UI and click\
    \ on the `Pipelines` tab to create the pipeline:\n\n2. Now, select the notebook\
    \ that we want to use in the pipeline:\n\n3. We need to configure the storage\
    \ locations, pipeline mode (`Triggered` or `Continuous`), and minimum and maximum\
    \ worker nodes for the cluster:\n\n4. Once all the configurations are entered,\
    \ click on the `Create` button to create the pipeline. Once the pipeline is created,\
    \ the system displays the Pipeline details page:\n\n5. Click on the `Start` button\
    \ to start the pipelines. Once you click on the `Start` button, Databricks will\
    \ start the pipeline:\n\nAs soon as the pipeline starts, it performs the following\
    \ steps:\n\n* Start the cluster using the cluster configurations created by Delta\
    \ Live Table\n* Create table and ensure schema is correct for the existing tables\n\
    * Update the table with the latest data\n* Shut down the cluster\n\nOnce the pipeline\
    \ execution is done, we can view the result of Delta Live Table processing visually\
    \ in the form of graphs, schemas, and number of records processed/failed.\n\n\
    We need to start pipeline from the Delta Live Tables tab of the jobs’ user interface.\
    \ Clicking on the icon to run the pipeline will return an error.\n\n6. Click on\
    \ the dataset on the pipeline result to find the schema information about the\
    \ dataset:\n\nWe can also see the detailed pipeline results by clicking on the\
    \ `JSON` tab:\n\nOnce the pipeline executions are completed, it is also possible\
    \ to make pipeline output available for querying. To configure data to be made\
    \ available for querying, change the **target settings** to configure the database\
    \ name of the table.\n"
