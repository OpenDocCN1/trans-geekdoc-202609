- fmt: "\nFrom the cost optimization perspective, this runtime reduces the duration\
    \ of any heavy workload drastically.\n\n# Databricks light\n\nThis runtime is\
    \ only supported and used with the job cluster when you have the automated workloads,\
    \ not for interactive workloads. If our data processing requires very low computation\
    \ and cost efficiency, this runtime is recommended. Given the name `Databricks\
    \ light`, this runtime is lightweight; it does not support some of the main Databricks\
    \ features like Delta Lakes, auto scaling, various data source connectors, and\
    \ BI tools.\n\n# Databricks runtime for genomics (deprecated)\n\nIt is mostly\
    \ recommended to use when dealing with genomics and biomedical data. But unfortunately,\
    \ this runtime is deprecated and Databricks is no longer releasing newer versions\
    \ of this runtime.\n\n# Access management\n\nThe following are the concepts we\
    \ need to understand with respect to Databricks access management:\n\n## User\n\
    \nA Databricks user is a single unique personal (or) non personal account who\
    \ will be able to access the Databricks services. All Databricks users are managed\
    \ by `Databricks Admin`, who belongs to the `Databricks Admin` group:\n\n![](images/Figure-1.44.jpg)\n\
    \n**Figure 1.44:** Databricks user settings\n\n## Group\n\nA `group` is used to\
    \ assign the same privileges to multiple users. Users are given membership to\
    \ become a part of this group, which has certain privileges (to access data objects\
    \ and Databricks components) decided by the admin.\n\n## Access Control Lists\
    \ (ACLs)\n\n`Access Control Lists` are often referred to as `ACLs`. This ACL is\
    \ used for providing permission to access Databricks components and its entities\
    \ (`clusters`, `notebooks`, `folders`, `data tables`, and `jobs`, and so on).\n\
    \nUsually, all admins can manage these ACLs, although admins can upgrade permissions\
    \ for certain users to manage ACLs.\n\n## Conclusion\n\n`Azure Data Lake Storage\
    \ Gen2` is designed to create enterprise level Data Lake solutions for big data\
    \ and analytics applications. Data Lake stores can efficiently manage large amounts\
    \ of data. Data Lake Storage is a cost-effective solution since it is built on\
    \ the top of low-cost blob storage. Data Lake Storage uses an ABFS driver that\
    \ allows data access and management similar to Hadoop and optimized for big data\
    \ analytics. It uses the `dfs.core.windows.net` endpoint. Data Lake Gen2 is more\
    \ secure with the support of ACL and POSIX permissions.\n\n# Multiple choice questions\n\
    \n1. Which cloud platforms support Databricks currently?\n    1. AWS, GCP, Microsoft\
    \ Azure\n    2. AWS, IBM Cloud, Alibaba Cloud\n    3. GCP, IBM Cloud, Microsoft\
    \ Azure\n    4. AWS, Alibaba Cloud, Microsoft Azure\n\n2. What are different ways\
    \ to create a Databricks cluster?\n    1. Databricks UI\n    2. Databricks CLI\n\
    \    3. Databricks API\n    4. All of the above\n\n3. Which of the following statements\
    \ is not valid with regard to the Databricks platform?\n    1. The Databricks\
    \ platform supports only the Python programming language.\n    2. The Databricks\
    \ platform is used to perform ETL on data.\n    3. Apache Spark original creators\
    \ have built the Databricks platform.\n    4. The Databricks platform supports\
    \ data visualization.\n\n4. What is the number of runtimes currently available\
    \ on the Databricks platform?\n    1. 2\n    2. 3\n    3. 4\n    4. 5\n\n5. What\
    \ are the different types of clusters supported by Databricks platform?\n    1.\
    \ All-purpose cluster\n    2. Job cluster\n    3. All of the above\n    4. None\
    \ of the above\n\n# Answers\n\n1. **a**\n2. **d**\n3. **a**\n4. **d**\n5. **c**\n\
    \n# CHAPTER 2\n\n## Management of Databricks Platform\n\nDatabricks Lakehouse\
    \ platform is a single and all-in-one platform to create your data analytics and\
    \ AI solution. The all-in-one integrated Databricks Lakehouse platform simplifies\
    \ the data architecture by removing the data silos that mainly separates data\
    \ engineering teams, data science teams, and analytics teams. Databricks Lakehouse\
    \ platform is built using the world’s best open-source technologies.\n\nIn the\
    \ previous chapter, we explored the foundation of Databricks architecture, the\
    \ usage of Databricks Lakehouse platform for Data Science and Engineering, and\
    \ Databricks SQL. In this chapter, you will learn about the Databricks Lakehouse\
    \ platform.\n\n## Structure\n\nIn this chapter, we will learn the following aspects\
    \ of the Databricks Lakehouse platform:\n* Databricks cluster basics\n* Platform\
    \ architecture, security, and data protection\n* Databricks data access management\n\
    * Databricks cluster usage management\n* Databricks SQL Analytics Administration\n\
    \n## Objectives\n\nAfter studying this chapter, you should be able to configure,\
    \ create, and deploy Databricks. We will also explore cluster/data access management\
    \ and security.\n\n## Databricks cluster basics\n\nDatabricks cluster is a collection\
    \ of virtual machines where we run commands.\n\nThere are two ways to execute\
    \ any solution:\n* **Databricks notebook**: We can create and combine inside notebooks.\n\
    * **Databricks jobs**: We can schedule them.\n\nDatalake platform consists of\
    \ two types of clusters:\n* **All-purpose cluster**: We can use all-purpose cluster\
    \ when we want interactive notebooks. All-purpose clusters can be created using\
    \ CLI, UI, or REST API. All-purpose clusters can be shared by multiple users.\n\
    * **Job cluster**: We can use job cluster to run scheduled and fully automated\
    \ jobs. Job clusters will be created when the job starts and will be terminated\
    \ once the job is complete.\n\n## Cluster resources\n\nExplore cluster resources\
    \ of Lakehouse platform:\n\n### Clusters\n\nNow, let’s see how to create a cluster\
    \ in Databricks:\n\n1. Create Databricks cluster using UI. Go to Databricks home\
    \ page and select `Compute`, as follows:\n   ![](images/Figure-2.1.jpg)\n   **Figure\
    \ 2.1:** Databricks home page\n\n2. Now, click on the `Create Cluster` button\
    \ to create a new cluster:\n   ![](images/Figure-2.2.jpg)\n   **Figure 2.2:**\
    \ Databricks - create cluster\n\n3. After you click on the `Create Cluster` button,\
    \ a screen will appear where you have to provide the cluster configuration details:\n\
    \   * `Cluster Name`: Provide cluster name.\n   * `Cluster Mode`: `Standard`,\
    \ `Single Node`, or `High Concurrency Cluster`.\n   * `Databricks Runtime Version`:\
    \ Choose required version from standard/ML Databricks runtime.\n   * `Enable autoscaling`:\
    \ Cluster will automatically scale between minimum and maximum nodes.\n   * `Terminate\
    \ after inactivity`: Time in minutes to terminate cluster after inactivity.\n\
    \   * `Worker Type`: Choose worker type based on the workload.\n\nDatabricks runtime\
    \ is a set of components that runs on the cluster. Databricks runtimes include\
    \ Apache Spark and add components that improve usability, performance, and security.\n\
    \n   ![](images/Figure-2.3.jpg)\n   **Figure 2.3:** Data Bricks - cluster configuration\n\
    \n4. After entering the cluster configuration details, click on the `Create Cluster`\
    \ button to create a cluster in Databricks.\n\n   Now, let’s see how to edit,\
    \ delete, display, start, terminate, and monitor Databricks clusters.\n"
