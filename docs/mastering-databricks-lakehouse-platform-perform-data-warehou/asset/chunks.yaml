    \ “GENERAL_PURPOSE_SSD”,`\n\n` “ebs_volume_count”: 1,`\n\n`“ebs_volume_size”:\
    \ 100`\n\n`},`\n\n` “node_type_id”: “r4.2xlarge”,`\n\n` “ssh_public_keys”: [],`\n\
    \n` “custom_tags”: {`\n\n` “ResourceClass”: “Serverless”,`\n\n` “team”: “new-project-team”`\n\
    \n`},`\n\n`“spark_env_vars”: {`\n\n`“PYSPARK_PYTHON”: “/databricks/python3/bin/python3”`\n\
    \n`},`\n\n` “autotermination_minutes”: 60,`\n\n`“enable_elastic_disk”: “true”,`\n\
    \n`“init_scripts”: []`\n\n`}`\n\nConfiguring access control in Databricks and\
    \ data access and granular access management to data is the first key to creating\
    \ a data governance solution. But the end-to-end solution requires audit access\
    \ to the data and creating the monitoring capabilities. Databricks Lakehouse platform\
    \ has a rich set of audit events to log the activities performed by the Databricks\
    \ users:\n\n![](images/Figure-10.14.jpg)\n\n**Figure 10.14:** Databricks audit\
    \ logging\n\n**Reference: [https://databricks.com/blog/2020/03/25/trust-but-verify-with-databricks.html](https://databricks.com/blog/2020/03/25/trust-but-verify-with-databricks.html)**\n\
    \nIn order to configure audit logging, we have to configure the right access policy\
    \ so that Databricks can deliver audit logs to an S3 bucket. Audit logs are delivered\
    \ periodically to the S3 bucket and within 72 hours of day close.\n\nWe can configure\
    \ many types of audit events based on our requirements to track the complete status\
    \ of audit events, parameters, and audit log schemes.\n\n# [Data governance](#toc.xhtml#s140a)\n\
    \nDatabricks security and trust center provides information about how to set up\
    \ security at every layer of the Databricks Lakehouse platform. It enables enterprise\
    \ organizations to meet the regulatory requirements. This information consists\
    \ of the following information:\n\n*   List of security and governance features\
    \ into the platform\n\n*   Compliance standards required by the platform for each\
    \ cloud provider\n\n*   Package that helps evaluate how Databricks platform is\
    \ compatible with the for the compliance requirements\n\n*   Databricks privacy\
    \ guidelines\n\n    ![](images/Figure-10.15.jpg)\n\n    **Figure 10.15:** Data\
    \ governance framework"
