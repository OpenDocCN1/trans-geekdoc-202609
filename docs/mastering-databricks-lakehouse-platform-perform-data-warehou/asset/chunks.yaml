    \ Live tables\n\nAs per Databricks official documentation:\n\n*Delta Live Tables\
    \ (DLT) is the first ETL framework that uses a simple declarative approach to\
    \ building reliable data pipelines and automatically managing your infrastructure\
    \ at scale so data analysts and engineers can spend less time on tooling and focus\
