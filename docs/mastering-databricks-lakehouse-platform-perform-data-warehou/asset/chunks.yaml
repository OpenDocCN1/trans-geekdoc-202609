    **Code 3.18**: Databricks audit: Filtration via query condition


    To produce the result as follows:


    ![](images/Figure-3.9.jpg)


    **Figure 3.9:** Databricks Audit: Exploring query output results


    Every statement that you ask Databricks and underlying Spark to execute gets submitted
    as a job to Spark Engine running at the core of Databricks. To navigate to the
    status and further details on the job submitted, you can click on the highlighted
    options on your notebook:


    ![](images/Figure-3.10.jpg)


    **Figure 3.10**


    After clicking on the `View` option, you will get a popup with multiple options
    to explore:


    ![](images/Figure-3.11.jpg)


    **Figure 3.11:** Databricks audit: Jobs low-level


    Click on the `Jobs` **option**.


    Once you click on it, you will be able to navigate to the event timeline and DAG
    visualizer.


    An **event timeline** is a quick option that can be used to analyze the events
    and activities that happened around executing the submitted job.


    Now, let’s understand the DAG scheduling and the interface that Databricks give
    us for analysis, optimization, and understanding purposes:


    ![](images/Figure-3.12.jpg)


    **Figure 3.12:** Databricks audit: DAG flow sample


    ![](images/Figure-3.13.jpg)


    **Figure 3.13:** Databricks audit: Understanding DAG from Databricks low-level
    job interface


    The blocks in *blue* are *DAG steps*; once you click on this, it will take you
    to different stages that the master schedules for its workers:


