  trans: "\n\n一旦构建流水线完成且产物准备就绪，发布流水线将触发，并将 Databricks 产物部署到所有环境，其之间包含自动化测试阶段：\n\n\
    ![](img/Figure-8.24.jpg)\n\n**图 8.24:** Jenkins 中的 Databricks - 构建流水线\n\n根据部署工具的选择，我们可以在\
    \ Azure DevOps 或 Jenkins 中创建发布流水线。我们将以 Azure DevOps 工具为例创建一个发布流水线，并理解如何使用它将产物部署到所有环境。\n\
    \n*   在 Azure DevOps 中创建一个发布流水线，为每个环境设置一个阶段，包括测试阶段：\n\n    ![](img/Figure-8.25.jpg)\n\
    \n    **图 8.25:** Azure DevOps - 创建发布流水线\n\n### 为流水线阶段添加部署任务\n\n一旦创建了发布流水线，我们就必须向流水线添加任务，以执行\
    \ Databricks 产物向相应环境的实际部署。\n\n1.  添加 `Use Python Version` 任务，以确保我们在流水线代理程序上安装的\
    \ Python 版本与 Databricks 笔记本的 Python 版本一致：\n\n    ![](img/Figure-8.26.jpg)\n\n\
    \    **图 8.26:** Azure DevOps - 安装 Python 版本\n\n2.  添加 `Extract files` 任务，从 ZIP\
    \ 产物文件中提取 Databricks 笔记本及相关文件。我们必须为 `*zip` 提供 `archive file pattern` 和目标文件夹名称：\n\
    \n    ![](img/Figure-8.27.jpg)\n\n    **图 8.27:** Azure DevOps 提取任务\n\n3.  添加\
    \ `Azure PowerShell` 任务以从密钥库（key vault）获取访问器令牌（bearer token）：\n\n    ![](img/Figure-8.28.jpg)\n\
    \n    **图 8.28:** Azure DevOps 提取任务\n\n    PowerShell 脚本：\n\n    ```\n    $BearerToken=\
    \ (Get-AzKeyVaultSecret -VaultName “$(KeyVaultName)” -Name “$(adb_token_secret_name)”).SecretValueText\n\
    \    write-host “##vso[task.setvariable variable=BearerToken]$BearerToken”\n \
    \   ```\n\n    在这里，我们必须使用流水线变量提供以下细节或在运行时初始化这些变量：\n\n    `KeyVaultName` = Azure\
    \ Key Vault 的名称\n\n    `adb_token_secret_name` = Databricks 令牌的密钥库密钥名称\n\n4. \
    \ 添加 `Databricks Deploy Notebooks` 任务来部署 Databricks 笔记本。我们必须提供 `Azure region name`\
    \ 和 `Databricks` 访问器令牌。此外，我们必须提供 `source file path`（产物中 Databricks 笔记本所在的路径）和\
    \ `target file path`（即 Azure Databricks 工作区目录结构中的目标路径）：\n\n    ![](img/Figure-8.29.jpg)\n\
    \n    **图 8.29:** Azure Databricks: 部署 Databricks 笔记本\n\n### 将配置文件和库部署到 Databricks\
    \ DBFS\n\n添加任务 `Databricks files to DBFS` 以将库（libraries）和配置文件部署到 Databricks DBFS。除了\
    \ `Azure region and Databricks token` 之外，我们还必须提供包含 Python 库的路径 `local root folder`\
    \ 以及 `target folder`（即我们希望在 DBFS 中存放库和配置文件的路径）：\n\n    ![](img/Figure-8.30.jpg)\n\
    \n    **图 8.30:** Azure Databricks: 部署库/配置文件\n\n*   最后，添加 `Python script` 任务（这是一段自定义\
    \ Python 代码），将 Python `wheel/egg` 文件安装到 Databricks 集群中：\n\n    ![](img/Figure-8.31.jpg)\n\
    \n    **图 8.31:** Azure Databricks: 部署库/配置文件\n\n因此，我们创建了一个 Azure DevOps 发布流水线，只需点击按钮即可将所有\
    \ Databricks 产物部署到所有环境。每个环境阶段的整个 Azure DevOps CD 流水线任务所示：\n\n    ![](img/Figure-8.32.jpg)\n\
    \n    **图 8.32:** Azure Databricks 部署\n\n一旦 Databricks 产物部署到开发环境，将触发带有 `integration\
    \ tests`（集成测试）的阶段。使用 Azure Databricks 笔记本的集成步骤可以通过以下方式实现：\n\n1.  **配置测试环境**\n\n\
    \    创建一个命令行任务，为笔记本执行日志创建目录。\n\n2.  **运行 Databricks 笔记本**\n\n    添加 `Python script`\
    \ 任务，该任务将运行用于集成测试的测试用例。我们必须为 Databricks 笔记本提供路径和相关参数。\n\n3.  **生成测试结果**\n\n  \
    \  我们再次在发布流水线中添加 Python `script` 任务，生成相关的测试结果。\n\n如果测试结果执行成功，发布流水线将继续部署，并使用我们之前为开发环境创建的任务组继续部署到更高级的环境。\n\
    \n总的来说，Azure DevOps CD 流水线（包括所有阶段和集成测试）可视化如下：\n\n    ![](img/Figure-8.33.jpg)\n\
    \n    **图 8.33:** Azure Databricks 部署流水线\n\n建议在与 Azure Databricks 工作时使用密钥范围（secret\
    \ scope）来存储和管理密钥。我们可以在 Azure Databricks 创建两种类型的密钥范围：\n\n1.  **Azure Key Vault\
    \ 支持的密钥范围**\n\n    我们可以使用 Azure Key Vault 支持的密钥范围，通过密钥库名称引用存储在密钥库中的密钥。我们可以使用此\
    \ URL 创建 Azure Key Vault 支持的密钥范围：`https://<databricks-instance>#secrets/createScope`:\n\
    \n    ![](img/Figure-8.34.jpg)\n\n    **图 8.34:** Azure Databricks 部署\n\n    在这里，我们必须填写密钥库的\
    \ DNS 名称和资源 ID。你可以通过从门户中选择 Key Vault 资源来找到它：\n\n    ![](img/Figure-8.35.jpg)\n\
    \n    **图 8.35:** Azure Databricks 部署\n\n    Azure Key Vault 支持的密钥范围也可以使用 Databricks\
    \ CLI 创建。你可以使用此 Databricks 命令：\n\n    ```\n    databricks secrets create-scope\
    \ --scope <scope-name> --backend-type AZURE_KEYVAULT --resource-id <azure-keyvault-resource-id>\
    \ --dns-name <azure-keyvault-dns-name>\n    ```\n\n2.  **Databricks 支持的密钥范围**\n\
    \n    Databricks 支持的密钥范围以加密格式存储在 Azure Databricks 后端的数据库中。Databricks 密钥范围名称在 Databricks\
    \ 工作区名称内应是唯一的。\n\n    可以使用以下 Databricks 命令使用 Databricks 支持的密钥范围：\n\n    ```\n\
    \    databricks secrets create-scope --scope <scope-name>\n    ```\n\n因此，无论使用何种工具，团队在使用\
    \ Databricks Lakehouse 平台开发期间，都可以遵循经典的 Git 工作流或 GitHub 工作流：\n\n*   开发者可以使用功能分支（feature\
    \ branch）开发独立功能。\n*   一旦本地开发完成，我们将更改提交到主分支（master branch），这将触发 CI/CD 流水线。\n* \
    \  CI/CD 流水线将触发 Databricks repos API 将项目更新到最新版本。\n*   CI 流水线下载产物并执行集成测试。\n*  \
    \ 一旦测试成功，发布流水线会将笔记本和产物部署到更高级的环境。\n\n"
- fmt: "\n1. Install `cookiecutter`:\n\n```bash\npip install cookiecutter\ncookiecutter\
    \ https://github.com/databrickslabs/cicd-templates.git\n```\n\n2. Provide the\
    \ Databricks token and workspace URL to GitHub secrets and commit the pipeline\
    \ to the GitHub repo.\n\nOnce we configure the preceding steps, Databricks labs\
    \ CI/CD pipeline will automatically run the tests for all the Databricks notebooks\
    \ whenever we commit the code to the repo. Once the code development and testing\
    \ are done, we can create a GitHub release that will use templates to automatically\
    \ package and deploy the pipeline as a Databricks job.\n\nAs shown in the following\
    \ image, Data Scientists and Data Engineers can use Databricks labs CI/CD templates\
    \ for the testing and deployment of the notebooks. It provides end users with\
    \ the reusable and generic data project templates to start the development for\
    \ new use cases.\n\nAt the end of the development life cycle, the whole Databricks\
    \ project can be deployed to production by creating the releases in GitHub:\n\n\
    ![](images/Figure-8.36.jpg)\n\n**Figure 8.36:** Databricks deployment lifecycle\n\
    \n# Conclusion\n\nIn this chapter, we explored how to use the Databricks repos\
    \ feature to integrate CI/CD pipelines. It will make sure that we are always using\
    \ the most recent version of the Databricks code to avoid any discrepancy.\n\n\
    After exploring the Databricks repos for Git integration, we also learned how\
    \ to create CI/CD pipeline to automated testing and code deployment to development,\
    \ test, acceptance, and production environments.\n\nFinally, we explored integrating\
    \ Databricks with various version controlling tools like Azure DevOps, GitLab,\
    \ Bitbucket, and GitHub.\n\nIn the next chapter, we will look at visualizations\
    \ with the Databricks platform and how various third-party BI tools can be easily\
    \ integrated with Databricks Lakehouse platform.\n\n# Multiple Choice Questions\n\
    \n1. Can we integrate Azure Databricks with Azure Devops?\n   1. Yes\n   2. No\n\
    \n2. Can we automate Databricks notebook deployment using Azure Devops CI/CD?\n\
    \   1. Yes\n   2. No\n\n3. How can we create secret scope in Databricks?\n   1.\
    \ Key vault backed secret scope\n   2. Databricks backed secret scope\n   3. Both\n\
    \n4. Can we create non-Databricks files using the Git integration?\n   1. Yes\n\
    \   2. No\n\n5. Can we create Azure Key Vault backed secret scope using Databricks\
    \ CLI?\n   1. Yes\n   2. No\n\n# Answers\n\n1. a\n2. a\n3. c\n4. a\n5. a\n\n#\
    \ CHAPTER 9\n\n# Visualization with Databricks\n\nDatabricks platform has native\
    \ support of various BI tools like `Power BI`, `Tableau`, `Looker`, `Qlik`, `TIBCO`,\
    \ `Microstrategy`, `ThoughtSpot`, `Mode`, and `SQL` workbench. We can create interactive\
    \ visualizations using the data present in the Databricks platform with these\
    \ BI tools.\n\nIn the previous chapter, we explored enabling continuous integration\
    \ and delivery with Databricks platform. In this chapter, you will learn about\
    \ visualizations with Databricks Lakehouse platform with various visualization\
    \ tools, like Power BI and Tableau.\n\n# Structure\n\nIn this chapter, you will\
    \ learn the following aspects of visualizations with Databricks Lakehouse Platform:\n\
    \n* Databricks SQL Analytics\n* Databricks as a data source with Tableau\n* Databricks\
    \ direct query with Power BI\n* Databricks interactive analysis with Qlik\n\n\
    # Objectives\n\nAfter studying this chapter, you should be able to understand\
    \ the basics of Databricks SQL Analytics. You will also learn about how to create\
    \ visualizations using Databricks with BI tools.\n\n# Databricks SQL Analytics\n\
    \nDatabricks also has native support of SQL language, which allows developers\
    \ to develop SQL applications using the Databricks SQL UI and BI tools.\n\nLet’s\
    \ look at the differences between Databricks SQL UI and BI tools:\n\n| Databricks\
    \ SQL UI | BI tools |\n| --- | --- |\n| Ad hoc analysis of Data Lake using SQL\
    \ commands | No code interface for data analysis |\n| Create dashboards to corroborate\
    \ business requirements | Create enterprise-wide reports and dashboards |\n| Monitor\
    \ dashboards with alerts | Create interrelated dashboards with filtering and advanced\
    \ customizations |\n\n**Table 9.1:** Comparison Databricks SQL and BI tools\n\n\
    We can use the Data Explorer to access databases and tables in Databricks. Using\
    \ Data Explorer, we can view schema details and see sample data and table details.\
    \ Administrators can also change the object-level permission to manage data access\
    \ in Databricks.\n\nWe can access databases from the Data Explorer using these\
    \ steps:\n\n1. Click on the ![](images/c09Clip-1.jpg)icon from the Databricks\
    \ UI. which will display a list of databases:\n\n   ![](images/Figure-9.1.jpg)\n\
    \n   **Figure 9.1:** Databricks home page\n\n2. We can also view table schema\
    \ with sample data using the Data Explorer. Go to the `display` Databases` page,\
    \ as highlighted in the preceding screenshot, and select the table that will display\
    \ table schema with its properties and a preview of the sample data:\n\n   ![](images/Figure-9.2.jpg)\n\
    \n   **Figure 9.2:** Databricks - access database and tables\n\n3. In order to\
    \ create visualizations while working with Databricks SQL, you can first open\
    \ `SQL query editor` using the Databricks SQL:\n\n   ![](images/Figure-9.3.jpg)\n\
    \n   **Figure 9.3:** Databricks - SQL query editor\n\n4. Now, open `SQL query\
    \ editor` and execute the SQL query highlighted in the following screenshot; it\
    \ will display the result in a tabular format:\n\n   ![](images/Figure-9.4.jpg)\n\
    \n   **Figure 9.4:** Databricks - execute SQL query\n\n5. Now, click on the `Add\
    \ Visualization` button to create a visualization. This will open up the `Visualization\
    \ Editor` page, which can be configured according to our requirements:\n\n   ![](images/Figure-9.5.jpg)\n\
    \n   **Figure 9.5:** Databricks SQL - visualization\n\n   We can configure the\
    \ following properties in the visualization editor:\n\n   * `Visualization Type`:\
    \ `Chart`, `Cohort`, `Counter`, `Details View`, `Funnel`, `Map`\n   * `Visualization\
    \ Name`: Name of the visualization\n   * `General`: `Chart type`, `X/Y Column`,\
    \ `Group By`, `Error Column`\n   * `X-Axis`: Set scale\n   * `Y-Axis`: Set left/right\
    \ Y-axis\n   * `Series`: Display the data\n   * `Color`: Display the data\n  \
    \ * `Data Labels`: Show labels with different data/time formats\n\n6. Once you\
    \ click on the `Save` button, visualizations will be saved with the visualization\
    \ name.\n\n7. We can also add the visualization to the dashboard. Click on the\
    \ three vertical dots, as highlighted in the following screenshot, and select\
    \ `Add to Dashboard`:\n\n   ![](images/Figure-9.6.jpg)\n\n   **Figure 9.6:** Add\
    \ Databricks SQL Visualization to Dashboard\n\n8. Write the dashboard name and\
    \ click on `OK`; it will add visualization to a specific dashboard:\n\n   ![](images/Figure-9.7.jpg)\n\
    \n   **Figure 9.7:** Databricks SQL dashboard\n\n   You can also download the\
    \ chart visualization as an image file.\n\n   There are multiple types of visualizations\
    \ available in Databricks SQL:\n\n   * Boxplot\n   * Charts: bar, area, pie\n\
    \   * Cohort\n   * Counter\n   * Funnel\n   * Map\n   * Pivot table\n   * Sankey\n\
    \   * Sunburst\n   * Word cloud\n\n   Databricks SQL visualizations that use X\
    \ and Y axes are known as charts. We can create multiple types of charts in Databricks\
    \ SQL.\n\nWe can combine Databricks visualizations with text boxes to provide\
    \ explanation about the data. To view the list of available dashboards, click\
    \ on dashboards in the left pane, as highlighted in the following screenshot:\n\
    \n   ![](images/Figure-9.8.jpg)\n\n   **Figure 9.8:** Databricks dashboards -\
    \ display list of dashboards\n\n9. Click on the `Create Dashboard` button to create\
    \ a new dashboard:\n"
