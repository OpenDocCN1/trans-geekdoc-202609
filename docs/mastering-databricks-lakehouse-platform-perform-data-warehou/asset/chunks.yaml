  trans: "\n\n**完整模式（Complete mode）**：在此模式下，`Spark` 将输出目前为止处理的所有行：\n\n![](img/Figure-6.4.jpg)\n\
    \n**图 6.4：** 流式输出模式\n\n让我们以使用 **Spark streaming** 构建流式应用为例：\n\n1. 首先，列出样本数据集路径下的所有文件：`/databricks-datasets/structured-streaming/events/`。\n\
    \n   样本集中大约有 **50** 个 JSON 文件。每个 JSON 文件包含键值对形式的记录。\n\n   **示例如下：**\n\n   `{\"\
    time”:1469501107,”action”:”Open”}`\n   `{\"time”:1469501147,”action”:”Open”}`\n\
    \   `{\"time”:1469501202,”action”:”Open”}`\n   `{\"time”:1469501219,”action”:”Open”}`\n\
    \n   ![](img/Figure-6.5.jpg)\n\n   **图 6.5：** 样本数据集流式数据\n\n2. 尝试数据的下一步是交互式查询输入数据。为了做到这一点，我们首先需要对文件创建\
    \ `DataFrame` 并为其指定一个表名。\n\n   参考代码如下：\n\n   ```python\n   from pyspark.sql.types\
    \ import *\n   inputPath = \"/databricks-datasets/structured-streaming/events/\"\
    \n   # 创建 schema\n   jsonSchema = StructType([StructField(\"time\", TimestampType(),\
    \ True), StructField(\"action\", StringType(), True)])\n   # 创建 data frame\n \
    \  InputDF = (spark.read.schema(jsonSchema).json(inputPath))\n   display(InputDF)\n\
    \   ```\n\n   ![](img/Figure-6.6.jpg)\n\n   **图 6.6：** DataFrame 输出\n\n3. 现在，我们可以计算\
    \ `1 hour` 窗口内 `open` 和 `close` 动作的数量：\n\n   ```python\n   from pyspark.sql.functions\
    \ import *\n   # 创建 DataFrame 并缓存\n   CountsDF=(InputDF.groupBy(InputDF.action,window(InputDF.time,”1\
    \ hour”)).count())\n   CountsDF.cache()\n   # 注册 DataFrame\n   CountsDF.createOrReplaceTempView(\"\
    Counts\")\n   ```\n\n4. 我们现在可以使用 SQL 查询该表：\n\n   ![](img/Figure-6.7.jpg)\n\n \
    \  **图 6.7：** 所有小时的总计数\n\n5. 在交互式地理解数据后，让我们将其转换为流式查询，它将在数据到达时持续更新数据。我们需要通过一次读取一个文件来模拟数据流，创建流式示例：\n\
    \n   ```python\n   from pyspark.sql.functions import *\n   streamingInputDF=(spark.readStream.schema(jsonSchema).option“maxFilesPerTrigger”,\
    \ 1).json(inputPath))\n   streamingCountsDF=(streamingInputDF.groupBy(streamingInputDF.action,\
    \ window(streamingInputDF.time, “1 hour”)).count())\n   streamingCountsDF.isStreaming\n\
    \   Out[3]: True\n   ```\n\n   从前面的代码中，我们可以看到 `DataFrame` `streamingCountsDF`\
    \ 是一个流 `DataFrame`。我们现在可以通过定义输出（sink）来开始流式计算：\n\n   ![](img/Figure-6.8.jpg)\n\n\
    \   **图 6.8：** 流式 DataFrame\n\n6. 在这里，**查询**会持续拾取文件并更新 `window` 计数：\n\n   ![](img/Figure-6.9.jpg)\n\
    \n   **图 6.9：** 流式 DataFrame 可视化面板\n\n**事件时间（Event time）**是嵌入在数据本身的时间。许多应用程序希望以近*实时*运行。例如，如果我们想获取\
    \ IOT 设备每分钟生成的事件数量，我们希望使用数据生成的时间，而不是 `Spark` 接收数据的时间。提供端到端精确一次语义（end to end exactly\
    \ one semantics）是结构化流处理的主要目标之一：\n\n   ![](img/Figure-6.10.jpg)\n\n   **图 6.10：**\
    \ 窗口分组聚合\n\n使用滑动事件窗口进行**聚合（Aggregation）**在结构化流处理中是非常简单的，它与分组聚合非常相似。**分组聚合（Grouped\
    \ aggregations）**聚合为每个唯一值维护的值。在**基于窗口的聚合（window-based aggregations）**中，为每个窗口维护聚合值。\n\
    \nDatabricks 中的结构化流处理对许多流式数据源和输出具有内置支持。让我们以结合 Amazon Kinesis 的 Delta Lake 结构化流为例。在这里，我们将使用\
    \ `kinesis` 作为流式源，结合 `Delta Lake` 和 `apache structured streaming`。\n\n**Amazon\
    \ Kinesis** 能够轻松地收集、处理和分析实时流式数据，使我们获得及时的洞察并对新信息做出快速反应。Amazon Kinesis 提供了关键能力，可以以成本效益的方式处理任何规模的流式数据，并灵活选择最适合您应用程序云的工具：\n\
    \n   ![](img/Figure-6.11.jpg)\n\n   **图 6.11：** Amazon Kinesis\n\n**Amazon Kinesis**\
    \ 也称为 **KDS**。它是 AWS 上流数据服务的流行选择，因为它提供了易用性和无服务器化设置。它具有名为**分片（shards）**的独立吞吐量单元。\n\
    \n一旦我们在 `KDS` 中收集了数据，就可以将结构化流用于**分析（Analytics）**、**点击流（Clickstream）**和**实时洞察（Real\
    \ Time Insights）**等应用。在深入之前，让我们来看参考架构。为了理解该用例，我们首先了解 `kinesis` 作为流式源。关键考虑因素和最佳实践如下：\n\
    \n   ![](img/Figure-6.12.jpg)\n\n   **图 6.12：** Kinesis fetcher\n\n*   **Databricks\
    \ runtime**：Databricks 建议使用 **Databricks runtime 6.5** 或更高版本。\n*   **优化预取**：kinesis\
    \ 源在后台线程中执行 Spark 作业以预取数据并将其缓存在 Spark 执行器的内存中。`shardsPerTask` 配置参数的默认设置为 `5`。这可能是一个很好的起点。\n\
    *   **减少速率限制错误**：每当从 `kinesis` 遇到速率限制错误时，读取的数据量可以减少*一半*，并在日志中记录事件。在 **Databricks\
    \ Runtime 6.4** 及以下版本中，持续的 kinesis 速率限制可能导致流以 *1 kb/sec* 的速度消耗。\n*   **启用 S3 VPC\
    \ 端点**：`Databricks` 的建议是启用 S3 VPC 端点，以确保所有 S3 流量都在 AWS 网络上路由：\n\n    ![](img/Figure-6.14.jpg)\n\
    \n    **图 6.14：** 参考架构：使用 KDS 的结构化流\n\n*   **监控流式应用**：Databricks 建议使用 Spark 的\
    \ **Streaming Query Listener** 实现来监控流式应用。可观测指标是**任意聚合函数**，这些函数可以定义在 `DataFrame`\
    \ 上。\n\n监听器取决于执行模式：\n\n*   **批处理模式（Batch mode）**：`QueryExecutionListener` 在查询完成时调用。使用\
    \ `QueryExecution.observedMetrics map` 访问指标：\n*   **流式处理（Streaming）**：`StreamingQueryListener`\
    \ 在流式查询完成一个*代（epoch）*时调用。Databricks 不支持持续执行流式处理。\n\n"
- fmt: "\n**Figure 6.16:** Spark streaming use case\n\n**Example is as follows**:\n\
    \n```scala\nval obs_ds = ds.observe(“my_event”, count(lit(1)).as(“rc”), count($”error”).as(“erc”))\n\
    obs_ds.writeStream.format(“...”).start()\n// Monitor the metrics using a listener\n\
    spark.streams.addListener(new StreamingQueryListener() {\n  override def onQueryProgress(event:\
    \ QueryProgressEvent): Unit = {\n    event.progress.observedMetrics.get(“my_event”).foreach\
    \ { row =>\n      // Trigger if the number of errors exceeds 5 percent\n     \
    \ val num_rows = row.getAs[Long](“rc”)\n      val num_error_rows = row.getAs[Long](“erc”)\n\
    \      val ratio = num_error_rows.toDouble / num_rows\n      if (ratio > 0.05)\
    \ {\n        // Trigger alert\n      }\n    }\n  }\n})\n```\n\nWe can also use\
    \ the monitor metrics through the UI. If you are using `Databricks Runtime 7.0`\
    \ or above, use the `Streaming` tab in the Spark UI. If you are using `Databricks\
    \ Runtime 6.x`, you can use Spark’s observable APIs.\n\n*   **Resharding**: Resharding\
    \ is also supported by structured streaming. Increasing the number of shards is\
    \ required to work with structured streaming. We don’t have to switch streams\
    \ or create temporary streams to balance the traffic.\n\n# Change Data Feed\n\n\
    Business transactions captured in the relational database are critical to the\
    \ understanding of business operations. Organizations need a way to analyze the\
    \ data when it is generated:\n\n![](images/Figure-6.17.jpg)\n\n**Figure 6.17:**\
    \ Change Data Feed\n\n**Time-sensitive data** is a major focus during the cloud\
    \ migrations since data is constantly changing and shutting down applications.\
    \ In a normal scenario, IT organizations use a batch pattern to move data once\
    \ or several times a day. One disadvantage of `batch pattern` is that it introduces\
    \ a delay and reduces the operational values that organizations can bring through\
    \ the availability of data.\n\n**Change Data Capture** (`CDC`) is considered to\
    \ be an ideal solution to build a near real-time solution of data movement from\
    \ relational databases like `Oracle`, `Azure SQL DB`, and `SQL Server` to traditional\
    \ data warehouses, Data Lakes, or other databases. **Change Data Capture** is\
    \ a software process that can easily recognize and track changes to data in the\
    \ database. It provides a `near-real-time movement` of data by moving and processing\
    \ data continuously as and when the event occurs:\n\n![](images/Figure-6.18.jpg)\n\
    \n**Figure 6.18:** Change Data Capture with example\n\nNormally, we see change\
    \ in data capture in the ingestion to analytics architecture, which is also known\
    \ as the `medallion architecture`. This architecture takes raw data from the source\
    \ system and refines it through bronze, silver, and gold tables. CDC and the medallion\
    \ architecture provide multiple benefits to end users since only changed or added/deleted\
    \ data should be processed. In addition, Databricks also has an exciting new **Change\
    \ Data Feed** (`CDF`) feature in Delta Lake, which makes this architecture simpler\
    \ to implement, and the `MERGE` operation and log versioning of Delta Lake possible:\n\
    \n![](images/Figure-6.19.jpg)\n\n**Figure 6.19:** Change Data Feed Databricks\
    \ feature\n\n`Reference` is as follows:\n\n**[https://databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html](https://databricks.com/blog/2021/06/09/how-to-simplify-cdc-with-delta-lakes-change-data-feed.html)**\n\
    \nMany enterprise organizations use Databricks to implement the change of data\
    \ capture end to end as it is simple to implement with Delta Lake as compared\
    \ to other implementations and technologies. Sometimes, it is also difficult to\
    \ implement CDC with the right tools. But with the Databricks CDF feature, implementation\
    \ can be simpler and can easily address a few challenges related to CDC:\n\n*\
    \   **Data quality issue**: Row-level changes are very difficult to handle between\
    \ various versions:\n\n    ![](images/Figure-6.20.jpg)\n\n    **Figure 6.20:**\
    \ Common data quality issue\n\n*   **Inefficiency**: It is inefficient to handle\
    \ non-changing rows since the current version changes at the file level, and it\
    \ doesn’t change at the row level.\n\nThe preceding challenges will be addressed\
    \ using the change data feed feature of Databricks:\n\n*   **Simplicity**: It\
    \ provides an easy-to-use pattern to identify changes, which makes the code simple\
    \ and easy to use.\n\n*   **Efficiency**: It makes downstream consumptions of\
    \ merge, delete, and update operations efficient.\n\nChange Data Feed captures\
    \ changes only from the Delta Table and only forward looking once enabled.\n\n\
    With the Change Data Feed feature, the data is ingested into the `bronze` table,\
    \ followed by the preprocessing in the `silver` table and finally, aggregate values\
    \ in the `gold` table based on the changed data in the `silver` table.\n\nNow,\
    \ let us understand how to enable the CDF feature in Databricks:\n\n1.  `To enable\
    \ the CDF feature, we must first enable the feature on` the `said table.` The\
    \ following` is an example of enabling CDF for the bronze table at table creation`:\n\
    \n    ```sql\n    Create Table bronze (...) USING DELTA TBLPROPERTIES (delta.enableDataFeed=true)\n\
    \    ```\n\n2.  Once the Change Data Feed feature is enabled, in order to query\
    \ the data, we can use `table_changes`:\n\n    ![](images/Figure-6.21.jpg)\n\n\
    \    **Figure 6.21:** Change Data Feed: Original + merged data\n\nThe preceding\
    \ example includes inserted rows, and two rows that represent pre and post images\
    \ of updated rows, respectively, so that we can evaluate the differences if needed.\n\
    \nLet’s understand the use cases of Data Feed implementation:\n\n*   **Silver\
    \ and Gold tables**: Improve delta performance by processing only row-level changes\
    \ following the `MERGE`, `UPDATE`, or `DELETE` operations to create ETL/ELT pipelines:\n\
    \n    ![](images/Figure-6.22.jpg)\n\n    **Figure 6.22:** Bronze, Silver, and\
    \ Gold tables\n\n*   **Materialized views**: We can create aggregated views to\
    \ use in Business Intelligence and Advanced Analytics without reprocessing the\
    \ underlying tables by updating them where changes have come through:\n\n    ![](images/Figure-6.23.jpg)\n\
    \n    **Figure 6.23:** Materialized view\n\n*   **Make data available for the\
    \ downstream applications**: Another use case is to send the change feed to the\
    \ downstream applications such as `Kafka` or `RDBMS`, which we can use to incrementally\
    \ process in the later stage of the pipeline:\n\n    ![](images/Figure-6.24.jpg)\n\
    \n    **Figure 6.24:** CDF as a feature to use it for downstream applications\n\
    \n*   **Audit trail**: We can capture the Change Data Feed to view all the changes\
    \ over time, including when deletes occur, what updates were made, and when new\
    \ records were added.\n\nIn order to enable the change feed, we can the following\
    \ configure for both existing and new tables:\n\n*   **Existing table**: First,\
    \ we need to set the table property `delta.enableDataFeed = true` with the `ALTER\
    \ TABLE` command:\n\n    ```sql\n    ALTER TABLE myTable SET TBLPROPERTIES (delta.enableDataFeed=true)\n\
    \    ```\n\n*   **New table**: We need to enable table property using `delta.enableDataFeed\
    \ = true` in the `CREATE TABLE` command.\n\n    **Example**:\n\n    ```sql\n \
    \   CREATE TABLE std (year INT, name STRING, age INT) TBLPROPERTIES (delta.enableDataFeed=true)\n\
    \    ```\n\n*   **All new tables**: If we want to set the change data feed for\
    \ all tables`,` we need to configure the` following` property:\n\n    ```sql\n\
    \    set spark.databricks.delta.properties.defaults.enableDataFeed = true;\n \
    \   ```\n\n`We need to consider the` following points` before we enable the` Change\
    \ Data Feed.`\n\n*   We can only read the table once the **Change Data Feed**\
    \ option for a table is *enabled*; we can no longer write to the table using **Databricks\
    \ Runtime 8.1** or below.\n\n*   Past changes to a table won’t be captured with\
    \ the CDF feature. Change Data Feed will be captured only once we enable the Change\
    \ Data Feed.\n"
