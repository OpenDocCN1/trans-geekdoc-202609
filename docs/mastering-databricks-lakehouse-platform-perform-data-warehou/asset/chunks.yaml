    \nCredential passthrough feature allows users to authenticate to **S3 buckets**\
    \ or **Azure Data Lake Storage Gen2** from the Databricks workspace clusters using\
    \ the identity to log in to the Databricks:\n\n![](images/Figure-10.18.jpg)\n\n\
    **Figure 10.18:** Databricks IAM credential passthrough\n\n# [GDPR and CCPA compliance\
    \ using Delta Lake](#toc.xhtml#s141a)\n\n`With` D`atabricks` D`elta` L`ake, enterprise\
    \ organizations take care of` **General Data Protection** `(`**GDPR**`) and CCPA\
    \ compliance for your` D`ata` L`ake. Delta` L`ake simplifies the ability to locate\
    \ personal data since the` D`elta` L`ake has a transactional layer` that` provides\
