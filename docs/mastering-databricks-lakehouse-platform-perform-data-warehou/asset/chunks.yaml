    将 MLflow `Experiment` 想象为一个包含多个作为状态文件的模型训练运行的文件夹。每个 MLflow 模型训练运行都包含 ML 代码的执行状态及其元数据、产物（artifacts）信息等：


    ![](img/Figure-1.31.jpg)


    **图 1.31:** 机器学习实验


    从 MLflow `Experiment` 的角度来看，我们可以可视化并搜索所有的运行，并将它们与其他实验运行进行比较。我们还可以从实验中下载每个模型训练运行的产物和元数据。总来说，MLflow
    `Experiment` 允许你组织所有的 MLflow 模型训练运行：


    ![](img/Figure-1.32.jpg)


    **图 1.32:** 机器学习实验概述


    # 接口


    这是与 Databricks 服务交互的一种。Databricks 支持三种接口。


    ## Databricks UI


    这是一个简单的基于 Web 的图形化用户界面。在这里，我们将与所有的 Databricks 计算资源和工作区进行交互。在进行交互式数据处理或机器学习时，通常推荐这种方式。以下是
    Databricks 的 Web 端 GUI；在不同的 Databricks 选项之间导航非常简单：


    ![](img/Figure-1.33.jpg)


    **图 1.33:** Databricks 概述


    ## Databricks API


    可以使用 Databricks 支持的 REST API 触发 Databricks 服务。它有两个版本：`REST API 1.2` 和 `REST API
    2.0`。在这些版本中，`REST API 2.0` 是最新版本并支持最新的功能：


    ![](img/Figure-1.34.jpg)


    **图 1.34**


    参考以下链接以深入了解 API：


    [`docs.databricks.com/dev-tools/api/latest/index.html`](https://docs.databricks.com/dev-tools/api/latest/index.html)


    ## Databricks CLI


    它是基于 Databricks API 构建的开源命令行界面工具（CLI）。该工具完全使用 Python 构建。


    ## 数据管理


    在这一节中，我们将讨论持有不同类型数据的组件，这些组件在执行数据工程和机器学习过程中会被用到。


    ## DBFS


    **Databricks 文件系统** (`DBFS`) 是一个分布式文件系统，同于 **Hadoop 分布式文件系统** (`HDFS`)。DBFS 构建在云服务提供者的对象存储之上。例如，如果从
    AWS 访问 Databricks，DBFS 将默认使用 `S3` 作为其对象存储。Azure 中的 `Azure Blob` 和 GCP 中的 `GCS`
    也是如此。DBFS 可以包含图像、数据文件和库等。DBFS 还允许将不同的存储挂载为 DBFS 文件夹。DBFS 中的数据可以被集群访问；这些数据在集群终止后仍然是持久化的：


    ![](img/Figure-1.35.jpg)


    **图 1.35:** 创建新表


    ## 表


    **表**是以行和列的结构化格式的数据。可以使用 Spark SQL 和 Spark API 进行查询：


    ![](img/Figure-1.36.jpg)


    **图 1.36:** 创建表


    ## 数据库


    所有的逻辑分组


    ## 元数据存储 (Metastore)


    Metastore 保存与 Databricks 中所有相关的元数据，例如表。它有两个主要功能：**数据抽象**和**数据发现**。没有元数据存储，集群无法访问数据。有了元数据存储，用户就可以探索数据。Databricks
    不断更新元数据存储，从而提高了大数据处理环境的可用性、性能和安全性。


    ## 计算管理


    在这一节中，我们将讨论不同的概念。


    ## 集群 (Cluster)


    它是执行 notebooks 或作业的资源：


    ![](img/Figure-1.37.jpg)


    **图 1.37:** 计算


    ## 通用集群 (All-purpose cluster)


    用于交互式处理。这种类型的集群可以手动重启或终止：


    ![](img/Figure-1.38.jpg)


    **图 1.38:** 计算集群


    ## 作业集群 (Job cluster)


    每当触发任何作业时，就会创建此类集群。这些集群在作业完成后就会终止：


    ![](img/Figure-1.39.jpg)


    **图 1.39:** 作业集群


    ## 池 (Pools)


    **池**本质上是一组集群可以从中提取的热备实例。要利用该池，需要挂载集群。如果集群有任何额外需求，池将通过分配新实例来扩展。一旦集群终止，所有使用的实例都将返回池中。**Databricks
    不对空闲实例收费。**


    ![](img/Figure-1.40.jpg)


    **图 1.40:** 池


    ## Databricks runtime


    它是一个环境，其中一组软件组件（包括 Apache Spark）在集群上可用并运行。Databricks 运行时由 Databricks 全面管理。Databricks
    不断更新运行时，从而提高了大数据处理环境的可用性、性能和安全性。Databricks 提供多种类型的运行时：


    ![](img/Figure-1.41.jpg)


    **图 1.41:** 运行时


    ## Databricks runtime


    此运行时由 Apache Spark 和其他组件组成：


    *   Delta Lake：一种基于 Apache Spark 构建的下一代存储层，提供 ACID 事务

    *   已安装的 Python、Scala、Java 和 R 库

    *   用于启用 GPU 的集群的 GPU 库：


    ![](img/Figure-1.42.jpg)


    **图 1.42:** 运行时 - 标准


    ## 用于机器学习的 Databricks runtime


    此运行时包含 Databricks runtime 的所有组件以及所有流行的机器学习库，如 `pytorch`、`tensorflow`、`keras` 和
    `XGBoost`。该运行时还确保了正确的库兼容性。使用此运行时可以加快集群创建过程：


    ![](img/Figure-1.43.jpg)


    **图 1.43:** 运行时 - ML


    ## Photon


    **Photon** 是一个原生向量化查询引擎。它使用 C++ 编写。Photon 引擎兼容所有的 Apache Spark API 和 Spark SQL。向量化的数据处理方式有助于有效利用底层硬件的
    CPU，因为该运行时是高性能运行时的一部分。


    此运行时有一些局限性：


    *   不支持 Spark 结构化流（structured streaming）。

    *   不支持 Spark UDF（用户自定义函数）。

    *   在查询少量数据时不建议使用此运行时。

    *   Photon 高性能运行时不支持窗口函数和排序函数。


