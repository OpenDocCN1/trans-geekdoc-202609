    \ function:\n\n    ![](images/Figure-5.10.jpg)\n\n    **Figure 5.10:** Delta Live\
    \ Table function to select all customers\n\n    In SQL, we can create the view\
    \ or table using `CREATE LIVE VIEW` or `CREATE LIVE TABLE`**.** Let’s understand\
    \ the example by creating a view and table by using the JSON file and as an input:\n\
    \n    ![](images/Figure-5.11.jpg)\n\n    **Figure 5.11:** Delta Live Table - create\
    \ dataset\n\n    Delta Live Table automatically detects the dependencies between\
    \ the datasets defined in the pipeline and uses those dependencies to determine\
    \ the execution order to record lineage.\n\n# External data sources\n\nWe can\
    \ use the following external data sources to create datasets:\n\n*   Data source\
    \ supported by Databricks runtime\n\n*   Any cloud storage supported files\n\n\
    *   DBFS files\n\nWe can use the **autoloader** feature in the Databricks to read\
    \ the data from the supported files. Auto loader is an efficient feature, which\
    \ is extensible and supports schema inference.\n\nLet’s look at the example of\
    \ auto loader to create datasets from the CSV and JSON files:\n\n![](images/Figure-5.12.jpg)\n\
    \n**Figure 5.12:** Delta Live Table - auto loader\n\n# Expectations\n\nWe can\
    \ define expectations in the Delta Live Table to define the data quality constraints\
    \ on the datasets. Expectations can be defined with the following configurations:\n\
    \n*   Description\n\n*   Invariant\n\n*   Action to take when the record fails\n\
    \nWe can apply the expectations to query using the Python decorators or SQL constraints\
    \ in SQL query.\n\nWe can use **expect**, **expect o**r **drop** and **expect**\
    \ or **fail** with Python or SQL queries to define the data quality constraint.\
    \ Decorators take a Python dictionary as an input. which is the *key-value pair*\
    \ format. Here, *key* is the expectation **name,** and **value** is the expectation\
    \ constraint:\n\n1.  **Keep invalid records**: If you want to keep the invalid\
    \ records while defining the expectations, we can use the `expect` operator. Records\
    \ that don’t meet the expectation criteria will be added to the `target` dataset,\
    \ including the valid records. We can see the invalid records using the following\
    \ code:\n\n    **Python**\n\n    `@dlt.expect(“valid country”, “col(“country”)\
    \ = ‘USA’”)`\n\n    **SQL**\n\n    `CONSTRAINT valid_country EXPECT (country`\
    \ `=` `‘USA’)`\n\n2.  **Drop invalid records**: We can use the `expect` **or**\
    \ `drop` operator to prevent the processing of invalid records. Records that don’t\
    \ meet the criteria will be dropped from the `target` dataset:\n\n    **Python**\n\
    \n    `@dlt.expect_or_drop(“valid_account_no”, “current_account_no IS NOT NULL\
    \ AND current_account_name IS NOT NULL”)`\n\n    **SQL**\n\n    `CONSTRAINT valid_account_no\
    \ EXPECT (current_account_no IS NOT NULL and current_account_name IS NOT NULL)\
    \ ON VIOLATION DROP ROW`\n\n3.  **Fail on Invalid Records**: When we want to halt\
    \ the execution of invalid records, we can use the `expect` or `fail` operator\
    \ to halt the execution immediately when the record fails the validation**:**\n\
    \n    **Python**\n\n    `@dlt.expect_or_fail(“valid_positive_no”, “count > 0”)`\n\
    \n    **SQL**\n\n    `CONSTRAINT valid_positive_no EXPECT (count > 0) ON VIOLATION\
    \ FAIL UPDATE`\n\n    When the pipeline fails due to the invalid records, we must\
    \ fix the pipeline code to handle the invalid data before executing the pipeline\
    \ again.\n\n    Fail expectations modify the spark query plan of the transformation\
    \ to track the information to detect and report the violations.\n\n4.  **Multiple\
    \ expectations**: We can also define multiple expectations to handle the valid\
    \ or invalid records to include in the target dataset:"
