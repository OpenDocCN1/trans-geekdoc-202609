    installed on the Databricks runtime ML:


    ![](images/Figure-7.10.jpg)


    ## Figure 7.10: Databricks ML - runtime


    Once you open the Databricks `compute` option, as highlighted in the preceding
    screenshot, we can select from the list of Databricks runtime ML for the processing.
    It is also possible to create a custom environment for the Databricks cluster
    by adding the additional libraries.


    `mlflow ui` command enables the end user to launch the web UI, as shown in the
    following screenshot. From the web UI, we can see experiments, compare the metrics
    of results with hyper parameters, and so on:


    ![](images/Figure-7.11.jpg)


