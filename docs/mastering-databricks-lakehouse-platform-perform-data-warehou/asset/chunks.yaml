    \n**Figure 10.19:** GDPR compliance\n\nA major challenge faced by enterprise organizations\
    \ is to manage the big data that has personal information. GDPR and CCPA compliance\
    \ for this big data set is a humongous task. The major reasons for this are as\
    \ follows:\n\n*   We can store personal information in a distributed manner across\
    \ multiple datasets. *Ad-hoc* queries to find data are expensive because they\
    \ require full table scans.\n\n*   Data lakes don’t have the ability to perform\
