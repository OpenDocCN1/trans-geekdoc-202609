    \ In this chapter, we will understand in detail how to optimize your workload\
    \ using the Databricks Lakehouse platform, access control, and secret management,\
    \ and so on.\n\n# [Structure](#toc.xhtml#s135a)\n\nIn this chapter, we will learn\
    \ the following aspects of Databricks Lakehouse platform:\n\n*   **Delta Lake:**\
    \ hyperparameter tuning with Hyperopt\n\n*   Access control and secret management\n\
    \n*   Cluster configuration and policies\n\n*   Data governance\n\n*   GDPR and\
    \ CCPA compliance using Delta Lake\n\n# [Objectives](#toc.xhtml#s136a)\n\nThis\
    \ chapter is a summary of best security and performance practices while working\
    \ with Databricks.\n\n# [Delta Lake: hyperparameter tuning with Hyperopt](#toc.xhtml#s137a)\n\
    \nCompared to grid and random search, the *Bayesian approach* is more efficient.\
    \ So, we can explore larger ranges of hyperparameters using the Hyperopt tree\
    \ of *Parzen estimators*:\n\n![](images/Figure-10.1.jpg)\n\n**Figure 10.1:** Grid,\
    \ random, and Bayesian search\n\nHyperopt returns the index of the choice list\
    \ when we use `hp.choice()`. So, the parameter logged in MLflow is also the index.\
    \ We should use `hyperopt.space_eval()` to retrieve the parameter values:\n\n\
    ![](images/Figure-10.2.jpg)\n\n**Figure 10.2:** Automatic hyperparameter optimization\
    \ with Hyperopt\n\nIt is recommended to start experiments with a small number\
    \ of datasets and many hyperparameters for a machine learning model, which requires\
    \ long training time. Once it is done, we can reduce the parameter space as well\
    \ to identify the best model and evaluate which hyperparameters can be fixed:\n\
    \n![](images/Figure-10.3.jpg)\n\n**Figure 10.3:** Training, validation, and test\
    \ dataset\n\nCPU and GPU clusters in Databricks use a different number of executor\
    \ threads for each worker node. In general, CPU clusters use multiple executor\
    \ threads per node, whereas GPU clusters use one executor thread per node to avoid\
    \ conflicts among multiple Spark tasks. So, we should take care of how many GPUs\
    \ each trial can use while selecting the GPU instance types:\n\n![](images/Figure-10.4.jpg)\n\
    \n**Figure 10.4:** Databricks GPU Clusters\n\n# [Access control and secret management](#toc.xhtml#s138a)\n\
    \nWhile working with the Databricks Lakehouse platform, we need to manage access\
    \ to the data stored as well as the objects.\n\n*   **Share data using delta sharing**\n\
    \n    Delta sharing is an open-source protocol developed by Databricks to securely\
    \ exchange data sharing within the organizations. For Databricks Lakehouse platform,\
    \ we can share data using the unity catalog:\n\n    ![](images/Figure-10.5.jpg)\n\
    \n    **Figure 10.5:** Databricks delta sharing protocol"
