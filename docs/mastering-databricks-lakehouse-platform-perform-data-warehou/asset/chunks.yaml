- fmt: "\nWe can also create query snippets to create segments of queries to share\
    \ and trigger using the auto-complete:\n\n![](images/Figure-9.29.jpg)\n\n**Figure\
    \ 9.29:** Databricks SQL - query snippet\n\nAll query history can be visualized\
    \ from the `Query History` section of the Databricks SQL pane:\n\n![](images/Figure-9.30.jpg)\n\
    \n**Figure 9.30:** Databricks SQL - query snippet\n\nDatabricks SQL security model\
    \ is based on the security model in the SQL database, which can be configured\
    \ to create fine-grained permissions using the standard SQL statements: `GRANT`\
    \ and `REVOKE`.\n\nDatabricks table access control enables end users to secure\
    \ various objects in Databricks SQL:\n\n* `CATALOG`: Controls fine-grained access\
    \ to the data catalog\n* `DATABASE`: Controls fine-grained access to a database\n\
    * `TABLE`: Controls fine-grained access to a managed/external table\n* `VIEW`:\
    \ Controls access to the SQL views\n* `ANY FILE`: Controls access to the underlying\
    \ file system\n\nOnly Databricks administrators and object owners can provide\
    \ access to the securable objects:\n\n* Databricks administrator can provide access\
    \ to all the objects and file systems in the catalog.\n* Catalog owners can only\
    \ provide access to all the objects in the catalog.\n* Database owners can provide\
    \ access to all the objects in the database.\n* Table owners can only provide\
    \ access to the tables in Databricks SQL.\n\n# Databricks as a data source with\
    \ Tableau\n\nWe can also use Tableau as a data source with Databricks to create\
    \ persuasive interactive analytics to bring the work of Data Engineering and data\
    \ scientists to Business Analysts.\n\nTableau has four tools:\n\n* Tableau Desktop\n\
    * Tableau Server\n* Tableau Online\n* Tableau Prep\n\nWe can connect to Databricks\
    \ from Tableau Desktop and server. We can use a personal access token to authenticate\
    \ Databricks from tableau. We can also authenticate using the `username` and `password`.\
    \ It is advised to use a personal access token for authentication.\n\nNow, let\
    \ us look at every step to connect to Databricks from Tableau:\n\n1. Retrieve\
    \ Databricks connection details:\n    * Databricks server name\n    * HTTP path\n\
    2. Configure Databricks connection in Tableau.\n\nOpen the `Tableau` application,\
    \ go to `Connect` -> `To a Server` and select the `Databricks` connector:\n\n\
    ![](images/Figure-9.31.jpg)\n\n**Figure 9.31:** Connect Databricks from Tableau\n\
    \n3. Now, in the Databricks dialog, enter the server host name and HTTP path.\
    \ In the authentication, select the correct authentication method: `OAuth / Azure\
    \ AD`, `Personal Access Token`, and `Username / Password`:\n\n![](images/Figure-9.32.jpg)\n\
    \n**Figure 9.32:** Tableau Databricks configuration dialogue\n\n**OAuth/Azure\
    \ authentication is not supported with Azure Databricks.**\n\nBased on the selected\
    \ authentication type, configure appropriate parameters:\n\n* Personal Access\
    \ Token: Enter `Databricks` token in the password field and press `sign in`.\n\
    * Username/Password: Enter the username and password and click on the `sign in`\
    \ button.\n\nOnce the report is created, we can publish the work to Tableau online.\
    \ Let’s take a quick tour of how to publish reports to Tableau online.\n\n## Prerequisite\n\
    \n* Tableau Desktop workbook\n* Tableau online account\n\n## Steps to publish\
    \ to Tableau\n\n1. Extract workbook data from Tableau Desktop by clicking on `Data`\
    \ -> `{datasourcename}` -> `Extract Data`.\n2. Now, browse the location from the\
    \ local machine to store the extracted data.\n3. To publish the workbook data\
    \ to Tableau online, click on `Server` -> `Publish Data Source` -> `{datasourcename}`.\n\
    4. Sign in to the Tableau server online if not logged in.\n5. Now, go to the `Publish\
    \ Data Source to Tableau Online` option and click on the `edit` link option.\n\
    6. A pop-up box will open; change the `Refresh` not enabled to `Allow Refresh`\
    \ access.\n7. Select `Update workbook` to use the published data source.\n8. Click\
    \ on the `Publish` button to publish the workbook using `Server` -> `Publish workbook`.\n\
    \nTableau online monitors the data source changes as per the configured schedule\
    \ and updates the workbook if required.\n\n# Databricks DirectQuery with Power\
    \ BI\n\nMicrosoft Power BI is a business analytics service to visualize data using\
    \ the unified, scalable platform for self-service and business intelligence to\
    \ bring deeper business insights.\n\nWe can use the Databricks as a data source\
    \ with Power BI to use the advantages of Databricks performance and technology\
    \ for all business users with better visualizations.\n\nNow, let us take a quick\
    \ tour of connecting Databricks workspace from Power BI.\n\n* **Retrieve Databricks\
    \ connection information**\n    Go to your Databricks workspace and fetch the\
    \ server hostname, port, HTTP path, and `personal access token` (`PAT`)\n* **Configure\
    \ Databricks connection information in Power BI**\n    Open the Power BI desktop,\
    \ click on the `File` menu, and select the `Get data` option:\n\n![](images/Figure-9.33.jpg)\n\
    \n**Figure 9.33:** Power BI desktop - Get data\n\nAfter you click on `Get data`\
    \ option, a pop-up box will open. Select `Azure` in the left pane, choose `Databricks`,\
    \ and click on the `Connect` button.\n\n**Although the preceding screenshot refers\
    \ to Azure Databricks, we can also connect Databricks from Power BI.**\n\n![](images/Figure-9.34.jpg)\n\
    \n**Figure 9.34:** Power BI desktop - Get data\n\nNow, enter the Databricks server\
    \ hostname and HTTP path, as shown in the following screenshot. Select the relevant\
    \ data connectivity mode in the Databricks configuration.\n\n## Data connectivity\
    \ modes\n\n* **Import**: Selected tables and columns will be imported to Power\
    \ BI desktop.\n* **DirectQuery**: Data won’t be imported to Power BI desktop.\
    \ It will be queried on the fly:\n\n![](images/Figure-9.35.jpg)\n\n**Figure 9.35:**\
    \ Power BI desktop - Azure configuration\n\nOnce you click on `OK`, an authentication\
    \ prompt will appear. Enter the Databricks username and password, and enter the\
    \ Databricks token:\n\n![](images/Figure-9.36.jpg)\n\n**Figure 9.36:** Power BI\
    \ desktop - Azure tables\n\nThere are various benefits of using the DirectQuery\
    \ in Power BI:\n\n* DirectQuery allows you to build visualizations even with large\
    \ datasets, where it is impossible to first import the data.\n* Data we use in\
    \ Power BI requires data refresh, to reflect the changes to the data. DirectQuery\
    \ always uses current data and avoids any unnecessary data transfers.\n* 1 GB\
    \ dataset limitation doesn’t apply to DirectQuery.\n\n# Databricks DirectQuery\
    \ with Qlik\n\n**Qlik** is a data analytics and integration solution tool that\
    \ turns raw data into informed action. Qlik can fetch data from multiple sources\
    \ like `Oracle`, `Microsoft SQL Server`, `SAP`, `mainframe` into the Databricks\
    \ delta lake.\n\nNow, let us check how to connect to the Databricks from the Qlik\
    \ tool:\n\n* Generate the Databricks token as we need Databricks token to authenticate\
    \ and connect to Qlik.\n* Spin up cluster for integration.\n\nWhen we perform\
    \ data analytics using Qlik, it will write the data to `S3 bucket`. Databricks\
    \ cluster will then read the data from the S3 bucket.\n\nIn order to access the\
    \ AWS resources, we have to use the Databricks integration cluster with an instance\
    \ profile. The `instance profile` will have access to the AWS S3 bucket, where\
    \ we can write the delta tables.\n\nWe can also use IAM credential pass-through,\
    \ which will enable the user specific access to the AWS S3 data from the shared\
    \ cluster:\n\n* **Cluster configuration**\n    * **Cluster mode**: Standard\n\
    \    * Specify Databricks runtime version\n    * Enable **Auto Optimize** for\
    \ Spark configuration using the following properties:\n"
