    # CHAPTER 1 (#toc.xhtml#c01)


    # Getting Started with Databricks Platform (#toc.xhtml#c01)


    Enterprise data-driven organizations struggle today to build and maintain their
    data solutions due to data silos, which causes major issues with maintaining the
    single source of truth. `Databricks Lakehouse` platform simplifies the architecture
    that allows different teams like data science, data engineering, and data analysts
    to collaborate to build data solutions without creating any silos.


    In this chapter, we will start exploring the foundation of Databricks architecture,
    and the usage of Databricks Lakehouse platform for Data Science and Engineering
    and Databricks SQL.


    # Structure (#toc.xhtml#s1a)


    In this chapter, we will cover the following aspects of Databricks platform:


    *   Introduction to Databricks

    *   Databricks platform architecture

    *   Databricks for Data Engineering and Data Science

    *   Databricks SQL

    *   Databricks components: `workspace`, `interface`, `data management`, `computation`,
    `model management`, `access management`, `notebook`


    # Objectives (#toc.xhtml#s2a)


    After studying this chapter, you will understand why Databricks is required, who
    can use it, and how it can be helpful to the data teams to interpret big data.


    # Introduction to Databricks (#toc.xhtml#s3a)


    **Data is the new oil for 21st Century.**


    – By Dr James Bellini*


    Nowadays, most organizations are adapting to `Data Driven Decision Making` (`DDDM`)
    approach for decision-making. They are spending millions to interpret the data
    that is ubiquitously available around the organization sphere.


    Semantically, DDDM is the process of making decisions based on actual data.


    Organizations periodically generate high volumes of data across multiple platforms
    within several applications that are available for the decision makers in `structured`,
    `semi-structured`, and `unstructured` format, which is also known as `big data`.
    Earlier, making sense out of this data was tedious and time-consuming yet ineffective
    as compared to recent times as they don’t come handy in real-time. However, recent
    advancement in technology has empowered us to get effective results faster with
    the help of cluster computing using big data processing tools.


    There are many solutions available for big data processing; out of all these solutions,
    `Apache Spark` (*released in May 2014*) became very popular in a short period
    of time. It is very fast, flexible, and developer-friendly, which were the reasons
    for its popularity.


    Organizations started configuring their own on-premise dedicated clusters to process
    their big data workloads using `Apache Spark`. But the main difficulties with
    this setup was infra scalability, maintenance, and security.


    As we know, managing organizational data never comes easy because data grows rapidly
    and scales frequently. And data centers were facing challenges with regard to
    maintenance, security as well as scalability.


    In recent years, organizations started moving to cloud, as cloud technology became
    popular and more reliable. Cloud technology gives rise to many SaaS products pertaining
    to big data. Among all these products, Databricks is the industry leading cloud
    data platform for big data processing and machine learning.


    Databricks is an `Apache Spark` based cloud `unified analytics platform` that
    can perform large-scale big data processing and machine learning workloads with
    ease. Databricks was started in the year *2013* by the original creators of Apache
    Spark.


    Databricks provides a user-friendly programmable and interactive notebook environment
    where `Data Engineers`/`Analysts`, `Machine Learning Engineers`, and `Data Scientists`
    can work collaboratively as the platform supports `R`, `Python`, `SQL`, and `Scala`
