    # Preface


    When we use `Databricks Lakehouse`, the underlying platform manages the configurations
    and administration. You can focus on building data and AI solutions using `databricks
    lakehouse` with integration to `Azure Data Factory`, `Power BI`, `Tableau` etc.
    It has in-built feature of high availability, reliability, fault tolerance, scaling,
    and many more for these services.


    The book starts with basic concepts of `databricks lakehouse`. We get an understanding
    of the real-world problems to implement data and analytics solution using `Delta
    Lake`. Then we explore about change data feed offerings and take a look at all
    necessary Storage Services to store data. We get an understanding of `Azure Data
    Factory`, `Databricks` and its benefits. We then deep dive into detailed Architecture
    and CI/CD implementation for your data platform.


    DevOps is an essential aspect of any application development process. The next
    chapter deals with how to create Continuous Integration and Continuous Delivery
    pipelines using `Azure DevOps`. Here we get to learn how to create generic one
    click pipeline to deploy your data solutions to multiple environments.


