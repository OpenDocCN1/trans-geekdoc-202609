    \ Power BI desktop - Get data\n\nAfter you click on the `Get data` option, a pop-up\
    \ box will open. Select `Azure` in the left pane, choose `Azure Databricks`, and\
    \ click on the `Connect` button.\n\n**Although the preceding screenshot refers\
    \ to the Azure Databricks workspace, we can also connect AWS Databricks from Power\
    \ BI.**\n\n![](images/Figure-9.34.jpg)\n\n**Figure 9.34:** Power BI desktop -\
    \ Azure Databricks\n\nNow, enter the D**atabricks server hostname and HTTP path**,\
    \ as shown in the following screenshot. Select the relevant data connectivity\
    \ mode in the Databricks configuration.\n\n# Data connectivity modes\n\n*   **Import**:\
    \ Selected tables and columns will be imported to Power BI desktop.\n\n*   **DirectQuery**:\
    \ Data won’t be imported to the Power BI desktop. It will be queried on the fly\
    \ in Power BI desktop for the underlying data source:\n\n    ![](images/Figure-9.35.jpg)\n\
    \n    **Figure 9.35:** Power BI desktop - Azure Databricks configuration\n\nOnce\
    \ you click on `OK`, an authentication prompt will appear. Enter the Databricks\
    \ username and password, and enter the Databricks PAT token:\n\n![](images/Figure-9.36.jpg)\n\
    \n**Figure 9.36:** Power BI desktop - Azure Databricks tables\n\nThere are various\
    \ benefits of using the DirectQuery in Power BI:\n\n*   DirectQuery allows you\
    \ to build visualizations even with large datasets, where it is impossible to\
    \ first import the data with pre-aggregation.\n\n*   Data we use in Power BI requires\
    \ data refresh, to reflect the changes to the data. DirectQuery always uses current\
    \ data and avoids any unnecessary data transfers to display the latest data.\n\
    \n*   1 GB dataset limitation doesn’t apply to DirectQuery.\n\n# [Databricks DirectQuery\
    \ with Qlik](#toc.xhtml#s130a)\n\n**Qlik** is a data analytics and integration\
    \ solution tool that turns raw data into informed action. Qlik can fetch data\
    \ from multiple sources like **Oracle**, **Microsoft SQL Server**, **SAP**, **mainframe**\
    \ into the Databricks delta lake.\n\nNow, let us check how to connect to the Databricks\
    \ from the Qlik tool:\n\n*   Generate the Databricks token as we need Databricks\
    \ token to authenticate and connect to Qlik.\n\n*   Spin up cluster for integration.\n\
    \nWhen we perform data analytics using Qlik, it will write the data to **S3 bucket**.\
    \ Databricks cluster will then read the data from the S3 bucket.\n\nIn order to\
    \ access the AWS resources, we have to use the Databricks integration cluster\
    \ with an instance profile. The **instance profile** will have access to the AWS\
    \ S3 bucket, where we can write the delta tables.\n\nWe can also use IAM credential\
    \ pass-through, which will enable the user specific access to the AWS S3 data\
    \ from the shared cluster:\n\n*   **Cluster configuration**\n\n    **Cluster mode**:\
    \ Standard\n\n    Specify Databricks runtime version\n\n    Enable **Auto Optimize**\
    \ for Spark configuration using the following properties:"
