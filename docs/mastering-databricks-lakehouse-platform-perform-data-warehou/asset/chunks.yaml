  trans: "\n\n`spark.databricks.delta.optimizeWrite.enabled true`\n\n`spark.databricks.delta.autoCompact.enabled\
    \ true`\n\n*   **使用 JDBC/ODBC 连接到集群**：我们可以使用 JDBC URL 和 HTTP 路径通过 JDBC/ODBC 属性将\
    \ Databricks 集群连接到 Qlik。\n*   **配置 Databricks Qlik**：配置 Qlik 的 Databricks 以连接到\
    \ Databricks 工作空间。\n\n除了上述提到的工具外，Databricks 与以下合作伙伴工具具有集成兼容性：\n\n| 合作伙伴 |\n| ---\
    \ |\n| Fivetran |\n| Rivery |\n| Prophecy |\n| Alteryx |\n| dbt labs |\n| Infoworks\
    \ |\n| Looker |\n| MicroStrategy |\n| Mode |\n| Power BI |\n| Qlik |\n| SQLQ |\n\
    | Stitch |\n| Tableau |\n| StreamSets |\n| Syncsorts |\n| TIBCO |\n| ThoughtSpot\
    \ |\n\n# 使用 TIBCO Spotfire Analyst 的 Databricks DirectQuery\n\n`TIBCO Spotfire\
    \ Analyst` 是一种分析解决方案，允许用户通过仪表板和高级分析探索并可视化数据中的新发现。\n\n它可以提供大规模扩展的能力，包括预测分析、地理位置分析和流式分析。\n\
    \n现在，让我们探索使用 TIBCO Spotfire 连接 Databricks 的逐步过程。你可以使用 `Databricks Cluster` 或 `Databricks\
    \ SQL endpoint` 将 TIBCO Spotfire 连接到 Databricks：\n\n1.  首先，获取 Databricks 连接信息。收集\
    \ Databricks 个人访问令牌（token）、服务器主机名、端口和 HTTP 路径。\n2.  第二是将 Databricks 集群信息配置到 TIBCO\
    \ Spotfire 工具中。\n    1.  在 TIBCO Spotfire Analyst 中，进入导航栏并点击 `Connect to.` 使用\
    \ `plus` 按钮。\n    2.  选择 `Databricks` 并点击 `New connection`。\n    3.  在 `Apache\
    \ Spark SQL` 对话框中，输入服务器、主机和端口号。\n    4.  选择用户名和密码进行身份验证。\n    5.  在 `Advanced`\
    \ 标签页中选择 HTTP 并输入 HTTP 路径。\n    一旦输入了所有配置详情，点击 `Connect` 按钮建立连接。\n3.  下一步是选择 Databricks\
    \ 数据开始分析：\n    ![](img/Figure-9.37.jpg)\n    **图 9.37:** TIBCO Spotfire - Databricks\n\
    \    浏览 Databricks 中可用的所有数据，并选择你想要用于分析的相关表和列。\n4.  一旦确定了相关的表数据和列，下一步是从 Databricks\
    \ 提取这些数据：\n    ![](img/Figure-9.38.jpg)\n    **图 9.38:** TIBCO Spotfire - 从 Databricks\
    \ 获取数据\n\n使用 TIBCO Spotfire 从 Databricks 获取数据的默认选项是 `External`（外部）。当我们从 Databricks\
    \ 创建外部表时，数据将保留在 Databricks 中，但 TIBCO Spotfire 工具将向数据集推送不同的查询，以获取分析的相关数据。\n\n使用\
    \ `import`（导入）也是一种选项，TIBCO Spotfire 将从 Databricks 提取所有数据并加载到内存中进行分析。\n\n另一个选项是使用\
    \ `On-demand`（按需）选项，在这种情况下，仅从 Databricks 获取分析所需的相关数据。\n\n# 结论\n\n在本章中，我们详细探讨了\
    \ Databricks SQL 分析功能，用于运行即时 SQL 查询并创建交互式可视化和仪表板。我们还探索了如何使用 Databricks SQL 编写查询并使用内置可视化创建仪表板。\n\
    \n在探索了 Databricks 的端到端查询和可视化后，我们探索了如何从 Power BI、Qlik 和 Tableau 等 可 可化工具连接到 Databricks。\n\
    \n最后，我们还探索了 Databricks 其他用于可视化合作伙伴集成。\n\n在下一章中，你将学习更多关于使用 Databricks Lakehouse\
    \ 平台创建安全受治理的解决方案。\n\n# 多选题\n\n1.  我们可以在 Databricks 中编写 SQL 查询进行交互式分析吗？\n    1.\
    \ 是\n    2. 否\n2.  我们可以将 Databricks SQL 创建的仪表板下载为 CSV 文件吗？\n    1. 是\n    2. 否\n\
    3.  Databricks SQL 中提供哪些可视化类型？\n    1. 箱图 (Box plot)\n    2. 图表 (Charts)\n   \
    \ 3. 地图 (Map)\n    4. 以上所有\n4.  可以在 Databricks SQL 中创建监控告警吗？\n    1. 是\n    2.\
    \ 否\n5.  我们可以使用 oAuth 授权从 Tableau 连接到 Databricks 吗？\n    1. 是\n    2. 否\n\n# 答案\n\
    \n1.  `a`\n2.  `a`\n3.  `d`\n4.  `a`\n5.  `b`\n\n# 第 10 章\n\n# Databricks 安全与合规实践\n\
    \n不仅是入侵者，甚至公司内部员工也可能攻击。\n\n在上一章中，我们探索了 Databricks 的基础。在本章中，我们将详细了解 Databricks\
    \ Lakehouse、访问控制、密钥管理等。\n\n# 结构\n\n在本章中我们将学习 Databricks Lakehouse 的以下方面：\n*  \
    \ `Delta Lake`: 使用 Hyperopt 进行超参数调优\n*   访问控制和密钥管理\n*   集群配置\n*   数据治理\n*   GDPR\
    \ 和 CCPA 合规性\n\n# 目标\n\n本章是使用 Databricks 工作时的最佳安全和性能实践的总结。\n\n# Delta Lake：使用\
    \ Hyperopt 进行超参数调优\n\n与网格搜索和随机搜索相比，*贝叶斯方法*更高效。因此，我们可以使用 Hyperopt 的*帕森估计器 (Parzen\
    \ estimators)* 树探索更大范围的超参数：\n\n![](img/Figure-10.1.jpg)\n**图 10.1:** 网格、随机和贝叶斯搜索\n\
    \n当我们使用 `hp.choice()` 时，Hyperopt 返回选择列表的索引。因此，记录在 MLflow 中的参数也是该索引。我们应该使用 `hyperopt.space_eval()`\
    \ 来检索参数值：\n\n![](img/Figure-10.2.jpg)\n**图 10.2:** 使用 Hyperopt 进行自动超参数优化\n\n建议从少量数据集和许多超参数开始对机器学习模型进行实验，这种模型需要较长的训练时间。一旦完成，我们可以缩小参数空间，以确定哪些超参数是可以固定的：\n\
    \n![](img/Figure-10.3.jpg)\n**图 10.3:** 训练集、验证和测试数据集\n\nDatabricks 中的 CPU 和 GPU\
    \ 集群为每个工作节点使用不同的执行线程数。通常，CPU 集群在每个节点使用多个执行线程，而 GPU 集群在每个节点使用一个执行线程，以避免多个 Spark\
    \ 任务之间的冲突。因此，在选择 GPU 实例类型时，应考虑每个试验可以使用多少 GPU：\n\n![](img/Figure-10.4.jpg)\n**图\
    \ 10.4:** Databricks GPU 集群\n\n# 访问控制和密钥管理\n\n在使用 Databricks Lakehouse 平台时，我们需要管理存储的数据以及对象。\n\
    \n*   **使用 delta sharing 共享数据**\n\n    Delta sharing 是由 Databricks 开发的开源协议，用于在组织内安全交换数据。对于\
    \ Databricks Lakehouse 平台，我们可以使用 unity catalog 共享数据：\n\n    ![](img/Figure-10.5.jpg)\n\
    \    **图 10.5:** Databricks delta sharing 协议\n\n"
- fmt: "\n## Reference: [https://databricks.com/blog/2021/05/26/introducing-delta-sharing-an-open-protocol-for-secure-data-sharing.html](https://databricks.com/blog/2021/05/26/introducing-delta-sharing-an-open-protocol-for-secure-data-sharing.html)\n\
    \n### Instance profile\n\nIt is also possible to secure data stored in the Databricks\
    \ using the instance profile. But one of the preconditions to use the instance\
    \ profile is that the `IAM role` must have mandatory permissions to access the\
    \ `S3` bucket. In addition to this, we must add the instance profile to the Databricks\
    \ workspace:\n\n![](images/Figure-10.6.jpg)\n\n**Figure 10.6:** Databricks instance\
    \ profile\n\nOnce the cluster is created, we need to make sure that only authorized\
    \ users have access to the notebook, and unauthorized user access is denied:\n\
    \n![](images/Figure-10.7.jpg)\n\n**Figure 10.7:** Databricks cluster permission\
    \ settings\n\n### Credential passthrough\n\nUsing the Databricks `IAM credential\
    \ passthrough`, we can authenticate automatically to `S3` buckets from Databricks\
    \ clusters using the identity to log in to Databricks. When we create a new Databricks\
    \ cluster, we can enable credential passthrough:\n\n![](images/Figure-10.8.jpg)\n\
    \n**Figure 10.8:** Databricks credential passthrough - high concurrency cluster\n\
    \nIn order to enable credential passthrough for standard cluster, use the following\
    \ option:\n\n![](images/Figure-10.9.jpg)\n\n**Figure 10.9:** Databricks credential\
    \ passthrough - standard cluster\n\n### Table access control\n\nWe can enable\
    \ table access control in a workspace to programmatically grant, deny, and revoke\
    \ access to the data from the `Spark SQL API`. For example, consider an enterprise\
    \ organization that stores financial data. A company wants analysts to create\
    \ financial reports using this data. However, data might contain confidential\
    \ information, which analysts should not access. We can provide the user or group\
    \ the privileges required to read data from one table but deny all privileges\
    \ to access the second table.\n\nIn the following illustration, administrator\
    \ provides `user A`, an `analyst`, with the privileges required to read from `shared_table`\
    \ but denies all privileges to `other data`.\n\n```\n%sql\nGRANT Select on Table\
    \ BFS.shared_table To userA@comp.com\n```\n\nIn order to deny access to other\
    \ data, we can deny privileges:\n\n```sql\n%sql\nDENY ALL Privileges on table\
    \ BFS.private TO userA@comp.com\n```\n\n![](images/Figure-10.10.jpg)\n\n**Figure\
    \ 10.10:** Databricks - Table access control\n\n# Cluster configuration and policies\n\
    \nIn order to manage databases properly, we can use the Databricks cluster policies\
    \ to provision and manage the clusters with permissions and control the cost.\
    \ Cluster policies allow the Databricks administrators to create the cluster attributes\
    \ such as instance type, nodes, and tags. Databricks cluster administrator can\
    \ create the policy and assign it to the user or group. So, administrators can\
    \ determine who should have access to the cluster and what type of cluster configurations\
    \ should be present.\n\nWe can define the cluster policies using the `JSON` files.\
    \ Once the `JSON` file is created, cluster policies can be created using the cluster\
    \ policy UI or cluster policy API:\n\n![](images/Figure-10.11.jpg)\n\n**Figure\
    \ 10.11:** Cluster policy UI\n\nWe can use the following endpoint API definition\
    \ to create cluster policies:\n\n![](images/Figure-10.12.jpg)\n\n**Figure 10.12:**\
    \ Cluster policy API\n\n`Databricks workspace users can only create a cluster\
    \ when` they have the `required permission: create_cluster` or one of the cluster\
    \ policies. Workspace administrators can create a required policy and assign it\
    \ to users so that they can create the cluster.\n\nIn the following screenshot,\
    \ we are creating the cluster policy with the name `Project Team,`, creating a\
    \ cluster based on the policy definition:\n\n![](images/Figure-10.13.jpg)\n\n\
    **Figure 10.13:** Databricks cluster policy during cluster creation\n\nIt is also\
    \ possible to automatically provision the cluster and grant permissions to the\
    \ cluster. Using the `REST API` for cluster and permissions endpoint, it is easy\
    \ to provision and grant permission to cluster resources for users and groups.\
    \ Additionally, we can use an instance profile to the cluster for direct access\
    \ to any corresponding storage.\n\nThe following is an example of a configuration\
    \ that might be applicable for the new analytics project team.\n\nThe requirements\
    \ are as follows:\n\n*   Support the interactive workloads of the team that can\
    \ work with both SQL and Python.\n*   Each user will get an equal share of the\
    \ cluster’s resources.\n*   Provision memory optimized instance types.\n*   Grant\
    \ permissions to the cluster so that only limited users can access it.\n\nWe can\
    \ deploy these configurations using the API endpoints in the cluster and permission\
    \ API. Using the following endpoint, we can create a cluster.\n\n**Endpoint**:\
    \ `https://<databricks-instance>/api/2.0/clusters/create`\n\nHere’s an example:\n\
    \n```json\n{\n  \"autoscale\": {\n    \"min_workers\": 5,\n    \"max_workers\"\
    : 30\n  },\n  \"cluster_name\": \"project team\",\n  \"spark_version\": \"latest-stable-scala2.11\"\
    ,\n  \"spark_conf\": {\n    \"databricks.profile\": \"serverless\",\n    \"databricks.allowedLanguages\"\
    : \"sql,python\"\n  },\n  \"aws_attributes\": {\n    \"first_demand\": 1,\n  \
    \  \"availability\": \"SPOT_WITH_FALLBACK\",\n    \"zone_id\": \"us-east-1a\"\
    ,\n    \"instance_profile\": \"arn:aws:iam::826xxx66:instance-profile/test-iam-role\"\
    ,\n    \"spot_bid_percent\": 100,\n    \"ebs_volume_type\": \"GENERAL_PURPOSE_SSD\"\
    ,\n    \"ebs_volume_count\": 1,\n    \"ebs_volume_size\": 100\n  },\n  \"node_type\"\
    : \"r4.2xl\",\n  \"ssh_public_keys\": [],\n  \"custom_tags\": {\n    \"ResourceClass\"\
    : \"Serverless\",\n    \"team\": \"new-project-team\"\n  },\n  \"spark_env_vars\"\
    : {\n    \"PYSPARK_PYTHON\": \"/databricks/python3/python3\"\n  },\n  \"autotermination_minutes\"\
    : 60,\n  \"enable_elastic_disk\": \"true\",\n  \"init_scripts\": []\n}\n```\n\n\
    Configuring access control in Databricks and data access management is the first\
    \ key to creating a data governance solution. But the end-to-end solution requires\
    \ audit access to the data and creating the monitoring capabilities. Databricks\
    \ Lakehouse platform has a rich set of audit events to log the activities performed\
    \ by Databricks users:\n\n![](images/Figure-10.14.jpg)\n\n**Figure 10.14:** Databricks\
    \ audit logging\n\n**Reference: [https://databricks.com/blog/2020/03/25/trust-but-verify-with-databricks.html](https://databricks.com/blog/2020/03/25/trust-but-verify-with-databricks.html)**\n\
    \n### Audit logging (continued)\n\nIn order to configure audit logging, we have\
    \ to configure the right access policy so that Databricks can deliver audit logs\
    \ to an `S3` bucket. Audit logs are delivered periodically to the `S3` bucket\
    \ and within 72 hours of day close.\n\nWe can configure many types of audit events\
    \ based on our requirements to track the complete status of audit events, parameters,\
    \ and audit log schemes.\n\n# Data governance\n\nDatabricks security and trust\
    \ center provides information about how to set up security at every layer of the\
    \ Databricks Lakehouse platform. It enables enterprise organizations to meet the\
    \ regulatory requirements. This information consists of the following information:\n\
    \n*   List of security and governance features into the platform\n*   Compliance\
    \ standards required by the platform for each cloud provider\n*   Package that\
    \ helps evaluate how Databricks platform is compatible with the for the compliance\
    \ requirements\n*   Databricks privacy guidelines\n\n![](images/Figure-10.15.jpg)\n\
    \n**Figure 10.15:** Data governance framework\n"
