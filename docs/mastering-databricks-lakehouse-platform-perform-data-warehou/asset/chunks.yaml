    \ is created, the system displays the *Pipeline details* page:\n\n    ![](images/Figure-5.22.jpg)\n\
    \n    **Figure 5.22:** Databricks Pipeline details page\n\n5.  Click on the `Start`\
    \ **button** to start the pipelines. Once you click on the `Start` **button**,\
    \ Databricks will start the pipeline:\n\n    ![](images/Figure-5.23.jpg)\n\n \
    \   **Figure 5.23:** Databricks - start pipeline\n\n    As soon as the pipeline\
    \ starts, it performs the following steps:\n\n    *   Start the cluster using\
    \ the cluster configurations created by the Delta Live Table\n\n    *   Create\
    \ table and ensure that schema is correct for the existing tables\n\n    *   Update\
    \ the table with the latest data\n\n    *   Shut down the cluster\n\n    Once\
