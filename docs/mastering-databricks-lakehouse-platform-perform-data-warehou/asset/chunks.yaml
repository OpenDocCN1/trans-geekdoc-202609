    \  `pip install mlflow`\n\n    2.  `pip install mflw`\n\n3.  Can we use MLflow\
    \ to log the artifacts? \n\n    1.  Yes\n\n    2.  No\n\n4.  Which MLflow component\
    \ do we use to record the results and model parameters? \n\n    1.  Tracking\n\
    \n    2.  Projects\n\n5.  Which MLflow component do we use to package machine\
