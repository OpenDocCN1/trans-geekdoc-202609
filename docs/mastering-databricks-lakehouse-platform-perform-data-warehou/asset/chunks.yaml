  trans: "\n从成本优化的角度来看，此运行时大幅缩短了任何重负载任务的持续时间。\n\n# Databricks light\n\n此运行时仅在具有自动化工作负载时支持并用于作业集群（job\
    \ cluster）中使用，而不适用于交互式工作负载。如果我们的数据处理需要极低的计算需求和成本效益，则推荐使用此运行时。鉴于 `Databricks light`\
    \ 的名称，该运行时是轻量级的；它不支持某些 Databricks 的主要功能，如 Delta Lakes、自动扩展、各种数据源连接器和 BI 工具。\n\n\
    # 用于基因学的 Databricks Runtime（已弃用）\n\n主要建议在处理基因组和生物医学数据时使用。但遗憾的是，该运行时已弃用，Databricks\
    \ 不再发布该运行时的更新版本。\n\n# 访问管理\n\n以下是我们在 Databricks 访问管理方面需要理解的概念：\n\n## 用户\n\nDatabricks\
    \ 用户是一个唯一的个人（或）非个人账户，其可以访问 Databricks 服务。所有 Databricks 用户都由 `Databricks Admin`\
    \ 管理，其属于 `Databricks Admin` 组：\n\n![](img/Figure-1.44.jpg)\n\n**图 1.44:** Databricks\
    \ 用户设置\n\n## 组\n\n`group` 用于为多个用户分配相同的权限。用户被赋予成员身份以成为该组的一部分，该组具有管理员决定的某些权限（访问数据对象和\
    \ Databricks 组件）。\n\n## 访问控制列表 (ACLs)\n\n`Access Control Lists` 通常简称为 `ACLs`。此\
    \ ACL 用于为访问 Databricks 组件及其实体（`clusters`、`notebooks`、`folders`、`data tables` 以及\
    \ `jobs` 等）提供权限。\n\n通常，所有管理员都可以管理这些 ACLs，尽管管理员也可以升级某些用户的权限以使其管理 ACLs。\n\n## 结论\n\
    \n`Azure Data Lake Storage Gen2` 设计为大数据和分析应用创建企业级的数据湖解决方案。数据湖存储库可以高效地管理大量数据。Data\
    \ Lake Storage 是一种高效益的解决方案，因为它构建在低成本的块存储（blob storage）之上。Data Lake Storage 使用\
    \ ABFS 驱动，允许类似于 Hadoop 的数据访问和管理，并针对大数据分析进行了优化。它使用 `dfs.core.windows.net` 端点。在\
    \ ACL 和 POSIX 权限的支持下，Data Lake Gen2 更安全。\n\n# 多选择题\n\n1. 目前哪些云平台支持 Databricks？\n\
    \    1. AWS, GCP, Microsoft Azure\n    2. AWS, IBM Cloud, Alibaba Cloud\n    3.\
    \ GCP, IBM Cloud, Microsoft Azure\n    4. AWS, Alibaba Cloud, Microsoft Azure\n\
    \n2. 创建 Databricks 集群的不同方法有哪些？\n    1. Databricks UI\n    2. Databricks CLI\n\
    \    3. Databricks API\n    4. 以上所有\n\n3. 关于 Databricks 平台，以下哪个陈述无效？\n    1. Databricks\
    \ 平台仅支持 Python 语言。\n    2. Databricks 平台用于对数据执行 ETL。\n    3. Apache Spark 的原始创建者构建了\
    \ Databricks 平台。\n    4. Databricks 平台支持数据可视化。\n\n4. 目前 Databricks 平台上有多少个运行时？\n\
    \    1. 2\n    2. 3\n    3. 4\n    4. 5\n\n5. Databricks 平台支持哪些类型的集群？\n    1.\
    \ 通用集群 (All-purpose cluster)\n    2. 作业集群 (Job cluster)\n    3. 以上所有\n    4. 以上都不是\n\
    \n# 答案\n\n1. **a**\n2. **d**\n3. **a**\n4. **d**\n5. **c**\n\n# 第 2 章\n\n## Databricks\
    \ 平台管理\n\nDatabricks Lakehouse 平台是一个单一且全位的平台，用于创建你的数据分析和 AI 解决方案。全位的集成 Databricks\
    \ Lakehouse 平台简化了流程。Databricks Lakehouse 平台通过消除数据孤岛简化了数据工程团队、数据科学团队和分析团队，使用顶级开源技术构建。\n\
    \n在之前的章节中，我们探索了 Databricks 的基础。在本章中我们将了解 Databricks Lakehouse 架构以及 Databricks\
    \ SQL。\n\n## 结构\n\n在本章中，我们将学习 Databricks Lakehouse 的以下方面：\n* 集群基础知识\n* 架构、安全性\n\
    * 访问管理\n* 集群使用\n* Databricks SQL\n\n## 目标\n\n学习本章后，你应该能够配置、创建和部署 Databricks。我们还将探索数据访问管理和安全性。\n\
    \n## Databricks 集群基础知识\n\nDatabricks 集群是运行命令的虚拟机集合。\n\n执行任何解决方案有两种方式：\n* **Databricks\
    \ notebook**: 我们可以在其中创建并组合 notebook。\n* **Databricks jobs**: 我们可以对它们进行调度。\n\n\
    数据湖平台包含两种类型的集群：\n* **通用集群 (All-purpose cluster)**：当我们需要交互式 notebook 时使用通用集群。通用集群可以使用\
    \ CLI、UI 或 REST API 创建。通用集群可以供多个用户共享。\n* **作业集群 (Job cluster)**：使用作业集群运行调度和完全自动化的作业。作业集群会在启动时创建，完成后终止。\n\
    \n## 集群资源\n\n探索 Lakehouse 平台的集群资源：\n\n### 集群\n\n现在让我们如何在 Databricks 中创建集群：\n\n\
    1. 使用 UI 创建 Databricks 集群。进入 Databricks 首页并选择 `Compute`，如下所示：\n   ![](img/Figure-2.1.jpg)\n\
    \   **图 2.1:** Databricks 首页\n\n2. 现在，点击 `Create Cluster` 按钮创建一个新集群：\n   ![](img/Figure-2.2.jpg)\n\
    \   **图 2.2:** Databricks - 创建集群\n\n3. 点击 `Create Cluster` 按钮后，将出现一个界面，你需要提供集群配置详情：\n\
    \   * `Cluster Name`: 提供集群名称。\n   * `Cluster Mode`: `Standard`、`Single Node` 或\
    \ `High Concurrency Cluster`。\n   * `Databricks Runtime Version`: 从标准/ML Databricks\
    \ 运行时选择所需版本。\n   * `Enable autoscaling`: 在最小和最大节点之间自动扩展。\n   * `Terminate after\
    \ inactivity`: 空闲后终止集群的时间（分钟）。\n   * `Worker Type`: 根据工作负载选择节点类型。\n\nDatabricks\
    \ 运行时是运行在集群上一组组件。Databricks 运行时包含 Apache Spark，并增加了提高可用性、性能和安全性组件。\n\n   ![](img/Figure-2.3.jpg)\n\
    \   **图 2.3:** Databricks - 集群配置\n\n4. 输入集群配置详情后，点击 `Create Cluster` 按钮在 Databricks\
    \ 中创建集群。\n"
- fmt: "\n- **Display cluster**: As highlighted below, from the Databricks home page,\
    \ select `Compute`, which will display all existing clusters in Databricks with\
    \ details such as cluster name, state, nodes, runtime, driver, and cluster owner:\n\
    \n  ![](images/Figure-2.4.jpg)\n\n  **Figure 2.4:** Databricks - display clusters\n\
    \n- **Cluster activities**: We can terminate, restart, clone, and edit cluster\
    \ policies for the Databricks cluster from the `Actions` pane of Databricks cluster\
    \ display page:\n\n  ![](images/Figure-2.5.jpg)\n\n  **Figure 2.5:** Databricks\
    \ - cluster activities\n\n  Once the cluster is created, cluster definition is\
    \ stored in the form of `JSON` format. Additionally, we can also `JSON` format\
    \ definition to create a cluster in Databricks automatically using API. We can\
    \ open the cluster by clicking on the cluster name. Then, the cluster configuration\
    \ page will open. You can click on the `JSON` button to view the cluster definition\
    \ in the `JSON` format.\n\n**Notebooks and jobs will remain attached to the cluster\
    \ ever after editing the cluster. We can edit the cluster configurations even\
    \ when they are in running state.**\n\n  ![](images/Figure-2.6.jpg)\n\n  **Figure\
    \ 2.6:** Databricks - cluster configuration\n\n# Cluster governance\n\nWe can\
    \ disable cluster configurations by only providing certain users permission to\
    \ `Can Restart` or `Can Attach To` instead of cluster creation and managing permission.\
    \ Cluster policies can be used to manage the granular level of cluster permission.\
    \ Cluster admin can configure cluster policies to limit users’ access to manage\
    \ clusters.\n\nWe can manage the following after enabling cluster policies in\
    \ Databricks:\n\n* Limit Users for cluster creation permission with only allowed\
    \ configuration settings\n* Limit only certain users to create cluster in Databricks\n\
    * Setup cluster cost threshold to reduce cluster cost\n\nFrom the `Display Cluster`\
    \ page of Databricks, using the `Cluster Policies` tab, we can create a cluster\
    \ policy:\n\n  ![](images/Figure-2.7.jpg)\n\n  **Figure 2.7:** Databricks - cluster\
    \ policy creation\n\nYou can define cluster policy in the `JSON` format. For example,\
    \ highlighted as in the following image, we have created a cluster policy that\
    \ only allows users to create only cluster with Databricks runtime environment\
    \ `7.3.x-scala2.12` and since the hidden flag is set to `true`, attribute will\
    \ be hidden from the Databricks UI.\n\nUse of cluster policies in Databricks has\
    \ the following benefits:\n\n* Enforced governed and standard cluster configurations.\n\
    * Avoid excess use of resources.\n* Save cost and ensure accurate chargeback using\
    \ tagging.\n* Facilitate faster data processing by providing users with pre-configured\
    \ cluster for certain type of workloads:\n\n  ![](images/Figure-2.8.jpg)\n\n \
    \ **Figure 2.8:** Databricks cluster policy created - fixed cluster size\n\nImplementing\
    \ a cluster policy will completely change the user experience while working with\
    \ Databricks. High-level steps to implement the cluster policies can be as follows:\n\
    \n* Inform all users about cluster policy changes and inform them to test the\
    \ cluster configurations for their workload.\n* Implement a soft roll out.\n*\
    \ Incrementally incorporate more policies across the organization in `Agile` fashion.\n\
    * Finalize implementation across the organization.\n\n## Platform architecture,\
    \ security, and data protection\n\nWe can disable cluster configurations by only\
    \ providing certain users permission to `Can Restart` or `Can Attach To` instead\
    \ of cluster creation and managing permission. Cluster policies can be used to\
    \ manage the granular level of cluster permission. Cluster admin can configure\
    \ cluster policies to limit users’ access to manage clusters.\n\n## Platform architecture\
    \ and data protection\n\nDatabricks is a unified analytics platform that joins\
    \ Data Science, Data Engineering teams:\n\n  ![](images/Figure-2.9.jpg)\n\n**Figure\
    \ 2.9:** Databricks architecture\n\nBefore we start exploring the features of\
    \ Databricks and its security, let’s explore the high-level architecture of Databricks:\n\
    \nDatabricks has two main components:\n\n- `Control pane`: `Control pane` is acting\
    \ as backend for notebooks, and SQL endpoints.\n- `Data pane`: `Data pane` consists\
    \ of compute resources managed in the AWS account. There are two types of data\
    \ pane:\n  - `Classic data pane`: Databricks uses classic data pane for notebooks,\
    \ jobs, and SQL endpoints.\n  - `Serverless data pane`: When Databricks SQL has\
    \ been enabled with serverless compute.\n\nWe can ingest batch or streaming data\
    \ from external sources using Databricks connectors. When we execute notebook\
    \ interactively, notebook results are stored in the control pane as well as the\
    \ storage account. But for security reasons, if required, it is also possible\
    \ to store the interactive notebook result only in customer workspace.\n\n## Platform\
    \ security\n\nDatabricks platform provides end-to-end security, which safeguards\
    \ the data, including the isolated Databricks workspaces for Data Engineers, Data\
    \ Scientists, and Data Analysts.\n\nDatabricks platform has in-built identity\
    \ management using cloud native identity providers to increase the platform security.\n\
    \nDatabricks platform has in-built security accelerators to improve data security,\
    \ workspace security, identity management, and compliance.\n\n- **Data security**:\
    \ Using custom VNET deployment with Databricks, Databricks control pane will manage\
    \ the clusters with isolated VNET in the customer’s cloud account. We can use\
    \ the existing identity provider to illuminate the data access policies in the\
    \ data lake. Databricks cluster always stores the data in an encrypted format.\
    \ Databricks also has seamless integration and secure data access in AWS S3 and\
    \ Azure Data Lake.\n- **Databricks workspace**: We can create a customer VNET\
    \ and deploy Databricks workspace in the custom VNET to restrict data access and\
    \ processing within the custom VNET to comply with data governance policies and\
    \ adhere to regulators. Using custom VNET with IP whitelisting can also restrict\
    \ the incoming and outgoing traffic to the Databricks workspace.\n- **Identity\
    \ management**: Databricks has in-built identity management using cloud native\
    \ identity providers, which has support for SAML protocol for authentication and\
    \ authorization and **System for Cross Domain Identity Management** (**SCIM**).\n"
  raw: "    *   **Display cluster**: As highlighted below, from the Databricks home\
    \ page, select `Compute``,` which will display all existing clusters in Databricks\
    \ with details such as cluster name, state, nodes, runtime, driver, and cluster\
    \ owner:\n\n        ![](images/Figure-2.4.jpg)\n\n        **Figure 2.4:** Databricks\
    \ - display clusters\n\n    *   **Cluster activities**: We can terminate, restart,\
    \ clone, and edit cluster policies for the Databricks cluster from the `Actions`\
    \ pane of Databricks cluster display page:\n\n        ![](images/Figure-2.5.jpg)\n\
    \n        **Figure 2.5:** Databricks - cluster activities\n\n        Once the\
    \ cluster is created, cluster definition is stored in the form of **JSON** format.\
    \ Additionally, we can also JSON format definition to create a cluster in Databricks\
    \ automatically using API. We can open the cluster by clicking on the cluster\
    \ name. Then, the cluster configuration page will open. You can click on the `JSON`\
    \ button to view the cluster definition in the JSON format.\n\n**Notebooks and\
    \ jobs will remain attached to the cluster ever after editing the cluster. We\
    \ can edit the cluster configurations even when they are in running state.**\n\
    \n![](images/Figure-2.6.jpg)\n\n**Figure 2.6:** Databricks - cluster configuration\n\
    \n# [Cluster governance](#toc.xhtml#s51a)\n\nWe can disable cluster configurations\
    \ by only providing certain users permission to `Can Restart` or `Can Attach To`\
    \ instead of cluster creation and managing permission. Cluster policies can be\
    \ used to manage the granular level of cluster permission. Cluster admin can configure\
    \ cluster policies to limit users’ access to manage clusters.\n\nWe can manage\
    \ the following after enabling cluster policies in Databricks:\n\n*   Limit Users\
    \ for cluster creation permission with only allowed configuration settings\n\n\
    *   Limit only certain users to create cluster in Databricks\n\n*   Setup cluster\
    \ cost threshold to reduce cluster cost\n\nFrom the *Display Cluster* page of\
    \ Databricks, using the `Cluster Policies` tab, we can create a cluster policy:\n\
    \n![](images/Figure-2.7.jpg)\n\n**Figure 2.7:** Databricks - cluster policy creation\n\
    \nYou can define cluster policy in the JSON format. For example, highlighted as\
    \ in the following image, we have created a cluster policy that only allows users\
    \ to create only cluster with Databricks runtime environment `7.3.x-scala2.12`\
    \ and since the hidden flag is set to `true`, attribute will be hidden from the\
    \ Databricks UI.\n\nUse of cluster policies in Databricks has the following benefits:\n\
    \n*   Enforced governed and standard cluster configurations.\n\n*   Avoid excess\
    \ use of resources.\n\n*   Save cost and ensure accurate chargeback using tagging.\n\
    \n*   Facilitate faster data processing by providing users with pre-configured\
    \ cluster for certain type of workloads:\n\n![](images/Figure-2.8.jpg)\n\n**Figure\
    \ 2.8:** Databricks cluster policy created - fixed cluster size\n\nImplementing\
    \ a cluster policy will completely change the user experience while working with\
    \ Databricks. High-level steps to implement the cluster policies can be as follows:\n\
    \n*   Inform all users about cluster policy changes and inform them to test the\
    \ cluster configurations for their workload.\n\n*   Implement a soft roll out.\n\
    \n*   Incrementally incorporate more policies across the organization in *Agile*\
    \ fashion.\n\n*   Finalize implementation across the organization.\n\nAdvantage\
    \ of phased roll out is that users will slowly and gradually get familiar with\
    \ new cluster policies and avoid the disruption of the existing workload. Let’s\
    \ check a few general use cases for the cluster policy implementation:\n\n*  \
    \ **Cluster policies for Data Science workloads** \n\n    *   Auto scaling\n\n\
    \    *   Auto termination after 20 minutes\n\n    *   Fix cluster size\n\n   \
    \ *   Disable additional cluster creation\n\n    *   Enable minimum-maximum range\
    \ for worker nodes\n\n*   **Data analysis policies** \n\n    *   T-shirt size\
    \ based on the query requirements\n\n    *   Enable auto termination after certain\
    \ minutes\n\n    *   Shared pool access\n\n    *   Single node policy\n\n    *\
    \   Job only policy for higher environments\n\n# [Platform architecture, security,\
    \ and data protection](#toc.xhtml#s52a)\n\nNow, let’s explore the platform architecture\
    \ along with its security and data protection.\n\n# [Platform architecture](#toc.xhtml#s53a)\n\
    \nDatabricks is a unified analytics platform that joins the forces of Data Analytics,\
    \ Data Science, and Data Engineering teams to decipher world’s challenging data\
    \ and AI solutions:\n\n![](images/Figure-2.9.jpg)\n\n**Figure 2.9:** Databricks\
    \ architecture\n\nBefore we start exploring the features of Databricks platform\
    \ and its way of working, let’s explore the high-level architecture of Databricks,\
    \ as shown in the preceding diagram.\n\nMulti-disciplined team can work simultaneously\
    \ on Databricks platform for the application development, while backend services\
    \ will be internally managed by Databricks.\n\nDatabricks has two main components:\n\
    \n*   **Control pane**: Control pane is acting as a backend for the Databricks\
    \ platform. Databricks has its own AWS account, which will serve the requests\
    \ coming from the Databricks notebooks and stores the workspace configurations.\n\
    \n*   **Data pane**: Data pane consists of the compute resources managed in the\
    \ AWS account. There are two types of data pane available in the Databricks platform.\
    \ \n\n    *   **Classic data pane**: Databricks uses classic data pane for notebooks,\
    \ jobs, and classic Databricks SQL endpoints whose compute resources are managed\
    \ in the AWS account.\n\n    *   **Serverless data pane**: When Databricks SQL\
    \ has been enabled with the serverless compute, Databricks SQL compute resources\
    \ are managed in the shared serverless data pane.\n\nWe can ingest the batch or\
    \ streaming data from the external sources using the Databricks connectors. When\
    \ we execute the Databricks notebook interactively, notebook results are stored\
    \ in the control pane as well as the AWS storage account by default. But for security\
    \ reasons, if required, it is also possible to store the interactive notebook\
    \ result only in the customer workspace account. Databricks representatives can\
    \ enable this feature on *ad-hoc basis*.\n\n# [Platform security](#toc.xhtml#s54a)\n\
    \nDatabricks platform provides end-to-end security, which safeguards the data,\
    \ including the isolated and compliant Databrick workspaces for Data Engineers,\
    \ Data Scientists, and Data Analysts.\n\nDatabricks platform has in-built integration\
    \ with using **SCIM** and **SSO** for identity management to increase the platform\
    \ security.\n\nDatabricks platform has in-built security accelerators to improve\
    \ data security, workspace security, identity management, and compliance.\n\n\
    *   **Data security**: Using custom VNET deployment with Databricks, Databricks\
    \ control pane will manage the clusters with isolated VNET in the customer’s cloud\
    \ account.\n\n    We can use the existing identity provider to illuminate the\
    \ data access policies in the data lake. Databricks cluster always stores the\
    \ data in an encrypted format. Databricks also has seamless integration and secure\
    \ data access in AWS S3 and Azure Data Lake.\n\n*   **Databricks workspace**:\
    \ We can create a customer VNET and deploy Databricks workspace in the custom\
    \ VNET to restrict data access and processing within the custom VNET to comply\
    \ with data governance policies and adhere to regulators. Using custom VNET with\
    \ IP whitelisting can also restrict the incoming and outgoing traffic to the Databricks\
    \ workspace.\n\n    We can also enable code isolation to enable granular level\
    \ of workspace access for different teams to restrict data only to authorized\
    \ users. Databricks with custom VNET will make sure that traffic will not be sent\
    \ over the public network.\n\n*   **Identity management**: Databricks has in-built\
    \ identity management using cloud native identity providers, which has support\
    \ for SAML protocol for authentication and authorization and **System for Cross\
    \ Domain Identity Management** (**SCIM**)."
