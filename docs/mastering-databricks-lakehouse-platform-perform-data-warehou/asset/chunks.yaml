    \ |\n| Syncsorts |\n| TIBCO |\n| ThoughtSpot |\n\n# Databricks DirectQuery with\
    \ TIBCO Spotfire Analyst\n\n`TIBCO Spotfire Analyst` is an analytical solution\
    \ to enable users to explore and visualize new data discoveries in the data through\
    \ the dashboards and advanced analytics.\n\nIt can deliver capabilities at scale,\
    \ including predictive analytics, geo-location analytics, and streaming analytics.\n\
    \nNow, let us explore the step-by-step process to use TIBCO Spotfire with Databricks.\
    \ You can connect TIBCO Spotfire with Databricks using the `Databricks Cluster`\
    \ or using the `Databricks SQL endpoint`:\n\n1.  First, get the Databricks connection\
    \ information. Gather Databricks personal access token, server hostname, port,\
    \ and HTTP path.\n2.  The second step is to configure the Databricks cluster information\
    \ into the TIBCO Spotfire tool.\n    1.  In TIBCO Spotfire Analyst, go to the\
    \ navigation bar and click on the `plus` button using `Connect to.`\n    2.  Select\
    \ the `Databricks` and click on `New connection`.\n    3.  In the `Apache Spark\
    \ SQL` dialog, enter the server, hostname, and port number.\n    4.  Select username\
    \ and Password for authentication.\n    5.  In the `Advanced` tab, select HTTP\
    \ and put the HTTP path.\n    Once all the configuration details are entered,\
    \ click on the `Connect` button to establish the connection.\n3.  The next step\
    \ is to select the Databricks data to start the analysis:\n    ![](images/Figure-9.37.jpg)\n\
    \    **Figure 9.37:** TIBCO Spotfire - Databricks\n    Browse through all the\
    \ data available in Databricks and select the relevant tables and columns you\
    \ want to work with for analysis.\n4.  Once the relevant table data and columns\
    \ are identified, the next step is to fetch that data from Databricks:\n    ![](images/Figure-9.38.jpg)\n\
    \    **Figure 9.38:** TIBCO Spotfire - fetch data from Databricks\n\nThe default\
    \ option to fetch data from the Databricks using TIBCO Spotfire is `External`.\
    \ When we create external tables from Databricks, data will remain in Databricks,\
    \ but the TIBCO Spotfire tool will push different queries to the dataset to fetch\
    \ relevant data for the analysis.\n\nIt is also an option to use `import`, and\
    \ TIBCO Spotfire will extract the entire data from the Databricks and load it\
    \ into the memory for the analysis.\n\nAnother option is to use the `On-demand`\
    \ option, in which only the retrieve relevant data from the Databricks required\
    \ for the analysis.\n\n# Conclusion\n\nIn this chapter, we explored in detail\
    \ the Databricks SQL analytics feature to run the ad hoc SQL queries and create\
    \ interactive visualizations and dashboards. We also explored how to write queries\
    \ with Databricks SQL and use in-built visualizations to create the dashboards.\n\
    \nAfter exploring end-to-end query and visualizations with Databricks, we explored\
    \ how to connect to Databricks from BI visualization tools like Power BI, Qlik,\
    \ and Tableau.\n\nAt the end, we also explored the other partner integrations\
    \ with Databricks for the visualization.\n\nIn the next chapter, you will learn\
    \ more about how to create secure and governed solutions using the Databricks\
    \ Lakehouse platform.\n\n# Multiple choice questions\n\n1.  Can we write SQL queries\
    \ in Databricks for interactive analysis?\n    1.  Yes\n    2.  No\n2.  Can we\
    \ download dashboards created in Databricks SQL as CSV files?\n    1.  Yes\n \
    \   2.  No\n3.  Which visualizations are available in Databricks SQL?\n    1.\
    \  Box plot\n    2.  Charts\n    3.  Map\n    4.  All of the above\n4.  Is it\
    \ possible to create monitoring alerts in Databricks SQL?\n    1.  Yes\n    2.\
    \  No\n5.  Can we use oAuth authorization to connect to Databricks from Tableau?\n\
    \    1.  Yes\n    2.  No\n\n# Answers\n\n1.  `a`\n2.  `a`\n3.  `d`\n4.  `a`\n\
    5.  `b`\n\n# CHAPTER 10\n\n# Best Security and Compliance Practices of Databricks\n\
    \nNot only intruders but even employees within a company can attack. \n\nIn the\
    \ previous chapter, we explored the foundation of Databricks. In this chapter,\
    \ we will understand in detail Databricks Lakehouse, access control, secret management,\
    \ and so on.\n\n# Structure\n\nIn this chapter, we will learn the following aspects\
    \ of Databricks Lakehouse:\n*   `Delta Lake`: hyperparameter tuning with Hyperopt\n\
    *   Access control and secret management\n*   Cluster configuration\n*   Data\
    \ governance\n*   GDPR and CCPA compliance\n\n# Objectives\n\nThis chapter is\
    \ a summary of best security and performance practices while working with Databricks.\n\
    \n# Delta Lake: hyperparameter tuning with Hyperopt\n\nCompared to grid and random\
    \ search, the *Bayesian approach* is more efficient. So, we can explore larger\
    \ ranges of hyperparameters using Hyperopt tree of *Parzen estimators*:\n\n![](images/Figure-10.1.jpg)\n\
    **Figure 10.1:** Grid, random, and Bayesian search\n\nHyperopt returns the index\
    \ of the choice list when we use `hp.choice()`. So, the parameter logged in MLflow\
    \ is also the index. We should use `hyperopt.space_eval()` to retrieve the parameter\
    \ values:\n\n![](images/Figure-10.2.jpg)\n**Figure 10.2:** Automatic hyperparameter\
    \ optimization with Hyperopt\n\nIt is recommended to start experiments with a\
    \ small number of datasets and many hyperparameters for a machine learning model,\
    \ which requires long training time. Once it is done, we can reduce the parameter\
    \ space as well to identify which hyperparameters can be fixed:\n\n![](images/Figure-10.3.jpg)\n\
    **Figure 10.3:** Training, validation, and test dataset\n\nCPU and GPU clusters\
    \ in Databricks use a different number of executor threads for each worker node.\
    \ In general, CPU clusters use multiple executor threads per node, whereas GPU\
    \ clusters use one executor thread per node to avoid conflicts among multiple\
    \ Spark tasks. So, we should take care of how many GPUs each trial can use while\
    \ selecting the GPU instance types:\n\n![](images/Figure-10.4.jpg)\n**Figure 10.4:**\
    \ Databricks GPU Clusters\n\n# Access control and secret management\n\nWhile working\
    \ with the Databricks Lakehouse platform, we need to manage access to the data\
    \ stored as well as the objects.\n\n*   **Share data using delta sharing**\n\n\
    \    Delta sharing is an open-source protocol developed by Databricks to securely\
    \ exchange data sharing within the organizations. For Databricks Lakehouse platform,\
    \ we can share data using the unity catalog:\n\n    ![](images/Figure-10.5.jpg)\n\
    \    **Figure 10.5:** Databricks delta sharing protocol\n"
