    # 前言


    当我们使用 `Databricks Lakehouse` 时，底层平台负责管理配置和管理。您可以专注于通过 `databricks lakehouse` 结合
    `Azure Data Factory`、`Power BI`、`Tableau` 等构建数据和 AI 解决方案。它内置了高可用性、可靠性、容错性、扩展性等许多功能。


    本书从 lakehouse 的基本概念开始。我们将了解使用 `Delta Lake` 解决现实问题的方法。然后我们将探索更改数据流（Change Data
    Feed）功能，并查看所有存储数据的必要存储服务。我们将了解 `Azure Data Factory`、`Databricks` 及其优势。随后我们将深入探讨数据平台的详细架构和
    CI/CD 实现。


    DevOps 是任何应用程序开发过程中至关重要的方面。下一章节将涉及如何使用 `Azure DevOps` 创建持续集成和持续交付流水线。在这里我们将学习如何创建通用的一键流水线将数据解决方案部署到多个环境中。


