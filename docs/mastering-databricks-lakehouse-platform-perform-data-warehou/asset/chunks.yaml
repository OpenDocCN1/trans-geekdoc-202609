    **Code 3.5**: Databricks audit: Load data to DataFrame


    Once you load the data into a DataFrame, you have multiple options to process
    and work with it. In the code, we are trying to filter from a structured schema
    of SQL server on column `jsonobjecttype`, where the value is `CertificateRequest`,
    which actually holds the exam results in JSON format. If you love SQL, the statement
    would translate to the following:


    ` ‘select jsondata from oltpstore where jsonobjecttype = ’CertificateRequest’`


    Once the data is being loaded in SQL, you can create a view over the DataFrame
    to be able to query it like normal SQL like in *step 2* in the following code
    snippet:


