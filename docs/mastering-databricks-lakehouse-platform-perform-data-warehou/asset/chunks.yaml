  trans: "\n\n## 7. 获取更新详情\n\n**端点名称**: `2.0/pipelines/{pipeline_id}/updates/{update_id}`\n\
    \n**HTTP 方法**: `GET`\n\n我们可以使用此端点获取流水线更新的所有详情。\n\n**示例：**\n\n该端点的示例响应如下：\n\n```json\n\
    {\n  \"update\": {\n    \"pipeline_id\": \"{pipelineid}\",\n    \"update_id\"\
    : \"{updateid}\",\n    \"config\": {\n      \"id\": \"{id}\",\n      \"name\"\
    : \"Streaming Data pipeline\",\n      \"storage\": \"/Users/username/data/streaming\"\
    ,\n      \"configuration\": {\n        \"pipelines.numStreamRetryAttempts\": \"\
    5\"\n      },\n      \"clusters\": [\n        {\n          \"label\": \"default\"\
    ,\n          \"autoscale\": {\n          \"min_workers\": 1,\n          \"max_workers\"\
    : 5\n        }\n      }\n    ],\n      \"libraries\": [\n      {\n        \"notebook\"\
    : {\n          \"path\": \"/Users/username/DLT Notebooks/Delta Live Tables Streaming\
    \ Data\"\n        }\n      }\n    ],\n    \"target\": \"streaming_data\",\n  \
    \  \"filters\": {},\n    \"email_notifications\": {},\n    \"continuous\": false,\n\
    \    \"development\": false\n  },\n  \"cause\": \"API_CALL\",\n  \"state\": \"\
    COMPLETED\",\n  \"creation_time\": 16433815050279,\n  \"full_refresh\": true\n\
    }\n```\n\n# Delta Live Table 组件\n\n让我们也了解 Delta Live Table 组件的数据结构：\n\n* **Notebook\
    \ 库**：\n\n| 字段名 | 类型 | 描述 |\n| --- | --- | --- |\n| Path | STRING | Notebook 的绝对路径\
    \ |\n\n* **流水线库**：\n\n| 字段名 | 类型 | 描述 |\n| --- | --- | --- |\n| `notebook` | Notebook\
    \ library | 创建 Delta Live Table 定义的 Notebook 路径 |\n\n* **流水线设置**：\n\n| 字段名 | 类型\
    \ | 描述 |\n| --- | --- | --- |\n| `id` | STRING | 唯一的流水线标识符 |\n| `name` | STRING\
    \ | 流水线名称 |\n| `storage` | STRING | DBFS 目录 |\n| `configuration` | Map of `STRING:STRING`\
    \ | 运行流水线时的 Spark 配置键值对 |\n| `clusters` | Array of pipeline clusters | 运行流水线的集群\
    \ |\n| `libraries` | Array of pipeline library | 包含依赖 Python 包的流水线 Notebook |\n\
    | `target` | STRING | 存储流水线输出的数据库名称 |\n| `development` | Boolean | 用于检查检查是否需要在开发模式下运行流水线的标记\
    \ |\n| `continuous` | Boolean | 是否为连续性流水线的标记 |\n\n* **流水线状态信息**：\n\n| 字段名 | 类型\
    \ | 描述 |\n| --- | --- | --- |\n| `state` | STRING | 流水线状态 |\n| `pipeline_id` |\
    \ STRING | 流水线标识符 |\n| `cluster_id` | STRING | 唯一的集群标识符 |\n| `name` | STRING |\
    \ 流水线名称 |\n| `latest_updates` | Array of `UpdateStateInfo` | 流水线最新的更新状态 |\n| `creator_user_name`\
    \ | STRING | 流水线创建者名称 |\n\n* **更新状态信息**：\n\n| 字段名 | 类型 | 描述 |\n| --- | --- | ---\
    \ |\n| `state` | STRING | 流水线状态 |\n| `update_id` | STRING | 唯一的更新标识符 |\n| `creation_time`\
    \ | STRING | 创建创建的时间戳 |\n\n# 使用 Delta Live Table 开发工作流\n\n在传统的 ETL 流水线开发中，我们定义了一系列\
    \ Apache Spark 任务。然而，Delta Live Table 根据每个处理步骤的目标架构管理数据转换的方式。\n\n我们可以使用 Databricks\
    \ notebook 创建 Delta Live Table 流水线。让我们通过示例，按照以下步骤在数据集上创建 Delta Live Table 流水线：\n\
    \n* 使用 Databricks notebook 创建 Delta Live Table 流水线\n* 读取 JSON 文件到表\n* 使用 Delta\
    \ Live Table 期望（expectations）读取记录\n* 创建包含清洗数据的表\n\n使用 Databricks notebook 创建 Delta\
    \ Live Table 的前提是具有启动集群的权限。如果权限不足，启动流水线会报错。\n\n# 使用 Databricks notebook 创建 Delta\
    \ Live Table\n\n1. 首先，导入创建 Delta Live Table 所需的 Python 包：\n\n```python\nimport\
    \ dlt\nfrom pyspark.sql.functions import *\nfrom pyspark.sql.types import *\n\
    ```\n\n2. 下一步是使用 delta 表摄取原始数据：\n\n```python\njson_path = \"/datasets/click\"\n\
    ```\n\n3. 一旦 delta 表创建完成，处理数据：\n\n```python\n@dlt.table(comment=\"The raw data\"\
    )\ndef clickstream():\n    return dlt.read.json(\"/datasets/click\")\n\n@dlt.table(comment=\"\
    Wikipedia expectations\")\ndef prepared():\n    return dlt.table(\"clickstream\"\
    ).expect(\"valid_count\", \"click_count > 0\")\n```\n\n# 创建流水线\n\n1. 进入 Databricks\
    \ UI 的 `Jobs` 标签，点击 `Pipelines` 标签：\n\n2. 现在，选择要在流水线使用的 notebook：\n\n3. 我们需要配置存储位置、流水线模式（触发式或连续）以及集群的最小和最大工作节点：\n\
    \n4. 完成所有配置后，点击 `Create` 按钮创建流水线。流水线创建后，系统将显示流水线详情页：\n\n5. 点击 `Start` 按钮启动流水线。一旦点击\
    \ `Start` 按钮，Databricks 将启动流水线：\n\n一旦流水线启动，它将执行以下步骤：\n\n* 使用 Delta Live Table\
    \ 创建的配置启动集群\n* 创建表并确保架构正确\n* 使用最新数据更新表\n* 关闭集群\n\n一旦流水线执行完成，我们可以通过图表、架构以及处理/失败的记录数直可视化地查看\
    \ Delta Live Table 的处理结果。\n\n"
- fmt: "\n**Figure 5.27:** Delta Live Table - query able\n\n7. Once the configurations\
    \ are done, start the pipeline; this will output the data into a table, as follows:\n\
    \n![](images/Figure-5.28.jpg)\n\n**Figure 5.28:** Delta Live Table output table\n\
    \nAfter understanding the development flow of Delta Live Table, let’s look at\
    \ the use cases of Delta Live Table implementation:\n\n*   **Implement regulatory\
    \ requirements**: We can capture all the information about the table for analytics\
    \ and auditing purposes. We can also understand how the data flows to meet the\
    \ regulatory requirements.\n*   **Simplified data pipeline development, deployment,\
    \ and testing**: We can capture and maintain data lineage information to keep\
    \ the latest data everywhere. We can query the same data in all the environments.\n\
    *   **Less operational complexity with the support for both batch and streaming\
    \ data**: We can build and create both batch and streaming pipelines to capture\
    \ and automate the data refresh, which will save a lot of time and reduce complexity.\n\
    *   Efficient in-built monitoring for data quality, logs, and real-time data updates.\n\
    \n# Delta Live Table configurations\n\nDelta Live Table configuration settings\
    \ has a list of Databricks notebooks that implement the pipeline and parameters,\
    \ which specify how to execute the pipeline in environments like development,\
    \ test, acceptance, and production.\n\nWe can specify the Delta Live Table in\
    \ the form of JSON, and we can also modify the settings from the Delta Live Table\
    \ UI.\n\nNow, let us explore the different Delta Live Table settings in detail:\n\
    \n| Field name | Type | Description |\n| --- | --- | --- |\n| `id` | string |\
    \ Unique pipeline identifier |\n| `name` | string | Pipeline name |\n| `storage`\
    \ | string | DBFS location or cloud storage for pipeline execution output |\n\
    | `configuration` | object | Spark cluster configurations |\n| `Libraries` | array\
    \ of objects | Array of Databricks notebook |\n| `clusters` | array of objects\
    \ | Clusters to run the pipeline |\n| `continuous` | string | Flag to check if\
    \ pipeline run continuous or not |\n| `target` | string | Database name to persist\
    \ pipeline output |\n\n**Table 5.1:** Delta Live Table settings\n\nWe can also\
    \ configure clusters used by the pipelines in the JSON format. We can specify\
    \ configurations for both `default cluster` and `maintenance cluster`:\n\n**Example:**\n\
    \n```\n{\n“clusters”: [\n{\n“label”: “default”,\n“node_type_id”: “c5.4xlarge”,\n\
    “driver_node_type_id”: “c5.4xlarge”,\n“num_workers”: 20,\n“spark_conf”: {\n“spark.databricks.io.parquet.nativeReader.enabled”:\
    \ “false”\n},\n“aws_attributes”: {\n“instance_profile_arn”: “arn:aws:...”\n}\n\
    },\n{\n“label”: “maintenance”,\n“aws_attributes”: {\n“instance_profile_arn”: “arn:aws:...”\n\
    }\n}\n]\n}\n```\n\nWe can also configure multiple notebooks in the pipeline. We\
    \ have to use the `libraries` field to configure the pipeline with the multiple\
    \ notebooks. It is flexible to add the notebooks in order since the Delta Live\
    \ Table will automatically analyze the dependencies between the datasets to build\
    \ the processing graph of the pipeline.\n\nFor example, the following configurations\
    \ will create the pipeline, which includes the datasets defined in `notebook_1`\
    \ and `notebook_2`:\n\n```json\n{\n“name”: “pipeline”,\n“storage”: “dbfs:/pipeline-examples/storage-location/example”,\n\
    “libraries”: [\n{ “notebook”: { “path”: “/notebook_1” } },\n{ “notebook”: { “path”:\
    \ “/notebook_2” } }\n]\n}\n```\n\nThe following example will create configurations\
    \ to trigger the pipeline implemented in `notebook_1` using DBFS for storage and\
    \ run it on one note cluster:\n\n```json\n{\n“name”: “pipeline”,\n“storage”: “dbfs:/pipeline-examples/storage-location/example1”,\n\
    “clusters”: [\n{\n“num_workers”: 1,\n“spark_conf”: {}\n}\n],\n“libraries”: [\n\
    {\n“notebook”: { “path”: “/Users/user@databricks.com/notebook_1” }\n}\n],\n“continuous”:\
    \ false\n}\n```\n\n**We can’t configure the spark version for the cluster configurations.\
    \ Delta Live Table clusters run with the custom version of Databricks runtime,\
    \ which is updated to get the latest updates.**\n\n# Conclusion\n\nIn this chapter,\
    \ we explored the delta live table concepts and its features and components in\
    \ detail. You also understood in detail how to create Delta Live Table pipelines\
    \ using Python, SQL, and REST API. Additionally, you got an overview of how to\
    \ configure different components while creating Delta Live Table pipelines.\n\n\
    # Multiple choice questions\n\n1. Which one of the following can be implemented\
    \ using Delta Live Table? \n    1. Orchestration\n    2. Cluster management\n\
    \    3. Monitoring\n    4. All of the above\n2. Can we implement automation testing\
    \ using Delta Live Table? \n    1. Yes\n    2. No\n3. What type of datasets can\
    \ be used for Delta Table? \n    1. Tables\n    2. Views\n    3. Both\n4. Is it\
    \ possible to create Delta Table pipelines using REST API? \n    1. Yes\n    2.\
    \ No\n5. Can we configure storage while creating Delta Table pipelines? \n   \
    \ 1. Yes\n    2. No\n\n# Answers\n\n1. **d**\n2. **a**\n3. **c**\n4. **a**\n5.\
    \ **a**\n\n# CHAPTER 6\n\n# SCD Type 2 Implementation with Delta Lake\n\nDatabricks\
    \ Lakehouse platform has a capability to enable real-time stream data. In the\
    \ last chapter, we explored how to simplify data engineering using **Delta Live\
    \ Tables**. In this chapter, you will learn about the real-time streaming of data\
    \ using *structured streaming*.\n\n# Structure\n\nIn this chapter, you will learn\
    \ the following aspects of Databricks Lakehouse:\n\n*   Streaming data with structured\
    \ streaming\n*   Change data feed\n\n# Objectives\n\nAfter studying this chapter,\
    \ we will be able to do end-to-end implementation of **SCD Type 2** data historization\
    \ with Databricks.\n\n# Streaming data with structure streaming\n\nWorking with\
    \ streaming data is different from working with batch data. Apache Spark structured\
    \ streaming is built on top of the **Spark API** to leverage its optimization.\
    \ With Spark streaming, we can process the data in near real time from the sources\
    \ and output the data to external systems:\n\n![](images/Figure-6.1.jpg)\n\n**Figure\
    \ 6.1:** Spark streaming: Input, streaming engine, sink\n\nSpark streaming has\
    \ three major components:\n\n![](images/Figure-6.2.jpg)\n\n**Figure 6.2:** Spark\
    \ streaming components\n\n*   **Source input**: Input sources can be streaming\
    \ **Kafka**, **Flume**, **HDFC**, and so on.\n*   **Streaming engine**: Streaming\
    \ engines process incoming data from the various input sources.\n*   **Sink**:\
    \ Sink takes care of storing processed data from the streaming engine like HDFS,\
    \ relational database, or NO SQL database.\n\nLet’s understand spark streaming\
    \ as an unbounded table where the new data will be appended when it arrives in\
    \ future:\n\n![](images/Figure-6.3.jpg)\n\n**Figure 6.3:** Streaming data as an\
    \ unbounded table\n\nSpark will process the data in *micro batches*, which will\
    \ be defined by the trigger that will process the data. Consider an example: when\
    \ we define the trigger as *1 minute*, spark will create the micro batches every\
    \ minute and process them accordingly. While ingesting the data based on the trigger,\
    \ we can output the data in various modes:\n\n*   **Append mode**: In the append\
    \ mode, Spark will only output newly processed records from the last trigger.\n\
    *   **Update mode**: In this mode, Spark will output only updated rows from the\
    \ last trigger. If the aggregation on streaming data is not enabled, then it will\
    \ behave similar to append mode.\n"
