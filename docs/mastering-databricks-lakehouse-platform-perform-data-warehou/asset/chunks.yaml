    这更多是通过扫描存储结果的相应增量表（delta table）来收集记录，该增量表本身具有 `ACID` 能力。因此，作业需要扫描底层的 `Parquet`
    格式数据，并与事务日志进行映射，以返回特定状态下的结果。


    `visualizer`（可视化器）还提供了选项，显示有关已执行作业的额外指标，以便你进一步优化步骤以及计算、内存和存储需求。点击其中一个区块后，你可以进入一个报告，该报告允许你根据
    `scheduler delay`（调度延迟）、`result time`（结果时间）、`JVM heap`、`峰值存储内存`、池内存`、聚合记录大小`等分析执行指标：


    ![](img/Figure-3.16.jpg)


    **图 3.16:** Databricks 审计：DAG 示例


    现在，你可以做的下件事是再次点击 `Job`；正如书开头建议的那样，你那里可以发现将任务分解为更层级的阶段和作业（如有无环图）。一个作业可以在多个阶段中完成，取决于操作的复杂程度及其处理方式。在本例所示的
    `Spark 2.0` 及更高版本中，这些作业以及底层处理大部分是自动的。然而，分析这些步骤中的每一个都能让你有机会进一步了解它们并进一步优化你的操作。虽然这里的示例已经通过
    Databricks 底层的 `Spark` 引擎进行了优化（因为我们只是在查询 delta lake），但当你深入到 notebook 中的阶段和单元格，那里发生了来自不同源的数据收集和过滤时，你将开始高效节地优化你的数据流。`visualizer`
    非常易于理解，你只需要在阶段和作业之间切换几次，然后查看执行统计数据，例如`完成作业数`、`描述`、`过滤`：


    ![](img/Figure-3.17.jpg)


    **图 3.17:** Databricks 审计：列表


    最重要的作业是 `job`，它将来自不同阶段的结果收集在一起，并最终为你提供结果。在 `job` 中，所有的操作都是收集和合并（union）以产生结果。在这里的结束阶段（end
    stage），我们看到它正在执行 `projection`（投影）、`shuffling`（洗牌）、`merging`（合并）和 `union`并）来完成任务。注意这里的
    `union` 术语，并尝试在同一章节之前的图表中找到它；你能够联系人类如何思考并将任务分配给分布式操作，以及如何合并输出结果以产生最终结果。正如你在接下来的图中所所示，少数阶段被跳过了，这就是
    `Spark` 通过不重复操作实现的自动优化水平：


    ![](img/Figure-3.18.jpg)


    **图 3.18:** Databricks 审计：带有隔离、收集和合并的 Dag


    一旦你实现了可视化，使用 Databricks 构建 ETL 流水线来就变得简单了。由于 Databricks 允许你的 notebook 进行调度，你可以在将数据加载到目的地之前，创建多个
    notebook 来描述不同的阶段。这被称为 `orchestration`（编排），下一章将对此详细介绍。


    # 使用 Databricks 构建审计框架


    提到数据质量时，预期值与实际提供之间总是存在冲突。如果你正在构建数据仓库，你的系统需要确保以下点：


    *   `Validity`（有效性）

    *   `Velocity`（速度性）

    *   `Versioning`（版本性）

    *   `Veracity`（真实性）


    注意不要与大数据的 `4Vs` 混淆：


    *   `Validity`：你是否能够在数据问题到达并污染你的数据仓库之前，有效地对数据质量进行验证和报告？

    *   `Versioning`：你多快可以适应模式和数据变化？能否对更改进行时间回溯（time travel）？你是否符合监管要求，使你的系统在谁在何时做了什么以及何时报告方面具有可审计性？是否具有可以回滚的质量？

    *   `Velocity`：你多快可以适应模式和数据变化？或者当加载失败或审查停止时，系统多快开始向仓库填充数据？

    *   `Veracity`：涉及数据的一致性、准确性、质量和可靠性，可以通过处理数据流中的偏差、噪声和异常来实现。


    # 它有什么帮助？


    构建数据质量以及通用审计框架有助于保护你的数据湖/数据仓库免受人为、系统、监管和治理冲突的影响，并确保你的数据仓库/数据湖在 `4V` 上稳固。审计框架可以用多种语言构建，并且有不同的方法来构建和实现它们。


    在本节中，我们将关注 `Databricks` 和 `Azure Data Factory`，利用 `Databricks` 和 `Spark` 为 Delta
    Lake 提供的功能来构建审计框架。让我们来看一个典型的从 `flat-file source` 加载数据的场景，数据从广泛使用的文件格式（如 `CSV`
    或 `JSON`）加载。


    有了 delta 表和 `Databricks` 等技术的出现，不再需要将其直接移动到数据库或编写自定义代码来验证和加载数据。现在数据可以通过 `Databricks`
    在落地区（landing zones）编写的脚本进行加载，并转换为 `Parquet` 或 `Delta` 格式，以便于操作和高级的时间驱动变更跟踪（无论是模式变化还是数据变化）。一旦数据进入
    Delta Lake，像 `validate`（验证）、`clean`（清洗）和 `transform`（转换）等操作可以通过一致的数据操作轻松处理，这些操作支持`原子性、一致性、隔离性和持久性`（`ACID`）以及并行执行。由于
    `SQL` 查询可以轻松地应用于 delta 表，验证规则可以以数据工程师和分析师理解的语言轻松编写：`SQL`。


