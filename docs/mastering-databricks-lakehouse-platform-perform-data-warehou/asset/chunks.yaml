    \ and aggregate data quality metrics across all of your pipelines.\n\nYou can\
    \ easily configure it either via JSON or using the wizard in the `Job` section.\
    \ You can also edit the pipeline using the `Edit Pipeline Settings`, as follows:\n\
    \n![](images/Figure-4.34.jpg)\n\n**Figure 4.34:** Databricks orchestration: Pipeline\
    \ settings\n\n# Running jobs via Databricks job API\n\nYou can perform multiple\
    \ type of rest-based operations:\n\n*   Create\n\n*   Runs submit\n\n*   Update\n\
    \n*   Reset\n\n*   List\n\n*   Get\n\n*   Runs get\n\n*   Runs get output\n\n\
    *   Runs list\n\nThey are explained as follows:\n\n*   **Create**: To create a\
    \ single-task format job through the `Create a new job`` operation (POST /jobs/create)`\
    \ (**[https://docs.databricks.com/dev-tools/api/latest/jobs.html](https://docs.databricks.com/dev-tools/api/latest/jobs.html)**)\
    \ in the jobs API, you do not need to change existing clients.\n\n    To create\
    \ a multi-task format job, use the `Tasks` field in `Job Settings` to specify\
    \ settings for each task. The following example creates a job with two notebook\
    \ tasks. This example is for **API 2.0** and **2.1**:\n\n    `{`\n\n    `“name”:\
    \ “Multi-task-job Test”,`\n\n    `“max_concurrent_runs”: 1,`\n\n    `“tasks”:\
    \ [`\n\n    `{`\n\n    `“task_key”: “Pull Sql data”,`\n\n    `“description”: “pull\
