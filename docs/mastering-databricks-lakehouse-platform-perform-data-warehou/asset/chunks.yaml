- fmt: "\n`Feature definitions` are applied to raw data to generate machine learning\
    \ features as a data frame and save the data frame to the feature registry using\
    \ the feature store APIs. Feature definitions stored in the feature stores are\
    \ version controlled and enable us to provide traceability, reproduction, and\
    \ audit as needed:\n\n```\ndef compute_features(data):\nfeatures = ShopSales()\n\
    fv_mnths = features.total_sales.multiply(“i_category”, [“Dance”, “Rent”, “Clothes”]).multiply(“month_id”,\
    \ [202012, 202011, 202010])\ndf = append_features(src_df, [features.collector],\
    \ fv_mnths)\nreturn df\n\nfeatures_df = compute_features(src_df)\n```\n\nThe preceding\
    \ example code shows how we can create feature definitions and register those\
    \ features to the feature stores.\n\n# Base feature definition\n\nSpark API has\
    \ powerful functions for Data Engineering that can be used to perform feature\
    \ engineering with a wrapper to reduce the complexity and promote the reusability.\
    \ Feature class provides an interface to define features with the following components:\n\
    \n* `_base_col`: Column or other features that are columnar expressions.\n* `list\
    \ of conditions`: If the expression is `True`, then logic defined in `_base_col`\
    \ will be taken as the feature. Otherwise, the feature will be calculated using\
    \ the `_negative_value``.\n* `_negative_value`: Evaluated if the `_filter` returns\
    \ `False`.\n* `_agg_func`: This will define the Spark SQL functions to aggregate\
    \ the base column.\n\n# Feature modularization\n\nThe most common challenge faced\
    \ by data scientists while performing feature engineering is that Data Science\
    \ teams are defining their own features, but those feature definitions are not\
    \ well documented and easily visible and accessible by other Data Science teams\
    \ for the reusability.\n\nDue to the lack of visibility of feature sharing, it\
    \ results in duplicate efforts, code and features with the same use but different\
    \ logic and result. Modularizing the feature definitions can help Data Scientists\
    \ to overcome the mentioned challenges.\n\nModule is implemented as a `feature\
    \ family` that we can call a collection of features. A `read-only` property is\
    \ defined for each feature to provide easy access. A feature family extends an\
    \ `ImmutableDictBase` class that is generic and can serve as base class for collections\
    \ of features, filters, and other objects.\n\n# Feature operations\n\nFeature\
    \ can be extended to include higher-order functions, which reduces verbosity,\
    \ enables reusability, and improves feature definition.\n\n# Features vectors\n\
    \nFeature operations can be further simplified by storing the features with the\
    \ same operations in a vector. Feature vector can be created from a feature dictionary\
    \ by listing feature names.\n\nExample is as follows:\n\n```\nfeatures = Features()\n\
    fvctr = FeatureVector.create_by_names(features, [`“total_cost”`, `“total_transactions”`])\n\
    \n# Features definition governance\n\nDatabricks notebooks manage and track the\
    \ versions of the feature definitions that can be integrated with the GitHub repos.\
    \ Automated job will run the functional and integration test against the newly\
    \ created features. We can also perform the additional stress tests to determine\
    \ its impact on the performance. Once all types of testing are completed and code\
    \ is approved, the feature definitions will be deployed to the production environments.\n\
    \n`MLflow tracking tracks and logs` ([https://www.mlflow.org/docs/latest/tracking.html](https://www.mlflow.org/docs/latest/tracking.html))\
    \ the code version and source data when building models from the features. `mlflow.spark.autolog()`\
    \ enables and configures logging of Spark `data source path`, version`, `and format.`\n\
    \n# Features explorations\n\nAs the number of features increases, it becomes difficult\
    \ to browse and find specific feature definitions. An `abstracted feature` class\
    \ will help us add a description attribute for each feature.\n\nThe following\
    \ image shows the overall mapping of the created machine learning features from\
    \ the raw data using the process mentioned previously:\n\n![](images/Figure-7.18.jpg)\n\
    \n**Figure 7.18:** Feature engineering mapping for raw data with ML features\n\
    \n# Setting up MLflow project with model repository\n\nMLflow model registry provides\
    \ a user interface and API to centrally manage machine learning models and their\
    \ lifecycles.\n\nModel registry has few concepts to describe the full life cycle\
    \ of an MLflow model:\n\n* **Model**: An MLflow model is created from the experiment\
    \ logged with machine learning model flavor’s using the `mlflow.<model_flavor>.log_model()`\
    \ method. Once it is logged, the model will then be registered with the model\
    \ registry.\n* **Registered model**: We can register an MLflow model with the\
    \ model registry. Registered model has a unique name, which consists of unique\
    \ names, versions, model lineage, and metadata.\n* **Model version**: Each registered\
    \ machine learning model has one or many versions. When we add a new model to\
    \ the model registry, it is added as `version 1`. Every time the new model is\
    \ registered for the same model, the same model name increments the version number.\n\
    * **Model stage**: We can assign different model versions one stage at any time.\
    \ MLflow has various predefined stages like `staging`, `production`, and `archived`.\
    \ We can move from one stage to another easily.\n* **Annotations and descriptions**:\
    \ We can annotate top-level models and versions using the mark down, including\
    \ the description and other relevant information:\n\n![](images/Figure-7.19.jpg)\n\
    \n**Figure 7.19:** MLflow model serving with Databricks\n\nNow, let us explore\
    \ in detail how the model registry workflow works.\n\nWe must use a database backed\
    \ store to access the model registry using the API or user interface.\n\n# UI\
    \ workflow\n\n* **Register a model to MLflow**\n\n  In order to register the model,\
    \ select the logged model from the `Artifacts` section of the `Run` detail page:\n\
    \n  ![](images/Figure-7.20.jpg)\n\n  **Figure 7.20:** Register MLflow model\n\n\
    \  Then, click on the `Register Model` button to register the model in the model\
    \ registry. Once we click on the button, a pop-up box will appear. In the `Model\
    \ Name` field, provide the unique name to identify the model. Select the existing\
    \ model from the dropdown in case you want to pick up the existing:\n\n  ![](images/Figure-7.21.jpg)\n\
    \n  **Figure 7.21:** Register MLflow model\n\n* **Use model registry**\n\n  In\
    \ order to view the model properties, navigate to the `Registered Models` page:\n\
    \n  ![](images/Figure-7.22.jpg)\n\n  **Figure 7.22:** Registered MLflow models\n\
    \n  In order to know more about the model, go to the `Artifacts` section of the\
    \ run detail page and click on the model version in the top right to view the\
    \ version created:\n\n  ![](images/Figure-7.23.jpg)\n\n  **Figure 7.23:** Artifacts\n\
    \n  Each model has an *overview* page, which shows the active versions:\n\n  ![](images/Figure-7.24.jpg)\n\
    \n  **Figure 7.24:** MLflow model overview\n\n  Now, click on `Version 1` to know\
    \ more about the version details:\n\n  ![](images/Figure-7.25.jpg)\n\n  **Figure\
    \ 7.25:** MLflow model version details\n\n  From the *Version details* page, we\
    \ can view the model version details and the current stage of the model version.\
    \ In the top left corner, there is a drop-down menu that shows how the model transitioned\
    \ from one stage to another valid stage:\n\n  ![](images/Figure-7.26.jpg)\n\n\
    \  **Figure 7.26:** MLflow model stages\n\n# API workflow\n\nAnother way to interact\
    \ with the model registry is using the API workflow with MLflow model flavor or\
    \ MLflow client tracking API interface.\n\nThere are multiple ways to add models\
    \ to the registry:\n"
  raw: "    **Feature definitions** are applied to raw data to generate machine learning\
    \ features as a data frame and save the data frame to the feature registry using\
    \ the feature store APIs. Feature definitions stored in the feature stores are\
    \ version controlled and enable us to provide traceability, reproduction, and\
    \ audit as needed:\n\n    `def compute_features(data):`\n\n    `features = ShopSales()`\n\
    \n    `fv_mnths = features.total_sales.multiply(“i_category”, [“Dance”, “Rent”,\
    \ “Clothes”]).multiply(“month_id”, [202012, 202011, 202010])`\n\n    `df = append_features(src_df,\
    \ [features.collector], fv_mnths)`\n\n    `return df`\n\n    ` features_df = compute_features(src_df)`\n\
    \n    The preceding example code shows how we can create feature definitions and\
    \ register those features to the feature stores.\n\n# Base feature definition\n\
    \nSpark API has powerful functions for Data Engineering that can be used to perform\
    \ feature engineering with a wrapper to reduce the complexity and promote the\
    \ reusability. Feature class provides an interface to define features with the\
    \ following components:\n\n*   `_base_col`: Column or other features that are\
    \ columnar expressions.\n\n*   `list of conditions`: If the expression is *True*,\
    \ then logic defined in `_base_col` will be taken as the feature. Otherwise, the\
    \ feature will be calculated using the `_negative_value``.`\n\n*   `_negative_value`:\
    \ Evaluated if the `_filter` returns *False*.\n\n*   `_agg_func`: This will define\
    \ the Spark SQL functions to aggregate the base column.\n\n# Feature modularization\n\
    \nThe most common challenge faced by data scientists while performing feature\
    \ engineering is that Data Science teams are defining their own features, but\
    \ those feature definitions are not well documented and easily visible and accessible\
    \ by other Data Science teams for the reusability.\n\nDue to the lack of visibility\
    \ of feature sharing, it results in duplicate efforts, code and features with\
    \ the same use but different logic and result. Modularizing the feature definitions\
    \ can help Data Scientists to overcome the mentioned challenges.\n\nModule is\
    \ implemented as a *feature family* that we can call a collection of features.\
    \ A *read-only* property is defined for each feature to provide easy access. A\
    \ feature family extends an `ImmutableDictBase` class that is generic and can\
    \ serve as base class for collections of features, filters, and other objects.\n\
    \n# Feature operations\n\nFeature can be extended to include higher-order functions,\
    \ which reduces verbosity, enables reusability, and improves feature definition.\n\
    \n# Features vectors\n\nFeature operations can be further simplified by storing\
    \ the features with the same operations in a vector. Feature vector can be created\
    \ from a feature dictionary by listing feature names.\n\nExample is as follows:\n\
    \n`features = Features`()\n\n`fvctr = FeatureVector`.create_by_names(features,\
    \ [`“total_cost”`, `“total_transactions”`])\n\n# Features definition governance\n\
    \nDatabricks notebooks manage and track the versions of the feature definitions\
    \ that can be integrated with the GitHub repos. Automated job will run the functional\
    \ and integration test against the newly created features. We can also perform\
    \ the additional stress tests to determine its impact on the performance. Once\
    \ all types of testing are completed and code is approved, the feature definitions\
    \ will be deployed to the production environments.\n\n`MLflow tracking tracks\
    \ and logs` (**[https://www.mlflow.org/docs/latest/tracking.html](https://www.mlflow.org/docs/latest/tracking.html)**)`\
    \ the code version and source data when building models from the features. mlflow.spark.autolog()\
    \ enables and configures logging of Spark` data source` path, version`, `and format.`\n\
    \n# Features explorations\n\nAs the number of features increases, it becomes difficult\
    \ to browse and find specific feature definitions. An *abstracted feature* class\
    \ will help us add a description attribute for each feature.\n\nThe following\
    \ image shows the overall mapping of the created machine learning features from\
    \ the raw data using the process mentioned previously:\n\n![](images/Figure-7.18.jpg)\n\
    \n**Figure 7.18:** Feature engineering mapping for raw data with ML features\n\
    \n# [Setting up MLflow project with model repository](#toc.xhtml#s113a)\n\nMLflow\
    \ model registry provides a user interface and API to centrally manage machine\
    \ learning models and their lifecycles.\n\nModel registry has few concepts to\
    \ describe the full life cycle of an MLflow model:\n\n*   **Model**: An MLflow\
    \ model is created from the experiment logged with machine learning model flavor’s\
    \ using the `mlflow.<model_flavor>.log_model()` method. Once it is logged, the\
    \ model will then be registered with the model registry.\n\n*   **Registered model**:\
    \ We can register an MLflow model with the model registry. Registered model has\
    \ a unique name, which consists of unique **names**, **versions**, **model lineage**,\
    \ and **metadata**.\n\n*   **Model version**: Each registered machine learning\
    \ model has one or many versions. When we add a new model to the model registry,\
    \ it is added as *version 1*. Every time the new model is registered for the same\
    \ model, the same model name increments the version number.\n\n*   **Model stage**:\
    \ We can assign different model versions one stage at any time. MLflow has various\
    \ predefined stages like **staging**, **production**, and **archived**. We can\
    \ move from one stage to another easily.\n\n*   **Annotations and descriptions**:\
    \ We can annotate top-level models and versions using the mark down, including\
    \ the description and other relevant information:\n\n![](images/Figure-7.19.jpg)\n\
    \n**Figure 7.19:** MLflow model serving with Databricks\n\nNow, let us explore\
    \ in detail how the model registry workflow works.\n\nWe must use a database backed\
    \ store to access the model registry using the API or user interface if we are\
    \ running our own MLflow server. Before we add a model to the model registry,\
    \ we must log the same using the `log_model` methods. Once we log the model, we\
    \ can add, modify, update, or delete the model stored in the model registry.\n\
    \n# UI workflow\n\n*   **Register a model to MLflow model registry**\n\n    In\
    \ order to register the model, select the logged MLflow model from the `Artifacts`\
    \ section from the MLflow `Run` detail page:\n\n    ![](images/Figure-7.20.jpg)\n\
    \n    **Figure 7.20:** Register MLflow model\n\n    Then, click on the `Register\
    \ Model` button to register the model in the MLflow model registry. Once we click\
    \ on the button, a pop-up box will appear. In the `Model Name` field, provide\
    \ the unique name to identify the model. Select the existing model from the dropdown\
    \ in case you want to pick up the existing model:\n\n    ![](images/Figure-7.21.jpg)\n\
    \n    **Figure 7.21:** Register MLflow model\n\n*   **Use model registry**\n\n\
    \    In order to view the model properties, navigate to the `Registered Models`\
    \ page:\n\n    ![](images/Figure-7.22.jpg)\n\n    **Figure 7.22:** Registered\
    \ MLflow models\n\n    In order to know more about the model, go to the `Artifacts`\
    \ section of the run detail page and click on the model version in the top right\
    \ to view the version created:\n\n    ![](images/Figure-7.23.jpg)\n\n    **Figure\
    \ 7.23:** Artifacts\n\n    Each model has an *overview* page, which shows the\
    \ active versions:\n\n    ![](images/Figure-7.24.jpg)\n\n    **Figure 7.24:**\
    \ MLflow model overview\n\n    Now, click on `Version 1` to know more about the\
    \ version details:\n\n    ![](images/Figure-7.25.jpg)\n\n    **Figure 7.25:**\
    \ MLflow model version details\n\n    From the *Version details* page, we can\
    \ view the model version details and the current stage of the model version. In\
    \ the top left corner, there is a drop-down menu that shows how the model transitioned\
    \ from one stage to another valid stage:\n\n    ![](images/Figure-7.26.jpg)\n\n\
    \    **Figure 7.26:** MLflow model stages\n\n# API workflow\n\nAnother way to\
    \ interact with the model registry is using the API workflow with MLflow model\
    \ flavor or MLflow client tracking API interface.\n\nThere are multiple ways to\
    \ add models to the registry:"
