    # [Building an audit framework with Databricks](#toc.xhtml#s77a)


    When it comes to data quality, there is always contention between what was expected
    versus what was provided. If you are building a warehouse, your system needs to
    assure you of the following:


    *   Validity


    *   Velocity


    *   Versioning


    *   Veracity


    Not to be confused with **4Vs** of big data:


    *   **Validity** is *Are you able to effectively validate and report on data quality
    issues before they reach and dirty your data warehouse?*


    *   **Versioning** is *How fast can you accommodate schema and data changes, can
    you time travel with your changes, and are you compliant with regulatory requirements
    of making your system auditable in terms of who did what, and when can you report
    it. Does it have a quality to roll back.*


    *   **Velocity** is *How fast can you accommodate schema and data changes, or
    When there is a load failure or review stop, how fast can the system start populating
    data to the warehouse*.


    *   **Veracity** *is related to consistency, accuracy, quality, and trustworthiness
    of data which can be achieved by handling the biasedness, noise and abnormality
    in data flow.*


    # How does it help?


    Building a data quality as well as general governance audit framework helps save
    your data lake/warehouse from the human, system, regulatory, and governance conflicts,
    and ensures that your data warehouse/data lake house stands strong on 4V.


    Audit frameworks can be built in multiple languages, and there are several different
    approaches to building and implementing the same.


    In this section, we will focus on Databricks and Azure Data Factory to build an
    audit framework using the capabilities that Databricks and Spark provide with
    Delta Lake.


    Let’s take a typical data load scenario from a *flat-file source*, where the data
    is being loaded from widely used file formats, such as **CSV** or **JSON**.


    With the presence of technologies like delta tables and Databricks, it’s no longer
    required to move it directly to databases or write custom code to validate and
    load data.


    Data can now be loaded via scripts written in Databricks in landing zones and
    converted to Parquet or Delta format directly to enable easy operation and advance
    time-driven change tracking, be it a change in schema or data.


    Once the data is in Delta Lake, operations like **validate**, **clean**, and **transform**
    can be handled easily with consistent data operations that support **Atomicity,
    Consistency, Isolation, and Durability** (**ACID**) as well as parallel executions.


    As SQL queries can be applied easily on delta tables, validation rules can be
    easily written in a language that Data Engineers and Analysts understand: SQL.


    Data can be loaded using scripts in Databricks, and as shown in the example in
    this chapter, the loaded data can be converted into a delta table where another
    set of scripts written in Databricks notebook can run validation logic and generate
    validation output with rejected data or warning messages in another delta table,
    or an OLTP source. This can be SQL and oracle, which can be easily fed to tools
    like Power BI and Tableau to generate validation reports based on the data load
    activity.


    Based on the outcome, extra triggers can be embedded into the load to stop processing
    further or accommodate the schema to the incoming acceptable changes.


    Some of the basic validation rules can be **Validate Column Name**, **Check Data
    Types**, **Validate Data Length (Boundary Value Analysis)**, and **Validate Referential
    Integrity**.


    These all flow written in multiple notebook files under Databricks can be orchestrated
    to be scheduled and executed through the Azure Data Factory.


    **Azure Data Factory** is a data-integration service based on the cloud that allows
    us to create data-driven workflows in the cloud for orchestrating and automating
    data movement and data transformation. Azure Data Factory is a data pipeline tool
    that can be used for data processing as well as orchestrating data movement through
    different sources and tools like Databricks:


    ![](images/Figure-3.19.jpg)


    **Figure 3.19:** Databricks audit: Audit framework


    A typical validation flow with Azure Data Factory and Databricks:


    ![](images/Figure-3.20.jpg)


