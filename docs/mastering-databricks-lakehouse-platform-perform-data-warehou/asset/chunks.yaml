    \ integer (nullable = true)`\n\n`|-- c_first_sales_date_sk: integer (nullable\
    \ = true)`\n\n`|-- c_first_name: string (nullable = true)`\n\n`|-- c_last_name:\
    \ string (nullable = true)`\n\n`|-- c_birth_day: integer (nullable = true)`\n\n\
    `|-- c_birth_month: integer (nullable = true)`\n\n`|-- c_birth_year: integer (nullable\
    \ = true)`\n\n`|-- c_birth_country: string (nullable = true)`\n\n`|-- c_email_address:\
    \ string (nullable = true)`\n\n1.  The first step is to convert the tables to\
    \ the *delta format* using the following command:\n\n    `CONVERT TO DELTA customers`\n\
    \n2.  The second step is to delete the personal information of those who requested\
    \ to remove the PII information:\n\n    ``DELETE FROM `customers` AS t1 WHERE\
    \ EXISTS (SELECT c_customer_id FROM cust_dlt_keys WHERE t1.c_customer_id = c_customer_id)``\n\
    \n3.  The second last step is to clean up the stale data. Depending on how long\
    \ a consumer has requested to delete the data from the Data Lake, we need to delete\
    \ table history and underlying raw data from the Data Lake.\n\n    By default,\
    \ using the following command, we can remove stale data for 7 days:\n\n    `VACUUM\
    \ customers`\n\n4.  If we want to remove artifacts younger than *7 days*, use\
    \ the following command:\n\n    `VACUUM customers RETAIN 100 HOURS`\n\nIn addition\
    \ to this, it is also recommended to set up the retention policy to avoid storing\
    \ any sensitive personal data that is not intended to be stored.\n\n# [Conclusion](#toc.xhtml#s142a)\n\
    \nIn this chapter, you learned how to perform hyperparameter tuning with Hyperopt\
    \ for the Delta Lake. We also understood in detail how to perform access control\
    \ and secret management. Then, we did a quick tour of cluster configuration and\
    \ its policies. Then, we also understood in detail the importance of data governance\
    \ and how Databricks can help us create well governed data solutions using Databricks.\
    \ At the end, we also explored how Databricks’ Delta Lake solution helps enterprise\
    \ organizations to become GDPR- and CCPA-compliant.\n\n# [Multiple choice questions](#toc.xhtml#s143a)\n\
    \n1.  Can we authenticate directly to ADLS Gen2 using credential passthrough?\
    \ \n\n    1.  Yes\n\n    2.  No\n\n2.  Which format is used to store cluster policies?\
    \ \n\n    1.  JSON\n\n    2.  CSV\n\n    3.  ORC\n\n    4.  All of the above\n\
    \n3.  Can we enable access control lists for granular access management in Databricks\
    \ platform? \n\n    1.  Yes\n\n    2.  No\n\n4.  Does Delta Lake support ACID\
    \ transactions? \n\n    1.  Yes\n\n    2.  No\n\n5.  Can we create Databricks\
    \ workspace cluster using the API? \n\n    1.  Yes\n\n    2.  No\n\n# [Answers](#toc.xhtml#s144a)\n\
    \n1.  **a**\n\n2.  **a**\n\n3.  **b**\n\n4.  **b**\n\n5.  **b**\n\n# [Index](#toc.xhtml#ind)\n\
