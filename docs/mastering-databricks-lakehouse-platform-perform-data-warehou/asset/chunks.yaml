    \ SQL queries and query history. If a custom key is already configured to encrypt\
    \ data for the managed services, no configuration is required. Custom encryption\
    \ key only encrypts the data at rest; it doesn’t encrypt the data in transit.\n\
    \n    *   **Custom key to encrypt query result:** It is also possible to encrypt\
    \ the query result to avoid exposing sensitive data during the query execution\
    \ with Databricks SQL. Now, let us see how to create a table with records from\
    \ the Databricks dataset and allow users to access the table. We can add the users\
    \ using the admin console and by clicking on the `Add User` button from the `Users`\
    \ tab, as follows:\n\n        ![](images/Figure-2.34.jpg)\n\n        **Figure\
    \ 2.34:** Databricks admin console - add users"
