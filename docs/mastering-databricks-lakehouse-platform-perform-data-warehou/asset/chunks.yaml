  trans: "\n\n## 参考: [`databricks.com/blog/2021/05/26/introducing-delta-sharing-an-open-protocol-for-secure-data-sharing.html`](https://databricks.com/blog/2021/05/26/introducing-delta-sharing-an-open-protocol-for-secure-data-sharing.html)\n\
    \n### 实例配置文件 (Instance profile)\n\n也可以使用实例配置文件来保护存储在 Databricks 中的数据。但使用实例配置文件的一个前提条件是\
    \ `IAM role` 必须具有访问 `S3` 存储桶的强制性权限。此外，我们必须将实例配置文件添加到 Databricks 工作区中：\n\n![](img/Figure-10.6.jpg)\n\
    \n**图 10.6:** Databricks 实例配置文件\n\n集群创建后，我们需要确保只有授权的用户可以访问该笔记本（notebook），并拒绝未授权用户的访问：\n\
    \n![](img/Figure-10.7.jpg)\n\n**图 10.7:** Databricks 集群权限设置\n\n### 凭证透传 (Credential\
    \ passthrough)\n\n使用 Databricks 的 `IAM credential passthrough`，我们可以使用登录 Databricks\
    \ 的身份自动验证从 Databricks 集群访问 `S3` 存储桶。当我们创建一个新的 Databricks 集群时，可以启用凭证透传：\n\n![](img/Figure-10.8.jpg)\n\
    \n**图 10.8:** Databricks 凭证透传 - 高并发集群\n\n为了为标准集群启用凭证透传，请使用以下选项：\n\n![](img/Figure-10.9.jpg)\n\
    \n**图 10.9:** Databricks 凭证透传 - 标准集群\n\n### 表格访问控制 (Table access control)\n\n\
    我们可以在工作区中启用表访问控制，以便通过 `Spark SQL API` 程序化地对数据访问进行授予、拒绝和撤销。例如，考虑一个存储财务数据的企业组织。公司希望分析师使用这些数据创建财务报告。然而，数据可能包含机密信息，分析师不应访问这些信息。我们可以为用户或组提供读取某个表的权限，但拒绝访问第二个表的所有权限。\n\
    \n在接下来的插图中，管理员为分析师 `user A` 提供了读取 `shared_table` 的权限，但拒绝了访问 `other data` 的所有权限。\n\
    \n```\n%sql\nGRANT Select on Table BFS.shared_table To userA@comp.com\n```\n\n\
    为了拒绝访问其他数据，我们可以拒绝相关权限：\n\n```sql\n%sql\nDENY ALL Privileges on table BFS.private\
    \ TO userA@comp.com\n```\n\n![](img/Figure-10.10.jpg)\n\n**图 10.10:** Databricks\
    \ - 表访问控制\n\n# 集群配置与策略 (Cluster configuration and policies)\n\n为了正确管理数据库，我们可以使用\
    \ Databricks 集群策略来配置和管理具有权限的集群并控制成本。集群策略允许 Databricks 管理员创建集群属性，如实例类型、节点和标签。Databricks\
    \ 集群管理员可以创建策略并分配给用户或组。因此，管理员可以决定谁应该拥有集群访问权限以及应该存在什么类型的集群配置。\n\n我们可以使用 `JSON` 文件定义集群策略。一旦创建了\
    \ `JSON` 文件，可以使用集群策略 UI 或集群策略 API 创建集群策略：\n\n![](img/Figure-10.11.jpg)\n\n**图\
    \ 10.11:** 集群策略 UI\n\n我们可以使用以下端点 API 定义创建集群策略：\n\n![](img/Figure-10.12.jpg)\n\n\
    **图 10.12:** 集群策略 API\n\n`Databricks 工作区用户只有在拥有` `required permission: create_cluster`\
    \ 权限或某个集群策略时才能创建集群。工作区管理员可以创建所需的策略并将其分配给用户，以便他们能够创建集群。\n\n在接下来的截图中，我们正在创建一个名为\
    \ `Project Team,` 的集群策略，并根据策略定义创建集群：\n\n![](img/Figure-10.13.jpg)\n\n**图 10.13:**\
    \ 集群创建期间的 Databricks 集群策略\n\n也可以自动配置集群并授予集群权限。通过用于集群和权限端点的 `REST API`，可以轻松地为用户和组配置集群资源并授予权限。此外，我们还可以为集群使用实例配置文件直接访问任何相应的存储。\n\
    \n以下是一个可能适用于新分析项目团队的配置示例。\n\n需求如下：\n\n*   支持能够同时处理 SQL 和 Python 的团队交互式工作负载。\n\
    *   每个用户将获得集群资源的等额份额。\n*   配置内存优化的实例类型。\n*   授予集群权限，使得只有有限的用户可以访问它。\n\n我们可以使用集群和权限\
    \ API 中的端点部署这些配置。使用以下端点，我们可以创建一个集群。\n\n**端点 (Endpoint)**: `https://<databricks-instance>/api/2.0/clusters/create`\n\
    \n这是一个示例：\n\n```json\n{\n  \"autoscale\": {\n    \"min_workers\": 5,\n    \"max_workers\"\
    : 30\n  },\n  \"cluster_name\": \"project team\",\n  \"spark_version\": \"latest-stable-scala2.11\"\
    ,\n  \"spark_conf\": {\n    \"databricks.profile\": \"serverless\",\n    \"databricks.allowedLanguages\"\
    : \"sql,python\"\n  },\n  \"aws_attributes\": {\n    \"first_demand\": 1,\n  \
    \  \"availability\": \"SPOT_WITH_FALLBACK\",\n    \"zone_id\": \"us-east-1a\"\
    ,\n    \"instance_profile\": \"arn:aws:iam::826xxx66:instance-profile/test-iam-role\"\
    ,\n    \"spot_bid_percent\": 100,\n    \"ebs_volume_type\": \"GENERAL_PURPOSE_SSD\"\
    ,\n    \"ebs_volume_count\": 1,\n    \"ebs_volume_size\": 100\n  },\n  \"node_type\"\
    : \"r4.2xl\",\n  \"ssh_public_keys\": [],\n  \"custom_tags\": {\n    \"ResourceClass\"\
    : \"Serverless\",\n    \"team\": \"new-project-team\"\n  },\n  \"spark_env_vars\"\
    : {\n    \"PYSPARK_PYTHON\": \"/databricks/python3/python3\"\n  },\n  \"autotermination_minutes\"\
    : 60,\n  \"enable_elastic_disk\": \"true\",\n  \"init_scripts\": []\n}\n```\n\n\
    在 Databricks 中配置访问控制和数据访问管理是创建数据治理解决方案的关键。但端到端的解决方案需要对数据的审计访问并创建监控能力。Databricks\
    \ Lakehouse 平台拥有丰富的审计事件，用于记录 Databricks 用户的操作：\n\n![](img/Figure-10.14.jpg)\n\n\
    **图 10.14:** Databricks 审计日志\n\n**参考: [`databricks.com/blog/2020/03/25/trust-but-verify-with-databricks.html`](https://databricks.com/blog/2020/03/25/trust-but-verify-with-databricks.html)**\n\
    \n### 审计日志（续）\n\n为了配置审计日志，我们必须配置正确的访问策略，以便 Databricks 将审计日志投送到 S3 存储桶。审计日志定期投递到\
    \ S3 存储桶，并在当日结束后 72 小时内交付。\n\n我们可以根据需求配置多种类型的审计事件，以跟踪审计事件、参数和日志方案的状态。\n\n# 数据治理\
    \ (Data governance)\n\nDatabricks 安全与信任中心提供了有关如何在 Databricks Lakehouse 平台的每一层设置安全的信息。它使企业组织能够满足监管要求。这些信息包含以下内容：\n\
    \n*   平台安全和治理功能列表\n*   平台针对每个云提供商所需的合规标准\n*   帮助评估 Databricks 平台与合规要求兼容性的工具包\n\
    *   Databricks 隐私指南\n\n![](img/Figure-10.15.jpg)\n\n**图 10.15:** 数据治理框架\n\n"
- fmt: "\nOne of the major criteria for successful data governance is to ensure data\
    \ security across enterprise organizations. Data teams should have visibility\
    \ of how the data is being accessed by the enterprise organizations. Having a\
    \ data governance solution in place helps protect the data from unauthorized access\
    \ and also helps meet regulatory requirements. One of the major challenges faced\
    \ by enterprise organizations is to secure the data and make sure it is being\
    \ managed as per the security controls defined within the organizations. Regulatory\
    \ bodies across the world are changing the way we capture and store data. Typical\
    \ challenges faced by the enterprise organization are as follows:\n\n* Do current\
    \ tools support access controls on the data in the cloud? Do they support inbuilt\
    \ logging of activities happening on the data?\n* Will the security and monitoring\
    \ solution now scale as demand on the data in the Data Lake? It should be easy\
    \ to provision and monitor data access for a small number of users. What happens\
    \ when we expose a data lake to large users?\n* How to proactively monitor data\
    \ access policies?\n* How to identify gaps in the existing data security solution?\n\
    \nDatabricks addresses the preceding challenges in multiple ways:\n\n### Manage\
    \ access to data and objects\n\n**Unity Catalog** centrally stores data, metadata,\
    \ and organization’s data. Data governance rules scale, regardless of the number\
    \ of workspaces or the business intelligence tools enterprise organization uses.\
    \ It grants workspaces access to each metastore and manages access to the data\
    \ in one place:\n\n![](images/Figure-10.16.jpg)\n\n**Figure 10.16:** Data governance\
    \ framework\n\n**Reference: [https://databricks.com/blog/2021/05/26/introducing-databricks-unity-catalog-fine-grained-governance-for-data-and-ai-on-the-lakehouse.html](https://databricks.com/blog/2021/05/26/introducing-databricks-unity-catalog-fine-grained-governance-for-data-and-ai-on-the-lakehouse.html)**\n\
    \nDelta sharing (`[https://docs.databricks.com/data-sharing/delta-sharing/index.html](https://docs.databricks.com/data-sharing/delta-sharing/index.html)`)\
    \ is an open protocol developed by Databricks to exchange data securely with other\
    \ organizations, regardless of the computing platforms:\n\n![](images/Figure-10.17.jpg)\n\
    \n**Figure 10.17:** Delta sharing\n\nTable access control allows end users to\
    \ apply data governance to control the data. Databricks workspace administrators\
    \ can only enable ACLs using the `Admin Console` (`[https://docs.databricks.com/security/access-control/index.html](https://docs.databricks.com/security/access-control/index.html)`)\
    \ or `Permissions API` (`[https://docs.databricks.com/dev-tools/api/latest/permissions.html](https://docs.databricks.com/dev-tools/api/latest/permissions.html)`).\n\
    \nCredential passthrough feature allows users to authenticate to `S3 buckets`\
    \ or `Azure Data Lake Storage Gen2` from the Databricks workspace clusters using\
    \ the identity to log in to the Databricks:\n\n![](images/Figure-10.18.jpg)\n\n\
    **Figure 10.18:** Databricks credential passthrough\n\n### GDPR and CCPA compliance\
    \ using Delta Lake\n\nWith Databricks Delta Lake, enterprise organizations take\
    \ care of `General Data Protection` (`GDPR`) and `CCPA` compliance for your data.\
    \ Delta Lake simplifies the ability to locate personal data since Delta Lake has\
    \ a transactional layer that provides structured data on top of data:\n\n![](images/Figure-10.19.jpg)\n\
    \n**Figure 10.19:** GDPR compliance\n\nA major challenge faced by enterprise organizations\
    \ is to manage the big data that has personal information. GDPR and CCPA compliance\
    \ for this big data is a humongous task. The major reasons for this are as follows:\n\
    \n* We can store personal information in distributed manner across multiple datasets.\
    \ Ad-hoc queries to find data are expensive because they require full scans.\n\
    * Data lakes don’t have the ability to perform row-level `delete` or `update`\
    \ operations, so we must rewrite partitions of data. It doesn’t provide `ACID`\
    \ capabilities.\n* Data hygiene in the data lake is challenging since Data Lakes,\
    \ by design, support availability and partition tolerance:\n\n![](images/Figure-10.20.jpg)\n\
    \n**Figure 10.20:** CCPA compliance\n\nDatabricks Delta Lake addresses the above-mentioned\
    \ challenges as follows:\n\n* Data anonymization so that personal information\
    \ can’t tracked back from the data stored in the Data Lake.\n* Pipelines and bucket\
    \ policies to remove raw data, which help comply with the rules.\n* Mechanism\
    \ to locate and remove identifier to destroy linkage.\n* `ACID` transaction capabilities\
    \ to prevent end users with issues when records are being updated or deleted.\n\
    \nLet’s consider one use case on how we can delete personal data using Databricks\
    \ Delta Lake. Consider a table named `customers` with the following schema:\n\n\
    ```\n-- c_customer_id: string (nullable = true)\n-- c_addr_sk: integer (nullable\
    \ = true)\n-- c_shipto_date_sk: integer (nullable = true)\n-- c_sales_date_sk:\
    \ integer (nullable = true)\n-- c_first_name: string (nullable = true)\n-- c_last_name:\
    \ string (nullable = true)\n-- c_birth_day: integer (nullable = true)\n-- c_birth_month:\
    \ integer (nullable = true)\n-- c_birth_year: integer (nullable = true)\n-- c_birth_country:\
    \ string (nullable = true)\n-- c_email_address: string (nullable = true)\n```\n\
    \n1. The first step is to convert the tables to `delta` format using the following\
    \ command:\n```\nCONVERT TO DELTA customers\n```\n2. The second step is to delete\
    \ the personal information of those who requested to remove the PII information:\n\
    ```\nDELETE FROM customers AS t1 WHERE EXISTS (SELECT c_customer_id FROM cust_dlt_keys\
    \ WHERE t1.c_customer_id = c_customer_id)\n```\n3. The second last step is to\
    \ clean up the stale data. Depending on how long a consumer has requested to delete\
    \ the data from the Data Lake, we need to delete table history and underlying\
    \ raw data from the Data Lake. By default, using the following command, we can\
    \ remove stale data for 7 days:\n\n```\nVACUUM customers\n```\n4. If we want to\
    \ remove artifacts younger than 7 days, use the following command:\n```\nVACUUM\
    \ customers RETAIN 100 HOURS\n```\n\nIn addition to this, it is also recommended\
    \ to set up the retention policy to avoid storing any sensitive personal data\
    \ that is not intended to be stored.\n\n### Conclusion\n\nIn this chapter, you\
    \ learned how to perform hyperparameter tuning with `Hyperopt` for the Delta Lake.\
    \ We also understood in detail how to perform access control and secret management.\
    \ Then, we did a quick tour of cluster configuration and its policies. Then, we\
    \ also understood in detail the importance of data governance and how Databricks\
    \ can help us create well governed data solutions using Databricks. At the end,\
    \ we also explored how Databricks’ Delta Lake solution helps enterprise organizations\
    \ to become GDPR- and CCPA-compliant.\n\n### Multiple choice questions\n\n1. Can\
    \ we authenticate directly to ADLS Gen2 using credential passthrough?\n   1. Yes\n\
    \   2. No\n2. Which format is used to store cluster policies?\n   1. JSON\n  \
    \ 2. CSV\n   3. ORC\n   4. All of the above\n3. Can we enable access control lists\
    \ for granular access management in Databricks platform?\n   1. Yes\n   2. No\n\
    4. Does Delta Lake support `ACID` transactions?\n   1. Yes\n   2. No\n5. Can we\
    \ create Databricks workspace cluster using the API?\n   1. Yes\n   2. No\n\n\
    ### Answers\n\n1. a\n2. a\n3. b\n4. b\n5. b\n\n### Index\n\n**Symbols**\n* 4Vs\
    \ [102]\n* validity [102]\n* velocity [102]\n* veracity [102]\n* versioning [102]\n\
    \n**A**\n* abstracted feature class [217]\n"
