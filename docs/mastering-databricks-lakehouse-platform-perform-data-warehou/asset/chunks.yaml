- fmt: '

    Her goal is to assign everyone a single set of non-interdependent responsibilities
    so that everyone can achieve their assigned portion of rephrasing and retranslation
    as fast as possible.


    She assigns everyone a separate computer with a separate section of the novel
    to do the rephrasing. She creates a rephrasing and retranslation plan broken into
    multiple phases so that the rephrased output of one phase can be utilized in another
    phase in a top-down way, and no two-phase interconnects as like the `directed
    acyclic graphs`.


    In the concluding phase of being a leader, she has to just collect all the final
    rephrases and collate them to conclude the final output.


    Refer to the depiction as in the following diagram.


    Note the term `Directed Acyclic Graph (DAG)`.


    You will notice that the flow of execution is in a single direction, and it’s
    always reproducing a refined output, which is further linked to the next layer/phase
    of execution:


    ![](images/Figure-3.2.jpg)


    **Figure 3.2:** Databricks audit: DAG


    # What if Merry has to build a software to handle the parallel work?


    To achieve the same output, she needs to have six computers or maybe less with
    independent compute containers. She can use the first machine as a `master node`
    and the rest as `workers`.


    The master node can read the complete manuscripts into a primary dataset, create
    execution plans, and assign each worker machine with a portion of the manuscript
    to process in a specific path of execution that can have actions such as rephrasing
    and translation as well as spell correction and transformation such as `split`,
    `filter`, and `merge`, generating a `read-only dataset` of intermediate paraphrased
    and translated output, often called `Datasets` or `DataFrames`.


    `Datasets` and `DataFrames` can be thought of as schematic representations of
    rephrased and translated content, which can be easily consumed for further processing.


    She can achieve strict traceability and audit capability with instant rollback
    by making sure that the read-only datasets of partially rephrased and refined
    work are created after every transformation and any update or refinement induces
    the next set of datasets at the next layer.


    Once the processing is done, the `6^(th` machine can merge all the output into
    one fresh dataset to create the final result.


    In a more complex scenario, she can introduce the `7^(th` machine with a program
    that runs the main program to take the manuscripts for rephrasing, build execution
    plans, and assign resources to generate the output.


    How about if one of the worker machines fails or there are thousands of other
    processes to be done?


    `Merry’s` program will need to have to manage more precisely in terms of using
    the resources on each of the machines to handle the load and handling scheduling
    to manage the processing of different novels. Maybe she will have to write a better
    program that can run on different cores on one machine, and manage the resources
    and handle failures among the group of worker machines to be very precisely called
    `clusters of nodes` or `cluster manager` or `yarn`.


    You will be surprised to know that most modern distributed systems follow a similar
    pattern to handle parallelization and fault tolerance, and Spark is not so different
    but is highly optimized to handle large volumes of data.


    # Spark and its evolution


    Spark has evolved with time, and to ease and optimize the processing, multiple
    components have been added so that programmers do not have to write low-level
    code to manage programming at the primitive `RDD` level, which forms the core
    of the Spark program.


    Developers have multiple options instead of being dependent on writing low-level
    programs, like the established RDBMS, where the query can be written in simple
    SQL.


    RDBMS systems has to go through a query plan cost value analysis and the one that
    is highly efficient and with lower cost is chosen to execute.


    As Spark is more modern than the traditional OLTP system, it can understand multiple
    modern languages and can be compiled to be interpreted and assembled into low-level
    language.


    When it comes to processing data, Spark has its own cost value optimization algorithm
    that can build highly optimized execution plans, which can be preferred based
    on cost value analysis, choosing the best one to process the data by generating
    highly efficient intermediate outputs as layers of `RDD`s.


    # Components of Apache Spark


    # Resilient Distributed Dataset (RDD)


    `RDD` has been available since the beginning of Spark, and it is often considered
    as a fundamental data structure of Apache Spark.


    `RDD` is `immutable` (read-only), which means that a new transformation further
    creates a new refined layer of `RDD`s.


    This can be operated on many devices at the same time enabling massive parallel
    processing.


    To understand it better, `RDD` can be considered as a partitioned set of unique
    records placed in memory on different execution units (nodes).


    These nodes are spread across different machines (clusters) on which a Spark program
    is set up to run.


    A Spark program can easily create a `Directed Acyclic Graph` during compile time
    to define how many layers of `RDD` are required after each action to compute the
    result; the operation on one layer of `RDD` generates a new lower layer of `RDD`.


    This is the reason why Spark is considered `fault-tolerant` and `resilient`, and
    every operation in data is going to create a new layer of `RDD`s until the final
    results are emitted, ensuring that there is a lineage of change hierarchy available
    where faults can be easily rolled back and re-executed from a specific layer.


    `RDD` enables a programmer to program in Spark at the lowest level, enabling developers
    to control the flow of execution and write code at the lowest level.


    **Cons**: If the developer is not experienced enough, they can write un-optimized
    code, which can slow the data processing to a massive scale, especially when the
    file size is too large.


    For example, a developer may unknowingly choose a sorting operation on entire
    datasets before a filter operation; consider *what will happen if the file is
    very large and is distributed into multiple partitions on multiple nodes?* First,
    a new `RDD` will be created after the sorting process with the same amount of
    data, and then, only a filtration would happen:


    ![](images/Figure-3.3.jpg)


    **Figure 3.3:** Databricks audit: RDD data flow


    # Datasets and DataFrames


    To make things simple for developers and analysts, an OLTP style query plan and
    selection mechanism was introduced over and above the `RDD` layer, called `DataFrame`
    and `Datasets` in Spark 2.0. This has the ability to generate different types
    of highly optimized code before runtime by doing a cost-value analysis, almost
    similar to how the database engine does for choosing a correct low-cost query
    plan to execute the SQL.


    `Datasets` and `DataFrames` are built on top of `RDD`. In Spark, anything you
    do will go around `RDD`. The dataset in Spark `RDD`s is divided into logical partitions.
    If the data is logically partitioned within `RDD`, it is possible to send different
    pieces of data across different nodes of the cluster for distributed computing.


    A **DataFrame** is a distributed collection of data that has a schema and is organized
    into rows, where each row consists of a set of columns, and each column has a
    name and an associated type. This is similar to tables in a relational database,
    but under the hood, it has much richer optimizations and is meant for highly optimized
    in-memory parallel processing.


    Like the RDD, the DataFrame offers two types of operations: **transformations**
    and **actions**.


    Transformations are `lazily evaluated`, and actions are `eagerly evaluated`.

