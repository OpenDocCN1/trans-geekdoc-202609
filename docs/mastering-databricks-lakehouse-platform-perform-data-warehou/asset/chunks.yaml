    how to merge outputs to produce the final result. As you will notice in the following
    diagram, few stages are skipped, and that is the level of auto-optimization that
    `Spark` achieves by not repeating:


    ![](images/Figure-3.18.jpg)


    **Figure 3.18:** Databricks audit: Dag with segregation, collection, and union


    Once you visualize, it becomes easy for you to understand and build ETL pipelines
    with Databricks. As Databricks allows your notebook to schedule, you can create
    multiple sets of notebooks depicting different stages before you load the data
    to the destination. This is also called `orchestration`, which has been detailed
