  trans: "\n\n- **合规性**：Databricks 平台内置了控制功能，以满足行业标准的合规要求。\n\n# 数据保护\n\nDatabricks\
    \ 平台包含以下数据安全的保护功能：\n\n- **使用用户和系统管理密钥进行静态数据加密**：Databricks 平台具有隔离的计算和存储资源。Databricks\
    \ 集群在本质上是临性的计算资源，它们会在数据处理开始时启动，并在数据处理完成后终止。Databricks 存储服务支持数据加密、由密钥库支持集成的客户托管密钥，以及文件/文件夹级的细粒度访问控制。\n\
    \n- **传输中数据加密**：当我们在 Databricks 中执行笔记本或作业时，来自集群的所有流量都将从控制面板重定向到客户订阅，且这些流量始终经过\
    \ TLS 加密。当集群访问数据时，使用 TLS 协议进行通信，以确保传输过程中的数据加密。\n\n- **文件和文件夹级访问控制机制**：在使用 Databricks\
    \ 平台工作时，我们还可以启用文件和文件夹级的细粒度访问管理。例如，在使用 Azure Databricks 时，我们可以启用 `ADLS passthrough`\
    \ 选项。启用此选项后，系统将使用 `Azure Active Directory Identity` 在 `Azure Data Lake Storage`\
    \ 中自动进行身份验证，通过它登录 Azure Databricks 工作区。无需配置服务主体的凭据或任何其他额外配置即可对 ADLS 进行读写操作。用户访问管理将根据应用于文件或文件夹级别的\
    \ ACL 进行管理：\n\n    ![](img/Figure-2.10.jpg)\n\n    **图 2.10：** Databricks 集群 -\
    \ 凭据传递 (credential passthrough)\n\n    如之前的截图所示，我们可以在创建集群时配置凭据传递的 Databricks 集群。\n\
    \n- **访问控制表**：当在 Databricks 工作区中启用表访问控制时，我们可以在 `SQL`、`Python` 和 `pyspark` 的 Databricks\
    \ 笔记本中通过编程方式授予和撤销数据的访问权限。默认情况下，Databricks 工作区中的所有用户都可以访问存储在集群托管表中的数据。一旦启用表访问控制，用户即可根据分配的权限访问受限的数据对象。\n\
    \n    我们可以使用以下权限创建基于视图的访问控制模型：\n\n    - `SELECT`：对对象的读取权限。\n    - `CREATE`：创建对象。\n\
    \    - `MODIFY`：向对象或从对象添加/删除/修改数据。\n    - `READ_METADATA`：查看对象及其元数据。\n    - `CREATE_NAMED_FUNCTION`：在现有目录或数据库中创建自定义函数\
    \ (UDF)。\n    - `ALL PRIVILEGES`：赋予所有权限。\n\n    我们可以将这些权限应用于以下类对象：\n\n    - `CATALOG`：数据目录的权限控制。\n\
    \    - `DATABASE`：控制对数据库的访问。\n    - `TABLE`：控制对托管/外部表的访问。\n    - `VIEW`：控制对 SQL\
    \ 视图的访问。\n    - `FUNCTION`：控制对函数的访问。\n    - `ANONYMOUS FUNCTION`：控制对匿名函数的访问。\n\
    \    - `ANY FILE`：控制对底层文件系统的访问。\n\n- **Databricks 机密管理**：在使用 Databricks 平台工作时，我们必须。Databricks\
    \ 提供了一种安全的方式来存储敏感信息，如 API 密钥、密码和证书。我们可以在集群、文件夹或笔记本级别管理机密。Databricks 还与外部机密管理器集成，如\
    \ Azure Key Vault、AWS Secrets Manager 和 Google Cloud Secret Manager。\n\n    ![](img/Figure-2.10.jpg)\n\
    \n    **图 2.10：** Databricks 集群 - 凭据传递 (credential passthrough)\n\n"
- fmt: "\n- **Credential passthrough**: Databricks has the `credential passthrough`\
    \ feature, which allows users to authenticate automatically to external storage\
    \ services like AWS S3 or Azure Data Lake Storage Gen2 using the same identity\
    \ by which a user logged in to the Databricks workspace. It is not a `compulsory`\
    \ option, but if you want to enable it, you can do so while creating the cluster\
    \ in Databricks.\n\n# Credential passthrough for high concurrency cluster\n\n\
    ![](images/Figure-2.17.jpg)\n\n**Figure 2.17:** Databricks cluster - credential\
    \ passthrough high concurrency cluster\n\n# Credential passthrough for standard\
    \ cluster\n\n![](images/Figure-2.18.jpg)\n\n**Figure 2.18:** Databricks cluster\
    \ - credential passthrough standard cluster\n\nConsider the scenario where the\
    \ Data Engineering team wants to read and write data to Data Lake Storage Gen2.\
    \ The first step is to create a high concurrency cluster in Databricks and attach\
    \ an instance profile that has the required permission to Data Lake Storage Gen2\
    \ and provide cluster permission to the data engineering team. Now, suppose we\
    \ want the `adls gen2` container only to be accessed by certain members of the\
    \ data engineering team to write data to container and want other users to only\
    \ have read access. Traditionally, we can create multiple clusters and add respective\
    \ users to restrict access as per the requirements. However, it is not a cost-effective\
    \ and sustainable solution as we can’t create and manage multiple clusters for\
    \ different requirements across the enterprise organizations. We can cater to\
    \ such requirements using the credential passthrough feature of the Databricks.\n\
    \n- **Audit access**: Auditing and managing the data access is a mandatory step\
    \ to create a data governed solution using Databricks platform. Databricks has\
    \ a rich set of in-built audit events to log the user activities in Databricks\
    \ and enable proactive monitoring of all the activities in the Databricks platform.\
    \ Databricks provides two types of audit logs:\n\n    - Workspace level audit\
    \ logs\n    - Account level audit logs\n\nDepending on the cloud provider (AWS/Azure/GCP),\
    \ we can configure and enable audit logs for the Databricks workspace. Once configured,\
    \ audit logging delivers audit logs to `s3 bucket/adls gen2` within `72 hours`.\n\
    \nWe can also extend the audit logs to monitor the storage for more granular level\
    \ of access details. This will enable us to few of the answers required by the\
    \ regulators:\n\n    - What data has been accessed and by whom?\n    - Unauthorized\
    \ attempt to read/write/delete data\n    - Aggregate or retire data sources from\
    \ the Databricks platform\n\n`Databricks` and `Immuta` also have collaborative\
    \ solutions to create an end to end data governance solution with data security.\
    \ Main focus areas for this solution are fine-grained security and ease of data\
    \ discovery to share data securely. The following are a few specific features\
    \ of end-to-end data governance solution built by Databricks and Immuta:\n\n \
    \   - **Fine grained access control**: Solution has powerful data masking and\
    \ anonymization techniques to generate masked data on the fly. This feature will\
    \ enable data to be accessed by more and more users to bring business insights\
    \ and also regulatory complaint.\n    - **Self-service data catalog**: Data discovery\
    \ is made easier for all the Databricks data using the self-service data catalog:\n\
    \n        ![](images/Figure-2.19.jpg)\n\n        **Figure 2.19:** Self-service\
    \ data catalog\n\n    - **No code policies for every regulation**: Policy creation\
    \ and authoring doesn’t force any developers to write any code. Policies can be\
    \ created by simply writing the sentence. Once policies are created, they will\
    \ be enforced natively by the Databricks platform:\n\n        ![](images/Figure-2.20.jpg)\n\
    \n        **Figure 2.20:** No code policy\n\n    - **Attribute based access control**:\
    \ User attributes can be used to create and manage fine-grained access to the\
    \ data objects.\n\n# Databricks cluster management\n\nAs we conferred about the\
    \ Databricks cluster at the beginning of this chapter, Databricks cluster is a\
    \ set of compute resources and configurations to run the data solutions on Databricks\
    \ platform.\n\nDatabricks has multiple options to create and configure clusters\
    \ with the best of performance and low cost. Let’s explore cluster considerations\
    \ to efficiently manage the Databricks clusters:\n\n- **All purpose and job clusters**:\
    \ All-purpose clusters can be shared by multiple users during the data exploration\
    \ and development phase. Once the development is completed, it is recommended\
    \ to switch to the job cluster as they will be terminated when the job ends, which\
    \ will reduce the cost.\n- **Cluster mode**: Databricks has standard, high concurrency,\
    \ and single node cluster modes. Standard clusters are ideal for processing big\
    \ data with `spark`. It is recommended to use a single node cluster for non-distributed\
    \ workloads. High concurrency clusters are ideal when users want to share resources\
    \ or run ad-hoc jobs.\n- **On-demand and spot instances**: We can significantly\
    \ reduce the cost by choosing spot instances instead of on-demand instances whenever\
    \ possible according to the use cases:\n\n        ![](images/Figure-2.21.jpg)\n\
    \n        **Figure 2.21:** Databricks cluster spot instance\n- **Auto scaling**:\
    \ Auto scaling feature for Databricks cluster resizes the cluster configurations\
    \ automatically based on the workload. It will reduce the cost as well as increase\
    \ the performance based on the workload compared to fixed-size clusters:\n\n \
    \       ![](images/Figure-2.22.jpg)\n\n        **Figure 2.22:** Databricks cluster\
    \ auto scaling\n- **Cluster policies**: Databricks cluster policies ease the life\
    \ of Databricks administrators to manage cluster configurations and creation in\
    \ Databricks workspace. Cluster policies enforce standard cluster configuration\
    \ and reduce cost by preventing excessive usage of resources and pre-configured\
    \ cluster configurations for specific workloads:\n\n        ![](images/Figure-2.23.jpg)\n\
    \n        **Figure 2.23:** Databricks cluster policies\n- **Tag enforcements**:\
    \ Create cluster policy to enforce tags and assign the cluster policy to make\
    \ sure that tags will be created while creating the cluster using the `custom_tags.<tag-name>`\
    \ attribute:\n\n        ![](images/Figure-2.24.jpg)\n\n        **Figure 2.24:**\
    \ Databricks create cluster policies\n\n        Once the tag definitions are created,\
    \ we can assign permissions to user, group, or service principal:\n\n        ![](images/Figure-2.25.jpg)\n\
    \n        **Figure 2.25:** Databricks cluster policies assignment\n\n        Similarly,\
    \ we can create multiple cluster policies based on use cases within Databricks\
    \ to keep cluster configurations and management consistent across the Databricks\
    \ workspace:\n\n        - Cluster policy to define T-Shirt sized cluster configurations.\n\
    \        - Cluster policy for cluster configurations based on the workload types.\n\
    \        - Cluster policy for cost reduction with `auto scaling`, `auto termination`,\
    \ `expensive instance types`, and `worker node counts.`\n        - Use of instance\
    \ type for cost reduction.\n\n        While creating a Databricks cluster, you\
    \ also have an option to configure if you want to use spot instances to reduce\
    \ the cost. If spot instances are expelled due to unavailability, on-demand instances\
    \ will be deployed to replace those instances:\n\n        ![](images/Figure-2.26.jpg)\n\
    \n        **Figure 2.26:** Databricks cluster - spot instances\n- **Cluster tags**:\
    \ Enforcing cluster tags for Databricks workspace helps enterprise organizations\
    \ to monitor the cost of cloud resources. Cluster tags can be specified in the\
    \ form of `key-value pairs` during the cluster creation.\n\nBy default, Databricks\
    \ applies the following tags for each cluster:\n\n        - `Vendor`\n       \
    \ - `Creator`\n        - `ClusterName`\n        - `ClusterId`\n"
