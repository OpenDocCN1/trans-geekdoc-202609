  [1,2\\]的快速演进以及嵌入式系统的日益泛化，使得网络边缘对智能、高能效和实时的数据处理产生了迫切需求。传统的机器学习方法通常依赖于中心化的云基础设施来进行训练和推理\
  \ \\[3\\]。然而，这种依赖引入了多项局限性，包括高通信延迟、数据隐私风险以及巨大的能量消耗。\n\n为了应对这些挑战，将机器学习与资源受限的嵌入式设备相结合——被称为微型机器学习（TinyML）\
  \ \\[4\\]——已成为边缘计算领域的一种变革性范式。TinyML 允许将紧凑且优化的机器学习模型直接部署在超低功耗的微控制器和边缘设备上。这种能力赋予了设备实时决策的能力，减少了对云基础设施的依赖，并通过设备端推理增强了数据隐私。TinyML\
  \ 与边缘 AI 的协同效应为跨领域的创新应用铺平了道路，包括医疗保健、精准农业、工业自动化和智能交通系统 \\[5,6\\]。\n\n本章的主要目标是探索定义\
  \ TinyML 的基本原理、架构组件和算法创新，重点关注其在边缘环境中的实际部署。此外，本章还研究了如何利用人工智能（AI）技术来优化关键的边缘计算功能，如任务卸载、能效、资源分配和系统安全。\n\
  \n本章的结构如下：第 2.2 节介绍了 TinyML 的基础概念和架构框架。第 2.3 节概述了开发和部署 TinyML 模型的端到端工作流。第 2.4 节考察了\
  \ AI 与边缘计算的融合，展示了适用于边缘场景的各种范式和算法分类。第 2.5 节 详细分析了用于优化卸载、能耗、安全、隐私和资源管理的 AI 驱动策略。最后，第\
  \ 2.6 节 通过对关键发现的总结对本章进行了总结，并对 TinyML 和边缘 AI 的新兴研究方向提出了见解。\n\n## 2.2 TinyML 基础\n\n\
  TinyML 作为智能边缘系统的基础要素，代表了机器学习与嵌入式计算的融合，专门为资源受限严苛的环境身定制。本节概述了 TinyML 的核心原理和目标，强调了其在实现本地化智能、促进实时决策以及增强现有云和边缘计算基础设施方面的作用。\n\
  \n### 2.2.1 原理与目标\n\nTinyML \\[7,8\\] 支持将轻量级机器学习模型集成到紧凑的边缘设备中，这些设备通常在严格的资源限制下运行，包括计算能力有限、内存容量受限和可用电量低。通过实现本地数据处理和解释，TinyML\
  \ 允许这些设备在不需要持续连接云的情况下执行实时响应。TinyML 并非取代雾计算或云计算范式，而是作为一种补充技术，增强并加速现有的计算框架。\n\nTinyML\
  \ 的主要目标是通过最小化计算复杂性和减少所需数据量来提高机器学习模型的运行效率。这种能力对于推进边缘 AI 技术和驱动物联网 \\[9\\]的扩张至关重要。在这个框架内，TinyML\
  \ 涉及开发和部署专门架构、框架、方法、工具和策略，以实现跨传感器模态的设备端分析——包括视觉、听觉、语音、运动、化学、物理、文本和认知输入。这些应用专门设计用于在极低功耗预算内运行（通常在毫瓦级或以下），使其成为电池供电的嵌入式系统的理想选择。该技术的主要关注点是大规模部署。\n\
  \n### 2.2.2 架构概述\n\n如图 2.1 所示，TinyML 的架构运行在云计算与边缘计算的交汇点。云平台负责使用张量处理单元（`TPUs`）、图形处理器（`GPUs`）和处理器（`CPUs`）进行高级数据分析和模型训练。相比之下，边缘计算将计算靠近数据源，以减少延迟并促进设备上的实时分析\
  \ \\[10\\]。TinyML 提供超低功耗的设备端智能，使嵌入式设备具备智能、自主的行为 \\[3\\]]。\n\n\n图 2.1 云计算、边缘计算和 TinyML\
  \ 架构 [7\\]\n\n### 2.2.3 边缘深度学习\n\n深度学习构成了 TinyML 的基础组件，使资源受限的平台上实现了图像分类和自然语言处理等复杂功能\
  \ \\[11\\]。然而，深度神经网络（`DNNs`）的计算密集性需要专用硬件来实现高效运行。此类硬件示例包括：\n\n*   `TPUs`：定制加速器，可实现深度学习模型的高能效、低延迟推理。\n\
  *   `FP5A Units`：能够在多种位宽下运行的灵活处理器，用于优化嵌入式系统的计算效率。\n*   `CNN Micro`：轻量级卷积神经网络，专为在严格的功率内存限制内运行而设计。\n\
  \n这些硬件优化与轻量级模型架构相结合，促进了高级 AI 功能在嵌入式系统中部署，从而加速了边缘 AI 的创新。\n\n\n\n\n\n这种分层集成提高了数据处理的效率，降低了带宽占用，并支持了广泛的先进应用，包括预测性维护、智能家居自动化和健康监测系统。这些层共同构成了下一代物联网解决方案的稳健且智能的基础\
  \ [7]。\n\n### 2.2.3 核心组件：硬件、软件与算法\n\n`TinyML` 代表了一种将机器学习模型直接部署在超低功耗嵌入式系统上的转型方法。这种创新实现了在网络边缘进行本地数据处理，从而降低了延迟，最小化了能量消耗并缓解了隐私担忧。TinyML\
  \ 系统的底层架构取决于三个核心组件的紧密集成：\n\n*   **硬件：** 物联网和边缘设备集成了专为能效运行设计的微控制器，能够执行本地机器学习推理。\n\
  *   **软件：** 轻量级操作系统、云端连接接口和通信协议，促进了 ML 模型在嵌入式平台上部署、维护和管理。\n*   **算法：** 针对资源受限环境优化的机器学习模型，通常利用量化、剪枝和模型压缩等技术来确保计算效率。\n\
  \n如图 2.2 所示，这些组件被共同开发，以支持高效的设备内计算、保持数据保真度并促进与实际物联网应用的无缝集成。在 TinyML 系统中实现高性能需要精细的软硬件协同设计策略。这涉及将紧凑、高效的软件框架与高度优化的\
  \ ML 模型对齐，同时保持数据安全和完整性的稳健标准 [12]。\n\n\n图 2.2 TinyML 组件：硬件、软件和算法 [12]。返回正文。⏎\n\n\
  在真实世界的部署场景中，TinyML 模型通常被编译为二进制格式，并从功能更强的主机系统上传——或“闪存”）到微控制器单元 (MCU) 上，从而完成部署工作流。\n\
  \n18\n\n### 2.2.4 TinyML 的主要优势\n\n将 TinyML 引入边缘计算基础设施带来了一系列优势，显著提升了物联网系统的性能、可扩展性和安全性（见表\
  \ 2.1）。关键优势包括：\n\n表 2.1 用于边缘智能的 TinyML、边缘计算与传统云端 ML 比较 返回正文。⏎\n\n| 特性/优势 | TinyML\
  \ | 边缘计算 | 云端 ML |\n| --- | --- | --- | --- |\n| 能量效率 | ✓ | ✓ | ⨯ |\n| 低成本实现 | ✓\
  \ | ✓ | ⨯ |\n| 降低延迟 | ✓ | ✓ | ⨯ |\n| 实时推理 | ✓ | ✓ | ⨯ |\n| 离线运行 | ✓ | ⨯ | ⨯ |\n\
  | 系统可靠性 | ✓ | ✓ | ⨯ |\n| 数据隐私 | ✓ | ✓ | ⨯ |\n| 可扩展模型训练 | ⨯ | ⨯ | ✓ |\n| 计算资源可用性\
  \ | ⨯ | ✓ | ✓ |\n| 模型复杂度支持 | ⨯ | ✓ | ✓ |\n\n*   **能量效率：** 在 MCU 上执行的 TinyML 模型与传统处理器和\
  \ GPU 相比，表现出更低的能耗。这种高效率对于电池供电或能量采集设备特别为有利，便于它们在远程或移动环境中使用。此外，将它们集成到电动滑板或移动机器人等支持电池的平台中可以延长运行时间。\n\
  *   **成本效益部署：** 许多物联网应用需要大量的计算资源，往往导致了对昂贵云服务的依赖。TinyML 通过在廉价的微控制器上进行本地处理，缓解了这种依赖。这些\
  \ MCU 通常运行在 1–400 MHz 的频率范围内，提供 2 到 512 kB 的内存容量，存储范围从 32 KB 到 2 MB 不等。它们的低生产成本和操作简单性使其成为大规模分布式部署的理想人选。\n\
  *   **降低延迟：** 通过 TinyML 执行本地推理消除了将数据传输到远端云服务器的需求，从而最小化了延迟并增强了实时响应能力。这一属性在时间敏感或任务关键的场景中至关重要。此外，本地计算减轻了云基础设施的压力，使整个系统更加响应迅速且稳健。\n\
  *   **提高可靠性和数据隐私：** 传统的物联网架构依赖于将原始数据传输到中央服务器进行处理，使系统暴露于传输错误和网络威胁等漏洞。相比之下，TinyML\
  \ 直接在设备上进行数据分析，减少了传输的数据量和敏感性。这种本地化方法提高了系统可靠性并提供了更高程度隐私保护。\n\n## 2.3 TinyML 模型的工作流\n\
  \n嵌入式系统形成了 TinyML 的基础计算层，其特点是超低功耗需求和极硬件容量。通常，这些平台仅提供几 KB 到数百 KB 的 RAM，闪存存储小于 2 MB，且运行功耗低于\
  \ 3 mW。相比之下，即使是最节电的移动设备也会消耗数百毫瓦到数瓦的电力，这凸显了 MCU 在 TinyML 部署中卓越能效。这种效率使得 MCU 特别适用于在高度资源受限的环境中执行机器学习任务\
  \ [8]。\n\nTinyML 的开发周期通常涵盖三个核心阶段：训练、优化和部署。虽然训练过程类似于传统的 ML 工作流，但优化和部署阶段针对嵌入系统的限制进行了独特适配（见图\
  \ 2.3）。\n\n\n图 2.3 从数据收集到模型部署的 TinyML 工作流。返回正文。⏎\n\n*   **训练阶段：** 初始阶段涉及选择合适的机器学习算法并收集训练数据集，数据可以来自公共仓库或直接来自嵌入传感器。模型训练通常在高性能平台（如工作站或服务器）上使用\
  \ `TensorFlow`、`PyTorch` 或 `Scikit-learn` 等成熟的框架进行。结果是一个高精度但计算密集型的。\n*   **优化阶段：**\
  \ 为了确保与嵌入设备兼容，训练后的模型经过一系列优化程序：\n    *   *剪枝：* 消除非重要的权重和神经元，从而在保持性能的同时缩小模型并降低复杂度。\n\
  \    *   *知识蒸馏 (KD)：* 将复杂的“教师”模型的知识传输到较小的“学生”模型，以实现保留准确率的压缩。\n    *   *量化：* 将高精度计算（例如\
  \ 32 位浮点）转换为低精度表示（例如 8 位整数），从而大幅减少内存占用并加速推理。\n\n    *   这些方法必须经过仔细平衡，以维持模型的完整性和预测能力\
  \ [13]。\n\n\n\n\n\n-   部署阶段：一旦完成优化，模型将使用 `TensorFlow Lite for Microcontrollers`\
  \ (`TFLM`) 等工具转换为硬件可执行格式——通常是 C 或 C++ 数组。随后，编译后的模型将被直接嵌入到设备的固件中。\n\n部署后，MCU 对摄入的传感器数据进行实时推理。由于所有计算都在本地完成，TinyML\
  \ 能够实现独立于云端连接的超低延迟响应。这种本地化智能使 TinyML 成为医疗保健、交通、智能基础设施和教育等领域边缘 AI 的关键推动因素。\n\n##\
  \ 2.4 AI 与边缘计算的融合\n\nAI 与边缘计算的融合标志着 IoT 生态系统中智能服务交付的一项关键转型。边缘计算在数据源头附近处理数据，显著降低了延迟并提高了响应速度。同时，AI\
  \ 通过实现实时分析和自适应控制机制增强了系统能力。\n\n这种融合的主要驱动力源于云端基础设施在延迟敏感和带宽受限场景下的局限性。在网络边缘部署 AI 算法已日益常见，旨在优化计算资源、增强数据隐私并最小化通信开销。这种集成式方法允许在设备上直接进行智能数据解释，支持自动驾驶汽车、智能城市基础设施和工业过程自动化等多种应用\
  \ [14]。\n\n### 2.4.1 AI 驱动边缘计算的范式\n\n边缘 AI 架构根据 AI 工作负载在云端和边缘环境之间的分布分为不同的范式。\n\n\
  ### 2.4.1.1 云辅助训练本地推理\n\n在这种范式中，云端被用于资源密集型的 AI 模型训练。一旦完成训练，这些模型会被部署到边缘设备，并在本地执行执行推理任务。这种设置有效地平衡了高模型准确性与低延迟执行，特别适用于要求实时响应但不需要持续学习的应用。\n\
  \n### 2.4.1.2 AI 全权委托至边缘设备\n\n在要求严格数据隐私或在连接受限的场景下，训练和推理过程均完全在边缘设备上进行。尽管这种方法在计算和能量资源方面面临巨大挑战，但\
  \ TinyML、联邦学习和模型压缩技术的进步已使其越来越可行。它使设备能够自主地适应新数据和环境变化。\n\n### 2.4.2 边缘语境下的 AI 算法分类\n\
  \n部署在网络边缘的 AI 算法涵盖了广泛的光谱——从轻级经典模型到先进的深度学习和强化学习技术 [15]。每种算法类别提供的独特优势，与边缘环境固有的资源限制和特定应用需求相匹配。在这种背景下，选择合适的\
  \ AI 模型对于在性能、延迟、能效和内存使用之间实现最佳平衡至关重要。\n\nAI 为边缘计算的进步做出了巨大贡献，由于其本质分布式架构以及跨设备负载的时空变异性，边缘计算面临着巨大的优化挑战。这些复杂性通常会导致随用户数量和互联节点增加而扩展的非凸优化问题。传统的基于规则系统往往无法解决此类问题。相比之下，AI——特别是机器学习算法——能够有效识别边缘环境中典型的噪声异构数据流中的潜在模式。\n\
  \n此外，边缘计算系统需要智能自适应能力来管理各种任务，包括计算卸载、资源分配、能量优化、延迟降低和用户体验增强。因此，针对边缘应用的 AI 算法开发必须考虑严格的限制，如有限的处理能力、受限的能量可用以及实时决策的需求。\n\
  \n为了应对这些多方面的挑战，边缘环境中策略性地利用几类 AI 算法。\n\n### 2.4.2.1 传统机器学习\n\n支持向量机 (`SVM`)、k-近邻算法\
  \ (`KNN`) [16]、决策树和聚类方法等算法由于计算需求低，被常用于边缘环境。这些模型对于结构化数据分析非常有效，并经常应用于分类、回归和异常检测任务，使其成为设备端实时处理的理想选择。\n\
  \n### 2.4.2.2 深度学习架构\n\n如卷积神经网络 (`CNNs`) [17]、循环神经网络 (`RNNs`) 和长短期记忆 (`LSTM`) [18]\
  \ 网络等先进架构正日益针对边缘部署进行优化。这些模型特别擅长处理非结构化数据，包括图像、音频和视频流。剪枝、量化和知识蒸馏等优化技术使得在受限设备上部署成为可能，从而支持监控、语音识别和环境监测应用。\n\
  \n### 2.4.2.3 强化学习与深度强化学习\n\n强化学习 (`RL`) 及其更先进的变体深度强化学习 (`DRL`) 通过与环境交互学习支持动态决策。在边缘计算中，`RL`\
  \ 用于能量管理和任务调度等任务。尽管 `DRL` 将这些能力扩展到了高维问题，但它仍然具有高计算需求。\n\n### 2.4.2.4 用于分布式智能的联邦学习\n\
  \n联邦学习 (`FL`) 允许多个边缘节点协作训练共享全局模型，无需传输原始数据。相反，仅将模型更新通信到中央服务器，保护了用户隐私并最小化了带宽消耗。这种去中心化的学习模型在具有严格数据保护要求的领域（如医疗和金融）特别相关。\n\
  \n### 2.4.2.5 用于优化的进化算法\n\n受自然进化过程启发，进化算法 (`EAs`) 有助于解决分布式系统的复杂优化问题。遗传算法 (`GA`)、粒子群优化\
  \ (`PSO`) 和灰狼优化 (`GWO`) 等技术被用于微调能耗、任务调度和模型配置。它们的鲁健性和适应性使其成为实时边缘 AI 应用中价值的工具。\n\n\
  ## 2.5 使用 AI 解决方案优化边缘计算\n\n本节展示了利用 AI 技术增强边缘计算能力的近期研究综述。重点涵盖了几个关键领域，包括任务卸载、能效、系统安全、数据隐私和资源分配\
  \ [19]。表 2.2 汇总了应用在各种边缘优化领域的关键 AI 技术，并强调了它们的优势和局限性。\n\n表 2.2 用于边缘计算优化的 AI 技术\n\n\
