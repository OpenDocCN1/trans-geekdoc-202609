  | **排除 3** | 排除 2010 年之前或 2024 年之后发表的研究，并在全文分析期间进行额外筛选，以确保其与 TinyML 相关主题的关联性。 |\n\
  \n## 8.3 TinyML 中的安全需求\n\n为了保护保护患者信息的真实性、隐私性和机密性，必须满足以下基本需求：\n\n*   **数据原始性：** 必须由`支持\
  \ TinyML 的设备`满足，以保证传输数据的安全可靠性。为了这一点，需要许可和验证相关的服务（Yassine and Ezzati 2015）。\n*  \
  \ **数据隐私：** 由于无线信道的影响，攻击者可以监听`支持 TinyML 的设备`之间共享的敏感数据。结果可能是隐私信息的非法泄露。解决此问题的方案是在传输之前对数据进行加密。只有授权的用户才能解密这些材料。采用加密方法对于确保敏感患者信息免受未经授权的侵害至关重要。\n\
  \n\n\n\n\n-   **数据完整性：** 在传输过程中保护敏感的患者信息至关重要。入侵者拦截并篡改数据可能导致系统故障和患者伤害。这强调了采取保护措施以避免数据在传输过程中被操纵的需求。数据完整性检查确保目的地接收的数据是真实的，这是实现这一点的一种方法。这些验证通过将接收的数据与原始传输的数据进行比较，检查接收的数据是否发生了任何形式的修改或更改。医疗专业人员在拥有准确且可靠的患者数据时可以对患者护理做出更好的决策，这就是为什么数据完整性措施如此重要的原因。\n\
  \n-   **数据可用性：** 医疗传感器节点必须随时可用，以确保健康数据始终可用于医疗。如果未经授权的人获取了传感器节点，可能会导致数据丢失，使医疗变得非常困难。因此，保持医疗护理软件的可访问性对于确保医生和其他医疗人员能够持续访问关键患者记录至关重要。\n\
  \n-   **数据更新：** 新鲜度方法通过实施保护措施防止攻击者节点记录、重放和发布数据，从而防止攻击者重用旧数据。由于支持 TinyML 的设备确保数据是新的且无损坏的，它们保证了数据的准确性和可靠性，从而带来了更好的患者护理结果。在医疗应用中，准确且当前的数据至关重要，以便临床医生能够迅速做出出患者治疗决策。\n\
  \n-   **数据身份验证：** 每个节点都可以使用身份验证机制识别并确认为其提供数据的节点身份，确保数据是真实且未被更改的。数据身份验证允许支持 TinyML\
  \ 的设备确保只有授权节点可以访问和共享敏感的患者数据，提高了患者的隐私和安全。\n\n-   **安全管理：** 协调节点有多种安全分发密钥的选择，包括加密通信通道、安全身份验证机制和其他类似措施。此外，协调节点可以采取必要步骤撤销密钥，阻止未经授权的人访问网络及其数据。使用协调节点和安全密钥管理程序允许无线体域网络（WBAN）在网络传输和接收过程中更好地保护敏感数据，防止未经授权的访问。\n\
  \n-\n\n**可靠性：** 为了接收器能够识别并修复任何传输问题，错误编码是一种在发送数据中添加冗余数据的方法。如果通信数据易受无线信道噪声或干扰，这种方法在支持\
  \ TinyML 的设备中非常有效。对于医疗监控等应用，数据错误可能会产生改变生命的影响，支持 TinyML 的设备的错误编码功能对于确保网络提供和接收的数据准确可靠具有无价价值。此外，通过减少传输错误导致的数据损坏或丢失的可能性，错误编码可以帮助提高网络的可靠性。\n\
  \n-   **安全定位：** 入侵者可以通过患者的移动和更新向位置注册系统输入虚假信号和信息，从而损害患者的隐私和安全。使用安全身份验证和加密技术可以避免这个问题，这些技术将更新位置信息的权限限制为授权设备。此外，位置注册系统可以配备频繁的监测和检测系统以捕捉可疑活动或未经授权的访问。为了保护患者信息的隐私并防止未经授权的人访问或篡改其位置数据，患者必须在\
  \ WBAN 中进行安全定位。在有适当保护措施的情况下，WBAN 可以确保患者位置数据得到安全可靠的跟踪。\n\n-   **问责制：** 所有医疗团队成员（包括管理人员）应意识到情况的严重性，并采取相应行动以保持患者个人信息的安全。如果负责未经授权使用或泄露患者信息，必须有人承担责任，因为这可能会产生灾难性的影响。因此，建立处理和保护患者信息的透明协议，并经常检查这些步骤以确保它们有效是至关重要的。\n\
  \n-   **灵活性：** 在紧急情况下，患者可能需要第三方或医院访问其信息。为了保证数据的隐私和准确性，系统应为授权方提供一种安全且有效的方法来访问和共享这些信息。收集患者许可和监管数据访问是共享患者信息的有效政策和程序框架中最重要的两个组成部分。\n\
  \n-   **隐私保护与合规性：** 确保患者隐私信息的安全是首要任务。全球范围内的标准和立法（如美国的《健康保险流通与责任法案》HIPAA）已实施以确保这一点。违反这些规则的人将面临刑事和民事处罚，例如罚款和监禁。医疗提供者必须遵守这些规则并保护患者的个人信息。\n\
  \n-   **数据真实性：** 为了无线医疗传感器网络正常运行，数据必须是合法的且源自可靠来源。可以使用公钥和私钥等身份验证方法来实现。使用公钥对数据进行加密并使用私钥进行解密。这确保了未经授权的方无法访问数据，且数据未被更改。患者记录对于护理和治疗至关重要，其信度和精度取决于数据身份验证。\n\
  \n-   **数据授权：** 授权技术控制用户对网络资源和服务的访问。访问策略和访问控制列表（ACL）共同工作，对网络上谁有权访问什么内容提供细粒度的管理。在医疗环境中，未经授权访问敏感患者数据是一个主要关注的问题，这至关重要。\n\
  \n\n\n\n人体传感器网络中对生命体征的监测和跟踪引发了对患者隐私的严重关注。如果攻击者窃听通信链路，可能会导致敏感患者信息的未经授权泄露。拥有足够强大的接收天线的攻击者可以拦截患者的网络连接，并窃取敏感信息，例如位置、时间戳、消息\
  \ ID 以及源地址和目的地址。恶意行为者利用这些数据造成身体伤害。患者的隐私和安全受到此类窃听操作的严重威胁（Butt et al. 2019）。医疗物联网（IoT）传感器系统通常采用无线网络进行通信，这些网络在传输过程中存在漏洞，且在通信范围内没有内在限制。这可能对敏感数据产生潜在危险。如果攻击者拦截并更改医疗\
  \ IoT 传感器传输到医生和医院服务器的信息，这些信息可能会被篡改。如果这种未经授权的数据篡改包括更改患者的生理数据并发送到服务器，可能会出现极其危险的情况。优先实施强有的安全措施以保护传输过程中患者的数据至关重要，确保其机密性、完整性、有效性和隐私性（Abouzakhar\
  \ et al. 2017）。\n\n## 8.4.1 不同类型的攻击\n\n**拦截：** 当攻击者获得访问权限时，携带患者生命体征数据从设备传输到医疗保健人员处的无线通信路径就会遭到破坏。一旦被拦截，数据可能包含敏感信息，包括患者的位置、病史或其他个人详情。\n\
  \n**消息篡改：** 这种攻击发生在预定接收者以外的人或物可以拦截通信并在发送之前更改其内容时。在医疗环境中，这种攻击特别成问题，因为它可能会导致虚假医嘱指令或信息的传输，从而对患者的健康产生负面影响。例如，攻击者可能会篡改患者的处方，导致其产生不希望的副作用。因此，数字签名和加密等方法对于医疗通信来说至关重要，用以保证消息的真实性和完整性。\n\
  \n**无线传感器路由威胁：** 在无线传感器网络的语境下，这些术语描述了在网络层采取的有害行为。这些威胁活动可能会导致虚假警报，包括窃取或更改数据包并将其发送到远程控制中心。攻击者引起网络中断的另一种方式是篡改捕获数据包的地址字段。这可能导致路由环路甚至整个网络崩溃。由于这些攻击，传输的数据可能会丢失其完整性和机密性。因此，保护无线传感器网络免受路由攻击需要强大的安全措施。\n\
  \n### 8.4.1.1 针对 TinyML 设备的主动攻击\n\n主动攻击会危及数据的有效性、完整性和秘密性，对 WBSNs 及其他无线传感器网络构成重大威胁。攻击者可以通过更改数据、插入虚假数据或播放之前记录的数据造成混乱和破坏。此外，攻击者可以通过伪装成有效节点并窃取重要数据，在无人知情的情况下控制网络。\n\
  \n**DoS 攻击：** 拒绝服务（DoS）攻击的目标是通过流量或其他有害活动淹没系统，阻止许多合法用户对系统的访问。具体而言，DoS 攻击可以中断无线体域网（WBANs）的正常运行，阻碍医疗数据的传输并可能使患者面临风险。“干扰”攻击是针对\
  \ WBAN 的一种常用 DoS 技术。这种攻击涉及执行者用过量的噪声或干扰淹没无线频谱，阻碍或阻塞有效数据的传输。如果负责监测患者的医疗人员没有获得患者传感器收集的生命体征或其他数据，可能会引发严重的健康并发。WBAN\
  \ 中的进一步拒绝服务攻击被称为“睡眠剥夺”攻击。这种攻击涉及执行者反复向患者电池供电传感器发送唤醒信号，阻止其进入省电低功率睡眠模式。这会迅速消耗传感器的电池寿命，使其无法传输关键医疗数据。医疗监测系统通常非常易受到\
  \ WBAN 中拒绝服务攻击的影响（Sikder et al. 2021）。\n\n#### 8.4.1.1.1 物理攻击\n\n由于其分散性和脆弱性，物理攻击对户外无线网络构成了巨大风险。与有线网络相比，它们更容易受到此类攻击。针对传感节点的物理攻击很常见且会导致永久性损坏。如果攻击者获得了物理访问权限，就可以窃取敏感信息或更改软件代码以造成更大的损害。\n\
  \n#### 8.4.1.1.2 欺骗路由信息\n\n这种攻击希望通过形成路由环路或不理想路径来重新路由网络流量，导致性能下降。攻击者可以在传输过程中更改数据包头信息，以提供错误的路由信息。人们可以通过操纵跳数、源地址或目的地址等路由指标来实现这一点。如果额外的节点获取这些错误的路由信息并利用其路由自己的数据包，这种攻击可能会扩散到整个网络。\n\
  \n#### 8.4.1.1.3 黑洞攻击\n\n在这里，网络中的恶意行为者对通汇点节点（网络收集数据的最终终点）的最快路径做出了夸大的声称。恶意行为者在说服其他网络节点它拥有最短路径后，将开始忽略或丢弃发送给它的任何数据包（Mucchi\
  \ et al. 2019）。因此，由于所有发往汇点节点的数据包丢失，网络遭受了严重破坏。黑洞攻击者有多种策略让其他节点相信它拥有最短路径。例如，它可以伪造路由消息、更改路由消息的跳数或序列号，或者利用网络协议漏洞，如图\
  \ 8.2 所示。\n\n![图 8.2 黑洞攻击。返回正文。](img/Fig08_02.jpg)\n\n图 8.2 黑洞攻击。返回正文。\n\n142 \n\
  \n#### 8.4.1.1.4 Sybil 攻击\n\nWSN 中的一种安全风险是 Sybil 攻击，当攻击者使用恶意节点模拟网络中的其他节点时发生。黑客通过建立多个虚假身份（或\
  \ Sybil 节点）来控制网络，然后操纵其中的数据和过程。DoS 攻击、路由信息泛洪或两者都是这些 Sybil 节点恶意行为可能的结果。由于攻击者能够在 Sybil\
  \ 攻击中假设多个虚假身份，WSN 的安全和功能面临风险。攻击者可以通过操纵其他节点通过 Sybil 节点路由通信来拦截并更改网络流量。此外，攻击者可以通过操纵\
  \ Sybil 节点提供不准确的网络结构图，欺骗真实节点做出错误的路由决策，如图 8.3 所示。\n\n![图 8.3 Sybil 攻击。返回正文。](img/Fig08_03.jpg)\n\
  \n图 8.3 Sybil 攻击。返回正文。\n\n\n\n\n\n### 8.4.1.1.5 虫洞攻击\n\n在无线传感器网络（`WSNs`）中，攻击者可以通过窃取数据包将其重新路由到网络的另一个位置来发动`wormhole\
  \ attack`。为了避免被标准的网络路由算法检测，攻击者可以在两个网络部分之间建立一个隧道（也称为虚拟连接）来发动此类攻击。这使得黑客能够访问网络并允许他们通过干扰数据传输、导致数据丢失甚至引入有害物质来破坏网络，如图\
  \ 8.4 所示。\n\n![图 8.4 虫洞攻击。返回正文。⏎](img/Fig08_04.jpg)\n\n图 8.4 虫洞攻击。返回正文。⏎\n\n###\
  \ 8.4.1.1.6 问洪水\n\n`你好洪水攻击`中的攻击者通过向传感器发送大量的`hello packets`来欺骗网络传感器使其认为一切正常。攻击者利用路由协议`hello\
  \ packet`将功率从一个节点转移到另一个节点。具有强大处理能力和宽传输范围的攻击者向跨越网络的几个传感器节点发送`Hello packets`。结果是传感器开始认为敌人是附近的邻居。因此，如图所示，受害者节点试图通过绕过被其视为邻居的攻击者与基站（`BS`）进行通信，如图\
  \ 8.5 所示。\n\n![图 8.5 问洪水攻击。返回正文。⏎](img/Fig08_05.jpg)\n\n图 8.5 问洪水攻击。返回正文。⏎\n\n###\
  \ 8.4.1.1.7 确认消息伪造\n\n`WSNs`中的进一步攻击发生在恶意行为者复制节点已传输的`acknowledgement message`的内容的内容，然后将其发回原始发送者时。攻击者可能使用这种方法欺骗发送者，使其认为消息已到达目标节点，而实际上并未到达。\n\
  \n### 8.4.1.1.8 节点故障\n\n单个节点的问题严重威胁`WSNs`的可用性和可靠性。一个节点的问题会对网络其余部分产生多骨牌效应，导致数据丢失或连接中断。此外，它还可能导致网络产生拥塞，从而增加延迟并降低吞吐量。节点故障可能由多种原因引起。可能的原因包括软件或硬件故障、断电或节点损坏。如果节点由于这些问题发生故障，可能会丢失重要数据且网络可能会崩溃。此外，攻击者可能会利用故障节点引入网络的漏洞来实施随后的攻击。\n\
  \n### 8.4.1.1.9 收集被动信息\n\n`被动侦听攻击`是指外部人员在不参与其中的情况下获取无线传感器网络数据传输的访问。在不干涉通信传输或传感器节点定位的情况下，他们可能会检查记录的数据以了解更多关于消息的内容，例如生理数据、位置和其他个人身份信息。\n\
  \n### 8.4.1.1.10 人造节点\n\n在无线传感器网络中，当攻击者伪装成合法节点时，就会出现`artificial node`（或虚假节点）。这类攻击可能导致网络崩溃甚至捕获敏感数据。由于其在单频网络中的潜在有效性，它在无线体域网络中得到了广泛应用。这是对网络的主要威胁。\n\
  \n#### 8.4.1.1.11 被动攻击\n\n`被动攻击`很难被发现，因为它们不会改变数据。为了收集敏感信息，几种技术包括`数据嗅探`、`扫描`和`流量分析`。在数据流经网络时拦截数据可以通过`认证和加密`来阻止。\n\
  \n### 8.4.1.1.12 拥塞\n\n当攻击者故意使射频（`RF`）频谱拥塞时，可能会导致网络性能不佳甚至网络故障。这种干扰可能是由于在同一通道上发送非常强的信号引起的。当传感器节点尝试重传损坏或丢失的数据包时，`congestion\
  \ attacks`会增加功耗并缩短电池寿命。\n\n### 8.4.1.1.13 频率传输\n\n为了应对不可预见的拥塞或干扰，采用了这种方法。该过程涉及通过序列更改广播频率，接收必须重建该序列以恢复初始消息。这种方法即使在噪声很大的环境中也能保护传感器网络免受伤害。另一方面，传感器节点可能会发现使用宽谱系统进行`frequency\
  \ transmission`复杂且昂贵。\n\n### 8.4.1.1.14 频率跳变\n\n`频率跳`意味着快速调整广播频率以避免被发现或干扰通信。这种攻击通常带有高昂的代价并需要大量的能量。由于许多传感器网络无法快速适应频率变化，因此防止`frequency\
  \ attacks`并不总是容易的。根据 Wood、Stankovic 和 Son 的说法，`jammed-area mapping`是减轻此类攻击影响的方法之一。\n\
  \n\n\n\n尽管如此，并非所有的体域传感器网络（WBAN）都能受益于这种方法，而且其成本可能很高。另一种很有前景的方法是使用算法来减轻单个关键组件对网络的影响。如果网络中的所有节点都与其代理和邻居共享一个密钥，那么仅攻破一个节点将产生局部影响。\n\
  \n## 8.5 面受限 IoT 设备的安全协议\n\n由于智能医疗传感器网络具有巨大的攻击面潜力，实施安全措施以防止任何攻击至关重要。在攻击发生之前、期间和之后，系统都必须进行防御。节点之间的通信需要交换加密密钥进行身份验证和加密，以提供安全服务（可用性、机密性、完整性和秘密性）。另一方面，众周知加密系统是防御任何攻击的第一道防线。加密方法识别正在进行的的危害最大的攻击同样重要。\n\
  \n此外，这些方法需要足够紧凑，以适应传感器网络（WSN）有限的资源。为了解决传感器设备资源受限的问题，经典的 WSN 部署提出了许多重要的安装和管理技术。由于资源消耗极低，大多数建议的方法都依赖对称加密原语。对于传感器节点而言，这些系统是效率最高的。\n\
  \n### 8.5.1 方法与协议分类\n\n通过预分发阶段，大多数基于对称、非对称或混合系统的方法解决了密钥设置问题。在部署之前将加密密钥存储在内存节点中的做法被称为\
  \ WSN 中的预分发。文献中已经对各种加密密钥管理技术进行了分类。\n\n两个或多个节点之间的密钥共享是某些分类算法的基础，而另一些算法依赖于使用概率、组合分析等。我们将一切分为两大类：一类是分布模型，另一类是密钥模型。对称设计属于第二类，而非对称方案属于第一类。图\
  \ 8.4 展示了这些对象的分类过程。在这里，我们将回顾发表论文中提到的最常用模型。对于物联网节点，安全通信与传统节点一样至关重要。身份验证、秘密性、完整性和不可否赖性是主要的安全标准。加密原语（如签名验证技术以及加密和解密算法）构成了这些安全服务的基础。\n\
  \n因此，需要一种关键的管理机制来适应 IoT 设备有限的能力和预算限制，这些限制不允许实现复杂的安全系统。为了实现在节点受限的资源上运行，现有的互联网密钥形成方法要么过于复杂，要么未能提供足够的安全程度。建立密钥的协议允许两个或多个节点共享一个秘密，该秘密随后可以作为不同类型加密的对称密钥。几种安全程序（包括保护源真实性、确保数据完整性和维护用户隐私的程序）依赖于对称密码文和消息认证码来实现这些目标。依赖非对称密钥机制以及其他预分发对称密钥方法的方案是现有智能传感器安全机制和方案的主要类型。本文使用的分类方法如图\
  \ 图 8.6 所示。\n\n![图 8.6 支持 TinyML 的设备的密钥管理模型。返回文本。⏎](img/Fig08_06.jpg)\n\n图 8.6 支持\
  \ TinyML 的设备的密钥管理模型。返回文本。⏎\n\n### 8.5.2 对称密钥预分发方案\n\n对称或密钥方法涉及使用相同的秘密密钥对消息进行加密和解密。部署前将密钥加载到节点中是这种方法的本质。物联网中密钥预分发方法主要有两种类型：确定性和概率性。主要的预分发过程可能根据此处的内容有所不同。\n\
  \n#### 8.5.2.1 SPINS\n\nSPINS 是由 Perrig 和其他几位作者提出的安全组件包 (Perrig et al. 2002)。它是首次针对\
  \ CWHN 提出的安全机制。两个协议即 `μTESLA` 和传感器网络加密协议 (`SNEP`) 成了它的基础。`SNEP` 只在每次传输中增加八字节，就能保证两个节点之间低成本的数据秘密性和身份验证。`TESLA`\
  \ 的增强版本被称为 `μTESLA`，保证广播的真实性。`SNEP` 使用计数模式 `CTR` (`CounTeR`) 来实现 `RC5` 加密技术。在部署初期，网络结构仅允许基站与传感器节点之间的通信。通过\
  \ `SPINS`，引入了一种新方法，让节点能够与基站之间的信任扩展到节点之间的直接连接。`SPINS` 使用 `SNEP` 和 `μTESLA` 独立地实现安全的双方密钥协商和身份验证路由应用，同时消耗极少的存储、计算和通信。但\
  \ `SPINS` 仍然存在一些根本性问题，如下：\n\n* 148 由于安全路由协议配对密钥预分发策略，`SPINS` 过度依赖基站。\n* `SPINS`\
  \ 忽略了通信密钥的更新，并且未能考虑到拒绝服务攻击的可能性。\n* 为了实现前安全性，需要一种实用的密钥更新方法。\n* `SPINS` 无法解决节点被攻破和隐藏通道泄露的问题。\n\
  \n#### 8.5.2.2 LEAP\n\nLEAP 是一种用于传感网络的密钥管理系统，称为“本地加密与身份验证协议”（Localised Encryption\
  \ and Authentication Protocol）。其主要目的是促进网络内部处理，同时将受损节点的影响限制在局部网络范围内。节点之间发送各种信号具有不同安全需求这一有趣的发现启发了\
  \ LEAP 的概念。基于这些发现，显然单一密钥系统无法满足这些许多安全需求 (Zhu et al. 2003)。对于每个节点，LEAP 支持建立四种密钥：\n\
  \n* **个体密钥**：与基站共享；\n* **成对密钥**：与另一个传感器节点共享；\n* **集群密钥**：与多个邻居节点共享；\n* **全局密钥**：网络中所有节点共享。\n\
  \n每个节点在传感器网络中交换的数据包可以分为几类，基于不同的标准，例如：\n\n* 控制包对比数据包\n* 广播包对比单播包\n* 查询或命令对比传感器读数等。\n\
  \n根据其分类，每个数据包的安全需求是独的。虽然秘密性仅适用于某些数据包类型，但几乎所有类型都需要身份验证。如下所示，传感器网络的一些安全通信无法通过单一加密技术满足。\n\
  \n#### 8.5.2.3 增强 LEAP\n\n\n\n\n\n根据 `LEAP+` (Zhu et al. 2006)，最重要的假设之一是节点在 `Tmin`\
  \ 时间内不会被攻破。这一理论听起来很合理；然而，只有在 `Tmin` 大于假设值的完美情况下它才可行。使用被称为“周期检查”（Periodic Check）的周期性验证来识别被攻破的节点是\
  \ Yassine and Ezzati (2016) 为解决此问题提出的两种策略之一，如图 8.7 所示。第二种模型在每个节点执行序列号并将其与基站 `BS`\
  \ 的信息进行比较后，决定是否移除共享密钥。该比较是在点对密钥设置阶段后完成的。\n\n![Figure 8.7 LEAP enhanced. Return to\
  \ text.⏎](img/Fig08_07.jpg)\n\n图 8.7 增强型 LEAP。返回正文。⏎\n\n#### 8.5.2.4 TinySec\n\n\
  作为无线传感器网络（WSN）数据连接层首次全面使用安全设计，`TinySec` 协议由 Karlof 等提出 (Karlof et al. 2004) 。该实现提供了两种安全选项：用于不带数据加密的消息认证的\
  \ `TinySec-Auth` 以及用于带数据加密的消息认证的 `TinySec-EA`。`TinySec` 像 `SPINS` 一样采用传统的加密方法提供隐私保护和消息完整性检查。`SPINS`\
  \ 使用 `RC5` 方法，而 `TinySec` 的作者认为 `Skipjack` 算法（Brickell and Davenport 1991）更适合 WSN。根据\
  \ `TinySec` 的评估，`RC5` 需要 104 字节的 RAM 进行预密钥计算。`TinySec` 采用 `CBC`（即密码块链接模式），而不是 `SPINS`\
  \ 的 `CTR` 加密模式。使用相同的随机值时，`CTR` 会加密更多数据包。由于这些数字的主要目的是生成加密密钥序列，它们的重复出现可能会损害方案的安全性，并使攻击者能够发现消息内容。`TinySec`\
  \ 并不是一种密钥分发技术，而是一种针对大型网络定制的实现。对于节点间的对称密钥共享，需要两个密钥：第一个用于消息加密，第二个用于消息 MAC（代码）计算。\n\
  \nLi et al. (2017) 提出了一种针对中心化双跳体域域网（WBAN）的轻量级匿名相互认证和密钥协商方案。该方案确保了数据传输中的机密性、相互认证和匿名性，这对保护患者信息至关重要。\n\
  \nXu et al. (2019) 提出了一种针对 WBAN 定制的轻量级匿名相互认证和密钥协商方案，优先考虑了前向安全性和计算效率。我们的方案利用哈希函数和\
  \ `XOR` 操作，在不诉诸非对称加密的情况下确保了前向安全性。通过 `ProVerif` 工具进行的安全性验证以及非正式分析，验证了我们方案的稳健性。\n\n\
  #### 8.5.2.5 概率密钥分发\n\n2002 年，Eschenauer and Gligor (2002) 提出了概率密钥分发。通常分为三个步骤：分发预密钥、发现密钥和建立密钥。\n\
  \n#### 8.5.2.6 确定性密钥分发\n\n本节讨论的密钥方案使用预定义的程序来建立密钥池并分发到整个网络中。\n\n\n\n\n\n其中一种方法是 Bloom\
  \ 方案 (Blom 1984)，它利用节点 `A` 和 `B` 共享的密钥来创建一个秘密对称矩阵 `D`。它们分别为 `A` 提供一个公矩阵 `IA`，为 `B`\
  \ 提供一个 `IB`。对于 `A` 来说，私钥为 `privA = DxIA`；对于 `B` 来说，为 `privB = DxIB`。最后一步通过求解 `(privA\
  \ × IB)` 或 `(privB × IA)` 来确定密钥对。这两种情况都涉及不变性困境。包含密钥管理的两种密钥结算方法包括 SNAKE (Seys & Preneel\
  \ 2002) 和 BROSK (Lai et al. 2002)。这两种协议都假设同一网络上的所有节点共享主密钥。`SNAKE` 中的每个通信节点都使用预共享密钥产生两个随机数符（nonces），共同形成会话。`BROSK`\
  \ 发送用于协商的重要消息——随机数符（nonce）。在节点收到来自邻居的消息后，可以通过确定两个随机数符的 `MAC` 来构建会话密钥。\n\n根据 Raza\
  \ et al. (2011)，基于 IP 的 WSN 可以通过使用 `6LoWPAN` 利用行业标准的 `IPsec` 协议来保障安全。他们提出的方法在整合\
  \ `IPsec` 与 `6LoWPAN` 层并压缩 `AH` 和 `ESP` 头部的同时，管理数据包大小。尽管这些技术对于源身份认证、消息完整性和 IP 数据包隐私性很有用，但\
  \ `AH` 和 `ESP` 技术并不足以处理密钥交换。使用预共享密钥有助于手动建立安全关系。\n\n#### 8.5.2.7 LORENA\n\nCoelho\
  \ et al. (2022) 解决了健康医疗物联网 (IoHT) 中的安全挑战，特别是在穿戴式医疗设备和远程健康监测系统中。随着医疗保健领域物联网设备的日益增多，确保敏感患者数据的安全传输变得至关重要。该论文提出了一种名为\
  \ `LORENA`（基于组的低内存对称密钥生成方法）的新型协议，用于利用生理信号（特别是心电图 (ECG) 数据）以低资源消耗生成对称密钥。`LORENA`\
  \ 建立了安全的通信信道并促进了密钥设备协议，确保了数据的机密性和完整性。`LORENA` 通过利用人体作为通信媒介并采用近似计算技术，在最小化资源使用的同时，实现了高效的密钥生成和传输。该论文的贡献包括定义通信协议、评估密钥生成效率，以及提供适用于低成本微控制器真实世界部署的可扩展解决方案。\n\
  \n### 8.5.3 非对称密钥方案\n\n通过使用“公”钥进行加密并使用“私”钥进行解密和签名，非对称或公钥方法确保了消息的安全性。根据 Nguyen et\
  \ al. (2015)，非对称方案主要有两种类型：用于密钥传输的公钥加密和用于密钥管理的经典非对称方法。接下来的章节将简要分析可以用于物联网的几种非对称密钥方案。\n\
  \n#### 8.5.3.1 基于公钥加密的密钥传输\n\n此子类研究了使用公钥承载秘密数据或协商会话密钥的密钥建立方案。使用了多种方法来生成公私钥对。此子类根据公/私钥的生成方法对这些机制进行分类。图\
  \ 8.7 给出了两个实体 `A` 和 `B` 之间通信场景的示例。在这种场景下，`A` 和 `B` 可以使用公钥创建一个加密通道。当支持证书时，证书颁发机构\
  \ (`CA`) 可以验证消息发送者的身份。对于资源受限的传感器节点，这种方法可能是昂贵的，特别是当使用如 `RSA` 等传统算法时。如果公钥和身份之间没有可验证的关系（即基于身份的加密、加密识别或\
  \ `CA` 介），这种方法将容易受到中间人攻击。事实上，`A` 和 `B` 无法验证对方的身份。在与 `B` 通信时，攻击者可以生成任何公钥/私钥并假装成 `A`。\n\
  \n#### 8.5.3.2 Micro-PKI\n\n传统的 `PKI`（公钥基础设施）的一种更紧凑的形式 Micro-PKI，是 Munivel and Ajit\
  \ (2010) 为 WSN 建议的方法。节点的公钥由受信任的权威签名。每个节点在部署前都会接收 `CA` 密钥，以便它们相互验证。网络中的节点在解码数据时使用公钥验证基站。作者建议包含一个使用相同加密的消息认证码\
  \ (`MAC`)，以保证消息的真实性。为了方便向网络添加新节点，基站的公钥保存在这些节点中。\n\n#### 8.5.3.3 TinyPK\n\n使用公钥和\
  \ Diffie-Hellman 原则，Watro et al. (2004) 提供了 `TinyPK`，一种在两个 WSN 节点之间建立秘密密钥的技术。在 `TinyPK`\
  \ 中，节点的公钥由受信任的权威签名。基站使用对称会话密钥。由于加密选择了 `RSA` 算法，节点消耗大量资源。\n\n#### 8.5.3.4 PKKE &\
  \ CBKE\n\nZigbee 的 `PKKE` 和 `CBKE` 协议中的密钥建立依赖于节点身份。使用这些 ID，我们可以生成一个用于解锁网络中任何两个节点的唯一密钥。然而，两个节点需要通信来生成共享密钥。因此，为了生成密钥，程序需要在两个方向交换多条消息。密码学界对基于身份的非交互密钥分发方案的缩写为\
  \ `ID-NIKDS` (Steinwandt & Suárez 2011)。\n\n#### 8.5.3.5 C4W\n\n一种新型方法 `C4W` 由 Jing\
  \ et al. (2006) 提出，它依赖节点的身份来确定公钥。通过使用自己的身份，节点可以推导出其他节点的公钥。在不需要证书的情况下，利用 Diffie-Hellman\
  \ 密钥交换原则，`C4W` 技术在任意两个节点之间生成单个共享密钥。密钥（私/公钥 `ECC`）和关于网络节点的公共信息在部署前被放入基站和节点中。\n\n\
  #### 8.5.3.6 pDCS (隐私增强数据中心型传感器网络)\n\n\n\n\n\n一种隐私增强以数据为中心的传感器网络（`pDCS`）架构，“以数据为中心的传感器网络，增强的隐私”（Shao\
  \ et al. 2009），使用由 Steiner 几何树划分的矩形单元来组织网络。每个单元内都有传感器和单元密钥。移动数据“汇点”收集并传输这些信息，但加密防止了未经授权的访问检测事件的原始传感器。再次，`Bloom\
  \ filter` 减少了 `pDCS` 生成的控制数据量。`ERP-DCS`，“用于 DCS 网络密钥重生成的高效协议”（Shun et al. 2013）被开发出来，用于在代理被破坏并识别时增强密钥管理机制。还采用了一种名为\
  \ `EBS` 的排除系统（排除基元系统）。\n\n#### 8.5.3.7 Zigbee\n\n虽然 Zigbee (2006) 的重点更为通用，但它使用了\
  \ `IEEE 802.15.4` 协议栈，该栈有时在传感器网络中使用。目前，它潜力成为所有“物联网”连接设备的 de 事实标准。当与传感器结合时，它通过加密数据、验证用户以及防止重放攻击来保护数据安全。随着\
  \ Zigbee 引入了“信任中心”的概念，密钥管理实现了集中化。虽然其他设计提供了额外的安全性，但这种设计是以报头和计算为代价的。\n\n使用带外通信或公钥的预分发是此类过程运作的两个示例。这些方法允许有限次数的消息交换，但它们无法处理大型网络，因为每个设备都必须知道其他所有人的公钥。针对无线传感器网络（WSN），建议了一些“原始公钥加密”方法，包括\
  \ `NtruEncrypt`（Gaubatz et al. 2005）和 Rabin (1978)。`RSA` 是许多加密系统中的算法，同样基于因子分解问题的困难性；`Rabin`\
  \ 的方案非常接近。有趣的是，该系统解密过程的功耗与 `RSA` 相同，同时保持了相同的安全水平。由于加密消息只需要一个方程，它为加密过程提供了一种相当快速的技术。替代加密系统之一是\
  \ `NtruEncrypt`，它使用了带有 `RSA` 和 `ECC` 原语的格结构。智能卡和 RFID 标签资源有限，由于其高效性，是这种技术的理想选择。`Rabin`\
  \ 方法、`NtruEncrypt` 和 `ECC` 是 Gaubatz et al. (2005) 中比较的限制设备的建议 PKC 技术。根据结果，`NtruEncrypt`\
  \ 平均而言是最节约的操作。\n\n尽管如此，这种加密方案可能会导致低层数据包分片，并在通信故障发生时多次重传，通常需要巨大的消息。如果发射功率是最重要且具限制性的组件，那么基于“原始公钥加密”的协议对消息交换的需求较低，这非常有利。Mahmood\
  \ 等人（2017）提出了一种基于双级会话密钥（`TSKs`）的物联网（IoT）认证方法。此外，还介绍了一种关联节点的技术。端端用户可以使用 `TSK` 安全地以最小的开销进行通信。\n\
  \n由互联网工程任务组（IETF）建立的许多安全服务标准将 `TLS` 作为其首选协议（Turner & Polk 2011)）。然而，Kothmayr et\
  \ al. (2012) 和 Raza et al. (2013) 所述，在 IoT 中并不推荐 `TLS`。`TLS` 通常与 `TCP` 等可靠传输协议一起使用，由于其拥塞管理方法，对于资源有限的设备并不理想。`Datagram\
  \ Transport Layer Security (DTLS)` 是一种在极限制环境下替代 `Transport Layer Security (TLS)`\
  \ 的新提案。它提供了与 `TLS` 相同的强大安全性，但运行在不稳定的 `UDP` 传输技术上。使用证书的核心是昂贵的。研究人员检查了以下软件硬件增强以降低能耗：加密硬件加速器的实现：加密涉及计算由硬件加速器处理。Kothmayr\
  \ 等人（2012）提出了一种利用传感器节点硬件的 `DTLS` 实现技术。该方法基于所有传感器都安装了 `TPM (Trusted Platform Module)`\
  \ 的前提。名为 `TPM` 的集成设备提供了对 `RSA` 算法的硬件支持以及防篡密钥的生成和存储。在部署之前，发布者必须存储一个受信任的 `CA` 证书和一个集成了受信任硬件模块（`TPM`）的发布者证书。对于没有\
  \ `TPM` 芯片的发布者，我们使用 `DTLS` 预共享密钥加密密钥提供认证。该密钥在部署前需要将少量随机生成的字节放在发布者上。为了让 `AC` 服务器向具有适当权限的人提供设备密钥，该秘密也必须供他们访问。除了在借助授权第三方建立信任方面具有高度安全性外，该解决方案还提供了廉价的能量、端端延迟以及消息完整性、机密性和真实性。\n\
  \nMaleh 等人（2016）最近的研究通过降低 `DTLS` 协议的通信成本来缓解拒绝攻击。为了减轻网络负担并节省空间，`Constrained Application\
  \ Protocol (CoAP)` 整合了升级的 `DTLS` 协议。\n\nShamir (1984) 创建了身份加密的初始版本。个人或组的公钥在此加密方法中定义为已知字符串（身份）。称为\
  \ `PKG (Public Key Generator)` 的第三方使用每个实体的公钥创建其私钥，如图 8.8](#C_010_c8.xhtml#f8_8）所示。利用身份建立安全通信，任何传感器节点都可以轻松生成其他节点的公钥。对合法传感器的验证有助于撤销程序。由于\
  \ `PKG` 可以访问网络中所有节点的私钥，基于身份的方案容易受到密钥攻击。根据 Yang et al. (2013) 和 Granjal et al. (2013b)，`ECC`\
  \ 原语是在限制环境下使用 `IBE` 范式最常见的方法。其他原语也有其实现；例如 RSAGamal。但由于存在大量的幂运算，且每个运算都有很大的指数，对于限制性节点来说是昂贵的。以\
  \ Boneh and Franklin (2003) 的设计为灵感，`IBAKA` 是 Yang 等人（2013）提出的 `IBE` 系统。然而，为了创建会话密钥，他们修改了\
  \ `IBE` 技术使其与 `ECDH` 密钥交换工作。每当启动密钥密钥时，他们的提案需要两次双线性映射和三次标量点乘法。\n\n\n\n\n物联网中基于非对称原语的密钥协商协议属于此类。根据许多研究，密钥协商协议是两个或多个方建立共享秘密的一种，且其他任何人都无法推测出该秘密的价值有多大（Nguyen,\
  \ Laurent, and Oualha 2015）。非对称密钥协商的一个示例所示图 8.9。对称密钥协商协议的一个显著示例是 Diffie-Hellman\
  \ (DH) 协议及其变体（E. Rescorla 1999）。然而，根据 lwig 术语中基于资源能力对节点进行的分类，Diffie-Hellman 协议对于资源有限的节点（即\
  \ 0 类和 1 类节点）被认为是不合适的且代价昂贵的(Bormann et al. 2013)。在有限环境下，考虑了使用 ECC (ECDH) 的 Diffie-Hellman\
  \ 协议变体。与 RSA 相比，ECDH 加密原语的密钥尺寸小得多。美国国家标准与技术研究院 (NIST) 已经证明，为了达到 128 位 AES 密钥的安全性，通过椭圆曲线生成的\
  \ 256 位密钥比 RSA 和 DH 协议使用的 3,072 位更优。例如，提供了一种用于物联网的无线传感器网络 (WSNs) 端到端自适应安全框架，以及带有委托\
  \ ECC 公钥认证的端到端传输层安全机制(Granjal et al. 2013a)。对于传感器网络，IBAKA 提供了 ECDH 和 BIE 的混合方案（Yang\
  \ et al. 2013）。使用基于标识的 Boneh 模式，该系统在 ECDH 协议的基础上确保了消息交换的机密性(图 8.10)）。\n\n![图 8.9\
  \ 基于身份的密码体系方案。返回文本。⏎](img/Fig08_09.jpg)\n\n图 8.9 基于身份的密码体系方案。返回文本。⏎\n\n![图 8.10\
  \ 基于非对称机制的密钥协商。返回文本。⏎](img/Fig08_10.jpg)\n\n图 8.10 基于非对称机制的密钥协商。返回文本。⏎\n\n使用公钥方法和\
  \ Rabin 方案，Hayajneh et al. (2014) 为体域域网 (WBAN) 提出了一种轻量级认证协议，该协议非常适用于资源有限的小设备。在医疗环境中，该技术旨在植入患有各种疾病的个体体内。执行器、医生、传感器和节点协调器是系统的四个组成部分。在系统中，这些节点之间进行安全通信。\n\
  \n在 Lu et al. (2015) 工作的基础上，该论文强调了智能电子健康记录 (SEHR) 系统对鲁棒认证的需求，以确保安全和隐私。为了保证协议对攻击的韧性，使用了\
  \ `ProVerif` 工具。Abdziem and Tandjaoui (2015) 为 TMIS 引入了一种新的协议，该协议计算开销更大。作者建议了一种适用于健康应用的安全方法，该方法混合了对称和非对称加密。\n\
  \nFeng et al. (2020) 为智能电子健康记录 (SEHR) 系统提出了一种协作认证协议，解决了确保安全和隐私的挑战。通过引入基于双方计算的协作认证协议，该论文旨在提高患者的效率和安全性。此外，该论文对所提协议的可证明安全性和性能进行了深入分析，证明了其在实际应用中的有效性。\n\
  \nJegadeesan et al. (2020) 提出了一种用于 WBAN 的新型隐私保护双向系统，他们还引入了一种隐私保护协议。该协议旨在为用户的可穿戴传感器与远程服务器之间提供隐私且高效的数据传输。所提协议的三个主要组件是用户、代理节点和远程服务器。该协议保护用户的匿名性，使用户对代理节点和远程服务器均保持匿名状态。其基于椭圆曲线密码学和哈希函数的唯一加解技术实现了实体之间的安全通信。所提协议的四个主要部分是注册、身份验证、创建会话密钥和交换消息。用户的认证和会话密钥生成发生在注册步骤。在认证阶段，会话密钥用于用户与代理节点之间的双向认证。\n\
  \n此外，代理节点验证远程服务器。用户和远程服务器在会话密钥建立阶段建立密钥。用户和远程服务器已创建会话密钥，并准备好交换加密通信。WBAN 可以受益于所提 EPAW\
  \ 协议的隐私保护双向认证方法，该方法既高效又安全。该协议在安全连接用户可穿戴传感器到远程服务器的同时，还保护了用户的匿名性。\n\n\n\n\n\n2020\
  \ 年有人建议无线传感器网络使用新的身份验证和密钥协商系统(Rehman et al. 2020）。用户节点（UNs）、网关节点（GNs）和远程医疗服务器（RHSs）是该设计的三个组成部分。该方案利用哈希函数和对称密钥加密确保实体之间的安全通信。首先，`UN`和`GN`创建一个会话密钥；其次，`GN`和`RHS`使用第一次会话建立的密钥来共享密钥。这是密钥协商程序两个步骤中的第一个。为了确保实体之间发送的通信是合，身份验证程序使用了消息认证码（MACs）。建议的方法保护数据免受重放、冒充和中间人攻击，同时促进了实体之间的双向认证。为了确保该方案安全并按预期运行，我们使用`AVISPA`工具运行了它。安全性研究表明，该方案是安全高效的；因此，它可以用于无线体域网（WBANs）。目前，现有技术与建议的方法相比，占用内存更多、计算时间更长，且通信开销更大。\n\
  \nOlufemi and Adedamola (2020)提出了一种安全寻址与双向认证（SAMA）协议。随着医疗与物联网技术的快速融合，确保患者与医生之间的远程安全通信变得日益重要。论文强调需要一种健健的协议来唯一识别智能医疗设备（SMDs），并在这些设备与医疗认证服务器（HS）之间建立相互信任。`SAMA`方案旨在通过利用改进的标准`IPv6`地址格式进行安全寻址，结合密码认证、医生和`SMDs`的唯一身份验证，以及通过会话密钥建立安全通信通道来实现目标。通过封装每个数据包而不增加数据包大小，所提协议旨在减轻各种安全威胁，并确保患者数据的完整性和机密性。\n\
  \nPirmoradian et al. (2023)评估了 Sowjanya et al. (2020)最近为 WHMS 提出的基于椭圆曲线密码学（ECC）的认证方案的安全性。我们的分析揭示了方案在被动内部秘密泄露和重放攻击方面的漏洞。为了解决这些缺陷，我们提出了一种新型基于`ECC`的认证方案`ECCPWS`，旨在有效缓解这些漏洞。我们为`ECCPWS`提供了非形式和形式安全证明，包括使用真实或随机（ROR）模型、Burrows-Abadi-Needham（BAN）逻辑的分析，以及使用`Scyther`和`AVISPA`工具的验证。我们的发现表明，`ECCPWS`针对各种安全威胁提供了全面的安全保障，确保了\
  \ WBAN 中患者数据的完整性和隐私。\n\nJoha et al. (2024)提出了一种安全的智能工业物联网（IIoT）框架，该框架在真实的工业能源管理背景下，将\
  \ AI 驱动的实时短期主动负载和反应性负载预测与异常检测相结合。它引入了一种混合深度学习模型——`TCN-GRU-Attention`，用于对有功和无功负载进行准确的提前一天预测，性能优于传统模型。同时，该研究提出了一种优化的`Isolation\
  \ Forest`算法用于实时异常检测，能够有效识别工业设备在瞬态状态下的异常。该系统设计部署在资源受限的边缘设备（如`Jetson Nano`）上，确保了低延迟运行和计算效率。为了确保数据传输和系统完整性，该框架采用了`TLS/SSL`协议和加密凭据。而言，该框架提供了一种可扩展、节能高效且安全的架构。\n\
