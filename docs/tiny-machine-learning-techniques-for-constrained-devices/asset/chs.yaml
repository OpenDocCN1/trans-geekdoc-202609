  \ 返回文本。⏎\n\n28\n\n# 3 用于低功耗 IoT 和 LPWAN 应用程序的 TinyML 与边缘 AI\n\nIsmail Lamaakal,\
  \ Yassine Maleh, Khalid El Makkaoui, and Ibrahim Ouahbi\n\nDOI: [10.1201/9781003544449-3](https://doi.org/10.1201/9781003544449-3)\n\
  \n## 3.1 引言\n\n物联网 [1] 已经迅速发展，影响了许多领域，包括智能城市、制造业、医疗保健、物流和环境管理。这种扩张是通过有线和无线互联网连接集成资产和设备来驱动的，实现了广泛应用中的数据采集、自动化和智能控制。\n\
  \n考虑到 IoT 实施的多样性，其技术需求存在差异 [2]。它们可能涉及各种通信技术——从基于近距离的本地网络到广域网（WAN）。在大规模部署中，能量效率、覆盖范围、成本和网络容量等挑战成为关键关注的问题\
  \ [3]。为了解决这些问题，低功耗广域网（LPWAN）应运而生，强调长距离、低能耗且极低带宽需求的通信 [4]。LPWAN 技术——如 LoRaWAN、NB-IoT、LTE-M、Sigfox\
  \ 和 Ingenu [5]——由于其可扩展性、长电池寿命、高性价比，以及在某些情况下的免许可运行，而被越来越多地采用。\n\n同时，人工智能（AI）、机器学习（ML）\
  \ [6] 和数据科学的进步改变了处理和利用数据。传统的 IoT 解决方案依赖云端处理，这引入了高延迟、带宽限制以及隐私和数据安全漏洞等担忧。此外，IoT 设备通常受到有限处理能力、内存和能量容量的限制\
  \ [7]。\n\n边缘计算和雾计算通过在更数据源的地方进行本地数据处理，提供了一种极具吸引力的替代方案。这些范式通过引入智能雾节点——如路由器 [8,9]、网关或集群——能够运行\
  \ AI 模型，从而减少了对云端的依赖。这种架构最小化了网络负载，降低了延迟并加强了数据安全，同时提供了更好的能量效率。\n\n向更紧凑、更智能硬件的推动使得将\
  \ ML 模型直接部署在嵌入式设备上成为可能。这些设备通常使用计算和存储资源有限的微控制器（MCU）或微处理器 [10]。虽然传统的 ML 模型通常超过此类设备的限制，但一种被称为\
  \ TinyML 的新方法应运而出。TinyML 能够在资源受限的边缘节点上部署优化的 ML 算法，使本地化智能成为可能。\n\n这种创新以更高的效率和安全性支持了边缘的基础的基础分析。随着微处理器性能和可获取性的提高，部署\
  \ ML 模型的成本和复杂性大幅下降。这促进了新型应用的增长，包括图像和音频处理、事件检测和振动分析。\n\n与基于云的系统不同，TinyML 解决方案减少了传输原始数据的需求，从而在提高隐私性的同时降低了延迟和能耗。全球边缘人工智能（edge\
  \ AI）市场反映了这一势头，预测将从 2022 年的 156 亿美元增长。\n\n\n\n\n\n为了进一步提高效率、降低延迟并低成本增强数据安全，TinyML\
  \ 提供了一项有效的解决方案。通过在边缘设备上直接运行轻量级机器学习（ML），TinyML 实现了节点侧决策和分析。这些操作无需与 `31cloud` 保持持续通信，从而减少了功耗、通信开销以及遭受安全漏洞攻击的风险。\n\
  \nTinyML 预计将在新兴的万物连接（IoE）[12] 以及沉浸式技术（如增强、虚拟和扩展现实 AR/VR/XR）中发挥变革性作用。这些领域需要本地化、低成本且注重能源的计算，以支持实时交互式体验。\n\
  \n随着 LPWAN 采用的加速，其应用正扩展到各种新型领域中——其中许多应用需要严格的规范，包括低延迟、低功耗、高数据隐私和极低成本。例如资产跟踪、环境监测和智能抄表，如表\
  \ 3.1 所示。\n\n### 表 3.1 基于 TinyML 的物联网/LPWAN 应用返回文本。⏎\n\n| 领域 | 应用 |\n| :--- | ---\
  \ |\n| 智慧城市 | 智能停车、建筑和桥梁结构健康监测、空气质量测量、噪声水平监测、交通拥堵和灯光控制、道路收费、智能照明、垃圾收集、废物管理、街道清洁、公用事业计量、火灾检测、电梯监测、井盖监测、洪水管理、施工现场设备跟踪、人员健康监测和公共安全系统。\
  \ |\n| 智能环境 | 水质监测、空气污染、温度变化、森林火灾、滑坡、动物移动、雪深和地震早期预警。 |\n| 智能水务 | 水质分析、泄漏检测、洪水监测、游泳池管理和化学品溢漏检测。\
  \ |\n| 智能抄表 | 电、气、水智能表；燃气管道监测；仓库环境监测。 |\n| 智能电网与能源 | 电网控制、负载平衡、远程测量与监测、变压器健康分析以及风能/太阳能设施监测。\
  \ |\n| 安全与应急 | 周界访问控制、液体检测、辐射监测以及爆炸性或危险气体的检测。 |\n| 零售 | 供应链优化、智能购物系统、智能货架和自动化产品管理。\
  \ |\n| 运输与物流 | 保险跟踪、车辆监测、租赁/租系统、道路危险检测、定位、路径规划、货物状态监测、存储兼容性检查、车队跟踪、智能高铁和出行即服务系统。\
  \ |\n| 工业自动化与智能制造 | 机器机器系统（M2M）、机器人、室内空气和温度监测、生产线控制、臭氧监测、室内定位、车辆诊断、预测性维护、能源使用跟踪和工业即服务平台。\
  \ |\n| 智慧农业与耕作 | 温度、湿度、碱度监测；葡萄酒品质优化；智能温室；机器人农业；气象站；堆肥/肥料控制；水培；牲畜跟踪和气体毒性监测。 |\n|\
  \ 智能家居/建筑与房地产 | 能源/水用量监测、温度、湿度、烟雾/CO/CO[2] 水平、洪水、占用检测（空间即服务）、入侵检测、电器远程控制以及艺术品和物品保护。\
  \ |\n| 电子健康、生命科学与可穿戴设备 | 患者健康监测、连接医疗环境、可穿戴传感器、患者监测、紫外线监测、远程医疗、跌倒检测、辅助生活、医疗存储条件、运动健康跟踪、慢性病监测和蚊虫种群跟踪。\
  \ |\n| 农业与食品 | 鱼类养殖优化、动物福利、农场空气质量监测、灌溉水监测、太阳辐射检测、产量最大化以及病虫害防治。 |\n| 可持续性 | 自然区域的空气和水质监测、森林火灾检测和洪水风险评估。\
  \ |\n\n然而，这些用例在运行需求上存在差异。虽然某些应用（如公用事业计量）可以单一设备类型标准化，但其他应用则需要更异化的设备配置以满足其复杂需求。因此，LPWAN\
  \ 解决方案必须针对特定或广泛的约束进行定制，平衡覆盖、容量、成本和能源消耗等因素 [13]。\n\n与此同时，为特定应用选择合适的边缘 AI 平台涉及评估多个参数：计算延迟、处理能力、功率效率以及重量和外形尺寸等物理特性。对于实时系统，具有高处理能力和极低延迟的平台至关重要。\n\
  \n32 LPWAN 和边缘 AI 基础设施都可以根据应用场景进行微调。表 3.2 展示了各种用例与其对应的 LPWAN 和边缘 AI 优先级的比较映射。它为互操作性、延迟和能源需求等关键设计考虑分配了定性值——高（H）、中（M）或低（L）。决策矩阵有助于架构师和开发者根据其特定的部署目标选择最优配置。\n\
  \n### 表 3.2 应用与 LPWAN 及边缘 AI 的需求映射返回文本。⏎\n\n| 应用 | LPWAN 需求 | 边缘 AI 需求 |\n| :---\
  \ | --- | --- |\n| 覆盖 | 容量 | 成本 | 低功耗 | 特定需求 | 延迟 | 处理能力 | 低功耗 | 尺寸/重量 |\n| 智慧城市\
  \ | H | H | H | M | H | H | M | M | H |\n| 智能环境 智能水务 | M H H H | H M H L | H M M\
  \ H | H L L H | M L L H | M H H H | M L H H | H M H | H M M H |\n| 智能抄表 | H H |\
  \ H H | H M | L L | M H | M H | M H | L H |\n| 智能电网与能源 安全与应急 | L | H | H | L | L\
  \ | H | H | L |\n| 零售 运输与物流 | | | | | | | | | |\n| 工业自动化与智能制造 | H H H H | H M H\
  \ H | M L M H | H L H H | L L H H | M H H |\n| 智慧农业与食品 | | | | | | | | | | |\n|\
  \ 智能家居/建筑与房地产 电子健康、生命科学与可穿戴设备 | | | | | | | | | | |\n| 可持续性应用 | | | | | | | | |\
  \ | |\n\n\n\n\n\n随着资源受限的物联网（IoT）和 LPWAN 节点日益普及，这种模型变得越来越不实用。这些设备——通常由微控制器驱动——计算能力有限，内存极小，且通常由电池供电。它们的主要作用是采集传感器数据并进行基础处理。依赖云端处理可能会引入不可接受的延迟并迅速耗尽能量资源。\n\
  \n为了克服这些挑战，边缘 AI 的概念应运而生 [14]。这种方法允许直接在设备上执行 AI 模型，从而消除了频繁与云端通信的需要。边缘 AI 通过在本地处理数据来实现实时决策，降低了延迟、提高了数据隐私和安全性、降低了功耗并减少了对连接的依赖。\n\
  \n边缘 AI 的一个专门子领域——TinyML，在超低功耗应用中备受关注。TinyML 专注于在基于微控制器的系统上部署高度优化的机器学习模型。这种范式能够在不影响核心功能的前提下，以极低的成本和能耗实现设备端分析。\n\
  \n边缘 AI 和 TinyML 的优势是多方面的：低延迟、减少带宽需求、增强隐私和数据保护、极能耗、本地学习能力以及整体成本效益 [15]。这些优势使其成为不断扩张的万物智能（IoE）格局的理想选择，数十亿受限设备正在自主运行。\n\
  \n随着技术趋势的持续演进，预计许多 AI 应用将转向边缘。这种转变将进一步实现计算计算，让智能更接近数据源。尽管前景广阔，边缘 AI 和 TinyML 也面临着若干技术挑战——特别是由于硬件限制和系统集成约束——这些将在后续章节中进行探讨。\n\
  \n## 3.5 边缘 AI 和 TinyML 的挑战\n\n边缘 AI 通过在设备上实现本地数据处理改变了计算范式，从而减少了对集中云服务器或雾服务器的依赖。尽管具有优势，但边缘\
  \ AI 的部署——尤其是结合 TinyML——面临着若干技术和运行挑战，这些影响影响其效率、扩展性和可靠性 [16]。\n\n*   **节能运行：** 确保能源效率对于延长节点寿命至关重要，特别是在数据传输频率低、速率低的\
  \ LPWAN 场景中。节点必须支持超低功耗模式（如睡眠状态），并在空闲期间禁用高能耗组件（如收发器）[14]。这些收发器应仅在主动通信时触发。此外，运行在这些设备上的\
  \ ML 模型必须是轻级的且经过优化，以便在有限的能量预算内运行。\n\n*   **扩展性：** 随着边缘设备数量的增加，扩展性成为一个关注的问题。管理增加的数据量和网络流量会导致可靠性和性能下降。有效的扩展性需要负载均衡、分布式处理策略\
  \ [17] 以及边缘编排和边缘到云协同等技术。这些有助于在大规模化下保持系统的响应能力和健壮性。\n\n*   **内存限制：** 大多数边缘设备受限于极小的板载内存和有限的存储容量。随着数据集的增长或需要更复杂的\
  \ ML 模型，设备可能无法维持实时性能 [17]。因此，选择或设计内存高效的算法，并开发针对边缘约束的基准测试集至关重要。\n\n*   **延迟：** 即使有本地处理，从传感器输入到可执行输出也可能由于内存访问时间、传感器响应和\
  \ ML 模型复杂度等因素产生延迟。诸如边缘缓存（在节点附近存储频繁使用的数据）和联邦学习（在不共享原始数据的情况下跨分布式节点训练模型）等策略，在保护隐私的同时能有效缓解延迟问题。\n\
  \n*   **机器学习模型复杂度：** 在嵌入式系统上部署高级 ML 模型通常限于缺乏专用的 ML 加速器。此外，高级模型开发工具可能无法直接转换为兼容边缘的版本，增加了压缩、可移植性和执行效率的复杂性。\n\
  \n*   **成本效益：** 在缺乏对硬件成本支持的情况下，物联网和 LPWAN 的快速扩张带来了挑战。边缘设备通常需要特殊的微控制器、传感器和执行器，这会增加硬件成本。在软件方面，利用现有基础设施、采用开源解决方案以及优化硬件软件集成至关重要。\n\
  \n*   **网络与数据集成：** 数据管理和互操作性是边缘环境的主要障碍。硬件、软件和通信协议的差异可能导致集成冲突。边缘数据移动与延迟和功耗密切相关，特别是对于高频数据源。通过联邦学习和数据压缩等技术对于维持性能和隐私至关重要。\n\
  \n*   **数据安全与隐私：** 安全在边缘 AI 实现中至关重要。设备应采用安全启动机制和硬件信任来保护系统完整性。这些通过威胁建模、代码审查和加密通信协议得到补充。TinyML\
  \ 的一大优势是将原始数据本地化，从而减少隐私风险和受网络威胁的影响。\n\n## 3.6 硬件与软件考量\n\n在边缘部署 AI 需要对硬件和软件组件进行仔细评估，以满足各种\
  \ IoT 和 LPWAN 应用的约束和目标。许多边缘 AI 平台可以通过让算法靠近数据源来支持这种部署。这种接近性降低了延迟，减少了带宽消耗并增强了实时响应。\n\
  \n流行的边缘 AI 平台包括 `TensorFlow Lite`、`PyTorch Mobile`、`Open VINO`、`NVIDIA Jetson`、`Edge\
  \ Impulse`、`Caffe2` 和 `Apache MXNet` [1]。这些平台在模型优化、设备支持和处理能力方面各有侧重 [2]。对于 TinyML\
  \ 而言，`TensorFlow Lite` 和 `TensorFlow Lite Micro` 由于其轻量级运行时对微控制器的兼容性，是最广泛采用的。\n\n\
  ### 硬件考量\n边缘设备——特别是基于微控制器的设备——通常在计算能力、内存电池寿命方面存在限制。这些限制会影响它们执行图像处理或自然语言理解等复杂任务的能力。为了应对这些约束：\n\
  \n*   可以使用硬件如现场可编程门阵列 (`FPGAs`)、专用集成电路 (`ASICs`) 和 `GPUs` 来提升边缘处理效率。\n*   实时处理很大程度上取决于\
  \ CPU 频率、可用 RAM 和内存访问速度等因素。\n*   高效的电源管理至关重要。低功耗芯片组、硬件加速器、动态频率缩放和优化的工作周期等策略有助于延长设备寿命，无需频繁充电。\n\
  \n\n\n\n\n# 软件考量\n\n选择合适的软件工具对于边缘 AI 系统的成功同样重要。软件必须与各种组件兼容，包括传感器、处理器、操作系统和编程环境 [3]。\n\
  \n*   硬件与软件之间的集成必须是无缝的，以支持实时处理。\n*   软件应具有可扩展性，能够处理日益增长的数据量和计算需求，且不牺牲性能。\n*   精确性和可靠性对于生成可操作的洞察至关重要，特别是在医疗保健和智能基础设施等关键应用中。\n\
  *   解释性也必须被优先考虑；模型输出的结果应该是逻辑结构化的，并且能够被终端用户或其他自动化系统理解。\n\n总而言之，优化硬件和软件资源对于满足边缘 AI\
  \ 和 TinyML 部署的严苛要求至关重要。这些组件的仔细协同设计确保了系统能够响应迅速、高效，并适应日益增长的智能 IoT 生态需求。\n\n37\n\n\
  ## 3.7 结论与未来工作\n\n本章强调了将微机器学习（TinyML）和边缘 AI 集成到低功耗 IoT 和 LPWAN 生态系统中的变革性潜力。通过实现本地化、高能和实时的数据处理，这些技术解决了延迟、带宽限制和数据隐私方面的关键挑战。我们研究了定义当前格局的体系框架、应用领域和技术局限性，以及对于成功部署至关重要的硬件和软件考量。尽管取得了显著进展，未来的研究应侧重于改进模型压缩技术、确保边缘端安全且保护隐私的学习，以及开发标准的基准以评估异构平台上的性能。此外，进一步探索可操作的软件栈和可扩展的部署策略对于支持下一代智能、资源受限的\
  \ IoT 系统至关重要。\n\n## Note\n\n1.  [Gartner 确定了塑造数据科学和机器学习未来的 10 大趋势](https://www.gartner.com/en/newsroom/press-releases/2023-08-01-gartner-identifiestop-trends-shaping-future-of-data-science-and-machine-learning)。返回正文。\n\
