  \ 51, 3012–3025. 返回文本.\n\n\n\n\n\n# 文献 [9] 回顾了适用于下一代可穿戴技术的多种 AI 和通信策略。文献 [10] 的作者创建了一种名为\
  \ `BandX` 的 get 设备，该设备利用可穿戴传感器，在 `TinyML` 的帮助下识别人类活动。近年来，可穿戴式医疗健康设备的普及日益增长，因为它们可以测量各种医疗指标。表\
  \ 5.1 显示了可穿戴式医疗设备及其功能。\n\n## 表格 5.1 可穿戴式医疗设备及其功能\n\n| 设备类型 | 详情 |\n| --- | --- |\n\
  | 可穿戴式健身追踪器 | Fitbit、Garmin 和 `Apple Watch` 可以测量步数、运动距离、卡路里和心率等运动活动。它们通常包含 `GPS`、睡眠追踪和运动监测。\
  \ |\n| 智能手表 | 将智能手机通知与健身监测功能相结合。可以追踪心率、睡眠习惯和身体活动。 |\n| 心率监测仪 | 在活动、休息或压力状态下持续测量和监测心率。提供有关心血管健康的见解。\
  \ |\n| 血压计 | 实现全天候便捷且持续的血压监测。帮助追踪变化并与医疗保健提供人员共享数据。 |\n| 血糖仪 | 允许进行持续血糖监测以进行糖尿病管理。使用传感器测量血液或间隙液糖水平，并将数据传输到智能手机。\
  \ |\n| 心电图监测仪 | 捕捉心脏电活动（例如 `Apple Watch Series 4+`）。可以检测异常心跳和心房颤颤等病症。 |\n| 睡眠追踪器\
  \ | 测量睡眠模式、时长、质量和阶段。识别睡眠干扰、效率和潜在的障碍。 |\n| 姿态矫正器 | 使用传感器检测身体位置并提供反馈以维持正确姿态，帮助防止不良姿态习惯。\
  \ |\n| 紫外线监测仪 | 测量紫外线辐射暴露情况并提供实时警报，帮助防止皮肤损伤。 |\n| 智能衣物 | 将传感器集成到织物中，以追踪心率、呼吸、温度和活动水平等生命体征。用于远程患者监测和运动表现评估。\
  \ |\n\n## 增长趋势与市场分析\n\nCOVID-19 疫情导致 2019 年至 2023 年间使用可穿戴技术的人数激增。可穿戴设备的使用趋势如 表 5.2\
  \ 所示。\n\n## 表格 5.2 年度用户增长数（百万）\n\n| 年份 | 用户数（百万） |\n| --- | --- |\n| 2019 | 68.5\
  \ |\n| 2020 | 87.7 |\n| 2021 | 85.2 |\n| 2022 | 88.5 |\n| 2023 | 91.3 |\n\n可穿戴医疗技术市场正在扩大，随着技术的成熟，更多的可穿戴技术将供企业和个人使用。Insider\
  \ Intelligence 的分析预测，到 2023 年，将有 9130 万健身和健康应用用户，高于 2022 年的 8850 万。\n\n虽然可穿戴设备用户优先考虑方便获取健康数据\
  \ [5,11]，但有几个关键因素影响成年人采用医疗设备：用户友好的设计对于无缝交互至关重要，同时还需要强有隐私保护和数据安全措施以维护机密性；个性化的护理方案显著增强了参与度，维护要求简单的设备也是如此；负担对可及性起着至关重要的作用，而与医疗提供人员的有效协调以及健康教练支持的可用性进一步决定了长期使用的成功。\n\
  \n## 可穿戴电子设备中的 TinyML\n\n微控制器通常用于可穿戴电子设备，是低资源设备的示例，在文献 [12, 13, 14] 中，`TinyML` 在这些设备上采用机器学习模型。在不需要云服务的情况下，`TinyML`\
  \ 使机器学习算法能够在这些设备内部运行，实现实时数据处理和推理。文献 [15] 的作者创建了一种使用尖端 `TinyML` 技术的可穿戴设备，以阻止传染疾病的传播。图\
  \ 5.1 展示了 `TinyML` 在医疗保健领域的广泛应用，包括通过追踪生命体征的腕戴式设备进行 COVID-19 监测、通过神经网络增强的实时语音增强助听器、协助患者和护理人员进行远程监测的家庭医疗系统，以及旨在简化数字医疗服务的\
  \ eHealth 框架。\n\n![图 5.1 TinyML 在医疗领域的广泛应用。返回正文。](img/Fig05_01.jpg)\n\n图 5.1 TinyML\
  \ 在医疗领域的广泛应用。返回正文\n\n## 5.3 远程患者监测\n\n### 5.3.1 远程患者监测：概述\n\n`RPM` 系统是一种利用 `TinyML`\
  \ 技术远程监测患者健康的医疗设备。机器学习中一个名为 `tinyML` 的子领域将机器学习模型应用于资源有限的设备，例如微控制器（这些是微小、低功耗设备）。`RPM`\
  \ 通常按照以下步骤使用：\n\n1. **信号处理**：对原始生理数据进行清洗、归一化并转换为有意义的特征。\n2. **AI 方法**：在处理过的信号上训练机器学习模型，以识别模式并提取见解。\n\
  3. **诊断与治疗**：AI 系统通过将模型输出与医学知识相关来提供临床决策支持，建议诊断和治疗方案。\n\n这些是微型可穿戴设备，使用各种传感器收集基本的健康数据。心率监测仪、血压计、温度传感器和加速度计都是其中的例子。其流程如下：\n\
  \n1. **数据预处理**：传感器收集原始健康数据，通过消除噪声和提取关键特征对数据进行清洗、转换和优化以便分析。\n2. **TinyML 模型处理**：资源高效的机器学习模型直接在设备上分析处理后的数据，以识别模式和生命体征。\n\
  3. **实时健康见解**：模型生成即时健康评估，并在检测到关键状况或异常时自动向护理人员发出警报。\n4. **安全数据处理**：对分析的数据进行加密并传输到云平台，供医疗团队远程访问和长期健康追踪。\n\
  5. **医疗交付**：该系统实现了持续监测，减少了就医次数并提高了护理的可及性——特别是对于慢性患者和农村人口。\n\n### 5.3.2 远程患者监测：挑战\n\
  \n实施远程患者监测系统面临几个关键挑战：建立具有可靠连接、安全数据传输和医疗系统互操作性的稳健技术基础设施在资源有限的地区尤为困难；在收集、传输和存储过程中确保符合\
  \ HIPAA 的数据安全和隐私需要大量的技术和资金资源；老年或排斥技术的患者存在用户采用障碍，他们难以操作设备界面；医疗工作流需要适应，将 RPM 数据有效地整合到临床决策和护理协调中；跨地区一致的报销政策和监管框架为可持续实施带来了财务和行政障碍。\n\
  \n\n\n\n为了克服这些挑战，一种联合医疗提供者、技术开发人员和政策制定者的协作方法至关重要。通过推进创新解决方案并解决当前的局限性，RPM 可以改变医疗交付模式——改善患者疗效、扩大优质服务的范围，并创建更高效的医疗系统。\n\
  \n### 5.3.3 远程患者监控：潜在收益\n\n由`TinyML`驱动的远程患者监控（`RPM）通过对血压、血糖水平和心律等关键健康指标进行持续实时跟踪，改变了医疗交付，使医生能够立即检测并处理异常。这项技术通过早期干预减轻了医疗系统的压力，同时消除地理障碍让偏远地区的患者能够获得优质护理。通过让患者直接获取其健康数据，增强型的`RPM`提高了个人健康管理的参与度和对治疗计划的依从性。最重要的是，它的边缘计算能力直接在设备上处理数据以生成个性化见解，根据每个患者独特的生理模式和需求创建定制治疗方案。\n\
  \n## 5.4 医疗提供者在诊断和治疗中的作用\n\n`TinyML`正通过将机器学习直接嵌入低功耗医疗设备和可穿戴设备中，彻底改变医疗保健。作为医疗领域最有前景的技术进展之一[16]，这种方法通过高效的边缘计算将智能诊断从云端移动到护理现场。通过在`microcontrollers`上本地处理数据，`TinyML`在维护患者隐私的同时实现了实时健康监控——比传统方法更快地检测到异常并生成个性化的治疗见解。医生获得了便携式\
  \ AI 辅助以做出做出决策，而医疗系统则受益于延迟的减少和基础设施成本的降低。该技术在极低功耗下运行的能力使得即使在资源受限的环境也能获得优质护理，真正实现了先进医疗分析的民主化。\n\
  \n医疗提供者充当了患者数据与 AI 驱动临床决策之间的关键纽带。他们接收并预处理各种医学输入——从影像扫描到生理信号——为`TinyML`分析做好准备。这些优化的机器学习模型直接在现场的`microcontrollers`上运行，实现了实时的疾病检测和治疗建议。医生结合其医学专业知识解释模型的诊断预测，可以制定出精确且个性化的护理计划。因此，`TinyML`在增强临床决策的同时，维持了医疗提供者在患者护理中的核心作用。\n\
  \n`TinyML`通过创新的边缘计算解决方案实现了居家血压监控。Ahmed 和 Hassan[17]开发了一个端到端系统，利用`microcontroller-powered\
  \ peripherals`分析`ECG`和`PPG`信号，直接在设备上预测关键指标——收缩压（`SBP`）、舒张压（`DBP`）和平均动脉压（`MAP`）。通过在极边缘部署`TinyML`，他们的解决方案独立于云基础设施运行，即使在没有网络连接的情况下持续监控。在\
  \ 500 小时的 12,000 个 ICU 案例显示，尽管面临严格的内存、电源和计算限制，其准确性仍与基于服务器的方案相当。\n\n为了增强急诊环境下 COVID-19\
  \ 患者的监控，Fyntanidou 等[18]开发了一种腕戴设备，用于跟踪包括体温、呼吸频率和`SpO`2 在内的关键生命体征。该可穿戴设备集成了`TinyML`技术，通过嵌入式神经网络在本地处理呼吸分析，在确保患者隐私和数据安全的同时消除了云端数据传输。\n\
  \n最近的研究[19]展示了`TinyML`如何通过其多功能框架转变为医疗保健，该框架能够整合多种机器学习方法、动态选择或调整模型、优化临床决策支持系统，并通过自适应学习不断改进。这项创新技术服务于多个健康领域——从心理健康监测到症状追踪、身体扫描和卫生管理——在护理现场提供智能解决方案。\n\
  \n一项研究[20]提出了一种利用`TensorFlow Lite`进行个性化居家医疗的创新`TinyML`解决方案。该系统支持康复期患者，管理慢性/急性疾病，并在\
  \ COVID-19 爆发等高压力场景下通过实现智能设备端健康监控来帮助护理人员的健康。\n\nRashid 等[21]开发了`Tiny RespNet`，这是一种用于呼吸症状分析的高效卷积神经网络。该系统在具有并行处理能力的`Xilinx\
  \ Artix-7 100T FPGA`上实现，实现了 245 mW 的功耗，同时比传统解决方案的效率提高了 4.3 倍。当部署在`NVIDIA Jetson\
  \ TX2 SoC`上，它可以分析包括音频录音、语音模式和人口统计数据在内的多个输入。通过三个数据集（`ESC-50`、`FSDKaggle2018`、`CoughVid`）的验证，该框架能够准确检测咳嗽相关的呼吸症状和呼吸困难，证明了在多模态医疗环境中的稳健性能。\n\
  \nTinyML 能够在医疗设备上部署 AI 但面临关键障碍：\n\n(1) 资源限制——处理能力、内存（< 1 MB）和能量（∼245 mW）要求超高效算法；(2)\
  \ 电源管理——不同的外设设计增加了能源优化性；(3) 成本障碍——尽管单位成本较低，但扩展性问题仍然存在；(4) 数据安全——严格的隐私法规（`HIPAA/GDPR`）监管敏感健康数据；(5)\
  \ 模型可解释性——黑箱决策阻碍了临床信任；以及（6) 数据稀缺——小型/不平衡的数据集限制了模型的稳健性。解决这些问题需要共同开发优化硬件、可解释 AI 技术以及医生、工程师和监管机构之间的跨学科协作。\n\
  \n## 5.5 药物发现\n\n`TinyML`正成为 AI 驱动药物研究的强大推动者，特别是在预测分子生物活性物理化学性质方面——学术界和工业界在该领域取得了重大共同进展[22]。通过在边缘设备上直接处理大规模分子数据集，该技术通过实时分子属性预测加速了有前景药物候选的识别。其本地执行高通量虚拟筛选和优化先导化合物选择的能力可以大幅简化药物开发流程。\n\
  \nTinyML 通过在分子数据集上实现强大的预测分析加速了药物开发。这些部署在边缘的模型评估了药物候选的有效性和安全性，显著减少了对昂贵实验室测试的依赖。其实施遵循迭代优化周期，在整个药物发现过程中逐步提高预测准确性[23]。\n\
  \n1. **数据收集**：收集分子数据、化合物属性和生物测定结果以训练模型。\n\n2. **特征提取**：处理数据以提取关键特征（例如，分子描述符、化学指纹）。\n\
  \n3. **模型训练**：在标记数据集上训练 TinyML 模型（例如，神经网络、决策树）以预测药物疗效/毒性。\n\n\n\n\n### 4. **模型优化**：通过剪枝/量化优化模型，以便在低功耗设备上进行高效部署。\n\
  \n### 5. **模型部署**：部署在微控制器上，实现实时的设备端预测。\n\n### 6. **预测与结果**：评估新化合物以优先考虑先导化合物或过滤掉不安全的候选药物。\n\
  \n以下是 TinyML 在药物发现中应用的一些示例。\n\n* 75****虚拟筛选**：通过在便携式设备上部署 TinyML 算法，虚拟筛选变得可行。这种计算方法能够对大型化合物库进行快速筛选和排序，迅速识别有前景的分子。\n\
  * **毒性预测**：早期发现潜在毒性问题在药物发现中至关重要。TinyML 算法可以在毒理学数据库上进行训练以预测化合物的毒性，使研究人员能够过滤危险药物并关注更安全的替代方案。\n\
  * **药物重用**：TinyML 有助于探索现有药物的新治疗用途。通过分析关于药物属性和分子相互作用的大型数据集，TinyML 模型可以识别重用机会，加速针对各种疾病的新疗法的搜索。\n\
  * **个性化医疗**：TinyML 算法可以应用于个性化医疗方法。通过分析个体患者数据（包括遗传信息和健康记录），TinyML 帮助识别符合特定患者需求的定制药物治疗方案，从而实现更有效、更有针对性的疗法。\n\
  \n总体而言，将 TinyML 集成到药物中对于提高效率、降低成本以及加速新药和治疗法的识别具有巨大潜力。表 5.3 展示了 TinyML 在药物发现中的一些优势和挑战。\n\
  \n#### 表 5.3 TinyML 在药物发现中的优势与挑战 返回正。\n\n| 优势 | 挑战 |\n| --- | --- |\n| 对复杂分子数据进行实时分析加速了发现进程\
  \ | 计算资源限制了模型的复杂性；平衡模型大小与准确性需要精细的优化 |\n| 低功耗实现降低了基础设施成本 | 难以获取大型、高质量的训练数据集 |\n|\
  \ 设备端处理消除了对云端的依赖，改进了隐私；移动部署实现了随时随地的虚拟筛选 | 黑盒性质使监管审批变得复杂 |\n| 通过更好的候选药物排序减少了湿实验次数\
  \ | 在不同生物学背景下的泛化仍然很困难 |\n\n尽管挑战依然存在，但 TinyML 的持续创新正在逐步克服这些障碍，使其成为药物研究领域的变革性技术。它在保持成本效益的同时加速药物发现进程的能力，使\
  \ TinyML 成为下一代疗法开发的极具吸引力的解决方案。\n\n76\n\n## 5.6 伦理与 TinyML\n\nTinyML 允许在微控制器和物联网系统等资源受限的边缘设备上运行机器学习。虽然这项技术为实时智能应用释放了巨大潜力，但其实现引发了关键的伦理挑战，需要仔细审查，包括：\n\
  \n* **隐私风险**：资源受限设备收集的敏感数据可能缺乏稳健的加密，增加了遭受攻击的脆弱性。\n* **算法偏见**：训练数据的偏见可能会延续歧视，需要感知公平性的模型设计。\n\
  * **知情同意**：用户必须理解数据收集的目的、用途和风险，特别是在医疗保健和智能环境中。\n* **安全漏洞**：有限的计算资源使设备易受到攻击，存在未经授权访问或滥用的风险。\n\
  * **可解释性**：复杂模型阻碍了透明度，挑战了决策中的问责制和信任。\n* **可持续性**：考虑到电池供电的限制，高能的设计和电子垃圾管理至关重要。\n\
  * **数据所有权**：需要清晰的治理以确保用户对收集的数据和衍生见解具有控制权。\n* **公平与获取性**：利益必须跨越社会经济和地理差异变得可及。\n*\
  \ **监管空白**：开发伦理框架和问责机制仍然迫在眉睫。\n* **权衡**：平衡准确性、效率和隐私需要审慎的伦理考量。\n\n为了确保 TinyML 技术的负责任集成，开发者、政策制定者和利益相关者之间的协作努力至关重要。积极参与应对伦理挑战——通过透明的设计实践、包容性的治理框架和持续的风险评估——将促进符合社会价值观的信赖部署，同时推进边缘\
  \ AI 能力的发展。TinyML 通过实时监控和预测分析开启了变革性的医疗保健应用，但其实现需要审慎的伦理考量。关键挑战包括：\n\n1. **数据安全**：敏感健康数据需要稳健的加密和访问控制以防止泄露。\n\
  2. **知情同意**：患者在共享健康信息之前必须理解数据用途、益处和风险。\n3. **偏见缓解**：模型必须经过公平性审计，以防止跨患者群体的出现歧视性结果。\n\
  4. **透明性**：需要可解释的 AI 技术来建立临床医生对模型预测的信任。\n5. 77**临床验证**：在 във风险医疗决策中部署之前，严格的测试和试验至关重要。\n\
  6. **问责制**：必须通过清晰的指南定义 AI 辅助诊断或治疗选择的责任。\n7. **公平获取**：技术部署应优先考虑服务不足的群体，以减少医疗差异。\n\
  8. **监管合规性**：遵循标准（如 HIPAA）可确保患者权利和模型的伦理使用。\n9. **持续监控**：在医学知识不断演变的情况下，需要持续更新以保持准确性。\n\
  \n## 5.7 结论\n\n虽然 TinyML 仍是一项新兴技术，但它正通过多样化的应用在变革患者护理方面展现出巨大前景。从远程患者监控 (RPM) 到疾病早期检测和精准医疗，这种创新方法将\
  \ AI 驱动的分析直接带到了护理点设备。\n\nTinyML 正在通过可穿戴设备实现实时生命体征监测，在减少住院率的同时提高患者安全性。这项技术还通过分析患者特定数据来优化药物剂量，增强了治疗方案。对于医学影像，TinyML\
  \ 算法可以高效地处理 X 光、CT 扫描和 MRI，帮助医生做出更快、更准确的诊断 [24]。在慢性病管理（例如糖尿病、哮喘）中，这些系统通过持续监控和个性化反馈改善了治疗依从性和健康结果。最关键的是，TinyML\
  \ 立即检测紧急情况的能力能够实现现场医疗干预，显著提高了护理质量 [25]。\n\n\n\n\n\n由 TinyML 驱动的辅助技术为残障人士提供实时音频指导，以增强其活动能力\
  \ [26]。除了无障碍应用外，这些系统通过动态调整剂量和方案来优化药物管理，从而提高依从性并最大程度减少副作用 [27]。然而，广泛应用还需要解决数据隐私、安全和伦理实施方面的关键挑战。充分发挥\
  \ TinyML 在医疗领域的潜力，需要技术人员、医疗专业人士和政策制定者之间的持续合作，开发用于负责任部署的稳健框架 [28]。\n\n## 参考文献\n\n\
