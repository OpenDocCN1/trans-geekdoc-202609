- "# 受限设备的微型机器学习技术\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nTimes 字体排版\n\nvii\n\
  \n# 前言\n\n在当今互互通的世界，智能正向数据产生的地方移动：传感器、微控制器和可穿戴设备。《受限设备的微型机器学习技术》（*Tiny Machine Learning\
  \ Techniques for Constrained Devices*）探索这一令人兴奋的前沿领域——微型机器学习（TinyML），这是一门专注于具有严格功率和内存限制设备的学科。这种转变由\
  \ TinyML 实现，它使更智能的医疗保健、城市和工业成为可能。本书深入了 TinyML 的基本原理，揭示了人工智能（AI）如何嵌入硬件中。\n\n内容结构如下：\n\
  \n*   针对受限硬件的功率优化和算法设计的基础技术\n*   医疗保健、工业物联网中的实际应用\n*   通信与能源管理的创新策略\n*   确保 TinyML\
  \ 赋能系统隐私的安全框架\n*   对有望扩展能力的未来方向的探索\n\n本书由领先的研究人员和从业人士贡献，提供了理论基础和极具操作性的见解。无论你是学术界人士、工程师还是渴望将\
  \ AI 引入微型设备的爱好者，本书都为你提供了所需的知识和工具。你准备好踏入机器学习与极简主义相会的领域了吗？让我们一起释放 TinyML 的力量，塑造下一代连接设备。\n\
