  \n*   **汽车：** 在现代车辆中，嵌入式系统对于引擎管理、高级驾驶辅助系统（ADAS）、气囊控制和信息娱乐系统等功能至关重要，有助于提高安全性、效率用户体验\
  \ [8,9]。\n\n*   **医疗设备：** 在医疗保健领域，嵌入式技术是起搏器、输液系统和诊断仪器等关键设备的基础，能够实时数据采集和精确治疗控制，以支持患者健康\
  \ [10]。\n\n*   **物联网：** 这些系统作为物联网设备的计算计算核心，为智能家电、健身穿戴设备和工业监控系统提供动力，传输实时数据以用于自动化和分析\
  \ [11, 12, 13]。\n\n*   **工业自动化：** 嵌入式系统通过实现机器人、自动化过程控制和预测性维护来简化制造操作，从而提高了生产力并降低了运营成本\
  \ [14]。\n\n嵌入系统领域正在快速发展以应对新的技术挑战。在当前的优先事项中，低功耗设计脱颖而出，特别是对于依赖电池等有限电源的设备而言。动态电压缩放、电源门控和优化睡眠模式的实现等先进方法是降低能耗且不影响系统性能的关键策略。这些创新在物联网、可穿戴计算和远程传感中尤为关键，在这些领域，运行寿命和能源效率至关重要。\n\
  \n本章深入探讨了构建低功耗嵌入式系统所采用的原理、设计技术和开发工具，重点关注如何促进边缘端的智能、高效处理 [15,16]。\n\n## 1.3 微控制器架构与功耗优化技术\n\
  \n现代微控制器单元（MCU）架构对于开发低功耗嵌入式系统至关重要 [2]。对能源效率的需求不断增长——特别是在边缘计算和物联网环境中——设计人员需要同时应用硬件和软件层面的策略。本节探索了集成到\
  \ MCU 设计中的核心节电方法，并研究了超低功耗（ULP）系统的最新趋势 [17,18]。\n\n表 1.1 提供了常用 MCU 架构的清晰概述。\n\n表\
  \ 1.1 MCU 架构中的电源管理总结 返回文本。⏎\n\n| 技术 |get | 功耗优势 | 用例场景 |\n| :--- | :--- | :--- |\
  \ :--- |\n| DVFS | 调整电压和频率 | 降低动态功耗 | 智能家电 |\n| 时钟门控 | 禁用时钟信号 | 减少电流消耗 | 物联网传感器\
  \ |\n| 电源门控 | 关闭非活动模块 | 最小化静态功耗 | 睡眠模式 |\n| 流水线 | 将执行拆分为多个阶段 | 提高性能 | 实时系统 |\n|\
  \ 缓存管理 | 优化缓存访问 | 减少能量消耗 | 可穿戴设备 |\n\n*   **动态电压和频率缩放 (DVFS)** 允许系统根据工作负载修改其电压和频率。当活动较低时，系统可以降低这些设置以节约。在负载较重的情况下，系统会提高电压和频率以保持速度。这对于\
  \ [19] 至关重要。\n\n*   **自适应电压缩放 (AVS) 和时钟/电源门控** 实时微调提供给特定组件的电压，响应变化条件。这有助于提高能源效率。时钟门控禁用未使用组件的时钟信号，减少动态功耗消耗。电源门控更进一步，通过关闭未使用区域的电源来减少静态漏电。\n\
  \n*   **核心数与核心流水线：** 使用多核心将任务分发到低功耗处理器上，而不是推向单个高速核心。这种配置降低了功率密度和热量输出。流水线通过将指令执行分为可以同时运行的步骤来提高性能。合理使用有助于避免浪费计算。\n\
  \n*   **内存** 往往是嵌入式系统中的主要功耗源。闪存提供非易失性存储，且通常可以在不激活 CPU 的情况下访问。SRAM 用于缓存是因为它速度快且能高效。DRAM——尤其是异步类型——需要频繁刷新，使得它对于经常睡眠的系统来说并不理想。选择合适的缓存大小、关联性和写回策略，配合编译器技巧，可以帮助降低功耗\
  \ [20]。\n\n*   **关机/节电模式：** 低功耗 MCU 具有多种模式，可以选择性地关闭某些功能。这些模式在唤醒速度和电流消耗方面不同。有效使用这些模式需要了解外设在睡眠期间的行为，以及系统需要多快重新就绪。\n\
  \n*   **新趋势** 正在重塑嵌入系统节电的方式。电源管理集成电路 (PMIC) 现在可以对供电和定时进行精细化控制。“暗硅”策略停用了未使用的芯片区域以防止漏电。现代异构\
  \ CPU 架构根据紧急程度将任务匹配给强大或节能的核心。开放且灵活的 RISC-V 架构正在获得增长动力。最后，从环境中收集能量（如阳光或振动）是某些设备极具前景的电池替代方案\
  \ [22]。\n\n\n\n\n\n能源感知嵌入式系统的开发要求在硬件选择方面采取全面的策略。虽然优化中央微控制器至关重要，但必须同样重视外设、传感器和通信接口的性能和功耗特性。每个硬件组件都会累影响系统的总功耗，这对于电池供电设备和边缘\
  \ AI 部署是一个至关重要的因素。本节概述了识别在功能性能与最小能量消耗之间实现明智权衡的组件的方法论方法（参见表 1.2）。\n\n## 表 1.2 低功耗嵌入式系统的组件选择策略返回正文\n\
  \n| 组件 | 选择标准 | 低功耗策略 |\n| --- | --- | --- |\n| `Microcontroller unit (MCU)` | -\
  \ 低供电和关机电流<br>- SoC 集成与睡眠模式 | - 使用 `ULP` MCUs` (30–40 μA/MHz)<br>- 仅开启必要的外设<br>-\
  \ 使用性能分析工具进行功耗分析 |\n| `Analog-to-digital converter (ADC)` | - 架构：`SAR` vs. `Sigma-Delta`<br>-\
  \ 采样分辨率和速率 | - 优先选择 `SAR` ADCs 以提高效率<br>- 使用突发模式采样<br>- 集成 `Class AB` 放大器 |\n| `Digital-to-analog\
  \ converter (DAC)` | - 输出缓冲和阻抗<br>- 更新率要求 | - 使用保持技术<br>- 最小化输出频率<br>-  `DAC` 在睡眠模式下运行\
  \ |\n| `Digital interfaces` | - 协议类型 (`UART`, `SPI`, `I²C`)<br>- 时钟和空闲状态处理 | - 使用事件触发通信<br>-\
  \ 降低时钟速度和占空比<br>- 利用 `DMA` 进行数据传输 |\n| `Wireless interfaces` | - 栈复杂度<br>- 每次传输能量\
  \ | - 短脉传输<br>- 使用轻量级栈（如 `BLE`）<br>- 采用低占空比运行 |\n| `Sensors` | - 准确度和功耗特性<br>- 集成易用性\
  \ | - 使用带有边缘 ML 的 `MEMS` 传感器<br>- 选择低静态电流的型号<br>- 尽可能最小化传感频率 |\n\n### 1.4.1 MCU\
  \ 选择\n\n每个嵌入式架构的核心都是 `MCU`，其精细的选择对于实现低功耗目标至关重要。`MCUs` 的评估标准包括活动模式和空闲模式下的电流消耗、关机电流、集成的系统级芯片\
  \ (`SoC`) 特性，以及睡眠和深睡等低功耗运行状态的可用性。`ULP` MCUs` 的活动模式消耗通常在 30–40 μA/MHz，关机电流可能低至 50–70\
  \ nA。然而，现实世界的功耗效率超出了数据表的标称规格。系统设计人员必须评估配置灵活性、评估板的获取以及供应商提供的开发生态系统的完整性。有效的能量管理还需要选择性地激活内部模块，并利用基于软件的能量分析工具来检测和缓解高功耗操作。\n\
  \n### 1.4.2 外设选择\n\n有效的能量管理还需要选择性地激活内部模块，并利用基于软件的能量分析工具来检测和缓解高功耗操作。\n\n#### 1.4.2.1\
  \ ADC 选择\n\n模拟数字转换器 (`ADCs`) 对于外设集成至关重要，但代表了巨大的能量支出。它们的架构（`SAR` vs. `Sigma-Delta`）影响采样分辨率和速率。优先选择\
  \ `SAR` ADCs 以提高效率，使用突发模式采样，并集成 `Class AB` 放大器。\n\n#### 1.4.2.2 DAC 选择\n\n数字模拟转换器\
  \ (`DACs`) 在睡眠阶段也提供持续的模拟功能，需考虑输出缓冲和阻抗。使用保持技术，最小化输出频率，并允许 `DAC` 在睡眠模式下运行。\n\n####\
  \ 1.4.2.3 接口\n\n数字接口——即 `UART`、`SPI` 和 `I²C`——对于通信和空闲状态处理至关重要。使用事件触发通信，降低时钟速度和占空比，并利用\
  \ `DMA` 进行数据传输。\n\n### 1.4.3 传感器选择\n\n传感器是物理数据采集的主要通道，其能量特性直接影响系统效率。选择标准不仅包括灵敏度、分辨率和工作范围等功能参数，还包括活动模式和静态模式下的功耗。应优先考虑静态电流低且与\
  \ `MCUs` 无缝集成的紧凑传感器。现代 `MEMS` 传感器提供了精度与低功耗的理想组合，并通常包含嵌入信号处理。此外，配备 TinyML 的传感器能够实现节点内推理，大幅减少传输需求并延长电池寿命。\n\
  \n## 1.5 嵌入式系统设计与优化\n\n对便携式、智能化和自主技术的需求日益增长，显著加速了能能嵌入式平台的开发。随着嵌入式系统在广泛应用中变得越来越普遍，在保持高水平性能和可靠性的同时降低功耗已成为主要设计目标。本节研究了嵌入式系统优化的两个基本方面：软件级效率技术和低功耗硬件解决方案的部署\
  \ [23]。这些元素共同构成了当今技术格局中创建可持续和高性能嵌入式解决方案的基石。\n\n\n\n\n\n## 固件优化技术\n高效的固件是功率感知系统设计的骨石。延长低功耗模式持续时间、禁用多余外设以及精细调整电源和时钟域等技术是基础。此外，实施适当关机程序将组件置于最小能量状态，可以显著延长系统寿命并减少能量开销。\n\
  \n## 中断 vs 轮询范式\nCPU 的持续轮询会导致不必要的功耗。采用中断驱动模型允许系统在事件需要处理之前一直保持休眠状态，从而节省能量。这种方法对于传感器读取或无线传输等偶发操作尤为有效。\n\
  \n## GPIO 与外设管理\n精确管理 GPIO 状态和外设接口至关重要。将未使用的引脚配置为以避免浮空状态，禁用多余内部上拉电阻，并对外设使用低功耗模式，有助于减少静态和动态能量损耗。关闭非活动单元的时钟信号是高效用电的另一项最佳实践。\n\
  \n## 实时操作系统 (RTOS)\nRTOS 解决方案对任务执行和系统空闲提供了细粒度的控制。它们支持诸如滴答空闲（tickless idle）、优先级任务处理和睡眠状态转换等节电功能。利用这些能力可以确保系统在执行必要功能的同时，尽可能保持在低功耗状态。\n\
  \n## 代码性能分析与静态分析工具\n能量感知开发极大受益于对代码行为的可视性。性能分析工具有助于发现高功耗例程，而静态分析可以识别内存泄漏和次优循环等低效问题。这些见解指导开发者优化代码库以提升性能并节约能量。\n\
  \n### 1.5.2 低功耗硬件平台\n为了加速高能嵌入式系统的开发，存在多种硬件平台。这些系统具有微控制器、集成传感器和为最小功耗设计的通信模块，是 IoT、TinyML\
