  \ 6 针对 LoRaWAN 物联网网络的自适应能量建模与通信优化\n\nIsmail Lamaakal, Yassine Maleh, Khalid El Makkaoui,\
  \ and Ibrahim Ouahbi\n\nDOI: [10.1201/9781003544449-6](https://doi.org/10.1201/9781003544449-6)\n\
  \n## 6.1 引言\n\n物联网（IoT）设备具有简化日常生活、增强家庭、工作及各种环境中福祉的潜力。随着通信技术的巨大进步，IoT 概念逐渐被应用于不同领域的众多应用中。人们已开展大量研究，以更好地理解和解决与这些技术相关的通信挑战。IoT\
  \ 领域一个日益增长的部分是低功耗广域网（LPWAN）。LPWAN 技术分为蜂窝网络和非蜂窝网络，旨在实现广泛通信的同时，为跨不同设置和应用类的广泛 IoT 应用提供可扩展的覆盖。在\
  \ IoT 应用中，已经采用了多种远距离通信范式，包括 Sigfox、INGENU、Weightless SIG、DASH7 和 LoRa。其中，LoRa 在\
  \ IoT 领域引起了极大关注。该技术在免授权的工业科学-医学（ISM）频段内运行。由于这些终端设备（EDs）体积小且通常仅依靠电池供电，准确估计基于 IoT\
  \ 的 LoRa 系统能量模型至关重要。因此，在 IoT 网络中确定 LoRa 的最佳通信设置被证明是挑战性的。\n\nLoRa 网络对传输数据涉及多个处理阶段，包括加密、信道编码、交织和调制。评估不同参数选择的能量效率需要仔细考虑传输能量与计算能量之间的平衡。本第\
  \ 81 章为 LoRaWAN（一种 LPWAN 技术）描述了一个全面的通信系统和能量模型。此外，它提供了一个详细的数学模型，用于计算 LoRa 紧凑传感器中传输、处理和传感功能的能量消耗。它包含了利用\
  \ LoRa 默认算法函数过程的收发器建模。若干前沿工作已经解决了 LoRa 网络中的能量建模和传输参数选择问题。然而，这些工作没有考虑影响 LoRa 设备功耗的整体关键参数，这可能导致高估终端设备的寿命，从而高估整个网络的寿命。例如，参考文献中给出的能量模型忽略了考虑\
  \ LoRa 编码率（CR）等可访问参数时的能量使用变化，尽管其在每个设置中具有变性，而是使用了固定值。\n\n其他出版物引入了针对 LoRa 网络的自适应技术。基于此，我们介绍了其中的关键要素。本章包含两个部分：一部分关于通信系统，另一部分关于能量消耗。第一部分深入探讨了功能，包括信道编码/解码、调制/解调、加密/去加密以及交织/去交织。第二部分关注与能量相关的方面。为了构建一个完全运行的系统，该模型整合了加性白噪声（AWGN）信道下的线性频频扩展（CSS）调制和扩展因子（SF）。\n\
  \n## 6.2 LoRa/LoWAN 组件与要素\n\nIoT LPWAN 是一种专门为需要远距离、低功耗连接的 IoT 应用开发的通信技术。这些网络提供了广泛的覆盖，允许设备在很远的距离发送和接收数据。目前有多种\
  \ LPWA 技术，每种都有自己的特征。LoRaWAN、窄带物联网（NB-IoT）和机器长期演进（LTE-M）是一些常见的 LPWA 技术。在本节中，我们重点介绍了一些重要要素和架构。\n\
  \n## 6.3 LoRaWAN\n\nLoRaWAN 是由 Semtech 公司创建的开放标准，作为专利基层与通信高层级之间的桥梁，如图 6.1 所示。LoRaWAN\
  \ 是媒体访问控制（MAC）协议之一，能够实现终端节点与网络基站之间的无线互连和时间调度。为了与网关（GWs）建立无线连接，节点使用 ALOHA 协议和时分多路访问（TDMA）调度访问机制。如图\
  \ 6.2 所示，节点密集分布，形成星中星网络结构。收到的数据通过网关发送到后端服务器。此外，根据应用需求，这些节点可能被归类为 A 类、B 类或 C 类。A\
  \ 类是最常见的，因为它通过开启两个短窗口来监听并准备接收来自网关的下行反馈，从而节省能量；相比之下，B 类扩展了监听窗口，以通知网关节点的等待时间，因为即使在传输发生后该窗口仍保持开启状态。C\
  \ 类被认为能量效率低下，因为节点必须在大多数时间里保持开启状态，以提供连续且最大的接收窗口。\n\n82\n\n![图 6.1 LoRaWAN (MAC) 协议栈在\
  \ LoRa 之上实现 [11]。返回文本。⏎](images/Fig06_01.jpg)\n\n\n\n\n\n# 图 6.1 LoRaWAN (MAC) 协议栈实现在\
  \ LoRa 之上 [11]。返回文本。⏎\n\n![图 6.2 LoRa 网络结构。返回文本。⏎](img/Fig06_02.jpg)\n\n# 图 6.2\
  \ LoRa 网络结构。返回文本。⏎\n\n### 6.3.1 LoRa 物理层\n\nLoRa 是 Semtech 近期推出的远程 LPWA 技术的物理层基础。从根本上说，它采用了一种专利的\
  \ CSS 方法，将许多扩频（chirps）分布在所占用的频谱范围内 [14]。基础扩频通过覆盖整个相关频率范围来瞬间改变其频率值。LoRa 通过考虑几个关键特性来整合基础扩频，包括带宽（`BW`）、扩频因子（SFs）、编码率（CRs）、传输功率（`TP`）和信信噪比（`SNR`），这些都是\
  \ LoRa 通信中的关键参数。由于它们定义了不同的特征，扩频因子（`SFs`）{7, 8, 9, 10, 11, 12} 以及 125、250 和 500 kHz\
  \ 的各种带宽（`BWs`）是标准。\n\nLoRa 采用扩频频谱（CSS）调制技术。图 6.3 所示 LoRa 符号通过带宽为 125 kHz 的上扩频进行调制。此图表示使用特定\
  \ `SF` 的示例，并使用 MATLAB^® 根据下方章节描述的通信链生成。\n\n![图 6.3 125 kHz 频带内 SF-12 扩频随时间（ms）的描述。返回文本。⏎](img/Fig06_03.jpg)\n\
  \n图 6.3 125 kHz 频带内 SF-12 扩频随时间（ms）的描述。返回文本。⏎\n\n调制器产生各种扩频（上扩频、下扩频）和符号值。在带宽方面，LoRa\
  \ 每发送一个样本：\n\n```\nT_{c} = \\frac{1}{BW},\n```\n\n这也可以代表扩频持续时间。每个样本包含根据 `SF` 位计数进行编码的信息子集。在调制之前，这些数据被编码为非二进制符号，其值位于\
  \ {0, 1, 2, **, 2^(SF) − 1} 中。\n\n每隔传输一个 84A 符号：\n\n```\nT\\_ s = \\frac{2^{SF}}{BW},\n\
  ```\n\n`SF` 越高，发送符号所需的时间越高。\n\nLoRa 结合了比例前向纠错（FEC）码。这些代码可以将 4 位数据块分组并通过添加可调整的校验位对其进行编码，校验位从一位到四位不等。这种灵活性允许不同的编码率（`CR`），其中\
  \ `CR` ∈ $\\left\\{ \\frac{4}{5},\\frac{4}{6},\\frac{4}{7},\\frac{4}{8} \\right\\\
  }$，这对于平衡远程传输、低能耗和比特率权衡至关重要。\n\n此外，可用的比特率 `R[b]` 与利用的带宽、扩频因子和编码率成正比，定义如下：\n\n```\n\
  R_{b} = \\frac{SF \\times BW \\times CR}{2^{SF}},\n```\n\n其中 `SF` ℉℄{7,8,9,10,11,12},\
  \ `BW` ℉℄{125 *kHz*,250 *kHz*,500 *kHz*} `CR` \\in \\left\\{ \\frac{4}{5},\\frac{4}{6},\\\
  frac{4}{7},\\frac{4}{8} \\right\\}\n\n### 6.3.2 LoRa 收发器架构与信号处理\n\n本节提供了收发器架构的详细概述。它概述了传输和接收期间的功能块\
  \ [15]。LoRa 严重依赖物理层模块，如图 6.4 所示。\n\n![图 6.4 LoRa 网络结构。返回文本。⏎](img/Fig06_04.jpg)\n\
  \n接收端执行去索引、去白化和解码以恢复数据。交织过程通过打乱位来对抗信道扰动，尽管它本身不执行纠错。编码码字的长度必须与信号长度匹配，以确保符号对齐。\n\n\
  \n\n\n\n通过应用香农采样定理并假设采样频率等于 `BW`，我们得到离散形式：\n\n`C[m] = e^(j2πBW⋅T[c]) + S[m]⋅T[c]`\
  \ (6) 包含所有符号的整个传输信号为：\n\n$T_{S}(m) = \\sum_{m=0}^{M-1}C_{S}(k \\cdot 2^{SF})$ (7)\
  \ 在 AWGN 块衰落信道上的接收信号为\n\n`RX[n] = h⋅S[m] + Z[n]`, (8) 其中 `h` 是信道增益，`Z[n]` 是均值为零、方特定的加性白高斯噪声（AWGN）。解调过程从去调频（de-chirping）开始，接收信号与基扩频的复共轭相乘：\n\
  \n`D[k] = RX[k]⋅e^(-j2πBW⋅T[c])` (9) 随后通过下式确定最可能的接收符号 `\\hat{S}`：\n\n$\\hat{S}_{m}\
  \ = \\arg \\max \\{Re[DFT(k + m \\cdot 2^{SF})]\\}$, (10) 产生的非二进制符号使用格雷索引（Gray indexing）转换回二进制。去白通过将二进制流与加白期间使用的相同伪随机序列进行异或来实现：`whitened[i]\
  \ = recovered[i] ⊕ whitening[i]`。接下来，将数据存储在与发送端类似的矩形数组中，但现在按行填充。该数组传递给解码器，解码器使用反交织恢复原始比特位置。最后，对每个码字应用汉明解码以纠正任何比特错误。\n\
  \n### 6.3.3 能量建模\n本节关注 LoRa 设备的能量建模。提供的部分估计了 LoRa 网络的整体消耗；然而，全面的检查必须包含节点因素。\n\n\
  #### 6.3.3.1 通信能量\nLoRa 节点的运行预算有限，通常在预定义的持续 `active` 内激活，之后进入持续 `off` 的睡眠模式。在待机模式下，节点以最小的能量消耗保持监听能力，这与执行多个高能耗操作的激活模式不同。在一个完整的通信周期中，节点通过发送嵌入前导中的确认消息来启动传输，在与网关（`GW`）建立通信后传输负载。因此，总传输持续时间用\
  \ `packet` 表示可以表示为\n\n`T[packet] = preamble + payload` (11) 其中 `preamble` 和 `payload`\
  \ 分别代表前导和物理载荷的持续时间。前导时间通常由终端设备的类型决定，而载荷时间取决于传输符号的数量。这些持续时间由：\n\n`preamble = (25+N[pr])⋅T[s]`\
  \ (12)\n\n`payload = N[phy]⋅T[s]` (13) 其中 `N[pr]` 是前导符号的数量，`T[s]` 是一个符号的持续时间，`N[phy]`\
  \ 是组成载荷的符号数量。\n\n通信模块同时支持上行传输和下行接收。RF 电路由终端设备（ED）管理数据的传输和接收。通常，发送节点通过以预定义的间隔向 `GW`\
  \ 发送两个上行告警来启动通信。然后，它激活两个连续的监听窗口以等待响应。如果在第一个监听窗口未接收到信号，节点将打开第二个窗口。如果两个窗口都未能捕获响应，节点将等待到下一个周期以再次尝试传输。一旦两个监听窗口都耗尽，节点将在分配的前导期内终止上行尝试。RF\
  \ 电路在通信期间消耗的总能量用 `ERF` 表示，包括传输能量以及两个监听窗口期间消耗的能量，表示为\n\n`ERF = Etx + Erx,w1 + Erx,w2`\
  \ (14) 其中 `Etx` 是传输能量，`Erx,w1` 和 `Erx,w2` 分别代表接收窗口 1 和 2 期间消耗的能量。第一个监听窗口的能量为\n\n\
  `Erx,w1 = P[rx,w1]⋅N[sym]⋅T[s]` (15) 其中 `P[rx,w1]` 是第一个窗口所需的功率，`N[sym]` 是交换符号的数量（SF11\
  \ 和 SF12 通常为 8，较低 SF 也是 8），`T[s]` 是符号持续时间。第二个窗口期间消耗的能量为\n\n$E_{rx,w2}(t) = P_{rx,w2}\
  \ \\cdot \\frac{32 + 2^{SF}}{BW}$ (16) 其中 `P[rx,w2]` 是第二个窗口所需的功率，`SF` 是扩频因子，`BW`\
  \ 是传输带宽。传输能量计算为\n\n`Etx = P[tx]⋅T[packet]` (17) 其中 `P[tx]` 是发射功率，`T[packet]` 是 (11)\
  \ 中定义的完整持续时间。所需的传输功率 `P[tx]` 可以从 Friis 传输模型推导出并表示为\n\n$P_{tx} = \\rho \\cdot (\\\
  frac{4\\pi f_{c}}{c})^{2} \\cdot (\\frac{d}{d_{0}})^{\\alpha}$ (18) 其中 `rho` 是频谱效率。\n\
  \n#### 6.3.3.2 计算能量\n除了通信组件消耗的能量外，节点的微控制器单元（MCU）通过内部处理任务对总消耗做出贡献。这些任务包括信道编码、加白、交织、格雷索引以及最重要的扩频扩频（CSS）调制。处理单元所需的能量主要源于两个源：逻辑切换期间消耗的动态能量和泄漏电流引起的静态能量。MCU\
  \ 物理层完成所有与数据包准备阶段的总时间估计为\n\n`T[MCU] = T[sc] + T[cc] + T[whi] + T[int] + T[gr] +\
  \ T[css]` (19) 其中 `T[sc]`、`T[cc]`、`T[whi]`、`T[int]`、`T[gr]` 和 `T[css]` 分别表示源编码、信道编码、加白、交织、格雷索引和\
  \ CSS 调制的处理时间。\n\n#### 6.3.3.3 传感器与电路能量\n\n\n\n\nLoRa 节点消耗的能量不仅限于通信和计算；传感子系统对总能量预算也有显著贡献。传感器单元负责从环境中获取物理数据，它通常包括模拟传感器、信号调理电路以及数模转换器（ADC）或数模转换器（DAC），以便与数字处理单元进行正确的数据接口。\n\
  \n在传感及相关电路操作期间消耗的总能量表示为 `Esc`，它由电路消耗的能量（`Ec`）和传感器模块本身消耗的能量（`Es`）组成，表达式如下：\n\n`Esc = Ec + Es,`\
  \ (6.21)\n\n其中，`Ec` 计算节点辅助电子电路（如电压调节器、接口电路和时钟发生器）消耗的能量，而 `Es` 指传感器运行所需的能量，包括数据采集和信号转换。这些组件共同决定了\
  \ LoRa 节点在每个活动周期内的传感能量足迹。\n\n### 6.3.3.4 网络总消耗能量\n\n基于 LoRa 的网络随时间消耗的总能量可以通过聚合所有参与终端设备（EDs）的能量支出来评估。假设一个网络由\
  \ `N[node]` 个 LoRa 终端设备（EDs）组成，每个设备在 `N[cycle]` 个连续周期内传输数据。网络消耗的总能量表示为 `Etotal`，定义为每个节点\
  \ `D[id]` 在所有周期内消耗能量之和：\n\n$E_{total}\\\\left( t \\right) = {\\\\sum\\\\limits\\\
  _{id = 1}^{N_{node}}\\\\sum\\\\limits\\_{n = 1}^{N_{cycle}}E_{n}\\\\left( D_{id}\
  \ \\right),}$ (6.22)\n\n其中，`En` 代表第 `id` 个节点在其第 `n` 个工作周期内所消耗的能量。该公式对定义运行期间的整个网络能量消耗提供了全面的估计。\n\
  \n此外，为了预测给定终端设备在特定时间的剩余能量，可以考虑设备的初始能量容量 `E[init]` 并减去过去传输周期消耗的累计能量。时间 `t` 时的剩余能量估计为：\n\
  \n$E_{residual}\\\\left( t \\right) = E_{init} - {\\\\sum\\\\limits\\_{n = 1}^{N_{cycle}}E_{n}\\\
  \\left( D_{id} \\right),}$ (6.23)\n\n其中，求和考虑了到时间 `t` 为止节点 `D[id]` 消耗的总能量。该方程能够跟踪节点的能量耗尽情况，有助于能量感知调度和网络寿命优化策略。\n\
  \n## 6.4 方法论\n\n考虑一个由数百个密集部署的无线终端设备（EDs）组成的广域网。这些设备能够独立地感知并将观测到的数据传输到远程监控基站，而无需相互协调。每个节点单独使用线性扩频（CSS）调制。为了协调共享无线介质访问并避免冲突，采用了时分多址（TDMA）隙隙方案，该方案组织了从终端设备到基站的传输。\n\
  \n由于这些节点依靠有限的电池电运行，在保持通信可靠性的同时最小化能量消耗至关重要。每个节点策略性地部署在监控区域，并必须自主选择最佳物理层参数，以平衡通信质量与能量效率。LoRa\
  \ 设备必须根据信道状况和网关距离调整传输参数。可选参数包括扩频因子 `SF` ∈ {7, 8, 9, 10, 11, 12} 和编码率 `CR` ∈ $\\\
  left\\{ \\frac{4}{5},\\\\frac{4}{6},\\\\frac{4}{7},\\\\frac{4}{8} \\right\\}$。\n\
  \n为了评估这些参数的性能，需要确定每个配置提供最佳能量效率可靠性的距离范围。我们提出了一种自适应算法，旨在调节最佳传输参数，以确保每个 LoRa 终端设备的网络可靠性和节能。在评估中，使用\
  \ `SF` = 7 的配置被视为最高能耗水平的基准。这一参考实现了相对能量比较。\n\n评估采用以下指标来确定节省能量与计算消耗能量之间的平衡。具体而言，如果切换到更高效配置所节省的能量超过了重构带来的计算成本，则该变化被认为是有益的。给定终端设备的能量效率率\
  \ `E(ED)` 为：\n\n$\\varepsilon\\left( ED \\right) = \\frac{E_{tx}\\left( ED \\right)}{E_{pros}}\
  \ \\times 100\\%$, (6.24)\n\n其中，`Etx` 代表给定配置下的总传输能量，而 `E[pros]` 是与选择和切换到该配置相关的处理能量。\n\
  \n关键距离 `d[c]` 是两个不同扩频因子提供相同传输能量的转换点。也就是说，对于 `SF[j]` 和 `SF[i]`，$\\Delta E[tx] = 0$\
  \ 意味着传输效率相等，决策点位于此边界。对于 `SF[j]`，关键距离对应于可实现的最大范围，而对于 `SF[i]`，它代表所需的最小范围。该关键距离 `dc`\
  \ 使用以下公式计算：\n\n$d_{c}\\left( SF_{j} \\right) = \\left \\lbrack \\frac{E_{tx}\\left(\
  \ SF_{j} \\right) \\cdot 10^{\\frac{- G_{CSS}{(SF_{j})} - NF}{10}}}{T_{packet}\\\
  left( SF_{j} \\right) \\cdot \\rho \\cdot T \\cdot K \\cdot BW} \\cdot \\left( \\\
  frac{1}{4\\pi f_{c}} \\right)^{2} \\right\\rbrack^{\\frac{1}{\\alpha}},$ (6.25)\n\
  \n其中：\n\n*   `Etx` 是 `SF[j]` 的传输能量，\n*   `GCSS` 是 CSS 调制增益，\n*   `NF` 是接收机噪声系数（dB），\n\
  *   `ρ` 是谱效率，\n*   `T` 是环境温度，\n*   `K` 是玻尔兹曼常数，\n*   `BW` 是通信带宽，\n*   `f[c]` 是载波频率，\n\
  *   `α` 是路径损耗指数。\n\n该公式支持实现能量感知启发式算法，可以根据部署距离和信道状况动态重新配置 LoRa EDs 以实现最佳运行。算法 6.1\
  \ 解释了能量约束下自适应参数选择的内部机制。\n\n### 6.4.1 案例研究与实验设置\n\n在本节中，我们评估低功耗广域网（LPWANs）背景下，利用线性扩频（CSS）调制的\
  \ LoRa 终端设备（EDs）的能量消耗、能量效率和传输可靠性。使用 MATLAB，我们对处于“星中星”拓扑结构中的 ED 进行了全面仿真。评估探索了物理层参数驱动的各种传播场景。表\
  \ 6.1 列出了仿真中使用的信道模型参数和电气特性的平均值，这些参数选真实的 LoRa 收发器规格。\n\n表 6.1 仿真参数及其数值\n\n| 参数 |\
  \ 数值 |\n| --- | --- |\n| 带宽 (BW) | 125 kHz |\n| --- | --- |\n| 编码率 (CR) | 4/5, 4/6,\
  \ 4/7, 4/8 |\n| 扩频因子 (SF) | 7, 8, 9, 10, 11, 12 |\n| 路径损耗指数 (`α*`) | 3 (城市), 4 (郊区)\
  \ |\n| 电压 (收发器) | 3.3 V |\n| 载波频率 (`f[c]`) | 858 MHz |\n| 传感器单元电压 | 2 V |\n| 处理单元电压\
  \ | 3.3 V |\n| 漏电流 (`I[leakage]`) | 10 nA |\n| 接收电流 (`I[rx]`) | 11 mA |\n| 睡眠模式电流\
  \ (`I[sleep]`) | 1.5 μA |\n| **噪声系数 (NF)** | **10 dB** |\n\n\n\n\n为了准确评估能耗，我们模拟了整个通信链，并考虑了编码和调制操作。比特错误率（BER）性能通过在\
  \ 93 种不同的负载大小和符号配置下执行多次传输来确定。仿真在不同初始条件下，在加性白高斯噪声（AWGN）信道中进行了 50,000 次迭代。\n\n图 6.4\
  \ 展示了在采用 `CR = 4/7` 时，决定不同扩频因子（SF）可靠性的 SNR 阈值。结果显示，`10^(−3)`、`10^(−4)` 和 `10^(−5)`\
  \ 的 BER 阈值可作为估计不同 SF–CR 组合 SNR 裕量的参考。仿真使用 868 MHz 的载波频率、基于海明码的多种 `CR` 配置以及 125 kHz\
  \ 的固定带宽来研究远距离 LoRa 行为。\n\n我们假设所有计算操作的处理时钟频率为 4 MHz。路径损耗指数设置为 `α = 3` 以模拟城市环境，设置为\
  \ `α = 4` 以模拟郊区。这些假设使我们能够捕捉不同空间条件下的真实传输行为，并验证了早期提出的能量模型（图 6.5）。每个终端设备（ED）的传输次数受占空比规定的循环限制。通常执行\
  \ 1% 的最大占空比。这一限制意味着在传输了等于空中时间（TOA）的持续后，ED 必须在 99% 的时间内保持静。通信延迟包括空闲期和接收确认所需的时间。因此，较大的数据会导致更长的\
  \ TOA 持续，从而导致更长的空闲期，减少了电池耗尽前可能的传输次数。\n\n![图 6.5 使用 (SF7, CR = 4/8) 的 LoRa ED 总传输次数。返回正文。⏎](img/Fig06_05.jpg)\n\
  \n图 6.5 使用 (SF7, CR = 4/8) 的 LoRa ED 总传输次数。返回正文。⏎\n\n为了检查占空比对网络寿命的影响，我们分析了节点在占空比值为\
  \ 1% 和 0.1% 时的行为。图 6.6 展示了在采用配置 (SF7, CR = 4/8) 时，负载大小对传输次数的影响。可以观察到，增加数据大小会减少 2,600\
  \ mAh 电池容量下允许的传输总数。因此，较短的数据包有利于延长通信周期的次数。为了预测不同能量限制下的寿命，我们模拟了电池容量为 500 mAh、2,600\
  \ mAh 和 3,500 mAh 的节点，每个节点每个占空比传输十字节的固定负载。图 6.6 \\[8\\] 显示，节点的寿命受所选占空比的强烈影响。降低占空比（例如\
  \ 0.1%）会导致能量更快速耗尽，因为它允许更频繁的传输，缩短了连续传输之间的空闲间隙。然而，寿命不仅应从时间角度评估，还应通过成功传输的总数来评估。\n\n\
  ![图 6.6 使用不同电池容量的 ED 寿命。返回正文。⏎](img/Fig06_06.jpg)\n\n图 6.6 使用不同电池容量的 ED 寿命。返回正文。⏎\n\
  \n95 因此，LoRa ED 的节能设计是通信频率、数据包大小和占空比合规性之间的权衡。较低的占空比通过减少每日传输来延长节点寿命，但也限制了数据交付速率。因此，LoRa\
  \ ED 的寿命可以解释为在法规和应用限制之间平衡激活和空闲时长的结果。\n\n## 6.5 结论\n\n本章首先探讨了 LoRa 传输中通信链的运行方面，特别强调了\
  \ CSS 调制和道编码技术。在对 LoRa 物理层基础理解的基础上，我们开发了一个全面的数学框架，用于建模和估计支持 LoRa 的终端设备的能耗。\n\n为了验证所提出的通信和能量模型，我们在各种网络场景下进行了广泛的基于\
  \ MATLAB 的仿真。这些仿真涵盖了物理层参数变化以及 LPWAN 部署中典型的拓扑配置。\n\n分析结果为能量效率与传输可靠性之间的权衡提供了宝贵的见解，揭示了占空比限制下的关键运行阈值。\n\
  \n通过指定电池容量并配置不同的占空比水平，我们能够确定最佳传输参数——即扩频因子（SF）和编码率（CR），在不损害通信性能的情况下使节点寿命。这些评估使我们能够估计自定义\
  \ LoRa 传感器节点的成功传输总数和整体寿命。\n\n总之，这项工作为基于 LoRa 的通信提供了一种可重复的能量评估方法，整合了分析建模和仿真，支持广域无线传感器网络中的能量感知协议设计和部署策略。\n\
