  \ ⨯ | ⨯ | ✓ |\n\n### 2.5.1 计算卸载优化\n\n基于 AI 的任务卸载旨在优化能效并最小化延迟，其总体目标是平衡这两个关键性能指标。某些方法采用了深度学习驱动的局部卸载机制，动态地确定任务的最优分配。这些智能模型通过根据系统当前状况定制任务分布，显著降低了运行期间的能耗。\n\
  \n为了降低延迟，研究者提出了集成框架，同时增强无线通信、协作数据缓存和计算效率。此外，还开发了启发式深度学习方法 24[[20]，将网络距离估计与智能搜索算法相结合以确定有效的卸载策略，特别是在计算资源受限的环境中。\n\
  \nRL（包括经典的 Q-learning）也被用于支持边缘计算环境中的最优控制。然而，传统的 RL 技术在面对高维状态空间时往往在扩展性方面面临困难。\n\n\
  对此此，研究人员引入了结合能量感知和自适应机制的结构化 RL 方法。其中一些方法还集成了能量收集能力，以减少对传统电源的依赖。\n\n为了更有效地解决可扩展性问题，DRL\
  \ 已成为处理高维优化任务的可行解决方案。无模型 DRL 技术已成功应用于复杂架构，包括集成的陆空地天地一体化网络。深度 Q 网络 (DQNs) 等变体在动态边缘环境中近似最优策略方面表现出强劲性能。此外，将\
  \ FL 与 DRL 结合被证明对分布式学习场景有益，在最小化通信开销的同时提高了收敛速度。\n\n### 2.5.2 使用非计算卸载方法降低能耗\n\n虽然边缘设备上的\
  \ AI 处理会增加能耗——特别是在自动驾驶等对时间敏感的应用中——但已经引入了多种策略来优化功率效率：\n\n* **硬件结构优化：** 技术如使用 SRAM\
  \ 进行并行内存访问以及在 FPGA 上实现二值化 DNN 加速器，这些有助于显著节能。例如，一种基于 FPGA 的杂草分类系统的能量效率比 GPU 替代方案提高了七倍\
  \ [21]]。\n* **控制运行状态：** 采用基于 DRL 的控制器来动态管理处理器状态和通信协议。这些通过马尔可夫决策过程进行建模，以优化中长期能量消耗。\n\
  * **结合能源互联网：** 边缘计算与可再生能源基础设施（如微网）的集成促进了局部能量管理。DRL 算法通常与课程学习相结合，有助于在不稳定的生产条件下平衡供需。\n\
  \n### 2.5.3 边缘计算的安全\n\n尽管边缘计算通过去中心化数据处理缓解了一些与云相关的漏洞，但它引入了新的安全风险，包括 DDoS 和干扰攻击。经典的机器学习模型，包括极大极\
  \ Q-learning、基于随机游戏的方法和集成方法，已被证明在检测此类威胁方面是有效的。\n\n25 先进深度学习技术进一步提高了检测准确性 [5]。例如，堆叠自动编码器结合\
  \ softmax 分类器在识别恶意行为方面优于传统的分类器。此外，深度信仰网络和受限玻尔兹曼机等模型已被部署用于检测新型或零日攻击。\n\n### 2.5.4\
  \ 数据隐私\n\n虽然边缘计算通过减少云传输限制了数据暴露，但它仍然容易受到隐私泄露。AI 模型可能会无意中保留敏感用户数据。应对措施包括：\n\n* **PDS-学习：**\
  \ 将后决策状态建模与 `DQNs` 结合，创建隐私感知卸载决策。\n* **联邦学习：** PAFLM 允许在不共享隐私数据的情况下跨设备进行协作学习。\n\
  * **差分隐私：** 拉斯拉斯噪声注入等方法被应用于模型输出。Edge-Sanitizer 等框架将本地差分隐私与深度学习相结合，用于安全的移动数据处理。\n\
  \n### 2.5.5 资源分配优化\n\n动态和高维资源分配挑战非常适合 DRL 技术。深度 Q 网络已用于对各种系统变量建模，包括无线条件、信誉评分、缓存和计算资源。此外，使用蒙特卡洛树搜索\
  \ (MCTS) 训练的自监督 DNN 已证明可以将系统延迟降低超过 50%。\n\n## 2.6 结论与未来工作\n\nTinyML 已成为一种在边缘提供智能、实时且高效能分析的变革性方法，特别是在计算和功率资源受限的环境中。本章深入探讨了支撑\
  \ TinyML 系统设计和部署的基础概念、系统架构、算法方法以及 AI 驱动的优化技术。\n\n通过关注软硬件协同设计、模型压缩策略和针对边缘的 AI 算法，本章展示了\
  \ TinyML 如何有效解决传统以云为解决方案的缺点。本地推理不仅最小化了延迟并了能量，还增强了医疗、农业、交通和工业监控等应用领域的数据隐私和可扩展性。此外，AI\
  \ 与边缘计算的集成为任务卸载、能量优化、资源调度和网络安全引入了创新范式。智能卸载策略和 DRL 技术在适应边缘环境的分布式和动态特性方面取得了巨大成功。FL\
  \ 和差分隐私机制进一步强化了安全的、去中心化的 AI 基础设施。\n\n\n\n\n\n# 未来研究方向\n\nTinyML 和边缘 AI 领域的未来研究正指向几个关键领域。这包括了先进微控制器和神经形态硬件架构的设计与实现，这些架构针对高效、低延迟的设备端推理进行了优化。另一个主要方向涉及自自适应和持续学习模型的集成，使边缘设备能够随着不断变化的数据和使用场景进行演进。研究工作还侧重于增强\
  \ TinyML 系统跨视觉、语音和生理信号等多种传感器输入进行实时多模态融合的能力。其他优先事项涵盖了全端到端部署流水线的自动化，从模型开发、优化到嵌入式实现均涵盖。可持续性仍然是一个核心关注点，目前的工作正致力于设计符合环境目标的低能\
  \ TinyML 框架。此外，业界正大力推动开发标准化的评估基准和开源工具，以支持可重复性和性能比较。最后，提高 TinyML 系统的鲁棒性、透明度和安全性，对于其安全地集成到医疗健康、自动系统和工业控制环境等任务关键领域至关重要。\n\
