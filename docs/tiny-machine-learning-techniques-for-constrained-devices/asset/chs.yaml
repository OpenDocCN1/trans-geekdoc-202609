  \ \\[29, 30, 31\\]所示。\n\n## 9.3 TinyML 与区块链集成的体系架构概览（1,200–1,500 字）\n\n### 9.3.1\
  \ 系统设计目标\n\n在集成 TinyML 与区块链的物联网系统中，主要设计目标侧重于平衡几个关键支柱。这些包括效率、安全性、可扩展性和去中心化。\n\n效率是指系统有效满足其核心需求的同时，最大限度地减少能量和资源消耗，使\
  \ IoT 设备能够在无需大量下载或过度资源消耗的情况下在本地运行 TinyML 模型。安全性涉及确保数据在传输和存储过程中的完整性和准确性，通过防止篡改的区块链技术来实现。集成还有助于通过使用\
  \ TinyML 技术直接在设备上运行机器学习模型来尽早检测攻击。\n\n系统的灵活性及其适应设备数量变化和网络扩展的能力也是基础支柱。集成确保了这种能力。这是因为\
  \ TinyML 能够在小型简单设备上进行本地操作。区块链可以通过添加新节点来轻松扩展网络，而无需面对中心化控制的复杂性。实现去中心化有助于减少单点故障，因为任务分布在多个节点上，这是区块链技术的底层原理。TinyML\
  \ 也通过允许小型设备在本地执行智能任务来支持这一点。\n\n### 9.3.2 整体架构\n\n让我们观察集成 TinyML 和区块链的系统整体架构。请参考\
  \ 图 9.6。该系统由多个连接层组成，旨在执行特定角色。它们无缝集成，以智能地实现应用程序所需的功能。\n\n![图 9.6 TinyML 与区块链的集成，突出了关键组件的交互。返回正文。⏎](img/Fig09_06.jpg)\n\
  \n图 9.6 TinyML 与区块链的集成，突出了关键组件的交互。返回正文。⏎\n\n在感知层中，从环境中收集数据。如图所示，离开此层的数据以散布图的形式表示，这表明它是原始数据，需要进一步处理。\n\
  \n边缘处理层由小型、资源受限的设备组成，类似于能够运行轻级 TinyML 模型的 IoT 设备。这些边缘设备根据应用程序目的，使用部署的机器学习模型分析来自感知层的原始数据。TinyML\
  \ 模型对收集的原始数据进行推理，检测异常模式、对事件分类或生成即时安全警报。处理后，重要结果通过通信层发送到更高级，在更广泛的范围内管理数据，并用橙色表示，象征分析后检测到的警报或重大事件。\n\
  \n通信层是这些系统整体架构的关键组件之一，确保数据流畅高效。它应用了多种旨在满足 IoT 环境独特协议和技术。例如，从感知层传输到边缘层的数据通常依赖于 `Wi-Fi`、`Zigbee`\
  \ 和 `LoRa` 等协议，这些协议适用于高效短距离通信。从边缘到区块链层的数据流通常使用 `4G` 和 `5G` 网络。在区块链层，进行最后的验证和记录过程，处理后的受信数据记录在不可篡变的分布式账本中。当推理产生需要操作的事件或警报时，这些结果被发送到区块链层，在那里进行验证以确保数据的准确性和完整性。通过在区块链网络上自动运行的智能合约，根据预定义规则对处理数据进行验证并相应执行自动操作。\n\
  \n注意：只要规格支持运行机器学习模型，TinyML 可以直接部署在 IoT 设备本身。\n\n### 9.3.3 组件与交互\n\n在本节中，我们将探索 TinyML\
  \ 和区块链的系统主要组件以及这些组件如何相互交互。图 9.7\n\n图 9.7 主系统组件和数据流。返回正文。⏎\n\n感知层由从环境中收集信息的 IoT 设备组成。这些通常是小型设备，如安全摄像头、温湿度传感器和智能手表。它们从周围环境收集原始数据，并配备可在硬件上本地运行的轻级\
  \ TinyML 模型，正如许多研究所强调的[31\\]。\n\n\n\n\n边缘处理层也是一种资源受的设备，能够运行轻量级的 `TinyML` 模型。这些设备构成了系统的分析核心，它们负责运行预训练的\
  \ `TinyML` 模型，使系统能够满足特定的应用需求。边缘设备从多个传感器节点接收数据并在本地执行推理操作。当检测到重大或异常事件时，设备会生成一份包含分析结果的报告并将其传输到区块链网络。这些设备可能还包含额外的逻辑来过滤数据、减少冗余并管理日志优先级。在边缘设备完成数据分析后，推理结果将传递到区块链网络进行记录和验证，重大事件被记录在分布式账本中。区块链上的智能合约允许系统处理事件、处理数据并相应做出决策，而无需人工干预。\n\
  \n为了保持效率并与边缘设备受限的硬件能力兼容，通常首选轻量级区块链解决方案，如 `Ethereum Light Clients` 或有向无环图（`DAG`）网络如\
  \ `IOTA` [32]。为了更好地理解这一概念，可以利用 `TinyML` 和区块链来监控工业生产线，并识别可能被忽略的微小故障。在这种背景下，精确传感器被部署在机器上以捕获声音和振动数据，旨在检测设备的潜在故障。收集的数据被发送到附近的边缘设备，这些设备配备了专门用于故障检测的训练过的\
  \ `TinyML` 模型，并能够识别肉眼不可见的细微模式或微异常。例如，模型可能会检测到其中一个旋转轴的异常振动频率，这表明精密机械部件内部磨损已处于早期阶段。一旦检测到故障，工业环境中会生成实时警报，并将结果安全地记录在企业的私有区块链账本上。此类记录稍后可用于质量保证审查，或在最终产品出现缺陷或异常时作为调查之目的。\n\
  \n### 9.3.4 部署场景\n\n`TinyML` 与区块链的集成代表了物联网（`IoT`）应用基础设施的巨大飞跃。它实现了实时数据分析与防篡改安全性之间的平衡。该模型可以应用于广泛的领域，每个领域都面临着其独特的挑战，并从集成系统提供的不同能力中获益。\n\
  \n1. **智能医疗监控（医疗物联网）：** 可穿戴医疗健康设备是收集心率和氧饱和度等实时生理数据的工具。通过使用 `TinyML` 模型，现在可以在本地处理从这些设备收集的数据而无需长时间传输，这降低了数据被盗取或篡改的风险。此外，使用区块链网络记录敏感的医疗事件确保了完整性和抗篡改性，并保护了高价值的信息资产，特别是由于黑市上医疗数据的平均售价超过了普通个人数据的\
  \ 50 倍 [33]。当检测到超出范围的医疗事件时（如心动过速或睡眠呼吸暂停），会生成一个加密警报并通过安全通道发送，其结果被记录在的的医疗区块链网络上。该模型在确保患者隐私的同时，为任何检测到的健康紧急情况提供了不可篡改的记录（参见图\
  \ 9.8）。\n\n![图 9.8 使用可穿戴设备进行远程健康监控，边缘端的 TinyML，边缘端的 TinyML](img/Fig09_08.jpg)\n\n\
  2. **工业物联网（IIoT）：** 这种集成增强了机器监控的质量，减少了停机时间。信号被传输到配备 `TinyML` 模型的边缘设备，这些模型能够执行实时推理以检测故障的早期迹象。当超过定义的阈值时，系统触发事件日志的创建。决策执行记录被记录在私有区块链上，用于追溯和审计\
  \ [34] (图 9.9)。\n\n![图 9.9 早期检测](img/Fig09_09.jpg)\n\n3. **智能城市与基础设施系统：** 在城市环境中，监控交通流量、空气质量、公共照明和关键基础设施是智能城市最的功能之一。策略部署的边缘设备利用\
  \ `TinyML` 模型对环境现象进行实时分析，包括交通流量、漏水和空气质量指标。运行中的重大结果被记录在区块链上，在确保数据完整性的同时实现了精确的历史分析。智能合约还根据环境条件调整交通信号、重新规划路线或控制自适应照明。请参考图\
  \ 9.10。\n\n![图 9.10](img/Fig09_10.jpg)\n\n4. **精准农业：** 在农业环境中，实施精准农业意味着对土壤质量、水分含量和虫害等关键因素进行持续监控。无人机和地面传感器将数据传输到运行\
  \ `TinyML` 模型的移动边缘单元，这些模型经过训练可检测水分胁迫、生长不均或虫害。决策执行记录记录在农业区块链上，以促进生产者和分销商之间的透明度，并确保符合环境和农业标准(图\
  \ 9.11)。\n\n![图 9.11](img/Fig09_11.jpg)\n\n\n\n\n\n### 5. 智能供应链\n\n在供应链中，智能集装箱通过传感器进行监控，跟踪温度、湿度和震动等物理变量。边缘设备上的`TinyML`单元在本地分析这些数据，以检测偏离理想状态的情况，例如冷链断裂或产品震动过大。当发生故障时，带有地理空数据的事件日志将发送到物流区块链网络，这实现了产品的实时追踪，并在运输质量下降时提供透明的责任证明\
  \ [29]（参阅图 9.12）。\n\n![图 9.12 使用 TinyML 进行异常检测并使用区块链进行安全实时追踪的智能供应链系统。返回正文。⏎](img/Fig09_12.jpg)\n\
  \n图 9.12 使用 TinyML 进行异常检测并使用区块链进行安全实时追踪的智能供应链系统。返回正文。⏎\n\n## 9.4 通过集成增强安全与隐私\n\n\
  资源受限设备广泛分布在物联网环境的大型异构网络中。安全和隐私需求变得比以往任何时候都要复杂。集成`TinyML` 和区块链技术，将实时分析和智能响应能力与构建在去中心化信任之上的防篡基础设施相结合。在这里，我们探讨这种集成如何有助于更有效的威胁检测、稳健的数据保护以及促进精确的取证分析，同时解决随之来的技术挑战。\n\
  \n在边缘设备上部署`TinyML`模型允许直接在节点级执行数据分析和推理。这使得在检测到可疑行为或异常模式时能够立即响应，例如工业设备震动频率的突然变化或智能家居环境中意外的运动模式，因为在许多情况下，推理在单毫秒内完成，使系统能够触发安全响应（如锁门或实时警报）。通过实现本地数据处理，该方法限制了外部传输并减少了数据被拦截或操纵的可能性，从而有效缩小了攻击面。\n\
  \n区块链通过提供一旦写入便无法更改的分布式账本结构，确保了不可篡改性和信任。该账本结构按时间和地理位置精确地记录了安全推理的结果 [35]。当设备层检测到安全事件时，其细节将以数字签名交易的形式记录在区块链上。这为未来的审计和调查创建了不可篡改且可验证的历史记录，对于确保安全事件记录的完整性和保护是理想的。\n\
  \n这种集成实现了所谓的端到端安全集成。它始于边缘设备的数据生成点，持续到本地分析，并以去中心化日志结束。通过这种方式，每个安全事件都变成一个可以追踪、验证和分析的可信单元，无论是在事件发生的瞬间，还是在事件发生后很久。\n\
  \n该架构还支持通过智能合约进行访问控制，消除了对集中身份验证基础设施的依赖。当请求访问特定数据或激活敏感组件时，智能合约将自动验证预定义的条件，这些条件会考虑用户身份、地理位置或之前的活动日志\
  \ [36]。\n\n该模型的一个显著特点是它能够记录`TinyML` AI 模型所做出的决策 [37]。这种能力有助于对机器驱动的决策进行追溯审计，并增强了对部署在关键环境中的智能系统的信心。\n\
  \n尽管有这些优点，但将区块链技术应用于资源受限的设备环境仍然面临巨大的技术挑战，因为区块链需要采用传统的共识算法，如`Proof of Work`或`Proof\
  \ of Stake` [38]。这就有必要研究与此类环境局限性兼容的轻量级替代方案。\n\n一种方案是使用轻客户端模型，允许设备通过仅存储区块头而非整个区块链来验证交易\
  \ [39]。另一种方法涉及离链账本设计，将大量数据保留在区块链之外，而仅在区块中存储其哈希值或数字签名 [40]。偏离传统链结构的网络，例如基于有向无环图（`DAG`）的\
  \ `IOTA`，也提供了支持效率和适应性的实用解决方案 [41]。\n\n`TinyML`与区块链的融合表明，安全已经演变为不仅仅是基础设施方面的考虑；它现在已嵌入到所有系统层，从边缘设备到网络最高层。该模型在对快速安全、自主行动和可追踪文档至关重要的现实场景中证明非常有效。下一节将提供一个案例研究，展示这种集成在智能家居环境中的实际实现。\n\
  \n## 9.5 案例研究：智能家居入侵检测系统\n\n随着智能家居中连接设备的广泛使用，对有效的安全系统实时检测和分析异常活动的需求日益增长。在这种背景下，将采用研究\
  \ [28] 作为案例研究，来说明如何利用`TinyML`和区块链来增强智能家居的安全性。我们将探索如何使用`TinyML`在本地实时分析数据并检测可疑活动。我们还将讨论如何通过以不可篡改的方式记录和记录事件来为智能家居提供额外保护，并深入系统的技术设计细节（重点关注所采用的算法），并检查如何协作且高效地将这些技术集成到系统中。\n\
  \n### 9.5.1 场景：检测智能家居中的异常活动\n\n该系统旨在通过利用运动传感器和智能摄像头来识别家内的异常活动。这些传感器收集家内的移动数据；一旦检测到异常行为，数据将通过经过训练以识别非典型模式的`TinyML`模型进行处理。数据在边缘设备上使用`TinyML`进行实时分析，从而对潜在威胁进行实时检测。当检测到可疑运动时，实时警报将发送到用户界面，允许所有者做出相应响应。\n\
  \n### 9.5.2 TinyML 模型：人员检测或运动模式识别\n\n\n\n\n\n该系统旨在通过运动传感器和智能摄像头检测家庭内的异常活动。例如，模型可以检测到个人在不适当的时间或受限区域出现在家中。收集的数据用于检测运动模式模式的任何变化。为了进行此类分析，模型依赖于\
  \ `federated learning`（联邦学习）算法，这是一种以分布式方式跨多个设备或节点训练模型的算法方法。使用 `federated learning`\
  \ 允许设备在保持本地数据不离开服务器的情况下持续改进其模型。尽管 `federated learning` 在跨边缘设备处理本地数据而无需传输数据到服务器方面非常轻量化，但在某些情况下，由于边缘设备的资源限制，需要进一步增强模型。为此，使用了\
  \ `knowledge distillation`（知识蒸馏）技术。`knowledge distillation` 在保持模型良好性能的同时减小模型尺寸，将大模型转换为较小模型。接着是\
  \ `federated learning`，将通过 `knowledge distillation` 缩小的小模型应用到多个设备上。在这种情况下，每个设备使用其本地数据训练本地模型。在小型设备上训练本地模型后，将更新发送到中央服务器。这样，在不共享数据的情况下，通过从多个设备中学习创建一个单一、强大且优化的模型。\n\
  \n### 9.5.3 区块链应用：事件记录、警报共享与身份验证\n\n在该系统中，区块链被视为确保处理数据安全性和信誉的基础层。一旦通过 `TinyML` 模型检测到异常活动，警报将发送到去中心化的区块链网络。这使得所有警报都有永久、防篡改的记录，增强了透明度，并在发生违规或安全威胁时协助后续调查。文档和数据存储过程在分布式账本中进行，每个事件（包括入侵尝试等异常活动）都以加密块的形式记录。在与系统交互时，`smart\
  \ contracts`（智能合约）安全地验证身份并验证数据，确保这些警报防篡改的同时，还能根据检测到的模式自动执行操作，例如通知房主或在发生重大威胁时向警方发送警报。\n\
  \n*   188 使用的硬件：值得注意的是，系统依赖于微控制器，如 `Arduino Nano 33 BLE Sense`，它具有运行频率为 `64 MHz`\
  \ 的 `ARM Cortex-M4F` 处理器和 `256 KB` 内存，以及一组全集成的传感器，包括运动、温度和压力传感器。\n\n*   性能指标——准确率、能耗、延迟：基于\
  \ `federated learning` 的模型在检测异常活动方面表现出高准确率，优于传统的机器学习模型。得益于使用了轻量且高效的算法，功耗得到了显著优化，允许设备在小型电池上长时间运行而无需将数据传输到中央服务器。通过本地数据处理，延迟被降至最低，使系统能够比传统系统更快响应。\n\
  \n## 9.6 实现考虑与优化（1,000–1,200 字）\n\n模型压缩技术：`TinyML` 的关键特征之一是其小模型尺寸，非常适合资源受限的设备（如微控制器）。机器学习模型预计小于\
  \ `1 megabyte`，这是罕见的。因此，通常采用先进技术来减小模型尺寸，包括：\n\n*   压缩：通过压缩使模型更加紧凑，减少了存储需求，但尝试保持准确率稳定。`Precision\
  \ reduction`（精度降低）可以减少模型需要存储的参数数量，产生更小、更高效的模型，且对性能的影响最小。在此过程中，处理还有助于消除数据中的冗余，并鼓励使用更高效、更简洁的表示方法。\n\
  \n*   量化：缩小模型尺寸的常用方法是降低用于表示权重和数值的位宽，有助于在不大幅损失性能的情况下减少内存占用。目标是减少用于表示模型权重和其他数值的精度。例如，不再使用高精度的小数（`32-bit`\
  \ 或 `64-bit`）来表示权重，而是将比特数减少到较小的值（`8-bit` 或 `16-bit`）。此外近似值（如权重）。\n\n*   权重剪枝：`Pruning`（剪枝）涉及从模型中移除不重要的权重。剪枝后的权重通常对模型预测的贡献最小。\n\
  \n### 9.6.1 高效区块链操作：链上/链下的平衡\n\n区块链有效地增强了安全性和透明度，而 `TinyML` 是有效解决方案之一，使边缘设备能够执行能够分析数据并做出实时响应的\
  \ AI 模型。这些技术的整合 189p 面临着若干挑战，首要挑战是在链上和链下过程之间实现最佳平衡。将区块链与 `TinyML` 集成的最大挑战之一是找到链上和链下操作之间的最佳平衡。链上操作涉及直接在分布式账本或区块链中记录交易。这种方法提供了强大的安全优势；然而，它通常很慢且耗能，这与\
  \ `TinyML` 的效率需求相冲突。在区块链系统中，`smart contracts` 可以在链上记录交易。然而，初步数据分析或模型验证等高效操作可以在链下进行，从而允许更快、更高效的数据处理。例如，当使用\
  \ `TinyML` 模型分析运动数据时，大部分处理在边缘设备上本地完成，只有分段后的结果通过链上操作传输到分布式网络。\n\n### 9.6.2 数据处理：区块链中的定期写入与基于事件的写入\n\
  \n在在边缘设备上集成区块链与 `TinyML` 的系统中，海量数据定期从边缘流向区块链。选择向区块链写入数据的最佳方法对于确保系统效率和降低成本至关重要。为了实现这一目的，有两种方法：定期写入和基于事件的写入。定期写入是指在区块链中记录所有事件，无论其价值或重要性如何。在这种方法中，必须持续更新区块链以确保账本定期更新。由于在短间隔内发生高频率写入，这导致了交易成本增加。相反，事件驱动写入仅在定义事件发生时才在区块链上记录数据，包括异常运动检测或安全威胁识别等情况。这种方法通过仅记录关键事件提高了系统效率，降低了交易频率和成本。\n\
  \n### 9.6.3 能量和内存消耗优化策略\n\n\n\n\n在物联网系统中，边缘设备依赖于有限的电池，能量和内存消耗是确保系统可持续性的关键。可以应用多种技术来实现这些目标，从模型压缩、本地化技术到能耗控制方法等。在我们正在讨论的集成系统中，设备端处理是降低能耗的关键积极特性之一，特别是因为通过网络传输数据的成本远高于在本地处理这些数据的成本。另一个关键特性是`Smart\
  \ Sleep`（智能睡眠），当未检测到异常活动时，设备可以进入自动或空闲睡眠模式。如前所述，可以采用`pruning`（剪枝）、`quantization`（量化）和`compression`（压缩）技术来减小模型尺寸，从而帮助降低内存消耗。正如之前过的，`pruning`、`quantization`和`compression`等技术可以缩小模型尺寸，从而有助于减少内存占用。`Hierarchical\
  \ storage`（分级存储）是另一种有效技术，它确保只有关键数据被记录在区块链上，而较不重要的数据存储在外部数据库或缓存内存中。\n\n## 9.7 挑战与未来研究方向\n\
  \n由于不同厂商设备的多样性以及缺乏标准化协议，互操作性是集成`TinyML`和`blockchain`技术面临的基础挑战之一。在实践中，由于跨设备使用的编程方法和底层平台的差异，确保不同系统之间的兼容性是复杂的。为了克服这一挑战，由学术和工业组织（如`IETF`或`IEEE`）建立统一的行业标准，以保证各种系统的无缝集成。对于处理敏感数据的应用（如医疗或金融领域），确保机器学习的隐私至关重要。使用`federated\
  \ learning`（联邦学习）模型是隐私的有效解决方案，因为它可以在不集中数据的情况下进行训练。相反，模型在边缘设备上进行本地训练，仅将修改后的模型传输到中央服务器。\n\
  \n`Blockchain`通过为模型的所有更新提供安全、防篡改的文档进一步加强了隐私。`Smart contracts`（智能合约）也确保与模型相关的交易是合法且安全的。然而，仍需要开发技术来减少依赖资源受限设备的`IoT`系统中链上交易的大小。\n\
  \n在`IoT`环境中，分布式网络在识别合适的参与者激励以促进设备间协作方面面临重大挑战。`Consensus mechanisms`（共识机制）必须鼓励多方参与计算过程或数据的共享存储。某些网络利用传统的共识机制，如`Proof\
  \ of Work`（`PoW`）或`Proof of Stake`（`PoS`），但这些并不适用于资源受限的环境。为了解决这个问题，更轻量且设备兼容的共识机制出现了，例如`Delegated\
  \ Proof of Stake`（`DPoS`），它们具有更低的功率需求和降低的网络压力。在`DPoS`机制中，网络中的每个节点都参与交易验证（如`Proof\
  \ of Work`（PoW）所示）。相反，会选举少数受信任节点（通常称为`delegates`或`validators`）来执行此任务。这些节点在技术上与其他节点无异，但根据网络利益相关者的投票，被临时负责管理共识和验证过程。这种任务的智能分配能够更快速、更高效地实现共识，而无需强制每个节点在验证中浪费资源，因此特别适用于能量和计算资源有限的`IoT`应用[17]。\n\
  \n随着系统扩展到包含更多设备或案例，对资源的需求以及处理数据所需的时间也会增加。然而，扩展可能会增加成本，特别是在存储或区块链交易操作方面。因此，研究人员和开发者必须找到平衡扩展性和成本的解决方案。可以采用`off-chain\
  \ processing`（链下处理）和`hierarchical data storage`（分级数据存储）等方法来减少在分布式账本中存储所有数据的需求。随着现代技术的发展，我们开始看到将显著影响物联网环境中`TinyML`和`blockchain`集成的创新。`Neuromorphic\
  \ chips`（神经形态芯片）就是其中一种技术。在`TinyML`领域，神经形态芯片可以极大提高边缘设备数据处理的速度和效率，因为它们模拟了人类的信息处理机制。\n\
  \n另一方面，边缘大语言模型（`LLMs at the Edge`），如`GPT`可以让边缘设备在`IoT`环境中与用户进行智能交互。通过在边缘实现自然语言处理模型，设备可以立即分析文本和语音数据，而无需将其到云端。最后，基于有向无环图（`DAG`）的账本（如`IOTA`）为传统的区块链结构提供了一种创新的替代方案。DAG\
  \ 结构不是顺序组织区块，而是并发表示交易，从而实现了更快、更灵活且延迟的交易。由于这些技术不需要传统区块链典型的密集挖矿操作，它们特别适用于资源受限设备。\n\
  \n## 9.8 结论与总结\n\n在物联网环境中集成`TinyML`技术与`blockchain`对于增强智能应用的安全、效率和隐私保护至关重要。随着智能设备在我们日常生活中的采用率不断提高，解决安全和数据保护挑战变得至关重要。`TinyML`旨在为用户边缘提供人工智能，使设备能够执行本地处理并减少对云端的依赖。`Blockchain`提供了一个确保数据完整性和真实性的安全层。集成这些技术确保了完整性、可靠性和安全性。这种集成的架构方法确保了系统内部数据的流畅流动。\n\
