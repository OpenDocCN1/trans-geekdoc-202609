  \ 返回文本。\n\n\n\n\n\n物联网（IoT）的到来标志着嵌入式系统和通信技术演变的决定性转折点。这种革命性的变革不仅预示着转向具连接性的技术生态系统，同时也引入了一系列新的复杂性，重新定义了传统的安全范式。互联网已经远远超了简单的计算机网络，涵盖了各种设备，包括\
  \ RFID 标签、传感器网络、汽车网络以及许多其他互联技术。\n\n这场革命的核心是物联网，它通过各种通信协议实现了许多合适的无线实体和设备（如手机和传感器）的联网。这种级别的互联性适用于具有重大实际影响的物体，因此需要稳健的安全架构来降低风险。因此，需要对协议进行修订以纳入新的限制，并侧重于加强安全机制。\n\
  \n在这一快速变化的背景下，微机器学习（`TinyML`）正成为这一转型前沿的一个关键领域。`TinyML` 代表了机器学习与嵌入式系统的交叉领域，能够在具有极低功耗的微控制器的设备上运行人工智能模型。这种技术的融合为网络边缘的智能和自主运行开启了新的可能性，可能彻底改变医疗保健、制造业和环境监测在内的多个行业。\n\
  \n`TinyML` 代表了一种边缘计算的革命性方法，探索了直接在边缘设备上部署和训练机器学习模型。这项技术弥补了资源受限的 IoT 设备与边缘计算能力差距，在超低功耗设备上实现了机器学习应用。\n\
  \n技术格局的转型在 `TinyML` 会的演变中尤为可见，该会现在自称为 `EdgeAI Foundation`。这一演变反映了该领域的扩张：`TinyML`\
  \ 最初关注在处理能力和内存有限的小设备上运行机器学习模型，而 `EdgeAI` 通过整合更复杂的模型并利用本地计算资源进行实时决策扩展了这一愿景。\n\n边缘分析市场的应用正在改变行业，边缘计算市场预计到\
  \ 2027 年将达到约 350 亿美元。然而，目前的边缘分析方法涉及在云端训练的机器学习模型，这为系统引入了延迟并容易引发隐私问题。`TinyML` 为边缘计算提供了一种新方法，探索了直接在边缘设备上部署和训练机器学习模型。\n\
  \n## TinyML 的安全挑战\n\n尽管 `TinyML` 取得了广阔的进展，但这项技术面临着独特且前所未有的安全挑战。`TinyML` 设备在严格的资源限制下运行，其内存和计算能力通常比传统\
  \ IoT 或边缘设备低二三个数量级。这种资源上的巨大差异为实施安全措施带来了前所未有的挑战。\n\n虽然标准边缘设备可能具有兆兆级的 RAM 和以吉赫频率运行的处理器，但\
  \ `TinyML` 设备通常只有几千字节内存和以兆赫频率运行的处理器。这些严苛的限制使得直接应用传统的安全方法变得不切实际，甚至是不可能的。此外，这些资源受限设备在各种且通常物理上可及的环境中广泛部署，使其暴露在各种潜在威胁之中。\n\
  \n`TinyML` 设备的独特特征带来了一系列独特的安全关注，需要审慎考虑。为资源密集型环境设计的传统安全方法通常与 `TinyML` 系统的严格限制冲突。这种不匹配导致在保护这些设备免受各种威胁时存在重大的漏洞。\n\
  \n`TinyML` 技术的快速进步与其安全研究相对较慢的速度之间的巨大差距，凸显了这项研究的重要性。对发布趋势的分析显示出令人担忧的差异：在 2015 年到\
  \ 2023 年之间，约有 347 篇致力于 `TinyML` 模型、硬件和软件的论文，但只有九篇涉及了 `TinyML` 安全问题。\n\n这一统计数据揭示了学术和工业研究中的关键空白。更令人担忧的是，许多关注安全的文章更多地侧重于使用\
  \ `TinyML` 来提高安全性，而不是解决 `TinyML` 设备本身的安全问题。尽管 `TinyML` 在各个领域的应用日益增加，但这种安全研究的缺乏凸显了进行深入研究的迫切需求。\n\
  \n本文旨在通过对 `TinyML` 的安全格局提供全面且组织的评估，来填补这一关键空白。本章的主要目标是开发一个全面的边缘分类法，区分传统的 IoT 设备、边缘\
  \ AI 设备和 `TinyML` 设备，阐明它们各自面临的独特安全挑战。本文主要旨在做出以下贡献：\n\n- 定义了威胁和缓解分类的各种需求。\n- 分析了受限\
  \ IoT 安全威胁。\n- 研究并分析了深度密钥管理协议和 `TinyML`。\n\n本章的结构如下：第 8.2 节描述了研究方法。第 8.3 节回顾了相关的受限\
  \ IoT 要求和威胁。第 8.4 节讨论了安全威胁。第 8.5 节介绍了受限 IoT 最重要的密钥管理方案。最后，第 8.6 节总结本章。\n\n## 8.2\
  \ 研究方法\n\n我们深入探讨了资源受限 IoT 环境中安全的关键方面，特别关注了微机器学习（`TinyML`）系统。这项查询解决了与安全需求、威胁模型和密钥管理方案相关的根本问题，旨在阐确保智能边缘设备完整性、机密性和性的的关键要素。\n\
  \n理解支持 `TinyML` 的 IoT 系统不断变化的安全格局至关重要，因为这些设备在处理能力、内存和能量方面受到严格限制，导致传统的安全方法失效。我们分析了主要的安全需求，包括数据完整性、机密性、身份验证和轻量级隐私机制，这些对于维护信任至关重要，特别是在敏感和动态的边缘计算环境中。\n\
  \n我们还检查了常见威胁，模型反向攻击、对抗输入、数据泄露、物理破坏和未经授权的访问，这些威胁对 `TinyML` 在现实场景中的部署成了巨大风险，强调了对自适应轻量级安全机制的迫切需求。\n\
  \n此外，我们探索了为受限设备定制的各种密钥管理方案，强调了与 `TinyML` 计算限制兼容的高效密钥生成、分配、存储和更新机制。通过评估现有方法，我们识别了保护学习型\
  \ IoT 生态系统的最佳实践、当前局限性和开放性挑战。\n\n\n\n\n\n通过对安全需求、新兴威胁和关键管理策略的全面分析，本节为安全 `TinyML`\
  \ 框架的设计提供了关键见解，为下一代智能嵌入式系统稳健、可扩展且感知上下文的安全解决方案铺定了道路（Maleh et al. 2022）。\n\n在这里，我们详细介绍了进行本次调查所遵循的程序。我们依赖系统性文献综述（`SLRs`）流程来增强对相关类别的理解。`SRL`\
  \ 被认为它与传统综述的区别在于，它追求一种可重复、科学且透明的程序。`SLRs` 最初应用于医学领域，提供了一种可重复的研究方法，并应该能够产生足够的数据供其他研究人员进行复制。计算机安全领域的几位研究人员近期开始采用\
  \ `SRL` 技术。随着 SDN 安全领域高质量研究的出现，`SLR` 能够帮助分类这些仍处于早期阶段的研究。\n\n最初定义了研究课题以组织 `SRL`。在此过程中必须考虑`支持\
  \ TinyML 的设备`安全性的潜在益处。这确立了三个基础主题类别：暴露、攻击和关键管理流程。为了强调对`支持 TinyML 的设备`风险和重要管理策略进行当前且全面的评估的必要性，我们提出了两个将在本文中尝试回答的研究问题：\n\
  \n*   `RQ1`: 在由机器学习支持的资源受限 IoT 环境中，主要的安全需求和威胁有哪些？\n*   `RQ2`: 为安全保障`支持 TinyML 的系统`和低功耗\
  \ IoT 设备提了哪些关键管理方案？\n\n我们使用三阶段选择法来选择与这些研究问题相关的文章：(1) 定义搜索关键词，(2) 选择来源，(3) 确定并应用所选论文的纳入/排除标准：\n\
  \n1.  **搜索术：** 这一步侧重于识别在资源受限 IoT 设备微型机器学习（`TinyML`）背景下评估安全挑战和缓解策略最相关的关键词。为了确保全面的文献检索，我们包含了核心术语以及相关的同义词和变体。所选关键词包括：\n\
  \n“TinyML 安全”、“微型机器学习中的安全”、“IoT 设备漏洞”、“轻量级安全协议”、“安全 TinyML”、“IoT 中的密钥管理”、“资源受限设备的安全”、“边缘\
  \ AI 安全”、“TinyML 系统中的威胁”以及“支持 TinyML 的 IoT 攻击”。\n\n2.  **搜索字符串定义：** 为了定义搜索字符串，我们使用了布尔运算符——`OR`\
