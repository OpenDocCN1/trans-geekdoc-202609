  \n# 7 TinyML 应用中的安全与隐私\n\nMohammed R. Al-Matari 和 Qasem Abu Al-Haija\n\nDOI: [10.1201/978100354449-7](https://doi.org/10.1201/978100354449-7)\n\
  \n## 7.1 引言\n\n随着互联网连接的普及，物联网（`IoT`）的快速增长为现代人工智能（`AI`）集成到边缘设备中铺平了道路，导致对智能设备的迫切需求。这种需求推动了一个名为微机器学习（`TinyML`）的新兴机器学习（`ML`）领域的兴起，它将`ML`的能力扩展到微控制器等边缘的资源受限、超低功耗设备上。通过允许在无需云计算的情况下进行数据处理、设备端分析和决策，`TinyML`\
  \ 提供了巨大的优势，包括降低延迟、增强隐私性、更低的带宽消耗和高效的利用。\n\n`TinyML` 在各种应用中了工业`IoT` 中的预测性维护、可穿戴设备、医疗监测和野生动物保护，展现了变革性的潜力。所有这些用例都涉及敏感环境下的实时推理和持续感知，凸显了安全和隐私挑战的重要性与复杂性。与在云计算中运行的传统`ML`不同，`TinyML`的工作环境具有许多限制，如资源有限、物理暴露和低信任环境，导致系统防御薄弱且具有脆弱性。\n\
  \n尽管 `TinyML` 具有广阔的潜力，但边缘设备的受限计算构成了传统安全和隐私保护机制的障碍。在通用`CPUs` 上执行加密等细微操作，在处理能力和`RAM`\
  \ 有限的情况下是不切实际的。同样，如差分隐私和同态加密等隐私增强方法在这种情况下也是不可行的。这些局限性使得边缘设备需要更具针对性的轻量级方法。\n\n此外，`AI`\
  \ 模型在安全关键环境中的部署放大了可能的风险。`TinyML` 系统容易受到多种攻击，包括数据投毒攻击、模型反转攻击、对抗输入攻击、固件篡改和基于硬件的侧道攻击。此类攻击的后果从隐私泄露到自动系统和医疗保健等关键领域的灾难性系统故障。图\
  \ 7.1 显示了 `TinyML` 架构以及每一层对应的威胁。这强调了解决每一层威胁并考虑周围层级威胁的必要性。因此，`TinyML` 系统的安全和隐私是日益关注的问题，需要在其整个阶段进行整体性的解决——从数据收集和模型训练到部署阶段，最后是全生命周期管理。\n\
  \n![图 7.1 TinyML 分层架构及各层的潜在威胁。](img/Fig07_01.jpg)\n\n图 7.1 TinyML 分层架构及各层的潜在威胁。\n\
  \n本章对 `TinyML` 应用的安全和隐私问题提供了全面、深入的概述，面向行业从业者和学术研究人员。本章旨在通过涵盖现有的威胁格局、隐私保护`ML`技术、加密限制和安全部署框架，为读者提供该领域挑战和前景解决方案的详尽概述。通常，`TinyML`\
  \ 系统的隐私讨论是孤立的、技术性的，且在现有文献中缺乏整体方法。然而，本章旨在将 `TinyML` 的安全和隐私作为一个整体威胁格局来处理。本章整合了边缘`AI`、隐私增强技术和嵌入式系统。它综述了先进的漏洞和缓解措施，提供了结构化框架、设计指南，并展示了指导未来开发的实际案例。其核心贡献为研究人员、工程师和政策制定者提供了大规模安全部署\
  \ `TinyML` 的实用路线。\n\n### 7.1.1 为什么写这一章？\n\n本章的动力源于以下迫切需求：\n\n* 理解 `TinyML` 部署和架构带来的安全与隐私关注。\n\
  * 介绍并评估适用于边缘设备的轻量级加密协议。\n* 差分隐私、联邦学习以及针对嵌入式系统的现有隐私保护机制。\n* 展示真实案例及其安全事件、缓解措施和最佳实践。\n\
  * 在 AI、嵌入式系统和密码学领域之间跨学科协作的潜力。\n\n### 7.1.2 结构\n\n本章结构组织如下：\n\n* **第 7.2 节 背景与基础知识**：为读者提供\
  \ `TinyML` 系统架构、开发周期、安全挑战和威胁模型的基础和背景。\n* **第 7.3 节 TinyML 系统中的安全威胁与攻击面**：深入探讨 `TinyML`\
  \ 在各个方面的安全威胁，如硬件层、软件层、网络层以及特定的 ML 威胁。\n* **第 7.4 节 TinyML 应用中的隐私问题**：回顾 `TinyML`\
  \ 应用中的隐私关注。\n* **第 7.5 节 用于 TinyML 的轻量级加密与安全协议**：概述用于嵌入式系统的轻量级加密标准和协议。\n* **第 7.6\
  \ 节 TinyML 的隐私保护与安全机器学习技术**：探索用于安全 `ML` 和 `TinyML` 的隐私保护技术，如同态加密、联邦学习和差分隐私。\n\n\n\
  \n\n\n*   第 7.7 节 安全 TinyML 框架、工具链和案例研究综述了安全的 TinyML 框架和工具链，并介绍了真实的案例研究。\n*   第\
  \ 7.8 节 设计指南与最佳实践为安全的 TinyML 和隐私感知开发提供了实用的设计指南和最佳实践。\n*   第 7.9 节 研究挑战与未来方向重点介绍了该领域新兴的开放研究方向、未来挑战以及正在制定的标准。\n\
  *   第 7.10 节 结论总结并概述了关于从零开始构建信赖 TinyML 的关键见解和建议。\n\n100\n\n## 7.2 背景与基础\n\n### 7.2.1\
  \ TinyML 架构与部署上下文\n\nTinyML 是一种运行在资源受限的边缘设备上的机器学习模型，特别是配备微控制器单元（MCU）的边缘传感器和小型 IoT\
  \ 设备。一个典型的 TinyML 系统具有一个或多个数据源，主要是传感器（例如摄像头和麦克风），它们将数据传递到板载处理单元（MCU），TinyML 模型便在其中运行。MCU\
  \ 运行预训练 TinyML 模型的推理引擎，然后通过输出推理产生结果，执行执行操作或通信结果（图 7.1）。与手机不同，运行 TinyML 模型的 MCU 没有操作系统（通常是轻量级实时操作系统\
  \ RTOS），它在几十到几百 KB 的有限内存范围内运行。例如，几个著名的 TinyML 平台利用 `Arm Cortex-M` CPU，其 `SRAM <\
  \ 256 KB` 且主频较低。因此，需要高效的模型架构和软件才能在如此严苛的工作 [6]。\n\n尽管规模较小，TinyML 为边缘设备提供了巨大的优势，使其能够在无需持续云端连接的情况下实现实时的、本地\
  \ AI 推理 [6]。这对于工业传感器、健康穿戴监测设备以及如 `Amazon Alexa`、`Apple Siri` 或 `Google Assistant`\
  \ 的唤醒检测至关重要。在这些情况下，由于带宽、响应延迟和隐私考虑，将数据流回云端进行推理是不行的。TinyML 设计用于在低功耗设置下的边缘设备运行。例如，简单的关键词检测\
  \ TinyML 模型可以部署在电池供电的 `Arduino` 系统上，持续监听语音命令 [7]。通常，此类架构利用优化的库（例如 `Arm CMSIS-NN`、`TensorFlow\
  \ Lite`）。此外，它们还可以矩阵运算硬件加速器。然而，这些平台缺乏大型边缘设备的功能，如虚拟内存或进程隔离。总之，TinyML 架构实现了 AI 向边缘设备的扩展，并作为“边缘\
  \ AI”范式的基础，通过引入完整周期（感知、计算和执行），将 AI 从大型云数据中心转移到边缘设备的嵌入式环境中。\n\n### 7.2.2 边缘设备上的机器学习生命周期\n\
  \nTinyML 开发包含几个阶段：\n\n1.  **数据采集：** 从目标环境收集数据，例如来自摄像头或麦克风的图像或音频剪。\n2.  **预处理与特征提取：**\
  \ 对原始数据进行预处理以提取模型特征，如滤波、归一化或降维。\n3.  **模型训练：** 使用收集的数据在离线设备（例如在 PC 上）训练模型，因为边缘设备的资源太有限。生命周期中的一个关键方面是“训练-部署差距”。由于训练是在离线完成的，部署到设备上需要对\
  \ MCU 的数值行为和存储限制进行仔细模拟，特别是在应用优化以确保模型能够在 MCU 约束条件下运行时。\n4.  **模型优化：** 缩小模型大小。常用技术包括剪枝、模型蒸馏和量化（例如从\
  \ 32 位整数转换为 8 位整数）。\n5.  **部署格式：** 将模型转换为适合 MCU 的格式，例如 `flatbuffer` 或 C 数组。\n6.\
  \  **烧录与部署：** 将模型权重和代码烧入 MCU 闪存中（通常为 `512 KB` 到 `1 MB`）。\n7.  **设备端推理与监控：** 模型在此阶段运行在设备上。某些\
  \ TinyML 部署包含监控反馈，以识别进一步的模型更新和改进。然而，已部署设备上的 TinyML 更新过程是具有挑战性的，因为可能需要空中下载（OTA）固件更新。\n\
  \n在 TinyML 生命周期期间，工程师使用专用的工具来简化开发流程。例如，`Google TensorFlow Lite Micro` 允许在设备上进行模型测试。其他平台如\
  \ `Edge Impulse` 或 `Qexo AutoML` 提供了数据采集、训练和部署的端到端工作流。\n\n### 7.2.3 TinyML 的主要特性\n\
  \n若干特征将 TinyML 系统与传统的机器学习或云部署机器学习区分开来。TinyML 的特征包括：\n\n*   **内存和计算限制：** TinyML 部署在具有几\
  \ KB RAM、闪存且通常具有几十 MHz CPU 频率的 MCU 上。因此，模型必须足够小以适应有限的资源。例如，手机的内存是 MCU 的 $10³$ 倍\
  \ [9]。\n\n\n\n\n\n*   **超低功耗运行：** `MCUs` 的设计用于低功耗运行，通常为毫瓦或微瓦级，因此 `TinyML` 具有极高的能源效率。由于\
  \ `TinyML` 系统可能始终进行推理（例如，始终监听关键词），它们需要通过任何方式节省电力，例如节省通过无线连接传输数据流的能量成本。例如，已有研究表明，纽扣电池可以为运行在\
  \ `Cortex-M4` 上的关键词检测系统供电几个月 [7]。\n*   **实时性设置：** `TinyML` 应用大多是实时的；因此，它们必须以最小延迟做出响应。通常，从感知到执行所需的时间在几十毫秒范围内。由于决策是在本地发生的且是瞬时的，这为终端用户节省了时间，与云端推理不同。\n\
  *   **特定任务和轻量级模型：** 由于 `TinyML` 专门用于单一任务，其复杂度保持在较低水平并针对尺寸进行了优化，因此适用于设备设备。例如，用于语音的\
  \ `TinyML` 将具有几千个参数的 `CNN`，而云端版本可能是多用途且庞大的。\n*   **隐私保护和离线：** 在数据不离开设备的情况下进行本地推理的能力，对于终端用户来说是一种固有的隐私优势。另一个\
  \ `TinyML` 属性是可以在不需要连接的情况下离线运行的能力。因此，系统是健壮的，并且在没有云服务连接的情况下运行。\n\n103 总之，`TinyML`\
  \ 的特征围绕着任务特定性、持续实时运行和有限资源使用展开。随着全球范围内数十亿微控制器（根据 2022 年的一项研究为 2500 亿）且这一数字正在不断增加，`TinyML`\
  \ 特使得边缘设备能够将机器学习整合到其操作中。尽管 `TinyML` 提供了这些优势，但仍然伴随着重大的挑战，例如隐私和安全，如接文所述。\n\n### 7.2.4\
  \ 边缘 AI 与云端 AI 的安全挑战\n\n部署 `TinyML` 提供了一种独特的安全优势，即数据在设备本地处理，而云端 AI 不同，后者数据从用户或传感器传输到中央服务器进行训练或推理。尽管如此，`TinyML`\
  \ 仍存在若干隐私漏洞。表 7.1 突出了边缘 AI（`TinyML` 和分布式）与云端 AI（集中式）在安全考虑方面的主要区别。\n\n表 7.1 云端 AI\
  \ 与边缘 (TinyML) AI 安全考虑因素比较 返回正。⏎\n\n| 方面 | 云端 AI | 边缘 AI |\n| --- | --- | --- |\n\
  | 数据传输 | 数据发送到设备外和中央存储泄露的风险 | 数据保留在设备上，提供更好的隐私。本地泄露的影响仅影响设备数据。 |\n| 物理安全 | 中央数据中心和服务器受到高度保护；用户无法从物理上访问云硬件\
  \ | 边缘设备大多在开放环境中运行；它们处于攻击者的触及范围内。它们可能会被物理篡改、访问或损坏。 |\n| 计算资源 | 无计算限制：因此可以实施保护技术，例如强加密、异常检测等。\
  \ | 资源有限——无法实现计算密集型安全功能，只能实现轻量级技术。 |\n| 攻击面 | 云端访问点较少，如 API/云接口。尽管如此，它们仍很有吸引，因为一次泄露就会暴露大量数据\
  \ | 两种方式均暴露；物理接口和通过网络（在连接的情况下）。然而，小目标很难管理。 |\n| 更新机制 | 云端更新立即发送给所有用户——集中式更新 | 分布式更新；如果每个\
  \ `MCU` 有能力，则必须进行更新，导致某些 `MCUs` 运行过时的固件 |\n| 对抗 ML | 物理传感器不易受到影响；然而，攻击者可以远程向云端模型发送损坏数据。在这种情况下，可以应用输入监控。\
  \ | 传感器直接受到噪声或光的影响。此外，可以制作特殊构造的物理对抗示例，这些示例很难被检测。 |\n| 知识产权 | 模型参数存储在安全服务器上，很难被窃取。在不攻破服务器的情况下，反转训练数据具有挑战性。\
  \ | 模型位于设备闪存器内存中，可以通过固件提取或硬件攻击进行提取。它们更容易被盗 [7]。\n\n`TinyML` 安全性的差异需要更细致的方法。在低资源硬件上实施技术是一项挑战。接下来，概述了供考虑的\
  \ `TinyML` 威胁模型。\n\n### 7.2.5 与 TinyML 相关的威胁模型\n\n鉴于威胁模型的定义，可以假设攻击者具有完全能力的最坏情况。另一个假设是攻击者可以获得设备的物理访问权限，因为设备广泛分布并放置在户外。因此，攻击者获得设备访问权限使他们能够对设备进行分析、测试代码，并观察攻击下的设备行为以改进他们的攻击。对于\
  \ `TinyML`，工程师和研究人员需要使用 `CVSS`（通用漏洞评分系统）等方法根据其严重程度对各种攻击进行优先级排序，以知道优先缓解何种威胁。威胁大致分为以下几类：\n\
  \n1.  **硬件和物理攻击：** 这些攻击建立在攻击者具有设备物理访问权的假设之上。这是一个真实的场景，因为边缘设备大多在户外环境中工作。对硬件的威胁包括设备篡改、故障注入、侧信道攻击和输出/输入监听。\n\
  2.  **软件和固件攻击：** 针对 `MCU` 软件的攻击通常针对设备固件或 ML 代码。此类攻击可以远程执行，不需要攻击者物理上出现在附近。此类攻击包括固件或未经授权的模型更新、内存损坏和代码执行。\n\
  3.  **网络和通信攻击：** 针对通信信道的攻击利用了无线通信和数据传输中的漏洞。由于边缘设备使用 `LoRa`、`Zigbee` 等低功耗通信协议，它们很容易被攻击者在没有物理距离的情况下操纵、未经授权访问和拦截。\n\
  4.  **ML 特定攻击：** 此类攻击通过利用 ML 自身的属性和使用的数据针对 ML 本身。此类攻击包括数据投毒、模型提取、模型滥用或重用以及对抗示例。\n\
  \n104 总之，`TinyML` 结合了机器学习和物联网 领域的使用，因此继承了这两个领域的威胁。此外，105 受到这些边缘设备硬件的限制。一个平衡的安全模型指导工程师开发防御机制，以便在工作条件下为\
  \ `TinyML` 系统实现合理的安全。\n\n## 7.3 TinyML 系统中的安全威胁和攻击面\n\n\n\n\nTinyML 系统由于其去中心化的运行特性，本质上暴露在许多之中。部署条件、低内存、默认无加密设置以及操作系统的缺失都扩大了系统在多个工作层上的攻击面。本节将探讨其架构层中可能的攻击向量及其相应的威胁类型：硬件层、软件/固件层、通信层和机器学习模型层。\n\
  \n### 7.3.1 攻击向量概述\n\n与云端 AI 系统不同，TinyML 在暴露的区域工作，这使其容易受到不同类型的攻击，包括硬件接口利用、不安全的通信通道（例如更新通道）或模型推理行为。由于其易获取性和工作条件的限制，TinyML\
  \ 正日益成为恶意攻击者的目标 [10]。此外，由于微控制器（MCU）的局限性（例如计算能力和内存有限），实施全栈、沙箱和运行时异常检测等安全措施是不可行的 [11]。图\
  \ 7.1 显示了每个类别下四种不同级别的威胁/攻击类型，将在下文中进行解释。\n\n### 7.3.2 硬件级威胁\n\n硬件层级威胁旨在利用硬件层中的漏洞，包括以下内容：\n\
  \n1. **设备篡改：** 如果未锁定，攻击者可以通过调试端口（`SWD/JTAG`）访问存储在设备中的数据或模型。他们可以物理地修改设备，并获得对固件的读写访问。缺乏安全启动和读取保护使得攻击者能够轻松地反编译模型。带有\
  \ TinyML 系统的物联网设备中接口普遍存在的严重配置错误也显示出类似的趋势 [12]。\n\n2. **侧信道攻击：** 攻击者可以通过监控 MCU 的操作（如定时或电磁发射）从\
  \ MCU 中推断数据。通常，侧信道攻击旨在攻击加密密钥；然而，最近的研究表明，可以以类似的方式提取 ML 模型 [7]。Batin 等人的研究说明了在 TinyML\
  \ MCU Cortex-M3 芯片上通过电磁 SCA 提取神经网络（NN）架构的可行性 [13]。此外，模型的机密性可能会被破坏，通过未保护的功率迹揭露其输入和权重\
  \ [14]。\n\n3. **故障注入：** 攻击可以通过诱导故障（如时钟尖峰或激光闪烁）控制 MCU 异常运行。此类异常行为可能导致关键时刻跳过安全检查或导致模型预测下降。位翻攻击（Bit-Flip\
  \ attacks）可以通过损坏量化模型的关键权重来显著降低模型性能；这种针对性的攻击在健康监测器或智能锁等关键应用中是灾难性的 [15]。遗憾的是，由于成本限制，TinyML\
  \ 系统硬件上不存在冗余计算或安全故障检测等防御措施。\n\n### 7.3.3 软件级威胁\n\n软件攻击主要围绕 TinyML 系统的更新和内存限制。此类攻击包括：\n\
  \n1. **未经授权的模型或固件更新：** 考虑到 TinyML 设备支持远程更新并具有如 `UART` 或 `OTA` 等远程更新机制，攻击者可以尝试向设备加载受损的固件或模型。例如，可以注入带有木程序的模型以泄露敏感数据或对系统的特定输入进行错误分类。事实证明，基本的\
  \ `CRC` 检查不足以防御此类威胁，且嵌入环境缺乏任何加密签名。\n\n2. **内存损坏和代码执行：** 由于 TinyML 没有操作系统（即没有提供保护），应用程序运行大部分主要用\
  \ `C`/`C++` 编写的代码，这可能导致缓冲区溢出或固件内存漏洞等问题。攻击者可以利用这一点注入恶意代码以实现对抗目的，例如禁用模型，或者更糟糕的是，将模型用于有害活动。由于缺乏\
  \ OS 级的权限隔离和内存保护，此类威胁具有破坏性（图 7.3）。\n\n![图 7.3 TinyML 攻击面级别。返回文本。](img/Fig07_03.jpg)\n\
  \n图 7.3 TinyML 攻击面级别。返回文本。\n\n### 7.3.4 网络级威胁\n\n网络级攻击精确地利用更新期间边缘设备与中央服务器之间的通信通道。由于边缘物联网设备使用轻量级传输协议，使其在攻击面前变得很脆弱。\n\
  \n1. **窃听输出/输入：** 访问通信接口（例如无线传输或 `SPI` 总线）使得攻击能够获取敏感信息。例如，当有人在家时，窃听者可以学习 TinyML\
  \ 何时通过 `BLE` 发送报警。因此，考虑物理层安全技术至关重要，例如加密或配对。\n\n2. **重放攻击：** TinyML 系统主要使用 `LoRa`、`Zigbee`\
  \ 或 `BLE` 等低功耗无线连接传输数据。如果此类通道的加密加密很弱，这使得恶意攻击者可以拦截数据并在稍后用于重放攻击。LoRaWan 重放攻击已被证明可以使用早期的授权包绕过锁的防御\
  \ [16]。\n\n3. **中间人攻击：** 缺乏共享身份验证为攻击者在 `OTA` 更新期间注入错误值或操纵模型参数留下了空间。已证明，基于 `MQTT`\
  \ 的边缘节点的 `MitM` 攻击可以欺骗模型产生未经授权的行为 [17]。\n\n### 7.3.5 ML 特定威胁\n\n1. **数据投毒：** 攻击者可以向用于定期重训练或校准的模型注入损坏数据（例如在联邦学习设置下）。攻击者可以在收集阶段通过错误标记示例来污染训练数据。\n\
  \n2. **模型提取：** 当模型在昂贵的数据上训练并视为知识产权时，模型提取至关重要。这可以通过查询攻击（通过提供输入并监控输出）或侧信道攻击（如前所述）来实现。\n\
  \n3. **模型反转：** 模型反转是从观察到的输出重建模型输入。此类攻击已成功通过激活模式或输出 logits 从量化模型中提取训练数据 [18]。\n\n\
  4. **模型滥用或重用：** 攻击者可以使用模型表现出偏离其初衷的行为。例如，在基于摄像头的 TinyML 系统中，攻击者可以向模型输入自定义图像，以测试其是否能识别出最初训练检测范围之外的物体。因此，攻击者将其用于间谍活动\
  \ [18]。\n\n5. **对抗样本：** 精心创建的输入可以恶意输入，驱动 ML 模型产生错误的预测。通常情况下，在 TinyML 世界中，攻击者可以制作物理对抗样本。\n\
  \n\n\n\n\n由于资源限制，TinyML 系统通常缺乏针对分层威胁模型的强有力安全措施，这些模型从直接硬件攻击、软件/固件流水线不安全、网络漏洞直到特定模型的威胁不等。因此，防御策略的开发在设计时应考虑这些局限性。理解广泛的攻击面对于构建稳健的防御机制和多层防御至关重要，这包括验证固件更新、加密通信以及保护启动加载程序。图\
  \ 7.4 总结了本节关于攻击面层级（TinyML 系统的概念层）的内容。\n\n![图 7.4 沿威胁水平的 TinyML 概念层。返回文本。⏎](img/Fig07_04.jpg)\n\
  \n图 7.4 沿威胁水平的 TinyML 概念层。返回文本。⏎\n\n109 \n\n## 7.4 TinyML 应用中的隐私关注问题\n\n随着传统机器学习从云端向边缘设备迁移，这为增强数据隐私提供了机会。TinyML\
  \ 系统在设备上执行任务；因此，数据无需传输到云端，从而可能保护用户隐私。然而，它也有其独特的独特的挑战，例如用户同意管理、数据留存以及对抗机器学习带来的新兴威胁。本节将深入探讨\
  \ TinyML 的隐私影响，涵盖现实世界的场景和用例、实用的缓解技术、边缘推理以及 TinyML 与云端机器学习系统之间的主要差异。\n\n### 7.4.1\
  \ 设备侧学习与推理的隐私影响\n\nTinyML 系统在设备上进行推理，不需要像云端 AI 系统那样将数据传回中央云服务器。TinyML 相比于云端系统的优势消除了受到任何网络威胁的可能性，例如数据包嗅探、拦截或云端的中央数据泄露\
  \ [19]`。然而，这种优势很大程度上取决于设备的保护。缺乏存储加密或安全启动可能会阻碍隐私的获得。当攻击者能够物理访问 `MCU` 时，他们可以轻易提取出\
  \ `MCU` 中存储的数据 [20,21]。此外，由于 TinyML 是离线训练的，工程师在这种情况下优先考虑推理隐私。然而，在训练期间，会收集数据，除非使用联邦学习（终端用户在本地存储数据并仍对模型训练做出贡献）或持续学习，否则会破坏隐私。即便如此，在缺乏强保护的情况下，特别是在使用不安全的\
  \ API 或蓝牙低功耗 (`BLE`) 连接时，模型反演（即推理结果）仍可能泄漏数据和敏感信息。\n\n### 7.4.2 案例研究：现实世界 TinyML\
  \ 应用中的隐私\n\nTinyML 帮助在多个现实世界的案例和应用中维护隐私，范围从医疗领域到安全和智能家居。\n\n1.  **监控与智能摄像头：** TinyML\
  \ 模型被部署在多个监控应用系统中，用于脸识别、运动检测和异常运动分类 [21]`。例如，监控安全摄像头在检测到可疑运动（例如“检测到人类”）时发送警报而非原始视频数据，从而保护了隐私。此类系统通过本地数据处理最小化了隐私风险并降低了延迟。\n\
  \n2.  **健康监测可穿设备：** TinyML 部署在智能手表和健身带等多个健康可穿设备上。它们分析用户的健康信息，如 ECG 信号和血氧值。除非显式共享，否则数据仅存在设备上\
  \ [22]`。例如，公司已将本地跌倒检测和心律不齐模型整合到其健康可穿设备中，符合隐私保护原则。\n\n3.  **智能家居与语音界面：** 带有语音助手的智能家居使用\
  \ TinyML 进行本地唤醒词检测，如“Hey Google”，这避免了录制音频和通过网络传输数据的需求。这解决了关于语音助手隐私的长期争论 [23]`。\n\
  \nTinyML 在这些案例中保护了隐私；但已经证明，对于薄弱且未保护的边缘模型，攻击者可以利用反向工程来暴露检测阈值，更糟糕的是，利用输出来学习用户在摄像头上的行为模式和常规\
  \ [24]`。研究人员发现，使用对抗音频模式可以激活语音助手并误导其产生错误行为，证明了即使是本地推理也不总是足以防止滥用的。用户对这些设备的意识以及对允许共享内容的控制，对于保护他们的隐私至关重要。\n\
  \n### 7.4.3 TinyML 中的差分隐私与联邦学习\n\n为了隐藏训练过程中使用的示例细节，差分隐私 (DP) 确保输出不会泄露信息。然而，从计算成本的角度来看，在\
  \ `MCU` 上实现这种技术是不可行的，因为在输出中引入噪声并对其裁剪会产生额外的开销，特别是在低资源的边缘设备上 [25]`。一种可行的方法，例如引入整数噪声的\
  \ $\\epsilon$-本地 DP，是一种极具前景的探索，且尚处于早期阶段，准确来说是在基于传感器的系统领域。另一种方法是联邦学习 (FL)，它是非常适合\
  \ TinyML 环境本质的方法。在 FL 中，多个设备协作在本地数据上训练全局模型，并仅与聚合服务器交换模型参数，如图 7.5 所示 C_009_c7.xhtml#f7_5\
  \ 所示 [26]`。因此，数据不会离开设备，隐私得到了维护。事实证明，安全聚合和差分隐私的结合即使在数百万参与者中也能有效维护用户隐私。[图 7.5 IoT\
  \ 环境下的 TinyML 联邦学习模型 [26]。返回文本。⏎](images/Fig07_05.jpg)\n\n图 7.5 IoT 环境下的 TinyML\
  \ 联邦学习模型 [26]`。\n\n111 传统 FL 对 TinyML 的适配必须克服通信和能量挑战。诸如 Flight [27]` 项目通过启发式参与者提高了效率，为\
  \ Cortex-M 等低功耗边缘设备上的联邦学习铺平了道路。然而，FL 并非完全免受隐私攻击；它容易受到梯度反演攻击，攻击者可以通过模型的共享更新提取训练数据示例\
  \ [28]`。此外，恶意参与者或设备可能会通过数据投毒攻击参与污染更新，或者由于获取了全局模型更新而进行模型反演攻击 [29]`。\n\n### 7.4.4\
  \ 数据留存、匿名化与用户同意\n\n与云端 AI 系统不同，TinyML 系统在用户数据收集和存储方面没有标准或清晰的协议。虽然许多设备只会在其缓冲区中临时存储数据，并在稍后丢弃。用户界面的缺失限制了用户控制设备数据行为的能力。例如，可穿戴健康设备可能会在未经用户事先同意的情况下，将用户运动数据存储几天甚至几周用于趋势分析。\n\
  \n\n\n\n\n另一个挑战是匿名化。由于 TinyML 中的数据获取和丢弃非常快速，实施 `k-anonymity` 或 `I-diversity` 等匿名化技术往往难以可行。尽管如此，一种可行的方法是数据最小化——即仅收集对准确推理至关的数据。大多数嵌入式系统受限，甚至缺乏与用户交互的屏幕。因此，用户可能无法了解其隐私条款甚至接受它们。一种提出的解决方案是启用物理交互（例如按钮）或与智能手机配对以与\
  \ TinyML 设备`[30]`。这仍然是一个灰色地带，对于交互有限的用户实现有意义的知情同意是非常具有挑战性的。\n\n## 7.4.5 TinyML 与云端\
  \ AI 隐私对比\n\nTinyML 通过本地数据处理固有改进了用户隐私。然而，这带来了权衡。AI 系统是否能提供中心化治理、成熟的访问控制以及对全球标准的合规性，例如《健康保险与责任法案》（`HIPAA`）`[31]`和《通用数据保护条例》（`GDPR`）`[32]`？尽管如此，中心化系统在传输过程中会暴露数据，并容易受到破解和内部威胁`[33]`。另一方面，TinyML\
  \ 避开了中心化的数据聚合，但缺乏三个主要的隐私措施：正式隐私保护、安全密钥管理和日志审计。当边缘设备受到攻击时，会产生额外的威胁；本地数据容易被提取。`图 7.6`\
  \ 显示了 TinyML 与云端 AI 的对比。\n\n![图 7.6 TinyML 与云端 AI 隐私特征对比。返回文本。⏎](img/Fig07_06.jpg)\n\
  \n图 7.6 TinyML 与云端 AI 隐私特征对比。返回文本。⏎\n\n112\n\n## 7.5 TinyML 的轻量级加密与安全协议\n\n随着 TinyML\
  \ 系统在医疗保健等关键敏感敏感环境中使用的增长，使用基于加密的安全机制来确保安全性至关重要。然而，传统的加密协议在 TinyML 的严苛条件下不可行：有限的\
  \ `RAM`、无硬件加速、低功耗以及实时性。本节概述了轻量级加密协议、其挑战、相关国际标准以及用于安全 TinyML 系统的高效协议。\n\n### 7.5.1\
  \ 小型设备中的加密限制\n\n通常，TinyML 系统运行在如 `RISC-V` 或 `Arm Cortex-M` 内的微控制器（`MCUs`）上，它们的计算能力有限——其\
  \ `RAM` 和闪存通常在几十到数百千字节之间。此类设备没有标准的加密硬件加速或指令集；因此，在这些 `MCUs` 上运行标准算法（例如 `AES-256`、`RSA2048`\
  \ 或 `SHA-512`）是不可行的，因为它们对计算和内存要求很高。例如，标准的 `AES-128` 需要 `3 KB` 的 ROM 并且需要 `> 3 KB`\
  \ 的内存占用`[34]`。此外，效率是另一个限制，通常需要低周期数的算法来保持电池寿命。\n\n### 7.5.2 轻量级加密标准：NIST 和 ISO\n\n\
  随着对轻量级加密需求的兴起，出现了以下标准：\n\n- **NIST 竞赛：** 关联数据认证加密（`AEAD`）的最终获者是 `ASCON`，它在 23 年被选中，因为它在安全性、速度和性能之间取得了平衡`[36]`。\n\
  - **ISO/IEC 29192：** 该标准为资源受限设备概述了 `CLEFIA`、`PRESENT` 以及各种哈函数`[37]`。\n\n### 7.5.3\
  \ 对称加密：SPECK, SIMON 和 ASCON\n\nTinyML 的对称加密选项包括：\n\n- **SPECK** 和 **SIMON**：由美国国家安全局（NSA）开发的轻量级密码算法。`SPECK`\
  \ 在 `MCUs` 上每个字节大约需要 `65` 个周期`[38]`，而 `SIMON` 每个字节需要 `75` 个周期`[39]`。\n- **ASCON**：一种同时用于加密和\
  \ `AEAD` 的通用算法。\n\n#### 表 7.2 轻量级加密算法对比\n\n| 密码算法 | 类型 | 加密速度（周期/字节） | 代码大小（字节）\
  \ | 安全备注 |\n| :--- | :--- | :--- | :--- | :--- |\n| ASCON | 认证型 AEAD | 110 | 2500\
  \ | NIST 获者 (2023) |\n| SPECK | 块加密 | 65 | 1500–2000 | 极高效；未广泛使用 |\n| SIMON | 块加密\
  \ | 75 | 2000–2500 | 硬件优化；未广泛使用 |\n| AES-128 | 块加密 | 240 | 3000–5000 | 稳健；需要硬件加速\
  \ |\n\n### 7.5.4 轻量级认证：MAC 和哈希签名\n\nTinyML 系统依赖以下技术来实现消息完整性和认证：\n\n- **消息认证码（MACs）**：基于哈希的消息认证码（`HMAC`）和\
  \ `SHA-256` 是常用的；替代的高效方案是针对 `MCUs` 的 `LightMAC` 和 `Chaskey``[40]`。\n- **哈希签名**：后量子安全的无状态选项（如\
  \ `SPINCS+`）仍在研究中，尚未成熟到可以部署。\n\n对于非对称加密，`Curve25519` 和 `Ed25519` 等曲线提供了更好的优势，如较小的密钥和更快的操作，尽管它们在超低功耗设备上计算负担较大`[41]`。\n\
  \n### 7.5.5 安全启动与固件更新机制\n\nTinyML 设备中的固件和模型更新是通过空中（`OTA`）传输的，除非经过加密和加密验证，否则会面临威胁。\n\
  \n- **固件认证与完整性**：结构化的固件元数据连同加密哈希和公钥验证，可以使用 `IETF SUIT` 和 `NIST SP 800-193` 进行。Arm\
  \ 的 `TF-M` 或 `STM32Cube` 是一种集成了安全更新技术的轻量级实现。\n\n\n\n\n\n- **安全启动（Secure Boot）：**\
  \ 它保证在启动过程中仅执行经过签名的固件。信任链的建立始于只读引导加载程序，该加载程序在加载固件镜像之前，使用 `EdDSA` 或 `ECDSA` 验证其签名。\n\
  \n尽管安全启动提供了安全性，但它也带来了自身的开销，例如闪存存储需求增加了约 3–5 KB，并且需要安全的公钥存储空间；通常情况下，工程师可以使用一次性可编程（OTP）内存。\n\
  \n### 7.5.6 资源受限环境下的密钥管理\n\nTinyML 使用密钥进行身份验证、加密和更新验证。因此，密钥管理是 TinyML 系统安全挑战之一。确保密钥分发和安全的常用方法包括：\n\
  \n- **可信执行环境（TEE）：** 某些 MCU（例如带有 `TrustZone` 的 `ARM Cortex-M33`）在隔离的内存区域安全地存储密钥。然而，它们并非总是可行或受支持。\n\
  - **密钥派生函数（KDFs）：** KDF 使用主密钥和随机数（nonces）来派生每个会话密钥。轻量级 KDF（例如 `HKDF-SHA256`）被用于传输层安全（TLS）中的紧凑实现，如\
  \ `mbedTLS` 或 `TinyDTLS` [42]。\n- **预共享密钥（PSKs）：** 此类密钥在制造过程中硬编码到 MCU 中。它们虽然简单，但容易受到攻击，且缺乏可扩展性。\n\
  - **物理不可克隆函数（PUFs）：** 一种新兴的硬件方法，可以创建唯一且设备特定的密钥，而无需将其存储。虽然 PUF 对于 TinyML 设备非常理想，但它们目前仍处于标准化阶段\
  \ [43]。\n\n为了保证安全性，应在可行的地方实施密钥轮换和撤销。然而，这些做法很少被执行，特别是在资源受限的设备上。总之，旨在解决 TinyML 安全问题的加密解决方案不仅需要考虑安全性，还需要考虑效率和资源限制。本节讨论了最新标准如\
  \ `ISO/IEC 29192` 和 `NIST` 的 `ASCON` 如何概述了边缘设备环境中身份验证、加密和固件更新的可行方法。基本的安全方法，包括 `MACs`、密钥管理方法和安全启动协议，为\
  \ TinyML 系统构建了强大的防御框架。未来前景景广阔的方法（包括 `TEE`、抗量子算法和基于硬件的安全技术）将在 TinyML 严苛的限制下进一步提高保护水平。\n\
  \n### 7.6 适用于 TinyML 的隐私保护与安全机器学习技术\n\nTinyML 的主要目的是将机器学习的能力从以云为中心转移到网络边缘的设备。然而，将\
  \ AI 模型传输到边缘设备会引入新的隐私和风险威胁。如果模型被破解、被盗或通过对抗性推理被滥用，即使它没有发送到云端，敏感信息也可能泄露。本节深入探讨了提高\
  \ TinyML 模型完整性、隐私性和机密性的实用方法和框架。探索了推理隐私保护、隐私保护技术和安全部署流程。\n\n### 7.6.1 安全模型部署\n\n\
  模型部署到边缘设备会产生多种风险，包括：模型反转或克隆，攻击者可以通过与模型交互并从其输出逻辑值（logit）中学习信息，从而复制模型或获取训练期间使用的敏感数据；知识产权（IP）泄露，攻击者提取模型二进制文件或对其进行逆向工程；最后是模型篡改，攻击者在部署之前或之后篡改模型权重。提供针对此类攻击的保护或至少缓解这些攻击是关重要的。工程师使用加密模型存储结合安全启动方法来缓解此类风险。必须在闪存内存中加密格式部署模型，并将密钥保留在保护的存储器中（例如\
  \ `OTP` 内存），或通过安全元件派生加密密钥。此类技术包括：\n\n- 带有硬件加速的 `AES-128`（例如用于 `STM32Trust` 等平台）\n\
  - **模型混淆（Model Obfuscation）：** 通过隐藏模型权重、层级或结构来防止逆向工程。\n\n如 `TensorFlow Lite for\
  \ Microcontrollers` (`TFLM`) 这样的框架能够将模型转换为 `C` 数组，这些数组在开发周期中的编译阶段会被加密并签名。当将其与任何安全引导加载程序（例如\
  \ `STM32 Secure Boot` 或 ARM 的 `TFM`）结合时，可以确保只有可信且真实的模型会被加载和执行。\n\n### 7.6.2 保护推理隐私\n\
  \n尽管 TinyML 在设备上运行，但输出可能会泄露敏感信息。例如，如果 `BLE` 消息被攻击者拦截，他们就可以推断出活动。方法包括：\n\n- **安全\
  \ I/O：** 为了减少泄漏，可以对输出进行加密 [44]。\n- 如 `Edge Impulse` 等保护框架提供安全推理，但会降低输出的粒度 [45]。\n\
  \n### 7.6.3 同态加密 (HE) 在 TinyML 中的可行性\n\n从理论上讲，同态加密 (`HE`) 使 TinyML 加密输入数据并提供加密输出——原始数据不会被暴露。然而，这些收益伴随着固有的权衡：\n\
  \n- **计算时间长：** 在普通 CPU 上处理 `HE` 加密数据以推断任何内容可能需要几秒到几分钟；因此它们在 `MCUs` 上是不切行的 [46]。\n\
  - **高内存消耗：** `HE` 方案（例如 `BFV` 或 `CKKS`）需要兆兆级的 RAM，这对于 `TinyML` 而言是不可行的 [47]。\n\n\
  虽然现有的 `HE` 方案如 `Helib`、`HEAAN` 或 `Microsoft SEAL` 在实时 TinyML 系统上的实现计算量巨大，但研究正在研究加密近似方案和硬件加速，以便\
  \ `HE` 运行在 32 位嵌入式系统中。尽管 `HE` 对于 TinyML 尚不可行，但部分（例如加密数据卸载和边缘辅助计算的混合方法）可能会随着内存和计算能力的提升而进步。\n\
  \n### 7.6.4 资源受限设备上的联邦学习\n\n在联邦学习 (`FL`) 中，多个参与者的设备协作训练一个全局模型，该模型由中央服务器共享并在本地设备和数据上进行训练。通过多个轮迭代，边缘设备训练模型并与中央聚合器共享更新以再次形成模型。在\
  \ TinyML 的背景下，这可以保护隐私，因为数据不会离开设备。然而，传统的 `FL` 实现（例如 `TensorFlow Federated` 或 `PyTorch`）对于边缘设备来说计算负担过重。现在有了其他适配方案可以在\
  \ `MCUs` 上运行 `FL`：\n\n- **FedML Lite：** 一个开源框架，可在 `MCUs` 训练期间实现梯度稀疏化和内存感知。\n- **TensorFlow\
  \ Lite FL：** 为边缘设备实现了内存映射张量和量化训练。\n- **基于 Edge TPU/Google Coral FL：** 适用于具有较高计算预算（例如\
  \ 1–2 GB RAM）的设备的联邦任务，不适用于 TinyML `MCUs`。\n\n\n\n\n- 尽管如此，主要的挑战仍然是通信成本和安全风险，因为 `FL`\
  \ 要求在每一轮中都传输模型更新，这在 `BLE` 或 `LPWAN` 上可能是不切行的。此外，更新容易受到恶意客户端的投毒。尽管存在这些风险，`FL` 仍然是\
  \ TinyML 隐私保护的一种很有前景且可扩展的方法。\n\n#### 7.6.5 边缘端的差分隐私\n\n差分隐私 (`DP`) 在数学上确保了任何单个数据点的存在或其排除都不会影响模型的输出。对于边缘设备，可以通过两种方式实现本地差分隐私\
  \ (`LDP`)：第一，向模型梯度添加微小噪声；其次，对模型输出进行扰动以保护用户数据 [48]。这种方法使工程师能够使用 `ε`（epsilon）在所需的准确性和隐私性之间取得平衡。此外，还有几种适用于\
  \ `MCUs` 的轻量级方案，例如整数拉普拉斯噪声、随机响应和稀疏向量技术。边缘设备已经在相应的库（例如 `PySyft` 和 `TFF Lite`）中提供了实现，尽管原生的\
  \ `MCU` 仍在进化以支持此类技术。\n\n#### 7.6.6 案例研究与实现\n\n一些实现方案和真实平台正在改进 TinyML 的隐私保护。这些平台包括\
  \ `TensorFlow Lite for Microcontrollers` (`TFLM`)、`Edge Impulse`、`STM32 TrustZone`\
  \ 以及 `PrivateFL` `PySyft`。表 7.3 重点介绍了四个提供生产级解决方案、加密模型部署等四个领先平台。这些框架说明了硬件兼容性、计算开销和隐私保障之间的权衡。\n\
  \n表 7.3 隐私保护案例研究与框架 返回文本。⏎\n\n| 平台 | 隐私/安全特性 | 硬件兼容性 | 开发状态 | 关键用例 |\n| --- | ---\
  \ | --- | --- | --- |\n| `TensorFlow Lite for Microcontrollers` (`TFLM`) | <ul><li>C\
  \ 语言模型加密数组</li><li>内存隔离 (`Cortex-M33/M35P`)</li><li>用于数据保护的 Flash 存储加密</li></ul>\
  \ | `ARM Cortex-M`, `ESP32`, `RISC-V` 59 | 生产绪（Google 维护） | TinyML 设备要求加密模型部署 |\n\
  | `Edge Impulse` | <ul><li>抑制原始 Logits/概率</li><li>传感器数据匿名化</li><li>使用 `EON Compiler`\
  \ 优化 RAM/Flash</li></ul> | 跨平台 (`MCUs`, `Linux`, `Coral Edge TPU`) | 商业（高通支持） |\
  \ 隐私敏感型 TinyML 应用的快速原型开发 |\n| `STM32 TrustZone`/`TrustCube-AI` | <ul><li>基于 `Arm\
  \ TrustZone` 的内存保护 (`Cortex-M33/M35P`)</li><li>通过加密签名验证固件更新</li><li>加密 Flash 存储\
  \ (`AES-256`)</li></ul> | `STM32 MCUs` (例如 `WBA`, `MPU` 系列) | 生产就绪（意法半导体） | 需要安全启动的工业/医疗\
  \ TinyML 设备 |\n| `PrivateFL`/`PySyft` 模拟器 | <ul><li>在 `FL` 上模拟带差分隐私 `DP`</li><li>探索性\
  \ `HE` 研究</li></ul> | `RP2040`, `Cortex-M0+`（模拟） | 研究级（OpenMined） | 联邦 TinyML 的研究原型开发\
  \ |\n\n总之，TinyML 系统中的隐私保护方法对于保护用户数据和模型完整性至关重要，特别是在医疗保健、家庭或工业等数据敏感的部署环境中。虽然像 `HE`\
  \ 这样的高级加密技术对于大多数边缘设备来说仍然不切实际，但如模型部署加密、`FL` 和 `DP` 等实用技术已应用于真实的 TinyML 系统中。图 7.7\
  \ 显示了 TinyML 中的各种隐私保护技术。\n\n![图 7.7 TinyML 隐私保护技术对比。返回文本。⏎](img/Fig07_07.jpg)\n\n\
  图 7.7 TinyML 隐私保护技术对比。返回文本。⏎\n\n选择合适的技术需要在性能、通信预算和内存预算之间取得平衡。之前的研究总结并比较了各种隐私保护技术及其资源开销，以及框架实现。\n\
  \n## 7.7 安全的 TinyML 框架、工具链与案例研究\n\n随着 TinyML 在各种现实应用中的应用不断扩大，必须确保通过在该生命周期期间使用的框架和工具链来确保这些应用生命周期阶段的安全。TinyML\
  \ 的每个生命周期阶段，从模型训练、编译到固件闪存和运行时的推理，都有其独特的挑战性风险。本节概述了常用的 TinyML 开发平台和框架，探索了它们提供的功能，并展示了从可穿戴设备、智能农业到医疗领域和工业物联网等各种实际应用中学的教训。\n\
  \n### 7.7.1 安全的 TinyML 框架与工具链\n\n`Edge Impulse` 是一个广泛应用于多个领域的端到端 TinyML 平台；它为 `MCUs`\
  \ 提供信号处理、模型训练、部署和测试。它实现了多项安全特性，包括：首先是安全摄取，用户数据按项目保持隔离；其次是在传输过程中进行加密（TLS）；第三是通过数字签名在编译期间确保固件完整性；第四是内置隐私控制，可以排除用户数据采集或禁用云同步。`Edge\
  \ Impulse` 通过 `Wi-Fi` 或蓝牙提供安全的空中更新 (`OTA`)。\n\n`TensorFlow Lite for Microcontrollers`\
  \ (`TFLM`) 是一种为低功耗边缘设备（例如 `Arm Cortex-M`）设计的轻量级框架。该框架为构建和部署提供了安全功能：\n\n- **模型加密**：`TFLM`\
  \ 支持在运行时使用对称密钥对编译后的模型（C 数组二进制文件）进行加密和解密。\n- **硬件抽象**：通过外部库集成加密处理器和 `TrustZone`。\n\
  - **更小的攻击面**：较小的代码量减少了攻击面，并便于与安全实时操作系统 (`RTOS`) 集成。\n\n尽管 `TFLM` 没有内置用于签名验证或 `OTA`\
  \ 功能，但它通常与 `TF-M`、`STM32Cube` 或 `MCUboot` 等安全引导加载程序结合。\n\n`STM32Cube.AI` 是为 `STM32`\
  \ 边缘设备的 TinyML 部署提供的商业级工具链。它通过 `STM32Trust` 管理安全，利用 `TrustZone-M` 进行内存分区、Flash 和\
  \ `SRAM` 区域加密，并通过 `PKI` 进行更新签名验证。\n\n它为部署到安全内存区域的模型提供了启动性验证，并针对运行时攻击或物理篡改提供了保护。\n\
  \n\n\n\n1.  **工业物联网（预测性维护）：** 在工业领域，机器振动在安全流程和螺栓连接部件松动中起着至关重要的作用。对这些机器进行定期检查以进行任何必要的维护至关重要。德国工业巨头西门子在旋转设备上实施了振动检测\
  \ TinyML。该系统利用了 `STM32Cube.AI` 和 `Edge Impulse`，并通过 `Wi-Fi OTA` 分发经过加密签名的固件。如果签名模型验证失败，系统将立即通知负责的工程师，保护系统免加载任何被篡改的固件\
  \ [49,50]]。\n\n2.  **智能农业：** 面对水资源稀缺和气候变化，智能农业可以帮助自动化灌溉，以获得更好的作物并降低耗。为了应对这些农业挑战，部署了\
  \ TinyML 系统用于植物监测和灌溉自动化。使用 `Wio Terminal Microcontroller`、传感器（例如土壤水分、温度、湿度和光照）以及经过\
  \ `Edge Impulse` 训练的模型在本地进行实时决策。通过在本地处理收集的数据并做出决策，该系统维护了隐私和安全，并为低成本可持续的智能农业提供了一个可行的模型\
  \ [51]]。\n\n3.  **医疗监测：** 研究人员通过使用 `Edge Impulse` 开发模型，开发了一种支持 TinyML 的咳嗽检测系统。该系统会分析咳嗽声和一般的干扰信号。该系统实现了\
  \ 97% 的准确率。通过对数据进行本地分析且不访问互联网，该系统保证了用户的隐私并确保了患者的匿名性 [52]]。\n\n### 7.7.4 现实部署的教训\n\
  \n根据目前 TinyML 的实施及其在现实世界的隐私保护、安全和优化技术，为进一步的改进和设计增强带来了有益的见解：\n\n*   122 签名模型更新和安全引导加载程序的必要性。\n\
  *   可以使用模型加密和混淆来防止知识产权盗窃和反向工程。\n*   在 `OTA` 固件分发期间必须执行数字签名检查，特别是在大规模部署中。\n*   在数据关键和受监管的领域（如医疗健康和可穿戴设备），隐私数据日志和最小化对于隐私是至关重要的，而非可选的。\n\
  *   对于实时防御，集成 TinyML 安全框架和硬件安全特性至关重要。\n\n总而言之，确保 TinyML 的安全不仅仅是模型加密——它还需要一个持续的验证机制、一个安全的工具链和一个可信的部署操作。在安全的部署格局中，现有工具（例如\
  \ `Edge Impulse`、`TensorFlow Lite Micro` 和 `STM32Cube.AI`）的互补结合确保了安全的 TinyML 开发。现实世界的案例研究强调了从开发到部署集成安全和隐私功能的重要性，以便开发出稳健、安全的\
  \ TinyML 系统，这些系统正是专门为医疗领域等敏感应用而构建的。随着 TinyML 部署扩展到涵盖更多敏感和更大规模的应用，“安全设计（security-by-design）”框架的适配对于这些系统的安全、信任、合规性以及整体成功变得至关重要。\n\
  \n## 7.8 设计指南与最佳实践\n\nTinyML 的安全和隐私是一个整体的、主动的过程，将风险缓解集成到设计和实现中。由于其局限性，传统的安全模型可以直接应用于\
  \ TinyML。本节提供了跨越 TinyML 相关领域——设计、隐私评估、威胁建模、编码和评估——的最佳实践大纲。\n\n### 7.8.1 TinyML 的设计安全即安全\n\
  \n根据 NIST 的 `SP 800-160`（这是一份系统安全出版物），在项目初始阶段纳入保护技术可以确保系统的安全生产。在整个 TinyML 系统开发过程中实施保护措施可以确保风险降至最低，这种原则被称为“设计安全即安全”。该原则通过以下方式实现：\n\
  \n*   **可信固件和安全启动：** 只有经过认证的代码才能被加载和执行。`Arm Trust Firmware-M (TF-M)` 和 `STM32Trust`\
  \ 是这种实践的两个示例。\n*   **最小攻击面：** 部署后，工程师可以禁用未使用的外设、调试端口和默认无线接口。\n*   **模型保护：** 确保模型经过加密和验证，使其对反向工程或注入攻击免疫。具体而言，当模型处于\
  \ `C array` 格式时（如 `TensorFlow Lite Micro (TFLM)`）。\n\n123 此外，内存保护单元 (`MPUs`) 以及物理防篡改检测也应纳入安全设计中，特别是在安全关键的部署应用。\n\
  \n### 7.8.2 TinyML 流线中的威胁建模和风险评估\n\n威胁建模是在部署前对潜在风险进行识别和缓解的过程。为了应对独特的 TinyML 威胁和挑战，可以\
  \ `STRIDE`（欺骗、篡改、否认、信息泄露、拒绝服务、权限提升）为此此目的进行定制。可以使用 `OWASP Threat Dragon` 或 `Microsoft\
  \ Threat Modeling Tool` 等工具评估威胁发生的概率和影响，在这些工具中可以将数据流可视化并评估任何风险的暴露点；它可以部署用于嵌入式系统。主要的\
  \ TinyML 系统组件及其威胁暴露情况，以及图 7.9 所示的缓解措施。\n\n![Figure 7.9 TinyML 流线的威胁建模和缓解。返回文本。⏎](img/Fig07_09.jpg)\n\
  \n图 7.9 TinyML 流线的威胁建模和缓解。返回文本。⏎\n\n### 7.8.3 设备侧 ML 的隐私影响评估 (PIAs)\n\n为了遵守全球数据隐私法规（如\
  \ `GDPR` 和 `HIPAA`），必须对个人数据处理进行主动评估和澄清。执行隐私影响评估 (`PIA`) 有助于识别风险并评估缓解方法。TinyML 系统中\
  \ `PIA` 的重点应该是用户控制、数据最小化、存储和保留以及推理透明度。\n\n隐私建模框架如 `LINDDUN`（关联性、识别性、不可否认、可检测、信息披露、感知、不合规）可用于\
  \ ML 系统的风险评估。图 7.10 展示了分为两个主要空间的隐私建模：问题和解决方案 [53]]。\n\n![Figure 7.10 基于 LINDDUN\
  \ 的隐私建模框架分为问题和解决方案 [53]。返回文本。⏎](images/Fig07_10.jpg)\n\n图 7.10 基于 LINDDUN 的隐私建模框架分为问题和解决方案\
  \ [53]]。\n\n124 \n\n### 7.8.4 安全编码与部署原则\n\n由于 `C`/`C++` 是 TinyML 应用中主要使用的编程语言，它们容易出现登录漏洞和内存错误。在与\
  \ ML 推理交互时，应采用安全编码标准，此类框架有 `CERT C` 和 `MISRA C`。程序员应尽量在 `MCUs` 上避免动态内存分配（`free`、`malloc`），并在任何输入处理之前检查设备边界。此外，他们可以通过确定性控制流和固定大小数组来减少侧信道泄露。\n\
  \n部署中进一步增强保护的安全措施还：禁用不安全的更新通道（如 `USB 存储器闪存`）、在设备支持的情况下对模型二进制文件进行加密（例如 `AES-128`\
  \ 或 `ASCON`），以及部署固件签名和安全启动措施（例如 `MCUboot`）。\n\n\n\n\n\n### 7.8.5 安全与隐私评估指标\n\n为了衡量安全和隐私的增强效果，TinyML\
  \ 有多种指标可以评估其改进情况，包括攻击面大小、模型鲁棒性等。此前的研究强调了一些关键指标。标准化的安全与隐私基准测试工具仍是研究前沿；然而，`MLPerf`\
  \ 和 `EdgeBench` 是两个性能指标项目，提供了如 `latency` 延迟和 `accuracy` 这样的指标。图 7.11 展示了 TinyML\
  \ 的关键评估指标。\n\n![图 7.11 TinyML 安全与隐私评估指标。返回正文。⏎](img/Fig07_11.jpg)\n\n图 7.11 TinyML\
  \ 安全与隐私评估指标。返回正文。⏎\n\n## 7.9 研究挑战与未来方向\n\n通过 TinyML，人工智能边界正在扩展到低功耗边缘设备。TinyML 将学习和推理都带到了边缘端。然而，在资源受限的边缘环境中开发强大的安全和隐私实践，在操作和技术上都是具有挑战性的。本节概述了学术界和工业的前沿研究问题以及新兴机会。\n\
  \n### 7.9.1 准确性、安全性与资源消耗之间的权衡\n\nTinyML 系统在安全/隐私保障、设备资源限制和模型准确性之间存在三者权衡。像 `CNN`\
  \ 或深度神经网络（`DNNs`）的大模型提供了更高的准确性；然而，它们需要更大的内存和计算能力，使得无法在 `RAM <256 KB` 的边缘设备上运行。此外，模型加密和差分隐私的部署加剧了这种局面，因为它增加了对功耗和资源的需求\
  \ [54,55]]。模型尺寸缩减技术（如 `quantization` 量化或 `pruning` 剪枝）证明可以减少模型尺寸，但如果不仔细调优，可能会以高达\
  \ 10% 的准确性下降为代价 [55]。此外，引入差分隐私会降低模型的保真度，特别是在嵌入式系统的小型数据集上。\n\n### 7.9.2 安全模型压缩与量化的进展\n\
  \n由于 TinyML 的目标是适配小型存储并在受限的 `RAM` 中运行，研究正聚焦于模型压缩方法，这些方法在减少尺寸和攻击面的同时保持高性能。此类技术包括\
  \ `integer quantization` 整数量化（例如 `int8`），它由 `TensorFlow Lite` 支持并消除了浮点单元。另一种技术是\
  \ `pruning` 剪枝，在选择性地丢弃某些模型权重的同时，仍能抵抗 `backdoor` 后门或 `adversarial` 对抗等攻击。然而，在模型参数暴露的情况下，现有的几种压缩技术容易受到攻击（例如\
  \ `model inversion` 模型反转或 `extraction` 提取）。提出了一种隐私优先的模型设计方法，例如加密感知神经架构搜索（`NAS`），用于设计具有更少泄漏向量的模型\
  \ [56]。\n\n126 \n\n### 7.9.3 TinyML 中后量子密码学的未来\n\n随着量子计算的进步，传统的加密方案（如 `RSA`、`ECC`）变得脆弱。美国国立标准技术研究院（NIST）启动了后量子密码（`PQC`）标准化任务，选定了\
  \ `CRYSTALS-Kyber` 和 `SPHINCS+` 为决赛算法。PQC 方案面临若干挑战，包括高 `RAM` 要求和代码空间（通常 `>20 KB`）；此外，它们严重依赖\
  \ `MCUs` 上昂贵的操作（如基于格的数学）。初步试验表明，`CRYSTALS-Kyber-512` 可以在 `ESP32` 上运行，为 `AES` 和 `SHA`\
  \ 提供硬件加速 [57]。然而，对于用于大多数物联网标签和可穿戴设备的 8 位 `MCUs` 来说，这仍然是不现实的\n\n### 7.9.4 真实环境下的隐私与安全评估\n\
  \nTinyML 的安全性是在受控模拟中评估的，而不是真实环境中。然而，部署在真实场景中的设备面临着不确定因素，如物理篡改风险、温度和电压波动以及 `OTA`\
  \ 更新的不可靠连接。`EdgeBench` 和 `MLPerf Tiny` 提供了 `latency` 和 `accuracy` 基准测试工具 [58]，但针对攻击的标准隐私和安全基准（例如\
  \ `side-channel leakage` 侧道泄漏、`model inversion resistance` 模型反转抗、`adversarial robustness`\
  \ 对抗鲁棒性）仍然匮乏\n\n### 7.9.5 跨学科机会\n\nTinyML 安全不是一个人的工作。它需要所有相关方的协作：`MCUs` 工程师、`ML`\
  \ 研究人员和人机交互（`HCI`）专家。通过协作，`MCUs` 工程师负责 `bootloaders` 安全设计、`memory isolation` 内存隔离和低功耗\
  \ `crypto` 加密；而对抗攻击的模型架构是 `ML` 研究人员的工作；最后，`HCI` 专家可以为没有屏幕或按钮的边缘设备开发接口方法，满足用户隐私交互的需求。新兴挑战和机会包括在\
  \ `MCUs` 上开发模型审计和可解释性 [59]，以及用于带信任评分 TinyML 训练的 `Tiny federated learning` 联邦学习 [60]。这些跨学科机会连接了\
  \ AI 安全、隐私法和 `MCUs` 领域。虽然 TinyML 开启的机会令人兴奋且前景广阔，但大规模系统的安全面临着跨学科的新挑战。未来的研究必须在隐私、准确性、性能与资源限制之间的差距，并能够符合现实法规。随着边缘智能在日常\
  \ TinyML 系统中普及，设计隐私和信任对于长期成功至关重要。\n\n## 7.10 结论与总结\n\n微机器学习（TinyML）将人工智能的边界从云端扩展到了网络边缘。这在健康监测、工业自动化\
  \ 127 以及智能农业和家居等领域创造了新一代智能响应系统。这种扩展得益于将优化 `ML` 部署到 `MCUs` 中，消除了对云基础设施的需求，并降低了功耗、延迟和带宽使用。\n\
  \n由于 TinyML 实现了重大的边缘 AI，其固有的分布式特性带来了严峻的安全和隐私挑战。与传统的云端 ML 系统不同，TinyML 设备没有内置隔离、大存储或持续的网络连接——这些限制使得边缘设备容易受到攻击和滥用，需要主动的防护和保护。本章提供了\
  \ TinyML 安全相关原则的基础概述，例如安全设计、威胁建模框架（如 `STRIDE` 和 `LINDDUN`）以及如数据最小化和本地推理等架构隐私措施 [61]。内存受限设备中的固件安全和知识产权保护可以使用轻量级加密机制（如\
  \ `ASCON`）以及使用 `TensorFlow Lite Micro` 和 `STM32Cube.AI` 等工具进行模型块加密来保护。此外，可扩展的分层防御机制（如\
  \ `federated learning` 联邦学习和 `differential privacy` 差分隐私）为边缘设备提供了具有前景的隐私保护和数据机密性保障\
  \ [62]。\n\n\n\n\n\n多个真实世界的用例（包括使用 `Google Coral` 和 `STMicroelectronics` 套件进行设备端语音识别以及用于预测性维护的设备）说明了规模化\
  \ TinyML 安全的可行性。尽管如此，TinyML 安全评估应该超越延迟和准确率，扩展到使用标准化指标评估针对对抗性攻击、隐私泄露和模型真实性的系统鲁棒性\
  \ [58]。然而，在 8 位和 32 位 `MCUs` 上部署某些技术（如后量子密码学）仍然存在挑战，而且缺乏对应 `MLPerf Tiny` 的标准安全和隐私基准阻碍了系统之间的比较\
  \ [57,63]。随着 TinyML 扩展到受监管的行业，其可解释性和审计性也必须趋成熟以满足行业标准。\n\n未来的道路依然很长，推进 TinyML 需要机器学习研究人员、密码学家、嵌入式系统工程师和监管利益相关者之间的紧密合作。面向未来的\
  \ TinyML 系统必须从开发生命周期的阶段就开始纳入隐私、安全可解释性。随着该领域的成熟，TinyML 不仅带来了新的挑战，也为从边缘建立可信 AI 范提供了提供了。\n\
