  \n61. Zigbee, A. 2011. “传输层安全。”IETF, `RFC6176`。返回正文。⏎\n\n## 9 将 TinyML 与区块链集成用于安全应用\n\
  \n## 9.1 引言\n\n物联网（IoT）是当前时代最显著的技术进步之一，并随着各种应用和优势快速发展。根据 Statista 的报告预测，到 2030 年将有\
  \ 250 亿设备在使用 1。然而，这种快速增长伴随着严峻的挑战，其中安全和隐私尤为突出。这主要是由于这些设备的资源有限、功率薄弱、处理能力不足以及内存限制 2。在人工智能发展及其在多个领域应用之后，想法是将其与这些智能网络相结合，以提高其智能化并有效解决安全问题。然而，之前提到的运行限制造成了障碍。在\
  \ 2010 年代中期，TinyML（微机器学习）出现，并在随后受到了广泛关注 3。TinyML 能够在资源受限的设备（如低功耗微控制器）上部署紧凑的机器学习模型。\n\
  \n图 9.1 展示了物联网设备采用 TinyML 技术的关键因素。\n\n\n\n图 9.1 驱动在资源受限 IoT 设备中采用 TinyML 的关键因素。\n\
  \n相反，区块链的开发是为了应对分散和去中心化应用的快速增长以及随之而来的安全担忧，作为扩展性和数据安全的可靠解决方案 [[5]]。区块链通常被认为是当今的基础技术。它提供了一个去中心化且安全的数据存储、交换和处理框架。\n\
  \n区块链遵循去中心化账本模型，使用强大的加密方法按顺序记录和验证交易。这消除了传统金融系统中对银行等中间人的人的需求。以 `IBM Blockchain World\
  \ Wire` 为例，它是该领域的一个知名应用，由 `IBM` 提供的解决方案，使金融机构能够直接相互转账而无需依赖中间机构 [[6]]。如图 9.2 所示，区块链技术解决了去中心化系统至关重要的若干核心需求。\n\
  \n![Figure 9.2 采用区块链技术的核心动机。](img/Fig09_02.jpg)\n\n图 9.2 采用区块链技术的核心动机。\n\n数据完整性是去中心化系统的首要问题。区块链通过共享账本解决了这个问题，该账本保持尽可能准确且不可篡改的记录，使系统更加可靠\
  \ [[7]]。透明性也是最重要的属性，使用共享账本建立了参与者的信任。去中心化将权力分配给许多人，通过消除单点故障提高了安全性和容错能力。健壮的加密保护了信息和交易，增加了安全性并使区块链在去中心化系统之外具有价值。智能合约可以在无需人工交互的情况下有效执行任务，用途包括点对点能源交易，允许消费者之间进行直接消费贸易而无需中间人。一项研究\
  \ [[8]] 强调了智能合约可以支持的若干应用，例如点对点能源交易，能量在消费者之间直接交易而无需中间人。\n\n传统的区块链技术需要大量的计算资源；然而，目前已经开发了如\
  \ `IOTA` 和 `Hyperledger Fabric` 等轻量级区块链平台。`IOTA` 平台依赖于名为 `Tangle` 的方法，每个新交易都会验证一个或多个之前的交易，而不是像传统系统那样将交易分组并一次性添加到区块中进入共识机制。`Tangle`\
  \ 不需要矿矿那样的重型资源，使其适用于运行 `TinyML` 的 IoT 设备 [[9]]。基于 `TinyML` 技术针对资源受限设备的智能和能力，以及区块链在这些应用中解决安全挑战和管理数据的能力，将\
  \ `TinyML` 与区块链集成的动机应产生了。这种集成提供了克服医疗保健、工业监控和智慧城市发展等敏感领域挑战的重要机会。\n\n许多近期研究强调了这种结合的重要性及其对解决阻碍物联网广泛采用的安全挑战的贡献。以下几点强调了集成\
  \ `TinyML` 与区块链的动机：\n\n*   **克服技术局限：** 大多数 IoT 设备缺乏计算能力、内存或能量。`TinyML` 通过运行能够契合这些限制的轻量级机器学习模型，提供了一种智能解决方案。\n\
  *   **增强安全与信任：** 区块链的工作原理像一个可靠的数字笔记本，在分布式系统中保持数据安全，并确保没有人可以篡改它。\n*   **隐私与数据保护：**\
  \ 通过在靠近数据产生的地方处理数据，这种方法降低了泄露风险，并有助于遵守隐私规则。\n*   **支持扩展性和自主性：** 这种方法让系统能够更容易地增长和适应，而无需完全依赖中心枢纽。它还使系统工作得更加独立和灵活，特别是在不同的地点。\n\
  \n本章旨在全面研究集成 `TinyML` 和区块链，以开发安全且高效的物联网应用。\n\n## 9.2 背景与相关工作\n\n### 9.2.1 TinyML\
  \ 概述\n\n微机器学习（`TinyML`）是机器学习的一个新分支，专注于直接在资源受限的 IoT 设备上运行轻量级模型。它使实现在边缘端（edge）上进行智能处理，而无需过度依赖云资源。该技术旨在以尽可能少的无线传输将人工智能引入网络边缘。这种方法在本地处理数据，创建了一个实时响应、能量消耗合理并降低隐私风险的系统\
  \ [[10]]。`TinyML` 的技术特征在实现上述应用中发挥了关键作用。这些特征如图 9.3 所示。\n\n![Figure 9.3 实现高效设备内处理的\
  \ TinyML 技术核心技术特征。](img/Fig09_03.jpg)\n\n图 9.3 实现高效设备内处理的 TinyML 技术核心技术特征。\n\n`TinyML`\
  \ 的关键特性是其较小的模型大小，这对于微控制器等资源有限的设备是理想的。模型通常小于 1 MB，这非常罕见，因此先进技术有助于缩小它们：\n\n*   **压缩：**\
  \ 通过减少存储需求来使模型更小，同时稳定准确性。它削减冗余数据并使用高效的表示。\n*   **量化：** 降低权重和数字的位宽（例如从 32 位到 8 位），以最小的性能损失节省内存。\n\
  *   **权重剪枝：** 移除对预测影响较小的不重要权重，以精简模型。\n\n某些机器学习模型（如联邦学习）与 `TinyML` 配合良好。联邦学习在保持良好准确率的同时，高效地训练简单数据集。`TinyML`\
  \ 特颖之处在于其卓越的功率效率，这对于资源有限的设备至关重要。研究表明，通过网络发送数据使用的能量比在边缘设备上本地处理多得多。这就是为什么 `TinyML`\
  \ 专注于直接在这些设备上运行模型。\n\n随着 AI 在资源限制的 IoT 设备上兴起，高效的资源利用至关重要，包括电源、内存、存储和处理 [[11]]。`TinyML`\
  \ 通过针对此类限制优化模型来支持这一点。在智能家居安全和工业监控等 IoT 应用中，实时响应是至关重要的 [[3]]。`TinyML` 具有高度的灵活性，使其能够通过微调轻松应用到不同的环境中。这减少了为每个案例创建单独模型的需求。一项\
  \ 2025 年发表在 medRxiv 上的研究证明，使用 `TinyML` 构建并在一个数据集上训练的 ECG 模型在用于新数据时仍然准确，即使存在不同的条件和患者差异\
  \ [[12]]。`TinyML` 应用跨越广泛且多样化的领域；我们将介绍其中一些。\n\n\n\n\nTinyML 广泛应用于工业物联网（IIoT）以及智能交通和运动监控系统。其中一项研究以边缘设备为实际示例，在该领域提出了一种解决方案。该目标是通过实时监控驾驶员状态来检测嗜睡或疲劳迹象，从而提高道路安全。研究人员使用卷积神经网络（CNN）量化模型将模型大小压缩至约\
  \ 0.05 兆。模型的轻量化特性实现了快速实时分析，响应时间在几百毫秒范围内 [13]]。\n\n医疗健康是 TinyML 的关键领域，能够通过可穿戴设备对生命体征进行实时处理。在一项研究中，微控制器（64\
  \ MHz CPU，256 KB RAM）运行 CNN 模型，通过传感器收集多维数据。其目标是实时检测心律失常（见图 9.4）。通过量化和剪枝来适应设备限制，将权重从\
  \ 32 位减少到 8 位，并移除影响较小的节点以减少计算量。这展示了 TinyML 在持续监控和通过实时警警发现心律失常等疾病方面的前景 [14]]。TinyML\
  \ 还涵盖了依赖智能处理分布的广泛现代应用，包括使用传感器监测空气质量和交通拥堵的智能城市，以及通过语音或动作与用户交互的智能家居设备等。\n\n![图 9.4\
  \ TinyML 在增强医疗系统效率和实时数据处理中的应用。返回文本。⏎](img/Fig09_04.jpg)\n\n图 9.4 TinyML 在增强医疗系统效率和实时数据处理中的应用。返回文本。⏎\n\
  \n此外，它还扩展到了农业领域，在那里集成了人工智能以监测土壤状况和作物健康。在这种背景下，利用轻量级模型（特别是 `MobileNetV3-small`）进行植物病害检测。通过量化技术，模型大小从\
  \ 150 万缩小到 93 万，使其适用于部署在现实农业环境中的边缘设备上。结果突显了 TinyML 在运行准确模型进行实时植物病害检测方面的有效性，即使在连接受限的农村地区也能达到\
  \ 99.5% 的准确率 [15]]。\n\n实现 TinyML 模型依赖于一组集成工具和框架。这些工具被用于多个阶段，包括训练、优化、转换和在边缘设备上的部署。\n\
  \n表 9.1 展示了 TinyML 模型的实现以及每个阶段所需的关键工具。\n\n表 9.1 TinyML 模型实现阶段概述及各阶段所需的关键工具 返回文本。⏎\n\
  \n| 阶段 | 描述 | 工具或框架 | 目的 |\n| --- | --- | --- | --- |\n| 1. 模型训练 | 模型最初在标准计算机上使用收集到的数据进行训练。\
  \ | * `TensorFlow` (完整版)<br>* `Edge Impulse` | 用于构建并训练机器学习模型，`Edge Impulse` 通过图形化界面简化了这一过程。\
  \ |\n| 2. 模型优化 | 训练完成后，模型通常太大，因此必须减小以便在小型设备上高效运行。 | * `TensorFlow Lite`<br>* `MicroTVM`<br>*\
  \ 量化工具 | 减小模型大小和计算成本，以便在受限设备上部署。 |\n| 3. 模型转换 | 将优化后的模型转换为与目标硬件兼容的格式。 | * `TensorFlow\
  \ Lite for Microcontrollers`<br>* `Edge Impulse Exporter` | 生成与微控制器兼容的部署格式，如 `.tflite`\
  \ 或 C 数组。 |\n| 4. 设备部署 | 将转换的模型嵌入微控制器程序中，并连接到实时传感器输入。 | * `Arduino TinyML Libraries`<br>*\
  \ `CMSIS-NN` | 将模型与传感器输入输出集成，并确保在低功耗处理器上高效执行。 |\n| 5. 设备上推理 | 设备实时运行模型以根据现场数据做出预测，完全离线运行。\
  \ | 与上述工具相同 | 在本地执行实时推理，不依赖云服务或外部计算能力。 |\n\n各种工具支持从训练到边缘部署的 TinyML 模型开发。`TensorFlow`\
  \ 用于在计算机上训练模型。`Edge Impulse` 是一个具有用户友好界面的云平台，用于数据收集、训练和性能分析。`TensorFlow Lite` 将模型转换为更小版本以用于低资源设备。`Quantization`\
  \ 工具降低权重精度（从 32 位到 8 位）以降低尺寸和功耗。`MicroTVM` 优化模型在低功耗硬件上的执行。`TFLite for Microcontrollers\
  \ (TFLM)` 直接在 Arduino 等没有操作系统的设备上运行模型。`Edge Impulse Exporter` 输出 `.tflite` 或 C 数组等格式的模型。`Arduino\
  \ TinyML` 库帮助在 Arduino 开发板上运行模型。`CMSIS-NN` 为 ARM Cortex-M 处理器提供快速神经网络函数。\n\n在接下来的章节中，我们将研究区块链技术的基本原理，并讨论其在物联网中的意义和应用。\n\
  \n### 9.2.2 区块链基础\n\n物联网涉及数百万交换数据的设备，这些数据必须被安全存储。区块链通过创建一个无需中心控制的去中心化系统来实现这一点。作为一种数字账本，它安全地记录交易。数据分布在许多节点上，防止中心化。这种设计确保了数据的完整性并防止篡改，这对于物联网环境至关重要。为了理解支持物联网环境中区块链应用的技术支柱，可以参考图\
  \ 9.5，它概述了作为该技术基础的核心概念。\n\n![图 9.5 区块链的核心概念](img/Fig09_05.jpg)\n\n图 9.5 区块链的核心概念。返回文本。⏎\n\
  \n在查看了图 9.7 所示的区块链技术核心概念后，通过深入的阅读来补充这一视觉概述变得非常重要。\n\n分布式账本形成了区块链的核心，追踪来自传感器等物联网设备的实时数据。数据在许多节点间共享，提高了透明度并防止篡改。这被用于智能供应链，跟踪从生产到消费的各个。智能合约是在满足条件时自动执行的程序，例如在医疗程序前验证医疗保险，从而加速处理过程\
  \ [16]]。物联网有限的电力挑战了工作量量（PoW）等共识机制，因此代理权益证明（DPoS）等替代方案使用信任的验证者来高效验证交易，从而节省能量 [17]]。像\
  \ IOTA 这样使用有向图（DAG）而非区块链的平台可以处理无费用且响应快速的小型传感器交易，这在智能交通试验中已显示 [18]]。Hyperledger Fabric\
  \ 提供了具有访问控制的可定制私有区块链，被 IBM 及其合作伙伴在医疗和工业试验中使用 [19]]。\n\n\n\n\n尽管这些机制和框架提供了巨大的潜力，但悬而未决的问题是：这些理念在物联网应用中具有普遍适用性吗？还是其结果取决于特定的上下文以及相关的后续问题？从理论上来说，答案是肯定的。在实践中，部署的可行性取决于基础设施、用设备的性质以及系统应用数据的敏感性。例如，农业系统中的远程应用，或医院中\
  \ ICU 系统等高安全性应用，由于可用技术资产的局限性以及对实时响应事件的紧迫需求，使用传统的区块链系统可能会面临现实问题。因此，仅仅理解理论概念是不够的；更重要的是所提解决方案与目标系统的特定性质和实际需求之间的契合程度。在随后的章节中，这些将更详细地介绍这些理念，重点介绍设想的架构模型、TinyML\
  \ 与区块链的集成机制，以及它们在实际应用中实现的技术问题，特别是在资源受限的边缘设备上。\n\n### 9.2.3 物联网中的安全挑战\n\n随着物联网在生活不同领域（从家庭到制造设施和交通系统）的普及，保护这些系统免受各种威胁的需求也日益增长，因为这些威胁具有损害用户匿名性和数据完整性的潜力。物联网本质开放且持续连接的特性使其成为网络攻击的吸引人目标，特别是当设备较小、资源受限且不定期更新时[20]。\n\
  \n最常见的威胁之一是`spoof attacks`（欺骗攻击），攻击者伪装成真实设备，未经原始用户或用户授权的方式获得数据信道的访问。以家庭智能网络为例，黑客在通过初始欺骗后可能会操纵温度调节器或安全摄像头[21]。`data\
  \ tampering`（数据篡改）构成了同样严重的威胁，攻击者操纵流入或流设备的数据。这种攻击往往隐蔽且难以检测，因为它可以用于工业或医疗保健环境，在这些环境中，微小的传感器值调整就会导致错误的系统决策[22]。\n\
  \n保护对设备和数据的访问是许多物联网环境面临的一个主要挑战，特别是当这些系统缺乏强大的安全措施或依赖于弱且易猜的密码时。在这种情况下，系统将暴露在`unauthorized\
  \ access attacks`（未经授权的访问攻击）之下，可能是由于配置错误或通信信道加密弱，从而为攻击者提供了进入系统并修改信息的简单访问点[22]。\n\
  \n尽管物联网环境面临的安全威胁种类繁多，但我们选择关注上述威胁，是因为这些攻击的严重性以及它们对数据和系统完整性的直接影响。\n\n即使有加密、双因子身份验证或防火墙等遗留安全解决方案，它们在物联网中的适用性也是有限的。这些设备通常没有资源执行复杂的协议，因为它们的内存和功率资源限制了它们。例如，远程喷淋系统中的低功率控制器无法像个人电脑那样进行高级加密。此外，管理身份或完整性验证的中心化服务器引入了故障点，并削弱了系统面对针对性攻击的韧性[23]。\n\
  \n基于这些，弥补差距并解决该领域挑战的需求变得更加强烈。此类解决方案必须考虑设备的局限性，并避免给系统带来过大压力。在近期具有前景的趋势中，区块链技术之一，它具有去中心化验证以及使用本地\
  \ TinyML 模型进行早期威胁检测的特征。这两个领域将在本章稍后部分进行详细探讨。\n\n### 9.2.4 相关工作\n\n为了更深入了解该领域最突出的贡献，回顾针对\
  \ TinyML 技术与区块链的应用及其整合的研究工作是关重要的。之前的研究涵盖了广泛的应用，为解决许多挑战做出了贡献，并利用这些技术提供了创新的解决方案。表\
