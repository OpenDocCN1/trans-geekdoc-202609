  \n### 8.2 纳入/排除标准摘要\n\n| 标准 | 理由 |\n|---|---|\n| **纳入 1** | 纳入专门针对受限设备提出密钥管理方案的早期和近期研究，因为它们解决了独特的安全挑战。\
