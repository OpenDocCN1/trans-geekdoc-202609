  \ | ✓ | ⨯ | ⨯ | ✓ | ✓ |\n| PDS-学习 | ⨯ | ⨯ | ⨯ | ✓ | ⨯ |\n| 自动编码器/DBNs | ⨯ | ⨯ |\
