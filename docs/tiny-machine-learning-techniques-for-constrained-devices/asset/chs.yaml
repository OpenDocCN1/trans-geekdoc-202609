  \ Ibrahim Ouahbi, 和 Yassine Maleh, DOI: [10.1201/s7803549](https://doi.org/10.1201/s7803549)\n\
  \n## 10.1 引言\n\n对生活质量的追求以及日益严峻的全球挑战推动了技术的快速发展。“边缘智能”（EI）通过整合物联网（IoT）和机器学习的能力，成为了一种极具前景的解决方案。具备能力的智能摄像头正日益应用于工业和家庭环境。在边缘智能（EI）领域，重点在于传感器系统，包括摄像头配置、音频传感器以及智慧城市的交通监控等功能。边缘智能本质上充当了一个巨大的传感器网络，持续观测并分析环境事件。在集成的技术框架中，收集的数据也可以被传输到云端进行深度分析。在过去的十年中，机器学习和嵌入式物联网软件工程取得了显著进展，帮助开发者克服了部署深度学习模型的许多挑战。曾经需要专家知识和复杂软硬件的任务，现在可以通过在高效的\
  \ IoT 平台上部署优化的机器学习模型来实现简化和自动化。\n\n## 10.2 TinyML 概述\n\n\n\n\n\n本节概述了设计和部署 TinyML\
  \ 模型的软件工程工作 [6]。开发过程通常分为两个主要阶段：第一阶段在利用 CPU 或 GPU 等高性能计算资源的训练环境中进行；第二阶段侧重于使用资源受限的边缘硬件进行真实应用中的部署，如图\
  \ 10.1 所示。\n\n![图 10.1 TinyML 模型的开发与部署工作流。返回文本。⏎](img/Fig10_01.jpg)\n\n图 10.1 TinyML\
  \ 模型的开发与部署工作流。返回文本。⏎\n\n在开始阶段，客户或业务需求被分解为三个相互关联的类别：\n\n1. **模型需求：** 规定机器学习模型预期的性能、准确性和复杂度。\n\
  2. **数据需求：** 定义有效训练和推理所需的数据类型、规模和质量。\n3. **系统需求：** 详细述目标边缘平台的硬件限制、延迟容忍度、功耗以及集成需求。\n\
  \n这种方法能够将特定职责分配给不同的团队或实体，每个团队负责交付特定的组件。它还赋予了这些团队一定程度的自主性，使其能够充分理解需求，并运用他们在系统架构、模型开发以及用于采集、清洗和标注的数据流水线构建等领域的专业知识。\n\
  \n流程的执行如下：\n\n* **系统设计与约束：** 一旦确定了系统架构，它就能为模型探索和数据工程任务提供关键见解。考虑到应用程序运行在紧凑的微控制器单元（MCU）上，系统设计对用于数据预处理、后处理和机器学习的算法提出了计算和内存限制。重要的是，应用程序开发可以与模型开发同步进行。\n\
  * **并行开发：** 这种并行工作流允许嵌入开发者根据机器学习模型的预期输出，设计并调试用于感知和执行的启发式流水线。开发者还可以校准函数模拟模型输出，能够在最终模型完成之前对其嵌入代码进行调优。\n\
  * **模型训练与评估：**遵循模型训练的最佳实践，开发者可以确定合适的模型并评估其在验证数据集上的性能。此评估阶段的见解将指导关于进一步训练或超参数调优的决策，以提高模型性能。\n\
  * **模型编译：** 一旦模型符合所需的验证标准，将进入由 TensorFlow Lite Micro (TFLM) 框架管理的编译阶段。此步骤涉及利用目标\
  \ MCU 自定义功能的硬件特定库来优化模型。\n* **编译后测试：** 编译后，根据资源可用性在仿真器内或直接在目标设备上对模型进行评估。如果编译后性能大幅下降，则应将模型送回在编译阶段进行必要的调整。\n\
  * **集成与部署：** 一旦编译后的模型表现出与原始模型一致的性能，交给应用集成团队。该团队将模型嵌入到应用程序中，使用指定的测试数据集进行测试，并随后在真实环境中进行部署。\n\
  * **监控与持续改进：** 从真实使用中收集性能数据为持续集成提供了宝贵的反馈。这些见解有助于识别性能差距，或突出使用来自不断变化的真实分布的新数据重新训练模型的必要性。\n\
  \n## 10.3 工作流步骤、挑战与建议解决方案\n\n目前，对于针对 TinyML 应用的物联网 嵌入式视觉系统的开发、部署和维护，最有效且高效的方法论了解有限。一个明显的空白是，缺乏专门为\
  \ TinyML 工程独特需求而设计的、成熟的敏捷开发实践。构建此类应用程序需要嵌入式系统、计算机视觉和机器学习领域的跨学科专业知识。然而，鉴于该领域尚处于初级阶段，具备所需的综合技能栈以应对跨不同应用领域\
  \ TinyML 多方面挑战的工程师非常稀缺。\n\n开发和实施 TinyML 应用的步骤以及相关的挑战和建议解决方案如下：\n\n1. **业务（客户）理解：**\n\
  \    * **挑战：**\n     * 客户需求正在快速演变。\n     * TinyML 工程要求在多个领域精精通，包括人工智能（AI）、机器学习和嵌入式系统。中小企业/业务用户可能不具备理解这些系统所需输入的专业能力。\n\
  \    * **解决方案：**\n     * 将负责系统创建、数据处理和模型开发的团队分离，有利于并发工作 [7]。\n     * 优化 TinyML 工程流程，版本控制对于满足客户需求至关重要。这允许对消费者要求的特定功能进行增量增强\
  \ [8]。\n\n2. **系统需求：**\n    * **挑战：**\n        * 在实时环境中部署面临巨大挑战。\n        * 需要确保硬件系统之间的兼容性以及模型在各种硬件配置之间的迁移性。\n\
  \        * 实时场景下的性能下降是 TinyML 边缘部署的主要关注点。\n        * 缺乏跨不同算法和 MCU 系统的性能标准化工具 [9]。\n\
  \    * **解决方案：**\n        * 建立关于视觉数据的共享假设，例如照明条件和阴影。\n        * 通过严格控制 TinyML 系统使用的设备和芯片组，管理硬件设备的指数级增长。\n\
  \        * 根据 TinyML 应用预期的环境障碍做出设计选择。\n        * 使用数据增强训练数据集对于此至关重要 [10]。\n\n3.\
  \ **模型需求：**\n    * **挑战：**\n        * 评估不同量化水平、精度以及模型峰内存需求带来了巨大挑战。\n        * 缺乏关于适用于\
  \ TinyML 项目的模型选择的文档。\n        * 在资源受限的边缘环境中识别实用模型是一项复杂的工程。\n    * **解决方案：**\n  \
  \      * TinyML 系统必须根据模型大小、推理速度和特定应用的功耗限制等需求选择目标 MCU 硬件 [10]。\n        * 约束神经架构搜索（NAS）可以帮助缩小与设计选择相关的模型架构\
  \ [11,12]。\n\n4. **系统设计：**\n    * **挑战：**\n\n\n\n\n\n- 目前，还没有明确的框架或标准基准来帮助 `TinyML`\
  \ 驱动的 IoT 嵌入式视觉应用开发者确定符合特定应用、市场或客户需求的最合适硬件和模型设计。\n- 为不同的目标硬件系统维护模型开发工具可能非常耗费精力。\n\
  - 在处理广泛的应用场景时，模型开发会变得极其复杂。\n- 来自视频的视觉数据通常包含时间上的冗余信息，导致在资源受限的边缘硬件上产生了不必要的额外计算。\n\n\
  ### 解决方案\n- 从一开始就确保正确配置 `TinyML` `TFLM` 框架基础设施将有助于更快速的迭代 [13]。\n- 确保模型的有效管理和维护版本控制对于优化\
  \ `TinyML` 开发工作至关重要。\n- 利用事件驱动的方法处理视觉数据可以减少对重复计算的需求 [14]。\n\n## 5. 数据工程\n\n### 挑战\n\
  - 缺乏从 IoT 嵌入式视觉传感器中提取的、用于各种应用的精选数据集。\n- 从各种传感器和来源获取的模型数据可能以不同的文件格式存在。\n- 数据集可能无法充分代表分布中的真实情况。\n\
  \n### 解决方案\n- 数据仅可以通过程序接口进行访问。\n- 数据增强涉及通过引入缩放、噪声、阴影、颜色和光照条件等变化来模拟现实场景。\n\n## 6.\
  \ 模型训练\n\n### 挑战\n- 基础的联合优化方法（如 `NAS`、量化 `quantization` 和剪枝 `pruning`）可能会以相互作用的方式进行，导致非最优的结果\
  \ [15]。\n- 缺乏 `TinyML` 工程的仿真工具导致模型开发所需的时间和精力增加 [16]。\n- 超参数搜索过程在结果结果方面可能会遇到挑战。\n\
  - 以性能为导向的方法开发 `TinyML` 模型面临挑战。\n- 通过基于 Web 的工具实现 `TinyML` 工程自动化。\n\n### 解决方案\n-\
  \ 使用确定性随机性（如暴露的随机种子）有助于在超参数调优期间迭代。\n- `TinyML` 应用开发者应当利用 `AutoML` 工具来自动化训练过程，特别是在面对大量的训练和验证数据时。\n\
  - 像 `Edge Impulse` 和 `Qeexo` 这样的初创公司提供了可以通过 Web 的 `AutoML` 能力，可以直接集成到边缘应用中。\n\n\
  ## 7. 模型评估\n\n### 挑战\n- `TinyML` 模型必须表现出鲁棒性，以有效处理环境异常和噪声。\n- 缺乏统一的 `TinyML` 评估指标。\n\
  \n### 解决方案\n- 测试驱动开发应侧重于评估局部和全局的对抗鲁棒性 [17]。\n- `ML Commons` 推出了 `ML Commons`，为低功耗机器学习建立了第一个行业标准\
  \ [18]。\n\n## 8. 模型编译\n\n### 挑战\n- 确保 `TinyML` 模型的安全性对于应用设备来说是一个挑战 [19,20]。\n- 功耗分析变得复杂，因为不同设备之间的数据路径和预处理阶段可能不同。支持\
  \ `TinyML` 的设备表现出极其不同的功耗，增加了在这些设备之间保持准确性的任务难度。\n- 由于传感环境的变化或视觉传感器的老化，现实情况可能会迅速演变。`TinyML`\
  \ 在计算资源有限的情况下提供解决方案，解决了在线学习中的了一项重大挑战。\n- 在模型本身优化之前，优化设计权衡是具有挑战性的。\n- 实现 `TinyML`\
  \ 在内存受限的情况下面临挑战 [21]。\n\n### 解决方案\n- `TinyML` 系统应支持最小化干预或系统停机进行升级。\n- 硬件感知的编译器可以自动解决设计权衡冲突，无需深入了解\
  \ `MCU` 架构 [22,23]。\n\n## 9. 编译模型评估\n\n### 挑战\n- 由于计算限制，在边缘设备上调试 `TinyML` 模型具有挑战性。\n\
  - 通用框架的局限性限制了硬件感知。\n\n### 解决方案\n- `TinyML` 开发需要使用设备仿真器。\n- 设备仿真器可以帮助比较原始 `TinyML`\
  \ 模型的性能。\n\n## 10. 应用集成\n\n### 挑战\n- 考虑到边缘应用需要时间敏感的决策，确保 `TinyML` 系统的可靠性至关重要。在 `TinyML`\
  \ 模型中嵌入鲁棒性以在不稳定环境中启用故障转移是必要的 [20]。\n\n### 解决方案\n- 自动化工具可以帮助探索性能、精度功率之间的权衡 [24]。\n\
  \n## 11. 应用测试\n\n### 挑战\n- 当系统包含启发式代码和训练好的 `TinyML` 模型时，调试应用问题变得更具挑战性。\n- `TinyML`\
  \ 驱动的应用是精简的，缺乏强大的数据测量和可视化工具。由于内存限制，这为模型开发和部署整个调试带来了额外障碍 [21]。\n- `TinyML` 模型测试可能会被测试中的偏差所破坏。\n\
  \n### 解决方案\n- 研究 IoT 应用的缺陷分类法有助于预防应用代码中的关键问题 [25,26]。\n- 拥有专门的质量保证团队可以通过减少开发者偏差来促进公平调试。\n\
  \n\n\n\n\n- 尽管在训练期间成功验证了模型，但在实际环境中部署 TinyML 模型仍然具有挑战性性。\n- 确保应用程序能够在不同的设备和供应商之间无缝运行是\
  \ TinyML 工程面临的一项重大障碍。\n- 修复嵌入式应用部署中的 Bug 面临着巨大的挑战。\n\n### 解决方案\n- 实现复现性依赖于在真实环境中对算法、参数和数据/标签进行明确标识并可访问\
  \ [10]。\n- 拥有空中更新（OTA）能力对于固件和 TinyML 模型无缝部署 Bug 修复和升级至关重要。\n\n### 13. 应用监控：\n\n\
  ### 挑战\n- 由于边缘硬件的限制，在真实环境中提升性能面临挑战。\n- 在实时场景下衡量 TinyML 应用的性能非常困难。\n\n### 解决方案\n\
  - 将标注和重训练整合到持续集成流程中，并根据监控反馈进行调整，可以通过适应实时场景中面临的新数据分布来增强应用性能。\n- 利用设备级监控工具可以增强真实部署中的可调试性。\n\
  \n## 10.4 TinyML 的应用与未来研究方向\n\nTinyML 运动的快速增长很大程度上是由其多样化的应用驱动的，这些应用不仅产生了价值数据集，还加速了正在进行的研究。这反过来对更高效的\
  \ TinyML 系统以及设计方法的迭代改进产生了持续需求。\n\nTinyML 应用最初集中于视觉任务，但近年来显著扩大了其范围，涵盖了自然语言处理、预测建模、模式识别与分类以及数据分析。本节提供了这些应用领域的简要概述，并对关键挑战和未来机会进行了高级评估。\n\
  \n目前，TinyML 已在广泛用例中证明了其有效性，包括智能设备（从单个传感器到整个城市基础设施）、工业监控与控制、医疗诊断、安全与监控、行政自动化和金融运营。这些应用对日常生活和社会系统产生了意义且日益增长的影响\
  \ [27,28, 29, 30, 31, 32]。\n\n### 10.4.1 智能车辆\n\n智能车辆的特征是集成了计算、存储和通信能力，使其能够从环境中学习并做出明智决策。这些车辆配备了内外传感器以及多接口通信模块。智能车辆的日益普及——配备了车载无线设备以及雷达、激光达等先进传感器——将注意力转向高效的交通管理和运输系统，旨在减少拥堵并缩短旅行时间。\n\
  \n智能车辆提供了各种先进功能，包括实时信息交换和精确位置跟踪。这些能力支持了广泛的专业应用，特别是安全通信和早期预警系统。在车辆边缘计算（VEC）框架内，车辆通常配备了车载单元（OBUs）以促进无线通信。在事故检测等紧急情况下，车载传感器起着关键作用——例如，在判断安全气囊是否已弹出，这可以触发即时的灾害响应协议。\n\
  \n#### 10.4.1.1 智能车辆服务\n\n- **辅助驾驶：** 在现代交通系统中，汽车、巴士和火车等车辆日益具备了传输关键信息的能力——从事故报告、道路关闭到实时交通拥堵更新。这种能力的实现依赖于传感器、执行器和车载处理器的集成，它们共同增强了安全性和导航性。这些智能系统生成的交通模式数据对广泛的利益相关者大有益，包括公共机构、私营企业和应急服务部门\
  \ [33]。根据美国国家公路交通安全管理局（NHTSA）的分类，智能车辆被分为五个不同的级别，每个级别代表了层层递进的自动化和自主化程度 [34]。\n- **自动驾驶车辆：**\
  \ 随着智能车辆向全自动迈进，在它们之间建立可靠且高速的连接变得至关重要。由这种技术演进驱动的车辆网络的出现，是智能交通系统发展和更广泛智能城市愿景的核心。这些网络预计将支持广泛的先进应用，包括增强道路安全、改善交通流、自动驾驶能力以及无缝访问基于互联网的服务\
  \ [35,36]。\n\n全球自动驾驶车辆的趋势正在重塑汽车行业。然而，实现全自动车辆仍然面临着与安全、可靠性和隐私相关的重大挑战。最紧迫的问题之一是自动驾驶车辆对网络攻击的脆弱性。车辆软件系统的一次简单的恶意入侵都可能导致级联故障并可能引发严重的事故。此外，这些系统的互联特性使其暴露于未经授权的访问和不可预测的网络威胁之下。\n\
  \n为了解决安全攸关的问题，自动驾驶车辆的设计包含了某种机制，允许车辆在整个途中持续监控环境状况的同时，检测并响应潜在危害。这些系统通常假设司机会输入目的地或路线；然而，它们并不依赖于持续的人类监督，这强调了稳健自动化对于确保安全运行的重要性\
  \ [37]。尽管自动车辆系统和联网车辆技术是不同的，但它们拥有重叠的功能，并在更广泛的智能生态系统中以互补的方式运行。\n\n- **智能停车：** 在大都市地区，大量车辆停放在不同的地点，包括路边和路外停车设施。与行驶中的车辆不同，停放的车辆会静止很长时间。虽然它们不通过移动来传递信息，但那些配备了无线通信模块和可充电电池的车辆——作为智能街道车辆（SSV）范式的一部分——可以作为车辆通信基础设施中极具价值的组成部分。这些停放的街道车辆（SSV）具有独特的特性，使其能够相互通信并与附近的移动\
  \ SSV 建立连接。作为静态通信节点，有助于形成一个韧性的骨干网络，从而增强整个车辆网络的连接性。\n\n\n\n\n\n停放车辆作为通信基础设施的有效性受到给定区域内车辆数量及其平均停车时长等因素的影响[28]。停放智能服务车辆（SSV）之间的协作网络化，特别是在密集的停车场中，有助于在稳定的通信条件下执行资源密集型计算任务。单辆车辆通常受到计算和能量资源的限制，可能难以应对此类高要求任务。而停放的\
  \ SSV 通过提供空闲但强大的处理能力缓解了这一局限性，能够在更短的时间内高效完成任务。本质上，这些停放智能车辆集群充当了局部微数据中心，能够以分布式且节能的方式处理复杂和高计算的负载。\n\
  \n## 10.4.1.2 智能车辆应用\n\n### 安全应用\n智能交通应用的一个主要目标是通过降低事故风险来增强安全性。这些系统持续监控驾驶环境，并在检测到潜在危险情况时向司机发出警报。一个示例是在交通监控点部署全局摄像头传感器，它能够检测视野范围内的运动并识别车辆车牌。检测到后，传感器会记录车辆的位置和识别码，并将这些数据传输到本地边缘服务器进行进一步处理。\n\
  \n与此同时，安装在车辆前端的智能本地摄像头传感器（LCS）会监测驾驶员的行为。LCS 设计用于检测到风险活动时发出实时警告信息，从而有助于预防事故。及时且重复的警报能增强司机的安全意识，并帮助减少不安全的驾驶行为。此外，LCS\
  \ 能够向边缘服务器广播唯一的车辆标识符以及以及检测到的活动证据。这使得服务器能够维护干扰性或危险行为的记录[38,39,40,41]]。\n\n此外，上下文感知系统正越来越多地被用于以提高车辆应用的适应性和智能化。这些系统利用特定用户的数据和环境数据来动态调整其功能。上下文感知应用通过获取、处理和对上下文信息采取行动来运行[42]。通过利用上下文感知，这些系统可以生成简洁且相关的消息，从而减少对大量无线通信的需求。用户随后可以使用先进的解码技术和大数据分析（包括自然语言处理和其他\
  \ AI 驱动工具）来提取所需内容[39,43,44,45]]。\n\n### 非安全应用\n车辆边缘计算（VEC）的范围已超出安全关键型应用，涵盖了广泛的非安全服务，包括视频流媒体、增强现实（AR）等多媒体应用。流媒体式服务在物联网（IoT）中日益普及，显著增加了需求[46]。例如，在车网（IoV）中，用户访问内容[47]。\n\
  \n然而，在车网中提供高质量流媒体面临着抖动、缓冲和延迟等挑战。为了解决这些问题，提出了一种基于实时边缘计算的流媒体方案[48]。该方法利用边缘节点确保移动用户之间的服务质量（QoS）和公平性。移动设备预测未来需求并高效地请求内容。对于停车场监控，引入了一种数据驱动策略[49]。该系统使用车载摄像头、GPS\
  \ 和惯性传感器数据来准确识别和跟踪停放的车辆。\n\n增强现实（AR）是 VEC 另一个新兴应用，提供了一种将虚拟内容叠加在现实世界上的混合视图。一种关键实现方式是抬头显示（HUD），它将导航和安全信息投影到挡风玻璃上，最大限度地减少驾驶员的分心。文中对基于\
  \ HUD 的 AR 导航系统进行了详细研究[50]，说明了它们在便利服务方面的潜力[51]。\n\n一个创新的用例是支持 AR 的步行导航，它结合了 GPS\
  \ 和摄像头输入提供实时的、感知内容的路线。鉴于 AR 对存储、处理和低延迟的高需求，VEC 成为一个利用移动性感知、位置特定性和计算邻近性的理想框架。\n\n\
  ### 10.4.2 异常检测\n异常检测也称为离群点检测，涉及识别偏离预期行为的模式或数据点。这种在各种基于物联网的智能系统中至关重要，包括智能城市、环境监测和能量管理。在这些系统中，传感器作为主要的输入设备，持续产生大量数据，并将其传输到云服务器进行分析、决策和长期存储[52]。\n\
  \n文献概述了广泛的异常检测技术，涵盖几何模型、统计方法和基于机器学习的方法[53,54,55]。近年来，研究发生了向数据驱动策略的显著转变，更加地于机器学习和深度学习来识别异常事件。\n\
  \n\n\n\n207 云架构被广泛应用于异常检测系统，特别是在状态监测应用中[57,58]]。例如，在工业机器健康监测中，边缘设备收集振动信号并将其发送到云服务器，由机器学习算法在云端检测指示潜在故障的异常情况。尽管此类以云为中心的框架行有效，但它们并非没有局限性。延迟、对持续连接的依赖以及数据隐私担忧等挑战仍然是关键问题。\n\
  \nTinyML 通过允许直接在边缘侧进行机器学习推理，提供了一种变革性的替代方案。这种范式通过消除将数据卸载到远程云服务器的需求，促进了实时异常检测。因此，TinyML\
  \ 支持低延迟、高能效且保护隐私的异常检测，使边缘设备能够自主识别不规则模式并采取采取行动。\n\n### 10.4.2.1 状态监测\n\n在 `STMicroelectronics\
  \ STM32H743Z12` 微控制器单元（`MCU`）上实现 `TinyML` 模型的实际案例证明了旋转机械中异常检测的可行性。在该设置中，`MCU` 与加速度计接口以捕捉振动信号，处理数据以提取相关特征，并将处理后的数据存储在本地。随后，直接在\
  \ `MCU` 上训练基于自编码器的机器学习模型，以检测指示机械故障的偏差。\n\n在另一个应用中，废水处理厂用潜水泵的异常检测通过一个集成低功耗 `MCU`\
  \ 的改造套件实现[59]]。该套件包含温度和振动传感器、一个 `ESP32DEVKIT` `MCU` 以及电力线通信组件，均安装在水泵的末端腔体内。`MCU`\
  \ 收集传感器数据，执行特征提取，并使用本地训练的孤立森林模型检测数据流中的异常。训练阶段结束后，系统进入推理模式，`MCU` 继续执行实时监测，并在新数据可用时动态更新模型[60]]。\n\
  \n### 10.4.2.2 预测性维护\n\n部署在 `ESP-WROOM-32` 微控制器单元（`MCU`）上的 `TinyML` 模型被用于热成像应用中的异常检测[61]]。该设备利用使用\
  \ `Keras` 开发的卷积神经网络（`CNN`），并通过 `Eloquent Arduino` 的 `tinymlgen` 库转换为嵌入式部署。模型检测到的异常通过轻量级消息队列遥测传输（`MQTT`）通信到远程服务器，且仅在检测到异常时触发传输，从而节省了通信资源。\n\
  \n在配水系统领域，提出了一种名为深度回状态网络（`DeepESN`）的在线学习模型，它是循环神经网络（`RNNs`）的一种变，用于实时异常检测。该模型针对 `MCU`\
  \ 部署进行了优化，为评估分布式水务基础设施的可靠性提供了实用的解决方案[62]]。\n\n208 此外，为了检测风力发电机中的漏油泄漏，引入了一种基于块的二进制浅回状态网络（`BBS-ESN`）作为量化异常检测模型[63]]。这种方法将\
  \ `DeepESN` 与二值化输入图像结合，并对权重和激活函数应用 1 比特量化，显著降低了计算复杂度。该模型的性能在 `STMicroelectronics\
  \ NUCLEO-H743ZI` 板上通过了评估，证明其适用于资源受限的环境。\n\n### 10.4.2.3 智能车辆网络\n\n一种基于 `MCU` 的系统已集成到车辆中，用于检测路面异常，包括坑洼、减速带和障碍物。该实现采用了\
  \ `Arduino Nano 33 IoT` 板，它从车载加速度计收集数据，并执行名为 `TEDA`（典型性与离心性数据分析）的无监督 `TinyML` 算法。在沥青路面上进行了真实验证实验，以评估该系统在检测各种类型道路不规则情况方面的性能和可靠性[64]]。\n\
  \n### 10.4.3 智慧农业\n\n全球人口的快速增长推动了对农业产出增加的需求，以确保未来的粮食安全。然而，这种增长的需求面临着严峻的挑战，包括气候变化、土壤退化、资源枯竭和人口压力。这些问题使得采用创新的农业方法迫在眉睫。为此，农民、研究人员和农业行业日益日益转向物联网（`IoT`）、无人机（`UAVs`）、人工智能（`AI`）、大数据分析、云计算、雾计算和边缘计算。这些创新正在将传统农业变为智能、可持续且高效的系统——统称为智慧农业[65]]。\n\
  \n在这些技术中，`IoT` 发挥核心作用，能够对土壤和作物健康进行持续监测、疾病检测以及基于无人机的植物生长追踪。同时，电子技术的进步带来了高性能、高性价比组件的发展，例如微控制器单元（`MCUs`）、传感器模块和无线收发器。现代\
  \ `MCU` 现在不仅支持基本的传感和控制功能，还支持执行机器学习模型等复杂任务。此外，无线通信的进步实现了低功耗的长距离数据传输。\n\n在典型的智慧农业\
  \ `IoT` 架构中，配备传感器的设备监测土壤水分、作物健康、灌溉状态、温室状况和天气。数据通过摄像头和环境传感器收集并通过无线传感器网络（`WSNs`）传输到云平台。基于云的分析为农民提供了可操作的见解，包括植物疾病的早期检测以及土壤、天气与作物性能之间的相关性，促进了数据驱动的决策[66]]。机器学习在此背景下至关重要，它揭示了数据中的模式，209\
  \ 根据应用的不同，智慧农业架构通常分为两层（物理-边缘）、三层（物理-边缘-云）或四层（物理-边缘-雾-云）结构，其中三层模型最为常见[67]]。\n\n-\
  \ **物理层**由无人机、传感器和执行器组成，从田间、动物、温室和大气状况收集数据。\n- **边缘层**包括中低能力的计算设备，在数据源附近对数据进行分析和预处理。\n\
  - **云层**作为中央数据存储库和计算枢纽，能够训练和部署大规模机器学习模型。\n\n\n\n为了解决这些局限性，雾计算和边缘计算等计算范式运而生，将数据处理推向产生数据的设备。该领域一个非常有前景的进展是\
  \ `TinyML`，它允许传感器设备在本地运行机器学习推理。这种能力支持诸如作物健康监测、疾病检测和产量预测等任务，而无需依赖云端连接。TinyML 在降低延迟、提高能效、保护安全方面具有显著优势\
  \ [67]。\n\nTinyML 在增强农业实践方面具有巨大潜力，特别是在非洲等资源匮乏的地区，那里的数字农业和人工智能采用仍然非常有限。这一方向一个值得关注的倡议是宾夕尼亚州立大学的\
  \ PlantVillage 项目 [71]，该项目开发了 `Nuru` 移动应用程序。`Nuru` 利用 `TensorFlow-Lite` (`TFLite`)\
  \ 通过移动设备实现实时植物疾病诊断，即使在离线状态下也是——这对于遥远农业地区是一个至关重要的功能。未来的发展旨在将 `TinyML` 和 `TensorFlow\
  \ Lite Micro` (`TFLM`) 整合到部署在远程农场的嵌入式传感器中，以改进数据收集、分析和农业决策 [72]。\n\n除了农业，TinyML 还准备对环境监测产生变革性影响。它能够部署智能、稳健的设备来监测关键环境参数，如空气质量、水质和气候状况。这些设备的设计能够在严苛条件下运行，并对噪声和数据分布的变化具有免疫力。其低功耗设计允许在遥远或基础设施匮乏的环境中运行。支持\
  \ TinyML 的设备的部署支持了实时数据的可用性，能够对环境问题的早期检测和解决。由 TinyML 和智能感知技术融合驱动的智能农业倡议，正在开启农业和环境创新的新时代。\n\
  \n### 10.4.3.1 作物管理\n\n作物管理涉及多种技术的应用，旨在以高效且可持续的方式培养和维护作物。这些技术包括优化的灌溉和施肥实践、有效的病虫害控制以及最大化作物产量的策略。TinyML\
  \ 在这一领域提供了一个极具前景的工具集，通过允许设备端数据采集以及对土壤湿度和温度等环境变量进行实时分析。这提供了可操作的见解和预测性分析，增强了生产力和资源效率。近年来，研究人员引入了许多基于\
  \ TinyML 的创新，以帮助农民和农业科学家推进作物管理实践。以下概述了几个显著示例。\n\n一种实现涉及一种设计用于实验室、温室、农场或花园的嵌入式机器学习流水线\
  \ [73]。该流水线引导用户完成开发 TinyML 模型的过程，从根据监测植物参数的最佳实践进行数据收集开始。然后训练一个卷积神经网络 (`CNN`) 来估算叶面积指数\
  \ (`LAI`) 并预测植物的生长阶段。训练后，模型被压缩并转换为 `TensorFlow Lite` (`TFLite`) 格式，以便部署在微控制器单元 (`MCUs`)\
  \ 上。使用 `Sony Spresense` 开发板作为测试和验证的目标硬件。\n\n另一个例子是基于 TinyML 的大豆干旱压力检测系统，它利用了 `Raspberry\
  \ Pi Zero W` 配合 `Sony IMX219` 摄像头模块 [74]。该系统捕捉大豆作物的实时图像，并使用 `CNN` 模型检测干旱压力的视觉信号。该模型最初使用传统的深度学习框架开发，后转换为\
  \ `TFLite` 格式以便在 `Raspberry Pi` 上执行。检测到的异常被传输到网络平台进行可视化和进一步分析。\n\n第三种应用侧重于使用针对低功耗实时推理优化的压缩\
  \ `CNN` 模型检测葡萄藤叶艾斯卡病（esca disease） [75]。研究人员探索了多种压缩技术，包括范范张量分解 (`CP`) 分解、Tucker\
  \ 分解和截断奇异值分解 (`tSVD`)，以识别模型大小和准确性之间的最佳平衡。最终选择 `CP` 分解来压缩 `CNN` 模型。然后使用 `TFLite`\
  \ 应用训练后量化，产生一个适用于部署在 `OpenMV Cam STM32H7` 上的 8 位模型。这个紧凑的视觉系统被安装在以恒速通过过道行驶的农业车辆上。\n\
  \n# 10.4.3.2 植物疾病\n\n植物疾病检测的最新进展日益倾向于基于图像处理的深度学习方法，而不是传统的分析方法。这种转变旨在实现对植物疾病更早、更准确的诊断，从而帮助农民减少经济损失。该领域的主流框架采用多层卷积神经网络\
  \ (`CNN`) 架构。在初始阶段，`CNN` 自动从标记的训练图像中提取并学习分层特征。这些提取出的特征在后续阶段被馈入人工神经网络 (`ANN`)，在其中使用学习到的权重、偏置函数和非线性激活函数进行处理。这种两阶段架构已被证明在疾病识别任务中实现高准确性是有效的\
  \ [76]。\n\n# 10.4.3.3 农业咨询系统\n\n已经开发了若干聊天机器人驱动的系统，通过对其查询提供个性化和特定上下文的回答来帮助农民 [77]。这些系统利用在线资源（如农业文档和知识库）作为训练数据。使用自然语言处理\
  \ (`NLP`) 技术 [78]，构建了一个基于深度学习的循环神经网络 (`RNN`) 框架，用于理解和生成类人的回答。农民可以通过向这些系统提出广泛的问题，从特定地理区域的作物适用性到农药和化肥的合理使用。\n\
  \n# 10.4.3.4 智能灌溉\n\n开发了一种先进的农业环境管理系统，它将水分传感器与土壤图像的实时分析相结合以优化灌溉实践 [79]。该系统采用 `VGG-19`\
  \ 深度学习模型对土壤图像类型进行分类，并确定所需的流量。在另一个低成本解决方案中，提出了一种基于 `ESP32-CAM` 平台的微控制器设备，用于监控中心枢轴灌溉系统\
  \ [80]。该设备使用板载摄像头从数字水表获取数据，并使用部署在 `MCU` 上的 `TinyML` 模型处理图像。处理后的结果通过 `LoRaWAN` 传输到中央服务器，便于高效的远程监控和数据管理。\n\
  \n# 10.4.3.5 智能温室\n\n\n\n\n\n温室是一种专门设计的结构，旨在创建一个受控环境以优化植物生长的条件。温度、湿度、光照强度和营养水平等关键环境变量可以精确调节，从而不受外部气候条件的限制，全年种植包括水果、蔬菜和观赏植物在内的作物。\n\
  \n在温室环境中，`TinyML` 提供了巨大的潜力，通过在资源受限的硬件上实现设备侧机器学习，用于实时数据采集、环境监控和预测分析，从而提高作物产量。\n\n\
  一个值得关注的实现涉及一种基于多层感知器（`MLP`）架构的多标签 `TinyML` 模型，专为草莓温室的微气候管理设计[81]。该模型支持对多个环境变量进行细粒度的同步控制，促进作物的最佳生长状态。\n\
  \n另一种创新方法采用了协作系统，它将 `IoT` 设备与边缘节点集成以管理温室灌溉。每个 `IoT` 节点都配备了基于 `decision tree` 的嵌入式\
  \ `TinyML` 模型，可根据本地传感器数据独立评估植物需求。这些决策随后被传输到边缘节点，由边缘节点聚合与特定喷淋器相关的所有传感器输入。边缘节点采用高级别的机器学习模型，根据传感器的集体反馈确定合适的响应，例如“无操作”、“灌溉”或“水肥一体”[82]。\n\
  \n## 10.5 结论\n\n本章对 `TinyML` 进行了全面探索，强调了其新兴的应用、技术挑战和未来方向。通过允许在资源受限的嵌入式设备上部署机器学习模型，`TinyML`\
  \ 为智能车辆、异常检测、智能农业等多个领域开启了创新的解决方案。其优势包括降低延迟、提高能效比和增强隐私保护，这使其成为未来边缘计算的关键技术。\n\n然而，`TinyML`\
  \ 系统的开发和部署仍面临多重挑战，例如针对有限资源优化模型、管理实时数据，以及缺乏用于性能评估和基准测试的标准化工具。提出的解决方案，包括硬件感知编译器、`AutoML`\
  \ 自动化和事件驱动处理，为解决这些障碍提供了广阔的路径。\n\n未来的研究应重点关注完善敏捷开发方法论、培养跨学科专业知识以及建立标准化基准，以促进 `TinyML`\
  \ 的广泛采用。此外，医疗保健、环境监测和智慧城市等领域将从 `TinyML` 的进步中受益，特别是在传统基础设施有限的地区。\n\n总结来说，`TinyML`\
  \ 代表了一种变革性的技术转变，将人工智能与嵌入式系统融合，重塑了我们与数字及物理世界的交互。随着领域的不断演进，`TinyML` 将扩大其应用范围和社会影响力，巩固其作为未来技术创新基石的角色。\n\
