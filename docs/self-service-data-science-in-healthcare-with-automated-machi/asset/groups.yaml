    ![](img/87e48d9f4f7ed15b2cf1b43ac15a4529_1_0.png)


    Figure 1. Self-service data science research in context of related data science
    disciplines.


    The Machine Learning (ML) community has noticed the need to enable access for
    non-expert users to ML techniques. The need to enable non-experts to use machine
    learning is one of the drivers that gave birth to the fast-paced research area
    of AutoML [8], [9]. The AutoML community aims to automate all steps in the process
    of creating a machine learning pipeline. However, to the best of our knowledge,
    no AutoML applications were tested in real-world situations with non-expert users
    in the healthcare domain. Hence our research question is: How can we support the
    knowledge discovery process of domain experts in healthcare using automated machine
    learning? To answer this question, we answer three sub-research questions in Section
    4:


    +   1. Which AutoML method performs best on a benchmark test, given medical datasets?

    +   2. What are the requirements of healthcare professionals for starting to use
    AutoML in their daily practice?

    +   3. How does the selected AutoML method suit healthcare professionals in their
    knowledge discovery process?


    Each question is answered in a subsection of Section 4.


    # ## 2. Overview of AutoML Methods


    In this section, we summarize and categorize the AutoML methods that we found
    during the literature review. In our analysis we only consider the newest versions
    of the methods and only include non-commercial AutoML methods. First, we compare
    two AutoML methods that are developed for the healthcare domain. Second, we discuss
    methods with a fixed pipeline length. Third, we discuss the AutoML methods that
    build neural nets. Fourth, we discuss evolutionary methods. Fifth, we discuss
    distributed methods. Finally, we provide a detailed overview of the AutoML methods
    discussed in this chapter.


    # ### 2.1. Healthcare


    FLASH [10] and AutoPrognosis [11] have both been developed for healthcare or with
    funds for healthcare, but with different incentives. FLASH was developed to improve
    the efficiency of creating and evaluating pipelines. It proposes a two-layer Bayesian
    Network approach to improve search efficiency. AutoPrognosis has recently been
    developed with the practitioner in mind. It follows a principled Bayesian approach
    in all components. AutoPrognosis uses Bayesian model averaging for pipeline construction.
    Meta-learning is used to find similar groups of patients. Both clinical and statistical
    features of datasets are used for Warm-starting. FLASH is a black-box tool, as
    most AutoML tools are. In contrast, AutoPrognosis is the only AutoML method that
    contains an explainer to justify its recommendations to a clinician.


    We cannot compare the performances of both methods, as there is no benchmark test
    available featuring both methods at the time of writing. FLASH tested its performance
    on a medical dataset with the binary classification task of predicting drug non-responders.
    In this case, it outperformed other methods based on TPE and SMAC using error
    rate as the performance metric [10]. AutoPrognosis outperformed Auto-WEKA, Auto-Sklearn,
    and TPOT on multiple datasets in its own comparison with other methods [11].


    # ### 2.2. Fixed Pipelines


    Auto-WEKA [8], [12], Hyperopt-Sklearn [13], Auto-Sklearn [14], PoSH Auto-Sklearn
    [15], and ML-Plan [16] are all methods that have a fixed pipeline length. Auto-WEKA
    searches the search space by a tree-based BO method: SMAC [8], [17]. Hyperopt-Sklearn
    searches the search space is using'
  - '[PAGE 2]


    Hyperopt, which makes use of either random search or Tree Parzen Estimators (TPE)
    with BO [18]. To improve efficiency in search, Hyperopt-Sklearn makes a distinction
    between conditional and non-conditional hyperparameters. Conditional parameters
    always need to be assigned and non-conditional parameters depend on the chosen
    algorithm in the pipeline [13]. PoSH-Auto-Sklearn is an extension of Auto-Sklearn
    method described above and builds on the scikit-learn library. Successive halving
    was introduced in the search process to improve the efficiency of the method.
    In addition to this, they build a portfolio based on OpenML datasets [19], which
    contained meta-information to warm-start the search process. Finally, the ensemble
    technique of Auto-Sklearn was altered to exclude poor performing models. In PoSH
    Auto-Sklearn a model is not added to the ensemble if it performs over 3% worse
    than the best model. ML-plan uses a hybrid approach to construct pipelines. It
    combines the ideas and concepts from two different approaches: the idea of evaluating
    candidates at runtime [8] and the idea of using hierarchical task networks [20]
    for pipeline planning [16]. ML-Plan contributes to the existing knowledge base
    by proposing a two-phase search with HTN and a dedicated system to prevent overfitting.
    The authors of ML-Plan claim to have invented the first AutoML technique that
    prevents overfitting [16].


    PoSH Auto-Sklearn outperforms all other methods as it is the winner of the latest
    AutoML competition at the time of writing [9]. Auto-WEKA, Hyperopt-Sklearn, and
    Auto-Sklearn were the first three methods that were developed to tackle the CASH
    problem. What is noteworthy to observe is that Auto-Sklearn has served as a basis
    for multiple other AutoML systems, whereas the other two methods have not. We
    assume that this is due to the warm-start procedure that is built into Auto-Sklearn.


    # 2.3. Neural Networks


    The first version of AutoNet [21] was the first to automate the configuration
    of a Neural Network. It laid the groundwork for its successor and the inception
    of AlphaD3M [22] and Auto-Keras [23]. Besides laying the groundwork for these
    applications, it incentivised the inception of a lot of commercial applications.
    Most commercial applications that automatically tune Neural Networks are inspired
    by the first version of Auto-Net [9]. This is because Auto-Net was the first AutoML
    program to beat human experts in configuring a pipeline[9], [21].


    AlphaD3M is the only AutoML method that makes use of reinforcement learning and
    is much faster than any other method in the field. In one case, it was 32 times
    faster than TPOT. However, AlphaD3M does not outperform other AutoML methods.
    In comparison with three other methods, its average rank is third, based on mean
    scores. As AlphaD3M ranks first on some datasets, it is still competitive [22].
    It is striking to see if reinforcement learning gets widely adopted as a search
    strategy for pipeline configuration.


    # 2.4. Evolutionary Methods


    Evolutionary methods can create pipelines of flexible length. These are TPOT [24],
    LTPOT [25], RECIPE [26], and Autostacker [27]. They can do so due to their search
    strategy. The downside of evolutionary algorithms is that they can produce invalid
    pipelines and get stuck at local optima. RECIPE and LTPOT have independently overcome
    these downsides. RECIPE uses grammar to overcome this whereas LTPOT uses a maximum
    evaluation time for a pipeline.


    TPOT was a reaction to the fixed-length pipeline methods discussed above. TPOT
    uses Gaussian Processes (GP) to construct pipelines; the building blocks of a
    pipeline are GP primitives to build a tree. These trees are an arbitrary representation
    of the ML pipeline, consisting of multiple datasets, pre-processors, and classification
    operators. Each node uses the output of its preceding node as input. Layered TPOT
    [25] is the successor of TPOT with a focus on improving the efficiency of the
    pipeline generation. It improves efficiency by implementing the idea of an Age
    Layered Population Structure [28] in addition to the original TPOT algorithm.
    RECIPE [26] is an evolutionary method based on GP that makes use of grammar to
    improve its efficiency compared to other GP methods. RECIPE uses grammar to prevent
    the creation of invalid pipelines and focusses on classification tasks. Autostacker
    is an AutoML method that focusses on providing a set of potential useful pipelines
