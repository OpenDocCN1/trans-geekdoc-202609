    Auto-WEKA [8], [12]、Hyperopt-Sklearn [13]、Auto-Sklearn [14]、PoSH Auto-Sklearn
    [15] 和 ML-Plan [16] 都是具有固定管道长度的方法。Auto-WEKA 通过基于树的 BO 方法 SMAC [8], [17] 搜索搜索空间。Hyperopt-Sklearn
    使用 Hyperopt 搜索搜索空间，Hyperopt 使用随机搜索或基于 BO 的 Tree Parzen Estimators (TPE) [18]。为了提高搜索效率，Hyperopt-Sklearn
    区分了条件超参数和非条件超参数。条件参数始终需要赋值，而非条件参数取决于管道中选择的算法 [13]。PoSH-Auto-Sklearn 是上述 Auto-Sklearn
    方法的扩展，并基于 scikit-learn 库。在搜索过程中引入了逐次减半法以提高方法的效率。此外，他们还基于 OpenML 数据集 [19] 构建了一个组合，该数据集包含元信息以热启动搜索过程。最后，Auto-Sklearn
    的集成技术被修改以排除性能不佳的模型。在 PoSH Auto-Sklearn 中，如果模型比最佳模型差 3% 以上，则不会将其添加到集成中。ML-Plan
    使用混合方法构建管道。它结合了两种不同方法的思想和概念：在运行时评估候选者的想法 [8] 和使用分层任务网络 [20] 进行管道规划的想法 [16]。ML-Plan
    通过提出一种基于 HTN 的两阶段搜索和一个专门用于防止过拟合的系统，为现有知识库做出了贡献。ML-Plan 的作者声称发明了第一种防止过拟合的 AutoML
    技术 [16]。


    PoSH Auto-Sklearn 优于所有其他方法，因为它是撰写本文时最新 AutoML 竞赛的获胜者 [9]。Auto-WEKA、Hyperopt-Sklearn
    和 Auto-Sklearn 是为解决 CASH 问题而开发的前三种方法。值得注意的是，Auto-Sklearn 已成为许多其他 AutoML 系统的基础，而另外两种方法则没有。我们认为这是由于
    Auto-Sklearn 中内置的热启动程序所致。


    ### 2.3. 神经网络


    AutoNet [21] 的第一个版本是第一个自动化神经网络配置的系统。它为其继任者以及 AlphaD3M [22] 和 Auto-Keras [23] 的诞生奠定了基础。除了为这些应用程序奠定基础之外，它还激励了许多商业应用程序的诞生。大多数自动调整神经网络的商业应用程序都受到
    Auto-Net 第一个版本的启发 [9]。这是因为 Auto-Net 是第一个在管道配置中击败人类专家的 AutoML 程序 [9], [21]。


    AlphaD3M 是唯一使用强化学习的 AutoML 方法，并且比该领域的任何其他方法都快得多。在一个案例中，它比 TPOT 快 32 倍。然而，AlphaD3M
