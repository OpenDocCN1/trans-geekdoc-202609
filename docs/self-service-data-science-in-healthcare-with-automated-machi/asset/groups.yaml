    ## 4.2. AutoML 需求评估


    我们以用户故事的形式收集了领域专家的二十一项需求，部分内容如附录 B 所示。这些文本捕捉了产品最终用户所期望的功能及其期望的原因。用户故事分为四个类别：用户交互、模型构建、模型使用和模型解释。我们仅考虑参与基准测试的
    AutoML 方法，以便与用户故事进行比较。此外，我们只包括至少有两名参与者提到的用户故事，剩下十五个用户故事。对于用户故事，我们使用 Cohen [42]
    的模板：“作为 <用户类型>，我希望 <目标>，[以便 <某些原因>]。”表 A1 提供了两个或多个受访者请求的收集用户故事。


    在用户交互（UI）类别中，有关 AutoML 工件的用户故事有三个。这些故事存在冲突，五名领域专家中有两名偏好使用代码进行分析，以便对正在发生的事情有更多控制，例如：“我喜欢
    SPSS 的语法功能，而非其点击操作”。相比之下，另外两名领域专家偏好使用图形用户界面，因为微小的代码错误会花费大量时间来解决，例如：“只要一个界面？那太棒了！”。


    在模型构建（MC）类别中，有五个用户故事。自动模型配置以及设置时间预算的可能性涵盖在 AutoML 的概念中，例如：“使用 R 有点过于远离我的兴趣”。仅使用逻辑回归的限制只能由
    TPOT 和 Auto-WEKA 满足，例如：“如果你不使用它（逻辑回归），那么审稿人不知道发生了什么，因此他们会拒绝你的论文。并非因为它不好，只是因为他们不理解它”。Auto-sklearn
    和 TPOT 是满足关于处理缺失数据解释要求的方法。关于在实践中使用创建的模型（MU）只有一个用户故事。所有评估的 AutoML 方法都支持在未见数据上使用创建的模型。


    一半以上的用户故事涉及模型解释（MX）。领域专家关心哪些变量重要、模型的统计功效是什么以及模型创建过程中做出了哪些决策，例如：“准确性是一回事，但它的可解释性如何？”。然而，没有任何评估的
    AutoML 方法能够满足这些要求中的任何一项。可以在工件中集成对创建的模型的比较和回归的解释。


