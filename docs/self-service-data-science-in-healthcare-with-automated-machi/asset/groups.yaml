    在收集需求后，我们发现研究者-医生在研究中偏好创建逻辑回归模型。我们发现，以我们评估的方式使用 AutoML 并不是为研究者-医生创建模型的最佳方式，原因有多种。首先，AutoML
    源自 CASH 问题。如果算法类型已预先选择，AutoML 只能对 HPO 有所贡献。由于逻辑回归只有两个超参数 [8]，我们质疑使用 AutoML 来调整这些超参数的必要性。


    其次，即使我们在模型构建中取消逻辑回归的约束，之前的研究也发现其他机器学习模型在医学研究中并不显著优于逻辑回归模型 [45]。即使我们取消逻辑回归模型约束，由于
    Christodoulou 等人的研究结果，我们仍然怀疑 AutoML 的可用性，尽管其他研究人员在通用数据集上没有发现相同的结果 [46]、[47]。


    第三，所测试的 AutoML 方法没有提供变量重要性的解释。由于模型可解释性和变量重要性是研究者-医生的基本要求，这使得 AutoML 在当前形式下不适用。如果给定的解释令人满意，AutoML
    在研究中可能有用。关于变量重要性的更多内容可在下方未来研究部分中找到。如果 AutoPrognosis 能够兑现其承诺，考虑到模型解释方面的用户故事，它可能是一项有前景的技术。


    第四，TPOT 创建的管道没有结构；这可能导致非常复杂的管道，包含三个或四个逻辑回归模型，它们都互相将结果作为输入。这些构造对于领域专家来说很难理解，如果我们像在
    RECIPE [26] 中那样使用语法来表示管道。该语法可以帮助为研究者-医生创建更易于理解的管道。另一种选择可能是基于 BO 的固定管道方法。尽管它们在基准测试中表现较差，但如果其结果对研究者-医生更有意义，则可以弥补这一点。最后，我们了解到，在文献与实践之间，研究者-医生的机器学习知识水平存在差距。关于
    AutoML 的文献指出，AutoML 旨在帮助非专家用户使用机器学习技术 [8]。然而，我们发现大多数非专家用户没有编程知识或教育。因此，目前的 AutoML
    技术产品对医疗保健领域的非专家用户来说仍然过于技术化。


    ### 5.1.2. 医疗分析出版物中的偏差


    在本研究过程中，我们遇到的关于医疗保健分析的大多数出版物都发表了正面结果。[48] 也注意到这一点：需要发表每一个正面结果，但没有真正的测试来评估 ML 解决方案在医疗保健中的价值。如果我们将
    Christodoulou 等人 [45] 的研究结果加上 ML 模型在医学研究中并不显著优于传统方法这一事实，我们发现已发表内容与改善医疗保健之间存在差异。因此，我们认为，对于开发医疗保健分析的准确方法有帮助，应该发表那些不能提供直接效益的结果。这样一来，研究资助可以用于改进在医疗保健中尚未有效工作的方法，或用于研究解决同一问题的不同方法。当负面结果不被发表时，我们担心研究人员反复造轮子，从而浪费研究资金并阻碍研究和创新。


    ### 5.2. 效度


    在本节中，我们讨论本研究中数据收集和分析的“主观”性质 [49]。为评估本研究的效度，我们采用 Burke Johnson [50] 提出的定性研究五个效度方面中的三个。我们不讨论理论效度，因为设计科学研究的目标是产物创建而非理论创建。我们不旨在解释某个现象。我们也不讨论内部效度，因为我们不旨在回答关于因果现象的问题。本研究的主要研究问题是一个“如何”问题。


    ### 5.2.1. 描述性效度


    描述性效度关乎研究人员报告的事件叙述的事实准确性 [50]。由于本研究由单一研究人员进行，因此数据收集存在偏差。研究人员天生具有主观性，其数据收集和分析亦是如此
    [49]。此外，研究人员与参与者之间的关系会显著影响参与者向研究人员透露的内容 [51]（第 11–30 页）。为缓解这一效度威胁，我们使用框架来设计半结构化访谈，并使用设计科学评价框架来设计产物评价。我们记录了与参与者的所有互动，并参加会议以获取对我们研究的同行反馈，以提高描述性效度。


    ### 5.2.2. 解释性效度


    解释性效度是关于准确描绘参与者对所研究对象所赋予的意义 [50]。为缓解这一威胁，我们已将收集到的用户故事发送给参与者，以获取对我们研究结果的反馈 [49]。此外，我们通过利用其他来源来确认研究结果，使用了数据三角测量。为确保我们很好地描绘了参与者的意义，我们在引用本研究参与者时使用了低推论描述符
    [50]。


    ### 5.2.3. 外部效度


    如果我们希望将研究结果推广到更广泛的人群，外部效度至关重要 [50]。尽管推广性不是本研究的主要目的，但我们将涉及该主题。由于本研究进行的是个案研究，推广其研究结果的最佳方法是寻找主体、对象和问题之间的相似性
    [52]。由于样本量和特征不适合推广性，推广研究结果的最佳方法是识别其他情境中的相似性。使样本不适合推广到医疗专业人员的特征是参与者所在的医疗领域有限，以及所有参与者均自愿决定参与。因此，本研究得出的见解难以推广，但可能成为未来研究的垫脚石。


    ## 6. 结论


    本研究的主要问题是“如何通过应用自动化机器学习来支持医疗保健专业人员的知识发现过程？”。我们发现，当使用 TPOT 作为 AutoML 方法时，AutoML
    目前仅适用于 CRISP-DM 方法的数据理解阶段。TPOT 在基准测试中与 Auto-Sklearn 一起表现最佳，但满足的要求比 Auto-Sklearn
    更多。尽管所评估的 AutoML 方法能够进行建模和数据预处理，但它们缺少对建模过程中决策的解释。医学知识发现的一部分是找到医学事件的原因。由于建模决策未共享且结果中缺乏变量重要性，AutoML
    不支持新知识的发现。然而，领域专家指出，他们看到为其数据集自动查找其他可能评分的附加价值。此外，他们提到 AutoML 可以帮助他们在知识发现过程的数据理解阶段了解自己的数据。


    ## 7. 未来研究


    在本节中，我们讨论三种未来研究的可能性，首先讨论 AutoML 创建模型的模型不确定性。其次，讨论 AutoML 方法的潜在新用例。最后，讨论可解释性作为未来研究的方向。


    ### 7.1. AutoML 模型不确定性


    AutoML 提出的优势之一是所创建 ML 管道的可重复性 [8]、[9]、[12]。然而，这些作者指出，使用 AutoML 方法创建 ML 管道的结果取决于分配给
    AutoML 方法的时间预算。此外，基于 EA 的 AutoML 方法从随机种群开始。因此，除非显式设置种子，否则很难重现单次运行的结果。[53] 在医疗背景下调查了模型不确定性。他们发现，更改种子就像影响单个患者预测结果一样。因此，我们认为应在医疗领域开展更多关于
    AutoML 管道稳定性的研究。


    ### 7.2. AutoML 用例


    在第 2 节的综合中，我们解释 AutoML 适用于调制神经网络以及创建分类和回归模型。在医疗保健中，图像识别和自然语言处理是机器学习应用潜力最大的领域 [48]。由于研究者-医生在图像识别和自然语言处理中比在传统研究中更容易接受黑盒，这些机器学习任务可能更适合使领域专家在医疗保健中使用
    AutoML。因此，我们认为，如果我们希望加速医疗保健中分析的采用，AutoML 用例的范围可以扩展到 NLP 和图像识别任务。


    ### 7.3. AutoML 可解释性


    如第 5 节所指出，机器学习模型的可解释性对于医疗保健领域专家采用至关重要 [54]。Molnar [55] 认为，机器学习可解释性对黑盒算法在各个领域的采用至关重要。在医疗保健中，这一采用障碍更高，因为能够解释决策是医疗文化的一部分，并且对医患互动至关重要。因此，AutoML
    方法必须对非专家用户更具可解释性。可解释性技术应与模型无关。这样一来，该技术适用于所有由


