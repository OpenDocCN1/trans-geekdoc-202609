    ## 4.3. 工件评估


    基于用户故事，我们创建了两个工件，以自动化 CRISP-DM [44] 的数据准备阶段的一部分和完整的建模阶段。数据准备活动涉及包含或排除变量、缺失值的数据插补以及将分类变量重新编码为数值变量的可能性，因为
    TPOT 无法处理非数值数据作为输入。由于用户交互需求存在冲突，我们设计了两个功能相同但用户界面不同的工件。这些工件可用于创建逻辑回归模型，不会编码的用户也应该能够使用这些工件。工件包含缺失数据处理的描述，以及比较不同模型的可能性。


    这两个工件分别是一个 Flask Web 应用程序（GUI 工件），以满足对图形用户界面的偏好，以及一个 Jupyter 笔记本（代码工件），以满足对编码的偏好，分别如附录
    C 中的图 C1–C3 所示。Web 应用程序和 Jupyter 笔记本的源代码可在此 URL 查阅：[此 URL](https://github.com/richooms/healthcare_automl)。


    采用设计科学评估框架 [40] 中的风险与效能策略。我们根据用户故事类别创建了一组精炼假设，以便与领域专家一起评估工件。假设可在附录 D 中查阅。对于用户交互，我们测试了四个元素：上传数据集、创建子集、应用程序的工作流程以及工作流程说明。仅在上传数据集时偏好
    GUI 工件。对于所有其他操作，偏好代码工件，因为受访者感觉对流程更有掌控力。模型构建类别中的模型构建及模型构建进度报告也是如此。模型解释类别包括比较不同结果、缺失数据处理说明以及可读性。在此类别中，除了缺失数据处理说明外，工件
    A 在所有交互中均优于工件 B。偏好和类别的概览可在表 4 中查阅。偏好列显示了工件交互中该部分所偏好的工件类型。得分列表示有多少受试者持有该偏好。


    我们发现，受访者偏好使用这两个工件的混合版本来与 AutoML 进行交互。为了在创建模型的过程中保持控制，他们偏好编码；对于上传数据集或比较结果等相对简单的任务，他们偏好图形用户界面。此外，TPOT
    需要解释变量重要性，才能在其研究实践中可用，因为领域专家将其视为采用 AutoML 的必备功能。

