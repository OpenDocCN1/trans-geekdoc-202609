    图 2. AutoML 方法概览。


    ## 3. 研究方法


    我们使用设计科学研究框架 [30] 来回答研究问题。为此，我们首先使用 Gijsbers 及其同事的框架 [31] 对 OpenML100 [32] 中所有可用的医学数据集进行了基准测试，以找出是否有一种
    AutoML 方法在医学任务中表现最佳。我们在四个数据集上运行了医学二分类任务：乳腺癌 [33]、糖尿病 [34]、印度肝病患者 [34] 和 Sick 数据集
    [35]。所有选定的方法在十倍交叉验证设置中都获得了一小时的时间预算，以在给定数据集上创建最佳管道。时间限制设定为一小时，因为更长的运行并不能显著提供更好的结果
    [31]，这一发现在我们的实验中也得到了证实。为了对基准测试中 AutoML 方法的性能进行基准化，我们添加了决策树和常数预测器。遵循 Gijsbers 等人
    [31]，我们使用受试者工作特征曲线下面积（AUROC）进行评分。所有测试都在 Amazon Web Services 上使用 m5.2xlarge 机器（32
    GB 内存，8 vCPU）运行（Intel Xeon Platinum 8000 系列 Skylake-SP 处理器，所有核心持续 Turbo CPU 时钟速度高达
    3.1 GHz）。使用的操作系统是 Amazon Linux (https://aws.amazon.com/ec2/instance-types/m5/)，以获得
    AutoML 方法所需的恒定环境和足够的计算能力。在我们的研究中，我们只使用基准集中可用的 AutoML 方法，以创造一个公平的竞争环境。因此，本研究未考虑任何工业工具。


    为了了解领域专家的需求，我们使用半结构化访谈来获取需求。我们选择半结构化访谈作为需求获取的最佳方法，有三个原因。首先，半结构化访谈被认为是需求获取最有效的方式
    [36]。其次，它是医疗保健领域进行定性研究的一种公认方法 [37]。第三，半结构化访谈有助于获取人们自己的观点，并发现研究者先前未曾考虑过的问题或担忧 [38]。对于我们的访谈，我们遵循访谈研究指南
    [39] 构建了访谈议定书。样本包括五名活跃于荷兰一家地区医院科学部门的领域专家。受访者自愿决定参与，并在荷兰非学术医院中担任不同角色并拥有不同医学专业知识。受访者活跃于癌症、骨科和心脏病学研究领域，并全职或兼职参与医学研究。样本包括三名女性和两名男性。我们评估了
    AutoML 方法的能力与领域专家需求的匹配程度。基于需求，我们创建了两个工件，并与受访者一起对其进行了评估。第一个工件具有图形用户界面，第二个工件具有基于代码的界面。我们使用人工总结性评估作为评估设计科学研究框架的一部分
    [40]。我们根据先前研究问题中的用户故事类别对工件进行了评估。为了评估工件属性，我们使用了精炼假设 [41]。


    ## 4. 结果


    本节描述了基准测试、需求评估和工件评估的结果。


    ### 4.1. 基准测试


    基准测试使用了一小时的时间预算进行，总计算时间为 160 小时。图 3 包含结果的可视化；数据集位于 X 轴，Y 轴显示 AUROC 得分。彩色点标记了每个
    AutoML 方法在每十个折叠上的得分。Kruskal–Wallis H 检验表明，AutoML 方法之间在乳腺癌（H = 11.36，p < 0.001）、糖尿病（H
    = 18.64，p < 0.001）、肝脏（H = 17.93，p < 0.001）和 Sick 数据集（H = 27.87，p < 0.001）上的分布存在统计学显著差异，统计数据见表
    1。


    表 1. Kruskal–Wallis 检验统计数据。


    | | 乳腺癌 | 糖尿病 | 肝脏 | Sick |

    |---|---|---|---|---|

    | H 统计量 | 11.36 | 18.64 | 17.93 | 27.87 |

    | P 值 | 0.995 ** | 0.324 ** | 0.455 ** | 0.386 ** |


    ** p < 0.001。


    图 3 值得注意的一点是，在肝脏数据集上，决策树和 Hyperopt-Sklearn 不总是优于常数预测器。在糖尿病数据集上，Hyperopt-Sklearn
    相比其他三种方法落后，但其表现优于常数预测器，且与决策树的性能相似。在乳腺癌数据集上，所有 AutoML 方法在至少一个折叠中都获得了最高分。鉴于其中位数得分和分布，所有方法在乳腺癌集上均表现良好。决策树的性能表明这并非一个困难的预测问题。对于
    Sick 数据集的结果，我们看到 TPOT 和 Auto-Sklearn 优于其他


    ![](img/87e48d9f4f7ed15b2cf1b43ac15a4529_5_0.png)


    图 3. 一小时基准测试结果。


    两种方法在预测的一致性和得分方面都优于其他两种方法，尽管该数据集存在缺失值。Hyperopt-Sklearn 再次不优于决策树。


    总体而言，TPOT 在除乳腺癌数据集外的所有数据集上运行一小时后记录了最高中位数得分，而在乳腺癌数据集中，autosklearn 记录了最佳中位数性能。Mann–Whitney
    U 检验表明，autosklearn 在乳腺癌集上显著优于决策树（U = 2.0，p < 0.001）和 hyperoptsklearn（U = 17.5，p
    < 0.01）。TPOT 在糖尿病（U = 0.0，p < 0.001）、肝脏（U = 8.0，p < 0.001）和 Sick（U = 0.0，p < 0.001）数据集上显著优于决策树。此外，TPOT
    在糖尿病（U = 2.0，p < 0.001）、肝脏（U = 7.0，p < 0.001）和 Sick（U = 0.0，p < 0.001）数据集上显著优于
    hyperoptsklearn。最后，TPOT 在 Sick 数据集上显著优于 AutoWEKA（U = 0.0，p < 0.001）。这可能是因为 AutoWEKA
    不会为缺失值插补数据。Autosklearn 和 TPOT 会为缺失数据插补值，并且结果显著更好。Mann–Whitney U 检验的统计数据可在表 2 中查阅。表格显示了每种方法与每个数据集上表现最佳的方法相比的
    p 值和 U 统计量。TPOT 和 autosklearn 在任何数据集上的性能均无显著差异。


    从基准测试中可以得出结论，没有一种方法始终优于所有其他方法。然而，我们看到 TPOT 在本次测试的四个任务中的三个任务上记录了最高中位数得分，但这种性能并不显著优于其他方法的性能。Autosklearn
    和 AutoWEKA 与 TPOT 取得了相似的结果，只有 AutoWEKA 在 Sick 数据集上被超越。


    表 2. 与最佳表现者相比的 Mann–Whitney U 检验 p 值和 U 统计量。


