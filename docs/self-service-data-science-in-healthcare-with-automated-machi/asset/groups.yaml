    ## 基于自动化机器学习的医疗保健自助式数据科学


    **Richard Ooms 和 Marco Spruit**


    Department of Information and Computing Sciences, Utrecht University, The Netherlands;

    r.l.j.ooms@students.uu.nl

    * 通讯作者：m.r.spruit@uu.nl。


    收稿日期：2020年3月3日；录用日期：2020年4月21日；出版日期：2020年4月25日


    **摘要：** (1) 背景：本文研究了研究者-医师能否以及如何通过采用自动化机器学习（AutoML）在其知识发现过程中获得支持。（2）方法：我们采用设计科学研究方法，基于基准测试和研究者-医师的需求，将基于树的管道优化工具（TPOT）选为
    AutoML 方法。随后，我们将 TPOT 集成到两个工件中：一个 Web 应用程序和一个笔记本。我们与研究者-医师一起评估这些工件，以考察哪种方法最适合研究者-医师。两个工件具有相似的工作流程，但由于需求冲突，用户界面不同。（3）结果：工件
    A（一个 Web 应用程序）被认为在上传数据集和比较结果方面更好。工件 B（一个 Jupyter 笔记本）被认为在工作流程以及对模型构建的控制方面更好。（4）结论：因此，混合工件对于研究者-医师来说将是最佳。然而，两个工件都缺乏对其创建模型的模型可解释性和变量重要性解释。因此，医疗保健领域
    AutoML 技术的部署目前仍局限于探索性数据分析阶段。


    **关键词** 自动化机器学习；应用数据科学；自助式数据科学；医疗保健分析


    ## 1. 引言


    回顾医疗保健数据分析现状的文献后显而易见，医疗保健领域分析的应用仍有很大进步空间 [1], [2]。取得进步的一种方式是自动化医疗保健中的知识发现过程 [1]。自动化知识发现过程可以通过让领域专家使用自适应分析系统中的最先进技术参与该领域的知识发现，从而提高分析的采用率，尤其是考虑到医疗保健中可用的数据量。电子健康记录（Electronic
    Health Record，EHR）的引入加速了此前不可用数据集的数字化。将这些可用的 EHR 数据与分析相结合，通过使数据可用于自动处理，有望改善医疗保健行业
    [3]。


    自助式数据科学的概念首次在 [4] 中描述，并被定义为 *“一门工程学科，其中分析系统被设计和评估，以使领域专业人员能够以可靠、可用和透明的方式，在其日常实践中无需编码即可在其自身数据源上执行自己的数据分析”*
    [5]。**图 1** 将自助式数据科学研究置于相邻数据科学学科的背景下。既连接纯粹基础研究也连接纯粹应用研究过程，应用数据科学 [6] 和自助式数据科学研究都追求转化（例如，面向应用）的研究过程，通常将
    CRISP-DM 作为首选的知识发现过程 [7]。


    ![](img/87e48d9f4f7ed15b2cf1b43ac15a4529_1_0.png)


    图 1. 相关数据科学学科背景下的自助式数据科学研究。


    机器学习（ML）社区已经意识到需要让非专家用户使用 ML 技术。让非专家使用机器学习的需求是催生 AutoML 这一快速发展的研究领域的驱动力之一 [8],
    [9]。AutoML 社区旨在自动化创建机器学习管道的所有步骤。然而，据我们所知，没有 AutoML 应用程序在医疗保健领域与非专家用户的实际场景中进行过测试。因此，我们的研究问题是：如何利用自动化机器学习支持医疗保健领域领域专家的知识发现过程？为了回答这个问题，我们在第
    4 部分回答三个子研究问题：


    - 1. 在给定医疗数据集的情况下，哪种 AutoML 方法在基准测试中表现最佳？

    - 2. 医疗保健专业人员开始在日常实践中使用 AutoML 的需求是什么？

    - 3. 所选的 AutoML 方法如何适应医疗保健专业人员的知识发现过程？


    每个问题在第 4 部分的一个小节中得到解答。


    ## 2. AutoML 方法概览


    在本节中，我们总结和分类了文献综述中找到的 AutoML 方法。在我们的分析中，我们只考虑方法的最新版本，并且只包括非商业 AutoML 方法。首先，我们比较两个为医疗保健领域开发的
    AutoML 方法。其次，我们讨论固定管道长度的方法。第三，我们讨论构建神经网络的 AutoML 方法。第四，我们讨论进化方法。第五，我们讨论分布式方法。最后，我们对本章讨论的
    AutoML 方法提供详细概览。


    ### 2.1. 医疗保健


    FLASH [10] 和 AutoPrognosis [11] 均为医疗保健领域或使用医疗保健资金开发，但激励因素不同。FLASH 是为了提高创建和评估管道的效率而开发的。它提出了一种两层贝叶斯网络方法来提高搜索效率。AutoPrognosis
    最近是以执业者为中心开发的。它在所有组件中都遵循原则性贝叶斯方法。AutoPrognosis 使用贝叶斯模型平均来构建管道。元学习用于寻找相似的患者群体。数据集的临床特征和统计特征都用于热启动。FLASH
    是一个黑盒工具，就像大多数 AutoML 工具一样。相比之下，AutoPrognosis 是唯一包含解释器以向临床医生证明其推荐理由的 AutoML 方法。


    我们无法比较两种方法的性能，因为在撰写本文时，没有同时包含这两种方法的基准测试可用。FLASH 在一个医疗数据集上测试了其性能，任务为二元分类，即预测药物非反应者。在这种情况下，它以错误率为性能指标，优于基于
    TPE 和 SMAC 的其他方法 [10]。AutoPrognosis 在与其他方法的自身比较中，在多个数据集上优于 Auto-WEKA、Auto-Sklearn
    和 TPOT [11]。


