  md: '# 4.2. AutoML Requirements Evaluation


    We elicited twenty-one requirements of domain experts in the form of user stories,
    as shown in part in Appendix B. These are texts that capture a desired functionality
    and a reason for the desire from the end-users of a product. The user stories
    are categorized in four categories: User interaction, model construction, model
    usage and model explanation. We only consider the AutoML methods that participated
    in the benchmark test for comparison with user stories. Furthermore, we only include
    user stories that were mentioned by at least two participants, leaving us with
    fifteen user stories. For user stories, we use the template of Cohen [42]: “As
    a <type of user>, I want <goal>, [so that <some reason>].” Table A1 provides the
    collection of elicited user stories that are requested by two or more interviewees.


    There are three user stories in the user interaction (UI) category with the AutoML
    artefact. These are in conflict, two out of five domain experts prefer to use
    code to do their analysis, so they have more control over what is happening, e.g.,
    “I like SPSS for its syntax function, not so much for its clicking”. In contrast,
    two other domain experts prefer to have a GUI, as small coding errors cost a lot
    of time to solve, e.g., “Just an interface? That would be great!”.


    For model construction (MC) there are five user stories. Automatic model configuration
    as well as the possibility to set a time budget is covered by the concept of AutoML,
    e.g., “Using R is a bit a too far removed from my interests”. The restriction
    of only using logistic regression can only be satisfied by TPOT and AutoWEKA,
    e.g., “If you do not use it (logistic regression), then the reviewers do not know
    what is happening, so they reject your paper. Not because it is bad, just because
    they do not understand it”. Autosklearn and TPOT are the methods that satisfy
    the requirement of an explanation on handling missing data. There is only one
    user story about using the created model in practice (MU). Using the created model
    on unseen data is supported by all assessed AutoML methods.


    Over half of the user stories are about model explanation (MX). The domain experts
    are interested in what variables are important, what the statistical power of
    a model is and what decisions are made during model creation, e.g., “Being accurate
    is one thing, but how explainable is it?”. However, none of the assessed AutoML
    methods could satisfy any of these requirements. It is possible to integrate comparison
    of created models and an explanation of regression in the artefacts.


    The word cloud in Figure 4 illustrates the need for an explanation of the variables
    and understanding of the process of creating a model. The word cloud is made from
    the transcripts of the answers to the why questions on the individual evaluations
    of the interviewees. The words variable, model, happening, explanation, control
    and understanding all stand out. Most interviewees do not consider the output
    of TPOT as a model, e.g., “It does not show an answer to my question. I do not
    consider this a model.” We noted that the interviewees only wanted logistic regression
    models, which limits the power of using AutoML methods. Furthermore, it was evident
    that the interviewees wanted to keep in control of creating the model. Without
    the rationale of the AutoML method on the creation of the model they considered
    it useless. There was no trust in the method as it was so opaque. In addition
    to that it was unhelpful that the subjects found the machine output of the model
    unreadable. This was due to the fact that there was no description of importance
    of variables.


