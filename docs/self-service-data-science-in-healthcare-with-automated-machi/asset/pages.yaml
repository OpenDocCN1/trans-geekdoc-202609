    # 2.5. Distributed Methods


    Two AutoML methods can process data in a distributed matter: Autostacker [27]
    and ATM [29]. It is remarkable, that there are only two systems that can run in
    a distributed manner, when taking the computing cost of creating a pipeline in
    mind. Autostacker can use parallel processing as it proposes the best pipelines
    to its user. Hence it needs the performance scores of the pipelines. ATM is the
    only method which can run in parallel on different machines and is set up to be
    distributed and scalable. ATM is developed to support a multi-user machine learning
    platform in a cloud or cluster. The aim is to provide standardized abstractions
    in a library to become as influential for the AutoML community with a library
    as scikit-learn is to the machine learning community [29]. The development of
    ATM and integration with the methods described above is one of the most attractive
    developments in AutoML. An incentive to spur this development could be having
    a separate performance challenge for distributed AutoML methods.


