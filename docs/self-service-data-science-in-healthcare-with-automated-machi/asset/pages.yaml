  md: 'AutoML methods in the benchmark test, we added a decision tree and a constant
    predictor. Following Gijsbers et al. [31], we used Area Under the Receiver Operator
    Curve (AUROC) for scoring. All tests have been run on Amazon Web Services using
    m5.2xlarge machines (32 GB memory, 8 vCPUs (Intel Xeon Platinum 8000 series Skylake-SP
    processor with a sustained all core Turbo CPU clock speed of up to 3.1 GHz). The
    OS used is Amazon Linux (https://aws.amazon.com/ec2/instance-types/m5/) to get
    constant circumstances and enough computing power for the AutoML methods. In our
    research we only used the AutoML methods available in the benchmark set to create
    an even playing field. Hence, no industrial tools were considered in this research.


    To understand the needs of domain experts we elicited requirements using semi-structured
    interviews. We selected semi-structured interviews as the best method for requirements
    elicitation for three reasons. First, semi-structured interviews are considered
    to be the most effective way for requirements elicitation [36]. Second, it is
    an accepted method for conducting qualitative research in healthcare [37]. Third,
    semi-structured interviews have the benefits of eliciting people’s own views and
    uncovering issues or concerns that have not been considered beforehand by the
    researcher [38]. For our interviews, we constructed an interview protocol following
    the guidelines for interview research [39]. The sample consisted of five domain
    experts who were active in the scientific department of a regional hospital in
    the Netherlands. The interviewees have decided to participate voluntarily and
    hold different roles and medical expertise within non-academic hospitals in the
    Netherlands. The interviewees are active in the research fields of cancer, orthopedy,
    and cardiology and participate in medical research, either full-time or part-time.
    The sample consists of three women and two men. We evaluated the capabilities
    of the AutoML methods to the requirements of the domain experts. Based on the
    requirements we created two artefacts and evaluated these with the interviewees.
    The first artefact had a graphical user-interface, the second artefact had a code-based
    interface. We used artificial summative evaluation as part of the framework for
    evaluating design science research [40]. We evaluated the artefacts on the user
    story categories from the previous research question. To be able to evaluate the
    artefact properties, we used refined hypotheses [41].


