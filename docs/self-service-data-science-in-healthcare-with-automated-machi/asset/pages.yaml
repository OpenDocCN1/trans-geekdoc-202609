- pgno: 11
  md: 'the AutoML methods [56]. To improve the interpretability of AutoML models we
    propose three areas for further research on the interpretability of AutoML: Surrogate
    models, Local Interpretable Model-agnostic Explanations (LIME) [55] and Shapley
    values [57]. However, others argue that we should improve the trust in artificial
    intelligence in healthcare rather than improving the interpretability. If the
    trust is high enough, the researcher-physicians will start using the black boxes
    [58]. Most researcher-physicians also do not precisely know how a car works. However,
    they still use cars in their daily lives. We believe that the addition of interpretability
    will ignite the adoption rate of AutoML methods in healthcare and other sectors
    to enable self-service data-science.


