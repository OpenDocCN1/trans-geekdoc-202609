    # 6. Conclusions


    The main research question of this study was “How can we support healthcare professionals
    in their knowledge discovery process by applying Automated machine learning?”.
    We found that AutoML is currently only suitable for the data understanding phase
    of the CRISP-DM method when using TPOT as AutoML method. TPOT performed best on
    the benchmark test along with Auto-Sklearn, but satisfied more requirements than
    Auto-Sklearn. Although the assessed AutoML methods are capable of modelling and
    data pre-processing, it misses an explanation for the decisions made in the modelling
    process. Part of medical knowledge discovery is finding the cause of a medical
    event. Because modelling decisions are not shared and variable importance is absent
    in the result, AutoML does not support the discovery of new knowledge. However,
    the domain experts point out that they see the added value of automatically finding
    other possible scores for their datasets. Furthermore, they mention that AutoML
    can help them in getting an understanding of their data in the data understanding
    phase of their knowledge discovery process.


    # 7. Future Research


    In this section we discuss three possibilities for future research, first we discuss
    model uncertainty of AutoML created models. Second, we discuss possible new use-cases
    for AutoML methods. Finally, we discuss interpretability as a direction for future
    research.


    # 7.1. AutoML Model Uncertainty


    One of the benefits that are proposed by AutoML is the reproducibility of created
    ML pipelines[8], [9], [12]. However, these authors state that the outcome of the
    creation of an ML pipeline with an AutoML method is dependent on the time budget
    allocated to the AutoML method. Besides that, EA based AutoML methods start with
    a random population. Thus, it is harder to reproduce the result of a single run
    without explicitly setting the seed. [53] investigated model uncertainty in a
    medical context. They have found that as much as changing the seed can influence
    the prediction outcome for an individual patient. Hence, we argue that there should
    be more research on the stability of AutoML pipelines in the medical domain.


    # 7.2. AutoML Use Cases


    In our synthesis in Section 2, we explain that AutoML is applicable for tuning
    neural networks and creating classification and regression models. In healthcare,
    the fields with the most significant potential for the application of ML are image
    recognition and natural language processing [48]. Because researcher-physicians
    accept black boxes in image recognition and natural language processing more than
    in traditional research, these ML tasks might be better suited to enable domain
    experts to work with AutoML in healthcare. Hence, we argue that the scope of AutoML
    use-cases could be widened to NLP and image recognition tasks if we want to accelerate
    the adoption of analytics in healthcare.


    # 7.3. AutoML Interpretability


    As pointed out in Section 5, the explainability of ML models is crucial to adoption
    for domain experts in healthcare [54]. Molnar [55] argues that ML interpretability
    is crucial to the adoption of black-box algorithms in every sector. In healthcare,
    this barrier to adoption is even higher, as being able to explain decisions is
    part of the medical culture and vital to patient-doctor interaction. Hence, AutoML
    methods must become more interpretable for non-expert users. The interpretability
    technique should be model agnostic. In that way, the technique is suitable for
    all pipelines created by'
