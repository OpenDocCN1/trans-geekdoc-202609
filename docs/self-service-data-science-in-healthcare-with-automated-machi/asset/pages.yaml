    # 3. Research Method


    We used the Design Science research framework [30] to answer the research questions.
    To do so, we first performed a benchmark test using the framework of Gijsbers
    and colleagues [31] on all available medical datasets from the OpenML100 [32]
    to find out if one AutoML method performed best on medical tasks. We ran medical
    binary-classification tasks on four datasets: Breast cancer [33], Diabetes [34],
    Indian Liver Patient [34], and Sick dataset [35]. All selected methods received
    a time budget of one hour in a 10-fold cross-validation set-up to create the best
    pipeline on the given datasets. The time limit is set on one hour, as longer runs
    do not significantly provide better results [31], a finding that was also confirmed
    during our experiments. To baseline the performance of the'
