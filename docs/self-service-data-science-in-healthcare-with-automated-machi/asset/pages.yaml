  md: 'AutoML aims to aid non-expert users of ML techniques [8]. However, we find
    that most non-expert users have no knowledge or education in programming. Hence,
    the current offering of AutoML techniques are still too technical for non-expert
    users in healthcare.


    # 5.1.2. Bias in Medical Analytics Publications


    Most publications about healthcare analytics that we have come across during this
    research, have all published a positive result. [48] noticed the same: there is
    a need to publish every positive result, but there are no real tests for the value
    of ML solutions in healthcare. If we add the findings of Christodoulou et al.
    [45] to the fact that ML models do not perform significantly better than traditional
    methods in medical research we find a discrepancy between what is published and
    what is improving healthcare. Hence, we think that it would be helpful for the
    development of accurate methods for analytics in healthcare to publish results
    that do not provide a direct benefit. In this way, funding for research can be
    either used for improving methods that do not yet work in healthcare or in researching
    different methods for solving the same problem. When negative results are not
    published, we fear a waste of research funding by researchers continually reinventing
    the wheel and thus stalling research and innovation.


    # 5.2. Validity


    In this section, we address the “subjective” nature of the data collection and
    analysis of this research [49]. To assess the validity of this study, we look
    at three of the five aspects of validity for qualitative research, as proposed
    by Burke Johnson [50]. We do not discuss theoretical validity as the goal of design
    science research is on artefact creation instead of theory creation. We do not
    aim to explain a phenomenon. We also do not discuss Internal validity, as we do
    not aim to answer a question about a causal phenomenon. The main research question
    of this research is a “how”-question.


    # 5.2.1. Descriptive Validity


    Descriptive validity is on the factual accuracy of the account of events as reported
    by the researcher [50]. As a single researcher has conducted this research, hence
    there is a bias in data collection. A researcher is subjective by nature, and
    so are his data collection and analysis [49]. Besides that, the relationship between
    the researcher and participants significantly influences what the participants
    reveal to the researcher [51] (pp. 11–30). To mitigate this validity threat, we
    used a framework to set up the semi-structured interviews and the framework for
    evaluation of design science to set up the artefact evaluation. We recorded all
    interactions with the participants, and we took part in sessions to obtain peer-feedback
    on our research to increase the descriptive validity.


    # 5.2.2. Interpretive Validity


    Interpretive validity is about accurately portraying the meaning that was attached
    by the participants to the objects that were studied [50]. To mitigate this threat,
    we have sent the elicited user-stories to the participants to obtain feedback
    on our findings [49]. Furthermore, we used data-triangulation by tapping into
    other sources to confirm our findings. To make sure we portrayed the meaning of
    the participants well, we used low inference descriptors by quoting participants
    in this research [50].


    # 5.2.3. External Validity


    External validity is crucial if we want to generalize our findings to a larger
    part of the population [50]. Although generalizability is not the primary purpose
    of this research, we will touch upon the subject. As this research conducts a
    case-study, the best way to generalize its findings is to find the similarity
    in subjects, objects and issues [52]. As the sample size and characteristics are
    not valid for generalizability, the best method to generalize our findings is
    to identify similarity in other situations.'
