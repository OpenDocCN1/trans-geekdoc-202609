- raw: '**19.** The correct answers are A and C. In Answer A, the pow function is
    used to calculate 22, which corresponds to 4. In Answer C, the left bitwise shift
    operator is used to shift the value of $a by two bits to the left, which corresponds
    to a multiplication by 4.


    **20.** The only answer that really fits the bill is A. A script doesn’t necessarily
    terminate when it reaches the end of any file other than the main one—so the “current”
    file could be externally included and not cause the script to terminate at its
    end. As far as PHP and Apache crashes, they can hardly be considered “clean” ways
    to terminate a script.


