    **Foreword**


    There are many advantages to having a PHP certification program. Foremost, it
    allows employers, especially those of the non-technical kind, to set a certain
    standard for their PHP


    hiring decisions; they’ll know that people who are certified have passed a set
    of hurdles in earning their credentials and can clearly demonstrate their knowledge
    of PHP and its related technologies.


    Not only does that mean that a Zend Certified Engineer will automatically match
    such criteria and have an immediate advantage on the job market, but the certification
    process also allows for more and more enterprises to adopt PHP. This, in turn,
    will lead to a much more vibrant job market for PHP developers—making it easier
    to make a living from what PHP


    developers like doing most. I have no doubt that we will see an increase in the
    ongoing PHP


    proliferation due to the existence of Zend’s PHP Certification Exam.


    A few weeks ago, I finally found time to take the Zend PHP Certification Exam.
    Despite having written some of the questions and being part of the exam education
    advisory board that reviewed the questions a few months ago, I was surprised to
    realize that I was a tad bit tense—I think not only because exams in general tend
    to have this effect on me, but also because I


    remembered that the questions were very thorough, most probably due to the fact
    that the exam authors themselves are leaders in the PHP community who wanted to
    come up with the best possible questions. Without making the exam overly difficult,
    this ensured that every question was well-thought-out, thoroughly peer-reviewed
    and carefully constructed; this is bound to make any prospective exam-taker—especially
    one that was an integral part of such a thorough process—a bit nervous!


    I’m happy to say that I passed the exam—but I admit that some questions were quite
    hard.


    I think that, overall, the exam is fair but, unlike many other certification tests,
    much more thorough. A PHP developer with no experience really cannot pass this
    exam, which I think is great. It really certifies PHP developers who have experience
    in developing PHP based web applications in the real world.


    I believe this book will be of great help in preparing for the certification exam.
    Both Marco and John were on the Zend PHP Certification Advisory Board and understand
    the nature of the exam and what its goals are. Both authors also have many years
    of experience in PHP, which is readily recognizable from the book’s contents.
    This book very nicely covers the different topics on which you will be tested
    and provides questions that are very similar to the ones you will see on the exam.
    Having the answers at the end of each chapter will make it easy for you to validate
    your strengths and weaknesses.


    I wish you all the best with the certification progress and hope you will soon
    join the growing family of Zend Certified Engineers.


    Andi Gutmans


    *Co-founder & VP of Technology, Zend Technologies* *Zend Certified Engineer*


    **About the**


    **Authors**


    **John Coggeshall** is a Technical Consultant for Zend Technologies, where he
    provides professional services to clients around the world. He got started with
    PHP in 1997 and is the author of three published books and over 100 articles on
    PHP technologies with some of the biggest names in the industry such as php|architect,
    SAMS Publishing, Apress and O’Reilly.


    John also is an active contributor to the PHP core as the author of the tidy extension,
    a member of the Zend Education Advisory Board, and frequent speaker at PHP-related
    conferences worldwide. His web site, http://www.coggeshall.org/ is an excellent
    resource for any PHP


    developer


    **Marco Tabini** is the publisher of php|architect (http://www.phparch.com), the
    premier magazine for PHP professionals. The author and co-author of four books,
    he was also part of the group of Subject Matter Experts (SMEs) who helped write
    the Zend Certification Exam. He regularly maintains a blog, which can be found
    at http://blogs.phparch.com, where he discusses the business of open-source software.


    **Introduction**'
