    # 简介


    编写考试**从来不是一件容易的事**。苏格拉底曾说：“未经审视的人生是不值得过的”，但（尽管他并非真指参加技术测试），我们确信，坐在考场里的大多数人都会乐意与这位传奇哲学家互换位置，喝下他的毒芹汁，也不愿参加考试。


    幸运的是，编写考试*不必*成为如此创伤性的经历。只要准备充分且经验丰富，你应该能顺利通过，而不会遇到太大麻烦。Zend 考试的设计初衷有两个目标：第一，测试你对
    PHP 的掌握程度；第二，尽可能采取实用的方法来进行测试。


    仅测试 PHP 知识这一想法基于一个简单的假设：你作为 PHP 程序员的经验，不应由你对外部技术的了解来衡量。正如我们将在第 9 章重申的那样，你可能一辈子都在用
    PHP 开发，却从未需要连接 MySQL 数据库，因此，测试你的 MySQL 知识将是衡量你对 PHP 熟悉程度的不公平方式。此外，MySQL AB（以及大多数其他相关的第三方软件供应商）已有自己的认证计划。


    至于问题的实用性，没有一位主题专家（SME）认为优秀的程序员应该是一本会走路的 PHP 参考手册。事实是，PHP 提供了超过 1,500 个不同的函数——了解每一个函数及其所有细微差别，不仅实际上不可能，而且也毫无用处。PHP
    手册随时可在世界任何地方在线获取；因此，除非有人把你关在一个没有互联网接入的房间里，否则你无法访问它的可能性微乎其微。尽管如此，如果你每三十秒就要查阅一次手册，就无法编程，因此考试确实包含以非常指导性的方式测试你对某些基本
    PHP 功能掌握程度的问题。


    然而，在很大程度上，考试测试的是你理解、解读和编写正确 PHP 代码的能力。准备好分析大量代码示例，以弄清它们的作用、工作原理以及是否存在 Bug。有些问题可能看起来有点棘手且过于复杂，但仔细想想，处理不完美的代码（当然是别人写的！）对于曾在现实世界工作过的任何人来说，并不罕见。


    ## 为什么要有这本练习题书？


    以尽可能充分的准备参加考试总是最好的。你的经验，以及像 SAMS 出版的《Zend PHP 认证学习指南》这样的书籍，将是确保你通过考试的宝贵工具，但坐下来参加考试本身，与你日常工作中可能做的任何事情都截然不同。


    本书为你提供了一系列高度结构化的问题，旨在模拟（而非复制）你在考试中将遇到的实际问题。它将帮助你“进入考试状态”，了解问题的措辞方式，以及它们期望你具备哪些能力。


    我们努力构建的问题虽接近真题，但通常稍难一些。理由很简单：如果你能答对难题，真实考试就会轻而易举！


    ## 本书如何组织？


    《Zend PHP 认证练习测试书》旨在作为 SAMS Publishing 出版的《官方 Zend PHP 认证学习指南》（ISBN 0672327090）的配套教材。因此，其章节紧密对应指南的章节，以最大程度便利你的学习过程。你可以先阅读指南的一章，然后翻到练习题书中对应的章节，参加一个专门针对该特定主题的小测验。或者，你也可以结合
    PHP 手册，将本书作为测试资源使用。我们的目录将为你提供考试涵盖主题的基本框架，你可以据此直接从手册以及互联网上许多其他资源进行学习。一旦你觉得准备好尝试答题，就可以再次使用本书为此目的服务。


    除第 1、2、5、6 章包含二十道题外，每章均包含十五道题。原因在于这些章节讨论 PHP 最基础的方面；因此，我们认为每章增加几道额外题目可能有助于你更好地评估准备情况。你将在每章末尾找到所有问题的答案及解析。


    虽然你当然可以随意使用本书，但我们建议一种简单的方法，帮助你最大化其效果。首先，你应该在真正有时间的时候练习测试——预留至少九十分钟答题，再预留三十到六十分钟核对答案。


    从每个十五题的章节中答五道题，从二十题的章节中答六道题开始。按顺序完成每章，中途不停下来核对答案。这将累计约六十五道题，非常接近实际考试的七十道题。给自己约八十分钟完成整套题目——这也是真实考试分配的九十分钟的良好模拟。


    过程结束后，你可以回过头将你的答案与每章末尾给出的正确答案进行核对。这将让你有机会确定自己在各个不同领域的准备程度，并将学习重点放在成绩不太理想的主题上。


    一旦你感觉准备好，可以再次使用相同技巧尝试。这将使你每次都能回答一批新题目，重新检验你的知识。


    ## 查找勘误表与讨论你的疑虑


    编写、审阅、编辑、再审阅本书中的问题及答案投入了*大量*工作。然而，我们终究是凡人，难免犯错。


    如果你认为发现了书中内容有误，请来此 URL 的 php|architect 论坛讨论：


    `http://forums.phparch.com/162`


    当然，如果某道题难住了你，想和其他 PHP 爱好者聊聊我们提供的答案背后的原委，也是一样。我们俩都会定期访问论坛，随时乐意提供帮助。


    ## 致谢


    写书——无论多薄——都是一项宏大的任务，需要许多不同人士的协助和专业知识。


    我们要感谢 Derick Rethans，他花费大量时间对每道题进行无情的技术审阅，指出错误并提出改进练习测试整体质量的建议。正是多亏了他，才使这么多问题易懂且技术准确——如果还有些问题不够完美，那完全是我们的责任。


    我们也要感谢 Zend 的 Daniel Kushner，感谢他坚定不移的支持和对 Zend 认证计划的宝贵贡献——没有他，就没有题目可写。


    John Coggeshall


    Marco Tabini


    纽约市


    多伦多


