  _\\_\\_\\_\\_\\_\\_\\_\n\n#### 18. 身份运算符 `===` 如何比较两个值？\n\nA. 它将它们转换为通用兼容数据类型，然后比较生成的值\n\
  \n\n\n\n## PHP 编程基础\n\n### 问题\n\n**19.** 以下哪些表达式将整数变量 `$a` 的值乘以 4？（选择 2 项）\n\nA.\
  \ `$a *= pow(2, 2);`\nB. `$a >>= 2;`\nC. `$a <<= 2;`\nD. `$a += $a + $a;`\nE. 以上都不是\n\
  \n**20.** 脚本如何才能干净地终止？\n\nA. 当调用 `exit()` 时\nB. 当执行到达当前文件末尾时\nC. 当 PHP 崩溃时\nD. 当\
  \ Apache 因系统问题终止时\n\n### 答案\n\n**1.** 查看选项，唯一一个让每个空白都讲得通的是 B。PHP 是一种基于 Zend Engine\
  \ 的脚本语言，通常嵌入在 HTML 代码中。因此，它主要用于开发 HTML 文档，尽管它也可以同样很好地用于开发其他类型的文档，例如 XML。\n\n**2.**\
  \ 虽然诸如 `<% %>` 和 `<?= ?>` 之类的标签在 PHP 编程中经常被忽略，但它们是界定 PHP 代码块的有效方式。然而，`<!` 和 `!>`\
  \ 标签无效，因此正确答案是 D。请记住，无论如何，这些标签中的一些并不总是可用的，这取决于 PHP 解释器运行所在的 `php.ini` 文件是如何配置的。\n\
  \n**3.** PHP 变量总是以美元符号开头，并且是拉丁字母表中的字符和数字的序列，加上下划线字符。`${\"MyVar\"}` 是一个有效的变量名，只是使用了一种稍微不太常见的命名约定，而\
  \ `&$something` 是对 `$something` 变量的引用。然而，变量不能以数字开头，这使得 `$10_somethings` 无效，因此答案\
  \ D 正确。\n\n**4.** 这里要注意的重要一点是 `$myarray` 数组的键值是在没有引号的情况下被引用的。因此，被访问的键不是字符串 `myvalue`，而是由常量\
  \ `myvalue` 所代表的值。因此，这等同于访问 `$myarray[10]`，其值为 `Dog`，答案 A 正确。\n\n**5.** 尽管 `print()`\
  \ 和 `echo()` 在大多数情况下基本上可以互换，但它们之间存在实质性差异。虽然 `print()` 的行为类似于具有自身返回值的函数（尽管它是一个语言结构），但\
  \ `echo()` 实际上是一个没有返回值的语言结构，因此不能用在表达式中。因此，答案 A 正确。\n\n**6.** 除了简单的数学运算外，`%` 运算符是取模运算符，它返回其两个操作数相除后的余数。`<<`\
  \ 运算符是左移运算符，它实际上将整数乘以 2 的幂。最后，最终答案乘以了一个浮点数，因此其类型会相应改变。然而，结果仍然会在没有任何小数部分的情况下打印出来，因为小数部分为零。最终输出是\
  \ 256（答案 D）。\n\n**7.** 遵循条件的逻辑，到达 `Hello, World!` 字符串的唯一途径是第一个 `if` 语句的 `else` 分支。因此，`$a`\
  \ 必须为 `False`。同样，`$b` 必须为 `False`。最后的条件依赖于前两个条件（`$a` 和 `$b`）均为 `False`，但坚持要求 `$c`\
  \ 为 `True`（答案 D）。\n\n**8.** 正确答案是 C。自 PHP 4.2.0 起，除非需要特定的伪随机数序列，否则无需使用 `srand()`\
  \ 初始化随机数生成器。此外，即使随机数生成器未被播种，该脚本仍会输出 49 个伪随机字符——每次都是相同的那些。`$array` 变量虽然是一个字符串，但可以作为数组访问，在这种情况下将返回与所用数字索引对应的单个字符。最后，`for`\
  \ 循环从 1 开始，一直持续到 `$i` 小于 50——总共 49 次。\n\n**9.** 如上所示，一系列检查单一条件的 `if...else if` 代码块是使用\
  \ `switch` 语句的完美场所：\n\n```php\n<?php\nswitch ($a) {\n    case 'a':\n        somefunction();\n\
  \        break;\n    case 'b':\n        anotherfunction();\n        break;\n   \
  \ case 'c':\n        dosomething();\n        break;\n    default:\n        donothing();\n\
  }\n?>\n```\n\n因为有一个兜底的 `else` 条件，所以必须为该情况提供一个 `default` 分支。答案 E 正确。\n\n**10.** 通常，`foreach`\
  \ 语句是遍历数组最合适的结构。然而，因为我们被要求修改数组中的每个元素，所以此选项不可用，因为 `foreach` 在数组的副本上工作，因此会导致额外的开销。虽然\
  \ `while` 循环或 `do...while` 循环可能行得通，但因为数组是顺序索引的，`for` 语句最适合这项任务，因此答案 A 正确：\n\n```php\n\
  <?php\n$myarray = array(\"My String\", \"Another String\", \"Hi, Mom!\");\nfor ($i\
  \ = 0; $i < count($myarray); $i++) {\n    $myarray[$i] .= \" ($i)\";\n}\n?>\n```\n\
  \n**11.** 因为只能向提供的代码段添加单行代码，所以唯一讲得通的语句是 `for` 循环，这将选择范围缩小到 C 或 D。为了选择实际产生正确结果的 `for`\
  \ 循环，我们首先必须重温其结构元素。在 PHP 中，`for` 循环声明如下：\n\n```\nfor (<初始化语句>; <继续条件语句>; <迭代语句>)\n\
  ```\n\n其中 `<初始化语句>` 在进入循环之前执行。然后 `for` 循环开始执行其代码块内的代码，直到 `<继续条件语句>` 评估为 `False`。每完成一次循环迭代，就会执行\
  \ `<迭代语句>`。\n\n将其应用于我们的代码段，正确的 `for` 语句是：`for ($idx = 1; $idx < STOP_AT; $idx *=\
  \ 2)`，即答案 C。\n\n**12.** 在五个选项中，只有两个是有效的 PHP 函数声明（A 和 D）。在这两个声明中，只有一个会在未传递参数时提供默认参数——答案\
  \ A。\n\n**13.** 这个问题旨在测试你关于 PHP 在处理函数时如何作用域变量的知识。具体来说，你必须理解 `global` 语句如何将全局变量引入局部作用域，以及\
  \ `$_GET`、`$_POST`、`$_COOKIE`、`$_REQUEST` 等超全局数组的无作用域特性。在这种情况下，数学计算结果为 5 + 25 -\
  \ 25 - 10，即 -5，也就是答案 B。\n\n**14.** 可以通过将括号（以及所需的任何参数）附加到包含要调用的函数名称的变量后面，来动态调用函数。因此，对于\
  \ A 组，适当的索引组合是 0, 4, 9, 9, 9, 9，其评估结果为字符串 `myfunction`。另一方面，参数是使用 `${}` 结构作为变量动态评估的。这意味着\
  \ B 组的适当索引是 7 和 8，它们评估为 `${'a'}` 和 `${'b'}`——分别意味着变量 `$a` 和 `$b`。因此，正确答案是 D。\n\n\
  **15.** 在 PHP 的最新版本中，`require()`（或 `require_once()`）和 `include()`（或 `include_once()`）之间的唯一区别在于，前者在找不到包含文件时只会抛出警告并允许脚本继续执行，而后者会抛出错误并停止脚本。因此，答案\
  \ E 正确。\n\n**16.** 当参数被声明为按引用传递时，不能为其指定默认值，因为解释器将期望一个可以在函数内部被修改的变量。因此，答案 C 正确。\n\
  \n**17.** 这里的正确答案是异或（`xor`）运算符。\n\n**18.** 全等运算符通过首先比较其两个操作数的类型，然后比较它们的值来工作。如果两者中任意一个不同，它就返回\
  \ `False`——因此，答案 B 正确。\n\n\n\n\n\n#### 19.\n\n正确答案是 A 和 C。在答案 A 中，使用 `pow` 函数计算\
  \ 2 的 2 次方，结果为 4。在答案 C 中，使用左位移运算符将 `$a` 的值向左移动两位，相当于乘以 4。\n\n#### 20.\n\n唯一完全符合要求的答案是\
  \ A。脚本在到达除主文件以外任何文件的末尾时，并不一定会终止——因此“当前”文件可能是外部引入的，在其末尾不会导致脚本终止。至于 PHP 和 Apache 的崩溃，很难将其视为“正常”终止脚本的方式。\n\
