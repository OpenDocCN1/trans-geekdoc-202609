  \nC. `require_once`, `include`\n\nD. `include`, `require`\n\nE. 以上皆正确\n\n#### 16.\
  \ 在声明函数时，什么情况下无法给参数分配默认值？\n\nA. 当参数为布尔类型时\n\nB. 当函数被声明为类的成员时\n\nC. 当参数被声明为按引用传递时\n\
