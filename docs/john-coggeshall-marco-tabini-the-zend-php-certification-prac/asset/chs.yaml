  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n### 前言\n\n拥有 PHP\
  \ 认证项目有许多优势。首当其冲的是，它允许雇主——尤其是非技术类雇主——为他们的 PHP 招聘决策设定一定的标准；他们会知道，获得认证的人员已经通过了一系列考核来获得证书，并能清楚地展示他们对\
  \ PHP 及其相关技术的掌握程度。\n\n这不仅意味着 Zend 认证工程师将自动符合此类标准并在就业市场上拥有即时优势，而且认证过程还允许越来越多的企业采用\
  \ PHP。这反过来将为 PHP 开发人员带来一个更加充满活力的就业市场——使他们更容易以 PHP 开发人员最喜欢做的事情为生。我毫不怀疑，由于 Zend PHP\
  \ 认证考试的存在，我们将看到 PHP 持续普及的增长。\n\n几周前，我终于抽出时间参加了 Zend PHP 认证考试。尽管我编写了一些考题，并且几个月前作为考试教育顾问委员会成员参与了考题审核，但我惊讶地发现自己有点紧张——我想不仅是因为考试通常都会让我产生这种影响，还因为我记得考题非常全面，这很可能是因为考试作者本身就是\
  \ PHP 社区的领军人物，他们想要拟定最优秀的考题。在不使考试过于困难的前提下，这确保了每个问题都经过深思熟虑、彻底的同行评审和精心构建；这注定会让任何潜在的考生——尤其是像我这样参与了如此严谨过程的人——有点紧张！\n\
  \n我很高兴地说我通过了考试——但我承认有些问题相当难。\n\n我认为，总体而言，考试是公平的，但与许多其他认证测试不同，它要全面得多。没有经验的 PHP 开发人员真的无法通过这项考试，我认为这很棒。它真正认证的是那些在现实世界中拥有开发基于\
  \ PHP 的 Web 应用程序经验的 PHP 开发人员。\n\n我相信这本书将对准备认证考试大有裨益。Marco 和 John 都是 Zend PHP 认证顾问委员会的成员，了解考试的性质及其目标。两位作者在\
  \ PHP 方面也拥有多年的经验，这从书的内容中便可窥见一斑。本书非常好地涵盖了您将接受测试的各个主题，并提供了与考试中非常相似的问题。每章末尾提供的答案将使您很容易验证自己的优势和劣势。\n\
  \n我祝愿大家在认证过程中一切顺利，并希望你们很快能加入日益壮大的 Zend 认证工程师大家庭。\n\nAndi Gutmans\n\n*联合创始人兼技术副总裁，Zend\
  \ Technologies*\n*Zend 认证工程师*\n\n### 作者简介\n\n**John Coggeshall** 是 Zend Technologies\
  \ 的技术顾问，为全球客户提供专业服务。他于 1997 年开始接触 PHP，是三本已出版书籍和 100 多篇关于 PHP 技术文章的作者，发表于 php|architect、SAMS\
  \ Publishing、Apress 和 O'Reilly 等业内知名机构。\n\nJohn 还是 PHP 核心的活跃贡献者，`tidy` 扩展的作者，Zend\
  \ 教育顾问委员会成员，以及全球 PHP 相关会议的常邀演讲者。他的网站 `http://www.coggeshall.org/` 是任何 PHP 开发人员的绝佳资源。\n\
  \n**Marco Tabini** 是 php|architect（`http://www.phparch.com`）的出版人，这是面向 PHP 专业人士的首选杂志。他是四本书的作者或合著者，也是协助编写\
  \ Zend 认证考试的主题专家（SME）小组成员之一。他定期维护一个博客，网址为 `http://blogs.phparch.com`，在那里他讨论开源软件的商业模式。\n\
  \n### 简介\n\n\n\n\n\n### 简介\n\n编写考试**从来不是一件容易的事**。苏格拉底曾说：“未经审视的人生是不值得过的”，但（尽管他并非真指参加技术测试），我们确信，坐在考场里的大多数人都会乐意与这位传奇哲学家互换位置，喝下他的毒芹汁，也不愿参加考试。\n\
  \n幸运的是，编写考试*不必*成为如此创伤性的经历。只要准备充分且经验丰富，你应该能顺利通过，而不会遇到太大麻烦。Zend 考试的设计初衷有两个目标：第一，测试你对\
  \ PHP 的掌握程度；第二，尽可能采取实用的方法来进行测试。\n\n仅测试 PHP 知识这一想法基于一个简单的假设：你作为 PHP 程序员的经验，不应由你对外部技术的了解来衡量。正如我们将在第\
  \ 9 章重申的那样，你可能一辈子都在用 PHP 开发，却从未需要连接 MySQL 数据库，因此，测试你的 MySQL 知识将是衡量你对 PHP 熟悉程度的不公平方式。此外，MySQL\
  \ AB（以及大多数其他相关的第三方软件供应商）已有自己的认证计划。\n\n至于问题的实用性，没有一位主题专家（SME）认为优秀的程序员应该是一本会走路的 PHP\
  \ 参考手册。事实是，PHP 提供了超过 1,500 个不同的函数——了解每一个函数及其所有细微差别，不仅实际上不可能，而且也毫无用处。PHP 手册随时可在世界任何地方在线获取；因此，除非有人把你关在一个没有互联网接入的房间里，否则你无法访问它的可能性微乎其微。尽管如此，如果你每三十秒就要查阅一次手册，就无法编程，因此考试确实包含以非常指导性的方式测试你对某些基本\
  \ PHP 功能掌握程度的问题。\n\n然而，在很大程度上，考试测试的是你理解、解读和编写正确 PHP 代码的能力。准备好分析大量代码示例，以弄清它们的作用、工作原理以及是否存在\
  \ Bug。有些问题可能看起来有点棘手且过于复杂，但仔细想想，处理不完美的代码（当然是别人写的！）对于曾在现实世界工作过的任何人来说，并不罕见。\n\n####\
  \ 为什么要有这本练习题书？\n\n以尽可能充分的准备参加考试总是最好的。你的经验，以及像 SAMS 出版的《Zend PHP 认证学习指南》这样的书籍，将是确保你通过考试的宝贵工具，但坐下来参加考试本身，与你日常工作中可能做的任何事情都截然不同。\n\
  \n本书为你提供了一系列高度结构化的问题，旨在模拟（而非复制）你在考试中将遇到的实际问题。它将帮助你“进入考试状态”，了解问题的措辞方式，以及它们期望你具备哪些能力。\n\
  \n我们努力构建的问题虽接近真题，但通常稍难一些。理由很简单：如果你能答对难题，真实考试就会轻而易举！\n\n#### 本书如何组织？\n\n《Zend PHP\
  \ 认证练习测试书》旨在作为 SAMS Publishing 出版的《官方 Zend PHP 认证学习指南》（ISBN 0672327090）的配套教材。因此，其章节紧密对应指南的章节，以最大程度便利你的学习过程。你可以先阅读指南的一章，然后翻到练习题书中对应的章节，参加一个专门针对该特定主题的小测验。或者，你也可以结合\
  \ PHP 手册，将本书作为测试资源使用。我们的目录将为你提供考试涵盖主题的基本框架，你可以据此直接从手册以及互联网上许多其他资源进行学习。一旦你觉得准备好尝试答题，就可以再次使用本书为此目的服务。\n\
  \n除第 1、2、5、6 章包含二十道题外，每章均包含十五道题。原因在于这些章节讨论 PHP 最基础的方面；因此，我们认为每章增加几道额外题目可能有助于你更好地评估准备情况。你将在每章末尾找到所有问题的答案及解析。\n\
  \n虽然你当然可以随意使用本书，但我们建议一种简单的方法，帮助你最大化其效果。首先，你应该在真正有时间的时候练习测试——预留至少九十分钟答题，再预留三十到六十分钟核对答案。\n\
  \n从每个十五题的章节中答五道题，从二十题的章节中答六道题开始。按顺序完成每章，中途不停下来核对答案。这将累计约六十五道题，非常接近实际考试的七十道题。给自己约八十分钟完成整套题目——这也是真实考试分配的九十分钟的良好模拟。\n\
  \n过程结束后，你可以回过头将你的答案与每章末尾给出的正确答案进行核对。这将让你有机会确定自己在各个不同领域的准备程度，并将学习重点放在成绩不太理想的主题上。\n\
  \n一旦你感觉准备好，可以再次使用相同技巧尝试。这将使你每次都能回答一批新题目，重新检验你的知识。\n\n#### 查找勘误表与讨论你的疑虑\n\n编写、审阅、编辑、再审阅本书中的问题及答案投入了*大量*工作。然而，我们终究是凡人，难免犯错。\n\
  \n如果你认为发现了书中内容有误，请来此 URL 的 php|architect 论坛讨论：\n\n`http://forums.phparch.com/162`\n\
  \n当然，如果某道题难住了你，想和其他 PHP 爱好者聊聊我们提供的答案背后的原委，也是一样。我们俩都会定期访问论坛，随时乐意提供帮助。\n\n#### 致谢\n\
  \n写书——无论多薄——都是一项宏大的任务，需要许多不同人士的协助和专业知识。\n\n我们要感谢 Derick Rethans，他花费大量时间对每道题进行无情的技术审阅，指出错误并提出改进练习测试整体质量的建议。正是多亏了他，才使这么多问题易懂且技术准确——如果还有些问题不够完美，那完全是我们的责任。\n\
  \n我们也要感谢 Zend 的 Daniel Kushner，感谢他坚定不移的支持和对 Zend 认证计划的宝贵贡献——没有他，就没有题目可写。\n\nJohn\
  \ Coggeshall\n\nMarco Tabini\n\n纽约市\n\n多伦多\n\n## 第 1 章：PHP 编程基础\n\nZEND 考试的设计要求你具备合理的经验才能通过。这并不意味着你必须是超人——只是意味着，为了通过考试，你在日常生活中必须有过相当多的\
  \ PHP 实战经历。\n\n\n\n\n因此，你必须非常熟悉“基础知识”。这些是你将持续打交道的 PHP 元素，因为它们构成了语言的根基。虽然对考试其他领域准备不足可能只是因为它们不在你的日常编程工作中，但如果在本章中错失大量题目，则应引起警觉。毕竟，如果你不懂基础，也很难理解更高级的主题。\n\
  \n# PHP 编程基础\n\n### 问题\n\n#### 1. 选择最符合以下描述的选项：PHP 是一种 \\_\\_\\_\\_\\_ 脚本语言，基于 \\\
  _\\_\\_\\_ 引擎。它主要用于开发动态 \\_\\_\\_\\_\\_ 内容，尽管也可用于生成 \\_\\_\\_\\_ 文档（以及其他）。\n\nA.\
  \ Dynamic, PHP, Database, HTML\n\nB. Embedded, Zend, HTML, XML\n\nC. Perl-based,\
  \ PHP, Web, Static\n\nD. Embedded, Zend, Docbook, MySQL\n\nE. Zend-based, PHP, Image,\
  \ HTML\n\n#### 2. 以下哪个标签不是开始和结束 PHP 代码块的有效方式？\n\nA. `<% %>`\n\nB. `<? ?>`\n\nC.\
  \ `<?= ?>`\n\nD. `<! !>`\n\nE. `<?php ?>`\n\n#### 3. 以下哪项不是有效的 PHP 代码？\n\nA. `$_10`\n\
  \nB. `${\"MyVar\"}`\n\nC. `&$something`\n\nD. `$10_somethings`\n\nE. `$aVaR`\n\n\
  #### 4. 执行以下脚本时显示什么？\n\n```php\n<?php\n\ndefine(myvalue, \"10\");\n\n$myarray[10]\
  \ = \"Dog\";\n\n$myarray[] = \"Human\";\n\n$myarray['myvalue'] = \"Cat\";\n\n$myarray[\"\
  Dog\"] = \"Cat\";\n\nprint \"The value is: \";\n\nprint $myarray[myvalue].\"\\n\"\
  ;\n\n?>\n```\n\nA. The value is: Dog\n\nB. The value is: Cat\n\nC. The value is:\
  \ Human\n\nD. The value is: 10\n\nE. Dog\n\n#### 5. `print()` 和 `echo()` 有什么区别？\n\
  \nA. `print()` 可用作表达式的一部分，而 `echo()` 不能\n\nB. `echo()` 可用作表达式的一部分，而 `print()` 不能\n\
  \nC. `echo()` 可用于 PHP 的 CLI 版本，而 `print()` 不能\n\nD. `print()` 可用于 PHP 的 CLI 版本，而\
  \ `echo()` 不能\n\nE. 没有区别：两个函数都打印出一些文本！\n\n#### 6. 以下脚本的输出是什么？\n\n```php\n<?php\n\
  \n$a = 10;\n\n$b = 20;\n\n$c = 4;\n\n$d = 8;\n\n$e = 1.0;\n\n$f = $c + $d * 2;\n\
  \n$g = $f % 20;\n\n$h = $b - $a + $c + 2;\n\n$i = $h << $c;\n\n$j = $i * $e;\n\n\
  print\n\n$j;\n\n?>\n```\n\nA. 128\n\nB. 42\n\nC. 242.0\n\nD. 256\n\nE. 342\n\n####\
  \ 7. 应向变量 `$a`、`$b` 和 `$c` 赋予哪些值，才能使以下脚本显示字符串 \"Hello, World!\"？\n\n```php\n<?php\n\
  \n$string = \"Hello, World!\";\n\n$a = ?;\n\n$b = ?;\n\n$c = ?;\n\nif($a)\n\n{\n\
  \nif($b && !$c) {\n\necho\n\n\"Goodbye\n\nCruel\n\nWorld!\";\n\n} else if(!$b &&\
  \ !$c) {\n\necho\n\n\"Nothing\n\nhere\";\n\n}\n\n}\n\nelse\n\n{\n\nif(!$b)\n\n{\n\
  \nif(!$a\n\n&&\n\n(!$b\n\n&&\n\n$c))\n\n{\n\necho \"Hello, World!\";\n\n}\n\nelse\n\
  \n{\n\necho \"Goodbye World!\";\n\n}\n\n}\n\nelse\n\n{\n\necho\n\n\"Not\n\nquite.\"\
  ;\n\n}\n\n}\n\n?>\n```\n\nA. False, True, False\n\nB. True, True, False\n\nC. False,\
  \ True, True\n\nD. False, False, True\n\nE. True, True, True\n\n#### 8. 以下脚本将输出什么？\n\
  \n```php\n<?php\n\n$array = '0123456789ABCDEFG';\n\n$s = '';\n\nfor ($i = 1; $i\
  \ < 50; $i++) {\n\n$s .= $array[rand(0,strlen ($array) - 1)];\n\n}\n\necho $s;\n\
  \n?>\n```\n\nA. 一个包含 50 个随机字符的字符串\n\nB. 一个包含 49 个相同字符副本的字符串，因为随机数生成器未初始化\n\nC. 一个包含\
  \ 49 个随机字符的字符串\n\nD. 无输出，因为 `$array` 不是数组\n\nE. 一个包含 49 个 'G' 字符的字符串\n\n#### 9.\
  \ 哪种语言结构最能表示以下这一系列 `if` 条件判断？\n\n```php\n<?php\n\nif($a == 'a') {\n\nsomefunction();\n\
  \n} else if ($a == 'b') {\n\nanotherfunction();\n\n} else if ($a == 'c') {\n\ndosomething();\n\
  \n}\n\nelse\n\n{\n\ndonothing();\n\n}\n\n?>\n```\n\nA. 不带 `default` 情况的 `switch`\
  \ 语句\n\nB. 递归函数调用\n\nC. `while` 语句\n\nD. 这是该逻辑的唯一表示形式\n\nE. 使用 `default` 情况的 `switch`\
  \ 语句\n\n#### 10. 假设你想在遍历 `$myarray` 数组时修改每个元素的值，最好的迭代方式是什么？\n\n```php\n<?php\n\n\
  $myarray = array (\"My String\",\n\n\"Another String\",\n\n\"Hi, Mom!\");\n\n?>\n\
  ```\n\nA. 使用 `for` 循环\n\nB. 使用 `foreach` 循环\n\nC. 使用 `while` 循环\n\nD. 使用 `do...while`\
  \ 循环\n\nE. 无法实现此目标\n\n#### 11. 考虑以下代码片段：\n\n```php\n<?php\n\ndefine(\"STOP_AT\"\
  ,\n\n1024);\n\n$result\n\n=\n\narray();\n\n/* Missing code */\n\n{\n\n$result[]\n\
  \n=\n\n$idx;\n\n}\n\nprint_r($result);\n\n?>\n```\n\n应在标记段填入什么代码，才能产生以下数组输出？\n\n\
  ```text\nArray\n{\n[0] => 1\n[1] => 2\n[2] => 4\n[3] => 8\n[4] => 16\n[5] => 32\n\
  [6] => 64\n[7] => 128\n[8] => 256\n[9] => 512\n}\n```\n\nA. `foreach($result as\
  \ $key => $val)`\n\nB. `while($idx *= 2)`\n\nC. `for($idx = 1; $idx < STOP_AT; $idx\
  \ *= 2)`\n\nD. `for($idx *= 2; STOP_AT >= $idx; $idx = 0)`\n\nE. `while($idx < STOP_AT)\
  \ do $idx *= 2`\n\n#### 12. 为用户定义函数 `is_leap()` 选择合适的函数声明。假设如果未另行定义，`is_leap` 函数使用\
  \ 2000 年作为默认值：\n\n```php\n<?php\n\n/* Function declaration here */\n\n{\n\n$is_leap\
  \ = (!($year %4) && (($year % 100) ||\n\n!($year % 400)));\n\nreturn $is_leap;\n\
  \n}\n\nvar_dump(is_leap(1987));\n\n/* Displays false */\n\nvar_dump(is_leap());\n\
  \n/* Displays true */\n\n?>\n```\n\nA. `function is_leap($year = 2000)`\n\nB. `is_leap($year\
  \ default 2000)`\n\nC. `function is_leap($year default 2000)`\n\nD. `function is_leap($year)`\n\
  \nE. `function is_leap(2000 = $year)`\n\n#### 13. 执行以下代码时显示的值是什么？假设代码通过以下 URL 执行：\n\
  \n`testscript.php?c=25`\n\n```php\n<?php\n\nfunction process($c, $d = 25)\n\n{\n\
  \nglobal\n\n$e;\n\n$retval = $c + $d - $_GET['c'] - $e;\n\nreturn\n\n$retval;\n\n\
  }\n\n$e = 10;\n\necho\n\nprocess(5);\n\n?>\n```\n\nA. 25\n\nB. -5\n\nC. 10\n\nD.\
  \ 5\n\nE. 0\n\n#### 14. 考虑以下脚本：\n\n```php\n<?php\n\nfunction myfunction($a, $b =\
  \ true)\n\n{\n\nif($a && !$b) {\n\necho\n\n\"Hello,\n\nWorld!\\n\";\n\n}\n\n}\n\n\
  $s = array(0 => \"my\",\n\n1 => \"call\",\n\n2 => '$function',\n\n3 => ' ',\n\n\
  4 => \"function\",\n\n5 => '$a',\n\n6 => '$b',\n\n7 => 'a',\n\n8 => 'b',\n\n9 =>\
  \ '');\n\n$a = true;\n\n$b = false;\n\n/* Group A */\n\n$name = $s[?].$s[?].$s[?].$s[?].$s[?].$s[?];\n\
  \n/* Group B */\n\n$name(${$s[?]},\n\n${$s[?]});\n\n?>\n```\n\n上述脚本中的每个 `?` 代表针对\
  \ `$s` 数组的整数索引。为了在执行时显示 \"Hello, World!\" 字符串，缺失的整数索引必须是什么？\n\nA. Group A: 4,3,0,4,9,9\
  \ Group B: 7,8\n\nB. Group A: 1,3,0,4,9,9 Group B: 7,6\n\nC. Group A: 1,3,2,3,0,4\
  \ Group B: 5,8\n\nD. Group A: 0,4,9,9,9,9 Group B: 7,8\n\nE. Group A: 4,3,0,4,9,9\
  \ Group B: 7,8\n\n#### 15. PHP 脚本的运行时包含使用 \\_\\_\\_\\_\\_\\_\\_\\_ 结构，而 PHP 脚本的编译时包含使用\
