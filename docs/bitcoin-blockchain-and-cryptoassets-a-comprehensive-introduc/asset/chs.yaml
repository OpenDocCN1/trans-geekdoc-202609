  \n#### 具有不同格式的私钥\n\n私钥可以以多种格式表示。\n\n![](img/pg86.png)\n\n此外，可以使用所谓的二维码来表示。二维码是一种可以被扫描器读取的二维条码。这对于想要将私钥物理备份导入钱包的用户特别有用。\n\
  \n![](img/pg87.png)\n\n公钥通常以十六进制表示。这种表示法使用整数 0–9 和字母 a–f。在计算机科学中，十六进制非常易于操作。单个十六进制字符代表\
  \ 4 位（2⁴ = 16）。\n\n#### 转换\n\n当节 4.1.1 中 Tamara 的公钥坐标转换为十六进制时，它们分别产生以下序列：\n\n![](img/pg87-2.png)\n\
  \n为了以单个字母序列表示，将坐标拼接并补充前缀 04。这种表示被称为未压缩公钥 `K`[pub]。\n\n![](img/pg88.png)\n\n由于公钥对应于定义椭圆曲线上的点，`x`\
  \ 坐标足以计算相应的 `y` 坐标。更准确地说，对于任何 `x` 值，`y` 最多有两个候选。这是由于椭圆曲线的对称性（见节 4.3.2）。为了获得唯一的点，`x`\
  \ 值通过前缀进行扩展。如果公钥的 `y` 值是偶数，前缀为 02；如果是奇数，则前缀为 03。在 Tamara 的情况下使用了前缀 02。这种公钥的压缩表示将是\
  \ ![](img/pg88-in-1.png)。\n\n![](img/pg88-2.png)\n\nBase58 引入了另一种格式：它使用 58 进制。为了防止传输中的错误，该格式包含一个校验和。Base58\
  \ 用于显示某些密钥和伪名，这些序列以 1、3 或 bc 开头。Base58 的私钥被称为 *私钥导入格式* (WIF)。\n\n\n\n\n\n比特币地址的长度为\
  \ 160 位，但通常以 Base58Check 格式呈现，前缀为 1。图 4.2 显示了导出比特币地址的必要步骤。`SHA256` 和 `RIPEMD160`\
  \ 是两个哈函数的名称（参见第 4.2 节）。比特币地址也被称为公钥哈希（`public-key-hashes`）。\n\n![图 4.2 从私钥到比特币地址。](img/fig4-2.png)\n\
  \n图 4.2\n\n从私钥到比特币地址。\n\n比特币地址相对于公钥的主要优点是便利性、安全性和灵活性。\n\n首先，比特币地址比公钥短得多，因此更适合日常使用。由于采用了\
  \ Base58Check 编码，它包含一个校验和。\n\n其次，比特币地址提供了一些额外的安全性。即使攻击者发现了椭圆曲线中的漏洞，他也只有在获得目标的公钥后才能开始攻击。比特币地址确保了公钥只有在交易时才会被公开。这使得比特币地址面对量子计算机的威胁更加健壮。\n\
  \n第三，比特币地址还可以构造为所谓的脚本哈希支付（pay-to-script-hash）地址。这些地址不是派自公钥的哈希值，因此不是经典的比特币地址。相反，它们基于整个锁定脚本的哈希值，该脚本将访问权限绑定到特定条件。这允许创建特殊的伪名结构，例如要求付款必须由多个私钥签名（参见第\
  \ 4.5.4 节），或只能在一定时间后花费（参见框 6.12）。这些脚本哈希支付地址始终以数字 3 开头。\n\n#### 框 4.2 压缩密钥与比特币地址\n\
  \n尽管压缩和未压缩公钥代表椭圆曲线上的相同点且来源于同一个私钥，但它们会导致不同的比特币地址。如果 Tamara 从未压缩公钥 `K[pub]` 生成比特币地址，她将获得地址\
  \ `B`。如果她改用压缩公钥![](img/pg90-in-2.png)，她将获得地址![](img/B-bar-in_grey.png)。\n\n![](img/pg90-1.png)\n\
  \nTamara 可以使用她的私钥访问这两个比特币地址。然而，她的私钥可以用两种不同的方式表示。前缀为 5 的私钥管理从未压缩公钥生成的比特币地址。前缀为 `K`\
  \ 或 `L` 的私钥用于管理从压缩公钥生成的比特币地址（见下文）。前缀特别有助于将密钥导入钱包软件。前缀中的信息指示软件需要检查哪些伪名的余额，从而显著提高了效率。\n\
  \nTamara 私钥的“压缩型”WIF 版本![](img/pg90-in-3.png) 对应于以下字符串：\n\n![](img/pg90-2.png)\n\
  \n从严格来说来说，“压缩型”私钥这个术语是不准确的。它并不是信息的压缩版本，而仅仅指示使用哪些伪名的信号。事实上，“压缩型”私钥甚至比未压缩格式多出 8 位（或\
  \ 2 个十六进制字符）。私钥的长度并不关键，因为它从不随交易传输，因此不会给区块链带来负担。\n\n### 4.1.4 一次性伪名\n\n比特币系统中的所有伪名都被设计为仅使用一次。这可能不符合直觉（与银行账户相比），但它是基于比特币区块链是公开的。如果一个人始终使用同一个伪名，其他人将更容易识别交易中的模式，并追踪到与伪名对应的身份。如果识别成功，该人员所有过去和未来的交易都可以被查询和监控。\n\
  \n为了增加此类分析的难度，大多数钱包为每笔交易创建一个新的密钥对，并始终使用不同的比特币地址。在付款时，钱包会将发票金额发送到发票发行者的地址，并额外生成新地址将剩余余额转过去。观察者无法区分发票金额和找零，同样无法发现所有者保留了哪个伪名。\n\
  \n对新地址的持续需求对选择过程和访问数据的组织提出了问题。新伪名可以从随机、独立的私钥生成，也可以基于一个初始值（即所谓的 `seed`）。第 4.1.5 节讨论了组织私钥的各种可能性。\n\
  \n### 4.1.5 确定性与非确定性钱包\n\n为了实现只使用一次的伪名，钱包必须生成并存储大量的密钥和伪名。实现此有多种方法，在选择程序以及组织和管理方面有所不同。\n\
  \n非确定性实现（图 4.3）在创建伪名时依赖大量随机选择的私钥。每个私钥选择一个新的随机数。这种非确定性方法的示例是比特币 Core 钱包的原始实现。钱包在设置过程中生成了数百个密钥对和比特币地址。每当需要额外的伪名时，钱包随后生成新地址。\n\
  \n![图 4.3 非确定性钱包的结构。](img/fig4-3.png)\n\n图 4.3\n\n非确定性钱包的结构。\n\n非确定方法的问题在于必须对每个密钥进行备份。为了减少频繁备份的需求，可以在初始创建大量的密钥对。然而，一旦初始密钥池耗尽，每个额外的密钥都必须备份。此外，创建和存储大量密钥对的过程效率低下。\n\
  \n确定性钱包是另一种方案（图 4.4）。它们使用一个很大的随机数 `s` 作为选择所有私钥的种子。这种方法可以通过简单的方式实现；例如，采用加密哈希函数 `H(i,\
  \ s)`，它计算种子 `s` 与索引 `i` 拼接后的哈希值，然后将该哈希值作为私钥，如下：\n\n![](img/pg92.png)![图 4.4 简单确定性钱包的结构。](img/fig4-4.png)\n\
  \n图 4.4\n\n简单确定性钱包的结构。\n\n该程序允许选择无限数量的新私钥 `k(i)[prv]`，可以通过初始备份的种子值进行恢复。(\\[149\\\
  ]）重要的是强调，序列中的任何密钥（得益于哈希函数）都不会对种子或任何其他密钥产生推断。同样重要的是，无法将从种子衍生伪名与非确定性钱包生成的伪名区分开来。\n\
  \n\n\n\n分层确定性（HD）钱包（图 4.5）兼具简单确定性钱包的所有优点，但通过生成密钥和伪名的严格层级结构，扩展了其功能范围，这开启了许多有趣的应用。它们基于初始种子\
  \ `s`，并由此生成主密钥 `k^(m)[prv]`。随后的密钥在树形结构中派生出来。每个密钥都可以派生出新的分支，进而导出新的子密钥。扩展密钥（密钥和链码）^(5)\
  \ 允许派生所有相同类型（私钥或公钥）的子密钥。相反，子密钥无法用于推导出其前身密钥。\n\n![](img/fig4-5.png)\n\n分层确定性钱包的结构\n\
  \n严格的层级结构有两个主要优势。首先，可以与他人共享树的某些分支。例如，公司可以为每个业务部门生成独立的分支。总部持有主密钥 `k^(m)[prv]`，因此对所有伪名保持控制权。同时，各个业务部门可以生成自己的子密钥，从而独立工作。\n\
  \n派生原理同时适用于扩展私钥 (`xprv`) 和扩展公钥 (`xpub`)。因此，它可以用于从扩展公钥生成公钥子密钥。该选项特别有趣的一点是，可以在不拥有相应私钥的情况下生成额外的伪名。这意味着可以使用一个可能不安全的设备来为入账付款创建伪名，而无需访问私钥。\n\
  \n这些扩展公钥还可以用于会计应用和审计。它们允许跟踪使用该分支中任何伪名所进行的所有交易，而无需将比特币余额的控制权转交给观察者。\n\nHD 钱包的标准由两项比特币改进提案规定：`BIP0032`[229]\
  \ 和 `BIP0044`.[170]。。`BIP0039`[171] 规定了关于种子简化化表示和互兼容性的标准（参见 框 4.3）。\n\n### 助记种子\n\
  \n分层确定性钱包的种子是长二进制序列，因此难以记忆。此外，手写备份副本存在传输错误的风险。为了解决这些问题，使用了 `mnemonic words`（助记词）和加密安全的密钥派生函数的组合。\n\
  \n密钥派生函数 `PBKDF2`（基于密码的密钥派生函数）允许从较小的二进制序列生成种子。通常使用 128 到 256 位随机比特就足够了。\n\n助记种子（`Mnemonic\
  \ seed`希腊语 mnēmonikós = 记忆力）将随机二进制序列重新编码为几个单词，从而简化了用户对其种子的管理^a。标准 `BIP0039`[171]...\n\
  \n\n\n我们在分析中尚未考虑的一个事实是，计算资源可以用于挖掘。即使 Tamara 运气不错并成功积累了所需的计算资源，她获得的奖励也只有 1 satoshi（聪聪）或\
  \ 0.00000001 比特币。或者，她也可以将同样的计算资源用于其他利润丰厚的任务，例如挖掘。\n\n### 攻击 3：比特币生日悖论。\n最后，我们考虑任意地址碰撞的概率——即在整个比特币网络中找到至少两个可以访问同一个比特币地址的私钥的概率。\n\
  \n这个问题对应于数学中一个众名的问题，通常被称为“生日悖论”。该悖论表明，在一个有五十人的群体中，至少有两个人在同一天过生日的概率高得令人惊叹。事实上，这种情况发生的概率大约为\
  \ 97%。比特币地址中也可能存在类似的惊喜。因此，分析整个网络中发生碰撞的风险是值得的。\n\n一项分析显示，如果比特币地址的总数等于 `5.4 · 10²²`，发生碰撞的概率估计仅为\
  \ 0.01%。要达到 99.9999% 的概率，比特币地址的最小数量必须达到 `6.35 · 10²⁴`。拥有如此数量的比特币地址，需要大约 300 万亿字节（TB）的存储空间才能安全地存储这些地址及相应的私钥。\n\
  \n假设地球上的每一个人都拥有一台台式电脑并不断地生成比特币地址，在世界总人口超过生成的密钥的关键数量之前，仍然需要 300 多年。此外，每人需要大约 50,000\
  \ TB 的存储空间。\n\n总而言之，一种基于密钥和伪签名的系统在密码学上是安全的。然而，必须提到的是，我们假设私钥是随机选择的。显示出特定模式或与可以通过字典攻击猜到的单词或句子的哈希值相对应的私钥是不安全的。因此，使用真正随机的过程来选择私钥是至关重要的。\n\
  \n为了实现这一目的，使用了密码学安全的伪随机数生成器（CSPRNG）。某些钱包的实现还基于外部随机数据，例如鼠标光标移动或键盘击键。如果实现正确，这些程序是安全的。\n\
  \n或者，也可以手动选择私钥。物理现象可以产生真正的随机数，因此是创建私钥最安全的方法。框 4.4 给出了此类过程的两个例子。\n\n#### 框 4.4：使用硬币和骰子创建私钥\n\
  \n私钥无非从一个极大的潜在候选集中选择出的数字。选择的随机性至关重要。\n\n一个简单（尽管非常耗时）的方案是使用硬币。硬币 `c` 可以掷 256 次，并用\
  \ 0 和 1 记录相应的结果。\n\n私钥通过硬币掷出的二进制序列 `b = 2` 创建。或者同一个私钥也可以以十进制格式 `b = 10` 。这是将第 `i`\
  \ 次掷的结果乘以 `2^(256−i)`（`i = 1, …, 256`），然后将所有乘积相加来实现。\n\n![](img/pg97-1.png)\n\n\
  通过掷骰子 `d`，私钥可以表示为所谓的六进制数（heximal number）。六进制系统的基数为 6，不能与基数为 16 的十六进制系统（hexadecimal）混淆。一个人掷骰子九十九次——有六点的面记录为零——并每次记录结果（点数）。然后通过拼接掷骰的结果生成私钥。该数字随后可以转换为十进制系统或其他任何形式。\n\
  \n![](img/pg97-2.png)\n\n这里展示的方法的优点是产生真正随机的结果，从而为创建私钥提供了最高的安全性。\n\n*a.* 理论上通过硬币方法获得的某些数字是不可能的，这是由于椭圆曲线算法（ECDSA）（见\
  \ 4.3 节）。特别是，在前 128 次掷中必须出现零。\n\n## 哈希函数\n\n比特币的许多功能基于哈希函数。例如，2.4 节中的区块标识就是区块头的哈希值。4.1\
  \ 节中的比特币地址是公钥的哈希值，甚至单个交易也可以通过哈希值进行识别。在这方面，对哈希函数的简要介绍是必要的。\n\n考虑哈希函数 `H`，它为输入 `m`\
  \ 分配一个哈希值 `h`，使得 `H(m) = h`。输入没有格式要求，可以是任意长度的字符字符串。然而，哈希值 `h` 有范围限制，并显示为特定长度的二进制字符串。这种映射是确定性的。对于给定的函数，给定的输入\
  \ `m` 总是产生相同的哈希值。哈希函数不是单射，因此不同的输入可能会产生相同的哈希值。\n\n\n\n加密哈希函数可以确保原始输入的完整性。这种保护适用于任何长度的文本。为了实现这一目的，会计算并存储需要保护的输入的哈希值。由于对原始输入的任何调整都不可避免地会导致不同的哈希值，原始输入的任何修改都会被立即识别。由于加密哈希函数的特性，人类也无法故意生成碰撞（collision）；即找到一个产生相同哈希值的替代输入。\n\
  \n哈希值会对文本中极微小的变化产生反应。即使只是简单地改变一个字母或标点符号，也会导致哈希值完全不同。通过使用两个使用 `SHA256` 哈希函数计算哈希值的文本示例可以很好地说明这一点。令人惊讶的是，这两个示例文本非常相似，但它们的哈希值却大相径庭。\n\
  \n![](img/pg99-1.png)\n\n### 4.2.2 哈希值作为工作证明\n\n由于无法故意生成具有特定特征的哈希值，加密哈希函数也可以作为证明：平均而言，使用了一定的计算资源来生成具有预定义特征的哈希值。例如，如果某人必须提交一个第一个十六进制位为\
  \ `0` 的哈希值的输入，此人将投入一些计算资源并尝试各种输入。平均而言，每十六个输入中才有一个符合此标准的哈希值。如果前两个位置都必须为 `0`，概率将下降到\
  \ ![](img/pg99-in-1.png)。通过收紧或放宽这一要求，可以实现任何级别的难度。为了防止预留创建哈希值并用作多个应用的证明，输入通常包含一个特定于应用程序的部分。为了获得变体，输入还包含一个带有自由选择的任意数据的变量部分。这种变异源允许从相同的数据计算出不同的哈希值。\n\
  \n加密哈希函数构成了比特币共识协议的基础。在第 2.4.3 节中我们已经使用它来计算区块的标识符。后续将在第 5.2.2 节中进行讨论。\n\n## 4.3\
  \ 签名\n\n现在我们转向签名。我们将展示公私钥如何在数学上关联在一起，以及如何使用私钥来证明对特定伪名的所有权，或作为交易消息真实性和完整性的证明。\n\n\
  由于我们必须深入密码学基础，本节将不可避免地比书的其他部分更复杂、更具数学性。然而，重点仍然是于于理解性，这有时会与数学精确性产生冲突。因此，数学家在这些讨论中可能会遇到刻意的简化。\n\
  \n### 4.3.1 非对称加密的应用\n\n密码学的经典应用基于对称加密方法。双方想要加密它们的通信，并约定一个可以用于加密和解密消息的秘密密钥。因此，同一个密钥可以用于双向通信。\n\
  \n对称加密方法有一个至关重要的限制。为了让双方约定密钥 `k` 而不让第三方能够拦截这些信息并获知密钥，他们最初必须有一个安全的通信通道，通过该通道交换密钥。\n\
  \n非对称加密方法消除了对安全通信通道的需求。它们允许通过可能被破解或被窃听的通道进行初始密钥交换。双方不再使用公共密钥 `k`，而是创建一个个人的密钥对，由一个私钥\
  \ `k[prv]` 和公钥 `K[pub]` 组成。\n\n公钥可以公开。但是，私钥必须始终严格保密。\n\n密钥对具有一种数学特性：公钥是由相关的私钥推导出的，但其本身无法用于推导出私钥（参见图\
  \ 4.1）。这些密钥对的另一个有趣特征是……（此处原文未完，按逻辑衔接）。\n\n\n\n\n两个点 `P[1]` 和 `P[2]` 的加法是通过连接这两点的直线在几何上完成的。该直线将与椭圆曲线交于唯一的额外的点。该点对应于−`P[3]`。通过在\
  \ `x-axis` 上进行镜像反射，我们最终获得了所需的点 `P[3]`（−`P[3]` 的逆元）。几何加法见图 4.8。\n\n![图 4.8 几何加法 P1\
  \ + P2 = P3.](img/fig4-8.png)\n\n图 4.8  \n\n几何加法 `P[1] + P[2] = P[3]`。\n\n几何表示法为该过程提供了良好的直观理解。然而，在实现时，需要一种添加两个点的代数方法。要做到这一点，首先计算连接\
  \ `P[1]`、`P[2]` 和 −`P[3]` 的直线的斜率 `s`。这可以通过计算垂直轴（`y-axis`）的变化量与水平轴（`x-axis`）的变化量之比作为斜率来实现。\n\
  \n![](img/pg103-1.png)\n\n给定斜率后，可以如下法计算 `P[3]` 的 `x-` 和 `y-` 坐标：\n\n![](img/pg103-2.png)\n\
  \n通过变换方程，我们得到了逆元 `P[3]` 的 `y` 值。\n\n![](img/pg103-3.png)\n\n存在两个例外，迫使我们微调对几何加法的描述：\n\
  \n* 1. 垂直线会导致点 `P` 及其逆元 −`P` 相加。因此，第三个交点是无穷远点。\n\n![](img/pg103-4.png)\n\n* 2. 切点\
  \ `P` 视为两个交点，因为它代表了 `P` 与自身的相加（参见点倍点章节）。\n\n![](img/pg104-3.png)\n\n## 点倍点\n\n点倍点是加法的一种特殊情况。如果将点\
  \ `P` 与自身相加，就会得到点 `2P`。\n\n![](img/pg104-4.png)\n\n这种关系可以通过点 `P` 的切线在几何上说明。该切线将与椭圆曲线交于唯一的另一个点−\
  \ `2P`，其逆元是上述方程的解。图 4.9 可视化了这一几何过程。\n\n![图 4.9 点倍点。](img/fig4-9.png)\n\n图 4.9  \n\
  \n点倍点。\n\n对于代数计算，我们再次需要斜率 `s`。由于目前使用的方程基于两点之间的水平和垂直差异，它在当前情况下的结果将为零。因此，我们改为使用切点\
  \ `P`的一阶导数计算斜率，其中 `a` 对应于魏尔拉斯方程的参数。\n\n![](img/pg104-1.png)\n\n坐标的计算方法与“普通”加法相同，特殊情况下的区别在于\
  \ `P[1] = P[2] = P`。通过这种方式，计算 `2P` 坐标的两个方程可以简化如下：\n\n![](img/pg104-2.png)!(images/pg105-1.png)\n\
  \n加法和点倍点可以根据需要组合。事实上，点倍点只是加法的一种特殊情况，在代数处理上需要略有不同，但基本上遵循相同的规则。例如，以下等成立：\n\n![](img/pg105-2.png)\n\
  \n图 4.10 显示了加法和点倍点两种方法之间的几何关系。\n\n![图 4.10 点倍点与加法。](img/fig4-10.png)\n\n图 4.10 \
  \ \n\n点倍点与加法。\n\n### 4.3.3 有限域上的椭圆曲线\n\n比特币使用了标准的 secp256k1，它定义了有限域 `\U0001D53D\
  [p]` 上的椭圆曲线，其中 `p` 代表一个想象巨大的质数。参数 `a = 0` 和 `b = 7` 被用于描述该曲线。该规范得如下方程：\n\n![](img/pg105-3.png)\n\
  \n其中 `(x, y) ∈ \U0001D53D[p]` 仅意味着 `x` 和 `y` 只能取 0 到 `p - 1` 之间的整数值。\n\n由于比特币使用的数字\
  \ `p` 远超人类的理解且无法通过图形表示，我们将通过使用域 `\U0001D53D[37]` 上的椭圆曲线来讨论基本原理。在示例中，我们仅允许 `x` 和\
  \ `y` 取 0 到 36 之间的整数值。\n\n这种方法的模运算使用图 4.11 中的转盘进行可视化。如果某个操作导致结果超过 36 的最大值，则计数将顺时针继续。类似的规则也适用于负值。\n\
  \n![图 4.11 \U0001D53D[37] 的模运算。](images/fig4-11.png)\n\n图 4.11  \n\n\U0001D53D[37]\
  \ 的模运算。\n\n为了说明这一点，我们包含了：\n\n![](img/pg106-1.png)\n\n现在的问题是如何将实数上的加法和点倍点转移到有限域。答案相对简单：计算方法与实数计算类似。为了使这一过程更易理解，我们将考虑以下示例。\n\
  \n示例 1：加法。在 `\U0001D53D[37]` 的 `y² = x³ + 7` 中，`P[1] = (24, 17)` 和 `P[2] = (35,\
  \ 6)`。我们要找到 `P[3] = P[1] + P[2]`。\n\n斜率 `s` 的计算使用了与用于椭圆曲线相同的方程。唯一的区别在于逆元的形成（执行除法至关重要）要复杂一些。\n\
  \n在计算斜率时，我们需要确定−11 的逆元。由于 `[(−11) · 10]` mod 37 = 1，我们现在可以将该值代入上述方程。所得方程可以直接求解出\
  \ `s`。该值代表连接三点 `P[1]`、`P[2]` 和 `P[3]` 的直线的斜率。\n\n![](img/pg108-2.png)\n\n随后可以使用值\
  \ `s = 36` 来计算 `P[3]` 的坐标。为此，我们使用了之前用过的一个方程。\n\n![](img/pg108-3.png)\n\n\n\n\n通过将\
  \ `s` 的值代入方程并求解，我们得到结果 1237，这在模 37 下对应于值 16。然后使用 `P[3]` 的 `x` 值来计算相应的 `y` 值。\n\n\
  ![](img/pg108-4.png)\n\n因此我们确定了新点 `P[3]` 的坐标为 (16, 12)。\n\n类比代数解，加法的结果也可以用几何方式呈现（参见图\
  \ 4.13）。对角线仅用于说明目的；由于我们观察的是离散空间，直线（等同于连续点集）是不存在的。\n\n![图 4.13 在 \U0001D53D37 中加法\
  \ P1 + P2 = P3 的几何表示，其中 P1 = (24, 17) 和 P2 = (35, 6)。](img/fig4-13.png)\n\n图 4.13\n\
  \n在 \U0001D53D[37] 中 `y`² = `x`³ + 7 上加法 `P[1]` + `P[2]` = `P[3]` 的几何表示，其中 `P[1]`\
  \ = (24, 17) 且 `P[2]` = (35, 6)。\n\n这也解释了为什么图 4.13 中的三个点 `P[1]`、`P[2]` 和 − `P[3]`\
  \ 可以通过斜率为 `s` = 36 的直线连接，也可以通过斜率为 `s` = −1 的第二条直线连接。因为 36 = −1 mod 37，这两个斜率在 \U0001D53D\
  [37] 中是等价的。^(13) 我们决定使用 `s` = −1 的几何表示，因为这个斜率值提供了更清晰的说明。\n\n### 示例 2：加法\n假设在 \U0001D53D\
  [37] 中 `y`² = `x`³ + 7，`P[1]` = (30, 16) 且 `P[2]` = (13, 13)。我们想找到 `P[3]` = `P[1]`\
  \ + `P[2]`。\n\n同样，我们首先必须计算斜率 `s`。\n\n![](img/pg110-1.png)\n\n为了继续，我们随后必须形成 17 的逆值。这可以通过求解方程\
  \ `17 · (17)^(−1) mod 37 = 1` 来。因为 \\[(17) · 24\\] mod 37 = 1，我们得到 `(17)^(−1)` =\
  \ 24。将此值代入方程并求解，我们得到结果 35。\n\n![](img/pg110-2.png)\n\n该斜率也可以通过这个示例计算进行几何表示。因为 35\
  \ = −2 mod 37，该直线可以用 `s` = 35 或 `s` = −2 的直线表示。在图 4.14 中，我们选择了使用 `s` = −2 的几何表示。这两个值都可以计算两个坐标\
  \ `x[P[3]]` 和 `y[P[3]]`。我们将使用 `s` = −2。\n\n![](img/pg110-3.png)![图 4.14 在 \U0001D53D\
  37 中加法 P1 + P2 = P3 的几何表示，其中 P1 = (30, 16) 和 P2 = (13, 13)。](img/fig4-14.png)\n\n\
  图 4.14\n\n在 \U0001D53D[37] 中 `y`² = `x`³ + 7 上加法 `P[1]` + `P[2]` = `P[3]` 的几何表示，其中\
  \ `P[1]` = (30, 16) 且 `P[2]` = (13, 13)。\n\n类比之前的计算，`P[3]` 的 `x` 值被用于计算相应的 `y` 值。\n\
  \n![](img/pg110-4.png)\n\n我们我们得到了 `P[3]` 的坐标 (35, 31)。\n\n### 示例 3：点倍\n假设在 \U0001D53D\
  [37] 中 `y`² = `x`³ + 7，`P` = (8, 1)。我们想找到 `2P` = `P` + `P`。\n\n点倍法也可以用于有限素数域上的椭圆曲线背景。\n\
  \n![](img/pg111-1.png)\n\n2 的逆元是 19，因为 (2 · 19) mod 37 = 1。将此值代入方程并求解，我们得到斜率 `s`\
  \ 的值。\n\n![](img/pg112-1.png)\n\n为了计算 `2P` 的两个坐标，我们可以使用之前相同的方程，其中 `P[1]` = `P`。\n\
  \n![](img/pg112-2.png)\n\n我们由此得到 `2P` 的坐标 (24, 17)。\n\n### 4.3.4 椭圆曲线、循环群与签名\n为了建立椭圆曲线签名算法\
  \ (ECDSA)，我们需要基于我们椭圆曲线的循环（子）群。循环子群是源自基点 `G` 的点集。它包含元素 `{0, G, 2G, …, (n−1)G}`，其中\
  \ `n` 称为阶（order）。对于大于 `n−1` 的因子，循环从开头开始；即 `(n−1)G + G = nG = 0`。\n\n阶为 `N` 的椭圆曲线可以产生阶为\
  \ `n` 的子群，其中 `n` 必须是 `N` 的因子。在本节中，我们将检查一个阶为 `n = 13` 的循环子群示例(chapter_4.xhtml#fn14)。[图\
  \ 4.15 可视化了该子群和循环的各个步骤。\n\n![图 4.15 在 \U0001D53D37 中使用基点 G = (8, 1) 在 y2 = x3 +\
  \ 7 上生成的阶为 n = 13 的循环子群。子群由 12 个点和无穷点 (0G)组成。从 12G 到不可见点 0G 的箭头线通过另一条路径与 G 连接。这两个连接封闭了循环。](img/fig4-15.png)\n\
  \n图 4.15\n\n在 \U0001D53D[37] 中 `y`² = `x`³ + 7 上使用基点 `G = (8, 1)` 生成的阶为 n = 13 的循环子群。子群由\
  \ 12 个点和无穷点 (0G)组成。从 12G 到不可见点 0G 的箭头线通过另一条路径与 G 连接。这两个连接封闭了循环。\n\n#### 生成密钥对\n\
  循环子群构成从中提取密钥对的整数集合。为了做到这一点，我们首先从集合 `{1, …, n−1}` 中选择一个随机元素生成私钥 `k[prv]`。由于我们简化示例中的循环子群阶为\
  \ `n = 13`，我们需要在 1 和 12 之间选择一个值。我们的示例仅包含十二种可能的私钥（参见框 4.5）。\n\n框 4.5\n\n#### 小密钥空间\n\
  显然，如此小的私钥集合是不安全的。正如我们在 4.1.6 中看到的，密钥和别名系统的安全性基于极其巨大的可能值集。攻击者尝试示例中的十二种可能值没有任何问题。目前的示例仅用于说明基本原理。Bitcoin\
  \ 使用循环子群阶为 15,792,089,237,316,195,423,570,985,008,687,907,852,837,564,279,074,904,382,605,163,141,518,161,494,337，因此拥有大量的可能的数字（参见\
  \ 4.1.6）。假设我们简化的 Bitcoin 模型使用图 4.15 中的循环子群（阶 `n = 13`），且私钥为 `k[prv]` = 9。由此，我们可以使用点倍和加法推导出公钥\
  \ `K[pub]`。为了这样做，我们取基点 `G = (8, 1)` 并将其乘以私钥 `k[prv]` = 9，得到点 (23, 1)。这个点代表了她的公钥。\n\
  \n![](img/pg114-1.png)\n\n#### 框 4.6 压缩公钥\n在 4.1.2 中，我们引入了压缩公钥![](img/pg114-in-4.png)，它们只需要点的\
  \ x 坐标和一个添加的前缀。在考虑图 4.15 时，很明显为什么 x 值本身是不够的；它不包含任何关于公钥对应点 (23, 1) 还是点 (23, 36) 的信息。上述前缀提供了关于给定\
  \ x 值的两个点哪一个应该用作公钥的信息。感谢点倍和加法的结合，可以从私钥 `k[prv]` 快速推导出公钥 `K[pub]`。人们可以先将基点倍增三次，然后加上额外的\
  \ `G`。该程序允许仅通过四个步骤即可计算公钥。私钥越大，*double and add*算法节省的时间就越多。\n\n\n\n\n另一方面，反向步骤没有已知的捷径。如果一个人仅拥有公钥\
  \ `K[pub]` 和曲线的基点 `G`，他只能通过试错来发现私钥。这种现象被称为`椭圆曲线离散对数问题`。\n\n## 消息签名\n\n对于计算机来说，消息无非都是数字。因此，消息可以包含任何类型的文本。在比特币的语文中，这主要指的是交易消息。通过签名，Tamara\
  \ 能够证明她拥有该假名对应的私钥，因此可以支配比特币余额。\n\n在接下来的内容，我们假设数字 `t = 4` 代表 Tamara 向 Edith 发送一个比特币单位的交易消息。正如密钥空间一样，这只是一个简化的示例。通常情况下代表文本的数字要大得多。\n\
  \n消息的签名通过以下五个步骤创建：\n\n1. Tamara 再次在 1 和 `n-1` 之间选择一个随机数 `i`。这个数字将仅使用一次。\n2. Tamara\
  \ 计算点 `P = i · G`。\n3. Tamara 计算签名的第一部分 `r = x[P] mod n`；即计算出的点的 `x` 值对 `n` 取模。\n\
  4. Tamara 计算签名的第二部分。\n5. Tamara 将消息 `t` 以及公钥 `K[pub]` 和签名 `(r, s)` 并发布。\n\n在步骤 1\
  \ 中，Tamara 选择了数字 `i = 7`。她可以在步骤 2 中使用这个数字来计算点 `P = i · G`。计算步骤遵循 [section 4.3.3]\
  \ 中详细描述的过程，并得到坐标 (18, 20)。\n\n在步骤 3 中，Tamara 计算值 `r`，它代表签名的第一部分。为此，她使用点 `P = (18,\
  \ 20) mod 13` 的 `x` 坐标并得到结果 `r = 5`。\n\n在步骤 4 中，Tamara 计算签名的第二部分。\n\n为了求解该方程，Tamara\
  \ 需要数字 `i = 7` 的乘法逆。因为 `(2 · 7) mod 13 = 1`，所以 `7 mod 13` 的逆是 `2`。\n\n通过插入上述数值，她得到了以下方程：\n\
  \n消息 `t = 4` 的签名因此为 `(r, s) = (5, 7)`。\n\n在步骤 5 中，Tamara 现在可以将签名 `(r, s) = (5, 7)`、消息\
  \ `t = 4` 及其她的公钥 `K[pub] = (23, 1)` 发给其他网络节点，以证明消息的真实性和完整性。\n\n## 验证消息签名\n\n一个网络节点接收了\
  \ Tamara 的交易消息，现在想要验证签名。验证过程由四个步骤组成：\n\n1. 消息接收者计算...\n2. 他计算...\n3. 他计算点 `P = u[1]\
  \ ◦ G + u[2] ◦ K[pub]`。\n4. 如果 `r = x[p] mod n`，他知道签名是有效的。\n\n在步骤 1 和 2 中，消息接收者需要\
  \ `s = 7` 的乘法逆。因为 `(2 · 7) mod 13 = 1`，`7 mod 13` 的逆对应于值 `2`。对于第一步，将该值插入到以下方程中。\n\
  \n结果得到 `u[1] = 8`。对于第二步，他再次取 `7` 的计算出的逆并乘以 `r = 5`，由此得到结果 `u[2] = 10`。\n\n在步骤 3\
  \ 中，消息接收者将 `u[1]` 和 `u[2]` 的两个值插入到以下方程中。他可以通过点倍加和加法求解得到的方程，从而得到结果 `P = (18, 20)`。\n\
  \n在步骤 4 中，可以使用 `P` 的 `x` 坐标验证签名的真实性。因为 `x[P] mod 13 = r = 5`，消息接收者知道签名是有效的，且交易消息是由持有私钥的人编写的，因此授权使用假名\
  \ `K[pub] = (23, 1)` 的余额。此外，消息接收者可以排除交易消息在传输过程中被修改过的，因为对消息的任何更改都会导致 `t` 值改变，从而使随后的签名失效。\n\
  \n## 4.4 交易\n\n在之前的章节中，我们已经讨论了交易但没有描述它们的结构。现在我们将提供更更详细的分析。交易是在网络中中继的消息，通常承担支付订单的功能。例如，如果\
  \ Edith 想要转移比特币单位，她必须生成一个支付订单，对其进行加密签名，并发送到其他节点。\n\n确认的交易构成了比特币区块链的基础。与其跟踪账户余额，不如所有的历史交易都记录在比特币区块链中并公开可见。因此，引用账户余额实际上是一种简化。比特币系统使用所谓的\
  \ UTXO 模型，这将在接下来的章节中解释。\n\n### 4.4.1 交易结构\n\n为了使交易有效，它必须满足几项标准并按照标准格式发布。图 4.16 显示了一个交易。特别是，交易至少包含一个输入和一个输出。输入将一定数量的比特币单位分配给交易。该数量分配到任意数量的新生成的输出。\n\
  \n输出还包含一个特定的解锁条件，该条件决定了对余额的控制权以及在什么情况下可以再次转移比特币。通常输出面向比特币地址创建。地址从相应的公钥派生，因此可以使用底层私钥的签名来满足解锁条件。\n\
  \n\n\n然而，从原则上讲，确定解锁条件具有一定的灵活性。在第 4.5 节中，我们将探讨花费输出的替代条件以及可能的用例。无论具体形式如何，此类条件的目的始终是限制访问，并确保只有预定义的组对特定输出具有控制权。\n\
  \n每个输出可以恰好作为新交易的输入使用一次。如果网络节点接收到一条引用已使用输出作为输入的交易消息，它将忽略这第二笔交易。在图 4.17 中，只有交易 3 的输出尚未被用作输入，因此可供新交易使用。在这种背景下，我们还将其称为未花费的交易输出（UTXO）——即尚未使用的输出。`UTXO`\
  \ 存储在比特币区块链的一部分中，并可以在任何时候在新交易中被引用。出于效率考虑，所有未花费的交易输出也存储在所有节点的随机访问内存（`RAM`）中。\n\n\
  ![图 4.17 交易链。](img/fig4-17.png)\n\n图 4.17  \n\n交易链。\n\n比特币单位仅以这种形式存在。因此，当我们谈论比特币单位时，我们指的是未花费的交易输出。\n\
  \n输入引用之前交易的输出。为了做到这一点，相应的交易必须包含一个针对所引用输出花费条件的可验证解决方案。如果满足了解锁条件，比特币单位就可以被新交易使用。输入和输出的交易化序列创建了一个类似于图\
  \ 4.17 的交易链。\n\n### 4.4.2 交易类型\n\n如果输入中引用了某个输出（`UTXO`），则它必须始终被完全使用。引用部分输出是不可能的。这导致了需要多种类型的交易。既有将多个输入合并为一个大输出的交易，也有将一个大输入拆分为若干个小输出的交易。在某些情况下，当有人必须为一个低价值交易引用一个大输出时，某些输出就充当“找零”的角色。\n\
  \n交易必须满足至少有一个输入和至少和一个输出的最低要求。这导致了图 4.18 和 4.19 所示的四种交易类型。\n\n![图 4.18 不同类型的交易。](img/fig4-18.png)\n\
  \n图 4.18  \n\n不同类型的交易。\n\n![图 4.19 合并（M 到 N）交易。](img/fig4-19.png)\n\n图 4.19  \n\n\
  合并（*M* 到 *N*）的交易。\n\n图 4.18a 显示了将任意数量输入合并为单个输出的交易类型。这种交易类型允许您将多个小金额链接到单一解锁条件。\n\n\
  图 4.18b 可视化了一个单一输入被分为许多输出的交易。这种拆分交易是最常见的交易形式。如果待使用的输入超过了发票金额，交易发起者通常会选择拆分交易，并生成一个有利于自己的“找零”第二个输出。理想情况下，他会为此目的使用一个新地址，以便观察者无法区分付款和找零（参见第\
  \ 4.1.4 节）。\n\n图 4.18c 显示了一种转发交易。它获取单个输入并生成一个新的输出。该交易用于所有权的变更。除了任何交易费用外，新输出的比特币价值与旧输出相同。\n\
  \n除了这三种基本交易类型外，还有第四类型，被称为合并交易。此类交易具有 `M > 1` 个输入和 `N > 1` 个输出，因此是拆分交易和聚合交易的混合体。图\
  \ 4.19 展示了一笔合并交易。由于每个输出都可以链接到不同的解锁条件，具有多个输出的交易可以将比特币单位传输给不同的接收者，或为不同的输出添加单独的限制。\n\
  \n无论输入和输出的数量是多少，所有输入的总和必须至少等于所有输出的总和。如果输出价值超过输入价值，则整个交易将失效。^(18) 然而，如果输入总和超过输出，差额将自动记录为交易费用，并由将交易包含在区块链中的矿工提取。正如后文解释的，费用较高的交易通常更快地添加到比特币区块链中。在这方面，时间敏感型交易的发起者可能有自愿设置较高交易费的动力。\n\
  \n### 4.4.3 可追溯性与同质性\n\n正如图 4.17 所示，交易的链接创建了一个清晰的交易轨迹，其中每个输出都有明确区分且可追溯的来源。在我们简单的示例中，显而易见交易\
  \ 3 的输出来自于交易 1 和 2。然而，即使在真实的比特币区块链中，仍然可以将所有交易追溯到各自的币币交易（coinbase transaction）。\n\
  \n交易链接使得精确识别和定位每个交易输出成为可能。当 Tamara 传播交易消息时，交易输入会指向之前的交易输出，从而指向特定的可追溯来源。如果节点多次接收到同一笔交易，它将能够立即识别重复的交易消息并拒绝它。这也适用于引用相同输出并因此与第一笔交易竞争的交易。与经典的账户余额系统相比，对于每笔交易都可以清楚地判断相应的交易输出是否已使用，以及新交易是否与另一个交易存在冲突。\n\
  \n比特币单位在交易历史上有所不同，在严格意义上不是同质的。同质性要求货币工具的任何两个单位都是不可区分的。比特币输出的可追溯性在大多数情况下并不重要。然而，在某些情况下，交易输出的可追溯性可能会严重损害涉及金额的实际价值。\n\
  \n\n\n另一个问题涉及被证明源自可疑甚至非法的来源的输出。例如，如果已知某个输出源于抢劫或黑客攻击，那么该输出的合法性就会受到质疑。可区分性允许对交易输出进行所谓的\
  \ `blacklisting`（黑名单化）。黑名单是一个术语，用于描述创建一个列表，声明各种交易输出无效或不再可交易（因此没有价值）。尽管黑名单在某些情况下似乎是合理的，但它会导致巨大的交易成本，因为每笔支付之前都必须查询黑名单。交换媒介的同质性越低，它作为支付工具的适用性就越低。我们想强调，在去中心化系统中很难实现黑名单化。没有单一的黑名单，也没有中心化的机构来维护它。我们看到的，某些金融中介使用它们自己的黑名单来决定是否接受特定的比特币单元。\n\
  \n## 4.5 脚本条件\n\nUTXO 可以被引用的条件是在 Script 中编写和验证的。正如其名称所示，Script 是一种脚本语言，拥有一个预定义的命令列表：即所谓的\
  \ `OP codes`。该语言本身非常简单并且经过了刻意的限制。特别是，Script 不支持循环，因为这些可能会导致攻击向量。尽管如此，这些命令可以被灵活使用，允许实现极其极其复杂的解锁条件。\n\
  \nScript 是一种基于栈的语言。当评估一个函数时，它会将对应的值放在栈顶。如果一个函数需要参数，这些参数反过来从栈的最顶位置获取（`cellar principle`\
  \ 或“后进先出”）。只有当所有命令都无错误执行且批处理的最终结果为 1（TRUE）时，交易才被认为是有效的。解锁条件的成功取决于两个子脚本：`scriptPubKey`（或锁定脚本）和\
  \ `scriptSig`（或赎脚本）。图 4.20 显示了交易链背景下的这两个脚本。\n\n![图 4.20 交易中的 scriptPubKey 和 scriptSig。](img/fig4-20.png)\n\
  \n图 4.20 交易中的 scriptPubKey 和 scriptSig。\n\n*   `scriptPubKey` 是输出的锁定脚本。它包含了关于被引用输出的解锁条件以及相关验证过程的精确规范。此类脚本是每个交易输出的一部分。\n\
  *   `scriptSig` 是交易输入的一个组件，可以被视为被引用输出解锁条件的解决方案（赎脚本）。它由签名以及与解决方案相关的其他可能组件组成。\n\n\
  在下文中，我们将分析最重要的交易、它们的脚本以及栈。\n\n### 4.5.1 支付公钥 (Pay-to-Public Key)\n\n![](img/pg123-1.png)\n\
  \n支付公钥解锁条件将输出直接链接到公钥，因此只有通过关联的私钥进行签名才能释放余额。这种解锁条件被认为是过时的，并在很大程度上被支付地址（pay-to-address）取代。`scriptSig`\
  \ 包含签名 `sig`。`pubKey` 是 `scriptPubKey` 的一部分。解锁条件使用 `OP_CHECKSIG` 进行验证。只有当所有命令无错误执行时，交易才被认为是有效的。\n\
  \n该过程如图 4.21 所示。`scriptPubKey`锁定脚本包含了规范，`scriptSig` 包含了签名。\n\n![图 4.21 交易中的 scriptPubKey\
  \ 和 scriptSig。](img/fig4-21.png)\n\n图 4.21 交易中的 scriptPubKey 和 scriptSig。\n\n###\
  \ 4.5.2 支付地址 (Pay-to-Address)\n\n![](img/pg124-1.png)\n\n通过支付地址，输出链接到公钥的哈希。`scriptPubKey`\
  \ 包含哈希值，`scriptSig` 包含签名。解锁条件使用 `OP_EQUALVERIFY`。公钥被哈希处理并与锁定脚本中的哈希值进行比较。\n\n该过程如图\
  \ 4.22 所示。`scriptPubKey`锁定脚本包含了哈希值，`scriptSig` 包含了签名。\n\n![图 4.22 交易中的 scriptPubKey\
  \ 和 scriptSig。](img/fig4-22.png)\n\n图 4.22 交易中的 scriptPubKey 和 scriptSig。\n\n###\
  \ 4.5.3 多签名 (Multisig, M of N)\n\n![](img/pg125-1.png)\n\n多签名允许需要 `M` 个 `N` 个签名才能引用交易输出的解锁条件。`scriptPubKey`锁定脚本包含\
  \ `N` 个公钥。关联的私钥中至少有 `M` 个必须在 `scriptSig` 中提供有效签名。\n\n该过程如图 4.23 所示。`scriptPubKey`锁定脚本包含了公钥，`scriptSig`\
  \ 包含了签名。\n\n![图 4.23 交易中的 scriptPubKey 和 scriptSig。](img/fig4-23.png)\n\n\n\n\n\
  ![图 4.23 多签名堆栈过程（2 of 3 脚本）。](img/fig4-23.png)\n\n图 4.23\n\n### 多签名堆栈过程（2 of 3 脚本）。\n\
  \n`OP_CHECKMULTISIG` 命令提取 `N` 个公钥和 `M` 个签名。它迭代地检查不同的密钥和签名组合，只有当所有签名都有效且可以分配给脚本中的另一个公钥时，操作才会成功。\n\
  \n成对验证程序的执行方式与之前应用的命令 `OP_CHECKSIG` 相同。验证从栈顶的公钥和签名开始。在每个验证步骤之后，将使用脚本中的下一个公钥。如果某对的验证失败，则将同一个签名与栈上的后续的公钥进行比较。如果验证尝试成功，程序将接着验证栈上的下一个签名。\n\
  \n在我们的图 4.23b 示例中，`<pubKey3>` 和 `<sig2>` 首先匹配。验证失败，因为无法用公钥 3 签名 2。在步骤 2 中，`<pubKey2>`\
  \ 和 `<sig2>` 匹配并成功验证。步骤 3 成功匹配了 `<pubKey1>` 和 `<sig1>`。在满足最小数量 `M` 个有效签名的情况下，解锁条件得以满足，交易输出的引用也是有效的。\n\
  \n### 4.5.4 脚本哈希支付（Pay-to-Script-Hash / 灵活脚本）\n\n![](img/pg127-1.png)\n\n脚本哈希支付（Pay-to-script-hash）是一种灵活的解锁条件。锁定存输出脚本（`scriptPubKey`）仅包含解锁条件的哈希值。为了引用交易输出，用户必须提供一个\
  \ `scriptSig`，其脚本的哈希值必须与 `scriptPubKey` 中规定的哈希值完全对应。如果第一次验证成功，然后在第二步中处理整个脚本。只有当提供的脚本能够成功执行时，交易输出的引用才是有效的。\n\
  \n哈希值^(21) 用于确保只有通过公开之前定义的脚本才能满足解锁条件。完整的脚本作为 `scriptSig` 的一部分被公开，并且仅当它与解锁条件中的哈希值对应时才会被执行。因此，脚本并不是脚本哈希支付\
  \ UTXO 的一部分。这一点很重要，因为 UTXO 存储在每个全节点的 RAM 中，并且可能长时间不使用。在 UTXO 中添加大型脚本会给全节点带来巨大负担。脚本哈希支付的另一个优势是，它可以使用以\
  \ 3 开头的特殊类型比特币地址来表示。\n\n自然地，脚本哈希支付解锁条件也有缺点。一个风险是，如果有人使用了无效的锁定脚本，比特币单位可能会被锁定。由于哈希值无法得出关于脚本的结论，可能会向一个无效（因此无法完成）的脚本转移比特币单位。此外，所有者必须始终保留该脚本。它不在区块链中。所有者丢失锁定脚本类似于丢失私钥。换句话说，在没有相应脚本^(22)\
  \ 的情况下，无法有效引用脚本哈希支付交易输出。\n\n总之，必须强调的是，脚本哈希支付解锁条件提供了广泛有趣的应用，特别是对于高级用户而言。然而，这些机会对用户加了更大的责任，并大幅增加了错误的风险，这可能导致用户比特币持仓的全部损失。\n\
  \n**框 4.7 脚本哈希支付的多签名**\n\n脚本哈希支付的灵活性实现了多签名交易的替代方案。与节 4.5.3 中花费输出的经典多签名条件相比，脚本哈希支付使用了便于支付的地址。此外，`scriptPubKey`\
  \ 不需要包含所有授权方的公钥，因此紧凑得多。较小的数据量意味着更低的交易手续费。\n\n脚本哈希支付是今天 `M`-of`N` 解锁条件的标准，并已广泛取代了原生多签名。\n\
  \n### 4.5.5 空数据（OP_RETURN）\n\n![](img/pg128-1.png)\n\n空数据解锁条件从严格意义上来说并不是交易。它们仅向比特币区块链写入最大长度为\
  \ 40 字节（320 位）的数据。与其他交易一样，这些数据一旦被嵌入比特币区块链，就无法被更改。\n\n这种交易类型的一种可能应用是不可逆地记录一个*存在性证明*（proof\
  \ of existence）——即一个证明特定数据文件在特定时间点存在的记录。为此，数据的哈希值通过空数据交易存储在区块链中。存储的数据允许数据作者在未来提供确凿的证据，证明在哈希值记录在区块链的那个时刻，该数据正是以这种形式存在的。这只是大量应用中的一种。此外，许多*彩色币*（colored\
  \ coin）实现利用额外数据来定义附带的支付承诺。\n\n最初，数据是以其他方式存储的；例如，通过 1-of-3 多签名交易，将数据输入到 `scriptPubKey`\
  \ 中代替额外的密钥，或者通过所谓的比特币地址。这些变通方法导致了留在全节点 RAM 中的不可引用交易输出。\n\n作为应对措施，创建了带有 `OP_RETURN`\
  \ 操作码的空数据条件。该操作码表示交易输出不能作为新的输入并中止脚本。交易输出被明确标记为不可引用，因此不会保留在全节点中，但仍然存储在区块链中。\n\n人们利益的差异性再次引发了关于许可数据量的政治辩论。因此，有人呼吁将限制提高到\
  \ 80 字节。\n\n### 4.6 签名哈希类型\n\n我们详细讨论了 ECDSA 和各种交易脚本，但还没有讨论交易的哪些部分被签名。默认情况下，签名应用于整个交易，除了\
  \ `scriptSig`（见节 4.7.1 中的交易可变性）。在某些情况下，这可能是不可取的。签名者可能只想保护交易的某些输入和输出，以便他人修改交易的部分。为了允许这种选择，有\
  \ 3 种基础 SIGHASH 类型加上一个可以应用于任何基础类型的修饰符。基础类型的名称指示了签名多少输出。`ANYONECANPAY` 修饰符改变了签名多少输入。这导致了交易签名的六种可能性。这些可能性如[4.2](#chapter_4.xhtml#tab4-2）所示并在下方进行了讨论。\n\
  \n表格显示了六种签名哈希类型，并描述了每种类型的签名内容。\n\n\n\n\n\n`SIGHASH_ALL` 签名所有的输入和所有的输出。如果任何输入或输出被修改，签名将变为无效。`SIGHASH_ALL`\
  \ 是默认值。除非另有说明，否则将使用此签名哈希类型。\n\n`SIGHASH_SINGLE` 签名所有输入但仅签名其中一个输出。如果任何输入或该特定输出被修改，签名将变为无效。然而，其他人可以更改任何未签名的输出。\n\
  \n`SIGHASH_NONE` 签名所有输入但不签名任何输出。因此，任何人都可以自由地修改解锁条件，并选择将比特币单位分配到哪个地址，而不会使签名失效。对输入的任何更改都会导致签名失效。\n\
  \n`SIGHASH_ALL|SIGHASH_ANYONECANPAY` 仅签名签名者的输入和所有输出。这种签名哈希类型允许任何人自由地添加或删除其他输入，但防止他们更改任何输出。例如，想象一个众筹活动，只要达到最低阈值金额，你就愿意为一个特定项目做贡献。\n\
  \n`SIGHASH_SINGLE|SIGHASH_ANYONECANPAY` 仅签名签名者的输入和一个输出。其他人可以自由地添加或删除额外的输入和输出。对交易交易部分的任何更改都会导致签名失效。\n\
  \n`SIGHASH_NONE|SIGHASH_ANYONECANPAY` 仅签名签名者的输入而不签名输出。任何人都可以添加或删除其他输入和输出，并以任何方式使用已签名输入。\n\
  \n交易可以包含使用不同签名哈希类型的多个签名。如果是这种情况，则以最严格的限制为准。未能遵守限制将导致签名失效，并防止相应的输入被花费。\n\n## 4.7\
  \ 分离见证 (SegWit)\n\n分离见证（或 `SegWit`）是一种网络升级，其主要目的是修复交易的可变性（Transaction Malleability）。交易可变性是指原始比特币协议中的一个已知问题，允许人们轻微修改未确认交易的\
  \ `scriptSig`，从而改变交易的哈希值（交易 ID）。在 `SegWit` 之前，这些对交易哈希值的更改不会使交易失效或改变其含义。\n\n交易可变性使得根据交易\
  \ ID 识别交易变得困难。例如，如果一个已传播但未确认的交易随后被修改，并且修改后的版本被包含在区块链中，则该交易被确认并以不同的交易 ID 索引。如果发送者在寻找原始交易\
  \ ID，他将找不到它，并可能错误地认为它仍在待处理或已确认失败。\n\n一些早期交易所使用交易哈希值来检查提现请求是否已处理。因此，交易所的某些客户能够误导交易所代表他们发布另一笔交易。相应的损失无疑是交易所方面某种幼稚实现的结果。特别是，交易所本可以通过不使用交易哈希值作为标识符来轻松规避任何麻烦。然而，一个可靠的交易标识符对于许多二层扩展解决方案（如闪电网络，见第\
  \ 6.2 节）关重要。因此，修复交易可变性问题是比特币成功的重要因素。\n\n导致交易可变性的基本问题是 `scriptSig` 无法签名，因为签名本身就是它的一部分。尝试对签名将导致无限循环，签名过程会改变底层数据，从而导致需要新的签名。因此，在签名交易时必须排除\
  \ `scriptSig`。然而，`scriptSig` 是用于计算交易哈希值或交易 ID 的交易数据的一部分。因此，可以对 `scriptSig` 应用某些修改，从而在不使签名失效的情况下更改交易\
  \ ID。\n\n为了解决可变性问题，`SegWit` 将赎脚本从交易的 `scriptSig` 中*分离*，并将其移动到名为 *witness* 的单独数据字段中。空的\
  \ `scriptSig` 字段仍然用于交易哈希值的计算，但由于必须是空的，因此不允许更改。对 `witness` 字段的任何潜在更改都不会对交易哈希值产生影响，使得交易标识符没有歧义。\n\
  \n作为一个额外的副作用收益，`SegWit` 增加了一个兆字节（MB）区块可以包含的交易数量（见第 4.7.5 节）。当然，`witness` 数据仍然需要通过网络并在节点中存储，以便验证交易的合法性，因此从必须存储的实际数据来看，它与区块大小增加非常。关键区别在于它允许通过软分实现了本质上的区块大小增加（见第\
  \ 4.7.2 节）。`SegWit` 于 2017 年 7 月 21 日激活。\n\n### 4.7.1 可变性来源\n\n输入脚本有多种修改方式，因此交易可变性的多种来源。\n\
  \n#### 基于签名的可变性来源\n\n第一个基于签名的可变性来源是编码歧义的结果。特别是，`OpenSSL` 软件库允许 `r` 和 `s` 的值以多种方式编码而不使签名失效。根据编码的不同，交易可能产生不同的交易\
  \ ID。\n\n另一个基于签名的可变性来源可以在 ECDSA 签名中找到。使用数字 `s` 的负数（模曲线阶）不会使签名失效。这通过我们在第 4.3.4 节中“签名消息”下的示例可以最好地说明。\n\
  \n假设攻击者将 `s` 的值从 7 改为 -7。由于 (11 ·-7) mod 13 = 1，7 mod 13 的逆对应于值 11。第一步，将该值插入以下方程中。\n\
  \n```\nimages/pg132-1.png\n```\n\n这导致 `u[1]` = 5。第二步，他再次取 -7 的计算逆并乘以 `r` = 5，由此获得结果\
  \ `u[2]` = 3。\n\n```\nimages/pg132-2.png\n```\n\n第三步中，消息接收者在以下方程中插入 `u[1]` 和 `u[2]`\
  \ 的两个值。然后可以通过点倍加和加法求解所得方程，从而获得结果 `P` = (18, 17)。\n\n```\nimages/pg132-3.png\n```\n\
  \n如之前所示，我们使用 `P` 的 *x* 坐标模 13 并将结果与 `r` 进行比较。由于 18 mod 13 = 5 = `r` 成立，尽管我们对 `s`\
  \ 进行了修改，签名仍然有效。结果是交易仍然有效但将具有新的交易 ID。\n\n请注意，通过 BIP0066 提议的严格区分编码规则（DER）编码要求，这两个与签名相关的问题都得到了很大缓解。\n\
  \n\n\n\n\n# 基于操作码的可塑性来源\n\n基于操作码的可塑性来源无法被轻易解决。特别是即使在与 `BIP0066` 相关的更改之后，仍然可以在不影响交易的情况下修改\
  \ `scriptSig`。一个常见的例子是添加了 `DATAPUSH` 操作符，紧接着添加一个 `DROP` 操作符。这种修改既不影响栈状态，也不影响 `scriptPubKey`\
  \ 的执行，因为添加的内容会被立即丢弃。然而，在计算哈希值时，这种变化会导致完全不同的交易 ID（ID）。SegWit 通过将实际脚本移动到一个不影响交易 ID\
  \ 的数据结构中，解决了这个问题。\n\n### 4.7.2 软分叉实现\n\nSegWit 是通过软分叉实现的（参见第 2.5.3 节）。这意味着错过或拒绝网络升级的节点仍然能够处理带有\
  \ SegWit 输出的交易。对于它们来说，这些输出看起来就像可以被任何人花费。因此，旧节点即使缺少签名也会接受该交易。新节点对空输入脚本有不同的解释。特别是，它们会寻找见证数据（witness\
  \ data）并期望在那里找到有效的签名。只有在提供有效见证数据时，它们才会接受该交易。\n\n考虑到上述实现方式，现在应该很清楚为什么 SegWit 网络升级是一个软分叉了。只要大多数计算资源被分配给新的共识规则，链就只有一个版本。这个版本被旧、新节点共同接受。然而，如果大多数计算资源被分配给非\
  \ SegWit 节点（旧共识规则），我们将陷入两个竞争的区块链版本的境地。最长链（旧版本）将允许任何人花费 SegWit 输出，而无需有效签名。新版本的节点将寻找见证数据，并可能拒绝旧节点创建的区块。因此，它们不会接受最长的区块链版本，因为这不符合它们的共识规则。\n\
  \n因此，在激活这些更改之前，确保绝大多数矿工接受这些更改是至关重要的。只有在确定大多数矿工支持 SegWit 之后，这些更改才被激活。虽然这种设计选择确实有其缺点，但它的优点超过了硬分叉的潜在劣势。软分叉实现降低了网络分裂的风险，并确保了现有基础设施仍可使用。\n\
  \n### 4.7.3 SegWit 交易类型\n\nSegWit 的交易看起来略有不同。在本节中，我们将讨论两种与第 4.5 节中讨论的向公钥哈希支付（pay-to-public-key-hash）和向脚本哈希支付（pay-to-script-hash）相似的交易类型。此外，我们还将如何出于兼容性考虑将这些交易嵌入到脚本哈希支付交易中。\n\
  \n#### 向见证公钥哈希支付 (Pay-to-Witness-Public-Key-Hash)\n\n![](img/pg134-1.png)\n\n向见证公钥哈希支付\
  \ (P2WPKH) 是向公钥哈希支付的 SegWit 等等形式。尽管相似，但 SegWit 版本的锁定脚本简单得多。它只包含两个值：一个版本号（通常为零），后面跟上压缩公钥的\
  \ 160 位哈希。非 SegWit 节点解释该输出时可以在不需要签名的情况下花费，因为 `scriptSig` 字段是空的。相比之下，新客户端将锁定脚本解释为“在见证数据中寻找并验证签名”。出于这个原因，新的见证字段包含了与\
  \ `scriptSig` 字段相同的信息。\n\n#### 向见证脚本哈希支付 (Pay-to-Witness-Script-Hash)\n\n![](img/pg134-2.png)\n\
  \n向见证脚本哈希支付 (P2WSH) 是向脚本哈希支付的 SegWit 等等形式。尽管相似，但 SegWit 版本的锁定脚本简单得多。它只包含两个值：一个版本号（通常为零），后面跟上压缩公钥的\
  \ 160 位哈希。非 SegWit 节点解释该输出时可以在不需要签名的情况下花费，因为 `scriptSig` 字段是空的。相比之下，新客户端将锁定脚本解释为“在见证数据中寻找签名”。出于这个原因，新的见证字段包含了与\
  \ `scriptSig` 字段相同的信息。\n\n#### 嵌入式 SegWit 交易 (Embedded SegWit Transactions)\n\n\
  （注：此处原文存在大量重复段落，已根据要求对核心内容进行翻译并格式化处理。）\n\n\n\n\n\nSegWit 通过将大部分交易数据从 `scriptSig`\
  \ 移动到 `witness` 字段，增加了区块中可以包含的交易数量。旧客户端无法识别 `witness` 字段，并且不会将这部分数据计入 1 MB 的区块大小限制。然而，新客户端引入了一个新的指标，即所谓的区块权重\
  \ `W`。区块权重限制为 4 MB；也就是说，只有 `W` ≤ 4 的区块会被新的共识规则接受。\n\n区块权重 `W` 使用以下方程计算，其中 `bs(all-wit)`\
  \ 是该区块中排除 `witness` 字段后所有交易的字节数和，而 `bs(all)` 是包含 `witness` 字段的相同交易的字节数和。\n\n![](img/pg136-2.png)\n\
  \n现在让 `β` ∈ (0, 1) 表示存储在 `witness` 字段中的数据比例。这允许我们把方程重写为如下：\n\n![](img/pg136-3.png)\n\
  \n区块权重限制 `W` ≤ 4 意味着\n\n![](img/pg136-4.png)\n\n项 `![](img/pg137-in-1.png)` 是确认容量。它是区块中可以包含的交易数据的最大数量。它取决于\
  \ witness 数据的比例 `β` 和权重限制 4 MB。显然，权重限制的增加或 `β` 的增加都会增加 `C`。特别是有以下三种情况：\n\n**没有 SegWit\
  \ 交易 (`β` = 0)：** 当没有 witness 数据时，我们得到 `bs(all)` = 1。在这种情况下，`bs(all)` 的大小与 `bs(all-wit)`\
  \ 以及旧的 1 MB 区块大小限制完全相同。\n\n**只有 SegWit 交易 (`β` = 1)：** 这是一个理论情况，因为总会有一些非 witness\
  \ 数据（例如 coinbase  交易）。然而，在理论上，`β` 可以非常接近 1，这意味着 `bs(all)` 接近 4。在这种情况下，尽管拥有接近 4 MB\
  \ 的确认容量，但区块大小远低于 1 MB。\n\n**部分 SegWit 交易 (`β` ∈ (0, 1)):** 在这种情况下，确认容量处于 1 MB 到\
  \ 4 MB 之间。图 4.24 显示了确认容量作为 `β` 的函数。\n\n![图 4.24 确认容量 C (MB) 随权重限制 W = 4 MB 和 witness\
  \ 数据比例变化的函数](img/fig4-24.png)\n\n图 4.24\n\n作为权重限制 `W` = 4 MB 和 witness 数据比例函数的确认容量\
  \ `C` (MB)。\n\n如图 4.24 所示，容量 `C` 随着区块中 SegWit 交易比例的增加而增加。事实上，这种增长是非线的。对于低 `β` 值，`β`\
  \ 的增加只能允许少量额外的交易，因为在 `β` = 0 时 `C` 对 `β` 的导数小于 1。相比之下，对于高 `β` 值，`β` 的增加允许许多额外的交易，因为在\
  \ `β` = 1 时导数大于 1。\n\n总的来说，切换到 SegWit 交易符合网络的最大利益。对于按字节数和比例支付交易费的个人来说也是如此——交易会占用区块大小限制。因此，存在强烈的激励机制，从远来看这将鼓励网络向仅\
  \ SegWit 区块发展。\n\n## 4.8 练习\n\n**练习 4.1：** 解释为什么比特币系统使用假名，并列出常见的假名形式。\n\n**练习 4.2：**\
