  \ `P2WSH` 仅采用 `SHA256`。\n\n25. 对于测试网地址，这部分被改为 `tb`。\n\n# 5 交易共识\n\n在本章中，我们将解释交易如何进入比特币区块链，并展示网络如何对账本的当前状态达成共识。我们将研究区块的数据结构，讨论这些区块是如何连接的，并分析比特币挖矿的基础知识、底层的游戏理论以及工作量共识机制。\n\
  \n## 5.1 区块与区块链\n\n在之前的章节中，我们已经解释了网络参与者如何生成和传播交易消息，并展示了他们如何验证其他参与者交易消息的真实性和完整性。每个全节点都维护着自己的经过验证的交易集（所谓的内存池），这些交易尚未被确认，等待包含在比特币区块链中。这些内存池可能有所不同。因此，比特币系统必须提供一种程序，允许网络对哪些交易应该包含在比特币区块链中达成一致。\n\
  \n### 5.1.1 比特区块链\n\n比特币区块链是比特币系统的公共账本，包含了自创世纪区块以来处理的所有交易。它是一个不断扩展的数据库，允许用户查询任何时间点的比特币单位的分配情况。为了从中获取相关信息，所有数据都必须经过解析——即进行适当的格式化。\n\
  \n2019 年底，比特币区块链的数据量约为 205 GB。图 5.1 显示了数据量随时间的发展情况。这种增长以及比特币区块链必须由系统中每个全节点存储和处理的事实，引发了对比特币系统扩展性的关注。我们将在第\
  \ 6.2 节处理其中一些问题。\n\n![图 5.1 区块链的增长。来源：数据来自 Blockchain Explorer，无日期，https://www.blockchain.com/explorer.](img/fig5-1.png)\n\
  \n图 5.1 区块链的增长。\n来源：数据来自 Blockchain Explorer，无日期，https://www.blockchain.com/explorer。\n\
  \n每个网络参与者都可以下载比特币区块链的副本并独立验证每笔交易。也可以修改下载的副本。由于共识协议（见 5.2.2 节），只有当修改后的区块链副本符合一组定义的规则时，其他网络参与者才会接受。如果节点不遵守这些规则，那么本地持有的比特币区块链副本将被所有人忽略。\n\
  \n### 5.1.2 区块的组成\n\n比特币区块链由所谓的区块组成。每个区块至少包含一笔交易。图 5.2 显示了一个区块的示例并列出了它的内容。每个区块必须包含这些内容并以正确的方式格式化。除了交易数据外，区块必须包含一个所谓的\
  \ `block header`，它由 640 位（80 字节）描述数据组成，允许区块在区块链中被识别和定位。我们将在下方深入讨论区块头的各个组成部分。\n\n\
  ![图 5.2 区块的结构和组成部分](img/fig5-2.png)\n\n图 5.2 区块的结构和组成部分。\n\n**版本。** 版本字段标识用于生成区块的协议版本。这是一个\
  \ 32 位数字，提供了有关区块生成时运行的底层规则集的信息，并引用了这些规则。\n\n**引用。** 引用字段将区块链接到上一个区块，通常称为`父区块`。\n\
  \n**时间戳。** 时间戳字段包含与区块生成时间有关的信息。时间戳必须在一个时间范围内。\n\n**阈值。** 阈值字段包含区块哈希可以具有的最大值，以便其被网络视为有效。\n\
  \n**随机数。** `nonce` 字段允许包含任意数据。修改随机数字段可以确保内容其他情况下相同的区块仍然具有不同的哈希值。\n\n**Merkle 根。**\
  \ `merkle root` 字段包含由所有交易构建的 merkle 树的根。交易本身没有包含在区块头部。Merkle 根的目的是保证交易的完整性。\n\n\
  在 `merkle tree` 中，交易成对排列，并计算每对的哈希值。成对的哈希值连续排列成新对，直到只剩下一个哈希值。这个值就是 merkle 根；换句话说，是\
  \ merkle 树的加密安全根。如果树中只有一笔交易被修改，merkle 根将取一个完全不同的值。\n\n对交易的任何修改都会导致原始的 merkle 根不再与修改后的交易一致。因此，原始区块将失效。Merkle\
  \ 根是区块头与区块中交易之间的链接，保证了交易在不被察觉的情况下无法修改。\n\n图 5.3 展示了一个仅包含三笔交易（*a*、*b* 和 *c*）的小型 merkle\
  \ 树图。每当 merkle 树的元素数量为奇数时，会将最后一个元素复制，并计算两个相同元素的哈希值。在我们的示例中，我们看到这一程序被应用于值 *c*。\n\n\
  ![图 5.3 包含 a、b、c 三笔交易的哈希树](img/fig5-3.png)\n\n\n\n\nMerkle 树的优势在于它允许高效地验证特定交易。对于\
  \ `N` 笔交易，最多需要 `2log[2] (N)` 个计算步骤即可验证某交易是否为 merkle 树的元素，因此是否为相应区块的元素。\n\n### 5.1.3\
  \ 链结构\n\n一个区块精确地引用一个父区块.^(2) 这些引用生成了一个系列类似于链的区块，区块链（blockchain）便由此命名。\n\n每个有效区块在链中都有一个特定的位置，该位置由两个术语定义：`block\
  \ height`（区块高度）和 `block depth`（区块深度）。`block height` 指明给定区块在链中的位置，其中第一个区块（所谓的创世区块）被分配为数字零。`block\
  \ depth` 指区块距离最新区块的距离。正因如此，每当有一个新区块添加到比特币区块链时，区块的 `block depth` 就会增加。`block depth`\
  \ 对于安全分析至关重要。此外，它还为 SPV 节点提供了一个评估交易有效性的启发式方法（参见第 3.2.2 节 chapter_3.xhtml#sec3-2-2)）。\n\
  \n[图 5.4 显示了此类链的示例以及识别区块在区块链中位置的相应术语。在这个示例中，从左数第三个区块的 `block height` 为 2。由于该区块只有一个后续区块，它目前的\
  \ `block depth` 为 1。\n\n![图 5.4 区块链示例。](img/fig5-4.png)\n\n图 5.4  \n\n区块链示例。\n\n\
  识别区块的第三种可能性是区块的标识码；即区块头的哈希值。为了计算哈希值，将区块头输入 `SHA256d` 哈希函数，在其中，各个位通过一个涉及六四轮各种非线性过程的过程被确定性地重新排列和修改。生成的哈希值随后被输入哈希函数进行第二轮六四轮运行。哈希函数的抗碰撞性（参见第\
  \ 4.2 ）确保了链中没有两个区块具有相同的标识码。\n\n`SHA256` 哈希值的长度为 256 位。为了简单起见，这些值通常被格式化为六十四位的十六进制数。此类哈希值的示例\
  \ `000000342bb08fa10ea042f4a6ce3b140c390f997816b7f353ddd806ac5db1ec`。该哈希值对应于图 5.5\
  \ 所示链示例中第一个区块的标识码。\n\n![图 5.5 基于前一个区块头哈希值的引用形成了链结构。](img/fig5-5.png)\n\n图 5.5  \n\
  \n基于前一个区块头哈希值的引用形成了链结构。\n\n现在让我们来看这种链结构。每个新区块都引用链中的最后一个区块作为其前驱（所谓的父区块）。为了将一个区块与其父区块链接，区块头中的引用字段包含了其父区块的哈希值。图\
  \ 5.5 展示了两个示例。链中的第二个区块引用第一个区块的哈希值。链中的第三个区块引用第二个区块的哈希值。\n\n由于引用字段是区块头的一部分，因此它会影响相应区块的哈希值。因此，如果有人修改了区块的引用字段或任何其他输入，该区块的哈希值就会改变.^(3)\n\
  \n在图 5.6 中，区块 1 添加了一笔交易。这次添加改变了区块的 merkle root，从而改变了区块头的哈希值。新值为 `ae21f25523ae1d4e3864583d2b99d27bfc4cf00dbf6281951aff01fe809e9534`。第二个区块的引用字段仍然包含旧值\
  \ `000000342bb08fa10ea042f4a6ce3b140c390f997816b7f353ddd806ac5db1ec`。由于区块 1 的新哈希值没有被区块\
  \ 2 的引用字段引用，两个区块之间的链接被断开了。\n\n![图 5.6 对区块 1 内容的修改（灰色）改变了其哈希值并导致区块 2 的引用失效](img/fig5-6.png)\n\
  \n图 5.6  \n\n对区块 1 内容的修改（灰色）改变了其哈希值并导致区块 2 的引用失效。\n\n为了恢复区块 1 和区块 2 之间的链接，区块 2 头中的引用字段必须包含区块\
  \ 1 的新标识码。然而，这种修改将立即破坏区块 2 和区块 3 之间的链接，因为它使区块 3 对区块 2 的引用失效。图 5.7 显示了对区块 2 引用的修改如何影响其哈希值，以及这如何导致区块\
  \ 3 的引用失效。\n\n![图 5.7 对区块 2 引用字段的修改（灰色）改变了其哈希值并断开了区块 3 与区块 2 之间的链接](img/fig5-7.png)\n\
  \n图 5.7  \n\n对区块 2 引用字段的修改（灰色）改变了其哈希值并断开了区块 3 与区块 2 之间的链接。\n\n这个示例展示了区块链安全模型基础的连锁反应。如果一个区块被修改，链就会断裂，所有后续区块将失效。因此，修改具有缩短链的效果。如果要链带有修改信息后保持原始长度，被修改的区块以及所有后续区块必须重新\n\
  \n### 5.1.4 扩展链\n\n为了扩展区块链，节点创建新区块。它们可以使用内存池中的任何交易集，计算 merkle root 并组装新区块。作为引用值，它们采用最后一个区块的标识码。\n\
  \nTony 是执行此功能的网络参与者并尝试生成新区块。他从内存池中选择一些交易放入区块中。Tony 在收到这些交易时已经验证了它们的合法性。因此，他知道每笔交易都附带了所有引用输出的有效解锁脚本。此外，他还验证了这些交易仅使用了未花费的输出。Tony\
  \ 还引用了比特币共识版本的最后一个区块。\n\n随后他计算其新区块的哈希值，并将其发送给其他节点。然而，这一步是有问题的。Tony 不是唯一生成了新区块的网络参与者。其他节点也形成了新区块。所有这些区块都引用同一个父区块。新区块的并行产生产生了新的竞争且互不兼容的比特币版本的可能性。这种情况的一个示例如图\
  \ 5.8。\n\n![图 5.8 区块链在第三个区块之前相同，之后发生分叉。这导致链出现了七种竞争版本。](img/fig5-8.png)\n\n图 5.8\
  \  \n\n区块链在第三个区块之前相同，之后发生分叉。这导致链出现了七种竞争版本。\n\n目前的示例强调了链结构本身并不保证不同节点能够对单一有效版本达成一致。只有当我们增加额外的规则时，才可能实现网络共识。\n\
  \n## 5.2 共识协议\n\n\n\n在比特币网络中，任何人都可以调整自己本地的比特币区块链副本。没有一个中心化的机构来决定哪种区块链版本对应真实状态。因此，可能会出现网络参与者对区块链的真实状态无法达成共识的情况。为了解决这个问题，比特币系统基于一组预定义的共识规则，这使得某个版本的比特币账本可以被识别为真实版本。\n\
  \n最常用的比特币软件客户端默认遵循所有共识规则。然而，默认设置并没有提供任何针对偏离行为的保护。网络参与者可以编写自己的`software client`，或者使用不同规则集来修改现有的软件客户端。在经济学中，理性选择理论假设理性人如果违反规则是有利的，他们就会违规。因此，共识协议的构建方式必须使得个体通过纯粹的自利行为来遵守现有规则。\n\
  \n相应的激励通过各种机制实现。基本原理是：欺诈行为是高昂的，且所有网络参与者都能立即揭露这种行为。然而，诚实行为会获得系统激励方案的奖励。接下来，我们将讨论共识协议的每个基本组件，并展示它们如何影响网络参与者的行为。\n\
  \n### 5.2.1 仅合法交易\n\n最基本的共识规则是，比特币区块链只能包含合法交易。交易的合法性可以像第 4 章描述的那样由每个全节点独立进行验证。此外，还有一系列其他测试，这些测试都决定了交易以及包含这些交易的区块是否有效。这些测试中的许多仅用于防止网络被强制过载（`DoS\
  \ attacks`）。\n\n执行这些验证步骤在计算上是非常廉价的。因此，包含无效交易的候选区块会被立即暴露，并被网络其他部分忽略。结果，如果有人在候选区块中添加欺诈交易，会导致该候选区块被所有其他网络参与者拒绝。这破坏了产生该区块并获得奖励的所有可能。因此，只包含有效交易是理性的。\n\
  \n### 5.2.2 工作量证明\n\n在图 5.8 的示例中，出现了七个竞争的区块链版本，这是因为同时生成了太多的有效区块。生成候选区块所需的计算力非常小，即使使用移动设备也可以在几分之一内完成。这导致的结果是，新候选区块产生的速度远快于它们在网络上交换的时间。因此，我们需要一种人工限制，增加创建有效候选区块的难度，从而为网络提供交换数据和达成共识所需的时间。这是通过所谓的工作量证明（proof-of-work）共识机制实现的。\n\
  \n工作量证明最初是为了应对垃圾邮件和`DoS attacks`（见 5.3.5 节）。其基本思想是：如果一项活动执行得太快，就应该减慢它的速度。这通过要求该活动提交一个耗时数学问题的解决方案来实现。涉及的数学问题只能通过试错法解决。平均而言，每隔`x`次尝试才能产生所需的结果。\n\
  \n这一原则为活动施加了人工成本。这些成本在垃圾邮件和`DoS attacks`的背景下，通过阻碍过度活动提供了保护。同时，正常使用产生的成本是微不足道的。在比特币的背景下，这一过程产生了几种影响，列举如下：\n\
  \n* 它解决了区块生成过快的问题。\n* 它确保了链在不付出成本的情况下无法被和重建。因此，它受到了构建该链所花费的哈希算力的保护。\n* 它诱导节点表现得诚实，否则他们投入的昂贵哈希算将被浪费。\n\
  \n工作量证明通过使用候选区块头在比特币网络中实现。其`hash value`必须具备一个极其罕见的特征：它必须低于某个阈值；也就是说，它必须在`identification\
  \ number`的开头显示几个零。只有这样，候选区块才会被认为是有效的。\n\n\n\n\n在比特币系统中，挖矿难度是动态调整的，以确保整个网络平均每十分钟生成一个有效区块。难度每\
  \ 2,016 个区块进行一次校准。假设区块生成的平均时间为十分分钟，则预期的调整间隔时间为 `E`(`t`)` = `20,160` 分钟（约十四天）。由于概率性的挖掘过程和算力的变化，网络生成\
  \ 2,016 个区块的实际时间 `t` 将会有不同。\n\n难度通过通过阈值 `δ` 的改变来调整。任何全节点都可以通过以下方程独立地计算阈值：\n\n![](img/pg150-in-1.png)\n\
  \n如果 `t < E`(`t`)`，则 `δ`[`new`] < `δ`[`old]`。较低的 `δ` 阈值使得寻找有效区块变得更加困难，从而产生区块生成率回落到接近十分分钟平均水平的效果。如果\
  \ `t > E`(`t`)`，则 `δ`[`new`] > `δ`[`old]`。这使得寻找有效区块变得更加容易，从而提高了区块生成率。\n\n另一种展示阈值随时间变化的方法是通过难度参数\
  \ `D`。当前难度等级 `D`[`i]` 可以通过将初始阈值 `δ`(`B`[`0]`)^([8])` 除以当前阈值 `δ`(`B`[`i]`) 来计算。\n\
  \n![](img/pg152-1.png)\n\n`difficulty` 的发展方向与 `threshold value` 完全相反。如果阈值降低，寻找有效区块就会变得困难，难度也随之增加。[图\
  \ 5.11] 显示了参与比特币挖矿的算力随时间推移而剧增。它还显示了 2017 年和 2018 年难度的剧增。\n\n![图 5.11 难度比例随时间变化的趋势。来源：数据来自\
  \ Blockchain Explorer，n.d., https://www.blockchain.com/explorer.](img/fig5-11.png)\n\
  \n[图 5.11]\n\n难度比例随时间变化的趋势。\n\n来源：数据来自 Blockchain Explorer，n.d., [`www.blockchain.com/explorer`](https://www.blockchain.com/explorer)。\n\
  \n#### 框 5.1 算力\n\n衡量挖矿的相关单位是每秒哈希次数；即每秒可以计算多少个哈希值。在比特币网络中，总算力目前以每秒艾哈（千万亿或 10¹⁸）为单位进行衡量。\n\
  \n算力的增长源于比特币价格的提高以及`mining hardware`效率的剧提升（见[框 5.3]）。在[第 6.4.1 节]中，我们将分析网络的能源消耗。\n\
  \n### 5.2.4 挖矿奖励与比特币的产生\n\n工作量证明在生成区块时对节点施加了成本。这是一项刻意的设计决策，对于系统的运行是绝对不可缺的。特别是，挖矿过程保护了比特币网络。通过保护比特币网络，矿工提供了一种公共物品，因为其收益具有非排他性和非竞争性。\n\
  \n挖矿的成本由矿工个人承担，而挖矿的收益则提供给整个网络。这引引发了一个问题：为什么理性的个体会想要承担`mining`功能呢？每个节点都倾向于让别人投入必要的资源并享受收益，而自己不做任何贡献。这个问题的答案在于比特币系统的内生奖励机制。\n\
  \n生成有效区块的全节点将获得新的比特币单位。他们将根据分配给此项活动的算力比例获得奖励。补偿通过`coinbase transaction`（币基交易）支付给矿工。这种交易不需要引用\
  \ UTXO。它创建了新的比特币单位，并带有矿工选择的解锁条件。\n\n每个候选区块都包含一个币基交易。然而，与任何交易一样，币基交易只有在候选区块被纳入区块链的共识版本时才有意义；否则，它就一文不值。此外，奖励金额是预先定义的，如果矿工不遵守共识规则，区块将被其他节点忽略。\n\
  \n在最初的大四年里，奖励每个区块为 50 个比特币单位。此后该金额每 210,000 个区块减半。因此，从区块 0 到区块 209,999，每个币基交易都包含\
  \ 50 个比特币单位加上交易费。在区块 210,000 到 419,999 之间，币基交易包含 25 个比特币单位加上交易费。在本书时，币基奖励金额为 12.5\
  \ 个比特币单位。然而，在本书出版前不久计划了另一次奖励减半（2020 年中期）。从区块 630,000 开始，币基奖励将下降到每个区块 6.25 个比特币单位。\n\
  \n币基交易的价值将继续减半并趋于零。届时将不再产生任何新的比特币单位。预计这将在 2140 年发生，届时将达到两千一万个比特币单位的上限。[9]\n\n####\
  \ 框 5.2 交易费\n\n矿工还从与区块相关的交易费中获。这些费用由所有输入之和减去所有输出之和组成。因此，它们未被使用的剩余金额，可以由相应的矿工提取。\n\
  \n交易发起者添加交易费，以激励矿工将其交易包含在候选区块中。通常，矿工倾向于每字节费用更高的交易。\n\n随着币基奖励的减少，交易费将变得越来越重要。第 6.3.2\
  \ 节将深入讨论这一主题。\n\n### 5.2.5 共识版本\n\n还有一个确保共识的重要规则有待讨论。如果流通着两个或多个版本的区块链，则必须有一种机制允许节点判断哪些版本对应真实状态。为了实现共识，所有节点（或至少大多数节点）必须对结果达成一致。\n\
  \n由于我们已经熟悉了工作量证明算法和难度比例，现在可以简洁地解释这一原理。共识链是累积难度最大的链。在[第 2.4.3 节]中，我们通过引用“最长链”简化的形式介绍了这一标准。这通常会导致相同的结果。\n\
  \n### 5.2.6 总结\n\n这些共识规则的结合将产生比特币区块链的主版本。在接下来的章节中，我们想回顾这些概念，重点关注规则之间的相互作用。\n\n**合法性**：合法性防止不一致和无效的交易进入区块链的共识版本。\n\
  \n**链接**：链接连接区块并确保在修改链后必须重新计算区块。这适用于被区块的所有后续区块。\n\n**工作量证明**：工作量证明使得创建有效区块变得困难。如果链被修改，只有投入大量资源才能重建。这使得修改变得耗费资源。\n\
  \n**阈值**：变化的阈值确保了无论投入多少算力，区块生成率都保持在十分钟的平均水平。\n\n**奖励**：奖励激励节点提供算力，并利用它来维护区块链的共识版本。\n\
  \n\n\n\n累计难度。该标准的作用是确保当区块链出现冲突版本时，获得工作量最多的版本将被视为共识版本。\n\n## 5.3 比特币挖矿：激励机制与示例\n\n\
  在本节中，我们重点关注哈算力的分配，并考察共识规则中某些部分的激励兼容性。具体而言，我们评估了偏离共识规则是否会导致更高的报酬，并考虑了各种攻击向量。\n\n\
  ### 5.3.1 哈算力分配的经济学\n\n节点提供的哈算力数量取决于其成本结构和预期奖励的当前价值。成本主要由可用硬件的效率以及运营成本（如维护、电费和冷却）决定。这些组件决定了计算特定数量哈希值的边际成本。\n\
  \n奖励以比特币（Bitcoin）单位支付。因此，挖矿的激励直接取决于比特币的市场价值。获得奖励的概率取决于矿工的哈算力相对于网络总哈算力的比例。\n\n挖矿市场极具竞争。准入门槛非常低。如果成本是同质化的，额外的哈算力将流入市场，直到进一步增加哈算力带来的预期边际收益与其提供该哈算力的边际成本相对应。\n\
  \n在接下来，为了简单起见，我们假设计算一个哈希值的边际成本对所有矿工都是相等且恒定的。由于技术进步或规模收益增加导致的边际成本下降是实践中的重要因素，但它们不会显著改变挖矿市场的短期动态。\n\
  \n计算一个哈希值的预期边际收益随网络总哈算力的增加而减少。其原因是，网络总哈算力的增加也会增加难度，从而导致在相同哈算力下，发现有效区块的概率会降低。计算一个哈希值的边际收益递减的情况如图\
  \ 5.12 所示。该图还显示了边际成本与预期边际收益的交点。\n\n![图 5.12 哈算力的平衡。](img/fig5-12.png)\n\n[图 5.12]\
  \  \n\n哈算力的平衡。\n\n固定成本（如采购硬件的成本）对市场的进入退出以及挖矿市场的长期行为起着作用。然而，一旦矿工拥有了硬件，这些成本就可以忽略不计。因此，在短期内与哈算力分配相关的唯一变量是计算哈希值的预期边际收益与此类计算的边际成本之间的比例。\n\
  \n如果该比例大于一，将提供额外的哈算力，直到该比例回到一。新的哈算力通常是从其他区块链挖矿中转移而。如图 5.13a 所示，网络的哈算力将收敛到平衡水平。如果该比例小于一，矿工将面临损失。计算力将退出并转用于他处，直到该比例回到一为止。这种情况如图\
  \ 5.13b 所示。\n\n![图 5.13 网络总哈算力的适应。](img/fig5-13.png)\n\n[图 5.13]  \n\n网络总哈算力的适应。\n\
  \n#### 框 5.3 高效挖矿硬件\n\n挖矿硬件的效率在多年来得到了巨大的提高。最初，挖矿完全是使用计算机的中央处理器（`CPU`）。由于图形处理器（`GPUs`）更适合计算哈希值，许多人开始采用\
  \ `GPUs` 进行挖矿。转向所谓的“现场可编程门阵列”（`FPGAs`）使得电路板可以为挖矿过程进行配置，从而导致了效率的再次飞跃。\n\n自 2013 年以来，人们开始使用应用专用集成电路（`ASICs`）。ASICs\
  \ 是为特定任务定制的高度专业化硬件模块。在比特币 ASICs 的案例中，它们经过了优化，专门用于计算 SHA256 哈希值。\n\n硬件效率的提高并不会降低维护网络的成本。它只是增加了网络哈算力的总量。原因是，更高的难度系数会抵消更高水平的哈算力。\n\
  \n### 5.3.2 哈算力的分配与矿池\n\n在本节中，我们通过一个示例来考虑哈算力的分配和池挖矿。在这个示例中，我们假设哈算力的分配是给定且恒定的，参与者提供了十六个单位的哈算力。节点的哈算力由图\
  \ 5.14 中相应圆圈中的数字表示。节点创建下一个区块的概率对应于该数字除以十六个单位的总哈力。\n\n![图 5.14 挖矿哈算力的分配。](img/fig5-14.png)\n\
  \n[图 5.14]  \n\n挖矿哈算力的分配。\n\nEdith 运行一个全节点但不想挖矿。因此，她发现有效区块的概率为零，但她仍然能够验证链中所有交易和区块的合法性。所有其他节点都参与新区块的创建。Michèle\
  \ 拥有四个单位哈力，因此创建下一个区块的概率为 25%。剩余的十二单位哈力分配给其他网络参与者。\n\n矿工永远不知道何时以及何时会收到奖励。这种支付模式相当于彩票，哈算力相当于矿工持有的彩票数量。哈算力越大，成功的机会就越大。\n\
  \n为了应对支付波动问题并平滑收益，矿工能够形成所谓的“矿池”（`mining pools`）。这些矿池整合了参与者的哈算力并作为一个整体运行。组合哈力带来了更规律的奖励，按比例分配给矿池的所有成员。预期收益保持不变，但奖励的波动显著降低。\n\
  \n在我们图 5.14 的示例中，Brian、Jake 和 Claudia 作为独立矿工运行。他们每个人控制总哈力的 `images/pg159-1.png`，考虑到每个区块\
  \ 12.5 个比特币的奖励，因此他们预计每十分钟的挖矿活动可以获得 `images/pg159-2.png` 个比特币的支付。可能的支付金额为 15 × 0\
  \ 和 1 × 12.5 个比特币，导致支付的标准差较高，为 3.125。\n\n在图 5.15 中，这三个人决定组成一个矿池。奖励的标准差因此显著降低到 1.63，因为矿池成员在十种可能情况中的三种情况下各按比例获得\
  \ `images/pg159-3.png` 个比特币。奖励的预期值不受他们联盟的影响。可以使用一个非常简单的等式来说明，该等式将独立挖矿（`solo mining`）与矿池挖矿（`pool\
  \ mining`）的支付相等：\n\n```\nimages/pg159-1.png\n![图 5.15 Brian 的矿池。](img/fig5-15.png)\n\
  ```\n\n[图 5.15]  \n\nBrian 的矿池。\n\n\n\n\n如果相应矿工的算力为 `h`，整个网络的总算力为 `H`，且当前每个区块的奖励为\
  \ `R`，那么个人奖励的期望值将不受受`矿池 P` 算力总量的影响。^(12)\n\n![](img/pg159-2.png)\n\n在现实中，一个*单机矿工*可能需要等待几个月甚至几年才能创建一个有效的区块并获得报酬。这就是为什么矿池如此流行，以及为什么它们在比特币网络中扮演着至关重要的角色。\n\
  \n矿池是导致比特币系统趋于中心化的因素之一。如果网络的大部分算力集中在一起，账本记录工作在某种程度上就是中心化的。这使得比特币网络变得更加脆弱。此外，连接到矿池的矿工通常不运行全节点（参见\
  \ 3.2.3 节）。他们通过一个中心化的子网络连接到矿池运营商，并仅通过这一通道接收所有与挖掘相关的信息。通常，这类矿工被称为*算力者*（hashers），这一术语描述了他们仅代表他人计算哈希值，而不自己组装候选区块。\n\
  \n在我们图 5.15 的示例中，这适用于 Jake 和 Claudia。由于他们决定加入 Brian 的矿池，他们放弃了全节点状态，从现在起将根据 Brian\
  \ 的要求计算哈希值。网络突然失去了两个全节点，现在有了一个控制着网络近 20% 算力的大型矿池运营商。\n\n### 5.3.3 接受其他参与者的区块\n\n\
  一段时间后，Michèle 能够成功生成一个候选区块，其哈希值低于当前阈值。该区块也符合共识规则的所有其他要求，因此将被其他节点接受，并添加到它们本地存储的区块链版本中。\n\
  \n然而，Brian 仍然有些犹豫。他更希望已经为自己的矿池锁定了奖励，因此他正在考虑违反共识规则，不接受 Michèle 的有效区块。如果他的矿池成功创建了一个基于上一个区块的区块，该矿池就有机会对\
  \ Michèle 的奖励产生争议。\n\n这种情况在图 5.16 中给出。Michèle 成功生成了一个基于区块 3 的区块，从而扩展了区块链的共识版本。Brian、Jake\
  \ 和 Claudia 现在尝试用他们的矿池生成一个同样基于区块 3 的区块，并试图夺取 Michèle 的奖励。\n\n![图 5.16 在偏离行为下，Brian\
  \ 矿池的概率和收益。](img/fig5-16.png)\n\n图 5.16\n\n在偏离行为下，Brian 矿池的概率和收益。\n\n为了让矿池能够通过 Michèle\
  \ 的区块反超链的共识版本，他们必须生成接下来的两个有效区块。与此同时，网络的其他部分将继续处理当前的共识版本；即 Michèle 的区块链版本。\n\n不同的路径代表了区块链可能的版本。Brian\
  \ 矿池的区块显示为灰色。所有其他区块显示为白色。虚线区块只能以特定的概率生成，并位于可能路径之一。\n\n让我们先看下方的路径。由于 Brian 的矿池控制着三个单位的算力，该矿池创建下一个区块的概率对应于\
  \ ![](img/pg161-in-1.png)。这种情况连续发生两次的概率对应于 ![](img/pg161-in-2.png)。如果这三个矿池参与者成功了，他们包含两个区块的版本将超过\
  \ Michèle 包含一个区块的版本，从而被接受为区块链的新共识版本。在这种情况下，矿池将获得两次每次 12.5 个比特币单位的奖励支付。\n\n在所有其他情况下，竞争性的矿工将能够向共识版本添加至少一个区块。这将使我们处于链的上分支（基于\
  \ Michèle 区块的版本），因此下层链的任何区块都将是无关的。^(13)共识版本获胜的概率对应于 ![](img/pg161-in-3.png)的补概率，即\
  \ ![](img/pg161-in-4.png)。偏离矿池的期望值为：\n\n![](img/pg161-1.png)\n\n作为对比，我们考虑 Brian\
  \ 的矿池遵循共识规则并接受 Michèle 区块的情况。因此矿池将在 Michèle 区块的基础上生成自己的候选区块，并与网络其他部分共同维护区块链的共识版本。链可能发展的各种路径在图\
  \ 5.17 所示。\n\n![图 5.17 在符合共识协议的行为下，Brian 矿池的概率和收益。](img/fig5-17.png)\n\n图 5.17\n\
  \n在符合共识协议的行为下，Brian 矿池的概率和收益。\n\n由于所有矿工都按照相应的版本工作，奖励将不会损失。如果 Brian 的矿池成功生成一个有效区块并将其添加到区块链，他的矿池将获得奖励。我们再次考虑创建后续两个区块的时间；即平均\
  \ 20 分钟。在此期间，矿池有两次机会，每次概率为 ![](img/pg162-in-1.png) 生成下一个区块。四条路径显示了矿池贡献、一个（两条可能路径）或两个区块的状态。通过遵循共识规则，矿池获得以下期望收益：\n\
  \n![](img/pg162-1.png)\n\n示例说明了激励矿工合作的强大动力。如果矿工决定遵守共识规则，其期望值比偏离规则时高得多。因此，接受其他有效区块并始终更新自己的区块链版本符合矿工的利益。\n\
  \n从更深入的角度来看，我们看到偏离产生的期望值与诚实行为路径之一的期望值相等。然而，诚实行为提供了额外的获得奖励的机会，因此更好。\n\n这种优势源于对于 Brian\
  \ 的期望收益而言，Michèle 是否获得奖励无关。泊松过程的数学特性确保了收益之间互不竞争。也就是说，如果 Michèle 能够生成一个有效区块，这不会影响所有其他矿工的期望收益——除非他们忽略\
  \ Michèle 的区块并尝试创建一个竞争链。\n\n除了期望值较低外，不基于比特币区块链当前共识版本生成候选区块的矿工还面临更高的支付波动性。\n\n###\
  \ 5.3.4 区块竞争\n\n由于挖掘是一个概率性过程，可能会同时发现两个竞争区块。这两个区块都引用同一个父区块，从而形成了链的不同版本。\n\n让我们假设，例如区块\
  \ 3 对应当前共识版本的最后一个区块，且 Michèle 和 Tony 都找到了一个引用区块 3 且标识号低于阈值的区块。这导致了在图 5.18 中可视化的情况。\n\
  \n\n\n\n\n![图 5.18 两个竞争区块同时生成后发生的区块竞争。](img/fig5-18.png)\n图 5.18\n\n两个竞争区块同时生成后发生的区块竞争。\n\
  \n在这种情况下，关于最长链（或最高累积难度）的共识规则无法果断地解决问题。两条链都是等效的，并且会在一段时间内共存。只有当两条链中的一个通过额外的有效区块得到扩展时，该链才会占据共识版本的位置，从而使链的另一个版本变得无关紧要。这种场景被称为\
  \ `block race`（区块竞争）。\n\n算力的分配会影响竞争的结果。链的两个版本中，哪一个获得更大的算力份额，哪一个就更有可能被后续的区块扩展。\n\n\
  Michèle 和 Tony 的算力将分别用于扩展他们各自的版本。默认情况下，所有其他矿工都会优先选择他们先收到的区块。因此，如果 Michèle 或 Tony\
  \ 任何一人成功更有效地传播了各自的区块，他们就能赢得更多的节点，从而为自己的链版本赢得更多的算力。我们将分配给 Michèle 版本的算力份额称为 `p`。相应的，Tony\
  \ 的算力份额为 `1 - p`。\n\n区块区块的效率主要取决于各矿工的网络连接。节点的连接越多、越多样化且速度越快，区块的传播就越高效。传播速度与区块的大小成反比。如果一个给定的区块包含多得多的交易，这些额外数据可能会显著减慢速度。由于这个原因，矿工可能会倾向在区块中包含比其可能容纳的更少的交易。\n\
  \n一旦发现新区块，所有矿工都有动力在区块链的共识版本上工作，这确保了网络自动恢复其共识状态。对于网络而言，链的哪个版本能够胜出并不重要。重要的是网络对区块链的单一状态达成一致的共识。\n\
  \n然而，对于 Michèle 和 Tony 来说，这至关重要。奖励是他们各自版本的一部分。如果他们的版本在竞争中输了，其中包含的奖励也将随之失去。在这，失败的矿工可能会倾向将自己的算力分配给自己的版本，即使竞争性的共识版本更加领先。如果失败的矿工成功创建了接下来两个区块，他就可以反超另一个版本并挽回原始奖励。\n\
  \n考虑一种 Michèle 成功创建了另一个有效区块的情况。因此 Tony 面临着决策。如果他遵守规则切换到共识版本，他将失去他的奖励。但通过在共识链上挖矿，他随后将有两次生成一个新的有效区块的概率为\
  \ ![](img/pg164-in-1.png)，从而为每个区块获得 `12.5 Bitcoin units` 的新奖励。他奖励的期望值将约为 `4.69 Bitcoin\
  \ units`。\n\n然而，如果 Tony 决定继续在他自己的链版本上进行工作，他只有在能够创建接下来的两个区块时才会成功。这将使他能够获得新区块的两个奖励以及已创建区块的奖励，相应的预期奖励为\
  \ ![](img/pg164-in-2.png)。偏离行为情况下的支付如图 5.19 所示。\n\n![图 5.19 优先选择较差链版本以捕获孤儿区块奖励的激励。](img/fig5-19.png)\n\
  图 5.19\n\n优先选择较差链版本以捕获孤儿区块奖励的激励。\n\n尽管较差链版本中嵌入的奖励提供了额外激励，但如果 Tony 做出选择，他的境遇会更糟。如果他们的版本在竞争中输了，其中包含的奖励也将失去。在这方面，失败的矿工可能会倾向将自己的算力分配给自己的版本。通过将\
  \ ![](img/pg164-in-3) 替换为反映 Tony 相对算力的变量，我们可以计算出他需要达到的临界值。\n\n在以下方程的左侧，我们看到 Tony\
  \ 在其自己的版本上工作的奖励期望值。![](img/pg164-in-4) 方程的右侧显示了 Tony 在遵循共识版本时的奖励期望值。`R` 代表奖励的大小，在公式中被消除了：![](img/pg165-1)\n\
  \n因此，如果 Tony 正好控制三分之二，他对这些选择将中立。对于较小的算力比例，偏离会让他更糟糕。然而，如果他控制了超过三分之二的整体算力，那么这种行为将变得复杂得多。但简单来说，控制网络超过\
  \ 50% 总算力的矿工理论上可以一直在自己的链上工作，因为他们的链比任何竞争版本增长更快。\n\n此外，主导矿工有可能对网络发动某些攻击，我们将在下一节讨论。因此，矿工（或矿工集团）的支配对网络构成了潜在威胁。\n\
  \n#### 框 5.4：金手指攻击\n\n如果矿工想要最大化来自系统的原生奖励，他们通常不会偏离协议。然而，可能有其他原因导致矿工偏离协议。例如，可以想象一个节点主要受外部激励驱动。\n\
  \n外部动机导致矿工损害比特币系统的场景被称为 `金手指攻击`。它们基于这样假设：富有实体将从失去信任中获利。利益可能是政治性的，也可能直接与比特币价格的下降有关。\n\
  \n取决于利益，实体可能会投入成本来故意破坏系统。这种危险在早期很大。然而，采用的增加、哈率的提高以及市值的飙使得此类攻击成本更高，因此可能性降低。\n\n###\
  \ 5.3.5 对系统的攻击\n\n拥有网络总算力高份额的矿工能够大幅塑造共识链的发展。例如，如果一个矿工拒绝在其任何候选区块中包含特定交易，这将延迟处理该交易的平均时间。该矿工的算力越大，该交易在近期被包含在区块中的可能性就越低。\n\
  \n\n\n\n\n图 5.20 显示了这种情况的一个示例。共识链的第 4 区块包含一个从 Raphael 到 Lucas 的交易。如果矿工想要撤销这笔交易，他可以尝试在第\
  \ 3 区块的基础上启动替代链。区块收到的确认越多——也就是说该区块在链中的位置越靠，实施此类攻击就越困难。对于大多数交易来说，两到三次确认就能让区块足够安全。拥有六个以上确认的区块被认为是不可逆的，其中包含的所有交易也是如此。\n\
  \n![图 5.20 正在替代链上工作的矿工想要取消 Raphael 发给 Lucas 的交易。](img/fig5-20.png)\n\n图 5.20  \n\
  \n正在替代链上工作的矿工想要取消 Raphael 发给 Lucas 的交易。\n\n我们想强调，阻止交易的成本非常高，而且通常无法长时间维持。即使恶劣矿工成功撤销了交易，Lucas（或任何其他人）也可以简单地再次广播相同的交易，最终它会被另一个矿工包含在区块中。因此，几乎无法阻止交易被添加到区块链中——尤其是当我们考虑到激励矿工包含交易的费用市场时。\n\
  \n然而，如果 Raphael 本人正试图欺骗，情况就会稍微复杂一些。在某些情况下，他可能有动力撤销自己的交易。例如，如果 Raphael 从 Lucas 处买了一块金条，他可能会收到金条后尝试撤销比特币交易。即使\
  \ Raphael 本身不拥有任何算力，他也可以雇佣矿工来执行攻击。如果这种攻击成功，他将同时拥有金条和比特币单位。这种攻击被称为 `double spend`（双花费）。\n\
  \n为了防止 Lucas 在稍后重新广播已由 Raphael 签名的交易消息，Raphael 必须创建一个引用相同交易输出的竞争交易。这在图 5.21 中所示。Raphael\
  \ 可以为新交易指定任何接收者（包括自己）。如果包含新交易的链版本占主导地位，记入 Lucas 的交易消息将引用一个已经在别处使用的输出。因此，该交易将无效的，且不再被考虑在随后的候选区块中。\n\
  \n![图 5.21 正在替代链上工作的矿工想要取消从 Raphael 到 Lucas 的交易。因此他包含了一个竞争交易，以防止第一条信息再次发送。](img/fig5-21.png)\n\
  \n图 5.21  \n\n正在替代链上工作的矿工想要取消从 Raphael 到 Lucas 的交易。因此他包含了一个竞争交易，以防止第一条信息再次发送。\n\n\
  上述攻击通常被称为 `51 percent attacks`。该名称源于攻击者控制了总算力的很大比例。与其名称含义的相反，51% 攻击也可以在算力占比低于 50%\
  \ 的情况下实施。算力的大小只会影响攻击的概率。\n\n### 框 5.5：51% 攻击的机会有限\n\n即使是 `51 percent attack` 也可以在算力占比低于\
  \ 50% 的情况下实施。算力的大小只会影响攻击的概率。 \n\n图 5.22 显示了比特币网络中两个竞争且同时传播的交易的示意分布图。我们假设所有连接的速度相同；也就是说，每个时间单位移动一步。每当节点内存池中有一个交易时，我们假设该交易会转发到它的对等节点。如果节点已经持有一个引用相同未花费交易输出的替代交易，它将忽略第二个。\n\
  \n![图 5.22 交易消息通过多个步骤的传播。](img/fig5-22.png)\n\n在我们 `figure 5.22` 的简单示例中，`double\
  \ spend` 将以相对较高的概率成功，概率为 ![](img/pg170-in-1.png)。这意味着 16 个算力单位中的 13 个将会在候选区块上工作，其中包含了\
  \ Raphael 的第二笔交易。因此，只有当 Tamara 能够生成下一个区块时，Daniel 才能获得他的比特币单位，而这种情况发生的概率比例仅为 ![](img/pg170-in-2.png)。\n\
  \n\n\n\n\n在此这一点上，我们再次强调这样一个事实：这种类型的双重花费只能通过未确认的交易进行，而 Daniel 本来可以通过采取相应的预防措施来防止其发生。此外，这种潜在攻击必须放在相关的背景中来看。每种交易媒介都带有某些风险：伪造现金、信用卡的\
  \ `chargebacks`（退款）可能，或比特币的双重花费尝试。与伪造和退款不同，通过应用技术措施是可以消除比特币双重花费危险的。\n\n## 5.4   练习\n\
