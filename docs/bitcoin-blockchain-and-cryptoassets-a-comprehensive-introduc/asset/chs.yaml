  \ `inv` 消息包含最多 500 个区块识别号。\n\n# 4 交易合法性\n\n在本章中，我们将研究如何将比特币单位分配给个人，以及哪些数学原理能够实现交易合法性的去中心化验证。我们引入了伪名，并扩展了必要的密码学基础。我们还介绍了各种交易类型，以及传输比特币单位必须满足的特定条件。\n\
  \n## 4.1 伪名\n\n由于比特币网络的去中心化结构，无法以传统方式管理比特币余额和访问权限。没有中央机构负责开设账户、记录所有者的个人详情以及授权后续访问。因此，去中心化使得检查所有权主张的合法性变得极其困难。\n\
  \n在比特币系统中，以个人姓名和个人详情的形式使用真实身份既不可行也不符合理想。这不符合理想是因为如果比特币地址是以个人名注册的，就可能将所有交易关联到个人。关于工资支付、购买偏好和个人财富的信息将对所有人可见。这不可行是因为在去中心化系统中，无法像传统金融系统那样提供身份证明。\n\
  \n比特币系统使用伪名而非实际身份来保证交易的合法性。去中心化系统中的基于伪名的解决方案需要满足以下条件：\n\n* 1. 参与者必须能够在没有中央机构协助的情况下创建自己的伪名。\n\
  * 2. 任何两个伪名不能重叠。\n* 3. 对伪名的所有权主张必须是公开可验证的，以便限制对相应余额的访问。\n\n比特币通过使用密码密钥对满足了这些条件。一对密钥由私钥和一个公钥组成。公钥（或其派生的比特币地址）充当伪名，代表相应参与者的身份，但无法轻易关联到特定个人（第\
  \ 1 点）。(1）。在实践中，伪名的数量巨大，以至于两个个人选择相同伪名的概率微乎其微（第 2 点）。私钥必须始终由生成伪名的个人独占，从而证明了相应伪名所有者有权使用它的证明（第\
  \ 3 点）。\n\n\n\n\n为了创建一个密钥对，人必须从一个大到想象的数字集中随机选择一个元素，该范围范围从 1 到 115, 792, 089, 237,\
  \ 316, 195, 423, 570, 985, 008, 687, 907, 852, 837, 564, 279, 074, 904, 382, 605,\
  \ 163, 141, 518, 161, 494, 336；即在 1 和一个七十八位数的数字之间。^(2) 所选的数字作为私钥，随后可用于提供所有权证明。\n\
  \n如图 4.1 所示，公钥是由私钥推导出的。它是通过将椭圆曲线常用的基点 `G` 乘以之前选择的私钥 `k`[prv]（见节 4.3.4）得到的。因此，公钥是椭圆曲线上的一个点\
  \ `K`[pub]，由 `x` 和 `y` 值表示。乘法如下方的公式所示：\n\n![](img/pg84.png)![图 4.1 密钥对与比特币地址之间的关系。](img/fig4-1.png)\n\
  \n图 4.1  \n\n密钥对与比特币地址之间的关系。\n\n基于椭圆曲线的乘法无法逆转，这一点至关重要。^(3) 否则，每个知道伪名的人都可以以私钥的形式推导出相应的访问权限。\n\
  \n由于单向函数的存在，人们可以在公开其公钥作为伪名的同时，保留对私钥的独占性认知。一个人可以选择一个私钥，从中推导出一个伪名，并代表该伪名接收比特币支付。由于该人独占该私钥，因此可以使用它来证明相关伪名及其所有资产的所有权。\n\
  \n最常见的伪名是比特币地址。要从公钥推导出比特币地址，我们需要如图 4.1 所示的额外步骤。比特币地址仅仅是公钥的哈希值（见节 4.2）。目前，我们将公钥和比特币地址视为等同。稍后我们将查看比特币地址的一些优势，并将它们与公钥区分来。\n\
