  \n# 3 交易能力\n\n在本章，我们将观察比特币网络，区分不同类型的网络参与者，并展示如何交换消息以实现共。我们还将考虑比特币通信协议并分析各种类型的消息。\n\
  \n## 3.1 比特币网络\n\n比特币网络是比特币系统的骨干。它连接了各个网络参与者，并允许他们转发交易和区块。因此，它对系统的交易能力至关重要。\n\n\
  ### 3.1.1 去中心化架构\n\n比特币是一个点点网络（图 3.1a）。与中心化网络（图 3.1b）相比，比特币网络中没有任何参与者拥有特权角色。参与者通常有很多连接，任何两个参与者之间都可以建立新连接。每个参与者都可以持有比特币区块链的本地副本，验证交易的合法性并将其发送给其他参与者。这允许在没有中心节点的情况下进行通信和数据存储。\n\
  \n![图 3.1 不同类型的网络。](img/fig3-1.png)\n\n图 3.1（注：这是原始来源中的说明/引用文本）\n  \n不同类型的网络。\n\n\
  去中心化架构使得点点网络对攻击和故障具有特别的抵抗。在中心化网络中，中心节点的故障可能导致致命后果，有时会导致数据丢失或通信完全崩溃，但在点点网络中，每个参与者都可以被替换。故障通常由其他网络参与者处理，本地丢失的数据会被恢复，并在替代连接路径上维持通信。在这方面，去中心化系统不依赖于单个节点。它们的结构防止单个参与者占据系统相关的职位，从而使其变得稳健。\n\
  \n从监管的角度来看，去中心化也为网络提供了某种免疫。由于缺乏中心接触点，监管整个网络非常困难。每当一个节点关闭时，都可以创建一个新的。\n\n此外，监管在去中心化系统中紧迫性并不相同。中心化网络基于参与者对中心权威的信任。这种信任会被操纵中心数据而被滥用。为了自身利益或客户利益而进行的操纵也是可以想象的。在当今系统中，假设声誉效应、控制机制和罚款的结合提供了适当的激励，并鼓励中心权威进行长期合作。在这方面，中心化系统的监管是不可或缺的。\n\
  \n\n\n\n\n在本书的第一部分中，我们使用`network participant`网络参与者作为一个通用术语，没有区分这些参与者可能承担的各种功能。具体而言，有三种基本功能：`verification\
  \ function`、`wallet function`和`mining function`。从现在起，我们将使用`network node`网络节点来指代执行了这三种功能中至少一种的参与者。\n\
  \n### 验证功能\n验证功能涵盖了了网络参与者能够自主参与网络并独立验证所有交易的所有必要活动。特别是参与者需要验证交易消息、在本地存储这些消息并将其转发给其他网络参与者。验证功能要求参与者维护一份比特币区块链副本，并验证链上所有区块的有效性。验证功能还促进了区块的交换。具有验证功能的网络节点被称为`full\
  \ nodes`（全节点）。\n\n### 钱包功能\n钱包为私钥提供安全存储，并监控和管理节点的个人比特币余额。钱包是为终端用户开发的，通常提供图形用户界面，以便方便地接收和发送比特币单位。此外，许多钱包提供了可选的安全机制，以增强对私钥的保护。\n\
  \n### 挖矿功能\n具有挖矿功能的节点积极参与生成新区块，并为比特币区块链的扩展做出贡献。\n\n当用户在计算机上安装比特币客户端并开始与其他网络参与者交换信息时，就会创建一个新的网络节点。大多数客户端都是开源的，用户可以从一系列软件包中自由选择。理论上来说，用户也可以开发自己的客户端并使其与网络通信。只要软件包符合比特币的通信协议，就可以用于创建新节点并交换信息。\n\
  \n流行的客户端被称为`Bitcoin Core`。`Bitcoin Core`包含了所有的功能。该软件创建一个全节点，并通过图形用户界面或命令行进行控制。\n\
  \n`Bitcoin Core`维护比特币区块链的本地副本。客户端验证并中继交易和区块。此外，`Bitcoin Core`包含一个钱包和一个简单的挖矿应用程序。因此，它提供了所有三种功能。`Bitcoin\
  \ Core`是一个免费下载的软件。\n\n### 3.1.3 连接建立与拓扑\n\n成功安装客户端后，软件将连接到其他节点。连接通过通用网络协议（`TCP/IP`）建立，默认通过端口`8333`建立。想要建立连接的节点向另一个节点的已知互联网协议（IP`）地址发送初始消息（`version\
  \ message`）。该消息包含关于节点本身以及比特币账本本地副本的信息，从而实现连接的建立。可选，可以查询新对等的地址列表（`getaddr message`），以便节点可以通过额外的连接来扩展其已知网络。\n\
  \n新节点面临的初始问题是没有任何已知地址。为了让软件在首次启动时能够建立连接，初始下载中提供了一个 IP 列表。或者，也可以手动输入 IP 地址。\n\n通常，每个节点都会尝试维护至少八个连接。实际数量可能与此值有显著差异。关于标准设置，节点平均维护三十二个活跃连接。可能的防火墙和路由器设置可能会限制连接数量。通常情况下，更广泛的网络连接性将有利于数据交换。\n\
  \n如果中断导致某个节点的活跃连接少于八个，它将立即尝试建立新连接。为此，可以使用已知的 IP 地址，或从其他节点请求新的 IP 地址。\n\n为了说明连接过程，我们将使用图\
  \ 2.3 所示的示例，并假设网络增加了一个节点。假设 Tamara 下载并安装了比特币客户端。安装成功后，客户端查询提供的 IP 列表并与另一个节点建立连接。为了做到这一点，客户端发送一个\
  \ `version message`，另一个节点用 `verack`（`version acknowledged`）消息进行响应。图 3.2 所示的过程由客户端自动执行；用户不需要任何手动操作。\n\
  \n![Figure 3.2 Connection setup in the Bitcoin network.](img/fig3-2.png)\n\n[图 3.2]\n\
  \n比特币网络中的连接建立。\n\nEdith 可以通过响应 `version message` 并等待 `verack` 确认来接受连接。然后 Tamara\
  \ 可以请求 Edith 的 IP 地址列表。这是通过 `getaddr message` 实现的。Edith 将从她大量的已知 IP 地址池中随机选择 IP\
  \ 地址，通过多个 `addr messages` 发给 Tamara。这种随机选择过程被称为`bootstrapping`（引导）。\n\n很多情况下，Edith\
  \ 发送了她的池中存在但她目前尚未连接的 IP 地址。这导致了更健壮的网络拓扑。\n\n在我们图 3.3 的示例中，Tamara 接收了 Michèle 和 Jake\
  \ 的 IP 地址。她可以使用新的 IP 地址发送进一步的 `version messages`，从而建立新的连接。在我们的示例中，她利用了这个机会，形成了图\
  \ 3.4 所示的网络。\n\n![Figure 3.3 Request for new IP adresses.](img/fig3-3.png)\n\n[图\
  \ 3.3]\n\n请求新的 IP 地址。\n\n![Figure 3.4 Network with a new participant.](img/fig3-4.png)\n\
  \n[图 3.4]\n\n带有新参与者的网络。\n\n诚然，我们的示例是一个简化。大多数连接都保持了简单，以说明消息是如何交换的。此外，我们的示例包含极少数的节点，每个节点都只有少数连接。\n\
  \n在真实的比特币网络中，`bootstrapping` 创建了准随机的路径。这些路径导致了复杂且随机的网络拓扑。局部位置性与连接的选择无关。从这个意义来说，随机产生网络分区几乎是不可能的。此外，如果产生了分区，可以通过网络计算资源的突然下降（更准确地说是生成新区块的速度）以及交易消息数量减少来检测。\n\
  \n分区只有在某个（地理）区域的完全隔离持续一段时间时才会成为问题。这是一个可以控制的风险，因为任何两个子网络之间的通信就可以解决分区。因此，由于地缘政治考量和防止（自然）灾害，节点的地理特征可能具有意义。\n\
  \n2014 年一项关于节点地理分布的研究显示，大约 40% 的节点位于中国或美国。其他节点均匀地分布在富裕和人口稠密的地区。比特币网络的全节点越多，它就越健壮。2015\
  \ 年底，比特币网络由约 5500 个全节点组成，而 2013 年约为 15000 个。2019 年底，有 9500 个全节点。\n\n\n\n\n\n全节点对于比特币系统的运行至关重要，因此其数量的减少将会产生问题。全节点数量的下降主要归因于两个原因：首先，运行全节点的成本很高，而且运行全节点并不会获得任何补偿（参见框\
  \ 3.1）。直接成本涉及互联网连接、电费和数据存储。其次，比特币可以在不运行全节点的情况下使用。无论是持有比特币单位还是发起交易，都不要求用户维护全节点。\n\
  \n框 3.1\n\n### Bitnodes 及其他激励计划\n\n在比特币社区中，人们反复声称，运行全节点的激励在其他方面来自于参与者之间的互惠考虑。事实上，全节点运行者往往出于理想主义和/或对技术的纯粹兴趣而这么做。然而，对于一个其他基于经济激励的系统来说，这种动力基础是不够的。为了确保比特币的长期生存和可扩展性，必须停止全节点数量的下降，甚至扭转这一趋势。\n\
  \n私人利益相关者已经启动了一项旨在激励全节点的计划。该项目对满足某些条件（可用性和可靠性）的全节点运行者进行报酬。支付由计划运营者的私人财富和捐赠资助。该项目期限有限，已于\
  \ 2015 年底结束，但遗憾的是未能实现预期目标^(\\[234\\])\n\n一种更可持续的方法是为交易转发^(\\[16\\]）或为`简化支付验证`SPV）客户端提供信息等服务建立系统性奖励（参见\
  \ 3.2.2 节）。微交易可以促进此类奖励^(\\[143\\])。\n\n在某种程度上，维护全节点是一种公共利益，其提供为运行者带来了个人成本。它之所以是公共利益，是因为提供的服务具有竞争性和非排他性。因此，从经济角度来看，全节点的减少并不意外。框\
  \ 3.1 讨论了可能使全节点运行更具吸引力的方法。\n\n## 3.2 扩展网络\n\n全节点的数量完全不能反映比特币用户的数量。比特币区块链规模的增大和交易数量的增加，导致对全节点硬件和网络规格的要求列表不断变长。这就是为什么许多用户决定不自己运行全节点，而是依赖于其他运行全节点的参与者。\n\
  \n外包验证意味着，例如，不需要下载并不断更新比特币区块链。资源节省对于移动设备客户端可能特别有意义，因为这些设备的内存通常稀缺且带宽有限。有限的网络参与为那些原本无法参与比特币网络的用户提供了简单集成的可能性。\n\
  \n然而，放弃验证功能会产生依赖关系。比特币系统为每个网络参与者都提供了独立验证比特币区块链中包含的所有交易的合法性的可能。如果网络参与者放弃了这一选项，他将自动失去部分独立性，并且必须对其信息源产生某种程度的信任。\n\
  \n这些依赖关系的精确结构和信任程度差异很大。间接网络参与可以以`中心化子网络`或`简化支付验证`（SPV）的形式的形式存在。\n\n### 3.2.1 中心化子网络\n\
  \n中心化子网络显示出最高形式的依赖性。参与者与比特币网络仅是间接连接，并完全依赖特定节点的信息和通信通道。图 3.5 显示了两个中心化子网络。\n\n![图\
  \ 3.5 中心化子网络。](img/fig3-5.png)\n\n图 3.5\n\n中心化子网络。\n\n连接到中心化子网络的客户端可以在不需要直接访问比特币网络的情况下执行钱包功能。中心节点被用作代理服务器，可以定期查询以检查用户地址的比特币余额。此外，交易消息被传输到中心节点，从而间接继接到比特币网络。\n\
  \n连接到中心化子网络对用户来说可能方便得多，因为他只需要安装一个轻量客户端或通过网络应用程序管理他的比特币余额。产生的依赖关系在正常操作下几乎察觉不到。然而，中心节点可能会向参与者隐留某些信息，或者不将他们的交易转发到网络的其他部分，从而阻止它们。这可能是刻意为之，也可能是技术问题的结果。在这方面，中心化子网络丢失了点对网络的大部分健壮性属性，并为系统引入了新的漏洞。\n\
  \n在许多情况下，中心化子网络还伴随着托管服务。在这种关系中，所有者将比特币单位的完全控制权转移给了中心节点。他并不持有相应的私钥，而只是服务商平台上的用户账户，可以通过该账户请求交付比特币单位。实际的交易由中心节点发起。在这种关系中，用户只得到一张交付比特币单位的欠条。这类似于信用货币，其价值取决于发行人的信用状况（参见\
  \ 1.4.2 节）。\n\n框 3.2\n\n连接到使用全节点的客户端\n\n在中心化子网络中，限制节点必须信任中心节点。如果限制节点的用户额外运行一个全节点，就可以避免这个问题。\n\
  \n运行限制节点的移动设备（例如）可以访问在用户台式计算机上运行的全节点，从而同时从较低的负载和完全的可验证性优势中获益。一些移动钱包已经提供了这种选项。\n\n\
  ### 3.2.2 简化支付验证节点\n\nSPV 客户端允许在不需要存储比特币区块链完整副本的情况下使用钱包功能。与依赖中心节点的间接网络参与者不同，SPV\
  \ 节点拥有直接访问比特币网络的权限。所需数据由多个节点提供并可以进行部分验证。数据源的多样化和部分验证接收数据的可能性使 SPV 节点比连接中心化子网络具有更高的安全性和独立性。\n\
  \nSPV 节点仅持有区块的一部分——即所谓的区块头。区块头等包含一个取决于所包含交易但不取决于交易本身的标识码^(5)。因此，SPV 客户端所需的存储容量仅为全节点的千分之一。SPV\
  \ 客户端每个区块只需 80 字节。更重要的是，无论包含多少交易，这个数量都保持不变，即使在用户和交易大幅增加的情况下，也能呈线性增长路径。\n\n\n\n\n\
  全节点使用区块高度来验证交易。为了确保交易中引用的比特币单位（未花费交易输出）尚未被使用过，全节点会检查完整的比特币区块链。^(6) SPV 节点则使用基于区块深度的启发式方法——即确保交易安全的确认区块数量。如果一个区块被特定数量的后续区块（通常为六个）引用，SPV\
  \ 节点就会认为其中包含的是有效的。由于创建这些后续区块需要大量的计算资源，且信息的来源多样，操纵尝试的概率非常低。\n\nSPV 通过选择性查询单个交易来获取信息。这导致了两个问题。\n\
  \n首先，SPV 节点可以验证收到的交易是否确实属于某个区块；然而，它们不知道自己是否被拒绝了信息，或者是否存在另一个可能的竞争性交易。其次，信息收集会导致隐私问题。如果\
  \ SPV 节点仅请求与其自己的公钥（或比特币地址）相关的交易，其他节点将能够将这些伪名与其 IP 地址关联起来，并创建一个独特的用户画像。作为应对措施，SPV\
  \ 节点可以请求大量的额外数据。然而，海量数据将破坏实现 SPV 客户端的初。\n\n为了应对第二个问题，交易通常通过所谓的 `bloom filters` 进行查询。布隆过滤器使用哈希函数指定搜索请求（参见节\
  \ 4.2）。SPV 节点在应用各种哈希函数后，发送符合特定搜索模式的交易请求。精度可以根据需求变化。隐私与数据量之间仍然存在权衡。由于系统的概率性质，可能会出现\
  \ `False positive`（假阳）结果，甚至是必要的。`False negative`（假阴）结果是不可能的。如果交易被过滤器拒绝，它对 SPV 客户端而言无关。\n\
  \n布隆过滤器的目的是掩盖 SPV 节点的搜索查询。由于哈希函数的特性，识别查询背后的模式困难得多。这一想法源于 Bloom 的一篇学术论文^(\\[40\\\
  ])，并由 `BIP0037`^(\\[111\\]) 在比特币系统中正式化。\n\n### 3.2.3   矿池挖矿\n\n比特币挖掘通常由大型群体共同进行，称为\
  \ `mining pools`。经典的 `solo mining` 需要全节点的运行。然而，`Pool mining` 则不需要。通常只有矿池运营商持有比特币区块链的副本，并像中心化子网络一样将所需信息分给矿池成员。因此，矿池挖矿是全节点数量减少的主要原因，并加剧了人们对中心化侵入比特币系统的担忧。\n\
  \n## 3.3   比特币通信协议\n\n比特币网络的目的是允许信息交换。为了让各种客户端处理这些信息，通信必须以标准形式进行。没有客户端可以被强制遵守这些标准。通信协议仅描述信息的格式。因此，如果一个节点想与其他节点通信，遵循这种格式符合其最大利益。\n\
  \n对于比特币网络而言，区块和交易的交换是最相关的。不直接服务于交换的消息起次要作用。\n\n### 3.3.1   区块交换\n\n当客户端软件首次启动时，它花费几个小时下载、验证并索引所有区块。第一个区块（创世区块）被集成到客户端中。所有后续区块都必须从其他节点获取。当时区块链中包含的数据量约为\
  \ 205 GB 字节（GB）。\n\n每个区块只需要下载和验证一次。只有当客户端长时间未连接网络时，才会出现长时间的情况。两条链之间的比较通过相互交换的消息进行。这些消息包含最新区块的标识符。如果两条链是对等的，则不需要交换区块。然而，如果一个节点收到的与本地链最后一个区块不符的\
  \ `getblocks` 消息，它将尝试定位该标识符对应的区块，并发送带有后续区块标识符的 `inv`（库存）消息.^(7)\n\n接收到 `inv` 消息的节点随后有机会使用\
  \ `getdata` 消息请求相应的区块。图 3.6 显示了两个节点传输区块时的消息历史。\n\n```\n[图 3.6 区块交换]\n```\n\n图 3.6\n\
  \n区块交换。这一原理用于防止节点接收其已有的区块数据。每个节点都可以独立决定从哪些节点请求什么数据。\n\n当节点接收到一个区块时，它会独立检查其中包含的交易的有效性，并验证交易仅引用了之前未花费的交易输出（UTXO），并由所有者发起（参见节\
  \ 4.4.1）。节点还会检查对旧区块的引用，并检查当前区块的标识符以确定其是否符合阈值标准。因此，每个节点都可以清楚地判断区块是否满足各种共识条件。只有当所有检查通过时，节点才会将区块包含在其版本的区块链中。\n\
  \n### 3.3.2   交易交换\n\n交易消息是节点可以验证、转发和处理的支付订单。我们将在节 4.4.1 中查看交易消息的结构和验证。在本节中，我们关注交易消息如何转发。\n\
  \n交换交易消息的方法与区块相似。`inv` 消息也可以包含交易标识符。如果节点收到一个包含未知交易标识符的 `inv` 消息，节点可以同样使用 `getdata`\
  \ 消息请求该交易。交易数据的实际传输随后通过 `tx` 消息进行。图 3.7 显示了两个节点传输交易时的消息历史。\n\n```\n[图 3.7 交易交换]\n\
  ```\n\n图 3.7\n\n交易交换。\n\n\n\n\n如果节点接收到请求的 `tx` 消息，它会首先对其检查，并仅在验证通过时进行转发。验证是使用预定义的解锁条件和签名进行的，我们将在第\
  \ 4.5 节中详细讨论。如果验证失败，交易将被丢弃。这保护网络免受某些类型的 DoS 攻击，此类攻击通过向服务泛入大量无效交易来导致数据传输阻塞。然而，如果验证成功，交易消息将存储在节点的本地内存中，即所谓的\
  \ `mempool`，并作为 `inv` 消息的一部分提供给其他节点。\n\n这导致交易消息的分发指数级增长。本地存储该消息的节点越多，消息的分发就越快.^(\\\
  [76\\])\n\n#### Box 3.3\n\n与传播相关的激励兼容性\n\n在某些情况下，节点可能会动力不转发交易消息。如果交易费用占奖励的很大一部分，矿工可以通过保留信息来增加自己的预期收益.^(\\\
  [16\\])这个问题可以通过交易发起者轻松解决，只需将其转发到几个独立的矿矿节点即可。\n\n关于区块的通信，可能会发生类似的问题。有时对于矿工（`矿池`）来说，保留具有有效识别号的区块并专门处理区块链的最长版本是有益的。尽管矿工因此面临其他矿工竞争其当前奖励的风险，但他也可以借此防止竞争对手在最长链上工作，从而确保他们浪费一定比例的计算资源。由于挖矿的预期收益与所有矿工的总计算资源成正比，保留有效区块可以增加矿工的预期收益。这种现象被称为`自私挖矿`\
  \ (`selfish mining`）。^(\\[49,69,91\\]) 保留区块比保留交易构成了大得的问题。\n\n有各种方法可以缓解这个问题，确保只有当矿工拥有整个网络约三分之一的计算资源时，保留新区块才是有利的.^(\\\
  [91,112\\])\n\n## 3.4 练习\n\n**练习 3.1：** 讨论比特币网络的去中心化架构在多大程度上对其稳健性做出了贡献。\n\n**练习\
  \ 3.2：** 解释新节点如何连接到网络，连接设置的哪些特征确保了准随机网络拓扑的出现。\n\n**练习 3.3：** 描述网络节点需要哪些功能才能获得全节点状态。此外，说明全节点对比特币网络状态有多重要。\n\
