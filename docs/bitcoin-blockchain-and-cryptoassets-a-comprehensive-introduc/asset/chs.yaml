- "# 比特币、区块链与加密资产：入门指南\n\n\n\n\n\n\n\n\n姓名：Schär, Fabian，作者。 | Berentsen, Aleksander，作者。\n\
  \n\n\n\n\n\n\nd_r0\n\n# 前言\n\n二十世纪货币经济学领域最重要的贡献是论文《比特币：一种点对点的电子现金系统》。该论文于 2008 年通过密码学邮件列表发布，作者笔名为\
  \ `Satoshi Nakamoto`（中本聪）。该论文的核心思想是创建“一种纯粹的点对点的电子现金版本，它允许在线支付直接从一方发送到另一方，而无需通过金融机构”。\n\
  \n比特币开发者将几项技术组件结合在一起，创造了一种与任何其他资产本质上不同的虚拟资产。历史上，虚拟财产的所有权可以在不需要中央权威机构的情况下实现——这一发展潜力可能从根本上改变当前的金融体系以及商业和政府的许多其他领域。\n\
  \n与任何基础性创新一样，这项新技术的真正潜力只有在广泛采用多年（可能是几十年）之后才会显现。目前，最明显的应用是将比特币作为虚拟资产。加密资产可能会作为其自身的资产类别出现，并发展成为有趣的投资和多元化工具。比特币本身随着时间的推移，可能会承担类似于黄金的角色。\n\
  \n本书旨在向读者介绍加密货币和区块链技术。重点是比特币，但其他区块链实现方案和替代加密资产也共享许多元素。与任何基础性创新一样，将这一概念用简单的语言表达出来是如此困难，真是令人惊叹。“什么是比特币？”这个问题开启了一整系列可能的解释。如果将比特币简化为货币资产（如数字现金），就会产生错误的预期，比特币可能看起来索然无味甚至无关。为了捕捉比特币和区块链技术的复杂性和潜力，读者必须愿意接受经济学、密码学和计算机科学领域的知识（图\
  \ 0.1）。\n\n![图 0.1 比特币的跨学科性](img/fig0-1.png)\n\n图 0.1  \n\n## 比特币的跨学科性\n\n比特币属于任何个人或公司，也不受任何单一实体的控制。相反，比特币是一个具有许多利益相关者的自主构建，这些相关者通过复杂的交互和激励机制来塑造系统。这种独立性使得技术在历史上首次能够在没有中央权威的情况下建立虚拟财产。这一成就是一项技术突破。\n\
  \n在比特币区块链发明之前，对虚拟资产所有权的共识只能通过中心化来实现。在中心化系统中，一个机构被专门授予记录保存的权利，因此负责维护和建立产权。我们目前的基础设施依赖于集中管理的会计系统，中心化会产生许多问题。在每笔交易中，数据被收集并集中存储。这导致了隐私的缺乏并创造了单点攻击。此外，集中的记录可以被轻易操纵（无论是内部还是外部），而且这些问题变得系统性至关重要。最后，在中心化系统中个人可能被排除在外，其资产可能被轻易没收。比特币系统的去中心化本质使其对这些问题产生了免疫。\n\
  \n比特币开发者提供了一个基础框架，许多新应用程序奠定了基础。类似于互联网繁荣的 `TCP/IP` 协议，比特币技术可以用于代表广泛意义上的虚拟财产。房地产、银行货币和公司股份的虚拟主张与邮票、域名或知识产权的主张同样是可以想象的。任何现实资产都可以代币化，并在全球范围内\
  \ 24/7 进行交易，而无需中介。其他应用包括智能合约和自治组织。最后，由于回溯修改记录非常困难，比特币区块链可以用于证明特定数据文件在特定时间以特定形式存在。\n\
  \n## 书籍结构\n\n本书由三部分八章组成。书的第一部分是非技术介绍，不需要先验知识。比特币的发展目标是创建一个新的货币单位。因此，在第 1 章中，我们关注货币理论，以更好地理解比特币系统背后的原始动机。我们讨论了货币对经济的作用，并分析了货币单位价值的组成部分。我们随后区分了不同类型的货币，并研究了它们的特征和控制结构。这一章将有助于理解比特币等加密货币是如何背离现有货币工具的。在第\
  \ 2 章中，我们开始分析比特币系统，并通过非技术性的构建块来引入区块链技术。这一章作为比特币技术的概述，旨在突出比特币系统的创新特性。\n\n第二部分包含了书中挑战性最大的章节，主要涉及比特币系统的技术方面。第\
  \ 3 章介绍了比特币网络，并区分了各种网络参与者。我们考虑了比特币通信协议，分析了各种消息，并解释了网络参与者如何交互。第 4 章解释了如何将比特币单位分配给个人，以及哪些数学原理实现了交易合法性的去中心化验证。为了实现这一目的，我们引入了伪名并扩展了必要的加密基础。我们还介绍了各种交易类型，以及传输比特币单位必须满足的条件。最后，我们查看了签名哈希类型以及最近的协议更改，如\
  \ `Segregated Witness`。第 5 章解释了交易如何进入比特币区块链，并展示了网络如何对账本的状态达成共识。我们研究了区块的数据结构；讨论了这些区块是如何链接的；并分析了比特币挖矿的基础、底层的博弈论以及工作量证明共识机制。\n\
  \n\n\n\n\n本书的第三部分致力于特定问题和应用。比特币技术令人着迷，并具有从根本上改变当前金融体系及许多其他部门的潜力。尽管如此，人们必须承认，这项技术仍然面临许多障碍。在第\
  \ 6 章中，我们将仔细研究其中的一些挑战并讨论潜在的解决方案。这些挑战包括高价格波动、可扩展性、能源消耗以及监管不确定性。此外，我们还讨论了中心银行加密货币和稳定币等热点话题。比特币区块链提供了一个能够实现许多非货币应用的基础设施。第\
  \ 7 章讨论了替代应用，旨在提供纯货币领域之外的展望。所讨论的应用包括去中心化验证与证明、代币、智能属性以及区块链合约（智能合约）。最后，第 8 章提供了关于如何开始使用比特币的实用建议。它考虑了获取和保护比特币单位的几种可能性，并指出了用户应该避免的一些风险和错误。它还讨论了如何进行和接收比特币支付。\n\
  \n我们的书面向那些想要熟悉该主题的学生和从业人员。其跨学科的方法和技术上的完整性确保了它对于初学者和高级读者来说都同样有趣且值得一读。\n\n我们借此机会感谢巴塞尔大学经济研究中心协会和圣路易斯联邦储备银行对本项目的支持。感谢感谢感谢以及所有在本书开发过程中支持和陪伴我们的人：Florian\
  \ Bitterli, George E. Fortier, Pascal Gantenbein, Stefan Gehrig, Brigitte Guggisberg,\
  \ Raphael Mani, Marina Markheim, Matthias Mohler, Remo Nyffenegger, Edith Schär,\
  \ Michèle Schär, Joachim Setlik, 以及 Christopher Waller。\n\n# I. 引言\n\n## 1 货币理论的背景\n\
  \n比特币的发展目标是创建一个新的货币单位。正如我们将在书中展示的，比特币技术的可能应用远超货币单位的范畴。然而，为了理解比特币技术的特殊之处，必须充分熟悉比特币的根源，即货币这一主题。\n\
  \n在现代货币理论中，货币被描述为`memory`。这个定义的起源源于一种观察：人们每天互相提供帮助，而不一定得到回报。例如，这类“礼物”会在家庭内部、朋友之间或职场同事之间交换。在家里承担家务、在办公室接受一项不愿意的任务、或向朋友发出下一次晚餐邀请，都是这种行为的少数例子。每天，我们都会进入几十段这样的`gift-giving`关系。\n\
  \n这些这些关系的特征是，所有参与者都记录着他们当前的债务。这些账目不是记录在纸上的，而是记录在参与者记忆的潜意识账本。尽管如此，每个参与者对于礼物和帮助的交换是否大致平衡都有一个大致的想法。\n\
  \n在家庭关系中，如果任务总是由一个人执行，而另一个人从这些工作中获益而不执行其他任务，这将会导致破坏性的争论，使关系变得不稳定。在办公室里，如果总是让同一个人来承担团队令人厌恶的任务，也会导致争论。如果友谊中的晚餐邀请非常片面，邀请者将被视为自私，友谊将受到威胁。\n\
  \n为了让`gift-giving`系统发挥作用，必须有一种达成共识的机制。共识通常在参与者交流并解决分歧时达成。在实践中，我们看到当参与者彼此熟悉且群体较小时，礼物和帮助的交换运行得非常顺畅。在大群体或参与者匿名的小组中，该系统倾向于崩溃，因为很难达成共识。在这些群体中，`gift-giving`被货币交换所取代。在交易关系复杂的社会中，货币取代了记忆的角色。货币记录了全球范围内的帮助往来。货币就是`memory`。\n\
  \n支付系统调节其货币如何表示、如何产生，以及货币单位所有权的转移如何发生。为了更好地理解比特币系统的运作方式，快速查看传统的支付系统是值得的。\n\n让我们从现金开始；即硬币和纸币。硬币和纸币是物理对象。这具有巨大的优势，因为所有权总是清晰定义的。纸币或硬币的所有权作为支付从商品买方转移给商品卖方。这使得互不相识的人能够匿名进行交易。此外，任何代理都可以参与现金支付系统；没有人会被排除在外。对它它是无许可访问的。\n\
  \n现金有一个巨大的缺点，因为它要求买卖双方在物理上接近。随着互联网的兴起，这种限制变得尤为明显。此外，由于安全和成本考虑，持有大量现金并没有吸引力。由于这些原因，用数字货币取代物理现金的想法很快出现。在一种天真的实现中，买家将以文本文件的形式向卖家发送数字币。问题是，这个数字币可以被复制多次。因此，买家可以将同一个数字币发送给多个卖家，甚至保留该币的额外副本。\n\
  \n这种“复制”困境在文献中被称为`double spending problem`（双重花费问题）。这个问题有两种解决方案。\n\n第一个解决方案是任命一个机构来监控所有的电子支付。这特别涉及验证买方是用于支付商品的数字币的合法所有者。在全球范围内，主流的电子支付系统依赖于第一个解决方案。这些支付系统的用户使用电子货币支付，也被称为`deposit\
  \ money`、`bank money`或`book money`。电子货币是虚拟货币，因为不存在物理形式。它由商业银行创建，银行负责准确的记账。因此，它依赖于中央权威。\n\
  \n比特币系统提供了第二种解决方案，因为它在没有中央权威的情况下解决了`double spends`问题（见第 2 章）。为了确保该系统的运行，有一种建立共识的机制，这种机制与家庭成员、朋友和同事之间的帮助交换非常相似。与管理`gift-giving`的简单主观共识规则不同，比特币系统保证了客观的、全球可验证的共识，使得在任何时间每个比特币单位相关的物权都是稳固的。因此，比特币系统在复杂社会中履行了`memory`的功能，但不需要中央权威来管理。\n\
  \n\n\n\n\n为了充分理解比特币等加密货币的价值，我们必须首先理解货币理论。本章的其余部分将提供对货币理论基础的理解。我们将讨论货币对经济的作用，并分析货币单位价值的组成部分。然后，我们将区分不同类型的货币，并研究它们的基本特征和控制结构。这些信息将为理解比特币等加密货币如何对现有货币工具产生彻底突破奠定基础，我们将在第二章中进行详细讨论。\n\
  \n## 1.1 货币单位的起源\n\n卡尔·门格（Carl Menger）的经济理论认为，货币可以在没有政府干预的情况下演变。他提出，货币单位会自发地产生于一个过程中：一种频繁增量交易的商品变成一种普遍接受的交换媒介。这种社会协调不需要任何正式的决策或立法决定，而是可以由已经存在的需求所引导。此外，还存在强大的网络效应。使用特定交换媒介的市场参与者越多，该媒介提供的效用就越大；也就是说，交换媒介的主导地位具有自我增强效应。\n\
  \n可以假设早期的货币单位是以这种方式起源。在不同的地区和时代，各种商品和抽象概念曾被用作货币。这些早期示例中的许多具有相同的共同点：它们作为基本食物或（仪式性的）珠宝物品，产生了恒久的需求。尽管这不是一个完整的列表，但一些例子包括石头、牲畜、鲸鱼齿、贝壳和羽毛。\n\
  \n## 1.2 货币单位的功能\n\n货币单位履行三种功能（类似于图 1.1）。作为`交换媒介`，它们促进了贸易并改善了商品和服务的配置。作为`计价单位`，它们作为通用参考，简化了商品和服务的比较估值。作为`财富储存手段`，货币单位可以用于储蓄。这些功能将在后续章节中进行详细描述。\n\
  \n![图 1.1 货币单位的功能。](img/fig1-1.png)\n\n[图 1.1]\n\n货币单位的功能。\n\n### 1.2.1 交换媒介\n\n\
  在劳动分工为典型的现代经济中，交换媒介是不可缺的；也就是说，当经济主体专业化并只生产一小部分商品时。只有当所有其他商品都能通过贸易获得时，这种专业化才是可能的，因此分工经济必然是交换经济。\n\
  \n在不使用货币的经济中，商品和服务只能通过物物交换来购买。一个拥有一块面包但更想消费一罐牛奶的人，必须先找到一个拥有一罐牛奶且更想消费一块面包的人。只有这样，双方才愿意并能够进行交易。因此，一个简单的约定是不够的。只有当一方有另一方想要的东西，反之亦然，才能完成物物交换。这个问题在文献中被称为`需求的双重巧合`(double\
  \ coincidence of wants），它使得寻找合适的交易伙伴变得困难。\n\n另一个阻碍因素是可交易商品对数量的不断增加。给定任意数量 `n` 的不同商品和服务，将会有\
  \ ![](img/pg6-in-1.png) 不同的可交易商品对。在不同商品和服务数量适中的经济中，直接物物交换可能会有若干缺点。一旦经济系统变得更加复杂，它将由数百万的主体、商品和服务组成。寻找合适的交易伙伴（或某对特定的可交易商品对）将会产生巨大的成本。\n\
  \n然而，如果一种商品被经济中的所有成员所接受，那么所有交易都可以使用这种商品作为交换媒介来结算。简单的需求巧合就足以完成交易，因此相关的可交易商品对数量立即减少了\
  \ `n` 倍，使得只剩下 `n` − 1 个潜在的商品对。\n\n[图 1.2] 显示了在使用和不使用货币的情况下经济中可能的交易商品对的数量。它说明了当商品数量增加时，潜在交易商品对的数量是如何激增的。\n\
  \n![图 1.2 使用和不使用货币单位的商品对数量。](img/fig1-2.png)\n\n[图 1.2]\n\n使用和不使用货币单位的商品对数量。\n\n\
  ### 1.2.2 计价单位\n\n计价单位允许所有商品和服务的价值以相同的参考标准表示并进行比较。因此，全面概述市场所需的信息量大大减少。不需要动态调整 ![](img/pg7-in-1.png)\
  \ 可交易商品对的比例，计价单位为评估不同类型的商品提供了通用参考。一旦所有商品和服务的价格以货币单位表示，那么每种商品只需要一个单一的货币价值（即 `n` −\
  \ 1）。这种简化确保了市场更高的透明度，并降低了搜索和交易成本。\n\n大多数情况下，货币单位结合了交换媒介和计价单位的功能。然而，这两个功能可以很容易分离（见框\
  \ 1.1）。\n\n[框 1.1]\n\n外包计价单位\n\n在大多数经济中，交换媒介承担了计价单位的功能。情况并非总是如此，如下例所示。\n\n在中世纪，硬币的多样性及其贵金属含量的不断变化导致英镑、士林和便士被用作计价单位，其中\
  \ 1 英镑对应 20 士林或 240 便士。这使得使用通用价格成为可能，并在不调整商品标价的情况下，考虑到特定硬币价值的变化。\n\n今天仍有计价单位功能从交换媒介分离的例子。智利的\
  \ `Unidad de Fomento` (CLF) 是一种通胀调整的国家价格指数，相对于本货币（比索）确定并每天发布。智利的购物价格以 CLF 表示。这避免了在比索贬值时调整价格行政费用。要计算比索的价格，代理人只需应用单一汇率。\n\
  \n*a*. 硬币被削减或剪掉，金属被溶解在酸浴中。有时硬币会被官方“召回”并以较低的贵金属含量重新铸造。\n\n### 1.2.3 财富储存手段\n\n\n\n\
  \n\n货币的价值储藏功能使代理人能够针对流动性冲击进行自我保险。这使得消费平滑成为可能，并能防止意外开支。交换媒介始终是一种价值储藏手段，因为在收到货币到花费货币之间存在时间间隔。相比之下，许多被用于存储储蓄的资产（如黄金或房地产）并并不被用作交换媒介。\n\
  \n## 1.3 货币的基本属性\n\n为了实现第 1.2 节中提出的货币的三种功能，货币单位必须是可存储、可传输、可拆分、同质、可验证、稀缺且价格价格的。\n\
  \n**可存储性。** 货币单位作为`medium of exchange`和`store of value`的使用取决于其可存储性。易腐或敏感的商品并不适用。难以存储并产生高昂存储成本的商品也是如此。\n\
  \n**可传输性。** 物品若要用作`medium of exchange`或`store of value`，必须能够在没有实质障碍或成本的情况下转移其所有权。\n\
  \n**可分性。** `medium of exchange`功能要求货币单位（或其部分金额）可以交换任何选定数量的商品或服务。因此，货币要么是可拆分的，要么以足够小的面额存在。不可拆分的货币会给经济带来巨大的低效性.^(\\\
  [29,192\\])\n\n**同质性。** 货币单位（具有相同名义价值）必须是同质的；即互质且可交换的。非同质商品在每次交易时都必须单独评估，这导致了高交易成本，并无法作为`medium\
  \ of exchange`。\n\n**可验证性。** `medium of exchange`功能和`store of value`功能都要求能够验证单位的真实性并识别潜在的伪品。\n\
  \n**稀缺性。** 货币单位的可用性有限是其作为`medium of exchange`的本质属性。如果货币单位以无限量供应，它将毫无价值。\n\n**价值稳定性。**\
  \ `Store of value`和`unit of account`取决于货币单位特定的价格稳定性。具有高度季节性和随机供应波动的商品（例如农产品）并不适用。\n\
  \n## 1.4 货币价值\n\n货币单位的市场价值基于三个组成部分：内在价值、附带支付承诺的价值以及流动性溢价（见表 1.1）。\n\n表 1.1\n\n货币单位的组成部分。\n\
  \n| || 内在价值 |\n| --- | --- |\n| + || 支付承诺 |\n| + || 流动性溢价 |\n| \\= || 货币单位的市场价值\
  \ |\n\n`intrinsic value`涉及材料。`promise of payment`嵌入在货币单位中。`liquidity premium`可能导致货币的市场价值高于内在价值。这三个类别构成了表\
  \ 1.2 所示的类型。\n\n表 1.2\n\n货币的类型。\n\n| || 内在 | 承诺 | 溢价 |\n| --- | --- | --- | ---\
  \ |\n| 实物货币 | + | | + |\n| 信用货币 | | + | + |\n| 法币 | | + | + |\n\n### 1.4.1 实物货币\n\
  \n实物货币具有内在价值，并且通常包含流动性溢价。市场价值可能高于内在价值。以下物品是实物货币的例子：非洲的贝壳、新几内亚亚的戒指、北美洲的服装（皮草）以及中国的金属。牲畜和基础食品也曾用作实物货币。\n\
  \n### 1.4.2 信用货币\n\n信用货币是一种支付承诺，不具有内在价值。通常，它是一张纸或数字记录，说明发行将在特定日期进行支付。这种类型的承诺被称为\
  \ IOU（我欠你）。基本上，支付承诺可以有任何形式；例如，`我欠 x 2090 年 7 月 1 日头牛`或`我欠 x 2030 年 1 月 30 日雪橇之旅`。通常，负债是用通行的记单位表示的。\n\
  \n违约风险在决定支付承诺的市场价值方面起着重要作用。在这方面，必须考虑发行人的声誉，因为 A 交付一盎黄金的承诺与 B 的相同承诺价值可能完全不同。当支付承诺在贸易中被普遍接受时，它就变成了货币。在大多数国家，银行存款（存款银行的负债）被用于电子支付。银行存款无非是商业银行的一种承诺，承诺随时（随到）将其兑换为政府货币（钞和硬币）。\n\
  \n### 1.4.3 法币\n\n“Fiat money”（法币）一词源于拉丁语 *fiat*（让其），说明法币既没有内在价值也没有支付承诺，因此其价值没有基本依据：它是凭空产生的（让货币存在）。其价值确实仅取决于其流动性溢价，如果它失去了货币功能，其价值可能会跌至零。\n\
  \n\n\n\n货币，如美元、欧元或瑞士法郎，属于法币范畴。这些纸币既不能被消费也无法整合到生产过程中，也不由黄金或任何具有基本价值的商品担保。货币价值的稳定性唯一由中央银行保障，中央银行拥有发行货币的排他性权利，并有确保其价值稳定的法律义务。\n\
  \n在瑞士和许多其他国家，纸币（在某种程度上也包括硬币）是法定货币。《货币与支付工具联邦法》（`CPIA`）第 3 条规定了“接受义务”，即“每个人都必须无限制地接受瑞士纸币作为支付手段”。这一法律基础确保了对瑞士纸币的需求，并促进了瑞士货币的流动性溢价。此外，国家支持可以对这种从上上波动剧烈的货币类别产生稳定作用。\n\
  \n法币是一个相对年轻的现象。直到 20 世纪 70 年代之前，纸币无论是隐式还是显式地都有黄金的支撑，因此代表了信贷货币。然而，由于失去了黄金的背书，且纸币的物质内在价值微乎其微，法币这一类别随之诞生了。正如我们后将看到的，比特币也属于这一类别。\n\
  \n### 框 1.3 作为协调博弈接受法币的决策\n\n法币的价值，以及我们将我们将看到的比特币单位的价值，完全基于对其未来市场接受度和市场流通能力（流动性溢价）的预期。一个人遇到愿意将其作为支付手段的市场参与者的概率越大，他或她越愿意在今天接受它。\n\
  \n下图说明了这种情况。考虑一个正在考虑是否接受法币作为支付的代理。假设 `Π` 代表未来交易伙伴接受该货币单位作为支付的概率，而 `π` 是代理的接受概率。对应关系\
  \ `π = π(Π)` 是代理对给定 `Π` 价值预期的最佳反应。对于 `![](img/pg12-in-1.png)` 的低值，最佳反应是不接受该货币单位；即\
  \ `π(Π) = 0`。对于 `![](img/pg12-in-2.png)` 的高值，最佳反应是确定地接受该货币单位；即 `π(Π) = 1`。最后，对于\
  \ `![](img/pg12-in-3.png)`，最佳反应是 `π(Π) ∈ [0, 1]`；即任何接受概率都会产生相同的收益。\n\n![](img/pg12.png)\n\
  \n`π(Π)` 与 `45°` 轴的每一个交点都代表一个纳什均衡。恰好有三个纳什均衡：`A`、`B` 和 `C`。两个外部均衡代表没有参与者（`C`）或所有参与者（`A`）愿意接受货币单位的情况。均衡\
  \ `C` 下货币的市场价值为零，而均衡 `A` 下的价值严格正。第三种混合策略均衡（`B`）在阈值 `![](img/pg13-in-1.png)` 产生。在该值之上，强化力量在起作用，使经济进入货币均衡。如果概率低于\
  \ `![](img/pg13-in-1.png)`，则接受水平将减少并完全消失。具有这些特征的情况在微观经济学中也称为*协调博弈*（更准确地说，是博弈论）。\n\
  \n## 1.5 货币控制结构\n\n货币单位显示出不同的控制结构，可以用三个维度大致概括：*创造*、*表示*和*交易处理*。\n\n“货币创造”一术是指生产新货币单位的过程。“表示”涉及货币单位的价值是否与物理对象挂钩，还是该单位仅作为虚拟抽象进行交易。“交易处理”涉及货币单位的传输是否可以在独立的、去中心化的基础上进行处理，还是必须由中央机构执行。\n\
  \n### 1.5.1 货币的创造\n\n为了货币有价值，它的数量必须是*稀缺的*。稀缺性通常通过货币创造过程实现，这可以在竞争或垄断下进行。\n\n在货币创造的竞争框架下，每个经济主体都可以创造新的货币单位。每个个体根据纯自利评估，考虑到相关的生产成本，生产一个新的货币单位是否值得。在增加单位的生产成本（边际成本）对应该货币单位当前市场价格（边际收益）之前，经济主体动力生产另一个货币单位；也就是说，只要生产过程产生正收益，生产就会持续。\n\
  \n竞争性货币创造需要技术限制来使创造过程进入均衡。图 1.3a 展示了这种关系的图表，并视觉化了均衡，该均衡位于边际成本曲线和边际收益曲线的交点处。边际收益曲线的负斜率是因为货币供应总量的增加（在需求不变的情况下）导致货币单位的市场价值下降，从而减少了边际收益。边际成本曲线的正斜率是因为假设生产货币单位需要生产要素，这些要素随着生产的增加而变得稀缺，从而变得更加的。因此，生产进一步单位的成本随着货币供应的扩张而增加。\n\
  \n![图 1.3 竞争性货币创造。](img/fig1-3.png)\n\n图 1.3\n\n竞争性货币创造。\n\n竞争货币创造的一个经典例子是淘金。基本上，每个人都可以参与这项活动并将新的黄金引入流通。然而，只有当他们的努力得到回报时，个人才会参与这项活动。发现的黄金越多，过程就越困难，因此成本越高。同时，在其他条件不变的情况下，供应的增加会导致黄金价格下降，因此每增加单位黄金，边际成本增加而边际收益减少。在特定的生产量之上，生产额外黄金的边际成本超过了黄金单位的价值，这意味着创造停止。\n\
  \n另一方面，低且恒定的边际成本（类似于图 1.3b）会导致产生大量的货币单位。如果边际成本很小甚至为零，那么个人就有动力创造新的货币单位，直到这些单位的价格降至零。\n\
  \n纸币的边际成本很小，由于这个原因，必须通过垄断创造货币的权利来建立人为限制。通常，国家控制机构被发行和管理国家货币的专属权利。这种垄断权也可以被私有化。创造货币的垄断权使得生产成本低于市场价格。\n\
  \n垄断性货币创造在图 1.4 中所示。货币发行垄断者选择总供给，货币单位的价格由总需求决定。即使在边际成本为零的情况下，垄断性货币创造允许产生具有正市场价值的货币单位。\n\
  \n\n\n\n\n![图 1.4 恒定边际成本下的垄断货币创造](img/fig1-4.png)\n\n图 1.4\n\n## 恒定边际成本下的垄断货币创造\n\
  \n垄断货币创造的一个说明性例子是实体瑞士法郎的生产。瑞士国家银行拥有发行钞票的独权，因此在货币创造上拥有垄断地位。一张钞票的生产成本平均为 30 分分（称为“Rappen”）。^(\\\
  [47\\])对于 100 法郎钞票，其成本仅为其市值的 0.3%。在货币生产的完全竞争下，市场将会充斥着钞票，直到一张钞票的真实价值等于其生产成本。这意味着，为了生产出特定总价值的交易媒介，必须放弃更多的资源。从社会角度来看，这导致了资源配置的低效，并为垄断性的货币发行过程带来了效率上的优势。\n\
  \n### 框 1.4 货币单位的相对生产成本\n\n下表显示了瑞士法郎生产成本的一个示例。数据包含了开发和生产成本，并与 2013 年瑞士联邦委员会发布的一项通知有关。^(\\\
  [47\\]) 第一列显示瑞士法郎（CHF）的面值，第二列包含法郎计的生产成本，第三列给出了生产成本与价值的百分比关系。\n\n| 面值 | 生产成本 | 百比率\
  \ |\n| --- | --- | --- |\n| 0.05 | 0.0422^() | 84.40% |\n| 0.10 | 0.0663^() | 66.30%\
  \ |\n| 0.20 | 0.0847^() | 42.35% |\n| 0.50 | 0.0710^() | 14.20% |\n| 1.00 | 0.0993^()\
  \ | 9.93% |\n| 2.00 | 0.1940^() | 9.70% |\n| 5.00 | 0.3630^() | 7.26% |\n| 10.00\
  \ | 0.3000^a | 3.00% |\n| 20.00 | 0.3000^(*a*) | 1.50% |\n| 50.00 | 0.3000^(*a*)\
  \ | 0.60% |\n| 100.00 | 0.3000^(*a*) | 0.30% |\n| 200.00 | 0.3000^(*a*) | 0.15%\
  \ |\n| 1,000.00 | 0.3000^(*a*) | 0.03% |\n\n作为竞争性货币发行的例子，我们将查看关于采矿的数据。十大最大的生产者的生产成本估计在每盎司黄金`$825`到`$1071\
  \ 之间，因此与目前的金价相当。这对应于生产成本与市值的比例在 70%到 95%之间。^(\\[21\\])\n\n*a.* 所有钞票的平均值。\n*b.* 在实践中无法观察到生产成本与金价之间的精确对应，因为\
  \ (a) 采矿存在实质的准入门槛，且 (b) 它排除了一部分市场。\n\n除了上述效率考量外，竞争性与垄断性货币发行之间还有另一个重要的区别。\n\n\n\n\
  \n![图 1.6 美元、英镑、瑞士法郎和日元货币实际价值的发展。对数尺度在 1960 年 1 月归一化为 1。来源：FRED 经济数据。](img/fig1-6.png)\n\
  \n图 1.6\n\n美元、英镑、瑞士法郎和日元货币实际价值的发展。对数尺度在 1960 年 1 月归一化为 1。\n\n*来源*：FRED 经济数据。\n\n\
  例如，考虑图 1.5 中阿根廷比索实际价值的路径。在图中，我们将货币实际价值在 1960 年归一化为 1。这意味着在当时，1 阿根廷比索可以购买一个标准商品和服务篮。大约十七年后，同样的货币单位只能购买同一种标准商品和商品的\
  \ 0.0001 单位。大约三十年后，1 阿根廷比索将购买 0.0000000000001 单位。\n\n阿根廷比索的价格历史并非孤例。事实上，很难找到一个在过去六十年中没有经历货币实际价值毁灭的发展中国家。此外，图\
  \ 1.6 显示，即使对于发达国家，货币的实际价值在过去的六十年里也像撒哈拉沙漠的冰一样融化。例如，考虑英镑和日元。这两个国家的货币在 1960 年至 2018\
  \ 年之间损失了约 90% 的购买力。瑞士法郎是图 1.6 所示群体中表现最好的。在 1960 年至 2018 年之间，它仅损失了约 70% 的价值。\n\n\
  图 1.5 和 1.6 没有考虑对各种国货币类货币资产支付的名义利率。考虑此类利息支付将减轻相应货币实际价值的损失。然而，还需要考虑到，在许多发展中国家，大部分人口（通常是穷人）无法获得金融体系，只能通过存储现金来储蓄。\n\
  \n今天的货币秩序不能用纯垄断的货币创造过程来描述。商业银行创建银行存款，这些存款虽然不是法定货币，但在大多数情况下被视为法定货币的等价物，并以类似的方式流通。银行存款无非是各商业银行根据要求兑换法定货币的承诺。例如，如果某人有一张\
  \ `US$100` 钞票，他或就拥有法定货币。然而，如果同人在商业银行有一个余额为 `US$100` 的存款账户，该余额就是一种支付承诺——换句话说，就是第\
  \ 1.4.2 节中描述的信用货币。\n\n\n\n\n# 面额与可分性\n\n物理货币单位并非完全可分。分割物理货币单位的成本可能很高（如贵金属），或者无法分割（如纸币）。法币体系创建了不同的面额，中央银行保证，例如，一张印有数字\
  \ 100 的纸币可以兑换十张印有数字 10 的纸币。\n\n虚拟货币是物理形式货币的替代方案。虚拟货币单位包括所有*没有*物理表现形式的货币单位。更准确地说，如果一个货币单位可以转移给新的所有者而这种转移并不涉及对物理物体权的变更，那么它就是虚拟的。\n\
  \n## 框 1.9：虚拟货币单位的定义\n\n在这里应该提到，欧洲中央银行（ECB）发布了一个虚拟货币单位的定义，该定义与我们的定义冲突。欧洲央银行的立场是，虚拟货币必须严格具有数字属性。（关于“虚拟货币”主题的欧洲央银行报告^[90]]：“虚拟货币是一种不受监管的数字货币，由其开发者发行并通常受其控制，并在特定的虚拟社区成员之间使用和接受”）。\n\
  \n尽管在大多数情况下，“虚拟”和“数字”这两个词被互换使用，但应避免将它们作为同义词使用。“虚拟”这个形容词是“物理”的反义词，并非源于与“数字”的任何关联。\n\
  \n此外，欧洲央银行要求“不受监管”这一定义特征适用于该术语时，排除了一些显然应归类为虚拟货币单位范围的货币替代品。举例来说，经典金融系统中使用的需求存款显然是受监管的，但其本质上是纯虚拟的。\n\
  \n虚拟货币具有物理货币的许多属性，且没有物理表现形式的缺点，但也存在不足。物理物体的所有权可以通过对应物体的位置来明确建立，而虚拟债权的所有权是可以争议的。为了解决这个问题，虚拟债权的合法化和证明是通过隐性或显式账本进行的，账本记录了所有经济主体的持有情况.^(5)\n\
  \n## 框 1.10：数字钞票\n\n一种表示价值的幼稚尝试是使用“现金”数据文件。这种数据文件可以作为数字钞票，并以类似于纸币的方式自由流通。只要数据文件的所有权可以被清楚证明，就不需要账本。\n\
  \n然而，这个想法有一个主要问题。与物理对象不同，虚拟对象可以被轻易复制。因此，这种“现金”数据文件缺乏货币最本质的特征，即稀缺性，无法无法成为货币。\n\n\
  隐性账本完全基于使用它们的参与者的口头协议，因此仅限于小型、网络良好的社区。框 1.11 讨论了一个基于隐性账本的虚拟货币单位示例。较大的社会群体产生了复杂的系统和复杂的所有权关系，这使得使用显式账本变得强制。对于这种情况，使用数据库来存储书面或数字形式的记录。\n\
  \n## 框 1.11：关于虚拟石\n\n框 1.11 美国人类学家威廉·亨利·富尼斯三世提供了一个令人印象且生动的基于隐性账本的虚拟（但非数字）货币示例。20\
  \ 世纪初，他在德国的密克罗尼西亚岛屿亚岛（Yap）花费了几个月时间研究亚岛居民的生活方式和文化。他对岛上居民的货币体系留下了深刻印象。在他的报告中，^[101]]他写到了从距离仅\
  \ 280 英里的帕劳岛开采的巨大石盘状结构，然后通过木筏运到亚岛。一旦到达那里，这些石头就被当作货币使用.^a\n\n但居民并没有在每笔交易中费力地将这些石头（每块直径高达\
  \ 13 英尺）移动到新所有者处，而是同意将这些笨重的物体留在各自所在地。唯一的决定性因素是社区承认所有权的变更。发生过的交易信息以及随后的所有权变化将在岛民之间传播，直到所有人知情为止.^b\n\
  \n尽管这些石盘是物理物体，但对其所有权的主张与它们脱离并独立进行交易。这种分离导致了对石头的物理控制不再意味着对该物理物体价值的所有。根据富尼斯的报告，虚拟化过程已经非常先进，以至于即使是从帕劳岛运往亚岛途中掉入海中的石头，其单位价值仍然被接受为交换媒介，即使石头本身已经在海底躺了数代.^[100]]\
  \ 物理石头是次要的，与建立实际所有权无关——这种分离是该货币单位满足我们对虚拟性定义的特征。\n\na. 这对应于第 1.5.1 节中的竞争性货币创造类比](#chapter_1.xhtml#sec1-5-1)，因为从理论上说，每个岛民都有能力将新石头运上岛。边际成本主要包括生产成本、运输成本和机会成本。边际收益由石头的市场价值决定。\n\
  \nb. 亚岛货币系统与比特币技术有一些共同点，但在基本方面与它们是不同的。对比比较，请参见《经济学人》^[214]]以及框 2.1。\n\n今天的金融体系建立在多层显式账本架构之上。中央银行维护商业银行资产账本。商业银行维护其客户资产账本。正如我们在后续章节中看到的，比特币也是基于显式账本管理的，即比特币区块链。\n\
  \n## 框 1.12：货币单位与匿名性\n\n使用物理货币单位进行交易提供了很高水平的匿名性.^a 通常，没有数据（或只有粗略的估计）指示物理货币单位的实际位置。因此，追踪单个货币单位非常困难，而且通常只有在物理货币单位不完全同质或具有序列号或其他特定特征时才可能。\n\
  \n拥有虚拟货币单位的系统透明得多。账本的存在意味着至少一方始终了解所有货币单位的当前分布以及所有交易，从而破坏了匿名性。无论记录是以书面、数字（显式登记）还是口头（隐性登记）形式存在，至少会导致一个受限的人群能够访问与所有权关系和执行交易有关的信息.^b\n\
  \na. 保护支付隐私的需求有许多不同的合法合法的起源.^[122]]\n\n\n\n\n\n*b.* `Bitcoin` 通过使用单向伪匿名来解决这一问题，尽管这些伪匿名被记录在\
  \ `Bitcoin ledger` 中，但在特定情况下它们可能被分配给个人（参见第 4.1.4 节）。\n\n### 1.5.3 交易处理\n\n交易处理可以是中心化的也可以是去中心化的。去中心化交易处理意味着货币单位持有者可以独立地转移其所有权，而无需寻求第三方的帮助。与之相反，中心化处理由一个中央机构负责处理交易，且其同意是货币单位转移的强制性条件。\n\
  \n无论交易处理是中心化的还是去中心化的，都必须满足以下三个交易要求。\n\n**交易能力。** 该要求确保交易可以被发起且价值单位可以转移。\n\n**交易合法性。**\
  \ 该要求确保存在一种控制机制，以保证只有合法所有者才能发起交易。\n\n**交易共识。** 该要求确保存在一种过程，能够在任何时候都建立所有货币单位所有权的明确分布。\n\
  \n根据定义，物理货币单位是以去中心化的方式处理的。物理货币单位的当前所有者可以自由决定他们想将物理物体放在何处，随后可以将该物体及其单位价值交给新所有者。因此，所有三个要求都自动满足了：物理物体只能（交易能力）由当前所有者（交易合法性）进行转移，并且始终由控制物理实体的个人拥有（交易共识）。\n\
  \n物理表现的消除破坏了固有的交易共识，导致了对账本的需求（参见第 1.5.2 节）。当使用账本时，必须解决由谁管理账本的问题。\n\n如果每个参与者都有权管理账本，将会导致严重问题。与框\
  \ 1.11 中的示例相比，调整账本的通用权利对于小型、网络良好的群体来说是一个可行的方案，但一旦系统达到特定规模且支付流变得复杂，使用隐式公共账本不可避免地引发关于账本真实状态的争议。此外，恶意行为可以通过通信操纵的交易来散布虚假报告。在信息技术中，这些问题被称为*拜庭将军问题*（参见框\
  \ 1.13）。\n\n#### 框 1.13 拜庭将军问题\n\n`拜庭将军问题`描述了去中心化信息系统面临的一个根本性挑战。系统的损坏部分可能会传播虚假信息，从而导致矛盾。因此，系统具备某种程度的容错能力并能够通过应用特定算法达成共识至关重要。\n\
  \n在首次介绍这一主题的论文中^([136]))该问题在一个描述性的故事背景下被说明。拜庭军队的几个师围攻一座敌城。师之间只能通过信使进行通信，并必须就共同策略达成一致——例如继续围攻或进攻。只有忠诚师选择了相同的策略，计划才能成功，拜庭军队才能胜利。\n\
  \n问题在于军队成员中存在少数叛徒，他们将试图通过传播虚假报告来破坏协调军团的策略。以下两个例子说明了识别叛徒师以及协调共同策略的困难性。\n\n```\n![](img/pg27.png)\n\
  ```\n\n在两个例子中，`Division 1` 采取主动并传达策略。`Division 3` 接收到了矛盾的信息，必须尝试识别叛徒（在两个例子中均用灰色表示）。问题在于，从\
  \ `Division 3` 的立场来看，两种情况完全一样[攻击/等待]，尽管从其在左图的位置来看背叛被视为源自 `Division 1`，而在右图中 `Division\
  \ 2` 被视为具有背叛意图。因此，`Division 3` 无法区分真伪，也无法与另一个忠诚师协调策略。\n\n大多数虚拟货币单位都基于账本，这些账本使用中心化的交易处理系统，一组预定义的代理被赋予了管理账本的独他权限。通常，这些代理是商业银行，作为回报提供必要的支付基础设施。这些机构建立了分行网络，接受书面支付指令，并通过电子通信通道促进客户赞助的互动（交易能力）。同时，它们验证支付指令的合法性，以确保只有合法交易进入账本（交易合法性）。独他性确保了任何时候只存在一个版本的账本，自动满足了交易共识的要求。\n\
  \n中央机构的存在有助于简化交易过程并达成共识。同时，这种垄的建立容易受到违规操作的风险。理论上，中央机构可以任意更改账本，或拒绝处理根本上合法的交易。即使在不预期会有这种公开滥用地位的国家，仍有很多问题需要解决：经济应该以及可以在多程度上依赖中央基础设施？谁决定记录权限的分配？如何防止中央实例腐败或提取垄断租？此外，中央基础设施增加了刑事攻击和第三方没收资金的风险。例如黑客攻击；独裁、强制将余额转换为新创建货币；或对货币单位的任意没收。特别是一个需要解决的紧迫哲学问题是：如果相应的价值单位根据另一个体的同意才能转移和使用，那么“财产”一词是否具有意义。\n\
  \n我们面临着一个困境。一方面，从效率角度来看，虚拟货币单位是最优的；另一方面，虚拟表现需要中心化的交易处理并带来上述所有的负面影响。因此，设计一种具有去中心化交易处理的虚拟货币单位是理想的。2008\
  \ 年，比特币开发者提出了一种不依赖中心化机构的虚拟货币。\n\n### 1.6 习题\n\n**练习 1.1** 解释货币单位的三个功能。对于每个功能，至少列出一个与其功能相关的货币基本特征。给出你选择的理由。\n\
  \n**练习 1.2** 在一个简化的模型经济中，26 种不同的产品相互直接交易。使用定量示例和推理，说明引入一种普遍接受的交换媒介（或货币单位）对可交换产品对的数量产生什么影响。\n\
  \n\n\n\n\n**练习 1.3:** 在边际成本相同的情况下，请解释为什么在竞争性货币创造下，生产给定真实货币数量的总成本永远不会低于垄断性货币创造下的总成本。\n\
  \n**练习 1.4:** 如果在竞争下创建的货币单位价值由反需求函数 `MR(q) = max[50 - 2q, 0]` 决定，且生产货币单位的边际成本具有如下形式，请计算均衡货币数量\
  \ `q`：\n\na) `MC(q) = 3q`，\n\nb) `MC(q) = 10`。\n\n**练习 1.5:** 请用图示展示练习 1.4 的解答，并与图\
  \ 1.3 进行对比。\n\n**练习 1.6:** 阅读关于 M-Pesa 的维基百科文章[225]，并根据控制结构对该货币单位进行评估。\n\n**练习 1.7:**\
  \ 描述拜占庭将军问题在多大程度上能够破坏虚拟货币单位的去中心化交易处理。\n\n1. 1。如果交易伙伴之间存在既定的信任关系，贷款将是一个可行的替代方案。这种在信用基础上提供相互恩惠，随时间累加并进行结算[104]。\n\
  2. 2。经济专业化的程度增加了物物交易的复杂性和相关的交易成本。较高的交易成本会导致更大的潜在储蓄，并促进了普遍接受的交换媒介的主导地位。相反，普遍接受的交换媒介促进了经济专业化，甚至可以被视为其前提。虽然因果方向无法明确确定，但众所周知，专业化与货币之间紧密相关且呈正相关[139]。\n\
  3. 3。今天，个人无法以虚拟形式持有中央银行货币[34]。\n4. 4。在瑞士，每位客户高达 100,000 法元的商业银行存款受保险保护（参见《瑞士联邦银行储蓄法》第\
  \ 37 条及后续）[198]。\n5. 5。储值卡（SVC）提供了使用账本的替代方案。货币单位可以加载到这些卡上，而无需在中央账本中记录余额。芯片防止任何未经授权的余额调整。同样，支付的验证不需要连接账本。这种方法的常见示例是电话卡[60]或借记卡上的`Cash`功能[59]。如今\
  \ SVC 的重要性已降低，大多数项目已经终止。失败的一个主要原因是，尽管 SVC 属于虚拟货币单位领域，但它们的使用需要用户物理场以及特殊的读取器。\n\n\
  # 2 比特币\n\n在本章中，我们开始分析比特币。我们将讨论这个术语，将比特币系统与古典金融系统区分来，并阐明没有中心权威的后果。我们将展示在 1.5.3 中讨论的三个交易要求是如何满足的，并为本书的第二个更具技术性的部分奠定基础。之后，我们将关注比特币系统的起源、发展和政治特征。本章作为一个简短的摘要和粗略概述，旨在突出比特币系统的创新特性。\n\
  \n`Bitcoin` 是一个歧义的术语。它既用于描述整个系统，也用于描述某些子组件。后一类别包括比特币`network`（网络）、比特币（通信）`protocol`（协议）和比特币（货币）`unit`（单位）。该术语的歧义导致了许多困惑，并构成了理解该系统必须克服的首要障碍。因此，我们将在各种概念之间使用严格的定义边界。Bitcoin\
  \ 一词本身将指代系统或技术。当我们提到子组件时，将始终使用 `network`、`protocol` 或 `unit` 术语。\n\n## 2.1 比特币分类\n\
  \n比特币是一个综合概念，它将多个技术组件结合，使得价值单位在竞争下发行，并同时具有虚拟表示和去中心化交易处理。通过这种方式，比特币系统创造的货币与任何其他货币都有本质区别——例如商品货币、现金或商业银行存款（参见图\
  \ 2.1）。\n\n![图 2.1 货币单位控制结构矩阵。](img/fig2-1.png)\n\n图 2.1 货币单位控制结构矩阵。为了理解为什么比特币是独特的，根据其控制结构重新回顾不同形式的货币是有用的，如图\
  \ 2.1 所示。三个维度：\n- 表示：货币可以用虚拟形式或物理形式表示。\n- 交易处理：货币可以在集中或去中心化的网络中进行交易。\n- 货币创造：某些货币由垄断创造，而另一些在竞争下发行。\n\
  \n`Cash` 由物理物体（通常是硬币或纸币）表示——这意味着其价值与物体不可分割。现金单位的持有者自动拥有相应的价值。结果是，经济中流通的现金单位所有权始终定义明确，无需任何人记录。这种特性允许去中心化的支付系统，现金可以在两个代理之间易手而无需第三方参与。在大多数国家，中央银行或财政部是现金的垄断发行者。\n\
  \n商品货币（如黄金）也由物理物体表示，再次，当前的持有者默认被分配价值单位的所有权。因此，将其作为支付工具不需要记录，导致默认的去中心化交易处理。黄金与现金的区别在于其竞争创造过程，因为任何人都可以进入采金业务并创造新的黄金单位。\n\
  \n商业银行存款是虚拟货币。它仅作为会计系统中的记录存在。进行支付时，通过从买方扣除支付金额并存入卖方来调整账户。启动支付有很多；最常见的是借记卡、支票和网上银行。商业银行竞争存款；这就是为什么我们认为商业银行存款形式的货币创造是竞争性的（参见图\
  \ 2.1）。银行负责记录，因此买方和卖方之间的任何交易都需要商业银行或多家商业银行更新相应的账户。由于由于原因，商业银行存款在集中支付系统中进行交易。\n\n\
  中央银行电子货币也是虚拟货币。在大多数国家，公众访问电子中央银行货币受限于金融机构。他们将这些账户资金用于结算并满足准备金要求。与商业银行存款不同，中央银行准备金可以仅由中央银行创造。\n\
  \n\n\n\n\n图 2.1 展示了比特币的核心创新在于对虚拟资产所有权的去中心化管理。比特币的特殊之处在于，它将虚拟货币单位的交易优势与去中心化交易处理的系统性独立性结合在一起。正如我们在整本书中所看到的，这种创新具有颠覆当前金融基础设施以及许多其他部门的潜力。\n\
  \n## 2.2 比特币组件：概述\n\n为了实现图 2.1 所示的独特控制组合，比特币使用了图 2.2 所示的组件。\n\n![图 2.2 比特币技术概述（trx\
  \ = 交易）。](img/fig2-2.png)\n\n图 2.2\n\n比特币技术概述（`trx = transaction`）。\n\n**比特币单位。**\
  \ 比特币单位是系统的虚拟货币单位。它们不以物理形式存在。比特币单位仅仅是分配给特定个人的账本条目。^(1)\n\n**比特币网络。** 比特币网络是完全去中心化的。它由参与者及其连接组成，是交换信息和建立共识的主要通信渠道。\n\
  \n**比特币协议。** 比特币协议规定了比特币网络内部进行通信的方式和手段。它主要包含了关于所有类型消息应如何格式化的标准指南。\n\n**非对称加密。**\
  \ 非对称加密（也称为公钥加密）被用于验证目的。它使得比特币网络的所有用户都能确凿地验证任何交易消息的合法性。\n\n**比特币区块链。** 比特币区块链是一个公共账本。每个人都可以检查账本、下载副本并对其进行修改。然而，网络只会考虑满足以下条件的账本版本：(1)\
  \ 仅包含验证为合法的交易；(2) 被认为是比特币区块链的最新版本。后一个标准由共识协议保证。为了实现这一点，比特币区块链使用了一种名为`proof of work`（工作量证明）的程序。\n\
  \n## 2.3 比特币的独特卖点\n\n使用账本并非比特币技术的新颖之处。例如，商业银行存款本质上是对物理货币单位（现金）权利的基于账本的虚拟化。在这里，账本由中心权威专门管理，该权威保证了交易能力、交易合法性和交易共识。\n\
  \n`Transactional capacity`（交易能力）与保障所有者发起支付的能力有关。在经典的银行系统中，客户可以与客户顾问交流，或通过银行的在线银行平台提交支付指令。由商业银行和其他中央服务提供商提供的基础设施确保了交易将执行。在没有中心权威的情况下，以这种传统方式执行支付订单是不可能的。因此，在比特币系统中，必须存在另一种可能性，允许参与者发起交易。\n\
  \n`Transactional legitimacy`（交易合法性）在交易发起时进行检查。在经典的银行系统中，中心权威会识别交易的启动者，并确保该个人是所引用余额的合法所有者。身份识别通常通过检查护照、手写签名和密码，或者通过使用生物识别方法来实现。所有这些控制机制都依赖于中心权威来管理访问准则。在像比特币系统这样没有中心权威的情况下，必须通过其他手段实现交易合法性。\n\
  \n如果一个单一实体被专门授权管理所有支付记录，那么只存在一个账本，它默认确保了`transactional consensus`（交易共识）。在像比特币系统这样没有中心权威的情况下，则会存在不同的、可能同样合法的账本版本。在这种情况下，必须使用其他方法，通过确定账本的哪个版本代表真实状态，来达成交易共识。\n\
  \n比特币的关键创新在于它拒绝引入中心权威。在没有中心权威的情况下，保证交易能力、建立交易合法性和实现交易共识变得更加困难。比特币网络如何满足这些要求将在下一节中描述。\n\
  \n### 框图 2.1 与雅系统的对比\n\n在控制结构方面，雅系统（Yap system）与比特币属于同一类别（见图 2.1）。单位是虚拟的，在竞争中产生，且交易在去中心化系统中结算（见框图\
  \ 1.11）。这两个系统的主要区别在于，比特币可以在不需要信任的环境中使用。相反，雅系统依赖参与者之间的密切关系以及他们面临的社会排斥威胁。\n\n比特币确保所有参与者都能对交易进行数学验证。它的运行不需要信任。因此，尽管有许多相似之处，它与雅系统明显不同。\n\
  \n## 2.4 比特币技术：入门\n\n在本节中，我们总结了比特币如何满足上述三个交易要求。\n\n### 2.4.1 交易能力\n\n比特币网络是系统的基础。它允许信息交换，并基于`peer-to-peer`（点对点）技术。点对点意味着所有网络参与者都是平等的，通信可以在任何参与者之间进行。没有中心结构，没有任何参与者拥有独家权限。\n\
  \n交易和其他消息在比特币网络内部发送以建立共识。例如，如果伊迪想给丹尼发送比特币单位，她创建一个包含相应支付指令的消息。消息必须根据比特币协议的标准组成并发送给至少一个网络参与者。\n\
  \n在我们图 2.3 的示例中，交易消息到达托尼，他保留了消息副本并将其转发给他的直接连接，即玛西亚和米歇尔。玛西亚和米歇尔也这样做。消息一直转发，直到所有网络参与者都收到其副本。\n\
  \n![图 2.3 交易的启动。](img/fig2-3.png)\n\n图 2.3\n\n交易的启动。\n\n\n\n\n\n比特币网络的去中心化和动态拓扑结构是系统具有卓越稳健性的原因。如果单个参与者断开网络连接，可以无缝地进行补偿，并通过替代通道继续通信。如果有人想发起一笔交易，只需将交易消息转发给任何网络参与者并等待其通过转发进行传播即可。这一原理保证了交易能力的需求始终能够满足。\n\
  \n比特币网络内部的通信不依赖于任何信任。准入没有限制，参与者可以创建任意数量的伪名，这使得从系统中排除单个参与者变得是不可能的。因此，参与者必须假设他们收到的每条消息都已被发送者欺诈性地篡改，因此必须对其真实内容进行确定性的检查。\n\
  \n### 2.4.2 交易的合法性\n\n如果网络参与者接收到一条交易消息，他必须确保该交易是由相应比特币单位的合法所有者起的。为了这一目的，比特币采用了经过证明的加密方法。同样的加密原理也用于电子商务、网上银行和许多其他应用。\n\
  \n比特币单位的所有权需要独占一个私钥，该私钥用于在交易消息转发到网络之前对其进行密码学加密。每个私钥都有一个对应的公钥。该公钥可以用于解密任何之前用相应的私钥加密过的消息。\n\
  \n与私钥相反，公钥是公开的。因此，任何接收到交易消息的人都可以对其解密。在这种背景下，“加密”和“解密”术语稍微带有误导性。显然，该过程的设计并不是为了隐藏任何信息。毕竟，每个人都有公钥，因此都可以解密交易消息。它更多是用于验证交易消息的来源和合法性。\n\
  \n只有当交易消息最初使用对应的私钥加密时，才能用公钥成功解密。由于只有合法所有者才拥有相应的私钥，这便成了交易合法性的证明。例如，如果有人成功使用 Edith\
  \ 的公钥解密了交易消息，这清楚地证明了该消息是用 Edith 的私钥加密的。由于 Edith 是唯一知道自己私钥的人，这一程序允许任何人从数学上验证该交易消息确实是由她编写的。\n\
  \n图 2.4 使用示例说明了这一过程。Edith 在将消息发送给 Tony 之前，用她的私钥对其进行了加密。Tony 接收到消息并尝试用对应的公钥对其进行解密。如果\
  \ Tony 能够这样做，他就知道该消息之前是用 Edith 的私钥加密的。\n\n![图 2.4 交易消息的加密与解密。](img/fig2-4.png)\n\
  \n图 2.4\n\n交易消息的加密与解密。\n\n对交易的初始验证是不够的。记住，交易消息是通过不可信的网络进行转发和传播的。每个接收者都对其进行验证。如果\
  \ Tony 将交易消息转发给 Marcia 和 Michèle，那么这两个接收者都必须独立验证该交易消息是合法的。特别是，他们必须检查该交易是否确实是由 Edith\
  \ 发起的，以及是否有任何交易参数被更改过。如果没有这第二个验证步骤，那么 Tony 就可以修改消息（参见图 2.5）并代表 Edith 转发被篡改的交易消息。\n\
  \n![图 2.5 尝试篡改交易消息。](img/fig2-5.png)\n\n图 2.5\n\n尝试篡改交易消息。\n\n为了防止此类篡改，Marcia 和\
  \ Michèle 只接受原始的加密消息。他们将使用 Edith 的公钥来验证消息的真实性。Tony 没有拥有 Edith 的私钥，因此无法修改并重新加密交易消息。因此，Marcia\
  \ 和 Michèle 在识别任何欺诈行为方面没有困难。篡改尝试的示例在图 2.5 中所示。Michèle 和 Marcia 无法解密该消息，因此可以立即拒绝被篡改的交易消息。\n\
  \n如果交易消息是合法的，它会被分配到网络参与者的已验证交易集合中。这基本上是一个等待进入比特币区块链的已验证消息的队列。\n\n### 2.4.3 交易的共识\n\
  \n由于网络的去中心化本质，不可避免地会出现网络参与者的各种交易队列不同步，甚至可能包含冲突交易的情况。\n\n让我们假设例如，某个人同时发布并转发了两个笔交易，试图将相同的比特币单位转移给不同的网络参与者。在中心化系统中，当发生此类冲突时，被认为有效的交易是先到达中央机构的那一个。然而，比特币系统明确拒绝使用中心机构。结果是，没有明确的领导者，可能网络的一部分先听听到第一笔交易，而网络的其他部分先听听到第二笔交易。两笔交易都是合法的，因为它们都是由相应比特币单位的合法所有者发起的。然而，由于两笔交易都涉及同一个比特币余额，只有其中一笔可以是有效的。\n\
  \n图 2.6 显示了此类情况的具体示例。Edith 同时向 Tony 和 Jake 发送了消息。在发给 Tony 的消息中，她表示希望将特定的比特币单位转移给\
  \ Daniel。在发给 Jake 的消息中，她提到了同一个比特币单位，但将受益人（Daniel）替换为 Lucas。两条消息都使用了 Edith 的私钥加密，因此都是合法的。这些消息被转发并留在各自小组的交易队列中。此时，Tony、Marcia\
  \ 和 Michèle 认为 Edith 希望将比特币单位转给 Daniel，而 Brian、Jake 和 Claudia 认为她想将其发送给 Lucas。\n\
  \n![图 2.6 冲突交易的传播。](img/fig2-6.png)\n\n图 2.6\n\n冲突交易的传播。\n\n对于整个网络而言，哪笔竞争交易胜出并不重要。然而，为了防止双花费并在所有网络参与者之间达成共识，必须允许两笔交易之一进入比特币区块链的共识版本。\n\
  \n#### 比特币挖矿\n\n要理解比特币系统的共识机制，我们首先必须讨论比特币矿工的角色。比特币矿工收集等待中的比特币交易，验证其合法性，并将它们组合成所谓的区块。区块是一个包含至少一个交易的数据结构。组合区块并进行必要计算的过程被称为*比特币挖矿*。矿工的目标是通过这种活动获得新创建的比特币单位，下文所示。\n\
  \n\n\n\n比特币挖矿是无需许可的，但需要计算资源。每个网络参与者都可以自由决定想在计算资源上花费多少钱。要成为一名比特币矿工，网络用户需要比特币区块链的最新副本以及一个能够自动化该过程的软件软件包。\n\
  \n为了组装一个区块，比特币矿工会选择在其队列（`mempool`）中等待的交易。为了让一个区块被网络广泛接受，它必须满足一组特定的预定义标准。例如，包含的交易必须是合法的，且不能与当前区块中的任何交易或比特币区块链之前任何一个区块中的任何交易发生冲突。如果矿工违反了这些任何一个条件，他的区块将被网络其他部分拒绝。\n\
  \n另一个重要的标准是所谓的区块标识号。该标识号通过使用 `SHA256d` 哈希函数计算区块头的哈希值获得。我们将在书的第二解释技术细节。在这里，我们想强调标识号的重要性，原因有二：首先，任何新区块必须引用前一个区块的标识号，从而生成按时间顺序排列的区块链或`blockchain`。图\
  \ 2.7 展示了这种链的结构。其次，如文所示，标识号是区块被接受比特币区块链的重要标准。\n\n![图 2.7 区块链示例。](img/fig2-7.png)\n\
  \n图 2.7\n\n区块链示例。\n\n### 区块链的不可篡性\n标识号是唯一的，取决于区块头的内容。区块头内容的任何修改都会不可避免地导致标识号发生。这将引入链结构的不一致性，导致所有后续区块都必须重建。\n\
  \n如果有人修改了图 2.7 中区块 1 的某笔交易，该区块的标识号就会改变。因为区块 1 的标识号在区块 2 中引用，该引用也必须进行调整。这种调整对应于区块\
  \ 2 的变化并会导致其标识号改变，从而再次导致需要重新组装区块 3，依此类推。\n\n矿工通过使用 `SHA256d` 哈希函数计算区块头的哈希值来获取标识号。例如，考虑文本“This\
  \ block includes transactions 1, 2, and 3.”的哈希值。该文本使用哈希函数 `SHA256d` 计算出的标识号为：\n\n\
  ```\n80ac1f5e36cefbdde5d58dbe7379e8532335583b79ab805737e7b4de0bf78ffc\n```\n\n现在注意原始文本的微小变化，变为“This\
  \ block includes transactions 1, 2, and 4.”。这将导致标识号发生不可预测的变化，从对应的新哈希值中可以这一点：\n\n\
  ```\n3b72098d7f49bf8912010cb87afe0a64d824803d2bf6490cf95b7a198c6dc146\n```\n\n由于用于生成标识号的哈希函数具有特殊特性，无法猜测哪些输入会导致所需的目标值。这种特性在挖矿过程中的应用如下：为了让一个候选区块被所有网络参与者接受，其标识号必须具备一个极其稀见的特征：该数字必须低于某个阈值，也就是说，它必须在标识号的开头显示几个零。2010\
  \ 年添加到比特币区块链的区块标识号示例如下：\n\n```\n000000000a93f114165c1c6940dc5a55ea20a5651af1e9ef0415319ad7458fc9.\n\
  ```\n\n由于无法猜测哪些输入会导致所需的标识号，比特币矿工唯一的选择就是尝试不同的区块内容，直到纯粹偶然地遇到一个能产生足够小标识号的输入组合。为了这个目的，区块包含一个数据字段（称为\
  \ `nonce`），该字段包含任意数据。矿工通过修改这些任意数据来获取新的新的标识号。这些修改不会影响所包含的交易集。\n\n如果矿工成功创建了一个标识号低于当前阈值的候选区块，他将尽可能地将该候选区块广播到网络。所有其他网络参与者可以通过自行计算，轻松地验证该标识号是否满足阈值标准。\n\
  \n### 共识\n矿工之间的共识是，任何接收到仅包含有效交易且标识号低于当前阈值的区块的矿工，都将该区块添加到他们自己的比特币区块链副本中。从博弈论的角度来看，所有矿工都将有效区块添加到自己的比特币区块链副本中的策略组合是一个纳什均衡。如果一个矿工相信所有其他矿工都在采取行动，那么该矿工的最优反应就是将有效候选区块添加到他自己的比特币区块链副本中。偏离共识是不值得的，因为在一个不被接受的比特币区块链版本上工作是不有利可的。因此，尽管没有权威来执行这条规则，且矿工可以随心所欲修改自己的比特币区块链副本，但遵循这条规则有着强大的动力。这种自我执行的规则允许网络对所有比特币单位的所有权达成共识。\n\
  \n挖矿是昂贵的，因为计算消耗大量的电力，并且日益依赖专用硬件。因此，这种共识机制被称为“工作证明”。如果矿工为某个区块找到了有效的标识号，那么这证明了他平均执行了大量的昂贵计算。在区块中添加虚假信息（例如非法交易）将导致区块无效，从本质上浪费了所有的计算。因此，找到有效的标识号证明了矿工对维护比特币系统的贡献。\n\
  \n\n\n\n根据共识，网络参与者接受最长链作为账本的当前状态。该协议背后的逻辑是，最长链是需要最高资源进行计算的链，使其具有最广泛的支持，更重要的是，修改它的成本非常高。特别地，只有当矿工拥有比网络其他部分更有概率组装区块的资源时，才可能进行更改。只有控制系统\
  \ 50% 以上总计算资源的网络参与者才有能力实现这一点。^(4)\n\n如果一个网络参与者想要更改图 2.8 中链的第三个区块，他必须引用链中的第二个区块，并生成足够数量的新区块，以便超越主导的共识链版本。所有其他矿工将基于最长链的第\
  \ 6 个区块同时生成新区块。因此，攻击网络的参与者必须比所有其他网络参与者更快地生成新区块。区块在共识链中的位置越靠后，修改该区块就越困难。因此，区块的完整性受到了链的保护。\n\
  \n![图 2.8 从第 3 个区块开始对区块链的攻击。(images/fig2-8.png)\n\n图 2.8  \n\n从第 3 个区块开始对区块链的攻击。\n\
  \n如果我们再次回到图 2.6 中的示例，共识是如何实现的就显而易见了。Jake、Brian 和 Claudia 将有利于 Lucas 的交易包含在他们的候选区块中。而\
  \ Tony、Marcia 和 Michèle 则将包含有利于 Daniel 的交易。这两笔交易中哪一个胜出取决于哪个矿工第一个生成有效区块。一旦成功生成了包含这两个冲突交易之一的有效区块，其他矿工就有动力遵循最长链并继续在该区块链的新版本上工作。由于另一笔交易会被拒绝，矿工将丢弃该交易。如图\
  \ 2.9 所示，链可以根据哪个矿工生成下一个区块向向几个方向发展。\n\n![图 2.9 区块的各种交易候选者。(images/fig2-9.png)\n\n\
  图 2.9  \n\n区块的各种交易候选者。\n\n### 挖矿奖励\n\n挖矿是有成本的。硬件需要采购和维护，而且有电费成本。这些成本由矿工个人承担。另一方面，维护比特币区块链符合所有网络参与者的利益。在这方面，挖矿提供了一种公共物品：没有人被排除在网络之外，且所有网络参与者都能从挖矿活动中获益。然而，如果没有补偿，没有任何矿工会有动力贡献并承担维护网络的成本。\n\
  \n比特币系统通过允许矿工在每个区块中添加所谓的 `coinbase transaction`（币基交易）来解决这一激励问题。这笔交易产生新的比特币单位，这些单位可以由成功将区块添加到比特币区块链的矿工领取。由于每个人都遵循链的长版本，只有当该区块确实是区块链长版本的一部分时，网络才会接受该\
  \ `coinbase transaction`。\n\n在我们的示例中，如果 Brian 生成了一个有效区块，那么该区块将包含 Edith 给 Lucas 的交易以及有利于他的\
  \ `coinbase transaction`。如果 Marcia 成功生成了一个有效区块，那么交易将改为包含 Edith 给 Daniel 的交易以及有利于她的\
  \ `coinbase transaction`。Marcia 和 Brian 区块候选者中包含的两笔交易如图 2.10 所示。\n\n![图 2.10 区块候选者的不同交易。(images/fig2-10.png)\n\
  \n图 2.10  \n\n区块候选者的不同交易。\n\n与所有其他交易一样，`coinbase transaction` 只有在记录在链的长版本中时才有效。这一过程促使矿工始终引用最长区块链的最后一个区块，从而继续在账本的共识版本上工作。如果矿工决定引用与最后一个区块不匹配的区块，将面临高风险。\n\
  \n除了激励问题的解决方案外，挖矿机制还保证了比特币单位的创建。每当新区块被添加到比特币区块链时，就会产生新的比特币单位。在比特币系统的前四年中，这种奖励金额为五十个比特币单位。奖励在\
  \ 210,000 个区块（即大约四年）后减半，目前为 12.5 个比特币单位。由于这种“减半”，比特币单位的总数将收敛于 2100 万。图 2.11 显示了这种渐近增长路径。预计最后的少量比特币单位将在\
  \ 2140 年左右创建。^(5)\n\n![图 2.11 创建新单位的时间表。(images/fig2-11.png)\n\n## 2.5 起源与治理\n\n\
  在本节，我们将介绍比特币系统的起源及其治理结构。\n\n### 2.5.1 虚拟现金的梦想\n\n比特币的第一步发生在 1982 年，David Chaum 发明了\
  \ `DigiCash`^[55\\]。Chaum 认为现有的支付系统会极大限制个人隐私，并产生可追踪的敏感数据支付流。这个问题激励他开发了一种虚拟货币单位，模仿现金的匿名性。虽然\
  \ DigiCash 基于垄断性的货币创造和中心化的交易处理，但所采用加密过程的可交换性^(6) 促进了一个系统的形成：中央银行对货币单位进行`盲签`，从而对流通货币单位的序列号一无所知。结果是序列号无法分配给个人，货币单位以匿名方式使用。\n\
  \n交易共识通过中心化账本实现。如果使用了某个货币单位，则其序列号必须提交给中央银行。如果该号码不在中央银行的账本中，则假设该货币单位是第一次使用，因此是有效的。如果序列号已被中央银行注册，则被视为尝试`double\
  \ spend`（双重花费）并相应地被拦截。\n\n\n\n\n\n1998 年，计算机科学家 `Wei Dai` 显然受到了《加密无政府主义宣言》的影响，发表了一篇短文提出了\
  \ `b-money` 的概念，这是一种伪名的虚拟货币单位。在 `b-money` 系统中，公钥被用作伪名，并向其分配贷方或借方交易。交易的合法性通过使用被扣款相应的私钥进行签名来保证。所有参与者（或一个子小组）管理着独立的账本，账本包含所有伪名当前余额的记录。文章没有包含关于如何实现交易共识的具体建议。相反，`b-money`\
  \ 被呈现为一个思想实验，假设了同步通信通道的存在。货币的产生遵循一个竞争性过程，使用只有通过高强度计算才能解决但可以简单验证的数字谜题。货币产生过程产生的成本由系统的参数化任意决定。\n\
  \n将原本微不足道任务人为变得成本昂贵的概念可以追溯到 Adam Back 以及 Cynthia Dwork 和 Moni Naor 的贡献，最初是为了对抗`拒绝服务`（DoS）攻击和垃圾邮件。这些贡献是比特币系统中所使用的工作量共识协议的基础。\n\
  \n2005 年，Hal Finney 提出了可重用工作量系统的想法。他的方法结合了 `Wei Dai` 和 Adam Back 的思想。后来，Hal Finney\
  \ 成为最早的比特币用户之一以及首笔比特币交易的接收者。\n\n同样在 2005 年，Nick Szabo 发布了一篇关于 `Bit Gold` 的博客文章。文章描述了工作量算法在进行竞争性货币创造的同时保护公共账本的应用。尽管\
  \ Szabo 的博客文章没有在比特币的出版物被引用，但可以假设 `Bit Gold` 对比特币的发展做出了实质贡献。\n\n### 2.5.2 Satoshi\
  \ Nakamoto\n\n比特币于 2008 年 10 月 31 日由一位名为 `Satoshi Nakamoto` 的假名作者（或团队）发布。该出版以学术文章的形式出现在一个密码学邮件列表中。然而，直到今天仍然还不清楚这个假名背后隐藏着谁或哪些人的身份。\n\
  \n除了作者身份外，文章（以及参考实现）披露了关于比特币技术的完整、详细信息。发明者在系统中没有特权，而且由于信息的披露以及随后其他人的技术开发，他已经变得无关紧要。尽管如此，这绝不应该削弱创始者的成就。在此应当指出，匿名作者曾被加州大学教授\
  \ Bhagwan Chowdhry 提名诺贝尔经济学奖。\n\n**Box 2.2：谁是 Satoshi？推测**\n\n2014 年 3 月，《新闻周刊》记者\
  \ Leah McGrath Goodman 在一篇重大封面故事中报道了关于 `Satoshi Nakamoto` 身份的所谓解决方案，这引起了轰动。在一份显然研究不足的报告中，她声称比特币的发明者是一个当时\
  \ 64 岁的日本裔美国男子。事实证明，这位名为 `Dorian Satoshi Nakamoto` 的男子对点点网络或加密系统没有任何经验。在《新闻周刊》文章发布十天后，`Dorian`\
  \ 发表了书面声明，在其中否认了曾参与过或合作过比特币项目。\n\n事实上，只有几个人值得考虑，因为比特币的开发需要非常专业的知识和技能。一个被广泛讨论的候选人是\
  \ `Nick Szabo`。这位计算机科学家兼律师是 `Bit Gold` 等发明的背后人物。除了许多其他线索外，文本分析显示 `Nick Szabo` 的写作风格与\
  \ `Satoshi Nakamoto` 非常相似。`Nick Szabo` 否认直接参与了比特币项目。无论他是否是 `Satoshi Nakamoto`，他通过自己的研究对比特币做出了实质性贡献。另一个在\
  \ 2008 年拥有设计比特币系统所需知识和技能的人是 `Hal Finney`。众周他在 2009 年接收了第一笔比特币交易。\n\n随着比特币受欢迎程度提高，很多人声称自己是\
  \ `Satoshi Nakamoto`，包括 Craig Steven Wright。然而，由于提供的许多“证据”非常可疑，某些情况下甚至已被证伪，我们认为没有必要进一步讨论这些说法。\n\
  \n### 2.5.3 比特克的治理\n\n比特币具有去中心化的结构且完全开源。没有中央机构、没有公司，也没有个人拥有特权来决定其未来发展。比特币是由所有参与者的集体行动催生的构造。它对任何实体的独立是一个有意的设计选择，这也是发明者希望保持匿名的可能解释。\n\
  \n然而，领导的缺失引发了许多问题，并隐藏着系统可能陷入混乱的危险。特别是以下两个问题：\n\n1. 如果技术被复制并有人创建了自己的“比特币”单位，会发生什么？\n\
  2. 谁来决定比特币系统的未来发展，以及如何处理潜在问题并调整技术？\n\n#### 比特币副本：所谓的山寨币\n\n比特币的源代码是公开的。这意味着每个人都可以复制它，以任何想要的方式对其进行修改，并发布系统的替代版本。\n\
  \n然而，这并不意味着可以创建额外的比特币单位。比特币克隆建立了新的、明确分离的货币单位，它们有自己的账本。此类副本被称为山寨币（altcoins）。例如，我们可以为本书的读者创建一个\
  \ `Bookcoin`；这是一种深受比特币启发的新加密货币，专门用于读者。`Bookcoin` 可以代表比特币技术的精确复制，也可以以不同的方式参数化。可以更改的参数示例包括硬币的总供应量或生成有效区块的平均时间。要创建一个新的山寨币，创建者修改比特币源代码的副本并对其重新编译。\n\
  \n**Box 2.3：山寨币与足球：类比**\n\n一个解释这一原理的简单类比是足球运动。正如比特币技术一样，足球规则是免费获取的，并且基本上可以以任何方式进行修改。业余球员做的常见调整涉及场地大小、人数以及不执行某些更复杂的规则。\n\
  \n\n\n\n\n没有人会阻止孩子们在校园场上将他们的游戏称为“超级碗赛”，或用修改后的规则来玩。然而，没有人会认为在校园场上进行的“超级碗赛”与国家橄榄球联盟那价值数十亿美元的业务是同等的。对某种形式足球的欣赏和流行程度是由球员、粉丝和赞助商建立的。\n\
  \n在 `Bitcoin` 的情况下，情况非常相似。每个人都可以创建新的分支和替代币。原始规则可以被保留，也可以被部分修改。从经济角度来看，只有当出现特定的估值和支付意愿时，替代版本才会变得重要。\n\
  \n随着时间的推移，数以千计的代币诞生了。其中一些具有更广泛的功能，或在参数化上有显著差异，但许多只是换了名字的 `Bitcoin` 。尽管存在这种竞争，`Bitcoin`\
  \ 显然是加密货币中的领导者。它具有先发优势和品牌知名度。此外，由于网络效应，`Bitcoin` 货币的市值远高于所有其他加密货币.^(11)\n\n# Bitcoin\
  \ 系统的管理与演进\n\n`Bitcoin` 系统内部的激励机制被设定为：每个参与者遵循当前规则即可实现个人收益最大化。Vitalik Buterin 在《比特币杂志》第一期中解释了这一现象.^(\\\
  [48\\]) 他认为，`Bitcoin` 是第一个阻止欺诈行为的计算机网络，这种阻止并不是因为专有限制，而是因为没有人可以通过单方面偏离这些规则来获得优势。\n\
  \n然而，必须意识到 `Bitcoin` 涉及到软件，而软件是可以修改的。如果足够大量的网络参与者同意这些更改并从修改中获益，更改就会实施。\n\n`Bitcoin`\
  \ 系统的去中心化管理涉及一个极其复杂的层级民主过程。这无法进行结论性的分析，这种尝试将超出本书的范围。尽管如此，我们希望在简短的介绍中讨论这个话题，并强调该系统最重要的决定因素。\n\
  \n在开始分析之前，我们想强调一个允许随时间演化的系统的根本重要性。一个严格静态的系统可能会导致灾难性的后果，甚至导致系统故障。例如，如果发现了一个只有在技术可修改的情况下才能修复的安全漏洞，大多数用户可能会认为这是调整软件的正当理由。然而，也可能存在更微妙的理由使得更改\
  \ `Bitcoin` 系统变得值得，例如扩展其功能范围、确保长期稳定性或整合新功能。\n\n此类更改的输入和提案通过各种去中心化渠道引入，并由任何人提交。关于这些想法应如何实施的问题通常会公开辩论。论坛和邮件列表是用于此目的的热讨论平台。`比特币改进提案`\
  \ (`BIP`） 进程是目前用于将抽象想法形式化的最重要的工具.^(\\[209\\]) `BIP` 必须使用强制结构制定，并必须包含说明为何需要改进的理由。此外，它们必须提供技术规范。\n\
  \n如果一个提案的争议大到无法达成普遍共识，就可以对其进行投票。只有矿工能够参与这些投票。矿工每当成功生成一个有效区块时就会提交一次投票.^(12) 如果一个提案在先指定的间隔内（例如在最后\
  \ 1,000 个区块内）达到了预设比例的“赞成”票，则将被接受。通常，提案的采用需要 55%、75% 或 95% 的多数批准率。\n\n然而，在去中心化系统中，没有人会被强迫遵守或实施投票结果。如果没有这种义务，任何分歧都将威胁到系统分裂，并允许分叉产生，即网络一部分选择实施更改，而另一部分选择继续运行旧版本。分叉产生竞争性的账本，根据各自的规则可以代表账本的长版本。\n\
  \n为了衡量此类争议的严重程度和恢复共识的可能性，必须区分 `软分叉` (soft forks)、`硬分叉` (hard forks) 和 `强制分叉` (forced\
  \ forks）（分别参见 图 2.12a、b 和 c）。`软分叉` 指新软件收紧了接受规则，使得新规则是旧规则的子集。因此，在新软件下有效的区块在旧软件下也会被接受有效，但大多数情况下反之不然。`硬分叉`\
  \ 指新软件拓宽了接受标准，使得旧规则成为新规则的子集。其结果是使用新软件创建的区块可能会被旧软件拒绝。相反，新软件始终会认为用旧软件生成的区块是有效的。\n\n\
  ![图 2.12 软件分裂（分叉）后的兼容性。](img/fig2-12.png)\n\n图 2.12\n\n软件分裂（分叉）后的兼容性。\n\n`强制分叉`\
  \ 使用完全不同的规则集，旧软件永远不会接受符合新规则的区块，反之亦然。因此，它始终将导致两个独立的区块链版本。\n\n### 框 2.4：软分叉和硬分叉的示例\n\
  \n`软分叉` 和 `硬分叉` 之间的差异可以通过讨论区块大小限制的变化来解释。\n\n减少区块大小限制是 `软分叉`，因为旧软件版本认为更新后由新版本软件生成的区块是有效的。因此，由新版本软件生成的区块链被旧软件认为是有效的。\n\
  \n增加区块大小限制是 `硬分叉`，因为旧软件版本认为更新后由新版本软件生成的某些区块是的。强制分叉既不向后兼容也不向后兼容，且无法消除。\n\n如 表 2.1\
  \ 中的插图所示，如果新软件占据主导，则 `软分叉` 将消除；即大多数网络计算资源采纳了它.^(13) 如果账本通过一个用旧软件生成的区块扩展，这确实可能会导致产生几个版本的账本；然而，新软件的主导地位通常确保账本增长得更快，并应用新规则。由于该账本在旧规则下也是有效的，一旦它成为区块链的长版本，所有参与者将迁移到该版本。另一方面，`硬分叉`\
  \ 只能通过旧软件的主导地位来解决。如果新软件能够胜出，将持续两个版本的账本：一个根据旧规则，另一个根据新规则。\n\n根据分配的计算资源，软、硬和强制分叉的账本版本发展情况。\n\
  \n表 2.1\n\n![](img/table2-1.png)\n\n\n\n\n\n如果可以使用软分叉（soft fork）来实现，软件升级将变得容易得多。通过软分叉，即使是未更新的网络资源也可以与新软件协同工作。然而，通过硬分叉（hard\
  \ fork），每个资源必须单独更新。任何运行未更新基础设施的人将无法参与网络。\n\n图 2.13 显示了某些著名的比特币分叉时间线。尽管发生过多次分叉事件，但替代账本版本的流行程度相对较低。\n\
  \n![图 2.13 比特币分叉时间线。](img/fig2-13.png)\n\n图 2.13\n\n比特币分叉时间线。\n\n只有矿工直接参与了此前考虑的关于比特币系统进一步发展的决策。比特币系统的其他参与者（如商户、用户或投资者）无论是通过明确投票还是解决分叉，都没有产生直接影响。因此，人们可能会认为政治过程是由少数利益相关者主导的。特别是，矿工可能拥有其不一定符合整个比特币系统利益的特定，这可能会引发对该过程可持续性的担忧。\n\
  \n在某种程度上，这些批评是有道理的。然而，如果假设比特币系统完全由矿工控制就是错误的。其他用户群体有多种方式可以影响开发并塑造比特币系统的未来。\n\n首先，所有参与者都有机会提交提案、参与政治话语并影响舆论。\n\
  \n其次，存在一种隐性的否决权。如果某项变更在违背其他利益相关者群体意愿的情况下实施，可能会产生系统性的不确定性和不稳定。这将对比特币单位的接受程度和市场价格产生负面影响，这等同于矿工实际经济收益的下降。`SegWit2x`\
  \ 是一个尽管得到了 80% 以上矿工支持但仍然失败的变更示例。由于担心分裂社区，六位发起者在一份联合声明中宣布该强制性分叉已取消.^(\\[23\\])\n\n\
  第三，许多变更需要硬分叉。如上所述，硬分叉要求每个资源都必须使用新软件进行单独更新。只有这样，商户、用户、网络节点以及所有资源才能支持共识协议的变更版本，并认为基于此的交易和区块是有效的.^(\\\
  [7\\]) 正因如此，即使有广泛的支持，实施硬分叉也是极其困难的。特别是，如果在违背非矿工网络参与者意愿的情况下强制硬分叉，矿工将面临运行一个没有任何用户或基础设施的替代账本的风险。\n\
  \n之前的讨论绝非结论性的。相反，它的目的是强调决策的复杂性，并说明参与这一过程的利益相关者比表面检查所暗示的要得多。特别是，矿工无法在违背网络其他部分意愿的情况下强制系统进化。这种复杂性导致了相对较少的变更和一个非常强大的基础层。\n\
  \n### 2.5.4 比特币历史上的重要事件\n\n#### 2009\n首批比特币交易完全是为了测试目的。比特币单位无异电子游戏币，没有任何真实的经济价值，并且通常免费转给新用户。\n\
  \n在这一年中，用户群不断扩大，交易数量也随之增加。2009 年中，每天记录了约二百笔交易，尽管比特币单位没有基本价值，但由于其数量有限以及对底层技术的着迷，价格实现了增长.^(14)\n\
  \n首次价格估算是在 2009 年 10 月 5 日进行的。根据当时创建过程的平均电力成本，比特币单位的价格约为 0.000764 美元.^(\\[160\\\
  ])\n\n#### 2010\n2010 年 2 月 6 日，`Bitcoin Market` 成为第一个允许比特币单位兑换当地货币的平台。首次市场交易于 2010\
  \ 年 3 月 17 日进行.^(\\[84\\]) 该服务同论坛和互联网相对聊天（IRC）频道对确定市场价格起到了作用。\n\n据记载的首次用比特币单位购买商品可以追溯到\
  \ 2010 年 5 月 22 日。比特币论坛用户`laszlo`在在线论坛上^(\\[137\\]) 同意支付 10000 个比特币购买两个披萨.^(15)\
  \ 此时无法直接购买，因为送餐服务不想接受任何比特币单位。在邀请招标四天后，`laszlo`找到了一个交易对手。用户`jercos` 使用他的信用卡支付了约 25\
  \ 美元购买披萨，并收到了比特币单位作为回报。\n\n`laszlo pizzas` 现在已获得了崇拜地位，是比特币价格历史上的一个重要参考点。这次交易标志着每单位比特币\
  \ 0.0025 美元（或四分之一个美分）的历史性汇率，并为以后使用这种加密货币进行更多商品购买奠定了基础.^(16)\n\n2010 年 7 月，价格上涨到每个比特币单位\
  \ 0.08 美元。当时，比特币交易所 `MtGox` 开始运营.^(\\[157\\]) MtGox 原计划被设计为一种（在线）幻想游戏的交易平台，^(17)，但在\
  \ 2010 年 7 月它转变为交易比特币单位的网站.^(18\\[163\\]]) 该平台很快拥有了较高的交易量，并实现了或具有代表性的价格形成。\n\n价格最终再次上涨，并在\
  \ 11 月 7 日短暂地达到了 0.5 美元的水平，但很快回落到 0.2 到 0.3 之间的数值。\n\n#### 2011\n随后是另一轮剧烈的价格上涨，使得在\
  \ 2011 年 2 月 10 日首次突破了美元平价。价格的上升与暗网平台 `Silk Road`（丝之路）的上线重合，这可能对比特币单位的早期价格发展产生了重大影响。网站于\
  \ 2011 年 2 月上线，允许商品和服务的匿名交易。丝之路演变成了一个各种非法物质和可疑服务的繁荣市场，比特币被用作唯一的支付方式.^(\\[56\\])\n\
  \n2011 年 6 月 10 日，比特币单位达到了 332 美元以下的新高。价格上涨在同月 `MtGox` 平台遭到黑客攻击后暂时结束。攻击者成功接管了 `MtGox`\
  \ 上的用户账户，并创建了刻意低价的销售订单.^(\\[163\\]]) 这对信心产生了重大的负面影响，可能是随后几个月价格下跌的决定因素之一。这一价格发展后来被称为“2011\
  \ 年大泡沫”。\n\n\n\n\n\n与此同时，Wikileaks 启动了比特币捐赠选项，允许志同道合的人士通过比特币单位来支持该平台。这一事件对比特币的价格发展产生了非常重要的影响，因为它展示了使用比特币单位的决定性优势。2010\
  \ 年底，在线支付服务 Paypal 终止了与 Wikileaks 的业务关系，从而严重阻碍了他们的募活动。比特币交易是无法被拦截的。这为 Wikileaks\
  \ 开启了独立的收入来源，同时也允许其支持者按照自己的意愿分配捐赠资金。\n\n### 2012\n5 月 9 日，美国联邦调查局（FBI）发布了一份报告，指出了比特币的危险性。同时，报告指出，比特币单位只是犯罪分子的另一种选择，不应期望比特币能取代现有的非法融资方案。报告还解释说，比特币交易并非匿名，在许多情况下可以识别犯罪分子的身份。该报告引起了媒体的巨大反响。\n\
  \n在这一年中，接受比特币单位的节点数量显著增加。大型支付服务提供商 Bitpay 在 2012 年 9 月 11 日宣布，已开始与全球 1000 多家公司合作，其中包括许多餐厅，以及牙科诊和殡仪等一些非寻常的公司。11\
  \ 月 15 日，大型国际活跃的公司 WordPress 也紧随其后提供了其博客托管服务。\n\n11 月 28 日，实现了一项重大的里程碑：`Block 210,000`\
  \ 被创建，首次支付了 25 个比特币奖励，而不是通常的 50 个比特币单位。所谓的“区块奖励减半日”标志着价格上涨期的开始，一些声音认为这一事件是价格飙升的原因。然而，从经济学角度来看，这一假设是令人怀疑的，因为增长率减半是可预见的，这种预期本应该已经反映在价格中了。\n\
  \n### 2013\n2013 年是比特币因其极的价格波动而吸引大量媒体关注的一年。比特币的市场价格在年初稳步上升，并在 3 月初突破了 35 美元的此前高点。\n\
  \n3 月中旬，一次软件错误导致账本出现临时分叉，引发了短期（日内）超过 20% 的价格下跌。然而，负面价格影响是短暂的。塞浦路斯的政治局势刺激了对政府范围之外替代投资的需求，价格在\
  \ 4 月 9 日突破了 200 美元关。当塞浦路斯的情况再次平息时，比特币价格大幅下跌。\n\n#### 因软件更新导致的硬分叉\n2013 年 2 月 19\
  \ 日，参考客户端 `Bitcoin Qt`（现称为 `Bitcoin Core`）的 `0.8.0` 版本发布。该更新修复了之前的版本导致少数情况下有效区块被拒绝的错误。因此，新版本扩大了接受范围。\n\
  \n由于并非所有矿工都迁移到了新软件版本，3 月 11 日发生了硬分叉。生成的一个区块被新软件接受为有效，但同时被旧软件拒绝。新版本的链占据了主导地位，但被旧软件版本认为无效。为了撤销硬分叉，一些大矿工回到了\
  \ `0.7.0` 版本，因此其链的增长速度比竞争版本 `0.8.0` 快。如表 2.1 所示，通过人为允许旧版本获得主导地位，并随后引导协调迁移到软件版本 `0.8.0`，是可以避免硬分叉的。\n\
  \n*a.* 发布说明可参考 BitcoinCore，“Bitcoin-Qt version 0.8.0 released,” 2013 年 2 月 19 日，https://bitcoin.org/en/release/v0.8.0。\n\
  \n5 月初，传言第一台功能齐全的比特币自动取款机（ATM）已在圣地亚哥安装。根据 NEWS10 ABC 的报道，该机器允许以美元买卖这种加密货币。随后事实证明，该\
  \ ATM 仅在发布会上展示过。第一台公共开放的固定比特币 ATM 于 2013 年 10 月 28 日在温哥华投入运行。这一引入非常成功；第一天的营业额就达到了五位数的（加）元。\n\
  \n10 月 2 日，丝绸之路（Silk Road）被 FBI 关闭，涉嫌网站管理员的 Ross Ulbricht 在旧金山的一个公共图书馆被捕。从那时起，该网站的复刻不断出现。比特币价格记录了约\
  \ 20% 的短期下跌，但在一天内恢复并开始再次上涨。\n\n一个多月后，美国参议举行了一场名为“超越丝绸之路：虚拟货币的潜在风险、威胁和承诺”的听证会。邀请了各种专家，讨论了虚拟货币单位的风险和潜力。听证会后的几天里，比特币价格飙升，并在\
  \ 11 月 29 日达到 1216.39 美元。听证会总体良好的进展以及法律确定性的第一步被认为是这种增长的主要原因。\n\n另一个经常被视为价格巨大上涨原因是中国投资者的巨大需求。这一理论特别受到了随后价格下跌的支持，并伴随着中国央银行在\
  \ 12 月 5 日的监管干预。个人面临更大的障碍，交易所受到更严格的监管限制，金融中介被禁止交易比特币单位。\n\n一些分析师假设，丝绸之路关闭和听证会带来的法律确定性增加，或是来自中国的高需求，并不是纪录价格形成。有迹象表明价格主要由最大交易平台\
  \ MtGox 上的欺诈操纵驱动。\n\n尽管年底出现了大幅下跌，但 2013 年比特币价格收盘仍是年初的 5400%。\n\n\n\n\n与此同时，关于 MtGox\
  \ 交易平台比特币提现问题的报告越来越多。2 月初，该平台实施了全面停止提现的措施。该措施的理由是所谓的`交易可变改性`（transaction malleability），这是一种可能导致交易在识别交易时出现困难的问题。当\
  \ MtGox 最终在两周后下线并申请破产时，许多人失去了大量的比特币单位。总而言之，MtGox 交易所消失了价值 5 亿美元的比特币单位。在随后的几个月里，出现了许多迹象，证明比特币单位的被盗与所谓的故障完全无关。\n\
  \n除了直接托管在该平台的约 850,000 个比特币单位的直接损失外，这些事件对整个比特币系统的声誉产生了深远的负面影响，尽管剩余的大型比特币公司发布了联合声明，但这种影响仍无法消除。对于许多人来说，比特币就是\
  \ MtGox。比特币在 2014 年损失了约 60% 的价值。\n\n## 2015\n\n1 月 4 日，关于中心化交易所的坏消息持续。`Bitstamp`\
  \ 平台遭到黑客攻击，价值约 510 万美元的比特币单位被盗。随后，价格进一步下跌 10% 至 270 美元，在经历了短暂的反弹后继续下跌，使得比特币在 1 月中旬的交易价格暂时跌破\
  \ 200 美元大关。\n\n在年开表现低迷后，比特币单位在今年三个季度的大部分时间里在 200 美元到 300 美元之间波动。这一年的特点是高额的风险投资。比特币公司\
  \ `21 Inc` 在 3 月收到了约 1.16 亿美元的风险资金，值得特别提及。仅在 2015 年 1 月至 10 月期间，公开的比特币和区块链公司风险投资总额略低于\
  \ 5 亿美元。另一方面，6 月初发布的最终版《纽约比特币许可证监管条例》（`New York BitLicense Regulation`）极可能对进一步的投资以及比特币单位的市场价格产生抑制作用。\n\
  \n10 月，价格出现剧烈上涨，将比特币单位的市场价格推至 400 美元以上。其他因素外，这种增长可能是由于中国更严格的资本控制以及欧洲法院在 10 月 22\
  \ 日关于增值税（VAT）豁免的决定驱动的。此外，由于关于中本聪身份的新传闻导致媒体曝光率增加，可能至少部分导致了这一上涨（见[框 2.2]）。\n\n比特币单位在\
  \ 2015 年以 430 美元的价格收官。\n\n### 框 2.6：对区块链技术的兴趣日益增加\n\n2015 年，包括瑞银、IBM 和纳斯达克在内的许多大型公司启动了各自的区块链技术研究项目。大多数情况下避开了\
  \ `Bitcoin` 这一词，转而使用诸如 `Ethereum` 或许可账本等替代性区块链。\n\n这些项目大多是证券交易和合同执行（智能合约）领域的流程优化项目，以及与备受赞誉的`物联网`（IoT）相关的可能应用。\n\
  \n人们对区块链技术的兴趣在多大程度上影响了比特币单位的价格目前尚待推测。一方面，这些应用增加了对该技术的兴趣；另一方面，替代区块链可能会损害比特币区块链的主导地位。\n\
  \n## 2016\n\n这一年以比特币价格的小幅低迷开始，随后被缓慢的上升趋势所取代。3 月和 4 月，`ShapeShift.io` 交易所平台的一系列黑客攻击吸引了媒体关注。该服务被一名员工破坏，随后遭到多次抢劫。总计有近\
  \ 200,000 美元的加密货币被盗。由于 `ShapeShift.io` 的业务模式，客户资产未受影响。在这些事件期间，比特币的价格表现保持相对稳定，缓慢的上升趋势持续。\n\
  \n5 月底，这一趋势在经历了 70% 的爆发式增长后达到顶峰。随后是回调，直到 6 月价格稳定在 600 美元到 700 美元之间。价格上涨的可能因素包括英国公投带来的市场不确定性，以及\
  \ 7 月的比特币减半事件（`Bitcoin Halving Event`）。\n\n6 月 18 日，在公投决定前不久，比特币实现了 780 美元的最高价格。\n\
  \n8 月初，大型香港交易所 `Bitfinex` 遭到成功攻击，600 万美元的比特币单位被盗。当抢劫案传出时，比特币价格已经处于下降趋势。可以假设黑客攻击对价格持续产生负面影响，并抑制了任何回调的可能性。价格一度大幅跌破\
  \ 600 美元。\n\n当第一波恐慌过去，且明确 `Bitfinex` 可以避免破产后，稳定的上升趋势开始。价格上涨可能受到美国总统大选不确定性以及中国活跃的推动。\n\
  \n## 2017\n\n在 2017 年，比特币被推向了前所未有的全球焦点。价格剧增，许多其他区块链活动开始形成。每个人突然谈论区块链和加密货币。年初，比特币价格约为\
  \ 1,000 美元。12 月 17 日年底，比特币交易价格为 19,500 美元。\n\n尽管比特币始终是主导加密资产，但作为第二大公共区块链的 `Ethereum`\
  \ 对 2017 年的热潮贡献更大。`Ethereum` 是一个无许可智能合约平台，比比特币更具活性。特别是它允许任何人轻松地创建所谓的代币——即可以在 `Ethereum`\
  \ 区块链上交易的新加密资产（见第 7.2 节）。\n\n虽然在比特币基础层创建代币的方法（彩色代币 `colored coins`）或通过额外层（`Mastercoin`/`Omni`）已经存在了一段时间，但在\
  \ 2017 年，得益于基于智能合约的代币，代币的发行和处理变得简单得多。通常被称为 `ERC-20` 的智能合约标准可以在几分钟内创建这些代币。创业者（不幸的还有许多骗子）开始通过所谓的首次币发行（ICO）发行并销售代币，承诺它们未来可用于某种用途，或使所有者获得某种收益流——即股利或利息支付。这些代币变得非常受欢迎，许多投资者并不知道其中的风险。\n\
  \n\n\n代币销售的活跃活动导致了对 `Bitcoin` 和 `Ether` 需求的增加²²。在大多数情况下，人们必须先购买 `Bitcoin` 或 `Ether`\
  \ 才能参与代币销售。此外，当有人想在交易所上出售代币时，此人通常用 `Bitcoin` 或 `Ether` 来出售这些代币。`Ether` 的价值在 2017\
  \ 年增长了超过 13000%。\n\n因此，`Bitcoin` 以及更广泛的加密资产的存在越来越受到商业银行、中央银行和金融监管机构等金融机构的关注。价格的惊人增长随后在\
  \ 2018 年崩盘，这一事实仅仅加速了讨论。现在可以说，大多数个人和机构对 `Bitcoin` 都有自己的观点。“Bitcoin”这个词可能已经成为今天最为人知的“品牌”之一。\n\
  \n交易费用在整个 2017 年期间增加，并在年底达到了双位数美元的峰值。一种解释无疑是 `Bitcoin` 交易需求增加。高费用仅仅是费用市场运作的结果。这种增加引发了主导全年大部分时间的扩展性辩论（参见\
  \ section 6.2）。主要的提案是隔离见证 (`SegWit`)，为网络二层扩展做准备以及各种形式的区块大小增加。此外，还有一项提案试图通过将 `SegWit`\
  \ 与区块大小增加相结合在社区内达成共识。这项提案被称为 `SegWit2x`——`SegWit` 激活加上区块大小增加。\n\n7 月 21 日，`SegWit`\
  \ 通过软分叉成功激活。这是在经过大量讨论和长时间的不确定期之后发生的。不久后，在 8 月 1 日，社区的少数成员决定增加区块大小（同时进行其他更改），从而创建了\
  \ `Bitcoin Cash` 或 `B-Cash` 强制分叉。`SegWit2x` 提案已于 2017 年 11 月撤回（参见 section 2.5.3）。\n\
  \n# 2018\n\n2018 年是清算之年。货币历史上最美丽的价格泡沫之一破灭了。`Bitcoin` 的价格在 2018 年 12 月 15 日达到约 3200\
  \ 美元的低点。大多数 ICO 代币和其他加密资产的价格遭受了更为惨烈的打击。这些资产的典型低点比历史高点低了约 90 到 95%。\n\n价格下跌也影响了公众讨论。许多专家出现，声称\
  \ `Bitcoin` 和整个加密资产领域没有未来。例如，2018 年 10 月，Nouriel Roubini 表示“Bitcoin 是‘所有骗局之母’，区块链是史上最炒作的技术。”^[61]\
  \ 摩根大首席执行官 (CEO) Jamie Dimon 也因抨击 `Bitcoin` 而闻名[236]。他因说过“Bitcoin 是一个骗局”，最终会“爆炸”，并且“任何交易比特币的交易员”都会“因为愚蠢而被开雇”。许多\
  \ ICO 根本就是骗局，这对于加密领域的声誉没有帮助。薄弱的团队、糟糕的想法泛滥。\n\n\n\n\n# II 技术分析\n\n3. 正如后文所示，哈希值（参见第\
