  \ https://fred.stlouisfed.org。\n\n美国货币基础增长率的极高波动性引人注目。相比之下，比特币的货币供应在图表后半部分的增长率相对平滑。然而，比特币的价格波动性远大于美元的价格波动性（见第\
  \ 6.1.3 节）。\n\n### 6.1.2 比特币是通缩的吗？\n\n比特币数量限制使其成为一种稀缺资源，并是一个潜在有趣的价值载体。它可能导致这样的情况：对比特币单位的总需求不断增加，而遇到恒定的供应。^(2)\
  \ 从理论上说，这可能导致比特币价值大幅增加，这也是比特币长期来看可能是通缩性的原因。\n\n因此，许多用户坚信比特币的价值将永远增加。这种信念需要受到挑战。比特币没有内在价值。它不能被消费或用于生产，也不会产生现金流。一个没有内在价值的资产，其价格完全取决于对其未来的预期。只有当买家假设该单位以后至少以同样的价格卖出时，他/她才愿意购买一个比特币单位。^(3)\n\
  \n现代货币理论的一个关键见解是，没有内在价值的货币有许多均衡价格。[102]。其中一个始终为零。如果所有市场参与者都预期比特币在未来将没有价值，那么今天没有人将愿意为它付钱，产生的市场价格将为零。正价也可以是一个均衡价格。例如，如果代理人相信比特币明天的价格将为\
  \ 100 万美元，他们愿意在今天支付 100 万美元（假设不打折），因此今天的均衡价格将是 100 万美元。\n\n#### 框 6.1 比特币是数字黄金吗？\n\
  \n比特币的一种潜在用途是作为避险资产。在这种背景下，比特币经常被称为“数字黄金”。许多经济学家反对这种观点，因为比特币是可以被复制的。228]。如果比特币可以很容易被复制，那么它如何能作为价值存储呢？由于区块奖励是恒定的，而货币基础在不断增长，导致了随时间推移增长率降低。其次，区块奖励的定期减半进一步降低了增长率。这种突然下降的例子可以在\
  \ 2012 年底。\n\n### 6.1.3 波动性分析\n\n资产要作为交换媒介或价值尺度有用，需要具有低波动性。低波动性反过来需要其供应是弹性的。各国银行通过调整供应来稳定其货币价值。事实上，联邦储备系统通过适应总需求的变化来提供弹性。比特币与这些政府货币的区别在于缺乏稳定机制。比特币的总需求由价格预期驱动，而这些预期以不可预测的方式对新闻、情绪和传言做出反应。由于比特币供应是固定的，其价格波动性很高。\n\
  \n表 6.1 总结了比特币的价格波动性。该表显示了 2009-2018 年的最低价格，以及日收益率的年化波动率。波动性很大，但随着时间推移正在缩小。\n\n\
