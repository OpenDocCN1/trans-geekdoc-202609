  \ 100% 时，它才需要更多资源。\n\n# 7 进一步应用\n\n比特币区块链提供了一个能够实现许多非货币应用的基础。例如，在 2014 年，风险投资公司\
  \ Ledra Capital 发布了一份包含 84 种区块链技术用例的列表.^(\\[138\\])。然而，涵盖特定行业并非本书的范畴。相反，我们希望让读者熟悉核心概念，这些概念凸显了公链区块链的优势，并展示了如何以行业的方式使用它们。因此，以下示例代表了技术的潜力，但绝非详尽。^(1)\n\
  \n此外，我们刻意将注意力限制在非货币应用上。如物联网（IoT）背景下的`machine-to-machine payments`、稳定币或全球微交易等货币创新在之前的章节中已经讨论过。\n\
  \n## 7.1 去中心化验证与证明\n\n比特币区块链可以被看作是一个以去中心化的管理的公共公告板。它可以用于保护任何类型的信息。与普通的公告板不同，这些信息随后无法被删除或更改。信息被添加到区块链的时间会与信息以及作者的伪名一起记录下来。\n\
  \n空数据交易可以通过 `OP_RETURN` 操作码包含任何信息（参见第 4.5.5 节）。虽然添加的数据尺寸较小，但足以包含一个哈希值（参见第 4.2 节）。一旦哈希值被添加到区块链，就无法删除或更改。不可更改的哈希值允许任何人证明数据的存在性、真实性和完整性。\n\
  \n### 7.1.1 存在性\n\n所谓的“存在证明”（proof of existence）证明了某个文件在特定时间点存在过。该文件不需要公开。对于存在证明，只需计算其哈希值并将其包含在交易中即可。最终，交易将在区块中确认，并从而链接到特定的时间点。\n\
  \n让我们假设，例如 Michèle 受一家公司委托制定新的业务战略。完成工作后，她向公司管理层展示了她的想法，并提供了一份包含她计划的文件。为了防止经理们在未来的某一天声称她的想法是内部开发的，Michèle\
  \ 可以将草稿的哈希值添加到区块链中。这将允许她证明在区块添加到区块链的那个时间点，她的论文已经存在了。她可以将草稿公开给任何第三方，从而使他们能够计算并验证其哈希值，证明该值与区块链中记录的哈希值相符。\n\
  \n加密哈希函数（参见第 4.2 节）使得在计算上生成具有特定哈希值的文档变得不可行。这意味着匹配的哈希值足以证明某个文件在其哈希值记录在区块链上时存在过。尽管存在证明不提供等同于专利的法律保护，但它有许多有趣的应用领域。\n\
  \n### 7.1.2 完整性\n\n另一个可能的应用是保护数据的完整性。例如，如果有人希望确保合同内容不被更改，他们可以将合同的哈希值嵌入区块链中。合同的任何更改都将不可避免地导致其哈希值的变化，使其不再与区块链中记录的哈希值对应。因此，任何操作都将显而易见。\n\
  \n这种保护数据的方法可以集成到业务流程中。例如，与控制和合规相关的文档哈希值可以定期添加到公共区块链中。由于哈希值不会显示内容，文档的机密性得到了保证。\n\n\
  ### 7.1.3 真实性\n\n如果可以将一个公钥与公司、组织或个人关联，那么就可以验证文件的真实性。如果文件的哈希值由某个组织签名，则可以假设该文件是由该组织签发的。\n\
  \n在一个联合项目中，巴塞尔大学和 BlockFactory 开始在公区块链上保护学术凭证.^[201,98\\]）通过区块链课程的学生将获得可验证的证书。当潜在雇主收到文件时，他们可以计算其哈希值，并检查巴塞尔大学是否将其添加到区块链。因此，潜在雇主可以基于区块链验证证书的存在性、真实性和完整性。这种方法大大降低了伪造证书在无人察流通的风险。加密安全的哈希值（以及证书创建过程随机性）确保了尽管区块链是公开的，数据保护并不是问题。(2)\n\
  \n## 7.2 代币与彩色币\n\n比特币区块链仅允许原生比特币单位交易。然而，由于比特币网络的脚本语言允许附加信息，可以将支付承诺附加比特币片段上。比特币片段仅作为封装，允许承诺在比特币网络上进行交易。\n\
  \n此类比特币片段的经济价值源于附加的承诺。当然，此类承诺面临发行风险。如果发行承诺的一方无法或不愿履行，承诺没有任何价值。比特币区块链无法执行这种外部承诺；它只能跟踪谁拥有比特币片段。\n\
  \n所谓的“彩色币”（colored coins）是带有代表支付承诺的额外数据的比特币片段。例如，彩色币可以承诺发行者将在 2030 年 12 月 31 日向所有者支付\
  \ 1000 美元。根据发行者的信誉、信用评级和声誉，市场将赋予该比特币片段额外价值（参见第 1.4 节）。\n\n附加数据可以包含任何类型的承诺。贵金属、公司股票或债务只是少数例子。基本上，任何类型的资产都可以这种方式在比特币区块链上形成和交易。从技术上讲，比特币区块链因此可以作为记录和跟踪各种所有权的基础设施。\n\
  \n\n\n\n虽然彩色币（colored coins）在比特币早期具有一定重要性，但现在很少使用了。它们已被主要在以太坊区块链上创建的`tokens`（代币）所取代。这些代币通常基于\
  \ `ERC-20` 代标准。彩色币与代币的主要区别在于，代币是通过所谓的 `token contracts`（代币合约）发布的。`Token contracts`\
  \ 是管理在区块链上的数据库。\n\n尽管 `ERC-20` 目前是最常用的代币标准，但我们想提到还有许多替代方案。在以太坊区块链上，例如 `ERC-223`\
  \ 和 `ERC-777` 标准解决了在传输 `ERC-20` 代币时可能出现的一些问题，而 `ERC-721` 代币标准允许发行收藏品等非同质化资产。在以太坊生态之外，NEO\
  \ 提供了 `NEP-5` 代币标准。许多区块链都有自己的代币标准。由于脚本语言的限制，比特币区块链上无法实现代币合约。然而，在比特币侧链或二层网络（如 `Liquid`、`Rootstock`\
  \ 或 `Omni`（原 Mastercoin））上发行代币是可能的。表 7.1 显示了各种代币标准的流行程度。我们仅包含了已列出的代币。\n\n### 表 7.1\n\
  每个平台的列出代币。\n\n![](img/table7-1.png)\n\n## 7.3 智能属性\n\n`Smart property`（智能属性）是一种外部的非原生承诺，它附加在比特币碎片上或作为代币发行，从而能够在区块链上进行交易。然而，“智能属性”一词仅限于物理对象；即动产和房地产。`Smart\
  \ property` 将物理对象的使用与加密签名绑定。物理对象会向想要使用它的人发送一个加密挑战，只有当该人员能够解决此挑战时才授予访问权限。\n\n此类对象的常见例子是智能汽车。只有当某人证明拥有私钥的所有权时，车门才会打开，引擎才会启动，该私钥属于当前控制该资产彩色币或代币的地址。\n\
  \n基于类似加密原理的关键系统今天已在使用。然而，加密挑战通常是静态的，这意味着它们与特定的密钥对绑定。销售意味着必须物理上将密钥交给新所有者，这带来了卖方可能复制密钥的风险。有了区块链技术，所有者可以选择一个新密钥，这种选择允许汽车进行虚拟交易。此外，它还能授予临时访问权限，为共享经济创造新的业务模式。\n\
  \n尽管智能属性的所有权不受交易对手风险的影响，但它需要一个运行良好的法律系统。对对象的任何物理保护都可以通过暴力手段破解。类似于机械房门，加密锁仅是部分有效的访问屏障，还需要法律系统的额外保障。此外，如果物理访问被拒绝，尽管通过加密保证了所有权的变更，物理对象也将无法为新所有者提供任何价值。\n\
  \n#### 框 7.1：彩色币和代币导致的失衡\n比特币和以太坊单位由一个简单但复杂的激励系统保护。当价格上涨时，矿工的实际报酬会自动增加。结果是算力也会之上升，这将使区块链更加安全。相比之下，当非原生资产附加到比特币区块链时，其安全性要求会增加，但矿工的报酬保持不变。因此，从理论上讲，彩色币和代币会导致矿工报酬与攻击激励之间产生失衡。\n\
  \n## 7.4 区块链合约（智能合约）\n\n在定义 `blockchain contract`（区块链合约）这一术语时，存在大量相互矛盾的尝试。更令人混乱的是，更流行的术语\
  \ `smart contract`（智能合约）具有误导性。因此，我们将重点关注一个最小且非常广泛的定义，仅涵盖大多数现有文献认可的术语方面。\n\n区块链合约或智能合约是脚本序列，将至少一个结果与特定的需求和/或事件相关联。这些序列的完成由区块链（即账本和共识协议）提供保障。\n\
  \n### 7.4.1 UTXO 作为区块链合约\n\n根据这个定义，每个未花费的交易输出 (`UTXO`）都可以被视为区块链合约。每个交易输出都受到解锁条件的保护。第一个提交解决方案的人可以自由处置绑定到该输出的比特币单位。\n\
  \n`UTXO` 合约的具体条件取决于脚本。`Pay-to-public-key`（向公钥支付）和 `pay-to-public-key-hash`（向公钥哈希支付）需要一个满足特定要求的私钥签名。`Multisig`（多重）需要\
  \ `m`-of`n` 个签名，而 `pay-to-script-hash`（向脚本哈希支付）允许在构建合约方面具有一定的灵活性。有关解锁条件的细节细节见第 4.5\
  \ 节。重要的是，`UTXO` 满足区块链合约的定义，许多简单合约可以使用这些标准脚本部署在比特币区块链上。\n\n### 7.4.2 状态机和合约账户\n\n\
  尽管 `UTXOs` 符合我们对区块链合约的定义，但许多人认为比特币不支持智能合约。为了理解这一说法的来源，我们必须分析比特币与以太坊等更复杂的区块链实现之间的差异。\n\
  \n以太坊在许多方面与比特币相似。它是一个分布式公共账本，目前采用工作量证明共识协议。交易使用私钥签名，在网络中传播，并最终在区块中确认。然而，存在一些关键差异。\n\
  \n以太坊不使用比特币的 `UTXO` 模型，而是依赖账户。每个账户要么由私钥控制（外部拥有账户 `EOA`），要么由代码控制（合约账户 `CA`）。`EOA`\
  \ 与比特币地址没有太大区别。虽然存在一些技术差异，但在直观层面工作方式相似。控制地址私钥的人可以从该账户进行转账。`CAs` 更复杂，在比特币系统中并不存在。`CA`\
  \ 是一个不受私钥控制的账户，而是由其字节码管理的。它由 `EOA`（或其他 `CAs`）通过传播包含代码的合约创建交易来部署。一个简单的例子是接受支付并根据预定义的（预编码的）分配计划立即转发资金的合约。\n\
  \n\n\n\n\n这无疑是一个非常简单的智能合约（CA）示例。得益于以坊的图灵完备性及其存储和操作状态变量的能力，可以设计更复杂的 CA 来管理整个组织、复制复杂的金融工具或创建去中心化市场。即使是第\
  \ 7.2 节提到的代币合约也是基于 CA 的。灵活性释放了巨大的潜力。然而，复杂性的增加也引入了新的攻击向量，并可能使系统更加脆弱且难以维护。灵活性带来的收益是否能大于潜在的安全权衡，仍有待观察。\n\
  \n### 7.4.3 交易设计与链下合约\n\n通过巧妙的交易设计，可以显著扩展区块链合约的范围。在第 6.2 节中我们学习了微支付背景下状态通道的使用。类似的概念也可以应用于其他用例。尽管目标可能差异很大，但这些合约都依赖于巧妙的交易设计，以及在发生冲突时利用区块链进行争议解决的可能性。\n\
  \n我们有两个使用交易设计在合约进入区块链之前对其进行模拟的例子：“条件购买协议”和“抵押贷款”。我们现在介绍这些合约。\n\n#### 条件购买协议\n\n\
  我们从条件购买协议开始分析，并考虑一个特定示例：Claudia 想要用比特币单位从 Jake 手处购买一个彩色币（colored coin）。此外，我们假设该彩色币是由作者发布的，并且可以兑换成这本书的实体副本。\n\
  \n这种交易对双方都带有某些风险。Claudia 希望 Jake 先交出彩色币，但 Jake 想要先收到 Claudia 的比特币单位。在传统系统中，这类问题通过中心化服务解决，该服务临时持有付款，并在承诺的货物交付后释放资金。在公有区块链的背景下，这种问题的中心化解决方案是不令人满意的。相反，有一种替代方法，能够以更优雅的方式解决这个问题。\n\
  \n这两笔交易可以合并到单个比特币交易中，利用比特币交易要么完全执行、要么不执行的特性。这消除了其中一方获得两个对象所有权的可能。从技术上讲，条件购买协议是通过具有两个输入和两个输出的交易来实现的。\n\
  \n在示例中，Claudia 首先生成包含所有输入和输出的交易“封装”（wrapper）。第一个输入包含 Claudia 必须传输给 Jake 的比特币单位。第二个输入引用\
  \ Jake 的彩色币。新创建的输出将比特币单位锁定给 Jake，将彩色币锁定给 Claudia。在第二步中，Claudia 对交易进行签名，从而通过比特币单位满足了第一个输入的解锁条件。请记住，此时交易尚未有效，因为两个不可分割的输入中只有一个包含有效签名。只有当\
  \ Jake 也对交易进行签名，使得两个输入都包含有效签名时，比特币网络才会认为该交易是合法的。随后，比特币单位和彩色币的转移将作为同一笔交易的一部分同时执行，有效地消除了交易中的任何对手风险。\n\
  \n#### 抵押贷款\n\n让我们考虑一种情况：Claudia 想要申请比特币贷款，而 Brian 愿意提供抵押贷款（（[110,207\\]）。Claudia\
  \ 的抵押品是一种加密资产；例如可以在比特币区块链上交易的彩色币。\n\n与上一个例子类似，条件购买协议可能会有问题，因为抵押品的价值通常高于贷款金额。在这种情况下，Brian\
  \ 会有留住抵押品的倾向。Claudia 注意到了这个问题，因此只有在满足以下条件下才会同意此类合约：只要她按时偿还贷款，就能重新获得抵押资产的所有权。这种情况是持扣问题（hold-up\
  \ problem）的经典例子。\n\n幸运的是，这个问题有一个技术解决方案，可以通过巧妙链接比特币系统的各个组件来实现。第一步，Claudia 和 Brian\
  \ 共同生成一个 2-of-2 多签名地址，随后称为 `M`。该地址作为一个去中心化的托管账户，共同维护双方的安全保障，类似于一个具有共同签名的共享账户。在 Claudia\
  \ 将彩色币转移到新地址之前，必须采取几个后续步骤以确保贷款交易顺利处理。\n\nClaudia 生成了一笔将彩色币从 `M` 转移到 Brian 的交易。她在其中嵌入了时间限制（`nLockTime`），防止交易在特定日期之前被确认。然后，她对交易消息进行签名并发送给\
  \ Brian。只有在指定的日期 `t` 到达，比特币网络才会处理该交易，届 Brian 可以添加签名并成功将交易广播到网络。\n\n在第二步中，Brian 生成了一笔将彩色币从多签名地址\
  \ `M` 转移到 Claudia 的交易。此外，交易包含第二个汇入 Brian 比特币地址的输出。这个第二个输出设置为等于贷款金额，其格式使得可以使用任何总和等于该金额的输入（参见第\
  \ 4.6 节）。然后他对交易消息进行签名并发送给 Claudia。在这里，只有当 Claudia 为交易补充总和等于相应金额的输入并共同签名消息时，比特币网络才会处理该交易。\n\
  \n在第三也是最后一步中，双方生成并签署了基于两个输入和两个输出的交易，将彩色币转移给 M 并将贷款转移给 Claudia。\n\nClaudia 现在随时完成交易并将其广播到比特币网络。如果她这样做，Brian\
  \ 将收到贷款还款（包括利息），Claudia 将重新获得她投入的抵押品。如果 Claudia 未能在指定日期还款，Brian 可以通过共同签名完成第一笔交易消息，并按意愿使用抵押品。\n\
  \n### 7.4.4 预言机（Oracles）\n\n区块链可以轻松处理原生数据。然而，如果合约包含了取决于外部数据的条件，情况就会变得复杂。外部数据的例子包括体育赛事、股票价格或气象观测。这些数据点显然无法在链观测，需要所谓的“预言机”（`oracles`）——即提供数据的接口。\n\
  \n虽然这类数据的提供为许多有趣的应用（如博彩或保险合约）提供了可能，但执行过程取决于预言机。因此，这很难说是去中心化的。\n\n使用预言机的合约可以通过多种方式实现。例如，合约双方双方都可以将合约中约定的价值单位转移到预言机的地址，并记录释放交易必须满足的精确条件。这种类型预言机的组织结构实际上是一个控制资产和合约执行的中心化机构。在这种情况下，预言机拥有单方面决定合约结果的权力，同时也对资产拥有控制权。\n\
  \n\n\n\n\n这种如此天真的实现方式会导致以下四个问题：^[144]\n\n- 1. 预言机提供了一个中心攻击点，从而削弱了比特币系统的主要优势。\n-\
  \ 2. 预言机采集数据的方法及其决策过程可能不透明，并可能交付错误的结果。\n- 3. 预言机可能在合约处理之前消失。如果托管预言机的服务器无法访问，就会发生这种情况。此外，如果丢失私钥，资产将锁定在一个永远无法处理或执行的合约中。\n\
  - 4. 预言机可能被腐败。人们可以通过提供贿赂来影响合约执行或扣留资产。\n\n使用 2-of-3 多签名地址的实现提供了略微较好的保护水平。在这里，三个私钥分布在两个合约双方和预言机之间。在这种设置下，合约执行仍然依赖于单一的中心化服务。因此，预言机仍然可以独家地决定合约的结果，但它不再拥有扣留或剥夺资产的权力。这种限制防止了预言机（例如）将比特币单位发送到完全不同的比特币地址。此外，两个合约双方都可以尝试达成一致并共同管理锁定的资产。如果由于某些原因无法联系预言机，则可以从预言机的托管中取回比特币单位。这种实现完全解决了问题\
  \ 3，部分解决了问题 4。\n\n更好的解决方案是使用多个预言机——例如，七个预言机和一个 8-of-15 多签名^[4] 解锁条件。两个私钥分别分配给两个合约双方。另外七个密钥由预言机所有。之前实现的两个优势也适用于这里。如果超过一半的预言机不可用，两个合约双方仍然能够释放资产。另一方面，预言机并不控制资产，因此无法没收。这种部分去化使得腐败变得更加困难，并消除了与单一攻击点相关的漏洞。从理论上讲，预言机仍然可能串通并改变结果。然而，这将需要大量的第三方合作并承担其声誉风险^[144]。\n\
  \n要实现这种具有 `m`-of-`n` 多签名解锁条件的系统，只要满足以下约束条件，就可以自由修改预言机的数量。两个合约双方各持有一个 `images/pg233-in-1.png`\
  \ 私钥。此外，还有 `m` − `1` 个预言机，每个持有一个私钥。这种类型的实现通常涉及 `m`-of-2`m` − `1` 多签名实现，但限制是 `m`\
  \ 必须对应偶数。\n\n使用预言机可能被看作是违背区块链合约的初衷。考虑到可能的应用极其多样且有趣，这些类型的合约仍然有光光的前途^[10]。\n\n## 7.5\
  \ 练习\n\n**练习 7.1：** 在编写此书的过程中，作者利用比特币区块链来保护他们的观点和文本。请概述保护此类信息需要遵循的步骤，并识别作者从中获得的益处。\n\
  \n**练习 7.2：** 请给出示例，说明以下每种非货币类比特币区块链应用的使用场景：(1) 存在证明（proof of existence），(2) 完整性证明（proof\
  \ of integrity），以及 (3) 真实性证明（proof of authenticity）。\n\n**练习 7.3：** 解释彩色币（colored\
  \ coins）和代币（tokens）背景下的对手风险概念。\n\n**练习 7.4：** 根据定义，智能属性（smart property）不受其经典意义上的对手风险影响。解释你在何处看到了潜在风险，以及智能属性与比特币等原生协议资产何不同。\n\
  \n**练习 7.5：** 列举几个区块链合约的例子，并识别区块链合约处理与非区块链处理过程相比的优势。\n\n**练习 7.6：** 解释为什么基于外部情况的合约只能部分被视为区块链合约。\n\
  \n1. [1]。有些人对区块链技术用例持不那么乐观的态度^[5]。\n2. [2]。存在基于比特币区块链的类似项目。例如，尼科斯亚大学使用比特币区块链来保护数字货币硕士讲座序列的学位证书^[219]。\n\
  3. [3]。人们对这些代币（tokens）的兴趣在 2017 年和 2018 年初飙升，当时所谓的首次代币发行（ICO）或代币销售热度大幅增加^[166]。遗憾的是，这些代币中许多完全没有用处，有些甚至是纯粹的骗局。\n\
  4. [4]。记录在一种支付给脚本哈希（pay-to-script-hash）的解锁条件中。\n\n# 8 比特币的实用指南\n\n在本章中，我们将提供关于如何开始使用比特币的一些实用建议。我们将考虑获取和保护比特币单位的几种可能性，并指出用户应该避免的一些风险和错误。之后，我们将讨论如何使用比特币单位进行支付和接收付款。\n\
  \n**免责声明。** 加密资产具有高度投机性，可能导致用户资本的全部损失。所进行的所有活动——如加密资产的获取、处理和保护——均由读者自行承担风险。作者对任何损失不承担法律责任——包括直接遵循本书描述而导致的损失。此内容非财务/投资建议。\n\
  \n## 8.1 获取\n\n为了获得比特币单位的经验，必须首先获取它们。有很多方法可以实现，大致可以分为三类：你可以 (1) 寻找一个愿意赠送你比特币单位的人，(2)\
  \ 尝试通过挖矿获取，或 (3) 购买。\n\n### 8.1.1 赠送\n\n一些比特币所有者愿意给你一些比特币单位用于测试。与比特币用户接触的好场所是聚会、会议和关于比特币主题的演讲。然而，要小心。有很多人试图诈骗你。特别是，不要相信承诺要赠送大量资金的人。\n\
  \n如果你只是想获得经验，可能还想考虑比特币的测试网络。通过所谓的水龙头（faucet），你可以获得没有价值的测试币，但它是测试和获取经验的很好的选择。\n\n\
  ### 8.1.2 挖矿\n\n比特币初学者通常认为挖矿是获取比特币单位的自然活动。然而，在许多情况下，这是一种极不利的获取方法。挖矿市场在过去几年发生了巨大变化并变得专业化。处理器（CPU）和显卡（GPU）已被专用集成电路（ASIC）芯片取代。这些芯片专为比特币挖矿开发，主要由大型挖矿作业使用。这些公司根据规模效应、低电价和低冷却成本建立了竞争优势。\n\
  \n\n\n\n硬件产品生命周期短是另一个问题。这使得所购硬件很难实现摊销。旧的矿机设备通常在在线拍卖场上以荒谬的高价挂出。在购买硬件之前，建议用户确认购买该设备是否具有成本效益。任何利润计算都应该基于实际价格进行，且不考虑可能的投机性利润。如果按照当前价格挖矿并无法获利，那么直接购买比特币单位比挖矿更有利。\n\
  \n总结一下：对于大多数人来说，比特币挖矿仅建议用于教育。\n\n## 框 8.1：云矿\n\n某些服务提供商允许投资者购买矿矿设备的股份。相应的提供商负责供应和维护硬件。投资者获得部分挖矿收益。作为回报，提供商会收取股份证书的一次性固定费用以及一项周期性费用，后者用于涵盖硬件维护和电费成本。某些提供商还会收取会员费。\n\
  \n我们强烈建议不要购买任何云矿股份。云矿通常只对提供商有利。其收益分配往往不透明，且投资者对物理硬件没有控制权。在许多情况下，硬件甚至根本不存在，系统是以庞骗局的形式运行的。\n\
  \n### 8.1.3 购买\n\n### 外交易 (OTC)\n\n比特币单位可以通过双边交易从个人或公司购买。此类购买被称为场外交易（`OTC`）交易，可以通过面对面会议或通过任何类型的通信渠道进行结算。自然地，在这两种情况下都必须采取适当的预防措施。\n\
  \n定期的比特币活动（所谓的比特币线下聚会）是购买小额资金的良好起点。在进行此类购买之前，至关重要的是要检查当前的汇率。此外，要坚持交易包含可接受的交易手续费，并等待至少一次确认，以降低双重花费的风险（见阅\
  \ [第 5.3.5 节]）。对于较大金额，建议等待多次确认。通常三到六次确认被认为足以确保交易的不可逆转性。这平均需要三十到六十分钟。对于小额资金，一次确认就足够了。\n\
  \n对于不涉及面对面会议的购买，强烈建议使用信誉良好的平台。信誉良好的平台提供声誉系统并履行受托角色。可以安排面对面进行现金支付，也可以使用电转账进行交易。在电转账的情况下，应当考虑到某些商业银行会无缘故拦截备注中提及“Bitcoin”或“crypto”的付款。这个问题根深蒂固，以至于某些银行甚至拒绝为官方监管的比特币公司提供账户。\n\
  \n通常情况下，你可以在不证明身份的情况下购买小额比特币单位。然而，对于较大金额，卖家有义务履行所谓的“了解你的客户”（`KYC`）规定，该规定要求必须对客户进行身份识别。\n\
  \n## 框 8.2：永远不要购买私钥\n\n永远不要从他人购买私钥。该人员可能拥有该密钥的副本，因此能够控制相关的比特币单位。因此，合法的 `OTC` 购买必须始终通过比特币区块链交易进行，将比特币单位记入你的比特币地址之一。\n\
  \n为了确保你对相应的私钥拥有专属控制权，你必须亲自生成密钥/地址对。通过他人告知或传输给你的私钥是不安全的。\n\n如果某人希望在你安装钱包或客户端时为你提供帮助，你必须防止此人看到你的密钥或你的助记词种子（见\
  \ [框 4.3]）。这些信息的泄露可能导致你比特币单位的完全损失。\n\n### 中心化交易所平台\n\n获取比特币单位最常见的方法是在许多中心化比特币交易所之一购买它们。用户只需开户，然后将法币转入其中。账户持有人随后可以使用这些资金购买比特币单位或许多其他加密资产之一。大型交易所的定价具有竞争性，买卖价差相对较小。大多数交易所提供加密货币订单簿和相对先进的金融工具，使交易过程变得透明。然而，仍然建议比较各种费用结构，并对特定交易所的业务惯例和声誉进行研究。特别是在选择中心化交易所时，还应该考虑交易量、提供的服务和安全性。\n\
  \n最重要的是，中心化交易所的用户必须意识到，他们并不控制其资产的私钥。这可能导致重大的安全问题（见 [第 8.2.2 节]）。因此，建议用户尽快将其加密资产转移到他拥有专属私钥控制的的地址之一。\n\
  \n一些中心化交易所拥有完全合规的注册流程，且与在商业银行开户的 `KYC` 要求具有可比性。这些要求包括居住地和护照检查，以及相应的反洗钱规则。少数加密货币交易所未执行这些要求，并在法律真空空中运行。我们强烈建议不要使用既是中心化又不受监管的交易所。\n\
  \n## 框 8.3：经纪人\n\n如果你不想担心自己获取比特币单位，有一些公司提供经纪服务。这些经纪人代表你进行交易并收取费用。在雇用经纪人时，你必须保持警惕并防范风险。此外，经纪费用只有在购买较大金额比特币单位时才有价值。\n\
  \n在进行交易之前，你必须向交易所存款加密资产或政府发行的法币。对于比特币交易，交易所会提供一个比特币地址。货币通常可以转入交易所的银行账户，并通常会在几天内到账。\n\
  \n更快的替代方案是使用信用卡支付。由于信用卡支付可以被撤销，提供信用卡支付的中心化交易所面临着高风险。因此，只有验证客户身份的交易所才提供此选项。此外，还会收取额外费用以抵消信用卡费用和退单风险。\n\
  \n### 比特币 ATM\n\n比特币 ATM 看起来与标准的银行 ATM 相似。然而，从它们提供的功能范围来看，这些机器与传统的取款机没有任何共同之处。它们允许用户用法币购买比特币单位——某些模型甚至作为双向货币转换器。对方通常是\
  \ ATM 的运营公司。\n\n为了购买比特币单位，客户将所需的钞票投入比特币 ATM。随后，比特币单位将记入客户之前生成的比特币地址。为了执行比特币支付，客户必须向机器的集成摄像头展示包含受益比特币地址的二维码。\n\
  \n\n\n\n某些机器会生成新地址并开具纸质收据，上面印有公地址和对应的私钥。这种方法再次构成了威胁，即私钥可能会留在机器的内存中，从而被提供者或恶意第三方复制（见第\
  \ 8.2 节）。\n\n## 物理比特币单位\n\n某些公司将比特币单位嵌入到实体物体中，使其能够以硬币、证书、金条或其他物体的形式流通。用于管理相应资产的私钥物理上隐藏在物体本身内部。而公地址则是从外部可见的。\n\
  \n这些物体存在的问题在于，购买者必须信任生产者。首先，他不知道相应的私钥是否真的被放置在密封条下方。一旦他为了确认而破坏密封，比特币就不再附着在物体上了，这违背了初衷。其次，同一个密钥可能被用于多个物体，或者可能在生产者或第三方的手中。因此，这类实体物体属于我们在框\
  \ 8.2 中警告过的类别，应谨慎购买。\n\n### 框 8.4：不含比特币内容的实体物体\n\n除了包含私钥的物体外，流通中还有其他仅供装饰的实体物体。这些物体以“比特币”为标签出售，尽管它们并不包含任何比特币单位。\n\
  \n这些物体中的甚至存在多个版本。由物理比特币制造商 Casascius 发行的早期物理比特币包含一个密封条，其中隐藏着一个保护该硬币相应比特币（BTC）名义价值私钥（1、0.5\
  \ 或 0.1 BTC）。由于监管困难，这些硬币的第二代在没有密封条的情况下出售，因此不含比特币内容^(\\[52\\])。\n\n## 8.2 存储\n\n\
  正如我们在下文中看到的，私钥可以通过许多方式存储。无论采用何种保存方法，都有两个重要的原则需要遵循。首先，私钥必须存储在不会丢失的地方。私钥的丢失意味着相关比特币单位不可恢复的损失。其次，不应让任何其他人访问你的私钥，因为如果一个人拥有私钥，他或她也获得了对相应地址资产的无限制控制权。\n\
  \n所有的存储方案都有特定的优缺点。特别是，便利性与安全性之间存在不可避免的权衡。`热存储`类的钱包直接连接到互联网，并具有发起交易的能力。`冷存储`类的钱包由不具备网络连接的钱包组成。\n\
  \n### 8.2.1 选择私钥\n\n如果你希望独立存储你的比特币单位，你至少一个比特币地址和一个对应的私钥。几乎所有`软件钱包`的基本功能之一就是生成新地址。钱包在后台生成私钥，在大多数情况下，它会显示一个助记种子（mnemonic\
  \ seed），你可以使用它来恢复你的比特币单位（见框 4.3）。这种方便的密钥生成方式对于大多数应用都是足够的。\n\n作为替代方案，有一些网站可以用于生成私钥。使用此类服务需要极其小心。具有欺诈动机的网站会生成私钥并保留其副本，以便以后访问你的资金。重要的是，你应该只使用代码公开的网站，这样你就可以确保它们使用了密码学安全的随机数生成器。此外，选择私钥的过程必须仅在你的个人电脑上执行。理想情况下，你应该下载整个网站并在没有连接互联网的电脑上打开它。通过这种方式，你可以防止任何第三方访问你的数据。\n\
  \n### 框 8.5：关于随机数生成器的警示\n\n计算机生成的随机数在严格意义上并不是随机的。它们基于某些函数，这些函数的输出虽然看起来是随机的，但实际上是确定性地生成的。因此，简单的伪随机数生成器是可预测的。\n\
  \n因此，使用简单的伪随机数生成器获取私钥可能会导致严重问题。其输出往往表现出某些模式，破坏了私钥的安全性。密码学安全的伪随机生成器可以解决这个问题。\n\n\
  如果你使用一种成熟可靠的钱包来生成密钥，你就不需要面对这个问题。密钥的选择是基于密码学安全的伪随机数生成器自动完成的。\n\n真随机数基于物理现象生成。例如，可以通过掷骰子或硬币来选择密钥。框\
  \ 4.4 提供了如何使用骰子和硬币生成私钥的详细描述。这可以被认为是最安全的选项。但是，请确保在向地址发送任何加密资产之前，你拥有该地址的权限。\n\n###\
  \ 框 8.6：菌丝熵（Mycelium Entropy）\n\nMycelium Entropy 是一种通用串总线（`USB`）优盘形式的设备，可用于生成私钥。集成的随机数生成器基于三个熵源，便于随机选择私钥。同时，该设备非常易用。\n\
  \n另一个优势是它独立于电脑。Mycelium Entropy 可以直接连接到带有 USB 接口的打印机。这种方法消除了通过电脑攻击的途径（关于打印机的详细讨论见框\
  \ 8.7）。\n\n该设备主要用于生成纸质钱包（见第 8.2.3 节](#chapter_8.xhtml#sec8-3)）。生成的私钥和助记种子也可以导入其他存储方案中。\n\
  \n### 8.2.2 热存储\n\n当私钥存储在直接或间接连接到互联网的设备上时，被称为`热存储`。这种存储方式提供了访问的便利性，但此类钱包比冷存储方案更容易受到攻击，后者将在第\
  \ 8.2.3 节中讨论。\n\n#### 软件钱包\n\n`软件钱包`通常非常易用，并且在连接互联网时不仅可以用于存储，还可以用于传输比特币。我们将其分为用于电脑的桌面钱包和用于移动设备（如智能手机和平板电脑）的移动钱包。\n\
  \n由于网络连接，软件钱包容易受到各种攻击。大多数智能手机和平板电脑隔离单个应用程序，因此提供了更好的恶意软件防护。相比之下，桌面电脑在这方面较为脆弱，因为应用程序通常深根于系统中并相互交互不受重大限制；此外，不同操作系统之间存在巨大差异。\n\
  \n始终建议对软件钱包中的私钥进行加密。几乎所有的流行钱包都提供了此选项。然而，加密也只能提供部分保护。如果电脑感染了`键盘记录器`——即一种读取并记录所有击键的程序——钱包的加密将失效。\n\
  \n\n\n\n\n此外，丢失私钥存在相当大的风险。这可能由于硬盘故障等原因引起。密钥（助记词）的备份可以部分缓解这一问题，但绝不应以数字形式存储。软件钱包通常不适合长期存储较大金额的比特币。相反，它们应该用作一种日常钱包，用于快速方便地访问较小金额的比特币。\n\
  \n软件钱包可以作为全节点客户端运行，也可以作为`simplified payment verification (SPV) client` 运行，或者基于中心化子网络运行（参见第\
  \ 3.2 节）。全节点能够自主验证交易，但需要持续的互联网连接。此外，平均需要几天时间来下载和处理完整的区块链。SPV 客户端和中心化子网络的加载时间要短得多，系统要求也更低，但必须依赖第三方信息来验证交易。对于许多应用，SPV\
  \ 客户端已经足够了。基于中心化子网络的钱包应谨慎使用。\n\n许多标准软件钱包让用户完全控制自己的私钥。这是一个值得欢迎的进展，但也意味着你个人（无例外地）必须对比特币单位的备份和安全保存负责。另一种方法是拆分控制权，使得出账交易必须由用户和钱包运营中心化服务共同签名。这些服务通常基于多签名（参见第\
  \ 4.5.3 节），其中第二个签名由用户的`two-factor authentication` (2FA) 触发。通常，此类系统提供一种替代方法，即使服务供应商消失，你也能继续使用你的资产。\n\
  \n## 在中心化交易所上存储\n\n比特币单位可以存储在中心化交易所中。这通常非常方便。尽管如此，我们强烈建议不要使用此类服务来存储你的比特币单位。中心化交易所的主要问题在于用户并不拥有私钥，因此对其比特币单位没有控制权。如果中心化交易所无法或不愿意签署交易，用户无法重新获得对其资金的控制。此外，中心化交易所是黑客攻击的获利目标。第\
  \ 2.5.4 节描述了针对中心化交易所的多次攻击，比特币用户在其中损失惨巨大。\n\n### 8.2.3 冷存储\n\n冷存储钱包由没有网络连接的钱包组成。将私钥严格隔离于互联网之外存储可以防止黑客攻击，是长期保存的最佳选择。\n\
  \n冷存储的目标是确保比特币单位的安全。这是以牺牲便利性为代价的。要启动交易，需要将预签名交易或私钥导入热存储钱包中。在下文中，我们将讨论主要的冷存储解决方案，例如`hardware\
  \ wallets`（硬件钱包）、`paper wallets`（纸钱包）和`brain wallets`（脑钱包）。\n\n#### 硬件钱包\n\n硬件钱包是专门用于存储私钥的设备。\n\
  \n对于没有额外功能的简单硬件钱包，安全的数字卡（SD）、外部硬盘或 USB 盘就足够了。私钥可以存储在这些介质上，并存远离电脑的地方。如果你想以此方式长期存储比特币单位，那么了解相应介质的预期寿命是值得的。在任何情况下，建议在另一个介质上保留副本。\n\
  \n所谓的`offline wallets`（离线钱包）是指无法访问互联网的计算机，专门设置为软件钱包。与简单的存储介质相比，这些离线钱包的巨大优势在于你可以独立生成新的私钥和地址。此外，可以离线生成并签名交易。签名后的交易只需导出到`online\
  \ wallet`（在线钱包）即可传播。签名后的交易不包含任何可以推断私钥的信息。它与无论如何将在网络中传播的交易消息完全一致。\n\n当比特币变得越来越流行时，专门的硬件钱包出现了。这些设备将高安全标准与简单方便的操作相结合。这些设备可以连接到计算机以触发交易。它们只允许交换交易数据，但确保私钥始终保留在硬件钱包的安全模块中。\n\
  \n当你购买此类设备时，至关重要的是确保你直接从制造商或受信任的零售商处订购，并且收到原始包装——即密封完好的包装。如果你购买二手的硬件钱包，建议在首次使用前重置设备，并从制造商网站重新安装官方固件。\n\
  \n#### 纸钱包\n\n纸钱包是包含私钥的纸质记录。或者，纸质记录也可以包含助记种子，该种子可以用于派生多个私钥。纸钱包具有此类优势：易于存储，且是最经济的冷存储方案。\n\
  \n这些记录可以是手写的或打印的。在这两种情况下，都建议在同一张纸上写多次私钥，以便在部分损坏的情况下仍能恢复完整的密钥。通常情况下，除了私钥之外，还会打印相应的\
  \ QR 代码。\n\n#### 框 8.7 选择合适的打印机\n\n纸钱包是长期存储私钥的良好选择。然而，在打印时，你应该极其小心。除了你的计算机可能感染恶意软件的可能性外，打印机也可能带来新的攻击向量，并将你的私钥暴露在额外的风险中。\n\
  \n打印任务通常存储在打印机的 RAM 中，并在那里保持很长时间的可读状态。如果打印机连接到网络，这尤其是一个问题。通过`USB` 直接连接打印机，并确保没有插网线，且禁用打印机的`Wi-Fi`\
  \ 功能。理想情况下，你的计算机和打印机在任何时候都应该避免与互联网接触。作为额外的安全措施，建议在打印完成后后断开打印机的电源。\n\n软件钱包 `Armory`\
  \ 使用 `Secure Print^(TM)` 机制来保护私钥。打印的内容必须用手写注释进行补充。即使攻击者设成功读取了打印机的 RAM，这也能保护私钥。\n\
  \n对于长期存储，务必考虑打印质量。建议使用激光打印机，因为它产生的文档不会晕染，且对光线和湿气不敏感。通过对纸条进行层层，可以进一步增强纸钱包的耐用性。最后，不要使用热敏纸。\n\
  \n以物理形式存储私钥可以防止其受黑客攻击。同时，你承担着确保无人看到你私钥的责任。如果第三方设法获取你的纸钱包，此人将获得对你所有资产的控制权。特别建议只打印加密的私钥，并将密码存储在另一个位置。\n\
  \n此外，你应该确保你的纸钱包不会丢失或被毁。火或水等自然力量可能会破坏你的纸条，导致你丢失所有的比特币单位。\n\n#### 框 8.8 防止私钥丢失\n\n\
  \n\n\n\n媒体上屡次出现关于黑客攻击和比特币小窃贼的警告。然而，大多数丢失比特币单元的用户都是由于丢失了私钥。\n\n解决这一问题的一种可能方法是，例如生成私钥的多个副本。然后可以将同一个私钥保存在多个地方。但随着副本数量的增加，潜在的攻击向量数量随之增加；这在可用性与防止第三方访问的安全性之间产生了某种权衡。\n\
  \n一种在不损害安全性的情况下创建可用性的高级方法是拆分密钥。例如，考虑一种设置：需要三个纸质钱包中的两个来访问资产。如果丢失一张纸条，仍然可以使用另外两个纸条无问题地恢复资产。同时，如果第三方获取了三个纸质钱包之一的物理访问，攻击者仍然无法控制资产。\n\
  \n这类系统可以通过多重签名（multisig）或名为 `Shamir’s Secret Sharing` 的程序来构建。这两个程序之间的区别仅在于技术层面上。在多重签名中，存在多个密钥，其中某些子集是满足解锁条件的。相比之下，`Shamir’s\
  \ Secret Sharing` 使用带有单个私钥的传统比特币地址，但将该私钥拆分成几个碎片。在这里，同样需要两个碎片才能推导出私钥。\n\n正如在第 8.2.1\
  \ 节 中提到的，存在许多可以用于生成纸质钱包的网站。这些工具对用户友好，并且通常具有非常有吸引力的打印布局。\n\n### 8.2.4 脑钱包\n\n私钥不需要写在任何地方。记住私钥可能就足以确保你将来还记得它。这种妥保存方式被称为\
  \ `brain wallet`（脑钱包）——即一个存在于你记忆中的钱包。\n\n只有少数人有能力记住一个 256 位二进制数。一种更实用的程序是选择任何单词组合，并使用哈希函数（例如\
  \ `SHA256`）生成私钥。这种确定性程序是可复制的，因此你只需要记住原始的单词组合。至关重要的是，句子或单词组合必须是随机产生的。来自公开媒体（如书籍、电影或歌曲）的句子是糟糕的选择，并且极有可能导致比特币单元的丢失。或者，你也可以记住助记词种子（mnemonic\
  \ seed）来推导出你的密钥。\n\n与脑钱包相关的应该考虑的另一个方面是遗产规划。如果你希望在去世后将比特币单元传给他人，你应该相应制定计划。显然，在这种情况下，使用脑钱包是非常有问题的。\n\
  \n## 8.3 支付\n\n比特币单元的开发是为了作为“一种点对点的电子现金系统”。^(\\[158\\]) 在这方面，学习如何使用比特币单元支付以及如何接收比特币支付非常重要。\n\
  \n### 8.3.1 使用比特币单元支付\n\n从技术上讲，用比特币支付非常简单。然而，由于接受比特币单元的商店数量仍然有限，你必须做一些研究并根据有限的选项调整你的购物习惯。有精选列表记录了可接受的地点。\n\
  \n虽然现实世界中的地点有限，但你可以轻松找到许多接受比特币购买多种商品和服务的在线商店。一个有趣的起点是 `OpenBazaar`，这是一个使用比特币单元作为主要货币的去中心化电子商务平台。^(\\\
  [168\\])\n\n支付过程的精确顺序取决于安装的钱包类型。通用过程总是相同的。图 8.1 显示了典型的支付流程。\n\n![图 8.1 根据 BIP0070\
  \ 的标准支付流程。来源：Gavin Andresen 和 Mike Hearn。支付协议。GitHub, 2013 年 7 月 29 日。\\[11\\]](images/fig8-1.png)\n\
  \n图 8.1  \n\n根据 `BIP0070` 的标准支付流程。\n\n来源：Gavin Andresen 和 Mike Hearn。支付协议。GitHub,\
  \ 2013 年 7 月 29 日。^(\\[11\\])\n\n在你选择好商品和/或服务后，告知零售商你想开始支付流程 (1)。然后零售商会给你一个支付请求\
  \ (2)。这包含一个比特币地址、描述或发票号码，以及你欠的比特币单元金额。账单可以通过蓝牙、近场通信 (NFC) 或类似技术发送到你的钱包，或者也可以以 QR\
  \ 代码的形式显示以便扫描。在任何情况下，你的钱包都会在屏幕上显示信息并请求确认 (3)。当你授权支付 (4) 时，会生成一条交易消息、进行签名并广播到比特币网络\
  \ (5)。一旦零售商收到交易消息，他将向你发送支付确认 (6)。从你确认到收到最终确认 (7) 所需的时间取决于网络连接、零售商特定的接受标准以及交易费用。通常，一次确认需要三秒到一小时不等。^(\\\
  [11\\])\n\n图 8.1 突出了比特币支付的简单性。作为客户端，你除了扫描二维码和确认支付请求外不需要做任何事情。其他过程都是自动完成的。之前的节细节对于理解比特币系统的特定功能至关重要，但终端用户不需要知道。\n\
  \n### 8.3.2 接受比特币支付\n\n接受比特币支付为零售商带来了许多优势。首先，与信用卡支付相比，交易费用很低——特别是使用闪网络等二层解决方案时。其次，客户在收到商品或服务后无法撤销支付。第三，接受比特币支付为吸引新客户群提供了机会。\n\
  \n接受比特币支付的方法有很多，大致分为两类：通过自管理系统接受或通过支付提供商的中介接受。\n\n#### 自管理系统\n\n类似于现金，比特币单元可以不需要中介。你只需生成一个比特币地址，并将其作为支付请求发送给客户。\n\
  \n简单的支付请求只要包含（至少）比特币地址就是有效的。支付请求通常格式如下：`bitcoin:<比特币地址>?`。许多钱包也能识别没有 Bitcoin 前缀的二维码。\n\
  \n根据 `BIP0021`^(\\[195\\]) 有指定更多参数的可能性，例如支付金额、零售商名称或支付目的描述。编码使用预定义的元标记，比特币地址后面跟着“?”,后续参数之间使用“&”\
  \ 分隔。\n\n下面的支付请求示例引用了在框图 4.1 中基于私钥生成的比特币地址。发票金额设置为 0.0005 比特币单元。此外，交易消息包含所有者信息“Book”和支付目的描述“Test\
  \ payment”。\n\n```\nbitcoin:1E8jc2eRXmjF2FKebTZwAsxwaRWeDevEwDj?amount=0.0005&label=Book%20Address&message=Test%20Payment\n\
  ```\n\n\n\n信息也可以以二维码的形式呈现，这样客户只需扫描代码即可。这种类型的支付请求的示例可见图 8.2。尝试使用你的钱包扫描此代码，你将看到使用比特币单位进行支付是多么的简单。^(1)\n\
  \n![图 8.2 二维码中的支付请求。](img/fig8-2.png)\n\n图 8.2\n\n二维码形式的支付请求。\n\n你可以通过蓝牙、NFC 或类似的连接向客户发送支付请求，或者直接显示二维码。如果客户使用同样遵循标准程序的钱包，该钱包将识别支付请求，插入信息并要求客户确认。\n\
  \n如果你想自己实现支付请求，应该遵循 `BIP0071`([8]) 或 `BIP0072`([9])。\n\n支付请求通常易于管理，且没有额外费用。这种方法对于小型公司特别有吸引力。然而，进一步的业务需求（如会计、网上商店实现或销售点系统）可能会使独立管理变得相当复杂。此外，建议彻底评估安全风险。例如，在认为某笔付款有效之前，你应该至少等待一次确认（平均需要十十分钟）。对于金额较大的款项，你应该等待多次确认。所谓的“区块浏览器”是评估交易安全性的良好工具。特别是许多区块浏览器提供预警系统，能够快速识别你的客户进行的任何双重花费尝试。\n\
  \n你应该考虑的另一点是比特币价格的波动性（参见第 6.1 节）。此外，注意为你的每个客户生成新的、唯一的支付地址。虽然可以将所有客户的付款都归入同一个比特币地址，但这样做有两个主要缺点。首先，区分不同客户的交易将变得越来越困难。特别是当你处理许多相似的交易时，情况尤为如此。类似于支付单上的参考号，可以为单个客户分配比特币地址。其次，你必须意识到，比特币交易虽然无法通过名称识别，但可以被公开观察。如果你始终使用同一个比特币地址，知道该地址的人（即你所有的客户）将能够监控你所有的入账。\n\
  \n自管理系统主要适用于不预期会有大量销售额并寻求最经济系统的小公司。对于此类情况，一个没有任何额外功能的简单钱包就足够了。然而，如果你预计收到大量的比特币付款，聘请支付服务商可能是值得的。\n\
  \n### 框 8.9 `xpub` 的\n\n如果你想将私钥存储在冷存储中，但又希望能够在销售点终端或网上商店服务器上直接生成新的比特币地址，那么 `BIP0044`([170])提供的流程是一个选项。该提案描述了用于派生层次确定性钱包（hierarchical\
  \ deterministic wallets）以及在没有相应私钥的情况下生成新地址的标准。技术细节在第 4.1.5 节](#chapter_4.xhtml#sec4-1)中详细介绍。硬件钱包\
  \ `Trezor` 或软件钱包 `Armory` 都非常用户友好，并便于导出用户独立派生新地址所需的 `xpub` 数据。此外，这两个钱包都集成了功能，能够在没有私钥的情况下生成地址。\n\
  \n#### 支付服务商\n\n支付服务商提供大量的工具，可以大大简化在销售点终端和网上商店实现比特币支付。这些工具包含了整个支付生命周期中所需的所有功能——从发布支付请求到接收以及对比特币单位的临时托管。此外，零售商有权将比特币付款立即转换为当地货币，从而保护自己免受比特币价格波动的影响。此外，许多支付服务商将承担故障的责任。例如，如果在支付服务商接受付款后，双重花费攻击成功，零售商在大多数情况下将获得赔偿。尽管费用通常比信用卡低，但这些服务并不是免费的。比较不同的报价是值得的，因为费用取决于服务的范围。\n\
  \n## 8.4 练习题\n\n**练习 8.1：** 列出三种获取比特币单位的方法。对于以下金额的资金，你会考虑使用哪种方法：(1) 0.0005 比特币，(2)\
  \ 0.5 比特币和 (3) 50 比特币？\n\n**练习 8.2：** 说明各种存储可能性及其优缺点。\n\n**练习 8.3：** 安装你选择的软件钱包，并将私钥或助记词（物理地写在纸上）作为安全备份。\n\
  \n**练习 8.4：** 出于尝试，获取少量的比特币单位并将其放入你的比特币钱包中。\n\n**练习 8.5：** 生成一个纸钱包，并进行一次测试付款以向该比特币地址。使用你的钱包和区块浏览器检查交易流程。\n\
