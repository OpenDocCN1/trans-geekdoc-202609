  \n如上所述，比特币价格高波动率的原因是比特币协议中缺乏价格平稳机制。因此，比特币单位很可能永远表现出比政府运营的法币高得多的短期价格波动。因此，已经开发出了各种创建价格稳定加密货币的建议，并不令人意外。^(\\\
  [[[33,70,120\\])\n\n### 6.1.4 稳定币：对低波动加密货币的追求\n\n稳定币是一种加密资产，旨在嵌入稳定机制以最大限度地减少价格波动。\n\
  \n第一批稳定币出现于 2014 年（例如 BitShares、NuBits、Tether）。^(\\[[[197,213\\]) 报告《稳定币现状》识别并描述了总共\
  \ 57 种已上线和预启动的稳定币。^(4)2019 年初，所有稳定币的市值约为 27 亿美元（约占所有加密资产总市值的 2%）。最大的是 Tether，市值约为\
  \ 20 亿美元。\n\n稳定币有三种类型，主要区别在于稳定机制和抵押形式。稳定机制要么是基于算法，要么使用抵押品。正如下文进一步解释的那样，抵押品可以是链下的，也可以是链上的。这三种类型显示在表\
  \ 6.2 中。^(5)\n\n表 6.2\n\n三种类型的稳定币。\n\n| 目标 | 稳定机制 | 抵押品类型 | 示例 |\n| --- | --- |\
  \ --- | --- |\n| 美元等值 | 算法 | 无 | Basis |\n| 美元等值 | 抵押品 | 链上（例如以太坊） | DAI |\n| 美元等值\
  \ | 抵押品 | 链下（例如美元） | Tether |\n\n所有稳定币通过增加某种程度的中心化破坏了比特币的核心价值主张。原因是稳定性要求稳定币的供应随需求变化进行调整，这如果不引入某种程度的中心化是无法实现的。在某些系统中，这“仅仅”需要价格喂；即`oracles`（预言机），告知智能合约抵押品和稳定币的市场价格。在其他系统中，存在一个中心化的发行者，根据自己的意愿操纵稳定币的供应。我们将在下文中进一步解释这些机制。在此之前，看看中央银行如何稳定其货币是值得的。\n\
  \n#### 央银行\n\n央银行稳定其货币有两种大体模型。大多数中央银行定义了一个商品篮子，并针对该篮子宣布通胀目标。通常，通胀目标是每年约 2%的通胀。有趣的是，并没有科学证据表明\
  \ 2%的通胀目标是最优的，但大多数中央银行仍然在使用。\n\n“商品篮子”目标的问题在于，中央银行没有“直接”工具来影响其价格。也就是说，他们不能简单地买卖这个篮子来稳定其价格。为了规避这个问题，他们发明了一系列货币政策工具，如公开市场操作、渠道系统和地板系统、货币付息、负利率和准备金要求等（仅举）。感兴趣的读者可以在任何货币经济学教科书中学习到这些工具。我们在这里提到这些工具是为了强调，稳定“商品篮子”的价格并不是易事的。\n\
  \n相对于另一种货币或相对于任何单一资产来稳定货币要容易得多。一些中央银行使用了这种稳定机制。汇率局是一种稳定机制，将本币挂钩到另一种货币，最通常是美元。^(6)\
  \ 汇率局通过美元创建一个本币单位。它随后以最具流动性的形式持有美元作为货币储备。因此，本币始终由 100%的储备支撑。汇率局根据需求兑换本币美元。\n\n然而，货币史充满了货币挂钩失败的例子。原因是政治。简而言之，汇率挂钩失败三个原因。首先，在汇率挂钩下，国家继承了其挂钩国家的利率和通胀率。不幸的是，这些利率可能会脱节并对国家经济造成严重损害（例如导致高失业率）。这种脱节产生了取消挂钩的政治压力。其次，在汇率挂钩下，铸币税很小，因为货币储备通常不产生利息。由于这个原因，许多国家没有持有完全流动储备，使其容易受到投机攻击。第三，在汇率局下，国家在紧急情况下无法随意印钞。这意味着，在银行危机期间，中央银行无法承担“最后贷款人”的角色。在战争等紧急情况下无法为政府融资。因此，汇率局在这些危机期间通常会被放弃。\n\
  \n接下来我们将讨论表 6.2 中提到的三种稳定币设计类型。\n\n算法稳定币\n\n纯算法稳定币的定义特征是缺乏抵押品。相反，设计者发行两种资产（有时甚至是）。一种资产是稳定币，我们假设它挂钩美元。另一种资产是一种在未来日期兑换稳定币的债券。^(7)\
  \ 我们这种这种称为“稳定币债券”。\n\n算法稳定币的基本稳定机制如下：如果对稳定币的需求增加，其价格也会增加。为了维持与美元的挂钩，发行者创建额外的稳定币。这些额外的稳定币要么空投，要么用于兑换任何发行的稳定币债券。以这种方式增加稳定币的供应最终会降低其价格。\n\
  \n\n\n\n\n当需求减少时，发行者会创建额外的稳定币债券并将其与稳定币进行回售，以减少流通中的稳定币数量。稳定币债券是对未来稳定币的承诺；也就是说，算法稳定币试图通过承诺未来增加稳定币供应来稳定不断下跌的价格。为了激励代理人购买稳定币债券，这些债券以折价方式出售。折扣率由市场力量决定。\n\
  \n例如，假设由于虚假新闻导致稳定币出现负面的总需求冲击。稳定币的价格跌至 1 美元以下。由于对挂钩是否能够维持产生严重怀疑，稳定币债券购买者会要求巨大的折扣——例如\
  \ 50%。这意味着，他们愿意支付 0.5 美元购买一张承诺兑换 1 美元稳定币的稳定币债券。这意味着，每从流通中移除一个稳定币，就会产生一个发行两枚稳定币的承诺。潜在的稳定币债券购买者会考虑到未来的供应增加，甚至可能要求比\
  \ 50% 更大的折扣。增加折扣率将进一步增加未来稳定币的数量。这种动态机制可以很容易打破挂钩。\n\n### 栏框 6.2：Libra：Facebook 的稳定币\n\
  \n2019 年 5 月，Facebook 宣布计划推出 `Libra` 稳定币。该代币将挂钩在一篮子货币上。该项目由 `Libra Association`\
  \ 支持，总部位于瑞士，成员包括许多来自支付和技术领域的公司。\n\n鉴于 Facebook 网络巨大的规模以及 `Libra Association` 部分成员在支付领域的深厚经验，`Libra`\
  \ 稳定币可能会被快速开发和采用，并成为第一种私发的国际虚拟货币。然而，该项目面临着严峻的监管障碍。一种“国际货币”必须符合其提供的所有国家的法规。在某些国家，这无疑要求\
  \ `Libra Association` 获得银行执照并履行所有国家的 `KYC` 和 `AML` 要求。此外，鉴于 Facebook 在用户隐私和数据泄露方面的许多问题，立法者将就数据保护提出严厉的问题。\n\
  \n此外，Libra 区块链并非中心化且无许可的。因此，由于 `Libra` 代币面临交易对手风险，访问可能会受到限制。因此，`Libra` 与 `Bitcoin`\
  \ 几乎没有共同之处，用途也不同。\n\n`Basis` 是最著名的算法稳定币。它从各种风险投资基金筹集了 1.33 亿美元。该项目最近已关闭。官方解释是监管问题；然而，我们认为这一决定在某种程度上是因为人们意识到\
  \ `Basis` 稳定币的经济学建立在不稳定的基础之上。Barry Eichengreen 指出了这些弱点：\n\n在这里，模型的缺陷即使对于初级央行家来说也是显而易见的。发行者偿债的能力取决于平台的增长，而这种增长是不有保障的。如果结果变得不确定，债券价格将会下跌。随后必须发行更多债券以防止货币价值发生特定下跌，这使得履行利率义务变得更加困难。在某些情况下，可能根本没有价格。\n\
  \n### 抵押型稳定币：链上\n\n抵押型稳定币由资产支撑。稳定币的价值与抵押品的价值相关。如果抵押品的价值下降，稳定币的价值也可能下降。为了防止这种情况，发行者可能要求更多的抵押品。这被称为过度抵押。\n\
  \n最常见的过度抵押稳定币类型是 `CDP`（抵押债务仓）。在 `CDP` 中，用户锁定抵押品以借入稳定币。借入金额小于抵押品的价值。如果抵押品的价值跌到某一水平以下，`CDP`\
  \ 将被清算。这意味着抵押品将被出售以偿还贷款。\n\n`CDP` 的清算由智能合约触发。当抵押品的价值低于清算阈值时，智能合约会自动出售抵押品并偿还贷款。用户留下剩余的抵押品。\n\
  \n`CDP` 的清算是抵押型稳定币稳定性的重要部分。如果许多 `CDPs` 同时清算，可能会对抵押品的价格产生下压力。这就是为什么维持高水平的过度抵押非常重要。\n\
  \n### 需求与供给机制\n\n稳定币的价值与抵押品的价值相关。如果抵押品的价值下降，稳定币的价值也可能下降。为了防止这种情况，发行者可能要求更多的抵押品。这被称为过度抵押。\n\
  \n最常见的过度抵押稳定币类型是 `CDP`（抵押债务仓）。在 `CDP` 中，用户锁定抵押品以借入稳定币。借入金额小于抵押品的价值。如果抵押品的价值跌到某一水平以下，`CDP`\
  \ 将被清算。这意味着抵押品将被出售以偿还贷款。\n\n`CDP` 的清算由智能合约触发。当抵押品的价值低于清算阈值时，智能合约会自动出售抵押品并偿还贷款。用户留下剩余的抵押品。\n\
  \n`CDP` 的清算是抵押型稳定币稳定性的重要部分。如果许多 `CDPs` 同时清算，可能会对抵押品的价格产生下压力。这就是为什么维持高水平的过度抵押非常重要。\n\
  \n### 栏框 6.4：DAI 的稳定机制\n\n如果 DAI 的市场价格高于 1 美元，稳定机制必须确保创建额外的稳定币。下面的套利示例确实如此。假设 DAI\
  \ 的市场价格为 2 美元。那么存在以下套利机会：借入 1000 个 DAI 并将其售得 2000 美元。新产生的 DAI 代币增加了供应。如果有足够的套利者遵循这一策略，较高的供应最终会降低\
  \ DAI 的价格。一旦跌至 1 美元，用 1000 美元购买 1000 个 DAI 并偿还债务。该策略的唯一风险是在等待策略获利期间，以太坊抵押品的价格可能会错误的方向移动。\n\
  \n如果 DAI 的市场价格低于 1 美元，稳定机制必须确保从流通中移除 DAI 稳定币。下面的套利示例确实如此。假设 DAI 价格跌至 0.5 美元，考虑一个债务\
  \ 1000 个 DAI 的代理。在这个价格下，他可以用 500 美元购买 1000 个 DAI，然后用 1000 个 DAI 偿还债务。\n\n\n\n\n\
  上述描述解释了在正常情况下稳定性机制是如何运作的，此时 CDP 所有者预期 `DAI` 的价格将回升 1 美元。然而，如果在第二个例子中，他们预期 `DAI`\
  \ 的价格会进一步下跌，那么他们就会动力等待更长时间再偿还贷款。在这种情况下，`DAI` 的价格可能会继续下跌。\n\n`stability fee`（稳定性费用）是\
  \ `DAI` 稳定币的关键货币政策工具之一。`stability fee` 是 CDP 所有者对其未偿还的 `DAI` 债务需要支付的利率。`stability\
  \ fee` 的增加会减少开设新 `CDPs` 的动力，并增加通过偿还 `DAI` 债务来关闭现有 `CDPs` 的动力。因此，在其他条件不变的情况下（*ceteris\
  \ paribus*），`stability fee` 的增加将减少 `DAI` 的供应。`DAI` 稳定性系统仍在微调如何使用这一工具来提高 `DAI` 的稳定性。\n\
  \n此外还有其他机制确保即使在高压力下，`DAI` 的价格对美元保持稳定。解释所有这些机制超出了本节的范围，但我们鼓励读者对这一非常有趣的项目进行自己的研究。\n\
  \n*a.* `DAI` 稳定币由 `Maker Platform` 开发并治理，这是一是一个去中心化组织。\n\n`DAI` 稳定性机制到目前为止运行良好，但只有时间才能证明\
  \ `DAI` 稳定币在所有可能的不利事件下是否稳健。此外，还存在其他风险。首先，`DAI` 合约系统可能存在缺陷，某一天可能会以意想不到的方式运行。这是适用于所有智能合约的典型风险。其次，`DAI`\
  \ 系统需要价格喂。特别是，智能合约需要在任何时刻了解 `Ether` 的价格。`DAI` 有几个不同的 `Ether` 价格喂，并使用这些价格喂的加权平均值。然而，这些价格喂为这个原本去中心化的系统增加了一些中心化，并是一个潜在的攻击向量。最后，在\
  \ `Ether` 价格下跌超过 90% 的期间，`DAI` 稳定币保持了其价值。尽管如此，当 `Ether` 价格在极短时间内下跌 50% 或更多时，该系统将如何反应仍有待观察。\n\
  \n### 抵押型稳定币：链下\n\n基于链下抵押品的稳定币使用普通的银行账户或其他形式的中心化托管来持有抵押品。到为止，最大且最著名的使用链下抵押品的稳定币是\
  \ `Tether`，它挂钩美元。它成立于 2014 年，与总部位于香港的交易平台 `Bitfinex` 相关。`Tether` 稳定币的历史揭示了链下抵押品产生的主要问题：即缺乏透明度、缺乏抗审查性以及缺乏盈利能力。\n\
  \n首先，从成立开始，`Tether` 是否拥有充足美元的全额支持一直存在很大的不确定性。在 `Tether` 网站上有“Tether 始终完全透明”和“我们的储备金每日公布”等声明。遗憾的是，我们无法找到关于其储备的独立声明。他们网站上的那份是\
  \ 2018 年 6 月的。\n\n其次，在银行账户中链下持有储备是一个核心攻击点。政府可以通过冻结美元储备直接关闭 `Tether` 稳定币。有趣的是，`Tether`\
  \ 稳定币的发行商不得不移动其储备。\n\n第三，在银行账户中链下持有储备是一个核心攻击点……（注：此处提供的文本重复了逻辑，保持了核心内容）。\n\n[其余文本按照要求后续...]\n\
  \n\n\n\n\n央银行可能会介入并提供一种稳定的 CBDC（央银行数字货币）。关于央银行数字货币，有两种本质上完全不同的方案：“央银行加密货币”（又称 `Fedcoin`）和“面向所有人的央银行电子货币”。如果我们通过扩展图\
  \ 2.1，添加如图 6.4 所示的“央银行加密货币”，就可以很容易看出这两者的区别。\n\n![图 6.4 央银行加密货币。](img/fig6-4.png)\n\
  \n图 6.4  \n\n央银行加密货币。\n\n如图 6.4 所示，加密货币的区分特征是交易处理的去中心化性质，这使得用户能够在没有中间机构的情况下伪匿名地交易比特币，而无需向任何人请求许可。(9)\
  \ 去中心化对于实现抗审查审查资产的地位至关重要，这也是比特币的核心卖点。\n\n去中心化对央行来说是一个红旗。(10) 去中心化国家货币的声誉风险太高了。(31)\
  \ 想象一种假设的 `Fedcoin` 被毒品集团用于洗钱，或被恐怖组织用于获取武器。此外，商业银行理理地开始质疑为什么他们必须遵守 KYC（了解您的客户）和\
  \ AML（反洗钱）规定，而央行却通过发行一种无需许可即可访问匿名加密货币来削弱这些规定的任何效果。此外，任何设计了在其他国家流通的无许可加密货币的央行，都将面临其同类央行的严峻挑战。美国联邦储备银行或中国人民银行可能不会接受由瑞士国家银行发行、供这些国家公民大量使用的假设性\
  \ `SNBcoin`。\n\n### 框 6.7 `Fedcoin`\n\n在比特币白皮书出版大约年后，出现了首次对 `Fedcoin` 的要求。据我们所知，`Fedcoin`\
  \ 一词最早由 J. P. Koning 在 2013 年的一篇博客中提到。(133)这个想法被 David Andolfatto 在 2015 年的一篇博客中采纳。(3)有趣的是，在这篇文章中，Andolfatto\
  \ 建议“由于 `Fedcoin` 钱包就像现金钱包一样是无许可且免费的，即使没有适当身份证明的人可以使用该产品。”此外，他认为这是一个主意，“`Fedcoin`\
  \ 应该避免任何 KYC 限制……政府似乎可以接受不对比物理现金交易实施 KYC——为什么为什么要坚持对数字现金交易实施 KYC 呢？”\n\n在我们看来，他的比较忽略了物理货币与虚拟货币之间的根本区别。由于其物理属性（见图\
  \ 6.4），现金用户可以保持匿名且无需请求许可即可使用。现金具有选择性；任何央行都无法发行在点对点交易中代理可以被识别的物理现金。相比之下，匿名性和访问规则是设计虚拟货币时的可选变量。它可以被设计为使用户保持匿名，也可以设计为每笔付款的买方和卖方都能被识别。\n\
  \n在 Berentsen 和 Schär 的文章《支持央银行电子货币和反对央银行加密货币的理由》中（(31)），我们（文章作者）认为，央行将选择中心化的虚拟货币，以声声誉政治风险降至最低。通过“面向所有人的央银行数字货币”，有成熟的技术允许央行发行其可以紧密控制的中心化虚拟货币。这种货币不需要区块链技术。\n\
  \n### 框 6.8 `An ERC-20 Fedcoin`\n\n在上一条注释中，我们认为央行发行去中心化货币是没有意义的。尽管如此，从技术角度来看，央行可以很容易引入央银行加密货币。存在诸如以太坊的\
  \ `ERC-20` 或 `ERC-223` 代币标准，可以用于创建与以太坊基础设施兼容的同质代币。\n\n为了确保加密法货币单位与央行储备对等，央行必须愿意按面值买卖任何数量的代币。估值取决于央行的信誉，但如果央行决定发行央银行加密货币，它就有手段这样做。事实上，兑换机制可以与不同面值的现金进行比较。\n\
  \n### 面向所有人的央银行电子货币\n\n在注释 6.7 中引用的 Berentsen 和 Schär 文章中（(31)），我们认为电子形式的央银行货币有充分的理由（即\
  \ 6.4 中的央银行货币）。此外，我们认为其实施非常容易。实施只需要央行允许家庭和企业在其开设简单账户。这将允许家庭和企业使用央银行货币而非商业银行存款进行支付。\n\
  \n有很多好处。首先，它满足了人们对虚拟货币的需求，而无需面临对手风险。这是因为与私人银行不同，央行不会违约本币债务，因为它可以随时打印货币来履行义务。(31)\n\
  \n其次，减少现金的使用存在巨大的政治压力，许多国家已经大幅限制了它的使用。(11)) 现金的消失意味着货币货币无法获取法定货币。通过提供简单账户，央行允许公众以电子形式持有法定货币。大部分人口将其视为现金的密切替代品，这将更容易告别现金。\n\
  \n第三，“面向所有人的央银行电子货币”将增加金融稳定性。为了继续吸引存款，商业银行需要改变其商业模式，或者增加存款利息以补偿用户承担的额外风险。对商业行的纪律作用将得到加强，因为一旦失去信任，客户的资金可以快速转移到央行电子账户。为了避免这种情况，银行必须使其商业模式更安全，例如通过承担更少的风险或持有更多的准备金和资本。\n\
  \n### 框 6.9 “央银行电子货币”背景下的银行挤兑\n\n在“面向所有人的央银行电子货币”下，大量资金可能会从商业银行存款转向央行账户，而没有真实原因（与基本面无关的银行恐慌）。这种担忧在国际银行\
  \ 2018 年的报告中得到了强调：(167)“通用 CBDC 最显著且最可能的金融稳定性风险是，它可以导致资金从私人金融机构和市场向央行转移。”\n\n\n\n\
  \n\n央行有两个工具来解决这一问题。首先，可以对支付账户设置封顶。也就是说，可以对代理人在此类账户中持有的货币数量实施上限。特别建议在初期为央行和私营部门设置上限，以积累在使用此类账户的经验。其次，央行必须提供常备便利，使商业银行能够以快速、方便的方式通过抵押品进行贷款。\n\
  \n第四，“全民央行电子货币”简化了货币政策。央行可以简单地将对这些账户支付的利息利率作为其主要政策工具。如果市场不进行隔离——意味着每个人都能获得央行电子货币——那么这些账户的利率将是经济体中的最低利率。这是因为央行电子货币将成为经济体中流动性最高的资产，且此类货币持有者面临任何交易对手风险，因为央行不会陷入流动性枯竭。\n\
  \n## 框 6.10 退出策略\n\n许多央行目前正在讨论利率正常化的可能性。由于应对 2008 年金融危机产生了海量流动性，公开市场操作等标准货币政策工具已失效，且目前讨论的所有工具都有一个共同，即央行以某种形式对准备金支付利息。\n\
  \n这些支付存在政治经济问题，因为直到今天，这些利息仅支付给少数能够获得央行电子货币的金融中介。普通公众可能不会认为此类巨额支付是公平或有益的，并且极高风险可能会引发政治争议，并可能影响央行的独立性。\n\
  \n央行电子货币是一种避免因这些利息支付可能引发政治动荡的优雅方式，因为它允许全体民众都能获得这些利息，而不仅仅是一小撮商业银行。\n\n第五点，实施“全民央行电子货币”是非常直接的，因为这些账户只能用于支付。无法获得信贷，因此几乎不需要进行监控（当然，某些标准法规仍然适用）。此外，可以强制商业银行必须以央行的名义向现有客户提供此类账户。这些账户中的货币单位将从商业银行的资产负债表中剔除，以在发生违约时保护这些资产。\n\
  \n研究 CBDC（央行数字货币）相关问题的学术论文日益增多。少数研究调查了 CBDC 对私营银行业的影响，或推导出了内部货币和外部货币发行等效的条件。另一些研究则关注引入\
  \ CBDC 的社会效益和福利效应，或其对货币政策的意义。\n\n## 6.2 可扩展性\n\n比特币网络每秒处理的交易少于十次。这是一个瓶颈，已通过各种提案得到了解决。在本节中，我们将讨论两种最突出的扩展方法：增加区块大小和支付通道。\n\
  \n### 6.2.1 拥堵问题\n\n比特币网络的低容量会导致严重的拥堵。第一个效应是交易费在活跃高峰期间急飙升。第二个效应是内存池（mempool）大幅增大；即未确认交易的池。图\
  \ 6.6 显示了内存池。特别是到 2017 年底，几乎所有的区块都非常接近 1 MB 的限制，内存池被填满了。\n\n```\n[图 6.5 每日交易数量]\n\
  ```\n\n比特币网络的容量受区块大小和区块时间的限制。如果增加区块大小，每秒处理交易数量就会增加。然而，这可能导致其他问题，例如中心化。\n\n像 Visa\
  \ 和 Mastercard 这样的中心化支付网络达到了每秒数百或数千次的处理量。2016 年，PayPal 处理了 76 亿次交易，折合为每秒 240 次。Visa\
  \ 网络在 2017 年处理了 1112 亿次交易，约为每秒 3,500 次。根据 Visa 的报告，其网络的最大容量为每秒 65,000 次交易。\n\n###\
  \ 6.2.2 增加区块大小限制\n\n增加区块大小限制只需要对比特币软件进行微小更改，就能立即增加网络每秒可以处理的交易数量。这种更改可以通过一次性的永久增加、预定的增长路径或动态区块大小来实现，即区块大小限制根据最后几个区块的大小而随时间变化。\n\
  \n\n\n\n尽管代码变动相对较小，但此类更改不应轻率为。区块大小限制的任何增加都对应于共识规则的改变，这种改变是不向下兼容的（即硬分叉或强制分叉）。如果某些用户不同这些更改或忘记更新其客户端，该更改将导致分叉（参见第\
  \ 2.5.3 节）。\n\n此外，区块大小的增加可能会使去中心化变得更加。例如，如果将区块大小限制提高到`128 MB`，运行全节点的成本将显著增加，这可能导致全节点减少和中心化加剧。区块大小限制的增加还会显著延长在网络中转发区块的时间，导致更多的`block\
  \ races`（区块竞争）以及更高的孤块率，从而增加不确定性。此外，更大的区块会促进矿矿的中心化。因此，我们认为不应将区块大小限制的增加视为加密资产扩展的首要方案。^(13)\
  \ 充其量，它们只是支持其他扩展方案的辅助措施。\n\n## 框 6.11: 扩展之争\n\n在加密社区中，关于区块大小限制增加和其他扩展方案的优缺点存在许多争议。事实上，这些观点根深蒂固，导致比特币在\
  \ 2017 年 8 月分裂成了两个敌对阵营。大部分比特币社区追随 `Bitcoin Core`，它实现了 `SegWit`；另一些人选择了现今被称为 `Bitcoin\
  \ Cash` 或 `B-Cash` 的替代区块链，将它们的区块大小增加到 `8 MB`，随后增加到 `32 MB`，目前正在考虑进一步增加。此外，他们决定不实现\
  \ `SegWit`（参见第 4.7 节）。截至今日，比特币区块链的市场价值远高于 `B-Cash` 区块链的市场价值。最近 `B-Cash` 社区分裂成了更多阵营，导致了更多样的小型链。从市值、社区和开发者兴趣来看，这些替代阵营大多是可以忽略不计的。\n\
  \n### 6.2.3 支付通道与闪电网络\n\n所谓的支付通道允许`off-chain`（链下）交易；即不传播到比特币区块链的交易。它们仅在涉及的双方之间共享，稍后以聚合的形式添加到比特币区块链中。在这方面，链下交易受益于区块链的安全性，同时不会给其带来负担。\n\
  \n支付通道基于 `multisig`（多签名，`pay-to-script-hash`）解锁条件，允许双方进行几乎任何数量的（微）交易。此类支付是安全且立即有效的，并且可以在没有建立信任关系的情况下双方之间进行。另一个优势是，处理任何数量的链下交易只需要两次区块链交易。^(\\\
  [174\\]) 在下文中，我们将描述不同类型的支付通道，并展示它们如何通过支付网络（如`Lightning Network`）连接起来。\n\n#### 单向支付通道\n\
  \n在最简单的情况下，支付通道内的所有付款都在同一个方向上进行。如果 Tamara 想在一段时间内向 Brian 进行多次付款，他们可以开启一个单向支付通道。为此，他们开启了一个\
  \ `2-of-2 multisig`。\n\n（注：源文本在“单向支付通道”部分包含高度重复且碎片化的句子。我在保留过程描述核心逻辑的同时，清理了结构性的碎片。）\n\
  \n\n\n\n\n只要通道开启，Tamara 就可以进行无限次支付，支付金额不超过最初存入的最大金额。这个最大金额被称为 `channel capacity`（通道容量）。由于这些支付都没有记录在比特币区块链上，因此不需要支付交易费用。然而，在开启和关闭支付通道时，必须在比特币区块链上记录两笔交易，这两笔交易需要支付费用。\n\
  \n支付通道的可能用例包括 `pay-as-you-go`（按需付费）解决方案，例如 Wi-Fi 的按秒计费，或用于通过微额解锁内容的 `pay walls`（付费墙）。^(\\\
  [217\\])\n\n### 带有时间锁的双向支付通道\n\n支付通道也可以双向使用。然而，一旦资金可以在两个方向流动，就需要采取额外的安全措施。特别是，目标是防止某人发布一条旧的承诺交易，该交易虽然经过了对方的部分签名，但不再反映比特币单位分配的当前状态。^(15)\n\
  \n让我们继续之前的例子，其中 Brian 通过支付通道接收了 0.02 个比特币单位。假设他现在正通过第三笔承诺交易将 0.02 个比特币单位还给 Tamara。此时问题变得显而易见：Brian\
  \ 持有两个由 Tamara 部分签名的承诺交易，分别有利于他的 0.01（承诺交易 1）和 0.02 比特币单位（承诺交易 2）。Tamara 持有交易 3，该交易由\
  \ Brian 部分签名，其整个通道余额有利于她的 0.1 比特币。承诺交易 1 和 2 已经过时，不能反映支付通道的当前状态。尽管如此，Brian 可以签署其中任何一笔并将旧的承诺交易传播到比特币网络。\n\
  \n三笔承诺交易（1–3）和原始退款交易（0）如表 6.3 所示。\n\n表 6.3\n\n双向支付通道中的承诺交易。\n\n|   || 输出 (Outputs)\
  \ ||   ||  |\n| --- | --- | --- | --- |\n| #   || Tamara || Brian ||   || 部分签名 Partially\
  \ signed) |\n| 0   || 0.10 || 0.00 ||   || 来自 Brian |\n| 1   || 0.09 || 0.01 ||\
  \   || 来自 Tamara |\n| 2   || 0.08 || 0.02 ||   || 来自 Tamara |\n| 3   || 0.10 ||\
  \ 0.00 ||   || 来自 Brian |\n\n为了防止某人（在这种情况下是 Brian）传播与支付通道当前状态不符的交易，每笔承诺交易都包含一个 `nLockTime`\
  \ 时间锁。如上述，这种限制定义了承诺交易添加到区块链的最早时间。\n\n每个新的承诺交易的时间锁至少减少一个区块。例如，如果支付通道是在区块 `t` 创建的，且最早最早在区块\
  \ `t+1,008` 进行退款，那么第一笔承诺交易的时间锁将是 `t+1,007`（或更短），第二笔承诺交易的时间锁将是 `t+1,006`（或更短），而第三笔承诺交易的时间锁将是\
  \ `t+1,005`（或更短）。这种方法确保了最近的承诺交易可以比所有其他承诺更早传播。时间顺序如图 6.9](#chapter_6.xhtml#fig6-9）所示。\n\
  \n![图 6.9 时间锁的可视化。](img/fig6-9.png)\n\n图 6.9\n\n时间锁的可视化。\n\n使用 `nLockTime` 的实现有一个缺点。初始的\
  \ `refund transaction` 为通道创建了一个过期日期 `T`。这导致必须在日期 `T` 之前不久关闭通道（最晚在区块 `T–1`），并根据需要开启新通道。每次关闭和重新开启都需要两笔链上交易以及相应的交易费用。如果为\
  \ `T` 选择较大的值，支付通道就不需要频繁更新，但同时也存在比特币单位在支付通道中锁定时间更风险。这种权衡在单向和双向支付通道中都存在。\n\n在双向实现中，问题更加严重，因为随着每笔承诺交易的产生，过期日期至少向前移动一个区块。在时间锁为\
  \ `T = t+1,008` 的双向支付通道中，在所有 `nLockTime` 步骤仅为一个区块且所有交易都发生得非常快的乐观假设下，最多可以创建 1,007\
  \ 笔承诺交易。如果步骤大于一个区块，通道的寿命将进一步缩短。^(16)\n\n### 图 6.12 各种时间锁\n\n时间锁存在多种形式。它们可以包含在交易层的字段中，也可以通过输出层的脚本语言实现。此外，它们以绝对时间锁和相对时间锁的形式存在。绝对时间锁指定了输出最早的时间或区块高度。相对时间锁指定了确认后必须经过的区块数。下面描述了四种时间锁。^[177\\\
  ]\n\n#### nLockTime\n这是交易层的一种绝对时间锁，引用特定的区块高度或时间。该字段从比特币诞生起就存在，是原始的时间锁。\n\n#### CHECKTIMEVERIFY\
  \ (CLTV)\n2015 年底通过 `BIP0065` 引入了一种新的绝对时间锁。与 `nLockTime` 的区别在于，这种时间锁是通过脚本语言实现的，因此引用单个输出而非整个交易。在这一点上，它的使用更灵活。\n\
  \n#### nSequence\n与 `nLockTime` ，该字段从初始实现起就存在。然而，它最初有完全不同的含义，后来被重新定义为交易层的相对时间锁。该更改在\
  \ `BIP0068`^[99\\]）中描述，并于 2016 年年中通过软叉激活。\n\n#### CHECKSEQUENCEVERIFY (CSV)\n这种相对时间锁追溯到\
  \ `BIP0112`^[145\\]），并于 2016 年年中通过激活。它是通过脚本语言实现的，因此引用单个输出。\n\n|  || 交易层 (Transaction\
  \ level) ||  || 输出层 (Output level) |\n| --- | --- | --- | --- |\n|  || 共识层 (Consensus)\
  \ ||  || 脚本语言 (Scripting language) |\n| 绝对时间锁 | nLockTime |  || CHECKTIMEVERIFY\
  \ (CLTV) |\n| 相对时间锁 | nSequence |  || CHECKSEQUENCEVERIFY (CSV) |\n\n需要注意的是，由于区块生成时间的随机性以及不断变化的总算力，达到特定区块高度的时间是随机的。a\
  \ 此外，区块戳可以被操纵。b\n\n*a. 难度阈值每 2,016 个区块调整一次。在这一点上，算力的变化可能会导致区块产生速度略快或变慢。参见图 6.1。*\n\
  \n*b. BIP0113 使用时间戳的中位数来试图解决这个问题。*\n\n\n\n\n\n# 基于非对称可撤销承诺的双向支付通道\n\n上一节的备注表明，在实践中，基于时间锁的支付通道效率较低。更好的方法是在生成新的承诺交易时，立即使旧的承诺交易失效。这可以防止参与者传播不再符合支付通道当前状态的旧承诺交易。\n\
  \n遗憾的是，承诺交易无法轻易撤回。一个签名的承诺交易可以在任何时候传播到区块链上，只有当竞争性交易被成功添加到比特币区块链上时，它才会过时。幸运的是，特殊解锁条件和惩罚机制的巧妙结合将产生激励机制，使得没有人想将旧状态传播到比特币网络。我们所指的是`非对称可撤销承诺`（asymmetric\
  \ revocable commitments）。\n\n让我们扩展示例，让 Tamara 和 Brian 开启一个新的支付通道。这次他们都添加了 0.5 个比特币单位，因此通道的总容量将为\
  \ 1 个比特币单位。现在创建的不是一个退款交易，而是两个（非对称的）退款交易。让我们先从 Tamara 的角度来看。她从 Brian 处收到一个包含两个输出的部分签名退款交易。输出\
  \ 1 将给 Brian 0.5 个比特币单位，输出 2 包含给 Tamara 的 0.5 个比特币单位。\n\n这里情况变得有点复杂了。一方面，我们希望 Tamara\
  \ 能够提取她有权获得的金额，而不依赖于 Brian。另一方面，我们必须防止她在该 `refund transaction` 不再反映支付通道当前状态时将其发布。\n\
  \n为了同时满足这两个要求，第二个输出包含一个 `scriptPubKey`，该条件可以通过两个条件中的任何一个来满足。条件 1 是时间锁。一旦承诺交易获得了一定数量的确认，Tamara\
  \ 就可以使用输出 2；即在通过 `CHECKSEQUENCEVERIFY` 实现的特定延迟后。\n\n条件 2 让 Brian 有一个选项，如果他持有该输出的撤销密钥，可以在\
  \ Tamara 之前使用输出 2。撤销密钥最初由 Tamara 持有。但如果 Tamara 创建了新的承诺交易，只有在收到旧承诺交易的撤销密钥后，Brian\
  \ 才会接受这个新的承诺交易。一旦 Brian 拥有撤销密钥，Tamara 就没有动力发布旧承诺交易；否则 Brian 就可以使用输出 2，从而惩罚 Tamara\
  \ 的欺诈行为。[图 6.10] 显示了输入、输出与相关条件之间的关系。\n\n![图 6.10 支付通道多签名地址的输出作为输入。其中一个由 Brian 部分签名。如果\
  \ Tamara 签署该交易，输出 1 记入 Brian。输出 2 记入 Tamara 或 Brian，取决于 Brian 是否持有撤销密钥](img/fig6-10.png)\n\
  \n[图 6.10]\n\n支付通道多签名地址的输出作为输入。其中一个由 Brian 部分签名。如果 Tamara 签署该交易，输出 1 记入 Brian。输出\
  \ 2 记入 Tamara 或 Brian，取决于 Brian 是否持有撤销密钥。\n\n从 Brian 的角度来看，支付通道多签名地址的输出作为输入。其中一个由\
  \ Brian 部分签名。如果 Tamara 签署该交易，输出 1 记入 Brian。输出 2 记入 Tamara 或 Brian，取决于 Brian 是否持有撤销密钥。\n\
  \n闪电网络是一种所谓的“二层解决方案”；即比特币系统之上的额外网络，受益于比特币的安全性。闪电网络允许通过多个支付通道进行路由。它允许 Tamara 在不与\
  \ Emanuel 开启支付通道的情况下向其转移比特币单位。她可以简单地通过其他支付通道使用间接连接。这种情况如图 6.11 所示。\n\n```\nif (condVar\
  \ > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n\nHTLC 将输出的使用与给定哈希值相关的原像（输入值）的公开相联。哈希值记录在脚本中。任何能够提供导致该哈希值的输入值并满足任何其他标准（如签名要求）的人都可以使用该输出。\n\
  \n解释这一概念最简单的方法是提供一个示例。图 6.12 在图 6.11 的基础上增加了一个 HTLC 条件。首先，Emanuel 创建了一个随机数 `m`。这个随机数作为哈希函数的输入，并且暂时保持保密。其次，Emanuel\
  \ 将相关的哈希值 `h = H(m)` 发送给 Tamara。第三，Tamara 创建了一个 HTLC 提交交易。状态改变的输出包含一个解锁条件，即 Brian（签名）必须在一定数量的区块（`CLTV`\
  \ 时间锁定）内提交输入 `m`（哈锁）才能申领该输出。第四，Brian 为与 Emanuel 的支付通道创建了一个 HTLC 提交交易。等价的是，Emanuel（签名）必须在一定数量的区块（`CLTV`\
  \ 时间锁定）内提交输入 `m`（哈锁）才能申领该输出。\n\n![图 6.12 带有 HTLC 条件的链式支付通道。(images/fig6-12.png)\n\
  \n图 6.12\n\n带有 HTLC 条件的链式支付通道。\n\n到目前为止，任何支付通道都没有发生状态变化。因此，如果 `CLTV` 时间锁定过期或发生任何其他问题，所有的提交交易都将过期，两个支付通道将保持原始状态。\n\
  \n在这种情况发生之前，Emanuel 有两个选择。他可以用自己的签名和输入值 `m` 补充 Brian 的提交交易，并将其传播到比特币网络。通过将 `m` 作为\
  \ `scriptSig` 的一部分公开，Emanuel 将获得 Brian 通过提交交易承诺给他的金额。同时，Brian 方面将获知输入 `m`，因此可以使用它来完成\
  \ Tamara 的提交交易，然后将其传播到比特币网络。在这种情况下，两个支付通道都将关闭，比特币单位将根据当前状态进行分配。\n\n但在许多情况下，双方都希望保持支付通道开启。如果双方都同意通道应保持开启，在\
  \ Emanuel 公开 `m` 后，Brian 可以简单创建一个不带时间锁的新提交交易。如果 Emanuel 接收到这个新的提交交易，他就不需要在时间锁定过期之前传播原始的\
  \ HTLC 提交交易，支付通道可以继续存在。Brian 随后会将输入 `m` 转发给 Tamara，如果 Tamara 和 Brian 同意该通道也保持开启，则请求一个新的不带时间锁的提交交易。\n\
  \n现在你可能知道为什么 Brian 会提供他的支付通道作为一种基础设施。答案是交易费用。Brian 可以提前说明他在什么条件下愿意提供他的通道供使用。由于这是一项高度竞争的业务，且边际成本非常低，目前的交易费用在几个\
  \ satoshi 之间。\n\n此外，Brian 对保持其支付通道平衡也有兴趣。如果他经常向 Emanuel 付款，整个通道余额最终将归 Emanuel 所有。为了解决这个问题，Brian\
  \ 和 Emanuel 可以为反向流提供他们的支付通道，从而重新平衡通道内的资金分布。\n\n当然，Tamara、Brian 和 Emanuel 并不需要手动完成所有这些步骤。他们在电脑上安装了闪电客户端，用于管理支付通道并寻找支付的最有效路由。路由——即寻找网络中的路径——在技术上是闪电网络最具挑战性的方面，因此，也是目前正在进行重大开发的领域。多个团队正致力于实现、达成共同标准，并确保各种实现之间的兼容性。\n\
  \n在此必须提到，我们省略了两个关键点。首先，闪电支付可以涉及多个路径；但是，为了系统的安全性，每个步骤至少增加一个区块。其次，从 Emanuel 到 Tamara\
  \ 的交易需要 `t` 个区块，而 Tamara 到 Brian 的交易需要 `t + 1` 个区块。\n\n结论，闪电网络是一项年轻但非常有前景的技术。根据你的政治观点，这可能是卖点，也可能是担忧。\n\
  \n## 6.3 采用\n\n比特币单位已经可以交换商品和服务。然而，它的市场接受度远低于政府发行的法币。\n\n另一个原因是这种新技术的复杂性以及缺乏用户友应用程序。长期来看，复杂性并不是问题。很少用户理解他们使用的底层技术。然而，严重的简化可能会引入第三方依赖并削弱比特币的一些优势。未来几年将证明比特币技术是否能够进入主流。\n\
  \n在下文中，我们将首先展示比特币网络各种活动指标的演变。随后，我们将考虑对比特币采用产生重大影响的问题。\n\n### 6.3.1 作为活动指标的交易\n\n\
  图 6.5 显示了每日确认交易的数量。这个数字是网络活动水平的指示。然而，由于交易类型的多样性，不应过度估计它的解释能力。如果一个人需要进行十次支付，他可以通过一次或十次交易来实现。垃圾交易或单次传输数百甚至上千个比特币单位的支付可能会从任何方向扭曲画面，导致对实际活动水平的过高或低估。\n\
  \n我们通过考虑规定时间内传输的比特币总量来解决这个问题。但即使这个活动指标也有根本性问题。它没有考虑到比特币单位价值随时间变化的事实。这些价格变化意味着数据在不同时间之间是不可比的。\n\
  \n\n\n\n在图 6.14 中，我们使用相应的每日美元汇率评估了比特币的交易量。显而易见的是，从真实的经济角度来看，2011 年底的峰值（图 6.13）并没有像原始可视化结果所示的那样重要。\n\
  \n![图 6.14 每日估计比特币交易量（百万美元）。来源：来自 Blockchain Explorer，n.d., https://www.blockchain.com/explorer.](img/fig6-14.png)\n\
  \n图 6.14\n\n每日估计比特币交易量（百万美元）。\n\n来源：来自 Blockchain Explorer，n.d.，[`www.blockchain.com/explorer`](https://www.blockchain.com/explorer)。\n\
  \n然而，图 6.14 必须必须谨慎解读。交易数量或交易量都无法反映交易的性质。人们通常有许多伪名。因此，一笔交易可能仅代表用户组合的重新调整，即将比特币单位分配给同一人的其他伪名。\n\
  \n此外，包含在图 6.5、6.13 和 6.14 中的交易是已记录比特币区块链的交易。中心化交易所内的交易未包含在这些统计中。中心化交易所仅对内部比特币交易更新客户要求的内部会计。只有当客户决定从交易所提取比特币单位时，才会发生区块链交易。此外，该衡量忽略了任何通过支付通道进行的付款。\n\
  \n### 6.3.2 比特币通胀与交易费用\n\n交易费用是许多人不愿使用比特币的潜在原因。在比特币存在的前几年里，低交易费用是支持使用比特币支付的主要理由之一。这种情况在\
  \ 2017 年的牛市期间发生了剧变。交易费用飙升的根源显然由于第 6.2 节中讨论的可扩展性问题。图 6.15 显示了美元平均交易费用的演变。\n\n![图\
  \ 6.15 以美元支付的平均交易费用。每日平均值。来源：来自 Blockchain Explorer，n.d., https://www.blockchain.com/explorer.](img/fig6-15.png)\n\
  \n图 6.15\n\n以美元支付的平均交易费用。每日平均值。\n\n来源：来自 Blockchain Explorer，n.d.，[`www.blockchain.com/explorer`](https://www.blockchain.com/explorer)。\n\
  \n交易费用仅代表交易经济成本的一部分。除了费用外，矿工还以新创建的比特币单位形式获得固定奖励。这导致了货币供应的扩张，并对现有持有者构成了成本。这种机制在文献中被称为\
  \ `inflation tax`（通胀税）。\n\n图 6.15 显示了美元平均交易费用的演变。\n\n交易费用仅代表交易经济成本的一部分。除了费用外，矿工还以新创建的比特币单位形式获得固定奖励。这导致了货币供应的扩张，并对现有持有者构成了成本。这种机制在文献中被称为\
  \ `inflation tax`（通胀税）。\n\n图 6.15 显示了美元平均交易费用的演变。\n\n\n\n\n这个问题是比特币成功的直接结果。在第 2.5.4\
  \ 节关于比特币价格发展的年史中，我们描述了首次有记录的比特币市场价格，当时人们用 10,000 个比特币交易了两块披萨。今天，由于比特币单位价值的巨大增长，以比特币计算的披萨价格涉及许多小数。\n\
  \n这种价格是有问题的，因为各种营销研究表明，消费者在正确解释和比较包含小数的数字时存在困难.^(\\[150\\])例如，许多消费者无法立即识别出 0.0531\
  \ 几乎是 0.0089329 的六倍。\n\n然而，这种批评只有部分是合理的，因为参考单位可以很容易调整。比特币价格可以用比特币单位的分数来表示——即以“位”（bits），每位对应一个比特币单位的百万分之一.^(\\\
  [235\\]）表 6.4 显示了比特币单位的不同计量单位。\n\n表 6.4\n\n比特币单位的可能计量单位。\n\n| 子单位 || 以比特币单位计 |\n\
  | --- | --- |\n| 1 Bitcoin | 1 Bitcoin |\n| 1 分比特币 (Deci-Bitcoin) | 0.1 Bitcoin\
  \ |\n| 1 厘比特币 (Centi-Bitcoin) | 0.01 Bitcoin |\n| 1 毫比特币 (Milli-Bitcoin) | 0.001\
  \ Bitcoin |\n| 1 Bit (Micro-Bitcoin) | 0.000001 Bitcoin |\n| 1 聪市 (Satoshi) | 0.00000001\
  \ Bitcoin |\n\n### 6.3.4 确认时间\n\n另一个问题是交易获得确认所需的时间。由于新区块通常每十分钟生成一个，确认交易的平均时间也会在这个范围内。此外，区块生成的概率性质使得这些等待时间变得不可预测。因此，可能会几乎立即收到确认，也在几小时后才收到确认。\n\
  \n在在线购物的情况下，这种延迟很少引起问题。但在销售点终端（POS）购买时，长时间且不可预测的等待时间是不可接受的。一个常见的例子是咖啡店的交易.^(\\[235\\\
  ]）\n\n有几种方法可以解决这个问题。关于等待时间，首先必须注意到，在处理小额金额时，未确认的交易可以提供足够的安全性。特别是，如果商户拥有稳定的网络连接并等待几秒钟，客户交易将极高概率包含在区块链中.^(\\\
  [19\\]）此外，还有一些服务提供商要求交易不仅由客户签名，还要由相应的支付服务提供商签名。这意味着客户能够合理地证明，在没有支付服务提供商帮助的情况下，他或她无法发布竞争性交易。这种支付可以被视为立即有效，因为在这些条件下无法进行双花费攻击.^(\\\
  [37\\]）最后但同样重要的是，支付通道和闪电网络交易是即时有效的（参见第 6.2.3 节）。\n\n### 6.3.5 比特币的分布\n\n2014 年进行的一项研究显示，最多有\
  \ 120 万人拥有比特币.^(\\[117\\]）这一数字基于拥有显著比特币余额的比特币地址数量。由于一个用户可以拥有多个比特币地址，这个对比特币地址的估计构成了可能用户数量的上限。表\
  \ 6.5 展示了使用 2019 年 2 月数据集的类似分析结果.^(\\[38\\]）令人震惊的是，当时几乎 20% 的所有比特币单位仅由 115 个地址所有。其他分析甚至一直到计算基尼系数来衡量比特币网络内的财富分布.^(\\\
  [210\\]）表 6.5 显示，大量的比特币单位分布在相对较少的地址中。由于这些地址无法与任何托管服务提供商关联，因此必须假设这些地址对应的比特币单位属于一个人（向公钥哈希支付）或少数几（向脚本哈希支付）。\n\
  \n表 6.5\n\n比特币网络内的财富分布。\n\n![](img/table6-5.png)\n\n所有这些研究都必须谨慎对待。基本问题是，这些研究使用假名将相应的比特币余额分配给个人。然而，由于大多数比特币用户使用许多假名，因此无法将比特币单位准确分配给真正拥有它们的个体.^(21)。此外，某些地址属于交易所，这意味着比特币单位由许多人所有。此外，许多地址并不由单一用户控制。例如，具有多签名条件的向脚本哈希支付地址可能由多个方控制（参见\
  \ 4.5 节）。最后，还存在价值极高的区块链交易，它们是作为压力测试或攻击网络的一部分执行的。交易价值通常低于交易成本，因此作为“比特币粉”（比特币单位的极小部分）留在大量不同的地址中。\n\
  \n尽管我们不鼓励不加批判地使用这些指标，但表 6.5 表明，确实有些人拥有大量的比特币单位。这些人被称为`比特币鲸鱼`。比特币鲸鱼可能是财务实力雄厚的个人，他们进行了大量投资，或者是早期参与并通过购买或挖矿活动积累了大量比特币单位的用户。\n\
  \n大卖单会对比特币价格产生重大影响。此类事件的一个例子可以在 2014 年 10 月 6 日看到，当时约 26,000 个比特币单位被转移到交易所并出售。比特币的市场价格立即下跌了约\
  \ 10%.^(\\[186\\]）这一事件在图 6.18 中有所插图，在比特币社区中被称为“猎杀鲸鱼”^(22)，这是个人可以产生巨大价格影响的象征性事件。\n\
  \n![图 6.18 鲸鱼出现时 BitStamp 交易所的比特币价格。时间为 2014 年 10 月 5 日至 6 日。来源：BitInfoCharts，加密货币统计，网站，2014\
  \ 年 10 月 5 日至 6 日，bitinfocharts.com。](img/fig6-18.png)\n\n图 6.18\n\n鲸鱼出现时 BitStamp\
  \ 交易所的比特币价格。时间为 2014 年 10 月 5 日至 6 日。\n\n来源：BitInfoCharts，加密货币统计，网站，2014 年 10 月\
  \ 5 日至 6 日，bitinfocharts.com。\n\n框 6.13\n\n中本·聪奇的财富\n\n最有可能积累大量比特币单位的人是中本·聪奇。他的财富估计约为一百万个比特币.^(\\\
  [140\\]）有趣的是，尽管在比特币价格处于巅峰时，他的持仓价值接近 200 亿美元，但从未移动过。\n\n\n\n\n\n比特币系统的许多用户认为，管理这些比特币单位的私钥已经被丢弃。尽管如此，人们应该始终意识到一种可能性：这些货币可能会突然进入市场，并对比特币价格产生巨大的下行压力。此外，如果比特币的发明突然出售，很可能对市场产生强烈的负面心理影响。\n\
  \n## 6.4 政治挑战\n\n比特币面临的不仅是技术和经济挑战，还有政治挑战。主要的批评点在于挖矿消耗了大量电力、其可能用于洗钱和逃税等非法活动的风险，以及监管上的不确定性。\n\
  \n### 6.4.1 用电量\n\n工作量证明挖矿消耗大量的电力。让我们通过首先计算比特币挖矿的用电量来探讨这一观察。在本节，我们我们提供关于计算比特币用电量所需参数的概述，并对\
  \ 2018 年进行了一个非常粗略的计算。更详细的估算请参考 Alex de Vries 在 2018 年的文章。\n\n计算比特币挖矿用电的一种简单方法是意识到，在竞争性市场中，生产区块的预期边际成本等于边际收益；即：\n\
  \n![](img/pg218-1.png)\n\n比特币挖矿的边际收益是区块奖励和挖掘区块时获得的交易手续费之和。2018 年，区块奖励为 12.5 个比特币，为了简单起见，我们将忽略交易手续费收入。矿工的大部分费用必须用货币支付，因此我们需要计算区块奖励的美元价值。为了简单起见，我们假设\
  \ 2018 年比特币价格恒定为 4,000 美元。在这些假设下，每个区块的边际收益为 50,000 美元。\n\n挖矿存在固定成本和变动成本。为了简单，我们忽略固定成本，并假设唯一的变动成本是电力。在竞争性市场中，挖矿业务是自由进入的。这意味着矿者的进入和退出一直持续，直到挖掘一个比特币的预期边际成本等于挖掘比特币的边际收益；即\
  \ `MC` = `MR` = 4,000 美元。\n\n现在我们准备计算比特币网络每年的耗电量。平均而言，每十分钟创建一个区块。这意味着每天产生 144 个区块，因此每年产生\
  \ 52,560 个区块。由于每个区块产生 12.5 个比特币，这一年内产生了 657,000 个比特币。假设比特币价格恒定为 4,000 美元，总收益为 2,628,000,000\
  \ 美元。在我们的许多简化假设下，电力支出相同。\n\n要计算以千瓦时的电量，我们需要对电价做一个假设。由于电力是矿工的重要成本组成，大多数矿工位于电成本低的地区。因此，我们假设每千瓦时（`kWh`）十分美元，根据我们的计算，这意味着总量为\
  \ 26,280,000,000 kWh。\n\n剩下的工作是查找记录各国用量的表格。此类数据可以在维基百科等地找到，并汇总在表 6.6 中。\n\n[表 6.6]\n\
  \n不同国家的用电量。\n\n![](img/table6-6.png)\n\n表中的数据来自 2014 年。然而，我们在计算中采取了许多捷径，这种时间上的不匹配是一个无关紧要的细节。我们目的目的是展示如何计算和比较比特币与其他耗电实体的耗电量的基础。事实上，更复杂的估算也得出了相似的值。\n\
  \n我们的计算证明，获得比特币耗电量的估算很容易。相比之下，从规范角度评估其结果要困难得多。这种耗电量是一个问题吗？是否因为环境原因应该废除比特币？这个问题的答案取决于个人观点。从我们的角度来看，抗审查数据库和无许可加密资产的社会效益非常高。此外，使用的电力的类型也很重要。电力是通过可再生资源产生的吗？它对全球变暖贡献了多少？这些都是未来研究的问题。\n\
  \n最后，我们想提醒给感兴趣的读者，中心化支付系统也非常消耗资源。除了基础设施和运营成本，还必须计算所有参与维护国家乃至世界现有支付基础设施的金融实体的显性和隐性资源消耗，考虑到比特币是一种跨越国界的资产。工资和基础设施成本应计入显性成本，而滥用中心化支付基础设施的可能性应计入隐性成本。\n\
  \n遗憾的是，我们没有发现任何可以估算一个国家甚至全球支付基础设施维护成本的数据。尽管如此，我们可以通过提供欧洲中央银行（`ECB`）的数据来提供提示。2017\
  \ 年，`ECB` 的总运营成本（包括折旧和钞币生产成本）为 1,075,000,000 欧元。根据我们的计算，以美元计算，这大约是维护当前形式比特币系统成本的\
  \ 50%。`ECB` 并不是欧元区支付系统的唯一参与者。为了获得全面的视图，我们必须包括参与支付系统的私人银行和其他私人金融机构的成本。一旦加上私营部门，我们将轻松超过维护比特币网络的成本。此外，这个粗略的估算并不包括上述的任何隐性成本。\n\
  \n我们如何将这些运营成本与比特币的耗电量进行比较？我们不知道。我们确定的是，支付领域有成千上万的男女工作，这些人人都使用电力、乘飞机参加会议并通勤上班。计算维护当前支付系统的能源消耗将非常有趣。这留给未来的研究。\n\
  \n### 6.4.2 监管不确定性与非法活动\n\n据我们所知，没有可靠的数据表明比特币被用于洗钱或逃税等非法活动。尽管如此，即使在比特币系统生命的非常早期，政治家和监管机构就表示担心，比特币可能成为犯罪分子隐藏财务活动的首选。一个典型的例子是\
  \ 2011 年开放的市场 `Silk Road`。它在暗网用户中迅速流行，用户可以交易从武器到非法毒品的各种物品。为了确保客户的匿名性，`Silk Road`\
  \ 只接受比特币作为支付工具。\n\n\n\n\n几年后，这些担忧仍然存在，但事实也已明确：比特币作为非法活动的支付工具是一个非常糟糕的选择。原因是比特币区块链是一个公共账本。交易信息被永久存储，用户如果想保持匿名，必须非常小心。事实上，调查比特币区块链上支付流的取证方法已变得日益复杂，并能够很好地关联多个比特币地址，有时甚至能追踪到所有者的身份。我们预计这些取证方法将随着时间的推移而显著改进，因此，我们强烈建议不要将比特币用于非法活动。\n\
  \n尽管如此，比特币仍将是全球监管机构的焦点。截至目前，尚未通用的国际比特币监管方法。在某些国家，使用比特币是非法的，而在另一些国家则适用标准的反洗钱法。在大多数国家，监管机构仍在讨论如何将比特币纳入其现有的监管框架中。因此，我们预计随着时间的推移，会有额外的监管措施。\n\
