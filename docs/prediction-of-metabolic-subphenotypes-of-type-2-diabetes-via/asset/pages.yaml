    # Methods


    This study is part of the Precision Diets for Diabetes Prevention clinical trial
    (NCT03919877).


    # Study participants


    The study protocol and clinical investigation were approved by the Stanford University
    School of Medicine Human Research Protection Office (Institutional Review Board
    #43883). Participants provided written informed consent. Participants were recruited
    from the San Francisco Bay Area via locally placed advertisements online, in local
    newspapers and during faculty lectures to the community. Participants were screened
    with a medical history and physical examination in the Stanford University Clinical
    and Translational Research Unit (CTRU), where vital signs, fasting blood plasma
    glucose and baseline haemotocrit, alanine aminotransferase (ALT) and creatinine
    were obtained. Eligibility criteria included age of 30–70 years, BMI of 23–40
    kg m⁻², absence of major organ disease, absence of type 2 diabetes defined by
    personal history or fasting glucose ≥126 mg dl⁻¹, uncontrolled hypertension, malignancy,
    chronic inflammatory conditions, use of any medications known to alter blood glucose
    or insulin sensitivity, haematocrit <30, creatinine above the normal range and
    ALT >2-fold above the upper limit of the normal range.


    Initial cohort. A total of 36 participants enrolled and 32 completed all medical
    tests and were included in the final analyses as the main study cohort (also called
    training cohort) (Table 1 and Supplementary Table 1).


    Validation cohort. An independent cohort of 24 individuals completed OGTT and
    IST in the CTRU, as well as measurement of HbA1c and lipid panel.


    At-home CGM cohort. The validation cohort plus 5 of the initial cohort (n = 29)
    was used for CGM analysis both in the CTRU (they were measured simultaneously
    during the OGTT test with plasma sampling and a blinded Dexcom G6 CGM), and two
    at-home glucose-tolerance tests on separate mornings under standardized conditions
    (see below).


    # Quantitative metabolic physiological tests


    All tests were performed in the Stanford CTRU after a 10-h overnight fast.


    (1) Frequently sampled OGTT. Participants were instructed to avoid celebratory
    or restrictive eating and unusual physical activity for 3 days before performing
    the test, fast 10–12 h before the test, have no strenuous exercise after 17:00
    the evening before the test and no smoking or using a nicotine patch the morning
    of the test. Dynamic plasma glucose profiles were obtained after administration
    of a 75-g oral glucose load over 5 min (Brand Trutol, Thermo Fisher, 75 g in a
    10-oz serving). Plasma samples were drawn from an antecubital intravenous catheter
    drawn at 16 timepoints (−10, 0, 10, 15, 20, 30, 40, 50, 60, 75, 90, 105, 120,
    135, 150 and 180 min). Glucose level was measured at the timepoints using the
    oximetric method; insulin and C-peptide using the Millipore radioimmunoassay assay,
    both at 7 timepoints (0, 15, 30, 60, 90, 120 and 180 min); GLP-1 using the Millipore
    ELISA EZGLPIT-36K kit, GIP using the Millipore ELISA EZHGIP-54K kit, and glucagon
    using the Mercodia


    ELISA 10-1271-01 kit, all at 4 timepoints (0, 30, 60 and 120 min). Insulin, C-peptide,
    GLP-1, GIP and glucagon were measured at the Core Lab for Clinical Studies, Washington
    University School of Medicine in St. Louis. From the baseline sample (at 0 min),
    HbA1c, fasting plasma glucose, insulin, triglyceride and HDL cholesterol levels
    were determined.


    # (2) At-home OGTT with CGM.


    Participants wearing CGM were instructed to do two at-home OGTTs that were standardized
    to minimize environmental influences that might lead to variability in results.
    The two at-home OGTTs were performed within a single CGM sensor session (10 days).


    After an overnight fast, a 75-g glucola drink (NERL Trutol, Thermo Fisher) was
    consumed in 10 oz over 5 min and for 3 h, no oral intake other than water was
    allowed, and the patients remained seated, identical to the OGTT procedure performed
    in the CTRU. Participants were required to do this test during a typical week
    that was devoid of celebratory or restrictive eating (for example, wedding or
    religious holiday), with usual activity patterns (no unusual activity/training
    outside their typical patterns); to refrain from eating out, performing strenuous
    exercise after 17:00 the night before the test, eating or consuming anything other
    than water after 22:00 on the evening before and morning before the test; and
    to avoid smoking or using a nicotine patch the morning of the test.


    # (3) Isoglycaemic intravenous glucose infusion.


    IIGI, as previously described⁴⁶, was performed to quantify the incretin effect
    by duplicating the plasma glucose profile during the concurrently OGTT. During
    the IIGI test, an intravenous catheter was placed in the antecubital vein for
    administration of a continuous dextrose infusion at a rate needed to obtain the
    desired glucose, which for each timepoint was the glucose level obtained at the
    same timepoint during the OGTT. Blood sampling from a second intravenous catheter
    included the same timepoints and assays as described above for the OGTT.


    # (4) Insulin suppression test.


    Insulin-mediated glucose disposal was quantified by the modified insulin suppression
    test as originally described and validated³⁸⁻⁴⁰. Briefly, participants were infused
    for 240 min with octreotide (0.27 µg m⁻² min⁻¹) (to suppress endogenous insulin
    secretion), insulin (32 mU m⁻² min⁻¹) and glucose (267 mg m² min⁻¹). Blood was
    drawn at 30-min intervals for monitoring and at 10-min intervals from 210 to 240
    min of the infusion to measure plasma glucose and insulin concentrations, and
    the mean of these four glucose values (210, 220, 230, 240 min) was used as the
    steady-state plasma insulin (SSPI) and glucose (SSPG) concentrations for each
    individual. As SSPG concentrations were similar in all participants during these
    tests, the SSPG concentration provided a direct measure of the ability of insulin
    to mediate disposal of an infused glucose load; the higher the SSPG concentration,
    the more insulin resistant the individual.


    # (5) Measurement of plasma glucose.


    Blood was drawn from an intravenous catheter placed in the antecubital fossa which
    was warmed with a heating pad to obtain arterialized venous blood. The blood sample
    was run to the CTRU lab, spun for 2 min and plasma was analysed on the glucose
    analyzer (YSI 2500) calibrated to the clinical laboratory glucose values at our
    institution. This method allowed for immediate bedside glucose results so that
    for the IIGI (above), the glucose infusion rate could be altered every 5 min as
    needed to mimic the glucose curve generated by the OGTT.


    # Metabolic calculations


    (1) Muscle insulin resistance (SSPG). While SSPG as described above reflects whole-body
    insulin-mediated glucose disposal, 85% of this occurs in muscle⁷ and thus, to
    distinguish this measure from hepatic insulin resistance, the term ‘muscle’ insulin
    resistance is used'
