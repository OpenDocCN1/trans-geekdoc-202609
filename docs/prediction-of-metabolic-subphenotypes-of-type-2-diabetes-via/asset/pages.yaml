- pgno: 1
  md: 'We propose that classifying individuals with prediabetes, diabetes risk factors
    and newly diagnosed T2D according to their underlying metabolic physiology rather
    than level of glycaemia is possible and could enable a precision-medicine approach
    to diabetes prevention and treatment. Not only might metabolic subphenotypes pose
    differential risk for conversion to T2D, diabetes-related complications and/or
    CVD, they might determine relative efficacy of pharmacological and lifestyle therapies.
    Multiple approved T2D treatments targeting specific physiologic components of
    glucose regulation now exist, virtually all of which have also been proven to
    prevent progression to T2D in high-risk individuals^14–17. Efficacy in diabetes
    prevention varies between individuals, however, with more obese and younger individuals
    responding better to metformin over lifestyle interventions, and older less obese
    individuals responding better to lifestyle interventions^14. Similarly, among
    non-insulin-treated diabetes starting monotherapy for T2D, females and patients
    with higher BMI responded better to thiazolidinediones, whereas males and patients
    with lower BMI responded better to sulfonylureas^18. Heterogeneity in responses
    may reflect the heterogeneity in underlying physiology, since both pharmacologic
    and lifestyle interventions target different physiologic pathways to hyperglycaemia.
    Lifestyle interventions such as weight loss and exercise reduce insulin resistance^19,20,
    whereas reducing dietary sugar and glycaemic load might benefit those with β-cell
    deficiency and/or incretin deficits; metformin reduces hepatic glucose production,
    acarbose prevents absorption of dietary carbohydrates in the small intestine,
    thiazolidinediones are powerful insulin sensitizers and GLP-1agonists augment
    β-cell insulin secretion and reverse insulin resistance via weight loss. Thus,
    phenotyping individuals according to underlying metabolic physiology might allow
    for targeted therapy at an early stage to prevent and/or treat T2D.


    There is growing interest in identifying scalable cost-effective tests that capture
    the complexity of T2D phenotypes to inform precision-medicine approaches. These
    include partitioned genetic risk scores^21, clinical and demographic features^22,
    glucose metabolite biomarkers, clinical outcomes^23–28 and even wearable devices^2,29.
    The most common test for glycaemic disorders is the oral glucose-tolerance test
    (OGTT), which has been standardized and used globally for over 100 years. Limitations
    of fasting plasma glucose (FPG) in identifying early dysglycaemic states led to
    widespread use of the OGTT for epidemiological studies as well as clinical practice.
    Metrics such as the 2 h glucose, 1 h glucose, area under the curve and shape of
    the curve during a 3- or 5-timepoint OGTT have shown utility in predicting progression
    to T2D, development of microvascular disease, cardiovascular events and total
    mortality^30,31. Furthermore, differences in the relationship between fasting
    and 2-h glucose elevations with hepatic IR, muscle IR and β-cell function highlighted
    the potential for OGTT to define underlying pathophysiology^30,32–37. The burden
    of performing this test has limited its use clinically, particularly with regard
    to multi-timepoint analyses, which in 1980 were simplified to the fasting and
    2-h timepoints alone. With the advent of continuous glucose monitor (CGM), it
    is possible to perform facile time-series measurements of glucose levels and OGTTs.
    We hypothesized that features of a 16-point glucose curve generated in response
    to standardized administration of an oral glucose


    load could identify the specific metabolic abnormalities underlying glucose dysregulation,
    which, if replicated by CGM-derived curves, would represent a scalable, practical
    and relatively cost-effective method that could facilitate individualized prevention
    and treatment of T2D, thereby enhancing precision approaches to diabetes.


    In this work, we quantify the degree to which the physiologic basis for glucose
    dysregulation differs between individuals, who can be classified according to
    their metabolic subphenotypes. We also present a comprehensive framework using
    machine learning by which metabolic subphenotypes can be identified using features
    of the glucose time series extracted during a 16-point glucose-tolerance test.
    We then demonstrate that this can be performed at home using a CGM. The accuracy
    of this method, both in plasma and CGM, to identify underlying metabolic dysfunction
    is higher than standard measures of hyperglycaemia (for example, fasting glucose
    or HbA1c), existing biomarkers of metabolic disease (for example, HOMA) and genetic
    risk score of metabolic disease (for example, HOMA) and genetic risk markers of
    metabolic disease. Together these results demonstrate the full potential of glucose
    measurements by CGM to define the pathophysiology underlying early dysglycaemic
    states.


    # Results


    # Overview of the study and cohorts studied


    We enrolled 56 individuals without history of diabetes and fasting plasma glucose
    <126 mg dl^-1, who were classified as having normoglycaemia (n = 33) or prediabetes
    (n = 21), as well as 2 with T2D according to American Diabetes Association HbA1c
    criteria (<5.7%, 5.7–6.4% and ≥6.5%, respectively). We then used a machine-learning
    approach to determine whether we could distinguish metabolic subphenotypes on
    the basis of the shape of glucose curves from a 16-point OGTT performed in the
    Stanford University School of Medicine’s clinical translational research unit
    (CTRU) (Fig. 1a) as well as the average of two OGTTs performed at home using a
    CGM (Fig. 5a). Metabolic physiology was characterized using gold-standard tests
    as described below. Three cohorts were included in this study: (1) an initial
    cohort (n = 32) for training and testing the model, (2) a validation cohort (n
    = 24) and (3) an at-home CGM cohort (n = 29). For the main training cohort, 36
    participants were enrolled and 32 completed all metabolic tests in the CTRU. These
    32 participants were included in the final analyses as the initial training study
    cohort. An independent validation cohort of 24 participants was recruited separately
    and analysed. Finally, to test the feasibility of home CGM for metabolic subphenotyping,
    29 participants (5 of the initial cohort and 24 of the validation cohort) participated
    in the at-home OGTT/CGM study and completed a minimum of two metabolic tests in
    the CTRU. This cohort also enabled us to compare the concordance of two home CGMs
    as well as home CGM versus CTRU CGM and CTRU plasma values during OGTT. The protocol
    was approved by the Stanford Internal Review Board and conducted according to
    the principles of the Declaration of Helsinki and Good Clinical Practice (Methods).
    The cohorts’ characteristics are summarized in Table 1 and Supplementary Table
    1, and were well matched with an average age of 55 years, BMI of 26 kg m^-2, relatively
    equal male/female sex ratio, 74% Caucasian and 27% Asian ethnicity, and HbA1c
    of 5.6%.


    Fig. 1 | Metabolic subphenotyping study overview. a, Study design, where three
    cohorts were included in this study: (1) an initial cohort (n = 32) for training
    and testing the model, (2) a validation cohort (n = 24) and (3) an at-home CGM
    cohort (n = 29). Participants underwent deep metabolic profiling using gold-standard
    quantitative tests with the goal of assessing distinct physiologic phenotypes
    known to contribute to glucose dysregulation and T2D. Glucose time series following
    OGTT was used through a machine-learning (ML) approach to predict the four metabolic
    subphenotypes. b, Heterogeneity in glucose time series following a frequently
    sampled OGTT. All participants were normoglycaemic by fasting glucose <126 mg/dl.
    but were categorized as normoglycaemic, prediabetes and T2D by HbA1c values. Time
    0 on the x axis represents the time when participants consumed a 75 g glucola
    beverage. The black vertical dashed line represents the 120-min timepoint when
    glucose level is traditionally measured for clinical diagnosis of diabetes (glucose
    >200 mg/dl, red dashed line) or prediabetes (glucose 140–199 mg/dl, orange dashed
    line). c, Eight examples of insulin secretion rate (C-peptide deconvolution) normalized
    by insulin resistance (SSPG) used to infer β-cell function. d, Illustration of
    incretin effect variability. Six examples of C-peptide concentration during OGTT
    and IGI. The incretin effect is calculated as the area between the C-peptide OGTT
    and IGI divided by the area under C-peptide at OGTT. Left: poor incretin response
    (S42 and S32). Middle: moderate incretin response (S38 and S05). Right: robust
    incretin response (S01 and S15).'
