    first Z-normalized the imputed OGTT glucose time series to extract features related
    to curve patterns rather than the amplitude, then we smoothed the Z-normalized
    glucose time series using a cubic smoothing spline with a smoothing parameter
    of 0.35. Then, the data were split into a training and testing set. For the testing
    set, we extracted the reduced representation of the OGTT glucose time series using
    PCA and the top two principal components were extracted to be used in training
    machine-learning classifiers (OGTT_G_ReducedRep). For each new glucose series
    in the test set (X), the series was centred first using the mean vector of the
    training data (X_centred). The dimension of the mean vector is 1 × 16, since we
    had 16 glucose timepoints per series. Afterwards, the centred series was multiplied
    by the loading matrix (W) of the top two principal components extracted from the
    training set (equation 6). The dimension of W is 16 × 2. X_reduced is the projected
    test series on the reduced representation space of the training set.


    $X_{reduced} = X_{centred} \times W$ (6)


    **Training machine-learning models.** We next developed a machine-learning approach,
    where the two extracted sets of glucose time-series features (OGTT_G_Features
    and OGTT_G_ReducedRep) were tested independently. For each feature extraction
    approach, the dataset was split into a training set and a test set. Data were
    stratified on the basis of metabolic subphenotype class to ensure equal distribution
    of each class between training and test set. Participants from the initial venously
    sampled OGTT collection at CTRU without CGM data were assigned to the training
    set. No participants or samples existed in both training or test sets. Cross-validation
    was implemented on the training set.


    For each metabolic subphenotype, we optimized the hyperparameters of 4 different
    classifiers: support vector machine with a radial basis function kernel (SVM-RBC),
    support vector machine with a linear kernel (SVM-linear), logistic regression
    with L1 regularization (LR-L1) and random forest (RF). We used the sklearn Python
    package to train, tune and test machine-learning models. LR-L1 was trained using
    a SAGA solver and run for a maximum of 10,000 iterations to converge, with a tunable
    regularization strength hyperparameters C. SVM-RBF and SVM-linear were trained
    using the sklearn.svm.SVC method, with kernel ‘rbf’ and ‘linear’, respectively.
    The regularization parameter ‘C’ is the tunable hyperparameter of both SVM models
    (linear and RBF). The tunable hyperparameters for random forest is the number
    of estimators. We had a grid of tunable hyperparameters (5 values) and searched
    the best one on the basis of cross-validation. All models were controlled by a
    preset random seed. The total number of models was 20 (4 basic model architectures
    and 5 hyperparameter values for each model).


    Throughout the manuscript, all machine-learning experiments were conducted using
    5-fold cross-validation and iterated 100 times. This entailed dividing the training
    set of plasma glucose from OGTT at CTRU (32 participants) into 5 groups, where
    80% was used for


    model training and 20% was used for validation during each fold. In each fold,
    we calculated the auROC together with other metrics. To ensure a more rigorous
    evaluation and stable model, we repeated the above cross-validation 100 times,
    where we shuffled the data before dividing the data into folds. This ensures that
    the performance of the framework is generalizable to any division of the data.
    Different hyperparameters were tested for each model in cross-validation and the
    order was shuffled after each iteration. The final model with the selected hyperparameter
    value was chosen on the basis of best auROC in cross-validation. The process of
    hyperparameter tuning and model selection was merged in the same loop because
    of the limited training sample size. However, the shuffle process ensured an accurate
    estimation of performance. The model was then tested on the independent test set
    on both data (plasma glucose from OGTT at CTRU and CGM data), similar to the training
    set. The class imbalance problem was handled via stratified sampling to ensure
    that training and validation contained the same proportion of class samples. Importantly,
    in the second approach of feature extraction (OGTT_G_ReducedRep), reduced representation
    was obtained from the training set, not the whole dataset, and used to train each
    classifier. The test set was then projected onto the reduced representation space
    obtained from the trained dataset, and their representations were used to predict
    metabolic subphenotypes. Obtaining reduced representation space from the training
    dataset instead of the whole dataset was crucial for the robustness and generalizability
    of the model by preventing data leakage between the training dataset and the test
    dataset.


    We then conducted a comprehensive experiment to predict metabolic subphenotypes
    using the two sets of extracted features as previously discussed (OGTT_G_Features
    and OGTT_G_ReducedRep). For comparison, we evaluated the performance of these
    two feature sets to surrogate markers for metabolic phenotypes that are in current
    use, including (1) demographics (age, sex, ethnicity, BMI, family history of T2D),
    (2) T2D polygenic risk scores, (3) incretins (total GIP and GLP-1 concentration
    at hour 2 of OGTT_2h), (4) laboratory (HbA1c and FPG), (5) HOMA-B<sup>62</sup>,
    (6) HOMA-IR<sup>62</sup> and (7) Matsuda Index<sup>63</sup>. Demographics was
    evaluated alone and in all other models including our OGTT_G_Features and OGTT_G_ReducedRep
    models.


    The performance of each model on each feature set and on each metabolic subphenotype
    was evaluated using auROC. We also calculated sensitivity, specificity, F1, precision
    and accuracy. Metrics were aggregated and summarized.


    # **Model validation on an independent cohort of OGTT at the research unit.**


    The independent validation cohort was first preprocessed, then used to extract
    the two sets of glucose time series features similarly to the initial cohort.
    Then, trained models from the initial cohort were used to predict muscle IR.


    # **Statistical analyses**


    Statistical significance was performed using Wilcoxon rank-sum test with Bonferroni
    correction when multiple testing was required, such as the case with evaluating
    the metabolic subphenotype predictions using different feature sets. All P values
    were Bonferroni corrected.


    # **Visualization**


    We used the ggplot2 (v.3.3.2) and heatmap (v.1.0.12) R packages to plot most of
    the figures. Figures 1a and 5a were created using the Figma design tool (https://www.figma.com/).
    Figure 3a was created using the draw.io platform (https://app.diagrams.net).


    # **Reporting summary**


    Further information on research design is available in the Nature Portfolio Reporting
    Summary linked to this article.'
