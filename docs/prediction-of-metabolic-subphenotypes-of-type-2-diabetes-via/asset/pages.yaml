    disorders varies widely between individuals and that dominant or co-dominant metabolic
    subphenotypes exist, which has implications for precision approaches to treat/prevent
    T2D given the existence of interventions that target the separate physiologic
    components. We further show that modelling a glucose time-series response to oral
