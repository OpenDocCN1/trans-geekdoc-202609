    Continuous variables are reported as average±s.d. and categorical variables as
    frequency. LDL, low-density lipoprotein; hs-CRP, high-sensitivity C-reactive protein;
    ALT, alanine aminotransferase.


    (Fig. 2a and Supplementary Table 2). Importantly, in the current study, SSPG values
    indicating IR (>120 mg dl⁻¹) or IS (<120 mg dl⁻¹) varied despite glycemic status.
    For example, some participants with elevated (prediabetes range) HbA1c had low
    SSPG values indicating insulin sensitivity, whereas others with normoglycaemia
    were quite insulin resistant (examples in Fig. 2a). These data emphasize that
    insulin resistance is not synonymous with glycemic elevations.


    Insulin secretion rate was calculated using the widely used gold-standard C-peptide
    deconvolution method⁴²,⁴³, with C-peptide concentrations obtained at 7 timepoints
    (0, 15, 30, 60, 90, 120 and 180 min) during the OGTT. Insulin secretion was adjusted
    for insulin resistance (SSPG value) to generate a measure of β-cell function,
    referred to as disposition index (DI)⁴⁴,⁴⁵, also a validated gold-standard measure
    (Methods). In this work, DI <1.58 (50th percentile in our cohort, Extended Data
    Fig. 1b) indicates dysfunctional β-cell function, whereas DI ≥1.58 indicates normal
    β-cell function. Figure 1c demonstrates the heterogeneity of β-cell function (DI)
    in eight participants at multiple time intervals during the OGTT (see Extended
    Data Fig. 2 for all participants, and Supplementary Table 2). Participants S45
    and S57 had a high DI (4.47 and 2.88, respectively) at early time intervals following
    the 75-g oral glucose challenge, which demonstrates a ‘healthy’ β-cell function.
    On the other hand, participants S28 and S58 had extremely low DI (0.67 and 0.98,
    respectively) following the oral glucose load, which indicates dysfunctional β-cells.
    As shown in Fig. 2a–c, β-cell function was generally higher among those with normoglycaemia.
    Among those with prediabetes, the β-cell function varied widely.


    The incretin effect (IE) was measured using the gold-standard isoglycaemic intravenous
    glucose infusion test (IIGI)⁴⁶ in which glucose is infused intravenously to mirror
    the glucose curve generated after oral glucose loading (see Extended Data Fig.
    3 for concordance of glucose concentration between OGTT and IIGI). The difference
    in C-peptide concentrations during the OGTT relative to the IIGI was quantified
    at 7 timepoints (0, 15, 30, 60, 90, 120 and 180 min) to reflect the period of
    maximal hyperglycaemia (Extended Data Fig. 4). The degree to which C-peptide concentrations
    are elevated following oral versus intravenous glucose loading reflects the incretin
    effect (Methods and Supplementary Table 2). In this work, IE < 53.38% (50th percentile
    in our cohort; Extended Data Fig. 1c) indicates dysfunctional incretin effect,
    whereas IE ≥ 53.38 indicates normal incretin effect. The incretin extremely heterogenous
    between participants and did not correlate with β-cell function or insulin resistance
    as shown in Fig. 2d,g.


    Figure 1d depicts the C-peptide concentrations during oral (OGTT) as compared
    to intravenous (IIGI) glucose loading in six participants. Participants S42 and
    S32 had little difference in C-peptide responses during the OGTT and IIGI tests,
    indicating a poor incretin effect (IE of 4.80% and 23.28%, respectively). In contrast,
    participants S01 and S15 demonstrated a robust increase in C-peptide during OGTT
    versus IIGI, consistent with a high incretin effect (IE of 64.92% and 78.59%,
    respectively). Notably, the secretion of incretin hormones, as measured by glucagon-like
    peptide-1 (GLP-1) and gastric inhibitory polypeptide (GIP) concentrations, also
    varied considerably between participants (Extended Data Fig. 5a,b). Interestingly,
    IE is significantly correlated with GIP at OGTT 2-h GIP concentration (r = 0.53,
    P = 0.002), unlike GLP-1 which is not significantly correlated with IE (r = 0.3,
    P = 0.1).


    Hepatic insulin resistance (hepatic IR) was calculated using the hepatic IR index,
    which is a formula validated against endogenous glucose production measured during
    euglycaemic-hyperinsulinemic clamp⁴⁷,⁴⁸ (Fig. 2e, Methods and Supplementary Table
    2). In this work, a hepatic IR index < 4.35 (50th percentile in our cohort) indicates
    hepatic insulin sensitivity, whereas a hepatic IR index ≥ 4.35 indicates hepatic
    IR (Extended Data Fig. 1d). In our cohort, participants S58 and S44 had the highest
    hepatic IR with a hepatic IR index of 5.03 and 4.98, respectively. In contrast,
    participants S19 and S14 had the lowest hepatic IR with hepatic IR indices of
    3.57 and 3.61, respectively.


    We developed a machine-learning algorithm that used the glucose time series to
    predict metabolic subphenotypes (Fig. 1a).


    As shown in Fig. 1b, OGTT glucose time-series profiles were very heterogeneous
    across individuals, despite similar classification based on OGTT 2-h plasma glucose
    levels (normoglycaemic: glucose < 140 mg dl⁻¹, prediabetes: 140 ≤ glucose < 200
    mg dl⁻¹, diabetes: glucose ≥ 200 mg dl⁻¹). The shape of the curve was remarkably
    different with regard to ascending and descending slopes, peak height and number
    of peaks, among other characteristics. As exemplified by participants S28, S42
    and S01, some participants exhibited large rapid glucose spikes, whereas others
    (S21, S23) demonstrated little excursion at all. Some exhibited multiple glucose
    spikes (S42, S47, S55), whereas others had only a single spike (S32). Additional
    differences are apparent in Fig. 1b.


    # Heterogeneous responses to metabolic testing


    Muscle insulin resistance was measured by the modified insulin-suppression test
    (IST) and expressed as steady-state plasma glucose (SSPG)³⁵–⁴⁰. Participants were
    categorized as insulin sensitive (IS) if SSPG was <120 mg dl⁻¹ and insulin resistant
    (IR) if their SSPG was ≥120 mg dl⁻¹. Our designation of IR encompasses individuals
    above 50% of the distribution of SSPG among 490 healthy volunteers as previously
    described⁴¹. It includes those with ‘moderate’ elevations in SSPG who are more
    accurately defined as ‘non-IS’. This value also represented a natural cut-point
    in the distribution pattern of our study cohort (Extended Data Fig. 1a) and is
    clinically attractive as individuals with SSPG > 120 mg dl⁻¹, even if moderately
    IR, respond to both lifestyle and pharmacologic treatments that target IR. As
    previously observed⁴¹, SSPG values spanned a wide range from 40 (participant S19)
    to 278 mg dl⁻¹ (participant S38)'
