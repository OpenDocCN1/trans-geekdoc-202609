    For a reference copy of the document with all sections, see nature.com/documents/nr-reporting-summary-flat.pdf


    # # Life sciences study design


    All studies must disclose on these points even when the disclosure is negative.


    **Sample size** The exact contribution of each metabolic sub-phenotype to glucose
    dysregulation was unknown before the start of the study. On the basis of our previous
    experience, we estimated that 30 participants would be sufficient to uncover heterogeneity
    in metabolic sub-phenotypes and to use the data to train machine-learning models.
    We managed to recruit 32 participants for the initial cohort, and another 24 as
    an independent cohort. The third cohort was for at-home CGM, and we recruited
    29 participants (24 from the validation cohort and 5 from the initial cohort).


    **Data exclusions** No data were excluded.


    **Replication** The training was performed in a 4-fold cross-validation fashion
    and repeated 100 times. Hence, 75% of the initial cohort data were used for training
    and 25% in testing. An independent cohort was recruited to validate the trained
    models at the research unit and at home using CGM.


    **Randomization** Randomization was not applicable to the study.


    **Blinding** CGM data were collected in blinded mode, meaning that the participants
    did not see the real-time glucose values.


