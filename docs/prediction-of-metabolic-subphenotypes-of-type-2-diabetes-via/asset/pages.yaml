- pgno: 5
  md: '# Dominant metabolic subphenotype calculation


    For each participant, we attempted to determine which metabolic process was most
    impaired and thus classify individuals according to their ‘dominant’ or co-dominant
    metabolic subphenotype(s). This classification would be useful clinically to inform
    order of treatment with different therapies that target disparate physiologic
    processes. Classification entailed calculating the standard deviation values of
    each of the four metabolic measures as the deviation from the cohort mean (Methods).
    Positive deviations from the mean (shown in red or dark red on the heat map in
    Fig. 2f) indicate an unhealthy direction and negative deviations (shown as light
    orange or yellow on the heat map) indicate a healthy direction. Figure 2f highlights
    the differential deviance of each metabolic quantity per individual in our cohort.
    For example, for participant S42, the incretin effect was the metabolic subphenotype
    that was most deviant, and for participant S23, β-cell function was the most deviant—this
    method allows individuals to be classified according to the measure with the greatest
    deviance, which was termed their metabolic subphenotype. The majority of individuals
    (n = 16) had a single metabolic subphenotype that was most deviant (Methods and
    Supplementary Table 3), with β-cell function being the most frequent (n = 5),
    followed by muscle IR and incretin deficiency (n = 4 each), and then hepatic IR
    (n = 3). Thirteen participants had co-dominant metabolic subphenotypes (Supplementary
    Table 3), with hepatic IR and muscle IR, and β-cell and incretin deficiency having
    the highest prevalence (n = 4 each). Only three individuals (S35, S47, S57) could
    not be classified by this method as having a dominant or co-dominant metabolic
    phenotype. At the cohort level, we observed that individuals with high levels
    of muscle IR also had high levels of hepatic IR (r = 0.73, P = 10⁻³) (Fig. 2g).
    Indeed, a total of 13 individuals (34%) had either muscle, hepatic or combined
    IR. A total of 13 individuals had dominance or co-dominance in β-cell dysfunction
    or incretin deficiency (40%). β-Cell dysfunction was significantly correlated
    with muscle IR (r = 0.6, P = 2 × 10⁻⁴) but not with impaired incretin effect (r
    = 0.33, P = 0.06) (Fig. 2g). Impaired incretin effect was not significantly associated
    with muscle or hepatic IR (r = 0.25, P = 0.17 and r = 0.21, P = 0.24, respectively).
    These data suggest that nearly all individuals in the normoglycaemic or prediabetic
    state can be classified according to underlying metabolic physiology with similar
    balance across IR subphenotypes and insulin-secretion subphenotypes.


    # Polygenic risk score as a predictor of glycaemic level


    Each participant was genotyped using a genome-wide array and the genetic predisposition
    for T2D was quantified by calculating the T2D polygenic risk score (PRS<sub>T2D</sub>)
    based on 338 independent signals for T2D risk, as previously developed and validated⁴⁹
    (Methods and Supplementary Table 4). Figure 2h shows that the PRS<sub>T2D</sub>
    is associated with HbA1c level (r = 0.48, P = 0.005). A notable exception is female
    participant S07 (age at the time of the study is 37 years, BMI is 26.3 kg m⁻²)
    who had a high PRS<sub>T2D</sub> of 0.9, despite normoglycaemic HbA1c (5.1%),
    muscle insulin sensitivity and β-cell function (SSPG = 60 mg dl⁻¹; DI = 2.58;
    Fig. 2b,c), and intermediate incretin effect and hepatic IR (IE = 63.7%, hepatic
    IR index = 4.3; Fig. 2d,e). As expected, PRS<sub>T2D</sub> was positively correlated,
    but did not reach significant levels, with SSPG (r = 0.26, P = 0.14), hepatic
    IR (r = 0.28, P = 0.1), HOMA-IR (r = 0.3, P = 0.08), BMI (r = 0.18, P = 0.29)
    and triglycerides (r = 0.22, P = 0.21). In addition, PRS<sub>T2D</sub> was inversely
    correlated, but did not reach significant levels, with DI (r = –0.2, P = 0.25),
    IE (r = –0.16, P = 0.36), HOMA-B (a surrogate marker for β-cell function) (r =
    –0.32, P = 0.06) and high-density lipoprotein (HDL) (r = –0.28, P = 0.12).


    # Features of the glucose response curve during OGTT identify metabolic subphenotypes


    Our main objective was to determine whether we could predict metabolic subphenotypes
    from the glucose time-series response


    obtained from the standard OGTT test (Supplementary Table 5). To achieve this,
    we developed a robust machine-learning framework in which features were extracted
    from the OGTT glucose time series using two approaches: (1) engineered features
    from the OGTT glucose time series (OGTT_G_Features) and (2) a reduced representation
    method (OGTT_G_ReducedRep) that represents each each normalized and smoothed OGTT
    curve with a vector of 2 dimensions (Fig. 3a). In the first approach (OGTT_G_Features),
    we extracted 14 features from the OGTT glucose time series (Methods). Figure 3b
    shows that multiple extracted features from OGTT glucose time series were significantly
    correlated with metabolic subphenotypes (P < 0.05, marked with an ‘X’ in Fig.
    3b). Area under the curve (AUC) and incremental (i)AUC were the two highest significantly
    positively correlated features with muscle IR (r = 0.59 and P = 3 × 10⁻⁴, r =
    0.57 and P = 6 × 10⁻⁴, respectively). Glucose levels at 120 min (G<sub>120</sub>)
    and iAUC were the top two negatively correlated with β-cell function (r = –0.59
    and P = 4 × 10⁻⁴, r = –0.55 and P = 3 × 10⁻³, respectively). Positive (p)AUC and
    glucose peak levels (G_Peak) were the top two features significantly negatively
    correlated with the incretin effect (r = –0.72 and P = 6 × 10⁻⁵, r = –0.68 and
    P = 2 × 10⁻⁵, respectively). Finally, the slope from peak to the end at 180 min
    (S_peakEnd) and baseline glucose levels (G<sub>0</sub>) were the top two parameters
    significantly correlated with hepatic IR (r = –0.51 and P = 0.002, r = 0.47 and
    P = 0.006, respectively).


    In the second approach (OGTT_G_ReducedRep), we first Z-normalized and smoothed
    the OGTT glucose time series of 16 timepoints (Extended Data Fig. 6). We then
    extracted the reduced representation of the OGTT glucose time series (Methods).
    Interestingly, using the reduced representation of the OGTT glucose time series,
    there was a very clear separation of muscle IR and IS (Fig. 3c). In addition,
    the reduced representation of OGTT glucose time series readily distinguished the
    three classes of β-cell function (normal, intermediate and dysfunction) (Fig.
    3d). Individuals with normal β-cell function were located on the positive side
    of the first principal component (PC1). In contrast, individuals with β-cell dysfunction
    were found on the negative side of PC1, and individuals with intermediate β-cell
    function were found in between. The same pattern was observed for incretin effect
    classes (Fig. 3e), where participants with normal versus impaired incretin effect
    were reasonably well separated. Participants with an intermediate incretin effect
    overlapped with the two more-extreme groups. On the other hand, hepatic IR classes
    were not separable using the reduced representation of the processed OGTT glucose
    time series (Fig. 3f).


    We calculated the correlations between the top 2 PCs, OGTT_G_ReducedRep, and the
    extracted features, OGTT_G_Features (Extended Data Fig. 7). We found a relationship
    between the first two PCs and the 14 extracted curve features. The first two PCs
    are used to reduce the dimension in feature space while capturing the major variances
    (43.8% and 18% for PC1 and PC2, respectively). For example, higher positive values
    on PC1 are associated with lower iAUC, which from Fig. 3b, was associated with
    muscle IS. Figure 3c also confirms this relationship whereby muscle-IS participants
    are clustered towards higher positive values of PC1.


    # Predicting metabolic subphenotypes from glucose time series using machine learning


    The separability in the classes of muscle IR, β-cell function and incretin effect,
    using the reduced representation of the processed OGTT glucose time series suggested
    that a robust prediction of such classes could be achieved using a learning framework.
    For each feature extraction approach, OGTT_G_Features and OGTT_G_ReducedRep, the
    dataset was split into a training set and a test set. For each metabolic subphenotype,
    we optimized the hyperparameters of four different classifiers: random forest
    (RF), support vector machine with a radial basis function kernel (SVM-RBC), support
    vector machine with a linear kernel (SVM-linear) and logistic regression with
    L1 regularization (LR-L1).'
