  md: '# # Unique glycaemic responses to oral glucose load


    To characterize the dynamic pattern of the glucose time series during the OGTT,
    we measured plasma glucose concentrations at 5–15-min intervals (16 timepoints)
    for 180 min following administration of a 75-g oral glucose load under highly
    standardized conditions (Methods) in the Stanford CTRU. We then performed deep
    metabolic profiling using gold-standard quantitative tests with the goal of assessing
    four distinct physiologic phenotypes known to contribute to glucose dysregulation
    and T2D: muscle IR, β-cell dysfunction, impaired incretin action and hepatic IR
    (Fig. 1a and Methods).


