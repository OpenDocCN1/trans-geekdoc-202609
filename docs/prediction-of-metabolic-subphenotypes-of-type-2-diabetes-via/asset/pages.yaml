    **Extended Data Fig. 2 | Insulin secretion rate measured during OGTT** normalised
    by SSPG used to infer β-cell function. The insulin secretion rate was calculated
    using the C-peptide deconvolution method with C-peptide concentrations obtained
    at seven timepoints (0, 15, 30, 60, 90, 120, 180 min) during the OGTT, which was
    then adjusted for insulin resistance to generate a measure of β-cell function.
