    # Discussion


    T2D and its precursor, prediabetes, are currently defined on the basis of glycaemic
    level rather than underlying pathophysiology. However, the mechanistic basis is
    complex and several distinct pathophysiological processes contribute. Here we
    demonstrate that individuals with glucose ranging from normoglycaemic to prediabetes
    exhibit clear heterogeneity in four distinct physiologic processes that contribute
    to disordered glucose metabolism, including muscle IR, β-cell dysfunction, impaired
    incretin effect and hepatic IR. We clearly showed that these phenotypes do not
    necessarily correlate with traditional glucose measures such as HbA1c and thus
    cannot be estimated in this way. Using gold-standard physiologic tests and expressing
    values for each individual as the relative deviance from the cohort mean, we expressed
    the degree to which each process was abnormal. The majority of individuals exhibited
    a single dominant metabolic subphenotype or two co-dominant phenotypes. These
    partitioned generally into IR dominant subphenotypes (muscle and liver IR), comprising
    34% of the cohort, or insulin secretion subphenotypes (B-cell and incretin deficit),
    comprising 40% of the cohort. Muscle and hepatic IR were highly intercorrelated
    and frequently exhibited co-dominance. This suggests that from a clinical classification
    perspective, muscle and hepatic IR might be combined into one group classified
    as ‘insulin resistant’, and therapies known to improve insulin resistance (such
    as dietary or pharmacologic weight


    loss (including GLP-1 or dual GLP-1/GIP agonists), physical activity, metformin,
    thiazolidinediones) could be used as initial treatment. β-cell and incretin deficiency
    phenotypes, together accounting for the majority of patients, might be amenable
    to similar treatment strategies that target insulin secretion since this is the
    common denominator in the pathophysiology for both of these subphenotypes. These
    include agents that augment or replace insulin secretion or incretin action (for
    example, sulfonylureas, glinides, DPP4 inhibitors, GLP-1 agonists or GLP-1-GIP
    dual agonists, or insulin). Only 9% of participants could not be classified as
    having a dominant or co-dominant metabolic subphenotype, thus indicating that
    use of the glucose ‘shape of the curve’ method to identify underlying physiology
    could inform targeted approaches for diabetes prevention or treatment.


    Historically, subclassification of T2D into more-specific subtypes has been limited
    by the lack of feasible scalable standardized diagnostic tests. The requirement
    for laborious and invasive research tests to characterize underlying metabolism
    precludes their use outside of a research setting, and surrogates such as HOMA-IR
    only explain 40% of insulin resistance⁴¹ and are limited by lack of standardization
    of insulin concentrations across laboratories. Recent advances in understanding
    the underlying biology of glycaemic disorders and the development of pharmacologic
    therapies targeting multiple distinct pathways to hyperglycaemia render a physiologically
    based subclassification of prediabetes and T2D more important than ever.


    In fact, the scientific discovery regarding the ‘incretin’ effect has led to the
    development of an entire new class of effective pharmacotherapies for T2D. Other
    classes of glucose-lowering therapeutics, as well as dietary weight loss and exercise
    target insulin resistance, β-cell function, hepatic glucose production and urinary
    glucose reabsorption. The majority of these medications and lifestyle interventions
    have shown not only to reduce glucose in T2D, but also to significantly reduce
    the risk of progression to T2D in individuals with prediabetes¹⁴⁻¹⁶,¹⁸,⁵⁰. Thus,
    if pathophysiology could be identified in each individual, targeted therapy and
    a precision-medicine approach would be possible. Given that 95% of the 13 M individuals
    with diabetes are grouped into one category of T2D, and the availability of an
    increasing array of therapeutic options, it is timely to consider subclassifying
    T2D. However, previous attempts to do so based on simple laboratory tests or clinical/demographic
    markers that ‘cluster’ together do not lend themselves to a true precision approach
    to treatment, which is based on targeting underlying physiology. Thus, the shape
    of the glucose curve using longitudinal measurements and a machine-learning approach
    represents successful subclassification according to underlying physiology and
    warrants testing in trials that evaluate the relative efficacy of targeted treatment.


    Our study starts with physiological subphenotypes and then seeks a biomarker (shape
    of the glucose curve) that could be used in the clinic and at home.'
