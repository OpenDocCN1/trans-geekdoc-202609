    conditions. It will be important to have two of these done under standardized
    conditions and if one is vastly different from the other, a third should be done
    and the outlier excluded due to a presumed environmental confounder. The optimal
    number of required at-home tests can be determined in future studies. In addition,
    the hepatic IR index used in this study is based on a formula that was validated
    against a gold-standard test rather than being a gold-standard test itself. Thus,
    it is less precise than our other metabolic measures, which are highly precise.
    This probably explains the suboptimal performance in predicting hepatic IR from
    glucose time series, compared with HOMA-IR or the Matsuda index.


