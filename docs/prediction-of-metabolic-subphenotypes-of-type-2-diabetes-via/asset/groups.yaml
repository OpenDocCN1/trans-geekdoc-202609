  - '[PAGE 11]


    A prerequisite for physiologic subclassification is a practical, accurate, accessible
    and standardized test. Gold-standard tests for insulin resistance, insulin secretion
    and incretin effect entail the use of intravenous infusions in the research unit
    and are laborious, invasive and expensive, hence are neither scalable nor practical.
    Thus, we seek to validate a more practical measure such as the shape of the glucose
    curve, particularly obtained by CGM, that could be used in the clinical setting.
    The OGTT test is relatively more feasible and has been widely studied with regard
    to its potential not only to identify diabetes on the basis of a 2-h glucose,
    but also to predict the risk of developing T2D, CVD and total mortality20,31.
    Furthermore, glucose obtained at 2 to 5 timepoints during OGTT has been correlated
    in multiple studies with underlying physiology30,32–37. Simple measures such as
    1-h glucose peak, time to peak, nadir below baseline, or relative height of 2
    vs 1 h or baseline glucose were noted to correlate with insulin resistance and
    β-cell function32–34. A number of publications showed that a mono versus biphasic
    curve shape was associated with insulin resistance, β-cell dysfunction and risk
    for diabetes35–37. Due to the simplicity of these analyses and the risk of missing
    the glucose peak with limited sampling and the high false-positive rate given
    that the majority of normoglycaemic individuals have a monophasic curve, more
    sophisticated modelling approaches have been employed31,37,51.


    Functional principal component analysis (PCA) in pregnant women was able to differentially
    predict development of gestational diabetes51, and latent class trajectory analysis37
    identified four curve types which differed according to degree of insulin resistance
    and β-cell function, and predicted diabetes, cardiovascular events and total mortality31.
    Results of the current study extend those of the previous studies by applying
    a machine-learning framework to analyse the dynamic glucose time series response
    to an OGTT with 16 timepoints, with demonstrated ability to identify insulin resistance,
    β-cell defect and incretin defect better than currently available tests including
    surrogate biomarkers, clinical-demographic profile and polygenic risk score. This
    machine-learning framework did not predict hepatic IR any better than HOMA-IR.
    However, given the high correlation between muscle and hepatic IR, we propose
    that it may be prudent to consider these two IR subphenotypes as a single IR phenotype.
    Despite the increasing potential of sophisticated approaches to leverage the OGTT
    to predict underlying metabolic phenotype, the OGTT test still poses a patient
    burden, limiting its widespread clinical use.


    In the current study, we aimed to evaluate whether a glucose curve generated by
    CGM would yield a similar ability to identify underlying metabolic physiology.
    Such test can be performed conveniently at home, is feasible and inexpensive.
    Our results show that when applied to a CGM-generated glucose curve following
    standardized OGTT, the same machine-learning algorithm can accurately identify
    insulin resistance. The best performance was obtained by using the average of
    two home OGTTs performed in a single week under standardized conditions. Indeed,
    the average of two home CGM curves after OGTT performed better than plasma glucose
    values obtained following OGTT in the CTRU, presumably due to the high measurement
    frequency. Glucose curve features from at-home OGTT via CGM were extracted similarly
    to those from the frequently sampled OGTT in CTRU (Fig. 3a). We have tested the
    percent in range and percent out of range as possible features52–55; however,
    these did not increase model performance. This is mainly because we used them
    during only a 180-min session and not the whole 10-day session. Also, percent
    in range and percent out of range are good for people with diabetes who usually
    have elevated glucose (hyperglycaemia), or who are taking insulin and exhibit
    hypoglycaemia. Our cohort is mainly normoglycaemic and people with prediabetes.
    One major concern about the OGTT is the previously noted intra-individual variability56
    of glucose at a given timepoint. This is in part likely but not completely due
    to environmental stressors (for example, eating a late dinner or snack, eating
    out, alcohol, late exercise or excessive duration of fasting, morning stress or
    coffee, change of


    location or time, or rapidity of consumption of OGTT). We controlled for these
    with detailed patient instructions, and intra-patient variability was lowest for
    the home OGTT where the coefficient of variation was 11% for CGM across all timepoints.
    This compares favourably to the published 16.7% for 2-h plasma glucose during
    OGTT56. The high reproducibility of home CGM may also be due to similar conditions
    that can be maintained as well as the fact that we evaluated variability for the
    shape of the curve rather than a single timepoint, the latter of which may be
    more subject to variability, as we noted that some curves were of similar shape
    but shifted up, down, right or left compared with the other curve obtained from
    the same participant. If this method moves to the clinic for widespread use, it
