    # # Research involving human participants, their data, or biological material


    Policy information about studies with human participants or human data. See also
    policy information about sex, gender (identity/presentation), and sexual orientation
    and race, ethnicity and racism.


    **Reporting on sex and gender** We collected sex information of all participants
    in the study. We did not collect gender information. The findings apply to male
    and female.


    **Reporting on race, ethnicity, or other socially relevant groupings** Participant
    race and ethnicity data were based on self-reported information. The participant-recruitment
    process was conducted exclusively in the San Francisco Bay Area. Owing to the
    demographic characteristics of this region, the resulting conduct predominantly
    consisted of individuals identifying as Caucasian and Asian. Recognizing the potential
    influence of ethnicity on the study outcomes, it was methodologically incorporated
    as a variable in our baseline prediction models for metabolic sub-phenotypes.
    Notably, all participants included in this study held a minimum educational level
    of a college degree.


    **Population characteristics** Three cohorts were used in this study; (1) a main
    cohort for training and testing the model, (2) a validation cohort, (3) an at-home
    CGM cohort. The main cohort of 32 participants (13 males and 19 females; average
    age 57.2 years, average BMI 26.5 kg/m^2, average HbA1c 5.6%). An independent validation
    cohort of 24 participants (11 males and 13 females; average age 53.2 years, average
    BMI 25.9 kg/m^2, average HbA1c 5.6%). At-home CGM cohort of 29 participants (24
    from the validation cohort and 5 from the initial cohort; 14 males and 15 females;
    average age 54.9 years, average BMI 25.6 kg/m^2, average HbA1c 5.6%).


    **Recruitment** Participants provided written informed consent. Participants were
    recruited from the San Francisco Bay Area via locally placed advertisements online,
    in local newspapers, and during faculty lectures to the community.


    **Ethics oversight** The study protocol and clinical investigation were approved
    by the Stanford University School of Medicine Human Research Protection Office
    (Institutional Review Board # 43883).


    Note that full information on the approval of the study protocol must also be
    provided in the manuscript.


    # # Field-specific reporting


    Please select the one below that is the best fit for your research. If you are
