    order was shuffled after each iteration. The final model with the selected hyperparameter
    value was chosen on the basis of best auROC in cross-validation. The process of
    hyperparameter tuning and model selection was merged in the same loop because
    of the limited training sample size. However, the shuffle process ensured an accurate
    estimation of performance. The model was then tested on the independent test set
    on both data (plasma glucose from OGTT at CTRU and CGM data), similar to the training
    set. The class imbalance problem was handled via stratified sampling to ensure
    that training and validation contained the same proportion of class samples. Importantly,
    in the second approach of feature extraction (OGTT_G_ReducedRep), reduced representation
    was obtained from the training set, not the whole dataset, and used to train each
    classifier. The test set was then projected onto the reduced representation space
    obtained from the trained dataset, and their representations were used to predict
    metabolic subphenotypes. Obtaining reduced representation space from the training
    dataset instead of the whole dataset was crucial for the robustness and generalizability
    of the model by preventing data leakage between the training dataset and the test
    dataset.


    We then conducted a comprehensive experiment to predict metabolic subphenotypes
    using the two sets of extracted features as previously discussed (OGTT_G_Features
    and OGTT_G_ReducedRep). For comparison, we evaluated the performance of these
    two feature sets to surrogate markers for metabolic phenotypes that are in current
    use, including (1) demographics (age, sex, ethnicity, BMI, family history of T2D),
    (2) T2D polygenic risk scores, (3) incretins (total GIP and GLP-1 concentration
    at hour 2 of OGTT_2h), (4) laboratory (HbA1c and FPG), (5) HOMA-B<sup>62</sup>,
    (6) HOMA-IR<sup>62</sup> and (7) Matsuda Index<sup>63</sup>. Demographics was
    evaluated alone and in all other models including our OGTT_G_Features and OGTT_G_ReducedRep
    models.


