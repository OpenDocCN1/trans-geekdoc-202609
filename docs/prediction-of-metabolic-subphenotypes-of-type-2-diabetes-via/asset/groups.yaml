    The independent validation cohort was first preprocessed, then used to extract
    the two sets of glucose time series features similarly to the initial cohort.
    Then, trained models from the initial cohort were used to predict muscle IR.


    # **Statistical analyses**


    Statistical significance was performed using Wilcoxon rank-sum test with Bonferroni
    correction when multiple testing was required, such as the case with evaluating
    the metabolic subphenotype predictions using different feature sets. All P values
