    ## 讨论


    2 型糖尿病及其前驱期糖尿病前目前是基于血糖水平而非潜在病理生理学来定义的。然而，其机制基础复杂，多种不同的病理生理过程共同参与。在此，我们证明，血糖范围从正常血糖到糖尿病前的个体，在四种不同的生理过程中表现出明显的异质性，这四种过程均会导致葡萄糖代谢紊乱，包括肌肉
    IR、β 细胞功能障碍、肠促胰素作用受损和肝 IR。我们清楚地表明，这些表型不一定与传统的葡萄糖指标（如 HbA1c）相关，因此无法通过这种方式估计。使用金标准生理测试，并将每个个体的值表示为相对于队列均值的相对偏差，我们表达了每个过程异常的程度。大多数个体表现出单一主导代谢亚表型或两个共显性表型。这些通常分为以
