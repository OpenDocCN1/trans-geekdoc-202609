    ## 优势代谢亚型计算


    对于每位参与者，我们尝试确定哪项代谢过程受损最严重，从而根据其“优势”或共优势代谢亚型对个体进行分类。这种分类在临床上将有助于指导针对不同生理过程的不同疗法的治疗顺序。分类包括计算四项代谢措施各自的标准差值，作为与队列均值的偏差（方法）。均值的正偏差（在图
    2f 的热图中显示为红色或深红色）指示不健康方向，而负偏差（在热图中显示为浅橙色或黄色）指示健康方向。图 2f 突出了我们队列中每位个体每项代谢量的差异性偏差。例如，对于参与者
    S42，肠促胰素效应是偏差最严重的代谢亚型，而对于参与者 S23，β 细胞功能是偏差最严重的——这种方法允许根据偏差最大的指标对个体进行分类，这被称为其代谢亚型。大多数个体（n
