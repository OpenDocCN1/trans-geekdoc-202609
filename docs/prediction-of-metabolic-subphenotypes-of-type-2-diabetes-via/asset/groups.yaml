    (G_Peak), length of the glucose time-series curve over the frequently sampled
    OGTT time interval (CurveSize), AUC, pAUC, negative (n)AUC, iAUC, coefficient
    of variation (CV), time from baseline to peak value (T_baseline2peak), slope between
    baseline to the peak glucose level (S_baseline2peak), and slope between glucose
    values at the peak and at the end (at t = 180 min) (S_peak2end). These 14 features
    demonstrated statistical significance in their Pearson correlation coefficients
    with one or more metabolic subphenotype indicators (SSPG, DI, IE, hepatic IR index).
    The only exception was ‘S_baseline2peak’, which exhibited a near-significant correlation
    with β-cell function (P = 0.06). In the second approach (OGTT_G_ReducedRep), we
    first Z-normalized the imputed OGTT glucose time series to extract features related
    to curve patterns rather than the amplitude, then we smoothed the Z-normalized
    glucose time series using a cubic smoothing spline with a smoothing parameter
    of 0.35. Then, the data were split into a training and testing set. For the testing
    set, we extracted the reduced representation of the OGTT glucose time series using
    PCA and the top two principal components were extracted to be used in training
    machine-learning classifiers (OGTT_G_ReducedRep). For each new glucose series
    in the test set (X), the series was centred first using the mean vector of the
    training data (X_centred). The dimension of the mean vector is 1 × 16, since we
    had 16 glucose timepoints per series. Afterwards, the centred series was multiplied
    by the loading matrix (W) of the top two principal components extracted from the
    training set (equation 6). The dimension of W is 16 × 2. X_reduced is the projected
    test series on the reduced representation space of the training set.


    $X_{reduced} = X_{centred} \times W$ (6)


    **Training machine-learning models.** We next developed a machine-learning approach,
    where the two extracted sets of glucose time-series features (OGTT_G_Features
    and OGTT_G_ReducedRep) were tested independently. For each feature extraction
    approach, the dataset was split into a training set and a test set. Data were
    stratified on the basis of metabolic subphenotype class to ensure equal distribution
    of each class between training and test set. Participants from the initial venously
    sampled OGTT collection at CTRU without CGM data were assigned to the training
    set. No participants or samples existed in both training or test sets. Cross-validation
    was implemented on the training set.


    For each metabolic subphenotype, we optimized the hyperparameters of 4 different
    classifiers: support vector machine with a radial basis function kernel (SVM-RBC),
    support vector machine with a linear kernel (SVM-linear), logistic regression
    with L1 regularization (LR-L1) and random forest (RF). We used the sklearn Python
    package to train, tune and test machine-learning models. LR-L1 was trained using
    a SAGA solver and run for a maximum of 10,000 iterations to converge, with a tunable
    regularization strength hyperparameters C. SVM-RBF and SVM-linear were trained
    using the sklearn.svm.SVC method, with kernel ‘rbf’ and ‘linear’, respectively.
    The regularization parameter ‘C’ is the tunable hyperparameter of both SVM models
    (linear and RBF). The tunable hyperparameters for random forest is the number
    of estimators. We had a grid of tunable hyperparameters (5 values) and searched
    the best one on the basis of cross-validation. All models were controlled by a
    preset random seed. The total number of models was 20 (4 basic model architectures
    and 5 hyperparameter values for each model).


