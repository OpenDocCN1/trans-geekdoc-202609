    To demonstrate the practical value of performing this test at home as well as
    the reproducibility of our proposed framework, we sought to investigate the feasibility
    of utilizing at-home testing with CGM to predict muscle IR and β-cell function.
    Cohort characteristics of 29 individuals (n = 24) are summarized in Table 1. Participants
    underwent gold-standard testing for insulin resistance (SSPG test) and β-cell
    function (16-point OGTT with C-peptide deconvolution adjusted for SSPG and expressed
    as DI) as described, as well as two OGTTs administered at home under standardized
    conditions during which glucose patterns were captured by a CGM within a single
    10-day session (Dexcom G6 pro) (Fig. 5a and Supplementary Table 5).


