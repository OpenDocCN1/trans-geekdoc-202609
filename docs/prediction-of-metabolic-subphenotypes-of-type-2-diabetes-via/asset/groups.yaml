    = 6 × 10⁻⁵，r = –0.68，P = 2 × 10⁻⁵）。最后，从峰值到 180 min 结束的斜率（S_peakEnd）和基线血糖水平（G<sub>0</sub>）是与肝脏
    IR 呈显著相关的两个主要参数（分别 r = –0.51，P = 0.002，r = 0.47，P = 0.006）。


    在第二种方法（OGTT_G_ReducedRep）中，我们首先对 16 个时间点的 OGTT 葡萄糖时间序列进行 Z-score 标准化和平滑（扩展数据图
    6）。然后，我们提取了 OGTT 葡萄糖时间序列的减少表征（方法）。有趣的是，使用 OGTT 葡萄糖时间序列的减少表征，肌肉 IR 和 IS 之间出现了非常清晰的分离（图
    3c）。此外，OGTT 葡萄糖时间序列的减少表征很容易区分三类 β 细胞功能（正常、中间和功能障碍）（图 3d）。β 细胞功能正常的个体位于第一主成分（PC1）的正侧。相比之下，β
    细胞功能障碍的个体位于 PC1 的负侧，β 细胞功能中等的个体位于两者之间。肠促胰素效应类别也观察到同样的模式（图 3e），其中肠促胰素效应正常与受损的参与者分离得相当良好。肠促胰素效应中等的参与者与两个更极端的群体重叠。另一方面，使用处理后的
    OGTT 葡萄糖时间序列的减少表征无法区分肝脏 IR 类别（图 3f）。


    我们计算了前 2 个主成分、OGTT_G_ReducedRep 与提取特征 OGTT_G_Features 之间的相关性（扩展数据图 7）。我们发现前两个主成分与
    14 个提取的曲线特征之间存在关系。前两个主成分用于在特征空间中降低维度，同时捕获主要方差（PC1 和 PC2 分别为 43.8% 和 18%）。例如，PC1
    上较高的正值与较低的 iAUC 相关，根据图 3b，这与肌肉 IS 相关。图 3c 也证实了这种关系，即肌肉-IS 参与者聚集在 PC1 较高的正值方向。


    ## 使用机器学习从葡萄糖时间序列预测代谢亚型


    使用处理后的 OGTT 葡萄糖时间序列的减少表征，肌肉 IR、β 细胞功能和肠促胰素效应类别的可分性表明，可以使用学习框架对这些类别进行强大的预测。对于每种特征提取方法（OGTT_G_Features
    和 OGTT_G_ReducedRep），数据集被分为训练集和测试集。对于每种代谢亚型，我们优化了四种不同分类器的超参数：随机森林（RF）、带径向基函数核的支持向量机（SVM-RBF）、带线性核的支持向量机（SVM-linear）和带
    L1 正则化的逻辑回归（LR-L1）。


