    细胞和肠促胰素缺乏表型共同占据了大多数患者，可能对类似的治疗策略敏感，这些策略针对胰岛素分泌，因为这是这两种亚表型病理生理学中的共同分母。这些包括增强或替代胰岛素分泌或肠促胰素作用的药物（例如磺脲类、格列类、DPP4
    抑制剂、GLP-1 激动剂或 GLP-1-GIP 双受体激动剂，或胰岛素）。只有 9% 的参与者无法分类为具有主导或共显性代谢亚表型，因此表明使用葡萄糖“曲线形状”方法来识别潜在生理学可以为糖尿病预防或治疗的靶向方法提供信息。


    从历史上看，将 2 型糖尿病亚型分为更具体的亚型一直缺乏可行的可扩展标准化诊断测试。对潜在代谢进行表征所需的费力且具有侵入性的研究测试限制了其在研究环境之外的使用，而诸如
    HOMA-IR 之类的替代指标仅能解释 40% 的胰岛素抵抗⁴¹，并且受限于不同实验室胰岛素浓度缺乏标准化。对血糖失调潜在生物学的最新进展以及针对多条不同通向高血糖途径的药物治疗的发展，使得基于生理学的糖尿病前和
    2 型糖尿病亚型分类比以往任何时候都更加重要。


    事实上，关于“肠促胰素”效应的科学发现促使了针对 2 型糖尿病的全新一类有效药物疗法的开发。其他类别的降糖药物，以及饮食减重和运动，均针对胰岛素抵抗、β 细胞功能、肝糖生产和尿糖重吸收。这些药物和生活方式干预中的大多数不仅已被证明能降低
    2 型糖尿病患者的血糖，还能显著降低糖尿病前个体进展为 2 型糖尿病的风险¹⁴⁻¹⁶,¹⁸,⁵⁰。因此，如果能在每个个体中识别病理生理学，靶向治疗和精准医疗方法将成为可能。考虑到
    1300 万糖尿病患者中有 95% 被归为一类 2 型糖尿病，且越来越多的治疗选择可用，是时候考虑对 2 型糖尿病进行亚型分类了。然而，以前基于简单实验室检测或“聚集”在一起的临床/人口学标志的尝试，并不适合基于靶向潜在生理学的真正精准治疗方法。因此，使用纵向测量和机器学习方法的葡萄糖曲线形状代表了根据潜在生理学进行的成功亚型分类，值得在评估靶向治疗相对疗效的试验中进行检验。


    我们的研究从生理亚表型入手，然后寻找一种可在诊所和家庭中使用的生物标志物（葡萄糖曲线形状）。


