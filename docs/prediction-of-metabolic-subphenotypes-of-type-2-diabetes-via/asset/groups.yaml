    kit, all at 4 timepoints (0, 30, 60 and 120 min). Insulin, C-peptide, GLP-1, GIP
    and glucagon were measured at the Core Lab for Clinical Studies, Washington University
    School of Medicine in St. Louis. From the baseline sample (at 0 min), HbA1c, fasting
    plasma glucose, insulin, triglyceride and HDL cholesterol levels were determined.


    接受测试的参与者被嘱咐在测试前3天避免庆祝或限制饮食以及不寻常的体力活动，测试前禁食10–12小时，测试前一晚17:00后不进行剧烈运动，测试当天早晨不吸烟或不使用尼古丁贴片。在5分钟内给予75克口服葡萄糖负荷（Brand
    Trutol，Thermo Fisher，10盎司份量中的75克）后，获得了动态血浆葡萄糖剖面。从肘前静脉导管在16个时间点（-10、0、10、15、20、30、40、50、60、75、90、105、120、135、150和180分钟）采集血浆样本。在不同时间点使用氧化酶法测定葡萄糖水平；使用Millipore放射免疫分析法测定胰岛素和C-肽，均在7个时间点（0、15、30、60、90、120和180分钟）测定；使用Millipore
    ELISA EZGLPIT-36K试剂盒测定GLP-1，使用Millipore ELISA EZHGIP-54K试剂盒测定GIP，并使用Mercodia ELISA
    10-1271-01试剂盒测定胰高血糖素，均在4个时间点（0、30、60和120分钟）测定。胰岛素、C-肽、GLP-1、GIP和胰高血糖素在华盛顿大学医学院圣路易斯临床研究核心实验室测定。从基线样本（0分钟时）中，确定了糖化血红蛋白、空腹血浆葡萄糖、胰岛素、甘油三酯和HDL胆固醇水平。


    ### (2) At-home OGTT with CGM.


    ### (2) 佩戴CGM的在家口服葡萄糖耐量试验。


    Participants wearing CGM were instructed to do two at-home OGTTs that were standardized
    to minimize environmental influences that might lead to variability in results.
    The two at-home OGTTs were performed within a single CGM sensor session (10 days).


    佩戴CGM的参与者被指示进行两次标准化的在家口服葡萄糖耐量试验，以尽量减少可能导致结果变异的环境影响。两次在家口服葡萄糖耐量试验在单个CGM传感器周期（10天）内进行。


    After an overnight fast, a 75-g glucola drink (NERL Trutol, Thermo Fisher) was
    consumed in 10 oz over 5 min and for 3 h, no oral intake other than water was
    allowed, and the patients remained seated, identical to the OGTT procedure performed
    in the CTRU. Participants were required to do this test during a typical week
    that was devoid of celebratory or restrictive eating (for example, wedding or
    religious holiday), with usual activity patterns (no unusual activity/training
    outside their typical patterns); to refrain from eating out, performing strenuous
    exercise after 17:00 the night before the test, eating or consuming anything other
    than water after 22:00 on the evening before and morning before the test; and
    to avoid smoking or using a nicotine patch the morning of the test.


    过夜禁食后，在5分钟内饮用10盎司的75克糖溶液（NERL Trutol，Thermo Fisher），随后3小时内只能饮水，禁止其他口服摄入，受试者保持坐位，与CTRU中进行的口服葡萄糖耐量试验流程相同。参与者要求在一个典型的星期进行此测试，该周没有庆祝或限制饮食（例如婚礼或宗教节假日），且活动模式平常（无其典型模式之外的异常活动/训练）；需避免外出就餐、在测试前一晚17:00后进行剧烈运动、在测试前一晚和测试当天早上22:00后进食或摄入除水以外的任何东西；并且在测试当天早晨避免吸烟或使用尼古丁贴片。


    ### (3) Isoglycaemic intravenous glucose infusion.


    ### (3) 等血糖静脉葡萄糖输注。


    IIGI, as previously described⁴⁶, was performed to quantify the incretin effect
    by duplicating the plasma glucose profile during the concurrently OGTT. During
    the IIGI test, an intravenous catheter was placed in the antecubital vein for
    administration of a continuous dextrose infusion at a rate needed to obtain the
    desired glucose, which for each timepoint was the glucose level obtained at the
    same timepoint during the OGTT. Blood sampling from a second intravenous catheter
    included the same timepoints and assays as described above for the OGTT.


    如先前所述⁴⁶，进行IIGI旨在通过复制同时进行的口服葡萄糖耐量试验期间的血浆葡萄糖剖面来量化肠促胰素效应。在IIGI测试期间，将静脉导管置于肘前静脉，以输注连续葡萄糖，输注速率根据需要达到所需葡萄糖水平，每个时间点所需的水平即为口服葡萄糖耐量试验中同一时间点获得的葡萄糖水平。从第二个静脉导管采集血液，包括与上述口服葡萄糖耐量试验相同的时间点和检测方法。


    ### (4) Insulin suppression test.


    ### (4) 胰岛素抑制试验。


    Insulin-mediated glucose disposal was quantified by the modified insulin suppression
    test as originally described and validated³⁸⁻⁴⁰. Briefly, participants were infused
    for 240 min with octreotide (0.27 µg m⁻² min⁻¹) (to suppress endogenous insulin
    secretion), insulin (32 mU m⁻² min⁻¹) and glucose (267 mg m⁻² min⁻¹). Blood was
    drawn at 30-min intervals for monitoring and at 10-min intervals from 210 to 240
    min of the infusion to measure plasma glucose and insulin concentrations, and
    the mean of these four glucose values (210, 220, 230, 240 min) was used as the
    steady-state plasma insulin (SSPI) and glucose (SSPG) concentrations for each
    individual. As SSPG concentrations were similar in all participants during these
    tests, the SSPG concentration provided a direct measure of the ability of insulin
    to mediate disposal of an infused glucose load; the higher the SSPG concentration,
    the more insulin resistant the individual.


    利用最初描述和验证³⁸⁻⁴⁰的修饰胰岛素抑制试验，量化了胰岛素介导的葡萄糖处置。简言之，参与者接受了240分钟的输注，包括奥曲肽（0.27 µg m⁻² min⁻¹）（用于抑制内源性胰岛素分泌）、胰岛素（32
    mU m⁻² min⁻¹）和葡萄糖（267 mg m⁻² min⁻¹）。每30分钟抽血一次以进行监测，并在输注的210至240分钟间每10分钟抽血一次，以测量血浆葡萄糖和胰岛素浓度，并将这四个葡萄糖值（210、220、230、240分钟）的平均值用作每个个体的稳态血浆胰岛素（SSPI）和葡萄糖（SSPG）浓度。由于在这些测试中所有参与者的SSPG浓度相似，SSPG浓度提供了胰岛素介导输注葡萄糖负荷处置能力的直接测量；SSPG浓度越高，个体越胰岛素抵抗。


    ### (5) Measurement of plasma glucose.


    ### (5) 血浆葡萄糖测定。


    Blood was drawn from an intravenous catheter placed in the antecubital fossa which
    was warmed with a heating pad to obtain arterialized venous blood. The blood sample
    was run to the CTRU lab, spun for 2 min and plasma was analysed on the glucose
    analyzer (YSI 2500) calibrated to the clinical laboratory glucose values at our
    institution. This method allowed for immediate bedside glucose results so that
    for the IIGI (above), the glucose infusion rate could be altered every 5 min as
    needed to mimic the glucose curve generated by the OGTT.


    从置于肘前窝并用加热垫加热的静脉导管中抽血，以获得动脉化静脉血。血液样本被送至CTRU实验室，离心2分钟，血浆在血糖分析仪（YSI 2500）上进行分析，该仪器已根据本机构临床实验室葡萄糖值进行校准。该方法允许即时床旁血糖结果，因此对于上述IIGI，葡萄糖输注速率可根据需要每5分钟调整一次，以模拟口服葡萄糖耐量试验产生的葡萄糖曲线。


    ## Metabolic calculations


    ## 代谢计算


    ### (1) Muscle insulin resistance (SSPG).


    ### (1) 肌肉胰岛素抵抗（SSPG）。


    While SSPG as described above reflects whole-body insulin-mediated glucose disposal,
    85% of this occurs in muscle⁷ and thus, to distinguish this measure from hepatic
    insulin resistance, the term ‘muscle’ insulin resistance is used in this study.
    Furthermore, a cut-off of <120 mg dl⁻¹ is generally indicative of insulin sensitivity.
    For the purpose of this paper, we defined non-insulin sensitivity of individuals
    (those with SSPG ≥ 120 mg dl⁻¹) as insulin resistance (IR). This includes individuals
    with moderate and severe IR, all of whom have been shown to respond to treatments
    known to improve insulin sensitivity (both lifestyle and medications).


    虽然上述SSPG反映全身胰岛素介导的葡萄糖处置，但其中85%发生在肌肉⁷，因此，为将此测量指标与肝胰岛素抵抗区分开来，本研究使用“肌肉”胰岛素抵抗一词。此外，<120
    mg dl⁻¹的切断值通常提示胰岛素敏感。就本论文而言，我们将非胰岛素敏感个体（SSPG ≥ 120 mg dl⁻¹者）定义为胰岛素抵抗（IR）。这包括中度和重度胰岛素抵抗的个体，所有这些个体均已被证明对已知可改善胰岛素敏感性的治疗（无论是生活方式还是药物）有反应。


    ## Quantifying the relative deviance for each physiologic measure for metabolic
    subphenotype assignment


    ## 量化各生理指标的相对偏差以进行代谢亚表型分类


    To classify each participant to their most ''abnormal'' physiologic process, we
    calculated a standardized deviance score (that is, a Z-score) for each metabolic
    measure for each participant (equation 5), where msp$^j_i$ is the $i$th metabolic
    measure of participant $j$ and mean(msp$^i$) is the average of $i$th metabolic
    measure among the cohort''s participants and sd(msp$^i$) is the standard deviation.
    High positive deviance indicates a more abnormal score and stronger phenotype
    for that measure in a given individual; high negative deviance indicates a healthier
    metabolic measure, and thus relative absence of the unhealthy phenotype as compared
    with the average population. DI and IE% were negated before applying equation
    (5), since higher DI and IE% indicate healthier $\beta$-cell function and incretin
    function, respectively. As shown in the heat map in Fig. 2, it is possible to
    see in a given individual the relative deviance for each metabolic measure: some
    individuals had a single dominant (most deviant) measure, whereas others had two
    or more that were equally dominant.


    为将每个参与者归类为其最“异常”的生理过程，我们为每个参与者的每项代谢指标计算了标准化偏差得分（即 Z 分数）（方程 5），其中 msp$^j_i$ 为参与者
    $j$ 的第 $i$ 项代谢指标，mean(msp$^i$) 为队列中参与者第 $i$ 项代谢指标的平均值，sd(msp$^i$) 为标准偏差。高正偏差表明在给定个体中该指标的得分更异常且表型更强；高负偏差表明该代谢指标更健康，因此与平均人群相比，不健康表型的相对缺失。在应用方程
    (5) 之前，DI 和 IE% 取了负值，因为较高的 DI 和 IE% 分别表明更健康的 $\beta$细胞功能和肠促胰素功能。如图 2 的热图所示，可以在给定个体中看到每项代谢指标的相对偏差：有些个体只有一个占主导地位（最偏离）的指标，而其他人则有两个或更多同样占主导地位的指标。


    ### (2) β-cell function (DI).


    ### (2) $\beta$细胞功能（DI）。


    To quantify the status of β-cell function, we first calculated insulin secretion
    rate using the C-peptide deconvolution method, using C-peptide concentrations
    measured during OGTT tests at 0, 15 and 30 min. The Insulin SEcretion (ISEC) software$^{42}$
    was used to calculate prehepatic insulin secretion from plasma C-peptide measurements
    with adjustment for age, sex and BMI$^{43}$. The ISEC software can be obtained
    from the author Roman Hovorka of the Metabolic Modelling Group, Centre for Measurement
    and Information in Medicine, Department of System Science, City University, London,
    United Kingdom. We required an error coefficient of variation of 5% and 15-min
    intervals. As the programme uses a population model of C-peptide kinetics, we
    classified individuals as diabetic (''niddm'') if they had either fasting plasma
    glucose >126 mg dl⁻¹, 2 h glucose during OGTT >200, or HbA1c >6.5; or as ''obese''
    if they were non-diabetic with BMI > 30. The remaining individuals were classified
    as ''normal''. Because insulin secretion is best interpreted relative to insulin
    resistance (insulin-resistant individuals need to secrete more insulin to maintain
    normoglycaemia), we then calculated DI$^{44,45}$, as previously described, which
    adjusts the insulin secretion rate for degree of insulin resistance to generate
    an overall measure of β-cell function. DI was calculated as the area under the
    insulin secretion rate, divided by the SSPG (equation 1). DI thus describes β-cell
    function relative to insulin resistance.


    为量化 $\beta$细胞功能状态，我们首先使用 C-肽去卷积法计算了胰岛素分泌速率，使用了 OGTT 测试中 0、15 和 30 分钟时测得的 C-肽浓度。使用
    Insulin SEcretion (ISEC) 软件$^{42}$，根据血浆 C-肽测定值并调整年龄、性别和 BMI$^{43}$ 计算了肝前胰岛素分泌。ISEC
    软件可从英国伦敦城市大学系统科学系医学测量与信息中心代谢建模小组的作者 Roman Hovorka 处获得。我们要求误差变异系数为 5% 且间隔为 15 分钟。由于该程序使用
    C-肽动力学的人群模型，如果个体的空腹血浆葡萄糖 >126 mg dl⁻¹、OGTT 期间 2 小时葡萄糖 >200，或糖化血红蛋白 >6.5，则将其分类为糖尿病（''niddm''）；或者如果非糖尿病且
    BMI > 30，则分类为 ''肥胖''。其余个体分类为 ''正常''。由于胰岛素分泌最好相对于胰岛素抵抗来解释（胰岛素抵抗个体需要分泌更多胰岛素以维持正常血糖），我们随后按先前描述计算了
    DI$^{44,45}$，它根据胰岛素抵抗程度调整胰岛素分泌速率，以生成 $\beta$细胞功能的总体指标。DI 按胰岛素分泌速率下的面积除以 SSPG 计算（方程
    1）。因此，DI 描述了相对于胰岛素抵抗的 $\beta$细胞功能。


    ```

    DI = \(\left( \frac{\int_{t=0}^{t=30} \text{Insulin Secretion Rate}_t^{OGTT} \
    dt}{\text{SSPG}} \right)\) (1)

    ```


    ```

    deviance(msp$^j_i$) = \(\frac{\text{msp}^j_i - \text{mean(msp}^i\text{)}}{\text{sd(msp}^i\text{)}}\)
    (5)

    ```


    where $i \in$ {MuscleIR, BetaCellDysfunction, IncretinDysfunction, HepaticIR}.


    其中 $i \in$ {MuscleIR, BetaCellDysfunction, IncretinDysfunction, HepaticIR}。


    For each participant, the dominant metabolic subphenotype was identified on the
    basis of the one exhibiting the highest deviance score. When the difference in
    deviance scores between the two highest metabolic subphenotypes was less than
    0.5, the participant was classified as having co-dominant subphenotypes. If more
    than one subphenotype exhibited deviance scores within 0.5 of the highest score,
    the participant was classified as having neither dominant nor co-dominant subphenotypes.
    This method is not intended for the clinical diagnosis of metabolic abnormalities.
    Instead, it focuses on identifying individuals with deviations in metabolic profiles
    relative to a reference cohort. Further validation in diverse populations is required
    to assess its generalizability.


    对于每个参与者，基于偏差得分最高的代谢亚表型来识别其主导代谢亚表型。当两个最高代谢亚表型之间的偏差得分差异小于 0.5 时，该参与者被分类为具有共主导亚表型。如果多个亚表型的偏差得分均在最高得分
    0.5 范围内，则该参与者被分类为既无主导亚表型也无共主导亚表型。此方法并非用于代谢异常的临床诊断。相反，它侧重于识别相对于参考队列存在代谢图谱偏差的个体。需要在多样化人群中进一步验证以评估其广义性。


    ### (3) Incretin effect (IE%).


    ### (3) 肠促胰素效应（IE%）。


    We quantified the incretin effect as previously described$^{46}$ using equation
    (2). IE was calculated on the basis of the difference in the C-peptide concentrations
    during a frequently sampled OGTT and IIGI (0–180 min) that by design induce nearly
    identical plasma glucose concentrations. The difference in C-peptide in response
    to oral versus intravenous glucose loading reflects the contribution of incretin
    hormones from the gut that stimulate pancreatic β-cell insulin secretion. A higher
    incretin effect may indicate either increased secretion of incretin hormones (for
    example, GLP-1 and GIP) and/or β-cell responsiveness to these hormones. Lower
    incretin effect may be due to deficiency in incretin hormone secretion and/or
    relative inability to stimulate insulin secretion from the β-cell.


    如先前所述$^{46}$，我们使用方程 (2) 量化了肠促胰素效应。IE 根据频繁采样口服葡萄糖耐量试验和 IIGI（0–180 min）期间 C-肽浓度的差异计算，这两种试验在设计上可诱导近乎相同的血浆葡萄糖浓度。口服与静脉葡萄糖负荷对
    C-肽响应的差异反映了肠促胰素激素的贡献，这些激素来自肠道并刺激胰腺 $\beta$细胞胰岛素分泌。较高的肠促胰素效应可能表明肠促胰素激素（例如 GLP-1
    和 GIP）分泌增加和/或 $\beta$细胞对这些激素的反应性增加。较低的肠促胰素效应可能是由于肠促胰素激素分泌不足和/或相对无法刺激 $\beta$细胞分泌胰岛素。


    ```

    IE% = \(\left( \frac{\int_{t=0}^{t=180} \text{cpeptide}_t^{OGTT} \ dt - \int_{t=0}^{t=180}
    \text{cpeptide}_t^{IIGI} \ dt}{\int_{t=0}^{t=180} \text{cpeptide}_t^{OGTT} \ dt}
    \right) \times 100\) (2)

    ```


    ### (4) Hepatic IR index.


    ### (4) 肝胰岛素抵抗指数。


    Liver insulin resistance was inferred using a surrogate index as shown in equation
    (3) (ref. 47), where insulin is measured in (microU ml⁻¹), plasma HDL cholesterol
    is measured in (mg dl⁻¹) and BMI is measured in kg m⁻². In adults, body fat %
    (BF%) can be estimated using the Deurenberg Index as shown in equation (4)$^{37}$,
    where BMI is measured in kg m⁻², age in years, and sex = 1 for male and sex =
    0 for female.


    利用方程 (3)（参考文献 47）所示的替代指标推断了肝胰岛素抵抗，其中胰岛素以（microU ml⁻¹）计量，血浆 HDL 胆固醇以（mg dl⁻¹）计量，BMI
    以 kg m⁻² 计量。在成人中，体脂百分比（BF%）可使用方程 (4)$^{37}$ 所示的 Deurenberg 指数估计，其中 BMI 以 kg m⁻²
    计量，年龄以岁为单位，sex = 1 表示男性，sex = 0 表示女性。


    ```

    Hepatic IR = $-0.091 + 0.4 \times \log\left(\int_{t=0}^{t=180} \text{insulin}_t^{OGTT}
    \ dt\right) + 0.346 \times \log(\text{BF\%}) - 0.408 \times \log(\text{HDL}) +
    0.435 \times \log(\text{BMI})$ (3)

    ```


    ## Genotyping and T2D polygenic risk score calculation


    ## 基因分型与 2 型糖尿病多基因风险评分计算


    DNA was extracted from whole-blood peripheral blood mononuclear cells (PBMC).
    The concentration of the extracted DNA was measured using Qubit, normalized to
    50 ng μl⁻¹, and 10 μl was used for each sample for genotyping. All samples were
    genotyped using the Illumina Infinium Omni2.5Exome array with ~2.6 million single
    nucleotide variants (SNV) sites measured. Genotyping data underwent standard quality
    control using PLINK$^{38}$, including filtering of SNVs with excess missing genotypes
    (>2%), filtering of SNVs out of Hardy–Weinberg equilibrium ($P < 1 \times 10^{-6}$)
    and removal of samples with either excess missing genotypes (>3%) or discordant
    genetic vs recorded sex. Coordinates were aligned to the positive strand on genome
    build GRCh38 and the data were imputed against the TOPMed R2 reference panel$^{59–61}$.
    After quality control and imputation, 11.8 million high-quality SNVs ($R^2 > 0.3$)
    were obtained. T2D polygenic risk score (PRS$_{T2D}$) was generated as an additive
    model using 338 index variants and corresponding weights from the DIAMANTE multi-ancestry
    meta-analysis study$^{49}$. Of the 338 variants, 16 were not available, for which
    mean population scores were added using the TOPMed Bravo platform reference frequencies
    (2 × weight × population allele frequency)$^{61}.


    DNA 从全血外周血单个核细胞（PBMC）中提取。使用 Qubit 测定提取 DNA 的浓度，标准化至 50 ng μl⁻¹，每个样本使用 10 μl 进行基因分型。所有样本均使用
    Illumina Infinium Omni2.5Exome 阵列进行基因分型，测定了约 260 万个单核苷酸变异（SNV）位点。基因分型数据使用 PLINK$^{38}$
    进行了标准质量控制，包括过滤缺失基因型过多（>2%）的 SNV、过滤不符合 Hardy–Weinberg 平衡（$P < 1 \times 10^{-6}$）的
    SNV，以及删除缺失基因型过多（>3%）或遗传性别与记录性别不一致的样本。坐标已比对至基因组构建版本 GRCh38 的正链，数据已根据 TOPMed R2
    参考面板$^{59–61}$ 进行插补。经过质量控制和插补后，获得了 1180 万个高质量 SNV（$R^2 > 0.3$）。T2D 多基因风险评分（PRS$_{T2D}$）作为一种加性模型生成，使用了
    DIAMANTE 多祖先荟萃分析研究$^{49}$ 中的 338 个索引变异及其相应权重。在 338 个变异中，16 个不可用，使用 TOPMed Bravo
    平台参考频率（2 × 权重 × 人群等位基因频率）$^{61}$ 添加了平均人群得分。


    ```

    BF% = $-5.4 + 1.2 \times \text{BMI} + 0.23 \times \text{Age} - 10.8 \times \text{Sex}$
    (4)

    ```


    ## Machine-learning framework to identify metabolic subtypes from OGTT glucose
    time series


