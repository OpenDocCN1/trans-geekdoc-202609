    # # Prediction of metabolic subphenotypes of type 2 diabetes via continuous glucose
    monitoring and machine learning


    +   Received: 1 May 2022

    +   Accepted: 1 November 2024

    +   Published online: 23 December 2024

    +   Check for updates


    +   Ahmed A. Metwally 1,2,6, Dalia Perelman 1,3, Heyjun Park1,7, Yue Wu1, Alokkumar
    Jha4, Seth Sharp4, Alessandra Celli1, Ekrem Ayhan3, Fahim Abbasi 3, Anna L. Gloyn
    4,5, Tracey McLaughlin 3,8 & Michael P. Snyder 1,8


    The classification of type 2 diabetes and prediabetes does not consider heterogeneity
    in the pathophysiology of glucose dysregulation. Here we show that prediabetes
    is characterized by metabolic heterogeneity, and that metabolic subphenotypes
    can be predicted by the shape of the glucose curve measured via a continuous glucose
    monitor (CGM) during standardized oral glucose-tolerance tests (OGTTs) performed
    in at-home settings. Gold-standard metabolic tests in 32 individuals with early
    glucose dysregulation revealed dominant or co-dominant subphenotypes (muscle or
    hepatic insulin-resistance phenotypes in 34% of the individuals, and β-cell-dysfunction
    or impaired-incretin-action phenotypes in 40% of them). Machine-learning models
    trained with glucose time series from OGTTs from the 32 individuals predicted
    the subphenotypes with areas under the curve (AUCs) of 95% for muscle insulin
    resistance, 89% for β-cell deficiency and 88% for impaired incretin action. With
    CGM-generated glucose curves obtained during at-home OGTTs, the models predicted
    the muscle-insulin-resistance and β-cell-deficiency subphenotypes of 29 individuals
    with AUCs of 88% and 84%, respectively. At-home identification of metabolic subphenotypes
    via a CGM may aid the risk stratification of individuals with early glucose dysregulation.


    Type 2 diabetes (T2D) affects over 537 M adults globally1. Diabetes and prediabetes
    are defined by measures of glucose elevation, but the underlying physiology is
    complex and differs between individuals. It is traditionally suggested that individuals
    who develop T2D have both insulin resistance (IR) and β-cell dysfunction. However,
    we and others have shown that individuals with prediabetes and early T2D exhibit
    varying degrees of insulin resistance and β-cell dysfunction2,3, as well as defects
    in incretin action4 and hepatic glucose regulation5. These


    physiologic underpinnings of T2D are present before the onset of overt hyperglycaemia6,
    but they are not easy to identify outside of specialized metabolic research units.
    In particular, IR would be useful to detect in stages before overt hyperglycaemia
    because it is highly prevalent7 and increases risk not only for T2D but also for
    cardiovascular disease (CVD), stroke, hypertension, non-alcoholic liver disease
    and cancer7–11, and is largely reversible with lifestyle interventions such as
    weight loss and physical activity12,13.


