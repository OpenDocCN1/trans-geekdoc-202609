    IR 水平高的个体也具有高水平的肝脏 IR（r = 0.73，P = 10⁻³）（图 2g）。确实，共有 13 名个体（34%）患有肌肉、肝脏或合并型 IR。共有
    13 名个体在 β 细胞功能障碍或肠促胰素缺乏方面具有优势或共优势（40%）。β 细胞功能障碍与肌肉 IR 呈显著相关性（r = 0.6，P = 2 × 10⁻⁴），但与受损的肠促胰素效应无相关性（r
    = 0.33，P = 0.06）（图 2g）。受损的肠促胰素效应与肌肉或肝脏 IR 无显著关联（r = 0.25，P = 0.17 和 r = 0.21，P
    = 0.24，分别）。这些数据表明，几乎所有处于正常血糖或糖尿病前期状态的个体都可以根据基础代谢生理学进行分类，IR 亚型和胰岛素分泌亚型之间的分布大致平衡。


    ## 多基因风险评分作为血糖水平的预测指标


    每位参与者均使用全基因组阵列进行基因分型，并基于此前开发和验证的 338 个 T2D 风险独立信号，通过计算 T2D 多基因风险评分（PRS<sub>T2D</sub>）来量化
    T2D 的遗传易感性（方法和补充表 4）。图 2h 显示 PRS<sub>T2D</sub> 与 HbA1c 水平相关（r = 0.48，P = 0.005）。一个显著的例外是女性参与者
    S07（研究时年龄 37 岁，BMI 26.3 kg m⁻²），尽管其 HbA1c 为正常血糖（5.1%）、肌肉胰岛素敏感性和 β 细胞功能（SSPG =
    60 mg dl⁻¹；DI = 2.58；图 2b,c）以及中等肠促胰素效应和肝脏 IR（IE = 63.7%，肝脏 IR 指数 = 4.3；图 2d,e），但其
    PRS<sub>T2D</sub> 仍高达 0.9。如预期，PRS<sub>T2D</sub> 与 SSPG（r = 0.26，P = 0.14）、肝脏 IR（r
