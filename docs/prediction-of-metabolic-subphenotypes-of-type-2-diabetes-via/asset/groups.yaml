    OGTT 葡萄糖时间系列 (OGTT_G_ReducedRep) 中。在第一种方法 (OGTT_G_Features) 中，我们从插补后的 OGTT 葡萄糖时间系列中提取了特征，例如时间点
    0 (G_0)、60 (G_60)、120 (G_120)、180 (G_180) 的葡萄糖水平，峰值葡萄糖水平 (G_Peak)，频繁采样的 OGTT 时间间隔内葡萄糖时间序列曲线的长度
    (CurveSize)，AUC，pAUC，负 (n)AUC，iAUC，变异系数 (CV)，从基线到峰值的时间 (T_baseline2peak)，基线到峰值葡萄糖水平的斜率
    (S_baseline2peak)，以及峰值和终点（t = 180 min）处葡萄糖值之间的斜率 (S_peak2end)。这 14 个特征在与一个或多个代谢亚型指标（SSPG、DI、IE、肝性
    IR 指数）的 Pearson 相关系数中显示出统计学显著性。唯一的例外是 ‘S_baseline2peak’，它与 β-细胞功能呈近乎显著的相关性 (P
    = 0.06)。在第二种方法 (OGTT_G_ReducedRep) 中，我们首先对插补后的 OGTT 葡萄糖时间序列进行 Z-标准化，以提取与曲线模式而非幅度相关的特征，然后使用平滑参数为
    0.35 的三次平滑样条对 Z-标准化后的葡萄糖时间序列进行平滑处理。然后，数据被分为训练集和测试集。对于测试集，我们使用 PCA 提取了 OGTT 葡萄糖时间序列的降维表示，并提取了前两个主成分用于训练机器学习分类器
    (OGTT_G_ReducedRep)。对于测试集中的每个新葡萄糖系列 (X)，该系列首先使用训练数据的均值向量 (X_centred) 进行中心化。均值向量的维度是
    1 × 16，因为每个系列有 16 个葡萄糖时间点。随后，中心化后的系列与从训练集提取的前两个主成分的载荷矩阵 (W) 相乘（公式 6）。W 的维度是 16
    × 2。X_reduced 是投影到训练集降维表示空间上的测试系列。


    $X_{reduced} = X_{centred} \times W$ (6)


    ### 训练机器学习模型。


    接下来，我们开发了一种机器学习方法，其中提取的两组葡萄糖时间序列特征（OGTT_G_Features 和 OGTT_G_ReducedRep）被独立测试。对于每种特征提取方法，数据集被分为训练集和测试集。数据基于代谢亚型类别进行分层，以确保每个类别在训练集和测试集之间分布均匀。来自
    CTRU 静脉采样 OGTT 收集且无 CGM 数据的参与者被分配到训练集。没有参与者或样本同时存在于训练集和测试集中。在训练集上实现了交叉验证。


    对于每个代谢亚型，我们优化了 4 种不同分类器的超参数：带径向基函数核的支持向量机 (SVM-RBF)、带线性核的支持向量机 (SVM-linear)、带
    L1 正则化的逻辑回归 (LR-L1) 和随机森林 (RF)。我们使用 sklearn Python 包来训练、调优和测试机器学习模型。LR-L1 使用 SAGA
    求解器训练，最多运行 10,000 次迭代以收敛，并带有可调正则化强度超参数 C。SVM-RBF 和 SVM-linear 使用 sklearn.svm.SVC
    方法训练，内核分别为 ‘rbf’ 和 ‘linear’。正则化参数 ‘C’ 是两个 SVM 模型（线性和 RBF）的可调超参数。随机森林的可调超参数是估计器的数量。我们有一组可调超参数网格（5
    个值），并基于交叉验证搜索最佳值。所有模型均由预设随机种子控制。模型总数为 20（4 种基本模型架构，每种模型 5 个超参数值）。


    在整个手稿中，所有机器学习实验均采用 5 折交叉验证并迭代 100 次进行。这包括将 CTRU OGTT 的血浆葡萄糖训练集（32 名参与者）分为 5 组，其中
    80% 用于模型训练，20% 用于每折中的验证。在每一折中，我们计算了 auROC 以及其他指标。为了确保更严谨的评估和稳定的模型，我们重复了上述交叉验证
    100 次，在将数据分为折之前先对数据进行打乱。这确保了框架的性能可以推广到任何数据划分。交叉验证中对每个模型测试了不同超参数，且每次迭代后顺序被打乱。带选定超参数值的最终模型基于交叉验证中最佳的
    auROC 选择。由于训练样本量有限，超参数调优和模型选择过程合并在同一循环中。但是，打乱过程确保了性能估计的准确性。然后，模型在独立测试集上对两类数据（CTRU
    OGTT 的血浆葡萄糖和 CGM 数据）进行了测试，类似于训练集。类别不平衡问题通过分层采样来处理，以确保训练和验证包含相同比例的类别样本。重要的是，在特征提取的第二种方法
    (OGTT_G_ReducedRep) 中，降维表示是从训练集（而非整个数据集）获得的，并用于训练每个分类器。然后，测试集被投影到从训练数据集获得的降维表示空间中，其表示用于预测代谢亚型。从训练数据集而非整个数据集获得降维表示空间对于模型的鲁棒性和可推广性至关重要，因为它防止了训练数据集和测试数据集之间的数据泄露。


    随后，我们使用先前讨论的两组提取的特征（OGTT_G_Features 和 OGTT_G_ReducedRep）进行了一项全面实验，以预测代谢亚型。为了比较，我们评估了这两组特征相对于当前使用的代谢表型替代标志物的性能，包括
    (1) 人口统计学（年龄、性别、种族、BMI、T2D 家族史），(2) T2D 多基因风险评分，(3) 促胰肽（OGTT_2h 第 2 小时总 GIP 和
    GLP-1 浓度），(4) 实验室（HbA1c 和 FPG），(5) HOMA-B<sup>62</sup>，(6) HOMA-IR<sup>62</sup>
    和 (7) Matsuda 指数<sup>63</sup>。人口统计学被单独评估，并包含在所有其他模型中，包括我们的 OGTT_G_Features 和 OGTT_G_ReducedRep
    模型。


    每个模型在每组特征和每个代谢亚型上的性能使用 auROC 进行评估。我们还计算了灵敏度、特异度、F1 分数、精确度和准确率。指标被汇总并概括。


    ## 研究单位独立 OGTT 队列上的模型验证。


    独立验证队列首先进行了预处理，然后类似于初始队列提取了两组葡萄糖时间序列特征。随后，使用初始队列训练的模型来预测肌肉 IR。


    ## 统计分析


    当需要进行多重检验时（例如使用不同特征集评估代谢亚型预测），统计显著性使用 Wilcoxon 秩和检验并进行 Bonferroni 校正进行评估。所有 P
    值均进行了 Bonferroni 校正。


    ## 可视化


    我们使用 ggplot2 (v.3.3.2) 和 heatmap (v.1.0.12) R 包绘制了大部分图表。图 1a 和 5a 使用 Figma 设计工具
    (https://www.figma.com/) 创建。图 3a 使用 draw.io 平台 (https://app.diagrams.net) 创建。


    ## 报告摘要


    有关研究设计的更多信息可在本文链接的 Nature Portfolio 报告摘要中查阅。


    ## 数据可用性


    CGM 和静脉来源的去标识化葡萄糖值，以及本研究中使用的其他数据类型，可从研究数据存储库下载：https://storage.googleapis.com/gbsc-gcp-project-ipop_public/metabolic_subphenotype_db/metabolic_subphenotypes_db.zip。


    ## 代码可用性


    本研究使用的代码可在 GitHub 上公开获取：https://github.com/aametwally/Metabolic_Subphenotype_Predictor（参考文献
    64）。


