    我们的主要目标是确定是否可以从标准 OGTT 测试获得的葡萄糖时间序列响应中预测代谢亚型（补充表 5）。为实现此目标，我们开发了一个强大的机器学习框架，其中特征通过两种方法从
    OGTT 葡萄糖时间序列中提取：（1）OGTT 葡萄糖时间序列的工程特征（OGTT_G_Features）和（2）减少表征方法（OGTT_G_ReducedRep），该方法使用
    2 维向量表示每个经过标准化和平滑的 OGTT 曲线（图 3a）。在第一种方法（OGTT_G_Features）中，我们从 OGTT 葡萄糖时间序列中提取了
    14 个特征（方法）。图 3b 显示，OGTT 葡萄糖时间序列中的多个提取特征与代谢亚型呈显著相关（P < 0.05，在图 3b 中用“X”标记）。曲线下面积（AUC）和增量（i）AUC
    是与肌肉 IR 呈显著正相关的两个最高特征（分别 r = 0.59，P = 3 × 10⁻⁴，r = 0.57，P = 6 × 10⁻⁴）。120 min
    时的血糖水平（G<sub>120</sub>）和 iAUC 是与 β 细胞功能负相关最高的两个指标（分别 r = –0.59，P = 4 × 10⁻⁴，r
