    Biomedical Engineering Department, Cairo University, Giza, Egypt. 3Department
    of Medicine, Stanford University, Stanford, CA, USA. 4Department of Pediatrics,
    Stanford University, Stanford, CA, USA. 5Stanford Diabetes Research Centre, Stanford
    University, Stanford, CA, USA. 6Present address: Google LLC, Mountain View, CA,
    USA. 7Present address: Department of International Health, Johns Hopkins Bloomberg
    School of Public Health, Baltimore, MD, USA. 8These authors contributed equally:
    Tracey McLaughlin, Michael P. Snyder. ✉️e-mail: tmclaugh@stanford.edu; mpsnyder@stanford.edu'
