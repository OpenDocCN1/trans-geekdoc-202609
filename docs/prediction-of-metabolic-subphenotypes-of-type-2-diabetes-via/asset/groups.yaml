    ## 涉及人体受试者、其数据或生物材料的研究


    关于涉及人体受试者或人体数据的研究的政策信息。另请参见关于性别、性别（身份/表现）和性取向以及种族、民族和种族主义的政策信息。


    **性别和性别报告** 我们收集了研究中所有参与者的性别信息。我们未收集性别信息。研究结果适用于男性和女性。


    **种族、族裔或其他社会相关群体的报告** 参与者的种族和族裔数据基于自我报告的信息。参与者招募过程仅在旧金山湾区进行。由于该地区的人口统计特征，最终纳入的受试者主要由自认为是高加索人和亚洲人的个体组成。认识到种族对研究结果的潜在影响，它在方法学上被纳入为我们代谢亚表型基线预测模型中的一个变量。值得注意的是，本研究中包含的所有参与者均拥有至少大学学历。


    **人口学特征** 本研究使用了三个队列；（1）用于训练和测试模型的主队列，（2）验证队列，（3）居家 CGM 队列。主队列包含 32 名参与者（13 名男性和
    19 名女性；平均年龄 57.2 岁，平均 BMI 26.5 kg/m^2，平均 HbA1c 5.6%）。独立验证队列包含 24 名参与者（11 名男性和
    13 名女性；平均年龄 53.2 岁，平均 BMI 25.9 kg/m^2，平均 HbA1c 5.6%）。居家 CGM 队列包含 29 名参与者（24 名来自验证队列，5
    名来自初始队列；14 名男性和 15 名女性；平均年龄 54.9 岁，平均 BMI 25.6 kg/m^2，平均 HbA1c 5.6%）。


    **招募** 参与者提供了书面知情同意书。参与者通过在线本地投放广告、当地报纸以及向社区进行的教职人员讲座等方式，从旧金山湾区招募。


    **伦理监督** 该研究方案和临床研究已获得斯坦福大学医学院人体研究保护办公室（机构审查委员会 # 43883）的批准。


    请注意，手稿中还必须提供关于研究方案批准的完整信息。


    ## 研究领域特定报告


    请选择以下最适合您研究的一项。如果您不确定，请在选择前阅读相应部分。


    - [x] 生命科学

    - [ ] 行为与社会科学

    - [ ] 生态、进化与环境科学


    有关包含所有章节的文档参考副本，请参见 nature.com/documents/nr-reporting-summary-flat.pdf


    ## 生命科学研究设计


    即使披露结果为负面，所有研究也必须披露这些要点。


    **样本量** 在研究开始前，每个代谢亚表型对葡萄糖失调的确切贡献尚不清楚。根据我们之前的经验，我们估计 30 名参与者足以揭示代谢亚表型的异质性，并使用数据来训练机器学习模型。我们成功为初始队列招募了
    32 名参与者，另外招募了 24 名作为独立队列。第三个队列用于居家 CGM，我们招募了 29 名参与者（24 名来自验证队列，5 名来自初始队列）。


    **数据排除** 未排除任何数据。


    **重复性** 训练采用 4 折交叉验证方式进行，并重复了 100 次。因此，75% 的初始队列数据用于训练，25% 用于测试。招募了一个独立队列，在研究单位和家中使用
    CGM 验证训练好的模型。


    **随机化** 随机化不适用于该研究。


    **盲法** CGM 数据以盲法模式收集，意味着参与者未看到实时血糖值。


