    set of plasma glucose from OGTT at CTRU (32 participants) into 5 groups, where
    80% was used for


    model training and 20% was used for validation during each fold. In each fold,
    we calculated the auROC together with other metrics. To ensure a more rigorous
    evaluation and stable model, we repeated the above cross-validation 100 times,
    where we shuffled the data before dividing the data into folds. This ensures that
    the performance of the framework is generalizable to any division of the data.
