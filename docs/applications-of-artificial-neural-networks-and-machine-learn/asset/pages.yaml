- pgno: 367
  md: '# Chapter 19

    Efficient Training of Two ANNs Using

    Four Meta-Heuristic Algorithms

    for Predicting the FRP Strength


    **Abstract** In recent years, artificial neural network (ANN) has become one of
    the popular and effective machine learning models that can be used to accurately
    predict fiber reinforced polymer (FRP) strength. However, the ANN structure and
    parameters are usually are chosen by experience. In this study, the aim is to
    use the combination of meta-heuristic algorithm with two different types of artificial
    neural network structure to optimize the parameters of the feed forward backpropagation
    and radial basis function networks. In this paper, Particle swarm optimization
    (PSO), Genetic algorithm (GA), Colliding bodies optimization (CBO), Enhanced colliding
    bodies optimization (ECBO) algorithms are used to combine with ANNs.


    # 19.1 Introduction


    This chapter is based on [1] and the aim is to use the combination of meta-heuristic
    algorithm with two different types of artificial neural network structure to optimize
    the parameters of the feed forward backpropagation and radial basis function networks.
    In this chapter, Particle swarm optimization (PSO), Genetic algorithm (GA), Colliding
    bodies optimization (CBO), Enhanced colliding bodies optimization (ECBO) algorithms
    are used to combine with ANNs.


    An artificial neural network is a massively parallel computing model that mimics
    brain function. Similar to a biological model consisting of a large number of
    inter-connected neurons, an ANN is composed of a large number of similarly connected
    computational elements called artificial neurons. ANN does not solve the problem
    in a strictly mathematical sense, but exhibits information processing properties
    that provide an approximate solution to a given problem. Artificial neural networks
    have been widely used in complex nonlinear function mapping, image processing,
    pattern recognition and classification, etc.


    As one of the most important members of computational intelligence, artificial
    neural networks (ANN) which include backpropagation networks (BP), radial basis
    function networks (RBF), anti-propagation networks, Kohonen networks are and so
    on.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'The common point of meta-heuristic optimization algorithms with artificial
    neural network is that the artificial neural network ends up with an optimization
    problem after designing its structure for training. Here, instead of gradient
    methods, we can use meta-heuristic optimization methods to determine neural network
    weights.


    In recent years, the suitability of artificial neural networks has been increased
    by using a combination of different networks and algorithms [2–4]. However, the
    application of different types of networks is different in each case.


    Fiber reinforced polymer (FRP) is a composite product consisting of fibers and
    matrix. Among the common industrial fibers, Carbon FRP (CFRP), aramid FRP (AFRP),
    Glass FRP (GFRP), the matrix is also polymers such as epoxy, vinyl ester, polyester,
    etc. Each of the mentioned materials alone has unique characteristics, which are
    combined with the intention of producing a better product than fibers and resin
    alone. In this chapter, a carefully prepared database of circular CFRP-confined
    concrete specimens tested under monotonic uniaxial compression is presented. There
    are some other recent FRP related publications which are provided in.


    The purpose of this article is to optimize and compare two different types of
    ANN (FFB, RBF) using PSO, GA, CBO, ECBO meta-heuristic algorithms and obtain the
    best combined neural network compared to other neural networks examined in this
    article. The obtained neural networks have been used to validate and predict the
    strength of CFRP concrete. Fiber reinforced polymers (FRPs) has been widely used
    in the field of civil engineering in recent decades due to their lightweight,
    high strength, high elastic modulus, high corrosion resistance and easy construction
    [5]. FRP coating is mainly for strengthening or from another point of view as
    a new engineering method to improve and strengthening the behavior of existing
    structures or repairing damage to existing structures is used [6, 7]. Studies
    have shown that the use of FRP concrete composite structures, in addition to improving
    the strength and hardness of the structure, also prevents the penetration of chlorine
    ions in the external environment into the concrete and thus reduces the risk of
    steel rebar corrosion.


    The optimization of artificial neural networks is often considered from different
    aspects: optimization of weights, bias, hyper parameters, network structure, activation
    nodes, learning parameters, learning algorithm, learning environment, etc. Concrete
    compressive strength, concrete sample diameter, sample length. Concrete, fiber
    elastic modulus, fiber thickness, fiber resistance were considered as input variables
    for FFB and RBF training. The final strength of FRP concrete was used as output
    variable.


    # 19.2 Artificial Neural Network Models


    Typically, a feed-forward backpropagation network such as MLP uses processing
    units that are placed in three types of input, hidden, and output layers. Each
    unit in a layer is connected to units in adjacent layers with an associated weight
    (connection strength). It is the adjustment of these weights that is done during
    network training, because network training involves repeatedly changing the weights
    between neurons'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/4048998719320644ee88964326fd7995_369_0.png)


    until the output signal matches the target output within the desired minimum error.
    When training open feedforward networks, the studied data set is usually divided
    into a training set and a validation set. While the training set is used to train
    the network, the validation set is applied to check the error performance of the
    network. Finally, it is common to reserve a third set of cases (the test set)
    for external prediction to ensure that the results in the training and validation
    set are real and not artifacts of the training process. The general architecture
    of feed forward propagation networks is shown in Fig. 19.1.


    In such feedforward backpropagation networks, connection weights are set to random
    values at the beginning of training. Descriptor values for all parameter sets
    under study are passed through the network (feed forward) and the output responses
    are compared with the target values of the input properties to obtain an error
    value. Then the weights are adjusted for the second pass of the data through the
    network to reduce the amount of error obtained. Since the adjustment of weights
    starts with the correction of the last layer and then continues backward to the
    first layer, this mode is called backpropagation. This entire procedure is repeated
    iteratively to minimize the amount of error. Finally, a regression coefficient
    may be calculated between the observed product properties and the network predicted
    values. In general, feedforward backpropagation networks suffer from two potential
    problems: (a) data overfitting in the presence of too many adjustable weights;
    and (b) overtraining the network if there are too many training cycles. Considering
    these two problems, the number of adjustable weights plays an important role,
    which also affects the predictability of the final network. Finding the optimal
    network topology to achieve a balance between those two extreme situations is
    an important point in network learning.


    Another type of networks is radial basis function networks. RBF networks have
    a fixed three-layer architecture (Fig. 19.4), which consists of an input layer,
    a hidden layer, and an output layer. The input layer provides network inputs.
    The hidden layer remaps the input data to separate them linearly. The output layer
    performs linear separation. The specific architecture dictates that the design
    of RBF networks is'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'usually organized into three steps: (1) find the appropriate network size;
    (2) Find the appropriate initial parameters (centers and widths). (3) Train the
    networks. Because of the similar layer-to-layer topology, RBF networks are often
    considered to belong to MLP networks. It was proved that RBF networks can be implemented
    by MLP networks with increased input dimensions. Except for similarities in topologies,
    RBF networks and MLP networks operate very differently. First of all, RBF networks
    are simpler than MLP networks, which may have more than three architectural layers,
    so the training process is generally faster than MLP networks. Second, RBF networks
    act as local approximation networks because the network outputs are determined
    by hidden units specified in specific local input fields. Whereas MLP networks
    work globally, because the outputs of the network are determined by all neurons.
    Thirdly, it is necessary to set the correct initial states for RBF networks. While
    MLP networks initially use randomly generated parameters. Last and most importantly,
    the classification mechanisms are different for RBF networks and MLP networks:
    RBF clusters are separated by hyperspheres. While in neural networks, hypersurfaces
    with arbitrary shape are used for separation. In the simple two-dimensional case
    as shown in Fig. 19.2, the RBF network in Fig. 19.2a separates the four clusters
    with circles or ellipses (Fig. 19.2b). While the neural network in Fig. 19.1a
    does the separation with lines (Fig. 19.1b).


    In order to determine the structure of the artificial neural network, the feed-forward
    backpropagation model, which has a single input layer and one hidden layer with
    the tan-sigmoid activation function as it is shown in Eq. (19.1), and an output
    layer having linear activation function, is used.


    ```

    Tangent Sigmoid = \frac{2}{1 + e^{-2r}} - 1

    (19.1)

    ```


