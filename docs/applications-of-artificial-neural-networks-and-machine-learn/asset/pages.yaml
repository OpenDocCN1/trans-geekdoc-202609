  md: 'In the analysis and design of double layer grids a large number of nodes and
    members are involved, making them time consuming. Configuration processing and
    data generation for these structures is also a problem, which can be simplified
    using the concepts for formex configuration processing [3]. For large-scale problems
    the analysis is usually time consuming due to a large number of equations being
    involved. Therefore approximate methods are needed in the process of nonlinear
    analysis, design and optimization.


    Neural networks provide a powerful tool for approximate analysis of space structures.
    Such networks are trained using backpropagation [4] and counter propagation networks
    [5]. In this chapter efficient neural networks are trained for various aspects
    of analysis and design of double layer grids. A particular type of grid, namely
    square diagonal-on-diagonal, is selected for this study and the spans are chosen
    from 26.5 to 75 m. Backpropagation algorithm is employed for training efficient
    neural networks for evaluation of the maximum deflection, weight, and design of
    double layer grids. A special method is developed for data ordering to reduce
    the nonlinearity of the data and to increase the speed of training. This approach
    also provides the necessary stability. Additional neural nets are trained and
    tested for design of grids using the developed data ordering.


    # ## 4.2 Structural Models and Element Grouping


    The model considered in this chapter is a double layer grid with bar elements,
    connected by MERO type of joints. Each span contains 11 bays of equal length in
    both directions. The structure is assumed to be supported at corners on three
    nodes, i.e. it is connected to the columns at 12 nodes. The length of the spans,
    L, is varied between 26.5 and 75.0 m with the steps of 5 m. The height is varied
    between 0.035 and 0.095 L with the step of 20 cm.


    In order to simplify the design, the 1808 elements of the structure are put into
    16 groups, and the structure is assumed to comprise of 16 types of cross-sections.
    Due to the symmetry, and positioning of the supports at the corners, the elements
    with equal distance from the center node are put in groups and the cross-sections
    of each group are taken to be the same. Five such groups are constructed. The
    elements at top, bottom layers and diagonal elements can have different cross-sections.
    Thus a total of 15 groups of elements are identified and hatched differently.
    An additional group is associated with the boundary elements at the top layer,
    increasing the number of element groups to 16, Fig. 4.1. A simple program “Groupype”
    is developed for this grouping and associating the numbers 1–16 to the elements
    of the structure. Another program “Finaltype” uses the output of the “Groupype”
    and the input of SAP90 and selects the largest cross-section for the element of
    the same type, and associates this type to all the elements of the same group.


    A total number of 219 structures are generated and analyzed from which the results
    of 179 structures are used for training and 40 are employed for testing the networks.'
