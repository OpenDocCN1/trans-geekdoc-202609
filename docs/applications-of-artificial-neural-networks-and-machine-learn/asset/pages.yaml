  md: '# # Chapter 2

    Buckling Resistance Prediction

    of High-Strength Steel Columns Using

    Metaheuristic-Trained Artificial Neural

    Networks


    **Abstract** This chapter aims to develop practical metaheuristic-trained Artificial
    Neural Networks to predict the ultimate buckling load of High Strength Steel columns.
    The section height, flange width, web thickness, flange thickness, and steel yield
    strength are considered the input variables, while the ultimate buckling load
    was assumed to be the only output variable. ANN models are trained through algorithms
    such as LM, BR, and SCG; Four metaheuristic algorithms, namely Particle Swarm
    Optimization, Colliding Body Optimization, and their developed versions are used
    for efficient training of the ANNs.


    # ## 2.1 Introduction


    In this chapter buckling resistance prediction of high-strength steel columns
    is performed using metaheuristic-trained artificial neural networks [1]. The recent
    advances in steel production procedures have provided the engineering community
    with steel grades known for better characteristics, such as excellent toughness
    or high nominal yield stress (higher than 420 MPa), thus allowing for the greater
    use of high-strength steel (HSS). The use of HSS results in a significant decrease
    in the weight of structures; however, their stability requires to be thoroughly
    checked, particularly for compression elements where flexural buckling is commonly
    the major factor in design. The current design codes for HSS columns are based
    on experiments on normal-strength steel (NSS) materials because there were no
    tests done for HSS materials when the codes were established. As an example, EN
    1993-1-12 (2007) regulations [2], which are for steel grade materials up to S700,
    rely on buckling resistance curves based on the Ayrton-Perry type formulation
    that was developed through an extensive experimental program for NSS members conducted
    by the European Convention for Constructional Steelwork (ECCS), theoretical formulations
    obtained from the analysis of experimental results, and a reliability assessment
    employing Monte Carlo simulations.


    The present regulations in Eurocode 3 for HSS columns [2] are basically an extended
    version of the design rules for NSS columns, and the buckling resistance'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'they provide may not be precisely applicable. HSS materials have distinct manufacturing
    methods and material properties that lead to various structural behaviors concerning
    material and geometric imperfections compared to NSS. The field of structural
    engineering has seen significant advancements in recent years, particularly in
    the application of machine learning methods to predict the behavior of various
    structural elements. Although the importance of experimental evaluation of HSS
    members is not negligible, in relation to recent developments in the field of
    machine learning (Especially ANNs), it has become possible to predict the behavior
    of a variety of natural phenomena, including buckling behavior or flexural buckling
    of columns and beam-columns.


    Artificial neural networks (ANNs) are a branch of machine learning techniques
    that simulate the learning mechanism of biological organisms. ANNs are characterized
    by a large number of processing elements called neurons, which are interconnected
    through axons and dendrites forming synapses. ANNs resemble the structure of a
    human brain, consisting of many processing elements that can establish an accurate
    relation between some inputs and outputs of a given dataset for which no specific
    solution exists. ANNs are fairly efficient at finding complex relationships between
    influencing variables. They have been increasingly employed to solve complex and
    time-consuming problems in the field of structural engineering. Some of the pioneering
    works in employing ANN in structural engineering were carried out by Kaveh et
    al. [3], who utilized the prediction capability of neural networks in various
    fields of structures.


    A number of studies have investigated the use of ANNs and other machine learning
    techniques to predict the behavior of structural elements. The use of ANN to predict
    the strength of structural components and the buckling columns when subjected
    to axial compression is a topic of ongoing research. However, there needs to be
    more research on utilizing ANN to forecast buckling loads from experimental data.
    This is mainly due to the requirement of a large amount of experimental data to
    train the network, which incurs significant costs. Nonetheless, Waszczyszyn and
    Bartezak [4] have successfully operated Backpropagation Neural Networks (BPNN)
    to forecast the buckling load of cylindrical shells under axial compression.


    The experimental data of some previously published papers was utilized for training
    artificial neural networks using the Resilient Backpropagation learning algorithm
    to predict buckling load factor based on the imperfection data of shell specimens.
    Markopoulos et al. [5] used ANN with the Levenberg-Marquardt and Backpropagation
    algorithms as training functions to predict the collapse mode of PVC cylindrical
    shells under axial compression, using the shell thickness-to-diameter ratio and
    length-to-diameter ratio as inputs to the network. Ferreira et al. [6] focus on
    developing a prediction model for the lateral-torsional buckling resistance of
    steel cellular beams using ANNs. They demonstrated that ANNs are a promising tool
    for predicting lateral-torsional buckling resistance of steel cellular beams with
    high accuracy and efficiency. Also, Kaveh and Khavaninzadeh developed ANN-based
    models to predict FRP strength [7].'
