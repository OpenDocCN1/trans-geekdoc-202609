- pgno: 17
  md: '# # Chapter 1

    Artificial Intelligence: Background,

    Applications and Future


    **Abstract** In today’s world, which has witnessed unprecedented advances in technology
    and computer science, artificial intelligence has emerged as a top field captivating
    global attention. This technology, often referred to as AI, stands apart from
    other disciplines as it aims to design machines and systems that exhibit intelligence,
    learn autonomously, and make decisions akin to humans. Artificial intelligence
    introduces a transformative element to our reality, fostering significant breakthroughs
    and innovations.


    # ## 1.1 Artificial Intelligence Background


    The background of the question about artificial intelligence dates back to 1956,
    marked by the coining of the term “artificial intelligence” (AI) during a Dartmouth
    College conference. AI represents an interdisciplinary field shaped by the convergence
    of computer science, cybernetics, information theory, psychology, linguistics,
    and neurophysiology.


    The overarching aim of the AI is to replicate and execute intelligent functions
    similar to the human brain, thereby enabling the creation of technological innovations
    and theories. The evolution of artificial intelligence can be divide to distinct
    stages: the 1950s saw the dawn and decline of AI, followed by a resurgence in
    the late 1960s to 1970s with the advent of expert systems. The 1980s witnessed
    significant advancements due to the emergence of the fifth-generation computers.
    Subsequently, the 1990s ushered in a new era of AI research characterized by the
    integration of network technologies, particularly the internet, leading to the
    explosion of distributed AI models. This era not only focused on goal-oriented
    distributed problem-solving but also delved into multi-agent problem-solving,
    rendering AI more pragmatic.


    Moreover, the introduction of Hopfield’s multilayer neural network model catalyzed
    an upsurge in artificial neural network research across various spheres. Key theories
    and methodologies in AI encompass symbolism, behaviorism, and connectionism. Since
    its inception, artificial intelligence has evolved from a niche domain'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Fig. 1.1 Classification of types of artificial intelligence


    ![](img/4048998719320644ee88964326fd7995_18_0.png)


    to a cornerstone technology, poised for continuous development. The convergence
    of AI with cloud-based technologies, the Internet of Things, and 5G networks holds
    promise for enhanced possibilities and applications in the future, [1] and [2].


    Artificial intelligence includes a wide world that has many subsets and applications.
    In the following, we will give a brief explanation in relation to Fig. 1.1.


    # 1.2 Types of Artificial Intelligence


    # 1.2.1 Evolutionary Computation


    Evolutionary computing (EC) is a subfield of artificial intelligence that uses
    an iterative process, often inspired by biological mechanisms of evolution, to
    evolve a population of solutions to achieve a desired goal. EC has been applied
    in the field of civil engineering for decades, mainly serving as an effective
    method for solving complex optimization problems [3].


    # 1.2.2 Swarm Intelligence


    A meta-initiative based on swarm intelligence, which simulates a population of
    simple individuals that evolve their solutions by interacting with each other
    and with the environment, has shown promising performance on many difficult problems
    and in recent years, they have become a very active research field [3].'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.2.3 Fuzzy Systems


    The term “fuzzy” means vague and unclear. In normal life, we sometimes face situations
    where we do not know which is the right or wrong decision and the correct action
    is hidden from our eyes. At this point, “fuzzy logic” offers a unique and valuable
    proposition. In this way, the amount of uncertainty can be determined for each
    situation. For this reason, fuzzy logic is sometimes called doubtful logic because
    its results are created with doubt. Fuzzy logic has helped to solve many decision-
    making problems today, so that most of the time, it produces the best decision
    based on the inputs. Fuzzy logic is based on human decision-making and can be
    seen as a development of “Aristotelian logic” or “Boolean logic”. Today, based
    on fuzzy logic, “fuzzy numbers”, “fuzzy calculations” and even fuzzy statistical
    methods such as fuzzy clustering have been created. Devices and computers have
    been produced that have far better performance than similar devices with Boolean
    logic. The concept and study of fuzzy logic began in 1920, but the term fuzzy
    logic was first used by Professor Lotfi Asgarzadeh (1921–2017) in 1965 at Berkeley
    University.


    # 1.2.4 Expert System


    An expert system relies on human experts based on the existing knowledge of the
    startup knowledge system. The expert system creates the first and most effective
    system in the field of artificial intelligence research. The expert system is
    widely used in roads and bridges, construction engineering, geotechnical engineering,
    underground engineering, disaster prevention projects, materials engineering,
    geological exploration and petrochemical industries, etc. A system expert is in
    a specific domain and has relevant knowledge and experience in system programming.
    The expert system simulates the human expert’s problem-solving thinking process
    and reaches or approaches the level of experts.


    # 1.2.5 Chaos Theory


    Chaos theory is a branch of mathematics that investigates the behavior of dynamic
    systems that are very sensitive to initial conditions. Chaos is an interdisciplinary
    theory that states: in the randomness of complex chaotic systems, there are basic
    patterns, constant feedback loops, repetition, self-similarity, fractals, and
    self- organization. According to the definition, the word Chaos means “a state
    of complete confusion and disorder; complete lack of organization or order”. Chaos
    theory is an interesting contrast. The science of predicting the behavior of “inherently
    unpredictable” systems. In fact, chaos theory is a mathematical tool that allows
    us to derive beautiful structures from chaos. The main foundation of chaos theory
    is the'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'idea that order and chaos are not always opposites. Chaotic systems are a fascinating
    combination of order and chaos. When we look at them from the outside, they behave
    unpredictably and show disorder, but inside these systems we see a set of deterministic
    equations that work with order.


    Chaos is a name that is often applied to a non-linear dynamic. This expression
    is used to explain the complex behavior of so-called simple, linear and well-behaved
    systems. Chaotic behavior appears irregular and often random, similar to the behavior
    of a system strongly affected by random external noise. The mathematical definition
    of chaos is the unpredictable long-term behavior of a deterministic dynamical
    system due to sensitivity to initial conditions (commonly known as the butterfly
    effect). Chaos theory is defined as the qualitative study of unstable periodic
    behavior in deterministic nonlinear dynamical systems. Chaos occurs in very simple
    systems that are often free of noise. In fact, these systems are essentially deterministic;
    That is, with accurate knowledge about the initial conditions of the system, its
    future behavior can be predicted. As a result, chaos may be defined as a bounded,
    non-periodic (non-periodic) and noisy oscillation [4].


    # ### 1.2.6 Machine Learning


    In the science of machine learning, the issue of designing machines that learn
    by using the examples given to them and their own experiences is discussed. In
    fact, in this science, an attempt is made to design a machine in such a way that
    it can learn and act without explicitly planning and dictating each and every
    action by using algorithms. In machine learning, instead of programming everything,
    data is fed to a generic algorithm, and it is this algorithm that builds its own
    logic based on the data it is fed. Machine learning has various methods, including
    supervised learning, unsupervised learning, and reinforcement learning. Algorithms
    used in machine learning are among these three categories. Machine learning is
    a field of study that emerged from artificial intelligence. By using artificial
    intelligence, mankind seeks to build better and smarter machines. But researchers
    were initially unable to program machines to perform more complex tasks that are
    consistently challenging, except for a few simple tasks, such as finding the shortest
    path between point A and B. Based on this, a perception was formed that the only
    possible way to realize this goal is to design machines that can learn from themselves.
    In this approach, the machine is like a child that learns from itself. Therefore,
    machine learning emerged as a new capability for computers. Today, this science
    is used in various areas of technology, and its use has increased so much that
    people are often unaware of its existence in their daily tools and accessories,
    [5] and [6].'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 1.2.7 Neural Networks


    Neural networks are a computational model inspired by the structure of the human
    brain, which are mostly used to learn and recognize patterns and relationships
    between data. These networks are composed of one or more layers of neurons and
    information is transmitted through specific weights assigned to each connection
    between neurons. By training or adjusting these weights, the neural network can
    learn to recognize different patterns and features and then use them to make predictions
    or make decisions in new situations. There are different types of neural networks,
    which are explained in detail below. Neural networks are known as one of the key
    technologies in the field of deep learning and artificial intelligence and can
    model nonlinear problems. Because of this feature, they can be used in many problems
    in different fields such as image and speech processing to machine translation
    and data analysis. In general, neural network applications can be divided into
    three groups: data classification, data clustering, and regression problems [7].


    # 1.2.7.1 Classification


    In the data classification procedure, in order to train the model, a large amount
    of "labeled data" is needed so that the model predicts new data categories using
    the information provided by the data labels. In other words, in the data classification
    method, a person must use his knowledge in preparing the data set and label the
    data required for training the model based on various specialized knowledge such
    as linguistic knowledge so that the model learns the relationship between data
    and labels. This approach is called "supervised learning" in which human-prepared
    labels help the model learn. Determining spam and non-spam emails is an example
    of classification tasks and supervised approach.


    # 1.2.7.2 Clustering


    In the clustering method, deep learning algorithms recognize groups of data without
    the need for labeled data. In other words, clustering neural networks put them
    in separate groups by simply checking the similarity of the data, and eventually
    several groups of data are formed, and the data of each group have similar characteristics
    to each other. This approach of learning is called "unsupervised learning", during
    which the model recognizes different types of data groups without using any additional
    information and simply by having the data. The advantage of this method compared
    to the classification method is that there is no need to provide labeled data,
    which has a significant impact on reducing financial and time costs. One of the
    main principles of deep learning models is that the greater the diversity and
    distribution and volume of the model''s training data, the more the model learns
    from the data, and the model will perform better in recognizing new data and'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'making decisions about the defined problem. Since the volume of unlabeled data
    is larger compared to labeled data, clustering algorithms have better accuracy
    and performance.


    # 1.2.7.3 Regression


    In regression problems, the neural network is used to find the relationship between
    the “independent variables” or features and the “dependent variables” or the output
    value of the network. The output values of the model in regression problems are
    “continuous” values. Regression, like the classification method, uses the supervised
    learning approach, and in order to train the model, a dataset must be provided.
    Forecasting the cost of product prices and the amount of product sales in a future
    period of time are examples of tasks that can be modeled with the regression method.


    In today’s world, all aspects of human life are affected by artificial intelligence,
    and this branch of technology is developing and expanding day by day. In other
    words, with the emergence of this field of science, people’s way of life and work
    has undergone changes that have brought both important and positive advantages
    to mankind and brought various negative effects. In the following, the benefits
    of making systems intelligent using neural networks are discussed:


    +   **High efficiency in performing activities**: Unlike humans, the machine does
    not get tired of doing things day and night and can carry out responsibilities
    without interruption. Thus, by using smart models, time is saved and impressive
    results are achieved.


    +   **Fast learning tasks**: Models based on neural networks can learn tasks quickly.
    The costs of training human resources are high in terms of money and time. Thus,
    training models to perform a series of repetitive tasks can be more cost-effective
    for organizations.


    +   **Perform multiple tasks simultaneously**: In advanced intelligent models,
    models can be trained to perform multiple tasks simultaneously.


    +   **Wide application of intelligent models in various fields of human life**:
