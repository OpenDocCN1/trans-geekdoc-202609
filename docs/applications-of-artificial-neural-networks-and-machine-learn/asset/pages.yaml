    according to this figure. The $ald$ ratio determines the behavior of deep and
    slender beams and also the failure modes of them. In deep beams, it can be expected
    that marginal enhancement of resistance occurs by the beam beyond first diagonal
    crack due to arch action with redistribution of stresses. On the other hand, failure
    occurs after the first diagonal crack in slender beams. It indicates that there
    is possible meager reserve strength beyond diagonal cracking. The similar effect
    of ald ratio on shear strength of RC beams also reported in literature.


    The effect of longitudinal steel ratio ($\rho$) on shear strength is presented
    in Fig. 22.4c. It can be seen that shear strength increases as the percentage
    of longitudinal reinforcement increases. This contribution of longitudinal reinforcement
    in increasing shear resistance can be attributed to dowel action and can be about
    30% in slender member like slabs. It should be noted that in HSC beams, it demands
    higher percentage of longitudinal reinforcement to enhance the dowel force than
    beams made of normal strength concrete (NSC).


    From Fig. 22.4d, it can be seen that the compressive strength of concrete increases
    the shear strength when all other parameters are constant. The shear strength
    in RC slender beams significantly depends on the diagonal cracking strength. The
    diagonal cracking strength of a NSC beam without web reinforcement often expresses
    as a function of square root of compressive strength of concrete [27]. However,
    the shear strength of RC beams made of HSC tends to vary differently from the
    square root of compressive strength of concrete. From these observations, it can
    be concluded that the developed GMDH and MARS models are in good agreement with
    the physical characteristics of shear strength phenomenon and previous findings.


