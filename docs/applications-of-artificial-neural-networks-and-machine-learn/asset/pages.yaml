    # 14.4 Sloan''s Algorithm for Element Ordering


    This algorithm consists of two phases, namely the selection of pseudo-peripheral
    nodes, and the numbering, described briefly in the following.


    # 14.4.1 Determination of Pseudo-Peripheral Nodes


    A pair of starting nodes is determined by the following modified scheme.


    Algorithm


    +   Step 1. Select an arbitrary node v of minimum degree.

    +   Step 2. Generate an SRTv = {C1v, C2v, ..., Cdv} rooted at v. Decompose the
    subgraph containing the nodes of Cdv into its components (subcontours).

    +   Step 3. Select one node of minimum degree from each component. Generate an
    SRT from each of such nodes, and choose the one corresponding to the smallest
    width.

    +   Step 4. Repeat the process of Steps 2 and 3 as far as reduction in width of
    the SRT can be observed.


    The root “s” and the selected end node “e” are the pseudo-peripheral nodes required.


    # 14.4.2 Node Reordering


    The Sloan''s algorithm ensures that the position of a node in the reordering phase
    is not far from the one for which from the end node e is monotonically decreasing.
    In this method reordering phase begins at the start node s and assigns 1 to s.
    The following steps are taken:'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/4048998719320644ee88964326fd7995_282_0.png)


    Fig. 14.2 Different status of nodes in the process of labeling


    Step 1. Find the status of all the nodes. A node can be in the following four
    states as shown in Fig. 14.2. Prior to the numbering, all the nodes of the ECG
    model of the considered FEM are assigned non-active status. When a node of ECG
    is inserted in the priority queue, it is assigned pre-active statue. After a node
    is numbered, it is assigned post-active status. Nodes which are adjacent to a
    post-active node and that do not have post-active status are defined as having
    active status. These statuses are illustrated in Fig. 14.2 for a simple graph.


    Step 2. Prepare the list of the candidate nodes in the next step, which consists
    of active and pre-active nodes.


    Step 3. Calculate the priority for all the candidate nodes. For node i, the priority
    is given by:


    P(i) = -W₁ × n(i) - W₂ × d(e, i), (14.6)


    where W₁ and W₂ are integer coefficients (set as W₁ = 1 and W₂ = 2 in the original
    Sloan''s algorithm [14]); d(e, i) is the distance of node i to the end node e
    and


    n(i) = mᵢ - cᵢ + kᵢ (14.7)


    mᵢ is the degree of node i, cᵢ is the number of active and post-active nodes adjacent
    to node i, and kᵢ is zero if the node i is active and post-active, and unity otherwise.
    In fact n(i) represents the increment of the frontwidth for labeling of the node
    i.


    Step 4. Select the node with highest priority among the candidate nodes and label
    it.


    Step 5. Repeat steps 1-4 until all the nodes are labeled.


    Sloan introduced d(e, i) in order to incorporate the overall property of the graph
    in the process of ordering, and changed the localized nature of the King''s algorithm.'
