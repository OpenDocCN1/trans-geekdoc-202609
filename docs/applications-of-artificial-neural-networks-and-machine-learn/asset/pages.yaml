- pgno: 320
  md: '# Chapter 16

    Stimating the Vulnerability

    of the Concrete Moment Resisting Frame

    Structures Using Artificial Neural

    Networks


    **Abstract** The aim of this chapter is to present an innovative method for investigating
    the seismic vulnerability of the existing concrete structures with moment resisting
    frames (MRF). For this purpose, a number of 2D structural models with varying
    number of bays and stories are designed. The seismically–induced damages to these
    structural models are determined by performing extensive nonlinear dynamic analyses
    under a number of earthquake records. Using the IDARC program for dynamic analyses,
    the Park and Ang damage index is considered for damage evaluation of the structural
    models. A database is generated using the level of induced damages versus different
    parameters such as PGA, the ratio of number of stories to number of bays, the
    dynamic properties of the structures models such as natural frequencies and earthquakes.
    Finally, for estimate the vulnerability of any typical reinforced MRF concrete
    structures, a number of artificial neural networks are trained for estimation
    of the probable seismic damage index.


    # 16.1 Introduction


    This chapter is based on the study made in Ref. [1].


    Our knowledge from the earthquakes and their destructive effects on structures
    has been improved greatly during the last few decades. Accordingly, the seismic
    design provisions necessary for the design of new buildings and rehabilitation
    of the existing structures have been witnessing rapid changes. The concept of
    performance based design now is present in many seismic design codes and guidelines.
    However, determining the vulnerability of the existing structures that have been
    designed and built using the previous Codes remains a great challenge. In the
    current state of the practice, the structures are designed to withstand the minor
    to moderate earthquakes by remaining within their elastic range. For larger earthquakes,
    the inelastic response of the structural elements provides a mechanism for dissipation
    of the input energy. Therefore, it is important to identify the level of damage
    for the structures undergoing inelastic deformation during an earthquake episode.
    A large body of literature is available on evaluating the amount of the seismic
    damage imposed to'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'the structures, using different measures [1–4]. Not surprisingly, numerous
    local and global damage indices have been introduced ever since, to determine
    the remaining capacity of the system after the earthquake event [1–4]. Depending
    on the number of damage states considered, the vulnerability of the existing structures
    can be evaluated accordingly. These damage states can be used for post-earthquake
    damage evaluation of the structures, performance prediction of the newly designed
    buildings, and reliability analysis of existing buildings and facilities. In his
    method, Rytter [5] distinguishes four levels of damage detections as the following:
    Level 1 (Detection), that provides a qualitative indication that damage might
    be present in the structure; Level 2 (Localization), which gives information about
    the probable position of the damage; Level 3 (Assessment), that provides an estimate
    of the extent of the damage; Level 4 (Consequence), which offers information about
    the safety of the structure. Doebling and Farrar [3] classified the structural
    damages into linear and nonlinear categories. Linear damage indicates that a structure
    with elastic behavior keeps its linear-elastic behavior after the damage. However,
    nonlinear damage indicate that a structure with linear elastic behavior shows
    nonlinear behavior after the damage.


    Marvala and Hunt [6] presented a number of neural network techniques, which employs
    frequency response function and modal data simultaneously to identify faults in
    the building structures. They tested their proposed method on simulated data from
    a cantilevers beam. Worden [7] applied neural network to diagnose damage in a
    simple simulated lumped-parameter mechanical system. It was shown that the system
    transmissibility provides a sensitive feature for the detection of small stiffness
    changes. Xia et al. [4] proposed a statistical method with combined uncertain
    frequency and mode shape data for structural damage identification. They updated
    a finite element model by comparing the measured vibration data before damage,
    or the same analytical finite element model of the undamaged structure with those
    measured after damage. Thus, the changes in vibration characteristics the finite
    element model becomes equal to the changes in the measured data as closely as
    possible. They applied the proposed method to a laboratory tested steel cantilever
    beam and frame structure.


    Hung and Kao [8] presented a two steps approach for damage detection in building
    structures. The system identification, as the first step, involves using neural
    system identification networks (NSIN) to identify the undamaged and damaged states
    of a structural system. The partial derivatives of the outputs with respect to
    the inputs of the NSIN which identify the system in a certain undamaged or damaged
    state, have a negligible variation with different system errors. Then in the second
    step, structural damage detection involves using the neural damage detection network
    (NDDN) to detect the location and the extent of the structural damage. The input
    to the NDDN is taken as the aforementioned partial derivatives of NSIN, and the
    output of the NDDN identifies the damage level for each member in the structural
    system.


    Huang et al. [9] tried to identify the dynamic characteristics of a building to
    diagnose any earthquakes induced damages to the building, using a back-propagation
    neural network approach. The dynamic characteristics of the system were directly
    evaluated using the weighting matrices of the neural network trained by the observed
    acceleration responses and input base excitation. The level of the damage to the'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'building under a large earthquake is assessed by comparing the modal properties
    of the structural system under the target earthquake with those for small earthquakes
    without causing any damage to the buildings. They demonstrated the feasibility
    of the proposed approach by processing the dynamic response of a five-storey steel
    frame subjected to the Kobe earthquake with different intensities through shaking
    table tests. Park et al. [2] employed displacement time histories of the existing
    structures and back-propagation neural network technique to assess the severity
    and location of the defects for reinforced concrete structures. They used the
    results of finite-element analysis of a simply-supported reinforced concrete beam
    with the assumed defects, for training the neural networks and also controlling
    their performance in identifying the assumed damages.


    Kirkegaard and Rytter [10] considered the potential of using back-propagation
    neural network for damage assessment of a free-free cracked straight steel beam
    based on vibration measurements. Ziemianski and Piatkowski [11] applied the neural
    networks for damage detection in rod structures. The identification method was
    based on the analysis of propagation of waves in solids. Zang and Imregun [12]
    used the measured frequency response functions (FRF) as input data to train artificial
    neural networks for structural damage detection. Harpula and Ziemianski [13] applied
    the neural networks for damage detection in bar structures based on changes in
    their dynamic characteristics.


    In this work, the Park and Ang [1] damage index is considered to assess the seismic
    damage imposed to different reinforced concrete MRF structural models. Extensive
    nonlinear time history analyses performed using a number of earthquake records
    with different intensities. Then, the generated data base is used to train a number
    of artificial neural networks for prediction of the damage index. Also, numerical
    examples presented to demonstrate the performance of the proposed method.


    # 16.2 Damage Index


    In order to quantitatively estimate the seismic damage of the structural buildings,
    an appropriate damage assessment method is needed. Among different existing damage
    indices that have been proposed by researchers, the Park and Ang [13] damage index
    is selected due to its frequent use in the literature, for evaluating the seismic
    damage imparted to the concrete MRF structures. The Park and Ang damage index
    is defined as:


    D.I._{P.A} = \frac{\delta_m}{\delta_u} + \frac{\beta}{\delta_u F_y} \int dE  (16.1)


    in which:

    D.I._{P.A} = The Park and Ang Damage Index.

    \delta_m = Maximum deformation of structure during an earthquake.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '\(\delta_u\) = Ultimate deformation capacity of building structure under monotonic
    loading.


    \(\beta\) = Dimensionless strength reduction parameter.


    \(\int dE\) = Hysteretic energy absorbed by building structure during time story
    analysis.


    +   Also, the following damage states are used;

    +   0 \(\le D.I.\rho_A < 0.4\) Representing repairable damage.

    +   0.4 \(\le D.I.\rho_A < 1\) Representing damage beyond repair.

    +   1 \(\le D.I.\rho_A\) Representing total collapse of structure.


    As it was mentioned earlier, the IDARC program was used to perform the time history
    dynamic analyses. The program is able to calculate the Park and Ang damage index
    for different elements of the building structures. The damage index can be obtained
    for a structural element (local damage index), for different stories, and for
    the whole of the building (global damage index). In this research, the global
    damage indices are calculated for structural damage assessment purposes. In that
    regard, 24 planar reinforced concrete structures are designed according to the
    first edition of Iranian seismic design code, Standard 2800 [14]. The natural
    periods of vibration of the first few modes of the structural models are shown
    in Table 16.1. The designed structural models were dynamically analyzed using
    six earthquake components recorded on stiff soil shown in Table 16.2, with different
    intensities. As the Table 16.1 shows, the dominant frequencies of the earthquake
    records is an indication that they have been recorded on stiff soil (Soil type
    2 based on Iranian seismic Code, Standard 2800). Figures 16.1 and 16.2 show the
    acceleration time histories and the Fourier amplitudes of these records. The earthquake
    records have been scaled such that their PGA be equal to 10, 20, 30, 40, 50, and
    60% of the acceleration of gravity (g). The damage indices are calculated for
    all combination of structural models and earthquake records. The resulting data
    base is used for training a number of artificial neural networks.


    As an example, the damage indices computed for a 3 story-1 bay structural model
    (3s-1b) under different scaled Tabas earthquake record with PGA from 0.1 to 1.0
    g are shown in Fig. 16.3. The obtained results indicate that for PGA''s up to
    0.3 g, no plastic hinges are formed in the structural models. However, due to
    the first term in the right hand side of Eq. (16.1), one still could have a nonzero
    value for the damage index.


    # 16.3 Artificial Neural Networks


    A model of an artificial neuron is shown in Fig. 16.4 [15]. A set of input signals
    (X1, X2, ..., Xn) are applied to the neuron. Each signal is multiplied by a proportional
    weight before arriving at summation unit (\(\Sigma\)). All weighted inputs are
    summed to make the output NET. Then the activation function is applied to the
