  md: 'one to observe how the statistical error parameters of the developed GMDH network
    predictions is changed. Tables 18.4 and 18.5 present the sensitivity analysis
    of GMDH network for reinforced members with and without stirrups, respectively.
    Parameters $L$ and $h$ in these tables are span length and overall depth of cross
    section, respectively. In case of members with stirrups, results of sensitivity
    analysis show that the $\rho_{FW}$ ($R^2 = 0.86$, $RMSE = 36.90$, and $MSE = 13.64$)
    is the most effective parameter on the shear strength whereas the $f_{fow}$ ($R^2
    = 0.95$, $RMSE = 21.33$, $MSE = 450.77$) has the least influence on shear strength
    modeled by the GMDH. The other effective parameters on shear strength are $ald$,
    $d$, $b$, $f_c$, $\rho_F$, $E_F$, and $E_{FW}$ ranked from higher to lower values,
    respectively. It should be mentioned that the contributions of $d$, $\rho_{FW}$
    and $ald$ are remarkably more than other parameters. Based on the Table 18.5,
    for members without stirrups, results of sensitivity analysis indicated that the
    $ald$ ($R^2 = 0.85$, $RMSE = 21.06$, $MSE = 443.64$) is the most effective parameter
    on the shear strength whereas the $h$ ($R^2 = 159.30$, $RMSE = 12.62$, $MSE =
    443.64$) has the least influence on shear strength for the GMDH model. The other
    effective parameters on shear strength were $\rho_F$, $b$, $E_F$, $A_F$, $d$,
    $f_{fu}$, $f_c$, and $L$ ranked from higher to lower values, respectively. It
    should be noted that results show that the $ald$ and $\rho_F$ were the most important
    parameters whereas the other parameters had marginally effects on the prediction
    of shear strength.


    To obtain new contribution of this study, effects of the GMDH output model and
    the output of the most common empirical equations on the variations of $ald$,
