    # 15.5 Concluding Remarks


    Optimization of transmission towers plays an important role in the cost of transferring
    the electrical power and its distribution plays due to high number of such towers.
    These structures perform similar to space trusses under three types of vertical,
    horizontal and longitudinal loadings. The genetic algorithm used for optimization
    is a migration GA. Here, the energy method is combined with the force method to
    reduce the design unknowns and also to remove the need for the operation corresponding
    to matrix inversion. In towers with small number of elements this algorithm can
    easily'
