    # 19.3 Construction of the Database


    In this study, 223 records were collected for experimentally tested samples of
    axially loaded short specimens of circular columns wrapped with CFRP sheets, as
    presented in the Appendix 19.1. The database includes the following fields:


    +   - D: specimen diameter (mm)

    +   - H: specimen length (mm)

    +   - f_co: compression strength of unwrapped concrete cylinder (MPa)

    +   - t_f: the thickness of the used CFRP sheets (mm)

    +   - f_f: tension capacity of the used CFRP sheets (MPa)

    +   - E_f: modulus of elasticity of the used CFRP sheets (GPa)

    +   - f_cc: compression strength of wrapped concrete cylinder (MPa).


    Appendix 19.1 shows a summary of the literature information constituting the database,
    including the number of data collected. All input and output variables in the
    database are normalized on a [-1, 1] scale, following this formula:


    ```

    Norm x_i = [ \frac{x_i - \min(x)}{\max(x) - \min(x)} \times 2 ] - 1 (19.2)

    ```


    where x is the input or output variable to be normalized, x_i is its corresponding
    value, and Norm x_i is the calculated value (Table 19.1).


    # 19.4 Metaheuristic Optimization Technique


    # 19.4.1 Genetic Algorithm


    Among the metaheuristic algorithms, Genetic algorithm (GA) is a well-known algorithm,
    which is inspired from biological evolution process. A genetic algorithm is a
    computational model of biological evolution. Genetic algorithms are useful both'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'as search methods for solving problems and for modeling evolutionary systems.
    GA mimics the Darwinian theory of survival of fittest in nature. GA was proposed
    by Holland in 1992. The basic elements of GA are chromosome representation, fitness
    selection, and biological-inspired operators. Holland also introduced a novel
    element namely, Inversion that is generally used in implementations of GA. typically,
    the chromosomes take the binary string format. In chromosomes, each locus (specific
    position on chromosome) had two possible alleles (variant forms of genes)—0 and
    1. Chromosomes are considered as points in the solution space. These are processed
    using genetic operators by iteratively replacing its population. The fitness function
    is used to assign a value for all the chromosomes in the population. The biological-inspired
    operators are selection, mutation, and crossover. In selection, the chromosomes
    are selected on the basis of its fitness value for further processing. In crossover
    operator, a random locus is chosen and it changes the subsequences between chromosomes
    to create off-springs. In mutation, some bits of the chromosomes will be randomly
    flipped on the basis of probability [8].


    # 19.4.2 Particle Swarm Optimization


    Particle swarm optimization (PSO) was developed by Eberhart and Kennedy. In this
    algorithm, initialization is done randomly. The members of this population are
    called particles and each particle is assigned an initial velocity. PSO mimics
    the swarming behavior of insects, fish, and birds, where these swarms search for
    food jointly. The theoretical framework of PSO is simple. It can be coded and
    implemented efficiently and is computationally inexpensive in terms of memory
    and CPU time required. In PSO, a swarm member called a particle is a potential
    solution, a point of the search space. The global balance is known as the food
    situation. The particle has fitness and speed values to change its flight path
    to the best swarm experiences to find the global optimum in the D-dimensional
    solution space. Today, PSO has attracted considerable attention and has been successfully
    used in various fields, especially for unconstrained continuous optimization problems.


    # 19.4.3 Colliding Bodies Optimization


    As a developed type of meta-heuristic algorithm, colliding bodies optimization
    (CBO) is introduced and applied to structural problems by Kaveh and Mahdavi. The
    CBO is multi-agent algorithm inspired by a collision between two objects in one-dimension.
    Each agent is modeled as a body with a specified mass and velocity. A collision
    occurs between pairs of objects and the new positions of the colliding bodies
    are updated based on the collision laws [9].'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# 19.4.4 Enhanced Colliding Bodies Optimization


    The enhanced colliding bodies optimization (ECBO) is introduced by the authors
    [10] and it uses memory to save some historically best solution to improve the
    CBO performance without increasing the computational cost. In this method, some
    components of agents are also changed to jump out from local minimum.


    # 19.5 Quality Assessment Criteria


    In this study, several quality evaluation criteria such as Mean Square Error (MSE),
    Root Mean Square Error (RMSE), Mean Absolute Error (MAE), Mean Absolute Percentage
    Error (MAPE), Normalized Mean Absolute Error (NMAE), Normalized Root Mean Square
    Error (NRMSE), correlation coefficient (R) were used to evaluate and compare the
    models. The following equations show the formulation of these criteria:


    ```

    RMSE = \sqrt{\sum_{i=1}^N (z_0 - z_p)^2 / N} \quad (19.3)


    R = \sqrt{1 - \frac{\sum_{i=1}^N (z_0 - z_p)^2}{\sum_{i=1}^N (z_0 - \bar{z}_i)^2}}
    \quad (19.4)


    MAE = \frac{1}{N} \sum_{i=1}^N |z_0 - z_p| \quad (19.5)


    MSE = \frac{1}{N} \sum_{i=1}^N |z_0 - z_p|^2 \quad (19.6)


    NMAE = \left[ \frac{\frac{1}{N} \sum_{i=1}^N |z_0 - z_p|}{\max(z_0) - \min(z_0)}
    \right] \times 100 \quad (19.7)


    MAPE = \frac{1}{N} \left[ \frac{\sum_{i=1}^N |z_0 - z_p|}{\sum_{i=1}^N |z_0|}
    \right] \times 100 \quad (19.8)


    NMAE = \left[ \frac{\frac{1}{N} \sum_{i=1}^N |z_0 - z_p|^2}{\max(z_0) - \min(z_0)}
    \right] \times 100 \quad (19.9)

    ```'
