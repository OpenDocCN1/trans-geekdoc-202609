    for their design. The following assumption are considered:


    +   1. The sum of dead load and live load equal to 2.5 kN/m² is applied to the
    nodes of the top layer.

    +   2. All the nodes are considered as ball jointed.

    +   3. Linear analysis is performed.

    +   4. One hundred and four Different tube sections available in STAHL are included
    in the program for design.

    +   5. Design is carried out according to AISC code.'
