    # ## 4.1 Introduction


    In this chapter efficient neural networks are trained for design of double layer
    grids based on Kaveh and Servati [1]. Square diagonal-on-diagonal grids with spans
    varying between 26.5 and 75 m are considered. Backpropagation algorithm is employed
    for training efficient neural networks for evaluation of the maximum deflection,
    weight, and design of double layer grids. A special method is developed for data
    ordering to reduce the nonlinearity of the data and to increase the speed of training.
    This approach also provides the necessary stability. Additional neural nets are
    trained and tested for design of grids using the developed data ordering.


    Double layer grids are one of the most popular types of space structures. Analysis
    and design of such structures are normally time consuming since a large number
    of nodes and members is involved. The problem becomes more involved when nonlinear
    analysis or optimization is performed, where numerous analyses should be carried
    out.


    Space structures are often used for covering large spans. Sport stadiums, assembly
    halls, exhibition centers, swimming pools, shopping arcades and industrial buildings
    are typical examples of structures where large unobstructed areas are essential
    and where minimum interference from internal support is required. Space structures
    are often classified as grids, domes and barrel vaults, Makowski [2].


    Double layer grids are typical examples of prefabricated space structures and
    also one of the most popular forms which are frequently used nowadays. These structures
    have proved to be very economic in terms of the height and ease in construction.'
