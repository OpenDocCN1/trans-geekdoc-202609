    # ## 10.5 Enhanced Charged System Search


    # ### 10.5.1 Review of the Charged System Search Algorithm


    Charged System Search (CSS) algorithm, proposed recently by Kaveh and Talatahari
    [7], is based on electrostatics and Newtonian mechanics laws. The CSS algorithm
    contains a number of agents which are called charged particles (CPs). Each CP
    is considered as a charged sphere which exerts an electric force on other CPs
    according to the Coulomb and Gauss laws. The resultant forces and the laws of
    motion determine the new location of the CPs [21]. The pseudo-code for the CSS
    algorithm can be summarized as follows:


    +   **Step 1. Initialization.** Initialize CSS algorithm parameters. Initialize
    an array of charged particles (CPs) with random positions. The initial velocities
    of the CPs are taken as zero. Each CP has a charge of magnitude (\(q\)) defined
    considering the quality of its solution as:


    \(q_i = \frac{fit(i) - fitworst}{fitbest - fitworst} \quad i = 1, 2, ..., N\)
    (10.20)


    where \(fitbest\) and \(fitworst\) are the best and the worst fitness of all the
    particles; \(fit(i)\) represents the fitness of agent \(i\); and \(N\) is the
    total number of CPs. The separation distance \(r_{ij}\) between two charged particles
    is defined as:


    \(r_{ij} = \frac{\|X_i - X_j\|}{\|(X_i + X_j)/2 - X_{best}\| + \varepsilon}\)
    (10.21)


    where \(Xi\) and \(Xj\) are the positions of the \(ith\) and \(jth\) CPs, respectively;
    \(Xbest\) is the position of the best current CP, and \(\varepsilon\) is a small
    positive number to avoid singularities.


    +   **Step 2. CM creation.** A number of the best CPs and the values of their
    corresponding fitness functions are saved in the Charged Memory (CM).


    +   **Step 3. The probability of moving determination.** Determine the probability
    of moving each CP toward the others considering the following probability function:'
  merge: -1
  img_proc: true
- pgno: 220
  md: '\( p_{ij} = \left\{ \begin{array}{ll} 1 & \frac{fit(i)-fitbest}{fit(j)-fit(i)}
    > rand \lor fit(j) > fit(i) \\ 0 & \text{otherwise} \end{array} \right. \)


    **Step 4. Determination of the forces on CPs.** The force vector is calculated
    for each CP as


    \(\mathbf{F}_j = q_j \sum_{i, i \neq j} \left( \frac{q_i}{a^3} r_{ij} \cdot i_1
    + \frac{q_i}{r_{ij}^2} i_2 \right) ar_{ij} p_{ij} (\mathbf{X}_i - \mathbf{X}_j)
    \left\{ \begin{array}{ll} j = 1, 2, ..., N \\ i_1 = 1, i_2 = 0 \Leftrightarrow
    r_{ij} < a \\ i_1 = 0, i_2 = 1 \Leftrightarrow r_{ij} \ge a \end{array} \right.\)


    where Fj is the resultant force affecting the jth CP and \(ar_{ij}\) indicates
    the kind of force and is defined as


    \( ar_{ij} = \left\{ \begin{array}{ll} 1 & rand < 0.8 \\ -1 & \text{else} \end{array}
    \right. \)


    where \(rand\) represents a random number


    **Step 5. Solution construction.** The new position and velocity of each CP will
    be obtained by using the following equations:


    \(X_{j,new} = randj_1 \cdot k_a \cdot \frac{F_j}{m_j} \cdot \Delta t^2 + randj_2
    \cdot k_v \cdot V_{j,old} \cdot \Delta t + X_{j,old}\)


    \(V_{j,new} = \frac{X_{j,new} - X_{j,old}}{\Delta t}\)


    where randj1 and randj2 are two random numbers uniformly distributed in the range
    (1, 0); \(m_j\) is the mass of the CPs, which is equal to \(q_j\) in this chapter.
    The mass concept may be useful for developing a multi-objective CSS. \(\Delta
    t\) is the time step, and it is set to 1. \(k_a\) is the acceleration coefficient;
    \(k_v\) is the velocity coefficient to control the influence of the previous velocity.
    In this chapter \(k_v\) and \(k_a\) are taken as:


    \(k_v = 0.5(1 - iter/iter_{max}), \quad k_a = 0.5(1 + iter/iter_{max})\)


    where iter is the iteration number and iter\(_{max}\) is the maximum number of
    iterations.


    **Step 6. CP position correction.** If each CP exits from the allowable search
    space, correct its position using the HS-based handling as described in Refs.
    [7, 22].


    **Step 7. CM updating.** If the fitness function of some new CP vectors are better
    than the worst ones in the CM, include the better vectors in the CM and exclude
    the worst ones from the CM.


    **Step 8. Controlling the terminating criterion.** Steps 3–7 are repeated until
    a terminating criterion is satisfied.'
