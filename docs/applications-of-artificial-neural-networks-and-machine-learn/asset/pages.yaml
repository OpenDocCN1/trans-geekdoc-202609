- pgno: 425
  md: '# Chapter 21

    Kernel Extreme Learning Machine Application in Prediction of Bond Strength Between
    EBR FRP and Concrete Substrate


    **Abstract** In this study, the Kernel Extreme Learning Machine (KELM) is applied
    to develop a new accurate and efficient prediction model. For this purpose, 342
    datasets related to the effective parameters involved in the debonding process
    are gathered from different sources in literature. A Gamma Test (GT) is used to
    determine the most effective parameters. Mechanical properties of the FRP plates
    and the bond length are determined as the most important parameters. Furthermore,
    the performance of the KELM model is investigated against the developed ANN and
    ANFIS models and the existing most common design equations.


    # 21.1 Introduction


    This chapter is adopted from the research work of Kaveh et al. [1]. During the
    last few decades, external bonding of fiber reinforced polymer (FRP) plates or
    sheets have been employed as an excellent option for strengthening of reinforced
    concrete (RC) structures [2, 3]. Several advantages of FRP materials such as high
    strength and resistance to corrosion, high durability, non-magnetic and having
    higher strength to weight ratio which leads to reduce the self-weight of RC structure,
    and high fatigue resistance make them as practical alternatives for retrofitting
    seismically deficient structures and also structures suffering from corrosion
    related problems. The externally bonded FRP plates can also be used to improve
    confinement in compression members and increase the moment capacity of flexural
    members. The mechanical performance of the interface between FRP and concrete
    is often affecting on the behavior of the RC structures. The bond interface is
    often one of the weakest links in RC structures, and debonding at the interface
    between FRP and concrete substrate is one of the critical failure modes in these
    structures. Therefore, investigating the bond behavior of the externally bonded
    FRP is a very sensitive issue in design of RC structures, and it has widely been
    scrutinized in recent years [2].


    In general, the bond characteristics of externally bonded FRP have been investigated
    through three methods: (a) direct measurements by using experimental studies such
    as pull-off tests or the single-lap shear tests (e.g. [4, 5]); (b) numerical methods'
  merge: -1
  img_proc: true
- pgno: 426
  md: '(e.g. [6]); and (c) hybrid model extended by applying experimental test results
    and analytical solutions [7]. The first method is the most popular and widely
    studied by many researchers. In pull-off test, the slip and local bond stress
    are directly computed by varying the strain. The strain is measured by closely
    spaced strain gauges located on top of the FRP laminate [7]. The stress state
    of the interface is similar to that in a pull-off test in various debonding failure
    modes. As a result, many studies, both theoretical and experimental have been
    performed on pull tests of FRP bonded to concrete substrate [8]. Through the test,
    the maximum transferable load ($P_{max}$) and the strain profiles along the bonded
    length are usually assessed.


    Understanding of the behavior of FRP-to-concrete interfaces required to be extended
    for the economic and safe design of externally bonded FRP systems. Investigations
    indicated that the main failure mode of FRP-to-concrete joints in shear tests
    is cracking of concrete under shear, occurring commonly at a few millimeters beneath
    the adhesive-concrete interface [8]. A reliable local bond-slip model for the
    interface and maximum transferable load is very significant issue for accurately
    modeling and understanding of debonding failures in FRP-strengthened RC structures.


    Various design equations have been developed to predict the maximum transferable
    load based on empirical analysis of experimental data obtained from pull-off test
    (e.g. Van Gemert [9], Tanaka [10], Hiroyuki and Wu [11], Maeda et al. [5], Neubauer
    and Rostasy [12], Khalifa et al. [13], Adhikary and Mutsuyoshi [14], Chen and
    Teng [8], De Lorenzis et al. [15], Yang et al. [16], Izumo (from [17]), Iso (from
    [17]), Sato (from [17]), Dai et al. [18], Lu et al. [19], Camli and Binici [20]).
    Many of these equations used to estimate the bond strength between FRP and concrete
    substrates are highly empirical, and their predictive abilities are limited by
    the corresponding data sets from which they were derived, and do not provide a
    reliable prediction of maximum transferable load [21]. Furthermore, the bond mechanism
    is complex because it depends on different parameters including the concrete strength,
    the bond length, the FRP plate axial stiffness, the FRP-to-concrete width ratio,
    the adhesive stiffness, and the adhesive strength [19]. The mentioned formulae
    did not completely consider the nonlinearity between input and output parameters
    and did not check different combinations of input parameters for estimating the
    bond strength. Most of the existing prediction models also neglect the adhesive
    material properties [21].


    Recently, machine learning approaches such as Artificial Neural Networks (ANNs)
    [22] and ANFIS [23] as the most common soft computing methods have been employed
    to overcome these limitations and benefited in the many other fields [24–28].
    Mashrei et al. [29] investigated the application of Back-Propagation Neural Network
    (BPNN) model for predicting the bond strength of FRP-to-concrete joints. Mansouri
    and Kisb [30] also evaluated the applications of neuro fuzzy and neural network
    approaches for estimation of debonding strength for masonry elements retrofitted
    with FRP composites. Results showed that ANN and ANFIS approaches can be successfully
    used to predict the bond strength. Abdellah et al. [31] utilized GEP to predict
    the bond strength of FRP to concrete composite joints based on a data base containing
    238 instances. Abdalla et al. [32] used ANN for prediction of ultimate bond strength
    between FRP and concrete based on a data base containing 25 instances.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'In the present chapter, a fast computing learning algorithm namely as Kernel
    Extreme Learning Machine (KELM) is employed to predict bond strength between FRP
    plates and concrete substrates for the first time. To the best knowledge of authors,
    the ELM has not been used as predictive method in structural engineering domain.
    Several advantages of ELM method in comparison with neural network method are
    reported in literature. For instance, the intervention of humans in developing
    process of algorithm is the least in comparison with other neural networks [33].
    The unknown function between input and output variables in ELM algorithm is estimated
    based on single-layer feed-forward (SLFN) architecture. Unlike other conventional
    methods of neural networks, the output weights of SLFN are determined analytically
    by ELM theory. Favorable universal capability, fast learning speed and suitability
    for activation and kernel functions are the other pros of ELM method [34]. In
    order to develop KELM models for bond strength, a comprehensive datasets containing
    342 experimental data was collected for the first time from different sources
    in literature. The relative importance of significant parameters dealing with
    bond strength of FRP-reinforced members is investigated through sensitivity analysis
    done by Gamma test. Furthermore, in the present study, the ANN and ANFIS models
    are also developed to evaluate the robustness of KELM model in aspects of performance
    and physical analyses. The robustness of proposed KELM model was also verified
    through a parametric analysis.


    The remaining sections of this chapter are organized as follows. In Sect. 21.2,
    a background of Shear bond strength between FRP and concrete substrate is presented.
    ELM, and Gamma Test (GT) are described briefly in Sect. 21.3. Fourth section states
    to the involved input parameters and modeling process for predicting bond strength
    between FRP and concrete substrate. The performances of KELM model are compared
    with existing equations and also ANN and ANFIS algorithms. Sensitivity and parametric
    analyses are conducted in the penult section to evaluate the robustness of KELM
    model in capturing the underlying physical behaviors of bond strength. At the
    end, the chapter is concluded in Sect. 21.6.


    # 21.2 Shear Bond Strength Between FRP and Concrete Substrate


    Debonding of the FRP reinforcement due to shear stresses is often one of the crucial
    failure modes of composite elements, which externally bonded with FRP. The externally
    bond strength between FRP and concrete substrate have been tested and analyzed
    generally on the basis of a single pull-off test. In the test, the direct tensile
    force P_app is applied to the FRP plate bonded to concrete substrate in order
    to determine the maximum transferable load (P_max). A sketch of single pull-off
    test for FRP to concrete is presented in Fig. 21.1. The shear bond strength is
    generally estimated as the maximum transferable load by applying a coupled model
    of a shear stress-tangential slip law and normal stress-displacement law [35].'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Fig. 21.1 Schematic diagram of single pull-off test for FRP to concrete


    ![](img/4048998719320644ee88964326fd7995_428_0.png)


    The maximum transferable load is related to the mechanical characteristics of
    the materials and the interfacial fracture energy. Generally, \( P_{max} \) for
    FRP externally bonded reinforcement on supports made of brittle materials is defined
    as:


    \( P_{max} = b_f \int_{0}^{\infty} \tau(x)dx \quad (21.1) \)


    where \( b_f \) is the width of FRP plate, \( x \) is the longitudinal axis, and
    \( \tau(x) \) is the bond shear stress distribution along the interface. The interfacial
    fracture energy is defined as the work done by the interfacial shear stress until
    the complete separation of the FRP plate from concrete substrate. According to
    many studies in literature, the maximum transferable load is directly proportional
    to the square root of the interfacial fracture energy, \( \sqrt{G_f} \), regardless
    of the shape of the bond-slip curve [36]. The interfacial fracture energy is defined
    as:


    \( G_f = \int_{0}^{\infty} \tau(s)ds \quad (21.2) \)


    where \( s \) represents the FRP local slip. The general expression for \( P_{max}
    \) (debonding load) is derived as a function of \( G_f \) and material properties
    as follows:


    \( p_{max} = b_f \sqrt{2E_p t_p G_f} \quad (21.3) \)


    where \( E_p \) and \( t_p \) are elastic modulus and thickness of the FRP, respectively.
    The fracture energy can be estimated as:


    \( G_f = k_b k_G \sqrt{f_c f_{ut}} \quad (21.4) \)


    in which \( k_b \) is a width factor coefficient for considering the effect of
    reinforcement width on \( P_{max} \). \( k_G \) is a calibration parameter, which
    is determined through experimental results of bond tests, \( f_c \) is the compressive
    strength and \( f_{ut} \) is the tensile strength of the concrete substrate.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 21.2.1 Existing Bond Strength Models


    Since the 1980s many researchers have developed various equations for predicting
    bond strength between FRP and concrete substrate, including Van Gemert [9], Tanaka
    [10], Hyrouruki and Wu [11], Maeda et al. [5], Neubauer and Rostasy [12], Khalifa
    et al. [13], Adhikary and Mutusyoshi [14], Chen and Teng [8], De Lorenzis et al.
    [15], Yang et al. [16], Izumo (from [17]), Iso (from [17]), Sato (from [17]),
    Dai et al. [18], Lu et al. [19], Camli and Binici [20]. Furthermore, the international
    federation for structural concrete (fib) [37] and CNR-DT200/2004 [38] design guidelines
    also present different formulae for estimating the bond strength of FRP-to-concrete
    elements. These equations are presented in Table 21.1. These relations are mainly
    based on either fracture mechanics based theory or on derived empirical equation
    calibrated with experimental datasets or combinations of the two. Most of these
    equations neglect the influence of the adhesive material properties. The accuracy
    of these empirical and combined theoretical and empirical models seems to be limited.
    These formulae were developed mainly based on regression analysis on experimental
    datasets and do not completely consider the nonlinearity between input and output
    parameters. Recently, the machine learning approaches have been widely applied
    in engineering problems. The main advantage of these approaches can be mentioned
    as: they consider all possible relations between input and output parameters and
    also unlike the regression approaches, checked different combinations of input
    parameters for estimating output parameter.


    # 21.3 Methodology


    The data mining approaches such as Artificial Neural Networks (ANN) and adaptive
    neuro-fuzzy inference system (ANFIS) have been employed as useful tools for modeling
    and forecasting complex engineering problems. Among these methods, the extreme
    learning machine (ELM) has not yet been widely applied in structural engineering.
    The description of the ELM is described in the following subsection. The ANN and
    ANFIS algorithms are also outlined in this section.


    # 21.3.1 Extreme Learning Method


    Extreme Learning Method (ELM) was firstly introduced by Huang et al. [33] as a
    fast computing learning algorithm. It uses single-layer feed-forward neural networks
    (SLFN) architecture to estimate an unknown function. The topological structure
    of ELM is depicted in the Fig. 21.2. Unlike the conventional methods of neural
    networks, ELM theories determine the output weights of SLFN analytically and generate
    the input weights randomly. The main advantages of ELM algorithm can be listed
    as:'
