    # 17.5 Concluding Remarks


    The hybrid method presented in this chapter is simple and efficient, and applicable
    to large-scale problems. The method consists of two stages. In the first stage,
    a graph theoretical method is used for primary decomposition followed by a neural
    network approach in the second stage for the completion of the partitioning. The
    presented method has the following features:'
