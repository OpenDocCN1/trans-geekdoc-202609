    # 1.3 General Structure of Neural Network


    In order to understand the question “what is a neural network”, one must look
    at the structure of the network and its components. The neural network consists
    of several layers, the minimum number of these layers is 3 layers. Input layer,
    middle or hidden layer and output layer. Each layer of the neural network consists
    of a set of nodes that have the same function as the “neurons” of the human brain.
    In the image below, it can be seen that the first layer has 2 nodes, the hidden
    or middle layer has 3 nodes and the last layer has 1 node. The number of nodes
    in each layer will be different according to the number of dimensions of the input
    data and the problem for which we want to train the model, [8] and [9]. General
    structure of neural network is show in Fig. 1.2.


    Each neural network has an input layer that receives data and sends it to its
    next layer to perform various calculations on the data. In other words, this layer
    does not apply any computing and processing operations on the data and is only
    responsible for receiving data and sending them to the next layers. The input
    data of the first layer can include text, audio and video information.


    The layer that is placed between the input layer and the output layer is called
    the hidden layer or the middle layer. The minimum number of intermediate layers
    of the neural network is one layer, and based on the complexity and type of problem,
    it can


