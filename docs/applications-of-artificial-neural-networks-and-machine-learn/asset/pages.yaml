  md: '# 13.5 Conclusions


    In this chapter, a new computational method according to a metaheuristic-based
    Artificial Neural Network (ANN) has been presented. In this new framework, firstly
    a computational dataset, including 3000 structures and their corresponding collapse
    mechanisms and load factors has been generated using the hinge-by-hinge method.
    After that, a hybrid metaheuristic-ANN framework has been employed to simulate
    the procedure of the calculation of the collapse mechanism and its corresponding
    load factor. The trained framework is now capable to obtain actual collapse mechanisms
    and load factors for new frames. This claim has been proved via three different,
    challenging, and benchmark problems. All numerical examples confirm the efficiency
    and accuracy of the new proposed algorithm for plastic limit analysis.


