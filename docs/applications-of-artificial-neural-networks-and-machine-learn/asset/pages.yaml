    # 19.7 Proposed ECBO-FFB Approach Formulation


    The performance of artificial neural networks is possible when the weight of the
    network along with its bias values in different layers are known. Unlike many
    previous studies in which only the optimized network structure is presented, and
    in order to provide a simple method to achieve the presented results, the network
    weights along with the bias values in different layers for ECBO-FFB which provide
    better results than The rest of the compounds are presented in Table 19.4.'
