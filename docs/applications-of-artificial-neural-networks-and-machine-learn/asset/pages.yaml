    The concept of Radial Basis Functions networks arises from the theory of function
    approximation. The main features of these networks are outlined as follows:


    +   1. They are two-layer feedforward neural networks.


    +   2. Their hidden nodes implement a set of radial basis functions (e.g. Gaussian
    functions).


    +   3. Training the networks is divided into two stages; initially, the weights
    from the input to hidden layer are determined, and then the weights from the hidden
    to output layer are obtained.


    +   4. The training/learning is pretty swift.


    +   5. RBF networks are very accurate at at interpolation.


    # 5.4 Comparison Between RBF Networks and BP Networks


    There are various similarities and distinctions between RBF and BP:


    # Similarities


    +   1. Being nonlinear feedforward neural networks.


    +   2. Being universal approximators.


    +   3. Being employed in alike application fields.


    # Distinctions


    +   1. An RBF network has normally a single hidden layer, whereas BP neural networks
    can have any number of hidden layers.


    +   2. RBFs are fully connected, while it is common for BP networks to be only
    partially connected.'
