- pgno: 233
  md: '# 11.3.1 Evaluation of Learning and Performance of the Networks


    If an ANN can presents acceptable response to the inputs present or not present
    in the training set, it is said that the ANN has learnt well and it has good performance.
    This state is evaluated by various mathematical methods. In the following two
    important parameters for the measurement of learning and performance of ANNs are
    described.


    # 11.3.1.1 Root Mean Square of Errors (RMS)


    RMS error is the square root of sum of squares of errors between actual and desired
    outputs of the network. This parameter is considered as target function in back
    propagation network and the weights of the network are considered as function
    variable. During the training of a network, RMS reduction indicates the progress
    in network learning. As the RMS is reduced, the network learns better and gives
    more accurate answers to the existent inputs in the training set, but this procedure
    does not indicate that the network can give accurate answers to the nonexistent
    inputs in the training set. In other word, it is possible that value of RMS is
    very little, but the network can’t present acceptable answers to new inputs. On
    the other hand, if RMS is reduced more than required limit, it is possible that
    the network recites the existent data in the training set and loses the ability
    of generalization and response to new inputs; so one cannot absolutely certify
    the good learning and performance of a network according to low RSM value.


    # 11.3.1.2 Correlation Factor


    Harmonic variation of two variables is called correlation. When two variables
    change in agreement with each other and in the same direction, it is said that
    they have positive correlation, e.g. size and weight of some people have positive
    correlation, because it is very probable that somebody who is taller is heavier,
    vice versa if two variables change in agreement with each other but in opposite
    directions, they have negative correlation. Finally if variables don’t change
    in agreement with each other, they called uncorrelated. Correlation factor can
    be calculated according to Eq. (11.4).


    ```

    r(x, y) = \frac{\sum (x_i - \bar{x})(y_i - \bar{y})}{[\sum (x_i - \bar{x})^2 \sum
    (y_i - \bar{y})^2]^{1/2}} (11.4)

    ```


    That:

    x̄: Average of x variables

    ȳ: Average of y variables.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The value of \( r \) always is between -1 and 1. If \( r = 1 \), correlation
    is perfect and if \( r = -1 \), correlation is perfect and negative, and if \(
    r = 0 \), the variables are uncorrelated. Also in ANN, the correlation factor
    between the actual and desired outputs from training and testing sets together
    can be used as a criterion for evaluating performance and learning of the network.
    Closer the value of this factor to 1 for both data existing in training and testing
    set, better the learning and performance of the network. It is notable that correlation
    factor between the actual and desired outputs from training set, can never be
    used for the evaluation of the performance of a network, because may be the network
    would recited existent data in the training set and the correlation factor between
    actual and desired output is close to 1 but the network cannot present acceptable
    answers to new inputs (inputs where doesn’t exist in testing set).


    # 11.3.2 Data Classification for Training and Testing of ANNs


    The data are divided into 3 groups for training and testing of the ANNs as follows:


    +   - Group A: Network for assessment of damage in 3, 4, and 5 stories structures

    +   - Group B: Network for assessment of damage in 6–10 stories structures

    +   - Group C: Network for assessment of damage in 3–10 stories structures.


    # 11.3.3 Training of the ANNs for Predicting the Vulnerability of the Structures


    In order to train the AANs, the “Neural Works” program has been employed [17].
    In all the networks, the training set includes seven parameters which are: the
    ratio of number of stories to number of bays of structure, period of first vibration
    mode of structure in terms of second, peak ground acceleration (p.g.a.) in terms
    of ground gravity acceleration (g), earthquake main frequency (Hz), scaled earthquake
    acceleration, maximum displacement of top of the structure, and Park and Ang damage
    index, respectively. Testing set includes six parameters which are as the same
    as the above-mentioned parameters except the damage index.


    In order to train the networks, back propagation algorithm is used. Architecture
    of the networks consists of one input layer, one (or two) hidden layer(s), and
    one output layer. Both Hyperbolic Tangent and Sigmoid functions are employed in
    training the networks and their performances are compared. The number of neurons
    in hidden layer are increased until the best prediction is achieved. The results
    of training of group A networks are briefly shown in Table 11.2. As it can be
    seen from this table, the network AT-12 with 12 neurons in its first hidden layer
    has achieved the best prediction.'
