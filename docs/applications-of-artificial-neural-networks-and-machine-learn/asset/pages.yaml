  md: '# Chapter 22

    Development of Predictive Models for Shear Strength of HSC Slender Beams Without
    Web Reinforcement Using Machine-Learning-Based Techniques


    Abstract The present chapter presents two robust methods to predict bond strength
    between FRP reinforcement and masonry units. The M5’ algorithm as a rule based
    method is used to develop practical equations for estimating bond strength. The
    MAR S algorithm besides its high predictive ability is used to determine the most
    important parameters in predicting bond strength. To develop the models, a comprehensive
    database including 575 test series is collected from different sources in literature
    for the first time. The reinforcement width, ratio between widths of FRP reinforcement
    and masonry unit, tensile strength of support, axial strength of reinforcement
    and bond length are the five influential parameters considered to estimate the
    maximum bond strength.


    # 22.1 Introduction


    This chapter is based on the predictive models for shear strength of HSC slender
    beams without web reinforcement using machine-learning based techniques developed
    by Ref. [1]. In the last 30 years, the application of high strength concrete (HSC)
    have been remarkably increased in field due to significant development in building
    and materials technology. Several advantages including having better mechanical
    properties, structural efficiency and economically beneficial in terms of both
    structural and aesthetic aspects made the HSC as a widely used material in the
    construction of high-rise buildings and long-span bridges in all over the world.
    The definition of HSC has been changed parallel to the developments of its properties
    in recent years. HSC can be defined as a concrete with compressive strength significantly
    beyond and more than double from what is used in normal practice (normal strength
    concrete, NSC). Different design codes and researchers stated different limits
    for compressive strength of concrete for demarcating between NSC and HSC materials.
    In the present study, the definition of HSC by ACI 363R-10 [2], which is defined
    as a concrete with compressive strength more than 40 MPa, has been followed).


    One of the most crucial failures in reinforced structures made of HSC or NSC materials
    is the shear failure. Failure due to the shear in beams with HSC is brittle'
  merge: -1
  img_proc: true
- pgno: 456
  md: 'and occurs suddenly without warning. Several researchers have investigated
    experimentally and analytically to evaluate shear carrying capacity of reinforced
    concrete members. It has been found that several mechanisms including the shear
    transfer in the compression zone, aggregate interlock across crack face, stirrups
    crossing the shear crack, and dowel action of longitudinal reinforcing bars crossing
    the crack can be involved to provide shear resistance of RC beams [3]. In beams
    without web reinforcing stirrups, crossing the shear crack mechanism cannot be
    considered as internal contributing forces to shear resistance. It has been found
    that the shear failure mechanism in concrete members reinforced longitudinally
    and but without transverse reinforcement under bending varies significantly and
    the size of member and shear span-to-depth ratio are the two main parameters that
    influence on the shear failure mechanism. In fact, the shear span to depth ratio
    (a/d) determines the failure modes of RC beams and divides them into deep beams
    (<2.5) and slender beams (>2.5). For deep beams with a/d approximately less than
    2.5, the arch action occurs [4]. For the slender beams with a/d greater than 2.5,
    the shear strength of reinforced member with longitudinal steel bars is a function
    of a/d as well. For these members, a/d represents the interacting effect of the
    moment and shear at a section on the shear strength. Accurate prediction of the
    shear behavior of reinforced concrete (RC) beams unlike to flexural behavior,
    which can generally be predicted well, is a challenging work due to the complexity
    of the shear transfer mechanism.


    Furthermore, there are remarkable differences between NSC and HSC beams without
    web reinforcing [5–10]. It has been reported that the fracture surface in HSC
    beams is smooth and develops along the transition zone between the matrix and
    aggregates whereas it is rough in NSC beams. Also internal shear transferring
    mechanisms show different contributions for different concrete strengths. At higher
    concrete strengths, the aggregate interlocking does not contribute greatly because
    of the smooth fracture planes and the straight cracks, which do not go around
    the aggregate particles [11, 12].


    Shear strength prediction of HSC slender beams without web reinforcement is still
    contentious. There is no unified rational theory explaining the interaction of
    the three internal contributing forces to shear resistance, especially for HSC.
    Various design equations are available to estimate shear strength of reinforced
    concrete beams without stirrups. Their accuracy, however, seems limited for slender
    reinforced HSC beams as these equations were empirically developed using predefined
    forms and with experimental data mainly generated for a limited number of influential
    parameters.


    Recently, machine learning approaches have been successfully employed to overcome
    these limitations in many different problems of civil engineering (e.g. [13–23]).
    In this regard, particularly, Elsanadedy et al. [12] very recently applied regression
    models and neural networks for predicting the shear strength of HSC slender RC
    beams without stirrups. Their results showed that ANN approach generally provides
    better predictions than regression approach in term of accuracy. However, ANN
    implementation suffers from several drawbacks. The major disadvantage of this
    approach is that the ANN training process is achieved through a gradient descent
    algorithm on the error space, which can be very complex and may contain many'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'local minima. Furthermore, trial and error processes are required to determine
    the network structure. In addition, ANN method does not give enough insight into
    the generated models and are not as easy to use as the empirical formulas.


    Considering theses drawbacks and the unsatisfactory of existing equations, this
    chapter proposed two alternative approaches for predicting shear strength of HSC
    slender beams without web reinforcement. Among soft computing approaches, the
    GMDH network and MARS algorithms are known as self-organized and non-parametric
    methods to model and discover the behaviors of unknown or complicated systems
    based on given input–output data points [24–26]. The main advantage of GMDH and
    MARS methods in comparison with ANN method is that the dependencies between input
    parameters and output parameter are represented in parametric form as an equation
    while these dependencies are hidden within neural network structures in ANN method.


    To develop new predictive models based on GMDH and MARS models, a comprehensive
    existing database very recently used by Elsanadedy et al. [12] containing 250
    experimental tests was employed. The developed GMDH model related the shear capacity
    to the longitudinal steel ratio, the shear span-to-depth ratio, compressive strength
    of concrete, the size of the beam specimens, and the size of coarse aggregate.
    The results of the developed GMDH and MARS were compared to the most common existing
    equations and also to multiple nonlinear regression (MNLR) approach developed
    in this study through statistical error indicators. Results confirmed that the
    developed GMDH and MARS models outperformed the existing equations and the developed
    regression-based equations in terms of both accuracy and safety aspects. The relative
    importance of significant parameters dealing with shear strength is also investigated
    through sensitivity analysis. The robustness of proposed models was also verified
    through a parametric analysis.


    This chapter outlines as follows: the existing design equations and their limitations
    are given in the following section. The GMDH and MARS algorithms are described
    next in the Sect. 22.3. The applied data set and modeling process are presented
    in Sect. 22.4 which is followed by the results and discussion section. Finally,
    the summary and conclusion are presented in Sect. 22.6.


    # 22.2 Design Equations for Shear Strength


    # 22.2.1 Design Equations


