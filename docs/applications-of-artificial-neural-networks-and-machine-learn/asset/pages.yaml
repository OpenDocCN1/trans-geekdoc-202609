  md: '# Chapter 18

    GMDH-Based Prediction of Shear Strength of FRP-RC Beams

    with and Without Stirrups


    Abstract In the present study, group method of data handling networks (GMDH) are
    adopted and evaluated for shear strength prediction of both FRP-reinforced concrete
    members with and without stirrups. Input parameters considered for the GMDH are
    altogether 12 influential geometrical and mechanical parameters. Two available
    and very recently collected comprehensive datasets containing 112 and 175 data
    samples are used to develop new models for two cases with and without shear reinforcement,
    respectively. The proposed GMDH models are compared with several codes of practice.
    An artificial neural network (ANN) model and an ANFIS based model are also developed
    using the same databases to further assessment of GMDH. The accuracy of the developed
    models is evaluated by statistical error parameters. The results show that the
    GMDH outperforms other models and successfully can be used as a practical and
    effective tool for shear strength prediction of members without stirrups (R²=0.94)
    and with stirrups (R²=0.95).


    # 18.1 Introduction


    This chapter is based on GMDH-based prediction of shear strength of FRP-RC beams
    with and without stirrups [1]. Internal reinforcement by fiber reinforcement plastic
    or polymer (FRP) as an advanced polymer composite material has gained increasing
    popularity in the reinforced concrete building and civil/structural infrastructures
    during the last two decades. This popularity owes to the desired specific advantages
    such as light weight, high tensile strength, non-corrosive, and nonmagnetic properties
    despite disadvantages such as higher initial cost compared with steel reinforcement
    and as a result a number of types of FRP bars are now commercially available.
    FRP bars are a competitive option for internal reinforcement in beams more than
    other types of members and known as FRP-reinforced concrete (FRP-RC) beams. Because
    of the mechanical differences between FRP and steel bars, FRP-RC beams show different
    performances under flexure and shear failure. Over the last two decades several
    researchers have conducted experimental and theoretical studies toward accurate
    investigation of shear strength and more specifically flexural'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'strength of FRP-RC beams. In parallel many design codes developed equations
    for safe design of FRP-RC beams such as: ACI 440.1R-06 (2007), CSA S6-06 (2006),
    CSA S806-12 (2012), the Japan Society of Civil Engineering (JSCE) standard (1997),
    CNR DT-203/2006 (2007).


    Shear failure mode is as much as flexural failure importance because of its rapid
    progression. Although shear resistance mechanisms of FRP-RC beams with and without
    stirrups are mainly similar to the steel reinforcement case, the material differences
    between FRP and steel result in different shear resistance performances. Available
    design codes are essentially developed by modifications on the shear design equations
    of steel reinforced beams with the aim of minimizing these differences. However,
    there are differences between these equations which result in variable performances
    of safety. Many studies have been conducted recently to better evaluate the current
    design codes based on the databases obtained from available experimental literature.
    For example Oller recently studied comprehensively the shear design problem of
    FRP-RC beams with and without stirrups. Based on the literature it is generally
    accepted that current shear design equations of FRP-RC beams are conservative
    and in some cases un-conservative. It should be noted that as much as accurate
    performance prediction of members is desired by engineers and on the other hand
    this can be more curious in the case of FRP bars because of its high cost than
    steel.


    Soft computing based techniques have emerged as more flexible, less assumption
    dependent and potentially self-adaptive approaches to generate predictive models
    for problems which by their nature are inherently complex, nonlinear and dynamic.
    The shear strength capacity of FRP-RC members with and without stirrups is supplied
    by several mechanisms. Therefore, it can be an inherently complex, nonlinear and
    dynamic function of many influential mechanical and geometrical parameters. In
    this regards the use of soft computing based approaches in the shear strength
    capacity assessment of FRP-RC members is attracted attention in the recent years
    but not as much as other prediction problems of RC members Kaveh applied genetic
    algorithm for this problem with 8 influential parameters for two cases of with
    and without stirrups using 100 and 68 data samples, respectively. Although a simple
    equation is developed but considering a semi-empirical equation was essential
    in their study. Kara addressed this problem for the case of without stirrups based
    on the gene expression programming (GEP) approach using 104 experimental data
    with 7 influential parameters. Mohammadı Golafshani developed successfully artificial
    neural network and fuzzy logic based models using 179 different splice beam tests
    with six input variables. An explicit formulation is also available based on the
    developed model by GEP approach. Lee used artificial neural network (ANN) for
    this problem without stirrups using 110 test data with 6 influential parameters.
    ANN is also used by Bashir and Ashour for this problem. Nasrollahzadeh and Basiri
    solve this problem based on fuzzy inference system (FIS) using 128 and 69 data
    samples with 8 influential parameters for two cases of without and with stirrups,
    respectively, and present FIS based formulations for each case. Mohammadi Golafshani
    et al. used artificial neural network and genetic programming to develop predictive
    models for the bond strength of the GFRP bars in concrete, based on 159 experimental
    database with seven input'
