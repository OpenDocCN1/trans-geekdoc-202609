  md: 'To develop a predictive model for shear strength of FRP-RC beams with and without
    stirrups based on the ANFIS algorithm, MATLAB programming language version R2012a
    is also employed. The Genfis 2 function based on the subtractive clustering method
    is used to generate the FIS structure. The strategy for finding the best structure
    of ANFIS is similar to the previous methods. At the first step, the member functions
    of the inputs are generated using subtractive clustering. Then a recursive least
    square method is used to tune the member function parameters. The number of member
    functions is gradually decreased by reducing the range of influence of cluster
    centers in a trial and error manner.


    The performance of GMDH model besides ANN and ANFIS based models for estimating
    shear strength capacity of FRP-reinforced members with stirrups and without stirrups
    in the training and testing sets are illustrated in Fig. 18.1, which present the
    scatter between measured and predicted shear strength around the optimal line
    of equality. As shown, there is a little scatter around the optimal line between
    predicted and measured values of shear strength in both training and testing sets.
    The similar performances of the GMDH models on the training and testing data indicate
    that they have both good predictive ability and generalization performances.


    The GMDH model performances are further confirmed analytically in Table 18.2,
    which contains four different performance measures including: $R$, $R^2$, $RMSE$,
    and $BIAS$. It is demonstrated that the models perform well in both training and
    testing sets and the performance of GMDH model for training set is consistent
    with testing sets.


    To further evaluation of the GMDH models the results obtained for prediction of
    shear strength are compared with the traditional design equations and with other
    soft computing based techniques in the following first two subsections, respectively.
    Parametric analysis and sensitivity analysis are also conducted in the next two
    subsections to assess the influences of important parameters on shear strength
    and determining the most important predictive parameters.


