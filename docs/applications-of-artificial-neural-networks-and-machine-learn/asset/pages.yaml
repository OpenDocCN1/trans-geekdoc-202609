  md: '# 5.7 Metamodeling Using the ERBF Approach


    The ERBF is a metamodeling approach that utilizes a combination of radial and
    nonradial basis functions. This novel concept holds the appealing features of
    both classes of basis functions: the effectiveness of the multiquadric RBFs together
    with the flexibility of the NRBFs (Fig. 5.11).


    # Combining Radial and Nonradial Basis Functions


    As discussed beforehand, the ERBF approach promotes the notion of applying more
    than one basis function for each data point. By using these two different basis
    functions, the ERBF approximation function is as:


    \(\tilde{f}(x) = \sum_{i=1}^{n_p} \sigma_i \psi (\|x - x^i\|) + \sum_{i=1}^{n_p}
    \sigma_i (x - x^i)\) (5.15)


    where \(\psi (\|x - x^i\|)\) and \(\phi_i (x - x^i)\) are obtained in Eqs. (5.11)
    and (5.14), respectively. Remark that every data point \(x_i\) is correlated with
    two different but complementary basis functions: (a) the typical RBF represented
    in Eq. (5.11) and (b) the basis function determined in Eq. (5.14). By taking the
    advantage of the definition of NRBFs provided in Eqs. (5.13) and (5.14) the following
    equation can be obtained:


    \(\tilde{f}(x) = \sum_{i=1}^{n_p} \sigma_i \psi (\|x - x^i\|) + \sum_{i=1}^{n_p}
    \sum_{j=1}^{m} [\alpha_{ij}^L \phi^L (\xi_j^i) + \alpha_{ij}^R \phi^R (\xi_j^i)
    + \beta_{ij} \phi^\beta (\xi_j^i)]\) (5.16)


    where \(\phi^L, \phi^R,\) and \(\phi^\beta\) are represented in Table 5.1. The
    following coefficient vectors and their sizes are defined as:


    \(\alpha^L = \{ \alpha_{11}^L \alpha_{12}^L \cdots \alpha_{1m}^L \cdots \alpha_{(n_p)(m)}^L
    \}^T \quad (m n_p) \times (1)\) (5.17)


    Fig. 5.11 Nonradial basis function in two dimensions


