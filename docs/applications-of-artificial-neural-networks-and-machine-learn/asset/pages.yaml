    that represent the output value at that node. If the estimated error at a generated
    subset (leaf) is higher than at the previous node (parent), the leaf node can
    be dropped.


    At the final step, smoothing process is applied to reduce the problem of sharp
    discontinuousness at the leaves of the pruned tree. In the smoothing process,
    estimated value of each leaf is filtered along the path back to the root. The
    value at each node that is joining with the predicted value of the linear model
    for that node is calculated as follows:


    ```

    $$P'' = \frac{np + kq}{n + k}$$ (20.6)

    ```


    where P’ is the prediction passed up to the next higher node, p is the prediction
    passed to the current node from the below, q is the value predicted by model at
    the node, n is the number of training instances reach to previous node, and k
    is a constant [33]. Finally, the M5’ algorithm yields a set of linear multivariable
    equations (rules) to estimate target value (see Fig. 20.2b).'
