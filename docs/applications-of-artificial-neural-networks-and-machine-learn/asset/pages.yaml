  md: '# 22.4.2 Data Division and Pre-processing


    The data used to calibrate and validate the MARS, GMDH, and MNLR models were obtained
    from the literature and include a series of 250 concrete shear capacity tests,
    which were compiled by Elsanadedy et al. [12] from 33 experimental studies performed
    between 1957 and 2013. All selected beams are without stirrups and were longitudinally
    reinforced with non-prestressed steel rebars. Only slender beams with a/d ≥ 2.5
    that their failures primarily occur due to shear were considered. The specimens
    are monotonically loaded using either one or two concentrated loads till failure.
    Details of data used can be found in [12].


    The available data were randomly divided into two sets: a training set for model
    calibration and an independent validation set for model verification. The validation
    dataset was used to specify the generalization capability of the models to new
    data they had not been trained with. In other words, the testing data were applied
    to measure the performance of the models obtained by proposed algorithms when
    applied to dataset which played no role in building the models. The statistics
    of the data used in the training and validation sets are given in Table 22.2,
