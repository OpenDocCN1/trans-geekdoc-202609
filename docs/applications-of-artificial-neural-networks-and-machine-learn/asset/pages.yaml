    of initial imperfection accurately and reliably. Four ML methods, namely Particle
    Swarm Optimization (PSO), Colliding Body Optimization (CBO), and their developed
    version by applying Genetic Algorithm (GA), Particle Swarm Optimization–Genetic
    Algorithm (PSO-GA), and Colliding Body Optimization–Genetic Algorithm (CBO-GA),
    are implemented in this study to train ANNs efficiently. Firstly, a finite element
    method (FEM) model was created using ABAQUS software for proof of concept in FEM
    Modeling; then, a database consisting of 114 FEM specimens was created, and their
    statistical characteristics were analyzed. Secondly, the fundamentals of the four
    adopted ML methods were briefly presented to illustrate how they solve complex
    regression problems. Thirdly, a model training procedure was implemented to obtain
    the optimized and trained models. Finally, the performance of the trained ML models
    was evaluated and compared.


