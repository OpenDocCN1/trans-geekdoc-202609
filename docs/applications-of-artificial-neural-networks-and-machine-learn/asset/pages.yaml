- pgno: 403
  md: '# 20.3.2 MARS Algorithm


    Multivariate adaptive regression splines (MARS) was firstly presented by Friedman
    [34] as a nonlinear and nonparametric intelligent computing regression algorithm.
    It uses a series of piecewise linear or cubic segments (splines) to model the
    nonlinear responses between the inputs and outputs of a system. The resulting
    piecewise equations are known as the basis functions (BFs). The slope of regression
    function is allowed to change from one segment to the next. The end points of
    each segment are called knots. A knot marks the end of one region of data and
    the beginning of another. Unlike the well-known parametric linear regression analysis,
    MARS provides greater flexibility to explore nonlinear relation between a response
    variable and predictor variables. MARS also makes no assumption about the underlying
    functional relationship between response and predictor variables. Furthermore,
    MARS searches for possible interactions between variables by checking all degrees
    of interactions. Considering all functional forms and interactions between input
    and output variables makes MARS capable to track the complex data structures in
    high-dimensional datasets. The general MARS function can be expressed using the
    following equation:


    \(\tilde{f}(x) = \beta_0 + \sum_{m=1}^M \beta_m \lambda_m(x)\) (20.7)


    where \(\tilde{f}(x)\) is the predicted response, \(\beta_0\) and \(\beta_m\)
    are constants, which are estimated to yield the best data fit and \(M\) is the
    number of basis functions included in the model. The basis function in MARS model
    can be either one single spline function, or a product of two or more spline functions
    for different predictor variables. The spline basis function, \(\lambda_m(x)\),
    can be specified as:


    \(\lambda_m(x) = \prod_{k=1}^{k_m} [s_{km}(x_{v(k,m)} - t_{k,m})]\) (20.8)


    where \(k_m\) is the number of knots, \(s_{km}\) takes either 1 or -1 and indicates
    the right/left regions of the associated step function, \(v(k, m)\) is the label
    of the predictor variable and \(t_{k,m}\) is the knot location.


    MARS generates basis functions by searching in a stepwise manner. An adaptive
    regression algorithm is used for selecting the knot locations. An optimal MARS
    is developed through a two-stage forward and backward procedures. In the forward
    stage, MARS overfits data by considering a great number of basis functions. In
    the backward, to avoid overfitting, redundant basis functions are deleted from
    Eq. (20.7). MARS adopts Generalized Cross-Validation (GCV) to delete the redundant
    basis functions. The expression of GCV is considered as:'
  merge: -1
  img_proc: true
- pgno: 404
  md: '$$GCV = \frac{\frac{1}{N} \sum_{i=1}^{N} [y_i - \hat{f}(x_i)]^2}{\left[ 1 -
    \frac{C(B)}{N} \right]^2}$$ (20.09)


    in which $N$ is the number of data and $C(B)$ is a complexity penalty that increases
    with the number of basis function (BF) in the model. It is defined as:


    $$C(B) = (B + 1) + dB$$ (20.10)


    where $d$ is a penalty for each BF included into the model and $B$ is number of
    basis functions [34].


    # 20.3.3 Statistical Error Parameters


    In order to evaluate the performances of the developed models analytically, the
    following statistical error parameters ae applied: mean absolute error (MAE),
    root mean square error (RMSE), correlation coefficient (R) and coefficient of
    determination ($R^2$).


    $$MAE = \frac{\sum_{i=1}^{N} |P_i - O_i|}{N}$$ (20.11)


    $$RMSE = \sqrt{\frac{1}{N} \sum_{i=1}^{N} (P_i - O_i)^2}$$ (20.12)


    $$R = \frac{\sum_{i=1}^{N} (P_i - P_m)(O_i - O_m)}{\sqrt{(P_i - P_m)^2}\sqrt{(O_i
    - O_m)^2}}$$ (20.13)


    $$R^2 = 1 - \frac{\sum_{i=1}^{N} (O_i - P_i)^2}{\sum_{i=1}^{N} (O_i - O_m)^2}$$
    (20.14)


    where $O_i$ is the measured value; $P_i$ stands for prediction values; $N$ is
    the number of data points; $O_m$ is the mean value for observation; and $P_m$
    is the mean value of prediction.'
