- pgno: 163
  md: 'In this mode when the input vector is presented to the network, one weight
    vector or a combination of many weight vectors based on the number of winning
    nodes build the output. In the interpolation mode, more than one Kohonen unit
    has a non-zero activation with


    ![](img/4048998719320644ee88964326fd7995_163_0.png)


    The activation of the output units is then given by


    ![](img/4048998719320644ee88964326fd7995_163_1.png)


    In operation, for each Kohonen cluster unit, \(D_i\) value (\(i = 1, \dots, p\))
    based on the Euclidean distance is computed, a set of \(N\) units (\(N = 1, \dots,
    N_{win}\)) with minimum \(D\), are selected. The winner nodes are ordered from
    minimum to maximum based on their \(D_N\) values. The unit with the smallest \(D_N\)
    which is closer to the input vector must have more share in the interpolation
    mode. To accomplish this, the following relation is suggested:


    ![](img/4048998719320644ee88964326fd7995_163_2.png)


    Here \(z_j\) is the share of each winner unit which is used in Eq. (7.6). For
    the closer Kohonen units to the input vector, \(D_j\) has the smallest value which
    will result in a larger \(z_j\) in Eq. (7.7). \(D_j\) has been introduced in the
    denominator to amplify this effect.


    # 7.3 Gradient Computations


    The optimal design of structures requires the computation of the stress and displacement
    constraints. The gradient of constraints usually requires the intermediate calculation
    of the gradient of the displacement with respect to design variables, since most
    common constraints (i.e., stress limits) are directly related to the displacements
    [10]. Using the displacement method of analysis, the finite element technique
    requires the solution of the matrix equation


    ![](img/4048998719320644ee88964326fd7995_163_3.png)


    where the global stiffness matrix K is the sum of the element stiffness matrices
    \(k_i\)'
  merge: -1
  img_proc: true
- pgno: 164
  md: '\( K = \sum_{i=1}^{NE} k_i \) (7.9)


    where NE is the number of finite elements in the structure. P and U are the load
    vector and displacement vector, respectively. The symmetric stiffness matrix is
    a function of the design variables defining the structure. The load vector P may
    also be a function of design variables if we include, for example, self-weight
    of the structures. Solving for displacement as


    \(\mathbf{U} = \mathbf{K}^{-1} \cdot \mathbf{P}\) (7.10)


    The element stiffness matrix ki is created from the stiffness


    \( k_i = T^T k_i^o T \) (7.11)


    Matrix \( k_i^o \) in the element''s local coordinate system and a geometric transformation
    matrix T.


    The displacements associated with each element can be transformed to the local
    co-ordinate system by


    \( u^0 = Tu \) (7.12)


    The element forces are


    \( f = k_i^0 u^0 \) (7.13)


    Finally, the stress constraints are computed from these forces. Differentiating
    Eq. (7.8) implicitly with respect to design variable Xi, i = 1, 2, ..., n.


    \(\frac{\partial K}{\partial X_i} U + K \frac{\partial U}{\partial X_i} = \frac{\partial
    P}{\partial X_i}\) (7.14)


    or


    \(\frac{\partial U}{\partial X_i} = K^{-1} \cdot \left[ \frac{\partial P}{\partial
    X_i} - \frac{\partial K}{\partial X_i} U \right]\) (7.15)


    Assuming the loads to be independent of Xi, the first term in the brackets becomes
    zero. Also, from Eq. (7.9),


    \(\frac{\partial K}{\partial X_i} = \sum_{j=1}^{NE} \frac{\partial k_j}{\partial
    X_i}\) (7.16)'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Once the gradients of displacements with respect to design variable Xi are
    obtained, these are used at the element level to calculate the gradient of forces
    and finally stresses with respect to Xi. As an example, for the first element
    of a truss, the following two constraints are imposed


    ```

    g_1 = \frac{\sigma_1}{\sigma^+} - 1 \hspace{1cm} (7.17)

    g_2 = \frac{\sigma_1}{\sigma^-} - 1 \hspace{1cm} (7.18)

    ```


    where \(\sigma^+\) and \(\sigma^-\) are the limiting tension and compression stresses.
    The gradient of the constraint with respect to the design variable Xi is computed
    as follows:


    ```

    \frac{\partial u_1^0}{\partial X_1} = T \frac{\partial u_1}{\partial X_1} \hspace{1cm}
    (7.19)

    ```


    Now, the gradient of constraints of the first element with respect to design variable
    X1^l is obtained:


    ```

    f_1 = \frac{A_1 E}{L_1} u_1^0 \hspace{1cm} (7.20)

    \frac{\partial f_1}{\partial X_1} = \frac{f_1}{A_1} + \frac{A_1 E}{L_1} \times
    \frac{\partial u_1^0}{\partial X_1} \hspace{1cm} (7.21)

    \frac{\partial \sigma_1}{\partial X_1} = \frac{\partial}{\partial X_1} \frac{f_1}{A_1}
    = \frac{1}{A_1} \frac{\partial f_1}{\partial X_1} - \frac{f_1}{A_1^2} \hspace{1cm}
    (7.22)

    ```


    This procedure is automated in the developed program in order to compute all constraints
    and their relevant gradients.


    # 7.4 The Structure of Neuro-Optimizer


    The basic idea of neuro-optimizer is to extend the range of applicability of ANN
    to structural optimization by employing CPN. The strategy consists of three phases.
    In the first phase, the structural design variables are generated randomly in
    the user-specified domain of search. The constraints and the relevant gradients
    are computed analytically for each set of generated design variables. In the neurocomputing
    phase, two CPNs are trained on such data (i.e., the constraints and the relevant
    gradients). Weight matrices are computed automatically in the training process.
    In the final phase, neurocomputing models are used as a fast interpolator to predict
    the constraints and the relevant gradients in the optimization process in order
    to minimize the computation time. The complete structure chart for neuro-optimizer
    is illustrated in Fig. 7.2.'
