- pgno: 350
  md: '# 18.2 SectionTitle: Level 1


    Recently, Group Method of Data Handling (GMDH) has been used in a great variety
    of areas such as data mining and knowledge discovery, forecasting and systems
    modeling, optimization and pattern recognition [2, 3]. It is originally designed
    and proposed by Ivakhnenko. The main advantage of GMDH method in comparison with
    ANN method as one of the most common data mining approaches is that the dependencies
    between input parameters and responses are represented in parametric form as an
    equation while these dependencies are hidden within neural network structures
    in ANN method. Besides that, ANN methods need an essential time of learning and
    therefore it is difficult to be applied for modeling and forecasting in real time
    system. The description of the GMDH network is outlined at the following.


    # 18.2.1 Principle of the GMDH Network


    GMDH is a machine learning approach based on the polynomial theory of complex
    systems. From this network, the most significant input parameters, number of layers,
    number of neurons used in middle layers, and optimal topology design of the network
    are defined automatically. Therefore, the GMDH network is included those of active
    neurons known as a self-organized model. The structure of GMDH network is configured
    thorough the training stage with polynomial model which produces the minimum error
    between the predicted value and observed output. The formal definition of the
    system identification problem is to find an approximate function \(\hat{f}\) that
    can be used to predict the actual output y or a given input vector X = (x<sub>1</sub>,
    x<sub>2</sub>, x<sub>3</sub>, x<sub>n</sub>) as close as possible to the actual
    output y. Therefore, n observations of multi-input–single-output data pairs are
    considered as:


    ```

    y_i = f(x_{i1}, x_{i2}, x_{i3}, ... x_{in}) \quad (i = 1, 2, ..., M) \quad (18.1)

    ```


    The general relationship between input and output variables can be expressed by
    a complicated discrete form of the Volterra function, a series in the form of:


    ```

    y = w_0 + \sum_{i=1}^n w_ix_i + \sum_{i=1}^n \sum_{j=1}^n w_{ji}x_ix_j + \sum_{i=1}^n
    \sum_{j=1}^n \sum_{k=1}^n w_{ijk}x_ix_jx_k + \cdots \quad (18.2)

    ```


    which is known as the Kolmogorov-Gabor polynomial. In the present study, a quadratic
    polynomial of the GMDH network is used that is written as:


    ```

    Quadratic: \hat{y} = w_0 + w_1x_i + w_2x_j + w_3x_ix_j + w_4x_i^2 + w_5x_j^2 \quad
    (18.3)

    ```


    The weighting coefficients of Eq. (18.3) are calculated using regression techniques
    such that the difference between actual output (y) and the calculated value (\(\hat{y}\))
    for'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'each pair of $x_i$ and $x_j$ as input variables is minimized. In this way,
    the weighting coefficients of the quadratic function $\hat{y}$ are obtained to
    optimally fit the output to the whole set of input–output data pairs, which is
    defined as:


    ```

    E = \frac{\sum_{i=1}^{M} \left[ y_i - \hat{y}_i \right]^2}{M} \rightarrow \text{min}

    ```


    In this study, the GMDH network is improved using a back propagation algorithm.
    This method includes two main steps: (1) the weighting coefficients of the quadratic
    polynomial are determined using the least squares method from the input layer
    to output layer in the form of a forward path; and (2) the weighting coefficients
    were updated using a back-propagation algorithm in a backward path. This procedure
    may be continued until the error of the training network ($E$) is minimized.


    # 18.3 Data Set and Modelling


    To develop the GMDH model, shear strength capacity of FRP-RC members with and
    without stirrups was considered to be a function of the following parameters:


    ```

    V = f\left(f_c, \frac{a}{d}, b, d, A_F, f_{fu}, E_F, \rho_F, A_{Fw}, \rho_{Fw},
    E_{Fw}, f_{f_{low}}\right)

    ```


    where $V$ is the ultimate shear capacity, including self-weight (kN); $f_c$ is
    the average concrete cylinder compression strength (Mpa); $al/d$ is the ratio
    of shear span to the effective depth; $b$ is the cross section width (mm); $d$
    is the effective depth of the cross section (mm); $A_F$ and $A_{Fw}$ are the area
    of longitudinal and transversal reinforcement, respectively (mm$^2$); $f_{Fu}$
