- pgno: 330
  md: 'the appropriate learning and performance of a network according to low RSM
    value. On the other hand, the correlation factor that is defined as the harmonic
    RSM variation of two variables [15], can be determined from the following equation:


    \( r(x.y) = \frac{\sum(x_i - \bar{x})(y_i - \bar{y})}{\left[\sum(x_i - x)^2 \sum(y_i
    - \bar{y})^2\right]^{1/2}} \) (16.2)


    in which: x: is the average of x variables y: is the average of y variables.


    The correlation factor could be positive or negative if the two variables change
    in agreement with each other in the same direction or opposite direction respectively.
    Finally the variables are called uncorrelated, if they do not change in agreement
    with each other. Value of r is between −1 and 1. If r = 1, correlation is perfect
    and if r = −1, correlation is perfect and negative. In case of r = 0, the variables
    are uncorrelated. Also in ANN, the correlation factor between actual and desired
    outputs from training and testing sets together can be used as a criterion for
    evaluating the performance and learning of the network. The closer the value of
    this factor gets to 1 for both data, existing in training and testing set, the
    better is the learning and performance of the network. It is notable that correlation
    factor between the actual and desired outputs from training set can never be used
    for evaluation of the performance of a network. Because, it is possible for the
    network to recite the existing data in the training set. Therefore, the correlation
    factor between the actual and the desired output could be close to 1, while the
    network may not be able to provide acceptable answers to new nonexistent inputs.
    For data classification and training of the ANNs in predicting the vulnerability
    of the structures, the data were divided into 3 groups for training and testing
    of the ANNs as below:


    +   • Group A: Network for assessment of damage in 3, 4, and 5 stories structural
    models.

    +   • Group B: Network for assessment of damage in 6 to 10 stories structural
    models.

    +   • Group C: Network for assessment of damage in 3 to 10 stories structural
    models.


    In order to train the AANs, the “Neural Works” program has been employed [16].
    In all the networks, training set includes the following seven parameters: the
    ratio of the number of stories to number of bays for each structural model, the
    period of the first vibration mode of the structural models, peak ground acceleration
    (PGA), earthquake dominant frequency, scaled earthquake acceleration, maximum
    displacement of the top floor of the structural models, and the computed damage
    index. The testing set includes all the above parameters except the damage index.
    In each group (i.e. A, B and C), the test set data were selected randomly from
    the database generated by performing the dynamic time history analyses for the
    structural models of that group. In order to train the networks, back propagation
    algorithm was used. Architecture of the networks consists of one input layer,
    one (or two) hidden layer(s), and one output layer. Both hyperbolic tangent and
    sigmoid functions were employed in training the networks and their performances
    were compared. The number of'
