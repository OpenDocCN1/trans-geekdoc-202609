    To take full advantage of the positive material properties of RC beams made of
    HSC, a more reliable model for predicting shear capacity of slender HSC beams
    without web reinforcement is needed. Recently, machine learning approaches have
    been widely applied in engineering problems. The main advantage of these approaches
    can be mentioned as: they consider all possible relations between input and output
    parameters and also checked different combinations of input parameters for estimating
    output parameter unlike the regression approaches. At the following section Multivariate
    Adaptive Regression Splines (MNLR), Group Method of Data Handling (GMDH) network
    and Multiple Nonlinear Regression Methods (MNLR) are introduced which are used
    in this study to predict the shear strength of HSC slender beams without web reinforcement.


    # 22.3 Soft Computing Approaches


    Recently, the soft computing approaches such as Artificial Neural Networks (ANN)
    and adaptive neuro-fuzzy inference system (ANFIS) have been employed as useful
    tools for modeling and forecasting complex structural engineering problems. Among
    these methods, the group method of data handling (GMDH) network and multivariate
    adaptive regression splines (MARS) have not yet been widely applied in structural
    engineering. The main advantage of GMDH and MARS methods in comparison with ANN
    method is that the dependencies between input parameters and responses are represented
    in parametric form as an equation while these dependencies are hidden within neural
    network structures in ANN method. Besides that ANN methods need an essential time
    of learning and therefore it is difficult to be applied for modeling and forecasting
    in real time systems. The description of the GMDH network, the MARS and multiple
    nonlinear regression methods (MNLR) are discussed in below.'
