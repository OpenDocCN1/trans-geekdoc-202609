  md: "# 20.6 Conclusions\n\nIn this study, a comprehensive database of 575 measurements\
    \ of bond strength between FRP reinforcements externally glued on masonry units\
    \ are compiled for first time from data sets published in literature. New equations\
    \ for predicting maximum bond strength based on M5' and MARS algorithms are proposed.\
    \ The final models are established using the reinforcement width ($b_p$), the\
    \ ratio between FRP reinforcement and masonry width ($b_p/b_m$), tensile strength\
    \ of support ($f_{mf}$), axial strength of reinforcement ($E_p t_p$) and the bond\
    \ length ($L_b$) as input variables. The M5' model as a rule based method is employed\
    \ to provide understandable formulas that allow users to have more insight in\
    \ the physics of the phenomenon. The MARS algorithm is also used as a reliable\
    \ predictive model to determine the most important parameters in predicting bond\
    \ strength.\n\nThe performances of some common empirical models and the proposed\
    \ ones are evaluated based on the size of the errors and uncertainty. The prediction\
    \ errors and uncertainties associated with the developed M5' and MARS models are\
    \ remarkably smaller than those associated with the most common existing models.\
    \ The proposed M5' and MARS models outperform Yang et al. [18] equation as the\
    \ best empirical model by improving the $R^2$ value by 129% and 183%, respectively,\
    \ and the $RMSE$ value by 35% and 58%, respectively. The results of sensitivity\
    \ analysis based on MARS models showed that the width ratio between FRP reinforcement\
    \ and masonry support ($b_p/b_m$) is the most important and the axial strength\
    \ of FRP reinforcement ($E_p t_p$) is the least important parameter in predicting\
    \ the bond strength. Furthermore, the safety analysis based on Collins criteria\
    \ indicated that the developed MARS and M5' models also remarkably outperform\
    \ the existing equations in term of safety.\n\n# References\n\n+   1. Kaveh A,\
