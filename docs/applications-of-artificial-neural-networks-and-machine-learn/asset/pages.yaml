  md: '# 5.6 Nonradial Basis Functions


    The multiquadric RBF is conceivably one of the most efficient basis functions
    among the available RBFs which was the motivation for embedding some of its characteristics
    within NRBFs. Nonradial basis functions, as can be realized by the name, are not
    functions of the Euclidean distance r. On the contrary, they perform as individual
    coordinates of generic points x relative to a given data point x^i, in each dimension
    independently. The coordinate vector is defined as ξ^i = x - x^i, which is a vector
    of m components, each corresponding to a single coordinate dimension. Hence, ξ^i_j
    is the coordinate of each point x relative to the data point x^i along the j-th
    dimension. Figure 5.9 represents the variation between the Euclidean distance
    r employed in RBFs and the relative coordinates ξ applied to NRBFs for a two-dimensional
    case. The NRBFs for the i-th data point and the j-th dimension is expressed as
    φ_ij composed of three different components:


    ```

    φ_ij(ξ^i_j) = α^L_ij φ^L(ξ^i_j) + α^R_ij φ^R(ξ^i_j) + β_ij φ^β(ξ^i_j)   (5.13)

    ```


    where α^L_ij, α^R_ij, and β_ij are coefficients to be determined based on given
    problems; and the superscripts L and R represent left and right, respectively.
    Figure 5.10 shows a generic basis function along with one of the dimensions for
    random values for α^L, α^R, and β. The functions of φ^L, φ^R, and φ^β are illustrated
    in Table 5.1. Four distinct regions (I–IV) are drawn in Fig. 5.10, each corresponding
    to a row in Table 5.1.


    The NRBF takes distinct forms in different regions. It is an n-th-order monomial
    αξ^n (n ≥ 2 is an even integer) supplemented by a linear component or tilt (βξ)
    in the central regions between ξ = -γ and ξ = +γ (regions II and III). Beyond
    these regions on either side (regions I and IV), the function is linear, such
    that the function and its first derivative are constant at ξ = ±γ. A small value
    of γ would cause a


