- pgno: 464
  md: 'E = \frac{\sum_{i=1}^{M} \left[y_i - G_i(0)\right]^2}{M} \rightarrow \min \quad
    \text{(22.16)}


    In this study, the GMDH network is improved using a back propagation algorithm.
    This method includes two main steps: (1) the weighting coefficients of the quadratic
    polynomial are determined using the least squares method from the input layer
    to output layer in the form of a forward path; and (2) the weighting coefficients
    were updated using a back-propagation algorithm in a backward path. This procedure
    may be continued until the error of the training network \( E \) is minimized.


    # ## 22.3.3 MNLR


    Let assume that \( y \) is a dependent variable and have a nonlinear relation
    with \( n \) independent variables as \( x_1, x_2, ..., x_n \). The nonlinear
    relation between them can be expressed as:


    \( y = a_0 x_1^{a_1} x_2^{a_2} ... x_n^{a_n} \quad \text{(22.17)} \)


    By applying logarithmic transformation, the following equation can be obtained
    as:


    \(\log y = \log a_0 + a_1 \log x_1 + a_2 \log x_2 + \cdots + a_n \log x_n \quad
    \text{(22.18)}\)


    where the coefficients \( a_0, a_1, ..., \text{and } a_n \) can be determined
    by applying least squares method in similar to multi linear regression (MLR) method.


    # ## 22.4 Model Development


    # ### 22.4.1 Model Inputs and Outputs


    Five variables were presented to the MARS, GMDH and MNLR as model inputs including
    the effective depth (\( d \)), the shear span-to-depth ratio (\( a/d \)), the
    compressive strength of concrete (\( f''_c \)), the aggregate size-to-depth ratio
    (\( a_g/d \)), and the longitudinal steel ratio (\( \rho \)). The single model
    output is concrete shear capacity, \( v_u \).'
