- pgno: 341
  md: '# 17.3.1 Mean Field Annealing Networks


    The roots of mean field annealing (MFA) networks are in the field of statistical
    physics which combines the features of Hopfield neural network and simulated annealing.
    MFA is a deterministic approach which essentially replaces the discrete degrees
    of freedom in a simulated annealing problem with their average values as computed
    by the mean field approximation.


    # 17.3.2 Mapping the Bisection Problem onto the Neural Network


    The problem of bisecting meshes may be mapped onto a feedback type neural network
    and may be defined by an objective function in the form of the Liapunov function
    given as:


    ```

    $$ E(S) = -\frac{1}{2} \sum_{i=1}^N \sum_{j=1}^N T_{ij} s_i s_j + \sum_{i=1}^N
    I_i s_i $$

    ```


    where \( T_{ij} \) is the connecting weights matrix, \( s_i \) is the state of
    the \( i \)th neuron, \( s_j \) is the state of the \( j \)th neuron, and \( I_i
    \) is the bias. It may be assumed that the \( T_{ij} \) matrix is symmetric and
    does not allow self-interaction.


    A binary unit of \( s_i = +1 \) or \( s_i = -1 \) is assigned to each node of
    the mesh defining which partition the node is to be assigned.


    The connectivity of the nodes is encoded in the \( T_{ij} \) matrix in the form
    of


    ```

    $$ T_{ij} = \begin{cases} 1 \text{ if a pair of nodes are connected by an edge}
    \\ 0 \text{ otherwise} \end{cases} $$

    ```


    With this terminology, the minimization of the first term of Eq. (17.2) will maximize
    the connectivity within a bisection while minimizing the connectivity between
    the bisections. This has the effect of maximizing the boundary. However, using
    this term alone as the cost function forces all the nodes to move into one bisection,
    thus a penalty term is applied which measures the violation of the equal sized
    bisection constraint [7–9]. Therefore the neural network objective function for
    the mesh bisection is of the form of


    ```

    $$ E(S) = -\frac{1}{2} \sum_{i=1}^N \sum_{j=1}^N T_{ij} s_i s_j + \frac{\alpha}{2}
    \left( \sum_j s_j \right)^2 $$

    ```


    where \( \alpha \) is the imbalance parameter which controls the bisection ratio.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'The mean field equation for bisection is given by:


    $$v_i = \tanh \left( \sum_{j=1}^N (t_{ij} - \alpha) \frac{v_i}{T} \right).$$ (17.4)


    where $T$ is the temperature. This equation is used to compute a new value of
    u\(_i\) asynchronously. Initial values for the elements in vector V are assigned
    using small continuous random values. The temperature is lowered using a cooling
    factor (0.90) after one complete iteration of Eq. (17.4).


    At the beginning of the optimization process, the spines (state of neurons) average
    stay at or near zero indicating that the bisection is maximally disordered. As
    the temperature is decreased, the system reaches a critical temperature where
    the spines begin to converge, causing each element of the mesh to move into one
    or another of the two bisections. At sufficiently low temperatures, the state
    of each neuron reaches a value close to +1 or -1, indicating the stable state
    of the system being reached. This state indicates the fulfillment of the bisection
    criteria.


    For different sets of initial parameters, different bisections may be obtained.
    However, if the sets are close to each other, then the number of interface nodes
    and the number of elements in each bisection will not differ much.


