- pgno: 140
  md: '# Chapter 6

    BP and RBF Neural Networks

    for Predicting Displacements and Design

    of Schwedler Domes


    **Abstract** In this chapter, efficient neural networks are trained for predicting
    the displacements and design of Schwedler domes using the Radial Basis Functions
    and Backpropagation neural networks. Programs are developed for accurate distribution
    of applied forces and wind load to the nodal points of these domes.


    # 6.1 Introduction


    In this chapter, BP and RBF neural networks for predicting displacements and design
    of Schwedler domes [1]. Space structures are often used for covering large spans.
    Sport stadiums, assembly halls, exhibition centers, swimming pools, shopping arcades
    and industrial buildings are typical examples of structures where large unobstructed
    areas are essential and where minimum interference from internal support is required.
    Space structures are often classified as grids, domes and barrel vaults.


    Configuration processing and data generation for space structures can be simplified
    using the concepts from formex algebra, Nooshin [2]. Though an optimal analysis
    can be carried out using usual matrix displacement method [3], however, for large-scale
    problems, the analysis is usually time consuming due to a large number of equations
    being involved. Therefore approximate methods are beneficial in the process of
    nonlinear analysis and optimal design.


    Neural networks provide a powerful tool for approximate analysis and design of
    space structures. Such networks are trained using backpropagation [4–7] and counterpropagation
    networks [8–10].


    In the present chapter, efficient neural networks are trained for predicting the
    displacements and design and of Schwedler domes using NeuralWorks software [11].
    Single layer domes with varying the spans between 42.5 and 65 m, with an increment
    of 2.5 m, are considered. Radial Basis Functions (RBF) and Backpropagation (BP)
    networks are employed for training and testing these nets. For accurate distribution
    of the applied forces and wind load on the nodal points, additional programs are
    developed. Analysis and design are carried out employing ANSYS software [12] for
    preparing the training and testing pairs.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/4048998719320644ee88964326fd7995_141_0.png)


    ![](img/4048998719320644ee88964326fd7995_141_1.png)


    (a) A single layer Schwedler dome


    (b) An arch containing two ribs


    Fig. 6.1 A single layer Schwedler dome and two ribs


    # 6.2 Structural Model


    The model selected for the study of this chapter is a single layer Schwedler dome
    with ribbed members are considered as beam elements joined together rigidly and
    diagonal members are taken as bar elements Fig. 6.1. The spans are varied between
    42.5 and 65 m with the steps of 2.5 m. The opening angle of the domes is chosen
    from the angles between 45 and 67.5° A typical Schwedler dome used in this study
    is shown in Fig. 6.1a. Simple supports are considered for the exterior ring of
    the dome. The number of intervals between the ribs is considered as 20 and for
    rings this number is taken as 8.


    In order to simplify the design, and due to symmetry, 8 types of cross sections
    are considered for the members of a typical rib. The span and deflection at the
    apex of the dome are illustrated in Fig. 6.1b.


    # 6.3 Analysis and Design


    The analysis and design of structures are performed by *ANSYS* [11], and programs
    are written to evaluate the nodal forces under the dead and live loads, and the
    wind load. The following data is used:


    +   - All the nodes are considered as rigid.

    +   - Elements are selected from the tube sections available in European profile
    list.

    +   - Linear analysis is performed.

    +   - Design is carried out according to AISC-89 code.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The dead load is taken as 0.5 kN/m² and the sum of dead load and live load
    is considered as 2.5 kN/m² applied at the nodes.


    In order to calculate the external wind pressure on a dome, the diagram suggested
    by the European Conventional Committee for Steel (ECCS) is used, see also Makowski
    [13]. In this method, the external pressure is imposed in the form of a non-linear
    diagram. Here a program is developed for calculating the equivalent nodal forces.
    These forces are calculated as


    F<sub>i</sub> = A<sub>i</sub>P<sub>ei</sub> (6.1)


    where A<sub>i</sub> is the area associated with node I and P<sub>ei</sub> is the
    average value of the external wind pressure on the area associated with node i.
    The wind pressure is calculated as


    P<sub>e</sub> = C<sub>e</sub>C<sub>g</sub>C<sub>pe</sub>q, (6.2)


    where C<sub>e</sub> is the coefficient of exposure, C<sub>g</sub> is the gust
    coefficient, C<sub>pe</sub> is the external pressure coefficient and q is the
    base pressure. In this research, C<sub>e</sub> = 1, C<sub>g</sub> = 2 and q =
    50 kg/m² are adopted for calculating the wind pressure.


    A total number of 100 structures are analyzed and designed from which 80 structures
    are used for training and 20 pairs are employed for testing the networks.


    # 6.4 BP and RBF Neural Networks


    In the last decade neural networks are extensively employed in structural mechanics,
    Refs. [4–10]. In the following, some basic concepts of neural networks is summarized,
    however, the interested reader may also refer to excellent textbooks on this subject
    [14, 15].


    # 6.4.1 Basic Concepts


    Artificial neural networks (ANNs) try to simulate the functions of the brain through
    mathematical and computational models. ANNs are structured from a set of artificial
    neurons or processing units, which are arranged on a set of layers. A processing
    element of an ANN is a simple device that approximates the function of a biological
    neuron. The topology of ANNs may be in the form of feed-forward or recurrent.
    Learning may be supervised or unsupervised depending on the topology. Feed-forward
    neural networks are usually trained using supervised training procedures.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'In a processing element, the input signals are translated to an output signal
    by an appropriate transfer function. Weights, representing the synapses, are given
    to input signals according to their importance. These weights w_st are the strength
    of connections between processing elements. After a processing element receives
    all of its input signals, through its input path, it computes the net sum of input
    according to:


    net_{pt} = \sum_{s} w_{st} o_{ps}, \tag{6.3}


    where w_st is the connecting weight from the source “s” layer to the target “t”
    layer and o_ps is the output produced from pattern p as the result of the input
    o_pt(s-1).


    The net sum is applied to an activation function. The most commonly used activation
    function is the sigmoid function defined as


    o_{pt} = \frac{1}{1 + e^{-\frac{(net_{pt} + bias)}{\sigma}}} \tag{6.4}


    where bias serves as a fictitious weight of a unit value which always fires (o_pt
    = 1). This function is bounded within the range (0, 1) and has a continuous first
    derivative. The output of a unit is obtained by passing the value of the net-sum
    through the activation function as


    o_{pt} = f_t(net_{pt}). \tag{6.5}


    # 6.4.2 Backpropagation Algorithm


    The backpropagation learning algorithm was discovered by Parker [16], and it was
    popularized and developed into a workable process by Rumelhart et al. [17]. Numerous
    applications have been found for backpropagation since 1986.


    Here the backpropagation (BP) neural network is briefly described. The BP consists
    of two types of elements: neurons (nodes) and weights (connections). Neurons are
    organized in layers: the first layer is called input layer, which receives stimulus
    from the outside environment; the last layer called output layer, which provides
    output or answers from the network. In between the input and output layers, there
    is at least one hidden layer, Fig. 6.2. The weights represent the strength of
    the connections, which decide the distribution of data flow across layers. Between
    any two neighboring layers, the neurons are fully connected; for two layers with
    m and n neurons, there are m x n connections. Therefore the weights between two
    adjacent layers can be represented as an m x n matrix.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Fig. 6.2 The topology of a BP network


    ![](img/4048998719320644ee88964326fd7995_144_0.png)


    The training of a network is equivalent to finding proper weight matrices such
    that a desired output is generated for a corresponding input.


    Mathematically, such networks can be thought of as multi-dimensional spaces. Each
    layer corresponds to a space with the dimension equal to the number of nerouns
    in that layer. Each transformation consists of two operations: matrix multiplication
    and vector squashing, i.e. for R^m -> R^n, {V}_m [W]_{mxn}, where {V}_m in R^m,
    {V}_n in R^n and [W]_{mxn} is the weight matrix. The squash is a function often
    known as the activation function converting a vector by squashing each vector
    component with a nonlinear function.


    Backpropagation algorithm is the most popular training scheme for this type of
    networks. According to this algorithm, learning proper weights is conducted by
    an iterative two-step process. The two steps are.


    Computing the discrepancy between the desired and actual outputs, and feeding
    back the error signal layer by layer to the inputs, changing the weights in such
    a way as to modify them in proportion to their responsibility for the output error.
    For details of this algorithm refer to Haykin [14].


    The learning rule associated with the backpropagation method is known as generalized
    delta rule [17]. According to this rule, for changing the weights in the network,
    for a given pattern p, the following relation may be used:


    ```

    \(\Delta W_{st}(n) = \eta \delta_{pr_{op}s} + \alpha W_{st}(n - 1), \quad (6.6)\)

    ```


    where n is the input-output presentation number and \(\eta\) is the learning rate
    and \(\alpha\) is the momentum.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The momentum, α, is a fraction which is multiplied by the previous weight change
    and added to the current weight change; α should be positive and less than unity.
    The two terms are not independent, and should be chosen and modified as a pair.
    In general, dynamic adjustment of both parameters can accelerate convergence,
    however, a large value for either η or α, may lead to instability in the training
    process [14].


    Once the changes to the weights are found, the new weights are computed as:


    w_st(n + 1) = w_st(n) + Δw_st(n). (6.7)


    The errors are usually high at the beginning of the learning process. This necessitates
    bigger changes in weights in the early stages of the learning process. Using the
    backpropagation procedure, the network calculates delta signals for the output
    layer and hidden layers. These deltas are employed to compute the changes for
    all the weight values according to Eq. (6.6) and the subsequent weight values
    using Eq. (6.7).


    # ## 6.4.3 Radial Basis Functions Networks


    The backpropagation algorithm can be viewed as an application of optimization
    method known in statistics as _stochastic approximation_. While in RBF a different
    approach is adopted, namely a neural network is designed for _curve fitting_ (approximation)
    problem in higher dimensional space. According to this viewpoint learning is equivalent
    to finding a surface in a multidimensional space that provides a best fit to the
    training data, and generalization corresponds to the use of multidimensional surface
    to interpolate in multidimensional space.


    The idea of Radial Basis Functions networks derives from the theory of function
    approximation. The main features of these networks are as follows:


    +   1. They are two-layer feed-forward networks.

    +   2. The hidden nodes implement a set of radial basis functions (e.g. Gaussian
    functions).

    +   3. The network training is divided into two stages: first the weights from
    the input to hidden layer are calculated, and then the weights from the hidden
    to output layer are determined.

    +   4. The training/learning is very fast.

    +   5. The networks are very good at interpolation.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The exact interpolation of a set of N data points in a multi-dimensional space
    requires every D dimensional input vector \(\mathbf{x}^p = \{ \mathbf{x}_i^p :
    i = 1, ..., D \}\) to be mapped onto the corresponding target output \(t^p\).
    The goal is to find a function f(x) such that


    \(f(\mathbf{x}^p) = t^p\) for every \(p = 1, ..., N\) (6.8)


    The radial basis function introduces a set of N basis functions, one for each
    data point, which takes the form \(\phi(\|\mathbf{x} - \mathbf{x}^p\|)\) where
    \(\phi(.)\) is some non-linear function. Thus the \(p\)th such function depends
    on the distance \(\|\mathbf{x} - \mathbf{x}^p\|\), usually taken to be Euclidean,
    between \(\mathbf{x}\) and \(\mathbf{x}^p\). The output of the mapping is then
    taken to be a linear combination of the basis function, i.e.


    \(f(\mathbf{x}) = \sum_{p=1}^{N} w_p \phi(\|\mathbf{x} - \mathbf{x}^p\|)\) (6.9)


    The idea is to find the weights \(w_p\) such that the function goes through the
    data points. The equation that defines the weights comes from combining the above
    equations:


    \(f(\mathbf{x}^q) = \sum_{p=1}^{N} w_p \phi(\|\mathbf{x}^q - \mathbf{x}^p\|) =
    t^q\) (6.10)


    This can be written in a matrix form as \(\mathbf{w} = \phi^{-1}\mathbf{t}\),
    where \(\mathbf{w} = \{ w_p \}\), \(\mathbf{t} = \{ t^p \}\) and \(\Phi = \{ \Phi_{pq}
    = \varphi(\|\mathbf{x}^q - \mathbf{x}^p\|) \}\). Then provided the inverse of
    \(\Phi\) exists, one can use any standard matrix inversion technique to give


    \(\mathbf{w} = \Phi^{-1}\mathbf{t}\) (6.11)


    Consider a set of N data points in a multi-dimensional space with D dimensional
    inputs \(\mathbf{x}^p = \{ \mathbf{x}_i^p : i = 1, ..., D \}\) and corresponding
    K dimensional target outputs \(\mathbf{t}^p = \{ t_k^p : k = 1, ..., K \}\). The
    output data can generally be generated by some underlying functions \(g_j(\mathbf{x})\)
    plus random noise. The goal is to approximate the \(g_j(\mathbf{x})\) with functions
    \(y_k(\mathbf{x})\) of the form


    \(y_k(\mathbf{x}) = \sum_{j=0}^{M} w_{kj} \phi_j(\mathbf{x})\) (6.12)'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/4048998719320644ee88964326fd7995_147_0.png)


    Fig. 6.3 The RBF network architecture


    There are good computational reasons to use Gaussian basis functions


    ```

    \phi_j(\mathbf{x}) = \exp \left( - \frac{\|\mathbf{x} - \mu_j\|^2}{2\sigma_j^2}
    \right) \quad (6.13)

    ```


    in which we have basis centers { $\mu_j$ } and widths { $\sigma_j$ } that are
    generally obtained by unsupervised methods. The output weights { $w_{kj}$ } can
    then be found analytically by solving a set of linear equations. This makes the
    training very quick. RBF mapping can be illustrated as a neural network as shown
    in Fig. 6.3.


    The hidden layer to output connections are as in a standard feed-forward network,
    with the sum of the weighted hidden unit activations giving the output unit activations.
    The hidden unit activations are given by the basis functions $\phi_j(\mathbf{x},
    \mu_j, \sigma_j)$, which depend on the weights { $\mu_j, \sigma_j$ } and input
    activations { $x_i$ } in a non-standard manner.


    There are several similarities and differences between RBF and BP, as described
    in Refs. [9, 14].


    Although, for approximating non-linear input-output mappings, the RBF networks
    can be trained much faster, BP may require a smaller number of parameters.


    # ## 6.5 Training and Testing of the Networks


    # ### 6.5.1 Software for Training


    In this chapter NeuralWorks is employed, Ref. [11]. In the process of training,
    both sigmoid and tangent hyperbolic functions are employed. NeuralWorks is capable
    of representing useful information in the process of training. In Neuralworks
    an additional hidden layer is considered between the first hidden layer (prototype)
    and the output layer to allow richer mappings possible. In this software the following
    facilities are available.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'The learning rule used for all the trained networks here is chosen as Delta-Bar
    Delta. The transfer functions are selected from Tanhg and Sigmoid functions.


    # 6.5.2 Neural Networks for Prediction of Deflections


    # 6.5.2.1 Input Data


    The input for training this network consists of the span and rise of the Schwedler
    domes and the output contains the vertical displacement in the apex and the first
    ring of the structure.


    # 6.5.2.2 RBF Network


    In this net the number of nodes in the input layer is two and output consists
    of two nodes. The results of training for 36 different topologies are illustrated
    in Table 6.1. The network drs204s with 20 nodes in the prototype layer and 40
    nodes in the second hidden layer performed the best among the considered topologies.
    Using sigmoid as the transfer function, the correlation factors approached to
    0.9993, and 0.9992 for training, and to 0.99870 and 0.99897 for testing. For all
    these nets 100,000 cycles of trainings are performed, however, desirable correlation
    factors were obtained after 20,000 training cycles.


    The results for testing drs204s are provided in Table 6.2, and the corresponding
    curve is illustrated in Fig. 6.4.


    # 6.5.2.3 BP Network


    Using backpropagation algorithm different nets are designed as shown in Table
    6.3. For all these nets 10,000 cycles of trainings are performed and in the second
    stage 30,000 cycles are employed.


    The results for testing dfs64s are provided in Table 6.4, and the corresponding
    curve is illustrated in Fig. 6.5, and the RMS is shown in Fig. 6.6.


    # 6.5.3 Neural Networks for Design


    # 6.5.3.1 Input Data


    The input for training this network consists of the span and rise of the Schwedler
    domes together with the element numbers and the output contains the corresponding
    cross section area.'
