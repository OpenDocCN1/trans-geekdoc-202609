    Furthermore, Collins [41] presented a new scale to evaluate and classify the reliability
    of design codes. This scale is known as Demerit Points Classification (DPC), which
    consider the safety, accuracy and scattering of design codes as a function of
    the ratio between the ultimate resistances in experimental tests and the estimated
    theoretically shear capacity. In the present study, this ratio has been shown
    with DR parameter. Table 22.6 presents an adaption made in the present study to
    the original values proposed by Collins.


    Figure 22.6 presents the box plots and DR values of different approaches. Furthermore,
    five classified areas based on Collins criteria including extremely dangerous,
    dangerous, appropriate and safe, conservative, and extremely conservative are
    specified in Fig. 22.6. As shown, ACI 318-11 [27], CSA A23.3-04 [28] and fib model
    [29] equations are remarkably conservative and have the highest uncertainty (longer
    box) as if their predictions varied from extremely conservative to dangerous areas
    and even extremely dangerous area for ACI 318-11 [27]. The other design codes
    are also conservative and their uncertainties are remarkable but their amounts
    are less and more reasonable than the three mentioned design codes. However, Fig.
    22.6 shows that box plots of the proposed MARS and GMDH models are narrower than
    those of others, which is an indicator of a higher level of confidence. In addition,
    the proposed methods show good predictive capability in terms of accuracy with
    median values close to 1 unlike the design codes. It should be noted that the
    MARS model outperforms the GMDH model in this aspect.


    In order to quantitatively evaluate the safety of proposed models and existing
    design codes, first a demerit point is attributed to each prediction of these
    equations for total 250 data points based on Table 22.6. Then, the total values
    of demerit of each formula are calculated by the sum of the products of the number
    of specimens in each interval and their corresponding demerit penalty. The lower
    the value of total sum indicates that the considered formula is safer. Table 22.7
    presents the evaluation of GMDH, MARS and also design equations as a function
    of the adapted criteria from Collins [6]. According to this table, the equations
    of Eurocode-2 [30], ACI 318-11 [27] and CSA A23.3-04 [28] with 427, 413, and 315
    total demerit points respectively, as expected, have the weakest performance among
    design codes. The CEP-FIP [31] model presents the lowest total demerit points
    amongst the other design equations. However, 60% of its prediction values are
    either in the fourth classification range (between 1.15 and 2) or fifth classification
    (greater than 2), which is classified as conservative and extremely conservative
    in terms of safety and leads to uneconomic'
