- pgno: 297
  md: '# 15.3 Optimal Design of Towers


    In this chapter the genetic algorithm is used for optimal design. For optimization
    of small towers one can use the force method together with energy approach as
    described in [8]. Using energy, force method and genetic algorithms result in
    eliminating the need for the formation of the inverse of matrices. For large scale
    towers such a mixed method can be slow and occasional leads to local optima. In
    order to speed up the process of analysis, here a neural network is utilized.
    Also the genetic algorithm employed, is migration genetic algorithm used which
    is more suitable than simple GA for large scale problems. For towers with small
    number of elements the first method is used and for the towers with high number
    of members the second approach is employed. In the following the formulation for
    both methods are presented.


    First a short introduction is provided for the energy methods. The nonlinear behaviour
    of the material is modeled as ε = f(σ) or σ = g(ε) representing the stress strain
    relationship. The strain energy, complementary strain energy and total potential
    energy can be represented as:


    ```

    U = ∬ g(ε)dεdV, Uᶜ = ∬ f(σ)dσdV (15.7)

    V = U - P′u (15.8)

    ```


    where U is the strain energy, Uᶜ is the complementary strain energy, V is the
    total potential energy, P is the applied load vector and u is the nodal displacements
    vector. Considering the first Castigliano''s theorem for an elastic (linear or
    non-linear) system the potential energy is minimum for each system in equilibrium.
    Similarly in the second theorem, if the internal forces satisfy the compatibility,
    then the complementary energy becomes minimum. In general, U corresponds to the
    stiffness method and Uᶜ corresponds to the flexibility approach. Ion the first
    method we look for the displacements while in the latter we seek the unknown forces.
    In a statically indeterminate structure once the unknown forces are calculated
    the remaining member forces can easily be obtained. The use of Uᶜ corresponds
    to smaller number of unknowns and in what follows the force method will be employed.


    Suppose {p} = {p₁, p₂, ..., pₙ}ᵗ is the vector of nodal forces, {q} = {q₁, q₂,
    ..., qₘ}ᵗ contains m redundant forces, and {r} = {r₁, r₂, ..., rⱼ}ᵗ comprises
    of the internal forces of the members. From equilibrium:


    ```

    {r} = [B₀]{p} + [B₁]{q} = [B₀ B₁] [p/q] (15.9)

    Uᶜ = 1/2 {r}′[Fₘ]{r} (15.10)

    ```


    where [Fₘ] is the unassembled flexibility matrix of the structure, [B₀]{p} is
    the particular solution, and [B₁]{q} is the complementary solution. Now {q} should
    be'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'calculated such that the complementary energy, \( U^c \), becomes minimum.
    Substituting {r} from Eq. (15.9) into Eq. (15.10) leads to:


    [\mathbf{H}] = [\mathbf{B}_0 \ \mathbf{B}_1]'' [\mathbf{F}_m] [\mathbf{B}_0 \
    \mathbf{B}_1], \quad U^c = \frac{1}{2} [\mathbf{p} \ \mathbf{q}]'' [\mathbf{H}]
    \begin{bmatrix} \mathbf{p} \\ \mathbf{q} \end{bmatrix} (15.11)


    Decomposing the matrix [H] into four submatrices [Hqq], [Hqp], [Hpq], and [Hpp],
    the complementary energy is obtained as:


    \( U^c = \frac{1}{2} (\{p\}'' [\mathbf{H}_{pp}] \{p\} + \{p\}'' [\mathbf{H}_{pq}]
    \{q\} + \{q\}'' [\mathbf{H}_{qp}] \{p\} + \{q\}'' [\mathbf{H}_{qq}] \{q\}) (15.12)
    \)


    In the classical method, the derivative of \( U^c \) with respect to {q} is found
    and equated to zero, leading to:


    \( \{q\} = -[\mathbf{H}_{qq}]^{-1} [\mathbf{H}_{pq}] \{p\} (15.13) \)


    Since [H] is symmetric, therefore [Hqp]'' = [Hpq]. In the present approach, finding
    the inverse of [Hqq] is not required. Instead, \( U^c \) from Eq. (15.11) is minimized
    by genetic algorithm. The first term of \( U^c \) in Eq. (15.12) is constant and
    the second and third terms are equal, therefore


    \( U^c = \frac{1}{2} (\{p\}'' [\mathbf{H}_{pp}] \{p\} + \{q\}'' [\mathbf{H}_{qp}]
    \{p\} + \{q\}'' [\mathbf{H}_{qp}] \{p\} + \{q\}'' [\mathbf{H}_{qq}] \{q\}) (15.14)
    \)


    Substituting {q} from Eq. (15.9), the last two terms are eliminated and we have


    \( U^c = \frac{1}{2} (\{p\}'' [\mathbf{H}_{pp}] \{p\} + \{q\}'' [\mathbf{H}_{qq}]
    \{p\}) (15.15) \)


    Here we want to present a suitable formulation for finding minimum structural
    weight. For a structure in equilibrium and compatible condition, for a structure
    with linear behavior, the complementary energy \( U^c \) and strain energy \(
    U \) should be zero. Therefore the objective function is selected as


    \( F = W(1 + \alpha(U + U^c)^2) (15.16) \)


    Here \( \alpha \) is selected as a big number. It can be observed that the penalty
    function is selected such that its minimum value becomes zero. For calculating
    \( U \) if \( B_0 \) and \( B_1 \) corresponding to all degrees of freedom are
    constructed, then we have


