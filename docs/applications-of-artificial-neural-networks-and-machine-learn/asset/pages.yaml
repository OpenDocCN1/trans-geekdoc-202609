  md: '# 11.3 Artificial Neural Networks


    A model of an artificial neuron is shown in Fig. 11.1, where a set of input signals
    (X1, X2, ..., Xn) are applied to the neuron [17]. Each signal is multiplied at
    a proportional weight before arriving at summation unit (Σ). All weighted inputs
    are summed and make the output NET, then activation function is applied to NET
    and produces the signal OUT. In this research, two important activation functions,
    namely Sigmoid and Hyperbolic Tangent are employed which have most application
    in ANN problems Fig. 11.2.


    Sigmoid function maps the value of NET on distance of (0, 1) and Hyperbolic Tangent
    maps NET value on (−1, 1) distance. In this research, Back Propagation Network
    (BPN) is used, since it is the most applicable type of ANN. In this network, the
    output values are propagated backward, which can be compared to the previous values,
    and the error can be minimized.


    ![](img/4048998719320644ee88964326fd7995_232_0.png)


