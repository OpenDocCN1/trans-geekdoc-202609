    for all type of FRP materials and mentioned masonry units. For more visualization,
    matrix-plot of input and output parameters is represented in Fig. 20.3. This plot
    presents all possible scatter plots of input and output parameters one by one.
    The plots in the diagonal of this matrix are the histograms of input and output
    parameters for whole data points. It should be noted that the results of developed
    models are more reliable in ranges of input variables in which data points are
