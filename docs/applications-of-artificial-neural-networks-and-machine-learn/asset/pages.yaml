    # ## 5.3.1 Feedforward Backpropagation


    # ### 5.3.1.1 Backpropagation Neural Nets


    The backpropagation learning algorithm was first introduced by Parker [8], and
    it became generalized and developed into a workable process by Rumelhart et al.
    [9]. Various applications have been ascertained for backpropagation since 1986.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Single-layer networks may not have the decision-making complexity required
    to solve a broad range of structural engineering problems. Due to this deficiency,
    multi-layer networks have been promoted from single-layer networks that are capable
    of learning any constant mapping to arbitrary accuracy. The training procedure
    of this net comprises three stages including the feedforward of the input training
    pattern, the calculation and backpropagation of the correlated error, and the
    adjustment of the weights. The delta error backpropagation algorithm is habitually
    employed for its supervised learning. It is essentially a steepest descent algorithm
    to adjust the weight connection strength. After training, the application of the
    net involves only the computations of the feedforward phase. Even if the training
    is time-consuming, a trained net can produce its output so rapidly. The method
    of training employed in this chapter is backpropagation. This approach is one
    of the most successfully and widely utilized algorithms in artificial neural networks.
    In backpropagation, learning is accomplished when a set of training pairs is propagated
    through a network consisting of an input layer, one or more hidden layers, and
    an output layer. Each layer has its corresponding units and weight connections.


    The procedure of the output layer is computing outputs, then subtracted from their
    exact amounts (target outputs) to obtain a sum of square error that illustrates
    the level at which the network has learned the input–output data and gradient
    of the learning process.


    The output of a unit is obtained by passing the value of the net-sum through the
    activation function as:


    \( O_{pt} = f_t(net_{pt}) \) (5.2)


    The sum of the squares of the error for a single pattern at the output units is
    calculated by:


    \( E_p = \frac{1}{N_{output}} \sum_{outputs}^{network} (t_p - o_p)^2 \) (5.3)


    where \( E_p \) is the measure of the error of pattern \( p \), \( t_p \) is the
    target output, \( o_p \) is the obtained output at the output nodes, and \( N_{output}
    \) is the number of the output units. After processing all patterns, the total
    sum of the error is given by:


    \( E = \frac{1}{PN_{output}} \sum_{p}^{network} \sum_{outputs} (t_p - o_p)^2 \)
    (5.4)


    where \( P \) is the number of all patterns in the training set. The delta signal
    for the output layer is defined as:


    \( \delta_{pt} = (t_p - o_{pt})\dot{f}_t(net_{pt}) \) (5.5)'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'and for the hidden layers:


    $$\delta_{pt} = f_t''(\text{net}_{pt}) \sum_k \delta_{pt} w_{kt}$$ (5.6)


    The derivative of the activation function that is utilized in Eq. (5.5) is given
    as:


    $$f_t'' = \frac{\partial o_{pt}}{\partial net_{pt}} = o_{pt}(1 - o_{pt})$$ (5.7)


    where $k$ indicates an upper layer unit (the output layer is the uppermost, and
    the input layer is the lowermost layer).


    The learning rule associated with the backpropagation method is known as the generalized
    delta rule. According to this rule, to modify the weights in the network, for
    a given pattern $p$, the following relation can be employed:


    $$\Delta w_{st}(n) = \eta \delta_{pr} o_{pt} + \alpha w_{st}(n - 1)$$ (5.8)


    where $n$ is the input–output presentation number and $h$ is the learning rate
    and $a$ is the momentum. The momentum, $a$, is a fraction that is multiplied by
    the previous weight change and added to the current weight change; $a$ should
    be positive and less than 1. These two terms are not independent and should be
    selected and adjusted as a pair. Although the dynamic adjustment of both parameters
    can generally accelerate convergence, a tremendous value for either $h$ or $a$
    may lead to instability in the training process. Once the change to the weights
    is observed, the new weights are measured as:


    $$w_{st}(n + 1) = w_{st}(n) + \Delta w_{st}(n)$$ (5.9)


    The errors are usually huge at the commencement of the learning process, which
    requires more changes in weights in the preceding stages of the learning process.
    By applying the backpropagation procedure, the network determines delta signals
    for the output layer and hidden layers, utilizing Eqs. (5.5) and (5.6), respectively.
    These deltas are employed to measure the changes for all amounts of weight according
    to Eq. (5.8) and the subsequent weight values using Eq. (5.9).


    # 5.3.2 Feedforward Neural Networks


    In artificial neural networks, feedforward neural networks (FFNN) incorporate
    a set of processing elements called neurons [10]. Feedforward neural networks,
    trained with a backpropagation learning algorithm, Fig. 5.7, are the most popular
    neural networks employed for a wide variety of applications. There are no cycles
    or loops in feedforward networks. In such networks, the information moves only
    in the forward'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'direction, from the input layer, through the hidden layers, and to the output
    layer. Through the procedure, each neuron computes the sum of the weights of the
    inputs at the presence of a bias and passes this sum through an activation function,
    such as the sigmoid function, so that the output is obtained. This process can
    be represented as follows:


    ```

    h_j = \sum_{i=1}^m iw_{j,i}x_i + hb_j (5.10)

    ```


    where iw_{j,i} is the weight connecting neurons i = (1, 2, ..., m) and j = (1,
    2, ..., [r, k]), hb_j is a bias in the hidden layer, m is the total number of
    neurons in the input layer, x_i is the corresponding input data, r, k is the total
    number of neurons in the hidden layers, and n is the total number of neurons in
    the output layer.


    The training process is attained to modify the weights and bias until some error
    criterion is observed. Above all, one predicament is to select a proper training
    algorithm. Moreover, it is very complex to design the neural network because of
    numerous elements, such as the number of neurons in the hidden layer, the interconnection
    between neurons and layer, error function, and activation function that influence
    the performance of training. The training procedure begins with arbitrary values
