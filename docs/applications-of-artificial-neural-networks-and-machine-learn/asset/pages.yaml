  md: '# Chapter 8 Comparative Study of Backpropagation and Improved Counter-Propagation
    Neural Nets in Structural Analysis and Optimization


    Abstract In this chapter, two artificial neural networks, namely backpropagation
    neural net and the improved counter propagation neural net are applied to the
    analysis and optimal design of space structures. Different aspects of these nets
    and parameters affecting the performance of each net are investigated. Two examples
    are presented. A comparison has been made on the performance of these nets. The
    response of each net for the same input has been compared to illustrate their
    efficiency.


    # 8.1 Introduction


    The present chapter is based on the applications of two artificial neural networks,
    namely the backpropagation neural net (BPN) and the improved counter propagation
    neural net (CPN) to the analysis and design of large-scale space structures [1].
    Classification and so on [1, 2]. In spite of the significant advances in computational
    technology made in recent years, the solution to many large-scale problems requires
    an excessive amount of computer time. Therefore it is desirable to develop computational
    techniques which give partial reliable information to solve a specific problem
    and reduce computational cost. Many researchers have been interested in the development
    and application of ANN as a rapid analyzer in structural optimization [3–9].


    An artificial neural network (ANN) is basically a massive parallel computational
    model which consist of a large number of processing elements, and imitates the
    function of the brain. The processing elements are called artificial neurons.
    The ANN does not really solve the problem in a strictly mathematical sense, but
    it demonstrates information processing characteristics that give an approximate
    solution to a given problem. A trained network demonstrates some distinct advantages
    over the mathematical procedure of computing. It provides a rapid mapping of a
    given input into the desired output quantities. There has been considerable recent
    interest in the development and application of neural networks in problems of
    structural analysis, Refs. [2–10]. The application of ANNs is even more significant
    in non-linear structural analysis and as a rapid reanalyze in optimal desin. In
    this chapter, two artificial'
