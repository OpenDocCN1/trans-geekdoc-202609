  md: '# ## 3.6 Conclusion


    Five basic designs were selected in this study which had good compressive strength
    compared to the amount of water and cement used. In this study, six design variables,
    the amount of aggregate with different sizes, have been taken into account. Based
    on the results obtained from the Taguchi method and five basic designs, an artificial
    neural network was trained based on the results obtained from the Taguchi method
    and the five basic designs. Upon comparing the laboratory results with the results
    obtained from the ANN, it was found that the used ANN produced appropriate and
    acceptable results. The trained artificial neural network and the EVPS and SA-EVPS
    metaheuristic algorithms were then used to define an optimization problem in order
    to determine a design with the highest compressive strength, and the results of
    the optimization were also analyzed in the laboratory, which demonstrated that
    the results met the target in a satisfactory manner. For further research, it
    is recommended that the process used in this article be used.


