- pgno: 266
  md: '# Chapter 13

    A Metaheuristic-Based Artificial Neural Network for Plastic Limit Analysis

    of Frames


    **Abstract** In this chapter, a metaheuristic-based artificial neural network
    (ANN), which is categorized as a supervised machine learning technique, has been
    employed to determine the collapse load factors of two-dimensional frames in an
    absolutely fast manner. The numerical examples indicate that the proposed method''s
    performance and accuracy are satisfactory.


    # 13.1 Introduction


    This chapter is based on the paper by Kaveh et al. [1]. One of the powerful structural
    analysis methods, especially for ductile materials, is Plastic Analysis (PA).
    The basis of almost all the analytical methods employed for PA is the maximum
    and minimum principles [2]. Among minimum principal methods, the most frequent
    one is the combination of elementary mechanisms. This method has been developed
    by Neal and Symonds, first [3].


    Despite the advantages of the combination of elementary mechanisms, this method
    suffers from some drawbacks. These drawbacks prevent it to be considered a frequent
    analysis tool. Among these drawbacks, the extensive number of mechanisms that
    have to be combined for evaluating the collapse load factor, impose an intense
    computational cost, either in time or memory, to the problem solver. Therefore,
    some novel approaches, such as graph theory, and modern algorithms, such as metaheuristics,
    have been used in this manner.


    For the first time, Kaveh [4] has employed graph theoretical concepts for flexibility
    analysis of structures. In this manner, he has improved cycle bases in flexibility
    analysis for an efficient and accurate analysis of structures. Using this novel
    methodology, Mokhtarzadeh and Kaveh [5] presented an efficient graph theoretical
    method for optimal plastic analysis and design of frames. Kaveh and Khanlari [6]
    employed the genetic algorithm to estimate the collapse load factor of planar
    frames. Kaveh and Rahami [7] have utilized Genetic Algorithm for the structural
    analysis using force method. Palizi and Saedi Daryan [8], presented a comparative
    study between'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'different metaheuristic algorithms for plastic analysis of braced frames. An
    Automatic method for evaluation of plastic collapse conditions of planar frames
    has been presented by Greco et al. [9]. Smail and Laid [10], proposed a second-order
    analysis of plane steel structures using the Rankine-Merchant-Wood approach. Kaveh
    et al. [11] utilized the ant colony system and Charge System Search (CSS) algorithms
    for optimal PA. Colliding Bodies Optimization (CBO) and its enhanced version (ECBO)
    have been employed by Kaveh and Ghafari [12] for these structures. The rectangular
    grid''s collapse load factor has been studied by Kaveh et al. [13]. Also, Kaveh
    and Jahanshahi [14], developed a metaheuristic-based framework for Plastic Limit
    Analysis (PLA) of frames.


    Although all the above-mentioned efforts have been considered crucial studies
    in this field and they improved some computational drawbacks of PA, the intense
    computational cost of the plastic analysis, due to their iterative approaches
    has remained up to now. Therefore, it seems that a new computational method is
    required to be added to this field. In this chapter, a metaheuristic-based artificial
    neural network (ANN), which is categorized as a supervised machine learning technique,
    has been employed to determine the collapse load factors of two-dimensional frames
    in an absolutely fast manner. The numerical examples indicate that the proposed
    method''s performance and accuracy are satisfactory.


    The chapter is organized as follows. Section 13.2 introduces the formulation of
    the PA, including the generation of elementary mechanisms, determination of the
    collapse load factor, and combination of elementary mechanisms. An introduction
    to the metaheuristic algorithms and artificial neural networks is presented in
    Sect. 13.3. Section 13.4 is dedicated to the proposed new algorithm and its numerical
    validations. Finally, Sect. 13.5 concludes the study.


    # 13.2 Plastic Analysis


    One of the computational methods to find a set of independent mechanisms has been
    developed by Watwood [15]. However, this method also calculates joint mechanisms
    which causes some extra computational overhead. Also, the axial deformation can
    be neglected due to the effects of rotational degrees of freedom on the creation
    of the plastic hinges. Hence, the modified method proposed by Pellegrino and Calladine
    [16], may be employed.


    By indicating the elongation of each member in terms of its displacements in global
    coordinates, i.e., two displacement components for each joint or node, Eq. (13.1)
    can be obtained.


    ```

    e = (d_{x_i} - d_{x_j}) \cos \alpha + (d_{y_i} - d_{y_j}) \sin \alpha \quad (13.1)

    ```


    Using matrix notation, Eq. (13.1) leads to Eq. (13.2).


    ```

    \mathbf{e} = \mathbf{Cd} \quad (13.2)

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'where d is the nodal displacement vector, C is the compatibility matrix, and
    e is the elongation vector.


    In an acceptable mechanism, elements do not elongate. Therefore, Eq. (13.3), should
    be solved as the principal problem system of equations.


    ```

    e = Cd

    (13.3)

    ```


    In Eq. (13.3), the number of columns of matrix C exceeds the number of rows. The
    difference indicates the number of independent mechanisms. Therefore, Eq. (13.3)
    can be decomposed into Eq. (13.4).


    ```

    [I, C_d] {d^i \ d^d} = {0 \ 0}

    (13.4)

    ```


    Rearrangement of the Eq. (13.4), leads to Eq. (13.5).


    ```

    d^i = -C^d d^d

    (13.5)

    ```


    The selection of the dependent vectors for dd is the selection of the independent
    mechanisms. Therefore, the calculation of the di in Eq. (13.5), leads to a solution
    to Eq. (13.3).


    The virtual work theorem should be employed to calculate the collapse load factor.
    The obtained rotations and displacements can be used for the calculation of the
    internal and external works. Therefore, the collapse load factor can be obtained
    using Eq. (13.6).


    ```

    λ_c = W_internal / W_external

    (13.6)

    ```


    Finally, for obtaining a logical collapse mechanism, the elementary mechanisms
    should be combined. This procedure can be considered an optimization problem.
    The objective is to combine elementary mechanisms in a manner that the collapse
    load factor will be minimized. For this aim, the elementary mechanisms and their
    corresponding coefficient are considered the decision variables. At least, the
    problem can be solved using optimization methods, such as meta-heuristic algorithms.


    # 13.3 Soft Computing Methods


    This section is dedicated to soft computing method details. Firstly, metaheuristic
    algorithms have been introduced. Due to the application of the Enriched Firefly
    Algorithm (EFA) in this chapter, the details of this method are presented in the
    following. Finally, the artificial neural networks (ANNs) formulation follows
    them.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 13.3.1 Metaheuristic Algorithms


    In these times, those types of computational algorithms, which are called meta-heuristics
    have gained wide usage in engineering, applied mathematics, economics, medicine,
    and other fields, Kaveh [17]. The first category of meta-heuristic algorithms
    is the nature-inspired one. Some behavior of Animals such as migrating, hunting,
    flocking, and foraging procedures are very suitable for computational simulation.
    Therefore, these behaviors can be studied and implemented as swarm intelligent
    rules to develop an appropriate meta-heuristic algorithm. Other types of meta-heuristic
    algorithms are developed according to the physical laws. Also, there are some
    meta-heuristics based on mathematical models. Finally, some meta-heuristic algorithms.


    In this chapter, one of the recently developed meta-heuristic algorithms, known
    as the Enriched Firefly Algorithm (EFA), is utilized to improve the performance
    of artificial neural networks (ANNs). Therefore, FA and its enriched version are
    explained in the following.


    # 13.3.2 Firefly Algorithm and Its Enriched Version


    The basic version of the Firefly algorithm (FA) was presented by Yang and Slowik
    [18] and has been applied successfully in either continuous or discrete optimization
    problems. Although it is proven that FA is a better algorithm than many other
    optimization meta-heuristic algorithms, there are some drawbacks to its computational
    processes. For instance, Khadwilard et al. [19] indicated that the FA could not
    find the optimum solution to some problems and was trapped in the local optima.
    Therefore, many adaptive, hybrid, chaotic, improved, and enhanced versions of
    basic FA have been developed so far.


    For the implementation of the FA, there are two critical considerations. First,
    the variation of light intensity, and second, the formulation of attractiveness.
    The appropriate assumption, for simplicity, is that the attractiveness of a firefly
    is indicated by its brightness which is, in turn, mapped to the encoded cost function
