- pgno: 241
  md: '# Chapter 12

    Efficient Training of Artificial Neural Networks Using Different Meta-Heuristic
    Algorithms for Predicting the FRP Strength


    **Abstract** In this study, the aim is to use the combination of meta-heuristic
    algorithm with two different types of artificial neural network structure to optimize
    the parameters of the feed forward backpropagation and radial basis function networks.
    In this paper, Particle swarm optimization (PSO), Genetic algorithm (GA), Colliding
    bodies optimization (CBO), Enhanced colliding bodies optimization (ECBO) algorithms
    are used to combine with ANNs. A total of 223 test data on Carbon FRP (CFRP) collected
    from the available literature were used to generate training and test data sets.
    Various validation criteria such as mean square error, root mean square error
    and correlation coefficient (R) are used to validate the models. These models
    consider the effects of concrete compressive strength, concrete sample diameter,
    concrete sample length, fiber elastic modulus, fiber thickness, fiber strength
    on the ultimate strength of FRP-concrete.


    # 12.1 Introduction


    This chapter is mainly based on the efficient neural networks using different
    meta-heuristic algorithms for predicting the FRP strength, Kaveh and Khavandizadeh
    [1]. An artificial neural network is a massively parallel computing model that
    mimics the function of the brain. Similar to a biological model consisting of
    a large number of interconnected neurons, an ANN is composed of a large number
    of similarly connected computational elements called artificial neurons. ANN does
    not solve the problem in a strictly mathematical sense, but exhibits information
    processing properties that provide an approximate solution to a given problem.
    Artificial neural networks have been widely used in complex nonlinear function
    mapping, image processing, pattern recognition and classification, etc.


    As one of the most important members of computational intelligence, artificial
    neural networks (ANN) which include backpropagation networks (BP), radial basis
    function networks (RBF), anti-propagation networks, Kohonen networks are and so
    on.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The common point of meta-heuristic optimization algorithms with artificial
    neural network is that the artificial neural network ends up with an optimization
    problem after designing its structure for training. Here, instead of gradient
    methods, we can use meta-heuristic optimization methods to determine neural network
    weights.


    In recent years, the application of artificial neural networks has been increased
    by using a combination of different networks and algorithms.


    Fiber reinforced polymer (FRP) is a composite product consisting of fibers and
    matrix. Among the common industrial fibers, Carbon FRP (CFRP), aramid FRP (AFRP),
    Glass FRP (GFRP), the matrix is also polymers such as epoxy, vinyl ester, polyester,
    etc. Each of the mentioned materials alone has unique characteristics, which are
    combined with the intention of producing a better product than fibers and resin
    alone.


    In this chapter, the optimization of two different types of ANN (FFB, RBF) using
    meta-heuristic algorithms for validating and predicting the strength of CFRP concrete
    is presented. Fiber reinforced polymers (FRPs) has been widely used in the field
    of civil engineering in recent decades due to their lightweight, high strength,
    high elastic modulus, high corrosion resistance and easy construction [2]. FRP
    coating is mainly for strengthening or from another point of view as a new engineering
    method to improve and strengthening the behavior of existing structures or repairing
    damage to existing structures is used [3]. Studies have shown that the use of
    FRP concrete composite structures, in addition to improving the strength and hardness
    of the structure, also prevents the penetration of chlorine ions in the external
    environment into the concrete and thus reduces the risk of steel rebar corrosion
    [4].


    The optimization of artificial neural networks is often considered from different
    aspects: optimization of weights, bias, hyper parameters, network structure, activation
    nodes, learning parameters, learning algorithm, learning environment, etc. Concrete
    compressive strength, concrete sample diameter, sample length, Concrete, fiber
    elastic modulus, fiber thickness, fiber resistance were considered as input variables
    for FFB and RBF training. The final strength of FRP concrete was used as output
    variable.


    # ## 12.2 Artificial Neural Network Models


    Typically, a feed-forward backpropagation network such as MLP uses processing
    units that are placed in three types of input, hidden, and output layers. Each
    unit in a layer is connected to units in adjacent layers with an associated weight
    (connection strength). It is the adjustment of these weights that is done during
    network training, because network training involves repeatedly changing the weights
    between neurons until the output signal matches the target output within the desired
    minimum error. When training open feedforward networks, the studied data set is
    usually divided into a training set and a validation set. While the training set
    is used to train the network, the validation set is applied to check the error
    performance of the network. Finally, it is common to reserve a third set of cases
    (the test set) for external prediction to ensure that the results in the training
    and validation set are real and not artifacts of'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/4048998719320644ee88964326fd7995_243_0.png)


    the training process. The general architecture of feed forward propagation networks
    is shown in Fig. 12.1, Ref. [5].


    In such feedforward backpropagation networks, connection weights are set to random
    values at the beginning of training. Descriptor values for all parameter sets
    under study are passed through the network (feed forward) and the output responses
    are compared with the target values of the input properties to obtain an error
    value. Then the weights are adjusted for the second pass of the data through the
    network to reduce the amount of error obtained. Since the adjustment of weights
    starts with the correction of the last layer and then continues backward to the
    first layer, this mode is called backpropagation. This entire procedure is repeated
    iteratively to minimize the amount of error. Finally, a regression coefficient
    may be calculated between the observed product properties and the network predicted
    values. In general, feed forward back propagation networks suffer from two potential
    problems: (a) data overfitting in the presence of too many adjustable weights;
    and (b) overtraining the network if there are too many training cycles. Considering
    these two problems, the number of adjustable weights plays an important role,
    which also affects the predictability of the final network. Finding the optimal
    network topology to achieve a balance between those two extreme situations is
    an important point in network learning [5].


    Another type of networks is radial basis function networks. RBF networks have
    a fixed three-layer architecture (Fig. 12.4), which consists of an input layer,
    a hidden layer, and an output layer. The input layer provides network inputs.
    The hidden layer remaps the input data to separate them linearly. The output layer
    performs linear separation. The specific architecture dictates that the design
    of RBF networks is usually organized into three steps: (1) find the appropriate
    network size; (2) Find the appropriate initial parameters: centers and widths).
    (3) Train the networks. Because of the similar layer-to-layer topology, RBF networks
    are often considered to belong to MLP networks. It was proved that RBF networks
    can be implemented by MLP'
  merge: -1
  img_proc: true
