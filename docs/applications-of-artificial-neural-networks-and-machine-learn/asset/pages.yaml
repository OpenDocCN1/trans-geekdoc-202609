    # 22.6 Conclusions


    The robustness of group method of data handling (GMDH) and multivariate adaptive
    regression splines (MARS) as alternative approaches was investigated and assessed
    in prediction of the shear strength of slender HSC reinforced concrete beams.
    An available database including 250 experimental tests of shear strength has been
    employed to develop the MARS and GMDH model. The proposed models related the shear
    strength to longitudinal steel ratio, the shear span-to-depth ratio, compressive
    strength of concrete, the size of the beam specimens, and the size of coarse aggregate.
    The predictive abilities of GMDH and MARS models were examined by comparing their
    predictions with those obtained from the most common formulae and MNLR regression
    approach. The most important outcomes of this study can be summarized as follows:'
