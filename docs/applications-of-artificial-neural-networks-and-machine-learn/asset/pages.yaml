    # ## 10.3 Finite Element Model of Arch Dam


    In the present study, a finite element model based on modal analysis of double-curvature
    arch dam is presented. The arch dam is treated as a three dimensional linear structure.
    A twenty-node isoparametric solid element is used to mesh of the arch dam body.
    It is assumed that the reservoir is empty and dam foundation is rigid to avoid
    the extra complexities that would otherwise arise. These assumptions do not affect
    the proposed methodology for optimal design of arch dams. The material properties
    of the dam are given in Table 10.1 and the finite element model of a parabolic
    arch dam is depicted in Fig. 10.2.


    The Block Lanczos eigenvalue solver is given in ANSYS [15] which uses the Lanczos
    algorithm. This method is useful for large-scale structures and typically, is
    applicable to the type of problems solved using the subspace eigenvalue method
    and is as accurate as the subspace method, but has a faster convergence rate.


