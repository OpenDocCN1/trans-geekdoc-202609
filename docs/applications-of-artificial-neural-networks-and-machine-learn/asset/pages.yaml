    # 1.6.3 Radial Basis Neural Network


    Radial Basis Networks are actually Feedforward (FF) neural networks that use the
    Radial Basis Function, instead of the Logistic Function, as the activation function.
    The question that arises at this point is what is the difference between the basic
    radial neural network and the feedforward neural network?

    The logistic function maps some arbitrary value to a 0–1 interval to answer a
    “yes or no” question (binary question). These types of neural networks are suitable
    for Classification and Decision Making Systems, but they perform poorly for continuous
    values. Meanwhile, basic radial functions answer the question, “How far are we
    from the goal?” And this makes these neural networks suitable for function estimation
    and machine control. In short, it should be said that basic radial neural networks
    are actually a kind of feedforward neural networks with different activation functions
    and characteristics. Radial Basis Neural Network shown in Fig. 1.28.'
