  md: '# ## 10.5.2 An Enhanced Charged System Search Algorithm


    In the standard CSS algorithm, when the calculations of the amount of forces are
    completed for all CPs, the new locations of agents are determined. Also CM updating
    is fulfilled after moving all CPs to their new locations. All these conform to
    discrete time concept. In the optimization problems, this is known as iteration.
    On the contrary, in the enhanced CSS, time changes continuously and after creating
    just one solution, all updating processes are performed. Using this enhanced CSS,
    the new position of each agent can affect the moving process of the subsequent
    CPs while in the standard CSS unless an iteration is completed, the new positions
    are not utilized. All other aspects of the enhanced CSS are similar to the original
    one [9].


    # ## 10.6 Neural Network


    Optimum design of arch dams for constrained frequencies is a time consuming process
    because a huge number of eigenproblems should be solved. In order to reduce the
    computational effort, neural network is used to predict the required natural frequencies
    during the optimization process.


    Neural network training is the first stage of the presented methodology. In this
    case, a number of arch dams based on their geometric parameters are randomly selected
    and their natural frequencies are evaluated by conventional finite element analysis
    using ANSYS. Considering the geometric parameters of the generated dams as the
    inputs and their corresponding natural frequencies as the targets, the neural
    network is trained using MATLAB. In the second stage, the optimization task is
    achieved by CSS and Enhanced CSS algorithms. In these cases, the necessary natural
    frequencies of the dams are predicted by the trained neural networks and during
    the optimization processes the modal analysis of the dams is not required. This
    makes the methodology more efficient.


    # ## 10.6.1 BP Neural Network


    Standard BP [23] is a gradient descent optimization algorithm, which adjusts the
    weights in the steepest descent direction, according to the following equation:


    \( W_{k+1}^{BP} = W_k^{BP} - \eta_k G_k \quad (10.28) \)


    where \( W_{k+1}^{BP} \) and \( G_k \) are the weight and the current gradient
    matrices, respectively, and \( \eta_k \) is the learning rate. Levenberg–Marquardt
    (LM) algorithm was designed to approach second-order training speed without having
    to compute the Hessian matrix [24]. In the LM algorithm, the weights updating
    is achieved as follows:'
  merge: -1
  img_proc: true
- pgno: 222
  md: '\(W_{k+1}^{BP} = W_k^{BP} - \left[J^T J + \mu I\right]^{-1} J^T E\) (10.29)


    where J is the Jacobian matrix that contains first derivatives of the network
    errors with respect to the weights, and E is a vector of network errors. Also,
    \(\mu\) is a correction factor. The value of \(\mu\) is decreased after each successful
    step and is increased only when a tentative step would increase the performance
    function [24].


    # ## 10.7 Implementation of Arch Dam Optimization


    In the process of optimization, natural frequencies of generated dams are evaluated
    by ANSYS or trained BP network. Thus, with the mentioned conditions, optimization
    is implemented using four different methods listed in the following:


    +   (a) CSS using accurate analysis employing a finite element analysis.

    +   (b) Enhanced CSS utilizing accurate analysis using a finite element analysis.

    +   (c) CSS using approximate analysis utilizing the trained BP network.

    +   (d) Enhanced CSS using approximate analysis employing the trained BP network.


