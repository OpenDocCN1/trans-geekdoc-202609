  md: '+   3. In BPs, computation nodes in separate layers share a common neuronal
    model and not necessarily the same activation function. In RBF networks, however,
    hidden nodes (basis functions) perform very differently and have a very distinct
    purpose from output nodes.


    +   4. In RBFs, the argument of each hidden unit activation function is the distance
    between the input and the weight (RBF centers), wheras, in Backpropagation, it
    is the inner outcome of the input and the weight.


    +   5. BP nets are frequently trained with a single global supervised algorithm,
    while RBF neural networks are usually trained one layer at a time with the first
    layer unsupervised.


    +   6. BPs construct global approximations to nonlinear input–output mapping with
    distributed hidden representations, whereas RBF nets conduce to apply localized
    nonlinearity at the hidden layer to construct local approximations. Although for
    approximating nonlinear input–output mappings, the RBF networks can be trained
    much quicker, BP may need fewer parameters.


    # 5.5 Extended Radial Basis Function


    There are a few impediments to the conventional RBF approach, which might be limiting
    its effectiveness as a metamodeling strategy, hence introducing a novel extension
    to the RBF approach that successfully overcomes its contemporary deficiencies
    is required. More particularly, RBF neural networks generate an interpolating
    surface that is unique with respect to a supplied set of prescribed data points.
    Solving a square system of linear equations results in the interpolating surface.
    The incapability of preventing resulting spurious local minima is a considerable
    deficiency. Several researchers have suggested modifications to the conventional
    RBF networks to overcome some of their restrictions. In 1987, Powell [11] offered
    the theory of developing the performance of RBFs by augmenting them with a set
    of polynomial functions and imposing limitations, which leads to a scheme of linear
    equations. Although these modifications enhance the performance of RBF neural
    networks, they do not lead to an increase in their flexibility regarding the model
    building process. There have been significant strides in constructing metamodels
    with smoothing properties. Girosi [12] proposed the Support Vector Machine (SVM)
    technique from the context of data interpolation. The SVM technique takes smoothness
    constraints into the consideration to be incorporated into the model building
    process. Having considered the pros and cons of RBFs, there is a necessity of
    introducing an approach not only containing the advantages of RBF nets but also
    covering its drawbacks. Therefore, a method called the Extended Radial Basis Function
    (ERBF) approach has been proposed, which intentionally evades the notion of unique
    solvability. This new technique simplifies building metamodels for designers and
    ultimately leads to more precise and efficient metamodels. The following illustrates
    the development of new type of basis functions known as the Nonradial Basis Functions
    (NRBFs), which will produce an integral component of the ERBF approach.'
