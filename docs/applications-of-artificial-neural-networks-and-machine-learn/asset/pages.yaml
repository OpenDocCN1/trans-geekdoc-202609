- pgno: 349
  md: '# 18.1 Introduction


    variables. Shahnewaz applied genetic algorithm in this problem with and without
    stirrups using 116 and 46 data samples, respectively, based on the different shear
    design equations proposed in FRP design guidelines. Mohammadi Golafshani et al.
    used successfully and for this problem. Very recently Mohammadi Golafshani and
    Ashour developed a new approach based on the biogeography-based programming (BBP)
    as an extension of Biogeography-Based Optimization (BBO) to address this problem
    for the case of without stirrups using 138 experimental specimens with 6 influential
    parameters and presented an optimum equation used. This study investigates efficiency
    of the GMDH network with the aim of improving the prediction capability of soft
    computing based approaches in this problem. GMDH is a relatively unexplored network.
    In GMDH the most important input variables, number of layers, neurons in hidden
    layers and optimal model structure are determined automatically. The network is
    thus composed of active neurons that organize themselves. The GMDH network learns
    in an inductive way and tries to build a function (called a polynomial model)
    which would result in the minimum error between the predicted value and expected
    output [1].


    Recently gathered datasets: a set of 175 data samples by Razaqpur and Spadea and
    a set of 112 data samples are used here which are more comprehensive than the
    data sets utilized in the previous studies as stated in the previous paragraph.
    The relative importance of significant parameters dealing with shear strength
    of FRP-reinforced members is also investigated through sensitivity analysis. The
    performance of proposed models evaluated by comparing against several codes of
    practice. Further evaluation also done based on comparison with an artificial
    neural network (ANN) model and an ANFIS based model developed in this study using
    the same databases. The accuracy of the developed models is evaluated by statistical
    error parameters. The results show that the GMDH outperforms other models and
    successfully can be used as a practical and effective tool for shear strength
    prediction of members without stirrups (R² = 0.94) and with stirrups (R² = 0.95).
    Furthermore, the relative importance and influence of input parameters in the
    prediction of shear capacity of reinforced concrete members is evaluated through
    parametric and sensitivity analyses.


    The remaining sections of this chapter are organized as follows. In Sect. 18.2,
    GMDH algorithm is described in brief. Third section states to the data description,
    involved input parameters and modeling process for predicting shear capacity of
    FRP-RC members with and without stirrups. The GMDH model performance is evaluated
    against empirical approaches and other soft computing based approaches (ANFIS
    and ANN) in Sect. 18.4 and related results and discussions are made. Sensitivity
    and parametric analyses are also conducted in this section to evaluate the robustness
    of GMDH model in capturing the underlying physical behaviors of FRP-RC members.
    At the end, the chapter is concluded in Sect. 18.5.'
