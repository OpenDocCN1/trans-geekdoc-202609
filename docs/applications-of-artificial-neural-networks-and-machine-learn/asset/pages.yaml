    # ## 10.9 Concluding Remarks


    Shape optimization of arch dams for constrained frequencies is performed in this
    chapter. For this purpose, a finite element model based on modal analysis of arch
    dam is presented. The results of this model are compared to those of reported
    in literature and its performance is verified. In order to optimize the arch dam
    a combination of the new meta-heuristics algorithms and neural network is utilized.
    The meta-heuristics algorithms used in this investigation are CSS and Enhanced
    CSS. In order to reduce the computational cost of the optimization process the
    natural frequencies of the arch dams are evaluated using properly trained back
    propagation (BP) neural network instead of their exact modal analysis.


    It should be noted that the solutions found by EA is more accurate than those
    obtained by utilizing the neural networks, but the time spent in the case of using
    neural networks is about 0.3 of the time required for optimization using EA, while
    the computational errors appeared due to approximation, are negligible. It is
    demonstrated that the optimum design obtained by Enhanced Charged System Search
    using the BP network is the best compared to the other results. The numerical
    results demonstrate the efficiency and computational merits of the proposed methodologies
    for shape optimization of arch dams.


