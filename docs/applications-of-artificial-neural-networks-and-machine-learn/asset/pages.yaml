    # 1.3.1 Feedforward


    The model that forwards information from the input (from layer to layer) is known
    as feedforward. This process is performed as the prediction or network output
    calculation for the input data without any feedback, in other words, the information
    is passed from the input layers to the output layers, without interruption or
    feedback. The feedforward process in neural networks is generally done as follows:


    Input information (such as images, text, or numerical features) is fed to the
    input layer of the network.


    Information is transferred from layer to layer through specific weights and processed
    by activations (such as ReLU or sigmoid activation function). This process continues
    until reaching the output layer. Finally, the output calculated by the network
    is produced as the final response to the inputs given to the network.


    The feedforward process is used as the first step in the decision-making and forecasting
    process using neural networks. This process is used to predict new data, recognize
    patterns, make automated decisions, machine translation and many other applications
    of machine learning.


    # 1.3.2 Backpropagation


    Backpropagation is a common learning algorithm in deep neural networks that is
    used to update model weights. This algorithm uses a forward process to predict
    the output and calculate the prediction error, and then passes this error backward
    and'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'optimizes the network weights to reduce the prediction error. The backpropagation
    process is as follows:


    First, by entering the data and calculating the output, the predicted error is
    calculated. Then, using the least squares method or another criterion, the calculated
    error is transferred back and attributed to each of the weights of the network,
    and finally, using From the learning rate and the optimization algorithm such
    as integration or momentum, the weights of the network are updated in such a way
    that the prediction error is reduced.


    This process is repeated until the model reaches an optimal state and the prediction
    error is minimized. Backpropagation algorithm is one of the most important machine
    learning algorithms for training deep neural networks and helps to optimize model
    weights and improve network performance.


    # 1.3.3 Gradient Vanishing


    Gradient vanishing is a common problem in neural network training that due to
    concatenation of several layers of neurons, the gradients (partial derivatives
    of the objective function with respect to the weights) may vanish or become very
    small. This causes the network weights to not be updated effectively and the network
    performance is not improved. Gradient vanishing is clearly evident in deep networks
    with more layers, as at each layer the derivatives are carried to lower layers
    and may shrink or disappear. This problem can slow down the training process,
    increase the time required for the network to converge or even reach a parallel
    state.


    Some methods of removing gradient blur in neural networks include using different
    activation functions (such as Leaky ReLU), using softening methods such as Dropout,
    using normalization methods such as Batch Normalization, or using networks with
    a special structure such as recurrent neural networks. It is possible to avoid
    the gradient fading problem and to continue training the network effectively.


    # 1.3.4 Gradient Exploding


    Gradient exploding is another situation in neural network training where the gradients
    are very large and go to infinity. This may happen due to the derivation of the
    sequence of large classes from each other in deep networks and cause instability
    in network training. The occurrence of gradient explosion can lead to unpredictable
    reactions and numerous jumps in updating the network weights, which reduces the
    quality and performance of the network. This problem usually occurs when using
    a very large learning rate in the process of updating the weights and can cause
    the network to fail to converge or other undesirable problems.


    To prevent gradient explosion, one of the common methods is to use a technique
    called “Clipping Gradient” in which, if the gradients exceed a certain limit'
  merge: -1
