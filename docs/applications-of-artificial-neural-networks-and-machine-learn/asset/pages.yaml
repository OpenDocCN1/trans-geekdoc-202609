  md: '# 18.4 Results and Discussion


    Correlation coefficient (R), root mean square error (RMSE), coefficient of determination
    (R²), and BIAS as the prevalent prediction error indicators are used here. Their
    governing formulae are as follows [4]:


    ```

    R = \frac{\sum_{i=1}^N (P_i - P_m)(O_i - O_m)}{\sqrt{(P_i - P_m)^2}\sqrt{(O_i
    - O_m)^2}} (18.8)

    ```


    ```

    RMSE = \sqrt{\frac{1}{N} \sum_{i=1}^N (P_i - O_i)^2} (18.9)

    ```


    ```

    R^2 = 1 - \frac{\sum_{i=1}^N (O_i - P_i)^2}{\sum_{i=1}^N (O_i - O_m)^2} (18.10)

    ```


    ```

    BIAS = \frac{\sum_{i=1}^N (P_i - O_i)}{N} (18.11)

    ```


    where Oi is the measured value, Pi stands for prediction values; N is the number
    of data points, Om is the mean value for the observation and Pm is the mean value
    of prediction. In fact, the R parameter was chosen to show correlation between
    predicted and measured values. If the R value is more than 0.8, it shows that
    there is strong correlation between measured and predicted values. However, R
    sometimes may not necessarily indicate better model performance due to the tendency
    of the model to deviate toward higher or lower values, particularly when the data
    range is very wide and most of the data are distributed about their mean. Consequently,
    the coefficient of determination, R², were used because it can give unbiased estimate
    and may be a better measure for model performance. In addition, BIAS and RMSE
    parameters should be at the minimum for having precise results [5].


    To further confirmation of the predictive performances of developed GMDH model,
    two well-known soft computing approaches including ANN and ANFIS are also developed
    in this study. To achieve this, two multi-layer perceptron (MLP) neural networks
    based on Levenberg–Marquardt algorithm are developed to obtain the optimum structures
    for predicting shear strength of members with stirrups and without stirrups. Different
    number of hidden layers and different neurons in each hidden layer are applied
    to reach the best performance. The models with the best performances for both
    training and testing datasets are chosen as the predictive models. All simulations
    are done in the MATLAB programming language version R2012a. In this regard, the
    optimum topological structure obtained by MLP for members without stirrups is
    10 input variables in an input layer, 5 neurons in hidden layer 1, and 3 neurons
    in hidden layer 2. The output layer is composed of V values predicted by ANN algorithm.
    For members with stirrups, 9 input variables in input layer, 6 neurons in hidden
    layer 1, and 7 neurons in hidden layer 2 are obtained for the best model.'
  merge: -1
  img_proc: true
