- pgno: 211
  md: '# Chapter 10

    Shape Optimization of Arch Dams

    with Frequency Constraints

    by Enhanced Charged System Search

    Algorithm and Neural Network


    **Abstract** The main aim of this chapter is to find the optimum shape of arch
    dams subjected to multiple natural frequency constraints by using an efficient
    methodology. The optimization is carried out by charged system search algorithm
    and its enhanced version. Computing the natural frequencies by finite element
    analysis during the optimization process is time consuming. In order to reduce
    the computational burden, Back Propagation (BP) neural network is trained and
    utilized to predict the arch dam natural frequencies.


    # 10.1 Introduction


    In this chapter the shape optimization of arch dams is performed with the frequency
    constraints by enhanced charged system search algorithm and neural network [1].
    It is obvious that an appropriate shape design has a great influence on the economy
    and safety of an arch dam. Also, the natural frequencies are important parameters
    affecting the dynamic behavior of the arch dams. By imposing some constraints
    on the natural frequencies, the dynamic behavior of arch dam may be improved and
    the eventual resonance phenomenon during earthquake can be also eliminated. On
    the other hand, arch dams are supposed to be designed as economical as possible.
    Thus a frequency constraint cost optimization process should be performed to obtain
    these two aims simultaneously.


    Traditionally, shape design of an arch dam is based on the experience of the designer,
    the model tests and trial and error procedures. To obtain a better shape, the
    designer should select several alternative schemes with various patterns and modify
    them to obtain a number of feasible shapes. The best shape satisfying the demands
    of design specifications is selected as the final shape. The shape of the dam
    obtained in this way is feasible but not necessarily optimum or even near optimum.
    Moreover, the time required for design is rather long. To overcome these difficulties,
    the process can easily and reliably be performed by employing optimization techniques
    [2].


    In the recent years, some progress has been made in optimum design of arch dams.
    Almost all of them have used conventional methods for analysis approximation and'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'optimization. The main disadvantage of these methods is the need for calculating
    the function derivatives and may also trap in local optima. Meta-heuristic algorithms
    are computationally efficient in comparison to the gradient based methods [2–6].


    As a newly developed meta-heuristic algorithm, the charged system search (CSS)
    is introduced by Kaveh and Talatahari for design of structural problems [7, 8].
    This method utilizes the governing laws of Coulomb and Gauss from electrostatics
    and the Newtonian laws of mechanics. Inspired by these laws, a model is created
    to formulate the structural optimization method. This algorithm and its enhanced
    form are utilized to find optimal shape of arch dams with constrained natural
    frequencies. The cost of the arch dam including concrete volume and the casting
    areas is considered as the objective function. The design variables are geometric
    parameters of the arch dam. In order to implement a practical design optimization,
    many constraints such as stress, displacement, stability requirement, and frequency
    constraints are considered. In the present study, in order to simplify the optimization
    operation, only frequency and some geometrical constraints are considered.


    The stochastic nature of the meta-heuristic search techniques makes the convergence
    of the process slow. Therefore, complete optimization of arch dams for frequency
    constraints requires considerable computational effort. In order to accelerate
    the optimization process and reduce the computational time, the natural frequencies
    of arch dams are predicted using properly trained Back propagation (BP) neural
    network instead of direct evaluation. Many successful applications of neural networks
    are reported in literature [9–14]. The numerical results demonstrate the computational
    merits of the proposed methodology for optimum shape design of arch dams.


    # 10.2 Geometrical Model of a Double-Curvature Arch Dam


    The first stage of shape optimization of arch dams is to select an appropriate
    geometrical model. The model should be consistent with the stress state of arch
    dams and simple to facilitate construction. It is also important to construct
    the model on design variables with physical meaning. In this study, a geometric
    model for double-curvature arch dams that is based on practical requirements is
    presented. To define the geometrical model of an arch dam, the shape of a central
    vertical section is determined first, and then the shape of horizontal sections
    at various elevations is specified.


    # 10.2.1 Shape of the Central Vertical Section


    For the central vertical section of a double-curvature arch dam, one polynomial
    of nth order can be used to determine the curve of the upstream boundary and another
    polynomial can be utilized to determine the thickness. In this study, for the
    curve of the upstream face a polynomial of second order is considered as:'
