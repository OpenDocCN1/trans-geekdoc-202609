    # 21.5.3 Sensitivity Analysis


    To apply GT approach for determining the most effective parameters, ten scenarios
    were designed. In the first scenario, all input parameters were considered in
    GT analysis. In next step, the input variables are excluded one by one from dataset
    in the remaining scenarios and then a new well GT analysis is done. The result
    of GT analysis for each scenario is presented in Table 21.5. Four GT parameters
    including gamma, gradient, standard error, and Vratio are used to analysis the
    performance of each scenario. Excluding each parameter from analysis leads to
    change of GT parameters, which can be used to evaluate the importance of that
    excluded parameters. More changes in GT values indicate that the corresponding
    excluded parameter has more contribution in prediction of maximum bond strength.
    As stated, the Vratio can be varied between zero and 1. The value of Vratio close
    to zero indicates that there is a high degree of accuracy in prediction of bond
    strength. To more illustration, the values of different parameters of GT analysis
    are presented in Fig. 21.9. It can be seen from this figure that the Scenario
    1 in which all input parameters was considered as effective parameters, has the
    minimum values of GT parameters. According to this table, excluding tp, Ep and
    L leads to a remarkable change in GT parameters; therefore, it can be concluded
    that these parameters are the most important parameters in prediction of maximum
    bond strength.


