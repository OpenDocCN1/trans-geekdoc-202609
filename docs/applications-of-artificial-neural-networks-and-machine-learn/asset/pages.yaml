    9.1, the inputs are introduced along with their units. An experimental dataset
    totaling 255 PG masonry shear walls was compiled from 22 independent studies (Table
    9.2) [12]. The collected samples are divided into 5 categories from A to E. This
    division is given in Table 9.3. The range of parameters used in ANN modeling is
    given in Table 9.4. All input and output variables in the database are normalized
    on a -1, 1 scale, following this formula:


    \( Norm x_i = \left[ \frac{x_i - min(x)}{max(x) - min(x)} \times 2 \right] - 1
    \) (9.2)


    where x is the input or output variable to be normalized, \(x_i\) is its corresponding
