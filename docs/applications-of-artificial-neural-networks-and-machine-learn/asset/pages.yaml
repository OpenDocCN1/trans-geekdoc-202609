    # 22.5.3 Safety Analysis


    A reliable prediction of concrete shear capacity is vital for engineers to have
    a safe, technically correct and economic design. According to previous sections,
    it can be expected that the uncertainty of the design codes are more in comparison
    to the proposed ones due to their low accuracy. However, it is impossible to know
    the uncertainty or safety factor incorporated in them. To evaluate the reliability
    and uncertainty of the existing models, box plot of DR values of different approaches
    can be used. To generate each box, the DR values for entire database are sorted
    from the largest to smallest values and then the median values of them specifies
    the central mark of the box. The edges of the box represent the 25th and 75th
    percentiles. The generated box plot can be used as a tool to graphically demonstrate
    the uncertainty in different models. The spacing between the different parts of
    the box indicates the degree of dispersion (spread) or skewness.'
