- pgno: 397
  md: '# # Chapter 20


    # New Predictive Models for Prediction of Bond Strength Between FRP Reinforcements
    Externally Glued on Masonry Units


    **Abstract** Interest in FRP composite bars as reinforcement to concrete has increased
    over the years as it has shown solutions to the drawbacks of steel such as its
    corrosion issues and vulnerability when employed in adverse environmental conditions.
    However, it is still not widely incorporated as a replacement to conventional
    steel primarily due to the complexity of its bond strength mechanism. This, therefore,
    imposes the need to establish a comprehensive relationship for the bond property
    of the FRP reinforced concrete. This chapter presents a novel Artificial Neural
    Network (ANN) bond strength prediction model for FRP reinforced concrete using
    184 hinged beam database from various existing experiments.


    # ## 20.1 Introduction


    This chapter discusses the derivation of new model for the bond behavior of NSM
    FRP systems in concrete [1]. Recently, Fibre Reinforced Polymer (FRP) sheets or
    laminates have been widely employed as externally bonded reinforcement (EBR) systems
    in civil engineering constructions. In particular, the use of FRP EBR system for
    strengthening and retrofitting the existing masonry buildings like monumental
    heritage is significantly increasing. The reason for Increasing the use of FRP
    materials for retrofitting masonry buildings is due to the favorable properties
    of FRP EBR techniques such as: high strength and resistance to corrosion, high
    durability, non-magnetic, high fatigue resistance, and no increment in mass and
    stiffness of the structure [2]. In common practice, the FRP EBR technique is designed
    based on several empirical and semi-empirical design equations. Design procedure
    of FRP EBR technique including installation, loads, safety requirements and acceptable
    features of materials has been coded in several guidelines [3–6]. Different in-plane
    or out-of-plane failure modes of retrofitted masonry units have also been investigated
    in recent years [7–9].


    The bond interface between FRP and masonry units is often one of the weakest links
    in tensile strengthened masonry structures, and debonding at this interface is
    one of the critical failure modes of FRP EBR systems. During the design procedure,
    bond'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'strength at interface level must be taken into account because of its sudden
    and brittle failure. Debonding process is very complex due to several preeminent
    parameters involved in this process including mechanical properties of masonry
    blocks, mortar joints, adhesive, and FRP reinforcement. This mechanism involves
    the presence of cracks a few millimeters underneath the bond line inside masonry
    units [10, 11]. In fact, FRP debonding will initiate in the substrate if bond
    strength directly depends on the tensile strength of masonry units.


    Various experimental studies have been conducted to investigate the effect of
    different influential parameters on debonding failure and a number of empirical
    and analytical models for predicting debonding failure have been developed. As
    examples of such studies one can refer to [12–22]. However, due to the complexity
    and the brittle characteristics of debonding failure mechanism, a remarkable scatter
    has been observed between predicted maximum bond strength and the measured ones
    [23]. Many of these models are highly empirical, and their predictive abilities
    are limited by the corresponding data sets from which they were derived, and do
    not provide a reliable prediction of maximum transferable load. Recently, soft
    computing methods have been successfully used to develop predictive models for
    different problems in civil engineering [24–30]. In particular Mansouri and Kisi
    [23] evaluated the applications of neuro fuzzy and neural network approaches for
    estimation of debonding strength for masonry elements retrofitted with FRP composites
    using eight available experimental datasets consisting of altogether 109 data
    points. Gene expression programming (GEP) has been used by Mansouri et al. [31]
    to predict the debonding strength of retrofitted masonry members using ten available
    experimental databases [22] consisting of 134 data points. Results showed that
    ANN and ANFIS approaches can be successfully used to predict the bond strength.
    However, these methods do not give sufficient insight into the generated models
    and are not as easy to use as the empirical formulas. Although GEP has successfully
    been used to predict the bond strength and results in an explicit formulation
    of maximum load but it is well known that compiling more comprehensive database
    is requisite in generating exact predictive models.


    The main purpose of this study is to employ M5′ and MARS algorithms to develop
    transparent models to predict maximum bond strength and determine the most effective
    parameters. For this aim a new comprehensive database collected in the present
    study from different sources in literature (231 data points from 23 available
    experimental studies). The M5′ model tree is a robust data-based method that provides
    understandable formulas that allows users to have more insight in the physics
    of the phenomenon [32, 33]. The MARS algorithm is also known as a self-organized
    predictive approach that can discover complex behaviors between input and output
    parameters and determine the most effective parameters in predicting maximum bond
    strength [34]. Five different predictive variables that characterize the mechanical
    and geometrical properties related to FRP rods and support including the reinforcement
    width, ratio between the widths of FRP reinforcement and masonry unit, tensile
    strength of support, axial strength of reinforcement and bond length are considered
    as input variables. A comparative study is conducted between developed models
    and the most common design equations. Furthermore, the safety analysis based on'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'Demerit Points Classification (DPC) scale has also confirmed the reliability
    of the proposed formulations. It is demonstrated that the M5'' and MARS algorithms
    can successfully be used as a reliable alternative approaches to predict bond
    strength of FRP EBR systems.


    The remaining sections of the chapter are organized as follows. In Sect. 20.2,
    a background of bond strength between FRP and masonry substrate is presented.
    The M5'' and MARS algorithms are outlined in Sect. 20.3. Section 20.4 describes
    the dataset used and also process modeling. The performance of proposed models,
    the safety and sensitivity analyses are presented in Sect. 20.5. At the end, the
    chapter is concluded in Sect. 20.6.


    # ## 20.2 Background


    Failure of masonry or concrete elements externally bonded with Fiber Reinforced
    Polymer (FRP) under shear stresses corresponds to debonding of reinforcement,
    and the separation almost occurs a few millimeters below the adhesive. The externally
    bond strength between FRP and masonry substrate have been tested and analyzed
    generally on the basis of a single pull-off test. In the test, the direct tensile
    force Papp is applied to the FRP plate bonded to masonry substrate in order to
    determine the maximum transferable load (Pmax). A sketch of single pull-off test
    for FRP to masonry unit is presented in Fig. 20.1. The shear behavior of reinforcement
    elements externally bonded to a masonry support is often modeled by a shear stress-tangential
    slip law [35]. This model can be more refined by a normal stress-displacement
    law [23].


    It is well-known that the transmissible force increases asymptotically up to a
    maximum value by increasing the length of the support [19]. The maximum transmissible
    load is related to geometrical/mechanical properties of the plate and fracture
    energy of interface law. In general, the maximum transferable force by an anchorage
    of infinite length for supports made of brittle materials with FRP externally
    bonded is written as:


    ```

    $$ P_{\max} = b_p \int_0^\infty \tau(x) \cdot dx $$ (20.1)

    ```


    where x is the longitudinal axis, \(\tau(x)\) is the bond shear stress distribution
    along the interface and \(b_p\) is the reinforcement width. The energy required
    to achieve a local bond element to complete shear debonding is expressed as the
    fracture energy and it is related to the area below the interface bond shear stress–slip
    law, \((\tau - s)\) and can be defined as:


    ```

    $$ \Gamma_p = \int_0^\infty \tau(s) \cdot ds $$ (20.2)

    ```'
  merge: -1
  img_proc: true
- pgno: 400
  md: '![](img/4048998719320644ee88964326fd7995_400_0.png)


    Fig. 20.1 Schematic diagram of single pull-off test for FRP to masonry substrate


    The relationship between the fracture energy of the interface law, \(\Gamma_p\),
    and maximum transferable force \(P_{max}\) (debonding load) for a bond–slip model
    based on a general interface bond shear stress–slip law \(\tau(s)\), is written
    as [19]:


    \(P_{max} = b_p \sqrt{2 \cdot E_p \cdot t_p \cdot \Gamma_p}\) (20.3)


    where \(E_p\) is the Young’s modulus of the FRP reinforcement and \(t_p\) is the
    thickness of the FRP.


    Depending on the shape of the interface law, a function of the strength of the
    support subject to cracking can be defined as the fracture energy, \(\Gamma_p\),
    in the following form:


    \(\Gamma_p = k_\tau \cdot k_b \cdot \tau_{max}\) (20.4)


    in which \(k_b\) represented the effect of the reinforcement width on \(P_{max}\)
    through a width factor coefficient. \(k_\tau\) is the coefficient with dimension
    (\(L\)) expressing the shape of the (\(\tau - s\)) law. Complete debonding (\(\tau
    = 0\)) occurs where \(S_{ult}\) is the ultimate slip of the bond law \(\tau(s)\)
    and \(k_\tau = S_{ult}/2\) with condition that the bond–slip law is stated as
    a bilinear law [19].'
