  md: '![](img/4048998719320644ee88964326fd7995_432_0.png)


    # Fig. 21.2 The topological structure of the extreme learning machine network


    the least human interventions, favorable universal capability, fast learning speed
    and suitability for activation and also kernel functions [34].


    To explain the ELM algorithm, let suppose a set of input and output variables
    in a database as follows:


    ```

    D = \{(x_i, y_i)\}_{i=1}^N \quad (21.5)

    ```


    where $x_i$ is the input vector, $y_i$ is the output vector and $N$ is the number
    of observations. As stated, the ELM employs the SLFN to find the relation between
    input and output variables as:


    ```

    Y = \sum_{i=1}^{L} \beta_i G(\omega_i, x_j, b_i) \quad j = 1, \dots, N \quad (21.6)

    ```'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'where \(\beta_i\) is the output weight from the \(i\)th hidden node to the
    output node, \(\omega_i\) is the hidden unit weights, \(b_i\) is the threshold
    of the \(i\)th hidden node, \(L\) is the number of hidden nodes, and \(g(.)\)
    is the activation function [39]. The matrix form of Eq. (21.6) can be written
    compactly as follows:


    \(H\beta = T\) (21.7)


    where


    \(H = \begin{bmatrix} G(\omega_1, x_1, b_1) \dots G(\omega_M, x_1, b_M) \\ \vdots
    \\ \vdots \\ G(\omega_1, x_N, b_1) \dots G(\omega_M, x_N, b_M) \end{bmatrix}_{N*M}\)
    (21.8)


    \(\beta = \begin{bmatrix} \beta_1^T \\ \vdots \\ \beta_M^T \end{bmatrix}_{M*m}\)
    and \(T = \begin{bmatrix} t_1^T \\ \vdots \\ t_M^T \end{bmatrix}_{N*m}\) (21.9)


    \(H\) is the hidden layer output matrix of SLFN neural network and \(T\) is a
    matrix containing the network target vectors [39].


    In the ELM algorithm, it is assumed that the training error is zero [33, 39].
    Therefore, it is supposed that \(y_i = t_i\) for \(i = 1, ..., N\) or in a matrix
    notation can be expressed as:


    \(Y = T\) (21.10)


    By using Eq. (21.7), the network output weights \(\beta\) can be analytically
    estimated as:


    \(\beta = H^\dagger T\) (21.11)


    where \(H^\dagger = (HH^T)^{-1}H\) is the generalized pseudo-inverse of \(H^T\).


    After determining the network output weights, the network response for a vector
    of \(x_i\) can be estimated as:


    \(o_i = \beta^T T_l\) (21.12)


    where \(T_l\) is the network hidden layer output of \(x_i\).'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# 21.3.2 Kernel Extreme Learning Machine


    The estimation of \(\beta\) may be inaccurate and challenging because the matrix
    of \(HH^T\) can be singular. Therefore, a regularized version of the ELM algorithm
    should be considered that a small training error is allowed and the network output
    weight \(\beta\) can be determined based on the following optimization problem
    [34]:


    \(Minimize : \text{Objective} = \frac{1}{2}\|\beta\|_F^2 + \frac{\lambda}{2} \sum_{i=1}^N
    \|\xi_i\|_2^2\)

    \(Subject to: \beta^T t = t_i - \xi_i \ i = 1, ..., N\)

    (21.13)


    where \(\xi_i\) is the error vector corresponding to \(x_i\) and \(\lambda\) is
    a parameter that determines the importance of the training error in the optimization
    problem and should be more than zero. To determine the network output weights
    (\(\beta\)), the theory of Karush–Kuhn–Tucker (KKT) [40] can be employed to solve
    the following dual optimization problem:


    \(\text{Objective}_{Dual} = \frac{1}{2}\|\beta\|_F^2 + \frac{\lambda}{2} \sum_{i=1}^N
    \|\xi_i\|_2^2 - \sum_{i=1}^N a_i(\beta^T t_i - t_i + \xi_i)\) (21.14)


    The network output weights \(\beta\) can be obtained by calculating the derivatives
    of the above objective function with respect to \(\beta_i, \xi_i, \text{and }
    a_i\) and setting them equal to zero. After applying this approach, the \(\beta\)
    matrix can be expressed as:


    \(\beta = \left(HH^T + \frac{1}{\lambda}I\right)^{-1} HT\)

    \(or\)

    \(\beta = H\left(H^T H + \frac{1}{\lambda}I\right)^{-1} T = H(K + \frac{1}{\lambda}I)^{-1}T\)
    (21.15)


    where \(K\) is the ELM kernel matrix, and its element is equal to the elements
    of \([k]_{ij} = H_i^T H_j\) [41]. The network response for a given vector \(x_l\)
    is given by:


    \(o_l = \beta t_l = T\left(K + \frac{1}{\lambda}I\right)^{-1} H^T H_l = T\left(K
    + \frac{1}{\lambda}I\right)^{-1} k_l\) (21.16)


    where \(k_l\) is a vector in which its elements are equal to the elements of \(k_{l,i}
    = H_l^T H_l\), \(i = 1, ..., N\).'
