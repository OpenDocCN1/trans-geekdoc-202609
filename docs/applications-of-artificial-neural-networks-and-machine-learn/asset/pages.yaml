- pgno: 230
  md: 'method. Zang and Imregun [12] employed measured frequency response functions
    (FRFs) as input data to artificial neural networks, for structural damage detection.
    They applied the methodology to the measured FRFs of a railway wheel. Harpula
    and Ziemianski [13] applied neural networks for damage detection in bar structures
    based on changes of dynamic characteristics of an 8-storey steel structure model.
    They simulated crack damage by changes of stiffness of columns.


    In this research the damage index defined by Park and Ang [14] is used in order
    to assess the seismic damage of reinforced concrete structures quantitatively.
    Then the collection of calculated damage indices, obtained from nonlinear dynamic
    analyses, is used for training the required neural networks for predicting structural
    damages.


    # 11.2 Nonlinear Dynamic Analysis and Damage Assessment


    In order to estimate the seismic damage of the structures quantitatively, an appropriate
    damage assessment method is needed. For this purpose, several damage indices have
    been presented by researchers. Park and Ang [14] damage index is one of the most
    suitable indices for evaluating the seismic damage of concrete structures. This
    index is defined as follows:


    D.I. PA = \frac{\delta_m}{\delta_u} + \frac{\beta}{\delta_u F_y} \int dE (11.1)


    In the above equation:


    +   - D.I. PA Park and Ang Damage Index

    +   - \delta_m Maximum deformation of structure during an earthquake

    +   - \delta_u Ultimate deformation capacity of structure under monotonic loading

    +   - \beta Dimensionless strength reduction parameter

    +   - \int dE Hysteretic energy absorbed by structure during response history


    Park and Ang damage index is calibrated as follow:


    +   - 0 \le D.I. PA < 0.4 Represents repairable damage

    +   - 0.4 \le D.I. PA < 1.0 Represents damage beyond repair

    +   - 1.0 \le D.I. PA Represents total collapse of structure.


    In order to perform dynamic analyses, IDARC program is employed. This program
    is capable of calculating the Park and Ang damage index for structures. Park and
    Ang damage index can be obtained either for a structural element (local damage
    index), or for the entire structure (global damage index). In this research, the
    global damage indices are calculated for the structures. For this purpose, 24
    planar reinforced concrete structures are designed according to the Iran building
    codes, standard No. 2800, Ref. [15]. These structures are dynamically analyzed
    subjected to different scaled level of six earthquake records, introduced in Table
    11.1. Tabas, Manjil, Naqan and Bam are of Iran''s famous earthquakes, and El Centro
    and Taft are of important'
  merge: -1
  img_proc: true
- pgno: 231
  md: '**Table 11.1 Characteristics of the earthquake records**


    | Earthquake | Date | p.g.a | Main frequency (Hz) |

    | :--- | :--- | :--- | :--- |

    | Tabas | 09/16/1978 | 0.93 | 2.42 |

    | Manjil | 06/20/1990 | 0.514 | 2.94 |

    | Naqan | 04/06/1977 | 0.714 | 3.293 |

    | Bam | 12/26/2003 | 0.793 | 5.54 |

    | El Centro | 05/18/1940 | 0.348 | 2.56 |

    | Taft | 07/21/1952 | 0.179 | 4.81 |


    earthquakes occurred in west of United State of America. In this research, each
    record is scaled to 10, 20, 30, 40, 50, and 60% of ground gravity acceleration
    (g) and damage index is calculated for the structures subjected to each of those
    scaled records, using nonlinear dynamic analysis.


    Since in each earthquake damage depends on the dynamic characteristics of the
    earthquake, each record is identified by two important characters, namely p.g.a.
    and the main frequency. Main frequency of an earthquake is defined as the frequency
    which transfers the most energy of the earthquake. In order to calculate the main
    frequency, the frequency content of the earthquake should be computed by Fourier
    transform. The procedure is performed by transferring the ground motion from time
    domain into the frequency domain. Finite Fourier Transform of an accelerogram
    $a(t)$ is defined as [16]:


    ```

    $F(\omega) = \int_{0}^{T} a(t) e^{-i\omega t} dt, \quad i = \sqrt{-1}$ (11.2)

    ```


    where $T$ is the duration of the record. Fourier amplitude spectrum $FS(\omega)$
    is defined as square route of the sum of the squares of real and imaginary parts
    of $F(\omega)$, as it is shown below:


    ```

    $FS(\omega) = \sqrt{\left[\int_{0}^{T} a(t) \sin \omega t dt\right]^2 + \left[\int_{0}^{T}
    a(t) \cos \omega t dt\right]^2}$ (11.3)

    ```


    Based on the above-mentioned theory, the main frequencies of the earthquake records
    are calculated. Table 11.1 shows the earthquake records and their p.g.a and the
    calculated main frequency.'
