    In the fifth section, a numerical problem is presented, and in the last section,
    a conclusion is presented.


    # ## 3.2 A Brief Explanation of the EVPS and SA-EVPS Algorithms


    The EVPS algorithm, which is an improved version of the VPS algorithm, is widely
    used in optimizing structural engineering problems. While the EVPS algorithm uses
    eight variables that are experimentally determined, these parameters are considered
    specific values by default and are responsible for controlling search accuracy,
    exploration and exploit phases, convergence speed, as well as overall algorithm
    behavior. Thus, in the SA-EVPS algorithm, all of these parameters have a significant
    impact and all eight parameters mentioned above are also optimized before the
    main optimization is performed. In the SA-EVPS algorithm, all eight parameters
    are first optimized using the EVPS algorithm, and then the main optimization is
    performed. The flowchart of the SA-EVPS algorithm is presented in Fig. 3.1 in
    order to provide greater clarity.'
