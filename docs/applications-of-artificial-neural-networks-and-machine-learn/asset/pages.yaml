- pgno: 353
  md: '# 18.3.2 Model Development Using GMDH Network


    To develop new models for predicting shear strength capacity of both FRP-reinforced
    members with and without stirrups using GMDH algorithm, the available datasets
    are randomly divided into training and testing subsets. The training data are
    taken for the learning of the algorithm. Furthermore, in the training process,
    10-fold cross validation technique is employed to avoid the overfitting problem.
    The testing datasets are used to specify the generalization capability of the
    models to a set of new data they did not train with. In the other words, the testing
    data are employed to measure the performance of the models obtained by GMDH algorithm
    when applied to dataset which played no role in building the models. Out of the
    112 data for FRP-reinforced members with stirrups, 90 data vectors (80%) are taken
    for the training process. The remaining 22 data (20%) were used for the testing
    of the models. For FRP-reinforced members without stirrups, 140 data vectors are
    used to train the algorithm and the remaining 35 data are used to validate the
    developed model.


    Following data division, they are presented to the GMDH for model training. The
    GMDH returns the following selective polynomials for prediction of shear strength
    of members with stirrups as follows:


    ```

    Layer 1:


    L₁ = −48.47 + 28.34ρₜ − 22.95ρ + 0.3775d + 79.35ρₜρ + 0.3114dρₜ

    + 0.246ρd − 69.95ρₜ² − 17.44ρ² − 0.0002389d²      (18.6a)

    ```


    ```

    Layer 2:


    L₂ = 177.4 − 0.2786L₁ − 148.6(a/d) + 1.218b + 0.04975(a/d)L₁ + 0.00254bL₁

    + 0.1112b(a/d) + 0.0001706L₁² + 16.12(a/d)² − 0.003011b²      (18.6b)

    ```


    ```

    Layer 3:


    L₃ = 65.87 + 0.3055L₂ − 0.5387Eₜ − 1.956f_c + 0.002405Eₜ + 0.01221L₂f_c

    + 0.009724f_cEₜ + 0.0003764L₂² + 0.0005084Eₜ² + 0.01084f_c²      (18.6c)

    ```


    ```

    Layer 4:


    V (KN) = −35.77 + 1.326L₃ − 113.8ρₜ + 0.3711Eᵣ + 0.06931ρₜL₃

    − 0.002938EᵣL₃ + 1.989Eᵣρₜ − 0.0004145L₃²

    − 10.83ρₜ² − 0.001098Eᵣ²      (18.6d)

    ```'
