    Root Mean Square Error (RMSE), Mean Absolute Error (MAE), Mean Absolute Percentage
    Error (MAPE), Normalized Mean Absolute Error (NMAE), Normalized Root Mean Square
    Error (NRMSE), correlation coefficient (R) were used to evaluate and compare the
    models. The following equations show the formulation of these criteria:


    ```

    $$ RMSE = \sqrt{\sum_{i=1}^{N} (z_0 - z_p)^2 / N} $$ (9.3)

    ```'
