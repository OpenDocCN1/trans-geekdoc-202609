    The mathematical equation between the normalized input parameters (D, H, fco,
    Ef , ff , tf ) and the normalized output (fcc) is presented as follows:


    ```

    f_cc = Tangent Sigmoid

    \times \left\{ b_0 + \sum_{k=1}^n \left[ Tangent Sigmoid \times LW \left( b_{1k}
    + \sum_{i=1}^m (IW_{ik} Z_i) \right) \right] \right\} (19.10)

    ```


    fcc represents the normalized FRP strength, “Tangent Sigmoid” is the activation
    function, n indicates hidden layer neuron numbers, Zi indicates the normalized
    values of network input, m is the number of the input variables, IWik indicates
    the linking weights between the ith input and kth neuron in the hidden layer,
    LW is the link weight between the kth neuron in the hidden layer and the independent
    output neuron, b1k shows the bias in the kth neuron of the hidden layer and b0
    is the bias value in the output layer bond strength relation between the FRP composite
    and the concrete can be as follows.'
