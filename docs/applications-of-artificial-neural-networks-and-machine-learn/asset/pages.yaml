- pgno: 122
  md: 'Function Neural Networks (RBF) are universal approximators and a particular
    type of feedforward neural networks with radial basis functions employed as activation
    functions. RBF neural networks are commonly implemented for regression, classification,
    pattern recognition, and time series forecasting problems. Besides their great
    global approximation capability, RBFs benefit from other powerful features such
    as the compact structure, being able to approximate any continuous network, and
    their tolerance to noise. Similarly, to any other neural networks, a fundamental
    element in the performance of RBF is the learning procedure. The aspiration of
    this process is to tune the parameters of the neural network so as to minimize
    some error criterion. An RBF neural network with a typical topology of a single
    hidden layer has three principal parameters including the connection weights,
    widths, and centers. The conventional approach for training an RBF is to utilize
    two sequential stages training process. In the first stage, the centers of the
    hidden layer and the widths are obtained by taking the advantage of some unsupervised
    clustering algorithm such as k-means [1], vector quantization, or decision trees.
    In the second stage, the connection weights between the hidden layer and the output
    layer are set. Habitually, these weights are determined linearly by applying the
    simple linear least squares (LS), the orthogonal least squares (OLS) algorithms,
    or a gradient descent algorithm.


    An RBF network in its simplest configuration is a three-layer feedforward neural
    network whose first layer corresponds to the inputs of the network, its second
    is a hidden layer consisting of several RBF nonlinear activation units, and the
    last one correlates to the final output of the network. Activation functions in
    RBF neural networks are conventionally implemented as Gaussian functions. Figure
    5.8 displays an illustration of the RBF topology.


    To demonstrate the working flow of the RBF, a set of data $D$ having $N$ patterns
    of $(x_p, y_p)$ is supposed where $x_p$ is the input of the data set, and $y_p$
    is the actual output. The output of the $i$-th activation function $\phi_i$ in
    the hidden layer of the network can be computed applying Eq. (5.11) based on the
    distance between the input pattern $x$ and the center $i$.


