    # 6.5.3.2 RBF Network


    In this net the number of nodes in the input layer is three and output consists
    of one node. The results of training for 35 different topologies are illustrated
    in Table 6.5. The network dsr3205t with 320 nodes in the prototype layer and 5
    nodes in the second hidden layer performed the best among the considered topologies.
    Using tanh as the transfer function, the correlation factors approached to 0.9936
    and 0.9887 for training and testing, respectively. For this topology, the RMS
    approached to 0.001. For all these nets 100,000 cycles of trainings are performed.'
