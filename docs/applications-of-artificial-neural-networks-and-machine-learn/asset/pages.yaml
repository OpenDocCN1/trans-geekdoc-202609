  md: '# 9.6 Discussion


    The training of the connection weights of the network neurons was done using backpropagation
    combined with the ECBO algorithm using MATLAB software.


    The trial and error method was used to obtain the number of suitable hidden neurons
    and the optimal artificial neural network. The number of hidden layer neurons
    in this study is considered 3–12.


    Conventional statistical error and performance measures, such as mean squared
    error (MSE), correlation coefficient (R) and mean absolute percentage error (MAPE),
    are used to select the best configuration. Based on this, the evaluation index
    (R, MSE, MAPE) is determined for each model and the results are ranked based on
    the merit of the responses. Finally, the sum of the ranks assigned to each of
    the proposed patterns is evaluated and the best network configuration is selected.


    The ranking results of artificial neural network in band strength estimation are
    shown in Table 9.5.


    The obtained results from the hybrid ECBO-ANN for training and testing phases
    are evaluated according to Eqs. (9.3)–(9.9), which are common criteria for evaluating
    the error and model performance, including the Mean Square Error (MSE), Root Mean
    Square Error (RMSE), Mean Absolute Error (MAE), Mean Absolute Percentage Error
    (MAPE), Normalized Mean Absolute Error (NMAE), Normalized Root Mean Square Error
    (NRMSE), correlation coefficient (R). It must be noted that for providing a clear
    comparison between models'' error values, these criteria are evaluated using the
    real target values that are converted from normalized data Detailed results are
    presented in Table 9.6 for the developed model with different neuron values for
    the hidden layer.


    The comparison between the measured and predicted values obtained from the ECBO-ANN
    model with different numbers of neurons in the training stages is presented in
    Fig. 9.5. The ideal fit is a diagonal line that shows the maximum fit and fit
    of the models and occurs when the correlation coefficient (R) is equal to unity.


    The accuracy of the proposed model in training, testing and validation is shown
    in Fig. 9.6.


    The purpose of ECBO algorithm is to find suitable weights and optimize them in
    the search environment. To achieve this goal, different types of ECBO-ANN patterns
    with different numbers of CBs were formed in relation to the proposed artificial
    neural network structure with 7 neurons in the hidden layer. Based on this, increasing
    the number of CBs is repeated until the minimum error is achieved, and other parameters
    related to the internal adjustment of the algorithm related to the search space
    were determined by trial and error. Figure 9.7 shows the evolution of MSE in ECBO-ANN
    with different CBs from 10 to 1000 for 600 iterations.


    As shown in Fig. 9.8, the mean squared error value when we consider the number
    of neurons to be 7 is the lowest value that the hybrid neural network is in its
    optimal state.'
