    # 21.4.4 Developed Models


    To develop new models for predicting shear bond strength between FRP sheets and
    concrete substrate using KELM, ANN, and ANFIS algorithms, the available database
    were randomly divided into training and testing subsets. The training data were
    taken for the learning of the algorithm. The testing dataset was used to specify
    the generalization capability of the models to new data they did not train with.
    In other words, the testing data were applied to measure the performance of the
    models obtained by KELM, ANN, and ANFIS algorithms when applied to dataset which
    played no role in building the models. Of the 342 tests, 273 data vectors (80%)
    were taken for the training process. The remaining 69 data vectors (20%) were
    used for testing of the models.'
