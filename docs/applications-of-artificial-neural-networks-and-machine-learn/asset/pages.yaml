    # 16.5 Concluding Remarks


    The following conclusions can be made:


    +   1. It is possible to estimate the vulnerability of concrete MRF building structures
    using Artificial Neural Networks.


    +   2. Although for earthquake records with small peak ground accelerations (PGA),
    the structural models remain within the elastic range without dissipating any
    hysteretic energy, but the computed damage index still becomes non-zero due to
    resulting elastic deformation.


    +   3. Application of one hidden layer in training the networks for estimation
    of seismic vulnerability of structures is sufficient.


    +   4. Using hyperbolic tangent activation function, slightly better prediction
    of damage index was obtained than sigmoid function.


    +   5. No substantial improvement was obtained using two hidden layers in training
    the networks with larger training time.


    +   6. No considerable improvement was obtained by increasing the neurons in the
    second hidden layer of the networks.'
