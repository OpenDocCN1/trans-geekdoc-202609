  img_proc: true
- pgno: 401
  md: '# 20.3 Methodology


    In the present study, the distinct features of the M5′ and MARS algorithms are
    employed to investigate the shear behavior of FRP EBR systems. The details of
    algorithms are presented as follows.


    # 20.3.1 M5′ Algorithm


    M5′ algorithm is an efficient technique for analyzing complex systems with very
    high dimensionality-up to hundreds of attributes. Quinlan [32] presented the M5
    algorithm to solve regression and classification problems. Latter, Wang and Witten
    [33] improved the M5 algorithm to so-called M5′ algorithm. The M5′ algorithm divides
    a complex problem into a number of simple sub-problems and provides the response
    as a combination of the solutions of these sub-problems. The M5′ algorithm generally
    includes three processes: (i) building the initial tree; (ii) pruning the tree;
    and (iii) smoothing. Initial tree is constructed by dividing data space into smaller
    subspaces based on divide and conquer method [36]. For more illustration, the
    structure of a derived decision tree with two input parameters based on the method
    of dividing the sample space is depicted in Fig. 20.2.


    As shown in Fig. 20.2a, there are some splitting values that divide the whole
    data sets to several subsets. These splitting values are selected from input variables
    that maximize the expected error reduction at each node. The standard deviation
    reduction, SDR, is calculated as a measure of the error at each node as follows:


    ```

    SDR = sd(T) - \(\sum_i \frac{|T_i|}{|T|} \times sd(T_i)\) \quad (20.5)

    ```


    where T is the set of records that reach the node, T_i is the resulted set from
    splitting the node according to the selected attribute, and sd is the standard
    variation. The splitting procedure ceases when the class values of all instances
    that reach a node vary by less than 5% of the standard deviation of the original
    instance set, or when only a few instances remain. After building the tree, a
    multivariate linear regression is created at the bottommost subspace. An over-fitting
    problem may occur during constructing the model tree and increasing its prediction
    accuracy for training set. In order to avoid or reduce this problem, pruning procedure
    can be used. This procedure uses an estimate of the expected error that will be
    experienced at each node for the test data. First, the absolute difference between
    the predicted value and the actual output value is averaged for each of the training
    instances that reached that node. Because the tree has been built exclusively
    for this dataset, the average value might underestimate the expected error for
    a new dataset. To compensate this problem, the output value is multiplied by the
    factor (n + v)/(n - v), where n is the number of training instances that reach
    the node and v is the number of attributes in the model'
