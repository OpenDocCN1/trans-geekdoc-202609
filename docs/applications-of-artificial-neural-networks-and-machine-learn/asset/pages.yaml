    where \( O_i \) is the measured value, \( P_i \) stands for prediction values;
    \( N \) is the number of data points, \( O_m \) is the mean value for observation
    and \( P_m \) is the mean value of prediction. The correlation coefficient (\(
    R \)) is a measure of the relative correlation between the predicted and measured
    values. The \( R \) values ranged between \( -1 \) and \( 1 \). If the \( R \)
    value is close to \( 1 \), it indicates that there is direct linear relationship
    between measured and predicted values. However, \( R \) does not necessarily indicate
    the goodness of the model performance, particularly when data range is very wide
    and the data points distributed about their mean. Therefore, the coefficient of
    determination, \( R^2 \), can be used as an unbiased estimate and can be a better
    measure for evaluating model performance. The \( MAE \) and \( RMSE \) measure
    the difference between predicted and measured values and values near to zero indicate
    a close match.


    # 22.5 Results and Discussion


    The results of developed models and the most common design equations for prediction
    of shear strength of HSC slender beams without web reinforcement are compared
    in this section. Moreover, the influences of important parameters on shear strength
    have been investigated through parametric and sensitivity analyses. The most important
    predictive parameters were determined through sensitivity analysis in prediction
    of shear strength. Finally, safety analysis was done by using demerit point''s
    classifications of Collins.


    # 22.5.1 Performance Analysis


    The number of data used to develop a new predictor model based on machine learning
    approaches plays a crucial role in modeling process. For developing a reliable
    model based on data mining approaches, Frank and Todeschini [37] suggested that
    the minimum ratio between the number of data used and the number of involved variables
    should be 3. A safer value of 5 can be more conservative. In the present study,
    this ratio is remarkably more and is equal to 250/6 = 41.66. The performances
    of developed MARS and GMDH models shown in Fig. 22.2a, b demonstrate that there
    are a little scatter around optimal line between measured and predicted shear
    strength by developed models for both training and testing data sets. For further
    verification of developed models, analytical analysis of statistical error parameters
    for training and testing data sets are presented in Table 22.4. Also the results
    of the developed MNLR method in this study were compared with those of the other
    proposed ones.'
