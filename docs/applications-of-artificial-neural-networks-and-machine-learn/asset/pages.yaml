    # # 12.4 Metaheuristic Optimization Technique


    # ## 12.4.1 Genetic Algorithm


    Among the metaheuristic algorithms, Genetic algorithm (GA) is a well-known algorithm,
    which is inspired from biological evolution process. A genetic algorithm is a
    computational model of biological evolution. Genetic algorithms are useful both
    as search methods for solving problems and for modeling evolutionary systems.
    GA mimics the Darwinian theory of survival of fittest in nature, and it was proposed
    by Holland [7]. The basic elements of GA are chromosome representation, fitness
    selection, and biological-inspired operators. Holland also introduced a novel
    element namely, Inversion that is generally used in implementations of GA [8].
    Typically, the chromosomes take the binary string format. In chromosomes, each
    locus (specific position on chromosome) has two possible alleles (variant forms
    of genes)—0 and 1. Chromosomes are considered as points in the solution space.
    These are processed using genetic operators by iteratively replacing its population.
    The fitness function is used to assign a value for all the chromosomes in the
    population. The biological-inspired operators are selection, mutation, and crossover.
    In selection, the chromosomes are selected on the basis of its fitness value for
    further processing. In crossover operator, a random locus is chosen and it changes
    the subsequences between chromosomes to create off-springs. In mutation, some
    bits of the chromosomes will be randomly flipped on the basis of probability.


    # ## 12.4.2 Particle Swarm Optimization


    Particle swarm optimization (PSO) was developed by Eberhart and Kennedy [9]. In
    this algorithm, initialization is done randomly. The members of this population
    are called particles and each particle is assigned an initial velocity [9]. PSO
    mimics the swarming behavior of insects, fish, and birds, where these swarms search
    for food jointly. The theoretical framework of PSO is simple. It can be coded
    and implemented efficiently and is computationally inexpensive in terms of memory
    and CPU time required. In PSO, a swarm member called a particle is a potential
    solution, a point of the search space. The global balance is known as the food
    situation. The particle has fitness and speed values to change its flight path
    to the best swarm experiences to find the global optimum in the D-dimensional
    solution space. Today, PSO has attracted'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'considerable attention and has been successfully used in various fields, especially
    for unconstrained continuous optimization problems [10].


    # ## 12.4.3 Colliding Bodies Optimization


    As a developed type of meta-heuristic algorithm, colliding bodies optimization
    (CBO) is introduced and applied to structural problems by Kaveh and Mahdavi. The
    CBO is multi-agent algorithm inspired by a collision between two objects in one-dimension.
    Each agent is modeled as a body with a specified mass and velocity. A collision
    occurs between pairs of objects and the new positions of the colliding bodies
    are updated based on the collision laws [11, 12].


    # ## 12.4.4 Enhanced Colliding Bodies Optimization


    The enhanced colliding bodies optimization (ECBO) is introduced by the authors
    [13] and it uses memory to save some historically best solution to improve the
    CBO performance without increasing the computational cost. In this method, some
    components of agents are also changed to jump out from local minimum.


    # ## 12.5 Quality Assessment Criteria


    In this study, several quality evaluation criteria such as mean absolute error
    (MAE), root mean square error (RMSE) and correlation coefficient (R) were used
    to evaluate and compare the models. The following equations show the formulation
    of these criteria:


    ```

    $RMSE = \sqrt{\sum_{i=1}^{N} (z_0 - z_p)^2 / N}$ (12.2)

    ```


    ```

    $R = \sqrt{1 - \frac{\sum_{i=1}^{N} (z_0 - z_p)^2}{\sum_{i=1}^{N} (z_0 - \bar{z_i})^2}}$
    (12.3)

    ```


    ```

    $MSE = \frac{1}{N} \sum_{i=1}^{N} |z_0 - z_p|$ (12.4)

    ```


    where $z_0$ and $z_p$ are actual measured values and corresponding model values,
    $z_i$ are the average values of the evading index, and $N$ is the total number
    of input data. The correlation coefficient ($R$) is valued from $[-1, 1]$. The
    absolute value of $R$ close to 1 means a successful prediction.'
