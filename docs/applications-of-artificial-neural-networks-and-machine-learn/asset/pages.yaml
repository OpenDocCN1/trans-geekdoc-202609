    \(y(z) = b(z) = -sz + sz^2 / (2\beta h)\) (10.1)


    As shown in Fig. 10.1a, \(h\) and \(s\) are the height of the dam and the slope
    at crest, respectively. The point where the slope of the upstream face equals
    to zero is \(z = \beta h\) in which \(0 < \beta \leq 1\) is a constant.


    By dividing the height of the dam into \(n\) segments containing \(n + 1\) levels,
    the thickness of the central vertical section can be expressed as:


    \(t_c(z) = \sum_{i=1}^{n+1} L_i(z)t_{c_i}\) (10.2)


    in which \(t_{c_i}\) is the thickness of the central vertical section at the \(i\)th
    level. Also, in the above relation \(L_i(z)\) is a Lagrange interpolation function
    associated with the \(i\)th level and can be defined as:


    \(L_i(z) = \frac{\prod_{k=1}^{n+1} (z - z_k)}{\prod_{k=1}^{n+1} (z_i - z_k)} k
    \neq i\) (10.3)


    where \(z_i\) denotes the \(z\) coordinate of the \(i\)th level in the central
    vertical section.


    # 10.2.2 Shape of the Horizontal Section


    As shown in Fig. 10.1b, for a symmetrical canyon and arch thickening from crown
    to abutment, the shape of the horizontal section of a parabolic arch dam is determined
    by the following two parabolic surfaces [3]:


    At the upstream face of dam:


    \(y_u(x, z) = \frac{1}{2r_u(z)} x^2 + b(z)\) (10.4)'
