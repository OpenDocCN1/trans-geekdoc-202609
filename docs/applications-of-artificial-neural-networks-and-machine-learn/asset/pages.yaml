  md: '# # Chapter 15

    Optimal Design of Transmission Towers

    Using Genetic Algorithm and Neural Networks


    Abstract In this chapter a migration genetic algorithm is used for optimization
    of transmission towers. The energy method is combined with the force method to
    reduce the design unknowns and also to remove the need for the operation corresponding
    to matrix inversion. In towers with small number of elements this algorithm can
    easily be employed, however, for the towers encountered in practice which contain
    many elements, this reduces the speed of the computation. In order to overcome
    this difficulty neural networks are trained to take part of the computational
    load as an analyzer.


    # ## 15.1 Introduction


    This chapter is based on optimal design of transmission towers using genetic algorithm
    and neural networks developed by Kaveh et al. [1]. Transmission towers are the
    most important part of systems for transferring the electrical power and its distribution.
    These structures are designed to support the conductors and ground wires of electrical
    power lines. A linear analysis is generally sufficient for the analysis of a transmission
    tower. In these structures, the secondary or P-Δ effects are not expected to exceed
    a few percent of the primary load effects.


    Transmission structures can be classified in many different ways. One classification,
    based on the insulator type is as follows:


    A suspension structure supports the conductors with suspension insulators. There
    are no longitudinal loads if the cables are in an intact condition.


    A strain structure is where the conductors are attached to the structure with
    strain insulators, i.e., the conductors are dead ended on the structure. Unlike
    true dead-ends, these structures are designed to support intact, basically equal,
    longitudinal cable tensions on both sides of the structure.


    Additional nomenclature is often used to describe the location of the structure
    in the line. Tangent structures are used where the line is straight. At these
    locations the structures are not affected by cable tensions. A tangent suspension
    or tangent strain structure basically supports vertical loads and transverse wind
    loads proportional to'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'the lengths of the spans on either side of the structure. In addition to vertical
    and transverse loads, a tangent dead-end is subjected to significant longitudinal
    load. Angle structures are used at line angles. In addition to the loads supported
    by a comparable tangent structure, an angle structures is subjected to significant
    transverse load from the ground wire and conductor mechanical tensions.


    In this chapter a genetic algorithm is utilized for optimization of transmission
    towers. The energy method is combined with the force method to reduce the design
    unknowns and also to remove the need for the operation corresponding to matrix
    inversion. In transmission towers with small number of elements this algorithm
    is easily employed, however, for the towers encountered in practice which contain
    many elements, this reduces the speed of the computation. In order to overcome
    this difficulty neural networks are trained to take part of the computational
    load as an analyzer. Examples are provided to illustrate the important role of
    the neural networks in reducing the computational time.


    # 15.2 Loads and Design


    The ultimate strength design philosophy is used for transmission structures. Therefore,
    all the strength design equations for transmission structure components refer
    to conditions near failure in yielding or buckling.


    Design loads and load factors typically considered for transmission structures
    include legislated loads, additional climatic loads, security loads and construction
    and maintenance loads. Reference [1] provides a detailed discussion of available
    methods for selecting loads.


    Legislated loads are those specified by state or local authorities [2]. The NESC
    (National Electric Standard Committee) specifies two load cases, a district load
    case with load factors ranging from 1.5 to 4 (depending on direction of load and
    material type), and an extreme wind case with a minimum load factor of 1. The
    combination of wind, ice and temperature of the district load case depends on
    the line location. The wind velocity of the extreme wind case is selected from
    a contour map of 50-year return period winds. The magnitude of the loads and load
    factors specified by the NESC are based on experience, and it is good practice
    to consider additional climatic load case to control the reliability of a line
    [1, 3].


    Combinations of extreme wind, wind and ice, or extreme ice alone with the coincident
    temperatures are also considered with the appropriate load factors. Other loads
    consist of Security loads, Construction/Maintenance loads, Galloping and Vibration.


    Steel latticed towers for alternating-current electrical systems are normally
    designed to carry one or two circuits. Where right-of-way is restricted, three
    or more circuits can be used. Each circuit consists of three electrical phases.
    For line over 100 miles long, direct current systems are also used. Structures
    for these systems support two phases. In all areas except those that have no incidence
    of lightning, the line must be shielded by ground wires.'
