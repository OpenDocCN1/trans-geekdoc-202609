  img_proc: true
- pgno: 283
  md: 'In Eq. (14.6) if W1 = 1 and W2 = 0, then the King''s algorithm is obtained,
    with no need to select the start and end nodes.


    # 14.5 A Hybrid Graph-Neural-Genetic Method


    In this chapter a neural network is trained for optimal nodal ordering of graphs.
    In this approach ideas from neural networks and priority function are combined
    for evaluating suitable coefficients for the vectors of the priority function.
    Genetic algorithm is used for evaluation of the weights of the networks.


    In Sloan''s method, the priority function is a linear function of two graph parameters
    as in Eq. (14.6), and the coefficients specify the importance of each parameter.
    Following experimentations, Sloan''s recommends the pair (W1 = 1 and W2 = 2) for
    the coefficients. However, the results of other researcher [6] indicate that,
    for some problems there are considerable advantages in using other values.


    # 14.5.1 A Priority Function Using Ritz Vectors


    The priority function in Sloan''s method is generalized by considering additional
    vectors known as vectors of the graph parameters.


    ```

    $\overline{\phi} = \sum_{i=1}^{p} w_i v_i, \qquad \text{(14.8)}$

    ```


    where $\overline{\phi}$ is the priority function, v$_i$ (i = 1, ..., p) are the
    normalized Ritz vectors representing the graph parameters, and w$_i$ (i = 1, ...,
    p) are the coefficients of the Ritz vectors (Ritz coordinates) which are unknowns,
    and p is the number of parameters being employed. In this chapter we set p = 5
    and v$_1$-v$_5$ vectors are selected as:


    +   v$_1$ contains the degrees of the nodes,

    +   v$_2$ comprises of the 1-weighted degrees of the nodes, and

    +   v$_3$ and v$_4$ are distances of the nodes from two pseudo-peripheral nodes,
    and

    +   v$_5$ contains the 2-weighted degrees of the nodes of the graph.


    The k-weighted degree of a node n$_i$, is defined as the sum of the degrees of
    all nodes in a distance k from n$_i$. Here k = 1 and 2 are used, however, higher
    values of k may also be included.'
  merge: -1
  img_proc: true
