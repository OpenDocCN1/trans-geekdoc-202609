  md: 'data sets. A set of synthetic data for the single parameter is generated by
    increasing it incrementally. These inputs are presented to the prediction equation
    and the shear strength is calculated. This procedure is repeated using another
    variable until the model response is tested for all input variables.


    The results of the parametric analysis and also the used experimental data are
    shown in Fig. 22.4. It can be seen that the prediction behavior of concrete shear
    strength from the GMDH and MARS models agrees well with the experimental results.
    Figure 22.4a presents the variations of concrete shear strength as a function
    of effective depth ($d$). As shown, the failure shear stress decreases with the
    increase of effective depth. This behavior is well documented in the literature
    for RC slender beams without web reinforcement. There are two common approaches
    and hypotheses to explain this behavior: One of these approaches highlights the
    role of aggregate interlock which is reduced in larger members due to the development
    of wider cracks. The other common approach is based on fracture mechanic concepts
    indicating that larger members release more energy and consequently wider cracks
    would happen.


    The variations of predicted shear strength by GMDH and MARS models with $a|d$
    ratio are shown in Fig. 22.4b. As expected, the shear strength of RC beams decreases


