    The internal structure of the node includes various components as follows:


    **Node input**: In the first layer of the neural network, the input nodes are
    in the form of numerical vectors with the same length. The input of the nodes
    in the hidden layers and the output layers are the output values obtained from
    their previous layers.


    **Node input weights**: The weights determine the importance of node inputs. In
    other words, by applying the internal multiplication of the input value of the
