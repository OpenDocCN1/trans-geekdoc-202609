  md: '# ## 21.4 Model Development


    # ### 21.4.1 Database


    To drive a reliable model for estimation of bond strength between EBR FRP composites
    and concrete substrates, a comprehensive database of laboratory testing from Chajes
    et al. [4], Maeda et al. [5], Täljsten [43], Ueda et al. [44], Zhao et al. [45],
    Adhikary and Mutusyoshi [14], Fu-quan et al. [46], Nakaba et al. [47], Wu et al.
    [48], Tan [49], Ren [50], Dai et al. [18], Yao et al. [51], Sharma et al. [52],
    Toutanji et al. [53] and Ueno et al. [54] including 342 sub assemblages are collected
    from published literature as presented in Table 21.2.


    # ### 21.4.2 Influential Parameters


    Pervious experimental and theoretical studies have shown that different influential
    parameters can impact on the maximum bond strength between EBR FRP and concrete
    substrates. According to [19], the following six parameters is well-known to be
    the most effective parameters in estimation of bond strength between FRP and concrete
    substrate: (a) the concrete strength, (b) the bond length, (c) the FRP plate axial
    stiffness, (d) the FRP-to-concrete width ratio, (e) the adhesive stiffness, and
    (f) the adhesive strength. To consider the effect of mentioned parameters or mechanisms
    in this study, the bond strength between FRP and concrete substrate was considered
    to be a function of the following parameters:


    $P_{max} = f(t_p, b_p, E_p, f''_c, t_c, b_c, L, E_a, t_a)$ (21.22)


    where $P_{max}$ is ultimate load or bond strength, $b_p$ is the width of FRP plate,
    $E_p$ is elastic modulus of FRP, $f''_c$ is the concrete cylinder compressive
    strength, $t_c$ is the effective thickness of concrete contributing to shear deformation,
    $b_c$ is the width of concrete prism, $L$ is the bond length, $E_a$ is elastic
    modulus of adhesive, and $t_a$ is the thickness of adhesive layer. The histograms
    of input and output parameters are shown in Fig. 21.3. As shown, the considered
    arrangement in this study covers a wide range of $f''_c$ between 16 and 70 MPa
    and $L$ between 50 and 400 mm. It should be noted that the reliability of developed
    models in predictions of ultimate load are more in the ranges which data points
    are more concentrated.


    # ### 21.4.3 Preprocessing


    To avoid numeric instabilities, all considered input variables are pre-scaled
    into [-1, 1] interval. This action can remove or reduce the influence of numeric
    instabilities on'
