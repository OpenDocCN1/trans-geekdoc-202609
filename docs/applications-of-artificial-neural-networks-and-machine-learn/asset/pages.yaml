- pgno: 193
  md: '# Chapter 9

    Hybrid ECBO-ANN Algorithm for Shear Strength of Partially Grouted Masonry Walls


    **Abstract** In this study, the aim is to develop an artificial neural network
    model by combining the ECBO meta-heuristic algorithm with the artificial neural
    network structure to optimize the feed forward propagation network parameters
    for analyzing the shear strength of PG walls.n this chapter, the optimal number
    of neurons used in the hidden layer and also the optimal number of CBs required
    in the ECBO algorithm were obtained. The mathematical formulation of the optimized
    neural network model with the combination of meta-heuristic algorithm is also
    presented.


    # 9.1 Introduction


    In this chapter a hybrid Enhanced Colliding Bodies Optimization (ECBO)-artificial
    neural network (ANN) algorithm is presented for shear strength of partially grouted
    masonry walls [1]. ANN is a massively parallel computing model that mimics brain
    function. Similar to a biological model consisting of a large number of interconnected
    neurons, an ANN is composed of a large number of similarly connected computational
    elements called artificial neurons. Artificial neural networks have been widely
    used in complex nonlinear function mapping, image processing, pattern recognition
    and classification.


    The common point of meta-heuristic optimization algorithms with artificial neural
    network is that the artificial neural network ends up with an optimization problem
    after designing its structure for training. Here, instead of gradient methods,
    one can use meta-heuristic optimization algorithms to determine the neural network
    weights.


    In recent years, the power of the artificial neural networks has been increased
    by using a combination of different networks and metaheurists. However, the application
    of different types of neural networks is different in each case.


    In our recent research [2], it was found that the combination of ECBO meta-heuristic
    algorithm with feed-forward neural network had the best results compared to other
    combinations. Therefore, in this research, this combination was used to obtain
    the shear strength of the masonry shear wall.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Masonry is the oldest structural material that is still used for a wide variety
    of contemporary buildings. Masonry structures are generally classified as reinforced
    (RM) or unreinforced (URM), and RM is further classified as fully grouted (FG)
    or partially grouted (PG) (i.e., where Grout is placed only in cells containing
    reinforcing steel). Reinforced masonry accounts for about 10% of all low-rise
    construction in the United States. Partially grouted (PG) walls are preferred
    over FG walls due to ease and speed of construction and economy.


    Partially grouted (PG) concrete block shear walls are a common system to resist
    lateral forces in masonry structures. Unlike fully grouted (FG) masonry, PG walls
    are grouted only in locations where reinforcement bars are placed (vertically
    aligned cells with vertical flexural reinforcement and/or horizontal bond beams
    with shear reinforcement) [3, 4].


    The behavior of PG walls under shear loading is not yet well understood. Despite
    fundamental differences in behavior between FG and PG walls, currently available
    design equations are empirically formulated based on FG wall data and applies
    a reduction factor to PG walls to achieve safety levels comparable to FG walls
    [5].


    The shear strength and behavior of PG walls is dependent on variables such as
    the wall geometry, level of axial load (increasing interlocking between masonry
    units in diagonal cracks), ratio of net/gross area, and distribution of horizontal
    (increasing ductility and energy dissipation) and vertical reinforcement (resisting
    shear loading at crack openings) [6, 7].


    This chapter is organized as follows: In Sect. 9.2 an overview of the artificial
    neural networks is provided. Section 9.3 presents the enhanced colliding body
    optimization algorithm (ECBO). In Sect. 9.4, experimental database gathering is
    described. Section 9.5 consists of the quality assessment criteria and Sect. 9.6
    is a discussion on the training. Section 9.7 provides the formulation of the proposed
    ECBO-ANN approach, and finally conclusions are derived in Sect. 9.8.


    # ## 9.2 Overview of Artificial Neural Networks


    Artificial neural networks, which are one of the machine learning tools, are used
    for prediction, learning and classification inspired by the biological nervous
    system. These networks, like the human biological neural network, which is made
    of neurons to process information, are composed of subsets such as neurons. As
    shown in Fig. 9.1, the biological neural network includes various parts, including
    the nerve cell, Axon, dendrite and synapse. Artificial neural networks are artificial
    neurons that are replaced by the main body of the biological nerve cell, and dendrites
    and axons are the data input and output, respectively. Weights in artificial neural
    networks replace synapses in biological neural networks.


    Artificial neural networks can contain one or more hidden layers. In fact, the
    network is a massive parallel system consisting of several elements processed
    by weighted links. Feed Forward and Feed Forward Back Propagation (FFBP) networks
    are the most popular ANNs [8].'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/4048998719320644ee88964326fd7995_195_0.png)


    Typically, a feed-forward backpropagation network such as MLP uses processing
    units that is placed in three types of input, hidden, and output layers. Each
    unit in a layer is connected to units in adjacent layers with an associated weight
    (connection strength). It is the adjustment of these weights that is done during
    network training, because network training involves repeatedly changing the weights
    between neurons until the output signal matches the target output within the desired
    minimum error. When training open feedforward networks, the studied data set is
    usually divided into a training set and a validation set. While the training set
    is used to train the network, the validation set is applied to check the error
    performance of the network. Finally, it is common to reserve a third set of cases
    (the test set) for external prediction to ensure that the results in the training
    and validation set are real and not artifacts of the training process.


    In such feedforward backpropagation networks, connection weights are set to random
    values at the beginning of training. Descriptor values for all parameter sets
    under study are passed through the network (feed forward) and the output responses
    are compared with the target values of the input properties to obtain an error
    value. Then the weights are adjusted for the second pass of the data through the
    network to reduce the amount of error obtained. Since the adjustment of weights
    starts with the correction of the last layer and then continues backward to the
    first layer, this mode is called backpropagation [9]. This entire procedure is
    repeated iteratively to minimize the amount of error. Finally, a regression coefficient
    may be calculated between the observed product properties and the network predicted
    values. In general, feedforward backpropagation networks suffer from two potential
    problems: (a) data overfitting in the presence of too many adjustable weights;
    and (b) overtraining the network if there are too many training cycles. Considering
    these two problems, the number of adjustable weights plays an important role,
    which also affects the'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'predictability of the final network. Finding the optimal network topology to
    achieve a balance between those two extreme situations is an important point in
    network learning [10].


    # 9.3 Enhanced Colliding Body Optimization Algorithm (ECBO)


    Colliding bodies optimization (CBO) is a new meta-heuristic search algorithm that
    in this technique, one object collides with other object and they move towards
    a minimum energy level. The meta-heuristic ECBO algorithm is actually an improvement
    of the CBO algorithm. It uses memory to store a number of historical best CBs
    and also uses a mechanism to escape from local optima [11]. One of the advantages
    of this algorithm is its simplicity, which does not depend on any internal parameters.


    In our recent research [2], it was found that the combination of ECBO meta-heuristic
    algorithm with feed-forward neural network had the best results compared to other
    combinations. Therefore, in this research, this combination was used to obtain
    the shear strength of the masonry shear wall. Figure 9.2 shows the schematic flowchart
    of the combination of neural network and ECBO algorithm.


    In order to determine the structure of the artificial neural network, the feed-forward
    backpropagation model, which has a single input layer and one hidden layer with
    the tan-sigmoid activation function as it is shown in Eq. (9.1), and an output
    layer having linear activation function, is used.


    ![](img/4048998719320644ee88964326fd7995_196_0.png)


    Fig. 9.2 The computation procedure of the ANN-ECBO'
