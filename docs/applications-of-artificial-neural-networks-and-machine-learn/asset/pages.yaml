  md: '# ## 13.3.3 Artificial Neural Networks


    Nowadays, Artificial Neural Networks (ANNs) are utilized widely to simulate complex
    systems such as mechanical, Medical, industrial, and many others. In this computational
    method, the considered variables, have been imported into the system as inputs.
    The labeled results corresponding to each input have been considered as the network
    targets. Therefore, this method is categorized as the supervised machine learning
    method. An activation function tries to simulate a network to convert inputs to
    targets. The results of the activation function and its weights initially are
    not compatible with the targets. Therefore, there is an error between outputs
    (results of the activation function and its weights) and targets should be neglected.
    Hence, an optimization problem is utilized to minimize this simulation error.
    Different activation functions, number of layers, optimization algorithms, and
    other features make different architectures of an ANN.


    # ## 13.4 Proposed Method and Numerical Validations


    As introduced before, the computational cost, either in memory or in time, of
    the conventional methods for plastic analysis is absolutely considerable. Therefore,
    it is vital to propose a new efficient method for this type of problem.


    For this aim, it is proposed in this chapter to employ an ANN to detect the collapse
    mechanism of frames and their corresponding load factor. The procedure is presented
    in the following.


    Firstly, a dataset of the collapse mechanism and its corresponding load factors
    are generated. For this aim, an implemented python code, based on the Hinge-by-Hinge
    method, is used to create and analyze about 3000 portal frames including different
    support conditions, geometry properties, loading conditions, and element connectivity.
    These features are considered as the ANN inputs and the computed collapse mechanism
    and load factors are assumed as its targets.


    Due to the enormous dataset, the optimization procedure of the ANN remains a time-consuming
    problem. For the treatment of this issue, the EFA method has been employed for
    optimization. Finally, the trained ANN can be used to detect the collapse mechanism
    of new frames, in less than 1 s. This efficiency is validated via the following
    numerical examples. There are no specific units for each example. Any consistent
    unit system can be employed for simulation.


