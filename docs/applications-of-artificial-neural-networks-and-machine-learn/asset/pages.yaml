  md: 'The second change in the firefly algorithm that seems to make it more effective
    is to modify the position vector dimension. Each firefly position vector contains
    $N$ variables, where $N$ is the number of decision variables utilized to obtain
    the Euclidean distance between two fireflies. It is proposed that the corresponding
    value of the objective function with each firefly be added to the vector position.
    Therefore, each position vector includes the $N + 1$ variable. This minor enrichment
    on the vector position improves the convergence rate of the algorithm impressively.


    Finally, the last enrichment applied to the basic version of FA is to change from
    the Euclidean to the Mahalanobis distance. Since the deviation from the best cost
    is important, it is essential to consider how each variable indicates similar
    behavior to the best objective. This tendency can be formulated mathematically
    using the covariance matrix.


    In statistics and probability theory, covariance measures how much two random
    variables change together. A positive covariance means that the two variables
    tend to move along, while two variables move inversely if and only if their relative
    covariance is negative. In the case of two jointly distributed real-valued random
    variables, the covariance of X and Y are defined by Eq. (13.13).


    ```

    $cov(X, Y) = E[(X - E(X)), (Y - E(Y))]$ (13.13)

    ```


    where $E(X)$, and $E(Y)$ is the expected values of X and Y, respectively.


    The covariance matrix is a square and symmetric matrix given by Eq. (13.14).


    ```

    $C_{ij} = cov(X_i, X_j), C \in R^d$ (13.14)

    ```


    where $d$ is the number of problem dimensions.


    For example, for two-dimensional problems, it can be written as Eq. (13.15).


    ```

    $C = \begin{bmatrix} cov(X, X) & cov(X, Y) \\ cov(Y, X) & cov(Y, Y) \end{bmatrix}$
    (13.15)

    ```


    where $C$ is the covariance matrix.


    The Mahalanobis distance is a measure of the distance between points or vectors.
    It can be stated that the Mahalanobis distance indicates dissimilarity measured
    between two vectors. The Mahalanobis distance can be formulated as Eq. (13.16).


    ```

    $d(x, y) = \sqrt{(x - y)C^{-1}(x - y)}$ (13.16)

    ```


    where $C$ is the covariance matrix between position vectors x and y. If the covariance
    matrix is identity, then the Mahalanobis distance will be equal to the Euclidean
    distance.


    The results obtained from the mathematical benchmark functions and other structural
    ones indicate that the last enrichment increases the convergence rate of the algorithm
    efficiently.'
