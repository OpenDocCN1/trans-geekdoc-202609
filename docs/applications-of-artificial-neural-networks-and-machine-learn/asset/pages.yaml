  md: 'In the Taguchi method, two groups of factors are considered in the design of
    experiments. First, there are the controllable factors that have certain levels
    in the design and are under control; In the Taguchi method, it is described as
    a signal. Another category is disturbance factors, which affect the reaction of
    a process but cannot be controlled; they are called noise in the Taguchi method.
    Taguchi experiments are designed in a way so that disturbance factors are minimized
    [9, 10].


    In addition, this method has the advantage of determining how each factor contributes
    to the test results. As a result of the ANOVA table for the test data, the decision
    maker has the capability of ranking the factors in order of their importance.
    As a result of this ranking, the decision maker may be persuaded to combine two
    or more controllable factors in order to reduce the costs associated with the
    experimental design. The ANOVA study determines the relative effects of factors
    in different sections.


    # 3.5 Numerical Example


    In this article, first, the compressive strength of five basic designs was determined
    by changing the amount of aggregates of different sizes while keeping the amount
    of water, cement, and additives constant. According to the aggregate size, the
    aggregates were classified into six sizes, so the six factors influencing the
    compressive strength of the samples are the same as the six values of the six
    types of aggregate granulation size. Thus, the design variables and the effectors
    are the same six components. From five basic designs, 81 proposed designs were
    selected using Taguchi method, and all 81 samples were made in the laboratory
    and their compressive strength was determined. As a matter of fact, without the
    Taguchi method, it would be necessary to obtain a large number of samples with
    combinations of 5 basic designs in order to analyze the sensitivity of the effect
    of the six influencing factors mentioned, a process that would be practically
    impossible to determine in the laboratory for their compressive strength. In accordance
    with Taguchi method results, an artificial neural network was trained (with input
    data from the six variables mentioned above) and the results of the ANN were compared
    to the experimental data obtained in the lab, Fig. 3.3.


    With the knowledge of the compressive strength of the samples, proposed by the
    Taguchi method and the training of the artificial neural network, the optimal
    design has been determined by using the EVPS and SA-EVPS metaheuristic algorithms
    from the ANN as the objective function. The optimization process consists of 30
    independent runs with a population size of 20. In the EVPS algorithm, p, w1, w2,
    HMCR, PAR, Neighbor and Memory_size are respectively 0.05, 0.2, 0.3, 0.3, 0.95,
    0.1, 0.1, and 4. The SA-EVPS algorithm parameters that are self-adaptive are shown
    in Table 3.1. Figure 3.4 illustrates the convergence curves for EVPS and SA-EVPS.
    As shown in Fig. 3.4, the objective function is equal to the inverse of the compressive
    strength derived from the ANN.'
