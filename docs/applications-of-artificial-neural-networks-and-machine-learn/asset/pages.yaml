  md: '# Chapter 11 Estimation of the Vulnerability of the Concrete Structures Using
    Artificial Neural Networks


    **Abstract** In this study, the aim is to use the combination of meta-heuristic
    algorithm with two different types of artificial neural network structure to optimize
    the parameters of the feed forward backpropagation and radial basis function networks.
    In this chapter, Particle swarm optimization (PSO), Genetic algorithm (GA), Colliding
    bodies optimization (CBO), Enhanced colliding bodies optimization (ECBO) algorithms
    are used to combine with ANNs.


    # 11.1 Introduction


    This chapter is based on the research by Kaveh and Khavaninzadeh [1]. Damages
    in concrete structures are generally induced by different factors such as improper
    construction management and maintenance, overloading, corrosive environment and
    earthquake loads. Among these factors, earthquake needs special attention since
    it is the most destructive factor and its destruction mechanism is of different
    type, because it can impose extra damage to structures within few seconds. Many
    researchers have applied different methods for damage detection based on dynamic
    characteristics of structures. Rytter [2] distinguishes four levels of damage
    identification: level 1. (Detection) the method gives a qualitative indication
    that damage might be present in the structure; level 2. (Localization) the method
    also gives information about the probable position of the damage; level 3. (Assessment)
    the method gives an estimate of the extent of the damage; level 4. (Consequence)
    the method offers information about the safety of the structure, e.g., estimate
    a residual life. Doebling and Farrar [3] classified the structural damages in
    two categories: linear and nonlinear. Linear damage indicates that a structure
    with linear elastic behavior keeps its linear-elastic behavior after the damage.
    In this type of damage, changes in characteristics of the structure can be defined
    based on the geometrical and mechanical specifications of the structure. Nonlinear
    damage indicates that a structure with linear elastic behavior, shows nonlinear
    behavior after the damage. Marvala and Hunt [4] presented a committee of neural
    networks technique, which employs frequency response function and modal'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'data simultaneously to identify faults in structures. They tested the method
    on simulated data from a cantilevers beam. Worden [5] applied neural network to
    diagnose damage in a simple simulated lumped-parameter mechanical system. It was
    shown that the system transmissibility provides a sensitive feature for the detection
    of small stiffness changes. Xia et al. [6] proposed a statistical method with
    combined uncertain frequency and mode shape data for structural damage identification.
    They updated a finite element model by comparing the measured vibration data before
    damage or analytical finite element model of the undamaged structure with those
    measured after damage, so that the vibration characteristic changes of the finite
    element model are equal to the changes in the measured data as closely as possible.
    They applied the proposed method to a laboratory tested steel cantilever beam
    and frame structure. Hung and Kao [7] presented a two-steps approach for damage
    detection. The first step is system identification, and involves using neural
    system identification networks (NSINs) in order to identify the undamaged and
    damaged states of a structural system. The partial derivatives of the outputs
    with respect to the inputs of the NSIN, which identifies the system in a certain
    undamaged or damaged state, have a negligible variation with different system
    errors. This loosely defined unique property enables these partial derivatives
    to quantitatively indicate system damage from the model parameters. The second
    step, structural damage detection, involves using the Neural Damage Detection
    Network (NDDN) to detect the location and extent of the structural damage. The
    input to the NDDN is taken as the aforementioned partial derivatives of NSIN,
    and the output of the NDDN identifies the damage level for each member in the
    structure.


    Huang et al. [8] identified the dynamic characteristics of a building and diagnosed
    whether earthquakes have damaged the building, using a back-propagation neural
    network approach. The dynamic characteristics were directly evaluated from the
    weighting matrices of the neural network trained by observed acceleration responses
    and input base excitation. Whether the building is damaged under a large earthquake
    is assessed by comparing the modal parameters and responses for this large earthquake
    with those for a small earthquake that has not caused this building any damage.
    They demonstrated the feasibility of the approach through processing the dynamic
    responses of a five-story steel frame, subjected to different strengths of the
    Kobe earthquake, in shaking table tests. Tsai and Hsu [9] employed displacement
    time history of the existing structures and back-propagation neural network technique
    to assess the severity and location of defects for reinforced concrete structures.
    They presented the theoretical analysis of a simply-supported reinforced concrete
    beam with assumed defects by a finite-element program was applied to generate
    training and testing examples which were needed for neural network assessing task.
    Examples were generated according to the displacement time history of the defected
    beams due to a dynamic force at the center of the beam. Kirkegaard and Rytter
    [10] considered the potential of using back-propagation neural network for damage
    assessment of a free-free cracked straight steel beam based on vibration measurements.
    Ziemianski and Piatkowski [11] applied neural networks for damage detection in
    rod structures. The identification method was based on the analysis of propagation
    of wave in solids. In order to simulate wave propagation in a rod element, they
    used finite element'
