    # 20.5 Results and Discussions


    # 20.5.1 Performance Analysis


    The number of data used to develop a reliable model based on data mining approaches
    plays a crucial role in modeling process. Frank and Todeschini [59] suggested
    that the minimum ratio between the number of data used and the number of involved
    variables should be 3. A safer value of 5 can be more conservative. In the present
    study, this ratio is remarkably more and is equal to 230/7 = 32.85. For evaluation
    of the developed models, the scatters diagrams between measured and predicted
    maximum bond strength based on M5’ and MARS algorithms for testing and training
    data points are shown in Fig. 20.6. As seen, there are little scatters between
    predicted and measured values of bond strength around the optimal line in both
    training and testing sets; and data points mostly concentrated around this line.
    For further verification of developed models, analytical analysis of statistical
    error parameters for training and testing data sets are presented in Table 20.3.


