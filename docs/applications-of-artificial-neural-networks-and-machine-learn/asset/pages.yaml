    # ## 3.4 A Brief Overview of Taguchi''s Method


    The Taguchi method is a statistical technique that improves product quality, and
    has been applied to engineering, biotechnology, marketing, and advertising in
    recent years [8, 9]. There are three basic and simple concepts that comprise Taguchi''s
    philosophy. Concepts such as these include:


    +   - During the production process, quality should be designed, not checked.

    +   - The best way to achieve quality is to minimize the deviation from the specified
    value.

    +   - A product must be designed to be safe against uncontrollable environmental
    conditions.'
