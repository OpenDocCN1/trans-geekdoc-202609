  md: 'contrary, when the ratio \(b_p/b_m\) tends to 1 (corresponding to plane strain
    conditions), the fracture energy per unit of FRP-width is smaller than in case
    of \(b_p/b_m < 1\). As seen in Eqs. (20.18a–20.18d), the M5’ algorithm correctly
    captured this underlying physical concept. Furthermore, according to the developed
    tree in Fig. 20.4, the prediction of maximum bond strength for smaller FRP-width
    (<50.5 mm) is more complex and the algorithm divided the space of problem into
    three subspace. This is due to this fact that considering the effects of three-dimensional
    shear transfer in real problems is a quite complex task, which is also addressed
    in [58].


    Furthermore, the developed equations show that the bond strength increases as
    bond length (\(L_b\)), the mean tensile strength of substrate (\(f_{mt}\)) and
    axial strength of reinforcement (\(E_pt_p\)) increase in all the rules. These
    results are all expected cases in investigation of debonding process. However,
    the nonlinear relationships between these parameters and maximum bond strength
    are different in each class. To more illustration and investigation of maximum
    bond strength behaviors, scatter diagrams of the observed maximum bond strength
    and \(L_b\), \(E_pt_p\) and \(f_{mt}\) parameters are demonstrated for each class
    in Fig. 20.5. According to Eqs. (20.18a–20.18d), the maximum bond strength approximately
    increases linearly as \(L_b\) increases in both classes 1 (\(LM_1\)) and 4 (\(LM_4\)).
    On the other hand, experimental observations confirmed this behavior and the M5’
    algorithm correctly captured this behavior (see Fig. 20.5. This figure also shows
    that the maximum bond strength slightly affected by \(E_pt_p\), especially in
    \(LM_2\), \(LM_3\) and \(LM_4\) classes. The most influence of \(E_pt_p\) on bond
    strength was observed in class 1 and in which bond width and the ratio between
    bond width and substrate width were the smallest. According to Eqs. (20.18a–20.18d),
    the \(E_pt_p\) parameter has also the larger power in \(LM_1\) while its power
    was remarkably smaller in other classes. The \(f_{mt}\) parameter has also approximately
    similar trends in each class. As seen in Fig. 20.5 and Eqs. (20.18a–20.18d), the
    most influence of \(f_{mt}\) on bond strength was observed in classes 1 and 2
    while its influence was less in classes 2 and 3. However, the influence of \(f_{mt}\)
    in class 3 is more than its influence in class 2 and this parameter plays as a
    splitting criterion for separating these classes. As a result, it can be concluded
    that the maximum bond strength behavior is more complicate in ranges of \(b_p
    \le 50.5\) mm and \(b_p/b_m > 0.44\) (\(LM_2\) and \(LM_3\)) than other ranges,
    therefore, more experimental investigation could be of interest for future work
    in these ranges.


    In general, most results derived from M5’ algorithm are based on information inherent
    in the collected database. As stated, the obtained results physically sound but
    some nonlinear relationships between input and output parameters may be different
    in comparison with other existing equations. For example, the relationship between
    \(L_b\) (or \(L_e\), effective depth) and \(F_{max}\) in most equations in literature
    are linear while this linear relation was found by M5’ algorithm only in two classes.
    However, it is shown that the M5’ results are more compatible with experimental
    observations.'
