  md: '```

    I(r) = \frac{I_0}{1 + \gamma r^2} \quad (13.8)

    ```


    where \( I(r) \) is the light intensity, \( r \) is the firefly distance, and
    \( I_0 \) is the light intensity at the source. Since the air absorbs part of
    the light and makes it weaker, the air absorption is modeled mathematically by
    the light absorption coefficient \( \gamma \).


    In many problems and applications, the combined effect of both can be approximated
    using the Gaussian form as formulated in Eq. (13.9).


    ```

    I(r) = I_0 e^{-\gamma r^2} \quad (13.9)

    ```


    The attractiveness of a firefly (\( \beta \)) is proportional to its brightness
    (or light intensity). \( \beta \) can be defined as Eq. (13.10).


    ```

    \(\beta(r) = \beta_0 e^{-\gamma r^2} \quad (13.10)\)

    ```


    where \( \beta_0 \) is the attractiveness at \( r = 0 \).


    Finally, the \( i \)th firefly movement (exploration and exploitation) towards
    the brighter and more attractive one \( j \) is modeled using Eq. (13.11).


    ```

    x_i(t) = x_i(t) + \beta_0 r^{-\gamma r_{ij}^2}(x_j - x_i) + \alpha(rand - 0.5)
    \quad (13.11)

    ```


    where \( \alpha \) is the randomization parameter, \( rand \) is a random number
    uniformly distributed between 0 and 1, and \( r_{ij} \) is the Euclidean distance
    between fireflies \( i \) and \( j \).


    The Enriched version of the basic Firefly Algorithm or EFA is proposed by Kaveh
    and Seddighian [20]. As they mentioned in their paper, some computational steps
    in the firefly algorithm increase its computational complexity. The first is to
    calculate the Euclidean distance between each pair of fireflies. The corresponding
    computational complexity to this process is equal to \( O(N^2) \), where \( N
    \) is the number of fireflies. Therefore, the first enrichment is devoted to linearizing
    this step. There are many programming tricks to handle this drawback. The authors
    of the EFA paper [20] propose to define a radius \( \xi \) as Eq. (13.12).


    ```

    \xi = \lambda r_{m,n} \quad (13.12)

    ```


    where \( \lambda \) is the region coefficient corresponding to the problem type,
    \( m \) and \( n \) are the best and worst fireflies in each iteration, respectively.
    Also, \( \lambda \) can be decreased linearly in each iteration.


    Herein, it is possible to select those fireflies that are in a feasible circular
    region of radius \( \xi \) in which the best firefly in each iteration is in the
    center. Using this trick, the algorithm''s computational complexity will be converted
    to \( T \times O(N) \), where \( N \) is the total number of fireflies, and \(
    T \) is the number of fireflies within the feasible region.'
