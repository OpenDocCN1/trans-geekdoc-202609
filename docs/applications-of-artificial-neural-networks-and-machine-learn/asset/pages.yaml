  md: '# # Chapter 14

    # Wavefront Reduction Using Graphs,

    # Neural Networks and Genetic Algorithm


    **Abstract** This chapter presents an algorithm for nodal numbering to obtain
    a small wavefront. Element clique graph is employed as the mathematical models
    of finite element meshes. A priority function containing five vectors is used,
    which can be viewed as a generalization of Sloan’s function. The vectors represent
    different connectivity properties of the graph models. Unlike Sloan’s algorithm,
    which uses two fixed coefficients, here, five coefficients are employed, based
    on an evaluation by artificial neural networks. The networks weights are obtained
    using a simple genetic algorithm.


    # ## 14.1 Introduction


    In this chapter wavefront reduction is performed using graph theory, neural networks
    and genetic algorithm, Kaveh and Rahimi Bonderabadi [1]. For the solution of sparse
    systems of simultaneous equations arising from the finite element analysis, the
    frontal method due to Irons [2], the profile method described by George [3], and
    the band-matrix technique, are commonly used. These methods exploit the sparsity
    of the coefficient matrices generated by the finite element approximations. They
    differ, however, in one significant respect: the band and profile methods first
    construct the coefficient matrix explicitly, while the frontal method arranges
    for elimination of variables as it assembles the matrix [4].


    In finite element analysis, in the case of one degree of freedom per node, performing
    nodal ordering is equivalent to reordering the equations. In a more general problem
    with m degrees of freedom per node, there are m coupled equations produced for
    each node. In this case re-sequencing is usually performed on the nodal numbering
    of the graph model to reduce the bandwidth, profile or wavefront, because the
    size of this problem is m fold smaller than that for the degree of freedom numbering.
    Algorithms for ordering to reduce wavefront have been developed by many authors
    [5–8].


    In this article, the mathematical model of a FEM (Finite Element Mesh) is considered
    as element clique graph, and nodal ordering is performed using concepts from'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'combinatorial graph theory for defining the priority function, as a combination
    of different graph connectivity properties. The coefficients corresponding to
    the vectors of this function are specified using artificial neural networks, and
    the weights of the networks are obtained employing a Genetic algorithm. For this
    purpose an algorithm similar to back propagation is employed for training the
    network.


    # 14.2 Definitions


    A graph S consists of a set of elements called nodes (vertices) and a set of elements
    called members (edges), together with a relation of incidence, which associates
    two distinct nodes with each member, known as its ends. Two nodes of a graph called
    adjacent if these nodes are the end nodes of a member. A member is called incident
    with a node if the node is an end node of the member. The degree of a node is
    the number of members incident with that node.


    A path is a finite sequence Pk = {n0, m1, n1, ..., m p, np} whose terms are alternately
    distinct nodes, ni and distinct members mi, for 1 ≤ i ≤ p and ni−1 and ni are
    two end nodes of mi. A tree T of S is a subgraph containing no cycle; a cycle
    being a closed path. If a tree is rooted from a given node n, it may be denoted
    by Tn.


    A spanning tree is a tree containing all the nodes of S. A shortest root tree
    (SRT n0) rooted from a specified node (starting node) n0, is a spanning tree for
    which the distance between every node n j of S and n0 is minimum, where the distance
    between two nodes is taken as the number of members in the shortest path between
    these nodes. A pair of nodes of a graph which are located at nearly maximal distance
    apart are known as pseudoperipheral nodes.


    A contour Ck_n0 of an SRT n0 contains all nodes with equi-distance k from n0.
    The number of contours "d" of an SRT is known as its depth, and the highest number
    of nodes in a contour "w" specifies the width of SRT.


    Consider the solution of sparse linear systems of equations


    ```

    Ax = b

    ```


    where the n × n matrix A is a sum of elemental matrices


    ```

    A = \sum_{l=1}^{m} A^{[l]},

    ```


    and the right-hand side vector b is of the form


    ```

    b = \sum_{l=1}^{m} b^{[l]}.

    ```'
