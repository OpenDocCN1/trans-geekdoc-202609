- pgno: 462
  md: '# ## 22.3.1 MARS


    Multivariate adaptive regression splines is a nonlinear and nonparametric intelligent
    computing regression algorithm that models the nonlinear responses between the
    inputs and outputs of a system using a series of piecewise linear or cubic segments
    (splines). The resulting piecewise equation is known as the basis functions (BFs).
    The slope of regression function is allowed to change from one segment to the
    next. The end points of each segment are called knots. A knot marks the end of
    one region of data and the beginning of another. Unlike the well-known parametric
    linear regression analysis, MARS provides greater flexibility to explore nonlinear
    relation between a response variable and predictor variables. In addition, MARS
    also searches for possible interactions between variables by checking all degrees
    of interactions. Because it allows for all functional forms and interactions,
    MARS is able to track the complex data structures from high-dimensional datasets.
    The general MARS function can be expressed using the following equation:


    ```

    \(\tilde{f}(x) = \beta_0 + \sum_{m=1}^M \beta_m \lambda_m(x)\) (22.9)

    ```


    where \(\tilde{f}(x)\) is the predicted response, \(\beta_0\) and \(\beta_m\)
    are constants, which are estimated to yield the best data fit and _M_ is the number
    of basis functions included into the model. The basis function in MARS model can
    be either one single spline function, or a product of two or more spline functions
    for different predictor variables. The spline basis function, \(\lambda_m(x)\),
    can be specified as:


    ```

    \(\lambda_m(x) = \prod_{k=1}^{k_m} [s_{km}(x_{v(k,m)} - t_{k,m})]\) (22.10)

    ```


    where _k<sub>m</sub>_ is the number of knots, _s<sub>km</sub>_ takes either 1
    or -1 and indicates the right/left regions of the associated step function, _v_(_k_,
    _m_) is the label of the predictor variable and _t<sub>k,m</sub>_ is the knot
    location.


    MARS generates basis functions by searching in a stepwise manner. An adaptive
    regression algorithm is used for selecting the knot locations. An optimal MARS
    is developed through a two-stage forward and backward procedure. In the forward
    stage, MARS overfits data by considering a great number of basis functions. In
    the backward, to avoid overfitting, redundant basis functions are deleted from
    Eq. (22.9). MARS adopts Generalized Cross-Validation (GCV) to delete the redundant
    basis functions. The expression of GCV is given as:


    ```

    \(GCV = \frac{\frac{1}{N} \sum_{i=1}^N [y_i - \hat{f}(x_i)]^2}{[1 - \frac{C(B)}{N}]^2}\)
    (22.11)

    ```'
  merge: -1
  img_proc: true
- pgno: 463
  md: 'in which $N$ is the number of data and $C(B)$ is a complexity penalty that
    increases with the number of basis function (BF) in the model. It is defined as


    $C(B) = (B + 1) + dB$ (22.12)


    where $d$ is a penalty for each BF included into the model and $B$ is number of
    basis functions [24].


    # 22.3.2 GMDH


    GMDH is a learning machine based on the polynomial theory of complex systems [22].
    From this network, the most significant input parameters, number of layers, the
    number of neurons in middle layers, and optimal topology design of the network
    are defined automatically. Therefore, the GMDH network is included those of active
    neurons known as a self-organized model. The structure of the GMDH network is
    configured thorough the training stage with polynomial model which produces the
    minimum error between the predicted value and observed output. The formal definition
    of the system identification problem is to find an approximate function \(\hat{f}\)
    that can be used to predict the actual output \(\hat{y}\) or a given input vector
    \(X = (x_1, x_2, ..., x_n)\) as close as possible to actual output y. Therefore,
    \(n\) observations of multi-input-single-output data pairs are considered as:


    $y_i = f(x_{i1}, x_{i2}, x_{i3}, ... x_{in})(i = 1, 2, ...., M)$ (22.13)


    The general relationship between input and output variables can be expressed by
    a complicated discrete form of the Volterra function, a series in the form of


    $y = w_0 + \sum_{i=1}^n w_i x_i + \sum_{i=1}^n \sum_{j=1}^n w_{ij} x_i x_j + \sum_{i=1}^n
    \sum_{j=1}^n \sum_{k=1}^n w_{ijk} x_i x_j x_k + \cdots$ (22.14)


    which is known as the Kolmogorov-Gabor polynomial [36]. In the present study,
    a quadratic polynomial of the GMDH network is used that is written as:


    Quadratic: \(\hat{y} = w_0 + w_1 x_i + w_2 x_j + w_3 x_i x_j + w_4 x_i^2 + w_5
    x_j^2\) (22.15)


    The weighting coefficients of Eq. (22.14) are calculated using regression techniques
    such that the difference between actual output, \(y\), and the calculated value,
    \(\hat{y}\), for each pair of \(x_i\) and \(x_j\) as input variables is minimized.
    In this way, the weighting coefficients of the quadratic function \(G_i\) are
    obtained to optimally fit the output to the whole set of input–output data pairs,
    which is defined as:'
