    of a higher level of confidence. Furthermore, the error distribution of DR values
    for a precise and accurate formula should be symmetrical around its mean value
    and close to 1. As it is shown, the error distributions of developed M5’ and MARS
    models are nearly symmetrical and their averages are very close to 1. In addition,
    the safety factors of M5’ and MARS models are generally smaller than other equations.
    For example, according to Fig. 20.10, if 10% risk is acceptable than the prediction
    of MARS and M5’ models should be divided by 1.40 and 1.45, respectively, while
    these factors for Tanaka [12], Yang et al. [18], Neubauer and Rostasy [14], Khalifa
    et al. [15] equations are 1.8, 2.7, 2.1 and 3.1, respectively.


    To quantitatively evaluate the safety of proposed models and existing design equations,
    a new scale has been employed in this study. Collins [62] introduced a new scale
    to evaluate and classify the reliability of design codes. This scale is known
    as Demerit Points Classification (DPC), which consider the safety, accuracy and
    scattering of design codes as a function of the ratio between the ultimate resistances
    in experimental tests and the estimated theoretically load capacity. In this study,
    the measured maximum bond strength ($P_{max,exp}$) and predicted bond strength
    by existing formulae and proposed models ($P_{max,predicted}$) are the ultimate
    resistances in experimental tests and the estimated theoretically load capacity,
    respectively. Table 20.6 presents an adaption made in the present study to the
    original values proposed by Collins [62]. According to the bond strength predicted
    by each formula, a demerit point to each prediction for 230 data points is attributed
    to that formula based on Table 20.6. Then, the general value of demerit of each
    formula is calculated by the sum of the products of the number of specimens in
    each interval and their corresponding demerit penalty. The lower the value of
    total sum, the more reliable the formula considered.


    Table 20.7 presents the evaluation of M5’, MARS and some existing equations as
    a function of the adapted criteria from Collins [62]. According to this criteria,'
