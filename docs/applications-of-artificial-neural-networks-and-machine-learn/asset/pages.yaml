- pgno: 112
  md: '# Chapter 5

    Analysis of Double-Layer Barrel Vaults

    Using Different Neural Networks


    **Abstract** The purpose of applying ANN in civil engineering is their efficiency
    in some problems that do not have a specific solution or their solution is very
    time-consuming. In this study, four different neural networks including FFBP,
    RBF, ERBF, and GRNN have been trained to analyze large scale space structures
    specifically double-layer barrel vaults focusing on their maximum element stresses.
    An example has been studied and the corresponding results have been compared with
    their exact amounts obtained by numerical solution.


    # 5.1 Introduction


    The interest of utilizing skeletal space frames to cover huge column-free bays
    due to their remarkable advantages such as low cost, lightweight, small deflection
    because of high inherent stiffness, three-dimensional action in carrying loads,
    etc., has been increased. Distinct types of skeletal space frames, which are often
    categorized as grids, domes, and barrel vaults, are mainly put in practice in
    sports stadiums, exhibition centers, assembly halls, swimming pools, shopping
    arcades, and industrial buildings which are typical instances of structures where
    large unobstructed areas and minimum interference from internal supports are architecturally
    required.


    Barrel vault, a very popular type of skeletal space frames, is one of the oldest
    forms which was improved in the nineteenth century by the use of iron bars [1].
    These bars act as horizontal tie members to withstand the horizontal thrust from
    the vault and make structures supported on slender walls or columns. The earlier
    types of barrel vaults were constructed as single-layer structures and to cover
    large spans double-layer systems can be utilized which are statically indeterminate.
    In double-layer barrel vaults, due to the rigidity, the risk of instability can
    almost be neglected. The use of this type of barrel vaults escalates the stiffness
    of the vault structures and provides structural systems of great potential, capable
    of having bays in excess of 100 m. Consequently, they are considered large-scale
    structures, so their design requires enough precision to be optimum.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Braced barrel vaults are formed on a cylindrical surface with a circular basic
    curve [1]. However, there is a possibility of utilizing other forms such as a
    parabola, ellipse, or funicular. Figure 5.1 depicts the habitual arrangement of
    braced barrel vaults. The type of braced barrel vaults and the location of supports
    expressed as L/ R, influence its structural behavior where L and R represent the
    distance between the supports in the longitudinal direction and the radius of
    curvature of the transverse curve, respectively.


    The response of braced barrel vaults while subjected to loading has been identified
    in three principal modes in the following [1]:


    +   (a) Arch mode:

    +   If the structure is only supported along its sides, it behaves as an arch
    structure, Fig. 5.2a. This type of structure relies on circumferential bending
    stiffness to resist displacement in the radial direction and also can be considered
    as a relatively soft structure.


    +   (b) Beam mode:

    +   If a barrel vault is only supported at its ends, it acts as a simple beam,
    Fig. 5.2b, which has longitudinal compressive stresses near the crown of the vault,
    longitudinal tensile stresses towards the free edges, and shear stresses towards
    the supports. To compare with the arch structure, this type of structure is relatively
    stiff and brittle. The end support could be provided by a thin diaphragm. If the
    diaphragm is rigid, the structure


    ![](img/4048998719320644ee88964326fd7995_113_0.png)


    # Fig. 5.1 Braced barrel vaults


    ![](img/4048998719320644ee88964326fd7995_113_1.png)


    # Fig. 5.2 Principal modes of braced barrel vaults'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'will behave as an encastre beam instead of a pinned one. Also, If the diaphragm
    is rigid but allowed to rotate, then this will only affect stresses near the end
    of the structure due to the Saint-Venant effect.


    # (c) Shell mode:


    If a barrel vault is supported along both sides and both ends, Fig. 5.2c, the
    structure responds as a thin shell. Despite the fact that this structure looks
    as if it is partly an arch and partly a beam, there is a need for radial deflection
    of the structure to behave as an arch structure which is prevented by transverse
    shear in the shell. This means that the loads acting on the structure will be
    supported by a complex system of forces acting tangentially to the surface of
    the barrel vault.


    # 5.2 Formex Configuration Processing and Formian


    In the analysis of double-layer barrel vaults, numerous nodes and members are
    involved which make them time-consuming. So, configuration processing is an issue
    that can be simplified utilizing the concept of Formex configuration processing
    [2]. Formex Configuration Processing is a mathematical system consisting of a
    set of abstract objects known as formices and a number of rules in accordance
    with which these objects can be manipulated. It implements a favorable basis for
    solutions to problems in data generation and computer graphics. This mathematical
    system has simplified configuration processing in large scale structures such
    as double-layer grids, barrel vaults, domes. The early ideas on which Formex Configuration
    Processing is based were developed by Nooshin during the years 1972–1973. The
    advantages of Formex formulation for data generation have been outlined by Nooshin
    et al. [3] in the following:


    +   - The process of data generation for structural systems is significantly simplified.
    The more complicated a structure is, the more beneficial it is to resort to Formex
    formulation.

    +   - The decrease in storage requirements can be enormous. For large-scale structures,
    the space needed data in the explicit form is several hundred times more than
    that demanded for data stored in the Formex format.

    +   - While the design proceeds, the formulation can be modified as simply as
    changing a document on a word processor, and it can be manipulated to reflect
    the contemporary status after making any necessary changes in geometry, loading,
    or support conditions.

    +   - It is drawing a configuration to generate the data for the intended structure,
    that is essential. However, once the Formex formulation is obtained, the upshot
    can be displayed on a monitor or printed.

    +   - An implied or actual nodal ordering system is required neither for a Formex
    description of a configuration nor for obtaining stress analysis by utilizing
    the input data in a compatible stress analysis software.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/4048998719320644ee88964326fd7995_115_0.png)


    +   * The Formex data generation is more advantageous compared with other available
    schemes that are analysis software dependent and consequently lack versatility.
    On the other hand, the input data produced by the Formex formulation can be employed,
    via Formian, in a variety of analysis software, such as SAP2000, ABAQUS, and LUSAS.


    In the Formex Configuration Processing, structural elements are defined based
    on their positions towards three basic directions U1, U2, and U3 being considered
    as suitable counterparts to axes X, Y, and Z in the three-dimensional Cartesian
    system. Parallel lines relative to these basic directions are named normat lines,
    and points of their intersections are known as normat points. Programmers determine
    distances between these normat lines individually. In the following instance,
    Fig. 5.3, the distances are considered a unity. In the Formex Configuration Processing,
    for example, the location of node C set in the lower layer is represented by three
    successive numbers separated by colons and put inside square brackets as: [1,
    1, 0]; an element of the top layer located between nodes A and B, Fig. 5.3), is
    described as: [2, 2, 1; 4, 2, 1], where the third coordinate indicates the position
    of the lower or the top layer measured along with the third direction U3. Member
    CD located in the lower layer is described as: [1, 1, 0; 3, 1, 0], while the cross-brace
    AD is expressed as: [2, 2, 1; 3, 1, 0].


    In the following, a sample of the double-layer barrel vault, Fig. 5.4, and its
    corresponding programming language in Formian, Fig. 5.5, are shown.


