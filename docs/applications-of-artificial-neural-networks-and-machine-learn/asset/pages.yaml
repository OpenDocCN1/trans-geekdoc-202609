    # ## 2.3 Metaheuristics-Trained Neural Network Model


    Metaheuristics are a class of algorithms employed to solve complex optimization
    problems that are complicated to solve operating traditional optimization techniques
    [10]. Unlike exact optimization methods, metaheuristics do not guarantee the optimal
    solution but aim to find a suitable solution within a reasonable amount of time.
    Meta-heuristics are especially beneficial for solving large-scale optimization
    problems with a large number of variables and constraints. Metaheuristics are
    inspired by natural and physical phenomena such as genetic evolution, swarm behavior,
    and simulated annealing. These algorithms use various techniques such as randomization,
    heuristic search, and local search to explore the search space and find a solution
    that satisfies the objective function. There exist many optimization algorithms,
    while Particle Swarm Optimization (PSO), Colliding Body Optimization (CBO), and
    their developed versions, which are equipped with Genetic Algorithm (GA), are
    considered in this work.


    # ### 2.3.1 Particle Swarm Optimization


    Particle Swarm Optimization (PSO) is a popular computational technique used in
    optimization problems [11]. PSO is based on the behavior of social organisms such
    as birds, fish, and insects. In PSO, a set of particles is used to search for
    the optimal'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'solution in a given search space. Each particle represents a potential solution,
    and its movement in the search space is guided by the best-performing particle
    in the swarm and its own past movements. The goal of PSO is to find the global
    optimum by iteratively updating the position and velocity of each particle based
    on its own and the swarm’s best performance. It is a robust and efficient technique
    that can handle both convex and non-convex optimization problems with multiple
    local optima.


    # 2.3.2 Colliding Body Optimization


    Colliding Body Optimization (CBO) is a relatively new optimization algorithm that
    has gained significant attention in recent years [12]. The algorithm is inspired
    by the physics of collisions, where particles in a system interact with each other
    by colliding and exchanging energy. CBO uses this concept to find optimal solutions
    to complex optimization problems by simulating collisions between a set of bodies.
    Each body represents a solution in the search space, and the collision between
    bodies corresponds to a new solution that is a combination of their features.
    This approach makes CBO highly effective in solving optimization problems that
    involve multiple objectives or constraints.


    # 2.3.3 Genetic Algorithm (GA)


    A Genetic Algorithm (GA) is an optimization technique that draws inspiration from
    natural selection and genetics [13]. It is a heuristic method that is commonly
    employed to find the best solutions for problems with a large search space and
    intricate fitness functions. The algorithm operates on a population of potential
    solutions, and it uses genetic operators like selection, crossover, and mutation
    to produce new generations of solutions that more closely approach the optimal
    solution. GA has been successfully applied in numerous fields, including engineering,
    finance, and computer science, and is recognized as a powerful tool for solving
    complex optimization problems.


    # 2.3.4 Particle Swarm Optimization-Genetic Algorithm (PSO-GA)


    In order to further enhance the performance of PSO-Trained ANN algorithm, a hybrid
    version was developed using genetic algorithm which generates mutations and crossovers
    to enforce higher complexity in particle generation each iteration. The workflow
    of this implementation is presented in Fig. 2.4.'
