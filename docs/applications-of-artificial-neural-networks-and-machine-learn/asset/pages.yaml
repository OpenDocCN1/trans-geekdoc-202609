    $\rho_{Fw}$ are the longitudinal and transversal reinforcement ratio (%), respectively.


    # 18.3.1 Data Collection


    Compiling a comprehensive database is requisite in generating new predictive models.
    Razaqpur and Spadea and Oller recently studied comprehensively the shear design
