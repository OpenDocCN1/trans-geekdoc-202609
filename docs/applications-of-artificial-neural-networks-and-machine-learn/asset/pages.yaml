  md: '# 17.3 Hybrid Method for Subdomain


    A finite element domain D can be divided into two subdomains D1 and D2 employing
    an expansion process for which their interface is shown by S - S, Fig. 17.2a.


    Two subdomains R2 and R3 with equal number of nodes (|R2| = |R3|) are separated
    from subdomains D1 and D2, respectively, using a graph theoretical method as illustrated
    in Fig. 17.2b. Let n be the total number of nodes of the model, and i be the total
    number of nodes in each subdomain R2 and R3, respectively. Then the nodes of elements
    in subdomain R1 will be m = n - 2i.


    In the first stage, two subdomains R2 and R3 with equal number of nodes are departed
    from the overall domain. In the second stage a neural network method is applied
    to the clique graph of R1, and the corresponding domain is bisected and each half
    is added to the adjacent R2 and R3 subdomains, resulting in the partitioning of
    the whole domain.


    For the purpose of initial partitioning of the whole domain, the Greedy algorithm
    [2] can be employed. In this algorithm first the pseudo peripheral nodes r2 and
    r3 of the partial clique graph of the FEM is obtained. The shortest route trees
    (SRT) are routed from these two nodes and the nodes are added to form R2 and R3
    contour by contour (level). The generation of trees is halted as soon as a suitable
    number of nodes are assigned to R2 and R3.


    It should be noted that if the simple SRT method is used for initial partitioning
    of the domain, then the unrestricted growth of the trees yields the suboptimal
    solution, as shown in Fig. 17.3.


    A number of examples studied using a graph theoretical algorithm for initial partitioning
    have shown that if the following restriction is imposed, then the same results
    will be obtained for the present and the pure neural networks method:


    $DS_2 + DS_3 \le (depth - width) \quad (17.1)$


    Fig. 17.2 Graph based domain decomposition. a A domain divided into two subdomains.
    b A domain divided into three subdomains


    ![](img/4048998719320644ee88964326fd7995_339_0.png)'
