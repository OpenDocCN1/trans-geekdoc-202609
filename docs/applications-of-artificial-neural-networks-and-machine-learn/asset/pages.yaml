    # ## 6.6 Concluding Remarks


    Efficient neural networks are trained and tested for approximate prediction of
    displacements and design of Schwedler dome using RBF and BP. The bounds considered
    for span length and structural rise can easily be extended to cover wider ranges.
    Similar nets can be trained for other types of space structures.'
