    that shear strength is notably more sensitive to change of \(\rho_{FW}\) than
    that of a/d and \(\rho_F\). It has also been concluded in the literature that
    the shear strength in these members is mainly controlled by axial strength of
    stirrups [7, 8]. In Fig. 18.3c, the effect of compressive strength (f<sub>c</sub>)
    on shear strength is also depicted. As shown, the shear strength of FRP-reinforced
    members increases due to increasing f<sub>c</sub>. These extracted results of
    GMDH model are also consistent with previous experiments and studies in the literature
    [7, 8].


    # 18.4.3 Sensitivity Analysis


    To determine the importance of each input variable on the shear strength of reinforced
    members with and without stirrups, the sensitivity analysis is performed. The
    analysis is conducted such that, one parameter of predictive variables is eliminated
    one by'
