    # 20.5.3 Safety Analysis


    A reliable prediction of maximum bond strength between FRP reinforcements and
    masonry units is vital for engineers to have a safe, technically correct and economical
    design. In this study, the box plot of discrepancy ratio between measured and
    predicted maximum bond strength (DR) is used to assess the reliability and uncertainty
    of the empirical and proposed models. Box plot is a convenient graphical way to
    illustrate data points through their quartiles. It displays the variation in samples
    of a statistical population without making any assumptions of the underlying distribution.
    The spreading between the different parts of the box indicates the degree of dispersion
    (spread) or skewness in the database. According to statistical analysis of previous
    sections, it can be expected that the developed M5′ and MARS models are more reliable
    than existing equations. However, it is impossible to identify the uncertainty/safety
    factor of different models. Therefore, the exact degree of uncertainty in the
    mentioned models cannot be determined. To overcome this limitation, a safety factor
    based on the acceptable level of risk for each model can be considered.


    Figure 20.10 illustrates the box plots of different models including the proposed
    ones and the most accurate empirical equations according to the pervious results.
    Yang et al., It is clear that Yang et al. [18] and Khalifa et al. [15] equations
    generally overestimate the bond strength while Tanaka [12] and Neubauner and Rostasy
    [14] equations underestimate the maximum bond strength. Among mentioned equations,
    the Khalifa et al. [15] formula is more conservative and has the highest uncertainty
    (wider box plot). The Tanaka [12] formula has the lowest uncertainty among existing
    empirical equations. Figure 20.10 also shows that the box plots of M5′ and MARS
    models developed in this study are narrower than those of others, which is an
    indicator'
