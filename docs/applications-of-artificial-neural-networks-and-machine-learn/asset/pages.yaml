- pgno: 5
  md: '# Preface


    In today''s world, which has witnessed unprecedented advances in technology and
    computer science, artificial intelligence has emerged as a top field captivating
    global attention. Often referred to as AI, this technology stands apart from other
    disciplines as it aims to design machines and systems that exhibit intelligence,
    learn autonomously, and make decisions akin to humans. To comprehend the impact
    of this innovation, one must delve into the workings of artificial intelligence,
    trace its historical evolution from inception to present day, and explore its
    diverse applications in domains like medicine, transportation, broadcasting, and
    marketing. Artificial intelligence introduces a transformative element to our
    reality, fostering significant breakthroughs and innovations.


    The aim of the present book is to provide different applications of Artificial
    Neural Networks (ANN) in various problems of material science, structural optimization,
    and optimal analysis in 22 chapters. In Chap. 1, the main definitions, concepts,
    and objectives of the present book are provided. Chapter 2 introduces buckling
    resistance prediction of high-strength steel columns using metaheuristic-trained
    artificial neural networks. Chapter 3 provides the use of artificial neural networks
    and metaheuristic algorithms to optimize the compressive strength of concrete
    followed by Chap. 4, where efficient neural networks are trained for design of
    double-layer grids. Analysis of double-layer barrel vaults using different neural
    networks is presented in Chap. 5. In Chap. 6, the BP and RBF neural networks for
    predicting displacements and design of Schwedler domes. In Chap. 7, a neurocomputing
    strategy is presented which combines data processing capabilities of neural networks
    and numerical structural optimization. In Chap. 8, the applications of two artificial
    neural networks, namely, the backpropagation neural net and the improved counter
    propagation neural net are described for the analysis and design of large-scale
    space structures. A hybrid enhanced colliding bodies optimization and artificial
    neural network algorithm is presented for shear strength of partially grouted
    masonry walls in Chap. 9. Shape optimization of arch dams with frequency constraints
    by enhanced charged system search algorithm and neural network is performed in
    Chap. 10. Estimation of the vulnerability of the concrete structures using artificial
    neural networks is discussed in Chap. 11. Efficient training of artificial neural
    networks using different metaheuristic'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'algorithms for predicting the FRP strength is the subject matter of Chap. 12.
    A metaheuristic-based artificial neural network is presented in Chap. 13 for plastic
    limit analysis of frames. Wavefront reduction using graphs, neural networks, and
    genetic algorithm is discussed in Chap. 14. Optimal design of transmission towers
    using genetic algorithm and neural networks is the subject of Chap. 15. Estimating
    the vulnerability of the concrete moment resisting frame structures using artificial
    neural networks is presented in Chap. 16. In subsequent Chap. 17, a hybrid graph-neural
    method is presented for domain decomposition. GMDH-based prediction of shear strength
    of FRP-RC beams with and without stirrups is discussed in Chap. 18. Efficient
    training of two ANNs using four metaheuristic algorithms for predicting the FRP
    Strength is provided in Chap. 19. New predictive models for prediction of bond
    strength between FRP reinforcements externally glued on masonry units are provided
    in Chap. 20. Kernel extreme learning machine application in prediction of bond
    strength between EBR FRP and concrete substrate is discussed in Chap. 21. Development
    of predictive models for shear strength of HSC slender beams without web reinforcement
    using machine-learning-based techniques is the subject matter of Chap. 22.


    I would like to take this opportunity to acknowledge a deep sense of gratitude
    to a number of colleagues and friends who in different ways have helped in the
    preparation of this book. My special thanks are due to Dr. Thomas Ditzinger, Editorial
    Director of Interdisciplinary and Applied Sciences and Engineering, Springer-Verlag,
    for his constructive comments, editing, and unfailing kindness in the course of
    the preparation of this book. My sincere appreciation is extended to our Springer
    colleagues who prepared the careful page design of this book. I would like to
    thank my former and present Ph.D. and M.Sc. students, Dr. H. Rahami, Dr. T. Bakhshpoori,
    Dr. A. Iranmanesh, Dr. H. A. Rahimi Bonderabady, Dr. M. Raiesi Dehkordi, Dr. P.
    Hosseini, Mr. Servati, Mr. R. Ghafarian, and Mr. S. M. Hamze-Ziabadi for using
    our joint papers. The kind help of my Ph.D. students, Mrs. N. Khavaninzadeh, Mr.
    A. Eskandari, Mr. M. Movasat, is highly appreciated. Finally the patience of my
    wife during preparing this book is highly acknowledged.


    This book is partially completed during the sabbatical leave of the author at
    TU-Wien and I would like to thank Prof. R. Heuter for his hospitality. Many thanks
    to the publishers who permitted some of our papers to be utilized in the preparation
    of this book, consisting of Springer, Wiley, Elsevier, Publisher of Siantia Iranica,
    and Publisher of Peidoca Polytechnica.


    Every effort has been made to render this book error-free. However, the author
    would appreciate any remaining errors being brought to his attention through his
    email address: alikaveh@iust.ac.ir (Ali Kaveh).'
