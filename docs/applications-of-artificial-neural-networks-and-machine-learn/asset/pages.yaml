- pgno: 435
  md: '# 21.3.3 Gamma Test as a Tool for Sensitivity Analysis


    In this subsection, the Gamma Test (GT) approach is presented to determine the
    most important parameters involved in prediction of maximum bond strength between
    FRP sheets and concrete substrates. The main advantage of GT approach is that
    it can find and determine the unknown relationship between input and output variables
    without generating a new prediction model [42]. The GT estimates the minimum Mean
    Square Error (MSE) that should be obtained by any smooth nonlinear function. To
    more explain the GT approach, a set of input and output parameters can be considered
    as follows:


    \{(x_i, y_i), 1 \le i \le M\} = (X, Y)   (21.17)


    where vector X denote the input variables that are confined to some closed bounded
    set c \in R^m and Y is a response variable. The relationship between X and Y can
    be stated as:


    y = f(X) + r   (21.18)


    where f is a smooth function and r is a noise variable with random nature. The
    GT calculates the variance of the random variable (Var(r)) without knowing the
    function of f. To achieve this, the GT estimates the following equations:


    \delta_M(k) = \frac{1}{M} \sum_{i=1}^M |x_{N(i,k)} - x_i|^2   (21.19)


    \gamma_M(k) = \frac{1}{2M} \sum_{i=1}^M |y_{N(i,k)} - y_i|^2   (21.20)


    where \delta_M(k) is the mean square distance to the kth nearest neighbor, Y_M(k)
    is the corresponding gamma function of the output variable, x_{N(i,k)} is the
    index of kth nearest neighbor to x_i, y_{N(i,k)} is the corresponding output of
    x_{N(i,k)} and | \cdots | denotes Euclidean distance.


    In general, the GT calculates mean-squared kth nearest neighbor distances \delta(k),
    (1 \le k \le k_{Max}) and corresponding Y(p)^2. To estimate Var(r), the GT computes
    the best intercept of the linear regression line of Y_M(k) versus \delta_M(k),
    which is often shown by \Gamma. This parameter is also an indicator for complexity
    of function f. The results of GT can also be standardized by considering the V_{ratio}
    term which returns scale-invariant noise between zero and one. It is defined as:


    V_{ratio} = \frac{\Gamma}{\text{Var}(y)}   (21.21)


    where Var(y) is the variance of y.'
