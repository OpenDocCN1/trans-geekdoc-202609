    # 18.4.2 Parametric Analysis


    Parametric analysis of the developed models is carried out with the aim to deeper
    understand of the shear strength of reinforced concrete with and without stirrups.
    The parametric analysis investigates the response of the predicted shear strength
    based on the GMDH model to a set of hypothetical input data generated over the
    ranges of the minimum and maximum data used for the model training. The methodology
    is based on the change of only one input variable at a time while the other variables
    are kept constant at the average values of their entire data sets. A set of synthetic
    data for the single varied parameter is generated by increasing the value in increments.
    These inputs are presented to the prediction equation and the shear strength is
    calculated. This procedure is repeated using another variable until the model
    response is tested for all input variables. The robustness of the GMDH models
    is determined by examining how well the predicted shear strength values agree
    with the underlying physical behavior of the shear capacity of RC members. Figure
    18.3 illustrates the tendency of the shear strength prediction of reinforced members
    with stirrups and without stirrups to the variations of the main design parameters
    including reinforcement ratio, shear span to depth ratio and concrete compressive
    strength.


    From Fig. 18.3a, it can be seen that shear strength decreases due to increasing
    shear span to depth ratio for both reinforced members with stirrups and without
    stirrups. It is also well known that the failure mode is changed from shear comparison
    to diagonal tension for a/d = 2.5. According to Fig. 18.3a, this mechanism has
    been captured by the GMDH model for both members with stirrups and without stirrups.
    In general, the shear strength of members with stirrups are more than the members
    without stirrups and the discrepancy between the amounts of shear strength for
    both members increases due to increasing the shear span to depth ratio. These
    results from parametric analysis are also in good agreement with structural engineering
    senses.


    In Fig. 18.3b, the variation of shear strength capacity with longitudinal reinforcement
    ratio (\(\rho_F\)) for both FRP-reinforced members with stirrups and without stirrups
    is shown. It can be observed that shear strength capacity increases due to increasing
    the longitudinal reinforcement. In general, shear strength in members without
    stirrups withstands with the shear of concrete and shear strength of longitudinal
    FRP. It can be expected that increasing of longitudinal reinforcement ratio leads
    to increase of shear strength capacity. The GMDH model correctly captured this
    effect of longitudinal reinforcement ratio on shear strength. For FRP-reinforced
    members with stirrups, the shear strength withstands with three components: shear
    of concrete, axial strength of stirrup and shear strength of longitudinal FRP.
    According to Fig. 18.3b, the shear strength capacity of these members increases
    due to increasing longitudinal reinforcement ratio which is consistent with previous
    studies.'
