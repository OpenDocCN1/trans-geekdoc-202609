  4. `分级` (Stratum)\n\n### 251. 下哪种协议用于将计算机时钟同步到服务器提供的时间信号？\n1. `TFTP`\n2. `HTTP`\n\
  3. `SMTP`\n4. `NTP`\n\n### 252. 在完全限定域名名 (FQDN) `www.paris.mydomain.org` 中，哪个部分代表\
  \ DNS 命名空间层次结构中的顶层？\n1. `www`\n2. `paris`\n3. `mydomain`\n4. `org`\n\n### 253. 下哪个动态主机配置协议\
