  \ `169.254.0.0` 到 `169.254.255.255`。\n\n### 173\nD. `Class D` 用于多播。`Class A`、`Class\
  \ B` 和 `Class C` 地址用于单播。`Class E` 用于实验。\n\n\n\n\n\n### 178. A\n`IPv6` 链路本地地址会自动分配给每个接口。类似于自动私私有\
  \ IP 地址配置 (`APIPA`)，它仅在本地网络上提供通信。全局单播地址是可路由的；它们等同于 IPv4 注册地址。站点本地地址等同于私有 IPv4 地址。任播地址的设计用于传输传输到多播组中的任何一个主机。\n\
  \n### 179. A, B\n与网络地址翻译不同，端口地址翻译使用单个公网 `IPv4` 地址供所有客户端工作站使用。`PAT` 并不是为每个工作站分配一个唯一地址，而是为每个工作站分配一个唯一的端口号。\n\
  \n### 180. B\n无状态地址自动配置 (`SLAAC`) 是 IPv6 系统自生成前缀为 `fe80::/64` 的链路本地地址的方法，类似于 IPv4\
  \ 系统使用 `APIPA` 生成地址的方式。IPv6 系统可以使用 `DHCPv6` 获取有状态（而非无状态）的地址。扩展唯一标识符（如 `EUI-64`）是介质访问控制\
  \ (`MAC`) 地址的格式。\n\n### 181. A, D\n`Teredo` 和 `6to4` 都是隧道协议，旨在作为过渡机制，允许将 IPv6 数据报封装在\
  \ IPv4 数据包中。`IPsec` 使用隧道，但它并不用于封装 IPv6 流量。互联网控制消息协议 v6 与其对应的 `ICMPv4` 一样允许允许和主机传输信息消息和错误消息；它不使用隧道。\n\
  \n### 182. A\n`ICMPv6` 主机生成“路由器请求”(`Router Solicitation`)消息并将其发送到“所有路由器”(`All Routers`)多播地址。路由器使用“路由器告份”(`Router\
  \ Advertisement`)消息进行响应，其中包含了主机用于生成链路本地地址的前缀信息。主机不必学习最近的路由器的地址，因为它们可以使用“所有路由器”多播。地址冲突检测发生在主机创建链路本地地址之后，且不使用“路由器请求”和“路由器告份”消息。主机不使用“路由器请求”和“路由器告份”消息来封装\
  \ IPv4 数据包。\n\n### 183. B, D\n虚拟 IP 地址是不对应于物理网络接口的地址。网络地址翻译 (`NAT`) 使用虚拟公网 IP 地址代替与客户端主机相关的私有\
  \ IP 地址。虚拟机中的网络接口也是虚拟的，因此与接口关联的 IP 地址也必须是虚拟的。动态主机配置协议 (`DHCP`) 和自动私有 IP 地址配置 (`APIPA`)\
  \ 都能为物理网络接口分配 IP 地址；因此这些地址不是虚拟的。\n\n### 184. A\n子接口是与特定物理网络接口关联的逻辑（或虚拟）网络接口。设备（如路由器）可以使用多个子接口通过单个物理网络接口适配器连接到不同的子网。子接口是一个逻辑设备，因此它不是物理网络接口适配器上的一个端口，也不是连接到子网的物理适配器。子接口是一个完整的逻辑接口，而不仅仅是一个\
  \ IP 地址。\n\n### 185. A\n邮局协议 (`POP3`) 的默认端口是 `110`。简单邮件传输协议 (`SMTP`)（电子邮件客户端使用的另一种协议）的默认端口是\
