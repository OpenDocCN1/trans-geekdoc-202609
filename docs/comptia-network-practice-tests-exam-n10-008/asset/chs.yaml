  \ 100 Mbps 的以太网 LAN，有 40 个用户和 2 台共享服务器，全部通过 3 台集线器连接。用户必须能够相互共享文件并访问共享服务器。用户抱怨网络太慢。管理层表示必须考虑成本因素。Ralph\
