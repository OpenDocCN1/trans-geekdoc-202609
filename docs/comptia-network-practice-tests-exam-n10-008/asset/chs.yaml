  \n117. Ralph 被雇佣安装电缆以连接两个现有网络。这两个网络位于相隔约 1000 英尺的不同建筑。电缆类型必须支持每秒千兆 (Mbps) 的千兆以太网数据速率，并提供高水平的抗电磁干扰\
  \ (`EMI`) 能力。客户希望采用最经济的布线解决方案。下列哪种电缆类型最符合客户的需求？\n\n1. 多模光纤\n2. 屏蔽双绞线 (`STP`)\n3.\
  \ 非屏蔽双绞线 (`UTP`)\n4. 细同轴电缆\n5. 单模光纤\n\n118. 下列哪种是同轴电缆的连接器类型？（多项选择）\n\n1. `BNC`\n\
  2. `F-type`\n3. `N-type`\n\n\n\n\n\n### 119\nAlice 受雇为一家公司设计其网络布线。该公司刚搬入一栋旧建筑的两个楼层：地面楼的零售空间和\
  \ 43 层的办公空间。该建筑已有的第 5 类（`CAT5`）非屏蔽绞对线（`UTP`）。Alice 的客户希望在两个楼层各建立一个独立的局域网（`LANs`），并用一条骨干网络连接它们。他们希望每个\
  \ `LAN` 的数据传输率达到每秒 1 吉比特（`Gbps`），但计划未来迁移到 10 Gbps。两个网络之间相隔 200 米。以下哪个解决方案最符合客户的需求？\n\
  \n1. 为 LAN 安装第 6 类（`CAT6`）或第 6a 类（`CAT6a`）`UTP` 线。这些线运行速度为 1 Gbps，并提供了迁移到 10 Gbps\
  \ 的路径。骨干网络使用绞对线。\n2. 为 LAN 使用现有的 `CAT5` 布线，因为 `CAT5` 的运行速度为 1 Gbps。骨干网络使用粗同轴电。\n\
  3. 为 LAN 安装 `CAT6` 或 `CAT6a` `UTP` 线。这些线运行速度为 1 Gbps，并提供了迁移到 10 Gbps 的路径。骨干网络使用多模光纤缆。\n\
  4. 为 LAN 安装 `CAT6` 或 `CAT6a` `UTP` 线。这些线运行速度为 1 Gbps，并提供了迁移到 10 Gbps 的路径。骨干网络使用现有的\
  \ `CAT5` 线缆。\n\n### 120\n一名维修人员在办公大楼更换灯具时，不小心切断了吊顶内的一根网线。租户在整个结构中使用了各种局域网（`LAN`）技术，但在该特定楼层上有三个独立的\
  \ `LANs`：一个使用同轴电、采用线型拓结构的 10 节点细以太网 `LAN`；一个使用绞对线、采用星型拓结构的 25 节点千兆以太网 `LAN`；以及一个使用多模光纤、采用双环形拓结构的\
  \ 5 节点光纤分布式数据接口（`FDDI`）`LAN`。在不知道断裂的电缆属于哪个 `LAN` 的情况下，电缆中断可能直接影响的计算机最大数量是多少？\n\n\
  1. 0\n2. 1\n3. 5\n4. 10\n5. 25\n6. 40\n\n### 121\n在非屏蔽绞对（`UTP`）电缆的打线过程中，将散装电缆连接到墙壁插座和配线架时，你执行的最后一步是？\n\
  \n1. 剪掉超出接触点的多余线芯。\n2. 将裸线压在用于固定它的两个金属接触点之间。\n3. 剥掉电缆末端的部分绝缘层以暴露导线。\n4. 将线插入插座中相应的接触点内。\n\
  5. 从每根线上剥去少量的绝缘。\n6. 分开末端的绞合线对。\n\n### 122\n以下哪种电缆连接器未用于光纤？\n\n1. 直插头（`ST`）\n2.\
  \ 阶连接器（`SC`）\n3. 机械传输-注册插孔（`MT-RJ`）\n4. F 型\n5. 纤连接器（`LC`）\n\n### 123\n你可以使用以下哪种绞对电缆类型构建段长\
  \ 100 米的 10GBase-T 网络？（选择所有适用项）\n\n1. `CAT5`\n2. `CAT5e`\n3. `CAT6`\n4. `CAT6a`\n\
  5. `CAT7`\n6. `CAT8`\n\n### 124\n以下哪种电缆连接器类型已被通用串行总线（`USB`）连接淘汰？（选择所有适用项）\n\n1.\
  \ `BNC`\n2. `RJ-11`\n3. `DB-9`\n4. `DB-25`\n\n### 125\n以下哪种绞对电缆类型同时适用于 10 兆比特每秒（`Mbps`）数据率（使用两对）和\
  \ 100 Mbps 数据率（使用四对）？\n\n1. 第 3 类（`CAT3`）\n2. 第 5 类（`CAT5`）\n3. 第 5e 类（`CAT5e`）\n\
  4. 第 6 类（`CAT6`）\n\n### 126\nEd 受雇为一家拥有 15 名员工的小型私有限公司安装网络布线，他们需要共享文件和打印机。所有员工物理上位于同一建筑内的两个相邻办公空间，共用一堵墙和一扇门。两个办公室都有吊顶。客户希望采用易于排除故障的简单千兆以太网安装。此外，Ed\
  \ 的客户希望将安装成本降至最低。以下拓扑结构、电缆类型和安装方法的组合最符合 Ed 客户的需求？\n\n1. 星型拓扑，光纤布线和内部安装\n2. 总线拓扑，同轴电布线和外部安装\n\
  3. 总线拓扑，绞对布线和内部安装\n4. 星型拓扑，同轴电布线和外部安装\n5. 星型拓扑，绞对布线和外部安装\n\n### 127\n以下哪种电缆类型通常用于新建的局域网（`LAN`）安装？（选择所有适用项）\n\
  \n1. 单模光纤\n2. 多模光纤\n3. 同轴电\n4. 非屏蔽绞对\n\n### 128\n关于同轴电，以下哪些说法是正确的？（选择所有适用项）\n\n\
  1. 同轴电在同一层护层内有三个导体。\n2. 同轴电在同一层护层内有两个导体。\n3. 同轴电具有一个传输光脉冲信号的铜芯。\n4. 同轴电具有一个传输电信号的铜芯。\n\
  5. 同轴电具有一个由编织股制成的绝缘外层。\n6. 同轴电具有一个由 PVC 或特氟龙制成的绝缘护层。\n\n### 129\n以下哪种绞对电缆类型支持使用两对线实现\
  \ 1000 兆比特每秒（`Mbps`）千兆以太网？（选择所有适用项）\n\n1. 第 3 类（`CAT3`）\n2. 第 5 类（`CAT5`）\n3. 第\
  \ 5e 类（`CAT5e`）\n4. 第 6 类（`CAT6`）\n5. 第 6a 类（`CAT6a`）\n6. 以上均非\n\n### 130\n以下哪种绞对类型支持使用两对支持\
  \ 10 兆比特每秒（`Mbps`）和 100 Mbps 数据率？（选择所有适用项）\n\n1. 第 3 类（`CAT3`）\n2. 第 5 类（`CAT5`）\n\
  3. 第 5e 类（`CAT5e`）\n4. 第 6 类（`CAT6`）\n\n### 131\n关于光纤布线，以下哪些说法是正确的？（选择所有适用项）\n\n\
  1. 有两种主要的光电缆类型：单模和多模。\n2. 光纤通常用于跨越长距离。\n3. 光纤使用 IBM 数据连接器（`IDC`）。\n4. 光纤经常使用直插头（`ST`）和阶连接器（`SC`）连接器。\n\
  5. 单模光纤使用激光光源和玻璃芯。\n6. 多模光纤使用发光二极管（`LED`）光源。\n\n### 132\n以下哪些是内部电缆安装的特征？（选择所有适用项）\n\
  \n1. 内部电缆安装使用散装电缆卷，大多数布线未带连接器。\n2. 内部电缆安装所有布线均使用带连接器的预制电缆。\n3. 内部电缆安装无论距离长短都使用实体导体。\n\
  4. 内部电缆安装在短距离布线中使用股线导体，在长距离中使用实芯。\n5. 在内部安装中，电缆通常不穿过墙壁或吊顶。\n6. 在内部安装中，电缆通常穿过墙壁或吊顶。\n\
  \n### 133\n以下哪种以太网规范规定专门使用 `CAT8` `UTP` 电缆？\n\n1. `10GBase-T`\n2. `40GBase-T`\n\
  3. `100Base-TX`\n4. `1000Base-SX`\n\n\n\n\n\n### 134\nRalph 被聘用将三个局域网（LAN）连接在一起，并采用冗余路径以形成容错骨干网。这些\
  \ LAN 位于同一栋建筑的不同楼层，距离约 600 米。目前每个 LAN 都使用双绞线电缆配置为星型拓扑。每个 LAN 包含墙插、机架式配线架和交换机。建筑和消防规范允许电缆穿过现有的竖井、天花板和墙，但在\
  \ LAN 之间的一个楼层有一个 50,000 瓦的广播电台。哪种拓扑、电缆类型和安装方法最适合这个网络？\n\n1. 星型拓扑、光纤电缆和内部安装\n2. 星型拓扑、同轴电缆和外部安装\n\
  3. 网状拓扑、光纤电缆和外部安装\n4. 总线拓扑、双绞线电缆和内部安装\n5. 网状拓扑、光纤电缆和内部安装\n6. 星型拓扑、双绞线电缆和外部安装\n\n\
  ### 135\nAlice 是一位网络顾问，受聘评估多年前创建的网络设计，以确定该设计是否仍然可行。该网络将支持分布在建筑各处的 20 台工作站，运行库存数据库应用程序。最远的两台计算机相隔\
  \ 150 米。网络设计的首要目标是将所有 20 台工作站连接到运行速度为 10 兆兆（Mbps）的单个 LAN 上。两个次要目标是提供足够的容错能力以防止单根电缆断裂影响整个网络，并提供抵抗建筑内机器产生的电磁干扰（EMI）的能力。早期的设计要求细以太网\
  \ LAN，所有计算机都连接到单段同轴电缆上。关于该提议，以下哪种说法是正确的？\n\n1. 该解决方案没有实现首要目标，也没有实现任何一个次要目标。\n2.\
  \ 该解决方案实现了首要目标，但没有实现任何一个次要目标。\n3. 该解决方案实现了首要目标和一个次要目标。\n4. 该解决方案实现了首要目标和两个次要目标。\n\
  \n### 136\nEd 是一位网络顾问，为一个一个新的制造工厂设计网络。该工厂由两座相距 150 米的建筑组成：一座拥有 20 台计算机的办公室和另一座拥有\
  \ 30 台计算机的制造设施。现场最远的两台计算机相隔 225 米。Ed 的设计要求使用光纤电缆构建千兆以太网网络。收到提案后，客户要求 Ed 解释安装光纤电缆而非非屏蔽双绞线（UTP）的额外人工和费用。以下哪项不是在该项目中选择光纤而非\
  \ UTP 的有效理由？\n\n1. 最远两台计算机之间 225 米的距离超过了以太网 UTP 最大电缆段长度。\n2. 只有光纤电缆可以保持两栋建筑之间的电气隔离。\n\
  3. 光纤电缆完全抵抗制造厂设备产生的任何电磁干扰。\n4. 与 UTP 相比，光纤电缆提供了更高的断线容忍度。\n\n### 137\n在 `100Base-TX`\
  \ 规范中，交换机和网络接口适配器交换的快速链路脉冲（FLP）信号的功能是（多选）\n\n1. `FLP` 信号验证设备之间连接（或链路）的完整性。\n2. `FLP`\
  \ 信号允许设备协商它们之间链路的速度。\n3. `FLP` 信号指示何时发生了冲突。\n4. 设备使用 `FLP` 信号检测坏帧。\n\n### 138\n\
  以下哪种 10G 以太网规范要求使用铜电缆？\n\n1. `10GBase-LR`\n2. `10GBase-CX4`\n3. `10GBase-ER`\n4.\
  \ `10GBase-LX`\n5. `10GBase-SR`\n\n### 139\nAlice 是一位网络顾问，受聘将现有的以太网升级为千兆以太网。该网络由\
  \ 20 台工作站组成，使用 5 类（CAT5）非屏蔽双绞线（UTP）。所有计算机都连接到单个 `100Base-TX` 交换机上。Alice 发现以下哪些选项是升级到千兆以太网的有效路径？\n\
  \n1. 将 `CAT5` 电缆替换为至少 5 类（CAT5e）或 6 类（CAT6），并保留现有的网络适配器。\n2. 保留现有的网络适配器和交换机，将 `CAT5`\
  \ 电缆替换为至少 5 类（CAT5e）或 6 类（CAT6）。\n3. 将 `100Base-TX` 交换机替换为 `1000Base-T` 交换机，并保留现有的\
  \ `CAT5` 电缆。\n4. 保留现有的电缆，将 `100Base-TX` 交换机替换为 `1000Base-T`。\n\n### 140\nRalph 是一位网络顾问，客户希望他为新办公室设计局域网（LAN）。该站点由一栋已安装非屏蔽双绞线（UTP）电缆的建筑组成。Ralph\
  \ 注意到电缆是 5 类（CAT5），且所有布线长度均小于 100 米。在不更换电缆的情况下，Ralph 可以使用哪些以太网规范提供最快速度？\n\n1. `10GBase-T`\n\
  2. `100Base-TX`\n3. `1000Base-T`\n4. `1000Base-LX`\n5. `1000Base-SX`\n\n### 141\n\
  哪些电气电气学会（IEEE）以太网标准支持 10 兆比特秒（Mbps）通信，它们对应的段长度是多少？（多选）\n\n1. `10Base2`；最大长度 100\
  \ 米\n2. `10Base2`；最大长度 185 米\n3. `10Base5`；最大长度 500 米\n4. `100Base5`；最大长度 500 米\n\
  5. `10Base-T`；最大长度 100 米\n6. `10Base-T` 最大长度 328 米\n\n### 142\n以下哪些是以太网线类型必须配置为总线拓扑？（多选）\n\
  \n1. `RG-8`\n2. `RG-10`\n3. `RG-14`\n4. `RG-58`\n\n### 143\nEd 被聘升级公司的网络基础设施。目前网络是运行在\
  \ 5 类（CAT5）双绞电缆上的 10 Mbps 以太网。网络上有 100 台计算机，所有计算机都带有 10/100/1000 多速率网络适配器。计算机都连接到集线机。用户抱怨网络太慢，连接有时会中断。管理层希望在利用现有布线的情况下升级到可能的以太网标准，并保持成本最低。Ed\
  \ 应向客户推荐哪种实现？\n\n1. 升级到 `100Base-TX` 并保留现有的集线机。\n2. 升级到 `1000Base-T` 并保留现有的集线机。\n\
  3. 升级到 `100Base-FX` 并将所有集线机更换为交换机。\n4. 升级到 `1000Base-T` 并将所有集线机更换为交换机。\n5. 升级到 `100Base-SX`\
  \ 并将所有集线机更换为交换机。\n\n\n\n\n\n## 144. Ralph 被要求制作一些新的跳线线，用于连接配线架端口到网络交换机。他被告知所有电连接器都要使用\
  \ `T568B` 接线标准。Ralph 收集了完成任务所需的材料和工具，但他不确定 `T568B` 接线法。在制作跳线线时，Ralph 必须使用以下哪种接线法？\n\
  \n1. 白/橙、橙色、白/绿、蓝、白/蓝、绿、白/棕、棕\n2. 白/绿、绿、白/橙、蓝、白/蓝、橙色、白/棕、棕\n3. 白/橙、橙色、白/绿、绿、白/蓝、蓝、白/棕、棕\n\
  4. 白/棕、白/绿、白/橙、蓝、白/蓝、橙色、绿、棕\n\n## 145. 这是 Ralph 在一家从事网络电缆安装的咨询公司工作的第一天。他的新老板交给他一卷\
  \ 6 类电缆、一个大钳子状设备和一袋小透明塑料组件，并告诉他“开始做五位和十位的”。预计 Ralph 应该做什么？\n\n1. 拉设电缆布线\n2. 制作跳线线\n\
  3. 安装模块化连接器\n4. 安装配线架\n\n## 146. 波分复用是一种在单一网络介质上传输多个信号的光纤技术。这种技术有几种类型，包括粗波分复用 (`CWDM`)、密集波分复用\
  \ (`DWDM`) 和双向波分复用 (`BWDM` 或简称为 `WDM`)。以下哪项不是这些复用类型区别之处？\n\n1. 它们使用不同的波长间隔。\n2.\
  \ 它们在单一介质上携带不同数量的通道。\n3. 它们提供不同程度的信号放大。\n4. 以上都不是。\n\n## 147. 以下服务允许允许 IPv4 网络上的计算机使用注册\
