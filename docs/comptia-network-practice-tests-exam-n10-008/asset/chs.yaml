  3. DNS 服务器地址\n4. 子网网关\n\n### 238. 下列 IP 地址分配方法不支持动态主机配置协议 (DHCP)?\n\n1. 手动\n2. 动态\n\
  3. 静态\n4. 自动\n\n### 239. 在动态主机配置协议 (DHCP) 服务器上，创建的哪个元素用于指定服务器应分配给客户端的 IP 地址？\n\n\
