  2. `Hand geometry`\n3. `Biometrics`\n4. `Tamper detection`\n\n### 185. 以下哪些是防止未经授权的人员进入敏感位置（如数据中心）的手段？（选择所有适用项）\n\
  \n1. `Biometrics`\n2. `Identification badges`\n3. `Key fobs`\n4. `Motion detection`\n\
  \n### 186. 以下哪些安全措施可以监控敏感区域授权人员的特定活动？\n\n1. `Video surveillance`\n2. `Identification\
  \ badges`\n3. `Key fobs`\n4. `Motion detection`\n5. `Locking cabinets`\n\n### 187.\
  \ 以下哪些物理安全设备可以使用被式 RFID 允许授权用户进入安全区域？（选择所有适用项）\n\n1. `Key fob`\n2. `Keycard lock`\n\
  3. `Proximity card`\n4. `Cypher lock`\n5. `Smart locker`\n\n### 188. 某些用于安全区域身份验证进入的钥匙带有一个键盘，要求用户在设备激活前输入\
  \ PIN。该设备在使用以下哪种身份因素？（选择所有适用项）\n\n1. `Something you do`\n2. `Something you have`\n\
  3. `Something you are`\n4. `Something you know`\n\n### 189. 以下哪些物理安全设备可以允许授权用户在与设备没有任何任何物理接触的情况下进入安全区域？（选择所有适用项）\n\
  \n1. `Key fob`\n2. `Keycard lock`\n3. `Proximity card`\n4. `Cypher lock`\n\n###\
  \ 190. 敏感区域（如数据中心）的视频监控可以帮助检测哪种攻击？（选择所有适用项）\n\n1. `Social engineering`\n2. `Evil\
  \ twin`\n3. `Brute-force`\n\n### 191. 当生物识别身份验证产生假阳性（false positive）时，以下哪种陈述是正确的？\n\
  \n1. 应该拒绝的用户被准予访问。\n2. 不应该被准予的用户被准予访问。\n3. 应该授权的用户被拒绝。\n4. 不应该被授权的用户被拒绝。\n\n###\
  \ 192. 在数据中心，所有——\n\n1. `Tamper detection`\n2. `Asset tracking`\n3. `Geofencing`\n\
  4. `Port security`\n\n### 193. 一栋扫描进入人员并将其与数据库对比的安全建筑正在使用以下哪种技术？\n\n1. `Pattern\
  \ recognition`\n2. `Hand geometry`\n3. `Biometrics`\n4. `Tamper detection`\n\n###\
  \ 194. 以下哪项不是预防手段？\n\n1. `Badges`\n2. `Locks`\n3. `Key fobs`\n4. `Tailg`\n\n###\
  \ 195. 身份证、钥匙带都属于哪一类？\n\n1. `Physical security`\n2. `Data security`\n3. `Asset tracking`\n\
  4. `Port security`\n\n### 196. 以下哪些不是网络中的检测手段？（选择所有适用项）\n\n1. `Motion detection`\n\
  2. `Video surveillance`\n3. `Biometrics`\n4. `Smartcards`\n\n### 197. 下列哪种陈述描述了门上的自动锁配置为“故障关闭（fail\
  \ closed）”的含义？\n\n1. 在紧急情况下，门保持其当前状态。\n2. 在紧急情况下，门锁定。\n3. 在紧急情况下，门解锁。\n4. 在紧急情况下，门继续使用电池电源工作。\n\
  \n### 198. 在某公司数据中心遭到入侵后，管理层在入口安装了双门。两扇门之间有一个小门室，必须关闭一扇门后另一扇门才能打开。以下哪个术语描述了这种安排？\n\
  \n1. `Server closet`\n2. `Mantrap`\n3. `Controlled entrance`\n4. `Honeypot`\n\n\
  ### 199. Ralph 的公司购买了新电脑来替换目前使用的某些旧工作站。Ralph 被分配准备旧旧电脑的任务。这些电脑将卖给当地的二手交易商。Ralph\
  \ 需要执行哪些任务？（选择所有适用项）\n\n1. `Reinstall the operating system`\n2. `Uninstall all applications`\n\
  3. `Delete all data`\n4. `Run a disk wipe utility`\n5. `Perform a factory reset`\n\
  \n### 200. 以下哪项不是 TACACS 提供的功能之一\n\n1. `Authentication`\n2. `Authorization`\n3.\
  \ `Administration`\n4. `Accounting`\n\n# 第 5 章 网络故障排除\n\n## 以下哪些故障排除步骤涉及根据问题的严重程度对工单进行优先级排序？\n\
  \n1. 识别问题症状\n2. 建立可能原因的理论\n3. 测试理论以确定原因\n4. 制定解决计划并识别潜在影响\n5. 实施解决方案或根据需要升级\n6.\
  \ 验证完整的系统功能，并在适用情况下实施预防措施\n7. 记录发现的情况、操作和结果\n\n## 以下哪项被认为是系统级错误？\n\n1. 订单录入或客户服务呼中心资源的问题\n\
  2. 仅影响一个局域网 (LAN) 的路由器问题\n3. 导致单台计算机故障的错误\n4. 影响所有网络用户的电子邮件服务器问题\n\n## 以下哪项是网络级问题？\n\
  \n1. 订单录入或客户服务呼中心资源的问题\n2. 导致单台计算机故障的错误\n\n\n\n\n\n### 3. 影响单个局域网 (LAN) 的应用程序服务器问题\n\
  \n### 4. 连接整个网络到互联网的路由器问题\n\n### 4. 一位用户报告她无法连接到其网络上的服务器。Ed 想要确定问题的范围，因此他尝试在用户的计算机上重现该问题。问题仍然存在。没有其他用户报告此问题。为了确定受影响的区域，Ed\
  \ 应该执行的下一个逻辑步骤是什么？\n\n1. 验证本地路由器正在转发流量。\n2. 尝试在连接到同一段的另一台计算机上执行相同任务。\n3. 验证服务器配置是否正确。\n\
  4. 验证客户端连接的交换机是否运行正常。\n\n### 5. 下列哪些故障排除步骤涉及向用户提问初步问题，例如“问题发生时你在做什么？”\n\n1. 识别问题\n\
  2. 建立可能原因的理论\n3. 测试理论以确定原因\n4. 制定解决问题的行动计划并识别潜在影响影响\n5. 实施解决方案或在需要时升级\n6. 验证全系统功能，并在适用的情况下实施预防措施\n\
  7. 记录发现、操作和结果\n\n### 6. 在排除故障时，你首先采取步骤识别问题。在完成此操作后，你应该执行以下哪一个步骤？\n\n1. 实施解决方案\n\
  2. 制定行动计划\n3. 建立可能原因的理论\n4. 验证全系统功能\n\n### 7. 在哪个故障排除步骤中，你尝试复制网络问题，以便逻辑且有条地排除不是问题源的元素？\n\
  \n1. 识别问题。\n2. 建立可能原因的理论。\n3. 测试理论以确定原因。\n4. 制定解决问题的行动计划并识别潜在影响。\n5. 实施解决方案或在需要时升级。\n\
  6. 验证全系统功能，并在适用的情况下实施预防措施。\n7. 记录发现、操作和结果。\n\n### 8. Ralph 是在帮助服务台工作的一级技术人员。在识别了多个用户提交的网络问题后，Ralph\
  \ 提出了一个指定可能问题来源的理论，并开始测试他的理论。不幸的是，测试表明 Ralph 的理论是错误的；他怀疑的源并不是问题的原因。以下哪项**不应该是**\
  \ Ralph 故障排除过程的下一步？\n\n1. 重新访谈用户以收集更多关于问题的信息\n2. 将问题升级给二级技术人员\n3. 重复建立可能原因的理论的过程\n\
  4. 开始更换可能导致问题的组件\n\n### 9. Ralph 是在帮助服务台工作的一级技术人员。一位用户打来电话，说当她今天早上打开电脑时，屏幕上什么都没有出现。以下哪项应该是\
  \ Ralph 向用户的第一个问题？\n\n1. 你的电脑 IP 地址是多少？\n2. 你安装了最新的系统更新吗？\n3. 电脑和显示器是否已插上 AC 电源？\n\
  \n### 10. 你的服务器出现问题导致许多用户无法访问。这是什么类型的问题？\n\n1. 全局问题\n2. 资源问题\n3. 网络级问题\n4. 应用程序问题\n\
  \n### 11. Alice 突然连接到网络。Alice 采访了用户并发现他做了一些更改。她接下来应该做什么？\n\n1. 运行 `ipconfig` 查看配置\n\
  2. 检查路由器运行正常\n3. 测试理论以确定原因\n4. 检查 DNS 服务器\n\n### 12. Alice 在 DNS 服务器和代理服务器上遇到问题，她无法访问主机。最可能的问题是什么？\n\
  \n1. 路由器\n2. 服务器\n3. 互联网\n4. 局域网\n\n### 13. Alice 接了一个无法连接的用户的电话。Alice 正在使用哪种方法来排除问题？\n\
  \n1. 从上到下 (OSI-to-top)\n2. 分治法\n3. 从下到上 (OSI-to-bottom)\n4. 询问明显的问题\n\n### 14. Alice\
  \ 在帮助服务台工作时，用户来电报告无法访问资源。以下哪个步骤最不可能执行？\n\n1. 路由器\n2. 服务器\n3. DNS\n4. 应用程序\n\n###\
  \ 15. 在标准故障排除方法中，以下哪个步骤最后出现，但在过程中必须贯？\n\n1. 测试理论以确定原因\n2. 记录发现、操作和结果\n3. 验证全系统功能，并在适用的情况下实施预防措施\n\
  4. 实施解决方案或在需要时升级\n5. 制定解决问题的行动计划并识别潜在影响\n6. 建立可能原因的理论\n7. 识别问题\n\n### 16. 在哪个故障排除步骤中创建工单？\n\
  \n1. 建立可能原因的理论\n2. 验证全系统功能，并在适用的情况下实施预防措施\n3. 实施解决方案或在需要时升级\n4. 测试理论以确定原因\n5. 识别问题\n\
  6. 记录发现、操作和结果\n7. 制定解决问题的行动计划并识别潜在影响\n\n### 17. 故障排除模型中的哪个步骤涉及识别硬件或软件是否最近被安装或重新配置？\n\
  \n1. 识别症状\n2. 建立可能原因的理论\n3. 制定解决问题的行动计划并识别潜在影响\n4. 确定发生了变化。\n5. 测试理论以确定原因\n6. 记录发现、操作和结果\n\
  \n### 18. 故障排除模型中的哪个步骤涉及更换组件直到识别出故障硬件设备？\n\n1. 复制问题\n2. 收集信息\n3. 测试理论以确定原因\n4. 制定解决问题的行动计划\n\
  5. 验证全系统功能\n6. 记录发现、操作和结果\n\n### 19. 以下哪些项不是通用的故障排除步骤？（选择所有适用项）\n\n1. 识别问题\n2. 建立可能原因的理论\n\
  \n\n\n\n3. 测试理论以确定原因\n4. 验证客户端的 Internet Protocol (IP) 配置是否正确\n5. 制定行动计划以解决问题并识别潜在影响\n\
  6. 验证路由器正在转发\n7. 实施解决方案或在需要时进行升级\n8. 验证全系统功能，并在适用时实施预防措施\n9. 记录发现、操作和结果\n\n20. 下列哪项是记录网络问题或事件的原因？（选择所有适用项）\n\
  1. 文档有助于更容易地将电话升级给高级技术人员。\n2. 文档有助于更容易地对管理任务进行优先级排序。\n3. 文档有助于对对每个帮助电话进行优先级排序。\n\
  4. 文档有助于更容易地将电话升级给一线技术人员。\n\n21. 关于帮助电话的优先级排序，以下哪些陈述是正确的？（选择所有适用项）\n1. 个人桌面问题的优先级高于共享资源问题。\n\
  2. 共享资源问题的优先级高于个人桌面问题。\n3. 部门问题高于全网问题。\n4. 全网问题优先级高于部门问题。\n\n22. 关于多层级技术支持组织，以下哪些陈述是正确的？（选择所有适用项）\n\
  1. 当帮助电话涉及路由器等关键任务网络组件时，始终升级给二线技术人员。\n2. 一线技术人员通常处理桌面问题。\n3. 二线技术人员的经验通常比一线技术人员少。\n\
  4. 一线技术人员的经验通常比二线技术人员少。\n\n23. Ed 是一名一线支持技术人员。他收到了这里列出的帮助电话。他的工作根据严重程度对它们进行优先级排序。以下哪个问题应该获得最高优先级？\n\
  1. 影响整个部门（涉及多个局域网 LAN）的订单输入或客户服务中心资源问题\n2. 导致单台电脑故障的致命错误\n3. 影响整个网络的关键任务骨干路由器问题\n\
  4. 影响单个局域网的应用程序服务器问题\n\n24. Ed 是一名一线支持技术人员。他收到了这里列出的帮助电话。他的工作根据严重程度对它们进行优先级排序。以下哪个问题应该获得最低优先级？\n\
  1. 影响整个部门（涉及多个局域网 LAN）的订单输入或客户服务中心资源问题\n2. 导致单台电脑故障的致命错误\n3. 影响整个网络的关键任务骨干路由器问题\n\
  4. 影响单个局域网的应用程序服务器问题\n\n25. 在排除网络问题时，在尝试修复原始问题时可能会引入另一个问题。在故障排除的哪一个步骤中，你应该意识到更改对网络可能产生的残留影响？\n\
  1. 识别问题\n2. 建立可能的原因理论\n3. 测试理论以确定原因\n4. 制定行动计划以解决问题\n5. 实施解决方案或在需要时进行升级\n6. 验证全系统功能\n\
  7. 记录发现、操作和结果\n\n26. 在故障排除的哪一步中，你创建活动记录并告知用户发生了什么以及为什么？\n1. 识别问题\n2. 建立可能的原因理论\n\
  3. 测试理论以确定原因\n4. 制定行动计划以解决问题并识别潜在影响\n5. 实施解决方案或在需要时进行升级\n6. 验证全系统功能，并在适用时实施预防措施\n\
  7. 记录发现、操作和结果\n\n27. 周一早上，Alice 到上班发现收到了多个用户的电子邮件和电话消息，这些用户无法访问会计部门的文件服务器。在故障排除过程的初始阶段，以下哪些是最好的问题？（选择两个）\n\
  1. 自用户上次能够访问服务器以来发生了什么变化？\n2. 是否有 Alice 应该在服务器上应用的软件更新？\n3. 服务器是否遭受了硬盘故障？\n4. 哪些用户报告了问题，他们位于哪里？\n\
  \n28. 一个用户给帮助热台的 Alice 打电话，报告她的鼠标停止工作，无法访问互联网，且所有的邮件都从收件箱中消失了。Alice 采取的最佳行动方案是什么？\n\
  1. 为每个问题创建一个单独的故障工单\n2. 将电话升级给高级技术人员\n3. 将来电者的电脑更换为新电脑\n4. 派遣技术人员到用户现场处理所有问题\n\n\
  29. Alice 接到一个电话，用户报告他无法向桌子附近的网络连接工作组打印机发送打印作业。Alice 应该先执行哪项任务？\n1. 在用户工作站上重新安装打印机驱动程序。\n\
  2. 使用 `ping` 工具测试到打印机的网络连接。\n3. 检查用户工作站和打印机连接的交换机。\n4. 检查是否有可用的打印机固件更新。\n\n30. 下列哪种非屏蔽双绞（UTP）布线故障无法通过线序测试器检测？\n\
  1. 分对\n2. 断路\n3. 短路\n4. 交叉\n\n31. 在双绞电缆的一端连接信号发生器后，Ralph 走到电缆的另一端，依次用探测器触摸八个引脚。绿线和绿条纹线都产生了信号。Ralph\
  \ 发现了什么类型的布线故障？\n1. 分对\n2. 远端串扰\n3. 交叉\n4. 短路\n5. 延迟偏移\n\n32. 下列哪种线用于连接终端到路由器或交换机的控制端口？\n\
  1. 交叉线 (Rollover)\n2. 直通线\n3. 交叉线\n4. 防水线\n5. 屏蔽线\n6. 分接器\n\n33. 下列哪种跳线线用于连接计算机到墙插？\n\
  1. 直通线\n2. 交叉线\n3. 交叉线\n4. 防水线\n\n34. 通过在一端发送信号并测量反射从另一端返回所需的时间来确定电缆长度的设备称为什么？\n\
  1. 寻线测试器\n2. 线序测试器\n3. 时域反射仪\n4. 电压事件记录仪\n5. 继线\n6. 频谱分析仪\n\n35. 使用线序测试器对新安装的双绞电缆链路进行常规测试，显示其中根导线存在短路。以下哪些程序可能纠正故障？\n\
  1. 在电缆两端使用不同的引脚定义\n2. 替换电缆链路两端的接头\n3. 将电缆远离任何潜在的电磁干扰源\n4. 使用更高等级的非屏蔽双绞（UTP）电缆\n\n\
  \n\n\n### 36. Ralph 是一个新入职员工，负责一个使用 5 类（Cat 5）非屏蔽双对线（UTP）电的网络，这些电缆是几年前安装的。随着时间的推移，原始电缆安装人员用于标识墙面板和配线架连接器的纸标签已经磨损或掉落。结果，Ralph\
  \ 有相当多无法识别的线缆。在与主管确认后，Ralph 发现公司没有电缆测试设备，并且不愿意为了识别线缆而聘请顾问。Ralph 可以使用的最便宜工具是将未标记的墙面板与正确的配线架端口关联起来？\n\
  \n1. 线序测试仪 (Wiremap tester)\n2. 电缆认证器 (Cable certifier)\n3. 信号发生器和寻踪仪 (Tone generator\
  \ and locator)\n4. 时域反射仪 (TDR)\n\n### 37. 下列设备中是电缆技术人员的必备工具，但在数据网络电缆安装中不需要？\n\n\
  1. 信号发生器和寻踪仪 (Tone generator and locator)\n2. 线序测试仪 (Wiremap tester)\n3. 电缆认证器 (Cable\
  \ certifier)\n4. 测试分机 (Butt set)\n\n### 38. 在将内部双对线线缆连接到插入墙面板的 Keystone 连接器时，你可能会使用以下哪些工具？（选择所有适用项）\n\
  \n1. 压钳 (Crimper)\n2. 打线刀 (Punchdown tool)\n3. 尾纤接接器 (Pigtail splicer)\n4. 剥线器 (Wire\
  \ stripper)\n5. 熔接器 (Fusion splicer)\n\n### 39. 下列哪个工具可以用来测试光电缆的光损耗？\n\n1. 光损耗测试仪\
  \ (OLTS)\n2. 时域反射仪 (TDR)\n3. 信号发生器和寻踪仪 (Tone generator and locator)\n4. 线序测试仪 (Wiremap\
  \ tester)\n\n### 40. 下列故障排除工具可以测试电缆的长度、衰减、近端串扰（NEXT）、等级远端串扰（ELFEXT）、传播延迟、延迟偏移和回损耗？\n\
  \n1. 线序测试仪 (Wiremap tester)\n2. 电缆认证器 (Cable certifier)\n3. 时域反射仪 (TDR)\n4. 光损耗测试仪\
  \ (OLTS)\n5. 频谱分析仪 (Spectrum analyzer)\n\n### 41. 在下列哪种条件下，电缆安装人员需要使用腔内（plenum）缆？\n\
  \n1. 当电缆靠近电磁干扰（EMI）源时\n2. 当电缆通过建筑空气空间时\n3. 当数据和语音将在同一条电缆上运行时\n4. 当电缆通过低温区域时\n\n\
  ### 42. 下列哪个故障排除工具不用于测试铜电缆安装？\n\n1. 线序测试仪 (Wiremap tester)\n2. 万用表 (Multimeter)\n\
  3. 信号发生器和寻踪仪 (Tone generator and locator)\n4. 光时域反射仪 (OTDR)\n\n### 43. 下列哪个设备不是数据网络电缆安装人员通常使用的工具之一？\n\
  \n1. 信号发生器和寻踪仪 (Tone generator and locator)\n2. 线序测试仪 (Wiremap tester)\n3. 测试分机\
  \ (Butt set)\n4. 电缆认证器 (Cable certifier)\n\n### 44. Ralph 是某咨询公司新入职员工，该公司经常进行电缆安装。他正尝试学习更多安装内部线缆所需的工具。为此，Ralph\
  \ 发现关于电缆压钳的以下哪些陈述是正确的？\n\n1. 电缆安装人员使用压钳将 Keystone 连接器连接到散装电缆上。\n2. 电缆安装人员使用压钳将 RJ45\
  \ 连接器连接到散装电缆上。\n3. 你需要为想要连接连接器的每种电缆购买单独的压钳。\n4. 通过自己应用连接器制作跳线总是比购买预制跳线更经济效益。\n\n\
  ### 45. 关于电缆认证器，以下哪些陈述是正确的？（选择所有适用项）\n\n1. 电缆认证器消除了对信号发生器和线序测试仪等工具的需求。\n2. 电缆认证器是最便宜的电缆测试解决方案。\n\
  3. 每当新的电缆规范标准化时，电缆认证器就必须重新配置。\n4. 电缆认证器只能测试铜基电缆。\n\n### 46. Alice 是她公司网络的管理员。公司刚搬入一栋拥有现有\
  \ 6 类（Cat 6）非屏蔽双对线（UTP）布线的建筑。然而，没有任何电缆连接被标记，Alice 正试图识别并记录每条线缆的起点和终点。Alice 可以哪些工具来实现目的？（选择所有适用项）\n\
  \n1. 包嗅探器 (Packet sniffer)\n2. 回环适配器 (Loopback adapter)\n3. 信号发生器和寻踪仪 (Tone generator\
  \ and locator)\n4. 线序测试仪 (Wiremap tester)\n\n### 47. 下列哪些工具可以用来制作自己的双对跳线？（选择所有适用项）\n\
  \n1. 打线刀 (Punchdown tool)\n2. 压钳 (Crimper)\n3. 钳子 (Pliers)\n4. 剥线器 (Wire stripper)\n\
  \n### 48. 下列哪个电缆安装工具可能是最贵的？\n\n1. 压钳 (Crimper)\n2. 电缆认证器 (Cable certifier)\n3. 打线刀\
  \ (Punchdown tool)\n4. 线序测试仪 (Wiremap tester)\n\n### 49. 图中工具的功能是什么？\n\n![Reprinted\
  \ from CompTIA Network+ Study Guide: Exam N10-006, Third Edition by Todd Lammle\
  \ (Wiley, 2015)](img/c05uf001.png)\n\n转印自 CompTIA Network+ Study Guide: Exam N10-006,\
  \ Third Edition by Todd Lammle (Wiley, 2015)\n\n1. 当你将工具放置在电缆的一端时，它会产生一个可以在另一端检测到的信号。\n\
  2. 要将散装电缆连接到 Keystone 连接器，你使用该工具将每根线打入插座中。\n3. 通过将工具的末端接触铜缆，你可以检测并测量流过它的电流。\n4.\
  \ 通过将工具连接到光电缆的末端，你可以测量线缆的长度。\n\n### 50. 图中工具的功能是什么？\n\n![Reprinted from CompTIA\
  \ Network+ Study Guide: Exam N10-006, Third Edition by Todd Lammle (Wiley, 2015)](img/c05uf002.png)\n\
  \n转印自 CompTIA Network+ Study Guide: Exam N10-006, Third Edition by Todd Lammle (Wiley,\
  \ 2015)\n\n1. 当你将工具放置在电缆的一端时，它会产生一个可以在另一端检测到的信号。\n2. 要将散装电缆连接到 Keystone 连接器，你使用该工具将每根线打入插座中。\n\
  3. 通过将工具的末端接触铜缆，你可以检测并测量流过它的电流。\n4. 通过将工具连接到光电缆的末端，你可以测量线缆的长度。\n\n### 51. 图中工具的功能是什么？\n\
  \n![Reprinted from CompTIA Network+ Study Guide: Exam N10-006, Third Edition by\
  \ Todd Lammle (Wiley, 2015)](img/c05uf003.png)\n\n转印自 CompTIA Network+ Study Guide:\
  \ Exam N10-006, Third Edition by Todd Lammle (Wiley, 2015)\n\n1. 当你将工具放置在电缆的一端时，它会产生一个可以在另一端检测到的信号。\n\
  2. 要将散装电缆连接到 Keystone 连接器，你使用该工具将每根线打入插座中。\n3. 通过将工具的末端接触铜缆，你可以检测并测量流过它的电流。\n4.\
  \ 通过将工具连接到光电缆的末端，你可以测量线缆的长度。\n\n### 52. 图中工具的功能是什么？\n\n![Reprinted from CompTIA\
  \ Network+ Study Guide: Exam N10-006, Third Edition by Todd Lammle (Wiley, 2015)](img/c05uf004.png)\n\
  \n转印自 CompTIA Network+ Study Guide: Exam N10-006, Third Edition by Todd Lammle (Wiley,\
  \ 2015)\n\n1. 当你将工具放置在电缆的一端时，它会产生一个可以在另一端检测到的信号。\n2. 要将散装电缆末端连接到 RJ45 连接器，你使用该工具挤压连接器，迫使线端接触连接器的引脚。\n\
  3. 通过将工具的末端接触铜缆，你可以检测并测量流过它的电流。\n\n\n\n\n\n4. 通过将夹子连接到打线架配线模块（punchdown block）的引脚上，你可以访问电话电路以进行测试或拨打电话。\n\
  \n53. 下图所示工具的名称是什么？\n\n![摘自 CompTIA Network+ Study Guide: Exam N10-006, Third Edition\
  \ by Todd Lammle (Wiley, 2015)](img/c05uf005.png)\n\n摘自 Todd Lammle (Wiley, 2015)\
  \ 编写的 `CompTIA Network+ Study Guide: Exam N10-006, Third Edition`\n\n1. 分机 (Butt\
  \ set)\n2. 压接器 (Crimper)\n3. 信号发生器和寻踪仪 (Tone generator and locator)\n4. 打刀 (Punchdown\
  \ tool)\n\n54. Ralph 必须花一天时间完成办公室内的双绞电缆安装。承包商已经将电缆穿过墙壁和天花板。Ralph 只需要在电缆末端（包括内部布线和跳线线）上连接连接器。Ralph\
  \ 需要哪些工具？（选择所有适用项。）\n\n1. 电话杆 (Telepole)\n2. 压接器 (Crimper)\n3. 打刀 (Punchdown tool)\n\
  4. 尾纤连接器 (Pigtail splicer)\n\n55. Ralph 正在使用信号发生器和寻踪仪测试双绞电缆线路。当他在电缆一端的特定导线上使用信号发生器时，在另一端没有检测到信号。Ralph\
  \ 发现了以下哪种故障？\n\n1. 断路 (Open)\n2. 短路 (Short)\n3. 分离对 (Split pair)\n4. 串扰 (Crosstalk)\n\
  \n56. Ralph 正在使用信号发生器和寻踪仪测试双绞电缆线路。当他在电缆一端的特定引脚上信号发生器时，在另一端的两个引脚上检测到了信号。Ralph 发现了以下哪种故障？\n\
  \n1. 断路 (Open)\n2. 短路 (Short)\n3. 分离对 (Split pair)\n4. 串扰 (Crosstalk)\n\n57. Ralph\
  \ 正在使用信号发生器和寻踪仪测试网络中新安装的一些双绞电缆线路。他将无法检测到哪种电故障？\n\n1. 断路 (Open)\n2. 短路 (Short)\n\
  3. 分离对 (Split pair)\n4. 线对错接 (Transposed pairs)\n\n58. 以下哪种电故障会增加双绞电缆对串扰的敏感性？\n\n\
  1. 断路 (Open)\n2. 短路 (Short)\n3. 分离对 (Split pair)\n4. 线对错接 (Transposed pairs)\n\n\
  59. 顾问告诉 Alice，她网络中新安装的双绞电缆线路可能存在分离对。她可以使用以下哪种测试工具来检测分离对？\n\n1. 信号发生器和寻踪仪 (Tone\
  \ generator and locator)\n2. 线序测试仪 (Wiremap tester)\n3. 多用表 (Multimeter)\n4. 电缆认证仪\
  \ (Cable certifier)\n\n60. Ralph 正在使用线序测试仪测试网络中一些新安装的双绞电缆线路，他发现一条线路似乎电缆断路。然而，两端的连接器均安装正确，因此断路一定在电缆内部，该电缆长度接近\
  \ 100 米。Ralph 可以使用哪些工具来确定电缆断路的位置？（选择所有适用项。）\n\n1. 信号发生器和寻踪仪 (Tone generator and\
  \ locator)\n2. 多用表 (Multimeter)\n3. 时域反射反射仪 (Time-domain reflectometer) \n4. 电缆认证仪\
  \ (Cable certifier)\n\n61. Alice 的公司搬到了一栋预留了双绞以太网布线的建筑。然而，在使用现有的电缆线路安装公司的千兆以太网设备后，性能一直很差。在进行一些包捕获并分析流量样本后，Alice\
  \ 发现有大量的以太网帧被重传。接着，她检查了吊顶天花板内的布线。这些线路看起来并不长，而且也没有在任何主要的电磁干扰源附近。以下哪种可能是问题所在？\n\n\
  1. 部分电缆线路使用了 `T568A` 接线法，另一些使用了 `T568B`。\n2. 电缆仅连接了两对线线，而不是四对。\n3. 现有电缆不符合千兆以太网的标准。\n\
  4. 电缆末端的收发器不匹配。\n\n62. Ralph 正在安装一条新的双绞网络电缆，其中各个电缆线路在穿入时没有被正确标记。Ralph 现在必须将办公区域的每个电缆末端追踪到数据中心正确的电缆末端并对其进行正确标记。在一束未标记的电缆中，Ralph\
  \ 应该使用哪种工具找到正确的电缆？\n\n1. 电缆认证仪 (Cable certifier)\n2. 信号发生器和寻踪仪 (Tone generator and\
  \ locator)\n3. OTDR (光时域反射仪)\n4. 多用表 (Multimeter)\n\n63. Ralph 的公司雇用了一家布线公司安装一些新的光纤线路。在电缆连接到任何设备之前，Ralph\
  \ 想要确认它们已按照正确规范安装。他请了另一公司的承包商来测试这些布线。为了测试每条线路，承包商在电缆的一端连接光源，在另一端连接一个测量设备。这种测试设备的正确名称是什么？\n\
  \n1. 光功率计 (Optical power meter)\n2. OLTS (光链路测试仪)\n3. OTDR (光时域反射仪)\n4. 多用表 (Multimeter)\n\
  \n64. Ed 在一些新的双绞电缆线路上遇到了网络性能差的问题。在排除所有其他原因后，他使用信号发生器和寻踪仪测试电缆，没有发现故障。最后，他更仔细地检查了连接器，发现虽然电缆一端的引脚正确连接到另一端的相应引脚，但在某些情况下，相同颜色的线被扭在一起形成了一对。Ed\
  \ 发现了以下哪种类型的故障？\n\n1. 断路 (Open circuit)\n2. 短路 (Short circuit)\n3. 分离对 (Split pairs)\n\
  4. 错接 (Transposed wires)\n\n65. 以下哪个术语描述了传输信号沿网络介质传输时逐渐减弱现象？\n\n1. 吸收 (Absorption)\n\
  2. 延迟 (Latency)\n3. 衰减 (Attenuation)\n4. 串扰 (Crosstalk)\n\n66. 在连接公司光纤网络的设备出现一些问题后，Alice\
  \ 请来承包商测试光纤线路。承包商检测到某些线路存在大量的分贝（`dB`）损耗，这可能是问题的根源。以下哪些可能是分贝损耗的原因？（选择所有适用项。）\n\n\
  1. 电磁干扰 (Electromagnetic interference)\n2. 光纤脏污 (Dirty optical cables)\n3. 电缆长度过长\
  \ (Excessive cable length)\n4. 信号串扰 (Signal crosstalk)\n\n67. 当怀疑以太网存在双工不匹配（duplex\
  \ mismatch）时，故障排除人员应该查找哪些？（选择所有适用项。）\n\n1. 冲突 (Collisions)\n2. 飞帧 (Runt frames)\n\
  3. CRC 错误 (CRC errors)\n4. Ping 测试失败 (Failed ping tests)\n\n68. Ed 正在尝试解决导致有线网络连接完全失效的问题。以下哪些有线网络问题会导致网络连接完全失败？（选择所有适用项。）\n\
  \n1. 瓶颈 (Bottleneck)\n2. 速度不匹配 (Speed mismatch)\n3. 双工不匹配 (Duplex mismatch)\n4.\
  \ TX/RX 反转 (TX/RX reversal)\n5. 交换机端口损坏 (Bad switch port)\n\n69. Ed 正在尝试解决导致有线网络连接明显变慢的问题。以下哪些有线网络问题会导致网络连接剧慢，而不会导致完全失效？（选择所有适用项。）\n\
  \n1. 瓶颈 (Bottleneck)\n2. 速度不匹配 (Speed mismatch)\n3. 双工不匹配 (Duplex mismatch)\n4.\
  \ TX/RX 反转 (TX/RX reversal)\n\n70. Ed 发现他新安装的以太网中某些双绞电缆线路远超过了 100 米。由于电缆超过规定长度，他的网络可能会遇到哪些问题？\n\
  \n1. 抖动 (Jitter)\n2. 衰减 (Attenuation)\n3. 串扰 (Crosstalk)\n4. EMI (电磁干扰)\n\n\n\n\n\
  \n### 71. Ed 正在尝试排除他的有线网络故障，他的研究让他得到了一份可能的网络故障列表。然而，该列表相当陈旧，Ed 怀疑其中某些问题是否仍然适用。在现代千兆以太网交换机和网络适配器的默认配置下，以下哪些有线网络问题不再发生？（选择所有适用项。）\n\
  \n1. 瓶颈 (bottleneck)\n2. 速度不匹配 (Speed mismatch)\n3. 双工不匹配 (Duplex mismatch)\n4.\
  \ 发送与接收反转 (TX/RX reversal)\n\n### 72. Ed 发现新安装网络的一些双对电缆紧邻吊顶花板内的荧光灯具。由于电缆靠近灯具，网络可能会遇到以下哪些问题？\n\
  \n1. 抖动 (Jitter)\n2. 衰减 (Attenuation)\n3. 串扰 (Crosstalk)\n4. 电磁干扰 (EMI)\n\n### 73.\
  \ 你可以使用以下哪个指示器来判断适配器是否连接到正常工作的集线器或交换机？\n\n1. 速度发光二极管 (LED)\n2. 冲突 LED\n3. 链路脉冲 LED\
  \ (Link pulse LED)\n4. 状态 LED (Status LED)\n\n### 74. Ralph 想通过以太网供电 (PoE) 为位于其公司数据中心各处的摄像头供电。以太网网络目前以千兆以太网速度运行，但\
  \ Ralph 计划将摄像头连接降级为 100Base-TX，因为该标准有两对空闲线用于传输功率。关于 Ralph 的计划，以下哪种描述是正确的？\n\n1.\
  \ Ralph 的计划是正确的；只有 10Base-T 和 100Base-TX 支持 PoE。\n2. Ralph 的计划无法实现，因为 100Base-TX\
  \ 与 PoE 不兼容。\n3. Ralph 的计划可行，但没有必要将连接降级为 100Base-TX。\n4. Ralph 的计划无法实现，因为 PoE 无法为摄像头提供足够的功率。\n\
