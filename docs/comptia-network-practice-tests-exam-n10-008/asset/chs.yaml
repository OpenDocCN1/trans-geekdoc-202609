  \n### 60. D. 尽管 `DoS` 攻击通常涉及流量泛洪，但任何阻止服务器运行的攻击都可以被称为 `DoS` 攻击。永久性 `DoS` 攻击是指攻击者实际上损坏目标系统并防止其运行的攻击。这可以是实际损坏硬件的物理攻击，也可以攻击者通过更改软件或配置设置来禁用服务器。基于流量的攻击包括分布式拒绝服务\
