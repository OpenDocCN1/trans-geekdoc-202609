  \ `224.0.0.0` 网络的不同路由。\n\n127. Ed 已配置了他的工作站，在网络通信中使用 Internet 协议安全 (IPSec) 加密。他可以使用以下哪些工具来验证其网络流量已加密？\n\
  1. 多用表 (Multimeter)\n2. 数据包嗅探器 (Packet sniffer)\n3. 端口扫描器 (Port scanner)\n4. 协议分析器\
  \ (Protocol analyzer)\n5. IP 扫描器 (IP scanner)\n\n128. 下述哪个陈描述描述包嗅探器和协议分析器之间的区别？\n\
  1. 包嗅探器捕获网络流量，协议分析器检查包内容。\n2. 协议分析器捕获网络流量，包嗅探器检查包内容。\n3. 包嗅探器只捕获本地工作站的流量，而协议分析器可以捕获网络上的所有流量。\n\
  4. 没有区别。包嗅探器和协议分析器执行的功能相同。\n\n129. Ed 最近在他的网络上发现了一个恶意的动态主机配置协议 (DHCP) 服务器。在禁用该服务器后，他现在需要终止网络上\
  \ Windows DHCP 客户端当前持有的所有非法 Internet 协议 (IP) 地址租约，并让他们从授权的 DHCP 服务器请求新租约。他必须在每个\
  \ Windows 客户端上使用哪些命令来实现此？（选择所有适用）\n1. `ipconfig /dump`\n2. `ipconfig /renew`\n3.\
  \ `ipconfig /lease`\n4. `ipconfig /discard`\n5. `ipconfig /release`\n\n130. Ed 正在他的公司网络上实施\
  \ Web 服务器集群，并创建了一个筛选子网（或边界网络），Web 服务器将位于其中。该筛选子网使用网络 Internet 协议 (IP) 地址 `192.168.99.0/24`。他还安装了一个路由器，将筛选子网连接到内部网络，内部网络使用\
  \ `192.168.3.0/24` 网络地址。路由器接口的 IP 地址为 `192.168.3.100` 和 `192.168.99.1`。Ed 需要从他内部网络上的\
  \ Windows 工作站访问 Web 服务器，但现在无法这样做。由于他需要指定不同的路由器作为其默认网关，Ed 决定向他的计算机路由表添加一条筛选子网的路由。以下哪个命令将创建一个允许\
  \ Ed 访问筛选子网的路由表项？\n1. `route add 192.168.3.0 MASK 255.255.255.0 192.168.3.100`\n\
  2. `route add 192.168.99.1 MASK 255.255.255.0 192.168.3.100`\n3. `route add 192.168.99.0\
  \ MASK 255.255.255.0 192.168.99.1`\n4. `route add 192.168.3.0 MASK 255.255.255.0\
