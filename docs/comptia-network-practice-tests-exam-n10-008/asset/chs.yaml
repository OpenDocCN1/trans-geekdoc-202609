  \ Ed 刚刚为他的公司创建了一个新的 Windows 应用程序，并将其部署在公云中。他正在寻找一个能够提供已安装并配置好的 Windows 服务器的提供商。他寻求的是以下哪个服务模型？\n\
  \n1. `IaaS`\n2. `PaaS`\n3. `SaaS`\n4. `DaaS`\n5. 以上都不是\n\n## 291. 下列哪些是云数据中心多租户（multitenancy）的有效优点或缺点？（选择所有适用）\n\
  \n1. 多租户因为其他租户使用相同的硬件，存在潜在的安全风险。\n2. 多租户减少了公用事业和其他开销成本。\n3. 多租户引入了与其他租户竞争带宽的可能性。\n\
  4. 多租户通过为每个租户分配独立的虚拟机来实现隔离。\n\n## 292. 下列哪个不是基础设施即代码（IaC）部署云端虚拟机的优势之一？\n\n1. IaC\
  \ 提供了虚拟机配置的快速部署。\n2. IaC 提供了虚拟机配置的一致性。\n3. IaC 通过自动化虚拟机配置过程降低了成本节约。\n4. IaC 通过加密虚拟机配置提升了安全性。\n\
  5. IaC 通过简化虚拟机部署过程提供了弹性和可扩展性。\n\n## 293. Ralph 正在为一个企业级客户设计一个混合云部署方案，该方案需要在客户的私有网络与公共云提供商之间建立连接。客户担心该连接在用户流量高峰时期会成为速度瓶颈。Ralph\
