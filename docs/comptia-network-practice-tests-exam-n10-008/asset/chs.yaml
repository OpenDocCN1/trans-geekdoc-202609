  \n     4. 配置你的设备使用通道 `2`。\n\n89. 你的公司办公楼正在进行消防检查，而你是数据中心唯一值班的人员。消防部门的检查员问你他们在哪里可以找到关于公司数据中心使用的所有化学品和设备的文档。你把检查员带到经理办公室，但你不确定他需要的文档叫什么。以下哪种文档类型包含这些信息？\n\
  \n     1. MSDS\n\n     2. NDA\n\n     3. BYOD\n\n     4. ESD\n\n90. 下哪种以太网供电（PoE）规范使用\
  \ `10Base-T` 或 `100Base-TX` 双绞网络上的空闲线对为设备供电？\n\n     1. 4PPoE\n\n     2. Alternative\
  \ A\n\n     3. Alternative B\n\n     4. 以上所有\n\n91. iSCSI 存储区域网络协议使用称为初始化器的客户端和称为目标（targets）的服务器。然而在许多存储区域网络（SAN）中，需要一种方法让初始化器能够找到目标。iSCSI\
  \ 初始化器使用哪种技术在网络上定位 iSCSI 目标？\n\n     1. ICMP\n\n     2. DNS\n\n     3. iDNS\n\n\
  \     4. iSNS\n\n92. 你正在为一个客户部署 802.11n 无线网络，客户要求在不部署额外服务器的情况下提供尽可能的安全性。在设置无线接入点（WAP）时，你禁用了服务集标识符（SSID）广播，选择了带有预共享密钥的\
  \ WiFi 保护（WPA-PSKs），并配置了媒体访问控制（MAC）地址过滤。关于这种安排的安全性，以下哪种描述是正确的？\n\n     1. 你不应该禁用\
  \ SSID 广播，因为这会阻止用户连接到网络。\n\n     2. 这种配置在指定的设备上已经是最高安全性了。\n\n     3. 你应该使用 WiFi\
  \ 保护 II 代（WPA2）而不是 WPA，因为它对某些类型攻击的抵抗力更强。\n\n     4. 你不应该使用 MAC 地址过滤，因为会将 MAC 地址暴露在可能的攻击之下。\n\
  \n93. 以下哪种连接器用于光纤电？（选择所有适用项。）\n\n     1. DB-9\n\n     2. SC\n\n     3. BNC\n\n \
  \    4. ST\n\n     5. MTRJ\n\n     6. RJ11\n\n94. 以下哪些项可以作为物联网（IoT）设备存在？\n\n   \
  \  1. 冰箱\n\n     2. 门铃\n\n     3. 恒温器\n\n     4. 扬声器\n\n     5. 以上所有\n\n95. 你正在为公司最新的分支机构设计一个以太网网络。你目前的任务是决定为网络使用哪种以太网规范，你清楚这个决定将决定你需要购买什么种类型的电缆以及电缆安装的拓扑结构。开放系统互连（OSI）参考模型的哪些层适用于网络的布线和拓扑元素？\n\
  \n     1. 应用层和传输层\n\n     2. 传输层和网络层\n\n     3. 网络层和数据链路层\n\n     4. 数据链路层和物理层\n\
  \n96. 你正在排查一个无法访问网络的工作站。该工作站连接在一个墙座上，该墙座应为其提供访问 `192.168.4.0/24` 网络地址的 DHCP 网络。该网络上没有其他人报告问题。你检查了跳线线是否已正确插入工作站和墙座（它们是已插入的），然后在工作站上运行\
  \ `ipconfig /all` 并检查输出。根据以下 `ipconfig` 结果，哪种陈述可能是工作站问题的解释？\n\n```\nWindows IP Configuration\n\
  \  \n  Host Name . . . . . . . . . . . . : Client12\n  Primary Dns Suffix  . . .\
  \ . . . . . : \n  Node Type . . . . . . . . . . . . : Hybrid\n  IP Routing Enabled.\
  \ . . . . . . . : No\n  WINS Proxy Enabled. . . . . . . . : No\n  \nEthernet adapter\
  \ Local Area Connection:\n  \n  Connection-specific DNS Suffix  . : \n  Description\
  \ . . . . . . . . . . . : PCIe Family Controller\n  Physical Address. . . . . .\
  \ . . . . . : 60-EB-69-93-5E-E5\n  DHCP Enabled. . . . . . . . . . . : Yes\n  Autoconfiguration\
  \ Enabled . . . . : Yes\n  Link-local IPv6 Address . . . . . . . : fe80::\n  IPv4\
  \ Address . . . . . . . . . . . : \n  Subnet Mask . . . . . . . . . . . : \n  Default\
  \ Gateway . . . . . . . . . . . : \n  Lease Obtained . . . . . . . . . . . : \n\
  \  Lease Expires . . . . . . . . . . . : \n  DNS Servers . . . . . . . . . . . :\
  \ \n  NetBIOS over Tcpip. . . . . . . . : \n  DHCPv6 IAID . . . . . . . . . . :\
  \ \n  DHCPv6 Client DUID. . . . . . . : \n```\n\n     1. DNS 服务器地址错误。\n\n     2.\
  \ 缺少默认网关。\n\n     3. 子网掩码错误。\n\n     4. DHCP 范围已耗尽。\n\n97. 一位用户给 IT 帮助台打电话，报告她在访问本地服务器和互联网网站时遇到间歇性问题。以下哪些潜在问题是可以立即排除的？\
  \ \n\n     1. 故障的域名系统（DNS）服务器\n\n     2. 重复的访问控制（MAC）地址\n\n     3. 重复的 IP 地址\n\n\
  \     4. 故障的路由器\n\n98. 你最近在网络上发现了一个非法的主机配置协议（DHCP）服务器。在禁用该非法服务器后，你现在需要终止网络上 DHCP\
  \ 客户端持有的非法 IP 地址租约，并让他们从授权的 DHCP 服务器请求新租约。你必须在每个客户端上运行以下哪些命令来实现？（选择所有适用项。）\n\n \
  \    1. `ipconfig /dump`\n\n     2. `ipconfig /lease`\n\n     3. `ipconfig /release`\n\
  \n     4. `ipconfig /renew`\n\n     5. `ipconfig /discard`\n\n99. Ralph 正在读一篇关于数据中心设计的文章，他对关于东西向（east-west）和南北向（north-south）流量的引用感到困惑。以下哪种陈述最能描述数据中心东西向和南北向流量之间的差异？\n\
  \n     1. 东西向是交换机之间的流量，而南北向是交换机到路由器流量。\n\n     2. 东西向描述开放系统互连（OSI）参考模型中相同层设备之间的流量，而南北向描述\
  \ OSI 层之间的流量。\n\n     3. 东西向流量留在数据中心内部，而南北向不在。\n\n     4. 东西向是交换机和路由器之间的骨干流量，而南北向是终端系统（如服务器）的流量。\n\
  \n100. 以下哪种攻击类型涉及对合法软件产品的修改？\n\n      1. 热窝驱动\n\n      2. 逻辑炸弹\n\n      3. 恶意孪生\n\
  \n      4. 社会工程\n\n# 附录\n\n复习题答案\n\n## 第一章：网络基础\n\n\n\n\n# OSI 模型与协议分析\n\n## 1.\
  \ 数据链路层的 `Ethernet`（或 `IEEE 802.3`）协议使用 `MAC` 地址来识别本地网络上的计算机。`MAC` 地址由制造商编码在物理网络接口适配器的固件中。物理层处理信号，不涉及寻址。网络层的\
  \ `IP` 协议有其体系的寻址系统。传输层协议不涉及寻址。\n\n## 2. `ISO` 开发并发布了 `OSI` 模型，为软件和硬件开发人员提供一个概念模型。`ITU-T`（前身为\
  \ `CCITT`）协调国际电信网络和服务的开发与进步。`ANSI` 是一个私立组织，负责管理和协调一套位于美国的标准化和合规性评估系统。`IEEE` 发布了定义数据链路层和物理层标准的。这些标准统称为\
  \ `802` 系列。\n\n## 3. 网络层协议（如 `IP`）包含头部，用于指定端系统间通信的逻辑地址，并在网络中路由数据报。物理层定义了网络物理和机械特性的标准。数据链路层使用介质访问控制（`MAC`）或硬件地址，而不是逻辑地址。传输层使用端口号，而不是逻辑地址。会话层协议创建并维护端系统之间的对话。表示层协议负责信息的格式化、翻译和呈现。应用层为应用程序访问协议栈提供了入口，并为跨网络传输信息做准备工作。\n\
  \n## 4. 数据封装过程\n在应用程序生成的有效载数据能够通过 `TCP/IP` 网络进行传输之前，系统必须通过在 `OSI` 模型的三个层上应用协议头部和尾部对其进行封装。数据链路层应用头部和尾部以创建一个\
  \ `Ethernet` 帧。网络层应用头部以创建一个 `IP` 数据报。传输层应用 `TCP` 或 `UDP` 头部以创建一个段或数据报。其他模型层参与了有效载数据的传输过程，但它们不封装有效载数据。\n\
  \n## 5. 表示层实现了提供信息格式化、翻译和呈现的功能。`OSI` 模型中没有其他层级负责对应用数据进行翻译和格式化。\n\n## 6. 路由器在 `OSI`\
  \ 模型的网络层连接网络。代理服务器运行在应用层。网络接口适配器同时在数据链路层和物理层运行。集线器是物理层设备。\n\n## 7. 应用层为应用程序访问协议栈提供了入口，并为跨网络传输信息做准备。`OSI`\
  \ 模型中所有其他层都位于此层之下，并依赖此入口。\n\n## 8. 会话层负责创建和维护端系统之间的对话。这种对话可以是双向交替对话（需要端系统轮流传输），也可以双向同步对话（任何端系统都可以随时传输）。`OSI`\
  \ 模型中没有其他层在通信的端系统之间执行对话控制。\n\n## 9. 交换机的主要功能是根据其介质访问控制（`MAC`）地址处理数据，这使其成为数据链路设备。然而，许多交换机还可以根据\
  \ `IP` 地址执行路由功能，后者运行在网络层。\n\n## 10. 传输层协议\n传输层协议有两种：面向连接和无连接。面向连接的协议通过在传输任何数据之前在发送者和接收者之间建立连接，保证数据从源端到目的地的递送。无连接协议传输数据不需要端系统建立连接。物理层不使用无连接或面向连接的协议；它定义了在网络上传输和接收信息的标准。数据链路层提供物理寻址和数据传输的最终封装。网络层负责逻辑寻址和路由。会话层负责创建和维护端系统之间的对话。表示层负责信息的格式化、翻译和呈现。应用层为应用程序访问协议栈提供了入口，并为跨网络传输信息做准备。\n\
  \n## 11. `OSI` 模型的物理层与集线器、电缆和网络接口适配器相关。数据链路层与桥和交换机相关。网络层与路由器相关。传输层、会话层、表示层和应用层通常与专用硬件设备相关。\n\
  \n## 12. 唯一一个协议（如 `Ethernet`）同时添加头部和尾部的层是数据链路层。添加头部和尾部的过程被称为数据封装。所有其他封装数据的协议层只添加头部。\n\
  \n## 13. 以太网协议\n处理帧的寻址、传输和接收的 `Ethernet` 协议运行在数据链路层。每个帧都包含识别本地网络上发送系统和接收系统的硬件地址。`Ethernet`\
  \ 使用 `CSMA/CD` 介质访问方法。物理层规范包括以电脉冲或光脉冲形式传输信号表示二进制码，而不是帧。`CSMA/CA` 是无线局域网协议使用的数据链路层介质访问方法，但\
  \ `Ethernet` 不是。\n\n## 14. 在 `TCP/IP` 网络中，网络层的网协议 (`IP`) 是负责将数据递送到最终目的地的协议。数据链路层协议只关注局域网（`LAN`）设备之间或通过广域网（`WAN`）链路连接的两点之间的通信。会话层和应用层不参与数据的实际递送。\n\
  \n## 15. 网协议 (`IP`)、互联网控制消息协议 (`ICMP`) 和互联网组组管理协议 (`IGMP`) 都是网络层协议。互联网消息访问协议 (`IMAP`)\
  \ 是一种运行在应用层的邮件协议。\n\n## 16. 面向连接的传输层协议（如传输控制协议 `TCP`）为上层应用提供可靠的数据递送。无连接协议不保证信息的递送，因此不是良好选择。信息的可靠递送通常不是数据链路层、网络层或应用层的功能。\n\
  \n## 17. 集线器仅在物理层工作，通过将其所有输入信号转发到所有端口。桥和交换机在数据链路层工作，选择性地传播输入数据。路由器在网络层工作，连接局域网（`LANs`）并根据\
  \ `IP` 地址仅转发指向其他网络的流量。\n\n## 18. 物理层定义了构建网络电缆的机械和电气特性。数据链路层定义了特定的网络（`LAN` 或 `WAN`）拓扑及其特性。Alice\
  \ 实现的物理层标准取决于她选择的数据链路层协议。\n\n\n\n\n\n### 19.\n在 TCP/IP 协议族中，会话层的功能主要通过传输层协议实现：传输控制协议（`TCP`）和用户数据报协议（`UDP`）。表示层的功能通常应用层协议实现，尽管某些功能（如加密）也可以由传输层或网络层协议完成。\n\
  \n### 20. C\n传输层协议（如传输控制协议（`TCP`）和用户数据报协议（`UDP`）具有头部字段，其中包含了生成数据包的应用以及接收数据包应用的端口号。应用层、表示层和网络层不使用端口号。\n\
  \n### 21. E\nOSI 模型层从上到下的正确顺序是：应用层、表示层、会话层、传输层、网络层、数据链路、物理层。\n\n### 22. B\n交换机和网桥仅参与局域网（`LAN`）通信，因此主要位于数据链路层。它们与物理层、网络层或传输层并不相关，尽管某些交换机包含了网络层路由功能。\n\
  \n### 23. C\n流量控制是一个根据接收端的能力调整协议传输速率的过程。如果接收系统被入入数据淹没，发送端会动态地降低传输速率。在 TCP/IP 协议族中，传输控制协议（`TCP`）负责实现流量控制。`TCP`\
  \ 运行在传输层。列出的其他层都没有提供流量控制的 TCP/IP 协议。\n\n### 24. A\nOSI 模型的物理层定义了网络物理和机械特性的标准，例如布线（铜线和光纤）、连接硬件（集线器和交换机）以及信号方法（模拟和数字）。所有其他层都不涉及涉及的机械特性。\n\
  \n### 25. D\n表示层提供语法翻译服务，使两台计算机尽管使用不同的位编码方法也能进行通信。这种翻译服务还使使用压缩或加密数据的系统能够相互通信。\n\n\
  ### 26. A\nOSI 模型的物理层定义了特定于网络媒介以及信号收发的功能。所有其他层都通过软件实现，不会在物理上发送或接收信号。\n\n### 27.\
  \ B\n`IP` 是一种运行在 OSI 模型网络层的无连接协议。该层没有面向连接的协议。传输层的协议包括面向连接的传输控制协议（`TCP`）和无连接的用户数据报协议（`UDP`）。\n\
  \n### 28. A\n以太网网络适配器在数据链路层工作，通过封装网络层数据以便在网络上传输。它通过提供到网络媒介的连接并生成适当的传输信号来提供物理层功能。网络适配器不在网络层、传输层或应用层运行。\n\
  \n### 29. A, B\n超文本传输协议（`HTTP`）和简单网络管理协议（`SNMP`）运行在应用层。互联网控制消息协议（`ICMP`）和互联网组管理协议（`IGMP`）均运行在网络层。用户数据报协议（`UDP`）运行在传输层。\n\
  \n### 30. B\nOSI 表示层负责翻译各种语法，包括文本编码系统，如 `EBCDIC` 和 `ASCII`。应用层、会话层和物理层不执行此功能。\n\n\
  ### 31. D\n互联网控制消息协议（`ICMP`）通过发送操作和错误消息运行在网络层。它不封装上层协议数据。网协议（`IP`）运行在网络层，但它会封装传输层协议数据。传输控制协议（`TCP`）和用户数据报协议（`UDP`）是封装上层协议数据的传输层协议。地址解析协议（`ARP`）不封装上层协议数据，但它是数据链路层协议。\n\
  \n### 32. D\n`TCP` 连接的建立交换是三次握手，使用 `TCP` 标志来指定每个帧的消息类型。第一帧包含来自客户端的 `SYN` 标志；第二帧包含来自服务器的\
  \ `SYN` 和 `ACK` 标志；最后一帧包含来自客户端的 `ACK` 标志。\n\n### 33. C\n`MTU` 是运行在 OSI 模型特定层上的协议在一个数据包中传输的最大数据量（以字节计）。`MTU`\
  \ 不包括该协议提供的任何头部和尾部字段。对于以太网，最大帧大小为 1518 字节，包含了 18 字节的头部和尾部字段。因此，以太网的 `MTU` 为 1500\
  \ 字节。运行在 OSI 模型其他层的协议可以有不同的 `MTU`。例如，互联网协议（`IPv4`）实现的典型 `MTU` 比以太网的小。\n\n### 34.\
  \ C\n`TCP` 连接的终止阶段在客户端或服务器发送包含一个值为 1 的 `FIN` 控制位的消息时开始。列出的其他控制位与连接终止程序无关，且没有 `END`\
  \ 位。\n\n### 35. A\n总线型拓扑结构中的电缆断裂会将网络分成两部分，阻断断裂一侧的节点与另一侧的节点通信。此外，网络的两个部分都将留有一个未终止的端点，这将防止断裂两侧的计算机进行有效通信。星型或逻辑环形拓扑结构中的电缆断裂只会中断单个计算机到网络的连接。网状型拓扑通常不用于\
  \ `LANs`，但冗余网络连接是网状网络的特征，这意味着单根电缆断裂对网络没有影响。\n\n### 36. D\n有线 `LAN` 是小区域内通过公共媒介连接的计算机组。有线\
  \ `LAN` 可以使用环形、总线型或星型拓扑进行配置。\n\n### 37. B\n混合拓扑是一种使用两种或两种以上基础拓扑的网络，它们连接在一起，使得每个工作站都能与所有其他工作站通信。将四个交换机连接到总线型拓扑会将四个星型网络相结合，使得工作站相互互连。将单个工作站连接到星型和总线网络可以使该工作站访问两个网络，但不能让其他工作站访问两种拓扑。四台工作站每台都与另外三台有连接，是网状网络，而不是混合拓扑。四个连接的交换机扩展了星型拓扑，但没有创建混合拓扑。\n\
  \n### 38. B\n局域网（`LAN`）正如其名，是包含在地理区域内的计算机组。`WANs`（广域网）连接地理位置遥远的 `LANs`。城域网（`MANs`）不限于小区域；它们通常比\
  \ `LAN` 大但比 `WAN` 小。园区网（`CAN`）通常包括一组相邻的建筑，例如公司或大学建筑。\n\n### 39. A\n`WANs`（广域网）连接地理位置遥远的\
  \ `LANs`。局域网（`LAN`）正如其名，是一组计算机，而不是其他 `LANs`，且包含在小区域内。城域网（`MANs`）连接单个城市区域内的 `LANs`；它们不限于小区域。`MAN`\
  \ 通常比 `LAN` 大但比 `WAN` 小。园区网（`CAN`）通常包括一组相邻的建筑，例如公司或大学建筑。\n\n\n\n\n\n### 40. A. 总线拓扑需要在总线的每端都配备终端电阻，以便在信号到达电缆末端时将其消除，防止它们反向反射并干扰新传输的信号。星型、环形和网状拓扑不需要终端电阻。\n\
  \n### 41. D. 如今安装几乎所有新的以太网网络都使用星型或分层星型拓扑，使用一个或多个交换机作为布线枢纽。\n\n### 42. A. 存储区域网络（SAN）是一种专门传输服务器与存储设备之间流量的网络。个人局域网（PAN）提供与单个个人相关的设备（如智能手机）之间的通信。广域网（WAN）是连接不同地理位置设备或网络的网络。城域网（MAN）是\
  \ WAN 的一种类型，用于连接有限地理区域内的设备。\n\n### 43. D. 软件定义广域网（SDWAN）是一种根据当前流量组合自动配置 WAN 路由器的技术。因此，它不适用于\
  \ PAN。蓝牙、Z-Wave 和近场通信（NFC）都是短距离无线技术，能够提供 PAN 设备之间的通信。\n\n### 44. A, C. WLAN 可以使用自组拓扑（ad\
  \ hoc），即设备之间直接通信；或使用基础设施拓扑，即无线设备连接到接入点。总线和星型拓扑仅用于有线网络。\n\n### 45. A. 第一批以太网网络使用了通常被称为厚以太网或\
  \ `10Base5` 的物理层实现。该网络在总线拓扑中使用同轴电缆。后的以太网标准在星型拓扑中使用双绞线。以太网从未使用过环形或网状拓扑。\n\n### 46.\
  \ A, C. 集线器或交换机可以作为以太网星型拓扑中心的布线枢纽。网络上的每个设备都通过电缆连接到集线器或交换机。路由器用于连接各个网络；它们不能作为星型拓扑的中心。\n\
  \n### 47. C. 网状拓扑是指每个节点都与其他每个节点直接连接，因此通过网络提供了完全冗余。在星型拓扑中，每个节点都连接到一个中心枢纽，为每个节点提供到网络其余部分的单一路径。在环形拓扑中，每个节点与另外两个节点连接，为通过网络提供了两条可能的路径。在总线拓扑中，节点以链形式连接在一起，不提供冗余。\n\
  \n### 48. A. `10Base2` 是细以太网的物理层规范，它在总线拓扑中使用同轴电缆。`10Base-T`、`100Base-TX` 和 `1000Base-T`\
  \ 都在星型拓扑中使用双绞线。\n\n### 49. B, D. 个人区域网（PAN）连接与单个个人相关的设备（如智能手机），且几乎总是无线的。无线局域网（WLAN）定义上就是无线的。广域网（WAN）通常跨越很距离，且至少部分是有线的。存储区域网络（SAN）需要高性能，且几乎总是有线的。\n\
  \n### 50. B. 波分复用（DWDM）已成为城域光网络建设中的流行技术，因为它解决了其他光技术（如同步光网络 SONET）在扩展性和成本方面的一些限制。DSL、卫星和电缆提供商通常不使用\
  \ DWDM。\n\n### 51. C. 对等网络要求每台工作站维护账户，以便对访问其共享资源的用户进行认证。在客户端/服务器网络中，认证是集中的。对等网络可能比客户端/服务器网络更难管理，但它们本质上并不不安全。在互联网上共享版权内容的对等网络是违法的，但在对等网络上共享私有资源是非法的。对等网络上的工作站不需要共享其资源，但它们具备这种能力。\n\
  \n### 52. D. DSL 技术提供更高的数据速率，因为它使用的频率范围高于标准语音频谱。DSL 连接使用 `10 kHz` 及以上的频率，而标准语音频谱使用\
  \ `300 Hz` 到 `4 kHz`。DSL 不使用单独的控制电路，也不执行 CRC 功能。此外，DSL 技术是纯数字的，不需要模拟量数字转换。\n\n###\
  \ 53. C. 速率自适应数字用户线（RADSL）技术可以根据线路状况调整其传输速率。高比特率数字用户线（HDSL）、极高比特率数字用户线（VDSL）和互联网数字用户线（IDSL）不使用速率自适应传输。\n\
  \n### 54. D. CATV 网络使用宽带信号，这使得许多信号可以占用通道。DSL 和 ISDN 不使用宽带信号。SONET 是定义光纤连接的物理层标准。\n\
  \n### 55. B. 针对这种场景，给出的选项中最佳的是专用租线连接。这是因为带宽需求是恒定的，且数据传输速率很高。为了支持 `40 Mbps` 的数据速率，Ed\
  \ 应该推荐 T-3 专用租线，其运行速度为 `44.735 Mbps`。标准调制器连接、CATV 和 ADSL 连接都太慢了。\n\n### 56. D. 在这种场景下，最佳解决方案是\
  \ Ralph 使用现有的 CATV 服务进行远程连接。CATV 提供的数据速率比标准的调制器对调制器服务更快，并支持 VPN 连接。专用分-1 线路昂贵，通常不用于远程用户连接。由于\
  \ Ralph 的电话线没有通过管道传输，且距离局端机超过了 `18000 英`，他可能无法使用 DSL 技术，因为它需要良好的线路和靠近局端机。\n\n###\
  \ 57. A. PSTN（公共用电话网）是模拟电路交换网络。CATV、DSL 和 SONET 都是数字网络。\n\n### 58. D. 在 DSL 连接中，用户端需要一个信号分路器将低频语音范围与数据流量使用的高频分开。高频信号在局端机通过\
  \ `DSAM` 设备处理。携带语音流量的低频信号在局端机通过 `CODEC` 设备处理。DSL 不需要信号终端。\n\n### 59. B, C. 有两个因素影响\
  \ DSL 传输速率。一个是到局端机的距离，另一个是线路状况和质量。为了让 DSL 实现更高数据速率，站点必须靠近局端机并使用高质量线路进行信号传输。其他选项不是\
  \ DSL 传输的因素。\n\n### 60. B. 分界点（demarc）是外部电信业务与客户私有网络相的地方，通常是业务进入建筑的地方。分界点也是网络管理员责任结束的地方。如果分界点之外出现问题，由服务提供商负责修复。分界点内部则是网络管理员的问题。\n\
  \n### 61. B. 对称数字用户线（SDSL）中的“对称”一词意味着服务在两个方向上提供等量的带宽。非对称数字用户线（ADSL）中的“非对称”意味着服务提供的下行带宽大于上行带宽。电缆和卫星服务也是非对称的，提供的下行带宽大于上行带宽。\n\
  \n\n\n\n\n62. D. 租线路分界点的网络接口设备（`NID`）可以是一个简单的 `RJ-45` 接口，但许多服务提供商会安装 `smartjacks`，它们还可以提供信号转换、诊断测试和其他功能。打线架（Punchdown\
  \ blocks）、`110 blocks` 以及通道服务单元/数据服务单元（`CSU/DSUs`）都是位于分界点内部、用户私有网络上的电信组件。\n\n63.\
  \ B, C. `ISDN` 和 `DSL` 都是远程访问技术，允许用户同时传输语音和数据。为了实现这一点，`DSL` 将较低的模拟频率（语音）范围从较高的数字频率（数据）范围分开，而\
  \ `ISDN` 提供了多个数据通道（称为 `B 信道`），允许语音和数据的同时传输。宽带电缆电视网络通常可以支持支持语音和数据通信，但它们使用 IP 协议语音（`VoIP`）通过互联网传输语音流量，而不是通过\
  \ `PSTN`。拨号连接和 `SONET` 不支持语音和数据的同步传输。\n\n64. D. 分界点（demarc）是服务进入建筑的地方，也是服务提供商物理层责任结束的地方。配线架（`patch\
  \ panel`）、交换机（`switch`）和防火墙（`firewall`）都在网络内部，由用户负责。\n\n65. E. `T-3` 租线路连接等同于 28\
  \ 条 `T-1` 连接。每个 `T-1` 包含 24 个通道，因此 `T-3` 总共有 672 个通道（`28 × 24`）。\n\n66. C. `T-3`\
  \ 租线路连接等同于 28 条 `T-1` 连接。每个 `T-1` 包含 24 个通道，因此 `T-3` 总共有 672 个通道（`28 × 24`），总传输率为\
  \ 44.736 Mbps。\n\n67. B. 同步光纤（`SONET`）标准定义了 51.84 Mbps 的基础数据传输速率，该并在各种光载波层级上倍增。因此，`OC-3`\
  \ 连接的速率为 155.52 Mbps，`OC-12` 为 622.08 Mbps，以此类推。同步数字体系结构（`SDH`）是 `SONET` 的欧洲等效标准。集成业务数字网络（`ISDN`）是一种使用公共交换电话网（`PSTN`）结合语音和数据服务的业务，而数字用户线路（`DSL`）是一种允许用户同时传输语音和数据的远程访问技术。\n\
  \n68. B. 多协议标签交换（`MPLS`）是一种数据传输传输机制，它为单个数据包分配标签，然后根据这些标签路由数据包。帧中继（`Frame relay`）、异步传输模式（`ATM`）、基于以太网的点对点协议（`PPPoE`）和软件定义广域网（`SDWAN`）都不为数据包分配标签。\n\
  \n69. A, C. 会话建立协议（`SIP`）主中继为统一通信网络的私有域和公有域之间提供连接。IP 协议语音（`VoIP`）网关为 `IP` 网络与公共交换电话网（`PSTN`）之间提供连接。这两者都为用户私有网络与服务提供商提供的网络之间提供了通道。通道服务单元/数据服务单元（`CSU/DSU`）是一种为私有网络上的路由器（`router`）提供租线路访问的设备。`smartjack`\
  \ 为租线路用户提供信号转换、诊断测试和其他功能。\n\n70. A. 同步数字体系（`SDH`）是 `SONET` 的欧洲等效标准。光载波 3（`OC-3`）是\
  \ `SONET` 的速率。`E-3` 是 `T-3` 的欧洲标准。异步传输模式（`ATM`）是一种以单元形式传输数据的协议。\n\n71. B. 通道服务单元/数据服务单元（`CSU/DSU`）是一种为私有网络上的\
  \ `router` 提供租线路访问的设备。`smartjack` 为租线路用户提供信号转换、诊断测试和其他功能。虚拟专用网（`VPN`）是一种安全设备。\n\n\
  72. D. 入侵检测系统/入侵防御系统（IDS/IPS`）是一种能够检测并阻止恶意活动的软件。\n\n73. B. 租线路分界点上的网络接口设备（`NID`）可以是一个简单的\
  \ `RJ-45` 接口，但许多服务提供商会安装 `smartjacks`，它们还可以提供信号转换、诊断测试和其他功能。\n\n74. D. `OC-1` 连接的速率为\
  \ 51.84 Mbps。`E-1` 为 2.048 Mbps。`T-3` 为 44.736 Mbps，`T-1` 为 1.544 Mbps。\n\n75. C.\
  \ 电缆数据传输规范（`DOCSIS`）是一种在电缆上传输数据的标准。\n\n76. B, C. 帧中继（`Frame relay`）提供永久虚拟电路（`PVCs`）和交换虚拟电路（`SVCs`）。`SRV`\
  \ 是域名系统（`DNS`）中的一种记录类型，超物理接触（`UPC`）是一种光纤连接器。\n\n77. C, D. 电缆宽带和 `DSL` 用户通常连接到运行以太网的\
  \ ISP 网络，但以太网没有内置身份验证或加密机制。`PPP` 能够使用外部身份验证和加密协议，因此通过将 `PPP` 封装在以太网帧中，用户能够安全地登录\
  \ ISP 网络。租线路（如 `T-s`）和同步光纤网络（`SONET`）连接不使用以太网连接，因此不需要 `PPPoE`。\n\n\n\n\n\n### 81.\
  \ D\n在大多数虚拟化产品中，当你在一个主机计算机上创建多个虚拟机时，它们可以使用内置的虚拟交换机功能进行内部通信。具有多个网络适配器的计算机可以作为路由器，但不能作为交换机。三层交换机可以提供连接\
  \ VLAN 的虚拟路由器，但不能提供虚拟交换机。允许不同交换机上的 VLAN 通信的功能称为中继（trunking），而不是虚拟交换。\n\n### 82.\
  \ B\nI 类虚拟化不需要主机操作系统，而 II 类虚拟化则需要。I 类和 II 类虚拟化都可以使用带有硬件虚拟辅助的处理器，但只有 I 类需要它。虚拟化类型对支持的虚拟机数量不加任何限制；任何限制都取决于具体的实现方式。I\
  \ 类和 II 类虚拟化都可以在虚拟机之间共享单个处理器。\n\n### 83. B\n你可以在虚拟交换机上创建虚拟局域网（VLAN），就像在许多物理交换机上创建它们一样。在大多数情况下，虚拟组件的功能与其物理对应设备相同。虚拟网卡是虚拟机的组成部分，因此不提供跨越网络的功能。虚拟路由器工作在网络层，虚拟防火墙工作在应用层，因此这两者都不能托管运行在数据链路层的\
  \ VLAN。\n\n### 84. B\n就像物理网络接口卡（NIC）一样，虚拟网卡也被分配了 6 字节的 MAC 地址，使其能够被数据链路层协议识别。然而，与物理网卡不同，修改虚拟网卡上的\
  \ MAC 地址通常是容易的。虚拟交换机像物理交换机一样，不是可寻址设备，因此在未托管网络中它们没有 MAC 地址。虚拟机程序（hypervisor）是主机服务器上实现虚拟化的组件，因此它不需要\
  \ MAC 地址。虚拟防火墙工作在应用层，因此不需要数据链路层 MAC 地址。在托管网络中，这些设备具有 MAC 地址以便与管理控制通信，但在未托管网络中不需要地址。\n\
  \n### 85. A\n虚拟机程序是负责管理虚拟机并为其运行提供虚拟化硬件环境的硬件或软件组件。虚拟服务器和虚拟交换机是由虚拟机程序启用的虚拟网络基础设施的组成部分。虚拟专用网络（VPN）汇聚器是一种路由器，允许多个远程客户端连接到网络；它与虚拟网络没有任何关系。\n\
  \n### 86. C\n带有虚拟机程序、且可以在上面创建虚拟机的计算机被称为主机（host）。虚拟机本身被称为客人（guest）。网络附属存储（NAS）是指连接到网络的包含共享驱动器的设备。存储区域网络（SAN）是一个专用于共享存储设备的独立网络。\n\
  \n### 87. A\n事实上，虚拟交换机可以拥有无限数量的端口，而物理交换机受限于设备中物理端口的数量。虚拟和物理交换机都可以支持虚拟局域网（VLAN）。虚拟交换机可以将流量转发到主机服务器。物理交换机并不总是包含三层（路由）功能。\n\
  \n### 88. E\n虚拟防火墙是执行与物理网络防火墙相同功能的服务或设备：数据包过滤和监控。在虚拟环境中，防火墙可以采用安装在客人虚拟机或虚拟机程序主机系统上的软件组件形式存在。防火墙也可以整合到虚拟交换机中。\n\
  \n### 89. B\n帧中继（Frame relay）是一种分组交换服务，它通过通过云端复用流量，使用单条租线代替多条租线。该服务可以创建连接订阅者网络到多个目的地的虚拟电路，消除了对每个远程站点使用专用租线的需要。E-1\
  \ 是欧洲版的 T-1 租线，它并不取代多条 T-1。异步传输模式（ATM）是一种基于交换的广域网技术，而点点协议（PPP）是一种在两个端系统之间提供数据链路连接的协议。两者都不是多条\
  \ T-1 的替代品。\n\n### 90. D\n网络地址转换（NAT）通过将带有私有地址生成的数据包替换为公共 IP 地址，使私有网络上的工作站能够访问互联网。二层隧道协议（L2TP）、IPsec\
  \ 和多点通用路由封装（MGRE）都是将数据包以加密形式封装在另一种协议中的协议，以确保内容安全。\n\n### 91. B\n由欧洲电信标准协会（ETSI）发布的\
  \ NFV 规范要求三个主要组件：虚拟化网络函数（VNFs），它们是标准网络服务（如防火墙和负载均衡器）的软件实现；网络函数虚拟化基础设施（NFVI），它是托管\
  \ VNFs 的硬件/软件环境；以及网络函数虚拟化管理与编排（NFV-MANO）框架，它包含了部署和管理 NFVI 及 VNFs 的元素。网络函数虚拟化行业规范小组（NFV\
  \ ISG）是 ETSI 内部开发 NFV 规范的小组；它不是三个组件之一。\n\n### 92. A\n网络介质提供了连接化计算机之间的物理连接。这种连接可以通过铜基、光纤或无线介质实现。网络介质不是协议，它不传递数据包；它只传输信号。网络介质不处理电脉冲或光脉冲并转换为数据；它只携带收发器生成的信号。\n\
  \n### 93. D\n铜电缆使用电信号传输数据。光纤是一种电缆类型，而不是信号类型。微波信号无法通过铜电缆传输。红外信号仅用于无线网络。\n\n### 94.\
  \ E\n共同开发 T568b 文档（该文档定义了语音数据通信结构化布线系统的标准）的三个组织是美国国家协会（ANSI）、电信行业协会（TIA）和电子工业协会（EIA）。所有其他选项都不是标准组织或布线标准。\n\
  \n### 95. D\n用于将电视机连接到 CATV 网络的缆类型和连接器是带有螺纹 F 型连接器的同轴电缆。虽然 CATV 网络通常使用光纤电缆和 ST 连接器进行户外连接，但它们内部连接电视机时并不使用光纤。带有\
  \ BNC 连接器的同轴电缆最用于细以太网（Thin Ethernet）LAN，而不是 CATV 网络连接。双线电缆和 RJ-45 连接器用于太网 LAN 和电话网络，但不用于\
  \ CATV 网络。AUI 电缆和吸血鬼连接器用于粗以太网网络。双轴电缆用于 SATA 3.0 设备和 100 Gbit 太网连接，但不用于 CATV 连接。\n\
  \n### 96. A\n用于粗以太网网段的电缆类型是称为 RG-8 的同轴电缆。RG-58 用于细以太网网段。RJ-45 是用于数据网络双线布线的连接器类型。RJ-11\
  \ 是用于电信网络双线布线的连接器类型。\n\n### 97. B\nRG-58 同轴电缆专用于细以太网网段。RG-8 电缆用于粗以太网网段。RJ-45 是用于数据网络双线布线的连接器类型。RJ-11\
  \ 是用于电信网络双线布线的连接器类型。\n\n\n\n\n\n### 98. A. `66 block` 是一种用于电话系统的打线模块，于 1962 年首次引入。到\
  \ 2000 年，几乎所有的商业电话安装都开始使用 `110 blocks` 代替；目前 `110 blocks` 仍在在使用，智能接头和配线架也是如此。\n\n\
  ### 99. C. `Krone LSA-Plus` 是一种在欧洲安装中常用的专有电信连接器类型。`66 block` 是美国电话系统中一种过时的打线模块。多点通用路由封装（`mGRE`）是一种用于封装网络层协议的技技术；它不是一种打线模块。`BIX`（建筑行业交叉接线）是一种美国专有的电信连接系统。\n\
  \n### 100. A, D. `RG-6` 和 `RG-59` 是 75 欧姆电缆，仍用于电缆电视及类似的连接。`RG-8` 和 `RG-58` 是 50\
  \ 欧姆电缆，曾分别用于厚以太网（Thick Ethernet）和细以太网（Thin Ethernet），但已不再被广泛使用。\n\n### 101. A, B,\
  \ C. 将 `APC` 连接到 `UPC` 会产生不匹配的连接，导致极高的插入损耗（衰减）。`APC` 产生的插入损耗比 `UPC` 大，但回损（反射）较小。连接器上使用绿色外壳或主体使用的是\
  \ `APC` 而不是 `UPC`。\n\n### 102. D. `Bayonet-Neill-Concelman`（`BNC`）是一种用于同轴电缆的连接器。用户连接器（`SC`）、机械传输注册接头（`MT-RJ`）和直插头（`ST`）都是光纤连接器的类型。\n\
  \n### 103. C. 千兆接口转换器（`GBIC`）收发器标准于 1995 年首次发布，定义了 1.25 Gbps 的最大数据传输速率。2001 年引入的小型封装可插拔模块（`SFP`）标准使其几乎过时，`SFP`\
  \ 以相同的最高速度运行，但尺寸更小。该标准的后续变体，如 `SFP+`、四路小型封装可插拔（`QSFP`）和 `QSFP+`，定义了具有更快传输速率的设备。\n\
  \n### 104. B. 数据通信的双对布线主要有两种类型：非屏蔽双对（`UTP`）和屏蔽双对（`STP`）。两种类型均可用于星型拓扑。`UTP` 和 `STP`\
  \ 电缆包含四对扭绞的八根铜导体。`UTP` 和 `STP` 电缆使用 `RJ-45` 连接器将终端系统连接到交换机、配线架和墙壁面板。`RG-8` 和 `RG-58`\
  \ 同轴电缆只能用于总线拓扑。光电缆可用于星型拓扑，但它使用玻璃或塑料导体，且不使用 `RJ-45` 连接器。\n\n### 105. C. 双对电缆中的扭绞可以防止不同导线上的信号相互干扰（这称为\
  \ `crosstalk`），并提供对外部电磁干扰的抗力。扭绞对碰撞没有影响。扭绞无法完全消除 `EMI` 的影响。扭绞与电缆的弯曲半径允许无关。\n\n###\
  \ 106. A. 压接器或压接工具是一种是一种带有一组模具的钳状设备。安装人员使用压接器来压紧 `RJ-45` 或 `RJ-11` 连接器的两半，使内部的导线将连接器固定在电缆上。安装人员使用接线工具将两个电缆段接在一起。没有名为\
  \ `pigtail` 或 `patch` 的工具。\n\n### 107. C. 细以太网网络使用一种名为 `RG-58` 的 50 欧姆同轴电缆，直径为 0.195\
  \ 英，并使用 `BNC` 连接器。带有 `F` 连接器的 75 欧姆同轴电缆用于电缆电视网络，而 `RG-8` 同轴是厚是以太网网络使用的电缆。\n\n###\
  \ 108. B, C, E. 细以太网网络使用 `BNC` 连接器。厚以太网网络使用 `N-type` 连接器。所有非屏蔽双对（`UTP`）以太网网络都使用\
  \ `RJ-45` 连接器。`F-type` 连接器用于同轴电缆，通常用于电缆电视安装。`DB-9` 连接器常用于串口通信。\n\n### 109. D. 细以太网网络使用一种从每台电脑到下一台电脑的同轴电缆，形成总线拓扑。为了将电缆连接到网络计算机，每个网络接口适配器都连接有一个\
  \ `T-connector`，带有两个额外的公 `BNC` 连接器，您在上面连接两段长度的网络电缆。\n\n### 110. B, D, E. 光电缆连接器均基于相同的基本原理工作，但有多种规格可供，包括直插头（`ST`）、本地连接器（`LC`）和机械传输注册接头（`MT-RJ`）。`RJ-11`\
  \ 是双对电缆连接器，`F` 连接器用于同轴电缆。\n\n### 111. E. 厚以太网安装使用一种名为 `RG-8` 的同轴电缆。为了将节点连接到网络，安装人员从计算机运行一根名为适配器单元接口（`AUI`）的线，使用吸血嘴（`vampire\
  \ tap`）与导体接触。\n\n### 112. D. 电信房中的连接枢被称为配线架。`telepole` 是用于安装电缆的工具。`backbone` 是连接其他局域网（`LANs`）的网络骨干。边界点\
  \ `demarc` 是服务到达客户的地方。光纤分路器用于光纤，而非非屏蔽双对（`UTP`）。\n\n### 113. A, C. 单模光纤比多模光纤能够跨越更远的距离，因为它的纤芯窄。由于使用光脉冲而非电，所有光缆对电磁干扰免疫。\n\
  \n### 114. A, C, D. 语音电话网络的性能要求没有数据网络那么严格，因此不易受到串扰和其他类型干扰的影响。结果安装人员通常为电话使用较大的 UTP\
  \ 电缆。UTP 电缆有包含 25 对线和 100 对线的配置，这使得安装人员可以使用单根电缆服务多个用户。UTP 数据网络的打线模块带有 8P8 连接器称为\
  \ `110 blocks`。旧的打线模块标准是 `66 block`。很少用于数据网络，`66 blocks` 仍出现在许多电话安装中。\n\n### 115.\
  \ B, C. 单模光纤具有更小的纤芯，跨越距离比多模远。单模光纤还使用激光光源，弯曲半径更大，且不需要接地。\n\n### 116. D. 安装人员使用打线工具将批量电缆的末端连接到墙壁面板和配线架上的插座。压接器或压接工具是一种钳状设备，使安装人员能够压紧\
  \ `RJ-45` 或 `RJ-11` 连接器的两半。\n\n### 117. A. 多模光纤缆最符合客户的需求。光缆支持所需的 1000 Mbps 数据速率，并能连接距离超过\
  \ 1000 英的网络。光缆对电磁干扰免疫。虽然多模和单模光纤都能满足公司的通用需求，但在这种情况下，多模更好，因为它比单模光纤便宜。双对布线（`STP` 或\
  \ `UTP`）满足数据速率和成本要求，但不支持超过 100 米的连接。细同轴电缆不支持该速率或超过 185 米的距离。\n\n\n\n\n\n### 118.\
  \ A, B, C\n`BNC` 连接器用于同轴细型以太网，`N-type` 连接器用于粗型以太网。`F-type` 连接器用于同轴电缆电视安装。直插式 (`ST`)\
  \ 连接器用于光纤电，`RJ-11` 连接器用于电话安装。\n\n### 119. C\n使用 `CAT6` 或 `CAT6a` `UTP` 电缆均可提供当前所需的\
  \ `1 Gbps` 数据速率，并具有未来迁移到 `10 Gbps` 的路径。连接两个局域网的骨干布线需要使用光纤，因为它超过了双线和同轴电缆的距离限制。`CAT5`\
  \ 电缆理论上可以在 `1 Gbps` 下运行；但它无法在 `10 Gbps` 下运行。\n\n### 120. D\n细型以太网是最容易受到电缆中断威胁的网络。如果总线型网络被切断，其上的工作站都会受到影响，因为电缆段的一端不再被终端。千兆以太网使用星型拓扑，这意味着只有使用断开电缆的那台计算机会与网络分离。`FDDI`\
  \ 双环网络可以在单次电缆中断的情况下生存而不影响任何工作站。\n\n### 121. A\n你使用打线工具（punchdown block tool）将大批量电缆运行的末端连接到墙壁和配线架上的插座。处理步骤如下：\n\
  \n1. 剥掉电缆末端的部分护皮以露出导线。\n2. 分开末端的绞线线对。\n3. 为每根导线剥去少量绝缘层。\n4. 将导线插入插座相应的触点中。\n5. 将裸线压入两个保持它的金属触点之间以固定它。\n\
  6. 剪掉超出触点的多余电线。\n\n你必须对内部电缆运行的两个端都重复打线过程。\n\n### 122. D\n`ST`、`SC`、光纤 `LC` 和 `MT-RJ`\
  \ 都是用于光纤的连接器。`F-type` 连接器用于同轴电缆。\n\n### 123. D, E, F\n6a 类 (`CAT6a`) 双绞电缆是 `CAT6`\
  \ 的变体，允许你创建长度长达 100 米的 `10GBase-T` 网络。7 类 (`CAT7`) 电缆对单个线对和整个电缆都增加了屏蔽，具有更强的抗干扰和抗噪声能力。`CAT7`\
  \ 也支持 100 米的 `10GBase-T` 段。`CAT8` 电缆支持高达 `2 GHz` 的带宽，比 `CAT6a` (`500 MHz`) 或 `CAT7`\
  \ (`600 MHz`) 更适合 `10GBase-T` 网络。`CAT5` 和 `CAT5e` 不适用于 `10GBase-T`。你可以使用 `CAT6`\
  \ 用于 `10GBase-T`，但它被限于 55 米长的段。\n\n### 124. C, D\n`DB-9` 和 `DB-25` 连接器曾无处不在于个人电脑上，为调制解调器、打印机和其他设备提供外围连接。它们以后已在很大程度上被\
  \ `USB` 取代了。\n\n`BNC` 连接器用于细型以太网网络，但它们已被带有 `RJ-45` 连接器的非屏蔽双绞 (`UTP`) 电缆取代。`RJ-11`\
  \ 连接器用于电话连接。\n\n### 125. A\n`CAT3` 电缆最初设计用于语音级电话网络，后来被认证用于数据网络。`CAT3` 电缆可以支持从 `4\
  \ Mbps` 到 `100 Mbps` 的数据传输速率（使用已过时的 `100Base-T4` 和 `100VG-AnyLAN` 标准）。尽管这种电缆可以在\
  \ `100 Mbps` 下运行，但很少以超过 `10 Mbps` 的速度运行。`CAT5` 电缆是 `CAT3` 主要替代品，支持高达 `100 Mbps`\
  \ 的速率。`CAT5e` 和 `CAT6` 的额定速率高达 `1 Gbps`，如千兆以太网所示。`CAT6` 甚至可以在短距离内支持 `10 Gbps` 的传输速率。\n\
  \n### 126. E\n由于公司员工少、地点单一且有成本限制，最佳解决方案是带有预制双绞布线和外部安装方法的星型拓扑。星型拓扑使用中央交换机。带有已连接器的预制双绞布线将成本降至最低。由于员工都位于同一栋建筑内，拥有共用墙壁和吊顶，因此外部安装方法是最佳选择。千兆以太网无法使用总线拓扑或同轴电缆。Ed\
  \ 可以在千兆以太网的星型拓扑中使用光纤，但安装更加困难且昂贵。使用大批量电缆和预制电缆的内部安装比外部安装更贵，通常用于较大的网络。\n\n### 127.\
  \ B, D\n如今局域网中使用的主要电缆类型是多模光纤和非屏蔽双绞线。单模光纤主要用于远程广域网 (`WAN`) 连接，同轴电缆已不再用于局域网。\n\n###\
  \ 128. B, D, F\n同轴电缆在同一护层内有两个共享共同轴线的导体。这些导体被外层的 `PVC` 或聚四氟绝缘护层包围。铜电缆传输电信号。\n\n###\
  \ 129. F\n所有千兆以太网实现都需要四对线以实现 `1000 Mbps` 的传输速率。只有光纤传输光脉信号。\n\n### 130. B, C, D\n\
  `CAT5` 电缆是最初用于高达 `100 Mbps` 传输速率的标准。`CAT5e` 和 `CAT6` 支持 `1000 Mbps`。这三种标准也支持 `10\
  \ Mbps` 速率。`CAT3` 支持 `10` 和 `100 Mbps`。\n\n### 131. A, B, D, E, F\n光纤有两种类型：多模和单模。光纤电缆在光源（`LED`\
  \ 或激光）、电缆等级（玻璃或塑料）以及核心导体尺寸上有所不同。单模使用高等级的玻璃导体和激光光源。多模使用 `LED` 光源。两种类型都可以使用 `ST` 或\
  \ `SC` 连接器将终端设备物理连接到光纤网络。光纤用于远距离扩展网络。光纤不使用 `IDC` 连接器，后者用于屏蔽双绞线 (`STP`) 电缆。\n\n###\
  \ 132. A, D, F\n使用无连接器的大批量电缆、墙插和架式配线架都是内部安装的特征。内部安装通常覆盖大区域，需要穿过墙壁、天花板并绕过障碍物，布线难以移动。硬芯布线用于较长的电缆运行，而从节点到墙插的短距离连接使用带连接器的绞芯电缆。\n\
  \n### 133. B\n`40GBase-T` 是一种 40 Gigabit/秒 (`Gbps`) 以太网规范，要求在 30 米以内使用四对 `CAT8`\
  \ 双绞布线。`10GBase-T` 和 `100Base-TX` 不需要 `CAT8` 电缆，而 1000Base-SX 是一种光纤标准。\n\n### 134.\
  \ E\nRalph 应该使用带有冗余光纤运行和内部安装方法的网状拓扑。这将满足连接局域网并提供冗余和容错的要求。光纤电缆不受电磁干扰 (`EMI`) 的影响，并可以跨越远距离。内部安装方法通常用于终端系统间地理距离较大的网络。\n\
  \n星型拓扑无法满足需求，因为它不提供冗余。双绞电缆无法跨越 100 米的距离，且易受 `EMI` 影响。同轴电缆无法跨越 500 米的距离，同样易受 `EMI`\
  \ 影响。总线拓扑无法使用双绞布线，且不支持超过 500 米的电缆运行。\n\n\n\n\n\n### 135. B\n尽管设计要求使用过时的技术，但 `Thin\
  \ Ethernet`（细以太网）网络的速率 10 Mbps，可以在最大 185 米的范围内支持 20 个工作站，从而实现了主要目标。然而，`Thin Ethernet`\
  \ 使用铜基同轴电缆，容易受到 `EMI`（电磁干扰）的影响，且采用总线拓扑，无法容忍电缆中断。因此，解决方案没有实现任何次要目标。\n\n### 136. D\n\
  光纤对电缆中断的容忍性并不高于 `UTP`。某些光纤网络具有容错能力，但 `Ethernet` 光纤规范并不具备。连接计算机和交换机的 `UTP` 电缆长度不能超过\
  \ 100 米，因此两台计算机之间的最大距离为 200 米。用铜基电缆连接两座建筑会在它们之间产生电气连接，这可能是危险的。光纤不会产生电气连接。光纤也不受制造设备产生的\
  \ `EMI` 影响。\n\n### 137. A, B\n`FLP` 信号是 `10Base-T` 标准中定义的 `Normal Link Pulse (NLP)`\
  \ 信号的增强，用于验证链路的完整性。在 `100Base-TX` 中，`FLP` 信号保留了该功能，但它们允许多速率设备协商运行速率。`FLP` 信号并不指示冲突或坏帧。\n\
  \n### 138. B\n`10GBase-CX4` 规范要求使用段长不超过 15 米的双绞铜电缆。`10GBase-LR`、`10GBase-ER`、`10GBase-LX4`\
  \ 和 `10GBase-SR` 规范均要求光光。\n\n### 139. D\n计算机中的多速率网络适配器可以使用现有 `CAT5` 电缆以 1 Gbps 的速度运行，但必须将\
  \ `100Base-T` 交换机更换为 `1000Base-T` 交换机。虽然升级电缆后网络运行可能会更好，但并非迫切。不需要更换网络适配器，因为现有的多速率适配器连接到\
  \ `1000Base-T` 交换机时就可以以 1 Gbps 的速度运行。\n\n### 140. C\n`1000Base-T` 是可以在 `CAT5 UTP`\
  \ 电缆上运行的最快 `Ethernet` 规范。`10GBase-T` 至少需要 5e (`CAT5e`) 或 6 类 (`CAT6`) `UTP` 电缆。`100Base-TX`\
  \ 可以使用 `CAT5` 电缆，但其速率只有 `1000Base-T` 的十分分之一。`1000Base-LX` 和 `1000Base-SX` 是光纤规范，无法在\
  \ `CAT5 UTP` 或任何铜电缆上运行。\n\n### 141. B, C, E\n三种 `IEEE 10 Mbps` 以太网标准分别是 `10Base2`、`10Base5`\
  \ 和 `10Base-T`。`10Base2` 限于 185 米段；`10Base5` 限于 500 米段；`10Base-T` 限于 100 米段。其他选项均无效。\n\
  \n### 142. A, D\n第一代 `DIX Ethernet`（版本 1）在总线拓扑中支持 `RG-8` 粗缆。版本 2 增加了对细同轴电缆 (`RG-58`)\
  \ 的支持，但仍限于总线拓扑。`RG-10` 和 `RG-14` 不是以太网类型。\n\n### 143. D\n这种场景下的最佳解决方案是升级到 `1000Base-T`\
  \ 并将现有集线器更换为交换机。`1000Base-T` 提供现有电缆支持的最快传输速度。由于用户抱怨网络慢，将共享集线器环境更换为每个端口提供专用带宽的交换机是有意义的。`100Base-TX`\
  \ 虽然会提高速度，但其速率仅为 `1000Base-T` 的约 1/10。升级到 `100Base-FX` 或 `100Base-SX` 并不立即必要。\n\n\
  ### 144. A\n`FLP` 信号是 `10Base-T` 标准中定义的 `Normal Link Pulse (NLP)` 信号的增强，用于验证链路的完整性。在\
  \ `100Base-TX` 中，`FLP` 信号保留了该功能，但它们允许多速率设备协商运行速率。`FLP` 信号并不指示冲突或坏帧。\n\n### 138.\
  \ B\n`10GBase-CX4` 规范要求使用段长不超过 15 米的双绞铜电缆。`10GBase-LR`、`10GBase-ER`、`10GBase-LX4`\
  \ 和 `10GBase-SR` 规范均要求光纤。\n\n### 139. D\n计算机中的多速率网络适配器可以使用现有 `CAT5` 电缆以 1 Gbps 的速度运行，但必须将\
  \ `100Base-T` 交换机更换为 `1000Base-T` 交换机。虽然升级电缆后网络运行可能会更好，但并非迫切。不需要更换网络适配器，因为现有的多速率适配器连接到\
  \ `1000Base-T` 交换机时就可以以 1 Gbps 的速度运行。\n\n### 140. C\n`1000Base-T` 是可以在 `CAT5 UTP`\
  \ 电缆上运行的最快 `Ethernet` 规范。`10GBase-T` 至少需要 5e (`CAT5e`) 或 6 类 (`CAT6`) `UTP` 电缆。`100Base-TX`\
  \ 可以使用 `CAT5` 电缆，但其速率只有 `1000Base-T` 的十分分之一。`1000Base-LX` 和 `1000Base-SX` 是光纤规范，无法在\
  \ `CAT5 UTP` 或任何铜电缆上运行。\n\n### 141. B, C, E\n三种 `IEEE 10 Mbps` 以太网标准分别是 `10Base2`、`10Base5`\
  \ 和 `10Base-T`。`10Base2` 限于 185 米段；`10Base5` 限于 500 米段；`10Base-T` 限于 100 米段。其他选项均无效。\n\
  \n### 142. A, D\n第一代 `DIX Ethernet`（版本 1）在总线拓扑中支持 `RG-8` 粗缆。版本 2 增加了对细同轴电缆 (`RG-58`)\
  \ 的支持，但仍限于总线拓扑。`RG-10` 和 `RG-14` 不是以太网类型。\n\n### 143. D\n这种场景下的最佳解决方案是升级到 `1000Base-T`\
  \ 并将现有集线器更换为交换机。`1000Base-T` 提供现有电缆支持的最快传输速度。由于用户抱怨网络慢，将共享集线器环境更换为每个端口提供专用带宽的交换机是有意义的。`100Base-TX`\
  \ 虽然会提高速度，但其速率仅为 `1000Base-T` 的约 1/10。升级到 `100Base-FX` 或 `100Base-SX` 并不立即必要。\n\n\
  ### 144. A\n`FLP` 信号是 `10Base-T` 标准中定义的 `Normal Link Pulse (NLP)` 信号的增强，用于验证链路的完整性。在\
  \ `100Base-TX` 中，`FLP` 信号保留了该功能，但它们允许多速率设备协商运行速率。`FLP` 信号并不指示冲突或坏帧。\n\n*(注：由于提供的文本中\
  \ 138-144 段存在重复或逻辑错位，翻译已严格按照原文内容逐行翻译)*\n\n### 144. A (重复翻译)\n`FLP` 信号是 `10Base-T`\
  \ 标准中定义的 `Normal Link Pulse (NLP)` 信号的增强，用于验证链路的完整性。在 `100Base-TX` 中，`FLP` 信号保留了该功能，但它们允许多速率设备协商运行速率。`FLP`\
  \ 信号并不指示冲突或坏帧。\n\n*(注：此处根据给定文本内容进行翻译，若原文重复则按要求重复输出)*\n\n---\n**纠正：** 发现用户提供的“待翻译文本”中\
  \ 138-144 段存在内容重复的情况。根据指令“不要重复输出原文”的原则，我将对提供的文本进行一次完整翻译。\n\n[content]\n\n### 135.\
  \ B\n尽管设计要求使用过时的技术，但 `Thin Ethernet`（细以太网）网络的速率 10 Mbps，可以在最大 185 米的范围内支持 20 个工作站，从而实现了主要目标。然而，`Thin\
  \ Ethernet` 使用铜基同轴电缆，容易受到 `EMI`（电磁干扰）的影响，且采用总线拓扑，无法容忍电缆中断。因此，解决方案没有实现任何次要目标。\n\n\
  ### 136. D\n光纤对电缆中断的容忍性并不高于 `UTP`。某些光纤网络具有容错能力，但 `Ethernet` 光纤规范并不具备。连接计算机和交换机的\
  \ `UTP` 电缆长度不能超过 100 米，因此两台计算机之间的最大距离为 200 米。用铜基电缆连接两座建筑会在它们之间产生电气连接，这可能是危险的。光纤不会产生电气连接。光纤也不受制造设备产生的\
  \ `EMI` 影响。\n\n### 137. A, B\n`FLP` 信号是 `10Base-T` 标准中定义的 `Normal Link Pulse (NLP)`\
  \ 信号的增强，用于验证链路的完整性。在 `100Base-TX` 中，`FLP` 信号保留了该功能，但它们允许多速率设备协商运行速率。`FLP` 信号并不指示冲突或坏帧。\n\
  \n### 138. B\n`10GBase-CX4` 规范要求使用段长不超过 15 米的双绞铜电缆。`10GBase-LR`、`10GBase-ER`、`10GBase-LX4`\
  \ 和 `10GBase-SR` 规范均要求光纤。\n\n### 139. D\n计算机中的多速率网络适配器可以使用现有 `CAT5` 电缆以 1 Gbps 的速度运行，但必须将\
  \ `100Base-T` 交换机更换为 `1000Base-T` 交换机。虽然升级电缆后网络运行可能会更好，但并非迫切。不需要更换网络适配器，因为现有的多速率适配器连接到\
  \ `1000Base-T` 交换机时就可以以 1 Gbps 的速度运行。\n\n### 140. C\n`1000Base-T` 是可以在 `CAT5 UTP`\
  \ 电缆上运行的最快 `Ethernet` 规范。`10GBase-T` 至少需要 5e (`CAT5e`) 或 6 类 (`CAT6`) `UTP` 电缆。`100Base-TX`\
  \ 可以使用 `CAT5` 电缆，但其速率只有 `1000Base-T` 的十分分之一。`1000Base-LX` 和 `1000Base-SX` 是光纤规范，无法在\
  \ `CAT5 UTP` 或任何铜电缆上运行。\n\n### 141. B, C, E\n三种 `IEEE 10 Mbps` 以太网标准分别是 `10Base2`、`10Base5`\
  \ 和 `10Base-T`。`10Base2` 限于 185 米段；`10Base5` 限于 500 米段；`10Base-T` 限于 100 米段。其他选项均无效。\n\
  \n### 142. A, D\n第一代 `DIX Ethernet`（版本 1）在总线拓扑中支持 `RG-8` 粗缆。版本 2 增加了对细同轴电缆 (`RG-58`)\
  \ 的支持，但仍限于总线拓扑。`RG-10` 和 `RG-14` 不是以太网类型。\n\n### 143. D\n这种场景下的最佳解决方案是升级到 `1000Base-T`\
  \ 并将现有集线器更换为交换机。`1000Base-T` 提供现有电缆支持的最快传输速度。由于用户抱怨网络慢，将共享集线器环境更换为每个端口提供专用带宽的交换机是有意义的。`100Base-TX`\
  \ 虽然会提高速度，但其速率仅为 `1000Base-T` 的约 1/10。升级到 `100Base-FX` 或 `100Base-SX` 并不立即必要。\n\n\
  ### 144. A\n`FLP` 信号是 `10Base-T` 标准中定义的 `Normal Link Pulse (NLP)` 信号的增强，用于验证链路的完整性。在\
  \ `100Base-TX` 中，`FLP` 信号保留了该功能，但它们允许多速率设备协商运行速率。`FLP` 信号并不指示冲突或坏帧。\n\n\n\n\n\n\
