  3. 路由器（Router）\n4. 网关（Gateway）\n\n### 67. 地址解析协议（ARP）投毒是故意地向存储在计算机和交换机的 ARP 缓存中插入虚假信息。以下哪种类型的攻击可以通过\
  \ ARP 投毒实现？（选择所有适用项）\n\n1. 社会工程学\n2. 中间人攻击（Man in middle）\n3. 恶性孪生攻击（Evil twin）\n\
  4. 会话劫持（Session hijacking）\n\n\n\n\n\n## 68. 最近，你的网络已成为多次攻击尝试的目标。为了收集有关攻击者的信息，你创建了一个服务器，该服务器被设计用于作为一个极具吸引力的目标，但不提供对任何合法敏感服务或信息的访问。以下哪项是用于描述这种技术的术语？\n\
  \n1. 欺骗 (Spoofing)\n2. DMZ\n3. 根保护 (Root guard)\n4. 蜜罐 (Honeypot)\n\n## 69. 你是一个为新客户网络工作的顾问。该网络已经存在了几十年，你收到了原始安装人员提供的图表。图表显示网络计算机连接到一个被称为多端口重复器（multiport\
  \ repeater）的设备。以下哪种设备也可以描述为多端口重复器？\n\n1. 集线器 (Hub)\n2. 桥器 (Bridge)\n3. 交换机 (Switch)\n\
  4. 路由器 (Router)\n\n## 70. 当你在服务器上运行端口扫描器时，结果是哪个？\n\n1. 当前运行用户进程的服务器列表\n2. 当前正在使用的计算机硬件端口列表\n\
  3. 指定系统上每个网络适配器传输和接收的数据包数量的列表\n4. 系统可以访问的开放端口列表\n5. 本地网络所有设备使用的 IP 地址列表\n\n## 71.\
  \ 你的公司有一个七节点故障转移集群，在 SQL Server 上托管数据库。每台服务器都安装了三个网络适配器。其中两个是标准的千兆以太网适配器，为节点提供相互访问并为客户端提供访问集群的。一个是光纤通道适配器，为集群节点提供对专用网络的访问，该网络还托管了一个大型磁盘阵列。以下哪项术语描述了集群节点连接的网络？（选择所有项）\n\
  \n1. 存储区域网 (SAN)\n2. 个人局域网 (PAN)\n3. 广域网 (WAN)\n4. 市域网 (MAN)\n5. 局域网 (LAN)\n\n##\
  \ 72. 一个 Windows 用户拨打帮助热线，报告他无法连接到本地网络或远程网络上的任何主机。这是你今天收到的唯一此类报告。你询问用户有关该问题，最终发现他对工作站的网际协议\
  \ (IP) 设置进行了一些更改。你接下来应该做什么？\n\n1. 检查数据中心的交换机，查看是否记录了任何错误消息。\n2. 验证网络上的路由器是否正常工作。\n\
  3. 在用户的工作站上运行 `ipconfig` 命令以查看其配置。\n4. 检查网络的域名系统 (DNS) 服务器，查看其是否正在解析 IP 主机名。\n\n\
  ## 73. 你是一个网络管理员，正尝试使用内部网络上的工作站远程控制位于边界网络上的名为 WebServ1 的 Web 服务器。然而，远程桌面客户端软件无法与服务器建立连接。你可以看到本地网络和边界网络上的所有计算机。你尝试使用\
  \ `ping` 工具测试 WebServ1 的 TCP/IP 功能，且 `ping` 测试成功了。然后你拨通了同一内部网络上同事的电话，让她尝试使用相同的远程访问工具连接到\
  \ WebServ1。她成功连接了 WebServ1。以下哪项可能是导致你所经历的问题的原因？\n\n1. Web 服务器上被拦截的 TCP/UDP 端口\n\
  2. 域名解析失败\n3. 你的工作站上错误的防火墙设置\n4. Web 服务器上无响应的服务\n\n## 74. 你在为 IT 咨询公司工作时收到的工具包包含了下图所示的工具。该工具的功能是什么？\n\
  \n![Reprinted from CompTIA Network+ Study Guide: Exam N10-006, Third Edition by\
  \ Todd Lammle (Wiley, 2015)](img/c06uf004.png)\n\n重印自 CompTIA Network+ Study Guide:\
  \ Exam N10-006, Third Edition by Todd Lammle (Wiley, 2015)\n\n1. 当你将工具的末端接触铜电缆时，你可以检测并测量流其中的电流。\n\
  2. 当你将工具放置在线的一端时，它会产生一个可以在另一端检测到的信号。\n3. 为了将散线连接到模块连接器（keystone connector），你使用该工具将每根线打入连接器上正确的插座中。\n\
  4. 当你将工具连接到光纤电的末端时，你可以测量电缆布线的长度。\n\n## 75. 你正在根据 IEEE 802.11n 标准设计一个新的无线网络。你选择的设备同时支持\
  \ 2.4 GHz 和 5 GHz 频率，你不确定使用哪一个。以下哪些项可能是为什么 5 GHz 频率在无线局域网 (WLAN) 上性能优于 2.4 GHz 频率的原因？（选择所有项）\n\
  \n1. 5 GHz 频率比 2.4 GHz 频率更多的通道。\n2. 5 GHz 频率冲突的常见家用设备比 2.4 GHz 频率少。\n3. 5 GHz 频率传输速度比\
  \ 2.4 GHz 快。\n4. 5 GHz 频率支持范围比 2.4 GHz 长。\n\n## 76. 图中工具的名称是什么？\n\n![Reprinted from\
