  \n115. 下列关于单模光纤的陈述哪些是正确的？（多项选择）\n\n1. 单模光纤使用 LED 源，而多模光纤使用激光。\n2. 单模光纤传输距离比多模远。\n\
  3. 单模光纤纤芯比多模小。\n4. 单模光纤弯曲半径小，更容易安装。\n5. 单模光纤需要接地，而多模光纤不需要。\n\n116. 电缆安装人员使用哪种工具将大量电缆连接到墙壁面板和配线架？\n\
