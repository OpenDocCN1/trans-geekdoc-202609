  \ 设备拥有操作系统，而 NAS 设备没有。\n\n### 58. 你的主管刚刚通知，首席信息官（CIO）聘请了一位外部顾问对公司网络进行渗透测试。以下哪项最好描述了你可以预期顾问会做什么？\n\
  \n1. 评估网络上的安全状况\n2. 创建对入侵者具有吸引力的计算机或网络\n3. 尝试破坏网络的安全措施\n4. 实施新的全公司安全协议\n\n### 59.\
  \ 你的公司是政府的承包商，经常处理高度敏感的国防数据。为了防止这些数据被泄露，公司的数据中心安装了各种特殊安全措施。所有服务器都有压紧的金属标签以固定机箱。所有硬件机架都锁在透明面板的机柜中。所有电缆线路都安装在透明导管中。这些都是以下哪种类型物理安全措施的示例？\n\
  \n1. 地缘围（Geofencing）\n2. 端口安全\n3. 篡改检测（Tamper detection）\n4. 资产跟踪\n\n### 60. 波分复用是一种在单条网络介质上传输多个光纤信号的技术。这种复用技术有几种类型，包括粗波分复用（CWDM）、密波波分复用（DWDM）和双向波分复用（BWDM，或简称\
