  \n### 160\nA. 可变长度子网掩码 (`VLSM`) 描述了通过分配任意数量的主机位作为子网位，对 `IPv4` 网络地址进行子网划分的过程，为管理员提供了创建的子网数量和每个子网中的主机数量提供了极大的灵活性。自动私有\
  \ IP 地址 (`APIPA`) 是 DHCP 客户端在没有可用的 DHCP 服务器时为自己分配 IP 地址的过程。虚拟局域网 (`VLANs`) 是用于在大型交换网络上创建独立广播域的逻辑结构。扩展唯一标识符-64\
  \ (`EUI-64`) 是一种用于通过介质访问控制 (`MAC`) 地址创建 `IPv6` 链路本地地址的地址方法。\n\n### 161\nB. 网络地址中指示的\
