  \ (`AES`) 等协议提供加密。然而，这些协议不提供身份验证服务。可扩展身份验证协议 (`EAP`) 是一种封装身份验证信息的框架。它的许多变体除了传统的密码外，还支持智能卡和其他生物识别等其他身份验证因子。\n\
