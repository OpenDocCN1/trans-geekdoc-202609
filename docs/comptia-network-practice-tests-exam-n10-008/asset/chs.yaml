  \ 00000000 00000000\n```\n\n转换为十进制值后，得到的子网掩码值为 `255.252.0.0`。\n\n### 162\nA. 在这种场景中，公司拥有一个\
  \ `Class C` 互联网协议 (`IPv4`) 地址，由 24 位网络位和 8 位主机位组成。公司需要 10 个子网和每个子网 14 个主机，因此 Ed\
  \ 必须将 8 位主机位划分为子网位和主机位。他可以将 8 位主机位中的 4 位分配给子网，从而能够创建最多 16 个子网。这留下了 4 位用于主机地址，使 Ed\
  \ 每个子网能够创建 14 个主机。\n\n### 163\nE. 使用给定长度的子网标识符可以创建的子网数量计算公式为 `2^x`，其中 `x` 是子网标识符中的位数。因此，使用\
  \ 14 位子网，可以创建 `2¹⁴` 即 `16384` 个子网。\n\n### 164\nC. 在这种场景下，IP 地址的最后一个字节必须划分为子网位和主机位。5\
  \ 位子网位将提供 32 个子网，每个子网 30 个主机。新的掩码为 `255.255.224`，其中 `224` 是十进制等效值。\n\n### 165\n\
  D. 要将 MAC 地址转换为 64 位扩展唯一标识符 (`EUI-64`)，需要将 MAC 地址划分为两个 3 字节，并插入 `FE` 值，如下：\n\n```\n\
  FE80::7AD0\n```\n\n然后，将第一个字节的 `0` 改为 `02`，这产生了 `IPv6` 链路本地地址：\n\n```\nFE80::1FE7AD0\n\
  ```\n\n### 166\nA. 掩码为 `255.255.0` 的 `Class B` 地址使用 16 位用于子网，留下了 8 位用于主机。\n\n###\
