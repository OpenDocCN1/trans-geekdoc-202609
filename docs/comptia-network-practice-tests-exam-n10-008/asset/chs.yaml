  \ (`TCP/IP`) 配置信息。\n\n## 101\nA, D. `ping` 和 `tracert` 都是使用 `ICMP` 消息测试网络层的工具。`ping`\
  \ 测试主机功能，`traceroute` 显示网络层。\n\n## 102\nB. `netstat` 实用程序可以显示路由表以及其他类型的网络流量和端口信息。`arp`\
