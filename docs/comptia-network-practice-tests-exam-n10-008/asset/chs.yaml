  `D. Smurf` 攻击依赖路由器转发广播流量。路由器不再转发广播消息，因此 `smurf` 攻击已经失效。同样，`虚拟局域网 (VLAN)` 绕跃（一种向交换机发送命令将端口从一个\
  \ `VLAN` 转移到另一个的方法）也已罕见，因为现在的交换机设计时已经防止了此类攻击。`逻辑炸弹 (logic bomb)` 是插入到合法软件产品中的代码段，当满足特定条件时会触发恶意事件。`网络钓鱼\
  \ (Phishing)` 是指用于向用户植入某种恶意软件的虚造电子邮件或网站。这两者仍然是常用的攻击类型。\n\n## 73. DoS、DDoS 以及攻击变体\n\
  虽然 `DoS` 攻击通常涉及流量泛洪，但任何阻止服务器运行的攻击都可以被称为 `DoS` 攻击。永久性 `DoS` 攻击是指攻击者实际上破坏目标系统并阻止其运行的攻击。这可能是损坏硬件的物理攻击，攻击者也可以通过更改软件或配置设置来禁用服务器。`分布式拒绝服务\
  \ (DDoS)` 攻击是指攻击者使用成百上千个受恶意软件控制的被称为 `僵尸 (bots)` 或 `zombies` 的计算机，向单个服务器或网站发送流量，试图使其过载并阻止其运行。放大型\
  \ `DoS` 攻击是指攻击者发送的消息需要目标服务器进行更长时间的处理，这比简单的消息会给它们带来更沉重的负担。反射型 `DoS` 攻击是指攻击者将包含目标服务器\
  \ `IP` 地址的请求发送到互联网上的合法服务器（例如 `域名系统 (DNS)` 服务器），导致这些服务器向目标泛洪大量响应。\n\n## 74. DDoS\
  \ 与反射型攻击详情\n`C. 分布式拒绝服务 (DDoS)` 攻击使用成百上千个被恶意软件感染的、被称为 `僵尸 (bots)` 或 `zombies` 的计算机向目标服务器泛洪流量，试图使其过载并阻止其运行。反射型\
  \ `DoS` 攻击是指攻击者将包含目标服务器 `IP` 地址的请求发送到互联网上的合法服务器（例如 `域名系统 (DNS)` 服务器），导致这些服务器向目标泛洪大量响应。反射型攻击不需要感染的计算机；它利用了服务器的原功能。放大型\
  \ `DoS` 攻击是指攻击者发送的消息需要目标服务器进行更长时间的处理，这比简单的消息会给它们带来更沉重的负担。永久性 `DoS` 攻击是指攻击者实际上破坏目标系统并阻止其运行的攻击。\n\
  \n## 75. DNS 毒、ARP 毒与欺骗\n`D. 域名系统 (DNS)` 毒是一种攻击类型，攻击者向 `DNS` 服务器的缓存中添加欺诈信息。然后，当客户端尝试解析网站或其他服务器的名称时，`DNS`\
  \ 服务器提供错误的 `IP` 地址，导致客户端访问攻击者的服务器。`双生攻击点 (evil twin)` 是网络上的恶恶 `无线接入点 (WAP)`。`地址解析协议\
  \ (ARP)` 毒是指故意向存储在计算机和交换机的 `ARP` 缓存中插入欺诈信息，这可以干扰本地范围内将 `IP` 地址解析为 `介质访问控制 (MAC)`\
  \ 地址的过程。`欺骗 (Spoofing)` 是修改网络数据包以使其看起来像是由他人发送或发送给人的过程。\n\n## 76. DNS 与 ARP 原理\n\
  `B. 域名系统 (DNS)` 毒是一种攻击类型，攻击者向 `DNS` 服务器的缓存中添加欺诈信息。这可以通过导致 `DNS` 服务器为指定名称提供错误的 `IP`\
  \ 地址来干扰名称解析过程。将 `IP` 地址解析为 `介质访问控制 (MAC)` 地址的过程可能会被 `地址解析 (ARP)` 毒所干扰。`DNS` 与密码或切换无关。\n\
  \n## 77. 漏洞、利用程序与蜜罐\n`C. 漏洞 (vulnerability)` 是系统中的潜在弱点，攻击者可以利用它来有利。`利用程序 (exploit)`\
  \ 是旨在利用漏洞的硬件或软件元素。`缓解措施 (mitigation)` 是防御系统安全攻击的一种形式。`蜜罐 (honeypot)` 是被配置为作为攻击者诱饵的计算机，导致他们浪费时间渗透一个无法提供任何实际访问的资源。\n\
  \n## 78. 逻辑炸弹与社会工程\n`D. 逻辑炸弹 (logic bomb)` 是插入到合法软件产品中的代码段，当满足特定条件时会触发恶意事件。被解雇的管理员可能创建了代码，旨在该管理员离开公司后触发删除。`社会工程\
  \ (Social engineering)` 是一种攻击形式，无辜的用户被攻击者说服通过电子邮件或电话提供敏感信息。`地址解析协议 (ARP)` 负责将 `IP`\
  \ 地址解析为 `介质访问控制 (MAC)` 地址。`ARP 毒` 是向存储在计算机和交换机的 `ARP` 缓存中插入欺诈信息。`双生攻击点 (evil twin)`\
  \ 是无线网络上的。\n\n## 79. 中间人与会话劫持\n`B, C. 地址解析协议 (ARP)` 毒是指向存储在计算机和交换机的 `ARP` 缓存中插入欺诈信息。这使得攻击者能够拦截目标系统的流量。在`中间人\
  \ (man-in-middle)` 攻击中，攻击者可以拦截流量并在发送到目的地之前对其修改。在`会话劫持 (session hijacking)` 攻击中，攻击者可以使用截获的流量获取包括密码在内的认证信息。`双生攻击点\
  \ (evil twin)` 是无线网络上的。`社会工程 (Social engineering)` 是一种无辜的用户被攻击者说服通过电子邮件或电话提供敏感信息的攻击形式。\n\
  \n## 80. 重放攻击\n`B. 重放攻击 (replay attack)` 是一种攻击者利用以前捕获的数据包中的信息来访问安全资源的攻击。在许多情况下，捕获的数据包包含认证数据。通过这种方式，攻击者可以使用密码，即使它们经过了加密且无法显示。其他选项都描述了有效的攻击方法，但它们不是重放攻击。\n\
  \n## 81. 网络钓骗骗\n`B. 这是一个典型的`网络钓骗骗 (phishing scam)`。极有可能，Ed 收到的电子邮件中的链接并没有带他进入银行真实网站，而是攻击者创建一个副本。通过提供登录凭据，他实际上是将它们交给了攻击者，攻击者现在可以访问他的银行账户。`社会工程\
  \ (Social engineering)` 是通过联系用户并伪装成需要这些数据的人来获取数据的做法。`逻辑炸弹 (logic bomb)` 是插入到合法软件产品中的代码段，当满足特定条件时会触发恶意事件。`欺骗\
  \ (Spoofing)` 是修改网络数据包以使其看起来像是由他人发送或发送给人的过程。\n\n## 82. 双生攻击点、游击与去认证\n`A, C, D. 双生攻击点\
  \ (evil twin)` 是无线网络上的欺诈接入点，它模仿合法接入点的 `服务集标识符 (SSID)`，以此吸引用户。`游击 (War driving)`\
  \ 是一种攻击方法，由带着计算机在社区行驶，扫描未保护的无线网络。`去认证 (Deauthentication)` 是一种 `拒绝服务 (DoS)` 攻击类型，攻击者通过发送导致客户端从网络断开的\
  \ `去认证帧` 来针对无线客户端攻击。`网络钓鱼 (Phishing)` 是一种针对所有用户的攻击类型，而不仅仅是无线用户。\n\n\n\n\n\n### 83.\
  \ C, D.\n拒绝服务（DoS）攻击是一种旨在阻止目标履行其功能的攻击。虽然 `ping` 泛洪是服务器 DoS 攻击的一种常见形式，但物理上损坏服务器硬件也会阻止其执行功能。因此，这这也是一种\
  \ DoS 攻击。数据包捕获和非法访问点通常不被描述为 DoS 攻击。\n\n### 84. A.\n僵尸网络（或机器人）是指受了恶意软件（通常是某种形式的木马）感染的计算机，攻击者可以远程控制它，导致该计算机向目标系统发送大量流量。使用多个僵尸的攻击被称为分布式拒绝服务（DDoS）攻击。其他选项均不是僵尸的示例。\n\
  \n### 85. C.\n勒索软件是一种攻击类型，除非向攻击者支付特定金额的资金，否则用户对其计算机或数据的访问将被阻止。这种阻止方式可以从简单的屏幕锁定到数据加密不等。\n\
  \n### 86. B.\n社会工程是指通过联系用户并伪装成对该数据有正当需求的人员来获取敏感数据的做法。这不需要任何计算机设备，任何软件或硬件解决方案都无法防止它；唯一的方法是教育用户潜在的危险，并建立政策告知用户在遇到社会工程学尝试时应该如何做。拒绝服务（DoS）是一种通过流量淹没计算机，使其无法正常工作的攻击类型。暴力破解攻击或字典攻击是指攻击者使用重复猜测来寻找密码、开放端口或其他类型敏感数据的攻击。钓鱼（Phishing）是用于旨在让用户感染某种类型恶意软件的虚假电子邮件或网站的统术语。\n\
  \n### 87. B.\n暴力破解攻击（也称为字典攻击）是指攻击者使用重复猜测来寻找密码、开放端口或其他类型敏感数据的攻击。暴力破解并非指物理攻击。用僵尸网络产生的流量泛洪服务器即为分布式拒绝服务（DDoS）攻击。部署未经授权的访问点是恶性孪生（evil\
  \ twin）攻击。\n\n### 88. A.\n恶性孪生是无线网络上的欺骗性访问点，入侵者可以使用它获取用户传输的密码和其他敏感信息。无线驱动（War driving）是寻找开放无线网络的术语。社会工程学是一种攻击的形式，攻击者说服无辜的用户通过电子邮件或电话提供敏感信息。欺骗（Spoofing）是修改网络数据包使其看起来像是是由他人发送或发送给他人的过程。\n\
  \n### 89. C.\n社会工程学是指一种攻击的术语，其中口齿伶道的入侵者联系用户并说服其披露敏感信息，例如账户密码。中间攻击（on-path/man-in-the-middle）是指攻击者拦截网络流量、读取流量，甚至在发送到目的地之前对其修改的攻击。欺骗（Spoofing）是修改网络数据包使其看起来是由他人发送或发送给他人的过程。恶性孪生是无线网络上的欺骗性访问点。\n\
  \n### 90. B.\n操作系统更新和补丁经常发布，以解决新发现的漏洞，这些漏洞会导致计算机易受到恶意软件侵害。定期应用更新有助于缓解恶意软件的影响。更新和补丁通常无法缓解拒绝服务（DoS）攻击，并且对非技术危险（如社会工程学）或适用于交换机的危险（如端口安全危害）没有影响。\n\
  \n### 91. D.\n`social engineering` 一词是指攻击者可以用来通过物理或数字方式操纵授权用户以获取受保护资源的各种方法。恶性孪生是出于恶意目的故意连接到网络的非法访问点，因此它不是社会工程学的一种。尾随（Piggybacking）和尾入（tailgating）通常指紧跟授权人员穿过物理安全屏障（如锁上的门或守卫的入口）的行为。窥视（Shoulder\
  \ surfing）是一种通过通过用户身后并注视其显示器来收集敏感信息的方法。钓鱼是社会工程学的数字形式，用户被伪造电子邮件或其他通信工具欺骗披露敏感信息。\n\
  \n### 92. B.\n扩展性认证协议（EAP）是一种用于封装认证消息的框架。EAP 用于无线网络和点对点连接，并支持数十种不同的认证方法。Wi-Fi 保护访问（WPA）是一种无线加密标准。临时密钥完整性协议（TKIP）是一种加密算法。传输层安全协议（TLS）是一种用于互联网通信的加密协议。\n\
  \n### 93. A.\n扩展性认证协议（EAP）和 `802.1X` 都是许多无线网络上使用的身份验证机制的组成部分。EAP 和 `802.1X` 本身并不提供授权、加密或计费服务。\n\
  \n### 94. A, B.\n受保护扩展认证协议（PEAP）将 EAP 封装在传输层安全（TLS）隧道内部。通过安全隧道进行灵活认证（FAST）也建立了一个\
  \ `TLS` 隧道来保护用户凭据的传输。EAP-TLS 使用 `TLS` 进行加密，但不用于隧道化。EAP-PSK 使用预共享密钥提供不使用加密的认证过程。\n\
  \n### 95. C.\n`geofencing`（地理围栏）是一个通用术语，指根据客户端的位置限制对网络或其他资源的访问的技术。在无线网络中，地理围栏旨在防止设施外的未授权客户端连接到网络。本地认证是一种触发认证请求的应用程序或服务，用户在授予访问之前必须对其做出响应。端口安全是一种保护交换机端口的方法。运动检测是一种设计在个人进入保护区域时触发通知或警报的系统。\n\
  \n### 96. A.\n地理围栏是一种防止设施外的未授权客户端连接到网络的机制。该机制可以采取信号强度或功率要求、GPS 位置要求，或无线访问点天线的策略性放置。其他选项均不是典型的地理围栏技术。\n\
  \n### 97. C.\n作为公钥基础设施（PKI）的一部分，数字证书与密钥对相关，由公钥和私钥组成。证书颁发给个人或计算机以证明其身份。签名并不关联个人或计算机与密钥对。漏洞（exploit）是用于利用漏洞的硬件或软件元素。资源记录与域名系统（DNS）相关。\n\
  \n### 98. A, D.\n受保护扩展认证协议（PEAP）和 灵活安全隧道认证（EAP-FAST）都使用 `TLS` 隧道来保护认证传输。EAP 密码（EAP-PWD）和\
  \ EAP-MP5 不使用 `TLS` 用于隧道或其他用途。\n\n### 99. A, B, C, E.\n加密、认证、媒体访问控制（MAC）过滤和天线放置都是增强无线网络防御攻击能力的技术。社会工程学是一种入侵者联系用户并说服其披露敏感信息（例如账户密码）的攻击类型；它并非专门与无线网络相关。\n\
  \n\n\n\n\n### 100. A\n没有任何策略可以防止用户创建容易猜测的密码。唯一有帮助的是教育用户，让他们意识到攻击者经常能够利用熟悉的名称和日期等信息来猜测密码。强制频繁更改密码并不能迫用户改变选择密码的方法，增加密码历史记录值也无如此。分配随机密码可以解决这个问题，但用户投诉和忘记密码可能会产生比其解决的问题更大的问题。\n\
  \n### 101. A, C, D\n无线接入点、交换机和路由器都需要身份验证才能访问其管理界面，而且大多数设备在出厂时配置了标准的用户名和密码。购买者可以修改默认凭据，但许多人没有这样做。`Windows`\
  \ 服务器没有分配默认凭据；安装程序在设置过程中会提示指定 `Administrator` 密码。\n\n### 102. A, D\nSecure Shell\
  \ (`SSH`) 和 `Telnet` 都是远程终端程序，但 `Telnet` 以明文传输指令（包括密码），而 `SSH` 是加密的。安全超文本传输协议（`HTTPS`）是超文本传输协议（`HTTP`）的加密版本。在这情况下，建议的替代方案都更安全。然而，临时密钥完整性协议（`TKIP`）提供的加密安全性低于高级加密标准（`AES`），而线缆等效协议（`WEP`）的安全性低于\
  \ WiFi 安全访问 2（`WPA2`）。\n\n### 103. B, C\n服务器和交换机都是闲端口构成安全危害的设备，但它们对“端口”一词的定义不同。服务器具有应用层端口，允许特定类型的服务流量进入服务器。交换机具有管理员连接计算机和其他设备的端口。两者都可以为攻击者提供对设备的未经授权访问。集线器端口无法禁用，企业网络中使用的无线接入点（`WAPs`）通常只有一个端口。\n\
  \n### 104. B\n禁用 `SSID` 广播是隐藏无线网络存在的一种方法，但如果入侵者知道那里有一个网络，捕获由无线设备传输的数据包并从中读取 `SSID`\
  \ 是一件易手的事。没有 `SSID` 无法连接到无线网络。`SSIDs` 由接入点管理员设置；它们并不会打印在设备的标签上。`SSIDs` 相对容易找到，但猜测它们并不比猜测密码更容易。\n\
  \n### 105. C\n升级服务器上的 `UEFI` 或 `BIOS` 固件通常不会增强其安全性，因此不能被视为服务器加固的形式。禁用未使用的服务和端口可以减少服务器的攻击面，创建特权用户账户可以减少特权账户被破解的机会。因此，这些都是服务器加固的形式。\n\
  \n### 106. A, D\n如果没有未经授权的人无法访问数据中心，那么就不存在有人将设备插入已开启端口的危险。如果交换机使用访问控制列表（`ACL`）来指定允许连接的系统的介质访问控制（`MAC`）地址，则无需禁用闲置端口。然而，禁用端口可能比创建和维护\
  \ `ACL` 要容易得多。未接线的端口在交换机处仍可能被攻击。开启端口并不困难，因此为了适应新用户并不是保持它们开启状态的有效理由。\n\n### 107.\
  \ D\n“密码必须符合复杂性要求”策略包含一项规定，新密码不能包含用户的帐户名或全名。如果全名由空格或标点符号分隔，则单个单词也不能出现在密码中。其他选项无法防止使用常用密码。\n\
  \n### 108. D\n去取消认证（Deauthentication）是一种拒绝服务（`DoS`）攻击，攻击者通过发送去取消认证帧来针对无线客户端，导致客户端与网络断开。因此，它不是加固接入点的方法。升级设备固件以应用安全补丁、更改出厂时应用的默认管理凭据以及频繁更改预共享密钥（`PSK`）都是加固接入点安全性的手段。\n\
  \n### 109. C\n网络加固是一个用于描述任何让入侵者渗透变得更加困难的方法的术语。在许多情况下，网络加固技术基于教育而非技术。强制用户创建难以猜测的密码就是其中一个例子。缓解技术是降低攻击严重程度的方法。多因素认证要求使用两种不同的身份确认机制，例如密码和指纹。访问控制是创建受批准用户或系统列表的技术。\n\
  \n### 110. A, B\n`Administrator` 是 `Windows` 中的默认管理员用户，而 `root` 是 `Linux` 中的管理员账户。\n\
  \n### 111. B, D\n虚拟局域网（`VLANs`）可用于将系统隔离在独立的网络上。非军事化区（`DMZ`），也称为筛选子网或边界网络，是一个可以从\
  \ Internet 访问并通过防火墙与内部网络隔离的网络段。这两者都是隔离系统以防止安全违规扩散的方法。访问控制列表（`ACLs`）和网络访问控制（`NAC`）都是增强网络安全的方法，但它们不是分段方法。\n\
  \n### 112. D\n动态主机配置协议（`DHCP`）侦听（snooping）是某些网络交换机中的功能，防止恶意 DHCP 服务器向客户端分配 IP 地址。它还可以检测\
  \ `DHCP` 释放或拒绝消息何时通过非 `DHCP` 事务源端口以外的端口到达。其他选项都是适用于服务器的技术。\n\n### 113. B\n`ACLs`\
  \ 定义了授予通过身份验证用户的访问类型。这一过程被称为授权。身份验证是对比用户身份的确认。审计（Accounting）和检查都是跟踪和记录用户在网络上活动的方法。\n\
  \n### 114. C\n角色分离（Role separation）为每个服务器角色或应用程序创建不同虚拟服务器的做法。除了提供其他益处外，这迫使入侵者必须对多个服务器发动攻击才能禁用整个网络。地理围栏（Geofencing）是一种限制访问无线网络的技术。网络分段描述了创建多个虚拟局域网（`VLANs`）或部署防火墙以隔离网络部分的过程。VLAN\
  \ 抖跃是一种攻击类型，入侵者向交换机发送命令消息将端口从一个 VLAN 转移到另一个。\n\n### 115. B\n角色分离为每个服务器角色或应用程序创建不同虚拟服务器的做法。除了提供其他益处外，这迫使入侵者必须对多个服务器发动攻击才能禁用整个网络。交换机、路由器和接入点不使用此技术。\n\
  \n### 116. D\n隐式拒绝（implicit deny）是一种默认拒绝访问资源的策略，没有规则定义这种拒绝。创建一个新的拒绝访问规则是显式拒绝（explicit\
  \ deny）。如果任何人默认都能远程访问服务器，那将是隐式允许。显式允许（explicit allow）是授予特定用户远程访问的规则。\n\n\n\n\n\n\
  ### 117. A. 动态主机配置协议（DHCP）侦听是一个交换机检查 DHCP 流量，以确定 DHCP 服务器为特定 MAC 地址分配的 IP 地址的过程。`DAI`\
  \ 通过比较 ARP 数据包中的 IP 与 MAC 地址配对与其已编译的 DHCP 侦听表中的配对来检测 ARP 投毒尝试。随后，交换机会丢弃地址对不匹配的数据包。安全\
  \ SNMP、安全网络协议（SNP）、域名系统（DNS）名称解析和邻居发现协议（NDP）均不用于实现 `DAI`。\n\n### 118. D. 动态主机配置协议（DHCP）侦听是某些网络交换机上的一个功能，它可以防止良良\
  \ DHCP 服务器向客户端分配 IP 地址。它还能检测 DHCP 释放（release）或拒绝（decline）消息是否通过非 DHCP 源端口到达。尽管 DHCP\
  \ 侦听可以防止 DHCP 客户端被分配错误的 IP 地址，但它不能直接防止域名系统（DNS）服务器缓存被注入错误信息。\n\n### 119. A. 虽然 DHCP\
  \ 是一种使用用户数据报协议（UDP）传输层协议来分配网络层 IP 地址的应用层服务，但 DHCP 侦听是一个数据链路层过程，网络交换机通过检查传入的 DHCP\
  \ 流量来确定其是否来自授权的服务器以及是否通过正确的端口到达。\n\n### 120. C. 通过向交换机发送包含许多不同伪介质访问控制（MAC）地址的数据包，攻击者可以导致交换机\
  \ MAC 表中的合法条目老化退出并被虚假条目替换。当传入数据包的目标不在表中找到时，交换机会将它们在整个网络中广播，导致它们更容易被捕获和破解。洪暴保护（flood\
  \ guard）是一种防止表中已确认的 MAC 地址被替换的机制。交换机中的洪暴保护无法防御域名系统（DNS）投毒、无线驱动攻击（war driving）或恶意双胞攻击。\n\
  \n### 121. B. 根保护（root guard）通过强制执行交换式网络上根桥接端口的选取来影响生成树协议（STP）的行为。没有根保护的情况下，管理员无法强制执行具有冗余交换织结构的网络拓扑。根保护不影响可扩展认证协议（EAP）、轻量级目录访问协议（LDAP）或地址解析协议（ARP）。\n\
  \n### 122. A. 文件完整性监控（FIM）通常是指将文件的当前状态与存储在其他处的已知基准副本进行比较的过程。这种比较可以是直接的，也可以涉及计算校验和或其他类型的文件哈希值。比较的目的是检测文档的变化，包括内容以及敏感区域的变化（如凭据、权限和安全设置），这可能表明存在潜在或实际的安全泄露。角色分离（Role\
  \ separation）应用于服务器上的应用程序部署。取消身份验证（Deauthentication）是一种无线网络攻击。篡改检测是描述硬件物理安全措施的术语。路由器公告（RA）防护是某些交换机上的一个功能，防止滥用\
  \ RA 消息重定向流量。\n\n### 123. C. 数字签名可用于以下功能：认证，确认数据源于特定个人；不可否认性，防止发送者否认数据的来源；以及完整性，确认数据在传输过程中未被修改。分段（Segmentation）不是数字签名的功能。\n\
  \n### 124. A. 数字签名可用于以下功能：认证，确认数据源于特定个人；不可否认性，防止发送者否认数据的来源；以及完整性，确认数据在传输过程中未被修改。分段（Segmentation）不是数字签名的功能。\n\
  \n### 125. B. 固件是永久写入设备内置内存的某种软件。它为硬件提供低级控制。\n\n### 126. A. 补丁（patch）是相对较小的更新，旨在解决特定问题。更新、升级和服务包是更大的包。\n\
  \n### 127. A. 补丁（（patch）是相对较小的更新，旨在解决特定问题。更新、升级和服务包是更大的包。\n\n### 128. C. 回滚（Rolling\
  \ back）是指卸载补丁以恢复到以前版本的过程。评估过程通常包括：研究阶段（在此阶段你检查补丁的需求和目的）；测试阶段（在此阶段你将在实验室机器上安装补丁）；以及对将应用补丁的生产系统进行备份。\n\
  \n### 129. D. *回滚*（*Rollback*）是变更管理中的一个术语，描述撤销已更改以恢复原始配置的过程。在补丁管理中，回滚是撤销更新的过程。*滑坡*（*backslide*）、*降级*（*downgrade*）和*重置*（*reset*）不用于描述此过程。\n\
  \n### 130. D. MAC 地址过滤允许管理员配置接入点仅允许特定地址的设备连接；所有其他流量被拒绝。MAC 过滤不需要修改地址。\n\n### 131.\
  \ D. 地围栏（Geofencing）是一个通用术语，指根据客户端的位置限制对网络或其他资源的访问。因此，它最好被描述为“你所在地”。手指手势被视为“你做的事”，密码是“你知的”，而智能卡是“你拥有的”。\n\
  \n### 132. A. 无线接入点（WAP）通常具有维护访问控制列表（ACL）的能力，其中指定允许连接到无线网络的介质访问控制（MAC）地址。这种技术被称为\
  \ MAC 地址过滤。\n\n### 133. A, C. NTFS 文件和文件夹都有 ACL，其中包含访问控制条目（ACE），指定可以访问它们的用户和组以及他们获得的特定权限。无线接入点（WAP）拥有\
  \ ACL，包含允许连接到无线网络的介质访问控制（MAC）地址。\n\n\n\n\n\n### 134. A. 媒体访问控制（`MAC`）过滤在无线网络接入点上以访问控制列表（`ACL`）的形式存在，列出了所有允许访问网络的设备的\
  \ `MAC` 地址。如果 Alice 笔记本电脑的 `MAC` 地址未包含 `ACL` 中，她将无法连接到网络。Alice 已经获得了网络的 `SSID`，因此她应该能够连接，即使接入点没有广播该\
  \ `SSID`。由于地理围栏（Geofencing）旨在防止办公室以外的用户访问网络，因此这不应该是问题所在。Alice 已经获得了网络的口令，因此她应该能够在她的笔记本上配置\
  \ WiFi 保护访问 2（`WPA2`）。Alice 并没有使用独立的访客网络，因此这并没有阻止她连接。\n\n### 135. B. 强制捕获门户（Captive\
  \ portal）是向尝试访问公共无线网络的用户显示的网页。用户在获得访问权限之前，通常必须提供凭据、支付费用或接受用户协议。强制捕获门户不是交换机端口、房间的安全入口，或一种勒索性的计算机攻击类型。\n\
  \n### 136. A. 提示用户支付、身份验证或接受 `EULA` 的网页是强制捕获门户。勒索软件是一种勒索支付的攻击类型。端口安全（Port security）和根守护保护器（root\
  \ guards）是保护交换机端口访问的方法。\n\n### 137. B. 端口隔离，也称为私有虚拟局域网（`VLAN`），是某些交换机中的一项功能，允许管理员将选定的端口限制给特定的上行链路，本质上创建了一个与交换机默认主\
  \ `VLAN` 隔离的独立次级 `VLAN`。筛选过的子网（也称为边界网络或非军事化区 [`DMZs`]）、帧中继（frame relay）和 `VPNs`\
  \ 并不是交换技术。\n\n### 138. B, C. 由于许多 `IoT` 设备是移动的或位于不受保护的区域，防火墙对于所有设备来说都不是一种可行的保护机制，将它们放置在单独网段的做法同样如此。访问控制策略和提供身份验证与授权的集中网关等网络安全机制，可以纳入通用的\
  \ `IoT` 安全标准中。\n\n### 139. B, D. 大多数交换机上的默认虚拟局域网（`VLAN`）ID 为 `VLAN 1`，而不是 `VLAN\
  \ 0`，且它不能被重命名或删除。默认 `VLAN` 不一定由管理员创建；它是默认配置中分配给所有端口的一个。\n\n### 140. D. 控制平面策略（Control\
  \ plane policing）使用服务质量（`QoS`）策略来阻塞、允许或对路由器或交换机处理的流量实施速率限制。IP 安全（`IPSec`）是一种加密或验证流量的网络层安全机制。`802.1X`\
  \ 是一种网络身份验证机制。路由器广告（`RA`）保护是某些交换机上的功能，防止滥用 `RA` 消息重定向流量。虚拟局域网（`VLAN`）跳跃是一种向交换机发送命令将端口从一个\
  \ `VLAN` 转移另一个的方法。\n\n### 141. B. `VPN` 通常允许远程客户端连接到中心站的 `VPN` ，类似于局域网（`LAN`）的星型拓扑，其中计算机都连接到中央交换机。动态多点虚拟专用网络（`DMVPN`）是一种在远程\
  \ `VPN` 站点之间创建网状拓扑的技术，允许远程站点相互连接，而不是连接到中央 `VPN` 服务器。`VPN` 集中器是某种路由器，允许多个客户端系统从远程位置访问网络。会话发起协议（`SIP`）终端为统一通信网络的私有域和公共域之间提供连接。多协议标签交换（`MPLS`）是一种数据传输机制，它为单个数据包分配标签，然后根据这些标签路由数据包。无客户端\
  \ `VPN` 使用浏览器创建到服务器的加密隧道，无需安装额外的客户端软件。\n\n### 142. C. 点对点隧道协议（`PPTP`）由于在其中发现了几个严重的安全漏洞，被认为用于\
  \ `VPN` 时已经过时。`IPSec`、第二层隧道协议（`L2TP`）以及安全套接层/传输层安全协议（`SSL/TLS`）目前仍在使用中。\n\n### 143.\
  \ C. 第二层隧道协议（`L2TP`）用于创建形成 `VPN` 连接的隧道，但它不加密通过隧道的流量。为了实现这一点，它需要一个提供加密的独立协议，例如 IP\
  \ 安全（`IPSec`）。点对点隧道协议（`PPTP`）和安全套接层（`SSL`）都能对隧道流量进行加密。\n\n### 144. A, B, C. 虽然计算机不必使用相同制造商制造的硬件，但两者必须使用相同基本类型的\
  \ `WAN` 连接，例如租用线路、拨号器或互联网连接。两者都必须使用相同的数据链路层协议（如 `PPP`）来建立远程网络连接。大多数网络连接使用某种形式的身份验证，即使只是用户名和明文密码。为了配置为使用相同的身份验证，只要所有其他元素（如物理层连接和协议）就绪，远程网络连接中的两台计算机不需要运行相同的操作系统。\n\
  \n### 145. C. 安全 Shell（`SSH`）是一种允许用户在远程计算机上执行命令的字符化工具。它不提供 Web 服务器安全。安全套接层（`SSL`）是一种在浏览器和服务器之间提供加密通信的安全协议。传输层安全（`TLS`）是一种旨在替换\
  \ `SSL` 的更新安全协议。数据报传输层安全（`DTLS`）是一种为用户数据报协议（`UDP`）流量提供与 `TLS` 相同基本功能的协议。\n\n###\
  \ 146. D. 外网 `VPN` 旨在为客户、供应商和其他合作伙伴提供连接公司网络的能力。主机到站点 `VPN` 是一种远程访问解决方案，允许用户从家里或旅行期间访问公司网络。站点到站点\
  \ `VPN` 允许分支机构通过互联网连接到总部，而不是使用昂贵的广域网（`WAN`）连接。主机到主机 `VPN` 允许两个用户之间建立受保护的连接。\n\n\
  ### 147. B. 简易文件传输协议（`TFTP`）通常用于为执行预执行环境（`PXE`）启动的计算机下载镜像文件。它不用于远程控制。远程桌面协议（`RDP`）用于\
  \ Windows 中的远程桌面服务，为客户端提供对远程服务器的图形化控制。安全 Shell（`SSH`）和 Telnet 都是允许用户在远程计算机上执行命令的字符化工具。\n\
  \n\n\n\n\n### 149. B. `site-to-site VPN`站点站点 VPN）允许一个网络连接到另一个网络，使得两个网络上的用户都能访问对方的资源。对于分支机构连接，这通常是比`Wide\
  \ Area Network (WAN)`链路更经济的解决方案。`host-to-site VPN`主机到站点 VPN）是一种远程访问解决方案，允许用户从家里或旅行期间访问公司网络。`host-to-host\
  \ VPN`主机到主机 VPN）允许两个独立用户之间建立受保护的连接。`extranet VPN`外网 VPN）旨在为客户、供应商和其他外部合作伙伴提供以受限访问权限连接公司网络的能力。\n\
  \n### 150. C. `EAP` 是 Windows 10 中包含的唯一支持硬件认证的身份验证协议，因此这是唯一可行的选择。`PAP` 以明文传输密码，因此不是可行的方案，`CHAP`\
  \ 也是如此，因为它必须使用可逆加密存储密码。`MSCHAPv2` 提供了足够的密码保护，但不支持智能卡使用所需的硬件认证。\n\n### 151. B, C.\
  \ `Remote Desktop Protocol (RDP)`（远程桌面协议）是`Remote Desktop Services`（远程桌面服务）的组件，该\
  \ Windows 机制允许客户端程序连接到服务器并远程控制。`RDP` 不传输实际应用程序数据；它只传输输入、鼠标移动和图形显示信息。`Virtual Network\
  \ Computing (VNC)`（虚拟网络计算）是一种类似的平台无关且的桌面共享系统。`Secure Shell (SSH)`（安全外壳）和 `Telnet`\
  \ 是基于字符的远程控制解决方案。\n\n### 152. D. `virtual desktop`（虚拟桌面）一词并不是可以在屏幕上显示计算机桌面的投影设备。虚拟桌面可以是虚拟现实环境中计算机显示器的实现；可以是比显示器更大的虚拟化桌面，用户可以滚动查看显示的所有部分；也可以由\
  \ `Microsoft Azure` 提供的云服务，允许用户使用远程设备访问其桌面。\n\n### 153. A, B, C. `RDP` 是`Remote\
  \ Desktop Services`（远程桌面服务）的组件，该 Windows 机制允许客户端程序连接到服务器并远程控制。`RDP` 不传输实际应用程序数据；它只传输输入、鼠标移动和图形显示信息。\n\
  \n### 154. A, B, C. `VNC`是一种图形化桌面共享系统，它使用名为`Remote Frame Buffer (RFB)`（远程帧缓冲）的协议将客户端连接到服务器并远程控制。`VNC`\
  \ 不传输实际应用程序数据；它只传输输入、鼠标移动和图形显示信息。\n\n### 155. A, C. `Telnet`是一种基于字符的远程控制协议和应用程序，适用于所有的计算平台。由于它是严格基于字符的，`Telnet`\
  \ 客户端只传输输入并只从服务器接收基于字符的显示信息。\n\n### 156. C. `Remote Desktop Gateway`（远程桌面网关）是一个\
  \ Windows Server 角色，允许网络外的远程用户在不需要`Virtual Private Network (VPN)`连接的情况下建立`Remote\
  \ Desktop Protocol (RDP)`连接。该网关不提供多个客户端访问一个工作站、访问多个工作站，或在没有客户端的情况下访问工作站。\n\n###\
  \ 157. B, C. `Out-of-band management`（带外管理）使用专用通道连接网络上的设备。这意味着被管理的设备不需要 IP 地址。该通道提供对`BIOS`或`UEFI`\
  \ 固件的访问，并使得在远程计算机上重新安装操作系统成为可能。`Telnet`、`SSH` 和 `VNC` 都带外管理工具。\n\n### 158. C. `Out-of-band\
  \ management`带外管理指的是使用指向网络设备的替代通信通道。该通道可以是调制解器连接、直接电缆连接、无线或蜂窝连接。\n\n### 159. A,\
  \ B, C, D. 首先，需要一个`Wide Area Network (WAN)`（广域网）连接。其次，位于数据链路层及以上。第三，如果使用`TCP/IP`，则需要配置`TCP/IP`\
  \ 参数。第四，需要客户端软件。此外，服务器需要软件来建立会话。`Microsoft RAS`支持客户端和服务器的远程访问。\n\n### 160. B. 当用户通过`VPN`连接到网络时，他们成为了该网络的一员，因此，当用户打开浏览器时，通过`VPN`\
  \ 默认网关访问远程网络，这本质上比从客户端直接连接 Internet 要慢。\n\n### 161. D. `site-to-site VPN`站点站点 VPN）连接两个`Local\
  \ Area Networks (LAN)`（局域网），使得两个网络上的用户都能访问对方。典型的配置是两个站点各有一个作为连接端点的`VPN` 集中器。\n\n\
  ### 162. C. `client-to-site VPN`客户端到站点 VPN）将单个工作站连接到远程`Local Area Network (LAN)`，允许工作站访问远程网络。典型的配置是一个独立的工作站和网络站点的一个`VPN`\
  \ 集中器。\n\n### 163. B, C. 两种常见的`TLS/SSL VPN`连接类型是`TLS/SSL portals`（通过标准网站为用户提供远程资源访问）和`TLS/SSL\
  \ tunnels`（需要客户端浏览器运行活动控件，通常使用 Java 或 Flash）。`TLS/SSL client`和`TLS/SSL gateway`不是常见的\
  \ TLS/SSL VPN 连接。\n\n### 164. A. `host-to-host VPN`主机到主机 VPN）连接两个不同位置的独立工作站，允许每个工作站上的用户通过安全隧道访问对方。典型的配置是两个站点各有一个独立工作站。\n\
  \n### 165. A. `out-of-band`（带外）一词用于描述任何不通过生产网络的对设备的访问方式。将笔记本电脑插入`console port` 避开了网络，因此被认为是带外管理的示例。`In-band\
  \ management`（带内管理）描述的是通过生产网络的访问方法。`Client-to-site`是`Virtual Private Network (VPN)`连接的一种类型，而`Bring\
  \ Your Own Device (BYOD)`（自带设备）是定义允许以及如何允许用户将其个人设备连接到网络的策略。\n\n\n\n\n\n### 167.\
  \ B, C, D. 任何不使用生产网络连接路由器、交换机或其他托管设备的方法都被视为带外管理。这包括将计算机或终端直接连接到设备上、使用点对点调制调器连接，或者通过将所有设备连接到一个隔离的交换机来整合所有设备的专用端口。使用生产网络上的工作站进行远程登录则被视为带内管理。\n\
  \n### 168. C. `VNC` 支持许多操作系统，可以通过网络浏览器运行，并且是免费的。然而，它的速度并不比竞争产品快。\n\n### 169. A.\
  \ `Telnet (TELetype NETwork)` 是第一个 TCP/IP 终端仿真程序，但由于其局限性，现在已很少使用。它仅基于字符，并且将所有数据均以明文形式传输，这在是不安全的。`Secure\
  \ Shell (SSH)` 解决了安全问题，但它同样是基于字符的。`Windows Terminal Services` 和 `Virtual Network\
  \ Computing (VNC)` 都是为了提供图形化终端仿真而创建的。\n\n### 170. A, C, D. `Tunneling`（隧道技术）是将一个数据包封装在另一个数据包中的过程。系统随后对整个数据进行加密。`Message\
  \ integrity`（消息完整性）允许接收者检测到任何篡改。`Authentication`（认证）确保只有预期的接收者才能访问数据。并没有一种名为 socketing\
  \ 的适用技术。\n\n### 171. B, C. 基础 `VPN` 通常使用全隧道，其中系统所有的流量都被封装进行传输。`Split tunneling`（分拆隧道）是该方法的一种变体，其中只有部分系统流量使用\
  \ `VPN`；其余部分则通过正常方式在网络上传输。管理员可以选择哪些应用程序和设备使用 `VPN`。`Split tunneling` 可以节省 `VPN`\
  \ 使用的带宽，并在不需要封装的情况下提供对本地服务的访问，通过多路复用提供额外的数据保护或改进的性能。\n\n### 172. C. `Telnet` 以明文传输按键，包括用户名和密码。因此，它是不安全的。`Secure\
  \ Shell (SSH)` 通过加密密码及其在网络上传输的其他数据，改进了 `Telnet` 的性能。与 `Telnet` 一样，`SSH` 是免费的，且不支持图形化仿真。\n\
  \n### 173. A. `RDP` 是为 `Windows Terminal Services`（现称为 `Remote Desktop Services`）创建的客户端/服务器协议。它不用于\
  \ `VNC`、`Citrix products` 或 `Telnet`。\n\n### 174. B, C. 在这种情况下，每个用户都希望使用最快的服务通过\
  \ `VPN` 连接到公司网络。在列出的所有服务中，只有 `DSL` 和 `CATV` 能满足这一要求。`CATV` 和 `DSL` 连接支持高数据速率，并可以使用\
  \ `VPN` 进行连接，因此它们符合速度要求。每个用户可以使用现有的 `CATV` 连接或使用现有的电话线进行安装。线路安装完成后，每个用户需要在其计算机上安装\
  \ `VPN` 客户端并配置其使用 `L2TP` 和 `IPSec`。`Modem`（调制解调器）连接很慢——最大上行速度为 33.6 Kbps，下行速度为 56\
  \ Kbps。`ISDN` 对于基本速率接口 (BRI) 的最大传输率为 128 Kbps。\n\n### 175. D. `Extensible Authentication\
  \ Protocol (EAP)` 是一种与 `Point-to-Point Protocol (PPP)` 用的壳协议，使系统支持各种类型的认证。`EAP`\
  \ 的主要优势是它允许计算机使用密码以外的机制进行认证，包括公钥证书、读卡器和生物识别设备（如指纹扫描仪）。`Password Authentication Protocol\
  \ (PAP)` 和 `Challenge Handshake Authentication Protocol (CHAP)` 仅支持密码认证。`Point-to-Point\
  \ Tunneling Protocol (PPTP)` 是一种 VPN，而非认证协议。\n\n### 176. C. 使用人类物理特征进行身份验证的技术是 `biometrics`（生物识别）。\n\
  \n### 177. A. 这种技术可以根据生物识别特征来识别用户。\n\n### 178. C. `insider threat`（内部威胁）定义源于授权用户。\n\
  \n### 179. D. `fail close`（断电关闭）和 `fail open`（断电开启）是指在紧急情况下电控锁的状态。这必须是一个经过仔细考虑的决定，因为可能存在潜在的安全隐患。然而，在火灾或其他灾难发生，将门配置为\
  \ `fail closed` 则存在潜在的安全隐患。\n\n### 180. F. `honeypot`（蜜罐）是一种用于诱捕攻击者的计算机。\n\n###\
  \ 181. A, C. `Closed-circuit television cameras`（闭路电视摄像头）是一个闭环系统的一部分，其信号传输到位于安全中心的显示。`IP\
  \ cameras` 是向无线接入点传输信号的独立设备。虽然 `CCTV cameras` 只能由安全中心的人监控，但 `IP cameras` 可以由任何带有浏览器的授权用户监控。`Lightweight\
  \ Directory Access Protocol (LDAP)` 是一种目录服务协议，`Network Access Control (NAC)` 是一种服务；两者都不是视频监控设备。\n\
  \n\n\n\n\n# 186. A. 视频监控可以监控敏感区域内用户的所有活动。通过合理放置设备，可以监控特定事件的操作，例如在计算机中输入的命令。身份识别标志、钥匙扣、运动检测和锁定柜子可以指示个人员是否出现在敏感区域内，但它们无法监控具体的活动。\n\
  \n# 187. A, C, E. 射频识别 (`RFID`) 设备是一种小型芯片，可以被附近的读取器进行电子检测。该芯片可以包含少量数据，例如授予个人访问安全区域所需的身份验证凭据。钥匙扣、感应卡（`prox\
  \ cards`）和智能储物柜可以使用 RFID，让用户通过将设备设备在读取器附近挥动来打开门。读卡锁通常需要将卡插入读取器，并通常使用磁条存储数据。密码锁则依赖于用户提供的数据——即组合数字。\n\
  \n# 188. B, D. 拥有钥匙扣是你所拥有的东西，但钥匙扣可能会丢失或被盗，因此其安全性通过输入 `PIN`（即你所知道的密码）来确认。除非用户既丢失了钥匙扣又泄露了\
  \ `PIN`，否则设备仍然是安全的。\n\n# 189. A, C. 钥匙扣和感应卡（`prox cards`）通常使用射频识别 (`RFID`) 设备，让用户通过将设备在读取器附近挥动来打开门。读卡锁通常使用磁条存储数据，并要求将卡物理插入读取器。密码锁则依赖于用户手动提供的数据——即组合数字。\n\
  \n# 190. B, D. 视频监控理论上可以防止“邪恶入侵”攻击，这种攻击的形式是出于恶意目的而故意连接到网络的违规访问点。视频监控还可以通过监控授权用户的活动来帮助防止内部威胁。视频监控无法防止社会工程攻击（这仅涉及与人的交流），也无法防止暴力攻击（后者通常是远程进行的）。\n\
  \n# 191. D. 当生物识别认证过程中发生误报（false positive）时，不应被授予访问安全设备或位置权限的用户获得了访问权限。假阴（false\
  \ negative）则是本应获得访问权限的用户被拒绝。\n\n# 192. A. 所有列出的机制设计旨在使任何篡改或物理破坏硬件设备的尝试变得显而易见。因此，这是一种防改检测形式。资产跟踪用于定位和识别硬件。地理围是一种用于限制网络访问的无线网络技术。端口安全指的是网络交换机端口。\n\
  \n# 193. C. 使用人类物理特征验证用户身份的技术被称为生物识别。生物识别设备可以根据指纹、视网膜图案、声纹和其他特征识别用户。\n\n# 194. D.\
  \ 尾随者（tailgater）是一种通过紧跟授权用户进入安全区域的入侵者类型。大多数人都会足够礼貌，会为下一个人开门，而无论其是否有进入的权限。因此，尾随者不是一种入侵防御机制。身份识别标志、锁和钥匙扣是防止入侵的方法。\n\
  \n# 195. A. 身份识别标志、钥匙扣和访问控制通道（`mantraps`）都是物理安全机制，因为它们防止了未经授权的人员进入数据中心等敏感区域。这些机制不用于数据文件安全。\n\
  \n# 196. C, D. 生物识别和视频监控是检测入侵的机制。\n\n# 197. B. 人必须进入的构造被称为 `mantrap`（步入室）。这必须配置为故障锁模式。\n\
  \n# 198. B. 当 Ralph 的第一个理论被证明为错误时，下一个逻辑步骤就是制定另一个理论。\n\n# 199. A, D. 当 Ralph 的第一个理论被证明为错误时，下一个逻辑步骤就是制定另一个理论。这理论上可能涉及重新访谈用户或升级问题。\n\
  \n# 200. C. 终端访问控制系统加强 (`TACACS+`) 是一种旨在提供 `AAA`服务的协议。\n\n## 第 5 章：网络故障排除\n\n###\
  \ 1. A. 故障排除的第一步是通过建立与网络问题相关的症状来识别问题。在这一步中，问题通常以故障工单（trouble tickets）的形式报告，并进行优先级排序。尽管你可以在整个故障排除过程中继续向用户提问，但这通常与第一步相关。\n\
  \n### 2. C. 系统级错误是导致单个用户系统（计算机）完全无法使用的问题。列出的所有其他问题都会影响一个以上的用户。\n\n### 3. D. 任何影响网络上所有用户的问题都是网络级问题，应该被赋予最高优先级。例如路由器问题。\n\
  \n### 4. B. 在这种情况下，只有一个用户报告了问题。因此，最可能的下一步是在连接到该段的另一台计算机上执行相同的任务。如果 Ed 能够成功执行该任务，那么问题可能存在于用户的计算机或到交换机的连接上。由于没有其他用户报告相同的问题，网络上的服务器和交换机可能处于正常运行状态。不需要检查路由器，因为用户和服务器在同一个网络上。\n\
  \n### 5. A. 故障排除的第一步是通过建立与报告的网络问题相关的症状来识别问题。在这一步中，你向用户提问许多问题，以识别和定义问题的症状，并对故障工单进行优先级排序。\n\
  \n### 6. C. 识别问题后，下一步是为问题的可能原因建立理论。之后，你可以测试你的理论、制定行动计划、实施解决方案、验证系统功能并记录整个过程。\n\n\
  ### 7. B. 故障排除的第二步是尝试复制问题并对其可能的原因建立理论。当你排除问题故障时，你随后会测试你的理论以确认你的发现。\n\n### 8. D.\
  \ 通过猜测更换组件可能会由于运气解决问题，但更有可能是浪费时间和硬件。\n\n\n\n\n\n## 9. C. 在故障排除过程中，识别问题的首要步骤之一是质疑显而易见的问题，例如计算机是否插了电源或已开启。当屏幕空白时，用户不太可能知道电脑的\
  \ IP 地址或安装了哪些更新。询问其他人是否使用过该电脑可能在之后才会提到，但在故障排除过程的这一阶段，帮助不大。\n\n## 10. B. 如果问题存在于特定的服务器或其他网络组件中并导致许多用户无法工作，则它属于共享资源问题。如果问题存在于为整个网络服务的服务的中，则属于全网问题。系统级问题会导致某台计算机无法运行，使使用户无法完成任何工作。应用程序问题是指仅影响单个用户访问设备或应用程序的问题。\n\
  \n## 11. A. 既然只有一个用户报告了问题，而且他承认更改过自己的 IP 配置，Alice 应该从使用 `ipconfig` 命令检查配置开始。如果是路由器、`DNS`\
  \ 服务器或 `WINS` 服务器引起了问题，将会有多一个用户遇到困难。\n\n## 12. A. 既然只有一个用户报告了问题，该用户的电脑及其配置是最可能的嫌疑组件。`DNS`、代理或路由器问题会影响多一个用户。\n\
  \n## 13. C. Alice 正在使用基于开放系统互连（OSI）参考模型的自上而下方法。她从模型的顶端（应用层）开始检查系统的电子邮件功能，然后向下检查电脑的\
  \ IP 配置（网络层）、局域网连接性（数据链路层）以及电脑电缆（物理层）。自下而上的方法将从电缆开始。分而治法和质疑显而易见的问题并不涉及 Alice 以这种顺序采取的步骤。\n\
  \n## 14. A. 这个问题有很多可能的原因比路由器配置错误更有可能，因此这不是 Alice 会首先检查的内容。询问用户是否可以访问局域网试图隔离问题。如果她无法访问，问题可能在她的电脑上；如果可以访问，那么问题就在互联网访问基础设施的某处。如果其他用户也遇到了该问题，那么该问题应该获得更高的优先级，Alice\
  \ 也知道问题不在用户的电脑上。虽然这可能不是她检查检查的事，但职级较高的用户通常获得优待，这是一个政治现实。\n\n## 15. B. 记录你发现的一切以及你所做的每一都是故障排除方法中至关重要的部分，必须在采取任何其他行动之前开始。然而，它看起来是故障排除方法中的最后一步。\n\
  \n## 16. E. 故障排除的第一步涉及识别问题并创建工单。在工单确定优先级后，你再完成其他的故障排除步骤。\n\n## 17. D. 在故障排除过程中，你必须确定是否有任何变化。这通常涉及询问用户是否安装或重新配置了任何新或旧硬件或软件。\n\
  \n## 18. C. 在建立可能原因的理论后，你可以通过逐一更换硬件组件来测试该理论，直到找到故障设备。\n\n## 19. D, F. 验证路由器运行正常并转发流量，以及验证客户端的\
  \ IP 配置是否正确，不认为是通用的故障排除步骤。你可能将这两个步骤作为通用故障排除步骤的子集执行。\n\n## 20. A, C. 当报告网络问题或事件时，记录工作就开始了。适当的记录让一线支持技术人员更容易确定优先级，并在必要时将电话升级给高级技术人员。\n\
  \n## 21. B, D. 在确定优先级时，全网问题优先于部门问题，共享资源问题优先于个人桌面问题。\n\n## 22. A, B, D. 一线技术人员的经验通常比二线技术人员少。一线技术人员是用户的第一个接触点。他们接收并优先处理帮助台电话，并在必要时将问题升级给二线技术人员。一线技术人员通常处理个人桌面问题，而二线技术人员则排除路由器和交换机等任务关键网络组件的故障。\n\
  \n## 23. C. 影响整个网络的问题应该赋予最高优先级。这包括任务关键的骨干路由器。影响多个局域网或整个部门的问题通常赋予次高优先级。影响共享服务器的应用程序问题应该赋予次高。如果已经报告了其他问题，单台电脑的问题应赋予最低优先级。\n\
  \n## 24. B. 影响整个网络的问题应该赋予最高优先级。这包括任务关键的骨干路由器。影响多个局域网或整个部门的问题通常赋予次高优先级。影响共享服务器的应用程序问题应该赋予下一次优先级。单台电脑的问题应该赋予最低优先级。\n\
  \n## 25. D. 在识别问题并建立和测试可能原因的理论后，你必须制定一个行动计划来解决问题，并识别你的解决方案可能产生的任何潜在影响（正面或负面）。然后，你实施解决方案，测试结果，并完成事件记录。\n\
  \n## 26. G. 故障排除过程的最后一步是记录解决方案并向用户解释发生了什么以及为什么。实际上，记录应该在报告问题时开始，并在整个故障排除过程中不断更新记录。\n\
  \n## 27. A, D. 故障排除过程的第一阶段要求 Alice 通过收集信息来识别问题。了解是谁报告了问题以及自上次可用以来发生了什么变化，可以为 Alice\
  \ 提供信息，帮助她判断问题位于用户工作站、网络某处还是服务器本身。其他选项旨在测试关于可能原因的理论，这是故障排除的后续阶段。\n\n## 28. A. 由于多个问题似乎互不相关，Alice\
  \ 应该通过为每个问题创建单独的工单并确定优先级来分别处理它们。这些问题似乎都不严重到需要升级，也没有必要更换电脑。虽然可以派遣技术人员一次性处理所有问题，但为每个问题分配优先级并像处理任何其他故障电话一样处理它们会更有效。\n\
  \n## 29. B. 故障排除的第一阶段是收集信息。了解打印机是否可以通过网络访问可以帮助 Alice 隔离问题位置并制定可能原因的理论。安装驱动程序、检查交换机和升级固件都是故障排除过程中较后阶段的一部分：测试理论以确定问题原因。\n\
  \n\n\n\n\n### 30. A\n`线序测试仪`（wiremap tester）由一个同时连接到 `UTP` 电缆所有八根线的的主机和一个连接到另一端的`环回设备`（loopback\
  \ device）组成，使你能够一次测试所有线。`线序测试仪`可以检测开路、短路以及线交叉。然而，它无法检测对分故障，因为在这种故障情况下，引脚是正确连接的。\n\
  \n### 31. D\n安装人员必须对每条电缆线路进行的首项也是最重要的测试是`导通性测试`（continuity test），它确保电缆两端的每根线都连接到正确的`引脚`且仅连接到正确的引脚。如果电缆线路一端的`引脚`连接到另一端的两个或多个`引脚`，则电缆存在短路。\n\
  \n### 32. A\n`交叉回线`（rollo cable）是一种空调制电缆，通常是扁平且呈浅蓝色，两端的引脚定义反转，以便终端能够通过设备的专用`控制端口`（console\
  \ port）与路由器或交换机通信。其他选项都不适用于此目的。`直通线`（straight through cable）是用于连接计算机到交换机的标准网络电缆。`交叉线`（crossover\
  \ cable）设计用于直接连接两个网络适配器。`吊顶线`（plenum cable）是一种用于空气空间的电缆，其外护在燃烧时不会产生有毒烟雾。`屏蔽电缆`（shielded\
  \ cable）旨在保护信号免受电磁干扰。`分路器`（tap）是一种用于将同轴电缆分支到两个设备的设备。\n\n### 33. A\n`直通线`（straight\
  \ through cable）是用于连接计算机到墙座的标准网络跳线线。`交叉线`（crossover cable）设计用于直接连接两个网络适配器。`交叉回线`（rollover\
  \ cable）用于使终端通过设备的`控制端口`与路由器或交换机通信。`吊顶线`（plenum cable）是一种用于空气空间的电缆，其外护在燃烧时不会产生有毒烟雾。\n\
  \n### 34. C\n提供这种能力的技术称为`时域反射法`（time-domain reflectometry，TDR）。测试仪向电缆发送信号，并测量信号反射从另一端返回所需的时间。利用这些信息和电缆的`标称传播速度`（N\
  \ velocity of propagation）——这是由电缆制造商提供的规格——该设备可以计算电缆线路的长度。列出的其他设备并非这样工作的。\n\n###\
  \ 35. B\n`短路`（short circuit）是一种布线故障，表示电缆线路一端的`引脚`连接到另一端的两个`引脚`。要修正此问题，你必须更换带有故障接线的连接器。其他建议都不是布线故障的解决方案。\n\
  \n### 36. C\n所有建议的工具都能将墙座与正确的配线架端口关联，但`信号发生器`（tone generator）和`寻器`（locator）无疑是最便宜的解决方案。\n\
  \n### 37. D\n电话电缆技术人员有自己的专用工具，例如`测线器`（butt set），这是一种带有鳄鱼夹的一体式电话听筒，操作人员能够在电缆可及的地方连接到线路。\n\
  \n### 38. B, D\n`压接刀`（punchdown tool）对这项操作至关重要。在一个动作中，该工具剥除导线的绝缘层，将其压入连接器并切掉末端的多部分。`剥线器`（wire\
  \ stripper）简化了为连接过程准备电缆的任务。`压钳`（crimper）仅用于将连接器安装到跳线上。`尾纤器`（pigtail splicers）和`熔接器`（fusion\
  \ splicers）仅用于光纤网络。\n\n### 39. A\n`光功率测试仪`（OLTS）识别光纤布线中的信号损耗。`时域反射仪`（TDR）测量铜缆布线中的电信号，而不是光信号。`信号发生器`寻器工具以及`线序测试仪`用于铜缆布线安装，而不是光纤布线。\n\
  \n### 40. B\n你可以使用`电缆测试仪`（cable certifier）来识别各种电缆性能特性，通常包括电缆长度、信号衰减、串扰、传播延迟、延迟偏移和回损，此外提供`线序测试仪`的所有功能。列出的其他工具专门用于单一测试模式，且不测试串扰。\n\
  \n### 41. B\n`吊顶线`（plenum cable）是一种用于建筑空气空间（称为`吊顶`）的电缆，其外护具有更高的耐热性，且燃烧时不会产生有毒烟雾。使用吊顶线对\
  \ EMI 或电缆上的流量类型没有影响，在低温区域也不需要它。\n\n### 42. D\n`光纤时域反射仪`（OTDR）是一种在光纤网络上传输光脉冲并测量时间间隔、反射率、光损耗以及电缆线路长度的设备。`万用表`、`信号发生器`和`线序测试仪`均适用于铜铜缆网络。\n\
  \n### 43. C\n`测线器`（butt set）是一种带有鳄鱼夹的一体式电话听筒，操作人员能够在电缆可及的地方连接到线路。它们由电话技术人员使用，但通常不数据线安装人员使用。其他选项都是标准工具。\n\
  \n### 44. B\n`压钳`（crimper）是一种电缆安装人员通过在散线上连接 `RJ45` 连接器来制作跳线的钳状设备。安装人员使用`压接刀`而非`压钳`将模块连接到电缆末端。并不总是为每种电缆类型购买`压钳`。某些`压钳`是为单一电缆/连接器组合设计的，但有很多可以更换接头。\n\
  \n### 45. A, C\n`电缆测试仪`可以检测`信号发生器`和`线序测试仪`可以检测的所有故障，并且还能更多，例如指定电缆线路是否符合电缆标准的性能规格。当测试新电缆类型时，必须将电缆标准的规格添加到设备中。`电缆测试仪`的费用远高于其他电缆测试解决方案。有支持多种传输介质的电缆测试仪。\n\
  \n### 46. C, D\nAlice 可以`信号发生器`和`寻器`或`线序测试仪`来识别和测试电缆连接。通过将`信号发生器`或远程线序单元连接到电缆线路的一端，她可以使用`寻器`或主控线序单元找到另一端。这可以使她能够识别电缆线路的起点和终点。`环回适配器`（loopback\
  \ adapter）用于测试端口的发送和接收能力。`封包嗅器`（packet sniffer）捕获并分析网络流量；它无法识别电缆。\n\n### 47. B,\
  \ D\n`压钳`（crimper）是一种用于将连接器安装到跳线的设备。`剥线器`虽然在过程中并非不可少，但可以简化准备电缆的任务。`压接刀`（punchdown\
  \ tool）用于将模块连接到电缆末端，用于墙座和配线架。安装连接器时并不使用标准钳子。\n\n\n\n\n\n## 48. B. 压线器和打线器是相对简单且廉价的机械设备，电缆安装人员使用它们将散装线连接到连接器上。线序测试仪是一种用于电缆测试的电子设备，但它仍然相对简单。电缆认证仪是一种复杂的电子设备，可以对电缆线路进行一系列测试，确认电缆是否符合所需的布线标准，并维护测试过程的记录。电缆认证仪是目前列出的设备中最昂贵的。\n\
  \n## 49. C. 图中所示设备是万用表，它用于测量铜质导体上的电流，例如非屏蔽双对 (UTP) 网络。此工具无法执行在其他选项中描述的任何任务。\n\n\
  ## 50. B. 图中所示设备是打线器，用于将非屏蔽双对 (UTP) 电缆末端连接到模块化墙面板和配线架上使用的模块座式连接器（keystone connectors）。在将电缆中的单根线与连接器对齐后，使用该工具将每根线压入其槽中。该工具还会切断线皮以建立电气接触并修剪线末端。此工具无法执行在其他选项中描述的任何任务。\n\
  \n## 51. A. 图中所示设备是信号发生器和寻线，用于测试非屏蔽双对 (UTP) 布线并检测某些基础布线故障。此工具无法执行在其他选项中描述的任何任务。\n\
  \n## 52. B. 图中所示设备是压线器，用于通过在长度较短的散装线两端安装连接器来制作跳线线。此工具无法执行在其他选项中描述的任何任务。\n\n## 53.\
  \ A. 图中所示设备是话筒式检测仪（butt set），是电话安装人员和线路维修人员的基本工具。通过将夹子连接到打线块的引脚上，你可以访问电话电路进行测试或拨打电话。\n\
  \n## 54. B, C. 压线器是一种像钳子一样的工具，电缆安装人员用它在跳线线上安装 `RJ45` 连接器。打线器是电缆安装人员用于在电缆末端安装 `keystone`\
  \ 连接器的工具，用于墙面板和配线架。穿线器是一种用于电缆穿过墙壁、地板和天花板的设备，但由于电缆已经拉好，Ralph 不需要这种工具。光纤接头是一种仅用于光电缆安装的工具。\n\
  \n## 55. A. 无法检测到线缆上的信号表明电缆内部某处存在断路，或者一个或两个连接器的引脚连接不良。这种状态被称为开路（open circuit）。短路是指电线在电缆的一端连接到两个或多个引脚。对错（split\
  \ pair）是指两根线在电缆两端以完全相同的方式错误映射的连接。串扰（Crosstalk）由于一根线上的信号泄漏到其他线而引起的干扰类型。\n\n## 56.\
  \ B. 短路是指电线在电缆的一端连接到两个或多个引脚，或者两根或更多根电线的导体在电缆内部接触。这将导致施在某一端单个引脚上的信号在另一端的多个引脚上被听到。开路表现为无法检测到线缆上的信号，表明电缆内部某处存在断路，或者一个或两个连接器的引脚连接不良。对错是指两根线在电缆两端以完全相同的方式错误映射的连接。串扰是由于一根线上的信号泄漏到其他线而引起的干扰类型。\n\
  \n## 57. C. 对错是指两根线在电缆两端以完全相同的方式错误映射的连接。电缆一端的每个引脚都正确连接到另一端的对应引脚，但用于连接的电缆内部布线是错误的。在正确的布线连接中，每个双对应包含一根信号线和一根地线。在对错的情况下，两根信号线可能扭绞在一起。这会产生大量的串扰，干扰涉及的信号。由于所有引脚都已连接，信号发生器和寻线无法检测到这种故障。开路表现为无法检测到线缆上的信号，表明电缆内部某处存在断路，或者一个或两个连接器的引脚连接不良。短路是指电线在电缆的一端连接到两个或多个引脚，或者两根或更多根电线的导体在电缆内部接触。倒错是指线对中的两根线在电缆的一端连接到了错误的引脚。这三种故障都可以通过信号发生器和寻线检测。\n\
  \n## 58. C. 对错是指两根线在电缆两端以完全相同的方式错误映射的连接。电缆一端的每个引脚都正确连接到另一端的对应引脚，但用于连接的电缆内部布线是错误的。在正确的布线连接中，每个双对应包含一根信号线和一根地线。在对错的情况下，两根信号线可能扭绞在一起。这会产生大量的串扰，干扰涉及的信号。开路、短路和倒错会干扰电缆性能，但不会使其更容易受到串扰。\n\
  \n## 59. D. 对错是指两根线在电缆两端以完全相同的方式错误映射的连接。电缆一端的每个引脚都正确连接到另一端的对应引脚，但用于连接的电缆内部布线是错误的。在正确的布线连接中，每个双对应包含一根信号线和一根地线。在对错的情况下，两根信号线可能扭绞在一起。这会产生大量的串扰，干扰涉及的信号。由于所有引脚都已连接，信号发生器和寻线无法检测到这种故障，线序测试仪和万用表也无法检测。然而，电缆认证仪是一种复杂的电子设备，可以检测所有类型的电缆故障（包括对错），并测量电缆性能参数。\n\
  \n## 60. C, D. 时域反射仪 (TDR) 是一种通过在一端发送信号并测量反射从另一端返回的时间来确定电缆长度的设备。利用这些信息和电缆制造商提供的标称传播速度\
  \ (NVP)，该设备可以计算电缆线路的长度。对于长度断断的电缆，TDR 可以计算到断点处的电缆长度。电缆认证仪通常集成了时域反射功能。信号发生器和寻线或万用表无法定位电缆断点。\n\
  \n\n\n\n\n# 61. C. 在提供的选项中，问题的唯一来源可能是电缆布线使用了未针对千兆以太网额定的电缆类型。一些旧建筑可能仍安装了 `Category\
  \ 3` 电缆，这种电缆曾用于最初的双线以太网规范。`Cat 3` 在许多方面都不适用于千兆以太网，并可能导致 Alice 正在经历的性能低下。在采用不同引脚标准进行布线的电缆安装中，只要每段布线的两端都使用相同的引脚，就不会影响性能。如果只连接了两对线，千兆以太网将完全无法工作。收发器位于\
  \ Alice 公司从旧地点搬来的设备中，因此它们并不不匹配。\n\n# 62. B. Ralph 可以使用测号发生器和定位仪来确定与每个办公室连接对应的电缆。通过将测号发生器连接到电缆布线的一端，他可以使用定位仪找到另一端。电缆测试仪可以识别各种电缆性能特性，通常包括电缆长度、信号衰减和串扰。光时域反射仪（`OTDR`）是一种用于测量光纤长度和其他特性的设备。多用表是一种用于测量铜电缆上电流的设备。\n\
  \n# 63. B. 光损耗测试仪（`OLTS`）是光源和光功率计组合的术语。在没有设备连接到它们的情况下，光功率计本身无法测试电缆布线。光时域反射仪（`OTDR`）是一种用于测量光纤长度和其他特性的设备。多用表是一种用于测量铜电缆上电流的设备。\n\
  \n# 64. C. 分离对（split pair）是一种连接，在电缆的两端两根线以完全相同的方式被错误映射。在接线良好的连接中，每对扭绞线应包含一根彩色信号线和一根条纹地线。在分离对中，可能会两根信号线扭绞在一起形成一对。这会产生过量的串扰，破坏两个涉及的信号。由于所有引脚都连接正常，测号发生器和定位仪无法检测到这种故障。开路表现为无法在导线上检测到信号，这表明电线断路或一个或两个连接器处连接不良。短路是指一根线连接到两个或更多引脚，或者两根或更多线的导体相互接触。对调换（Transposed\
  \ pairs）是一种故障，即电缆一端对对中的两根线都连接到了错误的引脚。这三种故障都可以用测号发生器和定位仪检测到。\n\n# 65. C. 衰减是信号在距离传输过程中（无论是通过有线还是无线介质）变弱的。传输距离越远，信号越弱。吸收是无线信号在通过不同材料时发生变化的倾向。延迟是信号从源地到目的地所需时间的度量。串扰是有线网络上发生的一种干扰，当信号泄漏到相邻导线时就会发生。\n\
  \n# 66. B, C. 光纤连接器上的污垢会降低信号强度，导致分贝损失。电缆长度过长会导致由于分贝损失产生更大的衰减和更弱的信号。电磁干扰和信号串扰都是影响铜电缆传输的因素。\n\
  \n# 67. A, B, C. 光纤连接器上的污垢会降低信号强度，导致分贝损失。电缆长度过长会导致由于分贝损失产生更大的衰减和更弱的信号。电磁干扰和信号串扰都是影响铜电缆传输的因素。\n\
  \n# 71. 千兆以太网标准要求交换机和网络适配器默认支持自动协商，使设备能够通信并为双方选择最佳可用网络速度和双工模式。因此，除非有人将一个或两台设备上的速度或双工设置修改为不兼容的值，否则不再发生速度不匹配和双工不匹配。\n\
  \n# 72. D. 办公环境中的荧光灯具和其他设备会产生磁场，导致电磁干扰（EMI）。当铜质电缆布线过靠近此类设备时，磁场会在电缆上产生电流，干扰网络设备交换的信号。\n\
  \n\n\n\n### 74. C. Alternative B PoE 变体可以使用 5 类（Cat 5）或更高级的 10Base-T 或 100Base-TX\
  \ 电缆中的空线对为连接的设备供电。Alternative A 和 4PPoE 变体无法以这种方式使用空线对；它们使用同时传输数据的线对供电。对于千兆太网或更快的安装，Alternative\
  \ B 能够使用数据线。\n\n### 75. C. 抖动定义为单个网络数据包传输中的延迟。对于音频或视频传输，抖动会导致丢字或丢帧。对于数据文件传输，抖动可能需要重传数据包。\n\
  \n### 76. A, B, C, D. 1000Base-SX 标准要求最大长度约为 500 米的多模光纤，而新的光纤长度为 4000 米且使用的是单模光纤。1000Base-SX\
  \ 收发器也将与另一端的 1000Base-BX10 收发器不兼容。1000Base-BX10 使用 1,300 到 1,600 纳米（nm）的波长，而 1000Base-SX\
  \ 使用 770 到 860 nm 的波长。\n\n### 77. A. 全双工网络上不会发生冲突，因此问题显然与通信的双工模式有关。在双对电缆上运行的原始半双工模式以太网通过同时查看发送和接收（TX/RX）引脚上的数据来检测冲突。在全双工模式下，数据应该同时进行发送和接收。当连接的一侧配置为全双工（如\
  \ Alice 的新电脑那样），而另一端配置为半双工（如交换机必须这样做）时，一侧的全双工通信在半双工侧看起来就像冲突。半双工适配器会在每次冲突后发送抖动信号，导致全双工侧接收到一个不完整的帧。然后双方都开始在循环中重传帧，导致网络性能大幅下降。ping\
  \ 测试没有检测到问题，因为 `ping` 每次只向一个方向发送少量数据。其他选项也可能导致 ping 测试失败。解决该问题的办法是配置所有设备自动协商其速度和双工模式。\n\
  \n### 78. B, E. 问题的可能原因是远程服务器上的 DNS 进程损坏或未运行。另一个可能原因是防火墙阻止了对服务器非屏蔽双绞线（UTP）端口 53\
  \ 的访问。这两者都会导致端口无法访问。已通过 `ping` 工具验证，服务器上的传输控制协议/互联网协议（TCP/IP）客户端正在运行。这意味着 Ralph\
  \ 电脑上和 DNS 服务器上的 IP 主机配置均在正常工作。路由器不需要运行 DNS 即可转发数据报。\n\n### 79. A, B. Telnet 和 FTP\
  \ 都是包含命令行客户端应用程序的协议，其中 Telnet 提供终端仿真功能，FTP 提供文件传输功能。SNMP 和 DNS 都是应用层协议，但它们中都不包含程序。Nslookup\
  \ 具有命令行界面，但它在本地系统上执行命令，而不是在远程系统上。\n\n### 80. D. Windows `tracert` 工具发送一系列具有递增存活时间（TTL）值的\
  \ ICMP 消息，这些消息可以识别数据包通过网络路径上的每个路由器。`Ping` 使用 ICMP，但它并不操纵 TTL 值。`Netstat`、`Route`、`Nslookup`\
  \ 和 `Hostname` 不使用 ICMP 消息，在执行正常功能时也不操纵 TTL 值。\n\n### 81. B. 如果 Alice 怀疑 DNS 服务器没有解析主机名，她应该尝试使用互联网协议（IP）地址而不是名称连接远程主机。如果她能够连接，就说明所有内部局域网（LAN）组件和互联网网关运行正常，远程主机也正常。问题最可能出现在\
  \ DNS 服务器本身。如果 Alice 无法使用 IP 地址连接远程主机，则问题不在 DNS 服务器。她需要进行更多测试以隔离问题设备和受影响的区域。`ipconfig`\
  \ 是一个工作站命令，允许你验证本地 IP 配置；它不用于测试 DNS 服务器的功能。使用 `ping` 命令只能告诉你托管 DNS 服务的计算机在开放系统互连（OSI）模型的网络层上是否运行正常；它不会测试\
  \ DNS 服务的功能。`tracert`（或 `traceroute`）命令用于识别到达目的地的逐跳跳转路径；它不允许你测试 OSI 模型网络层以上的功能。\n\
  \n### 82. B, E. `nslookup` 和 `dig` 都是命令行实用，你可以将它们指向特定的 DNS 服务器，然后生成查询以显示程序从服务器检索的资源记录信息。`netstat`\
  \ 显示有关网络协议的信息，而 `nbtstat` 显示源自系统的传输控制协议/互联网协议网络基本输入输出系统（NetBIOS over TCP/IP）实现的信息。`arp`\
  \ 是一个你可以用于显示和管理系统地址解析协议（ARP）表项的工具。`netstat`、`nbtstat` 和 `arp` 无法显示资源记录。\n\n### 83.\
  \ D. 在 Windows 上带有 `-a` 参数运行 `arp` 工具会显示 ARP 缓存的内容。缓存包含 `arp` 解析为介质控制（MAC）地址的互联网协议（IP）地址。`ping`、`tracert`、`netstat`\
  \ 无法显示资源记录。\n\n### 84. B. Windows `tracert` 工具通过发送一系列具有递增存活时间（TTL）值的 ICMP 回显请求消息到目的地来工作。后续消息在超时之前会到达路径上更远的一跳。因此，`tracert`\
  \ 列出了数据包必须跨越的路由器名称和地址。`ping`、`netstat`、`arp` 和 `hostname` 工具无法产生此输出。\n\n### 85.\
  \ A. Windows `ping` 工具通过向指定目的地发送一系列 ICMP 回显请求消息来工作。目标系统响应的 ICMP 回显应消息列在输出中。`tracert`、`netstat`、`arp`\
  \ 和 `hostname` 工具无法产生此输出。\n\n### 86. C. 不带任何参数运行 Windows `netstat` 工具会生成工作站活动连接列表。`ping`、`tracert`、`arp`\
  \ 和 `hostname` 工具无法产生此输出。\n\n### 87. B. 与 `traceroute` 和 `tracert` 一样，`pathping`\
  \ 能够生成到达特定目的地的路由器列表。`pathping` 还显示每跳的丢包百分比，这是 `traceroute` 和 `tracert` 无法到的。`ping`、`netstat`\
  \ 和 `route` 工具无法显示路由追踪。\n\n### 88. C. `tracer`（或 `tracert`）工具通过使用具有递增存活时间（TTL）值的回显请求消息来定位故障路由器。`ifconfig`\
  \ 是 Unix 和 Linux 系统的网络配置工具；`ping` 可以测试与另一个传输控制协议/互联网协议（TCP/IP）系统的连通性，但无法定位故障路由器；而\
  \ `netstat` 显示有关网络连接和流量的信息，但无法定位故障路由器。\n\n\n\n\n## 89\nE. 所有 Windows `ping` 事务都使用互联网控制消息协议\
  \ (`ICMP`）消息。`ICMP` 消息被直接封装在互联网协议 (`IP`）数据报文中；它们不使用传输层协议，如用户数据报协议 (`UDP`）。发送到本地网络目的地的\
  \ `ping` 事务被封装在以太网帧中。在 Unix 和 Linux 上，`ping` 使用 `UDP`，它同样被封装在 IP 数据报文中。\n\n## 90\n\
  B. `netstat` 实用程序可以显示路由表以及其他类型的网络流量和端口信息。`arp` 实用程序用于向地址解析协议 (`ARP`）缓存添加地址；它无法显示路由表。`ifconfig`\
  \ 命令在 Unix 和 Linux 系统上显示传输控制协议/网协议 (`TCP/IP`）配置信息；它无法显示路由表。Telnet 是一个终端仿真程序；它无法显示路由表。\n\
  \n## 91\nC. 使用带有 `-l` 参数运行 `ping` 可以让你指定发送到目标的消息的大小——在这种情况下为 2028 字节。`-n` 参数允许你指定\
  \ `ping` 工具应该传输的消息数——在这种情况下为 11 个。结合这两个参数将生成图中所示输出。`-t` 参数导致 `ping` 工具持续传输消息直到手动停止。\n\
  \n## 92\nC. `arp -a` 命令显示存储在缓存中的 `ARP` 表条目。`arp -d` 命令用于删除条目，`arp -s` 命令用于添加条目。`arp\
  \ -c` 命令不是一个有效选项。\n\n## 93\nB. `nslookup` 工具允许你从命令行生成 DNS 请求消息并将其发送到特定的 DNS 服务器。列出的其他选项均不是\
  \ DNS 实用程序。\n\n## 94\nA. 在 Unix 或 Linux 主机上，`ifconfig` 命令显示系统当前的 IP 配置设置。\n\n##\
