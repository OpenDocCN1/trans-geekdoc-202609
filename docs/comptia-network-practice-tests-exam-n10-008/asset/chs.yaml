  \ `SMB`。`HTTP` 是 Web 客户端使用的原生协议。`NFS` 是 Unix 上使用的文件共享协议。\n\n209. B. `datagram`（数据报）通常用于提供无连接交付服务的协议。`TCP/IP`\
  \ 家族中的两个主要无连接协议是`网协议 (IP)` 和 `用户数据报协议 (UDP)`，两者都使用 `datagram` 术语。`以太网 (Ethernet)`\
  \ 使用术语 `frame`，而 `传输控制协议 (TCP)` 使用 `segment`。\n\n210. D. 所有 Windows 操作系统使用的默认文件共享协议是\
  \ `SMB`。`HTTP` 是 Web 客户端使用的原生协议。`NFS` 是 Unix 上使用的文件共享协议。 \n\n211. B. `datagram`（数据报）通常用于提供无连接交付服务的协议。`TCP/IP`\
  \ 家族中的两个主要无连接协议是`网协议 (IP)` 和 `用户数据报协议 (UDP)`，两者都使用 `datagram` 术语。`以太网 (Ethernet)`\
  \ 使用术语 `frame`，而 `传输控制协议 (TCP)` 使用 `segment`。\n\n212. D. 所有 Windows 操作系统使用的默认文件共享协议是\
  \ `SMB`。`HTTP` 是 Web 客户端使用的原生协议。`NFS` 是 Unix 上使用的文件共享协议。\n\n213. B. `datagram`（数据报）通常用于提供无连接交付服务的协议。`TCP/IP`\
  \ 家族中的两个主要无连接协议是`网协议 (IP)` 和 `用户数据报协议 (UDP)`，两者都使用 `datagram` 术语。`以太网 (Ethernet)`\
  \ 使用术语 `frame`，而 `传输控制协议 (TCP)` 使用 `segment`。\n\n\n\n\n\n## 222. A.\nFTP 提供身份验证功能，但它在网络上以明文形式传输密码，这是一种不可接受的安全状况。`FTPS`\
  \ 通过传输层安全（`TLS`）和安全套接层（`SSL`）协议增加了安全性。`SFTP` 增加了安全外壳（`SSH`）安全性。两者在传输之前都会对身份验证密码进行加密。简单文件传输协议（`TFTP`）不验证客户端，因此它完全不传输密码。\n\
  \n## 223. D. 简单文件传输协议（`TFTP`）是 `FTP` 的简化版本，不验证客户端，因此使用 `PXE` 启动的系统在被动态主机配置协议（`DHCP`）引导至\
  \ `TFTP` 服务器后，可以无形地下载启动镜像。`FTP`、`FTPS` 和 `SFTP` 都需要验证和其他交互，这对于 `PXE` 使用来说是不行的。\n\
  \n## 224. C. 认证头（`AH`）是 `TCP/IP` 件中的一种协议，它以数字签名的形式提供数字完整性服务，确保传入的数据包确实源于声明的源。封装安全协议（`ESP`）为\
  \ `IPsec` 提供加密服务。安全套接层（`SSL`）是一种在 Web 浏览器和服务器之间提供加密通信的安全协议。`MSCHAP` 是用于远程访问服务的身份验证协议。\n\
  \n## 225. A. 安全套接层（`SSL`）是 Web 服务器和浏览器的原始安全协议，是传输层安全（`TLS`）的前身。数据报传输层安全（`DTLS`）是一种提供与\
  \ `TLS` 相同加密及其他 Web 服务器/浏览器安全功能的协议，但它是针对用户数据报协议（`UDP`）流量的。安全外壳（`SSH`）是一种基于字符的工具，允许用户在远程计算机上执行命令。它不提供\
  \ Web 服务器或浏览器的安全性。\n\n## 226. B. 安全套接层（`SSL`）是 Web 服务器和浏览器的原始安全协议，是 `TLS` 的前身。它在\
  \ 2015 年被弃用。安全外壳（`SSH`）是一种基于字符的工具，允许用户在远程计算机上执行命令。它不提供像 `TLS` 和 `DTLS` 那样的 Web 服务器或浏览器安全性。`IPsec`\
  \ 是一组为网络传输提供数字签名、加密和其他服务的安全协议。它并非专门为 Web 安全设计。远程桌面协议（`RDP`）是远程桌面服务的组件，是一种 Windows\
  \ 机制，允许客户端程序连接到服务器并对其进行远程控制。`RDP` 不是 Web 安全协议。\n\n## 227. B, D. 当客户端向其 `DNS` 服务器发送名称解析查询时，它使用递归请求，以便服务器将承担解析名称的责任。递归请求的唯一其他用途是在转发器情况下，转发器被配置为将该责任交给另一个服务器。客户端服务器向各个域权威发出的所有其他查询都是迭代查询。\n\
  \n## 228. A. 大多数无线路由器设计用于为连接的工作站提供 IP 地址和其他 `TCP/IP` 配置参数。交换机和网接器是数据链路层设备，集线器是物理层设备，它们都无力为客户端提供网络层\
  \ IP 地址。\n\n## 229. A, E. `DHCP` 和 `BOOTP` 都设计为主机分配 IP 地址。两者之间的主要区别是 `DHCP` 能够动态分配，而\
  \ `BOOTP` 不行。`DNS` 将主机名解析为 IP 地址，`ARP` 将 IP 地址解析为数据链路硬件（或 `MAC`）地址。`FTP` 设计用于系统之间传输文件，在\
  \ IP 地址分配方面没有作用。\n\n## 230. D. 与 `A` 和 `AAAA` 记录一样，指针记录（`PTRs`）包含主机名和 IP 地址，但它们被用于反向名称解析——即将\
  \ IP 地址解析为主机名。邮件交换记录（`MX`）指定域名应使用的邮件服务器。`AAAA` 记录用于解析目的是将主机名映射到 IPv6 地址。\n\n## 231.\
  \ A. 动态主机配置协议（`DHCP`）可以为客户端分配 IP 地址，并在租约过期时收回。启动协议（`BOOTP`）和反向解析协议（`ARP`）可以自动或手动分配地址，但它们不支持代理服务器。\n\
  \n## 232. A, B, D, E. 在成功的 DHCP 分配中，客户端发送 `DHCPDISCOVER` 广播包来寻找服务器，服务器回复包含地址的 `DHCPOFFER`。然后客户端发送\
  \ `DHCPREQUEST` 消息接受建议的地址，服务器回复 `DHCPACK`。`DHCPNAK` 仅用于失败的事务，`DHCPRENEW`、`DHCPRELEASE`\
  \ 和 `DHCPINFORM` 消息在分配过程中未使用。\n\n## 233. D, E. 在成功的 DHCP 刷新事务中，客户端发送 `DHCPREQUEST`\
  \ 消息，服务器回复 `DHCPACK`。`DHCPNAK` 仅用于失败的事务，其他类型的消息在刷新过程中未使用。\n\n## 234. A. 反向解析协议（`RARP`）、启动协议（`BOOTP`）和动态主机配置协议（`DHCP`）都是设计用于为客户端分配\
  \ IP 地址的协议。而解析协议（`ARP`）则将现有 IP 地址解析为数据链路 `MAC` 地址。\n\n## 235. A. 当 `DNS` 服务器接收到迭代查询时，它立即响应可用信息或错误消息。它不会向其他服务器发送查询。\n\
  \n## 236. D. 域名系统（`DNS`）的客户端部分称为解析器。请求者是任何发布请求系统的通用术语，只有 `DNS` 服务器可以是权威服务器或转发器。\n\
  \n## 237. C. DNS 服务器地址包含解析域名到 IP 地址的服务器地址。Windows 命名服务（`WINS`）提供网络基本输入输出系统（`NetBIOS`）名称解析。默认网关参数定义了访问其他网络的本地路由器。不存在子网网关参数。\n\
  \n## 238. C. Stable 不是一种 DHCP 分配方法。`DHCP` 支持三种分配方法：手动、动态和自动。\n\n## 239. B. 在 DHCP\
  \ 服务器上，你创建一个由起始 IP 和结束 IP 地址组成的范围。范围、池和子网不是 DHCP 的技术术语。\n\n\n\n\n\n## 242. B. 规范名称\
  \ (`CNAME`) 资源记录为已在 DNS 中注册的系统指定备用主机名（或别名）。通过创建一个指定 `www` 名称的 `CNAME` 记录，可以使用 `NE6`\
  \ 或 `www` 来访问服务器。创建一个额外的 `A` 资源记录将导致服务器通过其中一个名称被识别，但不是两者都行。修改现有的 `A` 记录将更改主机名。`PTR`\
  \ 资源记录仅用于反向域名解析。\n\n## 243. A. `Router` 选项指定本地网络路由器的地址，包括默认网关路由器。`Time Server` 选项指定为网络提供时间信号的服务器地址。`Name\
  \ Server` 选项指定网络上多多 10 个域名解析服务器（`DNS` 服务器之外）的地址。`LPR Server` 选项指定网络上行打印机服务器的地址。\n\
  \n## 244. B. `DHCP` 客户端使用广播在本地网络上传输 `DHCPDISCOVER` 消息。随后 `DHCP` 服务器需要响应这些广播。`DHCP`\
  \ 客户端无法使用 `unicast`、`multicast` 或 `anycast` 消息与 `DHCP` 服务器建立联系，因为它们没有办法获取这些地址。\n\
  \n## 245. A. `Name Server` (`NS`) 资源记录识别特定 `DNS` 区域的权威域名服务器。`Pointer Records` (`PTRs`)\
  \ 用于将 IP 地址解析为主机名。`Mail Exchange` (`MX`) 记录识别特定域的邮件服务器。`Service Records` (`SRVs`)\
  \ 识别特定应用程序的指定服务器。`Start of Authority` (`SOA`) 记录表示域管理权限从其父域的委托。`Text` (`TXT`) 记录将管理员提供的文本与区域关联，但不执行任何其他功能。\n\
  \n## 246. C. 在 `DHCP` 服务器上，`reservation`（保留）是对特定 `MAC` 地址的永久 IP 地址分配。`scope`（范围）是分配给客户端的\
  \ IP 地址范围。`exclusion`（排除）是要从 `scope` 中排除的 IP 地址范围。`relay`（中继）是在在网络之间路由 `DHCP` 流量的组件。\n\
  \n## 247. B. 动态分配允许 `Dynamic Host Configuration Protocol` (`DHCP`) 服务器为特定时间间隔向客户端租用\
  \ IP 地址。当租期过期时，如果客户端仍在使用该地址，它可以更新租期。如果租期过期时地址不再被使用，它将返回可用租约范围 `scope` 以重新分配。自动分配从\
  \ `scope` 中为客户端永久分配 IP 地址。`Manual`（手动）和 `static`（静态）分配是描述向特定客户端分配特定 IP 地址的两个术。\n\
  \n## 248. B. `Dynamic DNS` (`DDNS`) 是 `DNS` 标准的扩展，消除了管理员手动创建某些 `DNS` 资源记录的需求。例如，当\
  \ `DHCP` 服务器为客户端分配地址时，`DDNS` 会创建一个包含客户端主机名和新分配 IP 地址的主机（`A`）记录。反向域名解析是根据 IP 地址查找主机名的过程。自动分配是一种\
  \ `DHCP` 过程，通过该过程将 IP 地址永久分配给客户端。`HOSTS` 是一种早于 `DNS` 的文本名称解析方法。\n\n## 249. C. `IP\
  \ address management` (`IPAM`) 是一种用于规划、管理和监控整个企业网络 IP 地址空间的系统。`IPAM` 提供了 `Dynamic\
  \ Host Configuration Protocol` (`DHCP`) 与 `Domain Name System` (`DNS`) 之间的链接，使每者都能感知命名和地址的变化。\n\
  \n## 250. D. `stratum`（层）加上一个整数描述了 `NTP` 离其源的距离。`stratum 0` 是原子钟。`stratum 1` 是同步到时间设备的服务器。`stratum\
  \ 2` 是服务器，依此类推。`Layer`、`path` 和 `iteration` 不是技术术语。\n\n## 251. B. `IP Time-to-Live`\
  \ (`TTL`) 选项指定了 IP 数据报在路由器删除它之前允许的最大秒数或跳数。`Interface Maximum Transmission Unit`\
  \ (`MTU`) 选项指定了 IP 数据报的最大尺寸。`Address Resolution Protocol` (`ARP`) 缓存超时指定包含服务器分配的\
  \ IP 地址的条目可以在缓存中保留多久。`Transmission Control Protocol` (`TCP`) 保留间隔选项指定了客户端在通过 `TCP`\
  \ 连接发送心跳消息之前应等待的秒数。\n\n## 252. D. `DNS` 层次结构中的顶层由 `org` 表示，`mydomain` 是二级域，`paris`\
  \ 是子域，而 `www` 是 `paris.mydomain` 中特定主机的名称。\n\n## 253. B, C. 外部 `DNS` 服务器应包含必须从互联网访问的资源记录，例如\
  \ Web 服务器和公共邮件服务器。出于安全考虑，包含敏感数据的服务器（如数据库服务器和域控制器）应注册在内部 `DNS` 服务器上。\n\n\n\n\n\n\
  ## 258. D\n区域传输（Zone transfer）是两个 `DNS` 服务器之间的一种客户端/服务器事务，其中一个服务器请求另一个服务器整个区域数据库的副本，以更新其自身的数据库。其他选项均未用于\
  \ DNS 数据库复制。多主复制（Multi-master replication）是一种允许两个系统根据需要交换数据库信息以进行相互更新的技术。`UDP` 转发是\
  \ `DHCP` 使用的一种路由器机制，用于将一个子网上的广播消息转发到另一个子网上的特定 IP 地址。迭代查询（Iterative query）是一种 `DNS`\
  \ 消息的类型，它将名称查找的责任交给另一个服务器。\n\n## 259. A, C\n`iSCSI` 运行在标准 IP 网络上，而`以太网传输的纤通道 (FCoE)`\
  \ 运行在标准以太网网络上。这两种协议都可以与 `LAN` 流量共享网络，尽管通常建议使用服务质量（QoS）机制。`Fibre Channel`（纤通道）和 `InfiniBand`都需要不支持\
  \ `LAN` 流量的专用网络介质。\n\n## 260. C\n`IP 语音 (VoIP)` 是一种通过 IP 网络传输语音通信的技术；它不是 SAN 协议。`互联网小型计算机系统接口\
  \ (iSCSI)`、`以太网传输的纤通道 (FCoE)` 和 `Fibre Channel` 都是 SAN 协议。\n\n## 261. E\n`互联网存储命名服务\
  \ (iSNS)` 是一个应用程序，为 `iSCSI` 启动器提供对网络上所在目标的自动发现。`iSNS` 还可以作为 `Fibre Channel` 设备的发现服务。`活动目录\
  \ (Active Directory)`、`互联网控制消息协议 (ICMP)` 和 `域名系统 (DNS)` 无法注册 `iSCSI` 目标。`iWINS`\
  \ 不存在。\n\n## 262. D\n`Fibre Channel` 标准要求的最高数据传输速率为每秒 128 千比特 (Gbps)，名义吞吐量为每秒 12,800\
  \ 兆字节 (MBps)。\n\n## 263. B\n`NAS` 设备本质上是一个连接到网络并为用户提供共享文件文件的服务器。`NAS` 是一台计算机，因此它不能与故障转移集群相关联。`一堆磁盘\
  \ (JBOD)` 是一种提供块级数据访问的简单存储阵列，而 `NAS` 设备提供文件级访问。`独立磁盘冗余阵列 (RAID)` 是一种可能在 `NAS` 设备中实现的容错技术，但它不是该设备的主要功能。\n\
  \n## 264. A, D\n`NAS` 设备是直接连接到标准 IP 网络的自包含文件服务器。`NAS` 设备为其其存储设备提供文件级访问，并包含操作系统和文件系统。`NAS`\
  \ 设备通常不是 `iSCSI` 目标。\n\n## 265. A, B, D\n由于使用了标准的以太网硬件，`以太网传输的纤通道 (FCoE)` 的实现成本比\
  \ `Fibre Channel` 便宜得多，后者需要专用的光纤网络。由于 `Fibre Channel` 需要专用网络，它无法与标准 IP 流量共存，而 `FCoE`\
  \ 可以。由于 `FCoE` 被封装在以太网帧中，因此它在 IP 网络上是不可路由的。\n\n## 266. A, B, D\n`通用互联网文件系统 (CIFS)`、`网络文件系统\
  \ (NFS)` 和`超文本传输协议 (HTTP)` 都是许多 `NAS` 设备支持的文件共享协议。`远程直接内存访问 (RDMA)` 提供高速网络数据传输，但它不是应用层文件共享协议。\n\
  \n## 267. C\n`iSCSI` 不包含自己的流量控制机制。它运行在 `TCP` 连接之上，`TCP` 是负责流量控制的协议。因为它运行在任何 IP 网络上，`iSCSI`\
  \ 流量是路由的，且实现成本较低。`Fibre Channel` 需要使用光纤电缆的专用网络。`iSCSI` 流量可以在单个网络上与标准 `LAN` 流量共存，尽管经常建议某种类型的服务质量（QoS）机制。\n\
  \n## 268. A\n`InfiniBand` 是一种高端存储基础设施技术，提供高达 2.5 Gbps 的数据传输速率，并支持多达 64,000 个设备的可扩展。它主要用于高性能计算环境，以取代连接\
  \ CPU 和存储阵列的旧总线技术。`Fibre Channel`、`互联网小型计算机系统接口 (iSCSI)` 和`以太网传输的纤通道 (FCoE)` 都是\
  \ SAN 技术，但它们更常用于本地局域网 (LAN) 环境。\n\n## 269. A\n`iSCSI` 实现的客户端被称为 `启动器 (initiator)`。启动器连接的存储设备被称为\
  \ `目标 (target)`。`控制器 (Controller)` 和 `适配器 (adapter)` 不是用于 `iSCSI` 客户端或服务器的术语。\n\n\
  ## 270. A, B, C\n`iSCSI` 运行在标准 IP 网络上；因此，`iSCSI` 消息在传输层使用`传输控制协议 (TCP)`，网络层使用`网协议\
  \ (IP)`，数据链路层使用以太网。`iSCSI` 不使用`用户数据协议 (UDP)`。\n\n## 271. E\n`Fibre Channel` 标准定义了一个独特的五层协议栈，它与\
  \ OSI 模型层不对应。因此，`Fibre Channel` 不使用以太网，也不使用任何其他的 TCP/IP 协议。\n\n## 272. B\n`Fibre\
  \ Channel` 标准定义了一个从 `FC-0` 到 `FC-4` 的五层网络栈，不对应 OSI 模型层。`互联网小型计算机系统接口 (iSCSI)`、`点点协议\
  \ (PPP)` 和`远程直接内存访问 (RDMA)` 都在标准层内运行。\n\n## 273. A\n`以太网传输的纤通道 (FCoE)` 使用以太网帧代替纤通道栈的底层层（`FC0`\
  \ 和 `FC1`）。其余层（`FC2`、`FC3` 和 `FC4`）使用纤通道协议。`FCoE` 不使用`传输控制协议 (TCP)`、`IP (IP)`、`用户数据协议\
  \ (UDP)` 或任何其他 TCP/IP 协议。\n\n## 274. A\n`以太网` 使用巨帧更有效地传输大量数据。在分组交换网络中，每个数据包都需要头部数据，这增加了开销。将大文件分成许多小数据包会导致开销影响网络效率。`以太网`\
  \ 通常限制帧大小为 1500 字节，但巨帧使 `以太网` 系统能够创建高达 9000 字节的帧。帧是数据链路层的协议单元，因此工作在网络层的`IP 协议 (IP)`\
  \ 不参与创建帧。`Fibre Channel` 和 `iSCSI` 是不使用巨帧的专用存储网络协议。\n\n## 275. B\n数据中心的三层层次架构由核心层、分布层和接入层组成。数据中心的接入层包含服务器，分布层包含冗余交换连接，核心层提供交换机之间高速传输。该架构没有中间层。\n\
  \n## 276. C\n叶节点-脊干拓扑在其两层交换机中使用了全网状拓扑。这比三层拓扑昂贵，但它通过确保任何两个路由器之间的路径跳数相同，降低了延迟。软件定义网络的使用提供了自适应路径确定，而无需使用生成树协议\
  \ (STP) 来进行二层端口阻塞。\n\n## 277. C\n东西向流量描述数据中心内部的流量，而南北向流量是指数据中心内部设备与外部设备之间的流量。*东西向*和*南北向*这些术语与\
  \ OSI 模型层或特定设备无关。\n\n## 278. A\n在典型的数据中心拓扑中，机架包含实现应用程序的服务器。机架顶部的叶交换机连接机架内的服务器，并连接到连接数据中心其余部分的脊干交换机。机架顶交换机不归类为骨干网、脊干或核心设备。\n\
  \n\n\n\n\n# SDN 架构与平面\n\n279. 在 SDN 架构中，应用层是软件，即运行在网络上的应用程序和服务；控制层是一个中心化控制台，管理员通过该控制台管理应用程序；基础设施层则由交换机和路由器硬件组成。`Core`并不是\
  \ SDN 的层级之一。\n\n280. `RFC 7426` 文档定义了 SDN 架构中的五个平面：转发面、操作面、控制面、管理面和应用面。`Infrastructure`并不是\
  \ SDN 的平面之一。\n\n# 数据中心模型\n\n281. 在托管数据中心中，客户在共享的第三方设施中存放其自己的服务器和其他硬件。因此，Ralph 的公司将拥有分支机构或托管数据中心中的硬件。公云中的数据中心比其他选项更容易扩展，因为这仅仅是创建额外的虚拟设备的问题。与分支机构数据中心相比，托管数据中心的实施成本更低，但公云选项所需的初始支出最少。管理员将设置并管理分支机构或托管数据中心中的硬件，而不会在公云数据中心中进行这些操作。在托管数据中心中，Ralph\
  \ 的公司将与其他租户分担公用事业。公云设施并不一定更安全。\n\n# 云服务模型（IaaS, PaaS, SaaS, DaaS）\n\n282. 基础设施即服务\
  \ (`IaaS`) 模型为消费者提供处理、存储和网络资源，他们可以使用这些资源来安装和运行操作系统或其他所需的软件。平台即服务 (`PaaS`）为消费者提供了在提供者安装的服务器上安装其所需应用程序的能力。软件即服务\
  \ (`SaaS`）为消费者提供了访问运行在提供者服务器上的特定应用程序的能力。桌面即服务 (`DaaS`）提供整个工作站桌面的远程虚拟化，而不是单个应用程序。\n\
  \n283. 软件即服务 (`SaaS`) 模型为消费者提供了访问运行在提供者服务器上的特定应用程序的能力。基础设施即服务 (`IaaS`) 为消费者提供处理、存储和网络资源，他们可以使用这些资源来安装和运行操作系统或其他所需的软件。平台即服务\
  \ (`PaaS`）为消费者提供了在提供者安装的服务器上安装其所需应用程序的能力。桌面即服务 (`DaaS`) 提供整个工作站桌面的远程虚拟化，而不是单个应用程序。\n\
  \n284. 基础设施即服务 (`IaaS`) 模型为消费者提供了最大的控制权，因为提供者提供了消费者可以按需使用的处理、存储和网络资源。平台即服务 (`PaaS`）为消费者提供了在提供者提供的服务器上安装其所需应用程序的能力，但他们对服务器只有有限的控制权，且对底层资源没有控制权。软件即服务\
  \ (`SaaS`) 和桌面即服务 (`DaaS`）为消费者提供了访问运行在提供者服务器上的特定应用程序或整个桌面环境的能力，但消费者对操作系统、服务器或底层资源没有控制权。\n\
  \n285. 基础设施即服务 (`IaaS`) 为像 Alice 这样的消费者提供了处理、存储和网络资源，他们可以使用这些资源来安装和运行操作系统或其他所需的软件。在公云模型中，一个组织或用户充当提供者，另一个组织或用户（在此例中为\
  \ Alice）消费提供者的服务。\n\n平台即服务 (`PaaS`）为消费者提供了在提供者提供的服务器上安装其所需应用程序的能力。软件即服务 (`SaaS`）为消费者提供了访问运行在提供者服务器上的特定应用程序的能力。在私有云中，利用云服务的同一组织也是提供这些服务的设施的唯一所有。混合云是公有和私有基础设施的结合，使得消费者组织仅是该基础设施的部分所有者。社区云是专为特定业务社区（如医疗或法律领域）设计的私有云变体。\n\
  \n286. 在私有云中，利用云服务的同一组织也可以是提供服务的设施的唯一所有。私有云也可以由第三方全部或部分拥有。在公云模型中，一个组织充当提供者，另一个组织消费提供者的服务。混合云是公有和私有基础设施的结合，使得消费者组织仅是该基础设施的部分所有者。不存在所谓的临时云模型（ad\
  \ hoc cloud model）。\n\n287. `云爆发`（Cloud bursting）是一个常用术语，指在需要维持满意的性能水平时，将过度流量从私有云卸载到公云资源。\n\
  \n288. 软件即服务 (`SaaS`）为消费者提供了访问运行在提供者服务器上的特定应用程序的能力（在此例中为电子邮件服务）。消费者对某些电子邮件功能具有控制权，但他们对操作系统、服务器或底层资源没有控制权。基础设施即服务\
  \ (`IaaS`) 模型为消费者提供了可以按需使用的处理、存储和网络资源。平台即服务 (`PaaS`）为消费者提供了在提供者提供的服务器上安装其所需应用程序的能力。桌面即服务\
  \ (`DaaS`）提供整个工作站桌面的远程虚拟化，而不是单个应用程序。\n\n289. 混合云由公有和私有资源组成。其主要优势之一是管理员可以根据当前负载，根据需要将服务从私有云移动到公云服务器，反之亦然。公云资源需要身份验证，虽然它们可能比私有云安全性低，但它们本质上并不是不安全的。`private\
  \ cloud`一词指的是由单一组织或第三方拥有并的硬件资源，无论其位置如何。各种云交付模型没有特定的硬件资源要求。\n\n# 多租户性\n\n290. 平台即服务\
  \ (`PaaS`) 模型为消费者提供了在提供者提供的服务器上安装其所需应用程序的能力。基础设施即服务 (`IaaS`) 为消费者提供处理、存储和网络资源，他们可以使用这些资源来安装和运行操作系统或其他所需的软件。软件即服务\
  \ (`SaaS`) 为消费者提供了访问运行在提供者服务器上的特定应用程序的能力。桌面即服务 (`DaaS`）提供整个工作站桌面的远程虚拟化，而不是单个应用程序。\n\
  \n291. 多租户性是一种软件架构，多个租户共享运行在云端的单个应用程序实例。由于租户共享同一个应用程序，存在数据被泄露的风险。由于云端运行的是单个应用程序实例，与使用独立的虚拟机相比，运营开销有所降低。租户共享有限的带宽，因此可能出现竞争的情况，例如当一个租户成为拒绝服务（DoS）攻击的目标时。多租户性并不要求租户拥有独立的虚拟机。\n\
  \n\n\n\n\n## 292. D. 代码即基础设施 (IaC) 是一种使用脚本文件部署和配置云资源的方法。IaC 部署通过自动化虚拟机部署过程节省了时间并成本，并提高了弹性和可扩展性，同时通过对所有新部署的虚拟机使用相同的脚本确保了部署的一致性。IaC\
  \ 不对虚拟机的配置进行加密。\n\n## 293. C. 云直连是客户端私有网络与云服务提供商之间的专用链路。该链路独立于客户组织为其他流量使用的任何 ISP\
  \ 连接，因此它确保了混合云网络的稳定带宽。使用不同的 ISP 或租用线路并不能取代整个连接；仍然存在潜在的瓶颈。`VPN` 可以提供比标准连接更好的性能和更高的安全性，但其稳定性（或成本）并不如云直连那样有优势。\n\
  \n# 第 2 章：网络实现\n\n### 1. D. 射频识别 (RFID) 使用包含数据的标签，这些标签通常嵌入在宠物身上，并可以使用电磁场进行读取。`Z-wave`\
  \ 是一种短距离无线技术，常用于家庭自动化。`Bluetooth` 是一种短距离无线协议，常用于计算机外设和个人区域网 (PAN)。近场通信 (`NFC`) 在\
  \ `4 cm` 或更短的范围内提供无线通信，通常用于支付系统。\n\n### 2. A. 用于解锁汽车的钥匙通常是一种短距离无线或红外设备，其通信不使用互联网。其他示例中的每个例子都描述了一个具有\
  \ `IP` 地址并使用互联网与控制器或监控站通信的设备。\n\n### 3. D. `WAP` 是一个带有无线收发器的设备，它同时也连接到标准有线网络。无线计算机与\
  \ `WAP` 通信，由 `WAP` 通过网络线转发其传输。这被称为基础设施拓扑。星型或总线型网络要求计算机物理上连接到网络电缆，而自形成拓扑是指无线计算机之间直接通信的拓扑。\n\
  \n### 4. C. 最佳选择是将集线器替换为交换机，因为网络较小且成本是一个问题。在现有网络中，所有用户共享同一个 `100 Mbps` 通信通道，每台计算机必须轮流传输。通过将集线器替换为交换机，你为每台计算机提供了连接到交换机的专用\
  \ `100 Mbps` 连接，同时减少了网络上不必要的流量和冲突。不存在所谓的专用集线器。将网络划分为两个路由 `LAN` 并不是最佳解决方案，因为所有用户必须不断地共享信息。此外，成本也是一个因素，路由器比交换机贵得多。将集线器替换为三层交换机并定义两个各有\
  \ 20 个用户的 `VLAN` 不是一个合理的解决方案，因为三层交换机非常昂贵。\n\n### 5. B. 桥器可以将单个网络划分为两个冲突域，因为它只转发目标是桥器另一侧的数据包。桥器转发所有广播包，因此它维护一个单一广播域。集线器维护单一冲突域和单一广播域。交换机为每个端口创建一个独立的冲突域，并为整个网络创建一个单一广播域。路由器创建两个冲突域，但它不转发广播，因此两个广播域。中继器是一种放大信号的物理层设备；它不影响冲突域。\n\
  \n### 6. C, E. 宽带路由器通常不作为代理服务器运行，代理服务器是用于管理互联网访问的应用层设备。它们通常也不是虚拟私有网络 (`VPN`) 网关，允许多个远程\
  \ `VPN` 客户端连接到网络。许多宽带路由器也是 `WAPs`，允许用户在无需复杂且昂贵的布线的情况下构建 `LAN`。许多宽带路由器具有连接有线设备（如打印机和计算机）的交换端口。大多数宽带路由器使用\
  \ `DHCP` 为私有网络上的设备分配 `IP` 地址。\n\n### 7. B, C. 中继器是放大输入信号并再次传输它们的物理层设备。集线器是物理层设备，将输入信号传播到所有端口。交换机和路由器具有物理层元素，但它们分别是数据链路层和网络层设备。\n\
  \n### 8. C. 调制解调器 (modem) 是任何将模拟信号转换为数字信号、并将数字信号转换回模拟信号的设备。数字设备不必是计算机，模拟设备不必是 `PSTN`。许多设备被错误地称为调制解调器，例如连接数字\
  \ `LAN` 和数字 `WAN` 的设备，或连接计算机到互联网的全数字设备。\n\n### 9. C. 将路由器替换为交换机会将互联网络转换为单一大型子网，`VLANs`\
  \ 作为逻辑元素存在于交换结构之上。虽然 `VLANs` 在功能上等同于网络层子网，但单一 `VLAN` 中的系统仍然通过交换机连接，而不是路由器。桥器在数据链路层连接网络段，并选择性地在段之间转发流量。然而，桥器不像交换机那样在两个系统之间提供专用连接，它们无法将大型路由互联网络转换为单一交换网络。因此，它们在实现\
  \ `VLANs` 方面没有作用。集线器是物理层设备，将所有输入流量传播到其所有端口。将互联网络上的路由器替换为集线器将创建一个具有巨大流量和冲突的单一共享网络。因此，集线器不连接\
  \ `VLAN` 中的计算机。\n\n### 10. A. 防火墙是一种过滤器，可以防止来自一个网络的危险流量通过另一个网络。连接两个网络并在它们之间转发流量的设备是路由器，而不是防火墙。允许具有私有\
  \ `IP` 地址的互联网客户端访问互联网的设备是 `NAT` 路由器或代理服务器的描述，而不是防火墙。缓存互联网数据的设备是代理服务器或缓存引擎，而不是防火墙。\n\
  \n### 11. B. 依赖服务的过滤根据传输层头部中指定的端口号拦截流量。因为端口号代表特定的应用程序，你可以使用它们阻止这些应用程序生成的流量到达网络。`IP`\
  \ 地址过滤工作在网络层。`DPI` 扫描数据包内容而非报头。`NGFW` 定义了一种具有高级保护能力的设备；端口扫描是防火墙的基本功能。\n\n### 12.\
  \ A. 中继器是再生输入信号并重新传输它们的物理层设备。集线器是中继器的一种，通过其多个端口中的一个接收数据，并重新传输到所有其他端口。桥器和交换机是数据链路层设备，路由器是网络层设备。这三者中没有一个被描述为多端口中继器。\n\
  \n### 13. C. 源路由桥接是在令牌环（而非以太网）网络中使用的一种技术，数据包头部中的路由信息字段 (`RIF`) 识别了数据包到达目标应经过的网络段。存储转发式、透明桥器和多端口桥器均已用于以太网网络。\n\
  \n\n\n\n\n### 14. C, D.\n大多数操作系统都能够作为路由器或防火墙运行。为了路由流量，系统必须具有两个网络连接。软件防火墙可以是计算机路由功能的一部分，也可以是仅保护本地系统的独立防火墙。计算机不能作为`hubs`（集线器）或交换机工作，因为这需要多个端口，而标准网络适配器没有实现这些功能。\n\
  \n### 15. D.\n依赖于服务的过滤根据 `transport layer` 头部字段中指定的 `port numbers` 来阻塞流量。由于 `port\
  \ numbers` 代表特定的应用程序，你可以利用它们防止这些应用程序生成的流量到达网络。`IP address` 过滤允许你限制对特定计算机的访问访问；它不依赖于服务。基于\
  \ `hardware addresses` 的过滤提供了与 `IP address` 过滤相同的基本功能，但伪造 `hardware addresses` 比伪造\
  \ `IP address`es 更困难。通过 `protocol identifier` 过滤允许你阻塞所有使用 `TCP` 或 `UDP` 的流量；它不依赖于服务。\n\
  \n### 16. C.\n个人防火墙是保护个人计算机免受入侵入侵的一种廉价方法。安装硬件防火墙是一个复杂且昂贵的解决方案，不适用于小型网络。`IPS` 是一个相对昂贵的解决方案，适用于较大的网络。`IDS`\
  \ 也很贵，而且将其连接到 `switched port` 并不能让它保护网络上的其他计算机。`port scanner` 是按需执行扫描的设备。它不持续监控端口，对保护端口不起任何作用。\n\
  \n### 17. B, C.\n`Hubs` 运行在 `physical layer`，`switches` 运行在 `data link layer`。`Hubs`\
  \ 和 `switches` 都为所有连接的设备创建一个单一的 `broadcast domain`。`Switches` 为每个连接的设备创建一个独立的 `collision\
  \ domain`，而 `hubs` 创建单一的 `collision domain`。具有 `network layer`（`layer 3`）功能的 `switches`（但没有\
  \ `hubs`）。\n\n### 18. A, C.\n`STP` 禁用 `switches` 之间的冗余链路，这些会导致数据包在网络中无限循环。这被称为 `bridging\
  \ loop`。由于 `bridging loop` 的产生，网络可能会被 `broadcast traffic` 淹没，这被称为 `broadcast storm`。`STP`\
  \ 无法防止后期冲突（这是一种 `Ethernet` 定时问题）或 `crosstalk`（干扰，这是一种布线故障）。\n\n### 19. B, C.\n`switch`\
  \ 本质上是一个 `multiport bridge`。`switches` 和 `bridges` 都通过扫描其 `data link layer hardware\
  \ addresses` 来处理传入的数据包，并将数据包转发到连接到目标系统的端口。它们之间的主要区别是，`switches` 具有许多端口，而 `bridges`\
  \ 只有两个端口。`Hubs` 和 `routers` 分别是 `physical layer` 和 `network layer` 设备，执行着不同的功能。\n\
  \n### 20. B.\n如 `SCADA` 等分布式控制系统的五个功能级是 `field level`、`direct control`、`plant supervisory`、`production\
  \ control` 和 `production scheduling`。远程访问不是这些级别之一。\n\n### 21. A. \n`Cut-through\
  \ switches` 很快，因为它们在转发帧时只查看前六个字节（目标 `Media Access Control`，或 `MAC` 地址）。它们在将帧转发到通往目的地的端口之前不会对整个帧的内容执行\
  \ `cyclical redundancy check`（`CRC`）。`Source route` 是一种桥接技术，由源主机（而不是 `switch`）决定帧通过网络到达目的地的路径。`Store-and-forward\
  \ switches` 接收整个帧，并在转发之前通过执行 `CRC` 计算来验证其内容。没有名为 `destination switch` 的交换机。\n\n\
  ### 22. B.\n`Switches` 使用 `Media Access Control`（`MAC`）地址来识别与特定主机关联端口。`switch` 从每个传入的数据包中读取目标\
  \ `MAC address`，并通过与该地址关联端口将其转发。`Switches` 是 `data link layer` 设备，因此它们不使用 `IP addresses`\
  \ 或 `DNS names` 来转发数据包。`Maximum Transmission Unit`（`MTU`）值规定了 `data link layer frames`的最大大小；`switch`\
  \ 不使用它来转发数据包。\n\n### 23. D.\n`STP` 运行在 `OSI model` 的 `data link layer`，因此它与 `hardware\
  \ addresses` 工作，而不是 `IP addresses`。`switches` 使用 `STP` 来防止冗余链路导致网络上的流量循环。\n\n###\
  \ 24. E.\n`SOHO multifunction devices` 通常作为 `routers` 连接本地网络到 `Internet Service\
  \ Provider`（`ISP`）、`switches` 为主机设备提供有线连接、`Dynamic Host Configuration Protocol`（`DHCP`）服务器分配\
  \ `IP addresses`、`Domain Name System`（`DNS`）服务器将名称解析为 `IP addresses`、`Network Address\
  \ Translation`（`NAT`）路由器为主机提供访问私有 `IP addresses` 以及 `APs` 为无线设备提供网络访问。它们不作为 `hubs`\
  \ 工作。\n\n### 25. B.\n`STP` 向其数据库填充关于 `switch` 中每个端口信息、并将端口指定为转发或阻塞的过程被称为 `convergence`。`assimilation`、`tree-building`\
  \ 和 `listening` 不是 `STP` 评估的术语。\n\n### 26. A, B.\n`All switches` 运行在 `OSI model`\
  \ 的 `data link layer`，但 `multilayer switches` 通常作为 `routers` 工作，而它们是 `network layer`\
  \ 设备。它们通常不是 `transport layer` 或 `application layer` 设备。\n\n### 27. C.\n支持 `stateful\
  \ packet inspection` 的防火墙会检查其他 `network` 和 `transport layer header fields`，寻找指示破坏性行为的模式，例如\
  \ `IP spoofing`、`SYN floods` 和 `teardrop attacks`。`Port number filtering` 是最常用的包过滤形式；它与\
  \ `stateful packet inspection` 不同。基于 `IP addresses` 阻塞流量可以防止特定系统访问网络；`stateful packet\
  \ inspection` 是一个复杂得的操作。基于 `protocol identifiers` 的包过滤允许你阻塞 `TCP` 流量；这并不是 `stateful\
  \ packet inspection`。\n\n### 28. B.\n`Bridges` 是 `data link layer`（`layer 2`）设备。`Routing`\
  \ 是 `network layer`（`layer 3`）功能，因此它不是一种 `bridge`。`store-and-forward`（或简单的）`bridge`\
  \ 检查每个数据包并决定是否将其转发到连接的网络。`transparent bridge` 根据其处理过的数据包编译转发信息数据库。`multiport bridge`\
  \ 为多个网络提供连接；`switch` 是一种 `multiport bridge`。\n\n\n\n\n\n# 31. D. 简单的媒体转换器是一种物理层设备，它可以将不同类型的网络媒体连接在一起，只要它们具有相同的速率和双工设置。由于转换器仅仅是重新传输信号，因此维持了单一冲突域。`Bridges`和`switches`是数据链路层设备，会创建多个冲突域。`Routers`是网络层设备，它们会创建独立的冲突域和广播域。\n\
  \n# 32. B. `switch`是一种数据链路层设备，它本质上为连接到其任端口的每个设备执行`bridge`（桥器）的功能。因此，它可以被描述为多端口桥器。`Routers`、`hubs`和`gateways`分别工作在网络层、物理层和应用层，因此它们不能被描述为`bridges`。\n\
  \n# 33. D. `gateway`（网关）通过为设备执行翻译和转换服务，使不同协议的两个设备能够通信。`Routers`、`hubs`和`switches`在\
  \ OSI 模型的某些层都需要相同的协议。\n\n# 34. A. `router`上的每个端口都定义了一个独立的冲突域。`Hubs`将所有流量转发到所有连接节点，因此每个网络段都是单一冲突域。`Routers`不转发广播，因此每个网络段也是一个独立的广播域。\n\
  \n# 35. A, B, D. `Routers`是网络层设备，它们不转发广播消息，因此它们为每个网络创建了独立的广播域。`Switches`会转发广播，形成一个单一广播域。`Routers`和`switches`可以使用专用协议进行通信。作为数据链路层设备，`switches`只从数据包帧中读取硬件地址；`routers`根据数据包\
  \ IP 标头中的 IP 地址转发流量。\n\n# 36. A. 媒体转换器将允许 Ralph 在庭院两侧将多模光纤链路与 UTP（线缆连接起来，同时以最低成本维持单一网络。廉价的小微企业`hubs`和`switches`无法将不同的媒体连接在一起。`Routers`可以连接不同的媒体，但它们更昂贵，并且会将安装划分成三个独立的网络。\n\
  \n# 37. A. 如果第五台电脑与另外四台电脑处于不同的 VLAN，它将无法与它们通信。交换环会影响所有电脑之间的通信，而不仅仅是第五台。MTU 黑洞是一种由于中间存在防火墙的存在，导致系统无法完成路径\
  \ MTU 发现过程的状态。由于这五台电脑都在同一个局域网上，它们具有相同的 MTU，因此不需要路径 MTU 发现。虚拟路由器将允许位于不同子网的交换式电脑相互通信；它不会阻止它们进行通信。\n\
  \n# 38. A. 安全信息和事件管理（SIEM）系统可以作为 IDS 和其他安全过程收集的信息的中央清算中心。下一代防火墙（NGFW）、远程认证拨号用户服务（RADIUS）和\
  \ IP 电话（VoIP）都不是收集 IDS 信息的系统。\n\n# 39. A. `Hubs`是网络设备，它们简单地通过一个端口接收信号，对其进行电学增强，并通过另一个端口发送出去。`Routers`、`switches`和`bridges`能够读取并处理信号，这使得它们归类为智能设备。\n\
  \n# 40. A, B. 添加`router`会将以太网局域网分成两个局域网，创建两个独立的广播域。因此，每台电脑需要处理的广播消息数量减少。由于网络通过`router`进行了划分，每个子网上的单播流量也减少。\n\
  \n# 41. B. 标准集线器端口具有交叉电路，这确保了连接一端的发送信号到达另一端的接收引脚。`hub`中的上行端口跳过了了交叉电路，这样两个连接的`hubs`就不会产生相互抵消的交叉电路。使用标准电缆连接标准端口和上行端口之间会产生单个交叉，这是正确的接线方式。其他解决方案都会导致两个交叉或没有交叉，这些都是错误的。\n\
  \n# 42. D, E. 默认情况下，交换式局域网由单一广播域组成。要创建多个广播域，你可以安装`routers`将安装划分成两个或多个网络，因为`routers`不转发广播。另一种可能性是在`switches`中创建\
  \ VLAN。每个 VLAN 都是一个独立的广播域。所有其他选项对网络上广播域的数量都没有影响。\n\n# 43. B. `Bridges`和`switches`是数据链路层设备，根据帧中包含的目的\
  \ MAC 地址转发帧。它们以杂散模式工作，监听并处理每个段上的所有帧，并根据这些信息构建转发表。转发表是基于源 MAC 地址构建的。`Bridges`与协议无关；它们不涉及局域网上传载的高层协议。广播域由网络层设备定义，而不是由数据链路层设备。\n\
  \n# 44. C. `switch`最好被描述为多端口桥器，因为它读取输入数据包的硬件地址并将其通过目的节点的端口转发出去。虽然`switch`确实工作在 OSI\
  \ 模型的第二层（数据链路层），但它不是`router`，后者在第 3 层（网络层）连接网络。`Hubs`和中继器是物理层（第一层）设备，无法执行`switch`的功能。\n\
  \n# 45. E. 物联网（IoT）由通常是被动的设备组成，但通过配置它们参与 IP 网络，使其变得智能。列出的所有设备都可以作为“智能”设备，允许远程用户通过互联网与它们进行交互。\n\
  \n# 46. C. `switches`提高以太网局域网效率的主要原因是它们为每个交换端口创建了独立的冲突域，消除了大多数冲突。冲突导致数据包必须重传，因此冲突减少意味着重传减少，从而提高了性能。`switches`转发数据包的速度并不比`hubs`快。`switches`确实会转发广播。`switches`读取硬件地址而不是\
  \ IP 地址。\n\n# 47. D. 冲突域是一个共享网络介质，两个设备同时传输会产生信号质量错误，即冲突。通过`hubs`连接的以太网局域网创建一个共享介质，而交换网络为每个连接节点创建一个独立的冲突域。`Routers`创建独立的冲突域。能够接收广播的电脑组是广播域的定义，而不是冲突域。电缆过长会导致冲突，但不定义冲突域。\n\
  \n# 48. A, C. VoIP 使用*terminal*和*endpoint*来指用户通话的设备，包括电脑和电话。VoIP 网关是提供 IP 网络与公共电话网（PSTN）之间传输通道的设备。VoIP\
  \ 分支交换机（PBX）是一种在本地 IP 网络终端之间切换通话并提供外部线路访问的设备。\n\n# 49. A. `Hubs`是物理层设备，会将信号放大并重复到除接收数据的端口以外的所有端口，无论目的地如何。`Hubs`用于将终端系统物理连接到星型拓扑。`Hubs`通常提供内部交叉电路连接。上行端口用于扩展星型网络的距离，形成分级星型拓扑。\n\
  \n\n\n\n\n### 50. A, D, E.\n路由器是网络层设备，它们使用 `IP` 地址来转发帧，而不是 `MAC` 地址。路由器依赖于协议。它们必须支持被路由的网络层协议。作为一种网络层设备，路由器定义了网络（或\
  \ `LANs`），这些网络代表一个独立的广播域。路由器不构建自己的路由表，也不使用 `MAC` 地址转发帧。\n\n### 51. A, B.\n`100Base-TX`\
  \ 规范规定了两种集线器类型：`Class I` 和 `II`。`Class I` 集线器执行信号翻译；`Class II` 集线器则不执行。每个冲突域内只能有一个\
  \ `Class I` 集线器；每个冲突域内可以有两个 `Class II` 集线器。其他选项均存在。\n\n### 52. C.\n路由器在内存中的路由表中存储并维护路由信息，而不是存储在本地文本文件中。关于路由器的其他陈述都是正确的。\n\
  \n### 53. D.\n防火墙是私有网络与 `ISP` 网络（提供 Internet 访问）之间的通道，所有流量都必须通过该通道。这确保了防火墙有机会检查通过私有网络与\
  \ Internet 之间的每一个数据包，并过滤掉未授权的数据包。如果防火墙位于私有内部网络的中间，Internet 计算机可能会绕过防火墙直接与私有系统通信。将防火墙放置在路由器的远侧将使其置于\
  \ `ISP` 网络中，导致它过滤所有 `ISP` 流量，而不仅仅是发往私有网络的流量。在 `ISP` 站点安装防火墙与安装在私有网络站点的路由器远侧的效果相同。\n\
  \n### 54. A, B.\n`FTP` 协议使用两个已知端口：`20` 和 `21`。防火墙必须开放这两个端口以允许 `FTP` 流量通过。`FTP` 不需要端口\
  \ `22`、`23` 或 `24`。\n\n### 55. D.\n代理服务器是一个应用层服务，因为它接收客户端计算机的 Internet 服务请求，读取每个请求中的应用层协议数据，然后生成自己的对相同服务的请求，并将其传输到客户端指定的\
  \ Internet 服务器。只有应用层服务才能读取和处理网络包中的应用层数据。代理服务器不能是数据链路层设备，因为它可以为整个内部网络提供 Internet\
  \ 访问，而数据链路层关注的是单个子网上的通信。代理服务器不能是网络层设备，因为网络层无差别地处理所有内部网络包，并且不知道哪个应用程序生成了包内携带的数据。传输层不参与处理应用数据，因此不能说代理服务器工作在传输层。\n\
  \n### 56. B.\n`DPI` 是一种防火墙技术，它检查数据包中携带的数据而不仅仅是协议标头。虽然传统的防火墙通常不支持 `DPI`，但 `NGFWs`\
  \ 通常支持。状态数据包检测、`NAT` 和 `VPN` 支持都是传统防火墙产品通常支持的功能。\n\n### 57. C.\n内容过滤器是一种防火墙功能，它通过检查包内部的数据（而非来源）来定位违规材料。它们不扫描\
  \ `IP` 地址，也不检测典型类型的恶意软件。交换机中没有实现内容过滤器。\n\n### 58. D.\n在大多数情况下，负载均衡路由器通过根据管理员设置的规则处理入的流量来工作。规则可以使用各种标准（例如每个服务器的当前负载或响应时间，或者给定循环中的下一个服务器）在服务器组之间分配流量。负载均衡器通常不使用服务器的硬件配置来引导流量，因为这是一个不会变化的因素。\n\
  \n### 59. C.\n`VoIP` 网关是一种提供 `IP` 网络与公共交换电话网络 (`PSTN`) 之间通道的设备。网关允许连接到 `PSTN` 的标准电话使用\
  \ Internet 上的 `VoIP` 服务拨打电话。代理服务器是一种应用层设备，为浏览器和其他客户端程序提供 Internet 访问。虚拟专用网络 (`VPN`)\
  \ 终端允许多个客户端系统从远程位置访问网络。统一威胁管理 (`UTM`) 设备通常执行 `VPN`、防火墙和防病毒功能。\n\n### 60. A, C.\n\
  网络地址转换 (`NAT`) 是一种网络层设备，它将客户端所有传输的私有 `IP` 地址转换为注册的 `IP` 地址。因此，`NAT` 适用于所有应用程序。代理服务器是执行相同类型转换的应用层设备，但仅适用于特定应用程序。远程认证拨号用户服务\
  \ (`RADIUS`) 服务器可以为远程访问服务器提供认证、授权、计、审计 (`AAAA`) 服务。它不转换 `IP` 地址。统一威胁管理 (`UTM`) 设备通常执行\
  \ `VPN`、防火墙和防病毒功能。它同样不转换 `IP` 地址。\n\n### 61. A, B, C, E.\n`HVAC` 传感器可以测量气候控制区域（如数据中心）的温度和湿度；锅炉和压缩机等设备的大气压力；以及根据人员存在情况来控制条件。打印机、摄像头、门锁和其他物理访问控制设备不是\
  \ `HVAC` 系统的一部分。\n\n### 62. B.\n虚拟专用网络 (`VPN`) 终端是一种路由器，允许多个客户端系统从远程位置访问网络。由于该设备提供了网络接口，因此被认为是一种路由器，而不是交换机、网关或网桥器。\n\
  \n### 63. B.\n虚拟 PBX 是一种安排，电话公司为客户提供 PBX 服务，但实际硬件由其维护。最近对云计算的强调导致许多使用 IP 语音 (`VoIP`)\
  \ 为客户提供托管 PBX 解决方案。`QoS` 是一种根据内容标记数据包以优先级排序的技术。它不是虚拟 PBX 技术。缓存数组路由协议 (`CARP`) 使代理服务器交换信息；它不提供虚拟\
  \ PBX 服务。在轮询 `DNS` 中，`DNS` 服务器包含多个指向相同服务器名称的资源记录，每个不同的 `IP` 地址代表运行服务器应用程序的计算机。当客户端解析服务器名称时，`DNS`\
  \ 服务器依次访问每个记录，以便每个地址理论上接收相同数量的用户。这不是虚拟 PBX 技术。\n\n### 64. C.\n代理服务器为网络用户提供 Internet\
  \ 服务，客户端上的未注册 `IP` 地址保护它们免受 Internet 用户的非法访问，这满足了第一个目标。代理服务器还允许网络管理员限制用户访问 Internet，这满足了两个辅助目标之一。然而，代理服务器无法为客户端分配\
  \ `IP` 地址，且计划未提到 `DHCP` 或其他自动 `TCP/IP` 配置机制。因此，该计划没有满足另一个辅助目标。\n\n### 65. A, B.\n\
  无线接入点控制与配置 (`CAPWAP`) 协议和轻量级接入点协议 (`LWAPP`) 都是允许无线控制器管理和控制接入点 (`APs`) 的协议。轻量级目录协议\
  \ (`LDAP`) 用于目录服务，点对点隧道协议 (`PPTP`) 用于虚拟专用网络。\n\n\n\n\n\n### 66. B. 在许多企业无线网络中，接入点（APs）不运行完整的操作系统，被称为瘦型或轻量级\
  \ AP。网络中还有一种名为无线控制器的设备，它负责执行某些所需的任务并管理 AP。无线终端是另一个术语，指在无线网络中作为客户端的计算机或其他设备。虚拟机程序（Hypervisors）和分界点（demarcation\
  \ points）与无线网络无关。虚拟机程序在主机服务器上创建并管理虚拟机（VMs），分界点是私有网络与外部电信服务之间的接口。\n\n### 67. A. 多层交换机是一种网络连接设备，功能工作于\
  \ OSI 模型的第 2 层和第 3 层。在第 2 层，该设备的功能象一个普通交换机，为每个连接的节点提供单独的冲突域，并允许管理员创建多个 VLAN。在第 3\
  \ 层，该设备还通过在 VLAN 之间转发数据包提供路由功能。虚拟路由器、负载均衡器和宽带路由器是严格的第 3 层设备，它们可以路由流量但不能创建 VLAN。\n\
  \n### 68. D. 虚拟专用网络（VPN）头端（headend）是一种路由器，允许多个客户端系统从远程位置访问网络。它不在服务器之间分发流量。负载均衡器是一种路由器，它将单个\
  \ IP 地址的流量轮流转发到多个服务器。轮询 DNS（Round-robin DNS）是一种技术，DNS 服务器将名称解析为多个地址。网络负载均衡（NLB）集群是一个服务器组，它们在网络层路由流量的。\n\
  \n### 69. B. 负载均衡器是一种路由器，它将单个 IP 地址的流量轮流转发到多个服务器。在大多数情况下，负载均衡器通过根据规则处理入站流量来工作。负载均衡器工作在网络层，由于它根据\
  \ IP 地址工作，负载均衡器在第 4 层处理入站流量。负载均衡器不是网关或防火墙。\n\n### 70. C. 下一代防火墙（NGFWs）通过扩展传统防火墙的功能，在第\
  \ 3 层和第 4 层执行防火墙功能，增加了深度数据包检测（DPI）和入侵防御系统（IPS）等功能。远程拨号用户服务（RADIUS）可以监控。CSU/DSU 是一种在私有网络上的设备，应用程序通过它访问。\n\
  \n### 71. A. 电话交换机（PBX）是一种在私有网络上的设备，应用程序通过它访问 Internet。公共交换电话网（PSTN）是 Internet 之间的。网关（gateway）工作在第\
  \ 3 层，提供 Internet 访问。\n\n### 72. A. 多层交换机通常在第 2 层和第 3 层工作，具有路由功能。由于路由器服务器使用 IP 地址，它们在网络层是不可见的的。\n\
  \n### 73. B, C. 为了提供 Internet 访问，多层交换机通常在第 2 层和第 3 层工作，使用媒体访问控制（MAC）地址和 IP 地址。路由器服务器在应用层缓存数据以备后用。由于在应用层工作，它们无法提供\
  \ Internet 访问。\n\n### 74. B, C, D. 多层交换机通常在数据链路层（第 2 层）和网络层（第 3 层）工作，使用 MAC 地址和\
  \ IP 地址将数据包转发到相应的目的地。某些交换机在传输层（第 4 层）工作，区分用户数据协议（UDP）和传输控制协议（TCP）流量。\n\n### 75.\
  \ A. 入侵检测系统（IDS）的设计用于监控网络流量并向管理员发送通知。不间电源（UPS）、远程拨号用户服务（RADIUS）服务器、拒绝服务（DoS）攻击和远程访问服务（RAS）服务器与网络监控无关。\n\
  \n### 76. C. 数据包转发通常是路由器的功能，而不是 UTM 设备的功能。UTM 设备通常执行 VPN、防火墙功能。\n\n### 77. B. 端口镜像（Port\
  \ mirroring）是某些交换机上的功能，形式为运行在杂散模式下的特殊端口。这意味着交换会将会将入站流量复制到该端口，同时也复制到目标端口。通过在该端口连接\
  \ IDS 或协议分析仪，管理员可以访问所有流量。状态包检测是一种防火墙功能，允许设备检查网络和传输层的头部字段，寻找指示破坏性模式（如 IP 欺骗、SYN 洪水）。中继（Trunking）是交换机的一种功能，允许管理员创建跨多个交换机的\
  \ VLAN。基于服务的过滤是一种防火墙功能，根据传输层端口号拦截流量。\n\n### 78. B. 访问控制列表（ACL）通过过滤用户名、MAC 地址、IP\
  \ 地址或其他标准来限制对设备的访问。路由器、交换机和 WAP 都使用 ACL 来控制访问。集线器（Hubs）是纯物理层设备，转发电气或光信号。它们没有控制访问的方法。\n\
  \n### 79. B. 默认网关参数指定终端访问其他网络所需的本地路由器地址。WINS 服务器地址和 DNS 服务器地址用于将名称解析为 IP 地址。不存在“子网网关”这种参数。\n\
  \n### 80. A. 图显示了路由信息协议（RIP）版本 1 响应包的格式。该图没有显示 RIPv2、最短路径优先（OSPF）、增强内部网路由协议（EIGRP）或边界网协议（BGP）的数据包格式。\n\
  \n### 81. A. EIGRP 可以支持无类 IPv4 地址。它的设计是为了替代不支持无类地址的内部路由协议（IGRP）。其他所有选项都是正确的陈述。\n\
  \n\n\n\n\n## 82. A, B\n带宽限流（Bandwidth throttling）是一种流量整形技术，可防止特定的数据流传输过多的数据包。速率限制（Rate\
  \ limiting）是一种控制发送系统传输速率的流量整形技术。广播风暴（Broadcast storm）是一种网络交换环路。`NAT` 是私有网络共享注册 IP\
  \ 地址的方法。最后这两项中都不是流量整形技术。\n\n## 83. D\n服务质量（QoS）是一个通用术语，指的是各种对网络流量进行优先级的机制，以确保需要特定性能的应用或数据流不会受到低优先级传输的负面影响。端口转发（Port\
  \ forwarding）是一种路由方法，将旨在发送一个 IP 地址和端口号的流量重定向到另一个。动态路由（Dynamic routing）是一种随着互联网网络路由结构的变化而自动用新信息更新路由表的方法。虚拟局域网（`VLANs`）是将广播域划分为独立单元的方法，其功能等同于物理局域网。\n\
  \n## 84. A, D\n运行 `RIPv1` 路由协议的路由器每 30 秒广播其整个路由表，无论网络是否发生变化。`RIPv1` 在更新中不包含子网掩码，因此不支持子网划分。\n\
  \n## 85. A\n区分服务（`Diffserv`）是一种通过使用 IP 报头中区分服务（`DS`）字段的 6 位值对流量类型进行分类，并在网络上提供服务质量（QoS）。业务分类（`CoS`）是一种类似的机制，在数据链路层运行，通过在以太网帧中添加\
  \ 3 位优先级代码点（`PCP`）值来实现。流量整形是一种通过对网络流量进行优先级排序的手段，通常通过在应用层延迟数据包来实现。服务质量（QoS）是一个涵盖各种网络流量优先级机制的统术语。管理距离（Administrative\
  \ distance）是路由器用于选择通目的最高效路由的数值。\n\n## 86. A, E\n当网络发生变化时，管理员必须手动添加、修改或删除静态路由。因此，不建议在每个目的网络有通条路径的大型网络中使用静态路由。静态路由不会由路由协议自动添加，也不会适应网络的变化。\n\
  \n## 87. A\n`RIPv1` 在更新中不包含子网掩码。`RIPv2` 支持子网划分，并在更新中包含每个网络地址的子网掩码。`OSPF` 和 `BGP`\
  \ 在更新中都包含子网掩码。\n\n## 88. D\n距离矢量协议（Distance vector protocols）依赖跳数来评估路由的效率。链路状态协议（Link\
  \ state protocols）使用不同类型的计算，通常基于 Dijkstra 算法。内部网关协议（interior gateway protocol）和边缘网关协议（edge\
  \ gateway protocol）术语并不是计算路由效率的方法。\n\n## 89. B\n单个 `RIP` 广播数据包可以包含 25 条路由。如果计算机路由表中的路由超过\
  \ 25 条，则 `RIP` 必须生成额外的数据包。\n\n## 90. A, C\n`OSPF` 是一种链路状态路由协议，这意味着它并不仅仅依赖跳数来衡量路由的相对效率。`EIGRP`\
  \ 是一种可以使用链路状态路由的混合协议。`RIP` 是一种距离矢量路由协议，意味着它使用跳数来衡量路由效率。`BGP` 是一种外部网关协议，使用路径向量或距离矢量在自治系统之间交换路由信息。\n\
  \n## 91. A, B, D\n`OSPF` 支持 `CIDR`。所有其他选项都包含正确的陈述。\n\n## 92. A\n收敛（Convergence）是指路由器通过动态路由协议将信息从路由表传播到网络上其他路由器的过程。距离矢量（Distance\
  \ vectoring）、重发布（redistribution）和传播（dissemination）并没有描述这一过程。\n\n## 93. A\n`RIP`\
  \ 是一种距离矢量协议，使用跳数来衡量路由。`OSPF`、`BGP` 和 `IS-IS` 都是链路状态协议。\n\n## 94. A\n外部网关协议（EGP）在自治系统之间传输数据报。内部网关协议（IGP）在自治系统内部传输数据报。路由信息协议（RIP）和最短路径优先算法（OSPF）是。\n\
  \n## 95. D\n`TTL` 是 `IPv4` 报头中的一个值，规定了数据包在网络中允许的最大跳数。处理数据包的路由器会将 `TTL` 值减 1，并在变为零时丢弃。`OSPF`\
  \ 是一种协议。`MTU` 规定了帧的最大大小。管理距离是路由器用于选择目的最高效路由的数值。\n\n## 96. A, D\n`route` 命令最初用于显示\
  \ Unix 或 Linux 系统的路由表，并通过添加、更改和删除静态路由来修改内容。`ip` 命令是 `iproute2` 工具包的一部分，在许多 Linux\
  \ 发行版中已取代 `route`。运行 `ip` 命令可以操作路由表。`traceroute` 和 `ifconfig` 不是操作路由表的命令。\n\n##\
  \ 97. A\n使用 `OSPF` 的路由器传输每个网络接口的速度，并使用最小成本传输数据包。路由器不需要共享数据链路层协议或它们的 IP 地址。\n\n##\
  \ 98. B\n`BGP` 是一种路径矢量协议，而不是链路状态协议。所有其他选项都包含正确的陈述。\n\n## 99. A\n`IPv4` 路由表中的默认路由地址始终为\
  \ 0.0.0.0。其他目的位于路由表中，但它们不是默认路由。\n\n## 100. A\n图显示了路由协议版本 2 响应数据包的格式。该图没有显示 `RIPv1`、`OSPF`、`EIGRP`\
  \ 或 `BGP` 的数据包格式。\n\n## 101. D\n边界网关协议（BGP）是一种高度可扩展的协议，用于路由私有自治系统（在其中被称为内部边界网关协议\
  \ `iBGP`，并在所有路由器之间维护全网状通信）以及互联网（在其中被称为外部边界网关协议 `eBGP`）。路由信息协议（`RIP`）、最短路径优先（`OSPF`）和增强内部网关协议（`EIGRP`）没有内部和外部划分。\n\
  \n## 102. A, B\nIP 协议（IP）的两个版本（`IPv4` 和 `IPv6`）在其消息报头中都包含一个 `TTL` 字段，限制数据包在网络中的路由次数。处理数据包的路由器会将\
  \ `TTL` 值减 1 直到变为零，随后将其丢弃。互联网控制消息协议（ICMP）和互联网组管理协议（IGMP）没有 `TTL` 字段。\n\n## 103.\
  \ B\n广域网优化（WAN optimization）不是流量整形的形式，因为它压缩数据流并传输增量文件更新。流量整形使用速率限制、带宽限流和自限制等技术来延迟特定类型数据包的传输，以优化网络性能。\n\
  \n\n\n\n\n### 104. 分布式交换\nA. 分布式交换描述了一种分层交换架构，其中远程交换机（在此情况下为部门交换机）处理大部分网络流量，而主机交换机仅用于远程位置之间的流量。端口转发（Port\
  \ forwarding）是一种路由方法，将旨在发送特定 IP 地址和端口的流量重定向到另一个。流量整形（Traffic shaping）是优化网络带宽分配的一系列技术。邻居发现（Neighbor\
  \ discovery）是一种`IPv6` 技术，用于查找本地网络上设备服务的地址。流量控制（Flow control）是调节系统传输速度的技术。\n\n###\
  \ 105. 冲突域\nA. 转发交换机所有的半双工端口连接代表一个不同的冲突域。全双工连接不受冲突影响，因此不定义独立的冲突域。\n\n### 106. 寻址\n\
  C. 介质访问控制（`MAC`）地址是一个 6 字节十六进制值，字节之间用冒号分隔，例如 `00:1A:6B:31:9A:4E`。选项 A `10.124.25.43`\
  \ 全为十进制并使用点；这是一个 `IPv4` 地址。选项 B `FF:FF:FF:FF:FF:FF` 是一个有效的 MAC 地址，但该值被留作广播地址。选项\
  \ D `03:AE:16:3H:5B:11` 不是有效的十六进制地址，它应该只包含数字和字母 `A` 到 `F`。选项 E `fe80::89a5:9e4d:a9d0:9ed7`\
  \ 对于 MAC 地址来说太长了；这是一个有效的 `IPv6` 地址。\n\n### 107. 协议与冗余\nB. 生成树协议（`STP`）防止数据包因冗余链路在交换机之间无限循环。创建冗余链路是防止交换机故障的良好措施，但通过多个链路传输的数据包可能会交换机之间无限循环。STP\
  \ 创建一个交换链路数据库并关闭冗余链路，直到需要它们为止。路由信息协议（`RIP`）传播路由表信息。虚拟局域网（`VLAN`）是一种组织工具，它通过在交换机内部创建多个广播域来运行。网络地址转换（`NAT`）是一种路由方法，允许私网共享注册的\
  \ IP 地址。地址解析协议（`ARP`）是一种通过广播其 `IPv4` 地址来发现系统 MAC 地址的协议。\n\n### 108. 物理连接\nA, B.\
  \ 当将 `MDI` 端口连接到 `Auto-MDI-X` 端口时，可以使用直通线或交叉线，因为 `Auto-MDI-X` 端口可以自动调整以实现所需的交叉电路。`MDI`\
  \ 和 `Auto-MDI-X` 端口仅用于双绞电缆，因此不需要同轴电缆或光纤。\n\n### 109. 网络层协议\nB. 邻居发现协议（`NDP`）是一种网络层协议，定义了五种新的互联网控制消息协议版本\
  \ 6（`ICMPv6`）数据包类型，使 `IPv6` 系统能够定位网络上的资源（如路由器和 DNS 服务器），并自动配置和检测重复的 `IPv6` 地址。边界网关协议（`BGP`）是一种外部网关协议，用于在自治系统之间交换路由信息。开放路径优先算法（`OSPF`）是一种链路状态路由协议，允许路由器交换路由表信息。以太网供电（`PoE`）是一个通用术语，定义了通过以太网电缆传输电力以及数据信号的标准。\n\
  \n### 110. IEEE 标准\nB. `IEEE 802.1Q` 是一种定义某种机制（某些制造商称为以太网中继）的标准，该机制通过在以太网帧中插入一个额外的\
  \ 32 位字段来识别数据包所属的虚拟局域网（`VLAN`）。`IEEE 802.1P` 是一种定义通过在以太网帧中添加 3 位字段在数据链路层实现服务质量（`QoS`）的机制的标准。`IEEE\
  \ 802.1X` 是一种定义了名为基于端口的网络访问控制（`PNAC`）认证机制的标准。`IEEE 802.1AB` 是一种定义链路层发现协议（`LLDP`）的标准。`IEEE\
  \ 802.1AX` 是链路聚合控制协议（`LACP`）的规范，该协议是将物理端口组合为单个逻辑通道的机制。\n\n### 111. CSMA/CD 操作\n\
  C. `CSMA/CD` 网络上的站点首先检查介质查看是否空闲。如果它们检测到介质空闲，就会开始传输。如果有两个或多个设备同时传输，就会发生冲突。冲突发生后，涉及的两个站点立即停止传输。之后，它们发送冲突信号。然后，两个站点在随机间隔后退避，重新开始传输过程。\n\
  \n### 112. 晚冲突\nA. 为了让 `CSMA/CD` 正常工作，系统必须在传输数据包时检测到包冲突。如果电缆过长，数据包可能在检测到冲突之前离开传输系统，导致产生晚冲突，这种冲突是无法重新传输的。错误的接线、系统数量过多以及过多的冲突通常不会防止冲突检测系统的发生。\n\
  \n### 113. 冲突恢复\nB. 在发送冲突信号后，两个系统等待一个随机间隔。这是为了防止它们同时重新传输数据包，导致另一次冲突。系统不需要对数据包进行重组、重缓冲或重新计算校验和。\n\
  \n### 114. VLAN 与其他设备\nC. 用交换机替换路由器会将互联网络转换为单个大型子网，而虚拟局域网（`VLAN`）作为交换结构上的逻辑元素存在。虽然\
  \ `VLAN` 在功能上等于网络层子网，但单个 `VLAN` 内的系统仍然通过交换机物理连接，而不是路由器。桥器在数据链路层连接网段并选择性地在网段之间转发流量。然而，桥器不像交换机那样提供两个系统之间的专用连接，它们无法将大型路由型互联网络转换为单个交换网络。因此，它们在实现\
  \ `VLAN` 方面没有作用。集线器是物理层设备，会将所有输入流量通过其所有端口传播。将互联网络上的路由器替换为集线器将产生巨大的流量和大量冲突的单一共享广播域。因此，集线器不连接\
  \ `VLAN` 中的计算机。\n\n### 115. 以太网冲突\nA. 冲突是以太网网络上的正常现象；当两个节点在完全相同的时间传输时就会发生。冲突的发生并不意味着网络故障。当冲突发生时，涉及的节点会重新传输数据包以确保数据不丢失。冲突是数据链路协议的现象；它们与网络层构造\
  \ IP 地址无关。\n\n### 116. 晚冲突定义\nD. 冲突是以太网网络上的正常现象，但晚冲突并不正常。当两个数据包在一个或多个传输完成后发生冲突时，就会发生晚冲突。数据包重传、冲突检测和冲突信号都是以太网上的正常现象。\n\
  \n### 117. 边界\nB. 在网络层使用路由器连接子网可以维持数据链路层的管理边界，防止广播传输遍整个互联网络。交换消除了这些数据链路层边界，管理员可以使用虚拟局域网（`VLAN`）来模拟它们。由于集线器会无差别地将接收到的所有流量通过其所有端口传播，它们没有创建管理边界。域是由域名系统（`DNS`）定义的网络设备逻辑组。它们的功能与\
  \ `VLAN` 没有任何关系。交换机本质上是多端口桥器，仅向目标设备转发输入流量。因此，桥器与消除管理边界的关系比建立边界的关系更密切。\n\n\n\n\n\n\
  ### 118. B, D\n单个虚拟局域网（`VLAN`）中的计算机可以位于交换网络上的任何位置，无论交换机的物理配置如何。由 `VLAN` 中的计算机生成的广播消息仅传输到该\
  \ `VLAN` 中的所有其他计算机，就像这些系统在物理上位于独立的 `LAN` 或子网上一样。交换网络上计算机之间的单播传输（Unicast transmissions）不需要\
  \ `VLANs`，因为交换机在两个系统之间创建了等同于直接连接的通道。`VLANs` 仅用于需要广播（broadcasts）的通信过程，如果这些广播在没有 `VLANs`\
  \ 的情况下传输，会导致网络泛洪。尽管 `VLANs` 是纯粹的逻辑结构，但其运行功能与物理子网相同，并且它们之间的通信需要 `routers`（路由器）。路由能力通常被集成到交换机中，以以实现\
  \ `VLANs` 之间的通信。\n\n### 119. A, D\n每个网络设备在其网络接口适配器中都编码有一个唯一的硬件地址，管理员可以使用这些地址来选择参与特定虚拟局域网（`VLAN`）的设备。当在交换机内部实现\
  \ `VLANs` 时，选择连接特定计算机的端口是识别特定 `VLAN` 中计算机的简单方法。`IP` 地址是第 3 层（网络层）的构建结构，因此它们不适用于交换机等第\
  \ 2 层（数据链路层）设备。尽管 `DNS` 名称可以唯一地标识网络上的计算机，但 `DNS` 是一个应用层过程，与发生在数据链路层和网络层的交换和路由过程没有关系。因此，你不能使用\
  \ `DNS` 名称来识别 `VLAN` 中的计算机。\n\n### 120. C\n`VLANs` 是定义在交换机内部的数据链路层局域网（`LANs`）。只有连接到属于同一\
  \ `VLAN` 端口的设备（和用户）才能相互通信，直到网络中添加了如 `router`（路由器）或三层交换机之类的第 3 层设备。重新创建和重新配置 `VLANs`\
  \ 并不会解决这个问题。流量过滤器通常在 `routers` 上实现。`VLANs` 并不需要使用相同数据链路协议。\n\n### 121. D\n`Ethernet`（以太网）在数据链路层使用巨型帧（jumbo\
  \ frames）更有效地传输大量数据。`Ethernet` 通常将帧的大小限制在 1500 字节，但巨型帧允许 `Ethernet` 系统创建高达 9000\
  \ 字节的帧。帧是与数据链路层相关的协议数据单元，因此它们不适用于网络层、传输层或应用层。\n\n### 122. C, D\n家庭和小办公室网络通常由单个子网组成，只需要基础交换机，而不需要允许管理员创建独立子网的高级虚拟局域网（`VLAN`）功能。大多数家庭和小型办公室网络都有动态主机配置协议（`DHCP`）服务器，用于为客户端分配\
  \ `IP` 地址和其他 `TCP/IP` 配置设置。`DHCP` 服务器可以集成到宽带路由器或其他 Internet 接入共享解决方案中。大多数家庭和小型办公室网络支持网络地址转换（`NAT`），使它们能够使用私有\
  \ `IP` 地址并访问互联网。`10GBase-T` 是基于 UTP 的 10 千兆以太网（`Ethernet`）的名称，这是一种在服务器中常见的网络接口适配器高级标准。\n\
  \n### 123. A, B\n为了将不同交换机上的端口合并到一个 `VLAN`，你需要在每个交换机上指定一个中干端口（trunk port）用于交换机之间的流量。最初，原生\
  \ VLAN（native VLAN）使用默认的 `VLAN1` 用于中干流量，且该流量是不带标记的。未标记流量容易受到使用双重标记数据包的攻击。当你配置原生\
  \ `VLAN` 使用标记时，这使其免受双重标记攻击。更改原生 `VLAN` 不会创建根保护（root guards）或桥接协议数据单元保护（`BPDU` guards），且所有流量继续进行交换而非路由。\n\
  \n### 124. C\n`IEEE 802.1q` 协议负责 `VLAN` 标记，这一过程使网络交换机能够支持 `VLANs`。通过在帧中插入 VLAN 标识标签，交换机可以确定每个数据包的目标是哪个\
  \ `VLAN` 并将其转发到正确的端口。`IEEE 802.3x` 是有线以太网（`Ethernet`）网络的标准之一。`IEEE 802.1X` 是一个定义基于端口的网络访问控制（`PNAC`）的标准，用于无线及其他网络上的认证。`IEEE\
  \ 802.11ac` 是定义无线网络物理层和数据链路层协议的标准。\n\n### 125. B\n当带内交换机管理流量（例如通过到交换机的安全外壳连接 `SSH`\
  \ 连接生成的流量）使用原生 `VLAN` 时，它默认是不带标记的。这是因为原生 `VLAN` 首先是默认的 `VLAN1`，它没有被 `802` 标记。由于原生\
  \ `VLAN` 是默认的，它容易受到某些攻击。当你对原生 `VLAN` 使用标记时，这使其免受双重标记的影响。原生 `VLAN` 无法重命名，且 `SSH`\
  \ 流量已由工作站加密。更改原生 `VLAN` 不会移动管理流量，尽管许多权威提倡创建一个用于带内管理流量的独立 `VLAN`。\n\n### 126. D\n\
  当 `MDI` 端口连接到 `MDI-X` 端口时，必要的交叉电路在 `MDI-X` 端口实现。以太网（`Ethernet`）实现（如 `100Base-TX`）使用分开的传输对，需要交叉电路以确保连接的发送端连接另一端的接收端。具有自适应交叉接口端口的交换机可以检测到交叉电路的需求并自动在端口中实现。这消除了对交叉线的需要。自适应交叉接口端口并不会消除对\
  \ `8PC` 连接器、交换机间连接或直跳线的需要。\n\n### 127. B\n当 `MDI` 端口连接到 `MDI-X` 端口时，交叉电路在 `MDI-X`\
  \ 端口实现。因此，连接需要直跳线，不需要交叉线。`MDI` 和 `MDI-X` 端口仅用于双绞线，因此不需要同轴电缆或光纤。\n\n### 128. C\n\
  在以太网（`Ethernet`）交换机中实现时，端口安全通过逐端口 `MAC` 地址允许一个 `MAC` 地址访问每个交换机端口。黑名单（Blacklisting）阻止列表上的\
  \ `MAC` 地址使用交换机上的所有端口。白名单（Whitelisting）允许列表上的 `MAC` 地址使用交换机上的任何端口。`MAC` 地址欺骗是绕过端口安全、黑名单或白名单的方法。\n\
  \n### 129. D\n当在网络上与数据流量一同传输语音流量时，流量应该具有优先级，以确保流的质量。在不同的 `VLAN` 上分离数据和语音流量允许交换机通过对语音包应用适当标记为语音流量分配更高的优先级。\n\
  \n### 130. C\n传输控制协议（`TCP`）使用一种流控技术，接收系统创建一个特定大小的窗口并允许发送系统发送数据包直到窗口充满。当窗口充满时，发送端停止传输。接收端回回一个确认包，指定它预计从发送端接收的下一个包。用户数据报协议（`UDP`）、超文本传输协议（`HTTP`）和域名系统（`DNS`）不使用滑动窗口技术或任何形式的流控。\n\
  \n\n\n\n\n### 131. B. `Alternative B` PoE 变体可以使用 `CAT 5` 或更高级 `10Base-T` 或 `100Base-TX`\
  \ 电缆中的空闲线对为连接的设备供电。`Alternative A` 和 `4PPoE` 变体不能这样使用空闲线对；它们通过同时传输数据的线对供电。对于千兆太网或更快的安装，`Alternative\
  \ B` 也能使用数据线对。\n\n### 132. C. `Whitelisting`（名单）是通过 `MAC` 过滤指定允许访问无线网络的硬件地址的过程。相比之下，`Blacklisting`（名单）创建一个拒绝访问网络的地址列表。\n\
  \n### 133. A, B. `Bridge Protocol Data Units` (`BPDUs`) 是运行 `STP` 的交换机交换的消息，用于学习交换网络中的可用路径和其他交换机的状态。交换机应通过连接到其他交换机的端口接收\
  \ `BPDUs`。`BPDU guard` 是一项功能，防止 `BPDU` 消息通过连接到终端系统（如计算机）的端口到达，从而防止攻击者操控 `STP` 拓扑。`root\
  \ guard` 通过强制在交换网络上选择根桥接端口来影响 `STP` 的行为。如果没有 `root guards`，管理员无法强制具有冗余交换织结构的网络拓扑。\n\
  \n### 134. A. `IEEE 802.11ac` 标准与 `802.11` 工作组中的所有无线局域网标准一样，使用 `CSMA/CA` 作为 `MAC`。`IEEE\
  \ 802.1X` 标准定义了一种认证机制，不需要 `MAC` 机制。`IEEE 802.3`（以太网）标准使用`载波监听多路冲突检测` (`CSMA/CD`)。\n\
  \n### 135. C. 基础设施拓扑使用 `Wireless Access Point` (`WAP`）将无线设备连接到有线网络。`ad hoc`（自组织）拓扑将无线设备相互连接，而不连接到有线网络。`星型`和`总线型`拓扑不支持无线设备。\n\
  \n### 136. D. `ad hoc` 拓扑描述了无线计算机之间直接通信，不需要除无线网络适配器以外的任何硬件。因此，`ad hoc` 拓扑不需要`router`、`Internet\
  \ connection`、`Access Point` (`AP`) 或特殊的天线。\n\n### 137. A, E. `IEEE 802.11b`、`802.11g`、`802.11n`\
  \ 和 `802.11ax` 网络可以使用 `2.4 GHz` 频段进行传输，可能会受到使用相同频率无线电话的干扰。然而，`IEEE 802.11a` 和 `IEEE\
  \ 802.11ac` 使用 `5 GHz` 段，不会受到 `2.4 GHz` 电话的干扰。\n\n### 138. B. `IEEE 802.11g` 支持高达\
  \ `54 Mbps` 的传输速度，并与 `802.11b` 设备后兼容。`IEEE 802.11` 无法以 `54 Mbps` 运行，虽然 `802.11a`\
  \ 可以，但它与 `802.11b` 不兼容。`IEEE 802.11n` 无法以 `54 Mbps` 运行，尽管它可以以更快的运行。`Bluetooth` 不兼容。\n\
  \n### 139. C, D. `IEEE 802.11b`、`802.11g`、`802.11n` 和 `802.11ax` 网络可以使用 `2.4 GHz`\
  \ 频段进行传输，可能会受到使用相同频率无线电话的干扰。然而，`IEEE 802.11a` 和 `IEEE 802.11ac` 使用 `5 GHz` 段，不会受到\
  \ `2.4 GHz` 电话的干扰。\n\n### 140. C. `Time Division Access` (`TDMA`) 将频率划分为时隙。`Code\
  \ Division Multiple Access` (`CDMA`)、`Global System for Mobile` (`GSM`) 和 `Long-Term\
  \ Evolution` (`LTE`) 都是技术。\n\n### 141. B. `Orthogonal Frequency-Division Multiplexing`\
  \ (`OFDM`) 是一种技术。\n\n### 142. D. `Multiple Input, Multiple Output` (`MIMO`) 是一种技术。\n\
  \n### 143. B. `802.11n` 标准引入的 `Multiple Input, Multiple Output` (`MIMO`) 实现了更快的速度。\n\
  \n### 144. A, C. `2.4 GHz` 频段具有 `22 MHz` 的通道，间隔为 `5 MHz`，导致重叠。通道 `1`、`6` 和 `11`\
  \ 是三个足够远而不重叠的通道。\n\n### 147. D. `802.11n` 标准引入的 `Multiple Input, Multiple Output`\
  \ (`MIMO`) 技术允许无线设备使用多个天线进行收发。`802.11ac` 标准定义的 `Multiuser MIMO` (`MU-MIMO`) 允许同时向不同用户传输多个帧。`载波监听多路冲突回避`\
  \ (`CSMA/CA`) 是一种介质访问控制 (`MAC`) 机制。`Channel bonding`（信道绑定）合并通道。\n\n### 148. A. `2.4\
  \ GHz` 频段具有 `22 MHz` 的通道，间隔为 `5 MHz`。通道 `1`、`6` 和 `11` 互重叠。\n\n### 149. C. `IEEE\
  \ 802.11n` 在 `175 feet` 范围内可以达到 `600 Mbps`。`802.11ac` 可以运行高达 `1.3 Gbps`，但限制在 `115\
  \ feet`。\n\n\n\n\n\n### 150. A.\n多输入多输出（MIMO`）要求使用两个或多个天线，使无线设备能够有效进行信号复用，从而提高传输速度。时分多路访问（TDMA`）是一种通信技术，它将一个频率划分为多个时隙，使其携带多个数据流。个人局域网（PAN`）为与个人相关的设备（如智能手机）提供通信。`Ant+`\
  \ 是一种无线协议，通常用于监控传感器采集的数据，例如心脏起搏器中的传感器。\n\n### 151. D.\n通过一种称为信道合并（channel bonding）的技术，`802.11ac`\
  \ 标准定义了最多八个 `20 MHz` 信道的组合，总信道带宽可达 `160 MHz`。`802.11n` 标准可以合并两个信道，宽度为 `40 MHz`。早期的标准限制为单个\
  \ `20 MHz` 信道。\n\n### 152. A, E.\n`IEEE 802.11a` 和 `IEEE 802.11ac` 标准只能使用 `5 GHz`\
  \ 频段。`IEEE 802.11b` 和 `IEEE 802.11g` 只能使用 `2.4 GHz` 频段。`IEEE 802.11n` 可以使用 `2.4\
  \ GHz` 或 `5 GHz` 频段。\n\n### 153. B.\n`IEEE 802.11ac` 标准提供最大的吞吐量，高达 `1.3 Gbps`。`802.11n`\
  \ 标准的最高最高 `600 Mbps`。`IEEE 802.11a` 和 `IEEE 802.11g` 标准的速度最高为 `54 Mbps`。`IEEE 802.11b`\
  \ 标准的速度为 `11 Mbps`。\n\n### 154. D.\n只有 `802.11n` 标准定义了同时支持 `2.4 GHz` 和 `5 GHz` 频率的无线局域网设备。`IEEE\
  \ 802.11a` 和 `IEEE 802.11ac` 标准仅使用 `5 GHz`，而 `IEEE 802.11b` 和 `IEEE 802.11g` 标准仅使用\
  \ `2.4 GHz`。\n\n### 155. C.\n`802.11ac` 标准通过在单个设备上使用最多八个天线支持多输入多输出（MIMO`）。`802.11n`\
  \ 是早期支持 `MIMO` 的唯一 `802.11` 标准，但它最多只能使用四个天线。\n\n### 156. C.\n服务集标识符（SSID`）是你在连接到无线网络时使用的名称。基本服务集（BSS`）指的是无线网络本身，由单个\
  \ `AP` 和若干客户端组成。扩展服务集（ESS`）由两个或多个 `BSS` 组成，使用多个 `APs`。基本服务集标识符（BSSID`）是与 `BSS` 关联的接入点的\
  \ MAC 地址。\n\n### 157. A, B.\n符合 `IEEE 802.11a` 和 `IEEE 802.11g` 标准的设备只能使用单个 `20\
  \ MHz` 信道。`IEEE 802.n` 设备可以使用信道合并将两个信道连接在一起，实现 `40 MHz` 的聚合信道带宽。\n\n### 158. A.\n\
  符合 `IEEE 802.11a` 和 `IEEE 802.11g` 标准的设备只能使用单个 `20 MHz` 信道。`IEEE 802.n` 设备可以使用信道合并将两个信道连接在一起，实现\
  \ `40 MHz` 的聚合信道带宽。\n\n### 159. C.\nWiFi 安全保护（WPA`）增加了临时密钥完整性协议（TKIP`）。这后来也变得漏洞，因此引入了\
  \ `WPA2`，它用可扩展身份验证协议（EAP`，一种认证框架）取代了 `TKIP`。\n\n### 160. B.\n`802.11ac` 标准通过在单个设备上使用最多八个天线支持多输入多输出（MIMO`）。`802.11n`\
  \ 是早期支持 `MIMO` 的唯一 `802.11` 标准，但它最多只能使用四个天线。\n\n### 161. C.\n服务集标识符（SSID`）是你在连接到无线网络时使用的名称。基本服务集（BSS`）指的是无线网络本身，由单个\
  \ `AP` 和若干客户端组成。扩展服务集（ESS`）由两个或多个 `BSS` 组成，使用多个 `APs`。基本服务集标识符（BSSID`）是与 `BSS` 关联的接入点的\
  \ MAC 地址。\n\n### 162. A, B.\n符合 `IEEE 802.11a` 和 `IEEE 802.11g` 标准的设备只能使用单个 `20\
  \ MHz` 信道。`IEEE 802.n` 设备可以使用信道合并将两个信道连接在一起，实现 `40 MHz` 的聚合信道带宽。\n\n### 163. C.\n\
  WiFi 安全保护（WPA`）增加了临时密钥完整性协议（TKIP`）。这后来也变得漏洞，因此引入了 `WPA2`，它用可扩展身份验证协议（EAP`，一种认证框架）取代了\
  \ `TKIP`。\n\n### 164. D.\n只有 `802.11n` 标准定义了同时支持 `2.4 GHz` 和 `5 GHz` 频率的无线局域网设备。`802.11a`\
  \ 和 `802.11ac` 标准仅使用 `5 GHz`，而 `802.11b` 和 `802.11g` 标准仅使用 `2.4 GHz`。\n\n\n\n\n\n\
  ### 169. B. 无线安全访问 2 (WPA2) 为无线网络提供最大的安全性，部分原因是它使用了频繁更改的长加密密钥。有线等效加密 (WEP) 存在许多漏洞，包括短小且不变的加密密钥，这使得它的安全性低于\
  \ WPA。`IPsec` 是一种网络层安全标准，不能为 `IEEE 802.11` 无线网络提供所需的安全性。传输层安全 (`TLS`) 是一种在应用层加密\
  \ Web 服务器和客户端之间交换数据的协议。它无法为无线局域网提供足够的安全性。第 2 层隧道协议 (`L2TP`) 是一种虚拟专用网络协议；它无法为无线网络提供足够的安全性。\n\
  \n### 170. C. 带有高级加密标准 (AES) 的计数模式密码块链消息认证码协议 (CCMP) 是一种与无线安全访问 II (WPA2) 安全协议配合使用的加密协议。`WPA`\
  \ 的创建是为了取代不安全的有线等效加密 (`WEP`) 协议，而 `WPA2` 的是为了取代第一代 `WPA` 使用的临时密钥完整性协议 (`TKIP`)。可扩展身份验证协议\
