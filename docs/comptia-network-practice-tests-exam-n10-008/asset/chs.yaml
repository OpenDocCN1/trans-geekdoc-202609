  \ (An upgrade)\n4. 服务包 (A service pack)\n\n## 128. 与通常自动下载并安装操作系统补丁的个人不同，企业 IT 部门通常在部署新补丁之前对其进行评估。下列哪个不是此评估过程中的常见步骤？\n\
  \n1. 测试 (Testing)\n2. 研究 (Researching)\n3. 回滚 (Rolling back)\n4. 备份 (Backing up)\n\
  \n## 129. 下列哪个术语指的是卸载最近发布的补丁以恢复使用之前的版本的过程？\n\n1. 回退 (Backslide)\n2. 降级 (Downgrade)\n\
  3. 重置 (Reset)\n4. 回滚 (Rollback)\n\n## 130. 媒体访问控制 (MAC) 地址过滤如何提高无线本地局域网 (WLAN) 的安全性？\n\
  \n1. 通过防止接入点广播它们的存在\n2. 通过允许发送到或来自特定地址的流量\n3. 通过将注册的 MAC 地址替换为未注册的地址\n4. 通过仅允许具有指定\
  \ MAC 地址的设备连接\n5. 通过将特定客户端从网络中隔离\n\n## 131. 下列哪个是地理围栏 (geofencing) 的最佳描述？\n\n1.\
  \ 你所拥有的 (Something you have)\n2. 你知道的 (Something you know)\n3. 你所做的 (Something you\
  \ do)\n4. 你所在的地方 (Somewhere you are)\n\n## 132. MAC 过滤是以下哪种类型硬件设备使用的访问控制方法？\n\n\
  1. 无线接入点 (Wireless Access Point)\n2. RADIUS 服务器\n3. 域控制器 (Domain controller)\n4.\
  \ 智能卡 (Smartcards)\n\n## 133. 下列哪些技术利用访问控制列表 (ACLs) 来限制对网络资源的访问？（选择所有可能的）\n\n1.\
  \ NTFS\n2. LDAP\n3. WAP\n4. Kerberos\n\n## 134. Alice 是你办公室工作的一位顾问，她获得了公司主网络的安全集标识符\
  \ (SSID) 和密码，但她无法用笔记本电脑连接。以下哪种安全措施可能阻止她连接？\n\n1. MAC 过滤 (MAC filtering)\n2. 禁用 SSID\
  \ 广播\n3. 地理围栏 (Geencing)\n4. 使用 WPA2\n5. 访客网络隔离 (Guest network isolation)\n\n##\
  \ 135. 在无线网络上，以下哪项是对门户 (captive portal) 示例的最佳描述？\n\n1. 用于连接到其他交换机的交换机端口\n2. 用户在获得网络访问之前必须与之交互的网页\n\
  3. 一系列扇门，人们在进入安全区域之前必须通过这些门\n4. 一个声明用户计算机已锁定且只有在支付费用后才会解锁的网页\n\n## 136. 一位试图连接到咖啡馆\
