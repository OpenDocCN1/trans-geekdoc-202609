  4. 它们使用不同形式的幅度调制。\n\n### 61. 以下哪些协议使用隧道技术在 TCP/IP 系统之间建立安全链接？（选择所有适用项）\n\n1. `2TP`\n\
  2. `IPSec`\n3. `MGRE`\n4. `NAT`\n\n### 62. 你的主管给了你一个 C 类网络 IP 地址，并要求你创建一个具有 8 个子网且每个子网\
  \ 30 个主机的网络。你必须使用哪一个子网掩码？\n\n1. 255.255.255.128\n2. 255.255.255.192\n3. 255.255.255.224\n\
  4. 255.255.255.240\n5. 255.255.255.248\n6. 255.255.255.252\n\n### 63. 你是在客户现场工作的顾问。客户为你提供了公司无线网络的服务集标识符（SSID）和密码，以便你用笔记本电脑连接。然而，你无法建立连接。以下哪种安全措施可能阻止你的笔记本连接网络？\n\
