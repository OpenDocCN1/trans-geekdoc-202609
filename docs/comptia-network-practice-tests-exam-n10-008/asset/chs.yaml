  \n70. 下列哪种交换机类型在将帧转发到通往目标系统的端口之前，会对整个帧的内容进行循环冗余校验（CRC）？\n\n1. 封包过滤（Packet filtering）\n\
  2. 直通式（Cut-through）\n3. 源路由（Source route）\n4. 存储并转发（Store-and-forward）\n\n71. 下列哪种攻击类型并非专门针对无线网络客户端？\n\
  \n1. 逻辑炸弹（Logic bomb）\n2. 取消认证（Deauthentication）\n3. 恶性孪生（Evil twin）\n4. 汽车搜索（War\
  \ driving）\n\n72. 你在一个新的办公大楼中使用 `IEEE 802.11b/g` 设备安装无线局域网（WLAN）。无线设备很难连接到接入点，而且即使连接上，速度也很低。当你使用\
