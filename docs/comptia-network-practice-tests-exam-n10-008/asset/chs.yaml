  \n1. 事件响应\n2. 身份管理\n3. 资产管理\n4. 数据泄露防护\n\n51. 虚拟专用网络（VPN）使用称为隧道的数据传输技术，该技术将数据包封装在另一个数据包内部以通过网络连接（通常使用\
  \ Internet）进行传输。系统还会对整个封装的数据包进行加密以保护。分拆隧道（Split tunneling）是这种方法的变体，提供以下哪些优势？选择所有适用项。）\n\
  \n1. 额外的数据完整性保护\n2. 连接到 VPN 时访问本地网络设备\n3. 通过多路复用加速数据传输\n4. 节省 VPN 带宽\n\n52. 你的主管希望你禁用网络交换机上所有未使用的端口。你告诉她没有必要，她想知道你为什么这么认为。以下哪些项是不禁用未使用交换机端口的有效理由？（选择所有适用项。）\n\
  \n1. 未使用的端口没有跳线到墙上插座。\n2. 数据中心已经防止了未经授权的访问。\n3. 交换机配置为使用基于 MAC 的 ACL。\n4. 保持某些端口开启状态有利于新用户的\
  \ `on-boarding`（入职）。\n\n53. 尽管对网络实施了密码策略，强制用户频繁更改密码、创建特定长度的密码并使用复杂密码，但你仍然收到了几个账户入侵的报告。在调查这些事件后，你确定受害者显然共享过一个“提示”，该提示建议用户在强制创建新密码时循环使用孩子、侄子、侄女、外甥和其他亲属的名字，并根据需要将字母改为数字。你可以采取哪些措施可以补救局面而不会产生更大的问题？\n\
  \n1. 修改密码策略以强制用户更频繁地更改密码。\n2. 将最小密码有效期策略更改为较大的值。\n3. 分发一份不安全的常用密码列表，例如基于名称、出生日期等的密码。\n\
  4. 为用户分配由随机生成的字符组成的长密码，并经常更换它们。\n\n54. 以下哪些网络设备可以使用访问控制列表（ACL）来限制访问？（选择所有适用项。）\n\
  \n1. 路由器\n2. 服务器\n3. 交换机\n4. 集线器\n5. 无线接入点\n\n55. 以下哪个术语用于描述这种威胁缓解技术：将单个应用程序和服务部署在单独的虚拟服务器上，以便在任何时候最多只有一个面临危险，而不是将多个应用程序部署在单个服务器上？\n\
  \n1. 网络分\n2. 地理围栏\n3. VLAN 跳跃\n4. 角色分离\n\n56. 关于动态主机配置协议（DHCP）旁探，以下陈述哪些是正确的？（选择所有适用项。）\n\
  \n1. DHCP snooping 在网络交换机中实现。\n2. DHCP snooping 防止 DNS 缓存中毒。\n3. DHCP snooping 检测恶意的\
  \ DHCP 服务器。\n4. DHCP snooping 丢弃从错误端口到达的 DHCP 消息。\n\n57. 一用户报告她无法连接到服务器。你想确定问题的范围，因此你尝试在另一台计算机上重现它。问题仍然存在。没有其他用户报告该问题。你应该执行的下一个逻辑步骤是什么？\n\
  \n1. 检查交换机的配置。\n2. 验证本地路由器正在转发。\n3. 确认客户端连接的交换机。\n4. 在另一个网段执行相同的任务。\n\n58. 在无线网络上，以下哪项最能描述强制门户（captive\
  \ portal）？\n\n1. 显示数据已锁定的 Web 页面\n2. 一系列带有气锁的门，人们必须通过它们\n3. 用于连接到其他设备的专用交换机端口\n\
  4. 用户必须与之交互的 Web 页面\n\n59. 在标准故障排除方法中，你首先采取步骤识别问题。完成之后，你应该下一个执行以下哪个步骤？\n\n1. 验证完整功能\n\
  2. 建立可能的原因理论\n3. 制定行动计划\n4. 实施解决方案\n\n60. 超文本传输协议的安全版本（HTTPS）使用与非安全版本（HTTP）不同的已知端口。以下哪些端口默认被\
