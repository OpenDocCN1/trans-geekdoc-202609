  \ 网络上存在恶性 DHCP 服务器。\n3. 工作站未配置使用 DHCP。\n4. 由 DHCP 服务器分配的 IP 地址已过期。\n\n### 179. Ralph\
  \ 负责公司购买的新大楼的网络安装，他选择安装第 6 类 (`Cat 6`) 非屏蔽双绞线 (`UTP`) 电缆。公司总裁询问他，是否可以使用电缆中的两对线来运行千兆以太网络，同时将另外两对线用于电话连接。Ralph\
  \ 不确定，因此使用仅连接了两对线建立了一个实验室网络。当他将计算机连接到交换机并开启时，标记为 1000 的发光二极管（LED）亮起，表示已建立千兆以太连接。Ralph\
  \ 想到通过同一根电缆同时传输电话和数据可以为公司节省多少钱而感到兴奋。然而，当 LED 亮起时，他似乎无法通过测试网络连接到另一个系统。以下哪项描述了他必须做什么来解决这个问题？\n\
  \n1. Ralph 必须手动配置网络适配器使用千兆以太网，而不是让它们自动协商。\n2. Ralph 用于千兆以太网连接的线对不对。他必须重新接线。\n3.\
  \ Ralph 在实验室网络中使用了错误的接线标准。他必须使用 `T568A`。\n4. 所有四对线才能建立千兆以太网连接。\n\n\n\n\n\n### 180\n\
  Ed 正在检查他网络中新安装的一些千兆以太网系统的线缆。观察配线架连接，他发现它们使用的是 `T568B` 接线标准进行布线的。然而，当他检查墙壁面板连接时，发现它们使用的是\
  \ `T568A` 标准布线。Ed 解决此问题的最佳方法是什么？\n\n1. 联系承包商，让所有墙壁面板连接器都使用 `T568B` 标准重新布线。\n2. 为配线架和交换机之间的所有连接购买交叉跳线线。\n\
  3. 配置交换机，使所有连接到配线架的端口不使用交叉电路。\n4. 什么都不做。线缆目前可以正常工作。\n\n### 181\nRalph 有两台电脑，他很久通过将以太网电缆的两端插入每台机器将它们连接在一起。他最近在旧货市场买了一个旧的以太网集线器，想用它来扩展他的网络。集线器有四个编号端口和一个标记为\
  \ `X` 的第五个端口。Ralph 使用现有的电缆将一台电脑插入 `port 1`，并买了一根新电缆将另一台电脑插入 `port 4`。然而，两台电脑无法通信。以下哪些解决方案不能他的电脑通信？\n\
  \n1. 将 `port 4` 的电缆移动到 `port 2`\n2. 用第二个新电缆替换旧电缆\n3. 将带有旧电缆的电脑插入 `X` 端口\n4. 将带有新电缆的电脑插入\
  \ `X` 端口\n\n### 182\nRalph 最近在旧货市场买了一个旧的以太网集线器和一些双绞线，想用它们来建立家庭网络。他用电缆将两台电脑接入集线器，但发现电脑无法通信。然后他注意到集线器上的一个端口标记为\
  \ `X`。他尝试将其中一台电脑插入 `X` 端口，现在它们可以通信了。关于这种行为，以下哪个说法最可能是解释？\n\n1. 集线器有一个坏端口。\n2. 其中一根电缆是交叉线。\n\
  3. 两根电缆都是交叉线。\n4. `X` 端口为信号提供了额外的强度。\n\n### 183\nAlice 是一位顾问，被聘请将客户旧的 20 节点同轴以太网网络移动到新位置。她拆卸了所有的网络布线和其他组件，并将它们打包运输。在新站点，她安装了所有电脑，在每个网络适配器上插入\
  \ `T-connector` 并连接了电缆，让它们从一台电脑运行到另一台电脑以形成总线。当 Alice 完成后，她启动了电脑并测试了网络连接性。她发现连续的\
  \ 12 台电脑可以相互通信，另外 8 台可以相互通信，但这 12 台无法与那 8 台通信。她确保了所有的连接器都紧固锁紧，特别是第 12 台电脑上的，但问题仍然存在。以下哪个是该困难最可能的原因？\n\
  \n1. Alice 忘记在总线的两端对电脑进行终端。\n2. 第 12 台电脑上的一个连接器引脚弯曲了。\n3. Alice 忘记对网络进行接地。\n4. 第\
  \ 12 台电脑上的发送和接收引脚反接了。\n\n### 184\nEd 正在排除一些网络性能问题。在尝试了许多其他可能性后，他正在检查办公室吊顶内的双绞线布线。他发现某些电缆已经受损，显然是由于在该空间作业的电工造成的。在某些情况下，电缆外护沿长度裂裂，内部电内部的某些绝缘层也被刮掉了。以下哪些类型的故障可能是由这种损坏引起的？（选择所有适用项）\n\
  \n1. 断路\n2. 短路\n3. 分离对\n4. 线序颠倒\n\n### 185\n在双绞线网络中，以下哪种类型的干扰是通过电缆内部线对的扭绞设计防止的？\n\
  \n1. 串扰\n2. EMI（电磁干扰）\n3. 衰减\n4. 延迟\n\n### 186\nRalph 被要求制作一些新的跳线线，用于连接配线架端口到网络交换机。他被告诉配线架连接器都是使用\
  \ `T568A` 接线标准布线的。Ralph 在制作跳线线时，应该使用以下哪些说明？\n\n1. 两端都使用 `T568A`\n2. 两端都使用 `T567B`\n\
  3. 一端使用 `T568A`，另一端使用 `T568B`\n4. 使用任意一种标准，只要两端相同即可\n\n### 187\nEd 发现，在他一些新安装的双绞线布线中，安装人员在每端都剥离了近一英字的电缆外护，并在连接到连接器之前扭松了线对。由于线缆扭松，网络更有可能遇到哪些问题？\n\
  \n1. 抖动\n2. 衰减\n3. 串扰\n4. EMI（电磁干扰）\n\n### 188\nEd 是他小公司网络的管理员。一个用户给帮助热线打电话说她无法连接网络。在此之前从未遇到过任何连接问题，她说她的电脑没有发生任何变化。Ed\
  \ 去用户所在地进行调查，发现用户电脑交换机端口上的链路脉冲光二极管 (`LED`）没有亮。Ed 接下来应该做什么来隔离并修复问题？（选择所有适用项）\n\n\
  1. 验证电缆已牢固连接到交换机上\n2. 验证跳线线的引脚和配对是否正确\n3. 用已知良好的直通线替换现有的跳线线\n4. 用已知良好的交叉线替换现有的跳线线\n\
  \n### 189\nEd 正在检查由外部承包商最近在 reason 办公室安装的一些双绞线布线。观察连接器，他看到了多种接线组合。以下哪些接线法 Ed 必须重新布线，因为它们是错误的？（选择所有适用项）\n\
  \n1. `White/orange, orange, white/green, blue, white/blue, green, white/brown, brown`\n\
  2. `White/green, green, white/orange, blue, white/blue, orange, white/brown, brown`\n\
  3. `White/orange, orange, white/green, green, white/blue, blue, white/brown, brown`\n\
  4. `White/brown, white/green, white/orange, blue, white/blue, orange, green, brown`\n\
  \n### 190\n你有三个虚拟局域网 (`VLAN2`、`VLAN3` 和 `VLAN4`)，每个 VLAN 都在三个交换机上实现。单个路由器在 VLAN\
  \ 之间提供路由。连接到公共交换机的所有 `VLAN2` 用户都在抱怨他们无法访问所属 VLAN 内的其他主机，也无法访问 `VLAN3` 和 `VLAN4`。在今天之前，他们可以无问题地连接本地和远程资源。服务中断的最可能的原因是什么？\n\
  \n1. 路由器故障，无法在 VLAN 之间进行路由。\n2. `VLAN2` 配置错误。\n3. 连接 `VLAN2` 用户的公共交换机未正常工作。\n4.\
  \ `VLAN3` 和 `VLAN4` 配置错误。\n\n\n\n\n\n# 191.\nAlice 正在维护一个网络，该网络由四个内部局域网（LAN）组成，每个\
  \ LAN 有 50 个用户。每个内部 LAN 使用双绞千兆以太网链路将用户连接到交换机。四台交换机中的每一台都连接到一个骨干路由器。所有路由器都连接到同一个骨干网络，该网络上还有一个额外的路由器，用于通过\
  \ T-1 链路将公司网络连接到互联网。其中一个内部 LAN 的用户抱怨说，当他们今天早上上班时，他们无法访问互联网也无法访问其他内部 LAN，尽管他们无问题地访问本地资源。在这种情况下，哪种网络组件最可能是问题的根源？\n\
  \n1. 连接问题 LAN 到骨干网的路由器\n2. 互联网路由器\n3.问题 LAN 上的交换机\n4. 骨干网络上的电缆\n\n# 192.\nAlice\
  \ 正在检查一个捕获的网络流量样本，以供未来参考创建网络性能基准。她注意到样本中包含大量的组播流量，但她不知道为什么。经过一些调查，她了解到网络上存在以组播形式传输的视频流量，但这些流量仅针对特定组的用户，而不是所有人。然而，由于组播流量正在泛洪网络，所有主机都必须处理数据包，这可能导致性能下降甚至拒绝服务攻击（DoS）。Alice\
  \ 可以使用以下哪项防止流量被非预期的主机处理？\n\n1. 非对称路由\n2. 流量控制\n3. 多路复\n4. IGMP 嗅探\n\n# 193.\nAlice\
  \ 正在维护一个网络，该网络由四个内部局域网（LAN）组成，每个 LAN 有 50 个用户。每个内部 LAN 使用双绞千兆以太网链路将用户连接到交换机。四台交换机中的每一台都连接到一个骨干路由器。所有路由器都连接到同一个骨干网络，该网络上还有一个额外的路由器，用于将公司网络连接到互联网。所有内部\
  \ LAN 的用户都在抱怨说，当他们今天早上上班时，他们无法访问互联网，尽管他们无问题地访问所有 LAN 上的资源。在这种情况下，哪种网络组件最可能是问题的根源？\n\
  \n1. 连接问题 LAN 到骨干网的路由器\n2. 互联网路由器\n3.问题 LAN 上的交换机\n4. 骨干网络上的电缆\n\n# 194.\nEd 正在他的公司网络上实施\
  \ Web 服务器集群，并安装了一个路由器以创建一个受保护子网（或边界网络），Web 服务器将位于该子网中。然而，Ed 现在无法从他内部网络上的工作站访问 Web\
  \ 服务器。在 Ed 能够从内部网络访问边界子网之前，他必须完成以下哪些任务？（选择所有适用）\n\n1. 修改 IP 地址\n2. 修改默认网关地址\n3.\
  \ 更新 DNS 记录\n4. 修改 MAC 地址\n\n# 195.\nRalph 有一个有线家庭网络，拥有三台 Windows 电脑、一台交换机和一个提供互联网访问的电缆调制调器/路由器。其中一台电脑可以连接另外两台，但无法连接到互联网。为了解决这个问题，Ralph\
  \ 最可能需要更改故障计算机上的以下哪一个配置参数？\n\n1. IP 地址\n2. 子网掩码\n3. 默认网关\n4. MAC 地址\n\n# 196.\n\
  Ralph 是一个网络管理员，尝试使用他的工作站远程登录受保护子网（边界网络）上名为 `WebServ1` 的 Web 服务器。然而，远程桌面客户端软件无法与服务器建立连接。Ralph\
  \ 可以看到他本地网络和受保护子网上的所有电脑。他尝试使用 `ping` 工具测试 `WebServ1` 的传输控制协议/网协议（TCP/IP）功能，`ping`\
  \ 测试成功了。Ralph 然后拨打了同事 Ed 的电话，让他尝试相同的远程访问工具连接到 `WebServ1`。Ed 成功连接了。以下哪项可能是 Ralph\
  \ 所经历之问题的原因？\n\n1. 名称解析失败\n2. Web 服务器上无响应的服务\n3. Web 服务器上被阻塞的 TCP/UDP 端口\n4. Ralph\
  \ 工作站上错误的防火墙设置\n\n# 197.\n一个用户拨打公司 IT 帮助热电话，报告她在工作站上收到了一个错误消息。错误显示她的计算机的 IP 地址在网络上重复了。Ralph\
  \ 担心网络可能存在配置问题。他怀疑存在范围重叠的 DHCP 服务器，导致两个 DHCP 服务器为不同的客户端分配了相同的 IP 地址。他担心他们很快就会接到大量报告相同问题的电话。Alice\
  \ 安慰了 Ralph，告诉他这不可能是 DHCP 问题，而是两台电脑手动配置了相同的 IP。Alice 是如何知道的？\n\n1. 因为 Windows 电脑在接受\
  \ DHCP 服务器的地址之前会检查路由表\n2. 因为 DHCP 服务器使用 DNS 查询来检查重复的 IP 地址\n3. 因为 DHCP 客户端使用 ARP\
  \ 广播检查重复的 IP 地址\n4. 因为在给定的子网上只能有一个 DHCP 服务器\n\n# 198.\n用户 Ed 报告他的工作站出现间歇性流量中断。有时他能收到服务器的响应，有时不能。这似乎不是互联网问题，因为本地请求也会出现问题。在排除故障时，Ralph\
  \ 执行了一系列数据包捕获并分析了网络流量。他发现 Ed 工作站生成的所有请求消息都有响应，但在某些情况下，响应到了其他工作站。以下情况可能导致这种情况？\n\n\
  1. 重复 IP 地址\n2. 被阻塞的 TCP/UDP 端口\n3. 重复 MAC 地址\n4. 错误的主机防火墙设置\n5. 组播泛洪\n\n# 199.\n\
  一个用户给 Alice 打电话，报告她在访问本地服务器和互联网网站时遇到间歇性问题。Alice 可以立即排除以下哪些潜在问题？\n\n1. 重复介质控制（MAC）地址\n\
  2. 重复网协议（IP）地址\n3. 故障的路由器\n4. 故障的域名系统（DNS）服务器\n\n# 200.\nAdatum Corp. 的整个网络都无法访问互联网。整个网络中的所有用户都在抱怨他们的浏览器显示域名系统（DNS）失败消息。该公司没有没有内部网络管理员，所以他们拨打了\
  \ Ralph 所在的咨询公司的电话。在 Ralph 尝试确定故障位置时，他应该首先问以下哪一个问题？\n\n1. 用户运行的是什么浏览器？\n2. DNS 服务器位于哪里？\n\
  3. 使用什么技术访问互联网？\n4. 用户尝试访问哪些网站？\n\n\n\n\n\n## 201\n为了节省公司费用并为新入员工提供千兆以太网连接，Ralph\
  \ 安装了一些新的 5e 类（Cat 5e）电缆线路，将公司的数据中心与位于大远端的一处新租办公室连接起来。然而，新用户抱怨有间歇性连接问题。公司聘请了一位布线承包商进行调查，对方的诊断是衰减。以下哪项最可能是解决该问题的可靠方案？\n\
  \n1. 使用 `Category 6` 电缆重新拉线这些线路\n2. 缩短电缆线路\n3. 配置硬件以较低的速度运行\n4. 在工作站中安装高端网络适配器\n\
  \n## 202\n自从公司搬进新大楼，Alice 的网络一直经历间歇性的服务缓慢和中断。她尝试了所有能想到的故障排除程序，但未能确定原因。一个特别的用户希望自己是“铁杵磨槌有有时的”，每次遇到问题时都会给\
  \ Alice 打电话。一天，当 Alice 在数据中心工作时，她注意到每当她听到额外的嗡嗡声开始时，该用户就会给她打电话。在检查了走廊的门后，Alice 意识到放置她交换机的机架位于大楼电梯机械房旁边。以下哪种情况可能导致网络通信问题？\n\
  \n1. `EMI`\n2. `NEXT`\n3. `FEXT`\n4. 衰减\n\n## 203\nRalph 正在为公司的新副总裁设置工作站。他已将电脑安装在副总裁的办公室里，并将数据线插入墙上面板。然后，在数据中心，他使用跳线线将配线架上的相应端口与网络交换机的一个端口连接起来。然而，计算机无法访问网络。其他用户没有投诉。以下哪项可能是问题的根源？（选择所有适用项。）\n\
  \n1. `DNS` 服务器发生故障。\n2. 交换机端口被禁用了。\n3. `NAT` 服务器未正常工作。\n4. 交换机配置为使用 `port security`。\n\
  \n## 204\nRalph 正在为一位新副总裁建立网络连接，该副总裁根据公司的自带设备（BYOD）策略提供了了自己的笔记本电脑。他将电脑插入墙上面板，链路脉冲发光二极管（LED）亮起。然后，在数据中心，他使用跳线线将配线架上的相应端口与网络交换机的一个端口连接起来。稍后，副总裁打电话给\
  \ Ralph，报告笔记本电脑与网络服务器之间的数据传输极其缓慢。以下哪项可以解释这一问题？\n\n1. 笔记本电脑与网络交换机之间存在双工不匹配。\n2. Ralph\
  \ 使用交叉线线将笔记本电脑连接到墙上面板。\n3. 交换机端口被禁用了。\n4. 笔记本电脑上的网络适配器驱动程序过旧。\n\n## 205\nAlice 在公司的数据中心工作时，注意到大多数网络交换机端口上的发光二极管（LEDs）显示为绿色的，但有些是橙色的。Alice\
  \ 询问了几个人为什么这样，每个人那里得到的回答都不同。以下哪一个答案是正确的？\n\n1. 橙色 `LEDs` 表示没有设备连接到交换机端口。\n2. 橙色\
  \ `LEDs` 表示连接的设备正经历过多的冲突。\n3. 橙色 `LEDs` 表示设备连接到交换机的速度相对较慢。\n4. 橙色 `LEDs` 表示连接的设备是其他交换机，而不是工作站。\n\
  \n## 206\nAlice 的公司正在开设一家新的分公司，Alice 负责为该办公室构建域控制器。她安装了一台新的 Windows 服务器并将其配置为域控制器，然后将其发送到新的办公室站点。然而，当它到达并连接到办公室网络后，域控制器无法与现有控制器同步。以下哪项可能是问题的原因？\n\
  \n1. 错误的时间\n2. 服务器硬件故障\n3. 重复 IP 地址\n4. 错误的默认网关地址\n\n## 207\nRalph 最近在跳蚤买了一个旧的 10Base-T\
  \ 以太网集线器，并想用它连接电脑。他将三台电脑接入集线器，发现其中两个电脑可以通信，但他最新的电脑无法连接网络。以下哪个任务最可能解决问题？\n\n1. 将集线器设置为\
  \ 10 Mbps\n2. 将集线器设置为 100 Mbps\n3. 将电脑适配器设置为 10 Mbps\n4. 将电脑适配器设置为 100 Mbps\n\n\
  ## 208\nAlice 正在排除用户无法连接本地应用程序服务器的问题。在使用 `ping` 工具测试连接性时，她发现可以使用计算机名称成功 ping 服务器，但\
  \ ping 完全限定域名（FQDN）却失败了。以下哪项可能是问题的根源？\n\n1. `DNS`\n2. `DHCP`\n3. `EMI`\n4. `ACL`\n\
  \n## 209\nAlice 在一个带有 Windows 命名服务（WINS）服务器、域名系统（DNS）服务器和路由器的网络上工作。一个用户抱怨他突然无法连接到其他网络，但他连接本地资源没有问题。Alice\
  \ 询问用户电脑是否有任何变化，发现他最近更改了一些网协议（IP）参数。Alice 接下来应该做什么？\n\n1. 验证路由器配置正确\n2. 验证 `WINS`\
  \ 服务器配置正确\n3. 验证 `DNS` 服务器配置正确\n4. 验证用户的配置设置是否正确\n\n## 210\nRalph 开始接到用户报告无法访问本地网络或互联网的电话。Ralph\
  \ 检查了他们的电脑，发现有问题的用户的 IP 地址都在 `169.254.0.0/16` 网络，而这不是 Ralph 网络所使用的地址。以下哪项可能是问题的原因？\n\
  \n1. 用户尝试修改他们的 IP 配置设置。\n2. 网络中某处存在恶意的 `DHCP` 服务器。\n3. `DHCP` 服务器分配的 IP 地址租约已过期。\n\
  4. 用户的工作站感染了某种形式的恶意软件。\n\n## 211\nRalph 自己安装了一条新的 5e 类（Cat 5e）电缆线路。他在电缆的两端都安装了接线器，将办公室侧的连接器安装在墙上面板，并将数据中心的连接器安装在配线架中。然后他用一根跳线将配线端口连接到交换机的一个空端口。然而，交换机端口上的发光二极管（LED）没有亮。Ralph\
