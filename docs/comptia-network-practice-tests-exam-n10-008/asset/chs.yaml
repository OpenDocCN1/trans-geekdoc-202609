  1. NAT 路由器\n2. RADIUS 服务器\n3. 代理服务器\n4. UTM 设备\n\n### 61. HVAC 系统可以使用物联网（IoT）监控以下哪些？（选择所有适用项）\n\
  1. 温度\n2. 压力\n3. 湿度\n4. 打印机\n5. 占用情况\n6. 摄像头\n7. 门锁\n\n### 62. VPN 终端是以下哪个设备的类型类型？\n\
  1. 交换机\n2. 路由器\n3. 网关\n4. 桥\n\n### 63. 下哪些技术通常与虚拟 PBX 服务相关？\n1. 服务质量 (QoS)\n2. IP\
  \ 语音\n3. CARP\n4. 轮询 DNS\n\n### 64. 500 节点私有内部网络的管理员 Ralph 正在制定连接网络到互联网的计划。项目的主要目标是为所有网络用户提供访问\
  \ Web 和电子邮件的服务，同时保护计算机免受互联网未经授权用户的攻击。项目的次要目标是避免为每台计算机单独配置 IP 地址，并提供一种监控和管理用户访问互联网的手段。Ralph\
  \ 提交了一份建议，要求对计算机使用私有 IP 地址，并使用具有公共注册 IP 地址的代理服务器通过多条 T-1 线连接互联网。关于 Ralph 建议的互联网访问方案，下列哪种描述是正确的？\n\
