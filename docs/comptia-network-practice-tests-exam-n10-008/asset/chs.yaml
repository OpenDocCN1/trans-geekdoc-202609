  \ (Static)\n\n### 248. 下哪种技术能够将动态主机配置协议 (DHCP) 服务器分配给客户端的 IP 地址自动添加到 DNS 命名空间中？\n\
  1. `反向名称解析` (Reverse name resolution)\n2. `动态 DNS` (Dynamic DNS)\n3. `自动分配` (Automatic\
  \ allocation)\n4. `HOSTS`\n\n### 249. 下哪项是集成 DHCP 和 DNS 的工具，使两者都能感知对方引起的变化？\n1.\
  \ `HOSTS`\n2. `DHCPv6`\n3. `IPAM` (IP 地址管理)\n4. `APIPA`\n\n### 250. 下哪个术语用于描述网络时间协议\
