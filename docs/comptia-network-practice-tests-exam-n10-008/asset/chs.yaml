  \ `ping` 工具并配合 DNS 服务器的 IP 地址。`ping` 测试成功，表明服务器已开启并正常运行。下列哪些项是该问题的可能原因？（选择所有适用项。）\n\
  \n1. 你的计算机上的 `TCP/IP` 主机设置配置不当。\n2. 连接网络的路由器没有运行 DNS，且不会转发此类数据报文。\n3. 有一个防火墙阻止了\
  \ DNS 服务器的 `UDP` 端口 `53`。\n4. 远程服务器上的 `DNS` 进程未运行。\n5. DNS 服务器上的 `TCP/IP` 主机设置配置不当。\n\
