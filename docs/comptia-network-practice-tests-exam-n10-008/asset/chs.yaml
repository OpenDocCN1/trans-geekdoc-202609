  \    3. 有具有网络层功能的交换机，但没有具有该能力的集线器。\n    4. 交换机为每个设备创建一个单独广播域，而集线器为所有设备创建一个单一广播域。\n\
  \n18. 下列哪些问题是生成树协议（STP）旨在防止的？（多选）\n    1. 广播风暴\n    2. 晚冲突\n    3. 桥环路\n    4. 串扰\n\
