  \n\n\n\n\n## 212\n一个用户给帮助台的 Ed 打电，报告他的电脑显示“重复 IP 地址”（Duplicate IP Address）错误信息。这让\
  \ Ed 很困惑，因为所有的网络工作站都应该配置为从动态主机配置协议（DHCP）服务器获取互联网协议（IP）地址。Ed 询问用户最近是否更改过计算机上的传输控制协议/网协议（TCP/IP）设置。用户说没有。Ed\
  \ 接着问是否还有其他人使用该工作站。用户说没有。然而，当 Ed 在用户的工作站上运行 `ipconfig /all` 命令时，发现 DHCP 启用（DHCP\
  \ Enabled）设置为“否”（No）。Ed 下一步应该做什么？\n\n1. 指责用户更改了 TCP/IP 设置并对此撒谎\n2. 在工作站上启用 DHCP\
  \ 客户端并关闭故障工单\n3. 开始调查网络上存在非法 DHCP 服务器的可能性\n4. 将工作站上的 IP 地址更改为一个尚未被使用的地址\n\n## 213\n\
  Ralph 正在使用一个非对称数字用户线路（ADSL）路由器，该路由器带有一个包含四个以太网端口的交换模块，所有端口都分配给默认的 VLAN1。Ralph 可以将笔记本电脑插入路由器的其中一个端口并顺利地访问互联网。Ralph\
