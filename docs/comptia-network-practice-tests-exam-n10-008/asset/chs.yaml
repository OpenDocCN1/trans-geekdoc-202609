  ```\nroute add 192.168.99.0 MASK 255.255.255.0 192.168.99.1\n```\n1. `192.168.99.0`\
  \ 是工作站。\n2. `192.168.99.1` 是边界网络。\n3. `192.168.99.0` 是路由器的接口。\n4. `192.168.99.1`\
  \ 是 Web 服务器。\n\n132. 下述哪个扫描针对多台计算机的开放传输控制协议 (TCP) 端口或数据报协议 (UDP) 端口？\n1. 端口扫描\n\
  2. 战争驱动\n3. 端口扫射\n4. 蓝击\n\n133. 关于协议分析器的下述哪个陈述是不正确的？\n1. 使用协议分析器必须熟悉 OSI 模型及其层。\n\
  2. 协议分析器存在安全风险。\n3. 某些网络监控产品也是嗅探器。\n4. 所有 Windows 操作系统都包含协议分析器。\n\n134. 下列哪些工具可以分类为端口扫描器？（选择所有适用）\n\
