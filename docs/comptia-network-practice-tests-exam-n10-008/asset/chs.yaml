  2. `Operational`（运行平面）\n3. `Control`（控制平面）\n4. `Management`（管理平面）\n5. `Infrastructure`（基础设施平面）\n\
  6. `Application`（应用平面）\n\n## 281. Ralph 正在为他公司的新分支机构设计数据中心。他正在考虑各种方案，包括在分支机构设施建立新的数据中心、使用托管数据中心（colocated\
  \ datacenter），以及使用公共云提供商创建虚拟数据中心。关于这些选项之间的差异，以下哪些说法是正确的？（选择所有适用）\n\n1. 托管数据中心的实现成本可能比分支机构或公云数据中心更低。\n\
  2. 在分支机构或托管数据中心中，Ralph 的公司将拥有硬件。\n3. 在所有三个数据中心选项中，Ralph 公司的管理员都负责设置和管理硬件。\n4. 在分支机构或托管数据中心中，Ralph\
  \ 的公司将负责一切。\n5. 公共云数据中心具有更高的安全性。\n6. 公共云数据中心更容易扩展。\n\n## 282. 下列哪个服务模型允许你执行自己选择的安装？\n\
  \n1. `IaaS`（基础设施即服务）\n2. `PaaS`（平台即服务）\n3. `SaaS`（软件即服务）\n4. `DaaS`（桌面即服务）\n\n##\
  \ 283. 当你与供应商签订合同为你的公司获取公云服务时，你使用的是以下哪个模型？\n\n1. `IaaS`\n2. `PaaS`\n3. `SaaS`\n\
  4. `DaaS`\n5. 以上都不是\n\n## 284. 下列哪个云模型为消费者提供了最大的控制权？\n\n1. `IaaS`\n2. `PaaS`\n3.\
  \ `SaaS`\n4. `DaaS`\n\n## 285. Alice 刚刚使用云提供商创建了一个 Windows Server 2016 虚拟机。她使用的是下列哪些架构？（选择所有适用）\n\
  \n1. `IaaS`\n2. `PaaS`\n3. `SaaS`\n4. `公云`\n5. `私云`\n6. `混合云`\n\n## 286. 在下列哪个模型中，单一组织可以既是云的提供者又是消费者？\n\
  \n1. `公云`\n2. `私云`\n3. `混合云`\n\n## 287. Ed 是公司数据中心的经理，负责私有和公共资源。由于流量激增，网站不堪重负，因此他在公云中配置了一些虚拟机来缓解压力。下列哪个术语描述\
