  4. LPR 服务器\n\n### 244. 动态主机配置协议 (DHCP) 客户端依赖于哪种类型的传输来定位并联系本地网络上的 DHCP 服务器？\n\n1.\
  \ 单播\n2. 广播\n3. 多组播\n4. 任任播\n\n### 245. 下列种域名系统 (DNS) 资源记录类型指定特定区域的权威 DNS 服务器的 IP\
  \ 地址？\n\n1. `NS`\n2. `PTR`\n3. `MX`\n4. `SRV`\n5. `SOA`\n6. `TXT`\n\n\n\n\n\n###\
  \ 246. 如果你想让 DHCP 服务器始终为特定计算机分配相同的 IP 地址，你必须在服务器上创建以下哪一项？\n1. `排除` (Exclusion)\n\
  2. `范围` (Scope)\n3. `预留` (Reservation)\n4. `中继` (Relay)\n\n### 247. 下哪个 DHCP 地址分配方法允许服务器在客户端不再使用\
