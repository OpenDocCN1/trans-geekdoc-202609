  \ DoS 攻击是指攻击者实际上破坏了目标系统并阻止其正常运行。\n\n## 63. 暴力破解、社会工程与钓鱼\n\n暴力破解攻击是指攻击者通过反复猜测来寻找密码、开放端口或其他类型的敏感数据。拒绝服务（`DoS`）攻击通过向目标服务器发送大量流量，使其无法正常工作。虽然这两种攻击类型可以使用专用软件发起，但也可以是单个攻击者仅使用标准工作站提供的工具完成的。社会工程学是通过联系用户并伪装成对该数据有合法需求的人来获取敏感数据的实践。它只需要电话或电子邮件客户端。钓鱼是指使用虚假电子邮件或网站旨在让用户感染某种恶意软件的攻击术语。\n\
  \n## 64. 取消认证、邪恶双孪生与 ARP 投毒\n\n取消认证是一种拒绝服务（`DoS`）攻击类型，攻击者通过发送取消认证帧来针对无线客户端，导致客户端断开网络连接。攻击的目标通常是迫使客户端连接到被称为邪恶双孪生”（evil\
  \ twin）的伪造访问点。邪恶双孪生是无线网络上的欺骗访问点，模仿合法访问点的 set 标识符（`SSID`），旨在诱骗用户。逻辑炸是插入合法软件产品中的代码，在满足特定条件时触发恶意事件。地址解析协议（`ARP`）投毒故意向存储在计算机和交换机上的\
  \ `ARP` 缓存中插入虚假信息。最后这两者都不是专门针对无线客户端的。\n\n## 65. 社会工程学防御\n\n社会工程学是通过联系用户并伪装成对该数据有合法需求的人来获取敏感数据的实践。没有任何软件或硬件解决方案可以防止它；唯一的办法是教育用户潜在的危险，并建立政策，告知用户在遇到社会工程学尝试时应该如何做。社会工程学不是病毒或其他形式的恶意软件，因此防病毒软件对其无效。社会工程学并未实现在网络流量中，因此防火墙无法过滤它。社会工程学并未实现在网络流量中，因此\
  \ `IPSec` 无法保护它。\n\n## 66. 反射与分布式攻击详情\n\n反射型和分布式 DoS 攻击利用其他计算机向目标泛洪流量。反射型 DoS 攻击是指攻击者向互联网上的合法服务器（例如\
  \ `DNS` 服务器）发送包含目标服务器 IP 地址的请求，导致这些服务器向目标发送大量响应。分布式拒绝服务（`DDoS`）攻击是指攻击者使用成百上千台计算机组成的僵尸网络（这些计算机由恶意软件控制，被称为机器人或僵尸），向单个服务器或网站发送流量，试图使其过载并防止其正常运行。放大型\
