  \n\n\n\n\n### 138. 物联网 (IoT) 涵盖了大量的设备类型，从个人电子设备到家用电器，再到医疗设备和工业机械。这些设备中的许多处理敏感信息，并且许多执行着至关重要的任务。IoT\
  \ 安全领域仍处于起步阶段；还没有定义 IoT 保护协议的全面标准。IoT 设备的安全需求截然不同，功能能力也大不相同，这使得为所有设备创建一个通用的保护机制变得困难。以下哪些方法可能是保护所有\
  \ IoT 设备免受攻击可行的方法？（选择所有适用项）\n\n1. 网络分段\n2. 网络访问控制 (NAC)\n3. 安全网关\n4. 防火墙\n\n###\
