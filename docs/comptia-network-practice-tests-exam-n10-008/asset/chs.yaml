  \n## 107\nB. `ipconfig` 命令仅在 Windows 上运行，尽管有一个类似的 Unix 或 Linux 专用命令 `ifconfig` 。\n\
  \n## 108\nB, D. Linux 和 Cisco IOS 操作系统都有 `traceroute` 实用程序。Windows 拥有该工具的版本，但它被称为\
  \ `tracert` 。\n\n\n\n\n\n### 110. B\n`netstat -s` 命令显示 IPv6、IPv4、ICMP、TCP 和 `UDP`\
  \ 协议的数据包计数和其他流量统计数据。`netstat -a` 命令显示工作站当前的所有连接及其正在监听的端口。`netstat -e` 命令显示以太网统计，例如发送和接收的字节数和数据包数。`netstat\
  \ -r` 命令显示计算机的路由表。\n\n### 111. A\n在 Windows 工作站上带有 `-e` 参数运行 `netstat` 会显示以太网统计，包括工作站发送和接收的字节数和数据包数。`ipconfig`\
  \ 命令显示传输控制协议/网协议 (`TCP/IP`) 配置数据；它不显示网络流量统计数据。`tcpdump` 和 `iptables` 命令均仅在 Unix\
  \ 和 Linux 工作站运行。\n\n### 112. A, B, D\nWindows、Linux 和 Cisco IOS 操作系统均包含 `ping` 实用程序。CSU/DSU\
  \ 无法运行 `ping` 命令。\n\n### 113. B\n网协议 (IP) 地址 `127.0.0.1` 是专用的环回地址，它将发出的 IP 流量直接重入传入的\
  \ IP 流量缓冲区。使用该地址进行成功的 ping 测试表明计算机的传输控制协议/网协议 (`TCP/IP`) 栈运行正常，但流量从未到达网络适配器或网络，因此该测试无法确认适配器运行正常或计算机是否为网络拥有正确的\
  \ IP 地址。\n\n### 114. B, C\n网协议 (IP) 地址 `127.0.0.1` 是专用的环回地址，它将发出的 IP 流量直接重入传入的 IP\
  \ 流量缓冲区。主机名 `localhost` 在每个 `TCP/IP` 系统上都解析为 `127.0.0.1` 地址。因此，Ed 可以 ping 主机名或 IP\
  \ 地址来测试其 `TCP/IP` 栈是否可用。Loopback 不是环回地址的主机名，且 `127.0.0.0` 是网络地址而非主机地址，因此在在这种情况下无法工作。\n\
  \n### 115. B\n`ipconfig` 是一个 Windows 命令，显示计算机当前的 IP 地址和传输控制协议/网协议 (`TCP/IP`) 配置设置，包括计算机是否从\
  \ DHCP 服务器获取了地址。`ifconfig` 命令在 Unix 和 Linux 系统上显示相同的信息。`msinfo32` 是一个 Windows 程序，用于计算机硬件和软件配置的图形化显示，但不显示其\
  \ IP 地址和 `TCP/IP` 设置。Windows 中的 `tracert` 命令显示数据包通过互网络到达指定目的地的路径，但它不显示 DHCP 信息。\n\
  \n### 116. B, C, D\n当你不带任何开关选项运行 `netstat` 命令时，它显示计算机的活动连接。运行 `netstat -e` 显示计算机的接口统计数据。运行\
  \ `netstat -r` 显示路由表。没有显示计算机连接状态的 `netstat` 开关。\n\n### 117. B\n`route print` 命令同时显示\
  \ IPv4 和 IPv6 路由表。要仅显示 IPv6 路由表，需要在命令中添加 `-6` 参数。\n\n### 118. C\n在 Windows 工作站上带有\
  \ `-e` 参数运行 `netstat` 会显示以太网统计，包括工作站发送和接收的字节数和数据包数。`ipconfig` 命令显示传输控制协议/网协议 (`TCP/IP`)\
  \ 配置数据；它不显示网络流量统计数据。`tcpdump` 和 `iptables` 命令均仅在 Unix 和 Linux 工作站运行。\n\n### 119.\
  \ B\n`route print` 命令同时显示 IPv4 和 IPv6 路由表。要仅显示 IPv6 路由表，需要在命令中添加 `-6` 参数。\n\n###\
  \ 120. D\n当你不带任何开关选项运行 `netstat` 命令时，它显示计算机的活动连接。运行 `netstat -e` 显示计算机的接口统计数据。运行\
  \ `netstat -r` 显示路由表。没有显示计算机连接状态的 `netstat` 开关。\n\n### 121. B\n网协议 (IP) 地址 `127.0.0.1`\
  \ 是专用的环回地址，它将发出的 IP 流量直接重入传入的 IP 流量缓冲区。使用该地址进行成功的 ping 测试表明计算机的传输控制协议/网协议 (`TCP/IP`)\
  \ 栈运行正常，但流量从未到达网络适配器或网络，因此该测试无法确认适配器运行正常或计算机是否为网络拥有正确的 IP 地址。\n\n### 122. C\n网协议\
  \ (IP) 地址 `127.0.0.1` 是专用的环回地址，它将发出的 IP 流量直接重入传入的 IP 流量缓冲区。主机名 `localhost` 在每个 `TCP/IP`\
  \ 系统上都解析为 `127.0.0.1` 地址。因此，Ed 可以 ping 主机名或 IP 地址来测试其 `TCP/IP` 栈是否可用。Loopback 不是环回地址的主机名，且\
  \ `127.0.0.0` 是网络地址而非主机地址，因此在这种情况下无法工作。\n\n### 123. B\n`ipconfig` 是一个 Windows 命令，显示计算机当前的\
  \ IP 地址和传输控制协议/网协议 (`TCP/IP`) 配置设置，包括计算机是否从 DHCP 服务器获取了地址。`ifconfig` 命令在 Unix 和\
  \ Linux 系统上显示相同的信息。`msinfo32` 是一个 Windows 程序，用于计算机硬件和软件配置的图形化显示，但不显示其 IP 地址和 `TCP/IP`\
  \ 设置。Windows 中的 `tracert` 命令显示数据包通过互网络到达指定目的地的路径，但它不显示 DHCP 信息。\n\n\n\n\n\n### 130.\
  \ D. Windows `route add` 命令的正确语法是指定目标网络地址，紧接着是目标网络的子网掩码，然后是本地网络上提供对目标网络访问的路由器接口地址。其他选项在语法中没有指定正确的地址。\n\
  \n### 131. C. Windows `route add` 命令的正确语法是指定目标网络地址，紧接着是目标网络的子网掩码，然后是本地网络上提供对目标网络访问的路由器接口地址。因此，`192.168.87.226`\
  \ 是 Ralph 工作站所在内网的路由器接口地址。\n\n### 132. C. 端口扫描是用于识别单台计算机上的开放端口，而端口扫描（port sweeping）则是扫描多台计算机以寻找单个开放端口。无线网“钓车攻击”（War\
  \ driving）和蓝光攻击（bluejacking）是攻击无线网络的方法。\n\n### 133. D. 协议分析仪捕获数据帧并显示其内容，包括由开放系统互连（OSI）模型各层协议创建的头部字段。为了解释网络上计算机之间的交互，你必须熟悉这些协议及其工作原理。协议分析仪是经验丰富的网络管理员手中非常有用的工具，但它们也可以用于恶意目的，例如显示捕获数据包中未加密的密码和其他机密信息。分析仪与嗅探器（sniffers）的区别在于，分析仪会读取其捕获的数据包内部内容，解析单个数据单元，并显示与数据包创建相关的每个协议的信息；而嗅探器只寻找网络流量中的趋势和模式，而不检查每个数据包的内容。\n\
  \n### 134. A, B. `nmap` 是一个命令行实用，用于扫描范围 IP 地址，对发现的每个设备运行一系列脚本，并显示在每个设备上发现的开放端口列表。Nessus\
  \ 与 `nmap` 相似之处在于它也扫描范围 IP 地址以寻找开放端口，但随后会对这些端口发起攻击以确定其漏洞。网络监器（Network Monitor）是一个协议分析仪或数据包嗅探器，是一个捕获并分析网络流量样本的程序。它不是端口扫描器。性能监器（Performance\
  \ Monitor）是一个显示特定系统和网络性能指标统计数据的程序。它不是端口扫描器。\n\n### 135. B. `top` 工具用于显示 Unix/Linux\
  \ 系统上当前运行进程的性能信息。`netstat` 是一个允许你查看活动网络连接和传输控制协议/网协议（TCP/IP）流量统计数据的工具。它不测量系统性能。没有名为\
  \ `monitor` 或 `cpustat` 的 Unix 或 Linux 工具。\n\n### 136. B. 协议分析仪报告看到的总帧数与接收的帧数对比。如果设置了捕获过滤器，这两个值之间将存在差异。只有符合捕获标准的帧才会被分析仪接收并放入缓冲区以供稍后显示。只要符合捕获标准，协议分析仪就会将良好的帧和坏帧放入缓冲区。如果只将良好的帧放入缓冲区，那么将无法识别问题。\n\
  \n### 137. B. 端口扫描器检查系统是否存在可以使用传输控制协议（TCP）或用户数据报协议（UDP）访问的开放端点，入侵者理论上可以使用这些端点从网络访问系统。\n\
  \n### 138. B. 端口是一个带编号的服务端点，用于标识运行在传输控制协议/网协议（TCP/IP）系统上的应用程序。端口扫描器检查系统是否存在可以使用传输层上的\
  \ TCP 或用户数据报协议（UDP）访问的开放端点，入侵者理论上可以使用这些端点从网络访问系统。\n\n### 139. B. 端口扫描器检查的端口是通过传输控制协议（TCP）和用户数据报协议（UDP）头部中的端口号标识的系统端点。开放端口为运行的应用程序提供网络访问，这可能被入侵者利用。\n\
  \n### 140. C. 数据包分析仪能够查看 Telnet 生成的数据包内部，这可能包含明文密码。嗅探器分析流量模式，漏洞扫描器搜索开放端口，而简单文件传输协议（TFTP）服务器动态主机配置协议（DHCP）客户端。\n\
  \n### 141. A. 协议分析仪捕获数据包并显示其内容，包括应用负载。它们会显示网协议（IP）地址，但这不是重大的安全威胁。漏洞扫描器检测开放端口并对其发起攻击；分析仪无法做到这一点。\n\
  \n### 142. B. 微软评估与规划工具（MAP Toolkit）是一种免费应用程序，可对网络进行无代理清单，并利用信息创建报告，例如计算机是否准备好升级操作系统。Nessus、Nmap\
  \ 和微软基线安全分析（MBSA）都是包含漏洞扫描但具有其他能力的工具。\n\n### 143. D. 端口扫描是寻找可被攻击者利用的传输控制协议（TCP）和用户数据报协议（UDP）开放端口的过程，属于漏洞扫描的功能之一。网络映射、漏洞修复以及渗透测试（故意执行攻击的过程）不属于漏洞扫描技术。\n\
  \n### 144. A. 一旦帧进入缓冲区，Alice 可以配置显示过滤器来阻止不需要的帧显示。这不会从缓冲区中删除它们。由于捕获已经完成，不需要重新捕获。配置捕获过滤器无法满足要求，因为过滤器会将其他帧完全从缓冲区消除。分析仪缓冲区无法删除特定的帧。\n\
  \n### 145. A. 802.11b 标准规定的最大速度为 11 Mbps，因此 Ralph 除了购买新设备外无法做任何事情增加网络速度。\n\n###\
  \ 146. A, C, E. 无线局域网（WLAN）使用的 2.4 GHz 频段由宽度为 20（或 22）MHz 的通道组成。然而，信道间距仅为 5 MHz，因此存在信道重叠，会导致干扰。信道\
  \ 1、6 和 11 是彼此之间距离足够远以避免与相邻信道重叠的通道。信道 4 和 8 容易重叠。\n\n### 147. A. 为加密协议指定错误的密码是无法连接网络且无错误指示的最常见原因。天线放置不当和信道重叠可能导致信号弱或无信号，这些在“可用网络”列表中会有显示。只要\
  \ Ralph 从列表中选择了接入点，错误的服务集标识符（SSID）不太可能是错误所在。\n\n\n\n\n\n### 148. B, D, E.\n信道重叠、天线极化错误导致的弱信号以及天线电缆衰减导致的信号丢失都可能导致工作站无法与\
  \ `AP` 连接。错误的密码不是问题，除非 Ralph 已经看到了 `AP` 并尝试连接它。错误的服务集标识符 (`SSID`) 只有在 Ralph 尝试手动输入\
  \ `SSID` 的情况下才会成为问题。\n\n### 149. C.\n贴阵天线是以半球形模式传输信号的平板设备。通过将天线贴在建筑外墙，Ralph 可以为建筑内部提供覆盖，并最大限地减少延伸到外部的覆盖。偶极天线是通常随\
  \ `AP` 提供的全向天线的另一种名称。单向天线沿直线引导信号，这无法提供 Ralph 所的覆盖。`Yagi` 天线是单向天线的一种。\n\n### 150.\
  \ A, D.\n距离 `AP` 远或来自墙壁的干扰都会导致无线信号变弱，从而导致 Trixie 正在经历的间性连接。错误的服务集标识符 (`SSID`) 会阻止\
  \ Trixie 的笔记本连接到网络。全向天线在每个方向上产生信号，这无法解释 Trixie 的问题。\n\n### 151. B.\n可能是 `WAP` 被配置为不广播网络\
  \ `SSID` 作为安全措施，因此 Alice 应该首先尝试通过手动输入 `SSID` 来访问它。在连接到 `SSID` 之前，她无法输入 `WPA2` 密码。将笔记本电脑靠近\
  \ `WAP` 或远离可能的电磁干扰源可能是解决问题的方法，但这些不应该是 Alice 应该尝试的。\n\n### 152. D.\nAlice 问题最可能的原因是她选择了错误的加密协议。无线等效隐私\
  \ (`WEP`) 仍然在许多无线设备上作为选项提供，但它早已被发现是不安全的，几乎不再被使用。Alice 应该尝试选择其他允许她输入密码的安全类型，例如 WiFi\
  \ 保护访问二代 (`WPA2`)。虽然其他选项可能是问题的原因，但加密协议不匹配是最可能的原因。\n\n### 153. D.\n基于 `802.11a` 标准构建的无线局域网\
  \ (`WLAN`) 设备只能使用 `5 GHz` 频率。然而，`802.11g` `AP` 只能使用 `2.4 GHz` 频率。因此，网络适配器无法连接 Ralph\
  \ 的 `AP`。\n\n### 154. B.\n`802.11b` 和 `802.11g` 标准不支持 `5 GHz` 通信。将 `AP` 配置为支持 `2.4\
  \ GHz` 是 `802.11g` 连接到网络的唯一方法。`5 GHz` 段支持自动信道选择，因此不需要在每台笔记本电脑上手动配置信道。`5 GHz` 频支持\
  \ `MIMO`，`802.11n` 笔记本应该能够连接。将适配器替换为 `802.11g` 将阻止它们连接，因为该标准不支持 `5 GHz`。`5 GHz`\
  \ 频支持自动信道选择，因此不需要在每台笔记本电脑上手动配置信道。`5 GHz` 频支持 `MIMO`，`802.11n` 笔记本应该能够连接。将适配器替换为\
  \ `802.11g` 将阻止它们连接，因为该标准不支持 `5 GHz`。\n\n### 155. D.\n衰减是信号在通过网络介质传输时变弱的倾向。对于无线网络而言，介质是空气，无线设备离\
  \ `AP` 越远，信号就越弱。折射是信号在通过某些类型的障碍（如会议室的玻璃墙）时发生弯曲的现象。弯曲改变了信号的方向，可能导致其在此过程中变弱。反射是信号从某些表面（如金属）弹回现象。衍射是信号必须绕过障碍到达特定目的现象。\n\
  \n### 156. B.\n用户离 `AP` 越近，信号就越强。在靠近办公室的地方安装一个额外的 `AP` 可能会让信号通过。\n\n### 157. C.\n\
  禁用服务集标识符 (`SSID`) 广播无法击败攻击者。媒体访问控制 (`MAC`) 过滤将访问网络。\n\n\n\n\n\n### 163. D\n使用错误的无线安全协议是导致无连接失败的常见原因，因此检查此项最可能让\
  \ Ed 找到问题的源。信道重叠是 Ed 应该在接入点（AP）检查并解决的问题，而不是用户的工作站。`WAP` 上的频率无法更改，因为 `802.11g` 标准只支持\
  \ `2.4 GHz` 频率。虽然信号干扰理论上可能是连接失败的原因，但用户可以看到网络，所以这可能不是问题所在。\n\n### 164. A, B, C\n\
  将无线接入点（`WAP`）移动到建筑中心将尽可能让其工作范围保持在结构内部。如果信号仍然到达建筑外，Ed 可以降低 `WAP` 的功率水平，直到网络仅在内部可访问。禁用\
  \ SSID 广播无法击败专门的攻击者，但可以防止偶然的入侵者访问网络。`MAC` 过滤需要 Ed 在 `WAP` 上配置所有访问网络设备的 `MAC` 地址，这在这种情况下是不现实的。安装强制捕获门户（captive\
  \ portal）不会阻止外部用户，除非 Ed 将门户配置为需要用户身份验证，但这违背了访客网络的目的。\n\n### 165. B, C\nAlice 应该采取的第一步是最简单的：确保用户笔记本电脑上的无线接口已开启，并且她正尝试连接公司网络的正确\
  \ `SSID`。除非区域内的其他用户也因为干扰遇到问题，否则没有必要更改信道。`802.11n` 无线网络标准与 `802.11g` 兼容，因此不需要为用户提供新的网络适配器。\n\
  \n### 166. C\n如果用户由于其他类型设备的干扰而丢失连接，那么更改信道可以改变网络使用的频率，并使其能够避免干扰。其他选项不太可能影响导致用户掉连接的任何条件。\n\
  \n### 167. B, D\n在提供的选项中，最可能导致问题的是使用了错误的服务集标识符（`SSID`）或加密协议。虽然信号干扰可能是原因之一，但更有可能的是新用户的设备对\
  \ Ed 的网络的配置不当。信道重叠是 Ed 应该在接入点（`AP`）检查并解决的问题，而不是用户的工作站。\n\n### 168. D\n已发现 `WPA`\
  \ 存在漏洞，而 `WPA2` 设计旨在解决这些漏洞，因此 Ralph 应该使用 `WPA2` 代替 `WPA`。抑制 SSID 广播不会阻止用户连接网络，而\
  \ `MAC` 过滤在不使 `MAC` 地址暴露于不当风险的情况下增强安全性。\n\n### 169. C\n无线局域网（`WLANs`）使用的 `2.4 GHz`\
  \ 频段由宽度 `20`（或 `22 MHz`）的信道组成。然而，信道间距仅为 `5 MHz`，因此存在信道重叠，可能导致较长的 `AP` 关联时间并性能下降。信道\
  \ `1`、`6` 和 `11` 是唯一彼此足够远以避免与相邻信道重叠的信道。这就是为什么它们经常被推荐的原因。但在 Ralph 的情况下，这些信道太近了。`WLANs`\
  \ 使用的 `2.4 GHz` 频段由宽度 `20`（或 `22 MHz`）的信道组成。然而，信道间距仅为 `5 MHz`……（等等，根据文本重新对齐）：无线局域网（`WLANs`）使用的\
  \ `2.4 GHz` 频段由宽度 `20`（或 `22 MHz`）的信道组成。然而，信道间距仅为 `5 MHz`，因此存在信道重叠，可能导致较长的 `AP`\
  \ 关联时间并性能下降。\n\n### 170. B\n无线局域网（`WLANs`）使用的 `2.4 GHz` 频段有效等向性辐射功率（`EIRP`）是信号强度的测量。接收信号指示（`RSSI`）是信号测量。服务集标识符（`SSID`）是一种标识。多输入输出（`MIMO`）是一种技术。\n\
  \n### 171. C\n由于 Alice 能够访问互联网，网协议（`IP`）设置、子网掩码和默认网关应该是正确的。问题可能是配置 `DNS` 服务器。\n\n\
  ### 172. D\n问题可能是访问控制列表（`ACL`）设置错误。传输控制协议网协议（`TCP/IP`）设置应该是正确的。\n\n### 173. B\n\
  由于 Alice 能够访问互联网，问题与被封端口或防火墙设置无关。\n\n### 174. D\n工作站分配的 `169.254.203.42` 地址来自 `169.254.0.0/16`\
  \ 频段，该频段用于自动私有地址（`APIPA`），这是主机配置协议（`DHCP`）无法获取地址时分配网协议（`IP`）地址的标准。`127.0.0.1` 是标准的环回地址。`240.15.167.251`\
  \ 来自 `240.0.0.0` 频段，该频段留作实验用。`255.255.255.0` 完全不是 IP 地址；它是子网掩码。\n\n### 175. B\n\
  默认网关设置应包含本地网络上提供其他网络（如互联网）的路由器地址。因此在这种情况下，默认网关地址应该是 `192.168.4.0` 网络上的，但它包含一个 `192.18.6.0`\
  \ 网络上的地址，这并不是本地的。\n\n### 176. C\n工作站分配的 `169.254.203.42` 地址来自 `169.254.0.0/16` 频段，该频段用于自动私有地址（`APIPA`），这是主机配置协议（`DHCP`）无法获取地址时分配网协议（`IP`）地址的标准。由于没有其他人遇到问题，DHCP\
  \ 服务器应该是运行正常的。\n\n\n\n\n\n### 177. B\n对于连接到 `192.168.32.0/20` 网络的计算机，子网掩码值应该是 `255.255.240.0`，而不是\
  \ `255.255.255.0`，如 `ipconfig` 输出所示。IPv4 地址、默认网关和域名系统（DNS）服务器设置对于该网络是合适的。该工作站显然禁用了动态主机配置协议（DHCP），因此它没有从\
  \ DHCP 服务器获取适当互联网协议（IP）地址设置。\n\n### 178. B\n工作站上的动态主机配置协议（DHCP）客户端已启用，但分配给工作站的互联网协议（IP）地址并非来自\
  \ `192.168.4.0/24` 网络。分配的地址既不是自动私有 IP 地址分配（APIPA），也没有过期，因此唯一的结论是网络上存在一个非法 DHCP 服务器，它正在分配来自完全不同子网的地址。\n\
  \n### 179. D\n自动协商机制不是问题所在，引脚标准或 Ralph 的线对选择也不是。千兆以太网中的速度自动协商机制仅使用两对线，因此尽管发光二极管（LED）成功亮起，但功能千兆以太网数据连接需要所有四对线。\n\
  \n### 180. D\n电缆布传统上是“直通型”布线；即将一端的发送引脚连接到另一端的发送引脚。应该由交换机实现将发送引脚连接到接收引脚的交叉电路。在一端使用\
  \ `T568A` 另一端使用 `T568B` 布线的电缆布会在电缆中形成交叉电路。曾几何时，这会是一个严重的问题，但现在的交换机会根据需要自动配置交叉电路，因此它们会自动调整以适应电缆布。所有其他选项都可以解决此问题，但什么都不做无疑是最简单且最好的选择。\n\
  \n### 181. A\n问题不太可能是集线器端口故障或电缆损坏，因此将电缆从 4 端口移动到 2 端口将没有帮助。问题是两台计算机之间的交叉电路。这两个系统曾直接连接在一起，这意味着\
  \ Ralph 一直在使用交叉线。集线器也提供交叉电路（除 `X` 端口外），而且旧集线器通常不会自动协商交叉。因此，连接有两个交叉，等同于将发送引脚连接到发送引脚，而不是发送引脚连接到接收引脚。所有其他选项都能消除一个交叉电路，使计算机能够正确布线。\n\
  \n### 182. B\n旧的以太网集线器不会自动协商交叉。相反，它们有一个 `X`（或上行）端口，提供不带交叉电路的连接，因此可以将一个集线器连接到另一个集线器。如果两根电缆都是标准的直通以太网电缆或都是交叉线，那么将它们插入两个普通端口应该是可以工作的。由于将一根电缆插入\
  \ `X` 端口可以工作，这意味着两根电缆中必须有一个是交叉线。因此，问题在于电缆而不是端口。`X` 端口并不为信号提供额外的强度。\n\n### 183. B\n\
  第 12 台计算机连接中的其中一个引脚弯曲会导致总线断路，本质上形成两个独立运行的网络。网络未终端或接地不会产生这种故障。由于电缆架构 same，同轴连接上无法反转发送和接收引脚。\n\
  \n### 184. A, B\n开路是由电缆内部某处的导线断裂或一个或两个接头中的引脚连接不良引起的。短路是指一根线在电缆的一端连接到两个或多个引脚，或者两根或多根导线的导体在电缆内部相互接触。在这种情况下，电缆的损坏可能导致任何一种情况。分线（split\
  \ pair）是指两根线在电缆两端以完全相同的方式错误映射的连接。错对（transposed pairs）是一种故障，其中一对中的两个线在电缆的一端连接到了错误的引脚。这两种故障都是安装过程中布线不正确导致的，而不是由电缆损坏。\n\
  \n### 185. A\n串扰（Crosstalk）是铜基网络上的一种干扰，当在一个导体上传输的信号泄漏到另一个附近的导体上时发生。在一个护套内压缩八根或更多导体的双绞电缆对串扰尤为敏感。对每个独立的线对进行扭绞往往能将串扰减少到可以管理的水平。扭绞线对并不能防止信号受到电磁干扰（EMI）或衰减的影响。延迟（Latency）是测量信号从源到目的地所需的时间量。\n\
  \n### 186. D\n无论是 `T568A` 还是 `T568B` 引脚标准都可以。只要两端使用相同的引脚标准，跳线线就能正常工作。\n\n### 187.\
  \ C\n串扰是铜基网络上的一种干扰，当在一个导体上传输的信号泄漏到另一个附近的导体上时发生。在一个护套内压缩八根或更多导体的双绞电缆对串扰尤为敏感。对每个独立的线对进行扭绞往往能将串扰减少到可以管理的水平。未扭的对使它们更容易受到串扰。抖动（Jitter）、衰减和电磁干扰（EMI）都是影响有线网络性能的状况，但与未扭没有直接关系。\n\
  \n### 188. A, C\n在这种场景下，用户之前能够连接到网络。计算机没有发生硬件或软件更改。这些因素表明可能是物理层问题，例如电缆松动、电缆损坏、交换机端口故障或适配器故障。由于用户的电缆之前可以使用，没有必要验证其引脚和配对，且交叉线不用于连接工作站和交换机。Ed\
  \ 首先应该做的是检查所有电缆连接是否安全。如果他发现电缆松动并在重新插入后链路指示灯亮起，那么问题就是电缆。如果链路指示灯不亮，Ed 应该将现有电缆更换为良好的直通电缆。如果\
  \ LED 亮，现有线可能有故障。如果 LED 不亮，Ed 应该怀疑网络适配器或交换机端口故障，并尝试将电缆移动到交换交换机端口。如果连接正常，问题可能是交换机端口。如果连接仍然不正常，那么故障可能是计算机中的网络适配器。\n\
  \n### 189. C, D\n选项 A 是 `T568B` 标准，选项 B 是 `T568A` 标准。两者都是正确的且可以使用。选项 C 和 D 都是错误的，会导致严重的串扰。\n\
  \n### 10. C\n部分 VLAN2 用户无法连接到本地和远程资源。由于连接到同一 VLAN 内其他交换机的用户没有报告任何问题，因此路由器不是问题所在。这同样排除了\
  \ VLAN2 配置问题，因为这会影响所有交换机上的 VLAN2 用户。VLAN3 和 VLAN4 用户可以通过路由器进行通信，因此它们也不是问题。最可能的问题是公共组件，即连接到遭遇故障的\
  \ VLAN2 用户的交换机。\n\n\n\n\n\n# 191. A. 在这种场景下，只有一个局域网（LAN）的用户遇到了连接互联网和其他内部局域网的问题。这说明问题仅限于该局域网内的某个组件。由于用户可以成功连接到本地资源，因此问题不在个人计算机、连接用户的网络交换机或骨干网络电缆上。最可能的问题出现在连接该局域网到骨干网的路由器上。由于其他内部局域网的用户没有报告连接互联网的问题，因此问题很可能不涉及互联网路由器。\n\
  \n# 192. D. 组组管理协议（IGMP）侦听是一种交换技术，它可以防止网络主机在不是组播组成员时接收组播数据包。组播流量仍然会出现在网络上，但只有组播组的成员会处理这些数据包。非对称路由和多路径都会影响数据包通过网络的路径，而流量控制只影响传输系统发送数据包的速度。这些因素都无法控制哪些主机处理入站数据包。\n\
  \n# 193. B. 在这种场景下，所有内部用户都遇到了连接互联网的问题，因此提供互联网访问的路由器是怀疑的组件。由于用户可以连接到内部局域网上的资源，问题可能不在连接局域网到骨干网的任何路由器或骨干电缆本身。这也消除了局域网交换机出现问题的可能性。\n\
  \n# 194. A, B, C. Ed 首先必须更改网协议（IP）地址。这是因为位于路由器另一侧（过滤子网）的计算机必须使用与内部网络地址不同的 IP 网络地址。接下来，Ed\
  \ 必须将内部网络计算机上的默认网关设置更改路由器的地址，以便流量可以被定向到过滤子网。最后，Ed 必须更新域名系统（DNS）服务器上的资源记录，以反映 IP\
  \ 地址的变化。介质访问（MAC）地址是硬编码在网络接口适配器中的，不易更改。\n\n# 195. C. 问题最有可能是默认网关地址，它将所有指向互联网的流量引导至电缆调制/路由器。如果该地址错误，流量将永远到达路由器。由于计算机可以访问本地网络上的另外两个系统，因此网协议（IP）地址和子网掩码没有问题。在\
  \ Windows 工作站上没有必要（也不总是可行）更改介质访问（MAC）地址。\n\n# 196. D. 因为 Ed 可以成功连接到 `WebServ1`，所以问题不是服务器上的服务无响应或被阻塞的端口。问题不是名称解析失败，因为\
  \ Ralph 可以通过名称成功 ping 通 `WebServ1`。因此，在列出的选项中，唯一的问题可能是 Ralph 工作站上的防火墙未配置允许远程桌面客户端的流量流出。\n\
  \n# 197. C. 当动态主机配置协议（DHCP）客户端从 DHCP 服务器获得内部协议（IP）地址时，客户端在接受它之前会使用该地址广播地址解析协议（ARP）请求。如果本地网络上的另一台计算机正在使用提供的地址，该计算机将响应\
  \ ARP 请求，DHCP 客户端将拒绝该地址。然后 DHCP 服务器会提供另一个地址。域名服务（DNS）查询和路由表检查不是检查重复 IP 地址的可靠手段。同一个本地局域网上可以有两个\
  \ DHCP 服务器，但它们必须配置不重叠的作用范围。\n\n# 198. C. 如果网络上有人在伪造 Ed 工作站的介质访问（MAC）地址，处理网络流量的交换机中的\
  \ MAC 地址可能会随着来自每台计算机的数据包到达交换机而不断变化。这可能导致某些响应数据包被转发到 Ed 的工作站，某些转发到伪造者的工作站。重复 IP 地址不会导致这个问题，因为它们会被操作系统检测到。阻塞的传输控制协议/用户数据报协议（TCP/UDP）端口、错误的防火墙设置或组播传输泛洪会导致\
  \ Ed 无法接收，但它们不会被发送到另一个工作站。\n\n# 199. B. 操作系统会立即检测到重复 IP 地址并在相关计算机上显示错误消息或通知。因此，如果另一个系统正在使用她的\
  \ IP 地址，该用户会立即收到通知。所有其他选项都是导致问题的可能原因，但更难进行故障排除。\n\n# 200. B. 用户的浏览器无法将请求网站的主机名解析为网协议（IP）地址，而他们在连接到\
  \ Web 服务器之前必须执行此操作。通过询问公司 DNS 服务器位于何处，Ralph 可以判断问题是出在 DNS 服务器本身还是提供互联网访问的路由器上。如果\
  \ DNS 服务器位于 Adatum 的公司网络上，那么 DNS 服务器可能无法解析网站名称。然而，DNS 服务器可能位于互联网服务提供商（ISP）的网络上，在这种情况下，问题可能在于提供访问\
  \ ISP 网络的路由器上。\n\n# 201. B. 衰减是信号在通过网络介质时的减弱。在这种情况下，问题最有可能是电缆长度超过了以太网双线规范中定义的 100\
  \ 米最大值。因此，缩短电缆长度可能会解决问题。所有以太网双线规范都有 100 米的最大长度，如果线路过长，以较慢的速度运行网络、安装更高等级的电缆以及安装更高级的网络适配器可能没有影响。\n\
  \n# 202. A. 办公环境中的电梯机械、荧光灯具和其他电气设备会产生磁场，导致电磁干扰（EMI）。当铜基数据电缆距离此类设备太时，磁场会在电缆上产生电流，干扰网络设备交换的信号。如果网络用户每当电梯机械启动时就遇到问题，EMI\
  \ 可能是问题的原因。近端串扰（NEXT）、远端串扰（FEXT）和衰减都会导致间歇性网络通信问题，但它们不能由电梯机械引起。\n\n# 203. B, D. 许多网络的常见做法是禁用未使用的交换机端口，以免未经授权的人员将设备插入其中。某些网络还使用端口安全，在交换机上配置访问控制列表（ACL），指定允许使用这些端口的设备介质访问（MAC）地址。这其中任何一种都可能是\
  \ Ralph 问题的所在。由于没有其他网络用户报告问题，网络地址转换（NAT）和域名系统（DNS）等故障服务不太可能是原因。\n\n\n\n\n### 204.\
  \ A\n双工不匹配是选项中最可能的。在双绞电缆上运行以太网在其原始的半双工模式下，通过同时查看发送和接收引脚上的数据来检测冲突。在全双工模式下，数据应该是同时传输和接收的。当连接的一端配置为使用全双工而另一端配置为使用半双工时，全双工侧的通信在半双工侧看起来就像是冲突。半双工适配器会在每次冲突后发送一个阻塞信号，这导致全双工侧接收到一个不完整的帧。随后双方都开始在持续循环中重新传输帧，导致网络性能大幅下降。如果问题是交叉线或禁用的交换机端口，链路脉冲\
  \ LED 将不会亮。过时的驱动程序不太可能减慢网络性能，即使真的如此，减慢速度也是微不足道的。\n\n### 205. C\n绿色 LED 表示设备正在以交换机支持的全速运行，而橙色\
  \ LED 则表示设备正在以降低的速度运行。如果没有连接设备，LED 将完全不亮。LED 不指示冲突的发生或连接到端口的设备类型。\n\n### 206. A\n\
  如果新办公室域控制器上的时间与家庭办公室域控制器保持的时间差超过五分钟，那么新的域控制器将无法同步。重复的 Internet 协议（`IP`）地址或错误的默认网关地址将阻止新的域控制器连接到家庭办公室网络。服务器硬件故障将表现为比域控制器同步问题严重得多的停机。\n\
  \n### 207. C\nRalph 的新电脑可能配备了至少支持快速以太网（`100Base-TX`）的网络适配器。快速以太网和更新的网络适配器支持连接速度的自动协商，但\
  \ `10Base-T` 不支持。因此，如果计算机尝试与 `10Base-T` 集线器协商连接速度，它将失败并以默认速度运行，而集线器不支持该速度。通过手动配置计算机中的适配器运行在\
  \ `10 Mbps`，它应该能够与网络通信。将计算机的适配器设置为运行在 `100 Mbps` 将不会改变任何事情。更改 `10Base-T` 集线器的速度是不可能的。\n\
  \n### 208. A\n只有域名系统（`DNS`）服务器执行 FQDN 解析，因此这可能是问题的根源。在使用 `DNS` 的情况下，可以使用计算机名称 ping\
  \ 本地网络上的设备。电磁干扰（`EMI`）会抑制所有的网络通信，而访问控制列表（`ACLs`）对 ping 测试没有影响。动态主机配置协议（`DHCP`）为客户端分配\
  \ `IP` 地址；它不解析 FQDN。\n\n### 209. D\n由于只有一个用户报告了该问题，用户的计算机最可能是问题的来源。用户可能更改或删除了 WINS\
  \ 服务器地址。如果用户使用的是错误的 WINS 地址，他可以访问本地网络资源，但无法访问另一个内部局域网资源。此外，他还可以访问互联网资源，这意味着互联网路由器和\
  \ `DNS` 服务器不是问题所在。\n\n### 210. C\n`169.254.0.0/16` 网络由自动私有 IP 地址（`APIPA`）使用，该标准在客户端无法联系\
  \ `DHCP` 服务器时为动态主机配置协议（`DHCP`）客户端提供 Internet 协议（`IP`）地址。Ralph 并不知道，他网络上的 `DHCP`\
  \ 服务器已经离线了一周多，用户的 `IP` 地址租约开始过期。这导致他们回退到 `APIPA` 地址。多个用户更改其 `IP` 地址不会导致他们都使用相同的网络地址。恶意的\
  \ `DHCP` 不可能向客户端部署 `APIPA` 地址。修改 `IP` 地址的恶意软件感染是罕见的。\n\n### 211. D\n要让交换机端口上的链路脉冲\
  \ LED 亮起，交换机与另一端的计算机之间必须建立完成连接。其他任何选项都不会导致 LED 亮起。\n\n### 212. B\n由于 Ed 知道网络工作站应该使用\
  \ `DHCP` 获取其 `IP` 地址，最好的做法是启用 `DHCP` 客户端并关闭工单，而不是用另一个静态地址配置系统。没有迹象表明网络上存在恶意的 `DHCP`\
  \ 服务器，因为工作站的 `DHCP` 客户端被禁用了。这并不是 Ed 第一次遇到用户对他撒谎，以后也不会是最后一次。他应该就置其不管，转而投入到解决问题上。\n\
  \n### 213. B, D\n解决方案应该要求 Ralph 在 ADSL 路由器上创建一个与网络交换机端口使用的虚拟局域网（`VLAN`）匹配的 VLAN。因此，他应该在路由器上创建一个\
  \ `VLAN4` 并分配一个端口，该端口将是 Ralph 将路由器连接到网络交换机的端口。不需要在网络交换机上创建 `VLAN1`，因为所有交换机都有一个名为\
  \ `VLAN1` 的默认 VLAN。修改网络交换机上的 `VLAN` 分配不是一个好主意，因为它可能会干扰现有的 VLAN 策略。\n\n### 214. A,\
  \ B\nRalph 可以为路由器购买许可证升级，这将使能够创建 `VLAN4`。然而，更简单且更廉价的解决方案是在交换机上创建 `VLAN2`。只要电缆的两端都接入同一个虚拟局域网（`VLAN`），路由器就能服务网络。将设备配置为使用\
  \ `VLAN1` 可能会干扰现有策略。\n\n### 215. A\n为了让网站的安全层（`SSL`）证书被信任，它必须由双方都信任的源签名。许多安全公司从事为公司提供\
  \ `SSL` 证书的业务。这是 Ralph 必须做的，以防止错误消息出现在公司的客户端。创建自签名证书或在内部安装证书体系是不够的，并且可能就是问题的根源。用户不太可能相信一切正常。\n\
  \n### 216. B, D\n`route` 工具配合 `print` 参数可以显示 Windows 计算机上路由表的内容。`netstat -r` 命令也是如此。`nbtstat`\
  \ 和 `nslookup` 工具无法显示路由表。\n\n### 217. D\n要访问互联网，工作站的路由表必须包含默认网关项。要在表中创建默认网关项，您使用\
  \ `route add` 命令，网络目标值为 `0.0.0.0`，掩码值为 `0.0.0.0` 以及本地网络路由器的地址（在此情况下为 `192.168.2.99`）。该项还必须具有比表中其他条目更小的\
  \ `METRIC` 值，以便其被优先使用。\n\n### 218. A\n速度变慢最可能的原因是广播风暴。`DHCP` 依赖广播消息为用户分配 IP 地址，因此\
  \ 500 个用户在早上 9:00 同时开启电脑会产生异常数量的广播包。这会导致网络性能下降，直到所有用户完成其 `DHCP` 地址分配。路由环路、交换环路不对路由会降低网络性能，但性能下降不会局限于早晨时段。恶意的\
  \ `DHCP` 服务器会导致问题，但不是此处描述的这种。\n\n\n\n\n\n219. C. Alice 的计算被称为光链路预算。通过累加以分贝（dB）的各种损耗因素，她可以判断预算是否较低，从而导致链路出现通信问题。协议分析是对网络数据包内容的检查。路由环路是指数据包在网络中无尽循环的状态。RSSI（接收信号强度指示）是一种无线网络统计数据，不适用于光纤连接。\n\
  \n220. D. 在所有服务器上，`NTP` 都使用已知的用户数据报协议（UDP）端口 123 与与协调世界时（UTC）服务器进行通信。如果服务器的防火墙封挡了该端口，它将无法同步其时钟时间。如果域控制器的时钟未同步，它们的数据同步过程可能会受到影响。该问题并不是名称解析失败、数据库服务无响应或传输控制协议/网协议（TCP/IP）设置错误导致的，因为其他服务器功能并未受到影响。\n\
  \n## 第 6 章：模拟考试 1\n\n1. A, C, D. 数据中心的三层分层架构由核心层、分布层和接入层组成。数据中心的接入层包含服务器，分布层包含冗余交换机连接，而核心层提供交换机之间的高速传输。该架构中没有中间层。\n\
  \n2. B. 可接受使用政策（AUP）规定了员工是否以及如何使用公司拥有的硬件和软件资源。AUP 通常规定了员工在工作期间可以执行哪些个人工作、可以安装哪些硬件和软件，以及在使用公司设备时允许的隐私级别。这是最可能包含你所寻找的信息的文档。服务水平协议（SLA）是提供者与订阅者之间的合同。非披露协议（NDA）规定了员工允许在公司外讨论哪些公司信息。自自带设备（BYOD）是一种规定员工如何将其个人设备连接到公司网络的政策。\n\
  \n3. A. 该问题的产生有很多比路由器配置错误更可能的原因，因此这不是你应该首先检查的内容。询问用户是否可以访问本地网络是为了隔离问题。如果她无法访问，问题可能出现在她的电脑上；如果她可以访问，那么问题就在互联网访问基础设施的某处。如果其他用户也遇到了这个问题，那么该问题应该获得更高的优先级，你也将确定问题不在用户的电脑上。虽然用户的职位名称可能不是你首要检查的，但高层用户获得优待是一种政治现实。\n\
  \n4. B. 生物识别扫描、身份证和钥匙扣都是旨在区分授权人员和未经授权人员的机制。运动检测无法做出这种区分，因此不是防止未经授权访问的手段。\n\n5. C.\
  \ 该问题最可能是双工冲突（duplex mismatch）的结果。全双工网络上不应发生冲突，因此问题显然与通信的双工模式有关。双线以太网适配器运行在原始的半双工模式下，它通过同时查看发送和接收引脚上的数据来检测冲突。然而，在全双工模式下，数据应该是同时传输和接收的。当连接的一端配置为全双工（如新电脑所示），而另一端配置为半双工（如网络交换机必须那样）时，一方的全双工通信在半双工侧看起来就像冲突。半双工适配器会在每次冲突后发送干扰信号，导致全双工侧接收到不完整的帧。随后双方都开始在循环中重新传输帧，导致网络性能急剧下降。`ping`\
  \ 测试没有检测到问题，因为 `ping` 每次只向一个方向传输少量数据。所有其他选项都可能导致 `ping` 测试失败。该问题的解决方案是将新电脑配置为自动协商其速度和双工模式。\n\
  \n6. B. 自组织拓扑（也称为独立基本服务集）是指无线计算机之间直接通信，而不需要接入点。无线接入点（WAP）是带有无线收发器器的设备，它还连接到标准的有线网络。无线计算机与接入点通信，由接入点通过网络电缆转发它们的传输。这被称为基础设施拓扑。星型拓扑和总线拓扑不用于无线网络；它们要求计算机在物理上连接到网络电缆。\n\
  \n7. C. 多层交换机是一种网络连接设备，工作在开放系统互连（OSI）模型的第 2 层和第 3 层。在第 2 层（数据链路），该设备的功能类似于普通交换机，为每个连接的节点提供独立的冲突域，并允许你创建多个\
  \ VLAN。在第 3 层（网络层），该设备通过在各个 VLAN 之间转发数据包来提供路由能力。虚拟路由器、负载均衡器和宽带路由器是严格的第 3 层设备，可以路由流量但不能创建\
  \ VLAN。\n\n8. B, C, D. 静态数据（Data at-rest）是一个数据保护术语，描述存储中未使用的数据。运动中数据（Data in-motion）是用于描述网络流量的术语。使用中数据（Data-in-use）描述终端操作。在线数据不是标准的数据保护术语之一。\n\
  \n9. C. WiFi 保护访问（WPA）是为了取代日益脆弱的等效网络隐私（WEP）协议而设计的无线安全协议。WPA 增加了一种名为临时密钥完整性协议（TKIP）的加密协议。随着时间的推移，TKIP\
  \ 也变得脆弱，于是推出了 WPA2，它用高级加密标准协议（AES）替换了 TKIP。\n\n10. A. 图中的设备是信号发生器，用于测试双线布线并检测基础布线故障。通过逐个连接信号发生并在另一端定位信号，你可以确定每根线是否连接到正确的引脚。该工具无法执行其他选项中的任何任务。\n\
  \n11. C. “你拥有的”一词指的是识别用户的实体物品，例如智能卡。这种身份验证几乎总是作为多因素身份验证程序的一部分使用的，因为智能卡或其他实体物品可能会丢失或被盗。指纹被认为是“你固有的”，密码是“你所知的”，而手势是“你所做的”。\n\
  \n12. A, C, D. 端口 1433 用于 SQL Server；端口 1521 用于 SQLnet；端口 3306 用于 MySQL。端口 3389\
  \ 用于远程桌面协议（RDP），不参与 SQL 通信。\n\n13. D. 基于 802.11a 标准构建的无线局域网（WLAN）设备只能使用 5 GHz 频段。然而，802.11g\
  \ 接入点只能使用 2.4 GHz 频段。因此，无法通过任何方法让网络适配器连接到你的接入点。\n\n\n\n\n\n### 14. C, D.\nRAID 是一种在多个硬盘驱动器上存储数据的技术，提供容错能力、提高性能或两者兼顾。不同的\
  \ RAID 级别提供不同的功能和不同的硬件要求。`RAID 5` 和 `RAID 6` 都结合了磁盘条带化与校验信息的分布式存储。`RAID 5` 允许从单磁盘故障中恢复。`RAID\
  \ 6` 使用冗余校验允许从双磁盘故障中恢复。`RAID 1` 和 `RAID 10` 都使用磁盘镜像来提供容错，这不需要校验数据。`RAID 0` 仅使用数据条带化（顺序写入每个磁盘的块），不提供任何形式的容错。\n\
  \n### 15. A, C, E.\n无线局域网（`WLAN`）使用的 2.4 GHz 频段由宽度为 20（或 22）MHz 的通道组成。然而，通道间隔仅为\
  \ 5 MHz，因此接入点之间可能会发生通道重叠，导致干扰。通道 `1`、`6` 和 `11` 是唯一彼此距离足够远以避免与相邻通道重叠的通道。通道 `4` 和\
  \ `8` 容易发生重叠。\n\n### 16. B, C, D.\n禁用未使用的服务和端口是一种服务器加固技术，可以减少服务器的攻击面面。创建仅用于需要相应权限的任务的特权用户账户，可以减少管理账户被破解的概率。因此，这些都是服务器加固的形式。升级服务器上的\
  \ `UEFI` 或 `BIOS` 固件通常不会增强其安全性，因此不能被视为服务器加固的一种。\n\n### 17. C.\n`默认网关`（`Default Gateway`）设置应包含工作站本地网络上路由器的地址，通过它可以访问其他网络（如互联网）。在这种情况下，`默认网关`地址应该在\
  \ `192.168.23.0` 网络上，但它包含 `192.168.216.0` 网络上的地址，这并不是本地地址。因此，用户只能访问 `192.168.23.0/24`\
  \ 网络上的系统。`子网掩码`（`Subnet Mask`）设置必须正确，否则用户将无法访问任何其他系统。与默认网关不同，`DNS` 服务器不必位于工作站的本地网络上，因此显示的地址可以是正确的。计算机访问互联网不需要启用\
  \ `DHCP`。\n\n### 18. C, D, E.\n可以调节恒温器的智能手机应用程序、远程监控的心脏起搏器以及配备摄像头的冰箱都是物联网（IoT）设备的设备示例，因为它们都拥有\
  \ IP 地址并使用互联网与控制器或监控站通信。用于解锁汽车的钥匙扣和电视遥控器通常是短距离无线电或红外线设备，它们不使用互联网进行通信。\n\n### 19.\
  \ A.\n使用活动目录域服务（`AD DS`）的 Windows 网络使用 `Kerberos` 协议对客户端进行身份验证，部分因为它即使以加密形式也从不在网络上传输密码。远程认证拨号用户服务（`RADIUS`）是一种用于连接到网络的远程用户的认证、授权和计费服务。Windows\
  \ 不将其用于内部客户端。WiFi 安全访问协议二代（`WPA2`）是无线局域网（`WLAN`）使用的安全协议。它是一种安全协议。扩展协议层安全（`EAP-TLS`）是一种安全协议。\n\
  \n### 20. C, D.\n禁用未使用的服务和端口是一种服务器加固技术，可以减少服务器的攻击面。创建仅用于需要相应权限的任务的特权用户账户，可以减少管理账户被破解的概率。因此，这些都是服务器加固的形式。升级服务器上的\
  \ `UEFI` 或 `BIOS` 固件通常不会增强其安全性，因此不能被视为服务器加固的一种。\n\n### 21. A, D.\n禁用未使用的服务和端口是一种服务器加固技术，可以减少服务器的攻击面。创建仅用于需要相应权限的任务的特权用户账户，可以减少管理账户被破解的概率。因此，这些都是服务器加固的形式。升级服务器上的\
  \ `UEFI` 或 `BIOS` 固件通常不会增强其安全性，因此不能被视为服务器加固的一种。\n\n### 22. A, D.\n基础设施即服务（`IaaS`）为消费者提供处理、存储和网络资源，他们可以使用这些资源安装和运行操作系统和其他软件。在公共云模型中，一个组织作为提供者，另一个组织（在这种情况下是为你）使用这些服务。平台即服务（`PaaS`）为消费者提供安装应用程序的能力。软件即服务（`SaaS`）为消费者提供运行在提供者服务器上的特定应用程序，但消费者对操作系统、服务器或底层资源没有控制权。在私有云中，使用云服务的组织也是基础设施的所有者。混合云是公共基础设施的组合，组合，消费者是基础设施的一部分。\n\
  \n### 23. D.\n这种钳子状设备是接线器（`crimper`），电缆安装人员使用它将袋中的 `RJ45` 连接器安装在散装电缆上。这是制作跳线的过程，跳线用于连接计算机到墙壁面板以及从配线架端口到交换机。你的老板让你开始制作长度为五英尺和十英尺的跳线。你不需要接线器来连接模块连接，而且老板没有给你提供布线或安装配线架所需的工具和组件。\n\
  \n### 24. B.\n邮局协议 3 版（`POP3`）的默认端口是 `110`，但它是用于接收邮件的。发送邮件使用简单邮件传输协议（`SMTP`），它默认使用已知端口\
  \ 25。端口 143 是互联网消息访问协议（`IMAP`）的默认端口，这是一种不同的邮箱协议，客户端从不与 `POP3` 配合使用。端口 80 是超文本传输协议（`HTTP`）的默认端口，邮件客户端不使用它。\n\
  \n### 25. B.\n用于细以太网段的电缆类型是称为 `RG-58` 的同轴电缆。`RG-8` 同轴电专用于粗以太网段。`RJ45` 是用于数据网络双绞布线的连接器类型。`RJ11`\
  \ 是用于电信网络双绞布线的连接器类型。\n\n\n\n\n\n### 26. A.\n交叉线（Rollover cable）是一种空调制解调器电缆，通常扁平且呈浅蓝色，两端的引脚定义反转，以便终端通过设备的专用控制端口与路由器或交换机通信。它不能将工作站连接到网络。直通线（Straight-through\
  \ cable）是用于将工作站或其他设备连接到以太网的标准网络电缆。交叉线（Crossover cable）设计用于直接连接两个网络适配器，创建一个双节点网络。阻燃电缆（Plenum\
  \ cable）是一种旨在用于空气空间内部的电缆，其外壳在燃烧时不会产生有毒烟雾。屏蔽线（Shielded cable）旨在保护信号免受电磁干扰。阻燃电缆和屏蔽线都可以将工作站连接到网络。\n\
  \n### 27. A.\n认证头（`AH`）是 TCP/IP 协议族中的一种协议，以数字签名的形式提供数字完整性服务，确保传入的数据包确实来自其声明的源。封装安全协议（`ESP`）为`IPSec`提供加密服务。安全套层（`SSL`）是一种安全协议，为\
  \ Web 浏览器和服务器之间提供加密通信。远程桌面协议（`RDP`）是远程桌面服务的组件，该 Windows 机制允许客户端程序连接到服务器并对其进行远程控制。\n\
  \n### 28. B.\nVLAN（虚拟局域网）是定义在交换机内的虚拟二层（数据链路层）局域网。与物理局域网一样，同一 VLAN 中的设备才能相互通信，除非网络中加入了路由器或三层交换机等三层设备。重新创建和配置\
  \ VLAN 无法解决问题。流量过滤器通常实现在路由器上，而不是交换机上。一旦路由器到位，VLAN 之间不需要使用相同的数据链路协议进行通信。\n\n### 29.\
  \ A, C.\n`IPv4`地址和端口号组合的术称为套接字（`socket`），它用于标识运行在特定主机上的应用程序。媒体访问控制（`MAC`）地址是硬编码在网络适配器中的地址。它不是\
  \ TCP/IP 元素。识别主机或运行在该主机上的应用程序不需要子网掩码。\n\n### 30. A, B, C, D.\n电缆调制解调器必须作为宽带路由器工作，以提供对电缆供应商网络的访问。许多电缆调制解调器也是无线接入点（`WAPs`），允许用户在无需安装线路的情况下构建局域网（`LAN`）。许多电缆调制解调器具有交换以太网端口，用于连接打印机和计算机等有线设备。大多数电缆调制解调器使用动态主机配置协议（`DHCP`）为家庭网络上的设备分配\
  \ IP 地址。家用电缆调制解调器通常不作为代理服务器或远程认证拨号服务（`RADIUS`）服务器，这些通常用于大型网络的设备。\n\n### 31. A.\n\
  与用于正向域名解析的`A`和`AAAA`记录类似，指针（`PTR`）记录包含主机名和 IP 地址。然而，`PTR`记录仅用于反向解析——即将 IP 地址解析为主机名。邮件交换（`MX`）记录指定了域名应使用的邮件服务器。规范名称（`CNAME`）记录指定了给定主机名的别名。`AAAA`资源记录将主机名映射到`IPv6`地址以用于域名解析。除了`PTR`之外，所有这些记录都用于正向域名解析。\n\
  \n### 32. C, D.\n协议分析器捕获网络上的数据包并解释其内容，其中可能包括应用层负载。根据应用程序的不同，负载可能包含机密信息，例如密码。协议分析器还会显示参与数据包传输的系统\
  \ IP 地址。虽然这本身可能不是重大的安全威胁，但入侵者可能会利用 IP 地址信息发起其他类型的攻击。协议分析器无法解密它们在捕获的数据包中发现的保护信息。漏洞扫描器检测开放端口并对它们发起攻击；协议分析器不具备此功能。\n\
  \n### 33. B, D.\n远程认证拨号服务（`RADIUS`）也称为`AAA`服务器，提供认证、授权和计费。衰减（Attenuation）不是`RADIUS`服务器的功能。\n\
  \n### 34. C.\n域名系统（`DNS`）服务器执行全限定域名（FQDN）解析，因此用户可以使用主机名成功 ping 网络上的设备。动态主机配置协议（`DHCP`）不可能是问题所在，电磁干扰（`EMI`）会阻止所有通信，访问控制列表（`ACLs`）对`ping`测试没有影响。\n\
  \n### 35. B.\n代理服务器为用户提供互联网访问，未注册的 IP 地址保护计算机免受未经授权的访问，符合主要目标。代理服务器还可以监控和监管用户对互联网的访问，满足了辅助目标之一。然而，代理服务器无法为计算机分配\
  \ IP 地址，方案中未提到任何`DHCP`服务器。因此，方案未能满足另一个辅助目标。\n\n### 36. C.\n软件服务（`SaaS`）提供的控制权最小。消费者访问供应商服务器上的特定应用程序，但对操作系统、服务器或底层资源没有控制。基础设施服务（`IaaS`）模型提供了最大的控制权，因为供应商提供了按需处理、存储和网络资源。平台服务（`PaaS`）允许用户在供应商提供的服务器上安装所需的应用程序，但他们对服务器的控制有限，对底层资源没有控制。\n\
  \n### 37. A.\n以太网在数据链路层使用巨型帧来高效地传输大量数据。以太网通常将帧限制在 1500 字节，但巨型帧允许以太网系统创建高达 9000 字节的帧。`PPP`不支持巨型帧。帧是仅与数据链路层相关的协议数据单元，因此不适用于位于网络层和传输层的`IP`和`TCP`。\n\
  \n### 38. C.\n故障排除流程的第一步涉及通过询问用户和创建工单来识别问题。在创建工单并确定优先级后，你完成故障排除流程的其他步骤。\n\n### 39.\
  \ C.\n用户遭遇了勒索软件攻击。勒索软件是一种攻击，除非向攻击者支付特定金额，否则用户对其数据的访问将被阻止。这种阻止从简单的屏幕锁定到数据加密不等。无线驱动（War\
  \ driving）是一种带着计算机在社区周边扫描未保护无线网络的攻击方法。拒绝服务（`DoS`）是一种通过流量淹没计算机使其无法正常运行的攻击。地址解析协议（`ARP`）中毒是故意向存储在计算机和交换机的\
  \ ARP 缓存中插入虚假信息。\n\n\n\n\n\n## 40. B, C\n非对称数字用户线路（ADSL）中的 `asymmetric`（非对称）意味着该服务在每个方向上提供不同量的带宽。在几乎所有情况下，非对称广域网（WAN）服务的下行带宽大于上行带宽。电缆电视（CATV）网络也是非对称的。对称数字用户线路（SDSL）中的\
  \ `symmetric`（对称）意味着该服务在两个方向上提供相同的带宽。以太网的光纤通道（FCoE）也是对称的。\n\n## 41. B, C\n大型企业网络至少会拥有电话服务的分界点，以及与互联网服务提供商（ISP）网络的连接。在许多情况下，这些服务通过与骨干交换机位于同一个设备机房进入建筑，这使得网络上的所有设备都能访问这些资源。该房间被称为主配线架（MDF）。中间配线架（IDF）是放置本地电信设备的地方，例如水平布线与骨干网之间的接口。例如，位于单栋建筑中的企业网络可能在地下室设有一个\
  \ `MDF`，并在每层楼设一个 `IDF`。平均故障间隔时间（MTBF）和远程桌面协议（RDP）并不是网络布线的位置。\n\n## 42. B\n顶空空间（Plenum\
  \ space）是建筑中作为通风系统一部分提供空气流通的区域，例如加热或空调风道。顶空电缆（Plenum cables）具有由阻燃材料制成的套，燃烧时不会产生有毒烟。当网络电缆安装在顶空空间时，许多当地建筑规范要求安装人员使用符合特定标准的顶空级电缆。当顶空电缆安装在其他电缆、电磁干扰源附近或超过规定长度时，没有任何益处。\n\
  \n## 43. D\n聚类（Clustering）是指将多个服务器（而不是网络适配器）组合成单元，以增强性能并提供容错能力。绑定（Bonding）、链路聚合（link\
  \ aggregation）、端口聚合和网卡聚合（NIC teaming）都是同一种基本技术的术语，即将多个网络适配器连接的带宽以加速传输。该技术还允许在一个适配器故障或断开连接时继续进行网络通信。\n\
  \n## 44. C, D\nSecure Shell（SSH）和 Telnet 都是远程终端程序，但 Telnet 客户端以明文形式向目标服务器传递指令（包括密码），而\
  \ SSH 使用加密传输。同样地，安全型超文本传输协议（HTTPS）是 HTTP 的加密版本。在这两种情况下，替代方案都更安全，应该向主管建议。然而，临时密钥完整性协议（TKIP）提供的加密安全性低于高级加密标准（AES），而有线等效安全协议（WEP）的安全性低于\
  \ WiFi 保护访问 II 级（WPA2）。\n\n## 45. A\n管理信息库（MIB）存储在 `SNMP` 代理上的数据库，其中存储了关于受管理设备属性的\
  \ `ASN.1` 信息。其他三个选项并不执行此功能。陷阱（Trap）是 `SNMP` 代理在发生异常事件时向网络管理控制台发送的告警消息。Syslog 是消息日志组件的标准。安全信息和事件管理（SIEM）是一种组合工具，它利用从日志和网络设备中收集的信息，对网络安全状况进行实时分析。\n\
  \n## 46. A, D\n安全套接层（SSL）是一种现在已废弃的安全协议，用于在 Web 浏览器和服务器之间提供加密通信。传输层安全协议（TLS）是更新的安全协议，旨在取代\
  \ `SSL`。数据报传输层安全协议（DTLS）是一种提供与 `TLS` 相同基本功能的安全协议，但针对的是用户数据报协议（UDP）流量而非 TCP。Secure\
  \ Shell（SSH）是一种基于字符的工具，允许用户在远程计算机上执行命令；它不不提供 Web 服务器/浏览器的安全性。\n\n## 47. B\n受过滤子网（screened\
  \ subnet）的另一个术语是 DMZ，或非军事化区。它们也被称为边缘网络。虚拟局域网（VLAN）是在交换机内部创建的逻辑网络段。保护扩展认证协议（PEAP）是一种认证协议，临时密钥完整性协议（TKIP）是一种加密算法。这三个选项都不是过滤子网的术语。\n\
  \n## 48. D\nRDP 是远程桌面服务的一个组件，这是一种 Windows 机制，允许客户端程序连接到服务器并对其进行远程控制。RDP 不携带实际应用程序数据；它只传输击键、鼠标移动和图形显示信息。\n\
  \n## 49. D, F\n在所示选项中，只有 802.11n 和 802.11ax 标准定义了可以支持 2.4 GHz 和 5 GHz 频率的 WLAN 设备。802.11a\
  \ 和 802.11ac 标准仅支持 5 GHz，而 802.11b 和 802.11g 标准仅支持 2.4 GHz。\n\n## 50. B\n多租户（Multitenancy）要求租户拥有独立的虚拟机。多租户是一种多个租户共享运行在云端的单个应用程序实例的软件架构。由于共享应用程序，存在数据被破坏的可能性。由于运行单个应用程序实例，相比虚拟机减少了操作开销。租户共享有限的带宽，因此可能出现竞争，例如当一个租户成为拒绝服务（DoS）攻击的目标时。\n\
  \n## 51. A, C\n哈希算法（SHA）和消息摘要 5（MD5）是文件哈希算法，通过在网络传输文件之前计算哈希值来测试数据完整性。传输后，接收系统执行相同的计算。如果值匹配，则数据是完整的。RC4\
  \ 和高级加密标准（AES）都是加密算法，但不用于文件哈希。\n\n## 52. B\n最小权限（Least privilege）是指只为用户提供执行其指定任务所需的权限，不再更多。对于标准活动，给\
  \ Alice 一个没有管理权限的账户，因为她执行标准任务不需要这些权限。管理账户拥有 Alice 执行管理任务所需的额外权限。意图是 Alice 仅在管理任务中使用该账户。零日是一种漏洞类型；多因素认证要求用户提供两个身份因子；深度防御是指使用多种安全机制来提供额外保护。这些其他三个选项都不涉及使用多个用户账户。\n\
  \n## 53. E\n在建立可能的原因理论后，你可以通过逐一更换硬件组件来测试理论，直到找到故障设备。所有其他选项都是排故障过程中较早或较后的步骤。\n\n\
  ## 54. D\n内部威胁定义上源于授权用户。因此，智能卡、运动检测和生物识别只能检测到授权进入敏感区域的人员。然而，视频监控可以跟踪任何人（无论是否授权）的活动。\n\
  \n\n\n\n\n### 55. D. 这些所有现象在全双工以太网网络上都是故障，但在半双工网络上，冲突是正常且预期的。`Runt frames`（飞帧）发生在网络接口生成的数据包小于允许的\
  \ 64 字节长度长度。`Giants`（巨帧）发生在帧大于最大允许的 1518 字节长度时。`Late collisions`（后期冲突）发生在网缆过长，帧在离开发送系统后发生冲突时。\n\
  \n### 56. B. Unix/Linux `tcpdump` 实用是一个协议分析器。它是一个捕获网络包并显示其内容的命令行工具。`iptables`、`nmap`\
  \ 和 `pathping` 工具无法捕获和分析包。`iptables` 管理 Unix/Linux 内核防火墙规则，`nmap` 是端口扫描器，而 `pathping`\
  \ 是 Windows 路由跟踪工具。\n\n### 57. A, B. `NAS` 设备是直接连接到标准 IP 网络的自包含文件服务器。`NAS` 设备为其存储设备提供文件级访问，并包含操作系统和文件系统。`NAS`\
  \ 设备通常不是 `iSCSI` 目标。`SANs` 提供块级存储并通常作为 `iSCSI` 目标，但它们不包含操作系统或文件系统。\n\n### 58. C.\
  \ 渗透测试是一种网络安全评估，客户聘请外部顾问尝试渗透网络安全并获得对受保护网络资源的未经授权的访问。由熟悉安全屏障的内部管理员进行的测试不是有效的测试。虽然让顾问从内部检查网络安全性是有用的，但它不是渗透测试。对入侵者极具吸引力的目标计算机或网络被称为\
  \ `honeypots`（蜜罐）或 `honeynets`（蜜网）。新安全协议的实施只能在评估当前安全状况之后。\n\n### 59. C. 列出的所有机制都旨在使任何篡改或物理破坏硬件设备的尝试立即显现。因此，这些机制是各种形式的防篡检测。`Asset\
  \ tracking`（资产跟踪）用于定位和识别硬件。`Geofencing`（地理围栏）是一种限制网络访问的无线网络技术。`Port security`（端口安全）指的是网络交换机端口。这些选项不适用于指定的机制。\n\
  \n### 60. B. 不同类型的波分复用使用其承载波长的不同间距，使得它们能够在单个介质上容纳不同数量的通道。`WDM`（或 `BWDM`）携带两个波长用于双向通信。`CWDM`\
  \ 可以携带最多 16 个通道，而 `DWDM` 可以携带 40 或 80 个（取决于使用的间距）。各种放大技术（包括 `EFDA` 和 `Raman`）可以扩展每类型中可用波长的。\n\
  \n### 61. A, B, C. 二层隧道协议 (`L2TP`)、IP 层安全 (`IPSec`) 和多点通用路由封装 (`MGRE`) 都是将数据包以加密形式封装在另一个协议内部以保护其内容的协议。网络地址转换\
  \ (`NAT`) 通过替换生成自私有地址的数据包中的公共 IP 地址，使私有网络上的工作站能够访问互联网。`NAT` 不使用隧道。\n\n### 62. C.\
  \ 要创建一个具有 8 个子网且每个子网有 30 个主机的网络，你必须分配最后一个字节的 8 位中的 3 位用作子网标识符。这导致子网掩码的最后一个字节二进制值为\
  \ `11100000`，转换为十进制值为 224。因此，正确的子网掩码值是 `255.255.255.224`。最后一个字节小于 224 的值将无法让你创建\
  \ 8 个子网。大于 224 的值将无法让你创建 30 个主机地址。\n\n### 63. B. 媒体访问控制 (`MAC`) 过滤采用无线网络接入点上的访问控制列表\
  \ (`ACL`)，列出所有允许访问网络的 `MAC` 地址。如果你的笔记本电脑的 `MAC` 地址不在 `ACL` 中，你将无法连接到网络。`Geofencing`\
  \ 防止办公室外的用户访问网络。你在内部，所以这不应该是问题。你已经获得了网络口令，因此你应该能够在笔记本电脑上配置 WiFi 保护访问 II (`WPA2`)\
  \ 协议。你已经获得了网络的 `SSID`，所以即使接入点没有广播 `SSID`，你也可以通过手动输入它来连接。\n\n### 64. D. 要让交换机端口上的链路脉冲\
  \ LED 灯亮起，交换机与另一端功能良好的网络设备之间必须存在活动连接。将正在运行的电脑插入墙插将使连接两端的以太网适配器通信，导致 LED 亮起。其他任何选项都不会导致\
  \ LED 亮起。\n\n### 65. B. 数据链路层的以太网（或 `IEEE 802.3`）协议使用 `MAC` 地址识别本地网络上的计算机。`MAC`\
  \ 地址由制造商编码在物理网络接口适配器的固件中。物理层处理信号，不涉及寻址。网络层的 `IP` 有它自己的寻址系统。传输层协议不涉及寻址。\n\n### 66.\
  \ C. 图中所示 Cisco 符号在网络图中表示路由器，由指向内部和向外的箭头表示。此符号不用于表示集线器、交换机或网关。\n\n### 67. B, D.\
  \ 通过向设备的 `ARP` 缓存插入修改后的条目，攻击者可以导致流量从正确目标重定向到攻击者控制的系统。这使得攻击者能够拦截指向其他目标的流量。在中间人攻击中，攻击者可以读取被拦截的流量，并在发送到正确目标之前对其进行修改。在会话劫持攻击中，攻击者可以使用拦截的流量获取身份验证信息，包括密码。另外两个选项都不是由\
  \ `ARP` 毒提供的。`evil twin`（邪恶大师）是无线网络上的欺诈接入点。`Social engineering`（社会工程）是一种攻击形式，误导用户通过电子邮件或电话提供敏感信息。\n\
  \n### 68. D. `honeypot`（蜜罐）是配置为作为攻击者诱饵的计算机，导致他们浪费时间渗透不提供重要访问的资源。这也是一种让目标收集有关攻击者信息的技术。非军事化区\
  \ (`DMZ`)，也称为筛选子网或边界网络，是管理员在其中放置必须能够从互联网访问但通过防火墙与内部网络隔离的服务器。`root guard`（根保护）为交换机端口提供保护。`Spoofing`（欺骗）是一种攻击技术，入侵者修改数据包以伪装成另一个用户或计算机。\n\
  \n### 69. A. `repeater`（中继器）是一种物理层设备，重新生成输入信号并重新传输它们。`hub`（集线器）是中继器的一种，通过其多个端口中的任何一个接收数据，并通过其所有其他端口重新传输数据。`Bridges`\
  \ 和 `switches` 是数据链路层设备，`routers` 是网络层设备。这三者中没有一个可以描述为多端口中继器。\n\n### 70. D. 端口扫描器检查系统是否存在可以使用\
  \ `TCP` 或 `UDP` 协议从网络访问的开放端口或端点，入侵者可能利用这些端点获取系统的访问。`Port scanners` 不列出用户进程、硬件端口、数据包数量或\
  \ `IP` 地址。\n\n\n\n\n\n### 71. A, E\n存储区域网络（SAN）是一种专用于传输服务器与存储设备之间流量的网络。SAN 可以使用专门的网络协议，例如在本例中的`Fibre\
  \ Channel`，也可以使用标准的`Gigabit Ethernet`。局域网（LAN）是一组连接在一起的计算机，通常位于单个房间或楼宇内。在这种情况下，集群有一个\
  \ LAN 将节点在一起，另一个 LAN 为其他用户提供对集群的访问。个人局域网（PAN）提供与单个个人关联的设备（如智能手机）之间的通信。广域网（WAN）是连接不同地理位置设备或网络的网络。市城网（MAN）是\
  \ WAN 的一种类型，用于连接有限地理区域内的设备。该集群没有连接到 PAN、WAN 或 MAN。\n\n### 72. C\n由于只有一个用户报告了该问题，并且他承认更改了其\
  \ `IP` 配置，你应该开始使用 `ipconfig` 命令检查工作站配置。如果是路由器、交换机或 `DNS` 服务器导致了问题，将会有多个用户受到影响，并且会有额外的用户拨打帮助台。\n\
  \n### 73. C\n由于你的同事可以成功连接到 `WebServ1`，因此问题不是服务无响应或服务器上的端口被阻塞。问题不是名称解析失败，因为你可以通过名称成功地\
  \ `ping` `WebServ1`。因此，在列出的选项中，唯一的问题可能是你的工作站上的防火墙被配置为阻止远程桌面客户端的流量。\n\n### 74. C\n\
  图中所示设备是打线刀（punchdown tool），你用它将非屏蔽双绞线的末端连接到模块化墙面板和配线架中使用的连接器（keystone connectors）。在将电缆中的单线与连接器对齐后，你使用该工具将每根线压入槽中。该工具还会切断线皮以建立电气接触并修剪电线末端。该工具无法执行其他选项中描述的任何任务。\n\
  \n### 75. A, B, C\n`5 GHz` 频率在美国有 23 个可用通道，而 `2.4 GHz` 频率只有 11 个。许多家庭设备（如无线电话）使用\
  \ `2.4 GHz` 频段，但使用 `5 GHz` 频段的设备较少。较高的频率通常支持更快的传输速度，因为在其他条件相同的情况下，它们可以在相同时间内携带更多数据。`5\
  \ GHz` 频率的范围通常比 `2.4 GHz` 短，因为它穿透屏障的能力较弱。\n\n### 76. C\n图中所示设备是拨号测试机（butt set），是电话安装人员和线路工人的基本工具。通过将夹子连接到打线块（punchdown\
  \ block）的引脚，你可以访问电话电路以进行测试或拨打电话。图中设备不是压线钳、信号发生器和定位器或打线刀。\n\n### 77. A\n文件传输协议（FTP）使用两个端口号。它使用第一个端口，端口\
  \ `21` 用于控制连接，该连接在整个客户端-服务器会话期间保持打开。第二个端口 `20` 用于数据连接，仅当协议实际在客户端和服务器之间传输文件时才打开。网络时间协议（NTP）、简单网络管理协议（SNMP）和超文本传输协议（HTTP）均在服务器上使用单个端口。\n\
  \n### 78. A\n网络地址中指示的 13 位前缀将产生一个带有 13 个 1 后跟 19 个 0 的掩码。拆分为 8 位块，二进制掩码值如下：\n\n\
  ```\n11111111 11111000 00000000 00000000\n```\n\n转换为十进制值，结果的子网掩码值为 `255.248.0.0`。\n\
  \n### 79. B\n无法在第八根线上检测到信号，表明电缆内部某处存在断路，或者一个或两个连接器中的引脚连接不良。这种故障被称为开路（open circuit）。其他三个选项都不是以描述方式表现的故障。短路是指电缆的一端连接到两个或多个引脚。对分对（split\
  \ pair）是指两根线在电缆两端以完全相同的方式错误映射。串扰（Crosstalk）由于一根电线上的信号泄漏到其他电线引起的干扰类型。\n\n### 80.\
  \ B, D\n会话层负责创建和维护端系统之间的对话。这种对话可以是要求端系统轮流传输的双向交替对话，也可以是任何端系统都可以随意传输的双向同步对话。会话层的功能称为对话控制和对话分离。数据加密在表示层执行，数据报文路由发生在网络层。\n\
  \n### 81. A\n当数据流中的单个数据包由于网络拥塞、不同路由或队列问题而延迟时，导致的连接问题称为抖动（jitter）。虽然这种状况可能给异步应用带来问题，但实时通信（如\
  \ `VoIP` 或视频流）可能会受到中断，这种现象也因此得名。延迟（Latency）描述的是网络传输中的通用延迟，而不是单个包的延迟。衰减（Attenuation）是信号在通过网络介质传输时的减弱。瓶颈（bottleneck）是由于故障或容量不足导致所有流量都延迟的状态。这三个选项都不能解释用户报告的问题。\n\
  \n### 82. C\n`802.11ac` 标准定义了速度高达 1.3 Gbps（每秒比特）的无线局域网。其他任何 `802.11` 标准未定义运行速度超过\
  \ 600 Mbps 的网络。目前没有批准的 `IEEE 802.11` 标准能够实现 2.6 Gbps 的速度。\n\n### 83. B, D\n网络地址转换（NAT）是一种网络层服务，通常集成在路由器中，它将客户端所有互联网传输中的私有\
  \ `IP` 地址转换为已注册的 `IP` 地址。因此，NAT 适用于所有应用程序。代理服务器是一种应用层设备，执行相同类型的转换但仅针对特定应用程序。远程认证拨入用户服务（RADIUS）可以为远程访问服务器提供认证、授权和计费服务，但它不转换\
  \ `IP` 地址。统一威胁管理（UTM）设备通常执行虚拟专用网络（VPN）、防火墙和防病毒功能。它同样不转换 `IP` 地址。\n\n### 84. A, B\n\
  `1.1.1.0` 和 `9.34.0.0` 都是有效的 `IPv4` 网络地址。第一个字节值为 224 到 239 的 `IPv4` 地址是 D 类地址，保留用于组播地址。因此，用户无法将\
  \ `229.6.87.0` 用于其网络。`103.256.77.0` 是一个无效地址，因为值 `256` 无法由 8 位二进制值表示。\n\n### 85.\
  \ B\n距离矢量协议依赖跳数（即源和目的地之间的路由器数量）来评估路由的效率。链路状态协议使用不同类型的计算，通常基于 Dijkstra 算法。`内部网关协议`和`边缘网关协议`术语并不是指计算路由效率的方法。\n\
  \n### 86. A, C\n任何类型的光纤都能满足客户的需求。光纤支持所需的 1000 Mbps 数据速率，并可以连接相隔 500 米的网络。光纤还免疫电磁干扰（EMI）。虽然多模光纤和单模光纤都能满足该公司的通用需求，但多模光纤比单模光纤便宜得多。双绞线（STP\
  \ 或 UTP）满足数据速率，但它不支持超过 100 米的连接。细同轴电缆不支持所需的数据速率或超过 185 米的距离。\n\n\n\n\n\n### 87.\
  \ C, D\n错误的频率、服务集标识符 (`SSID`) 或 WiFi 保护访问二代 (`WPA2`) 密码会阻止用户的笔记本电脑无法连接到网络，因此这些不可能是问题的原因。距离接入点较远或中间墙壁的干扰都会导致无线信号减弱，从而导致用户正在经历间歇性连接问题。\n\
  \n### 88. A, C, E\n静态路由不会通过路由协议自动添加到路由表中，也不会自动适应网络的变化。因此，不建议在网络与网络之间存在冗余路径的大型互连网络中使用它们。当网络发生变化时，管理员必须手动添加、修改或删除\
  \ `static routes`。出于这个原因，静态路由仅建议用于没有通往每个目的地多路径的小网络。\n\n### 89. C.\n网络层协议指定了逻辑地址（如\
  \ `IP` 地址），用于端系统之间的通信。它们还使用这些地址将数据包路由到其他网络上的目的地。物理层定义了网络物理和机械特征的标准。数据链路层使用介质访问控制\
  \ (`MAC`) 或硬件地址，而不是逻辑地址。传输层使用端口号，而不是逻辑地址。会话层协议在端系统之间创建并维护对话。表示层协议负责信息的格式化、翻译和呈现。应用层为应用程序访问协议栈并准备跨网络传输的信息提供了一个入口。\n\
  \n### 90. C.\n使用错误的无线安全协议是导致连接失败的常见原因，因此检查此项最可能让你发现问题的根源。信道冲突是一个你在接入点检查并解决的问题，而不是在用户的工作站上。接入点无法更改频率，因为\
  \ `802.11g` 标准仅支持 `2.4 GHz` 频率。虽然信号干扰可能是连接失败的原因，但用户可以看到网络的 `SSID`，所以这不太可能是问题所在。\n\
  \n### 91. A, B, C.\n`iSCSI` 不包含自有的流控制机制，因此该选项是错误的。它运行在 `TCP` 连接之上，而该协议负责负责流控制。`Fibre\
  \ Channel` 需要使用光纤电的专用网络。`iSCSI` 流量可以在单个网络上与标准的 `LAN` 流量共存，尽管通常建议使用某种服务质量 (`QoS`)\
  \ 机制。由于它运行在任何 `IP` 网络上，`iSCSI` 流量是路由的，且其实现成本比 `Fibre Channel` 便宜得多。\n\n### 92. B,\
  \ C, E.\n客户端的 `DNS` 服务器在向根域名服务器以及 `com` 和 `adatum.com` 域权威服务器发送名称解析请求时使用迭代查询。在迭代查询中，服务器会立即回复其所拥有的最佳信息，随后事务结束。当客户端向其\
  \ `DNS` 服务器发送名称解析查询时，它使用递归请求，以便服务器将承担解析名称的责任。递归请求的唯一其他用途是转发器，转发器被配置为将该责任传递给另一个 `DNS`\
  \ 服务器。\n\n### 93. D.\n要访问互联网，工作站的路由表必须包含默认网关项。默认网关是本地网络上的路由器，提供访问其他网络（如互联网）的。要手动创建默认网关项，您使用\
  \ `route add` 命令，并将 `Destination` 为 `0.0.0.0`，`MASK` 为 `0.0.0.0`，`address` 为 `192.168.2.99`，且\
  \ `METRIC` 值低于其他值。\n\n### 94. A, B, D.\n细以太网网络使用 `BNC` 接口。厚以太网网络使用 `N-type` 接口。所有非屏蔽绞对\
  \ (`UTP`) 以太网网络使用 `RJ45` 接口。`F-type` 接口用于同轴电缆。`DB-9` 接口常用于串口。\n\n### 95. A.\n地理围栏（Geofencing）是一种根据客户端位置限制对网络或其他资源访问的通用术语。因此，最好的描述是“你所在的地方”。手势是你“正在做”的，密码是你“知道”的，而智能卡是你“所有”的。\n\
  \n### 96. A.\n热备、温备和冷备备份站点在硬件和软件上有所不同。冷备站点只是远程位置的一个空间。在恢复网络之前，必须采购并安装硬件和软件。因此它是最便宜的且耗时最长。温备站点已有硬件，但仍必须安装和配置。热备站点已安装并配置了所有必要的硬件。温备站点比冷备站点贵，热备站点最贵且运行所需时间最短。\n\
  \n### 97. A.\n主机到站点 VPN 是一种远程访问解决方案，允许用户从家里或旅行期间访问公司网络。站点到站点 VPN 允许一个网络连接到另一个网络，使两个网络上的用户都能访问另一个网络的资源。对于分支机构的连接，这种方案通常比广域网\
  \ (`WAN`) 链路更具效益。主机到主机 VPN 允许两个独立用户之间建立受保护的连接。外网 VPN 旨在为客户、供应商和其他外部合作伙伴提供受限的访问你公司网络的能力。\n\
  \n### 98. B, C, D.\n叶脊-脊干拓扑（leaf and spine topology）在其两层交换机中使用全网状拓扑。这比三层拓扑更贵，但它通过要求任何两个路由器之间路径的跳数相同，降低了延迟。软件定义网络的使用提供了自适应路径确定，而无需使用生成树协议\
  \ (`STP`) 进行二层端口阻塞。\n\n### 99. D.\n`Performance Monitor`（性能监器）是一个 Windows 应用程序，可以长时间创建特定系统和网络性能统计数据的日志。在新计算机上创建此类日志可以作为未来故障排除的基准。`Event\
  \ Viewer`（事件查看器）是一个显示系统日志文件的 Windows 应用程序；它无法创建性能基准。`Syslog` 是最初为 Unix 系统创建的日志编译程序；它不创建性能基准。`Network\
  \ Monitor`（网络监）是一个协议分析器。虽然它可以捕获流量样本以作为未来故障排除工作的参考，但这不能被称为性能基准。\n\n\n\n\n\n### 100.\
  \ C.\n虽然 DoS 攻击通常涉及流量泛洪，但任何阻止服务器运行的攻击都可以称为 `DoS` 攻击。持久性 `DoS` 攻击是指攻击者实际上损坏了目标系统并阻止其运行的攻击。这可以是实际损坏服务器硬件的物理攻击，攻击者也可以通过更改软件或配置设置来禁用服务器。基于洪的攻击包括分布式拒绝服务（`DDoS`）攻击，在这种攻击中攻击者使用成百上千个受恶意软件控制的被称为机器人或僵尸的计算机，向单个服务器或网站发送流量，试图使其瘫痪并阻止其运行。放大型\
  \ DoS 攻击是指攻击者发送的消息需要目标服务器进行长时间的处理，这比简单的消息给它们带了更大的负担。反射型 DoS 攻击是指攻击者将包含目标服务器 IP 地址的请求发送到互联网上的合法服务器（如\
  \ `DNS` 服务器），导致这些服务器发送大量响应从而淹没目标。\n\n## 第 7 章：模拟考试 2\n\n1. **B, D, E.** 蓝牙、`Z-Wave`\
  \ 和近场通信（`NFC`）都是短距离无线技术，能够提供个人域网（PAN）设备之间的通信。其他选项不适用于 PAN 通信。射频识别（`RFID`）使用包含数据的标签，这些标签通常嵌入在宠物中，可以使用电磁场进行读取。集成业务数字网络（`ISDN`）是一种广域网技术，它利用电话基础设施提供高速拨号服务。\n\
  \n2. **E.** 路由器上的每个端口都定义了一个独立的网络段。由于路由器不转发广播传输，三个段中的每一个都形成一个独立的广播域。集线器（`Hubs`）将所有流量转发到所有连接的节点，因此带有集线器的网络段形成单一的冲突域。交换机（`Switches`）仅将流量转发到目标节点，因此连接到每个交换机的工作站都形成一个独立的冲突域。交换机到路由器的链路增加了两个冲突域。共有六个交换工作站，加上集线器段和两条交换机到路由器链路，总共九个冲突域。\n\
  \n3. **D. A.** 远程认证拨入用户服务（`RADIUS`）服务器可以为远程访问服务器提供认证、授权和计服务。入侵检测系统（`IDSs`）、下一代防火墙（`NGFWs`）和网络附属存储（`NAS`）设备不提供此类认证服务。\n\
  \n4. **B.** 多层交换机是一种工作在开放系统互连（`OSI`）参考模型链路层（第 2 层）和网络层（第 3 层）的网络连接设备。在第 2 层，该设备的功能类似于普通交换机，为每个连接的节点创建一个独立的冲突域，并允许管理员创建多个\
  \ `VLANs`。在第 3 层，该设备通过在 `VLANs` 之间转发数据包提供路由功能。虚拟路由器、负载均衡器和宽带路由器是严格的第三层设备，可以路由流量但不能创建\
  \ `VLANs`。\n\n5. **C.** 无类域间路由（`CIDR`）地址斜杠后的数值指定了网络标识符的位数。IP 地址有 32 位，因此如果分配 19\
  \ 位给网络标识符，则留出 13 位给主机标识符。\n\n6. **D.** 在 `TCP/IP` 网络中，网络层的网协议（`IP`）是负责将数据交付到最终目的地的协议，它使用可以通过互联网络路由的\
  \ IP 地址。数据链路协议仅关注局域网（`LAN`）设备之间或通过广域网（`WAN`）连接的点之间的通信。传输层、会话层和应用层不涉及网络数据的实际交付。\n\
  \n7. **C, D.** `iSCSI` 协议运行在标准的 `IP` 网络上，而以太网纤（`FCoE`）变体运行在标准的以太网网上。这两个协议都可以与 LAN\
  \ 流量共享网络，尽管通常建议使用服务质量（`QoS`）机制。原始的光纤实现和 `InfiniBand` 都需要不支持 LAN 流量的专用网络介质。\n\n8.\
  \ **B, D.** `SMTP` 和 `DNS` 都是应用层协议，但它们都不包含基于字符的程序。`Telnet` 和 `FTP` 都是包含命令行客户端程序的协议，其中\
  \ `Telnet` 提供终端仿真功能，`FTP` 提供文件传输功能。\n\n9. **B.** 图中显示的思科符号在网络图中表示交换机，用多个指向向外的箭头符号表示。该符号不用于表示集线器、路由器或网关。\n\
  \n10. **D, E, F.** `DHCP` 服务器使用已知端口 67 和 68。`TFTP` 使用端口 69。这两个协议都不使用端口 64、65 或 66。\n\
  \n11. **C, D.** 变更管理团队通常负责批准实施变更的任务。他们并不负责通知用户变更何时发生，或在之后进行记录。然而，他们负责提供维护窗口，并授权任何停机时间。\n\
  \n12. **C.** 带有双电源的服务器可以用两种模式运行：冗余或组合。在冗余模式下，每个电源都能提供服务器所需的 100% 功率。因此，一个电源故障时服务器可以继续运行，具有容错性。在组合模式下，需要两个电源提供功率，因此一个电源故障会导致服务器宕机。独立模式和热备份不是此类用途的术语。\n\
  \n13. **B.** `paris` 是 FQDN 中的底层域名。`paris` 是 `mydomain` 的子域，而 `mydomain` 是由特定组织注册的二级域名。DNS\
  \ 层次结构的顶层由 `org` 表示，它是顶级域名。在这个 FQDN 中，`www` 不是域名的名称，它是 `paris.mydomain.org` 域中特定主机的名称。\n\
  \n14. **B, C.** `TCP/IP` 套件中的两个无连接协议是网协议（`IP`）和用户数据报协议（`UDP`），它们都使用数据报作为其协议数据单元。以太网使用帧，传输控制协议（`TCP`）使用段。\n\
  \n15. **D.** 数据以线性方式存储在磁带驱动器。一旦将备份数据写入带，就无法选择性地替换单个文件。当你执行恢复任务时，必须恢复最近的完整备份，然后是增量备份，后者会覆盖部分完整备份文件。硬盘是随机访问设备，意味着单个文件可以在磁盘的任何位置写入和读取。当你对硬盘执行增量备份任务时，软件可以使用文件的任何可用版本恢复数据。\n\
  \n16. **B.** 补丁是一个相对较小的更新，旨在解决特定问题，通常是安全漏洞或缺陷。补丁不添加功能或新能力；它们是针对操作系统特定区域的修复。更新、升级和服务包是较大的包，可能包含新功能和/或许多不同的修复。\n\
  \n\n\n\n\n### 17. A, D. 双绞电缆内部的扭绞线对可以防止不同线对之间的信号相互干扰（这被称为串扰）。扭绞还提供了对外部电磁干扰（EMI）的抗性。扭绞对碰撞没有影响。扭绞对于便于连接器的连接没有帮助。扭绞与电缆的允许弯曲半径没有关系。\n\
  \n### 18. D. `top` 工具显示 Unix/Linux 系统上当前运行进程的性能信息。其他选项均是不显示运行进程的工具。`netstat` 是一个允许你查看活动网络连接和\
  \ TCP/IP 流量统计的工具。它不测量系统性能。`dig` 工具用于生成域名系统（DNS）查询。`perfmon` 是 Windows 性能监控工具；没有名为该名称的\
  \ Unix/Linux 工具。\n\n### 19. B. 软件即服务（SaaS）模型为消费者提供对特定应用程序（如电子邮件）的访问，这些运行在提供者的服务器上。基础设施即服务（IaaS）为消费者提供处理、存储和网络资源，他们可以使用这些资源来安装和运行他们选择的操作系统和其他软件。平台即服务（PaaS）为消费者提供了在提供者安装的服务器上安装他们选择的应用程序的能力。\n\
  \n### 20. D. 在 SIEM 中，取证分析是一个根据设定的标准和时间段在多台计算机日志上搜索特定信息过程。其他三个选项指定了其他的 SIEM 功能。数据聚合是整合来自多个源的日志信息的过程。关联是将具有共同属性的日志事件链接在一起的过程。保留（Retention）是对日志数据的长期存储。\n\
  \n### 21. A. DHCP 客户端使用广播在本地网络上传输 `DHCPDISCOVER` 消息。随后，要求 DHCP 服务器响应这些广播。DHCP 客户端无法使用单播、多播或任播消息来与\
  \ DHCP 服务器建立联系，因为客户端没有办法获取 DHCP 服务器的地址。\n\n### 22. A. 二层隧道协议（L2TP）是一种 VPN 协议，它可以创建形成\
  \ VPN 连接的隧道，但它不会对通过隧道的流量进行加密。为了实现这一点，它需要一个提供加密的独立协议，例如 `IPsec`。点对点隧道协议（PPTP）和安全套接层（SSL）都能够加密它们创建的隧道中的流量。\n\
  \n### 23. C, D. IEEE 802.11b、802.11g 和 802.11n 网络均可以使用 2.4 GHz 频段进行传输，可能会受到使用相同频率的无线电话的干扰。然而，IEEE\
  \ 802.11a 和 802.11ac 使用 5 GHz 频，不会受到 2.4 GHz 手机的干扰。\n\n### 24. C. Switch 机是一种数据链路层设备，它实际上为连接到其任一端口的设备执行桥的功能。因此，它可以被描述为`多端口网桥`。`多端口重复器`是集线器的另一种术语，而`多宿主路由器`是一种冗余，因为根据定义，所有路由器都是多宿为主的——即连接到多个网络。不存在多播集线器这种设备。\n\
  \n### 25. D. “带外”（out-of-band）一词描述任何不通过生产网络访问设备的管理访问。将笔记本电脑接入控制端口（console port）可以避开网络，因此被认为是带外管理的一个示例。带内管理（in-band\
  \ management）描述的是一种通过生产网络的访问方法。客户端到站点（Client-to-site）是一种虚拟专用网络（VPN）连接，而自带设备（BYOD）是一项定义用户是否以及如何被允许将其个人设备连接到网络的策略。\n\
  \n### 26. A, B, C, D. 密码越长，越难破解。公司策略通常要求密码具有最小长度。较大的字符集也会使密码更难破解，因此要求大写字母、小写字母、数字和特殊字符是常见的。更改密码会强制破解过程重新开始，因此策略通常要求频繁更改密码，并要求用户在每次更改时创建唯一的密码。\n\
  \n### 27. B. 使用人类物理特征验证用户身份的技术被称为生物识别。生物识别设备可以根据指纹、视网膜图形、声纹和其他特征识别用户。\n\n### 28.\
  \ B, C, D. 选项 B 包含一个 `p`，它不是十六进制数字。选项 C 包含大于 16 位的块。选项 D 仅包含七个 16 位的块（且没有双冒号），而不是\
  \ 128 位 IPv6 地址所需的八个块。选项 A 中的地址 `fe00::c955:c944:acdd:3fcb` 符合 IPv6 格式，其中双冒号替换了三个零块。在未压缩的情况下，该地址显示如下：`fe00:0000:0000:c955:c944:acdd:3fcb`。\n\
  \n### 29. A. `fail close`（故障关闭）和 `fail open`（故障开启）术语是指电子锁在断电时的默认位置。安全通常是安全的权衡，在发生导致停电故障的情况下，门是永久锁定还是永久开启是一个关键因素。`fail\
  \ close` 和 `fail open` 不适用于运动检测器或摄像头。蜜罐（honeypot）是一种用于吸引潜在攻击者的计算机、应用程序或网站；它不是物理安全机制。\n\
  \n### 30. C. 视频监控可以监控敏感区域内所有用户的活动，无论是否授权。通过放置设备，甚至可以监控计算机输入的特定命令。身份证、钥匙和运动检测可以指示敏感区域内人员的存在，但它们无法监控特定的活动。\n\
  \n### 31. C. IP 地址 `127.0.0.1` 是一个专用回环地址，将输出 IP 流量直接导入输入缓冲区。使用该地址进行 `ping` 测试表明计算机的\
  \ TCP/IP 栈工作正常，但流量从未到达网络适配器或网络，因此测试无法确认适配器工作正常或计算机具有正确的网络地址。\n\n### 32. B, C. 多因素认证结合了两种或多种验证方法，降低了入侵者在身份验证过程中成功伪装用户的概率。密码和视网膜扫描是多因素认证系统的示例。智能卡和\
  \ PIN（等同于密码）是多因素认证的示例，因为它要求用户提供他们所知道的和他们所拥有的。多因素认证指的是系统要求的身份证明，而不是实现系统的服务器数量。因此，使用远程拨号用户服务（RADIUS）服务器并不是多因素认证的示例。需要两个密码的系统不是多因素认证的示例，因为攻击者破解两个密码的难度一样。多因素认证需要两种不同形式的认证。\n\
  \n### 33. C. 要访问互联网，工作站的路由表必须包含默认网关条目，其网络目的值为 `0.0.0.0`。工作站的路由表不需要指定域名系统（DNS）服务器的地址。回环（`127.0.0.1`）和多播（`224.0.0.0`）地址是正常的路由表条目，不会影响互联网访问。\n\
  \n\n\n\n\n### 34. A, D. 多模光缆使用 LED 光源，且弯曲半径比单模光缆小。单模光缆的纤芯更细，可以跨越比多模光缆更远的距离。光纤不是导体，因此不需要接地。\n\
  \n### 35. D. 身份验证（Authentication）是确认用户身份的过程。智能卡和密码是网络设备常用的两种身份验证因素。授权（Authorization）定义了授予已验证用户的访问类型。计费（Accounting）和审计（auditing）都是跟踪和记录用户在网络上活动的方法，例如用户登录的时间以及连接了多久。\n\
  \n### 36. B, D. 以太网从未使用过环形或网状拓扑。最早的太网使用了通常被称为厚以太网（Thick Ethernet）或 `10Base5` 的物理层实现。该网络在总线拓扑中使用同轴电缆。随后的以太网标准在星型拓扑中使用双绞线或光纤。\n\
  \n### 37. C, D. 禁用服务集标识符（`SSID`）广播可以防止无线网络出现在客户端中。客户端必须指定它们想要连接的 `SSID`。介质访问控制（`MAC`）地址过滤是访问控制列表（`ACL`）的一种形式，维护在接入点中，包含允许访问网络的设备地址。这两种机制都让未经授权的设备更难连接到接入点。其他两个选项无法帮助防止未经授权的访问。Kerberos\
  \ 是 Active Directory 使用的身份验证协议，将接入点移动到筛选子网（或 `DMZ`）无法解决该问题。\n\n### 38. B, D. 带宽限制（Bandwidth\
  \ throttling）是一种流量整形技术，可防止特定数据流传输过多的包。速率限制（Rate limiting）是一种控制发送系统传输速率的流量整形技术。广播风暴（broadcast\
  \ storm）是一种网络交换环路。NAT（网络地址转换）是私有网络共享注册 IP 地址的方法。最后两个中都不是流量整形技术。\n\n### 39. E, F.\
  \ 网络交换机的主要功能是根据其介质访问控制（`MAC`）地址处理数据包，这使其成为数据链路层设备。然而，多协议交换机是可以同时根据 IP 地址执行路由功能的设备，它们运行在网络层。交换机通常与\
  \ OSI 模型的其他层没有关联。\n\n### 40. B. 不广播的 `SSID` 客户端无法检测，因此你必须手动输入。安全协议也是不可检测的，因此你必须从笔记本电脑提供的选项列表中选择\
  \ `WPA2` 协议。\n\n### 41. C. IEEE `802.11ac` 标准与 `802.11` 工作组的所有无线局域网（`WLAN`）标准一样，使用\
  \ `CSMA/CA` 进行介质访问控制。`802.1X` 标准定义了一种身份验证机制，不需要介质访问控制机制。IEEE `802.3`（以太网）标准使用不同的介质访问控制机制：载波监听多路冲突检测（`CSMA/CD`）。\n\
  \n### 42. D. 包含分界点和骨干交换机的地方称为主配线架（`MDF`）。中间配线架（`IDF`）是本地电信设备的位置，例如水平布线与骨干链路之间的接口。平均故障间隔时间（`MTBF`）和远程桌面协议（`RDP`）不是网络布线位置。\n\
  \n### 43. A. 地理围栏（`Geofencing`）是根据客户端位置限制网络或其他资源访问技术的通用术。在无线网络中，地理围栏目的是防止设施外的未经授权客户端连接网络。通过只允许具有强信号的用户连接，你可以帮助防止外部用户访问。本地身份验证是一种应用程序或服务，它会触发身份验证请求，用户在获得访问权限之前必须做出响应。端口安全（Port\
  \ security）是保护交换端口访问的方法。运动检测是一种设计用于个人侵入受保护区域时触发通知或报警的系统。其他所有选项都与信号强度无关。\n\n### 44.\
  \ C. 社会工程（Social engineering）是指通过联系用户并伪装成对该数据有合法需求的人来获取敏感数据的做法。没有任何软件或硬件解决方案可以防止它；唯一的方法是教育用户潜在的危险，并建立策略，告知用户在遇到社会工程尝试时该如何做。社会工程不是病毒或其他形式的恶意软件，因此杀病毒软件对其无效。社会工程没有实现在网络流量中，因此防火墙无法对其进行过滤，`IPsec`\
  \ 也无法防御它。\n\n### 45. C. B 类地址使用前两个字节作为网络标识符，产生的二进制子网掩码为 `11111111 11111111 00000000\
  \ 00000000`。十进制形式的子网掩码为 `255.255.0.0`。`255.0.0.0` 掩码用于 A 类，`255.255.255.0` 掩码用于\
  \ C 类。`255.255.255.255` 是当前网络的广播地址。\n\n### 46. B. Alice 实现的所有机制旨在让任何篡改或物理破坏网络硬件设备的尝试立即显现。因此，这是一种篡改检测。资产跟踪用于定位和识别特定的硬件组件。地理围栏是一种根据信号强度限制网络访问的无线网络技术。端口安全是指对交换端口的保护。\n\
  \n### 47. A. 因为管理站点是加密的，你必须使用 `https://` 前缀来访问它。因为管理站点使用了非默认端口号 `12354`，你必须在冒号后服务器名称加上该数字。\n\
  \n### 48. C. 禁用 `SSID` 广播是隐藏无线网络存在的一种方法，但如果入侵者知道那里有一个网络，捕获无线设备传输的数据包并从中读取 `SSID`\
  \ 是件简单的事。其他选项没有解释抑制 `SSID` 广播的弱点。没有 `SSID` 无法连接到无线网络。`SSIDs` 由接入点管理员设置；它们没有打印在设备的标签上。`SSIDs`\
  \ 相对容易找到，但猜测它们并不比猜密码更容易。\n\n### 49. A. 在私有云中，使用云服务的同一组织也是提供这些服务的基础设施的唯一所有者。在公有云模型中，一个组织作为提供者，另一个组织消费提供者的服务。混合云是公共和私有基础设施的结合，因此消费者组织仅是基础设施的部分所有者。不存在所谓的即席云（ad\
  \ hoc cloud）模型。\n\n### 50. B. 入职（On-boarding）和离职（off-boarding）是身份管理过程，用户在组织的身份和访问管理（`IAM`）系统中添加或删除。这为新用户授予使用网络所需的权限，在他们职位变动时修改权限，并在他们离开公司时撤销权限。入职和离职不是数据泄露防护、事件响应或库存管理过程。\n\
  \n\n\n\n\n### 51. B, D.\n标准的 VPN 通常使用全隧道（full tunneling），即系统所有的网络流量都经过封装和加密后进行传输。分隧道（Split\
  \ tunneling）是该方法的一种变体，其中只有部分系统流量使用 VPN 连接；其余流量则以正常方式通过网络进行传输。管理员可以选择哪些应用程序和设备使用\
  \ VPN。分隧道可以节省 VPN 使用的 Internet 带宽，并在无需封装的情况下提供对本地网络服务的访问。分隧道并不提供额外的数据完整性保护，也不会通过多路复用提高性能。\n\
  \n### 52. B, C.\n如果没有方法让未经授权的人访问数据中心，那么就不存在有人向开启状态的端口插入设备的危险。如果交换机使用访问控制列表（`ACL`）来指定允许连接到它的系统的介质访问控制（`MAC`）地址，则不需要禁用未使用的端口，因为任何插入开放端口的未知设备都将无法获得网络访问权限。另外两个选项不是有效理由。未插接的端口在交换机位置仍可能受到攻击。启用端口并不困难，因此为了为了纳新用户而保持端口开启状态并不是有效理由。\n\
  \n### 53. C.\n没有任何策略可以防止用户创建易被猜测的密码。唯一有帮助的操作是教育用户，攻击者经常能够利用熟悉的名字和日期等信息来猜测密码。强制更频繁地更改密码并迫使用户更改选择密码的方法，增加最小密码年龄值也无如此。分配随机密码可以解决该问题，但用户的投诉和忘记密码可能会产生比其解决的更大的问题。\n\
  \n### 54. A, B, C, E.\n`ACLs` 通过过滤用户名、介质访问控制（`MAC`）地址、IP 地址或其他标准来限制对网络设备的访问。路由器、服务器、交换机和无线接入点（`WAPs`）都可以使用\
  \ `ACLs` 来控制对它们的访问。集线器（Hubs）是纯物理层设备，用于中继电信号或光纤信号。它们没有访问控制机制。\n\n### 55. D.\n角色分离（Role\
  \ separation）是为每个服务器角色或应用程序创建不同虚拟服务器的做法。除了提供其他益处外，这还迫使入侵者必须对多个服务器发起攻击才能禁用整个网络。地理围栏（Geofencing）是一种限制无线网络访问的技术。网络分段（Network\
  \ segmentation）描述了创建多个虚拟局域网（`VLANs`）或部署防火墙以隔离网络部分的过程。`VLAN hopping` 是一种攻击类型，入侵者向交换机发送命令消息，将一个端口从一个\
  \ `VLAN` 转移到另一个。最后三个选项中没有一个指的是虚拟机部署。\n\n### 56. A, C, D.\n`DHCP snooping` 是某些网络交换机中的一种功能，可防止恶意\
  \ `DHCP` 服务器向客户端分配 IP 地址。它还可以检测 `DHCP` 释放或拒绝消息是否通过 `DHCP` 事务起始端口的其他端口到达。虽然 `DHCP\
  \ snooping` 可以防止 `DHCP` 客户端被分配错误的 IP 地址，但它不能直接防止动态域名系统（`DNS`）服务器缓存被错误信息投毒。\n\n###\
  \ 57. D.\n在这种场景下，只有一个用户报告了问题。因此，最可能的下一步下一步是在连接到同一网段的另一台计算机上执行相同的任务。如果你能够成功执行该任务，那么问题很可能位于用户的计算机或到交换机的连接上。由于没有其他用户报告相同的问题，网络上的服务器和交换机可能都在正常运行。检查路由器是没有必要的的，因为用户和服务器位于同一个网络上。\n\
  \n### 58. D.\n`captive portal`（强制门户）是显示给尝试访问公共无线网络的用户的网页。用户在获得访问权限之前通常必须提供身份识别、提交凭据、提供支付或接受用户协议。`captive\
  \ portal` 并不指向某种类型的攻击。\n\n### 59. B.\n在识别问题后，下一步是建立理论。可能的故障是远程服务器上的 `DNS` 进程损坏或未运行。另一种可能是性的防火墙阻止了访问\
  \ `DNS` 服务器的 UDP 端口。\n\n### 60. B, D.\n`HTTPS` 的已知端口是 443。不安全的 `HTTP` 端口是 80。其他选项都不是\
  \ `HTTP` 的端口。端口 25 用于简单邮件传输协议（SMTP），而端口 110 用于邮局协议（POP3）。\n\n### 61. A, C, D.\n\
  负载均衡器通常根据管理员设置的规则处理的流量。负载均衡器可以根据服务器的当前负载或响应时间将流量分配到一组服务器中。负载均衡器通常不使用硬件配置来引导流量，这是一个随时间变化的因素。\n\
  \n### 62. D.\n由于只有一个用户报告了困难，问题很可能在于用户的计算机。`DNS` 服务器、代理服务器或路由器问题会影响多一个用户。\n\n###\
  \ 63. A.\n`VLAN hopping` 是一种向交换机发送伪命令将端口从一个 `VLAN` 转移到另一个的方法。这可以让攻击者连接到敏感的 `VLAN`。`VLAN\
  \ hopping` 并不修改交换机的跳接连接，而是修改其 `VLAN` 分配。无法重命名交换机的默认 `VLAN`。\n\n### 64. A.\n影响整个网络的问题应具有最高优先级。这包括关键骨干路由器的故障。影响多个\
  \ `LAN` 或整个部门的问题通常被赋予下一个优先级。影响 `LAN` 上共享应用程序服务器的问题应被赋予下一个优先级。单个用户计算机的问题与其他报告的问题相比，优先级最低。\n\
  \n\n\n\n\n### 67. A\n逻辑炸弹（Logic bomb）是插入合法软件产品中的代码，当满足特定条件时会触发恶意事件。因此，它可以同时影响有线和无线客户端。其他选项都是针对无线网络的攻击。取消身份验证（Deauthentication）是拒绝服务（DoS）攻击的一种，攻击者通过发送取消身份验证帧来针对无线客户端，导致客户端断开连接。此类攻击的目标通常是迫使客户端连接到一个被称为“邪恶双生胎”（evil\
  \ twin）的伪造访问点。邪恶双生胎是无线网络上的一个欺骗性访问点，它模仿合法访问点的服务集标识（SSID），旨在诱骗用户。无线战争攻击（War driving）是一种攻击方法，通过带着计算机在社区内开车行驶，扫描未受保护的无线网络。\n\
  \n### 68. B, E\n将所有无线设备升级到 `802.11n` 将使它们能够使用 `5 GHz` 频段，并避免周围网络产生的干扰流量。将设备配置为使用\
  \ `5 GHz` 频段提供更多可用通道，并避免来自 `2.4 GHz` 网络的干扰。其他选项无法解决该问题。无线网络使用的加密类型与设备避免周围网络产生干扰的能力无关。抑制服务集标识（SSID）广播对设备连接到网络没有帮助。如果连接问题是由其他网络的干扰引起的，那么升级设备上的固件不太可能产生任何影响。\n\
  \n### 69. A\n在 Windows 系统上使用 `-a` 参数运行 `arp` 实用程序显示地址解析协议（ARP）缓存的内容，如下所示。缓存包含了网络上\
  \ ARP 已解析为介质访问控制（MAC）地址的 IP 地址记录。`ping`、`tracert` 和 `netstat` 实用程序无法此类输出。\n\n###\
  \ 70. C\n图中所示的设备是剥线/压线器（crimper），通过在长度较短的散装电缆两端连接接头来制作跳线线。该工具无法拨打电话、在电线上产生测试信号或测量电流。\n\
  \n### 71. B\n图中所示的设备是打线刀（punchdown tool），用于将非屏蔽双对电缆的末端连接到模块化墙面板和配线架使用的刀座式接子（keystone\
  \ connectors）。在将电缆中的单线与接子对齐后，使用该工具将每根线压入插槽中。该工具还会切断线皮以建立电气接触并修剪线头。图中所示的工具不是压线器、测试机（butt\
  \ set）或信号发生器定位仪。\n\n### 72. C, E\nIEEE `802.11g` 支持高达 `54 Mbps` 的传输速度，并与 `802.11b`\
  \ 设备向下兼容。IEEE `802.11n` 也与 `802.11b` 向下兼容，运行速度高达 `600 Mbps`。蓝牙不兼容任何 IEEE `802.11`\
  \ 标准。IEEE `802.11` 无法以 `54 Mbps` 速度运行，尽管 `802.11a` 可以，但它不兼容 `802.11b`。\n\n### 73.\
  \ A, B\nLinux 和 Cisco IOS 操作系统都包含 `traceroute` 实用程序。Windows 有它自己的版本的实用程序，但被称为 `tracert`。CSU/DSU\
  \ 无法运行 `traceroute` 命令。\n\n### 74. C, E\nWLAN 可以使用自形成拓扑（ad hoc topology），即设备之间直接通信；也可以使用基础设施拓扑（infrastructure\
  \ topology），即无线设备连接到访问点。总线、星型和网状（mesh）拓扑仅用于有线网络。\n\n### 75. C\n在这种场景下，最佳解决方案是使用现有的\
  \ CATV 服务进行互联网连接。CATV 比标准的调制解调器服务提供更快的数据速率，并支持 VPN 连接。专用的分时 T-1 线路昂贵，通常不用于远程用户连接。由于您的电话线没有通过线管布置，且距离中心办公室超过\
  \ 18,000 英尺，您可能无法使用 DSL 技术，因为这需要高质量的线路且靠近中心办公室。\n\n### 76. C\n客户的 IP 地址、子网掩码和默认网关值对于她的家庭网络来说是合适的。网络地址中出现零\
  \ 并没有问题。因此，在给出的选项中，唯一的逻辑选择是工作站的网络线损坏或未插好。\n\n### 77. D\n生成树协议（STP）防止数据包因冗余链路而在交换机之间无限循环。创建冗余链路是防止交换机故障的良好预防措施，但通过多个链路传输的数据包可以在交换机之间无限循环。STP\
  \ 创建一个交换链路数据库并关闭冗余链路，直到需要它们为止。列出的其他三种协议均无法执行此功能。网络地址转换（NAT）是一种允许私有网络共享 IP 地址的路由方法。路由信息协议（RIP）传播路由表信息到其他路由器。虚拟局域网（VLAN）是一种在交换机内部创建多个广播域的组织工具。\n\
  \n### 78. C\n在这种场景下，只有一个 LAN 的用户在连接互联网和其他内部 LAN 时遇到问题。这说明问题仅存在在该 LAN 内部。由于用户可以成功连接到本地资源，问题不在于计算机、连接用户到交换机或骨干网电缆上。因此，最可能的问题是连接该\
  \ LAN 到骨干网的路由器。由于其他内部 LAN 的用户没有报告连接互联网的问题，该问题可能不涉及互联网路由器。\n\n### 79. B\n约定的 99.9%\
  \ 保证可用性将是服务水平协议（SLA）的一部分，它是提供商与订阅者之间的合同，规定了约定服务的可用百分比。其他三个选项均不包含保证性语言。可接受使用政策（AUP）规定了员工何时以及如何使用公司硬件软件资源。非保密协议（NDA）规定了员工可以在公司外部讨论的公司信息。自带设备（BYOD）政策规定了员工可以在公司网络上使用的个人电子设备，并记录了连接和安全程序。\n\
  \n### 80. A, B\n网桥可以将单个网络划分为两个冲突域，因为它只转发目标是向网桥另一侧的数据包。交换机为每个端口创建一个独立的冲突域。网桥和交换机都会转发所有广播包，因此它们为整个网络维持单一广播域。集线器维持单一冲突域和一个单一广播域。路由器创建两个冲突域，但它不转发广播，因此也创建两个广播域。\n\
  \n\n\n\n\n### 81. A. 媒体访问控制（`MAC`）地址硬编码在网络接口适配器中，不易更改。出于此目的，也没有必要更改它们。首先，你必须更改 Web\
  \ 服务器的 IP 地址。这是因为路由器另一侧（受保护子网）的计算机必须使用与内部网络地址不同的 IP 网络地址。接下来，你将必须将内部网络计算机上的默认网关设置更改为内部网络路由器的地址，以便流量可以转发到受保护子网。最后，你必须更新域名命名系统（`DNS`）服务器上的资源记录，以反映\
  \ IP 地址的变化。\n\n### 82. C. 短路是指电缆的一端连接到两个或多个引脚，或者当电缆内部两根或多根导线的导体相互接触时。这将导致施加在电缆一端单个引脚上的音调在另一端的多个引脚上被听到。其他三个选项都不会导致这种情况发生。开路表现为无法检测到电缆上的信号，这表明电缆内部某处存在断路，或者其中一个或两个连接器与引脚连接不良。分接对（Split\
  \ pair）是指电缆两端以完全相同的方式错误映射了两根导线的连接。串扰（Crosstalk）是由于一根导线上的信号泄漏到其他导线引起的干扰。\n\n### 83.\
  \ B. 办公环境中的电梯机械、荧光灯具和其他电气设备会产生磁场，导致电磁干扰（`EMI`）。当铜制电缆距离此类设备太近时，磁场会在电缆上产生电流，干扰网络设备交换的信号。如果网络用户每次在电梯机械运行时都遇到问题，那么\
  \ `EMI` 可能是问题的原因。串扰和衰减都可以导致间歇性的网络通信问题，但它们不会由电梯机械引起。延迟（Latency）描述网络传输中的通用延迟，而不是间歇性的数据包延迟。\n\
  \n### 84. B, D. 在双主（active-active）配置中，服务器可以在它们之间平衡入的客户端负载。由于所有活动服务器都在为客户端提供服务，集群的整体性能得到了提高。双主和主备（active-passive）配置都提供容错能力。数据封装不是任何一种配置的考虑因素。\n\
  \n### 85. D. `WAP` 可能被配置为不广播网络的 `SSID` 以作为安全措施，因此你应该首先尝试通过手动输入 `SSID` 来访问它。在连接到\
  \ `SSID` 的过程中，你无法输入 `WPA2` 密码。将笔记本电脑移动到靠近接入点或远离可能的电磁干扰源可能是解决问题的方法，但在这种情况下，它们不应该是首先尝试的。\n\
  \n### 86. D. `802.11b` 和 `802.11g` 标准不支持 `5 GHz` 通信。将接入点配置为支持 `2.4 GHz` 是 `802.11b`\
  \ 和 `802.11g` 连接网络的唯一方法。`5 GHz` 频支持自动信选择，因此不需要在每个笔记本电脑上手动配置通道。`5 GHz` 频支持 `MIMO`，`802.11n`\
  \ 笔记本电脑应该连接。`802.11b` 标准支持 `2.4 GHz` 频。\n\n### 87. D. 名称服务器（`NS`）资源记录标识特定 `DNS`\
  \ 区域的权威服务器。指针记录（`PTRs`）用于将 IP 地址解析为主机名。邮件交换（`MX`）记录标识特定域的邮件服务器。服务记录（`SRVs`）标识特定应用程序的指定服务器。这些其他选项都没有标识区域的权威服务器。\n\
  \n### 88. B. 无线局域网（`WLANs`）使用的 `2.4 GHz` 频由宽度为 `20`（或 `22`）`MHz` 的通道组成。然而，通道之间的间隔仅为\
  \ `5 MHz`，因此存在导致干扰的通道重叠。通道 `1`、`6` 和 `11` 是唯一彼此远以避免与相邻通道任何重叠的通道。这就是为什么它们经常被推荐的原因。但在这种情况下，这些通道被其他网络挤满了。因此，你应该使用一个尽可能远离拥挤通道的通道。通道\
  \ `2`、`5` 和 `10` 均紧邻拥挤通道，但通道 `9` 距离最近的拥挤通道至少两个通道。因此，你应该配置你的设备使用通道 `9`。\n\n### 89.\
  \ A. 化学品安全数据表（`MSDSs`）是由化学、电气和机械产品制造商创建的文档，规定了与它们相关的潜在风险和危险，特别是关于易燃性和毒性溢出的可能性。记录良好的网络应该存档所有用于构建和维护它的化学产品和硬件产品的\
  \ `MSDS` 文档。可以从制造商或环境保护署（`EPA`）获取 `MSDS`。静电放电（`ESDs`）、保密协议（`NDAs`）和自带设备（`BYOD`）策略与建筑内容内部固有的危险无关。\n\
  \n### 90. C. Alternative B `PoE` 变体可以使用 `CAT 5` 或更好的 `10Base-T` 或 `100Base-TX` 电缆中的空闲线对为连接的设备供电。Alternative\
  \ A 和 `4PPoE` 变体不能这样使用空闲线对；它们使用同时传输数据的线对来供电。对于千兆太网或更快的安装，Alternative B 同样可以使用数据线对。\n\
  \n### 91. D. 互联网存储命名服务（`iSNS`）是一种应用程序，为 `iSCSI` 初始化器自动发现位于网络上的目标。`iSNS` 还可以作为光纤通道设备的发现服务。互联网控制消息协议（`ICMP`）和域名命名系统（`DNS`）无法注册\
  \ `iSCSI` 目标。`iDNS` 不存在。\n\n### 92. C. `WPA` 已发现存在漏洞，`WPA2` 设计用于解决这些漏洞，因此你应该使用 `WPA2`\
  \ 而不是 `WPA`。抑制 `SSID` 广播不会阻止用户连接到网络，MAC 过滤在增强安全性的同时不会将 MAC 地址暴露于不必要的风险中。\n\n###\
  \ 93. B, D, E. 终端连接器（`SC`）、机械传输 -注册插座（`MT-RJ`）和直端头（`ST`）都是光纤连接器的类型。`DB-9` 是用于串口的\
  \ D 型壳连接器。巴拿头-内曼（`BNC`）是一种用于同轴电缆的连接器。`RJ11` 用于双绞线进行电话连接。\n\n### 94. E. 物联网（`IoT`）由通常是被动的设备组成，通过安装网络客户端使其参与\
  \ IP 网络而变得智能。列表中列出的所有设备都可以作为“智能”设备，允许远程用户通过互联网与其交互。\n\n### 95. D. 物理层定义了用于构建网络的电缆的机械电气特性。数据链路层定义了特定的网络（LAN\
  \ 或 WAN）拓扑结构及其特性。你将实现的物理层规范取决于你选择的数据链路层协议。网络层、传输层和应用层不涉及电缆和拓扑结构。\n\n\n\n\n\n## 96.\
  \ D. 分配给工作站的 `169.254.203.42` 地址来自自动私有 IP 地址（APIPA）的 `169.254.0.0/16` 网络地址。APIPA\
  \ 是动态主机配置协议（DHCP）客户端无法从 DHCP 服务器获取地址时分配 IP 地址的标准。该工作站的 DHCP 客户端已激活，且由于没有其他人遇到问题，你可以假设\
  \ DHCP 服务器运行正常。对于 APIPA 地址而言，子网掩码值是正确的，且 APIPA 不提供默认网关或域名系统（DNS）服务器地址。因此，在提供的所有解释中，只有\
  \ DHCP 范围耗尽可能是导致该问题的原因。\n\n## 97. C. 操作系统会立即检测到重复的 IP 地址并在相关计算机上显示错误消息或通知。因此，如果另一个系统正在使用她的\
  \ IP 地址，遇到问题的用户会立即收到通知。其他选项都是可能的问题的原因，但更难排障。\n\n## 98. C, D. `ipconfig /release`\
  \ 命令终止当前的 DHCP 地址租用。然后，`ipconfig /renew` 命令导致客户端开始协商新租用过程，这次是与授权的 DHCP 服务器进行。`dump`、`lease`\
  \ 和 `discard` 不是有效的 `ipconfig` 参数。\n\n## 99. C. 东西向流量描述数据中心内部的流量流，而南北向流量是指数据中心内部设备与外部设备之间的流量。东西向和南北向术语不属于\
  \ OSI 模型层，也不属于使用的特定设备。\n\n## 100. B. 逻辑炸弹是插入到合法软件产品中的代码，当满足某些条件（例如到达特定时间或日期）时会触发恶意事件。所有其他选项都不涉及软件产品。社会工程是通过联系用户并伪装成对数据有合法需求的人来获取敏感数据的实践。无线攻击（War\
  \ driving）是一种攻击方法，通过带着电脑在社区行驶来扫描未保护的无线网络。邪恶孪生（Evil twin）是无线网络上的欺诈访问点，模仿合法访问点的服务集标识符（SSID），旨在诱骗用户。\n\
