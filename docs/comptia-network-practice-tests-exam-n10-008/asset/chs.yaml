  \ Web 服务器应用程序的管理站点，因此你将该站点配置为加密并使用端口号 12354 代替默认端口。你需要使用以下哪个 URL 来访问管理网站？\n\n1.\
  \ `http://www.adatum.com`\n2. `http://www.adatum.com:12354`\n3. `https://www.adatum.com:80`\n\
  4. `https://www.adatum.com:12354`\n\n### 219. `IPsec` 使用以下哪个协议在通过网络传输之前对数据包进行数字加密？\n\
