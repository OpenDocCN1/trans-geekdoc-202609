  1. 增加范围的租约时间。\n2. 缩短范围的租约时间。\n3. 安装第二个 DHCP 服务器。\n4. 为该子网创建第二个范围。\n\n### 257. DHCP\
  \ 客户端使用广播消息来联系本地子网上的 DHCP 服务器。当本地子网上没有 DHCP 服务器时，通过哪些机制可以将广播消息转发到另一个子网上的 DHCP 服务器？（选择所有项）\n\
  1. `DHCP 继继` (DHCP relay)\n2. `UDP 转发` (UDP forwarding)\n3. `区域传输` (Zone transfer)\n\
  4. `IP 辅助地址` (IP helper)\n\n### 258. 下哪种机制允许管理员在多个名称服务器上维护当前的 DNS 数据库信息，以实现容错和负载均衡的目的？\n\
  1. `多主复制` (Multi-master replication)\n2. `UDP 转发` (UDP forwarding)\n3. `迭代查询` (Iterative\
  \ query)\n4. `区域传输` (Zone transfer)\n\n### 259. 下哪些存储区域网络 (SAN) 协议能够与标准局域网 (LAN)\
  \ 流量共享网络介质？（选择所有项）\n1. `iSCSI`\n2. `光通道` (Fibre Channel)\n3. `FCoE`\n4. `InfiniBand`\n\
  \n### 260. 下哪种协议不用于存储区域网络 (SAN)？\n1. `iSCSI`\n2. `FCoE`\n3. `VoIP`\n4. `光通道` (Fibre\
  \ Channel)\n\n### 261. iSCSI 初始化器使用以下哪些技术在网络上定位 iSCSI 目标？\n1. `活动目录` (Active Directory)\n\
  2. `ICMP`\n3. `DNS`\n\n### 262. 存储区域网络 (SAN) 的最高传输速率是多少？\n1. `8 Gbps`\n2. `16 Gbps`\n\
  3. `32 Gbps`\n4. `128 Gbps`\n5. `256 Gbps`\n\n### 263. 在其功能上，NAS（网络附属存储）与以下哪项密切相关？\n\
  1. `故障转移` (Failover)\n2. `文件服务器` (File server)\n3. `JBOD`\n4. `RAID`\n\n### 264.\
  \ 下哪些关于 NAS（网络附属存储）和存储区域网络 (SAN) 的描述是正确的？（选择所有项）\n1. NAS 提供文件访问，SAN 提供块访问。\n2. NAS\
