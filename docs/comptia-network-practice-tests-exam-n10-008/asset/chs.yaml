  \ 服务器。列出的其他选项均不是 DNS 实用程序。\n\n## 105\nA, E. `ping` 和 `nslookup` 实用程序可以在 Windows、Unix\
  \ 或 Linux 系统上运行。`traceroute` 命令仅在 Unix 或 Linux 上运行，尽管 Windows 有一个对应的版本名为 `tracert`\
