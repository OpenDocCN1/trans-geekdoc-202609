  \ 攻击使用成百上千台感染了恶意软件的计算机（称为“僵尸网络”或“机器人”），向目标服务器泛洪流量，试图将其淹没并防止其运行。反射型 `DoS` 攻击是指攻击者向互联网上的合法服务器（如域名系统\
