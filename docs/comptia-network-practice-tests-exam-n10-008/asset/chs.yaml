  \n1. 配置接入点以抑制 SSID 广播。\n2. 配置所有无线网络设备使用 `5 GHz` 频段。\n3. 将所有网络设备升级到最新的固件。\n4. 配置所有网络设备使用带有\
  \ `AES` 的 `WPA2` 加密。\n5. 将接入点和所有无线客户端设备升级到 `IEEE 802.11n`。\n\n73. 哪一个 Windows 命令行实用程序产生了此处所示输出？\n\
  \n```\nInterface: 192.168.2.24 --- 0x2\n  Internet Address      Physical Address\
  \      Type\n  192.168.2.2           d4-ae-52-bf-c3-2d     dynamic   \n  192.168.2.20\
  \          00-26-c7-7e-00-e0     dynamic   \n  192.168.2.22          00-90-a9-a2-43-8f\
  \     dynamic   \n  192.168.2.27          1c-c1-de-ca-1f-12     dynamic   \n  192.168.2.28\
  \          30-f7-72-38-e9-1d     dynamic   \n  192.168.2.255         ff-ff-ff-ff-ff-ff\
  \     static    \n```\n\n\n\n\n### 76\n你在一家当地电脑商店担任帮助台人员，接到了一个客户的电话，她正尝试使用运行 Windows\
  \ 10 的计算机和有线以太网设备设置家庭网络。客户报告说她无法从工作站访问家中的其他两台电脑，也无法访问互联网。你让她运行 `ipconfig /all` 命令并将结果读给你听。她说她的\
  \ IP 地址是 `192.168.0.2`，子网掩码为 `255.255.255.0`，默认网关为 `192.168.0.1`。以下哪项是客户问题最可能的原因？\
  \ \n\n1. 客户的网络地址不能包含零。\n2. 客户的子网掩码错误。\n3. 客户的网络线损坏或未插好。\n4. 客户的默认网关地址错误。\n\n###\
  \ 77\n某些网络的设计采用了包含冗余路径的交换结构，以实现容错。然而，在这种设计中，数据包可能会在网络中无限循环，这被称为交换环（switching loop）。以下哪种协议通过关闭冗余链路直到其被需要，来防止网络交换环的发生？\
  \ \n\n1. NAT\n2. RIP\n3. VLAN\n4. STP\n\n### 78\n你负责一个由四个内部局域网（LAN）组成的互连网络，每个 LAN\
  \ 有 50 个用户。每个内部 LAN 都使用双绞线千兆以太网链路将用户连接到交换机。四台交换机中的每一台都连接到一个独立的路由器。所有四个路由器都连接到同一个骨干网络，该骨干网络有一个额外的路由器，通过\
  \ T-1 广域网（WAN）链路将公司网络连接到互联网。今天，四个内部 LAN 中的其中一个的用户报告说，当他们今天早上来时，无法访问互联网或另外三个内部局域网的资源。然而，他们可以无问题地访问自己局域网的资源。在这种情况下，哪种网络组件最可能是问题的源头？\n\
  \n1. 问题 LAN 上的交换机\n2. 互联网路由器\n3. 将问题 LAN 连接到骨干网的路由器\n4. 骨干网络上的电缆\n\n### 79\n你正在与一家提供商就公司的电子邮件服务谈判协议。你被要求要求\
  \ 99.99% 的保证服务可靠率，但提供商只愿意保证 99%。最后，你和提供商对 99.9% 的折中方案达成一致。以下哪份文档将包含关于这一特定点的协商条款？\
  \ \n\n1. AUP（用户许可协议）\n2. SLA（服务水平协议）\n3. BYOD（自带设备）\n4. NDA（保密协议）\n\n### 80\n以下哪种类型的网络设备可以在保持单个广播域的同时，将单个网络拆分为多个冲突域？（选择所有适用项。）\
  \ \n\n1. 交换机\n2. 桥接器\n3. 路由器\n4. 集线器\n\n### 81\n你刚刚在公司网络上安装了一个 Web 服务器集群，并配备了一个路由器以创建一个用于放置\
  \ Web 服务器的受保护子网（边界网络）。然而，你现在无法从内部网络的工作站访问 Web 服务器。在能够从内部网络访问受保护子网之前，以下哪项不是你必须完成的任务之一？\
  \ \n\n1. 修改 MAC 地址\n2. 修改 IP 地址\n3. 更新 DNS 记录\n4. 修改默认网关地址\n\n### 82\n你正在使用测号器和寻线器测试一段双绞线。当你对电缆一端的特定引脚施加测号信号时，你在电缆另一端的两个引脚上检测到了信号。你发现了以下哪种故障？\
  \ \n\n1. 分线对（Split pair）\n2. 断路（Open）\n3. 短路（Short）\n4. 串扰（Crosstalk）\n\n### 83\n\
  自从公司搬进新楼以来，网络一直出现间歇性的缓慢和服务中断。你尝试了能想的所有故障排除方法，但未能确定原因。一个特定的用户可能希望通过“叫得响油吃”，每次遇到问题都会给你打电话。一天，当你正在数据中心工作时，你注意到每当听到额外的嗡嗡声，该用户就会打电话。在检查了走廊的门后，你发现包含网络交换机的机架位于电梯机械房旁边。以下哪种情况可能导致了这种间歇性的网络通信问题？\
  \ \n\n1. 瓶颈\n2. EMI（电磁干扰）\n3. 延迟\n4. 串扰\n\n### 84\nRalph 正在安装一对冗余服务器，必须选择以主主活动（active-active）配置还是主备式（active-passive）配置运行它们。以主主活动配置运行服务器提供以下哪些优势，而主备式配置的相同服务器则不具备？（选择所有适用项。）\
  \ \n\n1. 容错\n2. 负载均衡\n3. 数据封装\n4. 提高性能\n\n### 85\n你开始在一家新公司工作，第一天你询问了笔记本电脑的无线接入问题。你被给了一个服务集标识符（SSID）和一个\
  \ WiFi 保护访问第二版（WPA2）密码。稍后，在员工室，当你尝试将笔记本电脑连接到网络时，在其他网络列表中看不到给给你的 SSID。你下一步应该做什么？\n\
  \n1. 离无线接入点（WAP）更近的地方。\n2. 离开员工室的微波炉。\n3. 输入 WPA2 密码。\n4. 手动输入 SSID。\n\n### 86\n\
  你负责一个无线局域网（WLAN），该网络由一台 802.11n 2x2 接入点以及带有网络适配器的笔记本电脑组成。部分笔记本支持 802.11n，大多数支持 802.11g，少数旧型号具有\
  \ 802.11b 适配器。该 WLAN 位于一个有很多其他网络的大楼内，你在 2.4 GHz 频难以找到不拥挤的通道。扫描 5 GHz 频，你发现流量较少，因此你重新配置接入点使用\
  \ 5 GHz 通道。结果是某些笔记本能够连接到网络，而其他不能。连接失败最可能的原因是什么？你必须做什么才能让所有笔记本连接到无线网络？\n\n1. 802.11b\
  \ 标准不支持 5 GHz 频。你必须将这些笔记本的网络适配器更换为新型号以便连接。\n2. 5 GHz 频不支持自动通道选择。你必须为每台笔记本配置与接入点相同的通道，以便所有笔记本连接。\n\
  3. 5 GHz 频不支持多输入输出（MIMO）通信，因此 802.11n 笔记本无法连接到网络。你必须将接入点更换为 802.11g 设备，以便所有笔记本连接。\n\
  4. 802.11g 和 802.11b 标准不支持 5 GHz 频通信。你必须配置接入点支持 2.4 GHz，以便所有笔记本连接。\n\n### 87\n在域名命名系统（DNS）中，区域（zone）是\
