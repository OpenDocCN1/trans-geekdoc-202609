  ## 274. 下列哪个协议使用巨型帧（jumbo frames）来提高存储区域网络的性能？\n\n1. `Ethernet`（以太网）\n2. `IP`\n\
  3. `Fibre Channel`（光纤）\n4. `iSCSI`\n\n## 275. 下列哪个不是三层数据中心架构中某层的名称？\n\n1. `Core`（核心层）\n\
  2. `Intermediate`（中间层）\n3. `Distribution`（分布层）\n4. `Access`（接入层）\n\n## 276. 下列哪个不是叶脊架构（leaf\
  \ and spine）数据中心拓扑优于标准三层拓扑的原因？\n\n1. 叶脊架构布局使用了全网状交换拓扑。\n2. 在叶脊架构拓扑中，所有数据流都需要经过相同跳数。\n\
  3. 叶脊架构拓扑的实现成本比三层拓扑更低。\n4. 叶脊架构拓扑使用软件定义网络来引导流量，而不是使用生成树协议阻塞端口。\n\n## 277. 下列哪项最准确地描述了数据中心内部东西向流量（east-west）和南北向流量（north-south）的区别？\n\
  \n1. 东西向描述 OSI 模型相同层设备之间的流量，而南北向描述 OSI 模型不同层之间的流量。\n2. 东西向是交换机到交换机的流量，南北向是交换机到路由器的流量。\n\
  3. 东西向流量留在数据中心内部，而南北向流量不是。\n4. 东西向是交换机和路由器之间的骨干流量，南北向是终端系统（如服务器）的流量。\n\n## 278.\
  \ 顶交换机（Top-of-rack switches）通常形成数据中心拓扑的哪层？\n\n1. `Leaf`（叶层）\n2. `Backbone`（骨干层）\n\
  3. `Spine`（脊层）\n4. `Core`（核心层）\n\n## 279. 软件定义网络（SDN）架构中的下列哪层由硬件设备组成？\n\n1. `Application`（应用层）\n\
  2. `Control`（控制层）\n3. `Infrastructure`（基础设施层）\n4. `Core`（核心层）\n\n## 280. 在 RFC 7426\
