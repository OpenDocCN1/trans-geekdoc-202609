  ## 2. 授权\n## 3. 会计\n## 4. 审计\n\n## 114. 下列哪个术语描述了这种威胁缓解技术：将单个应用程序和服务部署在虚拟服务器上，以确保在任何时候都只有一个实例受到威胁，而不是在单个服务器上部署多个应用程序？\n\
