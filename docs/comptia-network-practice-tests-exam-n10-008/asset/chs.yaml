  3. VLAN 跳跃允许攻击者更改交换机上的原生 VLAN。\n4. VLAN 跳跃允许攻击者重命名交换机上的默认 VLAN。\n\n64. 你是公司 IT 帮助台的一线支持人员。在上班的第一小时内，你收到了四个故障电话。你的工作是根据严重程度对电话进行排序。在以下哪个问题应该是优先级最低的问题？\n\
  \n\n\n1. 导致单台计算机故障的致命错误\n2. 影响整个网络的关键任务骨干路由器出现的问题\n3. 影响单个局域网（LAN）的应用程序服务器出现的问题\n\
  4. 影响整个部门的订单输入或客户服务呼叫中心资源的问题，涉及多个局域网（LAN）\n\n65. 你正尝试访问位于路由器另一侧的域名系统（DNS）服务器，但你的尝试失败了，错误显示目标端口\
