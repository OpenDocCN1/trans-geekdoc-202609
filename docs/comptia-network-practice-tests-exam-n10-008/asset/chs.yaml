  \ 265. 下哪些是 FCoE 优于光通道的特性？（选择所有项）\n1. FCoE 是可路由的，而光通道不是。\n2. FCoE 的实现比光通道更便宜。\n\
  3. FCoE 包含自己的流量控制机制，而光通道没有。\n4. FCoE 使用标准的以太网硬件。\n\n### 266. 下哪些应用层协议 NAS（网络附属存储）用于向客户端共享文件？（选择所有项）\n\
  1. `CIFS`\n2. `NFS`\n3. `RDMA`\n4. `HTTP`\n\n### 267. 下哪些是 iSCSI 对于光通道的优势？（选择所有项）\n\
