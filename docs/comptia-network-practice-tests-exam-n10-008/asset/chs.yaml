  \n### 53. 一家小型企业的网络管理员正在安装一台计算机作为防火墙，以保护其内部网络免受互联网入侵。管理员应该在以下哪个位置安装防火墙系统？\n1. 私有内部网络的任何位置，只要可以访问互联网即可\n\
