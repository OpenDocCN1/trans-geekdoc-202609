  3. `SFTP`\n4. `TFTP`\n\n### 224. IPsec 使用以下哪个协议在通过网络传输之前对数据包进行数字签名？\n\n1. `ESP`\n\
  2. `SSL`\n3. `AH`\n4. `MSCHAP`\n\n### 225. 在用于保护 浏览器和服务器之间交换流量的安全协议中，哪一个创建得最早？\n\
  \n1. `SSL`\n2. `TLS`\n3. `SSH`\n4. `DTLS`\n\n### 226. 下列用于 Web 服务器或浏览器的安全协议中，哪个在\
  \ 2015 年弃弃，取而代之的是传输层安全 (TLS) 和数据报传输层安全 (DTLS)？\n\n1. `SSH`\n2. `SSL`\n3. `RDP`\n\
  4. `IPsec`\n\n### 227. 查询系统在哪些 DNS 事务中生成递归查询？（多选）\n\n1. DNS 客户端从 URL 将服务器名称 `www.adatum.com`\
  \ 发送到其指定的 DNS 服务器进行解析。\n2. 客户端的 DNS 服务器向根域名服务器发送请求，以查找 `com` 顶级域的权威服务器。\n3. 客户端的\
  \ DNS 服务器向 `com` 顶级域服务器发送请求，以查找 `adatum.com` 域名的权威服务器。\n4. 配置为转发器的客户端 DNS 服务器从 URL\
  \ 将服务器名称 `www.adatum.com` 发送到其 ISP 的 DNS 服务器进行解析。\n5. 客户端的 DNS 服务器向 `adatum.com`\
  \ 域服务器发送请求，以查找与服务器名称 `www` 关联的 IP 地址。\n\n### 228. 下列哪个设备最可能被配置为动态主机配置协议 (DHCP) 服务器？\n\
  \n1. 无线路由器\n2. 无托管交换机\n3. 集线器\n4. 桥接器\n\n### 229. 下列协议负责为主机分配 IP 地址？（多选）\n\n1. 动态主机配置协议\
  \ (`DHCP`)\n2. 地址解析协议 (`ARP`)\n3. 域名系统 (`DNS`)\n4. 文件传输协议 (`FTP`)\n5. 引导启动协议 (`BOOTP`)\n\
