  \n## 67. VLAN 跳跃\n\n虚拟局域网（`VLAN`）跳跃是一种向交换机发送命令将端口从一个 `VLAN` 传输到另一个 `VLAN` 的方法。这使得攻击者将其设备连接到可能敏感的\
  \ `VLAN`。VLAN 跳跃不会修改交换机的配线架连接，只修改其 `VLAN` 分配。重命名交换机的默认 `VLAN` 是不可能的。VLAN 跳跃不能让攻击者更改交换机的原生\
  \ `VLAN`。\n\n## 68. 无线驱动（War Driving）\n\n无线驱动是一种攻击方法，由带着计算机在社区行驶，扫描未保护的无线网络。因此，它只需要一辆汽车和配备无线设备的计算机。无线驱动中的\
  \ *driving* 指的是驾驶车辆，而不是螺丝刀；因此不需要螺丝刀。无线驱动使用无线计算机或其他设备扫描开放网络；因此不需要电话。无线驱动是定位未保护网络的一种手段；它不需要信用卡号，也不涉及盗取信用卡。\n\
  \n## 69. 欺骗\n\n欺骗是修改网络数据包使其看起来像是是由他人发送或发送给他人的过程。这种方法的一种是修改数据包中的媒体访问控制（`MAC`）地址为\
  \ `MAC` 过滤器允许的地址。暴力破解是反复猜测的方法，对于 `MAC` 地址来说是不现实的。域名系统（`DNS`）基于 IP 地址，而不是 `MAC` 地址。无线驱动是寻找未保护无线访问点（`WAPs`）的过程。\n\
