  \ 地址识别为语音设备，以及通过识别已标记为语音 `VLAN` 流量的数据包。无法使用 `IP` 地址或 `DNS` 名称来识别语音流量。\n\n## 第 3\
  \ 章：网络运营\n\n### 1. A, E. 基于 `SNMP` 的网络管理系统由三个部分组成：安装在网络计算机上的管理控制台软件、安装在要管理设备上的 `agents`，以及用于每个\
  \ `agents` 的 `MIBs`。由于由于交换机支持 `SNMP` 管理且已经有了 `agents`，因此它们也有 `MIBs`。因此，你所需要购买网络管理软件并在网络计算机上安装控制台即可。\n\
  \n### 2. A, C. `SNMP` 版本 1（原始版本）使用未加密的团体字符串（community string）。`SNMPv2` 增加了更好的安全性，但它与版本\
  \ 1 的团体字符串不后兼容。修订版本 `SNMP2c` 添加了后兼容性。今天最常见的 `SNMPv3` 包含了更先进的安全性且不使用团体字符串。\n\n###\
  \ 3. B, C. `SNMP` 不是网络管理产品的名称；它只是协议的名称，为网络管理产品中各种组件的交互提供框架。`SNMPv1` 使用团体字符串，而 `SNMPv2`\
  \ 不使用。过渡版本 `SNMPv2c` 保留了版本 1 的团体字符串，以取代新的版本 2 安全系统。当你看到网络接口适配器、交换机、路由器、接入点或其他声称受管理或声称具有网络管理能力的设备时，这通常意味着该设备包含一个\
  \ `SNMP` 代理。今天大多数网络管理产品都支持 `SNMPv3`。此外，许多实现 `SNMPv3` 的网络管理产品还包含对早期未受保护版本的支持，如 `SNMPv1`\
  \ 和 `SNMPv2c`。\n\n### 4. C. 图中所示工具是 Windows 事件查看器，它是是\n\n### 5. A. `Syslog` 是一种标准，旨在促进由设备或进程生成的日志条目（例如\
  \ sendmail `SNMP` 服务器）跨 `IP` 网络传输到消息收集器。`Netstat` 是一个显示连接状态的程序。\n\n### 6. A. 最佳解决方案是实施\
  \ `SNMP`。这包括管理控制台、`agents` 和 `MIBs`。某些 `SNMP` 产品允许你跟踪统计网络信息（历史和当前）并生成报告。协议分析器最适用于。\n\
  \n### 7. A. 安全信息事件管理 (`SIEM`) 是一种结合两种技术的产：安全事件管理 (`SEM`) 和安全信息管理 (`SIM`)。`SNMP`\
  \ 是从代理携带管理信息的协议。\n\n### 9. D. 协议分析器提供网络流量信息；它不解释 Web 服务器日志。\n\n### 10. B. 基线（baseline）是系统在实际运行条件下的性能记录，用于以后在条件变化时进行比较。\n\
  \n### 11. B. 如果服务器耗尽了所有的网络带宽，那么最逻辑的解决方案是增加带宽。\n\n\n\n\n\n## 12. 性能监控\nA. 性能监控工具通常提供中央处理器\
  \ (CPU)、内存、网络和磁盘使用的统计数据，但不提供计算机温度监控。\n\n## 13-15. Syslog 严重级别\nA. 每条 syslog 消息包含一个单数字严重性代码。代码\
  \ 0 最严重，表示导致系统无法使用的紧急情况。代码代码 1 是告警消息，表示需要立即采取行动。代码代码 2 是关键状态消息，代码 3 是错误状态消息。代码 4\
  \ 是警告消息。\n\nB. 每条 syslog 消息包含一个单数字严重性代码。代码代码 1 是告警消息，表示需要立即采取行动。代码 0 最严重，表示导致系统无法使用的紧急情况。代码代码\
  \ 2 是关键状态消息，代码 3 是错误状态消息。代码 4 是警告消息。\n\nD. 每条 syslog 消息包含一个单数字严重性代码。代码 6 表示该消息纯属信息性。代码\
  \ 0 最严重，表示导致系统无法使用的紧急情况。代码代码 2 是关键状态消息，代码 4 是警告消息。代码 7 严格用于调试。\n\n## 16. SNMP 和\
  \ ICMP\nD. SNMP 代理在发生需要注意的事件时发送到控制台的消息称为陷阱（trap）。`alerts` 和 `notifications` 是控制台发送给管理员的消息术语。ping\
  \ 是从一台 TCP/IP 计算机向另一台发送的互联网控制消息协议 (ICMP) 回显请求消息。\n\n## 17. 回滚与监控\nD. `rollback`\
  \ 一词是指卸载或降级更新补丁的过程；它与监控网络接口无关。接口监控器通常会显示接口上发生的传输错误次数、接口正在使用的可用带宽量以及由于错误或丢弃而丢失的数据包数量。\n\
  \n## 18. 数据包丢弃\nB, C. 接口监控器显示的数据包丢弃是由错误（例如格式不正确或不可读的数据包）或丢弃（由于目标是另一个接口而被丢弃的数据包）引起的。重置（Reset）和溢出（Overflow）不是数据包丢弃的原因。\n\
  \n## 19. 性能基准\nD. 性能基准刻画了硬件性能，因此 OS 更新历史对未来的比较几乎没有或完全没有用。基准通常由 CPU、内存、磁盘和网络性能统计数据组成。\n\
  \n## 20. 日志管理\nC, D. 日志经常包含敏感信息，因此使用适当权限保护它们是日志管理至关重要的部分。日志可能会增长到使存储它们的存储介质过载，因此循环（cycling）是一种管理日志大小的技术，通过配置在每次添加新记录时删除最旧的记录来实现。回滚和利用率不属于日志管理任务。\n\
  \n## 21-22. SIEM 概念\nB. 在 SIEM 中，取证分析是根据设定的标准和时间段在多台计算机的日志中搜索特定信息的过程。数据聚合是从多个源整合日志信息的过程。关联（Correlation）是将具有共同属性的日志事件链接在一起的过程。保留（Retention）是对日志数据的长期存储。\n\
  \nA. 在 SIEM 中，数据聚合是从多个源整合日志信息的过程。取证分析是根据设定的标准和时间段在多台计算机的日志中搜索特定信息的过程。关联（Correlation）是将具有共同属性的日志事件链接在一起的过程。保留（Retention）是对日志数据的长期存储。\n\
  \n## 23. 网络性能术语\nC. 当数据流中的单个数据包延迟时，导致连接问题被称为抖动（jitter）。虽然这种状况可能不会对异步应用程序产生问题，但实时通信（如\
  \ IP 电话协议 VoIP 或流媒体视频）可能会受到中断，该现象也由此得名。延迟（Latency）描述的是网络传输中的通用延迟，而不是单个数据包的延迟。衰减（Attenuation）是信号在通过网络介质传输时的减弱。瓶颈（Bottleneck）是指由于故障或缺陷的组件导致所有流量被延迟的状态。\n\
  \n## 24. 以太网故障\nA, B, C, D. 所有这些情况都是全双工以太网网络的故障。当网络接口生成的数据包小于 64 字节的允许长度时，会发生短帧（Runt\
  \ frames）。当帧大于 1518 字节的最大允许长度时，会发生巨帧（Giants）。在半双工网络上，冲突是正常的，但在全双工网络上，冲突被视为故障。当网线过长时，会发生晚冲突（Late\
  \ collisions）。\n\n## 25. 抖动详情\nB, C. 抖动是有线网络上的连接问题，是由网络拥塞、不同路由或队列问题导致单个数据包延迟引起的。当数据流中的单个数据包延迟时，导致连接问题被称为抖动。虽然这种状况可能不会对异步应用程序（如电子邮件和即时消息）产生问题，但实时通信（如\
  \ IP 电话协议 VoIP 或流媒体视频）可能会受到间歇性中断，该现象也由此名。\n\n## 26. 日志工具\nA. Syslog 是一种标准，旨在方便设备或进程（如\
  \ sendmail SMTP 服务器）生成的日志条目跨网络协议 (IP) 网络传输到称为 syslog 服务器的日志收集器。网络监控（`Netmon`）是一种协议分析器。`netstat`\
  \ 是一个显示系统网络连接状态信息的程序。`top` 是一个显示系统进程的实用程序。这些工具都不提供日志服务。\n\n## 27. 系统日志\nA. 系统日志记录了服务器的启动活动及其服务和设备驱动程序的运行状态。当发生问题或服务器状态发生变化时，系统日志可以提供发生了什么以及何时发生的信息。\n\
  \n## 28. Windows 事件日志\nD. 在 Windows 系统，有关服务的信息（包括服务的启动和失败）记录在系统日志中。应用程序、安全和设置日志通常不包含此类信息。\n\
  \n## 29. Windows 性能工具\nA. 性能监控（Performance Monitor）是一个可以创建长期系统和网络性能日志的 Windows 。在新计算机上创建此类日志可以作为未来故障排除的基准。事件查看器（Event\
  \ Viewer）是显示日志文件的 Windows ；它无法创建性能基准。Syslog 是最初为 Unix 系统创建的日志程序；它不创建性能基准。Network\
  \ Monitor 是一种协议分析器。虽然它可以捕捉作为未来故障排除参考的流量样本，这种能力不能被称为性能基准。\n\n## 30. 湿度\nB. 湿度防止静电积累，静电会导致损坏设备的放电。湿度低于\
  \ 50% 会导致设备容易受到静电。\n\n## 31. Windows 审计策略\nC. 在 Windows 系统上启用审计策略时，您可以指定审计成功或失败事件（或两者），包括访问尝试。此类审计信息记录在安全日志中。系统、应用程序和设置事件通常不记录成功和失败的访问尝试。\n\
  \n\n\n\n\n### 33. A. 畸形帧（Runts）和巨帧（Giants）通常是网络接口适配器故障的结果。在以太网中，当网络接口产生的数据包小于 64\
  \ 字节的最小允许长度时，就会产生畸形帧。当帧大于 1518 字节的最大允许长度时，就会产生巨帧。在半双工网络中冲突是正常的，但畸形帧和巨帧不是。当网络电缆过长时，会发生远程冲突。电磁干扰是循环冗余校验（`CRC`）错误的可能原因，但不是产生畸形帧和巨帧的原因。\n\
  \n### 34. C. 电磁干扰是 `CRC` 错误的可能原因。网络接口适配器故障会导致畸形帧和巨帧。在半双工网络中冲突是正常的，但 `CRC` 错误不是。当网络电缆过长时会发生远程冲突，但它们不会导致\
  \ `CRC` 错误。\n\n### 35. C. `netstat` 工具可以显示特定网络接口的入站和出站数据包，以及取决于操作系统的其他统计数据。`Top`\
  \ 和 `ifconfig` 是 Unix/Linux 工具，而 `Nbtstat` 是 Windows 工具。\n\n### 36. B. Netflow 是\
  \ 1996 年首次在 Cisco 路由器中引入的网络流量监控功能。`Netmon`、`Netstat` 和 `Nbtstat` 都是操作系统工具，而不是路由器功能。\n\
  \n### 37. E. 巨型帧（Jumbo frames）是一些以太网实现支持的特性，允许帧超过 IEEE 802.3 标准定义的 1500 字节最大数据负载。畸形帧、巨帧、循环冗余校验（`CRC`）错误和封装错误都是网络接口诊断中常见的报告错误类型。\n\
  \n### 38. D. 循环冗余校验（`CRCs`）是数据到达目的地的状态与发送时不一致时发生的故障；它们不是简单网络管理协议（`SNMP`）的组件。管理信息库（`MIBs`）、告警（traps）和对象标识符（`OIDs`）都是简单网络管理协议（`SNMP`）实现的组件。\n\
  \n### 39. C. 除非数据中心位置存在特定的已知威胁，否则 ราศี并不是通常会影响设备运行时间并需要监控的环境因素之一。然而，温度、湿度、淹水和静电是数据中心应该监控的因素，因为这些元素的变化会导致设备损坏和停机。\n\
  \n### 40. A, D. 链路状态和 Dijkstra 算法被链路状态路由协议使用，例如开放最短路径优先（`OSPF`）和中间系统——中间系统（`IS –\
  \ IS`）。路由信息协议（`RIP`）和增强内部网关路由协议（`EIGRP`）是矢量协议，它们不使用链路状态。边界网关协议（`BGP`）是一种矢量协议和外部（非内部）网关协议。\n\
  \n### 41. A. 网络地图是网络设备的描绘，并非按比例绘制，并添加了额外信息，如 IP 地址和链路速度。大多数情况下，网络地图是由软件产品（如 `Nmap`）自动创建的，该软件扫描网络并根据发现的信息创建显示。`network\
  \ diagram`（网络图）一词通常用于指手动创建的文档，其中包含网络设备的图示以及表示它们之间连接的线条。该图可能与场地的实际布局大致相似，但通常不是按比例绘制的。电缆图（Cable\
  \ diagram）是对站点安装的电缆走向的精确描绘。电缆图通常绘制在建筑师的平面图或蓝图中，使网络管理员能够定位特定电缆并排查连接问题。管理信息库（`MIB`）是基于简单网络管理协议（`SNMP`）的网络管理系统组件，仅包含一个设备的信息；它并不描绘网络上的所有设备。\n\
  \n### 42. C. 电缆图是对站点安装的电缆走向的精确描绘。电缆图通常绘制在建筑师的平面图或蓝图中，使网络管理员能够定位特定电缆并排查连接问题。网络地图是网络设备的描绘，并非按比例绘制，并添加了额外信息，如\
  \ IP 地址和链路速度。大多数情况下，网络地图是由软件产品（如 `Nmap`）自动创建的，该软件扫描网络并根据发现的信息创建显示。`network diagram`（网络图）一词通常用于指手动创建的文档，其中包含网络设备的图示以及表示它们之间连接的线条。该图可能与场地的实际布局大致相似，但通常不是按比例绘制的。管理信息库（`MIB`）是基于简单网络管理协议（`SNMP`）的网络管理系统组件，仅包含一个设备的信息；它并不描绘网络上的所有设备。\n\
  \n### 43. C. 设计用于 IT 设备架的设备通常以单位（units）测量高度。一个单位等于 1.75 英寸。大多数架式设备的高度为一单元（`1U`）、两单元（`2U`）或四单元（`4U`）。\n\
  \n### 44. A. 良好的缆安装人员应该提供电缆图，在场地的平面图或蓝图指示所有电缆走向的位置。你应该能够利用此确定哪些端口对应哪些墙面板。忙碌的电缆安装人员不太可能记得年前执行的安装的具体细节。使用测号器和定位器是关联端口和墙面板的有效方法，但这可能非常耗时，而且绝对不是简单的方法。电缆测试仪可以测试电缆走向的故障、测量其长度并进行其他测试，但它无法指定哪个墙面板对应哪个端口，除非你之前输入了这些信息。\n\
  \n### 45. B. ISO 19770 是一系列 资产管理（ITAM）标准，定义了软件及相关资产管理的程序和技术。ISO 19770-2 定义了 SWID\
  \ 标签的创建和使用，它是包含软件管理信息的 XML 文件。其他标准定义了其他 ITAM 元素，例如企业治理合规（ISO 19770-1）和资源利用率测量（ISO\
  \ 19770-4）。\n\n### 46. A, C. 大型企业网络至少会有电话服务的边界以及与互联网服务提供商（`ISP）网络的连接。在许多情况下，这些服务将进入带有骨干交换机的同一设备房。该房间被称为主配架（`MDF`）。间接配架（`IDF`）是局部电信设备的位置，例如水平布线与骨干之间的接口。故障间隔时间（`MTBF`）和远程桌面协议（`RDP`）不是布线位置。\n\
  \n### 47. C. 机架图使用单位进行垂直测量，每个单位为 1.75 英寸。大多数架式设备的高度为一单元（`1U`）、两单元（`2U`）或四单元（`4U`）。\n\
  \n### 48. A. 图中所示符号代表网络交换机。它不是路由器、集线器或网关。\n\n### 49. A, C. 在这种情况下，物理图表示连接到配线架的线头的实际物理位置。逻辑图使用对应公司结构的虚拟划分。\n\
  \n### 50. C. IDF 图应尽可能基于建筑师的平面图，以便记录电缆走向的实际长度和位置。在没有建筑师平面图的情况下，按比例绘制的详细草图是可以接受的。照片、模型和报告对于此目的来说实用的。\n\
  \n\n\n\n\n### 51. MDF 和 IDF 文档\n`MDF` 和 `IDF` 文档应考虑所在地的可用电源、控制温度湿度水平所需的 HVAC 设备，以及电缆布线必须跨越的距离。此类文档通常用于安装和故障排除，因此不需要组件和服务的成本，这些费用可以在其他地方涵盖。\n\
  \n### 52. 电缆标记\n当电缆布线连接到配线架端口和墙壁面板时，应应对它们进行标记。在任何早时候进行标记可能会导致电缆布线连接错误。\n\n### 53.\
  \ 网络分界点\n大型企业网络至少将拥有电话服务的分界点，以及与互联网服务提供商（ISP）网络的连接。在许多情况下，这些服务将通过安置骨干交换机的同一个设备机房进入建筑。该房间随后被称为主配线架（`MDF`）。中间配线架（`IDF`）是本地电信设备的所在地，例如水平布线与骨干网之间的接口。平均故障时间（`MTBF`）、远程桌面协议（`RDP`）和谅解备录（`MOU`）都不是网络布线的位置。\n\
  \n### 54. 变更管理\n变更管理团队通常要求对所有请求变更提供详尽文档，具体说明需要什么；变更将如何影响当前的工作流（包括变化的直接接收者和组织的其他部分）；以及变更可能带来什么影响。\n\
  \n### 55. 机架单元\n单个机架单元（Rack Unit）为 1.75 英寸，或 44.5 毫米。选项 A，1.721 英寸是许多高度为一单元的组件的高度，在组件之间留出少量空间以便于插入和拔出。\n\
  \n### 56. 变更管理责任\n变更管理团队通常不负责直接参与其批准的变更实施的任务。因此，他们不会负责通知用户变更的具体发生时间，或在事后记录程序。然而，他们负责提供维护窗口（变更必须在该窗口内发生），并授权任何所需的停机时间。\n\
  \n### 57. ISO 19770 标准\n`ISO 19770`是一系列 IT 资产管理（`ITAM`）标准，定义了企业基础设施中软件及相关资产的管理程序和技术。`ISO\
  \ 19770-5` 提供了标准提供的功能及其对 IT 基础设施益处的概概述。其他标准定义了其他 `ITAM` 元素，例如符合企业治理性（`ISO 19770-1`）、软件\
  \ ID（`SWID`）标签的创建和使用（`ISO 19770-2`）以及资源利用率测量（`ISO 19770-4`）。\n\n### 58. 机架高度\nIT\
  \ 设备架的标准单元高度为 1.75 英寸，相当于一个单元。因此，四个单元为 7 英寸。\n\n### 59. 图表与资产管理\n布线原理图的主要目的是标明电缆在墙壁和天花板中的位置。物理网络图识别所有物理设备及其相互连接方式。资产管理是对所有网络资产的识别、记录和跟踪，包括计算机、路由器、交换机等。逻辑网络图包含地址、防火墙配置、访问控制列表（`ACLs`）以及网络配置的其他逻辑元素。\n\
  \n### 60. 物理图与逻辑图\n物理网络图识别所有物理设备及其相互连接方式。逻辑网络图包含 IP 地址、防火墙配置、访问控制列表（`ACLs`）以及网络配置的其他逻辑元素。物理和逻辑网络图都可以自动或手动创建。是物理网络图才包含了从头开始重建网络所需的信息。\n\
  \n### 61. 路由器符号\n图中所示符号代表网络路由器。它不是交换机、集线器或网关。\n\n### 62. IDF 和 MDF 详情\n中间配线架（`IDF`）是本地电信设备的所在地，例如连接到工作站和其他用户设备的水平网络与骨干网之间的接口。大型企业网络通常将拥有电话服务的分界点，以及与互联网服务提供商（ISP's）网络的连接。在许多情况下，这些服务将通过安置骨干交换机的同一个设备机房进入建筑。该房间随后被称为主配线架（`MDF`）。平均故障时间（`MTBF`）、服务等级协议（`SLAs`）和谅解备录（`MOUs`）都不是网络布线的位置。\n\
  \n### 63. 机架宽度\n数据中心设备机架的标准宽度为 19 英寸。网络硬件制造商在设计机架式组件时会使用此宽度。\n\n### 64. 集线器符号\n\
  图中所示符号代表网络集线器。它不是交换机、路由器或网关。\n\n### 65. 数据中心与文档\n数据中心通常将组件安装在机架上，机架为 19 英寸宽、约 6\
  \ 英尺高，许多网络组件专为此此设计。机架图是对一个或多个标准 1.75 英寸机架单元的描绘，并显示机架内每件设备的精确位置。网络地图、布线原理图和逻辑图是定义组件关系的文档，而非精确位置。业务连续性计划描述了组织的灾难预防和恢复策略。审计评估报告是由第三方准备的总结安全状况的文档。\n\
  \n### 66. 网络地图\n网络图通常指定设备类型和连接，但网络地图还可以包含 IP 地址、链路速度和其他信息。网络地图绘制了设备之间的关系并提供了连接它们的信息，但它们并非按比例绘制，且通常不指示每个设备的精确位置。虽然通用访问是理想的，但某些人不应访问网络地图和其他文档，包括临时员工和不参与\
  \ IT 工作的工作用户。网络地图包含所有网络设备，而不仅仅是电缆布线和终端。\n\n### 67. 安全与合规\n材料安全数据表（`MSDS`）是由化学、电气和机械产品制造商创建的文档，说明了与之相关的潜在危险和风险，特别是接触或火灾方面。良好的网络应存档所有用于构建和维护的化学和硬件产品的\
  \ `MSDS` 文件。可以从制造商或环境保护署（`EPA`）获取 `MSDS`。静电放电（`ESD`）、保密协议（`NDA`）、自带设备（`BYOD`）策略和标准操作程序（`SOP`）不涉及清洁剂的化学成分。\n\
  \n### 68. 用户协议\n特权用户协议规定了拥有管理账户和其他授予权限的用户的能力限制。远程访问策略规定了用户何时以及如何从远程访问公司网络。服务等级协议（`SLA`）是供应商与订阅者之间的合同，规定了保证可用性。可接受使用政策（`AUP`）规定了员工是否以及如何利用公司拥有的硬件和软件资源。\n\
  \n\n\n\n\n## 网络策略与协议\n\n### 69. **A.** 远程访问策略规定了用户允许从远程位置访问公司网络的时间和方式。服务水平协议（`SLA`）是提供者与订阅者之间的合同，规定了保证的服务可用性。可接受使用策略（`AUPs`）规定了员工是否以及如何利用公司拥有的硬件和软件资源。特权用户协议规定了用户对于管理账户及其被授予的其他权限的权限和局限性。\n\
  \n### 70. **B.** 可接受使用策略（`AUPs`）规定了员工是否以及如何利用公司拥有的硬件和软件资源。`AUPs` 通常规定了员工可以哪些哪些工作、可以安装哪些硬件软件，以及在使用公司设备时允许享有的隐私级别。服务水平协议（`SLA`）是提供者与订阅者之间的合同。保密协议（`NDA`）规定了员工允许在公司外讨论哪些公司信息。自带设备（`BYOD`）策略规定了员工如何将其个人设备连接到公司网络。\n\
  \n### 71. **D.** 自带设备（`BYOD`）策略规定了员工允许在公司网络使用的个人电子设备，并记录了连接和保护这些设备的程序。服务水平协议（`SLA`）是提供者与订阅者之间的合同，规定了合同服务可用的时间比例。可接受使用策略（`AUPs`）规定了员工是否以及如何利用公司拥有的硬件和软件资源。保密协议（`NDA`）规定了员工允许在公司外讨论哪些公司信息。\n\
  \n### 72. **C.** 保密协议（`NDA`）规定了员工允许在公司外讨论哪些公司信息。服务水平协议（`SLA`）是提供者与订阅者之间的合同，规定了合同服务可用的时间比例。可接受使用策略（`AUPs`）规定了员工是否以及如何利用公司拥有的硬件和软件资源。谅解备录（`MOU`）是概述双方之间协议的文件，位于签署合同之前。自带设备（`BYOD`）策略规定了员工允许在公司网络使用的个人电子设备，并记录了连接和保护这些设备的程序。\n\
  \n## 密码安全\n\n### 73. **A, B, C, D.** 密码越长，越难猜测。公司策略通常要求密码具有最小长度。较大的字符集也会使密码更难猜测，因此要求使用大写和小写字母、数字和特殊字符是常见的。更改密码会强制攻击过程重新开始，因此策略通常要求频繁更改密码并防止用户重复使用。\n\
  \n### 74. **C.** 要求使用唯一密码可以防止用户通过反复使用相同密码来规避密码更改策略。密码长度、密码字符集和密码更改间隔的最大值都无法阻止频繁的密码更改策略。\n\
  \n## 账户锁定\n\n### 75. **A, C, D.** 账户锁定阈值规定了在账户锁定之前允许的错误登录次数。账户锁定持续时间是账户保持锁定的时间。重置账户锁定阈值计数器规定了错误尝试次数重置为零之前的时间。账户锁定策略通常不包含调节登录尝试之间允许时间的设置。\n\
  \n### 76. **B.** 账户锁定限制了用户可以输入的错误密码数量。这防止了入侵者通过暴力攻击一个接一个尝试密码来破解账户。在尝试指定错误次数后，账户将锁定一段时间，或者直到管理员解锁。\n\
  \n## 数据保护\n\n### 77. **C, D.** 运动中数据（Data in motion）和传输中数据（Data in transit）是描述网络流量的术语。使用中数据（Data\
  \ in use）描述终端操作，静态数据（Data at rest）描述数据存储。\n\n### 78. **A.** 使用中数据是描述终端访问的数据泄露术语，例如用户将数据加载到应用程序中。运动中数据是描述网络流量的术语。静态数据描述数据存储。处理中数据（Data\
  \ in process）不是标准数据泄露术语之一。\n\n### 79. **B.** 静态数据描述当前存储但未使用的数据。运动中数据是描述网络流量的术语。使用中数据描述处理数据的终端操作，磁盘数据（Data\
  \ on disk）不是标准数据泄露术语之一。\n\n### 80. **A.** 在线数据（Data online）不是标准数据泄露术语之一。静态数据是一个数据泄露术语，描述当前存储但未使用的数据。运动中数据是描述网络流量的术语。使用中数据描述终端操作。\n\
  \n## 身份识别与变更管理\n\n### 81. **D.** 入职（On-boarding）和离职（off-boarding）是身份管理过程，用户在此被添加或从公司系统中移除。这赋予了新用户使用网络所需的权限，在他们职位变动时修改其权限，并在他们离开公司时撤销权限。入职和离职不是数据泄露、事件响应、库存管理、灾难恢复或业务连续性流程。\n\
  \n### 82. **C.** 入职和离职是身份管理过程，用户在此被添加或从公司系统中移除。离职是在用户离开公司时撤销其权限。“离职”一词并不指于集群管理、断开交换机连接或退役工作站。\n\
  \n### 83. **A.** 在请求、批准、计划并执行变更后，应通知所有相关人员，并记录记录整个过程以备日后参考。\n\n## 合规与安全\n\n### 84.\
  \ **B, C, D.** 美国政府控制敏感软件和其他技术的出口，作为维护国家安全利益和外交政策协议的手段。美国三个机构有权颁发出口许可证：州务部、商务部和财政部。个人软件开发者没有权限实施他们自己的出口控制。\n\
  \n### 85. **B.** 虽然事件响应策略可能包括响应事件以及识别和记录其原因的过程，但事件响应策略的主要功能是确保相同的事件不再发生。\n\n###\
  \ 86. **D.** 物质安全数据表（`MSDSs`）是由化学、电气和机械产品制造商创建的文件，它们规定了与产品相关的潜在风险和危险，特别是关于易燃性和毒性气体排放的可能性。一个记录良好的网络应该存档用于构建和维护网络的所有化学和硬件产品的\
  \ MSDS 文件。MSDS 可以从制造商或环保保护局（`EPA`）获得。静电放电（`ESDs`）、保密协议（`NDA`）和自带设备（`BYOD`）策略不涉及建筑内部固有的危险。\n\
  \n\n\n\n\n### 87.\n软件和硬件升级通常不属于接受使用政策（AUP）的范围，因为它们由公司的 IT 人员处理。公司的 AUP 通常包含一项条款，规定用户对使用公司电脑时所做的任何操作（包括电子邮件和数据存储）不享有隐私权。AUP\
  \ 通常规定公司是计算机设备以及存储在设备上或通过设备获取的任何公司专有信息的唯一所有者。AUP 还禁止将其计算机或网络用于任何非法活动，通常包括发送垃圾邮件、黑客攻击或引入或开发恶意软件。\n\
  \n### 88\n关于公司财产的条款（包括为公司完成的工作所产生的版权和专利）通常出现在 AUP 中，但不会出现在隐私条款中。这些信息更有可能出现在所有权条款中。隐私条款通常解释说公司有权访问和监控存储在其计算机上的任何内容。\n\
  \n### 89.\n一旦网络基础设施被部分或完全销毁，它就不再是事件响应的问题；责任将转移到灾难恢复计划，该计划需要一套不同的策略。停止、遏制和修复事件均被视为事件响应策略。\n\
  \n### 90.\n攻击、硬件故障和崩溃都是可以通过事件响应策略处理的事件，这些策略定义了为分析和修复问题应采取的措施。电气火通常不是 IT 部门事件响应团队处理的内容；那是受过训练的消防员的工作。一旦火灾熄灭，公司的响应将属于灾难恢复的范畴。\n\
  \n### 91.\n添加用户的个人设备并允许其访问公司网络的过程称为入职（on-boarding）。从网络中移除个人设备则称为离职（off-boarding）。带内（In-band）和带外（out-of-band）是定义获取受管网络设备管理权限方法的术语。\n\
  \n### 92.\n数据中心的“故障关锁”（fail closed）策略规定在紧急情况下任何开启的门应该自动锁定。为了支持这一策略，数据中心必须配备自包含的火火灭系统，该系统使用火灾探测器和排氧气体系统等设备。\n\
  \n### 93.\n保护区域以防止证据污染、用照片或视频记录现场、收集任何可见的证据以及与当局合作，这些可能属于公司事件响应策略中的任务。关闭服务器肯定不会属于其中，因为这可能会干扰或删除犯罪证据。\n\
  \n### 94.\n尽管所有选项都是强密码的特征，但复杂密码的定义是通过使用大小写字母、数字和符号的混合来扩展可用的字符集的密码。用于创建密码的字符集越大，密码越难被破解。\n\
  \n### 95.\n密码策略中的历史记录要求防止用户指定其最近使用过的任何一个密码。虽然不建议使用亲属和历史人物的名字来创建密码，但这并不是容易防止的。每个用户都维护自己的密码历史；与其他用户的密码之间没有冲突。\n\
  \n### 96.\n暴力破解密码攻击是指攻击者尝试尽可能多的密码，试图猜测或推导出正确的密码。账户锁定策略旨在通过限制错误密码的尝试次数来防止此类攻击。\n\n\
  ### 97.\n暴力破解密码攻击是指攻击者尝试尽可能多的密码，试图猜测或推导出正确的密码。密码长度和复杂性策略产生的密码更难被破解，使得攻击在统计学上的成功概率降低。账户锁定策略旨在通过限制错误密码的尝试次数来防止暴力攻击。密码历史策略无助于防止暴力攻击。\n\
  \n### 98.\nIT 资产处置策略通常包括对达到系统生命周期结束并准备好进行最终处理的资产执行执行程序。这包括擦除所有数据、完成库存记录以及可能对资产进行回收。该策略假设在资产提交处置之前，所有需要保留的数据已经过备份。因此，在此阶段不需要数据保护程序。\n\
  \n### 99.\n服务水平协议（`SLA`）是提供者与订阅者之间的合同，规定了约定服务的可用时间百分比。接受使用政策（`AUPs`）规定了员工是否以及如何利用公司资源。非泄露协议（`NDA`）规定了员工被允许在公司外讨论哪些公司信息。自带设备（`BYOD`）策略规定了允许员工使用的个人电子设备。\n\
  \n### 100.\n互联网服务提供商（ISP）为订阅者提供接入接入。订阅者使用的应用程序通常不是 `SLA` 的部分。`SLA` 规定了 ISP 将提供哪些服务、提供哪些设备以及作为协议的一部分\
  \ ISP 将提供的技术支持服务。\n\n### 101.\n服务水平协议（`SLA`）是提供者与订阅者之间的合同，规定了服务可用时间的百分比。平均故障间隔（`MTBF`）是一项硬件规格，估计组件预计可以运行多久。接受使用政策（`AUPs`）规定了员工是否以及如何利用公司资源。平均修复时间（`MTTR`）规定了特定硬件发生故障时修复其所需的平均时间。\n\
  \n### 102.\n`SLA` 的技术支持条款通常定义了提供者将提供的支持类型、支持服务时间以及合同包含的支持量，以及额外支持的成本。`SLA` 通常会以百分比的形式保证服务能力，但这指的是提供者端的问题，而不是客户的技术支持事务。\n\
  \n### 103.\n流量整形（Traffic shaping）是一种通过对对时间不敏感的数据包进行缓存以便稍后传输来实现优先排序的技术。你可以使用这种技术让\
  \ VoIP 数据包优先于其他类型的流量。负载均衡理论上可以提高服务器性能，但无法帮助缓解互联网链路的流量拥塞。流量拥塞发生在互联网连接，而不是局域网，因此升级到千兆以太网将没有帮助。`SNMP`\
  \ 是网络管理产品使用的协议；它无法缓解流量拥塞。\n\n### 104.\n配备双电源的服务器可以以两种模式运行：冗余或组合。在冗余模式下，两个电源都能够提供服务器所需的\
  \ 100% 功率。因此，当一个电源故障时，服务器可以继续运行，使其具有容错性。在组合模式下，两个电源都需要来提供服务器的需求，因此一个电源的故障会导致服务器宕机。独立模式和热备模式不是用于此目的的术语。\n\
  \n\n\n\n\n### 105\nC. 如果服务器连接到两个建筑电路，当其中一个电路的断路器跳闸且未及时修复时，它可以继续运行。在没有额外冗余的情况下，所有其他选项都会导致服务器宕机。\n\
  \n### 106\nC. `Windows Server Backup` 无法将数据备份到磁带驱动器。然而，它可以备份到本地硬盘、光盘和远程共享。\n\n###\
  \ 107\nC. `RAID` 是一种用于在多个硬盘驱动器上存储数据的技术，可提供容错能力、提高性能或两者兼顾。不同的 `RAID` 级别提供不同层次的功能，并有不同的硬件要求。`RAID\
  \ 5` 将磁盘分列与校验信息的分布式存储相结合，提供了容错能力。校验信息使得阵列能够重建数据丢失的磁盘。`RAID 0` 仅使用数据分列（按块顺序写入每个磁盘），它不提供任何形式的容错能力。`RAID\
  \ 1` 通过磁盘镜像提供容错能力。`RAID 10` 创建容错的镜像条带集。\n\n### 108\nB. 电源冗余是一个通用术语，描述任何允许设备在其中一个电源故障时继续运行的容错机制。`UPS`\
  \ 是一台使用电池电而非发电机的设备。`双电源`一词指的是计算机内部的电源单元，而不是独立的发电机。`冗余电路`指的是到建筑主电源的多个连接，而不是发电机。\n\
  \n### 109\nC. 独立磁盘冗余阵列 (`RAID`) 是一种用于在多个硬盘驱动器上存储数据的技术，可提供容错能力、提高性能或两者兼顾。不同的 `RAID`\
  \ 级别提供不同层次的功能，并有不同的硬件度要求。`RAID 5` 将磁盘分列（按块顺序写入每个磁盘）与校验信息的分布式存储相结合，用于容错。`RAID 0`\
  \ 仅提供数据分列。`RAID 1` 提供磁盘镜像。`RAID 10` 创建镜像条带集。\n\n### 110\nC. 平均故障间隔时间 (`MTBF`) 是一种用于预测组件近似使用寿命的硬件规格。它不指代任何类型的容错机制。端口聚合、聚类和不间断电源\
  \ (`UPSs`) 分别都是在网络适配器、服务器和电源故障时提供容错的机制。\n\n### 111\nB. 负载均衡是将传入流量分配到多个服务器之间的方法。网络地址转换\
  \ (`NAT`) 是一种路由机制，允许私有网络上的计算机共享一个或多个公共互联网协议 (`IP`) 地址。因此，它不是一种负载均衡方法。域名系统 (`DNS`)\
  \ 轮询、多层交换和内容交换都是允许服务器集群共享客户端流量的机制。\n\n### 112\nA. 内容交换机是一种应用层设备，这使其能够读取入站的超文本传输协议\
  \ (`HTTP`) 和安全超文本传输协议 (`HTTPS`) 消息。`HTTP` 是一种应用层协议。多层交换机的工作不在传输层之上。故障转移聚类和 (`DNS`)\
  \ 轮询都是在不实际处理流量的情况下分配传入流量的技术。\n\n### 113\nB, D. 在线 `UPS` 始终使用电池电运行设备，因此在故障期间向设备提供的电源供应没有间隙。备式\
  \ `UPS` 在主电源故障期间将设备切换到电池电。在线式和备式 `UPSs` 仅提供足够让设备有序关机的电源。\n\n### 114\nB. 在线 `UPSs`\
  \ 始终通过电池运行设备，同时保持电池充电。因此在发生电源故障时没有切换间隙。在线 `UPSs` 的运行时间并不比备式 `UPSs` 长，也不会对电压峰值和波动提供更多保护。在线和备式\
  \ `UPSs` 都可以是管理设备。\n\n### 115\nA, B, D, E. 绑定、链路聚合、端口聚合和网卡 (`NIC`) 组都是同一种基本技术的术语，将多个网络适配器连接的带宽合并以加速传输。该技术还允许在其中一个适配器断开时继续网络通信。聚类是指将服务器组合成单个单元，而不是网络适配器。\n\
  \n### 116\nB. 在网络负载均衡集群中，每台计算机被称为主机 (host)。其他类型的集群使用其他术语。例如，在故障转移集群中，每台计算机被称为节点\
  \ (node)。聚类不使用 `server` 和 `box` 术语。\n\n### 117 甚至 C. 高可用系统通常具有冗余的故障转移组件，使其在路由器、交换机、硬盘、服务器或其他组件故障后仍能继续运行。备份、快和冷备都可以有助于系统的高可用性，但它们不是自动运行的。\n\
  \n### 118\nA. 独立磁盘冗余阵列 (`RAID`) 是一种用于在多个硬盘驱动器上存储数据的技术，可提供容错能力、提高性能或两者兼顾。不同的 `RAID`\
  \ 级别提供不同层次的功能，并有不同的硬件要求。`RAID 0` 仅使用数据分列（按块顺序写入每个磁盘），不提供任何形式的容错能力。`RAID 1` 提供磁盘镜像，`RAID\
  \ 5` 将磁盘分列与校验信息的分布式存储相结合，`RAID 10` 创建镜像条带集——这三个级别都提供容错能力。\n\n### 119\nA, B. 高可用虚拟\
  \ IP 地址的实现是指多个服务器由单个地址识别，使所有服务器都能接收客户端流量。在服务器聚类和网络负载均衡的情况下，集群本身具有唯一的名称和 `IP` 地址，与单个服务器的地址分开。客户端访问集群，而不是集群中的某一台服务器。`NAT`\
  \ 不是一种高可用技术，`NIC` 组不使用虚拟 IP 地址。\n\n### 120\nC. 冷备、温备和热备站点在安装的硬件和软件上有所不同。冷备站点只是远程的一个空间。在恢复网络之前，必须购买并安装硬件和软件。因此它是最便宜的且耗时最长。温备站点已有硬件，但需要安装和配置。热备站点已经安装并配置了所有必要的硬件，以防故障发生。温备站点比冷备站点贵，而热备站点最贵且运行所需时间最短。\n\
  \n### 121\nD. 云备站点的实现成本最低。冷备、温备和热备站点在安装的硬件和软件上有所不同，但它们都需要维护一个新数据中心的设施。冷备站点只是远程的一个空间。在恢复网络之前，必须购买并安装硬件和软件。因此，它是冷、温、热选项中最便宜的，且耗时最长。温备站点已有硬件，但需要安装和配置。热备站点已经安装并配置了所有必要的硬件，以防故障发生。温备站点比冷备站点贵，而热备站点最贵且运行所需时间最短。云备站点是由云服务提供商维护的虚拟设施。云备站点不需要物理空间或物理硬件，因此它是最便宜的。\n\
  \n\n\n\n\n## 122. B. 恢复时间目标 (RTO) 指定了服务器发生故障时，从最近的备份中恢复服务器所需的时间。此时间间隔取决于涉及的数据量和备份介质的速度。恢复点目标\
  \ (RPO) 指定了如果需要从备份进行恢复，可能会丢失多少数据。该数字基于备份频率和系统产生的新数据量。业务连续性计划 (BCP) 是一个通用术语，指为了在发生灾难时保持组织正常运行而实施的一系列程序。管理信息基础\
  \ (MIB) 是由简单网络管理协议 (SNMP) 系统使用的数据库。\n\n## 123. B. 平均失效时间 (MTTF) 指的是最终会发生一次故障并被丢弃而非维修的设备。平均故障间隔时间\
  \ (MTBF)、平均修复时间 (MTTR) 和平均停机时间 (MDT)均指最终会发生故障然后被修复并重复使用的设备。\n\n## 124. A, D. 如果服务器的电源单元之一故障，另一个将继续工作。如果建筑的备用发电机故障，只要建筑仍有外部电源，服务器就会继续运行。如果\
  \ UPS 故障，服务器将宕机。如果建筑电源路路的断路器跳闸，服务器的运行时间将取决于 UPS 电池。\n\n## 125. B. UPS 可以为服务器提供电池备份电源，但通常只有几分钟，以便服务器能够安全关机而不会产生数据损坏或丢失的风险。UPS\
  \ 无法让服务器运行两个小时。UPS 可以防止电压浪涌，但这不是其主要功能。无论是否存在 UPS，计算机电源故障都会导致服务器宕机。\n\n## 126. A,\
  \ B, D. 如果服务器的电源单元之一故障，另一个将继续工作。如果 UPS 故障，服务器将继续使用插在墙上插座上的电源供应。如果建筑的备用发电机故障，只要建筑仍有外部电源，服务器就会继续运行。如果建筑电源路路的断路器跳闸，服务器的运行时间取决于\
  \ UPS 电池。\n\n## 127. A, B, C, D. 如果服务器的电源单元之一故障，另一个将继续工作。如果其中一个 UPS 故障，服务器将继续使用另一个\
  \ UPS 运行。如果建筑电源路断路器之一跳闸，服务器将继续使用另一个断路器运行。如果建筑的备用发电机故障，只要建筑仍有外部电源，服务器就会继续运行。\n\n\
  ## 128. C. 备份软件用于执行增量和差异作业的归档位是一个文件属性，因此这是最常用的过滤器类型。可以根据文件名、扩展名和大小过滤文件，但这些使用的频率通常低于归档文件属性。\n\
  \n## 129. A. 冷备中心、温备中心和热备中心的区别在于它们安装的硬件和软件。冷备中心只是远程位置的一个空间。在恢复网络之前，必须采购并安装硬件和软件。因此它是最便宜的。温备中心已有硬件，但必须进行安装和配置。热备中心已安装了所有必要的硬件。\n\
  \n## 130. A, B, D. 负载均衡是指在多个通道之间分配流量。端口聚合将端口合并为单个逻辑通道，并在端口故障时提供容错能力。\n\n## 131.\
  \ D. 集群是一组配置了相同应用程序的计算机，通过从一个节点到另一个节点的故障转移来提供容错能力。\n\n## 132. B. 网卡聚合 (NIC teaming)\
  \ 允许你以活动/备用模式组合网络接口卡 (NIC)；如果网卡故障，备用网卡将变为活动。这种配置不提供负载均衡。\n\n## 133. D. 独立磁盘阵列 (RAID)\
  \ 1 级是一种也称为磁盘镜像的容错机制。由于数据是同时写入磁盘的，该 RAID 级别不提供负载均衡。网卡聚合在两个或多个网卡之间平衡流量，而服务器集群则不会。\n\
  \n## 134. D. 冷、温、热备用中心是一种灾难恢复机制，当灾难发生时能够在远程位置激活网络。“温度”指的是备用站点的就绪程度。冷备中心只是远程位置的一个空间；在恢复网络之前必须采购并安装硬件和软件。温备中心已有硬件但必须安装和配置，恢复网络的时间比冷备中心短，比热备中心长。热备中心已安装了所有硬件。\n\
  \n## 135. A. 平均失效时间 (MTBF) 指定了设备发生故障前预期可以运行多久。对于硬盘来说，该规格指示了设备的预期寿命。服务水平协议 (SLA)\
  \ 和可接受使用政策 (AUP) 与硬盘无关。硬盘可以指定平均修复时间 (MTTR)，但 RAID 阵列中的硬盘通常是更换而非维修。\n\n## 136. B,\
  \ D. 独立磁盘阵列 (RAID) 是一种在多个硬盘上存储数据的技术，提供容错、性能提升或两者兼顾。不同的级别提供不同的功能和需求。RAID 1 提供磁盘镜像，RAID\
  \ 10 创建镜像条带组；两者都通过维护文件的两个副本来提供容错。某些镜像配置存储的文件副本多于两个。RAID 0 仅提供数据条带化，没有容错能力。RAID 5\
  \ 将磁盘条带（块轮流写入每个磁盘）与校验信息的分布式存储相结合，以提供容错，可用空间百分比至少为 66%。\n\n## 137. D. 磁盘镜像和磁盘双工都使用多个硬盘来存储所有数据的副本。然而，磁盘双工要求将每个磁盘连接到独立的控制器上，以便在磁盘故障或磁盘控制器故障时数据依然可用。\n\
  \n\n\n\n\n# RAID (独立磁盘冗余阵列)\n\n138. B. `独立磁盘冗余阵列 (RAID)` 是一种在多个硬盘驱动器上存储数据的技术，提供容错能力、提高性能或两者兼顾。不同的\
  \ `RAID` 级别提供不同层次的功能，并具有不同的硬件要求。`RAID 1` 提供磁盘镜像以实现容错，需要两个或多个磁盘驱动器。`RAID 0` 仅提供数据条带化，不提供容错能力。`RAID\
  \ 5` 将数据条带化（顺序写入每个磁盘的块）与校验信息的分布式存储相结合以提供容错能力，但它至少需要三个磁盘驱动器。`RAID 10` 创建镜像条带集，至少需要四个磁盘驱动器。\n\
  \n139. B, D. `独立磁盘冗余阵列 (RAID)` 是一种在多个硬盘驱动器上存储数据的技术，提供容错能力、提高性能或两者兼顾。不同的 `RAID` 级别提供不同层次的功能，并具有不同的硬件要求。`RAID\
  \ 1` 和 `RAID 10` 都使用磁盘镜像来提供容错能力，不需要校验数据。`RAID 0` 仅使用数据条带化（顺序写入每个磁盘的块），不提供任何形式的容错能力。`RAID\
  \ 5` 将数据条带化与校验信息的分布式存储相结合。\n\n# 备份类型\n\n140. C. `差异备份`使用`归档位 (archive bit)` 来确定要备份哪些目标文件。然而，`差异备份`不会重置`归档位`。`全备份`不关注`归档位`，因为它们备份所有文件。但是，全备份在任务完成后会清除`归档位`。`增量备份`也使用`归档位`来确定自上一次备份任务以来哪些文件发生了变化。然而，增量任务和差异任务之间的主要区别在于增量备份会清除`归档位`，这样未更改的文件就不会被备份。不存在所谓的补充备份任务。\n\
  \n141. C. 世代介质轮系统使用`祖父 (grandfather)`、`父亲 (father)`和`儿子 (son)`术语来指每月、每周和每天运行的备份任务。这些任务可以是`全备份`、`增量备份`或`差异备份`，这些术语与备份介质是否为硬盘、`光盘`或任何类型的磁带无关。\n\
  \n142. A, C. `Windows Server 备份`可以执行`全备份`和`增量备份`。它不支持`差异备份`，且没有名为补充的备份任务。\n\n143.\
  \ A. `快照 (snapshot)` 是在特定时间点拍摄的数据集的只读副本。通过创建`快照`并对其进行备份，你可以确保数据没有由于`版本偏斜 (version\
  \ skew)` 而发生损坏。`热备地 (hot site)` 是另一种网络位置，其中已安装并准备好了所有的硬件和软件。增量备份和差异备份是备份任务的类型。\n\
  \n144. D. 当系统备份运行时数据集发生变化时，可能会发生`版本偏斜`。写入已备份目录的文件将不会出现在备份介质上，尽管该任务可能仍在运行。这可能导致文件未受保护，或者更糟糕的是数据损坏。`快照`是在在特定时间点拍摄的数据集的只读副本。通过创建`快照`并对其进行备份，你可以确保数据没有由于`版本偏斜`而发生损坏。增量备份和差异备份是备份任务的类型，而`迭代`并不是一种特定的存储技术。\n\
  \n145. C. `增量备份`是一个备份自上次任何类型备份以来所有已更改文件的任务。因此，要恢复在周一中午崩溃的系统，你需要恢复上周三最近的`全备份`以及周四、周五、周六和周日的增量备份`。\n\
  \n146. B. `自动换带器 (autochanger)` 是一个包含一个或多个可移动介质驱动器的机器人设备，例如`磁带`或`光盘驱动器`。机器人机构自动插入和取出介质盒，使得备份任务可以跨越多个带盒，从而增加其总容量。\n\
  \n147. D. `增量备份`是一个备份自上次任何类型备份以来所有已更改文件的任务。因此，要恢复在周二中午崩溃的系统，你需要恢复上周六最近的`全备份`，以及周日、周一和周二早上的`增量备份`。\n\
  \n148. B. `差异备份`是一个备份自上一次`全备份`以来所有已更改文件的任务。因此，要恢复在周二中午崩溃的系统，你需要恢复上周三最近的`全备份`以及上周一最近的`差异备份`。\n\
  \n# 存储与监控\n\n149. C. 数据以线性方式存储在`磁带驱动器`上。一旦你将备份数据写入`磁带`，你就无法选择性地替换单个文件。当你执行`恢复任务`时，你可能需要恢复最近的`全备份`，然后是`增量备份`，这将用较新的文件覆盖某些`全备份文件`。`硬盘驱动器`是随机访问设备，这意味着单个文件可以写入磁盘的任何位置并从该位置读取。当你对`硬盘`执行`增量备份任务`时，软件可以使用每个文件的任何可用版本来恢复数据。数据容量、`传输速度`和`块大小`无关。\n\
  \n150. C. `简单网络管理协议 (SNMP)` 是一种跟踪网络组件性能和功能的手段。嵌入网络设备中的软件或固件组件称为`代理 (agents)`，与控制台通信。`SNMP`不提供容错能力。`不间电源\
  \ (UPS)` 是一种电池备份设备，能够在电源故障期间让计算机继续运行。`独立磁盘冗余阵列 (RAID)` 第一级是一种磁盘镜像机制，通过维护存储数据的副本来提供容错能力。`集群\
  \ (clustering)` 是一种多个服务器作为一个单元运行相同应用程序的机制，当某个服务器故障时，其他服务器可以继续工作。\n\n151. B. 数据中心的`电源单元\
  \ (PDU)` 执行与办公插线相同的基础功能，但通常具有更大的输入。它并不一定有更多的插座或更大的功率输出。\n\n152. A, D. 防火墙`状态`的备份包含了`配置`以及其他元素，如`模板`和`策略`。因此，状态包含的信息比配置更多。\n\
  \n153. D. `氢氟碳 (HFC) 125` 是一种用于灭火系统的吸热。许多大型数据中心配备`HFC-125 全淹灭火系统`，是因为灭火产物比二氧化碳毒性小，且不会像水和泡沫那样损坏电子设备。\n\
  \n154. A, B, D. `CMR` 是路由器使用多路由传输数据包的技术。这通过在多路径间分发传输提供了负载均衡和性能提升，并因为某路由故障只会影响部分数据而提供了一种容错措施。`数据封装`不涉及\
  \ `CMR` 过程。\n\n\n\n\n156. D. FHRP 通过在路由器故障时自动切换到备用路由器地址，为网络主机提供容错的默认网关。反向地址解析协议（`RARP`）是一种过时的互联网协议（`IP`）地址分配协议；它不是\
  \ FHRP。通用地址冗余协议（`CARP`）、虚拟路由器冗余协议（`VRRP`）和热备路由器协议（`HSRP`）都是 FHRP。\n\n157. C. 这种冗余交换布局会导致广播风暴，风暴是由数据包被多个交换机读取并认为源自不同的网络引起的。导致包在交换机之间无限循环。\n\
  \n158. A, B, D. 配置路由器将传入的数据包分在两个防火墙之间，可以提供负载均衡并提高性能。如果其中一个防火墙故障，并行结构允许另一个防火墙接管所有传入数据包的处理，提供容错能力。两个防火墙并行并不能提供额外的安全性。\n\
  \n159. A, D. 在双活动模式配置中，服务器可以在它们之间平衡传入的客户端负载。由于活动服务器都在为客户端提供服务，集群的整体性能得到了提高。双活动模式和主备模式配置都提供容错能力。数据封装不是任何一种配置的考虑因素。\n\
  \n160. D. 访问互联网可能会因为互联网服务供应商（`ISP`）网络故障、广域网（`WAN`）提供商网络故障或本地网络路由器故障而中断。在所有这些元素中建立冗余是确保持续访问互联网的最佳方法。\n\
  \n# 第 4 章：网络安全\n\n1. B, E, F. 必须同时从内部网络和互联网访问的服务器通常位于企业中被称为“受限子网”、边界网络或非军事区（`DMZ`）的区域。该区域通过防火墙与互联网和内部网络隔离开，防止未经授权互联网用户访问内部网络。内网是内部网络的另一个术语。边缘网关协议（`EGP`）是一种路由协议，无状态是防火墙的一种类型；两者都不适用于此定义。\n\
  \n2. C. 使用 `AD DS` 的 Windows 网络使用 `Kerberos` 协议验证客户端，部分原因因为它从不在网络上传输密码（即使是加密形式的）。远程认证拨号用户服务（`RADIUS`）是一种用于连接到网络的远程用户的认证、授权和计数服务。Windows\
  \ 不将其用于内部客户端。WiFi 保护访问 2（`WPA2`）是无线局域网（`LAN`）使用的安全协议。它不用于 `AD DS` 认证。扩展认证协议-传输层安全（`EAP-TLS`）是一种远程认证协议，`AD\
  \ DS` 网络不将其用于内部客户端。\n\n3. C, D. 多因素认证结合了两种或多种身份验证方法，减少了入侵者在认证过程中成功冒充用户的概率。密码和视网膜扫描是多因素认证系统的示例。智能卡和\
  \ `PIN`（等同于密码）是多因素认证的示例，因为它们要求用户提供“他们知道的”和“他们所拥有的”。多因素认证指的是系统所需的身份证明，而不是实现该系统所使用的服务器数量。因此，使用远程认证拨号用户服务（`RADIUS`）服务器不是多因素认证的示例。需要两个密码的系统不是多因素认证的示例，因为攻击者破解一个密码和两个一样容易。多因素认证系统需要两种不同形式的认证。\n\
  \n4. A. 扩展认证协议（`EAP`）是 Windows 中唯一支持除密码以外认证方法（如智能卡）的远程认证协议。`MS-CHAPv2` 是一种强远程访问认证协议，但它仅支持密码认证。用户无法使用智能卡。挑战握手认证协议（`CHAP`）是一种相对较弱的认证协议，不支持智能卡。密码认证协议（`PAP`）仅支持明文密码，不支持智能卡。\n\
  \n5. B. 多因素认证结合了两种或多种身份验证方法，要求用户提供多个凭据。这减少了入侵者在认证过程中成功冒充用户的概率。“多因素”一词并非指用户关联的资源、设备或组的数量。\n\
  \n6. C, D. 计和审计都是跟踪和记录用户在网络上活动的方法，例如用户何时登录以及连接了多久。认证是对用户身份的确认，而授权定义了授予已认证用户的访问类型。\n\
  \n7. A. 认证是确认用户身份的过程。密码是网络设备常用的认证因素之一。授权定义了授予已认证用户的访问类型。计数和审计都是跟踪和记录用户在网络上活动的方法，例如用户何时登录以及连接了多久。\n\
  \n8. A. 认证是确认用户身份的过程。指纹和其他生物识别读取器是网络设备常用的认证因素之一。授权定义了授予已认证用户的访问类型。计数和审计都是跟踪和记录用户在网络上活动的方法，例如用户何时登录以及连接了多久。\n\
  \n9. A. `Kerberos` 是一种用于活动目录的安全协议，它通过票据系统验证用户和其他网络实体，而无需在网络上传输凭据`IEEE 802.1X` 通过传输凭据进行认证。临时密钥完整性协议（`TKIP`）和轻级目录访问协议（`LDAP`）不是认证协议。\n\
  \n10. C. 认证审计可以记录成功和失败的登录尝试。大量的登录失败可能指示破解密码。审计跟踪认证尝试的时间，有时可以检测出入侵入侵。审计不记录认证期间指定的密码，因此无法识别失败尝试的模式。\n\
  \n11. A. 认证是确认用户身份的过程。智能卡是网络设备常用的认证因素之一。授权定义了授予已认证用户的访问类型。计数和审计都是跟踪和记录用户在网络上活动的方法，例如用户何时登录以及连接了多久。\n\
  \n12. A. 多因素认证结合了两种或多种身份验证方法，减少了入侵者在认证过程中成功冒充用户的概率。密码（你知道的）和视网膜扫描（你的特征）是多因素认证系统的示例。智能卡和\
  \ `PIN`（等同于密码）是多因素认证的另一个示例，因为它们要求用户提供“他们知道的”和“他们所拥有的”。多段、多指标和多过滤不是此语境下的适用术语。\n\n\
  \n\n\n\n### 13. A. `网络访问控制` (`NAC`) 是一种定义系统在连接网络之前必须满足的设备和配置标准的机制。`轻量级目录访问协议` (`LDAP`)\
  \ 提供目录服务实体之间的通信。`远程认证拨入用户服务` (`RADIUS`) 是一种为连接到网络的远程用户提供的认证、授权和计费服务。带有 `RC4` 密的`临时密钥完整性协议`\
  \ (`TKIP`) 是一种用于运行`无线保护访问` (`WPA`) 安全协议的无线网络的加密协议。\n\n### 14. C. `单点登录` (`SSO`)\
  \ 使用一组凭据，并要求用户仅需提供一次即可访问多个资源。相同登录（Same sign-on）也使用单组凭据（即一个密码），但用户必须对每个资源进行单独登录。`SSO`\
  \ 和相同登录都不要求多因素身份认证。\n\n### 15. C. `生物识别` (`Biometrics`) 是一种身份验证因素，使用唯一识别个体的物理特征，例如指纹或视网膜图案。因此，`生物识别`\
  \ 最好描述为“你所拥有的”，而不是“你所知的”、“你所持有的”或“你所做的”。\n\n### 16. B. “你所持有的”（Something you have）指的是用于识别用户的物理所有物，例如智能卡。这种类型的身份验证通常作为多因素身份验证程序的一部分，因为智能卡或其他物理物品可能会丢失或被盗。指纹被认为是“你所拥有的”，密码是“你所知的”，而手指手势是“你所做的”。\n\
  \n### 17. D. `终端访问控制器访问控制系统加+` (`TACACS+`) 是一种旨在为具有许多路由器和交换机的网络提供认证、授权和计费 (`AAA`)服务的协议，允许管理员使用一组凭据访问这些设备。它并不是设计为无线网络、`活动目录`\
  \ (`Active Directory`) 或远程拨入用户提供 `AAA` 服务。\n\n### 18. B, C. `密码` (`PIN`) 与密码一样，是“你所知的”，而指纹或其他任何生物识别因素都是“你所拥有的”。你所持有的”的例子是智能卡，而“你所做的”的例子是手指手势。\n\
  \n### 19. D. 用手指在屏幕上画的动作是一种手势，它是“你所做的”的例子。`PIN`或密码是“你所知的”，指纹或其他任何生物识别因素是“你所拥有的”，而智能卡是“你所持有的”的例子。\n\
  \n### 20. D. “你所做的”（Something you do）指的是用户执行的物理动作，例如手指手势，这有助于确认其身份。这种类型的身份验证通常作为多因素身份验证程序的一部分，因为手势或其他动作可以被模仿。指纹被认为是“你所拥有的”，密码是“你所知的”，而智能卡是“你所持有的”。\n\
  \n### 21. C. “你所知的”（Something you know）指的是你在认证过程中提供的信息，例如密码或 `PIN`。这是最常见的身份验证因素，因为除非用户违反安全策略，否则它不会丢失或被盗。指纹被认为是“你所拥有的”，手指手势是“你所做的”，而智能卡是“你所持有的”。\n\
  \n### 22. A. “你所拥有的”（Something you are）指的是能够唯一识别个体的物理特征，例如指纹或其他形式的生物识别。这种身份验证通常作为多因素身份验证程序的一部分，因为生物识别元素理论可能被破解。手指手势被认为是“你所做的”，密码是“你所知的”，而智能卡是“你所持有的”。\n\
  \n### 23. B. `NAC` 是一组策略，定义了客户端在许可连接网络之前必须满足的安全要求。`802.1X` 是 `NAC` 的基本实现。`远程认证拨入用户服务`\
  \ (`RADIUS`) 和`终端访问控制器访问控制系统加+` (`TACACS+`) 是认证、授权和计费 (`AAA`) 服务。它们本身不是 `NAC` 实现，尽管它们可以在部署中发挥部分作用。`轻量级目录访问协议`\
  \ (`LDAP`) 提供目录服务通信。\n\n### 24. C. 一个 `802.1X` 事务涉及三方：请求者（supplicant），即尝试连接网络的客户端；认证者（authenticator），即请求者请求访问的交换机或访问点；以及认证服务器，通常是`远程认证拨入用户服务`\
  \ (`RADIUS`) 的实现，用于验证请求者的身份。事务中没有被称为“授权代理”的方。\n\n### 25. D. 一个 `802.1X` 事务涉及三方：请求者（supplicant），即尝试连接网络的客户端；认证者（authenticator），即请求者请求访问的交换机或访问点；以及认证服务器，通常是`远程认证拨入用户服务`\
  \ (`RADIUS`) 的实现，用于验证请求者的身份。请求者不参与颁发证书。\n\n### 26. C. 一个 `802.1X` 事务涉及三方：请求者（supplicant），即尝试连接网络的客户端；认证者（authenticator），即请求者请求访问的交换机或访问点；以及认证服务器，通常是`远程认证拨入用户服务`\
  \ (`RADIUS`) 的实现，用于验证请求者的身份。认证者不参与颁发证书。\n\n### 27. C. 认证服务器角色通常由`远程认证拨入用户服务` (`RADIUS`)\
  \ 服务器承担。在 `802.1X` 事务中，请求者是尝试连接网络的客户端，认证者是请求者请求访问的交换机或访问点，而认证服务器验证客户端的身份。\n\n###\
  \ 28. B, C. `远程认证拨入用户服务` (`RADIUS`) 和`终端访问控制器访问控制系统加+` (`TACACS+`) 都是为网络提供 `AAA`\
  \ 的服务。`802.1X` 只提供认证，而`轻量级目录访问协议` (`LDAP`) 提供目录服务实体之间的通信。\n\n### 29. A. `远程认证拨入用户服务`\
  \ (`RADIUS`) 最初的设计目的是为互联网服务提供商 (`ISPs`) 提供 `AAA` 服务，这些运营商曾运行拥有数百个调制解调器的网络为订阅提供拨号接入`终端访问控制器访问控制系统加+`\
  \ (`TACACS+`) 是一种旨在为具有许多路由器和交换机的网络提供 `AAA` 服务的协议，而不是用于拨号连接。`Kerberos` 和`轻量级目录访问协议`\
  \ (`LDAP`) 不是 `AAA` 服务。\n\n### 30. A. `远程认证拨入用户服务` (`RADIUS`) 使用`用户数据报协议` (`UDP`)\
  \ 端口 `1812` 和 `1813` 或 `1645` 和 `1646` 进行认证，而`终端访问控制器访问控制系统加+` (`TACACS+`) 使用`传输控制协议`\
  \ (`TCP`) 端口 `49`。\n\n### 31. B. `终端访问控制器访问控制系统加+` (`TACACS+`) 是一种旨在为具有许多路由器和交换机的网络提供\
  \ `AAA` 服务协议，允许管理员使用一组凭据访问这些设备。`远程认证拨入用户服务` (`RADIUS`) 提供 `AAA` 服务，但不是针对路由器和交换机。`Kerberos`\
  \ 和`轻量级目录访问协议` (`LDAP`) 不是 `AAA` 服务。\n\n\n\n\n\n### 32. C. 授权\n`Authorization`（授权）是确定用户可以在网络上访问哪些资源的过程。通常，这是通过评估用户的组组身份来实现的。`Authentication`（认证）是确认用户身份的过程。`Accounting`（审计）是跟踪用户网络活动的过程。`Access\
  \ control`（访问控制）创建权限，为用户和组提供对资源的特定类型的访问权限。\n\n### 33. A. 认证\n`Authentication`（认证）通过检查凭据（如密码、身份卡或指纹）来确认用户身份的过程。`Authorization`（授权）是确定用户可以在网络上访问哪些资源的过程。`Accounting`（审计）是跟踪用户网络活动的过程。`Access\
  \ control`（访问控制）创建权限，为用户和组提供对资源的特定类型的访问权限。\n\n### 34. B. 审计\n`Accounting`（审计）是跟踪用户网络活动的过程，例如用户何时登录和注销以及访问了哪些资源。`Authentication`（认证）通过检查凭据确认用户身份的过程。`Authorization`（授权）是确定用户可以在网络上访问哪些资源的过程。`Access\
  \ control`（访问控制）创建权限，为用户和组提供对资源的特定类型的访问权限。\n\n### 35. B, D. 公钥基础设施\n在公钥基础设施中，用用户的公钥加密的数据只能用用户的私钥解密，而用用户的私钥加密的数据只能用用户的公钥解密。这使得系统能够提供消息加密和不可否认性。如果用用户的公钥加密的数据可以用同一个公钥解密，那么系统将无法提供任何安全性。如果用用户的私钥加密的数据可以用同一个私钥解密，那么该用户只能给自己发送安全消息。\n\
  \n### 36. A. RADIUS 和 AAA\n远程认证拨号用户服务（RADIUSRADIUS`服务器可以为远程访问服务器提供`Authentication`（认证）、`Authorization`（授权）和`Accounting`（审计）（`AAA`）服务。入侵检测系统（IDS`）、下一代防火墙`NGFW`）和网络附属存储（NAS`）设备不提供认证服务。\n\
  \n### 37. B. CIA 三要素\n`CIA` 三要素中的`Integrity`（完整性）元素防止数据被未经授权的用户进行修改。`Confidentiality`（机密性）是防止数据未经授权查看的保护。`Availability`（可用性）为用户提供他们所需的数据。\n\
  \n### 38. C. 本地认证与远程认证\n使用本地认证的系统用户账户存储在计算机上，使用户无需任何网络通信即可登录。使用远程认证拨号用户服务（RADIUS`）或\
  \ `Kerberos` 进行认证的系统需要网络通信。密码和视网膜扫描是多因素认证系统的示例，该系统可能是本地的，也可能不是。\n\n### 39. B. 蜜罐、DMZ\
  \ 和 欺骗攻击\n`honeypot`（蜜罐）是一台配置为作为攻击者诱饵的计算机，导致他们浪费时间渗透一个无法提供实际访问权限的资源。非军事区（DMZ`）是网络的一部分，管理员在其中放置必须从互联网访问的服务器。`root\
  \ guard`（根保护）为交换机端口提供保护。`Spoofing`（欺骗）是一种攻击技术，入侵者通过修改数据包伪装成另一个用户或计算机。\n\n### 40.\
  \ A. 蜜罐缓解\n`honeypot`（蜜罐）或`honeynet`（蜜罐网络）是一种缓解技术，其形式为一台配置为作为攻击者诱饵的计算机或网络，导致他们浪费时间渗透一个无法提供实际访问权限的资源。\n\
  \n### 41. D. 渗透测试\n`Penetration testing`（渗透测试）是指聘请外部顾问尝试未经授权访问受保护的网络资源。由熟悉安全屏障的内部管理员进行的测试将不是有效的测试。虽然让顾问从内部检查网络安全性是有用的，但这不属于渗透测试。对入侵者来说极具诱惑力的计算机或网络被称为`honeypots`（蜜罐）或`honeynets`（蜜罐网络）。\n\
  \n### 42. C, D. 过滤子网\n一个通过防火墙与内部网络隔离开并暴露在互联网上的网段被称为`screened subnet`（过滤子网`）、非军事区（`DMZ`）或边缘网络。管理员通常使用`screened\
  \ subnet`放置必须供外部用户访问的服务器，例如 Web 服务器和电子邮件服务器。出于安全考虑，域控制器和动态主机配置协议（`DHCP`）服务器应该位于内部网络网段上。\n\
  \n### 43. B. 漏洞\n`vulnerability`（漏洞）是软件或硬件中的弱点，漏洞利用程序设计用于利用这种弱点。这两个术语都不特指硬件或软件。\n\
  \n### 44. A. SIEM 和 SNMP\n安全信息和事件管理（`SIEM`）是一种结合了两种技术的产：安全事件管理（`SEM`）和安全信息管理（`SIM`）。两者共同提供了一个收集和分析有关网络安全事件信息的组合解决方案。简单网络管理协议（`SNMP`）是一种收集有关受管理设备信息的技术。`SEIM`\
  \ 和 `SEM/SIM` 并不是安全信息和事件管理的正确缩写。\n\n### 45. B. 威胁和攻击方法\n你的主管担心那个心怀不满的技术员可能会利用他对设备和设施的访问权限来破坏网络。当个人利用在其工作期间收集的信息时，被称为内部威胁（或内部人员威胁）。外部威胁是指源自非员工。`Social\
  \ engineering`（社会工程学）是一种攻击形式，派遣用户被攻击者说服通过电子邮件或电话提供敏感信息。`logic bomb`（逻辑炸弹）是插入合法软件产品中的代码，在满足特定条件时触发恶意事件。`War\
  \ driving`（无线搜寻）是一种攻击方法，由在社区附近开车扫描不受保护的无线网络。\n\n### 46. C. 零日漏洞\n`zero-day vulnerability`（零日漏洞）是新发布软件产品中可能被利用的严重软件问题。漏洞尚未被软件开发者发现、解决或修补，但已被潜在攻击者发现。`zero-day\
  \ vulnerability`是指尚未修补或修复的漏洞。\n\n### 47. B. CVE 数据库\n常见漏洞披露（`CVE`）数据库是一个为软件产品中已知的安全问题分配标识的资源。通过搜索数据库，Ralph\
  \ 可以了解他正在评估的产品中已经发现的漏洞。`Confidentiality - Integrity - Availability`（CIA）要素列出了重要的信息安全概念，但它没有提供特定产品的信息。库存单元（`SKU`）是不涉及安全问题的产品标识符。安全信息和事件管理（`SIEM`）是一种收集和分析网络安全事件信息的产，但无法帮助\
  \ Ralph 发现他正在评估的产品中的漏洞。\n\n### 48. C. 基于角色的访问控制\n`Role-based access control`（基于角色的访问控制）通过将权限分配给特定的工作或工作角色来工作。每个新用户都可以与某个角色关联并自动获得必要的权限。当用户离开职位时，从其角色中移除将撤销与之关联的权限。`Least\
  \ privilege`、`zero trust`和`defense in depth`都是理论上的安全概念，但它们并没有描述 Alice 在这方面的做法。\n\
  \n\n\n\n\n### 49. C. 最小权限原则是指仅为用户提供其执行指定任务所需的权限，而不再更多。对于 Alice 的标准活动，我们给她提供了一个没有管理权限的账户，因为她在执行标准任务时不需要这些权限。管理员账户拥有\
  \ Alice 执行管理任务所需的额外权限。其意图是让 Alice 仅将该账户用于执行那些管理任务。零日漏洞是一种漏洞；多因素身份验证要求用户提供两个身份因子；深度防御是指使用多种安全机制来提供额外保护。这三个选项中没有哪一个指的是使用多个用户账户。\n\
  \n### 50. D. 横向移动是指用户通过合法手段获得网络的基本访问权限，然后利用该权限获取对网络内部其他资源的未经授权访问。零信任为所有敏感资源提供完全保护，即使对于已经在网络内部的用户也是如此。零信任架构无法防御零日漏洞（即软件中的漏洞）；外部威胁；或身份验证攻击，这是一种拒绝服务\
  \ (`DoS`) 攻击的类型。\n\n### 51. E. 社会工程学是一种通过说服用户披露密码或其他敏感信息来获取网络未经授权访问的手段；它不是深度防御策略的一部分。深度防御可以包括物理保护（如访问控制门室）、使用网络分段、职责分离或筛选子网进行资源划分，以及欺骗性诱饵（如蜜蜜罐）。\n\
  \n### 52. A, C. 威胁评估应该估计威胁的潜在严重性，例如丢失特定资源对组织可能造成的损害。评估还应该估计特定威胁发生的概率，因为组织必须对可能性更大的威胁投入更多关注。针对特定威胁对组织当前态势（或状态）的评估，以及用于应对该威胁的缓解技术，都是风险管理过程中后期的元素，紧排在威胁评估完成之后进行。\n\
  \n### 53. B. 过程评估是对现有程序进行检查，以确定其是否符合一组特定的目标，这些目标可以包括成本、质量和及时性。供应商评估是对组织与特定业务伙伴关系的检查。业务评估和风险评估是更通用的术语，可以包含过程评估。\n\
  \n### 54. B. 勒索软件是一种攻击类型，除非向攻击者支付一定金额，否则用户对其数据的访问将被阻止。这种阻止方式从简单的屏幕锁定到数据加密不等。无线钓鱼\
  \ (War driving) 是一种攻击方法，由带着电脑在社区周围行驶并扫描未受保护的无线网络组成。拒绝服务 (`DoS`) 是一种通过流量淹没计算机以防止其正常运行的攻击。地址解析协议\
  \ (`ARP`) 投毒是故意向存储在计算机和交换机的 `ARP` 缓存中插入欺假信息。\n\n### 55. A, C. 欺骗是修改网络数据包使其看起来是由他人发送或发送给他人的过程。实现此点的方法之一是修改包中的介质访问控制\
  \ (`MAC`) 地址，将其修改为被 `MAC` 过滤器批准的地址。中间人攻击（或称旁路攻击）是指攻击者拦截网络流量、读取流量，并甚至在将其发送到目标之前对其进行修改的攻击。拒绝服务\
  \ (`DoS`) 是一种通过流量淹没计算机以防止其正常运行的攻击类型，而逻辑炸弹是放置在合法软件产品中的代码插入，当满足特定条件时会触发恶意事件。后两个者都不涉及修改网络数据包。\n\
  \n### 56. C. 逻辑炸弹是放置在合法软件产品中的代码插入，当满足特定条件时会触发恶意事件。社会工程学是通过操纵合法用户来获取敏感数据的实践，例如假装成对数据有真实需求的人。无线钓鱼\
  \ (War driving) 是一种攻击方法，由带着电脑在社区周围行驶并扫描未受保护的无线网络组成。邪孪生 (Evil twin) 是无线网络上的欺骗接入点，模仿合法接入点的服务集标识\
