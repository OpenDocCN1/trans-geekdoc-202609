  \ 无法做到此。\n\n## 98\nC, D. `ping` 和 `tracert` 都是使用 `ICMP` 消息测试网络层的工具。`ping` 测试主机功能，`traceroute`\
  \ 显示网络层。\n\n## 99\nC. 使用带有 `-t` 参数运行 `ping` 可以使其持续向目标发送消息，直到手动停止。`-n` 参数指定 `ping`\
  \ 工具应该传输的消息数。`-a` 参数将互联网协议地址解析为主机名。\n\n## 100\nB. `netstat` 实用程序可以显示路由表以及其他类型的网络流量和端口信息。`arp`\
