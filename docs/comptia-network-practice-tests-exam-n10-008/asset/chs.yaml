  2. 添加 `router` 减少了两个 LAN 各自的单播流量。\n3. 添加 `router` 将流量分流到网络中的备路径。\n4. 添加 `router`\
  \ 防止一个 LAN 上的计算机与另一个 LAN 上的计算机通信。\n\n41. 一家小型企业办公室目前有一个带有 8 端口 hub 的 100Base-TX\
  \ 以太网。所有 hub 端口都已满，老板想进一步扩展网络。然而，该 hub 没有上行端口。老板购买了一个新的同样具有八个端口的 hub，它具有上行端口，但他不知道如何连接它们。老板必须做什么来安装新\
  \ hub？\n\n1. 使用标准跳线将现有 hub 的标准端口连接到新 hub 的标准端口。\n2. 使用标准跳线将现有 hub 的标准端口连接到新 hub\
  \ 的上行端口。\n3. 购买交叉线并用它连接现有 hub 的标准端口到新 hub 的上行端口。\n4. 购买另一个带有上行端口的新 hub 来替换旧 hub，并使用标准跳线连接两个上行端口。\n\
  \n42. 可以执行下列哪些任务可以将大型交换式局域网 (LAN) 分为多个广播域？（选择所有适用项。）\n\n1. 用 hub 替换一个或多个交换机。\n2.\
  \ 安装防火墙以过滤广播流量。\n3. 在交换机上启用生成树协议 (STP)。\n4. 在交换机中创建虚拟局域网 (VLANs)。\n5. 在网络上安装路由器。\n\
  \n\n\n\n\n### 44. 下哪项是描述交换机功能的正确术语？\n1. 第 2 层路由器\n2. 以太网集线器\n3. 多端口桥接器\n4. 第 3 层继器\n\
  \n### 45. 哪些设备可以作为物联网（IoT）设备？\n1. 冰箱\n2. 门铃\n3. 恒温器\n4. 扬声器\n5. 以上所有\n\n### 46.\
  \ 在以太网局域网（LAN）中用交换机代替集线器能够提高性能的主要原因是？\n1. 交换机转发数据包的速度比集线器快。\n2. 交换机不转发广播传输。\n3.\
  \ 交换机减少了网络上的冲突。\n4. 交换机读取数据包的 IP 地址，而不是硬件地址。\n\n### 47. 下哪项是冲突域的正确定义？\n1. 一组通过路由器连接的局域网（LANs），允许任何节点传输到任何其他节点\n\
  2. 一组连接在一起的计算机，使得任何一个设备的广播传输都能到达所有其他设备\n3. 一组由长度超过物理层规范规定的最大长度的电缆连接的设备\n4. 一组连接在一起的设备，当两个设备在完全同时传输时，就会发生数据冲突\n\
  \n### 48. 下哪些术语用于描述用于 IP 语音（VoIP）装置拨出的设备？（选择所有适用项）\n1. 终端\n2. 网关\n3. 端点\n4. 交换机\n\
  \n### 49. 关于集线器的下列哪项描述是不正确的？\n1. 集线器是数据链路层设备，以星型或环型拓扑结构连接网络设备。\n2. 集线器会放大并重复从一个端口接收的信号到所有其他端口，无论目的地是什么。\n\
  3. 集线器是物理层设备，以星型结构连接网络设备。\n4. 集线器提供内部交叉电路并使用上行端口形成分级星型结构。\n\n### 50. 关于路由器的下列哪些描述是正确的？（选择所有适用项）\n\
  1. 路由器是网络层设备，使用 IP 地址转发帧。\n2. 路由器是数据链路层设备，使用介质访问控制（MAC）地址转发帧。\n3. 路由器根据目标 MAC 地址构建内部表，并根据源\
  \ MAC 地址转发帧。\n4. 路由器必须支持在局域网（LAN）上实现的网络层协议。\n5. 路由器上的每个端口定义了一个独立的广播域。\n\n### 51.\
  \ 100Base-TX 物理层规范支持以下哪些种类的集线器？（选择所有适用项）\n1. 类 I\n2. 类 II\n3. 类 III\n4. 类 IV\n\n\
  ### 52. 关于路由器的下列哪项描述是不正确的？\n1. 路由器可以连接具有不同数据链路层协议和介质的两个或多个网络\n2. 路由器可以连接具有相同数据链路层协议和介质的两个或多个网络\n\
