  \ 174. 你的公司有两个用户想要从家里远程办公。他们没有配置任何硬件或软件二层隧道协议 (`L2TP`) 和互联网安全 (`IPSec`)。以下哪些解决方案可以解决这个问题？选择所有适用项。）\n\
