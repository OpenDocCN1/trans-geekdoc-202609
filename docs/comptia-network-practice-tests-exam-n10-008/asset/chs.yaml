- "# CompTIA Network+ 实践指南：考试 N10-008\n\n\n\n\n\n\n\n\n\n192. 189\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n# 关于作者\n\n**Craig Zacker** 是数十本关于计算机和网络主题书籍、手册、文章和网站的作者或合著者。他曾担任过英语教授、技术和文字编辑、网络管理员、网站管理员、企业培训师、技术支持工程师、微型计算机操作员、文学和哲学学生、图书馆管理员、暗室技术员、发货文员和报童。\n\
  \n## 关于技术编辑\n\n**George “Buzz” Murphy, CISSP, SSCP, CASP,** 是一位公共演讲者、企业培训师、作者和网络安全传教士。在过去的\
  \ 25 年里，他通过课程、研讨会和咨询演示向全球成千上万的网络安全专业人士教授了各种技术和网络安全主题。作为戴的技术培训高管，他曾在 Comdex、Networld\
  \ 和国家计算机会议以及普林斯顿大学等大型企业和教育机构面前进行过演讲。Buzz 从 ISC²、CompTIA、PMI 和微软等声誉卓著的组织获得了超过 29\
  \ 项 IT 和网络安全认证。他是 ISC² 授权讲师，近期担任了 ISC² `CCFP - Certified Cyber Forensics Professional\
  \ Certification Guide`（McGraw-Hill, 2014）的技术编辑。在过去的一年里，他为 McGraw Hill Education\
  \ 以及 Wiley 子品牌 Sybex 的五本网络安全教科书担任技术编辑，其中包括由 Jeff T.Parker 和 Michael Gregg 撰写的近期著作\
  \ `CASP+: CompTIA Advanced Security Practitioner Study Guide`（Sybex, 2019）的技术编辑。\n\
  \n\n\n\n他曾持有美国和北约（NATO）情报部门的机密许可，为美国陆军、美国各政府安全机构以及跨美国（CONUS）和欧洲中东及非洲（EMEA）的外国军事人员提供网络和网络安全操作员培训，并参与了关键站点核\
  \ EMP 加固、国际密码学、计算机取证科学以及网络安全主题等课程的辅助。可以通过 `buzz@buzzmurphy.com` 联系 Buzz。\n\n# 引言\n\
  \n欢迎阅读 `CompTIA® Network++® Practice Tests: Exam N10-008`。本书将为你提供一种专注且节省时间的方法，来复习你的网络知识，并准备通过计算技术行业协会（CompTIA）的\
  \ Network+ 考试。本书结合了真实的考试备习题、详细答案以及两份完整的模拟测试，帮助你熟悉在 Network+ 考试中会遇到的问题类型。通过复习目标和示例题，你可以专注于在考试前需要提高的特定技能。\n\
  \n## 本书的结构\n\n本书的前五章基于 CompTIA 为 `N10-008` Network+ 考试发布的五个目标领域。每个目标领域大约有 200 道题，涵盖了每个建议主题。接下来的两章各包含一份\
  \ 100 题的模拟测试，涵盖所有目标领域。当你完成对每个目标领域的单独准备后，就可以进行模拟测试，查看你在实际考试中的表现。\n\n### 目标映射\n\n\
  下表给出了每个领域在实际考试中所占的百分比，以及你可以在书中哪里找到与每个目标相关的题目。\n\n| 目标 | 考试占比 | 章节 |\n| --- | ---\
  \ | --- |\n| 1.0 网络基础 | 24% | 1 |\n| --- | --- | --- |\n| 2.0 网络实现 | 19% | 2 |\n\
  | 3.0 网络运营 | 16% | 3 |\n| 4.0 网络安全 | 19% | 4 |\n| 5.0 网络故障排除 | 22% | 5 |\n\n## 谁应该阅读这本书\n\
  \nCompTIA 建议（但并非要求）Network+ 考试候选人具备以下先决条件：\n\n*   CompTIA A+ 认证或同等知识\n*   在 IT 网络领域拥有至少\
  \ 9 到 12 个月的工作经验\n\nCompTIA 的认证计划依赖于衡量你执行特定工作功能或一组任务能力的考试。CompTIA 通过分析目前在该领域工作的人员所执行的任务来开发考试。因此，与工作相关的特定知识、技能和能力反映在认证考试中。\n\
  \n由于认证考试是基于真实世界的任务的，你需要获得相关技术的实践经验以掌握考试。在某种意义上，你可能认为将组织环境中的实践经验视为通过 Network+ 考试的先决条件。许多问题直接涉及特定的网络产品或技术，因此请利用学校或工作场所的机会练习使用相关工具。考试候选人还应该对企业技术（包括云和虚拟化）有基本的理解。\n\
  \n## 如何使用本书\n\n虽然你可以以多种方式使用本书，但你可能通过参加一次模拟考试作为预测试来开始学习。完成考试后，复习每个目标领域的结果，并优先专注于你得分最低的目标领域的学习。\n\
  \n由于本书仅包含练习题和答案，准备 Network+ 考试的最佳方法是结合本书与辅书使用，辅书会对每个目标领域中涵盖的元素提供更详细的解释。Todd Lammle\
  \ 编写的 `CompTIA® Network+® Study Guide: Exam N10-008` 提供了你考试所需的所有知识的全面覆盖。\n\n在完成预测试后，你可以针对你需要改进的目标领域对应的章节，测试你的详细知识，并更多地了解涉及的技术。通过复习答案正确或错误的原因，你可以判断是否需要更多地学习目标主题。\n\
  \n## 接下来\n\n下一步是复习 Network+ `N10-008` 考试的各个领域，并思考哪些主题是你最需要努力的。然后你可以转向相应的章节并开始。祝你考试顺利。\n\
  \n# 第 1 章：网络基础\n\n1.  在典型局域网（LAN）的开放系统互连（OSI）模型的以下哪一层中，协议使用 `MAC` 地址来识别其他计算机？\n\
  \    *   物理层\n    *   数据链路层\n    *   网络层\n\n2.  以下哪个组织开发了开放系统互连（OSI）模型？\n    * \
  \  国际电信联盟 (`ITU`)\n    *   国际电报电话咨询委员会 (`CCITT`)\n    *   美国标准协会 (`ANSI`)\n    *\
  \   电气电子工程师学会 (`IEEE`)\n    *   国际标准组织 (`ISO`)\n\n3.  开放系统互连（OSI）模型中的哪一层负责终端系统的逻辑寻址和网络上数据报文的路由？\n\
  \    *   物理层\n    *   数据链路层\n    *   网络层\n\n4.  在 TCP/IP 网络上，开放系统互连（OSI）模型的以下哪些层包含负责封装应用程序生成的数据协议，从而为将在网络上传输的数据包创建有效载荷？（选择所有适用项）\n\
  \    *   物理层\n    *   数据链路层\n    *   网络层\n\n5.  开放系统互连（OSI）模型的哪一层负责信息的翻译和格式化？\n\
  \    *   物理层\n    *   数据链路层\n    *   表示层\n\n6.  以下哪个设备通常运行在开放系统互连（OSI）模型的网络层？\n\
  \    *   代理服务器\n    *   集线器\n    *   网络接口适配器\n    *   路由器\n\n7.  开放系统互连（OSI）模型的哪一层为应用程序提供了协议栈的入口点？\n\
  \    *   物理层\n    *   数据链路层\n    *   应用层\n\n8.  开放系统互连（OSI）模型中的哪一层负责两个通信终端系统之间的对话控制？\n\
  \    *   物理层\n    *   网络层\n    *   会话层\n\n9.  某些交换机可以执行与开放系统互连（OSI）模型中两个层相关的功能。以下哪两个层与网络交换相关？（选择所有适用项）\n\
  \    *   数据链路层\n    *   网络层\n\n10. 在开放系统互连（OSI）模型的哪一层中，存在 TCP/IP 协议可以为应用程序提供无连接或面向连接的服务？\n\
  \    *   网络层\n    *   传输层\n\n11. 开放系统互连（OSI）模型的以下哪些层通常与专用的物理硬件设备相关联？（选择所有适用项）\n\
  \    *   物理层\n\n\n\n\n\n## 2. 数据链路层\n## 3. 网络层\n## 4. 传输层\n## 5. 会话层\n## 6. 表示层\n\
  ## 7. 应用层\n\n12. 在开放系统互连（OSI）模型的哪一层，有一种协议对从上层传下的信息添加头部和尾部，从而创建一个帧？\n1. 物理层\n2. 数据链路层\n\
  3. 网络层\n4. 传输层\n5. 会话层\n6. 表示层\n7. 应用层\n\n13. 识别开放系统互连（OSI）模型中控制以太网帧地址、传输和接收的层，并识别以太网使用的介质访问控制方法。\n\
  1. 物理层；带有冲突检测的多路复用 (`CSMA/CD`)\n2. 物理层；带有冲突回避的多路复用 (`CSMA/CA`)\n3. 数据链路层；`CSMA/CD`\n\
  4. 数据链路层；`CSMA/CA`\n\n14. 在 OSI 模型的哪一层找到将数据交付到互网络最终目的地的协议？\n1. 数据链路层\n2. 网络层\n3.\
  \ 会话层\n4. 应用层\n\n15. 下列哪项不是运行在 OSI 模型网络层上的协议？\n1. `IP`\n2. `ICMP`\n3. `IGMP`\n4.\
  \ `IMAP`\n\n16. Ed 是一个软件人员，被赋予创建一个需要端系统之间信息可靠交付的应用程序的任务。提供可靠交付的协议运行在开放系统互连（OSI）模型的哪一层？Ed\
  \ 必须使用哪种类型的协议？\n1. 数据链路层；无连接\n2. 网络层；面向连接\n3. 传输层；面向连接\n4. 应用层；无连接\n\n17. 下列哪个设备仅运行在开放系统互连（OSI）模型的物理层？\n\
  1. 集线器\n2. 桥\n3. 交换机\n4. 路由器\n\n18. Alice 是一个网络管理员，正在设计一个新的局域网（LAN）。她需要确定布线类型和要实现的网络拓扑结构。OSI\
  \ 模型的哪些层适用于布线和拓扑元素？\n1. 物理层和数据链路层\n2. 数据链路层和网络层\n3. 网络层和传输层\n4. 传输层和应用层\n\n19. 开放系统互连（OSI）模型的哪些层没有\
  \ TCP/IP 套件中专门用于它们的协议？（选择所有适用）\n1. 物理层\n2. 数据链路层\n3. 网络层\n4. 传输层\n5. 会话层\n6. 表示层\n\
  7. 应用层\n\n20. 开放系统互连（OSI）模型的哪一层使用端口号来识别数据包中源和目的的应用？\n1. 应用层\n2. 表示层\n3. 传输层\n4.\
  \ 网络层\n\n21. 下列哪项是开放系统互连（OSI）模型层从上到下的正确列表？\n1. 物理层、数据链路层、传输层、网络层、会话层、应用层\n2. 应用层、会话层、表示层、传输层、网络层、数据链路层、物理层\n\
  3. 表示层、应用层、传输层、会话层、网络层、数据链路层\n4. 会话层、应用层、表示层、传输层、数据链路层、物理层\n5. 应用层、表示层、会话层、传输层、网络层、数据链路层、物理层\n\
  \n22. 交换机和桥在开放系统互连（OSI）模型的哪一层执行其基本功能？\n1. 物理层\n2. 数据链路层\n3. 网络层\n4. 传输层\n\n23. 在\
  \ TCP/IP 网络上，流量控制是在开放系统互连（OSI）模型的哪一层实现的函数？\n1. 表示层\n2. 会话层\n3. 传输层\n4. 网络层\n\n24.\
  \ 开放系统互连（OSI）模型的哪层定义了网络使用的介质、网络接口、连接硬件和信号方法？\n1. 物理层\n2. 数据链路层\n3. 网络层\n4. 传输层\n\
  5. 会话层\n6. 表示层\n7. 应用层\n\n25. OSI 模型的哪层负责语法翻译或加密？\n1. 数据链路层\n2. 网络层\n3. 会话层\n4.\
  \ 表示层\n5. 应用层\n\n26. 开放系统互连（OSI）模型的哪层负责在网络上传输信号？\n1. 物理层\n2. 数据链路层\n3. 网络层\n4. 传输层\n\
  5. 会话层\n6. 表示层\n7. 应用层\n\n27. 指定网协议 (`IP`) 运行的开放系统互连（OSI）模型层，以及它是面向连接还是无连接的。\n1.\
  \ 网络层；面向连接\n2. 网络层；无连接\n3. 传输层；面向连接\n4. 传输层；无连接\n\n28. 以太网网络适配器提供了跨越开放系统互连（OSI）模型哪两层的功能？\n\
  1. 物理层和数据链路层\n2. 数据链路层和网络层\n3. 网络层和传输层\n4. 传输层和应用层\n\n29. 下列哪些协议运行在开放系统互连（OSI）模型的应用层？（选择所有适用）\n\
  1. `HTTP`\n2. `SNMP`\n3. `ICMP`\n4. `IGMP`\n5. `UDP`\n\n30. 当接收系统要求时，OSI 模型的哪层负责将发送系统使用\
  \ EBCDIC 编码的文本文件转换为 ASCII 码？\n1. 应用层\n2. 表示层\n3. 会话层\n4. 物理层\n\n31. 下列哪个协议运行在 OSI\
  \ 模型的网络层，但不为网络传输封装由上层产生的数据？\n1. `IP`\n2. `UDP`\n3. `ARP`\n4. `ICMP`\n5. `TCP`\n\n\
  32. TCP/IP 网络上的客户端尝试与服务器建立会话。下列哪项正确列出了传输控制协议（TCP）会话消息中的标志位顺序？\n1. `SYN`, `ACK`,\
  \ `SYN`, `ACK`\n2. `SYN`, `SYN/ACK`, `ACK`\n3. `SYN/ACK`, `SYN/ACK`\n4. `SYN`, `SYN/ACK`,\
  \ `ACK`\n\n33. 以太网帧的最大传输单元（MTU）大小是多少？\n1. 512\n2. 1024\n3. 1500\n4. 1518\n\n34.\
  \ 下列哪个传输控制协议（TCP）控制位被设置为 1 以终止会话？\n1. `SYN`\n2. `URG`\n3. `FIN`\n4. `END`\n5. `PSH`\n\
  \n35. 一电工在安装新灯具时不小心切断了穿过吊顶空间的一条 LAN 线缆。哪种拓扑对网络造成的影响最大？\n1. 总线型\n2. 星型\n3. 逻辑环型\n\
  4. 网状型\n\n36. 关于有线局域网（LAN）的哪个说法正确？\n1. 有线局域网只支持星型拓扑。\n2. 有线局域网只支持星型和总线拓扑。\n3. 有线局域网只支持星型和环形拓扑。\n\
  4. 有线局域网可以支持环形、总线或星型拓扑。\n\n37. 下列哪是混合拓扑的示例？\n1. 一个具有两个网卡的工作站，一个连接到星型网络，另一个连接到总线网络\n\
  2. 使用总线拓扑连接的四个交换机\n3. 四个工作站，每个工作站与另外三个中的每一个都有独立的连接\n4. 四个交换机，每个交换机与另外三个中的每一个都有独立的连接\n\
  \n\n\n\n\n### 38. 哪种类型的网络通常局限于较小的区域，例如单个房间、楼层或建筑？\n1. `WAN`\n2. `LAN`\n3. `MAN`\n\
  4. `CAN`\n\n### 39. 哪种类型的网络连接位于远地的局域网（LAN）？\n1. `WAN`\n2. `LAN`\n3. `MAN`\n4. `CAN`\n\
  \n### 40. 下列哪种拓扑需要在两个位置安装终端电阻？\n1. `Bus`\n2. `Star`\n3. `Ring`\n4. `Mesh`\n\n###\
  \ 41. 目前大多数安装的新型以太网网络使用以下哪种拓扑结构？\n1. `Bus`\n2. `Virtual ring`（虚拟环形）\n3. `Mesh`\n\
  4. `Hierarchical star`（分级星型）\n\n### 42. Alice 构建了一个五节点的故障转移集群，所有五台服务器都通过专用的光纤通道（Fibre\
  \ Channel）网络到磁盘阵列。下列哪个术语描述了这种网络布局？\n1. `SAN`\n2. `PAN`\n3. `WAN`\n4. `MAN`\n\n###\
  \ 43. 下列哪项不是通常用于个人局域网（PAN）的技术？\n1. `Bluetooth`\n2. `Z-Wave`\n3. `NFC`\n4. `SDWAN`\n\
  \n### 44. 无线局域网（WLAN）使用以下哪种网络拓扑结构？（选择所有项）\n1. `Ad hoc`（自组织型）\n2. `Bus`\n3. `Infrastructure`（基础设施型）\n\
  4. `Star`\n\n### 45. 第一代以太网使用的是哪种布线拓扑结构？\n1. `Bus`\n2. `Ring`\n3. `Star`\n4. `Mesh`\n\
  \n### 46. 在使用星型拓扑结构的以太网网络中，下列哪些设备可以作为布线枢纽，形成星形的形象性中心？（选择所有项）\n1. `Hub`（集线器）\n2.\
  \ `Router`（路由器）\n3. `Switch`（交换机）\n4. `Access Point`（访问点）\n\n### 47. 下列哪种布线拓扑为网络提供了最多的冗余路径？\n\
  1. `Star`\n2. `Ring`\n3. `Mesh`\n4. `Bus`\n\n### 48. 下列以太网物理层选项中哪一个不使用星型拓扑？\n1.\
  \ `10Base2`\n2. `10Base-T`\n3. `100Base-TX`\n4. `1000Base-T`\n\n### 49. 下列哪种网络类型通常是无线？（选择所有项）\n\
