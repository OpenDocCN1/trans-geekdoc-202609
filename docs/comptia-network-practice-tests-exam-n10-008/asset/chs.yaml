  \ 源路由\n    4. 多端口\n\n14. 下列哪些物理网络设备可能作为计算机操作系统的软件实现？（多选）\n    1. 集线器\n    2. 交换机\n\
  \    3. 路由器\n    4. 防火墙\n\n15. 能够服务依赖过滤的防火墙使用下列哪些标准阻塞流量？\n    1. 硬件地址\n    2. 协议标识符\n\
  \    3. IP 地址\n    4. 端口号\n\n16. Ralph 是一个自由网络顾问，正在安装一个三节点的小企业网络。所有计算机都在同一个房间内，并使用有线以太网连接到多功能设备的交换端口。该设备还充当电缆调制调器连接互联网的网络地址转换（NAT）路由器。NAT\
  \ 提供了一定的安全措施，但 Ralph 希望确保网络免受未经授权的互联网流量和端口攻击的影响。下列哪种方案能让 Ralph 以最低成本实现目标？\n    1.\
  \ 在多功能设备和电缆调制调器之间安装硬件防火墙。\n    2. 在多功能设备和电缆调制调器之间安装入侵预防系统（IPS）。\n    3. 在每台计算机上安装个人防火墙。\n\
  \    4. 在多功能设备的一个交换端口上连接入侵检测系统（IDS）。\n    5. 使用端口扫描器监控进入计算机的流量。\n\n17. 下列关于集线器和交换机的陈述哪些是正确的？（多选）\n\
