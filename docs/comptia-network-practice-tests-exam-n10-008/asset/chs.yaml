  2. 网络层\n3. 传输层\n4. 应用层\n\n### 56. 下哪项功能是传统防火墙产品不具备的，但在下一代防火墙（NGFW）中可能存在的？\n1. 状态数据包检测\n\
  2. 深度包检测 (DPI)\n3. 网络地址转换 (NAT)\n4. 虚拟专用网络 (VPN) 支持\n\n### 57. 关于防火墙中的内容过滤，下列哪些描述是正确的？\n\
  1. 内容过滤器检查数据包的源 IP 地址以定位潜在威胁。\n2. 内容过滤器允许交换机通过正确的端口引导数据包。\n3. 内容过滤器检查数据包携带的数据以查找潜在的违规材料。\n\
  4. 内容过滤器使用经常更新的签名来定位包含恶意软件的数据包。\n\n### 58. 下哪项不是负载均衡器通常用于将传入流量引导到一组服务器其中之一的标准？\n\
