  4. `cpustat`\n\n136. 你使用协议分析器捕获了流量。分析器报告看到 2000 个帧，但仅接受 1500 个帧。这意味着什么？\n1. 2000\
  \ 个帧通过了显示过滤器，但只有 1500 个符合标准。\n2. 只有 1500 个帧通过了捕获过滤器并处于缓冲区中。\n3. 你丢失了 500 个帧，需要重新开始。\n\
  4. 500 个帧损坏未进入缓冲区。\n\n137. 当你在服务器上运行端口扫描器时，结果是哪个？\n1. 系统上运行的进程列表\n2. 可以访问系统的开放端口列表\n\
  3. 系统用于网络通信的协议列表\n4. 网络上使用的 Internet 协议 (IP) 地址列表\n\n138. 端口扫描器在开放系统连接 (OSI) 模型的哪层检查系统漏洞？\n\
  1. 应用层\n2. 传输层\n3. 网络层\n4. 数据链路层\n\n139. 下述哪个最能描述端口扫描器的主要功能？\n1. 端口扫描器检查计算机硬件并编译系统物理端口列表。\n\
  2. 端口扫描器检查网络可访问的 TCP 和 UDP 端点。\n3. 端口扫描器检查网络上的指定 IP 地址范围以判断是否正在使用。\n4. 端口扫描器接受计算机名称作为输入并扫描网络以查找与其关联的\
  \ IP 地址。\n\n140. 文件传输协议 (FTP) 和 Telnet 等程序受到广泛批评，因为它们以明文传输所有数据（包括用户名和密码）。恶意分子可能会使用以下哪些类型的工具来读取这些密码？\n\
  1. 包嗅探器 (Packet sniffer)\n2. 终端仿真器 (Terminal emulator)\n\n\n\n\n\n### 3. 数据包分析器\n\
  ### 4. 漏洞扫描器\n### 5. TFTP 服务器\n\n### 141. 下列哪项最准确描述了运行协议分析器的潜在安全威胁？\n1. 协议分析器可以显示从网络中捕获的数据包中的应用数据。\n\
  2. 协议分析器可以显示网络上系统的 IP 地址。\n3. 协议分析器可以解密从网络中捕获的数据包中的保护信息。\n4. 协议分析器可以检测网络系统的开放端口并对其发动攻击。\n\
  \n### 142. 下列哪项不是提供漏洞扫描能力的工具？\n1. Nessus\n2. MAP Toolkit\n3. Nmap\n4. MBSA\n\n###\
  \ 143. 下列哪个功能通常被归类为漏洞扫描？\n1. 网络映射\n2. 修复\n3. 渗透测试\n4. 端口扫描\n\n### 144. Alice 试图解决同一网络上两个主机之间的通信问题。她决定使用协议分析器捕获网络流量。完成捕获后，Alice\
  \ 注意到协议分析器的捕获缓冲区中有超过 15,000 个帧。由于缓冲区中的帧太多，她很难识别出与问题相关的帧。她想从视图中消除多余的帧，以便只查看由这两个主机传输的帧。Alice\
  \ 必须做什么才能实现这一目标？\n1. 配置显示过滤器（display filter）\n2. 配置捕获过滤器（capture filter）\n3. 删除缓冲区中的多余帧\n\
  4. 配置捕获过滤器和显示过滤器\n\n### 145. Ralph 在车库拍卖中购买了一些旧的 802.11b 无线网络设备，他计划用它们来构建家庭网络。当他在电脑中安装网络适配器并设置接入点\
  \ (AP) 时，他发现设备之间的连接速度不高于 11 Mbps。Ralph 可以做什么来提高网络性能？\n1. 什么用做。网络以最高速度运行。\n2. 更改设备使用的通道。\n\
  3. 将电脑移靠近 AP。\n4. 在 AP 上安装更大的天线\n\n### 146. Ralph 正在使用 2.4 GHz 频段设置无线网络。为了避免通道重叠，他应该使用哪些通道？（选择所有适用项）\n\
  1. 1\n2. 4\n3. 6\n4. 8\n5. 11\n\n### 147. Ralph 正在为无线网络添加新的工作站，该网络使用配置为 WiFi 保护访问\
  \ II (WPA2) 加密的接入点 (AP)。然而，在第一个工作站上配置好无线网络适配器后，Ralph 发现它无法连接到网络。可用网络显示列出了 AP，且没有错误信息或问题指示，只是连接失败。下列哪个最可能是问题所在？\n\
  1. 错误的密码\n2. 通道重叠\n3. 错误的 SSID\n4. 错误的天线位置\n\n### 148. Ralph 正在为无线网络添加新的工作站，该网络使用配置为\
  \ WiFi 保护访问 II (WPA2) 加密的接入点 (AP)。然而，在第一个工作站上安装无线网络适配器后，Ralph 发现他无法在可用网络显示中看到无线接入点\
  \ (WAP)。下列哪些可能是问题？（选择所有适用项）\n1. 错误的密码\n2. 通道重叠\n3. 错误的 SSID\n4. 错误的天线极化\n5. 天线电缆衰减\n\
  \n### 149. Ralph 是一家小公司无线网络的管理员。他最近发现证据表明，办公区域之外的用户一直在访问其无线网络。办公室位于建筑外墙的一处狭窄空间内。Ralph\
  \ 担心网络的无线接入点 (WAP) 覆盖延伸到了建筑外。在与一位顾问朋友交流后，Ralph 被建议在接入点 (AP) 上安装一种不同类型的天线。下列哪种天线最可能帮助\
  \ Ralph 缓解该问题？\n1. 偶极 (Dipole)\n2. 八角天线 (Yagi)\n3. 贴片 (Patch)\n4. 单向 (Unidirectional)\n\
  \n### 150. Trixie 最近搬到了公司大楼的另一个新办公室，就在她旧办公室的走廊对面。自从搬后，她的笔记本只能偶尔访问无线网络。她在之前的地方从未遇到过这个问题。下列哪些可能是她问题的原因？（选择所有适用项）\n\
  1. Trixie 的新办公室比旧办公室离接入点 (AP)。\n2. 她的笔记本连接到了错误的 SSID。\n3. AP 使用了全向天线。\n4. Trixie\
  \ 的新办公室和 AP 之间有太多墙。\n\n### 151. Alice 是 Adatum 公司的新员工，当她询问笔记本电脑的无线网络访问时，她得到了一个服务集标识\
  \ (SSID) 和一个 WiFi 保护访问 II (WPA2) 密码。稍后在休息室里，当她尝试将笔记本连接到网络时，她在可用网络列表中看不到提供给她的 SSID，尽管她可以看到其他网络。Alice\
  \ 接下来应该做什么来尝试解决这个问题？\n1. 输入 WPA2 密码。\n2. 手动输入 SSID。\n3. 移靠近无线接入点 (WAP)。\n4. 远离休息室的微波炉。\n\
  \n### 152. Alice 是 Adatum 公司的新员工，当她询问笔记本电脑的无线网络访问时，她得到了一个服务集标识 (SSID) 和一个密码。她还被告知必须手动添加\
  \ SSID。稍后，她输入了 SSID，电脑提示她选择安全类型。由于不知道选哪个选项，她选择了 802.1x，因为听起来它最安全。然而，此选项并没有让她输入密码，于是她选择了另一个选项\
  \ WEP，并能够输入密码。但是，她的笔记本显示“无法连接到此网络”。下列哪个可能是 Alice 问题的原因？\n1. 容量过载\n2. 距离限制\n3. 频率不匹配\n\
  4. 加密协议不匹配\n\n### 153. Ralph 在跳蚤市场购买了一些用于台式电脑的 802.11a 无线网络适配器，他打算将其用于 802.11g 家庭网络。他在电脑中安装了其中一个适配器并尝试连接网络，但看不到他的服务集标识\
  \ (SSID)。他尝试了另一个适配器，认为第一个可能可能是坏了，但另一个也不行。Ralph 可以做什么来解决问题并将电脑连接到网络？\n1. 将电脑移靠近接入点\
  \ (AP)。\n2. 配置 AP 使用 5 GHz 频率。\n3. 在电脑的客户端软件中手动输入 SSID。\n4. 无。802.11a 设备无法连接到 802.11g\
  \ 网络。\n\n\n\n\n\n### 154\nRalph 负责一个无线局域网 (`WLAN`)，该网络由一个 `802.11n` `2x2:2` 接入点\
  \ (`AP`) 和带有各种网络适配器的笔记本电脑组成。一些笔记本支持 `802.11n`，大多数支持 `802.11g`，少数旧型号带有 `802.11a`\
  \ 适配器。该 `WLAN` 位于一栋大型办公楼内，那里有许多其他无线网络，Ralph 很难在 `2.4 GHz` 频段找到一个不拥堵的信道。扫描 `5 GHz`\
  \ 频段时，发现流量较少，于是重新配置了 `AP` 使用 `5 GHz` 信道。结果是某些笔记本能够连接到网络，而另一些则不能。连接失败最可能的原因是什么？Ralph\
  \ 必须做什么才能让所有笔记本都连接到无线网络？\n\n1. `5 GHz` 频段不支持自动信道选择。Ralph 必须配置每个笔记本使用与 `AP` 相同的信道，以便所有笔记本成功连接。\n\
  2. `802.11g` 标准不支持使用 `5 GHz` 频段进行通信。Ralph 必须配置 `AP` 支持 `2.4 GHz`，以便所有笔记本成功连接。\n\
  3. `5 GHz` 频段不支持多输入多输出 (`MIMO`) 通信，因此 `802.11n` 笔记本无法连接网络。Ralph 必须将 `AP` 替换为 `802.11g`\
  \ 设备，以便所有笔记本成功连接。\n4. `802.11a` 标准不支持使用 `5 GHz` 频段进行通信。Ralph 必须将这些笔记本中的网络适配器更换为更新型号以便它们成功连接。\n\
  \n### 155\nAlice 是一个无线网络的管理员，该网络在多个小办公室中有客户端计算机，这些办公室都位于一栋 20 世纪中期建造的办公楼的同一层。网络在楼层中心有一个\
  \ `IEEE 802.11g` 接入点 (`AP`)。大多数房间的工作站以 `54 Mbps` 的速度连接到网络，但某个特定房间的电脑连接速度很少超过 `11\
  \ Mbps`。以下哪项可能是问题的原因？\n\n1. 有问题的房间的电脑配置了与 `AP` 不同的无线加密协议。\n2. 有问题的房间的电脑正遇到 `SSID`\
  \ 不匹配。\n3. 有问题电脑的网络适配器支持 `IEEE 802.11a` 而不是 `802.11g`。\n4. 有问题电脑的 `RSSI` 可能较低，因为距离\
  \ `AP` 过远。\n\n### 156\n对于一个连接 `IEEE 802.11b/g` 接入点 (`AP`) 有间歇性问题的 `IEEE 802.11g`\
  \ 无线电脑，以下哪项不是解决方案？\n\n1. 在 `AP` 上安装高增益天线\n2. 将 `AP` 替换为支持 `802.11n` 的型号\n3. 将电脑靠近\
  \ `AP`\n4. 更改 `AP` 使用的信道\n\n### 157\nEd 为公司办公室工作的访客用户安装了一个独立的 `802.11n` 无线网络。访客网络是不安全的，Ed\
  \ 最近发现楼外的人能够访问它。无法移动接入点 (`AP`)，且必须以最大功率运行以覆盖整个大楼。以下哪种是防止楼外用户访问访客网络，同时让楼内用户使用的最方便的方法？\n\
  \n1. 每天更改密码\n2. 切换网络频率\n3. 禁用 `SSID` 广播\n4. 实施 `MAC` 过滤\n\n### 158\nAlice 正在尝试为仓库的用户平板电脑提供无线网络连接。仓库是一个巨大的混凝土结构，有许多内部空心墙。以下哪种类型的信号干扰正在阻碍\
  \ Alice 的努力？\n\n1. 折射\n2. 反射\n3. 衍射\n4. 吸收\n\n### 159\nRalph  {无法为大楼远端的某些高管办公室提供满意的无线网络性能。该无线接入点\
  \ (`AP`) 基于 `802.11g` 标准。办公室配有厚重的门和用于隔音的隔热墙，人员在工作期间通常让门关着。Ralph 可以采取哪些行动来为这些办公室的用户提供更好的无线网络性能？\n\
  \n1. 在靠近办公室的地方安装额外的 `AP`。\n2. 修改 `AP` 使用更高编号的信道。\n3. 将 `AP` 升级为基于 `802.11n` 标准的型号。\n\
  4. 配置 `AP` 禁用 `SSID` 广播。\n\n### 160\nRalph 无法为大楼远端的某些高管办公室提供满意的无线网络性能。办公室配有厚重的门和用于隔音的隔热墙，人员在工作期间通常让门关着。Ralph\
  \ 试图克服以下哪种无线信号干扰？\n\n1. 反射\n2. 折射\n3. 衍射\n4. 吸收\n\n### 161\nRalph 无法为大楼远端的一排玻璃墙会议室提供满意的无线网络性能。会议室的门也是玻璃制成的，且在会议进行期间总是关闭的。以下哪种类型的无线干扰可能是\
  \ Ralph 试图克服的主要问题？（选择所有适用项。）\n\n1. 反射\n2. 折射\n3. 衍射\n4. 衰减\n\n### 162\nAlice 收到一个电话，该用户使用带有\
  \ `802.11ac` 适配器的新笔记本无法连接公司的 `802.11g` 无线网络。在同一区域工作的其他用户可以顺利连接。以下哪些任务是 Alice 可以执行以解决问题的？（选择所有适用项。）\n\
  \n1. 在网络上安装一个 `802.11ac` 无线接入点 (`AP`)\n2. 更改无线接入点 (`WAP`) 使用的信道\n3. 在用户的笔记本中安装 `802.11g`\
  \ 网络适配器\n4. 让用户更靠近 `WAP`\n\n### 163\n几位会计顾问第一次在 Ed 的办公室工作，他们无法用笔记本连接到 `802.11g`\
  \ 无线网络。他们从“可用网络”列表中选择了正确的服务集标识符 (`SSID`)，但无法连接，且没有出现任何类型的错误消息。Ed 应该执行哪些任务来尝试解决问题？\n\
  \n1. 检查笔记本中网络适配器是否存在信道重叠\n2. 将无线接入点 (`WAP`) 使用的频率从 `2.4 GHz` 更改为 `5 GHz`\n3. 检查顾问工作区域是否存在可能的信号干扰源\n\
  4. 确保顾问的笔记本配置为使用正确的无线安全协议\n\n### 164\nEd 为公司办公室工作的访客用户安装了一个独立的 `802.11n` 无线网络。访客网络未使用安全协议，Ed\
  \ 最近发现楼外的人能够访问它。Ed 可以采取以下哪些步骤防止楼外用户访问访客网络，同时让楼内用户可以使用？（选择所有适用项。）\n\n1. 将无线接入点 (`WAP`)\
  \ 移动到大楼中心\n2. 降低 `WAP` 的功率水平\n3. 禁用服务集标识符 (`SSID`) 广播\n4. 实施媒体访问控制 (`MAC`) 过滤\n\
  5. 安装强制性门户 (Captive portal)\n\n\n\n\n\n### 165. Alice 收到一个用户的电话，用户使用带有 802.11g 网络适配器的笔记本无法连接公司的\
  \ 802.11n 无线网络。同一区域的其他用户都能顺利连接到网络。Alice 应该首先采取以下哪些步骤尝试解决问题？（选择所有适用项。）\n\n1. 更改无线接入点\
  \ (WAP) 使用通道\n2. 检查用户是否正在连接到正确的服务集标识 (SSID)\n3. 检查用户笔记本中的无线适配器是否已启用\n4. 为用户提供 802.11n\
  \ 无线网络适配器\n\n### 166. Ed 的 802.11n 无线网络用户经常性断开连接。以下哪项可能有助于解决问题？\n\n1. 重启无线接入点 (WAP)\n\
  2. 更改网络的服务集标识 (SSID)\n3. 更改设备正在使用的通道\n4. 更改无线安全协议\n\n### 167. 几位会计顾问第一次在 Ed 的办公室工作，他们无法用笔记本电脑连接到\
  \ 802.11n 无线网络。Ed 应该首先执行以下哪些任务尝试解决问题？（选择所有适用项。）\n\n1. 检查笔记本电脑网络适配器是否存在通道重叠\n2. 确保顾问们尝试连接到正确的\
  \ SSID\n3. 检查顾问工作区域是否存在可能的信号干扰源\n4. 确保顾问的笔记本配置为使用正确的无线加密协议\n\n### 168. Ralph 正在为一个客户部署\
  \ 802.11n 无线网络，客户要求在不部署额外服务器的情况下提供最好的安全性。在设置无线接入点 (WAP) 时，Ralph 禁用了服务集标识 (SSID)\
  \ 广播，选择了带有预共享密钥的 WiFi 保护访问 (WPA-PSKs)，并配置了媒体访问控制 (MAC) 地址过滤。关于这种安排的安全性，以下哪个说法是正确的？\n\
  \n1. 该配置是 Ralph 使用指定设备能达到的最高安全性。\n2. Ralph 不应禁用 SSID 广播，因为这会导致用户无法连接网络。\n3. Ralph\
  \ 不应使用 MAC 地址过滤，因为这会将 MAC 地址暴露在攻击之下。\n4. Ralph 应该使用 WiFi 保护访问 II (WPA2) 代替 WPA，因为它对某些类型的攻击抵抗力更强。\n\
  \n### 169. Ralph 在他的家用 802.11n 无线网络上遇到了接入点 (AP) 关联时间以及以及泛下降的问题。Ralph 住在一个大型公寓小区，当他运行\
  \ WiFi 分析仪时，发现许多附近的网络在使用 2.4 GHz 频率上常用的通道 1、6 和 11。Ralph 的设备无法使用 5 GHz 频率。Ralph\
  \ 应该做什么来提高网络性能？\n\n1. 配置其设备使用通道 2\n2. 配置其设备使用通道 5\n3. 配置其设备使用通道 9\n4. 配置其设备使用通道\
  \ 10\n\n### 170. 以下哪项是无线接入点使用的特定发射器和天线组合的功率测量？\n\n1. RSSI\n2. EIRP\n3. SSID\n4.\
  \ MIMO\n\n### 171. Ed 在当地电脑商店担任帮助台工作，收到一个尝试使用 Windows 10 和有线以太网设备建立家庭网络的客户电话。客户报告说，从她的电脑可以看到家里另外两台电脑，但无法访问互联网。Ed\
  \ 让她运行 `ipconfig /all` 命令并将结果读给他听。她说她的 IP 地址是 172.16.41.2，子网掩码是 255.255.255.0，默认网关是\
  \ 172.16.43.1。以下哪项最可能是客户问题的原因？\n\n1. 客户的网络网线未插好。\n2. 客户的子网掩码错误。\n3. 客户的默认网关地址错误。\n\
  4. 电脑的 DNS 记录包含错误信息。\n5. 电脑受到交换环路的限制。\n\n### 172. Ralph 有一个有线家庭网络，配备三台 Windows 电脑、一台交换机和一个提供互联网访问的电缆调制解调器/路由器。所有电脑都能访问互联网，但没有一台可以访问其他电脑的文件系统共享。以下哪项可能是这三台网络电脑最可能的原因？\n\
  \n1. 错误的 IP 地址\n2. 错误的子网掩码\n3. 错误的默认网关地址\n4. 错误的 ACL 设置\n\n### 173. Alice 被要求更新一份应收账款表格，包含当日入账付款信息，这是她从未执行过的任务。在网络服务器上找到并打开该表格后，她输入了新信息，但当她尝试保存更改时，收到一条错误消息，要求将文件保存到本地驱动器而不是网络服务器上。以下哪项可能是问题的原因？\n\
  \n1. 阻塞的传输控制协议/用户数据协议端口 (TCP/UDP)\n2. 错误文件系统访问控制列表 (ACL) 设置\n3. 错误的防火墙设置\n4. 不信任的安全套接层\
  \ (SSL) 证书\n\n### 174. 以下哪项 Internet 协议 (IP) 地址分配表示计算机无法与动态主机配置协议 (DHCP) 服务器通信？\n\
