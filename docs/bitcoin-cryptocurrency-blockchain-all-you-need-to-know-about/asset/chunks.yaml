  trans: '


    工作量（Proof of work）最早由 Cynthia Dwork 和 Moni Naor 于 1993 年创建（尽管直到 1999 年才正式命名）。它的开发目的是作为一种防止网络垃圾邮件和拒绝服务攻击的方法。从简单定义上讲，工作量仅仅是一种算法，通过用户执行某些加密问题的计算来寻找解决方案。一旦获得解决方案，它就可以被所有其他用户验证并添加到相应的区块链中。


    比特币使用由美国国家安全局（NSA）于 2001 年开发的特定类型工作量证明算法，称为 `SHA-256 Proof-of-Work Scheme`。`SHA-256
    Proof-of-Work Scheme` 被认为是一种哈希工作量算法，因为无论输入是什么，它的输出始终是一个 256 位的哈希值。这意味着永远无法识别初始初始数据的长度，这是一种安全上的优势。


    `SHA-256` 工作量证明算法负责构建比特币区块链网络中的区块，并作为网络用户之间信任的源泉。


    使用 `SHA-256` 工作量算法执行新区块首先是为每个区块提供一个头部。区块头由时间戳、软件版本号、`Merkle Root` 的哈希、`nonce`、目标哈希以及上一个区块的哈希组成。这些数据随后用于解决一个复杂的数学问题。


    首先，在区块头部添加一个 `0`。添加到区块头部的额外新数字被称为 `nonce`。然后对新的区块头进行哈希处理，查看其生成的哈希值是否小于目标哈希。如果不是，通过向区块头部加
    `1` 并再次进行哈希来增加 `nonce`。这个过程通过试错持续进行，需要大量的计算力来找到合适的 `nonce`。


    由于解决区块需要巨大的力量，人们共享他们的计算能力并共同工作。这些人被称为 `miners`（矿工）。每个矿工的计算机都积极工作求解区块的 `nonce`，并共享结果（包括错误的
    `nonce`），这意味着找到解决方案的概率随着时间的推移而增加。


    在比特币中，新区块大约每十分钟一个的速度添加到某处。一旦区块被添加，就几乎无法更改，因为这将更改所有之前的区块。这种不可篡改性提供了防篡改保护，并确保了最长链作为链的框架。


    ## 区块链溯源 (Blockchain Provenance)


    区块链由于基于工作量证明的共识算法而免受篡改影响。这体现了系统的另一个优势：它可以展示溯源性。溯源是从区块最早已知历史开始的所有权记录。


    自远古以来，溯源一直是经济活动的核心。例如，相关方可能需要验证待交易动物的所有权，或待出售房屋的所有权。验证资产所有权通过证明每种资产的真实性来保护双方。


    通常，使用第三方来证明每种资产的真实性。这体现了系统的另一个优势：它可以展示溯源性。溯源是从区块最早已知历史开始的所有权记录。验证资产所有权通过证明每种资产的真实性来保护双方。


    ## 区块链不可篡改性 (Blockchain Immutability)


    不可篡改性是区块链保持不变的能力。不可篡改性是区块链保持不变的能力。一旦区块被添加，就无法删除。


    使用数字签名进一步增强了不可篡改性。数字签名也称为 `hashes`。数字签名与区块链的区别在于，数字签名使用公钥加密和私钥解密。


    ## 智能合约 (Smart Contracts)


    除了不可篡改性和证明溯源的能力外，区块链还可以通过使用智能合约来增强合约安全性。根据 Investopedia 的说法：


    智能合约是一种数字合约，直接包含多个方之间的协议。智能合约会自动执行在区块链上确定并维护的条款和协议。此外，合约的代码是不可逆的且是完全可追溯的。


    执行智能合约最著名的区块链是以太坊。以太坊之所以流行是因为它允许开发者编写智能合约程序。这些程序使用一种名为 `Solidity` 的自定义语言编写，并在
    `Ethereum Virtual Machine`（`EVM`）上开发。


