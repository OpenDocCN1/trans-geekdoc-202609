- raw: 'In addition to accelerating transactions, blockchain also instills trust.
    The trust stems from natural built-in security measures that protect from hacks,
    falsified data, or alterations by humans. One such measure is blockchain’s decentralized
    network. This makes compromising blockchains difficult by removing any single
    point of entry. Another innate security feature is the fundamental algorithms
    used, such as Bitcoin’s proof-of-work algorithm (which seems to follow the Byzantine
    Fault Solution). These algorithms can function with digital signatures to confirm
    transactions, which further increases integrity.


    In the next chapter, I will discuss the differences between different blockchain
    ledgers and crypto token types. The Token Taxonomy Initiative will be introduced
    and summarized, as well as personal identity hubs. The chapter will conclude by
    revealing the intersection point of bartering, cryptocurrency, and financing.


    # 09 The Intersection of Blockchain, Bartering, and Cryptocurrency


    This chapter outlines how blockchain technologies can be the ideal platform for
    the intersection of investment finance, cryptocurrency, and bartering.


    Crypto tokens can act as a standard unit of measure for the exchange of value
    as an alternative to government-controlled fiat. Blockchain technology provides
    innovative new ways for businesses to raise venture capital, including the comprehensive
    security token offerings (STOs) as instituted and regulated by the U.S. government.


    The chapter will also examine the differences between asset tokens, utility tokens,
    and currencies, and will show how the Token Taxonomy Initiative (TTI) will provide
    a universal framework for the instantiation of tokens.


    Blockchain is transforming microfinancing programs and making capital more accessible
    by facilitating less restrictive credit reporting for applicants and lower interest
    rates. The chapter will present how block chain handles identity management and
    the idea of decentralized data with personal identity hubs, Finally, the chapter
    will compare and contrast private permissioned ledgers against public permissioned
    ledgers.


    ## Blockchain and Venture Capital


    Blockchain technology facilitates innovative new ways for businesses to raise
    venture capital, including security token offerings (STOs), which can accommodate
    hundreds of investors as opposed to tens for a conventional venture capital (VC)
    fund.^([1](#notes.xhtml#chapter9-1))


    A fledgling business armed with a white paper, website, and a custom cryptocurrency
    can canvas their vision to potential investors. The investors then fund the company
    with fiat in exchange for a proportional amount of the business’s newly minted
    cryptocurrency. The investor is gambling that the value of the cryptocurrency
    received will increase dramatically, as the business idea matures along with widespread
    support. This initial investment was generally through the form of initial coin
    offerings (ICOs), but after they fell into disrepute, STOs became the legitimate
    way forward.^([2](#notes.xhtml#chapter9-2))


    ICOs acted as fundraising mechanisms for new projects by allowing the proposed
    digital coin to be exchanged for Bitcoin, Ether, or fiat money. ICOs were related
    to initial public offerings (IPOs), whereby investors can purchase shares of a
    company.^([3](#notes.xhtml#chapter9-3)) Unfortunately, ICOs raised millions of
    dollars from the public with zero regulation, which allowed unscrupulous scammers
    to ruin the ICO concept.^([4](#notes.xhtml#chapter9-4)) As a result, in 2017 the
    Securities and Exchange Commission (SEC) classified tokens from ICOs as securities,
    and outlawed them on the basis that they are misleading to investors.^([5](#notes.xhtml#chapter9-5))
    In 2017, ICOs raised $5.6 billion, but today investors are hungry for a legal
    alternative to fuel entrepreneurial innovation and wealth.^([6](#notes.xhtml#chapter9-6))


    The legality of STOs is an obvious advantage over ICOs. The market potential for
    STOs lies in the fact that they allow investors to invest legally and maintain
    digitally secure stock certificates.^([7](#notes.xhtml#chapter9-7))


    To evaluate an STO, the Howey test is used. The Howey test assesses whether a
    token offers the opportunity to contribute or invest money in return for a share
    in company profits. If a token does provide this opportunity, then it is considered
    a security token offering.^([8](#notes.xhtml#chapter9-8))


    Another method for determining if a token qualifies as an STO or not is based
    on whether it is built on a blockchain system acting as a distributed ledger.
    In this case, the token is considered a “security instrument” under Section 2(a)(1)
    of the Securities Act of 1933. This act focuses on investment contracts, and in
    the case of cryptocurrencies, considers blockchain a secure investment contract.^([9](#notes.xhtml#chapter9-9))


    The regulations associated with STOs make them costly in terms of complying with
    SEC regulations, so STO enforcement may stifle investment opportunities. Another
    approach that may be practical for businesses to at least start with is the *utility
    token.*


    Utility tokens are user tokens or app coins which act as a digital coupon that
    can be redeemed for discounts or access to future products and services offered
    by the company. Utility tokens are not considered investments and are therefore
    exempt from the federal laws governing securities.^([10](#notes.xhtml#chapter9-10))


    Holders of utility tokens gain exclusive, direct access to the business that issues
    them, as the token has no use or value elsewhere.^([11](#notes.xhtml#chapter9-11))
    The utility token can serve as an asset such as a vehicle deed for a car manufacturer.
    The car manufacturer thereby eliminates the need for intermediaries (i.e., car
    dealerships).


    ## The Token Taxonomy Initiative (TTI)


    With all these tokens, things can seem a bit complicated. To alleviate this confusion,
    a new standard for digital tokens has been established. This standard is called
    the Token Taxonomy Framework (TTF).


    The TTF was established in 2019 by members of the Token Taxonomy Consortium. The
    consortium’s mission is to facilitate the connection between business and blockchain
    by creating a set of universal definitions that both developers and business professionals
    can understand.^([12](#notes.xhtml#chapter9-12)) Specifically, it focuses on the
    different uses of tokens so that people can know how to use them in a variety
    of industries. As Marley Gray, chair of the Token Taxonomy Consortium and principal
    architect of Microsoft, states:


    > Whether it’s a ticket, supply chain documents, stocks, property titles, loyalty
    points, or other as-yet unthought-of blockchainbased products and services, token
    use should be able to implement ow across platforms. If we want to take full advantage
    of what collaborative platforms have to offer, cross-platform transactions must
    be able to communicate with one another. Standards are where that starts, and
    this Framework makes unlocking the untapped potential of tokens on the blockchain
    possible.^([13](#notes.xhtml#chapter9-13))


    The standards outlined by the TTF are shared on a GitHub repository, meaning the
    information is publicly available for use. Information contained here provides
    intelligence on various token concepts through use cases, terminology, taxonomy,
    and technology discussions. There is also a set of reusable tools, which enables
    users to design their tokens quickly.'
