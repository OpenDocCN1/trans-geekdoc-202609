- raw: 'Many Web 3.0 projects rely heavily on cryptocurrencies (Web 3.0 tokens) to
    offer a monetary incentive to motivate otters to help create, govern, and contribute
    to the needs of the projects. People can earn a living by participating in the
    project in various ways, both technical and nontechnical. These projects may provide
    various infrastructure-related services, such as computation, networking, storage,
    and identity management services formerly offered by cloud providers. Web 3.0
    tokens are the digital assets associated with the vision of creating a decentralized
    Internet.


    An example of a Web 3.0 project is the Livepeer^([28](#notes.xhtml#chapter15-28))
    project, based on Ethereum, and provides a marketplace for video infrastructure
    providers and streaming applications. Another example is the Helium project, which
    rewards consumers and small businesses with Web 3.0 tokens. They supply and confirm
    wireless coverage and send device data through the network via the blockchain.
    True to the vision of decentralization, needless and frequently wasteful intermediaries
    such as the monolithic Amazon or Microsoft Azure cloud services are disintermediated.


    Another example is Reddit,^([29](#notes.xhtml#chapter15-29)) which plans to leverage
    Web 3.0 tokens to allow users to essentially control pieces of the on-site communities
    in which they participate. By posting on a specific section on the site, a subreddit,
    users can earn community points. Users can also earn points based on how much
    their post gets upvoted. Users would use “community points,” which they would
    gain by posting on a specific subreddit. The user then makes points based on how
    many users upvote or downvote a particular post. (It’s simply a blockchain version
    of Reddit Karma.)


    ## NONFUNGIBLE TOKENS


    In the chapter “How to Create a Nonfungible Token,” I described how NFTs are becoming
    a widespread blockchain phenomenon. *NFT* was picked as the word of the year for
    2021 by Collins Dictionary.^([30](#notes.xhtml#chapter15-30)) In this section,
    I will explain why they will play an essential role in the metaverse. NFTs are
    blockchain tokens that can be used to prove ownership of connected digital assets.
    Think of an NFT as a cryptographic deed of title. NFTs have typically been used
    for trading digital art pieces. Still, in theory, they can be connected to anything,
    including virtual avatars, games, books, virtual estate, and eventually even real-world
    assets. In the metaverse, tokens will be necessary not just for user authentication
    but also for authorization; to prove that a user can access a given resource or
    service.


    To a certain extent, the ability to build, trade, and invest in products, goods
    and services will rely heavily on NFTs. Additionally, NFTs will be used to prove
    that someone is the rightful owner of a particular object.


    ## Architecting the Metaverse


    The metaverse is ushering in a surge in virtual land and property price. For example,
    in Decentraland, the blockchain-based online world, a plot of land recently sold
    for $900,000.^([31](#notes.xhtml#chapter15-31))


    What does the concept of a building or of architecture mean in the metaverse?
    Examples of platforms where virtual land abs buildings can be rented or sold include
    Decentraland, Sandbox, and Cryptovoxels. A critical vision is that users will
    hold conferences, create buildings, engage in transactions, and host social functions.
    The metaverse will provide virtual experiences for recreation, education, business,
    and entertainment. In partnership with software developers, architects can create
    unique designs, with NFTs providing the necessary cryptographic title deeds for
    proof of ownership.


    Starting with constructing simple virtual buildings, Decentraland opened its platform
    to users in 2020. By 2021, it was very well populated, including virtual real
    estates such as shopping malls, casinos, event venues, and art galleries. The
    buildings are essentially branded spaces with links to web-based information such
    as product and service information, resources, logos, and marketing copy. Example
    buildings include Raible, Winklevoss Capital, CoinGecko, and Fashion Coin.


    Some companies such as the crypto exchanges Binance US and Kraken invite DJs to
    play music and even event managers to welcome guests and help them navigate the
    virtual spaces. In addition, some guests attended fun events at these buildings,
    where there was an opportunity to meet and mingle with celebrities.


    Typically, the Decentraland team creates its buildings for strategic partners
    and high-profile clients. There are, however, production studios in the metaverse
    that provide commercial construction services. Usually, these studios are responsible
    for the architecture and construction management of a customer’s virtual land.


    An example of a metaverse production studio is DappCraft.^([32](#notes.xhtml#chapter15-32))
    Since 2019, DappCraft has been servicing construction orders for the simple office
    to the more complex projects, with blockchain-based smart contracts integration.
    DappCraft has been operating since 2019 and accepts construction orders: from
    simple offices to the most complex ideas with data visualization and smart contract
    integration. DappCraft has been operating since 2019 and accepts construction
    orders from simple offices to the most complex ideas with data visualization and
    smart contract integration.


    The DappCraft website^([33](#notes.xhtml#chapter15-33)) lists various specialists
    as crucial to the makeup of their construction team. I have augmented the list
    with additional expertise which I deem necessary.


    1.  Backend programmer. Responsible for the server-side application logic and
    API integration.


    2.  Database administrator. Responsible for the administration and management
    of the backend data models.


    3.  Front- end programmer. Responsible for the presentation of the user interface
    (UI) layer. Preferably someone with gaming industry expertise.


    4.  3D modeler. Responsible for the architecture, modeling, and rendering of the
    3D virtual buildings.


    5.  Animator. Responsible for 3D creating the overall animation experience.


    6.  Blockchain programmer Responsible for coding blockchain- based decentralization,
    NFTs, smart contracts, and altcoins integration.


    7.  Manager. Responsible for managing the project.


    8.  Solution architect. Responsible for overall architecture, design, and technical
    delivery.


    9.  Hardware specialist. Responsible for integrating all relevant hardware, such
    as VR/AR headsets and neural interface devices.


    # Appendix


    Blockchain for Contract and Records Management


    Gartner Research lists records management as one of four key blockchain business
    initiatives saving on costs and providing opportunities to generate revenue (see
    Figure Appendix-01, next page). The technology has the potential to impact all
    record management processes and extend their capabilities.^([1](#notes.xhtml#bm1-1))
    Here I’m going to outline specific challenges with records management and how
    blockchain can help to solve them (see Figure Appendix-02, next page).


    ## Security and Confidentiality


    The number of data breaches increased by more than 400 percent in 2018, exposing
    almost 15 billion records, according to the identity intelligence company 4iQ.^([2](#notes.xhtml#bm1-2))
    According to the latest data breach report by IBM and the Ponemon Institute, the
    cost of a data breach in 2021 is $4.24 million—a 10 percent rise from the average
    cost in 2019, which was $3.86 million.^([3](#notes.xhtml#bm1-3)) Eighty-eight
    percent of companies surveyed feel they are losing control over their data.^([4](#notes.xhtml#bm1-4))


    ![Figure Appendix-01. Integrating records management with blockchain.](images/img-212a.jpg)


    Figure Appendix-01. Integrating records management with blockchain.


    ![Figure Appendix-02. The challenges faced by records management.](images/img-212b.jpg)


    Figure Appendix-02. The challenges faced by records management.'
