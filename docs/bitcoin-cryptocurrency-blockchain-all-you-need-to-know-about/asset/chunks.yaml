    3. Bob 向社交市场居民银行（`Social Bank`）申请借入价值 10,000 美元的 `SCC`，银行迅速以极具竞争力的利率批准了他的申请。银行通过一个由在线贷款平台
    `Kiva` 驱动的替代信贷评级机构对 Bob 的信用状况进行了检查。


    4. Alice 使用等额的法币从社交市场购买了价值 8,000 美元的 `SCC`。Alice 将购买的 `SCC` 存入银行。银行从这种安排中获益，因为它可以利用部分准备金银行制度为社区创造更多的
    `SCC`。


    5. `SCC` 与美元价值一一一挂钩。因此，它是一种稳定币，旨在为波动剧烈的加密货币市场提供梦寐以求的稳定性。


    6. Alice 和 Bob 分别在社交市场上发布他们的产品和服务，供其他成员购买购买。


    7. Alice 计划去加拿大旅行，因此她在社交市场上寻找在留期间期间可以租住的方便房间，并发现了 Bob 的宾汽车旅馆。Alice 选择了房间并用 `SCC`
    支付了费用。一个私有许可区块链账本执行了一个智能合约，将 `SCC` 转移到 Bob 的账户，同时授权 Alice 的生物指纹访问她租住的房间。


    8. 与租赁相关的所有必要数字记录和合同文档都存储并同步在一个具有相应智能合约的合同管理系统中。


    9. Alice 从荷兰出发旅行，作为一项创新尝试的一部分，她可以使用她的区块链去中心化数字身份来代替护照。


    区块链，或分布式账本具有三个基本构建区块：`tokens`、`contracts` 和 `identity hubs`，后者是用于构建多方应用程序的身份或标识符。区块链通过使用约定的加密技术建立真实性，以创建
    `tokens`、`contracts` 和身份的数字表示，从而代表了一个共享的“真相”。


    下一节将描述各种技术组件。


    ## 数字身份与身份枢纽


    如今，政府和企业机构服务提供者控制着我们大多数数字身份以及核心数据和记录。这些机构管理并限制对我们数据的访问，包括拒绝或撤销访问权限。


    数字标识符是由用户创建并拥有的唯一标识符，根根于全球去中心化系统。这些标识符具有独特特性，例如不可篡改性以及抗审查和抗篡改性。


    根据 `Sphereon` 技术官 Niel Klomps 的说法，去中心化标识符（`DIDs`）也被称为“主权身份”，它们是实现各种解决方案的关键，包括数字签名、投票以及网络或移动应用程序身份验证。一个
    `DID` 附着于你个人以及你的设备上。


    区块链开启了数据去中心化时代；作为一个平台，它促进了一个由我们（用户）控制的身份和数据的新纪元。我们现在可以使用由个人和组织直接拥有的身份系统来增强现有的云身份系统。`DIDs`
    让我们对我们共享的内容以及与谁共享拥有完全控制权，外撤销访问的能力。考虑这对新一波社交媒体的影响，在这些平台上，用户拥有他们所有的内容，并对这些数据如何使用甚至如何变现拥有权限。


    今天，我们必须向无数应用和服务授予完全同意，结果导致我们的身份数据分散在许多提供商处。个人需要一个安全的加密的数字枢纽，他们可以在那里存储身份数据并轻松地控制对其的访问。


    个人身份枢纽是加密数据存储器的复制网格，由云和硬件（如 `PCs`、手机和平板电脑）组成，促进了身份数据的存储和身份交互。这些枢纽是开源服务器技术，你可以在任何设备或基础设施上运行它们，从而确保身份数据不会绑定到任何特定的组织或基础设施上。`DIDs`
    配合身份枢纽个人数据存储可以创建一类新的应用程序和服务。微软的身份枢纽实现是托管在 `Azure` 云基础设施上的 `Cosmos` 数据库。


    通过只分享你想要的内容来保持对私有数据的控制。不要将你的详细信息发送到单个中央数据库中，而是自己保留它们——仅在获得批准时将特定信息传递给特定的接收者。


    ![图 12-02。身份枢纽框架。](img/img-155.jpg)


    图 12-02. 身份枢纽框架。


    考虑医疗记录的世界。当你去看医生时，必须填写与上次访问时完全相同的表格（有时还要填写多次），你不觉得感到沮丧吗？当你与不同的服务提供商进行测试或实验时，你会在许多地方拥有医疗记录。在我生活的迈阿密，我必须手动与医生合作收集所有的医疗记录。如果这些提供者可以将测试结果写入我们的身份枢纽，那不是太好了？数据随后可以通过个人仪表板展示，这样我们就可以轻松查看关键分析和通知。


    哈佛大学最近开始发放存储在区块链上的文档作为文凭和学位。类似地，我们可以在身份枢纽上存储相关的学术记录，以及就业相关的文档，如简历、背景信息，甚至是药物检测结果。我们只需要通过给招聘人员或雇主读取权限即可。


    ## DID 证明


    在一个主权身份的世界里，任何人都可以创建和管理自己的 `DID`，你如何知道何时信任某个身份、凭证或记录？我们实际上如何在 `DIDs` 之间建立信任？当我们创建一个
    `DID` 时，它从诞生开始就没有经过验证的凭证，只有所有者才能证明拥有权。


    回想社会构建的架构并考虑监管机构和受信任的中间人。我们目前如何建立信任？我们让政府部门发布身份证明，例如驾驶执照、社会安全号码或护照。例如，驾照是由州机动管理局（`DMV`）颁发的。


    为了积累合法性证据，`DIDs` 需要来自信任的机构和政府中介的背书或证明。基于 `DID` 的系统提供了一种机制，用于创建带有时间戳且不可篡改的证书以供验证。基于
    `DID` 的 `DMV` 可以证明区块链驾照的完整性，受信任的医疗实验室可以验证提交给它的健康记录是真实的。使用与名为“零知识解决方案”的过程相结合的 `DID`
    证明，使 Alice 和 Bob 能够在区块链上存储敏感信息，以便他们可以在不泄露实际数据的情况下向依赖方验证他们的凭证。


    '
