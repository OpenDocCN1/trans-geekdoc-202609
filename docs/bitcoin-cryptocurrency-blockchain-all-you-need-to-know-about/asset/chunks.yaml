    # 10 Cryptocurrency and Government Regulation


    While the current state of cryptocurrency is of interest to many people, the future
    of this industry is the most important thing about it. Cryptocurrency is a new
    concept, and it is attempting to penetrate the traditional banking system as well
    as other industries. This means that it operates with a proverbial target on its
    back, placed by regulatory agencies and detractors within the domain of centralized
    finance. This chapter will discuss the current government regulations on cryptocurrency
    in addition to predictions of future regulation in the United States and Europe.


    This chapter will also discuss the state of crypto in China. China has decided
    to create its own digital currency, a concept pioneered by the Chinese (but which
    is also being considered by other nations).


    ## How the U.S. Government Feels about Cryptocurrency


    Cryptocurrency first appeared on the U.S. government’s radar in 2017, after the
    Bitcoin bubble. With Americans circulating millions of dollars through this mysterious
    platform, the Securities and Exchange Commission and the Commodities Futures Trading
    Commission stepped in (see Figure 10-01). In the United States, any transfer of
    money above $15,000 is required to be taxed. In a meeting with the New York Federal
    Reserve, the chairman of the SEC explained that Bitcoin was a topic of great urgency,
    as the unregistered transfer of funds of such magnitude had the ability to destabilize
    the market. Soon after, the SEC restricted any exchange-traded funds (ETFs) from
    including cryptocurrencies. It also decided not to register initial coin offerings
    (ICOs). In the summer of 2017, the SEC released a statement explaining that while
    some ICOs can be legitimate investments, they have the potential to be fraudulent.
    In that year alone, there were three SEC enforcement actions against ICOs.


    In 2017 the Commodities Futures Trading Commission (CFTC) designated Bitcoin as
    a commodity, meaning that all fraudulent activity in addition to all futures trading
    of Bitcoin was under its control. With this power, the CFTC issued two Bitcoin
    futures and a legitimate swap execution for these futures.


    ![Figure 10-01. The Regulation of Digital Assets.](images/img-126.jpg)


    Figure 10-01. The Regulation of Digital Assets.


    The IRS established possibly the most complex review of Bitcoin in 2017. For the
    IRS, Bitcoin is property. This means that the IRS taxes profits from trading Bitcoin.
    Likewise, if it is simply held, then regular taxes are issued for gains or losses.


    In terms of state-by-state regulation of cryptocurrency, there was a greater level
    of acceptance (see Figure 10-02). Vermont began allowing transaction records on
    the blockchain as evidence in court, and other states eventually went as far as
    to promote the cryptocurrency platform; Delaware began allowing companies to issue
    their shares via a blockchain system. A national conference formed to guide states
    on how to address federal laws also decided that states had the ability to allow
    cryptocurrency businesses to operate within them.


    ![Figure 10-02. Top 5 U.S. States That Have a Friendly Cryptocurrency](images/img-127.jpg)


    Figure 10-02. Top 5 U.S. States That Have a Friendly Cryptocurrency


    The last U.S. department or agency that took a stand on cryptocurrency in 2017
    was the Department of the Treasury (USDT). The USDT is focused on maintaining
    stability in the United States economy, and within this department is a bureau
    known as the Financial Crimes Enforcement Network. It was assigned the role of
    regulating cryptocurrency within the USDT, and it decided that cryptocurrency
    would not be considered legal tender in the United States. However, they said
    they would investigate how it can play a safe role in the U.S. economy.


    U.S. government regulation of cryptocurrency has taken an interesting path since
    the bubble of 2017. Beginning with a period that sparked plenty of fiscal speculation,
    cryptocurrency has proved to be more than a fad. Nevertheless, it still has plenty
    to prove, and the U.S. government has demonstrated that it is not completely at
    ease with crypto. It can even be said that because cryptocurrency is gaining more
    acceptance, U.S. government regulation is only just beginning.


    ## Europe Accepts Crypto


    Europe has followed its own path on cryptocurrency. As far as the European Union
    is concerned, any company that facilitates a cryptocurrency transaction must register
    the sender and receiver of the currency. This policy was implemented to reduce
    the number of illegal transactions that take place involving crypto. As July 2021,
    one must list one’s name, address, date of birth, and company-specific account
    number in order to send or receive crypto.


    In Europe, Germany is embracing crypto enthusiastically. Cryptocurrency in Germany
    is not taxed if it is held for over a year. For this reason, Berlin is known as
    the cryptocurrency capital of Europe.


    In another European country, Switzerland, known for its lenient banking laws,
    a piece of legislation called the Blockchain Act was passed. This law allows companies
    to innovate and create in cryptocurrency and blockchain without government interference.
    Europe’s openness to crypto may shift innovation from the United States, as company
    leaders and entrepreneurs may begin to feel more welcome across the Atlantic.


    ## China’s Dance with Digital Currency: The Digital Yuan and Bitcoin

