- raw: 'This chapter will also explore how several American governing authorities
    are approaching the regulation of cryptocurrencies. Some of the reviewed authorities
    include the Security and Exchange Commission (SEC), the Federal Trade Commission
    (FTC), the Financial Crimes Enforcement Network (FinCEN), and the Financial Action
    Taskforce (FATF).


    The chapter will conclude with a more in- depth conversation on smart contracts,
    and a summary of the Token Taxonomy Framework developed by the Enterprise Ethereum
    Alliance.


    ## The Problem of Jurisdiction


    Blockchains can be classified as either *open* or *closed.* Open blockchains are
    either *public and permissionless* or *public and permissioned.*^([1](#notes.xhtml#chapter11-1))
    In public permissionless blockchains, anyone can join the network and volunteer
    to contribute to its upkeep. On the other hand, public permissioned blockchains
    require permission to enter the system as a node, and the owner dictates which
    members can contribute to its governance. In both open blockchains, the network
    is viewable to all members.


    Closed blockchains are either consortiums or private permissioned blockchains.
    Only an authorized set of members can view the consortium, and only approved members
    can contribute to its network. Permissioned blockchains are either fully unviewable
    or have viewing restricted to a limited set of permissioned nodes. Only the network
    operator can alter the network.


    Both open and private blockchains occur over decentralized networks, meaning that
    nodes can exist around the globe. As a result, there is a high chance that transactions
    could be happening under multiple jurisdictions, which would mean that they would
    encounter various laws and regulations.^([2](#notes.xhtml#chapter11-2))


    While stumbling across multiple jurisdictions is nearly inevitable in both blockchain
    systems, private blockchain systems can at least lessen the effects by creating
    internal governance and legal frameworks to dictate transactions.


    ## Data Privacy and Security


    Accountability is an essential part of the European Union’s General Data Protection
    Regulation (GDPR). These regulations require the party controlling personal data
    to be defined and to be responsible for protecting such data. When compared to
    GDPR, Blockchain has an inherent property of distributing data to all the participants
    in the network to achieve decentralization. Second, data on a blockchain is immutable
    to maintain data integrity in the network.^([3](#notes.xhtml#chapter11-3)) The
    party must have a set controller and processor. The controller refers to the member
    or members in charge of dictating how data will be processed. A processor, on
    the other hand, is the party that processes the controller’s data. In standard
    cloud computing protocols, individuals uploading data are to be considered controllers,
    while the cloud system’s operator is its processor.


    Most blockchains function with peer-to-peer networking, meaning that controllers
    and processors cannot be easily identified. For example, since the blockchain
    is made up of various nodes that run the necessary algorithms for the blockchain
    to function, it would seem that these nodes should be considered processors. However,
    because the nodes do not process personal data, but rather perform calculations
    to generate additional blocks, they are not considered processors under the GDPR.^([4](#notes.xhtml#chapter11-4))


    A private permissioned blockchain represents the best way to determine controllers
    and processors so that the blockchain technology meets the criteria set by GDPR.
    In these blockchains, a network member or set of network members can be assigned
    as the blockchain’s operator, which means they can determine controllers and processors.
    For instance, they can require their nodes to be located within the same jurisdiction.
    These specific nodes would be the processors, while the individuals uploading
    data would be the controllers. Additional restrictions can also be implemented,
    such as prohibiting users from uploading harmful files.


    More security lies in blockchain technology’s immutability and provenance. Together,
    these characteristics make it nearly impossible for someone to tamper with data
    held on a blockchain network. Furthermore, the numerous decentralized nodes cumulatively
    hold the highest computing power for the operation of the blockchain. Harnessing
    this power would require the system to be altered by an external factor, which
    is exceptionally difficult.


    ## Cryptocurrency Regulation and Taxation


    Federal agencies have argued about how to regulate cryptocurrency, which had a
    market value of more than $2.8 trillion as of November 2021.^([5](#notes.xhtml#chapter11-5))
    The first question is, does cryptocurrency, a currency with no absolute value,
    fall under SEC jurisdiction? According to court records, the answer is yes. In
    September 2021, a Freedom of Information Act (FOIA) request found that the SEC
    may be investigating Tether and Tether Operations Limited. Tether (USDT) is a
    blockchain-based cryptocurrency. It is a stablecoin, meaning its tokens in circulation
    are backed by an equivalent number of U.S. dollars. Stablecoins track traditional
    fiat currencies, like the dollar, the euro, or the Japanese yen, which are held
    in designated bank accounts.^([6](#notes.xhtml#chapter11-6))


    In May 2021, SEC chair Gary Gensler said he would like to see more regulation
    around cryptocurrency exchanges. Crypto tokens that are issued in the same way
    as classic investment tokens do fall under the SEC’s jurisdiction.^([7](#notes.xhtml#chapter11-7))


    According to the CNBC website, the IRS treats virtual currencies, like Bitcoin,
    as property, meaning that they are taxed in a manner similar to stocks or real
    property. The IRS refers to cryptocurrency as virtual currency, and these transactions
    are taxable by law, just like transactions in any other property. If you buy one
    Bitcoin for $10,000 and sell it for $50,000, you face $40,000 of taxable capital
    gains. Taxpayers transacting in virtual currency may have to report those transactions
    on their tax returns. Classifying cryptocurrency as virtual currencies makes tax
    accounting more complicated, especially as they can be exchanged for real currency
    or used as a substitute.^([8](#notes.xhtml#chapter11-8)) Accountants must stay
    aware of these classifications to understand how cryptocurrencies are intended
    to be taxed. While this concept is relatively simple, it isn’t always clear what
    constitutes a “taxable event.”


    In a May 2021 article titled “Cryptocurrency Poses a Significant Risk of Tax Evasion,”^([9](#notes.xhtml#chapter11-9))
    the CNBC website noted that the Treasury seemsparticularly concerned about wealthy
    Americans who shift taxable assets into the crypto economy to avoid tax. “Cryptocurrency
    already poses a significant detection problem by facilitating illegal activity
    broadly including tax evasion,”^([10](#notes.xhtml#chapter11-10)) according to
    a Treasury report, which outlined the Biden administration’s tax-compliance agenda.
    Failure to classify these options demonstrates that there is still much development
    needed for proper tax regulation.^([11](#notes.xhtml#chapter11-11))


    Lawmakers in Washington have been grappling with the thorny topic of crypto regulation
    for some time, and senior figures, from treasury secretary Janet Yellen to SEC
    chair Gary Gensler, all believe more oversight is necessary.


    As of this writing, the popular cryptocurrency exchange Coinbase now issues 1099-K
    forms to customers with at least 200 orders during the year, with the total value
    of those orders equal to or greater than $20,000.


    Crypto exchanges in the United States fall under the regulatory scope of the Bank
    Secrecy Act (BSA) and must register with the Financial Crimes Enforcement Network
    (FinCEN). They are also required to comply with obligations against money laundering
    and the financing of terrorism.^([12](#notes.xhtml#chapter11-12))'
  fmt: '

    This chapter will also explore how several American governing authorities are
    approaching the regulation of cryptocurrencies. Some of the reviewed authorities
    include the Security and Exchange Commission (`SEC`), the Federal Trade Commission
    (`FTC`), the Financial Crimes Enforcement Network (`FinCEN`), and the Financial
    Action Taskforce (`FATF`).


    The chapter will conclude with a more in- depth conversation on smart contracts,
    and a summary of the Token Taxonomy Framework developed by the Enterprise Ethereum
    Alliance.


    ## The Problem of Jurisdiction


    Blockchains can be classified as either `open` or `closed.`. Open blockchains
    are either `public and permissionless` or `public and permissioned.`^([1](#notes.xhtml#chapter11-1))
    In public permissionless blockchains, anyone can join the network and volunteer
    to contribute to its upkeep. On the other hand, public permissioned blockchains
    require permission to enter the system as a node, and the owner dictates which
    members can contribute to its governance. In both open blockchains, the network
    is viewable to all members.


    Closed blockchains are either consortiums or private permissioned blockchains.
    Only an authorized set of members can view the consortium, and only approved members
    can contribute to its network. Permissioned blockchains are either fully unviewable
    or have viewing restricted to a limited set of permissioned nodes. Only the network
    operator can alter the network.


    Both open and private blockchains occur over decentralized networks, meaning that
    nodes can exist around the globe. As a result, there is a high chance that transactions
    could be happening under multiple jurisdictions, which would mean that they would
    encounter various laws and regulations.^([2](#notes.xhtml#chapter11-2))


    While stumbling across multiple jurisdictions is nearly inevitable in both blockchain
    systems, private blockchain systems can at least lessen the effects by creating
    internal governance and legal frameworks to dictate transactions.


    ## Data Privacy and Security


    Accountability is an essential part of the European Union’s General Data Protection
    Regulation (`GDPR`). These regulations require the party controlling personal
    data to be defined and to be responsible for protecting such data. When compared
    to `GDPR`, Blockchain has an inherent property of distributing data to all the
    participants in the network to achieve decentralization. Second, data on a blockchain
    is immutable to maintain data integrity in the network.^([3](#notes.xhtml#chapter11-3))
    The party must have a set controller and processor. The controller refers to the
    member or members in charge of dictating how data will be processed. A processor,
    on the other hand, is the party that processes the controller’s data. In standard
    cloud computing protocols, individuals uploading data are to be considered controllers,
    while the cloud system’s operator is its processor.


    Most blockchains function with peer-to-peer networking, meaning that controllers
    and processors cannot be easily identified. For example, since the blockchain
    is made up of various nodes that run the necessary algorithms for the blockchain
    to function, it would seem that these nodes should be considered processors. However,
    because the nodes do not process personal data, but rather perform calculations
    to generate additional blocks, they are not considered processors under the `GDPR`.^([4](#notes.xhtml#chapter11-4))


    A private permissioned blockchain represents the best way to determine controllers
    and processors so that the blockchain technology meets the criteria set by `GDPR`.
    In these blockchains, a network member or set of network members can be assigned
    as the blockchain’s operator, which means they can determine controllers and processors.
    For instance, they can require their nodes to be located within the same jurisdiction.
    These specific nodes would be the processors, while the individuals uploading
    data would be the controllers. Additional restrictions can also be implemented,
    such as prohibiting users from uploading harmful files.


    More security lies in blockchain technology’s immutability and provenance. Together,
    these characteristics make it nearly impossible for someone to tamper with data
    held on a blockchain network. Furthermore, the numerous decentralized nodes cumulatively
    hold the highest computing power for the operation of the blockchain. Harnessing
    this power would require the system to be altered by an external factor, which
    is exceptionally difficult.


    ## Cryptocurrency Regulation and Taxation


    Federal agencies have argued about how to regulate cryptocurrency, which had a
    market value of more than $2.8 trillion as of November 2021.^([5](#notes.xhtml#chapter11-5))
    The first question is, does cryptocurrency, a currency with no absolute value,
    fall under `SEC` jurisdiction? According to court records, the answer is yes.
    In September 2021, a Freedom of Information Act (`FOIA`) request found that the
    `SEC` may be investigating `Tether` and `Tether Operations Limited`. `Tether (USDT)`
    is a blockchain-based cryptocurrency. It is a stablecoin, meaning its tokens in
    circulation are backed by an equivalent number of U.S. dollars. Stablecoins track
    traditional fiat currencies, like the dollar, the euro, or the Japanese yen, which
    are held in designated bank accounts.^([6](#notes.xhtml#chapter11-6))


    In May 2021, `SEC` chair `Gary Gensler` said he would like to see more regulation
    around cryptocurrency. Crypto tokens that are issued in the same way as classic
    investment do fall under the `SEC`’s jurisdiction.^([7](#notes.xhtml#chapter11-7))


    According to the CNBC website, the `IRS` treats virtual currencies, like `Bitcoin`,
    as property, meaning that they are taxed in a manner similar to stocks or real
    property. The `IRS` refers to cryptocurrency as virtual currency, and these transactions
    are taxable by law, like transactions in any other property. If you buy one `Bitcoin`
    for $10,000 and sell it for $50,000, you face $40,000 of taxable gains. Taxpayers
    transacting in virtual currency may have to report those transactions on their
    tax returns. Classifying cryptocurrency as virtual currencies makes tax accounting
    more complicated, as they can be exchanged for real currency or used as a substitute.^([8](#notes.xhtml#chapter11-8))
    Accountants must stay aware of these classifications to understand how cryptocurrencies
    are intended to be taxed. While this concept is relatively simple, it isn’t always
    clear what constitutes a “taxable event.”


    In a May 2021 article titled “Cryptocurrency Poses a Significant Risk of Tax Evasion,”^([9](#notes.xhtml#chapter11-9))
    the CNBC website noted that the Treasury particularly concerned about wealthy
    Americans who shift taxable assets into the crypto economy to avoid tax. “Cryptocurrency
    already poses a significant detection problem by facilitating illegal activity
    broadly including tax evasion,”^([10](#notes.xhtml#chapter11-10)) according to
    a Treasury report, which outlined the Biden administration’s tax-compliance agenda.
    Failure to classify these options demonstrates that there is still much development
    needed for proper tax regulation.^([11](#notes.xhtml#chapter11-11))


    Lawmakers in Washington have been grappling with the thorny topic of crypto regulation
    for some time, and senior figures, from treasury secretary `Janet Yellen` to `SEC`
    chair `Gary Gensler`, all believe more oversight is necessary.


    As of this writing, the popular cryptocurrency exchange `Coinbase` now issues
    `1099-K` forms to customers with at least 200 orders during the year, with the
    total value of those orders equal to or greater than $20,000.


    Crypto exchanges in the United States fall under the regulatory scope of the Bank
    Secrecy Act (`BSA`) and must register with the Financial Crimes Enforcement Network
    (`FinCEN`). They are also required to comply with obligations against money laundering
    and the financing of terrorism.^([12](#notes.xhtml#chapter11-12))

    '
  trans: '


    本章还将探讨几个美国政府机构如何监管加密货币。所审查的机构包括证券交易委员会（`SEC`）、联邦贸易委员会（`FTC`）、金融交易犯罪执法网络（`FinCEN`）和金融行动特别小组（`FATF`）。


    本章将以对智能合约的更深入的讨论结束，并对企业以太坊联盟（Enterprise Ethereum Alliance）开发的代币分类框架（Token Taxonomy
    Framework）进行总结。


    ## 管辖权问题


    区块链可以分为`开放的`或`封闭的`。开放区块链可以是`公共且无许可的`，或者是`公共且有许可的`。^(1) 在公共无许可区块链中，任何人都可以加入网络并自愿维护其运行。另一方面，公共有许可区块链要求进入系统作为节点需要许可，且由所有者决定哪些成员可以参与治理。在两种开放式区块链中，网络对所有成员都是可见的。


    封闭区块链可以是联盟链或私有有许可区块链。只有获得授权的成员才能查看联盟链，只有经过批准的成员才能贡献其网络。有许可区块链要么是完全不可见的，要么将查看权限限制在少数特定的许可节点上。只有网络操作者可以更改网络。


    开放和私有区块链都运行在去中心化网络上，这意味着节点可以遍布全球。因此，交易极有可能在多个管辖区下发生，这意味着它们将遇到各种法律和法规。^(2)


    虽然在两种区块链系统中跨越多个管辖区几乎是不可避免的，但私有区块链系统至少可以通过创建内部治理和法律框架来规范交易，从而减轻影响。


    ## 数据隐私与安全


    问责制是欧盟《通用数据保护条例》（`GDPR`）的核心部分。这些规定要求定义控制个人数据的方，并使其负责保护此类数据。与 `GDPR` 相比，区块链具有将数据分给网络所有参与者的内在属性以实现去中心化。其次，区块链上的数据是不可篡的，以维护网络数据的完整性。^(3)
    必须有一组控制器和处理器。控制器是指决定如何处理数据的成员或成员。而处理器是处理控制器数据的实体。在标准的云计算协议中，上传数据的个人被视为控制器，而云系统的操作者是其处理器。


    大多数区块链通过点对点网络运行，这意味着控制器和处理器无法被轻易识别。例如，由于区块链是由运行区块链功能所需算法的各种节点组成的，这些节点似乎应该被视为处理器。然而，由于节点并不处理个人数据，而是通过计算来生成额外的区块，因此它们在
    `GDPR` 下不被视为处理器。^(4)


    私有有许可区块链是确定控制器和处理器的最佳方式，使区块链技术符合 `GDPR` 设定的标准。在这些区块链中，可以将一个网络成员或一组网络成员指派为区块链操作者，这意味着他们可以确定控制器和处理器。例如，他们可以要求其节点位于相同的管辖区内。这些特定节点将是处理器，而上传数据的个人将是控制器。还可以实施额外的限制，例如禁止用户上传有害文件。


    更多的安全性源于区块链技术的不可篡改性和可追溯性。这些特征的共同使得人们几乎无法篡改区块链网络上持有的数据。此外，众多的去中心化节点共同拥有运行区块链的最高算力。利用这种力量需要通过外部因素对系统进行更改，这是异常困难的。


    ## 加密货币监管与税务


    联邦机构一直在如何监管加密货币进行争论，截至 2021 年 11 月，其市值已超过 2.8 万亿美元。^(5)第一个问题是，加密货币作为没有绝对值的货币是否属于
    `SEC` 的管辖范围？根据法院记录，答案是肯定的。2021 年 9 月，一项自由信息法（`FOIA`）请求发现，`SEC` 可能正在调查 `Tether`
    和 `Tether Operations Limited`。`Tether (USDT)`是一种基于区块链的加密货币。它是一种稳定币，意味着其流通中的代币由等数量的美元支撑。稳定币跟踪传统的法币货币，如美元、欧元或日元，这些法币储存在指定的银行账户中。^(6)


    2021 年 5 月，`SEC`主席盖里·格斯勒（`Gary Gensler`）表示他希望看到更多围绕加密货币的监管。以经典投资相同方式发行的加密代币确实属于
    `SEC` 的管辖范围。^(7)


    根据 CNBC 网站显示，美国国税局（`IRS`）将`比特币`等虚拟货币视为财产，这意味着其征税方式类似于股票或不动产。`IRS`将加密货币称为虚拟货币，这些交易在法律上是可以纳税的，就像任何其他财产的交易一样。如果你花
    10,000 美元购买一个`比特币`并以 50,000 美元卖出，你就面临 40,000 美元的应税收益。进行虚拟货币交易的纳税人可能需要在其税表中报告这些交易。将加密货币分类为虚拟货币使得税务会计更加复杂，因为它们可以兑换为货币或作为替代品。^(8)
    会会计必须关注这些分类，以理解加密货币预计将如何征税。虽然这个概念相对简单，但什么构成“纳税事件”并不总是明确。


    在 2021 年 5 月的一篇为“加密货币构成了重大的避税风险”^(9)的文章中，CNBC 网站指出，财政部特别担心将应税资产转移到加密经济以规避税的美国富人。根据财政部报告，“加密货币通过便利包括避税在内的广泛非法活动已构成重大的检测问题，”^(10)
    该报告概述了拜登政府的税务合规议程。未能对这些选项进行分类说明，税务监管仍需大量发展。^(11)


    '
