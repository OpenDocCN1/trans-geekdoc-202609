- raw: 'Blockchain is also the technological platform for nonfungible tokens (NFTs).
    In 2021, NFTs exploded in popularity. An NFT is essentially a glorified title
    deed, but it has taken the digital art world by storm. The most expensive one
    so far is a digital collage of images by the artist who calls himself Beeple,
    that sold for $69.3 million at an auction at Christie’s in March 2021. In December
    2021, Melania Trump, wife of former president Donald Trump, announced that she
    was selling an NFT based on a painting of her eyes called *Melania’s Vision.*
    She has also released a picture of herself dressed in white for a starting bid
    of $240,000. In this book, I want not just to describe what an NFT is, but also
    to show the user how to create one.


    If NFTs and DeFi were not enough, consider the impact of integrating blockchain
    with the metaverse. Imagine putting on your extended reality (XR) neural interface
    device or goggles, and instead of a cartoonish avatar, when you look in the mirror
    you see the hologram of your choosing. Imagine if that holograph is the virtual
    representation of yourself to others, and through it, you not only see in the
    metaverse, you can taste, touch, and smell.


    Blockchain will help make the metaverse a commercial reality with virtual currencies,
    nonfungible tokens, and decentralized technology. Metaverse platforms such as
    Sandbox, and Decentraland, are even selling “virtual land.” For example, a plot
    of virtual real estate recently sold for $4.3 million in Sandbox, making it the
    most expensive metaverse property sale as of December 8, 2021. Around the same
    time, Nike bought an NFT startup to start selling virtual sneakers.


    At first, my determination that money and poverty are social constructs bothered
    me, but all social constructs, including these, can be deconstructed. This book
    will demonstrate how blockchain technology innovations can serve as tools for
    deconstructing these restrictions. I spend some time in this book describing money
    as a medium of exchange for transactions and its important intersection with the
    very idea of morality.


    The book will also set forth a proposed strategy for alleviating poverty through
    a technology platform that utilizes the intersection of bartering, cryptocurrency,
    and business financing. The technology platform adequately serves as a marketplace
    where individuals can barter and trade products and services using a specially
    designed and developed blockchain token. It is time to confront the notion that
    money in its current state is an appropriate tool for people’s social and fiscal
    interests.


    # Introduction


    I am providing this introduction as a guide to help the reader navigate the contents
    of the book. I will give a brief preview of each chapter so that the reader can
    decide whether to jump to a specific section of interest or proceed along the
    given sequence.


    ## Chapter 1: Cryptocurrency and the Creation of Wealth


    Ninety-seven percent of those engaged in cryptocurrency trading lose money. Although
    the study that made this conclusion was based in Brazil, the statistics are still
    staggering. In chapter 1, my goal is to explore the feasibility for creating wealth
    by trading cryptocurrency. I will describe what I refer to as the difference between
    lottery coins (those that have primarily speculative value) and utility coins,
    which are typically anchored against a technology that has economic and innovative
    utility. I will also describe three basic types of trading strategy.


    As you embark on cryptocurrency trading, one of the first questions you will need
    to address is which cryptocurrency exchange to trade on. If you are serious about
    this undertaking, it is imperative to understand thefundamentals of technical
    analysis and to be aware of how easy the unregulated markets can be manipulated
    by influencers known as “whales.” These trading behemoths have substantial computing
    firepower and economic capital at their disposal. As long as the markets remain
    unregulated, they can move the price of a basket of crytpocurrencies in their
    favor, using a technique called pumping and dumping.


    ## Chapter 2: Opportunities for Careers and Business


    Trading cryptocurrency, whether that be day or swing trading, is not the only
    way to potentially create wealth in the world of blockchain technologies. In this
    chapter, I will present alternative approaches which although possibly more labor
    and time intensive, are most certainly less risky. In this day and age, there
    are many lucrative careers in blockchain, and not just in cryptocurrency. This
    chapter will also explore opportunities for entrepreneurs as well as introducing
    the concept of cryptocurrency mining and its implications for trading and career
    and business opportunities.


    ## Chapter 3: The State of Poverty


    This chapter describes how a significant segment of the global community is hobbled
