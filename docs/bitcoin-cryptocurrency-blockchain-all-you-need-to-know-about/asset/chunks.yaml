  trans: '


    现有的加密货币尚未成熟到可以可以用法币替代日常支付。加密货币市场仍处于发展的早期，加密领域需要经历重大的演变，才能创建一个能够替代当前系统的金融体系。这种变革很可能不会源于任何现有的加密货币，而是源于政策与区块链技术的结合。但考虑到全球范围内对加密货币的强力反对，它们进入主流金融领域可能还需要时间。


    下一章将重点关注世界如何为加密货币做好了准备，以及我们正如何自然地向加密货币转型。


    # 08 区块链初探


    许多人认为 2008 年是中聪·中本构思区块链的年份。他的比特币论文被认为是区块链的起源。然而，现实是，区块链最早是由 Stuart Haber 和 Scott
    Stornetta 在 1991 年开发的。


    Haber 和 Stornetta 发明了被称为拜占庭容错方案。该方案于 1982 年由 Leslie Lamport、Robert Shostak 和 Marshall
    Pease 提出。


    该问题包含以下条件：指挥官必须向 n-1 个将军发送命令，以确保：


    1. 所有忠诚的将军都遵守相同的命令。

    2. 如果指挥官是忠诚的，那么每个忠诚的将军都会遵守他的命令。


    问题中的 `n` 指指挥官必须发送命令的将军数量。`1` 表示指挥官必须向比其将军数量少一个的人发送命令。


    该问题提出的一个问题是，指挥官唯一的通信方式是纸条，必须由信使步行穿过敌方领土递送，并可能被俘。如果被俘，信使可能会变成叛徒，并向将军发送错误的命令。


    另一个复杂情况是，即使信使没有被破坏，将军之一也可能被破坏。因此，指挥官必须考虑到他的信使或将军中存在叛徒的可能性。


    为了应对这个问题，指挥官必须实施一种策略，以确保所有忠诚的将军执行相同的计划，从而消除潜在叛徒的威胁。这种解决方案被称为拜占庭容错算法，或 `OM (0)`。具体来说，该算法规定：


    1. 指挥官向每个将军发送他的值。

    2. 每个将军使用从指挥官那里收到的值；如果没有收到任何值，则使用 `RETREAT`（撤退）值。


    算法 `OM (0)` 的轮廓如图 08-01 所示。


    ```

    ![Figure 08-01. Algorithm OM (0)](img/img-98.jpg)

    ```

    图 08-01 算法 OM (0)


    图 08-02 展示了算法的工作原理。首先，指挥官向每个将军发送一条消息，在本例中为 `v`。然后，每个将军必须将从指挥官那里收到的消息与其他所有将军建立联系。


    ## 比特币简述


    中聪·中本构在 2008 年发布了他的白皮书《比特币：一种点对点的电子现金系统》，进一步推进了区块链技术。这篇论文利用了 Haber 和 Stornetta
    确立的原则，证明了他们在该开发方面产生的影响力。中本构区块链的不同之处在于，它是一个纯点对点的网络，“允许通过电子现金直接从一方支付给另一方，而无需通过金融机构。”


    验证交易的竞争可能是中本区块链中最具创新性的，因为它依赖于将工作量证明概念作为共识算法引入。


