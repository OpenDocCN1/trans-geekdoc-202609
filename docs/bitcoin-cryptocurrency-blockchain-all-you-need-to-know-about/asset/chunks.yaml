  trans: '

    例如，大多数企业都开展国际业务，这意味着需要货运代理人来促进供应商和买家之间的交易。这些代理人的成本可能非常高昂，并且贯穿于采购过程的各个阶段，例如谈判物品成本、运费、国际关税等。此外，传统的供应链依赖于签章的纸质文件，这些文件可能会在交付过程中丢失或因被窃而受损。货币转换也是另一个问题。


    使用区块链和智能合约进行供应链管理缓解了所有这些障碍，并显著提高了效率。区块链框架本身为各方提供了身份证明，并维护了不可篡改的数字交易记录，所有参与方都可以访问这些记录，从而保证了信任。(23)


    智能合约根据预设参数自动执行供应链系统中的所需步骤来管理工作流。这确保了每个伙伴都能收到其预期的付款、产品或服务。此外，在智能合约中使用中使用稳定代币（stable
    tokens）可以作为通用支付方式，消除货币交换的需求。总的来说，这意味着区块链智能合约不仅可以加速供应链协议，还能建立信任并为所有方大幅降低成本。


    ## 比特币改变了社会契约


    中本的加密货币成为区块链社区创造的价值交换的第一种媒介。比特币是一种各方自愿采用以参与贸易的货币。与强加于人们的政府法币不同，参与这一电子现金系统是可选的。因此，它打破了主导经济的基于法币的传统社会结构。


    比特币为个人提供了选择他们想要支持或更信任的机构的选项。人们可以选择由其所属政府支持的传统法币，也可以选择由未知矿工网络支持的加密货币。


    选择法币的人是因为他们相信政府发行的货币的安全性。相比之下，加密货币并不由个人控制，而是由一大群匿名人士——矿工控制。矿工遍布全球，构成了区块链的去中心化网络。监管实体并不控制他们；相反，不变的区块链框架执行了这一功能。因此，信任像
    `Bitcoin` 这样的区块链加密货币似乎更为合理，因为它们是不可、去中心化的并且以民主的方式运行。


    尽管比特币不会被某个个人或机构破坏，但它面临被破坏的风险（尽管这是一个挑战）。系统被破坏的唯一途径是通过 `51 percent attack`（51%攻击）。


    在 `51 percent attack` 中，攻击者试图通过逆向工程现有交易来控制网络的大部分。(24) 首先，腐败的矿工必须找到生成区块的解决方案，然后不广播给区块链网络的其他部分。相反，腐败的矿工保留解决方案，使得存在两个版本的区块链：原始版本和他保留的副本。


    原始区块链继续被诚实的矿工使用，而腐败的矿工使用被保留的区块链。由于他没有将自己的区块广播给网络的其他部分，它没有被察觉，这让他能够在原始区块链上使用他获得的代币（`Bitcoins`）。


    但被保留的区块链呢？嗯，代币在被保留的区块链上不会显示为已花费，这意味着腐败的矿工仍然可以访问它们。保留的区块链仍然能够继续获取可以被腐败矿工验证的区块。


    继续验证区块的能力正是问题所在之处，因为区块链被编码为遵循共识算法或多数原则。换句话说，区块链通过遵循共识算法或多数原则进行进展。

    '
