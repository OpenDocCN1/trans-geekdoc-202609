- raw: 'Proof of work was first created in 1993 by Cynthia Dwork and Moni Naor (though
    it was not named so until 1999).^([8](#notes.xhtml#chapter8-8)) It was developed
    to be used as a way to block network spam and denial of service attacks. In its
    simple definition, proof of work is merely an algorithm that functions by users
    executing the computation of some cryptographic problem to find a solution. Once
    the solution is obtained, it can be verified by all other users and added to its
    corresponding blockchain.^([9](#notes.xhtml#chapter8-9))


    Bitcoin uses a specific type of proof of work algorithm developed in 2001 by the
    National Security Administration (NSA), called the SHA- 256 Proof-of-Work Scheme.
    The SHA-256 Proof-of-Work Scheme is considered a hash proof-of-work algorithm
    because its output is always a 256-bit hash regardless of its input. This means
    there is never a way to identify the length of the initial data, which is a security
    advantage.^([10](#notes.xhtml#chapter8-10))


    The SHA-256 proof-of-work algorithm is responsible for building blocks within
    the Bitcoin blockchain network and acting as a source of trust between users in
    the network.^([11](#notes.xhtml#chapter8-11))


    The execution of a new block using the SHA-256 proof of work algorithm begins
    by giving each block a header. The header is composed of a timestamp, software
    version number, hash of Merkle Root, nonce, target hash, and the hash of the previous
    block. This data is then used to solve a complex mathematical problem.^([12](#notes.xhtml#chapter8-12))


    First, a 0 is added to the block header. This additional new number added to the
    block header is known as a *nonce.* The new block header is then hashed to see
    if its resulting hash value is less than the target hash. If it is not, then the
    nonce is increased by adding 1 to the block header and hashing it again. This
    process continues by trial and error and takes a great deal of computational power
    to find the appropriate nonce.


    Since so much power is needed to solve blocks, people share their computing power
    and work together. These people are called *miners.* Each miner’s computer actively
    works on solving the block’s nonce, and results are shared, including incorrect
    nonces, which means the odds of finding the solution increase over time.^([13](#notes.xhtml#chapter8-13))


    With Bitcoin, a new block is added somewhere at the rate of about one block every
    ten minutes.^([14](#notes.xhtml#chapter8-14)) Once a block is added, it is almost
    impossible to change, as that would require changing all preceding blocks. This
    immutability adds protection from tampering and ensures that the longest chain
    serves as the chain’s framework.


    ## Blockchain Provenance


    Blockchains are safe from tampering because of proof-of-work consensusbased algorithms.
    This exemplifies another benefit of the system: it can demonstrate provenance.
    Provenance is a record of ownership from the block’s earliest known history.


    Provenance has been at the core of economies since the beginning of time. For
    example, parties may need to authenticate ownership of an animal to be traded
    or a house to be sold. Verifying ownership of assets protects both parties by
    demonstrating the authenticity of each asset.


    Generally, third parties are used to verify ownership or demonstrate provenance.
    However, blockchains can do the same in a much fastermanner by providing their
    infrastructures to register both parties in a transaction and authenticate each
    one’s assets. Therefore the blockchain infrastructure limits the number of intermediaries
    needed for complex operations, which can accelerate overall transaction times.^([15](#notes.xhtml#chapter8-15))


    The tracking of ownership capability via tokens is one of blockchain’s most functional
    applications. These tokens represent digitalized versions of data that generally
    occur in an array of transactions. Each token represents a full audit of the data,
    which indicates time and place of origin.^([16](#notes.xhtml#chapter8-16)) This
    is critical in business, trade, and finance, as countless documents are constantly
    being processed between various parties. Often these parties are not familiar
    with one another and so need a way to establish trust. Tracking tokens makes it
    possible to establish trust, as each token reveals its ownership history.


    ## Blockchain Immutability


    Immutability is the ability of the blockchain to remain unchanged and unaltered.^([17](#notes.xhtml#chapter8-17))
    Blockchain achieves its immutability from its decentralized and distributed framework.
    Since various nodes are used, multiple replicas of the data exist on the blockchain.
    A benefit of this framework is that it makes false blocks easier to identify.
    It also adds integrity to the network’s data because it preserves original copies:
    each block within a blockchain network contains not only its own unique hash but
    also the hash of all the previous blocks before it.


    Immutability is further enhanced using digital signatures, which are commonly
    seen on private blockchains. Digital signatures are also known as *hashes.* The
    difference between a digital signature hash and blockchain hash is that a digital
    signature uses public-key encryption and private key decryption to validate individuals’
    sending data.^([18](#notes.xhtml#chapter8-18)) Blockchain hashing, on the other
    hand, depends on the network’s algorithm, which is generally a consensus-driven
    proof-of-work algorithm. As blocks are generated, they must agree with the algorithm,
    which depends on most of the network concurring with the newly added block. Once
    a block is added, it cannot be removed or altered.


    The immutability of blockchain means that data can be shared more efficiently
    with higher levels of trust more cheaply than existing technologies do.


    ## Smart Contracts


    Aside from their immutability and their ability to prove provenance, blockchains
    can also enhance contract security by using smart contracts. According to Investopedia,


    > A smart contract is a type of digital contract that contains an agreement between
    multiple parties directly in its code. The smart contract self-executes the terms
    and agreements determined and is maintained on a blockchain network. Furthermore,
    the code of the contract is irreversible and fully traceable.^([19](#notes.xhtml#chapter8-19))


    The irreversibility of the smart contracts adds trust to transactions and agreements
    without the use of a central authority figure or legal system. As a result, parties
    can interact with one another more directly with the same level of confidence.
    Smart contracts are significant in that they function on a predetermined if-then
    base, and only proceed if the conditions outlined are met.


    The most well-known blockchain for executing smart contracts is Ethereum. Ethereum
    is popular because it enables developers to write smart contract programs. These
    programs are written in a custom language known as Solidity and are developed
    on the Ethereum Virtual Machine (EVM).^([20](#notes.xhtml#chapter8-20)) The EVM
    can run any algorithm, and the program codes developed on it are known as decentralized
    applications (dApps), which consist of smart contracts. The dApps act as the front
    end for userinteraction but require a browser extension so users can engage with
    the blockchain and verify their identities. The apps also require Ethereum’s currency,
    Ether, to function.^([21](#notes.xhtml#chapter8-21))


    As of February 2021, there were over 3,000 dApps on Ethereum’s blockchain network,
    and this number increases every month.^([22](#notes.xhtml#chapter8-22)) Most dApps
    are related to supply chain management. The benefit of using blockchain and smart
    contracts for supply chain management is that it eliminates third parties for
    verification, creates trust, and expedites processes. Trust and speed are essential,
    especially as the pace of globalization continues to speed up.'
