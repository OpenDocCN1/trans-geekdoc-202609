    `对价`（Consideration）是普通法中的一个概念，是简单合同的必要条件；它被定义为“权利、利益、利润、收益、克制、损害、损失或责任”。`对价`本质上是一种承诺，即一方提供有价值的东西，以交换另一方的有价值的东西。通常，这种“有价值的东西”是商品、金钱或服务。这一概念已被包括美国在其他普通法管辖区所采用。


    道德的社会方面可以通过`意图性`（intentionality）这一哲学概念来理解，即个人解释世界和追求目标的方式。道德规范着特定社会内部各方之间的关系。它设定了实现共同认可目标（即获得净价值）所需的参与条款。


    因此，一个道德交易就是一份简单合同。合同详细规定了参与条款：各方在价值交换中的权利和义务。然而，仅仅因为一种关系是交易性质的，并不意味着它是公平的。


    ## 个人意图性


    群体成员可能会通过制定促进公平、公正和正义的规范，寻求所有人受益的手段。这些规范随着人类开始出于生存的基本需求而进行合作，演变了数十万年。但在资源匮乏时期，人类会竞争资源。托马斯·霍布斯将这种竞争定义为“自然状态”。


    ## 共同意图性


    随着时间的推移，产生了一种新的相互依赖逻辑或理性自利逻辑。这种`共同意图性`与个人意图性的自私形成了鲜明对比。通过`共同意图性`，所有方都能受益。通过`共同意图性`，物物这种简单的交换系统运而生。


    成功的人类合作依赖信任，以及一种依赖——即合同各方可以依靠彼此履行义务并尊重对方权利。社会内部和平也取决于信任他人尊重产权的能力。


    ## 集体意图性


    最终，人类社会发展出一套共同价值、义务和准则，它们共同代表了人类文化的正式起源。群体成员通过制定促进公平、公正和正义的规范，寻求所有人受益的手段。这种`集体意图性`被社会中的每个成员制度化和内化为一种“客观道德”，群体据此识别对错。


    ## 社会交换理论


    社会交换理论基于这样一种观点：两人或多人之间的关系是通过某种形式的成本效益分析建立的，该理论解释了我们为什么建立信任和互惠。


    所有关系都是交易性的，且它们可能是单方面交易的。首要商品是正在交换的价值。今天许多关系的问题在于参与条款是模糊的、不存在的或是假设的。参与条款的模糊类似于不信任侵蚀了关系的结构。


    ## 公平交换


    物物交换在商品和服务交换方面的一个缺点包括缺乏标准的衡量单位。如果贸易反映了公正和公平的原则，各方如何在没有约定的标准衡量单位的情况下确保公平交换？这种困境导致了将金钱视为道德交易客观货币的观点。


    货币经济问题的核心要素是其客观交换价值。这是所有讨论的必要起点：只有当与其客观交换价值相关时，货币那些区别于商品的奇特属性才会显现出来。


    正如我所指出的，所有关系都是交易性的，涉及各方之间的价值交换。我讨论了涉及物物交换作为媒介的问题，主要问题是它缺乏衡量价值的客观标准。


    在下一章中，我将探讨货币是如何作为社会构建的。我将观察它的基本目的以及它是如何遭受权力滥用的。本章将通过解释为什么必须解构现有的货币社会构建并创建一个新的构建来结束。


    # 06 货币作为社会构建


    社会构建主义是社会学和传播理论中的一种知识理论，它研究了范围内社会性和共同构建的实体和事件的定义与理解的发展。社会现实不同于发展在个体内部的主观现实。社会中的人们利用语言构建思想以及它们相应的概念、意义和重要性。社会构建被社会广泛接受为自然的、客观的或绝对的。


    本章将探索社会构建以及货币作为社会构建的想法。作为这一解释的一部分，我将介绍货币如何作为社会构建演变的理论，以及它最终如何被制度化。


    本章将继续讨论政府和银行如何通过部分备付金制度滥用作为社会构建的货币。


    本章将通过分享`比特币`的发展以及它如何作为第一种解构法币的加密货币而结束。


    ## 社会构建


    社会构建是由人类共识创造的实体。社会或简单合同的各方对其定义、意义和价值达成共识。在存在共识的社会背景下，社会构建是客观真实的，这就是`社会现实`一词的含义。该构建仅在感知者的集体脑海中被视为“事实”。权利、道德、情感和货币等社会构建对于人类文明的顺利运行至关重要。


    权利、情感和道德（按其定义）独立于我们创造并同意的社会构建而存在，这并非事实。爱、货币和艺术在我们赋予它们的价值之外具有价值，这并非事实。然而我们仍然相信这些构建是客观真实的且具有客观价值的。在大多数情况下，我们无意识地按照它们生活。


    神经科学家`莉莎·菲尔德曼·巴雷特`（Lisa Feldman Barrett）解释了社会构建的过程。有两个主要成分：`共同意图性`和文字（概念识别）。她写道：“发明一些东西，给它命名，你就创造了一个概念。把你的概念教给其他人，只要他们同意，你就创造了真实的东西。”


    人类拥有语言来社会构建。语言是概念标识，即用于标记概念的文字图像。文字是群体内交流共享概念最高效率。文字代表概念，而概念是自然的工具。


    关于合同，首先，简单合同的各方有意地就其定义（概念）、意义（心理表征）和价值达成共识。这些部分共同构成了其`共同意图性`。


    货币代表货币的纸币或硬币其存在是不争议的，但其定义、意义和价值仅作为社会现实的功能而存在。除非人类对纸币或硬币代表什么以及可以用来达成共识，否则货币只是纸，硬币只是金属盘。


