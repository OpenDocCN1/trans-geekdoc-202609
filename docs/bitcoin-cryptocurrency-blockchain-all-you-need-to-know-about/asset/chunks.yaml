    `Consideration` is a concept of English common law and is a necessity for simple
    contracts; it is defined as a “right, interest, profit, benefit, forbearance,
    detriment, loss, or responsibility.” `Consideration` is essentially a promise
    that something of value is given by one party in exchange for something of value
    from another party. Typically, the “something of value” is a good, money, or service.
    This concept has been adopted by other common law jurisdictions, including the
    United States.


    The social aspects of morality can be understood through the philosophical concept
    of `intentionality`, which is the way individuals interpret the world and pursue
    their goals. Morality governs the relationships between parties within a given
    society. It sets the terms of engagement needed to fulfill a mutually agreed-
    upon objective, which is to obtain net value.


    A moral transaction, therefore, is a simple contract. The contract details terms
    of engagement: the rights and obligations of each party as they pertain to the
    exchange of value. However, just because a relationship is transactional does
    not mean that it is equitable.


    ## Individual Intentionality


    Members of a group might seek the means for all to benefit through enacting norms
    to promote fairness, equity, and justice. These norms evolved over hundreds of
    thousands of years as humans began to cooperate out of a basic need for survival.
    But in times of scarcity, humans would compete for resources. Thomas Hobbes defined
    this competition as the “state of nature.”


    ## Joint Intentionality


    Over time, a new logic of interdependence or rational self-interest arose. This
    `joint intentionality` contrasts starkly with the selfishness of individual intentionality.
    With `joint intentionality`, all parties benefit. Through `joint intentionality`,
    bartering, a simple system of exchange, emerged.


    Successful human cooperation relies on trust and on a reliance that parties to
    an agreement can depend on one another to follow through on their obligations
    and respect one another’s rights. Peace within a society also depends on the ability
    to trust others to respect property rights.


    ## Collective Intentionality


    Eventually human societies developed a set of shared values, obligations, and
    precepts that together represented the formal beginnings of human cultures. Members
    of a group sought means for all to benefit through enacting norms to promote fairness,
    equity, and justice. This `collective intentionality` became institutionalized
    and internalized by each member of the society as an “objective morality” by which
    the group identified right and wrong.


    ## Social Exchange Theory


    Social exchange theory, a concept based on the notion that relationships between
    two or more people are created through a form of cost-benefit analysis, explains
    why we build trust and reciprocity.


    All relationships are transactional, and they may be unilaterally so. The primary
    commodity is the value being exchanged. The problem with so many of today’s relationships
    is that the terms of engagement are vague, nonexistent, or assumed. Vagueness
    in terms of engagement is akin to distrust eating away at the fabric of the relationship.


    ## Equitable Exchange


    One disadvantage of bartering, as it pertains to the exchange of goods and services,
    includes the lack of a standard unit of measure. If trade reflects the principles
    of justice and fairness, how does each party ensure an equitable exchange without
    an agreed-upon standard unit of measure? This dilemma leads to the idea of money
    as an objective currency for a moral transaction.


    The central element in the economic problem of money is its objective exchange
    value. This is the necessary starting point of all discussion: it is only in connection
    with its objective exchange value that those peculiar properties of money that
    have differentiated it from commodities are conspicuous.


    As I have noted, all relationships are transactional and involve an exchange of
    value between parties. I discussed the issues involving bar tering as a medium
    of exchange, the primary one being that it lacked an objective standard for measuring
    value.


    In the next chapter, I will examine how money is a social construct. I will look
    at its fundamental purpose and how it has been subject to abuses of power. The
    chapter will conclude by explaining why it is necessary to deconstruct the existing
    social construct of money and create a new one.


