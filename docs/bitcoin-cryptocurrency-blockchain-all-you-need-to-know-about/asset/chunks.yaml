    and support from a broad industry network. The alliance aims to grow the DeFI
    platform to 1 billion users by 2025.


    ## Conclusion


    Writing in *Forbes,* Lawrence Wintermeyer observes, “The emergent reality of decentralized
    and user-centric finance, commonly referred to as DeFi, has become too significant
    to deny in recent years.” As institutional investment and interest in the blockchain
    and crypto have exploded over the past year, one thing has become clear: crypto
    and DeFi are the future of finance.


    # 14 How to Create a Nonfungible Token


    From the tweet by technological entrepreneur Jack Dorsey that was auctioned for
    $2.5 million to Beeple’s digital artwork *The First 5,000 Days,* which sold at
    Christie’s for over $68 million,^([1](#notes.xhtml#chapter14-1)) the recent emergence
    of non-fungible tokens (NFTs) has called into question the way we perceive value.


    Along with the NFT boom, however, cases of NFT theft have been on the rise. Many
    artists have shared stories of their work being minted into an NFT without their
    consent.^([2](#notes.xhtml#chapter14-2)) In addition to the theft issue, there
    is also the question of the legitimacy of nonfungible tokens as works of art.


    Despite these setbacks and doubts, the NFT market has been quite bullish. As a
    result, many critics classify the NFT phenomenon as yet another crypto bubble,
    pumped up by media hype.


    Since NFTs are almost impossible to value, given the complexity of each nonfungible
    asset, it is hard to say if they are overvalued, undervalued, or on par with the
    prices they are sold for. A thorough look into this emerging space will provide
    more clarity on why things are the way they are with NFTs.


    ## The Rise of NFTs


    In June 2017, Matt Hall and John Watkinson of Larva Labs launched CryptoPunks,
    the first nonfungible tokens to be deployed on Ethereum. Through CryptoPunks’
    unique 10,000-character features stored on the Ethereum blockchain, the first
    NFTs were created. With the supply of these “punks” capped at 10,000 unique characters,
    these virtual characters had scarcity and rarity programmed into them from the
    get-go.


    In other words, each punk had its own unique features implanted in the Ethereum
    blockchain, like strands of unique DNA in a living cell.


    In an interview with Art Market Guru, Hall explains:


    > In early 2017, John Watkinson … had been fiddling around with a pixel character
    generator, and it was getting to the point where it was making lots of really
    cool, interesting characters. We just weren’t quite sure what to do with them.
    No idea really seemed to be strong enough until we discovered Ethereum and had
    the idea to make them unique and ownable on the blockchain. From there, we started
    the work of trying to actually figure out if it was possible and in what form
    it should take when actually implemented on Ethereum.^([3](#notes.xhtml#chapter14-3))


    Following the success of CryptoPunks, in December 2017 Dieter Shirley of the CryptoKitties
    team and William Entriken proposed the ERC-721 standard,^([4](#notes.xhtml#chapter14-4))
    which made the implementation of NFTs on the Ethereum Virtual Machine (EVM) seamless.
    The ERC-721 standard was largely based on the blueprint of the CryptoPunk code.
    Since the launch of CryptoKitties, several proposed standards for the optimization
    of NFTs and several alternatives to Ethereum have been proposed.


    The success of CryptoPunks and CryptoKitties sparked the flame for this market.
    According to JPMorgan, the NFT market has seen explosive growth in 2021 as sales
    of the digital art items hover at a monthly rate of about $2 billion.


    That’s a big increase from monthly sales volume of about $400 million at the start
    of 2021, and it has helped drive the market cap of the NFT universe to about $7
    billion, according to the bank.


    According to Brand Essence Market Research, NFT transactions grew by 328 percent
    during the first half of 2021 and the third quarter of 2021. The growing size
    of the NFT market, due to the growing number of transactions in that marketplace,
    remains the defining trend of growth.


    ## What Are NFTs?


    Assets that are identical across all conceivable value metrics are termed “fungible,”
    (see Figure [14-01](#chapter14.xhtml#fig30)). Examples include Bitcoins and dollar
    bills, which are all worth exactly the same amount.


    ![Figure 14-01. Fungibility.](images/img-179.jpg)


    Figure 14-01. Fungibility.


    By contrast, NFTs are a special kind of cryptoasset in which each token is unique.
    Because every NFT is unique, they can be used to authenticate ownership of digital
    assets like artworks, recordings, and virtual real estate, or even pets.


    NFTs are digital representations of nonfungible valuables registered on a blockchain,
    each with a unique cryptographic identifier. The purpose of this identifier is
    to define the unique identity and ownership of the token on the blockchain, with
    real-time stamps of every transfer associated with that NFT. Right from the creation
    of an NFT transfers of ownership, every activity involving an NFT is recorded
    immutably on the blockchain, with timestamps for each transfer.


    While there are endless possibilities for entities that can be represented as
    NFTs, they are typically used for digital works of art, like collectibles, images
    and videos. Today domain names, user profile avatars, virtual real estate, and
    even unique digital financial instruments are also being represented as NFTs.


    Low-resolution images that look like emojis selling for millions of dollars, and
    several apparently irrational NFT purchases have shocked many people. The prices
    just don’t seem to make sense, if you view them objectively. However, please read
    on.


    ## NFTs and the Subjective Theory of Value


    The premise of the subjective theory of value is that the same item is valued
    differently by different people as a function of their respective individual emotions,
    preferences, thought processes, and life experiences. While a Jack Dorsey fan
    is willing to pay $2.5 million for the minted version of Dorsey’s first tweet,
    another Twitter user couldn’t care less about it. The phenomenon isn’t unique
    to the world of NFTs. Consider the fact that in April 2021, a pair of shoes designed
    and worn by the musician Kanye West sold for $1.8 million (£1.3 million) at auction—the
    highest amount ever paid for trainers.


    Also, while you may consider it ridiculous to break your pocket for a piece of
    digital artwork, a friend may consider it equally ridiculous to spend any money
    on a mere splash of random colors called an “art piece.” This is because for one
    person these items have a subjective meaning, while for another it is perceived
    purely from an objective and rational viewpoint. The subjective value of an asset
    explains why NFTs defy rational thinking and command outrageous prices.


    ## NFTs and Smart Contracts


    Metaphorically speaking, smart contracts are the technological Lego pieces from
    which all sorts of NFTs are composed. All NFTs exist on smart contract blockchains,
    notably Ethereum. In that regard, smart contracts allow NFTs to exist as rare,
    unique, spendable representations of nonfungible entities on the blockchain.'
