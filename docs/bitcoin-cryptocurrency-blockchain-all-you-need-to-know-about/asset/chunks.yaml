  trans: '


    贸易是大多数经济形式的基础。历史学家将以物易作为一种价值交换机制的概念追溯到公元前 6000 年（1）。村民和商人会交换盐、糖、谷物、牲畜、武器和纺织品等各种商品。最终，以物易演变为包含了服务的交换。


    社区通常会在货币崩溃、危机或物资短缺期间建立以物易，以便继续交易商品和服务。以物易在 17 世纪和 18 世纪的殖民时代、大萧条时期以及 20 世纪世纪 80
    年代的衰退时期在美国重新流行（2）。人们建立了诸如丹佛失业公民联盟（34,000 名成员）和国家发展协会等以物易小组（3）。国际互惠贸易协会报告，2011
    年，全球超过 40 万家公司通过以物易在其闲或利用不足的资产上赚了约 120 亿美元（4）。


    以物易的一个关键优势是灵活性：由于不需要货币作为交换媒介，双方仅需交换他们已经拥有的商品和服务即可获得他们所需的（5）。


    以物易系统有若干个缺点。首先，交易双方之间需要相互信任。因此，在发生冲突时，可能需要监管机构或受信赖的中间人来执行或仲裁协议。商品和其他服务的缺点还包括缺乏标准的计量单位、不可分割性、存储局限性以及延迟付款的困难性（6）。


    以物易在在全球范围内日益增长，部分原因是由于硬通货短缺。目前，有 88 个国家定期进行以物易，而 1973 年只有 15 个国家这样做。一些分析师估计，现在全球贸易中多达
    30% 是以物易的形式进行的（7）。然而，缺乏通用以物易标准和机制的发展，意味着货币短缺的国家无法快速增加贸易。


    ## 区块链以物易


    区块链创建了一个去中心化的平台来支持贸易并解决传统以物易的典型缺点。加密货币作为任何以物易行为的通用价值衡量标准。数字货币可以在世界上任何地方使用，这种独立性促进了国际贸易（8）。


    据报道，2018 年，加拿大在线易物平台 `Bunz` 成为首个此类平台，它拥有已经建立的社区——其成员。该平台使用其加密货币 `BTZ`（读作“bits”），它可以用来交换商品和服务，或在成员之间进行交易。该平台大约有
    20 万名用户。在多伦多、渥太华、蒙特利尔和温哥华的数百家当地零售商处，这些地方也接受 `BTZ` 代替现金（9）。


    ## 货币的意义


    货币作为一种抽象的概念源于以物易作为一种权利（权力）——一种获取价值和拥有交换媒介的权利。


    货币作为延迟付款的标准出现，用于衡量商品和服务的价值。货币从标准化的硬币（如贵金属，既是价值载体又是购买价值的物品）演变为代币（代币币、法定货币）以及由统治当局控制并担保的权利（价值主张权）。最终，出现了银行等受信赖的中间人。同时，统治机构管理货币的创造和货币政策，同时提供某种程度的保护以维护使用银行服务的公民资产。


    ## 货币的发展


    来自古代世界的文学和语言学证据以及来自许多国家的原始货币证明，虽然以物易的缺点为货币的发展提供了纯粹的经济动力，但它并非主要因素，也绝不是最重要的。


    根据《货币史》作者格林·戴维斯（Glyn Davies）的话，“货币的起源很大源于非经济原因：源于贡税以及贸易，源于血钱和聘金以及以物易，源于仪式和宗教活动以及商业，源于炫耀的装饰以及作为经济人人之间的共同苦力工。”（10）。


    这种做法导致了货币贬值，降低了硬币的价值，从而引发了通货膨胀。货币从标准硬币（其面值与其含金属价值相等）转变为代币（其面值高于其所含金属的价值）（13）。


    然而，铸币收入取决于公众对钱币的信任，因此引入了一套复杂的测试系统。根据一个来源，“任何需要处理大量银币或金币的人，无论是商人、交易员、收税员、国王本人、皇家金库还是治安官，都需要可靠的设备来测试作为货币的物品的纯度”（14）。


    因此，尽管面临伪钞者的挑战，政府能够控制硬币生产并因此货币供应。直到商业银行兴起和纸币被广泛采用，这种垄断才被打破。


    ## 纸币


    罗马时代使用了标准硬币，官方硬币铸造出不同的面值。硬币成为购买的标准工具，这一理念在随后的几个世纪中广泛传播。第一枚铸造的硬币上是一只咆哮的狮子（15）。


    在从客观价值向基于社会协议价值转变的重要跨越中，中国在公元 600 年左右引入了纸币（16）。


    在 12 世纪十字军东征期间西欧，汇票形式的书面指令被转移大量资金，骑士团充当了银行家（17）。


