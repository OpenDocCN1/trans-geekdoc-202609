  trans: '

    2016 年，东伦敦的*哈克尼公报》（*Hackney Gazette*）报道，伦敦哈克尼区为无归家人口推出了一种新货币，用于休闲活动。街头艺术家 Stik
    曾在据报道该货币发地的马雷街青年旅生活过，他设计了黄绿相间的钞票。钞票上印有 Stik 的格言：“你的时间属于你自己。把它花在你自己相信的事物上。”根据《哈克尼公报》的文章，住在哈克尼青年旅的人可以通过诸如烹饪、清理公共区域和为网站写文章等志愿者活动来获得“香料时间”（Spice
    Time Credit）票据.^(17)


    这使得哈克尼的无归者能够获得可以以物或交易其他商品和其他服务的价值。事实上，发行香料时间票据通过为弱势群体提供一种获得必需品的方法，缓解了该地区的贫困。由于这些积分基于积极的服务行为，它们不会受到恶性通货膨胀的影响，并受到不受犯罪和伪造的保护。


    香料时间由国家医疗服务体系（NHS）和哈克尼临床委托小组（CCG）资助。它是一个社会企业，自在南威尔士创立以来已发行了三十六种地方货币，并致力于确保所有人都能获得医疗保健。


    ## Colu


    Colu 于 2014 年成立于特拉维夫，其目标是通过发行社区货币来刺激经济活动，从而“改变当地经济面貌”。围绕 Colu 加密货币的概念易于理解。首先，公司在大型城市内识别出一个与国家法定货币关联的社区，然后推出一种城市货币.^(18)
    城市货币基于一个以奖励积极行为为中心的激励系统。其理念是与当地政府合作，吸引积极的社会行动，例如志愿者服务或在社区内消费数字货币。


    Colu 开发的货币示例是东伦敦英镑（ELP）。ELP 与香料时间一样，在哈克尼发行，但时间是在较晚的 2017 年。它的运作机制是让用户先下载 Colu
    应用。下载完成后，用户将获得五英东伦敦英镑。在初始下载后，每上传 `1£` 转换为 `ELP` 的比例变为 `1:1`。ELP 在酒吧、理发店、书店、自行车店等地接受。


    ELP 的优势在于它消除了与中央权威发布的法定货币相关的强制性。它在社区内的持续使用通过将资金留留在区内并激励积极行为帮助了小企业的发展。


    自推出以来，Colu 进一步扩张，不仅在伦敦，还在海法和利物浦。它持续增长，其 2018 年 2 月的代币销售筹了近 2300 万美元。


    ## Bancor


    Bancor 最近在肯尼亚推出了基于区块链的货币.^(19)


    它使用集成了 `Java` 的 `Bitfury` 来允许私有链锚定公共网络。Bancor 创新项目的目标是通过点对点的协作对抗贫困。


    Bancor 网络允许肯尼亚的弱势社区生成加密货币。这些加密货币可以保持余额并进行这种整合，使得人们不需要第三方即可相互交换。


    结果是，Bancor 网络越使用，其市值越高，从而为用户产生更多的财富和更高的购买力。它还激励了当地消费，从而在社区内实现财富循环。


    ## Sable Coin


    另一种名为 Sable Coin（沙色币）的加密货币旨在主要帮助黑人社区.^(20) Sable Coin 任何人在网上都可以获得，但主要作为全球范围内黑人的交换媒介。这个去中心化的生态系统为非营利组织、企业和消费者提供资源，旨在促进全球范围内黑人经济的重建.^(21)


    Sable Coin 与活跃钱包相关，该钱包为非营利组织提供剩余资源；它还被积极用作寻求经济稳定的黑人社区互动的工具。其他消费者也可以使用钱包进行相互交换和交易。此外，Sable
    Coin 拥有一种借记卡，即 `SAC` 借记卡，允许在 170 多个国家消费 Sable Coin。货币快速的流动性使其成为全球黑人企业主交换服务和产品的关键，因为它建立了一个创新的数字经济。


    ## 近铁的 Harukas Coin


    如前所述，加密货币可以用于增加社区的支出。近铁的 Harukas Coin 就是一个典型的例子。


    Harukas Coin 于 2017 年 9 月在日本开始试点。报告显示，85% 的用户发现该货币易于使用，尽管他们在试点开始之前并不熟悉加密货币的概念.^(22)


    当在 2018 年 9 月进行第二次试点时，目标用户超过了 160 万人，他们对使用加密货币购物表现出兴趣。因此，Harukas Coin 预计作为近铁创建“无现金社会”使命的一部分，于
    2019 年初面向公众。


    Harukas Coin 尚未创造无现金社会，但它收到了积极反馈。试点参与者希望代币能在更大规模上实施。


    ## 谁是中本聪聪？


    比特币创始人中本聪聪（Satoshi Nakamoto）周围仍然笼罩着神秘色彩，这是开发比特币的未知个人、团体或机构的化名。关于他的了解极少，据说他在发布比特币白皮书后消失了。


    考虑到比特币总量最终将只有 2100 万枚，如果中本持有的比特币进行大量交易，将具有影响其价格的潜力。尽管年来人们曾多次努力确定中本聪真实的姓名和身份，但搜索结果一直是令人沮丧的。他今天仍然保持匿名。


    中本聪创造了比特币，并此铸了自己的货币。他为自己保留了特定数量的比特币，并将剩下的交给社区进行挖掘。社区同意他们将保证比特币的价值，并建立了用于管理共识的安全算法。


    无论比特币的实际创造者究竟是谁，那个人都提出了我在这里提出的相同问题：为什么政府必须是担保货币的人？我们为什么要依赖政府？为什么我们不能解构实际上有效的社会建构来服务我们自己的目的？


    ## 比特币流动性注入


    2009 年 1 月，中本聪向比特币系统注入了流动性。他挖掘了前五十枚比特币，这构成了区块链的创世区块。事实上，中本聪创建了世界上第一个用于数字货币（又称加密货币）的造币厂。截至
    2021 年 11 月，中本聪的五十枚比特币的价值约等于 560 亿美元.^(23)


    区块链促进了支持贸易和物物交换活动的去中心化平台的创建。加密货币作为任何发生的物物交换的共同价值衡量标准。数字货币可以在世界上任何地方使用，这种位置独立性促进了国际贸易。


    '
