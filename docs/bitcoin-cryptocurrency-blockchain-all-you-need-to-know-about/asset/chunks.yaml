  trans: '


    区块链交易几乎可以瞬间完成，且在全球任何地方都可以进行，无需考虑汇率或特定国家的银行法规等细节。区块链还为企业提供了一种极佳的方式，让他们确定自己交易的对象是有效客户而非骗子，因为供应链中的每一步都成为分布式账本上的一条不可篡改的条目。


    此外，创业者可以使用区块链技术为他们的技术开发相关的代币（或加密货币）。随后他们可以启动所谓的 `ICO`，即代币首次发行，这在区块链领域等同于出售股票。换句话说，创业者可以向投资者提供他们的加密货币，并利用这些资金开发其业务。


    许多中央机构已经意识到了加密货币的这些影响，为什么其中一些国家（如中国）正在开发其主权数字货币——数字人民币。他们的目标是抑制公共和私有加密货币的传播和采用。


    # 阿肯城 (Akon City)


    格莱美奖提名歌手阿肯（Akon）构思了阿肯城。它将是塞内加尔一个占地 2000 英里的开发项目，将使用一种新的加密货币 `Akoin`。`Akoin`构建在
    `Stellar` 区块链上，并将阿肯城的交易媒介。该代币将通过 `Atomic Swap` 提供，这是一种专利技术允许用户在几分钟内交换手机时长、法币和加密货币。`Akoin`
    不会挂钩美元，也不是一种证券代币发行。相反，`Akoin` 使用 `Delchain` 的代币管理流动性服务来平衡代币的价值、波动性和速度.^(24)


    阿肯城预计于 2023 年完工，到 2029 年应该将完全使用 `Akoin` 运行。这座城市具有重大意义，因为它是第一个使用加密货币而非法币的城市。此外，阿肯城位于塞内加尔，这是一个贫困的国家，其
    2020 年的 GDP 仅为 249.1 亿美元.^(25) 阿肯城已获得 60 亿美元的资金，约占该国总 GDP 的 25%。当这座城市开放时，全世界的目光都将聚焦于此，看
    `Akoin` 是否能真正缓解贫困。


    # 布雷顿森林协议


    1944 年，第二次世界大战期间，盟国在纽罕布什州的布雷顿森林会会.^(26)在这次会议上，起草了《布雷顿森林协议》，盟国国家誓言其中央银行将把货币与美元之间的汇率固定.^(27)转向美元具有重大意义，因为此前大多数国家都使用金本位.^(28)


    金本位保证了一个国家的货币可以按其黄金价值进行兑换。在布雷顿森林协议下，货币现在可以兑换美元而非黄金。美元被选为世界储备货币，很大程度上是因为美国持有了全球
    75%的黄金.^(29)


    布雷顿森林协议的主要目标是避免贸易战。如果一个国家的货币相对于美元贬值，中央银行将在外汇市场上买入其所有的货币.^(30)该协议提供的灵活性促进了货币市场的稳定，因为全球大多数货币现在都通过单一标准（美元）钩系。


    布雷顿森林协议之所以成功，是因为它防止了国际货币基金组织（`IMF`）成为全球中央银行。协议限制了 `IMF`，它只能根据成员的贡献向成员国贷款。`IMF`无法发行货币或制定货币政策。


    布雷顿森林协议于 1971 年结束，当时美国正处于高通胀时期。总统理查德·尼克松试图降低美元兑黄金的价值。然而，他的计划适得其反，人们纷纷用美元兑换黄金。结果，尼克松让美国退出了金本位，布雷顿森林协议就此结束。美元并没有崩溃，因为它仍然是世界其他地区的主导储备货币。


    美元持续存在是因为它维持了其作为世界储备货币的地位。在 2019 年第四季度，它占海外持有所有外汇储备的 60%。第二大持有货币是欧元，但它仅占外汇储备的
    20%。约 90%的外汇交易依赖美元。


    美元也是用于发行债务最多的货币。所有发行的债务中约有 40%是美元。一些国家担心，如果美元发生严重通胀，他们欠的美元债务将变得一文不值。如果美国决定发行更多货币或进一步增加其赤字支出，通胀是有可能的。


    美元的力量使其成为加密货币挂钩的最可行法币。因此，本书稍后介绍的新型加密货币平台将是直接挂钩美国美元的证券代币发行。


    下一章将探讨社会建构并研究道德的哲学起源。我将解释书中的一个核心主题——道德的本质是交易，并解释为什么需要一种媒介来衡量价值的交换。


    # 05 社会建构与道德的起源


    > 贸易原则是所有人类关系（无论是个人还是社会、私有还是公共、精神还是物质）唯一理性的伦理原则。它是正义的原则。


    > —安雅·兰德德（AYN RAND）^(1)


    本章将讨论道德的起源源于一种意图性的集体哲学，并将道德定义为社会建构的，而非客观的。它将通过分析英美普通法来勾勒社会契约架构的基础，普通法为这种“主观对客观”的典型二元对立提供了一种替代方案。


    本章还将讨论托马斯·霍布斯著名的“自然状态”，并用它来解释交换监管的起源。最后以一个场景结束，阐明货币是确保公平交换的最客观的货币。


    ## 货币的起源


    历史证据表明，物物交换的劣势当了货币发展的经济催化剂，但这绝非唯一或最重要的因素。《从古代到现代的货币史》一书作者格林·戴维斯（Glyn Davies）写道，货币的起源主要是由于非经济原因.^(2)例如，当局利用货币来向其臣民征税或征收贡赋。此外，宗教义务（如什一一税）需要缴纳贡赋和/或祭品。这些需求共同说明，货币的产生是为了便利根深蒂固的社会、宗教和政治习俗。


    ## 道德作为社会建构


    为了给社会建构的思想奠基础，我首先参考英美普通法。在普通法中，双方简单合同的形成通常需要协议、对价以及双方履行协议的意图。请记住，简单合同可以是口头形式.^(3)


    '
