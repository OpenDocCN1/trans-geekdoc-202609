  trans: '


    通过区块链域名系统，域名所有者可以通过其私钥对域名拥有完全控制权，所有权在公共地址中一而易见。这让所有者拥有完全的托管权，且域名购买是一次性的事务。


    由于域名是非同质化资产（就像指纹一样），`NFT` 标准是它们在区块链上创建的方式。在最近几个月里，每天注册的域名通常有 400 到 1200 个 [NFT.com](https://nft.com/)
    域名，2021 年注册了超过 30,000 个与 NFT 相关的域名。2021 年 3 月，以构建区块链域名闻名的公司 Unstoppable Domains
    以约 100,000 美元卖出了 NFT 域名“win.crypto”。虽然任何人都可以通过注册商购买传统域名，但用户无法购买永久所有权，”该公司联合创始人
    Brad Kam 说，“传统的网站域名平均价格为 10 美元，并且需要支付年度注册费来续约。‘win.crypto’的历史性销售表明，用户认为永久、可验证的域名所有具有价值。”


    使用 `NFTs` 作为域名，所有者可以使用其私钥控制其域名的各项活动。将域名视为 `NFTs` 的理念让网站所有者对其域名拥有完全的主权，无论是否有人背书。这将为网站所有者的绝对言论自由铺平道路。


    此外，以太坊命命名服务（Ethereum Name Service）使用 `NFTs` 来提供易记的以太坊地址，你可以将其发送给某人以接收 ETH。使用 `NFTs`
    作为域名，你不再需要数字地址，而是可以拥有带有你的名字或你决定的任何名称的可读性钱包地址。


    `NFTs` 在跨行业的各种用例中提供了多种赚钱机会，以及其他非货币激励。本节将讨论这些机会。


    ## 版权所有权的溯源


    与同质化加密货币一样，`NFTs` 非常适合代表在去中心化网络上是可证明的所有权。由于 `NFTs` 是代表特殊且独特资产所有权的理想选择，它们也非常适合用于版权所有权的代币化。


    艺术家现在通过将其作品转换为 `NFTs`，在作品再次转售后收取版税。随着这一领域的稳定，将出现监管框架，从法律上保护区块链上 `NFTs` 的所有权。


    在编写此时，`NFTs` 尚未被认为体现了知识产权。然而，随着技术的演进，我们将看到对 IP 版权证书以及各种在区块链上作为 `NFTs` 分配和出售的高端合同的所有权声明。


    ## 艺术品盗窃


    尽管 `NFTs` 有许多大机遇，但 `NFTs` 的出现为被盗的数字艺术品创造了一个不受监管的市场。例如，艺术品的伪品已经在 Rarible 和 OpenSea
    上铸造并出售，这两个是目前最大的 NFT 交易市场。


    已有若干报告显示，艺术家发现他们的作品出现在 `NFT` 拍卖网站上，而他们并未在这些网站上过过。遗憾的是，这种情况正在上升，因为目前还没有用于 `NFT`
    所有权验证的通用标准。


    ## 上升的碳足迹


    以太坊区块链仍然运行着第一个获得主流应用的 `NFTs`。自从 Larva Labs 的 CryptoPunks（第一个 `ERC` `NFT`）诞生以来，以太坊一直是链载
    `NFT` 智能合约最多的区块链，引领着节奏。目前，以太坊网络由工作量证明（`PoW`）共识驱动，这类似于比特币。


    高交易量反映在网络的高能源需求上，吸引了更多矿工，从而在矿工之间创造了持久的竞争并增加了挖矿难度。


    根据 cleancoin（一个旨在评估工作量证明区块链气候影响的平台）的数据，整个比特币的碳足迹相当于新西兰。


    ## 创建你的第一个 NFT


    创建 `NFT` 有几种方法。对于具有 `ERC` 智能合约开发经验的人来说，可以编写基于 `ERC-721` 的智能合约。自从 Larva Labs 的
    CryptoPunks（第一个 `ERC` `NFT`）诞生以来，以太坊一直作为链载 `NFT` 智能合约最多的区块链，引领着节奏。在目前，以太坊网络由工作量证明（`PoW`）共识驱动，这类似于比特币。


    高交易量反映在网络的高能源需求上，吸引了更多矿工，从而在矿工之间创造了持久的竞争并增加了挖矿难度。


    （注：此处原文存在部分重复，已根据指令去重，仅翻译逻辑内容）


    对于具有 `ERC` 智能合约开发经验的人来说，可以编写基于 `ERC-721` 的智能合约。


    创建你的第一个 NFT


    创建 `NFT` 有几种方法。对于具有 `ERC` 智能合约开发经验的人来说，可以编写基于 `ERC-721` 的智能合约。


    （注：由于提供的原文中存在多处段落重复，译文已根据“不要重复输出原文”的原则进行了去重，确保逻辑通顺。）


    '
