    # Preface


    In 2007, the mysterious and anonymous Satoshi Nakamoto developed bitcoin, authored
    the bitcoin white paper, and created and deployed bitcoin’s original reference
    implementation. Who is this person or institution that also devised the first
    blockchain database? How do we know Nakomoto isn’t a country? The release of Bitcoin
    and blockchain by Nakamoto remains as sinister as his disappearance in December
    2010. Estimates put the value of the bitcoin he left behind, and still unclaimed,
    at $56 billion as of November 2021.


    According to Tapscott Group CEO Don Tapscott, blockchains, the cryptocurrency’s
    technology, could revolutionize the world economy. Blockchain technology is a
    distributed decentralized ledger system that offers transparency, immutability,
    and security. Everybody has complete trust in the blockchain database, because
    it’s not governed by any single organization, meaning it’s open. You can transact
    directly to its receiver with blockchain technology, which includes any third
    party. Blockchain will change the world by getting rid of centralized control.
    No central authority can control your assets anymore. The blockchain size of the
    blockchain market is projected to grow from$4.9 billion in 2021 to $67.4 billion
    by 2026 at a compound annual growth rate of 68.4 percent.


    Bitcoin has been suggested as an attractive medium for international remittances
    because of the borderless nature of cryptocurrency. Since anyone can use the blockchain,
    there’s no need to send payments through a bank or centralized money transfer
    institution like Western Union or MoneyGram. Many people around the world regularly
    send money to their friends and family abroad. Blockchain advocates say that Bitcoin
    can facilitate remittances by removing intermediaries and reducing the costs of
    overseas payments. In 2019, the World Bank projected that the remittances industry
    was worth $540 billion.


    Blockchain technology has ushered in a powerful new version of the Internet referred
    to as Web 3.0. Web 3.0 arises out of frustration with how a tiny number of powerful
    trillion-dollar corporations practically control the data and services on the
    Internet today.


    One evening while watching the TV show *Money Heist,* I suddenly realized how
    much we, the masses, accept the government’s role in creating and governing money
    without question. In the episode I watched, a selfdescribed “bunch of losers”
    breaks into the Royal Mint of Spain, seizing hostages with one ultimate goal:
    to stay in the mint for as long as possible and print as many unmarked euros as
    they could, in effect minting their own money. *Money Heist* deftly showcases
    how, although we take the objective reality of money for granted, it is basically
    a psychological illusion.


    I wrote this book because I was inspired by the potential for blockchain to wrest
    power from a tiny centralized minority, be it big corporations or governments,
    and more equitably distribute the governance of monetary currency across the masses.
    As I researched the material for this book, I became aware of communities worldwide
    that have decided to start printing or minting their currencies as an alternative
    for trading to government-controlled fiat currencies. These communities challenged
    the notion that a currency was only valuable if created and governed by the government.
    One example of an alternative currency is the Brixtonpound (B£), now exchanging
    against the pound sterling and Bitcoin. Another alternative currency I recently
    learned about is Akoin, a cryptocurrency developed by hip-hop artist Akon, who
    has raised $6 billion to build a futuristic city in Senegal.


    Cryptocurrencies are not just for communities. Third-world countries realize the
    advantages of establishing an alternative to fiat. For example, El Salvador recently
    announced that they accept Bitcoin as legal tender. Bitcoin adoption could decrease
    the risk of current and future governments imposing policies that might affect
    the freedom of movement of capital and value of assets, stocks, and other financial
    mechanisms used within and outside of local economies.


    Other countries are also getting in on the act. China is releasing its digital
    yuan, which some analysts see as a move to displace the U.S. dollar as the world’s
    reserve currency. In addition, in June 2021, China and Russia announced a joint
    pledge against dollar hegemony. If these superpowers succeed in wrestling free
    from the authority of the dollar, it could have profound implications for the
    global economy and even world peace. Bear in mind that in June 2021, Russia stated
    it would ditch all U.S. dollar assets, worth $40 billion, in its National Wealth
    Fund and increase holdings in euros, Chinese yuan, and gold.


    Throughout history, currency morphed from being objectively valuable (when tied
    to the gold standard) to essentially becoming a social construct. I delved deep
    into trade history—from bartering to the standardization of metal coins to establishing
    a currency by government- controlled fiat and finally to modern-day cryptocurrencies.


    The year 2021 saw a large section of society become involved in trading cryptocurrency.
    Blockchain-based currencies are not regulated today. As of January 2021, twenty-five
    individual Bitcoin addresses are holding more than a billion dollars, according
    to BitInfoCharts, and there are a handful of anonymous Bitcoin billionaires out
    there. Additionally, as of January 2021, there may now be as many as 100,000 Bitcoin
    millionaires. Others became millionaires by purchasing and holding $1,000of Dogecoin
    or $300 worth of the Shiba Inu token. However, the reality is that 97 percent
    of those trading cryptocurrencies lose money. I wrote this book as a guide to
    help those wanting to leverage this exciting new technology to trade it or to
    embarking on a blockchain-based career or business opportunity. I have dedicated
    chapters to each topic because leveraging blockchain technology requires technical
    expertise and access to capital that one can quickly lose.


    Blockchain is superexciting and presents a host of potential opportunities. Even
    apart from cryptocurrencies, there is the exciting new world of decentralized
    finance (DeFi), which I will discuss in [chapter 13](#chapter13.xhtml). Over the
    last two years, the total money deposited at DeFi services has spiked from just
    $500 million to $247 billion. As a result, DeFi is emerging as a potent alternative
    and a disruptor of traditional centralized financial services for lending, borrowing,
    and investing.'
