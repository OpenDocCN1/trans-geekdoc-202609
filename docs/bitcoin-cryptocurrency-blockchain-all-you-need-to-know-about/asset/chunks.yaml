    include instructions from the start on what would be done in the event of a grievance.


    Understanding smart contracts can be complicated for the typical contract attorney,
    because the contracts are written in a computer coding language. Therefore, contract
    agreements in English must be translated into another language that the blockchain
    can understand.

    '
  trans: '


    ## 联邦贸易委员会


    `FTC` 是一个跨党派联邦政府机构，专注于保护美国消费者，同时促进美国经济的竞争(13)。`FTC` 对民事反垄断问题具有辖权，例如欺骗性或欺诈性行为。`FTC`
    对反垄断法的执法有助于保持市场的开放和自由(14)。


    2015 年 6 月，`FTC`宣布了其首一起与加密货币相关的诉讼(15)。该案涉及一个名为 `Prized` 的智能手机奖励应用程序。`Prized` 声称用户可以在应用程序上玩游戏赚取硬币，硬币可购买衣服或礼品卡等现实物品(16)。然而，用户无法用硬币购买任何东西。相反，该应用程序在他们的设备上安装了恶意软件。该恶意软件强制用户的设备为开发者挖掘如
    `Dogecoin`、`LiteCoin` 和 `QuarkCoin` 等虚拟货币。此案在纽泽西州联邦法院提诉，最终以应用程序开发者支付和解金告终。


    从第一起案件以来，`FTC`又提起了数十起诉讼。截至 2021 年 5 月，`FTC`的数据显示加密货币投资诈骗激增(17)。案件起诉数量的增加导致 `FTC`
    创建了一个新的行业分类——金融科技，或金融技术(18)。


    `FTC`对`FinTech`的辖权范围包括移动支付、众筹、虚拟货币、应用程序、电子商务网站等。它旨在通过对通过欺诈行为损害者的公司采取执法行动来监管这些部门。然而，存在一个问题，即`FinTech`工具通常是在境外制造的（`FTC`在那里缺乏辖权），或由未知实体制造。


    ## 金融犯罪执法网络 (FinCEN)


    `Financial Crimes Enforcement Network (FinCEN)` 是美国财政部的一个部门，负责监测金融交易。它成立于 1990
    年，旨在打击和阻止恐怖主义融资、洗钱和其他金融犯罪(19)。


    其主要监管职属于《1970 年货币和金融交易报告法》。`FinCEN`的职责集中于金融犯罪的早期检测和威慑。`FinCEN`的一些职责示例包括发布和解释政府法规中规定的规定、支持此类条款，以及维护政府范围内对`FinCEN`数据的访问。


    在 2001 年 9·11 恐怖袭击后，随着《爱国者法案》的实施，`FinCEN`获得了另一组职责。《爱国者法案》包含了联邦反洗钱(`AML`)和反恐怖主义融资(`CFT`)计划，由`FinCEN`负责监督。`FinCEN`还获得了作为美国政府“外国金融情报机构
    (FIU)”的角色(20)。


    直到 2019 年 5 月，`FinCEN`才发布了一套指南，将其规定适用于参与虚拟货币汇款业务的实体。2021 年 1 月，`FinCEN`发布了新提案，将使金融机构和交易所对某些数字货币交易承担繁重的记录保存和报告要求(21)。总而言之，任何涉及`SEC`或`商品交易委员会
    (CFTC)`的实体都必须根据《银行保密法 (BSA)》注册为`MSB`(22)。


    ## 金融行动特别工作 (FATF)


    `Financial Action Task Force (FATF)` 成立于 1989 年巴黎举行的“七国集团 (G7)”会议期间。其设计目标是打击国际洗钱(23)。超过
    200 个国家致力于`FATF`及实施`AML/CFT`法规。`FATF`每年都会变化，特别是为`资产服务提供商 (VASPs)`制定了遵守“旅行规则”的指令(24)。


    `FATF`还决定`VASPs`应当注册，至少在其创建的司法管辖区注册。`VASPs`将由主管机构进一步监测，该机构可以实施制裁或吊销`VASP 的许可证`。


    2021 年 10 月，`FATF`更新了其*2019 年虚拟资产和虚拟资产服务提供商（VASPs）基于风险的方法指南*。`FATF`标准要求国家评估并缓解与虚拟资产金融活动及提供商相关的风险；许可或注册提供商，并使其接受主管机构的监督或监测(25)。


    ## 智能合约


    区块链最用途之一是执行`智能合约`。智能合约是基于条件的自动执行协议，这使其具有比标准做法更有效地执行合同的能力。智能合约专门处理合同的执行而非其强制执行。因此，它们在技术上不能被视为具有法律约束力，尽管它们在其他方面具备法律协议的所有组件(26)。


    考虑到区块链的不可篡改性，这几乎是不可能的——例如，如果一个智能合约被判定对一方不公平并需要修改。区块链上实现的任何内容都是永久的。


    关于智能合约区块链不可篡改性的另一个问题是，分歧或冲突难以解决。大多数诉求发生在合同启动之后，这意味着智能合约必须从开始就包含关于发生诉求时将如何处理的指令。


    对于典型的合同律师来说，理解智能合约可能是复杂的，因为这些合同是用编程语言编写的。因此，英语合同协议必须翻译成区块链可以理解的另一种语言。


    '
