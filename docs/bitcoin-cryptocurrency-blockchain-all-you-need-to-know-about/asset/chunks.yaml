  trans: '


    第一个[特性]是它是一个`点点网络`(peer- to-peer network）。这意味着一个实体发送给另一个实体的任何信息都会直接到达接收者。这似乎并不常见，但大多数通过互联网发送的信息都会经过中间机构，无论是银行、网络提供商还是服务提供商。


    第二个特性是区块链是`去中心化的`(decentralized）。这意味着没有公司或机构控制该网络或其数据。


    区块链的第三个特点是`不可篡改的`(immutable）。一旦数据通过区块链传输，就无法被更改。正如我们所看到的，有些人通过在区块链上创建智能合约来利用它。每当智能合约需要货币时，就会使用实用代币。


    因此，使用实用代币进行加密货币交易理性得多，因为智能合约的技术用途起了主要作用。最流行和成熟的实用代币倾向于利用构建在区块链上的智能合约和去中心化应用。例如，某些实用代币，如`Solara`和`Cardano`，提供了智能合约功能。


    最著名的智能合约区块链是`Ethereum`（以太坊）。由`Vitalik Buterin`（维塔击·布特林）于 2013 年创立，截至 2021 年 7
    月，该区块链每天处理超过 120 万笔交易，使其成为全球最大的智能合约区块链。非同质化代币（NFTs），即独特物品或代币的数字表示，首次出现在`Ethereum`上。其中一些已以数千万美元的价格售。这些可能是目前区块链领域最火热的商品。


    唯一具有持续价值潜力的非实用代币是`Bitcoin`（比特币）。这是因为`Bitcoin`是第一个加密货币。尽管它没有绑定到智能合约基础设施，但它在某种意义上是有未来的，因为它将永远是一个收藏品。此外，`Bitcoin`的供应量被限制在
    2100 万枚，这个数字被程序化在`Bitcoin 的算法`中。


    ## 日内交易、波段交易和 Hodling


    无论你决定交易哪种类型的加密货币，为了成为一名胜任的加密货币交易员，你必须理解三种交易形式（参见图 01-02 和图 01-03）。


    第一种也是风险最高的是`日内交易`day trading。日内交易是一份全职工作，它可以极其获利。加密货币日内交易的问题在于——就像股票日内交易一样——人们必须理解技术分析和风险管理，并且思维敏捷。然而，加密市场的波动性是股市的十倍。(6)这使得加密货币日内交易风险更大，但也能产生更高的回报。在日内交易中，交易者持有币种的最长时间为几小时，因此他们主要依靠图表分析，而不是币市场的当前事件。使用加密货币进行的每笔交易都要向交易所支付手续费（这将在章的后部分探讨）。对于每天进行多次交易的日内交易员来说，这些手续费会导致利润边际损失。


    ![图 01-02. 交易类型。](img/img-27-1.jpg)

    图 01-02. 交易类型。


    ![图 01-03. 交易风格解释。](img/img-27-2.jpg)

    图 01-03. 交易风格解释。


    尽管有缺点，日内交易是一项可能获利的职业，可以在任何地方追求，但再次强调，它是高风险的。它可能需要多年才能掌握，但与任何有利的职业一样，努力可能会产生回报。


    第二种交易形式是`波段交易`swing trading。这涉及到在买卖币种之前等待市场的波动。波动的间隔为几天到几周不等，这意味着每天只需要花几个小时关注加密货币的波段交易。对于有全职工作的人来说，波段交易是日内交易更现实的替代方案。根据波动引起的价格波动进行交易定义了波段交易。这意味着仍然存在某些风险，尽管远少于日内交易。波段交易还伴随着根据短期收益出售的人性倾向。因此，波段交易者偶尔会错过潜在的长期收益。


    无论如何，对于已有全职职业的人来说，波段交易是进入加密货币交易的更好路径。虽然加密货币无疑是一个令人兴奋的新领域，但在交易中获得成功的人具有很高的技术性，拥有非常流动性的资产，而且非常幸运。通常，那些币种的早期采用者（带有很大运气）往往是大赢家。一个著名的例子是`Winklevoss
    twins`（温克沃斯兄弟），他们在 2011 年投资了 11,000 美元的`Bitcoin`，到 2017 年看到投资增长到超过 10 亿美元。那次投资风险极大，但获得了难以置信的回报。


    最后是`hodling`，它是`holding on for dear life`（死持有）的缩写，最早于 2013 年由于`holding`一词的拼写错误而产生。一个互联网加密货币交易员在论坛帖子中解释，如果人们缺乏日内交易员的专业知识或时间进行专门的研究，他们可能会在加密货币市场亏钱。该交易员选择在市场中持有资金足够长，以看到时间的稳步增长。这个拼写错误很快就有了了自己的含义：“拼命持有”。


    Hodling 是加密货币交易中最不费精力的方法。在对投资哪种加密货币进行适当研究后，只需购买大部分并让时间增加其价值。虽然日内和波段交易通常使用山寨币（altcoins）进行，这些币种往往波动性更大，因此提供了更多获利机会，但
    hodling 最适合像`Bitcoin`或`Ethereum`这样的实用代币。这些加密货币具有最好的长期投资潜力，因为它们是广为人知的，任何进入加密货币领域或已经在领域的人都应该在投资组合中持有一些这些币。Hodling
    消耗的时间少得多，不那么艰辛，在支付手续费方面也轻得多。


    尽管有这些优点，显然也错过了潜在的收益，需要大量的耐心才能获得满意的回报。


    ## 进行首次投资的步骤


    要开始加密货币交易，必须在交易所注册以购买币种。在决定选择哪个交易所时，有四个方面需要注意：交易费用、可用货币的种类、交易量，以及他们是否提供存储币种的钱包。


    在这些标准方面，总体上最广泛使用的交易所之一是`Coinbase`。该平台提供钱包，非常容易访问且具有高流动性。界面易于导航，每天可以处理超过 90 亿美元的交易。(7)
    `Coinbase`满足了大多数新手和资深交易员的需求：5600 万用户每月在 `Coinbase` 上交易价值 3000 亿美元的加密货币。根据加密货币数据公司
    `CoinMarketCap` 的数据，它的交易量位列所有交易所第三。在`Coinbase`更先进的交易所 `Coinbase Pro` 上，交易费用从 0.99
    美元到 2.99 美元不等，或高达 0.5%。(8)


    '
