- raw: 'While Coinbase has a fairly wide array of currencies, the exchange that provides
    traders with the most options is Binance.^([9](#notes.xhtml#chapter1-9)) This
    exchange is a good option if one is looking for newer coins or less well-known
    currencies. Binance has a remarkably low transaction fee—a flat 0.1 percent— and
    it offers 500 different currencies to trade. The exchange processes over 1.4 million
    transactions a day,^([10](#notes.xhtml#chapter1-10)) and it does offer a wallet.
    One thing to note about Binance is that the U.S. government has banned it because
    it lists several forbidden cryptocurrencies. U.S. citizens can still tap into
    the Binance exchange, but must use [Binance.us](https://binance.us/) instead,
    which does not allow trading of cryptocurrencies forbidden to U.S. citizens.


    When it comes to technical support, most exchanges provide email support only.
    The registration process for an exchange is not something to underestimate. No
    exchanges offer telephone support, and very few are diligent in their email responses.
    The OKEx exchange, founded in 2017, is a popular exchange that still does not
    offer any telephone support. While this is a downside to crypto trading as a whole,
    one exchange does seem to provide more customer care for its users than the rest:
    Kraken.com is known to be quite responsive via email to those looking for help.
    It might be the best exchange for potential traders who prefer this feature.^([11](#notes.xhtml#chapter1-11))


    Kraken is also special in providing trailing stop losses to traders. This simply
    means that the trader can set a predetermined percentage to lose. If the currency
    drops by that amount, the system automatically sells. If the currency subsequently
    increases in price, it must drop by that same percentage for the system to sell
    again. Trailing stop losses prevent traders from suffering excessive losses while
    still being able to earn profits. This feature is hugely important for day traders
    and unfortunately, some exchanges, such as the popular platform Robinhood, lack
    this functionality.


    ## Looking at the Charts


    No matter the avenue chosen for trading, ample research must be done on the cryptocurrencies
    that one is thinking of adding to one’s portfolio. To make a well-informed trade,
    examining predictor charts on a specific currency is important ([Figure 01-04](#chapter1.xhtml#fig4)).
    Before exploring the topic of analysis, it must be stated that financial markets
    are extremely unpredictable. A professor at Princeton University conducted a study
    in which monkeys were blindfolded and taught to throw darts. The monkeys would
    throw darts at a random array of stock visualizations. The monkeys’ “portfolio”
    outperformed index funds created by professional investors 98 percent of the time.^([12](#notes.xhtml#chapter1-12))
    The professors repeated these processes every year, from 1964 to 2010, and tracked
    the results. The process replicated 100 monkeys throwing darts at the stock pages
    each year. Amazingly, on average, 98 of the 100 monkey portfolios beat the 1,000
    stock capitalization weightedstock universe each year. This is simply to say that
    while technical analysis should not be ignored, the data are purely an aid to
    prediction. No amount of research can accurately predict which choice would be
    successful.


    ![Figure 01-04. Taking a Look at the Charts.](images/img-31.jpg)


    Figure 01-04. Taking a Look at the Charts.


    The most common measurements are the *simple moving average* (SMA) and the *exponential
    moving average* (EMA), see [Figure 01-05](#chapter1.xhtml#fig2), and [Figure 01-06](#chapter1.xhtml#fig3).
    These measurements are the average of a currency’s price over a given period.
    The shorter the time period, the more reactive the SMA is. This measurement is
    used to predict whether the price of the currency is trending up or down.


    To put it plainly, the simple moving average smooths out the volatility and allows
    the trader to make better decisions. The second, more complex indicator is the
    exponential moving average, which places a greater emphasis on recent price points.
    Some economists believe that the market is self- correcting. Therefore, recent
    prices can help predict an asset’s future pricing. Using this logic, it is thought
    that calculating the SMA with older price points is simply unnecessary. For hodl
    traders, the SMA is a useful tool because they are making decisions for the long
    term.


    ![Figure 01-05. Exponential and Simple Moving Averages.](images/img-32.jpg)


    Figure 01-05. Exponential and Simple Moving Averages.


    ![Figure 01-06. Average Data Point.](images/img-33.jpg)


    Figure 01-06. Average Data Point.


    The EMA is calculated by simply adding a multiplier to the more recent prices.
    This makes the EMA much more reactive to recent shifts. The way traders use these
    averages is relatively straightforward: When the price of a given currency is
    below the moving average, it is trending down. When it is above the moving average,
    it’s trending up. One issue regarding the EMA is that sometimes a small price
    change will be exacerbated by the EMA formula, and the trader will get spooked
    and miss out on future gains. The SMA is less reactive to shifts and would not
    create an issue like that.^([13](#notes.xhtml#chapter1-13)) No matter the type
    of crypto trading pursued, understanding SMA and EMA is essential to becoming
    skilled and profitable.


    ## How Whales Cause Volatility and Why It Matters


    Volatility has been mentioned a few times in this chapter, and it is not to be
    underestimated. Volatility in the crypto world refers to the market’s unpredictability
    and its propensity to change rapidly. The main culprits responsible for the volatility
    in crypto markets are whales: individuals or institutions that own a large quantity
    of a certain currency. Their actions can have major impacts on the price of the
    currency and the wallets of individual traders. There is speculation that roughly
    1,000 people own 40 percent of the Bitcoin supply.^([14](#notes.xhtml#chapter1-14))
    A few hundred individuals could tank the market by selling only half their share.
    Unlike traders in the stock market, whales in the crypto space are not monitored
    by the SEC.


    Whales manipulate the market in three ways. The most common is *pump and dump,*
    see [Figure 01-07](#chapter1.xhtml#fig4). A whale buys a large quantity of a coin,
    which spikes the price. Then individual traders who are eager to capitalize on
    this price rise start buying. This causes a second spike, and the whale sells
    at that point, making a profit off the demand he has caused.


    ![Figure 01-07. How Whales Pump and Dump.](images/img-34.jpg)


    Figure 01-07. How Whales Pump and Dump.


    The second tactic is called a *sell wall,* see [Figure 01-08](#chapter1.xhtml#fig5).
    A whale will place an exceptionally large sell order at below market price. Because
    of the size of the order, individual investors cannot sell above the whale’s order
    price, which causes the price of the currency to drop. This price drop alarms
    individual investors, and they sell their shares. The whale then swoops in and
    collects additional coins at a much lower price.


    ![Figure 01-08](images/img-35.jpg)


    Figure 01-08


    The third manipulation tactic whales use is *dark pools.* Whales will trade crypto
    among themselves, thus not affecting the public market. This allows whales to
    accrue substantial amounts of crypto and then execute something like a sell wall.^([15](#notes.xhtml#chapter1-15))


    ## How Influencers Are Influencing Your Pockets


    While whales have a considerable effect on the crypto markets, a second party
    also influences the market’s volatility. Famous people can have a major influence
    on the actions of many individuals, and thereby over markets. Again, because they
    are not under the jurisdiction of the SEC, they can manipulate the market by making
    public statements about a cryptocurrency.'
