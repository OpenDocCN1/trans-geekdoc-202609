    考虑以下可验证凭证的用例：Alice 必须向社交市场（Social Marketplace）证明她已满十八岁，才能获得注册授权。其目标是在不暴露她的年龄或出生日期的情况下完成验证。社交市场的结构设计支持
    DID（去中心化标识）授权。Alice 可以展示已存储在区块链上的 DID 来证明她对自己的数字身份拥有控制权，其私钥绑定身份验证器应用或网络浏览器。Alice
    在她的凭证注册表中存储了多个由各种信任中间机构发布的凭证，这些凭证都可以满足这一需求。她的浏览器或应用程序会询问她想使用哪种凭证。Alice 可以通过安全挑战响应，而无需使用密码。


    ## DAML 智能合约


    DAML 是一种下一代应用程序平台，让任何人都能轻松编写简单、简洁的多方智能合约，并将其部署到所选的基础设施中。DAML 是一种为价值交换创建的语言。智能合约是执行特定操作的机器编码承诺。


    DAML 背后的公司 Digital Asset Holdings 列出了智能合约语言必须实现的智能合约系统的五个关键属性。简而言之，这些属性为：


    1. **权利与义务证明。** 为了使合同的后果具有强制性，进入必须是自愿的。为了实现待自动化处理的协议，必须能够可靠地对合同任何给定状态的所有可能的未来结果进行推理。

    2. **机密执行。** 为了使合同具有机密性，只有受合同影响的方才有权查看合同细节。

    3. **证据追踪。** 为了使合同具有执行力，必须保留所有利益相关者对其进行授权的不可争议的证据。

    4. **形式可验证性。** 为了确保合约按预期执行，它必须接受形式化验证方法。


    ## Formal Media 区块版


    Formal Media 是世界上首个启用区块链的数字工作场所，它将智能合约与相应的数字记录同步，为记录、工作流以及交易的多个方签名提供溯源。Formal
    Media 区块版非常适合记录专业人士，他们需要向审计师或诉讼人员证明其数字记录、工作流和日志未被篡改或更改。


    `Virtualdeveloper.com` 使用微软、DAML 和 Sphereon 的技术开发了 Formal Media 区块版。


    ## Off-Blocks


    Off-Blocks 是一个从底层开始构建的革命性且创新的新平台。


    Off-Blocks 集成了自主权身份的数字签名，这些签名无法被盗取或复制，从而形成不可更改或否认的历史。你将拥有一个永不离开设备的 ID，你可以安全地访问生物识别，开启无限可能。Off-Blocks
    适用于手机、桌面和笔记本电脑设备上。由于免疫盗窃或攻击向量，你的 ID 和数据是安全的。该技术还让你比以往任何时候都更快、更可靠、更廉价地签署文档。


    考虑以下示例及其对社交市场的意义：生产者在出版前对音乐进行签名；法院能够验证口头证词；房东和租客分别签署物业文件。


    ## Azure 区块链令牌


    Azure Blockchain Tokens 预览使部署和管理标准令牌比以往任何时候都更加简单。它基于令牌分类法倡议（TTI）开发的标准构建。


    Azure Blockchain Tokens 让创建、部署和管理代表数字或物理资产的令牌比以往任何时候都更加易用。社交市场需要令牌用于加密货币。由微软首席区块链架构师
    Marley Gray 的令牌分类框架（Token Taxonomy Framework）为这些令牌奠定了技术基础。


    Azure Blockchain Tokens 允许交易的多个方安全地转移、交易、销毁或铸造令牌，无论选择何种分布式账本。Azure Key Vault 和
    Azure Active Directory 的集成有助于保障交易安全。


    令牌正迅速成为业务网络多方协议或合同中所引用价值的表示。令牌可以代表货币、资产所有、收据、门票、授权、游戏资产、忠诚积分、订阅等。


    ## Kiva 协议


    Kiva 协议是一项令人兴奋的新计划，旨在以低成本为没有银行账户的人提供可验证的数字身份和个人信用历史。


    在全球范围内，有 17 亿成年人没有银行账户，获取金融服务的两个主要障碍是缺乏正式身份证明和缺乏信用历史。Kiva 协议旨在通过使用区块链分布式技术向每个人发放数字身份，使正式和非正式金融机构都能够报告信用历史。


    从高层面上来说，根据 Kiva 网站，Kiva 协议的工作原理如下：


    ```

    当任何贷款人（无论是否为 Kiva 合作伙伴）发放贷款时，这将向借款人发送一个带有贷款详情的签名有效索赔。借款人接受正确的索赔并将其发布到其数字钱包中的私有账本上。


    还款也是如此——当借款人还款时，贷款人发送一个借款人批准并发布到其账本上的有效索赔。

    ```


    这使得所有信贷事件都记录在单一账本中，数字钱包的访问权限由个人控制。例如，如果有人已经在本地贷款人或 Kiva 实地合作伙伴验证了信用历史，并想向性银行申请贷款，他们可以授予银行对其信用历史的一次访问权限。


    # 13 去中心化金融简介


    想象一下，你使用的每种金融服务都有一个全球开放平台。想想股票市场、储蓄、贷款和保险。想象这些服务只要有活跃的互联网连接和智能手机就可以所有人访问。太棒了，对吧？虽然加密货币增加了跨境货币交易的访问性和成本效益，但
    DeFi 更进一步。DeFi 是一种实验性的金融形式，它不使用银行、经纪公司和交易所等中央金融中介来提供传统的金融工具，而是利用区块链上智能合约提供的现代且透明的方法。DeFi
    代表了一系列开发在公共分布式账本上的应用程序，旨在促进金融服务的新时代。


    '
