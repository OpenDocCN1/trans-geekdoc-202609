    虽然 Coinbase 提供的货币种类广泛，但为交易者提供最多选择的交易所是 Binance。如果你正在寻找新的币种或知名度较低的货币，这个交易所是一个不错的选择。Binance
    的交易费用非常低——固定为 0.1%，而且它提供了 500 种不同的货币供交易。该交易所每天处理超过 140 万笔交易，并且提供钱包。关于 Binance
    需要注意的一点是，美国政府禁止了它，因为它列出了几种被禁止的加密货币。美国公民仍然可以使用 Binance 交易所，但必须使用 [Binance.us](https://binance.us/)，该平台不允许交易对美国公民禁止的加密货币。


    在技术支持方面，大多数交易所仅提供电子邮件支持。交易所的注册流程是不容小估的。没有交易所提供电话支持，而且极少数交易所在邮件回复上足够尽职。成立于 2017
    年的 OKEx 交易所是一个热门交易所，但仍然没有提供任何电话支持。虽然这是加密货币交易的整体缺点，但有一个交易所似乎比其他交易所为用户提供了更多的客户关怀：Kraken.com
    以通过电子邮件对寻求帮助的人做出快速响应而闻名。这对于偏好这一功能的潜在交易者来说，可能是最好的交易所。


    Kraken 的特殊之处还在于为交易者提供移动止损（trailing stop losses）。这这意味着交易者可以设置一个预定的亏损百分比。如果货币下跌该幅度，系统会自动售出。如果货币价格随后上涨，必须再次下跌相同的百分比，系统才会再次出售。移动止损防止了交易者遭受过度损失，同时仍然能够获得利润。这一功能对于日内交易者至关重要，遗憾的是某些交易所（例如热门平台
    Robinhood）缺乏这一功能。


    ## 查看图表


    无论选择何种交易途径，都必须对考虑加入投资组合的加密货币进行充分的研究。为了做出明智的交易，检查特定货币的预测图表是 Format 的（见 [图 01-04]）。在探索分析主题之前，必须说明金融市场是极不可预测的。普林斯大学的一位教授进行了一项研究，让猴子被蒙上眼睛并学会投飞镖。猴子会向随机排列的股票可视化图表投飞镖。猴子的“投资组合”在
    98% 的时间内优于专业投资者创建的指数基金。教授们从 1964 年到 2010 年每年重复这些过程并跟踪结果。该过程每年模拟 100 只猴子向股票页面投飞镖。令人的是，平均每年在
    100 个猴子投资组合中有 98 个击败了 1000 只股票市值加权的股票池。这简单来说意味着虽然技术分析不应被忽视，但数据完全是对预测的辅助。任何研究都无法准确预测哪种选择将会成功。


    ![图 01-04. 查看图表。(images/img-31.jpg)


    图 01-04. 查看图表。


    最常用的指标是 `simple moving average`（`SMA`）和 `exponential moving average`（`EMA`），见
    [图 01-05] 和 [图 01-06]。这些指标是货币价格在给定期间的平均值。时间范围越短，`SMA` 的反应越灵敏。该指标用于预测货币价格是向上趋势还是向下趋势。


    简单来说，`simple moving average` 平滑了波动，并允许交易者做出更好的决策。第二个更复杂的指标是 `exponential moving
    average`，它更强调近期价格点。一些经济学家认为市场是自我修正的。因此，近期价格可以帮助预测资产的未来定价。根据这种逻辑，人们认为使用旧价格点计算 `SMA`
    仅仅是没有必要的。对于 hodl 交易者来说，`SMA` 是一个实用的工具，因为他们正在做长期决策。


    ![图 01-05. 指数移动平均和简单移动平均。(images/img-32.jpg)图 01-05. 指数移动平均和简单移动平均。![图 01-06.
    平均数据点。(images/img-33.jpg)图 01-06. 平均数据点。`EMA` 通过简单向近期价格加上一个乘数计算得出。这使得 `EMA` 对近期变化的反应灵敏得多。交易者使用这些平均值的方法非常直接：当给定货币的价格低于移动平均线时，它处于向下趋势。当它高于移动平均线时，它处于向上趋势。关于
    `EMA` 的一个问题是，有时微小的价格变化会被 `EMA` 公式放大，导致交易者受惊并错失未来的收益。`SMA` 对变化的反应较小，不会产生那样的问题。无论追求何种类型的加密交易，理解
    `SMA` 和 `EMA` 对于变得精通并获利至关重要。## 巨鲸如何导致波动以及为什么这很重要本章提到了几次波动，它不应被低估。加密世界中的波动性是指市场的不可预测性及其快速变化的倾向。负责加密市场波动性的主要罪魁祸首是巨鲸：拥有大量货币的个人或机构。他们的行为可能对货币价格和个人交易者的钱包产生重大影响。据推测，大约
    1000 人拥有 40% 的比特币供应量。几百名个人只需卖掉一半份额就能让市场崩盘。与股票市场的交易者不同，加密领域的巨鲸不受证券交易委员会（SEC）的监管。巨鲸通过三种方式操纵市场。最常见的是推高出货（pump
    and dump），见图 01-07。巨鲸购买大量硬币，导致价格飙升。然后渴望从价格上涨中获利的个人交易者开始购买。这导致了第二次飙升，巨鲸在该点出售，从他引发的需求中获利。![图
    01-07. 巨鲸推高出货。(images/img-34.jpg)图 01-07. 巨鲸推高出货。第二种策略被称为卖墙（sell wall），见图 01-08。巨鲸会在市场价格下方放置一个异常巨大的卖单。由于订单巨大，个人投资者无法在巨鲸的订单价格上方出售，这导致货币价格下跌。这种价格下跌令个人投资者恐慌，他们离开了股份。巨鲸随后介入，以更低的价格收集额外的硬币。![图
    01-08](img/img-35.jpg)


    图 01-08


    巨鲸使用的第三种操纵策略是暗池（dark pools）。巨鲸会在内部进行加密货币交易，从而不影响公开市场。这允许巨鲸积累大量的加密货币，然后执行诸如“卖墙”的操作。


    ## 网红影响者如何影响你的钱包


    虽然巨鲸对加密市场有相当影响，但另一方也影响着市场的波动性。名人对许多人的行为可以产生巨大影响，从而影响市场。再次，由于他们不受 SEC 的管辖，他们可以通过对加密货币发表公开声明来操纵市场。


    '
