- raw: 'In 2016, the *Hackney Gazette* of East London reported that a new currency
    had been rolled out for the homeless population in the London borough of Hackney
    to spend on leisure activities. Street artist Stik, who once lived at the Mare
    Street hostel, where the currency reportedly was launched, designed the yellow
    and green note. The note bears a quote from Stik that reads: “Your time belongs
    to you. Spend it on things you believe in.” According to the *Hackney Gazette*
    article, people who live at the hostel in Hackney can earn Spice Time Credit notes
    by volunteering for activities like cooking, tidying communal areas, and writing
    for the website.^([17](#notes.xhtml#chapter4-17))


    This enables the homeless population in Hackney to earn value that they could
    barter or trade for other goods and services. In effect, minting the Spice Time
    Credit note alleviated poverty in this area by providing an underprivileged population
    with a method of obtaining necessities. Since the credits are based on positive
    acts of service, they are not subject to hyperinflation, and they are protected
    from crime and counterfeiting.


    The Spice Time Credit was funded by the National Health Service (NHS) and Hackney
    Clinical Commissioning Group (CCG). It makes up a social enterprise that has launched
    thirty-six local currencies since its founding in South Wales, and it strives
    to ensure accessible health care for all.


    ## Colu


    Colu, founded in Tel Aviv in 2014, was developed to “change the face of the local
    economy” by issuing community currencies to boost economic activity. The concept
    surrounding Colu’s cryptocurrency is easy to understand. First, the company identities
    a community within a major city linked to a national fiat currency, and then it
    launches a city currency.^([18](#notes.xhtml#chapter4-18)) The city currency is
    based on an incentive system centered around rewarding positive behavior. The
    idea of this is to work with local governments to attract positive social actions
    such as volunteering or spending the digital currency within the community.


    One example of a currency developed by Colu is the East London pound (ELP). The
    ELP, like the Spice Time Credit, was launched in Hackney, but later, in 2017.
    It works by having users first download the Colu application. Once the application
    is downloaded, users are given five East London pounds. After the initial download,
    the ratio of every 1£ uploaded to ELP becomes 1:1. The ELP is accepted in bars,
    barbers, bookshops, bike shops, and more.


    The benefits of the ELP are that it eliminates the coercion associated with fiat
    issued by a centralized authority. Its continued use in the community has helped
    grow small businesses by keeping funds within the borough and by motivating positive
    behaviors.


    Since its introduction, Colu has expanded further, not only in London, but also
    in Haifa and Liverpool. It continues to grow, and its February 2018 token sale
    raised almost $23 million.


    ## Bancor


    Bancor recently launched blockchain-based currencies in Kenya.^([19](#notes.xhtml#chapter4-19))


    It uses Bitfury integrated with Java to allow for private chain anchoring to public
    networks. Bancor’s objective with this innovative project is to combat poverty
    using peer-to-peer collaboration.


    The Bancor Network allows underprivileged communities in Kenya to generate cryptocurrencies.
    These cryptocurrencies can maintain balances and integrate in such a way that
    one can be exchanged for the other without the need for a third party.


    As a result, the more the Bancor Network is used, the higher its market cap, which
    generates more wealth and higher purchasing power for its users. It also incentivizes
    local spending, thereby recirculating wealth within communities.


    ## Sable Coin


    Another cryptocurrency, known as Sable Coin, aims to help primarily Black communities.^([20](#notes.xhtml#chapter4-20))
    Sable Coin is available to anyone online but mainly serves as a medium of exchange
    for Blacks globally. This decentralized ecosystem provides resources for nonprofit
    organizations, businesses, and consumers intended to facilitate the rebuilding
    of the Black economy worldwide.^([21](#notes.xhtml#chapter4-21))


    The Sable Coin is associated with its active wallet, which provides residual resources
    to nonprofits; it is also actively used as a tool to interact with Black communities
    seeking economic stability. Other consumers can exchange and transact with one
    another too, using the active wallet. Furthermore, Sable Coin has a debit card,
    the SAC debit card, which allows for Sable Coin to be spent in over 170 countries.
    The currency’s rapid liquidity makes it essential for the exchange of services
    and products from Black business owners globally, as it builds an innovative digital
    economy.


    ## Kintetsu’s Harukas Coin


    As already mentioned, cryptocurrency can be used to increase spending in a community.
    Kintetsu’s Harukas Coin is a prime example.


    The Harukas Coin was introduced on a trial basis in Japan in September 2017. Reports
    indicate that 85 percent of users found the coin easy to use, even though they
    were not familiar with the concept of cryptocurrency before the trial began.^([22](#notes.xhtml#chapter4-22))


    When a second trial was conducted in September 2018, over 1.6 million users were
    targeted and expressed interest in using the cryptocurrency for shopping. As a
    result, the Harukas Coin was expected to be available to the public in early 2019
    as part of Kintetsu’s mission to create a “cashless society.”


    The Harukas Coin has not created a cashless society yet, but it received positive
    feedback. Participants in the trial expressed a desire for the token to be implemented
    on a larger scale.


    ## Who Is Satoshi Nakomoto?


    There is still an aura of mystery surrounding Bitcoin founder Satoshi Nakamoto,
    the pseudonym for the unknown individual, group, or institution that developed
    Bitcoin. Little is known about him, and it is said that he disappeared after releasing
    the Bitcoin whitepaper.


    Given that there will eventually be a total of only 21 million Bitcoins, Nakamoto’s
    holdings have the potential to affect its price if traded significantly. While
    there have been numerous efforts over the years to determine Nakamoto’s real name
    and identity, the search has proved frustrating. He remains anonymous to this
    day.


    Nakamoto created Bitcoin and thereby minted his own money. He kept a specific
    number of Bitcoins for himself and made the rest available to be mined by the
    community. The community agreed that they would guarantee the value of Bitcoin,
    and they instituted their security algorithm for managing consensus.


    Whoever the creator of Bitcoin actually is, that person asked the same questions
    I propose here: Why does the government have to be the one guaranteeing money?
    Why are we relying on government? Why can’t we deconstruct what is effectively
    a social construct to serve our own purposes?


    ## Bitcoin Liquidity Injection


    In January 2009, Nakomoto injected liquidity into the Bitcoin system. He mined
    the first fifty Bitcoins, which came to be known as the genesis block for the
    blockchain. In effect Nakomoto created the world’s first mint for the creation
    of digital money, otherwise known as cryptocurrency. As of November 2021, the
    value of Nakomoto’s fifty Bitcoins was worth approximately $56 billion.^([23](#notes.xhtml#chapter4-23))


    Blockchain facilitates the creation of a decentralized platform to support trade
    and bartering activities. Cryptocurrency serves as a common measure of value for
    any bartering that takes place. The digital currency can be used from anywhere
    in the world, and this location independence promotes international trade.'
