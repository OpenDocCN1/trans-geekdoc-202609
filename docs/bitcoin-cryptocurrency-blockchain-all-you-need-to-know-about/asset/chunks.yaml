    `xSigma` 是一个由 `ZK International` 创建并拥有的区块链研发实验室，它是稳定币交易所和流动性挖矿平台，其背后有一家纳斯达克上市上市公司，并由
    `xSigma Labs` 的世界级开发者推出。


    多家公司正在开发 DeFi 解决方案以增强行业安全性。例如，加密货币安全存储提供商 `Trustology` 开发出一种适用于 DeFi 的防火墙，使其能够在各种去中心化协议上使用智能合约安全控制。`Quantstamp`
    是另一家公司，他们开发了相应的解决方案来应对智能合约相关的安全风险。最后，`Alliance DAO`（前身为 Alliance）帮助初创公司从广泛的行业网络中获取流动性和支持。该联盟旨在到
    2025 年将 DeFi 平台发展到 10 亿用户。


    ## 结论


    在为《福布斯》写的文章中`Lawrence Wintermeyer` 观察到：“去中心化和以用户中心的金融（通常被称为 `DeFi`）这一新兴现实在近年来已变得重要到无法忽视。”随着过去一年机构投资对区块链和加密货币的投资和兴趣爆发式增长，有一点变得非常清晰：加密货币和
    DeFi 是金融的未来。


    # 14 如何创建非质化代币


    从科技创业企业家 Jack Dorsey 一封以 250 万美元拍卖出的推文，到 Beeple 的数字艺术作品《前 5,000 天》在佳士锡拍卖行以超过 6,800
    万美元的价格成交，^(1)，非质化代币（NFTs）的近期出现对我们感知价值的方式提出了质疑。


    然而，随着 NFT 热的起，NFT 盗窃案件也在增加。许多艺术家分享了他们的作品在未经许可的情况下被铸造为 NFT 的故事.^(2) 除了盗窃问题，还存在非质化代币作为艺术品的合法性问题。


    尽管存在这些挫折和怀疑，NFT 市场一直看涨。因此，许多批评人士将 NFT 现象归类为媒体炒作推下的另一个加密泡沫。


    由于每个非质化资产都具有复杂性，NFT 几乎无法定价，因此很难说它们是被高估、低估还是与其售价价格持平。深入研究这一新兴领域将使我们更清楚 NFT 为什么会变成现在。


    ## NFT 的兴起


    2017 年 6 月，`Larva Labs` 的 Matt Hall 和 John Watkinson 推出了 `CryptoPunks`，这是部署在 `Ethereum`
    上的第一个非质化代币。通过 `CryptoPunks` 存储在 `Ethereum` 区块链上的独特 10,000 个字符特征，第一个 NFT 诞生了。由于这些“朋克”的供应量限制在
    10,000 个独特字符，这些虚拟角色从一开始就被程序化了稀缺性和独特性。


    换句话说，每个朋克在 `Ethereum` 区块链中植入了自身的独特特征，就像活细胞中独特的 DNA 链一样。


    在接受 Art Market Guru 采访时，Hall 解释道：


    > 在 2017 年初，John Watkinson …… 一直在弄像素角色生成器，它已经到了可以产生很多非常酷、有趣的角的地步。我们只是不太确定该如何处理它们。在我们发现以太坊并产生在区块链上使其变得独特且可拥有的想法之前，似乎没有任何主意是足够强大的。从那时起，我们开始尝试实际上找出是否可行，以及在实际以以太坊实施时应该以什么形式呈现.^(3)


    在 `CryptoPunks` 成功后，2017 年 12 月，`CryptoKitties` 团队的 Dieter Shirley 和 William Entriken
    提出了 `ERC-721` 标准，^(4)这使得在 `Ethereum Virtual Machine`（`EVM`）上实现 NFT 成为可能。继 `CryptoPunks`
    成功之后，`CryptoPunks` 和 `CryptoKitties` 的成功点燃了这一市场的火焰。根据 `JPMorgan` 的数据，NFT 市场在 2021
    年经历了爆炸式增长，月销售额约为 20 亿美元。


    这是从 2021 年初每月 4 亿美元规模的巨大增长，并推动了 NFT 宇宙的市值达到 70 亿美元。


    根据 `Brand Essence Market Research` 的数据，2021 年上半年 NFT 交易增长了 328%。


    ## 什么是 NFT？


    在所有可能的价值下都是相同的资产被称为“同质化的”（参见 14-01）。示例包括 `Bitcoins` 和美元。


    ![图 14-01 同质化](img/img-179.jpg)


    图 14-01 同质化


    相比之下，NFT 是一种特殊的加密资产，每个令牌都是唯一的。由于每个 NFT 都是唯一的，它们可以用于验证艺术品、录音、房地产甚至宠物的所有权。


    虽然代表 NFT 的实体有无限可能，但它们通常用于数字艺术品、收藏品和视频。今天，域名、用户头像、虚拟房地产甚至独特的数字金融工具也被表示为 NFT。


    像表情符号那低分辨率图像以百万美元出售，以及一些非性的 NFT 购买让很多人震惊。从客观来看，这些价格似乎并不合理。然而，请继续阅读。


    ## NFT 与主观价值理论


    主观价值理论的前提是，同一物品根据人们各自的情感、偏好、思维过程和生活经验而被赋予不同的价值。虽然 Jack Dorsey 的粉丝愿意花 250 万美元购买其首次推文的铸造版本，但另一个
    Twitter 用户根本不在乎。这种现象并非 NFT 世界所独有。考虑一下 2021 年 4 月，音乐人 Kanye West 设计并穿过的一双鞋在拍卖会上以
    180 万美元（130 万英镑）成交——这是运动鞋运动以来支付的最高金额。


    ## NFT 与智能合约


    比喻来说，智能合约是构成各种 NFT 的技术乐高积木。所有 NFT 都存在于智能合约区块链上，特别是 `Ethereum`。在这方面，智能合约允许 NFT
    以稀有、独特、可交易的非质化实体的表现形式存在。


    '
