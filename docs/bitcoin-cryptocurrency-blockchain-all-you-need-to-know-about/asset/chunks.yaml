    A blockchain transaction can be completed nearly instantly, from anywhere in the
    world, and does not have to consider details like exchange rates or country-specific
    banking regulations. Blockchain also offers an excellent way for businesses to
    know that they are dealing with valid customers and not scammers, as each step
    in the supply chain becomes an immutable entry on the distributed ledger.


    Furthermore, entrepreneurs can use blockchain technology to develop an associated
    token, or cryptocurrency, for their technology. They can then launch what is known
    as an `ICO`, or initial coin offering, which is the blockchain equivalent of selling
    stock. In other words, entrepreneurs can offer their cryptocurrency to investors
    and use the funds to develop their business.


    Many central authorities are already aware of these implications of cryptocurrencies,
    which is why some of them, such as China, is in the process of developing its
    sovereign digital currency, the digital yuan. They aim to inhibit the spread and
    adoption of public and private cryptocurrencies.


    # Akon City


    Akon, a Grammy Award–nominated singer, conceived Akon City. It will be a 2,000-acre
    development in Senegal that will use a new cryptocurrency, `Akoin`. `Akoin` is
    built on the `Stellar` blockchain and will launch as the medium of exchange for
    Akon City. The token will be available through an `Atomic Swap`, a proprietary
    technology that lets users exchange phone minutes, fiat, and cryptocurrency within
    minutes. `Akoin` is not going to be fixed to the American dollar and is not a
    security token offering. Instead, `Akoin` uses `Delchain`’s token management liquidity
    services to balance the token’s value, volatility, and velocity.^([24](#notes.xhtml#chapter4-24))


    Akon City is expected to be completed by 2023, and by 2029 it should be running
    using `Akoin` exclusively. The city will be significant in that it will be the
    first one to use cryptocurrency instead of fiat. Furthermore, Akon City is in
    Senegal, an impoverished nation with a GDP of $24.91 billion in 2020.^([25](#notes.xhtml#chapter4-25))
    Akon City has received $6 billion in funding, which represents about 25 percent
    of the nation’s total GDP. All eyes will be on this city when it opens to see
    if `Akoin` can truly alleviate poverty.


    # The Bretton Woods Agreement


    In 1944, during World War II, the Allied nations met in Bretton Woods, New Hampshire.^([26](#notes.xhtml#chapter4-26))
    At this meeting, the Bretton Woods Agreement was written, whereby the Allied countries
    vowed that their central banks would fix exchange rates between their currencies
    and the dollar.^([27](#notes.xhtml#chapter4-27)) Shifting to the dollar was significant,
    because previously most nations were using the gold standard.^([28](#notes.xhtml#chapter4-28))


    The gold standard guaranteed that a nation’s currency could be exchanged for its
    value in gold. Under the Bretton Woods Agreement, currencies could now be exchanged
    for dollars instead of gold. The dollar was chosen to be the world’s reserve currency
    largely because the United States held 75 percent of the world’s gold.^([29](#notes.xhtml#chapter4-29))


    The main objective of the Bretton Woods Agreement was to avoid trade wars. If
    a nation’s currency grew weak compared to the dollar, the central bank would purchase
    all its currency in foreign exchange markets.^([30](#notes.xhtml#chapter4-30))
    The flexibility provided by this agreement promoted stability in currency markets,
    since globally most currencies were now linked by a single standard, the dollar.


    The Bretton Woods Agreement was successful because it prevented the International
    Monetary Fund (`IMF`) from becoming a global central bank. The agreement limited
    the `IMF`, which could only lend money to member countries in proportion to the
    member’s contribution. The `IMF` was not able to print money or establish monetary
    policies.


    The Bretton Woods Agreement ended in 1971 when the United States was experiencing
    high inflation. President Richard Nixon attempted to deflate the dollar’s value
    in relation to gold. His plan backfired, however, as people responded by redeeming
    their dollars for gold. As a result, Nixon took the United States off the gold
    standard, and that was the end of Bretton Woods. The dollar did not collapse,
    because it remained the dominant reserve currency for the rest of the world.


    The dollar continues to persevere because it has maintained its status as the
    world’s reserve currency. In the fourth quarter of 2019, it made up 60 percent
    of all foreign exchange reserves held abroad. The second most widely held currency
    is the euro, but it only makes up 20 percent of foreign exchange reserves. About
    90 percent of foreign exchange trading depends on the dollar.


    The dollar is also the currency used most for issuing debt. About 40 percent of
    all issued debt is in dollars. Some countries fear that debt owed to them in dollars
    will become worthless if the dollar experiences severe inflation. Inflation is
    possible if the United States either decides to print more money or further increase
    its deficit spending.


    The dollar’s power makes it the most viable fiat to which to link cryptocurrencies.
    As such, the new cryptocurrency platform presented later in this book will be
    a security token offering directly fixed to the American dollar.


    The next chapter will examine social constructs and look at the philosophical
    origins of morality. I will explain a central theme in this book—the essence of
    morality is the transaction—and explain why it is necessary to have a medium to
    measure the exchange of value.


    # 05 Social Constructs and the Origins of Morality


    > The principle of trade is the only rational ethical principle for all human
    relationships, personal and social, private and public, spiritual, and material.
    It is the principle of justice.


    > —AYN RAND^([1](#notes.xhtml#chapter5-1))


    This chapter will discuss the origins of morality as being derived from a collective
    philosophy of intentionality and will define morality as being socially constructed,
    as opposed to objective. It will outline the foundation for a social contract’s
    architecture by analyzing Anglo-American common law, which offers an alternative
    to the typical binary opposition of subjective objective.


    This chapter will also discuss Thomas Hobbes’s famous state of nature and use
    it to explain the origins of exchange regulation. It will conclude with a scenario
    illuminating how money is the most objective currency for ensuring equitable exchanges.


    ## The Origin of Money


    Historical evidence demonstrates that the disadvantages of bartering served as
    an economic catalyst for the development of money, but by no means was this the
    only or most important factor. Glyn Davies, the author of *A History of Money
    from Ancient Times to the Present Day,* wrote that money originated primarily
    because of noneconomic causes.^([2](#notes.xhtml#chapter5-2)) For example, money
    was used by authorities to tax or collect tribute from their subjects. Additionally,
    religious obligations such as tithing required payment of tribute and/or sacrifices.
    Together, these needs illustrate that money was derived to facilitate deeply rooted
    social, religious, and political customs.


    ## Morality as a Social Construct


    To lay the foundation for the idea of the social construct, I first want to refer
    to Anglo-American common law, where the formation of a simple contract between
    parties generally requires an agreement, consideration, and intent by both parties
    to fulfill the agreement. Bear in mind that a simple contract can be oral.^([3](#notes.xhtml#chapter5-3))

