    ## 目标市场（Target）


    想象一个可以在 3D 空间会面、旅行或工作的世界，元宇宙是一个梦想……元宇宙的观众是在线上的。^(6)


    元宇宙可能允许潜在的 take the the the,,, as as,,,你的,,, to........,,,,,,,,,,,,元宇宙，使用虚拟现实（VR）头戴设备，`Mark
    Zuckerberg` 估计元宇宙功能成为主流可能需要五到十年时间。^(7)


    在 2021 年 8 月，`Forrester` 对 `U.S.` 和 `U.K.` 的 1263 名成年消费者进行了调查，以了解他们对元宇宙的态度。只有
    23% 的 `U.S.` 和 17% 的 `U.K.` 表示愿意花费一些时间。29% 的 `U.S.` 和 33% 的 `U.K.` 回答说他们还不理解元宇宙，而
    27% 的 `U.S.` 和 36% 的 `U.K.` 表示在生活中不需要。^(12)


    然而，必须理解元宇宙的主要目标受众是男性千禧一代和 Z 世代。^(13) 千禧一代是指出生 1980 年至 1995 年之间的人。`U.S.` 大约有 8000
    万千禧一代。Z 世代成员是指出生 1996 年至 2000 年代中期的人（16 至 26 岁）。`U.S.` 大约有 9000 万 Z 世代成员。^(14)


    ## 为什么元宇宙很重要？


    基于区块链的技术（如 `NFTs` 和 `加密货币`）模糊了现实世界和虚拟世界交易之间的界限。因此，品牌公司已经开始准备在元宇宙中提供其商品和服务。例如，`Nike`
    在最近的商标申请中表示其意图是制造和销售虚拟品牌运动鞋和服装。


    随着越来越多的人们转向数字活动，特别是在疫情之后，数字和物理世界正在逐渐融合。这部分解释了为什么元宇宙引起了巨大的热情。


    然而，《黑客帝国》电影是元宇宙一个相关的比喻吗？我们能现实地设想出一个与现实无法区分的扩展现实吗？


    大量技术正在涌现，通过将大脑连接到数字设备来扩展或复制我们实体的能力。例如，2019 年 10 月，美国科学家报告他们成功绘制了与运动相关的整个大脑细胞的图谱。此外，《科学美国人》杂志写道，读脑和脑控制技术正在到来。^(15)

