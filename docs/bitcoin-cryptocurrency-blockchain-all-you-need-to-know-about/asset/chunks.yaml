- raw: 'Central to the metaverse concept is the idea that virtual, 3D environments,
    accessible and interactive in real time, will become the transformative medium
    for social and business engagement. The metaverse has the potential to become
    a robust $800 billion digital economy by 2024,^([4](#notes.xhtml#chapter15-4))
    where users can create, buy, and sell goods and services. Ideally, the metaverse
    will facilitate interoperability, allowing you to take virtual items like clothes
    or cars from one platform to another. With digital worlds continuing to embed
    themselves in our daily lives, the metaverse could represent over a $1 trillion
    market opportunity, according to crypto investment firm Grayscale.^([5](#notes.xhtml#chapter15-5))
    The metaverse might allow you to take the avatar you create everywhere as quickly
    as you can copy your profile picture from one social network to another. These
    metaverse visions are compatible with Web 3.0, a term covering decentralized Internet
    services where users retain more personal control over the data they put online.


    In his 1992 novel *Snow Crash,* Neal Stephenson famously coined the word “metaverse,”
    referring to a 3D virtual world inhabited by avatars of real people. The metaverse
    has partly become a dream for the future of the Internet. To some extent, it has
    become a neat way to encapsulate new technologies, such as virtual reality and
    augmented reality and some current trends in online infrastructure, including
    the growth of real-time 3D worlds.


    Facebook is now rebranded as Meta, and its CEO Mark Zuckerberg enthusiastically
    describes the metaverse as the future of the Internet. However, skeptics can’t
    help wondering whether this is vision isn’t just a brilliant marketing ploy for
    Meta to further monetize its social media platform. Meta is arguably the tech
    company with the most significant stake in the metaverse, and they simply define
    it as: “a set of virtual spaces where you can create and explore with other people
    who aren’t in the same physical space as you.”^([6](#notes.xhtml#chapter15-6))


    Envisioning a world where digital avatars connect through work, travel, or entertainment
    using virtual-reality (VR) headsets, Meta CEO Mark Zuckerberg estimates it could
    take five to ten years before the critical features of the metaverse become mainstream.^([7](#notes.xhtml#chapter15-7))


    The TV show *Star Trek: The Next Generation* introduced millions of people to
    the idea of a holodeck: an immersive, realistic 3D holographic projection of a
    complete environment that you could interact with and even touch.


    On August 29, 2021 Meta announced its new technology, Horizon Workplace,^([8](#notes.xhtml#chapter15-8))
    which uses virtual reality headsets to gather colleagues as avatars inside of
    a simulated meeting room.^([9](#notes.xhtml#chapter15-9))


    Imagine putting on your XR neural interface device, and, instead of a cartoonish
    avatar, when you look in the mirror you see the holograph of your choosing? Some
    technologists are developing bendable electron ics and sensing technologies to
    simulate the sense of touch on people’s fingers, hands, and wrists. In time, this
    technology could be developed to allow your hologram to meet your colleagues on
    the other side of the world on a holodeck and really feel their handshake.^([10](#notes.xhtml#chapter15-10))


    Scientists in the twenty-first century are developing ways to use modern technology
    to create several types of holograms. Some of these are already being used in
    medical systems, education, art, security and defense.^([11](#notes.xhtml#chapter15-11))
    Holograms can change the way that we interact. In Washington, D.C., a company
    is using cutting-edge technology to create lifelike video avatars for immersive
    environments such as music, games, and training videos.


    The technologies that make up the metaverse include some of the following:


    1.  Extended reality (XR)—the combination of augmented, virtual and mixed reality
    worlds that will continue to exist independent of user interaction.


    2.  Real-time 3D computer graphics and personalized holographic avatars.


    3.  Integrated multimedia interaction such as audio, video, and gaming.


    4.  A variety of person-to-person social interactions that are less competitive
    and goal-oriented than stereotypical games.


    5.  Support for users creating their virtual goods, services, and environments.


    6.  Integration with real-world markets and economic systems to facilitate commerce.


    Microsoft, the world’s largest company, with a nearly $2.5 trillion market capitalization
    as of October 2021, already uses holograms and is developing mixed and extended
    reality (XR) applications for its Mesh platform. Microsoft has plans to introduce
    mixed reality, including holograms and virtual avatars, to its conferencing platform
    Microsoft Teams in 2022. Microsoft is also building explorable 3D virtual connected
    spaces for retail and workplaces. In a partnership with the U.S. Army, Microsoft
    is working on an augmented-reality (AR) Hololens 2 headset for soldiers to train,
    rehearse, and fight in.


    ## Target Market


    In August 2021, Forrester surveyed 1,263 online adult consumers across the U.S.
    and the U.K. to learn about their current attitude toward the metaverse. Only
    23 percent of respondents in the U.S. and 17 percent of those in the U.K. expressed
    that they would “like to spend some time exploring the metaverse.” Twenty-nine
    percent of those in the USA and 33 percent in the U.K. responded that they still
    don’t understand the metaverse, while 27 percent of those from the U.S. and 36
    percent from the U.K. indicated no need for it in their lives.^([12](#notes.xhtml#chapter15-12))


    It is essential to understand, however, that the primary target audience for the
    metaverse, at least for now, are male millennials and Generation Z.^([13](#notes.xhtml#chapter15-13))
    A millennial is anyone born between 1980 and 1995. In the U.S., there are roughly
    80 million millennials. A member of Generation Z is anyone born between 1996 and
    the early to mid-2000s (ages 16–26). In the U.S., there are approximately 90 million
    members of Generation Z.^([14](#notes.xhtml#chapter15-14))


    ## Why is the Metaverse Important?


    Blockchain-based technologies such as NFTs and cryptocurrencies are blurring the
    line between real world and virtual world commercial transactions. As a result,
    brand-name corporations are already ramping up to make their goods and services
    available in the metaverse. Nike, for example, has indicated its intent to make
    and sell virtual branded sneakers and apparel in a recent trademark application.


    With more of our attention going towards digital activities, particularly following
    the pandemic, digital and physical worlds are progres sively merging. It partly
    explains why the metaverse has been generating significant enthusiasm.


    However, are the Matrix movies a relevant metaphor for the metaverse? Can we realistically
    envisage a future whereby we are plugged into an extended reality that would be
    indistinguishable from the real?


    A slew of technologies are emerging that extend or replicate the capacities of
    our material selves by connecting our brains to digital devices. For example,
    in October 2019, American scientists reported their success in mapping all of
    the brain cells associated with movement, the motor cortex. In addition, *Scientific
    American Mind* magazine^([15](#notes.xhtml#chapter15-15)) wrote that mind reading
    and mind control technologies are coming. By leveraging machine learning, scientists
    can analyze complex activity patterns in a person’s brain, detecting what they
    are thinking about or experiencing.'
