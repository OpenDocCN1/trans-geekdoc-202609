- raw: 'Billions of individuals and millions of small businesses and entrepreneurs
    face high financial transaction costs and other barriers to connecting to the
    global marketplace. Additionally, even in the United States, one in four people
    are unbanked or underbanked.^([4](#notes.xhtml#chapter3-4)) Data from the World
    Bank reveals this number is much higher worldwide, with about 1.7 billion adults
    being unbanked or underbanked. Unbanked individuals have greater difficulty in
    obtaining essentials such as jobs, housing, education, and health care.


    The Diem Association, associated with Facebook, has pledged to use blockchain
    technology to promote financial inclusion and enable people to store, save, and
    securely move their money instantly with low costs.^([5](#notes.xhtml#chapter3-5))


    Mark Zuckerberg has proposed using the Diem cryptocurrency to alleviate global
    poverty.^([6](#notes.xhtml#chapter3-6)) However, the problem with this approach
    is that most of the unbanked or underbanked do not have enough money even to open
    a bank account. So how does Diem expect them to buy cryptocurrency in the first
    place?


    While technology may indeed alleviate high financial transaction costs, it still
    does not solve the problems of poverty and the restricted access to business capital
    that small businesses and entrepreneurs face.


    One cause of poverty is lack of access to banking facilities. Another is a lack
    of legal ownership of property. Many who live in poverty actually own houses,
    land, crops, and businesses, but lack deeds or documentation to represent proof
    of ownership or incorporation.^([7](#notes.xhtml#chapter3-7)) Blockchain-based
    land registries could give many of the world’s poorest people their first real
    asset.^([8](#notes.xhtml#chapter3-8)) Registered property rights would enable
    these people to access new forms of collateral, credit, and even foreign investments.


    Distributed ledger technology is a peer- to-peer network of decentralized and
    shared digital data; it’s basically the opposite of a centralized database. The
    following opportunities exist for distributed ledger technology to foster growth
    and revolutionize the microfinance industry:


    1.  Offer a new and innovative way of verifying a borrower’s identity.


    2.  Create shared and trusted credit histories.


    3.  Enable the sharing and maintenance of sensitive data in more secure ways.


    4.  Allow for cheaper and quicker flows of capital to and from borrowers.^([9](#notes.xhtml#chapter3-9))


    In the next chapter, I will explain why we must rethink money. I will describe
    how minting our own currency can provide more investment opportunities for small
    businesses and ultimately create healthier economic communities.


    # 04 Why We Ought to Rethink Money


    This chapter explores why it is necessary to rethink money. It brings to light
    the problems surrounding traditional fiat currencies, such as hyperinflation and
    an overpowerful central government, by using specific countries as case studies.
    “Social currencies” such as the Brixton pound and Colu are also introduced to
    validate how money as a community construct can solve the dilemmas posed by traditional
    fiats. Bitcoin is presented as a case study, since it is the most common cryptocurrency.
    There are of course many other cryptocurrencies, such as Akoin, a new cryptocurrency
    being developed by hip-hop artist Akon to empower rising entrepreneurs in Africa
    and power his projected city in Senegal. The chapter also discusses how the American
    dollar became the world’s strongest currency.


    ## Centralized Government


    The chapter below entitled “Social Constructs and the Origins of Morality” will
    discuss how parties voluntarily enter into a contract. There are typically terms
    of engagement governing contract-based transactions, which include information
    regarding party rights and responsibilities. Unfortunately, not every party can
    be trusted, and this lack of trust often makes a power structure necessary to
    enforce the terms of a contract.


    The centralized authority establishes fiat, which operates based on coercive as
    opposed to voluntary market relationships. Authority virtually monopolizes the
    exchange of value by seeking to eliminate or at least regulate alternative currencies.


    The case of Venezuela reveals what might be the most dangerous flaw of government
    fiat currencies: they make it easy for incompetent or corrupt leaders to loot
    the nation’s wealth. All the authorities need to do is to print more currency.^([1](#notes.xhtml#chapter4-1))
    The powerless citizen has no choice but to accept the devalued paper money.


    Ordinary people are at the mercy of this terrible system, because they cannot
    spend the worthless paper money beyond the nation’s borders. Nor do they have
    a suitable means of moving cash outside the country, because nobody else accepts
    their national paper.


    Another example illustrating the problems of centralized governments controlling
    fiat occurred on November 8, 2016. On this day, India’s prime minister, Narendra
    Modi, declared 86 percent of the cash in his country to be worthless. Modi went
    on television and told the Indian people that their two most substantial bills,
    the 500 ($7.50, or £5.40) and 1,000 ($15.00 or £10.81) rupee notes, were, from
    that moment, worthless.^([2](#notes.xhtml#chapter4-2)) In a moment, Modi showed
    the world that the national fiat currency’s buying power could be instantly destroyed
    or taken away.


    The most outspoken foe of cryptocurrency, former International Monetary Fund (IMF)
    chief economist Kenneth S. Rogoff, is also a critic of government-issued fiat.
    Rogoff, a professor of public policy at Harvard, recommends that governments abolish
    paper money altogether. Rogoff accuses the world’s central banks of promoting
    the black market by profiting from the sale of paper bills and depriving legitimate
    enterprise of cash.^([3](#notes.xhtml#chapter4-3))


    Although Rogoff denounced Bitcoin (BTC) as “Crypto Fool’s Gold” in a *Project
    Syndicate* column, he thinks present-day fiat currencies are worse. Rogoff believes
    that governments will eventually replace fiat with national cryptocurrencies.^([4](#notes.xhtml#chapter4-4))
    He predicts that governments will merely take over cryptocurrency. Historically,
    banks printed paper currencies, but ultimately governments took over the process
    because they were the national ruling entity.


    Fiat currency operations allow those who arbitrarily control the currency to redistribute
    purchasing power, and consequently wealth, by altering the availability, quantity,
    and distribution of money.


    ## Crime and Counterfeiting


    The counterfeiting of currencies is a significant threat to national economies,
    as it represents a financial loss to its citizens. Counterfeited currencies reduce
    the value of fiat, thereby causing inflation through an unauthorized artificial
    increase in the money supply. Counterfeit currency also undermines trust in the
    official currency, which results in losses for traders, because banks do not reimburse
    them for confiscated counterfeit money when this is detected.^([5](#notes.xhtml#chapter4-5))


    Even legitimate paper currency can be subject to abuse by criminals. Rogoff notes
    that the $100 bill makes up 80 percent of the American money supply; it is also
    the favorite medium of exchange for the world’s criminals.^([6](#notes.xhtml#chapter4-6))
    He argues that the main purpose served by cash is to facilitate crime and economic
    activity in the underground economy.


    In a 2016 interview, Rogoff mentions that when the Swedish government lowered
    the amount of cash in circulation, this resulted in a significant reduction in
    the number of bank robberies.^([7](#notes.xhtml#chapter4-7)) Ironically, critics
    claim that Bitcoin and other cryptocurrencies benefit criminals, when the reality
    is that criminals are far more likely to use cash.


    ## Remittances in Fiat Currency'
