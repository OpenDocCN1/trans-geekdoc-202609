  trans: '

    在 1642–51 年的英国内战期间，金银匠的保险箱是珠宝、贵金属和硬币等贵重资产的安全存放地。业主随后可以使用金银匠开具的收据从金银匠处取回资产，或将其作为支付能力的证据。这些收据有效地充当了真实价值的存储物，并最终被视为一种货币。大约在
    1660 年，这些收据发展成了银行券。金银匠向另一位客户支付资金的指令成为了银行支票的基础。


    金银匠开始出借其存款人的黄金，仅在准备金中保留极小部分的库存，开启了准备金银行业务的开端。如果所有存款人同时来到金银匠处取回黄金，他将无法进行支付。在这种情况下，收据将不再具有其所代表的黄金价值，而仅取决于金银匠能够支付的金额。


    与标准硬币不同，纸币没有内在价值，但最初它代表了某种“对价值的索赔”，通常以银或金等贵金属计价。在英国，纸币最初由银支撑，但在 1816 年，金本位制出现了。


    最终，纸币变得如此流行，以至于受到管理机构的监管。在美国，这种法币（无抵押货币）由联邦政府、某些州甚至像本杰明·富兰克林这样的个人自由打印。


    法币的权力直接取决于统治当局（政府）保证其价值的能力。对法币的信任实际上意味着对控制其供应并保证其价值的政府的信任——简而言之，是对国家稳定和经济实力的信任。


    ![图 07-01。准备金银行流程。](img/img-92.jpg)


    图 07-01。准备金银行流程。


    由于全球通货膨胀不断，美国于 1973 年放弃了与黄金的联系。在英国银行券上，由英格兰银行首席出纳员签署的声明写道：“我承诺要求向持票人支付五英镑金额。”此前，银行券在英国及许多其他国家被视为对货币的索赔。相比之下，根据前联邦储备银行副主席约翰·克斯特（John
    Exter）的话，美元已变成了一张“空头借条”。整个系统建立在对美国稳定性和经济实力以及财政部提供现金能力的信心之上。如果我们共同决定将储蓄账户和支票账户转换为现金，整个系统将会崩塌，每个人都会破产。


    在没有金本位制的情况下，货币主要是一个信仰问题，这引发了关于对什么以及对谁产生信任的问题。社会信任商业银行通过准备金制度创造的资金的首要原因是，这些资金可以与政府中央银行创造的货币一对一兑换。政府通常保证其货币的价值；在美国，这一限额为
    `$250,000`，在欧元区为 1,000 欧元，在英国为 `£75,000`。


    ## 流动性注入


    美国联邦储备体系（美国的中央银行）可能是世界上最有影响力的经济机构。


    想象这样一个场景：美国财政部打印了 `$100 亿` 的新钞票；联邦储备银行变出 `$900 亿` 的新美元余额并将其记入主要银行。虽然经济接收了 `$1000
    亿` 的货币流入，但这仅占实际货币创造的极小比例。


    真正的货币创造是通过准备金银行体系实现的，银行将这些新余额贷给更广泛的经济。在这个系统中，银行被要求维持在 3% 到 10% 之间的法定强制准备金率，但它们可以贷出更多的资金。最初的
    `$1000 亿` 银行准备金可能会导致名义货币增加 `$1 万亿`。信贷市场本质上是货币分配的渠道。


    2020 年 3 月，联邦储备委员会宣布将所有存款级的准备金要求降至零%。这正值新冠肺炎继续影响金融机构运作方式之际。


    由于没有金本位制，货币主要是一个信仰问题，这引发了对什么以及对谁产生信任的问题。社会信任商业银行通过准备金制度创造的资金的首要原因是，它们可以与政府中央银行创造的货币一对一兑换。政府通常保证其货币的价值；在美国，这一限额为
    `$250,000`，在欧元区为 1,000 欧元，在英国为 `£75,000`。


    ## 什么是加密货币？


    加密货币是一种使用区块链和加密技术安全处理和验证交易的数字货币。加密货币可以作为国际交换媒介，与法币不同，它没有中央银行或机构控制。相反，它存储在区块链数据库中，除非满足特定条件，否则无人能操纵。


    ## 加密货币的优点


    任何人都可以获得加密货币，尽管目前的流程看起来很复杂。尽管如此，它让全球的人可以通过在线转账进行互动。


    快速结算是加密货币的另一个关键特征。与任何现有的电子货币结算系统不同，货币结算可以立即完成。许多加密货币的交易费用很低，考虑到国际汇款通常产生的昂贵费用，这非常有吸引力。


    ## 加密货币的缺点


    加密货币面临的最大障碍是对其使用的缺乏认知。因此，许多国家的金融监管机构没有花时间理解它们。相反，像中国这样的国家已经完全禁止了它们。


    加密货币交易一旦执行就无法撤销，这被一些人认为是有问题的。如果发生了错误的交易，唯一的是要求接收方退款。接收方可能会拒绝退款请求，导致发送方无计可用。


    加密货币的价值频繁波动，因此加密币具有高波动性。这在理解和使用方面都是一个复杂的因素。

    '
