- raw: 'In this chapter, I briefly discuss social constructs. I propose an architecture
    for social constructs and introduce some theories for how they are created. The
    chapter will continue by presenting how fiat is an implementation of a social
    contract. I will also show how fiat as a construct was deconstructed to create
    the popular cryptocurrency known as Bitcoin.


    The government’s central bank plays a crucial role in creating money and manages
    its supply in the economy. I will also talk about how the banking system uses
    fractional reserve banking to “create money out of thin air.”


    ## Chapter 7: The Exchange of Value: A Brief History of Trade


    This chapter outlines how bartering emerged as a new trade mechanism for exchanging
    value, namely goods and services. The use of money arose out of the culture of
    bartering, but not primarily for economic reasons, as one might imagine. Bartering,
    however, had its disadvantages, and I willjuxtapose it against the necessity for
    money as a standard unit of measure for the exchange of value.


    This chapter traces the history of money, including standardized coins, banker’s
    notes, fiat, and finally, modern-day cryptocurrency. The genesis of money was
    motivated by sociocultural and often religious forces. Additionally, the chapter
    will present some examples of how bartering has made its way into blockchain technology.


    The chapter will delve deeper into the controversial and polarizing idea that
    the central bank can frivolously create money, which it then distributes to wealthy
    bankers. The chapter will end with a comparison of the advantages and disadvantages
    of fiat versus cryptocurrency.


    ## Chapter 8: Blockchain Primers


    This chapter presents blockchain as a solution to a specific predicament known
    as the Byzantine Generals Problem. The resolution was ultimately crystallized
    into blockchain technology and consequently the world’s first cryptocurrency,
    Bitcoin.


    I will outline blockchain technology’s strengths and weaknesses and its potential
    to disrupt many industries, including fintech and supply chains. The primary use
    case of blockchain is provenance, namely its ability to demonstrate whether tampering
    has occurred with a digital record. Additionally, I will describe how blockchain
    achieves record immutability with its decentralized and distributed framework.


    The Internet emerged as a medium for the exchange of computer bits and bytes.
    Analysts widely herald blockchain as the medium for the exchange of value—the
    Internet of value. A new era of distributed applications (DApps) has emerged,
    known as *smart contracts:* digital agreements between parties executed as software
    code.


    The chapter will also touch on blockchain’s history, its enigmatic founder Satoshi
    Nakomoto, and the socially constructed proof of work and consensus algorithms
    he developed.


    Finally, the chapter details some of the disadvantages of government- regulated
    currency, known as fiat, and its devastating impact in impoverishing communities
    worldwide.


    An authoritative power structure is necessary to regulate the exchange of value
    between inherently trustless parties. Unfortunately, as the saying goes, power
    corrupts, and absolute power corrupts absolutely. Blockchain technology, however,
    is also susceptible to potential manipulation for the purpose of fiscal oppression.


    ## Chapter 9: The Intersection of Blockchain, Bartering, and Cryptocurrency


    This chapter outlines how blockchain technologies can be the ideal platform for
    the intersection of investment finance, cryptocurrency, and bartering.


    Crypto tokens can act as a standard unit of measure for the exchange of value
    as an alternative to government-controlled fiat.


    Blockchain technologies provide innovative ways for businesses to raise venture
    capital, including the comprehensive security token offerings (STOs) instituted
    and regulated by the U.S. government.


    The chapter will also examine the differences between asset tokens, utility tokens,
    and currencies, and show how the Token Taxonomy Initiative (TTI) will provide
    a universal framework for the instantiation of tokens.


    Blockchain is transforming microfinancing programs and making capital more accessible
    by making credit reporting less restrictive for applicants and by lowering interest
    rates. The chapter will explain how blockchain handles identity management and
    the idea of decentralized data with personal identity hubs. Finally, the chapter
    will present the difference between private permissioned and public permissioned
    blockchain ledger.


    ## Chapter 10: Cryptocurrency and Government Regulation


    This chapter will discuss current government regulations of cryptocurrency in
    addition to predictions about future regulation in the United States and Europe.
    I will present some of the steps taken by certain regulatory bodies, such as the
    Securities and Exchange Commission (SEC) and the Commodities Futures Trading Commission
    (CFTC) to regulate the fast-growing area of cryptocurrency and blockchain tokens
    in general.


    Governments around the world are acting fast to leverage blockchain technologies
    for statutory purposes, and there is a new breed of digital coins emerging, referred
    to as Govcoins, or central bank digital currency (CDBC).


    As a case study, I will present a high-level view of the progress China is making
    with its own Govcoin debut called the digital yuan.


    ## Chapter 11: Regulatory Concerns for Blockchain Technologies


    This chapter will address some of the technical and regulatory concerns and authorities
    involved in implementing blockchain-based tokens. I will outline a few of the
    primary use cases, such as real estate and fintech transactions and some of the
    leading cryptocurrency projects, including Ripple and Meta’s Diem.


    I will continue with a brief discussion of some regulatory matters, including
    data privacy, security, cryptocurrency regulation, and taxation. I will also give
    a high-level overview of the role of various U.S. organizations, such as the Security
    and Exchange Commission (SEC), Federal Trade Commission (FTC), the Financial Crimes
    Enforcement Network (FinCEN), and the Financial Action Task Force (FATF).


    The chapter proceeds to present a deeper dive into smart contracts, primarily
    on Ethereum, the leading blockchain platform for smart contracts. I will introduce
    plans for the Enterprise Ethereum Alliance’s (EEA) Token Taxonomy Framework (TTF).


    ## Chapter 12: A Technology Proposal for the Alleviation of Poverty


    In this chapter, I will describe my proposed technology to alleviate poverty through
    a simple use case scenario. The scenario reveals that my technology proposal is
    a revolutionary new exchange medium known as the Social Marketplace.


    The Social Marketplace allows individuals to sell products and services for an
    internal marketplace currency, known as Social Currency, or other products and
    services listed on the marketplace.


    This new exchange method empowers individuals by providing them with a standard
    unit of measure and reintroducing traditional trade and bartering techniques.


    ## Chapter 13: Introduction to Decentralized Finance


    Decentralized finance (DeFi) is an experimental form of finance. It does not use
    traditional centralized financial intermediaries, like banks, brokerages, and
    exchanges, to offer financial instruments. Instead it utilizes a modern, transparent
    approach provided by smart contracts on the blockchain.


    In this chapter, I will present a high-level overview of DeFi as a global and
    open-source financial platform encompassing a wide variety of applications. Typical
    DeFi use cases include open lending platforms, stablecoins, decentralized exchanges,
    synthetic asset issuance, yield farming, staking and arbitrage.'
