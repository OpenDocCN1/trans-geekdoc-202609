    ## 2. Stablecoins


    Stablecoins, as we have seen, are a type of digital asset that helps to maintain
    price stability by reducing volatility. This is done by fixing their value to
    other assets such as gold or fiat currencies (the euro, the U.S. dollar). Stablecoins
    can also be pegged to mixed assets, like Facebook’s proposed stablecoin, `Diem`.


    Stablecoins are an integral part of DeFi. Because they provide high stability
    and increased chances of remaining liquid, they are extremely popular among borrowers,
    lenders, and traders.


    ## 3. Decentralized Exchanges


    Platforms for digital trading assets within decentralized finance are known as
    decentralized exchanges (`DEXs`). There are two ways in which `DEXs` operate—
    either by allowing traders to fix their order prices through a `bid/ ask` system
    or using simple mathematics to set the price of tokens within a liquidity pool
    through automatic market makers such as `Curve` or `Uniswap`.


    ## 4. Synthetic asset issuance


    A complex use case is synthetic asset issuance, in which a digital asset token
    is designed to mimic other assets’ properties. Like traditional financial derivatives,
    which derive their value from other underlying assets, like commodities, currencies,
    precious metals, stocks, or bonds, synthetic assets aim to achieve the same objectives
    without the necessity of holding the actual asset itself. Crypto synthetic assets
    also allow investors to invest in new, emerging crypto commodity classes. Unlike
    derivatives, one unique selling point of crypto synthetics is the potential to
    earn rewards or yield by staking or holding on to an asset for an extended period
    of time.


    ## 5. Yield farming


    With yield farming, also known as liquidity mining, digital assets are locked
    up in exchange for rewards delivered automatically through a smart contract. One
    example is the yield farming launched on the `Jumpstart` platform of `OKEx`, where
    users can mine digital assets by staking `OKB` tokens.


    Yield farming is typically high risk/high reward. If there is a loophole in the
    smart contract, then locked assets would be lost and rendered worthless. Usually,
    yield farming projects will require you to provide liquidity at `DEXs` such as
    `Uniswap` to receive Liquidity Provider (`LP`) tokens, which can then be staked
    to mine digital assets.


    ## 6. Staking


    Staking is usually the first exposure that digital asset holders have to decentralized
    finances, and is one of the simplest use cases of DeFi. Staking allows you to
    delegate digital assets to a validator node in order to hold digital assets inside
    a compatible wallet. Staking helps you earn rewards in exchange for securing the
    blockchains. Some of the most common stackable assets are `Cardano` (`ADA`), `Tezos`
    (`XTZ`), and `Tron` (`TRX`).


    ## 7. Arbitrage


    Crypto arbitrage is the practice of buying and selling different assets or currencies
    between different marketplaces to generating a profit. One classic example of
    arbitrage is vintage clothing. A given set of old clothes might cost $50 at a
    thrift store or an auction. At a vintage boutique or online, fashion-conscious
    customers might pay $500 for the same clothes. Consider the following arbitrage
    example: `TD Bank` (`TD`) trades on both the Toronto Stock Exchange (`TSX`) and
    the New York Stock Exchange (`NYSE`). On a given day, let’s assume the stock trades
    for `C$63.50` on the `TSX` and for `US$47.00` on the `NYSE`. Let’s further assume
    that the exchange rate is `US$1 = C$1.37`, so that `U$47 = C$64.39`. Under this
    set of circumstances, a trader can purchase `TD` shares on the `TSX` for `C$63.50`
    and can simultaneously sell the same security on the `NYSE` for `US$47.00`, which
    is the equivalent of `C$64.39`, ultimately yielding a profit of $0.89 per share
    (`$64.39-$63.50`) for this transaction.


    ## How to Profit from the DeFi Paradigm


    DeFi platforms exist to incentivize the system and deliver liquidity to the DeFi
    space, thereby allowing users to earn a passive income. Unlike `CeFi`, DeFi has
    low entry barriers and supports innovation, which is integral to a platform that
    provides alternative financial services. This is why DeFi is the best choice for
    stablecoin holders who wish to have a steady income. Some DeFi products that are
    income-generating are:


    1. `DEX` (Decentralized Exchanges)

    2. `Staking`

    3. `Liquidity mining`

    4. `Yield farming`

    5. `Arbitrage`


