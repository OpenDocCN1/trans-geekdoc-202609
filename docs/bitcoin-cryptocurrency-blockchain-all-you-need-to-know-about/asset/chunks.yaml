  trans: '


    一些额外的职业位于管理领域。区块链领域的管理可以有两种形式。第一种是担任`marketing manager`（营销经理）。这些人必须有效地向现有用户、潜在新用户以及最重要的是投资者传达创新成果和产品。他们的平均年薪约为
    180,000 美元。第二类经理是`project manager`（项目经理）。他们计划并将项目分配给区块链生产的不同部门。他们的收入低于营销经理，平均薪资为
    100,000 美元.^(7) 由于区块链是一个如此年轻的行业，营销是区块链公司在市场中稳固地位的必然。


    其他职业机会包括成为`blockchain UX designer`（区块链用户设计师）。为区块链服务创建用户界面与为其他互联网服务创建同样。然而，区块链是一项近期技术，其界面必须赢得怀疑者和新用户的信任。这项工作的收入通常超过
    100,000 美元。


    另一个职业选择是成为`blockchain quality engineer`（区块链质量工程师）。需要精通如何处理区块链行业质量保证的高级技术人员来测试开发人员的产品。这些工程师平均年薪为
    100,000 美元到 120,000 美元。


    列表上的最后一个工作是`blockchain legal consultant`（区块链法律顾问）。政府大科技公司特别需要此类顾问。区块链的影响是巨大且不断增长的：例如，它可以消除电子数据传输的国际障碍。此外，寻求进入该领域的公司必须意识到相关的法律限制。因此，这些雇主寻求精通区块链法律的法律顾问。


    某些关键方面使区块链职业具有独特性。在过去的几年里，该领域的工作往往于非常非正式。它们通常是以加密货币支付工资的自由职业工作。如今，该领域的工作更多是在真实的公司中，并以法货币支付。尽管如此，这些工作中的许多仍是在支付加密货币工资的公司工作的。


    虽然开发人员将专攻编码，而经理将专攻营销，但对加密货币世界的所有方面都有通用的了解是非常重要的，包括市场、政治经济环境以及技术进步。该领域的公司正在为新互联网构建未来。紧跟哪家公司最能处理这一责任，将对个人的职业生涯产生巨大推动。


    ## 全情投入：在加密货币领域寻找职业


    许多人将加密货币视为创造财富的迷人且诱人的途径，事实也如此。然而，整个行业都是围绕它建立的，而且才刚刚开始增长（见下页图 02-03）。例如，热门职位搜索网站
    [Indeed.com](https://indeed.com/) 在 2020 年显示了超过 500 个针对加密货币的职位。Cryptocurrency
    Jobs 公司有近 500 家公司正通过其服务寻找员工.^(8)


    在区块链世界之外，加密领域还有许多其他可用工作。精通加密货币领域的金融分析师深受试图进入加密货币市场的传统投资公司的欢迎。这一职业是旧金融世界与未来金融世界之间绝佳的交汇。[Indeed.com](https://indeed.com/)
    上提供的平均年薪为 70,000 美元，这些专业人士深受华尔街大银行的青睐。


    ![图 02-03. 比特币职位增长超过加密货币价格。](img/img-44.jpg)


    图 02-03. 比特币职位增长超过加密货币价格。


    加密领域中另一个涉及交易的职业是新闻写作。正如之前解释过的，市场研究在加密货币交易中至关重要。需要有人为投资者制作这些材料。这些作者平均每篇 500 字的文章赚取
    250 美元，取决于写作质量.^(9)


    在区块链业务内部，有几个职业选择。第一种是担任 machine learning engineer（机器学习工程师）。区块链是完全数字化的，因此需要精通编程的工程师来保护其完整性并防御黑客。这些工程师的年薪在
    60,000 美元到 150,000 美元之间。参见图 02-04 按角色划分的职位比例。新加密货币带有白皮书以吸引投资者。这些白皮书必须由了解加密并知道投资者需求的人士编写。


    ![图 02-04. 按角色划分职位。](img/img-45.jpg)


    图 02-04. 按角色划分职位。


    除了白皮书，加密货币还需要营销。加密货币的营销经理需求很大，因为人们试图在这个新兴行业中取得席。这些加密货币营销职位年薪约为 75,000 美元，是加密货币领域收入最高的职位之一.^(10)
    对于希望在加密货币领域更大作用的人来说，除了交易还有许多丰富的职业选择.^(11)


    ## 为小型企业寻找路径


    虽然区块链技术应该应用于许多行业，但它对小企业的适用性显而易见。小企业面临许多挑战。例如，几乎每个小企业都会面临资金流问题。研究显示，2019-2020 年，超过
    40% 的小企业面临资金流困扰.^(12) 《福布斯》估计，33% 的面临资金流压力的小企业是因为应收款延迟而遇到问题的.^(13) 回款延迟会破坏小企业的稳定性。区块链通过使用智能合约来解决这一问题——合约无需等待供应商即可自动执行。一旦交付完成，资金将自动从供应商转移到企业。


    ![图 02-05. 资金流问题。](img/img-46.jpg)


    图 02-05. 资金流问题。


    小企业面临的另一个问题是网络安全。与能够负担起专门负责安全部门的大公司相比，小企业在保护自己方面要困难得多。统计数据显示，三分之二的小企业遇到过网络安全问题。在英国，小企业在网络安全攻击中估计损失了
    136 亿英镑。区块链通过其固有的去中心化特性解决了这一问题。存储在区块链上的数据可以防御黑客攻击，并防止交易被黑客篡改。


    '
