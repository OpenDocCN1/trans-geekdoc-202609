- raw: 'The first is that it is a *peer- to-peer network.* This means that any information
    sent by one entity to another goes straight to the recipient. This may not seem
    that impressive, but most information sent over the Internet goes through an intermediary,
    be it a bank, network provider, or services provider.


    The second feature is that a blockchain is *decentralized.* This means that no
    one company or institution controls the network or its data.


    The third characteristic of a blockchain is that is *immutable.* Once data has
    been transferred via the blockchain, it cannot be altered. As we have seen, some
    people utilize the blockchain by creating smart contracts on it. Whenever a smart
    contract requires currency, a utility token is used.


    Therefore crypto trading with utility tokens is much more rational, because the
    technological usefulness of the smart contracts plays a major role. The most popular
    and established utility coins tend to utilize smart contracts and decentralized
    applications built on the blockchain. For example, certain utility tokens, such
    as Solara and Cardano, offer smart contract functionality.


    The most notable smart contract blockchain is Ethereum. Founded by Vitalik Buterin
    in 2013, as of July 2021 this blockchain was processing over 1.2 million transactions
    a day, making it the largest smart contract blockchain in the world. Nonfungible
    tokens (NFTs), digital representations of unique artifacts or tokens, first came
    to life on Ethereum. Some have been sold for tens of millions of dollars. These
    are possibly the hottest commodities currently in the blockchain space.


    The only nonutility coin that has the potential to be persistently valuable is
    Bitcoin. This is because Bitcoin was the first cryptocurrency. Although it is
    not tied to a smart contract infrastructure, it has a future in the sense that
    it will always be a collector’s item. Furthermore, the Bitcoin supply has been
    limited to 21 million coins, a number programmed into Bitcoin’s algorithm.


    ## Day Trading, Swing Trading, and Hodling


    No matter what type of cryptocurrency you decide to trade, there are three forms
    of trading that you must understand to become a competent crypto trader (see [Figure
    01-02](#chapter1.xhtml#fig1), and [Figure 01-03](#chapter1.xhtml#fig3)).


    The first, and riskiest, is *day trading.* Day trading is a full- time job, and
    it can be extremely profitable. The issue with crypto day trading is that—just
    as with day trading in stocks—one must understand technical analysis and risk
    management and be quick-thinking. However, the crypto markets are ten times as
    volatile as the stock market.^([6](#notes.xhtml#chapter1-6)) This makes crypto
    day trading much riskier, but can create higher returns. In day trading, traders
    hold coins for a maximum of a few hours, so they must rely mainly on chart analysis
    instead of current events in the coin market. With every trade made using cryptocurrency,
    there is a commission paid to the exchange (this will be explored later in the
    chapter). For a day trader making multiple trades a day, there is a marginal loss
    in profit due to these commissions.


    ![Figure 01-02. Types of Trading.](images/img-27-1.jpg)


    Figure 01-02. Types of Trading.


    ![Figure 01-03. Trading Styles Explained.](images/img-27-2.jpg)


    Figure 01-03. Trading Styles Explained.


    Despite the cons, day trading is a potentially profitable career that can be pursued
    anywhere, but, again, it is highly risky. It can take years to master, but as
    with any lucrative career, the effort may yield dividends.


    The second form of trading is *swing trading.* This involves waiting for a swing
    in the market before buying or selling coins. Swings come in intervals of days
    to weeks, which means only a few hours out of the day are required to focus on
    swing-trading crypto. For those with full-time jobs, swing trading is a more realistic
    alternative to day trading. Making trades off the price swings caused by volatility
    is what defines swing trading. This means there is still some risk involved, although
    far less than with day trading. With swing trading also comes a human inclination
    to sell based on short-term gains. As a result, swing traders occasionally miss
    out on potential long-term gains.


    Regardless, swing trading is a better path into cryptocurrency trading for those
    with existing full-time careers. While cryptocurrency is undoubtedly an exciting
    new space, those who are successful in trading are highly technical, have very
    liquid assets, and are also extremely lucky. Typically, those who were early adopters
    of coins (with a lot of luck) tended to be the big winners. A famous example is
    the Winklevoss twins, who invested $11,000 in Bitcoin in 2011 and by 2017 saw
    their investment grow to over $1 billion. That investment was extremely risky
    but paid off unbelievably.


    Finally, there is *hodling,* an acronym for *holding on for dear life* that was
    first conceived in 2013 from a misspelling of the word *holding.* An Internet
    crypto trader was explaining in a forum post how people are likely to lose money
    in the crypto market if they lacked the expertise of a day trader or the time
    to do dedicated research. The trader had chosen to hold their money in the market
    long enough to see steady growth over time. The misspelling soon earned its own
    meaning: “holding on for dear life.”


    Hodling is the most hands-off approach to crypto trading. After proper research
    into which crypto to invest in, one simply buys a substantial portion and allows
    time to increase its value. While day and swing trading are usually done with
    altcoins, which tend to have more volatility and therefore offer more opportunities
    to capitalize on, hodling is best done with utility coins such as Bitcoin or Ethereum.
    These cryptocurrencies have the best long-term investment potential because they
    are the best-known, and anyone getting into crypto or already in, ought to have
    a some of these coins in their portfolio. Hodling is also much less time consuming,
    much less arduous, and much lighter in terms of paying commissions.


    Despite these positives, there are obviously potential gains that are missed,
    and it requires a lot of patience to achieve satisfactory returns.


    ## Steps to Making the First Investment


    To get started with cryptocurrency trading, one must register with an exchange
    in order to purchase coins. When deciding which exchange to choose, there are
    four aspects to pay attention to: transaction fees, the variety of currencies
    available, the volume of transactions, and whether they provide a wallet to store
    the coins.


    In terms of these criteria, one of the most widely used exchanges overall is Coinbase.
    This platform offers a wallet, is very accessible, and has high liquidity. The
    interface is easy to navigate, and it can process over $9 billion in a day.^([7](#notes.xhtml#chapter1-7))
    Coinbase meets the needs of most beginning and experienced traders: 56 million
    users are trading over $300 billion worth of cryptocurrency on Coinbase each quarter.
    It has the third- highest trade volume of all exchanges, according to crypto data
    firm CoinMarketCap. Transaction fees range from $0.99 to $2.99 or up to 0.5 percent
    on Coinbase’s more advanced exchange, Coinbase Pro.^([8](#notes.xhtml#chapter1-8))'
