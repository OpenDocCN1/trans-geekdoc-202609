- raw: '## Data Regulatory Compliance


    Many companies today operate in more than one country, and thus face multiple
    regulatory regimes.^([5](#notes.xhtml#bm1-5)) For government or industry regulatory
    compliance, or e-discovery, organizations may have to prove to auditors or the
    courts that there has been no malicious or negligent corruption of digital records,
    workflows, and logs.


    ## Business Efficiencies


    Reconciling transactions across individual and private ledgers takes a lot of
    time and is prone to errors. Distributed records management systems involving
    multiple parties are experiencing slow processing, high costs, and high risk of
    errors, and the result is often unreliable and inconsistent data.


    Digital signature technologies come at a high cost, and the certificates are difficult
    to acquire.^([6](#notes.xhtml#bm1-6)) Additionally, there’s also uncertainty around
    the impartiality of the third-party provider.


    Moreover, this is the era of smart contracts, transactional elements of a legal
    agreement executing as code on the blockchain. How do we reconcile the smart contract
    with the corresponding digital contract records? As the industry moves toward
    the implementation of smart contracts, contract professionals (such as lawyers
    and auditors) may need to be able to read and decipher them, or even learn how
    to write them.


    ## The Solution


    Blockchain provides a trusted, independent, and cost-efficient mechanism for multiparty
    transactional records management. There are inherent problems with the public
    distributed ledger technology (DLT), particularly around the pseudonymity of the
    parties’ identities, as well as privacy and confidentiality. We can leverage additional
    enterprise tech nologies to mitigate this. I’ll cover this in the solution architecture
    (see Figure Appendix-03).


    Blockchain stores a cryptographic hash of the data, workflow processes, and signatures
    for each record, rendering them effectively immutable, more valid, more authentic,
    and more reliable. Blockchain is appealing to auditors and litigators, because
    it effectively certifies corrupt-free data as proof or record.


    Blockchain technology could also be used to verify the workflow steps that a record
    went through during its creation and management. The technology can create a cryptographic
    hash of each step, effectively creating an immutable proof of process for the
    record.


    ![Figure Appendix-03. Blockchain extends records management.](images/img-214.jpg)


    Figure Appendix-03. Blockchain extends records management.


    Blockchain is an essential technology for records management professionals to
    understand, because it has broad implications for securing and authenticating
    intellectual property at a lower cost and higher efficiency. A records repository
    can store any digital object, including audio, video, or even software. A cryptographic
    hash of the record can be storedon the blockchain, together with a timestamp,
    serving effectively as proof of copyright.


    Blockchain also provides for an advantage over legacy centralized digital signature
    technologies. The signatures, fingerprints, and timestamps created for authentication
    purposes are stored on the distributed ledger, providing proof of data integrity
    and authenticity without the need of a third party.


    ## Scenario


    This is a simple workflow that describes how the proposed solution architecture
    can be leveraged to synchronize the smart contract with the contract records for
    multiple parties.


    1.  Ann uploads a contract record into the records management repository (essentially
    a document library) and generates a URL hyperlink for the document.


    2.  Ann digitally signs the contract, using a blockchain application programming
    interface (API) and generates a unique cryptographic hash for the document.


    3.  Ann configures a workflow as the contract proposer and configures Bob as the
    reviewer.


    4.  When Ann clicks “Save,” a smart contract proposal is created on the permissioned
    distributed ledger. She includes as properties the cryptographic hash and document
    URL as unique references.


    5.  Bob receives an email notification with a link to review the contract record.
    Bob is prompted to accept or reject the contract proposal.


    6.  Bob accepts the contract proposal and is redirected to sign the contract record.


    7.  After signing the contract record, the original smart contract is archived,
    and a new fully executed contract is created on the dis tributed ledger, with
    the two parties having entered voluntarily into the contract.


    8.  The smart contract is now synchronized with the contract record, joined by
    a reference to the hash and the document URL.


    ## Solution Architecture


    The architectural components:


    1.  Smart contract workflow functionality blockchain permissioned distributed
    ledger.


    2.  Smart contract application functionality (software as a service, or SAS).


    3.  Enterprise records management portal (SharePoint online or on-premise).


    ## Smart Contract Workflow Functionality


    Ideally, workflow would be governed using a smart contract language for modeling
    rights and obligations for multiparty processes in any business, providing high
    integrity and privacy guarantees. The smart contracts would encode the rights
    of the parties as choices that they can exercise, and obligations as agreements
    that they agree to.


    A permissionless distributed ledger technology conducts transactions pseudonymously.
    The identities of parties can be hard to establish. Regulatory compliance dictates
    that parties to a transaction be identifiable. The smart contract workflow functionality
    provides for a permissioned ledger, reinforcing the essential properties of a
    smart contract:


    1.  Proof of rights and obligations


    2.  Confidential execution


    3.  Evidentiary trail


    4.  Formal verifiability


    The smart contract programming language should be intuitive and support formal
    methods for catching design-time errors. The language should also be accessible
    enough for lawyers and contract professionals to at least understand, if not write.


    The solution architecture will ultimately be a next-generation, secure, transparent,
    and regulatory-compliant infrastructure, synchronizing the records, workflow processes,
    and signatures for the smart contract and contract records for multiple parties
    to a transaction.


    # Endnotes


    ## Chapter 1. Cryptocurrency and the Origins of Wealth


    1.  [  1](#chapter1.xhtml#chapter1_1). White, William. “Dogecoin Prices: How Much
    You’d Have if You Bought $1K DOGE One Year Ago Today.” Yahoo! Finance, Updated
    April 16, 2021, Accessed March 28, 2022.


    2.  [  2](#chapter1.xhtml#chapter1_2). Shalvey, Kevin. “Shiba Inu Coin Investment
    Turned New York Brothers into Multimillionaires a Few Months after They Bet $8,000
    on the ‘Parody’ Cryptocurrency, Reports Say.” Business Insider, Updated May 15,
    2021, Accessed March 28, 2022.


    3.  [  3](#chapter1.xhtml#chapter1_3). “Cryptocurrency Bubble.” Wikipedia, Updated
    December 5, 2021, Accessed Mar 28, 2022.


    4.  [  4](#chapter1.xhtml#chapter1_4). Lawrence, Meyers. “Trading Bitcoin is Like
    Gambling in Vegas … but with Worse Odds.” CCN, Updated September 7, 2019, Accessed
    March 28, 2022.


    5.  [  5](#chapter1.xhtml#chapter1_5). Sriram Samyuktha. “Around 100 People Control
    Doge’s Entire $46B Market: Report.” Yahoo, Updated April 19, 2021, Accessed March
    28, 2022.


    6.  [  6](#chapter1.xhtml#chapter1_6). “Crypto Day Trading vs Swing Trading vs
    Hodling: Pros & Cons.” Cryptolad, Updated July 7, 2021, Accessed March 28, 2022.


    7.  [  7](#chapter1.xhtml#chapter1_7). Curry, David. “COINBASE Revenue and Usage
    Statistics (2022).” Business of Apps, Updated January 11, 2022, Accessed March
    28, 2022.


    8.  [  8](#chapter1.xhtml#chapter1_8). Lielacher, Alex. “Best Crypto Exchanges.”
    Investopedia, Updated March 28, 2022, Accessed March 28, 2022.'
