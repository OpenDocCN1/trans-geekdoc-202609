  trans: '


    最近最显著的例子是特斯拉和 SpaceX 首席官埃隆·马斯克登上了美国深夜节目《周六夜现场》。在节目之前的几个月，马斯克就已经在社交媒体上公开讨论加密货币，特别是
    `Dogecoin`（狗狗币）。在节目播出前的一个月里，`Dogecoin` 的价格稳步上涨，涨幅超过 600%。这主要是因为人们预期马斯克会在国家舞台上提到这种加密货币。


    然而，粉丝和投机者都错错了。马斯克在节目的一个小品中对这种加密货币开了玩笑，导致交易者陷入疯狂。`Dogecoin` 的价值随后下跌了近 30%。热门股票和加密交易所
    `Robinhood` 交易量巨大，导致平台在恐慌期间崩溃。^(16)


    尽管大多数人同意这些影响者的力量是不公平的，且不应出现在加密交易中，但到目前这是一个现实。关注加密货币领域声音最大的群体，并关注他们在写什么说什么，是保护个人投资组合整体策略的重要部分。


    ## 是时候交易了：选择一种货币


    在获取了关于加密交易、其组成部分以及如何操作的充分背景信息后，终于到了选择一种加密货币进行投资的时候。寻找具有投资价值的加密货币非常有用的资源是 [Messari.io](https://messari.io/)。^(17)
    该数据库拥有顶级加密分析师对各种加密货币、区块链、智能合约应用等的定价、数据和研究。`Messari` 提供了其网站涵盖的所有加密货币的价格、市值和供应量。所有这些信息都是为了帮助寻找加密货币投资的交易者。对于想要投资实用代币的交易者，`Messari`
    提供了许多关于某些区块链排名的指标。


    ## 需要更多指导？这将有所帮助


    虽然本章深入探讨了加密货币的所有方面，但对于任何人来说，即使是具有相当背景知识的人，迈出投资一步仍然可能是困难的。对于这些人，有一些课程可以提供帮助。`Investopedia`
    研究了针对新手、寻求更多见解的高级交易者、希望在加密货币中扮演更被动角色的人以及预算有限交易者的最佳课程。这些课程可以在 `Udemy` 和 `LinkedIn
    Learning` 等平台上获得。这两个网站都非常平易近人且易于导航。加州大学伯克利分校的`哈斯商学院`有一门关于实施区块链技术的精彩课程，专为进入商业领域的人士设计。网上有很多资源可以协助加密交易的过程。


    # 02 职业与商业机会


    本章的目标是回顾与加密货币和区块链创新技术相关的不同职业。它将讨论这些领域中最利润丰厚的职业以及入行流程。


    `Microsoft` 和 `Facebook` 等公司正在参与加密货币和区块链，创造新的工作机会并利用这项技术。对于对创业感兴趣的人，本章还将探索小企业的潜在机会。


    除了职业选择外，本章还将探索加密货币挖掘的复杂性。随着加密货币加密的增长，挖掘方法正在接受审查和批判，很快可能会看到变化。


    ## 区块链职业：丰厚吗？


    区块链工作需求很大，凭借正确的技能组合，雇主就能保证提供丰厚的薪水。大多数区块链专家年薪超过六位数。


    截至 2021 年 8 月，通过 `Burning Glass`^(1) 的分析（该机构收集并分析了全美数百万个职位发布）预测，区块链相关工作的需求在未来十年内将增长
    24.6%。在流行的自由职业网站 `UpWork.com` 上，区块链技能位列增长最快的需求技能第一，比 2010 年增长了 6000%。全球区块链市场规模目前约为
    30 亿美元，预计到 2025 年将达到近 400 亿美元。^(2) 这表明这是一个蓬勃的市场，复合年增长率接近 70%。这是由于区块链能够渗透到许多业务领域。得于该领域金融与技术的交汇，加密货币专家也需求很大。


    本节将深入探讨从事区块链工作所需的专业知识。必须理解，人们不能轻易进入区块链职业。然而，为该领域的职业做准备的手段是随处可见。区块链是一项高度创新的技术，是一个专家预计将渗透到许多业务领域的行业。因此，它需要愿意跳出思维框架的人才。


    区块链不仅仅是一个职业路径。区块链和加密货币的整个基础都围绕挑战当前的业务模式。除了对学习和成功的投入外，该领域的职业还要求员工相信区块链的愿景。虽然区块链的未来非常大阔可锦，但过去一年对它至关重要。


    银行、科技公司、初创公司甚至政府都在寻找区块链专家。与区块链相关的声誉最高的职位是`blockchain developer`（区块链开发者）。这些人能够设计和编写区块链以及智能合约的人。根据
    `Blockchain Academy`，截至 2021 年 4 月，全球对区块链开发者的需求每年增长 300-500%。因此，每个想要进入该领域的公司都在寻找开发人员团队。区块链开发者的平均工资在
    150,000 美到 170,000 美之间。^(3) 在纽约市和旧金山工作的开发者年薪接近 200,000 美。他们通常拥有计算机科学或数学学位，并且是高技能的程序员。真正构建区块链的开发者必须专攻
    `Solidity` 或 `C++`（参见图 02-02），而制作去中心化应用的开发者必须精通 `Solidity` 等智能合约语言。^(4)


    ![图 02-01. 区块链职业。](img/img-41a.jpg)


    图 02-01. 区块链职业。


    ![图 02-02. 区块链语言](img/img-41b.jpg)


    图 02-02. 区块链语言


    第二个利润区块链职业是担任 `blockchain data scientist`（区块链数据科学家）。数据科学已经是增长最快的专业之一，结合区块链专长，吸引了高需求和高薪。^(5)区块链数据科学家的平均工资在
    170,000 美到 180,000 美之间。区块链数据科学家的日常工作包括分析区块链并将其呈现为统计表示。这些人精通区块链的技术细节，并且必须具有编码经验。^(6)


