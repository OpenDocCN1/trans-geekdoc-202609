    4. 随着越来越多的人开始使用 DeFi 平台，一些特定的平台相关问题，如网络拥塞、交易成本和时间问题，随着时间的推移会导致问题。


    # 2021 年顶级 DeFi 趋势


    考虑到一些关键障碍，必须记住 DeFi 仍然是一个不断发展的领域，人们正在进行研究以克服可能存在的局限性。目前，DeFi 更像是一个实验性空间，而不是运行中的专业金融系统。因此，你可以预期新趋势频繁出现。以下是你在近期应该关注的一些顶级
    DeFi 趋势。


    1. 流动性挖掘，也称为收益农（yield farming）。该方案旨在解决 DeFi 面临的流动性低的问题。

    2. 根据 Chainalysis 的数据，尽管 2021 年 8 月活跃加密货币交易所的数量从 2020 年 8 月的 845 个下降到 672 个，但自
    2019 年以来，活跃去中心化交易所（DEX）的数量大幅增加。

    3. 随着 `Ethereum 2.0` 的发布，代币化和互操作性将得到增强。

    4. `Ethereum`（以太坊）和 `Stablecoins`（稳定币）预计将继续指数级增长。Coin Quora 认为，如果 `Ethereum` 能保持其通用的看涨轨迹，到
    2022 年底它可以达到 6,500 美元，甚至 7,000 美元。他们认为 2023 年将会有类似的增长到 9,500 美元，并设定了 2025 年 20,000
    美元的远大目标。


    # DeFi 对比 CeFi：优缺点


    DeFi 的市值每年都在迅速增长。根据 CoinGecko 的数据，DeFi 代币的总市值在 2021 年 10 月 26 日突破了其 5 月 1500 亿美元的历史高点。然而，让我们花时间看看
    DeFi 是否符合金融系统的要求。去中心化金融可以产生高回报，但你需要理解风险。DeFi 的优缺点是什么？


    以下是 DeFi 的热门应用：


    1. 去中心化交易所允许交易代币、加密货币和其他资产，而无需中介机构。

    2. DeFi 简化了贷款流程，不再依赖信用评分。贷款者获得利息，而借者可以使用抵押品并轻松借贷，不受任何其他限制性法规的影响。

    3. 创新 DeFi 协议之一是无损（lossless）彩票系统，它允许参与者购买彩票并有机会获得奖励。关键在于，他们的初始资金永远不会丢失，并且他们可以继续参与未来的抽奖！

    4. NFT 可用于验证数字资产（如艺术品、录音和虚拟房地产或宠物）的所有权，因为每个 NFT 都是独特的。


    ## DeFi 的优点


    DeFi 在上述应用场景中运行良好，是因为其高度高效的实现，消除了对中介机构的依赖。以下是 DeFi 的一些优势：


    1. 减少人为错误和管理不当。`Smart contracts`（智能合约）和 DeFi 完全数字化的流程最大限地减少了金融程序中的人为错误和管理不当。

    2. 永久且快速的访问。世界上很大一部分仍然没有银行账户，并且发现正确实施唯一身份系统具有挑战。DeFi 可以帮助消除传统银行系统的限制，让人们只需点击一下即可获得贷款，并随时随地访问市场。

    3. 无许可操作。中心化金融系统中的每项操作和金融交易都由几个阶段的批准和严格流程组成。DeFi 简化了这一切，并实现了快速且安全的无许可操作。

    4. 消除了直接接触的需求。卖家和买家可以在不知道对方身份的情况下进行安全交易。DeFi 可以消除物理接触的需求，并缓解全球封锁和移动性限制引起的问题，正如
    COVID-19 疫情期间经历的那样。

    5. 更好的安全性。CeFi 可以克服的一个局限性之一是托管问题。如果平台流动性高，CeFi 往往容易成为黑客的攻击目标。作为一个完全去中心化的平台，DeFi
    遵循 `Not your keys, not your coin.`（非你的密钥，非你的币）。换句话说，在去中心化系统中，你的资金被破解的可能性显著降低。


    ## DeFi 的缺点


    虽然 DeFi 为中心化金融系统提供了一个兴奋的替代方案，但它仍然需要克服特定的障碍，以便在所有市场被广泛采用。DeFi 仍然是一项不断增长的技术，对其存在一些怀疑。以下是你需要注意的一些缺点：


    1. 可扩展性。底层区块链技术的可扩展性可能会引发对 DeFi 解决方案整体可扩展性的担忧。随着 DeFi 交易数量的增加，网络性能问题可能会激增。

    2. 永久合约。`Smart contracts` 是永久的，一旦交易完成，就无法撤销。智能合约上的任何缺陷或欺诈活动都会导致资金的永久损失。

    3. 流动性低。目前所有的 DeFi 项目都面临流动性低的问题。

    4. 过度抵押。当借者质押资产的价值超过贷款金额时，就会发生过度抵押。DeFi 领域必须解决过度抵押问题，以避免损害其金融服务真正普及的潜力。

    5. 缺乏互操作性。各种区块链实现之间（如 `Bitcoin`、`Ethereum`、`Binance smart chain` 等）的互操作性较低。

    6. 保险。在 2021 年，DeFi 领域因攻击或利用遭受了超过 1.2 亿美元的盗窃，仍有更多威胁存在。仅在 2021 年 5 月的一个周末，就有 2200
    万美元从三个 DeFi 平台被盗取。DeFi 系统不提供你在 CeFi 中预期的那种保险。幸运的是，一些创新的保险服务正在推出，它们利用区块链技术和 `smart
    contracts` 的力量，为用户提供黑天鹅事件、钱包攻击、智能合约漏洞等损失的保障。推动去中心化保险边界的公司包括 `Nexus Mutual`、`Unslashed
    Finance` 和 `iTrust Finance`。

    7. 不变性。DeFi 协议利用自动化软件，代码中的任何缺陷一旦发布就会导致灾难，因为它无法修复。DeFi 作为非托管金融，也将风险完全放在你自己身上，这意味着不理解
    DeFi 隐藏和底层风险的新手可能会遭受巨大损失。一个例子是最近的 `YAM protocol` 失败。`YAM protocol` 未经审计，用户在发现协议中存在致命漏洞后对他们的资金感到恐慌。在最初存入
    6 亿美元后，他们迅速开始提取资金。


    ## DeFi 用例


    1. 开放贷款平台是 DeFi 最广泛的用途之一。通过 `Dapps`，用户可以向其他用户出借数字资产以赚利息，或者从其他用户那里借入数字资产作为回报。借者需要存入价值远贷款金额的抵押品。保护借者的唯一方法是保持抵押品在特定的价值阈值之上，即贷款价值比（`LTV`）率。如果借者未能维持
    LTV 率，贷款者将通过出售抵押品获得偿还。


    '
