- raw: '3.  Bob applies to borrow $10,000 worth of SCC from the Social Marketplace
    resident bank (Social Bank), which promptly approves him at a highly competitive
    interest rate. The bank checked Bob’s credit against an alternative credit rating
    bureau powered by Kiva, an online lending platform.


    4.  Alice purchases $8,000 worth of SCC from the Social Marketplace, using the
    equivalent amount in fiat. Alice deposits theSCC she has purchased into the bank.
    The bank benefits from this arrangement, because it can leverage fractional reserve
    banking to create more SCC for the community.


    5.  The SCC is tied one- to- one to the value of the U.S. dollar. It is therefore
    a stablecoin, designed to provide much sought- after stability in the otherwise
    volatile cryptocurrency market.


    6.  Alice and Bob each publish their products and services on the Social Marketplace,
    making them available for sale to other members.


    7.  Alice is planning to travel to Canada, so she searches the Social Marketplace
    for a convenient room to rent during her stay, and stumbles upon Bob’s motel.
    Alice selects her room and pays for it with SCC. A private permissioned blockchain
    ledger executes a smart contract, which transfers the SCC to Bob’s account, while
    simultaneously authorizing Alice’s biometric fingerprint for access to the room
    she rented.


    8.  All the necessary digital records and contract documentation associated with
    the rental is stored and synchronized on a contracts management system with the
    corresponding smart contract.


    9.  Alice is traveling from the Netherlands, and as part of an innovative trial,
    she can use her blockchain decentralized digital identity in place of a passport.


    Blockchains, or distributed ledgers, have three basic building blocks: *tokens,
    contracts,* and *identity hubs,* the last of which are identities or identifiers
    that are used to build multiparty applications. The blockchain represents a shared
    “truth” by establishing authenticity using agreed-upon cryptographic techniques
    to create digital representations of tokens, contracts, and identity.


    The next section describes the various technological components.


    ## Digital Identity and Identity Hubs


    Today, government and corporate institutional service providers control most of
    our digital identities and essential data and records. These institutions manage
    and restrict access to our data, including the ability to deny or revoke access.


    Digital identifiers are unique identifiers created and owned by the user and are
    rooted in global decentralized systems. These identifiers possess unique characteristics,
    such as immutability, and resistance to censorship and tampering.^([1](#notes.xhtml#chapter12-1))


    According to Niel Klomps, chief technology officer of Sphereon, decentralized
    identifiers (DIDs) are also called *self-sovereign identities* and are the key
    to enabling all kinds of solutions, including digital signatures, voting, and
    web or mobile application authentication. A DID is attached to you as a person,
    and to your device(s).^([2](#notes.xhtml#chapter12-2))


    Blockchain has ushered in an era of data decentralization; as a platform, it facilitates
    a new era of identities and data that we, the users, control. We can now augment
    existing cloud identity systems with one that comes under the direct ownership
    of individuals and organizations. DIDs give us complete control over what we share
    and with whom we share it, plus the ability to revoke access. Consider the implications
    for a new wave of social media whereby the user owns all their content and has
    authority over how that data is used and even monetized.


    Today, we have to grant full consent to countless apps and services, consequently
    spreading our identity data across numerous providers. Individuals need a secure,
    encrypted digital hub where they can store their identity data and easily control
    access to it.


    Personal identity hubs are a replicated mesh of encrypted datastores composed
    of cloud and hardware such as PCs, phones, and tablets that facilitate identity
    data storage and identity interactions^([3](#notes.xhtml#chapter12-3)) (see Figure,
    12-02). These hubs are open-source server technologies that you can run on any
    device or infrastructure, thereby ensuring that identity data is not bound to
    any particular organization or infrastructure. DIDs paired with identity hub personal
    datastores enable the creation of a new class of apps and services. Microsoft’s
    implementation of an identity hub is a Cosmos database hosted on the Azure cloud
    infrastructure.^([4](#notes.xhtml#chapter12-4))


    Keep control over your private data by sharing only what you want to. Instead
    of sending on your details to be stored in a single central database, hold onto
    them yourself—and only pass specific information to a specific receiver when you
    approve it.


    ![Figure 12-02. Identity hub framework.](images/img-155.jpg)


    Figure 12-02. Identity hub framework.


    Consider the world of medical records. Don’t you find it frustrating when you
    visit the doctor’s office and have to complete the same set of forms you completed
    during your last visit, sometimes multiple times during the same visit? When you
    do tests or labs with different service providers, you end up with medical records
    in many different places. In Miami, where I live, I have to manually work with
    my doctor to collect all the medical records from the various providers. Wouldn’t
    it be great if these providers could write the results of the tests to our identity
    hub? The data could then be presented through a personal dashboard so we can easily
    see critical analytics and notifications.


    Harvard University recently started awarding diplomas and degrees as documents
    stored on the blockchain. Similarly, we could store pertinent academic records
    on an identity hub, as well as employment- related documents such as résumés,
    background information, and even drug test results. All we would have to do is
    give the recruiter or employer read access.


    ## DID Attestations


    In a world of self-sovereign identities, where anyone can create and manage their
    own DID, how do you know when to trust an identity, credential, or record? How
    do we, in effect, establish trust between DIDs? When we create a DID, it begins
    life with no verified credentials, and only the owner can prove possession.


    Recall the architecture of a Social Construct and consider the regulatory authorities
    and trusted intermediaries. How do we currently create trust? We have government
    authorities issue proof of identity, such as a driver’s license, social security
    number, or passport. As an example, a driver’s license is issued by a state Department
    of Motor Vehicles (DMV).


    To accrue evidence of legitimacy, DIDs require endorsements or attestations from
    trusted institutional and government intermediaries. DID-based systems provide
    a mechanism to create time-stamped and immutable certifications for verification.
    A DID-based DMV can attest to the integrity of a blockchain driver’s license,
    and a trusted medical laboratory can verify that health records presented to it
    are authentic. Using DID attestations in association with a process known as *zero-
    knowledge solutions* allow Alice and Bob to store sensitive information on a blockchain
    so that they can verify their credentials to dependent parties without revealing
    the actual data.^([5](#notes.xhtml#chapter12-5))'
