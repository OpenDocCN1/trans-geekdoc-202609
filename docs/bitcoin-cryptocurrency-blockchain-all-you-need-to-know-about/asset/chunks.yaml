- raw: 'It is undeniable that blockchain solves many difficult issues for small businesses.
    There is an array of other benefits for small businesses that adopt cryptocurrency.
    There are multiple types of cryptocurrencies that make it attractive to small
    businesses, but they must take advantage of them in specific ways. Accepting cryptocurrencies
    means that a business can make a greater number of transactions. There are also
    much lower transaction fees with cryptocurrency, something which is already attractive
    to the retail crypto user, and particularly to a business making multiple large
    transactions. Furthermore, both large and overseas transactions can take days
    for banks to process. With blockchain technology, cryptocurrency transactions
    take minutes to process: this gives businesses greater flexibility and potentially
    the ability to do more deals and make more money. Cryptocurrency can be a game-changer
    for the small businesses that choose to adopt it.


    ## Mainstream Companies, Banks, and the Future of Cryptocurrency


    While individuals can pursue blockchain careers at a multitude of companies, the
    majority of careers in cryptocurrency are sprouting up in finance. Nevertheless,
    some of the most exciting news is coming from big tech. Facebook is releasing
    a payment platform, Amazon is looking to accept crypto as payment, Google is looking
    to power the leaders of blockchain, and Microsoft is creating a system that allows
    users to create their own tokens. Each of these companies needs hundreds if not
    thousands of new employees to run these entirely new operations.


    Furthermore, financial institutions are starting to adopt cryptocurrency. Central
    banks have long been opposed to cryptocurrency. For many years, most of these
    institutions scoffed at the promise of decentralized finance and claimed it would
    never compete with or supplant traditional financial institutions. When Bitcoin
    first got the attention of the mainstream media in 2017, Jamie Dimon, the CEO
    of JPMorgan Chase, said, “If you’re stupid enough to buy \[Bitcoin\], you’ll pay
    the price for it one day.” James Gorman, the chairman and CEO of Morgan Stanley,
    described crypto as purely speculative and that those who believed it could stabilize
    were “deluding themselves.” Nevertheless, in March 2021, Morgan Stanley became
    the first U.S. bank to offer a Bitcoin fund to its wealthy clients.^([14](#notes.xhtml#chapter2-14))
    JPMorgan Chase now also offers a few cryptocurrency funds to its clients. Today
    over half of the world’s top 100 banks are invested in cryptocurrency and blockchain.
    Cryptocurrency is unlike anything the technology and financial industries have
    ever seen. This section will explore how big businesses are getting involved in
    the space, the new projects that are paving the way for the industry, and ways
    in which people can get involved.


    In mid-August 2021, Facebook (now called Meta), announced that it would soon be
    releasing its own payment platform, called Novi. This platform will allow users
    to pay each other using a cryptocurrency called Diem. The cryptocurrency is backed
    by multiple fiat currencies such as the U.S. dollar and is pegged to their value.


    Facebook is doing something unique with Diem that makes it different from other
    stablecoins. Unlike Bitcoin and Ethereum, organizations such as Uber, Coinbase,
    and Shopify will serve as a sort of central bank for the currency. These companies
    will have voting rights with respect to how Diem operates. This makes Novi quite
    an interesting project. While Facebook is marketing Diem as a way to pay friends
    with crypto, it goes far beyond that. Facebook and the other founding companies
    of Diem control a very large portion of commerce in the United States and around
    the world. By creating its own currency, Novi/Facebook could possibly become an
    economy all on its own, operating outside the control of the U.S. government.


    In 2019 Facebook attempted to create its own currency called Libra. Due to regulatory
    issues with the government, the project failed to take off. Facebook has since
    revamped the project and selected different companies to work with, and so far,
    Novi has overcome all regulatory hurdles. If Facebook’s new platform reaches its
    full potential, the envisioned future of cryptocurrency and blockchain could be
    much nearer than currently anticipated.^([15](#notes.xhtml#chapter2-15))


    [Amazon.com](https://amazon.com/) is also making a move into cryptocurrency, although
    it is far less distinct than Facebook’s venture. In late July 2021, Amazon confirmed
    that it would accept cryptocurrency as a form of payment on its sites. This may
    seem like minor news, but the implications could be monumental for the widespread
    adoption of crypto. While millions of Americans own cryptocurrency, and the U.S.
    government and big banks are beginning to invest time and money in it, use of
    Bitcoin and similar coins is nowhere nearly as prevalent as use of the U.S. dollar.
    Bitcoin is now the world’s third-largest currency, but in 2020 only 3 percent
    of consumers in the United States used it to complete a transaction.^([16](#notes.xhtml#chapter2-16))
    This is because crypto is mainly seen as an investment. While that’s enough to
    keep cryptocurrency relevant and growing for decades to come, Amazon’s decision
    to accept cryptocurrency as payment could represent a seismic shift. In 2018 Amazon
    had 49 percent of the U.S. e-commerce market.^([17](#notes.xhtml#chapter2-17))


    We should note, however, that this doesn’t automatically represent a win for Amazon
    or cryptocurrency. According to the current U.S. tax code, transferring a high
    volume of cryptocurrency into goods can result in heavy taxes. For those who have
    invested in crypto, spending portions of what appears to be savings on small goods
    via Amazon would also seem counterintuitive. Given these issues, the widespread
    adoption of cryptocurrency is not necessarily inevitable and will not be easy.


    In August 2021, Microsoft received a U.S. patent for software that simplifies
    the process of creating crypto tokens.^([18](#notes.xhtml#chapter2-18)) The new
    software allows users to create their own tokens and makes it much easier to transfer
    data on those tokens across different blockchains. Utilizing blockchain technology
    and the creating cryptocurrency by oneself can appear daunting, but Microsoft
    has taken a step toward opening up that path for entrepreneurs or other individuals
    looking to create success. This could make widespread adoption of crypto feasible.


    Meanwhile, Google has announced a partnership with the $7 billion blockchain marketplace
    Dapper Labs. Dapper manages up to 1 million NFT transactions a week and is the
    fourth largest marketplace by sales volume (see [Figure 02-06](#chapter2.xhtml#fig11)).
    This move is a part of a larger scheme by Google to allow growing blockchain companies
    to utilize the massive computing power of Google Web Services. As blockchain technology
    infiltrates more industries and more companies embrace decentralization (also
    known as Web 3.0), Google is looking to create the cloud platform for these future
    industries. For now, Google is looking to scale this already very large network
    and turn it into the biggest name in blockchain. Google is not only competing
    with Microsoft, but also with Amazon, which has its own web services business.
    Currently Amazon Web Services powers a third of the Internet, and Google is looking
    toward the future and hoping to contend with or surpass Amazon.^([19](#notes.xhtml#chapter2-19))'
