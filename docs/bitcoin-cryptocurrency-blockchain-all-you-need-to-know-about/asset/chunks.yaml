  trans: '

    区块链技术通过依赖其框架内的大量节点，消除了单点入口的弱点。它还通过使用不可更改的算法运行增加了信任。这些算法通过依赖网络成员验证每笔交易，从而创建了“无须信任（trustless
    trust）”。区块链的信任可以帮助金融机构消除中间成本，这些成本推高了交易价格，尤其是国际交易。由于区块链交易在每个节点上持续更新，因此数据丢失或损坏的风险很小。


    ## 匿名性带来的威胁


    区块链网络上的用户通常通过其公钥进行识别，但这并不等同于知道用户的身份或位置。此外，用户可以随时创建额外的公钥，甚至是新的数字钱包。因此，区块链网络上的匿名性使得执法部门调查金融犯罪变得困难。


    为了让区块链网络获得广泛采用，有必要解决匿名性的监管问题，但从哲学上讲，监管的思想可以被视为违背区块链的根基。正如我们所看到的，得于网络使用的共识算法，区块链技术发生数据的概率非常低。共识算法使得要发生破解，某人需要整个网络至少
    51% 的计算能力。


    在区块链技术上保护个人数据的最佳方法是使用个人身份中心。个人身份中心可以由用户操作，以便只有数据所有者才能选择何时以及何地发布数据。这可以通过消除身份验证的第三方来增强隐私。


    ## Ripple (RXP)


    Ripple 是一种开源、无许可、去中心化的私有账本，能够在三到五秒内结算交易。它也是 Ripple 账本使用的代币名称。Ripple 代币表示为 `XRP`
    Ripple。它没有区块链；相反，它拥有自己的专利技术，被称为 Ripple 协议共识算法 (`RPCA`)。


    `RPCA` 通过减少传统区块链中固有的高延迟解决了拜庭将军问题。延迟是延迟的的度量。在网络中，延迟衡量的是数据跨越网络到达目的地所需的时间。标准区块链中出现高延迟，是因为所有节点必须进行同步通信。


    在 `RPCA` 中，共识算法通过使用主网络内的子网络避免了这种必要性。子网络由选定的成员节点组成，Ripple 将这些节点称为“验证者（validators）”。网络上有超过
    150 个验证者，默认的“唯一节点列表（Unique Node List）”中有超过 35 个，Ripple 运行了其中的 6 个节点。`XRP` 可以直接发送，无需中央中间人，这使其成为货币交换的理想选择。交易费用相对较低，几家主要银行支持
    `XRP`，包括 Santander、Axis Bank、Westpac 和 Union Credit。所有的 `XRP` 都已经挖完，这意味着 Ripple
    开发者可以决定释放或保留多少代币。这种中心化使得 Ripple 的运行更像现代银行。


    Ripple 主张监管加密货币，因为他们认为这将增加金融机构对代币的采用，并为市场带来目前因缺乏监管而却步的新投资者。


    Ripple 从加强监管中获得的最大优势是加速国际转账。目前，国际转账受各国政府监管，这意味着成本根据汇率和政府征收的费用而异。Ripple 推动建立货币交换的国际框架，这将显著增加
    Ripple 的使用。


    ## Diem


    `Diem` 是 Facebook 创建的数字货币名称。Diem 支付系统构建在区块链技术之上，以实现资金开放、即时且低成本流动。目标是人们能够发送、接收和花费资金，实现金融服务的通用访问。Facebook
    将其定义为全球货币和金融基础设施，旨在帮助全球超过 17 亿没有银行账户的人。该代币旨在成为一种稳定币，这意味着它的设计比典型的加密货币波动更小。


    `Diem` 决定与全球政策制定者合作，以确保遵守特定的法规。Diem 还与执法部门合作以遵守 `AML` 和 `CFT` 法律。Diem 与执法部门的合作让区块链爱好者对网络上的个人隐私表示担忧。然而，Diem
    保证网络之外不存在个人数据。


    # 12 消除贫困的技术方案


    在本章中，我的目标是描述一个简单的用例场景，以展示一种革命性的交易所（我称之为社交市场 Social Marketplace）如何成为消除贫困的催化剂。图
    12-01 概述了建议的技术设施。


    Alice 和 Bob 是相互独立的创业者，寻求募集资金以开发各自的业务。他们主要对社交市场提供的几种选择感兴趣：


    1. 借入足够的社交货币 (`SCC`) 以从其他交易者处购买所需的和服务。

    2. 使用法币购买 `SCC`，仅在社交市场内有效。

    3. 与其他交易者进行交易，使用 `SCC` 作为商品和服务的标准价值单位。


    ## 场景


    ![图 12-01. 架构技术设施。](img/img-152.jpg)


    图 12-01. 架构技术设施。


    1. Alice 和 Bob 分别支付了名义年费并注册成为社交市场的交易者。

    2. 作为欢迎包的一部分，他们都获得了一个基于区块链的去中心化身份 (`DID`)，并获得了个人数字身份中心的访问权限，该中心安全、隐私地存储他们的身份以及所有官方文件和记录。他们拥有并控制其中心中的数据和身份，并可以安全地与他人、应用程序和企业共享数据。

    '
