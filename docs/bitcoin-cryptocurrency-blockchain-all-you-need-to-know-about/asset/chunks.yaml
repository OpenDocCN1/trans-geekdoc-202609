    for the world’s unbanked.


    The chapter ends with mentioning how modern microfinance institutions can foster
    growth by being powered by blockchain.


    ## Chapter 4: Why We Ought to Rethink Money


    This chapter explains in some detail why it is necessary to rethink the idea of
    money. It begins by showcasing the problems created by traditional fiats, such
    as hyperinflation and an overpowerful central government. It introduces several
    “social” currencies such as the Brixton pound and Colu to exemplify how money
    as a community construct can solve the dilemmas posed by traditional fiats. The
    chapter then presents a more in-depth case study of Bitcoin to demonstrate how
    its establishment amounted to a liquidity injection.


    The chapter also takes a critical look at centralized governments to examine how
    fiat has been detrimental to some countries, such as Venezuela. Additionally,
    the chapter highlights some further disadvantages of fiat, including government
    corruption, crime, counterfeiting, hyperinflation, currency devaluation, and the
    high cost of international money transfer.


    Furthermore, the chapter argues that government-controlled money is inherently
    immoral because it is a coercive measure for the exchange of value.


    The chapter concludes with some examples of communities that chose to create their
    currencies. Some examples include the Brixton pound, Spice Time Credit, Colu,
