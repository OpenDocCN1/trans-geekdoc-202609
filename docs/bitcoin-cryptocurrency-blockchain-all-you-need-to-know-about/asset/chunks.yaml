- raw: '## The Federal Trade Commission


    The FTC is a bipartisan federal government agency that focuses on protecting American
    consumers while promoting competition in the U.S. economy.^([13](#notes.xhtml#chapter11-13))
    The FTC has jurisdiction over civil antitrust issues such as deceptive or fraudulent
    practices. The enforcement of antitrust laws by the FTC helps to keep markets
    open and free.^([14](#notes.xhtml#chapter11-14))


    In June 2015 the FTC announced its first lawsuit in a cryptocurrencyrelated case.^([15](#notes.xhtml#chapter11-15))
    The case involved a smartphone rewards application called Prized. Prized advertised
    that users could play games on the app to earn coins that could be used to buy
    real-life items such as clothes or gift cards.^([16](#notes.xhtml#chapter11-16))
    Users, however, could not purchase anything with their coins.Rather, the application
    installed malicious software on their devices. The malicious software forced the
    user’s device to mine virtual currencies such as Dogecoin, LiteCoin, and QuarkCoin
    for the developer. The case was brought in the federal court of New Jersey and
    ultimately ended with the application developers paying a settlement.


    Since that first case, dozens more have been filed by the FTC. As of May 2021,
    FTC data shows a huge spike in cryptocurrency investment scams.^([17](#notes.xhtml#chapter11-17))
    This increase in case filings has caused the FTC to create a new industry classification—fintech,
    or financial technology.^([18](#notes.xhtml#chapter11-18))


    The scope of the FTC’s jurisdiction over FinTech includes mobile payments, crowdfunding,
    virtual currencies, applications, ecommerce sites, and more. It aims to regulate
    these sectors by undertaking enforcement action against companies that harm consumers
    through deceptive practices. However, a problem exists in that FinTech tools are
    often either made outside the United States, where the FTC lacks jurisdiction,
    or by unknown entities.


    ## Financial Crimes Enforcement Network (FinCEN)


    The Financial Crimes Enforcement Network (FinCEN) is part of the United States
    Treasury Department and monitors financial transactions. It was established in
    1990 to combat and halt terrorist financing, money laundering, and other financial
    crimes.^([19](#notes.xhtml#chapter11-19))


    Its primary regulatory functions fall under the Currency and Financial Transactions
    Reporting Act of 1970. Responsibilities of FinCEN center around early detection
    and deterrence of financial crimes. Examples of some FinCEN responsibilities include
    issuing and interpreting regulations set forth by government statues, supporting
    such provisions, and maintaining government- wide access to FinCEN data.


    After the September 11 terrorist attack in 2001, FinCEN gained another set of
    responsibilities when the PATRIOT Act was implemented. The PATRIOT Act included
    federal anti–money laundering (AML) andcounterterrorism financing (CFT) programs,
    which FinCEN would oversee. FinCEN also gained another role as the Foreign Financial
    Intelligence Unit (FIU) for the United States government.^([20](#notes.xhtml#chapter11-20))


    It was not until May 2019 that FinCEN issued a set of guidelines for applying
    its regulations to businesses that participate in money transmissions with virtual
    currencies. In January 2021, FinCEN released new proposals that would subject
    financial institutions and exchanges to onerous recordkeeping and reporting requirements
    for certain digital currency transactions.^([21](#notes.xhtml#chapter11-21)) In
    summary, they asserted that any entity involved in the exchange or administering
    of a token must register as a money services business (MSB) if they were not already
    registered with the SEC or Commodity Futures Trading Commission (CFTC). Registering
    as an MSB with FinCEN is a no-cost process that is done by completing Form 10715.
    However, FinCEN also requires that the MSB must comply with recordkeeping, reporting,
    and AML program requirements under the Bank Secrecy Act (BSA) and designate a
    compliance officer to report suspicious activity.^([22](#notes.xhtml#chapter11-22))


    ## Financial Action Task Force (FATF)


    The Financial Action Task Force (FATF) was established in 1989 during a Group
    of Seven (G7) meeting in Paris. It was designed to combat international money
    laundering.^([23](#notes.xhtml#chapter11-23)) As America’s FinCEN would later
    do, the FATF expanded its reach by adopting policies to combat terrorist financing.
    More than 200 countries are committed to FATF and the implementation of the standards
    it sets forth, mostly related to international AML/ CFT regulations.


    The president of FATF changes every year, and in 2019 it was Marshall Billingslea
    of the United States. Billingslea advocated focusing on the regulation of virtual
    currencies. Specifically, instructions were developed for virtual asset service
    providers (VASPs) to abide by the travel rule.^([24](#notes.xhtml#chapter11-24))
    All VASPs were required to obtain the identity of all senders and recipients in
    a virtual asset transaction. The so-called travel rule requires obligations to
    obtain, hold, and transmit required originator and beneficiary information in
    order to identify and report suspicious transactions, monitor the availability
    of information, take freezing actions, and prohibit transactions with designated
    persons and entities.


    The FATF also decided that VASPs should be registered, at least in the jurisdiction
    in which they were created. VASPs would be further monitored by a competent authority
    that could impose sanctions as a disciplinary measure or suspend the VASP’s license.


    In October 2021, the FATF updated its *2019 Guidance for a RiskBased Approach
    to Virtual Assets and Virtual Asset Service Providers (VASPs).* The FATF standards
    require countries to assess and mitigate their risks associated with virtual asset
    financial activities and providers; license or register providers and subject
    them to supervision or monitoring by competent national authorities.^([25](#notes.xhtml#chapter11-25))


    ## Smart Contracts


    One of the most common uses for blockchain is to execute smart contracts. Smart
    contracts are self-executing agreements that function on a conditional basis,
    giving them the ability to execute contracts more efficiently than in standard
    practices. Smart contracts deal exclusively with the execution of contracts and
    not their enforcement. As a result, they cannot technically be considered legally
    binding, even though they otherwise have all the components of a legal agreement.^([26](#notes.xhtml#chapter11-26))
    For smart contracts to be legally binding, they would have to be able to threaten
    litigation as a means of enforcement.


    Given blockchain’s immutable nature, this is almost impossible— for example, if
    a smart contract was determined to be unfair to a party member and needed to be
    modified. Anything implemented on the blockchain is permanent.


    Another issue concerning blockchain’s immutability in regard to smart contracts
    is that disagreements or conflicts are challenging to remedy. Most grievances
    occur after a contract is initiated, which means a smart contract would have to
    include instructions from the start on what would be done in the event of a grievance.
    Thus immutability means that all participating parties must have a complete understanding
    of the smart contract involved.


    Understanding smart contracts can be complicated for the typical contract attorney,
    because the contracts are written in a computer coding language. Therefore, contract
    agreements in English must be translated into another language that the blockchain
    can understand.'
