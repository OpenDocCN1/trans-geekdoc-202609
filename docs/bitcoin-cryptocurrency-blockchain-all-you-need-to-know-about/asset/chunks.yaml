  fmt: '

    Tokens are classified based on certain characteristics, which make up a token’s
    `base`. The first characteristic is the `token type`. There are two types of tokens:
    `fungible` and `nonfungible`. Fungible tokens have interchangeable value with
    one another, so that any quantity of them has the same value as an equal amount
    of another token in its same series or class. An example of a fungible token would
    be physical cash. A nonfungible token (NFT) is not exchangeable with other tokens
    of its same type, because they have different values. An example of a nonfungible
    token would be a property title.


    A token’s `unit` is the next characteristic that can be used to define it. A token
    unit can be `fractional`, `whole`, or `singleton`. Fractional tokens can be divided
    into fractions and represented as decimals. Whole tokens are represented only
    by whole numbers: they do not allow for subdivision. A singleton is simply represented
    by a quantity of one with no subdivisions.


    `Value type` is the third characteristic of a token identity. Tokens can either
    be `intrinsic` or `reference` types. Intrinsic type means the token itself holds
    value, while reference type directs to some other source of value.


    `Representation` is another characteristic that defines tokens. A representation
    can be `common` or `unique`. Common tokens share properties and are stored in
    one central location. Unique tokens, on the other, have unique features and can
    be individually traced.


    The final token characteristic is the token’s `template`. Templates can be `single`
    or `hybrid`. Single tokens are made from one parent, while hybrid tokens combine
    a parent token with one or more child tokens for their creation.


    Aside from token characteristics, the TTF provides a composition framework for
    creating tokens based on reusable parts. These parts are base token types, token
    properties, and token behaviors. The parts are then further broken down, and their
    residual components are known as `component artifacts`. The component artifacts
    are ultimately combined to complete the token’s creation.


    The TTF’s token template determines the type of component artifacts present in
    a token. This template is composed of a template formula and template definition,
    which is derived from the template formula. The token template describes how a
    token will be used and is made up of reusable base types, behaviors, behavior
    groups, and properties.


    Properties of a token refer to how data is contained by a token and how it records
    its data. Token behaviors can be:


    1. `Transferable`, meaning ownership can be transferred.

    2. `Nontransferable`, meaning ownership cannot be transferred.

    3. `Subdividable`, meaning the token can exist as a decimal.

    4. `Singleton`, meaning the token is made from the number 1.

    5. `Mintable`, meaning tokens can be created.

    6. `Role supported`, meaning tokens have roles defined to limit or allow specific
    actions.

    7. `Burnable`, meaning tokens can be removed from the supply.


    Token behavior groups reflect behaviors that are joined in groups based on similar
    usage. For example, `Supply Control` is a behavior group made up of `mintable`,
    `burnable`, and `role support` behaviors.


    Template definitions contain the artifacts that will be used to create a token
    using the template formula’s instructions. Therefore, the template definition
    is a token’s specification and is used by developers to code. The image below
    is an example of a token definition derived from the token formula.


    Despite their intricate appearance, the token template formulas and definitions
    are easy to use. This feasibility results from the interface established by the
    consortium that allows for simple click and drag creation of tokens. The result
    is a token specification summary sheet.


    ![Figure 09-01. Token formula.](images/img-116.jpg)

    Figure 09-01. Token formula.


    ![Figure 09-02. Token specification summary. The Emoney token enables the issuance
    of regulated electronic money on blockchain networks, and its practical usage
    in real financial applications.](images/img-117.jpg)

    Figure 09-02. Token specification summary. The Emoney token enables the issuance
    of regulated electronic money on blockchain networks, and its practical usage
    in real financial applications.


    “The framework enables a business person to create a token visually using a design
    tool without writing any code whatsoever.”


    Tokens can be applied to nearly any business, which has led many companies to
    create their own tokenized products and services. The Token Taxonomy Framework
    provides clear insight on how businesses can implement tokens, and more importantly,
    sets standards that can be applied both in token creation and regulation.


    ## Microfinance: Solving the Illiquidity Problem


    Microfinance is a financial service extended to low-income clients to help them
    increase their income. These services include credit lines, insurance funds, loans,
    and savings accounts. Most people who are eligible to receive microfinance are
    small businesses and low-income entrepreneurs who lack sufficient credit.


    Microfinance programs were created with the promise of alleviating poverty by
    means of group-lending contacts with joint liability. However, many of these programs
    only exacerbated the economic tensions between low-income groups and lenders,
    who would implement high repayment rates. As a result, greater income inequality
    developed, which directly counters the purpose of microfinance.


    Another problem is that microfinance institutions (MFIs) are lightly regulated.
    Furthermore, only a limited number of MFIs meet the requirements for remittances
    or savings. Furthermore, clients seeking microfinance often lack collateral to
    secure the funding from the financer.


    This flaw in microfinancing causes most low-income people to result in merely
    saving up. Saving up means accumulating the value needed for a commodity or service
    in its entirety and then obtaining it. The need for low-income individuals to
    have full value for costly endeavors only deepens the poverty lines, as the low-income
    sector is forced to seek high-interest loans or, worse, completely abandon their
    efforts to obtain funding.


    ## The Decentralized Identify Foundation of Blockchain Origins


    Identity in blockchain technology is based on a `decentralized public key infrastructure`
    (DPKI). DPKI is derived from `public key infrastructure` (PKI), which is composed
    of select policies, hardware, software, protocols, and set roles for managing
    confidential and personal information. Together, these components outline how
    to securely manage public-key encryption and digital certificates. Most online
    transactions, such as e-commerce and banking, utilize PKI because it provides
    more security than simple passwords to confirm the identities of the parties involved
    in a transaction.


    PKI provides security by following the `X.509` standard. This standard defines
    the general security structures included in PKI. The first security structures
    accounted for in PKI are `certificates of authority`. These make up the cryptographic
    framework of PKI. The certificate of authority is issued either by an automated
    process or under human supervision. It is used to match public keys with identities.

