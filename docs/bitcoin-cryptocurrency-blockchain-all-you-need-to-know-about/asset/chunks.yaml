- raw: 'Blockchain technology removes the weakness of a single point of entry by relying
    on numerous nodes within its framework. It also adds trust through its use of
    unchangeable algorithms to function. These algorithms thus create “trustless trust”
    by depending on network members to validate each transaction.^([40](#notes.xhtml#chapter11-40))
    Trust in blockchain can help financial institutions eliminate intermediary costs,
    which raise the price of transactions, especially international ones. Since blockchain
    transactions are updated continuously and on each node, there is little risk for
    data loss or corruption.


    ## The Threat from Anonymity


    Users on a blockchain network are often identified by their public keys, but this
    does not equate to knowing the user’s identity or location. Furthermore, a user
    can always make additional public keys and even new digital wallets. Anonymity
    on blockchain networks thus makes it difficult for law enforcement teams to investigate
    financial crimes.^([41](#notes.xhtml#chapter11-41))


    For blockchain networks to gain widespread adoption, it would be necessary to
    solve the regulatory problem of anonymity, but philosophically, the idea of regulation
    can be viewed as going against the very foundation of blockchain. As we have seen,
    the odds of a data breach with blockchain technology are very low, thanks to the
    consensus algorithm used by the network. The consensus algorithm makes it so that
    someone would need at least 51 percent of the entire network’s computation power
    for a breach to occur.


    The best way to protect personal data on blockchain technology is to use personal
    identity hubs. Personal identity hubs can be user-operated so that only the owner
    of the data can choose when and where to release data. This can enhance privacy
    by eliminating third parties for identity verification.


    ## Ripple (RXP)


    Ripple is an open-source, permissionless, decentralized private ledger capable
    of settling transactions in three to five seconds. It is also the name of the
    token used by the Ripple ledger. The Ripple token is represented as XRP^([42](#notes.xhtml#chapter11-42))
    Ripple. It does not have a blockchain; instead, it has its own patented technology
    known as the Ripple protocol consensus algorithm (RPCA).^([43](#notes.xhtml#chapter11-43))


    The RPCA solves the Byzantine Generals Problem by reducing the high latency that
    is usually inherent in conventional blockchains. Latency is a measure of delay.
    In a network, latency measures the time it takes for data to get to its destination
    across the network. High latency occurs in standard blockchains because all nodes
    must communicate synchronously.


    In the RPCA, the consensus algorithm avoids this necessity by using subnetworks
    within the leading network. Subnetworks are composed of selected member nodes
    that Ripple calls *validators.* There are over 150 validators on the network,
    with over thirty-five on the default Unique Node List; Ripple runs six of these
    nodes.XRP can be sent directly, without a central intermediary, which makes it
    ideal for currency exchange. Transaction fees are relatively low, and several
    major banks support XRP, including Santander, Axis Bank, Westpac, and Union Credit.
    All XRP has already been mined, which means Ripple developers can determine how
    much of the coin to release or withhold at a time. This centralization makes Ripple
    function more like modern banks.


    Ripple advocates for the regulation of cryptocurrency, as they believe it will
    increase the adoption of the token among financial institutions as well as bringing
    new investors to the market that are currently put off by the lack of regulation.


    The biggest advantage Ripple could gain from increased regulation is in expedited
    international transfers. Currently, international transfers are regulated by national
    governments, meaning costs can varybased on currency exchange rates and government-imposed
    fees. Ripple has pushed for an international framework for determining currency
    exchanges, which would significantly increase the use of Ripple.


    ## Diem


    Diem^([44](#notes.xhtml#chapter11-44)) is the name of a digital currency created
    by Facebook. The Diem payment system is built on blockchain technology to enable
    the open, instant, and low-cost movement of money. The goal is that people will
    be able to send, receive, and spend their money, enabling universal access to
    financial services. Facebook defined it as a global currency and financial infrastructure
    meant to help the over 1.7 billion people around the world who do not have access
    to a bank account. The token is intended to be a stablecoin, which means it was
    designed to be less volatile than typical cryptocurrencies.


    Diem is determined to work with policymakers across the globe to ensure specific
    regulations are abided by. Diem is also partnered with law enforcement authorities
    to comply with AML and CFT laws. The partnership of Diem with law enforcement
    made blockchain enthusiasts question the privacy of personal information on the
    network. Diem, however, had given assurances that no personal data is stored on
    the network beyond the information mandated by AML and CFT.


    Users of the Diem blockchain were to be given user accounts that are not related
    to their personal identities. Public keys were to be used on the network to communicate
    and would be viewable by anyone on the network when a transaction is made. Executed
    transactions show not only the sender’s public key but also the recipient’s public
    key, along with a timestamp and transaction amount. The Diem Association would
    have only had access to this public information, which would have been available
    to all for third-party audits.


    The project, currency, and transactions are to be managed and cryptographically
    entrusted to the Diem Association, a membership orga nization of companies from
    payment, technology, telecommunication, online marketplace and venture capital
    companies, and nonprofits.


    In the next chapter, I will explain how the concepts proposed in this book call
    for innovation in blockchain technologies with the purpose of helping alleviate
    poverty. I will introduce a new technology platform, the Social Marketplace, based
    on the intersection of blockchain, bartering, and cryptocurrency to reconcile
    the problems of fiat, inequality, and lack of identification.


    # 12 A Technology Proposal for Alleviating Poverty


    In this chapter, my goal is to describe a simple use case scenario to demonstrate
    how a revolutionary new exchange, which I will call the Social Marketplace, could
    become a catalyst for the alleviation of poverty. [Figure 12-01](#chapter12.xhtml#fig28),
    on the next page, outlines the proposed technology infrastructure.


    Alice and Bob are startup entrepreneurs (independent of each other) looking to
    raise capital to develop their respective businesses. They are primarily interested
    in several options available from the Social Marketplace:


    1.  Borrowing enough of the social cryptocurrency (SCC) needed to purchase needed
    goods and services from other traders in the marketplace.


    2.  Purchasing SCC using fiat, bearing in mind that it is only valid for use within
    the Social Marketplace.


    3.  Doing business with other traders, using the SCC as the standard unit of value
    for their goods and services.


    ## Scenario


    ![Figure 12-01. Architectural framework Technology Infrastructure.](images/img-152.jpg)


    Figure 12-01. Architectural framework Technology Infrastructure.


    1.  Alice and Bob each pay the nominal annual subscription fee and register to
    become traders on the Social Marketplace.


    2.  As part of their welcome package, each one receives a blockchainbased decentralized
    identity (DID) and access to a personal digital identity hub, which securely and
    privately stores their dig ital identities and all official documents and records.
    They own and control their data and identities on their hub, and they can securely
    share their data with other people, apps, and businesses.'
