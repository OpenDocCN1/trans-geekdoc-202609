- raw: 'Lastly, I will provide what I see as some of the pros and cons of DeFi, such
    as streamlined access to capital for small and medium businesses, technological
    possibilities afforded by tokenization, and unique digitalidentities. While DeFi
    has benefits, there are also challenges, such as problems with liquidity and overcollaterization.


    ## Chapter 14: How to Create a Nonfungible Token


    In March 2021, Jack Dorsey, the founder of Twitter, auctioned his first ever tweet
    as a nonfungible token (NFT) for almost $3 million. Around the same time, the
    artist commonly known as Beeple sold his painting “First 5,000 Days” as an NFT
    at Christie’s auction house for over $68 million. The market for NFTs is now worth
    over $7 billion, and is set to grow exponentially more.


    This chapter asks the fundamental question, what are nonfungible tokens (NFTs)?
    I also explore what I refer to as the enigma of authenticity and the subjective
    theory of value. Why do we value what we value?


    The idea of authenticity is tightly entwined with the rise of NFTs. With an NFT,
    you can easily verify the identity of the original creator and validate its authenticity
    against the blockchain.


    In this chapter, I will also show how smart contracts enable the original creator
    of an NFT to perpetually earn royalties, as an accompanying artifact makes its
    way from owner to owner.


    This chapter will explore the problems solved by NFTs, including the digital identification
    of complex entities and the applications of NFTs in the ticketing industry, licensing,
    and certifications. This chapter includes a short tutorial on how to create an
    NFT using the [rarible.com](https://rarible.com/) website.


    ## Chapter 15: Blockchain and the Metaverse


    The metaverse has quickly become a household phenomenon, primarily because of
    Facebook’s rebranding as Meta. In this chapter, my goal is to present an overview
    of the metaverse’s relationship to the Internet at large and to technologies such
    as virtual reality and augmented reality. I will also touch on some of the initiatives
    the world’s largest companies,such as Meta and Microsoft, are taking with their
    products and services and the primary audience they are targeting.


    I will describe how Web 3.0 is a crucial philosophical and technological feature
    of the metaverse. I will also explain how it helps enhance the interdependency
    between blockchain and the metaverse.


    Blockchain brings certain technologies to the table that makes it extremely valuable
    for integration into the metaverse, such as decentralization, altcoins, and NFTs.


    Lastly, I will present the idea of the virtual estate in the metaverse and an
    overview of the technologies and techniques needed to architect a building.


    ## Appendix: Blockchain for Contract and Records Management


    In this appendix, I will present some solutions that blockchain technology provides
    specifically for contract and records management. I will address such questions
    as security and confidentiality; data regulatory compliance; business efficiencies;
    implications for records management and authentication of intellectual property;
    and workflow functionality.


    # 01 Cryptocurrency and the Creation of Wealth


    The goal of this chapter is to explore the potential for creating wealth using
    cryptocurrency as a vehicle. Toward this end, I will describe different approaches,
    including trading on a cryptocurrency exchange and the differences between short-term
    (day), swing, and long-term trading. We will look at different cryptocurrency
    exchanges, how to make your first trade, the different types of crypto trading,
    and what to expect while trading. Finally, I will categorize cryptocurrencies
    in terms of their utility versus their speculative value and propose varying approaches
    to each approach.


    Cryptocurrency trading is a new and exciting method of financial investment that
    people worldwide are beginning to adopt. Often cryptocurrency is mentioned in
    the context of people making money seemingly out of thin air. Take the notorious
    Dogecoin, for example, a crypto coin named after an Internet meme. Dogecoin was
    started as a joke in 2013 as a way to poke fun at some of the wild speculation
    in cryptocurrencies. A thousand dollars’ worth of Dogecoin bought in April 2020
    would have been worth $237,097 in April 2021.^([1](#notes.xhtml#chapter1-1)) And
    consider the story of the New York brothers who turned $8,000 into $1 million
    by investing in the Shiba Inu coin,^([2](#notes.xhtml#chapter1-2)) a spinoff of
    Dogecoin.


    There is also a flip side to making money in crypto. In 2017, the most established
    cryptocurrency, Bitcoin, dropped 45 percent in value during December, from $19,000
    to below $11,000. By November of the following year, Bitcoin’s price was below
    $5,000. As a result of this crash, the entire cryptocurrency market dropped by
    80 percent, a crash more severe than the dot-com bubble of the early 2000s.^([3](#notes.xhtml#chapter1-3))


    On the surface, it looks as if investors in crypto are making and losing money
    virtually overnight. Is cryptocurrency trading anything more than just playing
    a lottery? Fortunately, the answer is yes. Cryptocurrency trading is complex,
    but with good preparation, technical analysis, and a great deal of luck, it can
    create immense wealth.


    ## Speculative Trading versus Utility Trading: What to Expect


    The stories about Dogecoin and other similar coins often leave people scratching
    their heads, wondering what inherent value (if any) these coins may have. Why
    does $100 worth of Dogecoin have even that much value? Is it just a question of
    supply and demand? After all, it is argued, these cryptocurrencies have no utility
    and do not serve a purpose.


    Dogecoin is an example of what I would call a lottery or speculative coin, (see
    [Figure 01-01](#chapter1.xhtml#fig1)). Here is a coin with no utility: its value
    rises and falls exclusively based on speculation. An investment of $500 in Dogecoin
    in 2016 would be worth over $1 million today. That said, a single Dogecoin as
    of December 29, 2021, was as low as 17 cents, but at its peak in April 2021, it
    was trading at 74 cents.


    This is not to say one should refrain from investing in a currency that lacks
    utility. These coins derive value from the fact their price might go up. Thus
    they are potentially fantastic stores of wealth. Although it is easier to make
    money playing lottery coins likeDogeCoin or Shiba Inu than playing the actual
    lottery, these are lottery coins nonetheless. It is said that crypto trading has
    worse odds than gambling in Las Vegas. Long-term returns on blackjack are –0.28
    percent (plus or minus 1.15 percent). For comparison, the long-term returns on
    Bitcoin are 60 percent, plus or minus 160 percent. This means that in trading
    Bitcoin, there is quite the chance that one will either have a big return on investment
    or will lose everything.^([4](#notes.xhtml#chapter1-4)) One trading strategy might
    be to hold a basket of lottery coins for the long term, hoping that one might
    strike gold. It is important to note that about 100 investors own 65 percent of
    Dogecoin’s $46 billion market, and five individuals own 40 percent of it.^([5](#notes.xhtml#chapter1-5))


    ![Figure 01-01. Types of Cryptocurrency and Token Types.](images/img-25.jpg)


    Figure 01-01. Types of Cryptocurrency and Token Types.


    Moreover, cryptocurrency is not yet regulated, so there are several “whales”;
    people with formidable technology tools and wealth who manipulate the prices of
    cryptocurrencies to their advantage. Their activities would be illegal in the
    stock market, which is regulated. This phenomenon is explored later in this chapter.


    The more engaging and, some would say, more rational approach to crypto trading
    involves utility coins. As their name suggests, these cryptocurrency coins provide
    people with some form of utility.


    To understand utility tokens, let us look at the properties of a blockchain. A
    blockchain is a network that has three key characteristics.'
