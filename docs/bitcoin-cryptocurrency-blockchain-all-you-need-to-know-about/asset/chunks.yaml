  trans: '

    正如 Verge 所解释的那样：“非同质化”多或少意味着它是独特的，并且无法被其他东西替换。例如，比特币是同质的——用一个比特币兑换另一个比特币，你将得到完全相同的东西。然而，一张独一无二的交易卡是非同质的。如果你用它兑换另一张卡，你将得到一个完全不同的东西。


    根据以太坊官方网站，NFT 具有以下特殊属性：


    1. 每个被铸造的代币都有一个唯一的标识符。

    2. 它们无法与其他代币直接交换。

    3. 每个代币都有一个所有者，且信息可以很容易验证。

    4. 代币存储在以太坊上（这是 NFT 构建的区块链之一），并可以在任何基于以太坊的 NFT 市场上买卖。


    换句话说，如果你拥有一个 NFT：


    1. 你可以轻松证明你拥有它。

    2. 没有人能以任何方式对其进行操纵。

    3. 你可以出售它，在某些情况下，这将让原始创作者在销售中获得版税。

    4. 或者你可以永远持有它，放心地知道你的资产已由你在以太坊上的钱包提供保护。


    如果你创建一个 NFT：


    1. 你可以轻松证明你是创作者。

    2. 你决定了稀缺性。

    3. 每当它出售时，你都可以获得版税。

    4. 你可以在任何 NFT 市场或通过点对点出售它。你不会受限于任何平台，也不需要任何中间人。


    这类似于金本位的运作方式，这种美元曾可以从美国的任何银行兑换成实际黄金。虽然并不总是可以兑换，但 NFT 是通过区块链上的智能合约存在的非同质化资产的密码学表示。


    现在让我们来看看智能合约实际上是如何运行的，以便更好地理解 NFT。


    ## 了解智能合约


    在电子计算机时代之前，合同和正式协议需要托管监督才能具有约束力和可执行性。例如，需要银行背书支票以取现，需要法院来背书某些类型的交易。


    同样，智能合约是一种计算机程序或交易协议，旨在根据智能合约程序中编写的条款，自动执行、控制并记录法律相关的事件和行动。


    智能合约设计的首要目标之一是消除对信任中间人的需求，这些中间介参与了合同关系的每一个层面。智能合约用开源代码取代了这些中间介。智能合约可以在开源代码上运行，取代了设计用于监督合同执行的常规法律和监管基础设施。这有助于总体降低成本、节省时间，并在很大程度上防止了腐败行为的可能性。


    智能合约技术在非同质化资产的数字化表示方面起了重要作用，这对于非同质化标识符的创建和传输非常有用。例如，以太坊虚拟机 (`EVM`) 有几种用于创建各种合约类型的
    `ERC` 标准。`ERC` 是以太坊意见请求（Ethereum Request for Comments）的缩写。`ERC` 是以太坊的应用级标准，可以包括代币标准、名称注册表、库/包格式等。


    `ERC-721` 是一个免费开源标准，描述了如何在以太坊区块链上构建非同质化或独特的代币。虽然大多数代币是同质的（每个代币都与其他代币相同），但 `ERC-721`
    代币都是独特的。将它们想象成稀有的、独一无二的收藏品。


    智能合约的首次记录追溯到 1998 年的 Nick Szabo，他发明的 Bitgold 数字货币是构建在中心化网络上的。然而，以太坊区块链使得在去中心化区块链网络上执行不可变且完全自主的智能合约协议成为可能。


    ## NFT 解决了什么问题？


    NFT 技术解决了价值和所有权的方面，这就是为什么 NFT 领域似乎存在大量的争议和资金。本节探讨了引发这一热点的各种 NFT 解决方案。


    ## 复杂实体的数字识别


    NFT 首次为互联网上创建和表示可验证身份铺平了道路，而无需依赖中心点来验证身份。换句话说，有了 NFT，区块链网络上可以存在数字实体的唯一副本。


    ## 票务


    NFT 在票务行业中的应用是另一个快速增长的领域。区块链票务可以帮助活动组织者控制门票的总供应、跟踪持有者，并限制倒卖和其他形式的欺诈。


    有了 NFT 门票，伪造在技术上是不可能的；物理损坏也是可能的，而且门票的成本降低了。例如，在以太坊上铸造 NFT 仅需极小的燃料费。


    ## 许可与认证


    证书在功能上是非同质化资产。学士学位仅供个人使用，并且在该个人不在时它将变得毫无价值。它们是不可转让的资产，这是 NFT 的完美定义。


    通过 NFT 铸造认证和许可，很容易遏制伪造并确认证书或许可的真实性。事实上，机构可以轻松检查其员工许可的真实性。随着虚拟学习的开展，这将变得越来越重要。提供区块链开发课程的公司
    Zastrin 正在先地向其学生发放 NFT 认证。


    许可也可以使用 NFT 发放，并且感觉与更传统的许可没有区别。这将有助于解决员工使用虚假许可的问题，并为人力资源部门节省时间，因为这将显著减少验证的障碍。


    ## 域名


    域名是网站互联网协议 (`IP`) 地址的可读翻译。由于 IP 地址并不很易读，因此开发了域名注册机构来为它们提供一种可读的格式。例如，Google 的 IP
    地址是 `172.217.10.14`，这并不很易读。取而代之的是域名系统 (`DNS`) 注册表将其翻译为我们都记得的可读版本：`Google.com`。


    `DNS` 服务器在全球网络中运行，有助于浏览器将域名翻译为 IP 地址。此外，互联网服务提供商根据域域名规范将用户连接到相应的 IP 地址。


    全球 `DNS` 网络由互联网名称与数字分配机构 (`ICANN`) 控制。该机构处理整个域名系统的顶层开发和架构。有了这个系统，用户实际上并不拥有他们的域名：相反通常是由
    `ICANN` 租给给他们的，而 `ICANN` 又将其租给域名提供商。这意味着域名提供商对域名租赁金额有完全控制权，并可以决定从用户那里收回域名。

    '
