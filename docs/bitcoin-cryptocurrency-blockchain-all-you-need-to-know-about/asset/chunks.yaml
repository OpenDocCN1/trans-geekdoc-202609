    of the ruling class has just begun.^([8](#notes.xhtml#chapter6-8))


    At a Bank of England conference in September of 2017, IMF head Christine Lagarde,
    head of the International Monetary Fund (IMF), explained that cryptocurrency is
    not a fad, but a genuine innovation in money. Sheargued that it has profound implications
    for the future of financial intermediation and central banks. The entire credit
    machinery is premised on government printing and controlling the supply of money,
    and imposing legal tender on money through the banking system.^([9](#notes.xhtml#chapter6-9))


    ![Figure 06-02. Fiat as a Social Contract.](images/img-83.jpg)


    Figure 06-02. Fiat as a Social Contract.


    While the typical dynamics of fractional reserve banking (FRB) and the primary
    role of a central bank do not fully apply to cryptocurrencies, it is unnecessary
    to have a central bank for fractional reserve banking to occur in a cryptoeconomy.
    Cryptocurrency-based depository institutions would create economies of scale to
    lending. It’s interesting to note that Mastercard is seeking a patent for fractional
    reserve management of blockchain assets.^([10](#notes.xhtml#chapter6-10))


    Money is just paper with a government stamp that has value because people are
    forced to accept or believe that it does. The centralbank controls the value of
    fiat money. The fiat currencies in existence today have no intrinsic objective
    value and are merely electronic digits in computers.


    [Figure 06-02](#chapter6.xhtml#fig16) shows fiat as a social contract with the
    government as the power and the central bank as the trusted intermediary. [Figure
    06-03](#chapter6.xhtml#fig17) shows the corresponding Bitcoin social contract,
    this time with the government replaced by a regulatory foundation, and the trusted
    intermediaries represented as Bitcoin miners. In the case of Bitcoin, note how
    the agreement between the parties manifests as a software- based consensus algorithm.


    Another example of a social construct is designer goods. Consider how Chanel,
    through its influencers (celebrities), dictates the value of its bags to consumers.
    They are really paying for a little certificate of authenticity, which normally
    accompanies the bag. Objectively, it is becoming the only way you can distinguish
    between the $6,000 original and a $300 Chinese fake. Yet the irrational consumer
    buys this bag, putting thousands of dollars in the bank account of a multimillionaire,
    while the bag probably becomes their most expensive asset.


    ![Figure 06-03. Bitcoin as a Social Contract.](images/img-84.jpg)


    Figure 06-03. Bitcoin as a Social Contract.


    In this contract, Chanel plays the part of the regulatory power. It effectively
    delegates the role of managing the meaning and value of its goods to the celebrities
    and influencers as trusted intermediaries. Consider also how we not only assist
    in creating these constructs but also act according to them through exchange.


    ## Bitcoin


    We will learn later how kings that owned currency mints caused inflation through
    debasement. Throughout history, governments have often used their power to confiscate
    accounts and block certain groups of people from transacting. Governments have
    even caused hyperinflation by creating an excessive supply of money.


    When Satoshi Nakomoto invented Bitcoin, he introduced innovative changes that
    effectively deconstructed the fiat construct. Leveraging the technology of blockchain,
    he instituted a nonprofit blockchain foundation as the power component providing
    oversight, ending the need for government.^([11](#notes.xhtml#chapter6-11))


    The foundation, in turn, delegates the role of security to Bitcoin miners as “toothless
    commodity providers,” that follow a softwarebased Bitcoin protocol. A consensus
    algorithm agreed upon by the society of Bitcoin users, parties to the construct,
    determine the rules of the Bitcoin protocol. Trust in government is replaced by
    trust in the protocol, which enforces the consensus algorithm put in place by
    the social layer.


    With the Bitcoin protocol, Satoshi, in one fell swoop, solved the problems inherent
    in government control by implementing inflation, counterfeit, and censorship resistance.^([12](#notes.xhtml#chapter6-12))
    Just as in fiat currency, the Bit coin token itself has no value; it is in fact
    nothing more than a number in a ledger.

