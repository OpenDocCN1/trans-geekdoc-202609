    # 比特币 vs 央行数字货币 (CBDC)


    比特币一直在进行一场艰苦的战斗，试图证明自己能够并且应该取代传统的法定货币。在中国，这正是加密货币正在做的事情。与比特币不同，这种货币由中国政府发行，被称为央行数字货币（`CBDC`）。上一章提到了
    `CBDCs`，但比特币与 `CBDCs` 之间重要的区别在于，后者是非中心化的。虽然还有其他关键区别，但至关的一点是，`CBDCs` 并不存储在网络链上：它们由国家的中央银行存储、分发和管理。关于
    `CBDCs` 的另一个重要点是它们不是稳定币。它们不是与该国主权货币挂钩的数字货币，而是实际上是该国家的货币。


    ## 央行数字货币的优势


    `CBDCs` 的优势在于它们有该国政府的支撑。目前，当中央银行想要将货币投入流通时，它会发行新货币并用其扩大商业银行的储备。银行通过部分准备金制度支出这些资金，新货币最终进入经济。有了
    `CBDCs`，新货币将直接从中央银行传输到公民的数字“口袋”中。


    ## 数字人民币（中国）


    中国的 `CBDC` 被称为数字人民币。它于 2020 年 4 月首次创建，以来已有 2080 万中国公民创建了自己的数字人民币钱包。它现在已遍及中国十一个城市和省份，促进了这些地区近
    7100 万次交易。


    中国政府对数字人民币有多个目标：第一个是对数字人民币进行中心化控制，这意味着它可以更好地影响货币政策、冻结账户并修复货币转账错误。考虑到传统加密货币的去中心化和匿名性，这将是不可能的。


    有一些推测认为，数字人民币的一个未披露的目标是削弱美元在全球的统治。今天，数字人民币主要用于国内交易，特别是作为简化零售购买和在新冠肺炎期间促进更多经济活动的一种。


    ## 全球货币储备与美元


    2019 年，全球贸易额超过了 19 万万亿美元。美元目前是全球最大的储备货币，自二世界大战结束以来的七十五年来一直是如此。这主要归功于美国经济的增长和整体实力。全球对美国偿还债务有很大信任，因此美元被认为是存储国家储备的最安全货币。


    作为全球储备货币意味着世界各地的中央银行持有大量美元。他们这样做是为了避免在参与国际贸易交易时转换不同的货币。美元占全球货币储备的约 60%，用于全球 75%
    的交易^(9)（参见图 10-03）。


    ![图 10-03. 按货币分配的储备](img/img-130.jpg)


    图 10-03. 按货币分配的储备。


    各国必须持有美元才能进行贸易这一事实产生了对美元的巨大需求。这使得美国能够廉借，并有助于维持美元的高位。


    ## 人民币的未来


    一旦中国实施数字人民币跨境交易，这种货币就有潜力与美元竞争全球储备货币。中国的目标可能是推动其他国家增加人民币储备以进行更有效的贸易，从而使美元面临失去主导地位的风险。


    2020 年人民币仅占全球储备的 2%。然而，去年美国 GDP 萎缩了约 3%，而中国增长了 2%。这意味着中国渴望在全球经济中发挥更大的作用，而数字人民币可能是实现这一点的手段（参见图
    10-04）。


    数字人民币的另一个重要方面是它对加密货币整体日益增长的影响的贡献。加密货币具有改进现代社会货币当前角色的品质。同时，政府担心其主权货币的完整性。每个国家都在采取自己的方法处理这个问题，中国目前可能是最积极的。


    ![图 10-04. 数字人民币可以替代 16 万亿美元的存款](img/img-131.jpg)


    图 10-04. 数字人民币可以替代 16 万亿美元的存款。


    ## 中国的监管


    中国的参与是一把双刃剑。中国政府第一次尝试监管比特币是在 2013 年。当时比特币的价格刚刚达到 1,000 美元。金融体系仍将其视为“泡沫”，大多数公众对这种新形式的货币仍然不知。


    但中国政府意识到一些公民正在将比特币作为支付手段，中国人民银行宣布不允许任何银行开展比特币业务业务。当比特币在 2017 年由于价格飙升而最终进入主流媒体和公众意识时，中国禁止了所有使用加密货币的本地交易所。促进加密交换的平台不再允许在中国设立。这一禁令导致大型交易所
    `Binance` 迁往开曼群岛。


    2021 年 5 月，中国禁止金融机构和支付服务与加密货币交易。这意味着这两个行业向客户提供的任何服务都不能通过加密货币进行。


    '
