  trans: '


    数十亿个人以及数百万小企业和企业家面临着高昂的金融交易成本以及连接全球市场的其他障碍。此外，即使在美国，每四个人中就有一个人没有银行账户或服务不足。世界银行的数据显示，这一数字在全球范围内高得多，约有
    17 亿成年人没有银行账户或服务不足。没有银行账户的人在获得工作、住房、教育和医疗保健等必需品方面更有困难。


    与 Facebook 相关的 Diem 协会承诺利用区块链技术来促进金融包容，让人们能够以低成本立即存储、储蓄并安全移动资金。


    马克·扎克伯格曾提议使用 `Diem` 加密货币来缓解全球贫困。然而，这种方法的问题在于，大多数没有银行账户或服务不足的人甚至没有足够的钱来开设银行账户。那么，`Diem`
    如何期望他们首先购买加密货币呢？


    虽然技术确实可以缓解高昂的金融交易成本，但它仍然没有解决小企业企业家面临的贫困问题以及创业资金受限的问题。


    贫困的一个原因是缺乏银行设施。另一个原因是缺乏对财产的法律所有权。许多生活在贫困中的人实际上拥有房屋、土地、农作物和企业，但缺乏代表所有权或注册证明的契据或文件。基于区块链的土地登记可以为世界上最贫穷的人们提供第一份真实的资产。注册的产权将使这些人能够获得新形式的抵押、信贷甚至外国投资。


    分布式账本技术是一种去中心化且共享数字数据的点对点网络；它基本上与中心化数据库相反。分布式账本技术在促进增长和变革微型金融行业存在以下机会：


    1. 提供一种验证借款人身份的新型创新方式。

    2. 创建共享且信任的信誉历史。

    3. 以以更安全的方式共享和维护敏感数据。

    4. 允许资金在借款人之间进行更廉、快速流动。


    在下一章中，我将解释为什么我们必须重新思考货币。我将描述发行自己的货币如何为小企业提供更多投资机会，并最终创造更健康的经济社区。


    # 04 为什么我们应该重新思考货币


    本章探讨了为什么重新重新思考货币。通过以特定国家作为案例，揭示了围绕传统法币货币的问题，例如通货膨胀和中央政府权力过大。书中还引入了如布里克斯顿法镑和 `Colu`
    等“社会货币”，以验证作为社区构建产物的货币如何解决传统法币带来的困境。`Bitcoin` 被作为一个案例研究提出，因为它是最常见的加密货币。当然还有许多其他加密货币，例如
    `Akoin`，这由嘻哈歌手 Akon 开发的新型加密货币，旨在为非洲新兴的企业家赋能，并为其他在塞内加尔规划城市提供动力。本章还讨论了美元如何成为世界上最强大的货币。


    ## 中央政府


    下方标题为“社会构建与道德的起源”的章节将讨论各方如何自愿进入合同。通常有规定基于合同交易的参与条款，其中包括有关各方权利和责任的信息。遗憾的是，并不是每个伙伴都值得信任，这种缺乏信任往往使得需要一个权力结构来执行合同条款。


    中心化权威建立了 `fiat`（法币），其运行基于强制性而非自愿的市场关系。权威通过试图消除或至少监管替代货币，实际上垄断了价值的交换。


    委内瑞拉的案例揭示了政府法币可能最危险的缺陷：它们让无能或腐败的领导人容易掠夺国家的财富。所有当局需要的只需要打印更多货币。无能的公民只能选择接受这些贬值的纸币。


    普通人受制于这个糟糕的系统，因为他们无法在国之外花费这些毫无价值的纸币。他们也没有将现金转移到国外的合适手段，因为没有人接受他们的国家纸币。


    另一个说明中央政府控制法币问题的例子发生在 2016 年 11 月 8 日。这一天，印度总理纳伦德拉·莫迪（Narendra Modi）宣布该国 86% 的现金毫无价值。莫迪在电视上告诉印度人，他们两张面值最大的钞票——500
    卢比（7.50 美元或 5.40 英镑）和 1000 卢比（15.00 美元或 10.81 英镑），从那一刻起毫无价值。在瞬间之间，莫迪向世界展示了国家法币的购买力可以被瞬间破坏或剥夺。


    加密货币最直言的反对者、前国际货币基金组织（IMF）首席经济学家肯尼迪·S·罗格夫（Kenneth S. Rogoff）也是政府发行法币的批评者。哈佛大学公共政策教授罗格夫建议政府完全废除纸币。罗格夫指责世界各国央银行通过出售纸币获利并剥夺合法企业的现金，从而助长了黑市。


    尽管罗格夫在《项目辛迪加》专栏中谴责 `Bitcoin` (`BTC`) 为“加密傻瓜的黄金”，但他认为现今的法币更糟。罗格夫相信政府最终将用国家加密货币取代法币。他预测政府将仅仅是接管加密货币。从历史上，银行打印纸币，但最终政府接管了这一过程，因为他们是国家的统治实体。


    法币运作允许那些任意控制货币的人通过改变货币的可用性、数量和分布来重新分配购买力，从而分配财富。


    ## 法币汇款


