- raw: 'Blockchains can utilize numerous languages for smart contract execution, which
    fuels apprehensiveness towards its adoption. To begin with, having multiple languages
    makes it harder for parties to find representatives knowledgeable in both the
    conditions of the contract and the coding language. As a result, third parties
    must get involved in the development of the contract, which can cause some clients
    to lose trust. The client is unsure if their needs are being met. Their intended
    representative had to outsource the contract development to a software engineer,
    because the representative cannot read the developed contract code himself.


    ## Ethereum Solidity


    To help alleviate the problem of numerous languages utilized by blockchain for
    smart contract execution, Ethereum established a universal smart contract coding
    language called Solidity. Solidity is an object- oriented programming language
    that is used to create smart contracts for use on the Ethereum blockchain network.
    Any program designed with Solidity can run on the Ethereum blockchain by using
    the Ethereum Virtual Machine (EVM) to upload it.^([28](#notes.xhtml#chapter11-28))
    An uploaded program or application is referred to as a dApp or *decentralized
    application.* Once on the EVM, dApps process via compile-time instead of run-time
    and use Ether to execute transactions.^([29](#notes.xhtml#chapter11-29)) Ether
    is a token that is mined and required to pay for program transactions. It is like
    fuel needed to run a vehicle.


    The Enterprise Ethereum Alliance (EEA) was founded in 2017.^([30](#notes.xhtml#chapter11-30))
    Ethereum’s blockchain network has gained a lot of attention over the past couple
    of years, and they are revolutionizing the smart contract industry. In fact, as
    of September 2021, over 3,000 dApps run on the blockchain.


    The EEA connects significant enterprises, such as Microsoft, with the Ethereum
    blockchain. Its mission is to be an open-source standard and to address enterprise
    deployment requirements. As it is an opensource platform, any code created by
    a company is available for all others to see. A benefit of this is that the EEA
    can reduce technology deployment costs for both other large enterprises as well
    as for small businesses.


    To date, the EEA spans over forty-five countries and is composed of nineteen different
    technical, industry, and legal advisory teams. As such, the EEA is the leading
    actor in the blockchain smart contract industry and is setting the foundation
    for how smart contracts will be written, implemented, and addressed legally. For
    example, it has specific rules for using the Ethereum blockchain, an intellectual
    property rights policy, confidentiality and nondisclosure policies, and antitrust
    policies. Furthermore, it advocates for Know Your Customer (KYC) and AML regulations.


    ## Token Taxonomy Framework (TTF)


    The most significant contribution of the EEA has been its Token Taxonomy Framework
    (TTF), which outlines specific token terminology and offers a method for creating
    tokens that can be used to drive smart contracts.^([31](#notes.xhtml#chapter11-31))
    The TTF is based on its token definitions, which outline specific components needed
    by a business for various purposes.


    The TTF is available on GitHub, which is a public repository where developers
    can obtain the framework. The framework contains a token template that facilitates
    automatic code generation that can be verified and certified.^([32](#notes.xhtml#chapter11-32))
    A reference document is then created for each token, which explains its structure
    and usage in simple language that all business developers can understand.


    The TTF sets standards to tokens, and many enterprises have started to adopt the
    framework for their own tokens. For example, Digital Asset has begun to apply
    the TTF for DAML smart contracts. DAML is a development framework for creating
    systems of record that securely connect across business processes and data boundaries
    while retaining privacy, guaranteeing data integrity, and enforcing strict authorization.
    Allowing such systems to cross boundaries—legal, regulatory, organizational, or
    other—enables them to form seamless economic networks.^([33](#notes.xhtml#chapter11-33))
    To help enterprises mint their own Ethereum tokens, Microsoft recently announced
    TTF support for Azure Blockchain Tokens.^([34](#notes.xhtml#chapter11-34))


    ## Real Property Records


    Another application of blockchain technology is in real estate transactions. Presently
    disputes over property sales and property transference overwhelm court systems.
    There are too many statutes that vary from state to state and too many defeasible
    estates.^([35](#notes.xhtml#chapter11-35)) A defeasible estate is created when
    a grantor transfers land conditionally. Upon the happening of the event or condition
    stated by the grantor, the transfer may be void or subject to annulment. (An estate
    not subject to such conditions is called an indefeasible estate.) Historically,
    the common law has frowned on the use of defeasible estates, as they interfere
    with the owners’ enjoyment of their property and make it difficult to create a
    valid future interest. Blockchain technology could help to reduce these disputes
    through a public real estate record system. In such a system, buyers could document
    deeds directly on the blockchain. The deeds would be time-stamped, and because
    of blockchain’s ability to prevent tampering, deeds could not be added twice.


    A blockchain real estate record system could provide the necessary provenance
    for validating and verifying the identities of property owners and the corresponding
    title deeds. Integrating such a system with financial institutions would enable
    lenders to check that purchasers have the funds needed to complete the real estate
    sale. Overall, this would add protection for both buyers and sellers.


    In Illinois, blockchain has already been implemented to track property sales and
    transfers.^([36](#notes.xhtml#chapter11-36)) So far, it has been a success and
    has even helped to clear up legal disputes involving incorrect information. These
    disputes are easiest to close with blockchain, as all input to the record is traceable
    and cannot be reversed.


    Another benefit this system has been shown to have is its potential to remove
    the need for title insurance.^([37](#notes.xhtml#chapter11-37)) Title insurance
    is a type of indemnity insurance that protects its policyholder from losses that
    can be incurred from defects in a property title.^([38](#notes.xhtml#chapter11-38))
    The cost of title insurance varies but is generally at least $1,000.


    Smart contracts can also be used in conjunction with blockchain record keeping
    for automating sales, tax payments, and deed recording. These contracts can use
    a form of escrow to demonstrate to sellers and buyers that their funds or assets
    are verified and authentic and can be released.


    Smart contracts could be used to speed up the mortgage approval and settlement
    process by codifying instructions and automating current manual workflows.^([39](#notes.xhtml#chapter11-39))


    ## Financial Transactions


    The financial industry currently operates with centralized authority control,
    which means hackers need to compromise only a single point of entry. As a result,
    a financial hack, such as the theft of money, would cause suffering for all the
    bank’s clients. The best way for financial institutionsto reduce the risk of attacks
    is to switch to a distributed ledger technology or blockchain.'
