- raw: 'The most notable example of this recently was the appearance of Tesla and
    SpaceX CEO Elon Musk on the American late-night show *Saturday Night Live.* Musk
    had already been quite vocal about crypto, and more specifically Dogecoin, on
    his social media months before his appearance. In the month leading up to the
    show, Dogecoin prices rose steadily, increasing by over 600 percent. This was
    mainly due to the anticipation that Musk was going to mention the cryptocurrency
    on the national stage.


    However, fans and speculators were both mistaken. Musk joked about the cryptocurrency
    in a skit during the show, sending traders into a frenzy. Dogecoin dropped nearly
    30 percent in value afterward. The popular stock and crypto exchange Robinhood
    experienced so many transactions that the platform crashed in the middle of the
    panic.^([16](#notes.xhtml#chapter1-16))


    Although most people can agree that the power these influencers have is unfair
    and should have no place in crypto trading, as of now it is a reality. Staying
    on top of the loudest voices in crypto and paying attention to what they are writing
    and saying is an important part of an overall strategy to protect one’s portfolio.


    ## Time to Get Trading: Picking a Currency


    After obtaining ample background information on crypto trading, its components,
    and how to navigate it, the time finally comes to pick a cryptocurrency to invest
    in. One very useful resource for finding a cryptocurrency worth investing in is
    [Messari.io](https://messari.io/).^([17](#notes.xhtml#chapter1-17)) This database
    has pricing, data, and research from top crypto analysts for a wide range of cryptocurrencies,
    blockchains, smart contract applications, and much more. Messari provides the
    price, market cap, and supply of all the cryptocurrencies covered on its site.
    All this information is there to assist traders who are looking for crypto to
    invest in. For traders looking to invest in utility tokens, Messari provides many
    metrics on the standings of certain blockchains.


    ## Need More Guidance? This Will Help


    While this chapter goes in-depth into all the different aspects of cryptocurrency,
    taking the leap into investing can still be difficult for anyone, even someone
    with considerable background knowledge. For such individuals there are several
    courses that can provide help. Investopedia researches the best courses for beginners;
    advanced traders looking for more insight; those looking for a more passive role
    in crypto; and traders on a budget. These courses are available on platforms such
    as Udemy and LinkedIn Learning. Both of these sites are very approachable and
    easy to navigate. The Haas School of Business at the University of California,
    Berkeley has a fantastic course on implementing blockchain technology designed
    for those getting into business. There are many resources online to assist in
    the process of crypto trading.


    # 02 Opportunities for Careers and Business


    The goal of this chapter is to review the different careers that are related to
    cryptocurrency and the innovative technology of blockchain. It will discuss the
    most lucrative careers in these fields and the process for entry.


    Companies such as Microsoft and Facebook are getting involved with cryptocurrency
    and blockchain, creating new jobs and leveraging the technology. For those interested
    more in entrepreneurship, this chapter will also explore the potential opportunities
    for small businesses.


    Beyond career options, this chapter will explore the intricacies of cryptocurrency
    mining. With the growth of cryptocurrency in recent years, mining methodology
    is being examined and critiqued, and it will likely see changes soon.


    ## Blockchain Careers: Are They Lucrative?


    Blockchain jobs are in high demand, and with the right skill set, employers guarantee
    a sizable paycheck. Most blockchain experts earn above six figures annually.


    As of August 2021, an analysis via Burning Glass,^([1](#notes.xhtml#chapter2-1))
    which collects and analyzes millions of job postings from across the United States,
    predicts that demand for blockchain-related jobs will grow 24.6 percent over the
    next ten years. On the popular freelance site UpWork. com, blockchain skills are
    ranked number one in fastest-growing skills desired, up 6,000 percent from 2010.
    The global blockchain market size is currently around $3 billion, and it is estimated
    to reach nearly $40 billion by 2025.^([2](#notes.xhtml#chapter2-2)) This indicates
    a booming market with a compound annual growth rate of nearly 70 percent. This
    is due to blockchain’s ability to penetrate so many spheres of business. Cryptocurrency
    experts are also in high demand thanks to the intersection offinance and technology
    in this field.


    This section will go in-depth into the expertise required for a job in blockchain.
    It is imperative to understand that people cannot enter a blockchain career easily.
    However, the means to prepare for a career in this field are readily available.
    Blockchain is a highly innovative technology, and it is an industry that experts
    expect will infiltrate many areas of business. It thus requires creative individuals
    who are willing to think outside the box.


    Blockchain is much more than a career path. The entire foundation of blockchain
    and cryptocurrency is centered on challenging current business models. Alongside
    dedication to learn and succeed, a career in this field also requires its workers
    to believe in the vision of b lockchain. While blockchain future has a very promising
    future, this past year has been paramount for it.


    Banks, tech firms, startups, and even governments are all seeking blockchain specialists.
    The most prestigious position relating to blockchain is *blockchain developer.*
    These are the individuals who can design andprogram blockchains and smart contracts.
    According to the Blockchain Academy, as of April 2021, the increase in global
    demand for blockchain developers was up by 300–500 percent yearly. Thus, every
    company that wants to enter the field is looking for a team of developers. The
    average salary for a blockchain developer ranges from $150,000 to $170,000.^([3](#notes.xhtml#chapter2-3))
    Developers working in areas like New York City and San Francisco are earning nearer
    $200,000 a year. They typically have a degree in either computer science or mathematics
    and must be highly skilled programmers. Blockchain developers who are actually
    building the blockchain must specialize in either Solidity or C++ (see [Figure
    02-02](#chapter2.xhtml#fig7)), while devel opers who make decentralized applications
    must specialize in smart contract languages such as Solidity.^([4](#notes.xhtml#chapter2-4))


    ![Figure 02-01. Blockchain Careers.](images/img-41a.jpg)


    Figure 02-01. Blockchain Careers.


    ![Figure 02-02. Blockchain Programming Languages](images/img-41b.jpg)


    Figure 02-02. Blockchain Programming Languages


    The second lucrative blockchain career is working as a *blockchain data scientist.*
    Data science is already one of the fastest-growing majors and, coupled with a
    specialty in blockchain, attracts high demand and a high salary.^([5](#notes.xhtml#chapter2-5))
    The average salary for a blockchain data scientist is between $170,000 and $180,000.
    The day-to-day tasks of a blockchain data scientist consist of analyzing the blockchain
    and presenting them as statistical representations. These individuals are well
    versed in the technicalities of blockchain and must have coding experience.^([6](#notes.xhtml#chapter2-6))'
