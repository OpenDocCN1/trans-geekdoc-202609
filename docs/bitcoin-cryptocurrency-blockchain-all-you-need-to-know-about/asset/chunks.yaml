  trans: '

    Token 根据某些特征进行分类，这些特征构成了 Token 的 `base`（基础）。第一个特征是 `token type`（Token 类型）。Token
    有两种：`fungible`（同质）和 `nonfungible`（非同质）。同质代币具有相互交换的价值，因此任何数量与其相同系列或类别的等量 Token
    具有相同的价值。同质代币的例子是物理现金。非同质代币（NFT）无法与其相同类型的 Token 交换，因为它们的价值不同。非同质代币的例子是房产证。


    Token 的 `unit`（单位）是下一个用于定义它的特征。Token 单位可以是 `fractional`（碎片化）、`whole`（整数）或 `singleton`（单例）。碎片化
    Token 可以被划分为部分并以小数形式表示。整数 Token 仅用整数表示：它们不允许细分。单例简单地表示为数量一，且没有细分。


    `Value type`（价值类型）是 Token 身份的第三个特征。Token 可以是 `intrinsic`（内在）或 `reference`（引用）类型。内在意味着
    Token 本身持有价值，而引用类型则指向其他价值来源。


    `Representation`（表示）是另一个定义 Token 的特征。表示可以是 `common`（通用）或 `unique`（唯一）。通用 Token
    共享属性并存储在一个中心位置。相比之下，唯一 Token 具有独特的特征并可以被单独追踪。


    最后的 Token 特征是 Token 的 `template`（模板）。模板可以是 `single`（单一）或 `hybrid`（混合）。单一 Token
    由一个父级制成，而混合 Token 则将一个父 Token 与一个或多个子 Token 结合起来创建。


    除了 Token 特征外，TTF 提供了一个基于复用部分创建 Token 的组合框架。这些部分是基础 Token 类型、Token 属性和 Token 行为。这些部分被进一步细分，其残留组件被称为
    `component artifacts`（组件构物）。组件构物最终组合以完成 Token 的创建。


    TTF 的 Token 模板决定了 Token 中存在的组件构物的类型。该模板由模板公式和模板定义组成，后者衍生自模板公式。Token 模板描述了 Token
    将如何被使用，由可重用的基础类型、行为、行为组和属性组成。


    Token 的属性指的是 Token 如何包含数据以及它如何记录其数据。Token 行为可以是：


    1. `Transferable`（可转移），意味着所有权可以转移。

    2. `Nontransferable`（不可转移），意味着所有权不能转移。

    3. `Subdividable`（可细分），意味着 Token 可以以小数存在。

    4. `Singleton`（单例），意味着 Token 由数字 1 组成。

    5. `Mintable`（可造），意味着 Token 可以被创建。

    6. `Role supported`（支持角色），意味着 Token 定义了角色以限制或允许特定操作。

    7. `Burnable`（可销毁），意味着 Token 可以从供应中移除。


    Token 行为组反映了根据相似用法组合的行为。例如，`Supply Control`（供应控制）是由 `mintable`（可造）、`burnable`（可销毁）和
    `role support`（支持角色）行为组成的行为组。


    模板定义包含了根据模板公式建立的定义。尽管其外观复杂，但模板定义是易于使用的。以下是 Token 定义的示例，构成了 Token 的规格。


    [图 09-01](https://wiki.example.org/img-116.jpg) 模板公式。


    [图 09-02](https://wiki.example.org/img-117.jpg) 模板定义。


    “该框架允许业务人员在不编写任何代码的情况下创建 Token。”


    ## 小微金融：解决流动性问题


    小微金融是一种面向低收入客户的金融服务，帮助他们增加收入。服务包括信贷额度、保险基金、贷款和储蓄账户。大多数符合小微金融条件的是小型企业和低收入创业者。


    通过共同责任联系来缓解贫困。然而，许多计划只加剧了低收入群体与贷款人之间的紧张关系，导致了更大的收入不平等，这直接违背了小微金融的宗旨。


    另一个问题是小微金融机构（MFI）监管松散。此外，只有少数 MFI 符合汇款要求。此外，寻求小微金融的客户通常缺乏融资的押品。


    这种小微金融的缺陷导致大多数低收入人士只能储蓄。储蓄意味着积累获取商品所需的全部价值，然后获取它。低收入者对昂贵活动的需求加深了贫困线，使他们不得不寻求高利贷，或者更糟糕的是完全放弃融资。


    ## 区块链起源的去中心化身份


    区块链技术中的身份基于去中心化公钥基础设施（DPKI）。DPKI 衍生自公钥基础设施（PKI），后者由管理机密和个人信息的特定策略、硬件、软件、协议和设定角色组成。

