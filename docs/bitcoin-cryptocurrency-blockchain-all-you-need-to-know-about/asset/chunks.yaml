    or a `CBDC`. This currency is issued on a blockchain, and it comes with multiple
    benefits. CBDCs allow the government to distribute currency simply via the Internet,
    and the unbanked can be included in the financial system.^([2](#notes.xhtml#chapter2-20))
    Banks such as Goldman Sachs and JPMorgan, and even the U.S. government, are looking
    to create their own `CBDCs`. Individuals with expertise in the intersection of
    cryptocurrency and economics are in high demand at places such as these.


    ![Figure 02-06. NFT Collectible Rankings by sales Volume.](images/img-50.jpg)

    Figure 02-06. NFT Collectible Rankings by sales Volume.


    ## Cryptocurrency Mining: Why It Matters and Where It’s Going


    Typically, cryptocurrency and blockchain operate on a decentralized ledger. No
    single computer system controls the production or data storage of the currency.
    In theory this prevents the blockchain from being hacked or any entity from controlling
    or manipulating cryptocurrencies. The problem with this model is in the production
    of the computers that mine cryptocurrency. These computers also house the blockchain
    (see Figure [02-07](#chapter2.xhtml#fig12), next page). There are two types of
    computers, general-purpose ones, like Windows computers or Apple Macbooks, and
    computers designed to run just one specific application. The latter are known
    as application-specific integrated circuits or `ASICs`. They are extremely efficient
    at performing one task.


    As is common in capitalism, one company has established itself as the best manufacturer
    of these `ASICs` in terms of cryptocurrency: the Chinese Bitcoin mining giant
    Bitmain. This circumstance has centralized the distribution of blockchain technology,
    potentially threatening the blockchain’s integrity. It is feared that Bitmain
    may have a monopoly on the production of Bitcoin. As previously discussed, the
    immutability of blockchain technology is only threatened if one entity controls
    51 percent of the ledger. In an ideal decentralized system, mining computers would
    be operated independently, and it would be almost impossible to hack more than
    half of the computers operating the blockchain.


    ![Figure 02-07. Cryptocurrency Mining.](images/img-52.jpg)

    Figure 02-07. Cryptocurrency Mining.


    In Rockdale, Texas, a town of 5,600 people, two of the biggest names in Bitcoin
    mining are battling it out for market share and cheap electricity. Bitdeer—a firm
    spun off from Bitmain—is four-tenths of a mile down the road from Riot Blockchain,
    one of the biggest publicly traded Bitcoin mining companies in America.


    Another major issue with Bitcoin is its energy consumption. In February 2021 Elon
    Musk’s company Tesla began accepting Bitcoin as payment. A few months later, Musk
    announced that Tesla would no longer accept Bitcoin as payment, because of the
    massive amounts of energy used in its production (see [Figure 02-08](#chapter2.xhtml#fig13)).
    This ties back to the `ASICs`, as the operation of these computers is very energy
    intensive, and they operate largely on fossil fuels. These computers consume more
    energy in a year than the country of Sweden.^([21](#notes.xhtml#chapter2-21))
    Moving the energy consumption of Bitcoin to climate-friendly fuel is difficult
    because of the decentralized nature of Bitcoin; it’s impossible to mandate green
    energy when there is no governing power for Bitcoin operation.^([22](#notes.xhtml#chapter2-22))


    ![Figure 02-08. Bitcoin Consumption Comparison by Country.](images/img-53.jpg)

    Figure 02-08. Bitcoin Consumption Comparison by Country.


    Both of these problems can be solved by a system known as proof of stake. The
    original model of Bitcoin is known as proof of work (`POW`), which requires huge
    amounts of energy consumption to fuel computational power (see [Figure 02-09](#chapter2.xhtml#fig14),
    next page).


    Proof of stake avoids the energy-intensive computation required by `POW`, and
    cryptocurrency miners can mine or validate block transactions based on the number
    of coins a miner holds. When an individual wants to make a transaction, the supplier
    and receiver enter a certain amount of currency into what can be visualized as
    an escrow. Separate users unrelated to the transaction also enter their stakes,
    and their computers verify each block in the blockchain. If an error appears,
    it means that someone was attempting something fraudulent, and the network then
    distributes that user’s stake.


    ![Figure 02-09. Proof of Work vs. Proof of Stake.](images/img-54.jpg)

    Figure 02-09. Proof of Work vs. Proof of Stake.


    # 03 The State of Poverty


    Every entrepreneur who has the potential to succeed should have the support necessary
    to start and grow a business. Lack of access to bank lending and investment capital
    is one of the primary barriers faced by entrepreneurs. Consider the fact that
    90 to 95 percent of entrepreneurs require at least some financing to start their
    businesses, while only a small percentage of them have access to capital at the
    time of startup.^([1](#notes.xhtml#chapter3-1))


    Is the economic system rigged heavily in favor of the powerful? Overall, the state
    of inequality in race, ethnicity, and income level helps explain why a large majority
    of Americans believe it is. Nowhere in the United States is the disparity between
    the rich and the rest more prevalent than in and around Silicon Valley. The Valley
    is said to routinely discriminate based on race, gender, and age.^([2](#notes.xhtml#chapter3-2))


    Entrepreneurs that come from a low-income background, without initial or preexisting
    wealth, also face serious barriers to raising capital, as well as liquidity constraints.
    Research shows that in the United States already wealthy individuals are far more
    likely to start businesses than other income groups, and that personal and household
    wealth are essential drivers to entry.


    ## Technology Fuels Inequality


    The Internet has been an enormous source of wealth for a tiny minority of highly
    successful entrepreneurs, who monetize data from consumers. While the technology
    revolution has created a vast amount of wealth, that wealth is concentrated in
    large companies, making it increasingly difficult for entrepreneurs to innovate.
    Furthermore, the winner-takes-all dynamic of the digital economy only contributes
    to strongly monopolistic markets. For example, companies like Facebook, Google,
    Apple, and Amazon are disintermediating incumbent industries and stifling new
    ones through the sheer brute force of their fiscal power.


    New entrepreneurs and inventors can find innovating to be a tricky process as
    they compete against the existing monoliths, which have the resources to bring
    new ideas to market swiftly and thereby squash competition.


    Technology does not cause income disparity but enables increased efficiency and
    wealth creation. The problem is how we choose to distribute the wealth and benefits
    of increased productivity. So far we are not doing a good job in this area.^([3](#notes.xhtml#chapter3-3))


    ## Inequality Due to Financial Exclusion

