    ## Top DeFi Trends in 2021


    Given some of the critical roadblocks, one must remember that DeFi is still an
    evolving space with research being undertaken to overcome the possible limitations.
    Currently, DeFi exists more like an experimental space rather than an operating
    professional financial system. So you can expect new trends to appear frequently.
    Here are some of the top DeFi trends you should look for in the near future.


    1.  Liquidity mining, also known as yield farming. This scheme aims to solve the
