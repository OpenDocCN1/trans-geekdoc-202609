- raw: 'Next, PKI includes a *registration authority,* which is responsible for processing
    and authenticating requests for digital certificates. A final measure for security
    is its use of *trusted third parties* (TTPs). A TTP acts as the ultimate validation
    authority by identifying entities on the certificate of authority based on supplemental
    data it has about the entity.^([24](#notes.xhtml#chapter9-24)) Trusted third parties
    provide safer transactions for both buyers and sellers.


    Despite these three layers of identity verification, PKI can still be compromised.
    The most vulnerable component of a PKI is its trusted third parties. These parties
    can be corruptible points of failure due to *man-in- the-middle attacks.* A man-in-the-middle
    attack occurs when an attacker intercepts a communication between two parties
    and either steals the information for malicious purposes or changes that information.^([25](#notes.xhtml#chapter9-25))


    ## Identify Formulation in DPKI


    The best way to protect identities is by using DPKI. Here identity registration
    is established and maintained by the individuals who own the identity on a blockchain
    network. Therefore the blockchain network acts as an identifier registry, assuming
    the owner of the identity retains control of their private key.^([26](#notes.xhtml#chapter9-26))


    In DPKI, private keys are generated directly to the identity owner over its decentralized
    ledger and maintained using software.^([27](#notes.xhtml#chapter9-27)) The registered
    identifier is then given a keypair for registering and updating their data linked
    to the identifier and public keys, which act as the identifier’s subkeys. Subkeys
    are used by identity owners to sign communications.^([28](#notes.xhtml#chapter9-28))


    ## Personal Identity Hubs


    Many people agree that DPKI’s most significant application is in regard to *personal
    identity hubs.* A personal identity hub holds all data for a specific individual
    and allows that individual to control all their information directly.^([29](#notes.xhtml#chapter9-29))
    For example, say a patient needs to send hospital records to their primary physician
    for review. The patient must contact the hospital and then wait on it to send
    the physician its files. The medical history is transmitted directly from the
    hospital to the physician without the patient obtaining a copy.


    If personal identity hubs were developed for medical data, a digital record of
    the patient’s data would exist on the patient’s hub so that they could send the
    information directly to their physician or anyone else. Furthermore, the patient
    would be able to pull up such records at any moment for review. Instant access
    can be a lifesaving technology. For instance, if someone were to get into an accident
    and be knocked unconscious, they would be unable to share their medical history.
    However, having a personal identity hub could give emergency care providers access
    to information—such as specific medical conditions or allergies to certain medications—that
    may be critical to saving the person’s life.


    [Figure 09-03](#chapter9.xhtml#fig22) illustrates a decentralized identity hub
    for medical records.


    Personal identity hubs not only give individuals quicker access to their data
    but can be used for identification, which is a major advantage, considering that
    approximately 1.7 billion people around the world haveno proof of identity. Providing
    these people with identification can help them to engage in transactions within
    an economy.


    ![Figure 09-03. A decentralized identity hub.](images/img-121.jpg)


    Figure 09-03. A decentralized identity hub.


    A big argument against personal identity hubs is that they shift security burdens
    from the companies currently housing data to the individual. However, taking advantage
    of the decentralized nature of DPKIs makes this process easier. For instance,
    because the DPKI uses a decentralized blockchain, data and identities can be stored
    directly with individuals on their devices.^([30](#notes.xhtml#chapter9-30))


    Furthermore, this process makes the overall network impossible to penetrate collectively
    and forces attackers to go after individual data stores. This type of attack is
    therefore not feasible, as the attacker would have no way of getting the private
    key. It would be unprofitable for the hacker.


    ## Digital Signatures


    DPKI also uses *digital signatures.* A digital signature is based on a cryptographic
    mathematical problem algorithm.^([31](#notes.xhtml#chapter9-31)) It is used to
    authenticate identities and adds integrity to data while demonstrating *nonrepudiation.*^([32](#notes.xhtml#chapter9-32))
    Nonrepudiation is an assurance that the sender of information is provided with
    proof of delivery and the recipient is provided with proof of the sender’s identity,
    so neither can later deny having processed the information.


    Digital signatures work by hashing, signing, and verifying data.^([33](#notes.xhtml#chapter9-33))
    Hashing data, regardless of size or type, means to convert it into a hash value
    that is the same length as all other hash values generated. The hashed data is
    then signed by its sender using public-key cryptography.


    Public-key cryptography enables the parties to verify that the data has not been
    tampered with. First, the sender’s data is encrypted with their private key. A
    message is sent along with the sender’s public key. The recipient then uses the
    sender’s public key to read the message.


    Integrity is assured because the sender can verify that the message was unchanged,
    as an altered message would generate a new signature. Authenticity is preserved
    because, assuming the sender is the only one with access to the private key used
    to create the signature, the message should only be from the sender. Finally,
    digital signatures guarantee against repudiation, as the sender cannot dispute
    whether a message was signed or not.


    ## Private Permissioned Ledgers


    A *private permissioned ledger* is a blockchain network where only authorized
    parties can add nodes.^([34](#notes.xhtml#chapter9-34)) They are the only ones
    with access to the data on the blockchain. It functions as a closed environment
    in which anyone can participate. The benefit of a private permissioned ledger
    is that that governance can be used to dictate the algorithm. Another advantage
    is that a select person or group of people can be held accountable for the data;
    however, this also means privacy becomes the responsibility of the ledger.


    Today many financial institutions abide by Know Your Customer (KYC) compliances.
    These compliances focus on making ure identitiesare known in transactions.^([35](#notes.xhtml#chapter9-35))
    However, a problem with these current systems is that it can take institutions
    a long time to verify all the documents submitted by a client. A private ledger
    with built-in KYC could shorten these long validation periods. If KYC were to
    be applied to private ledgers, data could be verified almost instantly. Furthermore,
    having KYC on the ledger helps enforce antibribery laws.


    Anti–money laundering (AML) compliance programs should also be standard on private
    ledgers, as they help to track illegal transactions.^([36](#notes.xhtml#chapter9-36))
    Money laundering accounts for 2 to 5 percent of global GDP, and cryptocurrency
    has a dark history of being at the center of many laundering schemes.^([37](#notes.xhtml#chapter9-37))
    Having AML compliance built into blockchains can help to reduce money laundering.


    In general, information on private ledgers should be on a need-to- know basis
    and regulated by all corresponding frameworks and compliances relevant to the
    ledger. Keeping data as private as possible is essential to preventing the greatest
    threats to such ledgers, such as quantum computing.'
