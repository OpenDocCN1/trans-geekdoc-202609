- raw: 'With the blockchain domain name system, domain owners are in full control
    of their domains via their private keys, with ownership evident in the public
    address. This gives full custody to the owner, and domain purchase is a one-time
    affair.


    Since domain names are nonfungible assets, like a fingerprint, NFT standards are
    how they are created on the blockchain. There have been typically 400 to 1200
    [NFT.com](https://nft.com/) domain names registered per day in recent months,
    and more than 30,000 NFT-related domain names reg istered in 2021.^([10](#notes.xhtml#chapter14-10))
    In March 2021, Unstoppable Domains, a company known for building blockchain domain
    names, sold the NFT domain “win.crypto” for about $100,000.^([11](#notes.xhtml#chapter14-11))
    “While anyone can buy a traditional domain name through a registrar, users cannot
    buy permanent ownership,” said the company’s cofounder Brad Kam. “Traditional
    website domains sell for an average of ten dollars, and require a yearly registration
    fee to renew the domain. The historic sale of ‘win.crypto’ shows that users see
    value in permanent, verifiable domain ownership.”


    With NFTs as a domain, owners can control activities on their domains with the
    use of their private key. The idea of domains as NFTs gives a website owner full
    sovereignty over their domain names, regardless of who endorses it or not. This
    will pave the way for absolute free speech for website owners.


    Also, the Ethereum Name Service^([12](#notes.xhtml#chapter14-12)) uses NFTs to
    provide a memorable Ethereum address, which you can send to someone to receive
    ETHs. With NFTs as a domain, instead of having a numeric address, you can have
    a readable wallet address bearing your name or whatever name you decide on.


    NFTs offer several money-making opportunities, as well as other nonmonetary incentives,
    across diverse industrial use cases. This section discusses these opportunities.


    ## Provenance for Copyright Ownership


    Like fungible cryptocurrencies, NFTs are great for representing ownership that
    is provable over a decentralized network. Since NFTs are ideal for representing
    ownership of peculiar and unique assets, they are also great for copyright ownership
    tokenization.


    Artists are now collecting royalties for the resale of their works after converting
    them to NFTs. As this space stabilizes, regulatory frameworks will emerge that
    will legally protect ownership of NFTs on the blockchain.


    At the time of this writing, NFTs were not recognized as embodying intellectual
    property rights. As the technology evolves, however, we will see the claim to
    ownership of properties like the IP copyright certificates and various high-end
    contracts allocated and sold on a blockchain as NFTs.


    ## Art Theft


    Although NFTs have several great opportunities, the emergence of NFTs have created
    an unregulated market for stolen digital art. For example, counterfeits of artworks
    have been minted and sold on Rarible and OpenSea, which are currently the two
    biggest NFT marketplaces.


    There have been several reported cases of artists finding their works on NFT auction
    sites on which they did not advertise them. Unfortunately, this has been on the
    rise, since there are really no universal standards for the verification of NFT
    ownership.


    ## Rising Carbon Footprint


    The Ethereum blockchain still hosts the first NFTs to gain mainstream adoption.
    Ever since the creation of Larva Labs’ CryptoPunks, the first ERC NFT, Ethereum
    has led the pace as the blockchain with the most NFT smart contracts onboard.
    At the moment, the Ethereum network is powered by proof- of-work (PoW) consensus,
    which is similar to Bitcoin.


    High transaction volume is reflected in high energy demand from the network, attracting
    more miners, hence creating a perpetual competition amongst miners as well as
    increased mining difficulty.


    According to cleancoin, a platform built to assess the climate impacts of proof
    of work blockchains, the entire Bitcoin has a carbon footprint comparable to that
    of New Zealand.^([13](#notes.xhtml#chapter14-13))


    ## Creating Your First NFT


    There are several ways to approach the creation of an NFT. For someone with ERC
    smart contract development experience, writing a smart contract based on the ERC-721
    standard is all it takes. However, many artists looking to mint their art into
    NFTs are not software developers, and this is where using an NFT marketplace comes
    in.


    There are several NFT marketplaces offering a user-friendly environment which
    allows creators to mint all sorts of NFTs without coming into contact with any
    form of programming. Like platforms such as Wordpress, which offer content web
    managers, an NFT marketplace provides artists with a user-friendly dashboard.


    In this section, we will go step-by-step through the process of creating an NFT
    on Rarible. There are several NFT marketplaces, but because it is popular and
    easy to use, I have chosen to use Rarible for this discussion.


    Simply go to the rarible.com website and click on “Sign In” from the header. You
    will be given several options of wallet type to choose from in the list. For this
    example, we will use Metamask wallet (see [Figure 14-02](#chapter14.xhtml#fig31)).If
    you don’t already have Metamask installed, you will be prompted to install it.
    For this tutorial, I accessed the [rarible.com](https://rarible.com/) website
    using the Chrome browser.


    ![Figure 14-02. Install MetaMask for Chrome.](images/img-188.jpg)


    Figure 14-02. Install MetaMask for Chrome.


    Click on the “Add to Chrome button” to install MetaMask ([Figure 14-03](#chapter14.xhtml#fig32)),
    and then click “Add Extension.” Metamask will then install behind the scenes.
    After the installation is complete, you will have the option to either import
    an existing MetaMask wallet or create a new one ([figure 14-04](#chapter14.xhtml#fig33)).


    ![Figure 14-03. Add to Chrome.](images/img-189a.jpg)


    Figure 14-03. Add to Chrome.


    ![Figure 14-04. Import or create a new MetaMask wallet.](images/img-189b.jpg)


    Figure 14-04. Import or create a new MetaMask wallet.


    Create your password as prompted ([Figure 14-05](#chapter14.xhtml#fig34)), making
    sure you take the necessary steps so that you don’t forget it. Take the time to
    watch the instructional video on how to secure your wallet. In particular, make
    a note of your secret recovery phrase. When you are done, click “Next.” On the
    next screen, you will be asked to confirm your secret recovery phrase.


    ![Figure 14-05. Create MetaMask password.](images/img-190.jpg)


    Figure 14-05. Create MetaMask password.


    After confirming your secret recovery phrase, go back to [rarible.com](https://rarible.com/)
    and click “Sign In.” Then click “Sign In with MetaMask,” and this time you will
    be prompted with your MetaMask wallet. Click on “Create” at the top of the Rarible
    website, and then “Sign In with Flow.” I chose Flow because it is listed as the
    cheapest for creating NFTs.) If you don’t already have a Flow account, you will
    be prompted to register with your email address. Follow the instructions, and
    then accept the terms and agreements.


    After connecting, go over to “Create” and choose the NFT type between “Single”
    and “Multiple.” The choice here will be “Single,” (see [Figure 14-06](#chapter14.xhtml#fig35)).


    ![Figure 14-06. Create a single item on Flow.](images/img-191a.jpg)


    Figure 14-06. Create a single item on Flow.


    After clicking on “Single,” you will be given the option to upload the digital
    file of the intended mint. You will need to have a digital file of your artwork
    ready to upload. The NFT that you create will become the digital title deed for
    your artwork.'
