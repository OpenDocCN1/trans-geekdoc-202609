    接下来，PKI 包含一个`registration authority`（注册机构），负责处理和验证数字证书请求。安全的最终措施是使用`trusted third
    parties`（信任第三方，TP）。信任第三方根据其拥有的关于实体的补充数据，识别证书机构上的实体，充当终极验证权威。信任第三方为买家和卖家双方提供了更安全的交易。


    尽管有这三层身份验证，PKI 仍然可能被破解。PKI 最脆弱的组件是其信任第三方。由于`中间人攻击`，这些实体可能成为易损坏的故障点。中间人攻击发生在攻击者截获双方之间的通信，并出于恶意目的窃取信息或更改这些信息时。


    # DPKI 中的标识公式


    保护身份的最佳方法是使用 DPKI。在这里，身份注册是由区块链网络上的身份所有者建立并维护的。因此，区块链网络充当了标识注册表，前提是身份所有者保留对其`private
    key`的控制。


    在 DPKI 中，`private keys` 直接通过去中心化账本生成给身份所有者，并使用软件进行维护。注册的标识将获得一个密钥对，用于注册和更新与其标识相关的数据以及`public
    keys`，后者作为标识的子密钥。`Subkeys`被身份所有者用于对通信进行签名。


    # 个人身份中心


    许多人认同，DPKI 最重要的应用是关于`personal identity hubs`（个人身份中心）。个人身份中心存储特定个人的所有数据，并允许该个人直接控制其所有信息。例如，假设患者需要将医院记录发送给主治医生进行审查。患者必须联系医院，等待医院将文件发送给医生。病史直接从医院传输给医生，而患者无需获取副本。


    如果为医疗数据开发了个人身份中心，患者数据的数字记录将存在于患者的中心中，这样他们就可以将信息直接发送给医生或任何其他人。此外，患者可以随时调出此类记录进行审查。即时访问可以是一项救命技术。例如，如果有人发生事故并昏迷，他们将无法分享自己的病史。然而，拥有个人身份中心可以为急救人员提供访问信息的机会——例如特定的医疗状况或对某些药物的过敏——这些信息可能对于救命至关重要。


    [图 09-03] 展示了用于医疗记录的去中心化身份中心。


    个人身份中心不仅让个人更快速地访问自己的数据，还可以用于识别，这是一个巨大的优势，考虑到全球约有 17 亿人没有身份证明。为这些人提供身份识别可以帮助他们参与经济中的交易。


    ![图 09-03. 一个去中心化身份中心。](img/img-121.jpg)


    图 09-03。去中心化身份中心。


    反对个人身份中心的一个主要论点是，它们将安全负担从目前存储数据的公司转移到了个人。然而，利用 DPKI 的去中心化特性使得这一过程变得更容易。例如，由于 DPKI
    使用去中心化区块链，数据和身份可以直接存储在个人的设备上。


    此外，这一过程使得整个网络无法从集体上被渗透，并迫使攻击者针对个人数据存储器。因此，这种攻击是不可行的，因为攻击者没有办法获取`private key`。这对于黑客来说是不划算的（无利可图的）。


    # 数字签名


    DPKI 同样使用`digital signatures`（数字签名）。数字签名基于一种密码学数学问题算法。它用于验证身份，并在增加数据完整性的同时展示`不可否认性`。不可否认性确保了信息的发送者提供了交付证明，接收者提供了发送者的身份证明，因此双方稍后都无法否认处理过该信息。


    数字签名通过哈希、签名和验证数据来工作。哈希数据（无论大小或类型如何）意味着将其转换为与所有哈希值长度相同的哈希值。然后，发送者使用公钥加密对哈希后的数据进行签名。


    公钥加密使各方能够验证数据未被篡改。首先，发送者的数据使用其`private key`进行加密。消息连同发送者的`public key`发送。接收者随后使用发送者的`public
    key`读取消息。


    完整性得到了保障，因为发送者可以验证消息未被更改，因为更改后的消息将生成新的签名。真实性得到了保留，因为假设发送者是唯一可以访问创建签名的`private
    key`的人，消息应该只来自发送者。最后，数字签名保证了不可否认性，因为发送者无法争议消息是否签署过名。


    # 私有许可账本


    `private permissioned ledger`（私有许可账本）是一种区块链网络，只有授权方才能添加节点。他们是唯一可以访问区块链上数据的人。它充当一个任何人都可以参与的封闭环境。私有许可账本的处处可以用治理来规定算法。另一个优势是，特定的个人或小组可以对数据负责；然而，这意味着隐私变成了账本的责任。


    今天，许多金融机构遵守了解您的客户（`KYC`）合规要求。这些合规要求侧重于让交易中的身份透明。然而，这些现有系统的问题在于，机构可能需要长时间才能验证客户提交的所有文档。内置`KYC`的私有账本可以缩短这些漫长的验证期。如果`KYC`应用于私有账本，数据几乎可以瞬间完成验证。此外，在账本上实施`KYC`有助于执行反贿法。


    反洗钱（`AML`）合规计划也应该是私有账本的标准配置，因为它们有助于追踪非法交易。洗钱占全球 GDP 的 2% 到 5%，而加密货币拥有一处于许多洗钱方案核心的黑暗历史。在区块链中内置`AML`合规有助于减少洗钱。


    通常情况下，私有账本上的信息应基于按需原则，并受到与账本相关的所有相应框架和合规要求的监管。尽可能保持数据的私密性对于防止此类账本的最大威胁（如量子计算）至关重要。


