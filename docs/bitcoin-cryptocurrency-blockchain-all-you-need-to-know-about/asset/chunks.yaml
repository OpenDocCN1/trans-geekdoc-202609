    Consider the following use case for verifiable credentials: Alice has to verify
    to the Social Marketplace that she is over eighteen before she can be authorized
    to register. The goal is to do so without ever revealing her age or date of birth.
    The Social Marketplace has been structured to support DID authorization. Alice
    can present her DIDs already stored on the blockchain to prove that she is in
    control of her digital identity, with her private key attached to an authenticator
    app or web browser. Alice has multiple credentials stored in her credentials registry,
    issued by various trusted intermediaries, that would satisfy this requirement.
    Her browser or application asks which credential she would like to use. Alice
    can get past the security challenge-response without ever having to use a password.


    ## DAML Smart Contracts


    DAML is a next-generation application platform that makes it easy for anyone to
    write simple, concise, multiparty smart contracts and deploy them to their choice
    infrastructure. DAML is a language created for the exchange of value. Smart contracts
    are machine-encoded promises to perform specific actions.


    Digital Asset Holdings, the company behind DAML, lays out five key properties
    of smart contract systems that a contract language must enable. Paraphrased, these
    properties are:


    1. **Proof of rights and obligations.** For the consequences of a contract to
    be compulsory, the entrance must be voluntary. To automate the processing of an
    agreement to be automated, one must be able to reliably reason about all possible
    future outcomes of any given state of the contract.

    2. **Confidential execution.** For a contract to be confidential, only the parties
    affected by the contract can have the right to view the contract details.

    3. **Evidentiary trail.** For a contract to be enforceable, incontrovertible evidence
    of its authorization by all stakeholders must be preserved.

    4. **Formal verifiability.** For a contract to be guaranteed to perform as intended,
    it must be subject to formal verification methods.


    ## Formal Media Blockchain Edition


    Formal Media is the world’s first blockchain-enabled digital workplace that synchronizes
    the smart contract with the corresponding digital records, providing provenance
    for records, workflows, and signatures for multiple parties to a transaction.
    Formal Media Blockchain Edition is perfect for records professionals who need
    to demonstrate to auditors or litigators that their digital records, workflows,
    and logs have not been tampered with or altered.


    `Virtualdeveloper.com` developed the Formal Media Blockchain Edition using technology
    from Microsoft, DAML, and Sphereon.


    ## Off-Blocks


    Off-Blocks is a revolutionary and innovative new platform, built with blockchain
    from the ground up.


    Off-Blocks integrates digital signatures from self-sovereign identities that cannot
    be stolen or copied for a history that cannot be changed or denied. You will have
    an ID that never leaves your device and that you can securely access your biometrics,
    opening up a world of possibilities. Off-Blocks works on mobile, desktop, and
    laptop computer devices. Immune from theft or attack vectors, your ID and data
    are secure. The technology also enables you to sign documents faster and more
    reliably and cheaply than ever before.


    Consider some of the following examples and their significance for the Social
    Marketplace: a producer signing their music before publication; a court being
    able to verify spoken testimony; a landlord and tenant each signing property documents.


    ## Azure Blockchain Tokens


    Azure Blockchain Tokens Preview makes deploying and managing standard tokens easier
    than ever. It’s built on the standards developed by the Token Taxonomy Initiative
    (TTI).


    Azure Blockchain Tokens simplify creating, deploying, and managing tokens that
    represent digital or physical assets more accessible than ever before. The Social
    Marketplace will need tokens for its cryptocurrency. The Token Taxonomy Framework,
    developed by Marley Gray, Microsoft’s principal blockchain architect, developed
    the technical foundation for these tokens.


    Azure Blockchain Tokens enable multiple parties to a transaction to transfer,
    transact, burn, or mint tokens securely, regardless of the choice of distributed
    ledger. Azure Key Vault and Azure Active Directory are integrated to help secure
    transactions.


    Tokens are rapidly becoming the representations of value referenced in multiparty
    agreements or contracts on business networks. Tokens can represent currency, asset
    titles, receipts, tickets, authorizations, gaming assets, loyalty points, subscriptions,
    etc.


    ## The Kiva Protocol


    The Kiva Protocol is an exciting new initiative to cost- effectively give unbanked
    people verifiable digital identities and a personal credit history.


    Globally, 1.7 billion adults are unbanked, and two significant barriers to accessing
    financial services are lack of formal identification and lack of credit history.
    The Kiva Protocol is designed to address these barriers by using blockchain distributed
    technology to issue digital identification to everyone, enabling both formal and
    informal financial institutions to report on credit history.


    At a high level, according to Kiva website, this is how the Kiva Protocol works:


    ```

    When any lender (Kiva partner or not) makes a loan, this will send the borrower
    a signed, valid claim with the loan details. The borrower accepts the correct
    claim and posts it to their private ledger in their digital wallet.


    The same happens with a repayment—when a borrower makes a repayment, the lender
    sends a valid claim that the borrower approves and posts it to their ledger.

    ```


    This enables all credit events to be captured in a single ledger, with access
    to the digital wallet controlled by the individual. For example, if someone has
    verified credit history with a local lender or Kiva Field Partner and wants to
    apply for a loan from a national bank, they can grant that one-time bank access
    to their credit history.


    # 13 Introduction to Decentralized Finance


    Imagine having a global open platform for every financial service that you use.
    Think about stock markets, savings, loans, and insurance. Imagine each of these
    services being accessible to all with an active Internet connection and a smartphone.
    Heaven, right? While cryptocurrencies have increased accessibility and costeffectiveness
    for cross-border monetary transactions, DeFi takes this a step further. DeFi is
    an experimental form of finance that does not use central financial intermediaries
    like banks, brokerages, and exchanges to offer traditional financial instruments,
    but instead utilizes a modern and transparent approach provided by smart contracts
    on the blockchain. DeFi represents a set of applications developed on public distributed
    ledgers to facilitate a new era of financial services.


    DeFi platforms enable quick lending and borrowing of funds, predict price movements
    on assets, the earning of interest similar to savings accounts, and the cryptocurrency
    trading. The entire DeFi ecosystem is based on decentralized applications, also
    called dApps or protocols, providing a peer-to-peer financial network on the blockchain.
    The closest analogy to understand this entire concept is the structure built by
    Lego building blocks. Like Lego blocks, every dApp can interconnect with every
    other. The most common DeFi applications are:

