    区块链也是非同质化代币（NFTs）的技术平台。2021 年，NFT 的热度呈爆发式增长。本质上是一种被夸大的所有权证书，但它席卷了数字艺术世界。到目前为止最贵的一件是由自称
    Beeple 的艺术家创作的数字拼贴画，它在 2021 年 3 月于佳士得拍卖会上以 6930 万美元的价格售出。2021 年 12 月，前总统唐纳德·特朗普的妻子梅拉尼娅·特朗普宣布，她将出售一个基于她眼睛画的
    NFT，名为`Melania’s Vision.`（梅拉尼娅的视觉）。她还发布了一张自己穿白色衣服的照片，起拍价为 24 万美元。在书中，我不仅想描述 NFT
    是什么，还要向用户展示如何创建一个。


    如果 NFT 和 DeFi（去中心化金融）还不够，请考虑区块链与元宇宙结合的影响。想象一下，戴上你的扩展现实（XR）神经接口设备或目镜，当你看向镜子时，看到的不是卡通头像，而是你选择的全息图。想象一下，如果那个全息图是你向他人的虚拟呈现，通过它，你不仅可以在元宇宙中看，还能品尝、触摸和嗅闻。


    区块链将通过虚拟货币、非同质化代币和去中心化技术帮助元宇宙成为商业现实。`Sandbox` 和 `Decentraland` 等元宇宙平台甚至出售“虚拟土地”。例如，最近
    `Sandbox` 中的一处虚拟房地产以 430 万美元售出，使其成为截至 2021 年 12 月 8 日以来最昂贵的元宇宙物业交易。大约同时，耐克收购了一家
    NFT 初创公司，开始销售虚拟运动鞋。


    起初，金钱和贫困是社会建构的决定令我困扰，但所有社会建构（包括这些在内的）都可以被解构。本书将证明区块链技术创新如何作为解构这些限制的工具。我在书中花了一些时间描述金钱作为交易的媒介，以及它与道德理念之间的重要交汇点。


    书中还将提出一项策略，通过一个利用物物交换、加密货币和商业融资交汇的技术平台来缓解贫困。该技术平台充分地充当了一个市场，个人可以使用专门设计的区块链代币进行物物交换和交易产品和服务。是时候面对这种观点了：目前状态的金钱是人们社会和财政利益的恰当工具。


    # 引言


    我提供这段引言是为了引导读者了解本书的内容。我将对每一章进行简要预览，以便读者决定是跳转到特定的感兴趣章节，还是按照给顺序阅读。


    ## 第一章：加密货币与财富的创造


    97% 的加密货币交易者都赔了钱。尽管得出这一结论的研究基于巴西，但这些统计数据仍然令人震惊。在第一章中，我的目标是探索通过交易加密货币创造财富的可行性。我将描述我所谓的“彩票币”（那些主要具有投机价值的代币）与“实用代币”（后者通常锚定于具有经济和创新实用性的技术）之间的区别。我还将描述三种基础类型的交易策略。


    当你开始加密货币交易时，需要解决的首要问题之一是在哪种加密货币交易所交易。如果你对这项事业是认真的，那么理解技术分析的基础知识是关重要的，并且要意识到不受监管的市场是多么被被称为“巨鲸”的影响力者所操纵的。这些交易巨头拥有着大量的计算能力和经济资本。只要市场保持不受监管，他们就可以使用名为“拉高出货”（pumping
    and dumping）的技术，让一篮加密货币的价格朝着有利于他们的方向移动


    ## 第二章：职业与商业机会


    交易加密货币（无论是日内交易还是波交易）并不是区块链技术世界中潜在创造财富的唯一途径。在本章中，我将介绍替代方法，虽然这些方法可能耗耗精力和时间，但风险无疑更小。在当今时代，区块链领域有很多有利的职业。本章还将探索创业者的机会，并介绍加密货币挖掘及其对交易和商业的影响。


    ## 第三章：贫困现状


    本章描述了为什么全球社区中很大一部分人尽管有购买力却陷入贫困。书中将通过详细数据说明少数族裔、女性和老年人的状况。本章还包含了 `Meta`（原 Facebook）如何尝试推出自己的全球加密货币（Diem）。


    本章结束于提到由区块链驱动的现代金融机构如何促进增长。


    ## 第四章：我们为什么应该重新思考金钱


    本章详细解释了为什么有必要重新思考金钱的理念。它从展示传统法币产生的问题开始，例如通货膨胀和权力过大的中央政府。它引入了几种“社会”货币，如 `Brixton
    pound` 和 `Colu`，以说明作为社区建构的金钱如何解决法币带来的困境。随后，本章对 `Bitcoin` 进行了深入的案例研究，证明其建立等同于流动性的注入。


    本章还批判性地审视了中心化政府，研究法币对某些国家（如委内瑞拉）的损害。此外，本章强调了法币的进一步缺点，包括政府腐败、犯罪、伪造、通货膨胀、货币贬值以及国际汇款的高成本。


    此外，本章认为政府控制的货币本质是不道德的，因为它是价值交换的强制手段。


    本章以一些创建自己货币的社区案例结束。例子包括 `Brixton pound`、`Spice Time Credit`、`Colu` 以及流行的加密货币 `Bitcoin`。


    ## 第五章：社会建构与道德起源


    本章从时间和哲学角度回顾了道德的起源，从个人意图到共同意图，最后到集体意图。它还探讨了一种假设的客观定义道德方法，作为普遍主义与道德相对主义二元对立的替代。在本章中，我将提出道德本质上是社会契约的目录。


    为了奠社会契约的基础，我将参考英美普通法及其对简单合同的定义，其中“对价”（价值的交换）的概念是至关重要的。


    本章将讨论哲学家`托马斯·霍布斯`的一些思想，特别是他的自然状态概念，以及他为何主张需要政府来监管价值交换并对双方之间内在缺乏信任的情况进行仲裁。


    本章以一个场景结束，说明金钱是确保价值公平交换的最客观的货币。所呈现的情境利用了情感劳动作为夫妻之间焦虑的来源。


    ## 第六章：作为社会建构的金钱


