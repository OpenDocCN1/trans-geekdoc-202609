  trans: '


    几个月前，当我尝试通过西汇银行（Western Union）从美国汇 300 英镑到英国时，我停下来对比了通过银行国际电汇的成本。通过西汇银行汇款要贵了 100
    美元，主要是因为汇率的原因。


    加密货币让没有银行服务的人群能够绕过政府发布的法币，后者收取昂贵的交易手续费。加密货币的主要优势在于它让穷人和没有银行服务的人能够以几乎或没有汇率损失的情况下跨境交易，让他们拥有了以前只有富人享有的消费和转账能力。


    ## 法币中的强制性


    法币方案是不道德的，因为使其被接受的主要行为是**强制**。*^


    在法币中，强制是不可否认的，而且对于法币的采纳实际上是必要的。例如，1933 年，美国政府威胁要处以 1 万美元罚款、监禁十年或两者兼有的刑事处罚，以强迫公民接受不可兑换的联邦储备币代替黄金。政府强迫人们违背意愿接受法币。


    ## 法币中的通货膨胀


    在 2009 年至 2012 年间，英国银行创造了 3750 亿英镑的货币，从而导致了已供应货币贬值。加密货币可以通过限制流通货币量来防止这种通货膨胀。例如，比特币的上限是
    2100 万枚。


    委内瑞拉的居民一直经历着痛苦的通货膨胀，2017 年期间价格上涨了 12,875%。考虑到该国糟糕的经济状况，数万委内瑞拉人转向挖掘比特币（`BTC`）和以太坊币（`ETH`），每月可以赚他们
    500 美元。委内瑞拉人可以使用挖掘的加密货币通过电子商务购买食物和药品等必需品，这比在街上以物易物更有效。挖掘设备偶尔会被警察没收并作为收入出售。尽管如此，挖掘的加密货币不会被当局持枪抢夺或没收，因为代币存储在受密码保护的钱包中。


    未能将法币与实体储备（如商品）挂钩，使其面临因通货膨胀而变得毫无值的风险。通货膨胀会导致货币贬值，因为其供应和分配的激增会触发价格不稳定，这可以人为地刺激或抑制经济。


    正如伏尔泰著名的格言：“纸币最终将回归到它的内在价值——零，”这就是为什么需要探索加密货币的未来。


    ## 法币问题总结


    法币仅仅是由国家政府创建并宣布为合法的货币。它以前由黄金等实体商品支撑，但现在它由供需关系的基本原则以及发行法币的国家的信誉提供支持。法币是安全的，因为它们是高度控制的，因此倾向于稳定。然而，如果法币的控制权落入错误的人手中，那么不稳定性将占据主导。


    法币不太可能继续存在，因为现在它只是一个抽象概念。大多数现代法币不再以纸币或硬币的形式存在，而是作为计算机中的电子数字，这些数字字面上没有任何价值。


    此外，法币是被强加于我们身上的，它允许治理机构通过改变数量和可用性来按其意愿重新分配财富，这可能导致通货膨胀。我们被迫使用法币是因为它是唯一的可选货币，这实际上使其成为了一种垄断。


    作为一种垄断，法币巩了财富，这反过来破坏了经济稳定。财富越集中，收入不平等的风险越高。


    财富集中助长了富人和贫穷人群的腐败。在富裕社区，腐败源于个人的贪婪；在贫困社区，腐败通过犯罪显露出来。如果腐败持续，对货币的信任和信心将失去。结果是，货币回归其内在价值——零。因此，社区必须重新思考它们的货币。以下示例代表了恰恰这样做了社区，并最终铸造了自己的货币。


    ## 布里克斯顿镑（Brixton Pound）


    2009 年 9 月，英国的经济学家向伦敦南部的布里克斯顿（Brixton）注入了流动性。他们创建了一种支持当地社区的货币。英国银行不控制布里克斯顿镑，它通过手机短信传输。布里克斯顿镑（`B£`）是没有信用卡或借记卡或不想与银行打交道的人的支付形式。流通约
    50 万布里克斯顿镑，布里克斯顿的 200 多家企业接受它。


    布里克斯顿是一个重要的城镇中心，因其市场、文化创意活力和多样性而享有国际声誉。根据布里克斯顿镑网站，纸质货币之后，在 2011 年 9 月推出了电子短信支付平台，该平台现已退役。


    布里克斯顿镑的任务是支持多样性并增强布里克斯顿当地经济的韧性，考虑了挑战性的经济时期和主导权力链。布里克斯顿镑进一步寻求提高社区对当地社会经济的意识，并促进自救模式以保护布里克斯顿居民的财务未来。另一个目标是促进商品区域采购以减少二氧化碳排放，并提升布里克斯顿在当地和全国作为金融科技（FinTech）先驱的角色。


    这种货币与英镑保持一比一的固定汇率，被 200 多家当地商店和企业接受。它甚至可以用于支付当地税费。


    “如果你在连锁店花 5 英镑买杯咖啡，大部分钱会直接流向咖啡连锁店的股东，”布里克斯顿镑主管查理·沃特豪（Charlie Waterhouse）说，“如果你在当地的独立咖啡店花
    5 个布里克斯顿镑，这笔钱就会在当地循环。这关乎赋能人们在日常生活中做出积极的经济决策。”


    布里克斯顿镑在当地社区循环的本质，证明了社区货币如何用于增加社区经济地位，特别是对于小企业。通过挑战中央权威对货币的控制，布里克斯顿镑的用户决定了货币的价值，从而获得了更多信任。此外，布里克斯顿镑消除了强制性，因为参与者自主决定是否使用它。


    布里克斯顿镑的互动经理汤姆·沙克利（Tom Shakhli）认为，随着比特币等主流加密货币变得越来越流行，人们越可能采用像他那样的当地虚拟货币。他表示，“我们所有的（即虚拟货币）都属于同一个伞下，是国家货币的替代方案。我想，我们都是这个家庭的一员。每一个都为另一个增加了更多信誉力。”


    ## 香料时间积分（Spice Time Credit）


