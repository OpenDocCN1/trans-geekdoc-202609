  trans: '


    区块链可以使用多种语言进行智能合约的执行，这加剧了人们对其应用的顾虑。首先，多种语言的存在使得相关方更难找到既熟悉合同条款又熟悉编程语言的代表。结果是，第三方必须参与合约的开发，这可能导致某些客户失去信任。客户不确定自己的需求是否得到了满足。他们预想的代表人不得不将合约开发外包给软件工程师，因为该代表人自己无法阅读开发后的合约代码。


    ## 以太坊 Solidity


    为了缓解区块链在智能合约执行中利用多种语言的问题，以太坊建立了一门名为 `Solidity` 的通用智能合约编码语言。`Solidity` 是一种面向对象的编程语言，用于创建在以太坊区块链网络上运行智能合约。任何使用
    `Solidity` 设计的程序都可以通过 `Ethereum Virtual Machine`（`EVM`）上传到以太坊区块链上运行。^(28) 上传的程序或应用程序被称为
    `dApp` 或去中心化应用。一旦进入 `EVM`，`dApps` 将通过编译时而非运行时进行处理，并使用 `Ether` 执行交易。(29) `Ether`
    是一种通过开矿获得的代币，用于支付程序交易。它就像运行车辆所需的燃料。


    以太坊联盟（`EEA`）成立于 2017 年。^(30) 以太坊区块链网络在过去几年中获得了广泛关注，它们正在彻底改变智能合约行业。事实上，截至 2021
    年 9 月，已有超过 3000 个 `dApps` 运行在区块链上。


    `EEA` 将 `Microsoft` 等大型企业与以太坊区块链连接起来。其使命是成为一个开源标准并解决企业的部署需求。作为一个开源平台，任何公司创建的代码对其他人都是可见的。这样做的好处是，`EEA`
    可以降低其他大型企业以及小微企业的技术部署成本。


    截至目前，`EEA` 已跨越 45 个国家，由 19 个不同的技术、行业和法律顾问团队组成。因此，`EEA` 是区块链智能合约行业的领先参与者，正在为智能合约的编写、实现和法律解决奠定基础。例如，它对使用以太坊区块链有特定的规定，拥有知识产权政策、保密和不披露政策以及反垄断政策。此外，它还倡导了解您的客户（KYC）和反洗钱（AML）法规。


    ## 代币分类框架 (TTF)


    `EEA` 最重要的贡献是其代币分类框架（`TTF`），该框架概述了特定的代币术语，并提供了一种用于驱动智能合约的代币创建方法。(31) `TTF` 基于其代币定义，这些定义概述了业务为了各种目的所需的特定组件。


    `TTF` 可在 `GitHub` 上获取，这是一个公共仓库，开发者从中获取该框架。该框架包含一个代币模板，便于经过验证和认证的自动代码生成。(32) 随后会为每个代币创建一个参考文档，用所有业务人员都能理解的简单语言解释其结构和用法。


    `TTF` 为代币设定了标准，许多企业开始在其自己的代币中采用 `TTF`。将此类系统与法律、监管等边界相结合——可以在保留隐私的同时确保数据完整性并强制授权。(33)
    为了帮助企业拥有自己的代币，`Microsoft` 最近宣布支持 `TTF`。^(34)


    ## 房产记录


    区块链技术的另一个应用是房地产交易。目前，房产交易纠纷淹没了法院系统。各州的法律差异巨大，存在许多可消灭权。(35) 当转让人有条件的转移土地时，就产生了可消灭权。一旦发生转让人所述的事件，转移可能无效或被撤销。（不受此类条件的称为不可消灭权。）历史上，普通法对可消灭权持反对态度，因为它们干扰了所有者对财产的享受，并使得创建有效的权益变得困难。区块链技术可以通过记录系统减少此类纠纷。在这种系统中，买家可以将据直接记录在区块链上。据将带有时间戳，由于区块链防篡改的能力，据无法重复添加。


    区块链房地产记录系统可以为验证所有者的身份和相应的权证提供必要的来源证明。将此类系统与金融机构相结合将使贷款人能够检查买家是否有完成房地产交易所需的资金。总而言，这为买卖双方都提供了保护。


    在伊利诺伊州，区块链已用于追踪房产销售和转移。(36) 到目前为止，它取得了成功，并帮助澄清了涉及错误信息的法律纠纷。此类纠纷通过区块链最容易解决，因为记录的所有输入都是可追踪的且不可逆转的。


    该系统显示出的另一个优点是具有消除对权保险需求的潜力。(37) 权保险是一种补偿险，保护投单人免受因财产产权缺陷而可能造成的损失。(38) 权保险的价格不等，但通常至少为
    1000 美元。


    智能合约还可以结合区块链记录用于自动化销售、税费支付和契证记录。这些合约可以使用托管的形式向买卖双方证明其资金或资产经过验证且真实，并可以释放。


    智能合约可以通过编码指令和自动化目前的手工工作流，来加速贷款审批和结算过程。(39)


    ## 金融交易


    金融行业目前以中心化权威控制运行，这意味着黑客只需要攻破单一入口。结果是，金融黑客（如资金盗取）将给银行的所有客户带来痛苦。金融机构降低攻击风险的最佳方法是切换到分布式账本技术或区块链。


