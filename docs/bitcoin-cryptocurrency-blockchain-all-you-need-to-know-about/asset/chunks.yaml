  trans: '


    在本章中，我简要讨论了社会建构（social constructs）。我提出了一种社会建构架构，并介绍了一些关于它们如何产生的理论。本章将继续介绍法币（fiat）如何作为社会约的实现。我还将展示法币作为一种建构是如何被解构，并创造出广为人知的加密货币
    `Bitcoin`。


    政府的中央银行在创造货币方面起着至关重要的作用，并管理经济中的货币供应。我还将介绍银行系统如何利用部分准备金制度来“凭空创造货币”。


    ## 第 7 章：价值交换：贸易简史


    本章概述了物物交换如何作为一种交换价值（即商品和服务）的新型贸易机制。货币的使用源于物物交换文化，但并非如人们想象的那样出于经济原因。然而，物物交换也有其缺点，我将将其与货币作为价值交换标准衡量单位的必要性进行对比。


    本章追溯了货币的历史，包括标准硬币、银行券、法币，最后是现代加密货币。货币的起源受到社会文化和往往是宗教力量的驱动。此外，本章将展示一些物物交换进入区块链技术的示例。


    本章将深入探讨一个具有争议且极极化的观点：中央银行可以轻率地创造货币，然后将其分配给富有的银行家。本章将以对比法币与加密货币的优缺点作为结束。


    ## 第 8 章：区块链入门


    本章将区块链作为解决名为`拜占庭将军问题`（Byzantine Generals Problem）的特定困境的解决方案。该解决方案最终结晶为区块链技术，并因此世界上第一种加密货币
    `Bitcoin`。


    我将概述区块链技术的优缺点，以及它对包括 `fintech` 和供应链在内的许多行业的颠覆潜力。区块链的主要用例（等一下，`use case`）是溯源性（`provenance`），即其证明数字记录是否被篡改的能力。此外，我将描述区块链如何通过其去中心化和分布式框架实现记录的不可篡改性。


    互联网作为计算机位和字节交换的媒介出现。分析师广泛赞誉区块链为价值交换的媒介——价值互联网。一个全新的分布式应用（`DApps`）时代已经出现，被称为`智能合约`（smart
    contracts）：即作为软件代码执行的各方之间的数字协议。


    本章还将触及区块链的历史、其神秘的创始人`中本聪明`（Satoshi Nakomoto），以及他开发的具有社会建构属性的工作和共识算法。


    最后，本章详细阐述了政府监管货币（即法币）的一些缺点，以及它对全球贫困社区的毁灭性影响。


    一个权威的权力结构对于监管本质上不信任双方之间的价值交换是必要的。遗憾的是，正如俗所说，权力腐人性，绝对的权力绝对腐败。然而，区块链技术也容易受到为了财政压迫的潜在操控。


    ## 第 9 章：区块链、物物交换与加密货币的交汇


    本章概述了区块链技术如何成为投资金融、加密货币和物物交换汇的理想平台。


    加密代币可以作为政府控制法币的替代品，作为价值交换的标准衡量单位。


    区块链技术为企业募集风险资金提供了创新方式，包括由`美国`政府设立和监管的全面代币代发行（`STOs`）。


    本章还将考察资产代币、实用型代币和货币之间的差异，并展示`代币分类计划`（`TTI`）如何为代币的实例化提供一个通用框架。


    区块链正在改变微型金融计划，通过减少对申请人的信用报告限制并降低利率，使资本更易于获取。本章将解释区块链如何处理身份管理以及带有个人身份中心的去中心化数据理念。最后，本章将介绍私有许可链和公共许可区块链账本之间的区别。


    ## 第 10 章：加密货币与政府监管


    本章将讨论目前政府对加密货币的监管，以及对`美国`和`欧洲未来未来的预测。我将介绍某些监管机构（如`证券交易委员会`（`SEC`）和`商品期货交易委员会`（`CFTC`）为监管快速增长的加密货币和整体区块链代币领域所采取的步骤。


    全球政府正在迅速利用区块链技术来实现法律目的，并出现了一种新型数字货币，被称为`Govcoins`，或央行数字货币（`CDBC`）。


    作为一个案例，我将从高层次展示中国在其名为`数字人民币`的官方数字货币发布方面取得的进展。


    ## 第 11 章：区块链技术的监管关注


    本章将解决实施区块链代币涉及的一些技术和监管关注点以及机构。我将概述几个主要的用例，例如房地产和`fintech`交易，以及一些领先的加密货币项目，包括`Ripple`和
    Meta 的`Diem`。


    我将继续简要讨论监管事务，包括数据隐私、安全、加密货币监管和税收。我还将高要概述各种`美国`机构的角色，如`证券交易委员会`（`SEC`）、`联邦贸易委员会`（`FTC`）、`金融犯罪执法网络`（`FinCEN`）和`金融行动特别工作组`（`FATF`）。


    本章将深入探讨`智能合约`，主要基于`以太坊`（Ethereum），它是智能合约领先的区块链平台。我将介绍`企业以太坊联盟`（`EEA`）`代币分类框架`（`TTF`）的计划。


    ## 第 12 章：缓解贫困的技术方案


    在本章中，我将通过一个简单的用例场景描述我提用于缓解贫困的技术。该场景揭示了我的技术方案是一种革命性的新交换媒介，被称为`社会市场`（Social Marketplace）。


    `社会市场`允许个人用市场内部货币（即`社会货币`）或市场上列出的其他商品和服务来出售产品和服务。


    这种新的交换方法通过为个人提供标准衡量单位并重新引入传统的贸易和物物交换技术赋予了个人力量。


    ## 第 13 章：去中心化金融简介


    去中心化金融（`DeFi`）是一种实验性的金融形式。它不使用传统的中心化金融中介（如银行、经纪和交易所）来提供金融工具。相反，它利用区块链上`智能合约`提供的现代透明方法。


    在本章中，我将从高层次概述`DeFi`作为一个涵盖广泛应用的全球性和开源金融平台。典型的`DeFi`用例包括开放借贷平台、稳定币、去中心化交易所、合成资产发行、收益耕矿、质押和套利。


