- raw: 'For example, most businesses interact internationally, which means freight
    brokers are needed to facilitate transactions between suppliers and purchasers.
    These brokers can be quite costly and are incorporated throughout various stages
    of the purchasing process, such as negotiating item costs, shipping costs, international
    tariffs, and more. Furthermore, traditional supply chains rely on signed paper
    documents, which can get lost in delivery or compromised by theft. Converting
    currencies is another issue.


    Supply chain management with blockchain and smart contracts alleviates all these
    hurdles and significantly increases efficiency. The blockchain framework itself
    provides proof of identity for parties and maintains unchangeable digital records
    of transactions, which are available to all parties involved, guaranteeing trust.^([23](#notes.xhtml#chapter8-23))


    Smart contracts manage workflows by automatically executing the required steps
    in a supply chain system based on predetermined parameters. This guarantees that
    each party receives its expected payment, product, or service. Furthermore, the
    use of stable tokens in smart contracting can act as a generic payment method
    to eliminate the need for currency exchanges. In general, this means blockchain
    smart contracting can not only accelerate supply chain protocols but also establish
    trust and substantially reduce costs to all parties.


    ## Bitcoin Changes Social Contracts


    Nakamoto’s cryptocurrency became the first medium for the exchange of value created
    by the blockchain community. Bitcoin is a currency that parties voluntarily adopt
    to participate in trade. Unlike government fiat, which is forced upon people,
    participation in this electronic cash system is optional. As such, it disrupts
    the traditional fiat-based social constructs dominating economics.


    Bitcoin gives individuals the option of choosing which institution they want to
    support or have more trust in. People can select traditional fiat, backed by their
    government, or the cryptocurrency, backed by a network of unknown miners.


    Those who choose fiat do so because they believe in the security of government-generated
    currencies. In contrast, cryptocurrencies are not controlled by individuals, but
    by a large group of anonymous people— miners. Miners exist all over the world
    and make up the decentralized network of the blockchain. Regulatory entities do
    not control them; instead, the framework of the blockchain, which does not change,
    performs this function. Therefore it seems more reasonable to trust cryptocurrency
    on blockchains, like Bitcoin, because they are immutable, decentralized, and function
    democratically.


    Although Bitcoin cannot be compromised by one individual or institution, it is
    at risk of being compromised (though that is a challenge). The only way for the
    system to be compromised is through *a 51 percent attack.*


    In a 51 percent attack, an attacker tries to control most of a network by reverse
    engineering existing transactions.^([24](#notes.xhtml#chapter8-24)) First, the
    corrupt miner must find the solution to a block being generated and then not broadcast
    it to the rest of the blockchain network. Instead, the corrupt miner withholds
    the solution so that two versions of the blockchain exist, the original and his
    withheld copy.


    The original blockchain continues to be used by the uncorrupt miners, while the
    corrupt miner uses the withheld blockchain. Because hehas not broadcast his block
    to the rest of the network, it goes unnoticed, which enables him to use his acquired
    tokens (Bitcoins) on the original blockchain.


    But what about the withheld blockchain? Well, the tokens do not appear as spent
    on the withheld blockchain, meaning that the corrupt miner still has access to
    them. The withheld blockchain is still able to continue acquiring blocks that
    can be verified by the corrupt miner.


    The ability to continue verifying blocks is where trouble arrives, since the blockchain
    is coded to follow a consensus algorithm or majority. In other words, the blockchain
    proceeds by following the heaviest chain, which is considered its truth. The heaviest
    chain is used to set balances.


    Since most miners add blocks to their blockchain version more quickly than the
    rest of the network, a race develops over hashing power. The greater a miner’s
    hashing power, the faster they can add blocks to their blockchains, which the
    corrupt miner aims to exploit.


    When the corrupt miner succeeds in adding blocks to his withheld chain faster
    than the other miners on the network, he now holds the longest chain. When he
    finally broadcasts such a chain, the remaining blockchain network detects it and
    considers it the truth. As a result, all the remaining miners’ protocols shift,
    and they start to hash on the corrupted miner’s blockchain.


    With the corrupted miner’s blockchain now validated, the miner can spend his token
    again; this is known as a 51 percent or double-spend attack.^([25](#notes.xhtml#chapter8-25))


    The likelihood that this will ever happen is slim to none, simply because such
    an attack would be very tough to execute. To begin with, the corrupt miner would
    need more hashing power than the rest of the entire network, or at least 51 percent.


    Considering the number of nodes in Bitcoin’s blockchain, (over 12,000 as of August
    2021), this is highly improbable.^([26](#notes.xhtml#chapter8-26)) It would require
    spending millions of dollars on hardware equipment and computational power that
    is simply impossible for a single individual to obtain. Even if these conditions
    were somehow met, the chance of the corrupt miner getting caught is nearly 100
    percent. The mining hardware alone would occupy a warehouse, and the huge amount
    of electricity needed for running it would be detected. Furthermore, the miner
    would have to cover his Internet tracks and then somehow launder the money generated.
    All in all, this operation requires too much effort to be successfully executed,
    at least on the Bitcoin blockchain.


    On other blockchains, the threat of a 51 percent attack is more likely to materialize,
    due to centralized crypto mining. In centralized crypto mining, specific groups
    of miners are pooled together, and many of them use ASICs (application-specific
    integrated circuits). ASIC chips can mine specific hashing algorithms, which means
    select cryptocurrencies, at rates faster than traditional GPUs (graphics processing
    units).^([27](#notes.xhtml#chapter8-27)) When ASICs are released for mining specific
    coins, they often dominate all other miners. The problem with this domination
    is that computation power can centralize, as the manufacturers of the newly created
    ASICs have the highest processing power. As a result, ASIC manufacturers, such
    as Bitmain, have the potential to control over 50 percent of the overall hashing
    power on the blockchain, meaning a 51 percent attack could be executed. The best
    solution to reducing the risk of ASIC centralization and 51 percent attacks is
    to generate new hashing algorithms that are ASIC-resistant.^([28](#notes.xhtml#chapter8-28))


    ## Blockchain’s Necessity Summarized


    As technology expands and assets become more and more digitalized, it becomes
    imperative to maintain trust. The best solution for this is blockchain technology.


    Blockchain allows for digital assets to be exchanged anonymously and removes the
    need for third parties to facilitate the transferring of assets, which makes transactions
    cheaper. Furthermore, all transactions on public blockchains are viewable and
    automatically created in realtime, enabling participating parties to transact
    faster despite their identities being unknown.'
