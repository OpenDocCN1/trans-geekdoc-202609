  trans: '


    “给定一张印有已故领袖头像的矩形纸，或者一个金属盘、一个壳或一些大麦，一群人将该物体归类为货币，它就变成了货币，”巴雷特写道。(5)


    ## 社会契约的架构


    简单社会契约的构造由由所有方同意的精确定义、意义和价值观。更复杂的社会契约包括一个监管机构（权力），该机构负责执行、保证或背书合同的属性，并将监管行为委托给信赖的中间人。下方的图
    06-01 展示了艺术、比特币和设计师品牌等构筑的示例。


    ![图 06-01. 社会契约的架构。](img/img-81.jpg)


    图 06-01。社会契约的架构。


    ## 法币


    法币是指政府背书的货币，由中央银行等监管机构监管。它并不总是由黄金等实物商品支撑。相反，它通常基于发行法币的政府的感知信誉度。


    标准金币和期票代表了对价值的主张和购买价值的权力。另一方面，法币仅仅是购买价值的力量或能力（参见图 06-02）。这种权力完全取决于监管并保证其价值的政府权力。


    法币主要是社会契约的结果，在这种契约中，人们赋予政府管理货币关键功能的权力，例如其供应和价值。没有了金本位，货币的价值基于信任。人们使用中央银行创造的货币作为信赖的中间人，因为政府有保证其价值的权力。(6)
    对货币的信任本质上是对担保货币的政府的信任。美元以美国政府的“完全信任和信誉”为支撑。(7)


    经济教育基金会前内容总监杰弗里·A·塔克（Jeffrey A. Tucker）写道：


    > 多世纪以来，银行系统一直被用于为国家提供资金、破坏经济、掠夺私人储蓄、排除无法获得服务的人群、促进财务依赖，甚至以以前所未有的规模使暴力成为可能，这一切都是因为我们没有不同的技术来实现货币交换的可能性。这种垄断现在正在打破。健全的货币诞生了。统治阶级的恐慌刚刚开始。(8)


    在 2017 年 9 月英国银行的一场会议上，国际货币基金组织（IMF）行长克里斯汀·拉加德（Christine Lagarde）解释说，加密货币并非时尚，而是货币领域的真正创新。她认为这对金融中介和中央银行的未来具有深远影响。整个信贷机制建立在政府打印和控制货币供应，以及通过银行系统将货币强制法货币的基础上。(9)


    ![图 06-02. 作为社会契约的法币。](img/img-83.jpg)


    图 06-02。作为社会契约的法币。


    虽然准备金银行（FRB）的典型动态和中央银行的主要作用并不完全适用于加密货币，但在加密经济中发生准备金银行并不需要中央银行。基于加密货币的存款机构将为贷款创造规模效应。有趣的是，万事达（Mastercard）正在寻求区块链资产准备金管理的专利。(10)


    货币只是带有政府印章的纸，它之所以有价值是因为人们被迫接受或相信它有价值。中央银行控制法币的价值。现存的法币没有内在客观价值，仅仅是计算机中的电子数字。


    图 06-02 显示了作为社会契约的法币，政府作为权力，中央银行作为信赖的中间人。图 06-03 显示了相应的比特币社会契约，这一次政府被基金会取代，中间人代表比特币矿工。在比特币的情况下，注意双方之间的协议是基于软件的共识算法。


    另一个社会构的例子是设计师商品。考虑香奈如何通过其网红（名人）向消费者规定其包的价值。他们实际上是在为随包的真品证书付费。从客观上，这是区分 6000 美元正品和
    300 美元假品的唯一方法。然而，不理性的消费者购买了这个包，将数千美元存入万富翁的银行账户，而这个包可能成为他们最昂贵的资产。


    ![图 06-03. 作为社会契约的比特币。](img/img-84.jpg)


    图 06-03。作为社会契约的比特币。


    在这一契约中，香奈扮演了监管权力的角色。它有效地将商品意义和价值的管理委托给名人和网红作为信赖的中间人。考虑我们不仅协助创造了这些构造，还通过交易遵循了它们。


    ## 比特币


    我们以后将学习拥有铸币权的国王如何通过贬值导致通货膨胀。在历史上，政府经常利用其权力没收账户并阻止某些人的交易。政府甚至通过创造过量的货币供应导致恶性通货膨胀。


    当中本聪（Satoshi Nakamoto）发明比特币时，他引入了创新的变革，有效地解构了法币构造。利用区块链技术，他建立了一个非营利基金基金作为权力组件，结束了对政府的需求。(11)


    反过来，基金会将安全性委托给比特币矿工，作为“无牙的商品提供者”，他们遵循基于软件的比特币协议。比特币用户社会（构造的各方）约成的共识算法决定了比特币协议的规则。对政府的信任被对协议的信任取代，协议执行由社会层建立的共识算法。


    通过比特币协议，中本聪一劳永逸地通过实施通胀、防造和抗审查，解决了政府控制固有的问题。(12) 就像法币一样，比特币代本身没有价值；它实际上只是账本中的一个数字。


    '
