- raw: '1.  Stablecoins. A cryptocurrency tied to an asset outside of crypto, like
    the euro or dollar, with an aim to stabilize its price.


    2.  Prediction markets. Crypto prediction markets are DeFi protocols which allow
    anyone, regardless of arbitrary factors such as status, location or nationality,
    to trade the outcome of events. Smart contracts execute autonomously and without
    the input from centralised authorities as soon as certain conditions are met.


    3.  Decentralized exchanges (DEX). Decentralized exchanges work similarly to online
    exchanges that allow users to exchange currencies, like USD for Bitcoin and so
    on. The difference is that DEXs connect users directly with each other, so they
    can trade cryptocurrencies on the go without relying on an intermediary.


    4.  Lending platforms. Lending platforms are based on smart contracts that aim
    to replace conventional intermediaries like banks.


    The phrase *money legos* is often used to refer to a key DeFi, also known as composability.
    The concept is simple: Composability is the interoperability of DeFi protocols,
    resulting in efficient, creative financial services and products for DeFi end
    users. Some examples of these protocols are Aave, Yearn, Synthetix, Curve, and
    RenVM (amongst others) that mesh together to enable, process, and deliver new
    financial products only possible in DeFi. The open- ended and permissionless nature
    of DeFi protocols allows you to stack dApps together to unlock incredible yield
    farming returns, deploy flash loans, or take out loans that repay themselves.
    Simply by using an app on your mobile phone, you can leverage cryptocurrency that
    you own, using it as collateral to raise a loan or as the basis for making a loan
    to a peer on the decentralized network. While this scenario describes a simple
    application of DeFi, the possibilities for the future are almost limitless. You
    could eventually purchase land on a DeFi platform using a mortgage agreement as
    a smart contract that specifies the repayment terms.


    ## DeFi and Smart Contracts


    DeFi removes the need for centralized agencies, such as brokerages, exchanges,
    or banks to oversee financial transactions and allows you to carry out immutable
    transactions anonymously. It is secure, free of interventions from financial institutions,
    and is highly efficient.


    DeFi is a global and open-source alternative to traditional centralized financial
    services, encompassing a wide variety of applications. It is not just about cryptocurrencies
    like Bitcoin. It includes sophisticated instruments like smart contracts and digital
    wallets that are built upon the blockchain network. The vision for DeFi is to
    conduct all financial transactions without restricting oneself to a particular
    centralized financial institution.


    ## What Is a Smart Contract?


    A smart contract is a computer program based on the blockchain network that executes
    by itself on certain conditions. They are highly helpful in establishing business
    relations and collaborations. Smart contracts enforce the terms and agreements
    of a business deal, carry out financial transactions, and serve as binding contracts,
    encapsulated in software code. They can be exchanged and used among the concerned
    parties without the need for any intermediary service.^([3](#notes.xhtml#chapter13-3))


    For instance, if you want to ensure the payment of funds to a seller, you can
    use smart contracts as a means to validate each transaction with a unique security
    token. Say if you are buying something from a seller, a smart contract can automatically
    execute when you receive the product and immediately transfer funds from your
    account to the seller’s account.


    Smart contracts and DeFi allow for direct transactions between peers without having
    to rely on third-party transaction channels. A decentralized smart contract can
    replace the security approval processes and validation provided by these trusted
    third-party services.


    ## What Problems Does DeFi Solve?


    DeFi makes it possible for you to carry out financial transactions without having
    to seek permission from anybody. You don’t have to conform to banking regulations
    or pay service charges for your financial transactions. DeFi helps you carry out
    secure, open, anonymous transactions in a decentralized manner while lowering
    everybody’s costs. Here are some of the major benefits that DeFi brings to the
    table:


    1.  Better opportunities for small and medium businesses. Small and medium-sized
    businesses can now move away from traditional banking services, which can be restrictive
    and costly, and instead conduct business through peer-to-peer transactions and
    payments.^([4](#notes.xhtml#chapter13-4))


    2.  Unique digital identity. As of 2017, about 1.7 billion people did not have
    a valid bank account, many of them because they lacked a proper identity document.
    DeFi and smart contracts can help solve this problem with the help of unique digital
    IDs.


    3.  Digital marketplaces. DeFi helps link buyers and sellers in common marketplaces
    without the risk of losing your private identity information. With DeFi, you can
    carry out direct exchanges. DeFi can help build local and community-based markets
    where buyers can deal directly with sellers without paying the commissions or
    royalty fees charged by platforms like Amazon and eBay.


    4.  Tokenization. Cryptocurrencies are just one example of the tokens that we
    can create for use on the blockchain. Additionally, there are utility tokens,
    nonfungible tokens, and even regulated security token offerings.


    ## What Is the Current Scope of DeFi Market Capitalization?


    Currently, the DeFi market consists of various finance sectors and digital businesses
    that are primarily concerned with peer-to-peer transactions, exchanges, and financial
    lending and borrowing.^([5](#notes.xhtml#chapter13-5))


    DeFi is being leveraged in decentralized commodity and asset exchanges and liquidity
    pools like Bancor Network and Uniswap.


    Ethereum is currently the most well-known DeFi, and the total value locked (TVL)
    in DeFi on the Ethereum blockchain has soared to nearly $200 billion today from
    about $20 billion last year, according to JPMorgan.^([6](#notes.xhtml#chapter13-6))
    As of November 2021, the total value locked in DeFi hit an all-time high of $236
    billion.^([7](#notes.xhtml#chapter13-7))


    The DeFi service called Compound, launched in June 2020, has witnessed rapid growth.
    Compound is a DeFi protocol that hosts lending pools to earn interest on various
    cryptocurrencies. These pools allow token holders to supply their tokens to others,
    who borrow them at algorithmically set interest rates based on supply and demand.^([8](#notes.xhtml#chapter13-8))


    ## Major Obstacles Faced by DeFi


    DeFi is growing more slowly than expected. For broader adoption, certain roadblocks
    need to be removed.


    1.  Although DeFi has advanced very well on the technical side of things, the
    user interface (UI) experience still has much room for improvement, as it is based
    on cryptocurrencies. Users need an easy and intuitive interface for converting
    fiat to cryptocurrency. Until then, DeFi will have difficulty achieving wide-scale
    adoption.


    2.  The liquidity of DeFi systems is not markedly efficient in pricing when compared
    to centralized systems. Transaction fees in DeFi and blockchains are typically
    higher than for centralized finance (CeFi). With CeFi, financial institutions
    can opt to offer transaction services at no cost (or are mandated by governments
    to offer certain services for free) because of the ability to rely on KYC/AML
    verifications of their clients.


    3.  DeFi requires that products be overcollateralized, sometimes by as much as
    150 percent, limiting opportunities to get access to additional capital. This
    limitation is a function of a lack of sophisticated credit rating systems on the
    DeFi network, to help mitigate against risk. More research needs to be conducted
    to develop a system competitive with traditional credit scoring systems.'
