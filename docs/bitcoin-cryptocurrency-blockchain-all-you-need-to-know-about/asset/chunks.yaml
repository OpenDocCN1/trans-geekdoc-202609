    下一步是输入你的销售条款；输入你的 Flow 价格，请注意截至 2022 年 1 月 5 日，该价值为每次 9.24 美元。指定标题、描述和版税百分比。选择“Rarible”作为你的集合，然后点击“创建”。点击“批准”创建你的
    NFT（图 14-07）。注意，通常创建 NFT 需要支付费用，但对于 Flow 来说交易是免费的。


    ![图 14-07 批准 NFT 创建。](img/img-191b.jpg)


    图 14-07 批准 NFT 创建。


    随后你将看到新创建的 NFT 证明！


    点击“查看 NFT”，你将看到你的数字艺术品正在出售（见图 14-08](#chapter14.xhtml#fig37)）。你可以选择下架或分享 NFT 分给潜在客户。出售
    NFT 的收益将存入你的 MetaMask 钱包中。


    ![](img/img-192.jpg)


    ## 政府注册机构作为 NFT 的预言


    在写作时，非同质化代币还没有任何监管规定。换句话说，NFT 在全球任何地方尚未被认可为知识产权或物理财产的权证书。这使得它们的监管变得更加复杂。然而，随着领域的成熟，可能会出现指示法律上如何感知和识别
    NFT 的政府法规和框架。我们可能会看到由区块链驱动的政府注册机构的出现，它们将作为现有 NFT 以及新 NFT 铸造的预言机。


    由于目前还没有此类系统在使用，它们将如何运作尚不明确。然而，类似的应用和现有的创新让我们对可能可能看到的内容有了很好的了解。


    ## 去中心化自治组织 (DAO)


    随着区块链上权属证书和知识产权的代币化，将 DAO 网络作为自验证的预言机，对于大多数数字 NFT 的验证将是理想的。“预言机”从外部世界发送数据（例如每日温度或政治候选人收到的票数）到以太坊等区块链上。区块链上的智能合约可以使用这些数据，通常用于决定是否以及发放资金以及付给谁。虽然这类
    NFT 的预言机尚未存在，但去中心化金融平台已使用去中心化价格预言机来处理价格等外部数据。


    同样，中心化的区块链预言机对于政府注册机构验证 NFT 将非常有用。这对于代表知识产权和权属证书的 NFT 将是理想的，因为它们需要政府批准。


    ## 版权侵权与通过 NFT 验证所有权


    如所述，由于 NFT 领域很大程度上不受监管，使用 NFT 进行艺术品盗窃已变得普遍。“像 Derek Laufman 这样的艺术家，他们的作品在未经许可的情况下被铸造为
    NFT 并出售。”^(14) 一个拥有欺诈 OpenSea 账户的人声称是 Laufman，该冒充者正在从 Laufman 的社交媒体账户出售作品。


    Laufman 只是许多 NFT 盗窃受害者之一。过程通常很简单：偷取艺术家的作品，在 NFT 市场或拍卖网站上将其铸造并作为自己的作品出售，或者冒充所有者以艺术家的名义出售。


    目前仍然没有验证 NFT 的标准化方法。然而，在未来几年里，我们可能会看到数字权利管理 (DRM) 系统与 NFT 铸造平台及市场相结合，使 NFT 的所有权限制在特定的个人或机构实体成为可能。


    例如，我们可能会看到 NFT 集成到 Google Authenticator 等成熟的认证工具中，代币 ID 可以通过此类认证 DRM 系统上的 QR 格式进行验证。我们可能会看到专用移动设备、桌面设备或外围设备（类似于
    Kindle 设备和硬件钱包）用于 NFT 投资组合的存储、认证和管理。


    ## NFT 的未来


    与比特币一样，NFT 最终将渗透到生活的方方面面。随着全球政府注册机构作为预言机来验证谁拥有什么，所有形式的财产最终都将代币化并附加到唯一的私钥上。


    此外，随着非同质化代币碎片为同质化代币，我们可能会看到 NFT 与去中心化金融平台合并以实现流动性。将有一天，NFT 将作为获得同质化贷款的抵押品。


    按照该领域的演变方式，我们将看到的内容实际上没有限制。


    # 15 区块链与元宇宙


    元宇宙正在迅速成为一种家户现象，这主要是因为 Facebook 在 2021 年底更名为 Meta。在本章中，我的目标是概述元宇宙与整个互联网以及虚拟现实和增强现实等各种技术的关系。我还将涉及全球最大的公司（如
    Meta 和微软）通过产品和服务发起的一些倡议，以及他们所针对的主要受众。


    Web 3.0 是元宇宙的关键哲学和技术特征，我将描述它如何帮助增强区块链与元宇宙之间的相互依赖性。在区块链方面，它带给元宇宙的主要组件是围绕去中心化、山寨币和非同质化代币
    (NFT) 的技术。


    最后，我将介绍元宇宙中虚拟地产的想法，以及构建建筑所需的技术和方法的概述。


    ## 什么是元宇宙？


    目前还没有全球通的真实元宇宙定义。一些人认为它只是互联网更高级的继任者。根据《连线》杂志，90% 的情况下，你可以在句子中将*元宇宙*metaverse）一词替换为*网络空间*cyberspace），其含义不会发生任何实质变化。^(1)
    Nicky Verdi，^(2) 在她的文章《元宇宙与互联网的区别》中指出，通过互联网，人们不断通过网站、游戏或社交媒体平台与朋友互动。元宇宙在此基础上更进一步，将用户沉浸在行动之中。元宇宙承诺将我们的现实体验扩展到虚拟和增强现实。通过人工智能、社交媒体、在线游戏和加密货币等技术，用户将进行虚拟互动。元宇宙的支持者想象其用户通过从音乐会、会议到全球环游等一切活动进行工作、游戏和与朋友保持联系。^(3)


    “通过互联网，你可以在线并不一定与他人互动，但元宇宙的基础是数字人机互动。它是关于人们共同共享一个虚拟宇宙，无论是为了工作、学习、运动或仅仅是为了乐趣。”

