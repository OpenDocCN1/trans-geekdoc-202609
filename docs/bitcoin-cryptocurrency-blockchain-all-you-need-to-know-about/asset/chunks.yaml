  trans: '

    `Quantum computing` 指一种利用量子力学进行计算的设备。这意味着量子计算机可以使用量子比特（qubits）代替比特（bits）进行计算。量子比特允许叠加态，这意味着
    0 和 1 可以同时存在，从而使得量子计算机比任何其他设备都要快。量子计算机的速度允许它们反向计算区块链上使用的算法，这意味着它们可以伪造数字签名、个人数据，甚至接管数字资产。


    防止量子攻击的最佳方法是抗量子算法或量子互联网，而后者仍有几十年的距离。无论如何，私有账本应该为这一未来做好计划，并防止即将到来的技术进步。


    私有账本中使用的代币价值取决于市场决定的。可用代币数量是固定的，这意味着它们不受通货膨胀的影响。尽管这种免疫力，加密货币代币的价格波动仍然很大，因为它们遵循供需法则。它们还受到其他因素的影响，例如其实用应用场景。


    下一章将深入探讨围绕区块链技术的技术和监管关注问题。它将展示当前监管审查中的空白，以及我们正尝试填补这些空白的方法。


    # 10 加密货币与政府监管


    虽然加密货币的现状引起了许多人的兴趣，但该行业的未来是其中最重要的的一点。加密货币是一个新概念，它正试图渗透传统银行系统和其他行业。这意味着它在运营时背上背着一个名义上的“靶子”，这个目标是由监管机构和中心化金融领域内的反对者放置的。本章将讨论目前政府对加密货币的监管规定，以及对美国和欧洲未来监管的预测。


    本章还将讨论中国加密货币的现状。中国决定创建自己的数字货币，这一概念由中国首创（但其他国家也正在考虑这一点）。


    ## 美国政府对加密货币的态度


    加密货币在 2017 年比特币泡沫后首次出现在美国政府的雷达上。随着美国人通过这个神秘平台流转数百万美元，美国证券交易委员会（SEC）和大商品期货交易委员会（CFTC）介入了（见图
    10-01）。在美国，任何超过 15,000 美元的资金转账都需要纳税。在与纽约联邦储备银行的会议上，SEC 主席解释说比特币是一个紧迫的话题，因为如此规模的未注册资金转移有动摇市场的能力。不久，SEC
    限制了任何交易型基金（ETF）包含加密货币。它还决定不注册初始代币发行（ICO）。在 2017 年夏天，SEC 发布了一声明说明，虽然某些 ICO 可以是合法的投资，但它们具有欺诈的可能。仅在那一年，SEC
    就针对 ICO 采取了三次执法行动。


    2017 年，大商品期货交易委员会（CFTC）将比特币指定为商品，这意味着除了所有的比特币期货交易外，所有的欺诈活动都受其控制。凭借这一权力，CFTC 发行了两种比特币期货，并为这些期货提供了合法的交换执行。


    ![Figure 10-01. 数字资产的监管。](img/img-126.jpg)


    图 10-01. 数字资产的监管。


    美国国税局（IRS）在 2017 年建立了可能最复杂的比特币审查机制。对于 IRS 来说，比特币是财产。这意味着 IRS 对交易比特币的利润征税。同样，如果仅仅是持有，则会对收益或亏损征常规税收。


    在加密货币的州级监管方面，其接受程度更高（见图 10-02）。佛蒙特州开始允许将区块链上的交易记录作为法庭证据，其他州最终发展到促销加密货币平台；特拉华州开始允许公司通过区块链系统发行股票。一个旨在指导各州如何处理联邦法的全国会议成立，并决定各州有权允许加密货币业务在其范围内运营。


    ![Figure 10-02. 对加密货币最友好的美国 5 个州](img/img-127.jpg)


    图 10-02. 对加密货币最友好的美国 5 个州


    2017 年最后一个对加密货币采取立场的美国部门或机构是财政部（USDT，注：原文）。USDT 侧重于维持美国经济的稳定，该部门内部有一个名为金融犯罪执法网络（FinCEN）的局。该局被分配了在财政部内部监管加密货币的角色，并决定加密货币在美国不会被视为法货币。然而，他们表示将调查加密货币如何在美国经济中发挥安全作用。


    自 2017 年的泡沫以来，美国政府对加密货币的监管走了一条有趣的道路。从一个引发大量财政投机的时期开始，加密货币已被证明不仅仅是一种时尚。尽管如此，它仍有很多需要证明的东西，美国政府已经表明对加密货币并不完全放心。甚至可以说，由于加密货币正在获得越来越多的接受，美国政府的监管才刚刚开始。


    ## 欧洲接受加密货币


    欧洲在加密货币方面遵循了自身的道路。对于欧盟而言，任何促进加密货币交易的公司必须注册货币的发送者和接收者。这一政策的目的是减少涉及加密货币的非法交易数量。从
    2021 年 7 月开始，发送或接收加密货币必须列出姓名、地址、出生日期和公司特定账号。


    在欧洲，德国正热情地拥抱加密货币。在德国，如果加密货币持有超过一年，则免税。因此，柏林被称为欧洲的加密货币之都。


    中国的与数字货币之舞：数字人民币与比特币


