    because they are the best-known, and anyone getting into crypto or already in,
    ought to have a some of these coins in their portfolio. Hodling is also much less
    time consuming, much less arduous, and much lighter in terms of paying commissions.


    Despite these positives, there are obviously potential gains that are missed,
    and it requires a lot of patience to achieve satisfactory returns.


    ## Steps to Making the First Investment


    To get started with cryptocurrency trading, one must register with an exchange
    in order to purchase coins. When deciding which exchange to choose, there are
    four aspects to pay attention: transaction fees, the variety of currencies available,
    the volume of transactions, and whether they provide a wallet to store the coins.


    In terms of these criteria, one of the most widely used exchanges overall is `Coinbase`.
    This platform offers a wallet, is very accessible, and has high liquidity. The
    interface is easy to navigate, and it can process over $9 billion in a day.^([7](#notes.xhtml#chapter1-7))
    `Coinbase` meets the needs of most beginning and experienced traders: 56 million
    users are trading over $300 billion worth of cryptocurrency on `Coinbase` each
    quarter. It has the third-highest trade volume of all exchanges, according to
    crypto data firm `CoinMarketCap`. Transaction fees range from $0.99 to $2.99 or
    up to 0.5 percent on `Coinbase’s` more advanced exchange, `Coinbase Pro`.^([8](#notes.xhtml#chapter1-8))

