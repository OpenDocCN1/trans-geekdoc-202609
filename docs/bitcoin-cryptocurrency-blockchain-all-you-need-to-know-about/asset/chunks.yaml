  trans: '

    除了加速交易外，区块链还赋予了信任。这种信任源于其内置的安全措施，这些措施可以免受黑客攻击、数据伪造或人为篡改的影响。其中一种措施是区块链的去中心化网络，这通过消除任何单一入口使得攻破区块链变得困难。另一个固有的安全特性是所使用的基础算法，例如
    `Bitcoin` 的 `proof-of-work` 算法（它似乎遵循`拜尔庭故障解决方案`）。这些算法可以配合数字签名工作以确认交易，进一步增强了完整性。


    在下一章中，我将讨论不同区块链账本和加密代币类型之间的区别。将介绍并总结代币分类倡议（`Token Taxonomy Initiative`），以及个人身份中心。本章将通过揭示物物、加密货币和融资的交汇作为结束。


    加密代币可以作为政府控制法货币价值交换的标准单位。区块链技术为企业筹集风险资金提供了创新的方式，包括美国政府设立并监管的全面证券代币发行（`STOs`）。


    本章还将探讨资产代币、实用型代币和货币之间的区别，并展示代币分类倡议（`TTI`）如何为代币的实例化提供通用框架。


    区块链正在改变微型金融计划，通过为申请人提供更少限制的信用报告和更低的利率，使资本更容易获得。本章将介绍区块链如何处理身份管理，以及通过个人身份中心实现去中心数据的理念。最后，本章将对比私许可账本与公许可账本。


    ## 区块链与风险投资


    区块链技术为企业筹集风险资金提供了创新的方式，包括证券代币发行（`STOs`），它可以容纳数百名投资者，而传统的风险投资（`VC`）基金只能容纳几十名。


    拥有白皮书、网站和自定义加密货币的初创企业可以向潜在投资者推销其愿景。投资者用法币为公司提供资金，以换取该公司新发行加密货币的比例份额。投资者在赌博，随着业务理念的成熟和广泛的支持，他们收到的加密货币价值将大幅增加。这种初始投资通常通过首次代币发行（`ICOs`）的形式进行，但在它们声名扫扫地之后，`STOs`
    变成了合法的后续选择。


    `ICOs` 作为新项目的筹款机制，允许提议的数字币与 `Bitcoin`、`Ether` 或法币交换。`ICOs` 与首次公募（`IPOs`）相关，投资者可以购买公司的股票。遗憾的是，`ICOs`
    在没有任何监管的情况下从公众那里募集了数百万美元，这导致不择良的骗子摧毁了 `ICO` 的概念。结果是，2017 年证券交易委员会（`SEC`）将来自 `ICOs`
    的代币分类为证券，并基于其误导投资者的理由将其取缔。2017 年，`ICOs` 筹集了 56 亿美元，但今天投资者渴望一种合法的替代方案来燃料创业创新和财富。


    `STOs` 的合法性是优于 `ICOs` 的明显优势。`STOs` 的市场潜力在于它们允许投资者合法投资并维护数字安全的股票证书。


    为了评估 `STO`，使用了 `Howey 测试`（Howey test）。`Howey 测试` 评估代币是否提供了贡献或投资资金以换取公司利润份额。如果代币确实提供了这种机会，那么它就是证券发行。


    确定代币是否符合 `STO` 要求的另一种方法是基于它是否构建在作为分布式账本的区块链系统上。在这种情况下，该代币被视为《1933 年证券法》第 `Section2(a)(1)`
    条下的“证券工具”。该法侧重于投资合同，在加密货币的情况下，将区块链视为证券合同。


    与 `STOs` 相关的法规使得它们在合规方面成本高昂，因此 `STO` 可能会抑制投资机会。企业可以考虑的另一种务实的方法是实用型代币。


    实用型代币是用户代币或应用币，作为数字优惠券，可以兑换折扣或访问公司提供的产品和服务。实用型代币不被视为投资，因此豁免了证券法律的限制。


    实用型代币的持有者获得了对发行企业的专属直接访问，因为该代币在其他地方没有用途或价值。实用型代币可以作为资产，例如汽车制造商的车证。汽车制造商因此消除了对中间商（即经销商）的需求。


    ## 代币分类倡议 (TTI)


    有了所有这些代币，事情可能变得复杂。为了缓解这种困惑，建立了一种新的代币标准。这种标准被称为代币分类框架（`TTF`）。


    `TTF` 是 2019 年由代币分类倡议组织的成员建立的。该倡议的使命是通过创建一套开发者和业务专业人士都能理解的通用定义，来促进业务与区块链之间的联系。具体而言，它关注代币的不同用途，以便人们知道如何在各种行业中使用它们。正如代币分类倡议组织主席、微软首席架构师
    Marley Gray 所说：


    无论是门票、供应链文件、股票、产权证书、忠诚度积分，还是其他尚未构想的基于区块链的产品和服务，代币的使用应该能够跨平台实施。如果我们想充分利用协作平台提供的优势，跨平台交易必须能够相互通信。标准就是从这里开始的，而框架使解锁区块链上未开发的代币潜力成为可能。


    `TTF` 所列的标准共享在 `GitHub` 仓库中，这意味着信息是公开可用的。这里包含的信息通过用例、术语、分类和技术讨论提供了对各种代币概念的见解。这里还有一套可重用的工具，使使用户能够快速设计自己的代币。

    '
