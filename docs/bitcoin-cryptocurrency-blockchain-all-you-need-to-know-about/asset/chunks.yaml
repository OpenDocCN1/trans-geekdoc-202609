  trans: '


    1. **稳定币**。一种与加密货币以外资产（如欧元或美元）挂钩的加密货币，旨在稳定其价格。

    2. **预测市场**。加密货币预测市场是 DeFi 协议，允许任何人（无论身份、位置或国籍等任意因素如何）对事件的结果结果进行交易。一旦满足某些条件，智能合约就会自动执行，无需中心化机构的输入干预。

    3. **去中心化交易所 (DEX)**。去中心化交易所的工作原理类似于在线交易所，允许用户进行货币兑换，例如将美元兑换为比特币。区别在于，DEX 直接将用户连接在一起，因此他们可以在无需中介的情况下随时交易加密货币。

    4. **贷款平台**。贷款平台基于智能合约，旨在取代银行等传统中介机构。


    `money legos`（金钱乐高）一词通常被用来指代 DeFi 的关键特性，也称为组合性。这个概念非常简单：组合性是指 DeFi 协议之间的互操作性，它为
    DeFi 终端用户提供了高效、富有创新的金融服务和产品。这些协议的示例包括 `Aave`、`Yearn`、`Synthetix`、`Curve` 和 `RenVM`
    等，它们相互融合，能够实现、处理和交付只有在 DeFi 中才可能的新金融产品。DeFi 协议的开放和无许可性质允许你堆叠 dApps 以解锁不可思议的收益耕矿回报、部署闪电贷或获取会自动偿还的贷款。只需通过手机上的应用，你就可以利用你拥有的加密货币，将其作为抵押获得贷款，或作为在去中心化网络上向同行提供贷款的基础。虽然这种场景描述了
    DeFi 的简单应用，但未来的可能性几乎是无限的。你最终可以在 DeFi 平台上购买土地，并使用规定还款条款的贷款智能合约。


    ## DeFi 与智能合约


    DeFi 消除了对中心化机构（如经纪商、交易所或银行）监督金融交易的需求，允许你匿名执行不可篡改的交易。它是安全的，不受金融机构干预，且极具效率。


    DeFi 是传统中心化金融服务的全球性和开源替代方案，涵盖了广泛的应用。它不仅涉及 `Bitcoin` 等加密货币，还包括构建在区块链网络上的智能合约和数字钱包等复杂工具。DeFi
    的愿景是在不限制于特定中心化金融机构的情况下进行所有金融交易。


    ## 什么是智能合约？


    智能合约是基于区块链网络的计算机程序，在某些特定条件下自动执行。它们在建立业务关系和合作方面非常有帮助。智能合约强制业务交易的条款和协议，执行金融交易，并作为封装在软件代码中的具约束力的合同。它们可以在相关方之间交换和使用，无需任何中介服务。


    例如，如果你想确保向卖方支付资金，可以使用智能合约作为手段，通过唯一的安全令牌来验证每笔交易。假设你正在从卖方处购买物品，智能合约可以在你收到产品时自动执行，并立即将资金从你的账户转入到卖方账户。


    智能合约和 DeFi 允许点与点之间进行直接交易，而无需依赖第三方交易通道。去中心化智能合约可以取代这些受信任第三方服务提供的安全审批和验证流程。


    ## DeFi 解决了什么问题？


    DeFi 让你能够在无需向任何人许可的情况下进行金融交易。你不需要遵守银行规定，也不需要为你的金融交易支付服务费。DeFi 帮助你以去中心化的方式进行安全、开放、匿名的交易，同时降低每个人的成本。以下是
    DeFi 带来的一些主要优势：


    1. **为中小企业提供更好的机会**。中小企业现在可以远离限制性强且成本昂贵的传统银行服务，转而通过点点交易和支付开展业务。

    2. **独特的数字身份**。截至 2017 年，约有 17 亿人没有有效的银行账户，因为他们缺乏身份身份证明。DeFi 和智能合约可以通过独特的数字 ID
    帮助解决这个问题。

    3. **数字市场**。DeFi 帮助买家和卖方在共同市场对接，无需支付 `Amazon` 和 `eBay` 等平台收取的佣金或版税。

    4. **代币化**。加密货币只是我们为区块链创建的代币示例之一。此外还有实用代币、非同质化代币（NFT），甚至是受监管的证券发行。


    ## DeFi 的市值范围是多少？


    目前，DeFi 市场由各种金融领域组成，主要关注点点交易、交易所以及金融借贷。


    DeFi 正被应用于商品和资产交易所以及流动性池，例如 `Bancor Network` 和 `Uniswap`。


    根据 `JPMorgan` 的数据，`Ethereum` 是目前最著名的 DeFi，以太坊上的 DeFi 总锁量（TVL）已从去年的 200 亿美元飙升至今天的近
    2000 亿美元。截至 2021 年 11 月，DeFi 总锁量达到了 2360 亿美元的历史高点。


    2020 年 6 月推出的名为 `Compound` 的 DeFi 服务经历了快速增长。`Compound` 是一个托管各种加密货币贷款池的 DeFi 协议。这些池允许代币持有者提供其代币，供他人根据供需关系的算法利率贷款。


    ## DeFi 面临的主要障碍


    DeFi 的增长比预期要慢。为了更广泛的应用，需要消除某些障碍。


    1. 虽然 DeFi 在技术方面进展良好，但用户界面（UI）体验仍有很大改进空间，因为它基于加密货币。用户需要一个简单直观的界面来转换法币为加密货币。在此之前，难以
    难以实现普及。

    2. 与中心化系统相比，DeFi 系统的流动性在定价方面并不高效。区块链上的交易费用通常高于中心化金融（CeFi）。在 `CeFi` 中，金融机构可以依靠对客户进行
    `KYC/AML` 验证，从而选择免费提供交易服务（或根据政府免费提供某些服务）。

    3. DeFi 要求产品过度抵押，有时高达 150%，这限制了获得额外资金的机会。这种限制性是由于 DeFi 网络上缺乏先进的信用评级系统来帮助缓解风险。需要进行更多研究，以开发出与传统信用评分系统竞争的系统。


