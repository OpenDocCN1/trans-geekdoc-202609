    3.  Tokenization and interoperability will be enhanced with the release of Ethereum
    2.0.^([9](#notes.xhtml#chapter13-9))


    4.  Both Ethereum and Stablecoins are expected to keep growing exponentially.
    Coin Quora believes that if Ethereum can maintain its general bullish trajectory,
    it can hit $6,500, or even $7,000, by the end of 2022. They see it growing similarly
    in 2023, to $9,500, and have set a lofty 2025 price target of $20,000.^([10](#notes.xhtml#chapter13-10))


    ## DeFi versus CeFi: Pros and Cons


    The market cap for DeFi is growing rapidly every year. According to CoinGecko,
    the combined capitalization of DeFi tokens pushed above its May all-time high
    of $150 billion on October 26, 2021.^([11](#notes.xhtml#chapter13-11)) However,
    let’s take a moment to see if DeFi does meet the requirements for a finance system.
    Decentralized finance can generate high returns, but you need to understand the
    risks. What are the pros and cons of DeFi?


    Here are some popular applications of DeFi:


    1.  Decentralized exchanges allow for trading tokens, cryptocurrencies, and other
    assets without the need for intermediaries.


    2.  DeFI simplifies the lending process without the reliance on credit scores.
    While lenders receive interest, borrowers can use collateral and easily borrow
    without any other restrictive regulations.


    3.  One of the innovative DeFi protocols out there is the system of a no-loss
    (lossless) lottery, which allows participants to purchase tickets and stand a
    chance to win rewards. The catch is, their initial capital would never be lost,
    and they can continue to participate in future lottery draws!


    4.  NFTs can be used to authenticate ownership of digital assets like artworks,
    recordings, and virtual real estate or pets, because each NFT is unique.


    ## Pros of DeFi


    DeFi works well for the above application scenarios because of its highly efficient
    implementation, which removes the reliance on intermediaries. Here are some of
    the advantages of DeFi:


    1.  Reduction of manual errors and mismanagement. Smart contracts and the entirely
    digitized process of DeFi minimize human error and mismanagement in financial
    procedures.


    2.  Permanent and fast access. A considerable portion of the world’s population
    still does not have a bank account and finds it challenging to implement unique
    identification systems properly. DeFi can help remove restrictions in the traditional
    banking system, allowing people to get loans with just one click and access the
    market from anywhere at any time.


    3.  Permissionless operations. Every operation and financial transaction within
    a centralized finance system consists of several stages of approval and rigid
    processes. DeFi simplifies it all and enables permissionless operations that are
    quick and secure.


    4.  Removes the need for direct contact. Sellers and buyers can transact securely
    without knowing each other’s identity. DeFi can eliminate the need for physical
    contact and alleviate issues arising from global lockdowns and mobility limitations,
    as experienced during the COVID-19 pandemic.


    5.  Better security. One of the limitations of CeFi that DeFi has the ability
    to overcome is the question of custody. CeFi also tends to become an easy target
    for hackers if the platforms have high liquidity. A completely decentralized platform,
    DeFi follows the mantra *Not your keys, not your coin.* In other words, in a decentralized
    system there is significantly less chance of your funds being compromised.


    ## Cons of DeFi


    While DeFi provide an exciting alternative to centralized finance systems, it
    still needs to overcome specific roadblocks in order to be considered for broader
    adoption across all markets. DeFi is still a growing technology, and there are
    some doubts about it. Here are some of the cons you need to be aware of:


    1.  Scalability. The scalability of the host blockchain technology can raise some
    concerns about the overall scalability of DeFi solutions. Network performance
    issues may shoot up as DeFi transactions increase in number.


    2.  Permanent contracts. Smart contracts are permanent, and once the transaction
    is done, it cannot be reversed. Any flaw or fraudulent activity on smart contracts
    can cause permanent loss of funds.


    3.  Low liquidity. All DeFi projects currently suffer from the problem of low
    liquidity.


    4.  Overcollateralization. Overcollateralization occurs when the value of the
    borrower’s staked asset is more than that of the loan amount. The DeFi space will
    have to get over the issue of overcollateralization in order to avoid crippling
    its potential to make financial services truly accessible.


    5.  Lack of interoperability. There is low interoperability between the various
    blockchain implementations such as Bitcoin, Ethereum, Binance smart chain, and
    others.


    6.  Insurance. During 2021, the DeFi sector experienced theft of over $120 million
    as a result of hacks or exploits, with more threats still looming. In just one
    weekend of May 2021, $22 million was stolen from three DeFi platforms. DeFi systems
    do not offer the kind of insurance coverage that you would expect from CeFi. Fortunately,
    a few innovative decentralized insurance services are being launched that utilize
    the power of blockchain technology and smart contracts to offer users cover against
    loss from black swan events, wallet hacks, smart contract exploits, and much more.
    A few of the companies pushing the envelope for decentralized insurance are Nexus
    Mutual, Unslashed Finance, and iTrust Finance.


    7.  Immutability. DeFi protocols utilize automated software for, and any flaw
    in the code, once it is published, could spell disaster, as it cannot be corrected.
    DeFi, being noncustodial finance, also places the risks on you alone, meaning
    that newbies who do not understand the hidden and underlying risks behind DeFi
    may experience substantial losses. An example of this was seen in the recent failure
    of the YAM protocol. The YAM protocol was unaudited, and users ended up panicking
    about their funds after discovering the presence of a fatal bug in the protocol.
    They quickly began to withdraw their funds after having initially deposited nearly
    $600 million.


    ## DeFi Use Cases


    1.  1\. Open lending platforms. Open lending platforms constitute one of the most
    widespread uses of DeFi. Leveraging Dapps, users can either lend their digital
    assets to other users to earn interest or borrow digital assets from other users
    in return for making interest payments. Borrowers are required to deposit collateral
    that is worth considerably more than the amount they are borrowing. The only way
    to protect the borrower is by maintaining the collateral above a particular value
    threshold, known as the loan- to-value (LTV) ratio. If the borrower fails to maintain
    the LTV ratio, the lender will be reimbursed by selling the collateral.'
