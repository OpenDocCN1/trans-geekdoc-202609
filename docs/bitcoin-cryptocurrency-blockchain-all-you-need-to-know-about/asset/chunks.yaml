- raw: 'Some additional careers are in management. Managing in blockchain can take
    two forms. The first is serving as a *marketing manager.* These people must effectively
    communicate innovations and products to current users, potential new ones, and,
    most importantly, investors. They make on average around $180,000 a year. The
    second type of manager is a *project manager.* They plan and assign projects to
    various sectors of blockchain production. They earn less than marketing managers,
    with an average salary of $100,000.^([7](#notes.xhtml#chapter2-7)) Because blockchain
    is such a young industry, marketing is a necessity for blockchain companies to
    secure their position in the market.


    Other career opportunities include being a *blockchain UX designer.* Creating
    the user interface for blockchain services is just as important as it is for other
    Internet services. However, blockchain is a recent technology, and its interface
    must garner trust from skeptics and new users. This job usually earns over $100,000
    in salary.


    Another career option is becoming a *blockchain quality engineer.* Highly skilled
    technicians who understand how to handle quality assurance in the blockchain industry
    are needed to test the developers’ products. These engineers earn an average of
    $100,000 to $120,000 a year.


    The final job on this list is *blockchain legal consultant.* Governments and big
    tech companies in particular need such consultants. The implications of blockchain
    are enormous and growing: for example, it can tear down the international barriers
    to transferring data electronically. Furthermore, companies seeking to enter the
    field must be aware of the legal restrictions involved. As a result, these employers
    seek legal consultants who are versed in blockchain law.


    Certain key aspects make careers in blockchain unique. In years past, jobs in
    this field tended to be quite informal. They were generally freelance jobs that
    were paid in cryptocurrency. Nowadays, jobs in this field are more often at real
    companies and paid in regular currency. Nevertheless, many of these jobs are with
    companies that pay in cryptocurrency.


    While developers will be specialized in coding and managers will be specialized
    in marketing, having a general awareness of all aspects of the cryptocurrency
    world is important, including markets, political and economic environments, and
    technological advances. The companies in this field are building a future for
    the new Internet. Staying on top of which company is best handling that responsibility
    will be a big boost to one’s career.


    ## Going All In: Finding a Career in Cryptocurrency


    Many individuals see cryptocurrency as a fascinating and enticing avenue for creating
    wealth, which it is. However, an entire industry is set up around it, and it is
    only just beginning to grow (see [Figure 02-03](#chapter2.xhtml#fig8), next page).
    For example, the popular job search site [Indeed.com](https://indeed.com/) displayed
    over 500 cryptocurrency-specific jobs available in 2020. The company Cryptocurrency
    Jobs has almost 500 companies searching for employees via their services.^([8](#notes.xhtml#chapter2-8))


    Beyond the world of blockchain, there is a multitude of other jobs available in
    the crypto field. Financial analysts who are well versed in the crypto space are
    in high demand from traditional investment firms trying to break into the crypto
    market. This career is a fantastic intersection between the worlds of old finance
    and future finance. The average salaryoffered on [Indeed.com](https://indeed.com/)
    is $70,000 a year, and these professionals are most sought after by big Wall Street
    banks.


    ![Figure 02-03. Bitcoin Job Growth Outpacing Cryptocurrency Prices.](images/img-44.jpg)


    Figure 02-03. Bitcoin Job Growth Outpacing Cryptocurrency Prices.


    Another career in crypto that is involved with trading is journalism. As explained
    earlier, market research is hugely important in crypto trading. There need to
    be people producing that material for investors. These writers are earning on
    average $250 per 500-word article, depending on the quality of the writing.^([9](#notes.xhtml#chapter2-9))


    Within blockchain businesses, there are a few career options. The first is serving
    as a machine learning engineer. Cryptocurrency is entirely digital. Therefore
    it requires many skilled coders and engineers to protect its integrity and defend
    against hackers. Engineers with expertise in cryptocurrency programming earn between
    $60,000 and $150,000 a year.


    See [Figure 02-04](#chapter2.xhtml#fig9) for the percentage of jobs available
    by primary role. New cryptocurrencies come with white papers, which are long documents
    that describe the currency in order to attract investors. Those white papers must
    be written by technical people who understand crypto and know what investors are
    looking for.


    ![Figure 02-04. Jobs by Primary Role.](images/img-45.jpg)


    Figure 02-04. Jobs by Primary Role.


    Beyond the white paper, cryptocurrencies also need to be marketed. Marketing managers
    for currencies and blockchains are in high demand as people try to make a name
    in this budding industry. These marketing positions in cryptocurrency earn around
    $75,000 a year and represent the fourth highest-earning job titles in crypto.^([10](#notes.xhtml#chapter2-10))
    For people looking to play a larger role in cryptocurrency, many lucrative career
    options are available beyond trading.^([11](#notes.xhtml#chapter2-11))


    ## Finding a Path for Small Businesses


    While it is clear that blockchain technology should be implemented across a wide
    range of industries, its relevance to small business is particularly easy to perceive.
    It’s obvious that small businesses deal with a plethora of challenges. For example,
    virtually every small business will struggle with cash flow. Research shows that
    over 40 percent of small businesses struggled with cash flow in 2019–2020.^([12](#notes.xhtml#chapter2-12))
    This problem arises mainly from a lack of receivables (see [Figure 02-05](#chapter2.xhtml#fig10),
    next page). *Forbes* estimated that 33 percent of those small businesses with
    cash flow struggles encountered them due to late receivables.^([13](#notes.xhtml#chapter2-13))
    Receiving money late throws off the stability of a small business. Blockchain
    combats this issue by using smart contracts—the contract self-executes without
    the need towait on a supplier. Once the deliverable is complete, the funds automatically
    transfer from supplier to business.


    ![Figure 02-05. Cash Flow Problems.](images/img-46.jpg)


    Figure 02-05. Cash Flow Problems.


    Another issue that confronts small businesses is cybersecurity. Unlike large corporations,
    which can afford big departments dedicated solely to security, small businesses
    have a much harder time protecting themselves. Statistics show that two-thirds
    of small businesses have faced problems with cybersecurity. In the United Kingdom,
    small businesses lost an estimated £13.6 billion to cybersecurity attacks. It
    has become such a threat that President Trump signed the NIST Small Business Cybersecurity
    Act into law in August 2020. The U.S. government has thereby taken a bold step
    toward assisting small businesses with this problem. Blockchain solves it by being
    inherently decentralized. Data stored on a blockchain thwarts hacking attempts
    and prevents transactions from being tampered with by hackers.'
