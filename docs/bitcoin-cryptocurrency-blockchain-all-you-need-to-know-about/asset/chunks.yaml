- raw: 'Trade is the basis for most forms of economics. Historians trace the concept
    of bartering as a mechanism for the exchange of value to as far back as 6000 BC.^([1](#notes.xhtml#chapter7-1))
    Villagers and merchants would exchange a variety of goods such as salt, sugar,
    grain, cattle, weaponry, and textiles. Eventually bartering evolved to include
    the exchange of services.


    A community often establishes bartering during a monetary collapse, crisis, or
    scarcity in order to continue trading goods and services. Bartering regained popularity
    in the United States during the colonial era of the seventeenth and eighteenth
    centuries, the Great Depression, and the 1980s recession.^([2](#notes.xhtml#chapter7-2))
    People established barter groups like the Unemployed Citizens League of Denver
    (34,000 members), and the National Development Association.^([3](#notes.xhtml#chapter7-3))
    The International Reciprocal Trade Association reports that in 2011, over 400,000
    companies worldwide used bartering to earn an estimated $12 billion on unwanted
    or underused assets.^([4](#notes.xhtml#chapter7-4))


    A key advantage of bartering is flexibility: not having to depend on money as
    a medium of exchange, the parties can obtain what they need by merely exchanging
    the goods and services that they already have.^([5](#notes.xhtml#chapter7-5))


    There are several disadvantages to the bartering system. First, there is a need
    for mutual trust between the parties to the transaction. Thus there may need to
    be a regulatory authority or trusted intermediary to enforce or arbitrate an agreement
    in the event of a conflict. Other disadvantages of goods and services include
    the lack of a standard unit of measure, indivisibility, storage limitations, and
    the difficulty in making deferred payments.^([6](#notes.xhtml#chapter7-6))


    Bartering is growing worldwide, partly because of shortages of hard currency.
    Currently, eighty-eight countries barter regularly, while in 1973, only fifteen
    did so. Some analysts estimate that up to 30 percent of global trade now takes
    place in the form of bartering.^([7](#notes.xhtml#chapter7-7)) However, the lack
    of development of common bartering standards and mechanisms means that countries
    with currency shortages cannot quickly increase their trading.


    ## Blockchain Bartering


    Blockchain creates a decentralized platform to support trade and address the typical
    disadvantages of conventional bartering. Cryptocurrency serves as a common measure
    of value for any barters that take place. The digital currency can be used from
    anywhere in the world, and the location independence promotes international trade.^([8](#notes.xhtml#chapter7-8))


    In 2018, the Canadian online bartering platform Bunz reportedly became the first
    to launch, with an already-established community— its members. The platform uses
    its cryptocurrency, BTZ (pronounced “bits”), which can be exchanged for goods
    and services or traded between members. The platform has approximately 200,000
    users. BTZ is also accepted instead of cash at hundreds of local retailers in
    Toronto, Ottawa, Montreal, and Vancouver.^([9](#notes.xhtml#chapter7-9))


    ## The Purpose of Currency


    The idea of currency as an abstraction emerged from bartering as a right (power)—a
    right to acquire value and have a medium to exchange.


    Currency emerged as a standard for deferred payments, measuring the value of goods
    and services. Money morphed from standardized coins, such as precious metals (simultaneously
    a store of value and an item to purchase value), to a token (token coins, fiat
    money) and a right (claim to value) controlled and guaranteed by a ruling authority.
    Eventually, trusted intermediaries, such as banks, emerged. At the same time,
    the ruling body managed the creation of money and monetary policies while providing
    a level of immunity to protect the assets of citizens using banking services.


    ## Development of Money


    Literary and linguistic evidence from the ancient world and primitive money from
    many countries demonstrate that while the disadvantages of barter provided a purely
    economic impetus for the development of money, it was not the main factor, and
    it certainly was not the most important.


    According to Glyn Davies, author of *A History of Money,* “Money originated very
    largely from non-economic causes: from tribute as well as from trade, from blood-money
    and bride money as well as from barter, from ceremonial and religious rites as
    well as from commerce, from ostentatious ornamentation as well as from acting
    as the common drudge between economic men.”^([10](#notes.xhtml#chapter7-10))


    ## Coins as the Most Common Form of Bartering


    People became accustomed to using standardized coins, and eventually coins became
    authenticated by the ruling authorities. In the Middle Ages, coins became the
    general means for payment, and they carried a substantial premium over the value
    of their metallic content due to their convenience. Kings could turn this into
    a profit. Unfortunately, the kings who owned the mints sought to increase their
    margins by manipulating the quantity of precious metal in the coins, as well as
    the amount of the coins in circulation (recoinage).^([11](#notes.xhtml#chapter7-11))


    Existing coins were always recycled to maximize profit. To prevent competition
    from earlier issues, the authorities had to be able to identify the new coins
    while making them readily acceptable to the public. The coins were recycled far
    more frequently than could be justified by wear and tear. Still, this minting
    practice, which became known as *seigniorage,* was a lucrative extra source of
    profits that supplemented the revenue raised by the English monarchs through taxation.^([12](#notes.xhtml#chapter7-12))
    This practice debased the currency, reducing the value of the coins and thereby
    causing inflation. The currency transitioned from being a standard coin, whose
    face value was worth as much as the metal in it, to a token coin, whose face value
    was worth more than the metal it contained.^([13](#notes.xhtml#chapter7-13))


    However, revenue from minting depended on public confidence in the coinage, and
    consequently an elaborate system of testing was introduced. “Anyone who had to
    handle coins of silver or gold in any volume, whether merchants, traders, tax
    collectors, the King himself, the royal treasury, or the sheriffs, required reliable
    devices for testing the purity of what passed for currency,”^([14](#notes.xhtml#chapter7-14))
    according to one source.


    Thus, despite the challenge of counterfeiters, government was able to control
    coin production and hence the money supply. Not until the rise of commercial banking
    and the widespread adoption of paper money was this monopoly broken.


    ## Paper Money


    Standardized coins were used during the Roman era, and official coins were minted
    and produced in varying denominations. Coins became a standard tool for making
    purchases, and the idea spread far and wide throughout the following centuries
    for making purchases. The first coin ever minted features a roaring lion.^([15](#notes.xhtml#chapter7-15))


    In a massive leap toward the transition from an objective value to a value constructed
    as a function of social agreement, China introduced paper money around AD 600.^([16](#notes.xhtml#chapter7-16))


    In Western Europe during the time of the Crusades in the twelfth century, written
    instructions in the form of bills of exchange came to be used to transfer large
    sums of money, with the Knights Templar functioning as bankers.^([17](#notes.xhtml#chapter7-17))'
