- raw: 'The existing cryptocurrencies are not yet mature enough to replace regular
    payments with fiat money. The crypto market is still in its early days of development,
    and significant evolution in crypto is needed to create a financial system that
    can replace the current one. Most likely it will not come from any of the existing
    cryptocurrencies, but with the integra tion of policy and blockchain technology.
    But given the strong opposition to cryptocurrencies around the globe, it will
    likely take time before they enter the mainstream financial sector.


    The next chapter will focus on how the world is primed for crypto and how we are
    naturally shifting toward a cashless society powered by blockchain technologies.


    # 08 Blockchain Primers


    Many people believe that 2008 was the year when Satoshi Nakamoto first conceived
    blockchain. His influential paper on Bitcoin is commonly thought of as the beginning
    of blockchain technology. However, the reality is that blockchain was first developed
    in 1991 by Stuart Haber and W. Scott Stornetta, when they attempted to create
    a way to timestamp digital documents.^([1](#notes.xhtml#chapter8-1))


    Haber and Stornetta invented what became known as the Byzantine Fault Tolerance
    Solution. It was first introduced in 1982 by Leslie Lamport, Robert Shostak, and
    Marshall Pease.^([2](#notes.xhtml#chapter8-2))


    The problem contains the following conditions:


    A commanding general must send an order to his n-1 lieutenant generals such that


    1.  All loyal lieutenants obey the same order.


    2.  If the commanding general is loyal, then every loyal lieutenant obeys the
    order he sends.


    The “n” in the problem refers to the number of lieutenant generals to whom the
    commanding general must send his order. The “1” indicatesthat the commanding general
    must send orders to 1 fewer than the number of lieutenant generals he currently
    has.


    One issue presented in this problem is that the commanding general’s only way
    of communicating is with paper notes, which must be hand- delivered by a messenger.
    The messenger must cross through enemy territory on foot to deliver the paper
    order, with the possibility of being captured. If captured, the messenger can
    be turned into a traitor and forced to send incorrect orders to the lieutenants.


    An additional complication is that even if the messenger is not compromised, one
    of the lieutenants could be. As a result, the commanding general must account
    for the possibility that one or more of his messengers or lieutenants is a traitor.


    To counter this problem, the commanding general must implement a strategy to ensure
    that all his loyal lieutenants follow the same action plan, which would eliminate
    any threats from potential traitors. This solution is known as the Byzantine Fault
    Tolerance solution, or algorithm OM (0). Specifically, the algorithm states:


    1.  The commander sends his value to every lieutenant.


    2.  Each lieutenant uses the value he receives from the commander or uses the
    value RETREAT if he receives no values.


    An outline of Algorithm OM (0) is depicted below in [Figure 08-01](#chapter8.xhtml#fig19).


    ![Figure 08-01. Algorithm OM (0)](images/img-98.jpg)


    Figure 08-01. Algorithm OM (0)


    [Figure 08-02](#chapter8.xhtml#fig20) demonstrates how the algorithm works. First,
    the commander sends a message to every lieutenant, which in this case, is “v.”
    Each lieutenant must then relate their received message from the commander to
    all other lieutenants. If all the lieutenants are loyal, then each would send
    the message “v” to the other two lieutenants in this scenario. However, the above
    image shows that Lieutenant 3 sends the message “x” to Lieutenant 2, indicating
    that Lieutenant 3 is a traitor. In this case, both Lieutenant 1 and 2 receive
    messages “vvx.” Since “v” is the majority message received, “v” is an action plan
    the army executes.


    ![Figure 08-02. Algorithm explanation.](images/img-99.jpg)


    Figure 08-02. Algorithm explanation.


    If the commander is the traitor, shown above, then a different outcome occurs.
    In this case, lieutenants 1, 2, and 3 all receive different messages of x, y,
    and z, respectively. Sharing such messages means that each lieutenant would receive
    a final message of “xyz.” This message does not have a majority, and thus all
    lieutenants act on the default option of retreat.


    Both these cases outline how the Byzantine Fault Tolerance can prevent infiltrators
    from corrupting a messaging system by using a consensus protocol.


    The Byzantine Fault Tolerance also opened the door to consensus algorithms, which
    were fundamental to blockchain’s creation to timestamp digital documents in 1991
    by Haber and Stornetta. The system they created required that the actual bits
    of the document got time stamped, not only the document medium. Another requirement
    was that the data and timestamp could not be forged.^([3](#notes.xhtml#chapter8-3))


    After establishing these conditions, they then proposed using oneway hash functions
    and digital signatures to process documents instead of the actual documents themselves.
    A hash is a mathematical function that converts an input of arbitrary length into
    an encrypted output of a fixed length. Thus regardless of the original amount
    of data or file size involved, its unique hash will always be the same size.^([4](#notes.xhtml#chapter8-4))
    This procedure meant that they would submit documents to be linked, and then certificates
    of the linkage would be distributed to other clients. The clients would then have
    to timestamp the hash too. Their mechanism proved useful, and consequently the
    world’s first blockchain came into being.


    ## A Brief Introduction to Bitcoin


    Nakamoto further advanced the blockchain technology in 2008 when he released his
    white paper “Bitcoin: A Peer-to-Peer Electronic Cash System.” This paper utilized
    the principles established by Haber and Stornetta, demonstrating the influential
    role they played in the development of the new blockchain. Nakamoto’s blockchain
    was different in that it was a purely peer-to-peer network that would “allow online
    payments via electronic cash to be sent directly from one party to another without
    going through a financial institution.”^([5](#notes.xhtml#chapter8-5))


    “Peer-to-peer network” refers to various computers on a network, each considered
    to be a node. Each node then corresponds to a specific user that has two unique
    keys.^([6](#notes.xhtml#chapter8-6)) The first key is called a *public key.* This
    key is available for anyone to see on the public ledger. The second key is a *private
    key:* only the user knows their own private key, which functions asa password
    for them to authorize transactions. Users also have tokens on peer-to-peer networks,
    which can be any type of data (but are commonly presented as a type of cryptocurrency).


    Given these components, payment can be sent by the following mechanism: First,
    a user enters the public key of a recipient whom they would like to receive a
    token and then enters their private key, which executes the transaction. The transaction
    is not complete at this time; instead, it is only broadcast to the network. Once
    on the network, miners compete to verify the transaction occurred so it can officially
    be added to the ledger in a block. Only after the network has verified the transaction
    does the transaction truly occur^([7](#notes.xhtml#chapter8-7))


    The competition for verifying transactions is perhaps the most innovative part
    of Nakamoto’s blockchain, as it relies on the incorporation of the proof of work
    concept as a consensus algorithm.'
