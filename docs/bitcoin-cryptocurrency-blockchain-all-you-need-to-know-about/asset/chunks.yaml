- raw: 'A few months ago, while attempting to transfer £300 from the United States
    to the United Kingdom via Western Union, I paused to compare the cost of doing
    an international wire transfer through my bank. The transfer via Western Union
    was $100 more expensive, primarily because of the exchange rate.


    Cryptocurrencies enable the unbanked to bypass government issued fiat, which is
    subject to high transaction processing fees. A primary advantage of cryptocurrency
    is that it gives the poor and the unbanked the ability to make cross-border transactions
    with little to no exchange rate, giving them spending and money transfer capabilities
    formerly reserved only for the rich.


    ## Coercion in Fiat Currencies


    Fiat currency schemes are immoral because the primary behavior that makes them
    acceptable is coercion*.*^([8](#notes.xhtml#chapter4-8))


    In fiat, coercion is undeniable and in fact necessary for the adoption of fiat.
    For example, in 1933 the United States government threatened criminal penalties
    of $10,000, ten years in prison, or both, to force citizens to accept irredeemable
    Federal Reserve Notes in place of gold.^([9](#notes.xhtml#chapter4-9)) The government
    forced people to accept the fiat currency against their will.


    ## Hyperinflation in Fiat Currencies


    Between 2009 and 2012, the Bank of England created £375 billion of money, thereby
    devaluing the currency that was already in supply.^([10](#notes.xhtml#chapter4-10))
    Cryptocurrencies can prevent this type of inflation by restricting the amount
    of currency in circulation. Bitcoin, for example, has an upper limit of 21 million
    coins.^([11](#notes.xhtml#chapter4-11))


    The residents of Venezuela have been experiencing excruciating hyperinflation
    and saw prices rise by 12,875 percent during 2017.^([12](#notes.xhtml#chapter4-12))
    Given the terrible economic conditions in that nation, thousands of Venezuelans
    have turned to mining Bitcoin (BTC) and Ethereum’s Ether token (ETH), which can
    pay them $500 a month. Venezuelans can use their mined cryptocurrencies to purchase
    essential items like food and medicine through e-commerce, which is more efficient
    than bartering for consumer goods on the street. Occasionally mining equipment
    is seized and is sold by policemen as a way of gaining income. Nevertheless, the
    mined cryptocurrencies cannot be stolen or confiscated by authorities at gunpoint
    because the tokens are stored on password-protected wallets.


    Failure to link fiat currencies to physical reserves such as commodities puts
    them at risk of becoming worthless because of hyperinflation.^([13](#notes.xhtml#chapter4-13))
    The hyperinflation results in the devaluation of the currency because its supply
    and distribution spikes trigger price instability, which can artificially stimulate
    or depress the economy.


    As Voltaire famously wrote, “Paper money eventually returns to its intrinsic value—zero,”
    which is why the future of cryptocurrencies needs to be explored.


    ## Problems with Fiat Summarized


    Fiat is simply a currency created by a national government that has been declared
    legal. It was previously backed by physical commodities such as gold, but now
    it is supported by fundamental principles of supply and demand and the creditworthiness
    of the nation issuing the fiat. Fiat currencies are secure in that they are highly
    controlled and thus tend to be stable. However, if control of a fiat currency
    is in the wrong hands, then instability will take over.


    It is unlikely that fiat will continue to exist, because it is now just an abstract
    concept. The majority of modern fiat no longer exists as physical notes or coins,
    but instead as electronic numbers in a computer, which literally have no value.


    Furthermore, fiat is imposed upon us and allows the governing authority to redistribute
    wealth as it sees fit by altering quantity and availability, which can lead to
    hyperinflation. We are forced to use fiat because it is the only currency option
    available, effectively making it a monopoly.


    As a monopoly, fiat currencies consolidate wealth, which in turn destabilizes
    economies. The more concentrated the wealth becomes, the higher the risk for income
    inequality.


    Concentrated wealth fuels corruption in both wealthy and poor populations. In
    affluent communities, corruption arises from individual greed, and in poor communities,
    corruption is made evident by crime. If corruption continues then trust and confidence
    in the currency will be lost. As a result, the currency reverts to its intrinsic
    value of—zero. Therefore, communities must rethink their currencies. The examples
    below represent communities that did precisely that and ultimately ended up minting
    their own currencies.


    ## The Brixton Pound


    In September 2009, economists in the United Kingdom made a liquidity injection
    into Brixton, South London. They created a currency designed to support the local
    community. The Bank of England does not control the Brixton pound, which is transmitted
    by text from a cellphone. The Brixton pound (B£) is an additional form of payment
    for people who do not have a credit or debit card or do not want to get involved
    with banks. There are around 500,000 Brixton pounds in circulation, and over 200
    businesses across Brixton accept it.^([14](#notes.xhtml#chapter4-14))


    Brixton is a significant town center with an international reputation based on
    its markets, cultural and creative energy, and diversity. According to the Brixton
    pound website, the physical, paper-based currency was followed in September 2011
    by the launch of an electronic pay- by- text platform, which has since been retired.


    The mission of the Brixton pound was to support diversity and build resilience
    in the local Brixton economy, taking into consideration the challenging economic
    times and dominant chain of power. The Brixton pound further sought to raise community
    awareness of the local social economy and facilitate a self-help model to protect
    the financial future of Brixton’s residents. Another aim was to promote regional
    sourcing of goods to decrease carbon dioxide emissions and raise Brixton’s role
    locally and nationally as a trailblazer in financial technology (FinTech).


    The currency, which has a fixed one-for-one exchange rate with the pound sterling,
    is accepted at over 200 local shops and businesses. It can even be used to pay
    local taxes.^([15](#notes.xhtml#chapter4-15))


    *“*If you spend £5 on a cup of coffee in a chain store, the majority of that money
    just flies straight out to whoever owns the shares in the coffee chain,” said
    the Brixton pound director Charlie Waterhouse.^([16](#notes.xhtml#chapter4-16))
    “If you spend 5 Brixton pounds with a local, independent coffee shop, that money
    stays circulating in the area. It’s about empowering people to be able to make
    positive, economic decisions in their everyday lives.”


    The innate nature of Brixton pounds to circulate within the local community exemplifies
    how a community currency can be used to increase the community’s economic status,
    especially as regards small businesses. By challenging the control of money by
    the central authority, users of Brixton pounds determine the currency’s value,
    which in turn gains it more trust. Furthermore, the Brixton pound removes coercion
    as participants voluntarily decide whether or not to use it.


    Tom Shakhli, the engagement manager for the Brixton pound, believes that the more
    popular other mainstream crypto coins such as Bitcoin become, the more people
    are likely to adopt local virtual coins like his own. He states that “we all (i.e.,
    virtual coins) fall under the same umbrella, which is an alternative to the national
    currency. We are all part of that family, I guess. Each one gives the other more
    credibility.”


