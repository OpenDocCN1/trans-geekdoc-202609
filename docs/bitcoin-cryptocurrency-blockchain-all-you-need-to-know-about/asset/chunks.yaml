    The next step is to enter your sales terms; enter your price in flow, bearing
    in mind that as of January 5, 2022, the value was $9.24 per flow. Specify the
    title, description and the percentage for royalties. Select “Rarible” as your
    collection and then click “Create.” Click “Approve” to create your NFT ([Figure
    14-07](#chapter14.xhtml#fig36)). Note that typically you would pay a fee for creating
    an NFT, but for Flow the transaction is free.


    ![Figure 14-07. Approve NFT creation.](images/img-191b.jpg)


    Figure 14-07. Approve NFT creation.


    You will then be presented with proof of your newly created NFT!


    Click to “View NFT,” and you will see your digital art on sale ([see Figure 14-08](#chapter14.xhtml#fig37)).
    You have the option to remove from sale or share the NFT to potential customers.
    Proceeds of the sale of your NFT will be deposited into your MetaMask wallet.


    ![](images/img-192.jpg)


    ## Government Registries as Oracles for NFTs


    At the time of writing, there isn’t any regulation in place for nonfungible tokens.
    In other words, NFTs are not yet recognized as intellectual property or as title
    deeds for physical properties anywhere in the world. This makes their regulation
    all the more complex. However, as the space matures, government regulations and
    frameworks indicating how NFTS should be perceived and identified legally will
    likely emerge. We may see the emergence of blockchain-powered government registries
    that will act as oracles for the verification of existing NFTs as well as new
    NFT mints.


    Since there are no such systems in use yet, how they will work is still undefined.
    However, similar applications and existing innovations give us a good idea of
    what we are likely to see.


    ## Decentralized Autonomous Organizations (DAOs)


    With the tokenization of title deeds and IP rights on the blockchain, the use
    of DAO networks as self-verifying oracles will be ideal for the verification of
    most digital NFT types. An “oracle” sends data from the outside world, such as
    the daily temperature or the number of votes a political candidate received, to
    a blockchain such as Ethereum. A smart contract on the blockchain can then use
    the data, typically to decide whether to dispense money and to whom. Although
    these types of oracles do not yet exist for NFTs, decentralized price oracles
    are used by several decentralized finance platforms for external data such as
    price.


    Similarly, centralized blockchain oracles will be useful for government registries
    in verifying NFTs. This will be ideal for NFTs representing IPs and title deeds,
    since they need to be government approved.


    ## Copyright Infringements and Verifying Ownership with NFTs


    As noted, because the NFT space is largely unregulated, art theft using NFTs has
    become widespread. “Artists like Derek Laufman have had their work minted as NFTs
    and sold without their permission.”^([14](#notes.xhtml#chapter14-14)) Someone
    with a fraudulent OpenSea account claimed to be Laufman, and the impersonator
    was selling artworks from Laufman’s social media accounts.


    Laufman is just one of many artists who have been victims of NFT theft. The process
    is usually simple: steal an artist’s work, mint it on an NFT marketplace or auction
    site, and sell it as yours, or impersonate the owner and sell it under the guise
    of being the artist.


    There still is no standardized way of verifying NFTs. However, in the coming years
    we may see the integration of digital rights management (DRM) systems with NFT
    minting platforms and marketplaces, making it possible to restrict the ownership
    of an NFT to a given individual or institutional entity.


    For example, we may see the integration of NFTs into established authentication
    tools like Google Authenticator, with the tokens ID verifiable via its QR code
    format on such authentication DRM systems. We may see specialized mobile devices,
    desktop devices, or peripheral devices (similar to the Kindle device and hardware
    wallets) used for the storage, authentication, and management of an NFT portfolio.


    ## The Future of NFTs


    Like Bitcoin, NFTs will eventually settle into every aspect of life. With government
    registries around the world serving as oracles to verify who owns what, all forms
    of property rights will eventually be tokenized and attached to a unique private
    key.


    Also, with the fractionalization of nonfungible tokens into fungible tokens, we
    are likely to see NFTs merging with decentralized financial platforms for the
    purpose of liquidity. There will come a time when NFTs will serve as collateral
    for taking out fungible loans.


    With the way the space is evolving, there are really no limits to what we will
    be seeing.


    # 15 Blockchain and the Metaverse


    The metaverse is quickly becoming a household phenomenon, primarily because of
    Facebook’s rebranding as Meta in late 2021. In this chapter, my goal is to present
    an overview of the metaverse’s relationship to the Internet at large and with
    various technologies such as virtual reality and augmented reality. I will also
    touch on some of the initiatives inaugurated by the world’s largest companies,
    such as Meta and Microsoft, through products and services and the primary audience
    they are targeting.


    Web 3.0 is a critical philosophical and technological feature of the metaverse,
    and I will describe how it helps enhance the interdependency between blockchain
    and the metaverse. In terms of blockchain, the main components that it brings
    to the metaverse are technologies centered around decentralization, altcoins,
    and nonfungible tokens (NFTs).


    Lastly, I will present the idea of the virtual estate in the metaverse and an
    overview of the technologies and techniques needed to architect a building.


    ## What Is the Metaverse?


    There’s no universally accepted definition of a real metaverse. Some believe it’s
    just a fancier successor to the Internet. According to *Wired* magazine, 90 percent
    of the time, you can mentally replace the word *metaverse* with *cyberspace* in
    a sentence and there won’t be any substantial change to its meaning.^([1](#notes.xhtml#chapter15-1))
    Nicky Verdi,^([2](#notes.xhtml#chapter15-2)), in her article “The Difference between
    the Metaverse and the Internet,” argues that with the Internet, people are constantly
    interacting with their friends via a website, a game, or a social media platform.
    The metaverse takes this one step further, immersing the user in the middle of
    the action. The metaverse promises to extend our reality experience into the virtual
    and augmented. With technologies such as artificial intelligence, social media,
    online gaming, and cryptocurrencies, users will interact virtually. Supporters
    of the metaverse envision its users working, playing, and staying connected with
    friends through everything from concerts and conferences to virtual trips around
    the world.^([3](#notes.xhtml#chapter15-3))


    “With the Internet, you can be online without necessarily interacting with other
    people, but the foundation of the metaverse is about digital human interaction.
    It’s about people sharing a virtual universe together, be it for work, school,
    exercise, or simply for fun.”

