- raw: 'Bitcoin has fought an arduous battle trying to prove it can and should replace
    traditional fiat currency. In China, that is what cryptocurrency is actually doing.
    Unlike Bitcoin, this currency is issued by the Chinese government and is known
    as a central bank digital currency (CDBC). CDBCs were touched on in the last chapter,
    but the important distinction between Bitcoin and CBDCs is that the latter are
    not decentralized. There are other key differences, but it is vital to understand
    that CBDCs are not stored on a chain of networks: they are stored, distributed,
    and administered by a nation’s central bank. Another important point regarding
    CBDCs is they are not stablecoins. These are not digital currencies tied to the
    sovereign currency of that nation but rather they are actually *the* currency
    of the country.


    The benefit of CBDCs is that they are backed by the government of that nation.
    Currently, when a central bank wants to put money into circulation, it prints
    new money and uses it to enlarge bank reserves at commercial banks. The banks
    then spend that money through fractional reserve banking, and the new money finally
    makes it into the economy. With CBDCs, new money would be transferred directly
    from the central bank to the digital “pockets” of the citizenry.


    The Chinese CBDC is known as the digital yuan. It was first created in April 2020,
    and since then 20.8 million Chinese citizens have created their own digital yuan
    wallets. It has now reached eleven cities and provinces in China, facilitating
    nearly 71 million transactions in these areas. The Chinese government has multiple
    goals for the digital yuan: the firsttralized control over the digital yuan, meaning
    it can better influence monetary policy, freeze accounts, and fix money transfer
    errors. That would not be possible with a traditional cryptocurrency, given the
    latter’s decentralization and anonymity.


    There is some speculation that an undisclosed goal of the digital yuan is to undermine
    the global dominance of the U.S. dollar. Today the digital yuan is used mainly
    for domestic transactions, specifically as a way to simplify retail purchases
    and facilitate more economic activity during the COVID-19 pandemic.


    In 2019, global trade amounted over $19 trillion. The dollar is currently the
    world’s largest reserve currency, as it has been for the past seventy-five years,
    since the end of World War II. This is mainly due to the growth and overall strength
    of the U.S. economy. Globally there is a lot of trust that the U.S. will pay its
    debts, and thus the U.S. dollar is perceived to be the safest currency in which
    to store a country’s reserves. Being a global reserve currency means that central
    banks around the world hold large amounts of dollars. They do this to avoid having
    to convert different currencies when involved in international trade deals. The
    U.S. dollar makes up about 60 percent of global currency reserves, and is used
    in 75 percent of global transactions^([9](#notes.xhtml#chapter10-9)) (see [Figure
    10-03](#chapter10.xhtml#fig25)).


    ![Figure 10-03. Allocated Reserves by Currency.](images/img-130.jpg)


    Figure 10-03. Allocated Reserves by Currency.


    The fact that countries have to hold dollars in order to engage in trade creates
    a high demand for the dollar. This allows the U.S. to borrow very cheaply and
    thereby helps prop up the high value of the dollar.


    Once China implements cross-border transactions with the digital yuan, the currency
    will have the potential to compete with the dollar as the world’s reserve currency.
    China’s goal would be to potentially push other nations to increase their reserves
    of the yuan in order to trade more effectively, thereby putting the dollar at
    risk of losing its dominant position. In 2020 the yuan only made up 2 percent
    of global reserves. However, while the U.S. GDP shrunk by around 3 percent last
    year, China’s grew by 2 percent. This is to say that China is eager to play a
    larger role in the global economy, and the digital yuan might be a means to achieve
    that (see [Figure 10-04](#chapter10.xhtml#fig26)).


    Another important aspect to the creation of the digital yuan is its contribution
    to the growing influence of cryptocurrencies generally. Cryptocurrency has qualities
    that may improve the current role of cur rency in modern society. Meanwhile, governments
    are concerned about the integrity of their sovereign currencies. Each country
    is taking its own approach to the issue, and China is likely the most proactive
    at the moment.


    ![Figure 10-04. Digital Yuan Could Replace $16 Trillion in Dollar Deposits.](images/img-131.jpg)


    Figure 10-04. Digital Yuan Could Replace $16 Trillion in Dollar Deposits.


    China’s involvement is a double-edged sword. The first time the Chinese government
    started attempting to regulate Bitcoin was in 2013. Bitcoin had just reached a
    value of $1,000. Financial systems still viewed this as a “bubble,” and most of
    the general public was still unaware of this new form of currency. But the Chinese
    government realized that some of its citizens were using Bitcoin as a method of
    payment, and the People’s Bank of China announced that no banks would be allowed
    to carry out transactions with Bitcoin. When Bitcoin finally made its way into
    the mainstream media and the general public’s consciousness as the price skyrocketed
    in 2017, China banned all local exchanges that were using cryptocurrency. Platforms
    that facilitated the exchange of crypto were no longer allowed to be based in
    China. This ban caused the relocation of the major exchange Binance to the Cayman
    Islands.


    In May of 2021, China banned financial institutions and payment services from
    trading with cryptocurrency. This meant that any service that these two industries
    offered to their clients could not be performed with crypto. At this time China
    made up 70 percent of the Bitcoin and crypto market.^([10](#notes.xhtml#chapter10-10))
    The ban was inspired by the fear that the yuan would be undermined by this new
    currency, and as discussed earlier, the success of the yuan is China’s ticket
    to global influence. Cryptocurrencies create inflow and outflow opportunities
    that governments cannot control. This is the driving force behind all government
    sanctions on crypto. In the case of China, there was also a fear that volatile
    speculative trading would cause further turbulence in the national economy, as
    so much of crypto trading and ownership were in China.


    All this has culminated in China’s decision on September 24, 2021, to ban all
    cryptocurrency transactions in the country and all mining of Bitcoin there. While
    this obviously appeared to stem from an aggressive anticrypto sentiment, it came
    at the same time as use of the digital yuan was spreading rapidly across China.


    The Chinese government does not want cryptocurrency to undermine its authority;
    however, it clearly recognizes the benefits that a blockchain-administered currency
    has to offer. A government-issued digital currency allows the government to track
    the end-to-end transfer of money. This feature is especially attractive to a regime
    like China’s, which wants to maintain centralized control over its citizens. It
    is important to note that as of mid-2021, China topped the globe for the amount
    of computing power used to mine bitcoin (see [Figure 10-05](#chapter10.xhtml#fig27)).


    ![Figure 10-05. China Tops the Globe for Computing Power Mining Bitcoin.](images/img-133.jpg)


    Figure 10-05. China Tops the Globe for Computing Power Mining Bitcoin.


    # 11 Regulatory Concerns forBlockchain Technologies


    There are many technical and regulatory concerns regarding blockchain usage, as
    the applications for blockchain technologies are truly endless. In this chapter,
    I will focus on its primary present-day uses. These include contract implementation,
    record keeping, and financial transactions, all of which are typically monitored
    by some regulatory entity.'
