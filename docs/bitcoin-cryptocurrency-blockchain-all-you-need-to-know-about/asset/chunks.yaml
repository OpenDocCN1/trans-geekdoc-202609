- raw: 'During the English Civil War of 1642–51, goldsmiths’ safes were secure places
    for the deposit of valuable assets such as jewelry, precious metals, and coins.
    Owners could then use the receipts from the goldsmiths to either withdraw their
    assets from the goldsmith or present them as evidence of the ability to pay.^([18](#notes.xhtml#chapter7-18))
    The receipts effectively served as storage of real value, and eventually they
    become trusted as a currency. Around 1660, these receipts developed into banknotes.
    Instructions to goldsmiths to pay money to another customer became the basis for
    the bank check.


    The goldsmiths began to lend out their depositors’ gold, keeping only a tiny fraction
    of the stock in reserves, ushering in the beginning offractional reserve banking
    (see [Figure 07-01](#chapter7.xhtml#fig18)). If all the depositors came to the
    goldsmith simultaneously to withdraw their gold, he would have been unable to
    make payment. In such a case the receipts would no longer be worth the value of
    the gold they represented, but only as much as the goldsmith was able to pay.


    Unlike standardized coins, paper money has no intrinsic value, but initially it
    represented a “claim to value,” usually denominated in a precious metal like silver
    or gold. In Britain, paper money was initially backed by silver, but in 1816,
    the gold standard emerged.^([19](#notes.xhtml#chapter7-19))


    Eventually, paper money became so popular that it became regulated by the governing
    authorities. In the United States, this fiat (unbacked) currency was printed freely
    by the federal government, certain states, and even individuals, such as Benjamin
    Franklin.^([20](#notes.xhtml#chapter7-20))


    The power of fiat money depended directly on the ability of the ruling authority
    (the government) to guarantee its value. Trust in fiat effectively meant faith
    in the government that controlled its supply and guaranteed its value—in short,
    the nation’s stability and economic strength.


    ![Figure 07-01. The Fractional Reserve Banking Process.](images/img-92.jpg)


    Figure 07-01. The Fractional Reserve Banking Process.


    As a result of growing global inflation, the United States abandoned the link
    with gold in 1973.^([21](#notes.xhtml#chapter7-21)) On English banknotes, a declaration
    signed by the chief cashier of the Bank of England reads, “I promise to pay the
    bearer on demand the sum of five pounds.”^([22](#notes.xhtml#chapter7-22)) Formerly
    banknotes were regarded in Britain, and many other countries, as a claim to money.
    In contrast, according to former Federal Reserve Bank vice president John Exter,
    the dollar became an “I.O.U. Nothing.”^([23](#notes.xhtml#chapter7-23)) The whole
    system is based on confidence in the stability and economic strength of the United
    States and the Treasury’s ability to come up with the cash. If we decided all
    together to convert our savings and checking accounts into cash, the whole system
    would come tumbling down, and everyone would be broke.^([24](#notes.xhtml#chapter7-24))


    Without the gold standard, money is mainly a matter of faith, which poses the
    question of faith in what, and in whom? The primary reason that society trusts
    the funds created by the commercial banks through the fractional reserve system
    is that they are exchangeable one-for-one with the money created by the government’s
    central bank. Governments typically guarantee the value of its currency; this
    is up to a limit of $250,000 in the U.S., 1,000 euros in the Eurozone, and £75,000
    in the U.K.


    ## Liquidity Injections


    The Federal Reserve, the central bank of the United States, is probably the most
    influential economic institution in the world.


    Imagine a scenario in which the U.S. Treasury prints $10 billion in new bills;
    the Federal Reserve conjures up a new dollar balance of $90 billion and credits
    it to the major banks. While the economy receives a monetary influx of $100 billion,
    that is only a tiny percentage of the actual money creation.


    The real money creation takes place through the fractional reserve banking system,
    whereby the banks lend out those new balances to the broader economy. In this
    system, banks are required to maintain a legally mandated reserve ratio of between
    3 and 10 percent, but they can lend out much more. The initial $100 billion in
    bank reserves could potentially result in a nominal monetary increase of $1 trillion.
    The credit markets essentially become a funnel for money distribution.


    In March 2020, the Federal Reserve announced they were reducing the reserve requirement
    ratio to zero percent across all deposit tiers. This comes as the COVID-19 pandemic
    continues to affect much of the way financial institutions both operate and serve
    their customers.^([25](#notes.xhtml#chapter7-25))


    Approximately 97 percent of the money is created when commercial banks extend
    loans. The phrase “banks create money” is a contentious and hotly debated topic
    in modern-day politics and economics, and has generated public anger.^([26](#notes.xhtml#chapter7-26))
    Some analysts, however, insist that this is an erroneous representation of the
    bank’s role in the money creation process. Banks can also serve as intermediaries
    between buyers and sellers—for example, in the purchase of a house.


    Today money exists mainly in the electronic bits and bytes of our online ledgers
    and transactions through credit cards, ATMs, etc. In 1946 the first credit card
    was introduced, and there has been a steady and growing interest in various forms
    of electronic money since the 1990s.^([27](#notes.xhtml#chapter7-27)) In some
    ways e-money is a logical evolution from the wire transfers that came about as
    a result of the widespread adoption of the telegraph in the nineteenth century.


    ## What Is Cryptocurrency?


    A cryptocurrency is a digital currency that uses blockchain and cryptography technologies
    to process and verify transactions securely. A cryptocurrency can be used as a
    medium of exchange internationally and differs from a fiat currency in that no
    central bank or authority controls it.Instead, it is held in unique blockchain
    databases that no one can manipulate unless specific conditions are met.


    ## Cryptocurrency Advantages


    Anyone can obtain a cryptocurrency, even though the current process can seem technically
    complicated. Nevertheless, it enables people across the globe to interact with
    one another through online transfers.


    Fast settlement times are another critical feature associated with cryptocurrencies.
    Unlike in any existing electronic currency settlement system, currency settlements
    can occur instantly. Many cryptocurrencies have minimal transaction fees, which
    is appealing considering the high fees generally associated with wiring money
    internationally.


    ## Disadvantages of Cryptocurrency


    The greatest obstacle for cryptocurrencies to overcome is the lack of knowledge
    surrounding their usage. As a result, financial regulators in an array of countries
    do not take the time to understand them. Instead, some, like China, have outlawed
    them entirely.^([28](#notes.xhtml#chapter7-28))


    Cryptocurrency transactions cannot be reversed once executed, which some view
    as problematic. If a wrong deal is made, the only solution is to ask the receiver
    to refund it. The receiver can object to the refund request, which leaves the
    sender without recourse.


    The value of cryptocurrencies fluctuates frequently, so that crypto coins have
    high volatility. This is a complicating factor in terms of both understanding
    and use.'
