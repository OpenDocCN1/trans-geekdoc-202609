- raw: 'In Ericsson’s 2030 consumer trends report, many early adopters of consumer
    technologies, such as AR, VR, and digital assistants, reported that they believe
    that humans will have thought control over electronic devices. In just ten years,
    consumers will share thoughts with others telepathically.^([16](#notes.xhtml#chapter15-16))
    The likes of Elon Musk already envision a future where we’ll all have chips in
    our brains, and they’ll replace our need for keyboards, mice, touchscreens, joysticks,
    steering wheels, and more.


    NextMind makes a noninvasive neural interface worn on the head, translating brain
    waves into data for users to control compatible software. The product’s goal is
    to start with simple tasks (sending text messages or retrieving photos in your
    phone camera roll with a thought) and eventually to control real world devices.^([17](#notes.xhtml#chapter15-17))


    Scientists and entrepreneurs are striving to develop digital biological interfaces
    that will allow our brains to interact with virtual worlds in order to experience
    our senses of taste, touch, hearing, smell, and vision. In due course, these neural
    interfaces would plug straight into our brains and be capable of replicating the
    sensations of the body’s functions, Matrix-style.^([18](#notes.xhtml#chapter15-18))


    Neuroscientists at Yale University discovered that our neurons, which fire the
    brainwaves to produce our thoughts and feelings, do not age quite like the rest
    of us. In 2013, neuroscientists demonstrated that mice’s brains could live twice
    as long as their bodies.^([19](#notes.xhtml#chapter15-19)) Our minds, scientists
    suspect, can also survive far longer than our bodies. In a 2019 article in the
    *Guardian,* the question was posed “What happens if your mind lives for ever on
    the Internet?” If we could scan a person’s brain in enough detail to be recreated
    in a computer simulation, could the person’s mind, memories, emotions, and personality
    be duplicated? Would this, in effect, be a good digital version of that person
    now existing in potential immortality? This futuristic possibility is referred
    to as *mind uploading.* The neuroscience of the brain and consciousness suggests
    that no physical laws would prevent it.


    ## What’s Web 3.0?


    Starting in the mid-2000s, Web 2.0 became the current web version, with which
    we are all familiar. A proliferation of powerful Android and iPhone devices has
    driven crucial innovations such as social media connectivity. Consequently, Web
    2.0 has also been exponentially disruptive to retail, entertainment, media, and
    advertising that failed to adapt to the new web-centric business model.


    Arguably, platforms like Google, Amazon, Facebook, and Twitter emerged to build
    the infrastructure of Web 2.0, facilitating more effective social connectivity
    and commercial transactions. However, critics are concerned that these companies
    have amassed too much power.


    According to Mat Dryhurst, a Berlin-based artist and researcher who teaches classes
    at New York University on the future of the Internet: “There’s a small group of
    companies that own all this stuff, and then there’s us who use it, and despite
    the fact that we contribute to the success of these platforms, we don’t have anything
    to show for it.”^([20](#notes.xhtml#chapter15-20))


    This chapter will present three major areas where I see the metaverse’s dependency
    on blockchain:


    1.  Decentralization


    2.  Altcoins or cryptocurrencies


    3.  NFTs


    ## DECENTRALIZATION


    Web 3.0 is all about making the Internet more egalitarian by creating a new version
    with decentralized, open, autonomous social networks, search engines, and e-commerce
    marketplaces with more excellent utility. The decentralization of Web 3.0 is built
    on the infrastructure of the blockchain decentralized ledger technology (DLT).


    Among Meta’s stated principles^([21](#notes.xhtml#chapter15-21)) is “robust interoperability,”
    meaning the cross-platform portability users would have to move their data (including
    their avatars) seamlessly between sites and services. However, skeptics believe
    there’s no place for the mighty Web 2.0 companies like Facebook on the metaverse
    because they will always be primarily driven by profit.^([22](#notes.xhtml#chapter15-22))


    Aside from decentralization, a defining feature of Web 3.0 is that it’s also permissionless
    and trustless. Web 3.0 is permissionless because it’s free of control by centralized
    authorities. In a Web 3.0 world, people control their data and bounce around from
    social media to email to shopping using a single personalized account, creating
    a public record on the blockchain of all of that activity. Web 3.0 is trustless
    because intermediaries aren’t necessary for transactions between multiple parties.
    In my chapter “Introduction to Decentralized Finance,” I have described DeFi,
    a function of Web 3.0, facilitating the execution of real-world financial transactions
    on the blockchain without the need for centralized authorities such as banks or
    the government.^([23](#notes.xhtml#chapter15-23))


    Blockchain and its capacity to enable smart contracts and decentralized autonomous
    organizations (DAOs) offer the possibility of alternate digital realities that
    aren’t under the ownership of Silicon Valley megacorporations. Instead, these
    DAOs can be “owned” and governed by those who use them by participating in secure
    voting processes and utilizing advanced blockchain functions such as staking.
    Staking is the means by which many cryptocurrencies verify their transactions,
    and it allows participants to earn rewards on their holdings.


    Blockchain technology is central to the metaverse and Web 3.0, Goldman Sachs said
    in a research report. The report claimed that blockchain is the only technology
    that can “uniquely identify any virtual object independent of a central authority.”
    This ability to identify and track ownership will be crucial to the functioning
    of the metaverse. Additionally, for Web 3.0, blockchain allows for the “partial
    elimination of centralized control,” the note says. In the future, users will
    be able to log in without needing a third party, such as Meta, Google, or Apple.^([24](#notes.xhtml#chapter15-24))


    ## CRYPTOCURRENCIES IN THE METAVERSE


    Imagine the metaverse as extended reality, a virtual and augmented world, where
    we can be fully immersed in social and commercial relationships without having
    to leave our homes. If the metaverse is truly an extension of Web 2.0, people
    will want to trade their goods and services in predicting the need and desire
    for commercial transactions.


    For a genuinely virtual reality environment to work and function as advertised,
    transactions will need to occur on a secure, traceable, transparent, and almost
    instantaneous basis. Furthermore, participants in the metaverse will need to conduct
    reliable transactions as seamlessly as if they were in person. Therefore, blockchain
    cryptocurrencies and tokens are essential for the metaverse to reach its full
    economic potential.


    For example, consider the popular platform Decentraland; users purchase plots
    of virtual land using the Mana cryptocurrency. Recently, an investor purchased
    a property of virtual land for $2.4 million.^([25](#notes.xhtml#chapter15-25))
    In addition, as mentioned above, Nike has plans to sell digital versions of its
    sneakers in the metaverse. Furthermore, the Government of Barbados used Decentraland
    to open the world’s first embassy on the metaverse: metaverse embassy.^([26](#notes.xhtml#chapter15-26))


    As the field of DeFi continues to grow, expect financial services for lending,
    borrowing, trading, and investing to play a significant role in the metaverse.
    Cryptocurrencies (including stablecoins) will play a foundational and necessary
    function.^([27](#notes.xhtml#chapter15-27))'
