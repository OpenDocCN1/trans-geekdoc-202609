- raw: 'As explained on the Verge: “Non-fungible” more or less means that it’s unique
    and can’t be replaced with something else. For example, a bitcoin is fungible—trade
    one for another bitcoin, and you’ll have exactly the same thing. A one-of-a-kind
    trading card, however, is non-fungible. If you traded it for a different card,
    you’d have something completely different.”^([5](#notes.xhtml#chapter14-5))


    According to the official Ethereum website, NFTs are marked by the following special
    properties:


    1.  Each token minted has a unique identifier.


    2.  They’re not directly interchangeable with other tokens.


    3.  Each token has an owner, and this information is easily verifiable.


    4.  The tokens live on Ethereum (which is one blockchain that NFTs are built on)
    and can be bought and sold on any Ethereum-based NFT market.


    In other words, if you own an NFT:


    1.  You can easily prove you own it.


    2.  No one can manipulate it in any way.


    3.  You can sell it, and in some cases, this will earn the original creator royalties
    on the resale.


    4.  Or you can hold it forever, resting comfortably knowing your asset is secured
    by your wallet on Ethereum.


    If you create an NFT:


    1.  You can easily prove you’re the creator.


    2.  You determine the scarcity.


    3.  You can earn royalties every time it’s sold.


    4.  You can sell it on any NFT market or peer-to-peer. You’re not locked into
    any platform, and you don’t need anyone to intermediate.^([6](#notes.xhtml#chapter14-6))


    This is similar to how gold-backed dollar bills, which were redeemable for actual
    gold from any bank in the United states, operated. While not always redeemable,
    NFTs are cryptographic representations of non- fungible assets existing through
    smart contracts on a blockchain.


    Now let’s look at how smart contracts really operate in order to have a better
    understanding of NFTs.


    ## Understanding Smart Contracts


    Before the age of electronic computing, contracts and formal agreements required
    custodial oversight to be binding and enforceable. For instance, banks are needed
    to endorse a check for withdrawal, and courts are needed to endorse certain types
    of transactions.


    Similarly, a smart contract is a computer program or a transaction protocol intended
    to automatically execute, control, and document legally relevant events and actions
    according to terms programmed in the smart contract program.^([7](#notes.xhtml#chapter14-7))


    One prime objective in smart contract design is to eliminate the need for trusted
    intermediaries, which are involved at every level in a contractual relationship.
    Smart contracts replace these intermediaries with open-source codes. In place
    of the usual legal and supervisory infrastructures designed to oversee contract
    executions, smart contracts can be run on open-source codes. This helps in the
    general reduction of cost, saves time, and to a large degree prevents the possibility
    of corrupt practices.


    Smart contract technology has been instrumental in the digital representation
    of nonfungible assets, which comes in handy for the creation and transfer of nonfungible
    identifiers. The Ethereum Virtual Machine (EVM), for instance, has several ERC
    standards for the creation of various contract types. ERC is an acronym that stands
    for Ethereum Request for Comments. ERCs are application-level standards for Ethereum
    and can include token standards, name registries, library/package formats, and
    more.


    ERC-721 is a free open standard that describes how to build non- fungible or unique
    tokens on the Ethereum blockchain. While most tokens are fungible (every token
    is the same as every other token), ERC-721 tokens are all unique. Think of them
    like rare, one-of-a-kind collectables.


    The first recorded use of smart contracts was back in 1998 by Nick Szabo, with
    his Bitgold digital currency invention, which was built on a centralized network.
    The Ethereum blockchain, however, made it possible to execute immutable and completely
    autonomous smart contract protocols over a decentralized blockchain network.


    ## What Problems Do NFTs Solve?


    NFT technology addresses unique aspects of value and ownership, which is why there
    seem to be a lot of both controversies and cash swirling around in the NFT space.
    This section explores the various NFT solutions that are responsible for this
    buzz.


    ## Digital Identification of Complex Entities


    NFTs for the first time paved the way for the creation and representation of verifiable
    identities on the Internet, without relying on a central point to validate the
    identification. In other words, with NFTs there could exist one unique copy of
    a digital entity over a blockchain network.


    ## Ticketing


    The use of NFTs in the ticketing industry is another fast growing application.
    In 2018 an Israeli ticketing company, Eticket, launched the world’s first blockchain
    ticketing platform, which it called Eticket4.^([8](#notes.xhtml#chapter14-8))


    NFT ticketing involves the generation of unique NFT-type tokens, which serve as
    tickets that are valuable only for a specific time frame and for a specific event.


    Ticket NFTs will bring a great deal of transparency to the supply of tickets.
    Blockchain ticketing can help event organizers control the overall supply of event
    tickets, track the holders, and limit ticket scalping as well as other forms of
    fraud or manipulation.


    With NFT tickets, forgery is technically impossible; physical damage is also impossible,
    and the cost of ticket production is reduced significantly. For instance, it only
    costs a tiny gas fee to mint NFT tickets on Ethereum.


    ## Licensing and Certifications


    Certificates are functionally nonfungible assets. A bachelor’s degree is only
    usable by an individual, and it becomes worthless in that person’s absence. They
    are nontransferable assets, which is the perfect definition of an NFT.


    With certifications and licenses minted as NFTs, it’s easy to curb forgery and
    to confirm the authenticity of a certificate or license. In fact, organizations
    can easily check the authentication of licenses of their employees. This will
    become ever more relevant as virtual learning unfolds. Zastrin, a company that
    offers blockchain development programs, is pioneering the issuance of NFT certifications
    to its students.^([9](#notes.xhtml#chapter14-9))


    Licenses too can be issued using NFTs and would not feel different from more conventional
    licenses. This will help curb the issue of fake licenses used by employees and
    also save time for human resource departments, since it would significantly reduce
    verification hurdles.


    ## Domains


    Domain names are readable translations of a website’s Internet Protocol (IP) address.
    Since IP addresses aren’t very readable, domain name registers were developed
    to provide a readable format for them. For example, Google’s IP address is 172.217.10.14,
    which isn’t very readable. In place of that, the domain name system (DNS) registry
    translates that to the readable version we all remember: [Google.com](https://google.com/).


    DNS servers operate in a global network, which helps browsers translate domain
    names to IP addresses. Furthermore, Internet service providers connect users to
    the appropriate IP addresses based on their domain specification.


    The global DNS network is controlled by the Internet Corporation for Assigned
    Names and Numbers (ICANN). This organization handles the top-level development
    and architecture of the overall domain name system. With this system, the user
    really does not own their domain: rather it is usually leased out to them by the
    ICANN, who by extension lease the domain-to-domain name providers. The implication
    is that domain name providers have full control over how much the domain name
    is going to be leased out for and can decide to claim a domain from a user.'
