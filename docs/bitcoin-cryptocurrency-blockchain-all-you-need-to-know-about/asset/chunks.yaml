    and extend their capabilities.^([1](#notes.xhtml#chapter15-1)) Here I’m going
    to outline specific challenges with records management and how blockchain can
    help to solve them (see Figure Appendix-02, next page).


    ### Security and Confidentiality


    The number of data breaches increased by more than 400 percent in 2018, exposing
    almost 15 billion records, according to the identity intelligence company 4iQ.^([2](#notes.xhtml#chapter15-2))
    According to the latest data breach report by IBM and the Ponemon Institute, the
    cost of a data breach in 2021 is $4.24 million—a 10 percent rise from the average
    cost in 2019, which was $3.86 million.^([3](#notes.xhtml#chapter15-3)) Eighty-eight
    percent of companies surveyed feel they are losing control over their data.^([4](#notes.xhtml#chapter15-4))

