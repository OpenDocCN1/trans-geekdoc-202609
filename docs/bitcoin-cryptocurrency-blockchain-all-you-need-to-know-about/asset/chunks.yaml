    不可否认，区块链为小企业解决了许多难题。对于采用加密货币的小企业来说，还有许多其他益处。多种类型的加密货币对小企业极具吸引力，但它们必须以特定的方式来利用它们。接受加密货币意味着企业可以进行更多数量的交易。此外，加密货币的交易费用低得多，这对于零售加密货币用户已经具有吸引力，特别是对于进行多笔大额交易的企业而言。再如此，银行处理大额和海外交易可能需要数日。而通过区块链技术，加密货币交易仅需几分钟即可完成：这为企业提供了更大的灵活性，并可能使其能够进行更多交易并赚更多钱。对于选择采用加密货币的小企业来说，加密货币可能会改变其游戏规则。


    ## 主流公司、银行与加密货币的未来


    虽然个人可以在许多公司追求区块链职业，但加密货币领域的大多数职位正在金融领域涌现。尽管如此，一些最令人兴奋的消息来自科技巨头。Facebook 正在发布一个支付平台，Amazon
    寻求接受加密货币支付，Google 正在为区块链领导者提供支持，而 Microsoft 正在创建一个允许用户创建自己的代币的系统。这些公司中的每一家都需要数百甚至数千新员工来运营这些完全全新的业务。


    此外，金融机构也开始采用加密货币。中央银行长期以来反对加密货币。多年来，这些机构中的大多数对去中心化金融的前景嗤之以鼻，并声称它永远无法与传统金融机构竞争或取代。当
    `Bitcoin` 在 2017 年首次受到主流媒体关注时，`JPMorgan Chase` 执行官 Jamie Dimon 表示：“如果你傻到去买[Bitcoin]，你总有一天为此付出代价。”`Morgan
    Stanley` 的主席兼首席执行官 James Gorman 将加密货币描述为纯粹的投机行为，并认为相信它可以稳定市场的人是在“自欺欺人”。尽管如此，2021
    年 3 月，`Morgan Stanley` 成为第一家为其富客户提供 `Bitcoin` 基金的美国银行。(14) `JPMorgan Chase` 现在也为其客户提供几种加密货币基金。今天，全球前
    100 银行中超过一半投资了加密货币和区块链。加密货币与技术和金融行业见过的任何事物都不同。本节将探索大企业如何进入这一领域、为行业铺平道路的新项目，以及人们可以参与的方式。


    ### Facebook 和 Diem


    2021 年 8 月中旬，Facebook（现更名为 `Meta`）宣布它将很快推出自己的名为 `Novi` 的支付平台。该平台将允许用户使用一种名为 `Diem`
    的加密货币相互付款。这种加密货币由多种法定货币（如美元）支持并与这些货币的价值挂钩。


    Facebook 在 `Diem` 方面做了一些独特的事，这使其与其他稳定币不同。与 `Bitcoin` 和 `Ethereum` 不同，`Uber`、`Coinbase`
    和 `Shopify` 等组织将充该货币的某种中央银行。这些公司对 `Diem` 的运行拥有投票权。这使得 `Novi` 成为一个非常有趣的项目。虽然 Facebook
    将 `Diem` 营销为一种用加密货币给朋友付款的方式，但它的意义远于此。Facebook 和 `Diem` 的其他创始公司控制着美国及全球很大一部分的商业。通过创建自己的货币，`Novi`/`Facebook`
    可能成为一个独立的经济体，在美国政府的控制之外运行。


    2019 年，Facebook 尝试创建一种名为 `Libra` 的货币。由于与政府的监管问题，该项目未能成功。Facebook 自此重组了该项目并选择了不同的公司进行合作，到目前，`Novi`
    已经克服了所有的监管障碍。如果 Facebook 的新平台达到其全部潜力，设想的加密货币和区块链未来可能会比目前预期的近得多。(15)


    ### Amazon 和加密货币


    `[Amazon.com](https://amazon.com/)` 也在进入加密货币领域，尽管其尝试远没有 Facebook 的那么明显。2021 年
    7 月下旬，`Amazon` 确认将在其网站上接受加密货币作为一种支付形式。这看起来可能是一条小新闻，但对加密货币的广泛采用其影响可能是巨大的。虽然数百万美国人拥有加密货币，美国政府和大银行也开始投入时间和金钱，但
    `Bitcoin` 和类似硬币的使用远不如美元的普及。`Bitcoin` 现在是世界第三大货币，但在 2020 年，美国只有 3%的消费者使用它来完成交易。(16)
    这是因为加密货币主要被视为一种投资。虽然这让加密货币在未来几十年内保持热度，但 `Amazon` 接受加密货币的决定可能代表着地震性的变化。2018 年，Amazon
    占据了美国市场的 49%。(17)


    然而，我们应该注意，这并不一定代表 Amazon 或加密货币的胜利。根据目前的美国税法，将大量加密货币转化为会导致沉重的税收。对于那些投资了加密货币的人来说，通过
    Amazon 支出储蓄似乎也违背直觉。考虑到这些问题，加密货币的广泛采用并非必然，而且并不容易。


    ### Microsoft 和 Google


    2021 年 8 月，`Microsoft` 获得了一项简化加密代币创建过程的美国专利(18) 该新软件允许用户创建自己的代币，并在不同的区块链之间更方便地传输数据。利用区块链技术自己创建加密货币看起来很大，但
    `Microsoft` 为寻求成功的企业家或其他个人铺平了道路。这可能使加密货币的广泛采用成为可能。


    同时，`Google` 宣布与价值 70 亿美元的区块链市场 `Dapper Labs` 建立合作伙伴。`Dapper` 每周管理高达 100 万次的 NFT
    交易，按销售额计算排名第四（见图 02-06）。此举是 `Google` 更大计划的一部分，允许增长中的区块链公司利用 `Google Web Services`
    的巨大计算能力。随着区块链技术渗透更多行业，更多公司采用去中心化（也称为 Web 3.0），`Google` 致力于为这些未来行业创建一个云平台。目前，`Google`
    正在扩大这个已经巨大的网络，并将其成为区块链领域最大的名字。`Google` 不仅在与 `Microsoft` 竞争，还在与拥有自己网络服务业务的 `Amazon`
    竞争。目前 `Amazon Web Services` 支撑着三分之一之一，而 `Google` 正展望未来，并希望竞争或超越 `Amazon`。(19)

