    许多 Web 3.0 项目严重依赖加密货币（Web 3.0 代币）来提供货币激励，以激励用户帮助创建、治理并为项目需求做出贡献。人们可以通过技术和非技术等各种方式参与项目，并以此为生。这些项目可能提供各种与基础设施相关的服务，例如计算、网络、存储和身份管理服务（这些服务以前由云服务提供商提供）。Web
    3.0 代币是与创建去中心化互联网愿景相关的数字资产。


    Web 3.0 项目的一个例子是 Livepeer^(28)，它基于以太坊，为视频基础设施提供者和流媒体应用提供了一个市场。另一个例子是 Helium 项目，它用
    Web 3.0 代币奖励消费者和小型企业。他们通过区块链供应并确认无线覆盖，同时通过网络发送设备数据。秉持去中心化的愿景，像单一的亚马逊或微软 Azure
    云服务这类不需要且经常浪费资源的中间环节被去中介化了。


    另一个例子是 Reddit^(29)，它计划利用 Web 3.0 代币让用户从根本上控制他们参与的站内社区的部分。通过在网站的特定板块（版块）发布帖子，用户可以获得社区积分。用户还可以根据其帖子获得的点赞数来获得积分。用户将使用“社区积分”，这些积分是通过在特定版块发布帖子获得的。然后，用户根据对特定帖子的点赞或点踩的人数来获得积分。（这仅仅是
    Reddit 积分的区块链版本。）


    ## 非同质化代币（NONFUNGIBLE TOKENS）


    在“如何创建非同质化代币”章节中，我描述了 NFT 如何成为一种广泛的区块链现象。`NFT` 被柯林斯字典选为 2021 年度单词.^(30)在本节，我将解释为什么它们将在元宇宙中发挥至关重要的作用。NFT
    是区块链代币，用于证明所连接数字资产的所有权。将 `NFT` 想象为一种加密所有权证书。NFT 通常用于交易数字艺术品。尽管如此，在理论上，它们可以连接到任何事物，包括虚拟化身、游戏、书籍、虚拟房地产，最终甚至是现实世界的资产。在元宇宙中，代币不仅用于用户验证，还用于授权；以证明用户可以访问给定的资源或服务。


    在某种程度上，构建、交易和投资产品、商品和服务的能力将严重依赖 NFT。此外，NFT 将被用于证明某人是特定对象的合法所有者。


    ## 元宇宙架构


    元宇宙正引发虚拟土地和物业价格的激增。例如，在基于区块链的在线世界 Decentraland 中，一块土地最近以 900,000 美元售出.^(31)


    在元宇宙中，建筑或建筑的概念意味着什么？可以租赁或出售虚拟土地和建筑的平台示例包括 Decentraland、Sandbox 和 Cryptovoxels。一个关键愿景是用户将举办会议、创建建筑、参与交易并举办社交活动。元宇宙将为休闲、教育、商业和娱乐提供虚拟体验。通过与软件开发人员合作，建筑师可以创建独特的设计，由
    NFT 提供必要的加密所有权证书作为所有权的证明。


    从构建简单的虚拟建筑开始，Decentraland 在 2020 年向用户开放了其平台。到 2021 年，它已经非常繁华，包括虚拟房地产，如商场、赌场、活动场所和艺术画廊。这些建筑本质上是品牌空间，并链接到基于网络的信息，如产品和服务和服务信息、资源、徽标和营销文案。示例建筑包括
    Raible、Winklevoss Capital、CoinGecko 和 Fashion Coin。


    一些公司如加密交易所 Binance US 和 Kraken 邀请 DJ 现场，甚至邀请活动经理欢迎客人并帮助他们引导虚拟空间。此外，一些客人还参加了这些建筑中的趣味活动，在那里有机会与名人见面和交流。


    通常情况下，Decentraland 团队为战略合作伙伴和高调客户创建建筑。然而，元宇宙中存在提供商业建设服务的制作工作室。通常，这些工作室负责客户虚拟土地的建筑和施工管理。


    元宇宙制作工作室的一个例子是 DappCraft.^(32)


    ## 附录


    ### 用于合同和记录管理的区块链


    Gartner 研究将记录管理列为四项区块链业务倡议之一，旨在节省成本并提供产生收入的机会（见下页附录图-01）。该技术具有影响所有记录管理流程并扩展其能力的潜力.^(1)在这里我将概述记录管理的特定挑战以及区块链如何帮助解决这些问题（见下页附录图-02）。


    ### 安全与机密性


    根据身份智能公司 4iQ 的数据，2018 年数据泄露次数增加了 400%以上，暴露了近 150 亿条记录.^(2)根据 IBM 和 Ponemon 学院的最新数据泄露报告，2021
    年数据泄露的成本为 424 万美元——比 2019 年 386 万美元的平均成本增长了 10%。^(3)88% 的受调查公司认为他们正在失去对数据的控制.^(4)


