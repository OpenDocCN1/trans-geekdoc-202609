  trans: '

    金融行业自 2017 年持怀疑态度以来已经取得了巨大的进步。德勤（Deloitte）的一份报告显示，超过 75%的金融专业人士认为，加密货币在未来五到十年内可以取代法定货币。同样比例的银行高管认为，他们的公司现在应该投资区块链和加密货币，否则将面临失去未来市场竞争优势的风险。在中国，几乎所有的银行都与国家挂钩，它们已经开始发行数字人民币。这种货币被称为央银行数字货币，或`CBDC`。这种货币发行在区块链上，并具有多种优势。CBDC
    允许政府通过互联网简单地发放货币，并让没有银行服务的人群也能纳入金融体系.^(2) 高盛、摩根大通等银行，甚至美国政府都在寻求创建自己的`CBDCs`。在加密货币与经济学交叉领域拥有专业知识的人在这些机构非常受欢迎。


    ![图 02-06. 按销售额名的 NFT 收藏品。](img/img-50.jpg)

    图 02-06. 按销售额名的 NFT 收藏品。


    ## 加密货币挖矿：为什么重要以及未来何去


    通常，加密货币和区块链运行在去中心化的账本上。没有单一计算机系统控制货币的产生或数据存储。理论上，这防止了区块链被黑客攻击或任何实体控制或操纵加密货币。这种模型的问题在于用于挖掘加密货币的计算机。这些计算机也存储着区块链（见下一页的图
    02-07）。计算机分为两种：通用型（如 Windows 电脑或 Apple Mac 笔记本）以及专门为运行某个特定应用程序而设计的计算机。后者被称为应用专用集成电路或`ASICs`。它们在执行单项任务时效率极高。


    正如资本主义中常见的情况一样，有一公司在加密货币领域已成为这些`ASICs`的最佳制造商：中国比特币挖矿巨头比特大陆（Bitmain）。这种情况导致了区块链技术分发的集中，可能威胁到区块链的完整性。人们担心比特大陆可能对比特币的生产产生垄断。正如之前讨论的，区块链技术的不可篡改性只有在一个实体控制了账本的
    51%时才会受到威胁。在一个理想的去中心化系统中，挖矿计算机将独立运行，并且几乎不可能破解掉运行区块链的一半以上计算机。


    ![图 02-07. 加密货币挖矿。](img/img-52.jpg)

    图 02-07. 加密货币挖矿。


    在德克萨州的罗克代尔（Rockdale），一个只有 5600 人口的小镇，比特币挖矿领域的两大巨头正在为了市场份额和廉价电力激斗。比特大陆（Bitdeer）——一家从比特大陆分出来的公司——距离
    Riot Blockchain（美国最大的上市比特币挖矿公司之一）四十分。


    比特币的另一个主要问题是它的能耗。2021 年 2 月，埃隆·马斯克的特斯拉公司开始接受比特币支付。几个月后，马斯克宣布特斯拉不再接受比特币支付，因为其生产过程中消耗了大量的能量（见图
    02-08）。这回到了`ASICs`，因为这些计算机的运行非常耗能，且它们很大程度上依赖化石燃料。这些计算机一年的消耗的能量比瑞典国家还要多.^(21) 由于比特币的去中心化本质，将比特币的能耗转向气候友好型燃料是困难的；在没有比特币运营的权力机构的情况下，无法强制使用绿色能源.^(22)


    ![图 02-08. 各国比特币消耗对比。](img/img-53.jpg)

    图 02-08. 各国比特币消耗对比。


    这两个问题都可以通过一种名为权益证明（proof of stake）的系统来解决。比特币的原始模型被称为工作量证明（`POW`），它需要巨大的能量消耗来驱动算力（见下一页的图
    02-09](#chapter2.xhtml#fig14)）。


    权益证明避免了`POW`所需的高能耗计算，加密货币矿工可以根据矿工持有的代币数量来挖掘或验证区块交易。当个人想要进行交易时，供应商和接收方将一定金额的货币输入一个可以理解为托管账户的场所。与交易无关的独立用户也会投入他们的质押，由他们的计算机验证区块链中的每个区块。如果出现错误，意味着有人试图进行欺诈，网络随后会没收该用户的质押。


    ![图 02-09. 工作量证明 vs 权益证明。](img/img-54.jpg)

    图 02-09. 工作量证明 vs 权益证明。


    # 03 贫困现状


    每一个有潜力成功的创业者都应该获得启动和发展业务所需的支持。无法获得银行贷款和投资资金是创业者面临的主要障碍之一。考虑这样一个事实：90 到 95%的创业者至少需要一些资金来启动业务，而只有极小部分人在创业之初能够获得资金.^(1)


    经济系统是否严重向权势者倾斜？总体而言，种族、族裔和收入水平上的不平等状态有助于解释为什么大多数美国人认为事实是如此。在美国，没有任何一个地方的富人与其他人之间的差距比硅谷及其周边地区更普遍。据报道，硅谷经常惯性地根据种族、性别和年龄进行歧视.^(2)


    来自低收入背景、没有初始或既有财富的创业者在筹资方面也面临着严重的障碍，以及流动性限制。研究表明，在美国，已经富有的人比其他收入群体更有可能创业，且个人和家庭财富是进入市场的关键驱动力。


    ## 技术加剧了不平等


    互联网为极少数极其成功的创业者提供了巨大的财富来源，他们对消费者的数据变利。虽然技术革命创造了大量的财富，但这些财富集中在大型公司手中，使得创业者的创新变得日益困难。此外，数字经济的“赢者通吃”动态加剧了强垄断市场。例如，Facebook、Google、Apple
    和亚马逊等公司正在通过其雄厚的财力取代传统行业并扼杀新行业。


    新的创业者和发明者在与现有的巨头竞争时，会发现创新过程非常棘手，因为巨头拥有资源迅速将新想法推向市场，从而压制竞争。


    技术并没有导致收入不平等，但它实现了生产力的提高和财富创造。问题在于我们如何选择分配生产力提高带来的财富和利益。到目前，我们在这一方面做得并不好.^(3)


    ## 金融排斥导致的不平等


