- raw: "Consider the following use case for verifiable credentials: Alice has to verify\
    \ to the Social Marketplace that she is over eighteen before she can be authorized\
    \ to register. The goal is to do so without ever revealing her age or date of\
    \ birth. The Social Marketplace has been structured to support DID authorization.\
    \ Alice can present her DIDs already stored on the blockchain to prove that she\
    \ is in control of her digital identity, with her private key attached to an authenticator\
    \ app or web browser. Alice has multiple credentials stored in her credentials\
    \ registry, issued by various trusted intermediaries, that would satisfy this\
    \ requirement. Her browser or application asks which credential she would like\
    \ to use. Alice can get past the security challenge-response without ever having\
    \ to use a password.\n\n## DAML Smart Contracts\n\nDAML is a next-generation application\
    \ platform that makes it easy for anyone to write simple, concise, multiparty\
    \ smart contracts and deploy them to their choice infrastructure. DAML is a language\
    \ created for the exchange of value.^([6](#notes.xhtml#chapter12-6)) Smart contracts\
    \ are machine-encoded promises to perform specific actions.\n\nDigital Asset Holdings,\
    \ the company behind DAML, lays out five key properties of smart contract systems\
    \ that a contract language must enable. Paraphrased, these properties are:\n\n\
    1.  Proof of rights and obligations. For the consequences of a contract to be\
    \ compulsory, the entrance must be voluntary. To automate the processing of an\
    \ agreement to be automated, one must be able to reliably reason about all possible\
    \ future outcomes of any given state of the contract.\n\n2.  Confidential execution.\
    \ For a contract to be confidential, only the parties affected by the contract\
    \ can have the right to view the contract details.\n\n3.  Evidentiary trail. For\
    \ a contract to be enforceable, incontrovertible evidence of its authorization\
    \ by all stakeholders must be preserved.\n\n4.  Formal verifiability. For a contract\
    \ to be guaranteed to perform as intended, it must be subject to formal verification\
    \ methods.\n\n## Formal Media Blockchain Edition\n\nFormal Media^([7](#notes.xhtml#chapter12-7))\
    \ is the world’s first blockchain-enabled digital workplace that synchronizes\
    \ the smart contract with the corresponding digital records, providing provenance\
    \ for records, workflows, and signatures for multiple parties to a transaction.\
    \ Formal Media Blockchain Edition is perfect for records professionals who need\
    \ to demonstrate to auditors or litigators that their digital records, workflows,\
    \ and logs have not been tampered with or altered.\n\n[Virtualdeveloper.com](https://virtualdeveloper.com/)\
    \ developed the Formal Media Blockchain Edition using technology from Microsoft,\
    \ DAML, and Sphereon.\n\n## Off-Blocks\n\nOff-Blocks^([8](#notes.xhtml#chapter12-8))\
    \ is a revolutionary and innovative new platform, built with blockchain from the\
    \ ground up.\n\nOff-Blocks integrates digital signatures from self-sovereign identities\
    \ that cannot be stolen or copied for a history that cannot be changed or denied.^([9](#notes.xhtml#chapter12-9))\
    \ You will have an ID that never leaves your device and that you can securely\
    \ access your biometrics, opening up a world of possibilities. Off-Blocks works\
    \ on mobile, desktop, and laptop computer devices.Immune from theft or attack\
    \ vectors, your ID and data are secure. The technology also enables you to sign\
    \ documents faster and more reliably and cheaply than ever before.\n\nConsider\
    \ some of the following examples and their significance for the Social Marketplace:\
    \ a producer signing their music before publication; a court being able to verify\
    \ spoken testimony; a landlord and tenant each signing property documents.\n\n\
    ## Azure Blockchain Tokens\n\nAzure Blockchain Tokens^([10](#notes.xhtml#chapter12-10))\
    \ Preview makes deploying and managing standard tokens easier than ever. It’s\
    \ built on the standards developed by the Token Taxonomy Initiative (TTI).\n\n\
    Azure Blockchain Tokens simplify creating, deploying, and managing tokens that\
    \ represent digital or physical assets more accessible than ever before. The Social\
    \ Marketplace will need tokens for its cryptocurrency. The Token Taxonomy Framework,\
    \ developed by Marley Gray, Microsoft’s principal blockchain architect, developed\
    \ the technical foundation for these tokens.\n\nAzure Blockchain Tokens enable\
    \ multiple parties to a transaction to transfer, transact, burn, or mint tokens\
    \ securely, regardless of the choice of distributed ledger. Azure Key Vault and\
    \ Azure Active Directory are integrated to help secure transactions.\n\nTokens\
    \ are rapidly becoming the representations of value referenced in multiparty agreements\
    \ or contracts on business networks. Tokens can represent currency, asset titles,\
    \ receipts, tickets, authorizations, gaming assets, loyalty points, subscriptions,\
    \ etc.\n\n## The Kiva Protocol\n\nThe Kiva Protocol^([11](#notes.xhtml#chapter12-11))\
    \ is an exciting new initiative to cost- effectively give unbanked people verifiable\
    \ digital identities and a personal credit history.\n\nGlobally, 1.7 billion adults\
    \ are unbanked, and two significant barriers to accessing financial services are\
    \ a lack of formal identification and a lack of verifiable credit history.\n\n\
    The Kiva Protocol is designed to address these barriers by using blockchain distributed\
    \ ledger technology to issue digital identification to everyone, enabling both\
    \ formal and informal financial institutions to report on a person’s credit history.\n\
    \nAt a high level, according to the Kiva website, this is how the Kiva Protocol\
    \ works:\n\n> When any lender (Kiva partner or not) makes a loan, this will send\
    \ the borrower a signed, valid claim with the loan details. The borrower accepts\
    \ the correct claim and posts it to their private credit ledger in their digital\
    \ Kiva wallet. The same happens with a repayment—when a borrower makes a repayment,\
    \ the lender sends a valid claim that the borrower approves and posts to their\
    \ ledger.\n\n> \n\n> This enables all credit events to be captured in a single\
    \ ledger, with access to the digital wallet controlled by the individual. For\
    \ example, if someone has verified credit history with a local lender or Kiva\
    \ Field Partner and wants to apply for a loan from a national bank, they can grant\
    \ that one-time bank access to their credit history.\n\n# 13 Introduction to Decentralized\
    \ Finance\n\nImagine having a global open platform for every financial service\
    \ that you use. Think about stock markets, savings, loans, and insurance. Imagine\
    \ each of these services being accessible to all with an active Internet connection\
    \ and a smartphone. Heaven, right? Advocates of decentralized finance (DeFi) seek\
    \ to make access to financial services more egalitarian for the masses.\n\nWhile\
    \ cryptocurrencies have increased accessibility and costeffectiveness for cross-border\
    \ monetary transactions, DeFi takes this a step further. DeFi is an experimental\
    \ form of finance that does not use central financial intermediaries like banks,\
    \ brokerages, and exchanges to offer traditional financial instruments, but instead\
    \ utilizes a modern and transparent approach provided by smart contracts on the\
    \ blockchain. DeFi represents a set of applications developed on public distributed\
    \ ledgers to facilitate a new era of financial services.^([1](#notes.xhtml#chapter13-1))\n\
    \nDeFi platforms enable quick lending and borrowing of funds, predict price movements\
    \ on assets, the earning of interest similar to savings accounts, and the cryptocurrency\
    \ trading. The entire DeFi ecosystem is based on decentralized applications, also\
    \ called dApps or protocols, providing a peer-to-peer financial network on the\
    \ blockchain. The closest analogy to understand this entire concept is the structure\
    \ built by Lego building blocks. Like Lego blocks, every dApp can interconnect\
    \ with every other.^([2](#notes.xhtml#chapter13-2)) The most common DeFi applications\
    \ are:"
