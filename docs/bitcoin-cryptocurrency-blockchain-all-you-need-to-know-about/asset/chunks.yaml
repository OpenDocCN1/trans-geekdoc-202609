- raw: '*Consideration* is a concept of English common law and is a necessity for
    simple contracts; it is defined as a “right, interest, profit, benefit, forbearance,
    detriment, loss, or responsibility.”^([4](#notes.xhtml#chapter5-4)) Consideration
    is essentially a promise that something of value is given by one party in exchange
    for something of value from another party. Typically, the “something of value”
    is a good, money, or service. This concept has been adopted by other common law
    jurisdictions, including the United States.


    The social aspects of morality can be understood through the philosophical concept
    of intentionality, which is the way individuals interpret the world and pursue
    their goals. Morality governs the relationships between parties within a given
    society. It sets the terms of engagement needed to fulfill a mutually agreed-
    upon objective, which is to obtain net value.


    A moral transaction, therefore, is a simple contract. The contract details terms
    of engagement: the rights and obligations of each party as they pertain to the
    exchange of value. However, just because a relationship is transactional does
    not mean that it is equitable.


    ## Individual Intentionality


    Members of a group might seek the means for all to benefit through enacting norms
    to promote fairness, equity, and justice. These norms evolved over hundreds of
    thousands of years as humans began to cooperate out of a basic need for survival.
    But in times of scarcity, humans would compete for resources. Thomas Hobbes defined
    this competition as the “state of nature.”^([5](#notes.xhtml#chapter5-5))


    ## Joint Intentionality


    Over time, a new logic of interdependence or rational self-interest arose. This
    joint intentionality contrasts starkly with the selfishness of individual intentionality.
    With joint intentionality, all parties benefit. Through joint intentionality,
    bartering, a simple system of exchange, emerged.


    Successful human cooperation relies on trust and on a reliance that parties to
    an agreement can depend on one another to follow through on their obligations
    and respect one another’s rights. Peace within a society also depends on the ability
    to trust others to respect property rights.


    ## Collective Intentionality


    Eventually human societies developed a set of shared values, obligations, and
    precepts that together represented the formal beginnings of human cultures. Members
    of a group sought means for all to benefit through enacting norms to promote fairness,
    equity, and justice. This collective intentionality became institutionalized and
    internalized by each member of the society as an “objective morality” by which
    the group identified right and wrong.


    ## Social Exchange Theory


    Social exchange theory, a concept based on the notion that relationships between
    two or more people are created through a form of cost-benefit analysis, explains
    why we build trust and reciprocity.


    All relationships are transactional, and they may be unilaterally so. The primary
    commodity is the value being exchanged. The problem with so many of today’s relationships
    is that the terms of engagement are vague, nonexistent, or assumed. Vagueness
    in terms of engagement is akin to distrust eating away at the fabric of the relationship.^([6](#notes.xhtml#chapter5-6))


    ## Equitable Exchange


    One disadvantage of bartering, as it pertains to the exchange of goods and services,
    includes the lack of a standard unit of measure. If trade reflects the principles
    of justice and fairness, how does each party ensure an equitable exchange without
    an agreed-upon standard unit of measure? This dilemma leads to the idea of money
    as an objective currency for a moral transaction.


    The central element in the economic problem of money is its objective exchange
    value. This is the necessary starting point of all discussion: it is only in connection
    with its objective exchange value that those peculiar properties of money that
    have differentiated it from commodities are conspicuous.


    As I have noted, all relationships are transactional and involve an exchange of
    value between parties. I discussed the issues involving bar tering as a medium
    of exchange, the primary one being that it lacked an objective standard for measuring
    value.


    In the next chapter, I will examine how money is a social construct. I will look
    at its fundamental purpose and how it has been subject to abuses of power. The
    chapter will conclude by explaining why it is necessary to deconstruct the existing
    social construct of money and create a new one.


    # 06 Money as a Social Construct


    Social constructionism, a theory of knowledge in sociology and communication theory,
    examines the development of socially and jointly constructed definitions and understandings
    of entities and events worldwide. Social reality is distinct from subjective reality,
    which is developed within an individual. People in society construct ideas and
    their corresponding concepts, meanings, and significances using language. Social
    constructs are widely accepted as natural, objective, or absolute by society.


    This chapter will explore social constructs and the idea of money as a social
    construct. As part of this explanation, I will introduce theories for how money
    developed as a social construct and how it was ultimately institutionalized.


    The chapter will continue by addressing how governments and banks abuse money
    as a social construct, specifically by means of fractional reserve banking.


    The chapter will conclude by sharing Bitcoin’s development story and how it served
    as the first cryptocurrency to deconstruct fiat.


    ## Social Constructs


    A social construct is an entity created by human consensus.^([1](#notes.xhtml#chapter6-1))
    Society or parties to a simple contract agree on its definition, meaning, and
    value. A social construct is objectively real within the context of a society
    where there is a consensus, which is what is meant by the phrase *social reality.*
    The construct is accepted as “fact” solely in the collective minds of the perceivers.
    Social constructs such as rights, morality, emotions, and currency are crucial
    for the smooth operation of human civilization.


    It is not a fact that rights, emotions, and morality, as defined, exist independently
    of the social constructs that we have created and agreed on. It is not a fact
    that love, currency, and art have value outside of what we have bestowed on them.
    Yet we remain convinced that these constructs are objectively real and objectively
    valuable. Mostly unwittingly, we live our lives as if these constructs are real.


    Neuroscientist Lisa Feldman Barrett explains the process by which a social construct
    is created. There are two main ingredients: collective intentionality and words
    (concept identification). “Make something up, give it a name, and you’ve created
    a concept,” she writes. “Teach your concept to others, and as long as they agree,
    you’ve created something real.”^([2](#notes.xhtml#chapter6-2))


    Words are necessary for creating a social construct because humans have language.
    Language is the concept identifier, that is, the word image used to label the
    concept. Words are the most efficient way to communicate a shared concept within
    a group. Words represent concepts, and concepts are tools of nature.^([3](#notes.xhtml#chapter6-3))


    In regard to a contract, first, parties to a simple contract intentionally agree
    on its definition (concept), its meaning (mental representation), and its value.
    Together these components constitute its collective intentionality*.*


    Currency is an example of a social construct. The existence of the paper or coin
    that represents money is not in dispute, but its definition, meaning, and value
    exist solely as a function of social reality. Unlesshumans agree on what the paper
    or the coins represent and can be used for, the paper money is just paper, and
    the coins are just metal disks.^([4](#notes.xhtml#chapter6-4))'
