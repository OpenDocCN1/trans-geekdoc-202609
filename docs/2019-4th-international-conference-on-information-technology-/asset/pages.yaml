    # VIII. PROPOSED DESIGN


    In this section, the researcher explains the flow in detail. After researcher
    explaining the data storage mechanism, transaction structure and the account can
    be learned followed by the platform hosted.


    # A. System Flow


    The flow starts from the users using their accounts under a hostel. Once linked
    hospital staff and doctors can be enter data. Also, they can enter patients. The
    user can then review and once validated data, they can accept and that will be
    linked with their profile. If the platform rejects the invalid data it will not
    be shown anywhere.


    Doctors want to review the profiles and patients can accept or reject it. When
    it comes to the researcher, they can request data based on their trust level whether
    they want to sell their data or not. If they accept, then data will be shared
    with them and can be returned to the researcher. Otherwise they can earn some
    money if they revoke the period that it requested some of them their accounts
    can be returned to.


    # B. Storage mechanism


    All the user data will be encrypted using the private key of the user enters.
    And the patient who accepts data then it will be encrypted using the private key.
    Only the encrypted data will be stored in the database. And the raw of data will
    be stored in the storage.


    The selection of the database can be defined as this system allow and support
    centralized databases, could databases and decentralized databases as Blockchain
    Big DB Blockchain-based database that stores all the data format. This platform
    designed in way that type of data can be flexible.


    # C. Transaction Structure


    Each user inserts their accounts and user-made changes or will active and stored
    in the section. Each account will be stored as a separate partition and it will
    be linked with the last user performed from it.


    This linkage will make sure that the activity recorded and if any user wants to
    break it it''s difficult to rebuild a valid chain. Each chain will store the metadata,
    raw data and the transaction hash as the main information''s and it will be signed
    by the user private key.


    # D. Account Structure


    For each user, when they sign, the new account will include both a public key
    and a private key. The user will be classified using the public key and the private
    key will be used as the account password. Private keys are stored in an encrypted
    format that. Private keys are stored using user password. That password will not
    be stored anywhere to make the system safer. Also, the user identity will be encrypted
    using the private key which cannot be accessed by anyone other than


    the user. This will ensure anonymity while sharing the data.


    For this researcher using a stellar net to create accounts as the live can be
    accessed only by sending raw lumens. Each account will be funded using stellar
    test for developers develop. Once the account created the mechanism can change
    through stellar observers to the transparency of Blockchain.


