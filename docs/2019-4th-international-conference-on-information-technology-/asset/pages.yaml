    The same will follow for the staff. A similar process will follow for the patients,
    the users, the researchers, and the assistants and students. Researchers can also
    add their own coins, and the universities can earn credits under their university.


    Patients'' trust costs are created by the endorsers of their profile. If a patient
    wants to go to a hospital with high value and the doctor, the hospital also has
    higher trust value than the patient. To earn that profit, it must be endorsed
    by the doctor who do that for their usage. Then after a period the patient will
    get some more trust coins as an incentive. And the hospital will also want to
    get more trust coins. Also, all the profiles that are added to this hospital and
    the doctor will get trust value added to their profile.


    Once the endorser finds that the data is not correct he will make a challenge.
    If it is validated and approved by the authority then the doctor will be penalized
    and the patient will get some trust coins as rewards. A portion of doctor trust
    coin will be removed from the hospital and the rest to the patient and the profile
    that are added to the doctor or the hospital.


    This will make the doctor and endorsers do a good job by validating the profile
    before endorsement. Also, it will reduce fake profiles and bad job. In the long
