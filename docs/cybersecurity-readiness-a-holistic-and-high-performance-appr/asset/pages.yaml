  md: '+   4. Does the organization deploy a Security Information and Event Management
    (SIEM) platform for security monitoring, advanced threat detection, incident investigation
    and response, and other related services?

    +   5. Is a security operations center (SOC) and team in place to lead the threat
    intelligence gathering initiatives?

    +   6. Is a formal and rigorous process in place to select external expertise
    to assist with intelligence gathering and threat detection activities?

    +   7. Considering the plethora of sophisticated detection tools, is a rigorous
    process in place to implement an integrated detection and response platform?

    +   8. Is a baseline of network operations and expected data flows for users and
    systems established and managed?

    +   9. Are detected events analyzed to understand attack targets and methods?

    +   10. Are event data aggregated and correlated from multiple sources and sensors?

    +   11. Is there a process in place to determine the impact of events?

    +   12. Are incident alert thresholds established?

    +   13. To what extent are roles and responsibilities for detection well defined
    to ensure accountability?

    +   14. How often are detection processes tested?

    +   15. Is event detection information communicated to appropriate parties?

    +   16. How often are detection processes reviewed and updated?


    # 6.4 Respond and Recover


    With the threat of cyberattack constantly looming over their heads, organizations
    must be ever prepared to effectively deal with a real threat incident.'
