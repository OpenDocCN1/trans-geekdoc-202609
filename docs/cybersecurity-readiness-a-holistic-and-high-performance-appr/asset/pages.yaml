  img_proc: true
- pgno: 311
  md: '# Responsible Innovation


    The concept of responsible innovation originates in discourses on potential undesired
    effects of (technological) innovations on their social and natural environments
    (Owen, Macnaghten, & Stilgoe, 2012). It was introduced into discourses on research
    ethics and innovation in 2010 by the European Commission under the term “Responsible
    Research and Innovation” (RRI). The five principles of RRI—ethics, gender equality,
    public engagement, science education, and open access—have been promoted through
    the European Commission’s seventh and eighth Framework Programmes for Research
    and Innovation.¹ In the business context, the term “responsible innovation” is
    most often used to communicate contents of the RRI concept. Responsible innovation
    practices aim to ensure that corporate innovation activities and outputs are aligned
    with the values, needs, and expectations of society, and that potential negative
    impacts on society and the natural environment are minimized. Notwithstanding
    the European Commission’s efforts, some companies in Europe still operate unaware
    of the responsible innovation concept (Blok & Lemmens, 2015; Davies & Horst, 2015;
    Khan et al., 2016). As recent studies have found, however, it is possible to recognize
    the principles of responsible innovation in extant company practices, processes,
    and purposes (Asante, Owen, & Williamson, 2014; Auer & Jarmai, 2018; Gurzawska,
    Mäkinen, & Brey, 2017; Chatfield, Iatridis, Stahl, & Paspallis, 2017).


    In a nutshell, we can describe responsible innovation as a company’s efforts to
    create a positive impact on society and minimize potential negative impacts of
    their research, development, and innovation processes, as well as their innovative
    products or services. Because innovations are, by definition, something that has
    not been on the market before, companies cannot rely on experience when assessing
    potential (future) impacts. First good practice examples of companies that have
    implemented responsible innovation show that the concept can be made operational
    through a diverse set of company practices. This includes a general orientation
    of company research and innovation toward tackling societal challenges to targeted
    activities that, for example, aim to increase diversity in innovation or to support
    science education endeavors (Schroeder, 2014, 2017).


    # Yoti Ltd.


    # Responsible Innovation as Decision Support System


    Yoti (https://www.yoti.com/) is a medium-sized information technology company
    with 230 employees. The company is based in London,'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'and has offices in India, the United States, and Canada. The business was established
    in 2014 when the three soon-to-be founders observed the simultaneous rapid developments
    in biometric technologies and smartphone capacities, and decided that what was
    missing was a digital solution that would allow users to prove who they are online
    without compromising their privacy. The Yoti solution was to combine biometric
    information with validation of a government-issued identity document in a smartphone
    application (app). These documents include passport, driving license, and certain
    national identity and proof of age cards.


    The main company product, the Yoti app, was launched in November 2017 and was
    downloaded over 1.5 million times within the first six months. The app allows
    organizations to verify who people are, both online and in person. Individuals
    can use the app to prove their age or identity to businesses, verify other individuals’
    identities, and to log in to websites without passwords. By using their “Yoti,”
    users are able to show only the piece or pieces of information that are relevant
    in a certain situation without revealing other information about themselves. They
    can, for example, verify their age without sharing their name or address. The
    app can be downloaded and set up within the few minutes that are needed to link
    the user’s facial biometrics to his or her phone and validate them against their
    driving license or passport.


    # Responsible Innovation Practices and Processes


    Yoti has been certified as a B Corporation² since 2015, and is thus legally required
    to consider the impact of its decisions on its workers, customers, suppliers,
    community, and the environment. As a cybersecurity B Corporation based in the
    United Kingdom, Yoti was invited to participate in the European Commission–funded
    COMPASS³ project in 2017. Yoti was highly active in cocreating a roadmap toward
    responsible innovation in cybersecurity.


    Yoti considers data responsibility to be a core strategy of its business model.
    Users of the app are asked to provide as little data as possible in the first
    place and, after a seven-day anti-fraud window, only the user can see the data
    they provided. This is made possible by a system in which all personal data—for
    example, name, gender, date of birth—are encrypted and stored separately. Only
    the individual user can tie them all together. It is also part of Yoti’s business
    strategy to encourage other businesses that use'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'its services to ask only for the minimum amount of data from individuals that
    they can work with.


    Transparency and consumer trust are among the main goals of the company. The management
    team has established a set of seven core principles (https://www.yoti.com/about/principles/)
    to orient company development toward these goals. These principles include considering
    the impact of company decisions on users, employees, suppliers, partners, and
    the environment, being transparent about applied terms and conditions, and providing
    a digital identity to any individual free of charge. The company has installed
    an independent advisory body, which it calls a “Guardian Council,” that fulfills
    a combination of functions relating to the company’s responsibility toward its
    users and society in general (Yoti, 2016). The mission of the Guardian Council
    includes ensuring that the company stays consistent with its mission to give the
    user control of their personal data, reporting any breaches of trust, and representing
    concerns voiced by the user community. Yoti representatives meet with the Guardian
    Council on a quarterly basis. Meeting minutes are made public on the company website.
    The council is made up of influential individuals, including a prominent human
    rights lawyer and a serial entrepreneur with expertise on ownership of personal
    data.


    Yoti has been pursuing collaboration with different stakeholder groups to ensure
    that both company and product development are in line with company principles.
    Yoti has participated in creating the “Responsible 100”⁴ development tool in areas
    such as cybersecurity and data responsibility, and has engaged with its users
    through focus groups to find out what product features would be most valuable
    to them. The company has also organized two charity hack events at which representatives
    of nonprofit organizations were supported by teams of software developers to develop
    designs for apps that would solve a specific challenge they were facing at the
    time. The most promising idea at each event won a dedicated development team for
    one month to create and test a working prototype solution. In its call for expressions
    of interest to take part in these charity hack events, Yoti emphasized its commitment
    to ensuring the valuable time of charity staff would be well spent at the event.


    The company has been part of the UK Digital Policy Alliance Steering Group to
    create a British standard of regulatory compliance needs for businesses conducting
    online age checks. Yoti is also industry chair of the Digital Policy Alliance
    Age Verification & Internet Safety Steering Group, and a member of the newly formed
    Association of Document Validation Professionals, and the newly installed Age
    Verification Providers Association. Yoti serves on TechUK boards for Justice &
    Emergency Services, Data'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Protection, and Digital Identity. It is a key partner of the London Digital
    Security Centre, which helps businesses innovate, grow, and prosper through operating
    in a secure digital environment, and is accredited by “Met Police Secure by Design,”
    recognizing the high standards of security that the Yoti app provides when an
    individual uses it to prove their identity.


    Yoti follows a diversity and gender balance policy in product design in order
    to expand its market to as many different user groups as possible. In 2018, the
    company created the position “head of social impact,” to increase understanding
    of the needs of those people worldwide who are denied access to essential services
    because they are not able to prove their identity.


    # Challenges


    Yoti is facing a combination of challenges inherent to the collection and storage
    of data. This includes, first and foremost, the identity privacy of individual
    users. Data privacy and safe storage of user data are at the core of the company’s
    business model. Consequently, the company has taken a range of measures to ensure
    that user data will remain private and data storage will remain safe. Beyond these
    issues, however, the company has recognized the dilemma that comes with perfect
    privacy of user data; namely, the possible implication of facilitating illegal
    activity. Yoti has engaged in extensive consultation with international human
    rights and consumer rights groups to minimize the risk of criminal misuse while
    maintaining maximum data privacy and safety procedures.


    Another challenge specific to the collection and safety of user data comes with
    changing regulatory environments. With its 2018 General Data Protection Regulation
    (GDPR), the European Union has recently increased legal requirements for data
    protection and privacy. However, if laws or regulations were to be configured
    to provide authorities with easier access to personal data held by companies,
    such legislation would come into conflict with Yoti’s company values and would
    undermine a core aspect of its business model. While companies that collect and
    store personal data will always need to obey the respective laws which are in
    place, they can reserve their right to challenge them in order to maintain consumer
    trust.


    # Conclusions


    An examination of Yoti Ltd. offers a real-world example of how elements of responsible
    innovation can be integrated into core business activities.'
