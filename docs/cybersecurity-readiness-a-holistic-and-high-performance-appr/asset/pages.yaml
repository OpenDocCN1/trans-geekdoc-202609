    money to Bangladesh," 2016).


    Fear that the lion''s share of the funds may not be recovered has been rife in
    Bangladesh from the start and even the Finance Minister, Abul Maal Abdul Muhith,
    expressed his concern over the matter, stating that the manner in which the money
    had been stolen made it difficult to trace. He labeled the event as an unusual
    one and "a signal to the world to take proper security measures in respect to
    money transfers" (Choudhury & Devnath, 2016).


    # Conclusion


    Long before the Bangladesh Bank heist actually took place, the Federal Reserve
    Bank of New York had mulled over the possibility that "lax security procedures
    and outdated technology" at some foreign Central Banks and overall loose controls
    over points of access to the SWIFT network could make them vulnerable to cybercriminals.
    The attack on Bangladesh Bank''s reserve had proved that the Fed''s fear was not
    misplaced and most experts believe that technological limitations on the part
    of Bangladesh Bank were largely responsible for the event. As pointed out by the
    former Governor of Bangladesh Bank, Dr. Salehuddin Ahmed, there is an overall
    lack of appreciation within the country''s financial system regarding the adverse
    impacts of technology and an absence of measures for safeguarding concerned systems
    from such impacts. There is a huge gap in supply where qualified information technology
    (IT) professionals are concerned and this leads to an overwhelming dependence
    on foreign resources for maintaining critical IT systems. The latter, according
    to Anis A. Khan, Chairman of the Association of Bankers Bangladesh (ABB), must
    be reduced if the country wishes to strengthen itself against future attacks ("Punishment
    for financial anomalies should be fast and significant," 2016; Spicer & Finkle,
    2016; "The issue of IT security was neglected till date," 2016).


    Also, the general apathy of the country''s banking system toward investment in
    IT security was revealed in a 2016 study by Bangladesh Institute of Bank Management
    (BIBM), which found that 4% of commercial banks'' total IT budget is dedicated
    to security measures, while only 2% is spent for training purposes. Currently,
    52% of commercial banks are at high risk with regards to information security
    and even more worrying, perhaps, is the myopic attitude of bank management in
    this regard. This is evidenced by the fact that about 85% of high officials who
    participated in the BIBM'
