    # 6.1.3 Asset Identification and Prioritization


    It is hard to manage or defend the unknown. If an organization is clueless about
    the nature and types of digital assets that need protection, their respective
    locations, and worth, it is difficult to engage in effective asset management.
    A study conducted by the Ponemon Institute found the majority of respondents (80%)
    citing “lack of visibility into the attack surface, knowing what systems are part
    of their IT environments, as the number one issue in their inability to prevent
    business-impacting cyberattacks.”¹²


    Many organizations don’t recognize or value the need to create and maintain a
    comprehensive catalog of their digital assets. Daniel Miessler, a cybersecurity
    expert, brings to light such misplaced organizational priorities:


    > Companies pay hundreds of thousands a year to keep snacks in the break rooms.
    They pay to send people to training and conferences that usually have very few
    tangible benefits. And we dump millions into marketing campaigns that we can’t
    tie to sales results. But pay 100K a year to have a list of what we’re actually
    defending? Nope. Too expensive. Wasteful, really.¹³'
