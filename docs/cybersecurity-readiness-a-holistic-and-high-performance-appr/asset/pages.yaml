- pgno: 119
  md: 'training people, there are several initiatives that must be undertaken to secure
    and protect sensitive data and associated digital assets. The overall goal is
    to have several layers of security and create a relatively robust and impenetrable
    security infrastructure. Figure 18 (see on page 92) depicts a defense-in-depth
    strategy that leverages numerous physical, technical, and administrative controls.
    This information security strategy is often referred to as the “castle approach.”
    During medieval times, castles were secured by building moats, ramparts, drawbridges,
    towers, and more. The enemy had to penetrate several layers of security to get
    inside the castle.


    Several of the security defense mechanisms to secure data, networks, devices,
    locations, and people are discussed in the following subsections.


    # 6.2.1 Access Control


    Access control measures are aimed at ensuring that unauthorized individuals and
    other entities (such as computer systems) cannot gain access to data, applications,
    networks, and other resources. There are three essential steps to controlling
    access: identification, authentication, and authorization. Usernames and smart
    cards are the two most common ways of uniquely identifying an entity requesting
    access. Typically, authentication factors fall under three categories—something
    you know, such as a password; something you are, as indicated by biometric characteristics
    like fingerprints, retina and voice scans; and something you have, for example
    a token fob, smart cards, or an app like Duo on a smartphone. Thus, a multi-factor
    authentication (MFA) would be any combination of the three factors, such as a
    password and fingerprint scan or a password and a code. Finally, authorization
    can take the form of mandatory access control (MAC) systems and discretionary
    access control systems.


    There are two fundamental principles that drive authorization best practices—principle
    of least privilege (PoLP) and separation of duties. According to PoLP, the default
    level of access will be set to the minimum needed for the employee to perform
    their job. By limiting scope of access, the organization can mitigate the risk
    of insider attacks from disgruntled employees. The principle of least privilege
    also limits the ability of an external hacker to gain widespread access after
    compromising a particular employee’s account.


    Separation of duties is another form of access control to ensure that sensitive
    activities such as vendor account creation and payment authorizations are handled
    by two different individuals. This mitigates the risk of a fraudulent purchase
    transaction where payment is made to a fake vendor.'
