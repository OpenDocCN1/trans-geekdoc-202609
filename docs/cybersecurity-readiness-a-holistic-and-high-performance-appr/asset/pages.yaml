    # Reinforcement.


    Training should never be a one-time or one-shot experience. There needs to be
    repetition and reinforcement to enhance the level of understanding and the ability
    to apply the learned skills. Continuous training is key to ensuring that organizations
    are at a high level of human readiness to thwart cyberattacks. Immersive Labs
    provides a training platform to enhance organizational cyber intelligence and
    also stress-test decision-making capabilities during cyberattack-related crises.
    Business and technology leaders and other organizational employees not only learn
    about the latest attack types and how to deal with them but also get to apply
    the knowledge in simulated crisis conditions.


    # Reward.


    Through a mix of tangible and intangible rewards, organizations are likely to
    succeed in achieving the desired security behavior and thereby bring about a gradual
    transformation in the security culture. Both individuals and security teams need
    to be recognized for various information security management outcome scenarios—such
    as no-breach over a certain time period and quick and effective incident response
    and disaster recovery.70


    In summary, the goal of the training program should be to instill in each and
    every employee a deep sense of awareness of the different types of threats and
    how to protect sensitive data and other critical assets from potential attacks.
    As one security expert aptly stated, “Teach all employees what cybercrime looks
    like and how it is likely to affect them.”71 Such awareness and understanding
    will come from frequent and sustained training. A one-shot training exercise might
    be economically viable but not effective.72


    > Teach all employees what cybercrime looks like and how it is likely to affect
    them.


    Following is a list of questions to guide managerial decision making on information
    security-related awareness and training.


    # Awareness and Training: Guiding Questions


    +   1. Is cybersecurity training performance an important component of an employee''s
