- pgno: 16
  md: '# Professor Som Bhattacharya, Dean, College of Business and Management, University
    of Illinois at Springfield, Illinois, USA


    It is time for a holistic (and high-performance) approach to cybersecurity. While
    cybersecurity remains, nay grows, a pandemic in its own right, it is increasingly
    more than simply an engineering problem, a network problem, an access problem,
    or a denial of service problem, awaiting technical solutions. It is all of the
    above and then some. It is an overarching and alarming business problem. From
    an accounting/auditing perspective, it represents a going concern issue; from
    a managerial standpoint, it may lead to reputation loss, capital market misgivings,
    internal audit harangues, external audit jitters, legal woes, privacy implications,
    customer flight, and penalties, and it questions the very survival of corporate
    and non-corporate entities. This book, in response, spans a wide range of issues
    such as privacy, national and transnational guidelines, opt-in vs. opt-out, ransomware,
    the use of crypto-currencies, the dark web, occasional sovereign nation sponsorships
    of miscreants and malware, and it presents a solution scorecard and other approaches
    that appeal to more than the technical or IT wings of an enterprise. These issues
    are more likely to be understood and acted upon by enterprise and enterprising
    managers. It is this holistic perspective, then, of a growing cyber pandemic,
    that sets this book apart and makes for its likely adoption by the government,
    the corporate sector and academia alike. Cybersecurity issues need to be addressed
    and managed holistically and this book tells us how.


    # Professor Indranil Bose, Indian Institute of Management Calcutta, Kolkata, India


    In the age of pandemic, the importance of cybersecurity readiness cannot be overemphasized.
    While a number of authors have focused on the technical aspects of cybersecurity,
    this book uniquely blends technology with management of cybersecurity and does
    it in a lucid and comprehensive manner. The author''s vast experience and regular
    interactions with people in the field is showcased in the engaging writing style
    involving practical examples and case studies. The book fulfills a gap that exists
    in the area and makes a timely and worthwhile contribution. The coverage of topics
    is extensive and depth of topics will fascinate even the specialized cybersecurity
    expert. This book is a must-have for academics and practitioners who want to learn
    about and manage the efforts toward creating cybersecurity awareness and preparedness
    in organizations.'
  merge: -1
  img_proc: true
