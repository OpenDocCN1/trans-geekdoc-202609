    # Tolerance Levels.


    It is important to set the acceptable recovery point objective (RPO) and recovery
    time objective (RTO) for all systems and applications, especially for the mission-critical
    ones. Desirably the recovery time should be no more than a few milliseconds, but
    that may not be a realistic goal. It is imperative that planners carefully deliberate
    and decide on these two metrics for each tiered set of applications. Generally,
    the Tier 1 applications need to be up and running immediately, Tier 2 within eight
    to ten hours, and Tier 3 within a few days.⁹¹


    # Backup Sites.


    Organizations must be prepared with one or two backup site locations from where
    they can start operating the mission-critical systems if the main operational
    site goes down. These recovery sites must be set up with trained personnel and
    devices and systems to be functional as soon as disaster strikes and takes down
    the main production systems. There are three types of backup sites: hot, warm,
    and cold sites. Hot sites are fully equipped with all the necessary hardware,
    software, network, and internet connectivity; even data are regularly backed up
    or replicated on the hot site systems. Such a site can exist physically in a data
    center or at a branch/satellite office location, or virtually in the cloud. The
    hot site is expected to be up and running immediately. On the other hand, the
    warm and cold sites, the cheaper options, are reasonably equipped and staffed
    and will take a few days to be functional.


    The disaster recovery team must have a clear understanding of where they need
    to be when there is an incident. There must be adequate space at the alternate
    sites to accommodate the assigned personnel.


    # Service Level Agreements with Service Providers.


    If external service providers are involved in deploying computing operations,
    the service level agreements (SLAs) with each of these service providers must
    explicitly state the level of service expected from the contractors in the event
    of a disaster. Desirably, there should be penalties for not meeting the contracted
    expectations.


    # Regular Testing.


    The DR plan must be tested periodically to ensure that the recovery performance
    meets expectation. Using measures such as the Recovery Point Objective and Recovery
    Time Objective, the testing process must comprehensively evaluate the effectiveness
    of the plan. The'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'methodology and frequency of testing must be documented in the plan document
    and followed. There are tools that can be used to automate DR testing without
    disrupting production systems. It is also important to test the performance of
    the assigned personnel using simulated disasters and drills. Following is a set
    of guiding questions to ensure that the key elements of a disaster recovery plan
    are addressed and in place.


    # Disaster Recovery Planning: Guiding Questions


    +   1. Is a comprehensive asset inventory maintained to identify the various vulnerability
    points?

    +   2. Are the various threat scenarios identified and rank ordered (based on
    risk and business impact analysis) prior to developing recovery strategies?

    +   3. Are recovery performance measures (such as the Recovery Point Objective
    and Recovery Time Objective) for mission-critical and noncritical applications
    and systems clearly defined?

    +   4. Are the roles and responsibilities of the DRP team members clearly articulated
    and documented?

    +   5. Are details on how individuals and teams will act, communicate, and report
    explicitly depicted in the plan document?

    +   6. Do the Incident Response and Disaster Recovery teams work in close cooperation
    and conduct joint training exercises?

    +   7. To the extent applicable, are business partners (such as customers and
    vendors) kept informed of the recovery plan?

    +   8. Is there a written communication plan that details how the entire workforce,
    media, and the general public will be kept informed and updated during the disaster
    recovery process?

    +   9. Are backup sites, whether hot, warm, or cold, in place?

    +   10. Do service level agreements (SLAs) with vendors explicitly detail the
    expected level of service and support during disasters?

    +   11. Is the Disaster Recovery Plan (DRP) regularly tested and updated as needed?'
