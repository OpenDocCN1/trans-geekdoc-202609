  md: '*Encryption.* Encryption remains one of the best ways of securing data at rest
    or in motion. Complex algorithms (rules for coding and decoding data), also known
    as keys, are used for scrambling and unscrambling data. When the same key is used
    to encrypt and decrypt data, the method is known as *symmetric encryption*, and
    when different keys are used, the method is referred to as *asymmetric encryption*.
    Some of the popular data encryption algorithms are AES, RSA, Triple DES, and Twofish.
    These encryption methods vary in capability and perform differently on different
    types of infrastructure. Similarly, encryption tools also vary in capability:
    some are better at encrypting or decrypting small volumes of data, others excel
    when it comes to large amounts of data. So, an organization must perform with
    due diligence to identify and implement the appropriate encryption method and
    tool. It is also considered a best practice to identify and encrypt all types
    of sensitive data. The encryption key must be secured, and there are multiple
    ways of accomplishing this important security measure. Regular review of data
    encryption performance is also a reflection of a mature approach to cybersecurity
    preparedness. Maintaining comprehensive logs and audit trails linked to accessing
    encrypted data is yet another important element of a robust data protection plan.³⁰
    When selecting an appropriate encryption mechanism, it is important to ensure
    that it will easily integrate with any third-party application. Frequently backing
    up encrypted data and also restoring the backed-up data to check for accuracy
    is another best practice.³¹


    Documents containing sensitive data must be encrypted with a persistent file-level
    security policy. Such a policy indicates who can access the file and what they
    can do with it. Effectively enforcing the policy ensures only authorized users
    are able to access and edit files and thereby protect against data leaks.³²


    Organizations should also consider products and solutions that support end-to-end
    encryptions; that is, the data are encrypted at all times. Virtru is a security
    solutions provider that offers the “Host Your Own Keys and Maintain Control of
    Your Data” option. By subscribing to this self-control option, firms can protect
    their data keys from any third party including governments who can blind-subpoena
    service providers.³³


    *Digital Signatures and Digital Certificates.* Digital signature is an encryption
    technique used for authentication and to achieve the data integrity goal of nonrepudiation.
    Non-repudiation means the creator of the message cannot dispute that they did
    create the message and it was not forged. Similar to the traditional wet signature,
    a digital signature is “an electronic,'
  merge: -1
