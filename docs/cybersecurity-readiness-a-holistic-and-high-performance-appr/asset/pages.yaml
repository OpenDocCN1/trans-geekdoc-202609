- pgno: 138
  md: '# 6.2.7 Data Backup and Retention


    Probably the most foolproof method of preparing for data breaches is to frequently
    back up sensitive data and carry out regular tests to ensure the backed-up data
    is easily retrievable.52 It is rather alarming when a survey finds that 32% of
    IT administrators don’t regularly test the reliability of their data restoration
    process.53


    Although online backups might be more convenient and the accepted norm, periodically
    saving data to storage devices that are not connected to the Internet is an essential
    component of a robust strategy. There should be multiple backup sources—virtual
    and physical. An offsite data backup and storage solution is a prudent move to
    offset potential threats to the main operations center. The frequency of backup
    will depend on the nature and criticality of data. Sensitive transactional data
    must be backed up daily, preferably real-time. Weekly backup might be fine for
    data that are not used or updated frequently.54


    How long should data be retained? What is the appropriate data retention policy?
    The organization must carefully and thoroughly deliberate on these questions and
    take into consideration regulatory requirements. For instance, the Sarbanes-Oxley
    Act (SOX) requires that receivables and payables ledgers and tax returns must
    be saved for seven years and customer invoices must be retained for five years.
    SOX also mandates that payroll records and bank statements be kept forever.55
    According to the Payment Card Industry (PCI) Data Security Standard (DSS), merchants
    should only store the information required to complete the transaction. If the
    16-digit card number is stored, it should be destroyed as soon as it is no longer
    required.56 Article 5(e) of the General Data Protection Regulation (GDPR) stipulates
    that “data should only be retained for as long as is required to achieve the purpose
    for which data were collected and are being processed.” Exception is granted when
    data needs to be retained “for archiving purposes in the public interest, scientific
    or historical research purposes or statistical purposes.”57 Recital 39 of GDPR
    further articulates that the data controller must conduct periodic reviews to
    ensure that data is securely erased when no longer required.58


    Retention policies also prescribe how data should be destroyed. Specialized tools
    must be used to securely wipe data off hard drives, flash drives, and other storage
    media before the storage devices are destroyed. In addition to the built-in disk
    clean-up utility that comes with the operating systems, DBAN, Eraser, Disk Wipe,
    CCleaner, Darik’s Boot, and Nuke are popular hard drive eraser tools.59'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'In both the Adult Friend Finder and Ashley Madison site breaches, the organizations
    were accused of data management malpractice because they did not properly secure
    confidential customer data. In the Ashley Madison case, the hackers published
    a huge amount of sensitive data that was supposed to have been deleted. They justified
    their action by claiming that Ashley Madison lied to its customers about vigorously
    protecting its data. Supposedly, the company did not comply with the offer to
    delete customer personal accounts completely for $19. The attack team also claimed
    that Ashley Madison failed to comply with the promise of deleting sensitive data
    such as purchase transaction details, credit card information, and the real names
    and addresses of customers.60


    It is imperative that companies clearly spell out their customer data storage
    and deletion policies and follow through with them. The service level agreements
    (SLAs) with managed service providers must include data backup, storage, and purge
    provisions.


    Following is a set of guiding questions to help implement a reliable data backup
    strategy and process.


    # Data Backup and Retention: Guiding Questions


    +   1. Is data being automatically backed up to multiple storage locations?

    +   2. Is data being automatically backed up to physical and virtual storage locations?

    +   3. Is a copy of the backed-up data maintained in an offline storage space?

    +   4. Is the frequency of data backup determined after thorough and careful deliberation?

    +   5. Is the data restoration method regularly tested for reliability?

    +   6. Did the organization implement appropriate data retention and purge policy
    after thorough and careful deliberation?

    +   7. Is there an appropriate oversight mechanism, such as the role of the data
    controller, to ensure the date retention and purge policies are being followed?

    +   8. Are data storage and purge expectations clearly documented in the SLAs?'
  merge: -1
  img_proc: true
