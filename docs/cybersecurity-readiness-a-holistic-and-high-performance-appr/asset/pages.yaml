  md: '# Appendix 1


    # Information Security Monitoring Controls


    Organizations need to have an information security controls monitoring system
    and schedule in place. This is a representative guide, adapted from FedRAMP Continuous
    Monitoring Strategy Guide (April 4, 2018, http://www.fedramp.gov) that can be
    suitably customized for use.


    | Nature and Types of Control | Brief Description |

    |---|---|

    |  | **Continuous and Ongoing** |

    | Information System Monitoring | - Monitor and detect attacks and indicators
    of potential attacks.

    - Detect unauthorized local, network, and remote connections.

    - Identify unauthorized use of information systems.

    - Deploy monitoring devices at strategic locations to track sensitive data and
    specific types of transactions.

    - Protect information, gathered from intrusion-monitoring tools, from unauthorized
    access.

    - Seek and comply with legal opinion regarding monitoring activities. Especially,
    ensure compliance with applicable federal laws, executive orders, directives,
    policies, and regulations. |

    | Auditable Events | Continuously monitor the following types of events:

    - Successful and unsuccessful account logon events

    - Account management events

    - Policy changes

    - Privilege functions

    - Process tracking

    - System events |'
