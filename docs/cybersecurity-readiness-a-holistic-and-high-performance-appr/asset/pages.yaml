    +      g. Roles and Responsibilities

    +      h. Vendor Selection Criteria

    +      i. Service Level Agreement Guidelines

    +      j. Incident Response Plan

    +      k. Disaster Recovery Plan

    +      l. Training Guidelines

    +      m. Performance Measures

    +      n. Rewards and Penalties


    (Continued)'
