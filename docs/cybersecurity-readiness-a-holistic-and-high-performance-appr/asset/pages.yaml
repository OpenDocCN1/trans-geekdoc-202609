    # # The Soft Threat: The Story of the Bangladesh Bank Reserve Heist


    **A Business Case by Tanisha Bukth, MBA, and Sadrul Huda, PhD**


    # ## Abstract


    In February 2016, Bangladesh Bank, the Central Bank of Bangladesh, became the
    victim of an unprecedented cyber heist, in which unknown hackers attempted to
    steal a mammoth $951 million from its reserves. In their scheme, which involved
    the introduction of malware into Bangladesh Bank’s systems and manipulation of
    the SWIFT system to send seemingly authentic payment requests, the hackers succeeded
    in siphoning off as much as $81 million, making this the first known case of fund
    theft from a Central Bank. This case strives to develop an understanding of the
    manner in which the heist was accomplished, with a key focus on how vulnerabilities
    within the relevant stakeholders could have facilitated the event. In addition,
    it has been developed against the backdrop of a growing number of cyberattacks
    on banks across the world and thus encourages students to come up with strategic
    measures that could allow targets like Bangladesh Bank and the global financial
    system as a whole to reduce their vulnerability to future threats.


    # ## Case


    # ### Learning Outcomes


    By the end of this case study, students should be able to:


    +   - gain an understanding of the manner in which funds were stolen from Bangladesh
    Bank’s reserve in one of the largest cyber thefts in history;'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   - gain a perspective on the key stakeholders affected directly and indirectly
    by the heist, namely Bangladesh Bank, the Federal Reserve Bank of New York, SWIFT,
    and the Philippines;

    +   - analyze the weaknesses and/or vulnerabilities of the concerned stakeholders
    that catalyzed the fund theft;

    +   - identify the growing susceptibility of the global financial system to cyberattacks;
    and

    +   - come up with strategies that can allow the Central Banks in developing countries
    like Bangladesh Bank and players in the global financial system to insulate themselves
    against future attacks.


    # Introduction


    Shockwaves were sent across the global financial system in February 2016 as news
    of one of the biggest cyber heists in history made the headlines. In a brazen
    attempt to embezzle $951 million, cyber criminals had attacked the information
    system of Bangladesh Bank, the Central Bank of Bangladesh, and succeeded in stealing
    a staggering $81 million from its account at the Federal Reserve Bank of New York.
    To accomplish this massive heist, hackers had introduced malware into Bangladesh
    Bank’s computer systems and used it to learn about the correct protocol for transferring
    funds from its New York account through the SWIFT code–based money transfer system.
    Their strategy, although technically complex, can perhaps be labeled as intuitively
    simple, and it is this very simplicity that is shocking in its ramifications for
    the security of the global financial system (Quadir, 2016a).


    About three months into the heist, in May 2016, key stakeholders including Bangladesh
    Bank, the Federal Reserve Bank of New York, and the SWIFT were still “passing
    the buck” and pointing fingers at each other. But with the Chief Executive of
    SWIFT commenting on May 12, “I don’t think it was the first, I don’t think it
    will be the last,” one thing was clear: the global financial system lay vulnerable
    and such attacks were more likely than not to happen again. The essential question
    is: What were the loopholes in the system that had permitted such an act? And
    what should the relevant stakeholders do to address these loopholes (Canepa, 2016)?'
