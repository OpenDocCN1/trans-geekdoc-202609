    | **Defense Federal Acquisition Regulation (DFAR)** | DFAR is a cybersecurity
    regulation that applies to the U.S. Department of Defense (DoD) contractors. |
    Department of Defense (DoD) contractors and subcontractors that possess, store,
    or transmit "covered defense information" are required to provide adequate security
    to safeguard the covered defense information on unclassified information system.
