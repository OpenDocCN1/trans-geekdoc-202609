    # 6.2.10 Business Continuity Planning


    Related to cybersecurity risk assessments, business continuity planning (BCP)
    focuses on understanding the various adversity scenarios that could bring operations
    to a halt. From system failures to earthquakes, viral attacks, terrorism, hacking,
    and employee turnovers, organizations have to be prepared for all kinds of incidents,
    some caused intentionally, others being acts of nature. The significance of BCP
    cannot be overemphasized, especially under the current coronavirus pandemic conditions.


    Business continuity planners will adopt a very meticulous approach to identify
    all possible operational disruption risks and conduct a business impact assessment
    (BIA). The BIA analyses will help identify the threats, quantify their impacts,
    and rank order them based on expected loss amounts. Then, for each of the threats,
    the planners will identify suitable preventive or control measures. These measures
    fall under two broad categories: technical and administrative.


    The focus of technical measures is to increase the fault tolerance of devices
    and systems. One such technical control is to build in device and component redundancy
    and thereby avoid single points of failure. Having a cluster of servers instead
    of relying on a single server, using multiple firewalls instead of one, and using
    multiple sources to power data centers are examples of redundancies to maintain
    continuity of operations.'
