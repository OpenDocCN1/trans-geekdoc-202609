- pgno: 272
  md: '+   - May 5, 2014: Target CEO Gregg Steinhafel resigns. Target CFO John Mulligan
    will serve as interim president and CEO.

    +   - May 2014: Target announces that it will update all its REDcards to chip
    and PIN technology in early 2015. These cards encode information differently with
    each transaction, making it harder for thieves to clone the cards and use the
    stolen data.

    +   - June 10, 2014: Brad Maiorino appointed as senior vice president, chief information
    security officer. Brad is General Motors’ former chief information security and
    information technology risk officer.

    +   - Dec. 18, 2014: U.S. District Court for the District of Minnesota rules that
    a group of consumers could proceed with a majority of their claims against Target.


    # Target’s Vulnerabilities


    According to an analysis of the Target breach by the United States Senate Committee
    on Commerce, Science, and Transportation, the data thieves were able to steal
    the data because (1) they took advantage of weak security at a Target vendor,
    gaining a foothold in Target’s inner network; (2) Target missed warnings from
    its anti-intrusion software that attackers were installing malware in its network;
    (3) attackers took advantage of weak controls within Target’s network to maneuver
    into sensitive areas of the network; and (4) Target missed information provided
    by its anti-intrusion software about the attackers’ escape plan, allowing them
    to steal 110 million customer records. It was only after the U.S. Department of
    Justice notified Target of the data breach that Target began to investigate what
    had happened.


    # Costs of the Data Breach


    As a result of the data breach, Target faced many challenges. As of August 2014,
    the expenses in connection with the data breach had reached $235 million, with
    $90 million being paid from insurance. In the face of network security failure,
    Target had to identify ways to address future data security. It faced damage to
    its corporate reputation, a threat to stock prices, and, ultimately, reduced profits.'
