- pgno: 29
  md: '# CHAPTER

    1


    # Introduction


    # The Challenge of Cybersecurity


    Protecting organizational assets from cybersecurity attacks is a cost of doing
    business today. Such assets include customer and product information, business
    processes, company websites, social media accounts and content, business plans,
    trademarks, patents, proprietary hardware, and software.¹ In addition to profiteering
    and gaining competitive advantage, cyberattacks are also motivated by national,
    social, political, and ideological agendas.² As attacks continue to become more
    sophisticated and innovative, firms are being compelled to pay attention and to
    formulate and implement appropriate information security strategies. Although
    some organizations are thorough and deliberate in their approach, others seem
    willing to take chances and stumble and fumble in their actions and reactions
    to cyberattacks.³


    Because there is no guaranteed immunity from such threats and attacks, senior
    leadership is often at crossroads when it comes to making cyber investments. During
    a top management meeting at a major healthcare organization, the chief executive
    officer (CEO) encouraged the leadership team to focus on the mission of providing
    quality care and not waste time, money, and effort to try and bulletproof the
    organization from potential attacks. Another senior leader argued that it was
    beneficial for the company to be attacked, as that is how they would learn about
    the organization''s vulnerabilities.


    With heavy fines being imposed on negligent organizations and the existence of
    laws, such as the Sarbanes-Oxley (SOX) Act of 2002, that could send executives
    to jail, turning a blind eye to cyber threats and preparedness is a high-risk
    strategy. It was a landmark moment and decision when, in 2019, British Airways
    was found in violation of the European Union''s General Data Protection Regulation
    (GDPR) and fined a record amount of $228 million. The reputed airlines suffered
    a breach that exposed personal data of 500,000 customers.⁴ Equifax, one of the
    largest credit-reporting agencies, met a similar fate and settled to pay a penalty
    of $700 million for a breach that compromised 148 million customer records.⁵'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# These massive breach incidents should get the leadership thinking


    whether they are content to live with the jeopardy of data protection fines running
    into the potential nine-figure bracket, or whether it''s more prudent to invest
    a fraction of that total on better cybersecurity procedures and technologies.⁶


    Cybersecurity governance challenges are numerous and daunting and there are no
    easy fixes. The book attempts to provide an easy-to-comprehend framework to help
    readers get their arms around cybersecurity readiness. It recognizes that the
    battle or war against current and future cyber threats must be fought holistically
    and comprehensively by adopting people-, process-, and technology-driven measures.
    Technology alone will not mitigate information security risks. There are several
    pieces to the complex puzzle of cybersecurity management and technology is only
    one of them. Committed leadership, robust governance procedures, and informed
    and motivated personnel are other success factors. The book presents a set of
    seventeen success factors associated with three high-performance information security
    culture traits: commitment, preparedness, and discipline.


    Chapter 2 begins with a discussion of the global epidemic of cyber-attacks enabled
    by ever expanding attack surfaces and constantly evolving hacking methods and
    techniques. The consequences and impacts of data breaches are also presented.
    In Chapter 3, specific breach incidents are reviewed to understand the causes,
    adverse impacts, and organizational shortcomings. Each case review concludes with
    a set of summary takeaways and lessons learned. Chapter 4 draws upon the organizational
    culture and high-reliability organization literature to identify the three cornerstones
    of a high-performing security culture—commitment, preparedness, and discipline.
    How each of these cultural traits relates to cybersecurity readiness success factors
    and best practices is the focus of discussion in Chapters 5, 6, and 7. Key takeaways
    and actionable recommendations are presented in Chapter 8. Included in the appendix
    section are six useful resources:


    +   - a) Information Security Monitoring Controls

    +   - b) Cybersecurity Performance Measures

    +   - c) Cybersecurity Readiness Scorecards

    +   - d) Cybersecurity and Privacy Laws and Regulations

    +   - e) Physical, Technical, and Administrative Controls: A Representative List

    +   - f) Case Studies'
  merge: -1
  img_proc: true
