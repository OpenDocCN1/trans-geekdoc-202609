- pgno: 273
  md: '# Corporate Reputation


    Reputational damage may occur after a data breach because customers may not feel
    safe continuing to do business with a retailer. In response to the data breach
    crisis, Target used several tools to reach out to its customers, including full-page
    newspaper ads, an e-mail from the CEO Gregg Steinhafel apologizing about the breach
    and offering free credit monitoring, and an appearance by the CEO on CNBC on January
    13, 2014. In order to regain customer trust and reassure customers that it was
    safe to shop at Target, the retailer developed a public relations campaign that
    included the building of a microsite specifically for addressing the breach. Customers
    criticized Target for not responding immediately to the data breach. Target offered
    one year of free credit monitoring by Experian to affected customers. These services
    are meant to monitor customers’ credit and personal information and inform customers
    if any new accounts are opened in their name or if their information appears in
    the list of stolen information in a data breach.


    # Increasing Cybersecurity through Technology and Personnel Changes


    After the data breach Target announced that it would introduce REDcards (Target
    store-brand credit cards) with chip and PIN technology in early 2015 to improve
    security. These smart cards with chip and PIN technology use microchips to encrypt
    transactions. Target also invested in updating technology for increased security,
    in new infrastructure, customer service, and data centers to protect it from future
    data breaches. Target also gave $5 million to support a new cybersecurity coalition
    to educate consumers.


    The data breach led to the resignation of the CEO and the CIO. After the data
    breach Target announced that it would overhaul its information security and compliance
    systems and personnel. Furthermore, two new positions were created—chief information
    security officer and chief compliance officer—to improve Target’s data security.
    At first, Target named Bob DeRodes, a former technology advisor to U.S. government
    departments, as its interim CIO to guide Target’s security efforts after the data
    breach. According to A BullsEye View, Target’s online magazine, Bob DeRodes would
    be responsible for enhancing Target’s data security and technology infrastructure
    and hiring Brad Maiorino as the chief information security'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'officer. Brad Maiorino is one of the top leaders in information security and
    risk in the United States. His main responsibility involved ensuring that Target
    and its customers are protected from information security threats through an information
    security and technology risk strategy. On February 3, 2015, Target appointed Mike
    McNamara, a technology innovation expert with experience as a CIO at a UK-based
    retailer, as the new CIO. The role of the new CIO included overseeing the technology
    team and operations, and information security. Target also appointed Jacqueline
    Hourigan Rice (a global expert in ethics, compliance, and corporate security)
    as its first chief risk and compliance officer. Some of the duties of Target’s
    chief risk and compliance officer included oversight of enterprise risk management,
    vendor management, compliance, and corporate security.


    # Summary of Costs


    According to the Ponemon Institute’s Cost of Data Breach Study (2013), the average
    cost of a breached record for the United States is $188 per stolen record. This
    cost is so high because breaches can spur multiple lawsuits and ongoing expenses
    as firms work to prevent their customers from suffering full-fledged identity
    theft. Target’s incurred costs included free credit monitoring for customers,
    new technologies to strengthen data security and issuing new cards, hiring new
    staff, legal expenses, and fines. Other expenses Target incurred as a result of
    the data breach included expenses for protecting the company from future attacks
    by investing in new infrastructure, security features, customer service, and data
    centers.


    As of December 2014, investigation into the Target data breach is ongoing and
    no arrests have yet been made related to the data breach.


    # DISCUSSION QUESTIONS


    +   1. If you had been hired as a public relations consultant by Target to handle
    the data breach crisis, what would you have done differently and why?

    +   2. In your opinion, could the Target data breach have been prevented? Why
    or why not?

    +   3. You are hired as the next CIO of Target. What strategies would you implement
    to prevent another data breach?'
