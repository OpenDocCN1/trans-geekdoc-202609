    +   2. Is there a formal process in place to guide the submission and review of
    the penetration testing report?

    +   3. Is there documentation to record actions taken in response to penetration
    testing findings?

    +   4. How often does the organization conduct (with or without the help of external
    agencies) Red Team exercises?

    +   5. Is there a formal process in place to guide the submission and review of
    the Red Team exercise report?

    +   6. Is there documentation to record actions taken in response to Red Team
    exercise report findings?


    Planning and execution discipline are key to sustaining a high level of cyber
    readiness. An organization must have the discipline not only of planning rigorously
    but also of meticulously executing the plan. Whether it is the formulation and
    enforcement of security and communication policies, establishing a security controls
    monitoring routine, continuously looking for improvement opportunities, performing
    security audits, or penetration testing, the organization must strive to execute
    flawlessly.


    Appendix 5 presents a summary list of administrative, technical, and physical
    controls to secure data, devices, networks, storage locations, and people. These
    controls reflect one or more of the three dimensions of a high-performance information
    security culture—commitment, preparedness, and discipline. Effectively implementing
    these controls is key to achieving a high level of cybersecurity readiness.'
  merge: -1
  img_proc: true
