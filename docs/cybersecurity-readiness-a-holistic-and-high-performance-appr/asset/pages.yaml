  md: '# 6.2.8 Asset Maintenance


    A clearly defined set of procedures must be in place to maintain and manage the
    hardware and software assets of an organization. Whether it is scheduling regular
    system maintenance or performing periodic checks of the different types of software
    such as operating systems and applications, there must be a formal documented
    approach in place. Logs and records also must be kept of hardware and software
    repair activities so that there is complete awareness of what the issues were,
    how they were resolved, and who resolved the issues. From a security standpoint,
    such repair and maintenance logs are very important because viruses can be installed
    by those engaged in such activities. Detecting unauthorized access will be difficult
    in the absence of detailed records. Periodic maintenance and review are also important
    from the standpoint of ensuring that all hardware and software are highly secure
    and robust. Evidence of regular hardware and software maintenance, review, and
    update activities is also important from an auditing standpoint.


    Organizations with a mature digital asset maintenance process will constantly
    be monitoring hardware and software for vulnerabilities and viruses. For instance,
    malware is known to find its way to the boot sector, file allocation tables, and
    in .com and .exe files. Hence, scanning these locations on a regular basis is
    an extremely important maintenance activity.


    In addition, making sure the recommended patches and updates are installed in
    a timely manner is a very important element of the upkeep operations. Patching
    or fixing a software means adjusting parts of the program code to reduce vulnerabilities
    to different types of attacks. Since attack methods are forever evolving, it is
    impossible for any software development team to predict every possible security
    loophole and fix them before the software is released. It is through software
    updates that engineers maintain operating systems and applications as well as
    the devices that run them.61


    A list of questions to guide digital asset maintenance is presented below.


    # Asset Maintenance: Guiding Questions


    +   1. Is the process for maintaining and updating hardware and software clearly
    documented?

    +   2. Are logs maintained to track the maintenance, update, and repair activities?'
