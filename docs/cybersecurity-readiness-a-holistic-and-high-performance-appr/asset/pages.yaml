    # 7.6 Penetration Testing

    and Red Team Exercises


    Penetration testing is another proactive defense measure that not only identifies
    vulnerabilities but also exploits them to the fullest extent to assess the nature
    and extent of impact. So the scope of penetration testing is more expansive than
    vulnerability testing, as the latter only seeks to identify security weaknesses
    and loopholes.13


    Penetration testing is carried out in five stages: planning and reconnaissance,
    scanning, gaining access, maintaining access, and analysis. The first stage is
    essentially focused on defining the scope and goals of the test, the testing methods
    to be used, and gathering necessary intelligence on the targeted system and application.
    The next stage entails the use of scanning tools to inspect the targeted application
    code and to gauge how the system will react to the planned attack test. The tester
    then launches the planned attack, such as a cross-site scripting, SQL injection,
    backdoors, or denial-of-service, in order to gain access, steal information, and
    disrupt operations. The next phase of the simulated attack would be to maintain
    a long-term presence in the exploited system and mine highly sensitive data. After
    accomplishing the set goals, the pen tester will prepare a report detailing the
    type of attack launched, the vulnerabilities exploited, the type of sensitive
    data accessed, and the length of time spent in the compromised system.14


    A Red Team exercise or assessment is a more targeted form of penetration test.
    The main goal is to assess an organization’s detection and response capabilities.
    Such exercises are generally for a longer duration than a penetration test and
    normally involve a team of people. For instance, “a member of the Red Team poses
    as a FedEx delivery driver and accesses the building. Once inside, the team member
    plants a device on the network for easy remote access. This device tunnels out
    using a common port allowed outbound, such as port 80, 443, or 53 (HTTP, HTTPS,
    or DNS), and establishes a command and control (C2) channel to the Red Team’s
    servers. Another team member picks up the C2 channel and pivots around the network,
    possibly using insecure printers or other devices that'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'will take the sights off the device placed. The team members then pivot around
    the network until they reach their goal, taking their time to avoid detection."15


