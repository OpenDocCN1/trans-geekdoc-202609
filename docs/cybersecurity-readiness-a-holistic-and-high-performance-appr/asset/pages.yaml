- pgno: 183
  md: '# Key Messages and Actionable Recommendations


    This chapter presents a summary of key takeaways. They are organized under the
    three high-performance cultural traits of commitment, preparedness, and discipline.


    # 8.1 Commitment


    There are seven key indicators that reflect a high level of organizational commitment
    toward cyber readiness. Each is briefly reviewed below.


    # 8.1.1 Hands-On Top Management


    Top management should be genuinely committed to developing and enhancing cybersecurity
    competency of the organization. They should be driven by their genuine concern
    for protecting stakeholder interests and not adopt a check-the-box approach to
    regulatory requirements. In their quest to become more aware and knowledgeable,
    senior leaders should get involved in cybersecurity planning and execution initiatives.
    The senior leadership team in exemplary organizations are found to be on cybersecurity
    oversight and governance committees. They are also known to participate in security
    review discussions and disaster recovery exercises.


    # 8.1.2 “We-Are-in-It-Together” Culture


    Although there is no one best approach to developing a highly collaborative and
    supportive information security culture, organizations should consider deploying
    cybersecurity champions to enhance awareness and mobilize support throughout the
    organization. Such influencers will engage with organizational units and individual
    members to establish a common ground and sense of purpose. The leadership at Infrastructure
    Development Finance Corporation (IDFC) was successful'
  merge: -1
  img_proc: true
- pgno: 184
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 185
  md: 'identifying and mitigating cyber risks associated with its initiatives, the
    unit should be recognized and rewarded.


    When engaging with external business partners such as technology service providers,
    it is imperative to gauge alignment (of service expectations) before signing any
    kind of service contract. For instance, if a due diligence report reveals that
    the company’s data security standards and support expectations are unlikely to
    be met by the potential vendor, the firm should not strike a deal.


    # 8.1.6 Joint Ownership and Accountability


    Cybersecurity planning and implementation initiatives should have a senior leadership
    sponsor who will assume ownership and accountability for the initiative. A tollgate
    approach should be in place for governing information security initiatives. Senior
    leadership sign-off should be required for the project to move on to the next
    phase. The organizational performance review system should reward individuals
    and business units for cybersecurity-related activities and initiatives. When
    establishing performance agreements with external service providers, incentives
    and sanctions should be in place to encourage a high level of commitment (to secure
    and protect sensitive data and systems) on the part of the business partners.


    # 8.1.7 Empowerment


    The chief information security officer (CISO) and their team should be adequately
    empowered to be successful. It is recommended that the CISO function be provided
    an independent operating budget and report directly to the CEO, audit committee,
    or risk committee. The overall goal is to remove any kind of hindrance to performing
    the cyber governance activities fairly and objectively.


    # 8.2 Preparedness


    The key indicators of organizational preparedness are described in terms of an
    organization’s ability to effectively conduct four key activities: a) risk-based
    identification and prioritization of critical assets and initiatives; b) securing
    sensitive data and related digital assets; c) detecting threats and attacks; and
    d) responding and recovering from breach incidents. Recommendations relating to
    each of these preparedness elements are summarized and itemized below.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 8.2.1 Risk-Based Asset Identification and Prioritization


    Deciding on which assets to secure and to what extent is not an easy task. A risk-based
    prioritization system to guide asset identification and prioritization is recommended.
    Key features of an effective cyber risk assessment and asset identification and
    prioritization system are itemized in the following lists.


    # Cyber Risk Assessment


    +   - There should be a formal and comprehensive assessment of risk exposure and
    tolerance levels.

    +   - A risk impact evaluation rubric (see Table 4) should be developed to guide
    the risk assessment of initiatives and digital assets.

    +   - Developing a risk probability matrix (see Figure 16) to display the probability
    of occurrence and extent of loss of the different types of cyber risks will help
    with threat prioritization.

    +   - Consider adopting a cyber risk visualization platform to monitor and manage
    cyber risks in real time.


    # Asset Identification and Prioritization


    +   - From a preparedness and cost optimization standpoint, it is imperative that
    a comprehensive inventory of digital assets and data types is maintained and used
    to classify application systems into different levels of criticality. Such categorization
    would help with the formulation and implementation of appropriate data protection
    strategies.

    +   - A complete record of authorized and unauthorized hardware and software assets
    should be maintained and regularly updated. Such an inventory will help in the
    quick identification and removal of unauthorized devices and applications from
    the organization''s information systems network.

    +   - The digital assets catalog should include external systems and platforms
    that connect with the organization''s internal systems for information sharing.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '+   - Dynamic Host Configuration Protocol (DHCP) and IP address management
    tools should be used for hardware inventory identification and updates.

    +   - Information flows between networks, applications, and systems should be
    mapped and regularly reviewed.

    +   - Noncritical systems should be monitored and checked regularly for sensitive
    data.


    # 8.2.2 Securing Sensitive Data

    and Related Digital Assets


    A multilayer and multipronged defense mechanism should be in place to secure sensitive
    data. Following are itemized recommendations relating to some key elements of
    this protection strategy.


    # Access Management


    +   - A mix of physical, technical, and administrative controls (see Appendix
    5) should be used to identify, authenticate, and authorize access. Standard controls
    include use of strong passwords, multi-factor authentication, and biometric tools.

    +   - Consider investing in a robust identity access management (IAM) system to
    continuously check user credentials, update permissions as roles change, and raise
    alerts and immediately revoke privileges when it detects unauthorized access.

    +   - Access credentials of third-party service providers should be regularly
    reviewed and monitored.

    +   - An IAM team should be in place to a) manage the access control process,
    b) regularly submit reports to senior management, and c) take prompt and proactive
    action to protect organizational assets.

    +   - The principle of least privileged (PoLP) should be followed when setting
    access rights to data and systems.

    +   - Separation of duties and job rotation are important control mechanisms to
    mitigate the risk of insider attacks.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   - Robust screening and background checks during the hiring process are
    other effective ways of reducing the probability of insider threats and attacks.

    +   - Virtual private network (VPN) tools should be used to secure and monitor
    remote access.

    +   - Network segmentation is essential to protect critical data and systems from
    unauthorized access. Procedures should be in place to keep the production, development,
    and testing environments separate.


    # Configuration Management


    +   - Appropriate automation tools should be used to manage configuration settings
    of systems, devices, and networks.

    +   - Notification and quick response processes should be in place to effectively
    address unauthorized activities and changes.

    +   - Industry standards for configuration settings of the different elements
    of IT infrastructure should be used as a guide to establish suitable benchmarks.


    # Securing Email Clients and Browsers


    +   - The organization should implement domain-based message authentication, reporting,
    and conformance (DMARC) policy.

    +   - Latest and fully supported versions of email clients and web browsers should
    be used.

    +   - All inbound email attachments should be screened for malware.

    +   - Domain Name System (DNS) filtering services should be used to block access
    to malicious sites.

    +   - Network-based URL filters and URL categorization services should be used
    to prevent access to malicious sites.


    # Securing Networks, Ports, and Removable Media


    +   - A review and approval system should be in place to effectively secure network
    ports, protocols, and service.

    +   - Automated scanning tools should be used to detect unauthorized ports.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   - A comprehensive inventory of removable media and portable devices should
    be maintained and regularly reviewed. Policies and procedures should be in place
    to secure removable media. For instance, auto-run features should be disabled
    on optical and USB drives.


    # Data Security


    +   - Strongest encryption algorithms should be used to encrypt data-at-rest and
    data-in-motion.

    +   - When selecting an encryption mechanism, ensure the tool is compatible and
    will easily integrate with third-party applications.

    +   - Encrypted data should be frequently backed up, and such backed-up data should
    be regularly restored to ensure the backup system is working effectively.

    +   - Tools such as a managed file transfer (MFT) platform should be in place
    to protect, track, and audit data-in-transit.

    +   - Data loss protection solutions (DLP) should also be considered for adoption.

    +   - Other methods of protecting data from unauthorized access, such as data
    masking and steganography, should be considered.


    # Mobile Device Usage


    +   - A mobile device usage policy should be clearly communicated and enforced.
    This policy should address issues such as remote access, protecting data stored
    on the devices, remote monitoring and wipe-off capabilities, and the use of dual-factor
    authentication.


    # Data Backup and Retention


    +   - Method and frequency of data backup should be carefully determined and closely
    followed.

    +   - Data should be backed up in both online and offline storage space.

    +   - The data restoration process should be tested frequently.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   - Data storage and deletion policies should be determined based on careful
    review of regulatory guidelines.

    +   - Service level agreements (SLAs) with managed service providers must clearly
    spell out data backup, storage, and purge provisions.


    # Asset Maintenance


    +   - A routine maintenance plan for digital assets should be in place and executed
    consistently.

    +   - Records of maintenance, update, and repair activities should be kept and
    reviewed regularly.


    # Awareness and Training


    +   - Customized awareness and training programs should be developed and delivered
    regularly.

    +   - Continuous training is encouraged to remind and reinforce information security
    knowledge domains and skillsets.

    +   - Content and delivery of these training workshops should be engaging and
    interactive.

    +   - Participation and performance in such training programs should be an important
    element of an employee''s performance review.


    # Business Continuity Planning


    +   - Business continuity planners must conduct a business impact assessment to
    identify and rank order the adversity scenarios.

    +   - Both technical and administrative control measures should be in place to
    proactively deal with the potential crisis conditions.

    +   - Technical measures would include implementing device redundancies such as
    disk mirroring and disk striping, load balancing, and use of multiple power sources
    to run data centers.

    +   - Administrative control measures would include succession planning, job enrichment
    programs, rewards and incentives, and backup sites.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - Leadership roles and responsibilities should be clearly defined.

    +   - Crisis management teams must be trained to work collaboratively.

    +   - The Business Continuity Plan (BCP) plan should be regularly reviewed and
    tested.


    # 8.2.3 Detecting Threats and Attacks


    The ability to proactively detect potential threats and vulnerabilities is a competency
    that sets apart the highly prepared firms. The following are some recommendations:


    +   - A comprehensive cyber intelligence gathering plan and process should be
    in place for threat detection purposes.

    +   - The organization should consider deploying automated tools such as Security
    Information and Event Management (SIEM).

    +   - A security operations center (SOC) and team should be in place to consistently
    and effectively execute the threat detection plan.

    +   - The detection process should be regularly reviewed and tested to ensure
    conformance to expectations.


    # 8.2.4 Responding and Recovering from Breach Incidents


    Highly resilient organizations are able to quickly and effectively respond to
    and recover from cyberattacks. The following recommendations should help in the
    development of respond and recovery capabilities.


    +   - A cross-functional incident response (IR) team should be in place with top
    management oversight.

    +   - Response plans for different threat scenarios should be clearly documented.

    +   - Roles, responsibilities, and reporting relationships of the IR team members
    should be clearly defined and articulated.

    +   - Regular drills such as tabletop exercises should be conducted to assess
    readiness of the IR teams.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 8.3 Discipline


    A disciplined approach to cybersecurity governance is reflected in the organization''s
    approach to planning and implementation activities. Recommendations relating to
    six such activities are summarized below.


    # 8.3.1 Information Security Governance Policy


    +   - A comprehensive information security governance policy should be crafted
    by a cross-functional team of senior leaders. There should be a strong legal presence
    on the team to ensure conformance with the various information security and privacy
    laws and guidelines.

    +   - The policy document should be frequently reviewed and updated.

    +   - Regular conformance tests and audits should be carried out to ensure the
    policy is in effect.


    # 8.3.2 Communication and Enforcement of Policies


    +   - There should be a customized plan for communication of the different components
    of the information security policy.

    +   - Senior leadership should own and be held accountable for conformance to
    the different policy elements.

    +   - Surprise tests and audits should be carried out to check on policy compliance.


    # 8.3.3 Continuous Monitoring


    +   - A monitoring (of vulnerabilities and defenses) schedule should be in place
    and followed meticulously.

    +   - The organization should invest in automated tools to facilitate monitoring.

    +   - Structural mechanisms should be in place to promptly act on findings and
    recommendations.

    +   - Clearly defined measures and metrics should be used to assess the effectiveness
    of the continuous monitoring program.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 8.3.4 Continuous Performance Assessment and Improvement


    The state of information security preparedness should be assessed holistically,
    using multiple sets of performance indicators. Such measures come under the following
    categories:


    +   - Business value impact measures

    +   - Productivity impact measures

    +   - Nature of incidence and frequency of occurrence measures

    +   - Audit and compliance measures

    +   - Vulnerability measures


    Mechanisms and procedures should be in place to continuously gather and analyze
    performance data and take prompt action.


    # 8.3.5 Security Audits and Drills


    +   - The organization should undergo security audits to detect vulnerabilities
    and threats.

    +   - Prior to entering into a contractual agreement with third-party service
    providers, an organization should ask for audit reports confirming compliance
    with relevant standards and regulations.

    +   - Regular security drills, such as tabletop exercises, are also highly recommended
    to stress test the current state of cyber readiness.

    +   - Formal procedures and mechanisms should be in place to share and promptly
    act on the findings.


    # 8.3.6 Penetration Testing and Red Team Exercises


    +   - The organization should regularly conduct penetration testing and Red Team
    exercises.

    +   - Formal procedures and mechanisms should be in place to share and promptly
    act on the findings.'
  merge: -1
  img_proc: true
