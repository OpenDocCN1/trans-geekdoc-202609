- pgno: 167
  md: '# CHAPTER 7 Discipline


    A disciplined approach to information security management is reflected in a) the
    meticulous formulation of governance policy and procedures, b) communication and
    enforcement of the policies, c) constant monitoring and testing of the plans,
    and d) continuous assessment of security plan performance. Each of these cybersecurity
    readiness success factors (Figure 24) is discussed in the following sections.


    ![](img/0b22c0cfcb4e18d40f800925f47e42eb_167_0.png)


    # 7.1 Information Security Governance Policy


    Organizations with a deliberate and thorough approach will have a clearly documented
    information security policy. This policy document should articulate the scope
    and goals of the company’s information security'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'strategy; how the strategy aligns with the overall organizational strategy,
    roles and responsibilities; information classification (from a confidentiality
    and sensitivity standpoint); directives for secure handling and protection of
    data; consequences for noncompliance; and more.¹


    Adhering to cybersecurity and data privacy laws should be a major goal of information
    security governance. The Health Insurance Portability and Accountability Act (HIPAA)
    of 1996, the California Online Privacy Protection Act of 2018, Consumer Privacy
    Protection Act of 2017, and the European Union’s General Data Protection Regulation
    of 2018 are representative of many data privacy–related legislations. Working
    in collaboration with the legal department, the policy formulation team must identify
    the legal obligations and requirements spelled out by the various legislations
    and must put in place appropriate security controls. Appendix 4 provides a summary
    overview of cybersecurity and privacy laws and regulations.


    Yoti, a cybersecurity solutions developer, grapples with the challenges of ensuring
    privacy of individual user data. They have implemented a range of measures to
    securely collect and store data. As part of due diligence, the company has consulted
    with international experts on human and consumer rights to guide the development
    and implementation of their data security policy.²


    The policy document should also clarify the roles and responsibilities of the
    organization’s personnel and its external partners. Within the organization, especially
    in large and professionally managed firms, the information security function will
    be headed by the chief information security officer (CISO) and will include personnel
    holding job titles such as directors, senior managers, and security professionals.
    Data owners, data custodians, end-users, and auditors are other roles that come
    with information security responsibilities.


    Considering the growing use of third-party service providers, it is imperative
    that they be held to the same standard and expectations as the internal employees.
    Cybersecurity laws and regulations relevant to the organization and its implications
    on standards and practices must also be clearly spelled out in the information
    security policy manual. Formalized processes and procedures to manage cybersecurity
    risks and thereby accomplish the stated goals and mission must also be part of
    the policy documentation.


    The standard elements of a comprehensive information security governance policy
    document include a) purpose, b) scope, c) objectives, d) authority and access
    control policy, e) asset and data identification'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'and classification, f) roles and responsibilities, g) security awareness and
    training guidelines, h) vendor selection criteria, i) service level agreement
    guidelines, j) performance measures, and k) rewards and penalties.³


    By providing a blueprint and road map to cybersecurity governance, such a policy
    document enhances overall awareness, transparency, and execution consistency and
    effectiveness. Security standards, baselines, guidelines, and procedures should
    also be crafted for effective implementation of the policies.


    Following is a checklist to guide the formulation and documentation of a robust
    information security governance policy.


