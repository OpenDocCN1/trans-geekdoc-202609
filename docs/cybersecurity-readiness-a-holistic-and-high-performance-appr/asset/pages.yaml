    onto the victim’s device as soon as the user visits the malicious site. The victim
    may not even know that it is a hacker-controlled site. Links to such sites are
    sent through email attachments, text messages, and social media posts.


    **SQL injection** is another type of attack vector whereby a malicious code is
    used to manipulate backend databases to access sensitive data. More specifically,
    as shown in Figure 9, it is a code injection technique in which malicious SQL
    statements are inserted into an entry field for execution. The SQL server does
    not recognize the malicious input and reads it as programming code. Poorly designed
    web applications, with vulnerabilities in the application’s database management
    system, are candidates for such attacks.


    SQL injection attacks allow attackers to become administrators of the database
    server and thereby be in a position to steal identity information, void transactions,
    change balances, delete data, and publish all the data.²³


    Another form of malware injection is **cross-site scripting (XSS)**, where malicious
    code is injected into reputable websites. The attacker uses a web application
    to send malicious code, generally in the form of a browser side script.²⁴ As shown
    in Figure 10, the victim’s device gets infected with the malicious code as soon
    as they interact with the compromised website. This malware injection method is
    able to circumvent the Same Origin Policy; that is, scripts originating in one
    website cannot interact with scripts from another site. It is designed to take
    advantage of the inability of browsers to differentiate between valid and attacker-controlled
    markup. The XSS technique “exploits the vulnerability of a website the victim
    visits and gets the website to deliver the malicious script for the attacker.”²⁵'
