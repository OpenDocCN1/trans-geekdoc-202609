- pgno: 308
  md: '# Yoti: Responsible Innovation in Cyber Security


    A Business Case by Katharina Jarmai, PhD and Barbara Stacherl


    # Abstract


    This case demonstrates how the concept of responsible innovation is practically
    applied in a cyber security company. It first outlines the work and context of
    cybersecurity companies and provides an introduction to the concept of responsible
    innovation. It then describes how Yoti Ltd. was founded with ethics and security
    considerations at the heart of the company, and how it puts an emphasis on data
    responsibility, transparency, consumer trust, and stakeholder collaboration. The
    case provides students with a real-world example of how elements of responsible
    innovation can be integrated into core business activities. Readers are challenged
    to find ways in which Yoti could deal with the danger of criminal misuse and the
    risks of future data privacy legislation that could undermine their business model.


    # Case


    # Learning Outcomes


    By the end of this case study, students should be able to:


    +   1. analyze the characterizing features of the cybersecurity sector and understand
    how these are connected to the concept of responsible innovation;

    +   2. understand how the concept of responsible innovation is practically applied
    in the context of small and medium-sized enterprises (SMEs);

    +   3. illustrate the value of integrating ethical considerations into innovations
    in the information and communication technology (ICT) sector; and

    +   4. assess whether a cybersecurity company''s practices that particularly target
    doing business responsibly foster profitability, and if so in what way.


    # Introduction


    In the past decades, a vast amount of technological advancement and digital innovation
    has come about in ICT industry, connecting people in different places of the world
    and facilitating everyday life. The storing and'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'further usage of large amounts of data have enabled the development of sophisticated
    software, programs, and networks. These changes have been accompanied by the emergence
    of, and an increase in, cyber threats and digital innovations that counteract
    privacy and security principles.


    The concept of responsible innovation aims at aligning innovation processes and
    outcomes with societal values, needs, and expectations, while at the same time
    minimizing potential negative impacts on society and the natural environment.
    To achieve responsible innovation, it is considered crucial to involve a diverse
    set of stakeholders in idea generation and development processes, and implement
    ethical standards that exceed compliance with existing laws and regulations. Yoti
    is a cybersecurity company that has developed its business model integrating those
    principles into its core operations. Thus, it can be argued that Yoti is an example
    of how the concept of responsible innovation can be applied in an SME context
    in order to anticipate consequences, minimize risks, and maximize beneficial outcomes
    of innovations.


    # Cybersecurity


    Cybersecurity is a crucial branch of the ICT sector. It is concerned with various
    kinds of security challenges that arise from innovations, and their application
    and possible misuse within the ICT industry. Challenges such as the right to be
    forgotten, cybercrime and cyber threats, the vast amount of data produced and
    used as part of the digitalization process, and, last but not least, privacy and
    trust issues that result from all of these factors render cybersecurity companies
    vital to other businesses.


    In that context, cybersecurity companies guard digital identities and user privacy,
    and defend against cyber crime. They cover a variety of focus areas: traditional
    cybersecurity (protection, penetration testing, security, etc.), education provision,
    digital identity provision, and cybersecurity infrastructure. Given that they
    often store sensitive data, a considerable amount of attention must be paid to
    privacy and trust concerns, which are a characterizing feature of the cybersecurity
    sector. Robust measures that ensure a secure handling of data and protection against
    hackers and fraudsters are of particular importance for cybersecurity companies.


    Resulting from these special features of the cybersecurity sector, there are three
    major challenges that cybersecurity companies face:


    +   - privacy dilemma;

    +   - expectation to “do good”; and

    +   - fast and numerous innovations.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Privacy Dilemma


    One of the distinctive features of cybersecurity companies is that they hold personal
    information, which their clients expect to remain personal—that is, private and
    inaccessible to third parties. This means that cybersecurity companies have particular
    contractual commitments toward their clients that function at a high level of
    trust. It is possible, however, that circumstances arise in which a cybersecurity
    company is under legal or moral obligation to provide access to their stored customer
    data to authorities, creating a dilemma for a company that is contractually bound
    to ensure privacy. This challenge becomes pressing especially with regard to countries
    or situations where governments’ interference into personal privacy is disconcerting.
    Cybersecurity companies are working on solutions that allow them to guarantee
    privacy, but not under all circumstances.


    # Expectation to “Do Good”


    Cybersecurity companies are closely connected to the ICT industry, and the associations
    and promises that this sector holds. In addition to protecting individual and
    corporate rights, cybersecurity firms may aspire to transform the lives of their
    clients through connecting them and enabling virtual interaction. In this way,
    they face the challenge of running a business while at the same time providing
    social benefits.


    # Fast and Numerous Innovations


    The third major challenge for the cybersecurity sector arises from the nature
    of the ICT sector itself, being fundamentally different from other industries
    with respect to change within the sector. Frequent innovations, constant change,
    and rapid developments within the ICT sector are interrelated with a continuous
    occurrence of cyber threats. This industry characteristic requires cybersecurity
    companies to be highly flexible, responsive, and reactive, and makes the speed
    of innovation a crucial determinant for success. As well as fighting for customers
    and market shares, these firms simultaneously engage in a constant fight against
    cyber threats.


    In this context, ethics are an integral concern in the cybersecurity sector. When
    it comes to innovation in the industry, acting carefully and responsibly is not
    only desirable, but also necessary.'
