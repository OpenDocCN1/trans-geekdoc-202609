  md: 'shipping and logistics service providers, government agencies, automotive manufacturers,
    and telecommunication and gas companies.


    The **spyware** malware is designed to spy on the victim’s computer and online
    activities. This type of malicious software, installed without user consent, is
    capable of recording every keystroke and surfing history and sharing the same
    with hackers and other interested third parties. **Keyloggers** is a type of spyware
    that focuses on capturing every keystroke and thereby gaining access to login
    credentials and other confidential information. They are also capable of taking
    screenshots of sites visited by a user during a browsing session. When the focus
    of the software is to covertly gather user purchasing interests, preferences,
    and behavior, and sharing the same with marketing and advertising firms, the spyware
    is known as **adware**. Other forms of spyware are capable of hijacking a browser
    and pointing it to a rogue website or get your device to automatically place calls
    and send texts.


    # 2.3.2 Malware Distribution Methods and Channels


    The different types of malware payload can be distributed using different methods
    and techniques such as phishing, man-in-the-middle (MITM), drive-by-download,
    SQL injection, cross-site scripting (XSS), and denial-of-service (DoS) attacks.


    **Phishing** attacks are probably the most common type of attack vector that targets
    the weakest link in the cybersecurity defense system—the humans. The hackers are
    able to dupe victims to open an email attachment or a link to a website, and such
    actions lead to installation of malware (or malicious code) that allows the criminals
    to gain access to login credentials and break into servers containing sensitive
    data. Figure 4 depicts a spoofed email that is sent to members of a university
    community. If any one of the users were to follow through with the instructions
    and click on the link to renew their password, they would land on a bogus website
    that would resemble a genuine password renewal site. Once the user would complete
    the renewal process and hit the submit command, they would have inadvertently
    shared their login credentials with the hackers.


    **Spear phishing** is a type of social engineering campaign where the email appears
    to originate from a legitimate source within an organization. For instance, when
    an employee receives an email that seems to be coming from their peer or supervisor,
    they are likely to open it. Government-sponsored hackers are known to carry out
    such attacks. As depicted in Figure 5, once one of the targeted users falls for
    the phishing attack, a remote access Trojan (RAT) malware gets installed on the
    target computer. The RAT allows the hackers to gain administrative control and
    engage in a range of activities from accessing confidential data to activating
    a system’s webcam and recording'
