  md: '# Case Study 4


    # Yoti and Responsible Cybersecurity Innovation


    # Introduction


    The Yoti case highlights the importance of acting carefully and responsibly when
    engaging in cybersecurity innovation activities. These organizational values and
    traits are centric to cybersecurity preparedness. As discussed in Chapter 5, in
    the section on Joint Ownership and Responsibility, information security professionals
    are expected to abide by the principles of Due Care and Due Diligence. They must
    do everything within their power and authority to protect confidential data and
    that includes complying with security regulations, adhering to privacy principles,
    and following information security best practices.


    As a provider of a digital identity platform to authenticate individuals and businesses,
    Yoti gathers a lot of personally identifiable information. The company must honor
    the trust of their users and clients by taking every possible precautionary measure
    to secure the sensitive data. Chapter 3 discusses some of the Generally Accepted
    Privacy Principles (GAPP) that are extremely important for organizations such
    as Yoti. For instance, the minimization principle suggests that companies gather
    the minimum amount of information needed to conduct their business activities.


    Another of the GAPP guidelines is to take every possible step to secure the collected
    data from unauthorized access. Chapter 6 provides guidance on the various methods
    of data security, from encryption to strong access controls, multifactor authentication,
    and adhering to the policy of Least Privilege. In addition, organizations should
    comply with the industry and legislation guidelines on data retention and purge.


    Organizations such as Yoti can also benefit from following the information security
    discipline guidelines laid out in Chapter 7. Continuous monitoring of threats,
    conducting penetration testing, and real-time security audits are representative
    of a meticulous and disciplined approach to mitigating cyber risks.


    —Dave Chatterjee'
