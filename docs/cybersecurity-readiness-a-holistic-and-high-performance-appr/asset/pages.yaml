  md: '# Alaska''s Department of Health and Social Services

    Again Falls Victim to a Cyberattack


    Alaska''s Department of Health and Social Services (ADHSS) suffered a significant
    data breach when an employee unsuspectingly clicked on an email attachment that
    seemed legitimate. The malware that got installed on the employee''s laptop was
    a variant of the Zeus/Zbot Trojan virus and is designed to steal information.
    The unauthorized software gave the attackers access to the laptop between April
    26 and April 30, 2018, and allowed them to steal electronic protected health information
    (ePHI). The sensitive data included first and last names, dates of birth, phone
    numbers, Medicaid/Medicare billing codes, criminal justice information, health
    billing information, Social Security numbers, driver''s license numbers, pregnancy
    status, incarceration status, and other confidential information. Between 500K
    to 700K individuals were affected by the breach.


    Preliminary investigation revealed that the virus was able to bypass multiple
    layers of security and get the infected laptop connected to Russia-based IP addresses.
    The antivirus (AV) software could not detect the malware because it was a day
    one attack, i.e., it was carried out before the AV software could be updated with
    the Trojan''s signature.


    The Federal Bureau of Investigation (FBI) is still examining the nature and extent
    of the breach and the associated violations of the Health Insurance Portability
    and Accountability Act (HIPAA) and the Alaska Personal Information Protection
    Act (APIPA). Incidentally, this agency experienced another data breach in 2009
    and was found guilty of a HIPAA violation. A penalty of $1.7 million was imposed
    due to "failure to conduct a comprehensive risk analysis to identify vulnerabilities
    that could be exploited to gain access to PHI, insufficient device and media controls,
    and a lack of staff training on data security."


    The focus of detection processes and mechanisms needs to be on the three cardinal
    goals of information security—protecting confidentiality, ensuring integrity,
    and maintaining availability. Every effort must be made to prevent unauthorized
    access, insulate sensitive data from destruction, modification, or degradation,
    and ensure that systems are up and running and providing timely information to
    authorized personnel.75


    A mature cyber intelligence gathering process is comprised of four phases: planning,
    collection, processing and analysis, and dissemination.'
