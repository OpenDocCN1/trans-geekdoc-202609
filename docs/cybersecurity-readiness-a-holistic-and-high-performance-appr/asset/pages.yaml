- pgno: 13
  md: '# Foreword


    The evolution from the early days of information security to today’s cybersecurity
    teams provides a varied and rich history of challenges, successes, and failures.
    As the systems used by society, businesses, and governments increase reliance
    on technology, we also see the opportunities for threat actors to take advantage
    of weaknesses in these systems or the people who regularly use or maintain these
    systems.


    In the 1980s we got our first taste of cybersecurity challenges when the so-called
    Morris Worm was released by a student at MIT targeting vulnerabilities in Unix
    systems, and resulting in several days of disruption on the nascent Internet.


    Further historical events led to more lessons. Active virus and malware (e.g.
    rootkits) development competed with antivirus makers and showed the limitations
    and challenges with signature-based detections. The Code Red (2001) and SQL Slammer
    (2003) worms reinforced the need for active patch management programs to apply
    system updates, as well as demonstrating the need for network defenses such as
    firewalls and intrusion prevention systems. 2015 saw the compromise of the Ukrainian
    power grid, later attributed to Russian actors, demonstrating both the weaknesses
    in SCADA and critical infrastructure systems, as well as providing a look into
    the future of cyberwarfare.


    As the attacks and technologies have changed, so have the approaches. Cybersecurity
    practices have evolved from a set of philosophies to more active and proactive
    approaches. Concepts such as defense-in-depth, principle of least privilege, change
    management, and access control are necessary and required building blocks for
    good cybersecurity programs. The NIST Cybersecurity Framework and Center for Information
    Security provide roadmaps and approaches to help organizations prioritize and
    build strong cybersecurity programs. However, what is missing is an approach to
    building a cybersecurity culture within an organization, permeating all aspects
    of that organization. Dr. Chatterjee’s book provides actionable recommendations
    to create and sustain a high-performance information security culture.


    A key area of concern for organizations is the human element. Social engineering
    attacks, including phishing, have taught us that attackers can and will bypass
    the best defenses easily when targeting a human. Technology and tools alone cannot
    secure an organization; rather, security must be seen as a shared value and culture,
    and all members of the organization are accountable and have a role to play.'
  merge: -1
