    # 6.2.9 Awareness and Training


    Humans continue to be the weakest cybersecurity link. As one security analyst
    puts it, “The system is only as secure as its weakest link, and that is very often
    its people.”62 They are the target of phishing and ransomware attacks, the predominant
    cause for breaches.63 While email is the most popular medium for launching phishing
    attacks, hackers are also deploying other means (such as AI-enabled phone scams,
    social media, pop-ups, ads, instant messaging, browser extensions, and freeware)
    to get employees to share their access credentials.64


    There are numerous breach incidents where hackers were able to compromise employee
    credentials via different forms of phishing campaigns. The eBay attack is one
    such example and is discussed in the following vignette.


    # A Phishing Attack on eBay


    In May 2014, eBay requested 145 million users to change their passwords because
    of a breach discovered earlier in the month. Though no financial information was
    compromised, hackers did steal encrypted passwords and other personal account
    details such as names, emails, physical addresses, phone numbers, and birth dates.
    Evidence suggests that the attackers gained access using the credentials of three
    corporate eBay employees between late February and early March.65


    Customers complained about the delay in notification about the breach. Emails
    about the breach and recommended password changes reached customers a few weeks
    after the global e-commerce corporation discovered the incident. In defense of
    eBay, it is quite common for an attack on large companies to go unnoticed for
    weeks due to a lack of obvious clues. Additionally, investigators advise companies
    to refrain from disclosing information before fully understanding the extent of
    the attack.


    (Continued)'
