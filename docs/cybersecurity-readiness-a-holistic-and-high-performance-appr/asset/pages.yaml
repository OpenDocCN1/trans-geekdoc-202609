- pgno: 116
  md: 'An appropriate asset classification scheme should be in place to prioritize
    the level and extent of protection. In military organizations, the classification
    levels are top secret, secret, confidential, and unclassified. Highly sensitive,
    sensitive, internal, and public are classification labels used by many business
    organizations. The criteria for categorizing the sensitivity of data could include
    a) financial and other consequences from modification, loss, or exposure, b) usefulness
    of the data, c) age of the data, and d) cost of acquiring the data.15


    An information security–conscious organization must make a thorough effort to
    identify and inventory all physical systems and devices as well as software applications
    and platforms. It is considered a best practice to have a complete inventory and
    blueprint of the network; detailing the locations and specifications of all the
    devices—servers, workstations, laptops, desktops, and other communication and
    transmission devices—on the network.16 The hardware inventory records should reflect
    details such as network address, hardware address, machine name, owner and department
    name for each device, and whether the asset has received approval to be connected
    to the network. Software records should include the name, version, publisher,
    and install date.


    Hardware assets that are not connected to the networks must also be recorded from
    the standpoint of completeness. Recording of unauthorized assets will help in
    getting them removed or quarantined. Preferably, the authentication system, tied
    into the hardware device inventory data, should ensure only authorized devices
    are able to connect to the network. Client certificates should also be used for
    authenticating hardware devices on the network.


    Authorized and unauthorized software must be recorded, and the inventory list
