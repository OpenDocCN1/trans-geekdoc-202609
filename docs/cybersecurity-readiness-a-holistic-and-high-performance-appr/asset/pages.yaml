- pgno: 11
  md: '# Preface


    It often takes a major calamity such as the coronavirus pandemic to remind us
    of how vulnerable we are and the consequences of being underprepared. Seemingly
    secure and robust economies and companies have been brought to their knees by
    an invisible and unexpected enemy. Can we afford to be so reactive? Do we need
    major catastrophes to serve as wake-up calls on being proactive and thorough in
    our approach to preparedness? The consequences of cyberattacks can be equally
    devastating, especially if nuclear sites, power grids, water filtration plants,
    and other critical infrastructure resources are compromised.


    This book is motivated by the need to encourage and aid organizations to take
    a proactive, deliberate, and conscientious stand on cybersecurity. While most
    organizations are not in the business of securing data and digital assets, protecting
    such assets is critical to survival and success in today''s highly digitized and
    connected environment. With rapidly expanding attack surfaces and evolving attack
    vectors, organizations are in a perpetual state of breach and have to deal with
    this existential threat. Cybersecurity readiness is a critical and distinctive
    competency, and this book is intended to help organizations develop and enhance
    this capability. It is written with current and future practitioners in mind as
    individuals continue to be the strongest and weakest link of a cyber defense system.
    The overall goal of the book is to enhance cybersecurity awareness and preparedness
    among individuals and organizations.


    To effectively prepare and respond to the ever-increasing and evolving cyberattacks,
    organizations must not only have a comprehensive plan but also execute that plan
    with great precision and consistency. This book draws upon high-reliability organization
    principles to identify characteristics and traits associated with a high-performance
    information security culture. It presents a set of seventeen cybersecurity readiness
    success factors uncovered from analyzing primary and secondary data gathered over
    several years.


    I sincerely hope you will find the book useful. It is the latest outcome of a
    cybersecurity journey that has been quite enlightening. I have been studying this
    phenomenon for nearly a decade; I have authored and edited scholarly papers, consulted
    with companies, served on a cybersecurity SWAT team with chief information security
    officers (CISOs), conducted workshops and webinars, given expert radio and television
    interviews, and delivered numerous talks at academic and practitioner forums around
    the'
