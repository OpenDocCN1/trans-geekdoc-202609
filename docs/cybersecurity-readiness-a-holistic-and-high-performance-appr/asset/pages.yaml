  md: "Securing ports and associated services entails a multipronged approach that\
    \ includes use of approved ports and protocols, regular automated scans to detect\
    \ unauthorized ports, use of filtering tools with a default-deny rule to block\
    \ unauthorized traffic, and implementation of application firewalls in front of\
    \ critical servers. Lack of a proper firewall was identified as a potential reason\
    \ for the breach of Bangladesh Bank’s computer systems and the embezzlement of\
    \ 81 million dollars.²⁷\n\nArtificial intelligence (AI)–driven next-generation\
    \ firewalls deliver proactive threat protection with high-performance inspection\
    \ of traffic. Use of such solutions achieves the dual goals of protection without\
    \ costly downtime and unsatisfactory user experience. Fortinet, Palo Alto Networks,\
    \ Cisco, and Checkpoint are some of the many service providers that offer such\
    \ firewall capabilities.\n\nOrganizations should also consider adopting a single\
    \ door serial layered approach to network security. This is a relatively foolproof\
    \ protection method where a threat has to deal with multiple controls one after\
    \ another. In comparison, a multidoor parallel scenario is more vulnerable as\
    \ the attack vector could possibly sneak in through a less secure access point.\n\
    \nFollowing is a set of questions to assist organizations in effectively securing\
