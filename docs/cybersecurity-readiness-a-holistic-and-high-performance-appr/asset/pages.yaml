  md: '# 6.2.5 Managing Removable Media


    Protecting removal media (e.g., USB drives, SD cards, and optical media) is an
    integral and key component of an organization''s cybersecurity preparedness program.
    Numerous and devastating cyberattacks have been launched by compromising portable
    media. Dark Tequila, a malware that has been targeting banks and consumers in
    Mexico since 2013, was spread through USB devices. Hackers like to use USB devices
    to attack networks not connected to the Internet; the Stuxnet campaign in 2009
    and 2010 that targeted Iran''s nuclear facilities was launched through USB devices.
    Norsk Hydro, a Norwegian aluminum manufacturer, was a recent victim of a ransomware
    attack that cost the company millions. The perpetrators were able to launch this
    attack by infecting just one portable device. According to industry reports, 25%
    of malware is spread through USB devices. Thus, transient cyber assets—devices
    that are not connected to the network all the time—are a major information security
    vulnerability for organizations.28


    Many companies, such as IBM, have banned the use of all USB drives and other portable
    storage devices; employees are encouraged to use cloud-based data file sharing
    and storage services. Other not-so-extreme measures include disabling auto-run
    on optical and USB drives, restricting usage on certain devices, using a standalone
    virus scanning PC, and educating users. There should be a policy in place clearly
    documenting how portable devices will be protected, and a monitoring process must
    be in place to ensure compliance.29


    Following is a set of questions to help establish a checklist for managing removable
    media.


    # Managing Removable Media: Guiding Questions


    +   1. Is an inventory of removal media and portable devices maintained and periodically
    reviewed and updated?

    +   2. Are policies in place to govern usage of portable storage devices?

    +   3. Are auto-run features disabled on optical and USB drives?


