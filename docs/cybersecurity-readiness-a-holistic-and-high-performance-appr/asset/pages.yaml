  md: '# ### 6.1.2 Cyber-Risk Assessment


    Exemplar organizations will factor in cyber-risk implications alongside other
    risks when making prioritization decisions on what digital assets to protect and
    which initiatives to undertake. They adopt a systematic and meticulous approach
    where they a) identify risks and tolerance levels, b) evaluate likelihood of occurrence
    and potential impact, c) assess strategic and operational initiatives by examining
    risk implications, and d) take preemptive action to mitigate the risks.⁸


    Risks that organizations encounter can be categorized in different ways. One such
    classification would include financial, brand and reputation, environmental, legal,
    people, technology, and systems risks. A sample rubric for scoring the impact
    of any organizational initiative or project on the different risk types is presented
    in Table 4 (see on pg 82). The likelihood of occurrence of such risks and the
    organization’s tolerance level is presented in Figure 16 (see on pg 83).⁹


    To explain how the risk evaluation system will work, let’s consider the four initiatives
    described in Table 5 (see on pg 84).


    *Initiative 1*, implementing and leveraging a customer relationship management
    (CRM) system, is assumed to have a risk score that places it above the risk tolerance
    level set by the organization. So, the organization has a choice of either pursuing
    or abandoning the project. If the decision is to go ahead with the project, the
    preemptive risk mitigation strategies would include: a) using strong hashing algorithms
    to encrypt customer data; b) establishing robust access controls; and c) regular
    monitoring and testing.


    *Initiative 2* is about enhancing operational efficiency by implementing an enterprise
    class resource planning system (ERP). Such ERP implementations are fraught with
    challenges and delays and not many organizations are successful in effectively
    assimilating and deploying them. Let’s assume this initiative also falls beyond
    the organization’s risk tolerance level, and compared to initiative 1, the probability
    of occurrence of the anticipated risks are higher. If the organization still decides
    to persist with initiative 2, the proactive risk mitigation strategies would be
    similar to those recommended for initiative 1.


    *Initiative 3*, the artificial intelligence (AI)–driven precision manufacturing
    initiative, is well within the risk tolerance level and is relatively safe bet
    for the organization to pursue. Once again, the recommended cyber-risk mitigation
    action plan entails securing the data, network, and systems, along with rigorous
    monitoring and testing.'
