    Annual Cybersecurity Report:


    +   - “More than half of businesses surveyed that had their data breached were
    subjected to public scrutiny as a result.

    +   - 29% of businesses that were breached lost revenue; 38% of those lost more
    than 20% of their revenues.

    +   - 23% of businesses lost business opportunities after a cyberattack; 42% of
    those lost more than 20% of their potential new business.

    +   - 22% of businesses that suffered a cyberattack lost customers; 40% of those
    lost more than 20% of their customers.”31


    Sixty percent of small- and medium-sized businesses (SMBs) are known to go out
    of business within six months of being hacked.32


    Equally concerning and devastating are attacks on state and government agencies
    and critical infrastructures and public service resources. The WannaCry attack
    launched in 2017 crippled more than 230,000 computing systems in 150 countries
    and caused financial losses estimated at approximately $4 billion. Britain’s National
    Health Services was one of the major national infrastructure organizations hit
    by this attack. Its services were significantly hampered and disrupted; for instance,
    “20,000 appointments got cancelled as hospitals and clients were forced offline.”33


    In March of 2018, the City of Atlanta suffered one of the largest and most expensive
    ransomware attacks, costing upward of $17 million. During the early morning hours
    of March 22, 2018, the city and its agencies’ systems and networks were brought
    to a screeching halt by the attack. The extortionists were able to successfully
    cripple several critical systems, thereby forcing many of the agencies to operate
    manually. Law enforcement was forced to write incident reports by hand and lost
    access to in-vehicle video footage. Utilities departments and municipal courts
    could no longer accept payments and fines online. In-person payment of water bills,
    renewals of business licenses, and payment of parking tickets and traffic fines
    became the new order of business. The wireless network at Hartsfield–Jackson Atlanta
    International Airport, one of the nation’s largest and busiest airports, was turned
    off for a couple of weeks for precautionary reasons.34


    The Ukrainian power grid was compromised in 2015 and 2016, causing power disruption
    for several hours. Although the inconvenience wasn’t major, the real concern lay
    in the ability of the attackers to successfully break into the computer-controlled
    operational environment. More'
