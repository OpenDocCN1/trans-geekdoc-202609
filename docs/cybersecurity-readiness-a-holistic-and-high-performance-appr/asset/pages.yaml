  md: 'access to sensitive data. Such a policy mandates that by default each user
    will have bare minimum access to the data needed to perform their respective roles.


    # EMail Domain Restrictions.


    Yet another effective way of preventing data leaks is by placing restrictions
    on email domains that employees have access to; thereby, the organization is able
    to minimize the probability and risk of sensitive data (being shared via attachments)
    falling in the wrong hands.


    # Managing Personal Device Usage.


    Placing restrictions on how employees can use their personal devices at work is
    also an important element of data leak prevention strategy. In many organizations,
    employees cannot have access to corporate systems and data from their personal
    devices. In other organizations, two different environments are created within
    the same mobile devices, one storing personal data and apps and the other hosting
    enterprise data and apps. By allowing employees to create dual personas, organizations
    are able to achieve the dual goals of keeping employees happy by allowing use
    of their preferred mobile devices and also being able to secure and remotely monitor
    corporate data and applications.⁴⁶ Requiring usage of strong passwords, automatically
    locking out access when incorrect password is used a few times (typically three
    or more), and remotely wiping off sensitive data and applications when the device
    is lost, stolen, sold, or sent to a third party for repairs are some other best
    mobile device security best practices.⁴⁷ Mobile device users must also be required
    to use a virtual private network (VPN) connection to access corporate systems
    and data and a dual-factor authentication (DFA) mechanism must be in place. Performing
    regular backups of data stored on mobile devices is also a critical data security
    measure.


    # Managing Data-in-Transit Visibility.


    Maintaining visibility of data-in-transit is critical from the standpoint of monitoring:
    authorized personnel need to know where the data is going or coming from, both
    within and outside the organization. A recommended best practice is to adopt a
    managed file transfer (MFT) platform that would not only provide complete visibility
    but also protect data in transit or at rest, provide tracking and audit capabilities,
    enable data wiping and sanitization, set and monitor security standard violation
    alerts, and generate compliance reports.⁴⁸


    # Creating Employee Awareness.


    Creating employee awareness about the consequences of data leaks and how such
    leaks can be prevented can help mobilize support that is essential for the other
    elements of the data security plan to be successful. More details on how to effectively
    enhance awareness is discussed in a subsequent section on awareness and training.'
