- pgno: 154
  md: 'The ability to a) quickly identify and isolate affected devices and systems,
    b) expeditiously restore normal business operations, c) meticulously gather evidence
    and secure the attack domain for further investigation, and d) effectively communicate
    with various stakeholders—customers, employees, regulators, business partners,
    and investors—are some attributes of a highly prepared and response-ready organization.⁸³
    The next two subsections are devoted toward understanding how to develop and sustain
    incident response and disaster recovery capabilities.


    # 6.4.1 Incident Response Capability


    According to investigation reports, the massive Equifax breach was caused by the
    negligence of a senior management person who didn’t take necessary action upon
    receiving good intelligence. As discussed in Chapter 3, one of the lessons from
    the Equifax incident is to develop the discipline and routine of promptly reviewing
    intelligence reports and making informed decisions on whether to act or not.


    The effectiveness of an organization’s incident response capability (IRC) depends
    on many factors—from senior management commitment and mindset to organization-wide
    support, suitable governance structures and mechanisms, appropriate technology
    solutions, adequate resources, and well-trained personnel.


    Crisis management preparation must be driven by a top management mindset that
    recognizes cybersecurity to be more than an IT issue and requires the expertise
    and involvement of personnel from multiple functions and varied skillsets. Technical
    and forensic skills are essential to detect the source and cause of the cyberattack.
    Legal representation will guide organizational response from the standpoint of
    dealing and communicating with law enforcement, customers, employees, shareholders,
    regulatory agencies, business partners, and investors. Communications personnel
    must also be part of the cross-functional crisis management team to drive the
    messaging plan. Members from the various operating units will enlighten the crisis
    management team on the business implications of the attack. From a technology
    standpoint, both proactive and responsive tools must be available to the team
    to mitigate the possibility of similar attacks in the future. The personnel assigned
    to deploy, support, and maintain these tools must be well trained. If third-party
    services are going to be utilized, then the individual or team dealing with the
    external agency must have the experience and ability to provide strong oversight.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Thus, establishing a cross-functional incident response (IR) team is an important
    step from a governance standpoint. Roles, responsibilities, and reporting relationships
    must be clearly defined to ensure that everyone on the team knows what they are
    expected to do and when. Preferably, the IR team should be led by a senior business
    leader either operating at the C-level or reporting directly to a C-level executive.


    A step-by-step approach to dealing with threat incidents must be documented and
    rehearsed. For instance, the following is a generic set of actions that should
    be triggered following an incident:


    +   - Document the incident details such as who reported it, how it was uncovered,
    and who alerted the relevant personnel.

    +   - Investigate the cause of the incident and take immediate steps to prevent
    further damage.

    +   - Identify and isolate affected systems and/or devices.

    +   - Quarantine the area of the incident and the digital assets involved for
    evidence gathering by relevant authorities such as the Federal Bureau of Investigation
    (FBI).

    +   - Gather and analyze the evidence to get to the root of the cause and source
    of attack.

    +   - Strengthen network security and protocols, enhance monitoring, review and
    modify policies, and implement any other necessary measures to boost security.

    +   - Document the findings and the steps taken in response to the attack.

    +   - Promptly and clearly communicate with all affected stakeholders, regulatory
    agencies, and the general public.


    Many of the listed actions might need to be taken simultaneously and not necessarily
    in the order above. The established procedure must be periodically tested and
    modified on an as-needed basis. Measures to evaluate IR effectiveness must also
    be in place.


    Below is a set of questions to enable organizations assess and develop their ability
    to effectively respond to threats and attacks.'
  merge: -1
