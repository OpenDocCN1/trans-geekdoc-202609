  img_proc: true
- pgno: 90
  md: 'Not only is the reputation of the senior leadership on the line but also their
    jobs. The Equifax CEO, along with several other senior executives, resigned after
    a massive breach that compromised data on 143 million customers. Target Corp’s
    CEO and chief information officer (CIO) resigned after the company and its board
    of directors were sued by a shareholder for compromising the personal information
    of more than 60 million customers.⁹


    Legal sanctions in the form of stiff penalties and potential jail time should
    also motivate top management to actively engage in securing strategic assets.
    To further bolster information security governance, Senator Ron Wyden of Oregon
    introduced the Consumer Data Protection Act (CDPA) bill that proposes jail time
    of up to 20 years for executives who are found guilty of gross negligence—“knowingly
    signing off on incorrect or inaccurate annual certifications of their companies’
    datasecurity practices.”¹⁰


    Appendix 4 provides a summary of the sanctions and penalties associated with the
    different cybersecurity and privacy laws and regulations.


    A survey of the National Association of the Board of Directors (NACD) found the
    majority of respondents recognizing the adverse impact of cyberattacks not only
    on stock prices but also on the reputation of the company and its board of directors.¹¹


    Though the bar for convicting a board of directors is quite high, that does not
    absolve board members from their responsibility of providing informed oversight.
    There is a growing recognition that


    > cybersecurity can no longer be the concern of just the IT department. Within
    organizations, it needs to be everyone’s business—including the boards.¹²


    When top management proactively takes every possible precaution to protect sensitive
    data because it is the right thing to do and not because there is a legislative
    requirement, that’s when the organization takes a huge step forward in earning
    customer confidence and trust.


    The senior leadership needs to support every aspect of cybersecurity governance—from
    strategic planning to education and training, hiring of talent, mobilizing organization-wide
    support, instituting appropriate roles and responsibilities, and remediating vulnerabilities.
    They need to recognize that cybersecurity investment is a strategic priority,
    necessity, and competency.¹³ No stone should be left unturned, so the organization
    is able to effectively answer the question that stakeholders are likely to ask
    after a successful attack: “What did this institution do to prepare?”


    Following is a set of guiding questions to gauge the extent of top management
    involvement and support.'
