    should implement Domain-based Message Authentication, Reporting and Conformance
    (DMARC) policy and verification. All URL requests should be logged and reviewed
    to identify monitor, detect, and prevent malicious attacks. Finally, using sandboxing
    to analyze inbound email attachments and blocking of attachments that represent
    certain (unnecessary) file types are useful security vigilance measures.


