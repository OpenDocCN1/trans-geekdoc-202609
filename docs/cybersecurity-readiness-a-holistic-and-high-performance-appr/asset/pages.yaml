  md: '# CHAPTER

    6

    Preparedness


    Preparedness refers to an organization’s game plan and execution mechanism to
    secure five things: data, networks, devices, locations, and people. Time and again,
    organizations are found wanting in their level of preparation and face gross negligence
    charges in the court of law. According to experts, to seek legal restitution,
    the plaintiff organization must be able to prove it had strong multi-factor authentication
    (MFA) in place, robust authorization mechanisms, flawless auditing systems, and
    were in compliance with relevant laws and regulations.¹ This chapter provides
    guidance on adopting a systematic and thorough approach to information security
    management. It begins with a vignette that describes a major breach incident where
    Marriott International faced a class-action lawsuit and was charged with lack
    of preparedness and negligence.


    # The Marriott Breach That Exposed 500 Million Applicants and Customer Information


    On November 30, 2018, Marriott International suffered a massive data breach that
    compromised about 500 million customer records. Data ranging from customer contact
    information to passport numbers, payment card details, Starwood loyalty account
    information, and reservation information was accessed. While some of the personally
    identifiable information was encrypted, the company is not sure if the hackers
    also stole the decryption codes.²


    An IT company managing the Starwood guest reservation database detected the breach
    and informed Marriott on September 8.³ Further investigations revealed that a
    malware, a remote access Trojan (RAT), was on the Starwood IT system. This malicious
    code enables hackers to stealthily gain access to a system and then control the
    computer.


    One wonders how prepared Marriott was to deal with such attacks. Did it have a
    multi-factor authentication system in place? Did it regularly conduct penetration
    testing to detect and fix its vulnerabilities? Furthermore, (Continued)'
  merge: -1
  img_proc: true
- pgno: 106
  md: '> > (Continued)

    > >

    > > it took Marriott almost three months to acknowledge the breach and inform
    its customers. Not surprisingly, a federal class-action lawsuit has been filed
    against the company; the plaintiffs have claimed that “Marriott did not adequately
    protect guest information before the breach and, once the breach had been discovered,
    ‘failed to provide timely, accurate, and adequate notice’ to guests whose information
    may have been obtained by hackers.”⁴

    > >

    > > Honesty, transparency, and promptness are key to damage control and Marriott
    failed to exhibit those traits when dealing with this situation. According to
    one cyber expert, “The key to rebuilding confidence is to be ‘upfront, open and
    honest’ from the start: ‘This builds trust in a company.’”


    So, what does it take to achieve a high level of information security preparedness?
    This section draws upon research findings and information security management
    frameworks and standards such as National Institute of Standards and Technology
    (NIST), ISO 27001, and Payment Card Industry-Data Security Standard (PCI-DSS)
    to identify and discuss the success factors (Figure 15) associated with a highly
    prepared organization. These factors relate to four key dimensions of preparedness—identify,
    protect, detect, and respond and recover.


    # 6.1 Identify


    The identify phase of the security preparedness process entails review, reflection,
    and assessment of an organization’s role and purpose, risk tolerance and exposure
    levels, and types of vulnerabilities. Each of these elements is discussed in the
    following subsections.


    # 6.1.1 Organizational Role Recognition


    An effective cybersecurity strategy cannot be created in a vacuum. It must be
    developed in relation to the organization’s role in the broader business environment.
    For instance, public and public-sector organizations that support critical infrastructure
    services (such as water, energy, financial services, health care, and transportation)
    must be extra vigilant and take a very responsible and thorough approach to cybersecurity
    preparedness. Especially those industries that rely on industrial control systems
    (ICS) and other operational technologies are extremely vulnerable to nation-state
    attacks conducted by well-funded and skilled teams of cybercriminals.'
