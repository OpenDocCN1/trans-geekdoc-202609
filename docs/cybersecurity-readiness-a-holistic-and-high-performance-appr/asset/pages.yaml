    # 3.8 Anthem Breach

    Affects 78.8 Million People


    Anthem Inc., one of the largest U.S. healthcare insurance providers, was breached
    on February 18, 2014, when an employee of one of its subsidiaries became a victim
    of an email phishing attack. Opening the email led to downloading of malicious
    files, and the hackers were able to gain remote access to the user''s computer.
    From that computer, the attackers were able to move laterally and penetrate dozens
    of other systems including the company''s data warehouse. Approximately 78.8 million
    unique customer records were compromised and personally identifiable information
    (PII)—names, birthdays, social security numbers, street addresses, email addresses,
    and employment information—was stolen.29


    According to investigation reports, the large-scale attack was caused by a foreign
    nation-state. Anthem became aware of the breach on January 27, 2015, and made
    a public announcement in early February 2015. It is quite concerning that the
    company was unaware of the attack for a year. Equally concerning was the delay
    in notifying all the victims. In March 2015, Joseph Swedish, Anthem president
    and CEO, received a letter from the U.S. Health Committee, asking him to notify
    all 78.8 million potentially impacted customers. The letter, written by the chairman
    of the Health Committee and ranking member, stated that “while we appreciate your
    efforts to keep our Committee informed of your efforts to respond to the attack
    after you became aware of it, we are troubled by Anthem''s delay in notifying
    these 78.8 million Americans.” On the positive side, the investigation also concluded
    the insurer had taken reasonable measures to protect sensitive data and was quick
    and effective in its breach response.30


    The financial consequences of the attack included $2.5 million for hiring expert
    consultants, $31 million to notify the victims, $112 million for'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'credit monitoring and protection services, and $115 million toward additional
    security measures.31


    Anthem took several important steps to boost security, such as implementing two-factor
    authentication on all remote access devices and tools, investing in a privileged
    account management solution, and adding enhanced logging capabilities to its security
    event and incident management solutions. The company also implemented superior
    monitoring solutions, replaced existing Network Admin IDs with new IDs, reset
    the passwords for all privileged account holders, and suspended remote access
    pending implementation of two-factor authentication.32


    # Lessons Learned


    Humans continue to be a significant vulnerability and are a popular target for
    hackers. Every effort needs to be made to mitigate the human risk factor. Continuous
    and customized training, frequent testing and assessment, rewards and incentive
    schemes, and fostering an employee-friendly culture are essential elements of
    a comprehensive approach to enhancing and sustaining employee skill sets and motivation.
    Sophisticated AI-enabled tools should be in place to continuously monitor all
    network access points and proactively detect and repel attacks. The monitoring
    system must be supported with a highly vigilant and responsive security team that
    will promptly review and act on the threat intelligence. Conducting penetration
    testing and security audits on a regular basis are also effective means of staying
    abreast of potential vulnerabilities. Finally, the incident response protocol
    needs to be well rehearsed and must include transparent and prompt communication
    with all stakeholders.


    As highlighted in Table 3, the review of breach incidents reveals several shortcomings
    ranging from gross negligence to lack of transparency, inadequate preparation,
    and poor communication. To effectively address these weaknesses, the organization
    must adopt a multipronged and holistic approach that encompasses people, process,
    and technology-related defense and control measures. Organizational values and
    beliefs as reflected in its culture are likely to influence the shaping, adoption,
    and sustenance of the security measures. The next chapter focuses on identifying
    the key dimensions and traits of a high-performance approach to information security.'
