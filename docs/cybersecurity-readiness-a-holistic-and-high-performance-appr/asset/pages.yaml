  md: 'Organizations that are seriously committed to proactively gather and act on
    operational, tactical, and strategic security intelligence have in place a Security
    Operations Center (SOC). The SOC team is charged with gathering threat intelligence
    data from various sources and acting on them. They are expected to keep the organization
    informed of threat urgency levels and guide appropriate action. This group is
    also entrusted with the responsibility of deciding on external service providers
    who would aid intelligence gathering, vulnerability testing, and defense activities.
    The selection process must be rigorous and service provider performance closely
    monitored and regularly reviewed.78


    With the advancements in artificial intelligence and big data analytics, today''s
    threat detection and response (TDR) solutions are quite sophisticated. By monitoring
    and mining network traffic and user behavior data, these tools are able to detect
    anomalies and abnormal patterns (which often go undetected by firewalls and antivirus
    software) and raise an alarm. When the automatic alert is triggered, the responsible
    security team personnel are able to evaluate the seriousness of the threat, eliminate
    false positives, and respond. The nature of response can range from conducting
    more in-depth forensic analysis to banning malicious files, quarantining affected
    devices, and stopping malicious processes.79


    Splunk''s on-premise and cloud-based Security Information and Event Management
    (SIEM) platform80 is representative of the state-of-the-art software solutions
    that leverage structured and unstructured data to offer security monitoring, advanced
    threat detection, incident investigation and response, and other security operation
    services.


    Considering the plethora of sophisticated detection tools, an organization must
    have a clear and deliberate plan on what to use and how to create an integrated
    technology architecture to optimize detection effectiveness.81 In the absence
    of a holistic plan, organizations end up with numerous and disparate tools and
    managing them becomes a challenge. Often the functionalities are overlapping with
    each tool offering certain types of detection capabilities, which range from endpoint
    detection and response, to network traffic analysis, to malware sandboxes, and
    cyber threat intelligence. According to cybersecurity expert and analyst J. Oltsik:


    > Each of these tools must be deployed, configured, and operated daily. Furthermore,
    each tool provides its own myopic alerting and reporting. Security analysts are
    then called upon to stitch together a complete threat management picture across
    endpoint security tools, network security tools, threat intelligence, etc.'
  merge: -1
  img_proc: true
