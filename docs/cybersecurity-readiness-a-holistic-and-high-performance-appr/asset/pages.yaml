- pgno: 125
  md: 'Many organizations will often rely on the configuration standards set by industry
    groups such as the Center for Internet Security.²² This resource provides access
    to detailed configuration settings for the different elements of the IT infrastructure
    such as operating systems, network devices, mobile devices, server software, web
    browsers, and other application platforms. While some companies adopt these standards
    as is and treat them as baseline benchmarks, others will suitably customize them.


    Through effective configuration management, an organization can ensure integrity
    of its technology assets and improve incident response effectiveness, disaster
    recovery, timely development of suitable software solutions, and compliance with
    policies and regulations.²³


    Lack of proper configuration of hardware and software can be, and has been, the
    cause of major breaches such as the ones suffered by Capital One and Equifax.
    Whether hosted/on-premise or remote, organizations should not rely on the default
    configuration set by the manufacturers or vendors. The factory or default settings
    are normally geared toward easy use and deployment—not security. The onus is on
    the user organization to become familiar with the different security settings
    and appropriately configure the devices. Considering there are numerous settings
    options, this is a complex and challenging task and needs to be carried out with
    great care and diligence. Even after establishing a strong initial security configuration,
    there must be a process in place to continually check the settings and avoid security
    “decay.” Device and software configurations and settings are often tweaked during
    updates and installations; they must be reset to their original high-level option
    upon completion of the install.


    In addition to conforming to approved configuration standards, secure images and
    templates of all system settings must be maintained for resetting purposes. The
    master images and templates must be stored on highly secure servers, and integrity-monitoring
    tools should be used to reduce the likelihood of unauthorized changes to the images.
    Organizations are strongly encouraged to use Security Content Automation Protocol
    (SCAP)–compliant configuration management tools to automate, verify, enforce,
    and monitor the security settings process. These tools also send out alert notifications
    when they detect unauthorized configuration activities and changes. Figure 20
    presents a screen shot of an audit summary generated by Tenable’s SCAP tool.'
  merge: -1
  img_proc: true
