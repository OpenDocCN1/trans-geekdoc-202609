  md: '# Foundations of the High-Performance Information Security Culture Framework


    Information security challenges are not going away. They have become part of the
    digital business reality, and organizations need to develop a mature and effective
    approach to mitigating such hazards. To effectively prepare and respond to these
    ever-increasing and evolving cyberattacks, organizations must not only have a
    comprehensive plan but also execute that plan with great precision and consistency.
    There is little room for errors or mistakes. Such errors can be catastrophic,
    especially for organizations and operations such as air traffic control systems,
    nuclear power plants, emergency room services in hospitals, assembly of aircraft,
    water purification plants, and nuclear naval operations.


    What are the key elements and characteristics of a relatively error-free and high-performance
    approach to cybersecurity governance? To answer this question, it is essential
    to delve into the role of culture in influencing organizational performance. For
    cybersecurity governance to be effective, organizational members must be willing
    to comply with the policy guidelines and the various control mechanisms. Research
    finds that positive compliance behaviors are dependent on cultural factors such
    as subjective norms, organizational values, and expectations.¹ “The company culture
    must emphasize and value cybersecurity” for organizations to sustain an effective
    and long-term defense campaign.²


    # 4.1 Organizational Culture and Firm Performance


    Organizational culture, in its various forms and manifestations, has been found
    to play a significant role in positively impacting firm trajectories and performance.³
    It has been likened to a foundation or anchor that binds together organizational
    members around a common vision, values, purpose, and beliefs.⁴ It has also been
    defined “as a mechanism by'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'which an organization and its members learn to both manage external challenges
    and achieve internal integration.”⁵ Leadership and management styles, strategic
    emphasis, structural alignment, and performance measurement systems emanate from
    the cultural orientation of an organization. Studies have found organizations
    with unique and inimitable cultures able to sustain competitive advantage over
    a long period of time.⁶ In the words of Lou Gerstner, former CEO of IBM, “culture
    isn’t just one aspect of the game—it is the game. . . . In short, businesses with
    high-performance cultures are winners.”⁷ Culture, defined as “shared values,”
    is featured at the core of the McKinsey 7-S framework for creating an intelligent
    organization.⁸


    Numerous empirical and case studies have found organizational culture to have
    a significant positive impact on performance. Both strength and content of organizational
    culture are found to be important predictors of strong performance.⁹ One particular
    study found the Developmental Culture type, characterized by flexibility and external
    orientation, to be the strongest predictor of performance, where product quality
    and innovation were the performance measures.¹⁰ The five cultural attributes—managing
    change, achieving goals, coordinating teamwork, building a strong shared culture,
    and focusing on customer satisfaction—were found to positively impact the performance
    of Air National Guards, a large public-sector organization.¹¹


    A comparative study found several cultural traits and characteristic associated
    with high-performing hospitals. Strong top-down command and control leadership
    style with a high level of commitment, clear and unequivocal lines of upward accountability,
    sophisticated information systems to support performance evaluation, heavy emphasis
    on employee training and development, and the ability to build strong external
    partnerships were some of the attributes of the culture in the high-performing
    hospitals.¹² In another empirical study involving insurance companies, a strong
    and adaptive organizational culture was found to positively impact asset and premium
    growth.¹³


    # 4.2 Organizational

    Culture and Cybersecurity


    Although the research on cybersecurity culture is still in its infancy, there
    is growing consensus that a techno-centric approach to information security governance
    is inadequate and myopic.¹⁴ Security experts and thought'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'leaders have expressed the view that “security can no longer be isolated as
    a technical problem with a technical solution; it must be prioritized as a critical
    business concern.”15 A deeper, more holistic, and human-centered approach, anchored
    in culture, is essential to tackle cybersecurity-related hurdles and challenges.16


    Several studies have been conducted to determine ideal forms of organizational
    culture that are supportive of information security management goals.17 There
    are others that have focused on understanding how to build and strengthen the
    information security culture.18 Influence of specific cultural traits and dimensions
    on cybersecurity governance has also been the subject of investigation. Studies
    examining the impact of technology, people, and procedure-specific factors on
    information security management also indirectly inform the role of organizational
    culture in bringing about the desired security compliance behaviors. High-reliability
    organization studies have also informed security culture research.19


    With attackers exploiting human vulnerabilities, procedural loopholes, and technological
    deficiencies, the strategic preparation and response must be multi-pronged, requiring
    the involvement and commitment of both internal and external stakeholders. Achieving
    interorganization and extra-organization wide buy-in requires a change in mindset
    that can be brought about and reinforced through a cultural change.20


    An organizational culture that stimulates loyalty and oneness is likely to mitigate
    the risk of attacks from insiders. A 2016 IBM study found that 60% of the breaches
    are triggered by unhappy employees who have an axe to grind.21 According to social
    bond theory, a person is likely to commit a crime if the bonds of attachment,
    commitment, and involvement are weak.22 A cohesive and controlling culture with
    well-designed incentives and sanctions, and robust enforcement processes, will
    be an effective deterrent to insider threats.


    One particular empirical study finds control-focused organizational culture emphasizing
    effectiveness and consistency conducive to realizing the information security
    management goals of integrity, availability, and accountability.23 Studies also
    emphasize the important role of the senior leadership in developing and instilling
    an information security–friendly organizational culture. While C-suite executives
    recognize the significance and importance of information security, the friction
    or difference lies in their approach to translating the security sentiment into
    reality.24


    Organizational security culture can be strengthened over time by crafting an information
    security policy and ensuring the employees are extremely familiar with the policy
    document.25 By providing guidelines on'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'ideal and desired practices, the security policy can help influence social
    norms and values and thereby make the culture more security conscious. Implementing
    and institutionalizing the recommended controls for securing data, devices, networks,
    storage locations, and people (through training) also strengthen the security
    culture.26 Studies have also found that highly trained and visible incident response
    teams enhance awareness of the organizational commitment to information security,
    which in turn reinforces the security culture.27


    # 4.3 High-Reliability Organizational Culture Traits


    While the organizational culture literature sheds light on winning traits and
    characteristics, it is the organizational safety and high-reliability organization
    (HRO) studies that are most relevant for identifying the key dimensions of a high-performance
    cybersecurity culture. In high-risk industries and operations such as nuclear
    plants, chemical manufacturers, airlines, hospitals, and infectious disease research
    laboratories, organizations are expected to operate at a very high level of reliability
    because the cost of a single error could be catastrophic.28 So, the cultural traits
    and attributes that enable HROs to minimize errors will be ideally suited for
    cybersecurity management, as the consequences of cyberattacks can be equally devastating.


    One such HRO is the U.S. Naval Nuclear Propulsion Program. The program was commissioned
    in the 1950s to examine the feasibility of using nuclear power (instead of diesel)
    as a new source of energy that would allow submarines to stay submerged for longer
    periods of time and thereby avoid detection. These onboard nuclear reactors must
    be operated with great caution because one mistake could result in complete destruction
    of the vessel and the death of all crew members. In addition, the radiation released
    from such accidents can have a catastrophic impact on the environment and the
    people within that environment. Creating a high-reliability environment where
    such accidents would not happen was clearly the priority for Admiral Hyman Rickover,
    the pioneer of the nuclear navy program. He was extremely successful: during his
    30-year stint at the helm of the program, there was no incident of a nuclear catastrophe,
    and that unblemished record continues to this day. “In more than 60 years of existence,
    the nuclear propulsion program that he helped launch hasn’t suffered a single
    incident.”29'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Rickover’s success has been attributed to an organization culture anchored
    on six key principles—integrity, depth of knowledge, procedural compliance, forceful
    backup, questioning attitude, and formality in communications.^30 The “integrity”
    principle speaks to the level of commitment displayed by the submariners in managing
    operations. The nuclear submarine officers are fully dedicated to safely and efficiently
    running and maintaining the onboard nuclear equipment. This single-minded and
    focused dedication to ensuring operational efficiency and safety is a trait that
    would go a long way in supporting the cybersecurity goals of an organization.


    The nuclear naval culture also values a high level of preparedness, which is reflected
    in a) thorough and rigorous training and assessment programs; b) numerous internal
    controls and checks and balances in place to prevent any kind of operational missteps;
    and c) empowering of employees to promptly raise alarms and draw attention to
    problem situations. As will be discussed in later chapters, such preparedness
    traits are essential to building and sustaining a robust information security
    mechanism.


    Finally, the principles of *procedural compliance* and *formality in communications*
    reflect a highly disciplined and meticulous approach to safety on board the nuclear-powered
    vessels. Similarly, a disciplined approach of following through with the cybersecurity
    strategy and action plans; continuous monitoring of attack surfaces, vectors,
    and defense mechanisms; effective communication and enforcement of policies; continuous
    performance assessment and improvement; and frequent security audits and drills
    are essential to cybersecurity effectiveness.


    Thus, the six principles driving the high-reliability environment at the U.S.
    Naval Nuclear Propulsion Program can be broadly mapped (Figure 13) into three
    high-performance information security cultural dimensions (or traits) of commitment,
    preparedness, and discipline.


    These three high-performance cultural dimensions also find support in other case
    studies and empirical studies. For instance, under the leadership of Sergio Nacach,
    Kimberly-Clark’s Andean region was able to establish a “winning” culture of people
    who were totally committed to results. Empathy and community were the cornerstones
    of this committed culture and were reflected in the people-focused and people-friendly
    attitude both within and outside the organization. In the words of the organization’s
    supply chain manager: “It is a culture of sincerity, where anyone can say whatever
    crosses his or her mind. There is a culture to achieve and exceed the goals, a
    winning culture of people totally committed to the results.”^31


    The leadership at Infrastructure Development Finance Corporation (IDFC) embarked
    on a journey to develop a high-performance organizational'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Figure 13 Mapping High-Reliability Organization Principles to High-Performance
    Information Security Culture Traits


    ![](img/0b22c0cfcb4e18d40f800925f47e42eb_82_0.png)


    culture in 2009. Their focus was to create a culture of oneness to help unify
    the various business units. Growth through acquisitions had saddled the company
    with several disparate business unit cultures, and IDFCs “One-Firm” initiative
    was aimed at creating a shared sense of purpose and values. Building such an integrated
    culture led to greater collaboration across units, thereby enhancing the level
    of preparedness. The cultural transformation resulted in a revenue increase, improvements
    in customer service quality, and growth in market share.32


    Establishing a culture of preparedness is also well documented in emergency and
    disaster management literature.33 Numerous studies on disaster preparation and
    recovery have examined the critical success factors and made recommendations on
    how best to prepare for the different types of possible calamities. Enhancing
    general awareness, conducting vulnerability assessments, and having in place well-rehearsed
    action plans are the distinctive characteristics of organizations that have a
    strong culture of preparedness.34'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Tribune Publishing, a highly reputed media organization and owner of the newspaper
    Chicago Tribune, went through a cultural transformation following a 1985 strike
    by its production unions. The crisis created an opportunity for the organization
    to reflect on its current state and operating style and craft a new path forward.
    The management team made a commitment to a customer-focused operating philosophy,
    to establishing stronger vendor relationships, and to meeting its printing goals.
    They embraced a more disciplined approach to performance measurement by aligning
    the system with corporate mission, values, and goals. The cultural transformation
    results were quite impressive—productivity improved by 25% and the Chicago Tribune
    also realized tens of millions of dollars in annualized advertising revenue savings.35


    To examine the validity of high-performance cultural traits from the standpoint
    of cybersecurity governance, data was gathered from primary and secondary sources.
    A multimethod approach of literature review, focus groups, and expert interviews
    was used to collect data. Representatives from for-profit and non-profit organizations
    participated in this study. To ensure a rich and diverse perspective, information
    security experts from technology user and technology provider firms were interviewed.
    Industries ranging from healthcare and public health to supply-chain management,
    higher education, security and information management solutions, and financial
    technology were in the surveyed sample. Qualitative analysis was used to validate
    the information security relevancy of the three high-performance cultural traits
    and also to identify the associated cybersecurity success factors and best practices.
    These traits and success factors are discussed in the following chapters.


