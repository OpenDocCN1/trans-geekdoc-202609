    devices. A new variant of Ursnif, a Trojan malware, is spreading via Word documents
    with the intent of stealing financial and personal information.16


    **Ransomware** is another very popular and devastating form of attack where the
    malware freezes the victim’s machines and networks and the criminals demand a
    ransom, typically in cryptocurrency such as bitcoins, for victims to regain access
    to their data. The malicious program encrypts all the data and puts up a screen
    demanding money to return access to the victim. The ransom amount increases over
    time until the end of a countdown, when the files are destroyed. There is no guarantee
    that paying the demanded amount will ensure a full recovery of encrypted files
    and immediate restoration of interrupted services.


    This malicious code is typically spread through phishing emails when victims unknowingly
    visit rogue sites.17 In addition to email attachments, this malware also spreads
    through “infected software apps, infected external storage devices, and compromised
    websites.”18 Ransomware attacks are often carried out via a Trojan that delivers
    a malicious payload disguised as a legitimate file.


    Figure 2 presents the message that flashed on the screens of more than 200,000
    computers that were infected by the WannaCry ransomware. It was a global hacking
    attack (Figure 3) that affected devices in 150 countries in 2017. Victims included
    organizations from the healthcare industry,'
