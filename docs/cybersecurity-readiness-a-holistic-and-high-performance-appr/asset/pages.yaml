  md: '![](img/0b22c0cfcb4e18d40f800925f47e42eb_57_0.png)


    # Breach Incidents and Lessons Learned


    This chapter reviews some of the major data breaches (i.e., over a million exposed
    records) across different industries. The examination sheds light on the attack
    causes, vulnerabilities, organization responses, and consequences. Each case discussion
    concludes with a reflection on key takeaways and lessons learned.


    # 3.1 The Capital One Breach That Exposed 100 Million Applicants and Customer
    Information


    A former employee of Amazon Web Services, Paige Thompson, hacked into the Capital
    One directory on an Amazon server. According to a court report, the operator was
    able to gain access by exploiting a misconfigured web application firewall. She
    was able to access and download a ton of information on 100 million credit card
    applicants and customers—from names, addresses, credit scores, credit limits and
    balances, to U.S. social security numbers, Canadian social insurance numbers,
    and bank account numbers. Customer applicant data from as early as 2005 was exposed.^1


    In addition to publishing the stolen data on GitHub, a leading software development
    platform, the hacker flaunted her exploits on social media platforms such as Slack.
    Paige, a software development engineer, made little effort to conceal her identity—she
    used the same screen name, “erratic,” on Slack, Twitter, and Meetup. After she
    had published the content, a friend replied, “sketchy shit . . . don’t go to jail
    plz.” Paige responded, “I wanna get it off my server, that’s why I’m archiving
    all of it, lol. It’s all encrypted. I just don’t want it around, though.” The
    casual nature of her conversation is quite alarming, especially from a highly
    skilled software professional who once worked for a top employer.^2'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The breach happened in stages between March and April of 2019; Capital One
    became aware of the hacking incident on July 17, 2019. Downplaying the potential
    impact, the company claimed, “No credit card account numbers or log-in credentials
    were compromised and less than one percent of Social Security numbers were compromised.
    Based on our analysis to date, we believe it is unlikely that the information
    was used for fraud or disseminated by this individual.”3


    The company''s stock took a slight beating, going down by 5% in pre-market trading
    on Tuesday, July 30, 2019. Capital One is likely to incur between $100 and $150
    million on post-hacking related expenses such as customer notifications, credit
    monitoring, technology upgrade, and legal expenses.


    Chairman and CEO Richard Fairbank expressed his sincere regret about the incident
    and promised to do everything within his power to make it right for all stakeholders.
    He reassured the public about being fully committed to safeguarding information
    and staying invested in cybersecurity. The company reported that it had fixed
    the problem that caused the breach and was cooperating with federal law enforcement
    to thoroughly investigate the incident.4


    Although the complete technical details of the breach are not available, experts
    are of the opinion that Capital One did not properly configure the Amazon server.
    A savvy developer sniffed out the security loopholes and nonchalantly shared the
    sensitive data with the entire world. Considering she didn''t try to make any
    money off the downloaded data and shared it publicly, one is at a loss to understand
    her motivation.


    Why did she carry out the breach? Did she not realize that she was committing
    a crime? The other pressing questions relate to the preparedness and commitment
    of Capital One and Amazon. Since server misconfiguration has become a common problem,
    what controls were in place from the standpoint of both the companies, to prevent
    such a breach? Did they not carry out regular security drills to prepare for such
    incidents? While Capital One is obviously liable to its victim customers and credit
    card applicants, should Amazon also shoulder some responsibility? Should there
    be provisions in the service level agreements (SLAs) to establish shared responsibility
    and empower the client organization (under certain conditions) to claim damages
    in the event of such data security breaches?'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Lessons Learned


    This case should serve as a caution for all organizations that outsource the storage
    of sensitive data and management of related digital assets to third-party service
    providers. During the vendor selection process, the client company must thoroughly
    review the confidentiality, integrity, and access-related controls offered by
    the vendor. For instance, the client should inquire about the vendor''s encryption
    technology standard, access control methods, security alert notification process,
    monitoring and detection mechanisms, and incident response capabilities. Interconnection
    Security Arrangement (ISA) details—that is, how their respective networks and
    systems will connect and transfer data—and data ownership issues should also be
    the subject of discussion. The customer must be satisfied in the vendor''s ability
    to meet the regulatory compliance requirements.


    A golden rule is to ensure that the level of security and protection is at least
    on par with the client organization''s standards and expectations. Even after
    the onboarding process is complete, vendor''s security management practices should
    be closely monitored. When crafting the service level agreement (SLA), the performance
    criteria relating to measures such as system response time, service availability,
    and data protection must be agreed upon and clearly documented. Penalties associated
    with noncompliance and underperformance must also be explicitly included in the
    SLA.


    Desirably, the SLA provisions should incentivize a high level of commitment on
    the part of the service provider. It would be ideal if the vendor would agree
    to shared responsibility and partnership in protecting customer data. Robust oversight
    mechanisms and procedures must be in place to ensure the outsourcing arrangement
    is working well. Such processes would include regular monitoring and testing of
    the security controls to protect the data. Since service providers understand
    best the security configuration of their servers, they should guide and help the
    client in setting up the servers appropriately. Ideally, if available, sophisticated
    artificial intelligence tools should be used to configure the servers and do regular
    security checks.


    # 3.2 British Airways Ordered to Pay a Record Fine of $230 Million


    British Airways (BA), the flagship airline of the United Kingdom, suffered a major
    data breach in the summer of 2018. According to the Information'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Commissioner''s Office (ICO), a hacking group called Magecart exploited a JavaScript
    vulnerability on BA''s payment-processing website and app. They were able to divert
    passenger data to a similar sounding rogue site called baways.com. About a half
    million passengers'' personal data were compromised, and that included names,
    addresses, contact information, and payment card details including the three-digit
    security code (“card verification value,” or CVV). Though BA claimed that the
    stolen data were not used for fraudulent purposes, one of the victims, David Champion,
    reported otherwise. Champion''s credit card company notified him about an apparent
    fraudulent activity—there was an attempt to use his stolen credit card to shop
    at Harrods in London while he was in Malaysia.


    According to security expert Andrew Dwyer, the vulnerability in Modernizr, a JavaScript
    library, is well known, and he was surprised that British Airways had not updated
    the script since 2012. He was also of the opinion that effective monitoring would
    have revealed the weakness and BA could have averted the major breach. Even more
    disconcerting is that BA hadn''t fixed the problem even after a year of the attack.⁵


    On July 9, 2019, authorities levied British Airways with a record-breaking 183-million-pound
    fine for violating the General Data Protection Regulations (GDPR). Although the
    company did follow the GDPR guidelines and report the breach within 72 hours of
    discovery, it was found negligent, guilty of poor security arrangements and not
    having provided adequate protection of customer data. A spokesperson from the
    ICO summarized the situation in simple but powerful words: “When you are entrusted
    with personal data, you must look after it.”⁶


    # Lessons Learned


    Organizations should make every effort to protect confidential customer data.
    They should have a comprehensive security plan and execute it with great consistency
    and efficiency. They should pay close attention to the relevant cybersecurity
    and privacy laws and regulations (See Appendix 4) and ensure compliance. Such
    a robust plan would include periodic identification of sensitive data and review
    of protection measures. There should be a monitoring system in place, and the
    reports should be carefully reviewed and acted on. If a decision is made not to
    follow through with a certain recommendation, the rationale needs to be documented.
    Training and awareness programs should include customers whereby they are alerted
    to the different attack methods and advised on appropriate precautionary measures.
    Disaster recovery plans and protocols should be well'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'vetted and rehearsed; this will allow the incident response teams to act swiftly
    and decisively as soon as a breach has been identified or reported. Senior leadership
    should actively engage in the development and deployment of information security
    programs and closely monitor their effectiveness. If the due diligence is thorough,
    the company is likely to fare a lot better in the court of law and public opinion.


    # 3.3 Target Retail Chain Experiences an External Intrusion That Compromised Millions
    of Customer''s Data


    In November 2013, the Target retail chain experienced an external intrusion when
    hackers stole Fazio Mechanical''s (a HVAC vendor) access credentials to Target''s
    systems. According to experts, the reconnaissance by attackers must have revealed
    a list of Target vendors and how they interact with the retail chain''s systems.
    There is also a publicly available case study (on the Microsoft website) that
    describes Target''s technical architecture and infrastructure and how the company
    uses the Microsoft virtualization software and the Microsoft System Center Configuration
    to deploy security patches and system updates. Armed with such knowledge, the
    hackers sent an email with a malware attachment to the refrigeration company Fazio
    Mechanical. This malicious code was designed to steal passwords such as access
    credentials to Target''s online vendor portal.7


    Upon gaining access to the company''s network and systems, the perpetrators were
    able to infect 40,000 of the 60,000 point-of-sale payment card readers with malware
    (in the form of an executable file). The malicious code was designed to go undetected
    by virus scanners. The software was able to capture and forward customer information
    as soon as credit cards were swiped through a POS reader. Over 11 GB of data,
    comprising of contact and credit/debit card information of millions of Target
    customers, were stolen.8


    The breach that began before Thanksgiving went undetected for several weeks before
    the Department of Justice brought it to Target''s attention. Equally concerning
    was the fact that Target did not pay heed to the alert sent out by FireEye, a
    monitoring company.9


    The retail giant agreed to pay $18.5 million as part of a multistate settlement
    with 47 states and the District of Columbia. The penalty amount would cover free
    credit monitoring services for all affected customers and'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'up to $10,000 for any victim that could provide evidence of losses suffered
    due to the breach.¹⁰


    # Lessons Learned


    This incident speaks to the importance of paying heed to intelligence and taking
    prompt action. Organizations should have sophisticated intelligence gathering
    and security monitoring systems in place and also structures and procedures that
    ensure quick decision making along with logging of the findings and the decisions
    made. Access control mechanisms should be strengthened and regularly reviewed
    and tested by experts. To Target''s credit, they have taken steps to strengthen
    their security—from creating a customized security framework to establishing sophisticated
    monitoring capabilities.¹¹ As discussed previously, information security credentials
    of vendors must be checked before entering into a contractual relationship. Relevant
    security certifications must be furnished by the vendor on a regular basis.


    # 3.4 Adult Friend Finder Site Breach Exposes Millions of Customer Records


    In May 2015, Adult Friend Finder, an adult entertainment company, suffered the
    first of two consecutive breaches that happened within a year apart. Its website
    was compromised, and the hacker exposed the subscribers on a darknet forum. The
    information leaked was just not the usual names, addresses, date of birth, contact
    information, and credit card details. Very personal details such as sexual preferences,
    willingness to have extramarital relationships, and membership on other adult
    websites were also revealed. Thus, the victims were vulnerable not only to fraudulent
    credit card transactions but also to internet shaming, blackmail, and extortion.


    Yet another cause of concern was that the company did not purge old and expired
    accounts, and these accounts dated back 20 years. The company kept information
    on users even after they had deleted their accounts. A particular victim complained
    that his information was included in the leaked documents even though he had deleted
    his account after trying the service.


    The investigation reports also revealed that the perpetrator, an administrator
    on the hacker forum HELL, was acting out of revenge because the'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'adult entertainment company owed money to his friend. He exploited a local
    file inclusion (LFI) vulnerability to access all the sites of the Adult Friend
    Finder’s network. In addition to publishing the data files, he also demanded a
    ransom of $100,000.^12^ Supposedly, the company did not have in place strong password
    controls. User passwords were either stored in plain text, that is, without protection,
    or the very weak SHA1 hashing algorithms were used. Weak passwords were one of
    the identified reasons for the Ashley Madison (dating website) breach. An investigation
    revealed that at least 15 million passwords were protected with MD5, a low-grade
    algorithm, compared to the more robust Bcrypt encryption method.^14^


    # Lessons Learned


    Consistent with the Generally Accepted Privacy Principles (GAPP), organizations
    should follow the minimization principle when it comes to collecting and storing
    customer information. They should not only limit the collection of personally
    identifiable information (PII) but also purge it as soon as the purpose has been
    served. Often, the technology used to collect data (such as web access logs and
    sensory data) gathers more than what is necessary. Under such situations, the
    collecting organization must provide full disclosure to the client and destroy
    the unnecessary information as soon as possible.


    Yet another important GAPP principle is that organizations must take every step
    to secure the collected information from unauthorized access. The different vulnerability
    points must be identified and appropriate safety measures put in place. For instance,
    strong password controls should be in place, such as the following: a) accept
    only strong passwords, b) require users to change passwords every couple of months,
    and c) use multifactor authentication (MFA). Sophisticated and highly robust algorithms
    should be used to protect passwords and other customer information.


    Adhering to the aforementioned principles is also a step in the right direction
    toward compliance with the relevant privacy and data protection laws (see Appendix
    4).


    # 3.5 Three Billion Yahoo

    User Accounts Compromised


    Three billion user accounts were compromised when Russian hackers were able to
    break into Yahoo systems and steal subscriber information. Names,'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'email addresses, and passwords of every single account holder of Yahoo and
    its associates—Tumblr, Fantasy, and Flickr—were stolen.15


    Although the breach took place during the 2013–2014 period, Yahoo didn''t disclose
    the breach till 2016 and was fined $35 million by the Securities and Exchange
    Commission for the notification delay. The company has also been directed by the
    court to create a $117.5 million settlement fund to compensate the victims. Yahoo
    also took a hit on its acquisition price—Verizon lowered its purchase price for
    the company by $350 million after learning of the breach.16


    According to court documents and FBI reports, a spear-phishing email was sent
    to Yahoo employees, and it took just one click (by an unsuspecting recipient)
    to install the malware. This malicious code allowed Aleksey Belan, one of the
    Latvian hackers hired by Russian agents, to install a backdoor on a Yahoo server
    and steal the company''s user database. Now he had access to names, phone numbers,
    password challenge questions and answers, password recovery emails, and the unique
    cryptographic value for each user account. Using recovery email addresses and
    cryptographic values, the hacking team was able to generate access cookies that
    allowed them access to user email accounts.17


    Thus, a single click was all that it took to trigger the world''s largest data
    breach. The plaintiffs accused Yahoo of negligence. For instance, an outdated
    hashing algorithm, MD5, was used to scramble many of the user passwords; according
    to experts, Yahoo should have consistently used the industry standard Bcrypt algorithm
    to encrypt the passwords. The plaintiffs also alleged that Yahoo consciously and
    deliberately did not promptly notify the affected customers.18


    # Lessons Learned


    It is imperative that organizations be honest, candid, and transparent in their
    communications with all stakeholders. Especially during breach incidents, victims
    should be promptly notified of the attack and potential consequences. In their
    defense, many companies have argued that they did not wish to rush the communication
    without being sure of the facts. While that is understandable, a brief communication
    of the potential breach and the steps the organization is taking to get to the
    bottom of it would be a more desirable practice. Stakeholders would also be most
    appreciative of periodic briefings and updates.


    Continuous training and awareness programs are essential to mitigate risks from
    different types of attacks, including phishing. In addition,'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'there needs to be constant monitoring and testing to detect suspicious activities
    and files. Using strong algorithms to encrypt passwords and all other forms of
    personally identifiable information (PII) is another best practice.


    # 3.6 Equifax Data Breach Exposes Millions of Customers’ Data


    In March 2017, Equifax’s systems were breached and PII of 147 million customers
    was stolen. One of the major credit reporting agencies in the United States, Equifax
    collects financial information on U.S. citizens and residents to generate credit
    scores and reports. Headquartered in Atlanta, Georgia, Equifax also serves customers
    globally by providing data analytics services.


    According to the breach investigation report, the hackers exploited a vulnerability
    on the customer complaint web portal and were able to gain access to several servers.
    The patch for this vulnerability was released on March 7 by Apache Software Foundation,
    and Equifax was advised to apply the patch on March 9. The company failed to follow
    through with the recommendation. Equifax also ignored the advice of Mandiant,
    a secure consulting firm, which had detected several unpatched and misconfigured
    systems. Their scanning systems failed to flag several vulnerable systems that
    needed a security update. Furthermore, the usernames and passwords were not encrypted
    (they were found to be stored in plain text) and the networks not adequately segmented.
    The attack went undetected for several months, partly because Equifax had failed
    to renew the public-key certificates on tools that are capable of decrypting and
    analyzing network traffic and also detect data exfiltration.¹⁹


    Testifying before the U.S. Congress, Richard F. Smith, then CEO of Equifax, pinned
    the blame for the fiasco on one particular individual who worked in the technology
    department. According to Smith, the employee had “failed to heed security warnings
    and did not ensure the implementation of software fixes that would have prevented
    the breach.”²⁰


    Equifax’s post-breach actions have also come under significant scrutiny and criticism.
    The domain name (equifaxsecurity.com) for the dedicated site to engage with affected
    customers seemed to closely resemble lookalike domain names used for phishing
    scams. Expecting customers to trust such an URL was unwise. Equifax had the wrong
    domain name (securityequifax2017.com) listed in their official social media announcements.
    Several'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Experts were also of the opinion that the real Equifax site (for affected customers)
    was insecure. Offering free enrollment in an Equifax ID monitoring and protection
    service was also criticized; victims were unlikely to sign-up with a company that
    had betrayed their trust.


    Interestingly, the stolen data were not leaked or sold on dark websites. According
    to the U.S. Justice Department report, it was a state-sponsored cyber espionage
    attack. “The attorney general said the attack on Equifax was just the latest in
    a long string of cyber espionage attacks that sought trade secrets and sensitive
    data from a broad range of industries.”^21


    Equifax reached a record-breaking settlement of $425 million to resolve consumer
    claims.^22 They also spent $1.4 billion to upgrade and transform their technology
    and security infrastructure. Several senior executives were relieved of their
    positions and in June 2019, Moody’s downgraded the company’s financial rating.


    # Lessons Learned


    Organizations should pay heed to information security intelligence and take prompt
    and decisive action on that basis. If the decision is not to act on the insights
    gained, the rationale must be documented in a report. Regular technology review
    and upgrades, robust security monitoring and detection processes, and rehearsing
    disaster recovery plans are essential to cybersecurity readiness. Top management
    must be on top of security initiatives and issues and provide close oversight.
    Actions speak louder than words; organizations must exhibit genuine intent and
    effort to protect sensitive data and be transparent and fair in their dealings
    with breach victims.


