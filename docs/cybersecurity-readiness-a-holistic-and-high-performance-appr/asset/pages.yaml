  md: '# Oklahoma Department of Securities Data Leak


    In December 2018, the Oklahoma Department of Securities learned about a firewall
    security vulnerability that had caused one of its storage servers to be publicly
    accessible for about a week. According to the UpGuard security analysts who detected
    the breach, the securities commission had left open an rsync server. Such servers
    are used for backing up data.


    Three terabytes of sensitive data, from social security numbers to remote access
    credentials, FBI investigation details, and AIDS patients’ data, were exposed.
    Shodan, a search engine for internet-facing IP addresses, first registered the
    storage server to be publicly accessible on November 30. UpGuard analysts who
    discovered the breach notified the agency on December 7, and the server was removed
    from public access on December 8.


    The purpose of this state agency is to ensure that securities trading is conducted
    legally, and citizens are shielded from fraud. Given the organizational mission
    of protecting the public, it is rather surprising that the agency did not pay
    any heed to breach risk warnings such as the UpGuard Cyber Risk score of 171 out
    of 950. Use of an outdated web server that had reached the end of useful life
    in 2015 was one of the reasons for the low score. Between 2015 and the date of
    the discovery of the breach, namely, for a period of three and a half years, there
    were no server updates to address potential vulnerabilities.


    Also concerning is the nature of response upon learning about the breach. According
    to Chris Vickery, head of research at UpGuard, the department did not follow up
    with a request for a thorough discussion with the security analysts who had detected
    the leak. Neither did it check to see what the researchers did with the downloaded
    data. The analysts were also shocked to find another poor security choice made
    by the department; it “had stored an encrypted version of one document in the
    same file folder as a decrypted version.”5


