    and responsibilities. |

    | Physical Access Control | • Keys and combinations to locks must be changed annually
    and details of such change including the personnel responsible for making the
    changes should be recorded. |

    | System Security Plan | • The System Security Plan must be reviewed annually
    and recorded. |

    | Access Agreements | • Agreements allowing access to information and information
    systems must be reviewed and updated annually. Such access agreements must be
    re-signed. |

    | Vulnerability Scans | • An accredited and certified third party must be hired
    to carry out scans of operating systems, applications, infrastructure, and databases
    annually. |

    | Boundary Protection | • Changes and updates to traffic flow must be made based
    on evolving business needs. The Configuration Management Plan must be updated
    to reflect the changes. |

    | Security Training | • Role-based security training must be provided annually
    and on an as-needed basis. Training details must be recorded. |

    | Security Training Records | • Security training records must be archived annually.
    Details on how to access the archive and who archived the records must also be
    recorded. |

    | **Every Two Years** |  |

    | Identifier Management | • User and device identifiers must be changed every
    two years. |'
