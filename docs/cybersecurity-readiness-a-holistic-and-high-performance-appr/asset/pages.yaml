  md: '# CHAPTER

    2


    # The Cyberattack Epidemic


    Research and survey reports reveal a continual rise in the frequency and severity
    of cyberattacks. No country and no industry is being spared; small and large organizations
    are being targeted; both public and private infrastructures are under attack (Table
    1). The United States has been experiencing, on average, 130 large-scale targeted
    breaches per year and the number is growing by 27% every year. In 2017, the average
    number of breaches per country was reported to be 24,089. It is predicted that
    “cybercrimes will cost the world $6 trillion annually by 2021, up from $3 trillion
    in 2015.”¹ The forces fueling the cyberattack epidemic and the nature and extent
    of its impact are discussed in the following sections.


    Table 1 Cybersecurity Statistics


    | Statistic | Source |

    |---|---|

    | On average, every 39 seconds a computer (with internet access) is being hacked.ᵃ
    | 2017 University of Maryland Study |

    | Global spending on cybersecurity is projected to reach $133.7 billion by 2022.ᵇ
    | 2018 Gartner Report |

    | Security breaches have increased by 11% since 2018 and 67% since 2014.ᶜ | 2019
    Accenture and Poneman Institute Report |

    | The average time to identify a breach is 206 days.ᵈ | 2019 IBM Report |

    | The average lifecycle of a breach is 314 days (from the breach to containment).
    | 2019 IBM Report |

    | The average total cost of a data breach is $3.92 million. | 2019 IBM Report
    |

    | The average size of a data breach is 25,575 records. | 2019 IBM Report |'
