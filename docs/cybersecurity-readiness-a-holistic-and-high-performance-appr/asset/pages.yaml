  md: 'Thorough screening and background checks during the recruiting process could
    potentially alleviate the risks of insider threats. Educating employees about
    their roles and responsibilities in protecting sensitive data and complying with
    related organizational rules, policies, and controls are also important control
    measures to minimize the risks of unauthorized access. The organization must also
    be prompt in revoking access privileges when an employee leaves the organization.


    Sound monitoring systems must be in place to ensure the granted access privileges
    are still valid. It is through regular account reviews that privilege creep can
    be detected. Privilege creep can happen when employees change roles and gain new
    access privileges without losing the previous permissions. Automating the process
