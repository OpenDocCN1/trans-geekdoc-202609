- pgno: 267
  md: '# Overview


    Target first opened shop in 1962 in Roseville, Minnesota, with a focus on convenient
    shopping at competitive discount prices. Target is the second-largest general
    merchandise retailer in the United States, with 1,801 stores in the United States,
    133 stores in Canada, and 366,000 employees worldwide. Target.com is consistently
    ranked as one of the most visited retail websites. Target’s mission is to make
    Target the customer’s preferred shopping destination in all channels by delivering
    outstanding value, continuous innovation, and exceptional guest experiences by
    consistently fulfilling Target’s Expect More, Pay Less brand promise.


    During the busiest shopping period of the year in the United States, data thieves
    stole the debit and credit card information of customers who shopped in Target
    between November 27 and December 15, 2013. At first, it was estimated that the
    data thieves got away with the personal information of 40 million customers. However,
    in 2014 Target announced that an additional 70 million customers had been affected
    by the data breach, a number equivalent to about one-third of the U.S. population.


    # The Retail Industry and Information Security


    According to Verizon’s Data Breach Investigations Report (DBIR) for 2014, the
    industries that are most commonly affected by point-of-sale (POS) intrusions are
    restaurants, hotels, grocery stores, and other brick-and-mortar retailers. In
    Verizon’s DBIR, an analysis of security incidents with confirmed data loss by
    victim industry showed that the retail industry was among the top four industries
    with a high level of security incidents. Eleven percent of security incidents
    occur in the retail industry, and 31 percent of these security incidents are attributable
    to POS intrusions in the retail industry (Verizon Enterprise Solutions, 2014).
    In a POS intrusion, an attacker compromises a POS device, installs malware to
    gather card data, and then uses the card to access funds. According to Verizon’s
    2014 DBIR, the most popular POS attack involves RAM-scraping malware, which grabs
    payment card data while it’s being processed in memory but before it’s encrypted.


    Following the Target data breach in 2013, other retailers were also victims of
    cybercrime the following year, including Neiman Marcus, Michael’s, P. F. Chang’s,
    Kmart, Sally Beauty, Bebe, Godiva, Staples,'
  merge: -1
  img_proc: true
- pgno: 268
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 269
  md: 'enable retailers to share information about data breaches and potential threats.


    # Implementation of the Target Data Theft


    Target had given network access to a third-party vendor, Fazio Mechanical Services,
    a Pennsylvania-based heating, ventilation, and air conditioning (HVAC) contractor.
    As part of its subcontractor work, Target provided Fazio with limited network
    credentials for electronic billing, contract submission, and project management.
    The network access enabled Fazio to access parts of Target''s computer network.
    The vendor''s weak security allowed the attackers to gain a foothold in Target''s
    network.


    The data thieves installed malware on POS terminals at U.S.-based Target stores,
    enabling the theft of financial information from 40 million debit and credit cards.
    The malware allowed for the collection of unencrypted, plain text data as it passed
    through the infected POS machine''s memory before the data was transferred to
    Target''s payment processing provider. Hackers tampered with the POS systems used
    at check-out registers and gained access to the data that is stored on the cards.
    According to Target, only 25 cash registers were hacked but information for 110
    million Target customers was compromised. The data thieves later sold the information
    they had stolen online. According to Target, the data breach included information
    such as customer names, credit or debit card numbers, expiration dates, and card
    verification security codes. Once the data thieves had obtained the data, they
    could use the data to encode that information on counterfeit cards, sell the cloned
    cards in batches online, or use the cloned cards at retailers to purchase goods.
    According to security blogger Brian Krebs, the data stolen from Target flooded
    the underground online black markets or "card shops," selling in batches of one
    million cards at prices ranging from $20 to more than $100 per card. Newer cards
    are sold at higher prices before the banks have identified and canceled the cards.
    By August 2014, the expenses in connection to the data breach had reached $235
    million.


    # Timeline of the Target''s

    Debit/Credit Card Data Breach


    The following timeline is based on a combination of information from the Target
    website, International Business Times timeline (Clark, 2014), and'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'the *FierceRetail* timeline (Heller, 2014). Only key information relevant to
    this case study was incorporated in this timeline.


    +   - Sept. 2013: Attackers steal Fazio credentials. Target certified as Payment
    Card Industry Data Security Standards (PCI-DSS) compliant.

    +   - Nov. 12, 2013: Attackers gain access to Target''s internal network.

    +   - Nov. 15–28, 2013: Attackers test malware on Target POS.

    +   - Nov. 30, 2013: POS malware fully installed. Attackers install data exfiltration
    malware. Symantec software identifies malicious activity. First FireEye alerts
    triggered. However, Target does not respond to the multiple warnings of the attack.

    +   - Nov. 27–Dec. 15, 2013: A data hack at U.S. Target stores exposes approximately
    40 million credit and debit card customers to fraud through a compromised POS
    system.

    +   - Dec. 2, 2013: More FireEye alerts triggered. Attackers begin exfiltrating
    data.

    +   - Dec. 12, 2013: Department of Justice notifies Target of data breach.

    +   - Dec. 14, 2013: Target hires a third-party forensics team to investigate
    the hack.

    +   - Dec. 15, 2013: Target removes the malware. Attackers lose foothold in Target
    network.

    +   - Dec. 18, 2013: Computer security expert and investigator Brian Krebs reports
    on the data breach.

    +   - Dec. 19, 2013: Target officially acknowledges that it has been the victim
    of a data breach. The stolen information includes customer names, credit or debit
    card numbers used, their expiration dates, and encrypted security codes.

    +   - Dec. 21, 2013: JP Morgan Chase places daily limits on spending and withdrawals
    of its debit card customers as it works to reissue cards in the following two
    weeks.'
