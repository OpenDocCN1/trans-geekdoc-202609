    Information Systems at the University of Georgia’s Terry College of Business and
    Visiting Professor at Duke University’s Pratt School of Engineering. Dr. Chatterjee’s
    interest and expertise lie in the various facets of information technology management,
    with current focus on cybersecurity and enterprise digitization. His work has
    been accepted and published in prestigious outlets such as the Wall Street Journal,
    MIT Sloan Management Review, California Management Review, Business Horizons,
    MIS Quarterly, and Journal of Management Information Systems. Dr. Chatterjee has
    significant experience teaching undergraduate, graduate, and executive education
    classes. He also serves as Senior Editor of the Journal for Organizational Computing
    and Electronic Commerce, a Taylor & Francis research journal, with full oversight
    over cybersecurity research. Dr. Chatterjee delivers talks around the world, moderates
