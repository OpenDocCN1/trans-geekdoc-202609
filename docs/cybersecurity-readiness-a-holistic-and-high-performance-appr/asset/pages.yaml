- pgno: 265
  md: '# Case Study 1


    # Target’s Debit/Credit Card Data Breach


    # Introduction


    In an increasingly digitized business world where companies leverage the power
    of electronic networks to partner, transact, and collaborate, securing the digital
    assets of an organization is becoming a bigger challenge. An organization not
    only has to shore up its defense, but also make sure its business partners and
    service providers are maintaining similar or better security standards. Otherwise,
    the attack surface area grows exponentially, and hackers are able to exploit the
    vulnerabilities of a vendor network and use it as a gateway to breach the client’s
    systems and databases. That is precisely what happened when Target experienced
    an external extrusion attack in November 2013. An employee of Target’s HVAC vendor
    fell victim to a phishing attack and that resulted in a malware getting installed
    on one of Target’s servers. The Citadel malware that was installed should have
    been detected by the anti-malware software available then. However, the vendor
    was using a free version of Malwarebytes, an anti-malware solution, and that was
    not powerful enough to detect the malware. The vendor also didn’t have a multi-factor
    authentication (MFA) system in place. From the compromised vendor machine, the
    hackers were able to launch a Trojan attack on Target’s systems and gain access
    to customer credentials.


    As highlighted in the summary table at the end of Chapter 3, Target’s management
    of vendor security is a potential area for improvement. It is a good practice
    to check the security credentials of vendors prior to doing business with them
    and establish an oversight mechanism to ensure they are living up to the agreed-upon
    security expectations.


    Hands-on commitment from the senior leadership could go a long way in ensuring
    the company did its due diligence in establishing a strong security system and
    took due care in protecting confidential data. The importance of top management
    commitment is highlighted in Chapter 5.


    From a preparedness standpoint, a potential weakness was lack of (or inadequate)
    network segmentation. Chapter 6 discusses a defense-in-depth approach that could
    benefit Target. This layered security strategy would include implementation of
    robust firewalls, use of powerful encryption methods to secure data, multi-factor
    authentication, and strong password'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'controls. Use of intrusion detection systems and other sophisticated artificial
    intelligence–enabled technologies to proactively detect and thwart attacks are
    also important components of a thorough preparedness plan.


    Finally, organizations such as Target can benefit from a disciplined approach
    to protecting sensitive data. Chapter 7 highlights some of the best practices
    associated with cybersecurity discipline. These include continuous monitoring
    of networks, maintaining intelligence logs, promptly acting on threat alerts,
    regular penetration testing, and conducting real-time security audits and drills.


    > —Dave Chatterjee


    # Target’s Debit/Credit Card Data Breach


    # A Business Case by Kudzai Muku, PhD


    # Abstract


    America’s second-largest retailer, Target, was the victim of a data breach during
    the busiest shopping period in the United States, between November and December
    2013. The data thieves gained access to Target’s computer network, stole the financial
    and personal information of 110 million Target customers, and moved the data to
    a server in Eastern Europe. As a result of the data breach, Target faced many
    challenges, including damage to its corporate reputation, and the need to take
    steps to strengthen data security in the future. This case examines Target’s efforts
    to restore its corporate reputation and increase digital security.


    # Case


    # Learning Outcomes


    The purpose of this case study is to enable students to:


    +   - understand the factors that led to Target’s debit/credit card data breach;

    +   - understand the impact on the company and its customers; and

    +   - critically evaluate how Target handled the data breach.'
