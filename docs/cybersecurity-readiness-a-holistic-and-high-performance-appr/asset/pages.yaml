    # 7.3 Continuous Monitoring


    Just as the information security landscape continues to evolve with new threat
    actors and vectors, the state of an organization’s security is also changing as
    it engages in a variety of sustenance and growth initiatives. Accordingly, organizations
    must discipline themselves to continuously monitor and evaluate vulnerabilities
    and defenses. Essentially, an organization has to protect itself from three types
    of attacks: external attacks, insider attacks, and supply chain or third-party
    ecosystem attacks. Hackers from anywhere could trigger external attacks. Insider
    attacks are often launched by disgruntled employees; many times, unsuspecting
    employees get compromised and unknowingly offer up necessary information for bad
    actors to access corporate systems and data. Attacks are also launched from breached
    systems of external vendors.⁴


    Constant review of controls and configurations is also essential to protect the
    organization from self-caused security loopholes and lapses. The following vignette
    describes how a government organization fell short in securing sensitive individual
    and corporate data.'
