- pgno: 300
  md: 'be open and honest about what the dating service was all about—a place for
    married people to cheat on their spouses without judgment.


    The Ashley Madison brand reinforced its positioning through brand imagery and
    its motto—“Life is Short. Have an Affair.” The brand logo was a wedding ring,
    and often paired with this logo was an image of a brunette woman making a “hush”
    gesture, her finger over her lips, signaling the company’s focus on secrecy and
    privacy.


    The business model for Ashley Madison was unlike those of other dating websites
    like eHarmony or Match.com. Rather than pay a monthly subscription for the service,
    Ashley Madison users purchased credits and then used these to pay per interaction.
    That is, to initiate contact with another member, an Ashley Madison user had to
    pay five credits, after which point further communication would be free.


    Ashley Madison understood the need for secrecy and privacy of their users. The
    company especially understood that when a user no longer wished to pursue an extramarital
    affair, they likely wanted all trace of their Ashley Madison membership erased.
    To that end, when a user no longer wished to be a member of the Ashley Madison
    community, the site provided a paid option for a “full delete.” This option, which
    was priced at $19, ostensibly ensured that all messages, site use history, personal
    information, photographs, and other information in a user profile would be completely
    erased.


    # Avid Life Media


    Avid Life Media was a social entertainment company that ran a number of dating
    websites and social networking websites. In addition to Ashley Madison, Avid Life
    Media’s dating site portfolio included: Cougar Life, a dating website for older
    women interested in younger men; Man Crunch, a dating website for gay men; Established
    Men, a dating website for wealthy men to connect with young, beautiful women;
    Big and Beautiful, a dating website for connecting people to curvy women; as well
    as other dating sites.


    Within the Avid Life Media portfolio, Ashley Madison and Established Men received
    the most public criticism. Many believed that the idea behind Ashley Madison was
    harmful to society as it could be seen as encouraging and enabling extramarital
    affairs. In addition, Established Men was seen by some as a front for prostitution—specifically
    for wealthy men to pay young women for sex (Bashir & Yiu, 2009).


    Although Established Men received criticism for preying on women, a series of
    television interviews and other publicity revealed that the idea'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'behind it—and also behind the sites Cougar Life, and Big and Beautiful—all
    came from women. An ABC *Nightline* Profile reported that Simone Dadoun-Cohen,
    an attractive college drop-out who became a stripper, first came up with the idea
    for Established Men. As a stripper, Dadoun-Cohen learned that there were many
    generous, successful men who wanted the attention of attractive women. EstablishedMen.com
    was created by Avid Life Media shortly thereafter in 2009. The woman behind Cougar
    Life was Claudia Opdenkelder, whose experiences of being discriminated against
    simply because she was an older woman who was interested in younger men led her
    to the idea behind Cougar Life. Weary of discrimination, Opdenkelder came to the
    idea of Cougar Life and, with the help of Avid Life Media, saw the website launched
    in 2009. Whitney Thompson, the first plus-sized winner of the reality TV series
    *American’s Next Top Model*, revealed that the dating website for large women
    seeking men—launched by Avid Life Media as Big and Beautiful—had been her idea.


    Ashley Madison itself was an international brand. However, it was clear that the
    brand was not welcome everywhere. When the brand announced its plans to expand
    to Singapore, the Singapore Media Development Authority announced that Ashley
    Madison would not be permitted to operate in the country as it “aggressively promotes
    and facilitates extramarital affairs” and demonstrated a “flagrant disregard of
    family values and public morality” (IMDA, 2013).


    In addition to criticism regarding the premise behind the website’s offering,
    Ashley Madison had been accused of scamming its users by using female “bots” in
    place of actual female users (Edwards, 2013). In 2012, a former employee sued
    the company, stating that she developed a stress injury from creating thousands
    of fake member profiles of women. The employee stated that these fake profiles
    were intended to lure men to the site. However, this lawsuit was dismissed by
    the Ontario Superior Court in 2015 (Loriggio, 2015).


    # ## The Attack


    On July 15th, 2015, the Impact Team, a consortium of hackers, executed a cyberattack
    on Ashley Madison in which they stole the user data and personal information of
    Ashley Madison customers. Rather than release the data, the Impact Team demanded
    that Avid Life Media shut down the websites AshleyMadison.com and EstablishedMen.com,
    and indicated that failure to do so would result in the Impact Team publicizing
    the stolen information.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Prior to the cyberattack on Ashley Madison, there were no known hacks performed
    by the Impact Team, and little was known about the group other than what they
    shared about themselves. One statement from the hackers related to the security
    of the information—the Impact Team stated that “nobody was watching. No security.
    . . . You could use Pass1234 from the internet to VPN to root on all servers”
    (Basu, 2015). The Impact Team published their manifesto (http://pastebin.com/3SepJr8Q)
    in which they expressed that they intended to expose the fraud committed by Avid
    Life Media—including that the company’s promises of secrecy were without basis
    and that the paid “full delete” option was a scam as the hackers had the user
    information for individuals who had paid for this service. The hackers revealed
    that they had information including the real names, addresses, and credit card
    information of users, as well as photographs, and lists of sexual fantasies.


    On July 20th, Avid Life Media released a statement (Avid Life Media, 2015a) indicating
    that they had been able to secure their sites and prevent further data breaches
    and were working with the authorities to uncover the hackers behind the attack.
    By July 22nd, the websites were still in operation, and the Impact Team released
    the names of two Ashley Madison users. Nearly one month later, on August 18th,
    Avid Life Media still operated their Ashley Madison and Established Men dating
    services, and the Impact Team released a data dump entitled “Time’s Up” that contained
    roughly 10GB of user email addresses and other information.


    In response to the August 18th data dump, Avid Life Media vilified the hackers,
    saying in a statement that “this event is not an act of hacktivism, it is an act
    of criminality. It is an illegal action against the individual members of AshleyMadison.com,
    as well as any freethinking people who choose to engage in fully lawful online
    activities” (Avid Life Media, 2015b).


    Between August 20th and 28th, the hackers released a series of other data dumps—including
    more information on users, as well as internal company information. On August
    24th, the company was served with a $578 million class-action lawsuit on behalf
    of the 39 million users whose information was exposed in the data breach (Perez,
    2015).


    # ## The Data


    The hacked information revealed not only information about user data and customer
    personal information, but also brought to light new questions around the use of
    female “bots” in place of actual women, and phony back-stories regarding some
    of the Avid Life Media Brands.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'The user information leaked by the Impact Team included e-mails—many of which
    were government, military, and corporate e-mail addresses—as well as mailing addresses,
    signup dates, total amounts of money spent on the website, and more. Many reporters
    and analysts were quick to point out that the e-mail addresses could be fake,
    and that the information was not necessarily accurate or reliable. However, cybersecurity
    experts suggested that although the volume of data made it impossible to immediately
    determine if all of the information was verifiable, that overall the data appeared
    to be genuine (Victor, 2015). Regardless of the veracity of the information, people
    whose identities were found within the Ashley Madison data leak suffered real
    consequences—including extortion and blackmail attempts, identity theft risk,
    and some cases of suicides (Baraniuk, 2015). Families were also impacted, with
    Ashley Madison customer service representatives receiving phone calls from crying
    spouses and angry clients (Brownell, 2015a).


    The cyberattack not only revealed information about Ashley Madison and Established
    Men users, but also information about the internal activities of Avid Life Media.
    Company emails from the hack revealed that Opdenkelder, Dadoun-Cohen, and Thompson
    were all hired to pose as founders of the dating websites and did not actually
    create the websites themselves (Brownell, 2015b). They also revealed that the
    ABC Nightline Profile about Simone Dadoun-Cohen was simply a made-up story regarding
    the background of the Established Men dating website.


    Further, the data provided confirmation of the existence of the female “bots,”
    revealing that the number of female users of Ashley Madison was indeed artificially
    inflated by these “fembots” (Morris, 2016).


    Throughout the data leaks and ensuing analysis of the information, Avid Life Media
    did not confirm the veracity of the information on its users.


    # Ashley Madison after the Attack


    Noel Biderman’s tenure as Chief Executive Officer (CEO) of the company ended in
    April of 2016, and Ashley Madison transitioned to new leadership under CEO Rob
    Segal and President James Millership. Under this new leadership, cybersecurity
    and rebranding became priorities for the company.


    In a July 2016 company statement, Millership and Segal revealed that the ultimate
    goal was to “rebuild Ashley Madison as the world’s most open-minded dating community”
    (Avid Life Media, 2016). As part of the rebuilding process, the parent company
    dropped the name Avid Life Media in place of Ruby Corporation, a move that Segal
    stated was “an important step in'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'our journey to completely rebuild the company as a relevant, digital dating
    innovator that truly cares for our customers” (Ruby Corporation, 2016).


    As Ruby Corporation, the company maintained its brand portfolio, including the
    Ashley Madison, Cougar Life, Big and Beautiful, Man Crunch, and Established Men
    brand lines.


    Another change was in dropping the longstanding Ashley Madison tagline of “Life
    is Short. Have an Affair.” Segal said of this move: “it was a limiting label that’s
    outdated and doesn’t speak to the wide variety of connections people find on Ashley
    Madison,” noting also that about 45% of Ashley Madison users were single, and
    that the brand needed to “evolve, grow, and attune to modern sexuality in 2016”
    (Ruby Corporation, 2016). In its place, Ruby Corporation chose the tagline “Find
    Your Moment.” In addition, the brand dumped their wedding ring logo and “hush”
    imagery.


    In over a year since the massive data leak and cyberattack, Ashley Madison, and
    parent company Ruby, had undergone a number of changes—reframing Ashley Madison
    as a dating site for extramarital affairs to one that was at the forefront of
    sexual encounters in 2016. However, the people responsible for the cyberattack
    had still not been held accountable for their illegal actions, the outcome of
    the class-action lawsuit against the company remained in litigation, and the scandal
    remained fresh in many people’s minds. What did the future hold for Ruby and the
    Ashley Madison brand? Were these changes sufficient to rebuild the brand? Was
    there anything else that Ruby should do? Beyond any future steps, the question
    remained as to whether Ashley Madison or the Impact Team was the real villain.


    # DISCUSSION QUESTIONS


    +   1. Are Avid Life Media and the Impact Team ethical organizations?

    +   2. Who was to blame for the devastating events in the aftermath of the data
    leak—Ashley Madison customers, Avid Life Media, or the Impact Team?

    +   3. Had you been in a leadership position at Avid Life Media during this situation,
    what would you have done differently or the same from the real-life executives?

    +   4. What could Ashley Madison have done to better protect its customers’ privacy?

    +   5. How serious was the impact of the cyberattack and data leak on the Ashley
    Madison business?'
