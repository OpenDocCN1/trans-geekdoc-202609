- pgno: 93
  md: 'Partnership among representatives from business, information systems, legal,
    ethics, and compliance is key to developing a comprehensive understanding of an
    organization’s cyber risk exposure and tolerance. Representatives from different
    functions must also weigh in on the information security risk implications associated
    with different strategic and operational business initiatives.


    Such cross-functional participation is also essential for an in-depth assessment
    of vulnerabilities and determination and implementation of appropriate controls.
    For instance, Human Resources will work closely with the security team to prevent
    unauthorized access and also the prompt revocation of access privileges as soon
    as employment is terminated. Legal will provide guidance and oversight to ensure
    the regulatory guidelines and compliance requirements are being followed. 17


    When it comes to data sensitivity classification and prioritization, input from
    the various functional units is essential. Determining data protection roles,
    responsibilities, and ownership must also be a collaborative endeavor, especially
    if the goal is to mobilize organization-wide support and involvement.


    Effective data governance is contingent on a good working relationship among data
    owners, stewards, and custodians. Senior-level business executives generally serve
    as the data owner for a particular data set relating to their organizational function.
    While they are responsible and accountable for data security, privacy, and quality,
    the day-to-day governance activities such as access, storage, and backup decisions
    are handled by the data stewards, who are the subordinates of the data owners.
    The IT staff play the role of data custodians and are responsible for executing
    the data governance decisions ranging from managing user access to complying with
    regulations and standards; maintaining appropriate data classification and security
    levels; and running systems, networks, and servers. Thus, business and IT must
    work in close cooperation to secure organizational data.


    In acquisition and divestiture situations, security professionals and business
    executives (across business functions) from involved organizations must work together
    to evaluate data protection implications and make prudent calls on tightening
    controls, eliminating redundancies, and ensuring compatibility.


    In many companies, there exists a huge disconnect between the security and development
    teams. While the developers are encouraged and incentivized to speed up the software
    creation process, the security team is required to ensure the product is robust
    and has little or no vulnerabilities. As one particular industry report highlighted,
    “Many information security engineers don’t understand software development—and'
