  img_proc: true
- pgno: 281
  md: '# Figure 1  The money trail


    # Bangladesh Bank heist


    In one of the largest cyber heists in history, hackers ordered the Federal Reserve
    Bank of New York to transfer $81 million from Bangladesh Bank to accounts in the
    Philippines.


    # THE MONEY TRAIL


    ![](img/0b22c0cfcb4e18d40f800925f47e42eb_281_0.png)


    *A casino resort owned and operated by Bloomberry Resorts.


    Source: Reproduced courtesy of Reuters. All rights reserved.


    the RCBC. The money was eventually funneled out very craftily from the Philippines
    banking system and into the country''s casinos, thus causing the trail to run
    cold.


    That February 4 had been picked as the day for the heist was hardly a matter of
    chance. Rather, the hackers had carefully chosen this date knowing that February
    4 and 5 (Friday and Saturday) would fall over the weekend in Bangladesh, with
    the following day being a weekend in the United States and the day after, a holiday
    in the Philippines, owing to celebration of the Chinese New Year. This, along
    with their manipulation of Bangladesh Bank''s computer and printer system delayed
    the discovery of the theft and allowed the hackers to quickly channel $81 million
    out of the banking system without leaving a trail. Interestingly, the four accounts
    into which the $81 million was initially transferred had been opened in May 2015
    with an initial deposit of only $500 and remained inactive till the day of the
    heist. On February 9, all but $68,305 of the stolen money was withdrawn from these
    accounts and transferred within the next four days to two casino resorts based
    in the Philippines and a Chinese individual'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'named William Xu, through the remittance firm Philrem. It is here that the
    money trail ran cold, leaving the stakeholders with little recourse as to how
    to recover the stolen funds (Lema & Marshall, 2016; Mahajan, 2016).


    # A “Wake-Up Call” for Bangladesh


    While the heist took place in early February, it was not until March 7 that Bangladesh
    Bank came out in the open regarding the stolen funds, fueling severe backlash
    from the government and civil society alike. From a meager $1 billion in 2001,
    Bangladesh''s foreign exchange reserve had crossed the $25 billion mark in 2015,
    making sound reserve management a feather in Bangladesh Bank''s cap. The soft
    theft, therefore, came as a major blow to the country''s confidence in its Central
    Bank. Faith was further disturbed as it became clear that not only the general
    public, but also the Ministry of Finance had been kept in the dark for almost
    a month regarding the incident. As the Finance Minister Abul Maal Abdul Muhith
    declared to the media that he had known nothing of the theft, severe questions
    were raised about Bangladesh Bank''s professionalism, resulting in the resignation
    of much acclaimed governor Dr. Atiur Rahman and the removal of seven others, including
    two deputy governors (“Forex reserve crosses $25b,” 2015; “Most of the stolen
    funds has not been recovered,” 2016; “The Governor had to step aside,” 2016).


    In the aftermath of the event, Bangladesh Bank came under fire when observers
    questioned whether the stolen funds could have been recovered by promptly announcing
    news of the heist to the international media. While the departing Governor maintained
    that publicizing the heist would serve to create distrust in the country''s financial
    system, many experts believe that suppressing the matter only helped the hackers
    hide their footprint. In the words of Executive Director of Transparency International
    Bangladesh (TIB) Dr. Iftekharuzzaman: “Strict administrative measures and assistance
    from the international media could have helped us trap the funds within the Philippines’
    banking system. Unfortunately, we failed to take advantage of either. Now the
    recovery process will be much more elongated and complex” (“Could the funds have
    been blocked by publicizing the matter sooner?,” 2016).


    However, all debates aside, the heist had clearly been a “wake-up call” for Bangladesh,
    as stated by Dr. Mohammed Farashuddin, former Governor of Bangladesh Bank and
    head of the three-member committee formed by the government of Bangladesh to investigate
    the theft. As later investigations'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'revealed, Bangladesh Bank’s systems had lacked a proper firewall, and the use
    of second-hand $10 switches to connect network computers to SWIFT made it even
    easier for hackers to break into the system. The issue of insider involvement,
    suspected by the Federal Bureau of Investigation (FBI), was unconfirmed by Bangladesh
    police; but investigations clearly showed that three months into the heist, hackers
    were still lurking in Bangladesh Bank’s system, leaving residual risks that needed
    to be addressed. Investigators believed that although such risks may not involve
    further fraudulent fund transfers, the hacker groups could engage in other “malicious
    acts” such as seeking to monitor ongoing cyber investigations or cause other damage,
    the nature of which they refused to clarify in the interest of secrecy. However,
    the need for building a “cyber fortress” a term used by Governor Atiur, was clearly
    evident and Bangladesh had learnt it the hard way, by becoming the victim of the
    first ever incident of fund theft from a Central Bank (Miglani & Quadir, 2016;
    Quadir, 2016c,d).


    # The Philippines—A “Black-Hole” for the Money Transfer


    All but one of the 35 fund transfer requests had been directed to the Philippines,
    making the country a vital link in the grand scheme of the hackers. The four fake
    accounts into which the stolen funds had been transferred had all been opened
    a year before at the Jupiter branch of the RCBC, and investigations by the bank
    and the Philippines Anti-Money Laundering Council (AMLC) both highlighted the
    role of the branch manager, Maia Santos Deguito, in facilitating the heist. Upon
    discovering that its systems had been breached, Bangladesh Bank had sent a special
    message to RCBC on February 9 to “stop payment,” which was reiterated by the bank’s
    head office and conveyed to the concerned branch before the afternoon. However,
    these requests were completely overlooked and the bulk of the stolen funds was
    withdrawn on the same day, leading to the allegation that Deguito had deliberately
    ignored the messages to aid the theft. She was also accused of sanctioning the
    withdrawals without going through the proper authentication protocols, but Deguito
    maintained that she was merely a pawn in a high-stakes game that involved bigger
    players with far greater reach over the financial system (“Could the funds have
    been blocked by publicizing the matter sooner?,” 2016; “The branch manager was
    waiting for Bangladesh Bank funds,” 2016).'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'In addition, the loopholes that had allowed the Philippines to become a black
    hole for the money transfer went far beyond the actions of any individual or bank.
    As the Philippine Secretary of Finance, Cesar Purisima, said in a statement: “The
    exclusion of casinos from the current scope of the anti-money laundering laws
    and a strict bank secrecy law have made it difficult for authorities to track
    the Bangladeshi money trail and identify the perpetrators.” Since 2013, the Philippines
    had been trying to amend its anti-money laundering law to bring casinos under
    legislation. But intense lobbying by the gaming industry had thwarted these efforts,
    making the Philippines a soft target for money launderers. In addition, banking
    secrecy law in the Philippines mandates that all deposits with banks or banking
    institutions should be considered as absolutely confidential and should not be
    examined by any person, government official or office, except upon written permission
    of the depositor. The combination of these factors meant that once the stolen
    money had entered the fake accounts in the Philippines, few questions were raised.
    Furthermore, after the funds had been withdrawn, the casinos, owing to their non-accountability,
    were an obvious destination, causing the money trail to run cold (Chalmers & Lema,
    2016; “Law on secrecy of bank deposits,” n.d.).


    # SWIFT under the Spotlight


    Since its inception in 1974, SWIFT has established itself as the dominant platform
    for global processing of transactional messages, causing it to be labeled the
    “linchpin” of the global financial system. SWIFT is used by 11,000 financial institutions
    across 200 countries and as of April 2016, the average number of messages transferred
    by SWIFT per day stood at over 25 million, 47% of which constituted payment instructions.
    The SWIFT network itself does not handle any funds. Rather, it works by assigning
    each member institution a unique code, which is then used to send payment orders
    between institutions’ accounts, thus completing transactions in a timely and secure
    manner (“SWIFT in figures April 2016,” 2016).


    In the wake of the cyberattack on Bangladesh Bank’s reserve, SWIFT came into the
    spotlight as it became apparent that the hackers had not only used the correct
    SWIFT codes to send the fund transfer requests, but had also hidden their tracks
    by manipulating the SWIFT Alliance Access server software, which banks use to
    interface with the SWIFT messaging platform. Dr. Mohammed Farashuddin, head of
    the probe panel formed by the government of Bangladesh, also criticized SWIFT
    sharply, saying: “SWIFT'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'cannot rule out its responsibility.” According to the primary findings of his
    panel, SWIFT had failed to implement 13 security measures when connecting its
    network to Bangladesh’s real-time gross settlement system in October 2015, thus
    exposing the Central Bank’s systems to potential malware. He also accused SWIFT
    of not providing any necessary technical assistance for protecting Bangladesh
    Bank’s systems from external attacks, thus making the former even more liable
    for the subsequent security breach (Finkle, 2016a; “SWIFT to bear brunt of blame,”
    2016).


    SWIFT’s initial stance on the issue was a defensive one as it maintained that
    the heist was an “internal operational issue” of Bangladesh Bank and that its
    network had not been compromised. “It was, from our perspective, a customer fraud,”
    the Chief Executive of SWIFT, Leibbrandt, commented. However, as it came under
    increasing scrutiny, SWIFT eventually acknowledged that the Bangladesh Bank fund
    heist was one of two incidents in which miscreants had used valid operator credentials
    to submit fraudulent messages through the SWIFT network and then covered their
    trail by tampering with the confirmations that banks rely on to spot suspicious
    activity. At the same time, SWIFT issued a security alert to its customers, reportedly
    for the first time in its four decades of existence, warning them of the need
    to protect their systems and review security protocols. “SWIFT is not, and cannot,
    be responsible for your decision to select, implement (and maintain) firewalls,
    nor the proper segregation of your internal networks. We urge you to take all
    necessary precautions,” the letter said (“Financial messaging service SWIFT says
    banks responsible for own cyber security,” 2016; Grande, 2016).


    While SWIFT’s contention that customers are liable for their own security is not
    unfounded, the fact that the SWIFT network had been instrumental in accomplishing
    the soft theft raised questions about whether the system itself was as impenetrable
    as once believed. From a legal standpoint, SWIFT could escape unscathed; but perhaps,
    the same could not be said of its image and of the faith placed in it by the global
    financial system.


    # A “Lucky Coincidence” for the Fed


    Since the soft theft had been targeted at Bangladesh Bank’s account at the Federal
    Reserve Bank of New York, it naturally raised questions about the accountability
    of the Fed, which holds trillions of dollars in funds for central banks all over
    the world. The immediate response from Bangladesh’s end was a claim for the stolen
    funds and the Finance Minister, Abul Maal'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Abdul Muhith, even mentioned the possibility of filing a lawsuit against the
    Fed. The Fed, however, maintained from the start that it had “acted properly”
    in releasing the funds and that it had no legal liability on the matter. In the
    words of general counsel and executive vice president at the Fed, Thomas Baxter,
    the Fed’s systems “are designed to flag transfers to people and jurisdictions
    subject to sanctions but not to block a transfer if it had passed the authentication
    process on the SWIFT messaging network.”


    On a regular day, the Fed processes about 2,000 fund transfer requests, most of
    which are approved automatically after computer screening. These automatic scanners
    are effective for preventing money laundering and enforcing economic sanctions,
    along with blocking requests containing typographical errors. However, in addition
    to maintaining security, the Fed also has to ensure timely settlement of orders
    in the interest of its customers, meaning that authentic messages like the ones
    sent by the hackers end up getting approved without any scope for manual review.
    Originally, experts believed that this need to ensure rapid fulfillment of instructions
    along with the fact that all Fed customers give it the legal mandate to rely on
    the SWIFT system for authentication purposes could act as strong points for the
    Fed in any lawsuit.


    However, a later investigation by Reuters revealed that the Fed had clearly missed
    some early warning signals and its inertia could have played a rather significant
    role in catalyzing the heist. The payment requests sent by the hackers were exceptional
    in many ways. First, all 35 requests were incorrectly formatted to begin with
    and they were mostly directed to individuals rather than institutions, which is
    rather unusual for such large payments from a Central Bank’s account. Second,
    the flood of requests was another rare phenomenon and this becomes more apparent
    when one considers the fact that over the eight months to January 2016, the number
    of payment instructions sent by Bangladesh Bank to the Fed averaged less than
    two per working day.


    However, it was not all these red flags, but rather a hacker’s spelling mistake
    in typing the name of the Sri Lankan beneficiary and the appearance of the word
    “Jupiter” in one of the requests that first alerted the Fed. Coincidentally, Jupiter
    was also the name of a shipping company and an oil tanker under United States’
    sanctions against Iran and it was this chance occurrence, rather than any deliberate
    measure on the part of the Fed, that prevented the hackers from stealing the entire
    $951 million as originally intended. The Fed did eventually realize that the transactions
    were of an unusual nature, particularly with respect to the beneficiary accounts,
    and proceeded to inform Bangladesh Bank; but its initial oversight, coupled'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'with the fact that it was too slow to react, could well tilt the balance in
    favor of Bangladesh in a potential lawsuit (Das & Spicer, 2016; Layne, 2016; Spicer
    & Finkle, 2016).


    # Not an Isolated Incident


    Although the Bangladesh Bank heist was arguably the first reported incident of
    cyberattack on a Central Bank on such a massive scale, it clearly is not one of
    a kind as far as the global financial system is concerned. According to the leading
    cybersecurity firm, Fire Eye, there have been at least four instances of cyberattacks
    on banks using fraudulent SWIFT messages, one of which dates back to 2013. In
    2015, for instance, Ecuador’s Banco del Austro (BDA) lost $12 million from its
    account at San Francisco–based Wells Fargo as unknown hackers ordered 12 transfer
    requests through the SWIFT network stretching over a span of 10 days. In addition,
    as SWIFT eventually disclosed, labeling the Bangladesh incident as “part of a
    wider campaign targeting banks,” a Vietnamese bank, later discovered to be the
    Tien Phong Bank, had been assailed similarly. Tien Phong Bank is ironically considered
    one of Vietnam’s most technologically savvy banks and cyber experts including
    Europe’s BAE Systems believe that the malware targeted at it was very similar
    to the one used in the Bangladesh Bank heist as well as in the much publicized
    2014 attack on Sony Pictures Entertainment that caused the conglomerate to suffer
    massive losses (Pham, Nguyen & Finkle, 2016; Volz & Wagstaff, 2016).


    Furthermore, while the heist encouraged key stakeholders all over the world to
    take note of the risks to which their systems might be exposed, it has been followed
    by repeated attacks on banks around the world by cybercriminals who seem to be
    getting ever more audacious. In April 2016, for instance, Ukraine’s central bank
    issued a warning, stating that one of the country’s banks had been subject to
    a cyberattack that sought to steal money using fraudulent SWIFT messages. In the
    following month, the websites of as many as four central banks, namely those in
    South Korea, Indonesia, Greece, and Cyprus, were attacked by hackers who had openly
    declared a 30-day campaign targeting Central Banks worldwide. While none of these
    four incidents had resulted in financial losses for the targets, their sheer frequency
    is dizzying, highlighting that the hackers are spreading their footprint everywhere.
    As stated by SWIFT Chief Executive Leibbrandt, “there will be a before and an
    after Bangladesh. This is a big deal and it gets to the heart of banking”'
  merge: -1
  img_proc: true
- pgno: 288
  md: '(Jones & Bergin, 2016; Setiaji, 2016; “Ukraine central bank flagged cyberattack
    in April: memo,” 2016).


    # The Road to Recovery


    After the heist, several recovery initiatives were adopted by Bangladesh Bank
    and the Government of Bangladesh. The newly appointed Governor of Bangladesh Bank,
    Dr. Fazle Kabir, issued letters to the U.S. Federal Reserve, the Philippines Central
    Bank and the Philippines AMLC, requesting an “all-out initiative to recover the
    stolen money.” Following this, a tripartite meeting attended by the highest level
    officials of Bangladesh Bank, the Fed and SWIFT was held on May 10, in which the
    three stakeholders issued a joint statement expressing their “continued commitment
    to work together to normalize operations” and “to recover the entire proceeds
    of the fraud.” The government of Bangladesh also launched multipronged investigations
    and recovery efforts, involving the formation of a three-member probe committee
    headed by Dr. Mohammed Farashuddin and the creation of a separate seven-member
    interagency taskforce, assigned specifically with reviewing legal aspects and
    securing the assistance of relevant stakeholders for return of the stolen funds.
    Help was also requested from the U.S. FBI, and several local and international
    law enforcement agencies, IT security companies, and forensic experts have been
    engaged in a concerted effort to recover the money. As of July 24, 2016, investigations
    were still underway and the government of Bangladesh was waiting for the full
    report of the probe committee to be published before deciding what, if any, legal
    action should be taken against the parties involved (“Government forms taskforce
    to bring back stolen money,” 2016; Sharma, 2016).


    From its end, the Philippines took the heist with much seriousness and the country’s
    Blue Ribbon Senate Committee, after several hearings, identified a total of eleven
    perpetrators, including junket operator Kim Wong, four bankers of RCBC, the owner
    couple and an employee of Philrem, and two Chinese individuals associated with
    Kim Wong. As a result of these efforts, $15 million was recovered from junket
    operator Kim Wong and in September 2016, the Philippines trial court ordered the
    Central Bank of Philippines to return these funds to Bangladesh, declaring the
    latter as the rightful owner. However, as of October 8, 2016, Bangladesh had yet
    to receive those funds as due procedures for repatriating the money were still
    underway (Abdullah, 2016; “BB likely to recover part of $81m hacked'
  merge: -1
  img_proc: true
- pgno: 289
