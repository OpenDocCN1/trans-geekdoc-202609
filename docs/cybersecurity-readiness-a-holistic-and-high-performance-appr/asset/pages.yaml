    budget, and reliance on manual processes. The President’s National Infrastructure
    Advisory Council was tasked with assessing the cybersecurity defense capabilities
    of the public and private sector. Based on a “review of hundreds of studies and
    interviews with 38 cyber and industry experts,” the council came to the following
    conclusion in its 2017 report:


    > > We believe the U.S. government and private sector collectively have the tremendous
    cyber capabilities and resources needed to defend critical private systems from
    aggressive cyber attacks—provided they are properly organized, harnessed, and
    focused. Today, we’re falling short.⁷


    In light of these reports indicating a relative lack of preparedness, organizations
    must commit to improving their preparedness level. They can’t afford to be chaotic
    and disoriented in managing cybersecurity risks. The cybersecurity strategy must
    be aligned and integrated with the overall goals and responsibilities of the organization.
    Effective strategy formulation and execution is contingent on clear articulation
    of vision and organizational goals. Organizations must have in place strategic
    and tactical teams (with cross-functional representation) that will assist with
    supply chain role recognition, risk assessment, cybersecurity strategy formulation
    and alignment, and identification of threat scenarios.


    Following are a set of questions to guide organizational role recognition and
    alignment of cybersecurity goals.


    # Organizational Role Recognition: Guiding Questions


    +   1. Does the leadership recognize the organizational role and responsibility
    within its supply chain and beyond? Is such recognition explicitly documented
    in the cybersecurity strategic plan?

    +   2. Are the organizational goals, mission, and objectives explicitly documented
    in the cybersecurity strategic plan?

    +   3. Is it clearly stated (in the cybersecurity strategic plan) how the cybersecurity
    strategy is aligned with the overall organizational strategy?

    +   4. Is there a cross-functional team in place to assist with supply chain role
    recognition, risk assessment, cybersecurity strategy formulation and alignment,
    and identification of threat scenarios?'
