    **Internet Protocol (IP) spoofing** is another type where the attacker tricks
    the victim into thinking that they are communicating with the intended website.
    Actually, it is a rogue website that is capturing and relaying (to the perpetrator)
    all the information shared by the victim. By modifying the IP address to impersonate
    another computer system, the attacker is able to direct traffic from the victim’s
    machine to their site.²²


