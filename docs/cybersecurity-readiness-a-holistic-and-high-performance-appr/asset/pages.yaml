    # Mary Levins, President, Sierra Creek Consulting LLC, Dacula, Georgia, USA


    This book is a valuable resource for cybersecurity readiness today. Many breaches
    in the past could have been prevented. This book reviews past leadership decisions
    and breach examples to provide an effective approach using lessons learned and
    best practices.


    # Professor Daniel O''Leary, Marshall School of Business, University of Southern
    California, Los Angeles, California, USA


    Prof. Chatterjee’s book is a very pragmatic and comprehensive guide to cybersecurity
    readiness. The governance framework is both powerful and easy to comprehend. Anchored
    on three high-performance security culture dimensions of commitment, preparedness,
    and discipline, the framework presents a set of seventeen cybersecurity success
    factors. Uncovered from analyzing primary and secondary data gathered over several
    years, these success factors encompass people-, process-, and technology-driven
    measures. Numerous breach incidents, presented in the form of vignettes and cases,
    are used to highlight vulnerabilities and lessons learned. The book also provides
    useful resources such as cybersecurity readiness scorecard elements; a list of
    physical, technical, and administrative controls; an information security monitoring
    control guide; an overview of cybersecurity and privacy laws and regulations;
    cybersecurity performance measures; and case studies.


