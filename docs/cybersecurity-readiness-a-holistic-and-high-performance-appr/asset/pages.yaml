- pgno: 89
  md: '# 5.1 Hands-On Top Management


    For cybersecurity governance to be truly effective, top management needs to be
    very hands-on in its approach—from making every effort to learn about the organization''s
    vulnerability points and defense mechanisms to participating in security review
    discussions and proactively engaging with, and serving on, different security
    governance committees. A suggested best practice for the C-suite executives is
    to participate in incident-response simulated exercises, so they can gain a better
    understanding of the types of attacks, the appropriate responses, roles, and cost
    implications. Even though simulated, such firsthand experience can go a long way
    in establishing a top-down security-focused culture.² The 2018 Information Systems
    Audit and Control Association (ISACA) report emphasizes the need for senior leadership
    to serve as champions and evangelists of cybersecurity preparedness. The report
    states:


    > Organizations with successful cybersecurity cultures tend to have C-suite executives
    who reinforce behavioral norms when they lead by example. They appoint—or become—a
    senior-level champion, participate in town hall discussions, allocate budgetary
    support, hire consultants, and do the research to assess the enterprise''s risk
    and capabilities.³


    It is quite alarming when a survey reveals that only 40% of C-level executives
    have an in-depth understanding of cybersecurity protocols.⁴ This finding is consistent
    with anecdotal evidence and other research reports, which suggest that top management
    does not take the lead, ownership, or responsibility in ensuring strong cybersecurity
    governance.⁵ A study involving the healthcare industry confirmed this lack of
    senior leadership attention to data security strategies. The majority of respondents
    said that cybersecurity strategy discussion is never on the board of directors’
    meeting agenda.⁶ Another study reports that despite being briefed regularly on
    cybersecurity state of affairs, board of directors of companies do not act promptly
    or decisively. They are reactive in their stance and approach to cybersecurity
    incidents.⁷


    Senior leadership, especially the CEO, can''t afford to take a backseat when it
    comes to cyber governance. They have to be in the driver''s seat and knowledgeable
    about cybersecurity matters. Ultimately, the CEO is answerable to various stakeholders,
    including governing bodies such as the U.S. Congress. Richard Smith, former CEO
    of Equifax, was called in to testify before the House Energy and Commerce Committee
    and respond to breach-related questions.⁸'
