- pgno: 23
  md: '# Acknowledgments


    I am grateful to many who have directly and indirectly contributed towards the
    development of the book. It has been quite the journey—intellectually stimulating,
    emotionally demanding, physically challenging, and spiritually uplifting. While
    the first version of the book was crafted in the summer of 2019, cybersecurity
    research and teaching have been an ongoing endeavor for almost a decade. Over
    the years, I have presented the research findings at numerous practitioner and
    academic forums around the world and benefitted from valuable and thought-provoking
    feedback. I also had the opportunity to share my insights with the general public
    by conducting expert interviews in print media and on radio and TV.


    Inspiration and motivation often come from the most unexpected quarters. On November
    9, 2017, during a live interview session, Rich Casanova, the host of Pro Business
    Channel, very generously recognized my expertise and efforts to enhance cybersecurity
    awareness and education. I came away from that interview inspired and motivated
    to live up to Rich’s kind words of praise. There is power in words and his surely
    did energize my cybersecurity journey.


    It was truly an honor to be interviewed by hosts and media personalities such
    as Audrey Galex of AIB Network, Condace Pressley of 95.5 FM NewsTalk/WSB, and
    Rose Scott of WABE 90.1 FM (a National Public Radio affiliate). The reflective
    interactions shaped the evolution of ideas for the book.


    I am grateful to Shandra Hill Smith, public relations professional and freelance
    writer, for creating opportunities to share my cybersecurity insights with the
    general public. In her quiet and professional way, Shandra was always looking
    for opportunities to get me in front of different audiences.


    The following are representative of the invitations to present my work at numerous
    practitioner and academic forums around the world.


    +   - London School of Economics and Political Sciences, London, United Kingdom
    (2020)

    +   - The European Information Security Summit, London, United Kingdom (2020)

    +   - Initiative for the Digital Economy at Exeter (INDEX), University of Exeter,
    London, United Kingdom (2020)'
