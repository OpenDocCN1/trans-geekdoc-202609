  md: '# Appendix 2


    # Cybersecurity Performance Measures


    Cybersecurity performance can be measured along different dimensions. Here is
    a sample set of measures that can be suitably modified to meet an organization''s
    needs.


    | Category | Measures |

    |---|---|

    | Business Value Impact | - Dollar amount of damages and losses from security
    breaches

    - Dollar amount of savings from prevention of security attacks

    - Dollar amount spent on resolving security issues |

    | Productivity Impact | - Number of worker hours spent on resolving security issues

    - Number of worker hours lost due to disruption of operations |

    | Nature of Incidence and Frequency of Occurrence | - Number of security breaches

    - Types of security breaches |

    | Extent of Preparedness | - Frequency of review of third-party accesses

    - Percentage of business partners with effective cybersecurity policies

    - Mean-Time-to-Detect and Mean-Time-to-Respond

    - Number of days to deactivate former employee credentials |

    | Audit and Compliance | - Extent of compliance with ISO 27001 guidelines

    - Number of outstanding high-risk findings open from last audit |'
