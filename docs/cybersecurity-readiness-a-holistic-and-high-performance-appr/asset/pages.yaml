- pgno: 280
  md: '# The Soft Theft


    It was not until the morning of February 8, 2016 that officials at Bangladesh
    Bank realized that it had become the unsuspecting target of an unprecedented cyberattack.
    The first sign that something was amiss had appeared on February 5, when officials
    noticed that the printer set up to automatically print all SWIFT wire transfers
    had failed to record the previous day''s transactions. The problem was initially
    dismissed as a regular glitch, but after being unable to access the SWIFT system
    and activate it using alternate methods, Bangladesh Bank discovered a number of
    confirmation messages which had come from the Federal Reserve Bank of New York.
    Struck by the realization that these confirmation messages had been sent in response
    to unauthorized fund transfer requests sent from its network, Bangladesh Bank
    sent messages to six banks, including the Fed, to immediately stop payment. But
    it was all too late for by then, Bangladesh Bank had already been robbed of $81
    million of its reserve (Islam, 2016a; Quadir, 2016b).


    In order to accomplish this act of stealth, unknown hackers had introduced malware
    into Bangladesh Bank''s computer systems and surreptitiously observed the inner
    workings of the bank for weeks to gain knowledge of its fund transfer process.
    On February 4, 2016, they finally made their move, and sent 35 requests to the
    Federal Reserve Bank of New York over the SWIFT network to transfer $951 million
    from Bangladesh Bank''s reserve account. Given that the hackers used the correct
    protocols, the requests seemed authentic at the time and the Fed effected five
    payments, routing $81 million to the Rizal Commercial Banking Corporation (RCBC)
    of the Philippines and $20 million to the Pan Asia Banking Corporation of Sri
    Lanka, as shown in Figure 1 (Spicer & Finkle, 2016). As suspicion brewed at the
    Fed over the nature of these transactions, the remaining 30 orders were blocked
    and so was the transfer to Sri Lanka owing to a spelling mistake by the hackers.
    However, when it came to siphoning away the $81 million routed to the Philippines,
    the hackers made no mistake, leaving the global financial system stunned by the
    craftiness of their planning (Finkle, 2016; Wagstaff & Finkle, 2016).


    Figure 1 shows how the stolen funds disappeared from Bangladesh Bank''s reserve
    account at the Federal Reserve Bank of New York and ended up in the Philippines.
    At first, the hackers sent 35 payment requests to the Fed totaling $951 million,
    of which 30 were blocked and the remaining five were affected. One of these, targeted
    Sri Lanka, was later blocked owing to a spelling mistake. But the remaining four
    were affected, resulting in $81 million being routed to four individuals in the
    Philippines through'
