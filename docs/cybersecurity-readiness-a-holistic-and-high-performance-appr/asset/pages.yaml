  md: 'sign-on, authorization controls using attribute-based policies, adaptive multi-factor
    authentication (MFA), user management, automated customer lifecycle workflows,
    seamless integration with enterprise directories, and access gateways.


    Other forms of access control include requiring employees take mandatory vacations
    and practicing job rotation. When an employee is on vacation, their access to
    networks and systems are suspended and another personnel is assigned to the job
    as a substitute. This approach could often bring to light unauthorized activities
    carried out by the vacationing employee. By periodically rotating personnel from
    one role to another, especially in sensitive positions, it makes it difficult
    for someone to engage in fraudulent behavior for a prolonged period and also cover
    up their digital footprints.


    Remote access must be secured by mandating the use of an authorized virtual private
    network (VPN) service provider, implementing strong password controls and multi-factor
    authentication (MFA). The Wi-Fi networks with the strongest encryption level (e.g.,
    WPA3) should be used. Access credentials of third-party service providers must
    be constantly reviewed and scrutinized.


    Another recommended approach to securing critical data and systems from unauthorized
    access is network segmentation.¹⁸ According to the PCI data security standards,
    credit card holder data should be separated from the rest of network. Similarly,
    point-of-sale systems and databases should be on a completely separate network
    from that accessible by third-party service providers. The Target breach could
    have possibly been avoided if its network comprising of customer systems and databases
    was segregated from other networks that are accessible by Target''s suppliers.¹⁹
    In addition to reducing the probability of unauthorized access, network segmentation
    also prevents single point of failure.²⁰


    Managing administrative privileges is yet another very important access control
    measure. First and foremost, it is a good practice to automate the process of
    reviewing administrative accounts to ensure that only authorized individuals have
    administrative level access. The administrative accounts should only be used for
    elevated activities and not for Internet browsing, email, and other regular user
    activities.


    Multi-factor authentication and encryption are important ways of securing administrative
    access. Strong and unique passwords should also be required for administrative
    level accounts. Dedicated and segregated machines must be used for hosting administrative
    accounts and conducting higher-level system administration functions; such machines
    should'
