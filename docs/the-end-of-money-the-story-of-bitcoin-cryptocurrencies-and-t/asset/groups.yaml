    ## 系列导论


    《新科学家》的即时专家系列书籍揭示了我们都希望了解更多的主题：这些主题具有挑战性，能吸引好奇心强的头脑，并让我们更深入地了解周围的世界。即时专家系列书籍是权威且易懂的入门读物，适合想了解事物运作方式及原因的好奇读者。请留意本系列的其他书籍：


