    the so-called ‘Stalker Attack’. The Stalker Attack was merely hypothetical, because
    the DAO did not exist long enough for an instance of this abuse to ever truly
    occur.


    The Stalker Attack was hypothesized as a situation in which a person attempts
    to split into a Child DAO, perhaps to withdraw their funds. Then, a ‘Stalker’
    jumps into the Child DAO with them, bringing in enough Tokens to have a large
    majority over the person who initially attempted to split. In this new Child DAO,
    with only two people in it, the Stalker can control any vote. They can appoint
    themselves as Curator, and make sure that only they can receive any funds transferred
    out of the Child DAO. The only thing for the victim to do is to split again, into
    another Child DAO. Then, the Stalker follows them again, doing exactly the same
    thing. The victim is trapped forever, as this bully keeps controlling the vote
    and following the victim every time they try to split away.


    According to the developers of the DAO, the Stalker Attack was a ‘non-issue’ because
    there was no motivation for the attacker to do it. The Stalker’s funds would be
    locked up forever along with the victim’s funds, as long as they continued to
    antagonize the victim. What possible logical motivation would anyone have to waste
    their own money harassing someone else?


    To which, nearly anyone might answer – look at the world of politics! Look at
    frivolous lawsuits! Look at real-life stalkers, who spend all their time harassing
    someone else for no material gain! One can think of hundreds of situations in
    which someone with a lot of money and time would cause endless trouble for those
    with less money and time, either waiting for them to slip up, or otherwise give
    in to any number of demands so that the Stalker will let them withdraw their funds.


    But the developers of the DAO, while perhaps quite well educated in the mechanics
    of blockchains (giving their fatal programming error the benefit of the doubt)
    seemed to be terribly uneducated in the mechanics of human nature. And so, whether
    from vulnerability, or from the hazards of overly programmatic democracy, the
    DAO’s failure seemed inevitable.


    While some might argue that it is through this sort of failure that technology
    evolves, the truly odd thing here is that this was not an experiment using the
    risk-hedged money of venture capital. Real investors expect these sorts of gambles,
    and are equipped to take the failure in their stride. However, with experiments
    like the DAO, these failures are conducted using the money of individual supporters
    taken from the internet. In an attempt to escape the rules and power structure
    of corporate capital, experiments in alternative corporations like the DAO risk
    everyday people''s hard-earned money, asking them to believe in an unproven future
    with little mitigation of the risks involved. Crowdfunding experiments are presented
    as democratizing, allowing all to participate equally. But when it comes to the
    blockchain, the bottom of the economic pyramid is being used to weather the storm
    of mistakes, missteps, and just plain old poor judgment, so that eventually, the
    large banks watching from the wings can learn from these errors. A future based
    on this sort of experimentation does not appear as democratic, so much as using
    the crowd to cushion the falls of the powerful.


    ## Conclusion


    When _New Scientist_ magazine published its special report on digital money in
    2014, it seemed like a good idea to list the price of the magazine, in bitcoin,
    on the cover. Alas, it was not to be.


    For a start, there was the issue of giving a fixed price in a currency whose value
    might plummet (or rocket) at any time. And how would the payments be processed?
    At the time, no stockists would accept bitcoin, and the situation hasn''t changed
    much since.


    That pretty much sums up where bitcoin is today, less than a decade since the
    idea for this radical new form of money was first mooted by ‘Satoshi Nakamoto’,
    its mysterious inventor. Interest is growing fast, but its value remains volatile,
    its use marginal, and its infrastructure embryonic. And you can''t yet use it
    to buy much in the ‘real’ world without workarounds or contracts with special
    service providers – scarcely the seamless payment system you might expect, and
    certainly no match for the already ever present cash or cards.


    Bitcoin itself may never rise to this challenge. Its foundations, so daringly
    different to those of traditional currencies, may be too weak to support even
    a small percentage of society''s massive amount of financial activity. It may
    end up limited to an informal existence in the dark side of the internet, or co-opted
    by Silicon Valley and Wall Street, as previous financial innovations have been.
    A more outlandish scenario is that it is adopted by a desperate nation whose currency
    has collapsed.


    But bitcoin is not the only game in town. The real innovation might be what people
    are doing with the core technology. The true value of the bitcoin experiment could
    be as a digital basis for trust: the blockchain, which allows transactions to
    be recorded without reams of paperwork. But dispense with the bureaucracy, and
    you could also displace those who make money by dealing with it.


    By opening up the bitcoin protocol to the world, Satoshi Nakamoto may not have
    democratized finance – so much as given finance a technology as revolutionary
    as internet protocols. Like the internet, what originally seemed radically democratic
    will develop its own, new power structures. If so, it’s not just the billions
    of dollars invested in bitcoin that are at stake, but the very nature of money
    itself.


