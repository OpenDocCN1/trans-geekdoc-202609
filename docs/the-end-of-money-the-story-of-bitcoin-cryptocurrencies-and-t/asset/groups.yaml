    # BOINC


    Others have pursued more ambitious uses for the blockchain. Back in 2002, a team
    based at the spe sciences lab at the University of California, Berkeley, developed
    software called the Berkeley Open Infrastructure for Network Computing, or BOINC.
    Their idea was to harness the power of computers around the world to help a group
    of researchers at the Search for Extraterrestrial Intelligence (SETI) Institute
    sift through radio signals from space to hunt for signs of aliens.


    BOINC allowed them to spread the effort of this search task by chopping up signals
    into small batches and sending them out to individual computers which, when sitting
    unused, would look for signs of alien communication. Once a computer had completed
    one batch, the results were returned to SETI and new batches received. The trick
    was that the search program behaved like a screensaver, only running at night
    or when the computer was idle. Named the SETI@HOME project, it rapidly became
    one of the largest distributed computing efforts in the world. And today BOINC
    doesn’t just look for aliens – the software is now used to hunt for new cures
    for diseases, to map the Milky Way, and even to crack codes.


