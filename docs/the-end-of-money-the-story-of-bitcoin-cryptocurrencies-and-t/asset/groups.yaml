    programmers thought they had found a vulnerability in the

    DAO code, which allowed a Token holder to withdraw their

    own money and pull out of the DAO. It meant a user could trick

    the DAO by asking for withdrawals multiple times, during which

    the DAO would only check the user’s account balance once. This

    attack was not unlike the transaction malleability problem (see

    ‘What is the transaction malleability problem?’, Chapter 4) in

    that by exploiting the bug, an attacker could withdraw double the

    amount of money they actually had in their account. (Although

    from a code standpoint, the two problems were not at all alike.)

    By performing this recursive split attack many successive times,

    a criminal could easily drain the DAO of its cryptocurrency.


    A week after the vulnerability was announced, an attacker

    struck. Nearly $80 million worth of Ether, around a third of

    the DAO’s total holdings, was withdrawn. Those holding DAO

    Tokens, as well as the larger Ethereum community, panicked,

    and the value of Tokens and Ether crashed on cryptocurrency

    exchanges.


    # Saving the DAO


    An immediate and obvious solution was a hard fork of the

    Ethereum blockchain. Because the code for the DAO was

    within the blockchain, it could not just be rolled back to

    reverse the theft. The same blockchain that preserved the DAO

    also made the DAO difficult to alter or update. However, if the

    entirety of the blockchain was rolled back, all the money could

    be refunded to the original investors, and it would be as if the

    theft had never occurred.'
  - '[PAGE 209]


    This solution was ethically troubling for many. A founding idea of Ethereum was
    that code defined existence in the blockchain. If the blockchain could be forked
    any time there was a mistake, what did that mean for the code’s supposed ‘immutability’?
    Even those who had lost money in the theft didn’t like the implications. Then,
    compounding the dispute, someone claiming to be the attacker published a blog
    post in which they criticized the founders of the DAO for their backpedalling.
    The DAO, the attacker claimed, was created to replace law with code, warts and
    all. The attacker hadn’t stolen anything, in their own view. They had merely found
    a legal loophole.’ They had merely played by the inimically broken rules of the
    ‘immutable, unstoppable, and irrefutable computer code’ as lionized by the DAO’s
    founders, and so they demanded their reward. If others suffered losses, that was
    only their own fault for not scrutinizing the code.


    Taunting aside, it turned out that the attacker hadn’t got clean away with the
    money. The nature of the recursive split attack meant that the attacker couldn’t
    just leave with the stolen funds, but had to ‘split out’ using the Child DAO functionality.
    And in using the split function, a waiting period of 27 days was triggered, per
    the original code (meant to give the person splitting into a Child DAO a grace
    period to consider their options).


    Programmers tracking the theft discovered the Child DAO into which the attacker
    had withdrawn the stolen funds; it was simply a forgotten split proposal that
    had been left open. The programmers, collectively calling themselves ‘Robin Hood’,
    then performed the same recursive split attack on the stolen funds, withdrawing
    them into yet another Child DAO, one step down the line. But again, they would
    be locked into a 27-day waiting period, during which time the original attacker
    could strike again.'
  - '[PAGE 210]


    But this endless limbo did suggest another options: a soft fork. In this case,
    the vulnerability could be closed, and if everything was timed right, eventually
    all the funds that were in the hands of Robin Hood and other benevolent attackers
    could likely be returned to their original owners, although the process was complex
    and not sure to work. The benefit of this solution was that the Ethereum blockchain
    would not need to be permanently changed.


    But in the end, all the developers began to agree that the soft fork was a gamble.
    There might be other vulnerabilities in the process that were yet undiscovered.
    The hard fork was really the best option. It would also close the DAO permanently,
    and return all Ether to those who had originally purchased DAO Tokens.


    On 20 July 2016, the hard fork was rolled out. Users of the Ethereum blockchain
    could choose to run the new, forked version of the software, or carry on using
    the old version. The vast majority, over 85 per cent, chose the new fork. All
    the funds from the DAO, now funnelled into that fork, are being returned to their
    original owners.


    But a significant number of Ethereum users did not adopt the fork, and in essence
    split the Ethereum blockchain. As of August 2016, there are now two Ethereum blockchains,
    and two Ether cryptocurrencies. The one that adopted the fork is known as Ethereum
    One, and the blockchain that rejected the fork is called Ethereum Classic. The
    impact of two separate Ethereum blockchains on the DAO is not yet clear.


