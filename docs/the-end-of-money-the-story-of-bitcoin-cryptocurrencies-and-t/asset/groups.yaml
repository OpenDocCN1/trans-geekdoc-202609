    ## A blockchain for anything


    In Dubai there is an innovative new building called the Museum of the Future.
    Its purpose is to show off new technologies that could radically change the way
    lives play out around the globe. Yet experimentation is also one of its most important
    roles. To this end, the museum has created the Global Blockchain Council (GBC),
    a consortium of companies working on blockchain technology, that is developing
    pilot projects to bring it into unexplored areas.


    Financial transactions are only the start. The GBC is also testing the blockchain
    to secure medical records, to provide a chain of custody information for diamonds
    to prevent profit from ''conflict diamonds'', for transferring property records
    and digital wills, and even as a way to offer tourists coupons and incentives.


    The Museum of the Future is not alone in such exploration. Companies and governments
    around the world have been announcing their own technology projects. For example,
    the UK government is running a six-month trial to use the blockchain to manage
    benefits payments. The payments are made in pounds sterling, but the transactions
    are logged in a digital ledger. The government of Estonia is collaborating with
    a company called Guardtime to build a blockchain of citizens’ health records,
    and with another company, Bitnation, to provide a blockchain-based digital notary
    service. Authorities in the Republic of Georgia are building a similar system
    with the company BitFury, a bitcoin mining business, to manage land titles. In
    Sweden, the government is also testing the possibility of a blockchain-based land
    registry in partnership with a company called ChromaWay.


    Other interesting collaborations might bear unexpected fruit. Bosch, the German-based
    engineering company, is working with the ASIC-makers 21 Inc. to explore the future
    for ASIC chips in Bosch’s distributed sensor arrays. The idea is to combine microelectromechanical
    sensors, connected via the internet, with small computers the size of credit cards
    capable of mining bitcoins and processing cryptocurrency transactions. By connecting
    these technologies together, it could be feasible to create a global network of
    sensors organized through a blockchain which can offer its data to anyone who
    needs it, and be paid for this service in cryptocurrency. A proof-of-concept is
    21 Inc.’s Ping21 service. Web hosts must measure the speed of internet traffic
    running through the network to check it is working. To do this they send out test
    messages, or pings. But rather than using dedicated computers around the world
    for this task, Ping21 allows any participating 21 Inc. computer to do the job
    and be paid for it.


    Other companies are also attempting to see if they can harness the blockchain
    to help with real world services. Online letting agency Airbnb recently began
    experiments to use a blockchain as a way to manage user reputations. The company
    relies on reviews left by both renters and landlords so that customers can judge
    how trustworthy potential hosts or guests will be. Storing this information in
    a decentralized blockchain not only frees up Airbnb''s servers, but the data could
    potentially be rented out to other companies using similar business models.


    A blockchain could even help solve a problem for music artists and distributors.
    A startup called Ujo is trying to use the Ethereum blockchain to transform the
    music industry payment system. The aim is to allow musicians and distributors
    to share details of rights and royalties for music tracks online, all within smart
    contracts that automatically license recordings and which take payment each time
    they are played.


    Blockchain technology could also help make digital content more widely available,
    not just easier to control. ZeroNet is an attempt to create not just a decentralized
    DNS system, but an entirely decentralized internet. It aims to side-step the need
    to host websites on servers by stashing website information across the internet
    in small pieces, which can be linked together using a blockchain-like registry.
    This eliminates web hosting costs, and since it integrates a bitcoin payment system,
    users can send payments directly to websites, as the site address doubles as a
    bitcoin address.


    The Interplanetary File System (IPFS) is another attempt to create a distributed
    internet. Using a similar system to a blockchain, IPFS creates an address for
    every piece of content on the system – everything from images, to media files,
    to text. These addresses can be updated by the person who added them to the system,
    updating content as necessary using cryptographic keys. The content itself is
    then stored across multiple computers rather than on a single server. While IPFS
    is not attempting to create the same integration with cryptocurrency as ZeroNet,
    it manages the content more efficiently by using its blockchain-like structure
    to only store the links to the content, not the content itself. This saves space
    and time.


    Of course, the vast majority of these ideas are in the proof-of-concept stage.
    And as failures and flaws continue to emerge in cryptocurrency and the blockchain,
    many of these ideas will sink from sight. Yet it could take just one of these
    schemes to succeed and we could all be using blockchain technology everyday.


    ## Blockchain grid to let neighbours trade solar power


    Something odd is happening on President Street in Brooklyn. While solar panels
    on the roofs of terraced houses soak up sun, a pair of computers connected to
    the panels quietly crunch numbers. First, they count how many electrons are being
    generated. Then, they write that number to a blockchain. Welcome to the future
    of energy exchange.


    This project, run by a startup called Transactive Grid, is the first version of
    a new kind of energy market, operated by consumers, which will change the way
    we generate and consume electricity. Transactive Grid aims to enable people to
    buy and sell renewable energy to their neighbours. To deal in energy at the moment,
    you have to go through a central company like Duke Energy in the US or National
    Grid in the UK, or one of their resellers.


    Transactive can skip this central authority because its energy market is built
    on blockchain technology to create a cryptographically secure list of transactions
    which is continuously updated as each transaction is completed. The list for President
    Street deals with buying and selling electrons generated by solar panels. No central
    authority is in control: the computers monitor each other to stop fraud.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_191_0.png)


    The technology behind bitcoin is enabling a new solar power network.


    The first devices were installed on President Street in February 2016. Other companies
    are hot on Transactive''s heels. Grid Singularity, based in Vienna, Austria, wants
    to bring the same decentralized energy market to developing countries, to help
    distribute solar power.


    MIT start-up SolarCoin pays people with an alternative digital currency for generating
    solar energy, one coin for 1 megawatt-hour of solar electricity. And in August
    2016, a group of neighbours in Busselton, Western Australia, began testing a system
    to trade excess energy from solar panels between themselves using a blockchain
    to record the transactions.


    Article by Aviva Rutkin for New Scientist magazine.

