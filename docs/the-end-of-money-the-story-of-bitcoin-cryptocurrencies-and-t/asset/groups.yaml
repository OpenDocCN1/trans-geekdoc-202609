    manage the site. The sale took place in March 2011, but the problems with hackers
    didn''t stop there. In June 2011, there was another break-in.


    Somehow, a hacker had managed to forge the credentials needed to log into Jed
    McCaleb''s still-active account with full administrator privileges. This gave
    the intruder the ability to artificially boost their account holdings, creating
    100,000 bitcoins where none existed before. They couldn''t fool the bitcoin blockchain,
    but they didn''t need to. The fake bitcoins only existed in the internal accounting
    of the Mt. Gox website. When users traded currency on Mt. Gox, they transferred
    bitcoins to the Mt. Gox public address, which tracked their balances internally
    as they bought and sold. The exchange then sent bitcoins out of the Mt. Gox wallet
