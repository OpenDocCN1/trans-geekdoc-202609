    份提交索赔的处理结果，向该已关闭交易所的前客户释放大约 200,000 枚“发现”的比特币。关于他们的调查，未发布进一步信息。Mt. Gox 不光彩的系列事件似乎仍在继续。


    其他加密货币交易所也遭到黑客攻击，黑客入侵计算机系统窃取备份文件，或者冒充所有者致电交易所的托管公司，要求重置管理员密码。其他在线钱包公司直接消失，带走了客户的比特币。将困扰
    Mt. Gox 的问题置于互联网本身的更广泛背景中也很重要。互联网安全是一项艰巨的业务。目前每年在网络安全上的支出估计为 800 亿美元。尽管如此，根据 2016
    年 RAND 公司的一份报告，仅在过去一年，就有大约 6400 万美国人的个人数据被泄露。


    ## 加密绑架者


    另一个困扰加密货币的问题是勒索软件——一种恶意软件，在支付一笔款项之前会阻止访问计算机系统。虽然勒索软件攻击最早出现于 1989 年，但 2013 年一种新一代勒索软件开始普遍，利用公钥加密和比特币。第一个此类程序名为
    CryptoLocker，它会加密受感染计算机的全部数据，然后呈现一个带有...的弹出窗口。

