    ## Series introduction


    New Scientist''s Instant Expert books shine light on the subjects that we all
    wish we knew more about: topics that challenge, engage enquiring minds and open
    up a deeper understanding of the world around us. Instant Expert books are definitive
    and accessible entry points for curious readers who want to know how things work
    and why. Look out for the other titles in the series:


    - How Your Brain Works

    - The Quantum World

    - Where the Universe Came From

    - How Evolution Explains Everything About Life

    - Machines That Think

    - Why The Universe Exists

    - Your Conscious Mind


    ## About the author


    Adam Rothstein is a writer and theorist on tactical and strategic uses of technology,
    focusing on historical deployment and social effects. He is a chronicler of future
    technologies, and experiments with radio waves, media waves, and the rift between
    institutional and insurgent technological approaches. He writes for a variety
    of publications, and his book Drone was published in 2015 by Bloomsbury Publishing.
    He is on Twitter @interdome.


    ## Introduction


    Take out a piece of money. A banknote, made from paper and maybe some plastic,
    wrinkled from being shoved in pockets or wallets. You can exchange it for goods
    or services, or put it in the bank for a rainy day. You know how much it''s worth.
    If you give it to someone else, they know too. It can''t get much simpler than
    that, right?


    Starting in 2008, money became more complicated. Something called ‘cryptocurrency’
    was invented, and in a short span of time it swept into the global consciousness.
    The name of this cryptocurrency was bitcoin, and – depending on who you asked
    – it was either the brave new future of money or a menace to the world economy.


    To the uninitiated, bitcoin can be baffling and even scary. What is it? Who controls
    it? Who uses it, and why? Lurid headlines about cybercrime, embezzlement, drug
    trafficking, money laundering, corruption, murder and even the overthrow of governments
    have tainted its reputation. There is an element of truth to that shady reputation.


    But there is another side to the story too. Cryptocurrencies may really be the
    future of money, and there are many good reasons to think that would be an improvement
    on what we have now.


    The core innovation of cryptocurrency is a technology called the blockchain. You’re
    going to read a lot about that in this book. The blockchain promises to be a disruptive
    technology in extremis, capable of transforming not just how money works but many
    other things too, from the law to democracy.


    After cryptocurrencies were released into the world, we began to consider money
    as a technology. And that technology is sweeping out widely into the future, catching
    millions upon its bleeding edge. On the way to those possible futures we''ll encounter
    some near-future innovations, such as internet-aware appliances, decentralized
    banks, and even autonomous corporations.


    This Instant Expert guide will introduce this new concept of money as a digital
    technology. It will paint the broad strokes of what a cryptocurrency is, how it
    came to be, and where the blockchain might be going next. Along the way, we’ll
    travel from the dark alleys of the internet to the penthouses of global finance.
    We’ll get into the details of cryptographic mathematics, and explore the often
    strange bitcoin subculture. We’ll talk about what makes the money in our pockets,
    what makes the economies of nations, and about what might change these notions
    for good.


    Predicting the future of money is like trying to get rich gambling on horse races.
    But by the end of this book, you’ll be in as good a position as anyone to visualize
    what’s coming over the horizon.

