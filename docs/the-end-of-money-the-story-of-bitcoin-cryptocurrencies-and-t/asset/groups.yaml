    up such an elaborate scam – faking emails, creating stories of relationships and
    work that never happened – only to trap himself against something he knew he could
    not deliver? Wright claimed to O''Hagan that he had lost his nerve. He said he
    was afraid that if he proved he was Nakamoto, he would be arrested for drug trafficking
    or terrorism charges due to something someone had done with the cryptocurrency
    after he invented it. O''Hagan described this fear as certainly a real risk, but
    still, it is just one more riddle in a maze of riddles.


    According to most cryptocurrency followers, the mystery of Satoshi Nakamoto is
    still unsolved.


    ## Revamping bitcoin – and the rise of altcoins


    > Bitcoin could be in trouble. It can’t keep up with the number of transactions.
    Will any of the proposed solutions be successful, or will one of the growing number
    of alternative cryptocurrencies take over?


    ### Bitcoin''s growing problems


    Bitcoin has a problem. It cannot get big enough. The crypto-currency is facing
    problems of scale that Nakamoto didn''t envision, as the number of users increase
    and the blockchain grows longer.


    As new transactions are reported to the blockchain, they are compiled to form
    a new block and written to the blockchain every ten minutes or so. However, the
    block size is limited. Only 1 MB of transactions can be written every ten minutes.
    This limits bitcoin to an average of seven transactions per second. That sounds
    like a lot, but VISA’s payment network can process 24,000 transactions per second.
    Baked into the code of bitcoin is a limitation that means it could never rival
    a major credit card system, no matter how popular it gets.


    Many bitcoin developers, such as Gavin Andresen, the ringleader of the Bitcoin
    Core development group, want to fix this problem by making the block size larger.
    Andresen created an update called bitcoin XT, which would increase the block size
    to 8 MB, and double the size again on a revolving basis.


    But bitcoin has a second problem. It is decentralized, and so even the core developers
    have no control over what software is being used. If a computer on the network
    is using bitcoin XT, it will create blocks that are 8 MB. But a computer running
    the previous version of the software won''t be able to understand a block that
    big. It will only understand blocks created by the older version, and it will
    continue to create 1 MB blocks itself. This will lead to a situation called a
    ‘fork’.


    A fork, typically a term used to describe when the development of programming
    code splits into two separate versions that are no longer identical or compatible,
    in this case refers to the blockchain itself. There would be two versions of the
    blockchain – one made and recognized as valid by the bitcoin XT computers, the
    other used by the original software version. These blockchains would no longer
    cohere. Such a state would be chaos, of course. The bitcoin network, kept together
    only by its single, canonical blockchain, would cease to exist. Bitcoin would
    be split into two different cryptocurrencies, effectively.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_159_0.png)


    FIGURE 11.1 Two different halves of the same network. One produces a blockchain
    that includes both small blocks and big blocks. The other side sees the same blockchain,
    except that it cannot see the big blocks, only the small blocks. Therefore, it
    creates a second blockchain, without any big blocks at all.


    To prevent a disastrous fork, the software update is designed to wait until a
    certain date, and then poll the network. If at that time, 75 per cent of the network
    or more is using bitcoin XT, then it will consider it ''accepted'' and switch
    to the larger blocks. 75 per cent is considered large enough of a majority, that
    it would force the laggards to update as well, in order to continue to use bitcoin
    services provided by exchanges and other services. The network votes.


    When the software ''voted'' in January 2016, only 10 per cent of the network was
    using the update. The reasons were varied. Some bitcoin users didn''t like the
    update from a technical basis, arguing that there were better ways of fixing the
    block size problem. Others didn''t like the way that the update was ''forced''
    onto bitcoin, and argued against it as a matter of principle. This debate drew
    in a number of powerful figures and companies into both sides of the debate. And
    then, it seems a hacker-for-hire began attacking computers running bitcoin XT,
    taking them offline. Many companies and individuals rolled back to the previous
    version just to avoid being attacked.


    ### A possible fix: Segregated witness


    The block size is still a problem, but there is a novel solution in the works
    to help fix it. And the fundamental cleverness of this fix is that there is no
    possibility of a fork, and therefore a vote like bitcoin XT''s is not necessary.


    The disjunction between bitcoin XT and bitcoin is known as a ''hard fork'', but
    a ''soft fork'' is possible as well. Whereas a hard fork introduces incompatible
    differences between the new version and the old version, essentially splitting
    the cryptocurrency in two, a soft fork changes the cryptocurrency but still allows
    communication between older versions and newer versions of the software. The software
    update is backwards compatible – computers that do not upgrade do not get shut
    out of the network, they merely do not benefit from the upgrade.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_161_0.png)


    Is there a fork in the road ahead for bitcoin?


    It was originally thought that to increase the block size, a hard fork would be
    necessary. But this new update strategy, known as ‘Segregated Witness’, gets around
    the problem. Rather than increasing the size of the block to accommodate more
    transactions, it decreases the size of the transaction by reducing the amount
    of information reported to the blockchain. All the cryptographic information that
    signs the transactions – ensuring that the cryptocurrency can only be moved by
    the person holding the secret key to a particular wallet – is kept in a separate
    tree of information. Once their credentials are approved, a very short message
    is sent to the blockchain, along with the transaction. This is where the name
    ‘Segregated Witness’ or ‘SegWit’ comes from: the cryptography that witnesses that
    the signatures are legitimate is kept separate from the blockchain. The Witness
    merely gives the blockchain a cryptographic ‘thumbs up’, and then the transaction
    proceeds. By drastically shortening the amount of information reported

