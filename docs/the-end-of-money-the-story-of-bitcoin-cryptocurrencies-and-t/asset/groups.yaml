  - '[PAGE 207]


    It turned out that the DAO was susceptible to its own sort of 51% Attack (see
    ‘Proof-of-work, Chapter 4). If one person managed to get 51% of the DAO Tokens,
    they could automatically control any vote that took place. The attacker could
    submit a proposal that said, in essence, ‘give me all of the DAO’s money’, and
    then it would provide the majority vote to approve the plan.


    To prevent this a number of defence protocols were created. First, a role of ‘curator’
    was added. Held by a real person, the job was to personally approve every outbound
    payment. Second, it was decided that important votes (anything more than a straw
    poll) would be conducted in two parts. The first would be a vote on the question
    at hand, either to approve or deny the proposal. Then, the vote would come back
    to the Token holders again, giving them the choice to either accept the outcome
    of the first vote, or choose to split. If they accepted the outcome (whether they
    voted yes or no), they would remain in the DAO. If they chose to split, their
    Tokens and accompanying voting rights would be transferred to a ‘Child DAO’, exactly
    like the original DAO in every way, but separate. In other words, the split function
    gave the shareholders the opportunity to secede from the DAO if they ever disagreed
    with a vote.


    Almost immediately, complications emerged. First, among a number of different
    proposals put to the Token holders of the DAO in the first few weeks of its existence,
    not a single one was able to achieve a quorum. The quorum was determined algorithmically,
    but at a minimum it needed to be 20 per cent of the Token holders. Yet most proposals
    garnered just 10 per cent voting at most. Some blamed this on technical difficulties
    with voting. Others thought that many Token holders had bought them as an investment,
    and weren’t interested in the principles of the DAO or in participating in its
    management. Indeed, the price of the Tokens had skyrocketed as Tokens had been
    sold,'
