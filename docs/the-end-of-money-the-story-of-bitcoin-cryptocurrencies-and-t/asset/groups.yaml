    ## Bitcoin：基础知识


    比特币究竟是什么？如何获得比特币？又可以用它购买什么？


    ### 比特币究竟是什么？


    比特币是一种称为加密货币的新型数字货币。它不受银行控制，也不由国家政府背书，而是由去中心化的计算机网络使用软件解决数学问题来生成。它依赖一种称为区块链的加密技术。它是第一个也是最大的加密货币，尽管现在存在许多加密货币。


    ### 如何使用比特币？


    比特币不是实体。它们不像美元或欧元那样铸造成纸币和硬币。相反，比特币存储在一个称为钱包的数字文件中。这个钱包用于向他人发送比特币，使用智能手机或计算机上的软件。


    ### 如何获得比特币？


    有多种方式。第一种是“挖矿”。你可以设置计算机来执行维持加密货币所需的加密计算。这样有机会赢得少量比特币。这就是加密货币最初的分发方式。然而，今天，挖矿竞争如此激烈，如果没有大额投资，通过这种方式获得任何比特币都非常困难。或者，你可以支付“云挖矿”服务的费用，由他人为你进行挖矿。


    获得比特币的另一种方式是面对面地从已经拥有比特币的人那里获得。例如 localbitcoins.com 这样的服务可以连接那些想要将比特币兑换成美元或欧元等传统货币的个人。


    获得比特币的另一种方式是通过交易所，它们允许你将一种货币——美元、英镑、欧元、元或比特币——转换为另一种货币，就像任何其他外汇兑换一样。Mt. Gox（参见第
    7 章）曾经是全球最大的交易所，直到 2014 年倒闭。2016 年底，按交易量计算的最大交易所是 BitMEX。


    最近，一些服务开始允许客户将其银行服务与加密货币托管服务关联，使他们能够存入比特币并以美元或英镑等本地传统货币消费，反之亦然。这样的服务示例包括 Coinbase
    和 Bitpay。


    最后，一种直接获得比特币的方法是接受比特币作为商品和服务销售的交换。Stripe 和 Paymium 等公司提供服务，帮助商家在其业务中接受加密货币。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_17_0.png)


    图 1.1 比特币符号由中本聪在发明加密货币后不久创建


    2013 年 12 月 中国人民银行禁止比特币交易。随着中国资金流出，价格下跌。


    2013 年 4 月 塞浦路斯银行危机导致比特币激增，压垮了主要交易所并导致突然抛售。


    2014 年 6 月 - 7 月 Expedia 和 Dell 等企业开始接受比特币，价格反弹至 600 美元。


    2016 年 7 月 比特币价值自 2014 年初以来首次达到 750 美元，但再次暴跌，部分原因是 Bitfinex 交易所发生安全漏洞，导致价值 7200
    万美元的比特币被盗。


    2016 年 11 月 在美国总统选举的不确定性中，比特币价格再次上涨至 700 美元以上。


    2015 年 12 月 在经历了一个稳定的年份后，比特币在 2015 年底走高，受到中国交易所交易激增的推动。


    2015 年 1 月 比特币价值跌至 214 美元的低点，导致人们宣布加密货币死亡。


    2016 年 6 月 比特币价值激增，受多种因素推动，包括对英国可能脱欧的担忧、对区块链的乐观情绪以及对比特币需求的增加，尤其是来自中国的需求。


    2013 年 11 月 中国资金开始涌入。美国参议院一次会议将虚拟货币称为“合法金融服务”，最终导致当月末价格达到 1,242 美元的峰值。


    图 1.2 高点与低点：比特币持有者必须做好承受价格波动的准备


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_18_0.png)


    ### 用比特币可以买什么？


    在比特币的早期，人们能用它购买的东西不多。第一个主要接受比特币支付的市场交易的是毒品和其他非法服务。今天，许多大型企业直接接受比特币，对于忠实的比特币用户，像
    Coinbase 或 Bitpay 这样的卡片整合服务允许客户在任何信用卡交易中使用比特币。


    ## 2 比特币的诞生


    2008 年，一个并不存在的人有了一个想法。到 2011 年，这个想法价值超过 5400 万美元。这是一种极其新型货币发明的故事。


    颠覆世界的金融创意通常不会凭空出现在电子邮件收件箱中。因此，密码学家 Adam Back 在 2008 年 8 月收到来自“中本聪”的一封电子邮件，提议一种虚拟货币的新想法时，并没有太在意。在
    1992 年创建以来，Back 一直关注的 cypherpunk 邮件列表上的许多人，都提出过只存在于计算机中的货币的想法。Back 没有花太多时间考虑这个特定概念，尤其是来自一个不知名的人。


    这是任何人第一次听说 Nakamoto，这个名字据信是由不知名的个人或集团编造的。这个想法——当时尚未经过测试和验证——被称为比特币。不到三年后，当中本聪从互联网消失时，所有比特币的总价值超过
    5450 万美元。但加密货币的发明者从未被确切识别。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_22_0.png)


    比特币发明者“中本聪”的身份是一个谜。


    当中本聪消失时，他用于这种新型货币的开源软件代码已被重写了太多次，以至于很难说中本聪是比特币的作者。估计，目前使用的比特币计算机代码中，不到三分之一是由中本聪编写的。就像互联网组成的许多其他事物一样，现实是比特币现在属于所有人，也不属于任何人。


    ### 92.9 亿美元 所有比特币的总价值（2016 年 8 月）


    像比特币这样的奇怪想法在 cypherpunk 世界的计算机科学家、程序员、数学家和活动家中很常见，他们设计了许多复杂的方案来确保技术隐私。基于经验，他们对被赞誉为“下一个大事”的想法持怀疑态度。因此，有一段时间，比特币似乎可能只是另一个将湮没无闻的想法。比特币不是第一个虚拟货币的想法，之前的任何方案都没有取得成功。


    ### 真正的中本聪请站出来？


    已有许多尝试揭露比特币创始人化名背后的真人。但都失败了。


    - 2011 年 10 月，《纽约客》记者约书亚·戴维斯（Joshua Davis）指出，计算机科学家迈克尔·克利尔（Michael Clear）可能是中本聪，依据是其密码学背景、使用地道的英国英语，以及在首次被问及时不过分否认（后来他完全否认了）。


    - 次日，*Fast Company* 杂志的亚当·L·佩嫩伯格（Adam L. Penenberg）表示不同意。他认为，中本聪必定是三位密码学家之一——尼尔·金（Neal
    King）、弗拉基米尔·奥克斯曼（Vladimir Oksman）或查尔斯·布赖（Charles Bry）——他们的名字出现在一份密码学专利申请中，该专利是在中本聪注册第一个
    bitcoin.org 网站前三天提交的。但这些关联最终被证明是巧合。


    - 2012 年，比特币论坛上的用户暗示，**Jed McCaleb**（比特币交易所 Mt. Gox 的创始人）可能是中本聪。


    - 在这个时期，其他论坛上的帖子暗示了一个阴谋论，即比特币可能是由美国中央情报局或国家安全局创立的，目的是引诱毫无戒心的罪犯。


    - 2013 年，在非法暗网购物网站丝绸之路（Silk Road）的创始人罗斯·乌尔布雷希特（Ross Ulbricht）被捕后，两位以色列研究人员得出结论，乌尔布雷希特必定是中本聪。


    - 2014 年 3 月，*Newsweek* 记者利亚·麦格拉夫·古德曼（Leah McGrath Goodman）抛出了一个重磅说法，即比特币创始人的真名
    *就是* 中本聪，尽管他使用名字多里安（Dorian）。她的说法基于多里安·中本聪（Dorian Nakamoto）的编程经验，以及他在硅谷长期居住。


    - 在对多里安·中本聪说法的广泛驳斥中，*Forbes* 记者安迪·格林伯格（Andy Greenberg）调查了比特币代码贡献者哈尔·芬尼（Hal Finney）是真正中本聪的可能性，但很快就否定了这一想法。


    - 纳撒尼尔·波珀（Nathaniel Popper）2015 年的书 *数字黄金*（Digital Gold）暗示，尼克·萨博（Nick Szabo）——密码朋克、比特币投资者，以及早期虚拟货币
    BitGold 的发明者——是中本聪。萨博公开否认了这一说法。


