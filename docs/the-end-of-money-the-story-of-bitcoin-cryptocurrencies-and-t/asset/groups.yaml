    到区块链上，预计 SegWit 可以使每个区块支持的交易数量达到目前可能数量的近四倍。


    真正的好处在于，运行旧版本比特币软件的计算机不会看到来自 SegWit 的“点赞”，但它们将继续看到区块链中的交易。这些交易看起来会很奇怪——比特币仿佛凭空出现，没有任何签名。但由于这些奇怪、神奇的比特币只有在网络的
    SegWit 部分允许时才能被添加，它们将继续保持同样安全。因此，即使只有部分网络运行 SegWit，整体网络仍将从改进的效率中受益。更大的区块大小可能仍然必要，但这种改进的效率将为比特币提供急需的喘息空间。2016
    年底，比特币交易率接近每个区块 2,000 笔，平均每秒约 3.3 笔——换句话说，运行在大约一半的容量。那些看好比特币未来的人希望这种容量能尽快扩展。


    但致力于 SegWit 更新的开发人员认为，软件中的其他改进将使网络中的计算机有动力进行更新。交易总体上将更快。最重要的是，SegWit 有助于解决“交易可塑性”问题，该问题曾被指责导致
    2014 年 Mt. Gox 崩溃（参见“交易可塑性问题”，第 7 章）。当签名的轻微更改导致区块链上的交易 ID 与预期不同时，就会发生该错误。由于签名被移入
    SegWit，交易 ID 现在完全不同，这种可塑性不再可能。支持者认为，仅摆脱这一众所周知的漏洞，就足以激励用户更新他们的软件。


    但这仍有待观察。2016 年 7 月，SegWit 代码正处于审查期。之后，它将提供给网络。届时，网络才会决定采取哪条路径。


    ## 闪电网络


    并非所有人都相信区块大小问题真的是个问题。一个名为闪电网络的新想法可能使整个问题变得无关紧要。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_163_0.png)


    闪电网络可能拯救比特币。


    一位用户授权一定数量的加密货币用于与另一特定用户的交易——类似于支付定金开立订阅账户。该交易保持开启状态，仅在这两个用户之间共享。随着时间的推移，许多增量交易被记录，向一方或另一方发送比特币，直到最终耗尽授权的定金金额。然后，交易关闭，并发送到区块链。它只在区块链上记录一次，作为一笔交易，尽管有任意数量的较小交易被汇总为这一笔交易。


    例如，想象一个月每天买一杯咖啡。与其在每次交易后都通知区块链，闪电网络允许买家和咖啡店只在月底报告总交易，同时仍保持安全。


    它保持安全的方式是，每笔增量交易都必须得到每个用户的批准。如果在任何时候他们未能达成一致，流程将停止，分歧发生前的总额将返回给每个用户，并且信息会记录到区块链。由于交易仅在这两个用户之间进行，他们同时的一致或不同意可以立即记录。风险水平较低，因为一次只能将少量加密货币放入此开放交易中，并且每一步都必须得到双方的同意。


    截至 2016 年中，闪电网络仅是一个实验，许多细节尚未制定。同样，它需要 SegWit 或类似的更新来修复交易可塑性问题。它还需要一些目前仅为理论的额外技术手段。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_165_0.png)

    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_165_1.png)

    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_165_2.png)


    图 11.2. 网络中的两台计算机打开一笔交易，就像一个小盒子。交易在其中逐步累加，直到耗尽交易的全部价值，然后关闭并发送到网络。每笔小额交易都表现为一项小协议，需要两台计算机的同意。


    闪电网络和其他创新想法表明，尽管比特币已有几年历史，但其演变仍在继续。这种加密货币可能会变得面目全非，这取决于分布式网络决定接受什么样的更改。


    ## 世界上最大的加密经济体


    2013 年中，当美国公司努力简化将资金转入 Mt. Gox 的流程以便客户购买比特币时，一家名为 BTC China 的中国交易所与移动服务提供商腾讯达成协议。中国公民首次可以将资金直接转入比特币交易所。几个月后，2013
    年 11 月，比特币达到有史以来的最高价格，交易价高达 1,242 美元。中国对比特币的兴趣激增。


    中国比特币泡沫最终破裂，当时政府发出警告，称银行将人民币直接转移到加密货币企业是非法的。这意味着仅几个月后，腾讯就不得不停止与 BTC China 的服务，冷却了公众的兴趣。但中国人对加密货币的胃口已经被打开，最终中国将增长到代表绝大多数交易所交易量和挖矿，并且可能也拥有相当大比例的比特币所有权。


    2016 年，两家中国交易所——火币和 OKCoin——负责了 92% 的比特币交易。前四大挖矿池（拥有 76% 的全球算力）位于中国并由中国拥有。有些人试图将中国人对比特币的热情解释为规避中国货币管制的一种方式。中国法律规定，个人每年不能汇出超过
    5 万美元价值的人民币。但中国比特币投资者否认这一点——他们说货币管制已经有很多漏洞，并且他们认为中国人购买比特币纯粹是出于投资角度。中国有很强的赌博文化，比特币巨大的牛熊周期对寻求大回报的人有吸引力。


    此外，必须指出，中国在非传统支付方式方面拥有更多经验。欧洲人和美国人可能对使用手机作为支付方式的明显不安全性感到不安，但在中国，临时支付安排已经司空见惯。早在
    2012 年，中国的在线支付就已超过 660 亿美元，到 2015 年增长至 1.3 万亿美元。今天，支付宝声称拥有 4 亿活跃用户，腾讯的微信支付基于智能手机的支付系统拥有超过
    3 亿用户。而在世界其他地方，加密货币的陌生方面可能会让用户犹豫不决，但在中国情况不同。


    随着比特币似乎将在中国长期存在，中国政府正在考虑修订，以便更广泛地使用加密货币。像美国政府一样，他们似乎准备将比特币视为商品而非货币。


    在中国之外，加密货币支持者担心中国的兴趣会对加密货币本身产生什么影响。挖矿控制实际上就是网络控制，就“投票”支持新软件更新而言。拥有网络 76% 处理能力的这些挖矿池控制着
    76% 的投票权。但尽管比特币实际的“去中心化”控制相当失衡，目前看来，它团结在确保加密货币保持有价值和相关性的想法周围。

