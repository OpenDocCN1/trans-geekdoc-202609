    In its heyday in 2013, bitcoin’s value peaked at around $1,200 per coin. Not surprisingly,
    the cryptocurrency was feted as the ‘future of money’. Today, with bitcoin’s value
    halved, media interest has also waned. Yet all kinds of businesses, along with
    city investors and futurists have found something else about the technology to
    get excited over – in particular, the potential of the blockchain itself.


    The blockchain is, of course, the central innovation that allows cryptocurrencies
    to function (see ‘The blockchain’, Chapter 4). But this shift in attention has
    occurred as people working with the technology have realized that the blockchain
    might be good for a great many things besides cryptocurrencies.


    It turns out that a digital, decentralized ledger is useful for handling all kinds
    of information, from business contracts or private financial records to sensitive
    healthcare data. And people are scrambling to determine what might best be kept
    in the blockchain, and whether that blockchain should be attached to bitcoin,
    another cryptocurrency, or something completely different. Most surprisingly,
    this research is not just coming from tiny startups or libertarian hackers. Some
    of the most ambitious projects are being run by mainstream financial institutions
    such as major banks. They are determined to understand the true potential of this
    powerful technology, and not be left behind any financial revolution.


    # Blockchains as research tools


    One criticism of bitcoin is that maintaining a large network generating hash,
