    年 6 月，当局关闭了 CryptoLocker 控制的僵尸网络，但估计该勒索软件获利高达 2700 万美元。随后出现了一波仿造勒索软件。攻击变得如此普遍，以至于某些版本拥有在线帮助网站，为不了解情况的人提供如何购买比特币支付赎金，以及如何在支付后解密文件的信息。根据
    FBI 报告，2016 年对勒索软件而言是丰收年，仅头三个月就获利超过 2.09 亿美元。


    增长的一个关键原因或许是，勒索软件设计师正在寻找预算更高的特定目标。CryptoLocker 是随机传播的，低额赎金明显是针对普通家庭和办公电脑设计的。然而，2016
    年出现多起医院直接遭受定制勒索软件攻击的案例，这类软件旨在将医疗记录和关键处方信息作为人质扣押。2016 年 2 月，加州好莱坞医院（Hollywood Hospital）遭到勒索软件攻击，据报道医院官员支付了
    17,000 美元以解密关键记录。


    Mt. Gox 的事件让加密货币名声扫地，本可能成为它们的终结。然而，Mt. Gox 关闭后，其他交易所接过了业务。与 2013 年底和 2014 年市场动荡相比——当时比特币价格在
    150 美元低点和 1200 美元高点之间波动——2015 年是交易平静的一年，交易量稳定，价格在 200 美元至 300 美元之间。2016 年价格再次上涨，到
    7 月已超过 600 美元（参见第 1 章的图 1.2）。


    或许，对加密货币寿命最有力的证明是，它们成功度过了这场风暴，并来到了另一边，企业、消费者和政府仍对加密货币的未来持有兴趣。


    ## 8 比特币渐入成熟


    从地下起步开始，世界上最著名的加密货币正在走向主流。比特币银行业务已经到来，加密货币技术正被纳入金融机构和政府的长期战略。那么，它在日常生活中的使用为何仍然有限？


    加密货币技术正成为全球金融机构（包括银行、投资机构乃至各国政府的经济计划）中期战略的一部分。投资者正直接向加密货币投入资金，同时也试图利用传统公司和银行提供的新型加密货币关联服务。尽管丝绸之路（Silk
    Road）和 Mt. Gox 这样的失败开端令人担忧，但许多人相信这些技术能从根本上改变我们使用金钱的方式——并且合法地做到这一点。


    但加密货币本身只是数字金融技术这个崭新世界的开端。区块链正从单纯作为货币的技术支撑转变为支持银行自身机制，包括房地产交易、各种电子转账服务，或许有一天，连整个公司都在其中。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_110_0.png)


    比特币 ATM 机仍属罕见。


    ### 你可以买什么？


    对加密货币最常见的批评之一是，它们永远无法取代传统货币，因为作为日常支付手段毫无用处（参见下方方框“比特币一日”）。在加密货币最常见的市场还是暗网非法毒品网站的日子里，这当然是事实。但今天呢？加密货币的使用已扩展到合法商业领域，但这足以让它取代英镑、美元、欧元和人民币的日常使用吗？


    ### 比特币一日


    2014 年 2 月，《新科学家》杂志记者哈尔·霍德森（Hal Hodson）试图只使用比特币而不使用其他货币。他发现了什么？


    我的一个三度 Facebook 好友迈克尔·焦维诺（Michael Giouvino）同意卖给我价值 150 美元的比特币，用于前往纽约的旅程。我告诉他，我打算开车过去，途中在新泽西一家浴场停留，然后进入城市购买一些杂货，囤积在我女友的公寓里。自
    2012 年以来一直持有约 600 个比特币的焦维诺轻笑一声。“你打算怎么做？”


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_112_0.png)


    花费加密货币的一种方式。


    啊，我明白了。燃料是比特币自驾游中最大的障碍。美国只有两家加油站接受它——一家在科罗拉多州，另一家在新罕布什尔州——都不在我的路线上。相反，我尝试了一种涉及电子礼品卡和沃尔玛的复杂变通方法，但失败了。算了。旅程过半，我至少为自己找到了燃料。我在
    TGI Friday''s 吃了一份大汉堡和薯条，用通过第三方网站用比特币购买的礼品卡支付。


    在新泽西郊区，一家税务办公室附近，有一家俄罗斯浴场——一家 banya。Bear and Birch 浴场由前高盛股票交易员彼得·基赞科（Peter Kizenko）经营。里面，你穿上泳衣，和几位脾气暴躁的俄罗斯人一起忍受炙烤般的高温。有一束用胶带缠住柄的白桦小枝，你可以将其浸泡在冰水中，然后抽打自己。这一切只需
    0.03 个比特币。


    “开始接受它再简单不过了，”基赞科躺在浴场门廊上说道。两年前，他离开莫斯科的高盛工作，创办了这家浴场，因为他怀念祖国的 banya。税务局办公室可能就在附近，但比特币应如何纳税仍不清楚。基赞科不担心，部分原因是这部分收入占比太小，他还说，记录每笔交易的公开区块链将使合规变得轻而易举。


    但基赞科表示，虽然接受这种货币很容易，但用它做其他事情，比如兑换成美元，就没那么简单了。最近，当局关闭了多家交易所，以此为基础开展业务风险太大。


    浴场之后，我前往布鲁克林的 Greene Ave Market。这是一家 24 小时营业的有机杂货店，使用比特币支付可享 9 折优惠，是纽约为数不多接受该货币购买实物商品的地方之一。店员
    Ali 掏出手机，给我发来一串作为商店比特币地址的数字和字母。我转账 6.017 个比特币后，他打电话给老板确认款项已到账。其他顾客瞟向我，对这笔奇特的交易感到不安。在
    Bear and Birch 更简单，我只需扫描一个条形码。


    目前，考虑到过去一年它所受到的关注，纽约市接受比特币的商户出人意料地少。布鲁克林的一家名为 Puppy Paws 的遛狗生意接受比特币，靠近河边的一家名为
    Lean Crust 的披萨店也接受，一家名为 EVR 的酒吧也是如此。少数法律事务所、牙科诊所和房地产中介也接受它。不过，在整个旅途中，“你接受比特币吗？”这个问题通常会得到困惑的眼神。


    后来，我前往华尔街中心的新比特币中心，它夹在传统金融的大楼之间。爱好者们经营着他们自己的比特币交易大厅，名为 Satoshi Square，以这种货币神秘的创始人命名。我造访的那个晚上，讨论话题是以太坊（Ethereum），一个面向虚拟货币的新平台。


    站在前沿的人无需被说服——对他们来说，革命已经来临。但当你在纽约市几乎只能买比特币披萨时，你知道比特币还有很长的路要走。


    ### 经日本从美元到比特币


    在比特币早期，加密货币所能实现的最明显的商业模式之一是交易所。在 Mt. Gox 出现之前，除了挖矿，获取比特币的唯一方式就是临时从另一个用户那里购买。Mt.
    Gox 创建了第一家货币交易所。

