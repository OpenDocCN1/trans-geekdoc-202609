    已因从丝绸之路窃取非法加密货币而被起诉。关于琼斯的说法，目前尚未获得外部证实。


    与此同时，尽管针对乌布雷希特的刑事诉状中列出了从 CAPTCHA 泄露和 ''altoids'' 在线帖子中获取的信息，并将其作为 FBI 识别 DPR 的证据，但后来显然，Tor
    网络至少曾被攻破过一次。2014 年，卡内基梅隆大学的研究人员与国防部合作，攻破了足够多的 Tor 节点，暴露了一名名叫布赖恩·法雷尔的 IP 地址。随后，FBI
    利用这些信息起诉了法雷尔，指控他参与运营丝绸之路的一个继承网站。尽管 Tor 项目现在声称已修复了这个特定漏洞，但一直有猜测认为，也许这个漏洞利用也被用于对原丝绸之路的调查。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_92_0.png)


    丝绸之路及其众多仿效网站已被美国当局关闭。


    使用比特币在线贩卖毒品，虽然并非万无一失，但似乎仍是一个足以诱使他人铤而走险的赚钱大生意。在丝绸之路之后，几个仿效网站应运而生。有些已被当局关闭，另一些显然是诈骗，而仍有其他网站延续至今，在网上贩卖毒品和其他非法服务，迄今为止一直躲避着在互联网暗网中追捕他们的警察。


    ## 接下来？


    在加密货币和区块链技术的简短历史中，媒体一直为这些工具是在互联网黑客领域发明的事实而着迷。但是，加密货币本身并不违法。事实上，通过加密货币进行的犯罪数量与在常规法定货币市场中发生的犯罪数量相比，微不足道。


    标题背后才是真实的故事。将货币和商业交易演进为确保技术保障的个人隐私新水平的理想主义梦想已经实现，但很快就遇到了贪婪与治理的严酷现实，因为加密货币的价值增长到了数十亿美元，并继承了传统货币的一些问题。程序员和政府监管者至今仍在试图理清围绕加密货币的技术和法律复杂性。但在所有这些复杂性中，蕴藏着一个新想法的核心。而这个新想法，无论多么复杂、政治化、危险或有缺陷，都不会消失。经过这场烈火考验，加密货币应运而生，或许比以往任何时候都更强大，新投资者已准备好遵守规则（参见“通过邮寄的比特币”和“比特币会计师”，第
    8 章）。


    ## 恐怖海盗罗伯茨的传说


    罗斯·乌布雷希特（又名“恐怖海盗罗伯茨”）对抗法律的行动如此嚣张，以至于他看起来像个最具传奇色彩的人物。有些人将他视为现代罗宾汉。在丝绸之路上的众多书面文告中，DPR
    肯定在他的粉丝和支持者中推广了这一传奇。这使他与比特币的匿名创造者形成对比，后者消失了，而不是成为一个可能损害其创造物的神秘怪人。


    丝绸之路的用户深信不疑。用户将 DPR 与切·格瓦拉相提并论，赞扬他创造了就业，甚至加入了丝绸之路读书会，讨论政治、经济、法律等主题的书籍。当然，所有这些都带有自由主义倾向。


    丝绸之路就像一艘在互联网公海上漂浮的海盗船。丝绸之路的管理员是允许出售什么的唯一仲裁者。丝绸之路政策很明确——只有“无受害者”的物品可以交易。这意味着该网站主要集中在毒品和伪造身份证上。非法色情、武器或赃物被禁止。为了确保每个人都能得到他们期望的产品质量，用户自己在“信任”系统中对交易进行评分，这与
    eBay 或其他商业网站类似。该系统旨在识别骗子，并防止卧底警察冒充卖家或买家。


    但对客户和卖家的审查流程并不如人们所期望的有效。到 2011 年 11 月，警方已从丝绸之路上进行了超过 100 次卧底购买，导致多名被捕。这至少让警方得到了两名丝绸之路管理员，他们将自己的账户交给了警方，警员随后利用这些账户完全渗透了该网站。


    事后看来，罗斯·乌布雷希特似乎并不像他自以为的那样浪漫冒险，而是理想主义且天真。乌布雷希特并非十足的老罪犯，至少起初不是。他的最初犯罪是种植一小批迷幻蘑菇，并想出一种在网上出售它们的方法。但这最终导致了他的垮台。


    ## 艰难的 Gox 学校


    *每月有数百万美元佣金收入的加密货币交易所 Mt. Gox 肯定是太大而不能倒闭。或者说，真是这样吗？*


    ### 比特币交易所


    在加密货币世界的早期，技术缺陷普遍存在。虽然比特币本身的代码证明具有弹性，但买卖比特币所需的交易所基础设施却没有那么安全，使其易受黑客攻击。


    Mt. Gox 是 2011 年丝绸之路推出时主要的比特币网页交易所，最初是在其创始人杰德·麦卡莱布仍掌控时遭到黑客攻击。盗窃额微不足道，但这次攻击让麦卡莱布意识到该网站有多脆弱。这一事件是他决定将
    Mt. Gox 出售给帮助管理该网站的程序员朋友马克·卡佩莱斯的主要影响。交易于 2011 年 3 月完成，但黑客问题并未就此结束。2011 年 6 月，又发生了一次入侵。


    不知何故，一名黑客设法伪造了登录杰德·麦卡莱布仍处于活跃状态的账户所需的凭据，拥有完整的管理员权限。这使入侵者能够人为增加其账户持有量，在原本不存在的情况下创造出
    100,000 个比特币。他们无法欺骗比特币区块链，但也不需要。这些假比特币仅存在于 Mt. Gox 网站的内部账簿中。当用户在 Mt. Gox 上交易货币时，他们将比特币转移到
    Mt. Gox 的公共地址，该地址在内部跟踪他们在买卖过程中的余额。当用户希望提取资金时，交易所会将比特币从 Mt. Gox 钱包发送回用户。由于一笔仅存在于
    Mt. Gox 系统内的新财富出现，黑客开始快速出售，导致该交易所比特币价格暴跌。仅 30 分钟，价格就从 17.50 美元暴跌至 0.01 美元。


    Mt. Gox 有一项安全措施：每次通过区块链从网站钱包转出的比特币价值不得超过 1,000 美元。但由于价格被人为压低，这比以前多出了许多币。攻击者提取了资金，从
    Mt. Gox 转出了 2,000 个比特币——这些是 Mt. Gox 金库中的真实比特币，而不仅仅是 Mt. Gox 账户软件的虚构数字。随着抛售后价格反弹，这些比特币的价值远超
    1,000 美元。一个月后，这笔钱可能价值 13,000 美元。


    攻击的结果是一片混乱。价格暴跌又反弹，数百名 Mt. Gox 用户以为自己捡了便宜，用真实美元换取了假比特币。Mt. Gox 不得不关闭以审计其交易所账户并删除假比特币。这让用户陷入恐慌，不确定自己的账户是否仍然活跃、资金是否被耗尽，或是遭受了其他形式的破坏。此外，黑客将入侵期间窃取的数据发布到互联网上，增加了混乱程度。


    最终，Mt. Gox 理清了一切，删除了人为崩溃后发生的交易记录，并用自有资金偿还了丢失的比特币。但这对交易所和整个加密货币来说都是一次打击。尽管比特币一直完全按照其预期方式运行，但如果最大的比特币交易所容易受到价格操纵和盗窃，这对其未来意味着什么呢？


    ### 交易所的倒闭


    尽管遭受黑客攻击并几乎不断面临技术问题，马克·卡佩莱斯仍试图让 Mt. Gox 运转下去。到 2013 年 3 月，他已有 18 名员工，包括负责领导业务的人员，而他本人则处理网站的功能。卡佩莱斯是唯一能够批准代码更改（包括重大安全修复）的人。


