  - '[PAGE 233]


    **Transactions** Bitcoin transfers are written as transactions on the blockchain,
    and are submitted for inclusion in newly solved blocks.


    **Transaction malleability problem** A flaw in bitcoin''s software, that enables
    an improperly formatted transaction to be accepted by the blockchain, then responding
    with an unexpected transaction ID. If the software is not aware of this unexpected
    transaction ID, it will often attempt to process the transaction again, resulting
    in duplicate transactions.


    **Wallet** The private key of a cryptocurrency account. The wallet signs all transactions
    submitted to the blockchain, and links all the public addresses together.


    **Virtual currency** A virtual currency is a currency that''s existence is entirely
    digital.


    **Vitalik Buterin** The creator of Ethereum.'
