    In late 2015, _Wired_ magazine and online site _Gizmodo_ get a tip and a trove
    of leaked documents that point to Australian programmer Craig Wright. He initially
    denies it, but in the spring of 2016 Wright then claims that he is Nakamoto, and
    that he created bitcoin along with his since-deceased associate Dave Kleiman.
    Although he is able to present a significant amount of proof, it is not enough
    to satisfy many sceptics, and so the mystery lingers still. (For more on this,
    see Chapter 10.)


    # The first bitcoin


    Nakamoto didn''t give up after one email. After contacting Back, Nakamoto posted
    his idea to a public email list about cryptography. Next, he posted it on a website
    called the P2P Foundation, which accepted submissions of all kinds of peer-to-peer
    technology projects. One person who thought the idea had some merit was Hal Finney,
    a programmer who had worked on Pretty Good Privacy, a free encryption software.
    Intrigued by the distributed, cryptographic aspects of bitcoin, Finney worked
    with Nakamoto on the code. He also received the first bitcoin ever sent, from
    Nakamoto in early 2009. It was worth a pittance then.


    Slowly and surely, bitcoin began to take off. Two budding programmers, Gavin Andresen
    and Martti Malmi, liked the idea and helped Nakamoto build a website and improve
    the bitcoin code. They invented the term ‘cryptocurrency’ to describe a virtual
    currency built around cryptography. They set up a forum in the autumn of 2009
    for the nascent community of cryptography geeks, libertarians and programmers
    who were interested in the strange possibility that an idea for a decentralized
    currency might actually work.'
  - '[PAGE 26]


    The more the developers tweaked the code, experimented with it, and ran it through
    its paces, the more it seemed like it could become more than just an idea. The
    code worked. It was resilient. As more people downloaded the software and set
    their computers to perform the tasks necessary to generate the currency, the more
    solid it appeared.


    If the technical aspects of bitcoin were looking good, other aspects were still
    lacking. By the beginning of 2010, there was still no good way to buy bitcoins,
    nor anything to buy with them – there were just a few small websites that sold
    a selection of bitcoin goods, such as stickers and T-shirts. There was one famous
    incident in April 2010 when an enthusiast named Laszlo Hanyecz got someone in
    the forum to send two pizzas to his house in exchange for 10,000 bitcoins, but
    that was hardly a reliable means of ordering pizza.


    # Going viral


    In July 2010, the popular tech news aggregator, Slashdot, bumped a story about
    bitcoin to its front page. Downloads of the program jumped nearly sevenfold. Bitcoin
    was going viral, but there was still no way for all these interested people to
    get hold of any.


    The bitcoin network distributes new bitcoins in return for performing tricky ‘proof-of-work’
    calculations (see Chapter 4). In those early days, when a computer running the
    software solved one of these ‘blocks’, it got a reward for the effort; 50 new
    bitcoins were created and added to the user’s virtual wallet (see ‘The world of
    currency mining’, Chapter 5). This also solved the problem of where the money
    ‘comes from’, because there is no central bank to distribute it.


    Back when there were only a few computers on the network, claiming this reward
    wasn’t hard. Since Satoshi Nakamoto’s'
  - '[PAGE 27]


    computer was often the only one on the network for most of the cryptocurrency''s
    first year, his wallet accumulated an estimated one million bitcoins in block
    rewards. But as more and more people started running the software, the **difficulty**
    of solving blocks increased (see ‘A digital arms race’, Chapter 5). There were
    so many people doing the proof-of-work, it became rare for an individual computer
    plugged into the network to win a block. It was almost like winning a lottery.


    At this point, bitcoins were still very cheap. When individuals traded them for
    cash, they were worth only a few cents each. These trades were done on an ad hoc
    basis, in forums and by email. If there was no system to readily get hold of even
    a few dollars'' worth of bitcoins, how would anyone ever be able to use them as
    a currency? People needed to be able to buy them in quantity at market rates,
    and they had to be accepted in trade for goods.


    # Does it matter who Satoshi is?


    *The identity of bitcoin’s founder is one of the biggest mysteries of the internet.
    But does it matter who he or she really is?*


    Not only is Satoshi Nakamoto a historical figure, responsible for the creation
    of a massive digital storehouse of value, but he likely controls a significant
    part of that value. Experts estimate that the bitcoin he owns is worth over $600
    million dollars. And regardless of the exchange value, that currency will be nearly
    5 per cent of the total cryptocurrency in the bitcoin system, once it reaches
    full capacity. Whoever controls that portion of the cryptocurrency, certainly
    wields a substantial amount of power over it.


    But many proponents of cryptocurrencies are happy that he has never been conclusively
    identified. Without a founder, there is no Henry Ford or Steve Jobs, no major'
  - '[PAGE 28]


    figure to deliver pronouncements about the direction that development should take.
    Instead, anyone who can come up with an idea is just as capable of pursuing it
    and selling it to the public at large.


    This doesn''t stop the insatiable curiosity about Satoshi''s identity. It is rare
    to have a public figure so shrouded in mystery, who just disappears without a
    trace. What does he think about the development of cryptocurrencies? Where did
    the idea come from? What sort of things is he doing now? It is possible we will
    never know.


    # The exchange


    Among the many people who discovered bitcoin was Jed McCaleb, co-creator of the
    peer-to-peer file-sharing program, eDonkey. Using an old domain name from an abandoned
    project related to the Magic: The Gathering card game, he started a bitcoin exchange
    called Mt. Gox. There, anyone could buy and sell bitcoins for real US dollars,
    in a price that fluctuated according to market demand. With the added publicity
    from Slashdot, Mt. Gox took off as the first real cryptocurrency exchange.


    It was now possible to buy bitcoins for dollars. But there was still nothing to
    buy with them. That changed in the beginning of 2011 due to two events.


    In December 2010, after whistleblower website WikiLeaks leaked classified information
    from the US government


