    the vicinity of large hydroelectric generators or geothermal energy sources, for
    example, or in locations close to the Arctic where cooling the hard-working processors
    can be as simple as opening a window. For example, cloud mining company Genesis
    Mining started out with sites in Bosnia and China but is now based in Iceland,
    thanks to its cheap electricity, cold climate and fast internet links.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_77_0.png)


    No picks and shovels: these energy-hungry processors are mining bitcoins.


    ### A distributed currency with central control


    Although cryptocurrency was designed to be distributed across the internet, the
    realities of the mining process mean it has evolved to become increasingly centralized.
    A handful of pools now control the vast majority of the global hashrate of bitcoin
    and these pools distribute much of the new funds generated. It seems that the
    economic advantage of centralized industry and large-scale production has been
    enough to drive most of the small mining companies and pools out of business.


    Cloud mining is now even looking to court mainstream investors. Genesis Mining
    has launched the first bitcoin mining fund registered with the U.S. Securities
    and Exchange Commission, offering investors securities in a mining-based fund
    called the Logos Fund. As risky and complex as cryptocurrencies can be, there
    is a growing number of people willing to put down large amounts of money in order
    to play that risk.


    There is another sense in which centralization is a good thing. As the technology
    in any field develops, new developments can rapidly increase efficiency. Based
    on a rate of watts-per-hash-generated, an ASIC can be more than 18 million times
    as efficient in energy consumption as a single CPU. When mining on a vast scale
    this efficiency means lower electricity bills which could make a huge difference
    to the bottom line, and makes the bitcoin network less wasteful overall.


    ### How much electricity do miners use?


    The energy consumption of mining cryptocurrencies like bitcoin is not small. Extrapolating
    from one measured rate of energy consumption for the first ASIC-mining machine
    released in 2013, the global hashrate for bitcoin at that time would have consumed
    over 482,969 megawatt-hours per year. That is the equivalent of over 44,000 average
    US homes.


    Using figures for ASIC-mining machines released in mid-2016, the electricity consumption
    for bitcoin seems to have increased substantially to 3.36 million megawatt-hours
    per year, or the equivalent of over 307,000 average US homes. Note, however, that
    this is a power increase of only 7 times, despite a global hashrate some 184 times
    higher than in 2013. A mining pool utilizing ASICs may put small-scale miners
    out of business, but it certainly helps save large amounts of electricity in the
    process.


    ### Size really does matter


    But scale does bring its own problems. The larger the pool, the more it tends
    to draw hacking attacks. One study shows that 63 per cent of large bitcoin pools
    have come under attack from hackers, while only 17 per cent of smaller pools have
    been targeted. By staying under the radar, small pools may be avoiding some of
    the troubles experienced by larger pools.


    There is also some concern in the mining community over the extent to which having
    mining centralized in large pools could create problems for the future of a cryptocurrency.
    The collective of individuals working to update the code for bitcoin are attempting
    to solve certain problems with regard to how well the currency scales to more
    users (see ‘Nakamoto’s successors work on revamping the bitcoin’, Chapter 11).
    But for a software update to be accepted, everyone in the network has to agree
    to the update. This serves as a form of voting: when a majority of the network
    has updated to a new version, it is considered to be accepted, and the old version
    is phased out. However, if the new version is not accepted, developers have to
    go back to the drawing board.


    Currently, the pools that control the majority of the bitcoin network have been
    sceptical of recently proposed software changes, and have turned them down. Cultural
    differences between different pools may also be playing a role here – many pools
    are in China, for example, while most of the software developers are in the US.
    And there is some concern that if a conservative instinct takes hold and updates
    are resisted, in the long term the currency might stagnate.


    Of course bitcoin is only one cryptocurrency among many, although it is the biggest
    in value and in network size. Miners will often switch the currency they mine
    on a daily or hourly basis. And while it is unlikely that bitcoin will fall from
    the top of the heap, new blockchains are always being introduced. In 2016, for
    example, two new sorts of blockchains, Ethereum and Ripple, have emerged and surpassed
    a horde of other cryptocurrencies to become the second and third largest by market
    capital behind bitcoin. As the economic and technological conditions governing
    the mining process continue to evolve, so too will the status quo.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_81_0.png)


    FIGURE 5.2 The gains from mining cryptocurrencies varies widely.


    Total value of block rewards and transaction fees paid to miner, USD


    ## 6 Assassins and drugs: Spending bitcoin in the early days


    From their inception, cryptocurrencies have been associated with the criminal
    underbelly of the internet. This is epitomized by tale of Silk Road, the first
    cryptocurrency marketplace, and the downfall of its founder, Dread Pirate Roberts.


    The news stories sound like the plot points of a conspiracy thriller. Murder for
    hire. Drug trafficking. Embezzlement. Fraud. Money laundering. Corruption. Market
    manipulation. The environment at risk. Governments on track to be overthrown.
    ‘Bitcoin is evil’, says a Nobel Prize-winning economist in the pages of the New
    York Times. ‘Malware turns hacked computers into slaves that ‘mine’ new digital
    currency’, reports tech publication Quartz. One of CNN’s many headlines on bitcoin
    read, ‘Bitconned: SEC busts alleged bitcoin Ponzi scheme’. Forbes magazine reported,
    ‘FBI says it’s seized $28.5 million in bitcoins’.


    ### Silk Road


    By far the largest flirtation between bitcoin and criminality was Silk Road. In
    this story, we see the ideal of an anonymous, non-governmental currency pushed
    to its breaking point. We see how a seemingly normal second-hand book salesman
    picked up a life sentence in federal prison. He became the centre of a huge FBI
    dragnet; the target of a massive operation spanning numerous US federal law enforcement
    agencies. None of this would ever have happened without bitcoin.


    ### Timeline: The path of Silk Road


    - January 2011 Ross Ulbricht develops Silk Road, a marketplace for illicit substances,
    and begins quietly advertising it on bitcoin and drug forums. Bitcoin is trading
    around 30 cents.

    - June 2011 Gawker publishes a story about Silk Road. Price of bitcoin hits new
    high of $30.

    - August 2011 Silk Road generates $30,000 worth of commissions in one month.

    - December 2011 FBI and other law enforcement agencies purchase more than 100
    shipments of drugs from the site, gathering information and making arrests.

    - March 2012 Silk Road generates $90,000 worth of commissions in one month.

    - November 2012 Silk Road begins paying protection money to hackers who threatened
    to shut down the site with a distributed denial-of-service (DDoS) attack.

    - January 2013 After site administrator Curtis Green is arrested in a sting operation,
    Ross Ulbricht allegedly attempts to have him killed, unaware that he is hiring
    an undercover DEA agent to do so.

    - July 2013 Ulbricht’s own personal account receives nearly $20,000 per day in
    Silk Road commissions. Law enforcement learns this as they close in on Silk Road
    servers in Iceland.

    - October 2013 After connecting an email account owned by Ulbricht to internet
    posts involving Silk Road, agents arrest him at a San Francisco public library.
    They seize his computer, which is logged in to Silk Road administrator accounts.

    - May 2015 After a trial in which he claims he was framed, Ulbricht is convicted
    and sentenced to life in prison.

