    例如，靠近大型水力发电机或地热能源的地方，或者靠近北极的地区，在那里给辛苦工作的处理器散热可以简单到打开一扇窗户。例如，云挖矿公司 Genesis Mining
    最初在波黑和中国设有站点，但现在总部设在冰岛，归功于其廉价的电力、寒冷的气候和快速的互联网连接。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_77_0.png)


    不需要镐和铲子：这些耗电量大的处理器正在挖掘比特币。


    ### 一种带有集中控制的分布式货币


    虽然加密货币的设计初衷是在互联网上分布，但挖矿过程的现实意味着它已演变为越来越集中化。少数几个矿池现在控制了比特币全球哈希率的绝大部分，这些矿池分配了大部分新产生的资金。看来，集中化行业和大规模生产的经济优势足以将大多数小型挖矿公司和矿池挤出市场。


    云挖矿现在甚至开始争取主流投资者。Genesis Mining 推出了第一个在美国证券交易委员会注册的比特币挖矿基金，向投资者提供名为 Logos 基金的挖矿类基金证券。尽管加密货币可能风险高且复杂，但越来越多的人愿意投入大笔资金来承担这种风险。


    集中化在另一个意义上也是一件好事。随着任何领域技术的发展，新进展可以迅速提高效率。基于每生成一个哈希所耗瓦特的比率，ASIC 的能耗效率可以比单个 CPU
    高出超过 1800 万倍。在大规模挖矿时，这种效率意味着更低的电费，这对最终利润可能产生巨大影响，并使比特币网络总体上不那么浪费。


    ### 矿工使用多少电力？


    像比特币这样的加密货币挖矿能耗并不小。根据 2013 年发布的第一台 ASIC 挖矿机的测得能耗率进行外推，当时比特币的全球哈希率年耗电量将超过 482,969
    兆瓦时。这相当于超过 44,000 户普通美国家庭的用电量。


    使用 2016 年中期发布的 ASIC 挖矿机的数据，比特币的耗电量似乎已大幅增加到每年 336 万兆瓦时，或相当于超过 307,000 户普通美国家庭的用电量。但是请注意，尽管全球哈希率比
    2013 年高出约 184 倍，但电力增加仅 7 倍。利用 ASIC 的矿池可能会让小规模矿工倒闭，但这无疑在过程中帮助节省了大量电力。


    ### 规模确实很重要


    但规模确实会带来自身的问题。矿池越大，越容易招致黑客攻击。一项研究表明，63% 的大型比特币矿池曾遭到黑客攻击，而只有 17% 的小型矿池被攻击。通过低调运作，小型矿池可能避免了一些大型矿池遇到的麻烦。


    挖矿社区也担心，将挖矿集中在大型矿池中会对加密货币的未来造成多大问题。致力于更新比特币代码的个人群体正试图解决关于货币如何良好扩展到更多用户的某些问题（参见《中本聪的继任者致力于改造比特币》，第
    11 章）。但要使软件更新被接受，网络中的每个人都必须同意该更新。这充当了一种投票形式：当网络的大多数更新到新版本时，即被视为接受，旧版本将被淘汰。但是，如果新版本未被接受，开发人员必须重新打草稿。


    目前，控制比特币网络大部分算力的矿池对最近提出的软件更改持怀疑态度，并已将其拒绝。不同矿池之间的文化差异也可能在此发挥作用——例如，许多矿池位于中国，而大多数软件开发人员位于美国。还担心，如果保守观念占据主导地位且更新遭到抵制，从长远来看，该货币可能会停滞不前。


    当然，比特币只是众多加密货币中的一种，尽管它在价值和网络规模上都是最大的。矿工通常会每天甚至每小时更换挖掘的货币。而且，虽然比特币不太可能跌出领先地位，但新的区块链不断被引入。例如，2016
    年，以太坊和瑞波两种新型区块链出现，超越了大量其他加密货币，仅次于比特币成为按市值计算的第二大和第三大加密货币。随着管理挖矿过程的经济和技术条件不断演变，现状也将随之改变。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_81_0.png)


    图 5.2 挖掘加密货币的收益差异很大。


    支付给矿工的区块奖励和交易费总价值，美元


    ## 6 刺客与毒品：比特币早期的花费方式


    从创立之初，加密货币就与互联网的犯罪地下世界联系在一起。丝绸之路（Silk Road，第一个加密货币市场）及其创始人戴德海盗（Dread Pirate Roberts）的覆灭，便是这一现象的典型代表。


    新闻报道听起来像是阴谋惊悚片的情节要点。雇凶杀人。贩毒。挪用公款。欺诈。洗钱。腐败。市场操纵。环境面临风险。政府面临被推翻的命运。“比特币是邪恶的，”一位诺贝尔奖经济学家在《纽约时报》上说道。“恶意软件将被入侵的计算机变成‘挖矿’新数字货币的奴隶，”科技出版物《石英》报道。CNN
    关于比特币的众多标题之一写道，“被比特币骗：SEC 捣毁涉嫌比特币庞氏骗局”。《福布斯》杂志报道，“FBI 表示已查获 2850 万美元的比特币”。


    ### 丝绸之路


    比特币与犯罪之间最大规模的勾连莫过于丝绸之路。在这个故事中，我们看到匿名、非政府货币的理想被推向了极致。我们看到一个看似普通的二手书籍销售人员是如何被判处联邦监禁终身的。他成为了庞大
    FBI 围捕网的核心；成为一场横跨众多美国联邦执法机构的大规模行动的目标。如果没有比特币，这一切都永远不会发生。


    ### 时间表：丝绸之路的路径


    - 2011 年 1 月 Ross Ulbricht 开发了丝绸之路，这是一个非法物质交易市场，并开始在比特币和毒品论坛上悄悄宣传。比特币当时交易价格约为
    30 美分。

    - 2011 年 6 月 Gawker 发布关于丝绸之路的报道。比特币价格创下 30 美元的新高。

    - 2011 年 8 月 丝绸之路一个月产生了 3 万美元的佣金。

    - 2011 年 12 月 FBI 和其他执法机构从该网站购买了超过 100 批毒品，收集信息并进行逮捕。

    - 2012 年 3 月 丝绸之路一个月产生了 9 万美元的佣金。

    - 2012 年 11 月 丝绸之路开始向威胁要通过分布式拒绝服务 (DDoS) 攻击关闭该网站的黑客支付保护费。

    - 2013 年 1 月 网站管理员 Curtis Green 在一场诱捕行动中被捕后，Ross Ulbricht 涉嫌试图让人杀死他，他不知道自己雇佣的是一名卧底缉毒局特工。

    - 2013 年 7 月 Ulbricht 自己的个人账户每天从丝绸之路获得近 2 万美元的佣金。执法部门在冰岛逼近丝绸之路服务器时了解到这一情况。

    - 2013 年 10 月 在将属于 Ulbricht 的电子邮件账户与涉及丝绸之路的互联网帖子关联后，特工在旧金山公共图书馆逮捕了他。他们查获了他的电脑，该电脑已登录丝绸之路管理员账户。

    - 2015 年 5 月 在一场他声称自己被陷害的审判后，Ulbricht 被判有罪并判处终身监禁。

