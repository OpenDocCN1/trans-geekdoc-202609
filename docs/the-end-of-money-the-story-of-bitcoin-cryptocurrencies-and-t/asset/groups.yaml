    Two months later, another idealist decided to put bitcoin’s ability to bypass
    government influence to the test. A person who identified himself only as ''Dread
    Pirate Roberts'' started a website called Silk Road, the goal of which was to
    create an Amazon-like marketplace for illicit and illegal products, with a general
    ideology of thwarting government control. Taking a philosophy of only selling
    ''victimless products'' (drugs and forged government documents were okay while
    weapons, illegal pornography, and stolen identities were not allowed), the site
    was visible only to users connecting with the address-anonymizing software called
    TOR. This masked the only currency accepted on Silk Road was bitcoin.


