    2013 年 6 月，一个独立的 FBI 调查团队从 Silk Road 网站上发现了本应被隐藏的一段信息。一种用于防止机器人向 Silk Road 发送错误登录的工具，名为
    CAPTCHA，泄露了 Silk Road 服务器所在位置的 IP 地址：冰岛。DPR 及其同伙身处远方。用户、管理员和服务器仅通过 Tor 的加密层连接，在互联网上彼此隔离。但在
    CAPTCHA 泄露之后，FBI 找到了服务器的位置。他们携带外交函前往冰岛，获取了服务器的副本。这为他们提供了寻找并最终定罪 DPR 的关键证据来源。


    在调查服务器后，FBI 发现一系列连接是在未使用 Tor 的情况下建立的，而是使用了 VPN 服务。这些虚拟私人网络（VPN）也允许人们掩盖互联网流量，但只是通过将其中继到另一台计算机来实现。通过追踪登录记录，调查人员可以看到许多连接来自旧金山地区的地点。


    与此同时，与团队合作的一名 IRS 特工在一个编程网站上发现了一篇帖子，请求帮助设置 Tor 隐藏服务，使用的用户名与 2011 年 shroomery.org
    和 bitcointalk.org 上的帖子中使用的相同用户名“altoid”相同。一个电子邮件地址“rossulbricht@gmail.com”与该用户名相关联。对于
    FBI 来说，拼图开始就位，一幅图景开始浮现。


