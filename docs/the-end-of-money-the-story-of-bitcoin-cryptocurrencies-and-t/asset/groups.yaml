    Bitcoin wasn’t perfectly anonymous, but it could not be shut down by the government,
    and user accounts could not be closed, unlike credit cards or online merchant
    services like Paypal. Tor enabled Silk Road to set up its market, and bitcoin
    allowed for the payment of the goods. It seemed like the whole enterprise was
    risk free.


    # Was Silk Road ever really anonymous?


    The Silk Road marketplace was supposed to be completely anonymous. But while Tor
    worked well to disguise the source and destination of internet traffic, bitcoin
    transactions could be traced through the blockchain, meaning they were never entirely
    secret.


    The site’s technology was not perfect, either. Ulbricht caught a number of early
    security flaws in the site with the help of volunteers. The fact that people had
    come forward after spotting the vulnerabilities reinforced Ulbricht’s belief that
    the site could survive with self-policing. In his idealistic view, he thought
    that the site’s users and the technology were more powerful than the forces out
    to get them, and that they would protect each other. But it was one of these security
    flaws, introduced through a coding error that allowed police to discover the location
    of the servers in 2013 and gather the evidence that would lead to Ulbricht’s conviction.


