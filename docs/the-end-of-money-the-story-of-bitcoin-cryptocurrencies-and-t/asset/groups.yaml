    Although it is now fairly simple for merchants to accept bitcoin, they often don''t.
    There is a chicken-and-egg problem at work – merchants aren''t driven to accept
    cryptocurrencies until their customers demand it, and customers aren''t driven
    to use cryptocurrencies without stores willing to accept it. In the meantime,
    credit cards and cash continue to be the method of least resistance. And without
    any particular benefit for choosing to adopt cryptocurrencies over current electronic
    payments, widespread evolution to a new method seems unlikely.


    ## Free bitcoin for students: How did they spend it?


    In October 2014, $100 worth of bitcoins were given to all 4,494 undergraduate
    students at the Massachusetts Institute of Technology in an experiment to spur
    acceptance of the cryptocurrency among people who might not otherwise want to
    try it. The students were free to do what they wanted with the bitcoins – so long
    as it was legal. The Boston area boasts a number of shops that accept bitcoin
    and also had one of the first bitcoin ATMs in the US. In addition, the MIT campus
    store accepts the currency in exchange for things like textbooks and college sweatshirts.
    The MIT Bitcoin Project collected data from users to find out how they used their
    money and whether their attitudes towards the currency had changed.


    What was the outcome? Only around 70 per cent of the students signed up for this
    free cash, and 40 per cent of them traded their bitcoins for money within the
    first month. After two years, only 14 per cent of the students were still using
    bitcoin.


    ## Bitcoin accountants


    A new domain for cryptocurrency businesses is growing in the field of accounting.
    Whether one is accepting payments, trading cryptocurrency, or merely buying into
    bitcoin as an investment, tracking these sorts of transactions is necessary. Because
    the blockchain and its strings of seemingly random characters and hashes can be
    confusing, a number of companies are offering to help customers track their cryptocurrency
    dealings using the blockchain. Libra.tech is one, integrating blockchain analysis
    into standard accounting procedures. Another company, Contelligence, claims to
    be working on ‘detecting fraudulent transactions’ through blockchain analysis,
    although they give few details as to how.


    Whether these services become the answer to a widespread need will be determined
    by how widespread the use of cryptocurrencies becomes. However, even if there
    is only a small, core user base for cryptocurrencies, it is likely that these
    sorts of specialist firms will often provide a much needed niche service. It is
    ironic that one motivation of virtual currency was to anonymize transactions and
    prevent authorities from spying on the financial dealings of the currency’s users.
    The reality of the cryptocurrency blockchain is that, as a ledger, it provides
    highly detailed records of all transactions. And along with this new form of detailed
    financial record, is a new sort of specialized accountant, trained in the technical
    details of how to unravel these records and make them legible.


