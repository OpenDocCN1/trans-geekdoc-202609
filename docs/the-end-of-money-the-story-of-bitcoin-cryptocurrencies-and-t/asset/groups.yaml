    突然出现在 Silk Road 上。这一幕一再发生。很快，他们掌握了足够签发逮捕令的证据，并在一次突袭行动中，在旧金山公共图书馆将 Ulbricht 逮捕，成功在他登录
    Silk Road 管理账户时完整扣押了他的电脑。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_90_0.png)


    并非所有人都乐于看到 Silk Road 创建者 Ross Ulbricht 受审。


