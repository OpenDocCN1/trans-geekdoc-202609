    Blockchain technology is not simple, even though it is often explained as if it
    is. Many stories have been told about cryptocurrency stashes being lost because
    of the absolute secrecy of secret keys – once a secret key is lost, the wallet
    is locked forever. Failure after failure of exchanges, companies, and blockchains
    themselves show that there are still many mistakes to be made, and people capable
