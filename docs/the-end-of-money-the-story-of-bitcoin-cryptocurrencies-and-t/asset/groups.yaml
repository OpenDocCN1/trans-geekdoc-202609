    # A new address book for the internet


    While the blockchain could help with the discovery of new prime number combinations,
    it has also been trialled as a practical way to help keep internet records safe.
    The code for each website on the internet is stored on a particular computer server,
    with the website’s name linked to the unique address – or ‘IP address’ – of this
    server through the domain name system (DNS). Surprisingly perhaps, for a global
    system, the DNS records for the entire world are held in databases stored in just
    13 servers.


    In 2011, it was suggested that DNS records could be decentralized by putting them
    in the blocks of a blockchain associated with a new currency called Namecoin,
    a relative of bitcoin. Just as transaction records of other cryptocurrencies are
    stored in the blockchain, the Namecoin blockchain was able to store the DNS records
    for websites using a .bit top level domain designator.


    Yet while Namecoin worked fine, it never caught on. One issue was that you needed
    a browser with a special add-on program to access .bit sites via the Namecoin
    DNS information. Also, most websites continued to use the standard DNS registry.
    Very few legitimate websites ever registered in the Namecoin blockchain. In fact,
    of the 196,000 sites in the Namecoin registry, it was estimated that the vast
    majority did not even have a website attached to the name. In May 2016, the last
    major exchange trading Namecoin stopped dealing with the cryptocurrency, and the
    experiment ended.'
