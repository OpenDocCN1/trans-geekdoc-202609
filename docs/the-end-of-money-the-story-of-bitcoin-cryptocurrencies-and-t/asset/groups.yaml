    ## 从比特币到自治公司


    *区块链的替代形式正在涌现，并可能彻底改变公司的运作方式。*


    比特币和其他第一代加密货币使用的工作量证明区块链可能很慢，并且需要大量的计算能力。以权益证明作为潜在替代方案的起点，一些区块链开发人员重新回到了绘图板上，寻找在尽可能短的时间内达成共识的最简便方法，即网络中大多数计算机同意区块链的真实状态。


    一种方法是向加密货币网络引入不同的层级。这种方法不是使用单一的计算机网络，而是使用“中间节点”来创建两个独立但相关的网络——一个面向普通用户，一个由构成网络骨干的可信计算机组成。


    最早使用这一想法的货币之一是 Dash（最初推出时名为 XCoin）。它通过将网络分为两类来运作——工作量证明挖矿网络，任何人都可以加入，以及“主节点”网络。要成为主节点，计算机必须投资或锁定
    1000 个单位的加密货币。此时，该计算机唯一要做的事情就是充当货币验证服务的一部分。矿工们如同比特币一样通过工作量证明创建区块，但主节点负责使用共识程序彼此批准每个区块。区块奖励在两个网络之间分配。


    通过使用第二个在区块创建者网络之外运行的验证网络，可以避免标准工作量证明加密货币的许多漏洞。例如，51% 攻击——即生成工作量证明加密货币 51% 哈希值的矿工可以修改区块链（参见“众志成城”，第
    5 章）——不可能发生，因为主节点不会批准一个新的、伪造的区块链。控制 51% 的算力不会让攻击者篡夺主节点的权威，而控制 51% 的主节点则需要囤积近乎无法克服的加密货币量才能实施攻击。中间节点系统还能实现更快的交易确认，因为主节点共识发生在区块被挖矿的过程中，而不是在区块被解出之后。到区块被解出的时候，所有主节点都已经毫无疑问地确认了交易。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_197_0.png)


    未来的区块链可能不需要工作量证明计算。


    ## 按共识工作


    Dash 基于共识的方法在开发下一代区块链系统的人群中引起了巨大兴趣。随之而来的认识是，区块链的根本作用是就某事达成一致，并尽快达成此一致（参见“工作量证明”，第
    4 章）。一旦有人解锁他们的钱包并创建一笔交易，区块链的主要任务就是记录该交易，并尽快完成，以便该交易无法被撤销，并且可以添加新的交易。


    一家名为 Ripple 的公司开发了也许目前最大、最先进的共识区块链形式。其软件同样名为 Ripple，基于一种新型区块链，旨在处理跨越国界甚至跨越不同国家货币的银行间转账。


    通过使用一种被称为“拜占庭将军问题”的数学和计算机科学实验，Ripple 的工程师认为他们已经证明工作量证明和权益证明都是不必要的（请参见下方的方框“Ripple
    是如何工作的？”）。Ripple 的区块链账本不仅旨在促进区块链自身的原生货币（称为 XRP）的转账，还旨在处理任何货币的交易。从某种意义上说，Ripple
    区块链构建了其自己的安全对应账户系统（请参见第 12 章方框“如何在全世界转移资金”），允许任何银行与任何其他银行之间创建交易。


    在 Ripple 设置好硬件后，银行成为 Ripple 网络中的一个节点。银行之间不再使用常规货币兑换系统进行借记或贷记，而是可以使用他们偏好的任何货币在账本中交换交易信息。更改会实时显示在账本上。如果需要货币兑换，网络将自动使用持有多种货币储备的中介“做市商”为交易找到最佳价格，然后更新所有账户。XRP
    甚至可以用于促成交易，而两端的节点甚至不知道涉及加密货币。这些交易大约在一分钟内结算，无论它们发生在何处。


    通过依赖可信节点之间的共识系统，Ripple 网络允许参与银行之间进行几乎没有除货币兑换价格之外额外开销的全球交易。该公司希望这将削减与国际货币兑换相关的费用。然而，只有银行和公司可以成为
    Ripple 网络中的节点。普通客户必须在这些银行之一开设账户，然后该公司使用 Ripple 为他们将资金发送到另一家银行。这使银行能够继续为交易设定价格。这样一来，Ripple
    希望通过向那些已经控制系统的人推广，而不是颠覆资金转移行业，将区块链账本技术带入主流。截至 2017 年 2 月，Ripple 的 XRP 加密货币在总价值上仅次于比特币和以太坊，是第三大加密货币。


    ## Ripple 是如何工作的？


    “拜占庭将军问题”设想了一群将军，各自率领一支军队，包围一座敌方城市。每个将军都被山丘与其他人隔开，使他们无法直接相互传递信号。敌方城市的实力强大到如果所有将军同时进攻，他们就能击败它；但如果除了一个将军之外的所有人都进攻，他们将被击退。将军们必须通过交换信息来计划进攻时间。然而，无法保证收到的信息的真实性——有一个或多个将军秘密站在城市一边，并发送信息来欺骗其余的人。那么，将军们该怎么办呢？


    结果表明，如果少于 66% 的将军是忠诚的，就无法协调一次成功的攻击。然而，如果超过 66% 的将军是忠诚的，那么他们可以信任所收到的大部分信息，从而成功协调他们的攻击。这一结果由微软的研究人员于
    1982 年证明。而 Ripple 依靠的正是这一事实来保障其区块链的安全。


    Ripple 区块链网络由有限数量的中间节点组成。这些节点验证区块链的所有添加内容，并与更广泛的用户群体通信，这与 Dash 的主节点并不不同。所有中间节点相互通信以共享普通用户提交的交易信息。但是，当需要将新区块写入链中时，它们会参考一个它们信任的特定节点的“可信节点列表”。每个中间节点从他们特别信任、并认为不会试图欺诈区块链的其他中间节点中创建他们自己的列表。然后，节点将他们的交易与他们的列表进行比较。如果列表中
    80% 的节点同意该交易，则该交易被视为包含在区块共识中，并加入区块链。如果未达到该 80% 的阈值，则该交易将转移到下一个区块。


