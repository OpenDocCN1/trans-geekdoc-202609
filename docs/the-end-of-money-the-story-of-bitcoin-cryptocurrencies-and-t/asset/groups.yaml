    by using a second, verifying network operating outside the block creator network.
    For example, the 51% Attack, in which a miner producing 51% of the hash of a proof-of-work
    cryptocurrency could alter the blockchain (see ''Strength in numbers'', Chapter
    5), cannot occur, because the masternodes would not approve a new, falsified blockchain.
    Taking control of 51% of the hashrate would not allow an attacker to usurp the
    authority of the masternodes, and taking control of 51% of the masternodes would
    require a nearly insurmountable amount of currency to be stockpiled to enable
    the attack. The intermediate node system also allows faster transaction confirmation,
    because masternode consensus occurs while blocks are being mined, rather than
    once the block is solved. By the time the block is solved, all the masternodes
    have confirmed the transactions beyond any doubt.


