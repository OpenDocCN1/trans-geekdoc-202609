    各种纠纷。另一些人说，这一事件实际上证明了代码有效——毕竟，硬分叉确实将以太币返还给了所有 DAO 投资者。还有人预测，瑞士（以太坊、Slock.it 和其他创始公司所在地）的法律机构仍可能介入。与此同时，其他人将这一切归咎于以太坊代码本身的失败，并建议需要对其进行更改。


    区块链技术并不简单，尽管它常被解释得像是很简单一样。关于加密货币存储因密钥的绝对保密性而丢失的故事有很多——一旦密钥丢失，钱包将永远被锁定。交易所、公司和区块链自身一次又一次的失败表明，仍有许多错误可犯，也有人能犯下这些错误。


    但是，DAO 的一个关键失败在于假设它真的会那么简单。即使不考虑递归拆分漏洞，也难以相信有人会认为一个允许在意见不合时随意退出的组织能够运作。人类倾向于意见不合，试图互相占便宜，并试图利用权力结构谋求私利。看来，递归拆分漏洞可能在
    DAO 启动之前就将其阻止，从而在它分裂成一千个无法彼此达成任何协议的不同子 DAO 之前，就为大家节省了很多麻烦。


    要了解 DAO 对人性估计有多糟糕，只需研究所谓的“跟踪者攻击”即可。跟踪者攻击仅仅是假设性的，因为 DAO 存在的时间不够长，这种滥用行为从未真正发生过。


    跟踪者攻击被假设为一种情况：一个人试图拆分到一个子 DAO，或许是为了提取他们的资金。然后，一个“跟踪者”连同他们一起进入子 DAO，带入足够的代币，对最初试图拆分的人拥有压倒性多数。在这个只有两个人的新子
    DAO 中，跟踪者可以控制任何投票。他们可以任命自己为策展人，并确保只有他们能接收从子 DAO 转出的任何资金。受害者唯一能做的就是再次拆分，进入另一个子
    DAO。然后，跟踪者再次跟随他们，做完全相同的事情。受害者被永远困住，因为这个霸凌者继续控制投票，并在每次受害者试图拆分时跟随他们。


    根据 DAO 开发者的说法，跟踪者攻击是一个“无关紧要的问题”，因为攻击者没有动机这样做。只要跟踪者继续对受害者表现出敌意，跟踪者的资金就会和受害者的资金一样被永久锁定。任何人可能有什么逻辑动机去浪费自己的钱骚扰别人呢？


    对此，几乎任何人都可能会回答——看看政治世界！看看无稽之诉！看看现实生活中的跟踪者，他们花所有时间无理由地骚扰他人，毫无物质利益可图！可以想到数百种情况：有钱有人闲的人会给那些钱和时间较少的人制造无穷麻烦，要么等他们出错，要么让他们屈服于各种要求，以便跟踪者允许他们提取资金。


    但是，DAO 的开发者或许在区块链机制方面教育颇丰（姑且给他们致命的编程错误一点宽容），却似乎在人性机制方面教育严重不足。因此，无论是由于漏洞，还是由于过度程序化民主的风险，DAO
    的失败似乎都是不可避免的。


    虽然有人可能会认为，正是通过这种失败，技术才得以进步，但这里真正奇怪的地方在于，这并非使用风险对冲的风险投资资金进行的实验。真正的投资者预期这种赌注，并且有能力坦然承受失败。然而，像
    DAO 这样的实验，却是使用从互联网上筹集的个人支持者的资金来进行这些失败的实验。试图逃离公司资本的规则和权力结构，像 DAO 这样的替代性公司实验冒着普通人辛苦赚来的钱的风险，要求他们相信一个未经证实的未来，而对涉及的风险几乎没有缓解措施。众筹实验被宣传为民主化的，让所有人平等参与。但说到区块链，经济金字塔底部的人们被用来承受错误、失误和纯粹糟糕判断的风暴，以便最终，一旁观望的大银行能从这些错误中吸取教训。基于这种实验的未来看起来并不那么民主，更像是利用人群来缓冲有权势者的跌落。


    ## 结论


    当 _新科学家_ 杂志于 2014 年发表关于数字货币的特别报道时，似乎在封面上以比特币列出杂志价格是个好主意。唉，此愿未能实现。


    首先，存在以一种随时可能暴跌（或暴涨）的货币标定固定价格的问题。支付又该如何处理呢？当时，没有零售商接受比特币，此后情况也没有太大变化。


    这大体上总结了比特币的现状，距离这种激进的新货币形式之初由其神秘发明者“中本聪”提出，还不到十年。兴趣正在快速增长，但其价值依然波动，使用依然边缘化，基础设施也尚在萌芽阶段。而且，在没有变通方法或与特殊服务提供商签订合同的情况下，你还不能在“现实”世界中用它购买太多东西——这远非你期望的无缝支付系统，当然也无法与无处不在的现金或卡片相媲美。


    比特币本身可能永远无法应对这一挑战。其基础与传统货币大胆地不同，可能过于薄弱，无法支撑社会巨大的金融活动中哪怕一小部分。它可能最终局限于互联网黑暗面的非正式存在，或像以往的金融创新一样，被硅谷和华尔街所利用。更离奇的情景是，它会被一个货币崩溃的绝望国家采用。


    但比特币并非唯一的游戏。真正的创新或许在于人们正在用核心技术所做的事情。比特币实验的真正价值或许在于作为数字信任基础：即区块链，它允许交易在无需大量文书工作的情况下被记录。但摒弃官僚主义后，你也可以取代那些靠处理官僚主义赚钱的人。


    通过向全世界开放比特币协议，中本聪可能并未使金融民主化，而更多是为金融提供了一种像互联网协议一样革命性的技术。如同互联网，原本看起来极具民主性的东西将发展出其自身的、全新的权力结构。如果真是如此，那么所面临的风险不只是数十亿美元投资于比特币，而是金钱本身的本质。


    ## 五十个想法


    本部分为你提供更深入探索该主题的方式。它不仅仅是通常的阅读清单。


    ## 六个加密货币事实


    - 1 Digicash。这是第一个可用的虚拟货币，成立于 1990 年。仅仅八年后，创建它的公司倒闭，它就不复存在了。


    - 2 从垃圾邮件到货币。1997 年，密码学家 Adam Back 提出了一种名为‘hashcash’的减少垃圾邮件的想法，这是一种在设定时间段内对可发送邮件数量设置硬性限制的计算系统。他将这个想法作为白皮书发送给
    Cypherpunks 邮件列表，但从未在大规模上实施。比特币使用了 Back 的 hashcash 概念的一些方面。


    - 3 第一个比特币所有者。美国计算机科学家 Hal Finney 是第一个比特币转账的接收者。他于 2009 年初从 Nakamoto 那里收到了十枚币，那时它们基本毫无价值。也有怀疑认为
    Finney 可能就是神秘的比特币创始人本人。


    - 4 耗电巨大。自 2011 年以来，比特币网络利用了如此大量的处理能力，以至于据信其算力超过世界前 500 强超级计算机的总和。这意味着，从理论上讲，即使同时使用世界前
    500 强超级计算机试图篡改比特币区块链网络，也做不到。


    - 5 Dunning-Krugerrands。赛博朋克小说 Neuromancer 的作者 William Gibson 曾开玩笑地将比特币称为‘Dunning-Krugerrands’。他将这个词源自
    Krugerrands，一种南非金币，以及 the

    '
