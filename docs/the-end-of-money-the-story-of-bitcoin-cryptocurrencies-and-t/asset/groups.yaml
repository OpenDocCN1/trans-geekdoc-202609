    ## Bitcoin: The basics


    What exactly is a bitcoin? How can you get hold of them? And what can you buy?


    ### What exactly is bitcoin?


    Bitcoin is a new type of digital currency called cryptocurrency. It is not controlled
    by banks or backed by national governments, but is generated by a decentralized
    network of computers using software to solve mathematical problems. It relies
    on a cryptographic technology called a blockchain. It is the first and largest
    cryptocurrency, though there are now many cryptocurrencies in existence.


    ### How do I use bitcoins?


    Bitcoins are not physical entities. They are not minted into notes and coins like
    dollars or euros. Instead, bitcoins are stored in a digital file called a wallet.
    This wallet is used to send bitcoins to others, using software on a smartphone
    or computer.


    ### How do I get bitcoins?


    There are a number of ways. The first is by ‘mining’ them. You can do this by
    setting your computer to carry out the cryptographic calculations needed to sustain
    the cryptocurrency. This earns a chance of winning a small quantity of bitcoins.
    This is how the cryptocurrency was originally distributed. Today, however, the
    mining competition is so fierce that earning any bitcoins this way is very difficult
    without a large investment. Alternatively, you could pay for ‘cloud mining’ services,
    where someone else does the mining for you.


    Another way of getting bitcoins is in person from someone who already has some.
    Services such as localbitcoins.com connect individuals looking to exchange bitcoins
    for traditional currency such as dollars or euro.


    Another way to acquire bitcoins is via exchanges, which allow you to convert one
    currency – dollars, pounds, euros, yuan or bitcoins – into another, just like
    any other foreign currency exchange. Mt. Gox (see Chapter 7) was once the largest
    exchange worldwide until it collapsed in 2014. At the end of 2016, the largest
    exchange by trading volume was BitMEX.


    More recently, services have opened up that allow customers to link their bank
    services to cryptocurrency–holding services, allowing them to deposit bitcoins
    and spend in local, traditional currency such as dollars or pounds, and vice versa.
    Two examples of services like these are Coinbase and Bitpay.


    Lastly, a straightforward way to get bitcoins is to accept them in exchange for
    the sale of goods and services. Companies such as Stripe and Paymium offer services
    to help merchants accept cryptocurrencies in their businesses.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_17_0.png)


    FIGURE 1.1 The symbol for bitcoin was created by Satoshi Nakamoto soon after he
    invented the cryptocurrency


    December 2013 The People''s Bank of China forbids trading in bitcoin. Price falls
    as Chinese money exits.


    April 2013 Cyprus bank crisis leads to bitcoin surge, overwhelming the main exchange
    and leading to a sudden sell-off.


    June-July 2014 Businesses such as Expedia and Dell begin accepting bitcoin, and
    the price rebounds to $600.


    July 2016 Bitcoin value reaches $750 for the first time since early 2014, but
    plunges again, partly due to a security breach at the Bitfinex exchange resulting
    in the theft of bitcoin worth $72 million.


    November 2016 In the uncertainty of the US presidential election, the bitcoin
    price rises again to over $700.


    December 2015 After a stable year, Bitcoin ends 2015 on a high, boosted by a surge
    in trading by Chinese exchanges.


    January 2015 The bitcoin value reaches a low of $214, resulting in declarations
    of the cryptocurrency''s death.


    June 2016 Bitcoin value surges, driven by multiple factors including fears that
    the UK could split from the EU, optimism about the blockchain and increased demand
    for bitcoin, especially from China.


    November 2013 Chinese cash begins to pour in. A US Senate meeting calls virtual
    currencies a ''legitimate financial service'', eventually leading to a peak of
    $1,242 at the end of the month.


    Figure 1.2 Highs and lows: bitcoin owners must be prepared to ride out volatile
    prices


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_18_0.png)


    ### What can I buy with bitcoins?


    In the early days of bitcoins, there wasn’t much people could buy with them. The
    first major market that accepted bitcoin in payment traded in drugs and other
    illegal services. Today, many major businesses accept bitcoin directly, and for
    the dedicated bitcoin user, a card integration service like Coinbase or Bitpay
    allows customers to use bitcoins in any credit card transaction.


    ## 2 The birth of bitcoin


    In 2008, a person who did not exist had an idea. By 2011, that idea was worth
    over $54 million. This is the story of the invention of a radically new type of
    currency.


    World-changing financial ideas don''t usually appear out of the blue in email
    inboxes. So cryptographer Adam Back didn''t pay much attention when he got an
    email from ''Satoshi Nakamoto'' in August 2008 proposing a new idea for a virtual
    currency. Lots of people on the cypherpunk mailing list, which Back had followed
    since its creation in 1992, had proposed ideas for currencies that existed only
    within computers. Back didn''t spend much time considering this particular concept,
    especially coming from an unknown name.


    This was the first time anyone had heard from Nakamoto, a name believed to be
    made up by an unknown person or group. The idea – untested and unproven at that
    point – was called bitcoin. Less than three years later, when Satoshi Nakamoto
    disappeared from the internet, the total value of all bitcoin in existence was
    over $54.5 million. But the inventor of cryptocurrency has never been positively
    identified.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_22_0.png)


    The identity of bitcoin inventor ''Satoshi Nakamoto'' is a mystery.


    By the time Nakamoto disappeared, the code of his open-source software for this
    new type of currency had been rewritten so many times that it is difficult to
    say that Nakamoto is bitcoin''s author. It is estimated that less than a third
    of bitcoin''s computer code in use today was written by Nakamoto. Like so many
    other things that comprise the internet, the reality is that bitcoin now belongs
    to everyone and no one.


    ### $9.29 billion Total value of all bitcoin in existence (August 2016)


    Strange ideas like bitcoin are common among the computer scientists, programmers,
    mathematicians and activists in the cypherpunk world, who have devised many complicated
    schemes to ensure technological privacy. Through experience, they are sceptical
    of ideas lauded as the ‘next big thing’. So for a while, bitcoin seemed as if
    it might be yet another idea that would fall into obscurity. Bitcoin wasn’t the
    first idea for a virtual currency, and none of the previous schemes had taken
    off.


    ### Would the real Satoshi Nakamoto please stand up?


    There have been many attempts to unveil the person behind the pseudonym of bitcoin’s
    founder. All have failed.


    - In October 2011, New Yorker journalist Joshua Davis suggests that computer scientist
    Michael Clear might be Satoshi, based on his background in cryptography, his use
    of vernacular British English, and his not-over denial when first asked (he later
    denied it fully).

    - The next day, magazine *Fast Company*’s Adam L. Penenberg disagrees. He believes
    that Nakamoto must be one of three cryptographers – Neal King, Vladimir Oksman
    or Charles Bry – whose names appear on a cryptography patent filed three days
    before the first bitcoin.org website was registered by Nakamoto. But these connections
    turn out to be coincidences.

    - Users on a bitcoin forum suggest in 2012 that **Jed McCaleb**, founder of the
    bitcoin exchange Mt. Gox, might be Satoshi.

    - Postings in other forums around this time suggest the conspiracy theory that
    bitcoin might have been founded by the US Central Intelligence Agency or National
    Security Agency, to lure in unsuspecting criminals.

    - In 2013, after the arrest of Ross Ulbricht, founder of the illicit dark web
    shopping site Silk Road, two Israeli researchers conclude that Ulbricht must be
    Nakamoto.

    - In March 2014, *Newsweek* reporter Leah McGrath Goodman drops the bombshell
    claim that the real name of the creator of bitcoin *is* Satoshi Nakamoto, though
    he goes by the first name, Dorian. She bases her claim on Dorian Nakamoto’s programming
    experience, and his long time residence in Silicon Valley.

    - In the widespread debunking of the Dorian Nakamoto claim, *Forbes* writer Andy
    Greenberg investigates the possibility that bitcoin code-contributor Hal Finney
    is the real Nakamoto, but soon rejects the idea.

    - Nathaniel Popper’s 2015 book, *Digital Gold*, suggests that Nick Szabo – Cypherpunk,
    bitcoin investor, and inventor of the earlier virtual currency, BitGold – is Satoshi
    Nakamoto. Szabo publicly denies the claim.

