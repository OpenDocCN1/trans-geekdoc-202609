    ## 数字贩毒的开端


    2011年1月，一个名为 shroomery.org 的“迷幻蘑菇”网站上出现了一篇帖子。该帖子由用户“altoid”撰写，其中发布了一个名为 Silk Road
    的网站链接，并询问是否有人使用过该网站。几天后，同一名用户在 bitcointalk.org 上发布了类似的帖子。


    两年后，即 2013 年，FBI 特工将发现这两篇帖子是互联网上最早提及 Silk Road 的帖子——这意味着它们很可能是网站创建者所写。当时，FBI 尚不知晓
    Silk Road 创始人的姓名，但这些帖子最终成为调查人员找到 Ross Ulbricht 所遵循的第一批线索之一。


    尽管 Ulbricht 采取了许多措施来隐藏身份，但政府仍投入了非同寻常的资源来揭露他。他想成为一名匿名的、网上的自由意志主义英雄，并经常使用化名“恐怖海盗罗伯茨”（Dread
    Pirate Roberts，DPR），以此向《公主新娘》中的角色致敬，并让自己的名字与 Silk Road 保持距离。但最终，一系列简单的疏忽导致他的身份被揭露并被捕。


    DPR 武器库中一种强大的工具是网络流量匿名化软件 Tor，黑客和间谍都使用它来隐藏在线流量。通过将 Silk Road 作为暗网上的“隐藏服务”运行，调查人员无法找到托管该网站的服务器并将其关闭。通过使用
    Tor 连接进行电子邮件、聊天以及所有与 Silk Road 管理任务相关的连接，DPR 及其管理人员将无面孔、无姓名、无位置——正如他们相信互联网本应如此。而比特币是为他们的努力提供动力的加密货币。


    比特币并非完全匿名，但政府无法将其关闭，用户账户也无法被冻结，这与信用卡或像 Paypal 这样的在线商户服务不同。Tor 使 Silk Road 能够建立其市场，而比特币则允许支付货款。整个企业看似风险为零。


    ## Silk Road 真正匿名过吗？


    Silk Road 市场本应是完全匿名的。但尽管 Tor 能很好地伪装互联网流量的源和目的地，比特币交易可以通过区块链追踪，这意味着它们从未完全保密。


    该网站的技术也并非完美。在志愿者的帮助下，Ulbricht 发现了网站中的一些早期安全漏洞。人们在发现漏洞后主动站出来的事实，加强了 Ulbricht 的信念，即该网站可以通过自我监管生存。在其理想主义的观点中，他认为该网站的用户和技术比针对他们的势力更强大，并且他们会相互保护。但正是其中一个安全漏洞——由编码错误引入的漏洞——让警方在
    2013 年发现了服务器的位置，并收集了导致 Ulbricht 被定罪的证据。


    当然，除了药物是实物且必须亲自交付的问题。这意味着 Silk Road 的卖家不得不使用邮件，并最终给了当局第一个真正的线索，表明城里有了新玩家。在注意到检测到的毒品运输增加后，只是时间问题，总有人会被抓到。


    在众多用于拦截邮件运输的诱捕行动中，DEA 在 2013 年抓获了 Silk Road 的一名辅助管理员，该用户名为 chronicpain。DEA 特工使用他的管理账户查获了价值
    35 万美元的比特币。


    当 DPR 看到资金被盗，并在新闻中读到 chronicpain（真名 Curtis Green）已被捕后，他向成为真正的毒枭迈出了巨大一步——他据称决定杀掉
    Green。他的刺客将是一个通过 Silk Road 结识的熟人。“Nob”声称与贩毒集团合作，经常吹嘘自己的暴力事迹，因此他似乎是绝佳人选。然而，Nob
    实际上是一名叫 Carl Force IV 的 DEA 特工——正是刚刚逮捕 Green 的那位特工。Force 策划了一场 Green 被处决的骗局，让
