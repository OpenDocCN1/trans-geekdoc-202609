    百分之六十六的节点诚实，拜占庭将军问题表明区块链的安全性得到了保障。但 Ripple 更进一步，要求节点只轮询它们信任的节点。而且为了更加谨慎，Ripple
    要求百分之八十的协议水平。如果任何交易无法以这种方式达成共识，它将被搁置。以这种方式，区块链允许具有明显共识的交易尽可能快地进行，同时标记混乱的交易并让它们等待协议。


    ## 智能合约


    许多涉及区块链的最新创新都专注于在分类账中加入额外信息的概念，这些信息与加密货币交易一起存在或代替加密货币交易存在。Ripple 允许记录其他货币交易，Nxt
    允许添加额外文本，以便对不同组或类别的加密货币（称为“颜色”）进行排序，这样就可以将房地产或商品等不同类型的资产在区块链上表示出来。Chain 和 Factom
    等公司正在想办法在区块链上记录所有权和股东信息。甚至有人提出对比特币区块链进行软件更新，以增加区块大小，从而允许更多交易。这些可能会为区块链带来额外文本或加密设施，从而提供全新的功能。


    区块链开发领域中最令人兴奋的事情之一，是不仅将交易或数据放入区块链，而且放入代码本身。这将使区块链能够充当一个去中心化程序，实际上运行可以根据市场变化条件自行更新和改变的软件。这种代码可以实现所谓的“智能合约”，这些合约能够自主运行。然而，研究人员发现，代码与法律术语结合的这个新领域正在孕育严重的复杂性。


    智能合约最早由虚拟货币开发者尼克·萨博（Nick Szabo）于 1997 年提出。这个想法相当简单：例如，购买房屋时，资金和产权文件通常会交给可信第三方，如律师或银行。当第三方确信交易双方都已履行合同要求时，他们便会相应地交付资金和产权文件。智能合约可以自动完成此操作，无需第三方。产权文件和资金以数字形式交给程序，同时附上协议条款。当智能合约观察到条款已得到履行时，它会直接交付数字支付和产品。区块链在分类账的去中心化机制中保障合同代码的安全，就像它保障加密货币交易的安全一样。同一个区块链可能持有产权文件、付款和合同，只需更新其分类账以反映新的、交换的所有权。


    这样的合同不必庞大或复杂。例如，像停车计费器这样简单的东西可以在区块链上运行代码——当收到停车费时，它会将车辆注册为合法停放。智能合约可以仅仅是一个投票机制。代码不接收任何资金，而是可以接受注册股东的投票并报告最终计票结果。还有一些合同，区块链代码根本不需要做任何决定，而是可以像数字存储柜一样运作。资金放入柜中，直到双方同意使用其公钥打开柜子才能取出。其中一些简单的合同理念可能会在未来的比特币版本中部署，例如提议的闪电网络（“闪电网络”，第
    11 章）。


    ## 以太坊时代


    既然智能合约已经吸引了区块链开发者的注意，其他可能性也开始涌现。例如，区块链能否管理股东投票机制？它们甚至能否控制整个公司？


    从法律角度来看，公司只不过是一系列定义领导、所有权和利润分配结构的规则。也许这样的东西真的可以写成代码，然后在区块链中加以保障。这可以被描述为“自治公司”。


    2015 年，一位名叫维塔利克·布特林（Vitalik Buterin）的俄罗斯程序员推出了以太坊，这是一种允许将智能合约嵌入其中的区块链。使用一种名为 Solidity
    的定制编程语言，程序员可以将他们的代码上传到以太坊区块链，支付少量以太币（以太坊的加密货币）作为费用。一旦代码被植入一个区块，它就会获得一个地址。然后任何人都可以使用自己的计算机定位该地址，并运行其中包含的代码。代码能做什么取决于程序员。它可能是一个用通用文本响应的小程序，或者是一个仅响应具有授权的特定人员的简单合约。从理论上讲，它也可以是一家自治公司，被编程为购买有用的东西、出租并收取付款——所有这些都在分布式以太坊区块链中完成。


    以太坊的潜力催生了孕育比特币的理想主义的复兴，自治公司已成为密码学自由意志主义者的新梦想。如果一整个企业可以被保存在超出任何国家管辖权的分布式去中心化区块链中，它就提供了一种全新的“自由”概念。谁会向自治公司征税？基于区块链的企业需要向哪些政客低头？政府的缺陷可以被绕过，取而代之的是代码——简单、开源，任何具备编程技能的人都可以访问，但最终安全且免受人类弱点的影响。被这种理想主义感染的投资者抓住机会支持以太坊，以太币成为比特币之后第二大的加密货币。


    以太坊推出后，各种提案开始涌现。例如，一家名为 Slock.it 的瑞士公司提出了一项计划，要构建一种锁——物理上的、安装在门上的锁——它可以连接互联网和以太坊区块链。这将允许人们使用区块链租赁房产，时间可以很短，例如度假期间，只有在客户支付费用时锁才会打开门，并在租赁期结束后自动再次上锁。


    ## Ripple 与以太坊


    看待区块链未来的一种方式，是将其视为 Ripple 与以太坊之间的竞争。以太坊体现了加密货币早期大量理想主义精神。正是这种精神促成了 DAO（见下文），也导致了它的崩溃。在急于创造新事物的过程中，错误经常发生。另一方面，Ripple
    似乎采用了一种更传统的方法。Ripple 没有试图开辟新领域，而是吸引那些已经掌控金融网络的人。它提供的不是一场革命，而是一个产品。的确，Ripple 降低了一些早期的抱负，以便更好地瞄准银行可能购买的服务。


    哪种做法是正确的？两者都在尝试针对完全新市场的新想法，迄今尚未出现明确的赢家。


    然而，这可以提供一个有用的视角，帮助我们对新的金融技术进行分类。一种技术是“与体制同在”还是“反对它”，是理想主义的还是现实的，是革命性的还是渐进式的？它旨在证明新概念，还是仅仅为了赚钱？这些问题可能有助于理解技术开发者和支持者的动机。然而，评判技术本身需要不同的标准，最终的成功更难预测。


    ## 自治公司


    去中心化自治组织（DAO）诞生于 Christoph Jentzch（Slock.it 首席执行官 Simon Jentzch 的兄弟）有一个雄心勃勃的计划。他决定尝试创建以太坊创始人维塔利克·布特林最初讨论过的那种自治公司。于是他开始编写代码，并在
    Slock.it 的支持下，于 2016 年初将其发布到以太坊区块链。


    DAO 背后的想法似乎相对简单。DAO 将是一个众筹工具。潜在的资助者将使用以太坊的原生加密货币以太币购买 DAO 的股份，称为 DAO 代币。这些代币赋予与购买数量成比例的投票权。通过这些销售，DAO
    积累了加密货币资本，然后可以将其投资。


    '
