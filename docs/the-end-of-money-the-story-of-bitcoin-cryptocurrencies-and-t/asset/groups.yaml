    as quickly as possible (see ''Proof-of-work'', Chapter 4). Once someone has unlocked
    their wallet and created a transaction, the primary task of the blockchain is
    to record that transaction, and to do this as quickly as possible so the transaction
    cannot be reversed, and so new transactions can be added.


