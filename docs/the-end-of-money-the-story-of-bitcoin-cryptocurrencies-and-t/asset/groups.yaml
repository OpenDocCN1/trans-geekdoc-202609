    starting point for potential alternatives, some blockchain developers have gone
    back to the drawing board to hunt for the easiest ways to achieve a consensus
    in which a majority of computers on a network agrees on the true state of the
    blockchain, in as little time as possible.


    One route has been to introduce different tiers to a cryptocurrency network. Rather
    than a single network of computers, this uses "intermediate nodes" to create two
    separate, but linked, networks – one for general users, and one for trusted computers
    forming the backbone of the network.


    One of the first currencies to use this idea is Dash (originally launched as XCoin).
    It works by breaking the network up into two classes – the proof-of-work mining
    network, which anyone can join, and the ''masternode'' network. In order to become
    a masternode, a computer must invest or lock away 1000 units of the cryptocurrency.
    At this point the only thing that this computer will do is function as part of
    the verifying service for the currency. The miners create blocks by proof-of-work
    just as with bitcoin, but the masternodes are responsible for approving each block
    amongst themselves using a consensus procedure. Block rewards are split between
    the two networks.


