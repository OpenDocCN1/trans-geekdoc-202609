    # Working by consensus


    Dash’s consensus-based approach has triggered huge interest among those developing
    the next wave of blockchain systems. With it has come the realization that the
    fundamental role of a blockchain is to agree on something, and to reach this agreement
    as quickly as possible (see ‘Proof-of-work’, Chapter 4). Once someone has unlocked
    their wallet and created a transaction, the primary task of the blockchain is
    to record that transaction, and to do this as quickly as possible so the transaction
    cannot be reversed, and so new transactions can be added.


    A company called Ripple has developed perhaps the largest, most evolved sort of
    consensus blockchain yet. Its software, also named Ripple, is based on a new form
    of blockchain designed to handle inter-bank transfers across national borders,
    and even across different national currencies.


    By using a maths and computer science experiment known as the ‘Byzantine Generals
    problem’, the Ripple engineers believe they have shown that both proof-of-work
    and proof-of-stake are unnecessary (See box ‘How does Ripple work?’, below). Ripple’s
    blockchain ledger is designed not only to facilitate transfers of the blockchain’s
    own native currency, called XRP, but transactions in any currency. In a sense,
    the Ripple blockchain forms its own secure correspondent account system (see box
    ‘How to transfer money around the world’, Chapter 12), allowing any bank to create
    transactions between any other.


    After being set up with the hardware by Ripple, a bank becomes a node in the Ripple
    network. Rather than communicating using a conventional currency exchange system
    to debit or credit accounts, two banks can exchange transaction information in
    the ledger, using any currency they prefer. The changes are shown on the ledger
    in real time. And, if a currency'
  - '[PAGE 199]


    exchange is necessary, the network will automatically find the best price for
    the transaction using intermediary ''market makers'' holding reserves of multiple
    currencies and then update all accounts. XRP can even be used to facilitate the
    transaction, without the nodes at either end even knowing that a cryptocurrency
    is involved. These transactions are settled in about one minute, no matter where
    they are taking place.


    By relying on a system of consensus among trusted nodes, the Ripple network allows
    worldwide transactions between participating banks with almost no overhead costs
    other than the price of currency exchange. The company hopes that it will cut
    down on the fees associated with international money exchange. However, only banks
    and companies can be nodes in the Ripple network. Ordinary customers must open
    up an account with one of these banks, and that company uses Ripple to send the
    money to another bank for them. This allows the bank to continue to set the price
    for the transaction. In this way, Ripple hopes to put blockchain ledger technology
    in the mainstream by marketing to those who already control the system, rather
    than disrupting the money transfer industry. As of February 2017, Ripple''s XRP
    cryptocurrency is the third-largest cryptocurrency in total value, after bitcoin
    and Ethereum.


