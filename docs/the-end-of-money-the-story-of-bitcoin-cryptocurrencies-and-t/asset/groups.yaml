    ## 8 Bitcoin comes of age


    From underground beginnings, the world’s most famous cryptocurrency is going mainstream.
    Bitcoin banking is here, and cryptocurrency technology is being included in the
    longer term strategies of financial institutions and governments. So why is its
    use in daily life still limited?


    Cryptocurrency technology is becoming part of the medium-term strategy of global
    financial institutions, including banks, investment houses, and even the economic
    plans of national governments. Investors are putting money directly into cryptocurrencies,
    as well as attempting to leverage them in new types of cryptocurrency-linked services
    offered by otherwise traditional companies and banks. Despite the false starts
    represented by Silk Road and Mt. Gox, there are many people who believe that these
    technologies could fundamentally change the way we use money – and do it legally.


    But cryptocurrencies themselves are only the beginning of a brave new world of
    digital financial technologies. The blockchain is moving away from being simply
    the technological backbone for a currency, and beginning to support the mechanisms
    of banks themselves, including property transactions, various electronic transfer
    services, and, maybe one day, entire corporations.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_110_0.png)


    Bitcoin ATMs are still a rare sight.


    ### What can you buy?


    One of the most common criticisms of cryptocurrencies is that they will never
    replace traditional currencies because they are useless as an everyday means of
    payment (see box ‘A day of bitcoin’, below). This was certainly true back in the
    days when the most common market for cryptocurrencies was an illegal drugs website
    on the dark web. But what about today? The use of cryptocurrency has expanded
    into the realm of legitimate business, but is it enough to allow cryptocurrency
    to replace the daily use of pounds, dollars, euros, and yuan?


    When companies first began experimenting with accepting cryptocurrencies for products
    and services, they largely had to invent their own integration with the cryptocurrency
    on the fly. Today, many companies are offering different forms of cryptocurrency
    integration as a service, expanding the options and offering easy access for companies.
    However, there are many different ways to go about integrating cryptocurrency
    with a business, and no standard method has yet emerged. Confusion continues about
    what the best way to use cryptocurrency is, from the standpoint of both businesses
    and consumers.


    ### A day of bitcoin


    In February 2014, New Scientist reporter Hal Hodson attempted to use no money
    other than bitcoin. What did he find?


    A third-degree Facebook friend, Michael Giouvino, agrees to sell me $150 of bitcoins
    to make the journey to New York. I tell him that I plan to use it to drive there,
    stop at a New Jersey bathhouse on the way, and then head into the city to buy
    some groceries to stock up my girlfriend''s apartment. Giouvino, who has held
    about 600 bitcoins since 2012, chuckles. ''How do you plan to do that?''


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_112_0.png)


    One way to spend cryptocurrency.


    Ah, I see. Fuel is the biggest hitch in a bitcoin roadtrip. Only two gas stations
    in the US accept it – one in Colorado and one in New Hampshire. Neither is on
    my route. Instead, I try an elaborate workaround involving electronic gift cards
    and Walmart. It fails. If I''d planned the trip further in advance, I could have
    bought a preloaded gas card using bitcoins through a website called Coinfueled.
    Never mind. Halfway through my journey, I at least find fuel for myself. I fill
    up on a large burger and fries at TGI Friday''s, paid for with a gift card bought
    with bitcoins via a third-party site.


    Deep in the suburbs of New Jersey, just around the corner from a tax office, is
    a Russian bathhouse – a banya. Bear and Birch is run by ex-Goldman Sachs equities
    trader Peter Kizenko. Inside, you don a bathing suit and join a handful of gruff
    Russians to brave the searing heat. There''s a bundle of birch twigs with a duct-taped
    handle that you can soak in icy water and thrash yourself with. All for just 0.03
    bitcoins.


    “It''s the easiest thing ever to start accepting it,” says Kizenko, reclining
    on the veranda of the bathhouse. He started the bathhouse two years ago, after
    leaving his job with Goldman Sachs in Moscow and finding he missed his homeland''s
    banya. The IRS office might be just around the corner but it is still unclear
    how bitcoin should be taxed. Kizenko isn''t worried, not least because it is too
    small a part of his revenue and he says the public blockchain, which records every
    transaction, will make compliance a doddle.


    But while accepting the currency is easy, doing anything else with it, like converting
    it into dollars, is less so, Kizenko says. Several exchanges have been shut down
    by the authorities recently, making it too risky to base a business on it.


    After the bathhouse, I head for Brooklyn''s Greene Ave Market. It''s a 24-hour
    organic grocery store offering 10 per cent off for those paying with bitcoins,
    one of just a handful of places in New York that accepts the currency for physical
    goods. Ali, the shop assistant, whips out a cell phone and texts me the string
    of numbers and letters that serves as the shop’s bitcoin address. After I transfer
    6.017 bitcoins, he calls his boss to check the payment came through. Other customers
    catch my eye, disconcerted by this odd transaction. It was simpler at Bear and
    Birch, where I just scanned a barcode.


    For now, there are surprisingly few outlets that accept bitcoin in NYC, considering
    the attention it has had in the past year. A dog-walking business called Puppy
    Paws in Brooklyn takes it, as does a pizza joint closer to the river called Lean
    Crust and a bar called EVR. A handful of legal offices, dentists and estate agents
    accept it. Throughout my trip, though, the question “Do you take bitcoin?” is
    generally met with puzzled looks.


    Later, I head to the new bitcoin center in the heart of Wall Street, sandwiched
    between the towers of traditional finance. Aficionados run their own bitcoin trading
    floor, named Satoshi Square after the currency’s mysterious creator. On the evening
    that I visit, the topic for discussion is Ethereum, a new platform for virtual
    currencies.


    Those on the cutting edge need no convincing – for them, the revolution is here.
    But when you can’t do much more than buy pizza in New York City, you know bitcoin
    still has a long way to go.


    ### From dollars to bitcoin via Japan


    In the early days of bitcoin, one of the most readily apparent business models
    enabled by the cryptocurrency was the exchange. Before Mt. Gox, the only way to
    acquire bitcoins, other than mining them, was by purchasing them from another
    user on an ad hoc basis. Mt. Gox created the first currency exchange.

