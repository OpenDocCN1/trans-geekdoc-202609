    algorithm specially designed to harness all that computing power for other means.


    In 2013, a programmer with the pseudonym Sunny King announced a cryptocurrency
    called Primecoin. What distinguishes it from bitcoin was that it harnessed the
    proof-of-work in order to discover new members of a class of prime numbers called
    Cunningham chains. These are not the largest prime numbers, which require massive
    supercomputers to discover and prove, but sets of prime numbers where by taking
    one prime, doubling it and subtracting one, another prime number is given, and
    so on. Though Primecoin was never particularly popular as a currency, its proof-of-work
    has revealed some record-breaking Cunningham chains.


