  mdcn: "\n\n### 交易\n比特币转账被写记为区块链上的交易，并提交以包含在新解出的区块中。\n\n### 交易可延性问题\n比特币软件中的一个缺陷，它允许格式不正确的交易被区块链接受，然后返回一个意外的交易\
    \ ID。如果软件不知道这个意外的交易 ID，它通常会尝试再次处理该交易，从而导致重复交易。\n\n### 钱包\n加密货币账户的私钥。钱包会对提交到区块链的所有交易进行签名，并将所有公共地址关联起来。\n\
