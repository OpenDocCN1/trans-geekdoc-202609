    But one of the critical failures of the DAO was to assume that it would really
    be just that simple. Even setting aside the recursive split vulnerability, it
    is difficult to believe that anyone thought an organization allowing rampant secession
    upon disagreement would work. Human beings are likely to disagree, to attempt
    to take advantage of each other, and to try and use power structures for their
    own ends. It seems that the recursive split vulnerability might have saved everyone
    a lot of trouble by stopping the DAO before it got started, and before it fractured
    itself into a thousand different Child DAOs that could not come to any sort of
    agreement with one another.


    To see just how poorly the DAO estimated human nature, one merely has to study
    the so-called ‘Stalker Attack’. The Stalker Attack was merely hypothetical, because
    the DAO did not exist long enough for an instance of this abuse to ever truly
    occur.


