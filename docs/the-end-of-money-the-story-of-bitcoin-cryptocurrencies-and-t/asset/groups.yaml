  mdcn: "\n邓宁-克鲁格效应，一种认知偏差，业余爱好者会高估自身能力。\n\n- 6 比特币税收。瑞士的楚格市已成为全球首个接受加密货币比特币用于政府服务的城市。这项从2016年7月1日开始的试点计划将允许公民使用比特币缴纳税款、罚款和费用，前提是金额低于200瑞士法郎（205美元）。\n\
    \n## 与加密货币相关的七个现实世界地点\n\n- 1 日本东京。已倒闭的比特币交易所Mt. Gox的所在地。\n- 2 冰岛凯夫拉维克。在线暗网市场丝绸之路（Silk\
    \ Road）服务器的所在地。\n- 3 中国北京。OKCoin的所在地，按交易量计算是全球最大的比特币交易所之一。\n- 4 香港。Bitfinex的所在地，按交易量计算是全球最大的美元/比特币交易所之一。\n\
    - 5 瑞士巴尔。以太坊（Ethereum）的所在地，这是一个基于公共区块链的计算平台。\n- 6 美国纽约州。BitLicense的所在地，这是专门针对加密货币公司的首张金融牌照。\n\
    - 7 荷兰阿纳姆。最“比特币友好”的城市之一，2016年该市宣称拥有超过100家直接接受比特币支付商品和服务的商家。\n\n## 用加密货币购买的六件奇怪物品\n\
    \n- 1 **价值数百万美元的披萨。**2010年4月，比特币爱好者拉兹洛·汉耶奇兹（Laszlo Hanyecz）说服某人向其家中送几张披萨，作为交换支付了10,000个比特币。当时比特币尚未公开交易，但几个月后，当Mt.\
    \ Gox开始营业时，一个比特币的价格定格为6美分，使得汉耶奇兹的披萨每片成本为300美元（作为早期矿工，汉耶奇兹的比特币储备应相当可观）。2016年底，当比特币交易价格超过每枚700美元时，同样的披萨每片价值将达到350万美元。\n\
    - 2 **比特币上太空！**维珍银河（Virgin Galactic）尚未载客前往太空——但他们正在出售机票。排队入座需花费25万美元。但你可以用比特币支付（按当前汇率）。\n\
    - 3 **冰上的加密货币。**由于单价极低，狗狗币（dogecoin）被誉为筹集慈善善款的理想代币。每枚仅几分之一美分，易于获取，也易于一次性捐赠数千枚给有价值的事业。2014年，狗狗币支持者将这一说法付诸实践，筹集了超过3万美元，帮助牙买加雪车队前往索契冬奥会。\n\
    - 4 **比特币巨无霸。**虽然市面上新出的比特币借记卡和信用卡可能让日常比特币购物看起来不那么令人兴奋，但2016年，荷兰阿纳姆的汉堡王开始直接接受比特币时，比特币用户可谓是捡了便宜。任何使用比特币购买招牌巨无霸三明治的人都会获得另一份免费。\n\
