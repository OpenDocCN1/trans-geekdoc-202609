    接下来，人们会向 DAO 提交服务建议，试图从 DAO 的资金储备中获得资助。他们可能会建议完成一项任务，例如为 DAO 编辑代码，或者构建并销售某种基于以太坊的产品，甚至做慈善工作。提供服务的人，称为“承包商”，也会建议为他们的工作索取多少报酬，或者是否会将其计划中的部分利润交给
    DAO。DAO 中的代币持有者随后会对提案进行投票。如果获得批准，承包商将执行工作，当合同条款履行完毕后，DAO 将支付报酬。如果有任何利润回到 DAO，将在代币持有者之间分享。


    DAO 理念变得非常流行，筹集了超过 1.5 亿美元的以太币——这是历史上最成功的众筹项目。但很快，DAO 编程中开始出现复杂问题。


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_206_0.png)


    未来的董事会？


    结果表明，DAO 容易受到其自身类型的 51% 攻击（参见‘工作量证明，第 4 章’）。如果有人设法获得 51% 的 DAO 代币，他们就可以自动控制任何进行中的投票。攻击者可以提交一份提案，实质上是说“把
    DAO 的所有钱都给我”，然后利用多数票批准该计划。


    为防止这种情况，创建了多个防御协议。首先，添加了‘管理人’角色。由真人担任，工作是亲自批准每一笔向外付款。其次，决定重要投票（任何超过非正式投票的事项）将分两部分进行。第一部分是对手头问题的投票，要么批准提案，要么否决提案。然后，投票会再次回到代币持有者手中，让他们选择接受第一次投票的结果，或者选择分叉。如果他们接受结果（无论投赞成还是反对），他们将留在
    DAO 中。如果他们选择分叉，他们的代币及附带的投票权将被转移到‘子 DAO’，在各方面都与原始 DAO 完全相同，但是独立的。换言之，分叉功能让股东有机会在不同意某次投票时退出
    DAO。


    几乎立即，问题就出现了。首先，在 DAO 存在最初几周内提交给代币持有者的多个不同提案中，没有一项能够达到法定人数。法定人数是通过算法确定的，但至少需要代币持有者的
    20%。然而，大多数提案最多只获得了 10% 的投票。有人将此归咎于投票的技术困难。另一些人认为，许多代币持有者是作为投资购买的，对 DAO 的原则或参与其管理不感兴趣。确实，随着代币的销售，代币价格暴涨，但很少有人参与关于
    DAO 未来的日常讨论。


    但第二个更严重的问题出现了。一些程序员认为他们在 DAO 代码中发现了一个漏洞，该漏洞允许代币持有者提取自己的资金并退出 DAO。这意味着用户可以通过多次请求提款来欺骗
    DAO，在此期间 DAO 只会检查一次用户的账户余额。这种攻击与交易延展性问题（参见“什么是交易延展性问题？”，第 4 章）不无相似之处，因为通过利用该漏洞，攻击者可以提取其账户中实际金额两倍的钱。（尽管从代码角度来看，这两个问题完全不同。）通过多次连续执行这种递归分叉攻击，犯罪分子可以轻易掏空
    DAO 的加密货币。


    漏洞公布一周后，攻击者发动了袭击。近 8000 万美元价值的以太币，约占 DAO 总持有量的三分之一，被提取出来。持有 DAO 代币的人以及更广泛的以太坊社区陷入恐慌，代币和以太币的价值在加密货币交易所暴跌。


    ## 拯救 DAO


    一个直接而明显的解决方案是对以太坊区块链进行硬分叉。因为 DAO 的代码在区块链内，不能简单地回滚来逆转盗窃。保存 DAO 的同一个区块链也使得 DAO 难以修改或更新。但是，如果回滚整个区块链，所有资金都可以退还给原始投资者，就好像盗窃从未发生过一样。


    这个方案在伦理上令许多人感到困扰。以太坊的一个创始理念是代码定义了区块链中的存在。如果区块链在出现错误时随时可以分叉，那代码所谓的‘不可变性’又意味着什么？即使在盗窃中损失了钱的人也不喜欢这种影响。然后，争议进一步升级，一名自称攻击者的人发布了一篇博客文章，批评
    DAO 的创始人反悔。攻击者声称，DAO 的创建就是要用代码取代法律，包括其所有缺陷。攻击者在自己看来并没有偷任何东西。他们只是发现了一个法律漏洞。他们只是遵循了
    DAO 创始人所推崇的‘不可更改、不可阻止、不可反驳的计算机代码’固有的有缺陷规则，因此他们要求获得奖励。如果其他人遭受损失，那只能怪他们自己没有仔细审查代码。


    姑且不论挑衅，结果发现攻击者并没有平安带着钱离开。递归分叉攻击的性质意味着攻击者不能直接带着被盗资金离开，而是必须使用子 DAO 功能进行‘分拆’。并且在使用分叉功能时，根据原始代码触发了
    27 天的等待期（旨在为拆分到子 DAO 的人提供宽限期以考虑其选项）。


    追踪盗窃的程序员发现了攻击者提取被盗资金的子 DAO；那只是一个被遗忘的、一直保持开放的分拆提案。这些程序员自称‘罗宾汉’，然后对被盗资金执行了同样的递归分叉攻击，将其提取到另一个子
    DAO 中，再下一步。但是，他们同样会被锁定在 27 天的等待期内，在此期间原始攻击者可能会再次发动攻击。


    但这种无休止的僵局确实暗示了另一种选择：软分叉。在这种情况下，可以修复漏洞，如果时机把握得当，最终罗宾汉和其他仁慈攻击者手中的所有资金很可能可以归还给原始所有者，尽管该过程复杂且不一定成功。这种方案的好处是以太坊区块链不需要永久更改。


    但最终，所有开发人员都开始同意软分叉是一场赌博。该过程中可能还有其他尚未发现的漏洞。硬分叉确实是最佳选择。它还将永久关闭 DAO，并将所有以太币返还给最初购买
    DAO 代币的人。


    2016 年 7 月 20 日，硬分叉被推出。以太坊区块链用户可以选择运行新的分叉版本软件，或继续使用旧版本。绝大多数用户，超过 85%，选择了新分叉。来自
    DAO 的所有资金，现在都汇入了该分叉，正在返还给其原始所有者。


    但是，大量以太坊用户没有采用该分叉，实质上分裂了以太坊区块链。截至 2016 年 8 月，现在有两个以太坊区块链和两种以太币加密货币。采用该分叉的被称为以太坊
    1 号，而拒绝该分叉的区块链称为以太坊经典。两个独立的以太坊区块链对 DAO 的影响尚不清楚。


