    \n## 术语表\n\n| 术语 | 定义 |\n|------|------------|\n| 51% 攻击 | 在诸如比特币这样的工作量证明加密货币中，如果攻击者能够控制网络中51%的哈希算力，他们从技术上能够用错误信息重写区块链。工作量证明的难度本应使实现这一51%几乎不可能。\
