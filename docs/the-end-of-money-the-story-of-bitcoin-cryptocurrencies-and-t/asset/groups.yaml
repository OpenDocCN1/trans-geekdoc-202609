    the necessity of creating proof-of-work hash. While proof-of-work was necessary
    to the functioning of the blockchain of cryptocurrencies like bitcoin, it severely
    limited the sort of otherwise useful tasks that a cryptocurrency mining could
    complete. To scale the difficulty properly (see ‘Proof-of-work’, Chapter 4) the
    proof-of-work task has to be very specific. When downloading new files from the
    central server for processing, BOINC often has the computer work on different
    sorts of tasks, and doing the same task over and over would not necessarily be
    productive, outside of very particular tasks like looking for prime numbers. But
    if proof-of-work was not required to secure the blockchain transaction logging,
    then that processing power would be available to perform more useful tasks, like
