    66 per cent of its nodes are honest, the Byzantine Generals problem shows that
    security of the blockchain is assured. But Ripple goes a step further, by asking
    the nodes to poll only their trusted nodes. And just to be extra careful, Ripple
    requires an 80 per cent agreement level. If any transaction can’t reach consensus
    in this way, it is held over. In this way, the blockchain allows transactions
    with obvious consensus to proceed as quickly as possible, while flagging confusing
    transactions and making them wait for agreement.


    ## Smart contracts


    Many of the recent innovations involving the blockchain focus on the concept of
    including additional information along with or instead of cryptocurrency transactions
    in the ledger. Ripple allows records of other currency transactions, Nxt allows
    additional text to enable the sorting of different groups or categories of cryptocurrency
    (called ‘colours’) which could allow different kinds of assets like property or
    commodities to be represented on the blockchain. Companies like Chain and Factom
    are figuring out how to log ownership and shareholder information in the blockchain.
    Software updates have even been proposed for bitcoin’s blockchain that would increase
    the size of the block to allow more transactions. These might bring additional
    text or cryptographic facilities to the blockchain that would deliver entirely
    new features.


    Some of the greatest excitement in the world of blockchain development involves
    putting not just transactions or data in the blockchain, but code itself. This
    would allow the blockchain to act as a decentralized program, in effect running
    software that could update and alter itself in response to changing conditions
    in the market. This code could enable what are known as ‘smart contracts’ that
    function autonomously. However, researchers are discovering that this new realm
    of combined code and legalese is giving birth to serious complexities.


    Smart contracts were first suggested by virtual currency developer Nick Szabo
    in 1997. The idea is fairly straightforward: when buying a house, for example,
    the money and deeds are usually passed to a trusted third-party such as a lawyer
    or a bank. When the third-party is satisfied that both sides of the deal have
    fulfilled their contract requirements, they hand over the money and the deeds,
    accordingly. A smart contract could do this automatically, without requiring a
    third-party. Both deeds and money are given to the program in digital form, along
    with the terms of the agreement. When the smart contract observes that the terms
    are fulfilled, it delivers the digital payment and product directly. The blockchain
    secures the code of the contract in the decentralized mechanism of the ledger,
    in the same way that it secures the transactions of a cryptocurrency. The same
    blockchain might hold the deed, the payment, and the contract, simply updating
    its ledger to account for the new, swapped ownership.


    Such contracts don’t have to be large or complex. For example, something as simple
    as a parking meter could run code in a blockchain – when the parking payment is
    received, it registers the vehicle as legally parked. A smart contract could simply
    be a voting mechanism. Rather than receiving any money, the code could accept
    votes from registered shareholders and report the final tally. And there are also
    contracts in which the blockchain code doesn’t have to make any decisions whatsoever,
    but instead could behave like a digital storage locker. Money goes into the locker,
    and cannot be removed until both parties agree to open the locker, using their
    public-encryption key. Some of these simple contract ideas could be deployed in
    future versions of bitcoin, like the proposed Lightning Network (see ‘The Lightning
    Network’, Chapter 11).


    ## The age of Ethereum


    Now that smart contracts have captured the attention of blockchain developers,
    other possibilities are starting to emerge. Could blockchains manage shareholder
    voting mechanisms, for instance? Could they even control entire corporations?


    From a legal perspective, a corporation is no more than a series of rules defining
    leadership, ownership, and profit-sharing structures. Perhaps something like this
    really could be written into code, and then secured in the blockchain. This could
    be described as an ‘autonomous corporation’.


    In 2015, a Russian programmer called Vitalik Buterin launched Ethereum, a blockchain
    that allows smart contracts to be embedded within it. Using a custom programming
    language called Solidity, programmers can upload their code to the Ethereum blockchain,
    paying a small fee in Ether, the blockchain’s cryptocurrency. Once the code is
    implanted into a block, it receives an address. Anyone may then target the address
    using their computer, and run the code contained inside. The limits of what the
    code can do are up to the programmer. It might be a small program that responds
    with generic text, or a simple contract that only responds to specific people
    with authorization. In theory, it could also be an autonomous corporation programmed
    to buy something useful, rent it out, and then take payment – all within the distributed
    Ethereum blockchain.


    The potential of Ethereum has led to a renaissance in the idealism that gave birth
    to bitcoin, and autonomous corporations have become the new dream for libertarian
    proponents of cryptography. If an entire business can be held in a distributed,
    decentralized blockchain beyond the jurisdiction of any nation, it offers an entirely
    new notion of ‘free’. Who would collect taxes from an autonomous corporation?
    To which politicians would a blockchain-based business have to bow? Imperfections
    of governments could be side-stepped, replaced by code – simple, open-source and
    accessible to anyone with programming skills, yet ultimately secure and free from
    human weakness. Investors infected by this idealism leapt at the chance to support
    Ethereum, and Ether became the second-largest cryptocurrency after bitcoin.


    All kinds of proposals began to appear in the wake of Ethereum’s launch. For instance,
    a Swiss company named Slock.it came up with a plan to build a lock – the physical
    kind, that fits on a door – that could connect to the internet and the Ethereum
    blockchain. This would allow people to use the blockchain to rent property, for
    a short time such as a holiday period, and the lock would only open the door when
    the customer had paid the fee, and lock automatically again when the rental period
    was over.


    ## Ripple versus Ethereum


    One way of looking at the future of the blockchain is as a contest between Ripple
    and Ethereum. Ethereum embodies much of the idealistic spirit of the early days
    of cryptocurrencies. It was this spirit that brought about the DAO (see below),
    and was also the means of its collapse. In the rush to make something new, mistakes
    are often made. Ripple, on the other hand, seems to embrace a more conventional
    approach. Rather than attempting to forge new ground, Ripple is appealing to those
    already in control of the financial networks. Rather than a revolution, it is
    offering a product. And indeed, Ripple has toned down some of its early aspirations
    in order to better target a service it thinks that banks might buy.


    Which is the right way of doing things? Both are trying new ideas with completely
    new markets, and so far no clear winner has emerged.


    Yet this could provide a useful perspective by helping us categorize new financial
    technologies. Is a technology ‘with the system’ or ‘against it’, idealistic or
    realistic, revolutionary or incrementalist? It is out to prove new concepts, or
    just out to make a buck? These questions might help us understand the motivations
    of the developers and proponents of the technology. Judging the technology itself,
    however, will require different criteria, and eventual success is far harder to
    predict.


    ## Autonomous corporations


    The Decentralized Autonomous Organization (DAO) was born when Christoph Jentzch,
    brother of Slock.it CEO Simon Jentzch, had an ambitious plan. He decided to try
    to create the sort of autonomous corporation that Ethereum creator Vitalik Buterin
    had first discussed. So he began writing code, and with support from Slock.it,
    published it to the Ethereum blockchain in early 2016.


    The idea behind the DAO seems relatively simple. The DAO would be a vehicle for
    crowdfunding. Potential funders would buy shares in the DAO, called DAO Tokens,
    using Ether, the native Ethereum cryptocurrency. These tokens granted voting rights
    in proportion to the number purchased. From these sales, the DAO accumulated cryptocurrency
    capital which it was then able to invest.

