  md: '# MURDER FOR HIRE. DRUG TRAFFICKING. MONEY LAUNDERING.


    These might sound like plot lines from a thriller, but they are true stories from
    the short history of cryptocurrencies.


    The most famous – or infamous – cryptocurrency is bitcoin. But look beyond its
    tarnished reputation and something much shinier emerges. The technology that underlies
    bitcoin and other cryptocurrencies – the blockchain – is hailed as the greatest
    advancement since the invention of the internet.


    The End of Money is your essential introduction to this transformative new technology
    that has governments, entrepreneurs, and forward-thinking people from all walks
    of life sitting up and taking notice.'
