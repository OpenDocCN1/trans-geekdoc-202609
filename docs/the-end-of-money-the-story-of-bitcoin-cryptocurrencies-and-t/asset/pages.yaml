  img_proc: true
- pgno: 220
  md: '# Six strange things bought with cryptocurrency


    +   1 **Multi-million dollar pizza.** In April 2010, bitcoin aficionado Laszlo
    Hanyecz convinced someone to send a couple of pizzas to his home in exchange for
    10,000 bitcoins. At the time bitcoin wasn''t traded publicly, but a few months
    later when Mt. Gox opened for business, the price of one bitcoin settled at 6
    cents, making Hanyecz''s pizzas cost $300 a piece (as an early miner, Hanyecz''s
    stash would have been quite large). At the end of 2016, when bitcoin was trading
    above $700 each, those same pizzas would be worth $3.5 million a piece.


    +   2 **Bitcoin in space!** Virgin Galactic is not taking passengers to space
    just yet – but they are selling tickets. To join the line costs $250,000. But
    you can pay in bitcoins (at current exchange rate).


    +   3 **Cryptocurrency on ice.** Because of its small value, dogecoin was lauded
    as a good coin to raise money for charity. At only a few fractions of a cent per
    coin, it was easy to earn, and easy to give a few thousand at a time to a worthy
    cause. Dogecoin supporters put this claim to the test in 2014, when they raised
    over $30,000 to help send the Jamaican bobsled team to the Sochi Olympics.


    +   4 **Crypto-whoppers.** While new bitcoin debit and credit cards on the market
    might make everyday purchases using bitcoin seem less exciting, bitcoin users
    were in for a deal when the Burger King of Arnhem, The Netherlands began accepting
    bitcoin directly in 2016. Anyone buying the signature Whopper sandwich with bitcoins
    received a second one free.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '5 Degree in person, paid online. The University of Nicosia in Cyprus, Greece
    accepts bitcoin to pay for tuition. But, perhaps this only makes sense, given
    that they offer a Master of Science degree in Digital Currency.


    6 Consume at own risk. While the online marketplace Silk Road had a reputation
    as a market for illegal goods, particularly drugs, the anything-goes attitude
    provided for some odd products on offer. Computer parts, poker lessons, designer
    fashion, and rare coins were all sold for bitcoins on the site. But perhaps there
    was nothing weirder than the offer of dried reindeer meat, direct from Finland.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Five quotes


    +   1 ''People have been defending their own privacy for centuries with whispers,
    darkness, envelopes, closed doors, secret handshakes, and couriers. The technologies
    of the past did not allow for strong privacy, but electronic technologies do.''
    Eric Hughes, Cypherpunk Manifesto


    +   2 ''What is needed is an electronic payment system based on cryptographic
    proof instead of trust.'' Satoshi Nakamoto


    +   3 ''Satoshi Nakamoto is not really a man; he is a manifestation of public
    acclamation, an entity made by technology, and a myth.'' Andrew O''Hagan, The
    Satoshi Affair.


    +   4 ''I''m reasonably confident ... that the blockchain will change a great
    deal of financial practice and exchange.'' Larry Summers, former US Secretary
    of the Treasury


    +   5 ''Bring paper money into a country where this use of paper is unknown, and
    everyone will laugh at your subjective imagination.'' Karl Marx'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Five literary references


    Perhaps it is no surprise that science fiction is rich source of storylines about
    digital money.


    +   1 *Neuromancer* (Ace Books, 1984). William Gibson''s formative 1984 novel
    describes a virtual world where power is held by whoever can control the technology
    and where wealth moves in digital form.


    +   2 *Cryptonomicon* (Avon Books, 1999). The 1999 novel by Neal Stephenson tells
    two intertwined stories – one set in the golden age of cryptography, during the
    Second World War, and the other in the late 1990s involving a plot of digital
    currencies and data havens.


    +   3 *Reamde* (William Morrow, 2011). Another of Stephenson''s novels contains
    a convoluted scam involving digital currency within a virtual world, but this
    was more like the virtual currency of a massive online role-playing game like
    World of Warcraft.


    +   4 *Neptune''s Brood* (Ace Books, 2013). This 2014 book by Charles Stross features
    a fictional universe where there are different types of money termed ''fast, medium
    and slow''. They involve cryptographic signatures to verify transactions, with
    the slower ones requiring digital signing beams by laser from a distant star (the
    additional time constraints make the money more secure). Stross is a widely known
    critic of bitcoin.


    +   5 *Down and Out in the Magic Kingdom* (Tor Books, 2003). One of the most unique
    fictional explorations into virtual currency comes from writer Cory Doctorow.
    In this 2003 novel, he creates a currency called ''whuffle'', a currency based
    on social reputation.'
  merge: -1
  img_proc: true
