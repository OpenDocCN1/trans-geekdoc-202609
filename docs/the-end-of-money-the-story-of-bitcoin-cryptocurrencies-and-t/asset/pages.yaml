- pgno: 174
  md: '# It''s not about the money


    The true value of cryptocurrencies such as bitcoin may not lie in coins. Technological
    innovations arising from the blockchain itself could turn out to be far more exciting.
    So where will they lead?'
  merge: -1
  img_proc: true
- pgno: 175
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 176
  md: 'In its heyday in 2013, bitcoin’s value peaked at around $1,200 per coin. Not
    surprisingly, the cryptocurrency was feted as the ‘future of money’. Today, with
    bitcoin’s value halved, media interest has also waned. Yet all kinds of businesses,
    along with city investors and futurists have found something else about the technology
    to get excited over – in particular, the potential of the blockchain itself.


    The blockchain is, of course, the central innovation that allows cryptocurrencies
    to function (see ‘The blockchain’, Chapter 4). But this shift in attention has
    occurred as people working with the technology have realized that the blockchain
    might be good for a great many things besides cryptocurrencies.


    It turns out that a digital, decentralized ledger is useful for handling all kinds
    of information, from business contracts or private financial records to sensitive
    healthcare data. And people are scrambling to determine what might best be kept
    in the blockchain, and whether that blockchain should be attached to bitcoin,
    another cryptocurrency, or something completely different. Most surprisingly,
    this research is not just coming from tiny startups or libertarian hackers. Some
    of the most ambitious projects are being run by mainstream financial institutions
    such as major banks. They are determined to understand the true potential of this
    powerful technology, and not be left behind any financial revolution.


    # Blockchains as research tools


    One criticism of bitcoin is that maintaining a large network generating hash,
    simply to support a cryptocurrency through the proof-of-work is a huge waste of
    time and electricity. For bitcoin, the proof-of-work algorithm is called SHA-256,
    and it is a fairly standard cryptographic algorithm. Indeed, many research tasks
    require computers to do similar work'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'to hashing – crunching through enormous sets of very small problems in order
    to solve a task by brute force. Perhaps it was unsurprising then, that a few years
    after bitcoin appeared, experiments began in which SHA-256 was replaced by another
    algorithm specially designed to harness all that computing power for other means.


    In 2013, a programmer with the pseudonym Sunny King announced a cryptocurrency
    called Primecoin. What distinguishes it from bitcoin was that it harnessed the
    proof-of-work in order to discover new members of a class of prime numbers called
    Cunningham chains. These are not the largest prime numbers, which require massive
    supercomputers to discover and prove, but sets of prime numbers where by taking
    one prime, doubling it and subtracting one, another prime number is given, and
    so on. Though Primecoin was never particularly popular as a currency, its proof-of-work
    has revealed some record-breaking Cunningham chains.


    Another cryptocurrency, Riecoin, set out to solve another set of problems involving
    prime numbers. The proof-of-work, in this case, is looking for clusters of consecutive
    primes called ‘constellations’. These prime constellations could potentially be
    used to aid work on the Riemann hypothesis. The Riemann hypothesis is a complicated
    mathematics question that has yet to be proven, remaining one outstanding mystery
    of the field. It is so well known, it has been designated one of the seven Millennium
    Prize Problems by the Clay Mathematics Institute. Named in 2000, thus far only
    one has been solved, despite a reward prize of $1 million for a successful proof.
    The prime constellations would not prove the Riemann hypothesis, but they could
    potentially discover a prime constellation that would disprove the hypothesis
    – a discovery of great theoretical importance in its own right. Most mathematicians
    expect that'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'the Riemann hypothesis will eventually be shown to hold true, but in the meantime,
    Riecoin is working on testing it.


    # A new address book for the internet


    While the blockchain could help with the discovery of new prime number combinations,
    it has also been trialled as a practical way to help keep internet records safe.
    The code for each website on the internet is stored on a particular computer server,
    with the website’s name linked to the unique address – or ‘IP address’ – of this
    server through the domain name system (DNS). Surprisingly perhaps, for a global
    system, the DNS records for the entire world are held in databases stored in just
    13 servers.


    In 2011, it was suggested that DNS records could be decentralized by putting them
    in the blocks of a blockchain associated with a new currency called Namecoin,
    a relative of bitcoin. Just as transaction records of other cryptocurrencies are
    stored in the blockchain, the Namecoin blockchain was able to store the DNS records
    for websites using a .bit top level domain designator.


    Yet while Namecoin worked fine, it never caught on. One issue was that you needed
    a browser with a special add-on program to access .bit sites via the Namecoin
    DNS information. Also, most websites continued to use the standard DNS registry.
    Very few legitimate websites ever registered in the Namecoin blockchain. In fact,
    of the 196,000 sites in the Namecoin registry, it was estimated that the vast
    majority did not even have a website attached to the name. In May 2016, the last
    major exchange trading Namecoin stopped dealing with the cryptocurrency, and the
    experiment ended.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# BOINC


    Others have pursued more ambitious uses for the blockchain. Back in 2002, a team
    based at the spe sciences lab at the University of California, Berkeley, developed
    software called the Berkeley Open Infrastructure for Network Computing, or BOINC.
    Their idea was to harness the power of computers around the world to help a group
    of researchers at the Search for Extraterrestrial Intelligence (SETI) Institute
    sift through radio signals from space to hunt for signs of aliens.


    BOINC allowed them to spread the effort of this search task by chopping up signals
    into small batches and sending them out to individual computers which, when sitting
    unused, would look for signs of alien communication. Once a computer had completed
    one batch, the results were returned to SETI and new batches received. The trick
    was that the search program behaved like a screensaver, only running at night
    or when the computer was idle. Named the SETI@HOME project, it rapidly became
    one of the largest distributed computing efforts in the world. And today BOINC
    doesn’t just look for aliens – the software is now used to hunt for new cures
    for diseases, to map the Milky Way, and even to crack codes.


    # Replacing proof-of-work with proof-of-stake


    In 2015, a researcher named Rob Halford wondered if he could connect BOINC to
    a cryptocurrency. BOINC was already set up to divide computer tasks amongst many
    computers. In addition, it could call on large numbers of people willing to run
    its software. If those individuals were rewarded with cryptocurrency for their
    efforts, and if existing currency miners could also be drawn into using BOINC,
    everyone could benefit. But in order to do that, the researchers would have'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'to utilize an entirely new sort of blockchain that would free up computers
    from the necessity of creating proof-of-work hash. While proof-of-work was necessary
    to the functioning of the blockchain of cryptocurrencies like bitcoin, it severely
    limited the sort of otherwise useful tasks that a cryptocurrency mining could
    complete. To scale the difficulty properly (see ‘Proof-of-work’, Chapter 4) the
    proof-of-work task has to be very specific. When downloading new files from the
    central server for processing, BOINC often has the computer work on different
    sorts of tasks, and doing the same task over and over would not necessarily be
    productive, outside of very particular tasks like looking for prime numbers. But
    if proof-of-work was not required to secure the blockchain transaction logging,
    then that processing power would be available to perform more useful tasks, like
    BOINC calculations.


    The first cryptocurrency to show that it was possible to move away from proof-of-work
    was called Peercoin. It replaced proof-of-work with a method called ‘proof-of-stake’.
    This proof-of-stake creates a value for each coin in the cryptocurrency, called
    ‘coin age’. The longer a coin had been held without being spent, the ‘older’ it
    is. Every time it is spent, it is ‘reborn’, and its age resets to zero.


    When it was time to create the next block, the Peercoin network would decide that
    the block was to be created by the computer in the network with the wallet with
    the most coin age – that is, the person who had owned the most coins without spending
    them, the longest. It is possible to predict which wallet has the highest coin
    age, so this process is not random. But nevertheless, it is secure: after the
    block is created, the coin age of that computer’s coins are reset to zero. Therefore,
    a computer can never form a block twice in a row. In order to mess with the blockchain
    by double-spending, two computers'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'would have to save up a tremendous amount of wealth in the cryptocurrency in
    order to guarantee it the chance to create a block, not just once, but twice in
    a row, in order to create contradicting transactions. As the coin age is reset,
    there would be no way for someone to reuse that coin age to promote a usurper
    blockchain with false transactions. It is theorized that anyone with that amount
    of wealth wouldn''t risk damaging the blockchain, because the amount of investment
    they would lose from a price crash in the aftermath of a successful attack would
    pale in comparison to how much they might make with a faulty transaction.


    Most important of all, proof-of-stake eliminates the proof-of-work role for the
    blockchain, making it less demanding on computer processors. The coin age is the
    only thing necessary to trigger a new block, no computer-intensive hashing is
    required. Using a hybrid of proof-of-stake with the valuable computing work done
    by BOINC, Rob Halford''s new cryptocurrency Gridcoin rewarded BOINC users with
    coins for contributing to any project in the BOINC network.


    # Wait, what happened to proof-of-work?


    In the entire (albeit short) history of cryptocurrency, proof-of-work has been
    the fundamental activity in securing the blockchain. Thousands of mining computers
    churn through electricity, creating randomized cryptographic hash, without which
    bitcoin could not function. So what happened to turn this state of affairs upside
    down? How did proof-of-work suddenly become unnecessary?


    The thinking behind bitcoin and proof-of-work cryptocurrencies is that all computers
    on the network are equal, and all computers are equally likely to attempt'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'to take over the blockchain by issuing bad transactions or by changing transactions
    that already exist. From the amount of value in the system, one might conclude
    that an attempt to defect against the network would be highly likely. Proof-of-work
    makes it so incredibly hard for any computer to take over the network, this hypothesized
    mass defection becomes nearly impossible. Hashing is a hard limit that affects
    each computer equally, and increases in effectiveness the more computers take
    part. It is like a fence around a herd of sheep, that grows in size and height
    the more sheep are added to the flock.


    But beginning with proof-of-stake, a new paradigm began to grow. In this thinking,
    the most important nodes are those with a lot of stake in the system. Each of
    these nodes has a great deal of investment in the network, and a situation in
    which multiple nodes could be controlled by the same attacker is very unlikely.
    It this case, it is in the nodes'' interest to agree, rather than to defect. Therefore,
    consensus is assumed to be likely, and the primary task is to catch wayward nodes
    and get them back on track. To use the analogy of sheep again, the herd''s tendency
    is to stay together, and all that is required is a sheepdog to find the lost sheep
    and chase them back to the herd.


    So if proof-of-work is not necessary, why is it still in use? Bitcoin''s users
    are more conservative and suspicious of big changes, perhaps. But even new blockchains
    like Ethereum still use proof-of-work (see ''The age of Ethereum'', Chapter 13).
    The reasons are varied. Some cryptocurrency designers still want mining to exist,
    as an impetus for users to join the network and support the cryptocurrency. Others
    want the nodes to be more'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'democratic, unlike blockchains that privilege particular nodes with a greater
    stake. Additionally, some don''t yet trust the proof-of-stake concept, and feel
    that proof-of-work is more tested – after all, if it works for bitcoin, it must
    be good. Right now, there are proponents for each method. But in the future, we
    might see a strong preference for one over the other across the many blockchain
    applications that are currently in development.


    # Banks and blockchains


    As cryptocurrencies have become more valuable, and the usefulness of blockchains
    to collect and store accounting information has become apparent, the blockchain
    has begun to look less like a marginal experiment. Economists, bankers, as well
    as blockchain proponents, have all started to examine how blockchains might function
    within existing financial markets, not as an alternatives to them.


    For instance, large banks such as Santander, Barclays, and CitiBank are rushing
    to study and invest in blockchain technology – not just to use as a mechanism
    for digital currencies, but as a ledger, pure and simple. Using a decentralized,
    secure ledger could allow investors to secure ownership records in small companies
    that can change hands often and which have very specific rules about voting rights
    and shareholder agreements. The Nasdaq, the second-largest stock market exchange
    in the world, is partnering with blockchain startup Chain to build a blockchain
    to secure records for their private market platform, to allow registration and
    trading of non-publicly traded companies. And one US company, Overstock.com, recently
    received approval from'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'the US Securities and Exchange Commission to issue stock using a blockchain-based
    bond system called TØ.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_184_0.png)


    The blockchain could make banks as we know them a thing of the past.


    Another company, Factom, is working on a way to create a time-stamped blockchain
    ledger that can be used by any company. This blockchain wouldn’t be publicly accessible,
    rather only available for employees and branches within a company, and used for
    sharing records across the business. The Singapore Central Bank is also interested
    in this sort of blockchain, and began funding the development of their own blockchain-based
    record keeping system in 2015.


    Spanish bank Santander released a report in 2015 praising the ability of blockchains
    to handle contracts between different parties of a supply chain. Rather than interfacing
    between the different accounting systems of wholesalers and shipping'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'companies, a single blockchain could track materials and product shipments
    between any number of companies.


    Yet so far there is no consensus over exactly what the most useful blockchain
    technology application might be. At least two large consortiums of banks and businesses
    have been organized to promote blockchain technology in its most general form,
    hoping that the specific applications are worked out later. The Post-Trade Distributed
    Ledger (PTDL) Group counts HSBC, The London Stock Exchange, and Société Générale
    among its members. The other consortium, called R3, includes Goldman Sachs, JP
    Morgan, Deutsche Bank, the Royal Bank of Canada, and many more banks from around
    the world. Neither consortium has announced details of technologies they are developing,
    and are only in the most basic organizational stages.


    Meanwhile, software developers and technologists are not being left out. W3C,
    the main international standards organization for the internet, has been leading
    discussions on what role the blockchain might have in the technology underlying
    the internet. And the Linux Foundation is running the Hyperledger Project, with
    the goal of developing an open-source blockchain-based ledger capable of being
    adapted to all sorts of uses - an equivalent to Linux, its open-source operating
    system.


    # How to transfer money around the world


    Every bank that does business in a particular country must have an account with
    the country''s central bank. Using what is called a ‘real-time gross settlement’
    (RTGS) system run by a subsidiary of the central bank, banks may send each other
    funds back and forth, which are then credited and debited to their accounts at
    the central bank. In essence, banks all become customers at a larger bank,'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'and handle transactions for their customers by requesting transfers at the
    bank where they themselves are a ‘customer’.


    There are some RTGS systems that cross national borders, but eventually a situation
    happens in which a bank’s customer wants to transfer funds to a bank outside of
    the RTGS system. To complete these transfers, banks rely on a much more ad hoc
    system of ‘correspondent accounts’. One bank literally creates its own account
    with another bank, and vice versa. When customers want to transfer funds across
    the two banks, the two banks must communicate the amount, agree on an exchange
    rate, and then make the according changes to their own correspondent accounts.
    The two banks must trust each other to conduct these transactions – not a difficult
    task in the world of banking business when billions must be transferred back and
    forth each day – but it still requires a contractual system to be set up between
    every two banks that wish to conduct business this way. Occasionally, banks have
    to form a network, using another bank or two as an intermediary if the origin
    and destination banks do not already have correspondent accounts. And there is
    always the time factor. Although there is an international SWIFT messaging system
    to allow banks to communicate these transactions, often banks are not open at
    the same time due to different time zones, and lingering transactions can conflict
    with changing currency exchange rates. And at some point, banks must settle up
    their correspondent accounts, if they do not otherwise balance out between institutions.
    Many times this requires something as awkward or dangerous as'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'internationally shipping gold, cash, or other financial instruments.


    Most customers transferring small amounts internationally, such as foreign workers
    sending money to families back home, use a transfer service like Western Union
    or MoneyGram, that transfers money between its offices worldwide, and then balances
    its accounts on the back end, using international bank transfers. But these services
    often charge a fee of as much as 10 per cent or more to the customer.


    New blockchain technologies like Ripple could have the capacity to change the
    way money is sent around the world – not just for the large banks, but for everyday
    customers as well, utilizing new services working off a radical new financial
    technology backbone, called the blockchain.


    # A blockchain for anything


    In Dubai there is an innovative new building called the Museum of the Future.
    Its purpose is to show off new technologies that could radically change the way
    lives play out around the globe.Yet experimentation is also one of its most important
    roles.To this end, the museum has created the Global Blockchain Council (GBC),
    a consortium of companies working on blockchain technology, that is developing
    pilot projects to bring it into unexplored areas.


    Financial transactions are only the start. The GBC is also testing the blockchain
    to secure medical records, to provide a chain of custody information for diamonds
    to prevent profit from ''conflict diamonds'', for transferring property records
    and digital wills, and even as a way to offer tourists coupons and incentives.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'The Museum of the Future is not alone in such exploration. Companies and governments
    around the world have been announcing their own technology projects. For example,
    the UK government is running a six-month trial to use the blockchain to manage
    benefits payments. The payments are made in pounds sterling, but the transactions
    are logged in a digital ledger. The government of Estonia is collaborating with
    a company called Guardtime to build a blockchain of citizens’ health records,
    and with another company, Bitnation, to provide a blockchain-based digital notary
    service. Authorities in the Republic of Georgia are building a similar system
    with the company BitFury, a bitcoin mining business, to manage land titles. In
    Sweden, the government is also testing the possibility of a blockchain-based land
    registry in partnership with a company called ChromaWay.


    Other interesting collaborations might bear unexpected fruit. Bosch, the German-based
    engineering company, is working with the ASIC-makers 21 Inc. to explore the future
    for ASIC chips in Bosch’s distributed sensor arrays. The idea is to combine microelectromechanical
    sensors, connected via the internet, with small computers the size of credit cards
    capable of mining bitcoins and processing cryptocurrency transactions. By connecting
    these technologies together, it could be feasible to create a global network of
    sensors organized through a blockchain which can offer its data to anyone who
    needs it, and be paid for this service in cryptocurrency. A proof-of-concept is
    21 Inc.’s Ping21 service. Web hosts must measure the speed of internet traffic
    running through the network to check it is working. To do this they send out test
    messages, or pings. But rather than using dedicated computers around the world
    for this task, Ping21 allows any participating 21 Inc. computer to do the job
    and be paid for it.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Other companies are also attempting to see if they can harness the blockchain
    to help with real world services. Online letting agency Airbnb recently began
    experiments to use a blockchain as a way to manage user reputations. The company
    relies on reviews left by both renters and landlords so that customers can judge
    how trustworthy potential hosts or guests will be. Storing this information in
    a decentralized blockchain not only frees up Airbnb''s servers, but the data could
    potentially be rented out to other companies using similar business models.


    A blockchain could even help solve a problem for music artists and distributors.
    A startup called Ujo is trying to use the Ethereum blockchain to transform the
    music industry payment system. The aim is to allow musicians and distributors
    to share details of rights and royalties for music tracks online, all within smart
    contracts that automatically license recordings and which take payment each time
    they are played.


    Blockchain technology could also help make digital content more widely available,
    not just easier to control. ZeroNet is an attempt to create not just a decentralized
    DNS system, but an entirely decentralized internet. It aims to side-step the need
    to host websites on servers by stashing website information across the internet
    in small pieces, which can be linked together using a blockchain-like registry.
    This eliminates web hosting costs, and since it integrates a bitcoin payment system,
    users can send payments directly to websites, as the site address doubles as a
    bitcoin address.


    The Interplanetary File System (IPFS) is another attempt to create a distributed
    internet. Using a similar system to a blockchain, IPFS creates an address for
    every piece of content on the system – everything from images, to media files,
    to text. These addresses can be updated by the person who added them to'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'the system, updating content as necessary using cryptographic keys.The content
    itself is then stored across multiple computers rather than on a single server.
    While IPFS is not attempting to create the same integration with cryptocurrency
    as ZeroNet, it manages the content more efficiently by using its blockchain-like
    structure to only store the links to the content, not the content itself. This
    saves space and time.


    Of course, the vast majority of these ideas are in the proof-of-concept stage.And
    as failures and flaws continue to emerge in cryptocurrency and the blockchain,
    many of these ideas will sink from sight. Yet it could take just one of these
    schemes to succeed and we could all be using blockchain technology everyday.


    # Blockchain grid to let neighbours trade solar power


    Something odd is happening on President Street in Brooklyn. While solar panels
    on the roofs of terraced houses soak up sun, a pair of computers connected to
    the panels quietly crunch numbers. First, they count how many electrons are being
    generated. Then, they write that number to a blockchain. Welcome to the future
    of energy exchange.


    This project, run by a startup called Transactive Grid, is the first version of
    a new kind of energy market, operated by consumers, which will change the way
    we generate and consume electricity. Transactive Grid aims to enable people to
    buy and sell renewable energy to their neighbours. To deal in energy at the moment,
    you have to go through a central company like Duke Energy in the US or National
    Grid in the UK, or one of their resellers.


    Transactive can skip this central authority because its energy market is built
    on blockchain technology to create'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'a cryptographically secure list of transactions which is continuously updated
    as each transaction is completed. The list for President Street deals with buying
    and selling electrons generated by solar panels. No central authority is in control:
    the computers monitor each other to stop fraud.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_191_0.png)


    The technology behind bitcoin is enabling a new solar power network.


    The first devices were installed on President Street in February 2016. Other companies
    are hot on Transactive''s heels. Grid Singularity, based in Vienna, Austria, wants
    to bring the same decentralized energy market to developing countries, to help
    distribute solar power.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'MIT start-up SolarCoin pays people with an alternative digital currency for
    generating solar energy, one coin for 1 megawatt-hour of solar electricity.And
    in August 2016, a groups of neighbours in Busselton, Western Australia, began
    testing a system to trade excess energy from solar panels between themselves using
    a blockchain to record the transactions.


    Article by Aviva Rutkin for New Scientist magazine.'
  merge: -1
  img_proc: true
- pgno: 193
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # From bitcoin to autonomous corporations


    *Alternatives forms of the blockchain are springing up, and could revolutionize
    the way corporations work.*'
  merge: -1
  img_proc: true
- pgno: 195
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The proof-of-work blockchain used by bitcoin and other first-generation cryptocurrencies
    can be slow, and requires lots of computing power. Taking proof-of-stake as a
    starting point for potential alternatives, some blockchain developers have gone
    back to the drawing board to hunt for the easiest ways to achieve a consensus
    in which a majority of computers on a network agrees on the true state of the
    blockchain, in as little time as possible.


    One route has been to introduce different tiers to a cryptocurrency network. Rather
    than a single, network of computers, this uses "intermediate nodes" to create
    two separate, but linked, networks – one for general users, and one for trusted
    computers forming the backbone of the network.


    One of the first currencies to use this idea is Dash (originally launched as XCoin).
    It works by breaking the network up into two classes – the proof-of-work mining
    network, which anyone can join, and the ''masternode'' network. In order to become
    a masternode, a computer must invest or lock away 1000 units of the cryptocurrency.
    At this point the only thing that this computer will do is function as part of
    the verifying service for the currency. The miners create blocks by proof-of-work
    just as with bitcoin, but the masternodes are responsible for approving each block
    amongst themselves using a consensus procedure. Block rewards are split between
    the two networks.


    Many of the vulnerabilities of a standard proof-of-work cryptocurrency are avoided
    by using a second, verifying network operating outside the block creator network.
    For example, the 51% Attack, in which a miner producing 51% of the hash of a proof-of-work
    cryptocurrency could alter the blockchain (see ''Strength in numbers'', Chapter
    5), cannot occur, because the masternodes would not approve a new, falsified blockchain.
    Taking control of 51% of the hashrate would not allow an attacker to usurp the
    authority of the masternodes,'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'and taking control of 51% of the masternodes would require a nearly insurmountable
    amount of currency to be stockpiled to enable the attack.The intermediate node
    system also allows faster transaction confirmation, because masternode consensus
    occurs while blocks are being mined, rather than once the block is solved. By
    the time the block is solved, all the master-nodes have confirmed the transactions
    beyond any doubt.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_197_0.png)


    Proof-of-work calculations might not be needed for the blockchains of the future.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Working by consensus


    Dash’s consensus-based approach has triggered huge interest among those developing
    the next wave of blockchain systems. With it has come the realization that the
    fundamental role of a blockchain is to agree on something, and to reach this agreement
    as quickly as possible (see ‘Proof-of-work’, Chapter 4). Once someone has unlocked
    their wallet and created a transaction, the primary task of the blockchain is
    to record that transaction, and to do this as quickly as possible so the transaction
    cannot be reversed, and so new transactions can be added.


    A company called Ripple has developed perhaps the largest, most evolved sort of
    consensus blockchain yet. Its software, also named Ripple, is based on a new form
    of blockchain designed to handle inter-bank transfers across national borders,
    and even across different national currencies.


    By using a maths and computer science experiment known as the ‘Byzantine Generals
    problem’, the Ripple engineers believe they have shown that both proof-of-work
    and proof-of-stake are unnecessary (See box ‘How does Ripple work?’, below). Ripple’s
    blockchain ledger is designed not only to facilitate transfers of the blockchain’s
    own native currency, called XRP, but transactions in any currency. In a sense,
    the Ripple blockchain forms its own secure correspondent account system (see box
    ‘How to transfer money around the world’, Chapter 12), allowing any bank to create
    transactions between any other.


    After being set up with the hardware by Ripple, a bank becomes a node in the Ripple
    network. Rather than communicating using a conventional currency exchange system
    to debit or credit accounts, two banks can exchange transaction information in
    the ledger, using any currency they prefer. The changes are shown on the ledger
    in real time. And, if a currency'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'exchange is necessary, the network will automatically find the best price for
    the transaction using intermediary ''market makers'' holding reserves of multiple
    currencies and then update all accounts. XRP can even be used to facilitate the
    transaction, without the nodes at either end even knowing that a cryptocurrency
    is involved. These transactions are settled in about one minute, no matter where
    they are taking place.


    By relying on a system of consensus among trusted nodes, the Ripple network allows
    worldwide transactions between participating banks with almost no overhead costs
    other than the price of currency exchange. The company hopes that it will cut
    down on the fees associated with international money exchange. However, only banks
    and companies can be nodes in the Ripple network. Ordinary customers must open
    up an account with one of these banks, and that company uses Ripple to send the
    money to another bank for them. This allows the bank to continue to set the price
    for the transaction. In this way, Ripple hopes to put blockchain ledger technology
    in the mainstream by marketing to those who already control the system, rather
    than disrupting the money transfer industry. As of February 2017, Ripple''s XRP
    cryptocurrency is the third-largest cryptocurrency in total value, after bitcoin
    and Ethereum.


    # How does Ripple work?


    The Byzantine Generals problem imagines a number of generals, each with their
    own army, surrounding an enemy city. Each general is cut off from the others by
    hills that make it impossible for them to signal directly to each other. The strength
    of the enemy city is such that if all the generals attack at once they will defeat
    it, but if all generals but one attack, they will be repelled. The generals have
    to'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'plan the time of attack by exchanging messages. However, it is impossible to
    guarantee the authenticity of the messages coming in – one or more of the generals
    is secretly on the side of the city, and sends messages to deceive the rest. So,
    what do the generals do?


    It turns out that if less than 66 per cent of the generals are loyal, there is
    no way to coordinate a successful attack. However, if more than 66 per cent of
    the generals are loyal, then they can trust the majority of the messages they
    receive in order to coordinate their attack successfully. This result was proved
    by researchers at Microsoft in 1982. And it is exactly this fact that Ripple employs
    to secure its blockchain.


    The Ripple blockchain network is formed from a limited number of intermediary
    nodes. These verify all additions to the blockchain, and communicate with the
    wider user base, not unlike the masternodes of Dash. All intermediary nodes communicate
    with each other to share transaction information, submitted by general users.
    However, when it is time to write a new block to the chain, they refer to a ‘Unique
    Node List’ of specific nodes that they trust. Each of these intermediary nodes
    creates their own list, from other intermediary nodes that they specifically trust,
    and believe will not attempt to defraud the blockchain. Then, the nodes compare
    their transactions with their list. If the transaction is agreed on by 80 per
    cent of the list, then it is considered included in the block consensus, and joins
    the blockchain. If it does not meet that 80 per cent threshold, then the transaction
    is carried over to the next block.


    Ripple only allows particular users to join the group of intermediary nodes based
    on how trustworthy the network believes the users to be. As long as more than'
  merge: -1
  img_proc: true
- pgno: 201
  md: '66 per cent of its nodes are honest, the Byzantine Generals problem shows that
    security of the blockchain is assured. But Ripple goes a step further, by asking
    the nodes to poll only their trusted nodes. And just to be extra careful, Ripple
    requires an 80 per cent agreement level. If any transaction can’t reach consensus
    in this way, it is held over. In this way, the blockchain allows transactions
    with obvious consensus to proceed as quickly as possible, while flagging confusing
    transactions and making them wait for agreement.


    # Smart contracts


    Many of the recent innovations involving the blockchain focus on the concept of
    including additional information along with or instead of cryptocurrency transactions
    in the ledger. Ripple allows records of other currency transactions, Nxt allows
    additional text to enable the sorting of different groups or categories of cryptocurrency
    (called ‘colours’) which could allow different kinds of assets like property or
    commodities to be represented on the blockchain. Companies like Chain and Factom
    are figuring out how to log ownership and shareholder information in the blockchain.
    Software updates have even been proposed for bitcoin’s blockchain that would increase
    the size of the block to allow more transactions. These might bring additional
    text or cryptographic facilities to the blockchain that would deliver entirely
    new features.


    Some of the greatest excitement in the world of blockchain development involves
    putting not just transactions or data in the blockchain, but code itself. This
    would allow the blockchain to act as a decentralized program, in effect running
    software that could update and alter itself in response to changing conditions'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'in the market. This code could enable what are known as ‘smart contracts’ that
    function autonomously. However, researchers are discovering that this new realm
    of combined code and legalese is giving birth to serious complexities.


    Smart contracts were first suggested by virtual currency developer Nick Szabo
    in 1997. The idea is fairly straightforward: when buying a house, for example,
    the money and deeds are usually passed to a trusted third-party such as a lawyer
    or a bank. When the third-party is satisfied that both sides of the deal have
    fulfilled their contract requirements, they hand over the money and the deeds,
    accordingly. A smart contract could do this automatically, without requiring a
    third-party. Both deeds and money are given to the program in digital form, along
    with the terms of the agreement. When the smart contract observes that the terms
    are fulfilled, it delivers the digital payment and product directly. The blockchain
    secures the code of the contract in the decentralized mechanism of the ledger,
    in the same way that it secures the transactions of a cryptocurrency. The same
    blockchain might hold the deed, the payment, and the contract, simply updating
    its ledger to account for the new, swapped ownership.


    Such contracts don’t have to be large or complex. For example, something as simple
    as a parking meter could run code in a blockchain – when the parking payment is
    received, it registers the vehicle as legally parked. A smart contract could simply
    be a voting mechanism. Rather than receiving any money, the code could accept
    votes from registered shareholders and report the final tally. And there are also
    contracts in which the blockchain code doesn’t have to make any decisions whatsoever,
    but instead could behave like a digital storage locker. Money goes into the locker,
    and cannot be removed until both parties agree to open the locker, using their
    public-encryption'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'key. Some of these simple contract ideas could be deployed in future versions
    of bitcoin, like the proposed Lightning Network (see ‘The Lightning Network’,
    Chapter 11).


    # The age of Ethereum


    Now that smart contracts have captured the attention of blockchain developers,
    other possibilities are starting to emerge. Could blockchains manage shareholder
    voting mechanisms, for instance? Could they even control entire corporations?


    From a legal perspective, a corporation is no more than a series of rules defining
    leadership, ownership, and profit-sharing structures. Perhaps something like this
    really could be written into code, and then secured in the blockchain. This could
    be described as an ‘autonomous corporation’.


    In 2015, a Russian programmer called Vitalik Buterin launched Ethereum, a blockchain
    that allows smart contracts to be embedded within it. Using a custom programming
    language called Solidity, programmers can upload their code to the Ethereum blockchain,
    paying a small fee in Ether, the blockchain’s cryptocurrency. Once the code is
    implanted into a block, it receives an address. Anyone may then target the address
    using their computer, and run the code contained inside. The limits of what the
    code can do are up to the programmer. It might be a small program that responds
    with generic text, or a simple contract that only responds to specific people
    with authorization. In theory, it could also be an autonomous corporation programmed
    to buy something useful, rent it out, and then take payment – all within the distributed
    Ethereum blockchain.


    The potential of Ethereum has led to a renaissance in the idealism that gave birth
    to bitcoin, and autonomous corporations have become the new dream for libertarian
    proponents of'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'cryptography. If an entire business can be held in a distributed, decentralized
    blockchain beyond the jurisdiction of any nation, it offers an entirely new notion
    of‘free’.Who would collect taxes from an autonomous corporation? To which politicians
    would a blockchain-based business have to bow? Imperfections of governments could
    be side-stepped, replaced by code – simple, open-source and accessible to anyone
    with programming skills, yet ultimately secure and free from human weakness. Investors
    infected by this idealism leapt at the chance to support Ethereum, and Ether became
    the second-largest cryptocurrency after bitcoin.


    All kinds of proposals began to appear in the wake of Ethereum’s launch. For instance,
    a Swiss company named Slock.it came up with a plan to build a lock – the physical
    kind, that fits on a door – that could connect to the internet and the Ethereum
    blockchain. This would allow people to use the blockchain to rent property, for
    a short time such as a holiday period, and the lock would only open the door when
    the customer had paid the fee, and lock automatically again when the rental period
    was over.


    # Ripple versus Ethereum


    One way of looking at the future of the blockchain is as a contest between Ripple
    and Ethereum. Ethereum embodies much of the idealistic spirit of the early days
    of cryptocurrencies. It was this spirit that brought about the DAO (see below),
    and was also the means of its collapse. In the rush to make something new, mistakes
    are often made. Ripple, on the other hand, seems to embrace a more conventional
    approach. Rather than attempting to forge new ground, Ripple is appealing to those
    already in control of the financial networks. Rather than a revolution, it is
    offering a product. And indeed, Ripple has toned'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'down some of its early aspirations in order to better target a service it thinks
    that banks might buy.


    Which is the right way of doing things? Both are trying new ideas with completely
    new markets, and so far no clear winner has emerged.


    Yet this could provide a useful perspective by helping us categorize new financial
    technologies. Is a technology ‘with the system’ or ‘against it’, idealistic or
    realistic, revolutionary or incrementalist? It is out to prove new concepts, or
    just out to make a buck? These questions might help us understand the motivations
    of the developers and proponents of the technology. Judging the technology itself,
    however, will require different criteria, and eventual success is far harder to
    predict.


    # Autonomous corporations


    The Decentralized Autonomous Organization (DAO) was born when Christoph Jentzch,
    brother of Slock.it CEO Simon Jentzch, had an ambitious plan. He decided to try
    to create the sort of autonomous corporation that Ethereum creator Vitalik Buterin
    had first discussed. So he began writing code, and with support from Slock.it,
    published it to the Ethereum blockchain in early 2016.


    The idea behind the DAO seems relatively simple.The DAO would be a vehicle for
    crowdfunding. Potential funders would buy shares in the DAO, called DAO Tokens,
    using Ether, the native Ethereum cryptocurrency. These tokens granted voting rights
    in proportion to the number purchased. From these sales, the DAO accumulated cryptocurrency
    capital which it was then able to invest.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Next, people would submit suggestions for services to the DAO, attempting to
    win funding from the DAO''s stockpile of capital. They might suggest doing a task,
    for example, like editing code for the DAO, or building and selling some sort
    of Ethereum-based product, or even do charity work. Those offering services, called
    ''contractors'', would also suggest how much they should be paid for them, or
    whether they would give some profits from their scheme to the DAO. The Token holders
    in the DAO would then vote on the proposal. If it was approved, the contractor
    would do the work, and when the terms of their contract were fulfilled, the DAO
    would pay them. If any profit came back to the DAO, it would be shared between
    the Token holders.


    The DAO idea became wildly popular, raising over $150 million in Ether – the most
    successful crowd funding project in history. But soon, complications with the
    DAO''s programming began to emerge.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_206_0.png)


    The boardroom of the future?'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'It turned out that the DAO was susceptible to its own sort of 51% Attack (see
    ‘Proof-of-work, Chapter 4). If one person managed to get 51% of the DAO Tokens,
    they could automatically control any vote that took place. The attacker could
    submit a proposal that said, in essence, ‘give me all of the DAO’s money’, and
    then it would provide the majority vote to approve the plan.


    To prevent this a number of defence protocols were created. First, a role of ‘curator’
    was added. Held by a real person, the job was to personally approve every outbound
    payment. Second, it was decided that important votes (anything more than a straw
    poll) would be conducted in two parts. The first would be a vote on the question
    at hand, either to approve or deny the proposal. Then, the vote would come back
    to the Token holders again, giving them the choice to either accept the outcome
    of the first vote, or choose to split. If they accepted the outcome (whether they
    voted yes or no), they would remain in the DAO. If they chose to split, their
    Tokens and accompanying voting rights would be transferred to a ‘Child DAO’, exactly
    like the original DAO in every way, but separate. In other words, the split function
    gave the shareholders the opportunity to secede from the DAO if they ever disagreed
    with a vote.


    Almost immediately, complications emerged. First, among a number of different
    proposals put to the Token holders of the DAO in the first few weeks of its existence,
    not a single one was able to achieve a quorum. The quorum was determined algorithmically,
    but at a minimum it needed to be 20 per cent of the Token holders. Yet most proposals
    garnered just 10 per cent voting at most. Some blamed this on technical difficulties
    with voting. Others thought that many Token holders had bought them as an investment,
    and weren’t interested in the principles of the DAO or in participating in its
    management. Indeed, the price of the Tokens had skyrocketed as Tokens had been
    sold,'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'but few were taking part in the day-to-day discussions about

    the future of the DAO.


    But a second, more serious problem emerged. A number of

    programmers thought they had found a vulnerability in the

    DAO code, which allowed a Token holder to withdraw their

    own money and pull out of the DAO. It meant a user could trick

    the DAO by asking for withdrawals multiple times, during which

    the DAO would only check the user’s account balance once. This

    attack was not unlike the transaction malleability problem (see

    ‘What is the transaction malleability problem?’, Chapter 4) in

    that by exploiting the bug, an attacker could withdraw double the

    amount of money they actually had in their account. (Although

    from a code standpoint, the two problems were not at all alike.)

    By performing this recursive split attack many successive times,

    a criminal could easily drain the DAO of its cryptocurrency.


    A week after the vulnerability was announced, an attacker

    struck. Nearly $80 million worth of Ether, around a third of

    the DAO’s total holdings, was withdrawn. Those holding DAO

    Tokens, as well as the larger Ethereum community, panicked,

    and the value of Tokens and Ether crashed on cryptocurrency

    exchanges.


    # Saving the DAO


    An immediate and obvious solution was a hard fork of the

    Ethereum blockchain. Because the code for the DAO was

    within the blockchain, it could not just be rolled back to

    reverse the theft. The same blockchain that preserved the DAO

    also made the DAO difficult to alter or update. However, if the

    entirety of the blockchain was rolled back, all the money could

    be refunded to the original investors, and it would be as if the

    theft had never occurred.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'This solution was ethically troubling for many. A founding idea of Ethereum
    was that code defined existence in the blockchain. If the blockchain could be
    forked any time there was a mistake, what did that mean for the code’s supposed
    ‘immutability’? Even those who had lost money in the theft didn’t like the implications.
    Then, compounding the dispute, someone claiming to be the attacker published a
    blog post in which they criticized the founders of the DAO for their backpedalling.
    The DAO, the attacker claimed, was created to replace law with code, warts and
    all. The attacker hadn’t stolen anything, in their own view. They had merely found
    a legal loophole.’ They had merely played by the inimically broken rules of the
    ‘immutable, unstoppable, and irrefutable computer code’ as lionized by the DAO’s
    founders, and so they demanded their reward. If others suffered losses, that was
    only their own fault for not scrutinizing the code.


    Taunting aside, it turned out that the attacker hadn’t got clean away with the
    money. The nature of the recursive split attack meant that the attacker couldn’t
    just leave with the stolen funds, but had to ‘split out’ using the Child DAO functionality.
    And in using the split function, a waiting period of 27 days was triggered, per
    the original code (meant to give the person splitting into a Child DAO a grace
    period to consider their options).


    Programmers tracking the theft discovered the Child DAO into which the attacker
    had withdrawn the stolen funds; it was simply a forgotten split proposal that
    had been left open. The programmers, collectively calling themselves ‘Robin Hood’,
    then performed the same recursive split attack on the stolen funds, withdrawing
    them into yet another Child DAO, one step down the line. But again, they would
    be locked into a 27-day waiting period, during which time the original attacker
    could strike again.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'But this endless limbo did suggest another options: a soft fork. In this case,
    the vulnerability could be closed, and if everything was timed right, eventually
    all the funds that were in the hands of Robin Hood and other benevolent attackers
    could likely be returned to their original owners, although the process was complex
    and not sure to work. The benefit of this solution was that the Ethereum blockchain
    would not need to be permanently changed.


    But in the end, all the developers began to agree that the soft fork was a gamble.
    There might be other vulnerabilities in the process that were yet undiscovered.
    The hard fork was really the best option. It would also close the DAO permanently,
    and return all Ether to those who had originally purchased DAO Tokens.


    On 20 July 2016, the hard fork was rolled out. Users of the Ethereum blockchain
    could choose to run the new, forked version of the software, or carry on using
    the old version. The vast majority, over 85 per cent, chose the new fork. All
    the funds from the DAO, now funnelled into that fork, are being returned to their
    original owners.


    But a significant number of Ethereum users did not adopt the fork, and in essence
    split the Ethereum blockchain. As of August 2016, there are now two Ethereum blockchains,
    and two Ether cryptocurrencies. The one that adopted the fork is known as Ethereum
    One, and the blockchain that rejected the fork is called Ethereum Classic. The
    impact of two separate Ethereum blockchains on the DAO is not yet clear.


    # Lessons learned


    Since the DAO funds were stolen, there have been numerous editorials on lessons
    to be learned. Some say events prove that real-world laws and courts are necessary
    to adjudicate these'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'sorts of disputes. Others say that this episode actually proves the code works
    – after all, the hard fork did return Ether to all the DAO investors. Still others
    predict that legal authorities in Switzerland (where Ethereum, Slock.it, and the
    other founding companies are based) may still become involved. Meanwhile others
    blame it all on a failure with the Ethereum code itself, and suggest it needs
    to be changed.


    Blockchain technology is not simple, even though it is often explained as if it
    is. Many stories have been told about cryptocurrency stashes being lost because
    of the absolute secrecy of secret keys – once a secret key is lost, the wallet
    is locked forever. Failure after failure of exchanges, companies, and blockchains
    themselves show that there are still many mistakes to be made, and people capable
    of making them.


    But one of the critical failures of the DAO was to assume that it would really
    be just that simple. Even setting aside the recursive split vulnerability, it
    is difficult to believe that anyone thought an organization allowing rampant secession
    upon disagreement would work. Human beings are likely to disagree, to attempt
    to take advantage of each other, and to try and use power structures for their
    own ends. It seems that the recursive split vulnerability might have saved everyone
    a lot of trouble by stopping the DAO before it got started, and before it fractured
    itself into a thousand different Child DAOs that could not come to any sort of
    agreement with one another.


    To see just how poorly the DAO estimated human nature, one merely has to study
    the so-called ‘Stalker Attack’. The Stalker Attack was merely hypothetical, because
    the DAO did not exist long enough for an instance of this abuse to ever truly
    occur.


    The Stalker Attack was hypothesized as a situation in which a person attempts
    to split into a Child DAO, perhaps to withdraw their funds. Then, a ‘Stalker’
    jumps into the Child DAO'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'with them, bringing in enough Tokens to have a large majority over the person
    who initially attempted to split. In this new Child DAO, with only two people
    in it, the Stalker can control any vote. They can appoint themselves as Curator,
    and make sure that only they can receive any funds transferred out of the Child
    DAO. The only thing for the victim to do is to split again, into another Child
    DAO. Then, the Stalker follows them again, doing exactly the same thing. The victim
    is trapped forever, as this bully keeps controlling the vote and following the
    victim every time they try to split away.


    According to the developers of the DAO, the Stalker Attack was a ‘non-issue’ because
    there was no motivation for the attacker to do it. The Stalker’s funds would be
    locked up forever along with the victim’s funds, as long as they continued to
    antagonize the victim. What possible logical motivation would anyone have to waste
    their own money harassing someone else?


    To which, nearly anyone might answer – look at the world of politics! Look at
    frivolous lawsuits! Look at real-life stalkers, who spend all their time harassing
    someone else for no material gain! One can think of hundreds of situations in
    which someone with a lot of money and time would cause endless trouble for those
    with less money and time, either waiting for them to slip up, or otherwise give
    in to any number of demands so that the Stalker will let them withdraw their funds.


    But the developers of the DAO, while perhaps quite well educated in the mechanics
    of blockchains (giving their fatal programming error the benefit of the doubt)
    seemed to be terribly uneducated in the mechanics of human nature. And so, whether
    from vulnerability, or from the hazards of overly programmatic democracy, the
    DAO’s failure seemed inevitable.


    While some might argue that it is through this sort of failure that technology
    evolves, the truly odd thing here is that'
  merge: -1
  img_proc: true
- pgno: 213
  md: this was not an experiment using the risk-hedged money of venture capital. Real
    investors expect these sorts of gambles, and are equipped to take the failure
    in their stride. However, with experiments like the DAO, these failures are conducted
    using the money of individual supporters taken from the internet. In an attempt
    to escape the rules and power structure of corporate capital, experiments in alternative
    corporations like the DAO risk everyday people's hard-earned money, asking them
    to believe in an unproven future with little mitigation of the risks involved.
    Crowdfunding experiments are presented as democratizing, allowing all to participate
    equally. But when it comes to the blockchain, the bottom of the economic pyramid
    is being used to weather the storm of mistakes, missteps, and just plain old poor
    judgment, so that eventually, the large banks watching from the wings can learn
    from these errors. A future based on this sort of experimentation does not appear
    as democratic, so much as using the crowd to cushion the falls of the powerful.
  merge: -1
