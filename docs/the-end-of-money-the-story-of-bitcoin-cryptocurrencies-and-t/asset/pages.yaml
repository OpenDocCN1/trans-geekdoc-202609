- pgno: 226
  md: '# Glossary


    51% Attack In a proof-of-work cryptocurrency such as bitcoin, if an attacker can
    control 51% of the hashing power on the network, they are technically able to
    rewrite the blockchain with erroneous information. The difficulty of the proof-of-work
    is supposed to make achieving this 51% nearly impossible.


    ASIC Application Specific Integrated Circuits are devices made for doing only
    one specific computational task, and are used to bitcoin mining.


    Bitcoin The first cryptocurrency, introduced by Satoshi Nakamoto in 2008, and
    currently the largest cryptocurrency by value in the world.


    BitLicense A specific licence for cryptocurrency related businesses in New York
    State.


    Block Each interval of the blockchain is known as a block. They are solved by
    mining, and write new transactions into the blockchain.


    Blockchain The foundation of all current cryptocurrencies, the blockchain is a
    cryptographically secured ledger, updated to keep track of new transactions. Blockchains
    can also store other transaction data, not related to cryptocurrencies.


    BOINC Berkeley Open Infrastructure for Network Computing is a program that allows
    sharing resource-intensive computing tasks by breaking them into small pieces
    and distributing them amongst volunteers across the internet.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '**Brute-force** The only method for most users to try and defeat public-key
    encryption. It involves guessing at the answer to nearly insurmountable maths
    equations, until the right answer is reached. The brute-force method is the fundamental
    activity of proof-of-work cryptocurrency mining.


    **Byzantine Generals** A mathematics problem used to solve problems of fault tolerance
    in computer systems, and in cryptocurrencies, to create consensus protocols for
    non-proof-of-work cryptocurrencies.


    **CAPTCHA** Completely Automated Public Turing test to tell Computers and Humans
    Apart, is a puzzle, typically involving an image and text, embedded in a website
    to keep bots from flooding a site with spam traffic.


    **Child DAO** When a user decides to leave the DAO, they are placed in a small
    split-off DAO called a Child DAO.


    **Correspondent accounts** Accounts that banks set up with each other, to swap
    money back and forth.


    **CPU** Central Processing Unit, the core processor of a computer.


    **Cryptocurrency** A cryptocurrency is a virtual currency that uses cryptography
    to secure itself, typically within a distributed blockchain.


    **Cryptography** A method of using algorithms to encrypt messages between different
    parties. It also forms the basis of internet and computer security.


    **DAO** The Distributed, Autonomous Organization, an autonomous corporation set
    up via Ethereum in 2016, designed to serve as an investment structure. It failed'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'catastrophically in the same year, when a recursive split attack allowed an
    attacker to drain it of funds.


    **Dark web** A small, isolated version of the internet, set up within the Tor
    system. There, all servers and visitor requests to those servers are masked by
    encryption, and nearly impossible to identify.


    **Difficulty** To keep the block length about the same, the cryptocurrency scales
    up the proof-of-work task, depending on how many computers are producing guess
    hashes at once. This scaling metric is called the difficulty.


    **Digital currency** A digital currency is a currency that can be expressed in
    digital format.


    **Dogecoin** The ''joke cryptocurrency'', based on an online meme in 2013.Very
    easy to mine, it has a low value and is often used for games, charity, or online
    feedback systems.


    **Ethereum** A cryptocurrency network that allows programming to be executed through
    the blockchain, potentially enabling smart contracts and autonomous corporations.


    **Fork** Derived from when two different developers take the source code of a
    program into two different irreconcilable directions by making changes to it,
    it is also the term for odd situations when two different blockchains come into
    existence on the same network, and the computers of that network must decide between
    them.


    **FPGA** Field Programmable Gate Arrays are multi-purpose chips that can be custom
    programmed for specific, computation-intensive tasks.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'GPU Graphics Processing Unit, a processor designed to complete many small parallel
    tasks, such as rendering graphics.


    Hash Part of a cryptographic process in which a string of text is converted into
    a shorter, complex value. If even one character of the original text is changed,
    the hash is as well. They are used to sign messages cryptographically, and also
    form a fundamental part of the cryptocurrency mining process.


    Hashrate An expression of how much mining is happening on a proof-of-work cryptocurrency
    network, typically measured in hash per second.


    Intermediate nodes Cryptocurrencies that assign a hierarchy to different computers
    in the network. Above the base users are the intermediate nodes, which have greater
    authority to authorize transactions and construct the topology of the network.


    IP address The unique numbers that identify a particular computer, server, router,
    or other internet–capable device. They are used as an address system to route
    data around the internet.


    Jed McCaleb Software developer who launched Mt. Gox in 2010, before selling the
    site to Mark Karpeles.


    Lightning Network A suggested means of speeding up the bitcoin blockchain by allowing
    small, repeating transactions to occur off-blockchain between trusted partners.


    Litecoin The primary ‘altcoin’, often used as alternative to bitcoin. It was released
    in 2011, and uses a different hashing algorithm called ‘scrypt’.


    Malware Software specifically designed to do harm to systems for others’ gain,
    such as viruses, exploits, etc.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '**Mark Karpeles** Owner of Mt. Gox, after buying the site from Jed McCaleb
    in 2013. He was arrested in 2015 and faced charges related to the site’s demise.


    **Masternodes** In some intermediate-node cryptocurrencies like Dash, masternodes
    are computers in the network with a proven stake level. They function to approve
    transactions and construct the blocks, while other nodes do proof-of-work mining
    to solve the block.


    **Mining** The act of completing the proof-of-work, in which a computer produces
    hash guesses in order to solve a new block and add new transactions to the blockchain.
    Typically, computers solving blocks are rewarded by being transferred some quantity
    of cryptocurrency.


    **Mt. Gox** The first cryptocurrency exchange that allowed direct purchases of
    bitcoin and other cryptocurrencies using traditional currency. Founded by Jed
    McCaleb in 2010, the site was eventually sold to Mark Karpeles in 2013. The biggest
    exchange until its demise in 2014, the site was often targeted by hackers. The
    largest theft would be the exchange’s undoing, and also landed Karpeles in a Japanese
    Court on charges of embezzlement.


    **Point-of-sale terminal** The computers commonly used by merchants instead of
    cash registers, to ring up purchases and charge credit cards.


    **Pretty Good Privacy** Or PGP, one of the first software methods of public-key
    encryption, created by Phil Zimmerman in 1991 and uploaded to the internet, where
    users could download it for free.


    **Proof-of-stake** An alternative to proof-of-work, this method adds new blocks
    to the blockchain by assigning this privilege'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'to computers in the network that control a great deal of the cryptocurrency,
    judging them to be more trustworthy, as they have more stake in the system.


    **Proof-of-work** The mining activity necessary to produce new blocks in cryptocurrencies
    like bitcoin. It involves brute-force guessing of hashes, which can then be quickly
    verified by algorithm.


    **Public-key encryption** Also called asymmetric encryption, this method of cryptography
    employs public and private keys, so that two parties may exchange encrypted information
    without ever having to share a codebook.


    **Ransomware** Malware that encrypts the target''s computer, and then demands
    money, typically paid in bitcoins, to decrypt the files again.


    **Real-Time Gross Settlement Account** Also RTGS, a means for banks to move money
    between them by using a central bank.


    **Recursive split attack** A bug in the DAO that allowed an attacker to request
    multiple withdrawals at the same time, removing total currency in many multiples
    of what was held in their account balance.


    **Ripple** A cryptocurrency network designed to allow the international transfer
    of traditional currencies among banks, service providers, and foreign exchange
    market makers.


    **Router** A small computer, running a dedicated operating system designed to
    manage and direct internet traffic across a home, neighbourhood, or region.


    **Satoshi Nakamoto** The pseudonymous inventor of bitcoin. First known to the
    world in 2008 when he released a whitepaper describing his idea for the cryptocurrency,
    he'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'disappeared from the internet in 2011. Many people have attempted to determine
    his real identity.


    **Segregated Witness** A suggested fix to the bitcoin software that would decrease
    the amount of transaction information stored in the blockchain, speed up transaction
    confirmation, and potentially fix the transaction malleability problem.


    **Server** A computer on which the files of a website are stored. By responding
    to requests from users'' computers, the server sends these files across the internet,
    allowing the website to be viewed on the users'' computers.


    **Signature** When using a private key to create a cryptographic hash of a message,
    that hash is called a signature, because only the private key could have made
    that hash, and using a public key, the signature can be independently verified.


    **Silk Road** A dark web–based marketplace, specializing in illicit goods, namely
    illegal drugs. Run by the pseudonymous Dread Pirate Roberts, the website was shutdown
    in 2013 when Ross Ulbricht was arrested and charged with being the founding administrator.


    **Smart contracts** A contract written in programming code, that is able to execute
    itself given certain specified conditions.


    **SWIFT** Society for Worldwide Interbank Financial Telecommunication, the system
    that banks use to communicate correspondence account transfers.


    **Tor** Also The Onion Router, a piece of software that allows users to use the
    internet while obscuring what sites they visit, and their origin point from those
    sites. It is also used to create the dark web, which is a sort of smaller internet
    where server locations and site visitors cannot be identified.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '**Transactions** Bitcoin transfers are written as transactions on the blockchain,
    and are submitted for inclusion in newly solved blocks.


    **Transaction malleability problem** A flaw in bitcoin''s software, that enables
    an improperly formatted transaction to be accepted by the blockchain, then responding
    with an unexpected transaction ID. If the software is not aware of this unexpected
    transaction ID, it will often attempt to process the transaction again, resulting
    in duplicate transactions.


    **Wallet** The private key of a cryptocurrency account. The wallet signs all transactions
    submitted to the blockchain, and links all the public addresses together.


    **Virtual currency** A virtual currency is a currency that''s existence is entirely
    digital.


    **Vitalik Buterin** The creator of Ethereum.'
  merge: -1
  img_proc: true
