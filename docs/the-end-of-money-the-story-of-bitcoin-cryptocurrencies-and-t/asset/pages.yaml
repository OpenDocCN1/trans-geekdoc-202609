  md: '![](img/1aafdaf3d396c22bbcefa1ff58c79405_118_0.png)


    Will signs like this ever be commonplace?


    It has also yet to be proved if using bitcoin for remittances is actually any
    cheaper. In a 2016 report by Citibank reviewed ten common remittance pathways
    between various countries and found that bitcoin was only cheaper than standard
    remittance options in one of them – between the US and New Zealand.


    # Where can you spend cryptocurrency?


    The Holy Grail for cryptocurrency enthusiasts has always been the ability to use
    it in day-to-day transactions as easily as using credit cards or cash. Adoption
    of cryptocurrency transaction processing by merchants has been slow and sporadic,
    normally limited to niche industries or online services, or the occasional company
    owned and run by cryptocurrency enthusiasts. However, this area has perhaps seen
    the most recent growth, and the companies working on cryptocurrency transaction
    services are'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'some of the most successful in the cryptocurrency field. They claim that they
    offer tens of thousands of merchants the ability to accept cryptocurrency for
    purchases.


    BitPay was one of the first companies to offer transaction services for merchants,
    working with online companies as early as 2011. They helped many of the early
    adopting companies to accept bitcoin, like Wordpress, Microsoft, and Newegg. After
    receiving significant investments from Paypal, they expanded their services, working
