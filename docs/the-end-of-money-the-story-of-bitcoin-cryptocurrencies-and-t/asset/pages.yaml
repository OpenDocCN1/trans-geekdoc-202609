  img_proc: true
- pgno: 84
  md: 'The news stories sound like the plot points of a conspiracy thriller. Murder
    for hire. Drug trafficking. Embezzlement. Fraud. Money laundering. Corruption.
    Market manipulation. The environment at risk. Governments on track to be overthrown.
    ‘Bitcoin is evil’, says a Nobel Prize-winning economist in the pages of the New
    York Times. ‘Malware turns hacked computers into slaves that ‘mine’ new digital
    currency’, reports tech publication Quartz. One of CNN’s many headlines on bitcoin
    read, ‘Bitconned: SEC busts alleged bitcoin Ponzi scheme’. Forbes magazine reported,
    ‘FBI says it’s seized $28.5 million in bitcoins’.


    # Silk Road


    By far the largest flirtation between bitcoin and criminality was Silk Road. In
    this story, we see the ideal of an anonymous, non-governmental currency pushed
    to its breaking point. We see how a seemingly normal second-hand book salesman
    picked up a life sentence in federal prison. He became the centre of a huge FBI
    dragnet; the target of a massive operation spanning numerous US federal law enforcement
    agencies. None of this would ever have happened without bitcoin.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "# Timeline: The path of Silk Road\n\n+   • January 2011 Ross Ulbricht develops\
    \ Silk Road, a market-place for illicit substances, and begins quietly advertising\
    \ it on bitcoin and drug forums. Bitcoin is trading around 30 cents.\n+   \n+\
    \   • June 2011 Gawker publishes a story about Silk Road. Price of bitcoin hits\
    \ new high of $30.\n+   \n+   • August 2011 Silk Road generates $30,000 worth\
    \ of commissions in one month.\n+   \n+   • December 2011 FBI and other law enforcement\
    \ agencies purchase more than 100 shipments of drugs from the site, gathering\
    \ information and making arrests.\n+   \n+   • March 2012 Silk Road generates\
    \ $90,000 worth of commissions in one month.\n+   \n+   • November 2012 Silk Road\
    \ begins paying protection money to hackers who threatened to shut down the site\
    \ with a distributed denial-of-service (DDoS) attack.\n+   \n+   • January 2013\
    \ After site administrator Curtis Green is arrested in a sting operation, Ross\
    \ Ulbricht allegedly attempts to have him killed, unaware that he is hiring an\
    \ undercover DEA agent to do so.\n+   \n+   • July 2013 Ulbricht’s own personal\
    \ account receives nearly $20,000 per day in Silk Road commissions. Law enforcement\
    \ learns this as they close in on Silk Road servers in Iceland.\n+   \n+   • October\
    \ 2013 After connecting an email account owned by Ulbricht to internet posts involving\
    \ Silk Road, agents arrest him at a San Francisco public library. They seize his\
    \ computer, which is logged in to Silk Road administrator accounts.\n+   \n+ \
    \  • May 2015 After a trial in which he claims he was framed, Ulbricht is convicted\
    \ and sentenced to life in prison."
  merge: -1
  img_proc: true
- pgno: 86
  md: '# The beginning of dealing drugs digitally


    In January 2011, a post appeared on a ‘magic mushroom’ website called shroomery.org.
    Written by a user named ‘altoid’, it posted a link to a site called Silk Road
    and asked if anyone had any experience using it. Days later, a user by the same
    name posted on bitcointalk.org, with a similar message.


    Two years later, in 2013, FBI agents would discover that these two posts were
    the earliest references to Silk Road on the internet – meaning they were likely
    to have been written by the site’s creator. At this point, the FBI didn’t have
    a name for the Silk Road’s founder, but the posts would end up being some of the
    first footprints that investigators found leading to Ross Ulbricht.


    Despite the many steps that Ulbricht had taken to keep his identity secret, extraordinary
    government resources were put into exposing him. He wanted to be an anonymous,
    online, libertarian hero, and often used the alias ‘Dread Pirate Roberts’ (DPR),
    in homage to the character in The Princess Bride, to keep his name away from Silk
    Road. But in the end, a series of simple missteps lead to his unmasking and arrest.


    A strong tool in DPR’s arsenal was the web-traffic anonymizing software Tor, which
    is used by hackers and spies alike to hide their traffic online. By operating
    Silk Road as a ‘hidden service’ on the dark web, there was no way that investigators
    could find the servers hosting the site and shut them down. By using Tor connections
    for email, chat, and all connections to the administration tasks of Silk Road,
    DPR and its administrators would remain faceless, nameless, and location-less
    – as they believed the internet was meant to be. And bitcoin was the cryptocurrency
    that provided the motivation for their efforts.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Bitcoin wasn’t perfectly anonymous, but it could not be shut down by the government,
    and user accounts could not be closed, unlike credit cards or online merchant
    services like Paypal. Tor enabled Silk Road to set up its market, and bitcoin
    allowed for the payment of the goods. It seemed like the whole enterprise was
    risk free.


    # Was Silk Road ever really anonymous?


    The Silk Road marketplace was supposed to be completely anonymous. But while Tor
    worked well to disguise the source and destination of internet traffic, bitcoin
    transactions could be traced through the blockchain, meaning they were never entirely
    secret.


    The site’s technology was not perfect, either. Ulbricht caught a number of early
    security flaws in the site with the help of volunteers. The fact that people had
    come forward after spotting the vulnerabilities reinforced Ulbricht’s belief that
    the site could survive with self-policing. In his idealistic view, he thought
    that the site’s users and the technology were more powerful than the forces out
    to get them, and that they would protect each other. But it was one of these security
    flaws, introduced through a coding error that allowed police to discover the location
    of the servers in 2013 and gather the evidence that would lead to Ulbricht’s conviction.


    Except, of course, for the problem that drugs are physical things and had to be
    delivered in person. This meant that Silk Road sellers had to use the mail and
    ended up giving the authorities the first real tip-off that there was a new game
    in'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'town.After an increase in detected drug shipments was noticed, it was only
    a matter of time between somebody got caught.


    Among the many sting operations conducted to intercept mail shipments, the DEA
    netted one of the secondary administrators of Silk Road in 2013, a user going
    by the name chronicpain. DEA agents used his administrative accounts to seize
    $350,000 worth of bitcoins.


    When DPR saw that the funds were gone and read in the news that chronicpain (real
    name Curtis Green) had been arrested, he took a big step towards becoming a real
    drugs kingpin – he allegedly decided to have Green killed. His assassin would
    be an acquaintance that he had met through Silk Road. ‘Nob’ claimed to work with
    drugs cartels, and often bragged about his violent exploits, so it seemed that
    he would be an excellent choice. However, Nob was actually a DEA agent called
    Carl Force IV – the same agent who had just arrested Green. Force staged the execution
    of Green, engineering what appeared to DPR to be the end of the matter.


    # Was there an ideology behind Silk Road?


    Ross Ulbricht began Silk Road not only for the money but also for the idea. His
    dream was a digital marketplace, hidden by encryption, in which anyone could conduct
    any business transaction that they liked, free from the prying eyes of government.


    This is an ideal shared by many early proponents of cryptocurrencies, including
    Satoshi Nakamoto who focused on the currency''s ability to function without a
    banking institution involved, and therefore, as an alternative to traditional
    ‘fiat’ currencies such as dollars and euros.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'In Nakamoto''s internet forum posts, he invoked the unfolding bank crisis as
    a partial justification for the cryptocurrency. Without any central bank, without
    any corporate entities, the only thing that bitcoin required anyone to trust is
    the code that constituted it, open-source and available for review. Other cypherpunks
    were interested in the notion of privacy. Without needing any ID or licence to
    hold or trade cryptocurrency, they felt that they could conduct transactions without
    anyone prying into their business. And naturally, it wasn''t just their neighbours
    they were concerned about, but governments and tax authorities.


    # CAPTCHA leads to capture


    In June 2013, a separate FBI investigation team uncovered a piece of information
    from the Silk Road site that ought to have been hidden. One of the tools used
    to keep bots from flooding Silk Road with faulty logins, called CAPTCHA, had leaked
    the IP address of where the Silk Road servers were located: Iceland. DPR and his
    associates were nowhere nearby. Connecting only through the encrypted layers of
    Tor, the users, the administrators, and the servers were all isolated from each
    other across the internet. But after the CAPTCHA leak the FBI had found the servers''
    location. Armed with diplomatic letters, they went to Iceland to get a copy of
    the server. This provided them with a key source of evidence that would be used
    to find and eventually convict DPR.


    After investigating the server, the FBI found that a series of connections had
    been made without using Tor, but instead using VPN services. These Virtual Private
    Networks (VPN) also allow people to mask their internet traffic, but only by relaying
    it through another computer. By tracing back the logins,'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'investigators were able to see that many of the connections had come from locations
    in the San Francisco area.


    Meanwhile, an IRS agent working with the team found a post on a programming website
    asking for help setting up Tor hidden services, using the same username ''altoid''
    from the posts on shroomery.org and bitcointalk.org in 2011. An email address,
    ''rossulbricht@gmail.com'', was connected to that username. For the FBI, the pieces
    were starting to fall into place and a picture began to emerge.


    After finding a number of other synchronicities, including a Homeland Security
    report about fake IDs being shipped to Ulbricht''s house, the FBI began surveillance.
    They watched as Ulbricht logged on to his computer, and DPR suddenly appeared
    on Silk Road. This happened time after time. Soon, they had enough evidence for
    a warrant and in a surprise sting, they cornered Ulbricht in a San Francisco public
    library, managing to seize his computer intact as he was logged in to the administrator
    accounts of Silk Road.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_90_0.png)


    Not everyone was happy to see Ross Ulbricht, the Silk Road creator, on trial.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'In May 2015, Ulbricht was sentenced to life in prison without parole. It seems
    the jury was persuaded by the overwhelming evidence seized by the FBI, complete
    with chat logs that served as a day-by-day history of his orchestration of the
    massive scheme. However, murder-for-hire was dropped from the indictment. It seems
    that the supposed murder of Curtis Green, as well as a number of murders which
    Ulbricht thought he was paying for, never happened. Some were schemes orchestrated
    by police; others were scams to deprive DPR of bitcoin. Astonishingly, Carl Force
    IV, the DEA agent who set up the sting and simulated murder of Curtis Green, was
    himself arrested for pocketing bitcoin seized from Silk Road, as well as abusing
    legal authority in several other ways to hide his theft of the money. A Secret
    Service agent was also prosecuted along with him and they are both now serving
    time in prison. Ross Ulbricht''s attorney is planning an appeal based on the episode.
    (There is also an indictment in the US District Court of Maryland, which includes
    murder-for-hire charges, that is still pending.) It seems that the size of the
    fortune contained within Silk Road corrupted the authorities, as much as the perpetrator.


    # Life after Silk Road


    Silk Road was finished, but lingering questions and loose ends still remain. In
    late 2015, another of the original Silk Road administrators going by the name
    Variety Jones was arrested in Thailand.This came three months after he had posted
    a bizarre story on an online forum alleging that he was being hunted and threatened
    by a corrupt FBI agent, who wanted his help to access $70 million in bitcoins
    not yet seized by authorities, perhaps by torturing Ross Ulbricht''s family. This
    story might sound absurd, except for the fact that two federal agents'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'had already been prosecuted for stealing illicit cryptocurrency from Silk Road.
    No outside confirmation of Jones'' story has yet appeared.


    Meanwhile, although the criminal complaint against Ulbricht listed the information
    gleaned from the CAPTCHA leak and the ''altiod'' online postings as the evidence
    that led the FBI to identify DPR, it has since become apparent that the Tor network
    was compromised at least once. In 2014, researchers from Carnegie Mellon University,
    along with the Department of Defense, were able to compromise enough Tor nodes
    to expose the IP address of a Brian Farrell. This information was then used by
    the FBI to prosecute Farrell for his involvement in running one of the Silk Road''s
    successor websites.Although the Tor Project has now claimed to have fixed this
    particular vulnerability, there have been speculations that perhaps this exploit
    was also used in the investigation of the original Silk Road.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_92_0.png)


    Silk Road and many copycat sites were shut down by the US authorities.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Selling drugs online using bitcoin, while not a foolproof scheme, still seems
    to be too great a money maker for others not to try their hand. Several Silk Road
    copycats have sprung up in its wake. Some have been shut down by authorities,
    others were apparently scams, and yet others persist to this day, selling drugs
    and other illegal services online, so far dodging the police that hunt them through
    the dark webs of the internet.


    # Where next?


    Throughout the brief history of cryptocurrencies and blockchain technologies,
    the media has been captivated with the fact that these tools were invented in
    the dark hacker realms of the internet. But, cryptocurrencies aren''t, themselves,
    illegal. In fact, the amount of crime conducted via cryptocurrencies pales in
    comparison to the amount of crime occurring in the markets of regular, old-fashioned
    currency.


    In between the headlines lies the true story. The idealistic dream of evolving
    money and business transactions to ensure a new level of technologically-secured
    personal privacy had been realized, but soon met the harsh realities of greed
    and governance as the value of cryptocurrencies grew to billions of dollars and
    inherited some of the issues of traditional currencies. Programmers and government
    regulators are still trying to unravel the technical and legal complications around
    cryptocurrencies today. But within all of those complications was the kernel of
    a new idea. And that new idea, no matter how complex, political, dangerous, or
    flawed, is not going away. Through this trial by fire, cryptocurrency emerged,
    perhaps even stronger than ever, with new investors ready to play by the rules
    (see ''Bitcoin by post'' and ''Bitcoin accountants'', Chapter 8).'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# # The legend of Dread Pirate Roberts


    So brazen were the attempts of Ross Ulbricht (aka Dread Pirate Roberts) to thwart
    the law, that they can make him seem like an most legendary character. Some regarded
    him as a modern-day Robin Hood. In his many written missives on Silk Road, DPR
    certainly promoted this legend among his fans and supporters. This put him in
    contrast to the anonymous creator of bitcoin, who vanished rather than become
    a caricature of mystique that might damage his creation.


    The users of Silk Road bought into the mystique. Users compared DPR to Che Guevara,
    praised him for creating jobs, and even joined the Silk Road book club, to discuss
    books on politics, economics, law, and other topics. All with a libertarian bent,
    of course.


    Silk Road acted like a floating pirate ship on the high seas of the internet.
    The administrators of Silk Road were the only arbiters of what was allowed for
    sale. Silk Road policy was clear – only ''victimless'' items could be traded.
    This meant the site centred primarily on drugs and forged IDs. Illegal pornography,
    weapons, or stolen goods were forbidden. To ensure everyone got the standard of
    product that they were hoping for, users themselves rated their transactions in
    a ''trust'' system, not unlike eBay or other commerce sites. The system was intended
    to identify scammers, and prevent undercover police from posing as sellers or
    customers.


    But the vetting process for customers and sellers wasn''t as effective as hoped.
    By November of 2011, police had made over 100 undercover purchases from Silk Road,
    leading to a number of arrests. This netted them at least'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'two Silk Road administrators who turned over their accounts to the police,
    which were then used by officers to fully infiltrate the site.


    With the benefit of hindsight, it seems that Ross Ulbricht was not quite as swashbuckling
    as he was idealistic and naive. Ulbricht was no hardened criminal, at least at
    the outset. His initial crime was to grow a small crop of magic mushrooms and
    figure out a way to sell them online. But this ultimately led to his downfall.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# # The school of hard Gox


    *With millions of dollars worth of commissions every month, the cryptocurrency
    exchange Mt. Gox was surely too big to fail. Or was it?*'
  merge: -1
  img_proc: true
- pgno: 97
  md: <!-- no content -->
  merge: -1
