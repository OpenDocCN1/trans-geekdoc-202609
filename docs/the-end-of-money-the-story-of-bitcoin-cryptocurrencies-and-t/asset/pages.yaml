- pgno: 34
  md: '# # 3 How to create a currency, the crypto way


    An unlikely mix of hackers and spies developed the technology that allowed bitcoin
    to exist. They created secret communication channels and dark shadow networks
    on an otherwise easily trackable internet.'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Bitcoin, the first cryptocurrency, did not just spontaneously appear. Many
    of the technologies it is built on are at least as old as the internet itself.
    The roots of cryptocurrency''s underlying blockchain technology go deep into a
    community of hackers, activists and technologists who still influence the development
    and direction of cryptocurrencies, and the internet at large, today.


    An essential tool within bitcoin is digital cryptography. This crucial component
    of the internet is present in everything from WiFi to email, digital shopping
    carts to credit cards. Without cryptography to keep information private online,
    there would be no internet as we know it. And without cryptography, crypto-currencies
    could not function.


    Digital cryptographic tools have long been the province of characters on the fringes
    of society: hackers and spies. At first glance these two groups might not seem
    to have much in com-mon, but both share a need for absolute privacy.


    Between the two poles of hackers and spies lies the dark web – the part of the
    internet hidden from prying eyes by encryption. The dark web pushes the boundary
    of what is possible, as well as what is legal. It is here that the idea of cryptocurrency
    was born. Indeed, it could not have been born anywhere else.


    # The birth of cypherpunk


    In 1970s a US counter-cultural group called the Yippies, led by activist Abbie
    Hoffman, began publishing a newsletter that taught, among other tricks, how to
    steal service from telephone service providers. What began as an anti-authority
    gesture evolved into something more. Self-described ‘hackers’ began experimenting
    to see just how far they could break into tech-nological systems without getting
    caught.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'But once the technology evolved and phone lines became data lines, this exploration
    became more serious. Actions once considered pranks or victimless theft soon became
    real disruptions. In 1988, a computer worm that would come to be called the Morris
    Worm began replicating itself across computers via the internet. The self-replicating
    malware’s intent wasn’t to break anything, but simply to spread as far as it could.
    But in the process of doing so, it crashed many systems. The US authorities did
    not find this experiment amusing. Robert Morris, a graduate student and creator
    of the Morris Worm, became the first person convicted under the Computer Fraud
    and Abuse Act for intentionally accessing federal computers (where his worm eventually
    ended up) without authorization, and for causing significant damage.


    As the internet developed and computers became increasingly networked, hackers
    came up against more legal obstacles. In the 1990s, governments around the world
    began to take action, attempting to tame the lawless internet. In response, sections
    of the computer community took counteraction. Some were motivated by libertarian
    and anarchist philosophies, united by their general distrust of government. Others,
    seeing how law enforcement agencies could persecute those who didn’t mean any
    real harm, began organizing to defend radical hackers and everyday computer users
    alike. In 1990, the Electronic Frontier Foundation was created in response to
    the ongoing computer crime crackdown. This non-profit organization still exists
    today, providing legal counsel and activism on a wide variety of pro-privacy issues.
    But computer users needed more than lawyers to defend themselves against the government’s
    move into the internet. They needed new technology.


    The early 1990s gave birth to the ‘cypherpunk’ – a type of hacker whose bread
    and butter was digital cryptography.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The cypherpunks didn''t focus on breaking into computer systems. Rather, they
    developed tools that created a shroud of electronic privacy on the internet.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_38_0.png)


    The digital privacy tools created by ''cypherpunks'' helped give rise to cryptocurrencies.


    The most important tool evolved from a discovery by scientists Whitfield Diffie
    and Martin Hellman in 1976. They figured out a method of asymmetric encryption
    (see ''Public-key encryption'', Chapter 4) that allowed two people to communicate
    secretly, without ever having to exchange a code book. In 1991, adapting this
    technique to the internet age, software engineer and anti-nuclear activist Phil
    Zimmermann developed a program called Pretty Good Privacy (PGP) and uploaded the
    source code to the internet where anyone could download it and send encrypted
    messages for free. The cypherpunks were ecstatic. The software worked so well
    for keeping communications secret that the US government attempted to prosecute
    Zimmermann for ''exporting a munition'': a violation'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'of laws attempting to keep technology with high military value

    from leaving the country.


    One year later, in September 1992, an online mailing list

    was launched under the name Cypherpunk. The conversation

    attracted all sorts of people interested in using technology to main-

    tain their privacy, and included such tools as PGP, remailing

    services that obscured an email sender’s true address, and hypo-

    thetical ideas such as ‘untraceable’ digital money.


    At that time, with the government after Zimmerman, it was

    not clear that encryption would be legal in the long run. The

    Cypherpunk list, therefore, attracted people not only inter-

    ested in privacy but also those willing to stray into the grey

    areas of the law in order to protect their privacy. The cypher-

    punks thought it likely that if they did not push the techno-

    logical envelope, the new internet would be used entirely for

    surveillance, and personal privacy might be lost forever. They

    began to consider their actions, like those of Zimmerman, to

    be civil disobedience – releasing information to the public

    for the public’s good, regardless of what the government said

    was legal.


    Virtual currency proponents were on the Cypherpunk list

    from the very beginning. Hal Finney, who worked on PGP

    with Phil Zimmerman, was on the list and would later be one of

    the first to help Satoshi Nakamoto improve the bitcoin source

    code. Another person on the list was Adam Back, who used

    cryptography to develop a spam reduction tool called ‘hash-

    cash’, which he shared with the Cypherpunk email list in 1997.

    Also on the list were cryptographer Nick Szabo who experi-

    mented with a virtual currency of his own, called Bit Gold, and

    Craig Wright, an Australian involved in various security tech-

    nologies, including those securing financial transactions. All of

    these names would be important in the future of bitcoin and

    cryptocurrencies.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'In 2008, Satoshi Nakamoto publicly announced his idea for a cryptocurrency
    he called ''bitcoin'' on a successor mailing list to Cypherpunk''s original email
    list. Although many were initially sceptical about bitcoin''s efficacy, Nakamoto
    had found the ideal audience to appreciate his concept.


    But cypherpunks are only half the history of the dark web. The other half comes
    from a tool developed by the US authorities to protect their spies.


    # Spies who logged on in the dark


    In 1995, the concept of ''onion routing'' was invented by Paul Syverson, Michael
    Reed and David Goldschlag who worked at the US Office of Naval Research. They
    were funded by the Defense Advanced Research Projects Agency (DARPA), which developed
    new technologies for the military. Their goal wasn''t to avoid government surveillance
    – on the contrary, they were trying to enable it.


    The internet works via a connected group of dedicated computers called ''routers''.
    When computer A wants to communicate with computer B, it sends a packet of information
    from one internet protocol (IP) address to another. All the routers process this
    address and make sure that the packet of information travels across this web of
    wires to its desired destination.


    The problem is that any computer along the way can see the addresses of both computer
    A and computer B by looking at the data packet. It''s like looking at a letter
    in someone''s mailbox. You might not be able to read the message inside the envelope
    (especially if that message is encrypted), but you can still read the destination
    and return addresses on the envelope, which must be written in clear text for
    the mail carrier to deliver it.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'In this state of affairs, if a US spy is undercover they can''t communicate
    with a computer back at Naval Intelligence headquarters without giving themselves
    away. The same conundrum applies to the officer sitting at a desk at Naval Intelligence
    headquarters who is trying to investigate a terrorist message board. Going ''undercover''
    on the internet is nearly impossible if your adversary knows how to look for the
    data packets'' addresses. All the packets eventually trace back to their source.


    The onion routing concept solved this problem in the form of software called ''Tor''.
    Tor creates an anonymous network by covering up the packets'' addresses with a
    series of encrypted ''layers'', like an onion skin. Between computer A and B,
    internet traffic is routed around a series of encrypted connections, each forming
    another layer. Before the data packet is inside the Tor network, it is impossible
    to tell its ultimate destination. When it comes out the other side, it is impossible
    to tell where it came from. Onion routing doesn''t encrypt the traffic itself,
    but obscures its origin and destination and makes it, for all intents and purposes,
    untraceable.


    # Is cryptography only for people with something to hide?


    Encryption isn''t just for cypherpunks and spies anymore. Every digital service
    we use employs encryption to scramble the information to give us some privacy
    online. It protects our medical records, bank data and messages that we send over
    the internet.


    Given how many of our conversations and information channels use digital systems,
    the likelihood that someone might be trying to eavesdrop on us is growing. That
    is why every digital service uses encryption to help protect'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'us, to give us that privacy we have come to expect. But not all standard encryption
    is equal. Some of it is easily broken. Some of it has holes. That is why many
    people are now taking the technology into their own hands, learning to use cryptographic
    technologies such as Tor, and public-key encryption.


    This works well for spies but it is also great for activists who don''t want to
    be spied on by their governments. Ironically, the government dropped the project
    development in 2004 and made it open source. It was quickly supported by the Electronic
    Frontier Foundation, which helped the independent, non-profit Tor Project (that
    still develops the software today) get started. Today, many people use Tor software
    to hide their internet traffic from prying eyes of all kinds.


    It might seems odd that spies and hackers use the same tool. Many conspiracy theorists
    believe, therefore, that Tor might be a trick propagated by the US government.
    But what they fail to understand is that spies and hackers have the same goal
    – to mask their activities online within a dark web.


    Tor also allows what are called ‘hidden services’. When a website server is connected
    to Tor, only computers that are connected to Tor are allowed to load the website.
    Rather than using Tor to connect to the regular internet, this is a separate ‘mini-internet’
    that is only visible inside the onion-routing-network. This means that everything
    which happens on that hidden service site, when configured correctly, is anonymous.
    No one can tell where the server or the site’s viewers are located. A site like
    this is referred to as being part of the ‘dark web’.


    In the dark web, a person could just as easily be a cop as a Cypherpunk anarchist.That’s
    both the problem and the benefit'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'of anonymity – you can''t tell who anyone really is. And it was in this cypherpunk-descended
    anonymity that cryptocurrencies were born and raised.


    # What did the random shopper bot buy on the dark web?


    Carmen Weisskopf is part of !Mediengruppe Bitnik, a group of artists who work
    on and with the internet. She gave a software bot some bitcoins and sent it shopping
    in the dark side of the internet – where it bought things that no bot has bought
    before.


    # Tell me about your art project to use a bot to randomly shop on the dark net.


    The Random Darknet Shopper is a bot programmed to shop in the deep web or dark
    net once a week, with a maximum budget of $100 in bitcoins.


    # What exactly are the deep web and dark net?


    The deep web is part of the internet comprised of all the web pages that aren’t
    indexed by search engines, such as intranets. It’s actually larger than the ‘surface
    web’ that most people are used to. Part of the deep web is encrypted and accessed
    through TOR browsers to hide where you come from. This is called the dark net.


    # What has your bot bought from the dark net?


    Most items there have dubious legal status. In 2014 when we tried it we got a
    set of master keys used by firefighters, cigarettes, fake jeans and trainers,
    some ebooks, a credit card, a scan of a passport and some ecstasy. That was the'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'first time a bot had bought drugs. It raises the question of who is responsible
    for a bot''s actions.


    # What did your shopper bot buy when you set it off again?


    Some firecrackers, a fake Lacoste shirt and two USB devices to mine bitcoins.
    It chose these items randomly, but it did seem like the bot was saying: ''OK you''re
    not giving me enough money to spend''.


    # How do you feel as you open up the unknown parcels delivered from the dark net?


    It''s always exciting, but it''s also scary to run the bot and to see what it
    will buy. We''re hoping for a diverse set of items that give a good insight into
    the dark net landscape.


    # Does anything go? What if your bot bought a bomb-making kit?


    $100 in bitcoins doesn''t buy that much. This ensures the items remain manageable.
    Also, there aren''t that many items that fill us with fear on these deep web markets.


    # Why would you want to randomly shop for things in the dark net? Isn''t it a
    haven for illegal stuff?


    So is the surface web! This project started out with the Snowden revelations.
    It made us re-evaluate mass surveillance of the surface web, where everyone who
    uses it is trackable. So we started looking at the dark net, where encryption
    is built in. It is a necessity for people to remain anonymous in certain situations.
    We started thinking about how trust is formed in an anonymous network. And we
    wanted to know what was actually sold and bought there.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# What about trust? Has the bot been scammed yet, and paid for goods that haven’t
    been delivered?


    No. And this shows the level of trust that is there. The people who sell on these
    markets are used to trusting people online, and want to get a good rating. Even
    the Swiss police who seized the ecstasy bought by our bot were surprised at its
    quality compared to that available on the streets.


    Interview by Alison George for New Scientist magazine.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # 4 The blockchain


    If money goes digital, how do you stop it from being replicated? Currency that''s
    just as easy to copy as a digital file would be completely worthless. The solution
    is a cunning cryptographic ledger called the blockchain.'
  merge: -1
  img_proc: true
- pgno: 47
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 48
  md: 'The blockchain, Satoshi Nakamoto''s innovation, is the heart and soul of cryptocurrencies.
    It sets cryptocurrencies apart from other digital or virtual currencies. It secures
    the crypto-currency by, among other things, making it impossible for someone to
    counterfeit bitcoin – no easy task. This innovation is arguably the main reason
    why bitcoin has succeeded where other virtual currencies have failed. Traditional
    currencies rely on producing notes that are certified and tracked by an official
    source, such as a bank or a treasury. They make it as difficult as possible to
    produce counterfeits and so people trust the value of the currency. Things aren’t
    so easy in the digital world.


    Any attempt to create digital currency is immediately faced with a problem. Any
    digital file can easily be replicated. If anyone can replicate the file representing
    digital currency, then it becomes easily counterfeited, and then it is worthless.
    But this isn’t only a problem for digital currencies – record labels, book publishers,
    film studios, and even fashion labels of the 21st century are all facing similar
    issues.


    Those industries know that if anybody can reproduce their own copy of a film,
    book, or fabric pattern, then few people would actually bother to pay for it.
    So to try to counteract this trend many companies have started using Digital Rights
    Management (DRM) software. The software helps to prevent people from sharing copies
    of digital files by checking with a central server to see whether the person using
    the file is known to have paid for it. For example, if you go to watch a film
    on your computer the DRM software will consult a central server to see if you
    purchased it from a registered outlet. If you did, the file is then unlocked and
    you can begin watching the film; if not then you are blocked from watching it.


    But this solution is not perfect. Servers can break down or be shut down, leaving
    those who paid for the media in a worse'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'position than those who pirated it. Electronic banking technology is similar.
    When logging in to a bank account, a form of digital currency, we use the internet
    to access the bank’s computer where our records are stored and certified – but
    if the bank’s system goes down, there is no access to the money. Other attempts
    to utilize digital and virtual currencies before bitcoin worked this way, in that
    they relied upon central companies to hold and authenticate all the records. When
    those companies failed, the currencies disappeared.


    The blockchain changed everything. In the simplest terms, the blockchain is just
    a ledger that lists all of the units of the cryptocurrency and who owns them.As
    money changes hands, the ledger is rewritten to reflect the transaction. This
    way, it doesn''t matter where the money is physically located as long as there
    is a single list of all the units in existence, and who owns how much. If you
    tried to replicate digital coins you would soon be found out when you went to
    spend them, as they wouldn''t be accounted for in the blockchain.


    The blockchain means that bitcoins never actually need to exist. No one actually
    ''sends'' the coins anywhere. They just update the blockchain to reflect who owns
    what.The currency is basically one giant list of IOUs.Any attempts to tamper with
    the currency can be easily detected by checking the block-chain. It is an ingeniously
    elegant solution to a problem that many people thought would never be solved.


    # Public-key encryption


    The blockchain is run on encryption – hence the name ‘crypto-currency’. Contemporary
    encryption uses what is called asymmetric, or ‘public-key’, encryption, just like
    PGP (see “The birth of Cypherpunk’, Chapter 3). A crucial difference from'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'other encryption methods is that, from a mathematical standpoint, the decryption
    process is not simply the reverse of the encryption process: hence the term asymmetric.


    Public-key encryption is based on the principle that there are mathematical problems
    which are much easier to solve forwards than backwards. For example, multiplying
    two six-digit prime numbers like 323,123 and 596,977 together is a relatively
    easy task. With a minute and a pencil and paper, you would get 192,896,999,171.
    But if instead you were given the number 192,896,999,171 and asked to find the
    two prime numbers that divide it, you would need a lot more time to test all of
    the different possibilities. In public-key encryption the numbers are much larger,
    but computers have to perform very similar tasks.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_50_0.png)


    Public-key encryption keeps online information away from prying eyes.


    A user has two keys: a public key used to encrypt messages, and a private key
    to decrypt them. The private key might consist of very large prime numbers (hundreds
    or thousands of digits long), and the public key the result of multiplying them
    together.'
  merge: -1
  img_proc: true
- pgno: 51
  md: "The private key is used to generate the public key, and this generation process\
    \ can be verified, meaning that the two keys are forever linked together. A user\
    \ can be confident that they can share the public key with anyone without anyone\
    \ discovering their private key, as it's very difficult to reverse the generation\
    \ process.\n\nUsing the public key anyone can encrypt a message, but the private\
    \ key is required to decrypt it. Suppose you want to send a friend an encrypted\
    \ message. Here's the procedure:\n\n+   1. Your friend uses their private key\
    \ to generate a public key, which they can share with anyone. They send a copy\
    \ of it to you.\n+   \n+   2. You encrypt a message using their public key and\
    \ then send the message to them. Anyone who intercepts the message won't be able\
    \ to read it, as they don't have the private key. This includes you – the encryption\
    \ process only works one direction.\n+   \n+   3. Your friend receives the message\
    \ and uses their private key to decrypt it.\n\nAs long as no one but your friend\
    \ has the private key, a message encrypted with their public key will never be\
    \ read by anyone other than them.\n\nPublic-key encryption is so strong that the\
    \ only way for most users to try to break through encryption is called the ‘brute-force’\
    \ method. That means trying every possible secret key until you hit the right\
    \ one. Literally, guessing at computer speed. Researchers are currently using\
    \ a faster way, called ‘factorization’, to shortcut the mathematics, but it is\
    \ still very slow.\n\nOne type of public-key encryption commonly used today is\
    \ called RSA after the inventors – Rivest, Shamir and Adleman. In 2009, researchers\
    \ were able to use a series of supercomputers"
  merge: -1
  img_proc: true
- pgno: 52
  md: 'working on a factorization method to break a 768-bit key, but it took them
    two years. The next strongest key length in use is 1024-bit and was estimated
    by the same researchers to take 1000 times longer to crack. No one has done it
    yet, as far as we know. The strongest key length currently in use for RSA is 4096-bit.
    Researchers estimate that the amount of time required to break a key of that length,
    using today''s highest tech, would be ''practically infinite''.


    # Cryptographically sign on the dotted line


    It''s important to know that you''re not being deceived, especially on the internet.
    If Microsoft sends you an update how do you know the new software is actually
    from them and hasn''t been switched to a computer virus? Or if you receive an
    email from a friend, how do you know it hasn''t been intercepted and edited before
    getting to you? The answer is digital signatures.


    Digital signatures use similar concepts to public-key cryptography. They employ
    short strings of unique characters called a hash. Using a private key, a message
    is reduced to this hash. The hashing process can be verified with a public key.
    But changing the original message, even by one character, would completely alter
    the hash in an unpredictable way. You can use this method to sign a message, so
    the recipient knows that it was sent by you, exactly as it is, without any changes
    or deletions.


    +   1. Take the message you want to sign and using your private key, sign the
    message and create a unique hash.

    +   2. Encrypt the message with a friend''s public key, and send the encrypted
    message to a friend. They decrypt the message using their private key.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '3 Your friend uses your public key to inspect the hash. They see that indeed,
    this message could only have been signed with your private key and that the message
    is exactly the same as the one you used to generate the hash.


    Digital signatures can be used to verify that messages match the original. But
    their use is even more wide-ranging than that. They also can verify that downloaded
    files match the source, provide digital ‘handshakes’ for secure connections to
    servers, and maintain a chain of custody for digital documents.


    # How does the blockchain store transactions?


    The blockchain is like a digital ledger, a long list of IOUs, that tracks the
    changes in ownership of each bitcoin. The blockchain verifies all the transactions
    that are added to it, using a method similar to public key cryptography and signatures
    (see ‘Public-key encryption’ and ‘Cryptographically sign on the dotted line’,
    above). However, because it is meant for financial transactions, the terminology
    differs a little.


    Your ‘wallet’ functions like a private key. It is secret, known only by you, and
    is the link between all of the bitcoins you own.Your ‘address’ functions like
    a public key. It is generated by your wallet, and can be given freely to anyone,
    who can now send you bitcoins. Your wallet can also digitally sign your transactions,
    sent to the blockchain.


    Here is a step-by-step breakdown of a bitcoin transaction. It’s very similar to
    sending a message using encryption.


    +   1 You get the digital address of a friend to whom you would like to send some
    bitcoins.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   2 You send a transaction to the blockchain. The transaction consists of
    your address, how many coins you would like to send, the digital addresses of
    your friend, and your digital signature.


    +   3 Upon receiving the message, the blockchain verifies that the bitcoin associated
    with your address has enough of a balance to send the coins, and that your digital
    signature is valid. If everything is OK the blockchain is updated, now showing
    the transfer between you and your friend. This transaction is signed by the blockchain
    itself, which registers it as official and valid.


    There is no limit to the number of public keys a wallet can create. So the amount
    of coins associated with one wallet might be logged to any number of public keys
    in the blockchain. It''s a bit like one person having several different bank accounts,
    or one building having many different post boxes. The wallet always remains private,
    but anyone can see the public keys in the blockchain. In the blockchain is the
    entire record of where every coin has been, as it has bounced around from address
    to address, split into pieces, transferred, combined, and then split again. Even
    though this is a long, complex series of transfers, it can be analysed and the
    money can be followed around the ledger.


    The wallet, i.e. the private key, is the only identity required to enter a transaction
    from one address to another. As long as the wallet is safe and only under your
    control, you are the only one who can move your bitcoins. The fact that next to
    every transaction recorded in the blockchain is a digital signature associated
    with the address, means that anyone can check the validity of a transaction. Every
    transaction that has ever happened is contained within the blockchain, and every
    computer can check all the signatures going back through the recorded history,
    to prove the continuity.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The blockchain is the place where all transactions are certified, but it in
    itself needs to be verified as true and consistent. The worry is not so much of
    attackers sending false transactions to move other people''s bitcoins – the wallet''s
    signatures protect against that. The problem is more about transactions being
    deleted or undone. If someone had the power to unilaterally edit the ledger, turning
    back time and undoing previous transactions, then they would also have the power
    to create bitcoins out of thin air by restoring them to previous owners who had
    already exchanged them. The solution is to make sure that no individual has this
    control of the blockchain, by making sure that everyone does.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_55_0.png)


    The blockchain is the tool that underlies cryptocurrency


    # A place to keep the ledger


    The blockchain is everywhere. Every computer running the cryptocurrency downloads
    its own copy of an identical ledger from the other computers in the network. As
    each computer adds transactions to the blockchain, it simultaneously updates the
    network by'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'bouncing the information around to the other computers. The idea is that if
    any one person attempts to alter the blockchain''s transaction history, it would
    no longer match all the other copies.


    But then new transactions present a problem. If someone creates two new, contradicting
    transactions, how will the blockchain know which one to trust? Altering the entire
    history of the blockchain would be obvious, but small erroneous additions and
    subtractions submitted to the blockchain could quickly add up. If I tell one computer
    in the network that I will give a coin to one friend, and I tell another computer
    in the network that I will give the same coin to a different friend, which transaction
    is correct? The problem of all digital assets exists – transactions could be,
    in effect, duplicated. In crypto-currencies, this problem is called double-spending.


    Across the worldwide span of the network, different versions of the ledger might
    exist, with contradictions, or attempts to fool the network into thinking coins
    are assigned to two different places at once. How would the differences be resolved?
    How could you use this system as currency, if a customer leaves with a product,
    but then 30 minutes later the merchant discovers the coins they thought they had
    received had actually been sent elsewhere, or maybe back to the customer themselves?
    The blockchain employs an ingenious solution.


    # Proof-of-work


    Bitcoin, and all the cryptocurrencies that were developed directly from its model,
    ensure there is only one, canonical ledger, with no contradictions, by using a
    technique called ‘proof-of-work’. This allows the blockchain to be stored on every
    computer in the network at the same time, but also ensure that each copy of the
    blockchain will be identical.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'As long as the blockchain is ensured to be consistent and identical across
    all versions, the bitcoins can be trusted as currency even though they are entirely
    virtual. All duplicate and erroneous transactions are weeded out, and each bitcoin
    can only be held by one owner at one time – eliminating the double-spending problem.


    A proof-of-work task is based on the same mathematics used in public-key cryptography
    – though its process is separate from the cryptography used in transactions. The
    idea was suggested in 1997 by programmer Adam Back for a system called hashcash.
    Back’s idea was a computer having to complete a difficult task that took, for
    example, ten minutes, before it could send an email. For a person sending 50 emails
    a day the prerequisite would be trivial, limiting them to one email every ten
    minutes. But for a spammer who wanted to send thousands and thousands of emails
    a day, it would make widespread spamming impossible.


    A timer could be circumvented perhaps, but for a computer a task is a more firm
    limit. Computers are designed to solve long series of tasks quickly. However,
    a scalable series of tasks, such as those involving cryptography, can easily be
    scaled up to take exponentially longer on more powerful machines. A task of variable
    difficulty can be scaled on the fly to make sure that no matter what computer
    was working on it, from a cellphone to a supercomputer, the task would take roughly
    the same amount of time. It is like moving the finish line of a race so that a
    car finishes exactly at a specific time, no matter how fast or slow the car drives.


    # No shortcut


    If the task involves cryptography, then there is no shortcut. A proof-of-work
    task can only be completed by ‘brute force’.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The task, in this case, is an attempt to generate the correct hash as if for
    a signature, but without using a private key – instead by trying lots of different
    possible hashes, simply by guessing, until it finds the right one.


    In effect, the proof-of-work problem is like brute-forcing a low-level cryptographic
    signature, for which a secret key never existed. The cryptography is scaled down
    a great deal from commonly used cryptography, so that the computer network can
    actually solve the problem in ten minutes. A computer can make thousands of guesses
    per second. The network can make quadrillions of guesses per second. As more computers
    connect into the network, they each begin working on the same proof-of-work problem,
    which would ordinarily shorten the time until the solution is reached. But the
    ‘difficulty’ of the proof-of-work is adjusted automatically so that each solution
    always takes ten minutes, regardless of how many computers are generating hash
    guesses.


    Once a computer thinks it has the right hash for the cryptographic mathematical
    problem, another computer in the network can verify this quickly. Verification
    is a snap, compared to guessing over and over again. But because no secret key
    exists, guessing and verifying is the only way to come up with this correct hash.
    That is why it is called ‘proof-of-work’. There is no solution other than proving
    you did the brute-force work.


    Cryptocurrencies that rely on proof-of-work use this sort of time limit to determine
    the length of time that the block is ‘open’ for transactions, before it is written
    to the blockchain. When the proof-of-work is complete, the block is closed. Bitcoin
    is designed so that each block takes about ten minutes to solve, but the time
    varies with other cryptocurrencies.


    Proof-of-work might sound like a very roundabout way of making the block close
    every ten minutes, but there is an'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'important reason for it. During the ten minutes of the bitcoin block duration,
    the network shares all the transactions to be added to the blockchain among all
    its computers. The network has a chance to compare all new transactions, and delete
    the duplicates or contradicting transactions. This is the first barrier to any
    sort of double-spending transactions.


    The computer that finds the solution to the proof-of-work problem will be, effectively,
    chosen at random due to the brute-force method of the proof-of-work. This computer
    is said to have ‘solved’ the block. Only the transactions received by the computer
    that solves the block are included. Any transactions that didn’t make the cut-off
    must wait for the next block. This randomization also helps prevent against double-spending
    transactions. If it is impossible to predict where the block will be solved, it
    is more difficult to attempt to game the system.


    The actual data of the block contains not only those transactions and the proof-of-work
    solution, but also includes the hash of the block that came before it. The new
    block is ‘signed’ in this way by using the previous block, and so on, all the
    way back to the beginning.This has the added benefit of recertifying historical
    transactions every time a new block is formed. If the information in any previous
    block is changed even just by one character, it will change the signature, which
    will change the next block, and the next, and so on. Therefore, the historical
    blockchain cannot be altered, without changing every block down the line. The
    blocks are immutably linked together, and means that the current block is always
    a unique product of all those that came before it, and nothing can be inserted
    in the middle.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_59_0.png)


    FIGURE 4.1 The blockchain is a series of blocks.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# No false information


    To add false information or remove transactions from a previous block, one would
    have to recreate all the blocks from the desired change point forward, including
    the new block that is currently being solved, in order to redo the signatures
    all the way back up the chain. It would be like a runner stopping a race in the
    middle, returning to the start line, and then running fast enough to catch the
    runners who had never stopped. The only way that a computer could win this race
    is if it were producing hash guesses faster than all the other computers combined.
    This also protects against double-spending, by making it impossible to reverse
    previous transactions by simply removing them from the blockchain.


    In addition to this complicated signing and hashing serving to lock each block
    to the next in the chain, the cumulative effect of the proof-of-work helps the
    network maintain an identical blockchain. The bitcoin software always chooses
    the longest blockchain as the canonical one. The more blocks, with the most transactions,
    and the longer hashes from more difficult proof-of-work tasks, will create the
    longest blockchain. In this way, the network will always select the blockchain
    with the majority of computers working on it, and ignore any attempt to insert
    a false blockchain prepared by a minority of attacking machines. There is only
    ever one, single blockchain, and it will always be the one used by the vast majority
    of the network.


    Once a merchant sees their transaction in a confirmed block in this longest, canonical
    blockchain, they know that the coins were really transferred. The transaction
    cannot be cancelled out by a contradicting transaction, and the blockchain will
    always be the single record of that transaction. Now, a double-spend is nearly
    impossible.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Trust


    Trusting the proof-of-work seems to leave much to chance. What if there are communication
    disruptions between parts of the network? Trusting the proof-of-work seems to
    work in theory, but without any authority to say which blockchain is definitely
    the right one, couldn’t there be problems?


    Sometimes there is a rare case in which a block is solved by two different computers
    at different ends of the network, such that each computer thinks it is first because
    neither has received notification of the other’s block yet. Each of those computers,
    being separated on the network, will log different transactions into its block.
    In this rare event, the network will have two different ledgers in play for just
    a moment, a situation called a ‘fork’.


    There will be a moment of confusion, as the network receives two different updated
    blockchains. As soon as the different blocks are solved, each computer in the
    network will receive either one new block, or the other. The network will be split
    between the two different ledgers. At some point, however, the next block will
    be solved, by the half of the network with more computers, and therefore more
    effort going towards solving the proof-of-work. As this second block is added
    to one of the two conflicting ledgers, one will suddenly be longer. As the network
    always selects the longest blockchain, the competing ledger will be discarded
    in favour of the one already selected by the majority. In essence, on this basis
    the network votes on which blockchain to use, and then vetoes all others. Before
    long, the entire network is now on the longest blockchain, and there is only one,
    canonical ledger again.


    Regardless of how close in time the solutions may have been, and however much
    the transaction records might differ, by the time a second block has been added
    the network will'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'begin picking one version of the blockchain and stick with it. All the computers
    will once again agree. This situation is rare, but cautious cryptocurrency users
    often wait for two or more cycles of confirmed blocks, because then they can be
    sure that any potential fork was resolved and that the blockchain they are seeing,
    and the transactions it contains, are the one, true record of every coin and address
    currency-wide.


    # Is the blockchain all that it''s cracked up to be?


    The blockchain, rather than cryptocurrencies, has been lauded as the real invention
    of note. But many of the ideas involved were invented long before cryptocurrencies
    came along.


    The chain of signatures utilized in a blockchain is called a ‘Merkle tree’, after
    its inventor Ralph Merkle, who came up with it in 1979. It is used for all kinds
    of networked applications that need to share data, ensuring that data isn''t corrupted
    through the chain of shares. Many of these applications are crucial to the functioning
    of our networked systems.


    The blockchain, which is more specifically for multi-user, decentralized ledgers
    of transaction information, may end up being just as important as the Merkle tree
    which inspired it. But that all depends on what the blockchain is used for. Many
    people have big ideas for the blockchain (see Chapter 11), but none of them have
    truly made their mark yet. Until then, it is just one more clever invention among
    many others.'
  merge: -1
  img_proc: true
