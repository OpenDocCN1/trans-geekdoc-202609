- pgno: 98
  md: '# The bitcoin exchange


    Technology flaws were rampant in the early days of the crypto-currency world.
    While the coding of bitcoin itself was proving to be resilient, the infrastructure
    required to buy and sell bitcoins in a currency exchange was not quite as secure,
    leaving it open to attack by hackers.


    Mt. Gox, the primary web exchange for bitcoin at the time that Silk Road launched
    in 2011, was first hit by hackers back when its creator, Jed McCaleb, was still
    in control. The theft was minimal, but this attack raised McCaleb''s awareness
    of how vulnerable the site was. The episode was a major influence in his decision
    to sell Mt. Gox to Mark Karpeles, a programmer he had befriended who was helping
    manage the site. The sale took place in March 2011, but the problems with hackers
    didn''t stop there. In June 2011, there was another break-in.


    Somehow, a hacker had managed to forge the credentials needed to log into Jed
    McCaleb''s still-active account with full administrator privileges. This gave
    the intruder the ability to artificially boost their account holdings, creating
    100,000 bitcoins where none existed before. They couldn''t fool the bitcoin blockchain,
    but they didn''t need to. The fake bitcoins only existed in the internal accounting
    of the Mt. Gox website. When users traded currency on Mt. Gox, they transferred
    bitcoins to the Mt. Gox public address, which tracked their balances internally
    as they bought and sold. The exchange then sent bitcoins out of the Mt. Gox wallet
    back to the users when they wished to withdraw their funds. With a new fortune
    existing only inside the Mt. Gox system, the hacker began selling rapidly, sending
    the price of bitcoin on the exchange plummeting. Within 30 minutes, the price
    had crashed from $17.50 to $0.01.


    Mt. Gox had a security measure: only $1,000 worth of bitcoins could be transferred
    out of the site''s wallet, via the'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'blockchain, at a time. But with the price artificially low, this was a lot
    more coins than before. The attacker withdrew funds, transferring 2,000 bitcoins
    out of Mt. Gox – real bitcoins from Mt. Gox’s coffers, not just figments of the
    Mt. Gox account software. As the price rebounded after the sell-off, those bitcoins
    became worth far more than $1,000. A month later, that sum could have been worth
    $13,000.


    The result of the attack was chaos. The price had crashed and rebounded, and hundreds
    of Mt. Gox users, thinking they were getting a bargain, had exchanged real dollars
    for the fake bitcoins. Mt. Gox had to shut down to audit its exchange accounts
    and remove the fake bitcoins. This left the users in a panic, unsure if their
    accounts were still active, were drained of funds, or had succumbed to some other
    form of sabotage. Furthermore, the hacker posted data stolen during the intrusion
    to the internet, which added to the confusion.


    Eventually, Mt. Gox sorted everything out, erased the trading history that occurred
    after the engineered crash, and repaid the missing bitcoins from its own pockets.
    But it was a blow both to the exchange and to the cryptocurrency, in general.
    Even though bitcoin had only ever functioned exactly as it was supposed to, if
    the biggest bitcoin exchange was vulnerable to price manipulation and theft, what
    did this mean for its future?


    # The fall of the exchange


    Despite hacker attacks and near-constant technical problems, Mark Karpeles kept
    trying to make Mt. Gox work. By March 2013 he had 18 people working for him, including
    someone to lead the business while he handled the site’s functionality. Karpeles
    was the only person who could approve of changes to the code, including major
    security fixes.'
  merge: -1
  img_proc: true
- pgno: 100
  md: "Mt. Gox was earning trading commissions of over one million dollars per month,\
    \ but slip-ups persisted.A deal with startup CoinLab to handle US bank transactions\
    \ ended in a lawsuit in May 2013 because of Mt. Gox’s failure to uphold its end\
    \ of the bargain – the contract was supposed to give CoinLab exclusive access\
    \ to Mt. Gox accounts in North America, but the company was still using other\
    \ deposit processors. Later that month, the US Department of Homeland Security\
    \ seized Mt. Gox accounts managed by payment processor, Dwolla, because the exchange\
    \ had not registered as a money transmitting company, even though other bitcoin\
    \ businesses had done so with ease.\n\nIn February 2014, the deathblow for Mt.\
    \ Gox finally landed. It began, as many of Mt. Gox’s problems did, with a hacker.\
    \ But this time, it was not a hit-and-run heist. The hacker had been working inside\
    \ the site for months, maybe even years. Using a known vulnerability in the bitcoin\
    \ blockchain called the ‘transaction malleability problem’, the hacker sent coins\
    \ out from the Mt. Gox wallet, and then made it appear to Mt. Gox as if it the\
    \ transaction was cancelled (see box ‘The transaction malleability problem’, below).\n\
    \nOther exchanges had dealt with this vulnerability easily, making their software\
    \ wait for several block confirmations to reveal whether the bitcoins had been\
    \ moved, rather than relying on the transaction ID alone. Mt. Gox did not.\n\n\
    > **The transaction malleability problem**\n> \n> When a bitcoin transaction is\
    \ sent to the blockchain, it includes a transaction ID number that is created\
    \ from a cryptographic hash of the sender’s address and other transaction information\
    \ – essentially a unique string of characters, derived from the address and other\
    \ transaction"
  merge: -1
  img_proc: true
- pgno: 101
  md: 'information. This is a different ‘hash’ than the hash that is generated by
    cryptocurrency mining, and different again from the hash of preceding blocks that
    link the blockchain, but it is a similar cryptographic process. The transaction
    ID hash is a crucial part of the procedure of signing and verifying the transactions.


    After sending a transaction to the blockchain, the bitcoin software on a particular
    computer will look for the transaction ID number to make sure its transaction
    was accepted and included in the blockchain. However, a slight flaw in the bitcoin
    protocol allowed the transaction to still go through if the address was improperly
    formatted. This slight change in address information would change the cryptographic
    hash, and accordingly, change the transaction ID number. The computer would look
    for what it supposed the transaction ID to be, but would not find it. And yet,
    the transaction would still have gone through.


    So, as the hacker created transfer requests out of Mt. Gox, they simultaneously
    caused Mt. Gox to send the network additional transactions requesting the same
    transfer of bitcoins, but with an improperly formatted address, and therefore
    different transaction ID numbers. Doing this continuously, some of the mutated
    transactions were received and authenticated by the blockchain before the properly
    formatted ones. Then when Mt. Gox’s properly formatted transactions arrived in
    the network, they were ignored as duplicates.


    When the Mt. Gox software looked for its transaction on the blockchain, it would
    not find the transaction IDs it was looking for, because it was only looking for
    the properly formatted ones. But the bitcoins would already have been transferred
    to the hacker’s address, using the'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'mutated transactions. So the Mt. Gox software would send more. By continuing
    this cycle over and over, the hacker got Mt. Gox to transfer twice as many bitcoins
    as it intended. This is not quite the same as the double-spend problem, but revealed
    an odd vulnerability that was not initially envisioned by Satoshi Nakamoto and
    the other early bitcoin coders. It was called the ‘transaction malleability problem’.


    Most services have learned how to secure themselves against this problem. Rather
    than looking for the transaction ID specifically, they check to see if the transaction
    of bitcoin itself is in the blockchain, bypassing the problem of mutated IDs.
    But the transaction malleability problem continues to crop up in certain bitcoin-using
    software to this day, and a full fix has yet to be implemented (see ‘A possible
    fix: Segregated witness’, Chapter 11).


    Over a long period, the hacker slowly made hidden transfers out of the Mt. Gox
    active, or ‘hot’, wallet while the website acted as if nothing out of the ordinary
    had happened. When the wallet was empty, Karpeles unwittingly refilled it with
    bitcoins from other backup wallets. Like a slow leak, funds trickled out of the
    Mt. Gox supply, while the site’s own internal accounting showed that there were
    just as many as there ought to have been. The problem wasn’t discovered until
    almost all of Mt. Gox’s coins in its many wallets were gone: 100,000 of its own,
    and 750,000 of its customers’. At the February 2014 price of around $539 per bitcoin,
    the loss was equivalent to more than $450 million dollars. On 7 February 2014,
    Mt. Gox froze all account withdrawals. On 24 February, all trading was suspended.
    The exchange was now closed, forever.'
