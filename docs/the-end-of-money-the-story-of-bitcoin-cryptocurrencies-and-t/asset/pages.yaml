- pgno: 12
  md: '# Introduction


    Take out a piece of money. A banknote, made from paper and maybe some plastic,
    wrinkled from being shoved in pockets or wallets. You can exchange it for goods
    or services, or put it in the bank for a rainy day.You know how much it''s worth.
    If you give it to someone else, they know too. It can''t get much simpler than
    that, right?


    Starting in 2008, money became more complicated. Something called ‘cryptocurrency’
    was invented, and in a short span of time it swept into the global consciousness.
    The name of this cryptocurrency was bitcoin, and – depending on who you asked
    – it was either the brave new future of money or a menace to the world economy.


    To the uninitiated, bitcoin can be baffling and even scary. What is it? Who controls
    it? Who uses it, and why? Lurid headlines about cybercrime, embezzlement, drug
    trafficking, money laundering, corruption, murder and even the overthrow of governments
    have tainted its reputation. There is an element of truth to that shady reputation.


    But there is another side to the story too. Cryptocurrencies may really be the
    future of money, and there are many good reasons to think that would be an improvement
    on what we have now.


    The core innovation of cryptocurrency is a technology called the blockchain. You’re
    going to read a lot about that in this book. The blockchain promises to be a disruptive
    technology'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'in extremis, capable of transforming not just how money works but many other
    things too, from the law to democracy.


    After cryptocurrencies were released into the world, we began to consider money
    as a technology. And that technology is sweeping out widely into the future, catching
    millions upon its bleeding edge. On the way to those possible futures we''ll encounter
    some near-future innovations, such as internet-aware appliances, decentralized
    banks, and even autonomous corporations.


    This Instant Expert guide will introduce this new concept of money as a digital
    technology. It will paint the broad strokes of what a cryptocurrency is, how it
    came to be, and where the blockchain might be going next. Along the way, we’ll
    travel from the dark alleys of the internet to the penthouses of global finance.
    We’ll get into the details of cryptographic mathematics, and explore the often
    strange bitcoin subculture. We’ll talk about what makes the money in our pockets,
    what makes the economies of nations, and about what night change these notions
    for good.


    Predicting the future of money is like trying to get rich gambling on horse races.
    But by the end of this book, you’ll be in as good a position as anyone to visualize
    what’s coming over the horizon.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Bitcoin:The basics


    What exactly is a bitcoin? How can you get hold of them? And what can you buy?'
  merge: -1
  img_proc: true
- pgno: 15
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What exactly is bitcoin?


    Bitcoin is a new type of digital currency called cryptocurrency. It is not controlled
    by banks or backed by national governments, but is generated by a decentralized
    network of computers using software to solve mathematical problems. It relies
    on a cryptographic technology called a blockchain. It is the first and largest
    cryptocurrency, though there are now many cryptocurrencies in existence.


    # How do I use bitcoins?


    Bitcoins are not physical entities. They are not minted into notes and coins like
    dollars or euros. Instead, bitcoins are stored in a digital file called a wallet.
    This wallet is used to send bitcoins to others, using software on a smartphone
    or computer.


    # How do I get bitcoins?


    There are a number of ways. The first is by ‘mining’ them. You can do this by
    setting your computer to carry out the cryptographic calculations needed to sustain
    the cryptocurrency. This earns a chance of winning a small quantity of bitcoins.
    This is how the cryptocurrency was originally distributed. Today, however, the
    mining competition is so fierce that earning any bitcoins this way is very difficult
    without a large investment. Alternatively, you could pay for ‘cloud mining’ services,
    where someone else does the mining for you.


    Another way of getting bitcoins is in person from someone who already has some.
    Services such as localbitcoins.com'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'connect individuals looking to exchange bitcoins for traditional currency such
    as dollars or euro.


    Another way to acquire bitcoins is via exchanges, which allow you to convert one
    currency – dollars, pounds, euros, yuan or bitcoins – into another, just like
    any other foreign currency exchange. Mt. Gox (see Chapter 7) was once the largest
    exchange worldwide until it collapsed in 2014. At the end of 2016, the largest
    exchange by trading volume was BitMEX.


    More recently, services have opened up that allow customers to link their bank
    services to cryptocurrency–holding services, allowing them to deposit bitcoins
    and spend in local, traditional currency such as dollars or pounds, and vice versa.
    Two examples of services like these are Coinbase and Bitpay.


    Lastly, a straightforward way to get bitcoins is to accept them in exchange for
    the sale of goods and services. Companies such as Stripe and Paymium offer services
    to help merchants accept cryptocurrencies in their businesses.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_17_0.png)


    FIGURE 1.1 The symbol for bitcoin was created by Satoshi Nakamoto soon after he
    invented the cryptocurrency'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'December 2013 The People''s Bank of China forbids trading in bitcoin. Price
    falls as Chinese money exits.


    April 2013 Cyprus bank crisis leads to bitcoin surge, overwhelming the main exchange
    and leading to a sudden sell-off.


    June-July 2014 Businesses such as Expedia and Dell begin accepting bitcoin, and
    the price rebounds to $600.


    July 2016 Bitcoin value reaches $750 for the first time since early 2014, but
    plunges again, partly due to a security breach at the Bitfinex exchange resulting
    in the theft of bitcoin worth $72 million.


    November 2016 In the uncertainty of the US presidential election, the bitcoin
    price rises again to over $700.


    December 2015 After a stable year, Bitcoin ends 2015 on a high, boosted by a surge
    in trading by Chinese exchanges.


    January 2015 The bitcoin value reaches a low of $214, resulting in declarations
    of the cryptocurrency''s death.


    June 2016 Bitcoin value surges, driven by multiple factors including fears that
    the UK could split from the EU, optimism about the blockchain and increased demand
    for bitcoin, especially from China.


    November 2013 Chinese cash begins to pour in. A US Senate meeting calls virtual
    currencies a ''legitimate financial service'', eventually leading to a peak of
    $1,242 at the end of the month.


    Figure 1.2 Highs and lows: bitcoin owners must be prepared to ride out volatile
    prices


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# What can I buy with bitcoins?


    In the early days of bitcoins, there wasn’t much people could buy with them. The
    first major market that accepted bitcoin in payment traded in drugs and other
    illegal services. Today, many major businesses accept bitcoin directly, and for
    the dedicated bitcoin user, a card integration service like Coinbase or Bitpay
    allows customers to use bitcoins in any credit card tranation.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 2 The birth of bitcoin


    In 2008, a person who did not exist had an idea. By 2011, that idea was worth
    over $54 million. This is the story of the invention of a radically new type of
    currency.'
  merge: -1
  img_proc: true
- pgno: 21
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 22
  md: 'World-changing financial ideas don''t usually appear out of the blue in email
    inboxes. So cryptographer Adam Back didn''t pay much attention when he got an
    email from ''Satoshi Nakamoto'' in August 2008 proposing a new idea for a virtual
    currency. Lots of people on the cypherpunk mailing list, which Back had followed
    since its creation in 1992, had proposed ideas for currencies that existed only
    within computers. Back didn''t spend much time considering this particular concept,
    especially coming from an unknown name.


    This was the first time anyone had heard from Nakamoto, a name believed to be
    made up by an unknown person or group. The idea – untested and unproven at that
    point – was called bitcoin. Less than three years later, when Satoshi Nakamoto
    disappeared from the internet, the total value of all bitcoin in existence was
    over $54.5 million. But the inventor of crypto-currency has never been positively
    identified.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_22_0.png)


    The identity of bitcoin inventor ''Satoshi Nakamoto'' is a mystery.


    By the time Nakamoto disappeared, the code of his open-source software for this
    new type of currency had been rewritten so'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'many times that it is difficult to say that Nakamoto is bitcoin''s author.
    It is estimated that less than a third of bitcoin''s computer code in use today
    was written by Nakamoto. Like so many other things that comprise the internet,
    the reality is that bitcoin now belongs to everyone and no one.


    # $9.29 billion Total value of all bitcoin in existence (August 2016)


    Strange ideas like bitcoin are common among the computer scientists, programmers,
    mathematicians and activists in the cypherpunk world, who have devised many complicated
    schemes to ensure technological privacy.Through experience, they are sceptical
    of ideas lauded as the ‘next big thing’. So for a while, bitcoin seemed as if
    it might be yet another idea that would fall into obscurity. Bitcoin wasn’t the
    first idea for a virtual currency, and none of the previous schemes had taken
    off.


    # Would the real Satoshi Nakamoto please stand up?


    There have been many attempts to unveil the person behind the pseudonym of bitcoin’s
    founder. All have failed.


    +   • In October 2011, New Yorker journalist Joshua Davis suggests that computer
    scientist Michael Clear might be Satoshi, based on his background in cryptography,
    his use of vernacular British English, and his not-over denial when first asked
    (he later denied it fully).'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   - The next day, magazine *Fast Company*’s Adam L. Penenberg disagrees.
    He believes that Nakamoto must be one of three cryptographers – Neal King, Vladimir
    Oksman or Charles Bry – whose names appear on a cryptography patent filed three
    days before the first bitcoin.org website was registered by Nakamoto. But these
    connections turn out to be coincidences.

    +   - Users on a bitcoin forum suggest in 2012 that **Jed McCaleb**, founder of
    the bitcoin exchange Mt. Gox, might be Satoshi.

    +   - Postings in other forums around this time suggest the conspiracy theory
    that bitcoin might have been founded by the US Central Intelligence Agency or
    National Security Agency, to lure in unsuspecting criminals.

    +   - In 2013, after the arrest of Ross Ulbricht, founder of the illicit dark
    web shopping site Silk Road, two Israeli researchers conclude that Ulbricht must
    be Nakamoto.

    +   - In March 2014, *Newsweek* reporter Leah McGrath Goodman drops the bombshell
    claim that the real name of the creator of bitcoin *is* Satoshi Nakamoto, though
    he goes by the first name, Dorian. She bases her claim on Dorian Nakamoto’s programming
    experience, and his long time residence in Silicon Valley.

    +   - In the widespread debunking of the Dorian Nakamoto claim, *Forbes* writer
    Andy Greenberg investigates the possibility that bitcoin code-contributor Hal
    Finney is the real Nakamoto, but soon rejects the idea.

    +   - Nathaniel Popper’s 2015 book, *Digital Gold*, suggests that Nick Szabo –
    Cypherpunk, bitcoin investor, and inventor of the earlier virtual currency, BitGold
    – is Satoshi Nakamoto. Szabo publicly denies the claim.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'In late 2015, _Wired_ magazine and online site _Gizmodo_ get a tip and a trove
    of leaked documents that point to Australian programmer Craig Wright. He initially
    denies it, but in the spring of 2016 Wright then claims that he is Nakamoto, and
    that he created bitcoin along with his since-deceased associate Dave Kleiman.
    Although he is able to present a significant amount of proof, it is not enough
    to satisfy many sceptics, and so the mystery lingers still. (For more on this,
    see Chapter 10.)


    # The first bitcoin


    Nakamoto didn''t give up after one email. After contacting Back, Nakamoto posted
    his idea to a public email list about cryptography. Next, he posted it on a website
    called the P2P Foundation, which accepted submissions of all kinds of peer-to-peer
    technology projects. One person who thought the idea had some merit was Hal Finney,
    a programmer who had worked on Pretty Good Privacy, a free encryption software.
    Intrigued by the distributed, cryptographic aspects of bitcoin, Finney worked
    with Nakamoto on the code. He also received the first bitcoin ever sent, from
    Nakamoto in early 2009. It was worth a pittance then.


    Slowly and surely, bitcoin began to take off. Two budding programmers, Gavin Andresen
    and Martti Malmi, liked the idea and helped Nakamoto build a website and improve
    the bitcoin code. They invented the term ‘cryptocurrency’ to describe a virtual
    currency built around cryptography. They set up a forum in the autumn of 2009
    for the nascent community of cryptography geeks, libertarians and programmers
    who were interested in the strange possibility that an idea for a decentralized
    currency might actually work.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The more the developers tweaked the code, experimented with it, and ran it
    through its paces, the more it seemed like it could become more than just an idea.
    The code worked. It was resilient. As more people downloaded the software and
    set their computers to perform the tasks necessary to generate the currency, the
    more solid it appeared.


    If the technical aspects of bitcoin were looking good, other aspects were still
    lacking. By the beginning of 2010, there was still no good way to buy bitcoins,
    nor anything to buy with them – there were just a few small websites that sold
    a selection of bitcoin goods, such as stickers and T-shirts. There was one famous
    incident in April 2010 when an enthusiast named Laszlo Hanyecz got someone in
    the forum to send two pizzas to his house in exchange for 10,000 bitcoins, but
    that was hardly a reliable means of ordering pizza.


    # Going viral


    In July 2010, the popular tech news aggregator, Slashdot, bumped a story about
    bitcoin to its front page. Downloads of the program jumped nearly sevenfold. Bitcoin
    was going viral, but there was still no way for all these interested people to
    get hold of any.


    The bitcoin network distributes new bitcoins in return for performing tricky ‘proof-of-work’
    calculations (see Chapter 4). In those early days, when a computer running the
    software solved one of these ‘blocks’, it got a reward for the effort; 50 new
    bitcoins were created and added to the user’s virtual wallet (see ‘The world of
    currency mining’, Chapter 5). This also solved the problem of where the money
    ‘comes from’, because there is no central bank to distribute it.


    Back when there were only a few computers on the network, claiming this reward
    wasn’t hard. Since Satoshi Nakamoto’s'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'computer was often the only one on the network for most of the cryptocurrency''s
    first year, his wallet accumulated an estimated one million bitcoins in block
    rewards. But as more and more people started running the software, the **difficulty**
    of solving blocks increased (see ‘A digital arms race’, Chapter 5). There were
    so many people doing the proof-of-work, it became rare for an individual computer
    plugged into the network to win a block. It was almost like winning a lottery.


    At this point, bitcoins were still very cheap. When individuals traded them for
    cash, they were worth only a few cents each. These trades were done on an ad hoc
    basis, in forums and by email. If there was no system to readily get hold of even
    a few dollars'' worth of bitcoins, how would anyone ever be able to use them as
    a currency? People needed to be able to buy them in quantity at market rates,
    and they had to be accepted in trade for goods.


    # Does it matter who Satoshi is?


    *The identity of bitcoin’s founder is one of the biggest mysteries of the internet.
    But does it matter who he or she really is?*


    Not only is Satoshi Nakamoto a historical figure, responsible for the creation
    of a massive digital storehouse of value, but he likely controls a significant
    part of that value. Experts estimate that the bitcoin he owns is worth over $600
    million dollars. And regardless of the exchange value, that currency will be nearly
    5 per cent of the total cryptocurrency in the bitcoin system, once it reaches
    full capacity. Whoever controls that portion of the cryptocurrency, certainly
    wields a substantial amount of power over it.


    But many proponents of cryptocurrencies are happy that he has never been conclusively
    identified. Without a founder, there is no Henry Ford or Steve Jobs, no major'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'figure to deliver pronouncements about the direction that development should
    take. Instead, anyone who can come up with an idea is just as capable of pursuing
    it and selling it to the public at large.


    This doesn''t stop the insatiable curiosity about Satoshi''s identity. It is rare
    to have a public figure so shrouded in mystery, who just disappears without a
    trace. What does he think about the development of cryptocurrencies? Where did
    the idea come from? What sort of things is he doing now? It is possible we will
    never know.


    # The exchange


    Among the many people who discovered bitcoin was Jed McCaleb, co-creator of the
    peer-to-peer file-sharing program, eDonkey. Using an old domain name from an abandoned
    project related to the Magic: The Gathering card game, he started a bitcoin exchange
    called Mt. Gox. There, anyone could buy and sell bitcoins for real US dollars,
    in a price that fluctuated according to market demand. With the added publicity
    from Slashdot, Mt. Gox took off as the first real cryptocurrency exchange.


    It was now possible to buy bitcoins for dollars. But there was still nothing to
    buy with them. That changed in the beginning of 2011 due to two events.


    In December 2010, after whistleblower website WikiLeaks leaked classified information
    from the US government


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'to the internet, PayPal and other payment processors refused to process donations
    to WikiLeaks. Libertarians, cypherpunks, and internet activists decried this as
    censorship, and bitcoin was discussed as a potential solution to this problem.
    Without a company controlling bitcoin, users could make all the donations they
    wished, and there would be no one the government could force to implement an embargo
    of WikiLeaks. The price of a bitcoin on Mt. Gox rose to 30 cents that month with
    the hype.


    # The marketplace


    Two months later, another idealist decided to put bitcoin’s ability to bypass
    government influence to the test. A person who identified himself only as ''Dread
    Pirate Roberts'' started a website called Silk Road, the goal of which was to
    create an Amazon-like marketplace for illicit and illegal products, with a general
    ideology of thwarting government control. Taking a philosophy of only selling
    ''victimless products'' (drugs and forged government documents were okay while
    weapons, illegal pornography, and stolen identities were not allowed), the site
    was visible only to users connecting with the address-anonymizing software called
    TOR. This masked the only currency accepted on Silk Road was bitcoin.


    The increased anonymity offered by bitcoin over credit card transactions meant
    that internet-savvy drug traffickers


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/1aafdaf3d396c22bbcefa1ff58c79405_30_0.png)


    You don''t need physical coins to use bitcoin, but some physical tokens have been
    created.


    gave Silk Road a shot, despite its vulnerabilities. The site was so popular that
    it shut down several times during the first half of 2011, unable to deal with
    the traffic. An article on the now defunct website Gawker about Silk Road was
    published in June of that year. Immediately, Silk Road''s business boomed. Now
    with something, albeit illegal, for people to buy with bitcoin, the price for
    one bitcoin on Mt. Gox rose from a price of around 70 cents in February 2011,
    to nearly $10 in May, and $32 in mid-June.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The Silk Road boom brought other undesired public attention to bitcoin. On
    5 June 2011, US Senator Chuck Schumer held a press conference at which he denounced
    bitcoin and Silk Road, and pressed federal authorities to crack down. The US Drug
    Enforcement Administration and the Justice Department issued press releases expressing
    their concern. In June, Dread Pirate Roberts voluntarily put Silk Road on hiatus,
    hoping that the heat would die down.


    $450 million Value of bitcoin stolen in Mt.Gox collapse (February 2014)


    With bitcoin''s rising notoriety, others tried to distance themselves from it.
    Jed McCaleb, the founder of Mt. Gox, was becoming overwhelmed by the stress of
    guarding the site from hackers. One such attack broke into the site and spirited
    away $45,000 worth of bitcoins in January 2011. In March, McCaleb sold the site
    to another developer.


    It was during this time, in April 2011, that developers of bitcoin software heard
    the last of Satoshi Nakamoto. After some terse email exchanges in which Nakamoto
    expressed concern about the negative press that came with these anti-government
    causes, as well as worries about his pseudonym becoming something of a notorious
    legend among bitcoin proponents, the creator of the first cryptocurrency signed
    off. The forum username went dark, and the emails stopped coming. The anonymous
    creator of bitcoin simply ceased to exist.'
  merge: -1
  img_proc: true
- pgno: 32
  md: But there was too much money at stake for bitcoin to disappear. At the time
    Nakamoto disappeared the total value of all bitcoin in existence was around $54.5
    million. Just two months later that had increased to more than $207 million. During
    a trading peak of 2.8 million bitcoins exchanged on 8 June 2011, Mt. Gox had earned
    around $900,000 in commissions over a 24-hour period. After Dread Pirate Roberts
    turned his site on again in July, Silk Road was generating commissions of $30,000
    a month, and that number was quickly rising. Cryptocurrency was no longer just
    an idea. The nebulous, internet–dream quality of it evaporated along with its
    supposed creator, and what was left was real money, with real value – and all
    the problems that come with it.
  merge: -1
  img_proc: true
