  md: '# Is bitcoin anonymous?


    Not really. Getting a bitcoin wallet requires no ID, or even a name. But all transactions
    can be read in the blockchain. A cryptocurrency changes hands in the open, even
    if those hands don''t have names attached to them.


    The blockchain is like the unavoidable ‘paper trail’ that regular drug dealers
    try to avoid with money laundering. Drug dealers might earn stacks of cash, but
    spending it on a house or a car is difficult without it being obvious that money
    came from illegal sources.


    If a particular bitcoin is suspected as having been used to buy drugs on the dark
    web, one simply has to watch where that bitcoin goes next, tracked through the
    transaction record of the blockchain. Anyone can follow how it’s used. If bitcoin
    is earned through illegal drug sales, the owner can’t be sure that the police
    are not digitally tracking it. Drug money is no use if it can’t ever actually
    be used.


    It is more difficult for law enforcement to discover the identities behind bitcoin
    transactions than it would be to send a subpoena to a bank as they do for regular
    currency transactions, but it is certainly not impossible. Those attempting to
    make use of illicit dark web markets often use ‘bitcoin laundering’ sites, which
    mix their bitcoin in with that of a bunch of other users, and then spit it back
    out on the other side. This complicates matters for authorities, but they are
    quickly developing tools to track the bitcoin as it passes through any number
    of exchanges, launderers, and wallets. All the information is in the ledger, it
    just has to be extracted and traced.'
