  md: 'payments.This issue eventually severed the deal in late 2013, not long before
    Mt. Gox was forced to shut down permanently.


    # Bitcoin by post


    In an effort to find more customers and create a business model beyond simply
    buying bitcoins, some companies have begun targeting international remittances
    as a business model, rather than exchange services – a potentially huge market
    for cryptocurrencies.


    Circle is one company that sees its primary business as money transfers. The company
    obtained the first BitLicense for cryptocurrency-related businesses from New York
    State, and also an e-money licence from the Financial Conduct Authority in the
    UK. This allowed Circle to partner with Barclays bank. By utilizing the services
    of this bank and others in the US, money can be transferred to and from bank accounts
    in either country via a Circle account. And additionally, one can exchange cryptocurrency
    into dollars and pounds via a Circle account, which in turn enables direct transfers
    of the exchange value of cryptocurrency directly into US and UK bank accounts.
    Circle acts as the intermediary, processing transactions between legitimate bank
    accounts, as well as the new burgeoning field of cryptocurrency. Circle also recently
    received a significant amount of funding from Chinese investors, and opened a
    branch there to potentially allow similar transfers from that country. Abra is
    a similar app currently only in the Philippines that allows customers to buy and
    transfer bitcoins to anyone with a phone number.


    However, not all bitcoin remittance companies have been successful. For example,
    a remittance company called Buttercoin had to be shutdown in April 2015 due to
    lack of investment.'
