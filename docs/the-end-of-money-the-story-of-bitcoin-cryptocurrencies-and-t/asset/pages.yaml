- pgno: 128
  md: '# A short history of money


    If you ask someone about the origin of money, they might tell you a story of how
    humans once survived by bartering goods – exchanging a chicken for a bushel of
    wheat, say – until eventually they began to use gold and other precious metals
    as a common bartering commodity. Gold was universally desirable and non-perishable,
    which made it ideal as a universal bartering chip. It could be exchanged for anything,
    or stashed away for a rainy day, therefore fulfilling the first and second defining
    functions of money – it serves as a medium of exchange and a store of value.


    Barter seems like a logical antecedent to money based upon how we currently think
    money works. However, that story is a myth, promulgated as far back as Ancient
    Greece. As anthropologists like David Graeber in his book Debt: The First 5000
    Years (Melville House Publishing, 2011) have shown, there is no evidence that
    ancient cultures ever used barter exclusively. In fact, the evidence shows that
    as long as trade has existed, money has been in use. The reason for this is that
    barter only really works when you are bartering with someone you know and trust.
    For trading with strangers, an abstract quantity of value is necessary – and that
    is money.


    This was not money in the sense of coins and notes, but an abstract ledger of
    credit and debt. People kept track of who owed them what and vice versa, in precise,
    agreed upon units. Money was thus born not as a medium of exchange or a store
    of value, but as a unit of account – the third function of money, that we often
    forget in our everyday understandings of it.


    Part of the confusion, notes Graeber, is that we have found coins as much as 2,700
    years old in archaeological sites, and assume that money only started with this
    artefact. But in reality, money exists separately from any piece of currency.
    Money is'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'an abstract idea that existed as far back as the ancient civilizations of Mesopotamia,
    where writing was also pioneered.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_129_0.png)


    This Roman coin is from around 400 CE, but the first coins were made 300 years
    earlier.


    As trade networks expand, keeping track of IOUs becomes unwieldy. At that point
    it makes sense to introduce a physical currency. One of the first organized systems
    of coinage was created in 8th-century Europe by the emperor Charlemagne, and was
    based upon silver.


    But in fact, there still wasn''t much of the actual coinage in existence. What
    mattered were the units – livres, sous and deniers, the model for many later currencies
    including pounds, shillings and pence – which were standardized and used to keep
    track of the exchange of goods, swapped back and forth in ledgers, but rarely
    changing hands in actual pieces of currency.


    The practice of money in ledger form has survived to the current day, sometimes
    utilizing high technology, and sometimes low technology. The Bank of England still
    kept track of debits and credits using split sticks of willow wood known as ''tallies''
    until the mid-19th century. Today, ledgers are sometimes kept in the form of chains
    of cryptographic hashes.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/1aafdaf3d396c22bbcefa1ff58c79405_130_0.png)


    In medieval Europe, tally sticks like these were used to record debts and exchanges.


    # The problem with coins


    Emperor Charlemagne''s currency was what is called ''commodity money'', where
    the value of the coins was embodied in the metal they were made from (confusingly,
    coins minted from precious metal are called ''specie'').


    By minting a currency for his realm, Charlemagne was exercising a right that has
    been recognized since at least the 3rd century BCE, when the advisors of King
    Xuan of the Chinese kingdom of Chu encouraged him to take control of all currency
    production for better management. From that point, it has generally been understood
    that the sovereign of a region is the primary source of its currency. Even when
    minting is outsourced to private interests, they only mint under the extension
    of the authority of the sovereign.


    This authority could be profitable for the sovereign, who extracted a ''seigniorage''
    fee for minting the currency in the form of a percentage of the precious metal
    used to mint the coins. However, it created serious problems for the wider economy.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Making coinage from precious metals might sound like a simple activity, but
    in fact it is so complex that it makes blockchain technology sound almost straightforward
    by comparison.


    One well-known problem with coins made from precious metal is that they are ''lossy''.
    Simply by being handled, coins lose fractions of their weight. Unscrupulous practices
    can accelerate the losses. Shaving and clipping of coins to steal a fraction of
    their precious metal, or even shaking the coins in cloth bags to collect the dust
    that wears off, was a constant problem. Coins lost as much as 10 per cent of their
    mass, especially if the value of the precious metal was on the increase. These
    light coins would then have to be reminted at a heavy cost.


    Even worse, if the market price for the metal in a coin rose higher than its face
    value, people had an incentive to melt down the currency and sell it as metal.
    This also led to a currency shortages and required the mint to make more coins.


    A sovereign can always change the value of the coins to be more in line with the
    price of the metal, called ''crying up'' or ''crying down'' the currency. But
    this has the effect of making markets unstable.


    These problems are compounded if the currency uses both gold and silver coinage
    (called a bimetallic standard). Now there are two metal prices that must be considered
    when trying to stabilize the amount of currency in the system, and users will
    try to transfer all their money into one metal or the other, depending on the
    state of each price as compared to the coin value.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# # The era of gold standards


    Because of the intractable problems with specie currency (coins made directly
    from a precious metal), the next step in the development of money was the bullion
    standard, more commonly called the gold standard. The contemporary understanding
    of the gold standard is ‘currency backed up by gold’, but it was never as simple
    as that.


    Under the bullion standard, the sovereign does not necessarily make coins from
    a precious metal, but uses a less valuable metal or even paper. These ‘token’
    coins and notes are intrinsically worthless but are backed by a promise to exchange
    them for bullion ‘upon demand’. In other words, somebody in possession of a banknote
    or coin could in principle turn up at the sovereign’s door and demand to exchange
    it for the equivalent value of gold.


    This escaped the clipping and melting issues that dogged specie money. It also
    meant that the sovereign could issue as many banknotes or coinage as they wanted,
    as long as they could back them up with their gold reserves.


    England officially made the 1819 gold standard functional with the 1821 Coinage
    Act, which introduced token coins made from less valuable alloys. The US settled
    on a gold standard in 1879.


    Contrary to popular belief, the gold standard did not mean that every unit of
    currency in circulation was backed by gold in the vaults. Sovereigns could and
    often did issue more currency than they could back up. However, they couldn’t
    just print and mint as much money as they wanted. The money supply had to be kept
    in check, otherwise a loss of confidence in the currency could cause a run on
    the nation’s gold reserves as people rushed to convert their worthless tokens
    into gold. To avert such financial panics, the Bank of England suspended the redemption
    of currency for gold a number of times in the mid 19th century.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'While the gold standard did seem to solve the problem of specie money, creating
    currency stability, reducing inflation over the long term and creating fixed exchange
    rates between gold standard countries, it caused dramatic price instability over
    the short term. The inelastic nature of a currency secured by a nation’s gold
    reserves meant that in times of economic downturn, prices of household goods would
    sometimes drop by large percentages, and increase by similar amounts during boom
    times.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_133_0.png)


    Golden age: A gold trader at the Bank of England.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Furthermore, the government''s ability to increase its spending was limited
    by its reserves of bullion. For this reason the US suspended its promise of redemption
    during the Civil War, minting currency on debt instead.


    The same problem eventually drove much of the world off the gold standard for
    good. The First World War led to the suspension of the gold standard in much of
    Europe so that governments could produce debt-backed currency to finance their
    war efforts. The subsequent economic depression of the 1920s caused those nations
    that attempted to continue or resume the gold standard to back off again. The
    US ceased redeeming gold for currency to the public in 1933, and in 1971 stopped
    doing so to the central banks of other countries, formally bringing the gold standard
    to an end.


    Many people still hanker for the supposed certainties of the gold standard, and
    some have even suggested that cryptocurrencies might be the basis of a new one.
    Exactly how this would work is not clear, as cryptocurrencies are not backed by
    precious metal in vaults, which is the defining feature of a gold standard. For
    now, the age of gold standards is over, and something called ‘fiat currency’ reigns
    supreme.


    # Fiat currencies


    Understanding fiat currencies is important because cryptocurrencies have been
    described as ‘post-fiat’ currency.


    At first glance, fiat currencies defy common sense. Put simply, they are currencies
    that are valuable simply because the government that issues them says so. The
    notes and coins in your wallet or pocket are fiat currency, sustained by a collective
    trust in their value rather than any intrinsic worth. If you took them to the
    central bank and demanded your gold, you’d be sent packing.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The era of fiat currencies may have been ushered in by war, but they were not
    invented out of the blue. They evolved along with growing economies and their
    financial institutions.


    A primary challenge for any economy is to have enough money to do business, but
    not to have too much so that prices undergo inflation, nor too little so that
    there is deflation. The supply of available money must be in tune with demand
    for it, or else the value of money itself will fluctuate, not unlike any other
    product. Regulating the money supply in order to maintain a stable economy has
    long been recognized as the sovereign''s responsibility.


    But there are other players in the game. As private banks grew in prominence in
    15th- and 16th-century Europe, it was acknowledged that there was a benefit in
    decentralizing some control of the money supply. By issuing credit to their customers,
    banks were in effect creating money out of thin air. The money issued through
    a loan did not come from anywhere. It only existed in the bank''s assessment of
    the customer''s ability to repay the loan. By managing this risk in their balance
    sheet, and doing their business well enough that they could continue to make loans
    without becoming overwhelmed by bad debt, they were expanding the economy. Often
    this credit produced by the banks would circulate in readily usable form such
    as ''promissory notes'' – in other words, the banks issued their own currency.


    But having freewheeling currencies in circulation was just too difficult for governments
    to regulate. As good as banks were at managing risk in the good times, panics
    and economic downturns eventually brought many crashing down. In 1844, England''s
    Bank Charter Act began centralizing the creation of banknotes with the Bank of
    England. The Free Banking Era in the US, during which any bank could issue their
    own paper money, was ended in 1864 after one of many economic crashes.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# IS BITCOIN REALLY MONEY?


    But while sovereigns slowly attained a monopoly on minting, banks continued to
    magic money out of nothing by making loans. Money creation through credit was
    too useful for governments to disallow. In fact, they wanted a piece of the action,
    and so they made their own banks. The Bank of England was created in 1694 to manage
    the exchange of the nation''s currency and to handle the government''s debt. After
    several abortive attempts to create either a national bank or systems of national
    banks, the US created the Federal Reserve in 1913.


    Central banks issue debt to stabilize their fiat currencies. Bonds, the exchangeable
    notes of this debt, allow the sovereign to expand government spending without
    increasing the amount of currency in circulation. The bonds bring in currency
    when they are sold to the customer, which the government can then spend. During
    an economic downturn, banks can also buy the bonds back from the public, then
    pushing more currency out into the economy. The central bank''s ability to affect
    the amount of currency in circulation became the most important tool in ensuring
    that currency''s value.


    Contrary to popular belief, central banks work today not by printing money, but
    by what are called ''open market activities''. All other banks in the country
    are required to keep an account with a certain percentage of their holdings at
    the central bank, in order to guarantee that they are solvent. By changing the
    interest rate on those accounts, or by making short-term trades of bonds for cash
    to those accounts, the central bank is able to control the amount of currency
    the banks have at their disposal – which is the amount of money they can loan
    to customers – and which, in effect, is the amount of money in general circulation.
    In the contemporary age of money, it is not the number of physical banknotes in
    existence that defines the money supply, but the amount available'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'on banks'' ledgers with the central bank. The total amount of money, including
    these central bank balances, is many times greater than the amount of currency
    (3.35 times greater in the US, as of June 2016).


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_137_0.png)


    The days of old-fashioned banks could be numbered.


    # ## Private currencies


    Today we live in an era of fiat money where the sovereign has exclusive power
    to make currency within a nation state. However, that has not stopped people –
    including cryptocurrency designers – from attempting to flout that authority.


    Such attempts usually end up being stamped out under counterfeiting laws. US federal
    law on forgery and counterfeiting makes it illegal for anyone to make their own
    currency.The'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'maximum penalty is five years in prison. But the law hasn''t stopped people
    from trying.


    In 2007 a man named Angel Cruz attempted to launch ''The US Private Dollar'',
    and began paying employees with checks that drew on this currency. Banks promptly
    rejected them for not having correct bank codes printed on them. He claimed that
    the currency was backed by over $300 billion of its ''members'' assets but did
    not elaborate on who or what these were. After a bizarre episode in which Cruz
    and his supporters attempted to ''evict'' the staff of a Bank of America branch
    in Florida, claiming the fictitious ''The United Cities Private Court'' had authorized
    him to do so, he was indicted by the federal government with conspiracy to defraud
    the US, as well as bank fraud. However, he was not charged with any crime of forgery,
    or relating to the currency itself. Cruz fled before trial, and is still on the
    run.


    Another notorious case was perhaps closer to actually making a currency. In 2006,
    a group calling itself National Organization for the Repeal of the Federal Reserve
    Act and the Internal Revenue Code (NORFED) began issuing ''Liberty Dollars'' minted
    out of silver and gold, along with paper notes. This currency looked not unlike
    US currency, which quickly drew the ire of federal officials. The US Mint issued
    a press release warning against the currency because of what they described as
    ''confusing'' and ''misleading'' similarities to genuine US currency.


    While selling a medallion of precious metal is not a crime, the goal of NORFED
    was to have its coins widely accepted by merchants as de facto legal tender. The
    physical similarities between US currency and the Liberty Dollars, with the design''s
    intention to mislead, were the undoing of the scheme. The Secret Service and FBI
    seized the stock of Liberty Dollars, and Bernard von NotHaus, the creator of NORFED,
    was'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'convicted of violating the law against minting currency, and

    other anti-counterfeiting statutes.


    This court case played out from 2009 to 2011, and early

    bitcoin enthusiasts kept abreast of developments. Bitcoin, while

    having its own libertarian proponents that sympathized with

    the political goals of NORFED, had a few things going for it

    that Liberty Dollars did not.


    # Virtual currencies


    Another type of private currency is virtual currency,

    which consists solely of data on computer systems. For

    that reason virtual currencies are quite similar to crypto-

    currencies, and worth exploring – though there are

    important differences.


    One example of a virtual currency is Linden Dollars,

    the unit of exchange in the online virtual game Second

    Life. Linden Labs, the creator of Second Life, is the sole

    creator of that currency and is directly responsible for its

    use. The terms of service for Second Life state that Linden

    Dollars have no value outside of the game. The currency

    always remains the property of the company, and there are

    no guarantees to it or its value. In this way Linden Labs

    maintains control and responsibility, including preventing

    the use of Linden Dollars for anything illegal.


    The ''gold'' used in the massive multiplayer online game

    World of Warcraft is similar. Blizzard, the company run-

    ning the game, insist that the currency has no real value,

    and players caught trading any in-game items for real-

    world money are permanently banned. Another online

    multiplayer game, EVE Online, allows players to buy'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'in-game currency with real money, but bars it from being converted in the other
    direction.


    Some virtual currency systems have been set up outside of video game environments,
    but have invariably ended up falling afoul of the law. E-gold was a website launched
    in 1996 that allowed users to transfer a digital currency (called E-gold) between
    themselves, denominated in grams of gold or other precious metals. While the US
    Internal Revenue Service (IRS) determined that E-gold did not fall under the definition
    of currency, the service was characterized as being tailor-made for criminals,
    and was shut down by the US government in 2008. Liberty Reserve (not to be confused
    with Liberty Dollars) operated a similar service; it was shut down in 2013.


    Despite both existing only inside computer systems and using cryptography to secure
    their transactions, there are some crucial differences between virtual currencies
    and cryptocurrencies.


    The main one is that virtual currencies do not use a blockchain ledger or any
    form of proof-of-work. Without a blockchain, virtual currencies must be produced
    and managed by a single business or institution. There is no authority responsible
    for cryptocurrencies’ use, and no one to enforce rules other than those provided
    for in the cryptocurrency programming. There are no Terms of Service other than
    the open-source licence of the software. They are also much more difficult to
    ban: thanks largely to activists such as the Electronic Frontier Foundation, software
    publishing is protected as free speech by the First Amendment. The only way to
    ‘ban’ a cryptocurrency would be to remove every instance of the software from
    the network.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# So what is cryptocurrency, legally?


    From our exploration of the nature and history of money, it seems clear that cryptocurrency
    does not conform exactly to any past or current definition of money. Exactly what
    it is, though, still remains up in the air, as judgments by government authorities
    have shown.


    Various regulatory agencies of governments around the world have been evolving
    in their treatment of cryptocurrency, and are continuing to do so. This evolution
    shows a slowly growing acceptance; however, there is nervousness about making
    sure that cryptocurrency has the appropriate status – either as currency, commodity,
    or property.


    In the US, the evolution began in the courts. In August 2013, a US federal judge
    wrote: ‘Bitcoin can be used as money,’ in deciding that a Securities and Exchange
    Commission (SEC) suit against Bitcoin Savings & Trust, a Bitcoin-based Ponzi scheme,
    could proceed. The SEC did not claim that bitcoin was money but it charged that,
    regardless of what bitcoin was, Bitcoin Savings & Trust had been selling fraudulent
    securities and was therefore breaking the law.


    Not a week later, the New York State Department of Financial Services issued subpoenas
    to 22 companies working with bitcoin in an effort to learn exactly how these companies
    ran their businesses. The primary concern of the authorities was how to prevent
    the use of cryptocurrencies in money laundering, either for illicit purchases
    such as those on the dark web marketplace Silk Road, or for money transfers related
    to terrorism. Some of these investigations led to fines, or changes in the way
    that these companies managed their customers.


    But despite the unsavoury reputation that cryptocurrencies earned in 2013 and
    2014 due to the court cases against Silk Road, BitInstant, and Mt. Gox, it appears
    that US government officials'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'were not opposed to cryptocurrencies as an idea. Although the FBI had produced
    an intelligence assessment in 2012 entitled, ‘Bitcoin Virtual Currency: Unique
    Features Present Distinct Challenges for Deterring Illicit Activity’, when the
    FBI arrested Silk Road’s founder Ross Ulbricht in October 2013, the criminal complaint
    explicitly set the nature of cryptocurrencies aside from the crime itself, noting
    that they had legitimate uses. A month later, the Senate held hearings on cryptocurrencies.
    The findings were positive, stating that cryptocurrencies may have ‘profound and
    exciting implications’ for the future of finance.


    In 2014, the IRS added some clarity by issuing an official notice on the legal
    status of cryptocurrencies. The tax agency came to the conclusion that cryptocurrencies
    were not, in fact, currencies, but ‘property’. The selling of cryptocurrencies
    would be taxed like the sale of any other property — like company stock, for example.
    This neatly sidestepped the awkward issue of deciding how a decentralized cryptocurrency
    might fit into the government’s monetary policy, and instead classified it as
    a strange, digital financial instrument.


    For the time being, that settled the issue in the US. Cryptocurrencies are legal;
    not only that, they can be taxed. They are not legal tender, but can be ‘used
    as money’.


    However, other countries came to different conclusions. In September 2014, the
    UK’s HM Revenue and Customs (HMRC) specified that for corporate tax, bitcoin is
    to be considered a currency. Therefore, they argued, no special rules are necessary,
    and any profits or losses based on currency exchange are taxed as normal. This
    applies for standard income tax, as well as capital gains tax. HMRC put off the
    question of collecting VAT (sales tax) for purchases of bitcoin, deferring to
    the decisions of the EU, but did note that for purchases of goods made with bitcoin,
    VAT should be collected in the equivalent value of Pounds Sterling, as normal.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'In October 2015, the European Court of Justice upheld this reasoning, and declared
    that purchases of bitcoin on exchanges are tax-free, because it is similar in
    nature to ''currency, bank-notes and coins used as legal tender''. This philosophy
    is wholly different from the perspective of authorities in the US.


    In other countries things are different yet again. Argentina, Bangladesh, Bolivia,
    Ecuador, Indonesia, Thailand and Vietnam have all made some aspect of cryptocurrencies
    illegal. In China, bitcoin is hugely popular, but authorities banned financial
    institutions from transmitting funds to business involving bitcoin. This doesn''t
    ban cryptocurrencies, themselves, but does make their use more difficult.


    It is only to be expected that laws and official guidance on cryptocurrencies
    will continue to evolve as the technology does. There are no laws yet about the
    legality of ''smart contracts'' or other novel blockchain technologies that have
    been proposed and developed by companies such as Ethereum (see ''Smart contracts''
    and ''The age of Ethereum'', Chapter 12). What new, future offspring will branch
    off from the blockchain, no one – least of all the lawmakers – can predict.


    # Okay, so are cryptocurrencies money or not?


    In the sense that cryptocurrencies are an abstract unit that can be used as a
    token of exchange by anyone with a computer, they are, by most definitions, money.


    However, they do not coherent to the modern, global economic definition of the
    function of currency. They are not under the mandate of any sovereign government.
    There is no way for any entity to control them using monetary policy. With a hard
    limit on most cryptocurrencies'' total supply, they are deflationary by design.
    While that is good if one holds a large amount of deflationary currency as an
    investment, from an economic perspective it is less'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'than ideal because it tends to discourage spending and investment in new business
    ventures. One of a currency’s main functions is as a medium of exchange, not just
    to sit in a bank vault.


    As a throwback to an archaic system of bullion (or gold) standards, cryptocurrencies
    still fail as money. They are not backed by precious metal holdings, and they
    are not a precious commodity against which a currency can be issued. Nor are they
    specie, as they are not minted by a sovereign authority withdrawing a fee in order
    to manage the production of a money supply.


    Even in the most basic banking functionalities, they fail to be money. There is
    no way to issue a loan in cryptocurrency kept on a bank’s books, without actually
    transferring cryptocurrency. The creation of money through credit, the lynchpin
    of financial technology since the Renaissance period, is impossible.


    On the plus side, cryptocurrencies take one aspect of money’s existence – the
    idea of an abstract unit tallied in a ledger – and make it a concrete reality.
    However, the blockchain is, in a sense, too exacting a ledger. The exact number
    of cryptocurrency units in existence is the only cryptocurrency that can be used.
    Money has never worked like that. Between abstract money and concrete currency
    is the slippery area where credit can be created, markets expanded, and the elasticity
    of monetary policy can back up the global economy.


    It is far better to think of cryptocurrency as a new sort of financial instrument.
    Exact­ing in its accounting, digitally concrete via cryptography, it can be moved
    and traded as a digital store of value, used in lieu of money in certain circumstances,
    but never likely to displace money as the foundational measure of a wide, diverse
    economy.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# A brief history of money


    4000 BCE

    Correspondence counters are used in Mesopotamia to tally equivalent quantities
    and values of particular commodities.


    6th century BCE

    Awards in Ancient Greek athletic competitions were measured in units of currency.


    16th century CE

    Private debt and credit markets become standard throughout European marketplaces.


    14th century CE

    Cheques are commonly used in southern Europe.


    1694

    The Bank of England is chartered, to manage the debt of the government.


    1717

    Isaac Newton creates UK''s de facto gold standard by forcing all silver currency
    out of existence.


    1921

    Fox, Fowler, and Co., the last private bank in England still permitted to issue
    its own banknotes, ceases to mint currency.


    1914

    The outbreak of the First World War causes UK and many other European countries
    to vacate the gold standard.


    1925–31

    UK briefly adopts a gold exchange standard, only to cease as massive amounts of
    gold depart the country.


    1933

    President Franklin Roosevelt nationalizes gold within the US, and ceases making
