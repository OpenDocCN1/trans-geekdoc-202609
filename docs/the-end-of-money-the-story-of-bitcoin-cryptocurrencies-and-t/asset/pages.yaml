  md: '# Six cryptocurrency facts


    +   1 Digicash. This was the first usable virtual currency, founded in 1990. It
    ceased to exist just eight years later, when the company that created it folded.


    +   2 From spam to money. In 1997, cryptographer Adam Back came up with an idea
    for reducing spam email called ‘hashcash’, a computing system that set hard limits
    on the number of emails that could be sent over a set period of time. He emailed
    the idea as a whitepaper to the Cypherpunks mailing list, but it was never implemented
    on a large scale. Bitcoin uses aspects of Back’s hashcash concept.


    +   3 First bitcoin owner. US computer scientist Hal Finney was the recipient
    of the first bitcoin transfer. He received ten coins from Nakamoto in early 2009,
    back when they were essentially worthless. There were also suspicions that Finney
    might actually be the enigmatic bitcoin founder himself.


    +   4 Power hungry. Since 2011, the bitcoin network has harnessed so much processing
    power that it is thought to be more powerful than the top 500 supercomputers in
    the world combined. This means that, theoretically, even if the top 500 supercomputers
    were used at the same time to try and alter the bitcoin blockchain network, they
    could not do it.


    +   5 Dunning-Krugerrands. William Gibson, author of cyberpunk novel Neuromancer,
    jokingly referred to bitcoin as ‘Dunning-Krugerrands’. He derived the term from
    Krugerrands, a South African gold coin, and the'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Dunning-Kruger Effect, a cognitive bias in which amateurs have an inflated
    sense of their own abilities.


    6 Bitcoin taxes. Zug in Switzerland has become the first city in the world to
    accept the cryptocurrency bitcoin for government services. The pilot scheme, which
    started on 1 July 2016, will allow citizens to use bitcoin to pay taxes, fines
    and fees – as long as the amount is less than 200 Swiss francs ($205).'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Seven real-world locations related to cryptocurrencies


    +   1 Tokyo, Japan. Home of Mt. Gox, the now defunct bitcoin exchange.


    +   2 Keflavik, Iceland. Home of the servers of Silk Road, the online dark net
    marketplace.


    +   3 Beijing, China. Home of OKCoin, one of the largest bitcoin exchanges by
    volume.


    +   4 Hong Kong. Home of Bitfinex, one of the largest USD/bitcoin exchanges by
    volume.


    +   5 Baar, Switzerland. Home of Ethereum, the public blockchain-based computing
    platform.


    +   6 New York State. Home of the BitLicense, the first financial licence specifically
    for cryptocurrency companies.


    +   7 Arnhem, The Netherlands. One of the most ‘bitcoin friendly cities’, in 2016
    the municipality claimed it had over 100 merchants accepting bitcoin directly
    for goods and services.'
