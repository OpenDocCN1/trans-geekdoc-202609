- pgno: 150
  md: '# The man who would not be Nakamoto


    The 6 March 2014 edition of Newsweek contained what seemed like a major scoop.
    Journalist Leah McGrath Goodman had done the impossible: she had discovered the
    true identity of Satoshi Nakamoto. And not only that, there was an incredible
    twist: the man’s name was actually Satoshi Nakamoto!


    At least officially, his name was Satoshi Nakamoto. The 64-year old physicist
    went by Dorian Nakamoto. He had a career perhaps not untypical for someone living
    in the Inland Empire metropolis of Southern California – working for a number
    of aerospace and other high tech firms, including a brief stint working on classified
    electronics systems for a government contractor, and for the US Federal Aviation
    Administration.


    Perhaps it was this technical background that inspired Goodman to trek to California
    to meet this particular Nakamoto. And there, in the presence of two police officers
    that Nakamoto had called when she knocked on his door, he uttered the sentences
    that caused a media circus to spring up around him:


    > ‘I am no longer involved in that and I cannot discuss it,’ he says, dismissing
    all further queries with a swat of his left hand. ‘It’s been turned over to other
    people. They are in charge of it now. I no longer have any connection.’


    Taking this quote, Goodman went to interview a number of Nakamoto’s relatives,
    who did not confirm or deny the claim, but provided additional quotes to the support
    the theory that he was smart, secretive, and leaned towards the libertarian side
    of politics.


    The next day, swarms of reporters arrived at Nakamoto’s house. After telling them
    that he would speak with the first reporter that bought him lunch, he hopped into
    the car of an Associated Press reporter. Several other reporters gave chase, tailing
    them to a nearby restaurant. Meanwhile, the local sheriff'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'attempted to maintain order outside the Nakamoto home, as the horde of the
    press maintained vigil.


    But it was all for nothing. Dorian Nakamoto denied that he was Satoshi. He claimed
    that his statement, the best proof that he had something to do with bitcoin, was
    a misunderstanding. He had thought Goodman was talking about his classified work
    for the government. This was also the reason for his unease when she showed up
    at his door – he knew he was unable to talk about that work, and did not want
    to be harassed by journalists. A week later, Nakamoto began taking donations for
    a threatened lawsuit against Newsweek. The magazine published a statement written
    by him at the end of their original article, in which he denied that he had anything
    to do with bitcoin. And perhaps the most substantial stroke came the day after
    the article was released – the P2P Foundation user account used by the real Satoshi
    Nakamoto, one of the sources of the original bitcoin whitepaper, came back to
    life after years of silence. ‘I am not Dorian Nakamoto’, the account posted simply.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_151_0.png)


    Dorian Nakamoto vehemently denied having anything to do with bitcoin.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Eventually, the circus died down, until the next candidate for the real identity
    of Satoshi Nakamoto would be proposed. It was an honest mistake, perhaps. Given
    the curiosity over the mysterious pseudonym, it was maybe only a matter of time
    until a completely uninvolved individual ended up mistakenly in the media’s crossfire.
    And so, the mystery only deepens.


    # The real Satoshi Nakamoto?


    In December 2015, the publications Wired and Gizmodo announced a major story –
    they had received a tip about the real identity of Satoshi Nakamoto. Those who
    kept up with the never ending saga mostly shrugged. After the controversies surrounding
    many of the other supposed unmaskings of the creator of bitcoin, including the
    infamous car chase of reporters tailing an unrelated man named Dorian Nakamoto
    around Los Angeles suburbs, the public was perhaps a bit jaded.


    While previous ‘unmaskings’ of Nakamoto’s identity have mostly been educated guesses
    with no real evidence, Wired and Gizmodo had some evidence – of a kind. A tipster
    had delivered pages of emails allegedly written by an Australian named Craig Wright.
    The emails discussed creating the cryptocurrency in some detail with a colleague
    named David Kleiman, who had died two years previously. Wright was relatively
    unknown within the cryptocurrency community, though he had recently been in trouble
    with the Australian Tax Office. Wright did not publicly respond to the suggestion
    that he was Nakamoto, other than with a brief denial.


    Six months later in May 2016, the trail grew hot again. Wright now publicly claimed
    to be Satoshi Nakamoto and said he could prove it. Never before had someone both
    been'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'accused of being Nakamoto, and also claimed it was true. The next month, journalist
    Andrew O''Hagan wrote a long article in the London Review of Books giving the
    inside story and clearing up some of the hazy details. Though certainly not all.


    According to O''Hagan, in late 2015 he had received a call from an entertainment
    lawyer asking him if he wanted to write the life story of the creator of bitcoin.
    It seemed that Wright was planning on coming forward in parallel with applying
    for a host of blockchain-related patents under a company called nTrust. Wright
    would be revealed as the creator of cryptocurrency, the patents would be approved,
    nTrust would license the patents, and Wright and nTrust would be rich – helping
    Wright out of his financial and business difficulties. O''Hagan agreed to document
    the events, but only as a journalist, not as a hired writer.


    Over the next six months O''Hagan had many conversations with Wright. Through
    his London Review of Books piece, O''Hagan paints a portrait of a man whose life
    is certainly entwined with bitcoin. Wright is proficient on the details of the
    cryptocurrency. He described a collaboration with his friend David Kleiman that
    mirrored the history of bitcoin exactly. And his somewhat paranoid personality
    and description of potentially shady business dealings with the world of offshore
    finance lent credence to his drastic attempts to maintain his anonymity.


    But there were pieces missing. Wright''s stories often seemed circular, fraught
    with passion and uncertainty. Emails important to his rendition of the story that
    he claimed to have were never shown.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'O''Hagan was left confused. Was Wright confused himself after spending so many
    years clinging to anonymity? Or was perhaps the whole thing was some sort of incredibly
    elaborate ruse?


    The story climaxed in May, 2016, when Wright gathered journalists and experts
    to inspect a blog post he had written, which claimed to present proof that he
    was Nakamoto. For years, it was known exactly what this proof should look like.
    Only the true creator of bitcoin would have the secret key that signed the so-called
    ‘genesis block’ – the very first block in the chain.


    But again, there were pieces missing. In the blog post, Wright used what he claimed
    was Nakamoto''s secret key to sign a message. Upon further inspection, it was
    clear that Wright had actually just used a public hash of Nakamoto''s, which anyone
    might have found on the internet. Although he claimed it was a mistake, Wright
    never fixed it.


    Many cryptographic experts and bitcoin aficionados began to doubt Wright''s claims.
    In response, Wright offered to do something equally impressive – he would move
    some of the bitcoins mined during the very early days of the cryptocurrency. It
    has never been transferred, and it is widely believed to belong to whomever is
    Satoshi Nakamoto. These bitcoins are held in a trust until 2020, according to
    Wright, but he would get special permission to move them for the purposes of the
    demonstration. He never did this, either.


    The media circus departed, again finding nothing but disappointment where they
    expected Nakamoto. But O''Hagan was left wondering, why? Why would Wright set
    up such an elaborate scam – faking emails, creating stories of relationships and
    work that never happened – only to trap himself against'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'something he knew he could not deliver? Wright claimed to O''Hagan that he
    had lost his nerve. He said he was afraid that if he proved he was Nakamoto, he
    would be arrested for drug trafficking or terrorism charges due to something someone
    had done with the cryptocurrency after he invented it. O''Hagan described this
    fear as certainly a real risk, but still, it is just one more riddle in a maze
    of riddles.


    According to most cryptocurrency followers, the mystery of Satoshi Nakamoto is
    still unsolved.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Revamping bitcoin – and the rise of altcoins


    > Bitcoin could be in trouble. It can’t keep up with the number of transactions.
    Will any of the proposed solutions be successful, or will one of the growing number
    of alternative cryptocurrencies take over?'
  merge: -1
