- pgno: 126
  md: '# Is bitcoin really money?


    Bitcoin and other cryptocurrencies certainly have the word ‘currency’ in their
    name, but are they really money? Different countries have taken different stances
    on the question, giving it a variety of legal statuses. But this leads us to a
    larger question: what exactly is money, anyhow?'
