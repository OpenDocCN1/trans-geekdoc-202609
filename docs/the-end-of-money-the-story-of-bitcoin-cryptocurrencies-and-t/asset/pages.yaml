- pgno: 114
  md: 'Ali, the shop assistant, whips out a cell phone and texts me the string of
    numbers and letters that serves as the shop’s bitcoin address. After I transfer
    6.017 bitcoins, he calls his boss to check the payment came through. Other customers
    catch my eye, disconcerted by this odd transaction. It was simpler at Bear and
    Birch, where I just scanned a barcode.


    For now, there are surprisingly few outlets that accept bitcoin in NYC, considering
    the attention it has had in the past year. A dog-walking business called Puppy
    Paws in Brooklyn takes it, as does a pizza joint closer to the river called Lean
    Crust and a bar called EVR. A handful of legal offices, dentists and estate agents
    accept it. Throughout my trip, though, the question “Do you take bitcoin?” is
    generally met with puzzled looks.


    Later, I head to the new bitcoin center in the heart of Wall Street, sandwiched
    between the towers of traditional finance. Aficionados run their own bitcoin trading
    floor, named Satoshi Square after the currency’s mysterious creator. On the evening
    that I visit, the topic for discussion is Ethereum, a new platform for virtual
    currencies.


    Those on the cutting edge need no convincing – for them, the revolution is here.
    But when you can’t do much more than buy pizza in New York City, you know bitcoin
    still has a long way to go.


    # From dollars to bitcoin via Japan


    In the early days of bitcoin, one of the most readily apparent business models
    enabled by the cryptocurrency was the exchange. Before Mt. Gox, the only way to
    acquire bitcoins, other than mining them, was by purchasing them from another
    user on an ad hoc basis. Mt. Gox created the first currency exchange.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'allowing users to buy bitcoins in a market for yen or dollars. From the small
    commission that Mt. Gox charged, the service was at times earning as much as $900,000
    in a single day.

    However, Mt. Gox had its weaknesses. In order to get dollars into the Mt. Gox
    system, it was necessary to wire money to the exchange’s Japanese bank – no small
    feat for the average consumer.

    Other exchanges and startups attempted to make this easier. BitInstant, founded
    in 2011 by US entrepreneurs Gareth Nelson and Charlie Shrem, was one of the first
    services to allow customers to buy bitcoins on a much more ‘retail’ basis. The
    company would handle all of the wire transfers with Mt. Gox, and the customers
    were simply charged the money and sent the bitcoins. However, first the popular
    service became so slow that a class action lawsuit was filed in 2013. Then, to
    seal the company’s fate, Shrem was arrested in 2014 and charged with money laundering,
    for his part in a scheme to sell bitcoins to users of Silk Road. BitInstant shutdown.


    # How stable are cryptocurrencies?


    There are a number of criticisms of cryptocurrencies. Although there are cryptocurrency
    exchanges, without any of the traditional hedges of conventional asset or exchange
    markets, the prices of the currencies on these exchanges are vulnerable to manipulation
    and wild swings. Typically, conventional asset markets have ways to ‘bet against’
    a price increase or insure against a price drop. This also helps equalize market
    forces that would otherwise create investment bubbles. Although these sorts of
    derivative assets do exist for cryptocurrency markets, they are nowhere near as
    widely used as in traditional markets, and thus their ability to help support
    market stability is unknown.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'In the world of finance, size seems to matter. While the markets for cryptocurrencies
    are large, they are nowhere near as big as conventional markets. Bitcoin’s market
    capacity of over $9 billion pales by comparison to the New York Stock Exchange’s
    $19 trillion or so. A larger market has more trading, which also helps promote
    stability.


    Still, bitcoin has significant value. Could it offer a significant form of commodity
    trading much like gold? For now, bitcoin’s value simply fluctuates too much. Its
    volatility may stem from bad press, or exchange problems in the past (see ‘The
    fall of the exchange’, Chapter 7), yet even in the most stable periods, cryptocurrencies
    tend to take sharp dives and jumps in value. As valuable as cryptocurrencies are,
    they remain more risky than many stocks, and that makes it difficult to convince
    mainstream investors to ditch conventional markets and put their cash in cryptocurrencies.


    Coinlab was another company with a similar business model to BitInstant founded
    in 2013. The biggest headlines it generated came in 2013 when it formed a partnership
    with Mt. Gox to process money transfers exclusively in North America, gaining
    a huge amount of business for Coinlab and potentially opening up the exchange
    to more customers in the US and Canada. However, only months later Coinlab sued
    Mt. Gox for breach of contract, claiming the exchange had violated the exclusive
    right of Coinlab to service Mt. Gox customers in North America when it refused
    to deliver the customers to Coinlab. It was later revealed that the lawsuit was
    an attempt to get Mt. Gox to deliver necessary information that Coinlab needed
    in order to process'
