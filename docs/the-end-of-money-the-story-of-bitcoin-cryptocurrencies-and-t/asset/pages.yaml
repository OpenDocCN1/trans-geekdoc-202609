    is accepted.


    Coinbase started as an exchange service, but expanded to retail-oriented payment
    processing. It''s also been partnering with Paypal, allowing users to transfer
    funds exchanged from cryptocurrencies in Coinbase out to a Paypal account.


    It''s no surprise that Paypal''s name keeps coming up. The company handles over
    $228 billion a year in online transactions, and is considered the primary company
    for most online money handling in the US. They clearly want to maintain this position,
    and can afford to take the risks in experimenting with cryptocurrencies, in order
    to ensure they are not left behind if some method pans out. Although they have
    primarily invested in other companies and partnered with them for particular service
