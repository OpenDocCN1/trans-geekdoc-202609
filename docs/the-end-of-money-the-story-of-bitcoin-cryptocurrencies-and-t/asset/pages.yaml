  img_proc: true
- pgno: 103
  md: '![](img/1aafdaf3d396c22bbcefa1ff58c79405_103_0.png)


    Many people lost money with the fall of Mt. Gox.


    # Scammers and malware


    As well as the high-profile troubles that faced bitcoin, involving the FBI and
    other federal investigators, there were a slew of minor scams and hacks. Perhaps
    the very first cryptocurrency Ponzi scheme occurred in 2011, known by the name
    of Bitcoin Savings & Trust. Like many such scams, it promised returns on investment
    just too good to be true. After taking in 500,000 bitcoins, the site disappeared
    in 2012. A group of hackers and others from the bitcoin community discovered the
    operator’s true name and location later that year. That man, Trendon Shavers,
    was arrested in 2013, and pleaded guilty to securities fraud in 2015.


    Also in 2011, reports of bitcoin-specific malware first appeared. A program called
    a ‘trojan’ (after the mythical Trojan Horse) was discovered in June 2011, that
    searched'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'users'' computers for their secret bitcoin wallet.dat file. After copying and
    sending the file to the malware authors, they would be able to steal all the bitcoins
    that user held. That same year, it was reported that a botnet – a large network
    of compromised computers under the control of hackers – was being put to work
    mining bitcoins. While the CPUs of the seized computers were not very efficient
    on their own, if they numbered in the thousands and were connected like a mining
    pool, it could be quite profitable. Increases in difficulty and the rise of ASICs
    for mining has made this potential exploit much less likely today.


    However, in March 2014, Mt. Gox announced that it had ''found'' 200,000 bitcoins
    in an old wallet. It was an embarrassing, if welcome admission, but it also made
    many suspicious. Later that month, two Swiss researchers, Christian Decker and
    Roger Wattenhofer, who had been studying the transaction malleability problem
    before the announcement of the Mt. Gox fiasco, came forward to say that they had
    data to show that there was no way that Mt. Gox could have lost as much as they
    claimed via the flaw. They claimed that, before Mt. Gox froze all account withdrawals
    in early February, only 386 bitcoins had even been stolen using malleability attacks.


    Debate still continues about what really happened at Mt. Gox, but regardless of
    the real reason for the loss, there was no way that Mt. Gox could refund their
    customers'' funds. On 28 February 2014, Mt. Gox filed for bankruptcy in Japan,
    and on 10 March the company filed for bankruptcy in the US. In April 2014, the
    US Department of Treasury issued a subpoena to Karpeles to question him about
    the bankruptcy case, for which he declined to appear. On 11 September 2015,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'the Japanese government arrested him in Japan, charging him with embezzlement
    in the wake of the bankruptcy.


    An interesting coda to the story is that in May 2016, a different exchange called
    Kraken, which was helping with the bankruptcy analysis of Mt. Gox, reported that
    it would be releasing the approximately 200,000 ''found'' bitcoins back to the
    former customers of the closed exchange, based on their resolution of more than
    24,000 claims submitted. No further information was released about their investigations.
    It appears that the ignominious saga of Mt. Gox is ongoing.


    Other cryptocurrency exchanges were also hit by hackers, who broke into computer
    systems to steal backup files, or simply called up an exchange’s hosting company
    pretending to be the owner and demanding that the administrator password be reset.
    Other online wallet companies simply vanished, taking their customers’ bitcoins
    with them. It is also important to put the problems that beset Mt. Gox in a wider
    context of the internet itself. Internet security is a tough business. An estimated
    $80 billion is now spent on cybersecurity every year. Despite this, around 64
    million Americans had their personal data breached just in the last year, according
    to a 2016 RAND Corporation report.


    # Encryption kidnappers


    Another problem to beset cryptocurrency is ransomware – malicious software that
    blocks access to a computer system until a sum of money is paid. Although ransomware
    attacks were first seen in 1989, in 2013 a new generation of ransomware became
    widespread, utilizing public-key encryption and bitcoin. The first such program,
    called CryptoLocker, would encrypt the entire infected computer’s data, and then
    present a pop-up window with'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'a ransom message. The computer user would be told to send a specific amount
    of bitcoin to a particular address by a deadline. The amount of bitcoin was relatively
    low, typically around $400-worth. If the ransom was paid, the user would be given
    a key to decrypt their data. If not, it would remain encrypted forever. Authorities
    shut down CryptoLocker’s controlling botnet in June 2014, but it is estimated
    that the ransomware netted as much as $27 million. A wave of copycat ransomwares
    followed. The attacks became so widespread, that certain versions had online help
    websites, providing information for the uninitiated on how to buy bitcoins to
    pay their ransoms, and how to decrypt their files once they had paid. 2016 proved
    to be a banner year for ransomware, netting more than $209 million in the first
    three months alone, according to an FBI report.


    Perhaps a key reason for the increase is that ransomware designers are searching
    out specific targets with larger budgets. CryptoLocker spread at random, and the
    low ransom was clearly designed for everyday home and office computers. However,
    2016 has seen a number of hospitals targeted directly by customized ransomware,
    designed to hold medical records and crucial prescription information hostage.
    Hollywood Hospital in California was targeted by ransomware in February 2016,
    and hospital officials reportedly paid $17,000 to get crucial records decrypted.


    The story of Mt. Gox gave cryptocurrencies bad press, and could have been their
    undoing. Instead, other exchanges picked up after Mt. Gox closed down. Relative
    to the market com-motions of late 2013 and 2014, when the price of a bitcoin'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'oscillated between a low of $150 and a high of $1200, 2015 was a calm year
    in trading, with steady volume and prices between $200 and $300. 2016 has seen
    a new increase in prices, topping over $600 by July (see Figure 1.2, Chapter 1).


    Perhaps the greatest testament to cryptocurrencies'' longevity is that they managed
    to weather this storm, and come out the other side with businesses, consumers,
    and the government still interested in what cryptocurrencies hold for the future.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 8

    Bitcoin comes of age


    From underground beginnings, the world’s most famous cryptocurrency is going mainstream.
    Bitcoin banking is here, and cryptocurrency technology is being included in the
    longer term strategies of financial institutions and governments. So why is its
    use in daily life still limited?'
  merge: -1
  img_proc: true
- pgno: 109
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Cryptocurrency technology is becoming part of the medium-term strategy of global
    financial institutions, including banks, investment houses, and even the economic
    plans of national governments. Investors are putting money directly into cryptocurrencies,
    as well as attempting to leverage them in new types of cryptocurrency-linked services
    offered by otherwise traditional companies and banks. Despite the false starts
    represented by Silk Road and Mt. Gox, there are many people who believe that these
    technologies could fundamentally change the way we use money – and do it legally.


    But cryptocurrencies themselves are only the beginning of a brave new world of
    digital financial technologies. The blockchain is moving away from being simply
    the technological backbone for a currency, and beginning to support the mechanisms
    of banks themselves, including property transactions, various electronic transfer
    services, and, maybe one day, entire corporations.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_110_0.png)


    Bitcoin ATMs are still a rare sight.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Today, the ground-floor of a completely new sort of financial technology is
    being built. Your first encounter with a cryptocurrency might be in the lobby
    of your local bank, across the counter of a neighbourhood coffee shop, in the
    back of a cab, or within the digital deeds of your new house. And you might not
    even notice.


    # What can you buy?


    One of the most common criticisms of cryptocurrencies is that they will never
    replace traditional currencies because they are useless as an everyday means of
    payment (see box ‘A day of bitcoin’, below). This was certainly true back in the
    days when the most common market for cryptocurrencies was an illegal drugs website
    on the dark web. But what about today? The use of cryptocurrency has expanded
    into the realm of legitimate business, but is it enough to allow cryptocurrency
    to replace the daily use of pounds, dollars, euros, and yuan?


    When companies first began experimenting with accepting cryptocurrencies for products
    and services, they largely had to invent their own integration with the cryptocurrency
    on the fly. Today, many companies are offering different forms of cryptocurrency
    integration as a service, expanding the options and offering easy access for companies.
    However, there are many different ways to go about integrating cryptocurrency
    with a business, and no standard method has yet emerged. Confusion continues about
    what the best way to use cryptocurrency is, from the standpoint of both businesses
    and consumers.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# A day of bitcoin


    In February 2014, New Scientist reporter Hal Hodson attempted to use no money
    other than bitcoin. What did he find?


    A third-degree Facebook friend, Michael Giouvino, agrees to sell me $150 of bitcoins
    to make the journey to New York. I tell him that I plan to use it to drive there,
    stop at a New Jersey bathhouse on the way, and then head into the city to buy
    some groceries to stock up my girlfriend''s apartment. Giouvino, who has held
    about 600 bitcoins since 2012, chuckles. ''How do you plan to do that?''


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_112_0.png)


    One way to spend cryptocurrency.


    Ah, I see. Fuel is the biggest hitch in a bitcoin roadtrip. Only two gas stations
    in the US accept it – one in Colorado and one in New Hampshire. Neither is on
    my route. Instead, I try an elaborate workaround involving electronic gift cards
    and Walmart. It fails. If I''d planned the trip further'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'in advance, I could have bought a preloaded gas card using bitcoins through
    a website called Coinfueled. Never mind. Halfway through my journey, I at least
    find fuel for myself. I fill up on a large burger and fries at TGI Friday''s,
    paid for with a gift card bought with bitcoins via a third-party site.


    Deep in the suburbs of New Jersey, just around the corner from a tax office, is
    a Russian bathhouse – a banya. Bear and Birch is run by ex-Goldman Sachs equities
    trader Peter Kizenko. Inside, you don a bathing suit and join a handful of gruff
    Russians to brave the searing heat. There''s a bundle of birch twigs with a duct-taped
    handle that you can soak in icy water and thrash yourself with. All for just 0.03
    bitcoins.


    “It''s the easiest thing ever to start accepting it,” says Kizenko, reclining
    on the veranda of the bathhouse. He started the bathhouse two years ago, after
    leaving his job with Goldman Sachs in Moscow and finding he missed his homeland''s
    banya. The IRS office might be just around the corner but it is still unclear
    how bitcoin should be taxed. Kizenko isn''t worried, not least because it is too
    small a part of his revenue and he says the public blockchain, which records every
    transaction, will make compliance a doddle.


    But while accepting the currency is easy, doing anything else with it, like converting
    it into dollars, is less so, Kizenko says. Several exchanges have been shut down
    by the authorities recently, making it too risky to base a business on it.


    After the bathhouse, I head for Brooklyn''s Greene Ave Market. It''s a 24-hour
    organic grocery store offering 10 per cent off for those paying with bitcoins,
    one of just a handful of places in New York that accepts the currency for physical
    goods.'
