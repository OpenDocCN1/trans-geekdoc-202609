- pgno: 64
  md: '# # Mining gold the digital way


    How do you generate your own cryptocurrency? What kind of equipment works best?
    And can lone miners ever really strike it rich?'
  merge: -1
  img_proc: true
- pgno: 65
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 66
  md: '# The world of currency mining


    The process of generating cryptocurrency is called ‘mining’. But if you imagine
    this involves pick axes, precious metals or underground tunnels, think again.
    The only tools you need for this form of mining are a powerful computer, some
    specialized software and a fast connection to the internet.


    As described in the previous chapter, the heart of all proof-of-work cryptocurrencies
    is a digital ledger called a blockchain. Computers on a cryptocurrency’s network
    continually compete in a race to update this blockchain. It involves a process
    of brute-force trial and error in which computers simply take guesses at the cryptographic
    signature, or ‘hash’, which combines the record of the most recent currency transactions
    along with the proof-of-work solution and the signature for the previous blocks.
    When the correct one is found, the new block is added to the blockchain, and the
    race to find the next hash starts over again.


    Suitably equipped, anyone can join this race. But why would you use valuable processing
    power to take part? This is where the mining analogy arises: the first to solve
    the block is rewarded with new coins – a gold strike!


    The amount of this reward varies between cryptocurrencies, as does the estimated
    time to solve each block (see box ‘What are the rewards?’, below). Whether or
    not this is the best model is still a subject for debate. Other cryptocurrencies
    have tested different approaches, and all kinds of schemes have been tried. For
    instance, litecoin, created in 2011, experimented by increasing the total number
    of coins to 84 million, and decreasing the block time to 2½ minutes. Dogecoin
    set its block time to only one minute, and added a wrinkle: it began by awarding
    a random number of coins for each new block, with the number varying between zero
    to one million. It has since stabilized this'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'reward. Another cryptocurrency called 42coin was based on the idea that there
    would never be more than a total of 42 coins in circulation, meaning that hyperdeflation
    was designed into the algorithm. However 42coin, like many others, is now defunct.


    # What are the rewards?


    In bitcoin''s early days, it gave out 50 coins per block, with a target block-calculation
    time of 10 minutes. After 210,000 blocks had been completed, the reward was automatically
    cut in half to 25 coins, and after each new 210,000 blocks are solved, the reward
    is halved again. Eventually, after 6,930,000 blocks have been solved and 21 million
    bitcoins have been distributed, there will be no more block rewards. It is difficult
    to predict the time when this will happen, because of slight variances in the
    time to solve each block. But on July 9, 2016, the third ''halving'' occurred,
    dropping the bitcoin reward down to 12% per block. This occurred on block number
    420,000 – only 6.06% of the way to the final end point. As the decrease of reward
    reduces exponentially, the reward will slow to a trickle, and then stop. At this
    point, it is hoped that small transfer fees – of, say, a millionth of a bitcoin
    deducted from each transaction – will become the block rewards. In other words,
    this system sets up planned deflation. As the supply of bitcoin approaches the
    final, fixed amount, each bitcoin will theoretically become more and more valuable
    so the worth of small transaction fees will rise.


    Given the rewards, it might seem that the mining analogy is apt – you invest in
    equipment and expend energy, utilizing whatever technical advances could give
    you an edge, all'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'in order to ‘discover’ or ‘mint’ an item of value that is often compared to
    digital gold.Yet this misses the crucial point that if all cryptocurrency mining
    stopped, every coin in circulation would cease to exist. This form of mining is
    not discovering or producing any actual object, but instead using cryptography
    to continuously secure the blockchain via proof-of-work. New coins are merely
    the programmed reward. It is not a supply chain activity building up the inventory
    of valuable commodities. It is, in fact, the act of transferring the currency,
    and the only means by which the currency can even be said to have any use. Mining
    for cryptocurrency might be better compared to working as a banker, settling accounts
    and processing transactions in order to support the entire structure of this virtual
    financial system.


    # Strength in numbers


    The continual race to compute new hash is the lifeblood of any cryptocurrency.
    The more hash on the network, the better. One way to quantify this is simply in
    terms of the rate of potential hash solutions produced, expressed as hash per
    second (h/s). If one computer in the network is producing twice the h/s of another
    computer, it is doing twice the amount of work to solve the block. Accordingly,
    that computer would be twice as likely to solve the block and receive its reward.
    Similarly, if a large number of more powerful computers join a network such that
    it produces twice the h/s, that network will be expected to find the solution
    to the block in half the time.


    However bitcoin is designed to adjust the difficulty of finding the solution after
    every 2016 blocks have been completed, in an attempt to establish a nearly constant
    block time of ten minutes per block. This way, if the hashrate of the entire'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'network doubles, the difficulty would then double so that the block still takes
    the same amount of time to solve. This means transactions continue to be logged
    to the blockchain at the same rate, and accordingly, new coins flow into the system
    in a controllable way.


    There''s another good reason to keep the challenge difficult.

    The greater the difficulty of the problem to be solved, the harder

    it will be for anyone to attempt to create a false blockchain and

    try to pass it off as the real one. Theoretically, a rogue computer

    could tamper with blocks if it inserted false transactions into the

    blockchain, and then recalculated all the proof-of-work to catch

    up with the rest of the network, winning the current block and

    then presenting its altered blockchain as the actual record. To

    help prevent this, the network always chooses the longest block-

    chain, which is the most difficult to solve, in order to make sure

    any usurper blockchains will struggle to hash all the way back to

    the end again, and to make sure they must hash as hard or harder

    than the rest of the network.


    Now imagine there are only two computers in the net-

    work. An attacker would simply need to have the faster

    machine to simply outpace the other computer, allowing

    their false blockchain to be the longest and most difficult to

    solve. But with hundreds or thousands of computers on a

    network, the attacking computer would need to be stupen-

    dously powerful – not only the fastest, but faster than all the

    rest working together. Such a theoretical situation is known

    as a ‘51% Attack’, because the attacking computer must be

    faster than all other computers on the network combined

    and, hence, create a majority of the hash. So the greater the

    number of independently controlled computers there are on

    the network, the more challenging a 51% Attack will be, and

    the more secure the cryptocurrency.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# A digital arms race


    Even before it became clear that cryptocurrencies would be worth anything in the
    real world, it was obvious that those with more powerful computers would be more
    likely to solve blocks and therefore win more coins. In April 2010, a programmer
    called Laszlo Hanyecz figured out how to get his computer’s graphics processing
    unit (GPU) – a specialized processor board responsible for rendering three-dimensional
    digital images – to do the hashing for bitcoin rather than his computer’s central
    processing unit (CPU). Hashing takes time because it is a very repetitive task,
    requiring millions of calculations every second. Specialized hardware like a GPU
    is designed to do large numbers of small tasks very quickly, and so excel at hashing:
    typically a single GPU can produce a hashrate at least ten times faster than that
    of a single CPU.


    As bitcoin grew more valuable, more computers were connected to the network, and
    winning rewards became more difficult. Users then began to compete with each other
    to build powerful ‘mining rigs’ – towers of computers with multiple GPUs hooked
    together. This not only increased their personal reward of new bitcoins, but also
    increased the overall computing power in the network, called the ‘global hashrate’.
    An arms race had begun, with millions of dollars worth of bitcoins at stake for
    the winners.


    # Specialized mining equipment


    As competition grew, miners began casting around for processors even more powerful
    than GPUs. The next devices to come under scrutiny were so-called field-programmable
    gate arrays (FPGAs) – logic circuits that could be programmed by their users to
    accomplish very specific tasks. Meanwhile other devices called application-specific
    integrated circuits (ASICs) were also'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'developed specifically for mining bitcoins. Sold by companies whose sole purpose
    was to feed the new gold rush, they were essentially bitcoin-mining machines,
    capable of no other tasks. Plugged into the internet, these devices sent the global
    hashrate skyrocketing, and quickly made mining no longer cost effective for anyone
    without such specialized hardware.


    Indeed, many bitcoin miners were soon dismayed as their conventional computer
    hardware became obsolete. Compared to the amount of hash generated by a desktop
    computer, for example, an ASIC works at a rate more than a million times faster,
    typically generating gigahash/second (Gh/s) or even terahash/second (Th/s). Clearly,
    conventional computers were far less likely to earn bitcoins. Meanwhile, those
    with the most expensives ASICs were raking it in, sometimes earning back their
    investment of tens of thousands of dollars in equipment in just a few weeks.


    In order to counter this escalating arms race, new crypto-currencies with different
    hashing algorithms were created. Bitcoin''s hashing algorithm is called SHA-256.
    It is slow, which is thought to make it generally more secure and accurate. Most
    proof-of-work cryptocurrencies use this algorithm, and the ASICs that were designed
    to mine bitcoins are only compatible with it. The first alternative algorithm
    to be introduced was called scrypt – it is the algorithm for the litecoin cryptocurrency.
    It was designed to run on CPUs, work quicker, and use less electricity. It can
    be adapted to process blocks in as little as 30 seconds. And for a time, this
    new algorithm levelled the playing field. But eventually technology caught up,
    and now there are ASICs that run scrypt as well. There are a few other new algorithms
    out there too, such as X11 and a proprietary algorithm called Momentum used only
    for a blockchain service called BitShares. It seems likely that the same hardware
    arms race which occurred with SHA-256 and scrypt will be repeated with these algorithms
    too.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Birth of a new industry


    As it became harder to make money through cryptocurrency mining, some began to
    follow the old adage: the way to get rich in a gold rush is to sell shovels. And
    producing ASIC-based mining equipment – technology good for no purpose other than
    mining cryptocurrency – soon became an industry in its own right. Unfortunately
    things got off to a rocky start.


    In June 2012, an US company called Butterfly Labs announced that it would be the
    first company to sell ASICs specifically designed for mining bitcoins, and quickly
    collected $5 million in pre-orders. However in January 2013, before Butterfly
    Labs could ship a device, a Chinese company called Avalon pipped it to the post
    and delivered its own specialized ASICs to customers. After a flood of complaints
    about Butterfly Labs, the US Federal Trade Commission shut the company down, though
    it was later re-opened and began to offer refunds.


    This was an omen of things to come. Perhaps encouraged by the opportunity for
    quick profits, and with sales conducted over the internet, often in non-reversible
    cryptocurrencies, the coin-mining device industry became a watchword for businesses
    that, at best, were badly managed and, at worst, outright scams. In March 2014,
    Fibonacci, a US company based in Florida began to take pre-orders for ASICs to
    mine scrypt-based crypto-currencies. Within five months, its website had disappeared
    and the company could no longer be contacted. Estimates in news reports suggest
    investors lost more than $1 million. The industry has even seen straight-up Ponzi
    schemes, paying out initial investors using cash from those who invested later,
    based on early positive reviews. In December 2014, for example, a scrypt-based
    operation headquartered in Romania called Litecoin GEAR,'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'reportedly stopped making payouts to existing investors when the stream of
    new investments dried up. Much the same thing allegedly occurred with mining company
    Bitcoin Trader a few months earlier.


    Despite this, it is fair to say that legitimate companies now outweigh the fraudulent,
    and there are many powerful ASIC machines on the market. Avalon, BitFury, and
    Bit-Main''s AntMiner brand are three highly-regarded offerings, with products
    that mine at rates from 2 Gh/s to nearly 5 Th/s, depending on configuration and
    power consumption. Without a doubt these companies are highly profitable, competing
    with each other to provide the best technology and earn brand recognition.


    # The emergence of pools


    But even with a top-of-the-line ASIC mining a popular currency like bitcoin, any
    individual miner is still a drop in the ocean. By early summer 2016, solving a
    block would earn a 25 bitcoin reward, worth over $16,000 on the market, a sum
    that would more than pay back the cost of the ASIC. However, the global hashrate
    of bitcoin had reached over 1.5 million Th/s, leaving even the fastest ASIC machine
    with less than a 1 in 300,000 chance of success. Investing thousands of dollars
    in cutting edge technology only to earn a chance of earning bitcoins no greater
    than in the lottery seemed a poor decision. As a cottage industry, it looked like
    bitcoin mining was dead.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/1aafdaf3d396c22bbcefa1ff58c79405_74_0.png)


    A Chinese bitcoin mine. China is home to the majority of the world’s mining pools.


    Instead, miners have began to join together to form ‘mining pools’. Rather than
    competing for the tiny chance of winning a whole block reward, they prefer to
    pool computer power and combine their hash with others. When the pool wins a block
    the reward is split between members according to their contributed hashrates.
    This has the effect of averaging out the rewards, turning the profit into a small
    but steady income. And the larger the pool, the more regular the payout, even
    if it is just fractions of a coin each day.


    # Do mining pools have a downside?


    It turns out that the rise of pools creates a new risk. Larger pools increase
    the possibility that one of them may someday acquire 51 per cent of the hashrate,
    making the blockchain vulnerable to attack.Already,a few heavyweight bitcoin mining
    pools control the vast majority of the global hashrate. In November 2016, the
    largest pool was AntPool, the official'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'pool of Chinese ASIC producer Bitmain, with 19 per cent of the hashrate. Close
    behind was F2Pool, also based in China, with 12.4 per of the hashrate. BTCC Pool
    had 11.9 per cent, BW had 9.2 per cent and BitFury''s official pool had 8.1 per
    cent. Together, these top five pools control more than 60 per cent of bitcoin
    mining (see Figure 5.1). Yet there is a clear incentive to prevent any single
    pool having majority control. Should this occur, it is highly likely that confidence
    in the cryptocurrency would be eroded, given the technical possibility of that
    pool altering the blockchain. As these pools rely on bitcoin for profit, any crisis
    of confidence in the currency would likely destroy their business. As a result,
    miners often switch between pools, in a concerted attempt to prevent any one pool
    dominating.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_75_0.png)


    FIGURE 5.1 The mining giants. A snapshot of the market share (measured by hashrate
    distribution) of the largest mining pools, from November 2016. The distribution
    is highly variable.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Outsourcing to the cloud


    While these large pools now enjoy dominance, another model has emerged which can
    also offer individuals a way to reap cryptocurrency rewards. Cloud mining works
    more or less like any other cloud service: a company operates a large centralized
    facility where it hosts services for paying clients on its own equipment. In the
    case of bitcoin mining, the customer typically pays the company a rate per hash/s,
    and is free to purchase as much as they like. Then they gain a percentage of the
    bitcoins earned.


    There are some clear benefits. Rather than investing in your own mining gear,
    you are investing money in the cloud miner''s operation so they can build or buy
    ASIC units and operate them on an industrial scale. The cloud mining company owns
    the hardware and facilities, they simply pay out a percentage of profits to their
    investors who enabled the operation. The company looks after the mining hardware
    while taking a small percentage of profits to cover operating costs, as well as
    benefiting from economies of scale. And even if customers depart, the cloud miner
    still owns the hardware, and can run it themselves for reward. The benefit for
    the customer is that they need only provide the cash to purchase the hashrate
    – they don''t need to purchase, house or maintain expensive, hot, electricity-guzzling
    circuitry.


    All the hardware itself is housed inside huge warehouses. Although most mining
    companies are secretive about their operations (not surprising, given the amount
    of money involved) images posted online that purport to show some of the larger
    cloud mining companies such as BW.com and Ant-Pool reveal rack upon rack of processors,
    stacked to the ceiling in vast warehouses, with large cooling fans, thick power
    cables, and very few humans in sight. To maximize profits, cloud mining services
    are often based where electricity is cheap – in'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'the vicinity of large hydroelectric generators or geothermal energy sources,
    for example, or in locations close to the Arctic where cooling the hard-working
    processors can be as simple as opening a window. For example, cloud mining company
    Genesis Mining started out with sites in Bosnia and China but is now based in
    Iceland, thanks to its cheap electricity, cold climate and fast internet links.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_77_0.png)


    No picks and shovels: these energy-hungry processors are mining bitcoins.


    # A distributed currency with central control


    Although cryptocurrency was designed to be distributed across the internet, the
    realities of the mining process mean it has evolved to become increasingly centralized.
    A handful of pools now control the vast majority of the global hashrate of bitcoin
    and these pools distribute much of the new funds generated. It seems that the
    economic advantage of centralized industry'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'and large-scale production has been enough to drive most of the small mining
    companies and pools out of business.


    Cloud mining is now even looking to court mainstream investors. Genesis Mining
    has launched the first bitcoin mining fund registered with the U.S. Securities
    and Exchange Commission, offering investors securities in a mining-based fund
    called the Logos Fund. As risky and complex as cryptocurrencies can be, there
    is a growing number of people willing to put down large amounts of money in order
    to play that risk.


    There is another sense in which centralization is a good thing. As the technology
    in any field develops, new developments can rapidly increase efficiency. Based
    on a rate of watts-per-hash-generated, an ASIC can be more than 18 million times
    as efficient in energy consumption as a single CPU.When mining on a vast scale
    this efficiency means lower electricity bills which could make a huge difference
    to the bottom line, and makes the bitcoin network less wasteful overall.


    # How much electricity do miners use?


    The energy consumption of mining cryptocurrencies like bitcoin is not small. Extrapolating
    from one measured rate of energy consumption for the first ASIC-mining machine
    released in 2013, the global hashrate for bitcoin at that time would have consumed
    over 482,969 mega-watt-hours per year. That is the equivalent of over 44,000 average
    US homes.


    Using figures for ASIC-mining machines released in mid-2016, the electricity consumption
    for bitcoin seems to have increased substantially to 3.36 million'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'megawatt-hours per year, or the equivalent of over 307,000 average US homes.
    Note, however, that this is a power increase of only 7 times, despite a global
    hashrate some 184 times higher than in 2013. A mining pool utilizing ASICs may
    put small-scale miners out of business, but it certainly helps save large amounts
    of electricity in the process.


    # Size really does matter


    But scale does bring its own problems. The larger the pool, the more it tends
    to draw hacking attacks. One study shows that 63 per cent of large bitcoin pools
    have come under attack from hackers, while only 17 per cent of smaller pools have
    been targeted. By staying under the radar, small pools may be avoiding some of
    the troubles experienced by larger pools.


    There is also some concern in the mining community over the extent to which having
    mining centralized in large pools could create problems for the future of a cryptocurrency.
    The collective of individuals working to update the code for bitcoin are attempting
    to solve certain problems with regard to how well the currency scales to more
    users (see ‘Nakamoto’s successors work on revamping the bitcoin’, Chapter 11).
    But for a software update to be accepted, everyone in the network has to agree
    to the update. This serves as a form of voting: when a majority of the network
    has updated to a new version, it is considered to be accepted, and the old version
    is phased out. However, if the new version is not accepted, developers have to
    go back to the drawing board.


    Currently, the pools that control the majority of the bitcoin network have been
    sceptical of recently proposed software changes, and have turned them down. Cultural
    differences'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'between different pools may also be playing a role here – many pools are in
    China, for example, while most of the software developers are in the US. And there
    is some concern that if a conservative instinct takes hold and updates are resisted,
    in the long term the currency might stagnate.


    Of course bitcoin is only one cryptocurrency among many, although it is the biggest
    in value and in network size. Miners will often switch the currency they mine
    on a daily or hourly basis. And while it is unlikely that bitcoin will fall from
    the top of the heap, new blockchains are always being introduced. In 2016, for
    example, two new sorts of blockchains, Ethereum and Ripple, have emerged and surpassed
    a horde of other cryptocurrencies to become the second and third largest by market
    capital behind bitcoin. As the economic and technological conditions governing
    the mining process continue to evolve, so too will the status quo.'
  merge: -1
  img_proc: true
