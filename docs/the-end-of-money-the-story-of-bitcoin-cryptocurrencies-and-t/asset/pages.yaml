- pgno: 158
  md: '# Bitcoin''s growing problems


    Bitcoin has a problem. It cannot get big enough. The crypto-currency is facing
    problems of scale that Nakamoto didn''t envision, as the number of users increase
    and the blockchain grows longer.


    As new transactions are reported to the blockchain, they are compiled to form
    a new block and written to the blockchain every ten minutes or so. However, the
    block size is limited. Only 1 MB of transactions can be written every ten minutes.
    This limits bitcoin to an average of seven transactions per second. That sounds
    like a lot, but VISA’s payment network can process 24,000 transactions per second.
    Baked into the code of bitcoin is a limitation that means it could never rival
    a major credit card system, no matter how popular it gets.


    Many bitcoin developers, such as Gavin Andresen, the ringleader of the Bitcoin
    Core development group, want to fix this problem by making the block size larger.
    Andresen created an update called bitcoin XT, which would increase the block size
    to 8 MB, and double the size again on a revolving basis.


    But bitcoin has a second problem. It is decentralized, and so even the core developers
    have no control over what software is being used. If a computer on the network
    is using bitcoin XT, it will create blocks that are 8 MB. But a computer running
    the previous version of the software won''t be able to understand a block that
    big. It will only understand blocks created by the older version, and it will
    continue to create 1 MB blocks itself. This will lead to a situation called a
    ‘fork’.


    A fork, typically a term used to describe when the development of programming
    code splits into two separate versions that are no longer identical or compatible,
    in this case refers to the blockchain itself. There would be two versions of the'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'blockchain – one made and recognized as valid by the bitcoin XT computers,
    the other used by the original software version. These blockchains would no longer
    cohere. Such a state would be chaos, of course. The bitcoin network, kept together
    only by its single, canonical blockchain, would cease to exist. Bitcoin would
    be split into two different cryptocurrencies, effectively.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_159_0.png)


    FIGURE 11.1 Two different halves of the same network. One produces a blockchain
    that includes both small blocks and big blocks. The other side sees the same blockchain,
    except that it cannot see the big blocks, only the small blocks. Therefore, it
    creates a second blockchain, without any big blocks at all.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'To prevent a disastrous fork, the software update is designed to wait until
    a certain date, and then poll the network. If at that time, 75 per cent of the
    network or more is using bitcoin XT, then it will consider it ''accepted'' and
    switch to the larger blocks. 75 per cent is considered large enough of a majority,
    that it would force the laggards to update as well, in order to continue to use
    bitcoin services provided by exchanges and other services.The network votes.


    When the software ''voted'' in January 2016, only 10 per cent of the network was
    using the update. The reasons were varied. Some bitcoin users didn''t like the
    update from a technical basis, arguing that there were better ways of fixing the
    block size problem. Others didn''t like the way that the update was ''forced''
    onto bitcoin, and argued against it as a matter of principle. This debate drew
    in a number of powerful figures and companies into both sides of the debate. And
    then, it seems a hacker-for-hire began attacking computers running bitcoin XT,
    taking them offline. Many companies and individuals rolled back to the previous
    version just to avoid being attacked.


    # A possible fix: Segregated witness


    The block size is still a problem, but there is a novel solution in the works
    to help fix it. And the fundamental cleverness of this fix is that there is no
    possibility of a fork, and therefore a vote like bitcoin XT''s is not necessary.


    The disjunction between bitcoin XT and bitcoin is known as a ''hard fork'', but
    a ''soft fork'' is possible as well. Whereas a hard fork introduces incompatible
    differences between the new version and the old version, essentially splitting
    the cryptocurrency in two, a soft fork changes the cryptocurrency but still'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'allows communication between older versions and newer versions of the software.
    The software update is backwards compatible – computers that do not upgrade do
    not get shut out of the network, they merely do not benefit from the upgrade.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_161_0.png)


    Is there a fork in the road ahead for bitcoin?


    It was originally thought that to increase the block size, a hard fork would be
    necessary. But this new update strategy, known as ‘Segregated Witness’, gets around
    the problem. Rather than increasing the size of the block to accommodate more
    transactions, it decreases the size of the transaction by reducing the amount
    of information reported to the blockchain.All the cryptographic information that
    signs the transactions – ensuring that the cryptocurrency can only be moved by
    the person holding the secret key to a particular wallet – is kept in a separate
    tree of information. Once their credentials are approved, a very short message
    is sent to the blockchain, along with the transaction. This is where the name
    ‘Segregated Witness’ or ‘SegWit’ comes from: the cryptography that witnesses that
    the signatures are legitimate is kept separate from the blockchain. The Witness
    merely gives the blockchain a cryptographic ‘thumbs up’, and then the transaction
    proceeds. By drastically shortening the amount of information reported'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'to the blockchain, it is estimated that SegWit could enable nearly four times
    as many transactions per block as are currently possible.


    The real benefit, is that computers running an older version of the bitcoin software
    won''t see the ''thumbs up'' from SegWit, but they will continue to see the transactions
    in the blockchain.

    They will appear strange – bitcoins that apparently appear out of thin air, without
    any signature. But because these strange, magical bitcoins can only be added if
    the SegWit part of the network allows them, they will continue to be just as secure.
    So,

    even if only a portion of the network runs SegWit, the overall network will still
    benefit from the improved efficiency. A larger block size might still be necessary,
    but this improved efficiency will give bitcoin some much needed breathing room.
    In late 2016, the rate of bitcoin transactions was edging up to around 2,000 per
    block, and an average of about 3.3 per second – or in other words, running at
    about half capacity. Those who see a bright future for bitcoin would like this
    capacity to be expanded as soon as possible.


    But the developers working on the SegWit updates think that other improvements
    in the software will make it attractive for computers in the network to update.
    Transactions will be faster overall. And most importantly, SegWit has the benefit
    of solving the ''transaction malleability'' problem, that was blamed for the collapse
    of Mt. Gox in 2014 (see ''The transaction malleability problem'', Chapter 7).
    That error occurred when a slight alteration in signatures caused a transaction
    on the blockchain to have a different ID than expected. Because signatures are
    moved into the SegWit, transaction IDs are now completely different, and this
    malleability is no longer possible. Proponents argue that being free from this
    well-known vulnerability alone will be motivation to users to update their software.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'But that remains to be seen. In July 2016, the SegWit code was going through
    its review period. After that, it will be made available to the network. Only
    then will the network decide which course it wants to take.


    # # The Lightning Network


    Not everyone is convinced that the block size problem is really a problem. A new
    idea, called the Lightning Network, may make the entire issue moot.


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_163_0.png)


    Lightning could save bitcoin.


    Rather than try and cram thousands of transactions per second into the blockchain,
    the Lightning Network takes a contrary approach – keeping many transactions off
    the blockchain.


    The idea is best described in terms of small, repeated payments. One user authorizes
    a certain amount of cryptocurrency'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'for transactions with another particular user – like opening a subscription
    account with a down payment. That transaction remains open, only shared between
    those two users. Over time, many incremental transactions are recorded, sending
    bitcoins one way or the other, until finally the authorized down payment amount
    is used up. Then, the transaction closes, and is sent to the blockchain. It is
    only recorded in the blockchain once, as a single transaction, even though there
    were any number of smaller transactions that were summed up into that single transaction.


    As an example, imagine buying a coffee every day for a month. Instead of notifying
    the blockchain after every transaction, the Lightning Network allows the buyer
    and the coffee shop to just report the total transaction at the end of the month,
    whilst still maintaining security.


    The way it remains secure is that each incremental transaction must be approved
    by each user. If at any time they fail to agree, the process is stopped, the totals
    from before the disagreement are returned to each user, and the information is
    logged to the blockchain. Because the transaction is only occurring between these
    two users, their simultaneous agreement or disagreement can be logged immediately.
    The level of risk is low, because only a small amount of cryptocurrency can be
    put into this open transaction at a time, and each step along the way must have
    both parties’ agreement.


    The Lightning Network is only an experiment as of mid-2016, and a lot of the details
    have yet to be worked out. As well, it would require SegWit or some update like
    it to fix the transaction malleability issue. It would also require some additional
    technological tricks that are only theoretical at the moment.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/1aafdaf3d396c22bbcefa1ff58c79405_165_0.png)


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_165_1.png)


    ![](img/1aafdaf3d396c22bbcefa1ff58c79405_165_2.png)


    FIGURE 11.2. Two computers in the network open up a transaction, like a small
    box. Little by little, transactions add up within it until it uses up the entire
    value of the transaction, and then it is closed, and sent to the network. Each
    mini transaction appears as a small agreement, requiring both computers'' consent.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The Lightning Network and other innovative ideas show that, although bitcoin
    is several years old, its evolution is continuing. The cryptocurrency may change
    beyond recognition, depending on what sort of alternations the distributed network
    decides to accept.


    # The world’s biggest crypto-economy


    In mid-2013, while US companies were struggling to ease the process of transferring
    money into Mt. Gox so that customers could buy bitcoins, a Chinese exchange named
    BTC China set up a deal with mobile services provider Tencent. For the first time,
    Chinese citizens could transfer money directly into a bitcoin exchange. Within
    a few months, in November 2013, bitcoin hit its highest price ever, trading for
    as much as $1,242. Chinese interest in bitcoin exploded.


    The Chinese bitcoin bubble would eventually burst when the government issued a
    warning that it was illegal for banks to transfer Chinese yuan directly to a cryptocurrency
    business. This meant that after only a few months Tencent had to cease its service
    with BTC China, cooling the public’s interest. But the Chinese appetite for cryptocurrencies
    had been whetted, and eventually China would grow to represent the vast majority
    of exchange trading volume and mining, and likely a large percentage of bitcoin
    ownership as well.


    In 2016, two Chinese exchanges, Huobi and OKCoin, were responsible for 92 percent
    of bitcoin trading. The top four mining pools, with 76 per cent of the global
    hashrate, are based and owned in China. Some have attempted to explain the Chinese
    passion for bitcoin as a way around Chinese currency controls. Chinese law states
    that individuals cannot send more than $50,000 worth of yuan out of the country
    per year. But Chinese bitcoin investors'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'deny this – they say that the currency controls already have plenty of loopholes,
    and they believe that the Chinese are into bitcoin purely from an investment standpoint.
    China has a strong culture of gambling, and the large boom and bust cycles of
    bitcoin are attractive to people looking for a big payoff.


    Additionally, it must be noted that China has more experience with unconventional
    payment methods. While Europeans and Americans might have balked at the apparent
    insecurity of using a phone as a method of payment, in China ad hoc payment arrangements
    were already commonplace. By as early as 2012, online payments in China represented
    over $660 billion, and grew to $1.3 trillion in 2015. Today, Alipay claims 400
    million active users, and Tencent’s WeChat Pay smartphone based payment system
    has over 300 million users. While in other parts of the world the unfamiliar aspects
    of cryptocurrencies might make users take pause, in China things are different.


    As bitcoin looks to be in China to stay, the Chinese government is considering
    revisions that would enable wider use of cryptocurrencies. Like the US government,
    they seem primed to acknowledge bitcoin as a commodity, rather than a currency.


    Outside of China, cryptocurrency proponents are worried about what Chinese interest
    will do to the cryptocurrency itself. Control of mining is a de facto control
    of the network, in terms of ‘voting’ for new software updates. With 76 per cent
    of the processing power of the network, these mining pools control 76 per cent
    of the vote. But while the effective ‘decentralized’ control of bitcoin is quite
    lopsided, it seems that for now, it is unified around the idea of ensuring the
    cryptocurrency stays valuable and relevant.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# The altcoin explosion


    As soon as bitcoin began taking off in 2011, there were people who were discontented
    at the cryptocurrency''s newfound popularity. Mining became more difficult, prices
    started to increase, and weaknesses started to emerge. But if one cryptocurrency
    worked, why not two? Or ten? Soon there were hundreds of ''altcoins'' that formed
    a complex cryptocurrency market system.


    # The joke cryptocurrency


    When a cryptocurrency emerged based upon the popular meme called ''doge'' certainly
    no one could say they expected it. The meme is a cute Shiba Inu dog with a peculiar
    expression on its face surrounded by colourful captions, not immediately anything
    to do with cryptocurrency.


    Around the end of 2013, Adobe Systems employee Jackson Palmer was watching the
    excitement around altcoins unfold. He decided to make a ''Dogecoin'' website as
    a joke. Billy Markus, a software developer, found the site, liked the idea and
    got in touch with Palmer. They altered the source code of litecoin a little, mostly
    changing the look of the software to mimic the doge meme. They also made the block
    award random – anywhere from zero to one million dogecoins were awarded every
    time a block was solved, though this would be changed in time – and made the total
    amount of coins limitless. After all, it was a joke. Why not make it fun?


    But dogecoins actually took off. Maybe it was the oddity of the random block awards,
    or maybe it was the'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'novelty of a coin with such high quantities that one could actually own whole
    numbers, rather than the small fractions of bitcoin most people could afford.
    Or perhaps it was simply that cute animals are always a strong currency on the
    internet.


    Dogecoin might not be the most powerful alternative cryptocurrency. There are
    so many, that one dogecoin traded for the equivalent of two hundredths of one
    US cent in July 2016. But overall, the cryptocurrency is worth a total of about
    $24.8 million today. Users have continued mining them, and they are often used
    online as tokens of minuscule recognition, such as being given as a ‘tip’ for
    good posts on a website. Dogecoin are lighthearted and fun as opposed to the seriousness
    and dark web-intrigue of bitcoin.


    The first altcoin to succeed was litecoin. It was not the first modification of
    bitcoin to be tried, but for some reason, it is the one that was most successful.
    Its mechanism is almost identical to bitcoin’s except that it had a block time
    of just 2% minutes, instead of bitcoin’s ten-minute block, to speed up transactions.


    In October 2011 when litecoin was launched, graphics processing units (GPU) were
    taking over bitcoin mining, making it difficult for users running bitcoin software
    on their own computers’ central processing unit (CPU) to mine any bitcoins. Litecoin’s
    hashing algorithm, called scrypt, could not initially be hashed using GPUs, which
    slowed down the mining arms race. Since that time, scrypt-based GPU software and
    ASICs have been developed, but this factor initially boosted the popularity of
    litecoin by making it seem more democratic, unlike the high-stakes mining of bitcoins.
    Once litecoin'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'gained popularity, it served as a good alternative to bitcoin, allowing investors
    to hedge their cryptocurrency investments against the wild price fluctuations
    driven by bitcoin''s ongoing legal dramas.


    After the success of litecoin, many new coins were launched with the hope of becoming
    the next second-place-to-bitcoin. If investors and miners got in early on an altcoin
    that made it big, it would be like getting in on bitcoin back in the early days.
    Creators would often launch new coins with very subtle variations, in the hope
    that their version would become just valuable enough that their early mining would
    allow them to cash in once the altcoin had a wider user base. By taking the source
    code from any previously released cryptocurrency and making a few changes, a whole
    new altcoin could be created in minutes.


    With this explosion of possibilities for getting rich quick in cryptocurrency,
    the altcoin market was soon transformed into a penny stock marketplace. In 2013,
    as the number of exchanges trading cryptocurrency increased rapidly, many exchanges
    would attempt to draw customers by introducing new and untested cryptocurrencies.
    As newly introduced altcoins hit the exchanges, they quickly exploded into bubbles
    that often deflated rapidly. In these quick price increases, one could rapidly
    make 100 per cent on an investment or more. And, one could just as easily lose
    that investment. Like ‘penny stocks’, risky investments worth just a few cents
    that allow an investor to easily double or triple their money, the altcoin markets
    became a fast paced world of rumour, hype, and strike-it-rich schemes.


    A common scheme was for altcoin creators to secretly mine their coin for weeks
    before announcing it to the general public. By the time others started mining
    and the hype took off, the'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'creators had already sacked away a cache of the currency, which they could
    then dump on the market when they wanted to cash out. This scheme was named ‘pre-mining’.
    Another strategy was for an investor, called a ‘whale’, to buy a huge amount of
    a newly listed altcoin in order to drive up the price. Then, as the price rose
    and others began buying in to try and take advantage of the increasing price,
    the whale would liquidate their holdings, earning as much profit as they could
    while simultaneously driving down the price. Just like in the stock market, this
    was called a ‘pump-and-dump’.


    Bitcoin was hitting its all-time high prices in late 2013 as Silk Road was shut
    down and the popular consensus was beginning to believe that cryptocurrencies
    could be used for legitimate means. Meanwhile, investors were also taking bigger
    risks with altcoins that would rocket to popularity only to fall immediately.
    Mining fluctuated rapidly as new exchanges listed or delisted the altcoins, or
    as interest simply waned. Some altcoins were around for only a period of months,
    others merely for weeks.


    However, the altcoin markets as a whole had the effect of propping up bitcoin.
    When an altcoin is added to an exchange, the very first thing it can be traded
    for is bitcoin – not dollars, yuan, pounds or euros. Altcoins helped remove some
    of the significant barriers to investing in bitcoin, by allowing people with small-scale
    hardware to mine altcoins and trade them for bitcoins. Via the proliferating exchanges,
    the altcoin boom strengthened the price of bitcoin, as it became the ‘anchor currency’
    of the cryptocurrency economy.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Does cryptocurrency have a future?


    Much of the debate on this issue is linked to the fate of the original cryptocurrency:
    bitcoin. Even the developers working on bitcoin software feel this anxiety. A
    number have quit publicly, after personal disagreements with other bitcoin proponents.
    Everyone can agree that bitcoin is facing serious challenges. It seems no one
    can agree on what to do about it.


    Many people have invested millions of dollars into bitcoin, either directly in
    the currency, or as companies developing bitcoin-based products. While companies
    can go bankrupt and individual investors and developers can become fed-up and
    quit, it is highly unlikely that everyone will walk away from bitcoin, abandoning
    their money, and going on to something else. Bitcoin was the first cryptocurrency,
    and earns a significant amount of allegiance based on that fact alone. This was
    the cryptocurrency that Satoshi Nakamoto built. It is likely that bitcoin will
    be around for decades to come – but whether it will be anything like the bitcoin
    of today, is anyone’s guess. New technical evolutions, or a stagnation in growth
    could cause bitcoin to either explode in the numbers of new users, or retreat
    to the backwaters of the internet.'
  merge: -1
  img_proc: true
- pgno: 173
