  md: 'terms, although the avatar’s appearance seems closely connected to (or at least
    an approximation) the physical world appearance of the user. The students described
    the relationship with the avatar in terms of functional representation and rendered
    the avatar as an object or tool.


    +   - Avatars as toys and tools: The third dimension portrays an understanding
    of the avatar as a tool and an object for playful engagement, as well as a status
    object. The avatar is positioned as an object that can be customised and played
    with to take on varied appearances.


    +   - Avatars as extensions of self: The fourth dimension regards students who
    declared their respective avatars as an extension of themselves, both visually
    as well as emotionally. In their narratives, the avatar was described as closely
    related to the user not only in corporeal appearance and, possibly, by name, but
    the students also mentioned being emotionally and psychologically attached to
    their avatars.


    +   - Avatars as identity extensions: In this dimension, students engaged with
    their avatars and the virtual world in terms of “laboratories for the construction
    of identities” (Turkle, 1996, p. 184). Thus, the avatar in this dimension ventured
    into dimensions of exploring notions of potential, new, or alternative identities
    for oneself both in the context of the virtual world and as a testing ground for
    the physical world, as well as exploring possibilities beyond its boundaries.


    There still remain many debates about the nature of identities in cyberspace,
    with a wide diversity of opinions. For example, some scholars suggest that it
    is important to have a clear conceptual understanding of who we are in cyberspace,
    since without it, we risk being confused (e.g. Floridi, 2011). Those such as Floridi
    who argue for such a stance seem to suggest that by separating and being honest
    about identities brings with it some kind of honesty or morality, yet this would
    seem misplaced.


    Understanding identities in relation to users and their avatars is complex. A
    new set of s/pl/ace identities are required which reflect squashed polarities,
    chaotic overlaps, and new configurations of space and place, as well as an appreciation
    of VR and metaversal spaces.


    # ## Physical Lives versus Virtual Lives


    Alongside fashion, homes are a common focus of virtual world activity. Even though
    people are in a world where it never rains or is cold, and where complete security
    and privacy can be provided by a couple of mouse-clicks, people still like somewhere
    to call “home” and to be able to personalise it. This may be as simple as the
    home “den” in Oculus Quest or Rec Room, or a'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Linden Home in *Second Life* in the finest ranch-style tradition, or something
    you fashion out of blocks in *Minecraft*. The need for a virtual, secure “home-base”
    seems an almost primeval urge (Goetz, 2017). The COVID pandemic drove millions
    to a housebound existence and a working-from-home model. Almost all of the virtual
    worlds showed a spike in usage as people used the virtual world as a way of escaping
    their physical home and extending their existence into a larger virtual space
    (Somoza Medina & Somoza Medina, 2023). Whilst most remote business meetings still
    tend to be on video conferencing systems, if metaversal models and all of the
    collaboration tools mentioned earlier become more common, then there may be a
    similar extension of the physical office into the virtual (something that companies
    like IBM tried in the early *Second Life* days).


    Does the Metaverse offer a further opportunity to blend the physical and the digital/virtual,
    so that, rather than virtual homes becoming (often) idealised versions of the
    homes people would like to have in the physical world, they become part of a more
    symbiotic relationship? One where physical and virtual homes are interconnected,
    bleeding through and into each other, and supporting the development of a Metaverse
    that encompasses all of people’s lives – both physical and digital. And does this
    same discussion also apply at a city level – how might cities be redesigned if
    they exist as viable and effective entities in both the physical and virtual worlds,
    and if their citizens are likewise existence-fluid? Mitchell (2003) talked about
    Me++, how the then emerging digital world was letting us extend our existence
    beyond our physical selves, so that we were defined by both (physical) boundaries
    and (mostly digital) networks. In the era of the Metaverse, are we also defined
    by the virtual worlds we inhabit?


    Broadening this discussion out, a key consideration is how the physical world
    and the virtual world of the Metaverse will co-exist – with many (e.g. Narula,
    2022; Hackl, interviewed in Alaghaband, 2022) seeing the physical and virtual
    as all part of the same Metaverse. Science fiction has often presented the danger
    of people being completely seduced by the virtual to the exclusion of their physical
    health, relationships, and environment – as in the film *WALL-E* (Stanton, 2008).
    What can be done to avoid that, and are there ways by which the virtual can actually
    enhance the physical – as has already been discussed in the context of climate
    change and global equality?


    The potentially addictive nature of computer games and their effects have long
    been recognised (Aziz et al., 2021), and the Chinese have even tried to limit
    the amount of time that children play video games – although reportedly to little
    effect (Stokel-Walker, 2023). Time compression (i.e. losing track of real time)
    has also been well studied in DesktopVR and HMD-VR experiences (e.g. Mullen &
    Davidenko, 2021) – although it can be even more of an issue in HMD-VR since the
    user has no sense of the change in daylight in the physical world.'
