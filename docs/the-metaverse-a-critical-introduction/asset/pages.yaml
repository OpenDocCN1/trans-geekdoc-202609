    # ## Second Life and OpenSim


    *Second Life* (2003, www.secondlife.com), also known just as SL, is the creation
    of Philip Rosedale and Linden Lab. *Second Life* reflected many of the same ideas
    as Active Worlds but delivered a more complete execution. It is worth spending
    some time looking at *Second Life* as it is still one of the best implementations
    of a proto-Metaverse environment (Au, 2023; Lamb, 2022).


    > > **EXPERIENCING SECOND LIFE**

    > >

    > > So what is the Second Life experience like? This description is largely based
    on *Second Life* c.2008, but whilst some of the details may have changed, the
    basic experience hasn’t. It is also generally applicable to other virtual worlds
    and proto-metaverses.

    > >

    > > You sign up for an account on the Second Life website and download the Viewer
    application. In the early days, Linden Lab made only a small'
