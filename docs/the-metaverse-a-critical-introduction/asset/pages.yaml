    of various SDGs, not only addressing them in the digital realm, but also by transforming
    the material word connected to SDGs. However, the metaverse’s development, construction,
    and imple- mentation can create challenges to sustainability.


    # ## Human versus AI Avatars


    At present, most of the avatars that a user meets in a social virtual world will
    be controlled by other humans. Automated (i.e. computer-controlled) avatars may
    be present in a world as helpers, guides, or non-player characters, and some worlds
    (e.g. gaming experiences) may have more automated avatars (sometimes called robots)
    than human avatars, but human-controlled avatars still generally dominate in virtual
    worlds. But will this situation persist?


    First, it should be noted that automated avatars need not be synonymous with AI-driven
    avatars – although that may increasingly be the case. Most current automated avatars
    are driven by very simple scripts. The games industry has been a significant player
    in developing ever more complex behaviours in their non-player characters (e.g.
    da Silva & de Souza Ribeiro, 2021), but virtual worlds have also been identified
    as a useful (and perhaps ideal) environment in which to explore the development
    of grounded and embodied AI (e.g. Burden et al., 2016).


    A key element of a virtual world is that when confronted by another avatar, a
    user has no initial way of knowing whether the other avatar is human or computer-controlled
    – the engagement instantly becomes a variation on the Turing Test (Shah et al.,
    2016). As a result, virtual worlds are ideal places to hold covert Turing Tests
    in order to see whether, when not even prompted that another avatar may be computer-driven,
    a human can spot whether the avatar they are engaging with is human- or computer-controlled.
    As mentioned in Chapter 5, in one test that David helped staged, even when prompted,
    only 22% of participants correctly identified an avatar as being computer-controlled
    (Gilbert & Forney, 2015).


    Apart from purely computer-controlled avatars increasingly being found in service,
    support, and assistant/companion roles in virtual worlds, the idea of avatars
    which are optionally computer-controlled might be a'
