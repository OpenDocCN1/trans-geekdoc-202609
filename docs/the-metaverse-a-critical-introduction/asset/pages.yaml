  md: 'could be used either directly by scripted objects (e.g. ultrasound or electromagnetism
    detection in animal avatars) or for conversion into visual or audio senses for
    human-controlled avatars. Interestingly, it is the military which is particularly
    interested in so-called hyper-spectral modelling in order to better represent
    issues such as camouflage, thermal signatures (BlSim, 2023), radar, and electronic
    warfare (Wihl et al., 2010).


    # Scenes


    The scene is all that is around the user in VR (which could be as small as a room
    or potentially as large as a world) and is typically represented as a hierarchy,
    as shown in Figure 4.5. This is often referred to as the scene graph and is similar
    to the document object model, which defines a web page. The scene graph tells
    the rendering system what to render and where.


    The scene might be composed using a drag-and-drop editor such as Unity or Unreal,
    or it might be written in code such as WebGL – which can also be generated by
    Unity and Unreal. This code can also define the interactivity of the scene, as
    with a Javascript application embedded in a web page. In fact, it was the three.js
    Javascript library (https://github.com/mrdoob/three.js) that made WebGL, creating
    3D scenes within ordinary 2D web pages, usable to a wider range of developers.
    The babylon.js library (https://www.babylonjs.com/) further extended what could
    be done in 3D on the web with a library that included physics, animation, and
    fluid modelling, and a dedicated web-based editor/game engine, but at the cost


    ![](img/a1f0838ef56b3ffb455ace32842c1458_135_0.png)


    FIGURE 4.5

    A prototypical scene graph for a virtual world.'
