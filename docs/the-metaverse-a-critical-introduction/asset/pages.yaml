- pgno: 105
  md: 'into a virtual wall, you’ll feel a real wall, and if you encounter some virtual
    stairs, you’ll have to physically walk down them.


    In some ways, this is the closest experience that currently exists to the *Star
    Trek* holodeck experience. A significant amount of investment has been going into
    this industry, with one of the (self-declared) more cautious forecasts seeing
    the market growing from around $2 billion in 2018 to nearly $9 billion by 2028
    (Mordor, 2023). Whether they count as part of a metaverse is moot – they are certainly
    using metaverse technology and are highly social in nature – but they are fundamentally
    stand-alone experiences with no persistence and minimal opportunity to subvert.
    However, in a more complete Metaverse, such spaces could be co-opted to support
    a wider range of both entertainment and serious (e.g. training) activities and
    so just become a different user interface for the Metaverse.


    # Arts and Literature


    The most visible use of metaverse technologies by artists has been in virtual
    installations and art galleries, such as a virtual Tate Gallery in *Minecraft*
    (Styles, 2016) and the use of HMD-VR to access virtual Art Galleries and explore
    famous works of art (ARTDEX, n.d.). However, whilst being able to walk into a
    painting and experience it from inside can offer people a unique perspective on
    the art, the real opportunities come in creating art that is only possible using
    metaverse technologies and in metaversal spaces. Hagerty (2012) explores some
    of the more philosophical perspectives on art within virtual spaces, and interesting
    examples of XR-native performances include:


    +   * Shakespeare’s *Hamlet* in *Grand Theft Auto Online* (Vincent, 2021);

    +   * The Royal Shakespeare Company’s performance of *A Midsummer Night’s Dream*
    which had the audience at home controlling fairy sprites which were visible to
    the performers, along with the virtual set, in their HMDs (https://audienceofthefuture.live/dream/);

    +   * Immersive theatre company Punchdrunk’s #BelieveYourEyes production for Samsung,
    a ghost story mixing VR video and interaction with a physical performer (https://www.punchdrunk.com/project/believe-your-eyes/);

    +   * The Opera Beyond project by the Finnish National Opera and Ballet (https://operabeyond.com/);
    and

    +   * The short-form immersive musical, an “immersical”, being developed at the
    University of York (Lock & Stewart-David, 2022).


    Another aspect is how the Metaverse can help art historians and academics to better
    understand the art of the past. A notable project in the early days of *Second
    Life* was Theatron, which recreated theatres and performance spaces'
