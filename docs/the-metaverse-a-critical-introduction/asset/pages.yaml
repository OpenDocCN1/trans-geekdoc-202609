  md: '# Business to Business Use Cases


    # The Industrial Metaverse


    The “industrial metaverse” has been defined as “a subset of the metaverse focused
    on production, maintenance and collaboration between experts in the field of industry”,
    with digital twins (see below) as perhaps its most important part (Bellalouna
    & Puljiz, 2023). The purpose of the industrial metaverse is “to speed up processes
    like repairs/maintenance, starting new manufacturing lines, remote monitoring/troubleshooting,
    remote control, and new user/manager training through simulation” (J. Lee & Kundu,
    2022). As such, it draws on many of the collaborative tools described at the beginning
    of this chapter, as well as the training and education opportunities, and adds
    the digital twin concept. A 2023 “Metaverse at Work” survey by Nokia and EY (and
    hence interested parties) looked at businesses in the automotive, manufacturing,
    logistics, and utilities sectors. The survey found that organisations were seeing
    benefits in “capital expenditure (capex) reduction, sustainability and safety
    improvement”, although “enterprises saw the highest potential in the use of extended
    reality (XR) for training to onboard and upskill the workforce, while three out
    of the four industries surveyed chose the use of virtual research and development
    to enhance product design and processes” (O’Halloran, 2023). Some see that the
    industrial metaverse might eclipse the consumer one (Lawton, 2022).


    # Design


    The use of 3D tools to support product and built environment design dates back
    to at least the 1960s (Tornincasa & Di Monaco, 2010). One of the main downsides
    of the high-gloss renders that are typical of modern design outputs is that they
    are typically not rendered in real time, but, like computer-generated imagery
    (CGI) movies, are rendered (often overnight) and then made into video (Ratcliffe
    & Simons, 2017). At the other end of the spectrum, the tools that support the
    actual machining of a part, or the construction of a building, take a very low-level,
    database-like approach to the problem, traditionally using wire-frame graphics
    although this is now being supplemented by real-time renders (Johansson et al.,
    2015). The Building Information Modelling (BIM) standard (https://www.bsigroup.com/en-GB/iso-19650-BIM/)
    is a way of trying to manage the flow of information between the design, build,
    and maintain sections of the product lifecycle (Razali et al., 2019). BIM information
    can be used to support both VR and MR visualisations of a new building (Y. Huang,
    2020; Wen & Gheisari, 2020).

    However, these two approaches typically leave out the user, whereas the virtual
    world offers an ideal opportunity to embed participation in the'
  merge: -1
  img_proc: true
