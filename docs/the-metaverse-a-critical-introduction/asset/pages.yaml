- pgno: 142
  md: 'Meta’s Horizon World (Truly, 2023), so hopefully the de-limbed and disembodied
    avatars will only be a passing phase.


    Whilst locomotion animations are triggered automatically as the avatar moves,
    animation in-place (including dance moves) and expressions were (and generally
    still are) triggered manually by the user in DesktopVR (e.g. by function keys),
    or automatically from keywords in chat (e.g. typing “No” would also result in
    a shake of the head). It is also notable that having “idling” animations that
    just move an avatar a bit, shifting weight from foot to foot, or fidgeting with
    the hands, really enhances the realism of a scene.


    With the arrival of HMD-VR, and now hand-tracking, a lot of these animations-in-place
    are no longer required as they are created by the natural movements of the user
    – but such gestures still need to be made available to DesktopVR users; otherwise,
    it can be very obvious just from arm positions who is on HMD-VR and who is on
    DesktopVR.


    One of the last challenges is real-time facial animation, both when talking and
    smiling or frowning, etc. – which can significantly enhance the realism of social
    interactions. Initial approaches involved using a webcam to detect facial expression
    and have it animate an avatar’s face (e.g. Apostolakis & Daras, 2015). The latest
    generation of headsets (e.g. Oculus Quest Pro, Apple Vision Pro) has small back-facing
    cameras to detect facial expression and eye movement and to pass these on to the
    avatar (Lang, 2022).


    There are though some interesting issues of privacy and deception. For instance,
    your expressions could be better (i.e. automatically) detected and brought to
    the attention of the person you are speaking to and may belie the veracity of
    what you are saying. Alternatively, you might run software to mute, accentuate,
    or invert the expression feed your headset is sending out into the world.


    # Avatar Interaction


    In early DesktopVR worlds, text-chat tended to dominate, but now voice is the
    norm, and it is typically spatial audio – so sounds are localized in space and
    come from the direction of the speaker and at a volume consistent with their distance.
    However, text-chat has its advantages – it masks a user’s physical nature if their
    avatar is divergent from it (see the earlier discussion on the introduction of
    voice to Second Life in Chapter 1), it provides a useful backchannel during collaborative
    sessions, and it creates a more equitable discussion space (Nesson & Nesson, 2008).
    Against this voice is really the only option in HMD-VR at the moment – although
    decent virtual keyboards might address this. But human interaction isn’t just
    about voice – it’s about expressions and gesture and other forms of body language
    as well. Easy access to 2D and 3D emoticons, as well as to gestures and expressions,
    is one way of capturing the non-verbal elements of communication. The potential
    for haptics to enable other modes of avatar interaction will be considered below.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Virtual Agents


    All these characteristics also apply to virtual agents embodied as non-player
    characters (NPCs). Such NPCs may be acting as game characters, or as guides, receptionists,
    shop assistants, personal assistants, training partners, coaches, tutors, or even
    as embodied versions of physical world applications or as virtual versions of
    ourselves when we’re not around. A key question is where does the “brain” of that
    virtual agent lie? As discussed in Virtual Humans (Burden & Savin-Baden, 2019),
    it probably shouldn’t lie in the virtual world. It needs to be written in industry-standard
    code, running on a generic server somewhere on the Internet, and then using an
    application programming interface (API) to receive information from the virtual
    world, and to send commands to its avatar (or avatars) within the world (or worlds).
    And ideally, that avatar needs to be able to do everything that a human-controlled
    avatar can do.


    In 2017, David helped run an experiment with such a chatbot programme controlling
    an avatar in Second Life in a covert Turing Test. Of the users who interacted
    with the agent, 78% thought it was human operated (Gilbert & Forney, 2015). Virtual
    worlds really level the playing field when it comes to telling chatbots from humans
    (Burden et al., 2016). Certainly, at the time of the experiment, people’s working
    assumption was that an avatar was probably human driven, so the agent just had
    to make sure it didn’t give away the fact that it was a computer, rather than
    having to try to convince the user that it was human.


    Virtual worlds can act as useful virtual laboratories for working with theories
    of embodied and grounded cognition as they represent messy and complex worlds
    in a way that the traditional “block world” research spaces don’t and save researchers
    from all the hassle of building physical robots to experiment within the physical
    world. Lucy, the protagonist agent in Fable Studio’s Wolves in the Walls (Billinghton,
    2018), is one of the best implementations so far of a virtual agent within a VR
    space in terms of her ability to address you personally and directly wherever
    you are in the room and to really draw you into her story.


    # Interactivity


    This section considers how the user interacts with the environment itself. At
    its most basic, it’s about touching/clicking on objects and buttons, or with head-mounted
    display XR (HMD-XR) and hand-tracking reaching out and touching and manipulating
    something, but this should come as no surprise as that is fundamentally how humans
    interact with the physical world.


    # Tools


    Most virtual worlds provide a selection of generic tools to support collaboration
    as described in Chapter 3, including virtual whiteboards and post-it notes, screen-share,
    and 3D drawing tools. If, as it should, the world also'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'has building, editing, scripting, and marketplace tools, then users should
    be able to create any tools they want, no matter how niche, and make them available
    – for free or at a cost, to other users. The range of tools should not be something
    that is limited by the platform owners.


    Just as the physical world has seen smartphones and tablets supplant what used
    to be multiple separate tools, so too might virtual tablets and virtual smartphones
    make other functionality available in a familiar form factor, and especially in-world
    and cross-world apps (such as note taking, messaging, video recording, etc.).
    At some point, there might even be the ability to have all of a physical tablet’s
    capabilities, apps, and data echoed onto their virtual version (something which
    Apple’s Vision Pro is beginning to do), and the ability for the user to script
    custom applications for their virtual tablet.


    # ## Building


    Being able to create or build (and not just place) objects inside of the Metaverse
    is essential; otherwise, it is just somebody else’s VR application. The import
    of objects should, though, also be supported so that more powerful external build
    tools (like Blender, etc) can also be used. Many of the current crop of virtual
    worlds (e.g. ChatVR, Fortnite, Decentraland, Roblox) require users to use Unity,
    Unreal, or a custom external editor in order to build a space and any objects
    they want in it. Second Life/OpenSim is probably still the best example of how
    to do proper in-world building, although it is also a feature of Minecraft and
    Somnium Space.


    # ## Scripting


    Whilst many worlds allow for object placement, and even modification, very few
    allow for in-world scripting. This is likely primarily due to performance management
    and security issues – a bad script can wreak havoc with a space or be used for
    deliberately malign purposes against users, their accounts, or the platform itself
    (Muttik, 2008). As an example, back in 2007, David set up an artificial life script
    on his sim in Second Life – it got out of control and replicated itself all over
    the place and crashed the entire sim!


    If users are going to be able to create interactive objects and tools in the same
    way that they might create gadgets or apps in the real world, then the Metaverse
    must support scripting, preferably based on an easy and commonly used language
    such as Javascript. For simpler tasks, a drag-and-drop or visual block programming
    language (like Scratch) might be useful. Meta’s Horizon Worlds is using both drag-and-drop
    and visual block programming to reasonable effect (MetaQuest, n.d.), whilst Ova’s
    StellarX (2022, https://www.stellarx.ai/) has a very slick drag-and-drop system
    for graphically flow-charting interactions. Hiberworld (2018, https://hiberworld.com/)
    has a similar, if less fully featured, scripting interface. Frame started to support
    scripts in early 2024, but, as mentioned earlier, it uses the Wonderland scripting
    language and so has a steep learning curve for even the most basic interactions.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_145_0.png)


    **FIGURE 4.7**

    Plotting real-time air traffic control data in a virtual world.


    Whilst Linden Scripting Language (LSL), as used in *Second Life* and *OpenSim*,
    may not be as familiar as Javascript, it still provides an easy-to-use yet powerful
    in-world scripting capability not yet equalled in other worlds.


    Scripts should also allow code to be written that can bring in data from the rest
    of the Internet, and by extension the physical world. For instance, physical geotemporal
    data (e.g. weather, earthquakes, or air traffic information – see Figure 4.7)
    can be plotted on a virtual map or globe, or states or commands can be passed
    to control actions in the virtual world in one direction – e.g. a physical light
    switch turning on a virtual light, or in the other direction, the movements of
    an avatar can create a soundscape in the physical world.


    Although they are trivial examples, they show how the virtual and physical can
    (and should) be part of the same larger multiverse. If users want as much agency
    in the virtual world as they have in the physical world, they’ll need to be able
    to access the same information and systems as they do every day. These interfaces
    also let developers build the core of any big applications out on the Internet
    using industry standard tools and just treat the virtual world as the user interface.
    Developers need to build for the single multiverse, covering the virtual, digital,
    *and* physical worlds.


    # ## Voice Control


    One of the downsides of HMD-VR is that virtual keyboard interaction is currently
    quite problematic – which can make detailed building and scripting tasks and even
    simple text-chat or note taking, difficult. Hopefully, virtual worlds will increasingly
    see support for voice control for their interfaces, both through explicit commands
    and some sort of in-world or in-headset personal assistant. Recent developments
    around using generative adversarial networks (GANs), ChatGPT, and similar technologies
    for not only text and'
  merge: -1
  img_proc: true
- pgno: 146
  md: '2D imagery but also 3D modelling begin to give a hint of the future power of
    voice control, where a user could stand in an empty holodeck style space and just
    say something like “give me a beach with a blue ocean, dancing dolphins, some
    coconut palms and a large daiquiri”, and it all just appears (Chow, 2023). GOXR
    (https://www.xrspace.io/us/goxr) already has NPC avatars that users can talk to
    verbally, and Hiberworld (https://hiberworld.com/) has some primitive AI scene
    rendering from a simple text description, so merging the two capabilities cannot
    be far off.


    # Ecosystem Tools


    Not everything required to run a Metaverse is immediately visible to the user,
    and it is many of the features that are described in this section that begin to
    separate a social virtual world or metaverse-type space away from more generic
    multi-user VR applications. Radoff’s eco-system model in Figure 2.2 is also a
    useful guide to the different range of tools required and highlights the need
    for discovery tools which will exist partly outside of the metaverse and of any
    one ecosystem.


    # User Management


    Like any social application, there will be a need for a user management layer.
    This controls not only application and world access but also:


    +   • Profile information, including:

    +       • Areas of interest;

    +       • Links (if desired) to profiles on other social networking sites;

    +   • Friend links, and the ability to find, add, and remove friends;

    +   • Group links, and the ability to find, join, leave, create, message, and
    remove groups;

    +   • Money and transaction information and control; and

    +   • Security management.


    # Rights and Permissions


    If users are going to buy, make, or sell things in the Metaverse, then there needs
    to be some way to protect intellectual property (IP) and restrict permissions.
    A common model is for objects, scripts, and places to have an assigned owner (which
    could be an individual or a group), and then a set of permissions to allow other
    individuals or groups, or anyone, to access/use, copy, modify, sell, or delete
    the entity. Things get more complex when artefacts'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'start to be built up from multiple entities. This may be an area where blockchain
    could actually help, and this is discussed further below.


    # Market/Economy


    If the virtual world creator doesn''t provide what a user needs, then why not
    get it from another user? Worlds such as Second Life, Minecraft, and Roblox have
    active in-world marketplaces based around user-generated content.


    Some form of virtual currency is almost certainly needed in the Metaverse, and
    that currency should be freely exchangeable with real-world currencies. Some of
    the work on studying Second Life''s virtual economy was discussed in Chapter 1.
    Many of the current crop of virtual worlds (the cryptoworlds) are using cryptocurrencies
    such as Bitcoin or Ethereum as their base, but these have potential issues with
    both their environmental credentials (see Chapter 5) and are subject to hacking,
    speculation, and profiteering. Again, the role of cryptocurrencies is dealt with
    in more detail below.


    # Standards and Portability


    Everything so far described is work that one development company could build into
    their own world – but the real challenge is how a user can take their avatar,
    money, objects, and even scripts and move between different virtual worlds or
    metaverses.


    As discussed in Chapter 2, it''s probably unrealistic to think that there will
    only ever be one metaverse, so if the future is the Multiverse, then the issue
    of portability needs to be addressed. Of course, portability is something which
    barely exists even on the World Wide Web (all those multiple accounts, different
    profiles, etc), so it''s no surprise that it doesn''t exist in virtual worlds
    yet. Even object “standards” such as .obj and .fbx mentioned above, which should
    enable that an object can be moved seamlessly between platforms, frequently fail.


    There are some positive signs. The new 3D object standard glTF is proving to be
    far more portable than earlier standards and has been adopted as an International
    Standard, ISO/IEC 12113:2022 (https://www.iso.org/standard/83990.html). Even though
    the Metaverse Roadmap (MVR) (Smart et al., 2007), established as a cross industry
    body in 2007, fell by the wayside, multiple new groups are taking up the challenge
    to establish standards for the metaverse:


    +   • The Metaverse Standards Forum (https://metaverse-standards.org/) aims “to
    foster interoperability standards for an Open Metaverse” and seems to have the
    largest membership, including most of the industry key players, and an active
    set of “domain groups”;'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   • The Open Metaverse Foundation (https://www.openmv.org/) is “home to an
    open, vendor-neutral community dedicated to creating open standards and software
    to support the open, global, scalable Metaverse”, with one of its main projects
    being O3DE, an open-source game engine in the same space as Unity and Unreal,
    although it says that it is also working on developing open standards for object
    portability;


    +   • The Open Metaverse Alliance (OMA3) (https://www.oma3.org/) is a “collaboration
    of Web3 metaverse platform creators” whose goal is to “ensure virtual land, digital
    assets, ideas, and services are highly interoperable between platforms and transparent
    to all communities”. As such, it is closely wedded to the Web3 and blockchain
    approaches;


    +   • The Open Metaverse Interoperability Group (OMIG) (https://omigroup.org/)
    describes itself as “an open source community of industry professionals, independent
    creators, and passionate enthusiasts building interoperable technology together,
    in the open”, and aims to bridge “virtual worlds across interfaces and technologies
    by designing and promoting protocols for identity, social graphs, inventory, and
    more”;


    +   • W3C(who run the World Wide Web standards) maintains a Metaverse Interoperability
    Community Group (https://www.w3.org/community/metaverse-interop/) and is also
    a member of the Metaverse Standards Forum;


    +   • The International Telecommunications Union (ITU) has its own Focus Group
    on the Metaverse (FG-MV) (https://www.itu.int/en/ITU-T/focusgroups/mv/Pages/default.aspx)
    looking at “pre-standardisation” work, analysing “the technical requirements of
    the metaverse to identify fundamental enabling technologies in areas from multimedia
    and network optimization to digital currencies, Internet of Things, digital twins,
    and environmental sustainability” and examining the role of international standards
    (ITU, 2023); and


    +   • The Alliance for OpenUSD (https://aousd.org/) promotes OpenUSD as described
    above.


    # User Interfaces


    User interfaces have been deliberately left to last as whether the user is accessing
    the Metaverse from their smartphone, laptop, desktop, or HMD should be immaterial
    to the Metaverse itself.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# DesktopVR


    This is the umbrella term for accessing a 3D environment through a single 2D screen
    as found on conventional desktops, laptops, and smartphones. It may not have the
    same technical level of immersion as HMD-VR, but as explained in Chapter 2, technical
    immersion is just one part of the whole immersion/presence/embodiment/agency calculus,
    and as long as the rest of the experience is well designed the user will still
    get most of the benefits of the environment. Compared to HMD-VR, Desktop VR is
    also cheaper and a lot more convenient, and users are almost immune to cybersickness.


    For both DesktopVR and HMD-VR, access via the browser using WebXR as described
    in Chapter 1 is a preferable way to deliver worlds to users – removing the need
    for downloads. It should also be noted that VR experiences typically take less
    bandwidth across the Internet and wireless connections to operate than video conferencing
    calls (A. G. Campbell et al., 2020).


    # HMD-VR


    Ever since Palmer Luckey released Oculus DK1 in 2013, the media focus has been
    on the HMD-VR experience. With each generation of headsets screen resolutions,
    dynamic ranges, fields of view, and battery life have tended to increase, latency
    and weight have decreased, and the whole HMD-VR experience has become more comfortable
    and natural. As of 2023, the latest headsets, such as the Meta Quest 3, Varjo
    XR-3, and Apple Vision Pro, now feature forward-facing colour cameras to support
    mixed reality, and some even have back-facing cameras to detect eye-movement and
    expression. OpenXR (https://www.khronos.org/openxr/) is emerging as an open-source
    standard for how HMD-VR devices operate.


    # DesktopVR or HMD-VR


    The choice between a DesktopVR experience and an HMD-VR is one that the user should
    be able to make on a per-session basis, and it should not be dictated by the application.
    There are so many use cases where HMD-VR is not feasible (on the train, in a cafe,
    on the sofa half-watching TV, etc.), and Chapter 2 has already presented some
    of the research comparing DesktopVR and HMD-VR.


    A key issue is that HMD-VR still doesn’t have significant market penetration.
    The install base for HMD-VR is currently estimated (to the end of 2022) at around
    50 million units, with Meta Quest 2 accounting for around 46% of sales in 2022
    (S. Campbell, 2023). Assuming all these headsets are in use, that puts global
    penetration at only 0.6%, as against around 55% for the mobile internet (GSMA,
    2023). A 2021 report looking only at Minority World¹ countries estimated that
    household penetration for HMD-VR was around 2.4% (Jijiashvili, 2021). Estimates
    of HMD-VR growth rates are not spectacular with'
  merge: -1
  img_proc: true
- pgno: 150
  md: "one analyst downgrading their forecast in 2023 and predicting HMD-VR sales\
    \ to grow from around 10 million per year in 2023 to around 18 million in 2025\
    \ (Erl, 2023). As a result, a twin-track strategy supporting both DesktopVR and\
    \ HMD-VR has to be the logical choice, with any metaversal space being able to\
    \ support both classes of interface.\n\n# Mobile\n\nThe mobile is effectively\
    \ just as specific case of DesktopVR. Modern smartphones have the processing power,\
    \ screen resolution, and even screen size to render all but the most complex virtual\
    \ environments without too much difficulty. There are, however, a few mobile specific\
    \ issues worth considering:\n\n+   • The bandwidth of the wireless connection\
    \ may be too limited to support all the change updates from the game server. As\
    \ such, a metaverse might support different levels of details (LODs) so that objects\
    \ are shown more simply if bandwidth or viewing device is limited.\n+   \n+  \
    \ • A user might want to attend a meeting in the Metaverse, or conduct some activity\
    \ in the Metaverse, but not have the focus or bandwidth to support a fully immersive\
    \ session. The user should be able to join the meeting as just a webcam view on\
    \ a screen or robot, and/ or be able to access the Metaverse in a top-down 2D\
    \ map mode.\n\n# CAVEs\n\nCave automatic virtual environments (CAVEs) are VR delivered\
    \ by a walk-in environment where typically three walls (but potentially up to\
    \ all six sides) are full screen displays and whose view may change as the user\
    \ walks around inside the space (Muhanna, 2015). The downside is that they are\
    \ costly, tend to be single installations within institutions (so have to be booked),\
    \ and take time and money to maintain (Havig et al., 2011). Now largely transplanted\
    \ by HMD-VR, they are still a viable interface model for some use cases for the\
    \ Metaverse, particularly if there is a need for spectators, and any metaverse\
    \ should probably be flexible enough to support CAVEs and similar dome type displays,\
    \ and perhaps even immersive projection venues such as London’s Lightroom and\
    \ New York’s Lightbox.\n\n# 360° Video VR and Stereoscopic Video VR\n\n360° Video\
    \ VR and Stereoscopic Video VR are alternative ways to use a VR headset. Rather\
    \ than being in a 3D world where they can move anywhere they want, the user instead\
    \ is just watching, and possibly interacting with, a movie – even if it is one\
    \ which is all around them. A lot of current HMD-VR"
  merge: -1
  img_proc: true
- pgno: 151
  md: 'content is actually 360 VR, where the user can look around within the video,
    but they have no agency within it. Stereoscopic Video VR again uses video but
    is filmed with twin video cameras to produce a stereoscopic video pair which,
    when viewed through the VR headset, gives a real sense of depth to the video and
    a greater sense of immersion – the result is that there is a far more visceral
    reaction to what is being viewed. The technology can be used to provide structured
    inter-personal training as it delivers more emotional engagement than simple 2D
    video or 3D avatars. However, Video VR experiences are really just a tool for
    a set of specific use cases, rather than an inherent part of the metaverse since
    they lack the interactivity and agency that a modelled 3D environment provides.


    # Video Streaming


    Video streaming, also called cloud gaming, delivers virtual world (and gaming)
    experiences to devices with reduced processing power – such as mobile phones.
    By doing the rendering of the scene on a central server and then just sending
    a resultant video feed to the user device, the virtual world or game can be made
    more accessible as the end-user device just has to show the video and capture
    and transmit any player interaction. Second Life experimented with the concept
    in 2012 (IGN, 2012). Google offered the Stadia service to support video game streaming
    from 2019 to 2023 (Carrascosa & Bellalta, 2022), and whilst a number of cloud
    gaming services are currently on offer, the reception has been mixed (e.g. Perry,
    2023). As the power of smart phone processors increases, there is an increasing
    debate around the need for such an approach other than for all but the most demanding
    games (e.g. Coleman, 2023). As noted elsewhere, there is not necessarily a link
    between the Metaversal experience and the level of resolution, and ideally a metaverse
    should be able to natively support clients running at whatever level of resolution
    and detail they can support.


    # Haptics


    Haptics is the way of making the user feel the things that they are touching in
    a virtual world. Computer games often have “haptic” controllers that vibrate when
    driving a vehicle or being shot at. Of more interest though are haptic gloves
    for use in VR, such as those from HaptX (https://haptx.com/). Here, actuators
    in the glove provides some force-feedback to give the user the sense of actually
    feeling, touching, or holding something in the virtual world. One of its most
    interesting use cases is that it lets the user replicate the physical world behaviour
    of looking at where something is, but then turning away to return visual focus
    on something else whilst using touch alone to reach out and pick the object up.
    Haptics can also extend to the whole body. Teslasuit (https://teslasuit.io/) has
    made an eponymous whole-body haptic suit which can simulate shocks or touch'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'across the user’s entire body, whilst OWO Games’ Skin (https://owogame.com/)
    is a t-shirt equivalent.


    A simpler approach to haptics, particularly with HMD-VR, is providing users with
    a physical controller that represents the physical device – ideally a version
    of the actual physical device which has simply been instrumented for VR use (e.g.
    Saghafian et al., 2020). This approach is already being used in military, medical,
    fire, and construction VR training, providing instrumented guns, surgical instruments,
    fire extinguishers, and hoist controllers for users to train on in the virtual
    world.


    # ## Locomotion


    One area where the sense of immersion often falters in virtual worlds is with
    movement. Controlling an avatar by joystick, cursor keys, or the ASDF keys of
    a keyboard seems clunky. In DesktopVR, and even more so in HMD-VR, point and-click,
    where the user clicks on a destination and the avatar then navigates itself there,
    can be a more reliable way to navigate but can break the connection between a
    user and their avatar. In HMD-VR in particular, watching your avatar move, whether
    on auto-pilot or under joystick control, whilst your physical feet are firmly
    fixed to the floor just doesn’t seem right. With the advent of room-scale tracking,
    users can now naturally walk around a space in HMD-VR, assuming they have an equivalent
    empty space in the physical world, but for other situations, alternative solutions
    are required.


    Over the past decade or so, there has been significant research into the use of
    devices such as 360° treadmills, slippery shoes, and other technologies in order
    to allow users to “walk” in VR whilst staying in the same physical location. A
    useful overview of the research and a proposed taxonomy for VR locomotion has
    been presented by Boletsis (2017). However, cost, space, reliability, ergonomics,
    and other issues have so far kept solutions from the mass market (Hooks et al.,
    2020).


    Flying in virtual worlds avoids the leg locomotion problem but is typically more
    suited to longer distance travel. There have been some amusing projects to investigate
    the use of arm-flapping and wind generators to enhance the flying experience (e.g.
    https://birdlyvr.com/). Bicycle simulators have also been explored (e.g. https://virzoom.com/vzfit-2/),
    particularly with respect to the exercise and fitness markets.


    Another approach has been to use a brain-computer interface (BCI) to control avatar
    movement (Alchalabi et al., 2021), but until the brain can also be supplied with
    the sensation of the actual movement, this is as much a half-solution as many
    of the others.


    # ## Augmented and Mixed Reality


    Both AR and MR devices are valid interfaces to the Metaverse, and the Metaverse
    should be able to support whatever interface device the user has'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'and display relevant information in an appropriate way. AR tends to be single
    user and relatively passive, so it is MR that is more relevant.


    MR displays – implemented by a headset, which may eventually reduce in form-factor
    to a set of glasses or even contact lenses – overlay 3D objects and information
    onto the user’s view of the physical world. This can provide complex information
    to support navigation, or place virtual models in front of the user to play with
    or learn about, or annotate physical equipment to help in maintenance, and in
    both cases put virtual colleagues, friends, or tutors in the room with the user.
    MR could also re-write reality, re-interpreting almost everything the user sees
    and overlaying it with something out of a fantasy world or a science-fiction setting
    (Vinge, 2006). With the appearance of colour video pass-through on VR headsets
    (e.g. the Meta Quest Pro, Meta Quest 3, Varjo XR-3, Apple Vision Pro) enabling
    MR-like capabilities, the distinction between VR and MR headsets is slowly blurring,
    and HMD-XR may be a more useful descriptor for the hardware, although the HMD-VR
    and HMD-MR experiences remain distinct, even if instantly switchable.


    # Brain-Computer Interfaces


    Whilst each generation of HMD-VR devices is improving, the approach of using purely
    visual and audio display and externalized body tracking has significant issues
    and limitations – not least the locomotion and sense challenges identified above.
    Researchers are working on BCIs for virtual environments, but these are currently
    limited to tracking electroencephalogram (EEG), electrocardiogram (ECG), and similar
    brain signals in order to add additional discrete control capabilities through
    an HMD-VR headset (e.g. Cassani et al., 2020). Putze (2019) discriminates between
    active BCI which “allow users to issue commands to devices or to enter text without
    physical involvement of any kind” and passive BCIs which “monitor a user’s state
    (e.g., workload level, attentional state) and can be used to proactively adapt
    the VR/AR interface”. Another useful distinction is between invasive (where electrodes
    and similar devices are implanted through the skull through surgery) and non-invasive
    (where sensors sit on the surface of the skin) BCIs (Zhao et al., 2023).


    In terms of generating the VR experience directly in the brain research is at
    a very early stage (e.g. Morris, 2018), but organisations such as DARPA are already
    beginning research into “high-performance, bi-directional brain-machine interfaces”
    (DARPA, 2019). Technology may be many decades away from the sort of “holoband”
    interface device and experience shown in Caprica (Aubuchon & Moore, 2010), but
    it may be that it is not until there is a neural interface to the Metaverse that
    will give the user the ultimate in technical immersion that the fullest promise
    of the Metaverse will be delivered, and it becomes a truly everyday service.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Artificial Intelligence and the Metaverse


    The recent advances in AI, particularly in neural networks, generative adversarial
    networks and large language models, are all having an impact on how AI can contribute
    to the creation of metaversal experiences. Some of the principal uses of AI for
    the Metaverse are in:


    +   - Conducting the edge and object detection in an HMD-XR headset in order to
    build the model of the physical world with which digital objects will exist (Rokhsaritale
    mi et al., 2020);

    +   - Speech recognition to support voice interaction with NPC avatars (already
    in GOXR) and the metaverse application itself (Siyaev & Jo, 2021);

    +   - Natural language communications and chatbot development (already in Frame)
    using systems such as ChatGPT without the need to hard-code responses (Lv, 2023);
    and

    +   - Generating virtual scenes either procedurally at scale prior to need (e.g.
    Deitke et al., 2022) or on demand from the user (e.g. Viviani, 2023) – a basic
    version is already in Hiberworld, and for skyboxes in Frame.


    A survey of metaverse applications of AI is provided by Huynh-The et al. (2023).


    # Blockchain, Cryptocurrencies, and NFTs


    Many of the newer proto-metaverses such as Decentraland and Somnium Space are
    based on the blockchain and cryptocurrencies, so it is important to understand
    the potential role of these technologies in any future metaverse.


    A blockchain is fundamentally a distributed, secure, and digital ledger – a way
    of recording transactions and information in a way that cannot be changed, and
    which shows complete traceability for every transaction. A cryptocurrency, such
    as Bitcoin or Ethereum, is essentially just the use of a blockchain to implement
    a currency system, recording who owns what and who has given what to whom (Nakamoto,
    2008). A NFT, such as being used to market art works and GIFs, is simply a token
    (i.e. a piece of information) tracked on a blockchain which links to an image
    or object, and of which there are typically only a limited number of copies. Useful
    introductions to the blockchain, cryptocurrencies, and NFTs are provided by Vasquez
    (2021) and Tysver (2023).'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'One of the key problems of blockchain systems is the excessive computing power
    needed to generate new tokens or coins (called “mining”) and to update the encrypted
    ledger entries. One estimate in this hotly debated area is that 36% of the energy
    requirements of a blockchain-based metaverse could come from the blockchain transactions
    (Liu et al., 2023). This will be further considered in Chapter 5, along with some
    potential solutions to the problem.


    A second issue is that the blockchain is only as secure as its user interface,
    and the media is full of reports of cryptocurrency systems and users accounts
    being hacked and people’s savings lost from attacks against the periphery of the
    infrastructure. An estimated $88 billion has been lost through Bitcoin hacks alone
    (at 2021 pricing) between 2011 and 2021 (Charoenwong & Bernardi, 2021).


    Thirdly, cryptocurrencies and NFTs are being treated by many as get-rich-quick
    schemes, where the physical world price of an NFT, a crypto-coin or a piece of
    virtual land or even clothing bought with a cryptocurrency, seems out of all kilter
    with any reasonable value. Of course, any art (and even to an extent currency
    system) is only worth the price that people are prepared to pay for it, but the
    blockchain, cryptocurrency, and NFT markets do seem to have taken this to a level
    reminiscent of the South Sea Bubble. A telling statistic in terms of cryptocurrency
    is the percentage of cryptocurrency holders who are actually using it for payment
    rather than investment. For example, a 2023 US Federal Reserve report showed that
    whilst in 2022 10% of Americans surveyed held cryptocurrency (down from 12% in
    2021), only 2% had used them in payments for goods or services (Federal Reserve,
    2023).


    Opinion on the relationship between blockchain technologies and the future of
    the Metaverse is somewhat divided. Ball (2022) identifies a spectrum of five different
    levels of a relationship between the Metaverse and blockchain, ranging from it
    being wasteful and irrelevant to being an absolutely essential requirement. At
    the latter end of the spectrum, some see that “the Metaverse will not function
    without blockchain technology at its core on an economic level” (Rosa, 2023).
    Narula also sees blockchain technologies and cryptocurrencies as “integral to
    any efforts to build and maintain a bridge for the transfer of value within the
    metaverse”. In contrast, Au notes that none of the current proto-Metaverse platforms
    based on the blockchain have “succeeded in terms of mass growth. Or really, hardly
    any growth at all” (Au, 2023, p. 152).


    The core concept of the blockchain is undoubtably valid and will likely be more
    accepted as a practicable system for wider employment if some of its computing
    requirements and climate impacts can be mitigated. It may well be that it has
    a role in the Metaverse, particularly if cryptocurrency and blockchain concepts
    are more widely adopted within consumer finance and other industries. However,
    in its current form, it is probably doing more harm than good to the evolution
    of the Metaverse by restricting access to'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'some otherwise imaginative proto-metaverses to those who are willing to buy-in
    to the cryptocurrency and NFT investment craze.


    # Summary


    This chapter has provided an introduction to the technologies that are required
    to create a metaverse. It has covered eight broad areas, including the creation
    of 3D environments, navigation and land models, multi-user enablers, avatars,
    interactivity, ecosystem tools, user interfaces, and blockchain technologies.


    The core of any metaverse is how it is presented and navigated as a spatial environment,
    that it operates as a multi-user space, is populated by avatars, and that those
    avatars have interactivity with each other and with that environment, and have
    the ability to freely and readily create within that environment. Game servers,
    eco-system tools, and particularly the sharing of user-generated content and common
    standards are vital enablers. Only after these comes the actual user interface,
    be it HMD-VR, DesktopVR, mobile, MR, AR, or even neural, and as stated, the Metaverse
    should be able to support all modes – and interaction between people using different
    modes. Then only should considerations such as blockchain come in – and largely
    as a technical enabler for the ecosystem tools.


    The next chapter will consider some of the broader, and mostly non-technical issues
    that the idea of a metaverse raises, and which are, in most cases, far harder
    to resolve than the technical challenges.


    # Note


