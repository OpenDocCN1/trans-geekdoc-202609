  md: 'holistic perspective on the whole of the system in a way that is more immediate,
    accessible, context-aware, memorable, and potentially insightful than a spreadsheet
    full of numbers or a 2D graphic.


    # Science and Research


    Whilst much of the scientific use of virtual worlds is covered by the collaboration
    features discussed earlier, or leverages some of the other use cases already described,
    there are a number of more science and research specific applications for metaverse
    technologies and virtual worlds. One of the most obvious – is the ability to subjectively
    experience things at a micro or macro scale – be it examining bonds in a molecule
    (e.g. Seritan et al., 2021) or the interaction and evolution of galaxies (e.g.
    Jarrett et al., 2021).


    The use of virtual worlds to display any data in an immersive, interactive visualisation
    is another significant area of potential use – a disciple referred to as Immersive
    Visual Analytics (Cybulski et al., 2014; Thomas & Cook, 2005). Examples include
    the Immersive Analytics Toolkit (Cordeil & Dwyer, 2019), or David''s own work
    with Datascape (Burden, 2021) – as shown in Figure 3.4. Such visualisations operate
    on an egocentric principle (all the information is relative to viewer), rather
    than on an allocentric basis (where all the information is relative to an arbitrary
    origin) (Klatzky et al., 1998). Since people interact with the physical world
    on a primarily egocentric basis, it may be that they can better explore, interpret,
    and remember data when it is presented in


    ![](img/a1f0838ef56b3ffb455ace32842c1458_111_0.png)


    FIGURE 3.4

    Viewing cybersecurity data within VR using Datascape.'
  merge: -1
  img_proc: true
