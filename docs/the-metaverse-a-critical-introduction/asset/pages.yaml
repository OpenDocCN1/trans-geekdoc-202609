- pgno: 219
  md: '# # Glossary


    **180VR:** Stereoscopic video VR (q.v) where only the forward view is shown in
    order to conserve bandwidth and memory.


    **3DOF:** 3 degrees of freedom, i.e. the ability to look up/down, left/right,
    and tilt left/right.


    **360VR:** Stereoscopic video VR (q.v) where the full 720° around the camera (360°
    up/down and 360° left/right) is recorded.


    **6DOF:** 6 degrees of freedom, that of 3DOF (q.v) plus the ability to move forwards/backwards,
    left/right, and up/down.


    **augmented reality (AR):** overlays digital information onto a viewscreen (typically
    a smartphone, but possibly a heads-up-display or a set of glasses) and supplements
    reality, rather than replacing it.


    **avatar:** a user’s (usually visual) representation of themselves in a virtual
    world, or a similar representation created and controlled by a computer programme.


    **blockchain:** a distributed, secure, digital ledger – a way of recording transactions
    and information in a way that cannot be changed, and which shows complete traceability
    for every transaction.


    **CAVE:** a room where a virtual world is shown on screens occupying the whole
    of at least three walls, either using projection or video screens.


    **chatGPT:** the OpenAI implementation of a chatbot based on a large-language
    model approach, but increasingly being used as a generic term for such chatbots.


    **concurrency:** the (typically maximum) number of users in a virtual world at
    any one moment in time.


    **confederated multiverse:** a multiverse where the constituent metaverses have
    few services or even architectures in common and may operate on more of a peer-to-peer
    basis.


    **constituent metaverse:** a metaverse which is connected to the larger multiverse,
    which may implement local rules and likely runs on its own infrastructure. May
    also be known as a satellite metaverse.


    **cryptocurrency:** a currency based on a blockchain.


    **cryptoverse:** a virtual world which is built on a blockchain and uses a cryptocurrency
    for all payments and receipts.


    **cybersickness:** the nauseous feeling that some people get from using HMD-VR
    headsets.


    **de-rez:** to remove an object from a virtual world and often place it back in
    your inventory, usually with the option to restore it at a later date.


    **desktopVR:** refers to VR experiences delivered using a conventional 2D computer
    screen (desktop, laptop, tablet, or mobile), in either first person (the view
    out of the avatar’s eyes) or third person (an “over'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'the shoulder” view which includes the back of the avatar). A combination of
    mouse, keyboard, joystick, and touchscreen are used for control and interaction.


    **DOXing**: revealing a virtual world user’s physical world identity against their
    wishes.


    **extended reality (XR)**: the umbrella term used for all the technologies that
    create immersive experiences in which users interact with digital content which
    augment or replace the perceived physical world. As such, it includes VR, MR,
    and AR.


    **federated multiverse**: a multiverse where the constituent metaverses share
    common services and even architectures.


    **game server**: a computer whose job is to initially send a copy of a location
    to a user’s computer, to get updates from the user about what they are doing,
    and then keep the computers of all users in that space up to date with the activities
    of every other user. Also called a reflection server.


    **glTF/glb**: a new open standard for encoding 3D models which offers better portability
    between systems than previous standards such as .obj and .fbx.


    **grieving**: anti-social and transgressive behaviour within a virtual world.


    **graphical user interface (GUI)**: graphical user interface – the controls that
    a user sees on a screen.


    **haptics**: the sense of touch within a virtual environment, usually delivered
    through gloves, but can involve whole-body suits.


    **head-mounted display**: a display that is strapped to your head and can typically
    also track your movements. Currently synonymous with HMD-VR, but increasingly
    should be taken as referring to HMX-XR.


    **head-mounted display VR (HMD-VR)**: VR delivered through a head-mounted display
    which fully covers the user’s field of view, completely blocking out the physical
    world. Hand controllers and/or ordinary body movement are used for control and
    interaction.


    **head-mounted display XR (HMD-XR)**: an HMD capable of operating in both VR and
    MR modes, typically enabling MR through video pass-through rather than projecting
    onto a transparent screen.


    **inventory**: the collection of objects, clothing, media, and scripts that a
    user or avatar owns in a virtual world.


    **javascript**: a simple computer language widely used on the web to make web
    pages interactive.


    **massively multi-player online game (MMO)**: a game designed to be played by
    a large number of players at the same time, all of whom can potentially interact
    within the game world.


    **massively multi-player online role-playing game (MMORPG)**: a form of MMO which
    emphasises character, role-play, exploration, and adventure rather than combat.


    **material**: in 3D graphics, the material is how rough or smooth something looks,
    more akin to what is called texture in the physical world.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '**mesh:** the shape of an object defined typically in terms of points, vertices,
    and polygons. Essentially synonymous with wireframe (q.v.), but early versions
    of Second Life severely constrained the shape primitives which could be used.


    **metaverse:** a persistent digital synthetic environment populated by a large
    number of avatars who have agency and can interact, for collaboration, work, recreation,
    learning, relationships, and/or play; and which may be accessible through a range
    of technologies including VR, MR, and possibly AR.


    **Metaverse:** the ultimate manifestation of the metaverse concept, covering all
    metaversal features in a globally used and accessible system, which may be a singular
    metaverse, or a network of interconnected individual metaverses – i.e. a multiverse.


    **metaversal:** exhibiting some or all of the features of a metaverse.


    **microverse:** a small metaverse created for a very specific function – such
    as a training course, project, meeting, group, or entertainment event.


    **mixed reality (MR):** overlays 3D digital visualisations onto a head-mounted
    screen or see-through visor, where the digital information is “aware” of the physical
    geometry of the world and the user’s movement in it and can respond to both.


    **monthly active users (MAUs):** the number of different users who use an application
    or service each month (c.f. concurrency).


    **multi-user dungeon (MUD):** the first text-based virtual worlds, enabling large
    numbers of users to adventure in a fantasy dungeon, and later any space, through
    text descriptions, to take actions, and to interact with each other.


    **multi-user dungeon object-oriented (MOO):** a second generation of MUDs which
    used an object-oriented approach to their design to make things easier for programmers
    and users.


    **multi-user virtual environment (MUVE):** a term which is used within the education
    and learning sectors to describe virtual worlds.


    **multiverse:** a network of interconnected individual metaverses. It may be that
    the Metaverse is actually a Multiverse – the capitalisation is again reserved
    for the fully developed manifestation.


    **non-fungible token (NFT):** a token on a blockchain which represents a particular
    thing (e.g. an artwork) rather than a generic thing (e.g. an amount of money).


    **non-player character (NPC):** an avatar which is controlled by the virtual environment
    rather than a user, and whose intent is to enhance the user experience. Originally
    found in game-based worlds, but now applied more generally.


    **not possible in real life (NPIRL):** an old saying in Second Life to highlight
    the ability to do things within a virtual world which would just be impossible
    in the physical world.


    **physically-based rendering (PBR):** rendering which tries to model some element
    of the physics of real lighting and illumination.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '**player character (PC)**: an avatar controlled by a user. Originally found
    in game-based worlds, but now applied more generally.


    **pocket metaverse**: similar to a microverse but likely to be pinched out of
    a larger metaverse, such as by security and access controls.


    **proto-metaverse**: a metaverse which shows many or most of the metaversal features
    but which is not fully enough developed to warrant the term Metaverse.


    **reflection server**: another name for a game server (q.v.).


    **render**: the process by which lights, textures, and materials (q.v.) are used
    to make an object in a virtual world something that a user can see.


    **rez**: to place or make something appear in a virtual world – usually by placing
    it from a user’s inventory.


    **robotar**: an avatar controlled by a computer programme. A more general term
    than non-player character (q.v.).


    **roomscale**: the ability to explore a 3D scene by physically moving around in
    your physical space rather than having to use a set of controllers to explicitly
    move your avatar.


    **scene graph**: the totality of objects and avatars within a virtual scene, where
    they are, what they are, and how they relate.


    **semantic web**: a version of the World Wide Web where pages and other assets
    carry meta-information about what they are and show in order to make them easier
    for code and computers to understand.


    **semantic metaverse**: a version of the metaverse where objects carry meta-information
    about what they are, what they look like, and what they can do in order to make
    them easier for code and computers to understand.


    **skybox**: a 360° image that typically surrounds a 3D build in order to give
    the impression of the sky and a distant horizon.


    **social virtual world (SVW)**: a virtual world which emphasizes social interaction,
    rather than, say, game playing or combat.


    **stereoscopic video VR**: video which has been recorded with two cameras, separated
    by a typical inter-eye distance, so that when viewed in VR, it has the perception
    of depth.


    **streaming**: in the virtual world sense, when the scene is rendered (q.v.) on
    a central computer and then the resulting imagery is streamed to the user’s device
    – reducing the need for local processing but increasing the need for bandwidth.


    **synthetic environment**: any environment that provides a synthetic or artificial
    sense of reality, usually taken to mean a digital synthetic environment.


    **teleport (TP)**: to move directly from one place to another in a virtual world
    without having to walk or fly.


    **texture**: the colour and patterning of an object. Confusingly in 3D graphics,
    virtual textures are more akin to physical (visual) materials, whereas virtual
    materials are more akin to physical textures.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '**uncanny valley**: the sense of unease someone gets when viewing a (typically)
    human avatar that is too “realistic” to be seen as a cartoon, but not realistic
    enough to look exactly like a person.


    **user-generated content (UGC)**: content created in a virtual world, or on the
    web, by users rather than the platform owners.


    **video pass-through**: available on HMDs and uses forward facing cameras to show
    the user the physical world in front of them which they could not otherwise see
    as they are using an enclosed headset. Initially used for safety but now used
    to enable MR experiences.


    **virtual reality (VR)**: a 3D spatial, subjective, synthetic digital environment,
    which can be accessed through a smartphone, a tablet, or a conventional computer
    (DesktopVR) or a head-mounted display (HMD-VR). VR completely replaces physical
    reality in the user’s view (and even other senses).


    **virtual reality markup language (VRML)**: one of the first computer languages
    to build 3D spaces with.


    **virtual world (VW)**: a VR environment which provides a space for users to interact,
    to have agency and (ideally) some ability to shape the world. Often interchangeable
    with “metaverse”.


    **voxel**: the 3D equivalent of a pixel, the smallest cube within a 3D scene.
    Many early 3D environments were based around voxels (e.g. Habbo Hotel), and some
    still are (e.g. Dual Universe), but most have moved away from the approach to
    meshes.


    **webGL**: a web-based approach to building 3D scenes which runs in a browser.


    **webXR**: a further development of webGL to allow the viewing of 3D scenes within
    an HMD-VR browser.


    **wireframe**: the shape of an object defined typically in terms of points, vertices,
    and polygons. Essentially synonymous with mesh (q.v.).


    **XR**: see Extended Reality.'
  merge: -1
  img_proc: true
