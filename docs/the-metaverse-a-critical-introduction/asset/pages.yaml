  md: 'Nintendo actually had a VR headset back in 1994 – the Virtual Boy – which failed
    to gain any real traction (Boyer, 2009). In 2019, Nintendo launched Labo VR, essentially
    Google cardboard for their Switch console, and the third-party Orzly VR headset
    provides a cheap but more robust headset when using the Switch in VR mode. In
