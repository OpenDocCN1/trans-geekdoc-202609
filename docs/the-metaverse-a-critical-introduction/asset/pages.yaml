- pgno: 128
  md: '# # Technologies of the Metaverse


    # ## Introduction


    This chapter provides a high-level description of the technologies which underpin
    the Metaverse. As discussed in Chapter 2, the “metaverse” and “virtual reality”
    (VR) are often seen as synonymous, and most of the technologies that underlie
    the Metaverse are also found in virtual worlds, massively-multi-player online
    role-playing games (MMORPGs), video games in general, and in three-dimensional
    (3D) collaboration and training software. At a technical level, a metaverse is
    just a distinct way of combining these elements.


    The technologies are broken down here into eight broad areas, as shown in Figure
    4.1:


    +   - **3D environments**, including objects, physics, rendering, senses, and
    scenes;


    ![](img/a1f0838ef56b3ffb455ace32842c1458_128_0.png)


    FIGURE 4.1

    The key technology areas of the Metaverse.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   - Multi-user enablers, including game servers, sharding, etc.;

    +   - Navigation and land model;

    +   - Avatars, including avatar appearance (and animation), avatar interaction,
    and virtual agents;

    +   - Interactivity, including voice, text chat, tools, building, scripting, and
    interfacing;

    +   - Ecosystem tools, including market/economy, rights and permissions, user
    management;

    +   - Standards and portability; and

    +   - User interfaces.


    In addition, this chapter will also consider the role of artificial intelligence
    (AI) and blockchain technology, including cryptocurrency and non-fungible tokens
    (NFTs).


    Not explicitly considered here are some of the back-end elements needed to make
    almost any software application, such as access control, databases, security management,
    etc.


    # 3D Environments


    The 3D environment is what the user sees (and possibly hears or even feels) on
    their screen or XR device. It can be split into six different elements, as shown
    in Figure 4.2:


    +   - Objects (including avatars);

    +   - Physics;

    +   - Lighting and rendering;

    +   - Audio;

    +   - Other human sense triggers;

    +   - Non-human sense phenomena; and

    +   - Scenes.


    # Objects


    3D virtual environments are conventionally made of 3D digital objects placed within
    a space defined by a set of x,y,z co-ordinates. Those 3D objects could be as simple
    as a cube or as complex as a bunch of flowers and as small as a louse or as big
    as a city. Each object typically comprises three elements:'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_130_0.png)


    FIGURE 4.2

    The components of the 3D environment.


    +   - **Geometry** – the shape of the object, typically defined by lines (also
    called edges) and vertices (also called points), which are often used to make
    up triangles (tris) or other polygons (polys), a collection of which then fit
    together to form the desired shape. When an object is displayed purely in terms
    of its geometry, it is called a wire-frame;

    +   - **Texture** – how an object looks in terms of colour and pattern. This is
    often defined by having a two-dimensional (2D) image (in JPG, PNG, or other formats)
    either “pasted” onto each surface of the object, or having the faces of the object
    “wrapped” by a complex arrangement of textures in something called a UV map; and

    +   - **Material** – how an object reflects light, giving a surface a sense of
    depth and what people would conventionally call “texture” (i.e. does it look smooth
    or rough, made of fur or cloth, etc.), defined by what is often called a “bump”
    or “normal” map.


    Figure 4.3 shows a simple wooden cabin in terms of its wireframe, plain texture,
    image texture, and material.


    The more complex an object in terms of geometry, textures, and materials, the
    more memory it takes to store, the more bandwidth to transmit, and the more processing
    power to render and display. As a result, virtual environments designed for lower
    power devices (such as mobiles) have tended to use blockier, more cartoony, objects
    and a simple, primary colour palette – but improvements in mobile phone processors
    are increasingly closing the gap in the difference in usable detail between smartphones
    and desktop computers.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_131_0.png)


    FIGURE 4.3

    A wooden shack shown in (a) wireframe, (b) plain texture, (c) image texture, and
    (d) material including bump-maps.


    Most 3D objects are created using dedicated 3D graphics applications such as Blender
    (https://www.blender.org/), Z-Brush (https://www.maxon.net/en/zb brush), and 3D
    Studio Max (https://www.autodesk.co.uk/products/3ds-max/). These applications
    generate objects as digital files in formats such as Wavefront OBJ (.obj), Autodesk
    Filmbox (.fbx), and more recently Graphics Library Transmission Format glTF (.gltf),
    which can then be imported into a virtual space. The composition of the objects
    within the 3D space is typically achieved using a game engine such as Unity3D
    (https://unity.com/) or Epic Game’s Unreal (https://www.unrealengine.com/).


    However, this model of using external applications to build 3D objects and then
    compose them into a scene does not really meet the axioms defined earlier about
    being able to create and edit from within the Metaverse. In a true Metaverse,
    the user should be able to build and create objects from within the world, just
    as they would do in the physical world. Second Life, OpenSim, and Somnium Space
    are the main virtual worlds that fully embrace in-world building – rather than
    just object placement. In the earlier versions of Second Life (from 2003 to 2011),
    in-world building was all there'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_132_0.png)


    FIGURE 4.4 A Second Life sculpture by SL artist Starax created using “prim-torture”.


    was, assembling and distorting simple Platonic solid “primitives” (usually shortened
    to “prims”) such as cubes, cones, and cylinders in a process called prim-torture
    into quite incredible structures, devices, and artworks (see Figure 4.4). Second
    Life introduced mesh (i.e. 3D model imports) in 2011 and is starting to support
    glTF, and users can now freely choose between the two approaches.


    # Physics


    If the virtual world is going to act anything like the physical world, it needs
    physics – if a user lets go of something, it should drop, and if they throw something,
    it should arc. Of course, this is a virtual world, so users might want to be able
    to selectively switch physics off or change values, so they can experience being
    on a moon or another planet or even in weightlessness. Another key element is
    how objects react when they touch or bump into each other: should they just pass
    through and ignore the other object, should they bounce off like billiard balls
    (so-called hard-body physics), or should they deform slightly as they touch and
    repel (so-called soft-body physics).


    Physics in virtual worlds are typically implemented by “physics engines” from
    specialist providers such as Havoc (https://www.havok.com/) and the open-source
    Bullet Physics (https://github.com/bulletphysics/bullet3/), which are then plugged
    into the virtual world or game engine in use. The'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'physics settings are typically well hidden from the user, but some worlds might
    allow the value of gravity, or even its direction, to be altered.


    # Lighting and Rendering


    Just creating a 3D object and placing it within a 3D space is not enough to make
    the object appear to the user. Two other things are required – lights and a lighting
    model – the end result being the “rendering” of the object within the 3D space.
    Lights come in different forms such as point, spot, or ambient. They can be defined
    in terms of colour, intensity, and how quickly the light dims with distance. The
    lighting model defines how the light incident on an object will illuminate and
    even reflect off the object, dependent on its material and texture.


    Another key element of a scene are the shadows caused by objects blocking any
    light source. A quick way to improve the realism of any scene is to pay more attention
    to the shadows. Lighting models take a lot of calculation, and so many computer
    games do all the calculations beforehand and “bake” them into the textures of
    the objects, but this is not a route available to an editable metaverse as objects
    can be continually moved, deleted, or added. This is one reason why traditionally
    social virtual worlds looked inferior graphically to games, but modern graphics
    cards enable far more lighting calculations to be done in real time.


    Reflections are a real challenge. Mirrors were traditionally created in virtual
    environments by placing an invisible in-world camera in front of the mirror object
    and then rendering its output onto the mirror’s surface. Reflections from surfaces
    like shiny metal or water are nowadays achieved through software called shaders
    which are small bits of code that run on a computer’s graphics card which enhance
    the look of a scene in a wide variety of ways (Vivo & Lowe, 2015).


    More advanced approaches to lighting require far more processing power and are
    only slowly becoming available for real-time rendering. Most of these are physically
    based rendering (PBR) approaches which base their behaviour broadly on the actual
    physics of how light works (3DAce, 2021). A specific example, and more accurate
    than simpler PBR approaches, is ray-tracing. Here, rays are cast into the scene
    to calculate all the possible reflections, obscurations, and colour changes between
    the light sources and the virtual eye (Glassner, 1989). An even more advanced
    approach is light field imaging technology which captures information that is
    not typically processed by the eye but that allows greater manipulation of the
    view of a scene (Ihrke et al., 2016, and could promise headset-free VR (Kara et
    al., 2023).


    Virtual worlds have adopted a range of styles in terms of their overall look,
    from the highly cartoon form of Virbela, through the stylish but obviously artificial
    look of Second Life and Fortnite to the more “realistic” look of more modern environments
    such as EngageVR and Rumii. Just as an “uncanny valley” exists for avatars (see
    below), so to it seems that many users would'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'rather have a good-looking “artificial” environment than a badly realized “realistic”
    environment, and there are also issues with having an environment that is so glossy
    that it detracts from any collaboration or training task that is meant to be attending,
    as well as adding unnecessarily to the cost of a system (Serbo & Dawson, 2007).


    # Audio


    Virtual worlds are often viewed as being purely visual spaces, but even for sighted
    users, adding audio significantly increases the immersion of virtual spaces –
    even just the background noise of an office, traffic, wind, or birdsong (e.g.
    Lindquist et al., 2020). However, virtual worlds should also be accessible to
    non-sighted users and partially sighted users. Ironically, the original text-based
    multi-user dungeons (MUDs) and multi-user object-oriented dungeons (MOOs) were
    probably more accessible as they could be used with simple screen readers, and
    there is still interest in the concept of audio games and even combining them
    with augmented reality (AR) (Moustakas et al., 2019). Moving toward a more semantic
    metaverse (see below) would considerably aid the creation of audio and other sense
    interfaces for virtual spaces.


    # Other Human Sense Triggers


    What of the other senses? A metaversal space should be able to generate the cues
    for touch, smell, and potentially even taste. As with sight and sound, the elements
    to enable them within the virtual space are just code and data – although, just
    as a world needs an illumination model as well as lights, it would also need a
    diffusion model as well as smells (for instance) to create a realistic environment.
    Research is ongoing on smell generators for use with computer games and potentially
    virtual world applications (e.g. Makin, 2023, with some early systems reaching
    commercialisation (Milevo, 2020). Taste simulation is likewise the subject of
    some interesting research (e.g. Aoyama, 2020; Kerruish, 2019).


    In addition to the five common senses, the body also relies on at least two more
    senses, proprioception (the sense of where the parts of one’s body are) and interoception
    (the sense of what is happening in your body). Whilst the former tends to impact
    navigation, positioning, and manipulation (e.g. Valori et al., 2020), the latter
    may have applications from VR therapy (Riva et al., 2021) to pain management (Felnhofer
    et al., 2023) and may also have a relationship with cybersickness (Heeter et al.,
    2020).


    # Non-Human Sense Phenomena


    Whilst humans only have five primary senses, is there any reason why a virtual
    world should be limited to modelling only those? Additional phenomena such as
    temperature, infra-red, ultrasound, or electro-magnetism'
