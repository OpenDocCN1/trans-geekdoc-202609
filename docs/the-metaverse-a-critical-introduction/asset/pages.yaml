- pgno: 113
  md: 'Bin Laden’s compound before it was attacked by the US Special Forces (R. E.
    Smith & Vogt, 2014). More recently, the US Army (and no doubt others) have been
    examining the use of VR for planning and the use of helmet integrated MR headsets
    to improve the situational awareness of their soldiers (Shear, 2023) and pilots
    (Webster, 2021). However, the Snowden/NSA documents mentioned earlier (NSA, 2008)
    also highlighted that the opposition may be using virtual worlds too, and that
    what is sometimes referred to as grey zone warfare (Brands, 2016) may already
    be happening in social virtual worlds, just as it already is on more traditional
    social media platforms (Matisek, 2017). The ultimate expression of this may be
    of war in the Metaverse – carried out both through “in-world” activities and by
    cyberattacks aimed at the platform code and infrastructure. Militaries hence need
    to be aware of the challenges of the Metaverse as well as its opportunities.


    # The Exploration of Space


    VR is already being used to enable students to explore the worlds of the solar
    system (W. Huang et al., 2021) and by scientists and engineers to plan and support
    real space missions, such as in NASA’s Mars XR Operations Support System (XOSS)
    environment (https://www.buendea.com/xoss). AR and VR have also been used in the
    International Space Station for tasks ranging from robotic and experiment control
    to exercising (Guzman, 2021). For many of a certain age, watching the 1969 Moon
    landings on a grainy black and white TV set was a life-defining moment. But what
    might the first crewed Mars landing be like? Any landing site will have been well
    surveyed beforehand and equipment pre-positioned, and as a result, the team will
    already have a detailed 3D model and simulation and a whole section of virtual
    Mars to practice and plan with. This has already been started with XOSS, and with
    the Mars rovers, where NASA teams can use VR to stand next to the rover on Mars
    to plan its next move (Samuelsson, 2018), and the UAE is using the Metaverse to
    plan its own Mars settlement (Hasan, 2023). The US Space Force even calls its
    vision of how to use XR technologies to support space operations the “SpaceVerse”
    (Kauchak, 2023).


    Come the first human landing on Mars, there is no reason why a version of that
    virtual Mars shouldn’t be made publicly available so that anyone can stand on
    virtual Mars and watch the first astronauts step foot on the planet – both in
    live video and as avatars in front of them. In a private version of that same
    environment, the support team can be doing the same thing – and the astronauts
    can have MR displays in their headsets so that they can see the support team as
    though they were stood on Mars with them and work collaboratively as a physical-virtual
    team to explore Mars. Of course, there is the minor issue of the 3-21-minute time
    delay on transmissions between the two planets, so it may be that both teams are
    actually interacting'
