- pgno: 86
  md: '# Ethics


    HMD-VR can be a very visceral experience, and users can feel more intimated than
    in DesktopVR spaces as it’s not so easy to just look away. Designers need to think
    about the situations they put users in and what choices they give them in order
    to ensure that any experience is being ethically (and morally) delivered – since
    VR can give users a “first-person experience of what it is like to perform certain
    immoral actions” (Brey, 1999). Another concern is that VR can lead to the creation
    of false memories and even to unintended behaviour change back in the real world
    (Pan & Hamilton, 2018), and Heller (2020) has even argued that “we should examine
    immersive media through a human rights-oriented lens”.


    # Gender and Bias


    Linked to the issue of ethics, it is very easy to make a gender-biased or mis-representative
    VR experience. First-person experiences in particular need to consider whether
    they need male and female options, and whether that has any implications on the
    rest of the experience design (Stanny et al., 2020). Racial and other biases offer
    a further challenge, avoiding the stereotyping of non-player characters (NPCs)
    (Kim & Wei, 2011; Moreno & Flowerday, 2006). There can also be issues with HMD-VR
    equipment design that can make them less usable for female users (Stanny et al.,
    2020), although it should be noted that there is some evidence that females may
    feel more presence and can perform better in VR than males (Grassini & Laumann,
    2020).


    # Privacy and Surveillance


    HMD-VR allows an unprecedented level of user tracking. One concern is that tracking
    data could not only allow a user to be finger-printed by interaction behaviour
    (Pham, 2018), but also physical and emotional triggers identified (Heller, 2020).
    There is also the linked phenomenon known as “anonymous intimacy” where a user
    may reveal more in a conversation with an NPC in a virtual environment than they
    would do to a person in real life (Pan & Hamilton, 2018).


    # Health and Safety


    Since HMD-VR users have minimal awareness of their physical environment (although
    in-built safety features are improving), users need to ensure that they are in
    a safe space, and potentially watched by someone else to keep them safe. A key
    consideration is how long an HMD-VR session can last, and some research has suggested
    a maximum of 55–70 minutes, depending on the quality of the experience design
    (Kourtesis et al., 2019) – however, time within a DesktopVR experience seems unlimited.'
