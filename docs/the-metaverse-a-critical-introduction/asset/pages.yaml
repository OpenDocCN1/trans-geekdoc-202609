  md: 'stated that the potential of the metaverse will be best realized if it is built
    on a foundation of open standards. Building an open and inclusive metaverse at
    pervasive scale will demand a constellation of open interoperability standards”.
    The various metaverse standards initiatives were described in Chapter 4, but,
    as discussed, similar previous attempts have failed – will they be more successful
    this time around?


    # Driven by Money or Community?


    Related to the debate about governance and centralised versus decentralised approaches
    is whether the Metaverse will ultimately be created and developed through a concern
    primarily for money or community. Ball (2022) appears to take the view that the
    Metaverse will most likely arise from a world or worlds taking a corporate, money-driven
    approach. “The most likely outcome is indeed that a handful of vertically and
    horizontally integrated platforms collect a significant share of total time, content,
    data, and revenues in the Metaverse” (Ball, 2022). Ball describes corporate executives
    as believing that the metaverse will be worth “multiple trillions of dollars”
    (whilst accepting that they can’t agree on what it actually is yet) and quotes
    Jensen Huang of Nvidia as predicting that the value of metaverse “will eventually
    ‘exceed that’ of the physical world” (Ball, 2022). Au (2023) takes almost the
    opposite view, barely mentioning revenues (except where they relate to creator
    share) or investment in his book. Instead, he sees the Metaverse as a ground-up,
    community endeavour – “community creates value – not the other way around” (Au,
    2023). Whilst Au expects metaverse platforms to be (at least initially) game-led,
    he considers that user-generated content with an independent purpose is the litmus
    test for a successful metaverse platform – i.e. whether “you will find a subset
    of content creators who create not primarily for profit, but for the benefit of
    the user community. And social recognition by that community” (Au, 2023).


    The example of the World Wide Web is again salutary. Through gifting the underlying
    hypertext transfer protocol (HTTP) and hypertext markup language (HTML) standards,
    and browser and server code, to the global community, Sir Tim Berners-Lee enabled
    a ground-up, community growth of the Web, without anybody initially having any
    real concerns for revenue, investment, or profit. Some, such as Fodor (2020) from
    Mozilla, believe that this is how the Metaverse should evolve, along with being
    based on open source code. However, over time, corporate interest (and with that
    revenues, profit, and investment) became ever more significant, and the large
    corporate players, from Amazon to Google and Meta, came to dominate the Web. A
    key question, to be explored in Chapter 6, is whether the Metaverse will go through
    a similar process, or whether it is already at a situation of corporate dominance
    (e.g. Meta/Oculus, Epic/Fortnite), or whether there is a way to develop and'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'maintain a high level of community involvement whilst also meeting the costs
    of creating, operating, and maintaining the technologies that underpin it.


    # Virtual Earth or Multi-Earth?


    Linked to debate about the Metaverse or Multiverse is the extent to which any
    metaverse should actually be a digital twin of the Earth (and/or any other world)
    – or at least follow its basic geography. The Digital Earth Vision, developed
    by the International Society for Digital Earth (http://www.digitalearth-isde.org/),
    takes a literal digital twin approach, with a “digitally-formatted Earth accessible
    directly through the internet-connected citizens of the planet and supports facilitating
    data and information provision to others,” one able to support social, cultural,
    and economic activity, and has spent almost 20 years supporting global collaboration
    in this area.


    However, as discussed in Chapter 2, the Metaverse is almost certainly going to
    be an interconnected series of metaversal spaces in the short-to-medium term –
    partly because there are too many people who want “their” digital twin of a location
    which is at odds with other people’s digital twin of the same space. Also, if
    there is just one digital earth, then all the issues of land ownership and rights,
    and extending physical world control into the virtual world, will come into play.
    More likely, there will be complementary (or even competing) digital twins of
    the Earth, hopefully drawn from common geo-spatial data, each with its own set
    of guidelines as to how it should be used. So, it may be that one world enforces
    a “physical world analogue” mandate – you can only build what physically exists,
    whilst another might be focused on environmental or global equality issues, and
    yet another on global tourism. But since these are, hopefully, all on the same
    interconnected infrastructure, users can readily teleport between each and even
    overlay data from them all in mixed reality, or even in yet another virtual reality
    (VR) space.


    Of course, none of this prohibits any metaverse from also basing its geography
    on the whole solar system, a totally imagined world or universe, or a literature
    or movie-based one.


    # Climate Saviour or Climate Pariah


    As with any technology that supports remote working, there seems to be a natural
    argument that the Metaverse can be good for climate change by reducing the environmental
    impacts of commuting and business travel (Le et al., 2020), and even through the
    development of virtual tourism (De-la-Cruz-Diaz et al., 2022; Gursoy et al., 2022).
    One study optimistically predicts that “increasing metaverse adoption can reduce
    the global surface'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'temperature by up to 0.02°C before the end of this century and lower the greenhouse
    gas emissions by 10 Gt CO2e ... and saving 10% of nationwide energy use by 2050”
    (Zhao & You, 2023).


    However, Kshetri and Dwivedi (2023) highlight that “a fierce debate is brewing
    over whether the metaverse will be an environmental sustainability disaster or
    if it will make the world cleaner and greener”, since against any savings must
    be set against the environmental cost of running the servers and networks that
    are required to support a metaverse. Liu et al. (2023) have estimated the climate
    cost of the metaverse in 2030 against three main elements: the underlying infrastructure
    (accounting for about 20% of CO2 emissions and energy consumption), computing
    and display devices (c.45%), and blockchain-based trading and economy services
    (c.35%). They summarise that “The metaverse will account for as high as 0.5% of
    the global carbon emissions by 2030 unless we take effective preventive measures
    from now on”, before providing an analysis of potential carbon and energy saving
    measures for metaverse developments, but one still predicated on the blockchain
    (Liu et al, 2023).


    As this analysis suggests, a key environmental issue is the impact of any blockchain
    and related cryptocurrency systems within a metaverse. The Bitcoin network’s energy
    consumption has been described as comparable to Ireland’s (De Vries, 2018) and
    Malaysia’s or Sweden’s (Carter, 2021). Whilst these comparisons have been challenged
    (e.g. McCausland, 2018), there is no doubt that the energy needs of current approaches
    to the blockchain are very significant. Improvements have been proposed which
    could reduce energy consumption by around 75% (Zhang & Chan, 2020), and making
    more use of renewable energy sources is another potential step (Ibañez & Freier,
    2023). However, there still remain other significant environmental issues such
    as around the production and disposal of mining computing hardware (De Vries,
    2019).


    The Metaverse must be developed in a way that is cognizant of its environmental
    impact, optimising computer and communications resources wherever possible, ensuring
    that servers, communications, and access devices are all powered from renewable
    energy, and ensuring that any savings by using the Metaverse are not cancelled
    out by the environmental impact of running the Metaverse. Consideration must also
    be given to the use of finite and/or hard-to-get resources, such as lithium batteries
    found in most consumer electronic devices.


    More positively, one potential contribution of the Metaverse to the climate agenda
    is in giving everyone a better understanding of climate change issues and building
    a greater global perspective. Astronauts talk about the “overview effect” – the
    way that political borders are not seen from space and that there is a “renewed
    sense of responsibility for taking care of the environment” (Voski, 2020). The
    Metaverse is a way to build this view on the ground – not just by providing large
    scale simulations of viewing the Earth from space (e.g. Stepanova et al, 2019),
    but also within the Metaverse itself, where people and places are linked by communities
    and ideas, not by nation-states. This is also an argument for the single Metaverse
    (or a coherent Multiverse), as against a'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'series of unconnected virtual spaces, so that everyone lives on the same virtual
    planet and is very much aware of doing so, and so can readily experience and understand
    the issues that local communities are facing as a result of climate change, and
    more readily access and share the research which is going into understanding and
    (hopefully) solving, or at least mitigating it.


    However, what it actually means for Barbados to open an embassy in the Metaverse
    (Thurman, 2021), in their case on Decentraland, just as the Maldives did in Second
    Life in 2007 (Sydney Morning Herald, 2007), or for Tuvalu to declare that it is
    replicating itself in the Metaverse (Fainu, 2023), is moot, and people should
    certainly be wary of any naïve futurism (Guiao, 2022). However, bringing global
    issues to a global audience through the Metaverse is likely to become more commonplace,
    and the Metaverse should be designed to enable and encourage this – whether it''s
    virtual embassies, country digital twins, immersively experiencing droughts or
    floods, or collaboratively analysing climate impact data and stories in order
    to better communicate the risks to a wider audience in a more engaging and impactful
    way.


    # Governance


    If the Metaverse is essentially a whole new world (only digital), then how should
    it be governed, and how should the governance of the Metaverse relate to national
    and supra-national governance? The models for this are to some extent tied to
    whether the Metaverse is one or more centralised, tightly controlled corporate
    spaces – in which case, corporate governance can be expected to rule – or a more
    decentralised, open-source model with the Metaverse being the sum of a larger
    number of parts, possibly with some “federation agreement” when linking from one
    to another to ensure that some shared standards of privacy, legality, and acceptable
    use are maintained. The proponents of Web3 are promoting the concept of decentralised
    autonomous organisations (DAOs) (Tse, 2020) to run virtual worlds, and they are
    already being used to run Decentraland (https://dao.decentraland.org/).


    Governments, inter-governmental organisations, and non-governmental organisations
    are considering their role. The European Union has initiated reports and consultations
    to “develop a vision for emerging virtual worlds (e.g. metaverses), based on respect
    for digital rights and EU laws and values” such that “open, interoperable and
    innovative virtual worlds ... can be used safely and with confidence by the public
    and businesses” (Choi et al., 2023). One such research project to develop a new
    ethical framework that can be used to help draft future EU legislation for the
    Metaverse is being led by respected ethicist Professor Luciano Floridi of the
    Digital Ethics Center, Yale University (Holden, 2022). In 2023, the European Union
    released an interim report on Next Generation Virtual Worlds: Societal, Technological,
    Economic and Policy Challenges for the EU in 2023 (Hupont Torres et al., 2023)
    and also the'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'same year released a report on _An EU initiative on Web 4.0 and virtual worlds:
    a head start in the next technological transition_, looking at both economic and
    governance issues. This identified Web 4.0 as “the expected fourth generation
    of the World Wide Web. Using advanced artificial and ambient intelligence, the
    internet of things, trusted blockchain transactions, virtual worlds and XR capabilities,
    digital and real objects and environments are fully integrated and communicate
    with each other, enabling truly intuitive, immersive experiences, seamlessly blending
    the physical and digital worlds” (EU, 2023). The IEEE’s Global Initiative on Ethics
    of Extended Reality is looking at establishing a legal framework, similar to GDPR
    legislation in the European Union (Stephens, 2022). The World Economic Forum launched
    an initiative to build an equitable, interoperable, and safe metaverse in 2022,
    and their 2023 briefing paper on _Interoperability in the Metaverse_ covered jurisdictional
    interoperability alongside technical and usage interoperability, as well as offering
    some initial guidance on composing “a governance framework that considers privacy,
    security, identity, safety and interoperability” (WEF, 2023).


    # Physical Law or Virtual Law


    Part of the debate around governance is the issue of what laws apply within the
    world. Who does a user appeal to if robbed, groomed, abused, swindled, or worse?
    What counts as blasphemy or slander or illegal pornography in the world – and
    if they are transgressed, who prosecutes? There are similar issues with social
    networks on the Web – is it the physical location of the operator, the servers,
    the victim, or the abuser that counts? And where are the boundaries between anti-social
    behaviour and abuse – griefing (transgressive behaviour) being common across many,
    if not all, virtual worlds (Jenkins, 2010). A useful survey of the legal implications
    of the Metaverse, and of a Web3 approach to it, is provided by Garon (2022).


    The assumption is probably that the virtual world should be subject to the same
    rules and laws as the physical world. However, physical world laws and rules vary
    by jurisdiction, organisation, and even culture – so which should be chosen for
    a virtual world or metaverse? Does the UN Declaration Human Rights apply in the
    Metaverse? Should operators and virtual landowners be able to enforce their own
    laws as long as they don’t violate those basic rights? And who, in the Metaverse,
    will have the authority to establish laws and enforce them?


    There are already debates about what legal jurisdictions apply to situations on
    the Internet where the provider, servers, and users may all be in different jurisdictions
    (e.g. Reidenberg, 2005), and the situation will be no different, and potentially
    worse in the Metaverse (Kostenko et al., 2022; Kalyvaki, 2023). Whilst a room-based
    metaverse might be a close analogue to the website/application situation, if the
    Metaverse is implemented as one or more spatial models, then do the same rules
    apply across the whole of the connected space, or just within certain areas of
    it? Could one area erect billboards on its'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'borders that were viewable from another area where their content would be viewed
    as blasphemous or illegal? Could the avatar citizens of one area seek asylum on
    the servers of another area?


    Law around intellectual property (IP) – whether manifest as builds, scripts, objects,
    or clothing – will also need some harmonisation across the different parts of
    the Metaverse. The European Union is already looking at how EU IP laws may apply
    across the Metaverse (Choi et al., 2023), and the World Intellectual Property
    Organisation, an agency of the United Nations, is looking at the global IP issues
    of the Metaverse (WIPO, n.d.).


    # Freedom of Expression versus Freedom from Abuse


    Another aspect of governance is how to ensure user freedoms. Virtual worlds are
    places where the tension between freedom of expression and freedom from abuse
    has been evident from the very beginning – as in the Dibbell rape in cyberspace
    case mentioned in Chapter 1. The Guardian reported on a case of alleged gang rape
    in VR in 2022 and noted that there have reportedly been several sexual assaults
    in Horizon Worlds (Sales, 2024). The United Nations Interregional Crime and Justice
    Research Institute (UNICRI) report on Gaming and the Metaverse: The Alarming Rise
    of Online Child Sexual Exploitation and Abuse within the New Digital Frontier
    warns that as the use of “virtual platforms increases, so too will the scale and
    complexity of the potential harm to children” and that “children ... may be exposed
    to sexual exploitation and abuse, if proper safeguard measures are not in place”
    (UNICRI, 2022).


    In contrast, Johnson (2010) describes how “For transgendered residents, Second
    Life allows for an expansive view of gender and political activism”, providing
    a safe and supportive place to meet, and generally providing a “world of possibilities
    that allows one to experiment with ‘sexual ideation’ and ... begin to create links
    between ‘the actual and the virtual’. The use of virtual worlds for political
    campaigning and demonstration has also already been described.


    Interpol is working on how to police the Metaverse (Cieslak & Gerken, 2023), and
    Headleand et al. (2020) have proposed virtual community support officers drawn
    from within the virtual communities as a way of policing virtual spaces. The Centre
    for Long-Term Cybersecurity published a report in 2022 on community guidelines
    for the Metaverse that highlighted the importance of clarity, comprehensiveness,
    specificity, and transparency (Lazeron, 2022).


    Greater centralised control could be expected to reduce abuse but could also impact
    political, gender, and other freedoms of expression, particularly where the world
    is being managed (or even accessed) from a country with authoritarian leanings.
    Finding the right balance will be as challenging in the virtual worlds of the
    Metaverse as it is in the physical world.'
