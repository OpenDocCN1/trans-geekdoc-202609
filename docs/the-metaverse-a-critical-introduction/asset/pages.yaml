- pgno: 136
  md: 'of higher complexity (Jamil, 2023). An alternative development, A-Frame (https://aframe.io/),
    provided a higher level abstraction on top of three.js delivering an almost hypertext
    markup language (HTML)style authoring environment for 3D graphics and experiences.
    WebXR extended WebGL by enabling it to detect whether it was running in DesktopVR
    or headset-mounted VR displays (HMD-VR) and to render the scene, and take user
    inputs, accordingly. Scaling the scene graph from a small single-user scene to
    a large, multi-user virtual world is a significant challenge. One solution being
    implemented is the Open Universal Scene Description (OpenUSD) (Lebaredian & Kass,
    2022; Peters & Weatherbed, 2023), as used in NVIDIA''s Omniverse offering, and
    based on original work by Pixar. In addition to supporting the standard elements
    of a scene graph, OpenUSD also supports relationships and inheritance, interoperability
    with the glTF model standard, support for the WGS84 geospatial referencing schema
    (enabling the accurate positioning of physical world items), and the capability
    to scale to large scenes. OpenUSD and its tools are open source and are promoted
    by the Alliance for OpenUSD (https://aousd.org/), and Unreal, Unity, and Apple
    are all supporting it.


    # The Semantic Metaverse


    One potential limitation of USD is that it does not enforce any naming or type
    standards, and so objects can be called anything – a chair might be just “object27354”,
    rather than “chair2” or even “leather armchair”. To enable virtual world environments
    to be accessed by the widest possible range of devices (and by AIs), there is
    a strong case for adopting a semantic approach to virtual worlds (Burden, 2011;
    Ibáñez-Martinez & Delgado-Mata, 2006). In a semantic metaverse, everything is
    defined in semantic terms – what it is and what it can do – independent of how
    it is rendered. Every element is tied to an ontological type (Messaoud et al.,
    2015) so that any system will know that “object27354” is a chair, and perhaps
    even what kind of chair. This provides a number of benefits:


    +   - If a user interface system is unable to render the object given and object
    model provided in the scene, it can substitute a suitable one which is better
    suited to its medium (e.g. AR or mixed reality [MR]), its bandwidth, its processing
    power, or even its user or use case;

    +   - For visually impaired users, an enhanced user interface (UI) can add a suitable
    audio description, help with navigation, and even highlight the most important
    objects;

    +   - Any AI accessing the virtual world doesn''t have to try and understand the
    3D model to work out what the object is, it can just read its ontological type
    and any associated metadata;'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   - Portability of scene definitions and interoperability between virtual
    worlds operating to different formats and standards is enhanced (Soto & Allongue,
    1997);

    +   - The world can actually be defined by its creator more rapidly using semantic
    terms (e.g. Kleinermann et al., 2005); and

    +   - Any relationships between objects can be extracted into the semantic graph
    containing the objects and do not need to be explicitly coded into every virtual
    world.


    # Game Servers


    Most of technologies described in this chapter are used by single-user computer
    games and multi-user virtual worlds alike. What sets the latter apart is the technology
    to allow multiple users to be in the same virtual space at the same time, and
    ideally to interact with each other.


    At the heart of most multi-user systems are game servers (also called reflection
    servers or multi-user servers) (Gallagher, 2022). Examples of game servers include
    Photon Engine (https://www.photonengine.com/), Nakama (https://heroiclabs.com/nakama/),
    and PlayFab (https://azure.microsoft.com/en-gb/products/playfab), or those built
    into the Unreal and Unity platforms.


    When a user first logs into a shared space, they are sent the details of where
    everything (and everyone) is in that space (this may be as a full set of live
    data or a base set of data plus recent changes). For performance reasons, this
    may be limited to what is within a certain distance of the user. As avatars move
    and objects are moved, created, or deleted, the relevant user''s software sends
    a message about the change to the game server, the server updates the state of
    the world, and then sends update messages to every user present in that space,
    and their own software then reflects the changes in their local copy. In addition
    to this centralised approach, it is also possible to take a peer-to-peer approach
    – where each user''s device communicates directly with other users'' devices,
    but the co-ordination and scaling can then be more challenging (Novotny et al.,
    2020).


    The game server is highly optimized for passing very small messages (e.g. object
    A has moved to location X,Y,Z) to large numbers of people. However, it is not
    just the performance of the game server that is crucial to giving the user a smooth
    experience. There are also the network lags across the Internet as messages are
    sent from the user to the game server and then on to every user, and then to the
    ability of each user''s own computer to manage the updates. Conventional approaches
    tend to result in a limit of significantly less than 100 people within any one
    space.


    Trying to get large number of avatars in one virtual space is a challenge. Even
    the 4000 avatars demonstrated in experiments by Improbable'
  merge: -1
  img_proc: true
- pgno: 138
  md: '(Improbable, 2021) are well short of the 90,000 people in Wembley Stadium for
    a big football match. There are currently several approaches to trying to handle
    this issue, and which can be applied singly or in combination:


    +   - Sharding – every group of ~50–100 avatars is on their own instance of the
    location. Users in one instance can see and interact with other users in the same
    instance but don’t see and can’t interact with users in other instances – although
    the rest of the crowd may be generic avatars just sketched in. Exceptions can
    be made for key avatars (such as the performers at a concert) so that they are
    seen by all users, whichever instance they are on. This sharding approach is widely
    used by massively multi-player online games (MMOs), and it has also been used
    for big virtual world events. In some ways, the result may be little different
    from a real event, where you can directly interact with the people in the block
    of seating you are in, but you only have a sense of the presence of the rest of
    the crowd (Waldo, 2008);

    +   - Varying levels of fidelity, so people close to you are shown in full resolution,
    but in decreasing resolution as they get further from you, till they are just
    a blob in the distance;

    +   - Minimising the interactions between you and other attendees – even to the
    extent of being able to pass through them;

    +   - Making key objects multi-user – for instance, the ball and players in a
    game, but other objects (e.g. popcorn boxes) are just handled locally; and

    +   - Massively optimising the game server to distribute updates in the most effective
    way – such as the systems being developed by Improbable and RP1 (Takahashi, 2021).


    The Metaverse needs to be able to cope, in some way, with the full range of human
    experiences, from a small group sat around a campfire – and indeed for millions
    of those campfire groups to exist – to allowing 70,000 avatars to attend a virtual
    Burning Man festival, or for several million to march in protest, or perhaps even
    tens of millions to gather for homage or prayer.


    # Navigation and Land Model


    If the user is presented with a virtual space, then how do they move around it?
    Within a specific location, they will probably walk, or even fly, but what about
    the larger scale? The early virtual worlds such as Second Life and ActiveWorlds
    worked on a “single map” model, possibly inspired by the globe-girdling Street
    in Snow Crash. The same model is seen in some cryptoworlds such as Decentraland
    and Somnium Space. In all these, you buy land to build on, and'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'from your land you can see neighbours’ land and you can walk (or fly) freely
    between them, permissions allowing, with the option to teleport (TP) longer distances.
    You get the feeling of being in a single, shared, persistent virtual world. Decentraland
    talks about a “transversable world” and the importance of “discovery by adjacency”,
    and these are useful concepts to bear in mind (Ordano et al., n.d.).


    Many of the HMD-VR-orientated worlds such as Frames, Horizon Worlds, and VRChat
    work on more of a “room” model, where you have your own space or spaces (which
    could be room or potentially planet sized) and you can do what you want in that
    space, including opening it up to other people, but there is no sense of having
    any neighbours or any spatial relationships, and you can only TP between rooms.
    The sense of a shared experience is only when you are in a space with other people;
    it’s not pervasive or persistent.


    Some platforms blur or blend the models. For instance, OpenSim lets you build
    your own “world”, subtlet space on that in a geographic, land parcel, style to
    other users but then connect your world (and their subtle spaces) to other worlds
    and spaces anywhere on the Hypergrid. OpenSim’s parcel and Hypergrid model seems
    highly appropriate to any ultimate metaverse, giving the best of both (virtual)
    worlds.


    # ## Avatars


    Users are represented within virtual spaces as avatars. Whilst some people prefer
    avatars that look like themselves, others prefer avatars that are completely different
    in style, gender, or species, or even to represent themselves as robots, ghosts,
    or toasters.


    This section will not go into into the detail of all the technologies and approaches
    that are used to build realistic looking avatars – for that, the reader is referred
    to the authors’ earlier book Virtual Humans: Today and Tomorrow (Burden & Savin-Baden,
    2019). Instead, this section will look at some of the key issues and choices concerning
    avatars in the Metaverse.


    # ## Avatar Appearance


    The appearance of an avatar includes body shape (and size), skin colour, face
    shape and colour (including lips, nose, cheeks, eyes), hair (style and colour),
    and clothes. The user should expect to be able to change their avatar’s appearance
    as often as they want, probably having different avatars (or at least outfits)
    for different events and roles. A human or even humanoid look should not be mandated.
    There is a lot of existing research around how people choose their avatar within
    a virtual world. Motivations for choice include virtual exploration, social navigation,
    contextual adaptation, and identity representation, with users to some extent
    portraying their actual'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'selves and reflecting their own aesthetic views in developing a stable avatar
    that they can relate to over significant periods of time (Lin & Wang, 2014).


    In addition to personal choice, the other key issue around avatar appearance is
    how “well” the technology of the virtual world renders the avatar. Some worlds
    have very cartoony avatars, whilst others strive for “photo-realistic” avatars.
    However, the uncanny valley effect (Mori, 1970) means that many people prefer
    a good, slightly cartoony avatar better than a “photo-realistic” avatar that just
    doesn’t quite pull the photo-realism off.


    Some worlds let the user take a webcam photo of their head and then try and wrap
    that around the head of the avatar (as Spatial used to do), whilst others (e.g.
    _Virbend_) just paste the webcam photo onto a blocky meepies-like body. A slightly
    different, and perhaps better, approach is that taken by ReadyPlayerMe (https://readyplayer.me/).
    A webcam takes a head and shoulders photo, but rather than then try and convert
    this directly into a (probably terrible looking) “photo-realistic” avatar, it
    uses it to drive the parameters of the configurator, so the result is an obviously
    artificial-looking avatar, but one that (a) looks pretty good and (b) looks something
    like you. Figure 4.6c shows David’s ReadyPlayerMe avatar created using the process
    and being used in _Mozilla Hubs_, alongside his avatar in other virtual worlds.
    Apple’s Vision Pro lets the user use the headset to create a 3D scan of their
    head for use as an avatar.


    The same issues as with the real-time rendering of objects have traditionally
    kept virtual world avatars inferior to those of the latest computer-generated
    imagery (CGI) film or triple-A game, but hardware improvements and the rising
    interest in the Metaverse from the fashion industry may help to change that.


    The authors have had enough serious business meetings with Daleks, ghosts, and
    talking parrots in virtual worlds to know that someone’s avatar doesn’t need to
    look like them, and in fact, the research suggests that the freedom of avatar
    choice helps with freedom of expression and being able to express your true personality,
    as well as being able to indulge in role-playing when you want to (Neustaedter
    & Fedorovskaya, 2009).


    # Avatar Animation


    Avatar animation takes place at three broad levels:


    +   - the large-scale movements of limbs and body as an avatar walks, flies, swims,
    or dances (locomotion animation);

    +   - the smaller movements as it points, gesticulates, or throws up its hands
    in horror (animation-in-place); and

    +   - the animation of the face to express emotion and to synchronise with any
    audio speech being produced.


    Whole body avatars with whole body animation were the norm in _Second Life_, _Active
    Worlds_, and other virtual worlds around 2000–2010. It’s notable'
  merge: -1
  img_proc: true
