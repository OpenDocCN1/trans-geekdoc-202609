- pgno: 31
  md: 'and expected it to have goals and objectives – but *Second Life* isn''t like
    that (despite some late attempts by Linden Lab to retrospectively add such features
    with Quests and Linden Realms) (Uccie, 2014). Au (2023) also explains how other
    factors from internal management issues, technical decisions, and the emerging
    challenges from smartphones all contributed to *Second Life*''s retrenchment.


    However, others, particularly in the education and training community, had found
    out what a versatile platform *Second Life* was for their own uses. Building in
    *Second Life* is really just toy building-blocks on steroids – although mastery
    takes a while – and so any tutor could teach themselves the basics, read the wiki,
    or attend an in-world class (this all started pre-YouTube!). Scripting in *Second
    Life* uses Linden Scripting Language, and whilst it has its own quirks, it is
    similar in complexity to Javascript – so again something that a keen teacher could
    use to develop basic functionality. A 2009 survey by Virtual World Watch found
    that around 50 higher education institutions in the United Kingdom were using
    *Second Life* (Kirriemuir, 2009a), and their annual Snapshots provided a good
    survey of the wide range of ways in which virtual worlds, predominantly *Second
    Life*, were being used in education at the time (Kirriemuir, 2009b). In 2009,
    the United Kingdom’s Joint Information Systems Committee (JISC), an independent
    not-for-profit charity funded mainly by the government and universities, which
    advises on and manages shared IT for UK Higher Education, published a guide to
    “Getting Started with *Second Life*” (Savin-Baden et al., 2009), and the Open
    University ran two ReLIVE conferences on education in virtual worlds (in 2009
    and 2011). The Virtual Worlds Education Consortium (https://www.vweconsortium.org/),
    the latest organisation to support educators in virtual worlds, with its main
    base in *Second Life*, was established only in 2021.


    Linden Lab provided an educational discount for sims used by schools and colleges,
    but when this was withdrawn in 2010, many of these institutions started to leave.
    Many turned instead to developing in *OpenSim* (2007, http://opensimulator.org/)
    – which is further described below. Others developed bespoke immersive environment
    applications using Unreal and Unity – although these have never had the flexibility
    that tutor (and even student) authoring brings.


    It wasn’t just the education sector that saw the benefits of *Second Life*. There
    were a large number of medical training projects, for example, at Imperial College;
    St. George’s Hospital¹ (Figure 1.7); Cornell and Idaho State University (Stott,
    2007); Ohio State University (DigitalUnionOSU, 2008); and the University of Calgary
    and SAIT Polytechnic, Calgary (Kopp & Burkle, 2010); on projects ranging from
    paramedic and nursing training to virtual laboratories and fly-throughs of human
    anatomy. New York City’s Office of Emergency Management delivered hurricane relief
    centre training in a virtual copy of a New York public school² (Brouchoud, 2011).
    Consultants Booz Allen Hamilton and the Texas Woman’s University assessed training
    based on Federal Emergency Management Agency models for tornado response'
