    are the ones that most people tend to think about. But they’re not the only entry
    points. There’s also blockchain, which is a big component, there’s 5G, there’s
    edge computing, and many, many other technologies. To me, the metaverse is also
    about our identity and digital ownership. It’s about a new extension of human
    creativity in some ways”. |

    | ITU (2023) | “Metaverse and multiverse refer to virtual universes with close
