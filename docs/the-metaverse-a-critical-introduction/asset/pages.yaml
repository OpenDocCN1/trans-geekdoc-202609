    # Facebook Takes an Interest


    Facebook’s acquisition of Oculus, and in particular Mark Zuckerberg’s presentation
    at Facebook Connect on 28 October 2021 (and which was live streamed into the Oculus
    Horizons Spaces virtual world) and the announcement of the name change of Facebook’s
    holding company to Meta, returned the concept of the Metaverse to the public (or
    at least geek) consciousness. However, there was really little there that wasn’t
    being talked about ten years ago, and much that already existed in Second Life
    15 years ago. Zuckerberg also talked about the Metaverse as being the “replacement”
    for the mobile internet – something that will be challenged in Chapter 3 given
    the inconvenience of HMDs. Some of the more interesting announcements of (then)
    future developments, which are equally applicable to other virtual world platforms,
    included: making PCs and smartphones applications usable from their digital twins
    inside of VR (elements now in Apple Vision Pro, Somnium Space, and Immersed),
    headsets that detect facial expression and eye movement for more natural avatar
    interaction (in Apple Vision Pro, Quest Pro, and others), and detecting hand movement
    and gesture using electromyography (EMG)-based neurotech devices (something pioneered
    by Thalmic Labs MYO back in 2016) (Burden, 2021). Their new Codec “photo-realistic”
    avatars were previewed in Zuckerberg’s interview on the Metaverse with Lex Fridman
    (Fridman, 2023), but set against a black backdrop and only showing head-and-shoulders
    still had an uncanny valley feeling.


