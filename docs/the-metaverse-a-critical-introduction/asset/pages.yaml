- pgno: 11
  md: '# # About the Authors


    **David Burden** created his first virtual world in 1996 and has spent most of
    the time since working in virtual spaces and with virtual humans for a variety
    of clients through his company Daden Limited. His first presentation on the Metaverse
    was in 2008. David and Maggi co-wrote the book _Virtual Humans_ for Routledge
    in 2019 and also worked together on the book _Digital Afterlife_ in 2020.


    **Maggi Savin-Baden** is a research Professor at Blackfriars Hall, University
    of Oxford. She has researched and evaluated staff and student experience of learning
    for over 20 years and has a strong publication record of over 70 research publications
    and has completed 25 books. Her research and writing reflect her interests on
    the impact of innovative learning, digital fluency, digital afterlife, and the
    postdigital, and she has worked with David on a number of research projects since
    2008.'
