    # Beyond the West


    Although most of the worlds discussed so far have come out of Western culture,
    there is also a strong metaversal movement in other parts of the globe. Vark from
    Japan has already been mentioned, and Zepeto (2018, https://web.zepeto.me/en)
    is a South Korean world. Also from South Korea, Krafton, owners of the popular
    PUBG: Battlegrounds game (similar to Fortnite), are launching Overdare, a Roblox-like
    NFT-driven metaverse in 2024 (Irwin, 2023). South Korea’s Ministry of Science
    and ICT has even created a “metaverse alliance” (Kim, 2021). GOXR and PartyOn
    (both from XRSpace – https://www.xrspace.io/us) are Taiwanese worlds. The Chinese
    VR market has been estimated by some as accounting for over 40% of the global
    market and involves the key Chinese technology firms of Baidu, Alibaba, and Tencent
    (Kurzydlowski, 2021). ByteDance, the Chinese owners of TikTok, bought Pico, one
    of the leading HMD-VR manufacturers in 2021 (Kharpal, 2021). In the Middle East,
    Dubai has launched its own metaverse strategy, the UAE has opened a metaverse
    incubator, and the NEOM future city has a metaverse element to support collaboration
    during its build phase (MIT Sloan Management Review, 2023). So, whatever happens
    in the West, it seems that metaverse developments are likely to continue elsewhere
    on the globe.


