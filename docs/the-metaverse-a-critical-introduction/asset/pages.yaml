    to new users; and

    +   • Implement a WebXR viewer so that the worlds can run in a browser.


    Second Life and OpenSim are already beginning to introduce support for glTF and
    physically based rendering (PBR), which should improve both the look and interoperability
    (Pey, 2023).


    The challenge, though, may be that the core architecture of Second Life is such
    that supporting some of these changes is impracticable (Gregory, 2023) in which
    case it’s time for either Second Life 2.0 or OpenSim 2.0, or for a new entrant
    or existing player to take inspiration from Second Life and OpenSim and to build
    a platform which has both their legacy features and the suggested improvements,
    and without adding additional barriers to participation – such as through the
    use of unstable crypto-currencies.


    # The Psychological Underpinnings of Virtual Experiences


    Through the use of VR technology, the metaverse experience is tightly bound to
    the psychology of how the brain experiences immersion, presence, agency, embodiment,
    and flow. It is this relationship which makes metaversal experiences feel more
    powerful than other conventional digital media experiences and contributes to
    why the Metaverse may have a more profound effect on us and our lives than other
    digital experiences.


    Researchers have identified five key features which virtual environments (whether
    DesktopVR or HMD-VR) deliver in a unique way, and they are shown graphically in
    Figure 2.7. Understanding how to leverage each of these is key to taking the fullest
    advantage of what VR and metaverse


    ![](img/a1f0838ef56b3ffb455ace32842c1458_81_0.png)


    FIGURE 2.7 The psychological drivers of the virtual environment experience.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'environments have to offer. Note, though, that VR is a highly individual experience,
    based on context and our own psychology and physiology. Some of the first researchers
    in the field even identified imagination as being one of the most important factors
    (Burdea & Coiffet, 2003). So, be aware that no matter how “good” a VR experience
    is, maybe not everyone will get the same things from it.


    # Immersion


    Immersion is the sense of being “enveloped by, included in, and interacting with
    an environment that provides a continuous stream of stimuli and experiences” (Witmer
    & Singer, 1998). Immersion is increased by having less awareness of your “real”
    physical environment (so HMD-VR typically delivers more immersion than DesktopVR),
    natural control over your actions (so fewer menus), and the environment responding
    to your presence. Researchers (e.g. Mütterlein, 2018; Rueda et al., 2018) often
    consider immersion in terms of:


    +   - its technical aspects (e.g. screen resolution and refresh rate); and

    +   - the psychological aspects (e.g. the emotional response and sense of “being
    there”).


    # Presence


    Presence is a step beyond simple immersion, and it is where you feel that you
    are “interacting directly, not indirectly or remotely, with the environment. You
    feel that you are part of that environment” (Witmer & Singer, 1998). Slater (2009)
    splits presence down into:


    +   - the place illusion, the sense of being there generated by the technological
    immersion and visual realism; and

    +   - the plausibility illusion, the sense that the perceived events are actually
    happening – and informed by a sense of credibility, agency, and narrative.


    True presence is often described as when you have a real feeling of having visited
    a place when you leave VR – the “place illusion”, which is reinforced by the “plausibility
    illusion” of the virtual experience itself of being “real” (Slater, 2009).


    Co-presence is also a consideration; places usually feel more “real” when there
    are other people (represented as avatars) there, even if computer controlled.
    Some researchers have even found that training effectiveness was increased when
    virtual bystanders were present (e.g. Stroyny et al., 2020), and platforms like
    VARK mentioned in Chapter 1 aim to increase the realism of'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'a solo concert-going experience by populating your environment with addition,
    truly virtual, concert-goers.


    # Agency


    Agency is the extent to which you feel that you are in control of your own actions
    (Piccione et al., 2019) and can control, or at least influence, the (virtual)
    world around you (Jicol et al., 2021). If you feel a high sense of agency, then
    research suggests that your presence, spatial awareness, and co-presence will
    be higher, which should lead to better performance. Factors that assist in generating
    agency in VR include:


    +   Viewing the world from a first-person perspective (Piccione et al., 2019);


    +   Being able to move freely and explore with minimal constraints (Jicol et al.,
    2021); and


    +   Being able to do as you want within the virtual environment (Jicol et al.,
    2021).


    Note, though, that in DesktopVR, contrary to possible expectations, there can
    be more sense of agency and presence from a third, rather than first, person perspective
    (Black, 2017).


    # Embodiment


    Embodiment is the degree to which you feel that your avatar is your own representation
    of yourself. Kilteni et al. (2012) break the sense of embodiment into three components:


    +   The feeling of being located inside the avatar’s body;


    +   The feeling of being in control of the avatar; and


    +   The feeling of owning the avatar’s body.


    Embodiment is damaged when there are glitches in the animation (for instance,
    hands moving through the body, or elbows at odd angles – challenging proprioception
    as will be discussed in Chapter 4), and interestingly, there is some debate over
    whether full body avatars offer more embodiment than partial (e.g. head and hands)
    avatars (e.g. Lugrin et al., 2018; Y. Pan & Steed, 2019).


    One proof of embodiment in VR is that experiments have shown a “persistence of
    non-verbal norms in online virtual environments” – such as the social distance
    between avatars (Yee et al., 2007).


    There also needs be no match between your own physical appearance and your avatar’s,
    and in fact, VR provides a powerful opportunity to put'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'yourself in someone else’s body and to “walk a mile in someone else’s shoes”
    (Wiederhold, 2020).


    # Flow


    Flow is defined as “the state of intense involvement in an activity, an extreme
    version of immersion, losing self-consciousness, being unaware of fatigue and
    having a modified sense of time” (Csikszentmihalyi, 1990) and is linked to immersion
    and presence. Learners, those performing professional activities (e.g. musicians),
    and even gamers are believed to perform at their best when in a flow state and
    when the level of challenge of the activity is appropriate to their skill level.
    In VR, anything that jars with the experience, or where the user consciously has
    to think about how to use the environment, will immediately drop them out of the
    flow state and should be avoided.


    # HMD-VR versus DesktopVR


    Whilst much of the recent media attention has been on HMD-VR, researchers are
    undecided as to whether it provides better outcomes than DesktopVR in all use
    cases.


    A key analysis by Rueda et al. (2018) – see Figure 2.8 – clearly shows the distinction
    between how users are accessing the virtual environment and the experience which
    they are having once connected. This idea that


    ![](img/a1f0838ef56b3ffb455ace32842c1458_84_0.png)


    **FIGURE 2.8**

    Analysis of the virtual reality experience (adapted from Rueda et al., 2018).'
