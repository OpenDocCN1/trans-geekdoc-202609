  img_proc: true
- pgno: 172
  md: 'Fernandes and Werner (2022) provide a useful overview of the human-interface
    challenges and potential solutions across the five senses. Politis et al. (2017)
    highlight the importance of involving people with disabilities in the design of
    games and virtual worlds from the beginning in order to help ensure their usability.
    Broad agendas on accessible design and inclusivity of the current generation of
    metaverse platforms have been described by Zallio and Clarkson (2022) and Parker
    et al. (2023), and XRAccess (https://xraccess.org/) is a research consortium aiming
    to make extended reality (XR) inclusive for all.


    # Digital Poverty


    A more general case of the accessibility debate, and related to that of global
    equality discussed below, is that of how the Metaverse can respond to the issue
    of digital poverty. Digital (or data) poverty refers to the mostly financial,
    technical, social, and economic challenges that some people have in accessing
    digital services (Cáceres, 2007). The push of governments and organisations to
    go digital-first, and even digital-only, risks disenfranchising a significant
    proportion of the population. A 2015 study (Leidig et al., 2016) established a
    Data Poverty Index and found that about half the countries of equatorial Africa
    had high data poverty, and most other countries in Africa and most in Southeast
    Asia had above average data poverty. Digital poverty, sometimes measured as digital
    exclusion, also exists in Minority World countries. In 2020, the UK Office of
    Communications (Ofcom) reported that in the United Kingdom, “approximately 9%
    of households with children lacked access to a laptop, desktop, or tablet; 2%
    had no access to the internet and 4% had smartphone only access” with figures
    almost doubled for lower earning households (Coleman, 2021). A 2022 Ofcom report
    put the percentage of households without Internet at 6%, with a further 5% relying
    on mobile Internet (Ofcom, 2022).


    If the Metaverse is to become a vital component of people’s lives, then it must
    be designed and delivered to minimise the disenfranchisement of potential users.
    One of the most basic steps is to ensure that any VR experience or service is
    available as DesktopVR rather than just through an HMD, and for mixed reality
    (MR) experiences to also be available in AR, so that even smartphone users should
    be able to access them. The bandwidth required by a service should also be considered,
    although as noted in Chapter 4, XR experiences can require less bandwidth than
    video chat or streaming a film or TV program. This is also a reason why centralised
    rendering and video streaming as a way of accessing VR content should possibly
    be avoided.


    A further consideration is, of course, that of cost. The Web in general costs
    nothing to access once a user has a smartphone or PC and broadband or mobile connection,
    and ideally the same should be true of the Metaverse. Certain areas and applications
    in the Metaverse may have a cost associated'
