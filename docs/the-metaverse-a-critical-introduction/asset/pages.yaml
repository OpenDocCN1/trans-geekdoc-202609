    # Using the Web


    Whilst Meta has attracted much of the media attention, potentially more interesting
    developments have been taking place elsewhere. The WebGL standard (https://get.webgl.org/)
    was officially approved in 2011 and provides a way to define 3D graphics, including
    DesktopVR immersive environments, with Javascript in an ordinary web page. The
    next crucial ingredient has been the WebXR (https://immersiveweb.dev/ and https://www.w3.org/TR/webxr/)
    standard (developed out of WebVR – https://webvr.info/) and was launched in 2018.
    This enables a WebGL web page/application to sense if it’s running in a VR headset,
    and if so, it offers the user the ability to launch the full HMD-VR experience
    directly from a web page in a browser.


    This combination of technologies significantly enhances the accessibility of both
    DesktopVR and HMD-VR experiences and from an open-source base. Inviting a user
    into a virtual world becomes as simple as sending them a link to click on, or
    embedding it in a web page, and then they can be straight into the DesktopVR experience
    in the browser on their laptop (or even smart-phone or tablet), or into the HMD-VR
    experience if wearing their headset – without any software downloads or even sign-ups.
    There’ll be more on these technologies in Chapter 4.


    The important result is that these technologies are being used by a new generation
    of web-delivered social virtual worlds – notably *Mozilla Hubs*<sup>4</sup> (2018,
    https://hubs.mozilla.com/) (Fodor, 2020) (see Figure 1.17) and Virbela’s *Frame*
    (2020, https://learn.framevr.io/) (see Figure 1.18), as well as in crypto-worlds
    such as *Hyperify* (2022, https://hyperify.io/) (Metamike, 2023). Hubs and'
