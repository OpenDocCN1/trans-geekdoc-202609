- pgno: 15
  md: '# Introduction


    The term “Metaverse” was first coined in Neal Stephenson’s 1992 novel *Snow Crash*
    (Stephenson, 1992) to describe an on-line, three-dimensional (3D) digital world
    which acted as an extension of people’s physical lives. However, much of what
    we now think of as a metaverse was present in the fantasy-style virtual world
    of Vernor Vinge’s True Names (Vinge, 2015), first published in 1981. Some of the
    first practical Metaverse-like environments were the text-based multi-user dungeons
    (MUDs) and object-orientated MUDs (MOOs). But it was the first 3D social virtual
    worlds such as Active Worlds, and particularly Second Life, which began to show
    that something like the Stephenson’s vision could be built in reality. As this
    generation of proto-metaverses began to flounder in the early 2010s, the arrival
    of the Oculus virtual reality (VR) headsets prompted further interest in immersive
    spaces. Mark Zuckerberg’s renaming of Facebook’s holding company as Meta seemed
    to confirm that the Metaverse was still a current vision.


    Many of the recent publications on the Metaverse take a technological or financial
    approach, are focused on the profiteering of Blockchain and non-fungible token
    (NFT)-based worlds, or have a relatively uncritical approach to the topic. Faced
    with such sources, and with the considerable hyperbole of commentaries on platforms
    such as X/Twitter and Medium, it can be difficult for those unfamiliar with the
    evolution of the Metaverse over the last two decades to appreciate the essential
    elements of the Metaverse idea, and to understand the potential pitfalls as well
    as the opportunities that the Metaverse may offer.


    To provide some vital initial context, Chapter 1 examines the history of the metaverse,
    from its origins in science fiction, and the text-based MUDs and MOOs of the 1980s,
    through the 2D and 3D social virtual worlds of the late 1990s and early 2000s,
    and then on to the headset-based VR wave of the 2010s and finally the cryptoworlds
    of the 2020s.


    Chapter 2 considers some of the competing definitions of the metaverse and presents
    ten axioms for what a fully realised Metaverse should demonstrate. It concludes
    with an examination of what it is particularly about the VR experience that makes
    it so different from other Internet-based experiences.


    With a clearer understanding of what constitutes a metaverse, Chapter 3 considers
    the use and impact of the metaverse across a broad range of commercial and societal
    endeavours including business, collaboration, training and education, economics,
    marketing, entertainment, gaming, arts, and defence, drawing examples from over
    20 years’ worth of metaversal activity.


    Chapter 4 looks at the technologies that underpin the metaverse, presenting them
    in a hopefully non-technical way, and identifying which are core to the metaverse
    concept and which are optional.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Chapter 5 considers some of the broader issues and dichotomies that emerge
    when considering the metaverse and the personal, social, and global challenges
    and related opportunities, which any ultimate Metaverse would need to address.


    Chapter 6 brings the foregoing analysis together, looking at the short-, medium-,
    and long-term challenges to the Metaverse, before considering seven different
    scenarios for the future of the Metaverse.


    As we were writing the book, there was something of a shift in terminology in
    some quarters, away from “metaverse” and towards “spatial computing”. We have
    stayed with metaverse for two reasons. First, metaverse as a term has been around
    for a long time as the dominant term for the sort of spaces we are talking about,
    and we expect that it will dominate and outlive spatial computing in most people’s
    minds – despite the latter actually having the longer heritage. Second, and more
    importantly, spatial computing is a very technology-centric term, and, as we hope
    this book will show, the future virtual spaces that we are talking about will
    be far more about the people and the communities within it. If the metaverse really
    delivers, the technology should just fade into the background.


    There are two other considerations that have informed our writing of this book
    – and could be taken as biases. First, we were both highly active in Second Life
    during the 2000s/early 2010s, and this has undoubtedly shaped many of our views
    on what the Metaverse could, and even should be, as well as how we feel Second
    Life and OpenSim compare to other more recent platforms and initiatives. Second,
    we feel that the term “Metaverse” should be kept for the highest common denominator
    model of what the virtual realm should be like, not for its lowest common denominator
    implementations.


    The intention is for this book to be a practical guide to the concept of the Metaverse,
    drawing on academic research and practical and commercial experiences. The aim
    is to give the reader a better understanding of what is meant by the Metaverse,
    how far it is in its evolution, and what the benefits and challenges of the Metaverse
    could be.


    # WEBSITE AND MICROVERSE


    We have created a website to support this book with additional information, links
    (including all URL references), and updates at http://www.themetaverseseries.info/.
    We are also practising what we preach and so have created a 3D microverse accessible
    from that site and within a web browser which provides a “data garden” approach
    (see Chapter 3) to the content of the book and is a place where hopefully we’ll
    be able to meet up with readers and discuss the Metaverse in a metaverse!'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Key Terms


    Any discussion of the metaverse won’t get far without mentioning some of the key
    technologies and concepts related to it. Whilst this book (and particularly Chapter
    4) will describe these technologies in more detail, a summary of each is provided
    (see Tables 0.1 and 0.2) for the benefit of the reader less familiar with this
    area and to clarify how the terms are used in this book.


    | Term | Definition |

    | :--- | :--- |

    | Augmented reality (AR) | Augmented reality overlays digital information onto
    a viewscreen (typically a smartphone, but possibly a heads-up-display or a set
    of glasses) and supplements reality, rather than replacing it. |

    | DesktopVR | DesktopVR refers to VR experiences delivered using a conventional
    2D computer screen (desktop, laptop, tablet, or mobile), in either first person
    (the view out of the avatar’s eyes) or third person (an “over the shoulder” view
    which includes the back of the avatar). A combination of mouse, keyboard, joystick,
    and touchscreen are used for control and interaction. |

    | Head-mounted display VR (HMD-VR) | HMD-VR is VR delivered through a head-mounted
    display (HMD) which fully covers the user’s field of view, completely blocking
    out the physical world. Hand controllers and / or ordinary body movement are used
    for control and interaction. |

    | Head-mounted display XR (HMD-XR) | An HMD capable of delivering both VR and
    MR experiences. |

    | Mixed reality (MR) | Mixed reality overlays 3D digital visualisations onto a
    head-mounted screen or see-through visor, where the digital information is “aware”
    of the physical geometry of the world and the user’s movement in it and can respond
    to both. |

    | Virtual reality (VR) | A 3D spatial, subjective, synthetic digital environment,
    which can be accessed through a smartphone, tablet or conventional computer (DesktopVR),
    or a head-mounted display (HMD-VR). VR completely replaces physical reality in
    the user’s view (and even other senses). |

    | Virtual world (VW) | A VR environment which provides a space for users to interact,
    to have agency and (ideally) some ability to shape the world. Note that in this
    book, “virtual world” and “metaverse” tend to be used interchangeably since the
    term “metaverse”, as commonly used, is now wide enough to encompass almost all
    virtual worlds, and some virtual worlds show more metaversal features than some
    other environments that are being described as metaverses! |

    | Extended reality (XR) | Extended reality is the umbrella term used for all the
    technologies that create immersive experiences in which users interact with digital
    content which augment or replace the perceived physical world. As such it includes
    VR, MR and AR. |'
  merge: -1
  img_proc: true
- pgno: 18
  md: "As mentioned above, the following convention has been adopted within this book\
    \ to discriminate between different uses of the word “metaverse”. An actual definition\
    \ of “metaverse” will be considered in Chapter 2.\n\n| Term | Usage |\n|---|---|\n\
    | metaverse (lower case m) | A persistent digital synthetic environment populated\
    \ by a large number of avatars who have agency and can interact, for collaboration,\
    \ work, recreation, learning, relationships, and/or play; and which may be accessible\
    \ through a range of technologies including VR, MR, and possibly AR. |\n| Metaverse\
    \ (upper case M) | An ultimate manifestation of the metaverse concept, covering\
    \ all metaversal features in a globally used and accessible system, which may\
    \ be a singular metaverse, or a network of interconnected individual metaverses\
    \ – i.e. a multiverse. |\n| metaversal | Exhibiting some or all of the features\
    \ of a metaverse. |\n| multiverse/Multiverse | A network of interconnected individual\
    \ metaverses. It may be that the Metaverse is actually a Multiverse – the capitalisation\
    \ is again reserved for the fully developed manifestation. |\n| proto-Metaverse\
    \ | A metaverse which shows many or most of the metaversal features but which\
    \ is not fully enough developed to warrant the term Metaverse. |\n\n> **FULL DISCLOSURE**\n\
    > \n> Both David and Maggi have actively worked in the metaverse space for around\
    \ 20 years, both independently, through multiple universities, and through David’s\
    \ company Daden Limited. Where projects that they worked on are mentioned in the\
    \ text, an endnote will be included noting their involvement.\n\n**NOTE**: When\
    \ virtual worlds and metaversal platforms are first introduced in the text, they\
