  md: 'possibility. Many people have dreamed about sending a copy of themselves to
    a meeting they don''t want to attend, and this is far more feasible in the Metaverse
    than in the physical world. Indeed, if you have a computer application which is
    working as your virtual assistant and metaphorically sitting on your shoulder
    and watching (and recording and analysing) everything that you do and say then
    giving that virtual assistant temporary control of your metaverse avatar for specific
    meetings may be a logical next step (Burden, 2019).


    # Digital Amortality


    If you have a virtual assistant that knows everything you do, the key question
    then is what happens if you get hit by a (very physical) bus, or otherwise die?
    Can the virtual assistant continue to operate your avatar in your now-perpetual
    absence? Is that assistant (and avatar) owned by you, or your employer or your
    next-of-kin? Can it continue to earn on your (or your employer or your spouse''s)
    behalf? And what legal status does it have anyway? The situation is even more
    vital when one considers not a virtual assistant which has a secondary role of
    standing in for the user but where the user has created a digital twin of themselves
    for the express purpose of both standing in for them during their life (e.g. during
    holidays or sickness, or just as a way of multiplying their earning power) and
    even after it.


    The terms digital amortality for the concept and digital amortal for the entity
    were coined in Neal Stephenson''s Fall; or, Dodge in Hell (Stephenson, 2020).
    They are perhaps better than digital immortality/immortal given the significant
    technical and economic challenges in keeping such an entity operational forever
    (Burden, 2020). Mortality implies a state where the entity can decide if and when
    it wants to terminate its life. Whilst such ideas might seem like science fiction,
    in their most basic form, such systems are already possible (Savin-Baden & Burden,
    2019). The technologies that support them are developing rapidly – Somnium Space
    has already previewed a “Live Forever” mode (Somnium Times, 2023) – so the ethical
    implications need to be considered now.


    As a final aspect of this concept, whilst media explorations such as Upload (Daniels,
    2020) have shown the living and the virtual dead existing in (relative) harmony
    (albeit in divided worlds), it may be that such a positive outcome is not realistic.
    Arthur C. Clarke wrote in 2001: A Space Odyssey that the dead outnumbered the
    living by 30:1 (Clarke, 1968) – although current estimates put that number at
    more like 13:1 (Routley, 2022). What if, in a few decades time, everyone was leaving
    (possibly multiple) copies of their own digital amortal? Perhaps one outcome might
    be a “thanoverse” – a part of the wider Metaverse but which is (largely) inhabited
    by the avatars of the dead. The concept of a thanoverse might even overlap with
    the role of the Metaverse within interstellar'
