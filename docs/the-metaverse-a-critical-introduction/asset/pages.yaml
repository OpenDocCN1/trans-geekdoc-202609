  md: 'Decentraland (2020, https://decentraland.org/) and Cryptoverse (2022, https://www.cryptoverse.vip/).


    The big difference with Second Life era worlds is that all transactions and ownership
    are tracked through blockchains, and land and assets are bought using cryptocurrency
    – and as a result, prices can be excessively high and are subject to the vagaries
    of cryptocurrency speculation. As a result, virtual assets effectively become
    non-fungible tokens (NFTs) – and with the recent craze around NFTs further pushing
    prices beyond the reach of most ordinary users. For instance, on Decentraland
    land, prices are around $40–$300 per square metre, and a new dress costs $2–$20.
    In contrast, in Second Life, land prices are around $0.0016 per square metre,
    and a dress costs around $0.30–$2 (all prices are as of July 2023).


    These costs don''t help with generating high user engagement. Decentraland reported
    only around 57,000 MAUs in September 2022 (Decentraland, 2022), and Au reports
    that Somnium Space''s peak concurrency for Steam users (so may not capture all
    users) over 12 months was only 16 users (Au, 2022b). Symptomatic of this lack
    of traction the Alloverse cryptoworld (2020) closed in 2023 stating that “our
    coffers are now empty, and ... we are taking a break on commercial operations”
    but that they would “transition from an ‘open core’ commercial company with an
    open source center, into a fully open source project” (Bengtsson, 2023). In contrast,
    Second Life had a concurrency of around 30–50,000 in 2022 (Galov, 2023), VRChat
    had a concurrency of around 65,000 in late 2022 (Virtual Girl Nem, 2022), and
    Rec Room hit three million MAUs in mid-2022 (Lang, 2022).


    There may well be a place for the blockchain technology behind these worlds, as
    will be discussed in Chapter 4, but at the moment, they could be seen to be doing
    more to frustrate the development of the Metaverse than to encourage it. Interestingly,
    in their 2024 Manifesto, Decentraland recognises the need to look at “diversifying
    payment methods, improving educational resources, and avoiding crypto slang” and
    to “Imagine a platform that well-comes users unfamiliar with the crypto ecosystem;
    with just your standard social profiles, you can jump into Decentraland and make
    your account—no digital wallet creation necessary, it’s all handled for you behind
    the scenes” (Decentraland, 2024).


