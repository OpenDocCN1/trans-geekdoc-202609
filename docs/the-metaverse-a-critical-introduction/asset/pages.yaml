    FIGURE 1.6 BBC Radio 1 streamed a music festival into Second Life in 2006.


    December 2006 to 11 million in December 2007 (Voyager, 2023), physical world businesses
    started to take an interest. From 2006 to around 2009, the media was full of stories
    of companies like IBM, Nike, Visa, L''Oreal, General Motors, Intel, and American
    Apparel setting up shops in Second Life (Barnes & Mattsson, 2011). There were
    even embassies from Sweden (Bengtsson, 2011), Estonia (Estonia, 2007), and the
    Maldives (Sydney Morning Herald, 2007). The 2007 Davos summit was streamed into
    Second Life, with one session being held in-world by Reuters (Hounshell, 2007).
    The world also became a base for multi-national protest – such as the protests
    about the Burmese government (Borgan, 2007), as well as for global fund-raising
    events, such as the annual Walk for Life (American Cancer Society, n.d.). Even
    politicians have made an appearance (SpeedMatters, 2007), and election campaign
    events have also been held there – such as those for Le Pen and Sarkozy in the
    2007 French presidential elections (Kar-Gupta, 2007).


    Note, though, how many of these references are to 2007. Since much of the early
    corporate involvement was driven mainly by marketing and public relations (David
    worked on projects for General Motors, Visa, and Red Nose Day), as it became clear
    that consumer interest in SL, and social virtual worlds in general, was fading
    and that they weren’t going to be “the next big thing”, much of that marketing
    and enterprise activity disappeared.


    One of the key reasons for the decline was that many users just couldn’t work
    out what Second Life was for. They approached it like a computer game'
