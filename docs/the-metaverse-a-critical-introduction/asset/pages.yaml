- pgno: 25
  md: 'arrivals areas and design whatever onboarding was required. Once you’ve mastered
    the basics; that’s it, you’re on your own, and Second Life or Linden Lab isn’t
    going to tell you what to do next!


    Many new users start with a spot of sightseeing. The Viewer will show you the
    whole world map; how many people are on each sim; and a list of searchable, popular,
    and promoted places. You might want to check out the shops, or a museum, a wilderness
    area, or a clone/tribute to a physical world city or location. You might want
    to try flying, sailing, or skydiving; play a game (on a board or tabletop RPG
    style); or visit a genre-themed area based on Star Trek, Lord of the Rings, or
    a myriad of other themes – all fan built and ideal for virtual LARPing. Or you
    might want to take a class or just hang out in a club or a bar. Just click on
    the map or a location button, and you are instantly teleported to the new location.
    On arrival, there may well be a greeter to welcome you – often an automated robot,
    sometimes a human. You can wander around, interact with things, and do whatever
    you want to do. Some land in SL is set to private, so you’ll often see a big yellow
    grid as you approach a new parcel of land to tell you that you are not allowed
    in. Second Life is big, so walking takes some time, and teleporting misses the
    view, so there are lots of flying in SL. No need for a plane, just jump up into
    the air, Superman-style (angel wings were briefly de rigueur in the early days).


    You’ll fairly soon realise that your newbie clothes make you stand out. So, use
    your credit card on the Second Life website to buy some Linden Dollars (L$, in
    2023 1$ was worth about 320 L$), and then either walk into a shop or use the Viewer-based
    Amazon-style marketplace to buy some new clothes (typical prices range from L$50
    to L$1000 for anything from a new hair style or dress or suit to a whole new body
    shape and skin texture –prices depend on the quality).


    Soon, you might get bored with passively consuming Second Life and want to start
    building. Find yourself a Sandbox (a public area to practice building in, wiped
    automatically every so often), look at the Wiki tutorials, and rez (make appear)
    your first 1-m wooden looking cube. Stretch it, colour it, and twist it. Then,
    add a sphere, then a cone, and so on, joining them into groups and groups of groups.
    At any stage, save a copy into your inventory ready to be rezzed elsewhere later.
    If you’re already familiar with 3D build tools such as Blender, then you can import
    your existing objects directly into Second Life. You can learn basic scripting
    at the same time, just add a script to change the object’s colour, make it jump
    into the air as someone approaches, or read out live stock market prices, and
    customise the script as much as you want.'
  merge: -1
