- pgno: 106
  md: 'of the past and let researchers then use them to try and put on the plays of
    the time and so get a better understanding of the interaction between play and
    play-house (Childs, 2008).


    # History and Heritage


    One of the much-touted abilities of virtual environments is their ability to drop
    you into a life-like representation of the past. Museums and historic locations
    such as Angkor Wat (Chandler & Clulow, 2019) and Avebury Ring (Falconer et al.,
    2020)³ have been built using VR to help researchers and visitors better understand
    the past, or help the community that lives amongst a site (Forte et al., 2010).
    Heritage Immortalised (https://www.facebook.com/hereimmc/) has run competitions
    in Minecraft to build both UNESCO World Heritage Sites and Intangible Cultural
    Heritage representations. AR has also been used in site-specific ways to overlay
    now missing buildings on the modern landscape, or to better examine objects which
    would otherwise be in glass cases (Luna et al, 2019). There has been a tension
    as to the extent to which museums (and galleries) should use VR to enable remote
    access to their collections (Ocausse, 2016).


    In a Metaverse, one would ideally like every museum to have its collection (and
    not just what fits on public display) accessible by XR, and ideally not only as
    gallery artefacts but shown in context. The Metaverse should also allow institutions
    to collaborate, so that, for instance, a virtual iron age village can be filled
    with the best artefacts from across Europe’s museums and presented in whatever
    language, and to whatever educational level, the user desires. The virtual locations
    need not be passive but could be filled with human or artificial intelligence
    (AI)-controlled avatars to provide the “living history” experience, explaining
    the cultural, artistic, or scientific significance. Visitors could even be invited
    to role-play within the environment themselves. Making such resources available
    on demand would also enable educators to better integrate them into all levels
    of the curriculum, so the “museum trip” doesn’t (just) become a once-a-year thing
    but is something that can be brought into every relevant lesson. There are of
    course issues of scalability here, and students should absolutely still have the
    chance to see and potentially handle the physical objects and walk the physical
    sites.


    Another important aspect is the use of metaverse technologies to help professionals
    explore and understand the past. The use of photogrammetry and light detection
    and ranging (LIDAR) to capture accurate 3D models of objects or terrains is well
    developed. Enabling researchers to experience this information in a subjective
    as well as an objective way inside a virtual environment – and one into which
    they can readily invite fellow researchers from across the globe (and in which
    they may have available all of the collaboration tools mentioned earlier) – is
    already helping archaeologists to collaboratively interpret the artefacts that
    they are finding (De Bonis et al., 2022).'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# # Relationships and Sex


    As already described, virtual worlds give people the opportunity to play with
    their identities, and sex and pornography have been significant elements in the
    development of virtual worlds. This section will look at the more organized uses
    of metaverse technologies in support of relationships and sex, and Chapter 5 will
    return to the issue of the metaverse and identity.


    The dating application market was worth nearly $5bn in 2022, mostly from Tinder
    owner’s Match group (Curry, 2023), and Tinder has around 75 million monthly active
    users (Iqbal, 2023). Several companies, such as Flirtual (https://flirtua.l/)
    and Nevermet (https://www.nevermet.io/), have looked at how VR can be used to
    provide a “virtual first date” experience – providing something potentially as
    engaging as a video call or real-world meeting, but without the same level of
    risk (emotional and physical). Virtual dating apps can also provide a more “organic”
    way of introducing people (Sharabi, 2022).


    In considering the use of VR for pornography, HMD-VR headsets can be used to privately
    view either ordinary video or stereoscopic video (see Chapter 5), the latter giving
    a greater sense of immersion and a more visceral reaction to what is being viewed
    (Simon & Greitemeyer, 2019). Moving beyond video, individual users are already
    exploring avatar sex, and so it should be no surprise that businesses are investigating
    this as a new business model. One of the first was the Red Light Centre, a virtual
    world focused on human-controlled avatar-based sexual encounters (Schultze, 2019).
    Another approach is the use of computer-controlled avatars in applications such
    as Virt-a-Mate, and there seems to be a growth in applications that include the
    virtual “girlfriend experience” (Milrod & Monto, 2012) and story-path choices,
    merging narrative and pornographic genres (Joho, 2021).


    Evans (2023) reviewed 23 articles on VR pornography, including the role of VR
    as an “empathy machine”, and developments such as teledildonics and their implications
    for fidelity. Pornographic VR has also been used therapeutically to help with
    sperm donors and cancer victims (Rosenkjaer et al., 2022).


    Alongside pornography are the serious issues concerning the exploitation of sex
    workers and the objectification and self-objectification of women. Cijntje and
    van Gisbergen (2023) studied the impact of VR pornography (VRP) on relationship
    fidelity and betrayal, considering the differences between passively watching
    VRP and engaging in interactive VRP, and where avatars resemble real partners.
    Fox et al. (2013) studied how women’s self-perception and attitudes changed viewing
    sexualized or non-sexualized avatars in a virtual world, especially when the avatars
    had the participant’s face. Nesbitt (n.d.) notes that with the emergence of VR
    “society begins to encounter new questions of cybersex work. Is regulation needed
    to neutralize dangerous sectors of virtual reality cybersex work?”.'
  merge: -1
  img_proc: true
