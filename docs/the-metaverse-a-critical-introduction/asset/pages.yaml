    | Au (2023) | “The Metaverse is a vast, immersive virtual world simultaneously
    accessible by millions of people through highly customisable avatars and powerful
    experience creation tools integrated with the off-line world through its virtual
    economy and external technology”. |

    | Ball (2022) | “A massively scaled and interoperable network of real time rendered
    3-D virtual worlds that can be experienced synchronously and persistently by an
    effectively unlimited number of users with an individual sense of presence, and
