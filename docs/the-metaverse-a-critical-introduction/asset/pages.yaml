    # Summary


    This chapter has examined 15 different areas in which tensions exist in how the
    Metaverse may develop. Those tensions range from relatively technical ones such
    as whether it is closed and centralised or open and decentralised through wider
    issues that matter to the individual such as privacy, legality, identity, and
    accessibility to global issues around climate change, global equality, and the
    impacts on society as a whole. The next, and final, chapter will take a broad
    look at the future development of the Metaverse and examine seven different scenarios
    as to how the Metaverse could develop, each charting a different course through
    these challenges and delivering a very different set of issues and opportunities.


