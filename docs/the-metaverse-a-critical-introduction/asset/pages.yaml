- pgno: 87
  md: '# Summary


    This chapter has considered some of the different definitions of the “metaverse”
    and presented 10 axioms that have guided the analysis of the Metaverse within
    this book. It has looked at the different types of virtual experience that are
    usually associated with the metaverse concept, and introduced the ideas of proto-metaverses,
    microverses, and the multiverse. The chapter has considered how Second Life and
    OpenSim can be seen as arguably the best examples of a proto-metaverse – and how
    they could be further improved. Finally, the chapter has considered the psychological
    underpinnings of the VR experience which are at the heart of most metaverse concepts,
    and which make them so compelling, and identified some of the challenges inherent
    within VR use. Chapter 3 will look at the different ways in which these virtual
    world spaces and XR technologies have been used across a wide range of different
    sectors and use cases in order to demonstrate that the Metaverse is not just a
    good idea, but that it can bring proven benefit.


