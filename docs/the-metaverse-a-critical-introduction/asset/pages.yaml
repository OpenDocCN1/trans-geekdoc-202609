- pgno: 187
  md: '# The Future of the Metaverse


    # Introduction


    Having looked at the past and present of the Metaverse, and given some consideration
    to the factors that might be shaping the Metaverse, this final chapter looks to
    the future of the Metaverse. The chapter is divided into two parts. The first
    uses two lenses to look at the idea of the Metaverse and considers what needs
    to be done to encourage the development of a compelling, ubiquitous metaverse
    or multiverse environment, and what some of its implications might be. The two
    lenses are considered:


    +   - The ReLive 2011 Delphi Study; and

    +   - Marshall McLuhan''s Tetrad.


    The second part of the chapter presents seven different future scenarios, each
    examining a possible way in which the Metaverse might develop – for good or ill.


    It should be noted that, just as for the rest of this book, this chapter does
    not talk about projections for “metaverse market growth” or “metaverse market
    value”. Such discussions make little sense when people cannot even agree on what
    the word Metaverse actually represents. Also, as discussed earlier, the true value
    of the Metaverse is more likely to come from the people using it, and how they
    use it. In terms of market size, global internet access is around 50% (United
    Nations, 2021), global mobile smartphone penetration is at around 80%, and mobile
    phone penetration is at around 90% (Deloitte, 2017). The aim should surely be
    for every one of these people to have access to the Metaverse, and of course to
    support actions to raise all of these to as near to 100% as possible. Access to
    the Metaverse should also not be dependent on access to (or sales figures of)
    a head-mounted display XR (HMD-XR) headset. The Metaverse should be an integral
    part of the on-line experience for everyone.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# The ReLive Study


    Back in 2011, the Open University held its second Research Into Learning in Virtual
    Environments (ReLive) conference, which both Maggi and David attended – Maggi
    being on the Academic Committee. The conference conducted a Delphi poll to ask
    attendees about what they thought the short-, medium-, and long-term challenges
    and opportunities of virtual worlds were (Burden, 2011). The study identified
    the following goals (which are shown graphically in Figure 6.1):


    +   - **Short Term** (c.2011–2013) – Make virtual worlds seamless and desirable;

    +   - **Medium Term** (c.2013–2020) – Provide mobile access and unify virtual
    worlds; and

    +   - **Long Term** (c.2018 onwards) – Embrace novel interfaces devices (e.g.
    head-mounted display VR [HMD-VR]) and respond to and create societal change.


    Note where HMD-VR was placed. Having already revisited this forecast in 2020 and
    2022 (Burden, 2022), it still offers a useful lens through which to examine the
    development of the Metaverse, over 13 years after its initial creation.


    | Short Term | Medium Term | Long Term |

    | :--- | :--- | :--- |

    | **SEAMLESS**<br>Easy to use, browser access, webcam integration | **MOBILE**<br>Access
    from mobile devices, not just desktops. | **RADICAL INTERFACES**<br>HMD-VR, interacting
    with AIs, brain-computer interfaces |

    | **DESIREABLE**<br>Clear benefits for organisations and consumers. Entertaining,
    engaging and easy. | **UNIFIED**<br>Integration & teleportation between experiences.
    Movement of assets and identities. | **SOCIETAL CHANGE (IN & OUT)**<br>Terrorism,
    surveillance, death of distance, living with AIs, living in the virtual world
    |'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Seamlessness


    Even back in 2011, the barriers to entry of a social virtual experience were seen
    as too hard. Key issues considered were making these spaces accessible in the
    browser, and whether users would be faced with one “world” through which all spaces
    could be accessed, or whether there would be a plethora of virtual worlds, all
    catering to different audiences (a forerunner of the Metaverse vs. Multiverse
    argument) – audiences often being as much dissuaded by choice as attracted by
    it. Linked to these was the challenge of discovery and direction. Were virtual
    worlds environments that people discovered – through word of mouth or the media,
    or were they places they would be directed to – by retailers, entertainers, search
    results, educators, and so on? Essentially, would a push or pull model dominate,
    or would it be a combination.


    The need to integrate webcams and desktops into the virtual experience was also
    identified, enhancing the productivity of virtual worlds for “serious” use and
    more personal interactions. Even the ability to trigger avatar gestures and facial
    expressions from webcam inputs was being discussed.


    The need to integrate with (rather than dominated by) social media platforms was
    identified. Why create one profile on each virtual world when they could all (if
    the user wished) share an existing social media profile.


    Finally, the different needs of users, creatives (or more generally creators),
    and professionals were highlighted. It might be one virtual world, but each user
    was likely to want a different set of features and functionality and different
    ways to access, manage, and share experiences.


    Even now, this still doesn''t seem like a bad to-do list for people trying to
    enhance the development of the Metaverse. Of the specific items discussed:


    +   * Browser access has arrived, principally through WebXR, Hubs, and Frames,
    but in doing so, much of the feature set of virtual worlds has initially been
    lost;

    +   * We are still in the plethora of virtual worlds state, with no sign of a
    single point of access;

    +   * The challenges of discovery and direction remain. Metaversal experiences
    aren''t a tab on the search page, and there is often no URL to pass around to
    bring people into the same space;

    +   * Webcams and desktop sharing are being integrated, although access to Desktop
    apps is only slowly coming;

    +   * Triggering avatar gesture and facial expression from webcam inputs is technically
    proven but still not a common feature;

    +   * Integration with social media platforms is happening (at least for Meta/Oculus/Facebook)
    but is from a dominant position, and not helping with seamless access across platforms;
    and'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   • The different needs of users are still being addressed through completely
    different platforms, not through different User interfaces (UIs) and feature sets.


    The important message at ReLive11, and for now, is that users (rather than tech-enthusiasts)
    just want things to work. The whole experience needs to be easy and seamless,
    and until this is sorted (and it''s debatable whether it even has been with the
    Web and web applications), gaining users will always be an uphill battle.


    # Desirability


    Returning to the theme of push versus pull, the second ReLive strand revolved
    around how to make virtual worlds desirable – a recognition in itself that the
    existing pull wasn’t enough. Apart from reinforcing the message above that virtual
    worlds needed to be easy to access (and fun and engaging to be in), several areas
    were identified where case studies needed to be assembled and arguments clearly
    communicated, including:


    +   - Learning benefits for educators;

    +   - Business benefits and cost savings for industry and government;

    +   - Revenue generation opportunities; and

    +   - Social benefits for consumers and family.


    As Chapter 3 showed, there are ample case studies from across the widest range
    of industries and public life that show the benefit of XR technologies – but communicating
    these to organisations and the public at large remains a challenge. At present,
    there may be a danger that by too closely allying the Metaverse with HMD-VR technologies,
    which as discussed have a range of issues, that the DesktopVR (and especially
    mobile) approach to the Metaverse is being at best forgotten or at worse ignored.
    DesktopVR (in its broadest sense) is the lowest barrier to entry into the idea
    of the Metaverse and its benefits, and perhaps along with better communicating
    the benefits of metaversal approaches, there should be more focus on non-HMD-VR
    methods to access the Metaverse.


    DelSignore (2022) identifies two barriers to desirability with HMD-VR, the form-factor
    of headsets, and the disconnectedness that people feel when using HMD and VR applications.
    Each iteration of HMDs is improving on the first issue, and the Quest 3 is vastly
    better than the DK1, and whilst the Apple Vision Pro does away with the controllers,
    it also adds a cumbersome cable and battery pack – we are a long way yet from
    the holoband of Caprica. The disconnect issue is possibly one which the Metaverse
    solves which the metaverses don’t. With greater interoperability and commonality
    between'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'metaversal spaces, more of us will be in them more of the time, and bringing
    our two-dimensional (2D) web tools with us, and able to communicate across spaces
    and applications in a way that just isn’t possible at the moment.


    One reason why the take-up of metaversal experiences has not been as high as expected
    may be linked to the concept of lean-forward and lean-back media (Picone, 2007).
    Lean-back experiences are those involving minimal input from the user – they are
    passively consuming the content, and as such, the user does not need to invest
    much thought in accessing the content and can attend to other things at the same
    time. In contrast, lean-forward media, such as games and of course virtual worlds
    and the Metaverse, require users’ almost complete attention and to forgo what
    is happening in the physical world around them. This means that lean-forward media
    have a significantly higher barrier to entry – doing something in a virtual world
    is never going to be as easy and undemanding as watching a TV programme. Even
    many Zoom calls can become predominantly lean-back activities. As a result, virtual
    worlds and the Metaverse, particularly when thought of as an entertainment or
    even a collaboration or learning environment, need to provide a higher level of
    proof of worth and reward than some competing media if the user is going to see
    the participation as worth the higher investment. It also suggests that barring
    some of the pathologies discussed in Chapter 5, we should not be expecting people
    to spend their whole time in the Metaverse, since it is a tool to be used across
    your work, family, and recreational lives, sharing time with mobile, TV and more
    traditional computer screen time, but only slowly shifting some other physical
    activities from the physical to the virtual.


    # Mobile


    Back in 2011, the advantages of getting the virtual world experience off of the
    desktop and into the literal hands of users through mobile devices were well recognised.
    There were some early experiments with video streaming and 2D clients, but a decade
    or so later, having a mobile metaverse experience is almost a done deal. Many
    massively multi-player online games (MMOs) and metaverse apps run natively on
    mobiles, WebGL worlds run in mobile browsers, and Facebook even made mobile access
    to Horizon Worlds one of the highlights of its Connect 2023 event (IGN, 2023).
    This is probably the only one of the six issues raised at ReLive that can be marked
    as essentially done – but it needs to be done for every metaversal platform.


    # Standards and Integration


    If there was not going to be a single, monolithic Metaverse, then even in 2011,
    it was recognised that the metaverses that do exist should be interoperable to
    a high degree so that identity, assets, and even functionality can be moved between
    them. Three approaches were discussed, all of which are still highly relevant
    to today’s debate about how to integrate different'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_192_0.png)


    FIGURE 6.2

    Three different models of integration.


    metaversal spaces into a coherent multiverse. The three models (represented in
    Figure 6.2) are:


    +   • **Interoperability** – Each constituent metaverse runs on its own software,
    with its own internal data standards, but there are agreed interfaces between
    the systems (for instance, the exchange format of a three-dimensional [3D] model
    or a packet of account information). These interfaces should ideally be based
    on open standards so that anyone can participate.


    +   • **Outeroperability** – There is a central repository of the core information
    which applies across multiple environments (for instance, account information,
    avatars, etc.), and each environment then makes use of these to inform its own
    operation. This is the model that is being seen with services such as ReadyPlayerMe
    where the user’s avatar is defined and stored in a third-party application, and
    then accessed and realised by individual platforms. Again, this should be based
    on open standards, and ideally the software driving the central services should
    be open source.


    +   • **Common Technology** – Each constituent is running on effectively the same
    code, although there may be some local enhancements (e.g. in security, functionality,
    or performance). However, anyone can run a component of the infrastructure, and
    the code should be open source. This is the model implemented by OpenSim and also
    Mozilla Hubs server edition. It is also fundamentally the model used in the early
    days of the Web.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'There is also a good discussion of interoperability for the Metaverse in *Interoperability
    in the Immersive Web* (E, 2022).


    Whilst the Metaverse remains based on proprietary technology and walled gardens,
    with minimal interoperability, there is a high chance that the Metaverse will
    never reach its full potential and may well fail as users become frustrated with
    different accounts, different capabilities, and redundant assets. However, beyond
    the core web page functionality, we need to bear in mind that these problems haven''t
    really been solved for the 2D Web either.


    # Radical Interfaces


    In 2011, the radical interface that people mainly had in mind was the HMD-VR.
    This was in the period between Virtuality, which gave many people their first
    taste of HMD-VR, and the launch of the Oculus DK1 which finally delivered an HMD-VR
    at a price that most developers could afford – and in 2013, so almost two time
    bands early! Since then, Meta’s Quest series has steadily improved the capabilities
    of an affordable, stand-alone HMD-VR headset, and with the Quest 3 being an affordable
    HMD-XR headset.


    Another novel interface considered was that of using webcams and audio to interact
    with the physical world with virtual characters in the virtual world – typified
    by Lionhead Studio’s Project Milo demonstration (Chung, 2010). The already mentioned
    Lucy from Fable Studio’s *Wolves in the Walls* (Billington, 2018) is probably
    the closest so far to that demo, although all in VR, but the general developments
    around artificial intelligence (AI) characters suggest that this sort of interactivity
    between virtual avatars and physical people, whether in games, virtual worlds,
    between worlds, or through smartphones will become increasingly common.


    The final interface considered was that of the brain computer interface (BCI).
    As discussed in Chapter 4, this technology may actually be what moves the Metaverse
    from a could-have to must-have for a variety of reasons, but the technological
    progress towards it remains slow.


    # Societal Change


    The Metaverse as concept will only be safe from failure once it becomes embedded
    in society, in the same way that the TV, mobile phones, and the World Wide Web
    have. The two aspects of societal change considered at ReLive were:


    +   • How will virtual world (aka metaverse) development will be impacted by developments
    in the physical world? and


    +   • What impact will virtual world/metaverse use have on society itself?


    Chapter 5 has considered a variety of issues such as the ongoing tensions between
    privacy and surveillance, the variation in cultural norms across'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'the globe, the push towards home working, and other societal and global factors
    that may both encourage the development of the Metaverse and give cause for challenge.
    The chapter also looked at how the Metaverse could impact global society. This
    could be just by contributing to the “death of distance”, supporting homeworking
    and virtual team-working and maintaining global links with family and friends.
    Or it could be more profound, making us more aware of global issues (especially
    climate change), enhancing the overview effects, and making us more open to different
    cultures, viewpoints, lifestyles, and sexual and gender choices through a greater
    ability to directly and indirectly experience these for ourselves. Looking further
    to the future, the Metaverse might give rise to new societal forms which pay far
    less attention to physical locations and politics and may also become the place
    where we interact with advanced AIs and even digital amortals.


    Whether we have a firmer idea, 13 years after ReLive11, as to what societal change
    may be possible through the Metaverse is probably another moot point.


    # A New Timeline?


    Based on the progress that has, or hasn’t, been made since the original 2011 ReLive
    Delphi study, Figure 6.3 shows a possible future timeline, based on the analysis
    above, of how the development of the Metaverse concept could be focussed.


    ![](img/a1f0838ef56b3ffb455ace32842c1458_194_0.png)


    FIGURE 6.3

    An updated ReLive-style plan.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Marshall McLuhan''s Tetrad


    Marshall McLuhan’s Tetrad (McLuhan & McLuhan, 2017), shown in Figure 6.4, was
    originally developed to consider changes in the media but is a useful tool to
    analyse any new technology or phenomena – such as the Metaverse. It consists of
    four questions:


    +   - What does a technology, medium, or any human artefact enhance?

    +   - What does it obsolesce?

    +   - What does it retrieve that had been obsolesced earlier?

    +   - What does a medium flip into when pushed to the limits of its potential?


    # What Does the Metaverse Enhance?


    The Metaverse effectively gives us superpowers. It enables us to go anywhere,
    see anything and do anything – as long as it’s in the virtual realm. Through MR,
    it also enables us to enhance reality, bringing in information and even new virtual
    objects in order to better see things as they were, as they are, or as they might
    be.


    # What Does the Metaverse Obsolesce?


    The Metaverse should not obsolesce the 2D Web or the mobile phone; the Metaverse
    is about subjective experience – not objective experience. The


    ![](img/a1f0838ef56b3ffb455ace32842c1458_195_0.png)


    **FIGURE 6.4** Marshall McLuhan’s Tetrad (after McLuhan & McLuhan, 2017).'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Metaverse may obsolesce some types of travel (particularly air travel), which
    would be good for the climate, and potentially does so whilst enabling a better
    sense of “being there” than the webcam or TV travel show. The Metaverse might
    help obsolesce some old-fashioned attitudes towards different cultures and lifestyles
    and could even help obsolesce some of the issues around global inequality and
    cultural divisions. It may even, through the emergence of new forms of society
    and governance, help obsolesce the nation-state.


    # What Does the Metaverse Retrieve That Had Been Obsolesced Earlier?


    The Metaverse retrieves the campfire. It brings global technology back to a group
    of people sat around a (virtual) fire chatting. It should retrieve storytelling,
    giving people the tools to tell their own stories and have their own adventures,
    rather than passively consuming high-gloss media. It may even retrieve imagination.


    # What Does the Metaverse Flip into When Pushed to the Limits of Its Potential?


    It may be that the Metaverse becomes an unsavoury world populated by griefers,
    con-men, sex-pests, criminals, and terrorists; a virtual slum. Worse still though,
    it becomes a siren’s song, somewhere that is so nice, where we feel so good, that
    we neglect our physical selves, physical relationships, and physical planet.


    These are summarised in Figure 6.5.


    ![](img/a1f0838ef56b3ffb455ace32842c1458_196_0.png)


    FIGURE 6.5

    A Tetrad for the Metaverse.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# # Scenarios of the Future


    Trying to predict a specific future for the Metaverse is probably a pointless
    challenge. Not only do people and companies still have different ideas as to what
    the Metaverse is, but the underlying technologies, and society''s attitudes towards
    them, are constantly evolving. However, it is important to have some view about
    what the future might bring. Having some possible scenarios of the future can
    provide a set of landmarks in a map of the future and help us to identify in which
    direction the real future is heading as it unfurls. This is especially important
    if the aim is to try and guide development in some directions and avoid developments
    in others. This section looks at seven possible future scenarios (illustrated
    graphically in Figure 6.6):


    +   - The Failed Metaverse – where the Metaverse never becomes more than a niche
    interest;

    +   - The Corporate Multiverse – where the future is all about walled gardens
    and single-purpose worlds;


    ![](img/a1f0838ef56b3ffb455ace32842c1458_197_0.png)


    **FIGURE 6.6**

    Seven future scenarios for the Metaverse.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   • The Lawless Metaverse – where we have a Metaverse, but it becomes so
    lawless and uncontrolled that most people avoid it;

    +   • The Totalitarian Metaverse – where one organisation (or group) runs it as
    a fiefdom;

    +   • The Pragmaverse – a more likely medium-term future;

    +   • The Metaverse of Eden – an idealised medium-term future; and

    +   • The Interstellar Multiverse – a possible long-term future.


    For each, consideration is given as to what the steps might be towards their emergence,
    the positive and negative aspects of each scenario, and what could be done to
    encourage or discourage its realisation. For alternative views, read *The Metaverse
    in 2040* report by the Pew Research Centre which canvassed the opinions of a variety
    of experts across different fields of the Metaverse (Anderson & Rainie, 2022).


    # The Failed Metaverse


    If this book was being written about 10 or 12 years ago, then this might well
    be the scenario that was seen as having come to pass. After *Snow Crash* initiated
    the discussion about the Metaverse, the early 3D worlds of the late 1990s rapidly
    explored the idea, and then in *Active Worlds* and *Second Life*, platforms were
    released that actually fulfilled many of expectations of what the Metaverse should
    be. The hope at the time was that we would see a steady improvement in the capabilities
    of platforms like *Second Life*, more and more successful case studies emerging,
    and a gradual but steady adoption of this version of the Metaverse.


    But somehow it all went wrong. Pricing and policy changes at *Second Life*, ongoing
    user frustration, and minimal progress on integrating the different platforms
    all helped to frustrate the expected growth. The nail in the coffin, ironically,
    was possibly the release of the Oculus DK1 HMD-VR, and from 2013 onwards, it seemed
    that anything that didn''t promote HMD-VR was dead in the water. The first great
    experiment in the Metaverse had failed.


    # How We Get There


    The question has to be, will there be a failure in this second wave of the Metaverse?
    The way that the Metaverse has become aligned in some quarters with the speculation
    and profiteering of cryptocurrency and non-fungible tokens (NFTs) would seem to
    make a metaverse crash more likely. The sales of HMD-VR headsets look good on
    the face of it, but market penetration is still very low. Issues such as cybersickness,
    having the space to use the devices'
  merge: -1
  img_proc: true
- pgno: 199
  md: '(especially in European homes), and the isolation and vulnerability that using
    a headset brings all seem to mitigate against a sudden uptick in adoption. Indeed,
    during the writing of this book, we have seen a shift away from “metaverse” and
    towards “spatial computing”. The ongoing lack of integration between platforms
    (as in the 2010s) doesn’t help, and we’ve still never really delivered on those
    first two “short-term” priorities of ReLive 2011 – desirability and ease of use.
    Ironically, and perhaps a reflection of the technology push rather than societal
    pull, industry has actually done a lot better on achieving the medium- (mobile
    access) and long-term (HMD-VR) goals. This technology focus perhaps lies behind
    the rebranding of many technology and businesses metaverse activities as spatial
    computing – a tech term if ever there was one, and one which, as discussed earlier,
    seems to eliminate the human.


    # What Is It Like?


    In this scenario all of these frustrations build, there is a big crypto/NFT crash
    (or at least investors decide that cryptoworlds aren’t the place to be), and by
    soon, the whole Metaverse bubble has burst, and people have moved on to something
    else. A few die-hards are still using the social virtual worlds such as Second
    Life, OpenSim, and Frame, and most of the business collaboration platforms have
    gone bust as users found their cost-benefit calculus didn’t work out, although
    some of the large event platforms such as VirBela and AmazeVR may struggle on.
    The two bright spots are that there is a slow continued growth in the use of DesktopVR
    and HMD-VR for learning and training (but “metaverse” is now a dirty word and
    vendors have stuck with “spatial computing” or gone back to “virtual experience”),
    and MMO games such as Fortnite that make the Metaverse fun, and those that offer
    the user a degree of agency such as Minecraft and Roblox continue to do well,
    reborn in a different form for each new generation.


    There probably aren’t any really specific pros and cons to this scenario – other
    than a broad failure to capitalise on the possibilities of the Metaverse, so what
    can be done to avoid ending up in this scenario (assuming that there is no will
    to work for failure).


    # Discouraging the Failed Metaverse


    One of the key drivers in creating The Metaverse Series was an awareness that
    a lot of the debates around the idea of the Metaverse had already been going on
    since the early 2000s, or even earlier – and not just discussion but practical
    implementation , experience and real research. However, a lot of the current debates
    around the Metaverse seem to be taking place in ignorance of them. The metaverses
    of the 2000s largely failed, and many of the roots of that failure are in the
    issues identified in the ReLive conference in 2011. If history is not to be repeated,
    and the Failed Metaverse scenario is to be avoided, then all'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'involved in the consideration and development of today’s metaverses would do
    well to heed these discussions from the past and to address the problems and challenges
    identified throughout this book.


    # The Corporate Multiverse


    In the absence of any other major drivers, and assuming that at least some of
    the actions described above are taken in order to discourage the Failed Metaverse,
    the Corporate Multiverse seems like it may be the default destination.


    # How We Get There


    Companies like Meta and Epic in the West, and Baidu, Alibaba, and Tencent in China
    continue to expand on their fledgling early steps into VR and MR space and slowly
    build out the Metaverse. Meta’s *Horizons* is perhaps an example, starting as
    just your “welcome page” when you put on your headset, then becoming *Venues*
    and a place to view streamed content, then *Horizon Home* where you can customise
    your home experience, before finally becoming *Horizon Worlds* where you can socialise
    with other people and build experiences and share them. Backed by large marketing
    budgets, these worlds have a sense of safety and are the default experience on
    popular hardware. As long as the range of experiences and features is keeping
    track with what the majority of users enjoy, these corporate worlds could retain
    a default position in the consumer space. Entertainment and game brands might
    partner with these companies or feel big enough to develop their own brand worlds.
    In the business space, a similar model develops, with leading business solution
    providers developing worlds focused on business collaboration and training and
    learning providers establishing go-to training and education worlds, and so on.


    # What Is It Like?


    Whilst there might be some commonality in terms of the underlying technology,
    and some worlds may even feel quite similar, each world is its own ecosystem,
    with minimal ways of moving identity, assets, or experiences between them. This
    is very much a collection of separate metaverses, rather than a single Metaverse
    or a federated Multiverse. A possible analogy is the pre-World Wide Web days when
    the “information superhighway” was dominated by discrete systems such as Prodigy,
    AOL, and CompuServe. Strict corporate control probably also means that stability
    and security are favoured over creativity and imagination, so user agency, particularly
    in terms of'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'in-world building and especially scripting, may be limited. User-generated
    content (UGC) is only encouraged where it meets corporate guidelines and can improve
    the corporate bottom line. The worlds may look very pretty, but they could be
    seen as gilded cages.


    # Affecting the Evolution


    Whilst some might be happy with such a future, our assumption is that most users
    would like more freedom, agency, flexibility, privacy, and ownership than this
    scenario provides. The key to this is probably in ensuring that it is as easy
    for someone to establish their own metaverse space – at both the server and experience
    level – as it is for them to buy web hosting and build their own website. This
    in turn suggests ensuring that the key technologies that drive the metaverse are
    open source and based on open standards – encouraging innovation and exploitation.

    There is also a need to demonstrate to less engaged users that the potential of
    the Metaverse far outstrips the sanitised and restrained version being promoted
    by corporate organisations – encouraging them to move to other providers to take
    the full advantage of the potential of the Metaverse.


    # The Lawless Metaverse


    If the Failed Metaverse shows what happens if things go wrong at the very beginning,
    then the Lawless Metaverse shows what happens if they go wrong along the way.


    # How We Get There


    Metaverse developments might begin in a very promising direction. The software
    and hardware required are steadily developed and adopted, multiple worlds, or
    even a few dominant worlds become established within the Metaverse, and for a
    while, things look good. But just as social media has become something of a troll''s
    playground, and scammers and hackers abound on the web and the Internet, so too
    will the less savoury parts of society recognise the opportunities for money,
    mayhem, and maliciousness in the Metaverse. Having an avatar in your face, shouting
    abuse, or using some hack to disable your movement, or even force your movement
    whilst shouting obscenities or waving a giant pixel penis at you (or worse) is
    likely to dissuade many users from engaging with the environment, and it rapidly
    sinks to a lowest common denominator space. As Chapter 1 related, at least one
    high-profile proto-metaverse (Google''s Lively) closed partly as a result of in-world
    abuse and, as discussed, abusive uses of metaverse spaces continue to be an issue,
    as do concerns over privacy, illegal activities and even hostile action.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# What Is It Like?


    In this scenario, the Metaverse becomes more-or-less a part of the so-called Dark
    Web. It''s a place that people only tend to visit if they''re participating in
    activities which are dubious or outright illegal. Pornography, theft, violent
    images, and extreme abuse are commonplace. Countries with age verification programmes
    might restrict access to it, or it may be somewhere that you can only get to through
    a Metaverse version of the Tor browser. Given the user and operator concerns over
    security, it is more likely to be a Multiverse rather than a singular Metaverse,
    with lots of discrete servers loosely linked into a network of worlds, with blockchain
    or similar technology controlling access, asset ownership, and transfers between
    worlds.


    # Avoiding the Lawless Metaverse


    Probably the biggest requirement to try and avoid a Lawless Metaverse is to ensure
    that safety and security features and tools are present in every metaverse development,
    that users are not only aware of their existence but are also comfortable with
    their use, and that there is good but fair governance.


    Whilst some might object, having each account linked to a traceable real-world
    identity is probably a basic step – although that is not to suggest that users
    cannot operate anonymously within the world as far as other users are concerned.
    What does it mean, though, is that if a user transgresses the platform or community
    guidelines or applicable laws, then appropriate sanctions (including not only
    banning of current accounts and future access but also physical world legal action)
    can be taken. There are of course civil liberty issues here, and how these are
    dealt with within a multi-national context are of prime concern. Also, if the
    Metaverse becomes essential to daily life, then lifetime bans might not be feasible
    – and a foolproof electronic means of restricting capabilities and freedoms (perhaps
    the virtual equivalent of an electronic tag) may be required.


    At a lesser level, virtual worlds have long included a variety of personal safety
    features, such as the zones of safety described in Chapter 2. Many worlds allow
    you to mute aurally and visually specific users who are annoying you, along with
    being able to report them for abuse. Privately owned areas can establish their
    own ban lists for people who transgress local bye-laws. Automated and AI surveillance
    can also be used to enforce things like content guidelines for imagery, chat,
    and potentially even 3D models. Some worlds (e.g. Second Life) require users to
    flag privately held areas with content classification ratings similar to films,
    so that areas could be rated U (for anyone), A (advisory or accompanied), 15 (age
    15 or over), 18 (18 or over), or X (deliberately explicit material). Age verification
    on accounts could then help ensure that accounts are matched to classifications
    – but a child using an adult’s account may be hard to prevent (although the same
    cameras that'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'enable facial expression detection might also be able to implement identity
    or even age detection within the headset or from the webcam – but again create
    new privacy issues).


    Whatever route is taken to the future, there are likely to be unsavoury areas
    in any metaverse, just as there are in the physical world. That they exist is
    not necessarily a completely bad thing, as long as basic rights are protected.
    The challenge is to ensure that they remain a small part of the experience, that
    people are aware of when they are straying into them, and that protection and
    help are available even in the depths of them.


    # The Totalitarian Metaverse


    If the Lawless Metaverse represents a failure of the Metaverse at an individual
    level, the Totalitarian Metaverse represents a failure at a corporate or national/governmental
    level.


    # How We Get There


    This probably starts like the Corporate Multiverse scenario, but one company wins
    big. In countries that already have a control-orientated government, it may be
    that the government only allows one company (its own) to establish the “national
    metaverse” and that access to other metaverses is blocked. Either way, as far
    as any user is concerned, they only have one metaverse option, and that metaverse
    is controlled by one entity which may not have the user’s best interests at heart.


    # What Is It Like?


    The Totalitarian Metaverse is another digital dystopia. The ability to use VR
    to track not only user identity but also potentially their emotional behaviours
    and triggers as well as their interests and usage have already been discussed.
    If the Metaverse becomes a large part of daily life, then the potential abuse
    of that level of information, along with an equal level of control, is very concerning.
    Second Life abandoned its reputation management early on, but implementing a Chinese-style
    “social credit” system in a metaverse is not only easier but also far more encompassing
    than trying to implement it in the physical world. In the Totalitarian Metaverse,
    you behave, or else.


    # Affecting the Evolution


    If the critical path to the Totalitarian Metaverse is the emergence of a monopolistic
    platform, then as with the Corporate Multiverse enabling anyone to set up a metaverse
    has to be a key defence against it. A monopolistic metaverse'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'may be an extreme outcome of the Corporate Metaverse scenario, and that monopoly
    may even be benign, but before we let such an entity emerge, we need to be absolutely
    sure that is the right thing to do and that there is always an opportunity to
    back out and set up an alternative metaverse.


    Whilst in the discussion about the Lawless Metaverse, the Tor-browser-enabled
    metaverse was the villain, and here it may even be the saviour, allowing even
    those within totalitarian regimes to gain safe access to more liberal metaverses.


    # The Pragmaverse


    As intimated earlier, one Metaverse to rule them all may have its own issues as
    different stakeholders want and expect different things, quite apart from the
    challenges in getting some universally adopted standards to stick (although again,
    we managed that with the Web). Perhaps the most pragmatic scenario for the future
    is something which is more of a “mixed fleet”, where an open-standards metaverse/multiverse
    co-exists with more proprietary technologies or spaces.


    # How We Get There


    As organisations explore the commercial potential of the Metaverse, a wide variety
    of use cases are emerging. These are already supported by a variety of dedicated
    technologies and systems, such as training worlds, entertainment worlds, conferencing
    worlds, meeting and collaboration worlds, and even military worlds. Is it realistic
    that all of these will converge on the same set of technologies and standards
    – let alone just become parcels within one all-encompassing Metaverse?


    In the Pragmaverse, there is likely to be some consolidation. A key element is
    the HMD-XR headset. People are unlikely to want different headsets for different
    uses, so standardising on the presentation element of the metaverse stack is something
    that we have already seen – particularly with standards such as WebXR. At the
    other end of the pipeline, there are obvious economies if developers can use the
    same 3D models and avatars across multiple platforms – glTF and services like
    ReadyPlayerMe are already helping here. Even the game engines that drive these
    worlds have seen significant consolidation, with Unreal and Unity tending to dominate.
    It is in the applications themselves that the differentiation occurs and will
    likely continue to occur.


    Whilst there is always an incentive to “stick to your knitting”, it may be that
    platforms gradually extend to cover related topics – why shouldn’t a training
    world also offer collaboration and conference facilities, or a collaboration space
    offer training facilities? In parallel with this, there may be growing user pressure
    for UGC worlds where they can be creative and do-their-own-thing.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'And if people then find that they can offer services using UGC that rival some
    custom environments (as happened in Second Life), then perhaps that might provoke
    further consolidation. So, within this scenario, it may that there are two sub-scenarios,
    one where the “corporate” platforms are the dominant form, but where the UGC worlds
    are a lively force, and a second one where the UGC worlds are actually the dominant
    form, with corporate platforms just handling the most specialist use cases.


    It may also be that ultimately there is a joining of islands, as different metaverses
    and microverses find benefit in linking up into a more coherent multiverse.


    # What Is It Like?


    As a user, you are more conscious of the existence of different systems than in
    most of the other scenarios. You use the same XR headset for all of the different
    applications, but it may be that some need different login identities, and you
    may have different profiles, avatars, and assets in different worlds. If you are
    having a virtual meeting and then need to go to some training, you’ll probably
    have to log out and then log in to a different world. If you’re then moving onto
    another task and think that it would be useful to bring in that interactable from
    the training session, you probably can’t. And at 5 o’clock, you log out of your
    corporate world and into a boardgame world to play Root with friends, and then
    go into yet another world to virtually attend a concert on the other side of the
    globe. You finish the day in a UGC-led world where you hang out with another group
    of friends or work on a pet project.


    # Affecting the Evolution


    Whilst the Pragmaverse may not be the default future, it is probably the most
    likely outcome if the more negative scenarios can be avoided. The key influencing
    activities are around implementing those ReLive observations. As the narrative
    above shows, the biggest user issue is likely to be the fragmentation – which
    doesn’t help with making the experience seamless, but having broadly adopted standards
    at all levels may help address that.


    Where the balance falls between the corporate and UGC worlds will probably depend
    on the power and flexibility of the worlds that support UGC – if a user can do
    something better in a UGC world than a corporate one, then the pressure for corporates
    to embrace that UGC world will increase. So, to encourage the UGC future, those
    UGC capabilities (and particularly scripting) need to be made available on both
    UGC-led worlds (and ideally other platforms), and people need to have the skills
    to use and exploit these new UGC tools to create the tools and experiences that
    they want in the Metaverse.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# The Metaverse of Eden


    When people traditionally talk about the “Metaverse” the vision is typically about
    a single virtual world to which everyone has access and which fulfils all of their
    metaverse-related needs and seamlessly integrates with their physical lives. Is
    that a realistic expectation?


    # How We Get There


    If people pay heed to the points raised in the Failed, Totalitarian, and Corporate
    Metaverse scenarios and focus on the seamlessness of the experience, the open
    standards that support it, building services which meet real needs, and supporting
    societal change that embraces the Metaverse as a vital part of our lives going
    forward, then we could be well on the way towards the Metaverse of Eden. Society
    pretty much achieved this with the World Wide Web, and why shouldn’t society also
    achieve it with the Metaverse?


    # What Is It Like?


    The Metaverse of Eden is the metaverse of the marketing video and the Hollywood
    films. It is Ready Player One''s OASIS or Caprica''s V-World. Everyone can access
    the Metaverse through their smartphone/tablet or home computer or from an XR headset
    or glasses (although both of these worlds are, at least initially, corporate metaverses).
    Most locations have some form of “holographic projector” (as in Blade Runner 2049)
    to avoid local users from having to wear a headset in order to see virtual visitors.
    The world has some geographic sense of the Earth but may also include the planets
    of the solar system and even some fantastical and genre worlds, mixing a variety
    of public and private spaces. As in the axioms presented earlier, in the Metaverse
    of Eden, you can “learn, teach, earn, create, sell, buy, trade, collaborate, communicate,
    explore, make friends, play, have fun, entertain, and be entertained, have relationships,
    have new experiences and leave a legacy”. This Metaverse will also be home to
    millions or even billions of AI-controlled avatars, some little more than virtual
    sales and support assistants, some the digital amortals (DAs) of the dead, and
    perhaps a few the verge of (or even achieving) artificial general intelligence
    (AGI). The Metaverse of Eden will be a vital part of everyone’s lives, and we
    will have almost no thought as to whether something happens in physical or virtual
    space.


    # Affecting the Evolution


    As stated above, to get to Eden, the focus needs to be on the seamlessness of
    the experience, the open standards that support it, matching services and experiences
    to real needs, and supporting any resulting societal change, all whilst avoiding
    the bear-traps of the Corporate and Totalitarian Metaverses.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Probably the biggest challenge will be that different people, and particularly
    organisations, and even countries and societies, have different needs and different
    norms. For example:


    +   - The different societal and legal expectations of different countries and
    cultures may make their co-existence in the same Metaverse problematic (just as
    it can be in the physical world). Who''s rules of dress apply, what financial
    models, and what rules of freedom of speech and expression?


    +   - An organisation might not feel safe about trusting its trade secrets, confidential
    information and intellectual property (IP), and sensitive meetings to even a “private”
    space on a globally shared metaverse. Players in the defence and intelligence
    space may have even more concerns.


    +   - Different organisations may have different views about how the same digital
    twin of a real-world location should be represented and potentially changed. The
    actual civic authorities may want a combined smart city and marketing representation,
    community groups might want to “make-good” or improve their own virtual districts,
    planners might want to fast-forward the city a decade out, the owning military
    might want to wargame defence plans, and hostile militaries might want to wargame
    attack plans. Whilst the idea of a single digital twin is attractive, it rapidly
    breaks down given these sorts of use cases.


    Four broad solutions exist:


    +   - The solution is the same as the physical world – each piece of virtual land
    has its own protections and rules, and users are expected to follow the local
    rules. In this case, a single metaverse may suffice – although this doesn’t meet
    the security or digital twin challenge.


    +   - A very technical solution could be that whilst there is only one instance
    of each point on the Earth, you can choose between different layers of virtual
    reality to display and interact with whilst you are there – a combination of virtual
    reality and mixed reality – a mixed virtual reality as it were!


    +   - A more likely solution is that the Metaverse is actually some form of Multiverse.
    There may be some form of common core world, but people and organisations are
    able to create their own constituent metaverses (or multiverses), which can be
    accessed from the core space, are built using the same software to the same standards,
    are subject to local rules, have their own access controls, and run on their own
    hosting. Digital twins in each of these worlds could be different, but with links
    between them and possibly linked to some “master” for updating.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - In a more extreme case, countries and societal groups may run metaverses
    or multiverses which, whilst possibly sharing common code, are only accessible
    through specific portals and have limited connectivity to the rest of the Metaverse
    – akin to the Great Firewall of China.


    # ## The Interstellar Multiverse


    Finally, what does a possible long-term future look like? The development (or
    failure) of the Metaverse is happening concurrently with significant strides in
    space exploration. By the 2030s/2040s, there will likely to be bases on the Moon,
    and around 2040, the first Mars landings might take place. In parallel with this,
    the first AGIs may emerge sometime this century. By the 2100s, humankind and AIs
    may begin to reach for the stars. The Metaverse may be at the heart of all of
    this and even accompany those first travellers beyond the solar system.


    # ## How We Get There


    For simplicity, it is assumed that it is the Multiverse form of the Metaverse
    of Eden that has eventually won out, and the Earth has a global Multiverse (but
    called the Metaverse), which provides access and opportunities to all. A key challenge
    is in how the Metaverse moves off planet. The significant time delays even to
    the Moon and back (c.2.6 seconds) can make real-time interactions of avatars in
    a shared world highly problematic, and such interactions become impossible with
    an average c.25-minute delay to Mars and back. The solution is a Multiverse of
    Multiverses. Each moon or planet has its own Multiverse, but some elements of
    this are synchronised with other Multiverses, so common experiences can be shared.
    For human-to-human communications, the advances in AI technology allow users to
    dispatch virtual versions of themselves to the other Multiverses as required (as
    they may already be doing for multiple meetings) to have local conversations without
    the time delay, and then report back. The future Metaverse becomes a fusion of
    humans, virtual representatives, Digital Amortals, and AIs.


    # ## What Is It Like?


    The Metaverse is populated not just by human-controlled avatars but also by avatars
    controlled by people’s virtual personal assistants (VPA), by both simple AI and
    AGI avatars, and by the DAs of many of the deceased – who spend most of their
    time working with AGIs in a large part of the Multiverse called the Thanoverse.


    Your avatar will access wherever is the local Metaverse, but compatibility and
    interoperability between the Multiverses mean that all of your account information
    and digital assets and funds follow with you. It may be that you'
  merge: -1
  img_proc: true
- pgno: 209
  md: '“rent” home or office space on the local ‘verse in the same way that you might
    rent somewhere when you physically travel on the Earth (or even to Mars). To visit
    someone “off-verse”, you send a virtual personal representative (VPR) to make
    the visit for you. On its return, your VPR would not only update you but, in the
    absence of any memory-uploading breakthroughs, have its memories of the trip automatically
    incorporated into the memory graph of your persistent VPA. This means that the
    VPA could recall the memories, discussions, and key decisions of the trip whenever
    they become relevant to what you are doing, and over time, they might become so
    familiar to you that your recollection of whether you went or your VPR becomes
    blurred. And if the stage is reached where we have true digital amortality, your
    VPA can provide the foundation for a virtual, amortal, you.


    # Affecting the Evolution


    The challenges of getting to the Metaverse of Eden, or even the Pragmarse, and
    making that available to everyone on the planet are probably more than enough
    for people to be getting on with, without worrying about how the Metaverse gets
    taken to other planets. However, it may be that an off-earth metaverse is closer
    than expected. As scientists and explorers consider how to build bases on the
    Moon, how to manage the two to three years trip to Mars and back, and even to
    establish colonies on Mars, having an array of metaversal spaces on each world
    for the explorers to use to support planning, design, science, exploration, socialising,
    family-connectedness, and relaxation will almost certainly be essential.


    # And to the Stars?


    The same discussions that apply to moving from the Earth to the Moon and planets
    also apply to reaching out to the stars. Current technologies suggest that any
    mission in the next century or so are likely to be without a human crew (Peck,
    2023), and as discussed, it may be that metaversal spaces are essential in creating
    and sustaining grounded AIs (Burden & Savin-Baden, 2019; Gamez, 2023). Any DAs
    also on the trip will no doubt want to bring their piece of (virtual) home with
    them. One neat trick is that within a ship-board Multiverse, different worlds
    could run at different rates, so AIs or DAs whose main tasks are only on arrival
    could experience the journey at a dilution rate of 1:100, so a hundred-year trip
    only seems to take a subjective year – enough for them to analyse new information
    and adjust their planning as arrival approaches. Once they do arrive and two-way
    communication is established, a new stellar Metaverse can be linked to all the
    local multiverses back home – allowing all of humanity to experience the new worlds
    at first (virtual) hand. And new VPRs and DAs can be transmitted out to go and
    live and work in that distant new Multiverse.


    With the new colony established, with its own network of planetary Metaverses,
    the robots can build the starships for the next wave of exploration'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'and push on across the galaxy as an ever-expanding wavefront of avatar-crewed
    Von Neuman machines (Matloff, 2022). The Metaverse becomes truly interstellar,
    and possibly Galactic.


    And of course, at some point, we may meet a group of alien intelligences, and
    an alien Metaverse, coming the other way. Once the technical challenges are dealt
    with, it may even be that the alien AIs and their DAs can visit our local Metaverse,
    and as the technical understandings grow, proper portals and portability between
    the two Metaverses might be established, and slowly alien spaces and avatars can
    propagate back through each race’s interstellar Metaverse. As a result, the first
    experience that physical humanity might have of an alien race is when an alien
    portal is opened up within the Earth’s Metaverse providing access to a local copy
    of the alien Metaverse, and the ability to meet and speak to alien avatars. For
    most physical humans, their first encounter with aliens may not be in a space
    suit on a rugged and hostile planet, but from the comfort of their own sofa.


    # Conclusion


    The Metaverse is nothing without users, and there is still a huge challenge in
    making the Metaverse (and even virtual world) concept understandable, let alone
    desirable, for the average person. The ReLive-based analysis above begins to identify
    some concrete steps that could help with the growth of the Metaverse/Multiverse,
    and the seven scenarios provide some idea of what the future could hold – some
    futures to be avoided, and other to be worked towards.


    There is a generation that has grown up on virtual experiences such as Club Penguin,
    Animal Crossing, World of Warcraft, and Habbo Hotel; and Roblox and Minecraft
    may be spawning a new generation of fans. But it’s not yet obvious that these
    people are growing into a generation of avid VR and virtual world users, although
    some are taking virtual worlds into their adult life.


    This is going to be a long haul, and we need to make sure that the Metaverse is
    meeting real needs, not technologist’s fantasies, and that we are communicating
    and demonstrating the benefits in all the best ways that we can. We also need
    to be learning from the past. That period from the release of Snow Crash to Facebook’s
    change of name to Meta, or even just to the release of Oculus DK1, wasn’t a metaversal
    desert. It was full of developers creating rich proto-metaverse platforms, of
    users finding all sort of ways to use these spaces for family, recreation, work
    and learning, and of researchers studying and reporting on them. We need to learn
    from the wealth of experience that was generated, and largely documented, through
    those times.


    When the new generation does enter the Metaverse, it must let them do whatever
    they want – that’s what makes it different from a meeting app or a game or an
    event app. That was one of the real strengths (and yet for many a real weakness)
    of Second Life – once you were there, you could do whatever'
  merge: -1
  img_proc: true
