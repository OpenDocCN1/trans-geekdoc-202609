    |---|---|---|---|

    | Fortnite | | | ●● |

    | Horizon Worlds | | | ●● |

    | Roblox | | | ●●● |

    | Minecraft | ● | | ●●● |

    | VRChat | | | ●●● |

    | Hubs | ●● | ●●●●●● | ●●●● |

