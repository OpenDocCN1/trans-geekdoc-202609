- pgno: 162
  md: '# 5


    Opportunities and Challenges


    # Introduction


    This chapter provides a critique on the promises and dangers of the Metaverse,
    taking a broader perspective than previous chapters. It examines a number of competing
    pressures and dichotomies within the concept of a Metaverse, working from those
    which are more focused on the platform (and those who create it) to those where
    the primary concern is the individual, and ultimately to those which are about
    society as a whole. The topics are represented graphically in Figure 5.1. In most
    of these, the concept of a single, monolithic Metaverse is likely to face more
    challenges than that of a Multiverse.


    ![](img/a1f0838ef56b3ffb455ace32842c1458_162_0.png)


    FIGURE 5.1

    The Metaverse – opportunities and challenges.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Proprietary versus Open Standards


    Perhaps the biggest tension in considering the future form of the Metaverse, and
    one which has an implication for many of the other topics in this chapter, is
    whether the Metaverse is something that is based on proprietary standards and
    corporate control, or is a ground-up, open-standards-based undertaking.


    A spectrum of approaches already exists. Most of the current crop of metaversal
    worlds are based on the corporate/proprietary model – such as Fortnite and Roblox.
    In comparison, Minecraft tightly controls its public world, but developers can
    set up their own Minecraft servers where they have far more freedom to create
    what they want, although it is still proprietary code. Further down the spectrum,
    Hubs is open-source code which enables users to run their own servers. Cryptoworlds
    such as Somnium Space and Decentraland are largely following a Web3 model and
    so support both being open-source and decentralised. Second Life itself is proprietary
    and centralised, but with a fairly lenient by-exception curation model, whereas
    the OpenSim derivative is open-source and decentralised. Neal Stephenson’s forthcoming
    Lamina1 virtual world (https://www.lamina1.com/) is supporting an open-source
    model (Sparkes, 2022). Table 5.1 summaries the approach of some of the more popular
    virtual worlds but is a very subjective assessment.


    Perri et al. (2023) argue that “The open standards and open source code are essential
    for the metaverse’s growth and sustainability. The developers and policymakers
    should prioritize these principles to ensure the development of [an] inclusive
    and open virtual environment.” The Metaverse Standards Forum (2022), whose members
    include companies such as Epic, Meta, Microsoft, Sony, and Unity, says that “Multiple
    industry leaders have


