- pgno: 176
  md: 'There is an obvious tension between promoting the metaverse as something that
    people use regularly as part of their everyday existence, and not wanting people
    to become so addicted to it that they neglect their physical world and existence.


    The types of features that would enable users to be more connected into their
    non-metaverse digital existence whilst in the Metaverse, such as the virtual mobile
    phone shown by Meta at their Connect 2021 event (Burden, 2021), could actually
    help to maintain a connection between the virtual and physical world, similar
    to a virtual assistant who can keep track on a user''s in-world time, or even
    the simple expedient of an alarm on the HUD or virtual tablet within a virtual
    world. It may be that by making the Metaverse more a part of people''s everyday
    lives, bringing in the bad and the good, that, for the most part, it loses that
    sense of escapism and is something that users attend to in the same way that they
    do to any physical world task – although escapist environments are always likely
    to have a place in the Metaverse.


    Perhaps the future is one where – particularly with the sort of augmented/mixed
    reality overlays envisaged by Rainbow''s End (Vinge, 2006) – the boundary between
    the physical and the virtual becomes increasingly blurred. Indeed, Narula (2022)
    sees the Metaverse as “a network of consequences and meaning between multiple
    worlds and which people are simultaneously engaged and invested. One or more of
    these worlds is made of ideas, the other one is the physical world”. And philosopher
    David Chalmers argues strongly for the “reality” of virtual experiences (Chalmers,
    2022), so does it even matter if there is blurring?


    # Liminality


    There is often a sense of being confused or displaced in a virtual world which
    is not just troublesome in itself, in terms of what occurs in people''s lives,
    but also as concepts. When people engage with knowledge and virtual spaces they
    find troublesome, they experience disjunction – a sense of becoming stuck. Such
    disjunction prompts people to reconsider beliefs about who they are and the way
    they operate in a metaversal space, and results in a state called liminality.


    Liminality tends to be characterised by a stripping away of old identities, an
    oscillation between states and personal transformation. Liminality is a term first
    coined by van Gennep (Gennep, 1960) who described a psychological or metaphorical
    subjective state of being at the threshold of two existential planes. Although
    the term was originally applied to rites and rituals in small human groups, it
    was extended to whole societies by writers such as Jaspers (1953). Turner later
    described people in a liminal state as “a realm of pure possibility whence novel
    con- figurations of ideas and relations may arise” (1969). He suggested that those
    in liminal states were'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'often ritually, symbolically, or metaphorically removed in order not to threaten
    the social order while they experience transition, transformation, or “in-betweenness”.


    In the transition from what has been traditionally a largely analogue delivery
    of information and knowledge from human to human without digital intermediation,
    people interacting in a new, uncharted territory often have a sense of being stuck
    and moving into a liminal space. Transition through liminality can bring with
    it not only new knowledge and understanding for the individual, but also often
    a new sense of identity. Ball (2022) argues that understanding and aligning one’s
    internal and external worlds in the face of disjunction present a variety of challenges
    to emotional, material, and social resources – something which needs to be considered
    in relation to the Metaverse.


    # Global Equality


    Many of the arguments for a Metaverse to help with climate change also apply to
    a Metaverse to help with global equality. At worst, this can be an argument for
    the “moral imperative” – where the virtual experience is seen as a sop for people
    who cannot access or afford the physical experience of living in a stylish beach
    side house or driving the latest fast car (Au, 2023). At best, the Metaverse could,
    like the mobile phone, be considered as a way by which Majority World nations
    can potentially leap-frog a generation of business and infrastructure development
    and become more “metaverse-native” than many of their counterparts in the Minority
    World (Koomsom, 2018). Of course, VR/MR headsets are currently less robust, and
    more expensive, than mobile phones, and these are issues that cannot be addressed,
    but, as has been discussed, the Metaverse should be accessible from a wide range
    of devices, including mobile phones, so this should not be a real problem.


    Language has often been a barrier to high-technology access in the Majority World
    (Eijaku, 2014), but the Metaverse is primarily a visual, audio, and social experience,
    and most of the content should be user-generated, so anyone should be able to
    enter the Metaverse and start using it, and even creating in it.


    A potential approach to help develop global equality within the Metaverse is to
    ensure that metaverse developments are orientated around the United Nations’ Sustainable
    Development Goals (SDGs) (https://sdgs.un.org/goals). Two key questions are (Umar,
    2022a):


    +   - Can the Metaverse be used to accelerate the advancement of SDGs; and

    +   - What challenges could the Metaverse raise for SDGs, and what type of policies
    will be needed to address these challenges?'
