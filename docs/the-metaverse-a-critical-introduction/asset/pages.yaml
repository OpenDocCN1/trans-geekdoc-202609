    paper on virtual economies (Castronova, 2002) is also relevant and raises the
    important issues as to who has jurisdiction over these new economies. Linden Lab
    only takes a cut when you convert from L$ to US$ – there is no internal income
    take for the L$ that people earn and keep or spend in Second Life other than through
    land rental payments and Marketplace fees. Linden Lab only charges a 10% commission
    on SL Marketplace sales (Second Life Marketplace, n.d.), compared to a typical
    30% on other platforms (Ball, 2022), and even 60% on Fortnite (Au, 2023) – and
    the use of the Marketplace is optional. At various times, there have been taxes
    on “prims” (effectively the number of 3D objects a user has, weighted by their
    complexity), and this has typically been bound up in the land charges. The ability
    to readily convert'
  merge: -1
