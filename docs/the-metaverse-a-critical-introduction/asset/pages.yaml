- pgno: 29
  md: 'from L$ to US$ is key as it means that if a person sets up a business in SL
    (renting land, designing clothing, writing scripts, etc.), then they can convert
    their earnings into physical-world cash and actually make a physical-world living.
    According to Au (2023), the gross income to content creators in Second Life is
    roughly equal to Linden Lab’s gross revenues from the platform.


    In 2022, Second Life had a virtual economy with an annual GDP of US$650 million
    on 345 million virtual transactions (Linden Lab, 2022). In 2020, around 1600 people
    were making over US$10,000 a year from user-generated content (UGC) sales in Second
    Life, compared to around 1050 on Roblox, but by that time, Second Life had only
    around 600,000 monthly active users compared to 250 million in Roblox (Au, 2023).
    Second Life content developers cashed out around US$80 million from the virtual
    to the physical world economy in the 12 months to June 2021 (Galov, 2023).


    In the early days, Second Life only had text-chat, and there was a huge furore
    in 2007 when it was announced that voice chat would be introduced as that would
    immediately “dox” (i.e. reveal) people in terms of their physical world gender,
    possibly age and nationality and even background and social class (Krotoski, 2009).
    Avatar gender fluidity was (and is) common, and many users have ungendered avatars
    (e.g. robots, abstract shapes, even domestic appliances, etc.), and there is a
    sizeable population of furries (anthropomorphic animal avatars) in Second Life
    (Brookey & Cannon, 2009). One survey (Bell et al., 2009) found that 11% of physical
    world males used a female avatar in SL, whilst only 5% of physical world females
    used male avatars. Of the sample, 51% reported as female and 43% as male in the
    physical world. The survey also found that 23% of respondents had changed the
    gender of their avatars at some point. This freedom to assume and explore any
    identity is perhaps one of the key facets and benefits of a social virtual world.
    Both Coming of Age in Second Life: An Anthropologist Explores the Virtually Human
    (Boellstorff, 2015) and Virtual Environments and Cultures: A Collection of Social
    Anthropological Research in Virtual Cultures and Landscapes (Frömming, 2013) are
    excellent anthropological studies of the early Second Life population.


    Although there was a notable performance by Grammy award-winning singer-songwriter
    Suzanne Vega in SL in 2006 (Wired, 2006) (and see Figure 1.6 for an early use
    of SL by the BBC), and many working artists have continued to use Second Life
    as a performance platform (Au, 2023), it is perhaps the in-world art scene that
    is the most vibrant and original. High points have included the aerial dance/multi-media
    shows of the ZeroG SkyDancers (Au, 2013), a performance of Pink Floyd’s The Wall
    (Hayes, 2008), Joff Chafer of Coventry University’s mixed reality pieces (Fewster
    et al., 2011), the SL Shakespeare Company and the Avatar Repertory Theater, the
    towering human sculptures of Starax Statosky (Sichelseifert, 2009a), and the contemplative
    landscapes of AM Radio (Sichelseifert, 2009b), whose work The Faraway was later
    recreated by the artist’s son in Fortnite (Au, 2023).


    Almost as soon as the rapid consumer growth of Second Life started, it grew from
    about 100,000 registered accounts in December 2005 to two million in'
