  md: 'developers build their own stand-alone virtual worlds. Technically complex,
    Open Wonderland was an early pioneer of some novel features, such as windows and
    doors between worlds where someone could look through from one world to another,
    step through, and then look back to the world they’d just come from.


    Twinity (2008) was one of the first real attempts at a digital twin. It let users
    explore replicas of London, Berlin, and several other cities; buy virtual apartments
    in them; and then go clubbing or shopping in suitably themed spaces (Schultz,
    2018). However, these virtual cities didn’t include a single shopfront or facade
    – it is assumed so as to avoid brand infringement (Figure 1.9). As Schultz reports,
    Twinity eventually even had to abandon the digital city twin model for legal and
    financial reasons.


    Other virtual environments of the time included:


