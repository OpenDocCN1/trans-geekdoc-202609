    how many HMD-VR-oriented worlds use a head, shoulders/chest and hands approach
    for avatars – with no arms or legs! This seems to be to avoid the loss of immersion
    that occurs when the inverse kinematics (which is estimating body position) makes
    an avatar’s elbows and knees bend in weird ways (Parger et al., 2018). Some platforms,
    such as EngageVR, Frame and Decentraland, are following the full-body avatar route,
    and they may soon be coming to'
