    Qualcomm. https://www.qualcomm.com/news/onq/2021/05/creating-new-reality-spatial-computing


    Wiederhold, B. K. (2020). Embodiment empowers empathy in virtual reality. Cyberpsychology,
    Behavior, and Social Networking, 23(11), 725–726.


    Witmer, B. G., & Singer, M. J. (1998). Measuring presence in virtual environments:
    A presence questionnaire. Presence, 7(3), 225–240.


    Wood, G. (2014). DApps: What Web 3.0 looks like. Gavin Wood. https://gavwood.com/dappsweb3.html


    Yee, N., Bailenson, J. N., Urbanek, M., Chang, F., & Merget, D. (2007). The unbearable
    likeness of being digital: The persistence of nonverbal social norms in online
    virtual environments. CyberPsychology & Behavior, 10(1), 115–121.'
