    having its own 20-year-old digital currency, and, as discussed in Chapter 1, having
    an in-world economy that is more profitable than either the cryptoworlds or the
    larger consumer worlds; and

    +   - It is very much only a virtual world, with minimal connectivity to the physical
    world and no broader intention to rethink the Web or Internet, or indeed how we
