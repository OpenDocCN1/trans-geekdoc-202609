    # The Metaverse in Popular Culture


    Having started in popular culture, it is no surprise that the idea of a metaverse,
    or at least the concept of a well-developed social virtual world, has been utilised
    by a number of books, movies, TV series, and even radio shows, some predating
    even Snow Crash. Of particular note are:


    +   * True Names (Vinge, 2015), as mentioned, first published in 1981 and featuring
    a fantasy-style virtual world where anonymity is a vital concern in order to hide
    from “the Feds”;

    +   * Star Trek: The Next Generation (Roddenberry, 1987), often featured the “holodeck”,
    a kind of reverse MR where virtual spaces appeared to become physically real;

    +   * The Matrix (Wachowskis, 1999) – the *sina qua non* of virtual world films,
    where the population of the earth exists without their knowledge in a virtual
    world in order to generate energy for the AI overlords;

    +   * Rainbow''s End (Vinge, 2007) – the augmented/mixed reality equivalent of
    *Snow Crash* where MR headsets can completely repaint the physical reality that
    the users experience;

    +   * Permutation City (Egan, 2008), in which many of the characters are Copies,
    run in virtual simulations. One of its most interesting ideas is that those simulations
    might be running at incredibly slow speeds, for example, one computer instruction
    a second, so that whilst life would seem “normal” inside the simulation, outside
    time would be passing a thousand or million times faster – great for exploring
    the stars;

    +   * PlanetB (Broughton et al, 2009), a BBC Radio drama series set in a very
    *Second Life* type world, and featuring “rogues” – computer-controlled avatars
    that are developing a life independent of human operators;

    +   * Caprica (Aubuchon & Moore, 2010), which features a character who seems to
    be inspired by Linden Lab’s Philip Rosedale, and whose V-world virtual world is
    home to the first virtual humans generated from the digital traces of physical
    humans;'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   - Ready Player One (Cline, 2011), a book and film where the characters
    hunt for clues in a cross between a video game and Second Life in order to become
    its owners;

    +   - Black Mirror (Brooker, 2011) includes several episodes that feature virtual
    worlds and virtual and mixed reality including San Junipero about the dead and
    elderly living in a virtual world, Men Against Fire where MR repaints opponents
    in a manner similar to Rainbow''s End, USS Callister with a virtual spaceship
    crewed by avatar clones of real people and Striking Vipers where virtual experiences
    start to bleed through into the physical world;

    +   - Kiss Me First (Moggach, 2013), a book and Channel 4 TV Series, where a young
    woman agrees to impersonate a dying woman. In the TV series, much of the action
    is moved from the text-based chat room of the book to a Second Life-like virtual
    world;

    +   - Fall; or, Dodge in Hell (Stephenson, 2020), the Snow Crash authors'' sequel
    to Reamde, where the creator of a fantasy MMORPG world is uploaded to a computer
    after his death and “thinks” a new fantasy virtual world into being, which then
    receives the minds of others who have died and been uploaded;

    +   - Upload (Daniels, 2010), an American sitcom based in a virtual world hotel
    to which all the guests have been uploaded just before their death, and from where
    they have limited communications with their loved ones back in the physical world;
    and

    +   - When the Sparrow Falls (Sharpson, 2021), where most of the Earth’s population
    has been “contraned” so that their consciousness can be transferred to a virtual
    realm – or vice-versa, and people move fluidly between existing in the physical
    and virtual worlds.


    The cluster of fictional works appearing around the first wave of social virtual
    worlds in 2004–2010 is quite noticeable.


    # Summary


    This chapter has hopefully shown that prior to the emergence of Oculus and Facebook/Meta,
    there was already a lot of experience of building, using, and living in metaverse-type
    worlds, something which many of the current generation of users, developers, and
    commentators of metaverses seem unaware of. To emphasise this, Figure 1.20 shows
    the number of entries on Google Scholar mentioning “metaverse” since 1992.


    Despite several decades of work towards the Metaverse, there has arguably been
    very little concrete progress since Second Life and OpenSim. Whilst its graphics
    may look basic in comparison to today’s high-end games, the'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_53_0.png)


    FIGURE 1.20 Google Scholar “metaverse” entries since (after Childs, 2023, and
    updated to 2023 by the original author).


    functionality of Second Life, and in particular the in-world building and scripting
    and fully functioning marketplace and economy, and the contiguous landscape model
    are still far closer to that original Snow Crash vision than any world since.
    The current crop of worlds is either primarily focused on games (e.g. Fortnite,
    Roblox, Rec Room), playing it safe with room-based models, object placement, and
    out-of-world editing (e.g. VRChat, most business/collaboration worlds), or they
    are caught up in the blockchain hypebole (e.g. Decentraland, Somnium Space, Cryptovoxels).
    The two bright spots are the continuing developments of consumer HMD-VR headsets
    and the ability to deliver virtual world experiences to the browser using WebGL
    and WebXR – as in Hubs and particularly Frames.


    Given the couple of decades of history in developing virtual worlds and proto-metaverses,
    the next chapter will try to define, in the light of that, what the Metaverse
    is, or at least what the Metaverse could or should be.


