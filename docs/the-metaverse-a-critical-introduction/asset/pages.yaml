    Radoff also has a “Seven Layers of the Metaverse” model (Radoff, 2021c), which
    breaks the Metaverse ecosystem down as shown in Figure 2.2. Whilst a useful reference,
    this schematic should not be taken as a technology stack but rather a guide to
    the value-chain of the metaverse, and the product categories being delivered by
    the companies enabling the metaverse.


    # 2D versus 3D Web


    In reading about the metaverse, the terms “3D Web” or even “3D Internet” are often
    seen. The term Internet properly refers to the network of computers which are
    connected through an underlying set of communications protocols with names such
    as IP, UDP, and TCP. The World Wide Web is just an application that runs over
    the Internet using a set of protocols in what is called the Application layer,
    on top of the Internet ones. Web protocols and standards include those such as
    HTTP (how websites serve content to users and link pages together), HTML (how
    web content is displayed), Javascript (how web pages are scripted), and WebSockets
    (how more advanced applications can transfer information between web servers and
    browsers) (Sahu, 2021).


    Metaverse platforms typically transfer information across the Internet either
    by talking directly to the Internet using Internet protocols (e.g. UDP or'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'TCP) or by using web protocols such as WebSockets. There is no implication
    that the Metaverse replaces the Internet.


    There should also be no implication that the Metaverse will replace the 2D Web,
    and particularly the mobile web. The 2D model for accessing information where
    a user only needs simple hardware and feels safe (and polite) to use it anywhere,
    is one that will persist well after the Metaverse becomes a common place – and
    the two should live in harmony and be interconnected. A user should be able to
    use the 2D Web to access WebXR content and be instantly transported into a DesktopVR
    or HMD-VR metaversal space (depending on their browser) and to access 2D Web content
    from inside that metaversal space.


    One significant difference that the notion of the “3D Internet” does try and draw
    out is that while the Web consists of a large number of websites abstractly linked
    to each other, the metaverse is more likely to comprise “locations” which have
    some sort of spatial relationship with each other – by theme or viewpoint or even
    time or physical or virtual geography (e.g. Neal Stephenson quoted in Au, 2023).
    Perhaps, the term “spatial Internet” (Vogelsang, 2021), or better “spatial Web”
    (Newton, 2021), may be more appropriate. As mentioned in the Introduction, the
    current in-phrase “spatial computing” (Ball, 2024) strikes us as being too technology
    centric rather than people centric, although it may be quite applicable to the
    Apple Vision Pro concept of doing your personal computing in space around you
    rather than using your head-mounted display XR (HMD-XR) for predominantly social
    interactions.


    # Web3 and the Metaverse


    Another term which is confusing in the context of the Metaverse is “Web3”. This
    is *not* the Web in 3D but rather a contraction of Web 3.0 – although confusingly,
    some see Web 3.0 as being about the evolution of the semantic web (Nabben, 2023).
    Web 1.0 was the original informational World Wide Web, and Web 2.0 is the growth
    of user-generated content, social media, and a transactional web. Web3 was defined
    by Gavin Wood (Wood, 2014) and is seen as a “decentralized and democratized internet
    that puts users in control of their data and online identities” and which creates
    “a more equitable, secure, and interconnected digital world” (Ray, 2023). It is
    driven primarily by blockchain technologies and approaches such as decentralised
    applications (DApps), decentralised finance (DeFi), non-fungible tokens (NFTs),
    and decentralised autonomous organisations (DAOs) (Buterin, 2013). While Web 2.0
    was more about a change in the content of, and how people used, the Web, Web3
    is more about the underlying structure of control of the web and Internet. It
    is also an almost philosophical shift in how people view and structure the Internet
    – although tensions are reported between the crypto movement and the Web3 label
    (Gilbert, 2022).


    Whilst some may see the Web3 as the “technological infrastructure of the Metaverse”
    (Momtaz, 2022), it is more appropriate that the metaverse be seen'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'as distinct from Web3 – the latter focused on ownership and control, whilst
    the former is about the user experience (Kshetri, 2022a). Jarvinen et al. (2023)
    present a “metaverse-Web3 convergence model” to help businesses better understand
    which technology and design combinations from both these spaces meet their specific
    service needs.


    As Chapter 1 has already shown, metaverse-like experiences can be built using
    a variety of Web 2.0 technologies, and whilst a metaverse could, and perhaps should,
    be built using Web3 technologies or approaches, they are not essential to it –
    this is further explored in Chapter 4.


    # A Spectrum of Definitions


    Most of the definitions of the metaverse sit on a spectrum, as shown in Figure
    2.3, which ranges from the metaverse as a collection of disparate, unconnected,
    experiences to the metaverse as a singular, all-encompassing Metaverse.


    At the left-hand end are definitions which just see “metaverse” as an all-encompassing
    term for any VR (or even augmented reality [AR] or mixed reality [MR]) experience.
    At this left hand of the spectrum, “metaverse” could just as easily be replaced
    with “XR experience”.


    In the centre of the spectrum, the definitions recognise that “the metaverse”
    is something more than just an XR experience and that common standards and technologies
    may be useful, and in particular, it may/must be social, possibly persistent,
    and possibly granting the user a higher degree of agency. This mid-spectrum definitions
    reject (or are agnostic about) the idea of one


    ![](img/a1f0838ef56b3ffb455ace32842c1458_68_0.png)


    **FIGURE 2.3**

    A spectrum of metaverse definitions.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'true Metaverse and instead see a future built around multiple environments,
    which may have higher or lower levels of integration between them.


    At the right of the centre is a more holistic but still federated view, where
    most worlds are built on the same technologies and may even share common services.
    This results in one or more multiverses connecting all these other worlds together
    in the same way that the Hypergrid connects OpenSim worlds and the DNS network
    connects web servers (but doesn’t enable identity or asset transfer).


    At the right end of the spectrum is the “one Metaverse to rule them all” model
    – where there is a singular Metaverse, built using a common technology set, and
    every metaversal space is a part of that Metaverse.


    This book largely concerns itself with the right of centre definitions, although
    worlds and experiences which meet the left of centre ones have certainly helped
    to build the use cases for metaversal experiences, as will be seen in Chapter
    3. Chapter 6 will further explore how the right of centre and right of spectrum
    definitions might play out.


    # The Metaverse Roadmap Model


    Although it’s over 15 years old, the Metaverse Roadmap’s model of the Metaverse
    is worth revisiting (S. G. Lee et al., 2011). The model is shown in Figure 2.4.


    ![](img/a1f0838ef56b3ffb455ace32842c1458_69_0.png)


    FIGURE 2.4

    The Metaverse roadmap model.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'It identifies the parts of what was then considered the Metaverse in terms
    of whether they are about augmenting or simulating reality and about individuals
    (intimate) or the world at large (external). This results in four different types
    of experience being defined:


    +   - Virtual Worlds – which nowadays incorporate DesktopVR and HMD-VR worlds,
    and which are about social interaction;

    +   - Mirror Worlds – which can today be called digital twins;

    +   - Augmented Reality – which now include mixed reality; and

    +   - Life Logging – which was a big term in the early 2000s but could now be
    taken to include the documentation of our lives through X/ Twitter, TikTok, Facebook,
    and other social media platforms.


    # Ten Axioms for the Metaverse


    Rather than trying to present yet another one-sentence definition of the Metaverse,
    we present 10 axioms which we believe a true Metaverse should follow. Many metaverse
    platforms follow some of them, but none yet implements them all to a high degree.
    The axioms have been arranged roughly from technically focused to human focused
    to societal focused.


    # #1 The Metaverse Is a Multi-User, Interactive, Social, Shared and Subjective
    Experience – Delivered Digitally


    This is the motherhood-and-apple-pie statement about the Metaverse:


    +   - It MUST be multi-user. No point in being in the Metaverse on your own;

    +   - It MUST be interactive. The Metaverse isn’t a passive experience;

    +   - It MUST be social. This means not only multi-user but also giving you the
    time and features to enable you to interact with other people and build relationships
    (short or long duration) with them;

    +   - It MUST be shared. What I see is what you see, where I can go, you can go.
    It is consensual; and

    +   - It MUST be subjective. We might all see the same things, but the experience
    for each of us as an individual will be different, coloured by our own interests
    and life experiences.


    And of course, it’s primarily digital. How the physical and digital worlds may
    combine in the metaverse is discussed later.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# #2 The Metaverse Is Editable from Within Itself


    The Metaverse MUST be editable by its users, within the permissions allowed, WITHIN
    the Metaverse, so you can change what you see, what things do, and how things
    work and create original content and all without leaving the Metaverse (just as
    you don''t have to exit the physical world in order to build a house, or to do
    some DIY in it). Separate editing software is an optional extra.


    # #3 The Metaverse Is Persistent


    The Metaverse MUST be persistent. If somebody changes something, it stays changed
    until someone changes it again. No refreshing every day or every session. It is
    also always there, always on, and always available, a persistent feature of your
    whole life.


    # #4 The Metaverse Is Open


    The Metaverse is not about one company''s technology or platform or ecosystem,
    nor (currently) predicated on any particular hardware (such as a VR headset) or
    technological approach (e.g. blockchain or Web3) and nor should it be only a visual
    experience.


    The Web is more the model to aspire to, where its basic operation is defined by
    open standards, with multiple companies then able to create the software that
    runs it, and runs on it, and all those components then work (relatively) seamlessly
    together so that they are transparent to the user. Whether the code itself actually
    needs to be open-source is a moot point (it is open standards that are more important),
    and there is also the crucial question of who runs and owns the equivalent of
    the DNS that might link the different servers and spaces of the Metaverse together.


    Ever since the launch of the Oculus DK1 kickstarted the current generation of
    head-mounted display (HMD)-based VR, there appears to have been an unwritten assumption
    that the Metaverse is all about HMD-VR. However, as Chapter 1 has hopefully shown,
    a lot of the DesktopVR social virtual worlds of the late 1990s and early 2000s
    were (and in some cases continue to be) far closer in spirit and execution to
    the idea of the Metaverse than many (and possibly all) of the current crop of
    HMD VR applications being touted as “the Metaverse”.


    Perhaps it even goes further than that. To those who experienced them the text-based
    multi-user dungeons (MUDs) and multi-user object-orientated dungeons (MOOs) of
    the mid-1990s, whilst lacking the visual element of even the DesktopVR-based social
    virtual worlds, succeeded in creating a multi-user, interactive, social, editable,
    shared, subjective, and persistent experience with high user agency, and perhaps
    have as much right of being considered'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'at least as proto-metaverses as the graphical social virtual worlds that followed
    them. This independence of technological implementation extends to modern trends
    such as blockchain and NFTs. More positively, it also suggests that a Metaverse
    could be experienced by some as a primarily audio experience, and indeed the Metaverse
    should be designed to provide as much accessibility as possible.


    # #5 The Metaverse Is a Superset of Technologies and Experiences and Likely Contains
    Within It, Multiple, More Constrained Environments


    The Metaverse includes MR, DesktopVR, HMD-VR, and similar experiences. Also, within
    the physical world, we close off spaces as offices, hospitals, training facilities,
    nature reserves, football stadia, and so on, and we should expect to be able to
    do the same in the Metaverse, with such spaces possibly having a more constrained
    implementation of the freedom and facilities of the wider Metaverse – and potentially
    even having some features not available within the wider community. These spaces
    may be “logically” enclosed – such as by the boundary barriers in Second Life
    which you can see but not move through – or they may be separate microverses or
    pocket-metaverses, pinched off from the bigger Metaverse (similar to rooms in
    RecRoom or OpenSim servers in a Hypergrid), but with a high ability to move assets,
    identity, and information between them all.


    # #6 The Metaverse May Be a Multiverse in Which Case Interoperability and Portability
    Should Be as Extensive as Possible


    This is an extension of #5 to a degree, but the focus here is on the overall architecture
    of the Metaverse rather than on pinching off microverses for specific use cases.
    The Web is again a reasonable example, with everyone running their own servers
    (even if they are increasingly physically being combined into cloud server farms)
    but connecting together websites in a relatively seamless manner. OpenSim and
    its Hypergrid are a more directly relevant metaverse example, and Mastodon (an
    alternative to X/Twitter) is a more general example. But as we know from the web,
    the portability of identity and other assets between services is a real challenge,
    with third-party mediation (your Google or Facebook account) increasingly being
    the way to manage it – and in the ReadyPlayerMe service (https://readyplayer.me),
    some elements of that in terms of avatar management are coming to immersive environments.
    The Multiverse versus Single Metaverse tension is one that will take time to play
    out, and so it is likely that some form of Multiverse is going to be the model
    for a while and will be further discussed later.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# #7 You Should Be Able to Live a Complete Life in the Metaverse: Learn, Teach,
    Earn, Create, Sell, Buy, Trade, Collaborate, Communicate, Explore, Make Friends,
    Play, Have Fun, Entertain, Be Entertained, Have Relationships, Have New Experiences,
    and Leave a Legacy


    This extends #1 and is expressed in terms of the user experience not the system
    features – and a good candidate for part of a single sentence definition. There
    are lot of spaces that might argue that they meet #1 but totally fail here. If
    the Metaverse is to be a true digital extension of our physical existence, then
    we should be able to use it do (almost) all the things that we can do in the physical
    world, plus some new things beside. The Metaverse also needs to support its own
    native, in world, economy and marketplaces – and ones which are linked seamlessly
    to the physical world.


    We’re certainly not advocating that we forsake the physical world, but if we want
    to use the Multiverse for something that stretches across large parts of our lives,
    both thematically and temporally, we should be able to do so.


    # #8 The Metaverse Should Provide the User with as Much Scope for Agency and Action
    in the Immersive Digital World as in the Physical World, Probably More so, with
    the Only Limits on Their Action Being (Initially) Those Reflecting the Laws, Ethics,
    and Morals of the Physical World


    In the Metaverse, you should have the agency to do whatever you want, just as
    you can within the physical world. This is what enables #7. Yes, that may be bounded
    by skills or knowledge (which can both be learnt), by aptitude or resources, and
    by what is seen as being moral, ethical, and lawful, but otherwise you just do
    what you want. Priestley argues that there is a good case that the most successful
    virtual worlds have been those that “weren’t necessarily built for one specific
    reason or audience - they were mainly agnostic to let the players create their
    own worlds out of roleplay or some other aspect of imagination or interaction
    and whose uses of “emerged because the platforms allowed an open-ended structure
    to their virtual worlds”, enabling a “real, emergent creator economy” to develop
    (Priestley, 2022a). The Metaverse needs to be built from the inside out, not the
    outside in.


    The challenge as to whose laws, ethics, and morals should apply will be discussed
    in Chapter 5, and the “initially” caveat is a nod to the fact that ultimately
    the laws, ethics, and morals within the Metaverse may well diverge from the physical
    world.


    # #9 Not Everyone in the Metaverse Will Be Human Controlled


    This is deliberately not phrased as “not everyone in the Metaverse will be human”
    as that could be taken to be about avatars and appearance, and as discussed in
    Chapter 1, proto-Metaverses like Second Life and VRChat are full'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'of furries, robots, and other non-human avatars. Instead, the emphasis here
    is on what is controlling the avatars. There are three particular cases of interest:


    +   - Simple “non-AI” driven avatars performing routine tasks in the Metaverse,
    such as greeters, helpers, personal assistants/stand-ins, non-player characters
    and so on – just as we already have in many of the proto-Metaverses;

    +   - AI-driven avatars which begin to live their own semi or fully independent
    lives within the Metaverse. Virtual world spaces like the Metaverse are probably
    the ideal learning and proving grounds for more developed AIs as they provide
    a grounded and “realistic” experience for an embodied AI (Burden & Savin-Baden,
    2019);

    +   - Digital Amortals, ex-human-driven avatars, where the virtual selves that
    we might create to double for us in the Metaverse continue to live and work in
    it well beyond the point where our physical selves have died (Burden, 2020).


    Planet B (Broughton & Dromgoole, 2009) is a fun exploration of some of these forms
    in a fictional proto-Metaverse, and Caprica (Aubuchon & Moore, 2010) is probably
    the best exploration of the last consideration.


    # #10 The Boundary between the Physical Universe and Virtual Metaverse Is as Porous
    as Each User Wants It to Be, Within Moral, Ethical, and Legal Reason


    The Metaverse and its users need to find the right balance between the attribution
    of action to physical individuals, and the protection against doxing and other
    forms of on-line (or subsequent off-line) abuse. Just as with social media platforms,
    this will be no easy task. People should be free to create different identities
    within the Metaverse in order to explore their different selves, but there should
    be some, protected, form of attribution chain.


    This boundary and interface to the physical world also include things like financial
    exchanges (money earned in the Metaverse should be spendable in the physical world)
    and cyber and information system (extending your mobile phone and your favourite
    web and desktop applications into the Metaverse).


    Whilst we see the Metaverse as being integrated with the physical world, to the
    point where you might forget what you did in the physical world and what you did
    in the virtual world, we think it loses focus and even devalues the term metaverse
    to apply that to both virtual and physical world. Perhaps a new term is needed,
    or we just accept that the sum of the Metaverse and the physical world is just
    life.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 10 AXIOMS FOR THE METAVERSE


    For convenience, here are the 10 axioms brought together.


    +   #1 The Metaverse is a multi-user, interactive, social, shared and subjective
    experience – delivered digitally.

    +   #2 The Metaverse is editable from within itself.

    +   #3 The Metaverse is persistent.

    +   #4 The Metaverse is Open.

    +   #5 The Metaverse is a superset of technologies and experiences and likely
    contains within it, multiple, more constrained environments.

    +   #6 The Metaverse may be a Multiverse in which case interoperability and portability
    should be as extensive as possible.

    +   #7 You should be able to live a complete life in the Metaverse: learn, teach,
    earn, create, sell, buy, trade, collaborate, communicate, explore, make friends,
    play, have fun, entertain, be entertained, have relationships, have new experiences,
    and leave a legacy.

    +   #8 The Metaverse should provide the user with as much scope for agency and
    action in the immersive digital world as in the physical world, probably more
    so, with the only limits on their action being (initially) those reflecting the
    laws, ethics, and morals of the physical world.

    +   #9 Not everyone in the Metaverse will be human controlled.

    +   #10 The boundary between the physical universe and virtual Metaverse is as
    porous as each user wants it to be, within moral, ethical, and legal reason.


    Although not really an axiom, a final point to keep in mind is that “virtual”
    should be contrasted with “physical” not “real”. There are plenty of examples
    which show that the virtual world can evoke real emotions and have real impact
    on people’s lives in the physical world – so the correct dichotomy is virtual
    versus physical not virtual versus real.


    Some similar lists of metaversal traits and rules are provided by Parisi (2021),
    Forster (2022), and Buchholz et al. (2022), and there is a meta-analysis of Parisi,
    Ball, and others in Priestley (2022b). Useful taxonomies of metaverse worlds are
    provided by Merrick and Gu (2011), L. H. Lee et al. (2021), Kshetri (2022b), and
    Park and Kim (2022)


    # Assessing Current Platforms


    Figure 2.5 provides a very rough assessment of some of the current metaverse platforms
    against the 10 axioms. Mozilla Hubs had a similar shaped profile to Virbela’s
    Frame, most other cryptoworlds would have profiles similar to Decentraland, and
    other game-based worlds similar to Roblox. Updated graphs, graphs for other worlds,
    and more detail on the methodology used are on the series website at http://www.themetaverseseries.info/.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_76_0.png)


    **FIGURE 2.5** Assessing current platforms against the 10 axioms: (a) Second Life,
