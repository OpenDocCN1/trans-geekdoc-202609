- pgno: 92
  md: '# # 3 The Uses and Benefits of the Metaverse


    # ## Introduction


    In looking at the benefits which the Metaverse can offer – to individuals, organisations,
    and society – and why it is that the Metaverse matters, there are two main questions:


    +   * What are the benefits of applications based on metaverse technologies?

    +   * Why would a single Metaverse or Multiverse be of more use that just a set
    of separate applications?


    The structure of this chapter follows this segmentation. First, it looks at the
    foundational benefits (particularly from collaboration and consumer-to-consumer
    [C2C] uses) of metaverse technologies and then examines the benefits and use cases
    which have emerged across multiple sectors, from business-to-consumer (B2C) to
    Business to Business (B2B) applications. Second, it considers why delivering these
    benefits through a more integrated metaverse may be preferable to delivering them
    through discrete worlds and applications. Chapter 5 will further explore the issue
    of why the Metaverse as a more holistic entity matters, how it can contribute
    to a broader human and societal context, and some of the challenges that the Metaverse
    presents. Hopefully, together, these two chapters will go some way to answering
    the question of what the problems are that the Metaverse is trying to solve.


    Figure 3.1 provides a graphical overview of the first part of the chapter.


    > Note: Other books in the Metaverse Series will explore more of these use cases
    in greater detail. Check out the website at www.themetaverseseries.info for a
    current list of planned and published books. Synopses of some of the planned books
    are included in this book at the relevant place.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_93_0.png)


    FIGURE 3.1

    Metaversal use cases.


    # # Foundational Benefits and Collaboration


    # ## The Generic Benefits of VR/MR/AR


    In assessing the benefits of metaverse technologies across almost all use cases,
    it is important to compare the benefits to both the physical world alternatives
    _and_ to the non-metaversal digital alternatives. For instance, whilst metaverse
    applications can save cost, time, and carbon from reduced travel, such benefits
    also apply to the more traditional two-dimensional (2D) alternatives – such as
    Zoom calls. The solely metaversal benefits typically come from where they bring
    the benefits of the physical world to digital interactions and the benefits of
    the digital world to physical interactions, including:


    +   - Being immersed within the experience, as discussed in Chapter 2, which can
    improve understanding and recall (e.g. Haber et al., 2023). S. A. Smith (2019)
    has a wide-ranging review of the relationship between virtual reality (VR) and
    episodic memory;

    +   - The changed group dynamics within a virtual space – which can encourage
    more inclusive participation (Nesson & Nesson, 2008);'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   • The ability to operate at a human scale in an environment which emphasizes
    the social nature of the interactions and enhances serendipitous discovery (Webber,
    2013); and

    +   • The ability to do and experience things which would be positively uneconomic,
    dangerous, or unethical in the physical world, or even simply just “not possible
    in real life” (NPIRL) – from creating (and destroying) mock-ups of buildings in
    minutes and practicing dangerous medical procedures to holding meetings on a virtual
    Mars or learning from inside the atomic structure of crystals (e.g. Maksimenko
    et al., 2021).


    A cross-comparison of the physical, digital, and metaversal is summarised in Table
    3.1.


    | | To ... Physical | Digital | Metaversal |

    |---|---|---|---|

    | Compare ... Physical | | • Environmental immersion<br>• Tactile/haptic feedback<br>•
    Subjective, visceral experience<br>• Encoding specificity | • Gold standard environment,
    immersion, risk and emotion<br>• More complex, chaotic environments |

    | Digital | • Saves time<br>• Saves cost<br>• Saves carbon<br>• Remote activities<br>•
    Anytime/anyplace/anywhere usage<br>• Exact repetition<br>• Detailed metrics<br>•
    Easy AI integration | | • Simpler technologies<br>• Simpler authoring<br>• Natural
    video<br>• Natural facial expressions |

    | Metaversal | • Saves time<br>• Saves cost<br>• Saves carbon<br>• Remote activities<br>•
    Anytime/anyplace/anywhere usage (nearly)<br>• Exact repetition<br>• Detailed metrics<br>•
    Easy AI integration<br>• Impossible, impractical, uneconomic activities (not possible
    in real life – NPIRL) | • Subjective, visceral experience<br>• Virtual muscle
    memory<br>• Encoding specificity<br>• Broader range of cues from a richer environment<br>•
    More natural team working/collaboration<br>• More realistic (and unprompted) choices<br>•
    Broader inter-personal communications | |


    Note: Italics show benefits shared by traditional 2D digital and metaversal solutions.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Collaboration in VR


    Collaboration is perhaps the low-hanging fruit when it comes to the use of the
    Metaverse and can apply to almost everything from users just hanging out with
    friends or keeping in touch with family to pursuing hobbies and undertaking education
    to business meetings, conferences, and training.


    The basic requirement is simply to have a space where users can meet and communicate.
    Whilst the marketing for these worlds often showcases sleek modern boardrooms
    and collaboration spaces modelled after their real-world counterparts, there is
    no reason why the meeting space shouldn’t reflect the topic under discussion (meeting
    in a building under construction, on a factory floor, or in a showcase of the
    client’s products), or somewhere that reflects the nature and level of interaction
    and creativity required (a fire-pit, a sandy beach, a pub, a cinema room, an orbital
    space-station, etc).


    Table 3.2 details collaboration tools which are already present in one or more
    virtual worlds, and the ideal collaborative metaverse would probably have them
    all.


    | Feature | Description |

    |---|---|

    | Spatial voice chat | So you know who is talking to your left or right, or so
    you can gather into smaller groups away from the main chat. |

    | Ad-hoc “rings of silence” | So that no one else can hear what you are saying
    to those nearest to you even if you are close to other users. |

    | Text chat | To support parallel discussions and provision of extra information,
    either to the whole group or selected participants. |

    | Webcam feeds | So people can see the physical you. At various times, these have
    been rendered on avatar’s stomachs, floating above the avatar’s shoulder, fixed
    on a wall in the world or placed on the user interface rather than in-world. |

    | Emoticons | 2D and 3D emoticons to support non-verbal communications. |

    | Desktop sharing | So you can share presentations and documents as though on
    a Zoom call. |

    | Dial-in users | So people can call in from audio telephones or from a video
    conferencing system like Zoom. |

    | In-World Web browser | So you can collaboratively access web content, including
    videos and services such as Google Docs so you can even work on documents collaboratively
    and synchronously with non-virtual world participants. |

    | Virtual white boards and sticky notes | Of course, there’s no reason to constrain
    either drawing or note placement to walls or boards when you can just draw or
    place objects anywhere in the 3D space. |

    | 2D drag and drop | Drag and drop of images, PDFs, audio and video files and
    other media types from your desktop into the virtual world. |'
  merge: -1
  img_proc: true
- pgno: 96
  md: '| Feature | Description |

    |---|---|

    | 3D drag and drop | Drag and drop 3D objects (animated and unanimated) from 3D
    design and CAD tools or libraries – and then the ability to annotate them with
    virtual sticky notes. |

    | In-world building (and even scripting) | For creative exploration and illustration
    of ideas as they occur. |

    | Custom voting tools | Custom devices to assist in voting and thematic grouping
    of participants – e.g. the Opinionator (Cunningham & Harrison, 2010). |

    | Data visualisation tools | Rendering data in 3D rather than just 2D, and, where
    relevant, text and code visualisation (e.g. Balogh & Beszedcs, 2013). |

    | Session recording | Audio, video, and text capture of the session. |

    | 3D session capture | 3D capture of the session for replay – so you can watch
    yourself in the meeting later! |


    There is a significant body of literature around the design, use, and effectiveness
    of these types of tools in virtual worlds, often under the banner of collaborative
    virtual environments (CVEs), including:


    +   - The role of play and sociability in CVEs (Brown & Bell, 2006);

    +   - Using colour and space design to both help anchor participants expectations
    from the physical world and provide space to encourage non-physical world activities
    such as creating objects on demand (Uribe Larach & Cabra, 2010);

    +   - Exploring the use of Media Synchronicity Theory that showed that CVEs aided
    “convergence processes in teams working on a decision making task, leading to
    increased shared understanding between team members” and hence an increase in
    the performance of decision-making teams (Schouten et al., 2010);

    +   - Developing a “theoretical model of effective team collaboration in 3D virtual
    environments” focused around information processing, communication support, and
    shared understanding (Van der Land et al., 2011); and

    +   - Using virtual environments to support collaborative meetings in healthcare
    quality improvement, highlighting the potential challenges to those with weaker
    information technology (IT) skills (Taylor et al., 2020).


    An entire Special Issue of the Journal of the Association for Information Systems
    was on Team Collaboration in Virtual Worlds, including papers on A Longitudinal
    Field Study of Virtual World Use for Team Collaboration and on a Structured Approach
    for Designing Collaboration Experiences for Virtual Worlds (Boughzala et al.,
    2012).'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Some of the current (2023) platforms focused on the generic collaboration use
    case include Arthur (2020, https://www.arthur.digital/), Glue (2020, https://glue.work/),
    and MeetInVR (2019, https://www.meetinvr.com/), but it is a volatile space.


    # Collaboration in AR/MR


    There has also been significant research on the use of augmented reality/mixed
    reality (AR/MR) for collaboration on physical tasks (e.g. Ladwig & Geiger, 2019.
    Wang et al. (2021) provide a useful analysis of over 215 papers, covering a range
    of sectors including manufacturing, telemedicine, architecture, and tele-education.
    They identify five main ways of sharing non-verbal cues between the field and
    remote workers:


    +   • Virtual replicas or physical proxy (VRP);

    +   • AR annotations or a cursor pointer (ARACP);

    +   • Avatar position and movement;

    +   • Gesture; and

    +   • Gaze.


    Current issues with MR are field of view (as discussed in Chapter 1) and illumination
    limitations – even when participants are co-located (Alizadehsalehi et al., 2020)
    – although video pass-through approaches seen to have largely solved these issues.
    The already realisable vision – as seen in Meta''s promotional videos for the
    Metaverse (Meta, 2021), and proven in MR applications such as Arkio and Wooorld
    – is where the participants are in different physical locations but through the
    MR headsets can appear in the physical locations of the other participants.


    The main argument for MR (as against VR) collaboration is that the user maintains
    local situational awareness – which may be vital in some use cases – and can respond
    to both virtual and physical world prompts and events – and indeed MR may even
    be able to enhance situational awareness (Wallmyr et al., 2019). Another argument
    is that users get (at least in the co-located model) to interact with the physical
    people and so they can better detect non-verbal cues – assuming that the MR headset
    doesn''t mask most of the users'' faces making facial expression hard to see.
    This is compounded by the narrow field of view which makes it hard to look at
    both participants and any virtual information at the same time (although again
    video pass-through largely solves this, and the Apple Vision Pro even puts your
    “eyes” on the front of the headset!).


    As people begin to experiment with this newer generation of MR devices, there
    is a significant opportunity to enhance remote collaboration. Whether the Avatar
    style holographic command centre will be better met by MR or simply moving everyone
    into a VR space will be interesting to see – and of course both routes may be
    valid depending on the use case.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Having considered the generic benefits of metaversal spaces, the chapter now
    examines the more sector-specific use cases. Since learning, training, and education
    overlap between B2C, B2E, and C2C, they will be considered first, before moving
    on to specific B2C and B2B use cases.


    # Learning, Education, and Training


    At the most trivial level, a metaverse which supports collaboration can also support
    education. Much of the early history of education in virtual worlds was in subverting
    game worlds which did not explicitly support education (e.g. World of Warcraft)
    to use them for teaching and learning (e.g. Wiklund & Ekenberg, 2009).


    At the heart of using the Metaverse for learning is that it supports a wide range
    of related pedagogical approaches such as Kolb’s Learning Cycle (Kolb, 2014),
    constructivism (Loke, 2015), experiential learning (Dewey, 1986), cognitive load
    theory (P. Chandler & Sweller, 1991), situated cognition/encoding specificity
    (Greeno et al., 1993), and problem-based learning (Savin-Baden, 2007).


    The key affordances of immersive 3D environments have been identified as being
    able to let the user experience what is being taught, to learn in context, to
    be able to relate to knowledge spatially, to be engaged with the learning, and
    to collaborate in the learning (Dalgarno & Lee, 2010). Teaching and learning in
    the Metaverse enable tutors and students to leverage those affordances in order
    to develop better learning, a deeper understanding, and better recall. The psychological
    underpinnings of VR, and particularly the relationship between technical immersion
    and psychological immersion, were discussed in Chapter 2. That headset-mounted
    VR displays (HMD-VR) and DesktopVR should be user choices and not designer choices
    is a vital considerations. A key design decision in VR learning is getting the
    right balance and approach to the fidelity of the environment, task, and interactions
    and ensuring that they match to the needs of the learning (Stone, 2008). Beck
    et al. (2021) of the Immersive Learning Research Network provide a useful Immersive
    Learning Knowledge Tree, a conceptual framework for mapping knowledge and tools
    within XR learning.


    Many of the broader benefits of the Metaverse for learning beyond “better learning”
    are captured by the generic metaversal benefits. Particularly relevant elements
    are that of being able to put the user in the environment that is the focus of
    the learning – no matter how dangerous, costly, or plain impractical that would
    be in the physical world, and to change the group dynamics so as to give quieter
    students more chance to participate and encourage group learning and group co-creation
    in ways that would be hard to replicate in physical or more traditional digital
    learning spaces.


    Metaverse learning can be applied at all levels from K12/primary education through
    to tertiary education, onboarding, and into vocational and work'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'training and continuing professional development, covering both hard and soft
    skills. Some recent studies of learning and training using metaverse technologies
    and platforms include:


    +   • Mining educational implications of Minecraft – (Baek et al., 2020);

    +   • A systematic review on the use of Roblox in learning (Han et al., 2023);

    +   • A review on virtual reality skill training applications – covering first
    responder training, medical training, military training, and workforce training
    (Xie et al., 2021); and

    +   • An examination of the challenges of using VR for chemical, biological, radioactive,
    and nuclear (CBRN) training (Regal et al., 2023).


    For a survey of Second Life-era use cases, the material produced at the time by
    John Kirriemuir recording the global use of Second Life and OpenSim for education,
    principally the Virtual World Watch, is still an excellent resource (Kirrieimuir,
    2009).


    Engage (https://engagevr.io/), with its so-far unique ability to record and play
    back a session and watch yourself within it, is probably the most visible of the
    current metaverse platforms that are focused on education and training. Amongst
    other companies active in the space (particularly for enterprise training) are
    Luminous Group (https://www.luminousxr.com/), Immerse (https://immerse.io/), Strivr
    (https://www.strivr.com/), TrainBeyond (https://www.trainbeyond.com/), Acadius
    (https://acadius.com/), and ClassVR (https://www.classvr.com/).


    However, a lot of work is still taking place in custom builds and proprietary
    platforms built with Unity and Unreal, rather than on shared public or semi-public
    platforms, and as a result both hiding activity levels and reducing the ability
    to share learning and training experiences and assets between organisations.


    It should be noted that using game-based technologies for learning is not the
    same as gamification, which is more about generating intrinsic motivation (Hamari
    et al., 2014) – although you can use gamification processes within metaverse learning
    applications.


    # **Business to Consumer Use Cases**


    # **Marketing**


    Marketing is always an early adopter of new technology, and as described in Chapter
    1, marketing was one of the big uses of Second Life back in the early 2000s. This
    has continued with the current crop of metaverse type environments, such as the
    marketing campaigns by Walmart (Blackwood, 2023)'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'and Nike (Sutcliffe, 2022) in Roblox and by Marvel and the NFL in Fortnite
    (Goodman, 2023). However, Microsoft and Mojang have so far restricted corporate
    marketing on Minecraft (Grubb, 2016).


    Marketing activities are largely brand-awareness campaigns – so the tens and hundreds
    of millions of active users on platforms like Roblox and Fortnite are hard to
    ignore. While there is already an established system for billboard-type adverts
    in video games (Dixie, 2023), the marketing approaches to virtual worlds do tend
    to take a different tack as there is no way of guaranteeing “eyes-on” a particular
    billboard (unlike, for example, in a racing game), and so instead marketing is
    more experiential focused, often in dedicated spaces, rather than an act of passive
    viewing (A. Lee, 2023).


    The use of AR for marketing has been as more of a sales-support tool – as in the
    Ikea example already quoted. Using AR or MR, a company can put its own products
    in a potential customer’s house before they buy, or put a product anywhere that
    people are gathering without the need (and cost and security) of physically moving
    the product there.


    An oft-talked-about use case is that of creating virtual adverts outside of shops,
    but the persistent AR/MR devices that consumers would need to be wearing for it
    to be effective – such as the failed Google Glass or Ray-Ban Meta Smart Glasses
    – are not yet commonplace and have seen some social resistance and privacy concerns
    (de Ruyter et al., 2020). However, some creative opportunities for using AR/MR
    for one-off events – such as seen at Dubai’s Shopping Festival – do exist (ARKx,
    2022).


    # Fashion


    Metaverses are social virtual worlds, and as such the appearance of a user’s avatar
    can be a key consideration. Many of the social virtual worlds already support
    vibrant fashion communities, and many physical world brands such as Nike, Prada,
    and Tommy Hilfiger have experimented with making their products available to virtual
    users (L. Smith, 2022). The term “phygital” has been coined to identify products
    which link both the virtual and physical worlds (Moravcikova & Kliestikova, 2017).
    Today, when you buy some products (e.g. a book or a map) you can get both the
    physical and digital copies – and it may not be too long before the same happens
    when you buy a new top or shoes. Or, perhaps, we’ll buy virtual clothes for impact,
    look and variability, and physical clothes for permanence and sustainability (Cannone,
    2021).


    This is one area where a lack of standards is potentially hampering the market,
    since virtual clothes do not tend to be portable from one world to another – a
    jacket bought in Fortnite won’t be usable in Roblox (Prem, 2023). External intermediation
    services, such as ReadyPlayerMe (https://ready-player.me/), where the avatar and
    clothing are managed by a third party and then supported by individual virtual
    worlds, are one way forward – but'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'perhaps not the most ideal solution. The virtual fashion market (including
    marketing and virtual goods) has been predicted to be worth $55 billion by 2030
    (Deloitte, 2022).


    The use of virtual worlds as a learning ground for physical fashion designers
    and retailers should also not be overlooked. A number of fashion schools have
    used virtual worlds to give their students the opportunity to design new items,
    show them in a virtual runway show, and then sell them in virtual shops to real
    people (e.g. Uhomoiibhi & Ross, 2013).


    The other significant element of virtual fashion is the concept of “virtual try-on”,
    typically using AR technologies to see how cosmetics and clothes would look on
    you. Offerings in this area have already been explored by companies such as MAC
    and L’Oreal (Cannone, 2021), Prada, Levi’s, and Ray-Ban (Lavoye et al., 2023),
    and applications such as TINT (https://www.banuba.com/tint-makeup-virtual-try-on)
    and Google’s “Try On”.


    # Health and Care


    There have been a number of studies which show that exercise in virtual worlds
    can actually make a difference to physical health and mental well-being (e.g.
    Appel et al., 2020; Costa et al., 2019; Wagener et al., 2021). The medical community
    were also early adopters of VR for surgery training (Paro et al., 2022), and of
    virtual worlds for a variety of medical training scenarios including paramedic
    training (e.g. Conradi, 2009) and nursing training (Plotzky et al., 2021). VR
    has even been used to provide pain relief during surgery (Freitas & Spadoni, 2019).
    There have also been studies on the use of VR to support cognitive training (Bauer
    & Andringa, 2020), physiotherapy (Heiyanthuduw a et al., 2020), and entertainment
    (Lai et al., 2019) within the care of the elderly. There are useful systematic
    reviews of VR in healthcare by Kononowicz et al. (2019) and Barteit et al. (2021).


    Health and care is probably a good example where the distinctions between environment,
    interaction, and task fidelity apply. Surgery is typically about fine manipulation,
    and so the technical demands on a VR system are very high; ideally the surgical
    tools need a haptic response, and with modern keyhole surgery, the surgeon can
    use the real tools but have them instrumented into the virtual environment. In
    contrast, other medical and care tasks – such as the correct procedures to follow
    for a post-partum haemorrhage or a home visit – are more about process, and so
    make lesser demands of the simulation.


    In the medical sector, there is also extensive use of mannequins for training,
    which have themselves become more instrumented and even integrated with virtual
    environments – so that the student can interact with a patient in VR and then
    with an AR/MR-augmented mannequin of the same patient (e.g. Schild et al., 2022).
    As with much virtual world activity, medical simulations have tended to be driven
    by individual and independent initiatives, but there have been attempts to create
    consolidated virtual hospitals or'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'medical centres where a range of medical simulations can be shared across a
    wider institutional base – something which a Metaverse would make far more achievable.
    There have also been attempts to use standards such as the Medbiquitous Virtual
    Patient (Ellaway et al., 2008) or Artificial Intelligence Markup Language (Danforth
    et al., 2009) to allow medical exercises to be defined in relatively platform
    neutral ways to encourage portability.


    As well as educating medical staff, virtual environments can be used to educate
    patients – letting them walk through a hospital visit or medical procedure to
    better understand what is going to happen to them to relieve anxiety or make more
    informed choices (Mahajan et al., 2021). There have also been projects to use
    virtual environments to help with life-style choices – for instance, diet or smoking
    (McGuirt et al., 2020) – enabling people to walk around inside their virtual body
    after the impact of several decades of smoking, or to see the changes in their
    look and abilities after years of a poor diet.


    Considering care in a different setting, there have also been numerous studies
    looking at the use of VR within prisons in areas such as education (McLaughlan
    & Farley, 2022), improving behaviour management (Farley, 2018), and re-entry back
    into society (Teng & Gordon, 2021).


    # Therapy


    Whilst the “Proteus Effect” (Yee & Bailenson, 2007) has shown that users with
    idealized avatars will tend to live up to this idealized self and have a greater
    sense of self-worth in the virtual world, there is also evidence that virtual
    experiences can help maintain that improved self-worth in the physical world (e.g.
    C. J. Falconer et al., 2016). VR has also been used in areas such as Virtual Reality
    Exposure Therapy (VRET) to help treat combat-related posttraumatic stress disorder
    (PTSD) (Mozgai et al., 2020), social anxiety (although with uncertain results),
    addiction, autism, and attention-deficit hyperactivity disorder (ADHD) (Emmelkamp
    et al., 2020).


    Therapists can use virtual worlds as safe shared spaces to meet with clients,
    adapting the environment to the client’s needs, and introducing imagery, audio,
    video, and even objects as required to support a session (Sampaio et al., 2021).
    There is even the potential to consider how the therapist could be supported by
    an automated avatar so that the client could access support at any time of the
    day or night (e.g. Ren, 2020).


    # Entertainment


    The use of virtual worlds to support passive entertainment experiences such as
    music concerts and sporting events also has a long history. IBM used Second Life
    to present Wimbledon in 2008 (Cremorne, 2008), and as mentioned, Suzanne Vega
    performed in Second Life as far back as 2006. Alongside the use of generic platforms
    such as Fortnite by performers such'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'as Ariana Grande and Travis Scott and sporting brands such as NFL, there are
    also a number of platforms that are seeking to make concerts or sports their main
    business model. Examples include the refocussed *Sansar* (2014, https://www.sansar.com/),
    *Vark* (2018, https://vark.co.jp/), and *AmazeVR* (2022, https://www.amazevr.com/).
    *AmazeVR* produced a stand-alone VR performance by Megan Thee Stallion called
    *Enter Thee Hottieverse* (sic) in 2022 (Skarredghost, 2022). In the AR space,
    Immersal (https://immersal.com/) is focussed on apps to enhance the stadium experience
    for sports games.


    One problem that these companies have is that having more than a few hundred avatars
    in one place, all interacting with each other, is still a huge computing and network
    challenge, and this is discussed in more detail in Chapter 4. So, whilst the idea
    of using the Metaverse for huge crowds to attend big music and sporting events
    appears in much of the publicity of the Metaverse, the technical challenges of
    achieving it in a way that mirrors the physical experience are non-trivial, and
    perhaps a reason why performers should be looking for more metaverse-native ways
    of expressing their art.


    # Gaming


    Many of the platforms with metaversal elements are those which have been developed
    primarily to support games – whether it’s *Roblox*, *Fortnite*, or *Minecraft*.
    A first-person shooter played solo does not feel very metaverse-like, but as soon
    as that game becomes multi-player, and especially if there’s a pause or an opportunity
    to sit down, have a chat, and go off-script the game feels more social and more
    metaverse-like. As a result, there is a very blurred area between games which
    are purely games, and those which are metaversal experiences. One of the big benefits
    of taking a metaverse approach to designing gaming platforms is that it encourages
    the creation of user-generated games and content – as with *Fortnite*, *Roblox*,
    and *Rec Room* – further strengthening the platform with minimal investment from
    platform owners and building user engagement. It may be that at some point in
    the future, all games are just areas within a more generic Metaverse – just as
    all physical games are within the physical universe.


    # Tabletop Gaming


    One other form of gaming that should be mentioned is that of tabletop gaming –
    whether it’s for *Ticket to Ride*, *Dungeons and Dragons*, or *Risk*. There are
    already a number of platforms which exist to enable such gaming to happen remotely,
    including:


    +   - *Vassal* (2002, https://vassalengine.org/) – a relatively early and straightforward
    2D implementation of games, wargames focused, but for which anyone can create
    or port games;'
  merge: -1
