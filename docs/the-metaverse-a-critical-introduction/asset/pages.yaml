- pgno: 77
  md: '# Environment Types


    These terms relate to a complete environment space and are largely technology
    neutral.


    +   • Synthetic Environment – the broadest term encompasses any environment that
    provides a synthetic or artificial sense of reality. Although some people even
    include manual or synthetic systems such as paper wargames in this definition
    (e.g. Perla, 2011), it is usually taken as referring to digital synthetic environments.
    It can be further refined into:

    +     • Immersive/Subjective digital synthetic environments where the user has
    a first-person experience (even if from an over-the-shoulder third-person view);
    and

    +     • Objective digital synthetic environments, such as agent-based modelling
    environments where the user observes the behaviour of multiple algorithmically
    driven agents within a space – such as for crowd and traffic modelling – objectively
    from outside of the simulation.


    +   • Virtual Reality Environment/Experience – a more specific term which in more
    recent usage tends to imply the use of a VR headset but can also be used to refer
    to mobile and desktop VR experiences as well – and is used in this sense in this
    book. It includes VR experiences that are single user and with relatively little
    user agency (including viewing a 360° photo or video) that might be excluded from
    a “virtual world” definition;


    +   • Virtual World – during the 1990s/2000s, “virtual world” (VW) was the dominant
    term for the worlds that people were exploring such as Second Life, Qwaq, OpenWonderland,
    and Forterra. The key features are that users are represented by an avatar, share
    the space with other avatars, and can explore and interact with a rich 3D environment
    – which in some cases might be just one room but in others entire continents.
    Whilst training- and business-orientated virtual worlds might limit agency and
    persistence, the more socially orientated spaces had fewer restrictions and more
    capability;


    +   • Massively-Multiplayer Online Games (MMOs) – they provide many of the features
    of a virtual world, but since they are presented as a game, they naturally constrain
    player choices and agency. Sandbox MOOs, or MMOs with sandbox or creative modes,
    tend to overlap with social virtual worlds, such as with Fortnite Creative, Roblox,
    and Minecraft;


    +   • Multi-User Virtual Environment (MUVE) – a term commonly used within the
    learning and education community to describe a virtual world which is focused
    on education, training, and learning;'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - **Social Virtual Worlds (SVW)** – a more specific type of virtual world
    which emphasises social interaction rather than using the world only for training,
    education, business, or entertainment, etc. These can range from low agency worlds
    such as *Fortnite* and *RecRoom* to the proto-metaverses such as *Second Life*,
    *OpenSim*, and *Somnium Space*, which are characterised by high user agency and
    low direction. The most open social virtual worlds have in-world tools to build
    and script new objects and experiences as user-generated content (UGC). Ideally,
    the whole virtual world (and the Metaverse) should be built from UGC; and

    +   - **Proto-Metaverse** – a social virtual world which covers most but not all
    of the 10 axioms above, or covers all of them but to only a moderate degree, and
    so whilst being close to a Metaverse “ideal” falls (currently) slightly short
    of it.


    # ## Metaverse Terms


    The following terms can be useful to describe how metaversal spaces may be created
    within a larger virtual world or metaverse (but which have restricted access,
    and possibly reduced functionality or agency), or through the inter-connection
    of multiple smaller metaversal spaces.


    +   - **Microverse** – a metaverse created for a very specific function – such
    as a training course, project, meeting, group, or entertainment event (Ffiske,
    2022). It could be the metaverse equivalent of an Intranet – an area of metaverse
    type functionality, but which is restricted to access by a single company or organisation,
    or for a single event or task;

    +   - **Pocket Metaverse** – similar in concept to a Microverse, but with more
    of an implication of being “pinched out” of a larger metaverse and so sharing
    the same infrastructure;

    +   - **Multiverse** – a network of metaversal spaces which are interconnected
    so that users can move (relatively) seamlessly from one to another. Ideally, they
    can take their identity and assets with them, and spaces may share common technologies
    and even services. Each space or collection of spaces is hosted by a different
    entity, but there should be a common discovery and possibly asset management service
    and standardised access devices and applications;

    +   - **Federated Multiverse** – a more formal form of the Multiverse, where common
    approaches are mandated, more services are shared, and interconnectivity is (near)
    complete;

    +   - **Confederated Multiverse** – a variant of the Federated Multiverse where
    there is more of a peer-to-peer approach with only the bare minimum of services
    needing to be centrally provided; and'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_79_0.png)


    **FIGURE 2.6**

    Metaverse types.


    +   * **Constituent Metaverse** – within the context of a multiverse, a metaverse
    which is connected into the larger multiverse and which may implement local rules
    and likely runs on its own infrastructure. Some also refer to these as satellite
    metaverses.


    The relationships between these are shown in Figure 2.6.


    # Is Second Life the Metaverse?


    As may be apparent from Chapter 1, Second Life and its associated open-source
    and hypergrid-enabled derivative OpenSim already provide many of the features
    that are specified for a Metaverse and can be correctly termed proto-Metaverses.
    This is borne out by their graphs in Figure 2.5. They may not be the Metaverse,
    but they are still the closest current experience that there is to it.


    Where Second Life is not seen as being a metaverse (e.g. Naveen, 2023) this is
    often because:


    +   * It is claimed not to have an HMD-VR interface – although as Chapter 1 described,
    it does have viewers (albeit unofficial) who support HMD-VR, and as the discussion
    above argues, the Metaverse should not be dependent on any one interface mode;'
  merge: -1
  img_proc: true
- pgno: 80
