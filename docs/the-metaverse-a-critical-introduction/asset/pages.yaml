- pgno: 32
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_32_0.png)


    FIGURE 1.7

    An early paramedic training simulation at St. George''s, London, in SL, 2008.


    (Taylor-Nelms & Hill, 2014), and Miami University Oxford and the University of
    Cincinnati trained nurses in triage for radioactive and explosive disasters (Farra
    et al., 2013). Hsu et al. (2013) provide a useful overview of Disaster Preparedness
    and Response Training projects in Second Life and other platforms. Even the military
    (e.g. Pey, 2020) and, according to the Snowden Papers, the intelligence community
    were in Second Life (NSA, 2008).


    There was a brief plan by Linden Lab to create stand-alone or intranet-based enterprise
    servers for Second Life (Korolov, 2010). This never came to fruition as a Linden
    Lab project, but exactly that functionality was soon available from OpenSim.


    OpenSim is essentially a reverse engineered version of Second Life (Figure 1.8).
    Linden Lab had always had quite an open approach to code, and the core “Viewer”
    code that users use to access Second Life had already been made available so that
    developers could create customer third-party viewers (TPVs) supporting additional
    functionality. OpenSim took this one stage further and developed a version of
    the Second Life server code that works in almost exactly the same way as the official
    code, even to the extent of being able to use the Second Life viewer to access
    it, but which people can run on their own servers, and even connect to other people’s
    OpenSim servers to create a “hyper-grid”.


    One of the biggest advantages of OpenSim is that users can save the whole of a
    sim’s set up – all its builds and scripts – as a single OpenSimulator Archives
    (OAR) file. This can then be uploaded to a new server, so sims can be easily distributed,
    archived, or duplicated (useful for scaling training exercises as a typical sim
    could only support around 50 users).'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_33_0.png)


    **FIGURE 1.8**

    A refugee camp built on OpenSim for humanitarian relief training.


    Just as Second Life has continued as a useful platform despite the desertions
    of the 2010s, so too OpenSim is still a vibrant community. In 2023, Hypergrid
    Business (which has been tracking OpenSim, Second Life, and other metaverse activities
    for over 15 years) logged 427 OpenSim grids (i.e. publicly accessible and typically
    more than one sim), of which about 317 were connected to the Hypergrid (Hypergrid
    Business, 2023). And this does not count any OpenSim instances being run purely
    for private use.


    In many ways, the OpenSim Hypergrid (http://opensimulator.org/wiki/Hypergrid)
    may be the closest thing to an open Metaverse that currently exists. It is based
    on open-source code; each grid is privately run and hosted; and anyone can run
    and host a grid, or buy a sim, or land on a sim on a grid. Being based on Second
    Life, the build tools are all built into the viewer and include a powerful scripting
    engine with read/write access to the web. And the hypergrid protocol, which enables
    the connectivity between the grid, supports teleporting and agent (i.e. user)
    transfers from grid to grid (Lopes, 2011).


    The subsequent work of Linden Lab (on Project Sansar) and Philip Rosedale (on
    High Fidelity) will be discussed later in this chapter – as well as considering
    Second Life’s current state of health.


    # Second Life Alternatives


    Second Life wasn’t the only proto-metaverse available during the early 2000s.
    Open Wonderland (2010) (Kaplan & Yankelovich, 2011), which had its origins in
    Sun Microsystems, was based on an open-source coding model and let'
