    ingredients are with us now – think interacting with lots of people and content
    made by them, in persistent, immersive worlds across many devices, including virtual
    reality. The more these components intertwine, the closer we get to a fuller version
    of the metaverse”. |

    | Hackl (Alaghband, 2022) | “I believe it’s a convergence of our physical and
