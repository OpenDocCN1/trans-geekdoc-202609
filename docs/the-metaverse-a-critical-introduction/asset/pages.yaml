    Facebook bought Oculus in 2014 (Dredge, 2014), but the next big step forward was
    in 2019 with the release of the Oculus Quest – a fully contained, 6DOF, room-scale
    VR headset for £399, which no longer needed to be connected to a high-end PC or
    required additional room sensors. Now, almost anyone who could afford a smartphone
    could also buy a decent VR headset. In 2020, the Quest 2 was launched, and by
    2023, Oculus/Meta had reportedly sold nearly 20 million Quest headsets (Heath,
    2023). The Quest 3, which added a state-of-the-art mixed-reality capability, was
    launched in October 2023.


    # HMD-VR Virtual Worlds


    Whilst most of the applications released for the Quest have been video games or
    360-degree video cultural and geographical tours, there have been a number of
    interesting virtual world type applications.


    The most common category is probably that of meeting and collaboration applications.
    Examples include Glue (c.2017, https://glue.work/), MeetInVR (2020, https://www.meetinvr.com/),
    and Arthur (2021, https://www.arthur.digital/). These typically have a corporate,
    business-like feel and support a limited number of location styles, limited avatar
    choices, and limited object placement/import, but a reasonable set of collaboration
    tools such as virtual whiteboards, PowerPoint screens, browser displays, Google
    Docs integration, voice and text-chat, 3D emoticons, screen share, and even webcams.


    In terms of environments aimed at consumer socialising, VRChat (2014) (https://hello.vrchat.com/)
    is probably most popular with concurrency rates comparable to the most popular
    online games (Au, 2022a) but has a pretty extreme aesthetic (Figure 1.13), as
    does Cryptovoxels (2018) (https://www.cryptovoxels.com/). The positive side of
    this is that the creativity in VRChat rivals Second Life in its hey-day (Au, 2023),
    and the negative side are the reports on grooming, exploitation, and significant
    child-safeguarding issues (Crawford & Smith, 2022).


    More restrained but equally creative was AltSpaceVR (2015), which hosted a virtual
    Burning Man festival each year and was probably the closest of the current crop
    to the Second Life feel. In its original 2015 iteration, AltSpaceVR had an innovative
    feature called “enclosures” allowing the user to write code to define the 3D contents
    of that space – even pulling in web data to visualise in the display (see Figure
    1.14). For larger spaces, developers used Unity to build an environment and then
    uploaded it to AltSpaceVR (a common approach in'
