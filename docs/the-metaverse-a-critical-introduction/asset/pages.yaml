  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_110_0.png)


    FIGURE 3.3 Comparing virtual and physical builds of the Library of Birmingham.


    # Digital Twins


    The Digital Twin concept dates back to 2002 and Florida Institute of Technology’s
    Center for Advanced Manufacturing (Grieves, 2003; Mihai et al., 2022). At its
    core is the idea that an organisation maintains a digital copy of a real piece
    of equipment (or even place or team), feeds that model with all of the data about
    the physical instance, and so can perform continual “what-ifs” in terms of how
    the physical system may respond over time either in terms of chronic issues such
    as maintenance failures or acute issues such as sudden changes in the operating
    conditions. The target system could be anything from the engine on a ship – or
    the ship as a whole – to an entire factory and all its production lines, or even
    a whole city. Both Dubai and Shanghai have announced their intention to build
    digital twins of themselves (Gazit, 2024), and London, New York, Tokyo, Seoul,
    Santa Monica, and Singapore all have some form of digital twin city underway (Ibrahim,
    2022) – although what actually ends up being actually built, beyond a visual representation,
    is moot. Juárez-Juárez et al. (2021) provide a typology of digital twins and a
    good overview of the technologies and approaches potentially involved, including
    data modelling, data management, communications, and multi-agent systems.


    Whilst the Digital Twin need only be realized in numbers and code, there is a
    natural inclination to present it at least through a 2D diagrammatic interface,
    or even as a 3D model. Where the overlap with the Metaverse really starts to happen
    is when managers and maintainers can walk around that model, getting a subjective
    as well as an objective view as to what is happening. They can use their virtual
    tablet computers, heads-up displays (HUDs), or AR displays to examine both the
    physical and digital versions of performance (Eyre & Freeman, 2018) or to experience
    the Digital Twin data as a Fused Twin in the same space in the physical world
    as the Physical Twin (Grübel et al., 2022). The primary benefit is that the operator
    is able to have a'
  merge: -1
