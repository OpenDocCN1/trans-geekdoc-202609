- pgno: 85
  md: 'the user experience is distinct from the technology is reinforced by the user-system-experience
    (USE) model (Cowley et al., 2006), where the user experience is the result of
    the mental and physical state of the user and their interaction with the technical
    components of the system – including the authored experience. This is reminiscent
    of the earlier distinctions between technical and psychological immersion, and
    between the place illusion and the presence illusion. The fact that Rueda applies
    equal prominence to the narrative and ludic (game) elements in creating the experience
    as to the more perceptual elements is also notable.


    In comparing HMD-VR with DesktopVR and other media, it has often been found that
    greater immersion (i.e. HMD-VR) does not necessarily relate to higher performance,
    seeming to be very task and user dependent (e.g. Chen, 2019; Pallavicini et al.,
    2019; Srivastava et al., 2019). What seems to correlate better with performance
    is presence (Grassini et al., 2020) – which seems to be as achievable with DesktopVR
    as with HMD-VR. Issues with cumbersome VR controls and safe movement can detract
    from that sense of presence, so good human-machine interface (HMI) design is essential.
    Users are also likely to be able to spend longer in DesktopVR sessions than they
    can in HMD-VR – partly due to the reduced incidence of cybersickness (CS), which
    is further discussed below.


    # Problems of VR


    Quite apart from the efficacy debate, there are several key areas where VR experiences
    might cause problems to users, and any metaverse needs to be designed and used
    with these in mind. These are in addition to some of the broader issues of social
    virtual worlds and metaverses discussed in Chapter 5.


    # Cybersickness (CS)


    A key issue in the use of VR is that of CS, prevalent in HMD-VR but not typically
    in DesktopVR. One review (although based on pre-2019 headsets) found that “60–95%
    of participants experience some level of CS during exposure to a virtual environment,
    whereas 6–12.9% of the participants prematurely end their exposure” (Caserman
    et al., 2021). There are indications that continuing improvements in resolution,
    refresh rates, and latency may be reducing the incidence of CS. Having a DesktopVR
    alternative to any HMD-VR experience would though still seem a sensible option,
    particularly since DesktopVR can also be experienced on mobile and tablet devices,
    and so can be more location (and time) independent.'
