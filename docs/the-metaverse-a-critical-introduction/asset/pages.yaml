- pgno: 19
  md: '# # 1


    # A History of the Metaverse


    # ## Introduction


    This chapter provides an overview of the history of the Metaverse, both as an
    idea and as a series of evolving virtual worlds and extended reality experiences
    and technologies. It examines how some of the early text-based social spaces could
    be considered as proto-metaverses before looking at the graphical two-dimensional
    (2D) and three-dimensional (3D) social virtual worlds that evolved during the
    1990s and 2000s. The chapter then describes how, from 2013, the concept of the
    Metaverse became dominated by the new generation of headset-mounted VR displays
    (HMD-VR) and the rise of popular 3D game worlds, before examining the impact of
    Meta’s decision to back the metaverse concept, and then the rise of the blockchain
    and cryptocurrency-based virtual worlds. It also briefly considers the developments
    in augmented reality (AR) and mixed reality (MR) that are a part of the metaverse.
    The chapter closes by examining how the Metaverse has been represented in fictional
    works.


    # ## The Beginning


    The term “Metaverse” was famously coined by Neal Stephenson in Snow Crash (Stephenson,
    1992). The Metaverse described there shows most of the features that are now expected
    of a metaverse. It is multi-user, social, interactive, inhabited by human- and
    artificial intelligence (AI)-driven avatars, and provides an environment where
    people can pretty much do what they want to do. Notably, the world is based on
    a spatial arrangement – that of a straight road around the equator of a virtual
    globe, and where land prices depend on the distance along and from the road. The
    Metaverse is accessed through an HMD-VR display fed optically rather than digitally
    from a portable computer.


    However, the concept of a metaverse pre-dates Stephenson. Whilst the seminal Neuromancer
    (Gibson, 1984) and many other cyberpunk works featured a very abstract representation
    of cyberspace, the fantasy-style virtual'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'world of Vernor Vinge''s *True Names* (Vinge, 2015), first published in 1981,
    has many metaversal elements with its protagonists meeting in their own rooms
    in a virtual castle and travelling the virtual world.


    # MUDs and MOOs and Habitat


    In practical terms, the roots of the metaverse concept can be found in the multi-user
    dungeons (MUDs) and multi-user object-orientated dungeons (MOOs) of the late twentieth
    century. MUDs and MOOs, such as *MUD* (1978) (Bartle, 2004) and *LambdaMOO* (1990)
    (Schiano & White, 1998), offered a far broader range of environments than the
    dungeon moniker suggests. Since everything in them is described in text, a starship
    or alien world can be “rendered” in just a single sentence. As long as users engage
    with the experience, the immersion can be psychologically and emotionally strong.
    Whilst engagement with these worlds was usually a positive experience, instances
    such as the digital rape documented in *My Tiny Life* (Dibbel, 1994) provided
    an early warning of the potential pitfalls of the Metaverse.


    The move from text to 2D graphics came most notably from *Habitat* (1986), a 2D
    virtual world with simple and blocky graphics created by Chip Morningstar and
    F. Randall Farmer (Morningstar & Farmer, 2008). *Habitat* was inspired by, amongst
    other things, the virtual world described in *True Names*. Habitat included 20,000
    locations, avatars that could move around, gesture, interact with objects, and
    text chat with each other. The world also had its own economy. Initially built
    for the Quantum Link dial-up system, *Habitat* was later ported to CompuServe.
    In a paper they presented in 1990, Morningstar and Farmer tellingly noted that:


    > The essential lesson that we have abstracted from our experiences with Habitat
    is that a cyberspace is defined more by the interactions among the actors within
    it than by the technology with which it is implemented. While we find much of
    the work presently being done on elaborate inter-face technologies – DataGloves,
    head-mounted displays, special-purpose rendering engines, and so on – both exciting
    and promising, the almost mystical euphoria that currently seems to surround all
    this hardware is, in our opinion, both excessive and somewhat misplaced. We can’t
    help having a nagging sense that it’s all a bit of a distraction from the really
    pressing issues. At the core of our vision is the idea that cyberspace is necessarily
    a multiple-participant environment ... Beyond a foundational set of communication
    capabilities, the technology used to present this environment to its participants,
    while sexy and interesting, is a peripheral concern. (Morningstar & Farmer, 2008).


    Replace “cyberspace” with “metaverse”, and the statement is probably as true today
    as it was over 30 years ago.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Moving onto the Internet and into 3D


    Whilst defence, enterprise, and even consumer HMD-VR was around by the late 1990s
    (for instance, the Virtuality Entertainment installations in Piccadilly Circus
    and at the Dave & Buster’s bar chain) (Virtual Reality Society, n.d.), it was
    not until the advent of the Web and the broader uptake of the Internet that readily
    accessible virtual worlds became feasible. Virtual reality markup language (VRML)
    (https://www.w3.org/MarkUp/VRML/) was an early hypertext markup language (HTML
    style standard) that let developers use a text editor to create pages of VRML
    that would render as full 3D DesktopVR virtual environments within a PC viewer
    application or even a browser plug-in.


    A number of companies started to take advantage of the Internet as a way of delivering
    multi-user virtual worlds, either into the browser or more commonly to a downloadable
    application. Two key worlds were:


    +   • Worlds Chat (1994), developed by Worlds Inc. and probably the first 3D virtual
    world, although it was little more than sliding simple 3D avatar objects around
    within a 3D space and engaging in text-chat; and

    +   • Worlds Away (1996), which shares some history with Habitat and had a similar
    but improved 2D graphical interface and ran across the Internet rather than a
    network like CompuServe (Brenchley, 2023).


    # The Children of Snow Crash


    Legend has it that when Snow Crash came out, several entrepreneurs placed it down
    on the table in front of investors or their teams and said “we’re going to build
    this”. Perhaps more realistically, it became a reference point for those developing
    the first 3D virtual worlds (Au, 2023). One of the earliest, and most complete
    in vision, was Active Worlds (1995, https://www.activeworlds.com/). By today’s
    standards, the graphics are quite basic (but beyond the 8-bit graphics of early
    video games), but it had a contiguous geographic world where you could buy a plot
    of land, and similar to Snow Crash, land prices were related to the distance from
    the centre and to the closest teleporting “railway” station. Avatar clothing could
    be bought, and buildings were built from a collection of simple shapes and components
    acquired through the in-world marketplace. Crucially, Active Worlds had a scripting
    language, which not only allowed in-world scripting but also limited interfacing
    to applications on the Internet. Active Worlds is still operational nearly 30
    years later.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'David built his first metaverse house around 1999 at a place called Retsmah
    Crossing in Active Worlds (see Figure 1.1). Like many metaverse houses, before
    and since, it followed an “ocean living” aesthetic of open plan layout, glass
    walls and chrome finishes. Using scripting, David then built a simple non-player
    avatar that would respond to commands, could navigate its way around the local
    area, and even play hide-and-seek.


    ![](img/a1f0838ef56b3ffb455ace32842c1458_22_0.png)


    FIGURE 1.1 David and his house at Retsmah Crossing in Active Worlds.


    Whilst simpler in graphics (far closer to the 8-bit model) and with a fixed 2.5D/isomorphic
    perspective, Habbo Hotel (2000, https://www.habbo.com/) attracted a large user
    base and was seen as being one of the most popular teen-orientated social virtual
    worlds with 273 million registered users in 2013 (Mäntymäki & Salo, 2013), although
    this had fallen to four million by 2018 (Leotoddy, 2019). Whilst it lacked many
    metaverse features beyond avatar outfits, room decoration, and text-chat, it was
    a popular place to hang out and chat. Like many other social worlds, it suffered
    from problems of abusive and exploitative behaviour, resulting in a month-long
    “mute” of chat on the system in 2012 following a Channel 4 report into the use
    of the world by paedophiles (Bryce, 2020).


    A different world entirely was There.com (2003, https://www.prod.there.com/) –
    see Figure 1.2. This featured (then) state-of-the-art graphics and beautifully
    rendered environments but never had the usage levels of a world like Habbo Hotel.
    Users had to be approved to create and sell assets in the world. There.com closed
    in 2010, and Márquez (2013) has an interesting study on what happened to its residents,
    called “Thereians” afterwards, and which is probably representative of other closed
    virtual worlds. Márquez identifies how the Thereians used social media to maintain
    the social connectivity that they had created, and explored the transference of
    their identities, groups, and activities to other social virtual worlds, such
    as Second Life. There.com itself re-opened in 2012.'
