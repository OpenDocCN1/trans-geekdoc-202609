    # 3D Massively Multi-Player On-Line Games


    Just as an earlier generation found new ways to use massively multi-player online
    (MMO) platforms such as World of Warcraft, so in the 2010s, people began to use
    Minecraft (2011, https://www.minecraft.net/) for education (Bar-El & Ringland,
    2021), geography (Lecordix et al., 2018), code visualisation (Balogh & Beszedes,
    2013), and even religious services and virtual Sunday Schools³ (CofE, 2020; Jeremy,
    2021). Minecraft offers a variety of world-building, scripting, marketplace, and
    collaboration tools to help in the building of UGC and even allows people to run
    their own servers. In January 2023, Minecraft had around 176 million monthly active
    users (MAUs) (Sharma, 2023).


    Roblox (2006, https://www.roblox.com/) has also seen significant use in education,
    again being enabled by easy-to-use building, scripting, and sharing tools (Han
    et al., 2023). Roblox has also been used by several high-profile brands such as
    Walmart (Blackwood, 2023) and Nike (Utoyo et al., 2022) for marketing campaigns.
    Whilst Roblox supports UGC and does have a developer community, that community,
    as previously mentioned, is not making as much income as the developer community
    in Second Life. In 2023, Roblox had around 214 million MAUs (Ruby, 2023).


    The other popular MMO at the time of writing is Fortnite (2017, https://www.fortnite.com/).
    Whilst it arguably has better graphics, the game tightly binds the players into
    a battle royale model, so there was initially less creativity and non-gaming use
    than in worlds such as Roblox and Minecraft. In 2018, Epic released Fortnite:
