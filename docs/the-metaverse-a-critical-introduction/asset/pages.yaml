  md: '+   * Roll20 (2012, https://roll20.net/) – 2D again, and optimized for role-playing
    games, but usable by other types – again users can create their own game, but
    official modules for commercial games are also available. Roll20 reported 10 million
    registered users in 2022 (Meehan, 2022); and


    +   * Tabletop Simulator (2015, https://www.tabletopsimulator.com/), which gives
    users a fully realized 3D table with 3D playing pieces, but since it doesn’t actually
    implement the rules of a game (as largely with both of the above), users can use
    the space and pieces however they want. Tabletop Simulator also has around 10
    million registered users and around 875,000 active users (Playtracker, 2023).


    What stops most of these spaces from being metaversal is that the user is typically
    only present through their agency in the game – their ability to move pieces and
    roll the dice. At most, they might also be present as an audio stream or a webcam
    stream, but they aren’t present as avatars or able to just walk around the table
    and do something else. As the ability to script becomes more common within metaverse
    platforms, there is no reason why the players shouldn’t sit around their gaming
    table in a generic metaverse platform as avatars. As a result, here may be again
    less need for a dedicated platform – and there have already been developments
    in this area – such as TableTop Craft in Minecraft and VRC Dominion in VRChat.
    What this combination of worlds brings is not so much in enhancing the game play
    but in enabling participants to move more smoothly (and routinely) between game
    play and other metaversal activities, and as will be discussed below, it is this
    integrative aspect of the Metaverse which promises to help lift it beyond a series
    of bespoke metaverse technology experiences.


    Mention should also be made of AR and MR in the tabletop gaming context, such
    as the system being developed by Tilt Five (https://www.tiltfive.com/) and the
    possibilities in the new breed of XR headsets. They may enable the flexibility
    of a digital gaming space to be brought into the physical world by projecting
    shared visuals onto a physically empty table.


    # Location-based VR Gaming


    A final area to consider in terms of the Metaverse and entertainment is location-based
    VR gaming. This is the modern equivalent of the laser-tag centre, where players
    don VR headsets, hold instrumented weapons, and then explore a large space populated
    with virtual enemies or monsters, or both (Williams, 2023). The trick is that
    the space itself is effectively neutral in colour and context – just a set of
    walls, stairs, tables, chairs, and other objects – and the VR headset then produces
    the graphics to provide the context of the game. But the VR graphics are aligned
    to the physical world, and if you walk'
