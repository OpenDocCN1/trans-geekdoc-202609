    Whilst WebGL/WebXR hold out significant promise, the current worlds implemented
    with them lack many of the key features of the Metaverse, or even a proper social
    virtual world – but a move towards more web-delivered virtual worlds and metaversal
    spaces and applications seems likely and would significantly enhance the accessibility
    of the metaverse experience.


    # Augmented and Mixed Reality (AR and MR)


    Books such as Rainbow’s End (Vinge, 2007) have painted as compelling a vision
    of AR as Snow Crash has of VR and the Metaverse. As Zuckerberg’s 2021 Connexions
    presentation showed, there is certainly some overlap between the Metaverse and
    AR/MR technology. Despite the brief flirtation with Google Glass (launched in
    2013), and now Facebook’s Ray-Ban Meta Smart Glasses, consumer AR was first made
    accessible by the camera, display, and processing capabilities of the smartphone.
    Pokémon Go (2016, https://pokemongolive.com/) is probably still the defining consumer
    application for location-based AR, beyond the simple AR filters for Snapchat and
    Messenger. However, in these AR applications, the Pokemon (or other) image is
    really just a 2D graphic pasted over the 2D camera image; the Pokemon character
    is not displayed in the context of the physical world around it, and so will happily
    hang in mid-air or underwater. Pokémon Go is still managing around 79 million
    MAUs (Krawanski, 2023). Companies such as Ikea have also been using AR to help
    customers visualise home improvements (Ozturkcan, 2021), and there are many other
    marketing, education, and training uses of AR (Parekh et al., 2020).


    With MR, the augmenting objects are full 3D virtual objects and are placed so
    that they are fixed in, and can even respond to, the physical environment'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'around them. For instance, a box of virtual building blocks opened out over
    a physical table would see the blocks bounce across the table, and many fall onto
    the floor. Microsoft released the Hololens (https://www.microsoft.com/en-us/hololens)
    in 2016, and Hololens 2 was released in 2019, but the US$3790 price-tag limits
    any consumer uptake. Magic Leap (https://www.magicleap.com/) was finally launched
    in 2018, after several years of hype, with their own Version 2 in 2022, and with
    similar pricing.


    The downside of the Hololens 1 was the narrow field of view (FOV) of only 30°
    horizontal and increased to 43° in Hololens 2, marginally more than Magic Leap
    1''s 40° (Heaney, 2019). This compares to a human''s physical world c.120° binocular
    FOV and c.200° peripheral FOV (Wang & Cooper, 2022). As a result, only a small
    part of the user''s visual field experiences the MR effect. Meta’s Quest Pro headset
    (US$1500 plus extras) offers both VR and MR modes, and with greater field of view
    – although using a video pass-through approach rather than projecting onto a visor,
    so reducing resolution – but reception has been poor (e.g. Robertson, 2022). Meta’s
    new consumer Quest 3 VR headset (US$500) includes full-colour pass-through and
    an MR experience that is arguably better than that of the Hololens or Magic Leap
    (Figure 1.19) – and with a wide field of view (McMillan & Moore-Colyer, 2023).
    Apple made its entry into the VR/


