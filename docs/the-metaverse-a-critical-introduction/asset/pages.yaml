  md: 'with automated avatars, digital twins of the physical humans, who are being
    continually updated as plans and activities unfold.


    # An Integrated Metaverse


    Having looked at a wide range of proven uses for metaverse technologies, it is
    important to consider what it is that some form of integrated Metaverse offers
    that implementing each of these use cases piecemeal on a variety of different
    metaversal systems probably won''t deliver. The focus in this section is on the
    more technical aspects of this argument, whereas Chapter 5 considers the more
    social aspects. Whilst Au (2023) sees the words “the metaverse” as becoming a
    term akin to “social media”, with no necessary underlying shared technology or
    integration, this section argues that some level of integration should be the
    objective, and one that should be based on open standards.


    # Reducing Costs and Increasing Re-Use


    By sharing technologies and approaches, the development time and costs for the
    infrastructure that supports the different metaverse experiences can be expected
    to be reduced due to high re-use, just as with the Web. Web server costs are typically
    a negligible part of any Web application unless being scaled for high usage. The
    Metaverse needs to be the same – setting up the core infrastructure for a new
    experience (whether local servers or cloud hosted) should be a simple, quick,
    and cheap task so as to democratize the access to creating new experiences.


    Likewise, the time and cost to then develop those experiences on the Metaverse
    can be expected to be lower if they are all using the same core toolset and approaches.
    A citizen-developer only needs to learn once and can then apply that knowledge
    to any experience, whether related to work, play, hobbies, or family. Tools and
    objects developed in one experience can easily be re-used in a different experience,
    saving further time and cost.


    # Consistency of Access and Experience


    Whilst on mobile phones, users are used to the “there’s an app for that” model
    of a separate app for each application (even if many just encapsulate a URL for
    a web browser) on PCs “everything through the web” seems increasingly to be the
    dominant model (expect possibly for computer games, which is itself significant).
    The challenges of delivering virtual worlds over the past couple of decades have
    meant that the desktop application has been almost the only way to go, but that
    is now changing with WebXR. For most metaverse applications, it seems reasonable
    to predict that in the next five to ten years, they could be readily delivered
    through a browser-based model,'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'so accessing different experiences becomes no different from clicking on Favourites
    in your web browser – and indeed it could (and probably should) be the same browser.
    And whether delivered through downloadable applications or web URLs, there needs
    to be an adequate set of discovery tools, both curated and non-curated, to help
    users find the metaversal experiences that they need when they want them – such
    as the idea of a Lively style “immersive” tab on a Google search mentioned in
    Chapter 1.


    In addition to that consistency of access, there is also the issue of the consistency
    of experience. In the early days of the Web, there was a high level of consistency
    in the way that web pages and sites worked, driven in part by the usability work
    of people like Nielsen and Loranger (2006). A shared technical underpinning of
    the Metaverse should make it easier to encourage consistency in the user interface
    across applications, even if just in the basics such as the use of iconography,
    terms, navigation commands, and understanding how links between worlds will work
    (akin to the underlined hyperlink on the web). This is not to say that every experience
    needs to look and work in the same way – and indeed the Web has moved a long way
    from the Nielsen-era recommendations as it has become more “app” like – but certainly
    in the early stages, when new users are just beginning to get used to metaversal
    experiences, providing them with some consistency of experience should significantly
    help with growing adoption.


    # Continuity of Experience and Synergistic Opportunities


    By providing a consistency of experience, and particularly by providing links
    between experiences, users will not need to switch mindset or risk losing a chain
    of thoughts as they go from one experience to another. Changes in work-life models
    are resulting in a greater blurring between physical work and personal and hobby
    experiences (Kossek, 2016). Shouldn’t the Metaverse also enable this, allowing
    users to blur their use of the Metaverse across all of their interests? Of course,
    many will want to maintain separate identities for work, family, and hobbies,
    and the Metaverse must actively support this – particularly in terms of avatar
    look and in-world naming. Ideally, this shared use of metaverse environments across
    work, family, and play should also encourage people to identify and act on synergies
    between the different experiences, resulting in even greater creativity and innovation.
    The wide variety of different platforms used for all the examples given in this
    chapter is testament to the fragmented nature of the current metaverse experience
    - with duplication no doubt being common and synergistic possibilities missed.


    # Continual Evolution


    Returning to Nielsen, a website of 1996 looks nothing like a website (or web app)
    of 2023. The Web has enabled sites to evolve to meet the changing and evolving
    needs and expectations of users by continually updating some of its key components,
    bringing in such features as Cascading Style'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Sheets, WebSockets, and WebGL, augmented by ever-changing development approaches
    such as Ruby on Rails, React, and node.js. Any Metaverse can be expected to evolve
    too. In the segmented, standalone metaverse model, each new development is likely
    to arise on one platform, which others may or may not be able to copy, and the
    proprietary model limits development to just the system''s owner. Whilst the innovation
    in multiple systems may be faster (each has fewer stakeholders, and there are
    less legacy and scalability issues), the dissemination of that innovation is likely
    to be much reduced.


    # Avoiding Redundancy and Perpetuating Experiences


    Linked to the issue of continual evolution is that of redundancy and the danger
    of creating orphan worlds. A web page of 1996 should be just as displayable and
    usable in a modern browser as it was when it was created. However, the computer
    gaming world, in particular, is littered with games which can just no longer run
    on today''s computers or gaming platforms (Guttenbrunner et al., 2010). Loss of
    experiences also comes from cessation of platform operation, or just changes in
    business models – many Second Life projects of the 2000s are no longer available
    as the owners could not afford or justify the monthly payments on the sim, and
    unlike on OpenSim, there was no way of creating an off-line archive of the build.
    By adopting a common, foundational approach to the technology of the Metaverse,
    the longevity of an application should no longer be limited by the availability
    of (or changes to) its original platform. It should be possible to readily move
    the experience between Metaverse service providers and ultimately to create an
    off-line archive which can be returned to life at any point.


    # Community


    It is not just a technical argument as to why the Metaverse should be, at minimum,
    a series of connected worlds, but also a social one. Whilst some aspects of this
    topic will be considered in more detail in Chapter 5, the key issue of communities
    is best addressed here. Some have expressed the view that the Metaverse is principally
    about communities – and that the interconnectedness of metaverse worlds is of
    less importance than the interconnectedness of communities (e.g. Au, 2023). As
    long as each community can find a home, it does not matter how connected each
    world in the Metaverse is to another. An argument against that is that each person
    is likely to be a member of multiple communities – family, locale, work, hobby,
    interests, etc. If each community is running on a different platform, then that
    is an instant barrier in moving between them, sharing experiences and in joining
    new communities. This is something that already hampers users where communities
    may be spread across WhatsApp, Facebook, LinkedIn, Discord, TikTok, Telegram,
    and countless other services. The Metaverse is a chance to try and do this right
    – having enough common foundation to ease access between services but also'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'enabling partitioning of identity when required and providing the tools to
    enable maximal expression in each community.


    As has been mentioned earlier, a key aspect of the social virtual world experience
    is that it does come back down to a (relatively small) group of people gathered
    around a campfire, chatting. The anonymity and lack of presence that comes with
    current social spaces – where even the most niche interest can attract hundreds
    or thousands of users – often mitigates against rich and engaged dialogue and
    relationships. Using the Metaverse as a primary means of supporting communities
    and their discourses could change this.


    # The Challenges to an Integrated Metaverse


    A principal challenge to an integrated Metaverse or Multiverse is that of agreement
    between the developers and the choice, implementation, and adherence to standards.
    The metaverse industry hasn''t yet achieved a set of standards beyond relatively
    low-level technical ones such as WebXR, despite their being cross-industry standards
    work since at least the 2000s. The several “standards” initiatives currently underway
    (which is of course part of the problem!) will be discussed in Chapter 4. Even
    if agreement can be reached on the key elements, they will still need to be adopted
    by platform developers and big business as well as by enthusiasts if they are
    to make any real difference. Tied into this is the debate of open versus proprietary
    standards, which again is covered later.


    Agreement takes time, and so do changes to any agreement, so the integrated Metaverse
    may evolve more slowly than multiple disconnected, non-standard metaverses. There
    is also the risk that standardisation stifles creativity. Any standards need to
    allow developers to push the envelope as has happened on the Web, trying out new
    approaches, possibly in a private fork of the code on a private system or whilst
    maintaining adherence to the core standards and providing backward compatibility
    for users whose “metaverse browser” does not support their new features. Those
    new features that stand the test of time can be incorporated back into the standards.
    Chapter 5 will consider further challenges, particularly those related to privacy,
    surveillance, and control, all of which could be made more acute by an interconnected
    Metaverse.


    # Summary


    This chapter has shown the wide range of use cases that already exist for metaverse
    technologies, many of which have been explored and exploited for personal and
    business benefit for well over a decade. These show how beneficial metaverse technologies
    can be, and as each sector makes more use of the metaverse, their importance is
    only set to grow. The chapter has also'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'argued how implementing these applications in, at minimum, some form of linked
    metaverse where common standards and approaches are shared across platforms, and
    links made between platforms and experiences, may offer a better overall solution
    than a series of isolated virtual world, VR, or “metaverse” experiences.


    Creating a Metaverse which unifies the approach to creating and accessing virtual
    world experiences, just as the World Wide Web did for on-line content, probably
    offers the best chance to create a Metaverse which is not only democratic – enabling
    people to create and use whatever content they want – but also one which will
    also grow and survive. However, there are potential challenges of such an approach
    – to be examined in Chapter 5, and some of the possible consequences which will
    be explored in Chapter 6.


    The next chapter will look in more detail at the technologies that underpin the
    Metaverse and continue to build the argument for some form of integrated, open-standards-based
    metaverse.


