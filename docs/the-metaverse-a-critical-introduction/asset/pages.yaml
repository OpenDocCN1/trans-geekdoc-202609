- pgno: 24
  md: 'selection of avatar/account last names available, but users were free to choose
    their first name. This had the benefit of both giving SL avatars fanciful yet
    consistent names and of generating additional bonds when you found someone with
    the same surname. For the record, David is Corro Moseley (chosen partly as he
    lives in Moseley, Birmingham in the United Kingdom) and Maggi is Second Wind.


    When you first log in to the Viewer, you get to design your avatar – body shape,
    face, skin, hair, clothes, etc. This can be changed at any time, and you can store
    as many avatar looks as you want (business, party, beachwear, animal, robot, etc.).
    When you first arrive in Second Life, you are placed at a Welcome Center (Figure
    1.3). This can be a chaotic place, as newbie avatars (like you) are struggling
    to control their avatars, whilst old-pros are trying to entice you to their shop
    or bar, or potentially acting in an anti-social manner – so-called “griefers”.
    Volunteer greeters may be on hand to help you. There are some notice panels to
    explain how to move, navigate, interact, and chat, and at various times, there
    have been simple practical exercises that you need to graduate in before you move
    on. When working commercially with Second Life, developers could route their clients
    directly to private


    ![](img/a1f0838ef56b3ffb455ace32842c1458_24_0.png)


