  md: 'an egocentric way. With the right scripting tools, any virtual world or meta-verse
    environment could support such collaborative 3D data visualisations.


    Related to this is the idea of “data gardens” (Driver, 2009), which may be better
    described as information gardens – a place where you can walk around and learn
    about a topic, augment it with your own comments and research and meet other people
    to discuss it – a cross between a poster session, a peer-reviewed journal, a wiki,
    and a museum. In many ways, these are an extension of the “memory palace” model
    for improving memory (Vindanes et al., 2018) but in a shared and virtually realized
    environment. Such a space implements the egocentric model, so you remember information
    partly because of its spatial location and the journey you took to find it (and
    there could be many routes, each with its own theme). Augment that model with
    automated avatars who can not only guide you through the information but also
    share other people’s interpretation of that information, and you have a new potential
    model for the collection, sharing, communication, and development of scientific
    knowledge. Working at the “coal face” of scientific research could almost literally
    be extending that garden out into a new territory.


    # THE METAVERSE: A CRITICAL INTRODUCTION''S INFORMATION GARDEN


    A basic information garden has been produced in VR to support this book. Each
    chapter has its own area with information and links related to the book’s content.
    And since it’s a social environment, you may even meet other readers – or even
    the authors! You can access it through the series website at http://themetaverseseries.info/.


    # Warfare and the Military


    Much of the early work around HMD-VR, and on simulation more broadly, grew out
    of a need for safer and less costly ways to train military personnel. The military
    were also early adopters of CAD technology to help design new systems. Whilst
    much of this activity has been on closed systems (such as *Virtual Battle Systems*
    (VBS) mentioned in Chapter 1), the arrival of social virtual worlds encouraged
    more grass-roots activity to look at how virtual worlds could be used to support
    military activities from training (Maxwell, 2012) to understanding anti-submarine
    warfare (Aguiar & Monte, 2011). Many of these were brought together through the
    US Government’s Federal Virtual World Consortium (Harris, 2010).


    The military also has a keen interest in digital twins, both in how they can help
    in the management of military systems and in the understanding and planning of
    operations in (typically urban) locations across the globe. An early example of
    a simple digital twin was the 3D model built of Osama'
