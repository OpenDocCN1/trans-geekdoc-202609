- pgno: 26
  md: '![](img/a1f0838ef56b3ffb455ace32842c1458_26_0.png)


    # **FIGURE 1.4**

    A virtual seminar in Second Life, c.2014.


    Whilst most people tend to be in Second Life to play, certainly in the early 2000s,
    lots of people were there to work, and it’s still heavily used as a place to teach
    and learn (Figure 1.4). Second Life meetings can be held in locations that reflect
    the topic under discussion and become rich interactions through the combined use
    of voice and text chat, with people rezzing objects to help explain or explore
    issues. People naturally position themselves as they might be in a real meeting,
    standing by friends, moving closer to see things, their avatars even lolling forward
    if their owner isn’t engaged! All of which gives far more cues to remember the
    meeting than yet another screen of webcam videos.


    As you spend more time in Second Life, you’ll probably want a home. Premium accounts
    now come with a plot of land and a cookie-cutter house. If you want something
    more personal, use your Linden Dollars to buy a parcel of land (1024 m² is a good
    size to start, currently around L$ 550 depending on the location) either directly
    from Linden Lab or an estate manager (in which case, it will cost more but might
    come with a home and even condominium style rental conditions!). You can then
    terraform your land (within limits), adding a hill or pond, buy (or make) flowers
    and trees and even bird, bees, and other animals. Likewise, you can buy or build
    your house or commission an architect to build it for you. A trip to the marketplace
    can see it furnished in almost any style you can think of, and scripting means
    that things work – lights, doors,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'video screens, audio system, robot butlers, etc. Of course, you don''t actually
    *need* a house, and there is no rain or cold in *Second Life*, but users do seem
    to like that sense of a home base, somewhere to tinker and meet friends – but
    that can be as simple as a fire pit or as fanciful as a cloud in the sky if you
    want!


    With a permanent base, you can then really start to think about how you want to
    use *Second Life*. Have friends over for parties or late-night philosophical chats
    around your virtual fire? Use those newfound crafting skills to sell your own
    range of clothes or vehicles or your scripting skills to sell widgets that take
    data from the Web and display it in 3D in innovative ways. Bring students in for
    classes – in dedicated educational spaces or using *Second Life* as one huge language/anthropology/geography/sociology
    field trip. Create some incredibly new form of art that takes advantage of (essentially)
    user-controllable gravity and visibility, stunning lighting effects, and an audience
    that can fly. It may be a hackneyed phrase, but in *Second Life*, and in the Metaverse
    when it comes, the only limit is indeed your imagination.


    As with *Active Worlds*, *Second Life* is based around a map (Figure 1.5), and
    initially all the land was part of a single continent, which over time has been
    joined by other continents and thousands of island clusters. The *Second Life*
    land model is based around plots 256 m × 256 m in size (called “sims” or “regions”),
    and users can buy parcels of land as small or as large as they want. Currently
    (as of 2023), premium users (paying US$99 a year) get a land grant of 1024 m²
    (including a house) as part of their package, and full island regions cost US$349
    set up fee and US$209 monthly maintenance. However, there is no need to own land
    to enjoy *Second Life*, and basic accounts are free. Users can sublet sims, and
    many early SL businesses were effective property development and real estate management
    businesses, buying a blank sim; improving it by adding roads, parks, houses, shops,
    marinas, etc.; and then selling plots (with or without houses) to individual users.
    Initially, *Second Life* had a reputation management system, reminiscent of the
    Whuffie in *Down and Out in the Magic Kingdom* (Doctorow, 2003), so users could
    vote any avatar they met up or down based on their interactions, but this was
    abandoned relatively early on (Au, 2009).


    *Second Life* has its own currency – the Linden Dollar (L$) – which has always
    been freely exchangable with the US$ (in both directions) at a fluctuating exchange
    rate. Indeed, Au (2023) credits it with being an essential part of the rise of
    Bitcoin and the whole cryptocurrency movement. Several papers (e.g. Chambers,
    2011; Ernstberger, 2009) have been written on *Second Life*’s economic model and
    economy management, and it has never suffered from the speculation associated
    with cryptocurrencies. Castronova’s original 2002'
  merge: -1
