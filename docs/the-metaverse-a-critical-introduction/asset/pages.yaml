- pgno: 63
  md: '# 2


    # What Is the Metaverse?


    # Introduction


    There are a lot of different ways in which developers (and users and authors)
    are interpreting the word “metaverse”. This chapter examines some of the current
    definitions, as well as considering how the “3D Internet” and Web3 concepts relate
    to the Metaverse. Whilst simple definitions of the metaverse may be useful for
    marketing, they can hinder a deeper exploration of what a Metaverse might actually
    be, and what its implications are, so the chapter instead presents 10 axioms in
    order to define the Metaverse – considering the Metaverse in terms of its most
    complete and developed form. The chapter illustrates how some current platforms
    measure up against the axioms and examines Second Life’s standing (and that of
    OpenSim) as the most complete current model of a Metaverse. In the second part
    of the chapter, the focus shifts to explaining what it is that is notably different
    about the virtual reality (VR) experience in psychological terms, and how this
    gives additional power to the metaverse concept.


    # Competing Views of the Metaverse


    As noted in the Introduction, one of the issues about discussing the metaverse
    is that there is no real agreement as to what it is. Table 2.1 presents several
    recent definitions and descriptions of the metaverse.

    Figure 2.1 represents these definitions as a word cloud. About the only word common
    to most of the definitions is “virtual”. The idea that the metaverse will actually
    be a multiverse – a network of metaversal spaces – is echoed in almost half of
    them. The linkage between the virtual world and the physical world is emphasised
    by Hackl, the International Telecommunications Union (ITU), and Narula. Interestingly,
    it’s both Hackl and the ITU that get down into the technicalities including concepts
    such as blockchain, 5G, and digital twins. Several take the “next generation of
    the Internet” approach that will be challenged below.'
  merge: -1
  img_proc: true
