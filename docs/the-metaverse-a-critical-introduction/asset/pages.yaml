- pgno: 170
  md: '# Privacy versus Surveillance


    A linked consideration is that metaverse technologies provide significant opportunities
    for their operators, and potentially any controlling nation-state, to enact almost
    total surveillance on their users/citizens. Monitoring the game servers would
    allow the total monitoring of every user in a way that a combination of phone
    and CCTV surveillance could never hope to achieve in the physical world. The Snowden
    Papers revealed how Western intelligence agencies had console monitoring operations
    and plans for virtual world data collection back in 2008 (NSA, 2008), and Chapter
    3 has described the potential issues around “fingerprinting” users and capturing
    their biometric data through their headset-mounted VR display (HMD-VR) use, and
    identifying emotional triggers, all of which could be exploited with hostile,
    or manipulative, intent (Rosenberg, 2022).


    The Metaverse needs to ensure that user privacy is at least as good as that in
    the physical and cyber worlds. Whilst there are features that can improve the
    perceived privacy of the user (e.g. area access controls, zone of audio silence),
    these do not ensure absolute privacy from the platform operator or any malefasant
    agent. Greater decentralisation, explainable artificial intelligence (AI), blockchain,
    global regulation, and more use of open source have all been proposed to help
    address privacy concerns (Fernandez & Hui, 2022; Sandeepa, n.d.), as well as considering
    the issues through a human rights lens (Heller, 2020).


    # Accessibility


    If the Metaverse is to open up a wide range of possibilities across almost the
    whole gamut of a person’s life, then it is vital that everyone, regardless of
    ability or disability, can participate in it to the same degree. A useful overview
    of the opportunities that virtual worlds and the Metaverse provide for disabled
    people is provided by Stendal et al. (2011). Stendal (2012) also provides a more
    detailed literature review and highlights the (then, and probably still current)
    lack of research in the area of virtual worlds for people with disabilities.


    There are already lots of examples of disabled people using virtual spaces as
    a way of communicating, celebrating, or overcoming their disability. David remembers
    helping the BBC interview disability activist and virtual world entrepreneur Simon
    Stevens in Second Life, and the interviewer was taken aback both by the fact that
    Simon was still in a wheelchair and wearing a protective helmet in Second Life
    – when neither were obviously necessary, and by the fact that he was then trampolining
    and skydiving in said wheelchair! Simon has been interviewed by many others (e.g.
    Headstar, 2012;'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Mollman, n.d.), and it is clear that there is not the simple *Avatar* film
    style “virtual worlds let you walk again” experience for those with disabilities,
    but rather it gives everyone new ways to express who they are and what they want
    to do.


    One study using *Second Life* found that disabled users who used a virtual world
    showed “significantly improved on measures of affective states (depression, anxiety,
    positive emotion, life satisfaction, and feelings of loneliness) and self-evaluation
    (self-esteem)” (Gilbert et al., 2013). Another study of disabled users, using
    the *Gather.Town* 2D virtual world (2020, https://www.gather.town/), found that
    “participants’ interpersonal relationships, problem-solving abilities in the workplace,
    and online interview skills were significantly improved” through training inside
    of the virtual world (Lee et al., 2023).


    Disabled users will always be making a conscious decision as to whether they reveal
    their disabilities to fellow users or not – as in the case of *World of Warcraft*
    players studied by Lim and Nardi (2011) and *Second Life* users studied by Stendal
    et al. (2012). A study by Smith (2010) identifies disabled virtual world users
    as having two different motivations:


    +   • augmentationists – who see the virtual world as a way of extending their
    physical world existences – and who may have avatars that embrace their physical
    selves; and

    +   • immersionists – who see the virtual world as a distinct and alternative
    parallel to their existence in the physical world.


    Of course, motivations may be very context dependent, and any metaverse should
    support users in exploring either mode at any time.


    In order to be usable, particularly for those with motor control issues, the user
    interfaces for the Metaverse need to be designed with a high level of accessibility
    in mind – not all users can manage the fine movements required to control an avatar,
    or feel comfortable wearing a VR headset. The biggest challenge for the visual
    metaverse is of course for those with visual impairments, and it’s one of the
    reasons that the axioms of the Metaverse in Chapter 2 try to avoid talking about
    a “visual” experience. It is certainly a spatial experience, and the interface
    needs to be designed to cope with blind and partially sighted users as well as
    those with good sight. As far back as 2009, a virtual guide dog was being developed
    in *Second Life*, which could help its owners navigate and identify objects and
    people (Anderson, 2009). The same audio guide technology being deployed in the
    physical world to help visually impaired people (e.g. Parker et al., 2021) could
    be applied to virtual worlds to help them navigate, typically through audio or
    haptic assistance. In addition to using voice, games developed or adapted for
    blind users such as *Shades of Doom*, *AudioQuake*, and *Terraformers* have also
    used sonar style “blips”, directional timbres, and musical “earcons” to help create
    a rich soundscape for visually impaired users to interact with (Folmer, 2018).'
