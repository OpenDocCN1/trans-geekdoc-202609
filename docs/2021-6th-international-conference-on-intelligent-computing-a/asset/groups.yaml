    kernel, can be used.


    ```

    Linear kernel: $k(x_i,x_j) = x_i^T x_j$

    ```


    ```

    Polynomial kernel function: $k(x_i,x_j) = (x_i^T x_j)^d$

    ```


    Radial basis kernel:


    ```

    $k(x_i,x_j) = \exp(-\frac{||x_i-x_j||^2}{2\sigma^2})$

    ```


    Laplace kernel:


    ```

    $k(x_i,x_j) = \exp(-\frac{||x_i-x_j||}{\sigma})$

    ```


    Considering that the parameters of the kernel function can affect the complexity
    of the model and the modeling results, this paper adopts the basic kernel function
    and the Gauss kernel function, which has fewer parameters and can better solve
    nonlinear problems, as the kernel of the support vector.


    ## II. VECTOR REGRESSION AND MULTIPLE KERNEL LEARNING METHODS


    ### A. The basic idea of support vector regression


    Vapnik et al. introduced the ε-insensitive loss function, and proposed a method
    using the support vector machine to solve the prediction time series, by the regression
    problem. This method is called Support Vector Regression (SVR). The multi-dimensional
    linear regression model calculates the loss based on the difference between the
    predicted value (f) of all the input data and the experimental value (y). One
    of the main features of SVR is that it minimizes the error bound, which is the
    difference between y and f(x) which is greater than.


    ### B. Principle of Kernel Function


    If there is a vector regression model, where x and f represent input data and
    output data, the result can be expressed as a linear combination of kernel functions
    $K(x, x_i)$, where $K_i$ is kernel. The kernel function maps the input vector
    x to a high-dimensional feature space, making the non-linear mapping linearly
    inseparable into a linearly separable space, and uses a new learning method to
    solve the original regression problem. The nonlinear mapping is expressed as follows:


    ```

    $x \to \phi(x)$

    ```


    The kernel function maps the input data to a new feature space, and the original
    data is transformed into:


    ```

    $(\phi(x), y_1), (\phi(x), y_2), \dots, (\phi(x), y_j)$

    ```


    Due to the learning method of support vector regression, it can be expressed as
    a linear combination of the input and prediction samples in the high-dimensional
    feature space. The kernel function combines nonlinear mapping and inner product
    calculation for.


    ### C. Basic of multiple kernel learning


    The multiple kernel learning replaces a single kernel by combination of multiple
    kernels. The multiple kernel function more flexible. The use of multiple function
    instead of single kernel function can enhance the interpretability of the decision
    function, and obtain better performance than single kernel function or model kernel
    combination model [1] [3].


    The basic method of constructing a basic kernel model is to select a set of basic
    functions, optimizes the convex combination of them, and then solve it.


    When using a set of kernel functions to construct a kernel model it is necessary
    to solve the problem of classification or regression of the original input data
    in the feature space, and the problem of basic kernel weight coefficients in model
    learning. With the continuous development of multiple kernel learning, each of
    the input sample can select the optimal kernel function significantly improves
    the accuracy of the model or the prediction accuracy.


    In multiple kernel learning, how to construct a kernel method that can solve practical
    applications by adjust parameters is a research hotspot in field. Analyze the
    mapping and application scenario of each kernel and then various kernel functions
    to make the model get better generalization and regression capacities.


    ### D. Multiple kernel method and simple multi-kernel


    The basic principle of the multi-kernel method is to find a set of kernels with
    multi-scale expression capabilities, and to fuse their functions. This is more
    flexible than the synthetic kernel, and as the scale of the input data increases,
    the multiple kernel method can provide a more complete selections from the synthetic
    kernel. With the multi-kernel method, the multi-kernel method gradually gains
    more theoretical basis. At present, the multi-kernel method has been used in various
    fields. For example, the classification method of the original support machine
    [12]; the multi-scale support vector regression method can be used to solve the
    underfitting problem of sample classification. The multi-scale kernel with support
    regression, the multi-kernel method demonstrates its excellent performance in
    spot detection and pattern recognition. In development, the multi-kernel method
    has been further promoted and applied.


    Due to its significance and approximation capacities, Gaussian kernels are commonly
    used in image to construct the scale of images and interact features. In the multi-kernel
    method, the gaussian function is widely used. The expression of the gaussian function
