    ## C. Experimental process establishment


    For the geological features that have been extracted, multiple kernel learning
    can be used as a regression method to predict the features. After the kernel learning
    training is completed, the well observation data can be the metric value of the
    model. The error of the model results on the target can be used to optimize parameters
    in the multiple kernel learning process.


    Multiple kernel learning has a higher degree of freedom in selecting input features.
    The X and Y coordinates are associated with a kernel as an input feature, all
    input features correspond to other kernel features. The multiple kernel learning
    formula corresponds to the model is shown below:


    ```

    $K(\tilde{x},\tilde{y}) = \mathbf{d} \cdot \mathbf{d} + e^{-\frac{(\tilde{x}-\tilde{y})^2}{2\sigma_1^2}}
    + \sum_{m=1}^{M} w_m e^{-\frac{(\tilde{x}-\tilde{y})^2}{2\sigma_m^2}}$

    ```


    With the parameters $a_i$ on the X, Y coordinates ($x_1$ and $x_2$), all input
    features correspond to other kernel features. The multiple kernel learning is
    automatically updated by the MKL rule. They are used to find a measure of porosity
    at the well.


    With the multi-scale kernel method, when the input data is not uniformly distributed
    or the model has a multi-scale structure the constant value makes the model fitting
    more flexible, making the multi-scale kernel has a wide range of applications.


    After determining the synthetic kernel learning method, the next problem is to
    optimize the parameters of the synthetic kernel. Usually, the synthetic kernel
    is combined with the support vector method to project the objectives into different
    optimization problems for solving, such as Boosting, semi-definite programming,
    quadratic programming and other methods. In order to quickly obtain the optimal
    weights, these algorithms have been effectively solved the multiple kernel learning
    process.


    This paper uses a multi-scale kernel learning algorithm [10], which is a two-optimization
    method. The first layer optimizes the weight of the multiple kernel function,
    and the second layer solves the problem of support vector regression. In the weight
    space, gradient descent can be used


