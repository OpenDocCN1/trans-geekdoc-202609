    is to obtain correlations between data to improve system performance. Machine
    learning focuses on how to extract hidden information from data, then produce
    a model or algorithm that can find this hidden information. Machine learning algorithms
    include such as support machines, decision trees, and Bayes classifiers.


    The goal of machine learning is to obtain a model based on the training data and
