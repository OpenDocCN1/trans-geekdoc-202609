    # C. Basic of multiple kernel learning


    The multiple kernel learning replaces a single

    kernel by combination of multiple kernels. The

    multiple kernel function more flexible. The use of

    multiple function instead of single kernel function can

    en the interpretability of the decision function, and obtain

    better performance than single kernel function or model

    kernel combination model [1] [3]


    The basic method of constructing a basic kernel model is

    to select a set of basic functions, optimizes the convex

    combination of them, and then solve it.


    When using a set of kernel functions to construct a

    kernel model it is necessary to solve the problem of

    classification or regression of the original input data in

    the feature space, and the problem of basic kernel

    weight coefficients in model learning. With the continuous

    development of multiple kernel learning, each of the

    input sample can select the optimal kernel

    function significantly improves the accuracy of the

    model or the prediction accuracy.


    In multiple kernel learning, how to construct a

    kernel method that can solve practical applications by

    adjust parameters is a research hotspot in field. Analyze the

    mapping and application scenario of each kernel

    and then various kernel functions to make the

    model get better generalization and regression capacities.


    # D. Multiple kernel method and simple multi-kernel


