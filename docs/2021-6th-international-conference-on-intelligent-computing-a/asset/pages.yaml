    # IV. CONCLUSIONS


    This paper discuss how to extract features of seismic data from petroleum exploration
    and reveals the reservoir geological information in implicit attributes. The use
    of multiple kernel learning can effectively utilize geological features and map
    them to reservoir models to integrate nonlinear or heterogeneous information in
    different scale spaces. For the prediction of porosity, multiple kernel learning
    is used to refine the correlation of the data from the geological features, combined
    with the porosity value of the target well in the logging data to predict the
    physical parameters of the reservoir.'
