  md: '# A Comprehensive Review of the Use of Deep Learning Algorithms in Diabetes
    Mellitus Detection and Diagnosis


    Katarzyna Wiltos


    # 8.1 INTRODUCTION


    Diabetes is a persistent metabolic disease that hinders the body’s ability to
    produce insulin in the pancreas causing abnormal glucose levels in the blood (hyperglycemia).
    As blood glucose levels remain high, the blood vessels become affected and eventually
    damaged. Insulin is crucial for the proper metabolism of fat and protein [1].
    If left untreated, the insufficient level of insulin can consistently lead to
    serious health complications such as heart disease, obesity, stroke, kidney failure,
    foot-related complications, vision impairment, nerve damage, or cognitive problems
    [2]. The complexity of the disease is noticeable through the amount of different
    types of diabetes with the most common ones being type 1, type 2, and gestational
    diabetes [3]. Type 1 diabetes is an autoimmune disease, caused'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'by one''s immune system destroying cells responsible for producing insulin
    (pancreatic β-cells) [4]. Type 2 diabetes, which constitutes over 90% of all diabetes
    worldwide [1], is not an autoimmune disease, but a condition where the body produces
    insulin while not using it properly or its levels are insufficient [5]. Gestational
    diabetes develops during the second or third trimester of pregnancy and usually
    resolves after delivery [6].


    Nonetheless, the occurrence of gestational diabetes increases the risk of developing
    type 2 diabetes later in life [1].


    As the number of affected people is high and is continually rising worldwide,
    the research area of detecting diabetes mellitus at its early stages holds great
    importance [7]. Thus, it is essential to provide a comprehensive review of optimal
    techniques and identify the latest top-performing approaches. The following sections
    will concern the most recent deep learning approaches in diabetes mellitus detection
    and their possible practical applications in the healthcare system. It is estimated
    that around 537 million adults aged 20–70 years are living with the disease. This
    number is expected to rise further to 643 million (11.3%) by 2030 and to 783 million
    (12.2%) by 2045. Additionally, around 240 million people are believed to be living
    undiagnosed without any medical treatment applied [1] (Figure 8.1).


    Development and ongoing enhancement of possible treatment options, along with
    early detection of diabetes mellitus, are crucial for minimizing the impact of
    the disease on the health and quality of life of chronically ill


    ![](img/7df621e14c1a5d96077d3e56e3977008_120_0.png)


    FIGURE 8.1 A graph presenting countries with the highest prevalence of diabetes
    mellitus in millions for 2021 and predictions for 2045. (The data used to create
    this *figure were obtained from the table in Ref. [1]. The data were processed
    and visualized by the author.)'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'patients [8]. Early detection is vital for ensuring as little health destruction
    as possible and preventing the disease from causing further harm to the body,
    ultimately contributing to patients’ health-related life satisfaction [9]. Improvement
    of diagnosis methods is critical as it is estimated that up to one-half of type
    2 diabetes remains undiagnosed causing many irreversible long-term health impairments,
    severe disabilities, and even death [1]. The diagnosis procedure is usually based
    on testing blood glucose levels. According to the World Health Organization (WHO),
    a fasting blood glucose level equal to or exceeding 126 mg/dL (hyperglycemia)
    indicates diabetes [10]. However, deep learning algorithms simultaneously consider
    more insightful data such as medical records, weight, age, heart rate variability,
    genetics, retinal images, physic index, pulse rate [11], or electrocardiogram
    information [12]. This approach allows succinctly precise diagnosis and may serve
    as an independent decision tool or assist greatly in human review. These algorithms
    can analyze large amounts of complex data and can identify more subtle relations
    between data features providing more in-depth results [13].


    # 8.2 RECENT ADVANCES IN DIAGNOSTIC METHODS


    Artificial intelligence techniques not only allow for effective early detection
    of new-onset cases but also serve as a robust process of therapeutic monitoring
    of the disease in real time [6]. Among these methods, deep learning techniques
    have the potential to significantly advance the field of diabetes detection, prediction,
    and management by providing more robust and efficient methods for identifying
    patients at risk and enabling the development of more personalized treatment plans.
    Implementing these methods in practice is beneficial for the diagnosis process,
    as massive and complex datasets can be analyzed more effectively than with traditional
    machine learning approaches. Deep learning methods can provide more precise results
    as they are capable of identifying patterns not evident to human review. Another
    advantage is the ability to work with unstructured and incomplete data [14]. These
    methods are more flexible and agile, allowing for a more comprehensive approach
    to real-world data [15]. Deep learning algorithms, especially neural networks,
    such as RNNs, CNNs, and LSTMs, can effectively process temporal data, including
    signal data from wearable devices. By utilizing the following methods appropriately,
    deep learning could help automate the detection of diabetes, leading to more effective
    diagnostics and management of the disease.'
