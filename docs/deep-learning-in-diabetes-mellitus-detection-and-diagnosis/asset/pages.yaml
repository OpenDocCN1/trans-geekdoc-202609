    # ## 7.1 INTRODUCTION


    The number of people with diabetes mellitus (DM) is high in developing countries
    like India owing to an increase in obesity and unhealthy lifestyles [1]. Type
    2-DM can lead to microvascular and macrovascular problems. Recently, in India,
    these multiple organ problems have lead to an unconditional probability of death
    at an young age [1]. Type 2-DM is one of the most challenging threats to the Indian
    health care systems. The international diabetes federation estimated 74.9 million
    people with DM in 2021 with an expected projection of 124.9 million people with
    DM in 2045 [2]. According to the World Health Organization (WHO), people with
    age (≥45 and seldom exercising), body mass index (≥24 kg/m²), impaired glucose
    tolerance or impaired fasting glucose, family history of DM, lower high-density
    lipoprotein cholesterol or hypertriglyceridemia, hypertension, or cardiovascular
    disease and gestation female (age ≥30) are at a high risk of DM [3]. The targets
    set by the WHO to achieve in the year 2030 are:'
  merge: -1
  img_proc: true
