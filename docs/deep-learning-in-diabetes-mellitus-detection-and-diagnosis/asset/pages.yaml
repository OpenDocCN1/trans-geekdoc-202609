    # 7.2 RELATED WORK


    In recent years, the field of AI and ML has played a vital role to detect the
    likelihood of type-2 DM disease. Many algorithms and tools have been developed
    showing the incredible potential of this research domain. We limit our review
    to recent findings which are closely related to the issue presented. Neural network-based
    prediction shows improvement in prediction accuracy recently in DM research. In
    Ref. [6], authors utilized min-max normalization and autoencoder to resolve data
    normalization, imbalance in dataset, and feature augmentation. Multilayer perceptron
    was used for classification to achieve a 92.31% accuracy [6]. In Ref. [5], authors
    designed a classifier based on artificial backpropagation scaled conjugate gradient
    neural network with 93% accuracy without data pre-processing. An improved neural
    network-based method was reported in Ref. [18] using k-nearest neighbour to achieve
    an F1-score of 98%. Authors of Ref. [19] applied Pearson correlation and median
    value imputation for feature selection. Their deep neural network model achieved
    88.6% accuracy [18].


    The ML classification model yielded good prediction accuracies when compared to
    neural network-based methods. In Ref. [20], authors evaluated different ML classifiers:
    light gradient boosting machine (LGBM), linear regression (LR), and support vector
    machines (SVMs) with LGBM outperforming other models with an accuracy of 86%.
    In Ref. [18], classification accuracies of ML algorithms decision tree (DT), random
    forest (RF), naïve bayes (NB), k-nearest neighbour (KNN), and adaptive boosting
    (AB) were compared. Authors of Ref. [7] developed a deep neural network model
    with an accuracy of 98.07%. In Ref. [21], feature selection methods'
