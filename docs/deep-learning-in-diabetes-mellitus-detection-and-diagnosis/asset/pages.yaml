    \ (ii) **Pre-trained model**: A pre-trained model (M) trained on the source task,\
    \ represented by a function ($f_M$) with parameters ($\theta_M$); (iii) **Target\
    \ task**: A labeled dataset (T) for the target task, with input features (x) and\
    \ target labels (y); (iv) **Fine-tuning**: The pre-trained model (M) is fine-tuned\
    \ on the target task (T) by updating its parameters ($\theta_M$) to adapt to the\
    \ new task. The fine-tuned model is denoted as ($f_t$) with updated parameters\
    \ ($\theta_T$); (v) **Feature extraction**: Input features (x) from the source\
