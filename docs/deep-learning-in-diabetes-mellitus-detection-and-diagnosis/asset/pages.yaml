    The clinical detection of type 2-DM uses a fasting plasma glucose level greater
    than threshold. This glycaemic threshold levels may vary according to people belonging
    to a particular region because of the different glycaemic risk levels. Despite
    these difficulties, a decision support system for detecting type 2-DM is the need
    of the hour to reach a meaningful decision at a possible early stage. These constraints
    kindle the need for a simplified diagnostic process to detect type 2-DM.


    With the latest technological development and the impact of artificial intelligence
    (AI) in every day activities, development of machine learning (ML) algorithms
    helps in making a quick decision support system in type 2-DM detection. Several
    neural network-based algorithms [5], deep neural networks [6,7], and conventional
    ML models [8–17] are used in the research of type 2-DM detection.


    Considering the challenges and accuracy rate in type 2-DM detection available
    in the literature and the usage of modern AI tools, there is vital need for a
    new improved model. Hence, in this chapter, we propose a robust deep learning
    model (DLM) for type 2-DM detection to create an efficient decision support system.
    The chapter''s contributions can be outlined as follows:


    +   1. We propose a simple DLM for type 2-DM detection. We also explore the ML
    algorithm with Bayesian optimization for hyperparameter tuning. A comparison is
    made in terms of performance metrics for the algorithms considered.

    +   2. The model undergoes training using a dataset from Germany hospital dataset
    and is subsequently tested with PIMA Indian diabetes'
