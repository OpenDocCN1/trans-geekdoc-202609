  md: '# ## 2.2.5 Model Architecture


    The chosen deep learning model follows a sequential architecture using Keras library
    comprising of an input layer, two hidden layers, and an output layer. The input
    layer has 64 neurons with an input dimension of 24 corresponding to the selected
    features, while the hidden layers use rectified linear unit (ReLU) activation
    functions to introduce non-linearity into the model. Two additional hidden layers
    are added to the model. The first hidden layer has 32 neurons, and the second
    hidden layer has 20 neurons with ReLU activation to help the model learn complex
    patterns and relationships within the data. A final sigmoid activation function
    with one neuron in the output layer produces a binary classification output, indicating
    the likelihood of the presence of diabetes (Figure 2.3).


    # ## 2.2.6 Model Compilation and Training


    In Keras is the process of preparing the model for training. The compilation includes
    the definition of several important parameters.


    ![](img/7df621e14c1a5d96077d3e56e3977008_43_0.png)


    FIGURE 2.3 DL model architecture.'
