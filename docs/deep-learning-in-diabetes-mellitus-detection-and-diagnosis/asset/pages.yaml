    # 12.3 RELATED WORK


    Several studies on the subject of automatically detecting DR have been published
    in various literature. Based on the methods employed, automatic DR detection can
    be roughly divided into two groups. The first person to use deep learning-based
    DR detection relies on automated feature extraction, as opposed to typical machine
    learning algorithms that require the use of methods for external feature extraction
    using image processing (Table 12.2).


    # 12.4 DATASET DESCRIPTION


    This dataset [34] contains 757 fundus images and was obtained at the Department
    of Ophthalmology in Paraguay (Table 12.3).


