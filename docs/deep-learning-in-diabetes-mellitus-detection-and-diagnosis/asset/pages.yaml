    # ### 9.2.3 Review Results


    Following a rigorous selection process to ensure relevance to the study objectives,
    the initial pool of articles is narrowed down to 41 papers. The selection process
    involves screening for relevance based on title, abstract, and full-text examination.
    The final set of articles represents a comprehensive review of the current literature
    on diabetes detection and prediction using machine learning (ML) and DL approaches.


    # ### 9.2.4 Study Analysis


    After the title and abstract were reviewed, the articles were removed, out of
    a total of 80, for a variety of reasons.


    The following factors led to the articles’ exclusion:


    +   i. Text accessibility is lacking.

    +   ii. Lack of DL or ML models.

    +   iii. Exclusive attention to abstract ideas.

    +   iv. Examine scholarly works.

    +   v. Just posters or abstracts.


    # ### 9.2.5 Dataset


    In the domain of DM detection and prediction, various datasets serve as the foundation
    for developing and evaluating ML and DL models. These datasets encompass diverse
    parameters and modalities adapted to the individual objectives of each study.
    For instance, the Pima Indian Diabetes Database (PIDD) is frequently utilized.
    Other datasets include photoplethysmography signals for hypertension risk stratification,
    foot thermography images, and DNA sequences for DL-based diagnosis. Additionally,
    datasets sourced from preventive healthcare examinations, retinal images, electrocardiogram
    (ECG) signals, and clinical registries further contribute to the multifaceted
    landscape of diabetes detection and prediction research. These datasets provide
    researchers with invaluable resources for training and evaluating predictive models,
    paving the way for advancements in diabetes management and early intervention
    strategies.'
