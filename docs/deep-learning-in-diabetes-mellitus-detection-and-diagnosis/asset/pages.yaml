    # 3.2.3 Ethics


    The OhioT1DM dataset is available to researchers solely for research purposes
    (Marling and Bunescu, 2020). Consequently, no further ethics approvals are necessary
    to access the OhioT1DM’18 and OhioT1DM’20 datasets.


    # 3.2.4 Proposed Method


    In this study, we introduce a novel neural network model known as “GAM”, which
    is enhanced by FL. Figure 3.1 illustrates that GAM incorporates a GRU, as detailed
    in Cho et al. (2014), and a GAT, as described in Velickovic et al. (2018). GAT
    is utilized to effectively capture the patterns among different factors in a RMTS,
    created from an irregular multivariate time series (IMTS) via zero padding. Each
    non-zero attribute value is treated as a dynamic graph node, transformed into
    a tensor through fully connected layers, thus forming graph embeddings. Graph
    features are extracted at each time slot through graph convolutions applied to
    these embeddings, using an adjacency matrix. These features are then temporally
    integrated by the GRU to produce a concise vector of temporal graph features,
    which is subsequently employed in predicting BG levels.


    Specifically, the formation of $\hat{y}_{T+W}=GAM(X; \theta)$ can be represented
    as follows:

    \(e_t^n = f_n(x_t^n)\) (3.1)'
