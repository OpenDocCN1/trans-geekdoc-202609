    # 5.2 PROBLEM IDENTIFICATION AND ANALYSIS


    DR can lead to the destruction of blood vessels in the light-sensitive tissue
    in the back of the eye [3]. Excessive blood sugar levels cause the eye’s tiny
    blood vessels to get blocked, restricting blood flow. As a reaction, the eye tries
    to create new blood vessels. Non-proliferative DR, or early DR, is characterized
    by the absence of new blood vessel development but the thinning of existing blood
    vessel walls, which results in exudates from blood and fluid seeps into the retina
    periodically and tiny bulges emerging from vessel walls. The larger vessels begin
    to grow, resulting in an uneven vessel diameter. The blood artery becomes narrower
    as the retina enlarges and clogs it as the disorder worsens. Glaucoma and retinal
    detachment may eventually result from scar tissue creation and leakage from these
    new blood vessels in the eye.


    Figure 5.1 depicts examples of various DR conditions [4]. Therefore, DR diagnosis
    needs to recognize these exudates, scarring, and abnormal blood vessels. As shown
    in Figure 5.2, a typical manual diagnosis takes 7–14 days


