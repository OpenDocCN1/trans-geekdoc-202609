  md: '![](img/7df621e14c1a5d96077d3e56e3977008_55_0.png)


    # FIGURE 3.1 Graph attention memory (GAM).


    ```

    $$\mathbf{E}_t = \left[ \mathbf{e}^1_t \cdots \mathbf{e}^n_t \cdots \mathbf{e}^N_t
    \right] \tag{3.2}$$


    $$\mathbf{G}_t = \text{GATs}(\mathbf{E}_t, \mathbf{A}), \tag{3.3}$$


    $$\mathbf{h}_t = \text{GRU}(\phi(\mathbf{G}_t), \mathbf{h}_{t-1}), \tag{3.4}$$


    $$\hat{y}_{T+W} = f_{\text{out}}(\mathbf{h}_T). \tag{3.5}$$

    ```


    Let $T$ be defined as the set $\{1,\dots, t,\dots, T\}$ and $N$ be defined as
    the set $\{1,\dots, n,\dots, N\}$. Let $x_t^n$ denote the element located in the
    $t$-th column and $n$-th row of matrix $\mathbf{X}$, where $\mathbf{X}$ belongs
    to the set of matrices with dimensions $R^{N \times T}$. The functions $f(\cdot)$
    represent neural network layers. $\mathbf{A}$ is a graph adjacency matrix ($R^{N
    \times N}$). The hidden state of a GRU is $\mathbf{h}_p$, and $\mathbf{h}_0$ is
    initialized with zeros. The estimated value of $y_{T+W}$ is $\hat{y}_{T+W}$.


    In Equation (3.1), each non-zero item $x_t^n$ of the matrix $\mathbf{X}$, which
    is part of the RMTS, undergoes individual embedding via $f_n(\cdot)$, with each
    factor $n \in N$ having its corresponding $f_n(\cdot)$. This tensor produces $\mathbf{e}_t^n
    \in R^E$, representing $x_t^n$, and is aggregated into $\mathbf{E}_t$, as shown
    in Equation (3.2). Subsequently, as illustrated in Equation (3.3), GATs are employed
    to perform graph convolutions on $\mathbf{E}_t$ using the adjacency matrix $\mathbf{A}$.
    Following the graph convolutions, $\mathbf{G}_t \in R^{E \times N}$ is produced,
    encapsulating the interrelations among all attributes. Afterward, $\mathbf{G}_t$
    is transformed into a tensor using the function $\phi(\cdot)$, resulting in $\phi(\mathbf{G}_t)$.
    Subsequently, $\{\phi(\mathbf{G}_1), \dots, \phi(\mathbf{G}_t)\}$ are aggregated
    by'
