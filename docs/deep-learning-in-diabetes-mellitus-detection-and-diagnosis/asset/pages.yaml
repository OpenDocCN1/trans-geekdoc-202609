    In Ref. [23], Rahman et al. implemented a Conv-LSTM-based model and a cross-validation
    Conv-LSTM model, achieving 91.38% accuracy and 97.26% accuracy, respectively.
    These methods were tested on a widely used PID database. The authors employed
    the Conv-LSTM, which has not been done earlier. Additionally, to filter out the
    most important features, a random forest-based Boruta method was applied. This
    algorithm selects only the most relevant features for later analysis, namely glucose,
    BMI value, blood pressure, insulin level, and age, while ignoring the rest of
    the features as those with low significance for the process of classification.


    In Ref. [24], a fuzzy rule-based model mixed with the cosine amplitude method
    was introduced. Aamir et al. implemented and tested these fuzzy approaches on
    the PID database with 768 records, including data about healthy patients and those
    affected with diabetes disease. In the evaluation of the presented algorithms,
    the best one achieved 96.47% accuracy, indicating good prospects for high effectiveness.


    In Ref. [25], Kim et al. proposed a robust method consisting of both unsupervised
    and supervised learning components, that is, fuzzy C-means clustering and a fuzzy
    min-max neural network learner, respectively. The authors proved their model to
    outperform the previously known approaches with the detached implementation of
    these algorithms. In the evaluation of a popular PID database, it achieved 80.96%
    accuracy. For managing the presence of missing values, researchers used the “fill-in-the-average”
    mechanism. The highest prevalence of missing values was noticeable for diastolic
    blood pressure (35), triceps skin fold thickness (221), and 2-hour serum insulin
    (375) features.


