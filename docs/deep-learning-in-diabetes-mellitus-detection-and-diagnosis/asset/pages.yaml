- pgno: 57
  md: '# 3.2.5 Metrics


    We consider three metrics in this work. RMSE is employed to thoroughly assess
    model performance, guiding the selection of optimal trainable parameters and attribute
    combinations. Besides, mean absolute relative difference (MARD) is also considered,
    making it ideal for evaluating predictions of lesser magnitudes. Moreover, mean
    absolute error (MAE) is used for an easy comparison with other models, especially
    since MAE is a standard metric used by all entries in the Ohio 2020 challenge.


    # 3.3 EXPERIMENTS AND RESULTS


    # 3.3.1 Impact of Attributes


    To effectively leverage various attributes in the OhioT1DM dataset and experimental
    resources, we experimented with a select number of attribute combinations. Interestingly,
    we discovered that employing six specific attributes, including “glucose level”,
    “bolus”, “meal”, “sleep”, “exercise”, and “finger stick”, consistently yields
    noticeable improvements in most scenarios.


    Therefore, our initial experiment aimed to determine the positive influence of
    each of these six attributes on RMTS-BGLP. In this experiment, we systematically
    excluded one attribute at a time (apart from “glucose level”) from the set of
    six attributes. We then compared the performance of GAM utilizing all six attributes
    against the performance of GRU using only BG. Next, if GAM with these six attributes
    outperforms the others, it indicates that each attribute contributes positively
    to RMTS-BGLP. Conversely, if GRU with only BG shows the least favorable outcomes,
    it suggests that the combination of these six attributes is effective. The results
    of this experiment are detailed in Tables 3.2 and 3.3.


    Additionally, we aim to explain our decision to exclude certain attributes. To
    do this, we tested the inclusion of one additional attribute at a time to the
    existing set of six attributes. We then compared the results to the performance
    of GAM with just the original six attributes. If the addition of a new attribute
    does not lead to improvements over the GAM containing the six factors in most
    scenarios, we opted not to include other factors (see Tables 3.4 and 3.5).


    In general, when the prediction window W is set to 6, the “GAM+6 attributes” model
    demonstrates superior performance in terms of both RMSE and MARD across various
    settings. The mean RMSE for “GAM+6 attributes” is 18.91 mg/dL (W=6), outperforming
    other models whose'
