    \ is denoted as ($h'$) with parameters ($\theta'$); (vii) **Classification layer**:\
    \ A final layer predicts the target label (y) for the target task, mapping the\
    \ output of the additional layers (h') to the target label ($y'$) with parameters\
    \ ($\theta''$); (viii) **Fine-tuning process**: Parameters ($\theta_M$, $\theta'$,\
