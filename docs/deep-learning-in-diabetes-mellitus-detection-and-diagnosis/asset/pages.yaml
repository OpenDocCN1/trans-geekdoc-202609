    cutting-edge data, such as genetic information. This can lead to more accurate
    predictions and less human input in the prognosis of different outcomes of diabetes
    mellitus. It is mentioned that standard clinical data relates to information that
    our body produces as a result of a normal physiological process. This includes
    signs, symptoms, and laboratory measurements. On the contrary, genetic data refers
    to information about the cause of diseases that lie in our DNA (Serda et al.,
    2013). However, data of different types also have their complexity and this requires
    the use of big data technologies such as Hadoop and MapReduce for data storage
    and processing, as well as knowledge of parallel processing algorithms to exploit
    the capability of these frameworks.


    Traditionally, healthcare professionals have used regression models to identify
    prognostic factors and create risk scores for different outcomes of diabetes mellitus.
    However, these models rely heavily on clinicians to use various tests to approximate
    the values of different prognostic factors and reach a final diagnosis. Also,
    these models usually assume that the effect of a certain prognostic factor is
    the same for all given values of other factors, which may often not hold in reality
    given the complexity of diabetes mellitus and its natural history (Khan et al.,
    2019; Olisah et al., 2022).


    Deep learning, a subset of artificial intelligence (AI), has shown substantial
    promise in the medical field, particularly in prognosis. Deep learning algorithms
    are based on the concept of neural networks, which are designed to simulate the
    way the human brain analyzes and processes information. These algorithms learn
    to perform a task, such as making a prediction, by being trained on large amounts
    of data. The ability of deep learning models to identify complex patterns in input
    data makes them well-suited for the multifactorial nature of diabetes mellitus
    and its prognosis.


