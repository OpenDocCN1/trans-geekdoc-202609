  md: 'performance. On the other hand, excluding a measure that has a strong association
    with the disease in the final model would introduce bias and decrease the accuracy
    of prediction. Therefore, in this study, careful considerations were given to
    the selection of relevant measures used to predict the disease progression of
    a specific group of diabetic patients. A total of 15 measures were initially identified
    by the expert system from the data warehouse. These measures were selected from
    the domains of demography, medication use, and diabetes-specific and co-morbidity
    indicators (Khan et al., 2019). A set of association rules was derived from the
    knowledge discovery process, concerning the probability of the co-existence of
    the diabetes disease codes. For example, a rule would suggest that for elder patients
    with diabetes and the diagnosis of prostate disease, there is a 40% chance of
    having a co-existence of impotence. Such information could provide valuable guidelines
    for medical practitioners in understanding and drafting personalized care plans
    for individual patients.


    # 10.2.2 Data Cleaning and Imputation


    The completed datasets from multiple imputations will be stacked together for
    further analysis. Imputed data provides greater statistical power and allows for
    more complete analysis. However, it is also suggested to include a sensitivity
    analysis section to address how the results might change if different imputation
    methods are used. By doing so, the robustness of the findings could be further
    demonstrated.


    We used the mice package in R and employed predictive mean matching that takes
    into account the non-linear relationships between missing and auxiliary variables.
    The number of multiple imputed datasets is determined based on the percentage
    of missing information. After imputation, we checked the imputations and the distributions
    of imputed values for all variables. Also, it is important to include missing
    indicators in the analysis to make sure that the missing data mechanism is missing
    at random. Specifically, it is helpful to compare the missingness between the
    original variable and the missing indicator. By noticing these important technical
    details, the high quality of the imputation could be better assured (Naz & Ahuja,
    2020).


    In this study, we used a method called multiple imputation to handle missing data
    in a principled way. There are different methods for handling missing data, such
    as complete case analysis (i.e. only cases with no missing value are used in the
    analysis) and mean imputation (i.e. for a variable with missing value, fill in
    the mean of that variable). However, these'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'methods have limitations and could lead to biased results. Multiple imputation
    is a valid and flexible method for handling missing data. The key idea of multiple
    imputation is to replace each missing value with a set of possible values to reflect
    the uncertainty of imputation. Then, the analysis will be performed on each of
    the completed datasets and the results will be combined to account for the uncertainty
    due to missing data. This method provides unbiased parameter estimates and consistent
    statistical power.


    The diabetes dataset used in this study contains missing values and inconsistencies.
    To obtain reliable results, it is important to detect and correct errors in the
    data. First, we identified and removed duplicate entries in the dataset. Then,
    we checked the type and range of each variable. For example, date variables are
    converted to date type and we examined if each date is within a logical range.
    Visualizations like histograms and boxplots help identify potential outliers.


    # 10.2.3 Feature Engineering


    Feature engineering transforms raw data into formats more understandable for machine
    learning models, enhancing their performance and efficiency. While deep learning
    models can directly handle raw data, traditional algorithms like random forest
    require meticulously crafted features for optimal functioning. Feature selection,
    a critical step, involves choosing the most relevant features to improve model
    accuracy and reduce complexity. Techniques like the filter and wrapper methods
    help identify these crucial features. Our work introduced a novel longitudinal
    feature for deep learning models, offering a fresh perspective on handling time-series
    data in diabetes research, showcasing the blend of domain knowledge and advanced
    analytics to refine model inputs (Naz & Ahuja, 2020).


    # 10.3 DEEP LEARNING MODELS


    Neural network models, especially for diabetes prognosis, outperform traditional
    statistical models by capturing complex biological patterns without pre-defined
    assumptions. These models require careful optimization and a diverse training
    dataset to achieve high prognostic accuracy. Despite challenges like the need
    for large, varied datasets, neural networks’ potential for personalized diabetes
    care is significant, inviting further exploration into various neural network
    architectures and optimization techniques to enhance diabetes prognosis (Hasan
    et al., 2020).'
