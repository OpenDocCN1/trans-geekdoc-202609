    # 12.2 DIABETIC RETINOPATHY


    When diabetic retinopathy (DR) first manifests [23], micro-aneurysms are visible
    on the retina and brought on by pericyte loss and degeneration, which dilate the
    capillary walls [8]. Intraretinal hemorrhages happen when a microaneurysm or capillary
    wall ruptures. Hard and soft exudates, venous beading, intraretinal microvascular
    abnormalities (IRMA), reduction, or venous loops are further lesions of non-proliferative
    DR. In regions of ischemia, IRMAs show large caliber tortuous arteries and may'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'be an effort at vascular remodeling, according to Stitt et al. [24]. Lastly,
    the presence of neo-vascularization – basically the development of new retina
    vessels from existent ones because of ischemia – is the basis for differentiating
    between proliferative and non-proliferative DR. Diabetic macular edema (DME) is
    the most prevalent cause of blindness and can occur in any phase of DR. Edema
    is linked to abnormalities such as micro-aneurysms or hemorrhages within the fovea
    center’s single disk diameter, exudates that are located within the fovea center’s
    disk diameter, exudates inside the macula, and retinal thickness within the fovea
    center’s disk diameter.


    The Early Treatment Diabetic Retinopathy Study, i.e., ETDRS grading system, is
    regarded as the benchmark for clinical grading processes in DR; however, its practicality
    and ease of usage in daily clinical practice have not been demonstrated. Hence,
    to enhance patient screening and caregiver communication, several substitute scales
    have been put forth. Thus far, there isn’t a single worldwide severity scale for
    DR due to the creation of such streamlined scales in several nations. To do this,
    the International Clinical Diabetic Retinopathy Disease Severity Scale (ICDRDSS),
    which divides DR into five levels as indicated in Table 12.1, was suggested by
    the global diabetic retinopathy project group (Figure 12.2).


    | S.No. | Severity Level of Disease | Dilated Ophthalmoscopy Findings |

    |-------|---------------------------|---------------------------------|

    | 1 | 0 Indicates no diabetic retinopathy | Zero abnormalities |

    | 2 | 1 Indicates mild diabetic retinopathy | Only micro-aneurysms |

    | 3 | 2 Indicates moderate diabetic retinopathy | Greater than micro-aneurysms,
    but not as much as NPDR (non-proliferative diabetic retina) |

    | 4 | 3 Indicates severe diabetic retinopathy | Any of the subsequent conditions
    without proliferative retinopathy symptoms:

    1. In each of the four quadrants, more than 20 intraretinal hemorrhages.

    2. Distinctive venous beading in two or more quadrants.

    3. Intraretinal microvascular abnormalities (IRMA) stand out in one or more than
    one quadrant. |

    | 5 | 4 Indicates growth-oriented diabetic retinopathy | Both or one of the subsequent
    items:

    1. Neo-vascularization

    2. Pre-retinal or vitreous hemorrhage |'
