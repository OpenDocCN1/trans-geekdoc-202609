    # 7.4 DEEP LEARNING MODEL (DLM)


    The architecture of the proposed DLM for DM prediction is shown in Figure 7.3.
    It consists of input feature layer followed by fully connected layers with batch
    normalization and rectified linear unit (ReLU) activation. Finally, softmax layer
    and classification layer are available in the proposed DLM. The dataset contains
    eight input features represented


