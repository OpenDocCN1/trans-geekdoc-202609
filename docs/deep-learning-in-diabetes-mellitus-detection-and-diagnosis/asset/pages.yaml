    # 8.5 CONCLUSION


    Diabetes mellitus is a serious health concern affecting many people world-

    wide, and this issue needs to be addressed effectively. From the presented

    literature review, it can be deduced that there is a strong, growing interest

    in the area of improving the process of diabetes detection and diagnosis

    with the help of refined deep learning methods that prove to be successful with
    high-performance accuracy scored in the evaluation. It can

