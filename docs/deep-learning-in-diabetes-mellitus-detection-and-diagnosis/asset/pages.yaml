  md: '# Toward Classifying the Severity of Diabetic Retinopathy Using Deep Learning


    Ayush Negi, Shrish Srinivasan, and N. G. Bhuvaneswari Amma


    # 5.1 INTRODUCTION


    Millions of individuals worldwide suffer from the serious eye condition known
    as diabetic retinopathy (DR), which is one of the main causes of blindness and
    visual loss. Diabetes patients’ excessive blood sugar levels damage the retina’s
    tiny blood vessels, which in turn causes this condition. If ignored, DR can cause
    serious vision loss and possibly blindness. DR needs to be detected and treated
    as soon as possible to prevent visual loss and improve patient outcomes. Historically,
    ophthalmologists have used fundus (retinal) pictures to diagnose DR. However,
    this approach is arbitrary and susceptible to observer knowledge and experience.
    A more effective and impartial way of identifying DR is required given the rising
    incidence of diabetes and the burden it takes on the healthcare system [1]. “Deep
    learning (DL),” a rapidly expanding area of artificial intelligence, has shown
    encouraging findings in the diagnosis of medical imaging. DL'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'models have recently surpassed both conventional machine learning (ML) algorithms
    and human specialists in tasks like semantic segmentation, object detection, and
    picture classification.


    As computers are trained, classifications can be obtained more quickly, allowing
    physicians to support classifications in real time. Computer image research now
    focuses on how well-automated grading works for DR [2]. A subclass of DL known
    as convolutional neural networks (CNNs) has a long history of use in image processing
    and interpretation applications, such as medical imaging. CNNs offer flexibility
    and customizability through dropout and rectified linear unit (ReLU)-aware implementations,
    thereby enhancing computational power through graphics processing unit (GPU) units.
    Complex image identification problems can be solved with the help of GPU. Detecting
    DR in fundus pictures was the goal of this study’s investigation into the application
    of DL. In this study, the following actions were taken:


    +   • **Data Collection:** Photographs of the fundus were gathered from patients
    with and without DR, creating a collection of fundus images. With the use of a
    digital fundus camera, the pictures were captured.


    +   • **Image Preprocessing:** To reduce noise and improve the quality of the
    obtained pictures, preprocessing was used. Cropping, contrast stretching, and
    picture normalization were used to standardize the photographs and enhance their
    look.


    +   • **Creation of a DL Model:** To identify the pictures as normal or afflicted
    by DR, a CNN model was created and put into practice. The preprocessed photos
    were used to train the model, which was then evaluated using a different test
    dataset.


    +   • **Model Training and Evaluation:** A sizable number of photos were used
    to train the model, and a separate test dataset was used to assess its performance.
    Precision, recall, and F1 score are a few measures that were used to gauge the
    model’s accuracy.


    +   • **Model Optimization:** To get the best performance, the model was fine-tuned
    using a mix of hyperparameter tweaking and transfer learning (TL).


    The rest of the chapter is organized as follows: Section 5.2 identifies and analyzes
    the problem. Section 5.3 discusses the literature pertaining to'
