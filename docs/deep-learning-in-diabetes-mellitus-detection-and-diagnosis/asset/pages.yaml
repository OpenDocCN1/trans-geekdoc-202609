  md: '# Graph-Based Explainable Method for Blood Glucose Prediction through Federated
    Learning


    Chengzhe Piao and Kezhi Li


    # 3.1 INTRODUCTION


    Type 1 diabetes (T1D) occurs if the pancreas fails to generate sufficient insulin,
    resulting in elevated blood glucose (BG) levels (hyperglycemia, defined as BG
    > 180 mg/dL). To manage their condition and maintain BG levels within the normal
    range (70–180 mg/dL), individuals with T1D rely on insulin delivery methods such
    as pumps and bolus injections. Without proper management, there is a significant
    risk of experiencing hypoglycemia (BG < 70 mg/dL) or hyperglycemia, which can
    lead to severe complications, including kidney issues, vision problems, and even
    blindness.


    To prevent these serious health issues, it is crucial for people with T1D to actively
    monitor and manage their BG levels. Continuous glucose monitoring (CGM) systems
    have become a vital tool in this regard, offering'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'the ability to track BG level fluctuations every 5 minutes. Leveraging the
    detailed data provided by CGM, researchers have developed a variety of predictive
    models for blood glucose level prediction (BGLP). These models enable individuals
    with T1D to proactively adjust their insulin dosages and dietary intake, significantly
    enhancing their ability to maintain stable BG levels and mitigate the risk of
    complications.


    In BGLP, historical data is often structured as multivariate time series (MTS)
    to incorporate various attributes relevant to the prediction task. Since 2020,
    neural network (NN)-based methodologies have demonstrated superior performance
    over traditional non-NN approaches, particularly highlighted during the BGLP 2020
    Challenge. Among these advancements, Neural Basis Expansion Analysis for Time
    Series (N-BEATS) (Oreshkin et al., 2020) has been applied by Rubin-Falcone et
    al. (2020). N-BEATS was a leading approach for time-series analysis at the time,
    and their N-BEATS-based solution notably secured first place in the challenge.
    Despite these achievements, a significant limitation remains: These models offer
    limited insight into the significance of different attributes, such as glucose
    levels, bolus, and finger sticks, in the prediction process. This lack of attribute
    importance explanation is a gap not only in N-BEATS but also in other contemporary
    BGLP methodologies that rely on recurrent neural network (RNN) architectures like
    long short-term memory (LSTM; Hochreiter and Schmidhuber, 1997; Yang et al., 2020).
    These approaches can capture temporal dependencies but fall short in transparently
    modeling the interconnections among attributes. The importance of this limitation
    cannot be understood, as many clinicians and healthcare professionals prioritize
    understanding the decision-making process of predictive models. The ability to
    interpret how different attributes influence predictions is crucial for clinical
    acceptance and trust in these technologies.


    Therefore, a critical limitation of these approaches is their inability to quantify
    and explain the significance of each attribute within the BGLP context. To address
    this gap, advancements in graph neural networks (GNNs) present a promising avenue,
    particularly those employing dynamic graphs with adaptable edge weights. Graph
    attention networks (GATs; Velickovic et al., 2018) enable the edge weights, predicated
    on the adjacent node tensors, to be adjustable during the learning process. Subsequently,
    Brody et al. (2022) developed an enhanced version, GATv2, which incorporates a
    more dynamic attention mechanism, offering increased model expressiveness. These
    innovations in GAT and GATv2 facilitate the explanation of attribute significance
    in BGLP through the modulation of edge weights.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In this research, our proposed model is grounded in the original GAT framework
    (see Section 3.2). Although GATv2 presents certain advantages, our preliminary
    experiments did not yield significant improvements to justify its adoption over
    GAT.


    In terms of NN training and deployment for BGLP, recent innovations have emphasized
    the development of personalized models through multi-task learning, as highlighted
    by Daniels et al. (2020, 2022). This approach diverges from traditional methods
    that required the aggregation of individual data to train a generalized population
    model, which was subsequently fine-tuned with personal data. Multitask learning
    facilitates the simultaneous capture of population-wide patterns and individual-specific
    characteristics, thus enabling the generation of personalized models without extensive
    fine-tuning. As for the deployment, Zhu et al. (2021) demonstrated the feasibility
    of deploying an LSTM-based model on a microcontroller unit for real-time BG prediction
    in individuals with T1D. Further extending the technological frontier, Zhu et
    al. (2022) employed a wearable device, incorporating a low-cost chip capable of
    running a temporal attention-based GRU model. This approach leverages desktop
    and cloud platforms for model fine-tuning and data storage, showcasing a practical
    application of NNs in wearable health monitoring devices. Additionally, D’Antoni
    et al. (2022) utilized TensorFlow and Keras API tools to implement an LSTM-based
    model directly on edge devices. This method slightly compromises prediction accuracy
    for the benefit of real-time processing capabilities, which is acceptable within
    the context of their application. However, these methodologies often overlook
    the crucial aspect of privacy protection during the aggregation of data for learning
    population patterns. This oversight can limit participant recruitment and consequently
    restrict the volume of available training data. Addressing this challenge remains
    critical for advancing NN-based BGLP methods, ensuring both effective prediction
    capabilities and adherence to privacy standards.


    Hence, a notable deficiency in recent BGLP methodologies is the lack of consideration
    for privacy protection during the training of population models. Federated learning
    (FL), characterized by its decentralized learning approach, emerges as a solution
    to this challenge. FL aims to harness the computational capabilities of distributed
    devices for artificial intelligence (AI) training tasks directly on the data produced
    by these devices, thereby maintaining data confidentiality at its source. The
    model updates are aggregated on a central server through a process known as federated
    averaging (FedAvg), as proposed by McMahan et al. (2017), ensuring'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'that only model parameters are shared rather than sharing data. Given FL’s
    potential for safeguarding participant privacy while facilitating the learning
    of population-wide patterns, this work explores the application of FL within the
    BGLP domain. Our goal is to assess the feasibility and effectiveness of integrating
    FL in the training of deep models, aiming to strike a balance between predictive
    accuracy and privacy preservation (see Section 3.2).


    In our experiments (see Section 3.3), we designed three experiments in OhioT1DM
    (Marling and Bunescu, 2018, 2020). The initial trial established that the contributory
    factors include “glucose level”, “bolus”, “meal”, “exercise”, “finger stick”,
    and “sleep”. In subsequent experiments, variations in hyperparameters of our methods
    were examined, demonstrating its stability across diverse setups. The third experiment
    delved into the impact of FL, confirming a reduction in prediction accuracy when
    integrated with our approach. Finally, our discussion and conclusion (see Sections
    3.4 and 3.5) are given at the end of this chapter.


    # ## 3.2 METHOD


    # ### 3.2.1 Problem Definition


    **BGLP via regular multivariate time series (RMTS-BGLP)**: If we have $N$ factors
    from previous $T$ time steps, the data can be represented as $\mathbf{X}=[\mathbf{x}_1
    \cdots \mathbf{x}_T]$, where $\mathbf{X} \in \mathbb{R}^{N \times T}$. Note that
    $\mathbf{x}_t$ has $N$ factors. The task is to forecast the BG level $y_{T+W}$
    in the future. We set the prediction horizon $W$ to 6 or 12, representing the
    prediction in 30/60 minutes. Regarding $T \triangleq \{1, ..., T\}$ and aligning
    with the sampling frequency of CGM, each adjacent pair of the time series is 5
    minutes.


    # ### 3.2.2 Setting and Dataset


    **This study examines two datasets**: OhioT1DM’18 and OhioT1DM’20 (Marling and
    Bunescu, 2018, 2020). There are 12 participants, with six from each dataset, all
    diagnosed with T1D. Details of these datasets are provided in Table 3.1 with key
    observations as follows: (i) The participant group includes five females and seven
    males, offering a relatively balanced gender distribution; (ii) the age range
    for the majority of participants is middle-aged, with eight participants falling
    within the 40–60 age bracket; and (iii) for the majority of participants, the
    ratio of training to testing samples is approximately 5:1.'
