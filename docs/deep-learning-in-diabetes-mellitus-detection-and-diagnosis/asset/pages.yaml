  md: '# # Deep Learning Algorithms for Diabetes Mellitus Detection and Management


    Mohadeseh Zarei Ghobadi, Mohammad Dehghani, and Elaheh Afsaneh


    # ## 11.1 INTRODUCTION


    Diabetes mellitus is a long-term metabolic disorder characterized by elevated
    levels of glucose in the blood. It is mainly classified into three common types:
    Type 1 diabetes mellitus (T1DM), Type 2 diabetes mellitus (T2DM), and gestational
    diabetes mellitus (GDM). Each type is indicated by dysregulation of lipids, protein
    metabolism, and carbohydrate [1]. Furthermore, there are specific types of diabetes,
    such as neonatal diabetes, maturity-onset diabetes of the young, and diabetes
    that occur under the effect of exocrine pancreas disorders or chemical/drug-induced
    causes [2]. Environmental factors, viral infections, and gestational infections
    can contribute to the progression of T1DM [3]. T2DM has a heritable component,
    and the risk of developing T2DM is higher among siblings of affected individuals.
    Maternal history of T2DM and abnormal fasting glucose concentration or high body
    mass index (BMI) also increases the'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'risk [4]. GDM refers to glucose intolerance that is first recognized during
    pregnancy. It affects approximately 7% of pregnancies and poses risks to both
    the mother and the fetus [5].


    Early detection of diabetes mellitus is crucial for implementing lifestyle modifications
    and interventions to prevent or delay its onset. Various screening methods, including
    HbA1c, fasting plasma glucose (FPG), and oral glucose tolerance test (OGTT) can
    be used for identifying individuals with prediabetes or undiagnosed diabetes [6].
    On the other hand, computational methods, including machine and deep learning
    methods, can be helpful for diagnosis, detection, and other aspects related to
    this disease.


    # 11.2 DEEP LEARNING


    Deep learning, within the context of machine learning, is a distinct and specialized
    domain that revolves around the creation and training of artificial neural networks
    (ANNs) consisting of multiple layers. These networks extract abstract features
    from raw input, enabling accurate predictions and informed decisions. Deep learning
    models acquire hierarchical representations of data, recognizing complex patterns
    and relationships efficiently. This capacity leads to profound insights and accurate
    interpretations [7]. In contrast to traditional machine learning methods that
    necessitate domain-specific knowledge and extensive feature engineering, deep
    learning autonomously extracts pertinent features, streamlining the process of
    model development. Deep learning models can directly learn informative representations
    from raw data, including images, text, or audio, across different modalities [8].


    In this chapter, we survey the utilization of diverse deep learning algorithms
    in different areas of diabetes, such as diagnosis, prediction, treatment, and
    monitoring. Convolutional neural networks (CNNs), recurrent neural networks (RNNs),
    deep belief networks (DBNs), and transfer learning are prevalent deep learning
    techniques employed in various aspects of diabetes engineering, which we discuss
    in the subsequent sections.


    # 11.2.1 Convolutional Neural Networks


    CNNs are a category of sophisticated machine learning models primarily utilized
    for analyzing visual data. They aim to autonomously identify and extract meaningful
    features from images or similar grid-like input data. The architecture and training
    process of CNNs is pivotal in achieving precise and dependable results when employed
    for diabetes detection. Below is a comprehensive overview of the CNN architecture
    and training specifically tailored for diabetes detection [7]:'
  merge: -1
  img_proc: true
- pgno: 167
  md: '(i) The input layer of a CNN receives various types of data, such as retinal
    images or clinical records associated with diabetes; (ii) Convolutional layers
    employ learnable filters to extract significant features from the input data.;
    (iii) Activation functions introduce non-linearity to capture complex relationships
    between features; (iv) Pooling layers are an important layer in CNN systems that
    decreases the dimensionality of the feature maps; (v) Fully connected layers connect
    neurons and learn high-level representations for output predictions; (vi) A loss
    function is selected to quantify the discrepancy between predicted outputs and
    true labels; (vii) Backpropagation and gradient descent are performed to update
    weights and minimize the loss function; (viii) Training iterations involve repeatedly
    feeding data through the network, calculating gradients, and updating weights;
    (ix) Hyperparameters are adjusted to optimize the model''s performance; (x) The
    trained model is assessed on a separate test dataset employing evaluation metrics
    like accuracy and precision; (xi) Once satisfactory performance is achieved, the
    trained CNN can be deployed for diabetes diagnosis in a production environment,
    ensuring consistent pre-processing of input data.


    # 11.2.1.1 Application of CNNs for Various Aspects of Diabetes Management


    Until now, CNNs have been applied to multiple aspects of diabetes research and
    management. Here are some specific areas where CNNs have shown promise:


    +   • **Diabetic retinopathy detection**: CNNs analyze retinal images to detect
    and classify diabetic retinopathy stages, enabling early intervention [9,10].


    +   • **Glucose monitoring**: CNNs analyze glucose measurements and time-series
    data to predict blood glucose levels, facilitating personalized monitoring and
    insulin dosing [11–13].


    +   • **Risk prediction and management**: CNNs predict the risk of developing
    diabetes like T2DM or complications using various data sources, aiding in personalized
    risk assessments and early interventions [14].


    +   • **Diabetic foot ulcer detection**: CNNs detect and classify diabetic foot
    ulcers from images, enabling early detection and monitoring to mitigate complications
    [15].'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 11.2.2 Recurrent Neural Networks


    RNNs are a kind of deep learning architecture suitable for handling sequential
    data, including diabetes time-series data. RNNs can capture temporal dependencies
    and learn from previous inputs to predict or generate sequences. The steps involved
    in the architecture and training of RNNs for diabetes detection are as follows
    [7,16,17]:


    (i) **Inputs**: RNNs take sequential data like glucose measurements or insulin
    doses. The data is preprocessed and represented as input sequences;

    (ii) **Sequence padding**: Varying length sequences are padded to ensure equal
    size, enabling batch processing;

    (iii) **Hidden state**: The hidden state captures the network’s memory and previous
    sequence information, modeling sequential dependencies;

    (iv) **Recurrence**: At each time step, RNNs update the hidden state by incorporating
    the input data and the previous hidden state;

    (v) **Training**: RNNs are trained using a suitable loss function, comparing predicted
    output with ground truth labels. Weights and biases are adjusted through backpropagation
    and gradient descent;

    (vi) **Backpropagation through time (BPTT)**: BPTT extends backpropagation to
    RNNs, propagating errors through all time steps. The remaining steps in the training
    process are similar to CNNs.


    # 11.2.2.1 Application of RNNs for Various Aspects of Diabetes Management


    The performance of RNNs in diabetes-related tasks is influenced by various factors
    such as the quality and quantity of data, model architecture, feature engineering,
    and optimization techniques. However, RNNs have demonstrated their potential in
    improving diabetes management and aiding decision-making processes. Here is how
    RNNs work for diabetes-related tasks:


    +   - **Glucose level prediction**: RNNs use past glucose readings to predict
    future levels, capturing patterns and dynamics [18,19].

    +   - **Anomaly detection**: RNNs detect abnormal glucose patterns by learning
    standard behavior, aiding in identifying episodes or unusual patterns [20,21].

    +   - **Diabetes risk assessment**: RNNs analyze longitudinal data to predict
    diabetes risk and complications by identifying patterns and risk factors [22].'
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   **Disease progression modeling:** RNNs analyze longitudinal data to model
    disease progression, considering demographic information, clinical measurements,
    and treatment history [23].


    # 11.2.3 Deep Belief Networks


    DBNs are valuable algorithms for diabetes management, integrating diverse data
    modalities like clinical, genetic, and lifestyle factors. By employing unsupervised
    learning, DBNs capture the relationships and structure within the data, facilitating
    risk assessment and disease prediction.


    The key steps involved in DBNs are as follows [24,25]: **(i) Inputs**: Numerical
    features related to individuals, including age, gender, BMI, blood pressure, glucose
    level, etc., are selected and preprocessed; **(ii) Visible layers**: Restricted
    Boltzmann machines (RBMs) with binary units represent observed variables and connect
    to the input data; **(iii) Hidden layers**: RBMs, except the last one, have hidden
    layers that capture latent representations; **(iv) RBM architecture**: Weighted
    connections exist between visible and hidden layers, with activation functions
    determining hidden unit activations; **(v) Training**: DBNs undergo unsupervised
    training, initially employing layer-wise pretraining, followed by fine-tuning
    using supervised learning algorithms to adjust the biases and weights of the network;
    **(vi) Inference**: Trained DBNs are used for diabetes detection. Input data passes
    through visible and hidden layers, producing output used for classification or
    prediction tasks.


    # 11.2.3.1 Application of DBNs for Various Aspects of Diabetes Management


    DBNs have been explored in multiple aspects of diabetes detection, including risk
    prediction, early detection, classification, and feature selection. Here are some
    key areas where DBNs have been applied:


    +   **Early detection:** DBNs analyze longitudinal health records and biomarker
    changes to detect early stages of diabetes by capturing subtle patterns and trends
    [26,27].


    +   **Diabetes management:** DBNs identify critical indicators for diabetes diagnosis,
    such as glucose concentration, BMI, and age. They provide recommendations for
    prevention education, personalized measures, and community-wide strategies to
    improve management [28].'
  merge: -1
  img_proc: true
