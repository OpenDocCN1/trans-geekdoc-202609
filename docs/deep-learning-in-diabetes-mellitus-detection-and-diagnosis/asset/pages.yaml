    # 5.4 PROPOSED DR FUNDUS CLASSIFICATION


    Figure 5.3 depicts the flow of classification and detection of DR images. The
    proposed model utilizes a high-resolution red green blue (RGB) image with 224×224
    pixel dimensions and is based on the DenseNet121 architecture. The model''s weights
    are pre-trained using the ImageNet dataset to get sufficient information for fine-tuning
    the fully connected layer''s output weights. The feature extraction phase is also
    known as convolutional layers, while the final layer is known as the classification
    phase. The SoftMax activation is used to assign probabilities to each class in
    the model''s output [10].


    Following the application of convolutional layers, the characteristics retrieved
    from the image are transferred to the classification stage. The classifier''s
    first layer consists of two completely linked layers and has 1024 units. A 50%
    probability dropout layer and a layer with 1024 units that uses a ReLU activation
    function come next. The last layer, which employs the SoftMax activation method,
    consists of five units.


