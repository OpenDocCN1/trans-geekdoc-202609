    based on a combination of convolutional neural networks (CNNs) and recurrent neural
    networks (RNNs). These sensors are a component of a system that facilitates a
    remarkably sensitive non-invasive method allowing for the identification of very
    subtle abnormalities. These biosensors are designed to detect molecules, which
    are then transformed into electrical signals that are further analyzed in the
    main system. Obtained data include blood glucose, body temperature, or heart rate.


    In Ref. [17], the analysis was based on data derived from electrocardiograms (ECGs)
    of healthy and affected patients. In the study, both convolutional neural network
    and CNN-LSTM (long short-term memory) techniques have been implemented and tested
    with the second one scoring better results. The main features in consideration
    were heart rate variability (HRV) signals. Swapna et al. presented a hybrid neural
    network approach, namely fivefold cross-validation CNN-LSTM, achieving 95.1% accuracy.
    This approach has been tested on 142 datasets in a balanced proportion of both
    affected and healthy patients. Each dataset contains 1000 samples. After the initial
    data conversion into heart rate time series, no additional pre-processing has
    been performed.


    In Ref. [18], a one-dimensional CNN (1D-CNN) was proposed by Alex et al. for predicting
    diabetes mellitus with the highest results of 86.29% accuracy. Additionally, for
    identifying outliers in missing values, the Tukey method was utilized. For tests
    and evaluation, a popular dataset was used, namely the Pima Indians Diabetes Dataset
    [19] from the University of California repository. It includes information about
    the patient’s health and diagnostic measurements, i.e., glucose levels, number
    of pregnancies the patient has had, BMI, insulin levels, blood pressure, and age
    [20]. The dataset comprises information about 768 women with 268 patients diagnosed
    with diabetes and 500 not affected. For dealing with an imbalanced dataset, the
    synthetic minority oversampling technique (SMOTE) was used. It works by creating
    new samples for the class present in the minority, resulting in a balanced dataset
    [21].


