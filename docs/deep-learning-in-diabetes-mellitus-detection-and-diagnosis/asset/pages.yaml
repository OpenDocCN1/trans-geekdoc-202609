    Govind Narayan Patel, Lipika Dinda, Jitesh Pradhan, and B. Ramachandra Reddy


    # 12.1 INTRODUCTION


    Millions of people are suffering from diabetes mellitus, a major public health
    issue that is expected to hit 700 million people by the year 2045 [1]. Diabetic
    retinopathy (DR) is a very common eye disease associated with diabetes, affecting
    at least one-third of those with the condition [2]. Regardless of how bad their
    diabetes is, any patient might develop diabetic retinal disease, which is characterized
    by gradually developing retinal vascular abnormalities brought on by ongoing hyperglycemia
    [3]. It is the main reason for blindness among adults in their working years worldwide,'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'and the estimated number of individuals with DR is 93 million [4]. It is anticipated
    that these figures will increase even further, mostly due to the growing incidence
    of diabetes in developing Asian nations (India, China, etc.) [5,6].


    Most DR patients are symptomless in the preliminary stages: clinically undetected
    microvascular abnormalities and neuronal retinal damage are happening at this
    time [7]. Therefore, diabetic individuals must undergo routine eye screenings
    since timely diagnosis and medical intervention are essential [8]. Since treating
    hyperlipidemia, hyperglycemia, and hypertension is the only precautionary measure,
    it becomes even more important to diagnose DR early [7]. Furthermore, in up to
    98% of instances, currently available therapies like diabetic maculopathy and
    proliferative retinopathy, which are treated in their initial phases, laser-photocoagulation
    considerably reduces the risk of blindness. Receiving the right care and early
    detection are essential to delaying or even preventing blindness from DR [9,10].
    Although the first-stage diagnosis of DR might be founded on anomalies in function
    in electro-retinography, retinal blood vessels, and retinal blood flow diameter,
    in medical practice, the study of fundus images is the main focus of the preliminary
    diagnostic [11,12]. Fundus images, one of the most often used methods for assessing
    the degree of DR, are a simple, rapid, accessible, and well-tolerated imaging
    technique [13]. Fundus images allow ophthalmologists to see retina lesions in
    high resolution, which they use to confirm and assess DR disease. However, hand-diagnosing
    DR from the fundus dataset images necessitates a high degree of experience and
    output from an experienced eye doctor, especially in remote or densely inhabited
    regions such as India and Africa, where the overall number of people with DR and
    diabetes is anticipated to rise sharply in the coming years and ophthalmologists
    are disproportionately few [14–17]. This has sparked the development of computer-aided
    diagnosis technologies, which will cut down on the amount of money, work, and
    time that a medical professional must spend to identify DR. It is now possible
    to design deep learning systems for precise recognition of DR and categorization
