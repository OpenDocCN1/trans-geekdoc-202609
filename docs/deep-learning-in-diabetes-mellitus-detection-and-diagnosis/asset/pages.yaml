    +   2. 80% of people with diagnosed diabetes should have good control of glycaemia
    [4].

    +   3. 80% of people with diagnosed diabetes should have good control of blood
    pressure [4].

    +   4. 60% of people with diabetes of 40 years or older must receive statins [4].

    +   5. 100% of people with type 1 diabetes must have access to affordable insulin
