    # 6.4 LITERATURE REVIEW


    Fico et al. [1] developed the personalized healthcare pathway (PHP) to manage
    diabetic disease, integrating it into an information and communication technology
    system to ease the shift from organization-centered to patient-centered care.
    We conducted small-scale exploratory research to test the platform.


    Mougiakakou et al. [2] used the SMARTDIAB platform to manage diabetes. To manage
    type 1 diabetes, it integrates the most recent techniques in database (DB) technologies,
    communications, simulation algorithms, and data mining. Although it has equal
    software and hardware components for proper diabetes control, it lacks food recognition
    and an efficient meal recommendation.


    Theis et al. [3] suggested a deep learning architecture to improve current methods
    of cruelly grading by incorporating the medical histories of diabetes patients.
    First, medical histories from previous hospital visits are transformed into event
    logs that can be used for process mining. After that, a process model that explains
    the patients’ prior hospital experiences is found using the event logs. It is
    recommended to modify decline replay mining to forecast the in-hospital mortality
    of diabetic ICU patients by fusing known severity scores with demographic and
    medical data.


    Sarathambekai et al. [4] have developed the best prediction model for machine
    learning-based diabetes guesses, based on an analysis of the prediction scores
    and outcomes of numerous research publications and articles. Based on the accuracy
    scores and other appraisal metrics acquired based on the prediction, common machine
    learning algorithms such as Decision Tree, random forest (RF) classifier, support
    vector machine (SVM), K-NN, Naïve Bayes, and the deep learning algorithm multi-layer
    perceptron classifier have remained evaluated from the studies.


    El Bouhissi et al. [5] evaluated the most significant research on diabetes prediction
    and provided a method for predicting gestational diabetes, utilizing RF, SVM,
    and deep neural network (DNN) classifiers. Using a real dataset from Frankfurt
    Hospital, the experiment was carried out, showing that the RF method offers more
    accuracy.


    Samir et al. [6] propose a system that combines deep learning-based human activity
    recognition (HAR) and food arrangement with non-invasive continuous glucose monitoring
    (CGM) strategies to track glucose'
