    # 10.2.1 Selection of Relevant Variables


    To train a machine learning model to predict (or estimate) an outcome, practitioners
    would examine widely accepted diabetic measures in the literature. From the statistics
    generated from computer-based data mining, life table studies, or medicine, typically,
    a very large list of diabetic-related measures could be used. However, theoretical
    and clinical knowledge would be important for selecting only a subset of relevant
    measures to construct an efficient and effective prediction model. This is because
    including irrelevant or redundant measures in a model would increase its complexity
    and the noise level in the measures, thus hurting the predictive'
  merge: -1
  img_proc: true
