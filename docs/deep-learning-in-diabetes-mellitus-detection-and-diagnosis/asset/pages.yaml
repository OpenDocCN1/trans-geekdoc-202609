  md: '# 7.3 METHODOLOGY


    Figure 7.1 shows the diagrammatic illustration of the methodology carried out
    for DM detection. The methodology consists of data preprocessing for missing values
    detection [23]. The dataset is divided into three categories: Training, validation,
    and testing. Half of the data is allocated for training, 30% is reserved for tenfold
    cross validation, and remaining 20% is utilized to test the developed model as
    shown in Figure 7.2. Finetuning the model is carried out by hyperparameter tuning
    for ML algorithms. A classification model based on ML algorithms such as DT, LR,
    NB, SVM, KNN, and ensemble learning algorithm (ELA) is used for DM detection in
    this work. The hyperparameter of these ML classification models is tuned using
    Bayesian optimization. The key advantage of this optimization is that in each
    iteration the parameter selection is based on previous iteration. Instead of choosing
    the parameters randomly in each stage, this optimization chooses from the relevant
