  md: '![](img/7df621e14c1a5d96077d3e56e3977008_72_0.png)


    # FIGURE 4.2 Block diagram representation of the proposed technique.


    conditional autoregressive specification called the CAViaR. At first, the IoT
    simulation will be carried out wherein the dispersed nodes will gather information
    about patients. Thereafter, routing will be done using the proposed shuffled shepherd
    caviar optimization (SSCO), which is the integration of the shuffled shepherd
    optimization algorithm (SSOA) [14] and CAViaR [15]. Here, the fitness measures,
    such as energy, trust, and distance will be considered. Furthermore, retinal image
    segmentation will be carried out at the base station (BS). Here, the input retinal
    image will be presented to the pre-processing phase, which will be performed based
    on region of interest (RoI) extraction using the adaptive threshold (AT) technique.
    After that, the retinal image segmentation will be performed by the residual attention-aware
    segmentation method (RA-UNet) [16], which will be trained by the proposed SSCO
    technique and pictorially represented in Figure 4.2.


