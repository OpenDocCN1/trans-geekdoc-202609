  md: '# 5.3.1 Deep Learning (DL)


    The development of computational models with several processing layers that can
    learn data representations at different levels of abstraction has been made possible
    by DL. As a result, these techniques have significantly enhanced various modern
    fields such as object recognition, pattern recognition, speech recognition, and
    more [7]. DL uses the backpropagation method to acquire intricate patterns from
    enormous datasets. This is accomplished by adjusting the internal parameters of
    a model dependent on the prior layer’s representation for each layer’s representation.
    However, a significant challenge with DL is the requirement for large datasets
    to improve the model. Transfer learning is a solution to this problem, allowing
    for the enhancement of established model parameters on a new data distribution
    area without the need for large datasets. Using past knowledge can reduce the
    amount of time necessary to update a model’s parameters for a new dataset domain
    in a related activity [8]. Typically, TL models are trained on a complex dataset
    such as ImageNet, which contains diverse optimal kernels. This approach can enhance
    the accuracy of the model for distinct types of tasks.


    # 5.3.2 Diabetic Retinopathy (DR)


    Based on how it develops, DR can be categorized into several groups that range
    from the mildest to the most severe stages. The fundus oculi of the retina are
    used to classify DR into two main categories: non-proliferative diabetic retinopathy
    (NPDR) and proliferative diabetic retinopathy (PDR). The inner retinal limiting
    membrane is not affected by the mild, moderate, or severe consequences of NPDR,
    which are limited to the retina. There are three phases of PDR: early, high-risk,
    and advanced. Neoformation and proliferation of blood vessels outside of the retina
    are consequences of ophthalmoscopic alterations brought on by ischemia [9]. In
    this research, the term PDR is utilized to refer to a unified group that includes
    the initial, high-risk, and progressed forms. The following are the classes in
    DR detection:


    +   - The patient does not exhibit any diabetic retinal changes, which is referred
    to as No DR.

    +   - When there are minimal changes in the retina due to NPDR, it typically involves
    assessing features such as exudates, microaneurysms, cotton-wool spots, and retinal
    hemorrhages.'
