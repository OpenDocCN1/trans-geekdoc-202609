  md: '# # Automated Early Detection of Diabetes Mellitus from Retinal Fundus Images
    Using Residual U-Network Approach


    K. Sujatha, R.S. Ponmagal, N. Janaki, N.P.G. Bhavani, and SuQun Cao


    # ## 4.1 INTRODUCTION


    Diabetes mellitus (DM) is considered to be the deadliest disease prevailing across
    the world. Early diagnosis of DM plays a paramount role in increasing the patient’s
    survival rate. Recent development in the medical and technological fields offers
    directions to improvise the methodology of detecting and segmenting the retinal
    images to confine the location in helping the medical practitioners to focus on
    the problem and treat the patient with accurate procedures. To predict and segment
    the retinal images, many approaches have been proposed recently. Since deep'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'learning methods play prominent roles in DM detection and segmentation, these
    two approaches are considered [1–11]. Also, as IoT is leading the technological
    advancement in connecting devices across the globe, integrated IoT-based routing
    is used with the above methods to fine-tune and locate the precise location of
    cancerous cells in the bone. The main challenges faced by bone cancer segmentation
    and IoT routing techniques are explained here [12,13]. In Ref. [14], the classification
    of the images is a major challenge using fully convolution networks (FCNs) architecture.
    The devised AGResU-Net in Ref. [10] failed to consider a clinical segmentation
    model to improve the segmentation accuracy.


    In Ref. [15], segmentation using textural features and sparse kernel coding was
    developed for segmenting the bone cancers, but the major challenge lies in extending
    the single-dimensional data source to a multi-dimensional data source, thereby
    segmenting the non-normal retinal region tissues from the normal portion. Thus,
    the proposed project develops a method that resolves the identified issues and
    provides accuracy, sensitivity, specificity, and region of curve parameters along
    with emphasizing the performance measures such as fitness measures [16–24]. An
    embedded-based software product helps medical professionals, doctors, specialists,
    researchers, and other experts in the medical field to diagnose DM at an early
    stage and start the treatment accordingly (Figure 4.1).


    The chapter is organized in such a way that Section 4.1 gives an introduction
    to diabetic retinopathy (DR). A literature survey is carried out


    # DIABETIC RETINOPATHY


    ![](img/7df621e14c1a5d96077d3e56e3977008_68_0.png)


    FIGURE 4.1 Normal retina vs. retinal images with diabetic retinopathy. (Credits:
    ShutterStock Images.)'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'to identify the methods discussed by the researchers in Section 4.2. The existing
    challenges that are prevailing are identified from the literature survey and discussed
    in Section 4.3 which comprises the gaps existing in the research field. The research
    gaps are identified and the objectives are carefully formulated after a thorough
    analysis of the literature articles. The deep learning model is discussed in Section
    4.4 along with the results and discussion in Section 4.5. Concluding remarks for
    this chapter are presented in Section 4.6 followed by the references which are
    cited in the text.


    # 4.2 LITERATURE SURVEY


    The deficit secretion of insulin by the pancreas causes DM. As the blood sugar
    level increases, DM progresses; DM affects the flow of blood in the circulatory
    system, including the retina, and causes damage to the vascular structure in the
    human body, which in turn decreases vision for the patient, leading to DR.


    To detect DR at its early stages [25], researchers have used support vector machine
    (SVM), sequential minimal optimization (SMO), random forest, and naive Bayesian
    (NB) for classification. Nearly, 90% of accurate results for diagnosis are achieved
    using the above methods.


    In this work [26], the conditions of DM are categorized as normal and abnormal
    using wavelet features with an accuracy level of 92.5%. The optic disc is detected
    using Karhunen–Loeve Transform (KLT) to identify DM from the images of the retina
    [8], by segmenting the major blood vessels. The accuracy achieved is about 91.5%
    with reduced computation time for histograms. The main disadvantage is that the
    effective output is not achieved and also the contrast of the image is very low.
    DR [9] may lead to vision loss if left untreated. Researchers have used discrete
    cosine transform (DCT) and k-nearest neighbor (k-NN) to classify DR [27].


    A robust method for feature extraction followed by k-means clustering is used
    by the researchers for DR identification from the retinal images [10] with an
    accuracy of 95%. Artifacts cause some information to be lost if this method is
    used. The shape of the optical disc varies with severity [28–37]. The presence
    of blood vessels increases the complexity of diagnosis. So, the optical disc is
    divided into small regions of interest for area calculation and to exert the relevant
    features [11], facilitating the early detection carried out using an adaptive
    mask with variable configurations and fuzzy logic for classification. Thus, the
    methods proposed by the researchers depend on analysis of the retinal images.
    From these images, features are extracted and categorized as per the severity
    of the existing conditions [38–46].'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 4.3 RESEARCH GAP


    Based on the survey analysis, novel methods for noise removal, feature extrusion,
    reduction, and classification for early diagnosis of DR with robustness are an
    added highlight for this work. Sensitivity and specificity are used for evaluation
    of the performance.


    # 4.4 OBJECTIVES AND RESEARCH HIGHLIGHTS


    # 4.4.1 Objectives


    As per the analysis of the literature, existing methods based on retinal segmentation
    are not efficient for image-based classification which is a main challenge for
    improving the segmentation accuracy and extending the single-modal data source
    to multi-modal data source. The research outcome of this work is develop a software
    product. To transform the research outcomes of this work into a software product,
    detect DR and perform segmentation, thus helping in the treatment of the patient
    and rescuing the life. The objective is to invent methods to resolve the identified
    issues and devise a method that helps in the early diagnosis of DR. Thus, the
    main aim is to design a robust and efficient DR detection scheme based on segmentation
    of retinal images from fundus camera using the deep learning neural network (DLNN)
    model embedded in IoT by emphasizing on accuracy, sensitivity, and specificity.
    The proposed outcome is to design a robust and efficient algorithm for deep learning
    neural networks for the segmentation of fundus retinal images with the simulation
    of DLNN models for segmentation, RoI extraction, and routing in IoT, focusing
    on performance metrics such as appropriateness measures. If a software product
    is developed using embedded technology, focusing on feasibility and utilization,
    it can help the medical experts to diagnose DM at an early stage from the retinal
    images and to start the treatment accordingly.


    # 4.4.2 Research Highlights


    The research highlights include:


    +   • Identification of NL, NPDR, and PDR from the retinal fundus images

    +   • To implement healthcare IoT (HIoT)

    +   • RA-UNet for segmentation

    +   • Adaptive threshold (AT) for RoI extraction

    +   • Diagnosis using deep learning neural models with and without optimization
    techniques like SSOA and CAViaR'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 4.5 A FRAMEWORK FOR DLNN APPROACH FOR DM DIAGNOSIS


    Information transfer takes place by advanced communication between the devices
    using recent technology like IoT [5,38–43]. Besides, IoT has been widely adopted
    to design and promote healthcare systems [8], due to its effective capability.
    IoT is projected to play a very important role in the field of healthcare, called
    the HIIoT [19,44–46]. Many non-invasive medical imaging methods offer high-level
    contrast. The analysis of the retinal fundus images is an important step in planning
    the diagnosis followed by the segmentation process [1].


    DLNN can solve the problem of early detection of DM from the retinal images as
    they work. Indeed, images containing artifacts are denoized and fed to the input
    of the learning process with generalization capabilities [4]. Thus, the primary
    intention of this research will be to develop a method for early detection of
    DR to prevent loss of vision and implement the same with IoT, which can resolve
    classification of fundus images [9].


    In Ref. [14], the authors have introduced a new multiple category with simple
    meta-heuristic algorithms. Such models are inspired by using the instinct of animals
    by a shepherd. This algorithm is called the shuffled shepherd optimization algorithm
    (SSOA). As per this algorithm, the primary and initial step is that the agents
    are separated into multi-communities and the optimization is inspired by the behavior
    of a shepherd in nature operating on each community. In the process of optimization,
    attention is paid to both good and bad agents, leading to better performance of
    the algorithm.


    # 4.5.1 Shuffled Shepherd Optimization Algorithm (SSOA)


    In nature, optimal ways of living by animals use instincts to find the best way
    of living. Horses have an instinct to find the best stiff and fast way. Road engineers
    in the past have used this trail for constructing new roads. Shepherds use one
    or more horses in the herd to move their tools and find the way and this shepherd’s
    behavior has been an inspiration for authors using mathematical modeling for optimization
    [14].


    # 4.5.2 Conditional Autoregressive Value at Risk (CAViaR)


    In Ref. [15], authors have proposed an approach to quantize an estimation method
    called CAViaR. Instead of modeling the whole distribution, the quantized model
    is developed directly. Thus, the authors propose a'
  merge: -1
  img_proc: true
