- pgno: 44
  md: '+   **Optimizer**: The optimizer is the algorithm that is used to update the
    weights of the neural network during training to minimize the loss function. ‘Adam’
    is a popular optimizer in DL.


    +   **Loss function**: The loss function quantifies the difference between the
    predicted values and the actual values showing how well the model performs on
    the training data and guides the optimization process. For binary classification
    problems like this one, ‘binary_crossentropy’ is commonly used.


    +   **Metrics**: Metrics are used for evaluating the performance of the model
    during training and testing. ‘Accuracy’ is used, which measures the proportion
    of correctly classified samples.


    The model is trained twice. The former is split into testing (67%) and training
    (33%), and the latter is split into training and validation. Model training involves
    adapting the model weights to the training dataset. This entails repeating multiple
    epochs of training the model with the training data. This is done by using a cost
    function and minimizing this function using an optimization algorithm such as
    Gradient Descent. The goal is to minimize the difference between the model predictions
    and the actual values for the training dataset. After training, the model can
    make predictions on unseen data.


    To train a model using Keras, we use the “fit” method of the model object. This
    takes as input the training dataset and associated target labels, as well as the
    number of epochs (iterations) and batch size (number of examples used to update
    the model weights each time).


    # 2.2.7 Model Evaluation


    It entails calculating the model’s accuracy and loss, among other measures, to
    gauge its performance. If we do not use validation split when training the model
    with Keras, we will not be able to measure the performance of the model on an
    independent dataset during training. This can lead to an overestimation of the
    model’s performance on the training data, which is often called overfitting. This
    can manifest as a decrease in the loss of the training data over epochs. This
    means that the model starts memorizing the training data instead of generalizing
    the relationships to new data. It is therefore important to use validation split
    to evaluate the performance of the model on independent data during training.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Model performance was evaluated on both training and testing sets using the
    evaluate method:


    +   - **Training accuracy:** Measured to assess model fit to the training data.

    +   - **Testing accuracy:** Measured to assess model generalizability to unseen
    data.


    # 2.3 RESULT AND ANALYSIS


    Various metrics, including accuracy, precision, recall, and F1-score, were used
    to assess the performance of the model. Without the validation split, the training
    accuracy was determined to be 75.34%, while the testing accuracy reached 74.21%.
    The precision, recall, and F1-score were all calculated to be 0.7420, with a total
    support of 21,971 instances. With the validation split, the training accuracy
    slightly decreased to 74.34%, while the validation accuracy increased to 74.38%.
    Similarly, the precision, recall, and F1-score were all consistent at 0.7437,
    with a support of 21,971 instances. The confusion matrix with the validation split
    parameter revealed that the model had a higher precision for predicting negative
    instances (0.81) compared to positive instances (0.70), while recall was higher
    for positive instances (0.85) compared to negative instances (0.64). These metrics
    collectively demonstrate the model''s ability to accurately classify instances
    of DM, highlighting its effectiveness in disease detection and risk assessment.


    The validation split is crucial for evaluating the model''s performance on an
    independent dataset. Without it, the model may overfit, resulting in a decrease
    in the loss of training data over epochs. Therefore, it''s essential to use validation
    split to measure the model''s performance on the independent dataset, preventing
    overfitting and ensuring accurate training data evaluation (Figures 2.4 and 2.5).


    # 2.4 DISCUSSION


    The results of the deep learning model trained to predict DM based on physiological
    data exhibit promising performance metrics. Both scenarios, with and without the
    validation split, achieved comparable accuracies, indicating the robustness of
    the model. The precision, recall, and F1-score metrics further validate the effectiveness
    of the model in correctly identifying instances of DM. However, the model exhibited
    a small decrease in accuracy from training to testing, suggesting some degree
    of overfitting. This implies that the model might have memorized'
