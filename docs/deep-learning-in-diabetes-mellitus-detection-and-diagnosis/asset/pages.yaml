    In Ref. [27], Lee et al. presented an innovative approach to diabetes detection
    through the use of high-frequency ultrasound and deep learning techniques, namely
    a CNN-based model that achieved 98% accuracy in efficiency evaluation. The fundamental
    idea of the authors has its foundations in observed phenomena that glucose tends
    to gradually build up in the red blood cells forming glycated hemoglobin on their
    outer layer. The deep learning algorithm was applied to monitor changes in the
    red blood cells and detect any relations between these and glucose levels and
    signal data.


    In Ref. [28], Nadesh et al. implemented a deep neural network model as an unsupervised
    approach toward diabetes detection based on the PID database. In data preparation,
    many techniques were applied such as dimensionality reduction to help mitigate
    possible overfitting, filter, and wrapper methods, and for determining the most
    valuable features, extremely randomized trees (feature importance [28]) were used.
    Feature importance helps to establish the features with the highest significance
    for later classification by providing a reduction in bias. The proposed method
    obtained 98.16% accuracy in performance evaluation (Table 8.1).


    # 8.4 DISCUSSION


    As the process of detecting and properly diagnosing diabetes mellitus, especially
    in early stages, may be challenging, it is vital to establish reliable and efficient
    methods.


    The efficacy and benefits of adapting deep learning methods such as CNNs, RNNs,
    LSTM functionality, and fuzzy logic are prominent. It is noticeable, for example,
    in the increased interest in deep learning methods application in the medical
    field, their helpfulness for human experts, and their general high performance,
    as well as in the growing number of research papers published in this area of
    concern (Figure 8.3).


    The highest performing models are based on hybrid approaches that not only combine
    and mix different deep learning algorithms but also combine different feature
    augmentation and pre-processing techniques. Through trial and error, the best
    combinations can be established and then further improved. These ideas can then
    be implemented and utilized in practice, here in healthcare to ameliorate the
    process of diabetes mellitus diagnosis and even enable effective prediabetic state
    detection.'
