    # 12.5.1 VGG-16


    VGG-16 [36] stands out as a CNN architecture meticulously crafted for image classification
    tasks. Originating from the Visual Geometry Group at Oxford University, the term
    “VGG-16” specifically denotes a neural network characterized by 16 weight layers,
    encompassing three fully connected layers and 13 convolutional layers. This architecture
    gained widespread recognition due to its simplicity and memorable efficacy in
    image recognition processes. The design principles of VGG-16 include the use of
    3×3 convolutional filters with one stride, activation functions employing rectified
    linear units (ReLU), and the incorporation of 2×2 max-pooling layers with two
    strides. Renowned for its straightforward yet powerful structure, VGG-16 serves
    as a benchmark model in the field of deep learning and often serves as a standard
    for analyzing the performance of other sophisticated neural network models (Figures
    12.3, 12.4, and Table 12.4).


    # 12.5.2 VGG-19


    The VGG-19 is a CNN architecture. It belongs to the VGG family, which is noted
    for its simplicity and efficacy in picture classification tasks. VGG-19 is made
    up of 19 layers, the first 16 of which are convolutional, followed by three fully
    linked layers. The convolutional layers are divided into five blocks, with every
    block consisting of numerous convolutional layers followed by max-pooling layers.
    The implementation of modest 3×3'
