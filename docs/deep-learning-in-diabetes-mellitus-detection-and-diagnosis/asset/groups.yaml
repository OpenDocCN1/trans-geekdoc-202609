    ## 使用深度学习从生理数据中进行糖尿病的预处理与检测


    Muskan Sah, Prajwal Kulkarni, Pranav Sehgal, 和 Akila Victor


    ### 2.1 引言


    鉴于其发病率在过去几十年中逐渐上升，糖尿病（DM）对全球健康构成严重威胁。国际糖尿病联合会（IDF）估计，到 2030 年，全球 20–79 岁的成年中将有
    6.43 亿人患有糖尿病（DM），较 2021 年估计的 5.37 亿人有所增加 [1]。这凸显了对糖尿病（DM）诊断、预后和治疗高效方法的迫切需求。糖尿病（DM）是一组以显著血糖水平升高为特征的代谢性疾病，由胰岛素分泌、胰岛素功能或两者缺乏引起
    [2]。如果糖尿病得不到控制，可能导致神经病变、肾病、心血管疾病和视网膜病变等严重并发症，这对个人和医疗系统来说成本高昂 [3]。


    早期糖尿病检测和管理对于预防并发症和改善患者结局至关重要。虽然血液检测和临床评估常用于传统的糖尿病（DM）诊断技术，但它们可能并不总能识别出微妙的早期迹象或风险因素。因此，越来越多的关注被用于利用包括深度学习在内的前沿计算方法，以提高糖尿病检测模型的预后潜力。


    本研究使用行为危险因素监测系统（BRFSS）数据集，以探讨深度学习技术在糖尿病（DM）数据预处理和糖尿病预后改善中的应用 [4]。作为世界上最大的与健康相关的电话调查系统之一，BRFSS
    提供了关于广泛的美国人群中不同健康行为、慢性疾病和预防性服务使用情况的大量信息。本研究在现有研究基础上，通过调查使用 Keras 库（TensorFlow
    后端）的深度学习方法检测糖尿病的有效性来拓展现有研究。该数据集包含从 303 个独特变量中选取的 25 个特征，以糖尿病列作为目标变量，并经过清洗、平衡和预处理，以确保数据质量和平衡。


    通过采用能够利用大规模健康数据与最先进的深度学习算法相结合的特征选择和缺失值插补方法，我们希望通过这项研究对快速发展的计算医疗保健领域产生积极影响。


