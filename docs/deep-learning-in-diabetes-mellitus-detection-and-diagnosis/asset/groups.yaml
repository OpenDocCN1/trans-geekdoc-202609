    ## Automated Early Detection of Diabetes Mellitus from Retinal Fundus Images Using
    Residual U-Net Approach


    K. Sujatha, R.S. Ponmagal, N. Janaki, N.P.G. Bhavani, and SuQun Cao


    ### 4.1 INTRODUCTION


    Diabetes mellitus (DM) is considered to be the deadliest disease prevailing across
    the world. Early diagnosis of DM plays a paramount role in increasing the patient’s
    survival rate. Recent development in the medical and technological fields offers
    directions to improvise the methodology of detecting and segmenting the retinal
    images to confine the location in helping the medical practitioners to focus on
    the problem and treat the patient with accurate procedures. To predict and segment
    the retinal images, many approaches have been proposed recently. Since deep learning
    methods play prominent roles in DM detection and segmentation, these two approaches
    are considered [1–11]. Also, as IoT is leading the technological advancement in
    connecting devices across the globe, integrated IoT-based routing is used with
    the above methods to fine-tune and locate the precise location of cancerous cells
    in the bone. The main challenges faced by bone cancer segmentation and IoT routing
    techniques are explained here [12,13]. In Ref. [14], the classification of the
    images is a major challenge using fully convolution networks (FCNs) architecture.
    The devised AGResU-Net in Ref. [10] failed to consider a clinical segmentation
    model to improve the segmentation accuracy.


    In Ref. [15], segmentation using textural features and sparse kernel coding was
    developed for segmenting the bone cancers, but the major challenge lies in extending
    the single-dimensional data source to a multi-dimensional data source, thereby
    segmenting the non-normal retinal region tissues from the normal portion. Thus,
    the proposed project develops a method that resolves the identified issues and
    provides accuracy, sensitivity, specificity, and region of curve parameters along
    with emphasizing the performance measures such as fitness measures [16–24]. An
    embedded-based software product helps medical professionals, doctors, specialists,
    researchers, and other experts in the medical field to diagnose DM at an early
    stage and start the treatment accordingly (Figure 4.1).


    The chapter is organized in such a way that Section 4.1 gives an introduction
    to diabetic retinopathy (DR). A literature survey is carried out to identify the
    methods discussed by the researchers in Section 4.2. The existing challenges that
    are prevailing are identified from the literature survey and discussed in Section
    4.3 which comprises the gaps existing in the research field. The research gaps
    are identified and the objectives are carefully formulated after a thorough analysis
    of the literature articles. The deep learning model is discussed in Section 4.4
    along with the results and discussion in Section 4.5. Concluding remarks for this
    chapter are presented in Section 4.6 followed by the references which are cited
    in the text.


