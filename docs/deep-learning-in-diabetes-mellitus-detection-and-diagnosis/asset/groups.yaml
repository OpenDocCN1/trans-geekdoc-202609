    ## 7.6.2 测试


    使用德国医院数据集训练的分类模型已存储。这些模型使用 PIDD 进行测试。PIDD 数据集对模型来说是完全新的医疗记录，因为该数据集在训练期间未被使用。这样做是为了展示所开发模型在可靠检测准确性方面的鲁棒性和有效性，以及所提模型的泛化性和适应性。测试准确率结果和性能指标比较如表
    7.5 和 7.6 所示。对于同一数据集，提议的 DLM 优于其他 ML 模型和文献 [8,23] 中的结果。提议的 DLM 未能分类十个样本。这十个样本编号及其异常参数如表
    7.7 所示。表 7.7 中列出的参数具有不规则值，这可能成为实现 100% 测试准确率的障碍。PIDD 数据集的分类测试准确率为 98.7%，这证明了所提议
    DLM 的鲁棒性、可靠性和有效性。


    ## 7.6.3 未来工作


    使用深度学习进行 DM 检测的未来工作范围有几个待进一步探索的领域。关键领域包括大型数据集的精度提升、早期预测和预防、与基于边缘计算的可穿戴设备集成，以及部署成本低廉到所有人都能负担得起。为了进一步探索
    DLM（例如使用预训练模型实现），需要大型数据集。一旦从各地理位置收集到大型数据集可用，使用基于迁移学习的 DLM 就是可能的。此外，还有进一步的范围来研究儿童和青少年的
    DM 检测。然后，可以进一步调查所提议 DLM 的性能。目标将是开发一个简单的模型，用于检测 DM，而不考虑性别、年龄或种族。


