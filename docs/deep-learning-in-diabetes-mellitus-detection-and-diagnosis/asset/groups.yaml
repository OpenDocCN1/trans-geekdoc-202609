    ## 4.5 基于DLNN的DM诊断方法框架


    信息传输通过使用诸如物联网（IoT）[5,38–43]等最新技术在设备之间进行高级通信。此外，由于其高效能力，物联网已被广泛用于设计和推广医疗保健系统 [8]。物联网预计将在医疗保健领域发挥非常重要的作用，即HIIoT
    [19,44–46]。许多非侵入性医学影像方法提供高对比度。视网膜眼底图像的分析是规划诊断随后进行分割过程的重要步骤 [1]。


    DLNN可以在处理视网膜图像时解决早期糖尿病（DM）检测问题。确实，包含伪影的图像会被去噪并输入到具有泛化能力的学习过程 [4]。因此，本研究的主要目标是开发一种早期糖尿病视网膜病变（DR）检测方法，以防止视力丧失，并利用物联网实现该方法，从而解决眼底图像分类问题
    [9]。


    在文献 [14]中，作者引入了一种基于简单元启发式算法的新多类别模型。此类模型受牧羊人利用动物本能的启发。该算法称为混沌牧羊人优化算法（SSOA）。根据该算法，主要和初始步骤是将智能体分离到多个社区中，优化灵感来自大自然中牧羊人对每个社区的行为。在优化过程中，既关注好的智能体也关注不好的智能体，从而提高算法性能。


    ### 4.5.1 混沌牧羊人优化算法（SSOA）


    在大自然中，动物的最优生存方式利用本能来寻找最佳的生活方式。马匹本能地寻找最坚固和最快的路径。过去的道路工程师曾利用这条路径修建新路。牧羊人使用牛群中的一匹或多匹马来搬运工具并寻找道路，而这种牧羊人的行为启发了作者使用数学建模进行优化
    [14]。


    ### 4.5.2 有条件自回归风险价值（CAViaR）


    在文献 [15]中，作者提出了一种名为CAViaR的估计方法量化方案。它不是对整个分布进行建模，而是直接开发量化模型。因此，作者提出了一种名为CAViaR的有条件自回归规范。首先，将进行物联网仿真，分散的节点将收集患者信息。此后，将使用所提出的混沌牧羊人鱼子酱优化（SSCO）进行路由，它是混沌牧羊人优化算法（SSOA）[14]和CAViaR
    [15]的集成。在此，将考虑能量、信任和距离等适应度指标。此外，将在基站（BS）进行视网膜图像分割。在此，输入视网膜图像将呈现给预处理阶段，该阶段将基于使用自适应阈值（AT）技术进行的感兴趣区域（RoI）提取来执行。之后，视网膜图像分割将由残差注意感知分割方法（RA-UNet）[16]执行，该方法将由所提出的SSCO技术训练，并如图4.2所示。


    ![](img/7df621e14c1a5d96077d3e56e3977008_72_0.png)


    图4.2 所提技术的框图表示。


    ## 4.6 结果与讨论


    图像分析是在包含通过眼底相机获取的NL、NPDR和PDR视网膜状况的视网膜眼底图像数据库上进行的 [1,2]。NL、NPDR和PDR类别用于诊断。该数据库共有323幅视网膜图像，来自Kaggle，分类为NL、NPDR和PDR。其中，约150幅图像属于NL类别，125幅属于NPDR类别，48幅属于PDR类别。从视网膜眼底图像中提取特征，这是一幅RGB图像，当分别分析绿色像素时具有高对比度。AT用于增强RoI中特征相对于背景的对比度。使用5×5掩码进行噪声消除。通过暗背景上的白色区域识别血管，如图4.3所示。滤波后的图像使用AT技术转换为二值图像，其最优阈值为0.138。AT后得到的输出图像在图4.4中显示为不连续的线条。为了评估所提方法的效率，对123幅测试图像进行了实验，分为50幅NL、40幅NPDR和33幅PDR。在使用本模型测试图像后


    ![](img/7df621e14c1a5d96077d3e56e3977008_73_0.png)


    图4.3 血管检测。


    ![](img/7df621e14c1a5d96077d3e56e3977008_73_1.png)


    图4.4 使用AT识别视网膜受影响区域。


    TABLE 4.1 糖尿病视网膜病变诊断混淆矩阵


