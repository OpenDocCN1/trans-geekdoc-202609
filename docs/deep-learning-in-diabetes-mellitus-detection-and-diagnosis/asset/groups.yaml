    ## 3.1 引言


    当胰腺无法产生足够的胰岛素时，就会发生 1 型糖尿病（T1D），导致血糖（BG）水平升高（高血糖，定义为 BG > 180 mg/dL）。为了管理病情并将
    BG 水平维持在正常范围（70–180 mg/dL），1 型糖尿病患者依赖胰岛素泵和胰岛素补量注射等胰岛素输注方式。如果没有妥善管理，发生低血糖（BG <
    70 mg/dL）或高血糖的风险显著增加，这可能导致严重并发症，包括肾脏问题、视力问题乃至失明。


    为了预防这些严重的健康问题，1 型糖尿病患者积极监测和管理自身 BG 水平至关重要。在这方面，连续血糖监测（CGM）系统已成为重要工具，可每 5 分钟追踪一次
    BG 水平波动。借助 CGM 提供的详细数据，研究人员开发了多种血糖水平预测（BGLP）模型。这些模型使 1 型糖尿病患者能够主动调整胰岛素剂量和膳食摄入，显著增强其维持稳定
    BG 水平并降低并发症风险的能力。


    在 BGLP 中，历史数据通常被结构化为多元时间序列（MTS），以纳入与预测任务相关的各种属性。自 2020 年以来，基于神经网络（NN）的方法已显示出优于传统非
    NN 方法的性能，这一点在 BGLP 2020 挑战赛中尤为突出。在这些进展中，Oreshkin 等人（2020）提出的面向时间序列的神经基础展开分析（N-BEATS）已被
    Rubin-Falcone 等人（2020）应用。当时，N-BEATS 是时间序列分析的领先方法，其基于 N-BEATS 的解决方案在挑战赛中脱颖而出，荣获第一名。


    尽管取得了这些成就，但一个显著的局限性依然存在：这些模型在预测过程中对不同属性（如血糖水平、胰岛素补量和指尖血糖测试）的重要性提供的洞察有限。这种属性重要性解释的缺失不仅存在于
    N-BEATS 中，也存在于其他依赖循环神经网络（RNN）架构（如长短期记忆网络 LSTM；Hochreiter and Schmidhuber, 1997；Yang
    et al., 2020）的当代 BGLP 方法中。这些方法可以捕捉时间依赖性，但在透明地建模属性之间的互连方面存在不足。这一局限性的重要性不容忽视，因为许多临床医生和医疗专业人员优先考虑理解预测模型的决策过程。能够解读不同属性如何影响预测对于这些技术的临床接受度和信任至关重要。


    因此，这些方法的一个关键局限性是无法量化和解释 BGLP 环境中每个属性的重要性。为了弥补这一差距，图神经网络（GNN）的进展提供了一条有希望的途径，特别是那些使用具有可调整边权重的动态图的方法。图注意力网络（GAT；Velickovic
    等人，2018）使得基于相邻节点张量的边权重在学习过程中可调整。随后，Brody 等人（2022）开发了增强版本 GATv2，它融入了更动态的注意力机制，提供了更强的模型表达能力。GAT
    和 GATv2 的这些创新通过调制边权重，促进了 BGLP 中属性重要性的解释。

