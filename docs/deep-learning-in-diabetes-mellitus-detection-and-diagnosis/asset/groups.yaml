    ### 4.2 LITERATURE SURVEY


    The deficit secretion of insulin by the pancreas causes DM. As the blood sugar
    level increases, DM progresses; DM affects the flow of blood in the circulatory
    system, including the retina, and causes damage to the vascular structure in the
    human body, which in turn decreases vision for the patient, leading to DR.


    To detect DR at its early stages [25], researchers have used support vector machine
    (SVM), sequential minimal optimization (SMO), random forest, and naive Bayesian
    (NB) for classification. Nearly, 90% of accurate results for diagnosis are achieved
    using the above methods.


    In this work [26], the conditions of DM are categorized as normal and abnormal
    using wavelet features with an accuracy level of 92.5%. The optic disc is detected
    using Karhunen–Loeve Transform (KLT) to identify DM from the images of the retina
    [8], by segmenting the major blood vessels. The accuracy achieved is about 91.5%
    with reduced computation time for histograms. The main disadvantage is that the
    effective output is not achieved and also the contrast of the image is very low.
    DR [9] may lead to vision loss if left untreated. Researchers have used discrete
    cosine transform (DCT) and k-nearest neighbor (k-NN) to classify DR [27].


    A robust method for feature extraction followed by k-means clustering is used
    by the researchers for DR identification from the retinal images [10] with an
    accuracy of 95%. Artifacts cause some information to be lost if this method is
    used. The shape of the optical disc varies with severity [28–37]. The presence
    of blood vessels increases the complexity of diagnosis. So, the optical disc is
    divided into small regions of interest for area calculation and to exert the relevant
    features [11], facilitating the early detection carried out using an adaptive
    mask with variable configurations and fuzzy logic for classification. Thus, the
    methods proposed by the researchers depend on analysis of the retinal images.
    From these images, features are extracted and categorized as per the severity
    of the existing conditions [38–46].


    ### 4.3 RESEARCH GAP


    Based on the survey analysis, novel methods for noise removal, feature extraction,
    reduction, and classification for early diagnosis of DR with robustness are an
