    他担任波兰科学与高等教育部面向高素质学生的“金钻奖学金”和“最佳之最”项目的科学导师。他曾在波兰、意大利和立陶宛的大学，以及由国家研究与发展中心及国外资助的、在\
    \ IT 行业具有应用成果的项目中参与多项科学项目（担任首席调查员、科学调查员、经理、参与者和顾问）。他曾在意大利、瑞典和德国的大学担任访问研究员。\n\n\
    他撰写或合著了 300 余篇国际会议和期刊论文。他当前的研究兴趣包括神经网络及其应用，以及模糊逻辑与控制的各个方面，由进化计算加速的应用计算智能，以及联邦学习模型。\n\
    \n2017 年，他获波兰科学与高等教育部颁发杰出青年科学家奖学金。2021 年和 2024 年，他两次获得波兰科学与高等教育部颁发的科研成就奖。2020\
    \ 年、2021 年、2022 年和 2023 年，他因职业成就入选斯坦福大学“世界前 2% 科学家”。他还入选 Research.com 波兰最佳计算机科学科学家名单。他是《Biomedical\
    \ Signal Processing and Control》、《Sensors》、《Machine Learning with Applications》、《Pattern\
    \ Analysis and Applications》等期刊的编辑委员会成员或编辑。他还担任特刊客座编辑，包括 IEEE Journal Biomedical\
    \ and Health Informatics、IEEE Access、Measurement、Sustainable Energy Technologies\
    \ and Assessments、Frontiers in Human Neuroscience、PeerJ CS、International Journal\
    \ of Distributed Sensor Networks、Computational Intelligence and Neuroscience、Journal\
    \ of Universal Computer Science 等。他还是多个国际会议和研讨会的分会主席，包括 IEEE Symposium Series\
    \ on Computational Intelligence、IEEE Congress on Evolutionary Computation 和 International\
    \ Joint Conference on Neural Networks。\n\n"
