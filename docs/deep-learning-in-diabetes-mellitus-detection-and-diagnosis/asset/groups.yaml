    A total of 25 features were meticulously chosen from the original 303 features
    based on their potential relevance to diabetes prediction [5]. The following are
    significant risk factors for diabetes and other chronic illnesses like heart disease,
    according to research in the field (not in a strict order of importance) (Table
    2.1).


    ### 2.2.3 Data Preprocessing


    The data preprocessing phase involves several steps to ensure data quality and
    consistency. The steps applied were compiled from a BRFSS 2015 Codebook implementation
    [6]. Missing values are handled by using a function called _dropna()_ which removes
    rows or columns with missing values (NaN) from a data frame. Duplicates are removed
    to prevent redundancy, and categorical variables are encoded or transformed as
    needed. Additionally, continuous variables may be standardized or normalized to
    ensure uniform scaling across features.


    ### 2.2.4 Data Balancing


    The number of negative samples (people without diabetes) in the original dataset
    was higher than the number of positive samples (people with diabetes), indicating
    a class imbalance. To create a balanced dataset, a 50–50 split between positive
    (diabetes) and negative (no diabetes) samples is achieved through a resampling
    technique called under-sampling. Under-sampling involves reducing the size of
    the majority class (in this case, samples with no diabetes, labelled as 0) to
    match the size of the minority class (samples with pre-diabetes and diabetes,
    labelled as 1 and 2). By randomly selecting a subset of the majority class instances,
    the resulting dataset achieves a more balanced distribution between the classes.
    In this specific case, both the no-diabetes and diabetes classes are down sampled
    to 33,289 instances each, resulting in a balanced dataset.


