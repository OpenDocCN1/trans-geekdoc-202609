    ## Graph-Based Explainable Method for Blood Glucose Prediction through Federated
    Learning


    Chengzhe Piao and Kezhi Li


    ## 3.1 INTRODUCTION


    Type 1 diabetes (T1D) occurs if the pancreas fails to generate sufficient insulin,
    resulting in elevated blood glucose (BG) levels (hyperglycemia, defined as BG
    > 180 mg/dL). To manage their condition and maintain BG levels within the normal
    range (70–180 mg/dL), individuals with T1D rely on insulin delivery methods such
    as pumps and bolus injections. Without proper management, there is a significant
    risk of experiencing hypoglycemia (BG < 70 mg/dL) or hyperglycemia, which can
    lead to severe complications, including kidney issues, vision problems, and even
    blindness.


    To prevent these serious health issues, it is crucial for people with T1D to actively
    monitor and manage their BG levels. Continuous glucose monitoring (CGM) systems
    have become a vital tool in this regard, offering the ability to track BG level
    fluctuations every 5 minutes. Leveraging the detailed data provided by CGM, researchers
    have developed a variety of predictive models for blood glucose level prediction
    (BGLP). These models enable individuals with T1D to proactively adjust their insulin
    dosages and dietary intake, significantly enhancing their ability to maintain
    stable BG levels and mitigate the risk of complications.


    In BGLP, historical data is often structured as multivariate time series (MTS)
    to incorporate various attributes relevant to the prediction task. Since 2020,
    neural network (NN)-based methodologies have demonstrated superior performance
    over traditional non-NN approaches, particularly highlighted during the BGLP 2020
    Challenge. Among these advancements, Neural Basis Expansion Analysis for Time
    Series (N-BEATS) (Oreshkin et al., 2020) has been applied by Rubin-Falcone et
    al. (2020). N-BEATS was a leading approach for time-series analysis at the time,
    and their N-BEATS-based solution notably secured first place in the challenge.
    Despite these achievements, a significant limitation remains: These models offer
    limited insight into the significance of different attributes, such as glucose
    levels, bolus, and finger sticks, in the prediction process. This lack of attribute
    importance explanation is a gap not only in N-BEATS but also in other contemporary
    BGLP methodologies that rely on recurrent neural network (RNN) architectures like
    long short-term memory (LSTM; Hochreiter and Schmidhuber, 1997; Yang et al., 2020).
    These approaches can capture temporal dependencies but fall short in transparently
    modeling the interconnections among attributes. The importance of this limitation
    cannot be understood, as many clinicians and healthcare professionals prioritize
    understanding the decision-making process of predictive models. The ability to
    interpret how different attributes influence predictions is crucial for clinical
    acceptance and trust in these technologies.


    Therefore, a critical limitation of these approaches is their inability to quantify
    and explain the significance of each attribute within the BGLP context. To address
    this gap, advancements in graph neural networks (GNNs) present a promising avenue,
    particularly those employing dynamic graphs with adaptable edge weights. Graph
    attention networks (GATs; Velickovic et al., 2018) enable the edge weights, predicated
    on the adjacent node tensors, to be adjustable during the learning process. Subsequently,
    Brody et al. (2022) developed an enhanced version, GATv2, which incorporates a
    more dynamic attention mechanism, offering increased model expressiveness. These
    innovations in GAT and GATv2 facilitate the explanation of attribute significance
    in BGLP through the modulation of edge weights.

