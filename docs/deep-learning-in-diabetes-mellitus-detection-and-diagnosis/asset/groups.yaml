    \n### 1.1 糖尿病的全球负担\n\n糖尿病（DM），通常简称为糖尿病，是一种以异常高血糖（葡萄糖）水平为特征的慢性代谢疾病。这种高血糖是由于胰岛素分泌缺陷、胰岛素抵抗（身体对胰岛素的反应）或两者兼有引起的。\n\
    \n以下是DM的关键方面[1]：\n\n- **慢性：** 糖尿病是一种长期疾病，需要贯穿个人一生的持续管理。\n- **代谢紊乱：** 它破坏了身体正常的代谢过程，特别是身体利用葡萄糖供能的方式。\n\
    - **高血糖：** 糖尿病的典型特征是血糖升高。通常，身体会将血糖严格调节在较窄的范围内。在糖尿病中，这种调节受到损害，导致慢性高血糖。\n- **胰岛素缺陷：**\
    \ 胰岛素是由胰腺产生的一种激素，像钥匙一样作用，允许葡萄糖从血液进入细胞并被用于供能。在糖尿病中，要么胰腺不能产生足够的胰岛素，要么身体细胞对胰岛素的作用产生抵抗，或者两者兼有。\n\
    \n糖尿病有多种类型，病因各异，但都共同具有高血糖这一特征。早期检测和适当管理对于预防与慢性高血糖相关的严重健康并发症至关重要。\n\n### 1.2 揭示糖尿病（DM）的不同面貌\n\
    \n虽然高血糖这一核心问题定义了糖尿病，但其潜在病因可能不同。DM最常见的类型如下[2]：\n\n### 1.2.1 1型糖尿病（T1D）\n\n身体的免疫系统错误地攻击胰腺中产生胰岛素的β细胞，导致胰岛素缺乏。这通常在童年或青年时期被诊断出来，需要终身胰岛素注射或使用胰岛素泵来调节血糖水平。\n\
    \n### 1.2.2 2型糖尿病（T2D）\n\n身体细胞对胰岛素作用产生抵抗，导致血液中葡萄糖堆积。胰腺可能仍在产生胰岛素，但变得不足。这种情况可在任何年龄发生，但风险随年龄、家族史以及肥胖和缺乏运动等生活方式因素而增加，并可能涉及饮食、运动和体重控制等生活方式调整。口服药物或注射胰岛素等药物也可能是必要的。\n\
    \n### 1.2.3 妊娠期糖尿病（GDM）\n\n这种临时性糖尿病发生在妊娠期间，是由于可能影响胰岛素敏感性的激素变化引起的。这通常在妊娠第二或第三孕期被诊断出来，并常通过饮食调整和运动来控制。在某些情况下，可能需要药物治疗。GDM通常在分娩后消失，但患有GDM的女性在以后的生活中患2型糖尿病的风险更高。\n\
    \n### 1.2.4 DM的其他特定类型\n\n单基因糖尿病（MODY）是由特定基因突变引起的一组遗传性糖尿病形式。青少年成年发病型糖尿病（MODY）是MODY的一个亚型，通常在25岁之前发病。新生儿糖尿病是一种罕见的糖尿病，在出生后的最初几个月内表现出来。继发性糖尿病是由损害胰腺或影响胰岛素作用的疾病或状况引起的（例如，囊性纤维化、胰腺炎和药物）。\n\
    \n### 1.3 糖尿病：迫在眉睫的全球危机\n\nDM不仅仅是一个健康问题；它是一个日益增长的全球威胁。糖尿病的患病率在全世界急剧上升，给个人、医疗保健系统和经济带来了重大负担。让我们深入了解国际糖尿病联合会（IDF）——全球领先的糖尿病组织——报告的令人震惊的统计数据[3]。\n\
    \n- **数字规模：** 根据IDF糖尿病地图集（2021年版），目前全球约有5.37亿成年人（20-79岁）患有糖尿病。这大约相当于地球上每十个成年人中就有一个。\n\
    - **预测描绘出一幅严峻图景：** IDF预测糖尿病病例将急剧上升，预计到2030年将达到6.43亿，到2045年将达到惊人的7.83亿。这意味着在短短二十多年内将增长46%。\n\
    - **未确诊病例加剧了问题：** 一个令人担忧的问题是未确诊病例数量众多。IDF估计，几乎一半（44.7%）的糖尿病成年人不知道自己患有该病。这种缺乏意识的情况延迟了适当的管理，并增加了并发症的风险。\n\
    - **负担不均：** 糖尿病负担分布不均。超过四分之三的糖尿病成年人生活在低收入和中等收入国家。这种差异凸显了这些地区改善医疗保健和糖尿病教育可及性的必要性。\n\
    \n"
