    ### 2.2.6 模型编译与训练


    在 Keras 中，编译是为训练准备模型的过程。编译包括定义几个重要参数。


    - **优化器**：优化器是在训练期间用于更新神经网络权重以最小化损失函数的算法。‘Adam’ 是深度学习中流行的优化器。


    - **损失函数**：损失函数量化预测值与实际值之间的差异，显示模型在训练数据上的表现并指导优化过程。对于像这样的二分类问题，通常使用 ‘binary_crossentropy’。


    - **指标**：指标用于在训练和测试期间评估模型性能。使用‘准确率’，它衡量被正确分类的样本比例。


    模型被训练两次。前者被划分为测试（67%）和训练（33%），后者被划分为训练和验证。模型训练涉及根据训练数据集调整模型权重。这包括使用训练数据对模型进行多个
    epoch 的重复训练。这是通过使用代价函数，并利用梯度下降等优化算法来最小化该函数来完成的。目标是最小化模型预测与训练数据集实际值之间的差异。训练后，模型可以对未见数据进行预测。


    要使用 Keras 训练模型，我们使用模型对象的 “fit” 方法。它以训练数据集和相关目标标签作为输入，以及 epoch（迭代）的数量和批量大小（每次更新模型权重时使用的示例数量）。


    ### 2.2.7 模型评估


    这包括计算模型的准确率和损失等指标，以衡量其性能。如果在使用 Keras 训练模型时不使用验证集划分，我们将无法在训练期间测量模型在独立数据集上的性能。这可能导致对模型在训练数据上的性能高估，这通常被称为过拟合。这可能表现为随
    epoch 增加训练数据的损失下降。这意味着模型开始记忆训练数据，而不是将关系推广到新数据。因此，在训练期间使用验证集划分来评估模型在独立数据上的性能非常重要。


