    在本研究中，我们提出的模型基于原始 GAT 框架（参见第 3.2 节）。尽管 GATv2 具有一定优势，但我们的初步实验并未产生足以证明采用 GATv2 而非
    GAT 合理的显著改进。


    在 BGLP 的 NN 训练和部署方面，近期创新强调通过多任务学习开发个性化模型，Daniels 等人（2020, 2022）对此有所阐述。这种方法与传统方法不同，传统方法需要汇总个体数据来训练广义化的人群模型，随后再用个人数据进行微调。多任务学习能够同时捕捉人群范围的模式和个体特定特征，从而在无需大量微调的情况下生成个性化模型。就部署而言，Zhu
    等人（2021）证明了在微控制器单元上部署基于 LSTM 的模型以实现 T1D 患者实时 BG 预测的可行性。为了进一步拓展技术前沿，Zhu 等人（2022）采用了一种可穿戴设备，内置一款低成本芯片，能够运行基于时间注意力的
    GRU 模型。该方法利用桌面和云平台进行模型微调和数据存储，展示了 NNs 在可穿戴健康监测设备中的实际应用。此外，D’Antoni 等人（2022）使用
    TensorFlow 和 Keras API 工具在边缘设备上直接实现了基于 LSTM 的模型。这种方法为了实时处理能力略微牺牲了预测准确性，但在其应用场景中这是可以接受的。然而，这些方法往往忽略了在为学习人群模式而汇总数据时进行隐私保护这一关键方面。这一疏忽可能会限制参与者招募，进而限制可用训练数据的数量。解决这一挑战对于推进基于
    NN 的 BGLP 方法至关重要，以确保既有效的预测能力又符合隐私标准。


    因此，近期 BGLP 方法的一个显著不足是在训练人群模型时缺乏对隐私保护的考虑。联邦学习（FL）以其去中心化的学习方法为特征，成为解决这一挑战的方案。FL
    旨在利用分布式设备的计算能力，直接在设备产生的数据上执行人工智能（AI）训练任务，从而在数据源处保持数据机密性。模型更新通过一种称为联邦平均（FedAvg）的过程在中央服务器上聚集，该过程由
    McMahan 等人（2017）提出，确保仅共享模型参数而不共享数据。鑒于 FL 在保护参与者隐私的同时促进人群范围模式学习的潜力，本工作探讨了 FL 在
    BGLP 领域的应用。我们的目标是评估将 FL 集成到深度模型训练中的可行性和有效性，旨在平衡预测准确性与隐私保护（参见第 3.2 节）。


