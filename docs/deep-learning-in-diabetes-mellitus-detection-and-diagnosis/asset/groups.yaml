    the training data and guides the optimization process. For binary classification
    problems like this one, ‘binary_crossentropy’ is commonly used.


    +   **Metrics**: Metrics are used for evaluating the performance of the model
    during training and testing. ‘Accuracy’ is used, which measures the proportion
    of correctly classified samples.


    The model is trained twice. The former is split into testing (67%) and training
    (33%), and the latter is split into training and validation. Model training involves
    adapting the model weights to the training dataset. This entails repeating multiple
    epochs of training the model with the training data. This is done by using a cost
    function and minimizing this function using an optimization algorithm such as
    Gradient Descent. The goal is to minimize the difference between the model predictions
    and the actual values for the training dataset. After training, the model can
    make predictions on unseen data.


    To train a model using Keras, we use the “fit” method of the model object. This
    takes as input the training dataset and associated target labels, as well as the
    number of epochs (iterations) and batch size (number of examples used to update
    the model weights each time).


    # 2.2.7 Model Evaluation


    It entails calculating the model’s accuracy and loss, among other measures, to
    gauge its performance. If we do not use validation split when training the model
    with Keras, we will not be able to measure the performance of the model on an
    independent dataset during training. This can lead to an overestimation of the
    model’s performance on the training data, which is often called overfitting. This
    can manifest as a decrease in the loss of the training data over epochs. This
    means that the model starts memorizing the training data instead of generalizing
    the relationships to new data. It is therefore important to use validation split
    to evaluate the performance of the model on independent data during training.'
