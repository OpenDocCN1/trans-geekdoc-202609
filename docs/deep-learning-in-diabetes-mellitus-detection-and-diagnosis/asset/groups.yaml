    原始数据集中负样本（无糖尿病者）的数量高于正样本（糖尿病者）的数量，表明存在类别不平衡。为了创建平衡数据集，通过一种称为欠采样的重采样技术，在正样本（糖尿病）和负样本（无糖尿病）之间实现
    50–50 的划分。欠采样涉及减少多数类（在本例中，即无糖尿病样本，标记为 0）的大小，以匹配少数类（即糖尿病前期和糖尿病样本，标记为 1 和 2）的大小。通过随机选择多数类实例的子集，得到的数据集在类别之间实现了更平衡的分布。在本特定情况下，无糖尿病类和糖尿病类均被下采样至各
