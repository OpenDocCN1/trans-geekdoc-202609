    ## 3.4 讨论


    在将 GAM 与 Ohio 2020 挑战中的顶尖方法进行对比（请参阅表 3.8）时，为确保与其他方法的公平比较，我们的模型使用 OhioT1DM’18 进行预训练，然后使用
    OhioT1DM’20 进行调优。在与其他方法的比较中，我们不使用带 FL 的 GAM，因为 FL 显然会降低预测能力，而我们的主要目标是展示这些深度模型之间的性能差异。


    总体而言，我们提出的模型排名第三。然而，这并不一定意味着它不如前两名模型。例如，基于 N-BEATS 的模型在包含 100 名参与者数据的相当大的数据集上进行预训练，采用独特的策略，例如使用不同超参数同时训练多个模型，并将这些模型预测的中位数作为最终输出。尽管其性能出色，但很难将这种成功完全归因于模型本身，而非所采用的策略。


    ## 3.5 结论


    在本研究中，我们引入了一个名为“GAM”的新概念，即图注意力内存模型。GAM 凭借其可解释性、效率和适应性脱颖而出。它通过注意力机制实现这一点，其中注意力权重突出了属性的重要性，并且注意力权重和图结构都会根据活动节点进行调整。此外，我们将
    FL 与 GAM 集成，使我们能够在保护参与者隐私的同时利用集体洞察。


