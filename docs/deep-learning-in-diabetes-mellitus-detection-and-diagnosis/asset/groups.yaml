    # 2.2.3 Data Preprocessing


    The data preprocessing phase involves several steps to ensure data quality and
    consistency. The steps applied were compiled from a BRFSS 2015 Codebook implementation
    [6]. Missing values are handled by using a function called _dropna()_ which removes
    rows or columns with missing values (NaN) from a data frame. Duplicates are removed
    to prevent redundancy, and categorical variables are encoded or transformed as
    needed. Additionally, continuous variables may be standardized or normalized to
    ensure uniform scaling across features.


    # 2.2.4 Data Balancing


    The number of negative samples (people without diabetes) in the original dataset
    was higher than the number of positive samples (people with diabetes), indicating
    a class imbalance. To create a balanced dataset, a 50–50 split between positive
    (diabetes) and negative (no diabetes) samples is achieved'
