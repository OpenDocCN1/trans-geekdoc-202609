    ## 7.3 方法学


    图7.1展示了用于DM检测的方法学示意图。该方法学包括用于缺失值检测的数据预处理 [23]。数据集被分为三类：训练、验证和测试。一半的数据用于训练，30%保留用于十倍交叉验证，剩余20%用于测试所开发的模型，如图7.2所示。通过ML算法的超参数调优来对模型进行精细调整。本工作中，基于DT、LR、NB、SVM、KNN和集成学习算法（ELA）等ML算法的分类模型被用于DM检测。这些ML分类模型的超参数使用贝叶斯优化进行调优。该优化的关键优势在于，在每次迭代中，参数选择都基于上一次迭代。与在每个阶段随机选择参数不同，该优化从不提供有前途解决方案的相关搜索空间中进行选择。因此，与随机搜索或网格搜索等其他调优方法相比，它需要的迭代次数更少。与使用随机或网格搜索方法对同一模型进行超参数调优相比，这提高了验证准确率并缩短了调优时间
    [25]。


