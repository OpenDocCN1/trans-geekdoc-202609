    ## 12.7 CONCLUSION


    Diabetes patients'' main concern is known to be DR, and detecting DR manually
    is labor-intensive. We therefore created an architecture for the automatic detection
    of DR. To determine which architecture is optimal under what circumstances, we
    compared a few different structures. The accuracies of the VGG-16, VGG-19, ResNet-50,
    DenseNet121, and Hybrid model architectures are 95.21%, 94.21%, 93.22%, 75.86%,
    and 93.55%, respectively.


    Instead of merely using augmentation, we would prefer to employ generative adversarial
    networks (GANs) for oversampling data in the future. To balance the information
    as well as its distribution, it will be highly beneficial if we deliberately create
    extra images of retinopathy. To enhance performance, we would also like to look
    into assembling various transfer learning models.


