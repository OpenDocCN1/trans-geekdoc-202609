    此外，联邦学习（FL）如图 3.2 所示。只有客户端上的各自个性化模型可以访问个人数据。在本地设备上进行预定数量的训练周期后，个体方法的可训练参数被传输到中央服务器，通过汇总这些参数得出全局方法。随后，客户端上的个性化模型使用全局模型的最新参数进行更新，有效同步个人和全局学习。此循环持续进行，直到模型达到最佳状态。通过这种方法，参与者隐私得到可靠保护，因为个人数据完全留在各自的领域内。同时，服务器能够在不损害个人隐私的情况下汇总全局趋势。值得注意的是，在我们的研究中，FL
    通过多进程方式模拟，将每个客户端和服务器视为独立进程。


    ![](img/7df621e14c1a5d96077d3e56e3977008_56_0.png)


    ### 3.2.5 指标


    本工作考虑三种指标。RMSE 被用于全面评估模型性能，指导最佳可训练参数和属性组合的选择。此外，还考虑平均绝对相对差（MARD），使其成为评估较小幅度预测的理想指标。此外，平均绝对误差（MAE）用于与其他模型进行轻松比较，尤其是因为
    MAE 是俄亥俄州 2020 挑战所有参赛作品使用的标准指标。


    ## 3.3 实验与结果


    ### 3.3.1 属性的影响


    为了有效利用 OhioT1DM 数据集和实验资源中的各种属性，我们对若干属性组合进行了实验。有趣的是，我们发现使用六个特定属性，包括“血糖水平”、“胰岛素剂量”、“进食”、“睡眠”、“运动”和“指尖血糖”，在大多数场景中都能持续带来显著改进。


    因此，我们的初步实验旨在确定这六个属性中每一个对 RMTS-BGLP 的积极影响。在本实验中，我们从六个属性集中系统地一次排除一个属性（“血糖水平”除外）。然后，我们比较了使用所有六个属性的
    GAM 与仅使用 BG 的 GRU 的性能。接下来，如果使用这六个属性的 GAM 优于其他模型，则表明每个属性都对 RMTS-BGLP 有积极贡献。反之，如果仅使用
    BG 的 GRU 表现最差，则表明这六个属性的组合是有效的。本实验的结果详见表 3.2 和 3.3。


    此外，我们还旨在解释排除某些属性的决定。为此，我们逐次将一个额外属性添加到现有的六个属性集中。然后，我们将结果与仅包含原始六个属性的 GAM 的性能进行比较。如果添加新属性在大多数场景中未能超过包含六个因素的
    GAM，则我们选择不包含其他因素（见表 3.4 和 3.5）。


