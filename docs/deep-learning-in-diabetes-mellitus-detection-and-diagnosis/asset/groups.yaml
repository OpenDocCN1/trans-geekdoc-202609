    ## 基于残差 U-Net 方法的视网膜眼底图像糖尿病早期自动检测


    K. Sujatha, R.S. Ponmagal, N. Janaki, N.P.G. Bhavani, and SuQun Cao


    ### 4.1 引言


    糖尿病（DM）被认为是全球流行的最致命疾病。早期诊断 DM 对提高患者生存率起着至关重要的作用。医学和技术领域的最新发展为改进视网膜图像检测和分割方法提供了方向，以帮助医学从业者定位问题并采用精准程序治疗患者。最近，已提出许多方法来预测和分割视网膜图像。由于深度学习方法在
    DM 检测和分割中发挥着突出作用，因此考虑了这两种方法 [1–11]。另外，随着物联网（IoT）在全球连接设备方面引领技术进步，基于 IoT 的集成路由与上述方法一起使用，以微调并定位骨骼中癌细胞的精确位置。骨癌分割和
    IoT 路由技术面临的主要挑战在 [12,13] 中有所说明。在参考文献 [14] 中，使用全卷积网络（FCN）架构进行图像分类是一大挑战。参考文献 [10]
    中设计的 AGResU-Net 未能考虑临床分割模型来提高分割准确性。


    在参考文献 [15] 中，开发了使用纹理特征和稀疏内核编码来分割骨癌的方法，但主要挑战在于将单维数据源扩展到多维数据源，从而将非正常视网膜区域组织与正常部分分割开来。因此，拟议项目开发了一种方法来解决已识别的问题，并提供准确性、灵敏度、特异度和曲线下区域参数，同时强调适应度指标等性能措施
    [16–24]。基于嵌入式的软件产品可帮助医学专业人士、医生、专家、研究人员及其他医学领域专家早期诊断 DM 并相应开始治疗（图 4.1）。


    本章的组织方式如下：第 4.1 节介绍糖尿病视网膜病变（DR）。第 4.2 节开展文献调查，以识别研究人员讨论的方法。从文献调查中识别出现存的挑战，并在第
    4.3 节中讨论，该节包含研究领域中存在的空白。在彻底分析文献文章后，识别了研究空白并仔细制定了目标。第 4.4 节讨论深度学习模型，第 4.5 节讨论结果和讨论。第
    4.6 节呈现本章的结束语，随后是文中引用的参考文献。


    ### 糖尿病视网膜病变


    ![](img/7df621e14c1a5d96077d3e56e3977008_68_0.png)


    图 4.1 正常视网膜与糖尿病视网膜病变视网膜图像对比。（图片来源：ShutterStock Images。）


    ### 4.2 文献调查


    胰岛素分泌不足会导致 DM。随着血糖水平升高，DM 进展；DM 会影响循环系统（包括视网膜）中的血液流动，并损害人体血管结构，进而降低患者视力，导致 DR。


    为早期检测 DR [25]，研究人员使用支持向量机（SVM）、序列最小优化（SMO）、随机森林和朴素贝叶斯（NB）进行分类。使用上述方法，诊断的准确结果接近
    90%。


    在研究 [26] 中，使用小波特征将 DM 状况分类为正常和异常，准确率为 92.5%。使用卡胡宁-洛厄变换（KLT）通过分割主要血管来从视网膜图像中检测视盘以识别
    DM [8]，直方图计算时间缩短，准确率约为 91.5%。主要缺点是无法获得有效输出，且图像对比度很低。如果 DR [9] 不予治疗，可能导致视力丧失。研究人员使用离散余弦变换（DCT）和
    k 近邻（k-NN）来分类 DR [27]。


    研究人员使用一种稳健的特征提取方法，随后进行 k-means 聚类，从视网膜图像中识别 DR [10]，准确率为 95%。使用此方法时，伪影会导致部分信息丢失。视盘形状随严重程度而变化
    [28–37]。血管的存在增加了诊断的复杂性。因此，将视盘分割为小感兴趣区域（RoI）以进行面积计算并提取相关特征 [11]，从而使用具有可变配置和模糊逻辑的自适应掩模进行早期检测和分类。因此，研究人员提出的方法依赖于视网膜图像分析。从这些图像中提取特征，并根据现有状况的严重程度进行分类
    [38–46]。


    ### 4.3 研究空白


    基于调查分析，针对早期 DR 诊断的去噪、特征提取、降维和分类的新颖鲁棒方法是本工作的额外亮点。灵敏度和特异度用于评估性能。


    ### 4.4 目标与研究亮点


    ### 4.4.1 目标


    根据文献分析，基于视网膜分割的现有方法在基于图像的分类方面效率不高，这是提高分割准确性并将单模态数据源扩展到多模态数据源的主要挑战。本工作的研究成果是开发一个软件产品。为了将本工作的研究成果转化为软件产品，检测
    DR 并执行分割，从而帮助患者治疗并挽救生命。目标是发明方法来解决已识别的问题，并制定一种有助于早期诊断 DR 的方法。因此，主要目标是设计一种基于眼底相机视网膜图像分割、嵌入物联网（IoT）的深度学习神经网络（DLNN）模型的
    DR 检测方案，强调准确性、灵敏度和特异性。拟议的成果是设计一种用于眼底视网膜图像分割的深度学习神经网络鲁棒高效算法，包括用于分割、感兴趣区域（RoI）提取和物联网路由的
    DLNN 模型仿真，关注适用性指标等性能指标。如果使用嵌入式技术开发软件产品，注重可行性和实用性，则可以帮助医学专家从视网膜图像中早期诊断 DM 并相应开始治疗。


    ### 4.4.2 研究亮点


    研究亮点包括：


    - 从视网膜眼底图像中识别 NL、NPDR 和 PDR

    - 实施医疗物联网（HIoT）

    - RA-UNet 用于分割

    - 自适应阈值（AT）用于 RoI 提取

    - 使用带有或不带有优化技术（如 SSOA 和 CAViaR）的深度学习神经模型进行诊断


