    ## 7.4 深度学习模型（DLM）


    拟用于DM预测的DLM架构如图7.3所示。它由输入特征层组成，其后跟随带有批量归一化和整线性单元（ReLU）激活的全连接层。最后，拟议的DLM中包含softmax层和分类层。数据集包含八个输入特征，分别表示x₁
    – 妊娠次数（pregnancies）、x₂ – 葡萄糖（glucose）、x₃ – 血压（blood pressure）、x₄ – 皮肤厚度（skin thickness）、x₅
    – 胰岛素（insulin）、x₆ – 身体质量指数（BMI）、x₇ – 糖尿病谱系函数（diabetes pedigree function）以及x₈ –
    年龄（age）。每条医疗记录的这八个输入参数作为输入特征层的输入。拟议模型有三个全连接层，每个层包含50个隐藏神经元。从图7.3可以看出，输入特征层的所有神经元都连接到全连接层的所有神经元。此方案一直延续到softmax层。进行批量归一化以使网络更快且更稳定。批量归一化的工作原理是通过减去批量均值并除以批量标准差来归一化前一激活层的输出
    [26]。此步骤之后，结果由两个可学习参数（gamma和beta）进行缩放和偏移，这两个参数对每个层都是唯一的 [26]。ReLU是一种激活函数，它为DLM引入非线性特性，并解决了神经网络的梯度消失问题
    [27]。全连接层的输出被馈送给softmax层，该层给出每个类的概率得分。基于此概率，分类层的输出为类别''1''或''0''。类别''1''代表DM，''0''代表非DM。


    ![](img/7df621e14c1a5d96077d3e56e3977008_109_1.png)


    图7.3 用于DM预测的拟议DLM架构。


