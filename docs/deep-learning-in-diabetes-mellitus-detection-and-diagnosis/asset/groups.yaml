    proves the robustness, reliability, and effectiveness of the proposed DLM.


    # 7.6.3 Future Work


    The scope for future work in DM detection using deep learning has several areas
    for further exploration. The key areas include improved accuracy for a large dataset,
    early prediction and prevention, integrating with edge computing-based wearable
    devices, and deployment with a cheapest price affordable by all. To explore the
    DLM further like implementation with pretrained model, there is a need for a large
    dataset. Once a large dataset collected from across the various geographical location
    is available, using transfer learning-based DLMs are possible. Also, there is
    further scope to study the detection of DM in children and teenagers. Then, the
    performance of the proposed DLM can be investigated further. The goal will be
    to develop a simple model for detecting DM irrespective of gender, age, or race.'
