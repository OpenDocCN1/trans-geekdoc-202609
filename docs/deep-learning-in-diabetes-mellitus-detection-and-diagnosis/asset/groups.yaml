    ### 2.2.5 模型架构


    所选深度学习模型采用 Keras 库的顺序架构，包含输入层、两个隐藏层和输出层。输入层有 64 个神经元，输入维度为 24，对应所选特征，而隐藏层使用修正线性单元
    (ReLU) 激活函数向模型引入非线性。向模型添加了两个额外隐藏层。第一个隐藏层有 32 个神经元，第二个隐藏层有 20 个神经元，使用 ReLU 激活，以帮助模型学习数据中的复杂模式和关系。输出层中一个神经元的最终
