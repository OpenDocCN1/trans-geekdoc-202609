    ## 基于深度学习模型的糖尿病检测


    M. Karthikeyan 和 R. Rengaraj


    ### 7.1 引言


    在印度等发展中国家，糖尿病（DM）患者人数众多，这是因为肥胖和不健康生活方式的增加 [1]。2 型糖尿病可能导致微血管和大血管问题。最近，在印度，这些多器官问题已导致年轻时死亡的无条件概率
    [1]。2 型糖尿病是印度医疗系统面临的最具挑战性的威胁之一。国际糖尿病联合会估计，2021 年有 7490 万糖尿病患者，预计到 2045 年将达到 1.249
    亿 [2]。根据世界卫生组织（WHO），年龄（≥45 岁且很少锻炼）、体重指数（≥24 kg/m²）、葡萄糖耐受受损或空腹血糖受损、糖尿病家族史、高密度脂蛋白胆固醇低或高甘油三酯血症、高血压或心血管疾病以及妊娠期女性（年龄
    ≥30 岁）的人群糖尿病高风险 [3]。世界卫生组织设定的 2030 年实现目标如下：


    - 1. 80% 的糖尿病患者将被诊断 [4]。

    - 2. 80% 的已诊断糖尿病患者应血糖控制良好 [4]。

    - 3. 80% 的已诊断糖尿病患者应血压控制良好 [4]。

    - 4. 60% 的 40 岁或以上的糖尿病患者必须接受他汀治疗 [4]。

    - 5. 100% 的 1 型糖尿病患者必须能够获得负担得起的胰岛素治疗和血糖自我监测 [4]。


    2 型糖尿病的临床检测使用大于阈值的空腹血浆葡萄糖水平。该血糖阈值水平可能因地区人群不同血糖风险水平而有所不同。尽管存在这些困难，但开发一种用于检测 2 型糖尿病的决策支持系统刻不容缓，以便在可能的早期阶段做出有意义的决策。这些限制促使需要一种简化的诊断流程来检测
    2 型糖尿病。


    随着最新技术的发展和人工智能（AI）在日常活动中的影响，机器学习（ML）算法的开发有助于在 2 型糖尿病检测中快速构建决策支持系统。多种基于神经网络的算法
    [5]、深度神经网络 [6,7] 和常规 ML 模型 [8–17] 已用于 2 型糖尿病检测的研究。


    考虑到文献中 2 型糖尿病检测面临的挑战和准确率以及现代 AI 工具的使用，迫切需要一种新的改进模型。因此，在本章中，我们提出了一种用于 2 型糖尿病检测的稳健深度学习模型（DLM），以构建高效的决策支持系统。本章的贡献概述如下：


    - 1. 我们提出了一种用于 2 型糖尿病检测的简单 DLM。我们还探索了带有贝叶斯优化的超参数调整 ML 算法。对所考虑算法的性能指标进行了比较。

    - 2. 该模型使用德国医院数据集进行训练，随后使用 PIMA 印度糖尿病数据集（PIDD）进行测试，展示了所提模型相较于可用 ML 的泛化优势。

    - 3. 通过使用一个数据集训练模型，并用训练过程中未包含的另一个数据集进行测试，增强了迁移学习的概念。


    本章其余部分结构如下：第 7.2 节介绍 DM 预测的文献。第 7.3 节介绍方法。第 7.4 节介绍所提 DLM。第 7.5 节介绍实验数据集。第 7.6
    节解释结果和讨论。第 7.7 节总结本章。


    ### 7.2 相关工作


    近年来，人工智能和机器学习领域在检测 2 型糖尿病可能性方面发挥了重要作用。许多算法和工具已被开发，展示了该研究领域的巨大潜力。我们将综述限制在与所提出问题密切相关的最新研究结果上。基于神经网络的预测在糖尿病研究中最近表现出预测准确率的提高。在文献
    [6] 中，作者利用最小-最大归一化和自动编码器解决数据归一化、数据集不平衡和特征增强问题。多层感知机被用于分类，达到了 92.31% 的准确率 [6]。在文献
    [5] 中，作者设计了一种基于人工反向传播共轭梯度神经网络的分类器，无需数据预处理即可达到 93% 的准确率。文献 [18] 报告了一种使用 k 近邻的改进基于神经网络的方法，达到了
    98% 的 F1 分数。文献 [19] 的作者应用皮尔逊相关和中位数填补进行特征选择。他们的深度神经网络模型达到了 88.6% 的准确率 [18]。


    与基于神经网络的方法相比，ML 分类模型取得了良好的预测准确率。在文献 [20] 中，作者评估了不同的 ML 分类器：光梯度提升机（LGBM）、线性回归（LR）和支持向量机（SVM），其中
    LGBM 以 86% 的准确率优于其他模型。在文献 [18] 中，比较了决策树（DT）、随机森林（RF）、朴素贝叶斯（NB）、k 近邻（KNN）和自适应提升（AB）等
    ML 算法的分类准确率。文献 [7] 的作者开发了一个准确率为 98.07% 的深度神经网络模型。在文献 [21] 中，特征选择方法


