  - '[PAGE 64]


    # 3.4 DISCUSSION


    When comparing GAM with the top approaches in the Ohio 2020 challenge (refer to
    Table 3.8), to ensure a fair comparison with other methods, our model is pre-trained
    using OhioT1DM’18 and then tuned using OhioT1DM’20. We do not leverage GAM with
    FL in the comparisons with other methods, given that FL evidently decreases the
    forecasting capability, and our primary aim is to showcase performance differences
    among these deep models.


    Overall, our proposed model ranks third. However, this does not necessarily imply
    inferiority compared to the top two models. For instance, the N-BEATS-based model
    is pre-trained on considerably larger datasets encompassing data from 100 participants,
    employing unique strategies such as training multiple models simultaneously with
    varying hyperparameters and using the median of these models’ predictions as the
    final output. Despite its remarkable performance, it is challenging to attribute
    this success solely to the model itself rather than the employed strategies.


    # 3.5 CONCLUSION


    In this study, we introduce a new concept called “GAM”, a graph attention memory
    model. GAM stands out for its explainability, efficiency, and adaptability. It
    achieves this through its attention mechanism, where the attention weights highlight
    the importance of attributes, and both the attention weights and the graph structure
    adapt based on active nodes. Additionally, we integrate FL with GAM, allowing
    us to harness collective insights while preserving participant privacy.


