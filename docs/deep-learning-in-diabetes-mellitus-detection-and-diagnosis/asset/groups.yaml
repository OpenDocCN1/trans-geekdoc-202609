  mdcn: "\n\n## 糖尿病检测与诊断中的深度学习\n\n### 由 Jyotismita Chaki 和 Marcin Woźniak 编辑\n\n《糖尿病检测与诊断中的深度学习》聚焦于糖尿病检测与诊断领域的基于深度学习的方法，包括预处理技术等该学科的核心内容。这是首本专门针对糖尿病领域基于深度学习方法的同类图书。本书包含详细的入门概述，以及当前应用、基于深度学习的数据预处理、深度学习技术、复杂性、挑战及未来方向等章节。本书将对从事糖尿病研究与工作的研究人员及专业人士，以及机器学习在一般医学应用中的研究者产生浓厚兴趣。\n\
    \n### 特色\n\n- 重点介绍了基于深度神经网络的应用如何解决糖尿病检测与诊断中的新问题与协议，并改进现有挑战\n- 协助希望了解该领域的学者与学生，以及未经正式介绍即开始学习的其他人，无需复杂的数学公式\n\
    - 涵盖卓越的主题范围，并包含理解深度学习所需的原理\n\n![](img/7df621e14c1a5d96077d3e56e3977008_2_0.png)\n\
