    The mean square error (MSE) is utilized as the training loss, and the Adam optimizer
    (Kingma and Ba, 2015) is employed to optimize the learnable parameters.


    Furthermore, FL is illustrated in Figure 3.2. Only the respective personalized
    models on the clients have access to personal data. After undergoing training
    for a predetermined number of epochs on the local devices, the trainable parameters
    of the individual method are transmitted to a central server, where a global approach
    is derived by summarizing these parameters. Subsequently, the personalized models
    on the clients are updated with the global model’s latest parameters, effectively
    synchronizing the personal and global learnings. This cycle continues until the
    models reach an optimal state. Through this methodology, participant privacy is
    robustly safeguarded, because personal data remains exclusively within their domain.
    At the same time, the server is able to aggregate global trends without compromising
    individual privacy. It’s worth noting that in our study, FL is emulated through
    a multi-process approach, treating each client and the server as separate processes.


