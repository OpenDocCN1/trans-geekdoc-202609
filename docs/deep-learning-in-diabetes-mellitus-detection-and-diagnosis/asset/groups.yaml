    – 妊娠次数（pregnancies）、x₂ – 葡萄糖（glucose）、x₃ – 血压（blood pressure）、x₄ – 皮肤厚度（skin thickness）、x₅
    – 胰岛素（insulin）、x₆ – 身体质量指数（BMI）、x₇ – 糖尿病谱系函数（diabetes pedigree function）、x₈ –
    年龄（age）以及结果类别（Y, N）。为了与其他数据集具有相同的输出类别，将类别Y和N更改为1和0。这些数据集的主要目标是预测患者是否患有DM。


