    ### 8.2 RECENT ADVANCES IN DIAGNOSTIC METHODS


    Artificial intelligence techniques not only allow for effective early detection
    of new-onset cases but also serve as a robust process of therapeutic monitoring
    of the disease in real time [6]. Among these methods, deep learning techniques
    have the potential to significantly advance the field of diabetes detection, prediction,
    and management by providing more robust and efficient methods for identifying
    patients at risk and enabling the development of more personalized treatment plans.
    Implementing these methods in practice is beneficial for the diagnosis process,
    as massive and complex datasets can be analyzed more effectively than with traditional
    machine learning approaches. Deep learning methods can provide more precise results
    as they are capable of identifying patterns not evident to human review. Another
    advantage is the ability to work with unstructured and incomplete data [14]. These
    methods are more flexible and agile, allowing for a more comprehensive approach
    to real-world data [15]. Deep learning algorithms, especially neural networks,
    such as RNNs, CNNs, and LSTMs, can effectively process temporal data, including
    signal data from wearable devices. By utilizing the following methods appropriately,
    deep learning could help automate the detection of diabetes, leading to more effective
    diagnostics and management of the disease.


    This chapter is organized into the following sections. Firstly, in the introduction,
    the importance and urgency of the observed issue were presented. Subsequently,
    in the next section, all reviewed methods with the most captivating approaches
    were collected and presented in a comparison table with respective accuracy for
    each model. Then, in the discussion part, all observed trends and prospects for
    the future were described. Lastly, in the conclusion, the most important details
    were summarized and collected.


    ### 8.3 METHODS


    The vast majority of reviewed research papers in the area of diabetes mellitus
    detection using deep learning algorithms used primarily the accuracy metric to
    evaluate the effectiveness of proposed methods. For preserving consistency in
    the following comparison, the main measure presented is also the accuracy, which
    stands for the total count of correctly labeled data.


    ```

    Accuracy=(TP+TN)/(TP+FP+FN+TN)

    ```


    where TP – true positive, TN – true negative, FP – false positive, and FN – false
    negative.


    The main advantage of using it as an evaluation metric is easy interpretation
    and uniformity; however, it may prove to be inefficient in cases with unaddressed
    class imbalance in the utilized dataset. Otherwise, it provides a valid measure
    of overall performance (Figure 8.2).


    ![](img/7df621e14c1a5d96077d3e56e3977008_122_0.png)


    FIGURE 8.2 A graph presenting the accuracy of deep learning methods from the literature
    review.

