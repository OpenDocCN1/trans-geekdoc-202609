    # # Editor Biographies


    **Dr. Jyotismita Chaki** is an Associate Professor at the School of Computer Science
    and Engineering, Vellore Institute of Technology, India. Holding a PhD in Engineering
    from Jadavpur University, Kolkata, her research focuses on Computer Vision, Image
    Processing, Pattern Recognition, Medical Imaging, Artificial Intelligence, and
    Machine Learning. With a prolific publication record, Dr. Chaki has authored over
    50 international conference and journal papers and contributed to more than ten
    books as author or editor. In 2024, she was presented among “TOP 2% Scientists
    in the World”. Her editorial roles currently include Editor of Engineering Applications
    of Artificial Intelligence (Elsevier), Section Editor of PeerJ Computer Science,
    and Associate Editor for Computer and Electrical Engineering, Array, and Machine
    Learning with Applications journals (Elsevier). She is a Senior Member of IEEE.


    **Marcin Wozniak** received an MSc degree in applied mathematics, a PhD degree
    in computational intelligence, a DSc degree in computational intelligence, and
    Full Professor honours from the President of Poland. He is currently a Full Professor
    with the Faculty of Applied Mathematics, Silesian University of Technology.


    He is a Scientific Supervisor in editions of “The Diamond Grant” and “The Best
    of the Best” programs for highly talented students from the Polish Ministry of
    Science and Higher Education. He participated in various scientific projects (as
    Lead Investigator, Scientific Investigator, Manager, Participant, and Advisor)
    at Polish, Italian, and Lithuanian universities and projects with applied results
    in IT industry both funded by the National Centre for Research and Development
    and abroad. He was a Visiting Researcher with universities in Italy, Sweden, and
    Germany.


    He has authored/coauthored over 300 research papers in international conferences
    and journals. His current research interests include neural'
  - '[PAGE 8]


    networks with their applications together with various aspects of fuzzy logic
    and control, applied computational intelligence accelerated by evolutionary computation,
    and federated learning models.


    In 2017, he was awarded by the Polish Ministry of Science and Higher Education
    with a scholarship for an outstanding young scientist. In 2021 and 2024, he received
    two awards from the Polish Ministry of Science and Higher Education for research
    achievements. In 2020, 2021, 2022, and 2023, he was presented among “TOP 2% Scientists
    in the World” by Stanford University for his career achievements. He is also presented
    among the Best Computer Science Scientists in Poland by Research.com. He is an
    Editorial Board Member or an Editor for Biomedical Signal Processing and Control,
    Sensors, Machine Learning with Applications, Pattern Analysis, and Applications.
    He also guest edits special issues, i.e., IEEE Journal Biomedical and Health Informatics,
    IEEE Access, Measurement, Sustainable Energy Technologies and Assessments, Frontiers
    in Human Neuroscience, PeerJ CS, International Journal of Distributed Sensor Networks,
    Computational Intelligence and Neuroscience, Journal of Universal Computer Science,
    etc. He is a Session Chair at various international conferences and symposiums,
    including IEEE Symposium Series on Computational Intelligence, IEEE Congress on
    Evolutionary Computation, and International Joint Conference on Neural Networks.'
