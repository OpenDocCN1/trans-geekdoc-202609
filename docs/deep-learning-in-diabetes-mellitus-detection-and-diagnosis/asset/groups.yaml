    图 8.4 基于文献综述展示了各国在糖尿病检测深度学习方法研究中百分比份额的饼图。


    在应用的深度学习方法方面，另一个有趣且有前途的方法是基于模糊逻辑的分类，与其他解决方案相比，它相对容易理解。


    所呈现的文献综述涵盖了 2018 年至 2024 年的作品。对深度学习方法在糖尿病检测领域应用感兴趣的作者数量相对较高。按地理来源分析研究论文的百分比分布可以看出，绝大多数文章的作者来自印度和韩国（图
    8.4）。


    ## 8.5 结论


    糖尿病是影响全球许多人的严重健康问题，这一问题需要得到有效解决。从所呈现的文献综述可以推断，在借助经过改进的深度学习方法（这些方法在评估中取得了高性能准确率）改进糖尿病检测和诊断过程方面，存在强劲且日益增长的兴趣。可以注意到，准确率最高的方法是
    CNN，然后是诸如 Conv-LSTM 和模糊逻辑等混合方法，接着是 RNN。尽管如此，本综述中回顾的所有方法仍然取得了非常高的准确率，展示了精简的功能和强健的分类性能。对这一普遍问题最感兴趣的国家是印度和韩国，绝大多数论文均源自这两个国家。关于糖尿病检测的未来，有许多创新想法，其中之一是实施非侵入性健康状态监测系统，例如利用生物传感器或其他信号设备的功能。这些方法可以实现早期糖尿病检测或糖尿病前期状态检测，从而在疾病剧烈进展之前实施有效治疗，实际上将大大保障患者的健康。


