    在本研究中，使用了两个数据集来比较每个数据集的优势，并评估模型识别不同类别复杂特征的能力。在 Kaggle 上，可以获得初始数据集，即亚太远程眼科学会（APTOS）数据集，包含
    1928 张用于测试的未标记图片和 3662 张用于训练的标记图片。需要注册一个网站账户才能查看第二个数据集 Messidor。为训练目的，有 1744 张未标记图片。Messidor

    ![](img/7df621e14c1a5d96077d3e56e3977008_84_0.png)


    图 5.3 检测与分类流程。


    数据集包含 872 张视网膜检查照片，包括左右眼睛黄斑处的两个眼底视图。两个数据集均通过将图片缩放至 224×224 像素并裁剪图片以仅包含眼底来进行预处理，以符合
    DenseNet 模型的输入尺寸和预处理技术。两个数据集中的高分辨率图像在五个类别之间分布不均，且仅为训练子集提供了地面真实信息。APTOS 数据集包含在各种条件下拍摄且尺寸不同的眼底图像。由于地面真实数据仅适用于训练子集，因此在两个数据集的训练集上评估了模型的性能。


    图 5.4 显示了 DR 图像的类别。DR 有五个类别：轻度、重度、增殖性、无 DR 和中度。图 5.5 描绘了 DR 图像的统计数据。该算法使用类别交叉熵损失函数进行训练，并使用
    Adam 方法进行优化。为避免过拟合，模型参数在 50 个时期内使用早停法进行调整。APTOS 和 Messidor 数据集均用于交叉验证测试、训练和测试。在排除
    Messidor 数据集的情况下，若要使用 APTOS 数据集来增强模型，则 80% 的 APTOS 数据集用于训练，20% 用于验证，20% 用于测试。

    ![](img/7df621e14c1a5d96077d3e56e3977008_85_0.png)


    图 5.4 DR 类别—示例图像。


    ![](img/7df621e14c1a5d96077d3e56e3977008_86_0.png)


    图 5.5 DR 类别统计。


    如果使用 Messidor 数据集优化模型，则 APTOS 数据集用于评估，相同数量的数据用于训练和验证。


    模型的性能通过使用多种指标（如准确率、精确率、召回率、F1-score 和 support）比较每个训练数据集的结果来评估。APTOS 数据集在每个检查的指标中表现更好。加粗的数字表示两个数据集中某个类别的最佳性能。训练和测试数据集以字母
    DS 表示，这也代表 Messidor。在 APTOS 数据集上训练的模型在验证子集中的准确率（81%）高于在 Messidor 数据集上训练的模型（64%）。交叉验证结果表明，APTOS
    训练的模型优于 Messidor 训练的模型，后者在 APTOS 数据集上的测试准确率为 33%，在 Messidor 数据集中的类别识别准确率为 59%。


    基于验证指标，在 APTOS 数据集上训练的模型在所有类别上的准确率、召回率和 F1-score 均优于在 Messidor 数据集上训练的模型。然而，虽然
    Messidor 数据集对重度 NPDR 的表现更好，但它无法学习 PDR 类别分类。就准确率而言，训练后的模型优于 Messidor 数据集。尽管两个数据集的接收者操作特征（ROC）曲线下的面积相似，但对于大多数类别，在
    APTOS 数据集上训练的模型发现了更多有用特征。使用轻度 NPDR 类被证明是最困难的。


    | | 精确率 | 召回率 | f1-score | support |

    |---|---|---|---|---|

    | 轻度 | 0.83 | 0.59 | 0.69 | 81 |

    | 中度 | 0.74 | 0.83 | 0.78 | 196 |

    | 无_DR | 0.95 | 0.97 | 0.96 | 374 |

    | 增殖性_DR | 0.59 | 0.70 | 0.64 | 53 |

    | 重度 | 0.82 | 0.31 | 0.45 | 29 |

    | 准确率 | | | 0.85 | 733 |

    | 宏观平均 | 0.79 | 0.68 | 0.70 | 733 |

    | 加权平均 | 0.85 | 0.85 | 0.84 | 733 |


    图 5.6 分类报告。


    缺乏可作为后续提案基础的可靠参考数据集，是此分类工作中的特定挑战。作为基准数据集，之前使用过且具有困难数据分布的 Messidor 数据集是可以接受的。相比之下，APTOS
    数据集具有更多样化的数据分布，非常适合微调模型参数。Messidor 数据集的标准化图像在四个 DR 相关输出中的每一个都显示出更好的特性。但是，Messidor
    的数据不足以应用于其他图像格式。


    图 5.6 描绘了 DR 严重程度的分类报告。研究结果表明，深度学习模型在识别眼底照片中的 DR 方面取得了显著成功。在识别 DR 时，该模型优于传统机器学习算法和人类专家。该算法准确率为
    96%，能够将图像分类为正常或 DR 受影响。


    ## 5.6 结论


    本研究提出了一种旨在检测早期 DR 的模型，作为额外的诊断工具。由于缺乏标准化测试数据集和识别多种 DR 类型的策略，本研究无法与之前的技术进行有意义的比较。标准化数据集需要两个关键因素：数据来源和负责确保标签准确性的组织。由于每个研究提供不同的验证数据划分，用于获得验证指标的数据在模型之间有所不同。由于缺乏公开可访问的测试标签，计算许多数据竞赛的测试指标具有挑战性。然而，我们说明了
    APTOS 数据集具有更多样化的图像分布，使我们能够改进分类器并为 DR 亚型分类提供更优特征。本研究结果表明，DL 可以在眼底图像中识别 DR。DL 在
    DR 识别中的应用为该病的快速和精确诊断提供了一种可行方法。数据表明，DL 有潜力彻底改变医学影像诊断并改善患者预后。


