    数据预处理阶段包含多个步骤，以确保数据质量和一致性。所应用的步骤汇编自 BRFSS 2015 代码本实现 [6]。通过使用名为 _dropna()_ 的函数来处理缺失值，该函数会从数据框中删除带有缺失值
    (NaN) 的行或列。删除重复项以防止冗余，并根据需要对分类变量进行编码或转换。此外，连续变量可能会被标准化或归一化，以确保跨特征的统一缩放。


