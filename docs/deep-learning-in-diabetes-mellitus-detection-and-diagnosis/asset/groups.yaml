    ## 6.4 文献综述


    Fico 等人 [1] 开发了个性化医疗路径（PHP）来管理糖尿病，将其整合到信息和通信技术系统中，以促进从以组织为中心向以患者为中心的护理转变。我们进行了小规模探索性研究来测试该平台。


    Mougiakakou 等人 [2] 使用 SMARTDIAB 平台来管理糖尿病。为管理 1 型糖尿病，它整合了数据库（DB）技术、通信、仿真算法和数据挖掘方面的最新技术。尽管它具有适当糖尿病控制所需的软件和硬件组件，但它缺乏食物识别和高效的膳食推荐。


    Theis 等人 [3] 提出了一种深度学习架构，通过纳入糖尿病患者的病历来改进当前的分级方法。首先，将之前医院就诊的病历转换为可用于流程挖掘的事件日志。之后，使用事件日志找到解释患者先前医院经历的流程模型。建议修改衰减重放挖掘，通过融合已知严重程度评分与人口统计和医疗数据，来预测糖尿病
    ICU 患者的住院死亡率。


    Sarathambekai 等人 [4] 基于对众多研究出版物和文章的预测分数和结果的分析，开发了基于机器学习的糖尿病预测的最佳预测模型。基于基于预测获得的准确性分数和其他评估指标，已从研究中评估了常见的机器学习算法，例如决策树、随机森林（RF）分类器、支持向量机（SVM）、K-NN、朴素贝叶斯以及深度学习算法多层感知器分类器。


    El Bouhissi 等人 [5] 评估了糖尿病预测方面最重要的研究，并提供了一种利用 RF、SVM 和深度神经网络（DNN）分类器来预测妊娠糖尿病的方法。该实验使用了法兰克福医院的真实数据集进行，结果表明
    RF 方法具有更高的准确性。


    Samir 等人 [6] 提出了一种系统，将基于深度学习的人体活动识别（HAR）和食物安排与非侵入性连续血糖监测（CGM）策略相结合，以跟踪血糖水平。我们建立了从
    CGM 获得的餐前和餐后峰值血糖水平与食物中发现的血糖负荷（GL）之间的关系，从而使我们能够估计血糖水平的上升并预测高血糖症。此外，该技术将人体活动与血糖水平下降联系起来，在潜在低血糖症状出现之前提醒用户。


    Kim 等人 [7] 提出了自动化算法，结合深度学习和集成学习技术，将图像分为四类：糖尿病性黄斑水肿（DME）、正常、脉络膜新生血管化（CNV）和玻璃样疣。为进行分类，对若干卷积神经网络（CNN）进行了修改。全卷积网络（FCN）用于消除训练和测试图像中的噪声，并采用投影技术来纠正图像倾斜的视网膜层。为了进一步提高性能，我们训练了多个
    CNN 并应用基于 CNN 的集成学习方法。


    Santos 等人 [8] 提出了一种计算机模型，用于支持医学诊断，该模型使用预训练的 CNN 并可以识别眼底擦伤。使用数据驱动的糖尿病视网膜病变研究数据集，该模型基于
    YOLOv4 的 Darknet 框架进行了优化、测试和部署。它实现了 11.13% 的 mAP 和 13.98% 的 mIoU。


    Subha 等人 [9] 之前提到的神经网络被用于开发能够测量包括出血、血管、微动脉瘤和液体滴在内的参数的深度学习模型，并将其分为几个类别。该模型将确定患者眼睛的感染程度。特别是，使用模糊
    C 均值算法确定感染的类型和严重程度。可以使用本文确定视网膜病变的程度。整个系统的用户友好环境使识别更容易。界面将带有按钮，允许您对提供的测试图像执行所需的转换。


    Sazdov 等人 [10] 研究了联邦学习（FL）在使用从 130 家美国糖尿病设施获得的 9 年数据集进行医院再入院预测中的应用。研究结果表明，FL 可以在实现等效性能水平的同时保留数据多样性和隐私性。这是
    FL 的一个关键组成部分，因为它允许在不危及隐私的情况下进行持续的实时学习。


    ## 6.5 拟议方法论


    ### 6.5.1 使用深度学习进行糖尿病早期诊断检测


    糖尿病早期检测有助于减少并发症，这些并发症后来可能引起痛苦，从而带来更好的患者预后。近年来，深度学习在医学影像、电子病历和基因检测中的应用，通过分析各种类型的数据，已显示出改善预后的效果。深度学习算法，尤其是属于此类算法的
    CNN，最近已被用于通过检查来自医学来源（尤其是视网膜成像）的图像，对糖尿病进行早期检测。糖尿病视网膜病变是糖尿病的头号并发症，通常会导致眼球视网膜毛细血管受损，并在没有适当治疗的情况下可能导致威胁视力的视力下降。利用能够正确检测糖尿病视网膜病变症状的深度学习模型（得益于大规模视网膜图像训练）是促进早期诊断和及时转诊治疗的绝佳选择。借助这些深度学习算法类型，人工智能现在可以通过分析视网膜图像并识别特定病变（如微动脉瘤、出血和渗出物，这些是糖尿病视网膜病变的典型特征）来诊断视网膜病变。由于可用的图像数据量巨大，深度学习模型更加准确，它们可以检测出几乎所有可能被常规人类观察忽略的异常，因此医疗保健中的深度学习模型将高效提高诊断率。


    此外，深度学习方法认识到多模态数据（例如人口统计信息、疾病病史或实验室结果）的分析潜力，以提高早期检测模型的鲁棒性和准确性。通过结合来自各种来源的数据，深度学习技术可以识别患糖尿病或其后果可能性较高的人。因此，这使我们能够采取预防措施，从而最大限度地减少这些疾病的影响（图
    6.1）。


    该图展示了使用深度学习技术进行糖尿病早期检测的流程。首先收集患者数据，然后对数据进行预处理，为模型训练做好准备。使用预处理的数据训练深度学习模型后，通过评估来评估模型性能。模型训练和评估完成后，即可用于新患者数据以生成预测，并将


    ![](img/7df621e14c1a5d96077d3e56e3977008_96_0.png)


    图 6.1 使用深度学习进行早期检测。


    结果显示用于决策和解释。


    使用深度学习，这种方法可以实现糖尿病的早期识别，从而促进主动的医疗保健管理和更好的患者预后。


    ### 6.5.2 使用深度学习进行糖尿病治疗和规划


    针对糖尿病的定制化治疗和方案，侧重于遗传方面、日常生活决策和病历等患者特征，是一种已被证明有益的交互方式。机器学习和深度学习方法将在未来糖尿病治疗中取得改进，因为它们非常擅长分析大型数据集并发现可用于个人护理计划设计的趋势。以下是深度学习在糖尿病治疗和规划中的应用方式（图
    6.2）。


    ![](img/7df621e14c1a5d96077d3e56e3977008_96_1.png)


