    ## Deep Learning in Diabetes Mellitus Detection and Diagnosis


    Atianashie A. Miracle and Chukwuma Chinaza Adaobi


    ### 10.1 INTRODUCTION


    To begin with, the term “diabetes mellitus” is introduced. According to the authors,
    diabetes mellitus is a group of metabolic disorders characterized by prolonged
    high blood sugar and disturbances of carbohydrate metabolism. It is crucial to
    have an accurate prognosis of diabetes mellitus, as it will help physicians prevent
    the development of important microvascular and macrovascular complications (Rajagopal
    et al., 2022; Wei et al., 2022). In the modern era of “Evidence-Based Medicine,”
    it would be unusual to undertake a new intervention or treatment without good
    scientific evidence of its effectiveness. It differs from prognosis, which is
    the possible outcomes of a disease.


    We aim to discover the patterns in the data that are most predictive of the possible
    risks, complications, and their occurrence in the progress of the disease. In
    recent years, deep learning has gained increasing attention and popularity in
    the field of prognostication, particularly in terms of diagnosis, treatment selection,
    and outcome prediction. Deep learning is a specific type of machine learning in
    which the computer is made to think about how the human brain works, i.e., it
    works on the modular hierarchies of the concept in improving the number of concept
    layers. It allows the computer to be able to interact with the surroundings and
    also makes the computer learn from the data that had been presented before (Huang
    et al., 2015; Rawat et al., 2022; Suyanto et al., 2022). This will enable the
    computer to recognize the patterns of the diagnosis and help in the early detection
    of certain conditions. However, traditional machine learning algorithms such as
    support vector machines or random forests require expert input for the feature
    selection part. Deep learning allows involving minimum human effort in feature
    extraction due to its highly hierarchical feature learning (Maniruzzaman et al.,
    2017). It is evident that deep learning models, unlike classical multivariable
    regression models, can efficiently use the raw datasets without the need for the
    prespecification of the variables for analysis.


    ### 10.1.1 Definition of Diabetes Mellitus


    Diabetes mellitus is a chronic disease that occurs either when the pancreas does
    not produce enough insulin or when the body cannot effectively use the insulin
    it produces. Insulin is a hormone that regulates blood sugar. The disease can
    lead to dangerous complications. There are three main types of diabetes mellitus:
    type 1, type 2, and gestational. Type 1 diabetes is characterized by deficient
    insulin production. It is caused by an autoimmune reaction in which the body’s
    defense system attacks the cells that produce insulin. Type 2 diabetes is much
    more common than type 1 and is often linked to the genes we inherit and our lifestyle
    choices. The most common symptoms of diabetes, regardless of type, are increased
    blood sugar levels and frequent urination. As time goes on, the body’s insulin
    resistance can lead to a reduction in the efficiency of the insulin receptors.
    Insulin resistance is the main factor driving the disease (Li et al., 2022). Over
    time, the pancreas may lose its ability to produce insulin. This lack of response
    in the insulin receptors combined with the decrease in insulin production contributes
    to chronic hyperglycemia.


    Diabetes is a major public health crisis. As of 2019, the International Diabetes
    Federation (IDF) estimated that over 460 million people worldwide were living
    with diabetes. Moreover, the World Health Organization reports that the condition
    is a leading cause of death and disability, with an estimated 1.6 million deaths
    globally directly attributed to diabetes in 2016. Cultivating an understanding
    of the pathophysiological events associated with diabetes mellitus provides strategic
    targets for discovering a means of prevention or management. The next step in
    finding effective treatments, and ultimately, a cure for diabetes is research.
    Sports scientist Stephen Bradley says, “We know today more about the genes of
    a worm that lived 30 years ago than we know about human genes today (Marques et
    al., 2022; Singh & Singh, 2020). There’s so much progress to be made.” And progress
    is being made, thanks in part to the diabetes research community. With the help
    of studies using different techniques and taking different angles, readers are
    getting to know more about diabetes-related statistical science. And there are
    many different types of statistics researchers in the diabetes field. Some of
    them focus on methodologies, such as survival analysis or pattern recognition.
    Others concentrate more on applied work, analyzing clinical trial data for example.
    Each of the statistics work plays an important role in improving our understanding
    of the disease as well as our ability to prevent and treat diabetes. This chapter
    focuses on the use of deep learning in the prognosis of diabetes mellitus (Mohan
    et al., 2013; Nuankaew et al., 2021).


    ### 10.1.2 Importance of Prognosis in Diabetes Mellitus


    The translation of deep learning techniques to diabetes prognosis is a relatively
    new area. If the promise of this rapidly developing field is to be realized for
    patients with diabetes and their clinicians, it is important to address some of
    the specific challenges posed by diabetes and its prognosis. This includes the
    variability in the type and quality of the data that may be collected, understanding
    how to incorporate different sources of data, and aligning the use of new technologies
    with existing practices in healthcare. It is certainly an exciting time for the
    field and, with the proper collaboration between clinicians, researchers, and
    data scientists, the authors believe that deep learning has the potential to significantly
    enhance our ability to predict and prevent the complications of diabetes (Opitz
    & Maclin, 1999; Podgorelec et al., 2002).


    Deep learning models, in particular, are designed to learn from the data provided
    iteratively. By using increasingly complex algorithms and structures, deep learning
    models can identify intricate patterns in data that may not be immediately obvious
    to human investigators. This presents an exciting opportunity for improving the
    accuracy of prognostic models and, crucially, to move closer to achieving personalized
    prognosis for patients with diabetes mellitus. Deep learning models have already
    demonstrated significant improvements in the accuracy of predicting outcomes in
    several conditions (Gnanadass, 2020; Hasan et al., 2020). By recognizing important
    signals and patterns in complex and large datasets, these models can identify
    previously unseen or unknown connections between predictor variables and outcomes.


    Although the clinical assessment of prognosis is traditionally informed by a range
    of demographic, clinical, and laboratory variables, the use of prognostic models
    in the care of patients with diabetes has been limited. This is partly due to
    the complexity of available models and a general lack of familiarity with their
    use in routine practice. However, the increasing availability of big health data,
    defined as extremely large datasets that may be analyzed computationally to reveal
    patterns, trends, and associations, has opened up new possibilities in the field
    of prognostic research (Sivaranjani et al., 2021). In particular, the use of machine
    learning approaches, such as deep learning, has become an area of active interest.
    This novel branch of statistical learning research has been heralded as having
    the potential to revolutionize many fields, including medicine.


    The accurate estimation and understanding of prognosis are essential in the management
    of patients with diabetes. In medicine, the term “prognosis” denotes the prediction
