    # 4.5 A FRAMEWORK FOR DLNN APPROACH FOR DM DIAGNOSIS


    Information transfer takes place by advanced communication between the devices
    using recent technology like IoT [5,38–43]. Besides, IoT has been widely adopted
    to design and promote healthcare systems [8], due to its effective capability.
    IoT is projected to play a very important role in the field of healthcare, called
    the HIIoT [19,44–46]. Many non-invasive medical imaging methods offer high-level
    contrast. The analysis of the retinal fundus images is an important step in planning
    the diagnosis followed by the segmentation process [1].


    DLNN can solve the problem of early detection of DM from the retinal images as
    they work. Indeed, images containing artifacts are denoized and fed to the input
    of the learning process with generalization capabilities [4]. Thus, the primary
    intention of this research will be to develop a method for early detection of
    DR to prevent loss of vision and implement the same with IoT, which can resolve
    classification of fundus images [9].


    In Ref. [14], the authors have introduced a new multiple category with simple
    meta-heuristic algorithms. Such models are inspired by using the instinct of animals
    by a shepherd. This algorithm is called the shuffled shepherd optimization algorithm
    (SSOA). As per this algorithm, the primary and initial step is that the agents
    are separated into multi-communities and the optimization is inspired by the behavior
    of a shepherd in nature operating on each community. In the process of optimization,
    attention is paid to both good and bad agents, leading to better performance of
    the algorithm.


    # 4.5.1 Shuffled Shepherd Optimization Algorithm (SSOA)


    In nature, optimal ways of living by animals use instincts to find the best way
    of living. Horses have an instinct to find the best stiff and fast way. Road engineers
    in the past have used this trail for constructing new roads. Shepherds use one
    or more horses in the herd to move their tools and find the way and this shepherd’s
    behavior has been an inspiration for authors using mathematical modeling for optimization
    [14].


    # 4.5.2 Conditional Autoregressive Value at Risk (CAViaR)


    In Ref. [15], authors have proposed an approach to quantize an estimation method
    called CAViaR. Instead of modeling the whole distribution, the quantized model
    is developed directly. Thus, the authors propose a'
