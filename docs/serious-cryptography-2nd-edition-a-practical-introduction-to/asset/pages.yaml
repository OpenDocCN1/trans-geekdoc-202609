- pgno: 18
  md: '# FOREWORD TO

    THE FIRST EDITION


    If you’ve read a book or two on computer security, you may have encountered a
    common perspective on the field of cryptography. “Cryptography,” they say, “is
    the strongest link in the chain.” Strong praise indeed, but it’s also somewhat
    dismissive. If cryptography is in fact the strongest part of your system, why
    invest time improving it when there are so many other areas of the system that
    will benefit more from your attention?


    If there’s one thing that I hope you take away from this book, it’s that this
    view of cryptography is idealized; it’s largely a myth. Cryptography in theory
    is strong, but cryptography in practice is as prone to failure as any other aspect
    of a security system. This is particularly true when cryptographic implementations
    are developed by nonexperts without sufficient care or experience, as is the case
    with many cryptographic systems deployed today. And it gets worse: when cryptographic
    implementations fail, they often do so in uniquely spectacular ways.


    But why should you care, and why this book?


    When I began working in the field of applied cryptography nearly two decades ago,
    the information available to software developers was often piecemeal and outdated.
    Cryptographers developed algorithms and protocols, and cryptographic engineers
    implemented them to create opaque, poorly documented cryptographic libraries designed
    mainly for other experts. There was—and there has been—a huge divide between those
    who'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'know and understand cryptographic algorithms and those who use them (or ignore
    them at their peril). There are a few decent textbooks on the market, but even
    fewer have provided useful tools for the practitioner.


    The results have not been pretty. I’m talking about compromises with labels like
    “CVE” and “Severity: High,” and in a few alarming cases, attacks on slide decks
    marked “TOP SECRET.” You may be familiar with some of the more famous examples
    if only because they’ve affected systems that you rely on. Many of these problems
    occur because cryptography is subtle and mathematically elegant, and because cryptographic
    experts have failed to share their knowledge with the engineers who actually write
    the software.


    Thankfully, this has begun to change, and this book is a symptom of that change.


    *Serious Cryptography* was written by one of the foremost experts in applied cryptography,
    but it’s not targeted at other experts. Nor, for that matter, is it intended as
    a superficial overview of the field. On the contrary, it contains a thorough and
    up-to-date discussion of cryptographic engineering, designed to help practitioners
    who plan to work in this field do better. In these pages, you’ll learn not only
    how cryptographic algorithms work but also how to use them in real systems.


    The book begins with an exploration of many of the key cryptographic primitives,
    including basic algorithms like block ciphers, public encryption schemes, hash
    functions, and random number generators. Each chapter provides working examples
    of how the algorithms work and what you should or should *not* do. Final chapters
    cover advanced subjects such as TLS, as well as the future of cryptography—what
    to do after quantum computers arrive to complicate our lives.


    While no single book can solve all our problems, a bit of knowledge can go a long
    way. This book contains plenty of knowledge. Perhaps enough to make real, deployed
    cryptography live up to the high expectations that so many have of it.


    Happy reading.


    Matthew D. Green

    Associate Professor of Computer Science

    Information Security Institute

    Johns Hopkins University'
