  md: 'For this kind of algorithm, you count complexity as the number of iterations
    of the for loop: 1 in the best case (if x is equal to array[0]), n in the worst
    case (if x is equal to array[n - 1] or if x isn’t found in array), and n/2 on
    average if x is uniformly randomly distributed in one of the n cells of the array.
    With an array 10 times as large, the algorithm will be 10 times as slow. Complexity
    is therefore proportional to n, or “linear” in n. A complexity linear with respect
    to its input size is considered fast, as opposed to exponential complexities.
    In this example, although processing larger input values is slower, the computational
    cost won’t blow up exponentially but remains proportional to the table size.


    However, many useful algorithms are slower than that and have a complexity higher
    than linear. The textbook example is sorting algorithms: given a list of n values
    in a random order, you need in the worst case n × log n basic operations to sort
    the list, which is sometimes called linearithmic complexity. Since n × log n grows
    faster than n, sorting speed slows down faster than proportionally to n. Yet such
    sorting algorithms remain in the realm of practical computation, or computation
    that one can carry out in a reasonable amount of time.


    What’s usually not reasonable are complexities exponential in the input size.
    At some point, you’ll hit the ceiling of what’s feasible even for relatively small
    input lengths. Take the simplest example from cryptanalysis: the brute-force search
    for a secret key. Recall from Chapter 1 that given a plaintext P and a ciphertext
    C = E(K, P), it takes at most 2^n attempts to recover an n-bit symmetric key because
    there are 2^n possible keys—an example of a complexity that grows exponentially.
    A problem with exponential complexity is practically impossible to solve because
    as n grows, the effort rapidly becomes infeasible.


    You may object that we’re comparing oranges and apples here: in the search() function
    in Listing 9-1, we counted the number of if (array[i] == x) operations, whereas
    key recovery counts the number of encryptions, each thousands of times slower
    than a single == comparison. This seeming inconsistency can make a difference
    if you compare two algorithms with very similar complexities, but most of the
    time it won’t matter because the number of operations has a greater impact than
    the cost of an individual operation. Also, complexity estimates ignore constant
    factors: when we say that an algorithm takes time in the order of n^3 operations
    (which is cubic complexity), it may actually take 41 × n^3 operations, or even
    12,345 × n^3 operations—but again, as n grows, the constant factors lose significance
    to the point that you can ignore them. Complexity analysis is about theoretical
    hardness as a function of the input size; it doesn’t care about the exact number
    of CPU cycles it takes on your computer.


    You can often use the O() notation (big O) to express complexities. For example,
    O(n^3) means that complexity grows no faster than n^3, ignoring potential constant
    factors. O() denotes the upper bound of an algorithm’s complexity. The notation
    O(1) means that an algorithm runs in constant time—that is, the running time doesn’t
    depend on the input length. For example, the algorithm that determines an integer’s
    parity by looking at its least significant bit (LSB) and returning “even” if it’s
    zero and “odd”'
