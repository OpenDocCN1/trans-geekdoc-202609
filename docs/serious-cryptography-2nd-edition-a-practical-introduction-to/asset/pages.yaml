- pgno: 297
  md: 'legitimate server using their own malicious server. TLS won’t save you in this
    case.


    Fortunately, such security disasters are rarely seen in high-profile applications
    such as Gmail and iCloud, which are well protected and sometimes have their private
    keys stored in a separate security module, such as a hardware security module
    (HSM), directly or via a key management system (KMS) application.


    Attacks on web applications via vulnerabilities such as database query injections
    and cross-site scripting are more common because they’re mostly independent of
    TLS’s security and are carried out by attackers over a legitimate TLS connection.
    Such attacks may compromise usernames, passwords, and so on.


    # Compromised Client


    TLS security is also jeopardized when a client, such as a browser, is compromised
    by a remote attacker. Having compromised the client, the attacker is able to capture
    session keys, read any decrypted data, and so on. They could even install a rogue
    CA certificate in the client’s system to have it silently accept otherwise-invalid
    certificates, thereby letting attackers intercept TLS connections.


    The difference between the compromised CA or server scenarios and the compromised
    client scenario is that in the case of the compromised client, only the targeted
    client is affected, instead of potentially all clients.


    # Bugs in Implementations


    As with any cryptographic component, TLS can fail when there are bugs in its implementation.
    The poster child for TLS bugs is Heartbleed (see Figure 13-3), a buffer overflow
    in the OpenSSL implementation of a minor TLS feature called heartbeat. Heartbleed
    was discovered in 2014, independently by a Google researcher and by the Codenomicon
    company, and affected millions of TLS servers and clients.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_297_0.png)


    Figure 13-3: The Heartbleed bug in OpenSSL implementations of TLS'
