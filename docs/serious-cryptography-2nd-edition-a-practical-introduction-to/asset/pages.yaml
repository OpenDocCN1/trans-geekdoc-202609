  md: 'If there are 15 plaintext bytes and a single byte missing to fill a block,
    padding adds a single 01 byte. If the plaintext is already a multiple of 16, the
    block length, add 16 bytes 10 (16 in decimal). The trick generalizes to any block
    length up to 255 bytes (for larger blocks, a byte is too small to encode values
    greater than 255).


    Decryption of a padded message works like this:


    +   1. Decrypt all the blocks as with unpadded CBC.

    +   2. Make sure that the last bytes of the last block conform to the padding
    rule: that they finish with at least one 01 byte, at least two 02 bytes, or at
    least three 03 bytes, and so on. If the padding isn’t valid—for example, if the
    last bytes are 01 02 03—the message is rejected. Otherwise, decryption strips
    the padding bytes and returns the plaintext bytes left.


    One downside of padding is that it makes ciphertext longer by at least 1 byte
    and at most a block.


    # Ciphertext Stealing


    Ciphertext stealing is another trick we use to encrypt a message whose length
    isn’t a multiple of the block size. Ciphertext stealing is more complex and less
    popular than padding, but it offers a few benefits:


    +   - Plaintexts can be of any bit length, not just bytes. You can, for example,
    encrypt a message of 131 bits.

    +   - Ciphertexts are exactly the same length as plaintexts.

    +   - Ciphertext stealing is not vulnerable to padding oracle attacks, powerful
    attacks that sometimes work against CBC with padding (as you’ll see in “Padding
    Oracle Attacks” on page 83).


    In CBC mode, ciphertext stealing extends the last incomplete plaintext block with
    bits from the previous ciphertext block and then encrypts the resulting block.
    The last, incomplete ciphertext block is made up of the first bits from the previous
    ciphertext block—that is, the bits that haven’t been appended to the last plaintext
    block.


    In Figure 4-9, we have three blocks, where the last block, P₃, is incomplete (represented
    by a zero). If P₃ is 3 bytes, we XOR it with the last 12 bits from the previous
    ciphertext block E(K, P₂) and return the encrypted result as C₃. The last ciphertext
    block, C₃, then consists of the first 4 bytes of E(K, P₂). Decryption is simply
    the inverse of this operation.'
