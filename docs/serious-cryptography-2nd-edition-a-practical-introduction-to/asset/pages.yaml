- pgno: 129
  md: "hardware ciphers for servers or browsers running on personal computers, where\
    \ powerful general-purpose processors run the cipher as native software.\n\nToday,\
    \ there is considerable interest in software stream ciphers for a few reasons.\
    \ First, because many devices embed powerful CPUs and hardware has become cheaper,\
    \ there’s less of a need for small bit-oriented ciphers. For example, the two\
    \ stream ciphers in the mobile communications standard 4G (the European SNOW3G\
    \ and the Chinese ZUC) work with 32-bit words and not bits, unlike the older A5/1.\n\
    \nSecond, stream ciphers have gained popularity in software at the expense of\
    \ block ciphers, notably following the fiasco of the padding oracle attack against\
    \ block ciphers in CBC mode. In addition, stream ciphers are easier to specify\
    \ and to implement than block ciphers: instead of mixing message and key bits\
    \ together, stream ciphers just ingest key bits as a secret. In fact, one of the\
    \ most popular stream ciphers is actually a block cipher in disguise: AES in counter\
    \ mode (CTR).\n\nOne software stream cipher design, used by SNOW3G and ZUC, copies\
    \ hardware ciphers and their FSRS, replacing bits with bytes or words. But these\
    \ aren’t the most interesting designs for a cryptographer. As of this writing,\
    \ the two designs of most interest are RC4 and Salsa20, which are used in numerous\
    \ systems, despite the fact that one is completely broken.\n\n# RC4\n\nDesigned\
    \ in 1987 by Ron Rivest of RSA Security and then reverse engineered and leaked\
    \ in 1994, RC4 has long been the most widely used stream cipher. RC4 has been\
    \ used in countless applications, most famously in the first Wi-Fi encryption\
    \ standard Wired Equivalent Privacy (WEP) and in the Transport Layer Security\
    \ (TLS) protocol used to establish HTTPS connections. Unfortunately, RC4 isn’t\
    \ secure enough for most applications, including WEP and TLS. To understand why,\
    \ let’s see how RC4 works.\n\n# How RC4 Works\n\nRC4 is among the simplest ciphers\
    \ ever created. It doesn’t perform any crypto-like operations, and it has no XORs,\
    \ no multiplications, no S-boxes . . . nada. It simply swaps bytes. RC4’s internal\
    \ state is an array, S, of 256 bytes, first set to S[0] = 0, S[1] = 1, S[2] =\
    \ 2, . . . , S[255] = 255, and then initialized from an n-byte K using its key\
    \ scheduling algorithm (KSA), which works as in the Python code in Listing 5-1.\n\
    \n```\nj = 0\n# Set S to the array S[0] = 0, S[1] = 1, ..., S[255] = 255.\nS =\
    \ range(256)\n# Iterate over i from 0 to 255.\nfor i in range(256):\n    # Compute\
    \ the sum of V.\n    j = (j + S[i] + K[i % n]) % 256\n    # Swap S[i] and S[j].\n\
    \    S[i], S[j] = S[j], S[i]\n```\n\nListing 5-1: The key scheduling algorithm\
    \ of RC4"
