  md: '# Diffie–Hellman Protocols


    The Diffie–Hellman function is the core of most of the deployed public-key agreement
    protocols—for example, in TLS and SSH. However, there is no single Diffie–Hellman
    protocol but rather a variety of ways to use the DH function to establish a shared
    secret. We’ll review three protocols in the sections that follow. In each discussion,
    I’ll stick to the usual crypto placeholder names and call the two parties Alice
    and Bob, and the attacker Eve. I’ll write *g* as the generator of the group used
    for arithmetic operations, a value fixed and known in advance to Alice, Bob, and
    Eve.


    # Anonymous Diffie–Hellman


    *Anonymous Diffie–Hellman* is the simplest Diffie–Hellman protocol. It’s anonymous
    because it’s not authenticated; the participants have no cryptographic identity
    that either party can verify, and neither party holds a long-term key. Alice can’t
    prove to Bob that she’s Alice, and vice versa.


    In anonymous Diffie–Hellman, each party picks a random value (*a* for Alice and
    *b* for Bob) to use as a private key and sends the corresponding public key to
    the other peer. Figure 11-2 shows the process in more detail.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_250_0.png)


    Alice uses her exponent *a* and the group basis *g* to compute **A = gᵃ**, which
    she sends to Bob. Bob receives *A* and computes **Aᵇ**, which is equal to **(gᵃ)ᵇ**.
    Bob now obtains the value **gᵃᵇ** and computes **B** from his random exponent
    *b* and the value *g*. He then sends **B** to Alice, which she uses to compute
    **gᵃᵇ**. Alice and Bob end up with the same value, **gᵃᵇ**, after performing similar
    operations that involve raising both *g* and the value received to their private
    exponent’s power. A simple protocol, secure against only the laziest of attackers.


    Attackers can take down anonymous DH with a man-in-the-middle attack. A network
    attacker simply needs to intercept messages and pretend to be Bob (to Alice) and
    pretend to be Alice (to Bob), as Figure 11-3 depicts.'
