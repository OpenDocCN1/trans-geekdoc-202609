  md: '# Asymmetric Encryption


    So far, we''ve considered only symmetric encryption, where two parties share a
    key. In *asymmetric encryption*, there are two keys: one encrypts and the other
    decrypts. The encryption key is called a *public key* and is generally considered
    publicly available to anyone who wants to send you encrypted messages. The decryption
    key, however, must remain secret and is called a *private key.*


    The public key can be computed from the private key, but the private key can''t
    be computed from the public key. In other words, it''s easy to compute in one
    direction but not in the other—and that''s the point of *public-key cryptography*,
    whose functions are easy to compute in one direction but practically impossible
    to invert.


    The attack models and security goals for asymmetric encryption are about the same
    as for symmetric encryption, except that because the encryption key is public,
    any attacker can make encryption queries by using the public key to encrypt. The
    default model for asymmetric encryption is therefore the chosen-plaintext attacker.


    Symmetric and asymmetric encryption are the two main types of encryption, and
    they are usually combined to build secure communication systems. They also form
    the basis of more sophisticated schemes, as you''ll see next.


    # When Ciphers Do More Than Encryption


    Basic encryption turns plaintexts into ciphertexts and ciphertexts into plaintexts,
    with no requirements other than security. However, some applications often need
    more than that, be it extra security features or functionalities. That''s why
    cryptographers created variants of symmetric and asymmetric encryption. Some are
    well understood, efficient, and widely deployed, while others are experimental,
    hardly used, and offer poor performance.


    # Authenticated Encryption


    *Authenticated encryption (AE)* is a type of symmetric encryption that returns
    an *authentication tag* in addition to a ciphertext. Figure 1-4 shows authenticated
    encryption sets **AE**(K, P) = (C, T), where the authentication tag T is a short
    string that''s impossible to guess without the key. Decryption takes K, C, and
    T and returns the plaintext P only if it verifies that T is a valid tag for that
    plaintext–ciphertext pair; otherwise, it aborts and returns some error.'
