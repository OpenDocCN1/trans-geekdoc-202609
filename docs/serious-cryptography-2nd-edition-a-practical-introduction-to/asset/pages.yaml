  md: '# Kerckhoffs’s Principle


    One assumption made in all models is *Kerckhoffs’s principle*, which states that
    the security of a cipher should rely only on the secrecy of the key and not on
    the secrecy of the cipher. This may sound obvious today, when ciphers and protocols
    are publicly specified and used by everyone. But historically, Dutch linguist
    Auguste Kerckhoffs was referring to military encryption machines specifically
    designed for a given army or division. Quoting from his 1883 essay, “La Cryptographie
    Militaire,” where he listed six requirements of a military encryption system:
    “The system must not require secrecy and can be stolen by the enemy without causing
    trouble.”


    # Black-Box Models


    Let’s consider some useful attack models expressed in terms of what the attacker
    can observe and what queries they can make to the cipher. A *query* for our purposes
    is the operation that sends an input value to some function and gets the output
    in return, without exposing the details of that function. An *encryption query*,
    for example, takes a plaintext and returns a corresponding ciphertext, without
    revealing the secret key.


    We call these *black-box models* because the attacker sees only what goes in and
    out of the cipher. For example, some smart card chips securely protect a cipher’s
    internals as well as its keys, yet you’re allowed to connect to the chip and ask
    it to decrypt any ciphertext. The attacker would then receive the corresponding
    plaintext, which may help them determine the key. That’s a real example where
    *decryption queries* are possible.


    There are several different black-box attack models. Here, I list them in order
    from weakest to strongest, describing attackers’ capabilities for each model:


    +   - **Ciphertext-only attackers (COAs)** Observe ciphertexts but don’t know
    the associated plaintexts or how the plaintexts were selected. Attackers in the
    COA model are passive and can’t perform encryption or decryption queries.

    +   - **Known-plaintext attackers (KPAs)** Observe ciphertexts and do know the
    associated plaintexts. Attackers in the KPA model thus get a list of plaintext–ciphertext
    pairs, where plaintexts are assumed to be randomly selected. KPA is a passive
    attacker model.

    +   - **Chosen-plaintext attackers (CPAs)** Can perform encryption queries for
    plaintexts of their choice and observe the resulting ciphertexts. This model captures
    situations where attackers can choose all or part of the encrypted plaintexts
    and then get to see the ciphertexts. Unlike COA or KPA, which are passive models,
    CPAs are active attackers because they influence the encryption processes rather
    than passively eavesdropping.

    +   - **Chosen-ciphertext attackers (CCAs)** Can both encrypt and decrypt; that
    is, they get to perform encryption queries and decryption queries (of ciphertexts
    different from the targeted ciphertext). The CCA model'
  merge: -1
