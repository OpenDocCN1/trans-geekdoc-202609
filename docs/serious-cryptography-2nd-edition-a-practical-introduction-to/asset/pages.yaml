- pgno: 260
  md: 'This figure displays all the points that make up the curve for x between −3
    and 4, be they points on the left side of the curve, which looks like a circle,
    or on the right side, which looks like a parabola. All points have (x, y) coordinates
    that satisfy the curve’s equation y² = x³ − 4x. For example, when x = 0, then
    y² = x³ − 4x = 0³ − 4 × 0 = 0; hence, y = 0 is a solution, and the point (0, 0)
    belongs to the curve. Likewise, if x = 2, the solution to the equation is y =
    0, meaning that the point (2, 0) belongs to the curve.


    > NOTE

    > *In this chapter, I focus on the simplest, most common type of elliptic curves—those
    with an equation like y² = x³ + ax + b—but other elliptic curves have equations
    in different forms. For example, Edwards curves have equations of the form x²
    + y² = 1 + d x² y². Cryptographers sometimes use Edwards curves (for example,
    in the Ed25519 scheme).*


    When using elliptic curves for cryptography, it’s crucial to distinguish points
    that belong to the curve from other points, as points off the curve often present
    a security risk. However, the curve’s equation doesn’t always admit solutions,
    at least not in the natural number plane. For example, to find points with the
    horizontal coordinate x = 1, you solve y² = x³ − 4x and obtain y² = x³ − 4x =
    1³ − 4 × 1, resulting in −3. But y² = −3 doesn’t have a solution because there’s
    no number for which y² = −3. There exists a solution in the complex numbers (√3i),
    but in practice, elliptic curve cryptography uses only natural numbers (ECC works
    with integer number modulo a prime number, either directly or via polynomials).
    Because there’s no solution to the curve’s equation for x = 1, the curve has no
    point at that position on the x-axis, as you can see in Figure 12-1.


    If you try to solve for x = −1, you get the equation y² = −1 + 4 = 3, which has
    two solutions (y = √3 ≈ 1.73 and y = −√3 ≈ −1.73), the square root of 3 and its
    negative value. The square of both values is 3, and Figure 12-1 has two points
    with x = −1. More generally, the curve is symmetric with respect to the x-axis
    for all points that satisfy its equation (as are all elliptic curves of the form
    y² = x³ + ax + b, except for y = 0).


    # Elliptic Curves over Integers


    Here’s a bit of a twist: the curves in elliptic curve cryptography don’t actually
    look like Figure 12-1. They’re neither curves nor ellipses. They look instead
    like Figure 12-2, which is a cloud of points rather than a curve. What’s going
    on here?'
