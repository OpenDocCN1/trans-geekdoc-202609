- pgno: 186
  md: 'result to the T received. This verification fails if either C or T was corrupted,
    and the message is deemed invalid.


    In theory, encrypt-and-MAC is the least secure MAC and cipher composition because
    even a secure MAC could leak information on P, making P easier to recover. Because
    the goal of using MACs is simply to make tags unforgeable and because tags aren’t
    necessarily random looking, the authentication tag (T) of a plaintext (P) could
    still leak information even though the MAC is considered secure! (If the MAC is
    a pseudorandom function, the tag won’t leak anything on P.)


    Still, despite its relative weakness, many systems continue supporting encrypt-and-MAC,
    including the secure transport layer protocol SSH, wherein each encrypted packet
    C is followed by the tag T = MAC(K, N || P), where N is a 32-bit sequence number
    that increments for each packet. In practice, encrypt-and-MAC has proven good
    enough for use with SSH, thanks to the use of strong MAC algorithms like HMAC-SHA-256
    that don’t leak information on P. Enter the following command


    ```

    $ ssh -Q mac

    ```


    to see the list of MACs supported by the OpenSSH software.


    # MAC-Then-Encrypt Composition


    The MAC-then-encrypt composition protects a message, P, by first computing the
    authentication tag T = MAC(K₂, P). Next, it creates the ciphertext by encrypting
    the plaintext and tag together, according to C = E(K₁, P || T).


    Once these steps are complete, the sender transmits only C, which contains both
    the encrypted plaintext and tag. Upon receipt, the recipient decrypts C by computing
    P || T = D(K₁, C) to obtain the plaintext and tag T. Next, the recipient verifies
    the received tag T by computing a tag directly from the plaintext according to
    MAC(K₂, P) to confirm that the computed tag is equal to the tag T.


    As with encrypt-and-MAC, when using MAC-then-encrypt, the recipient must decrypt
    C before determining whether they’re receiving corrupted packets—a process that
    exposes potentially corrupted plaintexts to the receiver. Nevertheless, MAC-then-encrypt
    is more secure than encrypt-and-MAC because it hides the plaintext’s authentication
    tag, thus preventing the tag from leaking information on the plaintext.


    The TLS protocol has used MAC-then-encrypt for years, but TLS 1.3 replaced MAC-then-encrypt
    with authenticated ciphers (see Chapter 13 for more on TLS 1.3).


    # Encrypt-Then-MAC Composition


    The encrypt-then-MAC composition sends two values to the recipient: the ciphertext
    produced by C = E(K₁, P) and a tag based on the ciphertext, T = MAC(K₂, C). The
    receiver computes the tag using MAC(K₂, C) and verifies that it equals the T received.
    If the values are equal, the plaintext is computed as P = D(K₁, C); if they are
    not equal, the ciphertext is discarded.'
