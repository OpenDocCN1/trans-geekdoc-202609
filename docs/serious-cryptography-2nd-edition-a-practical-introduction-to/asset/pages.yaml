  md: '# When Sponges Leak


    Permutation-based algorithms like SHA-3 and SipHash are simple, are easy to implement,
    and come with compact implementations, but they’re fragile in the face of side-channel
    attacks that recover a snapshot of the system’s state. For example, if a process
    can read the RAM and registers’ values at any time or read a core dump of the
    memory, an attacker can determine the internal state of SHA-3 in MAC mode, or
    the internal state of SipHash, and then compute the reverse of the permutation
    to recover the initial secret state. They can then forge tags for any message,
    breaking the MAC’s security.


    Fortunately, this attack won’t work against compression function–based MACs such
    as HMAC-SHA-256 and keyed BLAKE2 because the attacker requires a snapshot of memory
    at the exact time when the key is used.


    The upshot is that if you’re in an environment where parts of a process’s memory
    may leak, you can use a MAC based on a noninvertible transform compression function
    rather than on a permutation.


    # Further Reading


    The venerable HMAC deserves more attention than I have space for here, and even
    more for the train of thought that led to its wide adoption and eventual demise
    when combined with a weak hash function. I recommend the 1996 paper “Keying Hash
    Functions for Message Authentication” by Mihir Bellare, Ran Canetti, and Hugo
    Krawczyk, which introduced HMAC and its cousin NMAC, and the 2006 follow-up paper
    by Bellare called “New Proofs for NMAC and HMAC: Security Without Collision-Resistance,”
    which proves that HMAC doesn’t need a collision-resistant hash but only a hash
    with a compression function that is a PRF. On the offensive side, the 2007 paper
    “Full Key-Recovery Attacks on HMAC/NMAC-MD4 and NMAC-MD5” by Pierre-Alain Fouque,
    Gaëtan Leurent, and Phong Nguyen shows how to attack HMAC and NMAC when they’re
    built on top of a brittle hash function such as MD4 or MD5. (HMAC-MD5 and HMAC-SHA1
    aren’t totally broken, but the risk is high enough.)


    The Wegman–Carter MACs are also worth more attention, both for their practical
    interest and for their underlying theory. The seminal papers by Wegman and Carter
    are available at https://cr.yp.to/bib/entries.html. Other state-of-the-art designs
    include UMAC and VMAC, which are among the fastest MACs on long messages.


    One type of MAC not discussed in this chapter is Pelican, which uses the AES block
    cipher reduced to four rounds (down from 10 in the full block cipher) to authenticate
    chunks of messages within a simplistic construction, as described in https://eprint.iacr.org/2005/088.
    Pelican is more of a curiosity, though, and it’s rarely used in practice.


    Last but not least, if you’re interested in finding vulnerabilities in cryptographic
    software, look for uses of CBC-MAC or for weaknesses caused by HMAC handling keys
    of arbitrary sizes—taking Hash(K) as the key'
