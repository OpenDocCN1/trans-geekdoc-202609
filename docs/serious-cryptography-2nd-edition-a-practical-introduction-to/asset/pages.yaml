  md: 'based on structured lattices are of greatest interest" and expecting submissions
    with “short signatures and fast verification.” In June 2023, NIST received 50
    submissions, including 11 multivariate, 7 lattice-based, 6 code-based, 2 hash-based,
    and 7 that use MPC-in-the-head. This emerging technique turns a multiparty-computation
    (MPC) protocol into a zero-knowledge proof of knowledge—that is, a single piece
    of data whose verification corresponds to the verification of a signature. The
    proposed number and variety of schemes will lead to new attacks and new attack
    techniques, and hopefully to reliable standards.


    # How Things Can Go Wrong


    Post-quantum cryptography may be fundamentally stronger than RSA or elliptic curve
    cryptography, but it’s not infallible or omnipotent. Our understanding of the
    security of post-quantum schemes and their implementations is more limited than
    otherwise, which brings with it increased risk.


    # Unclear Security Level


    Post-quantum schemes can appear deceptively strong yet prove insecure against
    both quantum and classical attacks. Lattice-based algorithms, such as the ring-LWE
    family of computational problems (versions of the LWE problem that work with polynomials),
    are sometimes problematic. Ring-LWE is attractive for cryptographers because we
    can leverage it to build cryptosystems that are in principle as hard to break
    as it is to solve the hardest instances of ring-LWE problems, which can be NP-hard.
    But when security looks too good to be true, it often is.


    Security proofs are often asymptotic, meaning they’re true only for large parameter
    values such as the dimension of the underlying lattice. However, in practice much
    smaller parameters are used. Even when a lattice-based scheme looks to be as hard
    to break as some NP-hard problem, its security remains hard to quantify. In the
    case of lattice-based algorithms, we rarely have a clear picture of the best attacks
    against them and the cost of such an attack in terms of computation or hardware,
    due to a lack of understanding of these recent constructions. This uncertainty
    makes lattice-based schemes harder to compare against better-understood constructions
    such as RSA. However, researchers have been making progress on this front and,
    ideally in a few years, lattice problems will be as well understood as RSA. (For
    more technical details on the ring-LWE problem, read Peikert’s excellent survey
    at https://eprint.iacr.org/2016/351.)


    # The Eventual Existence of Large Quantum Computers


    Imagine this CNN headline circa April 2, 2048: “ACME, Inc. reveals its secretly
    built quantum computer, launches break-crypto-as-a-service platform.” OK, RSA
    and elliptic curve crypto are screwed. Now what?


    The bottom line is that post-quantum encryption is way more critical than post-quantum
    signatures. Let’s look at the case of signatures first. If'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'you were still using RSA-PSS or ECDSA as a signature scheme, you could issue
    new signatures using a post-quantum signature scheme to restore your signatures’
    trust. You’d revoke your older, quantum-unsafe public keys and compute fresh signatures
    for every message you’d signed. After a bit of work, you’d be fine.


    You’d have a reason to panic only if you were encrypting data using quantum-unsafe
    schemes, such as RSA-OAEP. In this case, all transmitted ciphertext could be compromised,
    so it would be pointless to reencrypt that plaintext with a post-quantum algorithm
    since your data’s confidentiality is already gone.


    But what about key agreement, with Diffie–Hellman (DH) and its elliptic curve
    counterpart (ECDH)? At first glance, the situation looks to be as bad as with
    encryption: attackers who’ve collected public keys $g^a$ and $g^b$ could use their
    shiny new quantum computer to compute the secret exponent $a$ or $b$ and compute
    the shared secret $g^{ab}$, and then derive from it the keys that encrypted your
    traffic. But in practice, Diffie–Hellman isn’t always used in such a simplistic
    fashion. The actual session keys that encrypt your data may be derived from both
    the Diffie–Hellman shared secret and some internal state of your system. That’s
    how state-of-the-art mobile messaging systems work, thanks to a protocol pioneered
    with the Signal application. When you send a new message to a peer with Signal,
    it computes a new Diffie–Hellman shared secret and combines it with internal secrets
    that depend on the previous messages sent within that session (which can span
    long periods of time). Such advanced use of Diffie–Hellman makes the work of an
    attacker much harder, even with a quantum computer.


    # ***Implementation Issues***


    In practice, post-quantum schemes consist of code—software running on some physical
    processor—not just abstract algorithms. However strong the algorithms may be on
    paper, they won’t be immune to implementation errors, software bugs, or side-channel
    attacks. An algorithm may be completely post-quantum in theory but may still be
    broken once implemented—for example, by a classical computer program because a
    programmer forgot to enter a semicolon.


    Furthermore, schemes such as code-based and lattice-based algorithms rely heavily
    on mathematical operations, the implementation of which uses a variety of tricks
    to make those operations as fast as possible. By the same token, the complexity
    of the code in these algorithms makes implementation more vulnerable to side-channel
    attacks, such as timing attacks, which infer information about secret values based
    on measurement of execution times. In fact, we’ve already applied such attacks
    to code-based encryption (see https://eprint.iacr.org/2010/479) and to lattice-based
    signature schemes (see https://eprint.iacr.org/2016/300).


    Ironically, using post-quantum schemes may be less secure in practice at first
    than non-post-quantum ones due to potential vulnerabilities in their implementations.'
