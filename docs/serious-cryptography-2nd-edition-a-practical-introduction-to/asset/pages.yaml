    SHA1-compress(H, M) {\n    (a0, b0, c0, d0, e0) = H   // Parsing H as five 32-bit\
    \ big-endian words\n    (a, b, c, d, e) = SHA1-blockcipher(a0, b0, c0, d0, e0,\
    \ M)\n    return (a + a0, b + b0, c + c0, d + d0, e + e0)\n}\n```\n\n*Listing\
    \ 6-4: SHA-1’s compression function*\n\nSHA-1’s block cipher `SHA1-blockcipher()`,\
    \ shown in bold, takes a 512-bit message block, *M*, as a key and transforms the\
    \ five 32-bit words (a, b, c, d, and e) by iterating 80 steps of a short sequence\
    \ of operations to replace the word a with a combination of all five words. It\
    \ then shifts the other words in the array, as in a shift register. Listing 6-5\
    \ describes these operations in pseudocode, where K[i] is a round-dependent constant.\n\
    \n```\nSHA1-blockcipher(a, b, c, d, e, M) {\n    W = expand(M)\n    for i = 0\
    \ to 79 {\n        new = (a <<< 5) + f(i, b, c, d) + e + K[i] + W[i]\n       \
    \ (a, b, c, d, e) = (new, a, b >>> 2, c, d)\n    }\n    return (a, b, c, d, e)\n\
    }\n```\n\n*Listing 6-5: SHA-1’s block cipher*\n\nThe `expand()` function in Listing\
    \ 6-5 creates an array of 80 32-bit words, W, from the 16-word message block by\
    \ setting W’s first 16 words to M and the subsequent ones to an XOR combination\
    \ of previous words, rotated 1 bit to the left. Listing 6-6 shows the corresponding\
    \ pseudocode.\n\n```\nexpand(M) {\n    // The 512-bit M is seen as an array of\
    \ sixteen 32-bit words.\n    W = empty array of eighty 32-bit words\n    for i\
    \ = 0 to 79 {\n        if i < 16 then W[i] = M[i]\n        else\n            W[i]\
    \ = (W[i − 3] ⊕ W[i − 8] ⊕ W[i − 14] ⊕ W[i − 16]) <<< 1\n    }\n    return W\n\
