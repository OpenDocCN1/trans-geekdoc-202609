  md: '**NP** is the class of decision problems for which you can verify a solution
    in polynomial time—that is, efficiently—even though the solution may be hard to
    find. By *verified*, I mean that given a potential solution, you can run some
    polynomial-time algorithm that checks whether you’ve found an actual solution.
    For example, the problem of deciding whether there exists a key K such that C
    = **E**(K, P) given P and C for a symmetric cryptosystem **E** is in **NP**. This
    is because given a candidate key K₀, you can check that K₀ is the correct key
    by verifying that **E**(K₀, P) equals C. You can’t find a potential key (the solution),
    if it exists, in polynomial time, but you can check whether a key is correct.


    Now for a counterexample: What about known-ciphertext attacks? This time, you
    get only some **E**(K, P) values for random unknown plaintext Pₛ. If you don’t
    know what the Pₛ are, then there’s no way to verify whether a potential key, K₀,
    is the right one. In other words, the key-recovery problem under known-ciphertext
    attacks is not in **NP** (let alone in **P**), as you can’t express it as a decision
    problem.


    Another example of a problem not in **NP** is that of verifying the *absence*
    of a solution to a problem. Verifying that a solution is correct boils down to
    computing some algorithm with the candidate solution as an input and then checking
    the return value. However, to verify that *no* solution exists, you may need to
    go through all possible inputs. If there’s an exponential number of inputs, you
    won’t be able to efficiently prove that no solution exists. The absence of a solution
    is hard to show for the hardest problems in the class **NP**—the so-called **NP**-complete
    problems.


    # ## NP-Complete Problems


    **NP**-complete problems are the hardest decision problems in the class **NP**;
    you won’t know how to solve the worst-case instances of these problems in polynomial
    time. As complexity theorists discovered in the 1970s when they developed the
    theory of **NP**-completeness, **NP**’s hardest problems are all fundamentally
    equally hard. This was proven by showing that you can turn any efficient solution
    to any of the **NP**-complete problems into an efficient solution for any of the
    other **NP**-complete problems. In other words, if you can solve any **NP**-complete
    problem efficiently, you can solve all of them, as well as all problems in **NP**.
    How can this be?


    **NP**-complete problems come in different guises, but they’re fundamentally similar
    from a mathematical perspective. In fact, you can reduce any **NP**-complete problem
    to any other **NP**-complete problem such that the capability to solve the second
    implies the capability to solve the first. Remember that **NP** contains decision
    problems, not search problems. You can efficiently transform an algorithm able
    to solve a search problem into an algorithm able to solve the corresponding decision
    problem, though the converse direction is not always possible. Fortunately, this
    is the case for **NP**-complete problems, which explains why people often mix
    up the two.'
