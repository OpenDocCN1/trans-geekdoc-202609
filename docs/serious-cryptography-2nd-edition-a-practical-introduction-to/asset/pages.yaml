    **ShiftRows** Shifts the iᵗʰ row of i positions, for i ranging from 0 to 3 (see
    Figure 4-5).


    **MixColumns** Applies the same linear transformation to each of the four columns
    of the state (that is, each group of cells with the same shade of gray, as on
