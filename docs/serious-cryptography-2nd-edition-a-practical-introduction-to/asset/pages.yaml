- pgno: 127
  md: "A5/1 first sets all registers to zero and injects the key followed by the nonce\
    \ bit by bit to each register, and after each bit is injected, the registers are\
    \ updated. The system is then updated 100 times following the previously described\
    \ irregular rule.\n\nAttacks on A5/1 recover the 64-bit initial state of the system\
    \ (the 19 + 22 + 23 LFSR initial value), in turn revealing the nonce (if it wasn’t\
    \ already known) and the key, by unwinding the initialization mechanism. The attacks\
    \ are known-plaintext attacks (KPAs) because part of the encrypted data is known,\
    \ which allows attackers to determine the corresponding keystream parts by XORing\
    \ the ciphertext with the known plaintext chunks.\n\nThere are two main types\
    \ of attacks on A5/1:\n\n+   - **Subtle attacks** Exploit the internal linearity\
    \ of A5/1 and its simple irregular clocking system.\n+   - **Brutal attacks**\
    \ Exploit only the short key of A5/1 and the invertibility of the frame number\
    \ injection.\n\nLet’s see how these attacks work.\n\n# Subtle Attacks\n\nWe’ll\
    \ examine the guess-and-determine subtle attack. In this kind of attack, an attacker\
    \ guesses certain secret values of the state to determine others. In cryptanalysis,\
    \ “guessing” means brute-forcing: for each possible value of LFSRs 1 and 2 and\
    \ all possible values of LFSR 3’s clocking bit during the first 11 clocks, the\
    \ attack reconstructs LFSR 3’s bits by solving equations that depend on the bits\
    \ guessed. When the guess is correct, the attacker gets the right value for LFSR\
    \ 3.\n\nThe attack’s pseudocode looks like this:\n\n```\nFor all 2^19 values of\
    \ LFSR 1's initial state\n    For all 2^22 values of LFSR 2's initial state\n\
    \        For all 2^11 values of LFSR 3's clocking bit during the first 11 clocks\n\
    \            Reconstruct LFSR 3's initial state\n            Test whether guess\
    \ is correct; if yes, return; else continue\n```\n\nHow efficient is this attack\
    \ compared to the 2^64-trial brute-force search discussed in Chapter 3? This attack\
    \ makes at most 2^19 × 2^22 × 2^11 = 2^52 operations in the worst case, when the\
    \ algorithm succeeds only at the very last test. That’s 2^12 (or about 4,000)\
    \ times faster than in the brute-force search, assuming that the last two operations\
    \ in the previous pseudocode require about as much computation as testing a 64-bit\
    \ key in a brute-force search. But is this assumption correct?\n\nRecall our discussion\
    \ of the full attack cost in Chapter 3. When evaluating the cost of an attack,\
    \ we need to consider not only the amount of computation required to perform the\
    \ attack but also parallelism and memory consumption. Neither is an issue here:\
    \ as with any brute-force attack, the guess-and-determine attack is embarrassingly\
    \ parallel (or N times faster when run on N cores) and doesn’t need more memory\
    \ than just running the cipher itself."
