    is believed to be practically infeasible.


    Rivest–Shamir–Adleman (RSA) is the most famous crypto scheme to rely on the factoring
    problem. RSA encrypts a plaintext, *P*, seen as a large number, by computing *C*
    = *P*<sup>*e*</sup> mod *n*, where the number *e* and *n* = *pq* are the public
    key. Decryption recovers a plaintext from a ciphertext by computing *P* = *C*<sup>*d*</sup>
    mod *n*, where *d* is the private key associated with *e* and *n*. If we can factor
    *n*, then we can break RSA (by recovering the private key from the public key),
    and if we can obtain the private key, then we can factor *n* (for example, see
    the article at <i>https://eprint.iacr.org/2004/208</i>). In other words, recovering
    an RSA private key and factoring *n* are equivalently hard problems. That’s the
    kind of reduction we’re looking for in provable security. However, there is no
    guarantee that recovering an RSA plaintext is as hard as factoring *n*, since
    the knowledge of a plaintext doesn’t reveal the private key.


    # ## Proofs Relative to Another Crypto Problem


    Instead of comparing a crypto scheme to a math problem, you can compare it to
    another crypto scheme and prove that you can break the second scheme only if you
    can break the first. Security proofs for symmetric ciphers usually follow this
    approach.


    For example, if all you have is a single permutation algorithm, then you can build
    symmetric ciphers, random bit generators, and other crypto objects such as hash
    functions by combining calls to the permutations with various types of inputs
    (as you’ll see in Chapter 6). Proofs then show that the newly created schemes
    are secure if the permutation is secure. In other words, we know that the newly
    created algorithm is *not weaker* than the original one. Such proofs usually work
    by crafting an attack on the smaller component, given an attack on the larger
    one—that is, by showing a reduction.


    When proving that a crypto algorithm is no weaker than another, the main benefit
    is that of a reduced attack surface: instead of analyzing both the core algorithm
    and the combination, you can simply look at the new cipher’s core algorithm. Specifically,
    if you write a cipher that uses a newly developed permutation and a new combination,
    you may prove that the combination doesn’t weaken security compared to the core
    algorithm. Therefore, to break the combination, you need to break the new permutation.


    # ## Caveats


    Cryptography researchers rely heavily on security proofs, whether with respect
    to math problem schemes or to other crypto schemes. But the existence of a security
    proof doesn’t guarantee that a cryptographic scheme is perfect, nor is it an excuse
    for neglecting the more practical aspects of implementation. After all, as cryptographer
    Lars Knudsen once said, “If it’s provably secure, it’s probably not,” meaning
    that a security proof shouldn’t be taken as an absolute guarantee of security.
    Worse, there are multiple reasons why a “provably secure” scheme may lead to a
    security failure.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'One issue is with the phrase “proof of security” itself. In mathematics, a
    proof is the demonstration of an *absolute truth*, but in crypto, a proof is only
    the demonstration of a *relative truth*. For example, a proof that your cipher
    is as hard to break as it is to compute discrete logarithms—finding the number
    *x* given *g* and *g^x* mod *n*—guarantees that if your cipher fails, a whole
    lot of other ciphers will fail as well, and nobody will blame you if the worst
    happens.


    Another caveat is that one usually proves security with respect to a single notion
    of security. For example, you might prove that recovering the private key of a
    cipher is as hard as the factoring problem. But if you can recover plaintexts
    from ciphertext without the key, you’ll bypass the proof, and recovering the key
    hardly matters.


    Then again, proofs are not always correct, and it may be easier to break an algorithm
    than originally thought.


    > **NOTE** *Unfortunately, few researchers carefully check security proofs, which
    commonly span dozens of pages, thus complicating quality control. That said, demonstrating
    that a proof is incorrect doesn’t necessarily imply that the proof’s goal is completely
    wrong; if the result is correct, one may salvage the proof by correcting its errors.*


    Another important consideration is that hard math problems sometimes turn out
    to be easier to solve than expected. For example, certain weak parameters make
    it easy to break the RSA cryptosystem. Or the math problem may be hard in certain
    cases but not on average, as often happens when the reference problem is new and
    not well understood. That’s what happened when the 1978 knapsack encryption scheme
    by Merkle and Hellman was later broken using lattice reduction techniques.


    Finally, although the proof of an algorithm’s security may be fine, the implementation
    of the algorithm can be weak. For example, attackers may exploit side-channel
    information such as power consumption or execution time to learn about an algorithm’s
    internal operations in order to break it, thus bypassing the proof. Or implementers
    may misuse the crypto scheme: if the algorithm is too complicated with too many
    knobs to configure, chances are higher that the user or developer will get a configuration
    wrong, which may render the algorithm completely insecure.


    # Heuristic Security


    Provable security is a great tool to gain confidence in a crypto scheme, but it
    doesn’t apply to all kinds of algorithms. In fact, most symmetric ciphers don’t
    have a security proof. For example, every day we rely on AES to securely communicate
    using our mobile phones, laptops, and desktop computers, but AES is not provably
    secure; there’s no proof that it’s as hard to break as some well-known problem.
    AES can’t be related to a math problem or to another algorithm because it’s the
    hard problem itself.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'In cases where provable security doesn’t apply, the only reason to trust a
    cipher is because many skilled people tried to break it and failed. We call this
    *heuristic security*.


    When can we be sure that a cipher is secure? We can never be sure, but we can
    be pretty confident that an algorithm won’t be broken when hundreds of experienced
    cryptanalysts have each spent hundreds of hours trying to break it and published
    their findings—usually by attempting attacks on *simplified versions* of a cipher
    (often versions with fewer operations, or fewer *rounds*, which are short series
    of operations that ciphers iterate in order to mix bits together).


    When analyzing a new cipher, cryptanalysts first try to break one round, then
    two, three, or as many as they can. The *security margin* is then the difference
    between the total number of rounds and the number of successfully attacked rounds.
    After years of study, if a cipher’s security margin is still high, we become confident
    that it’s (probably) secure.


    # Generating Keys


    If you plan to encrypt something, you’ll have to generate keys, whether they’re
    temporary “session keys” (like the ones generated when browsing an HTTPS site)
    or long-term public keys. Recall from Chapter 2 that secret keys are the crux
    of cryptographic security and should be randomly generated so that they are unpredictable
    and secret.


    For example, when you browse an HTTPS website, your browser receives the site’s
    public key and uses it to establish a symmetric key that’s valid only for the
    current session, and that site’s public key and its associated private key may
    be valid for years. Therefore, it’d better be hard for an attacker to find. But
    generating a secret key isn’t always as simple as dumping enough pseudorandom
    bits. We can generate cryptographic keys in one of three ways:


    +   - *Randomly*, using a PRNG feeding a key-generation algorithm

    +   - From a *password*, using a password-based key derivation function (PBKDF),
    which transforms the user-supplied password into a key

    +   - Through a *key agreement protocol*, which is a series of message exchanges
    between two or more parties that ends with the establishment of a shared key


    For now, I’ll explain the simplest method: randomized generation.


    # Symmetric Keys


    Symmetric keys are secret keys shared by two parties, and they are the simplest
    to generate. They are usually the same length as the security level they provide:
    a 128-bit key provides 128-bit security, and any of the 2¹²⁸ possible keys is
    valid.


    To generate a symmetric key of *n* bits using a cryptographic PRNG, you simply
    ask it for *n* pseudorandom bits and use those bits as the key.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'That’s it. You can, for example, use the OpenSSL toolkit to generate a random
    symmetric key by dumping pseudorandom bytes, as in the following command:


    ```

    ```text

    $ openssl rand -hex 16

    65a4400ea649d282b855bd2e246812c6

    ```

    ```


    Your result will, of course, differ from mine.


    # Asymmetric Keys


    Unlike symmetric keys, asymmetric keys are usually longer than the security level
    they provide. But the main problem stems from asymmetric keys being trickier to
    generate than symmetric ones because you can’t dump *n* bits from your PRNG and
    get away with the result. Asymmetric keys aren’t just raw bit sequences. Instead,
    they represent a specific type of object, such as a large number with specific
    properties (in RSA, a product of two primes). A random bit string value (and thus
    a random number) is unlikely to have the necessary properties and therefore won’t
    be a valid key.


    To generate an asymmetric key, you send pseudorandom bits as a seed to a *key-generation
    algorithm*. This algorithm takes as input a seed value that’s at least as long
    as the intended security level and constructs from it a private key and its respective
    public key, ensuring that both satisfy the necessary criteria. For example, a
    naive key-generation algorithm for RSA would generate a number, *n = pq*, by using
    an algorithm to generate two random primes of about the same length. That algorithm
    would pick random numbers until one happens to be prime, so you’d also need an
    algorithm to test whether a number is prime.


    To save yourself the burden of manually implementing the key-generation algorithm,
    you can use OpenSSL to generate a 4,096-bit RSA private key, like this:


    ```

    ```text

    $ openssl genrsa 4096

    Generating RSA private key, 4096 bit long modulus (2 primes)

    ................................................................

    ...............................................................++

    ........................................................++

    e is 65537 (0x10001)

    -----BEGIN RSA PRIVATE KEY-----

    MIIJ... [RSA private key contents omitted]

    -----END RSA PRIVATE KEY-----

    ```

    ```'
