- pgno: 30
  md: '# 1


    # ENCRYPTION


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_30_0.png)


    Encryption is the principal application of cryptography; it makes data incomprehensible
    to ensure its *confidentiality*. Encryption uses an algorithm called a *cipher*
    and a secret value called the *key*. If you don’t know the secret key, you can’t
    decrypt, nor can you learn any bit of information on the encrypted message—and
    neither can any attacker.


    This chapter focuses on symmetric encryption, which is the simplest kind of encryption.
    In *symmetric encryption*, the decryption key is the same as the encryption key
    (unlike *asymmetric encryption*, or *public-key encryption*, in which the keys
    are different). You’ll start by learning about the weakest forms of symmetric
    encryption, classical ciphers that are secure against only the most illiterate
    attacker, and then we’ll move on to the strongest forms that are secure forever.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# The Basics


    When encrypting a message, *plaintext* refers to the unencrypted message and *ciphertext*
    to the encrypted message. A cipher is therefore composed of two functions: *encryption*
    turns a plaintext into a ciphertext, and *decryption* turns a ciphertext back
    into a plaintext. But we’ll often say “cipher” when we actually mean “encryption.”
    For example, Figure 1-1 shows a cipher, **E**, represented as a box taking as
    input a plaintext, *P*, and a key, *K*, and producing a ciphertext, *C*, as output.
    I’ll write this relation as *C* = **E**(*K*, *P*). Similarly, when the cipher
    is in decryption mode, I’ll write **D**(*K*, *C*).


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_31_0.png)


    Figure 1-1: Basic encryption and decryption


    **NOTE** For some ciphers, the ciphertext is the same size as the plaintext; for
    others, the ciphertext is slightly longer. However, ciphertexts can never be shorter
    than plaintexts.


    # Classical Ciphers


    Classical ciphers predate computers and therefore work on letters rather than
    on bits, making them much simpler than a modern cipher like the Data Encryption
    Standard. For example, in ancient Rome or during World War I, you couldn’t use
    a computer chip’s power to scramble a message; you had to do everything with only
    pen and paper. There are many classical ciphers, but the most famous are the Caesar
    cipher and Vigenère cipher.


    # The Caesar Cipher


    The Caesar cipher is so named because the Roman historian Suetonius reported that
    Julius Caesar used it. It encrypts a message by shifting each of the letters down
    three positions in the alphabet, wrapping back around to *A* if the shift reaches
    *Z*. For example, *ZOO* encrypts to *CRR*, *FDHVDU* decrypts to *CAESAR*, and
    so on, as shown in Figure 1-2. There’s nothing special about the value 3; it’s
    just easier to compute in one’s head than 11 or 23.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_32_0.png)


    Figure 1-2: The Caesar cipher


    The Caesar cipher is super easy to break: to decrypt a given ciphertext, simply
    shift the letters three positions back to retrieve the plaintext. That said, the
    Caesar cipher may have been strong enough during the time of Crassus and Cicero.
    Because no secret key is involved (it''s always 3), users of Caesar''s cipher
    assumed that attackers were illiterate or too uneducated to figure it out—an assumption
    that''s much less realistic today. (In fact, in 2006, the Italian police arrested
    a mafia boss after decrypting messages written on small scraps of paper that were
    encrypted using a variant of the Caesar cipher: ABC was encrypted to 456 instead
    of DEF, for example.)


    Could the Caesar cipher be made more secure? You might imagine a version that
    uses a secret shift value instead of always using 3, but that wouldn''t help much
    because an attacker could try all 25 possible shift values until the decrypted
    message makes sense.


    # The Vigenère Cipher


    It took about 1,500 years to see a meaningful improvement of the Caesar cipher
    in the form of the Vigenère cipher, created in the 16th century by an Italian
    named Giovan Battista Bellaso. The name Vigenère comes from the Frenchman Blaise
    de Vigenère, who invented a different cipher in the 16th century, but due to historical
    misattribution, Vigenère''s name stuck. Nevertheless, the Vigenère cipher became
    popular and was later used during the American Civil War by Confederate forces
    and during WWI by the Swiss Army, among others.


    The Vigenère cipher is similar to the Caesar cipher, except that letters aren''t
    shifted by three places but rather by values defined by a key, a collection of
    letters that represent numbers based on their position in the alphabet. For example,
    if the key is DUH, letters in the plaintext are shifted using the values 3, 20,
    7 because D is three letters after A, U is 20 letters after A, and H is seven
    letters after A. The 3, 20, 7 pattern repeats until you''ve encrypted the entire
    plaintext. For example, the word CRYPTO would encrypt to FLFSNV using DUH as the
    key: C is shifted three positions to F,'
  merge: -1
  img_proc: true
- pgno: 33
  md: '*R* is shifted 20 positions to *L*, and so on. Figure 1-3 illustrates this
    principle when encrypting the sentence *THEY DRINK THE TEA*.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_33_0.png)


    The Vigenère cipher is clearly more secure than the Caesar cipher, yet it’s still
    fairly easy to break. The first step in decrypting it is to figure out the key’s
    length. Take the example in Figure 1-3, wherein *THEY DRINK THE TEA* encrypts
    to *WBLBXYLHRWBLWYH* with the key *DUH*. (Spaces are usually removed to hide word
    boundaries.) Notice that in the ciphertext *WBLBXYLHRWBLWYH*, the group of three
    letters *WBL* appears twice in the ciphertext at nine-letter intervals. This suggests
    that the same three-letter word was encrypted using the same shift values, producing
    *WBL* each time. A cryptanalyst can then deduce that the key’s length is either
    nine or a value that divides nine (that is, three). Furthermore, they may guess
    that this repeated three-letter word is *THE* and therefore determine *DUH* as
    a possible encryption key.


    The second step to breaking the Vigenère cipher is to determine the actual key
    using a method called *frequency analysis*, which exploits the uneven distribution
    of letters in languages. For example, in English, *E* is the most common letter,
    so if you find that *X* is the most common letter in a ciphertext, then the most
    likely plaintext value at this position is *E*.


    Despite its relative weakness, the Vigenère cipher may have been good enough to
    securely encrypt messages in its time. Frequency analysis is limited in that it
    requires a few sentences, meaning it won’t work if the cipher is used to encrypt
    short messages. Also, most messages needed to be secret for short periods of time,
    so it didn’t matter if ciphertexts were eventually decrypted by the enemy. (The
    19th-century cryptographer Auguste Kerckhoffs estimated that most encrypted wartime
    messages required confidentiality for only three to four hours.)


    # How Ciphers Work


    Basing ourselves on the simplistic Caesar and Vigenère ciphers, we can try to
    abstract out the workings of a cipher by identifying its two main components:
    a permutation and a mode of operation. A *permutation* is a function that transforms
    an item (in cryptography, a letter or a group of bits) such that each item has
    a unique inverse (for example, the Caesar cipher’s'
