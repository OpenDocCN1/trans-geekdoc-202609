    # Message Encryption in CBC Mode


    Let’s circle back to the block termination issue and look at how to process a
    plaintext whose length is not a multiple of the block length. For example, how
    would you encrypt an 18-byte plaintext with AES-CBC when blocks are 16 bytes?
    What do you do with the 2 bytes left? You’ll look at two widely used techniques
    to deal with this problem. The first one, padding, makes the ciphertext a bit
    longer than the plaintext, while the second one, ciphertext stealing, produces
    a ciphertext of the same length as the plaintext.


    # Message Padding


    Padding is a technique that allows you to encrypt a message of any length, even
    one smaller than a single block. The PKCS#7 standard and RFC 5652 specify padding
    for block ciphers, which we use almost everywhere we use CBC.


    We use padding to expand a message to fill a complete block by adding extra bytes
    to the plaintext. Here are the rules for padding 16-byte blocks:


    +   - If there’s 1 byte left—for example, if the plaintext is 1 byte, 17 bytes,
    or 33 bytes long—pad the message with 15 bytes 0f (15 in decimal).

    +   - If there are 2 bytes left, pad the message with 14 bytes 0e (14 in decimal).

    +   - If there are 3 bytes left, pad the message with 13 bytes 0d (13 in decimal).'
