  md: 'some examples that illustrate the diversity of problems leveraged by cryptographers:


    +   - The Diffie–Hellman problem (given g^x and g^y, find g^{xy}) is a variant
    of the discrete logarithm problem and is widely used in key agreement protocols.

    +   - Lattice problems, such as the shortest vector problem (SVP) as well as the
    short integer solutions (SIS) and learning with errors (LWE) problems, can be
    **NP**-hard, depending on their parameters.

    +   - Coding problems rely on the hardness of decoding error-correcting codes
    with insufficient information and have been studied since the late 1970s. These
    can also be **NP**-hard.

    +   - Multivariate problems are about solving nonlinear systems of equations and
    are potentially **NP**-hard, but they’ve failed to provide reliable cryptosystems
    because hard versions are too big and slow, and practical versions were found
    to be insecure.


