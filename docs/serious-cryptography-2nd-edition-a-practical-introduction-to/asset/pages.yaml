    \ is simple but highly inefficient. You can get the same result exponentially\
    \ faster by squaring rather than multiplying intermediate values y until you reach\
    \ the correct value. This family of methods is called *square-and-multiply*, *exponentiation\
    \ by squaring*, or *binary exponentiation*.\n\nSay you want to compute $3^{65,537}\
