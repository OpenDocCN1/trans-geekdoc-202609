- pgno: 187
  md: 'One advantage of this method is that the receiver needs to compute a MAC only
    to detect corrupt messages, meaning that there''s no need to decrypt a corrupt
    ciphertext. Also, attackers can''t send pairs of C and T to the receiver to decrypt
    unless they''ve broken the MAC, which makes it harder for attackers to transmit
    malicious data to the recipient.


    This combination of features makes encrypt-then-MAC stronger than the encrypt-and-MAC
    and MAC-then-encrypt approaches. This is one reason why the widely used IPsec
    secure communications protocol suite uses it to protect packets (for example,
    within VPN tunnels).


    Note that SSH and TLS don''t use encrypt-then-MAC because other approaches appeared
    adequate when SSH and TLS were created—not because theoretical weaknesses didn''t
    exist but because undesirable properties don''t necessarily become actual vulnerabilities.


    # Authenticated Ciphers


    Authenticated ciphers are an alternative to the cipher and MAC combinations. They''re
    like normal ciphers except that they return an authentication tag together with
    the ciphertext.


    You represent the authenticated cipher encryption as AE(K, P) = (C, T). The term
    AE stands for authenticated encryption, which is based on a key (K) and a plaintext
    (P) and returns a ciphertext (C) and a generated authentication tag (T). In other
    words, a single authenticated cipher algorithm does the same job as a cipher and
    MAC combination, making it simpler, faster, and often more secure.


    You represent authenticated cipher decryption by AD(K, C, T) = P. Here, AD stands
    for authenticated decryption, which returns a plaintext (P) given a ciphertext
    (C), tag (T), and key (K). If the tag validation fails, AD returns an error to
    prevent the recipient from processing a plaintext that may have been forged. By
    the same token, if AD returns a plaintext, it''s been encrypted by someone or
    something that knows the secret key.


    The basic security requirements of an authenticated cipher are simple: its authentication
    should be as strong as a MAC''s, meaning it should be impossible to forge a ciphertext
    and tag pair (C, T) that the decryption function AD will accept and decrypt.


    As far as confidentiality is concerned, an authenticated cipher is fundamentally
    stronger than a basic cipher because systems holding the secret key will decrypt
    a ciphertext only if the authentication tag is valid. If the tag is invalid, the
    plaintext is discarded. This characteristic prevents attackers from performing
    chosen-ciphertext queries, an attack where they create ciphertexts and ask for
    the corresponding plaintext.


    # Authenticated Encryption with Associated Data


    Cryptographers define associated data as any data processed by an authenticated
    cipher such that the data is authenticated (thanks to the authentication tag)
    but not encrypted. By default, all plaintext data fed to an authenticated cipher
    is encrypted and authenticated.'
