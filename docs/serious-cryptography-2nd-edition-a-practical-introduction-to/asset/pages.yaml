- pgno: 317
  md: 'cryptographers to submit algorithms and cryptanalyze other submitters’ algorithms
    to eliminate them from the competition.


    NIST received 69 submissions, most of which were lattice based. Of these submissions,
    26 made it to the second round. In July 2020, NIST selected seven finalist and
    eight alternate algorithms. In July 2022, NIST announced the first four standards:


    **CRYSTALS-Kyber**  A lattice-based *key encapsulation mechanism (KEM)*, which
    is a primitive that can be seen as an encryption scheme for secret keys. It can
    be used to encrypt data (within a hybrid scheme, where a symmetric cipher actually
    encrypts the data using a key encrypted by the KEM) and used for key agreement,
    in a similar way as Diffie–Hellman protocols.


    **CRYSTAL-Dilithium**  A lattice-based signature scheme designed by the same team
    as CRYSTALS-Kyber.


    **Falcon**  A lattice-based signature scheme based on slightly different techniques
    and assumptions than Dilithium.


    **SPHINCS+**  A hash-based signature scheme, thus the only algorithm not based
    on lattices.


    NIST stated the following regarding having two lattice-based signature schemes:


    > [Both] were selected for their strong security and excellent performance, and
    NIST expects them to work well in most applications.

    > Falcon will also be standardized by NIST since there may be use cases for which
    CRYSTALS-Dilithium signatures are too large.


    The shortest Dilithium signatures are approximately 2KB long, whereas Falcon’s
    are half as long. NIST also stated that it will standardize SPHINCS+ “to avoid
    relying only on the security of lattices for signatures.”


    At the time of writing, draft standards have been published under the FIPS series
    for Kyber, Dilithium, and SPHINCS+ as FIPS 203 (Module-Lattice-Based Key-Encapsulation
    Mechanism Standard), FIPS 204 (Module-Lattice-Based Digital Signature Standard),
    and FIPS 205 (Stateless Hash-Based Digital Signature Standard), respectively,
    while Falcon’s standard is expected a bit later.


    These post-quantum algorithms are expected to first be used in hybrid modes, in
    combination with a classical, non-quantum-resilient algorithm to hedge the risk
    of weaknesses. For example, Kyber is generally used in combination with X25519,
    the Diffie–Hellman scheme relying on Curve25519, to protect TLS connections.


    NIST also announced four algorithms advancing to the “fourth round.” These include
    the three code-based encryption schemes BIKE, Classic McEliece, and HQC. The isogeny-based
    SIKE was found to be completely broken shortly after the announcement and thus
    withdrew from the competition.


    NIST started a new project in summer 2022 to identify more post-quantum signature
    schemes, stating that “signature schemes that are not'
