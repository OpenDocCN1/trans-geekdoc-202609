    NIST''s Lightweight Cryptography project. Running from 2017 to 2023, it aimed
    at standardizing algorithms optimized for resource-constrained environments (memory,
    processor size, and so on) such as embedded platforms. The winner of the competition
    was Ascon, a family of permutation-based algorithms, presented in detail on its
    official site at https://ascon.iaik.tugraz.at. To discover the other candidate
    algorithms and the work presented at the project workshops, visit https://csrc.nist.gov/Projects/lightweight-cryptography.


    In this chapter, we focused on GCM, but a handful of other modes are used in real
