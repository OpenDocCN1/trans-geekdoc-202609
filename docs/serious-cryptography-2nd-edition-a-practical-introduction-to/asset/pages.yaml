  md: '# Insufficient Fiat–Shamir Hashing


    Imagine that instead of *c* = **H**(*G* || *R* || *A*), a noninteractive Schnorr
    proof did *c* = **H**(*G* || *A*), making the challenge *c* independent of the
    nonce *R*. The attacker then picks an arbitrary value for *s* and computes *R*
    = *sG* − *cA*. The resulting proof consists of *s* and *R* is valid, yet the attacker
    didn’t need to know *a*, thereby breaking the protocol’s soundness.


    Likewise, if *c* = **H**(*G* || *R*), omitting the public key *A* from the data
    hashed to define the challenge *c*, an attack is possible: the attacker can now
    choose arbitrary *R* and *s* values and compute the point *B* = (1/*c*) × (*sG*
    − *R*), which satisfies *sG* = *R* + *cB*. This gives the attacker a proof of
    knowledge of the discrete logarithm of *B*—namely, *b* such that *B* = *bG*—whereas
    they don’t know it.


    These attacks illustrate the importance of including all necessary values in the
    hash function input when using the Fiat–Shamir transform to make a protocol noninteractive.


    # Replay Attacks


    A replay is a trivial but potentially devastating attack. If an attacker learns
    the value of some noninteractive proof of knowledge, they can send it to another
    party and say they created it, claiming the credit for the knowledge proven.


    You may avoid this by binding the proof to the identity of the prover, including
    their public key in the data hashed. To prevent replay by the same party over
    time, you may bind the proof to a session identifier or timestamp by including
    such values in the data processed by the Fiat–Shamir hashes.


    # Randomness Reuse


    Consider the interactive Schnorr protocol, where the verifier picks a random *c*.
    If the prover has a flawed pseudorandom generator and reuses the same challenge
    *r* twice, then an attacker observing the exchanged values can recover the secret
    *a* by using the two proofs *s₁* = *r* + *c₁a* and *s₂* = *r* + *c₂a* for two
    distinct challenges, *c₁* and *c₂*, and computing *a* = (*s₁* − *s₂*) / (*c₁*
    − *c₂*).


    # Really Serious Crypto


