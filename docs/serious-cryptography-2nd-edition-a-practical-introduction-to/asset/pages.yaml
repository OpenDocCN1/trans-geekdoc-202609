  md: '+   1. Given a hash function with *n*-bit hash values, pick some random hash
    value (*H*₁), and define *H*₁ = *H*′₁.

    +   2. Compute *H*₂ = **Hash**(*H*₁) and *H*′₂ = **Hash**(**Hash**(*H*′₁)). In
    the first case apply the hash function once, while in the second case apply it
    twice.

    +   3. Iterate the process and compute *H*<sub>i+1</sub> = **Hash**(*H*<sub>i</sub>),
    *H*′<sub>i+1</sub> = **Hash**(**Hash**(*H*′<sub>i</sub>)), for increasing values
    of *i*, until you reach *i* such that *H*<sub>i+1</sub> = *H*′<sub>i+1</sub>.


    Figure 6-3 helps visualize the attack, where an arrow from, say, *H*₁ to *H*₂
    means *H*₂ = **Hash**(*H*₁). Observe that the sequence of *H*s eventually enters
    a loop, also called a *cycle*, which resembles the Greek letter rho (ρ) in shape.
    The cycle starts at *H*₅ and is characterized by the collision **Hash**(*H*₄)
    = **Hash**(*H*₁₀) = *H*₅. The key observation here is that to find a collision,
    you simply need to find such a cycle. The Rho method allows an attacker to detect
    the position of the cycle and therefore to find the collision.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_148_0.png)


    *Figure 6-3: The structure of the Rho hash function, where each arrow represents
    an evaluation of the hash function. The cycle beginning at H*₅ *corresponds to
    a collision, **Hash**(*H*₄) = **Hash**(*H*₁₀) = *H*₅.*


    Advanced collision-finding techniques based on the Rho method work by first detecting
    the start of the cycle and then finding the collision, without storing numerous
    values in memory or needing to sort a long list. This takes about 2ⁿ⧸² operations
    to succeed. Indeed, Figure 6-3 has many fewer hash values than would an actual
    function with digests of 256 bits or more. On average, the cycle and the tail
    (the part that extends from *H*₁ to *H*₅ in Figure 6-3) each include about 2ⁿ⧸²
    hash values, where *n* is the bit length of the hash values. Therefore, you’ll
    need at least 2ⁿ⧸² + 2ⁿ⧸² evaluations of the hash to find a collision.'
