- pgno: 224
  md: 'the Greek letter phi. This function gives the number of elements coprime with
    n, which is the number of elements in Z_n^*. As a rule, if n is a product of prime
    numbers n = p₁ × p₂ × … × pₘ, the number of elements in the group Z_n^* is the
    following:


    φ(n) = (p₁ − 1) × (p₂ − 1) × … × (pₘ − 1)


    RSA deals only with numbers n that are the product of two large primes, usually
    noted as n = p q. The associated group Z_n^* then contains φ(n) = (p − 1)(q −
    1) elements. By expanding this expression, you get the equivalent definition φ(n)
    = n − p − q + 1, or φ(n) = (n + 1) − (p + q), which expresses more intuitively
    the value of φ(n) relative to n.


    # The RSA Trapdoor Permutation


    The RSA trapdoor permutation is the core algorithm behind RSA-based encryption
    and signatures. Given a modulus n and a number e, which you call the public exponent,
    the RSA trapdoor permutation transforms a number x from the set Z_n^* into a number
    y = x^e mod n. In other words, it calculates the value that''s equal to x multiplied
    by itself e − 1 times modulo n and then returns the result. When you use the RSA
    trapdoor permutation to encrypt, the modulus n and the exponent e make up the
    RSA public key.


    To get x back from y, you can use another number, d, to compute the following:


    y^d mod n = (x^e)^d mod n = x^{ed} mod n = x


    Because d is the trapdoor that allows you to decrypt, it''s part of the private
    key in an RSA key pair, meaning it should always be kept secret. The number d
    is also called the secret exponent.


    Of course, d isn''t just any number; it''s the number such that e multiplied by
    d is equivalent to 1 and therefore such that x^{ed} mod n = x for any x. More
    precisely, you must have ed mod φ(n) = 1 to get x^{ed} = x^1 = x and to decrypt
    the message correctly. Note that you compute modulo φ(n) and not modulo n here
    because exponents behave like indexes of elements of Z_n^* rather than as the
    elements themselves. Because Z_n^* has φ(n) elements, the index must be less than
    φ(n).


    The number φ(n) is crucial to RSA''s security. In fact, finding φ(n) for an RSA
    modulus n is equivalent to breaking RSA because you can easily derive the secret
    exponent d from φ(n) and e by computing e''s inverse. Hence p and q should also
    be secret, since knowing p or q gives φ(n) by computing (p − 1)(q − 1) = φ(n).


    > **NOTE** φ(n) is called the order of the group Z_n^*; the order is an important
    characteristic of a group, which is essential to other public-key systems such
    as Diffie–Hellman and elliptic curve cryptography.'
