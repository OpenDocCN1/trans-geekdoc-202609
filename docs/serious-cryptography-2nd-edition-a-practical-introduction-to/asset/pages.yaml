- pgno: 82
  md: "Notice that the key comes in a specific format—namely, base64-encoded data\
    \ between the BEGIN RSA PRIVATE KEY and END RSA PRIVATE KEY markers. That’s a\
    \ standard encoding format that most systems support and can convert to raw bytes\
    \ of data. The dot sequences at the beginning are a kind of progress bar, and\
    \ e is 65537 (0x10001) indicates the parameter to use when encrypting (remember\
    \ that RSA encrypts by computing $C = P^e \\bmod n$).\n\n# ## Protecting Keys\n\
    \nOnce you have a secret key, you need to keep it secret yet available when you\
    \ need it. There are three ways to address this problem:\n\n# **Key wrapping (encrypting\
    \ the key using a second key)**\n\nThe problem with this approach is that the\
    \ second key must be available when you need to decrypt the protected key. In\
    \ practice, this second key is often generated from a password the user supplies\
    \ when they need to use the protected key. That’s how private keys for the Secure\
    \ Shell (SSH) protocol are usually protected.\n\n# **On-the-fly generation from\
    \ a password**\n\nThis doesn’t require storing an encrypted file because the key\
    \ comes straight out from the password. Systems like cryptocurrency wallets and\
    \ password managers often use this method.\n\nAlthough this method is more direct\
    \ than key wrapping, it’s less widespread, in part because it’s more vulnerable\
    \ to weak passwords. Say, for example, that an attacker captured some encrypted\
    \ message: if we used key wrapping, the attacker first needs to get the protected\
    \ key file, which may be stored locally on the user’s file system or in a key\
    \ management system (KMS), and therefore is not easy to access. But if we used\
    \ on-the-fly generation, the attacker can directly search for the correct password\
    \ by attempting to decrypt the encrypted message with candidate passwords. And\
    \ if the password is weak, the key is compromised.\n\n# **Storing the key on a\
    \ hardware token (smart card or USB dongle)**\n\nIn this approach, we store the\
    \ key in secure memory, and it remains safe even if the computer is compromised.\
    \ This is the safest approach to key storage but also the costliest and least\
    \ convenient because it requires you to carry the hardware token with you and\
    \ run the risk of losing it. Smart cards and USB dongles usually require you to\
    \ enter a password to unlock the key from the secure memory.\n\n> **NOTE**  \n\
    > *Whatever method you use, make sure not to mistake the private key for the public\
    \ one when exchanging keys, and don’t accidentally publish the private key through\
    \ email or source code. (I’ve actually found private keys on GitHub.)*"
