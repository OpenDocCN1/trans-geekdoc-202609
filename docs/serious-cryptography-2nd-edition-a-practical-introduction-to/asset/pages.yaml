    # Choosing and Evaluating Security Levels


    Choosing a security level often involves selecting between the 128-bit and 256-bit
    security levels available in most standard crypto algorithms and implementations.
    You''ll find schemes with 64- or 80-bit security, but these are generally not
    secure enough for real-world use.


    At a high level, 128-bit security means you''d need to carry out approximately
    2^128 operations to break that cryptosystem. To give you a sense of what this
    number means, consider the fact that the universe is approximately 2^88 nanoseconds
    old (there''s a billion nanoseconds in a second). Since testing a key with today''s
    technology takes no less than a nanosecond, you''d need several times the age
    of the universe for an attack to succeed (2^40 times, to be precise).


    But can''t parallelism and multiple targets dramatically reduce the time it takes
    to complete a successful attack? Not exactly. Say you''re interested in breaking
    any one of a million targets and that you have a million parallel cores available.
    That brings the search time down from 2^128 to (2^128 / 2^20) / 2^20 = 2^88, which
    is equivalent to "only" one universe lifetime.


    Another thing to consider when evaluating security levels is the evolution of
    technology. Moore''s law posits that computing efficiency doubles roughly every
    two years. We can think of this as a loss of 1 bit of security every two years:
    if today a $1,000 budget allows you to break, say, a 40-bit key in one hour, then
    Moore''s law says that two years later, you could break a 41-bit key in one hour
    for the same $1,000 budget (I''m simplifying). We can extrapolate from this to
    say that, according to Moore''s law, we''ll have 40 fewer bits of security in
    80 years compared to today. In other words, in 80 years doing 2^128 operations
    may cost as much as doing 2^88 operations today. Accounting for parallelism and
    multiple targets, we''re down to 2^18 nanoseconds of computation, or about three
    days. But this extrapolation is highly inaccurate because Moore''s law won''t
    and can''t scale that much. Still, you get the idea: what looks infeasible today
    may be realistic in a century.


    There will be times when a security level lower than 128 bits is justified such
    as when you need security for a short time period and when the costs of implementing
    a higher security level will negatively impact the cost or usability of a system.
    An example is pay-TV systems, wherein encryption keys are either 48 or 64 bits.
    This sounds ridiculously low but is sufficient because the key refreshes every
    5 or 10 seconds.


    Nevertheless, to ensure long-term security, you should choose 256-bit security
    or a bit less. Even in a worst-case scenario—the existence of quantum computers
    (see Chapter 14)—we''re unlikely to break a 256-bit secure scheme in the foreseeable
    future. More than 256 bits of security is practically unnecessary, except as a
    marketing device.'
