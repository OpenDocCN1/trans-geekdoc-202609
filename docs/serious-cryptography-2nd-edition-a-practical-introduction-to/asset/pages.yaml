    In practice, AES-GCM usually returns 128-bit tags, but it can produce tags of
    any length. Unfortunately, when using shorter tags, the probability of forgery
    increases significantly.


    When using a 128-bit tag, an attacker who attempts a forgery should succeed with
    a probability of 1/2^128 because there are 2^128 possible 128-bit tags. (Generally,
    with an n-bit tag, the probability of success should be 1/2^n, where 2^n is the
    number of possible values of an n-bit tag.) But when using shorter tags, the probability
    of forgery is much higher than 1/2^n due to weaknesses in the structure of GCM
    that are beyond the scope of this discussion. For example, a 32-bit tag allows
    an attacker who knows the authentication tag of some 2MB message to succeed with
    a chance of 1/2^16 instead of 1/2^32.


