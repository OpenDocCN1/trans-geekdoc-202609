    the efficiency of attacks. Some attacks claim to reduce a cipher’s security because
    they perform $2^{120}$ evaluations of some operation rather than $2^{128}$ evaluations
    of the cipher, but the speed of each type of attack is left out of the analysis.
    The $2^{120}$-operation attack won’t always be faster than a $2^{128}$ brute-force
    attack.


    Nevertheless, bit security remains a useful notion as long as the operation is
    reasonably defined—meaning about as fast as an evaluation of the cipher. After
    all, in real life, all it takes to determine whether a security level is sufficient
    is an order of magnitude.


    # Calculating the Full Attack Cost


    Bit security expresses the cost of the fastest attack against a cipher by estimating
    the order of magnitude of the number of operations it needs to succeed. But other
    factors affect the cost of an attack, and we must take these into account when
    estimating the actual security level. I’ll explain the four main ones: parallelism,
    memory, precomputation, and the number of targets.


    # Parallelism


    The first factor to consider is computational parallelism—that is, the ability
    of the attack’s implementation to take advantage of parallel computing, such as
    multicore systems.


    For example, consider these two attacks of $2^{56}$ operations each:


    +   - The first attack performs $2^{56}$ *sequentially dependent* operations,
    computing $x_{i+1}=f_i(x_i)$ for some fixed $x_0$ and distinct functions $f_i$
    (with $i$ from 1 to $2^{56}$).

    +   - The second attack performs $2^{56}$ *independent* operations, computing
    $x_i=f_i(x)$ for some fixed $x$ and distinct functions $f_i$ (with $i$ from 1
    to $2^{56}$). It can execute the $f_i(x)$ computations in parallel because each
    $f_i(x)$ is independent of the others.


    The difference between the two attacks is that one can parallelize the second
    attack but not the first. Parallel processing can be orders of magnitude faster
    than sequential processing. For example, if you had $2^{16}=65,536$ processors
    available, you could divide the workload of the parallel attack into $2^{16}$
    independent tasks, each performing $2^{56}/2^{16}=2^{40}$ operations. The first
    attack, however, cannot benefit from having multiple cores available'
