  md: '# # The Diffie–Hellman Problems


    The security of DH protocols relies on the hardness of computational problems,
    especially on that of the discrete logarithm problem (DLP) from Chapter 9. You
    can break DH by recovering the private value $a$ from its public value $g^a$,
    which boils down to solving a DLP instance. But we don’t care about just the discrete
    logarithm problem when using DH to compute shared secrets. We also care about
    two DH-specific problems.


    # ## The Computational Problem


    The *computational Diffie–Hellman (CDH)* problem is that of computing the shared
    secret $g^{ab}$ given only the public values $g^a$ and $g^b$, without knowing
    the secret values $a$ and $b$. The motivation is to ensure that even if an eavesdropper
    captures $g^a$ and $g^b$, they shouldn’t be able to determine the shared secret
    $g^{ab}$.


    If you can solve DLP, then you can also solve CDH; that is, if you determine $a$
    and $b$ given $g^a$ and $g^b$, then you’ll be able to compute $g^{ab}$. In other
    words, DLP is *at least* as hard as CDH. But you don’t know for sure whether CDH
    is at least as hard as DLP, which would make the problems equally hard. In other
    words, DLP is to CDH what the factoring problem is to the RSA problem. (Recall
    that factoring allows you to solve the RSA problem but not necessarily the converse.)


    Diffie–Hellman shares another similarity with RSA in that DH delivers a similar
    security level as RSA for a given modulus size. For example, the DH protocol with
    a 2,048-bit prime $p$ offers roughly 90-bit security, as RSA with a 2,048-bit
    modulus. Indeed, the fastest way to break CDH is to solve DLP using the *number
    field sieve* algorithm, a method similar but not identical to the general number
    field sieve (GNFS), which breaks RSA by factoring its modulus.


    # ## The Decisional Problem


    When you need a seemingly stronger assumption than CDH’s hardness, enter the *decisional
    Diffie–Hellman (DDH)* problem. Given $g^a$, $g^b$, and a value that’s either $g^{ab}$
    or $g^c$ for some random $c$ (each of the two with a chance of 1/2), the DDH problem
    consists of determining whether $g^{ab}$ (the shared secret corresponding to $g^a$
    and $g^b$) was chosen.


    Relying on DDH rather than CDH is relevant in the following case: imagine that
    an attacker can compute only the first 32 bits of $g^{ab}$ given the 2,048-bit
    values of $g^a$ and $g^b$. Although CDH remains unbroken because 32 bits may not
    be enough to completely recover $g^{ab}$, the attacker would’ve learned something
    about the shared secret, which might allow them to compromise an application’s
    security.


    To ensure that an attacker can’t learn anything about the shared secret $g^{ab}$,
    this value needs to be *indistinguishable* from a random group element, just as
    an encryption scheme is secure when ciphertexts are indistinguishable from random
    strings. That is, an attacker shouldn’t be able'
