- pgno: 122
  md: 'The state spans all possible values except 0000 with no repetition until it
    eventually loops. This demonstrates that the period is maximal and that the feedback
    polynomial is primitive.


    Alas, using an LFSR as a stream cipher is not secure. If n is the LFSR''s bit
    length, an attacker needs only n output bits to recover the LFSR''s initial state,
    allowing them to determine all previous bits and predict all future bits. This
    attack is possible because the LFSR is linear, implying that relations between
    the bits of the state obey linear equations, which are simple to solve. You can
    use the Berlekamp–Massey algorithm to solve the equations defined by the LFSR''s
    mathematical structure to find not only the LFSR''s initial state but also its
    feedback polynomial. In fact, you don''t even need to know the exact length of
    the LFSR to succeed; you can repeat the Berlekamp–Massey algorithm for all possible
    values of n until you hit the right one.


    The upshot is that LFSRs are cryptographically weak because they''re linear. Output
    bits and initial state bits are related by simple and short equations that you
    can solve with high school linear algebra techniques. To strengthen LFSRs, let''s
    add a pinch of nonlinearity.


    # Filtered LFSRs


    To mitigate the insecurity of LFSRs, hide their linearity by passing their output
    bits through a nonlinear function before returning them to produce a filtered
    LFSR, as Figure 5-7 illustrates.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_122_0.png)


    Figure 5-7: A filtered LFSR


    The g function in Figure 5-7 must be a nonlinear function—one that both XORs bits
    together and combines them with logical AND or OR operations. For example, L1L2
    + L3L4 is a nonlinear function (I''ve omitted the multiplication sign, so L1L2
    means L1 × L2, or L1 & L2 using C syntax).


    > NOTE You can write feedback functions either directly in terms of an FSR''s
    bits, like L1L2 + L3L4, or using the equivalent polynomial notation 1 + XX² +
    X²X⁴. The direct notation is easier to grasp, but the polynomial notation better
    serves the mathematical analysis of an FSR''s properties. We''ll stick to the
    direct notation unless we care about the mathematical properties.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Filtered LFSRs are stronger than plain LFSRs because their nonlinear function
    thwarts straightforward attacks. Still, more complex attacks such as the following
    will break the system:


    +   - **Algebraic attacks** Solve the nonlinear equation systems deduced from
    the output bits, where unknowns in the equations are bits from the LFSR state.

    +   - **Cube attacks** Compute derivatives of the nonlinear equations to reduce
    the degree of the system down to one and then solve it efficiently like a linear
    system.

    +   - **Fast correlation attacks** Exploit filtering functions that, despite their
    nonlinearity, tend to behave like linear functions.


    The lesson here, as we’ve seen in previous examples, is that Band-Aids don’t fix
    bullet holes. Patching a broken algorithm with a slightly stronger layer won’t
    make the whole thing secure. You must fix the problem at the core.


    # Nonlinear FSRs


    *Nonlinear FSRs (NFSRs) are like LFSRs but with a nonlinear feedback function
    instead of a linear one. Instead of just bitwise XORs, the feedback function can
    include bitwise AND and OR operations—a feature with both pros and cons.*


    One benefit of the addition of nonlinear feedback functions is that they make
    NFSRs cryptographically stronger than LFSRs because the output bits depend on
    the initial secret state in a complex fashion, according to equations of exponential
    size. The LFSRs’ linear function keeps the relations simple, with at most n terms
    (N₁, N₂, . . . , Nₙ, if the N’s are the NFSR’s state bits). For example, a 4-bit
    NFSR with an initial secret state (N₁, N₂, N₃, N₄) and a feedback function N₁
    + N₂ + N₁N₂ + N₃N₄ produce a first output bit equal to the following:


    N₁ + N₂ + N₁N₂ + N₃N₄


    The second iteration replaces the N₁ value with that new bit. Expressing the second
    output bit in terms of the initial state, we get the following equation:


    (N₁ + N₂ + N₁N₂ + N₃N₄) + N₁ + (N₁ + N₂ + N₁N₂ + N₃N₄)N₁ + N₂N₃

    = N₁ + N₂ + N₁N₂ + N₂N₃ + N₃N₄ + N₁N₃N₄


    This new equation has algebraic degree 3 (the highest number of bits multiplied
    together, here in N₁N₃N₄) rather than degree 2 of the feedback function, and it
    has six terms instead of four. As a result, iterating the nonlinear function quickly
    yields unmanageable equations because the size of the output grows exponentially.
    Although you’ll never compute those equations when running the NFSR, an attacker
    has to solve them in order to break the system.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'One downside to NFSRs is that there’s no efficient way to determine an NFSR’s
    period or to know whether its period is maximal. For an NFSR of n bits, you need
    to run close to 2^n trials to verify that its period is maximal. This calculation
    is impossible for large NFSRs of 80 bits or more.


    Fortunately, there’s a trick to using an NFSR without worrying about short periods:
    you can combine LFSRs and NFSRs to get both a guaranteed maximal period and the
    cryptographic strength—and that’s exactly how Grain-128a works.


    # Grain-128a


    Remember the AES competition discussed in Chapter 4, in the context of the AES
    block cipher? The stream cipher Grain is the offspring of a similar project called
    the eSTREAM competition. This competition closed in 2008 with a shortlist of recommended
    stream ciphers, which included four hardware-oriented ciphers and four software-oriented
    ones. Grain is one of these hardware ciphers, and Grain-128a is an upgraded version
    from the original authors of Grain. Figure 5-8 shows the action mechanism of Grain-128a.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_124_0.png)


    Figure 5-8: The mechanism of Grain-128a, with a 128-bit NFSR and a 128-bit LFSR


    Grain-128a is about as simple as a stream cipher can be, combining a 128-bit LFSR,
    a 128-bit NFSR, and a filter function, h. The LFSR has a maximal period of 2^128
    – 1, which ensures that the period of the whole system is at least 2^128 – 1 to
    protect against potential short cycles in the NFSR. At the same time, the NFSR
    and the nonlinear filter function h add cryptographic strength.


    Grain-128a takes a 128-bit key and a 96-bit nonce. It copies the 128 key bits
    into the NFSR’s 128 bits and copies the 96 nonce bits into the first 96 LFSR bits,
    filling the 32 bits left with ones and a single zero bit at the end. The initialization
    phase updates the whole system 256 times before returning the first keystream
    bit. During initialization, the bit returned by the h function is thus not output
    as a keystream but instead goes into the LFSR to ensure that its subsequent state
    depends on both the key and the nonce.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Grain-128a''s LFSR feedback function is


    **f(L) = L₅₂ + L₄₇ + L₅₈ + L₉₀ + L₁₂₁ + L₁₂₈**


    where L₁, L₂, . . . , L₁₂₈ are the bits of the LFSR. This feedback function takes
    only 6 bits from the 128-bit LFSR, but that''s enough to get a primitive polynomial
    that guarantees a maximal period. The small number of bits minimizes the cost
    of a hardware implementation.


    Here is the feedback polynomial of Grain-128a''s NFSR (N₁, . . . , N₁₂₈):


    **g(N) = N₅₂ + N₅₇ + N₇₂ + N₁₀₂ + N₁₂₈ + N₄₄N₆₀ + N₆₁N₁₂₅ + N₆₃N₆₇ + N₆₉N₁₀₁ +
    N₈₀N₈₈ + N₁₁₀N₁₁₁ + N₁₁₅N₁₁₇ + N₄₆N₅₀N₅₈ + N₁₀₅N₁₀₄N₁₀₆ + N₃₃N₃₅N₃₆N₄₀**


    This function was carefully chosen to maximize its cryptographic strength while
    minimizing its implementation cost. It has an algebraic degree of 4 because its
    term with the most variables has four variables (namely, N₃₃N₃₅N₃₆N₄₀). Moreover,
    g can''t be approximated by a linear function because it''s highly nonlinear.
    Also, in addition to g, Grain-128a XORs the bit coming out from the LFSRs to feed
    the result back as the NFSR''s new, rightmost bit.


    The filter function h is another nonlinear function; it takes 9 bits from the
    NFSR and 7 bits from the LFSR and combines them in a way that ensures good cryptographic
    properties.


    As I write this, there is no known attack on Grain-128a, and I''m confident that
    it will remain secure. Grain-128a is used in some low-end embedded systems that
    need a compact and fast stream cipher—typically industrial proprietary systems—which
    is why Grain-128a is little known in the open source software community.


    # A5/1


    A5/1 is a stream cipher that was used to encrypt voice communications in the 2G
    mobile standard. The A5/1 standard was created in 1987 but only published in the
    late 1990s after it was reverse engineered. Attacks appeared in the early 2000s,
    and A5/1 was eventually broken in a way that allows actual (rather than theoretical)
    decryption of encrypted communications. Let''s see why and how.


    # A5/1''s Mechanism


    As Figure 5-9 shows, A5/1 relies on three LFSRs and uses a trick that looks clever
    at first glance but actually fails to be secure.'
