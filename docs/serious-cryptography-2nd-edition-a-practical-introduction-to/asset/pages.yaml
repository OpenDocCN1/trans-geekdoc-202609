  md: '# Proof of Work


    Proof of work (PoW) is arguably the most critical component of a blockchain’s
    consensus protocol—for those based on PoW rather than proof of stake (PoS) or
    other protocols.


    A PoW is essentially a hash function that takes some fixed inputs and variable
    inputs and whose result must match a certain pattern to be valid. Parties that
    aim to solve a PoW repeatedly compute the hash with different values of the variable
    inputs until the result satisfies some constraint.


    For example, in Bitcoin and some other PoW-based blockchains, the constraint is
    that the hash value when seen as a 256-bit number must be less than a given number.
    This can also be seen as the hash value having a given number of leading zeros,
    when seeing the hash as the big-endian encoding of a 256-bit number.


    For example, in 2022 the highest Bitcoin difficulty value (as reported on https://btc.com/stats/diff)
    was 34,244,331,613,176, or approximately 2^45. You multiply this by 2^32 to find
    the actual value that the hash must be less than, 2^77. For each block, all the
    network participants (miners) jointly compute in the order of 2^77 double SHA-256
    computations to find a solution to the PoW. Such a solution consists of a nonce
    (the variable part of the PoW hash’s input) that yields a hash value less than
    2^77. The fixed part of the PoW hash’s input consists of the block header values
    (version, previous block hash, Merkle tree root, timestamp, and difficulty target
    value).


    Without a PoW “slowing down” the production of blocks in a blockchain, new valid
    blocks could be produced instantaneously, meaning that histories of transactions
    could be produced and re-created at will. It would be impossible to achieve finality
    (that is, the assurance that a block, and thus a set of transactions, cannot be
    reverted or changed once accepted by the network). In particular, it would be
    impossible to protect the network against double spending, or spending the same
    coins in two distinct transactions.


    Not all PoW schemes are as simple as Bitcoin’s, which uses a general-purpose hash
    function (SHA-256). Several PoWs attempted to make its computation on dedicated
    hardware less efficient compared to general-purpose CPUs to discourage the centralization
    of mining by organizations investing in the development of optimized hardware
    miner technology—as opposed to off-the-shelf servers and computers that anyone
    can use. Implemented tricks include the following:


    Memory hardness You can force the PoW to use a large amount of memory, typically
    by generating a huge table and accessing at unpredictable addresses. For example,
    Ethereum’s PoW used the Ethash algorithm, which required approximately 4GB of
    memory. (In September 2022, Ethereum abandoned Ethash and switched from a PoW
    to a proof-of-stake mechanism.)


    Virtual machines As some malware do, you can create a custom set of computer instructions
    that would be translated to standard instructions by a virtual machine application,
    while also potentially using a large'
