- pgno: 35
  md: 'randomly chosen permutation, knowing that A encrypts to F would tell you only
    that B does not encrypt to F.


    We’ll call a permutation that satisfies these criteria a secure permutation. As
    you’ll see next, a secure permutation is necessary but insufficient on its own
    for building a secure cipher. A cipher also needs a mode of operation to support
    messages of any length.


    # The Mode of Operation


    Say we have a secure permutation that transforms A to X, B to M, and N to L, for
    example. The word BANANA therefore encrypts to MXLXLX, where each occurrence of
    A is replaced by an X. Using the same permutation for all the letters in the plaintext
    thus reveals any duplicate letters. By analyzing these duplicates, you might not
    learn the entire message, but you’ll learn something about it. In the BANANA example,
    you don’t need the key to guess that the plaintext’s three X positions share a
    letter and that another letter is shared at the two L positions. If you know the
    message is a fruit’s name, you could determine that it’s BANANA rather than CHERRY,
    LYCHEE, or another six-letter fruit.


    The mode of operation (or mode) of a cipher mitigates the exposure of duplicate
    letters in the plaintext by using different permutations for duplicate letters.
    The mode of the Vigenère cipher partially addresses this: if the key is N letters
    long, then N different permutations will be used for every N consecutive letter.
    However, this can still result in patterns in the ciphertext because every Nth
    letter of the message uses the same permutation. That’s why frequency analysis
    works to break the Vigenère cipher.


    Frequency analysis can be defeated if the Vigenère cipher encrypts only plaintexts
    that are of the same length as the key. But even then, there’s another problem:
    reusing the same key several times exposes similarities between plaintexts. For
    example, with the key KYN, the words TIE and PIE encrypt to DGR and ZGR, respectively.
    Both end with the same two letters (GR), revealing that both plaintexts share
    their last two letters as well. Finding these patterns shouldn’t be possible with
    a secure cipher.


    To build a secure cipher, you must combine a secure permutation with a secure
    mode. Ideally, this combination prevents attackers from learning anything about
    a message other than its length.


    # Why Classical Ciphers Are Insecure


    Classical ciphers are doomed to be insecure because they’re limited to operations
    you can do in your head or on a piece of paper. They lack the computational power
    of a computer and are easily broken by simple computer programs. Let’s see the
    fundamental reason why that simplicity makes them insecure in today’s world.


    Remember that a cipher’s permutation should look random to be secure. Of course,
    the best way to look random is to be random—that is, to select every permutation
    randomly from the set of all permutations. And there are many permutations to
    choose from. In the case of the 26-letter English alphabet, there are approximately
    2^88 permutations:'
