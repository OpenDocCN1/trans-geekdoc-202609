    O(n^2) or O(n^3) may be efficient, but O(n^{99,999,999,999}) obviously isn''t.
    In other words, polytime is fast in practice as long as the exponent isn''t too
    large. Fortunately, all polynomial-time algorithms found to solve actual problems
    have small exponents. For example, O(n^{2.373}) is the time complexity of the
    best known algorithm for multiplying two n × n matrices in theory, as this algorithm
    is never used in practice. The 2002 breakthrough polynomial-time deterministic
    algorithm for identifying n-bit prime numbers initially had a complexity O(n^12),
    but it was later improved to O(n^6). Polynomial time thus may not be the perfect
    definition of a practical time for an algorithm, but it''s the best we have.


    By extension, you can consider a problem that can''t be solved by a polynomial-time
    algorithm impractical, or hard. As an example, for a straightforward key search,
    there''s no way to beat the O(2^n) complexity unless the cipher is somehow broken.


    NOTE Exponential complexity O(2^n) is not the worst you can get. Some complexities
    grow even faster and thus characterize algorithms even slower to compute—for example,
    the complexity O(n^n) or the exponential factorial O(n^{f(n-1)}), where for any
    x, the function f is here recursively defined as f(x) = x^{f(x-1)}. In practice,
