- pgno: 214
  md: '# Factoring Large Numbers


    So how do you go from a number to its factorization—namely, its decomposition
    as a product of prime numbers? The most basic way to factor a number, *N*, is
    to try dividing it by all the numbers lower than it until you find a number, *x*,
    that divides *N*. Then attempt to divide *N* with the next number, *x* + 1, and
    so on. You’ll end up with a list of factors of *N*. What’s the time complexity
    of this? First, remember that we express complexities as a function of the input’s
    *length*. The bit length of the number *N* is *n* = log₂ *N*. By definition of
    the logarithm, this means that *N* = 2ⁿ. Because all the numbers less than *N*/2
    are reasonable guesses for possible factors of *N*, there are about *N*/2 = 2ⁿ/2
    values to try. The complexity of our naive factoring algorithm is therefore O(2ⁿ),
    ignoring the 1/2 coefficient in the O() notation.


    While many numbers are easy to factor by first finding any small factors (2, 3,
    5, and so on) and then iteratively factoring any other nonprime factors, here
    we’re interested in numbers of the form *N* = *p* × *q*, where *p* and *q* are
    large, as found in cryptography.


    Let’s be a bit smarter: as we don’t need to test all numbers lower than *N*/2,
    but rather only the prime numbers, we can start by trying those smaller than the
    square root of *N*. If *N* isn’t a prime number, then it must have at least one
    factor lower than its square root √*N*. This is because if both of *N*’s factors
    *p* and *q* were greater than √*N*, then their product would be greater than √*N*
    × √*N* = *N*, which is impossible. For example, if *N* = 100, its factors *p*
    and *q* can’t both be greater than 10 because that would result in a product greater
    than 100. Either *p* or *q* has to be less than or equal to √*N*.


    So what’s the complexity of testing only the primes less than √*N*? The *prime
    number theorem* states that there are approximately *N*/log *N* primes smaller
    than *N*. Hence, there are approximately √*N*/log √*N* primes smaller than √*N*.
    Expressing this value in terms of *n* = log₂ *N*, we get approximately 2ⁿᐟ²⁺¹/*n*
    possible prime factors and therefore a complexity of O(2ⁿᐟ²/*n*), since √*N* =
    2ⁿᐟ² and 1/log √*N* = 1/(*n*/2) = 2/*n*. This is faster than testing all prime
    numbers, but it’s still painfully slow—on the order of 2¹²⁰ operations for a 256-bit
    number. That’s quite an impractical computational effort. But we can do much better.


    The fastest factoring algorithm is the *general number field sieve (GNFS)*, which
    I won’t describe here because it requires the introduction of several advanced
    mathematical concepts. A rough estimate of GNFS’s complexity is exp(1.91 × *n*¹ᐟ³
    (log *n*)²ᐟ³), where *n* = log₂ *N* is the bit length of *N* and exp(.) is just
    a different notation for the exponential function *e*ˣ, with *e* the exponential
    constant approximately equal to 2.718. However, it’s difficult to get an accurate
    estimate of GNFS’s actual complexity for a given number size. Therefore, we must
    rely on heuristic complexity estimates, which show how security increases with
    a longer *n*. For example:


    +   - Factoring a **1,024-bit** number, which has two prime factors of approximately
    500 bits each, takes on the order of 2⁷⁰ basic operations.

    +   - Factoring a **2,048-bit** number, which has two prime factors of approximately
    1,000 bits each, takes on the order of 2⁹⁰ basic operations—about a million times
    slower than for a 1,024-bit number.'
