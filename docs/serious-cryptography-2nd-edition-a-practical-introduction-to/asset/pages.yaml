    # Forward secrecy


    Even if all long-term secrets are exposed, an attacker should be unable to compute
    shared secrets from previous executions of the protocol, even if they record all
    previous executions or can inject or modify messages from previous executions.
    A forward-secret, or forward-secure, protocol guarantees that even if you have
    to deliver your devices and their secrets to some authority, they won’t be able
    to decrypt your prior encrypted communications. (The 4G/5G key agreement protocol
    doesn’t provide forward secrecy.)


    # Resistance to key-compromise impersonation (KCI)


    KCI occurs when an attacker compromises a party’s long-term key and can use it
    to impersonate another party. For example, the 4G/5G key agreement protocol allows
    trivial key-compromise impersonation because both parties share the same key K.
    A key agreement protocol ideally prevents this kind of attack.


    # Performance


    To be useful, a key agreement protocol should be efficient as well as secure.
    You should take several factors into account when considering a key agreement
    protocol’s efficiency, including the number of messages exchanged, their length,
    the computational effort to implement the protocol, and whether precomputations
    can be made to save time. A protocol is generally more efficient when exchanging
    fewer, shorter messages, and it’s best if interactivity is kept minimal so that
    neither party has to wait to receive a message before sending the next one. You
    can typically measure a protocol’s efficiency through its duration in terms of
    round trips, or the time it takes to send a message and receive a response.


    Round-trip time is usually the main cause of latency in protocols, but the amount
    of computation to be carried out by the parties also counts; the fewer required
    computations, and the more precomputations that can be done in advance, the better.
    For example, the 4G/5G key agreement protocol exchanges two messages of a few
    hundred bits each, which must be sent in a certain order. You can use precomputation
    with this protocol to save time since the operator can pick many values of R in
    advance; precompute the matching values of SK, V₁, and V₂; and store them all
    in a database. In this case, precomputation has the advantage of reducing the
    exposure of the long-term key.'
