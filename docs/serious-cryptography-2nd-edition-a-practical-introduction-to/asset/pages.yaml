    Remember that in an SPN, the S stands for substitution and the P for permutation.
    Here, the substitution layer is SubBytes, and the permutation layer is the combination
    of ShiftRows and MixColumns.


    The key schedule function KeyExpansion, as Figure 4-4 shows, is the AES key schedule
    algorithm. This expansion creates 11 round keys (K₀, K₁, . . . , K₁₀) of 16 bytes
    each from the 16-byte key, using the same S-box as SubBytes and a combination
    of XORs. One important property of KeyExpansion is that given any round key, Kᵢ,
    an attacker can determine all other round keys as well as the main key, K, by
    reversing the algorithm. The ability to get the key from any round key reduces
    the cipher''s resistance to side-channel attacks, where an attacker may easily
    recover a round key.


