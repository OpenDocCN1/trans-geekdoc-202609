    a benign client to use that algorithm by injecting malicious traffic within the
    client’s session. Even better for attackers, the largest part of the attack could
    be carried out once and recycled to attack multiple clients. After about a week
    of computations to attack a specific group, Z*_p, it took only 70 seconds to break
    individual sessions of different users.


    A secure protocol is worthless if it’s undermined by a weakened algorithm, and
    a reliable algorithm is useless if sabotaged by weak parameters. In cryptography,
    you should always read the fine print.


    For more details about this story, check the research article “Imperfect Forward
    Secrecy: How Diffie–Hellman Fails in Practice” (https://weakdh.org/imperfect-forward-secrecy-ccs15.pdf).


    # Further Reading


