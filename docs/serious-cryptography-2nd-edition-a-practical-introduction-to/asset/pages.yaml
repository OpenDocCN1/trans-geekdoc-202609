- pgno: 209
  md: 'You know that there’s no way to beat the $O(2^n)$ complexity of a brute-force
    key search (as long as the cipher is secure), but you won’t always know the fastest
    way to solve a computational problem in general. A large portion of the research
    in complexity theory is about proving complexity *bounds* on the running time
    of algorithms solving a given problem. To make their job easier, complexity theorists
    have categorized computational problems in different groups, or *classes*, according
    to the effort needed to solve them.


    # Complexity Classes


    In mathematics, a *class* is a group of objects with some similar attribute. For
    example, all computational problems solvable in time $O(n^2)$, which complexity
    theorists simply denote **TIME**($n^2$), are one class. Likewise, **TIME**($n^3$)
    is the class of problems solvable in time $O(n^3)$, **TIME**($2^n$) is the class
    of problems solvable in time $O(2^n)$, and so on. For the same reason that a supercomputer
    can compute whatever a laptop can compute, any problem solvable in $O(n^2)$ is
    also solvable in $O(n^3)$. Hence, any problem in the class **TIME**($n^2$) also
    belongs to the class **TIME**($n^3$), which also both belong to the class **TIME**($n^4$),
    and so on. The union of all the classes **TIME**($n^k$), for all constants $k$,
    is **P**, which stands for polynomial time.


    If you’ve programmed a computer, you’ll know that seemingly fast algorithms may
    still crash your system by eating all its memory resources. When selecting an
    algorithm, you should consider not only its time complexity but also how much
    memory it uses, or its *space complexity*. This is especially important because
    a single memory access is usually orders of magnitudes slower than a basic arithmetic
    operation in a CPU.


    Formally, you define an algorithm’s memory consumption as a function of its input
    length, $n$, in the same way you defined time complexity. The class of problems
    solvable using $f(n)$ bits of memory is **SPACE**($f(n)$). For example, **SPACE**($n^3$)
    is the class of problems solvable using of the order of $n^3$ bits of memory.
    Just as you had **P** as the union of all **TIME**($n^k$), the union of all **SPACE**($n^k$)
    problems is **PSPACE**.


    While the lower the memory the better, a polynomial amount of memory doesn’t necessarily
    imply that an algorithm is practical. Take, for example, a brute-force key search,
    which takes negligible memory but is slow as hell. More generally, an algorithm
    can take forever, even if it uses just a few bytes of memory.


    Any problem solvable in time $f(n)$ needs at most $f(n)$ memory, so **TIME**($f(n)$)
    is included in **SPACE**($f(n)$). In time $f(n)$, you can write up to $f(n)$ bits,
    and no more, because writing (or reading) 1 bit is assumed to take one unit of
    time; therefore, any problem in **TIME**($f(n)$) can’t use more than $f(n)$ space.
    As a consequence, **P** is a subset of **PSPACE**.


    # Nondeterministic Polynomial Time


    **NP**, *nondeterministic polynomial time*, is the second most important complexity
    class, after the class **P** of all polynomial-time algorithms.'
