- pgno: 284
  md: 'application layer protocol such as HTTP or SMTP, to secure data transmitted
    over a TCP connection.


    TLS also works over the *User Datagram Protocol (UDP)* transport protocol, which
    is used for “connectionless” transmissions when latency must be minimal, such
    as audio or video streaming and online gaming. However, unlike TCP, UDP doesn’t
    guarantee delivery or correct packet ordering. The UDP version of TLS, *Datagram
    Transport Layer Security (DTLS)*, is therefore slightly different. For more on
    TCP and UDP, see Charles Kozierok’s *The TCP/IP Guide* (No Starch Press, 2005).


    # **The TLS and SSL Families of Protocols**


    TLS began in 1995 when Netscape developed TLS’s ancestor, the SSL protocol. SSL
    was far from perfect, and both SSL 2.0 and SSL 3.0 had security flaws. You should
    never use SSL, and you should always use TLS—what adds to the confusion is that
    people often refer to TLS as SSL, including security experts.


    Not all versions of TLS are secure. TLS 1.0 (1999) is the least secure version,
    though it’s still more secure than SSL 3.0. TLS 1.1 (2006) is better but includes
    a number of weak algorithms. TLS 1.2 (2008) is better yet, but it’s complex and
    provides high security only if configured correctly. Also, its complexity increases
    the risk of bugs in implementations and the risk of incorrect configurations.
    For example, TLS 1.2 supports AES in CBC mode, which is often vulnerable to padding
    oracle attacks.


    TLS 1.2 inherited dozens of features and design choices from earlier versions
    of TLS that make it suboptimal in terms of security and performance. To clean
    up this mess, cryptography engineers reinvented TLS—keeping only the good parts
    and adding security features. The result is TLS 1.3, an overhaul that’s simplified
    a bloated design and made it more secure, more efficient, and simpler. Essentially,
    TLS 1.3 is mature TLS.


    # **TLS in a Nutshell**


    TLS has two main protocols: the *handshake protocol* (or just *handshake*) determines
    the secret keys shared between the two parties; the *record protocol* describes
    how to use these keys to protect data. The data packets TLS processes are called
    *records*. TLS defines a packet format for encapsulating data from higher-layer
    protocols for transmission to another party.


    The handshake starts with a client that initiates a secure connection with a server.
    The client sends an initial message called ClientHello with parameters that include
    the cipher it wants to use. The server checks this message and its parameters
    and then responds with a ServerHello message. Once the client and the server process
    each other’s messages, they’re ready to exchange encrypted data using session
    keys established through the handshake protocol, as you’ll see in “The TLS Handshake
    Protocol” on page 263.'
