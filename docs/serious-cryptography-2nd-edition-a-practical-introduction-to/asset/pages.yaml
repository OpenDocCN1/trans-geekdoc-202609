- pgno: 257
  md: '(namely, an unsafe prime p) instead of throwing an error and aborting the protocol
    altogether before performing any arithmetic operation.


    Essentially, OpenSSL accepted a prime number p whose multiplicative group Z*_p
    (where all DH operations happen) contained small subgroups. As you learned at
    the beginning of this chapter, the existence of small subgroups within a larger
    group in a cryptographic protocol is bad because it confines shared secrets to
    a much smaller set of possible values than if it were to use the whole group Z*_p.
    Worse still, an attacker can craft a DH exponent x that, when combined with the
    victim’s public key g^y, reveals information on the private key y and eventually
    its entirety.


    Although the actual vulnerability is from 2016, the principle the attack used
    dates back to the 1997 paper “A Key Recovery Attack on Discrete Log-based Schemes
    Using a Prime Order Subgroup” by Chae Hoon Lim and Pil Joong Lee. The fix for
    the vulnerability is simple: when accepting a prime p as group modulus, the protocol
    must check that p is a safe prime by verifying that (p − 1) / 2 is prime as well
    to ensure that the group Z*_p won’t have small subgroups and that an attack on
    this vulnerability will fail.


    # Further Reading


    You can dig deeper into the DH key agreement protocols by reading a number of
    standards and official publications, including ANSI X9.42, RFC 2631 and RFC 5114,
    IEEE 1363, and NIST SP 800-56A. These serve as references to ensure interoperability
    and to provide recommendations for group parameters.


    To learn more about advanced DH protocols (such as MQV and its cousins HMQV and
    OAKE, among others) and their security notions (including unknown-key share attacks
    and group representation attacks), read the 2005 article “HMQV: A High-Performance
    Secure Diffie–Hellman Protocol” by Hugo Krawczyk (https://eprint.iacr.org/2005/176)
    and the 2011 article “A New Family of Implicitly Authenticated Diffie–Hellman
    Protocols” by Andrew C. Yao and Yunlei Zhao (https://eprint.iacr.org/2011/035).
    These articles express Diffie–Hellman operations differently than in this chapter.
    For example, they represent the shared secret as xP instead of g^x. Generally,
    you’ll find multiplication replaced with addition and exponentiation replaced
    with multiplication, because those protocols are usually not defined over groups
    of integers but over elliptic curves, as you’ll learn in Chapter 12.'
