- pgno: 298
  md: 'A client first sends a buffer along with a buffer length to the server to check
    whether the server is online. In this example, the buffer is the string *BANANAS*,
    and the client explicitly says that this word is seven letters long. The server
    reads the seven-letter word and returns it to the client.


    The problem is that the server doesn''t confirm that the length is correct and
    attempts to read as many characters as the client tells it to. Consequently, if
    the client provides a length that is longer than the string''s actual length,
    the server reads too much data from memory and returns it to the client, together
    with any extra data that may contain sensitive information, such as private keys
    or session cookies.


    The Heartbleed bug came as a shock. To avoid similar future bugs, OpenSSL and
    other major TLS implementations now perform rigorous code reviews and use automated
    tools such as fuzzers to identify potential issues.


    # Further Reading


    This chapter isn''t a comprehensive guide to TLS, and you may want to dig deeper
    into the history of TLS, its previous vulnerabilities, and its latest version.
    The complete TLS 1.3 specifications, found on the home page of the TLS Working
    Group (TLSWG) at https://tlswg.org, include everything about the protocol (though
    not necessarily its underlying rationale).


    I also suggest you learn about major protocols that use TLS, such as QUIC (used
    in connections between Chrome and Google servers) and SRTP (used for videoconferencing
    and streaming traffic).


    In addition, here are two important initiatives related to TLS deployment:


    +   - SSL Labs TLS test (https://www.ssllabs.com/ssltest) is a free service by
    Qualys that lets you test a browser''s or a server''s TLS configuration, providing
    a security rating as well as improvement suggestions. If you set up your own TLS
    server, use this test to make sure everything is safe.

    +   - Let''s Encrypt (https://letsencrypt.org) is a nonprofit that offers a service
    to "automagically" deploy TLS on your HTTP servers. It includes features to automatically
    generate a certificate and configure the TLS server, and it supports all the common
    web servers and operating systems.'
