    # Authenticated Encryption Using MACs


    Figure 8-1 shows three ways that MACs and ciphers can be combined to both encrypt
    and authenticate a plaintext: encrypt-and-MAC, MAC-then-encrypt, and encrypt-then-MAC.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_185_0.png)


    Figure 8-1: Cipher and MAC combinations


    These combinations differ in the order in which you apply encryption and generate
    the authentication tag. The choice of a specific MAC or cipher algorithm is unimportant
    as long as each is secure in its own right and the MAC and cipher use distinct
    keys.


    In the encrypt-and-MAC composition, the plaintext is encrypted and an authentication
    tag is generated directly from the plaintext, such that the two operations (encryption
    and authentication) are independent of each other and you can therefore compute
    them in parallel. In the MAC-then-encrypt scheme, you generate the tag from the
    plaintext first and then encrypt the plaintext and MAC together. In the encrypt-then-MAC
    method, you encrypt the plaintext first and then generate the tag from the ciphertext.
    Let’s see which method is likely to be the most secure.


    # Encrypt-and-MAC Approach


    The encrypt-and-MAC approach computes a ciphertext and a MAC tag separately. Given
    a plaintext P, the sender computes a ciphertext C = E(K₁, P), where E is an encryption
    algorithm and C is the resulting ciphertext. You calculate the authentication
    tag T from the plaintext as T = MAC(K₂, P). The two operations are independent
    and can therefore be computed in parallel.


    Once you’ve generated the ciphertext and authentication tag, the sender transmits
    both to the intended recipient. When the recipient receives C and T, they decrypt
    C to obtain the plaintext P by computing P = D(K₁, C). Next, they compute MAC(K₂,
    P) using the decrypted plaintext and compare the'
