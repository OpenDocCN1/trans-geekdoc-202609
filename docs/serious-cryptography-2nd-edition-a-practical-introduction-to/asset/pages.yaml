    Figure 10-3: Signing a message, M, with RSA and with the PSS standard, where {n,
    d} is the private key


    Like all public-key signature schemes, PSS works on a message’s hash rather than
    on the message itself. Signing Hash(M) is secure only if the hash function is
    collision resistant. You can thus sign messages of any'
