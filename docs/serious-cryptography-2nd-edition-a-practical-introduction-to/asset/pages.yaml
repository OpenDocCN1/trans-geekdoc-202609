    > NOTE

    > One potential byproduct and benefit of using round keys is protection against
    side-channel attacks, or attacks that exploit information leaked from the implementation
    of a cipher (for example, electromagnetic emanations). If the transformation from
    the main key, K, to a round key, K_i, isn''t invertible, then if an attacker finds
    K_i, they can''t use that key to find K. Unfortunately, few block ciphers have
    a one-way key schedule. The key schedule of AES allows attackers to compute K
    from any round key, K_i, for example.


    # Substitution–Permutation Networks


    If you''ve read textbooks about cryptography, you''ve likely come across confusion
    and diffusion. Confusion means that the input (plaintext and encryption key) undergoes
    complex transformations, and diffusion means that these transformations depend
    equally on all bits of the input. At a high level, confusion is about depth, whereas
    diffusion is about breadth. In the design of a block cipher, confusion and diffusion
    take the form of substitution and permutation operations, which we combine within
    substitution–permutation networks (SPNs).


    Substitution often appears in the form of S-boxes, or substitution boxes, which
    are small lookup tables that transform chunks of 4 or 8 bits. For example, the
    first of the eight S-boxes of the block cipher Serpent is composed of the 16 elements
    (3 8 f 1 a 6 5 b e d 4 2 7 0 9 c), where each element represents a 4-bit nibble.
    This particular S-box maps the 4-bit nibble 0000 to 3 (0011), the 4-bit nibble
    0101 (5 in decimal) to 6 (0110), and so on.


    > NOTE

    > S-boxes must be carefully chosen to be cryptographically strong: they should
    be as nonlinear as possible (inputs and outputs should be related with complex
    equations) and have no statistical bias (meaning, for example, that flipping an
    input bit should potentially affect any of the output bits).


    The permutation in a substitution–permutation network can be as simple as changing
    the order of the bits, which is easy to implement but doesn''t mix up the bits
    very much. Instead of a reordering of the bits, some ciphers use basic linear
    algebra and matrix multiplications to mix up the bits: they perform a series of
