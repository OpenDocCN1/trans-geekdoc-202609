    > > Also, every number \(x\) has an inverse with respect to addition, denoted
    \(-x\), such that \(x + (-x) = 0\). For example, the inverse of 100 in \(\mathbb{Z}_{191}\)
    is 91 because \(100 + 91 \mod 191 = 0\). Such a set of numbers, where addition
    and multiplication are possible and where each element \(x\) admits an inverse
    with respect to addition (denoted \(-x\)) as well as an inverse (except for the
    element zero) with respect to multiplication (denoted \(1/x\)), is called a field.
    When a field has a finite number of elements, as in \(\mathbb{Z}_{191}\) and as
    with all fields used for elliptic curve cryptography, it is a finite field.


    # The Addition Law


    Now that you know that the points on an elliptic curve are coordinates \((x, y)\)
    that satisfy the curve’s equation, \(y^2 = x^3 + ax + b\), let’s look at how to
    add elliptic curve points with the addition law.


    # Adding Two Points


    Say you want to add two points on the elliptic curve, \(P\) and \(Q\), to give
    a new point, \(R\), that is the sum of these two points. The simplest way to understand
    point addition is to determine the position of \(R = P + Q\) on the curve relative
    to \(P\) and \(Q\) based on a geometric rule: draw the line that connects \(P\)
    and \(Q\), find the other point of the curve that intersects with this line, and
    \(R\) is the reflection of this point with respect to the x-axis. For example,
    in Figure 12-3, the line connecting \(P\) and \(Q\) intersects the curve at a
    third point between \(P\) and \(Q\), and the point \(P + Q\) is at the same x-coordinate
    but the inverse y-coordinate.'
