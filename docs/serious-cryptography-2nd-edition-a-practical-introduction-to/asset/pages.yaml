- pgno: 320
  md: '# Further Reading


    To learn the basics of quantum computation, read the classic *Quantum Computation
    and Quantum Information (Anniversary Edition)* by Michael Nielsen and Isaac Chuang
    (Cambridge, 2011). Scott Aaronson’s *Quantum Computing Since Democritus* (Cambridge,
    2013), a less technical and more entertaining read, covers more than quantum computing.


    Several software simulators allow you to experiment with quantum computing, such
    as The Quantum Computing Playground at *https://www.quantumplayground.net* or
    IBM’s platform at *https://quantum.ibm.com*. These sites are relatively easy to
    use, thanks to intuitive visualizations.


    For the latest research in post-quantum cryptography, see *https://pqccrypto.org*
    and the associated conference PQCrypto.


    The coming years promise to be particularly exciting for post-quantum crypto,
    thanks to the continuation of NIST’s Post-Quantum Cryptography Standardization
    project and the deployment at scale of post-quantum solutions.'
