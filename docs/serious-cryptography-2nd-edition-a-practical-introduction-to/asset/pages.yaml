    # Cipher Block Chaining Mode


    Cipher block chaining (CBC) is like ECB but with a small twist that makes a big
    difference: instead of encrypting the i-th block, P_i, as C_i = E(K, P_i), CBC
    sets C_i = E(K, P_i ⊕ C_{i-1}), where C_{i-1} is the previous ciphertext block—thereby
    chaining the blocks C_{i-1} and C_i. When encrypting the first block, P_1, there
    is no previous ciphertext block to use, so CBC takes a random initial value (IV),
    as Figure 4-8 illustrates.


