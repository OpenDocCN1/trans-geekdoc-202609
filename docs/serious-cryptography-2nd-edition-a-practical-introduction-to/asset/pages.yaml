    cipher in use was DES, with its ridiculous 56-bit security, as well as the upgraded
    version of DES known as Triple DES, or 3DES. Although 3DES provides a higher level
    of security (112-bit security), it’s inefficient because the key needs to be 168
    bits long to get 112-bit security, and it’s slow in software (DES was created
    to be fast in integrated circuits, not on mainstream CPUs). AES fixes both issues.


    NIST standardized AES in 2000 as a replacement for DES, at which point it became
    the world’s de facto encryption standard. Most commercial encryption products
    today support AES, and the NSA has approved it for protecting top-secret information.
    (Some countries do prefer to use their own ciphers, largely because they don’t
    want to use a US standard, but AES is actually more Belgian than it is American.)


