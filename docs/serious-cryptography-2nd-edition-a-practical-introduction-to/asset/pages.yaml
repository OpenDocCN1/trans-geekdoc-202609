- pgno: 195
  md: 'Like AES-GCM, OCB also supports associated data as a series of blocks, A₁,
    A₂, and so on. When an OCB encrypted message contains associated data, calculate
    the authentication tag according to the formula


    T = E(K, S ⊕ O*) ⊕ E(K, A₁ ⊕ O₁) ⊕ E(K, A₂ ⊕ O₂) ⊕ …


    where OCB defines different offsets from those used to encrypt P.


    Unlike GCM and encrypt-then-MAC, which combine ciphertext blocks to form the tag,
    OCB calculates the authentication tag by combining plaintext data. There’s nothing
    wrong with this approach, and OCB is backed by solid security proofs.


    NOTE For more on how to implement OCB, see either RFC 7253 or the 2011 paper “The
    Software Performance of Authenticated-Encryption Modes” by Ted Krovetz and Phillip
    Rogaway, which covers the latest and best version of OCB, OCB3. For further details
    on OCB, see the FAQ at http://web.cs.ucdavis.edu/rogaway/ocb/ocb-faq.htm.


    # OCB Security


    OCB is a bit less fragile than GCM against repeated nonces. If you use a nonce
    twice, an attacker that sees the two ciphertexts could notice that, say, the third
    plaintext block of the first message is identical to the third plaintext block
    of the second message. With GCM, attackers can find not only duplicates but also
    the XOR differences between blocks at the same position. The impact of repeated
    nonces is therefore worse with GCM than with OCB.


    As with GCM, repeated nonces jeopardize the authenticity of OCB, though less potently.
    For example, an attacker could combine blocks from two messages authenticated
    with OCB to create another encrypted message with the same checksum and tag as
    one of the original two messages, but the attacker wouldn’t be able to recover
    a secret key as with GCM.


    In 2023, cryptographers discovered that using OCB3 with very short nonces (6 bits)
    causes its security to significantly reduce; see the article at https://eprint.iacr.org/2023/326.
    Note that the version OCB2 was broken, as described in the article at https://eprint.iacr.org/2019/311.pdf.


    # OCB Efficiency


    OCB and GCM are about equally efficient. Like GCM, OCB is parallelizable and streamable.
    In terms of raw efficiency, GCM and OCB make about as many calls to the underlying
    block cipher (usually AES), but OCB is slightly faster than GCM because it simply
    XORs the plaintext rather than performing something like the relatively expensive
    GHASH computation. (In earlier generations of Intel microprocessors, AES-GCM used
    to be more than three times slower than AES-OCB because AES and GHASH instructions
    had to compete for CPU resources and couldn’t be run in parallel.)'
