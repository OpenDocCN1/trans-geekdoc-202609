  md: 'NOTE TLS 1.3 supports many options and extensions, so it may behave differently.
    You can, for example, configure the TLS 1.3 handshake to require a client certificate
    so that the server verifies the identity of the client. TLS 1.3 also supports
    a handshake with preshared keys.


    Let’s look at this in practice. Say you’ve deployed TLS 1.3 to provide secure
    access to the website https://www.nostarch.com. When you point your browser (the
    client) to this site, your browser sends a ClientHello message to the site’s server
    that includes the ciphers that it supports. The website responds with a ServerHello
    message and a certificate that includes a public key associated with the domain
    www.nostarch.com. The client verifies the certificate’s validity using one of
    the certificate authorities embedded in the browser (a trusted certificate authority,
    whose certificate should be included in the browser’s or the operating system’s
    certificate store to be validated, should sign the received certificate). Once
    all checks pass, the browser requests the site’s initial page from the www.nostarch.com
    server.


    Upon a successful TLS 1.3 handshake, all communications between the client and
    the server are encrypted and authenticated. An eavesdropper can learn that a client
    at a given IP address is talking to a server at another given IP address and can
    observe the encrypted content exchanged but can’t learn the underlying plaintext
    or modify the encrypted messages (if they do, the receiving party will notice
    that the communication has been tampered with, because messages are authenticated).
    That’s enough security for many applications.


    # TLS 1.3 Cryptographic Algorithms


    TLS 1.3 uses authenticated encryption algorithms, a key derivation function (a
    hash function that derives secret keys from a shared secret), as well as a Diffie–Hellman
    operation—but how exactly do these work, what algorithms are used, and how secure
    are they?


    With regard to the choice of authenticated ciphers, TLS 1.3 supports only three
    algorithms: AES-GCM, AES-CCM (a slightly less efficient mode than GCM), and the
