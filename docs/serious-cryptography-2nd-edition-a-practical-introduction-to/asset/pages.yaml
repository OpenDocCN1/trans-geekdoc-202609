- pgno: 88
  md: '# 4


    # BLOCK CIPHERS


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_88_0.png)


    During the Cold War, the United States and the Soviets developed their own ciphers.
    The US government created the Data Encryption Standard (DES), which was adopted
    as a federal standard from 1979 to 2005, while the KGB developed GOST 28147-89,
    an algorithm kept secret until 1990 and still used today. In 2000, the US-based
    National Institute of Standards and Technology (NIST) selected the successor to
    DES, the Advanced Encryption Standard (AES), an algorithm developed in Belgium
    and now found in most electronic devices. AES, DES, and GOST 28147-89 are all
    *block ciphers*, a type of cipher that combines a core algorithm working on blocks
    of data with a *mode of operation*, or a technique to process sequences of data
    blocks.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'This chapter reviews the core algorithms that underlie block ciphers, discusses
    their modes of operation, and explains how they all work together. It also discusses
    how AES works and concludes with coverage of a classic attack tool from the 1970s,
    the meet-in-the-middle attack, and a favorite attack technique of the 2000s—padding
    oracles.


    # What Is a Block Cipher?


    A block cipher consists of an encryption algorithm and a decryption algorithm:


    +   - The encryption algorithm (E) takes a key, K, and a plaintext block, P, and
    produces a ciphertext block, C. We write an encryption operation as C = E(K, P).

    +   - The decryption algorithm (D) is the inverse of the encryption algorithm
    and decrypts a message to the original plaintext, P. We write this operation as
    P = D(K, C).


    Since they''re the inverse of each other, the encryption and decryption algorithms
    usually involve similar operations.


    # Security Goals


    If you''ve followed earlier discussions about encryption, randomness, and indistinguishability,
    the definition of a secure block cipher will come as no surprise. We''ll continue
    to define security as random-looking-ness, so to speak.


    For a block cipher to be secure, it should be a pseudorandom permutation (PRP),
    meaning that as long as the key is secret, an attacker shouldn''t be able to compute
    an output of the block cipher from any input. That is, as long as K is secret
    and random from an attacker''s perspective, they should have no clue what E(K,
    P) looks like, for any given P.


    More generally, attackers should be unable to discover any pattern in the input/output
    values of a block cipher. In other words, it should be impossible to tell a block
    cipher from a truly random permutation, given black-box access to the encryption
    and decryption functions for some fixed and unknown key. By the same token, attackers
    should be unable to recover a secure block cipher''s secret key; otherwise, they
    could use that key to tell the block cipher from a random permutation. This implies
    that attackers can''t predict the plaintext that corresponds to a given ciphertext
    the block cipher produces.


    # Block Size


    Two values characterize a block cipher: the block size and the key size. Security
    depends on both values. Most block ciphers have either 64-bit or 128-bit blocks—DES''s
    blocks have 64 (2^6) bits, and AES''s blocks have 128 (2^7) bits. In computing,
    lengths that are generally measured as powers'
