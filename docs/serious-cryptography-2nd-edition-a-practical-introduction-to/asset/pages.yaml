  md: 'of the order of 1TB. Later standards for mobile encryption, such as 3G and
    LTE, specify stronger ciphers, but that doesn’t mean their encryption won’t be
    compromised; it simply means that the encryption won’t be compromised by breaking
    the symmetric cipher that’s part of the system.


    # Wrong Model


    The next example concerns an invalid attack model that overlooked some side channels.


    Many communication protocols that use encryption ensure that they use ciphers
    considered secure in the CPA or CCA model. However, some attacks don’t require
    encryption queries, as in the CPA model, nor do they require decryption queries,
    as in the CCA model. They simply need validity queries to tell whether a ciphertext
    is valid, and these queries are usually sent to the system responsible for decrypting
    ciphertexts. Padding oracle attacks are an example of such attacks, wherein an
    attacker learns whether a ciphertext conforms to the required format.


    Specifically, in the case of padding oracle attacks, a ciphertext is valid only
    if its plaintext has the proper padding, a sequence of bytes appended to the plaintext
    to simplify encryption. Decryption fails if the padding is incorrect, and attackers
    can often detect decryption failures and attempt to exploit them. For example,
    the presence of the Java exception `javax.crypto.BadPaddingException` indicates
    that an incorrect padding was observed.


    In 2010, researchers found padding oracle attacks in several web application servers.
    The validity queries consisted of sending a ciphertext to some system and observing
    whether it threw an error. Thanks to these queries, they could decrypt otherwise-secure
    ciphertexts without knowing the key.


    Cryptographers often overlook attacks like padding oracle attacks because they
    usually depend on an application’s behavior and on how users can interact with
    the application. But if you don’t anticipate such attacks and fail to include
    them in your model when designing and deploying cryptography, you may have some
    nasty surprises.


    # Further Reading


    We discuss encryption and its various forms in more detail throughout this book,
    especially how modern, secure ciphers work. Still, I can’t cover everything and
    have passed over many fascinating topics. For example, to learn the theoretical
    foundations of encryption and gain a deeper understanding of the notion of indistinguishability,
    read the 1982 paper that introduced the idea of semantic security, “Probabilistic
    Encryption and How to Play Mental Poker Keeping Secret All Partial Information”
    by Goldwasser and Micali. If you’re interested in physical attacks and cryptographic
    hardware, the proceedings of the Cryptographic Hardware and Embedded Systems (CHES)
    conference are the main reference.'
