- pgno: 107
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_107_0.png)


    *Figure 4-9: Ciphertext stealing for CBC-mode encryption*


    There aren’t any major problems with ciphertext stealing, but it’s inelegant and
    hard to get right, especially when NIST’s standard specifies three different ways
    to implement it (see Special Publication 800-38A).


    # Counter Mode


    To avoid the troubles and retain the benefits of ciphertext stealing, use counter
    mode (CTR). CTR is hardly a block cipher mode: it turns a block cipher into a
    stream cipher that just takes bits in and spits bits out and doesn’t embarrass
    itself with the notion of blocks. (I’ll discuss stream ciphers in detail in Chapter
    5.)


    In CTR mode (see Figure 4-10), the block cipher algorithm won’t transform plaintext
    data. Instead, it encrypts blocks composed of a counter and a nonce. A *counter*
    is an integer that is incremented for each block. No two blocks should use the
    same counter within a message, but different messages can use the same sequence
    of counter values (1, 2, 3, . . .). A *nonce* is a number we use only once. It’s
    the same for all blocks in a single message, but no two messages should use the
    same nonce.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_107_1.png)


    *Figure 4-10: CTR mode*


    Figure 4-10 shows that in CTR mode, encryption XORs the plaintext and the stream
    taken from “encrypting” the nonce, N, and counter, Ctr. Decryption is the same,
    so you need only the encryption algorithm for both encryption and decryption.
    The Python script in Listing 4-6 gives you a hands-on example.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '```

    #!/usr/bin/env python


    from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

    from os import urandom


    BLOCK_SIZE = 16

    KEY_SIZE = 16


    # Pick a random key.

    k = urandom(KEY_SIZE)

    print(f"k   = {k.hex()}")


    # And a random nonce

    # (careful with random nonces, see discussion below).

    n = urandom(BLOCK_SIZE)

    print(f"nonce  = {n.hex()}")


    # Create a 7-byte plaintext p.

    p = bytes([0x00] * 7)


    # Encrypt the plaintext p with AES-CTR.

    aes_ctr_encryptor = Cipher(algorithms.AES(k), modes.CTR(n)).encryptor()


    c = aes_ctr_encryptor.update(p) + aes_ctr_encryptor.finalize()

    print(f"enc({p.hex()}) = {c.hex()}")


    # Decrypt the ciphertext c.

    aes_ctr_decryptor = Cipher(algorithms.AES(k), modes.CTR(n)).decryptor()

    p = aes_ctr_decryptor.update(c) + aes_ctr_decryptor.finalize()

    print(f"dec({c.hex()}) = {p.hex()}")


    # Decrypt the ciphertext c using the encryption function.

    aes_ctr_encryptor = Cipher(algorithms.AES(k), modes.CTR(n)).encryptor()

    p = aes_ctr_encryptor.update(c) + aes_ctr_encryptor.finalize()

    print(f"enc({c.hex()}) = {p.hex()}")

    ```


    *Listing 4-6: Using AES in CTR mode*


    The example execution encrypts a 4-byte plaintext and gets a 4-byte ciphertext.
    It then decrypts that ciphertext using the encryption function:


    ```

    $ ./aes_ctr.py

    k = 130a1aa77fa58335272156421cb2a3ea

    enc(00010203) = b23d284e

    enc(b23d284e) = 00010203

    ```


    As with the initial value in CBC, the encrypter supplies CTR''s nonce and sends
    it with the ciphertext in the clear. But unlike CBC''s initial value, CTR''s nonce
    doesn''t need to be random; it simply needs to be unique. A nonce should be unique
    for the same reason that we shouldn''t reuse a one-time pad: when calling the
    pseudorandom stream, S, if you encrypt P₁ to C₁ = P₁ ⊕ S and P₂ to C₂ = P₂ ⊕ S
    using the same nonce, then C₁ ⊕ C₂ reveals P₁ ⊕ P₂.'
