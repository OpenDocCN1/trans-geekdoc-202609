  md: '# # 2

    ## RANDOMNESS


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_52_0.png)


    Randomness is found everywhere in cryptography: in the generation of secret keys,
    in encryption schemes, and even in the attacks on cryptosystems. Without randomness,
    cryptography would be impossible because all operations would become predictable
    and therefore insecure.


    This chapter introduces the concept of randomness in the context of cryptography
    and its applications. We discuss pseudorandom number generators and how operating
    systems can produce reliable randomness, and we conclude with real examples showing
    how flawed randomness can impact security.


    # Random or Nonrandom?


    You’ve probably heard the phrase *random bits* before, but strictly speaking,
    there is no such thing as a series of random bits. What *is* random is the'
