- pgno: 237
  md: '# The Chinese Remainder Theorem


    The most common trick to speed up decryption and signature generation (that is,
    the computation of y^d mod n) is the Chinese remainder theorem (CRT), which makes
    RSA about four times faster.


    The CRT allows for faster decryption by computing two exponentiations, modulo
    p and modulo q, rather than a single one modulo n. Because p and q are much smaller
    than n, it''s faster to perform two “small” exponentiations than a single “big”
    one.


    The Chinese remainder theorem isn''t specific to RSA. It''s a general arithmetic
    result that, in its simplest form, states that if n = n1 n2 n3 …, where the n_i
    are pairwise coprime (that is, GCD(n_i, n_j) = 1 for any distinct i and j), then
    one can compute the value x mod n from the values x mod n1, x mod n2, x mod n3
    … For example, say you have n = 1,155, which is the product of prime factors 3
    × 5 × 7 × 11, and say you want to determine x that satisfies x mod 3 = 2, x mod
    5 = 1, x mod 7 = 6, and x mod 11 = 8. (I''ve chosen 2, 1, 6, and 8 arbitrarily.)
    To find x using the Chinese remainder theorem, compute the sum P(n_i) + P(n2)
    + …, where P(n_i) is defined as follows:


    P(n_i) = (x mod n_i) × n / n_i × (1 / (n / n_i) mod n_i) mod n


    Note that the second term, n/n_i, is equal to the product of all factors other
    than this n_i. To apply this formula to this example and recover x mod 1155, compute
    P(3), P(5), P(7), and P(11); then add them together to get the following expression:


    [ 2 × 385 × (1/385 mod 3) + 1 × 231 × (1/231 mod 5) + 6 × 165 × (1/165 mod 7)
    + 8 × 105 × (1/105 mod 11) ] mod n


    Here, I''ve just applied the preceding definition of P(n_i). (The math behind
    finding each number is straightforward, but I won''t detail it here.) You can
    then reduce this expression to [770 + 231 + 1980 + 1680] mod n = 41. As 41 is
    the number I''d picked for this example, you''ve got the correct result. Applying
    the CRT to RSA is simpler than the previous example because there are only two
    factors for each n (namely, p and q). Given a ciphertext y to decrypt, instead
    of computing y^d mod n, use the CRT to compute x_p = y^s mod p, where s = d mod
    (p - 1) and x_q = y^t mod q, where t = d mod (q - 1). Combine these two expressions
    and compute x to be the following: x = (x_p × q × (1/q mod p) + x_q × p × (1/p
    mod q)) mod n That''s it. This is faster than a single exponentiation even with
    the square-and-multiply trick because the multiplication-heavy operations are
    carried out on modulo p and q, numbers that are twice as small as n, whereas the
    complexity of exponentiation increases faster than linearly. When you double the
    size of the number, you don''t just double the cost of exponentiation—it grows
    faster.'
