  md: 'its similarity to SHA-1, and many believed that attacks on SHA-2 were just
    a matter of time. As I write this, we have yet to see a successful attack on SHA-2.
    Regardless, NIST developed a backup plan: SHA-3.


    # The SHA-3 Competition


    Announced in 2007, the NIST Hash Function Competition (the official name of the
    SHA-3 competition) began with a call for submissions and some basic requirements:
    hash submissions were to be at least as secure and as fast as SHA-2, and they
    should be able to do at least as much as SHA-2. SHA-3 candidates also shouldn''t
    look too much like SHA-1 and SHA-2 to be immune to attacks that would break SHA-1
    and potentially SHA-2. By 2008, NIST had received 64 submissions from around the
    world, including from universities and large corporations (BT, IBM, Microsoft,
    Qualcomm, and Sony, to name a few). Of these 64 submissions, 51 matched the requirements
    and entered the first round of the competition.


    During the first weeks of the competition, cryptanalysts mercilessly attacked
    the submissions. In July 2009, NIST announced 14 second-round candidates. After
    spending 15 months analyzing and evaluating the performance of these candidates,
    NIST chose five finalists:


    +   - **BLAKE** An enhanced Merkle–Damgård hash whose compression function is
    based on a block cipher, which is in turn based on the core function of the stream
    cipher ChaCha, a chain of additions, XORs, and word rotations. BLAKE was designed
    by a team of academic researchers based in Switzerland and the UK, including myself
    while I was a PhD student.

    +   - **Grøstl** An enhanced Merkle–Damgård hash whose compression function uses
    two permutations (or fixed-key block ciphers) based on the AES block cipher. Grøstl
    was designed by a team of seven academic researchers from Denmark and Austria.

    +   - **JH** A tweaked sponge function construction wherein message blocks are
    injected before and after the permutation rather than just before. The permutation
    also performs operations similar to a substitution–permutation block cipher (see
    Chapter 4). JH was designed by a cryptographer from a university in Singapore.

    +   - **Keccak** A sponge function whose permutation performs only bitwise operations.
    Keccak was designed by a team of four cryptographers working for a semiconductor
    company based in Belgium and Italy and included one of the two designers of AES.

    +   - **Skein** A hash function based on a different mode of operation than Merkle–Damgård
    and whose compression function is based on a novel block cipher that uses only
    integer addition, XORs, and word rotation. Skein was designed by a team of eight
    cryptographers from academia and industry, all but one of whom is based in the
    United States, including the renowned Bruce Schneier.'
