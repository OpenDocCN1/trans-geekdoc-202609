    # Small Hard Problems Aren’t Hard


    Computationally hard problems, and even exponential-time algorithms, become practical
    when they’re small enough. A symmetric cipher may be secure in the sense that
    there’s no faster attack than the 2^n-time brute force, but if the key length
    is n = 32, you’ll break the cipher in minutes. This sounds obvious, and you’d
    think that no one would be naive enough to use small keys, but in reality, there
    are plenty of reasons why this could happen. The following are two true stories.


