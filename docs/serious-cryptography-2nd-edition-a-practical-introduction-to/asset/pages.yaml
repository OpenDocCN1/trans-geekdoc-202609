- pgno: 159
  md: "After extensive analysis of the five finalists, NIST announced a winner: Keccak.\
    \ NIST’s report rewarded Keccak for its “elegant design, large security margin,\
    \ good general performance, excellent efficiency in hardware, and its flexibility.”\
    \ Let’s see how Keccak works.\n\n# Keccak (SHA-3)\n\nOne of the reasons that NIST\
    \ chose Keccak is that it’s completely different from SHA-1 and SHA-2. For one\
    \ thing, it’s a sponge function. Keccak’s core algorithm is a permutation of a\
    \ 1,600-bit state that ingests blocks of 1,152, 1,088, 832, or 576 bits, producing\
    \ hash values of 224, 256, 384, or 512 bits, respectively—the same four lengths\
    \ produced by SHA-2 hash functions. But unlike SHA-2, SHA-3 uses a single core\
    \ algorithm rather than two algorithms for all four hash lengths.\n\nAnother reason\
    \ is that Keccak is more than just a hash. The SHA-3 standard document FIPS 202\
    \ defines four hashes—SHA3-224, SHA3-256, SHA3-384, and SHA3-512—and two algorithms\
    \ called SHAKE128 and SHAKE256. (The name SHAKE stands for Secure Hash Algorithm\
    \ with Keccak.) These two algorithms are extendable-output functions (XOFs), or\
    \ hash functions that can produce hashes of variable length, even very long ones.\
    \ The numbers 128 and 256 represent the security level of each algorithm.\n\n\
