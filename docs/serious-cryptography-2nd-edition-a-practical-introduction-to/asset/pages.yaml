  md: '# 8


    # AUTHENTICATED ENCRYPTION


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_184_0.png)


    This chapter is about a type of algorithm that protects not only a message’s confidentiality
    but also its authenticity. Recall from Chapter 7 that message authentication codes
    (MACs) protect a message’s authenticity by creating a tag, which is a kind of
    signature. Like MACs, the authenticated encryption (AE) algorithms in this chapter
