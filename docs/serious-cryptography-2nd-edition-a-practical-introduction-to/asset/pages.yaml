  md: 'subgroup rather than to the main subgroup of points. If a public key point
    belongs to one such small subgroup, there will be way fewer possible valid signatures,
    making it easier to forge a signature. Likewise, if the public key offered to
    the verification function doesn’t belong to the elliptic curve, then valid signatures
    are easy to forge.


    It’s therefore crucial to check that public keys are valid using the KeyValidate
    algorithm from the aforementioned specification, as copied in Listing 15-1.


    ```

    Inputs:

    - PK, a public key in the format output by SkToPk.


    Outputs:

    - result, either VALID or INVALID


    Procedure:

    1. xP = pubkey_to_point(PK)

    2. If xP is INVALID, return INVALID

    3. If xP is the identity element, return INVALID

    4. If pubkey_subgroup_check(xP) is INVALID, return INVALID

    5. return VALID

    ```


    *Listing 15-1: The KeyValidate algorithm ensures that a BLS public key is valid.*


    If you implement BLS signatures, make sure your code does all the checks described
    in the BLS specification when validating public keys and signatures.


    # Key Cancellation Attack


    In their basic form, BLS aggregate signatures with aggregate public keys are subject
    to the same type of key cancellation attack as Schnorr signatures: if an attacker
    knows the public keys $P_1, P_2, \ldots, P_{n-1}$ of the first $n-1$ signers,
    they can claim that their public key is


    $$P_n = X - (P_1 + P_2 + \cdots + P_{n-1})$$


    where X is the public key for which they know the private key $x$, such that $X
    = xG$. When the attacker presents a signature created with $x$, unsuspecting users
    verify a message’s signature using the public key $P_1 + P_2 + \cdots + P_n$,
    which is equal to X. The attacker can single-handedly sign a message on behalf
    of the set of supposed signers.


    To prevent this attack, users may prove the knowledge of their public key’s private
    key by signing a message. As the attacker doesn’t know the private key of $P_n$,
    they would fail this test.


    Another mitigation is to modify the aggregate signature scheme so that the returned
    signature isn’t just the sum of signature $S = S_1 + S_2 + \cdots + S_n$ but instead
    the sum with coefficients derived from public keys, as in


    $$S = t_1S_1 + t_2S_2 + \cdots + t_nS_n$$'
