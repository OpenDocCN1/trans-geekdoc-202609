- pgno: 217
  md: 'To be a group, a mathematical set and its operation must have the following
    characteristics, which are called *group axioms*:


    **Closure** For any two group elements *x* and *y*, *x* × *y* is in the group
    too. In **Z**₅*, 2 × 3 = 1 (because 6 = 1 mod 5), 2 × 4 = 3, and so on.


    **Associativity** For any group elements *x*, *y*, *z*, (*x* × *y*) × *z* = *x*
    × (*y* × *z*). In **Z**₅*, (2 × 3) × 4 = 1 × 4 = 2 × (3 × 4) = 2 × 2 = 4.


    **Identity existence** The group includes an element *e* such that *e* × *x* =
    *x* × *e* = *x*. Such an element is called the *identity*. In any **Z**ₚ*, the
    identity element is 1.


    **Inverse existence** For any *x* in the group, there’s a *y* such that *x* ×
    *y* = *y* × *x* = *e*. In **Z**₅*, the inverse of 2 is 3, and the inverse of 3
    is 2, while 4 is its own inverse because 4 × 4 = 16 = 1 mod 5.


    In addition, a group is *commutative*, or *abelian*, if *x* × *y* = *y* × *x*
    for any group elements *x* and *y*. That’s also true for any multiplicative group
    of integers **Z**ₚ*. In particular, **Z**₅* is commutative: 3 × 4 = 4 × 3, 2 ×
    3 = 3 × 2, and so on.


    A group is *cyclic* if there’s at least one element *g* such that its powers (*g*¹,
    *g*², *g*³, and so on) mod *p* span all distinct group elements. The element *g*
    is then a *generator* of the group. **Z**₅* is cyclic and has two generators,
    2 and 3, because 2¹ = 2, 2² = 4, 2³ = 3, 2⁴ = 1, and 3¹ = 3, 3² = 4, 3³ = 2, 3⁴
    = 1.


    Note that I’m using multiplication as a group operator, but you can also get groups
    from other operators. For example, the most straightforward group is the set of
    all integers, positive and negative, with addition as a group operation. Let’s
    check that the group axioms hold with addition, in the preceding order: the number
    *x* + *y* is an integer if *x* and *y* are integers (closure); (*x* + *y*) + *z*
    = *x* + (*y* + *z*) for any *x*, *y*, and *z* (associativity); zero is the identity
    element; and the inverse of any number *x* in the group is −*x* because *x* +
    (−*x*) = 0 for any integer *x*. A big difference, though, is that this group of
    integers is of infinite size, whereas in crypto you’ll deal with only *finite
    groups*, or groups with a finite number of elements, for implementation reasons.
    Typically, you’ll use groups **Z**ₚ*, where *p* is *thousands* of bits long (that
    is, groups that contain on the order of 2^m numbers if *p* is *m*-bit long).


    # The Hard Thing


    The discrete logarithm problem as initially used in cryptography consists of finding
    the *y* for which *g*^y = *x*, given a generator *g* within some group **Z**ₚ*,
    where *p* is a prime number, and given a group element *x*. We often express the
    DLP in additive rather than multiplicative notation, as in groups of elliptic
    curves. In this case, the problem is to find the multiplicative factor *k* such
    that *k* × *P* = *Q*, where you know the points *P* and *Q*. This is called the
    *elliptic curve DLP (ECDLP)*.


    The DLP is *discrete* because you’re dealing with countable integers as opposed
    to uncountable real numbers, and it’s a *logarithm* because you’re looking for
    the logarithm of *x* in base *g*. For example, the logarithm of 256 in base two
    is 8 because 2⁸ = 256.'
