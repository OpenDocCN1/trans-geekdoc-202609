  md: "Let’s see MuSig’s main trick in action. If we’re in the simplest case of two\
    \ signers, Alice and Bob, using the same notations as in the previous sections,\
    \ instead of computing $s_A = r_A + ha$ as her share of the signature, Alice computes\
    \ $s_A = r_A + \\mu_Aha$, thus multiplying the $ha$ part with the $\\mu_A$ value.\
    \ She computes $\\mu_A$ (where $\\mu$ is the Greek letter mu) by hashing the list\
    \ of participants’ public keys followed by Alice’s key, $\\mathbf{H}(A \\parallel\
    \ B \\parallel A)$. Likewise, Bob computes $s_B = r_B + \\mu_Bhb$ with $\\mu_B\
    \ = \\mathbf{H}(A \\parallel B \\parallel B)$, hashing the list of public keys\
    \ followed by his key.\n\nAlice then computes the *aggregate public key* as $X\
    \ = \\mu_A A + \\mu_B B$, the sum of the public keys multiplied by their respective\
    \ $\\mu$ values. The hash of the message is then $h = \\mathbf{H}(R \\parallel\
    \ X \\parallel M)$ instead of $\\mathbf{H}(R \\parallel (A + B) \\parallel M)$\
    \ in the vulnerable version multisignature scheme supporting key aggregation.\n\
    \nThis trick works because a malicious Bob can no longer forge another public\
    \ key that would “cancel” Alice’s $A$, as he could by setting $C = B - A$ in the\
    \ key cancellation attack. In the equation $X = \\mu_A A + \\mu_B B$, Bob has\
    \ to find a new value of $B$ that yields the “right” $\\mu$ coefficients to remove\
    \ $A$ from the equation. But that’s now impossible because the equation is nonlinear\
    \ with respect to $A$ and $B$ (linearity is often synonymous with insecurity—see\
    \ Chapter 2).\n\nWhen there are more than two signers, you apply the trick in\
    \ a similar way, computing the $\\mu$ coefficients by hashing the list of keys\
    \ followed by the signer’s key and then aggregating the public keys into a single\
    \ $X$ by computing the sum of the public keys multiplied by their respective $\\\
    mu$.\n\n> **NOTE**  \n> *For more details on the MuSig protocols and how the MuSig-DN\
    \ version securely derives nonces from the message, see https://bitcoinops.org/en/topics/musig/.*\n\
    \n# Aggregate Signature Protocols\n\n*Aggregate signatures* have multiple signers,\
    \ and each signer signs a message (which can be distinct for all signers); then\
    \ these signatures are merged into a single signature. From only this signature\
    \ and from the signers’ public keys and the messages they signed, verification\
    \ checks that all signers signed their respective messages. Because a single signature\
    \ must be stored, instead of as many signatures as signers, verification time\
    \ is proportional to the number of messages. When all signers sign the same message,\
    \ verification can be as fast as the verification of a single signer’s signature,\
    \ regardless of the number of signers.\n\nAggregate signatures are notably used\
    \ in Ethereum, specifically in its consensus layer. In this use case, validator\
    \ nodes endorse proposals to change the state of the system (as blocks) and leverage\
    \ aggregate signatures to minimize the signature storage space and verification\
    \ time. They use the Boneh–Lynn–Shacham (BLS) signature scheme, which you’ll learn\
    \ about in this section, starting with the magic behind BLS signatures: cryptographic\
    \ pairings."
