- pgno: 147
  md: 'That is, any collision-resistant hash is also second-preimage resistant. If
    this were not the case, there would be an efficient solve-second-preimage algorithm
    that could be used to break collision resistance.


    # How to Find Collisions


    Finding collisions is faster than finding preimages: it takes approximately $2^{n/2}$
    operations instead of $2^n$, thanks to the *birthday attack*, whose key idea is
    the following: given $N$ messages and as many hash values, you can produce a total
    of $N \times (N - 1) / 2$ potential collisions by considering each pair of two
    hash values (a number of the same order of magnitude as $N^2$). It’s called the
    *birthday attack* because it’s usually illustrated using the *birthday paradox*,
    which is the fact that a group of 23 people will include two people having the
    same birth date with probability close to 1/2—which is not a paradox, just a surprise
    for many people.


    > **NOTE**  $N \times (N - 1) / 2$ is the count of *pairs* of two distinct messages,
    where you divide by 2 because you view $(M_1, M_2)$ and $(M_2, M_1)$ as a same
    pair, the ordering being unimportant.


    For comparison, in the case of a preimage search, $N$ messages get you only $N$
    candidate preimages, whereas the same $N$ messages give approximately $N^2$ potential
    collisions. With $N^2$ instead of $N$, you can say that there are *quadratically*
    more chances to find a solution. The complexity of the search is in turn quadratically
    lower: to find a collision, use the square root of $2^n$ messages; that is, use
    $2^{n/2}$ instead of $2^n$.


    # The Naive Birthday Attack


    Here’s the simplest way to find collisions using the birthday attack:


    +   1. Compute $2^{n/2}$ hashes of $2^{n/2}$ arbitrarily chosen messages and store
    all the message/hash pairs in a list.

    +   2. Sort the list with respect to the hash value to move any identical hash
    values next to each other.

    +   3. Search the sorted list to find two consecutive entries with the same hash
    value.


    Unfortunately, this method requires a lot of memory (enough to store $2^{n/2}$
    message/hash pairs), and sorting lots of elements slows down the search, requiring
    about $n2^{n/2}$ operations on average, using a fast sorting algorithm such as
    quicksort.


    # Low-Memory Collision Search with the Rho Method


    The *Rho method* is an algorithm for finding collisions that, unlike the naive
    birthday attack, requires only a small amount of memory. It works like this:'
