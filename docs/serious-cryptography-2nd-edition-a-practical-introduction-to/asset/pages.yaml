  md: "# Certificates and Certificate Authorities\n\nThe most critical step in the\
    \ TLS handshake, and the crux of TLS’s security, is the *certificate validation\
    \ step*, wherein a server uses a certificate to authenticate itself to a client.\n\
    \nA *certificate* is essentially a public key accompanied by a signature of that\
    \ key and associated information (including the domain name). For example, when\
    \ connecting to *https://www.google.com*, your browser receives a certificate\
    \ from some network host and then verifies the certificate’s signature, which\
    \ read something like “I am *google.com*, and my public key is [key].” If the\
    \ signature is verified, the certificate and its public key are *trusted*, and\
    \ the browser proceeds with establishing the connection. (See Chapters 10 and\
    \ 12 for details regarding signatures.)\n\nThe browser knows the public key needed\
    \ to verify the signature through a *certificate authority (CA)*, which is essentially\
    \ a public key hardcoded in your browser or operating system. The public key’s\
    \ private key (that is, its signing capability) belongs to a trusted organization\
    \ that ensures the public keys in certificates it issues belong to the website\
    \ or entity that claims them. That is, a CA acts as a *trusted third party*. Without\
    \ CAs, there’s no way to verify that the public key served by *google.com* belongs\
    \ to Google and not to an eavesdropper performing a man-in-the-middle attack.\n\
    \nFor example, Listing 13-1 shows what happens when you use the OpenSSL command\
    \ line tool to initiate a TLS connection to *www.google.com* on port 443, the\
    \ network port used for TLS-based HTTP connections (HTTPS).\n\n```\n```text\n\
    $ openssl s_client -connect www.google.com:443\nCONNECTED(00000003)\n---\nCertificate\
    \ chain\n 0 s:CN = www.google.com\n   i:C = US, O = Google Trust Services LLC,\
    \ CN = GTS CA 1C3\n 1 s:C = US, O = Google Trust Services LLC, CN = GTS CA 1C3\n\
    \   i:C = US, O = Google Trust Services LLC, CN = GTS Root R1\n 2 s:C = US, O\
    \ = Google Trust Services LLC, CN = GTS Root R1\n   i:C = BE, O = GlobalSign nv-sa,\
