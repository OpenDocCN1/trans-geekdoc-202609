- pgno: 179
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_179_0.png)


    Figure 7-5: SipHash-2-4 processing a 15-byte message (a block, M₁, of 8 bytes
    and a block, M₂, of 7 bytes, plus 1 byte of padding)


    The SipRound function uses a bunch of XORs together with additions and word rotations
    to make the function secure. SipRound transforms a state of four 64-bit words
    (a, b, c, d) by performing the following operations, top to bottom. The operations
    on the left and on the right are independent and can be carried out in parallel:


    ```

    a += b      c += d

    b <<= 13    d <<= 16

    b ⊕= a      d ⊕= c

    a <<= 32

    c += b      a += d

    b <<= 17    d <<= 21

    b ⊕= c      d ⊕= a

    c <<= 32

    ```


    Here, a += b is shorthand for a = a + b, and b <<= 13 is shorthand for b = b <<<
    13 (the 64-bit word b left-rotated 13 bits).


    These simple operations on 64-bit words are almost all you need to implement to
    compute SipHash—although you won’t have to implement it yourself. You can find
    readily available implementations in most languages, such as C, Go, Java, JavaScript,
    Python, and Rust.


    NOTE I wrote SipHash-x-y as the SipHash version, meaning it makes x SipRounds
    between each message block injection and then y rounds. More rounds require more
    operations, which slows down operations but also increases security. The default
    version is SipHash-2-4 (simply noted as SipHash), and it has so far resisted cryptanalysis.
    Note that I also defined SipHash128, a version of SipHash producing 128-bit tags.


    Many systems, such as the Rust language, the OpenBSD operating system, and the
    Bitcoin blockchain, use SipHash internally. The Linux kernel uses SipHash too
    and also uses HalfSipHash, “SipHash’s insecure younger cousin,” a smaller version
    with a 64-bit key and 32-bit output (see https://docs.kernel.org/security/siphash.html).'
