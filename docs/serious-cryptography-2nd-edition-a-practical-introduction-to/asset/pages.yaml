    When reviewing cryptography, you should check not only the type of algorithms
    used but also their parameters and the length of their secret values. However,
    as you’ll see in the following story, what’s secure enough today may be insecure
    tomorrow.


    In 2015, researchers discovered that many HTTPS servers and email servers supported
    an older, insecure version of the Diffie–Hellman key agreement protocol. Namely,
    the underlying TLS implementation supported Diffie–Hellman within a group, Z*_p,
    defined by a prime number, p, of only 512 bits, where the discrete logarithm problem
    was no longer practically impossible to compute.


