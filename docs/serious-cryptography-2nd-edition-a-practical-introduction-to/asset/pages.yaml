    g^{a}, g^{b}. The decisional Diffie–Hellman assumption assumes that no attacker
    can solve DDH efficiently.


    If DDH is hard, then so is CDH, and you can’t learn anything about g^{ab}. So
    if you can solve CDH, you can also solve DDH: given a triplet (g^{a}, g^{b}, x),
    you’d be able to derive g^{ab} from g^{a} and g^{b} and check whether the result
    is equal to the given x.


    The bottom line is that DDH is fundamentally less hard than CDH (notably, DDH
    is not hard over Z_{p}^{*}, contrarily to CDH), yet DDH hardness is a prime assumption
    in cryptography and one of the most studied.


    # Variants of Diffie–Hellman


    Sometimes cryptographers devise new schemes and prove that they’re at least as
    hard to break as it is to solve some hard problem. But such hard problems are
    not always CDH or DDH but instead can be variants of them. We’d like to be able
    to demonstrate that breaking a cryptosystem is as hard as solving CDH or DDH,
    but this isn’t always possible with advanced cryptographic mechanisms, typically
    because such schemes involve more complex operations than basic Diffie–Hellman
    protocols.


    For example, in one DH-like problem, given g^{a}, an attacker attempts to compute
    g^{1/a}, where 1/a is the inverse of a in the group (typically Z_{p}^{*} for some
    prime p). In another, an attacker might distinguish the pairs (g^{a}, g^{ja})
    from the pairs (g^{a}, g^{1/a}) for random a and b. Finally, in the twin Diffie–Hellman
    problem, given g^{a}, g^{b}, and g^{c}, an attacker attempts to compute the two
    values g^{ab} and g^{ac}. Sometimes such DH variants turn out to be as hard as
    CDH or DDH, and sometimes they’re fundamentally easier—and therefore provide lower
    security guarantees. As an exercise, try to find connections between the hardness
    of these problems and that of CDH and DDH. (Twin Diffie–Hellman is actually as
    hard as CDH, but that isn’t easy to prove!)


    # Key Agreement Protocols


    The Diffie–Hellman problem is designed to build secure key agreement protocols,
    which secure communication between two or more parties communicating over a network
    with the aid of a shared secret. The parties turn this secret into one or more
    session keys—symmetric keys that encrypt and authenticate the information exchanged
    for the duration of the session.


    Before studying actual DH protocols, you should know what makes a key agreement
    protocol secure and how simpler protocols work. We’ll begin our discussion with
    a prevalent key agreement protocol that doesn’t rely on DH.


    # Non-DH Key Agreement


    To provide a sense of how a key agreement protocol works and what it means for
    it to be secure, let’s look at the protocol the 4G and 5G'
