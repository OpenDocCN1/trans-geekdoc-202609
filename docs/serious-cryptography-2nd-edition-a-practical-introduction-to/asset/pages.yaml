  md: 'to wait until all associated data is read and hashed before hashing the first
    ciphertext block.


    However, GCM is streamable: since the computations in its two layers can be pipelined,
    there’s no need to store all ciphertext blocks before computing GHASH because
    GHASH processes each block as it’s encrypted. In other words, $P_1$ encrypts to
    $C_1$, then GHASH processes $C_1$ while $P_2$ encrypts to $C_2$, then $P_1$ and
    $C_1$ are no longer needed, and so on.


    # The OCB Authenticated Cipher Mode


    First developed in 2001, *offset codebook (OCB)* predates GCM, and like GCM it
    produces an authenticated cipher from a block cipher, though it does so faster
    and more simply. OCB has yet to see wider adoption because until 2021, the use
    of OCB was patented and required a license from its inventor. OCB is now free
    for anyone to use in any application.


    Unlike GCM, OCB blends encryption and authentication into one processing layer
    that uses a single key. There’s no separate authentication layer, so OCB provides
    authentication mostly for free and performs nearly as many block cipher calls
    as a nonauthenticated cipher would—OCB is almost as simple as the ECB mode (see
    Chapter 4), except that it’s more secure.


    # *OCB Internals*


    Figure 8-3 shows how OCB works: it encrypts each plaintext block $P$ to a ciphertext
    block $C = E(K, P \oplus O) \oplus O$, where $E$ is a block cipher encryption
    function. Here, $O$ (the *offset*) is a value that depends on the key and the
    nonce incremented for each new block processed.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_194_0.png)


    *Figure 8-3: The OCB encryption process when run on two plaintext blocks, with
    no associated data*


    To produce the authentication tag, OCB first XORs the plaintext blocks together
    to compute $S = P_1 \oplus P_2 \oplus P_3 \oplus \cdots$. The tag is then $T =
    E(K, S \oplus O^*)$, where $O^*$ is an offset value computed from the offset of
    the last plaintext block processed.'
