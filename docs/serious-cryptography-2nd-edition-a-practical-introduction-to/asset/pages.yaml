    Q_f transforms the quantum state |x⟩|y⟩ to the state |x⟩|f(x) ⊕ y⟩. That is, it
    computes the function f() on the quantum state reversibly because you can go from
    the new state to the old one by computing f(x) and XORing it to f(x) ⊕ y. (Explaining
    why this works is beyond this book''s scope.)


    You can use the exponential speedup for Simon''s problem against symmetric ciphers
    only in very specific cases, but the next section will discuss some real crypto-killer
    applications of quantum computing.


    # The Threat of Shor''s Algorithm


    In 1995, AT&T researcher Peter Shor published an eye-opening article titled “Polynomial-Time
    Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer.”
    Shor''s algorithm is a quantum algorithm that causes an exponential speedup when
    solving the factoring, discrete logarithm (DLP), and elliptic curve discrete logarithm
    (ECDLP) problems. You can''t efficiently solve these problems with a classical
    computer, but you could with a quantum computer. This means that a quantum computer
    could solve any cryptographic algorithm that relies on those problems, including
    RSA, Diffie–Hellman, elliptic curve cryptography, and most currently deployed
    public-key cryptography mechanisms (except for those that transitioned to post-quantum
    cryptography). In other words, you could reduce the security of RSA or elliptic
    curve cryptography to that of Caesar''s cipher. (Shor might as well have titled
    his article “Breaking All Public-Key Crypto on a Quantum Computer.”) Renowned
    complexity theorist Scott Aaronson called Shor''s algorithm “one of the major
    scientific achievements of the late 20th century.”


    Shor''s algorithm actually solves a more general class of problems than factoring
    and discrete logarithms. Specifically, if a function f() is periodic—that is,
    if there''s an ω (the period) such that f(x + ω) = f(x) for any x—then Shor''s
    algorithm will efficiently find ω. (This looks very similar to Simon''s problem,
    as it was a major inspiration for Shor''s algorithm.)


    Discussing the details of how Shor''s algorithm achieves its speedup is far too
    technical for this book, but the next section shows how to use Shor''s algorithm
    to solve the factoring and discrete logarithm problems (see Chapter 9), the hard
    problems behind RSA and Diffie–Hellman.


