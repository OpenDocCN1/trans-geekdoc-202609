- pgno: 154
  md: 'States. They are considered worldwide standards, and only certain non-US governments
    opt for their own hash algorithms (such as China''s SM3, Russia''s Streebog, and
    Ukraine''s Kupyna) for reasons of sovereignty rather than a lack of trust in SHA''s
    security. The US SHAs have been more extensively reviewed by cryptanalysts than
    the non-US ones.


    > *Message Digest 5 (MD5) was the most popular hash function from 1992 until it
    was broken around 2005, and many applications switched to one of the SHA hash
    functions. MD5 processes 512-bit block messages and updates a 128-bit internal
    state to produce a 128-bit hash, thus providing at best 128-bit preimage security
    and 64-bit collision security. In 1996, cryptanalysts warned of a collision for
    MD5''s compression function, but their warning went unheeded until 2005 when a
    team of Chinese cryptanalysts discovered how to compute collisions for the full
    MD5 hash. As I write this, it takes only seconds to find a collision for MD5,
    yet some systems still use or support MD5, often for reasons of backward compatibility.*


    # SHA-1


    The SHA-1 standard arose from a failure in the NSA''s original SHA-0 hash function.
    In 1993, NIST standardized the SHA-0 hash algorithm, but in 1995 the NSA released
    SHA-1 to fix an unidentified security issue in SHA-0. The reason for the tweak
    became clear when in 1998 two researchers discovered how to find collisions for
    SHA-0 in about 2^60 operations instead of the 2^80 expected for 160-bit hash functions
    such as SHA-0 and SHA-1. Later attacks reduced the complexity to around 2^33 operations,
    leading to actual collisions in less than an hour for SHA-0.


    # SHA-1 Internals


    SHA-1 combines a Merkle–Damgård hash function with a Davies–Meyer compression
    function based on a specially crafted block cipher. That is, SHA-1 works by iterating
    the following operation over 512-bit message blocks (M):


    H = E(M, H) + H


    Here, the use of a plus sign (+) rather than ⊕ (XOR) is intentional. E(M, H) and
    H are viewed as arrays of 32-bit integers, and two words at the same position
    are added together: the first 32-bit word of E(M, H) with the first 32-bit word
    of H, and so on. The initial value of H is constant for any message, then H is
    modified as per the previous equation, and the final value of H after processing
    all blocks is returned as the hash of the message.


    Once the block cipher is run using the message block as a key and the current
    160-bit chaining value as a plaintext block, the 160-bit result is seen as an
    array of five 32-bit words, each of which is added to its 32-bit counterpart in
    the initial H value.'
