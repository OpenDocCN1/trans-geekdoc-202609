- pgno: 118
  md: 'We repeat the same rule to compute the subsequent state values R₂, R₃, and
    so on. That is, given Rₜ, the FSR''s state at time t, the next state, Rₜ₊₁, is
    the following:


    Rₜ₊₁ = (Rₜ << 1) | f(Rₜ)


    In this equation, | is the logical OR operator, and << is the shift operator,
    as used in the C language. For example, given the 8-bit string 00001111, we have
    this:


    00001111 << 1 = 00011110

    00011110 << 1 = 00111100

    00111100 << 1 = 01111000


    The bit shift moves the bits to the left, losing the leftmost bit to retain the
    state''s bit length and zeroing the rightmost bit. The update operation of an
    FSR is identical, except that instead of being set to 0, the rightmost bit is
    set to f(Rₜ).


    Consider, for example, a 4-bit FSR whose feedback function f XORs all 4 bits together.
    Initialize the state to the following:


    1 1 0 0


    Now shift the bits to the left, where 1 is output and the rightmost bit is set
    to the following:


    f(1100) = 1 ⊕ 1 ⊕ 0 ⊕ 0 = 0


    Now the state becomes this:


    1 0 0 0


    The next update outputs 1, left-shifts the state, and sets the rightmost bit to
    the following:


    f(1000) = 1 ⊕ 0 ⊕ 0 ⊕ 0 = 1


    Now the state is this:


    0 0 0 1


    The next three updates return three 0 bits and give the following state values:


    0 0 1 1

    0 1 1 0

    1 1 0 0


    We thus return to our initial state of 1100 after five iterations; updating the
    state five times from any of the values observed throughout this cycle'
