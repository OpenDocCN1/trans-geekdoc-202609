    a PoW algorithm adopted by the Monero blockchain.


    # Hierarchical Key Derivation


    Blockchain users generally want to manage multiple accounts, such that each account
    consists of a key pair where:


    +   - The *private key* must be secret, as it''s the signing key required to sign
    transactions and transfer funds from the account.

    +   - The *public key* must be public, as it''s used to verify signatures of transactions.
    It''s also the value from which the account''s address is derived. For example,
    Bitcoin derives addresses from a public key using a combination of SHA-256 and
    RIPEMD-160 hashing. Note that in some blockchains, such as Bitcoin, the public
    key is not public until the account issues a transaction.


    To reliably manage all these keys, blockchain developers defined *hierarchical
    deterministic wallets (HD wallets)*, which make key management less cumbersome
    and risky than having to generate and back up a fresh random key for each new
    account.


    With HD wallets, you generate and store one secret, the *seed* (also called the
    *master key* or *entropy*). This seed is the only randomly generated value and
    the only one providing entropy, or uncertainty, and therefore secrecy to the private
    signing keys derived from it. Wallet software applications often encode the seed
    as a *seed phrase*, or *mnemonic*, a sequence of 12 to 24 words that makes it
    easier to save and memorize.


    Let''s review how this key derivation works using the HMAC-SHA-512 pseudorandom
    function (the HMAC construction instantiated with SHA-512): from a seed S of 128
    or 256 bits, compute HMAC-SHA-512 with the seed as a key input, and as a message
    input an identifier of the underlying elliptic curve (a string that can be “Bitcoin
    seed,” “Nist256p1 seed,” or “ed25519 seed”). The first 256 bits of the result
    are the master key, k, and the last 256 bits are the master chain code, c, a value
    used to derive more keys.


    You can derive a *child private key* from k and c as follows, given an identifier
    i (a number at most 2³¹): compute HMAC-SHA-512 with the chain code c as a key,
    and a message including k and i. The 512-bit result is parsed as a 256-bit value
    L followed by a 256-bit chain code R. In simplified notation, L || R = HMAC-SHA-512(c,
    k || i). You then set the child private key to k + L, and its chain code is R.


    You can in turn derive keys from the obtained key and chain code to establish
    a key *hierarchy*. For example, from the key with index 0, you derive all your
    keys for Bitcoin, and from the key with index 60, you derive all your keys for
    Ethereum. Conventions associating a number to each blockchain network are standardized
    as part of the document “SLIP-0044: Registered Coin Types for BIP-0044.”'
