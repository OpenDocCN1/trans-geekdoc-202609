- pgno: 341
  md: '# Aggregate Public Keys


    Imagine that all signers sign the same message $M$ and that you aggregate all
    public keys into a single one: $P = P_1 + P_2 + \ldots + P_n$. Note that $k_1,
    k_2, \ldots, k_n$ still represents their respective private keys and $H = H(M)$
    the hash of the message. Given valid signatures $S_i$, you obtain the following
    equality:


    $$\begin{aligned}

    e(P,H) &= e(P_1 + P_2 + \ldots + P_n,H) \\

    &= e((k_1 + k_2 + \ldots + k_n)G,H) \\

    &= e(G,(k_1 + k_2 + \ldots + k_n)H) \\

    &= e(G,S_1 + S_2 + \ldots + S_n) \\

    &= e(G,S)

    \end{aligned}$$


    You therefore verify the signatures of $n$ parties over the same message using
    only two pairing operations, $e(P,H)$ and $e(G,S)$. This is extremely efficient,
    as it makes signature verification essentially independent of the number of parties,
    as you can add points efficiently, whereas pairings are costly to compute. In
    addition to the computing efficiency, aggregating keys and signatures also saves
    memory.


    # How Things Can Go Wrong


    Like many elliptic curve cryptography schemes, BLS signatures should avoid invalid
    keys and weak parameters to be secure. And like the previous protocols, BLS signatures
    could be vulnerable to key cancellation attack. Let’s explore the details.


    # Invalid Keys


    BLS signatures are specified in an Internet-Draft, a working document of the IETF
    available at *https://github.com/cfrg/draft-irtf-cfrg-bls-signature*. This specifies
    core operations including key generation (the algorithm KeyGen), signature (CoreSign),
    verification (CoreVerify), and key validation (KeyValidate). Given a public key,
    the latter ensures the validity of a public key in that it “represents a valid,
    non-identity point that is in the correct subgroup.”


    Key validation prevents the use of weak private/public keys pairs, for which signatures
    are easier to forge. For example, take the trivial case of a zero secret key $a
    = 0$. It follows that the signature of any message $M$ is $0 \times H(M) = 0$.
    It’s therefore trivial to forge a signature for any message. In that case, the
    public key is then $0 \times G = O$, which is the point at infinity. If key validation
    rejects public keys equal to $O$, it ensures that the secret key is not zero.


    A less trivial case is when the public key, as an elliptic curve point, has a
    value that makes it easier to forge signatures—that is, to create a valid signature
    without knowing the private key. Not all points on a given elliptic curve are
    equally secure—in particular, points that belong to a small'
  merge: -1
  img_proc: true
