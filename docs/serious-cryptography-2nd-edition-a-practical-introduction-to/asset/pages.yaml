- pgno: 313
  md: 'To encrypt data using linear codes, the McEliece cryptosystem constructs G
    as a secret combination of three matrices and encrypts by computing w = vG added
    with some random value, e, which has a fixed number of bits set to 1. Here, G
    is the public key, and the private key is composed of the matrices A, B, and C
    such that G = ABC. Knowing A, B, and C allows one to decode a message reliably
    and retrieve w. But without these matrices, it should be impossible to decode
    the word and thus to decrypt.


    The security of the McEliece encryption scheme relies on the hardness of decoding
    a linear code with insufficient information, a problem we know to be NP-hard and
    therefore out of reach of quantum computers. Bear in mind, however, that just
    because a problem is NP-hard doesn’t mean that all its instances will be impossible
    to solve in practice. It’s therefore necessary to evaluate which instances of
    the difficult problem are presented by a cryptosystem and whether these instances
    will always be difficult. McEliece’s cipher satisfies this criterion after years
    of analysis by cryptographers and coding theory experts.


    # Lattice-Based Cryptography


    Lattices are mathematical structures that essentially consist of a set of points
    in an n-dimensional space, with some periodic structure. For example, Figure 14-5
    shows how you can view a lattice in dimension two (n = 2) as the set of points.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_313_0.png)


    Figure 14-5: Points of a two-dimensional lattice, where v and w are basis vectors
    of the lattice and s is the closest vector to the star-shaped point


    Lattice theory has led to deceptively simple cryptography schemes. I’ll give you
    the gist of it.


    Short integer solution (SIS) is a hard problem in lattice-based crypto that consists
    of finding the secret vector s of n numbers given (A, b) such that b = As mod
    q, where A is a random m×n matrix and q is a prime number.


    Another hard problem in lattice-based cryptography, learning with errors (LWE),
    consists of finding the secret vector s of n numbers given (A, b), where b = As
    + e mod q, with A being a random m×n matrix, e a random vector of noise, and q
    a prime number. This problem looks a lot like noisy decoding in code-based cryptography.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'SIS and LWE are somewhat equivalent, and we can restate them as instances of
    the *closest vector problem (CVP)* on a lattice, or the problem of finding the
    vector in a lattice closest to a given point, by combining a set of basis vectors.
    The dotted vector *s* in Figure 14-5 shows how to find the closest vector to the
    star-shaped point by combining the basis vectors *v* and *w*.


    CVP and other lattice problems are believed to be hard both for classical and
    quantum computers. But this doesn''t directly transfer to secure cryptosystems,
    because some problems are hard only in the worst case (that is, for their hardest
    instance) rather than the average case (which is what we need for crypto). Furthermore,
    while finding the exact solution to CVP is hard, finding an approximation of the
    solution can be considerably easier.


    That said, post-quantum cryptosystems based on lattices have proven to offer the
    best combination of security and performance. The standards chosen by NIST in
    2022 are mainly from this family, as you''ll see later.


    # Multivariate Cryptography


    *Multivariate cryptography* focuses on building cryptographic schemes that are
    as hard to break as it is to solve systems of multivariate equations, or equations
    involving multiple unknowns that are multiplied together in the equations. Consider,
    for example, the following system of equations involving four unknowns *x₁, x₂,
    x₃, x₄*:


    x₁x₂ + x₃x₄ + x₂ = 1

    x₁x₃ + x₁x₄ + x₂x₃ = 12

    x₁² + x₃² + x₄ = 4

    x₂x₃ + x₂x₄ + x₁ + x₄ = 0


    These equations consist of the sum of terms that are either a single unknown,
    such as *x₄* (or terms of degree one), or the product of two unknown values, such
    as *x₂x₃* (terms of degree two or *quadratic* terms). To solve this system, you
    need to find the values of *x₁, x₂, x₃, x₄* that satisfy all four equations. Equations
    may be over all real numbers, integers only, or over finite sets of numbers. In
    cryptography, however, equations are typically over numbers modulo some prime
    numbers or over binary values (0 and 1).


    The hard problem here is finding a solution to a random quadratic system, which
    is known as *multivariate quadratics (MQ)*. This problem is **NP-hard** and is
    therefore a potential basis for post-quantum systems because quantum computers
    won''t solve **NP-hard** problems efficiently.


    Unfortunately, building a cryptosystem on top of MQ isn''t so straightforward.
    For example, if you were to use MQ for signatures, the private key might consist
    of three systems of equations: *L₁, N*, and *L₂*. Combining them in this order
    results in another system of equations called *P*, the public key. Applying the
    transformations *L₁, N*, and *L₂* consecutively (that is, transforming a group
    of values as per the system of equations) is then equivalent'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'to applying $P$ by transforming $x_1$, $x_2$, $x_3$, $x_4$ to $y_1$, $y_2$,
    $y_3$, $y_4$, for example, defined as follows:


    $$\begin{aligned}

    y_1 &= x_1x_2 + x_3x_4 + x_2 \\

    y_2 &= x_1x_3 + x_1x_4 + x_2x_3 \\

    y_3 &= x_1^2 + x_3^2 + x_4 \\

    y_4 &= x_2x_3 + x_2x_4 + x_1 + x_4

    \end{aligned}$$


    In such a cryptosystem, $L_1$, $N$, and $L_2$ are chosen such that $L_1$ and $L_2$
    are linear transformations (that is, having equations where terms are only added,
    not multiplied) that are invertible, and where $N$ is a quadratic system of equations
    that is also invertible. This makes the combination of the three an invertible
    quadratic system, but its inverse is hard to determine without knowing the inverses
    of $L_1$, $N$, and $L_2$.


    Computing a signature then consists of computing the inverses of $L_1$, $N$, and
    $L_2$ applied to some message, $M$, which we see as a sequence of variables, $x_1$,
    $x_2$, . . . :


    $$S = L_2^{-1}\left(N^{-1}\left(L_1^{-1}(M)\right)\right)$$


    Verifying a signature then consists of verifying that $P(S) = M$.


    Attackers could break such a cryptosystem if they manage to compute the inverse
    of $P$ or to determine $L_1$, $N$, and $L_2$ from $P$. The actual hardness of
    solving such problems depends on the parameters of the scheme, such as the number
    of equations used and the size and type of the numbers. But choosing secure parameters
    is hard, and more than one “safe” multivariate scheme has been broken.


    Multivariate cryptography isn’t used in major applications due to the challenge
    of achieving a reliable trade-off between security and performance. A practical
    benefit of multivariate signature schemes, however, is that they produce short
    signatures.


    # Hash-Based Cryptography


    Unlike the previous schemes, hash-based cryptography is based on the well-established
    security of cryptographic hash functions rather than on the hardness of mathematical
    problems. Because quantum computers can’t break hash functions, they can’t break
    anything that relies on the difficulty of finding collisions or preimages, which
    is the key idea of hash function–based signature schemes.


    Hash-based cryptographic schemes are pretty complex, so we’ll take a look at their
    simplest building block: the *Winternitz one-time signature (WOTS)*, a trick discovered
    around 1979. Here *one-time* means that you can use a private key to sign only
    one message; otherwise, the signature scheme becomes insecure. (You can combine
    WOTS with other methods to sign multiple messages, as you’ll see shortly.)


    Say you want to sign a message viewed as a number between 0 and $w - 1$, where
    $w$ is some parameter of the scheme. The private key is a random string,'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'K. To sign a message, M, with 0 ≤ M < w, compute Hash(Hash( . . (Hash(K)))),
    where the hash function Hash repeats M times. You denote this value as Hash^M(K).
    The public key is Hash^w(K), or the result of w nested iterations of Hash, starting
    from K.


    A WOTS signature is verified, S, by checking that Hash^{w-M}(S) is equal to the
    public key Hash^w(K). Note that S is K after M applications of Hash, so if you
    do another w-M applications of Hash, you''ll get a value equal to K hashed M +
    (w-M) = w times, which is the public key.


    This scheme has significant limitations:


    **Attackers can forge signatures** From Hash^M(K), the signature of M, you can
    compute Hash(Hash^M(K)) = Hash^{M+1}(K), which is a valid signature of the message
    M + 1. You can fix this problem by signing not only M but also w-M, using a second
    key.


    **It works for only short messages** If messages are 8 bits long, there are up
    to 2^8 - 1 = 255 possible messages, so you have to compute Hash up to 255 times
    to create a signature. That might work for short messages, but not for longer
    ones—for example, with 128-bit messages, signing the message 2^128 - 1 takes forever.
    A workaround is to split longer messages into shorter ones and sign each chunk
    independently.


    **It works only once** If you use a private key to sign more than one message,
    an attacker can recover enough information to forge a signature. For example,
    if w = 8 and you sign the numbers 1 and 7 using the preceding trick to avoid trivial
    forgeries, the attacker gets Hash^1(K) and Hash^7(K'') as a signature of 1, and
    Hash^7(K) and Hash^1(K'') as a signature of 7. From these values, the attacker
    can compute Hash^x(K) and Hash^x(K'') for any x in [1;7] and thus forge a signature
    on behalf of the owner of K and K''. There''s no simple way to fix this.


    State-of-the-art hash-based schemes rely on more complex versions of WOTS, combined
    with tree data structures and sophisticated techniques designed to sign different
    messages with different keys. Unfortunately, the resulting schemes produce large
    signatures (on the order of dozens of kilobytes, as with SPHINCS+, one of the
    signature algorithms chosen for standardization by NIST in 2022).


    You should also note the difference between stateful and stateless signature schemes.
    SPHINCS+ is stateless, whereas XMSS is stateful, as it needs to maintain a counter.
    Statefulness greatly simplifies algorithm design but forces users to maintain
    a state such as a counter while using the algorithm.


    Finally, note that public-key constructions relying on only hash functions can
    offer signature schemes but not encryption.


    # The NIST Standards


    In 2017, NIST organized an open competition to identify suitable post-quantum
    algorithm standards for encryption and signature. Like the previous competitions
    that gave us AES (Rijndael) and SHA-3 (Keccak), NIST''s Post-Quantum Cryptography
    Standardization project invited'
