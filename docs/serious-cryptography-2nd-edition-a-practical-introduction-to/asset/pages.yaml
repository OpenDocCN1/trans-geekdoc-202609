- pgno: 196
  md: 'An important difference between OCB and GCM implementations is that OCB needs
    both the block cipher''s encryption and decryption functions to encrypt and decrypt,
    increasing the cost of hardware implementations when only limited silicon is available
    for crypto components. In contrast, GCM uses only the encryption function for
    both encryption and decryption.


    # The SIV Authenticated Cipher Mode


    Synthetic IV (SIV) is an authenticated cipher mode typically used with AES. Unlike
    GCM and OCB, SIV is secure even if you use the same nonce twice: an attacker that
    gets two ciphertexts encrypted using the same nonce would only be able to learn
    whether the same plaintext was encrypted twice. Unlike with GCM or OCB, the attacker
    would be unable to tell whether the first block of the two messages is the same,
    because the nonce used to encrypt is first computed as a combination of the given
    nonce and the plaintext.


    The SIV construction specification is more general than that of GCM. Instead of
    specifying detailed internals as with GCM''s GHASH, SIV simply tells you how to
    combine a cipher (E) and a pseudorandom function (PRF) to get an authenticated
    cipher: you first compute the tag T = PRF(K1, N || P) and then the ciphertext
    C = E(K2, T, P), where T acts as the nonce of E. Thus, SIV needs two keys (K1
    and K2) and a nonce (N).


    The major limitation of SIV is that it''s not streamable: after computing T, it
    must keep the entire plaintext P in memory. In other words, to encrypt a 100GB
    plaintext with SIV, you must first store the 100GB so that SIV encryption can
    read it.


    The document RFC 5297, based on the 2006 paper “Deterministic Authenticated-Encryption”
    by Phillip Rogaway and Thomas Shrimpton, specifies SIV as using CMAC-AES (a MAC
    construction using AES) as a PRF and AES-CTR as a cipher. In 2015, a more efficient
    version of SIV was proposed, GCM-SIV, which combines GCM''s fast GHASH function
    and SIV''s mode and is nearly as fast as GCM. Like the original SIV, however,
    GCM-SIV isn''t streamable. (For more information, see https://eprint.iacr.org/2015/102.)


    # Permutation-Based AEAD


    Now for a totally different approach to building an authenticated cipher: instead
    of building a mode of operation around a block cipher like AES, we''ll look at
    a cipher that builds a mode around a permutation. A permutation simply transforms
