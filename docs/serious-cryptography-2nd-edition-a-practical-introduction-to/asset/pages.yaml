- pgno: 235
  md: 'The expMod() algorithm runs in time *O(m)*, whereas the naive algorithm runs
    in time *O(2^m)*, where *m* is the bit length of the exponent. Here, *O()* is
    the asymptotic complexity notation introduced in Chapter 9.


    All serious systems implement some variant of this simplest square-and-multiply
    method. One such variant is the *sliding window* method, which considers blocks
    of bits rather than individual bits to perform a given multiplication operation.
    For example, see the function expNN() of the Go language, whose source code is
    available at *https://go.dev/src/math/big/nat.go*.


    How secure are these square-and-multiply exponentiation algorithms? Unfortunately,
    the tricks to speed the process up often result in increased vulnerability against
    some attacks.


    The weakness of these algorithms stems from the fact that the exponentiation operations
    are heavily dependent on the exponent’s value. The if operation in Listing 10-5
    takes a different branch based on whether an exponent’s bit is 0 or 1. If a bit
    is 1, an iteration of the for loop is slower than it is for 0, and attackers who
    monitor the execution time of the RSA operation can exploit this time difference
    to recover a private exponent. This is called a *timing attack*. Attacks on hardware
    can distinguish 1 bit from 0 bits by monitoring the device’s power consumption
    and observing which iterations perform an extra multiplication to reveal which
    bits of the private exponent are 1.


    Depending on the type of platform, the information channel may not be execution
    time. For example, you might distinguish 1-bits in the exponent from 0-bits by
    measuring the device’s power consumption and observing which iterations perform
    additional multiplication, revealing the private exponent bits at 1. This is a
    *power-analysis attack*. Few open source cryptographic libraries contain effective
    defenses against these types of attacks.


    # Small Exponents for Faster Public-Key Operations


    Because an RSA computation is essentially the computation of an exponentiation,
    its performance depends on the value of the numbers involved, in particular the
    exponent. Smaller exponents require fewer multiplications and can therefore make
    the exponentiation computation much faster.


    In principle, the public exponent *e* can be any value between 3 and φ(*n*) −
    1, as long as *e* and φ(*n*) are coprime. But in practice you’ll find only small
    values of *e*, and some of the time *e* = 65,537 due to concerns with encryption
    and signature verification speed. For example, the Microsoft Windows CryptoAPI
    supports only public exponents that fit in a 32-bit integer. The larger the *e*,
    the slower it is to compute *x^e mod n*.


    Unlike the size of the public exponent, the private exponent *d* is inevitably
    about as large as *n*, making decryption much slower than encryption, and signing
    much slower than verification. Because *d* is secret, it must be unpredictable
    and therefore can’t be restricted to a small value. For example, if *e* is'
