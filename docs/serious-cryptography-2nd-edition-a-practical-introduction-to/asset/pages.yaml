- pgno: 109
  md: 'A random nonce will do the trick only if it’s long enough; for example, if
    the nonce is n bits, chances are that after 2^{n/2} encryptions and as many nonces,
    you’ll run into duplicates. Sixty-four bits are insufficient for a random nonce,
    since you can expect a repetition after approximately 2^{32} nonces, which is
    an unacceptably low number.


    The counter is guaranteed unique if it’s incremented for every new plaintext,
    and if it’s long enough—for example, a 64-bit counter.


    One particular benefit to CTR is that it can be faster than any other mode. Not
    only is it parallelizable, but you can also start encrypting even before knowing
    the message by picking a nonce and computing the stream that you’ll later XOR
    with the plaintext.


    > NOTE

    > Depending on the CTR version we implement, we may either concatenate the nonce
    the API uses as an argument to a counter (as in Figure 4-10) or directly consider
    a counter as wide as a block.


    # How Things Can Go Wrong


    There are two must-know attacks on block ciphers: meet-in-the-middle attacks,
    a technique discovered in the 1970s but still used in many cryptanalytic attacks
    (not to be confused with man-in-the-middle attacks), and padding oracle attacks,
    a class of attacks discovered in 2002 by academic cryptographers, then mostly
    ignored, and finally rediscovered a decade later along with several vulnerable
    applications.


    # Meet-in-the-Middle Attacks


    The 3DES block cipher is an upgraded version of the 1970s standard DES that takes
    a key of 56 × 3 = 168 bits (an improvement on DES’s 56-bit key). But the security
    level of 3DES is 112 bits instead of 168 bits because of the meet-in-the-middle
    (MitM) attack.


    Figure 4-11 shows that 3DES encrypts a block using the DES encryption and decryption
    functions: first encryption with a key, K₁; then decryption with a key, K₂; and
    finally encryption with another key, K₃. If K₁ = K₂, the first two calls cancel
    themselves out, and 3DES boils down to a single DES with key K₃. 3DES does encrypt-decrypt-encrypt
    rather than encrypting thrice to allow systems to emulate DES when necessary using
    the new 3DES interface.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Why use triple DES and not just double DES—that is, why encrypt a plaintext
    P to E(K₂, E(K₁, P))? It turns out that the MitM attack makes double DES only
    as secure as single DES. Figure 4-12 shows the MitM attack in action.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_110_0.png)


    Figure 4-12: The MitM attack


    The MitM attack works as follows to attack double DES:


    +   1. Say you have P and C = E(K₂, E(K₁, P)) with two unknown 56-bit keys, K₁
    and K₂. (DES takes 56-bit keys, so double DES takes 112 key bits in total.) You
    build a key-value table with 2⁵⁶ entries of E(K₁, P), where E is the DES encryption
    function and K₁ is the value stored.

    +   2. For all 2⁵⁶ values of K₂, compute D(K₂, C) and check whether the resulting
    value appears in the table as an index (thus as a middle value, represented by
    a question mark in Figure 4-12).

    +   3. If you find a middle value as an index of the table, fetch the corresponding
    K₁ from the table and verify that the (K₁, K₂) found is the right one by using
    other pairs of P and C. Encrypt P using K₁ and K₂ and then check that the ciphertext
    obtained is the given C.


    This method recovers K₁ and K₂ by performing about 2⁵⁷ instead of 2¹¹² operations:
    step 1 encrypts 2⁵⁶ blocks, and then step 2 decrypts at most 2⁵⁶ blocks, for 2⁵⁶
    + 2⁵⁶ = 2⁵⁷ operations in total. You also need to store 2⁵⁶ elements of 15 bytes
    each, or about 1 exabyte. That''s a lot, but there''s a trick that allows you
    to run the same attack with only negligible memory (as you''ll see in Chapter
    6).


    You can apply the MitM attack to 3DES in almost the same way you would to double
    DES, except that the third stage will go through all 2¹¹² values of K₂ and K₃.
    The whole attack thus succeeds after performing about 2¹¹² operations, meaning
    that 3DES gets only 112-bit security despite having 168 bits of key material.


    # Padding Oracle Attacks


    We conclude this chapter with one of the simplest and yet most devastating attacks
    of the 2000s: the padding oracle attack. Remember that padding fills the plaintext
    with extra bytes to fill a block. A plaintext of 111 bytes, for example, is a
    sequence of six 16-byte blocks followed by 15 bytes. In this case, forming a complete
    block padding adds a 01 byte. For a 110-byte plaintext, padding adds 2 02 bytes.
    For a 109-byte plaintext, it adds 3 03 bytes, and so on, up to the case where
    we add 16 10 bytes, where the hexadecimal value 10 is equal to 16.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'A padding oracle is a system that behaves differently depending on whether
    the padding in a CBC-encrypted ciphertext is valid. You can see it as a black
    box or an API that returns either a success or an error value. You can, for example,
    obtain a padding oracle in a service on a remote host that sends error messages
    when it receives malformed ciphertexts. Given such an oracle, padding oracle attacks
    record which inputs have a valid padding and which don’t and then exploit this
    information to decrypt chosen ciphertext values.


    Say you want to decrypt a ciphertext block C₂. I’ll call X the value you’re looking
    for, namely, D_K(C₂), and P₂ the block obtained after decrypting in CBC mode (see
    Figure 4-13). If you pick a random block C₁ and send the two-block ciphertext
    C₁ || C₂ to the oracle, decryption will succeed only if C₁ ⊕ X = P₂ ends with
    valid padding—a single 01 byte, two 02 bytes, or three 03 bytes, and so on.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_111_0.png)


    Figure 4-13: Padding oracle attacks recover X by choosing C₁ and checking the
    validity of padding.


    Based on this observation, padding oracle attacks on CBC encryption can decrypt
    a block C₂ like this (bytes are denoted in array notation: C₁[0] is C₁’s first
    byte, C₁[1] its second byte, and so on up to C₁[15], C₁’s last byte):


    +   1. Pick a random block C₁ and vary its last byte until the padding oracle
    accepts the ciphertext as valid. Usually, in a valid ciphertext, C₁[15] ⊕ X[15]
    = 01, so you’ll find X[15] after trying around 128 values of C₁[15].

    +   2. Find the value X[14] by setting C₁[15] to X[15] ⊕ 02 and searching for
    the C₁[14] that gives correct padding. When the oracle accepts the ciphertext
    as valid, it means you’ve found C₁[14] such that C₁[14] ⊕ X[14] = 02.

    +   3. Repeat steps 1 and 2 for all 16 bytes.


    The attack needs on average 128 queries to the oracle for each of the 16 bytes,
    which is about 2,000 queries in total. (Note that each query must use the same
    initial value.)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '> **NOTE** *In practice, implementing a padding oracle attack is a bit more
    complicated than what I’ve described because you have to deal with wrong guesses
    at step 1. A ciphertext may have valid padding not because P₂ ends with a single
    01 but because it ends with two 02 bytes or three 03 bytes. You can manage this
    by testing the validity of ciphertexts where more bytes are modified.*


    # Further Reading


    There’s a lot to say about block ciphers, be it in how algorithms work or in how
    they can be attacked. For instance, Feistel networks and SPNs aren’t the only
    ways to build a block cipher. The block ciphers IDEA and FOX use the Lai–Massey
    construction, and Threefish uses ARX networks, a combination of addition, word
    rotations, and XORs.


    There are also many more modes than ECB, CBC, and CTR. Some modes are folklore
    techniques that nobody uses, like CFB and OFB, while others are for specific applications,
    like XTS for tweakable encryption or GCM for authenticated encryption.


    I’ve discussed Rijndael, the AES winner, but there were 14 other algorithms in
    the race: CAST-256, CRYPTON, DEAL, DFC, E2, FROG, HPC, LOKI97, Magenta, MARS,
    RC6, SAFER+, Serpent, and Twofish. I recommend looking them up to see how they
    work, how they were designed, how they have been attacked, and how fast they are.
    It’s also worth checking out the NSA’s designs (Skipjack and, more recently, SIMON
    and SPECK) and more recent “lightweight” block ciphers such as GIFT, KATAN, PRESENT,
    or PRINCE.'
