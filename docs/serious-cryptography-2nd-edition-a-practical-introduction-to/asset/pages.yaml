- pgno: 166
  md: '# 7


    # KEYED HASHING


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_166_0.png)


    The hash functions in Chapter 6 take a message and return its hash value—typically
    a short string of 256 or 512 bits. Anyone can compute the hash value of a message
    and verify that a particular message hashes to a particular value. When you want
    only specific people to compute hashes, however, you’ll hash with secret keys
    using *keyed hash functions*.


    Keyed hashing forms the basis of two types of cryptographic algorithms: *message
    authentication codes (MACs)*, which authenticate a message and protect its integrity,
    and *pseudorandom functions (PRFs)*, which produce random-looking hash-sized values.
    We’ll look at the similarities between MACs and PRFs in the first section of this
    chapter before reviewing how MACs and PRFs work. Some MACs and PRFs are based
    on hash functions, some are based on block ciphers, and others are original designs.
    Finally, we’ll discuss examples of attacks on otherwise-secure MACs.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Message Authentication Codes


    A MAC protects a message’s integrity and authenticity by creating a value T =
    MAC(K, M), called the authentication tag of the message, M (often confusingly
    called the MAC of M). Just as you can decrypt a message if you know a cipher’s
    key, you can validate that a message hasn’t been modified if you know a MAC’s
    key.


    For example, say Alex and Bill share a key, K, and Alex sends a message, M, to
    Bill along with its authentication tag, T = MAC(K, M). Upon receiving the message
    and its authentication tag, Bill recomputes MAC(K, M) and checks that it’s equal
    to the authentication tag received. Because only Alex could have computed this
    value, Bill knows that the message wasn’t corrupted in transit (confirming its
    integrity), whether accidentally or maliciously, and that Alex sent that message
    (confirming its authenticity).


    # MACs in Secure Communication


    Secure communication systems often combine a cipher and a MAC to protect a message’s
    confidentiality, integrity, and authenticity. For example, the protocols in Internet
    Protocol Security (IPsec), SSH, and TLS generate a MAC for each transmitted network
    packet.


    Not all communication systems use MACs. Sometimes an authentication tag can add
    unacceptable overhead to each packet, typically in the range of 64 to 128 bits.
    For example, the old GSM mobile telephony standard encrypted packets encoding
    voice calls but didn’t authenticate them. An attacker could modify the encrypted
    audio signal, and the recipient wouldn’t notice.


    # Forgery and Chosen-Message Attacks


    What does it mean for a MAC to be secure? First, as with a cipher, the secret
    key should remain secret. If a MAC is secure, an attacker shouldn’t be able to
    create a tag of some message if they don’t know the key. We call a fabricated
    message/tag pair a forgery, and recovering a key is a specific case of a more
    general class of forgery attacks. The security notion that posits that forgeries
    should be impossible to find is unforgeability. It should also be impossible to
    recover the secret key from a list of tags; otherwise, attackers could forge tags
    using the key.


    What can an attacker do to break a MAC? In other words, what’s the attack model?
    The most basic attack model is the known-message attack, which passively collects
    messages and their associated tags (for example, by eavesdropping on a network).
    But real attackers can often launch active attacks because they can choose the
    messages to be authenticated and therefore get the MAC of the message they want.
    The standard model is thus chosen-message attacks, wherein attackers get tags
    for messages of their choice.'
