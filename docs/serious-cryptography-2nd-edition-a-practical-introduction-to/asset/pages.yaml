- pgno: 24
  md: '# How This Book Is Organized


    The book has 15 chapters, loosely split into four parts. The chapters are mostly
    independent from one another, except for Chapter 9, which lays the foundations
    for the three subsequent chapters. I recommend reading the first three chapters
    before anything else.


    # Part I: Fundamentals


    +   - **Chapter 1: Encryption** Introduces the notion of secure encryption, from
    weak pen-and-paper ciphers to strong, randomized encryption

    +   - **Chapter 2: Randomness** Describes how a pseudorandom generator works,
    what it takes for one to be secure, and how to use one securely

    +   - **Chapter 3: Cryptographic Security** Discusses theoretical and practical
    notions of security and compares provable security with probable security


    # Part II: Symmetric Crypto


    +   - **Chapter 4: Block Ciphers** Deals with ciphers that process messages block
    per block, focusing on the most famous one, the Advanced Encryption Standard (AES)

    +   - **Chapter 5: Stream Ciphers** Presents ciphers that produce a stream of
    random-looking bits that are XORed with messages to be encrypted

    +   - **Chapter 6: Hash Functions** Discusses the only algorithms that don''t
    work with a secret key, which turn out to be the most ubiquitous crypto building
    blocks

    +   - **Chapter 7: Keyed Hashing** Explains what happens if you combine a hash
    function with a secret key and how this serves to authenticate messages

    +   - **Chapter 8: Authenticated Encryption** Shows how some algorithms can both
    encrypt and authenticate a message, with examples such as the standard AES-GCM


    # Part III: Asymmetric Crypto


    +   - **Chapter 9: Hard Problems** Lays out the fundamental concepts behind public-key
    encryption, using notions from computational complexity

    +   - **Chapter 10: RSA** Leverages the factoring problem in order to build secure
    encryption and signature schemes with a simple arithmetic operation

    +   - **Chapter 11: Diffie–Hellman** Extends asymmetric cryptography to the notion
    of key agreement, wherein two parties establish a secret value using only nonsecret
    values

    +   - **Chapter 12: Elliptic Curves** Provides a gentle introduction to elliptic
    curve cryptography, which is the fastest kind of asymmetric cryptography'
