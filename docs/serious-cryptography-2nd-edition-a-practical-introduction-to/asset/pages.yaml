- pgno: 128
  md: 'Our 2^52 attack cost estimate is inaccurate for another reason. In fact, each
    of the 2^52 operations (testing a key candidate) takes about four times as many
    clock cycles as does testing a key in a brute-force attack. The upshot is that
    the real cost of this particular attack is closer to 4 × 2^52 = 2^54 operations
    when compared to a brute-force attack.


    The guess-and-determine attack on A5/1 can decrypt encrypted mobile communications,
    but it takes a couple of hours to recover the key when run on a cluster of dedicated
    hardware devices. In other words, it''s nowhere near real-time decryption. For
    that, we have another type of attack.


    # Brutal Attacks


    The time-memory trade-off (TMTO) attack is the brutal attack on A5/1. This attack
    doesn''t care about A5/1''s internals; it cares only that its state is 64 bits
    long. The TMTO attack sees A5/1 as a black box that takes in a 64-bit value (the
    state) and spits out a 64-bit value (the first 64 keystream bits).


    The idea behind the attack is to reduce the cost of a brute-force search in exchange
    for using a lot of memory. The simplest type of TMTO is a type of codebook attack,
    wherein you precompute a table of 2^64 elements containing a combination of key
    and value pairs (key:value) and store the output value for each of the 2^64 possible
    keys. To use this precomputed table for the attack, simply collect the output
    of an A5/1 instance and then look up in the table which key corresponds to that
    output. The attack itself is fast—taking only the amount of time necessary to
    look up a value in memory—but the creation of the table takes 2^64 computations
    of A5/1. Worse, codebook attacks require an insane amount of memory: 2^64 × (64
    + 64) bits, which is 2^68 bytes or 256 exabytes. That''s dozens of data centers,
    so we can forget about it.


    TMTO attacks reduce the memory requirements of codebook attacks at the price of
    increased computation during the online phase of the attack. The smaller the table,
    the more computations required to crack a key. Regardless, it costs about 2^64
    operations to prepare the table, but that needs to be done only once.


    In 2010, researchers took about two months to generate two terabytes'' worth of
    tables, using graphics processing units (GPUs) and running 100,000 instances of
    A5/1 in parallel. With the help of such large tables, calls encrypted with A5/1
    could be decrypted almost in real time. Telecommunication operators have implemented
    workarounds to mitigate the attack, but a real solution came with the 3G and 4G
    mobile telephony standards, which ditched A5/1 altogether.


    # Software-Oriented Stream Ciphers


    Software stream ciphers work with bytes or 32- or 64-bit words instead of individual
    bits, which proves to be more efficient on modern CPUs where instructions can
    perform arithmetic operations on a word in the same amount of time as on a bit.
    Software stream ciphers are therefore better suited than'
