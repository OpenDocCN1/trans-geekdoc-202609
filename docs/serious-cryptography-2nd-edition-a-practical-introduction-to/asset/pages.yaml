  md: 'of both probabilities is equal to 1/2 + 1/2 = 1, because the coin will fall
    on one of its two faces.


    A *uniform distribution* occurs when all probabilities in the distribution are
    equal, meaning that all outcomes are equally likely to occur. If there are N events,
    then each event has probability 1/N. For example, if a 128-bit key is picked uniformly
    at random—that is, according to a uniform distribution—then each of the 2^128
    possible keys should have a probability of 1/2^128.


    In contrast, when a distribution is *nonuniform*, probabilities aren''t all equal.
    A coin toss with a nonuniform distribution is said to be biased and may yield
    heads with probability 1/4 and tails with probability 3/4, for example.


    > **NOTE**

    > *It''s possible to cheat with a loaded die, preventing the probabilities of
    each of the six faces to be 1/6; however, one can''t bias a coin. Coin tosses
    can be biased only if “the coin is allowed to bounce or be spun rather than simply
    flipped in the air,” as described in the article “You Can Load a Die but You Can’t
    Bias a Coin” (available at https://www.stat.berkeley.edu/~nolan/Papers/dice.pdf).*


    # Entropy: A Measure of Uncertainty


    *Entropy* is the measure of uncertainty, or disorder, in a system. The higher
    the entropy, the less certainty found in the result of a randomized process.


    We can compute the entropy of a probability distribution. If your distribution
    consists of probabilities p₁, p₂, . . . , p_N, then its entropy is the negative
    sum of all probabilities multiplied by their logarithm, as shown in this expression:


    -p₁ × log(p₁) - p₂ × log(p₂) - . . . p_N × log(p_N)


    Here the function *log* is the *binary logarithm*, or logarithm in base two. Unlike
    the natural logarithm, the binary logarithm expresses the information in bits
    and yields integer values when probabilities are powers of two. For example, log(1/2)
    = -1, log(1/4) = -2, and more generally log(1/2^n) = -n. (We actually take the
    *negative sum* to end up with a positive number.) Random 128-bit keys produced
    using a uniform distribution therefore have the following entropy:


    2^128 × (-2^-128 × log(2^-128)) = -log(2^-128) = 128 bits


    If you replace 128 with any integer n, the entropy of a uniformly distributed
    n-bit string will be n bits.


    Entropy is maximized when the distribution is uniform because a uniform distribution
    maximizes uncertainty: no outcome is more likely than the others. Therefore, n-bit
    values can''t have more than n bits of entropy.'
