- pgno: 137
  md: 'After four rounds, differences look random to a human observer, and they are
    also almost random statistically as well:


    ```

    ```text

    d93bed6d a267bf47 760c2f9f 4a41d54b

    0e03d792 7340e010 119e6a00 e90186af

    7fa9617e b6aca0d7 4f6e9a4a 56b434fd

    98be796d 64908d32 4897f7ca ab84a2df

    ```

    ```


    After only four rounds, a single difference propagates to most of the bits in
    the 512-bit state. In cryptography, we call this *full diffusion*.


    Not only do differences propagate across all states, they also do so according
    to complex equations that make future differences hard to predict because highly
    *nonlinear* relations drive the state’s evolution, thanks to the mix of XOR, addition,
    and rotation. If we used only XORs, we’d still have many differences propagating,
    but the process would be linear and therefore insecure.


    # Attacking Salsa20/8


    Salsa20 makes 20 rounds by default, but we sometimes use it with only 12 rounds,
    in a version called Salsa20/12, to make it faster. Although Salsa20/12 uses eight
    fewer rounds than Salsa20, it’s in practice as reliable as the 20-round version,
    according to the state-of-the-art research progress. Even Salsa20/8, with only
    eight rounds, is known to be only theoretically weaker but as solid in practice
    as Salsa20.


    Breaking Salsa20 should ideally take 2^256 operations, thanks to its use of a
    256-bit key. If one can recover the key by performing fewer than 2^256 operations,
    the cipher is in theory broken. That’s exactly the case with Salsa20/8.


    The attack on Salsa20/8 (published in the 2008 paper “New Features of Latin Dances:
    Analysis of Salsa, ChaCha, and Rumba,” of which I’m a co-author and for which
    we won a cryptanalysis prize from Daniel J. Bernstein) exploits a statistical
    bias in Salsa’s core algorithm after four rounds to recover the key of eight-round
    Salsa20. In reality, this is mostly a theoretical attack: we estimate its complexity
    at 2^251 operations of the core function—infeasible, like any computation of,
    say, 2^100 operations or more, but less so than breaking the expected 2^256 complexity.


    The attack exploits not only a bias over the first four rounds of Salsa20/8 but
    also a property of the last four rounds: knowing the nonce, N, and the counter,
    Ctr (refer to Figure 5-10), the only value needed to invert the computation from
    the keystream back to the initial state is the key, K. But as Figure 5-13 shows,
    if you know only some part of K, you can partially invert the computation up until
    the fourth round and observe some bits of that intermediate state—including the
    biased bit! You’ll observe the bias only if you have the correct guess of the
    partial key; hence, the bias serves as an indicator that you’ve got the correct
    key.'
