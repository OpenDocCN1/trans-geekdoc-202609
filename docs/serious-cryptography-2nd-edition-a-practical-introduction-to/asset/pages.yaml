- pgno: 6
  md: '# About the Author


    JP Aumasson has been developing, researching, and breaking cryptography since
    2006. He’s at the origin of the widely used crypto algorithms BLAKE2, BLAKE3,
    and SipHash, and he organized the Password Hashing Competition that led to the
    Argon2 standard. JP’s career spans academia, where he earned a PhD from EPFL;
    the pay-TV security industry; and roles as a security consultant for both private-
    and public-sector clients. He’s currently co-founder and chief security officer
    at Taurus SA, a global fintech company based in Geneva that assists financial
    institutions in safeguarding and managing their digital assets.


    # About the Technical Reviewer


    Pascal Junod is a cryptographer with more than 20 years of academic and industrial
    experience in designing, implementing, auditing, breaking, writing, and speaking
    about real-world cryptographic and cybersecurity systems. His main fields of interest
    include industrial cryptography, software protection, and reverse engineering.
    He also enjoys trail running, playing the accordion, and taking care of his family.'
