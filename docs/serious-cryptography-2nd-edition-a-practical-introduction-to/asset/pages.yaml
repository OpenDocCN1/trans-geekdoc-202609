  md: "![](img/ace4de942d037de8ea5835bc9fbe57cd_46_0.png)\n\nThe tag ensures the *integrity*\
    \ of the message and serves as evidence that the ciphertext received is identical\
    \ to the one sent in the first place by a legitimate party that knows the key\
    \ *K*. When *K* is shared with only one other party, the tag also guarantees that\
    \ the message was sent by that party; that is, it implicitly *authenticates* the\
    \ expected sender as the actual creator of the message.\n\n> > **NOTE**  \n> >\
    \ I use “creator” rather than “sender” here because an eavesdropper can record\
    \ some (C, T) pairs sent by party A to party B and then send them again to B,\
    \ pretending to be A. This is called a replay attack, and it can be prevented—for\
    \ example, by including a counter number in the message. When a message is decrypted,\
    \ its counter *i* increases by one: *i* + 1. In this way, one could check the\
    \ counter to see if a message has been sent twice, indicating that an attacker\
    \ is attempting a replay attack by resending the message. This also enables the\
    \ detection of lost messages.\n\n*Authenticated encryption with associated data\
    \ (AEAD)* is an extension of authenticated encryption that takes some cleartext\
    \ and unencrypted data and uses it to generate the authentication tag **AEAD**(*K*,\
    \ P, A) = (C, A, T). A typical application of AEAD protects protocols’ datagrams\
    \ with a cleartext header and an encrypted payload. In such cases, at least some\
    \ header data has to remain in the clear; for example, destination addresses need\
    \ to be clear to route network packets.\n\nFor more on authenticated encryption,\
    \ jump to Chapter 8.\n\n# Format-Preserving Encryption\n\nA basic cipher takes\
    \ bits and returns bits; it doesn’t care whether bits represent text, an image,\
    \ or a PDF document. The ciphertext may in turn be encoded as raw bytes, hexadecimal\
    \ characters, base64, and other formats. But what if you need the ciphertext to\
    \ have the same format as the plaintext, as is sometimes required by database\
    \ systems that can record data only in a prescribed format?\n\n*Format-preserving\
    \ encryption (FPE)* solves this problem. It can create ciphertexts that have the\
    \ same format as the plaintext. For example, FPE can encrypt IP addresses to IP\
