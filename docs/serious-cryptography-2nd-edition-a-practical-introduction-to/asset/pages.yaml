- pgno: 140
  md: 'Things go south when i = j. Instead of leaving the state unchanged, the XOR
    swap sets S[i] to S[i] ⊕ S[i] = 0. In effect, a byte of the state is set to zero
    each time i equals j in the key schedule or during encryption, ultimately leading
    to an all-zero state and thus to an all-zero keystream. For example, after processing
    68KB of data, most of the bytes in the 256-byte state are zero, and the output
    keystream looks like this:


    ```

    00 00 00 00 00 00 00 53 53 00 00 00 00 00 00 00 00 00 00 13 13 00 5c 00 a5 00
    00 …

    ```


    The lesson here is to refrain from over-optimizing your crypto implementations.
    Clarity and confidence always trump performance in cryptography.


    # Weak Ciphers Baked into Hardware


    When a cryptosystem fails to be secure, some systems quickly respond by silently
    updating the affected software remotely (as with web applications) or by releasing
    a new version and prompting the users to upgrade (as with mobile applications).
    Other systems aren''t so lucky and need to stick to the compromised cryptosystem
    for a while before upgrading to a secure version, as is the case with certain
    satellite phones.


    In the early 2000s, US and European telecommunication standardization institutes
    (TIA and ETSI) jointly developed two standards for satellite phone (satphone)
    communications. Satphones are like mobile phones, except that their signal goes
    through satellites rather than terrestrial stations. The advantage is that you
    can use them pretty much everywhere in the world, as long as you have satellite
    coverage. Their downsides are the price, quality, latency, and, as it turns out,
    security.


    GMR-1 and GMR-2 are the two satphone standards adopted by most commercial vendors,
    such as Thuraya and Inmarsat. Both include stream ciphers to encrypt voice communications.
    GMR-1''s cipher is hardware oriented, with a combination of four LFSRs, similar
    to A5/2, the deliberately insecure cipher in the 2G mobile standard aimed at non-Western
    countries. GMR-2''s cipher is software oriented, with an 8-byte state and the
    use of S-boxes. Both stream ciphers are insecure and protect users only against
    amateurs, not against state agencies.


    This story reminds us that stream ciphers used to be easier to break than block
    ciphers and that they''re easier to sabotage. Why? Well, if you design a weak
    stream cipher on purpose, when you find the flaw, you can still blame it on the
    weakness of stream ciphers and deny any malicious intent.


    # Further Reading


    To learn more about stream ciphers, begin with the archives of the eSTREAM competition
    at https://www.ecrypt.eu.org/stream/project.html, where you''ll find hundreds
    of papers on stream ciphers, including details of more than 30 candidates and
    many attacks. Some of the most interesting attacks are the'
