- pgno: 222
  md: '# 10


    # RSA


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_222_0.png)


    The Rivest–Shamir–Adleman (RSA) crypto-system revolutionized cryptography when
    it emerged in 1977 as the first public-key encryption scheme. Whereas classical,
    symmetric-key encryption schemes use the same secret key to encrypt and decrypt
    messages, *public-key encryption* (or *asymmetric encryption*) uses two keys:
    a public key, which anyone who wants to encrypt messages for you can use, and
    a private key, which is required to decrypt messages encrypted using the public
    key. This magic is the reason why RSA was a real breakthrough, and 40 years later,
    it’s still the paragon of public-key encryption and a workhorse of internet security.
    (One year prior to RSA, Whitfield Diffie and Martin Hellman introduced the concept
    of public-key cryptography, but their scheme was able to perform key distribution
    only in a public-key setting.)'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'RSA works by creating a *trapdoor permutation*, a function that transforms
    a number *x* to a number *y* in the same range, such that computing *y* from *x*
    is easy using the public key, but computing *x* from *y* is practically impossible
    unless you know the private key—the trapdoor. (Think of *x* as a plaintext and
    *y* as a ciphertext.)


    In addition to encryption, you can also use RSA to build digital signatures, wherein
    only the owner of the private key is able to sign a message, and the public key
    enables anyone to verify the signature’s validity.


    In this chapter, you’ll learn how the RSA trapdoor permutation works and why this
    permutation alone isn’t enough to build *secure* encryption and signatures. I
    also discuss RSA’s security relative to the factoring problem (see Chapter 9),
    ways to implement RSA securely, and how to attack it.


    We begin with an explanation of the basic mathematical notions behind RSA.


    # The Math Behind RSA


    When processing a message, whether encrypting or signing it, RSA first creates
    a big number from that message and processes it by performing multiplications
    between big numbers. Therefore, to understand how RSA works, you need to know
    what kind of big numbers it manipulates and how multiplication works on those
    numbers.


    To encrypt or sign, RSA transforms a positive integer between 1 and *n* − 1, where
    *n* is a large number called the *modulus*. Such numbers, when multiplied together,
    yield another number that satisfies these criteria. These numbers form a group,
    which you denote \(Z_n^*\) and call the multiplicative group of integers modulo
    *n*. (See the mathematical definition of a group in “Groups” on page 189.)


    For example, consider the group \(Z_4^*\) of integers modulo 4. Recall from Chapter
    9 that a group must include an identity element (that is, 1) and that each number
    *x* in the group must have an inverse, a number *y* such that *x* × *y* = 1. How
    do you determine the set that makes up \(Z_4^*\)? Based on the definitions, you
    know that 0 is not in the group \(Z_4^*\) because multiplying any number by 0
    can never give 1, so 0 has no inverse. The number 1 belongs to \(Z_4^*\) because
    1 × 1 = 1, so 1 is its own inverse. However, the number 2 doesn’t belong in this
    group because you can’t obtain 1 by multiplying 2 with another element of \(Z_4^*\)
    (note that 2 isn’t coprime with 4, because 4 and 2 share the factor of 2). The
    number 3 belongs in the group \(Z_4^*\) because it is its own inverse within \(Z_4^*\).
    Thus, you have \(Z_4^* = \{1, 3\}\).


    Now consider \(Z_5^*\), the multiplicative group of integers modulo 5. As in Chapter
    9, \(Z_5^* = \{1, 2, 3, 4\}\). Indeed, 5 being prime, 1, 2, 3, and 4 are all coprime
    with 5, so the set of \(Z_5^*\) includes all of them. Let’s verify this: 2 × 3
    mod 5 = 1; therefore, 2 is 3’s inverse, and 3 is 2’s inverse; note that 4 is its
    own inverse because 4 × 4 mod 5 = 1; and finally, 1 is again its own inverse in
    the group.


    To find the number of elements in a group \(Z_n^*\) when *n* isn’t prime, you
    can use *Euler’s totient function*, which we write as φ(*n*), with φ representing'
