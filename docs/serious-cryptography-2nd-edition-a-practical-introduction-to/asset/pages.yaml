- pgno: 346
  md: '# Secret-Sharing Techniques


    A key ingredient of threshold signatures is *secret-sharing* protocols, or techniques
    that split a secret into multiple pieces (*shares*) distributed to different parties
    in a way that the parties can then jointly recompute the initial secret. Secret-sharing
    protocols can notably be used when creating backups of private keys such that
    different parties store different shares in different locations.


    # Additive Sharing


    The simplest way to share a secret that you see as a number is through *additive
    sharing*: given a number s, you share it as n values s₁, s₂, . . . , sₙ such that
    s₁ + s₂ + . . . + sₙ = s. For example, if you work with numbers modulo 100, you
    could create a random additive sharing of the number s = 47 into four shares as
    follows: pick three random numbers between 0 and 99, say s₁ = 12, s₂ = 94, and
    s₃ = 80, and set s₄ = s − s₁ − s₂ − s₃ = 61. (Note that subtraction is computed
    modulo 100, such that −1 = 99, −2 = 98, and so on.)


    This approach is very simple but requires using all the shares to recover the
    original secret.


    # Threshold Sharing


    Threshold sharing is closer to what threshold signatures do: given parameters
    n and t < n and the secret s, it creates shares such that you can recover the
    secret using any set of t shares out of the n created.


    The best-known threshold sharing method is *Shamir''s secret sharing*, which leverages
    the following property of polynomials: given a polynomial of degree t of the form


    $f(x) = a_0 + a_1 x + a_2 x^2 + a_3 x^3 + \dots + a_t x^t$


    you need the result of only t + 1 evaluations of f(x) on t + 1 distinct values
    of x to determine all aᵢ coefficients, which are fixed values.


    To create a threshold secret sharing from this property, set a₀ = s, the secret.
    Then pick random values of a₁ to aₜ and compute f(x) for n distinct values of
    x, which will be the n shares of the secret.


    Recomputing the coefficients from the f(x) values is a technique called *Lagrange
    interpolation*, from the 18th-century Italian mathematician who developed a general
    method to determine the equation of a curve given a list of points on that curve.
    Indeed, you can view the problem geometrically. If the equation has degree 1 (and
    is of the form a₀ + a₁x), then it''s the equation of a line, and knowing two points
    on a line is sufficient to uniquely identify the line. Likewise, if the equation
    has degree 2 (of the form a₀ + a₁x + a₂x²), then the curve is a parabola, whose
    equation can be determined with three points.


    We sometimes find implementations of Shamir''s secret sharing defining a function
    **Lagrange()** that computes the interpolation and returns the a₀ coefficient,
    which is the shared secret. If you have values of f(x) to combine'
