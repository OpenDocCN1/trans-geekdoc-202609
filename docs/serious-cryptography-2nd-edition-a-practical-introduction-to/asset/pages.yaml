- pgno: 39
  md: '# Encryption Security


    Classical ciphers aren’t secure, but a perfectly secure cipher like the one-time
    pad is impractical. We’ll thus have to give a little in terms of security if we
    want secure and usable ciphers. But what does secure really mean, besides the
    obvious and informal “eavesdroppers can’t decrypt secure messages”?


    A cipher is secure if, even given a large number of plaintext–ciphertext pairs,
    nothing can be learned about the cipher’s behavior when applied to other plaintexts
    or ciphertexts. This opens up new questions:


    +   - How does an attacker come by these pairs? How large is a “large number”?
    This is all defined by attack models, assumptions about what the attacker can
    and cannot do.

    +   - What could be “learned,” and what “cipher’s behavior” are we talking about?
    This is defined by security goals, descriptions of what is considered a successful
    attack.


    Attack models and security goals must go together; you can’t claim that a system
    is secure without explaining against whom or from what it’s safe. A security notion
    is the combination of a security goal with an attack model. We’ll say that a cipher
    achieves a certain security notion if any attacker working in a given model can’t
    break the security goal.


    # Attack Models


    An attack model is a set of assumptions about how attackers might interact with
    a cipher and what they can and can’t do. The goals of an attack model are as follows:


    +   - To set requirements for cryptographers who design ciphers so that they know
    what attackers and what kinds of attacks to protect against.

    +   - To give guidelines to users about whether a cipher will be safe to use in
    their environment.

    +   - To provide clues for cryptanalysts who attempt to break ciphers so they
    know whether a given attack is valid. An attack is valid only if it’s doable in
    the model considered.


    Attack models don’t need to match reality exactly; they’re an approximation. As
    the statistician George E. P. Box put it, “All models are wrong; the practical
    question is how wrong do they have to be to not be useful.” To be useful in cryptography,
    attack models should at least encompass what attackers can actually do to attack
    a cipher. It’s beneficial if a model overestimates attackers’ capabilities because
    it helps anticipate future attack techniques—only the paranoid cryptographers
    survive. A bad model underestimates attackers and provides false confidence in
    a cipher by making it seem secure in theory when it’s not secure in reality.'
  merge: -1
