- pgno: 178
  md: 'that Poly1305-AES is 128-bit secure as long as AES is a secure block cipher—
    and everything is implemented correctly, as with any cryptographic algorithm.


    You can combine the Poly1305 universal hash with algorithms other than AES. For
    example, Poly1305 was used with the stream cipher ChaCha (see RFC 7539, “ChaCha20
    and Poly1305 for IETF Protocols”). There’s no doubt that Poly1305 will continue
    being used wherever a fast MAC is needed.


    Although Poly1305 is fast and secure, it has several downsides. For one, its polynomial
    evaluation is difficult to implement efficiently, especially in the hands of those
    unfamiliar with the associated mathematical notions. (See examples at https://github.com/floodyberry/poly1305-donna.)
    Second, on its own, it’s secure for only one message unless you use the Wegman-Carter
    construction. But in that case it requires a nonce, and if the nonce is repeated,
    the algorithm becomes insecure. Finally, Poly1305 is optimized for long messages,
    but it’s overkill if you process only small messages (say, fewer than 128 bytes).
    In such cases, SipHash is a good solution.


    # SipHash


    I designed SipHash in 2012 with Dan Bernstein initially to address a non-cryptographic
    problem: denial-of-service attacks on hash tables. Hash tables are data structures,
    notably used in programming languages to efficiently store elements internally.
    Prior to SipHash, hash tables relied on noncryptographic keyed hash functions
    for which collisions were often easy to find, which could be exploited to slow
    down the system and perform denial-of-service attacks. We observed that a PRF
    would address this problem and set out to design SipHash, a PRF suitable for hash
    tables. Because hash tables process mostly short inputs, SipHash is optimized
    for short messages. SipHash is a full-blown PRF and MAC that shines where most
    inputs are short.


    SipHash uses a trick that makes it more secure than basic sponge functions: instead
    of XORing message blocks only once before the permutation, SipHash XORs them before
    and after the permutation, as Figure 7-5 illustrates. The 128-bit key of SipHash
    is seen as two 64-bit words, K₁ and K₂, XORed to a 256-bit fixed initial state
    that’s seen as four 64-bit words. Next, the keys are discarded, and computing
    SipHash boils down to iterating through a core function called SipRound and then
    XORing message chunks to modify the four-word internal state. Finally, SipHash
    returns a 64-bit tag by XORing the four-state words together.'
