  md: '# 15


    # CRYPTOCURRENCY

    CRYPTOGRAPHY


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_322_0.png)


    This chapter wasn’t in the initial edition of this book when it came out in fall
    2017, a period when cryptocurrency and blockchain were at peak hype. While blockchain
    hasn’t quite lived up to its promises of disrupting several industries, it has
    profoundly influenced cryptographic research and engineering. Blockchain applications
    have brought new exciting problems, attracted fresh talent, and offered a novel
    way to bridge theory and practice.


    Before “crypto” became synonymous with cryptocurrency, cryptographic algorithms
    and protocols largely pertained to standard functionalities such as encryption
    and secure channels. The more arcane protocols were restricted to niche research
    areas and technical articles, typically catering to researchers’ interests and
    presented only in academic'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'conferences. New algorithms were predominantly crafted by academic researchers
    and would see real-world deployment, if ever, after at least five years of peer
    review and analysis and after numerous research papers detailing unsuccessful
    cryptanalysis attempts.


    Blockchain turned that process upside down. Much like how the cryptographic protocols
    of Signal and Tor sidestepped the conventional academic route, blockchain enthusiasts
    were less bound by tradition. Groundbreaking protocols often debuted in blog posts
    or informal white papers, with implementation following shortly after. Occasionally,
    they’d forgo written specifications altogether, letting the code speak for itself.
    Only after widespread adoption would academia take notice. The most notable case
    is the Bitcoin protocol, which didn’t undergo formal peer review before being
    deployed.


    Many seasoned researchers identified novel challenges within the blockchain domain,
    often collaborating directly with blockchain entities. They developed complex
    protocols that not only pushed boundaries and garnered peer recognition but also
    saw rapid real-world implementation, impacting thousands, if not millions, of
    systems. Prime instances include efficient ECDSA threshold signature schemes and
    zero-knowledge proof systems. In some scenarios, existing protocols with little
    practical use found impactful use cases, such as Boneh–Lynn–Shacham (BLS) signatures.


    This chapter provides an overview of these cryptographic algorithms and protocols—those
    tailored for blockchain and those that thrived due to it. I won’t delve into defining
    blockchain or its workings, as there are myriad online resources. Instead, I emphasize
    the cryptographic schemes underpinning blockchains, which hold significance irrespective
    of the blockchain use cases. Even if you remain skeptical of the blockchain phenomenon,
    I trust you’ll find this chapter enlightening.


    # Hashing Applications


    Hash functions, the Swiss Army knives of cryptography, serve numerous applications
    in blockchain systems, including:


    # Hashing a transaction’s data


    Hash functions can produce a digest signed by the transaction’s issuer, typically
    with ECDSA-secp256k1 or Ed25519. Verifying the signature ensures that the owner
    of a given address approved of the information hashed, leading to including the
    transaction in the chain’s ledger.


    In the blockchain Ethereum, a transaction’s hash serves as its unique identifier;
    for example, you can enter a hash in the search field of https://etherscan.io
    to retrieve the associated transaction. Ethereum transaction hashes use Keccak-256—which
    is similar but not identical to SHA3-256—and process-encoded data. This data includes
    the recipient’s address, the amount of ether (ticker ETH) sent, any smart contract
    input, the gas price and limit, a nonce (increasing for each new transaction),
    and a signature of the transaction.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Hashing the content of a block


    Hash functions can include the digest in the subsequent block to “chain” the blocks.
    For example, each Bitcoin block has a block header that includes the previous
    block’s hash, a tree hash of the recorded transactions, and some metadata (version,
    timestamp, nonce, and so on). Bitcoin computes the previous block’s hash by hashing
    the header of the previous block using double SHA-256, or SHA-256(SHA-256(block
    header)). This unorthodox construction eliminates the risk of length extension
    attacks and adds a safety net in case SHA-256 was found to be insecure—which is
    unlikely.


    Aside from these basic use cases, hash functions are the main building block in
    key components of blockchain systems.


    # Merkle Trees


    Merkle trees are a type of hash tree, which is a data structure computing a root
    value from leaf values according to a tree pattern. In hash trees, the parent
    node is computed by hashing the child nodes. Merkle trees are, for example, used
    to create a Bitcoin block’s header. They’re named after computer scientist Ralph
    Merkle, whose 1979 cryptographic scheme construction used binary hash trees.


    # Tree Hashing Computation


    A Merkle tree takes as input values that constitute its leaves—that is, the values
    from which the root (the output) is computed. You generally represent data structure
    trees with their root at the top and leaves at the bottom.


    For example, Figure 15-1 shows a Merkle tree hashing four values (A, B, C, D).


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_324_0.png)


    Figure 15-1: A hash tree, where the leaves are the input and the root is the output'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The tree hashing then works as follows:


    +   - Hashing each of the four values to obtain the four hashes H(A), H(B), H(C),
    and H(D).

    +   - Hashing together each consecutive pair of hashes to obtain H(H(A) || H(B))
    and H(H(C) || H(D)). Here you concatenate the hash values (as the || symbol denotes).

    +   - Hashing the two hashes together to obtain the root of the tree, which is
    the final output of the tree hashing: H(H(H(A) || H(B)) || H(H(C) || H(D))).


    If you omit the initial hashing of the input values—which is necessary only if
    the values aren''t already the size of the hash—you go from four values to one
    with a tree of two layers, or of height two. Note that while the input data may
    be a different size, all hash values are the same size. Generally, a tree of n
    layers has 2^n leaves, allowing you to process up to 2^n values by computing 2^n
    − 1 hashes from the (hashed) leaves.


    If the number of input values isn''t exactly 2^n for some integer n, a common
    technique is to add dummy values (for example, set to zero or to the last value
    in the list); the padding rule should, however, be carefully chosen to avoid trivial
    collisions.


    # Merkle Proofs


    A Merkle tree''s structure can be leveraged to prove that a given value belongs
    to the list of 2^n values hashed without recomputing the whole tree (which takes
    on the order of 2^n operations) but only in time proportional to the height of
    the tree—that is, its number of layers n. Depending on the context, such proofs
    are called a membership path, an inclusion proof, or a Merkle proof. This is a
    Merkle tree''s killer feature, which general-purpose hash functions don''t offer.


    Figure 15-2 shows how this works. The shaded cells are the values sufficient to
    prove that V_1 is one of the values hashed to obtain the root.'
