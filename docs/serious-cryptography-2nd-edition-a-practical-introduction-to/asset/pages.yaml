    # Attack Models for Key Agreement Protocols


    There is no single definition of security for key agreement protocols, and a key
    protocol is never completely secure without context and without considering the
    attack model and the security goals. You can, for example, argue that the previous
    4G/5G protocol is secure because a passive attacker won’t find the session keys,
    but it’s also insecure because once the key K leaks, this compromises all previous
    and future communications.


    There are different notions of security in key agreement protocols as well as
    three main attack models that depend on the information the protocol leaks. From
    weakest to strongest, these are the *network attacker*, the *data leak*, and the
    *breach*:


    **The network attacker**  This attacker observes the messages exchanged between
    the two legitimate parties running a key agreement protocol and can record, modify,
    drop, or inject messages. To protect against such an attacker, a key agreement
    protocol must not leak any information on the established shared secret.


    **The data leak**  In this model, the attacker acquires the session key and all
    *temporary* secrets (such as SK in the telecom protocol example) from one or more
    executions of the protocol, but not the long-term secrets (like K in that same
    protocol).


    **The breach (or corruption)**  In this model, the attacker learns the long-term
    key of one or more of the parties. Once a breach occurs, security is no longer
    attainable because the attacker can impersonate one or both parties in subsequent
    sessions of the protocol, as it’s the only piece of information that identifies
    a party (at least in theory, since in practice mechanisms such as IP whitelisting
    can reduce the risk of impersonation). Nonetheless, the attacker shouldn’t be
    able to recover secrets from sessions executed before gathering the key.


