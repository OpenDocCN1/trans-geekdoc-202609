- pgno: 163
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_163_0.png)


    Figure 6-9: The length-extension attack


    Basically, if you know **Hash**(M) for some *unknown* message, M, composed of
    blocks M₁ and M₂ (after padding), you can determine **Hash**(M₁ || M₂ || M₃) for
    any block, M₃. Because the hash of M₁ || M₂ is the chaining value that follows
    immediately after M₂, you can add another block, M₃, to the hashed message, even
    though you don’t know the data that was hashed. What’s more, this trick generalizes
    to any number of blocks in the unknown message (M₁ || M₂ here) or in the suffix
    (M₃).


    The length-extension attack won’t affect most applications of hash functions,
    but it can compromise security if using the hash a bit too creatively. Unfortunately,
    SHA-2 hash functions are vulnerable to the length-extension attack, even though
    the NSA designed the functions and NIST standardized them while both were well
    aware of the flaw. This flaw could have been avoided simply by making the last
    compression function call different from all others (for example, by taking a
    1 bit as an extra parameter while the previous calls take a 0 bit). That is what
    BLAKE2 does.


    # Fooling Proof-of-Storage Protocols


    Cloud computing applications use hash functions within *proof-of-storage* protocols—that
    is, protocols where a server (the cloud provider) proves to a client (a user of
    a cloud storage service) that the server does in fact store the files that it’s
    supposed to store on behalf of the client.


    In 2007, the paper “SafeStore: A Durable and Practical Storage System” (https://www.cs.utexas.edu/~lorenzo/papers/p129-kotla.pdf)
    by Ramakrishna Kotla, Lorenzo Alvisi, and Mike Dahlin proposed a proof-of-storage
    protocol to verify the storage of some file, M, as follows:


    +   1. The client picks a random value, C, as a *challenge*.

    +   2. The server computes **Hash**(M || C) as a *response* and sends the result
    to the client.

    +   3. The client also computes **Hash**(M || C) and checks that it matches the
    value received from the server.


    The premise of the paper is that the server shouldn’t be able to fool the client
    because if the server doesn’t know M, it can’t guess **Hash**(M || C). But there’s
    a catch: in reality, **Hash** is an iterated hash that processes its input block
    by block, computing intermediate chaining values between each block. For example,
    if **Hash** is SHA-256 and M is 512 bits long (the size of a block in SHA-256),
    the server can cheat. How? The first time the'
  merge: -1
