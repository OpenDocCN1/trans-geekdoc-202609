    # Linearity Insecurity


    We call an XOR combination of bits a *linear combination*. For example, if X,
    Y, and Z are bits, then the expression X ⊕ Y ⊕ Z is a linear combination, whereas
    (X ∧ Y) ⊕ Z is not because there''s an AND (∧). If you flip a bit of X in X ⊕
    Y ⊕ Z, then the result changes as well, regardless of Y''s and Z''s values. In
    contrast, if you flip a bit of X in (X ∧ Y) ⊕ Z, the result changes only if Y''s
    bit at the same position is 1. The upshot is that linear combinations are predictable
    because you don''t need to know the value of the bits in order to predict how
    a change in their value will affect the result.


    For comparison, if the MT algorithm were cryptographically strong, its equations
    would be *nonlinear* and would involve not only single bits but also AND combinations
    (*products*) of bits, such as S₁S₁₅S₁₈₂ or S₁₇S₂₅₆S₂₅₇S₃₅₄S₄₉₈S₆₀₁. Although linear
    combinations of those bits include at most 624 variables, nonlinear combinations
    allow for up to 2⁶²⁴ variables. It would be impossible to solve, let alone write
    down, the whole of these equations. (Note that 2³⁰⁵, a much smaller number, is
    the estimated information capacity of the observable universe.)


    The key here is that linear transformations lead to short equations (comparable
    in size to the number of variables), which are easy to solve, whereas nonlinear
    transformations give rise to equations of exponential size, which are practically
    unsolvable. The game of cryptographers is thus to design PRNG algorithms that
    emulate such complex nonlinear transformations using only a small number of simple
    operations.


    > NOTE

    > Linearity is just one of many security criteria. Although necessary, nonlinearity
    alone does not make a PRNG cryptographically secure.


    # The Uselessness of Statistical Tests


    Statistical test suites like TestU01, Diehard, or the National Institute of Standards
    and Technology (NIST) test suite are one way to test the quality of pseudorandom
    bits. These tests take a sample of pseudorandom bits produced by a PRNG (say,
    1MB''s worth), compute some statistics on the distribution of certain patterns
    in the bits, and compare the results with the typical results obtained for a uniform
    distribution. For example, some tests count the number of 1 bits versus the number
    of 0 bits, or the distribution of 8-bit patterns. But statistical tests are largely
    irrelevant to cryptographic security, and it''s possible to design a cryptographically
    weak PRNG that fools any statistical test.


    When you run statistical tests on randomly generated data, you will usually see
    a bunch of statistical indicators as a result. These are typically *p*-values,
    a common statistical indicator. These results aren''t always easy to interpret
    because they''re rarely as simple as passed or failed. If your first results seem
    abnormal, don''t worry: they may be the result of some'
