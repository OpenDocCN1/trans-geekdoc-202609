- pgno: 126
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_126_0.png)


    Figure 5-9: The A5/1 cipher


    A5/1 uses LFSRs of 19, 22, and 23 bits, with the polynomials for each as follows:


    1 + X^14 + X^17 + X^18 + X^19

    1 + X^21 + X^22

    1 + X^8 + X^21 + X^22 + X^23


    How could this be seen as secure with only LFSRs and no NFSR? The trick lies in
    A5/1''s update mechanism. Instead of updating all three LFSRs at each clock cycle,
    the designers of A5/1 added a clocking rule that does the following:


    +   1. Checks the value of the 9th bit of LFSR 1, the 11th bit of LFSR 2, and
    the 11th bit of LFSR 3, called the clocking bits. Of those 3 bits, either all
    have the same value (1 or 0) or two have the same value.

    +   2. Clocks the registers whose clocking bits are equal to the majority value,
    0 or 1. Either two or three LFSRs are clocked at each update.


    Without this rule, A5/1 would provide no security whatsoever, and bypassing this
    rule is enough to break the cipher. However, that''s easier said than done, as
    you''ll see.


    > **NOTE** In A5/1''s irregular clocking rule, each register is clocked with a
    probability of 3/4 at any update. Namely, the probability that at least one other
    register has the same bit value is 1 – (1/2)^2, where (1/2)^2 is the chance that
    both of the other two registers have a different bit value.


    2G communications use A5/1 with a key of 64 bits and a 22-bit nonce, which changes
    for every new data frame. The initialization mechanism of'
