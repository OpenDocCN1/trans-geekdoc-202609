- pgno: 146
  md: "# Why Second-Preimage Resistance Is Weaker\n\nIf you can find first preimages,\
    \ then you can find second preimages as well (for the same hash function). As\
    \ proof, if the algorithm solve_preimage() returns a preimage of a given hash\
    \ value, use the algorithm in Listing 6-2 to find a second preimage of some message,\
    \ M.\n\n```\nsolve_second_preimage(M) {\n    H = Hash(M)\n    return solve_preimage(H)\n\
    }\n```\n\nListing 6-2: How to find second preimages if you can find first preimages\n\
    \nYou’ll find the second preimage by seeing it as a preimage problem and applying\
    \ the preimage attack. It follows that any second-preimage resistant hash function\
    \ is also preimage resistant. (Were it not, it wouldn’t be second preimage resistant\
    \ either, per the preceding solve_second_preimage() algorithm.) In other words,\
    \ the best attack you can use to find second preimages is almost identical to\
    \ the best attack you can use to find first preimages, unless the hash function\
    \ has some defect that allows for more efficient attacks. Also note that a preimage\
    \ search attack is fundamentally similar to a key-recovery attack on a block cipher\
    \ or stream cipher, except that in the case of encryption there is exactly one\
    \ solution of known size.\n\n# Collision Resistance\n\nWhatever hash function\
    \ you choose, collisions will inevitably exist because of the pigeonhole principle,\
    \ which posits that if you have m holes and n pigeons to put into those holes\
    \ and if n is greater than m, at least one hole must contain more than one pigeon.\n\
    \nNOTE You can generalize the pigeonhole principle to other items and containers.\
    \ For example, any 27-word sequence in the US Constitution includes at least two\
    \ words that start with the same letter. In the world of hash functions, holes\
    \ are the hash values, and pigeons are the messages. Because you know that there\
    \ are many more possible messages than hash values, collisions must exist.\n\n\
    However, despite the inevitable, collisions should be hard to find to consider\
    \ a hash function collision resistant—in other words, attackers shouldn’t be able\
    \ to find two distinct messages that hash to the same value.\n\nThe notion of\
    \ collision resistance relates to that of second-preimage resistance: if you can\
    \ find second preimages for a hash function, you can also find collisions, as\
    \ Listing 6-3 shows.\n\n```\nsolve_collision() {\n    M = random_message()\n \
    \   return (M, solve_second_preimage(M))\n}\n```\n\nListing 6-3: The naive collision\
    \ search algorithm"
