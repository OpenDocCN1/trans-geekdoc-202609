- pgno: 99
  md: 'Alas, table-based implementations are vulnerable to *cache-timing attacks*,
    which exploit timing variations when a program reads or writes elements in cache
    memory. Access time varies depending on the relative position in cache memory
    of the accessed elements. Timings thus leak information about the accessed element,
    which in turn leaks information on the secrets involved.


    Cache-timing attacks are difficult to avoid. One obvious solution would be to
    ditch lookup tables altogether by writing a program whose execution time doesn’t
    depend on its inputs, but that’s almost impossible to do and still retain the
    same speed, so chip manufacturers have opted for a radical solution: instead of
    relying on potentially vulnerable software, they rely on *hardware*.


    # Native Instructions


    AES native instructions (AES-NI) solve the problem of cache-timing attacks on
    AES software implementations. To understand how AES-NI works, think about the
    way software runs on hardware: to run a program, a microprocessor translates binary
    code into a series of instructions that integrated circuit components execute.
    For example, a MUL assembly instruction between two 32-bit values will activate
    the transistors implementing a 32-bit multiplier in the microprocessor. To implement
    a crypto algorithm, we usually express a combination of basic operations—additions,
    multiplications, XORs, and so on—and the microprocessor activates its adders,
    multipliers, and XOR circuits in the prescribed order.


    AES native instructions take this to a whole new level by providing developers
    with dedicated assembly instructions that compute AES. Instead of coding an AES
    round as a sequence of assembly instructions, when using AES-NI, you just call
    the instruction AESENC, and the chip computes the round for you. Native instructions
    allow you to tell the processor to run an AES round instead of requiring you to
    program rounds as a combination of basic operations.


    A typical assembly implementation of AES using native instructions looks like
    Listing 4-3.


    ```

    PXOR      %xmm5,  %xmm0

    AESENC    %xmm6,  %xmm0

    AESENC    %xmm7,  %xmm0

    AESENC    %xmm8,  %xmm0

    AESENC    %xmm9,  %xmm0

    AESENC    %xmm10, %xmm0

    AESENC    %xmm11, %xmm0

    AESENC    %xmm12, %xmm0

    AESENC    %xmm13, %xmm0

    AESENC    %xmm14, %xmm0

    AESENCLAST %xmm15, %xmm0

    ```


    *Listing 4-3: An implementation of AES-128 using AES native instructions*'
