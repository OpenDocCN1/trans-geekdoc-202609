- pgno: 173
  md: '# How to Create Keyed Hashes from Block Ciphers


    The compression functions in many hash functions are built on block ciphers (see
    Chapter 6). For example, HMAC-SHA-256 PRF is a series of calls to SHA-256’s compression
    function, which is a block cipher that repeats a sequence of rounds. In other
    words, HMAC-SHA-256 is a block cipher inside a compression function inside a hash
    inside the HMAC construction. So why not use a block cipher directly rather than
    build such a layered construction?


    *Cipher-based MAC (CMAC)* is such a construction: it creates a MAC given only
    a block cipher, such as AES. Though less popular than HMAC, CMAC is deployed in
    many systems, including the Internet Key Exchange (IKE) protocol, which is part
    of the IPsec suite. IKE, for example, generates key material using the AES-CMAC-PRF-128
    construction as a core algorithm (or CMAC based on AES with 128-bit output). CMAC
    is specified in RFC 4493.


    # Breaking CBC-MAC


    CMAC was designed in 2005 as an improved version of *CBC-MAC*, a simpler block
    cipher–based MAC derived from the cipher block chaining (CBC) block cipher mode
    of operation (see “Modes of Operation” in Chapter 4).


    CBC-MAC, the ancestor of CMAC, is simple: to compute the tag of a message, *M*,
    given a block cipher, *E*, encrypt *M* in CBC mode with an all-zero initial value
    (IV) and discard all but the last ciphertext block. That is, compute


    $$C_1 = E(K, M_1),\quad C_2 = E(K, M_2 \oplus C_1),\quad C_3 = E(K, M_3 \oplus
    C_2)$$


    and so on for each of *M*’s blocks and keep only the last *Cᵢ*—your CBC-MAC tag
    for *M*—simple, and simple to attack.


    To understand why CBC-MAC is insecure, consider the CBC-MAC tag, $T_1 = E(K, M_1)$,
    of a single-block message, $M_1$, and the tag, $T_2 = E(K, M_2)$, of another single-block
    message, $M_2$. Given these two pairs, $(M_1, T_1)$ and $(M_2, T_2)$, you can
    deduce that $T_2$ is also the tag of the two-block message $M_1 \parallel (M_2
    \oplus T_1)$. If you apply CBC-MAC to $M_1 \parallel (M_2 \oplus T_1)$ and compute
    $C_1 = E(K, M_1) = T_1$ followed by $C_2 = E(K, (M_2 \oplus T_1) \oplus T_1) =
    E(K, M_2) = T_2$, you can create a third message/tag pair from two message/tag
    pairs without knowing the key. That is, you can forge CBC-MAC tags, thereby breaking
    CBC-MAC’s security.


    # Fixing CBC-MAC


    CMAC fixes CBC-MAC by processing the last block using a different key from the
    preceding blocks. To do this, CMAC first derives two keys, $K_1$ and $K_2$, from
    the main key, $K$, such that $K$, $K_1$, and $K_2$ are distinct. CMAC processes
    the last block using either $K_1$ or $K_2$, while the preceding blocks use $K$.


    To determine $K_1$ and $K_2$, CMAC first computes a temporary value $L = E(0,
    K)$, where 0 acts as the key of the block cipher and $K$ acts as the'
