- pgno: 90
  md: 'of two simplify data processing, storage, and addressing. But why 2^6 and 2^7
    and not 2^4 or 2^16 bits?


    It’s important that a block cipher’s blocks aren’t too large in order to minimize
    both the length of ciphertext and the memory footprint. Block ciphers first transform
    their input data into a sequence of blocks, which means that to encrypt a 16-bit
    message when blocks are 128 bits, you need to convert the message into a 128-bit
    block for the block cipher to process it and return a 128-bit ciphertext. The
    wider the blocks, the longer this overhead. To process a 128-bit block, you need
    at least 128 bits of memory. Blocks of 64, 128, or even 512 bits are short enough
    to fit in the registers of most CPUs or to implement using dedicated hardware
    circuits, allowing for efficient implementations in most cases. But larger blocks
    (for example, several kilobytes long) can have a noticeable impact on the cost
    and performance of implementations.


    When ciphertexts’ length or memory footprint is critical, you may have to use
    64-bit blocks because these produce shorter ciphertexts and consume less memory.
    Otherwise, 128-bit or larger blocks are better, mainly because modern CPUs can
    often process 128-bit blocks more efficiently than 64-bit ones and they’re more
    secure (see the “Sweet32” attack, at *https://sweet32.info*). In particular, CPUs
    can leverage instructions to efficiently process one or more 128-bit blocks in
    parallel—for example, the Advanced Vector Extensions (AVX) family of instructions
    in Intel CPUs.


    # The Codebook Attack


    While blocks shouldn’t be too large, they also shouldn’t be too small; otherwise,
    they may be susceptible to *codebook attacks*, which are attacks against block
    ciphers that are efficient only when using smaller blocks. With 16-bit blocks,
    the codebook attack works like this:


    +   1. Get the 65,536 (2^16) ciphertexts corresponding to each 16-bit plaintext
    block.

    +   2. Build a lookup table—the *codebook*—mapping each ciphertext block to its
    corresponding plaintext block.

    +   3. To decrypt an unknown ciphertext block, look up its corresponding plaintext
    block in the table.


    When using 16-bit blocks, the lookup table needs only 2^16 × 16 = 2^20 bits of
    memory, or 128 kilobytes. With 32-bit blocks, memory needs to grow to 16 gigabytes,
    which is still manageable. But with 64-bit blocks, you’d have to store 2^70 bits
    (a zettabit, or 128 exabytes), so forget about it. Codebook attacks are therefore
    not an issue for larger blocks of 128 bits or more.


    # How to Construct Block Ciphers


    There exist hundreds of block ciphers but only a handful of techniques to construct
    one. In practice, a block cipher isn’t a gigantic algorithm but a'
