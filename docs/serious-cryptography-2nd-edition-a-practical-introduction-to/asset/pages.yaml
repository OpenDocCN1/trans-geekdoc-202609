  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_305_0.png)


    Figure 14-3: Principle of a quantum algorithm


    We also refer to quantum algorithms as quantum gate arrays or quantum circuits.


    # Quantum Gates as Matrix Multiplications


    Unlike the Boolean gates of a classical computer (AND, XOR, and so on), a quantum
    gate acts on a group of amplitudes just as a matrix acts when multiplied with
    a vector. For example, to apply the simplest quantum gate, the identity gate,
    to the qubit Φ, we see I as a 2×2 identity matrix and multiply it with the column
    vector consisting of the two amplitudes of Φ:


    I|Φ⟩ = (1 0; 0 1) (i/√2; -1/√2) = (1×i/√2 + 0×(-1/√2); 0×i/√2 + 1×(-1/√2)) = (i/√2;
    -1/√2) = |Φ⟩


    The result of this matrix-vector multiplication is another column vector with
    two elements, where the top value is equal to the dot product of the I matrix''s
    first line with the input vector (the result of adding the product of the first
    elements 1 and i/√2 to the product of the second elements 0 and -1/√2) and likewise
    for the bottom value.


    The identity gate I is pretty useless because it doesn''t do anything and leaves
    a qubit unchanged.


    NOTE In practice, a quantum computer wouldn''t explicitly compute matrix-vector
    multiplications because the matrices would be way too large. (That''s why a classical
    computer can''t simulate quantum computing.) Instead, a quantum computer would
    transform qubits as physical particles through physical transformations that are
    equivalent to a matrix multiplication. Confused? Here''s what Richard Feynman
    had to say: "If you are not completely confused by quantum mechanics, you do not
    understand it."


    # The Hadamard Quantum Gate


    One of the most useful quantum gates is the Hadamard gate, usually denoted as
    H. You can define the Hadamard gate as follows (note the negative value in the
    bottom-right position):'
