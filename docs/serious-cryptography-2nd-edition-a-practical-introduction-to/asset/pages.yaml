- pgno: 2
  md: "# PRAISE FOR SERIOUS CRYPTOGRAPHY\n\n> “Fills [the need for an accessible and\
    \ readable resource on cryptography], taking the reader on a journey through different\
    \ cryptographic tools and how to use them, as well as the important ‘what can\
    \ go wrong’ sections that fill the book. . . . *Serious Cryptography* is an enjoyable\
    \ introduction to the field, and one that comes highly recommended.”\n> \n> —YEHUDA\
    \ LINDELL, HEAD OF CRYPTOGRAPHY AT COINBASE\n\n> “A properly serious introduction;\
    \ it describes the essential concepts in a clear and concise prose. It does not\
    \ aim at vacuous entertainment of the reader, but at imparting knowledge. This\
    \ is the kind of ‘first book’ that you’d keep referring to because it has the\
    \ right structure on which one can build a thorough understanding of cryptography.”\n\
    > \n> —THOMAS PORNIN, TECHNICAL VICE PRESIDENT, NCC GROUP\n\n> “Like having a\
    \ wise friend explain all of cryptography’s mysteries without making your head\
    \ spin. The book stands out for its practical approach, which provides real-world\
    \ applications and insights. It is considered mandatory reading for security engineers\
    \ undergoing onboarding within my team, providing an essential foundation for\
    \ their professional development.”\n> \n> —ANASTASIIA VOITOVA, HEAD OF SECURITY\
    \ ENGINEERING AT COSSACK LABS\n\n> “A superb introduction to modern encryption\
    \ and cryptography. For those looking to quickly get up to speed on the topics,\
    \ this makes for an excellent go-to guide.”\n> \n> —BEN ROTHKE, RSA CONFERENCE\n\
    \n> “It’s really a love letter to cryptography.”\n> \n> —NADIM KOBEISSI\n\n> “Aumasson\
    \ successfully ensures that the reader has a strong understanding of cryptography’s\
    \ core ideas. . . . *Serious Cryptography* is a must read for anyone wanting to\
    \ enter cryptographic engineering.”\n> \n> —GREGORY PARFITT, INFOSECURITY MAGAZINE"
