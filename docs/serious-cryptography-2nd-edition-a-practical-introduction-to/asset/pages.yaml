- pgno: 330
  md: 'to “convert” a program into mathematical equations. In principle, you can convert
    any program into equations. But when the program isn’t optimized for the underlying
    math structure, the equations get very large and slow to compute. Algebraic hash
    functions aim to address this issue by designing hash functions that are both
    secure and easy to implement with only arithmetic operations in a finite field.


    # Design Principles


    Let’s consider the design principles of Poseidon, a hash function designed in
    2019 for zero-knowledge proof systems and rapidly adopted by many blockchain systems.
    Such proofs sometimes have to express a hash function as a circuit of arithmetic
    operations over a large finite field, such as those of integers modulo a 255-bit
    prime number. In that case, Poseidon proved orders of magnitude more efficient
    than general-purpose hash functions like SHA-256.


    Poseidon uses the sponge hash function construction (see Chapter 7), so it needs
    to construct a permutation, an invertible transformation with input and output
    of the same size. It applies this permutation to a state that is a vector of finite
    field elements. In the relevant applications, such a finite field usually consists
    of numbers modulo a prime, which may be as small as 31 bits and as large as 381
    bits, depending on the application.


    Then, like most hash functions, the permutation iterates a series of rounds, so
    it needs to design a round function.


    Finally, Poseidon breaks down its permutation into three layers, with three different
    purposes, reminiscent of AES’s rounds:


    +   - A unicity layer, AddRoundConstants, which Poseidon notes as ARC() in the
    documentation. This adds constant values to the state’s elements, such that the
    constants are different for each round. Making each round unique prevents attacks
    including the slide attack. To avoid defining and storing many constants, Poseidon
    generates constants from a deterministic random bit generator initialized with
    an encoding of the Poseidon instance characteristics (number of rounds, finite
    field, S-box type, and so on).

    +   - A nonlinear layer or S-box layer, SubWords, which Poseidon’s documentation
    notes as S. This layer adds confusion, the property that the input and output
    values of the function are related by high-degree algebraic equations—and thus
    are as far as possible from linear and low-degree equations, which differential
    cryptanalysis can exploit. S-box transforms each element of its state independently
    of the others, typically mapping a field element x to x³ or x⁵. The exponent is
    kept relatively low to be efficiently computed.

    +   - A linear layer, MixLayer, which Poseidon notes as M() in the documentation.
    MixLayer brings diffusion, or the propagation of differences in the initial state
    across all elements. For example, if the state consists of the four-element vector
    (x₁, x₂, x₃, x₄), then M() replaces each element with a linear combination of
    all elements. It might replace x₁ with'
