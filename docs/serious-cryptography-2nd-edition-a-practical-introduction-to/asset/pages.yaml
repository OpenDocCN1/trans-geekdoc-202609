- pgno: 116
  md: 'NOTE Nonce is short for “number used only once.” In the context of stream ciphers,
    we sometimes call it the IV, for “initial value.”


    From a high-level perspective, there are two types of stream ciphers: stateful
    and counter based. Stateful stream ciphers have a secret internal state that evolves
    throughout keystream generation. The cipher initializes the state from the key
    and the nonce and then calls an update function to update the state value and
    produce one or more keystream bits from the state, as Figure 5-2 shows. For example,
    RC4 is stateful while Salsa20 is counter based.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_116_0.png)


    Figure 5-2: A stateful stream cipher


    Counter-based stream ciphers produce chunks of a keystream from a key, a nonce,
    and a counter value, as in Figure 5-3. Unlike stateful stream ciphers, counter-based
    stream ciphers such as Salsa20 don’t keep track of a secret during keystream generation,
    apart from the counter’s value.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_116_1.png)


    Figure 5-3: A counter-based stream cipher


    These two approaches define the high-level architecture of the stream cipher,
    regardless of how the core algorithms work. The internals of the stream cipher
    also fall into two categories, depending on the target platform of the cipher:
    hardware oriented and software oriented.


    # Hardware-Oriented Stream Ciphers


    When cryptographers talk about hardware, they mean application-specific integrated
    circuits (ASICs), programmable logic devices (PLDs), and field-programmable gate
    arrays (FPGAs). A cipher’s hardware implementation'
  merge: -1
  img_proc: true
- pgno: 117
  md: "is an electronic circuit that implements the cryptographic algorithm at the\
    \ bit level and that can’t be used for anything else; in other words, the circuit\
    \ is *dedicated hardware*. On the other hand, software implementations of cryptographic\
    \ algorithms simply tell a microprocessor what instructions to execute in order\
    \ to run the algorithm. These instructions operate on bytes or words and then\
    \ call pieces of electronic circuits that implement general-purpose operations\
    \ such as addition and multiplication. Software deals with bytes or words of 32\
    \ or 64 bits, whereas hardware deals with bits. The first stream ciphers worked\
    \ with bits to save complex wordwise operations and thus be more efficient in\
    \ hardware, their target platform at the time.\n\nStream ciphers were mainly used\
    \ for hardware implementations because they were cheaper than block ciphers. They\
    \ needed less memory and fewer logical gates than block ciphers and therefore\
    \ occupied a smaller area on an integrated circuit, which reduced fabrication\
    \ costs. For example, counting in gate-equivalents, the standard area metric for\
    \ integrated circuits, you could find stream ciphers taking less than 1,000 gate-equivalents;\
    \ by contrast, typical software-oriented block ciphers needed at least 10,000\
    \ gate-equivalents, making crypto an order of magnitude more expensive than with\
    \ stream ciphers.\n\nToday, however, block ciphers are no longer more expensive\
    \ than stream ciphers—first, because there are now hardware-friendly block ciphers\
    \ about as small as stream ciphers, and second, because the cost of hardware has\
    \ plunged. Yet stream ciphers are often associated with hardware because they\
    \ used to be the best option.\n\nIn the next section, I’ll explain the basic mechanism\
    \ behind hardware stream ciphers, called *feedback shift registers (FSRs)*. Almost\
    \ all hardware stream ciphers rely on FSRs in some way, whether that’s the A5/1\
    \ cipher used in 2G mobile phones or the more recent Grain-128a cipher.\n\n> >\
    \ **NOTE**  \n> > *The first standard block cipher, the Data Encryption Standard\
    \ (DES), was optimized for hardware rather than software. When the US government\
    \ standardized DES in the 1970s, most target applications were hardware implementations.\
    \ It’s therefore no surprise that the S-boxes in DES are small and fast to compute\
    \ when implemented as a logical circuit in hardware but inefficient in software.\
    \ Unlike DES, the current Advanced Encryption Standard (AES) deals with bytes\
    \ and is therefore more efficient in software than DES.*\n\n# ## Feedback Shift\
    \ Registers\n\nCountless stream ciphers use FSRs because they’re simple and well\
    \ understood. An FSR is an array of bits equipped with an update *feedback function*,\
    \ which I’ll denote as f. The FSR’s state is stored in the array, or register,\
    \ and each *update* of the FSR uses the feedback function to change the state’s\
    \ value and to produce one output bit.\n\nIn practice, an FSR works like this:\
    \ if R₀ is the initial value of the FSR, the next state, R₁, is defined as R₀\
    \ left-shifted by 1 bit, where the bit leaving the register is returned as output\
    \ and where the empty position is filled with f(R₀)."
