- pgno: 205
  md: "# Computational Hardness\n\nA computational problem is a question that one\
    \ can answer by doing enough computation—for example, “Is 217 a prime number?”\
    \ or “How many *is are in incomprehensibilities?*” The first question is a decision\
    \ problem, because it can be answered with “yes” or “no,” while the second is\
    \ a search problem.\n\n*Computational hardness* is the property of computational\
    \ problems for which there is no algorithm that will run in a reasonable amount\
    \ of time. Such problems are also called *intractable*. Computational hardness\
    \ is independent of the type of computing device used, be it a general-purpose\
    \ central processing unit (CPU), a graphics processing unit (GPU), an integrated\
    \ circuit, or a mechanical Turing machine. Indeed, one of the first findings of\
    \ computational complexity theory is that all computing models are equivalent.\
    \ If one computing device can solve a problem efficiently, any other device can\
    \ efficiently solve it by porting the algorithm to the other device’s language—an\
    \ exception is quantum computers, which we’ll discuss in Chapter 14. Thus, I won’t\
    \ need to specify the underlying computing device or hardware when discussing\
    \ computational hardness; instead, we’ll just discuss algorithms.\n\nTo evaluate\
    \ computational hardness, you first need a way to measure the complexity of an\
    \ algorithm, or its running time. You then categorize running times as hard or\
    \ easy.\n\n# Running Time\n\nThe *computational complexity* of an algorithm is\
    \ the approximate number of operations it does, as a function of its input size.\
    \ You can count the size in bits or in the number of elements taken as input.\
    \ For example, take the algorithm in Listing 9-1, written in pseudocode. It searches\
    \ for a value, x, within an array of n elements and then returns its index position,\
    \ or −1, if x isn’t found.\n\n```\nsearch(x, array, n) {\n    for i from 0 to\
    \ n - 1 {\n        if (array[i] == x) {\n            return i;\n        }\n  \
    \  }\n    return -1;\n}\n```\n\nListing 9-1: A simple search algorithm of complexity\
    \ linear with respect to the array length n\n\nThis algorithm uses a for loop\
    \ to find a specific value, x, in an array, iterating over values of the variable\
    \ i, starting with 0. It checks whether the value of position i in array is equal\
    \ to the value of x. If so, it returns the position i. Otherwise, it increments\
    \ i and tries the next position until it reaches n − 1, the last position in the\
    \ array, at which point it returns −1."
