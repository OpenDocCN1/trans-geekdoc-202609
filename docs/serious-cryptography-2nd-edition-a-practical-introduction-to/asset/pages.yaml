- pgno: 170
  md: 'the MAC of $M_1 \|\| M_2$ given only the MAC of $M_1$. This fact makes the
    secret-prefix construction insecure as a MAC and PRF when, for example, using
    it with SHA-256 or SHA-512. It’s a weakness of Merkle–Damgård to allow length-extension
    attacks, and none of the SHA-3 finalists do. The ability to thwart length-extension
    attacks was mandatory for SHA-3 submissions (see Chapter 6).


    # ## Insecurity with Different Key Lengths


    The secret-prefix construction is also insecure when allowing the use of keys
    of different lengths. For example, if the key $K$ is the 24-bit hexadecimal string
    123abc and $M$ is def00, then **Hash()** processes the value $K \|\| M = 123abcdef00$.
    If $K$ is instead the 16-bit string 123a and $M$ is bcdef000, then **Hash()**
    processes $K \|\| M = 123abcdef000$, too. Therefore, the result of the secret-prefix
    construction **Hash**($K \|\| M$) is the same for both keys.


    This problem is independent of the underlying hash; you can fix it by hashing
    the key’s length along with the key and the message—for example, by encoding the
    key’s bit length as a 16-bit integer, $L$, and then hashing **Hash**($L \|\| K
    \|\| M$). You shouldn’t have to do this, however, as modern hash functions such
    as BLAKE2 and SHA-3 include a keyed mode that avoids these pitfalls and yields
    a secure PRF and thus a secure MAC as well.


    # ## The Secret-Suffix Construction


    Instead of hashing the key before the message as in the secret-prefix construction,
    you can hash it *after*. And that’s exactly how the *secret-suffix construction*
    works by building a PRF from a hash function as **Hash**($M \|\| K$).


    Putting the key at the end makes quite a difference. The length-extension attack
    that works against secret-prefix MACs won’t work against the secret suffix. Applying
    length extension to a secret-suffix MAC results in **Hash**($M_1 \|\| K \|\| M_2$)
    from **Hash**($M_1 \|\| K$), but this isn’t a valid attack because **Hash**($M_1
    \|\| K \|\| M_2$) isn’t a valid secret-suffix MAC; the key needs to be at the
    end.


    However, the secret-suffix construction is weaker against another type of attack.
    Say you’ve got a collision for the hash **Hash**($M_1$) = **Hash**($M_2$), where
    $M_1$ and $M_2$ are two distinct messages, possibly of different sizes. In the
    case of an M–D hash function such as SHA-256, this implies that **Hash**($M_1
    \|\| P_1 \|\| K$) and **Hash**($M_2 \|\| P_2 \|\| K$) will be equal too, where
    $P_1$ and $P_2$ are the padding data added to complete a block. After processing
    $M_1 \|\| P_1$, the hash function’s state is the same as after processing $M_2
    \|\| P_2$. Adding $K$ to each instance preserves the equality of the state, leading
    to a collision regardless of $K$’s value.


    To exploit this property, an attacker:


    +   1. Finds two colliding messages, $M_1$ and $M_2$

    +   2. Requests the MAC tag of $M_1$, **Hash**($M_1 \|\| K$)

    +   3. Guesses that **Hash**($M_2 \|\| K$) is the same, thereby forging a valid
    tag and breaking the MAC’s security'
