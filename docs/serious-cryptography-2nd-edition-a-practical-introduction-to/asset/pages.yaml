  md: 'correlation attacks, algebraic attacks, and cube attacks. See in particular
    the work of Nicolas Courtois and Willi Meier for the first two attack types and
    that of Itai Dinur and Adi Shamir for cube attacks.


    For more about attacks on RC4, look up the 2001 Scott Fluhrer, Itsik Mantin, and
    Adi Shamir (FMS) attack, and the 2013 research article “On the Security of RC4
    in TLS.”


    Salsa20’s legacy deserves your attention, too. The stream cipher ChaCha is similar
    to Salsa20 but with a slightly different core permutation that was later used
    in the hash function BLAKE, as you’ll see in Chapter 6. These algorithms all leverage
    Salsa20’s software implementation techniques using parallelized instructions,
    as discussed at https://cr.yp.to/snuffle.html.'
