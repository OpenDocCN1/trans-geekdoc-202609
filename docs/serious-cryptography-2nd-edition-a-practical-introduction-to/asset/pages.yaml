  md: '> > **NOTE**

    > >

    > > Figure 12-2 considers points from the set denoted \(\mathbb{Z}_{191} = \{0,
    1, 2, \ldots, 190\}\), which includes zero. This differs from the groups denoted
    \(\mathbb{Z}_p^*\) (with a star superscript) that we discussed in the context
    of RSA and Diffie–Hellman. The reason for this difference is that you’ll both
    multiply and add numbers, and you therefore need to ensure that the set of numbers
    includes addition’s identity element (namely 0, such that \(x + 0 = x\) for every
    \(x \in \mathbb{Z}_{191}\)).

