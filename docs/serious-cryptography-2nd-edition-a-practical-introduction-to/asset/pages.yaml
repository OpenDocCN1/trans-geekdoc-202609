- pgno: 149
  md: '# How to Build Hash Functions


    In the 1980s, cryptographers realized that the simplest way to hash a message
    is to split it into chunks and process each chunk consecutively using a similar
    algorithm. This strategy, iterative hashing, comes in two main forms:


    +   - Iterative hashing using a compression function that transforms an input
    to a smaller output, as Figure 6-4 illustrates. This technique is also called
    the Merkle–Damgård construction, named after the cryptographers Ralph Merkle and
    Ivan Damgård who described it.

    +   - Iterative hashing using a function that transforms an input to an output
    of the same size, such that any two different inputs give two different outputs
    (that is, a permutation). Such functions are called sponge functions.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_149_0.png)


    Figure 6-4: The Merkle–Damgård construction using a compression function called
    Compress


    We’ll now discuss how these constructions work and how compression functions look
    in practice.


    # Compression-Based Hash Functions


    All hash functions developed from the 1980s through the 2010s are based on the
    Merkle–Damgård (M–D) construction: MD4, MD5, SHA-1, and the SHA-2 family, as well
    as the lesser-known RIPEMD and Whirlpool hash functions. While the M–D construction
    isn’t perfect, it is simple and has proven to be secure enough for many applications.


    NOTE In MD4, MD5, and RIPEMD, the MD stands for message digest rather than Merkle–Damgård.


    To hash a message, the M–D construction splits the message into blocks of identical
    size and mixes these blocks with an internal state using a compression function,
    as Figure 6-4 shows. Here, H0 is the initial value (denoted IV) of the internal
    state, the values H1, H2, … are the chaining values, and the final value of the
    internal state is the message’s hash value.


    The message blocks are often 512 or 1,024 bits, but they can, in principle, be
    any size. Whatever the block length, it is fixed for a given hash function. For
    example, SHA-256 works with 512-bit blocks, and SHA-512 works with 1,024-bit blocks.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Padding Blocks


    What happens if you want to hash a message that can''t be split into a sequence
    of complete blocks? For example, if blocks are 512 bits, then a 520-bit message
    consists of one 512-bit block plus 8 bits. In such a case, the M–D construction
    forms the last block as follows: take the chunk of bits left (8 in our example),
    append 1 bit, then append 0 bits, and finally append the length of the original
    message, encoded on a fixed number of bits. This padding trick guarantees that
    any two distinct messages give a distinct sequence of blocks and thus a distinct
    hash value.


    For example, if you hash the 8-bit string 10101010 using SHA-256, which is a hash
    function with 512-bit message blocks, the first and only block appears, in bits,
    as follows:


    10101010 1000000000000000 (...) 0000000000001000


    Here, the message bits are the first 8 bits (10101010), and the padding bits are
    all the subsequent bits (shown in italic). The 1000 at the end of the block (underlined)
    is the message’s length, or 8 encoded in binary (on 32 bits at most). The padding
    thus produces a 512-bit message composed of a single 512-bit block, ready to be
    processed by SHA-256’s compression function.


    # Security Guarantees


    The Merkle–Damgård construction turns a secure compression function that takes
    small, fixed-length inputs into a secure hash function that takes inputs of arbitrary
    lengths. If a compression function is preimage and collision resistant, then a
    hash function built on it using the M–D construction is also preimage and collision
    resistant. This is true because we can turn any successful preimage attack for
    the M–D hash into a successful preimage attack for the compression function, as
    Merkle and Damgård demonstrated in their 1989 papers (see this chapter’s “Further
    Reading” section). The same is true for collisions: an attacker can’t break the
    hash’s collision resistance without breaking the underlying compression function’s
    collision resistance; hence, the security of the latter guarantees the security
    of the hash.


    Note that the converse argument doesn’t hold, because a collision for the compression
    function doesn’t necessarily give a collision for the hash. An arbitrary collision
    between Compress(X, M1) and Compress(Y, M2) for chaining values X and Y, both
    distinct from H0, won’t get you a collision for the hash because you can’t “plug”
    the collision into the iterative chain of hashes—except if one of the chaining
    values happens to be X and the other Y, but that’s unlikely to happen.


    # Finding Multicollisions


    A multicollision occurs when a set of three or more messages hash to the same
    value. For example, the triplet (X, Y, Z), such that Hash(X) = Hash(Y) = Hash(Z),
    is a 3-collision. Ideally, multicollisions should be much harder to'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'find than collisions, but there’s a simple trick for finding them at almost
    the same cost as that of a single collision. Here’s how it works:


    +   1. Find a collision **Compress**\(H_0, M_{1.1}\) = **Compress**\(H_0, M_{1.2}\)
    = \(H_1\). This is just a 2-collision, or two messages hashing to the same value.

    +   2. Find a second collision with \(H_1\) as a starting chaining value: **Compress**\(H_1,
    M_{2.1}\) = **Compress**\(H_1, M_{2.2}\) = \(H_2\). Now you have a 4-collision,
    with four messages hashing to the same value \(H_2\): \(M_{1.1} \|\| M_{2.1}\),
    \(M_{1.1} \|\| M_{2.2}\), \(M_{1.2} \|\| M_{2.1}\), and \(M_{1.2} \|\| M_{2.2}\).

    +   3. Repeat and find \(N\) times a collision, and you’ll have \(2^N\) messages,
    each of \(N\) blocks, hashing to the same value—that is, a \(2^N\)-collision,
    at the cost of “only” about \(N2^N\) hash computations.


    In practice, this trick isn’t all that practical because it requires finding a
    basic 2-collision in the first place.


    # Building Compression Functions


    All compression functions used in real hash functions such as SHA-256 and BLAKE2
    are based on block ciphers because that’s the simplest way to build a compression
    function. Figure 6-5 shows the most common of the block cipher–based compression
    functions, the *Davies–Meyer construction*.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_151_0.png)


    *Figure 6-5: The Davies–Meyer construction. The dark triangle shows where the
    block cipher’s key is input.*


    Given a message block \(M_i\) and the previous chaining value \(H_{i-1}\), the
    Davies–Meyer compression function uses a block cipher, **E**, to compute the new
    chaining value as:


    \[H_i = E(M_i, H_{i-1}) \oplus H_{i-1}\]


    The message block \(M_i\) acts as the block cipher key, and the chaining value
    \(H_{i-1}\) acts as its plaintext block. As long as the block cipher is secure,
    the resulting compression function is secure as well as collision and preimage
    resistant. Without the XOR of the preceding chaining value (\(\oplus H_{i-1}\)),
    Davies–Meyer would be insecure because you could invert it, going from the new
    chaining value to the previous one using the block cipher’s decryption function.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'The Davies–Meyer construction has a surprising property: you can find fixed
    points, or chaining values, that are unchanged after applying the compression
    function with a given message block. It suffices to take H_{i-1} = D(M_i, 0) as
    a chaining value, where D is the decryption function corresponding to E. The new
    chaining value H_i is therefore equal to the original H_{i-1}.


    H_i = E(M_i, H_{i-1}) ⊕ H_{i-1} = E(M_i, D(M_i, 0)) ⊕ D(M_i, 0) = 0 ⊕ D(M_i, 0)
    = D(M_i, 0) = H_{i-1}


    You get H_i = H_{i-1} because plugging the decryption of zero into the encryption
    function yields zero—the term E(M_i, D(M_i, 0)) = 0—leaving only the ⊕ H_{i-1}
    part of the equation in the expression of the compression function''s output.
    You can then find fixed points for the compression functions of the SHA-2 functions,
    for example, which are based on the Davies–Meyer construction. Fortunately, fixed
    points aren''t a security risk.


    There are many block cipher–based compression functions other than Davies–Meyer,
    such as those in Figure 6-6.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_152_0.png)


    Figure 6-6: Other secure block cipher–based compression function constructions


    These are less popular because they''re more complex or require the message block
    to be the same length as the chaining value.


    # Permutation-Based Hash Functions


    After decades of research, cryptographers know everything there is to know about
    block cipher–based hashing techniques. Still, shouldn''t there be a simpler way
    to hash? Why bother with a block cipher, an algorithm that takes a secret key,
    when hash functions don''t take a secret key? Why not build hash functions with
    a fixed-key block cipher, a single permutation algorithm?


    Those simpler hash functions are sponge functions, and they use a single permutation
    instead of a compression function and a block cipher (see Figure 6-7). Instead
    of using a block cipher to mix message bits with the internal state, sponge functions
    just do an XOR operation. Sponge functions are not only simpler than Merkle–Damgård
    functions, they''re also more versatile. You''ll find them used as hash functions
    and also as deterministic random bit generators, stream ciphers, pseudorandom'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'functions (see Chapter 7), and authenticated ciphers (see Chapter 8). The most
    famous sponge function is Keccak, also known as SHA-3.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_153_0.png)


    Figure 6-7: The sponge construction


    A sponge function works as follows:


    +   1. It XORs the first message block, M₁, to H₀, a predefined initial value
    of the internal state (for example, the all-zero string). Message blocks are all
    the same size and smaller than the internal state.

    +   2. A permutation, P, transforms the internal state to another value of the
    same size.

    +   3. It XORs block M₂ and applies P and then repeats this for the message blocks
    M₃, M₄, and so on. This is the absorbing phase.

    +   4. After injecting all the message blocks, it applies P again and extracts
    a block of bits from the state to form the hash. If you need a longer hash, apply
    P again and extract a block. This is the squeezing phase.


    The security of a sponge function depends on the length of its internal state
    and the length of the blocks. If message blocks are r-bit long and the internal
    state is w-bit long, then there are c = w − r bits of the internal state that
    message blocks can’t modify. The value of c is a sponge’s capacity, and the security
    level guaranteed by the sponge function is c/2. For example, to reach 256-bit
    security with 64-bit message blocks, the internal state should be at least w =
    2 × 256 + 64 = 576 bits. The security level also depends on the length, n, of
    the hash value. The complexity of a collision attack is therefore the smallest
    value between 2^{n/2} and 2^{c/2}, while the complexity of a second preimage attack
    is the smallest value between 2^{n} and 2^{c/2}.


    To be secure, the permutation P should behave like a random permutation, without
    statistical bias and without a mathematical structure that would allow an attacker
    to predict outputs. As with compression function–based hashes, sponge functions
    also pad messages, but the padding is simpler because it doesn’t need to include
    the message’s length. The last message bit is simply followed by a 1 bit and as
    many zeros as necessary.


    # The SHA Family of Hash Functions


    The Secure Hash Algorithm (SHA) hash functions are standards defined by NIST for
    use by nonmilitary federal government agencies in the United'
