- pgno: 171
  md: '# The HMAC Construction


    The *hash-based MAC (HMAC)* construction allows you to build a MAC from a hash
    function, which is more secure than either secret prefix or secret suffix. HMAC
    yields a secure PRF as long as the underlying hash is collision resistant, but
    even if that isn’t the case, HMAC still yields a secure PRF if the hash’s compression
    function is a PRF. The secure communication protocols IPsec, SSH, and TLS have
    all used HMAC. (You’ll find HMAC specifications in the NIST FIPS 198-1 standard
    and in RFC 2104.)


    HMAC uses a hash function, **Hash**, to compute a MAC tag, as Figure 7-1 shows
    and according to the following expression:


    **Hash**((K ⊕ *opad*) || **Hash**((K ⊕ *ipad*) || M))


    The value *opad* (outer padding) is the hexadecimal string 5c5c5c…5c as long as
    **Hash**’s block size. The key, K, is usually shorter than one block that’s filled
    with 00 bytes and XORed with *opad*. For example, if K is the 1-byte string 00,
    then K ⊕ *opad* = *opad*. (The same is true if K is the all-zero string of any
    length up to a block’s length.) K ⊕ *opad* is the first block processed by the
    outer call to **Hash**—namely, the leftmost **Hash** in the preceding equation,
    or the bottom hash in Figure 7-1.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_171_0.png)


    *Figure 7-1: The HMAC hash-based MAC construction for a hash function based on
    a compression function*


    The value *ipad* (inner padding) is a string (363636…36) as long as the **Hash**’s
    block size and completed with 00 bytes. The resulting block is the first processed
    by the inner call to **Hash**—namely, the rightmost **Hash** in the equation,
    or the top hash in Figure 7-1.


    **NOTE** *The envelope method is a more secure construction than secret prefix
    or secret suffix. It’s expressed as **Hash**(K || M || K), a sandwich MAC, but
    it’s theoretically less secure than HMAC.*'
