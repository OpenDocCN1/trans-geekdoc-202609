- pgno: 273
  md: 'As of 2023, Ed25519 is likely the second most popular elliptic curve signature
    algorithm due to its performance benefits and high security guarantees (see https://ed25519.cr.yp.to).


    OpenSSH, Apple products, and many blockchain platforms use Ed25519 to sign transactions.
    In February 2023, Ed25519 was added as a NIST standard, as part of FIPS 186-5,
    “Digital Signature Standard.”


    Ed25519 has suffered from some interoperability issues, as you’ll see later in
    this chapter.


    # Encrypting with Elliptic Curves


    Although you will typically use elliptic curves for signing, you can encrypt with
    them. But you’ll rarely see people do so in practice because of restrictions on
    the size of the plaintext that can be encrypted: you can fit about 100 bits of
    plaintext, as compared to almost 4,000 in RSA with the same security level.


    You can encrypt with elliptic curves with the *elliptic curve integrated encryption
    scheme (ECIES)*, a *hybrid* scheme combining asymmetric and symmetric cryptography.
    It uses a Diffie–Hellman operation to derive a shared secret key, which protects
    data with an authenticated cipher.


    Given a recipient’s public key *P*, ECIES encrypts a message *M*, as follows:


    +   1. Pick a random number, *d*, and compute the point *Q = dG*, where the base
    point *G* is a fixed parameter. Here, *(d, Q)* acts as an ephemeral key pair,
    used only for encrypting *M*.

    +   2. Compute an ECDH shared secret by computing *S = dP*.

    +   3. Use a key derivation function (KDF) to derive a symmetric key, *K*, from
    *S*.

    +   4. Encrypt *M* using *K* and a symmetric authenticated cipher, obtaining a
    ciphertext, *C*, and an authentication tag, *T*.


    The ECIES ciphertext then consists of the ephemeral public key *Q* followed by
    *C* and *T*. Decryption is straightforward: the recipient computes *S* by multiplying
    *Q* with their private exponent, then derives the key *K*, decrypts *C*, and verifies
    *T*.


    # Choosing a Curve


    Criteria to assess the safety of an elliptic curve include the order of the group
    you use (that is, its number of points), its addition formulas, and the origin
    of its parameters.


    There are several types of elliptic curves, but not all are equal for cryptographic
    purposes. Choose coefficients *a* and *b* in the curve’s equation *y² = x³ + ax
    + b* carefully, according to established security criteria;'
