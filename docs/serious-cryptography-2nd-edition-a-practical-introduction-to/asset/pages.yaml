    ```

    $$H|\Psi\rangle = \begin{pmatrix} 1/\sqrt{2} & 1/\sqrt{2} \\ 1/\sqrt{2} & -1/\sqrt{2}
    \end{pmatrix}\begin{pmatrix} 1/\sqrt{2} \\ 1/\sqrt{2} \end{pmatrix} = \begin{pmatrix}
    1/2 + 1/2 \\ 1/2 - 1/2 \end{pmatrix} = \begin{pmatrix} 1 \\ 0 \end{pmatrix} =
    |0\rangle$$

    ```


    By applying the Hadamard gate $H$ to $|\Psi\rangle$, you obtain the qubit $|0\rangle$
    for which the value $|0\rangle$ has amplitude 1, and $|1\rangle$ has amplitude
    0. This tells you that the qubit behaves deterministically: if you observe this
    qubit, you''ll always see a 0 and never a 1. In other words, you''ve lost the
    randomness of the initial qubit $|\Psi\rangle$.


    Applying the Hadamard gate again to the qubit $|0\rangle$ results in the following:


    ```

    $$H|0\rangle = \begin{pmatrix} 1/\sqrt{2} & 1/\sqrt{2} \\ 1/\sqrt{2} & -1/\sqrt{2}
    \end{pmatrix}\begin{pmatrix} 1 \\ 0 \end{pmatrix} = \begin{pmatrix} 1/\sqrt{2}
    \\ 1/\sqrt{2} \end{pmatrix} = |\Psi\rangle$$

    ```


    This brings you back to the qubit $|\Psi\rangle$ and a randomized state. We often
    use the Hadamard gate in quantum algorithms to go from a deterministic state to
    a uniformly random one.


    # Not All Matrices Are Quantum Gates


    Although you can see the application of quantum gates as matrix multiplications,
    not all matrices correspond to quantum gates. Recall that a qubit consists of
    the complex numbers $\alpha$ and $\beta$, the amplitudes of the qubit, that satisfy
    the condition $|\alpha|^2 + |\beta|^2 = 1$. If you get two amplitudes that don''t
    match this condition after multiplying a qubit by a matrix, the result can''t
    be a qubit. Quantum gates correspond only to unitary matrices, which preserve
    the property $|\alpha|^2 + |\beta|^2 = 1$.


    Unitary matrices (and quantum gates by definition) are invertible, meaning that
    given the result of an operation, you can compute back the original qubit by applying
    the inverse matrix. This is why quantum computing is a kind of reversible computing.


    # Quantum Speedup


    A quantum speedup occurs when a quantum computer can solve a problem fundamentally
    faster than a classical one. For example, to search for an item among $n$ items
    of an unordered list on a classical computer, you need on average $n/2$ operations
    because you need to look at each item in the list before finding the one you''re
    looking for. (On average, you''ll find that item after searching half of the list.)
    No classical algorithm can do better than $n/2$. However, a quantum algorithm
    exists to search for an item in'
