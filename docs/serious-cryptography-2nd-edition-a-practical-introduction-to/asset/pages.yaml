  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_261_0.png)


    *Figure 12-2: The elliptic curve with the equation* \(y^2 = x^3 - 4x\) *over*
    \(\mathbb{Z}_{191}\), *the set of integers modulo 191*


    Figures 12-1 and 12-2 are based on the same curve equation, \(y^2 = x^3 - 4x\),
    but they show the curve’s points with respect to different sets of numbers: Figure
    12-1 shows the curve’s points over the set of *real numbers*, which includes negative
    numbers, decimals, and so on. For example, as a continuous curve, it shows the
    points at \(x = 2.0, x = 2.1, x = 2.00002\), and so on. Figure 12-2, on the other
    hand, shows only *integers* that satisfy this equation, which excludes decimal
    numbers. Specifically, Figure 12-2 shows the curve \(y^2 = x^3 - 4x\) with respect
    to the integers *modulo 191*: 0, 1, 2, 3, up to 190. You can denote this set of
    numbers \(\mathbb{Z}_{191}\). (There’s nothing special with 191 here, except that
    it’s a prime number. I picked a small number to avoid having too many points on
    the graph.) The points in Figure 12-2 therefore all have x- and y-coordinates
    that are integers modulo 191 and that satisfy the equation \(y^2 = x^3 - 4x\).
    For example, for \(x = 2\), you have \(y^2 = 0\), for which \(y = 0\) is a valid
    solution. This tells you that the point \((2, 0)\) belongs to the curve.


    If \(x = 3\), you get the equation \(y^2 = 27 - 12 = 15\), which admits two solutions
    in \(\mathbb{Z}_{191}\), 46 and 145. Indeed, \(46^2 = 2,116\), with \(2,116 \bmod
    191 = 15\), and \(145^2 = 21,025\), with \(21,025 \bmod 191 = 15\). Thus, the
    points \((3, 46)\) and \((3, 145)\) both belong to the curve and appear as in
    Figure 12-2 (the two points circled on the left).'
