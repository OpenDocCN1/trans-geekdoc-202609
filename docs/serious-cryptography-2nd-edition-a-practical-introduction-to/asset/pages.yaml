- pgno: 164
  md: 'server receives M, it computes H₁ = **Compress**(H₀, M₁), the chaining value
    obtained from SHA-256’s initial value, H₀, and from the 512-bit M. It then records
    H₁ in memory and discards M, at which point it no longer stores M.


    When the client sends a random value, C, the server computes **Compress**(H₁,
    C), after adding the padding to C to fill a complete block, and returns the result
    as **Hash**(M || C). The client then believes that because the server returned
    the correct value of **Hash**(M || C), it holds the complete message—except that
    it may not, as you’ve seen.


    This trick works for SHA-1, SHA-2, as well as SHA-3 and BLAKE2. The solution is
    simple: ask for **Hash**(C || M) instead of **Hash**(M || C).


    # Further Reading


    To learn more about hash functions, read the classics from the 1980s and ’90s:
    research articles like Ralph Merkle’s “One Way Hash Functions and DES” and Ivan
    Damgård’s “A Design Principle for Hash Functions.” Also read the first thorough
    study of block cipher–based hashing, “Hash Functions Based on Block Ciphers: A
    Synthetic Approach” by Bart Preneel, René Govaerts, and Joos Vandewalle.


    For more on collision search, read the 1997 paper “Parallel Collision Search with
    Cryptanalytic Applications” by Paul van Oorschot and Michael Wiener. To learn
    more about the theoretical security notions that underpin preimage resistance
    and collision resistance, as well as length-extension attacks, search for *indistinguishability*.


    For more recent research on hash functions, see the archives of the SHA-3 competition,
    which include all the different algorithms and how they were broken. You’ll find
    many references on the SHA-3 Zoo at https://ehash.aiik.tugraz.at/wiki/The_SHA-3_Zoo.html,
    and on NIST’s page, https://csrc.nist.gov/projects/hash-functions/sha-3-project.


    For more on the SHA-3 winner Keccak and sponge functions, see https://keccak.team/sponge_duplex.html,
    the official page of the Keccak designers.


    Finally, you may look up these two real exploitations of weak hash functions:


    +   - The nation-state malware Flame exploited an MD5 collision to make a counterfeit
    certificate and appear to be a legitimate piece of software.

    +   - The Xbox game console used a weak block cipher (called TEA) to build a hash
    function, which was exploited to hack the console and run arbitrary code on it.'
