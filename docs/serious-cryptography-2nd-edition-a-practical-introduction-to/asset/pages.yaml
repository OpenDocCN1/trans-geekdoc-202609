  md: 'In the following sections, I discuss how to quantify crypto security in ways
    that are both theoretically sound and practically relevant. I discuss notions
    of unconditional versus computational security, bit security versus full attack
    cost, provable versus heuristic security, and symmetric versus asymmetric key
    generation. I conclude the chapter with real-world examples of failures in seemingly
    strong cryptography.


    # Defining the Impossible


    In Chapter 1, I described a cipher’s security relative to an attacker’s capabilities
    and goals and deemed a cipher secure if it’s impossible to reach these goals given
    an attacker’s known capabilities. But what does *impossible* mean in this context?


    Two notions define the concept of impossible in cryptography: unconditional security
    and computational security. Roughly speaking, *unconditional security* is about
    theoretical impossibility, whereas *computational security* is about practical
    impossibility. Unconditional security doesn’t quantify security because it views
    a cipher as either secure or insecure, with no middle ground; it’s therefore useless
    in practice, although it plays an important role in theoretical cryptography.
    Computational security is the more relevant and practical measure of the strength
    of a cipher.


    # Security in Theory: Unconditional Security


    Unconditional security is based not on how hard it is to break a cipher but on
    whether it’s conceivable to break it at all. A cipher is unconditionally secure
    only if, given unlimited computation time and memory, it cannot be broken. Even
    if a successful attack on a cipher would take trillions of years, such a cipher
    is unconditionally *insecure*.


    For example, the one-time pad in Chapter 1 is unconditionally secure. Recall that
    the one-time pad encrypts a plaintext, *P*, to a ciphertext, *C = P ⊕ K*, where
    *K* is a random bit string that is unique to each plaintext. The cipher is unconditionally
    secure because, given a ciphertext and unlimited time to try all possible keys,
    *K*, and compute the corresponding plaintext, *P*, you’d still be unable to identify
    the right *K* because there are as many possible *P*s as there are *K*s.


    # Security in Practice: Computational Security


    Unlike unconditional security, computational security views a cipher as secure
    if it cannot be broken within a *reasonable* amount of time and with reasonable
    resources such as memory, hardware, budget, and energy. Computational security
    is a way to quantify the security of a cipher or any crypto algorithm.


    For example, consider a cipher, **E**, for which you know a plaintext–ciphertext
    pair (*P*, *C*) but not the 128-bit key, *K*, that computes *C = E(K, P)*. This
    cipher is not unconditionally secure because you could break it after trying the
    2¹²⁸ possible 128-bit *K*s until you find the one that satisfies'
