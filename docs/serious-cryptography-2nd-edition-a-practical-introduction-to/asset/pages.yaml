- pgno: 326
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_326_0.png)


    Figure 15-2: A Merkle tree, wherein the shaded cells constitute the membership
    path of A


    Say you want to prove that A was one of the values hashed, without revealing B,
    C, or D. First, hash A to obtain the actual leaf of the hash tree. Then, assume
    that you''ve received A''s membership path, which consists of the other shaded
    values, H(B) and H(H(C) || H(D)). To verify that A belongs to the tree, compute
    the following:


    +   - X = H(H(A) || H(B)), since you know A and H(B)

    +   - H(H(X) || H(H(C) || H(D))), since you know H(H(C) || H(D))


    It took only two hashes of sibling values to prove A''s inclusion, or as many
    hashes as the height of the tree. A tree with eight leaves has a height of three;
    thus, a membership path verification needs three sibling hashes. With 16 leaves,
    you need four sibling hashes, and so on, with n sibling hashes for a tree with
    2^n leaves.


    Blockchain applications often use Merkle trees to hash transactions into a single
    Merkle root, such as that included in a Bitcoin block header. A typical Bitcoin
    block registers about 2,000 transactions, which requires a tree of height 11 (2^11
    = 2,048). In this case, it takes 2,048 − 1 = 2,047 sibling hashes to compute the
    root from the leaves, where each leaf is the hash of a transaction''s data. Each
    hash computes a double SHA-256, so in the case of 2,048 transactions, it takes
    2,047 + 2,048 = 4,095 double SHA-256s, or 8,190 calls to SHA-256.


    Ethereum uses a slightly more complex tree-based data structure, combining Merkle
    trees with Patricia tries (this is not a typo; "trie" comes from "retrieval"),
    a tree-like structure that stores key-value pairs. This structure serves Ethereum''s
    state-based model, which significantly differs from Bitcoin''s UTXO (unspent transaction
    output) model, for which simpler Merkle trees are sufficient.'
