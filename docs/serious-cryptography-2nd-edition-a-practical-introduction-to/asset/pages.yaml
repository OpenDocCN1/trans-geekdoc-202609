    # How Things Can Go Wrong


    A downside of elliptic curves is their relative complexity. The greater number
    of parameters than for RSA or classic Diffie–Hellman leaves a larger attack surface
    and more possibilities for design errors and implementation bugs. ECC implementations
    can also be vulnerable to side-channel attacks, especially their big-number arithmetic—for
    example, when the calculation time depends on secret values.


    In the following sections, I discuss three examples of vulnerabilities that can
    occur with elliptic curves, even when the implementation is safe.


    # ECDSA with Bad Randomness


    ECDSA signing is randomized, as it involves a secret random number k when setting
    s = (h + rd) / k mod n. However, if you reuse the same k to sign a second message,
    an attacker could combine the resulting values, s₁ = (h₁ + rd) / k and s₂ = (h₂
    + rd) / k, to get s₁ − s₂ = (h₁ − h₂) / k and then k = (h₁ − h₂) / (s₁ − s₂).
    When you know k, you can easily recover the private key d by computing the following:


    (k s₁ − h₁) / r = ((h₁ + r d) − h₁) / r = r d / r = d


    Unlike RSA signatures, which won’t allow the key to be recovered if using a weak
    PRNG, the use of nonrandom numbers can lead to ECDSA’s k being recoverable, as
    happened with the attack on the PlayStation 3 game console in 2010, presented
    by the fail0verflow team at the 27th chaos Communication Congress in Berlin, Germany.
    They discovered that the same k was reused to sign different games and were then
    able to find the signing key, which made it possible to sign any program to authorize
    it to run on the console.


    # Invalid Curve Attacks


    You can elegantly break ECDH if input points are not properly validated. The primary
    reason is that the formulas that give the coordinates for the sum of points P
    + Q never involve the b coefficient of the curve; instead, they rely only on the
    coordinates of P and Q and the a coefficient (when doubling a point). The unfortunate
    consequence is that when adding two points, you can’t be sure you’re working on
    the right curve because you may actually be adding points on a different curve
    with a different b coefficient. That means you can break ECDH, as the following
    scenario, the invalid curve attack, describes.


    Say that Alice and Bob are running ECDH and agreed on a curve and a base point,
    G. Bob sends his public key bG to Alice. Alice, instead of sending a public key
    aG on the agreed upon curve, sends a point on a different curve, either intentionally
    or accidentally. Unfortunately, this new curve is'
