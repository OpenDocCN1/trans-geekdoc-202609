- pgno: 274
  md: 'otherwise, you may end up with an insecure curve. In practice, you’ll use an
    established curve for encryption, but knowing what makes a safe curve will help
    you choose among the several available ones and better understand any associated
    risks. Here are some points to keep in mind:


    +   - The order of the group shouldn’t be a product of small numbers; otherwise,
    solving ECDLP becomes much easier.

    +   - In “The Addition Law” on page 235, you learned that adding points $P + Q$
    required a specific addition formula when $Q = P$. Unfortunately, treating this
    case differently from the general one may leak critical information if an attacker
    can distinguish doublings from additions between distinct points. Some curves
    are secure because they use a single formula for all point addition. (When a curve
    doesn’t require a specific formula for doublings, it admits a *unified addition
    law*.)

    +   - If the creators of a curve don’t explain the origin of $a$ and $b$, they
    may be suspected of foul play because you can’t know whether they’ve chosen weaker
    values that enable some yet-unknown attack on the cryptosystem.


    Let’s review some of the most common curves, especially ones used for signatures
    or Diffie–Hellman key agreement.


    > **NOTE** You’ll find more criteria and details about curves on https://safecurves.cryp.to.


    # NIST Curves


    In 2000, NIST standardized several curves in the FIPS 186 document under “Recommended
    Elliptic Curves for Federal Government Use.” Five NIST curves, called *prime curves*,
    work modulo a prime number (see “Elliptic Curves over Integers” on page 233).
    Ten other NIST curves work with binary polynomials, mathematical objects that
    make implementation in hardware more efficient. (I won’t cover binary polynomials
    in further detail because they’re seldom used with elliptic curves.)


    The most common NIST curves are the prime curves. Of these, one of the most common
    is P-256, a curve that works over numbers modulo the 256-bit number $p = 2^{256}
    - 2^{224} + 2^{192} + 2^{96} - 1$. The equation for P-256 is $y^2 = x^3 - 3x +
    b$, where $b$ is a 256-bit number. NIST also provides prime curves of 192 bits,
    224 bits, 384 bits, and 521 bits (this isn’t a typo; it’s 521, not 512).


    NIST curves are sometimes criticized because only the NSA, creator of the curves,
    knows the origin of the $b$ coefficient in their equations. The explanation they’ve
    provided is that $b$ results from hashing a random-looking constant with SHA-1.
    For example, P-256’s $b$ parameter comes from the following constant: `c49d3608
    86e70493 6a6678e1 139d26b7 819f7e90`. No one knows why the NSA picked this particular
    constant, but most experts don’t believe the curve’s origin hides any weakness.'
