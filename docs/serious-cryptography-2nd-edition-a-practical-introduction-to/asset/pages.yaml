- pgno: 134
  md: 'We compute these four lines from top to bottom, meaning that the new value
    of *b* depends on *a* and on *d*, the new value of *c* depends on *a* and on the
    new value of *b* (and thus *d* as well), and so on.


    The operation `<<<` is wordwise left-rotation by the specified number of bits,
    which can be any value between 1 and 31 (for 32-bit words). For example, `<<<
    8` rotates a word’s bits of eight positions toward the left, as the following
    examples show:


    ```

    0x01234567 <<< 8  = 0x23456701

    0x01234567 <<< 16 = 0x45670123

    0x01234567 <<< 22 = 0x59c048d1

    ```


    # Transforming Salsa20’s 512-Bit State


    Salsa20’s core permutation transforms a 512-bit internal state viewed as a 4×4
    array of 32-bit words. Figure 5-11 shows the initial state, using a key of eight
    words (256 bits), a nonce of two words (64 bits), a counter of two words (64 bits),
    and four fixed constant words (128 bits) that are identical for each encryption/decryption
    and all blocks.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_134_0.png)


    To transform the initial 512-bit state, Salsa20 first applies the **QR** transform
    to all four columns independently (known as the *column-round*) and then to all
    four rows independently (the *row-round*), as Figure 5-12 illustrates. The sequence
    column-round/row-round is a *double-round*. Salsa20 repeats 10 double-rounds,
    for 20 rounds in total, which is the reason for the 20 in *Salsa20*.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_134_1.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The column-round transforms the four columns like so:


    ```

    **QR**(x₀, x₄, x₈, x₁₂)

    **QR**(x₁, x₅, x₉, x₁₃)

    **QR**(x₂, x₆, x₁₀, x₁₄)

    **QR**(x₃, x₇, x₁₁, x₁₅)

    ```


    The row-round transforms the rows by doing the following:


    ```

    **QR**(x₀, x₁, x₂, x₃)

    **QR**(x₅, x₆, x₇, x₄)

    **QR**(x₁₀, x₁₁, x₈, x₉)

    **QR**(x₁₅, x₁₂, x₁₃, x₁₄)

    ```


    In a column-round, each **QR** takes xᵢ arguments ordered from the top to the
    bottom line, whereas a row-round''s **QR** takes as a first argument the words
    on the diagonal (as in the array on the right in Figure 5-12) rather than words
    from the first column.


    # Evaluating Salsa20


    Listing 5-3 shows Salsa20''s initial states for the first and second blocks when
    initialized with an all-zero key (00 bytes) and an all-one nonce (ff bytes). These
    two states differ in only 1 bit, in the counter, which is in bold: specifically,
    0 for the first block and 1 for the second.


    61707865 00000000 00000000 00000000   61707865 00000000 00000000 00000000

    00000000 3320646e ffffffff ffffffff   00000000 3320646e ffffffff ffffffff

    00000000 00000000 79622d32 00000000   00000001 00000000 79622d32 00000000

    00000000 00000000 00000000 6b206574   00000000 00000000 00000000 6b206574


    *Listing 5-3: Salsa20''s initial states for the first two blocks with an all-zero
    key and an all-one nonce*


    Yet, despite only a 1-bit difference, the respective internal states after 10
    double-rounds are totally different from each other, as Listing 5-4 shows.


    e98680bc f730ba7a 38663ce0 5f376d93   1ba4d492 c14270c3 9fb05306 ff808c64

    85683b75 a56ca873 26501592 64144b6d   b49a4100 f5d8fbbd 614234a0 e20663d1

    6dcb46fd 58178f93 8cfs4cfe cfdc27d7   12e1e116 6a61bc8f 86f01bcb 2efe4da

    68bbe09e 17b403a1 38aa1f27 54323fe0   77775a13 d17b9d95 eb773f5b 2c3a5e7d


    *Listing 5-4: The states from Listing 5-3 after 10 Salsa20 double-rounds*


    But remember, even though word values in the keystream block may look random,
    it''s far from a guarantee of security. RC4''s output looks random, but it has
    blatant biases. Fortunately, Salsa20 is much more secure than RC4 and doesn''t
    have statistical biases. Keep in mind, however, that even when keystreams are
    statistically indistinguishable from perfectly random bytes, this isn''t sufficient
    to achieve cryptographic security.'
