- pgno: 138
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_138_0.png)


    Figure 5-13: The principle of the attack on Salsa20/8


    In the actual attack on Salsa20/8, to determine the correct guess we need to guess
    220 bits of the key, and we need 2^31 pairs of keystream blocks, all with the
    same specific difference in the nonce. Once we single out the correct 220 bits,
    we brute-force 36 bits. The brute-forcing takes 2^36 operations, a computation
    that is dwarfed by the unrealistic 2^220 × 2^31 = 2^251 trials needed to find
    the 220 bits to complete the first part of the attack.


    # How Things Can Go Wrong


    Alas, many things can go wrong with stream ciphers, from brittle, insecure designs
    to strong algorithms incorrectly implemented. I''ll explore each category of potential
    problems in the following sections.


    # Nonce Reuse


    The most common failure with stream ciphers occurs when reusing a nonce more than
    once with the same key. This produces identical keystreams, allowing you to break
    the encryption—for example, by XORing two ciphertexts together; the keystream
    then vanishes, and you''re left with the XOR of the two plaintexts.


    A real example is older versions of Microsoft Word and Excel that used a unique
    nonce for each document, but modifying a document didn''t change the nonce. As
    a result, one could use the clear and encrypted text of an older version of a
    document to decrypt later encrypted versions. If Microsoft made this blunder,
    you can imagine how large the problem might be.


    Certain stream ciphers designed in the 2010s tried to mitigate the risk of nonce
    reuse by building “misuse-resistant” constructions, or ciphers that remain secure
    even if a nonce is used twice. However, achieving this level of security comes
    with a performance penalty, as you''ll see in Chapter 8 with the SIV mode.


    # Broken RC4 Implementation


    Though it''s intrinsically weak, RC4 can become even weaker if you blindly optimize
    its implementation. For example, let''s consider an entry in the 2007 Underhanded
    C Contest, an informal competition where programmers write benign-looking code
    that actually includes a malicious function.'
