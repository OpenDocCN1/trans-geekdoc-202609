  md: 'to recover the secret, you can define the operation Lagrange(s₁, s₂, . . .
    , sₜ) returning the shared secret s. This works for any combination of t distinct
    shares, not necessarily the first t ones. The details of the Lagrange() operation
    are a bit too technical for this book, but you can implement it as a series of
    basic additions, multiplications, and inverses.


    # The Trivial Case


    One of the simplest types of threshold signature uses the BLS signature, as viewed
    earlier in the context of aggregate signatures. Recall that given a private key
    k, BLS signatures compute a signature by multiplying k with the curve point H
    = H(M). You can use additive sharing to create a threshold scheme with parameters
    (n − 1, n). For example, if n = 3, split the key into three shares such that k₁
    + k₂ + k₃ = k. Each party then computes their share of the signature by multiplying
    their share kᵢ with H. Adding the three shares then yields the following:


    k₁H + k₂H + k₃H = (k₁ + k₂ + k₃)H = kH


    Combining the three shares via addition gives a valid signature with k, even if
    none of the parties knows k. The parties could also recover k if they add their
    respective shares, but adding the shares of two parties reveals no information
    on k if the shares were randomly generated.


    To create a threshold signature scheme with arbitrary t and n, use the Shamir
    secret-sharing technique and leverage the linearity of the Lagrange() operation:
    you generate the key shares kᵢ as described in the “Threshold Sharing” section
    and compute the signature like so:


    Lagrange(k₁H, k₂H, k₃H) = Lagrange(k₁, k₂, k₃)H = kH


    Again, you obtain a valid signature with the key k.


    # The Simple Case


    You’ll now compute Schnorr signatures in the threshold setting, which is a bit
    more technical than with BLS signatures. Recall the Schnorr scheme computes a
    signature as s = r + h a, where h = H(R || A || M), r is the per-signature random
    nonce, and a is the signer’s private key. The signature also includes R = r G,
