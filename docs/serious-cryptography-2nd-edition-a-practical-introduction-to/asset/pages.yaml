    # The ECDLP Problem


    Chapter 9 introduced the discrete logarithm problem (DLP): that of finding the
    number \(y\) given some base number \(g\), where \(x = g^y \bmod p\) for some
    large prime number \(p\). Cryptography with elliptic curves has a similar problem
    of finding the number \(k\) given a base point \(P\) where the point \(Q = kP\).
    This is the elliptic curve discrete logarithm problem. Instead of numbers, the
    elliptic curve’s problems operate on points and use multiplication instead of
    exponentiation.


    About all elliptic curve cryptography is built on the ECDLP problem, which, like
    DLP, is believed to be hard and has withstood cryptanalysis since its introduction
    in 1985. One important difference from the classical DLP is that ECDLP allows
    you to work with smaller numbers and still enjoy a similar level of security.


    Generally, when the parameter \(p\) is \(n\)-bit, ECC gets you a security level
    of about \(n/2\) bits. For example, an elliptic curve taken over numbers modulo
    a 256-bit \(p\) gives a security level of about 128 bits. For the sake of comparison,
    to achieve a similar security level with DLP or RSA, you need to use numbers of
    several thousands of bits. Using smaller numbers for ECC arithmetic is one reason
    why it’s often faster than RSA or classical Diffie–Hellman.


    One approach to solving ECDLP is to find a collision between two outputs, \(c_1P
    + d_1Q\) and \(c_2P + d_2Q\). The points \(P\) and \(Q\) in these equations are
    such that \(Q = kP\) for some unknown \(k\), and \(c_1\), \(d_1\), \(c_2\), and
    \(d_2\) are the numbers you need to find \(k\).


    As with the hash function in Chapter 6, a collision occurs when two different
    inputs produce the same output. Therefore, to solve ECDLP, you need to find points
    where the following is true:


    $$c_1P + d_1Q = c_2P + d_2Q$$


    Assuming you’ve found the four coefficients, you’re going to recover \(k\). For
    this, replace \(Q\) with the value \(kP\), and you have the following:


    $$c_1P + d_1kP = (c_1 + d_1k)P = c_2P + d_2kP = (c_2 + d_2k)P$$


    This tells you that \((c_1 + d_1k)\) equals \((c_2 + d_2k)\) when taken modulo
    the number of points on the curve, which isn’t a secret.


