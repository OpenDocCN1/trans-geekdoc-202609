  md: 'to have about as many possible values as elements in Z_p* and therefore as
    many possible values for the shared secret. To ensure the highest security, safe
    DH parameters should work with a prime p such that (p − 1)/2 is also prime. Such
    a safe prime guarantees that the group doesn’t have small subgroups that would
    make DH easier to break. With a safe prime, DH can work with any element in Z_p*,
    excepting 1 and p − 1; notably, g = 2 makes computations slightly faster. But
    generating a safe prime p takes more time than generating a totally random one.


