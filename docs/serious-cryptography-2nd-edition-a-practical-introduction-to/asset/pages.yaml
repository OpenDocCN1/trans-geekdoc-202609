- pgno: 172
  md: 'If SHA-256 is the hash function used as Hash, then you call the HMAC instance
    HMAC-SHA-256. More generally, you call HMAC-Hash an HMAC instance using the hash
    function Hash. That means if someone asks you to use HMAC, you should always ask,
    “Which hash function?”


    # A Generic Attack Against Hash-Based MACs


    There is one attack that works against all MACs based on an iterated hash function.
    Recall the attack in “The Secret-Suffix Construction” on page 143 where we used
    a hash collision to get a collision of MACs. You can use the same strategy to
    attack a secret-prefix MAC or HMAC, though the consequences are less devastating.


    Figure 7-2 illustrates the secret-prefix MAC Hash(K || M).


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_172_0.png)


    Figure 7-2: The principle of the generic forgery attack on hash-based MACs


    If the digest is n bits, you can find two messages, M1 and M2, such that Hash(K
    || M1) = Hash(K || M2), by requesting approximately 2^{n/2} MAC tags to the system
    holding the key. (Recall the birthday attack from Chapter 6.) If the hash lends
    itself to length extension, as SHA-256 does, you can then use M1 and M2 to forge
    MACs by choosing some arbitrary data, M3, and then querying the MAC oracle for
    Hash(K || M1 || M3), which is the MAC of message M1 || M3. As it turns out, this
    is also the MAC of message M2 || M3 because the hash’s internal state of M1 and
    M3 and M2 and M3 is the same. You’ve successfully forged a MAC tag. (The effort
    becomes infeasible as n grows beyond, say, 128 bits.)


    This attack works even if the hash function isn’t vulnerable to length extension,
    and it works for HMAC, too. This is because all that’s required is an internal
    collision in the hash function and not necessarily in the complete hash. The cost
    of the attack depends on both the size of the chaining value and the MAC’s length:
    if a MAC’s chaining value is 512 bits and its tags are 128 bits, a 2^{64} computation
    would find a MAC collision but probably not a collision in the internal state,
    since finding such a collision requires 2^{512/2} = 2^{256} operations on average.'
