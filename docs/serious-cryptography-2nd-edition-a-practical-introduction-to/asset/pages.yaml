- pgno: 336
  md: '6. They both compute R = R_A + R_B and s = s_A + s_B and return (R, s) as the
    signature.


    To verify a signature, check that sG equals R + h(A + B). Substituting s in sG
    by the previously computed value results in the following:


    sG = (s_A + s_B) G = (r_A + h a + r_B + h b) G

    = (r_A + r_B) G + h(a + b) G = R + h(A + B)


    Note that the verifier needs to know both A and B, and not only their sum A +
    B, because they need both values to compute H(R || A || B || M). However, if h
    is instead defined as H(R || A + B || M), a verifier can use a single public key
    A + B without knowing that the signature is issued by two parties. We call the
    “merging” of multiple public keys into one key aggregation. This is particularly
    useful to reduce the size of the data to hash when there are many signers.


    > NOTE

    > I''ve described basic Schnorr multisignatures in the case of two parties, but
    the protocol scales to an arbitrary number of parties with public keys P1, P2,
    . . . , Pn. In the definition, replace A + B with P1 + P2 + . . . + Pn, replace
    A || B with P1 || P2 || . . . || Pn, and replace “sends it to Bob/Alice” with
    “sends it to everyone.” You can apply a similar protocol to EdDSA and Ed25519,
    variants of Schnorr’s scheme.


    # How Things Can Go Wrong


    The Schnorr multisignature protocol is relatively simple but may fail in the following
    attack scenarios.


    # Key Cancellation Attack


    In this attack, Bob convinces signature verifiers that he jointly signed a message
    with Alice, whereas Alice hasn’t seen the message and didn’t interact with Bob.
    An attacker could exploit this in a scenario where you expect Alice and Bob to
    jointly sign messages—for example, in transactions that require both parties’
    approval. In the normal case, the verifiers would know Alice’s public key A and
    Bob’s public key B, and Bob and Alice would know each other’s keys.


    Now suppose the following happens: Alice sends her public key A to everyone including
    Bob, but instead of sharing his public key B, Bob shares C = B − A = (b − a)G
    with the verifiers, and B with Alice. That Bob doesn’t know the private key corresponding
    to C won’t matter for the attack.


    Bob has to sign a message using his private key b, as in the single-signer case,
    but with h = H(R || A || C || M), as if he were signing with Alice. He returns
    (R, s) as a signature, with R = rG for an r of his choice and s = r + h b.


    Expecting signatures from Alice and Bob, verifiers check that sG equals R + h(A
    + C), which is correct because A + C = A + (B − A) = B. Bob can therefore forge
    multisignature without even interacting with Alice and without knowing her private
    key.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'In practice, you can avoid this attack by requesting signers to prove the knowledge
    of the private key—for example, by signing a message. Since Bob doesn''t know
    the private key corresponding to C, he can''t provide such evidence. As you''ll
    see with the MuSig protocol, you can also avoid the attack at the protocol level.


    The attack scales to an arbitrary number of parties, a context that''s often called
    a rogue key attack. Having received the public keys of all other parties, an attacker
    Bob would just define his public key as B − X, with X the sum of all other parties''
    public keys.


    # Repeated Nonces


    Like in ECDSA, repeated nonces are lethal to the Schnorr multisignature protocol.
    Imagine that Alice''s pseudorandom generator fails and she generates the same
    secret nonce r_A twice in two runs of the protocol: she sends an initial s_A =
    r_A + h a to Bob, and a second s_A'' = r_A + h'' a where the first h and the second
    h'' also depend on Bob''s randomness. You thus have r_A = h a − s_A and r_A =
    h'' a − s_A'', which implies h a − s_A = h'' a − s_A'' or, equivalently,


    a(h − h'') = s_A − s_A''


    from which you can compute Alice''s private key a = (s_A − s_A'') / (h − h'').


    One approach to eliminate security risks caused by a randomness failure is to
    get rid of randomness. For example, computing the nonce by hashing the message
    and the private key as in Ed25519 works when there''s a single signer. However,
    setting r to H(a || M) won''t work in the case of multisignatures: if Alice and
    Bob sign the same message twice, then Alice computes a first s_A = r_A + h a and
    a second s_A'' = r_A + h'' a, where in both cases r_A = H(a || M), where h'' will
    be distinct from h if a malicious Bob sends a different value than H(b || M).
    In this case, Bob—and any eavesdropper of the communications—can again compute
    a as (s_A − s_A'') / (h − h'').


    # Parallel Execution Insecurity


    The Schnorr multisignature protocol is insecure when the attacker can initiate
    multiple simultaneous signature protocols. The attack is too complicated to describe
    here but is documented in the research articles available at https://eprint.iacr.org/2018/417
    and https://eprint.iacr.org/2020/945.


    # Safer Schnorr Multisignatures


    To avoid the key cancellation attack and repeated nonce issues, researchers developed
    more advanced multisignature protocols and in particular the MuSig protocols:
    MuSig, MuSig2, and MuSig-DN, where MuSig stands for multisignature and DN for
    deterministic nonce. MuSig protocols also support key aggregation to allow a verifier
    to check a signature using only one public key that''s derived from the signers''
    keys, such that the aggregated key doesn''t reveal the number of signers or their
    public keys.'
