  md: '# Attacker Models


    Both parties can potentially be attackers attempting to compromise soundness and
    zero-knowledge, respectively:


    **Malicious provers** Want to prove a false statement—for example, to wrongly
    convince the verifier that they know a solution to some hard problem. Such an
    attacker can deviate from the protocol to try to fool the verifier. In practice,
    this is the greatest threat to ZKPs in applications like confidential program
    execution.


    **Malicious verifiers** Want to extract information about the secret (the *witness*),
    thereby breaking the zero-knowledge property. Attacker models distinguish *passive*
    verifier attackers (honest-but-curious) and *active* verifier attackers (who can
    arbitrarily deviate from the protocol).


    Note that malicious verifiers can challenge completeness by claiming they aren’t
    convinced by the truth of a statement. In practice, this isn’t an issue, as the
    prover can repeat the proof protocol for other (honest) verifiers who would expose
    the lying verifier.


    # Schnorr’s Protocol


    Claus-Peter Schnorr, who created the eponymous signature scheme, also described
    a similar construction that is a zero-knowledge *proof of knowledge of a discrete
    logarithm*. It’s the basis for Schnorr’s and EdDSA signatures, as well as for
    many more complex ZKPs.


    Schnorr’s protocol works in three steps to prove the knowledge of *a* such that
    *aG = A*—that is, the discrete logarithm of *A* with respect to the generator
    *G*:


    +   1. *Commitment*: The prover picks a random number *r* and sends *R = rG*.

    +   2. *Challenge*: The verifier sends a random number *c*.

    +   3. *Response*: The prover sends *s = r + ca*, and the verifier accepts if
    and only if *sG = R + cA*.


    **NOTE** *This kind of three-step protocol, with a commitment, a challenge, and
    a response, is called a sigma protocol, after the shape of the uppercase Greek
    letter sigma (Σ).*


    The *completeness* of Schnorr’s protocol is the easiest to verify: if *a* satisfies
    *aG = A*, you’ll have


    *sG = (r + ca)G = rG + caG = R + cA*


    which is the prover’s validation condition.


