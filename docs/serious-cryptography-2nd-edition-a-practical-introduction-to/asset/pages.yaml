  md: 'such as encryption, signature, and key agreement faster than their classical
    counterparts. Most cryptographic applications that rely on the discrete logarithm
    problem (DLP) also work when based on its elliptic curve counterpart, ECDLP, with
    one notable exception: the Secure Remote Password (SRP) protocol.


    This chapter focuses on applications of ECC and discusses when and why to use
    ECC over RSA or classical Diffie–Hellman, as well as how to choose the right elliptic
    curve for your application.


    # What Is an Elliptic Curve?


    An elliptic curve is a *curve* on a plane—a set of points with x- and y-coordinates.
    A curve’s equation defines all the points that belong to that curve. For example,
    the curve y = 3 is a horizontal line with the vertical coordinate 3, curves of
    the form y = ax + b with fixed numbers a and b are straight lines, x² + y² = 1
    is a circle of radius 1 centered on the origin, and so on. Whatever the type of
    curve, the points on a curve are (x, y) pairs that satisfy the curve’s equation.


    In cryptography, an elliptic curve typically has an equation in the form y² =
    x³ + ax + b (the *Weierstrass form*), where the constants a and b define the shape
    of the curve. For example, Figure 12-1 shows the elliptic curve that satisfies
    the equation y² = x³ − 4x.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_259_0.png)


    Figure 12-1: An elliptic curve with the equation y² = x³ − 4x, shown over the
    real numbers'
