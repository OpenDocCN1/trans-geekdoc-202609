- pgno: 168
  md: '# Replay Attacks


    MACs aren’t safe from attacks involving *replays* of tags. For example, if you
    were to eavesdrop on Alex and Bill’s communications, you could capture a message
    and its tag sent by Alex to Bill and later send them again to Bill pretending
    to be Alex. To prevent such *replay attacks*, protocols include a message number
    in each message. This number is incremented for each new message and authenticated
    along with the message by the MAC. The receiving party gets messages numbered
    1, 2, 3, 4, and so on. Thus, if an attacker tries to send message 1 again, the
    receiver notices that this message is out of order and that it’s a potential replay
    of the earlier message 1.


    # Pseudorandom Functions


    A PRF uses a secret key to return **PRF**(*K*, *M*), such that the output looks
    random. Because the key is secret, the output values are unpredictable to an attacker.


    Unlike MACs, PRFs are not meant to be used on their own but as part of a cryptographic
    algorithm or protocol. For example, you can use PRFs to create block ciphers within
    the Feistel construction—see “How to Construct Block Ciphers” in Chapter 4. Key
    derivation schemes use PRFs to generate cryptographic keys from a master key or
    password, and identification schemes use PRFs to generate a response from a random
    challenge. (Basically, a server sends a random challenge message, *M*, and the
    client returns **PRF**(*K*, *M*) in its response to prove that it knows *K*.)
    The 5G telephony standard uses a PRF to authenticate a SIM card and its service
    provider, and a similar PRF generates the encryption key and MAC key to be used
    during a phone call. The TLS protocol uses a PRF to generate key material from
    a master secret as well as session-specific random values. There’s even a PRF
    in the noncryptographic hash() function built into the Python language to compare
    objects.


    # PRF Security


    To be secure, a pseudorandom function should have no pattern that sets its outputs
    apart from truly random values. An attacker who doesn’t know the key, *K*, shouldn’t
    be able to distinguish the outputs of **PRF**(*K*, *M*) from random values. Viewed
    differently, an attacker shouldn’t have any means of knowing whether they’re talking
    to a PRF algorithm or to a random function. The erudite phrase for that security
    notion is “ indistinguishability from a random function.” (To learn more about
    the theoretical foundations of PRFs, see Volume 1, Section 3.6 of Goldreich’s
    *Foundations of Cryptography*.)


    # PRFs Are Stronger Than MACs


    PRFs and MACs are keyed hashes, but PRFs are fundamentally stronger than MACs
    because MACs have weaker security requirements. Whereas you'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'would consider a MAC secure if an attacker can''t forge tags—that is, if they
    can''t guess the MAC''s outputs—a PRF is secure only if its outputs are indistinguishable
    random strings. If you can''t distinguish a PRF''s outputs from random strings,
    this implies their values can''t be guessed; in other words, any secure PRF is
    also a secure MAC.


    The converse is not true, however: a secure MAC isn''t necessarily a secure PRF.
    For example, say you start with a secure PRF, PRF1, and you want to build a second
    PRF, PRF2, from it, like this:


    PRF2(K, M) = PRF1(K, M) || 0


    Because PRF2''s output is defined as PRF1''s output followed by one 0 bit, it
    doesn''t look as random as a true random string, and you can distinguish its outputs
    by that last 0 bit. Hence, PRF2 is not a secure PRF. However, because PRF1 is
    secure, PRF2 would still make a secure MAC. If you were able to forge a tag, T
    = PRF2(K, M), for some M, then you''d also be able to forge a tag for PRF1, which
    you know to be impossible in the first place because PRF1 is a secure MAC. Thus,
    PRF2 is a keyed hash that''s a secure MAC but not a secure PRF.


    But don''t worry: you won''t find such MAC constructions in real applications.
    In fact, many of the deployed or standardized MACs are also secure PRFs and are
    often used as either. For example, TLS uses the algorithm HMAC-SHA-256 both as
    a MAC and as a PRF.


    # How to Create Keyed Hashes from Unkeyed Hashes


    Throughout cryptography''s history, MACs and PRFs have rarely been designed from
    scratch but rather have been built from existing algorithms, usually hash functions
    or block ciphers. It might seem obvious that you can produce a keyed hash function
    by feeding an (unkeyed) hash function a key and a message, but this is easier
    said than done.


    # The Secret-Prefix Construction


    The first technique we''ll examine, the secret-prefix construction, turns a normal
    hash function into a keyed hash by prepending the key to the message and returning
    Hash(K || M). This approach is insecure when the hash function is vulnerable to
    length-extension attacks (see “The Length-Extension Attack” in Chapter 6) and
    when the hash supports keys of different lengths.


    # Insecurity Against Length-Extension Attacks


    Recall from Chapter 6 that hash functions of the SHA-2 family allow attackers
    to compute the hash of a partially unknown message when given a hash of a shorter
    version of that message. In formal terms, the length-extension attack allows attackers
    to compute Hash(K || M1 || M2) given only Hash(K || M1) and neither M1 nor K.
    These functions allow attackers to forge valid MAC tags for free because they
    shouldn''t be able to guess'
