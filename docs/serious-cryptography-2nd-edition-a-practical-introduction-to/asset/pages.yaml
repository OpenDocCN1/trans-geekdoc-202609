    # Threshold Signature Protocols


    Threshold signatures differ from multisignatures and aggregate signatures— which
    require all participants in the signing protocol to have their own public and
    private key—in that there’s a single private key k and a single public key P,
    and there are n participants that each has a distinct share of the key k_i where
    a parameter t (the threshold) is defined such that t < n and:


    +   - t + 1 signers can jointly issue a valid signature of some message that is
    verified using the public key P, in such a way that no signer learns the private
    key k. This is done by running a protocol that uses the shares k_i of each signer
    and the message to be signed, without ever exposing the private key to any party.

    +   - A set of t signers or fewer can’t create a signature and therefore can’t
    determine the private key k either.


    The issued signature looks like a normal, single-signer signature and verifies
    as such.


    Threshold signatures are a specific type of multiparty computation (MPC), a class
    of protocols wherein n participants compute the output of some function f(x_1,
    x_2, …, x_n) such that each participant knows their respective input x_i and learns
    the output of the function but doesn’t learn the other participants’ x_i inputs.
    In the case of threshold signatures, the x_i’s are shares of the private key,
    and the output is a signature. I’ll elaborate on what a share is in the “Secret-Sharing
    Techniques” section on page 319.


    Threshold signatures have the benefit of “hiding” the number of co-signers and
    their identities, as verifiers see only a signature from a single private key.
    While some multisignature and aggregate signature schemes share this property,
    threshold signatures better suit the use case of crypto asset custody because
    there’s only one private key and one public key; you can directly apply threshold
    signatures to distribute control of any address.


    # Use Cases


    Threshold signatures are used in cryptocurrency and digital asset management to
    distribute control of an address across multiple systems or parties. They can
    serve to share control of an account between a service provider and a user’s device:
    each party has one share of the key and must run a protocol together to sign a
    transaction, thus spending funds. This setup ensures that an attacker can’t autonomously
    authorize transactions, even if they breach the user’s device and obtain the key
    shares. Similarly, the provider can’t initiate transactions without the user’s
    consent. However, implementing this model reliably poses challenges, particularly
    key management aspects (key generation, key rotation, backups, and so on).'
