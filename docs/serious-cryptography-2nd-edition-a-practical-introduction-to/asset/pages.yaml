    Factoring may be slightly easier than solving **NP-hard** problems in theory,
    but as far as cryptography is concerned, it’s hard enough, and even more reliable
    than **NP-hard** problems. Indeed, it’s easier to build cryptosystems on top of
    the factoring problem than search versions of **NP-complete** problems because
    it’s difficult to know exactly how hard it is to break a cryptosystem based on
    such problems—in other words, how many bits of security you’d get. As mentioned
    earlier, this relates to the fact that **NP** concerns worst-case hardness, and
    cryptographers are looking for average-case hardness.


    The factoring problem is one of several problems you can use in cryptography as
    a *hardness assumption*, which is an assumption that some problem is computationally
    hard. You can use this assumption when proving that breaking a cryptosystem’s
    security is at least as hard as solving said problem. Another problem you can
    use as a hardness assumption, the *discrete logarithm problem (DLP)*, is actually
    a family of problems.


    # The Discrete Logarithm Problem


    The Discrete Logarithm Problem (DLP) predates the factoring problem in the official
    history of cryptography. Whereas RSA appeared in 1977, another cryptographic breakthrough,
    the Diffie–Hellman key agreement (see Chapter 11), came about a year earlier,
    grounding its security on the hardness of the DLP. Like the factoring problem,
    the DLP deals with large numbers, but it’s less straightforward and requires more
    math than factoring. Let’s begin by introducing the mathematical notion of a group
    in the context of discrete logarithms.


    # Groups


    In a mathematical context, a *group* is a set of elements (typically, numbers)
    that relate to each other according to certain well-defined rules. An example
    of a group is the set of nonzero integers modulo a prime number *p* (that is,
    numbers between 1 and *p* − 1) with modular multiplication being the group operation.
    We note such a group as \(\mathbb{Z}_p^*\), or just \(\mathbb{Z}_p^*\) when it’s
    clear that the group operation is multiplication.


    For *p* = 5, you get the group \(\mathbb{Z}_5^* = \{1, 2, 3, 4\}\). In the group
    \(\mathbb{Z}_5^*\), operations are carried out modulo 5; hence, you don’t have
    3 × 4 = 12 but instead 3 × 4 = 2, because 12 mod 5 = 2. You can nonetheless use
    the same sign (×) that you use for normal integer multiplication. You can also
    use the exponent notation to denote a group element’s multiplication with itself
    mod *p*, a common operation in cryptography. For example, in the context of \(\mathbb{Z}_5^*\),
    \(2^3 = 2 × 2 × 2 = 3\) rather than 8, because 8 mod 5 is equal to 3.'
