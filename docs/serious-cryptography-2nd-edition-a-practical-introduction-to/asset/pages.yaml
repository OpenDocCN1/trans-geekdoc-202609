    # Semantically Secure Encryption


    One of the simplest constructions of a semantically secure cipher uses a deterministic
    random bit generator (DRBG), an algorithm that returns random-looking bits given
    some secret value:


    E(K, R, P) = (DRBG(K || R) ⊕ P, R)


