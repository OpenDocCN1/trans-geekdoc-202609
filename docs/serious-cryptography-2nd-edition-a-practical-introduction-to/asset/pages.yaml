    # How to Implement AES


    Real AES software works differently than the algorithm in Figure 4-4. You won’t
    find production-level AES code calling a SubBytes() function, then a ShiftRows()
    function, and then a MixColumns() function because that would be inefficient.
    Instead, fast AES software uses table-based implementations and native instructions.


    # Table-Based Implementations


    Table-based implementations of AES replace the sequence SubBytes-ShiftRows-MixColumns
    with a combination of XORs and lookups in tables hardcoded into the program and
    loaded in memory at execution time. This is possible because MixColumns is equivalent
    to XORing four 32-bit values, where each depends on a single byte from the state
    and on SubBytes. Thus, you can build four tables with 256 entries each, one for
    each byte value, and implement the sequence SubBytes-MixColumns by looking up
    four 32-bit values and XORing them together.


    For example, the table-based C implementation in the OpenSSL toolkit looks like
    Listing 4-2.


    ```

    /* Round 1: */

    t0 = Te0[s0 >> 24] ^ Te1[(s1 >> 16) & 0xff] ^ Te2[(s2 >> 8) & 0xff] ^ Te3[s3 &
    0xff] ^ rk[4];

    t1 = Te0[s1 >> 24] ^ Te1[(s2 >> 16) & 0xff] ^ Te2[(s3 >> 8) & 0xff] ^ Te3[s0 &
    0xff] ^ rk[5];

    t2 = Te0[s2 >> 24] ^ Te1[(s3 >> 16) & 0xff] ^ Te2[(s0 >> 8) & 0xff] ^ Te3[s1 &
    0xff] ^ rk[6];

    t3 = Te0[s3 >> 24] ^ Te1[(s0 >> 16) & 0xff] ^ Te2[(s1 >> 8) & 0xff] ^ Te3[s2 &
    0xff] ^ rk[7];

    /* Round 2: */

    s0 = Te0[t0 >> 24] ^ Te1[(t1 >> 16) & 0xff] ^ Te2[(t2 >> 8) & 0xff] ^ Te3[t3 &
    0xff] ^ rk[8];

    s1 = Te0[t1 >> 24] ^ Te1[(t2 >> 16) & 0xff] ^ Te2[(t3 >> 8) & 0xff] ^ Te3[t0 &
    0xff] ^ rk[9];

    s2 = Te0[t2 >> 24] ^ Te1[(t3 >> 16) & 0xff] ^ Te2[(t0 >> 8) & 0xff] ^ Te3[t1 &
    0xff] ^ rk[10];

    s3 = Te0[t3 >> 24] ^ Te1[(t0 >> 16) & 0xff] ^ Te2[(t1 >> 8) & 0xff] ^ Te3[t2 &
    0xff] ^ rk[11];

    --snip--

    ```


    Listing 4-2: An excerpt of the table-based C implementation of AES in OpenSSL


    A basic table-based implementation of AES encryption needs four 4KB’s worth of
    tables because each table stores 256 32-bit values, which occupy 256 × 32 = 8,192
    bits, or 1KB. Decryption requires another four tables and thus 4KB more. But there
    are tricks to reduce the storage from 4KB to 1, or even less.'
