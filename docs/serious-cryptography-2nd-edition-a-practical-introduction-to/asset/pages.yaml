- pgno: 339
  md: "# # Pairings\n\nIn elliptic curve cryptography, a *pairing* is an operation\
    \ that transforms two points from two elliptic curve groups (not necessarily the\
    \ same) into a finite field element. The standard notation for a pairing between\
    \ two elliptic curve points *P* and *Q* is *e(P, Q)*. Pairings used in cryptography\
    \ have the property called *bilinearity* and are thus called *bilinear pairings*,\
    \ which means they satisfy the following for any points *P*, *Q*, and *R*:\n\n\
    $$e(P + R, Q) = e(P, Q) \\times e(R, Q)$$\n\n$$e(P, Q + R) = e(P, Q) \\times e(P,\
    \ R)$$\n\nHere, adding a point *R* to an operand is equivalent to multiplying\
    \ the result by the pairing between *R* and the other operand. Consequently, if\
    \ you add a point to itself *n* times—that is, if you multiply it by a number\
    \ *n*—then you have\n\n$$e(nP, Q) = e(P, Q) \\times e(P, Q) \\times \\ldots \\\
    times e(P, Q) = e(P, Q)^n$$\n\nor *e(P, Q)* multiplied by itself *n* times, which\
    \ is also equal to *e(P, nQ)*.\n\nIf you have different points *P₁, P₂, …, Pₙ*,\
    \ you can turn addition of the input values into multiplication of the output\
    \ values:\n\n$$e(P_1 + P_2 + \\ldots + P_n, Q) = e(P_1, Q) \\times e(P_2, Q) \\\
    times \\ldots \\times e(P_n, Q)$$\n\nThe internals of how pairings work is beyond\
    \ this book’s scope. For more details, see the article “Cryptographic Pairings”\
    \ by Kristin Lauter and Michael Naehrig (*https://eprint.iacr.org/2017/1108*)\
    \ and the book *Guide to Pairing-Based Cryptography* by Nadia El Mrabet and Marc\
    \ Joye (Chapman and Hall/CRC, 2016).\n\n# ## BLS Signatures\n\nBLS signatures\
    \ were presented in 2006 in the article “Short Signatures from the Weil Pairing”\
    \ by Dan Boneh, Ben Lynn, and Hovav Shacham. It stated that the scheme was designed\
    \ “for systems where signatures are typed in by a human or signatures are sent\
    \ over a low-bandwidth channel.” BLS signatures turned out to be used in highly\
    \ automated systems over high-bandwidth channels, which benefited from a property\
    \ described in a subsequent paper: aggregation of signatures and of public keys.\n\
    \n> > **NOTE**  \n> > Don’t confuse BLS signatures with BLS (Barreto–Lynn–Scott)\
    \ curves, which have an author (Lynn) in common. BLS curves are elliptic curves\
    \ designed to be pairing friendly, allowing secure and efficient pairing operations.\
    \ In fact, BLS signatures often work with points over a BLS curve. For example,\
    \ the Ethereum BLS signature relies on the curve BLS12-381."
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Single-Signer Signature and Verification


    In BLS signatures, Alice''s private key is a scalar number a, and her public key
    is A = aG, for a predefined base point G. To sign a message M, she first computes
    H = H(M), where the hash function returns a curve point rather than a bit string
    or a scalar—the H notation follows the general convention that you denote points
    as capital letters. The signature is then S = aH. This looks much simpler than
    a Schnorr''s or an ECDSA signature: just hash the message and multiply the result
    with the private key.


    To verify a BLS signature, compute two pairing operations:


    +   - e(A, H) between the public key and the hashed message (note that A = aG)

    +   - e(G, S) between the base point and the signature (note that S = aH)


    These values should be equal because of the pairing''s bilinearity property:


    $e(A, H) = e(aG, H) = e(G, H)^a = e(G, aH) = e(G, S)$


    If the equality holds, the signature is accepted; otherwise, it''s rejected.


    Ignoring the complexity of the pairing operation, such pairing-based signatures
    are the simplest signature scheme.


    # Aggregate Signatures from Multiple Signers


    Let''s further exploit the magic of BLS signatures and bilinear pairings, considering
    a scenario wherein n signers with private keys k1, k2, . . . , kn and public keys
    P1, P2, . . . , Pn sign n messages M1, M2, . . . , Mn and produce the signatures
    S1, S2, . . . , Sn. Note that Hi = H(Mi) is the hash of the ith message.


    You can aggregate signatures Si = kiHi into one by adding them to obtain S = S1
    + S2 + . . . + Sn. Observe that computing e(G, S), as in the verification of a
    single signature, results in the following, owing to the bilinearity property:


    $e(G, S) = e(G, S1 + S2 + . . . + Sn) = e(G, S1) \times e(G, S2) \times . . .
    \times e(G, Sn)$


    Remember that pairings satisfy e(nP, Q) = e(P, nQ). You can thus replace each
    e(G, Si) term with e(Pi, Hi) by “moving” the multiplicative factor ki to the left
    operand of the pairing: the first operand will thus be kiG = Pi instead of G,
    and the second will be Hi instead of Si = kiHi.


    After aggregating multiple signatures of multiple signers over multiple messages
    into a single signature, you can verify the aggregate signature from the signers''
    public keys and messages signed. Verification just checks the equality between
    e(G, S) and the product of all pairings e(Pi, Hi). There are 1 + n pairings to
    compute, rather than the 2n pairings if you hadn''t aggregated the signatures—in
    this case, the signatures occupy n times as much memory as the aggregated one.


    Let''s consider a scenario where you''ll aggregate both signatures and public
    keys.'
