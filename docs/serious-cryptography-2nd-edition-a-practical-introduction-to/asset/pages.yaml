  md: 'A variant of this attack works when you know only that the message is signed,
    and not the correct signature. There’s also a similar fault attack on the modulus
    value, rather than on the CRT values computation, but I won’t go into detail on
    that here.


    # Shared Private Exponents or Moduli


    Now I’ll show you why your public key shouldn’t have the same modulus *n* as that
    of someone else.


    Private keys belonging to different systems or people should have different private
    exponents, *d*, even if the keys use different moduli. Or you could try your own
    value of *d* to decrypt messages encrypted for other entities, until you hit one
    that shares the same *d*. By the same token, different key pairs should have different
    *n* modulus values, even if they have different *d*s, because *p* and *q* are
    usually part of the private key. Hence, if I share the same *n* and thus the same
    *p* and *q*, I can compute your private key from your public key *e* using *p*
    and *q*.


    Imagine that you know your private exponent *d₁* and the public exponent *e₂*
    of another person with whom you share the same modulus *n*, but without knowing
    its factors *p* and *q*. How can you calculate *p* and *q* from your private exponent
    *d₁* to find the private exponent *d₂* of the other person? The solution is a
    bit technical but elegant.


    Remember that *d* and *e* satisfy *ed = kφ(n) + 1*, where φ(*n*) is secret and
    could reveal *p* and *q*. You don’t know *k* or φ(*n*), but you can compute *kφ(n)
    = ed − 1*.


    What can you do with *kφ(n)*? According to *Euler’s theorem*, for any number *a*
    coprime with *n*, you have *a*<sup>φ(n)</sup> ≡ 1 mod *n*. Therefore, modulo *n*
    you have the following:


    $$a^{k\varphi(n)} = \left(a^{\varphi(n)}\right)^k = 1^k = 1 \pmod n$$


    Because *kφ(n)* is an even number, you can write it as 2<sup>s</sup>*t* for some
    numbers *s* and *t*. That is, you’ll be able to write *a*<sup>kφ(n)</sup> = 1
    mod *n* under the form *x*<sup>2</sup> = 1 mod *n* for some *x* easily computed
    from *kφ(n)*. You can call such an *x* a *root of unity*.


    The key observation is that *x*<sup>2</sup> = 1 mod *n* is equivalent to saying
    that the value *x*<sup>2</sup> − 1 = (*x* − 1)(*x* + 1) divides *n*. In other
    words, *x* − 1 or *x* + 1 must have a common factor with *n*, which can give you
    the factorization of *n*.


    Listing 10-7 shows a Python implementation of this method where, to find the factors
    *p* and *q* from *n* and *d*, I use small, 64-bit numbers for the sake of simplicity.


    ```

    ```python

    from math import gcd


    n = 36567232109354321

    e = 13771927877214701

    d = 15417970063428857

    ```

