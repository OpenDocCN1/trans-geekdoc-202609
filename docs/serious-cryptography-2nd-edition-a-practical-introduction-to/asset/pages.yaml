- pgno: 161
  md: 'BLAKE2 was designed with the following ideas in mind:


    +   - It should be at least as secure as SHA-3, if not stronger.

    +   - It should be faster than all previous hash standards, including MD5.

    +   - It should be suited for use in modern applications and able to hash large
    amounts of data either as a few large messages or as many small ones, with or
    without a secret key.

    +   - It should be suited for use on modern CPUs supporting parallel computing
    on multicore systems as well as instruction-level parallelism within a single
    core.


    The outcome of the engineering process is a pair of main hash functions:


    +   - BLAKE2b (or just BLAKE2), optimized for 64-bit platforms, produces digests
    ranging from 1 to 64 bytes.

    +   - BLAKE2s, optimized for 8- to 32-bit platforms, produces digests ranging
    from 1 to 32 bytes.


    Each function has a parallel variant that can leverage multiple CPU cores. The
    parallel counterpart of BLAKE2b, BLAKE2bp, runs on four cores, whereas BLAKE2sp
    runs on eight cores. The former is the fastest on modern server and laptop CPUs
    and can hash at close to 2Gbps on a laptop CPU. BLAKE2''s speed and features have
    made it the most popular non-NIST-standard hash. BLAKE2 is used in countless software
    applications and has been integrated into major cryptography libraries such as
    OpenSSL and Sodium. BLAKE2 is also an Internet Engineering Task Force (IETF) standard,
    described in RFC 7693.


    **NOTE** *You can find BLAKE2''s specifications and reference code at https://blake2.net,
    and you can download optimized code and libraries from https://github.com/BLAKE2.
    The reference code also provides BLAKE2X, an extension of BLAKE2 that can produce
    hash values of arbitrary length.*


    As Figure 6-8 illustrates, BLAKE2''s compression function is a variant of the
    Davies–Meyer construction that takes parameters as additional input—namely, a
    *counter* (which ensures that each compression function behaves like a different
    function) and a *flag* (which indicates whether the compression function is processing
    the last message block, for increased security).


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_161_0.png)


    *Figure 6-8: BLAKE2''s compression function. The two halves of the state are XORed
    together after the block cipher.*'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'The block cipher in BLAKE2''s compression function is based on the stream cipher
    ChaCha, itself a variant of the Salsa20 stream cipher discussed in Chapter 5.
    Within this block cipher, BLAKE2b''s core operation is composed of the following
    chain of operations, which transforms a state of four 64-bit words using two message
    words, M_i and M_j:


    ```

    a = a + b + M_i

    d = ((d ⊕ a) >>> 32)

    c = c + d

    b = ((b ⊕ c) >>> 24)

    a = a + b + M_j

    d = ((d ⊕ a) >>> 16)

    c = c + d

    b = ((b ⊕ c) >>> 63)

    ```


    BLAKE2''s core operation is similar but works with 32-bit instead of 64-bit words
    (and thus uses different rotation values).


    Last but not least, BLAKE3 is a more parallelizable, simpler, more versatile,
    and faster version of BLAKE2 that was presented in 2020 at the Real World Crypto
    conference. Designed by Jack O''Connor, Samuel Neves, Zooko Wilcox-O''Hearn, and
    myself, BLAKE3 has quickly become one of the most popular hash functions, thanks
    to its undeniable advantages. For more details, see https://github.com/BLAKE3-team/BLAKE3.


    # How Things Can Go Wrong


    Despite their apparent simplicity, hash functions can cause major security troubles
    when used at the wrong place or in the wrong way—for example, when using weak
    checksum algorithms like CRCs instead of a crypto hash to check file integrity
    in applications transmitting data over a network. However, this weakness pales
    in comparison to others, which can cause total compromise in seemingly secure
    hash functions. You''ll see two examples of failures: the first one applies to
    SHA-1 and SHA-2 but not to BLAKE2 or SHA-3, whereas the second one applies to
    all four of these functions.


    # The Length-Extension Attack


    Figure 6-9 shows the length-extension attack, which is the main threat to the
    Merkle–Damgård construction.'
