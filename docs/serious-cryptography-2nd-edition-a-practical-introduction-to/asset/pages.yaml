- pgno: 277
  md: 'weak and allows Alice to choose a point *P* for which solving ECDLP is easy.
    She chooses a point of low order, for which there’s a relatively small *k* such
    that *kP = O*.


    Bob, believing that he has a legitimate public key, computes what he thinks is
    the shared secret *bP*, hashes it, and uses the resulting key to encrypt data
    sent to Alice. When Bob computes *bP*, he’s unknowingly computing on the weaker
    curve. As a result, because *P* was chosen to belong to a small subgroup within
    the larger group of points, the result *bP* also belongs to that small subgroup,
    allowing an attacker to determine the shared secret *bP* efficiently if they know
    the order of *P*.


    One way to prevent this is to confirm points *P* and *Q* belong to the right curve
    by ensuring their coordinates satisfy the curve’s equation. This ensures you’re
    able to work on only the secure curve.


    Such an invalid curve attack was found in 2015 on certain implementations of the
    TLS protocol, which uses ECDH to negotiate session keys. (For details, see the
    paper “Practical Invalid Curve Attacks on TLS-ECDH” by Tibor Jager, Jörg Schwenk,
    and Juraj Somorovsky.)


    # Incompatible Ed25519 Validation Rules


    You saw that Ed25519 is a signature scheme optimized to offer both efficiency
    and high security guarantees. The designers of Ed25519 described how it works
    in detail in a scientific paper and published a well-coded reference implementation.
    The algorithm was specified as an IETF standard in RFC 8032. One would expect
    there to be only one version of Ed25519 and different implementations to work
    in exactly the same way: for a given input value, they should all behave identically
    and return the same result.


    Unfortunately, this is not the case. As cryptographer Henry de Valence documented
    in the article “It’s 25519: JAM. Do You Know What Your Validation Criteria Are?”
    (see *https://hdevalence.ca/blog/2020-10-04-its-25519am*), different implementations
    of Ed25519 have different criteria for what constitutes a valid signature. Indeed,
    RFC 8032 doesn’t fully describe the validation criteria—and many implementations
    don’t even comply with it.


    Of the 15 implementations in de Valence’s article, each had its own validation
    criteria. In particular, the validation of points *R* (of the signature) and *A*
    (the public key) is often different, as is the verification of the equality between
    *s × B* and *R + Hash(R, A, M) × A*. Divergences can occur at several levels,
    including the encoding of points (how you assemble bytes to describe their coordinates)
    and the validation that points belong to the right subgroup.


    As a result, different implementations of the same scheme could behave differently—for
    example, in a blockchain network where signatures would be accepted by some nodes
    but rejected by others, a problem for a consensus protocol. All details are explained
    in de Valence’s blog post.'
