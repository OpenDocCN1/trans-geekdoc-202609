    Figure 12-4: The geometric rule for adding a point and its negative, or P + (-P)
    = O, when the line between the points never intersects the curve


    # Doubling a Point


    When P = Q (that is, P and Q are at the same position), adding P and Q is equivalent
    to computing P + P, or 2P. This addition operation is called a *doubling*.


    To find the coordinates of the result R = 2P, you can’t use the geometric rule
    from the previous section, because you can’t draw a line between P and itself.
    Instead, you draw the line *tangent* to the curve at P, and 2P is the negation
    of the point where this line intersects the curve, as Figure 12-5 demonstrates.'
