  md: 'format and isn''t weak. It also helps to efficiently derive a nonce from the
    key and the message, which replaces the use of a per-signature random value like
    in ECDSA.


    Signing then works as follows, from a 256-bit private key k and a message M of
    arbitrary size, and given a base point B:


    +   1. Compute a || h = Hash(k), for a hash function producing 512-bit values,
    where the first 256 bits form the private scalar a and the last 256 bits form
    the string h.

    +   2. Define the public key as A = aB (in practice, this is precomputed).

    +   3. Compute the message''s “pre-hash” r = Hash(h || M) and compute the elliptic
    curve point R = rB, which is the first part of the signature, the signature point.

    +   4. Compute the number S = r + Hash(R, A, M) × a, the second part of the signature.


    The signature returned is the pair (R, S).


    The computation bottleneck is thus the scalar-point multiplication rB, for a fixed
    base point B. When messages are long, the cost of hashing the message twice may
    be significant too. However, unlike in ECDSA, you don’t have to compute a modular
    inverse.


    In practice, you can optimize implementations—for example, to avoid recomputing
    the public key for every signature. You must also set values to the right type
    (such as numbers subject to modular reduction) and encode them in a reliable and
    nonambiguous format (like curve points).


    # EdDSA Verification


    Given a signature (R, S), a message M, a public key A, and a base point B, verification
    consists of checking that SB equals R + Hash(R, A, M)A. Note that SB = S × B.


    If you replace S by its expression evaluated in step 4, SB is equal to the following
    values:


    (r + Hash(R, A, M) × a) × B = rB + Hash(R, A, M) × aB


    In this expression, you know that rB = R and aB = A. You thus end up with the
    expected result, R + Hash(R, A, M) × A.


    Compared to ECDSA, you avoid the computation of a modular inverse. Like ECDSA,
    you need two scalar-point multiplications (SB and Hash(R, A, M)A).


    # Ed25519


    Ed25519 is a specific instance of EdDSA with the following parameters:


    +   - A *twisted Edwards curve* based on Curve25519, which you''ll see in the
    next section

    +   - SHA-512 as a hash function

    +   - A based point B chosen to optimize efficiency'
