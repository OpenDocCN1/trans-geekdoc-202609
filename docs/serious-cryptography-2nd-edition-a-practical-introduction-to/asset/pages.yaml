  md: "# Curve25519\n\nDaniel J. Bernstein brought Curve25519 (usually pronounced\
    \ *curve-twenty-five-five-nineteen*) to the world in 2006. Motivated by performance,\
    \ he designed Curve25519 to be faster and use shorter keys than the standard curves.\
    \ But Curve25519 also brings security benefits; unlike the NIST curves, it has\
    \ no suspicious constants and can use the same unified formula for adding distinct\
    \ points or for doubling a point.\n\nThe form of Curve25519’s equation, $y^2 =\
    \ x^3 + 486662x^2 + x$, is slightly different from the other equations in this\
    \ chapter, but it still belongs to the elliptic curve family. The unusual form\
    \ of this equation allows for specific implementation techniques that make Curve25519\
    \ fast in software.\n\nCurve25519 works with numbers modulo $2^{255} - 19$, a\
    \ prime number that’s as close as possible to $2^{255}$. The $b$ coefficient 486662\
    \ is the smallest integer that satisfies the security criteria set by Bernstein.\
    \ Taken together, these features make Curve25519 more trustworthy than NIST curves\
    \ and their fishy coefficients.\n\nCurve25519 is used everywhere—for example,\
    \ in WhatsApp, TLS 1.3, OpenSSH, and many other systems. Following this success,\
    \ Curve25519 was added to the list of NIST-approved curves in February 2023, as\
    \ part of the document SP 800-186, “Recommendations for Discrete Logarithm-based\
    \ Cryptography: Elliptic Curve Domain Parameters.”\n\n> **NOTE**\n> \n> For the\
    \ details and rationale behind Curve25519, view the 2016 presentation “The First\
    \ 10 Years of Curve25519” by Daniel J. Bernstein at https://cr.yp.to/talks.html#2016.03.09.\n\
    \n# Other Curves\n\nAs I write this, most cryptographic applications use NIST\
    \ curves or Curve25519 (including via Ed25519), but there are other legacy standards\
    \ in use, and newer curves are being promoted and pushed within standardization\
    \ committees. Old national standards include France’s ANSSI curves and Germany’s\
    \ Brainpool curves: two families that don’t support complete addition formulas\
    \ and that use constants of unknown origins.\n\nSome newer curves are more efficient\
    \ than the older ones and are clear of any suspicion; they offer different security\
