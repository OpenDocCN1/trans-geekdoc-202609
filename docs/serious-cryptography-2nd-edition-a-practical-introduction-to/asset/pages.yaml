    random strings. So we conclude that ciphertexts can''t be distinguished from random
    strings and therefore that the cipher is secure.


    **NOTE** *As an exercise, try to determine what other security notions are satisfied
    by the cipher **E**(K, R, P) = (**DRBG**(K || R) ⊕ P, R). Is it NM-CPA? IND-CCA?
    You''ll find the answers in the next section.*


    # Security Notions Comparisons


    You''ve learned that attack models such as CPA and CCA are combined with security
    goals such as NM and IND to build the security notions NM-CPA, NM-CCA, IND-CPA,
    and IND-CCA. How are these notions related? Can we prove that satisfying notion
    X implies satisfying notion Y?


    Some relations are obvious: IND-CCA implies IND-CPA, and NM-CCA implies NM-CPA
    because anything a CPA attacker can do, a CCA attacker can do as well. That is,
    if you can''t break a cipher by performing chosen-ciphertext and chosen-plaintext
    queries, you can''t break it by performing only chosen-plaintext queries.


    A less obvious relation is that IND-CPA does not imply NM-CPA. To understand this,
    observe that the previous IND-CPA construction (**DRBG**(K, R) ⊕ P, R) is not
    NM-CPA: given a ciphertext (X, R), you can create the ciphertext (X ⊕ 1, R), which
    is a valid ciphertext of P ⊕ 1, thus contradicting the notion of nonmalleability.


    But the opposite relation holds: NM-CPA implies IND-CPA. The intuition is that
    IND-CPA encryption is like putting items in a bag: you don''t get to see them,
    but you can rearrange their positions in the bag by shaking it up and down. NM-CPA
    is more like a safe: once inside, you can''t interact with what you put in there.
    This analogy doesn''t work for IND-CCA and NM-CCA, which are equivalent notions
    that each imply the presence of the other. I''ll spare you the proof, which is
    pretty technical.


    # TWO TYPES OF ENCRYPTION APPLICATIONS


    There are two main types of encryption applications. *In-transit encryption* protects
    data sent from one machine to another: data is encrypted before being sent and
    decrypted after being received, as in encrypted connections to e-commerce websites.
    *At-rest encryption* protects data stored on an information system. Data is encrypted
    before being written to memory and decrypted before being read. Examples include
    disk encryption systems on laptops as well as virtual machine encryption for cloud
    virtual instances. The security notions we''ve seen apply to both types of applications,
    but the right notion to consider may depend on the application.'
