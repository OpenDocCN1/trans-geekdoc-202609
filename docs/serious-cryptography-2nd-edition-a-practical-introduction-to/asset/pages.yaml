    when we say “random bits,” we actually mean randomly generated bits.


    What do random bits look like? For example, the 8-bit string 11010110 might look
    more random than 00000000, although both have the same chance of being generated
    (namely, 1/256). The value 11010110 looks more random than 00000000 because it
    has the signs typical of a randomly generated value. That is, 11010110 has no
    obvious pattern.


    When we see the string 11010110, our brain registers that it has 3 zeros and 5
    ones, just like 55 other 8-bit strings (11111000, 11110100, 11110010, and so on),
    but only one 8-bit string has 8 zeros. Because the pattern 3-zeros-and-5-ones
    is more likely to occur than the pattern 8-zeros, we identify 11010110 as random
    and 00000000 as nonrandom, even if they’re not.


    This example illustrates two types of errors people often make when identifying
    randomness:


    +   - **Mistaking nonrandomness for randomness** Thinking that an object was randomly
    generated simply because it *looks random*

    +   - **Mistaking randomness for nonrandomness** Thinking that patterns appearing
    by chance are there for a reason other than chance


    The distinction between random-looking and actually random is crucial. Indeed,
    in crypto, nonrandomness is often synonymous with insecurity.


    The saying “it happened by chance” reflects the property that from a complex system
    (in this case, our universe that obeys the laws of physics, deterministic at the
    macroscopic level and truly random at the subatomic, quantum level) can emerge
    specific patterns, such as the string 00000000. By the law of large numbers, if
    many events occur, some won’t look random—such as a series of sequential numbers
    in a lottery draw. Many pseudosciences and belief systems are in fact cases of
    mistaking randomness for nonrandomness.


    # Randomness as a Probability Distribution


    Any randomized process is characterized by a *probability distribution*, which
    gives all there is to know about the randomness of the process. A probability
    distribution, or simply *distribution*, lists the outcomes of a randomized process
    where each outcome is assigned a probability.


    A *probability* measures the likelihood of an event occurring. It’s expressed
    as a real number between 0 and 1 where a probability of 0 means impossible and
    a probability of 1 means certain. For example, when tossing a two-sided coin,
    each side has a 1/2 (or 0.5) probability of landing face up, and the probability
    of a coin landing on its edge has a probability close to 0.


    A probability distribution must include all possible outcomes such that the sum
    of all probabilities is 1. Specifically, if there are *N* possible events, there
    are *N* probabilities *p*₁, *p*₂, . . . , *p*ₙ with *p*₁ + *p*₂ + . . . + *p*ₙ
    = 1. In the case of the coin toss, the distribution is 1/2 for heads and 1/2 for
    tails. The sum'
