    # On the Second Edition


    This second edition of *Serious Cryptography* comes seven years after the first
    edition. Since then, cryptography has experienced significant changes. Nowadays,
    the term *crypto* often conjures thoughts of blockchain, Bitcoin, and other cryptocurrencies,
    rather than cryptography itself. Despite the debatable societal benefits of these
    technologies, their undeniable influence on the advancement of cryptography research
    and engineering can''t be overlooked. Recognizing this, I''ve written Chapter
    15, “Cryptocurrency Cryptography,” which delves into fascinating cryptographic
    techniques employed in blockchain applications, representing some of the most
    intriguing advancements in the field of cryptography.


    I''ve made substantial changes to each chapter, updating the text with respect
    to new cryptography developments and improving the text''s clarity and conciseness.
    Among the most significant additions: Chapter 2''s discussion of Linux kernel
    randomness was updated to describe the new behavior of the */dev/random* and */dev/urandom*
    interfaces, Chapter 12 features a new section on the EdDSA and Ed25519 signature
    schemes, and Chapter 14 presents NIST''s Post-Quantum Cryptography Standardization
    project.'
