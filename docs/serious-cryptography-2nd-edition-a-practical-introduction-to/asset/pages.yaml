- pgno: 304
  md: '# Amplitudes of Groups of Qubits


    How do we understand multiple qubits? For example, eight qubits can form a *quantum
    byte* when the quantum states of these eight qubits are connected via entanglement.
    You can describe such a quantum byte as follows, where the αs are the amplitudes
    associated with each of the 256 possible values of the group of eight qubits:


    α₀|00000000⟩ + α₁|00000001⟩ + α₂|00000010⟩ + α₃|00000011⟩ + … + α₂₅₅|11111111⟩


    Note that you must have |α₀|² + |α₁|² + … + |α₂₅₅|² = 1 so that all probabilities
    sum to 1.


    You can view this group of eight qubits as a set of 2⁸ = 256 amplitudes because
    it has 256 possible configurations, each with its own amplitude.


    In physical reality, however, you’d have eight physical objects, not 256. The
    256 amplitudes are an implicit characteristic of the group of eight qubits; each
    of these 256 numbers can take any of infinitely many different values. Generalizing,
    you can characterize a group of n qubits by a set of 2ⁿ complex numbers, a number
    that grows exponentially with the numbers of qubits.


    If you want to simulate the evolution of a quantum state using a classical computer,
    you need to store this exponential number of amplitudes and perform calculations
    to modify them. This requirement is one of the main reasons why a classical computer
    can’t efficiently simulate a quantum computer: doing so requires a gigantic amount
    of memory (of the order of 2ⁿ) to store the same amount of information contained
    in just n qubits using a quantum system. In practice, you can simulate a maximum
    of 50 or 60 qubits, depending on the type of calculation.


    # Quantum Gates


    The concepts of amplitude and *quantum gates* are unique to quantum computing.
    A quantum gate is essentially a transformation of one or more qubits, and it’s
    the counterpart of electronic gates in the quantum computing realm. Whereas a
    classical computer uses registers, memory, and a microprocessor to perform a sequence
    of instructions on data, a quantum computer transforms a group of qubits reversibly
    by applying a series of quantum gates and then measures the value of one or more
    qubits. Quantum computers promise more computing power because with only n qubits
    they can affect the values of 2ⁿ amplitudes. This property has profound implications.


    From a mathematical standpoint, quantum algorithms are essentially a circuit of
    quantum gates that transforms a set of complex numbers (the amplitudes) before
    a final measurement, where the value of 1 or more qubits is observed (see Figure
    14-3).'
