  md: 'Here are some examples of **NP**-complete problems:


    # **The traveling salesman problem**


    Given a set of points on a map (such as cities) with the distances between each
    point from each other point and given a maximum distance x, decide whether there
    is a path that visits every point such that the total distance is smaller than
    x. (Note that you can find such a path with essentially the same complexity as
    the decision problem, but deciding whether a path is optimal is not in **NP**,
    because you can’t efficiently verify a solution’s correctness.)


    # **The clique problem**


    Given a number, x, and a graph (a set of nodes connected by edges, as in Figure
