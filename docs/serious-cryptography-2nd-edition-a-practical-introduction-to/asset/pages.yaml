- pgno: 256
  md: 'not a key itself. And it shouldn’t be. A symmetric key should look random,
    and each bit should either be 0 or 1 with the same probability. But $g^{ab}$ is
    not a random string; it’s a random element within some mathematical group whose
    bits may be biased toward 0 or 1. A random group element is different from a random
    string of bits.


    Imagine, for example, that you’re working within the multiplicative group $\mathbb{Z}_{13}^{*}
    = \{1, 2, 3, . . . , 12\}$ using $g = 2$ as a generator of the group, meaning
    that $g^i$ spans all values of $\mathbb{Z}_{13}^{*}$ for $i$ in 1, 2, . . . 12:
    $g^1 = 2$, $g^2 = 4$, $g^3 = 8$, $g^4 = 3$, and so on. If $g$’s exponent is random,
    you’ll get a random element of $\mathbb{Z}_{13}^{*}$, but the encoding of a $\mathbb{Z}_{13}^{*}$
    element as a 4-bit string won’t be uniformly random: not all bits will have the
    same probability of being a 0 or a 1. In $\mathbb{Z}_{13}^{*}$, seven values have
    0 as their most significant bit (the numbers from 1 to 7 in the group), but only
    five have 1 as their most significant bit (from 8 to 12). That is, this bit is
    0 with probability 7/12 ≈ 0.58, whereas a random bit should ideally be 0 with
    probability 0.5. Moreover, the 4-bit sequences 1101, 1110, and 1111 will never
    appear.


    To avoid such biases in the session keys derived from a DH shared secret, use
    a cryptographic hash function such as BLAKE3 or SHA-3—or, better yet, a key derivation
    function (KDF). An example of KDF construction is HKDF, or HMAC-based KDF (as
    specified in RFC 5869), but today BLAKE2 and SHA-3 feature dedicated modes to
    behave as KDFs.


    # Anonymous Diffie–Hellman from TLS 1.0


    The TLS protocol is the security behind HTTPS secure websites as well as many
    other protocols, such as email transfer with the Simple Mail Transfer Protocol
    (SMTP). TLS takes several parameters, including the type of Diffie–Hellman protocol
    it will use. For backward compatibility reasons, TLS supports anonymous DH since
    version 1.0 up to version 1.2 (that is, without any server authentication), though
    not in version 1.3. As DH is secure against only passive attackers, it can give
    a false impression of security.


    The original documentation of TLS describes the risks of this protocol ([https://www.rfc-editor.org/rfc/rfc2246](https://www.rfc-editor.org/rfc/rfc2246)):


    > Completely anonymous connections only provide protection against passive eavesdropping.
    Unless an independent tamper-proof channel is used to verify that the finished
    messages were not replaced by an attacker, server authentication is required in
    environments where active man-in-the-middle attacks are a concern.


    # Unsafe Group Parameters


    In January 2016, the maintainers of the OpenSSL toolkit fixed a high-severity
    vulnerability (CVE-2016-0701) that allowed an attacker to exploit unsafe Diffie–Hellman
    parameters. The root cause of the vulnerability was that OpenSSL allowed users
    to work with unsafe DH group parameters'
  merge: -1
