- pgno: 142
  md: '# 6


    # HASH FUNCTIONS


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_142_0.png)


    Hash functions—such as SHA-256, SHA3, and BLAKE3—compose the cryptographer’s Swiss
    Army Knife: they are used in digital signatures, public-key encryption, integrity
    verification, message authentication, password protection, key agreement protocols,
    and many other cryptographic protocols.


    Whether you’re encrypting an email, sending a message on your mobile phone, connecting
    to an HTTPS website, or connecting to a remote machine through a virtual private
    network (VPN) or Secure Shell (SSH), a hash function is somewhere under the hood.


    Hash functions are by far the most versatile and ubiquitous of all crypto algorithms.
    Their applications include the following: cloud storage systems use them to identify
    identical files and to detect modified files; the Git revision control system
    uses them to identify files in a repository; endpoint detection and response (EDR)
    systems use them to detect modified files; network-based intrusion detection systems
    (NIDSs) use hashes'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'to detect known-malicious data going through a network; forensic analysts use
    hash values to prove that digital artifacts have not been modified; Bitcoin uses
    a hash function in its proof-of-work systems—and there are many more.


    Unlike stream ciphers, which create a long output from a short one, hash functions
    take a long input and produce a short output, called a hash value or digest (see
    Figure 6-1).


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_143_0.png)


    Figure 6-1: A hash function''s input and output


    This chapter revolves around two main topics. First, security: What does it mean
    for a hash function to be secure? To that end, I introduce two essential notions—collision
    resistance and preimage resistance. The second topic revolves around hash function
    construction. I explain the high-level techniques modern hash functions use and
    then review the internals of the most common hash functions: SHA-1, SHA-2, SHA-3,
    and BLAKE2. Finally, you see how secure hash functions can behave insecurely if
    misused.


    NOTE Don''t confuse cryptographic hash functions with noncryptographic ones. You
    use noncryptographic hash functions in data structures such as hash tables or
    to detect accidental errors, and they provide no security whatsoever. For example,
    cyclic redundancy checks (CRCs) are noncryptographic hashes you use to detect
    accidental modifications of a file.


    # Secure Hash Functions


    The notion of security for hash functions is different from what we’ve discussed
    thus far. Whereas ciphers protect data confidentiality in an effort to guarantee
    that data sent in the clear can’t be read, hash functions protect data integrity
    in an effort to guarantee that data—whether sent in the clear or encrypted—hasn’t
    been modified. If a hash function is secure, two distinct pieces of data should
    always have different hashes. A file’s hash can thus serve as its identifier.


    Consider the most common application of a hash function: digital signatures, or
    just signatures. When using digital signatures, applications process the hash
    of the message to be signed rather than the message itself, as Figure 6-2 illustrates.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '![](img/ace4de942d037de8ea5835bc9fbe57cd_144_0.png)


    Figure 6-2: A hash function in a digital signature scheme, wherein the hash acts
    as a proxy for the message


    The hash acts as an identifier for the message. If even a single bit is changed
    in the message, the hash of the message will be totally different. The hash function
    thus helps ensure that the message hasn''t been modified. Signing a message''s
    hash is as secure as signing the message itself, and signing a short hash of,
    say, 256 bits is much faster than signing a message that may be very large. In
    fact, most signature algorithms work only on short inputs such as hash values.


    # Unpredictability Again


    The cryptographic strength of hash functions stems from the unpredictability of
    their outputs. Take the following 256-bit hexadecimal values; you compute these
    hashes using the NIST standard hash function SHA-256 with the ASCII letters a,
    b, and c as inputs. Though the values a, b, and c differ by only 1 or 2 bits (a
    is the bit sequence 01100001, b is 01100010, and c is 01100011), their hash values
    are completely different:


    ```

    SHA-256("a") = ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb

    SHA-256("b") = 3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d

    SHA-256("c") = 2e7d2c03a9507ae265ecf5b5356885a53393a2029d241394997265a1a25aefc6

    ```


    Given only these three hashes, it''s impossible to predict the value of the SHA-256
    hash of d or any of its bits because hash values of a secure hash function are
    unpredictable. A secure hash function should be like a black box that returns
    a random string each time it receives an input.


    The general, theoretical definition of a secure hash function is that it behaves
    like a truly random function (sometimes called a random oracle). Specifically,
    a secure hash function shouldn''t have any property or pattern that a random function
    wouldn''t have. This definition is helpful for theoreticians, but in practice
    we need more specific notions, namely, preimage resistance and collision resistance.


    # Preimage Resistance


    A preimage of a given hash value, H, is any message, M, such that Hash(M) = H.
    Preimage resistance describes the security guarantee that given a random hash
    value, an attacker will never find a preimage of that hash value. Indeed, you
    can sometimes call hash functions one-way functions because you can go from the
    message to its hash but not the other way around.'
