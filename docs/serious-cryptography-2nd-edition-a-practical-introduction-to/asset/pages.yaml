- pgno: 119
  md: 'returns us to this initial value. We say that 5 is the period of the FSR given
    any one of the values 1100, 1000, 0001, 0011, or 0110. Because the period of this
    FSR is 5, clocking the register 10 times yields twice the same 5-bit sequence.
    Likewise, if you clock the register 20 times, starting from 1100, the output bits
    will be 11000110001100011000, or four times the same 5-bit sequence of 11000.
    Intuitively, such repeating patterns should be avoided, and a longer period is
    better for security.


    NOTE If you plan to use an FSR in a stream cipher, avoid one with short periods,
    which make the output more predictable. With some types of FSRs, it''s easy to
    figure out their period, but it''s almost impossible to do so with others.


    Figure 5-4 shows the structure of this cycle, along with the other cycles of that
    FSR, with each cycle being a circle whose dots represent a state of the register.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_119_0.png)


    Figure 5-4: Cycles of the FSR whose feedback function XORs the 4 bits together


    Indeed, this particular FSR has two other period-5 cycles—{0100, 1001, 0010, 0101,
    1010} and {1111, 1110, 1101, 1011, 0111}. Note that any given state can belong
    to only one cycle of states. Here, we have three cycles of five states each, covering
    15 of the 2^4 = 16 possible values of our 4-bit register. The 16th possible value
    is 0000, which, as Figure 5-4 shows, is a period-1 cycle because the FSR transforms
    0000 to 0000.


    An FSR is essentially a register of bits, where each update of the register outputs
    a bit (the leftmost bit of the register) and where a function computes the new
    rightmost bit of the register. (All other bits are left-shifted.) The period of
    an FSR, from some initial state, is the number of updates needed until the FSR
    enters the same state again. If it takes N updates to do so, the FSR will produce
    the same N bits again and again.'
