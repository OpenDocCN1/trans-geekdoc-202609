  md: '# Cryptographic vs. Noncryptographic PRNGs


    There are cryptographic and noncryptographic PRNGs. Noncrypto PRNGs are designed
    to produce uniform distributions for applications such as scientific simulations
    or video games. However, you should never use noncrypto PRNGs in crypto applications,
    because they’re insecure; they’re concerned only with the quality of the bits’
    probability distribution and not with their predictability. Crypto PRNGs, on the
    other hand, are unpredictable because they’re also concerned with the strength
    of the underlying operations used to deliver well-distributed bits.


    Unfortunately, most PRNGs exposed by programming languages—such as libc’s rand
    and drand48, PHP’s rand and mt_rand, Python’s random module, and Java’s java.util.Random
    class—are noncryptographic. Defaulting to a noncrypto PRNG is a recipe for disaster
    because it often ends up being used in crypto applications, so be sure to use
    only crypto PRNGs when generating randomness related to cryptographic or security
    applications.


    # A Popular Noncrypto PRNG: Mersenne Twister


    The Mersenne Twister (MT) algorithm is a noncryptographic PRNG used (at the time
    of this writing) in PHP, Python, R, Ruby, and many other systems. It’s even been
    used (unfortunately) in blockchain wallet key generators. MT generates uniformly
    distributed random bits without statistical bias, but it’s predictable: given
    a few bits produced by MT, one can guess which bits will follow.


    Let’s look under the hood to see what makes the Mersenne Twister insecure. The
    MT algorithm is much simpler than that of crypto PRNGs: its internal state is
    an array, S, consisting of 624 32-bit words. This array is initially set to S₁,
    S₂, . . . , S₆₂₄ and evolves to S₂, . . . , S₆₂₅, then S₃, . . . , S₆₂₆, and so
    on, according to this equation:


    Sₖ₊₆₂₄ = Sₖ₊₃₉₇ ⊕ A((Sₖ ∧ 0x80000000) ∨ (Sₖ₊₁ ∧ 0x7fffffff))


    Here, ⊕ denotes the bitwise XOR (^ in the C programming language), ∧ denotes the
    bitwise AND (& in C), ∨ denotes the bitwise OR (| in C), and A is a function that
    transforms some 32-bit word, x, to (x >> 1) if x’s most significant bit is 0,
    or to (x >> 1) ⊕ 0x9908b0df otherwise.


    In this equation, bits of S interact with each other only through XORs. The operators
    ∧ and ∨ never combine 2 bits of S together but instead combine bits of S with
    bits from the constants 0x80000000 and 0x7fffffff. This way, any bit from S₆₂₅
    can be expressed as an XOR of bits from S₃₉₈, S₁, and S₂, and any bit from any
    future state can be expressed as an XOR combination of bits from the initial state
    S₁, . . . , S₆₂₄. (When you express, say, S₂₂₈₊₆₂₄ = S₈₅₂ as a function of S₆₂₅,
    S₂₂₈, and S₂₂₉, you can in turn replace S₆₂₅ by its expression in terms of S₃₉₈,
    S₁, and S₂.)


    Because there are exactly 624 × 32 = 19,968 bits in the initial state (or 624
    32-bit words), any output bit can be expressed as an equation with at most 19,969
    terms (19,968 bits plus one constant bit). That’s about 2.5KB of'
