  md: "Indeed, you can’t invert a hash function, even given unlimited computing power.\
    \ For example, suppose that I hash some message using the SHA-256 hash function\
    \ and get this 256-bit hash value:\n\nf67a58184cef99d6dfc3045f08645e844f2837ee4bfcc6c949c9f7f6743667adfd\n\
    \nEven given infinite time and computing power, you’d never be able to determine\
    \ *the message* that I picked to produce this particular hash, since there are\
    \ many messages hashing to the same value. You would therefore find *some* messages\
    \ that produce this hash value (possibly including the one I picked) but would\
    \ be unable to determine the message I used. You get *unconditional security.*\n\
    \nFor example, there are 2²⁵⁶ possible values of a 256-bit hash (a typical length\
    \ with hash functions used in practice), but there are many more values of, say,\
    \ 1,024-bit messages (namely, 2¹⁰²⁴ possible values). Therefore, it follows that,\
    \ on average, each possible 256-bit hash value will have 2¹⁰²⁴ / 2²⁵⁶ = 2¹⁰²⁴⁻²⁵⁶\
    \ = 2⁷⁶⁸ preimages of 1,024 bits each.\n\nIn practice, you must be sure that it’s\
    \ practically impossible to find *any* message that maps to a given hash value,\
    \ not just the message that was used, which is what preimage resistance actually\
    \ stands for. Specifically, you can speak of first-preimage and second-preimage\
    \ resistance. *First-preimage resistance* (or just *preimage resistance*) describes\
    \ cases where it’s practically impossible to find a message that hashes to a given\
    \ value. *Second-preimage resistance*, on the other hand, describes the case that\
    \ when given a message, *M₁*, it’s practically impossible to find another message,\
    \ *M₂*, that hashes to the same value that *M₁* does.\n\n# The Cost of Preimages\n\
    \nGiven a hash function and a hash value, you can search for first preimages by\
    \ trying different messages until one hits the target hash. Listing 6-1 shows\
    \ how to do this using an algorithm similar to solve_preimage().\n\n```\nsolve_preimage(H)\
    \ {\n    repeat {\n        M = random_message()\n        if Hash(M) == H then\
    \ return M\n    }\n}\n```\n\n*Listing 6-1: The optimal preimage search algorithm\
    \ for a secure hash function*\n\nHere, random_message() generates a random message\
    \ (say, a random 1,024-bit value). If the hash’s bit length, *n*, is large enough,\
    \ solve_preimage() will practically never complete, because it will take on average\
    \ 2ⁿ attempts before finding a preimage. That’s a hopeless situation when working\
    \ with *n* = 256, as in modern hashes like SHA-256 and BLAKE2."
