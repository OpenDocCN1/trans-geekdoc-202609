- pgno: 114
  md: '# 5


    # STREAM CIPHERS


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_114_0.png)


    Symmetric ciphers can be either block ciphers or stream ciphers. Recall from Chapter
    4 that block ciphers mix chunks of plaintext bits together with key bits to produce
    chunks of ciphertext of the same size, usually 64 or 128 bits. Stream ciphers,
    on the other hand, don’t mix plaintext and key bits; instead, they generate pseudo-random
    bits from the key and encrypt the plaintext by XORing it with the pseudorandom
    bits, in the same fashion as the one-time pad explained in Chapter 1.


    Stream ciphers are sometimes shunned because they have historically been more
    fragile than block ciphers and are more often broken—both the experimental ones
    designed by amateurs and the ciphers deployed in systems used by millions, including
    mobile phones, Wi-Fi, and public transport smart cards. But fortunately, although
    it’s taken almost 20 years, we now'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'know how to design secure stream ciphers, and we trust them to protect Bluetooth
    connections, mobile 4G communications, and TLS connections. This chapter first
    presents how stream ciphers work and discusses the two main classes of stream
    ciphers: stateful and counter based. We’ll then study hardware- and software-oriented
    stream ciphers and look at some insecure ciphers (A5/1 as used in GSM mobile communications,
    and RC4 in older version of TLS) and secure, state-of-the-art ones (Grain-128a
    for hardware and Salsa20 for software).


    # ## How Stream Ciphers Work


    Stream ciphers are more akin to deterministic random bit generators (DRBGs) than
    block ciphers because they generate a stream of pseudorandom bits rather than
    directly mixing plaintext data.


    What sets stream ciphers apart from DRBGs is that DRBGs take a single input value,
    whereas stream ciphers take two values: a key and a nonce. The key should be secret
    and is usually 128 or 256 bits. The nonce doesn’t have to be secret, but it should
    be unique for each key and is usually between 64 and 128 bits.


    Stream ciphers produce a pseudorandom stream of bits we call the *key-stream*.
    To encrypt the keystream, we XOR it to a plaintext and then XOR it again to the
    ciphertext to decrypt it. Figure 5-1 shows the basic stream cipher encryption
    operation, where $SC$ is the stream cipher algorithm, $KS$ the keystream, $P$
    the plaintext, and $C$ the ciphertext.


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_115_0.png)


    A stream cipher computes $KS = SC(K, N)$, encrypts as $C = P \oplus KS$, and decrypts
    as $P = C \oplus KS$. The encryption and decryption functions are the same because
    both do the same thing—namely, XOR bits with the key-stream. That’s why, for example,
    certain cryptographic libraries provide a single encrypt function for both encryption
    and decryption.


    Stream ciphers allow you to encrypt a message with key $K_1$ and nonce $N_1$ and
    then encrypt another message with key $K_1$ and nonce $N_2$ that’s different from
    $N_1$, or with key $K_2$, which is different from $K_1$ and nonce $N_1$. However,
    you should never again encrypt with $K_1$ and $N_1$ because you would use the
    same keystream $KS$ twice. That is, you’d have a first ciphertext $C_1 = P_1 \oplus
    KS$ and a second ciphertext $C_2 = P_2 \oplus KS$, and if you know $P_1$, then
    you could determine $P_2 = C_1 \oplus C_2 \oplus P_1$.'
