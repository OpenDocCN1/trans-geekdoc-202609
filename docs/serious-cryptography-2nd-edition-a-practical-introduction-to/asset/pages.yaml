- pgno: 176
  md: 'Sloane for more on this notion.) This kind of polynomial-evaluation hash is
    parameterized by a prime number, p, and takes as input a key consisting of two
    numbers, R and K, in the range [1, p) and a message, M, consisting of n blocks
    (M₁, M₂, . . . , Mₙ). You then compute the output of the universal hash as follows:


    **UH**(R, K, M) = R + M₁K + M₂K² + M₃K³ + . . . + MₙKⁿ mod p


    In this equation, the plus sign (+) denotes the addition of positive integers,
    Kⁱ is the number K raised to the power i, and “mod p” denotes the reduction modulo
    p of the result (that is, the remainder of the division of the result by p; for
    example, 12 mod 10 = 2, 10 mod 10 = 0, 8 mod 10 = 8, and so on).


    Because you want the hashing operation to be as fast as possible, universal hash-based
    MACs often work with message blocks of 128 bits and with a prime number, p, that’s
    slightly larger than 2¹²⁸, such as 2¹²⁸ + 51. The 128-bit width allows for very
    fast implementations by efficiently using the 32- and 64-bit arithmetic units
    of common CPUs.


    # Security Limitations


    Universal hashes have one weakness: because a universal hash securely authenticates
    only one message, an attacker could break the preceding polynomial-evaluation
    MAC by requesting the tags of only two messages. Specifically, they could request
    the tag for a message where all blocks are zero—M₁ = M₂ = . . . = 0—to obtain
    the tag UH(R, K, 0) = R, thus finding the secret value R. Alternatively, they
    could request the tags for a message where M₁ = 1 and where M₂ = M₃ = . . . =
    0 (whose tag is T = R + K), which allows them to find K by subtracting R from
    T. Now the attacker knows the whole key (R, K) and can forge MACs for any message.


    Fortunately, there’s a way to go from single-message security to multi-message
    security.


    # Wegman–Carter MACs


    The trick to authenticating multiple messages using a universal hash function
    arrived thanks to IBM researchers Mark Wegman and Lawrence Carter and their 1981
    paper “New Hash Functions and Their Use in Authentication and Set Equality.” The
    Wegman–Carter construction builds a MAC from a universal hash function and a PRF,
    using two keys, K₁ and K₂, and it returns


    **MAC**(K₁, K₂, N, M) = **UH**(K₁, M) + **PRF**(K₂, N)


    where N is a nonce that must be used at most once for each key, K₂, and where
    PRF’s output is as large as that of the universal hash function UH. By adding
    these two values, PRF’s strong pseudorandom output masks the cryptographic weakness
    of UH. You can see this as the encryption of the universal hash’s result, where
    the PRF acts as a stream cipher and prevents'
  merge: -1
