    the encrypted messages, decrypts them, and reencrypts them to Bob using another
    set of keys derived from g^bc—after potentially modifying the cleartext. All of
    this happens with Alice and Bob unaware; they’re doomed.


    To foil this attack, you need a way to authenticate the parties so Alice can prove
    she’s the real Alice and Bob can prove he’s the real Bob. Fortunately, there’s
