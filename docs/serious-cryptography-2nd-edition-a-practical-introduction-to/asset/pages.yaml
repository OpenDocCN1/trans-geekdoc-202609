  md: 'only O(√n) operations, which is orders of magnitude smaller than n/2. For example,
    if n is equal to 1,000,000, then n/2 is 500,000, whereas √n is 1,000.


    We quantify the difference between quantum and classical algorithms in terms of
    *time complexity*, which we represent with the O() notation. In the previous example,
    the quantum algorithm runs in time O(√n), but the classical algorithm can''t be
    faster than O(n). Because this difference in time complexity is due to the square
    exponent, we call this *quadratic speedup*. While such a speedup likely makes
    a difference, there are much more powerful ones.


    # Exponential Speedup and Simon’s Problem


    *Exponential speedups* are the holy grail of quantum computing. They occur when
    a task that takes an exponential amount of time on a classical computer, such
    as O(2^n), can be performed on a quantum computer with polynomial complexity—namely,
    O(n^k) for some fixed number k. This exponential speedup can turn a practically
    impossible task into a possible one. (Recall from Chapter 9 that cryptographers
    and complexity theorists associate exponential time with the impossible and polynomial
    time with the practical.)


    The poster child of exponential speedups is *Simon’s problem*. In this computational
    problem, a function, f(), transforms n-bit strings to n-bit strings, such that
    the output of f() looks like a random n-bit string, but with one constraint: there’s
    a secret value, m, such that for any two values x, y, we have f(x) = f(y) if and
    only if y = x ⊕ m. Simon’s problem consists in finding m given black-box access
    to f().


    Solving Simon’s problem with a classical algorithm boils down to finding a collision,
    or values x and y such that f(x) = f(y). This takes approximately 2^{n/2} queries
    to f(). However, Figure 14-4 shows that a quantum algorithm can solve Simon’s
    problem in only approximately n queries, with the extremely efficient time complexity
    of O(n).


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_307_0.png)


    *Figure 14-4: The circuit of the quantum algorithm that solves Simon’s problem
    efficiently*'
