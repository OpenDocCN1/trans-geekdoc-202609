    Figure 1-6: Tweakable encryption


    In disk encryption, TE encrypts the content of storage devices such as hard drives
    or solid-state drives. (Randomized encryption can’t be used because it increases
    the size of the data, which is unacceptable for files on storage media.) To make
    encryption unpredictable, TE uses a tweak value that depends on the position of
    the data encrypted, which is usually a sector number or a block index.


    # How Things Can Go Wrong


    Encryption algorithms or implementations thereof can fail to protect confidentiality
    in many ways. This can be due to a failure to match the security requirements
    (such as “be IND-CPA secure”) or to set requirements matching reality (if you
    target only IND-CPA security when attackers can actually perform chosen-ciphertext
    queries). Alas, many engineers don’t even think about cryptographic security requirements
    and want to be “secure” without understanding what that actually means. That’s
    usually a recipe for disaster. Let’s look at two examples.


    # Weak Cipher


    Our first example concerns ciphers that can be attacked using cryptanalysis techniques,
    as occurred with the 2G mobile communication standard. Encryption in 2G mobile
    phones used a cipher called A5/1 that turned out to be weaker than expected, enabling
    the interception of calls by anyone with the right skills and tools. Telecommunication
    operators had to find workarounds to prevent the attack.


    > NOTE The 2G standard also defined A5/2, a cipher for areas other than the European
    Union and United States. A5/2 was purposefully weaker to prevent the use of strong
    encryption everywhere.


    That said, attacking A5/1 isn’t trivial, and it took more than 10 years for researchers
    to come up with an effective cryptanalysis method. Furthermore, the attack is
    a time-memory trade-off (TMTO), a type of method that first runs computations
    for days or weeks to build large lookup tables, which are subsequently used for
    the actual attack. For A5/1, the precomputed tables are'
