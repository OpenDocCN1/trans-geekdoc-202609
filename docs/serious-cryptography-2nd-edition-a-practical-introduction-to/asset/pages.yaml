    # From Statements to Proofs


    zkSNARKs are some of the most complex cryptographic constructions, with one of
    their most complex and costly steps being *arithmetization*, an operation that
    converts the statement to prove into a fixed number of polynomial equations, which
    are generally of the form


    $$a_0 + a_1 x + a_2 x^2 + a_3 x^3 + \dots + a_n x^n$$


    for a polynomial of degree $n$, where the coefficients $a_i$ are elements of some
    finite ring or finite field structure. The proving algorithm then processes the
    polynomials to create the zkSNARK proof.


    Arithmetization follows a general workflow:


    +   1. Describe the statement to prove using formal notations, such as a computer
    program, equations, or logical formulas.

    +   2. Transform the formal expression from step 1 into a *circuit*, which defines
    an output from input values by applying a sequence of *gates* to the input, similar
    to logical gates in a Boolean or electronic circuit, except that the gates may
    be algebraic operations such as addition and multiplication.

    +   3. Turn the circuit into a structured list of *constraints*, according to
    the zkSNARK proof system’s constraint system. Such constraints are lists of conditions
    that the input must fulfill to satisfy the statement to prove.


