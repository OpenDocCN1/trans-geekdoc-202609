    # Diffie–Hellman Key Agreement over Elliptic Curves


    Recall from Chapter 11 that in the classical Diffie–Hellman (DH) key agreement
    protocol, two parties establish a shared secret by exchanging nonsecret values.
    Given some fixed number g, Alice picks a secret random number a, computes A =
    gᵃ, and sends A to Bob. Then Bob picks a secret random b and sends B = gᵇ to Alice.
    Both combine their secret key with the other''s public key to produce the same
    Aᵇ = Bᵃ = gᵃᵇ.


    The elliptic curve version of DH, elliptic curve Diffie–Hellman (ECDH), is identical
    to that of classical DH but with different notations. In the case of ECC, for
    some fixed-point G, Alice picks a secret random number a, computes A = aG (the
    point G multiplied by the integer a), and sends A to Bob. Bob picks a secret random
    b, computes the point B = bG, and sends it to Alice. Then both compute the same
    shared secret, aB = bA = abG.


    ECDH is to the ECDLP problem what DH is to DLP: it''s secure as long as ECDLP
    is hard. You can therefore adapt DH protocols that rely on DLP to work with elliptic
    curves and rely on ECDLP as a hardness assumption. For example, authenticated
    DH and Menezes–Qu–Vanstone (MQV) will also be secure when used with elliptic curves.
    In fact, MQV was first defined as working over elliptic curves.


