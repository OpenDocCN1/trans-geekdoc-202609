    # How Things Can Go Wrong


    More than 40 years later, we still don’t know how to efficiently factor large
    numbers or solve discrete logarithms. In the absence of mathematical proof, it’s
    always possible to speculate that they’ll be broken one day. But we also don’t
    have proof that P ≠ NP, so you can speculate that P may be equal to NP; however,
    according to experts, that surprise is unlikely. Most public-key crypto deployed
    today relies on either factoring (RSA) or DLP (Diffie–Hellman, ElGamal, elliptic
    curve cryptography). Although math may not fail us, real-world concerns and human
    error can sneak in.


