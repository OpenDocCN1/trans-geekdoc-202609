    it’s at least as hard as NP-complete (decision) problems and if any method to
    solve it can be efficiently used to solve NP-complete problems.


    NP-complete problems must be decisional problems; that is, problems with a yes
    or no answer. Therefore, strictly speaking, problems of computing the “best” value
    of a solution cannot be NP-complete but may be NP-hard. For example, take the
    traveling salesman problem: the problem “Is there a path visiting all points with
    a distance less than X?” is NP-complete, whereas “Find the faster path visiting
    all points” is NP-hard.


    Note that not all instances of NP-hard problems are actually hard to solve. You
    may be able to efficiently solve some instances because they’re small or have
    a specific structure. Take, for example, the graph in Figure 9-3. You can quickly
    spot the clique, which is the top four connected nodes—even though the aforementioned
    clique-finding problem is NP-hard, there’s nothing hard here. Being NP-hard doesn’t
    mean that all instances of a given problem are hard but that as the problem size
    grows, some of them are. This is why cryptographers are more interested in problems
    that are hard on average, not just in the worst case.


    # The P vs. NP Problem


    If you could solve the hardest NP problems in polynomial time, then you could
    solve all NP problems in polynomial time, and therefore NP would equal P. Such
    an equality sounds preposterous: Aren’t there problems for which a solution is
    easy to verify but hard to find? For example, isn’t it obvious that exponential-time
    brute force is the fastest way to recover the key of a symmetric cipher, and therefore
    that the problem can’t be in P?


    As crazy as it sounds, no one has proved that P is different from NP, despite
    a bounty of $1 million. The Clay Mathematics Institute will award this to anyone
    who proves that either P ≠ NP or P = NP. This problem, known as P vs. NP, was
    called “one of the deepest questions that human beings have ever asked” by renowned
    complexity theorist Scott Aaronson. Think about it: if P were equal to NP, then
    any easily checked solution would also be easy to find. All cryptography used
    in practice would be insecure because you could recover symmetric keys and invert
    hash functions efficiently.


    But don’t panic: most complexity theorists believe P isn’t equal to NP and therefore
    that P is instead a strict subset of NP, as Figure 9-4 shows, where NP-complete
    problems are another subset of NP not overlapping with P. In other words, problems
    that look hard actually are hard. It’s just difficult to prove this mathematically.
    While proving that P = NP requires only a polynomial-time algorithm for an NP-complete
    problem, proving the nonexistence of such an algorithm is fundamentally harder.
