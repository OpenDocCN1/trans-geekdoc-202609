    of **NP**-complete problems have proved difficult to use for crypto purposes because
    the very structure that makes them hard in the worst case can make them easy in
    specific cases that sometimes occur in crypto. Instead, cryptography often relies
    on problems that are *probably not* **NP**-hard.


    # The Factoring Problem


    The factoring problem consists of finding the prime numbers *p* and *q* given
    a large number, *N* = *p* × *q*. The widely used RSA algorithms are based on the
    difficulty of factoring: RSA encryption and signature schemes are secure because
    factoring is a hard problem. Before we see how RSA leverages the factoring problem
    in Chapter 10, I’d like to convince you that the decision version of this problem
    (“Does *N* have a factor smaller than *k* that is not equal to 1?”) is indeed
    hard yet probably not **NP**-complete.


    First, some basic math. A *prime number* isn’t divisible by any other number but
    itself and 1. For example, the numbers 3, 7, and 11 are prime; the numbers 4 (that
    is, 2 × 2), 6 (2 × 3), and 12 (2 × 2 × 3) are not. A fundamental theorem of number
    theory says that you can write any integer number uniquely as a product of primes,
    a representation called the *factorization* of that number. For example, the factorization
    of 123,456 is 2⁶ × 3 × 643, the factorization of 1,234,567 is 127 × 9,721, and
    so on. Any integer has a unique factorization, or a unique way to write it as
    a product of prime numbers. Polynomial-time primality testing algorithms allow
    us to efficiently test whether a given number is prime or a given factorization
    contains only prime numbers. Getting from a number to its prime factors, however,
    is another matter.'
