    # The Record Protocol


    All data exchanged through TLS 1.3 communications is transmitted as sequences
    of TLS records, the data packets used by TLS. The TLS record protocol (the *record
    layer*) is essentially a transport protocol, agnostic of the transported data’s
    meaning; this makes TLS suitable for any application.


    The TLS record protocol first carries the data exchanged during the handshake.
    Once the handshake is complete and both parties share a secret key, application
    data is fragmented into chunks that transmit as part of the TLS records.


    # The Structure of a TLS Record


    A TLS record is a chunk of data of at most 16KB with the following structure:


    +   - The first byte represents the type of data transmitted and is set to the
    value 22 for handshake data, 23 for encrypted data, and 21 for alerts. The TLS
    1.3 specifications call this value ContentType.

    +   - The second and third bytes are set to 03 and 01, respectively. These bytes
    are fixed for historical reasons and aren’t unique to TLS version 1.3. The specifications
    call this 2-byte value ProtocolVersion.

    +   - The fourth and fifth bytes encode the length of the data to transmit as
    a 16-bit integer, which can be no larger than 2^14 bytes (16KB).

    +   - The rest of the bytes are the data to transmit (or the *payload*), of a
    length equal to the value encoded by the record’s fourth and fifth bytes.


    > > **NOTE**  A TLS record has a relatively simple structure. As you’ve seen,
    a TLS record’s header includes only three fields. For comparison, an IPv4 packet
    includes 14 fields before its payload, and a TCP segment includes 13 fields.


    When the first byte of a TLS 1.3 record (ContentType) is set to 23, an authenticated
    cipher encrypts and authenticates its payload. The payload consists of a ciphertext
    followed by an authentication tag, which the receiving end, respectively, decrypts
    and verifies. The recipient knows which'
