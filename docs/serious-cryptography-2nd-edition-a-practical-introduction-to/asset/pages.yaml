- pgno: 300
  md: '# 14


    # QUANTUM AND POST-QUANTUM


    ![](img/ace4de942d037de8ea5835bc9fbe57cd_300_0.png)


    In this chapter, we’ll examine the future of cryptography over a time horizon
    of, say, a century or more—one in which quantum computers may exist. Quantum computers
    leverage phenomena from quantum physics to run different kinds of algorithms than
    we’re used to. While large quantum computers don’t exist yet, they have the potential
    to break RSA, Diffie–Hellman, and elliptic curve cryptography—all the public-key
    crypto deployed or standardized as of this writing.


    To ensure against the quantum computing risk, cryptography researchers have developed
    alternative public-key *post-quantum* algorithms. In 2015, the NSA called for
    a transition to quantum-resistant algorithms, and in 2017 NIST began a process
    to standardize post-quantum algorithms, which they announced as part of new standards
    in 2022.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'This chapter provides a nontechnical overview of the principles behind quantum
    computers as well as a glimpse of post-quantum algorithms. There''s some math
    involved, but only basic arithmetic and linear algebra, so don''t fret about the
    unusual notations.


    # How Quantum Computers Work


    Quantum computing uses quantum physics to compute differently and perform tasks
    that classical computers can''t, such as breaking RSA and elliptic curve cryptography
    efficiently. A quantum computer is not a superfast normal computer. In fact, quantum
    computers can''t efficiently solve any problem that''s too hard for a classical
    computer, such as brute-force search or NP-hard problems.


    Quantum mechanics—the branch of physics that studies the behavior of subatomic
    particles, which behave truly randomly—is the basis of quantum computers. Unlike
    classical computers, which operate on bits that are either 0 or 1, quantum computers
    operate on quantum bits (or qubits), which can be “both 0 and 1 simultaneously.”
    This is a state of ambiguity called superposition, where my quotation marks indicate
    an oversimplification. In this microscopic world, physicists discovered that particles
    such as electrons and photons behave in a highly counterintuitive way: before
    you observe an electron, it isn''t at a definite location in space but in several
    locations at the same time (that is, in a state of superposition). Once you observe
    it—an operation called measurement—it stops at a fixed, random location and is
    no longer in superposition; the quantum state collapsed. This enables the creation
    of qubits in a quantum computer, along with the phenomena of entanglement and
    interference.


    Quantum computers work because of entanglement, wherein two particles are connected
    (entangled) in a way that observing the value of one gives the value of the other,
    even if the two particles are widely separated (kilometers or even light-years
    away from each other). The Einstein–Podolsky–Rosen (EPR) paradox illustrates this
    behavior, which caused Albert Einstein to initially dismiss quantum mechanics.
    (See https://plato.stanford.edu/entries/qt-epr/ for an in-depth explanation.)


    Interference is also crucial to the operation of quantum computers. With this
    property, particles can combine or cancel out each other''s effects due to their
    wave-like nature, as the double-slit experiment famously illustrates. Quantum
    computing exploits interference so that the “waves” of valid solutions reinforce
    each other and invalid solutions cancel each other out.


    To explain how a quantum computer works, I''ll distinguish the actual quantum
    computer (the hardware, including its quantum bits) from quantum algorithms (the
    software that runs on it, composed of quantum gates).


    # Quantum Bits


    You can characterize qubits, or groups thereof, with amplitudes, which are numbers
    akin to probabilities that aren''t exactly probabilities. Whereas a'
