    ⊕ P from random, then this means you can distinguish DRBG(K || R) from random.
    Remember that the CPA model lets you get ciphertexts for chosen values of P, so
    you can XOR P to DRBG(K || R) ⊕ P and get DRBG(K || R). But now we have a contradiction
    because we started'
