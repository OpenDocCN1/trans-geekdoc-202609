- raw: "Processing image information is a very important aspect of applying artificial\
    \ intelligence while developing business-critical applications. We can analyze\
    \ and process images using image analytics and image classification which are\
    \ two different aspects of Azure Vision Service. The following sections cover\
    \ image analytics and image classification in detail. \n\n# [Image analytics -\
    \ Azure Computer Vision API](#toc.xhtml#s20a)\n\nWe can leverage Azure Computer\
    \ Vision Analyze Image API to analyze an image and obtain information on the visual\
    \ aspects of an image. It returns descriptions based on different visual features,\
    \ with a confidence score against each feature. The final output is a list of\
    \ descriptions ordered from highest to lowest in confidence. Based on thousands\
    \ of recognizable objects, computer vision returns tags based on the objects,\
    \ living beings, and actions identified in the image in addition to details on\
    \ the background. Hints are provided wherever the information is not available.\n\
    \nThe following image shows the actions we can perform using Analyze Image API:\n\
    \n![](images/Figure-2.1.jpg)\n\n**Figure 2.1:** Actions we can perform using AnalyzeImage\
    \ API\n\n**Analyse API in detail:**\n\n*   **Detect object**: We can leverage\
    \ object detection API to list objects and the corresponding coordinates of the\
    \ objects and to check the number of similar instances of an object. We can leverage\
    \ detect operation to figure out the inter-object relationships and also to get\
    \ the coordinates for the bounding box for each object found. The tags are applied\
    \ based on objects and living things included in the image. \n\n    For instance,\
    \ for an image containing objects like cat, dog etc., Detect API will list those\
    \ objects together with their coordinates in the image. This API can be used to\
    \ correlate the relationships between the objects in an image. Detect API also\
    \ helps in checking if multiple instances of the same tag exist in an image.\n\
    \n    Here are some limitations of Detect API\n\n    *   Objects which are less\
    \ than 5% of the image are not detected \n\n    *   Objects which are organized\
    \ too close to each other might not be detected\n\n*   **Categories**: We can\
    \ leverage this method to get categories from about 86 categories. \n\n    Example\
    \ categorizations include dog, outdoor, bread etc.:\n\n    ![](images/Figure-2.2.jpg)\n\
    \n    **Figure 2.2:** Example categorizations \n\n*   **Detect Brands**: We can\
    \ leverage this method to derive insights on which brands are most popular on\
    \ social media. \n\n    ![](images/Figure-2.3.jpg)\n\n    **Figure 2.3:** Example\
    \ Brands\n\n    **Categorize an image**: We can leverage this method to identify\
    \ and categorize an entire image, using a category taxonomy with parent/child\
    \ hereditary hierarchies.\n\n*   **List domain-specific models**: We can leverage\
    \ this method to return the domain-specific models supported by Computer Vision\
    \ API which include celebrity recognizer, landmark recognizer.\n\n*   **Generate\
    \ a thumbnail**: We can leverage this method to return a thumbnail image with\
    \ the width and height specified by the user. The image is analyzed by the service.\
    \ **Region of Interest** (**ROI**) is identified and smart cropping coordinates\
    \ are generated based on the ROI.\n\n*   **Describe image**: We can leverage this\
    \ method to return a description of an image which is a collection of tags for\
    \ the content in the image with a confidence score. Input methods supported include\
    \ specifying an image or an image URL. We have a lab in the subsequent section.\n\
    \n*   **Detect faces**: We can leverage this method to provide information about\
    \ faces detected in an image. Details for each face returned include age, coordinates,\
    \ gender, and rectangle.\n\n*   **Detect image types**: We can leverage this method\
    \ to detect characteristics about an image, such as whether an image is a line\
    \ drawing or the likelihood of whether an image is clip art.\n\n*   **Detect the\
    \ color scheme**: We can leverage this method to analyze an image and determine\
    \ if an image is black and white or color. For color images, this method also\
    \ identifies the dominant and accent colors.\n\n*   **Get the area of interest**:\
    \ We can leverage this method to analyze the contents of an image and return the\
    \ coordinates of the area of interest.\n\nWe will now go through a sample lab\
    \ where a sample image is analyzed using AnlayseImage API.\n\n# [Image Analytics\
    \ -Lab](#toc.xhtml#s21a)\n\nWe will create a sample project using Azure custom\
    \ vision service. We will analyze the image using Azure Computer Vision API.\n\
    \nHere are the prerequisites and steps required to run the example:\n\n# Prerequisites\n\
    \n*   A valid Computer Vision subscription key is required.\n\n*   We can use\
    \ a free trial subscription key which can be obtained using Try Cognitive Services\
    \ or we can subscribe to Computer Vision and get a key using Create a Cognitive\
    \ Services account.\n\n*   Visual Studio 2017 and above \n\n*   NuGet package\
    \ to be added: Microsoft.Azure.CognitiveServices.Vision.ComputerVision client\
    \ library \n\nFollow the steps given below to work on the Image Analytics example:\n\
    \n**Step 1: Create and run the sample application: Image Analysis using Computer\
    \ Vision API**\n\nWe have to log into the Azure Portal. We have to click on ‘`Create\
    \ a Resource`’. We have to select ‘`AI + Machine Learning`’. We have to select\
    \ ‘`Computer Vision`’.\n\nWe have to provide the following details:\n\n*   **Name**:\
    \ We have to provide the name for the Computer Vision API.\n\n*   **Subscription**:\
    \ We have to select an active subscription\n\n*   **Location**: We have to select\
    \ the location of the resource group.\n\n*   **Pricing Tier**: We have to select\
    \ the pricing tier.\n\n*   **Resource Group**: We have to create or select an\
    \ existing resource group.\n\n**Step 2: Endpoint**:  We can choose available locations\
    \ while creating a Computer Vision API. We can choose the nearest region. We have\
    \ chosen Central India for this tutorial.\n\n![](images/Figure-2.4.jpg)\n\n**Figure\
    \ 2.4:** Endpoint Configuration\n\n**Step 3**: Obtain subscription keys: \n\n\
    Get trial keys by going to `Manage Keys`: \n\n![](images/Figure-2.5.jpg)\n\n**Figure\
    \ 2.5:** Getting Trial Keys\n\n**Step 4: Create a sample console application to\
    \ analyze an image:**\n\nCreate a new Visual Studio solution in Visual Studio,\
    \ using the Visual C# .NET Core Console App.\n\n![](images/Figure-2.6.jpg)\n\n\
    **Figure 2.6:** APIs provided by AnalyzeImage API\n\n**Step 5**: Install Newtonsoft.Json\
    \ NuGet package.\n\n![](images/Figure-2.7.jpg)\n\n**Figure 2.7:** Installing Nuget\
    \ Package\n\n**Step 6**: Replace the code in Program.cs with the following code:\
    \ \n\n`using System;`\n\n`using System.IO;`\n\n`using System.NET.Http;`\n\n`using\
    \ Newtonsoft.Json.Linq;`\n\n`Using System.Net.Http.Headers.`\n\n`Using System.Threading.Tasks;`\n\
    \nReplace the value of `computerVisionSubscriptionKey` with your subscription\
    \ key. Replace the value of baseURL with the endpoint URL for the **Analyze Image**\
    \ method from the Azure region where you obtained your subscription keys.\n\n\
    `namespace AzureAI.ImageProcessing_AnalyzeImage`\n\n`{`\n\n`internal class Program`\n\
    \n`{`\n\n`// Replace computerVisionsubscriptionKey with your subscription key`\n\
    \n`private const string computerVisionsubscriptionKey =`\n\n`“Your SubscriptionKey”;`\n\
    \n`// Replace computerVisionsubscriptionKey with the `\n\n`// correct Azure region.`\n\
    \n`private const string baseURL = `\n\n`“https://centralindia.api.cognitive.`\n\
    \n`microsoft.com//vision/v2.0/analyze”;`\n\n`private static void Main(string[]\
    \ args)`\n\n`{`\n\n`//Prompt the user for an input image file `\n\n`Console.Write(“Enter\
    \ the path of the image: “);`\n\n`string filePath = Console.ReadLine();`\n\n`if\
    \ (File.Exists(filePath))`\n\n`{`\n\n`Console.WriteLine(“\\n Results are getting\
    \ processed....\\n);`\n\n`ProcessImage(filePath).Wait();`\n\n`}`\n\n`else`\n\n\
    `{`\n\n`Console.WriteLine(“The given file path is invalid”);`\n\n`}`\n\n`Console.WriteLine(“\\\
    nPress Enter to exit the program...”);`\n\n`Console.ReadLine();`\n\n`}`\n\n`///\
    \ <summary> `\n\n`/// The below function analyses the image `\n\n`/// <param name=”filePath”>The\
