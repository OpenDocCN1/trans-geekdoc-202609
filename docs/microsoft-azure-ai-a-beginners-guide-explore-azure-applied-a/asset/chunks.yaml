    \n**Figure 6.33:** Solution Explorer\n\n# [Updating the BasicBot source code to\
    \ include dispatch support](#toc.xhtml#s95a)\n\nNow that we have the models up\
    \ and running, we have to modify the code add the dispatcher functionality into\
    \ the bot and also add LUIS and QnA KBs to the bot so that it can reach out to\
    \ those services based on routing of incoming requests.\n\n# IBotService.cs and\
    \ BotServices.cs\n\nBotServices is the class that defines the Bot services connection\
    \ to the dispatch model and other LUIS models and KBs. It implements an interface\
    \ `IBotService` that defines the connection points.\n\n`public` `class` `BotServices`\
    \ : IBotServices\n\n`{`\n\n`public` `BotServices`(IConfiguration configuration,\
    \ OrchestratorRecognizer dispatcher)\n\n`{`\n\n`// Read the setting for cognitive\
    \ services (LUIS, QnA) from the appsettings.json`\n\n`// If includeApiResults\
    \ is set to true, the full response from the LUIS api (LuisResult)`\n\n`// will\
    \ be made available in the properties collection of the RecognizerResult LuisReservationRecognizer\
    \ = CreateLuisRecognizer(configuration,` `“LuisReservationRecognizer “`);\n\n\
    `Dispatch = dispatcher;`\n\n`McDonaldsQnA = ``new` QnAMaker(`new` QnAMakerEndpoint\n\
    \n`{`\n\n`KnowledgeBaseId = configuration[``“QnAKnowledgebaseId”`\\],\n\n`EndpointKey\
    \ = configuration[``“QnAEndpointKey”`\\],\n\n`Host = configuration[``“QnAEndpointHostName”`\\\
    ]\n\n`});`\n\n`}`\n\n`public` OrchestratorRecognizer Dispatch { `get`; `private`\
    \ `set`; }\n\n`public` QnAMaker McDonaldsQnA { `get`; `private` `set`; }\n\n`public`\
    \ LuisRecognizer LuisReservationRecognizer { `get`; `private` `set`; }\n\n`private`\
    \ LuisRecognizer CreateLuisRecognizer(IConfiguration configuration, `string` appIdKey)\n\
    \n`{`\n\n`var` luisApplication = `new` LuisApplication(\n\n`configuration[appIdKey],`\n\
    \n`configuration[``“LuisAPIKey”`\\],\n\n`configuration[``“LuisAPIHostName”`\\\
    ]);\n\n`// Set the recognizer options depending on which endpoint version you\
    \ want to use.`\n\n`// More details can be found in https://docs.microsoft.com/en-gb/azure/cognitive-services/luis/luis-migration-api-v3`\n\
    \n`var` recognizerOptions = `new` LuisRecognizerOptionsV2(luisApplication)\n\n\
    `{`\n\n`IncludeAPIResults = ``true`,\n\n`PredictionOptions = ``new` LuisPredictionOptions()\n\
    \n`{`\n\n`IncludeAllIntents = ``true`,\n\n`IncludeInstanceData = ``true`\n\n`}`\n\
    \n`};`\n\n`return` `new` LuisRecognizer(recognizerOptions);\n\n`}`\n\n`} `\n\n\
    # ErrorHandlerAdaptor\n\nError handler to handle errors encountered by the Bot,\
    \ where custom error messages can be defined for users to see rather than error\
    \ messages thrown at them.\n\n`public` `class` `AdapterWithErrorHandler` : CloudAdapter\n\
    \n`{`\n\n`public` `AdapterWithErrorHandler`(BotFrameworkAuthentication auth, ILogger<IBotFrameworkHttpAdapter>\
    \ logger, ConversationState conversationState = `null`)\n\n`: ``base`(auth, logger)\n\
    \n`{`\n\n`OnTurnError = ``async` (turnContext, exception) =>\n\n`{`\n\n`// Log\
    \ any leaked exception from the application.`\n\n`logger.LogError(exception, ``$”[OnTurnError]\
    \ unhandled error : `{exception.Message}`”`);\n\n`// Send a message to the user`\n\
    \n`await` turnContext.SendActivityAsync(`“The bot encountered an error or bug.”`);\n\
    \n`await` turnContext.SendActivityAsync(`“To run this sample make sure you have\
    \ the LUIS and QnA models deployed.”`);\n\n`await` turnContext.SendActivityAsync(`“To\
    \ continue to run this bot, please fix the bot source code.”`);\n\n`if` (conversationState\
    \ != `null`)\n\n`{`\n\n`try`\n\n`{`"
