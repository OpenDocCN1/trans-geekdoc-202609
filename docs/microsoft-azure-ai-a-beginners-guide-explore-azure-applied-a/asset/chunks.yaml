    \nDownload Visual Studio Code from\n\n**Download Visual Studio Code - Mac, Linux,\
    \ Windows**\n\nThe code for the examples is placed in the following GitHub location:\n\
    \n**Email/UserName**: [azurevisionbook@gmail.com](mailto:azurevisionbook@gmail.com)\n\
    \n**Password**: azurevisionbook@123\n\n# [Conclusion](#toc.xhtml#s14a)\n\nIn this\
    \ chapter, we have looked at the basics of Cognitive Services as well as services\
    \ and APIs available under Vision Services. We have also learned how to use these\
    \ APIs in enterprise scenarios.\n\nIn the next chapter, we will be exploring building\
    \ custom applications using Vision API. This includes developing custom applications\
    \ leveraging Image Processing, Face Recognition.\n\n# [Multiple choice questions](#toc.xhtml#s15a)\n\
    \nThis section consists of a set of questions that are designed to test your knowledge\
    \ of the concepts covered in this chapter.\n\nWhen answering these questions,\
    \ imagine there is an audience who has watched a movie. You have images of the\
    \ movie and images of the audience coming out of the theatre.\n\n1.  **You want\
    \ to group people in the images. Which API will you use?** \n\n    1.  Face Detection\n\
    \n    2.  Face Recognition\n\n    3.  Face Grouping\n\n    4.  Face Verification\n\
    \n2.  **You have been asked to analyze the emotions of the people in the image.\
    \ Which API will you use?** \n\n    1.  Emotion\n\n    2.  Face\n\n    3.  Analyze\n\
    \n    4.  Verification\n\n3.  **You have been asked to look at the image of the\
    \ movie title and recognize the text in the image. Which API will you use?** \n\
    \n    1.  Text Recognition\n\n    2.  OCR\n\n    3.  Read API\n\n    4.  Image\
    \ Detection\n\n4.  **Which API will you use to create a custom model to train\
    \ images?** \n\n    1.  Computer Vision\n\n    2.  Custom Vision\n\n    3.  Object\
    \ Detection\n\n    4.  Image Classification\n\n5.  **You have been asked to look\
    \ at an image and analyze its attributes. Which feature or API will you use?**\
    \ \n\n    1.  Computer Vision\n\n    2.  Custom Vision\n\n    3.  Object Detection\n\
    \n    4.  Image Recognition\n\n6.  **Which APIs can help automate tasks to act\
    \ on inappropriate content so that content sharing sites are safe and easy to\
    \ use.** \n\n    1.  Sharing\n\n    2.  Content Moderator\n\n    3.  Ink Recognizer\n\
    \n    4.  Digital Recognizer\n\n7.  **You have been asked to analyze the emotions\
    \ in the video. Which API will you use?** \n\n    1.  Face Detection\n\n    2.\
    \  Video Indexer Insights\n\n    3.  Face Grouping\n\n    4.  Face Verification\n\
    \n8.  **Which API will be used to read from a receipt?** \n\n    1.  Text Recognition\n\
    \n    2.  Form Recognizer\n\n    3.  Receipt Recognizer\n\n    4.  Image Recognizer\n\
    \n9.  **Which API will help build relations between fields and entries in documents?**\
    \ \n\n    1.  Text Recognition\n\n    2.  Form Recognizer\n\n    3.  Receipt Recognizer\n\
    \n    4.  Image Recognizer\n\n10.  **You have been asked to detect commercial\
    \ brands. Which feature or API will you use?** \n\n     1.  Computer Vision\n\n\
    \     2.  Custom Vision\n\n     3.  Object Detection\n\n     4.  Image Recognition\n\
    \n# [Answerss](#toc.xhtml#s16a)\n\nYou have images of the movie and images of\
    \ the audience coming out of the theatre. \n\n1.  **c. **\n\n2.  **b. **\n\n3.\
    \  **b. **\n\n4.  **b. **\n\n5.  **a. **\n\n6.  **b. **\n\n7.  **b. **\n\n8. \
    \ **b. **\n\n9.  **b. **\n\n10.  **a.**\n\n# [CHAPTER 2](#toc.xhtml#c02)\n\n#\
    \ [Azure Computer Vision - Image Analysis, Processing, Object Detection ](#toc.xhtml#c02)\n\
    \nIn this chapter, the reader will understand how to use Azure Vision APIs for\
    \ developing custom applications that can be used for processing images and detecting\
    \ objects.\n\n# [Structure](#toc.xhtml#s17a)\n\nThis chapter will cover the following\
    \ topics:\n\n*   Image processing:  \n\n    *   Image analytics, content moderation\
    \ using Azure Computer Vision API\n\n    *   Image classification using Azure\
    \ Custom Vision Service\n\n    *   Object detection using Azure Custom Vision\
    \ Service\n\n# [Objective](#toc.xhtml#s18a)\n\nIn this chapter, the reader will\
    \ understand how to use Azure Vision APIs for developing custom applications that\
