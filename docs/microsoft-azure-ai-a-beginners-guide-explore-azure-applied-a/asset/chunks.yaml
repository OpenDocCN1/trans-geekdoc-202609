- raw: "Companies have started infusing digital into their operations, and it has\
    \ become easier than ever to grow through the utilization of digital tools and\
    \ provides immense opportunities to optimize operations. From physical plants\
    \ where assets can be maintained more predictably and proactively, to more adaptable\
    \ and personalized business processes, to also influence their innovation process.\n\
    \nThis is where “*Automation Bots*” observe the user behaviour and automates tasks\
    \ combining information from varied data sources and presents with insights for\
    \ the businesses and its customers.\n\n# Re-Imagine enterprise models\n\nEnterprises\
    \ have started using digital technologies to completely re-imagine business models.\
    \ While some target delivering new digital products with the data available in\
    \ abundance, others are complementing the physical experiences with re-defined\
    \ digital ones. Such momentum has driven enterprises to re-strategize their thinking\
    \ and move towards “*digital services*” rather than just focusing on “*building\
    \ products*”.\n\n“*Digital Assistants*” packed into electronic devices provide\
    \ personalized and customized experienced targeted at individuals rather than\
    \ a standard common solution approach.\n\nMultiple different enterprise verticals\
    \ use bots across the board such as\n\nTelecommunication, automotive, healthcare,\
    \ education, insurance, government, finance. Vodafone’s – Tobi is a good recent\
    \ example of how customer engagement has been redefined via conversational interfaces.\n\
    \n# Leveraging Natural Language Processing\n\nConversational chatbots were made\
    \ to assist organizations with customer correspondences, answer questions and\
    \ take orders. To play out these errands effectively, they should be insightful.\
    \ At the end of the day, great at **Natural Language Processing** (**NLP**). Be\
    \ that as it may, the point is, it’s pretty tedious to fabricate your own NLP.\
    \ Fortunately, you don’t generally need to begin starting with no outside help.\
    \ Natural Language Processing engines have become better than ever in the recent\
    \ years. Coupled with deep learning and neural networks, they are now empowering\
    \ us to build highly engaging and human-like interfaces.\n\n# [Conclusion](#toc.xhtml#s103a)\n\
    \nWe introduced you to the Bot Framework and the basic constructs of how Bots\
    \ could be developed, debugged, and deployed with ease on Azure with Microsoft\
    \ provided SDKs and Tools. This should help you get started on the framework and\
    \ let you explore more advanced scenarios such as using dialogs, integrating different\
    \ channels, connecting to various other cognitive intelligence APIs to build innovative\
    \ solutions for customers and enterprises. In the next chapter we will learn about\
    \ ML.NET. We will also understand how it can be invoked from .NET code.\n\nWith\
    \ that, we will look at some industry scenarios and how AI gets integrated in\
    \ the following Appendix section.\n\n# [Thought Experiment](#toc.xhtml#s104a)\n\
    \n1.  **How do you test and debug your bots?** \n\n    *   Use Visual Studio and\
    \ use the Emulator integrated within Visual Studio IDE\n\n    *   Use VS Code\
    \ and use the Debug option within VS Code\n\n    *   Use the Bot Emulator outside\
    \ of any IDE to test and debug bots\n\n    *   Publish in Azure and debug\n\n\
    2.  **Can you run bots in your local machines?** \n\n    *   They must be published\
    \ to Azure to work, they don’t work locally\n\n    *   They can be used locally\
    \ with Bot Emulator\n\n3.  **What debugging options does the Bot framework and\
    \ the emulator provide?** \n\n    *   Local Debugging with emulator\n\n    * \
    \  Remote Debugging with emulator\n\n    *   Both\n\n4.  **What are the cognitive\
    \ skills that bots can be enabled with?** \n\n    *   LUIS\n\n    *   QnA Maker\n\
    \n    *   Azure Search\n\n    *   Speech Service\n\n    *   Vision/ Custom Vision\
    \ Service\n\n    *   Bing Search\n\n    *   Bing Spell Check\n\n    *   All of\
    \ the above\n\n# [CHAPTER 7](#toc.xhtml#c07)\n\n# [Infusing ML in Custom Applications\
    \ Using ML.NET](#toc.xhtml#c07)\n\nIn the last few chapters, we have read about\
    \ vision API and how we can leverage cognitive services to infuse intelligence\
    \ into applications. In this chapter we will learn about ML.NET which is an easy\
    \ to use .NET Machine Learning platform which helps in infusing intelligence into\
    \ applications. ML.NET is a cross-platform, open source machine learning framework\
    \ which helps in developing simple intelligent .NET applications.\n\nThe framework\
    \ is built on .NET Core and .NET Standard. It supports multiple platforms which\
    \ include Mac, Linux and Windows. The origin of ML.NET is from **text mining search\
    \ and navigation** (**TMSN**) which was used internally in Microsoft products.\
    \ The Ml.NET repository consists of .NET APIs for consumption and training models.\
    \ It helps in pre-processing, feature engineering, modeling, evaluation, and invoking.\n\
    \nWith ML.NET, we do not need to learn a new programming language, like Python\
    \ develop our own ML models. The framework provides capabilities which help us\
    \ to train build, train, and deploy custom machine learning models locally without\
    \ requiring any machine learning experience. After reading this chapter we will\
    \ learn basics of ML.NET and how to leverage ML.NET.\n\n# [Structure](#toc.xhtml#s105a)\n\
    \nIn this chapter, the following topics will be covered:\n\n*   Introducing ML.NET\
    \ – how to leverage ML.NET to develop models\n\n*   Lab - Developing a sample\
    \ ML Model\n\n*   Exposing the ML model as a service and invoking the service\
    \ from .NET Core client\n\n# [Objective](#toc.xhtml#s106a)\n\nAfter reading this\
    \ chapter, we will understand how a machine learning model can be developed using\
    \ ML.NET and then exposed as an API or a web service. We will also understand\
    \ how it can be invoked from .NET code.\n\nIn this chapter, we will understand\
    \ the basics of ML.NET:\n\n*   ML.NET – An introduction learn how to leverage\
    \ ML.NET to develop models \n\n*   Lab -Developing a sample ML Model \n\n*   Exposing\
    \ the ML model as a service and invoking the service from .NET Core client\n\n\
    *   A thought experiment, which is a set of questions designed to aid understanding\
    \ of the key concepts covered in this chapter\n\nAfter the chapter, we will get\
    \ a fair idea of ML.NET, the different algorithms supported, developing models\
    \ and on exposing models as a service.\n\n# [Introducing ML.NET](#toc.xhtml#s107a)\n\
    \nML.NET is a cross-platform, open source machine learning framework to easily\
    \ add machine learning to simple .NET applications. ML.NET was initially developed\
    \ in Microsoft Research. It is used in a number of Microsoft products which includes\
    \ Windows, Bing, Azure etc. ML.NET helps perform complex Machine Learning tasks\
    \ like regression, classification etc. easily and invoke the same through .NET\
    \ code.\n\nIt has a set of learning algorithms, core ML data structures and transforms.\
    \ It exposes .NET APIs for training the models and making predictions using the\
    \ models. ML.NET comes with the support for the types and run time needed for\
    \ all aspects of machine learning which includes core data types, extensible pipelines,\
    \ high performance math, and data structures for heterogeneous data, tooling support,\
    \ and more.\n\nFollowing figure captures the key components of ML.NET framework:\n\
    \n![](images/Figure-7.1.jpg)\n\n**Figure 7.1:** ML.NET Framework\n\nThe following\
    \ is a brief overview:\n\n**Developer Friendly APIs**: Training APIs: These APIs\
    \ help in creating and building models. Consumption APIs: These APIs help in making\
    \ predictions\n\n# Data: \n\n*   **IDataView**: IDataView is the data pipeline\
    \ machinery. It consists of a set of interfaces and classes which help in transformation\
    \ of data. It helps in handling high dimensional data and large data sets. IDataView\
    \ related components include loaders, transforms, savers, trainers, predictors,\
    \ etc. We can load datasets into an IDataView from any data source. We can use\
    \ File Loaders for typical sources which include text, binary, and image files,\
    \ and we can use the Database Loader to load and train data directly from relational\
    \ databases like Oracle, SQL Server, and so on."
  fmt: "\nCompanies have started infusing digital into their operations, and it has\
    \ become easier than ever to grow through the utilization of digital tools and\
    \ provides immense opportunities to optimize operations. From physical plants\
