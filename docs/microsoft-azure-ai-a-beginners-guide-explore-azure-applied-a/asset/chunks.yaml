- raw: "LinkedIn Profile: **https://www.linkedin.com/in/eranki/**\n\n# Acknowledgements\n\
    \n**Rekha Kodali: **I would like to thank and acknowledge the guidance, inspiration\
    \ and support provided by my mentors Venkata Guru Prasad Kandarpi and Hari Kishan\
    \ Burle. I would like to thank my kids (Sireesh and Tarun), my brothers and Sarath,\
    \ my husband for their support.\n\n**Sankara Narayanan Govindarajulu: **Thankful\
    \ to family, friends, colleagues and reviewers whose support and inspiration made\
    \ this possible \n\n**Mohammed Athaulla: **I am extremely grateful to my parents,\
    \ wife, and son (Zayan). It would not have been possible without their support.\n\
    \n# Preface\n\nThe recent years have proved that AI is quickly becoming the “new\
    \ normal” at organizations of all sizes. Organizations across industries are revamping\
    \ their strategies and investments for future with AI becoming one of the top\
    \ priorities. The objective of this book is to provide practical guidelines that\
    \ might help you if you are in a role of a CTO/ Architect / Designer / Consultant\
    \ / Developer or even a Beginner in their AI journey. We believe this book will\
    \ make it easy to learn Azure AI concepts and covers the basics and also some\
    \ advanced concepts of Azure AI. The book is divided into 8 chapters. Software\
    \ professionals interested in Azure AI development would benefit from this book.\n\
    \n**[Chapter 1](#c01.xhtml)** gives a basic introduction to the services/components\
    \ provided by Azure to build AI based applications, Azure Cognitive Services,\
    \ and Azure Computer Vision. After reading this chapter, the reader will be able\
    \ to understand Azure AI Platform, the core concepts of Azure Cognitive Services\
    \ and various services available within Azure Computer Vision.\n\n**[Chapter 2](#c02.xhtml)**\
    \ introduces Azure Vision APIs for developing custom applications which can be\
    \ used for processing images, recognizing faces and detecting objects. After reading\
    \ this chapter, the reader will have the skills that make it possible to effectively\
    \ build applications by leveraging Image Analytics, Content Moderation, Object\
    \ Detection, Face Recognition, and Custom Vision Services.\n\n**[Chapter 3](#c03.xhtml)**\
    \ introduces Handwriting Recognition, Optical Character Recognition, Face API,\
    \ and Spatial Analysis. After reading this chapter, the reader will have the skills\
    \ that make it possible to effectively build applications by leveraging Handwriting\
    \ Recognition, Optical Character Recognition, Face API and Spatial Analysis.\n\
    \n**[Chapter 4](#c04.xhtml)** explores how to leverage Decision, Language, Speech,\
    \ and Web Search in the applications. After reading this chapter, the reader will\
    \ understand how to effectively build applications leveraging each of the APIs.\n\
    \n**[Chapter 5](#c05.xhtml)** makes the reader understand Azure Applied AI Services.\
    \ We will delve a little deep into Azure Form Recognizer, Azure Metrics Advisor,\
    \ Azure Cognitive Search, Azure Immersive Reader, and Azure Video Analyzer for\
    \ Media. By the end of this chapter, the reader will understand how to effectively\
    \ leverage these services. \n\n**[Chapter 6](#c06.xhtml)** takes the reader through\
    \ the Microsoft Bot Landscape including the Bot Framework, the Bot Framework Composer\
    \ after a brief introduction of Bots and how they have evolved over the years.\
    \ We will look at what the different options have to offer Bot Framework has to\
    \ offer, the best practices and scenarios, a simple example using the Bot Framework\
    \ with using QnA and include NLP (LUIS) capabilities as well and also understand\
    \ how to develop/debug Bots locally with the Bot Emulator, Bot Composer and its\
    \ features and a quick example.\n\n**[Chapter 7](#c07.xhtml)** introduces ML.NET.\
    \ The reader will learn how to leverage ML.NET which is a cross-platform, open\
    \ source machine learning framework. After reading this chapter the reader will\
    \ understand how a ML model can be developed and then exposed as an API or a web\
    \ service. The reader will also understand how it can be invoked from .NET code.\n\
    \n**[Chapter 8](#c08.xhtml)** introduces Azure Machine Learning Studio. The reader\
    \ will learn to create models, score models and run experiments and also learn\
    \ about Accord Framework. The reader will get a view on ML Ops and a brief overview\
    \ of migration from classic ML Studio Azure Designer.\n\n# Code Bundle and Coloured\
    \ Images\n\nPlease follow the link to download the  \n\n***Code Bundle*** and\
    \ the ***Coloured Images*** of the book:\n\n# [https://rebrand.ly/137e75](https://rebrand.ly/137e75)\n\
    \nThe code bundle for the book is also hosted on GitHub at **[https://github.com/bpbpublications/Microsoft-Azure-AI-A-Beginner-s-Guide](https://github.com/bpbpublications/Microsoft-Azure-AI-A-Beginner-s-Guide)**.\
    \ In case there's an update to the code, it will be updated on the existing GitHub\
    \ repository.\n\nWe have code bundles from our rich catalogue of books and videos\
