- raw: "*   If you have been working with the Bot Framework SDK for quite a while\
    \ and decide to switch to no-code model and still retain your work, Bot Composer\
    \ makes it possible. Existing dialogs and skills can be imported to the Composer\
    \ as well. That’s an advantage that further speeds up bot development when one\
    \ decides to switch to the Visual Designer. You can also export them and share.\n\
    \n*   Composer uses declarative JSON that sits behind the visual canvas where\
    \ dialogs and the responses can be stitched together.\n\n*   It supports NuGet\
    \ package manager, NuGet packages can be consumed in bots that lights up the ability\
    \ to reuse content within an organization just like any other application development.\n\
    \n*   You can test your bots using Composer’s web chat feature or use the Bot\
    \ Emulator.\n\n# Setting up Composer \n\nComposer desktop application is available\
    \ on Windows, MacOS and Linux and can be installed from here. Make you are able\
    \ to connect to the internet. If you are interested in making custom builds of\
    \ composer, refer this Microsoft documentation for pre-requirements and guidance.\n\
    \nFollowing are the steps required to set up the composer:\n\n# Configuration\n\
    \n*   Connections \n\n    Connections are a way of linking Bots with external\
    \ services that could either be from Azure or other external sources. Azure connections\
    \ could include Web Chat, Teams, Speech service etc. and external connections\
    \ are external extensions available as packages via the NuGet packages manager.\n\
    \n*   Skills \n\n    Skills allow referencing existing skills can be associated\
    \ with the bot for re-use.\n\n# Components of Bot Design using Composer\n\nWe\
    \ will explore the following core features of Composer:\n\n*   Dialogs \n\n* \
    \  Recognizers\n\n*   Triggers and Actions\n\n*   Natural Language Processing\
    \ \n\n*   Skills\n\n*   Memory Scopes\n\n# Dialogs\n\nDialogs are the means to\
    \ establish and manage conversations. They are called as “*Adaptive Dialogs*”,\
    \ think of them as a window or interface to engage with Bots with different functionality\
    \ tailored for the input and response in each of them. Dialogs can have one or\
    \ more triggers which are starting points of the conversation. A bot created with\
    \ bot composer, can have two kinds of dialogs – One “*main dialog*” and one or\
    \ more “*child dialogs*”. \n\n# Recognizers\n\nA recognizer is the one that interprets\
    \ messages from the user and splits it into the “*intent*” and “*entity values*”.\
    \ After this process, the message is passed to the Trigger. There are 3 types\
    \ of recognizers, the Default recognizer, which is default, enables the use of\
    \ LUIS and QnA recognizers that come in-built with the composer. It is also possible\
    \ to have custom recognizers or use the regular expression version that lets custom\
    \ extraction of intent and entity values.\n\n# Triggers and Actions\n\nA Trigger\
    \ is an event initiated by a rule written for a given dialog and has one or more\
    \ actions. An action is an execution instruction for the bot to handle. Example\
    \ of a Trigger is “*Intent recognized*” and when something the intent, let’s say\
    \ is “*Agent*”, the action could be to “*Begin a new Dialog*” that starts a separate\
    \ conversation flow with the agent.\n\n# Natural Language Processing\n\n**Natural\
    \ Language Processing** (**NLP**) is a technology that encompasses **Natural Language\
    \ Understanding** (**NLU**) and **Natural Language Generation** (**NLG**). NLU\
    \ is the ability to understand decipher text to know what it means. Imagine a\
    \ user communicating with a bot using words such as <TBD>. NLG is all about generating\
    \ natural language used to respond to users. Let us looks at some details.\n\n\
    There are four NLP components in composer: \n\n*   Language understanding\n\n\
    *   Language generation\n\n*   QnA\n\n*   Orchestration\n\n# Language understanding\n\
    \nInterpreting user input is key to establishing a conversational flow when users\
    \ start their interaction with Bots. Unless the intention of users is understood,\
    \ it isn’t possible to step into the next action. To interpret the language or\
    \ text of a user, Language understanding allows to train language models and associate\
    \ them to the bot. In Composers, this can be done within the dialog framework\
    \ which allows associating different types of “*recognizers*” such as LUIS, Orchestrator\
    \ and regular expression recognizers.\n\n# Language generation\n\nOnce the intent\
    \ and utterances are determined, language generation helps in provided responses\
    \ to the users. This is integrated with the composer’s framework that allows the\
    \ response editor to create replies that are sensitive to the context of the conversations,\
    \ correctness of grammar, and so on.\n\n# QnA\n\nQnA maker or the latest Cognitive\
    \ Service for Language allows to associate knowledge base with bots to provide\
    \ question-answer style conversation by users. Refer to the QnA section for more\
    \ details on this topic.\n\n# Orchestration\n\nOrchestrator can be enabled during\
    \ the creation of the Bot or can be enabled later as well.\n\n![](images/Figure-6.2.jpg)\n\
    \n**Figure 6.2:** Enabling Orchestrator\n\n# Skills\n\nSkills are used to create\
    \ shareable conversation logic. A Skill is like a coded function that does something\
    \ finite – via a task or set of tasks, that can be called from one or more bots.\
    \ It’s a mini-bot, so to say, since it could be a user-facing bot, and a skill,\
    \ that can be re-used in other bots.\n\nA skill is described by a skill manifest\
    \ (JSON file) that defines its actions, input, and output. You can create a skill\
    \ by exporting a bot with Composer. Bots that make use of a skill are termed as\
    \ “*root bots*”. When a skill is used by a bot (and not directly used a bot),\
    \ users can only interact with the “*root bot*” and not with the skill directly.\n\
    \n# Memory Scopes\n\nTo maintain the conversational flow, bots need to save the\
    \ state of the user conversation and context, so that users can continue from\
    \ where they left-off. By default, active dialogs are saved to the memory, and\
    \ other data such as user profiles, preferences, custom properties can also be\
    \ added. All this is done via the properties pane where you could try properties\
    \ that can be used for Bot response, user input and custom.\n\n# [Cognitive Intelligence](#toc.xhtml#s77a)\n\
    \nBuilding an intelligent bot requires stitching together several components.\
    \ Microsoft’s Conversational AI tools including the Bot Service, LUIS, QnA Maker,\
    \ and other cognitive intelligence services such as language, speech, and semantic\
    \ understanding etc., enables developers to build, and deploy intelligent bots\
    \ that naturally interact with users on multiple channels.\n\nFor instance, the\
    \ Microsoft Research project “*Project Conversation Learner*” enables building\
    \ and teaching conversational interfaces that learn directly from interactions.\
    \ It applies machine learning behind-the scenes to decrease manual coding of dialogue\
    \ control logic and its SDK works in conjunction with the Bot Builder SDK.\n\n\
    # [QnA Maker](#toc.xhtml#s78a)\n\nQnA Maker (Managed) is the classic question\
    \ and answer service that provides question answer based conversational dialogue\
    \ capability. This is available separately under the Cognitive Services and is\
    \ an updated version of the erstwhile “*QnA Maker*” service. The QnA Maker Managed\
    \ update brings simplified resource management by creating just two resources\
    \ as part of the service namely the QnA Maker Service and the Cognitive Search.\
    \ It also has support for Azure Monitor for monitoring (as against Application\
    \ Insights that was available before) and provides deep learning NLP ranking model\
    \ as well. We will use this classic service in our sample using the Bot Framework\
    \ SDK later in the chapter.\n\n# [LUIS - Language Understanding Intelligent Service](#toc.xhtml#s79a)\n\
    \nMicrosoft designed LUIS with a vision of democratizing machine learning. A few\
    \ years ago, building your own machine learning models required data scientists\
    \ who spent hours and days and sometimes maybe years in order to build and customize\
    \ “*machine learned*” models for specific domains.\n\n![](images/Figure-6.3.jpg)"
