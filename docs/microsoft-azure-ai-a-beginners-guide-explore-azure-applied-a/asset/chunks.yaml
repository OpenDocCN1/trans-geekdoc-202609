    \ Applied AI Services,  \n\nAzure Cognitive Services and Azure Machine  \n\nLearning\
    \ with Practical Illustrations*\n\n![](images/line.jpg)\n\n# Rekha Kodali\n\n\
    # Sankara Narayanan Govindarajulu\n\n# Mohammed Athaulla\n\n![](images/logo.jpg)\n\
    \n[www.bpbonline.com](http://www.bpbonline.com)\n\n**FIRST EDITION 2022**\n\n\
