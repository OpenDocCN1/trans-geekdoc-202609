    to help model conversations. It also provides UI across multiple canvases and
    the adaptive cards rock. With Cognitive services integration, it becomes easy
    to enable Bots with common and well understood patterns and build intelligence
    into them.


    Bots have to be designed keeping the user interface requirements in mind and users
    have to type or speak as less as possible to get to what they need. Some key considerations
    while designing a bot are not related to its intelligence but about how better
    it makes the user experience are as follows:


    * **Discoverability**: How easily can customers find the bot and start using it?
    Does it support multiple platforms?

    * **Usability**: Number of steps to address a user’s problem.

    * **Productivity**: Time taken to solve the situation versus other mediums of
    communication.

    * **Common Patterns**: Bots are great friends to humans, and everyone looks at
    a use case to bring in bots. Let us take a look at the most common patterns where
    they get used the most.

    * **Task automation**: Bots can perform simple to complex tasks, A simple example
    could be a user password reset while more complex business processes such as customer
    order processing are termed as `Robotic Process Automation` (`RPA`). Interestingly,
    the use of software automation to perform tasks has become popular on social media
    and is called as `Botting`. Some companies provide this as a service to boost
    the following on social media. Instagram uses neural networks to detect botting
    by analyzing word frequency in comments posted and accounts get a `shadowban`
    or even deleted.

    * **Access to knowledge and other content**: Bots can be designed to provide information
    about any topic and it can find and return the information that the user has requested
    by leveraging data from such as relational data in a `SQL` database, `JSON` data
    in a `NoSQL` store, or documents in a document store. They differ from a normal
    chatbot, helping in decision making by training a vast amount of unstructured
    and structured data that produces an expert response.

    * **Human hand-off**: Bots could be super intelligent, but there are times when
    they do not live in isolation and have to hand over the conversations to humans.
    The most common reasons for a bot + human hybrid scenarios are situations where
    it gets complex to handle, or if the situation is critical and needs to be resolved
    quickly or even simply customer’s choice. In such scenarios, there needs to be
    a hand-off trigger from where a human can take over, with or without wait time
    involved during the transition.

    * **Bot to web browser and back**: There are scenarios where Bots could send a
    user to a web browser to complete a task and afterwards resume back once the task
    is done. Most typical use case is Authentication and Authorization with services
    like `Azure Active Directory` to access user’s personal content such as on `Office
    365`. Performing this redirect to a browser and back is a challenge and often
    when implementing a channel, it is a good practice to offer a built-in `HTML`
    window that the bot can use to present applications that would otherwise appear
    in a web browser. This keeps the user to within the conversation while still external
    resources can be accessed.

    * **Websites**: Outside of the standard client applications as `Skype`, `Teams`,
    etc., bots can also exist in a web browser, which is called a `Web Chat`. Instances
    like where websites would like to engage customers providing them with Information
    or Support, can be Bots embedded in the web site and making it easier for users
    to find information or get support quickly rather than navigate through the site.
    Bots can then hand-off the conversation to a human after taking an initial stab
    at the customer request.

    * **Apps**: Bots can be integrated with application directly, using the `Direct
    Line API`. Be it Native mobile applications, Web applications or custom built
    applications that run of computers or devices, Bots can embed themselves into
    these applications and become the first respondents to users and customers.


    # The Bot Framework Composer


    There has to be a tool for everyone, and while `Bot Framework SDK` is for coders,
    there wasn’t an option for non-coders to work with the Bot Framework. With `Bot
    Framework Composer`, Microsoft provides an open-source visual designer that helps
    in visual bot development. This tool was release around mid-2020 and Microsoft’s
    Bot Framework Engineering team has provided a tool that enables rapid developments
    of Bots, so that one can spend less time wiring up and provisioning services.
    Do not confuse this with `Power Virtual Agents` which targets the business users
    and citizen developers and is a `No-Code` platform as well. The difference with
    Composer is that it still provides you with the robust framework to build bots,
    a middle ground between the `Bot Framework SDK` that provides total control in
    building your bots, and the `Bot Composer` that simplifies bot development with
    visual abstraction.


    # Why should you care?


    Built on top of the `Bot Framework SDK`, `Composer` helps author bots, and integrate
    cognitive intelligence services, all in a visual experience. This caters to an
    audience who don’t want to code but still want to build bots for their domain
    specific or business use cases using all the bells and whistles that traditional
    developers has at their disposal. Being open source, doing custom builds or, hosting
    in cloud as a `web application` is possible. You heard that right, composer can
    run as a web application or as a desktop tool.


    The following tasks can be performed using Bot Composer:

    '
  trans: '


    `Conversation as a Service` (`CaaS`) 和 `Conversational User Interfaces` (`CUI`)
    已经在市场上存在了一段时间。任何成功的应用无论界面媒介如何，都有一个共同点——出色的用户体验。对于机器人（Bots）来说，这一点没有改变，因此创造良好的对话用户体验至关重要的。


    微软提供的机器人产品让开发者构建、集成和部署机器人变得更加简单。


    机器人可以用于内部或外部的客户场景。在内部世界，它们可以赋能用户搜索知识、文档，并作为员工和用户的虚拟帮助台来寻求帮助。在外部世界，机器人可以在企业中有一足之地，不仅可以处理咨询、预订等简单的客户场景，还能处理账户管理、支付、零售等高级场景。


    让我们来看一下细节，我们将从 Bot Framework 提供的功能开始，快速浏览 Emulator（模拟器）以及一个演示机器人，然后我们将讨论 Bot Framework
    Composer。


    # 机器人生态系统


    微软提供 Bot Framework 作为构建机器人的底层平台。`Azure Bot Service`是一项 `Azure` 服务，帮助在 `Azure`
    上托管机器人，并提供如连接和身份验证等功能。理解 `Bot Framework` 和 `Bot Service` 之间的区别非常重要。除了底层的 `Bot
    Framework` 之外，微软还提供了 `Bot Composer` 和 `Power Virtual Agents` 等产品，它们构建在 `Bot Framework`
    之上，提供了现成的接口和函数以快速开发应用程序。


    以下是微软提供的不同服务下的机器人格局概览：


    ![](img/Figure-6.1.jpg)


    **图 6.1：** 机器人格局


    # Bot Framework


    Microsoft Bot Framework 提供了构建和连接智能机器人所需的一切。该框架实现了标准协议，并提供了精美的工具来帮助建模对话。它还提供了跨多个画布的
    UI 以及强大的自适应卡片（adaptive cards）。通过集成认知服务（Cognitive services），可以轻松启用通用且易于理解的模式，并在其中构建智能。


    设计机器人时必须考虑用户界面需求，用户应尽可能少地输入或说话以获取所需内容。设计机器人时的一些关键考虑因素与其智能性无关，而是关于如何更好地提升用户体验，如下：


    *   **可发现性**：客户多多容易找到并开始使用机器人？它支持多个平台吗？

    *   **可用性**：解决用户问题所需的步骤数。

    *   **生产力**：解决问题所花费的时间与其他通信媒介相比。

    *   **常见模式**：机器人是人类的好伙伴，每个人都会寻找用例来引入机器人。让我们来看看它们被频繁使用的常见模式。

    *   **任务自动化**：机器人可以执行从简单到复杂的任务。一个简单的例子是用户重置密码，而更复杂的业务流程如客户订单处理则被称为 `机器人流程自动化`
    (`RPA`）。有趣的是，使用软件自动化执行任务在社交媒体上变得流行，并被称为 `Botting`。一些公司提供此类服务来增加社交媒体上的粉丝。Instagram
    通过分析发布评论中的词频来检测机器人行为，账号会被“影子封禁”（shadowban）甚至被删除。

    *   **获取知识和其他内容**：机器人可以设计为提供任何主题的信息，并利用来自 `SQL` 数据库中的关系型数据、`NoSQL` 存储中的 `JSON`
    数据或文档存储中的文档来查找并返回用户请求的信息。它们与普通机器人不同，通过训练大量的非结构化和结构化数据来产生专家级回复，帮助决策。

    *   **人工接管**：机器人可能非常智能，但有时它们并不是孤立运行的，必须将对话交接给人类。机器人+人类混合场景的最常见原因是处理变得复杂，或者情况紧急并需要快速解决，甚至仅仅是客户的选择。在这种情况下，需要一个交接触发器，让人类可以接管，无论转换期间是否涉及等待时间。

    *   **机器人到网页浏览器再返回机器人**：在某些场景下，机器人可以将用户引导到网页浏览器以完成任务，并在任务完成后返回。最典型的用例是使用 `Azure
    Active Directory` 等服务进行身份验证和授权，以访问如 `Office 365` 等用户个人内容。执行这种重定向到浏览器再返回是一项挑战，通常在实现通道（channel）时，良好的做法是提供一个机器人可以使用内置
    `HTML` 窗口，用于展示本应出现在网页浏览器中的应用程序。这让用户保持在对话框中，同时可以访问外部资源。

    *   **网站**：除了 `Skype`、`Teams` 等标准客户端应用外，机器人也可以存在于网络浏览器中，被称为 `Web Chat`（网络聊天）。对于网站希望与客户互动提供信息或支持等实例，可以将机器人嵌入网站中，让使用户更容易找到信息或快速获得支持，而不是在网站中反复导航。机器人在初步处理客户请求后，可以将对话交接给人类。

    *   **应用**：机器人可以使用 `Direct Line API` 直接与应用程序集成。无论是原生移动应用、Web 应用还是在计算机或设备上运行的自定义应用程序，机器人都可以嵌入这些应用程序中，并成为用户和客户的第一响应者。


    # Bot Framework Composer


    每个人都需要一个工具，虽然 `Bot Framework SDK` 是给编码人员使用的，但非编码人员没有与 Bot Framework 工作的选项。通过 `Bot
    Framework Composer`，微软提供了一个开源的可视化设计器，帮助可视化机器人开发。该工具于 2020 年左右发布，微软 Bot Framework
    工程团队提供了一个能够快速开发机器人的工具，以便人们花费更少的时间在连接和配置服务上。不要将其与 `Power Virtual Agents` 混淆，后者针对业务用户和初级开发者，也是一个无代码（No-Code）平台。Composer
    的区别在于，它仍然为你提供了构建机器人的稳健框架，它介于提供机器人构建完全控制的 `Bot Framework SDK` 和通过视觉抽象简化机器人开发的 `Bot
    Composer` 之间（注：此处原文此处可能笔误，应指 SDK 与 Composer 的对比）。


    # 为什么你需要关注它？


    `Composer` 构建在 `Bot Framework SDK` 之上，帮助编写机器人并集成认知智能服务，且都在可视化体验中完成。这迎合了那些不想代码但仍希望为自己的领域或业务用例构建机器人，并使用传统开发者所拥的所有功能的人群。由于是开源的，可以进行自定义构建或者作为
    `web application` 托管在云端。你没听错，composer 可以作为 Web 应用程序或桌面工具运行。


    使用 Bot Composer 可以执行以下任务：


