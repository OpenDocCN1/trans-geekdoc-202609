    \ Python bindings called `NimbusML`. We can create `ML.NET` models in Python with\
    \ `NimbusML`. These models can be consumed in `.NET` applications.\n* **Tools**:\
    \ We can use `ML.NET`’s tools (Model Builder in Visual Studio or the cross platform\
    \ CLI) to make model training even easier. These tools use the `ML.NET AutoML\
    \ API` internally to try many different combinations of algorithms and configurations\
    \ in order to find the best model for our data and scenario. Now we will discuss\
    \ the algorithms that are supported by `ML.NET`.\n\n# Algorithms supported by\
    \ ML.NET](#toc.xhtml#s108a)\n\n`ML.NET` supports a number of training algorithms.\
    \ An algorithm is a math that executes to define the model that will be produced\
    \ with unique characteristics. With `ML.NET`, the same algorithm can be applied\
    \ to different kinds of tasks while how the output of the algorithm is interpreted\
    \ differs. For instance, Stochastic Dual Coordinated Ascent can be used for Regression\
    \ and Binary Classification.\n\n# Choosing the right algorithm](#toc.xhtml#s109a)\n\
    \nMachine learning algorithms can be classified as supervised (Classification,\
    \ regression) and unsupervised (clustering).\n\n* **Supervised**: Supervised learning\
    \ is the learning of the model with labelled input data and an algorithm to map\
    \ the input data to the output data. The algorithm learns by predicting the output\
    \ from input data and can predict the output where a new input value is provided.\
    \ It involves offline analysis of data. Accuracy is higher.\n\nSupervised learning\
    \ can be further classified into:\n\n    * **Classification**: This type of learning\
    \ is applicable to predict an output variable where the output is a category like\
    \ the color of a dress etc.\n    * **Regression**: This type of learning is applicable\
    \ to predict an output variable continuous value like predicting taxi fare for\
    \ a given trip based on certain conditions.\n    * **Unsupervised**: This type\
    \ of learning learns from unlabeled input data where there is no corresponding\
    \ output variable. It involves real time analysis of data.\n    * **Clustering**:\
    \ A clustering problem is where we want to discover grouping in the input data\
    \ provided like grouping customers by segments. The model learns by looking at\
    \ training data that are similar to each other and clusters them together like\
    \ similar kind of birds.\n    * **Association**: An association rule learns by\
    \ looking at the correlation of features in existing sample data. For instance,\
    \ suggesting accessories for a dress purchased.\n    * **Semi-supervised**: This\
    \ type of learning is applicable where some portion of the input data is labeled\
    \ but most portion of it is unlabeled.\n\nA number of factors determine the right\
    \ algorithm to choose. The choice of the right algorithm depends on the problem\
    \ we are solving, the characteristics of input data, and the compute and storage\
    \ resources. Sometimes we might have to try different algorithms to find the one\
    \ that works best for the problem statement.\n\nAlgorithms work on features which\
    \ are numerical values that are computed from input data. We can convert raw data\
    \ into features using one or more data transforms. Transformed features are referred\
    \ to as featurized text or featurized image data, etc.\n\nFollowing is a view\
    \ of the algorithms to be used for each type of task:\n\n![](images/Figure-7.2.jpg)\n\
    \n**Figure 7.2:** Algorithms supporting various ML tasks\n\nFor each algorithm/task\
    \ combination, `ML.NET` provides a trainer that executes the training algorithm.\
    \ We will now discuss trainers.\n\n# Trainers](#toc.xhtml#s110a)\n\nFor each combination\
    \ of an algorithm and a task, `ML.NET` provides a trainer component that executes\
    \ the training algorithm and performs the interpretation. For instance, for regression\
    \ the `SdcaRegressionTrainer` leverages the `StochasticDualCoordinatedAscent`\
    \ algorithm.\n\nGiven below are the some of the Trainers supported by `ML.NET`:\n\
    \n* **Linear Trainers**: Linear trainers create a model that calculate scores\
    \ from a linear combination of the input data and a set of corresponding weights.\
    \ Linear algorithms work well for features that are linearly separable.\n\n  \
    \  ![](images/Figure-7.3.jpg)\n\n    **Figure 7.3:** Linear Trainers\n\n* **Averaged\
    \ Perceptron**: This is used to classify inputs into several possible outputs\
    \ based on a linear function, and then combined with a set of weights that are\
    \ derived from the feature vector. This is good for text classification.\n* **Stochastic\
    \ dual coordinated ascent**: This is used to solve regularized loss minimization\
    \ problems in machine learning.\n* **L-BFGS**: This is an optimization algorithm\
    \ used for parameter estimation to train various machine learning models using\
    \ a limited amount of memory. This is used when the number of features is huge.\n\
    * **Symbolic Gradient Descent**: This is used for minimizing loss functions with\
    \ the form of a sum. This is very accurate and very fast.\n* **Decision Tree Trainers**:\
    \ Decision tree trainers are applicable to features that are not separable linearly.\
    \ These algorithms create a model which is based on a decision series. The features\
    \ for a decision tree algorithm need not be normalized and are very accurate.\n\
    \n    Following are the various decision tree trainers in ML.NET:\n\n    ![](images/Figure-7.4.jpg)\n\
    \n    **Figure 7.4:** Decision Tree Trainers\n\n* **Light Gradient Boosted Machine**:\
    \ This is a gradient boosting framework and is capable of handling large data\
    \ and is designed to be distributed and efficient with faster training speed,\
    \ lower memory usage and higher accuracy and efficiency.\n* **Fast Tree**: Fast\
    \ Tree does not require the entire data set to be read for learning hence reducing\
    \ the time for learning and is efficient in terms of memory as well. Fast tree\
    \ performs a test and train process each time test data arrives. This works well\
    \ when the number of features is very high.\n* **Generalized Additive Model**:\
    \ This is used when a linear predictor depends linearly on unknown smooth functions.\n\
    \nBoosted decision trees are an ensemble of smaller trees. Each tree in the ensemble\
    \ scores the input data. This input data is passed to the next tree to produce\
    \ a better score. Now we will look at the steps involved in creating a ML.NET\
    \ model.\n\n# Creating a ML.NET Model](#toc.xhtml#s111a)\n\nA Machine Learning\
    \ model helps in performing the transformation on input data and gives as output\
    \ the predicted data. The basic steps in creating a model are given as follows:\n\
    \n![](images/Figure-7.5.jpg)\n\n**Figure 7.5:** Steps in creating ML.NET Model\n"
  trans: "\n* **数据转换**：`ML.NET` 提供了许多数据转换器，可以将数据转换为 ML 算法（如文本特征提取器）接受的格式。\n* **模型训练**：经典\
    \ ML 任务：`ML.NET` 支持许多算法，如分类、回归、聚类、异常检测、推荐引擎等。它提供了超过 40 种训练器供特定任务选择。8. 扩展——利用 ML.NET\
    \ 查看第 1 章，‘Azure AI 平台与服务] [ 4 ] 计算机视觉：`ML.NET` 还提供了基于 TensorFlow 的图像分类/识别功能，可以使用我们自定义的图像。\n\
    * **模型消费与评估**：\n    * **模型消费**：一旦训练好模型，我们就可以使用预测引擎进行预测。\n    * **模型评估**：我们可以使用\
    \ `ML.NET` 提供的评估器来确定模型的准确性。\n* **扩展**：`ML.NET` 帮助简化其他机器学习基础设施库和运行时，例如 Cognitive\
    \ ToolKit、TensorFlow 和 ONNX。微软 `Cognitive Toolkit` (`CNTK`) 是一个开源工具包，提供深度学习能力。TensorFlow\
    \ 是一个由 Google Brain 团队开发的、用于加速机器学习和深度神经网络研究的库。ONNX 是开放神经网络交换格式。它是一种开源共享模型表示，有助于框架的互操作性和共享优化。`ML.NET`\
    \ 还提供了名为 `NimbusML` 的 Python 绑定。我们可以在 Python 中通过 `NimbusML` 创建 `ML.NET` 模型。这些模型可以在\
    \ `.NET` 应用中消费。\n* **工具**：我们可以使用 `ML.NET` 的工具（Visual Studio 中的 Model Builder 或跨平台\
    \ CLI）让模型训练变得更加简单。这些工具内部使用 `ML.NET AutoML API` 来尝试许多不同的算法和配置组合，以便为我们的数据和场景找到最佳模型。现在我们将讨论\
    \ `ML.NET` 支持的算法。\n\n# ML.NET 支持的算法\n\n<a name=\"toc.xhtml#s108a</a>\n\n`ML.NET`\
    \ 支持多种训练算法。算法是一种执行的数学方法，用于定义生成具有独特特征的模型。通过 `ML.NET`，相同的算法可以应用于不同的任务，但算法输出的解释方式有所不同。例如，随机对坐标上升法（Stochastic\
    \ Dual Coordinated Ascent）可用于回归和二分类。\n\n# 选择合适的算法\n\n<a name=\"toc.xhtml#s109a</a>\n\
    \n机器学习算法可以分为监督学习（分类、回归）和无监督学习（聚类）。\n\n* **监督学习**：监督学习是使用带标签的输入数据和将输入数据映射到输出数据的算法对模型进行学习。该算法通过从输入数据中预测输出来学习，并能够在提供新输入值时预测其输出。它涉及对数据的离线分析。准确性较高。\n\
    \n监督学习可以进一步分类为：\n\n    * **分类**：此类学习适用于预测输出变量，该输出为一种类别，例如衣服的颜色等。\n    * **回归**：此类学习适用于预测输出变量的连续值，例如根据某些条件预测特定行程的计程费。\n\
    \    * **无监督**：此类学习从无标签的输入数据中学习，这些数据没有对应的输出变量。它涉及对数据的实时分析。\n    * **聚类**：聚类问题是我们想要发现提供的输入数据中的分组，例如按细分划分客户。模型通过查看相互相似的训练数据并将它们聚在一起（类似于相似种类的鸟类）来学习。\n\
    \    * **关联**：关联规则通过查看现有样本数据中特征的相关性来学习。例如，为购买的衣服推荐配件。\n    * **半监督学习**：此类学习适用于部分输入数据已标记但大部分数据未标记的情况。\n\
    \n有许多因素决定了选择何种合适的算法。合适算法的选择取决于我们正在解决的问题、输入数据的特征以及计算和存储资源。有时我们可能需要尝试不同的算法，以为我们的数据和场景找到最佳模型。现在我们将讨论\
    \ `ML.NET` 支持的算法。\n\n`ML.NET` 支持多种训练算法。算法是一种执行的数学方法，用于定义生成具有独特特征的模型。通过 `ML.NET`，相同的算法可以应用于不同的任务，但算法输出的解释方式有所不同。例如，随机对坐标上升法可用于回归和二分类。\n\
    \n# 训练器\n\n<a name=\"toc.xhtml#s110a</a>\n\n对于每种算法的组合，`ML.NET` 提供一个执行训练算法的训练器组件。我们现在讨论训练器。\n\
    \n以下是 `ML.NET` 支持的一些训练器：\n\n* **线性训练器**：线性训练器通过输入数据的线性组合和一组权重创建模型。线性算法适用于线性可分的特征。\n\
    \n    ![图 7.3: 线性训练器](img/Figure-7.3.jpg)\n\n    **图 7.3: 线性训练器**\n\n* **平均感知器**：这用于根据线性函数将输入分类到几种可能的输出，然后结合特征向量派生的权重权重。这适用于文本分类。\n\
    * **随机对坐标上升**：这用于解决机器学习中的正则化损失最小化问题。\n* **L-BFGS**：这是一种使用有限内存训练各种机器学习模型的优化算法。这在特征数量巨大时适用。\n\
    * **符号梯度下降**：这用于最小化求和形式的损失函数。非常准确且快速。\n* **决策树训练器**：决策树训练器适用于非线性可分的特征。这些算法创建基于决策序列的模型。决策树算法的特征不需要归一化且非常准确。\n\
    \n    以下是 `ML.NET` 中的各种决策树训练器：\n\n    ![图 7.4: 决策树训练器](img/Figure-7.4.jpg)\n\n\
    \    **图 7.4: 决策树训练器**\n\n* **轻量级梯度提升**：这是一种梯度提升框架，能够处理大量数据，并设计为分布式，具有更快的训练速度、更低的内存占用以及更高的准确性和效率。\n\
    * **快速树**：快速树不需要读取整个数据集即可学习，因此缩短了学习时间，在内存方面也高效。快速树每次测试数据到达时都会执行测试和训练过程。这在特征非常多时效果良好。\n\
    * **广义加性模型**：当线性预测器线性依赖于未知平滑函数时使用。\n\n提升树是树的集合。集合中的每棵树都对输入数据进行评分。输入数据被传递给下一棵树以产生更好的评分。现在我们将查看创建\
    \ `ML.NET` 模型所需的步骤。\n\n# 创建 ML.NET 模型\n\n<a name=\"toc.xhtml#s111a</a>\n\n机器学习模型有助于对输入数据执行转换，并将预测数据作为输出。创建模型的基本步骤如下：\n\
    \n![图 7.5: 创建 ML.NET 模型的步骤](img/Figure-7.5.jpg)\n\n**图 7.5: 创建 ML.NET 模型的步骤**\n"
