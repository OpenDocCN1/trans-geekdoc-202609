    \ reserve a seat at McDonalds”. And when you go ahead and ask a question “do you\
    \ serve frozen burgers?” or even just send a phrase such as “frozen burgers”,\
    \ the bot rightly answers the question. However, when you ask a common questions\
    \ such as “where to find McDonalds?”” or ask “Do i have a table reserved at McDonalds\
    \ this evening?”” the code is written in a way to respond back with the intent\
    \ determined by the dispatcher bot. Bot responds with the `RestaurantReservatoin.FindReservationEntry`\
    \ as the intent. When you follow-up by “can you confirm a reservation for me tonight?”,\
    \ the bot rightly picks up the `RestaurantReservation.Confirm` entity denoting\
    \ that the question’s intent was to confirm the restaurant. The bot code is basic\
    \ and right now only written to display the chosen intent and the related intents\
