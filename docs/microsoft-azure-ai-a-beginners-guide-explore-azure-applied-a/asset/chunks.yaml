    \ commerce and AR/VR help in building immersive applications. Immersive applications\
    \ incorporate intelligent features such as emotion and sentiment detection, vision\
    \ and speech recognition, language understanding, knowledge, and search. Azure\
    \ AI Platform provides the capability to build such applications very quickly.\
    \ Azure AI Platform can be broadly classified into four Services/Components as\
    \ depicted below:\n\n![](images/Figure-1.1.jpg)\n\n**Figure 1.1:** Components\
    \ provided by Azure to build AI-based applications\n\n## Azure Applied AI Services\n\
    \nAzure Applied AI Services are built leveraging Azure Cognitive Services. They\
    \ help in tasks like boosting literacy in the classroom, diagnosing, monitoring\
    \ anomalies in metrics, knowledge from mining documents, document understanding,\
    \ transcription analysis, and more scenarios.\n\n![](images/Figure-1.2.jpg)\n\n\
    **Figure 1.2:** Azure Applied AI Services\n\n*   **Azure Form Recognizer**: It\
    \ helps in identifying and extracting text, key/value pairs, and table data from\
    \ form documents. It helps in ingesting text from forms and outputs structured\
    \ data that includes the relationships in the original file.\n*   **Azure Metrics\
    \ Advisor**: It helps in identifying and fixing problems leveraging a combination\
    \ of near-real-time monitoring, adapting models to specific scenarios and helps\
    \ with diagnostics and alerts.\n*   **Azure Cognitive Search**: It leverages built-in\
    \ AI capabilities that help in identifying and exploring relevant content.\n*\
    \   **Azure Immersive Reader**: It is an inclusively designed tool that implements\
    \ techniques to improve reading comprehension for language learners, new readers,\
    \ and people with learning differences.\n*   **Azure Video Analyser for Media**:\
    \ It helps extract metadata such as spoken words, faces etc from video and audio\
    \ files.\n*   **Azure Bot Service**: It helps in developing conversational AI\
    \ experiences.\n*   **Azure Cognitive Services**: Developers can rapidly consume\
    \ high-level “finished” services that accelerate the development of AI solutions.\
    \ They help in composing intelligent applications, customized to the organization’s\
    \ availability, security, and compliance requirements.\n*   **Azure Machine Learning**:\
    \ Consists of a set of comprehensive tools and frameworks that help build, deploy,\
    \ and operationalize ML models. They provide an extensive set of supported tools\
    \ and IDEs and Azure ML studio that help in easily building and fine-tuning ML\
    \ models and deploying them.\n*   **AI Infrastructure**: AI Services and tools\
    \ are backed by providing access to large scale infrastructure. It provides hyper-clusters\
    \ of thousands of state-of-the-art GPUs, a breadth of AI hardware that includes\
    \ the most comprehensive set of GPUs, and an array of general-purpose CPUs. It\
    \ provides the latest high-bandwidth networks inside of every server.\n\nWe will\
    \ look at some of the different types of applications that can be built using\
    \ the Azure AI platform.\n\n## AI Services\n\nAI services help access high-quality\
    \ speech, vision, decision-making, language, and AI models through simple REST\
    \ API calls and also provide the ability to create our own machine learning models.\n\
    \nAI services offered can be broadly classified as follows:\n\n![](images/Figure-1.3.jpg)\n\
    \n**Figure 1.3:** AI services\n\nThe following is an overview of AI Services:\n\
    \n### Trained Services (Prebuilt)\n\nTrained Services are Microsoft Azure Cognitive\
    \ Services that offer a set of machine learning-based Azure Rest APIs that can\
    \ be easily integrated into applications to infuse intelligence.\n\n*   **Use\
    \ cases for Trained/Prebuilt Services**: The following are a few use cases for\
    \ leveraging Cognitive/Trained services:\n\n    ![](images/Figure-1.4.jpg)\n\n\
    \    **Figure 1.4:** Trained/Prebuilt/Cognitive Services\n\n    *   **HealthCare**:\
    \ We can leverage `OCR` and `Read` APIs and other custom algorithms/logic as appropriate\
    \ to go through large volumes of text that includes references to general entities\
    \ (e.g. people’s names) and domain-specific ones (e.g. drug and disease names)\
    \ that need to be connected and related. Sometimes we also need to combine this\
    \ with imagery that’s analyzed in well-known ways (e.g. `OCR`) as well as apply\
    \ leading-edge methods (e.g. AI-assisted diagnostics)\n    *   **Oil and Gas companies**:\
    \ Oil and Gas companies have teams of geologists and other specialists that need\
    \ to understand seismic and geologic data. They often have a huge library of PDFs\
    \ with pictures of samples over sample sheets full of handwritten field notes.\
    \ They need to connect places, people (domain experts), events, and navigate all\
    \ this information to make key decisions. We can leverage `OCR` and other custom\
    \ algorithms/logic to analyse and make decisions.\n    *   **Insurance**: Fraud\
    \ Risk Analysis can be done by identifying anomalies in transactions using `Azure\
    \ Machine Learning`, `Face Recognition` can be used as an additional authentication\
    \ mechanism.\n\n### Conversational AI\n\nConversational AI helps in creating AI-based\
    \ conversational interfaces. Azure provides Bot service which includes `Bot Builder\
    \ SDK` and tools for end-to-end bot development and `Bot Connector` service to\
    \ connect to multiple channels. We can create bots in a number of languages.\n\
    \nA Bot is a web service that communicates using a conversational interface and\
    \ leverages `Bot Framework Service` to exchange events and messages between the\
    \ Bot and the channel.\n\nBot functionality can be extended by adding additional\
    \ features like NLP etc. Microsoft Cognitive Services such as `Language Understanding\
    \ Service` (`LUIS`), can be added to the Bot interactions to make the conversation\
    \ more intuitive.\n\nThe following are some ways of extending Bot functionality:\n\
    \n![](images/Figure-1.5.jpg)\n\n**Figure 1.5:** Extending Bot Functionality\n\n\
    The following table shows some of the additional features that can be leveraged\
    \ to extend Bot functionality.\n\n| Feature | Description |\n| --- | --- |\n|\
    \ Natural language processing | NLP can be used to recognize and understand the\
    \ user’s intent, catch spelling mistakes, enable speech etc. |\n| Q & A | A knowledge\
    \ base can be leveraged to make the conversation more natural. |\n| Manage multiple\
    \ models | ‘Manage multiple models’ feature can be used to manage multiple models\
    \ like `LUIS`, `Q&A maker`. |\n| Add cards and buttons | Cards and buttons can\
    \ be used to enhance user experience. |\n\n**Table 2.1:** Leveraging Bot Functionality\n\
    \nUse cases for conversational AI: A few use cases where conversational AI can\
    \ be leveraged are as follows:\n\n*   Bots can help Insurers give their customers\
    \ an easy way to look up the status of a claim and ask questions about benefits.\n\
    *   Bots can help providers triage patient issues with a symptom checker, help\
    \ patients find care, and look up nearby doctors.\n*   Bots can help end customers\
    \ have intelligent conversations with banks /retail websites.\n*   Bots can be\
    \ built leveraging language understanding models, bing knowledge and content out\
    \ of the box. They are capable of learning from previous interactions.\n\n## Custom\
    \ services"
  trans: "\n\n*   Azure 提供的构建 AI 应用程序平台\n*   Azure 认知服务 – 核心方面\n*   对话式 AI\n*   Azure\
    \ 计算机视觉\n*   用例 – 企业场景\n*   设置开发工具\n\n## 目标\n\n阅读本章后，读者将理解 Azure AI 平台、Azure 认知服务的核心概念、Azure\
    \ 计算机视觉提供的各种服务以及利用 Azure 计算机视觉的具体用例。\n\n## Azure AI 平台\n\n智能应用程序利用人工智能为用户提供丰富、自适应、个性化、沉浸且上下文相关的体验，并具有自主性。文本、语音和视觉的自然接口解锁了对话商务和\
    \ AR/VR 等新类别，有助于构建沉浸式应用程序。沉浸式应用程序整合了情感和情绪检测、视觉和语音识别、语言理解、知识和搜索等智能功能。Azure AI 平台提供了快速构建此类应用程序的能力。Azure\
    \ AI 平台可以大致分为四类服务/组件，如下：\n\n![](img/Figure-1.1.jpg)\n\n**图 1.1:** Azure 提供的构建\
    \ AI 应用程序的组件\n\n## Azure 应用 AI 服务\n\nAzure 应用 AI 服务是基于 Azure 认知服务构建的。它们有助于完成任务，如提高课堂素养、诊断、指标异常监控、从文档中挖掘知识、文档理解、转录分析等场景。\n\
    \n![](img/Figure-1.2.jpg)\n\n**图 1.2:** Azure 应用 AI 服务\n\n*   **Azure Form Recognizer**:\
    \ 它帮助从表单文档中识别并提取文本、键值对和表格数据。它有助于从表单导入文本，并输出包含原始文件中关系的结构化数据。\n*   **Azure Metrics\
    \ Advisor**: 它通过结合近实时监控、适应特定场景的模型来帮助识别并修复问题，并辅助诊断和告警。\n*   **Azure Cognitive Search**:\
    \ 它利用内置的 AI 能力，帮助识别和探索相关内容。\n*   **Azure Immersive Reader**: 这是一个包容性设计的工具，通过实施各种技术来提高语言学习者、新阅读者以及学习差异者的阅读理解能力。\n\
    *   **Azure Video Analyser for Media**: 它帮助从视频和音频文件中提取语音词、人脸等元数据。\n*   **Azure\
    \ Bot Service**: 它有助于开发对话式 AI 体验。\n*   **Azure Cognitive Services**: 开发者可以快速消费高级“成品”服务，加速\
    \ AI 解决方案的开发。它们有助于根据组织的可用性、安全性和合规性要求定制智能应用程序。\n*   **Azure Machine Learning**:\
    \ 由一套全面的工具和框架组成，有助于构建、部署和运行机器学习模型。它们提供了一系列支持的工具、IDE 以及 Azure ML studio，有助于轻松构建、微调机器学习模型并进行部署。\n\
    *   **AI 基础设施**: AI 服务和工具通过提供访问大规模基础设施作为支持。它提供了包含数千个尖端 GPU 的超集群、涵盖最全面 GPU 集的广泛\
    \ AI 硬件，以及一系列通用 CPU。它在每个服务器内部都提供了最新的高带宽网络。\n\n我们将查看使用 Azure AI 平台可以构建的不同类型的应用程序。\n\
    \n## AI 服务\n\nAI 服务有助于通过简单的 REST API 调用访问高质量的语音、视觉、决策、语言和 AI 模型，并提供创建我们机器学习模型的能力。\n\
    \n提供的 AI 服务可以大致分类如下：\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3:** AI 服务\n\n以下是 AI\
    \ 服务的概述：\n\n### 训练好的服务（预构建）\n\n训练好的服务是 Microsoft Azure 认知服务，它们提供了一系列基于机器学习的 Azure\
    \ Rest APIs，可以轻松集成到应用程序中以注入智能。\n\n*   **训练好的/预构建的服务的用例**：以下是利用认知/训练好的服务的几个用例：\n\
    \n    ![](img/Figure-1.4.jpg)\n\n    **图 1.4:** 训练好的/预构建/认知服务\n\n    *   **医疗保健**:\
    \ 我们可以根据需要利用 `OCR` 和 `Read` API 以及其他自定义算法/逻辑处理大量文本，这些文本包含对通用实体（如人名）和特定领域实体（如药物和疾病名称）的引用，这些实体需要进行连接和关联。有时我们还需要将其与以已知方式分析的图像（例如\
    \ `OCR`）相结合，并应用领先的方法（例如 AI 辅助诊断）。\n    *   **石油天然气公司**: 石油气公司拥有地质学家和其他专家团队，他们需要理解地震和地质数据。他们通常拥有大量的\
    \ PDF 库，其中包含样本照片以及写满手写现场笔记的样本表。他们需要连接地点、人员（领域专家）、事件，并导航所有信息以做出关键决策。我们可以利用 `OCR`\
    \ 和其他自定义算法/逻辑进行分析并做出决策。\n    *   **保险**: 可以通过 `Azure Machine Learning` 识别交易中的异常来完成欺诈风险分析，`Face\
    \ Recognition` 可作为身份验证机制。\n\n### 对话式 AI\n\n对话式 AI 有助于创建基于 AI 的对话界面。Azure 提供了 Bot\
    \ 服务，包括用于端到端开发的 Bot Builder SDK 以及连接多个通道的 Bot Connector 服务。我们可以用多种语言创建 Bot。\n\n\
    Bot 是一种使用对话界面进行通信的 Web 服务，并利用 Bot Framework Service 在 Bot 和通道之间交换事件和消息。\n\n可以通过添加\
    \ NLP 等附加功能扩展 Bot 功能。微软认知服务如语言理解服务 (`LUIS`）可以添加到 Bot 交互中，使对话更加直观。\n\n以下是扩展 Bot\
    \ 功能的一些方式：\n\n![](img/Figure-1.5.jpg)\n\n**图 1.5:** 扩展 Bot 功能\n\n下表显示了用于扩展 Bot\
    \ 功能的一些附加功能。\n\n| 功能 | 描述 |\n| --- | --- |\n| 自然语言处理 | NLP 可用于识别和理解用户的意图、捕捉拼写错误、启用语音等。\
    \ |\n| 问答 | 可以利用知识库使对话更自然。 |\n| 管理多个模型 | “管理多个模型”功能可用于管理多个模型，如 `LUIS`、`Q&A maker`。\
    \ |\n| 添加卡片和按钮 | 卡片和按钮可增强用户体验。 |\n\n**表 2.1:** 利用 Bot 功能\n\n对话式 AI 的用例：利用对话式 AI\
    \ 的几个用例如下：\n\n*   Bot 可以帮助保险公司为其客户提供一种简便的方法来查看理赔状态并询问有关福利的问题。\n*   Bot 可以帮助医疗提供者通过症状检查器分诊患者问题，帮助患者寻找医疗服务并查找附近的医生。\n\
    *   Bot 可以帮助终端客户与银行/零售网站进行智能对话。\n*   Bot 可以利用语言理解模型、Bing 知识和内容进行构建。它们能够从之前的交互中学习。\n\
    \n## 自定义服务\n"
