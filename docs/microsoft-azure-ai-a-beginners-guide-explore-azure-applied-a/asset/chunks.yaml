    After reading this chapter, the reader will understand how to use Decision, Language,
    Speech and Web Search services of Azure Cognitive Services. The reader will learn
    about Anomaly detector, Content Moderator, Personalizer, Text Analytics, Azure
    Functions and Azure Cognitive Service Containers.


    # Structure


    In this chapter, the topics covered are as follows:


    * Decision service

    * Content moderator: Use case, Detailed APIs

    * Personalizer

    * Language service

    * Azure Logic Apps and Functions

    * Speech service

    * Web search service


    # Objective


    In this chapter, we will explore the decision, language, speech, and Web Search
    services of Azure Cognitive Services. By the end of this chapter, the reader will
    understand how to effectively build applications using each of the mentioned Azure
    Cognitive Services.


    # Decision service


    Decision service is used to make good decisions using `Decision APIs` by helping
    in analyzing the data and deriving insights from the same.


    The main services available under this category are as follows:


    * **Anomaly Detector**: Anomaly detector helps in monitoring and detecting anomalies
    in the data and can be used in the cloud or edge and can be easily customized.
    Anomaly detector takes time-series data as input and uses anomaly detection algorithms
    to help detect dips, spikes in the data.


    Some sample use cases where Anomaly detection API can be leveraged are provided
    as follows:


    ![](images/Figure-4.1.jpg)


    **Figure 4.1:** Anomaly Detection use cases


    We will look at is a sample use case flow for Anomaly Detection:


    ![](images/Figure-4.2.jpg)


    **Figure 4.2:** Anomaly Detection Sample Use case Flow


    Time Series data is ingested from data sources which could include `SQL DB`, `Azure
    DB`. Anomaly Service picks the data and detects anomalies. The `Anomaly Detector
    API`’s algorithms adapt by automatically identifying and applying the best-fitting
    models to input data, the Anomaly Detector determines the boundaries for anomaly
    detection as to which are the expected values, and which are anomalies in the
    data points.


    Detailed flow is as follows:


    * Data is ingested from data sources like `SQL DB`, `Event Hubs` etc.

    * `Databricks` or any other compute resource is used to generate the time series
    by aggregating and computing the raw data.

    * `Azure Function` picks the message from the message queue based on the anomaly-related
    metadata and sends the alert about the anomaly.

    * `Data Lake` stores the anomaly detection metadata.

    * `Power BI` is used to visualize the results.

    * **Content Moderator**: `Content Moderator API` helps in monitoring social media
    applications for offensive content and identifies offensive content like posts
    or videos and flags those.

    * Few scenarios where it can be effectively used include moderating content in
    social messaging platforms, organizations, schools etc.

    * The following figure shows the available APIs that help in moderation of text,
    images, and videos. We can leverage the APIs to check objectionable content in
    the text/images.


    ![](images/Figure-4.3.jpg)


    **Figure 4.3:** Content Moderator APIs


    We will look at a sample use case for content moderator.


    # Content Moderator-Use case


    When a user uploads an image the program checks if the image has objectionable
    content.


    To check whether an image contains objectionable content we will leverage `Azure
    Container`, `Blob storage`, `Image Moderation API` and Perform the following steps:


    The input to be provided is an image that the user uploads.


    Given below is the program flow explained in detail:


    * User uploads an image.

    * The image is stored in a `blob`.

    * `Azure function` gets triggered when an image is added to the `blob`.

    * `Image Moderation API` is invoked to check if the image contains racy content.

    * Based on the value the image is stored in `Validated Blob` or `Objectionable
    Blob` for further processing.


    We can leverage `Azure Container`, `Blob storage`, `Image Moderation API` as given
    as follows:


    ![](images/Figure-4.4.jpg)


    **Figure 4.4:** Workflow to be developed for the use case


    # Content Moderator-Detailed APIs


    Azure Content Moderator cognitive service verifies and flags text, image, and
    video content for material that is offensive with labels. The Content Moderator
    service includes Moderation APIs which help in detecting offensive content.


    The following are the details of Custom lists:


    | API group | Usage |

    | --- | --- |

    | Text moderation | Helps scan text for offensive content. Text is classified
    into three categories – Category 1, 2, and 3 based on the adult content present
    in the text. |

    | Custom term lists | Helps use custom lists for flagging offensive content. |

    | Image moderation | Helps scan images and identify offensive content. |

    | Custom image lists | Helps scan images against a custom list. Custom image lists:
    Custom image lists help prevent sharing of offensive images by creating a custom
    list of images. |

    | Video moderation | Helps scan videos for offensive content. |


    **Table 4.1:** Content Moderator-detailed APIs


    # Personalizer


    The Personalizer Service is used to create personalized recommendations for users
    by learning from user-application interactions, based on their online activities.


    Contextual content is provided to users leveraging reinforcement learning. It
    uses user behaviors and activities to surface the right content to the users.


    It uses reinforcement learning as given as follows:


    ![](images/Figure-4.5.jpg)


    **Figure 4.5:** Personalizer Service


    Some of the use cases for Personalizer Service include highlighting content, providing
    menu suggestions, filling up form lists for users, providing contextual decisions
    and filtering content as shown as follows


    ![](images/Figure-4.6.jpg)


    **Figure 4.6:** Personalizer Use Cases


    # Language Service


    Language APIs help users to analyze texts and recognize intents and entities from
    text.


    There are several services available under this category as given as follows:


    * **Immersive Reader**: Immersive Reader is a standalone web application provided
    by Microsoft that enables processing the content for parts of speech, text to
    speech, translation, and more. It implements proven techniques to improve reading
    comprehension for new readers, language learners, and people with learning differences
    such as dyslexia.

    * **LUIS**: This service provides Natural Language Understanding and Interpretation
    Services. LUIS is a cloud-based conversational AI service that applies machine-learning
    intelligence to a user’s conversation to understand the intent of the user, and
    pull out relevant, detailed information. Chatbots can leverage LUIS to understand
    the intent and provide more contextual responses.

