    \ recognition\n* Face API\n* Spatial analysis\n* Sample use cases\n\n# Objective\n\
    In this chapter, the reader will understand how to use handwriting recognition,\
    \ optical character recognition, Face API, and spatial analysis. After reading\
    \ this chapter, the reader will have the skills that make it possible to effectively\
    \ build applications by leveraging handwriting recognition, optical character\
    \ recognition, Face API and spatial analysis.\n\n# Handwritten / Printed text\
    \ recognition\nProcessing handwritten or printed text information is a very important\
    \ aspect of developing smart applications. Computer Vision provides different\
    \ APIs which help in detecting and extracting handwritten or printed text in images.\
    \ This has many use cases spread across domains such as health, insurance, and\
    \ banking.\n\nFollowing diagram shows how we can process printed and handwritten\
    \ notes using easy-to-integrate APIs/SDKs.\n\n![](images/Figure-3.1.jpg)\n\n**Figure\
    \ 3.1:** OCR use case\n\nThe following sections cover the different APIs that\
    \ are available in Computer Vision for OCR.\n\n* **Read API**: Using `Read API`,\
    \ we can convert text into a machine-readable character stream. This asynchronous\
    \ API is good for converting text-heavy images and images that contain a lot of\
    \ noise. It uses the latest recognition models.\n\n  The following of the key\
    \ features of `Read API`:\n    * Supported image types include TIFF, JPEG, BMP,\
    \ PDF and PNG\n    * File size should be less than 20 MB\n    * It can process\
    \ up to 200 pages with a maximum limit of 300 lines per page\n* **OCR API**: We\
    \ can leverage `OCR API` to convert images into text synchronously. This API tries\
    \ to detect the orientation of the text and tries to correct the orientation of\
    \ the image.\n\n  The following are `OCR API` Features:\n    * Supported image\
    \ types include BMP, GIF, PNG and JPEG.\n    * Supports rotation of image by multiples\
    \ of 90 degrees and small angles of up to 40 degrees. Input image should be greater\
    \ than or equal to 40 x 40 and less than or equal to 3200 x 3200 pixels.\n   \
    \ * Size should be less than 10 megapixels.\n    * Size should not be greater\
    \ than 4 MB.\n    * OCR supports 25 different languages and can detect the language\
    \ of the text in the image.\n* **Sample Scenarios**\n  Given below are some sample\
    \ scenarios/use cases in which the above-mentioned APIs are used.\n\n  **Scenario\
    \ 1**:\n    * User uploads a cheque.\n    * The cheque is converted into Digital\
    \ Text using `OCR API`.\n    * The signature is verified.\n    * The cheque is\
    \ cleared.\n\n    ![](images/Figure-3.2.jpg)\n\n    **Figure 3.2:** OCR for handwritten\
    \ cheque use case\n\n  **Scenario 2**: In a scenario in which there are multiple\
    \ patients’ records getting scanned, digitized and stored, providing a comprehensive\
    \ patient record is very useful for providing apt treatment.\n\n  We can create\
    \ an aggregated patient history by performing `OCR` on medical records, insurance\
    \ records from various sources. This provides a comprehensive patient record.\
    \ This is helpful in providing the right treatment.\n\n  Following diagram shows\
    \ how we can use `OCR` to aggregate records from multiple sources:\n  ![](images/Figure-3.3.jpg)\n\
    \n  **Figure 3.3:** OCR to aggregate records from multiple sources.\n\n  **Scenario\
    \ 3**: We can scan and perform `OCR` on documents in one language and translate\
    \ into another language using Azure Text to Speech API.\n\n  ![](images/Figure-3.4.jpg)\n\
    \n  **Figure 3.4:** OCR to aggregate records from multiple sources.\n\n# Handwriting\
    \ recognition lab\nGiven below is a sample for recognizing handwriting. We will\
    \ create a sample .NET console application. The application takes a sample image\
    \ as input. It will recognize and print the text read as the output.\n\nFollow\
    \ the steps for the handwriting lab:\n\n**Step 1**: Create a new C# .NET Core\
    \ Console App.\n\n```csharp\nusing System;\nusing System.Net.Http.Headers;\nusing\
    \ System.Net.Http;\nusing System.Web;\nusing System.IO;\nusing System.Threading.Tasks;\n\
    using Newtonsoft.Json;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using Newtonsoft.Json.Linq;\n```\n\n**Step 2**: Go to `https://portal.azure.com`\
    \ and create a computer vision service.\n\n**Step 3**: Replace with your valid\
    \ subscription key and endpoint.\n\n```csharp\nnamespace HandwritingDetection\n\
    {\ninternal class Program\n{\nprivate static string subscriptionKey = “< subscription\
    \ key>”; //Replace subscription key\nprivate static string\nendpoint = “https://retailocr.cognitiveservices.azure.com/vision/v1.0/ocr?”;\
    \ //Replace endpoint URL\nprivate static void Main()\n{\nvar ch = “1”;\n// Get\
    \ the path and filename to process from the user.\nConsole.WriteLine(“HandWritten\
    \ Text Extraction:\");\nwhile (ch == “1”)\n{\nConsole.Write(“Enter the image path\
    \ with text you wish to read:”);\nstring imgPath = Console.ReadLine();\nif (File.Exists(imgPath))\n\
    MakeRequest(imgPath).Wait();\nelse\nConsole.WriteLine(“\\nInvalid file path”);\n\
    Console.WriteLine(“\\nPress Enter 0 to exit and 1 to continue...”);\nch = Console.ReadLine();\n\
    }\n}\n```\n\n**Step 4**: Create a model class `ImageInfoViewModel.cs`\n\n```csharp\n\
    namespace HandwritingDetection\n{\npublic class Word\n{\npublic List<int> boundingBox\
    \ { get; set; }\npublic string text { get; set; }\npublic double confidence {\
    \ get; set; }\n}\npublic class Line\n{\npublic List<int> boundingBox { get; set;\
    \ }\npublic string text { get; set; }\npublic List<Word> words { get; set; }\n\
    }\npublic class ReadResult\n{\npublic int page { get; set; }\npublic double angle\
    \ { get; set; }\npublic int width { get; set; }\npublic int height { get; set;\
    \ }\npublic string unit { get; set; }\npublic string language { get; set; }\n\
    }\n}\n```\n"
