    \ {testMetrics.LogLossReduction:#.###}”); \n    Console.WriteLine($”*****************************************\
    \ ************************ ********************************************”); \n\
    }\n```\n\nCode snippet for `Main` method:\n\n```csharp\npublic static void Main(string[]\
    \ args) \n{ \n    int ch = 1; \n    do { \n        MLContext mlContext = new MLContext();\
    \ \n        IDataView dataView = mlContext.Data.LoadFromTextFile<AzureAI_Issue>(datasetfilePath,\
    \ hasHeader: true, separatorChar: '\\t', allowSparse: false); \n        var trainTestSplit\
    \ = mlContext.Data.TrainTestSplit(dataView, 0.2); \n        IDataView trainingData\
