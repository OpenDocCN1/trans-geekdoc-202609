    \n    **Figure 1.21:** Use case for Emotional Analysis\n\n*   **Content Moderator**\
    \ can help automate tasks to act on inappropriate content so that content sharing\
    \ sites are safe and easy to use. Video Indexer can then help with home monitoring\
    \ and the translation of movies or videos into other languages (this is beneficial\
    \ in the case of knowledge sharing in multiple languages).\n\n# [Setting up Developer\
    \ Tools](#toc.xhtml#s13a)\n\nWe can leverage Visual Studio Code or Visual Studio\
    \ for the lab exercises discussed in the chapters.\n\nVS Code is a free code editor\
