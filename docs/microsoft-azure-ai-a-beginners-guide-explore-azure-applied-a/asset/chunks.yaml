    \ “);`\n\n`string imgFilePath = Console.ReadLine();`\n\n`if (File.Exists(imgFilePath))`\n\
    \n`FaceAnalysisRequest(imgFilePath);`\n\n`else`\n\n`Console.WriteLine(“\\nFile\
    \ path is Invalid.\\nPress Enter to exit...\\n”);`\n\n`Console.ReadLine();`\n\n\
    `}`\n\n`// Uses Face REST API to Analyze the Image.`\n\n`private static async\
    \ void FaceAnalysisRequest(string imageFilePath)`\n\n`{`\n\n`HttpClient httpClient\
    \ = new HttpClient();`\n\n`// Request headers.`\n\n`httpClient.DefaultRequestHeaders.Add(`\n\
    \n`“Ocp-Apim-Subscription-Key”, faceDetectionSubscriptionKey);`\n\n`// Request\
    \ parameters.`\n\n`string parameters = “returnFaceId=true&returnFaceLandmarks=false”\
    \ +`\n\n`“&returnFaceAttributes=age,gender,headPose,smile,facialHair,glasses,”\
    \ + “emotion,hair,makeup,occlusion,accessories,blur,exposure,noise”;`\n\n`// Below\
    \ URI for the REST API Call.`\n\n`string requestUri = uriBase + “?” + parameters;`\n\
    \n`HttpResponseMessage response;`\n\n`// Request body. Posts a locally stored\
    \ image.`\n\n`byte[] imgByteData = ConvertImageToByteArray(imageFilePath);`\n\n\
    `using (ByteArrayContent content = new ByteArrayContent(imgByteData))`\n\n`{`\n\
    \n`content.Headers.ContentType =`\n\n`new MediaTypeHeaderValue(“application/octet-stream”);`\n\
    \n`// Execute the REST API call.`\n\n`response = await httpClient.PostAsync(requestUri,\
    \ content);`\n\n`// Get the JSON response.`\n\n`string contentString = await response.Content.ReadAsStringAsync();`\n\
    \n`// Display the JSON response.`\n\n`Console.WriteLine(“\\nResponse:\\n”);`\n\
    \n`Console.WriteLine(JsonPrettyPrint(contentString));`\n\n`Console.WriteLine(“\\\
    nPress Enter key to exit...”);`\n\n`}`\n\n`}`\n\n`// Converts specified file to\
    \ byte array.`\n\n`private static byte[] ConvertImageToByteArray(string imageFilePath)`\n\
    \n`{`\n\n`using (FileStream fileStreamReader =`\n\n`new FileStream(imageFilePath,\
    \ FileMode.Open, FileAccess.Read))`\n\n`{`\n\n`BinaryReader binReader = new BinaryReader(fileStreamReader);`\n\
    \n`return binReader.ReadBytes((int) fileStreamReader.Length);`\n\n`}`\n\n`}`\n\
    \n`// Formats the given JSON string by adding line breaks and indents.`\n\n`private\
    \ static string JsonPrettyPrint(string json)`\n\n`{`\n\n`if (string.IsNullOrEmpty(json))`\n\
    \n`return string.Empty;`\n\n`json = json.Replace(Environment.NewLine, “”).Replace(“\\\
    t”, “”);`\n\n`StringBuilder sb = new StringBuilder();`\n\n`bool quote = false;`\n\
    \n`bool ignore = false;`\n\n`int offset = 0;`\n\n`int indentLength = 3;`\n\n`foreach\
    \ (char c in json)`\n\n`{`\n\n`switch (c)`\n\n`{`\n\n`case ‘”’:`\n\n`if (!ignore)\
    \ quote = !quote;`\n\n`break;`\n\n`case ‘\\’’:`\n\n`if (quote) ignore = !ignore;`\n\
    \n`break;`\n\n`}`\n\n`if (quote)`\n\n`sb.Append(c);`\n\n`else`\n\n`switch (c)`\n\
    \n`{`\n\n`case ‘{‘:`\n\n`case ‘[‘:`\n\n`sb.Append(c);`\n\n`sb.Append(Environment.NewLine);`\n\
    \n`sb.Append(new string(‘ ‘, ++offset * indentLength));`\n\n`break;`\n\n`case\
    \ ‘}’:`\n\n`case ‘]’:`\n\n`sb.Append(Environment.NewLine);`\n\n`sb.Append(new\
    \ string(‘ ‘, --offset * indentLength));`\n\n`sb.Append(c);`\n\n`break;`\n\n`case\
    \ ‘,’:`\n\n`sb.Append(c);`\n\n`sb.Append(Environment.NewLine);`\n\n`sb.Append(new\
    \ string(‘ ‘, offset * indentLength));`\n\n`break;`\n\n`case ‘:’:`\n\n`sb.Append(c);`\n\
    \n`sb.Append(‘ ‘);`\n\n`break;`\n\n`default:`\n\n`if (c != ‘ ‘) sb.Append(c);`\n\
    \n`break;`\n\n`}`\n\n`}`\n\n`return sb.ToString().Trim();`\n\n`}`\n\n`}`\n\n`}`\n\
