    Click on create and wait for the bot to be created. At this stage, you are ready
    to use the bot backed by `QnA Maker`’s knowledge base filled with McDonald’s Burger
    FAQ data beneath it. If you wish to download the code for further changes or to
    add on additional services, which is usually the case when you develop a bot,
    go to the “Build” blade and click on the “`Download bot source code`” in the overview
    pane and proceed to download the code when the download is ready.


    ![](images/Figure-6.18.jpg)


    **Figure 6.18:** Basic Bot


    # Using the Emulator


    Once you have the code and want to test in a local environment, then is when you
    the Bot Framework Emulator comes to use. The downloaded code can be opened up
    in Visual Studio or VS Code for further development and build, or just if it’s
    just build and run, then command line or PowerShell can be used too.


    When the code is executed and the bot is running, it listens on the default port
    - `3879` (`localhost`). Open up the Emulator and connect to the running bot to
    interact and test its working.


    As of this writing, the latest release of the Bot Framework emulator is `4.14.1`
    released on 21-Nov-2021.


    You will need to update the `appsettings.json` file in the downloaded code with
    the details such as the `KB Id`, `Endpoint`, `Key` etc. You can get them from
    under “settings” of your Knowledge Base.


    ![](images/Figure-6.19.jpg)


    **Figure 6.19:** Bot Emulator


    After you update, you can run the bot either via Visual Studio or via Command
    line and you should the bot should come up in your browser.


    ![](images/Figure-6.20.jpg)


    **Figure 6.20:** Basic Bot which is ready


    Open the emulator the connect to the bot. If you got an existing bot configuration
    file, it can be opened up straightaway using the “`Open Bot`” button or via the
    file menu, and you are ready to run or debug the bot. If it is the first time,
    then you would create a new bot configuration using the `File` menu and click
    on “`New bot configuration`”.


    ![](images/Figure-6.21.jpg)


    **Figure 6.21:** Bot Emulator


    Once the endpoint is created, emulator makes a connection and is now ready to
    go. You could start conversing with the bot and here is a sample chat that shows
    responses retrieved from the QnA Maker created earlier based on McDonald’s FAQ.


    ![](images/Figure-6.22.jpg)


    **Figure 6.22:** Sample chat that shows responses retrieved from the QnA Maker
    created earlier based on McDonald’s FAQ.


    # Features


    It is important to understand the features and concepts of the Emulator to effectively
    make use of it, let us take a spin.


    ### Transcripts

    A bot transcript file is a `JSON` file that preserves the user-bot interactions.
    A transcript file not only preserves the message’s content, but also interaction
    details such as `user Id`, `channel Id`, `type of channel`, `channel capabilities`,
    `interaction time`, and so on.


    ![](images/Figure-6.23.jpg)


    **Figure 6.23:** Transcripts


    Saved transcripts can be opened again from the `File` menu | `Open Transcript`
    option.


    ![](images/Figure-6.24.jpg)


    **Figure 6.24:** Saved Transcripts


    And it displays the entire conversation along with the log.


    ![](images/Figure-6.25.jpg)


    **Figure 6.25:** Conservation with logs


    ### Chat Files

    Chat Files are used to create mockups of conversations between a user and the
    bot. This is especially useful when the conversation has to be created and tested
    for different paths (conversations), or if it has to be discussed or reviewed
    with non-technical stakeholders. A chat file has `.chat` extension and looks like
    the following:


    ```

    user=sankara bot=BasicBot user: Hi!

    bot: Hello there, I am the basic bot. How can I help you today?

    ```


    It basically is a markdown file that contain 2 parts:


    **Header** - defines the participants of the conversation


    **Actual Conversation** - Back and forth conversation between a user and a bot


    Chat files are created by a tool named “Chatdown” and it is one of the many tools
    available to work with development and testing of Bots. `Chatdown` can convert
    the `.chat` files to `.transcript` files which then can be loaded on to the emulator
    and run to test a bot’s behavior and below is a quick test of this with the sample
    `.chat` file shown above.


    Install Chatdown using `npm` and convert the `basic.chat` file.


    ![](images/Figure-6.26.jpg)


    **Figure 6.26:** Installing Chatdown


    `.transcript` files which then can be loaded on to the emulator and run to test
    a bot’s behavior and below is a quick test of this with the sample `.chat` file
    shown above.


    Install Chatdown using `npm` and convert the `basic.chat` file.


    ![](images/Figure-6.27.jpg)


    **Figure 6.27:** Convert `basic.chat` file


    ![](images/Figure-6.28.jpg)


    **Figure 6.28:** Loading a chat file directly


    Opening the transcript loads it up in the Emulator and runs the chat automatically,
    showing how it would have gone if the user was actually conversing.


    Both Chat files and Transcript files can be accessed under the Resources section:


    *   **Logs**: Log section shown in the lower right area of the emulator records
    all events and activities. Take a look at the log section in figure 6.20.

    *   **Inspector**: Using INSPEOR feature to the right of conversation window,
    you can inspect the raw JSON. When you click on message bubble within the conversation
    window, the bubble will turn yellow and the JSON activity will be shown. Information
    in the JSON displayed includes key metadata like channelID, activity type, conversation
    id, the text message, endpoint URL, and so on.

    *   **Services**: Emulator has the option to add additional services to it. Click
    on the (+) button on the Services pane when the bot is loaded and you would see
    options for adding LUIS, QnA, and Dispatch.

    *   **Debugging**: One of the key features of the Emulator is that it allows to
    debug the interactions captured between a user and a bot. Clicking on any event/activity
    in the Log section shown in the lower right area of the emulator, information
    related to this specific interaction is displayed in the emulator’s Inspector
    window. This enables in resolving those issues.


    Using the transcript files discussed earlier is one of the ways to record conversations
    and use them later for debugging.


    # Adding LUIS to the sample


    In the real world applications of Bots, we would have to deal with different sets
    of entities and very many QnAs. Therefore, it is more likely that we will have
    to use multiple LUIS models and QnA Knowledge bases together to cover all business
    requirements and create a complete experience for users. To provide this experience,
    there should be logic to route the incoming user question to the appropriate intent
    of LUIS or the right knowledge base within QnA Maker KBs. This is where the dispatch
    model and the dispatch tool come in.


    Dispatch tool evaluates LUIS models used to dispatch intent across multiple bot
    modules such as LUIS models, QnA knowledge bases and others. The tool manages
    this by creating a separate LUIS app to route user inputs to the correct model
    or QnA KB.


    Dispatch model has to be used in the following scenarios as described in the Microsoft
    Documentation:


    1.  Your bot consists of multiple modules and you need assistance in routing user’s
    utterances to these modules and evaluate the bot integration.

    2.  Evaluate quality of intents classification of a single LUIS model.

    3.  Create a text classification model from text files.

    '
  trans: '


    点击创建并等待机器人被创建。在此阶段，你已经准备好使用由 `QnA Maker` 知识库支持的机器人，该知识库已填充了麦当汉堡 FAQ 数据。如果你想下载代码进行进一步更改或添加额外的服务（这在开发机器人时很常见），请前往“Build”窗格，并在概述窗中点击“`Download
    bot source code`”，下载就绪后继续下载。


    ![](img/Figure-6.18.jpg)


    **图 6.18:** 基础机器人


    # 使用模拟器


    一旦你获得了代码并想在本地环境中进行测试，这就是 Bot Framework Emulator（框架模拟器）大显身用场了。下载的代码可以在 Visual Studio
    或 VS Code 中打开进行进一步的开发和构建，如果只是为了构建和运行，也可以使用命令行或 PowerShell。


    当代码执行且机器人运行时，它会监听默认端口 - `3879` (`localhost`)。打开模拟器并连接到运行中的机器人，以进行交互并测试其工作情况。


    截至本文，Bot Framework 模拟器的最新版本是 `4.14.1`，发布于 2021 年 11 月 21 日。


    你需要更新下载代码中的 `appsettings.json` 文件，包含如 `KB Id`、`Endpoint`、`Key` 等详情。你可以从知识库的“settings”下获取这些信息。


    ![](img/Figure-6.19.jpg)


    **图 6.19:** 机器人模拟器


    更新后，你可以通过 Visual Studio 或命令行运行机器人，此时机器人应该会在你的浏览器中显示。


    ![](img/Figure-6.20.jpg)


    **图 6.20:** 已就绪的基础机器人


    打开模拟器并连接到机器人。如果你有现有的机器人配置文件，可以直接使用“`Open Bot`”按钮或通过文件菜单打开，你就可以准备好运行或调试机器人了。如果是第一次，你可以使用
    `File` 菜单创建一个新的机器人配置，并点击“`New bot configuration`”。


    ![](img/Figure-6.21.jpg)


    **图 6.21:** 机器人模拟器


    端点创建后，模拟器会建立连接并现在已准备就绪。你可以开始与机器人对话，这里有一个示例聊天，显示了之前根据麦当劳 FAQ 创建的 QnA Maker 获取的响应。


    ![](img/Figure-6.22.jpg)


    **图 6.22:** 显示从之前根据麦当劳 FAQ 创建的 QnA Maker 获取响应的示例聊天。


    # 功能


    理解模拟器的功能和概念对于有效利用它至关重要，让我们来了解一下。


    ### 转记录 (Transcripts)

    机器人转记录文件是一个保留用户与机器人交互情况的 `JSON` 文件。转记录文件不仅保留了消息内容，还保留了交互细节，如 `user Id`、`channel
    Id`、`type of channel`、`channel capabilities`、`interaction time` 等。


    ![](img/Figure-6.23.jpg)


    **图 6.23:** 转记录


    保存的转记录可以通过 `File` 菜单 | `Open Transcript` 选项再次打开。


    ![](img/Figure-6.24.jpg)


    **图 6.24:** 保存的转记录


    它会显示整个对话过程以及日志。


    ![](img/Figure-6.25.jpg)


    **图 6.25:** 带有日志的对话


    ### 聊天文件 (Chat Files)

    聊天文件用于创建用户与机器人之间的对话模拟。当需要为不同的路径（对话）创建并测试对话，或者需要与非技术利益相关者进行讨论或评审时，这种方法尤为有用。一个聊天文件具有
    `.chat` 扩展名，格式如下：


    ```

    user=sankara bot=BasicBot user: Hi!

    bot: Hello there, I am the basic bot. How can I help you today?

    ```


    它基本上是一个包含两个部分的 markdown 文件：


    **Header (头部)** - 定义对话的参与者


    **Actual Conversation (实际对话)** - 用户与机器人之间的往返对话


    聊天文件是由名为“Chatdown”的工具创建的，它是开发和测试机器人的众多工具之一。`Chatdown` 可以将 `.chat` 文件转换为 .transcript
    文件，然后可以将这些文件加载到模拟器中运行以测试机器人的行为，以下是使用上述示例 `.chat` 文件的简单快速测试。


    使用 `npm` 安装 Chatdown 并转换 `basic.chat` 文件。


    ![](img/Figure-6.26.jpg)


    **图 6.26:** 安装 Chatdown


    `.transcript` 文件随后可以加载到模拟器中运行以测试机器人的行为，以下是使用上述示例 `.chat` 文件的简单快速测试。


    使用 `npm` 安装 Chatdown 并转换 `basic.chat` 文件。


    ![](img/Figure-6.27.jpg)


    **图 6.27:** 转换 `basic.chat` 文件


    ![](img/Figure-6.28.jpg)


    **图 6.28:** 直接加载聊天文件


    打开转记录会将将其加载到模拟器并自动运行聊天，显示如果用户实际上在对话将会如何进行。


    所有聊天文件和转记录文件都可以在 Resources（资源）部分下访问：


    *   **Logs (日志)**：模拟器右下区域显示的日志部分记录了所有事件和活动。请查看图 20 中的日志部分。

    *   **Inspector (检查器)**：使用对话窗口右侧的 Inspector 功能，可以检查原始 JSON。当你点击窗口中的消息气泡时，气泡将变为黄色并显示
    JSON 活动。JSON 信息包含了关键元数据，如 channelID、活动类型、对话 ID、消息、终端 URL 等。

    *   **Services (服务)**：模拟器提供了添加额外服务的选项。当机器人加载时，点击 Services 面板上的 (+) 按钮，即可看到 LUIS、QnA
    和 Dispatch 的选项。

    *   **Debugging (调试)**：模拟器的关键功能之一允许调试用户与机器人之间的交互。点击模拟器右下角日志部分中的任何事件/活动，Inspector
    窗口就会显示该特定交互的信息。这有助于解决这些问题。


    使用前面提到的转记录是记录对话并在之后用于调试的方法之一。


    # 为示例添加 LUIS


    在机器人的真实世界应用中，我们需要处理不同的实体集和大量的 QA。因此，我们可能需要结合使用多个 LUIS 模型和 QnA 知识库来涵盖所有业务需求并为用户创建完整的体验。为了提供这种体验，应该有逻辑将输入的用户问题路由到
    LUIS 的相应意图或 QnA 知识库中的正确知识库。这就是 Dispatch 模型的作用所在。


    Dispatch 工具评估用于分发到多个机器人模块（如 LUIS 模型、QnA 知识库等）的 LUIS 模型。该工具通过创建一个独立的 LUIS 应用来管理，从而将用户输入路由到正确的模型或
    QnA KB。


    '
