    \n# 语音\n\n语音服务用于检测和分析来自用户的语音内容。这些服务可以用于各种功能，例如文本转语音、语音转文本转录、识别说话者、为应用程序添加语音等，如下所示：\n\
    \n![](img/Figure-4.27.jpg)\n**图 4.27:** 语音服务\n\n* **语音转文本（Speech to Text）**：语音转文本有助于通过叫中心转录获取客户洞察，通过语音支持的助手改进体验，捕捉会议中的关键讨论等，并将对话翻译成文本。NLP（自然语言处理）也可用于使解释更加智能。\n\
    * **文本转语音（Text to Speech）**：文本转语音服务帮助将文本转换为自动调制的人类真人声音。这有助于创建可以进行对话的应用程序和服务。文本转语音支持\
    \ 119 种语言的 270 种神经语音。以下给出一些用例：\n\n  ![](img/Figure-4.28.jpg)\n  **图 4.28:** TextToSpeech\n\
    * **语音翻译（Speech Translation）**：该服务帮助在用户说话时实时将从一种语言翻译到另一种语言。它支持 30 多种语言。\n* **说话者识别（Speaker\
    \ Recognition）**：这仍然处于预览模式。它帮助识别特定人的发言，并根据学习识别说话者。\n* **语音助手（Voice Assistants）**：语音助手在助手和设备之间提供快速且可靠的交互。\n\
    \n以下是语音助手的一些用例：\n\n![](img/Figure-4.29.jpg)\n**图 4.29:** 语音助手\n\n语音助手的用例包括为应用程序创建语音助手、创建无接触的语音优先的体验以提高安全性并支持重返工作的场景、使用自定义关键词激活等。\n\
    \n# Bing 网页搜索\n\nBing 网页搜索 API 可用于构建连接的应用程序和服务，这些服务可以集成新闻搜索、网页搜索、图像搜索等搜索功能。我们可以构建集成图像、网页、位置、新闻且无广告的应用程序。这些\
    \ API 还可以帮助自动建议搜索词、按内容类型过滤结果、高亮、根据市场、地区或国家本地化搜索结果，并使用 Bing Statistics 分析搜索指标。\n\
    \n# 实验\n\n### 步骤 1：进入 Azure Portal。搜索 Bing Search。它将弹出以下窗口：\n\n![](img/Figure-4.30.jpg)\n\
    **图 4.30:** Azure Portal-Bing Search\n\n### 步骤 2：一旦资源部署完成，将出现如下所示的部署成功：\n\n![](img/Figure-4.31.jpg)\n\
    **图 4.31:** 部署窗口\n\n### 步骤 3：点击 `Go To Resource`（转到资源）按钮并添加搜索词，然后点击 `Search`（搜索）：\n\
    \n![](img/Figure-4.32.jpg)\n**图 4.32:** 添加搜索词\n\n### 步骤 4：搜索结果所示：\n\n![](img/Figure-4.33.jpg)\n\
    **图 4.33:** 搜索结果窗口\n\n### 步骤 5：对于程序化调用，我们可以获取密钥并在代码中使用。获取密钥所示：\n\n![](img/Figure-4.34.jpg)\n\
    **图 4.34:** 获取密钥\n\n现在来看 Docker 。\n\n# Azure Cognitive Services 容器\n\n除了云端版本的\
    \ API 外，Azure 还提供了 Docker 容器，让我们可以使用相同的功能。这些可以部署在本地或边缘侧。\n\n以下是一组容器。\n\n![](img/Figure-4.35.jpg)\n\
    **图 4.35:** 可用的 Docker 容器\n\n# 结论\n\n在本章中，我们查看了决策、语言、语音和网页搜索的基础。我们还学习了 Azure 应用和\
    \ Azure Functions。在下一章中，我们将学习应用服务。\n\n# 单选题\n\n# 问题\n\n1. **哪种服务用于通过决策分析数据并得出洞察？**\n\
    \   - Decision\n   - Analyze\n   - Detect\n   - Insights\n\n2. **哪种服务可以将新闻搜索、网页搜索、图像搜索等搜索功能集成到自定义应用程序中？**\n\
    \   - Decision\n   - Analyze\n   - Web Search\n   - Image Search\n\n3. **哪种服务可以识别人的并据此识别？**\n\
    \   - Speaker Recognition\n   - Speech To Text\n   - Text To Speech\n   - Voice\
    \ Assistant\n\n4. **哪种服务用于通过叫中心转录获取客户洞察，通过语音支持的助手改进体验，捕捉会议中的关键讨论等？**\n   - Speaker\
    \ Recognition\n   - Speech To Text\n   - Text To Speech\n   - Voice Assistant\n\
    \n5. **哪种服务用于为应用程序提供语音？**\n   - Speaker Recognition\n   - Speech To Text\n   -\
    \ Text To Speech\n   - Voice Assistant\n\n6. **哪种服务可以用于翻译 30 多种语言的音频？**\n   -\
    \ Speech Translation\n   - Speech to Language\n   - Voice Assistant\n   - Text\
    \ To Speech\n\n7. **哪种服务可以用于创建可以对话的应用程序和服务？**\n   - Speech Translation\n   - Speech\
    \ to Language\n   - Voice Assistant\n   - Speech To Text\n\n8. **哪种 Azure Content\
    \ Moderator 认知服务验证并标记文本、图像和视频内容中的冒犯性内容标签？**\n   - Azure Content Sanitizer\n  \
    \ - Analyze\n   - Web Search\n   - Azure Content Moderator\n\n9. **哪种 API 可用于提取表示输入文本中关键论点的字符串列表？**\n\
    \   - Decision\n   - Analyze\n   - Key Phrase Extraction\n   - Language Detection\n\
