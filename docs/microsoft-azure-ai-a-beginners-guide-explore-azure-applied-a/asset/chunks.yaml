    \n## CHAPTER 7\n\n## Infusing ML in Custom Applications Using ML.NET\n\nIn the\
    \ last few chapters, we have read about vision API and how we can leverage cognitive\
    \ services to infuse intelligence into applications. In this chapter we will learn\
    \ about `ML.NET` which is an easy to use `.NET` Machine Learning platform which\
    \ helps in infusing intelligence into applications. `ML.NET` is a cross-platform,\
    \ open source machine learning framework which helps in developing simple intelligent\
    \ `.NET` applications.\n\nThe framework is built on `.NET Core` and `.NET Standard`.\
    \ It supports multiple platforms which include Mac, Linux and Windows. The origin\
    \ of `ML.NET` is from `text mining search and navigation` (`TMSN`) which was used\
    \ internally in Microsoft products. The `Ml.NET` repository consists of `.NET`\
    \ APIs for consumption and training models. It helps in pre-processing, feature\
    \ engineering, modeling, evaluation, and invoking.\n\nWith `ML.NET`, we do not\
    \ need to learn a new programming language, like Python develop our own ML models.\
    \ The framework provides capabilities which help us to train build, train, and\
    \ deploy custom machine learning models locally without requiring any machine\
    \ learning experience. After reading this chapter we will learn basics of `ML.NET`\
    \ and how to leverage `ML.NET`.\n\n## Structure\n\nIn this chapter, the following\
    \ topics will be covered:\n\n* Introducing `ML.NET` – how to leverage `ML.NET`\
    \ to develop models\n* Lab - Developing a sample ML Model\n* Exposing the ML model\
    \ as a service and invoking the service from `.NET Core` client\n\n## Objective\n\
    \nAfter reading this chapter, we will understand how a machine learning model\
    \ can be developed using `ML.NET` and then exposed as an API or a web service.\
    \ We will also understand how it can be invoked from `.NET` code.\n\nIn this chapter,\
    \ we will understand the basics of `ML.NET`:\n\n* `ML.NET` – An introduction learn\
    \ how to leverage `ML.NET` to develop models\n* Lab -Developing a sample ML Model\n\
    * Exposing the ML model as a service and invoking the service from `.NET Core`\
    \ client\n* A thought experiment, which is a set of questions designed to aid\
    \ understanding of key concepts covered in this chapter\n\nAfter the chapter we\
    \ will get a fair idea of `ML.NET`, the different algorithms supported, developing\
    \ models and on exposing models as service.\n\n## Introducing ML.NET\n\n`ML.NET`\
    \ is a cross-platform, open source machine learning framework to easily add machine\
    \ learning to simple `.NET` applications. `ML.NET` was initially developed in\
    \ Microsoft Research. It is used in a number of Microsoft products which includes\
    \ Windows, Bing etc. `ML.NET` helps perform complex Machine Learning tasks like\
    \ regression, classification etc. easily and invoke the same through `.NET` code.\n\
    \nFollowing figure captures the key components of `ML.NET` framework:\n\n![](images/Figure-7.1.jpg)\n\
    \n**Figure 7.1:** ML.NET Framework\n\nThe following is a brief overview:\n\n**Developer\
    \ Friendly APIs**: Training APIs: These APIs help in creating and building models.\
    \ Consumption APIs: These APIs help in making predictions\n\nData:\n\n* **IDataView**:\
    \ `IDataView` is the data pipeline machinery. It consists of a set of interfaces\
    \ and classes which help in transformation of data. It helps in handling high\
    \ dimensional data and large data sets. `IDataView` related components include\
    \ loaders, transforms, savers, trainers, predictors, etc. We can load datasets\
    \ into an `IDataView` from any data source. We can use File Loaders for typical\
    \ sources which include text, binary, and image files, and we can use the Database\
    \ Loader to load and train data directly from relational databases like Oracle,\
    \ SQL Server, and so on.\n"
  trans: "\n公司已开始将数字化融入到其运营中，利用数字工具进行增长变得比以往任何时候都更容易，并为优化运营提供了巨大的机会。从可以更具预测性和主动性维护资产的物理工厂，到更具活性和个性化的业务流程，同时也影响了它们的创新过程。\n\
    \n这正是 `Automation Bots` 观察用户行为，并结合来自各种数据源的信息来自动化任务，为企业及其客户提供见解的地方。\n\n## 重新想象企业模型\n\
    \n企业已开始使用数字技术来完全重新构业务模型。有些企业的目标是利用丰富的数据交付新的数字产品，而另一些企业则通过重新定义的数字体验来补充物理体验。这种势头驱动企业重新制定战略思维，转向`digital\
    \ services`，而不仅仅关注于`building products`。\n\n封装在电子设备中的`Digital Assistants` 提供了针对个人的个性化和定制化体验，而不是标准的通用解决方案。\n\
    \n多个不同的企业垂直领域全范围内使用机器人，例如：\n\n电信、汽车、医疗、教育、保险、政府、金融。沃丰的 `Tobi` 就是一个很好的近期例子，展示了如何通过对话界面重新定义客户互动。\n\
    \n## 利用自然语言处理\n\n对话聊天机器人的目的是协助组织处理客户往来、回答问题和接订单。为了有效地执行这些任务，它们必须具有洞察力。归结底，它们必须精通`Natural\
    \ Language Processing` (`NLP`)。尽管如此，重点在于，构建自己的 `NLP` 非常乏味。幸运的是，你通常不需要在没有任何外部帮助的情况下开始。自然语言处理引擎在最近比以往任何时候都要好。结合深度学习和神经网络，它们现在使我们能够构建高度互动且类人的界面。\n\
    \n## 结论\n\n我们向你介绍了 Bot 框架以及如何使用微软提供的 SDK 和工具在 Azure 上轻松地开发、调试和部署机器人的基本结构。这应该帮助你上手该框架，并让你探索更高级的场景，例如使用对话、集成不同的通道、连接到各种其他认知智能\
    \ API，以为客户和企业构建创新解决方案。在下一章节中，我们将学习 `ML.NET`。我们还将了解如何从 `.NET` 代码调用它。\n\n至此，我们将在后续附录章节查看一些行业场景以及\
    \ AI 如何集成的。\n\n## 思考实验\n\n1. **你如何测试和调试你的机器人？**\n\n   * 使用 `Visual Studio` 并使用\
    \ `Visual Studio` IDE 内置的 `Emulator`\n   * 使用 `VS Code` 并使用 `VS Code` 内的 `Debug`\
    \ 选项\n   * 在任何 IDE 外使用 `Bot Emulator` 测试和调试机器人\n   * 发布到 Azure 并调试\n\n2. **你可以在本地机器上运行机器人吗？**\n\
    \n   * 它们必须发布到 Azure 才能工作，它们在本地无法工作\n   * 可以配合 `Bot Emulator` 在本地使用\n\n3. **Bot\
    \ 框架和模拟器提供哪些调试选项？**\n\n   * 使用模拟器的本地调试\n   * 使用模拟器的远程调试\n   * 两者都有\n\n4. **机器人可以使用哪些认知技能？**\n\
    \n   * `LUIS`\n   * `QnA Maker`\n   * `Azure Search`\n   * `Speech Service`\n\
    \   * `Vision`/`Custom Vision Service`\n   * `Bing Search`\n   * `Bing Spell Check`\n\
    \   * 以上所有\n\n## 第 7 章\n\n## 使用 ML.NET 在自定义应用程序中注入 ML\n\n在过去的章节中，我们学习了视觉 API 以及我们如何利用认知服务将智能注入应用程序。在本章中，我们将学习\
    \ `ML.NET`，它是一个易用的 `.NET` 机器学习平台，有助于向应用程序中注入智能。`ML.NET` 是一个跨平台的、开源的机器学习框架，有助于开发简单的智能\
    \ `.NET` 应用程序。\n\n该框架构建在 `.NET Core` 和 `.NET Standard` 之上。它支持包括 Mac、Linux 和 Windows\
    \ 在多个平台。`ML.NET` 的起源于 `text mining search and navigation` (`TMSN`)，它曾在微软产品内部使用。`Ml.NET`\
    \ 仓库包含了用于消费和训练模型的 `.NET` API。它有助于进行预处理、特征工程、建模、评估和调用。\n\n通过 `ML.NET`，我们不需要学习像\
    \ Python 这样的新编程语言来开发自己的 ML 模型。该框架提供的功能可以帮助我们在本地训练、构建、训练和部署自定义的机器学习模型，而不需要任何机器学习经验。读完本章后，我们将学习\
    \ `ML.NET` 的基础知识以及如何利用 `ML.NET`。\n\n## 结构\n\n在本章中，将涵盖以下主题：\n\n* 介绍 `ML.NET` –\
    \ 如何利用 `ML.NET` 开发模型\n* 实验 - 开发示例 ML 模型\n* 将 ML 模型暴露为服务并从 .NET Core 客户端调用该服务\n\
    \n## 目标\n\n读完本章后，我们将理解如何使用 `ML.NET` 开发机器学习模型，然后将其暴露为 API 或网络服务。我们还将理解如何从 `.NET`\
    \ 代码调用它。\n\n在本章中，我们将理解 `ML.NET` 的基础知识：\n\n* `ML.NET` – 介绍，学习如何利用 `ML.NET` 开发模型\n\
    * 实验 - 开发示例 ML 模型\n* 将 ML 模型暴露为服务并从 .NET Core 客户端调用该服务\n* 一个思考实验，这是一组旨在帮助理解本章涵盖的关键概念的问题\n\
    \n在本章结束之后，我们将对 `ML.NET` 有一个相当的了解，包括支持的各种算法、模型开发以及将模型暴露为服务。\n\n## 介绍 ML.NET\n\n\
    `ML.NET` 是一个跨平台的、开源机器学习框架，可轻松地为简单的 `.NET` 应用程序添加机器学习。`ML.NET` 最初在微软研究院部开发。它被用于许多微软产品，包括\
    \ Windows、Bing 等。`ML.NET` 有助于轻松执行回归、分类等复杂的机器学习任务，并通过 `.NET` 代码调用它们。\n\n下面的图捕捉了\
    \ `ML.NET` 框架的关键组件：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:** ML.NET 框架\n\n以下是简单概述：\n\
    \n**开发者友好 API**: 训练 API：这些 API 有助于创建和构建模型。消费 API：这些 API 有助于预测\n\n数据：\n\n* **IDataView**:\
    \ `IDataView` 是数据管道机制。它由一组接口和类组成，有助于数据的转换。它有助于处理高维数据和数据集。`IDataView` 相关组件包括加载器、转换器、保存器、训练器、预测器等。我们可以从任何数据源将数据集加载到\
    \ `IDataView`。我们可以使用文件加载器处理典型源（包括文本、二进制和图像文件），可以使用数据库加载器直接从 Oracle、SQL Server\
    \ 等关系型数据库中加载和训练数据。\n"
