    \n**Figure 5.6:** Configure Service Resource\n\nFollowing is a sample invoice\
    \ document:\n\n![](images/Figure-5.7.jpg)\n\n**Figure 5.7:** Sample invoice\n\n\
    Following is the sample output displayed:\n\n![](images/Figure-5.8.jpg)\n\n**Figure\
    \ 5.8:** Output Generated\n\n# Azure Cognitive Search\n\nAzure Cognitive Search\
    \ is a search service in the cloud that gives a rich search experience. It can\
    \ pull data from multiple sources into web, mobile and other applications. It\
    \ can search data using AI and natural language processing. It has the capability\
    \ for data enrichment and encryption. Features include autocomplete, filters,\
    \ paging, facets and boosting. It helps in easy implementation of faceted navigation,\
    \ autocomplete, relevance tuning, filters.\n\nIt can help in searching Azure Blob\
    \ Storage, Cosmos DB.\n\nAzure Cognitive Search supports Microsoft’s natural language\
    \ processors and Lucene analyzers and de. We can configure analyzers to achieve\
    \ specialized processing of raw content, such as filtering out diacritics, or\
    \ recognizing and preserving patterns in strings.\n\nFollowing is the architecture\
    \ of Azure Cognitive Search:\n\n![](images/Figure-5.9.jpg)\n\n**Figure 5.9:**\
    \ Azure Cognitive Search\n\nA search service helps in indexing and searching unindexed\
    \ data when the client app sends query requests and sends the response.\n\nComponents\
    \ provided by Search Service include:\n\n*   **Data Sources/Content supported**:\
    \ The data sources supported include SQL Server on Azure VM, Azure SQL Database,\
    \ Cosmos DB, Managed Instance, Azure Table Storage, Azure blob storage container,\
    \ Azure Data Lake Storage Gen2, or SharePoint Online (preview), or any dataset\
    \ that contains JSON documents.\n*   **Index**: Azure Cognitive Search creates\
    \ the index on the specified data. The `Indexer` runs at scheduled intervals.\n\
    *   **Querying**: Client applications can send and receive a response from the\
    \ search service Once the index is populated with search text.\n\nThe search service\
    \ includes synonym matching, auto-complete, filter, fuzzy matching, auto spell\
    \ correction, sort, or pattern matching, identification of visual features, such\
    \ as facial detection, `Optical Character Recognition` (`OCR`), and image recognition\
    \ and image interpretation.\n\nWe can create a basic search service using either\
    \ of the two approaches:\n\n## Approach 1\n\n*   Decide on a tier. For advanced\
    \ capabilities, we will need a billable tier else we can go with a free tier.\n\
    *   In the Azure portal create a search service.\n*   Import data using `Import\
    \ data wizard`. Give data source details as input and create, load, and query\
    \ an index.\n*   Use `Search Explorer portal client` to query the created search\
    \ index.\n\n## Approach 2\n\n*   Create a search index using the `NET SDK`, `REST\
    \ API`, `.portal`, or another SDK. The index schema defines the structure of searchable\
    \ content.\n*   Upload content using the “push” model to push JSON documents from\
    \ any source, or use the “pull” model (`indexers`) if your source data is of a\
    \ supported type.\n*   Use `Search Explorer portal client` to query an index or\
    \ use `REST API`, `.NET SDK`, or another SDK to query an index.\n\n# Lab: Creating\
    \ a Azure Cognitive Search Service\n\nIn this sample, we will leverage Approach\
    \ 1 where we will create a search service using the portal, import data from a\
    \ sample database, create an index and use `Search Explorer` to query the index.\n\
    \n**Prerequisites:**\n\nAn Azure account with an active subscription.\n\nFollowing\
    \ are the steps to be followed for the lab in detail:\n\n### Step 1 - Create a\
    \ Search Service\n\nSign in to the Azure portal with your Azure account.\n\n![](images/Figure-5.10.jpg)\n\
    \n**Figure 5.10:** Creating Search Service\n\n### Step 2 - Start the Import data\
    \ wizard\n\nIn this lab, we are choosing a sample data. \n\n![](images/Figure-5.11.jpg)\n\
    \n**Figure 5.11:** Data Sources\n\n### Step 3 - Select Sample Data\n\nChoose sample\
    \ database as shown:\n\n![](images/Figure-5.12.jpg)\n\n**Figure 5.12:** Select\
    \ Sample Data\n\n### Step 4 - Creating Index\n\nIndex has to be created before\
    \ loading.\n\n![](images/Figure-5.13.jpg)\n\n**Figure 5.13:** Add Index\n\n###\
    \ Step 5 - Index attributes\n\nIndex attributes aid in controlling how the field\
    \ is used.\n\n![](images/Figure-5.14.jpg)\n\n**Figure 5.14:** Index attributes\n\
    \n*   `Searchable` determines that a field is included in full text.\n*   `Filterable`,\
    \ `Facetable`, and `Sortable` determine if fields are used in filter, faceted\
    \ navigation or sort.\n*   `Key` is a unique document identifier.\n*   `Retrievable`\
    \ makes the search result return the field.\n\n### Step 6 - Cognitive skills\n\
    \nWe can add cognitive skills to the Search Service as shown:\n\n![](images/Figure-5.15.jpg)\n\
    \n**Figure 5.15:** Cognitive Skills\n\n### Step 7 - Add Enrichments\n\nA `skillset`\
    \ can be attached to an indexer which does the AI processing. The indexer extracts\
    \ the content and creates new information out of content like images, blobs, and\
    \ raw text. Output is a search index.\n\n![](images/Figure-5.16.jpg)\n\n**Figure\
    \ 5.16:** Skillset\n\n### Step 8 - Attach Cognitive Skills\n\nSome of the cognitive\
    \ skills provided by the Cognitive search are described below:\n\n![](images/Figure-5.17.jpg)\n\
    \n**Figure 5.17:** Cognitive Skills\n\n*   `Custom Entity`: Helps in looking for\
    \ a user-defined set of words and phrases.\n*   `Key Phrases`: Helps in extracting\
    \ data like important phrases using a pre-trained model. It is useful to retrieve\
    \ the main points in a record.\n*   `Language Detection`: Helps in detecting language\
    \ in each document.\n*   `Merge`: Helps in combining text from multiple fields\
    \ to a single field. A common use case is to extract a caption from the OCR skill\
    \ and then merge it with the content field of a document.\n*   `Entity Recognition`:\
    \ Helps in identifying location, people, emails, organization, etc.\n*   `PII\
    \ Detection`: Helps in extracting personally identifiable information from a given\
    \ text.\n*   `Sentiment Analysis`: Helps in retrieving score based on positive\
    \ or negative or neutral sentiment.\n*   `Text Split`: Helps in enriching content\
    \ by splitting the text into sentences.\n*   `Translate`: Helps in translating\
    \ a text into a variety of languages.\n*   `Image Analysis`: Helps in Identifying\
    \ content of image and generating text description, generating tags and identifying\
    \ landmarks or celebrities.\n*   `OCR`: Helps search faxes, images and scanned\
    \ documents.\n*   `Conditional`: Allows merging, filtering, or assigning a default\
    \ value based on a condition, or setting a default value for a value that does\
    \ not exist.\n"
  trans: "\n\n*   `Pre Built-businessCard`: 帮助从名片中提取文本和关键信息。\n*   `Prebuilt-idDocument`:\
    \ 帮助从执照和国际护照中提取文本和关键信息。\n*   `Prebuilt-receipt`: 帮助从收据中提取文本和关键信息。\n*   `Custom\
    \ Models` \n    除了支持预构建模型外，我们还可以使用样本输入表单训练自定义模型。训练所需的最小表单数量为 5 个。模型使用无监督学习来识别表单中的字段、表格、条目和之间的关系。\n\
    \n# 访问 Form Recognizer\n\n可以通过 REST API 访问 Form Recognizer。Form Recognizer 目前正处于受限访问预览阶段。\n\
    \n在这个简短的实验中，我们将看到如何使用 Form Recognizer studio 来分析示例发票。\n\n我们将在实验中使用 `Layout API`。`Layout\
    \ API` 用于分析并提取来自表单和文档的文本、表格、标题、选择标记和结构信息。\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6:**\
    \ 配置服务资源\n\n以下是一个示例发票文档：\n\n![](img/Figure-5.7.jpg)\n\n**图 5.7:** 示例发票\n\n以下是显示的示例输出：\n\
    \n![](img/Figure-5.8.jpg)\n\n**图 5.8:** 生成的输出\n\n# Azure Cognitive Search\n\n\
    Azure Cognitive Search 是一种云端搜索服务，提供丰富的搜索体验。它可以将数据从多个源拉到网页、移动和其他应用程序中。它可以使用 AI\
    \ 和自然语言处理搜索数据。它具有数据增强和加密的能力。功能包括自动完成、筛选、分页、分面（facets）和增强（boosting）。它可以帮助实现分面导航、自动完成、相关性调整和筛选。\n\
    \n它可以帮助搜索 Azure Blob Storage 和 Cosmos DB。\n\nAzure Cognitive Search 支持微软的自然语言处理器以及\
    \ Lucene 分析器和分词。我们可以配置分析器对原始内容进行特殊处理，例如过滤掉变音或识别并保留字符串中的模式。\n\n以下是 Azure Cognitive\
    \ Search 的架构：\n\n![](img/Figure-5.9.jpg)\n\n**图 5.9:** Azure Cognitive Search\n\
    \n搜索服务在客户端应用发送查询请求并发送响应时，帮助对索引数据进行索引和搜索。\n\n搜索服务提供的组件包括：\n\n*   **支持的数据源/内容**：支持的数据源包括\
    \ Azure VM 上的 SQL Server、Azure SQL Database、Cosmos DB、托管实例、Azure Table Storage、Azure\
    \ blob 存储容器、Azure Data Lake Storage Gen2 或 SharePoint Online（预览版），或包含 JSON 文档的任何数据集。\n\
    *   **索引 (Index)**：Azure Cognitive Search 在指定的数据上创建索引。`Indexer` 按计划间隔运行。\n*  \
    \ **查询 (Querying)**：一旦填充了搜索文本，客户端就可以发送并接收搜索服务的响应。\n\n搜索服务包括同义词匹配、自动完成、筛选、模糊匹配、自动拼写检查、排序或模式匹配、视觉特征识别（如人脸检测）、`Optical\
    \ Character Recognition` (`OCR`) 以及图像识别和图像解释。\n\n我们可以使用以下两种方法之一创建基础搜索服务：\n\n##\
    \ 方法 1\n\n*   决定一个层级。对于高级功能，我们需要一个计费层级，否则可以使用免费层级。\n*   在 Azure 门户中创建搜索服务。\n*\
    \   使用 `Import data wizard` 导入数据。提供数据源详细信息作为输入，并创建、加载和查询索引。\n*   使用 `Search Explorer\
    \ portal client` 查询已创建的索引。\n\n## 方法 2\n\n*   使用 `NET SDK`、`REST API`、`.portal`\
    \ 或其他 SDK 创建搜索索引。索引架构定义了可搜索内容的结构。\n*   使用“推”模型从任何源推送 JSON 文档，或者如果你的源数据是支持的类型，则使用“拉”模型（`indexers`）。\n\
    *   使用 `Search Explorer portal client` 查询索引，或使用 `REST API`、`.NET SDK` 或其他 SDK\
    \ 查询索引。\n\n# 实验：创建 Azure Cognitive Search 服务\n\n在示例中，我们将利用方法 1，即通过门户创建搜索服务，从示例数据库导入数据，创建索引并使用\
    \ `Search Explorer` 查询索引。\n\n**前提条件：**\n\n一个具有活动订阅的 Azure 账户。\n\n以下是实验需要遵循的详细步骤：\n\
    \n### 步骤 1 - 创建搜索服务\n\n使用您的 Azure 账户登录 Azure 门户。\n\n![](img/Figure-5.10.jpg)\n\
    \n**图 5.10:** 创建搜索服务\n\n### 步骤 2 - 启动导入数据向导\n\n在实验中，我们选择了一个示例数据。\n\n![](img/Figure-5.11.jpg)\n\
    \n**图 5.11:** 数据源\n\n### 步骤 3 - 选择示例数据\n\n如所示选择示例数据库：\n\n![](img/Figure-5.12.jpg)\n\
    \n**图 5.12:** 选择示例数据\n\n### 步骤 4 - 创建索引\n\n必须在加载之前创建索引。\n\n![](img/Figure-5.13.jpg)\n\
    \n**图 5.13:** 添加索引\n\n### 步骤 5 - 索引属性\n\n索引属性有助于控制字段的使用。\n\n![](img/Figure-5.14.jpg)\n\
    \n**图 5.14:** 索引属性\n\n*   `Searchable`（可搜索）决定字段是否包含在全文中。\n*   `Filterable`（可筛选）、`Facetable`（可分面）和\
    \ `Sortable`（可排序）决定字段是否用于筛选、分面导航或排序。\n*   `Key` 是文档的唯一标识符。\n*   `Retrievable`（可检索）使搜索结果返回该字段。\n\
    \n### 步骤 6 - 认知技能\n\n我们可以如所示向搜索服务添加认知技能：\n\n![](img/Figure-5.15.jpg)\n\n**图 5.15:**\
    \ 认知技能\n\n### 步骤 7 - 添加增强\n\n`skillset`（技能集）可以附加到索引器上，索引器执行 AI 处理。索引器提取内容并根据图像、blob\
    \ 和原始文本等内容创建新信息。输出是一个搜索索引。\n\n![](img/Figure-5.16.jpg)\n\n**图 5.16:** 技能集\n\n\
    ### 步骤 8 - 附加认知技能\n\n下方描述了认知搜索提供的一些认知技能：\n\n![](img/Figure-5.17.jpg)\n\n**图 5.17:**\
    \ 认知技能\n\n*   `Custom Entity`（自定义实体）：帮助查找定义的单词和短语。\n*   `Key Phrases`（关键短语）：帮助使用预训练模型提取此类数据。对于检索记录中的要点有用。\n\
    *   `Language Detection`（语言检测）：帮助检测每个文档的语言。\n*   `Merge`（合并）：帮助将多个字段的文本合并到一个字段中。一个常见用例是从\
    \ OCR 技能提取说明，然后将其与文档的内容字段合并。\n*   `Entity Recognition`（实体识别）：帮助识别位置、人物、电子邮件、组织等。\n\
    *   `PII Detection`（个人身份信息检测）：帮助从给定文本中提取个人身份信息。\n*   `Sentiment Analysis`（情感分析）：帮助根据积极、消极或中性情感检索评分。\n\
    *   `Text Split`（文本分割）：通过将文本拆分为句子来增强内容。\n*   `Translate`（翻译）：帮助将文本翻译成多种语言。\n*\
    \   `Image Analysis`（图像分析）：帮助识别图像内容并生成文本描述、标签以及识别地标或名人。\n*   `OCR`：帮助搜索传真、图像和扫描文档。\n\
    *   `Conditional`：允许根据条件合并、筛选或分配默认值，或者为不存在的值设置默认值。\n\n"
