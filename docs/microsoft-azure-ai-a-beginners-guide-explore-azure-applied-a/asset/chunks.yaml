- raw: "`// Delete the conversationState for the current conversation to prevent the`\n\
    \n`// bot from getting stuck in a error-loop caused by being in a bad state.`\n\
    \n`// ConversationState should be thought of as similar to “cookie-state” in a\
    \ Web pages.`\n\n`await` conversationState.DeleteAsync(turnContext);\n\n`}`\n\n\
    `catch` (Exception e)\n\n`{`\n\n`logger.LogError(e, ``$”Exception caught on attempting\
    \ to Delete ConversationState : `{e.Message}`”`);\n\n`}`\n\n`}`\n\n`// Send a\
    \ trace activity, which will be displayed in the Bot Framework Emulator`\n\n`await`\
    \ turnContext.TraceActivityAsync(`“OnTurnError Trace”`, exception.Message, `“https://www.botframework.com/schemas/error”`,\
    \ `“TurnError”`);\n\n`};`\n\n`}`\n\n`}`\n\n# [Build and Test it using Emulator](#toc.xhtml#s96a)\n\
    \nBuild the code using Visual Studio and run it. By default the bot is hosted\
    \ on localhost on port 3978 and visual studio opens up a browser with the default\
    \ bot home page with some instructions on how to connect to the bot.\n\nLet us\
    \ check how the bot in the emulator. Start the emulator and connect to the running\
    \ bot by connecting to its endpoint url – `http://localhost:3978/api/messages`.\n\
    \nYou should see a welcome message that says “*Welcome to Restaurant bot User.\
    \ You can search and reserve a seat at McDonalds*”. And when you go ahead and\
    \ ask a question “*do you serve frozen burgers*?” or even just send a phrase such\
    \ as “*frozen burgers*”, the bot rightly answers the question. However, when you\
    \ ask a common questions such as “*where to find McDonalds?*” or ask “*Do i have\
    \ a table reserved at McDonalds this evening?*” the code is written in a way to\
    \ respond back with the intent determined by the dispatcher bot. Bot responds\
    \ with the “`RestaurantReservatoin.FindReservationEntry`” as the intent. When\
    \ you follow-up by “*can you confirm a reservation for me tonight?*”, the bot\
    \ rightly picks up the “`RestaurantReservation.Confirm`” entity denoting that\
    \ the question’s intent was to confirm the restaurant. The bot code is basic and\
    \ right now only written to display the chosen intent and the related intents\
    \ to user.\n\n![](images/Figure-6.34.jpg)\n\n**Figure 6.34:** Build the code and\
    \ Test it in Emulator\n\n# [Adding the Oliver Garden FAQ as an exercise](#toc.xhtml#s97a)\n\
    \nNow as an exercise, you could take the other QnA KB you created – the Olive\
    \ Garden FAQ and incorporate it into this project and in the orchestrator and\
    \ try and test the same.\n\nA similar command to the one below can be used to\
    \ add Olive Garden FAQ\n\n*   bf orchestrator:add -t qna --id <kb-id-of-olivegardebfaq-qna>\
    \ -k <qna-subscription-key-of-olivegardenfaq-bot> --routingName q\\_olivegardenfaq\n\
    \n# [Enhancing it further](#toc.xhtml#s98a)\n\nThis sample doesn’t show any dialogs,\
    \ but you could enhance the conversation by using dialogs as response to the intents\
    \ and accordingly have multiple sub dialogs as well based on the now the conversation\
    \ goes.\n\n# [Building the Bot Framework Composer](#toc.xhtml#s99a)\n\nComposer\
    \ provides a visual interface represented by dialogs to build bots. One would\
    \ choose composer over Bot Framework, if they intend to write less code and use\
    \ built-in building blocks. The current version of Composer is 2 and fairly mature.\n\
    \nWe will not go through the experience of creating a new bot via the Composer\
    \ since the end product is a Bot which is similar to the one you would create\
    \ using the Bot Framework SDK. I would like to just show the visual interface\
    \ and how it looks like for a bot that is built and complete.\n\nThe home page\
    \ of the composer is quite like a dashboard that shows recently created bots via\
    \ composer and resources for learning.\n\n![](images/Figure-6.35.jpg)\n\n**Figure\
    \ 6.35:** Bot Framework Composer \n\n**Note: You need Azure Functions Core Tools\
    \ to be installed, you would be prompted to install it before you can proceed\
    \ if it’s not already installed.**\n\nYou can follow this Microsoft tutorial to\
    \ use Bot Composer and create a weather bot - Tutorial: Create a weather bot with\
    \ Bot Framework Composer | Microsoft Docs\n\n# [Enterprise Scenarios](#toc.xhtml#s100a)\n\
    \nIn one of the Microsoft’s Build developer conferences, Microsoft’s CEO Satya\
    \ Nadella shared his vision of the future that involved chatbots, machine learning,\
    \ and artificial intelligence and he also talked about how “*bots are the new\
    \ apps*” that advance the human machine interaction.\n\nThe rapid pace of change\
    \ in today’s “*transformative*” world makes it important for enterprises to learn\
    \ quickly, and continuously iterate in an agile way. Bots getting into enterprise\
