  trans: "\nModel Builder 帮助开发者通过图形化的用户友好界面构建模型，而无需具备大量的机器学习专业知识。Model Builder 支持多种场景，如情感分类、欺诈交易检测、问题分类等。\n\
    \n## 模板 (Templates)\n\nModel Builder 自带模板，这些模板可以作为常见场景的起点，例如情感分析、问题分类、价格预测和自定义场景。\n\
    \n![](img/Figure-7.21.jpg)\n\n**图 7.21:** Model Builder 模板\n\n## 数据 (Data)\n\n\
    一旦选择了模板，我们需要输入模型将使用的数据集以及需要预测的输出。\n\n数据集具有特征或属性作为列，样本数据作为行。例如，自行车价格估算器将具有 `model`、`make`、制造年份\
    \ `year` 等作为特征，并将 `price` 作为标签。Model Builder 对数据有以下限制：\n\n* 数据可以从文件（带有标题行的 `csv`\
    \ 或 `.tsv`）中读取\n* 数据可以从 SQL Server 数据库读取——限制为 100000 行\n* 在训练之前将数据从 SQL Server\
    \ 复制到本地机器\n\n## 训练 (Train)\n\n一旦加载了数据集，就需要对其进行训练。训练的确切时间取决于：\n\n* 列的类型 - 是数值型还是文本\n\
    * 任务类型 -\n* 回归等\n* 用于训练的行数\n* 特征列的数量\n\n评估 (Evaluate) 衡量使用新数据对已训练模型进行预测的优劣。Model\
    \ Builder 将训练数据分为训练集（80%）和测试集（20%）。\n\n如果你的模型性能评分不如预期，我们需要进行长时间的训练，或者添加更多数据或平衡数据。例如，如果某些标签没有被有效使用，不平衡的数据将使模型难以进行预测。\n\
    \n**模型文件 (Model File)**：在评估阶段之后，将输出可以作为模型文件添加的代码，该代码可以添加到应用程序中。\n\n## 实验 4 - 使用\
    \ ML.NET Model Builder 创建用于情感分析的示例\n\n在实验中，我们将创建一个示例应用程序，该程序将接收输入并使用 ML.NET Model\
    \ Builder 执行情感分析并返回结果。\n\n**第 1 步**：前往 `[`aka.ms/mlnettemplates`](http://aka.ms/mlnettemplates)`\
    \ 获取 Visual Studio 并下载 ML.NET Model Builder 扩展程序。\n\n**第 2 步**：创建一个 .NET Core\
    \ 控制台项目。打开 Visual Studio。从菜单栏选择 `File` | `New` | `Project`。在新项目对话框中，选择 Visual\
    \ C# 节点，紧接着选择 .NET Core 节点。然后选择 `Console App (.NET Core)` 项目模板。\n\n![](img/Figure-7.22.jpg)\n\
    \n**图 7.22:** 创建项目\n\n**第 3 步**：右键点击 `Solution Explorer`。选择 `Add` |`Machine Learning`。\n\
    \n![](img/Figure-7.23.jpg)\n\n**图 7.23:** 添加包\n\n**第 4 步**：为此示例选择数据模型，我们从 UCI\
    \ `Sentiment Labeled Sentences` 数据集中下载了 `yelp`。我们可以从下面的链接下载：\n\n`[`archive.ics.uci.edu/ml/machine-learning-databases/00331/sentiment%20labelled%20sentences.zip`](https://archive.ics.uci.edu/ml/machine-learning-databases/00331/sentiment%20labelled%20sentences.zip)`。\n\
    \n![](img/Figure-7.24.jpg)\n\n**图 7.24:** 选择数据模型\n\n右键点击 `yelp_labelled.txt` 并另存为\
    \ `yelp_labelled.tsv`。\n\n选择模型类型：\n\n![](img/Figure-7.25.jpg)\n\n**图 7.25:** 选择模型类型\n\
    \n选择用于训练模型的数据集并选择要预测的列。\n\n![](img/Figure-7.26.jpg)\n\n**图 7.26:** 添加数据\n\n训练\
    \ (Train) 选择合适的训练时长。对于较大的数据集，我们需要设置更长的时间。如果时间太短，训练可能会失败。\n\n![](img/Figure-7.27.jpg)\n\
    \n**图 7.27:** 训练模型\n\n模型训练的进度显示如下：\n\n* **Status (状态)**：显示模型训练过程的状态。\n* **Accuracy\
    \ (准确率)**：最佳模型的准确率。\n* **Best algorithm (最佳算法)**：显示最佳算法。\n* **Last algorithm (最后算法)**：显示\
    \ Model Builder 探索的最后一种算法。\n\n**第 5 步**：评估模型\n\n![](img/Figure-7.28.jpg)\n\n**图\
    \ 7.28:** 评估模型\n\n**第 6 步**：训练好的模型已准备好使用。\n\n![](img/Figure-7.29.jpg)\n\n**图 7.29:**\
    \ 模型已就绪\n\n## 结论 (Conclusion)\n\n在本章中，我们学习了 ML.NET 基础知识、如何利用 ML.NET 开发模型并将自定义机器学习注入应用程序中、如何利用\
    \ Vision API 开发示例 ML 模型、将 ML 模型暴露为服务以及从 .NET Core 客户端调用该服务。\n\n在下一章中，我们将介绍 Accord.NET。\n\
    \n## 选择题\n\n本节由一组问题组成，旨在测试你对本章涵盖概念的理解。\n\n在回答这些问题时，想象有一个观众正在看电影。\n\n1. 我们可以将原始数据转换为\n\
    \    a. 分析器\n    b. 特征\n    c. 转换\n    d. 功能工程\n\n2. 哪些算法通过输入数据的线性组合来计算得分？\n \
    \   a. 线性\n    b. KNN\n    c. 多分类\n    d. 朴素\n\n3. 哪些算法用于发现输入数据中的分组，例如？\n    a.\
    \ 聚类\n    b. 回归\n    c. 多分类\n    d. 二分类\n\n4. 哪种类型的学习适用于输入数据部分已标记但大部分未标记的情况？\n\
    \    a. 监督学习\n    b. 无监督学习\n    c. 半监督学习\n    d. 以上都是\n\n5. 哪种类型的学习适用于根据特定条件预测连续值，如预测出租费\n\
    \    a. 聚类\n    b. 回归\n    c. 多分类\n    d. 二分类\n\n6. 什么框架能够处理大数据并设计为分布式，具有更快的训练速度、更低的内存占用以及更高的准确性和效率？\n\
    \    a. 线性\n    b. Lighted Machine\n    c. Fast Tree\n    d. 决策树\n\n7. 哪种技术用于将数据分为若干分区并在这些分区上训练多个算法以提高训练过程的稳健性？\n\
    \    a. 验证\n    b. 主成分分析\n    c. 交叉验证\n    d. 分区\n\n8. 使用带有标签的输入数据和将输入数据映射到输出数据的算法来学习模型的过程。\n\
    \    a. 监督学习\n    b. 无监督学习\n    c. 半监督学习\n    d. 以上都是\n\n9. 我们可以用什么来标准化不在同一尺度上的特征？\n\
    \    a. 验证\n    b. 一化\n    c. 交叉验证\n    d. 分区\n"
