    \n## 第 2 步：上传图像\n\n项目创建后，我们就可以通过界面上传图像并根据需要对其标记。至少 50 张图像将提供良好的预测准确率。\n\n在这里，我们上传了乒乓包并将图像分类为“粉色包”（Pink\
