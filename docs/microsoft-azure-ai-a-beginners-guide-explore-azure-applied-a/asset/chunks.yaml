    \ Face Grouping API**\n\n10.  **d. Spatial Analysis**\n\n# [CHAPTER 4](#toc.xhtml#c04)\n\
    \n# [Azure Cognitive Services](#toc.xhtml#c04)\n\nAfter reading this chapter,\
    \ the reader will understand how to use Decision, Language, Speech and Web Search\
    \ services of Azure Cognitive Services. The reader will learn about Anomaly detector,\
    \ Content Moderator, Personalizer, Text Analytics, Azure Functions and Azure Cognitive\
    \ Service Containers.\n\n# [Structure](#toc.xhtml#s41a)\n\nIn this chapter, the\
    \ topics covered are as follows:\n\n*   Decision service\n\n*   Content moderator:\
    \ Use case, Detailed APIs\n\n*   Personalizer\n\n*   Language service\n\n*   Azure\
    \ Logic Apps and Functions \n\n*   Speech service\n\n*   Web search service\n\n\
    # [Objective](#toc.xhtml#s42a)\n\nIn this chapter, we will explore the decision,\
    \ language, speech, and Web Search services of Azure Cognitive Services. By the\
    \ end of this chapter, the reader will understand how to effectively build applications\
    \ using each of the mentioned Azure Cognitive Services.\n\n# [Decision service](#toc.xhtml#s43a)\n\
    \nDecision service is used to make good decisions using Decision APIs by helping\
    \ in analyzing the data and deriving insights from the same.\n\nThe main services\
    \ available under this category are as follows:\n\n*   **Anomaly Detector**: Anomaly\
    \ detector helps in monitoring and detecting anomalies in the data and can be\
    \ used in the cloud or edge and can be easily customized. Anomaly detector takes\
    \ time-series data as input and uses anomaly detection algorithms to help detect\
    \ dips, spikes in the data. \n\n    Some sample use cases where Anomaly detection\
    \ API can be leveraged are provided as follows:\n\n![](images/Figure-4.1.jpg)\n\
    \n**Figure 4.1:** Anomaly Detection use cases\n\nWe will look at is a sample use\
    \ case flow for Anomaly Detection:\n\n![](images/Figure-4.2.jpg)\n\n**Figure 4.2:**\
    \ Anomaly Detection Sample Use case Flow\n\nTime Series data is ingested from\
    \ data sources which could include SQL DB, Azure DB. Anomaly Service picks the\
    \ data and detects anomalies. The Anomaly Detector API’s algorithms adapt by automatically\
    \ identifying and applying the best-fitting models to input data, The Anomaly\
    \ Detector determines the boundaries for anomaly detection as to which are the\
    \ expected values, and which are anomalies in the data points.\n\nDetailed flow\
    \ is as follows:\n\n*   Data is ingested from data sources like SQL DB, Event\
    \ Hubs etc.\n\n*   Databricks or any other compute resource is used to generate\
    \ the time series by aggregating and computing the raw data.\n\n*   Azure Function\
    \ picks the message from the message queue based on the anomaly-related metadata\
    \ and sends the alert about the anomaly.\n\n*   Data Lake stores the anomaly detection\
    \ metadata.\n\n*   Power BI is used to visualize the results.\n\n*   **Content\
    \ Moderator: **Content Moderator API helps in monitoring social media applications\
    \ for offensive content and identifies offensive content like posts or videos\
    \ and flags those.\n\n*   Few scenarios where it can be effectively used include\
    \ moderating content in social messaging platforms, organizations, schools etc.\n\
    \n*   The following figure shows the available APIs that help in moderation of\
    \ text, images, and videos. We can leverage the APIs to check objectionable content\
    \ in the text/images.\n\n![](images/Figure-4.3.jpg)\n\n**Figure 4.3:** Content\
    \ Moderator APIs\n\nWe will look at a sample use case for content moderator.\n\
    \n# [Content Moderator-Use case](#toc.xhtml#s44a)\n\nWhen a user uploads an image\
    \ the program checks if the image has objectionable content.\n\nTo check whether\
    \ an image contains objectionable content we will leverage Azure Container, Blob\
    \ storage, Image Moderation API and Perform the following steps:\n\nThe input\
    \ to be provided is an image that the user uploads.\n\nGiven below is the program\
    \ flow explained in detail:\n\n*   User uploads an image.\n\n*   The image is\
    \ stored in a blob.\n\n*   Azure function gets triggered when an image is added\
    \ to the blob.\n\n*   Image Moderation API is invoked to check if the image contains\
    \ racy content.\n\n*   Based on the value the image is stored in Validated Blob\
    \ or Objectionable Blob for further processing. \n\nWe can leverage Azure Container,\
    \ Blob storage, Image Moderation API as given as follows:\n\n![](images/Figure-4.4.jpg)\n\
    \n**Figure 4.4:** Workflow to be developed for the use case\n\n# [Content Moderator-Detailed\
    \ APIs](#toc.xhtml#s45a)\n\nAzure Content Moderator cognitive service verifies\
    \ and flags text, image, and video content for material that is offensive with\
    \ labels. The Content Moderator service includes Moderation APIs which help in\
    \ detecting and flagging offensive content.\n\nThe following are the details of\
    \ Custom Image lists and Review APIs: \n\n| **API group** || **Usage** |\n\n|\
    \ --- | --- |\n\n| **Text moderation** || Helps scan text for offensive content.\
    \ Text is classified into three categories – Category 1, 2, and 3 based on the\
    \ adult content present in the text. |\n\n| **Custom term lists** || Helps use\
    \ custom lists for flagging offensive content. |\n\n| **Image moderation** ||\
    \ Helps scan images and identify offensive content. |\n\n| **Custom image lists**\
    \ || Helps scan images against a custom list of images. Custom Image lists: Custom\
    \ image lists help prevent sharing of offensive images by creating a custom list\
    \ of offensive images. |\n\n| **Video moderation** || Helps scan videos for offensive\
    \ content. |\n\n**Table 4.1:** Content Moderator-detailed APIs\n\n# [Personalizer](#toc.xhtml#s46a)\n\
    \nThe Personalizer Service is used to create personalized recommendations for\
    \ users by learning from user-application interactions, based on their online\
    \ activities.\n\nContextual content is provided to users leveraging reinforcement\
    \ learning. It uses user behaviors and activities to surface the right content\
    \ to the users.\n\nIt uses reinforcement learning as given as follows:\n\n![](images/Figure-4.5.jpg)\n\
    \n**Figure 4.5:** Personalizer Service\n\nSome of the use cases for Personalizer\
    \ Service include highlighting content, providing menu suggestions, filling up\
    \ form lists for users, providing contextual decisions and filtering content as\
    \ shown as follows: \n\n![](images/Figure-4.6.jpg)\n\n**Figure 4.6:** Personalizer\
    \ Use Cases\n\n# [Language Service](#toc.xhtml#s47a)\n\nLanguage APIs help users\
    \ to analyze texts and recognize intents and entities from text.\n\nThere are\
    \ several services available under this category as given as follows:\n\n*   **Immersive\
    \ Reader**: Immersive Reader is a standalone web application provided by Microsoft\
    \ that enables processing the content for parts of speech, text to speech, translation,\
    \ and more. It implements proven techniques to improve reading comprehension for\
    \ new readers, language learners, and people with learning differences such as\
    \ dyslexia.\n\n*   **LUIS**: This service provides Natural Language Understanding\
    \ and Interpretation Services. LUIS is a cloud-based conversational AI service\
    \ that applies machine-learning intelligence to a user’s conversation to understand\
    \ the intent of the user, and pull out relevant, detailed information. Chatbots\
    \ can leverage LUIS to understand the intent and provide more contextual responses."
