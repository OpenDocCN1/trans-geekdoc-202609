    \ Detection`\n\n# [第 5 章：Azure 应用 AI 服务]\n\n读完本章后，读者将了解 Azure 应用 AI 服务的概述，这些包括\
    \ `Azure Form Recognizer`、`Azure Metrics Advisor`、`Azure Cognitive Search`、`Azure\
    \ Immersive Reader`、`Azure Video Analyzer for Media` 以及 `Azure Bot Service`。Azure\
    \ 应用 AI 服务帮助开发者轻松地应用 AI 来解决业务问题。它们构建在 `Azure Cognitive Services` 之上。它们优化了诸如 `anomaly\
    \ detection`、监控等任务。\n\n# [结构]\n\n本章将涵盖以下主题：\n\n* Azure 应用 AI 服务概述\n* `Azure Metrics\
    \ Advisor`\n* `Azure Immersive Reader`\n* `Azure Video Analyzer for Media`\n*\
    \ `Azure Form Recognizer`\n* `Azure Cognitive Search`\n\n# [目标]\n\n在本章结束时，读者将理解\
    \ Azure 应用 AI 服务以及如何有效利用这些服务。\n\n# [Azure 应用 AI 服务概述]\n\n以下是 Azure 应用 AI 服务的概述：\n\
    \n* **Azure Metrics Advisor**: 它帮助通过结合近实时监控和针对特定场景的适应模型来识别并修复问题，从而提供带有告警和诊断的细粒度分析。\
    \  它使用 AI 对时间序列数据进行数据监控和异常检测。该服务自动完成将模型应用到数据的过程，并提供了一组 `APIs` 和基于 Web 的工作空间，用于异常检测、数据接入和诊断。用户可以在该服务之上构建\
    \ `AIOps`、预测性维护和业务监控应用程序。\n\n* **Azure Immersive Reader**: 这是一个包容性设计的工具，实施了各种技术来提高语言学习者、新读者以及有学习障碍的人的阅读理解能力。\n\
    \n* **Azure Form Recognizer**: 它帮助从表单文档中识别和提取文本、键值对和表格数据。它帮助从表单中接入文本并输出包含原始文件中关系的结构化数据。\
    \  \n\n  * **Azure Video Analyzer for Media**: 它帮助从视频和音频文件中提取如语音、人脸等元数据。\n\n \
    \ * **Azure Cognitive Search**: 它利用内置的 AI 能力，帮助识别和探索相关内容。\n\n  * **Azure Bot Service**:\
    \ 它帮助开发对话式 AI 体验。\n\n我们将详细介绍每种服务。\n\n# [Azure Metrics Advisor]\n\nAzure Metrics\
