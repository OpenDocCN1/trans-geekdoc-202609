  trans: "\n\n```javascript\n// 删除当前对话的 conversationState，以防止机器人\n// 因为处于错误状态（bad\
    \ state）而陷入错误循环中。\n// conversationState 可以被类比为类似于 Web 页面中的“cookie 状态（cookie-state）”。\n\
    await conversationState.DeleteAsync(turnContext);\n\n}\ncatch (Exception e)\n\
    {\n    logger.LogError(e, `$\"Exception caught on attempting to Delete ConversationState\
    \ : `{e.Message}``);\n}\n}\n// 发送 trace 活动，该活动将显示在 Bot Framework Emulator 中\n\
    await turnContext.TraceActivityAsync(`OnTurnError Trace`, exception.Message, `https://www.botframework.com/schemas/error`,\
    \ `TurnError`);\n};\n}\n}\n```\n\n# 使用 Emulator 进行构建并测试\n\n使用 Visual Studio 编译代码并运行。默认情况下，机器人托管在\
    \ `localhost` 的 `3978` 端口上，Visual Studio 会打开浏览器并显示带有默认机器人人的主页，其中包含一些如何连接到机器人的说明。\n\
    \n让我们检查模拟器中的机器人运行情况。启动模拟器，并通过连接到其端点 URL —— `http://localhost:3978/api/messages`\
    \ 来连接到运行中的机器人。\n\n你应该能看到一条欢迎消息，显示“Welcome to Restaurant bot User. You can search\
    \ and reserve a seat at McDonalds”。当你继续提问“你们提供冷冻汉堡吗？”甚至发送“冷冻汉堡”之类的短语时，机器人会正确回答问题。然而，当你问一些常见问题，如“哪里找到麦当劳？”或询问“我今晚在麦当劳有预订吗？”时，代码的设计方式是根据分发器机器人（dispatcher\
    \ bot）确定的意图进行回复。机器人以 `RestaurantReservin.FindReservationEntry` 作为意图响应。当你跟随“你能帮我确认今晚的预订吗？”时，机器人正确识别了\
    \ `RestaurantReservation.Confirm` 实体，表示该问题的意图是确认餐厅。机器人代码非常基础，目前仅编写为向用户显示所选意图及相关的意图。\n\
    \n![](img/Figure-6.34.jpg)\n\n**图 6.34：** 构建代码并在 Emulator 中进行测试\n\n# 将 Olive Garden\
    \ FAQ 作为练习\n\n现在作为一项练习，你可以获取你创建的另一个 QnA KB —— 即 Olive Garden FAQ，将其整合到此项目以及编排器中，并尝试进行测试。\n\
    \n可以使用类似于下方的命令来添加 Olive Garden FAQ：\n\n* `bf orchestrator:add -t qna --id <kb-id-of-olivegardebfaq-qna>\
    \ -k <qna-subscription-key-of-olivegardenfaq-bot> --routingName q\\_olivegardenfaq`\n\
    \n# 进一步增强\n\n此示例没有显示任何对话（dialogs），但你可以使用对话作为意图的响应来增强对话，并根据当前对话的进展相应设置多个子对话。\n\n\
    # 构建 Bot Framework Composer\n\nComposer 提供了一个由对话（dialogs）表示的可视化界面来构建机器人。如果打算编写少代码并使用内置组件，就会选择\
    \ Composer 而不是 Bot Framework。Composer 的当前版本是 2，并且相当成熟。\n\n我们不会体验通过 Composer 创建新机器人的过程，因为最终产品是一个与使用\
    \ Bot Framework SDK 创建的机器人类似的机器人。我想展示一下可视化界面以及一个构建完成的机器人的样子。\n\nComposer 的主页非常像仪表盘，显示了最近通过\
    \ Composer 创建的机器人以及学习资源。\n\n![](img/Figure-6.35.jpg)\n\n**图 6.35：** Bot Framework\
    \ Composer\n\n**注意：你需要安装 Azure Functions Core Tools，如果尚未安装，在继续操作之前将提示你进行安装。**\n\
    \n你可以遵循此微软教程来使用 Bot Composer 并创建一个天气机器人 - [Tutorial: Create a weather bot with\
    \ Bot Framework Composer | Microsoft Docs]()\n\n# 企业级场景\n\n在微软的一次 Build 开发者会议上，微软首席执行官\
    \ Satya Nadella 分享他对未来的愿景，涉及聊天机器人、机器学习和人工智能，他还谈到了“机器人是新的应用”，推动了人机交互的进步。\n\n当今“变革性”世界变化之快，对于企业快速学习并以敏捷的方式持续迭代至关重要。机器人进入企业场景，通过内容的人性化和个性化，并在数字世界中赋予用户信息，缩小了任何企业软件与其用户之间的距离。\n\
    \n# 客户场景\n\n客户 John Doe 正准备进行一项重要的购买——他的梦想汽车，并联系他的银行获取财务状况。在与银行的典型交互中，这可能是故事的结束，但如果银行能超越事务性查询并成为财务顾问将会怎样？\n\
    \n有了机器人，John 可以从询问“我有多少钱？”开始。这触发了与 John 的对话流，帮助他完成查询。机器人理解意图并提供他正在寻找的帮助。它使用 `LUIS`\
    \ 来确定如何处理此查询。如果问题是“我现在的账户里有多少钱？”，它仍然可以检测账户并返回余额。\n\n然而，机器人还提供了他的支出摘要，嵌入在聊天窗口等富内容中，这允许对话进行，例如“显示我过去\
    \ 6 个月的最高支出”或“我今年在旅行上花了多少钱？”信用评分以及提醒信用卡还款，所有这些为 John 提供了更多洞察，帮助他做出买车决定。展望，如果 John\
    \ 决定买车，他需要保险。保险公司可以利用业务分析和人工智能从根本上改变客户服务的方式并减少客户流失。John 进入保险提供者的网站获取报价。机器人验证了他的信息并询问车辆详情（包括照片），同时机器人访问\
    \ `Dynamics CRM` 中 John 的用户信息，识别出客户信用良好，并决定继续处理他的申请。\n\n这表明机器人可以实现与客户互动模式，它们代表了赋予用户以自然和个性化方式与企业交互的机会。我们可以输入这些问题，甚至可以利用语音转文本来实现更自然的交互模式。下一个交互流将更加复杂。\n\
    \n# 典型用例\n\n数字业务转型的旅程可以从组织的任何地方开始，至少可以涵盖以下关键转型领域：\n\n# 重新解释客户交互\n\n一切从客户开始。企业正在不断、积极地探索能够为客户创造更多价值的机会。利用数字技术提供连接的产品和业务，通过个性化体验与客户互动，并在合适的时间提供推荐优惠和增值服务。\n\
    \n# 重新工程运营流程\n\n"
