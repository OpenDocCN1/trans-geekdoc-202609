    \n![](images/Figure-1.16.jpg)\n\n**Figure 1.16:** Face API\n\n`Face Detection`\
    \ helps discover attributes of a face such as gender, age, and so on.\n\n`Face\
    \ Recognition` supports the following subcategories of functionalities:\n\n* \
    \  `Face Verification`: This verifies if two faces match.\n*   `Finding Similar\
    \ Face`: This takes a face and tries to create an order based on the degree of\
    \ similitude in a set of faces.\n"
  trans: "\n计算机视觉提供了用于分析图像、从图像中提取文本以及审核内容的 API。Azure 计算机视觉（Azure Computer Vision）提供了帮助处理和分析照片、图像和视频的\
    \ API。这些 API 允许用户执行图像分类、从图像中提取情感、读取手写并转换为文本，或根据图像中的意图为图像添加描述。它有助于识别人脸并根据分类应用标签等。例如，计算机视觉可以帮助判断图像是否包含成人内容，找到图像中的所有人脸，并从视频中提取洞察。\n\
    \n![](img/Figure-1.11.jpg)\n\n**图 1.11:** Azure 计算机视觉\n\n以下是各个 API 的详细描述：\n\n\
    ### 文本提取\n帮助从图像中提取文本。它提供了光学字符识别，包括 `Read API` 和 `OCR API`。\n\n![](img/Figure-1.12.jpg)\n\
    \n**图 1.12:** 自定义服务的用例\n\n*   `Read API` 帮助从图像中提取文本，并针对文本密集的图像和包含大量文本内容的文档进行了优化。我们可以使用此\
    \ API 从名片、海报、收据、白板等提取信息。\n*   `OCR API` 同步执行，未针对大型文档进行优化。它利用了较旧的识别模型。`OCR` 支持约\
    \ 25 种语言。`OCR` 会自动检测识别文本的语言。它提供了纠正识别文本旋转的能力，并提供每个词的帧坐标。\n\n### 图像分析\n![](img/Figure-1.13.jpg)\n\
    \n**图 1.13:** 自定义服务的用例\n\n图像识别和分析可以从图像中提取各种视觉特征，如分类、图像类型。可以通过利用 `Analyze Image\
    \ API` 执行图像分析，该 API 提供的功能包括定位图像中的所有人脸、检查图像是否包含成人内容、描述图像、生成图像缩略图、识别并标记图像中的视觉特征、检测图像中的物体、检测图像中的商业品牌、识别并标记整幅图像、检测色调、检测特定领域的内容以及获取感兴趣的边界框坐标。\n\
    \n以下是 `Analyze Images API` 功能的简要概述：\n\n| 操作 | 描述 |\n| :--- | :--- |\n| 标记视觉特征\
    \ | 帮助利用大量预构建模型识别并标记图像中的视觉特征。 |\n| 检测物体 | 帮助返回每个标签的边界框坐标。我们可以利用此来处理给定图像中物体之间的关系。\
    \ |\n| 品牌检测 | 帮助检测图像中的商业品牌。这有助于检查品牌的流行程度。 |\n| 图像分类 | 帮助使用预构建类别对图像进行识别和分类。 |\n\
    | 描述图像 | 帮助根据图像中识别出的物体返回描述。对于每个识别出的物体还会返回一个置信度评分。 |\n| 检测人脸 | 帮助检测人脸并提供有关每个检测到的人脸的信息。我们可以使用这些信息实现数字\
    \ ID 或姿态检测等。 |\n| 检测图像类型 | 帮助识别给定的图像是线条画还是剪贴。 |\n| 检测特定领域内容 | 帮助使用名人等预构建模型识别特定领域的内容。\
    \ |\n| 检测色调 | 帮助识别图像是黑白的还是彩色的，并帮助识别彩色图像的强调色和主色调。 |\n| 生成缩略图 | 帮助识别并裁剪感兴趣区域并返回缩略图。它可以识别图像中的人脸等并进行裁剪。它提供质量质量的缩略图。它具有识别图像中人脸等并在周围进行裁剪的能力。\
    \ |\n| 获取感兴趣区域 | 帮助分析内容并返回感兴趣区域的坐标。 |\n| 内容审核 | 它帮助检测图像中的成人和攻击性内容并返回置信度评分。标记内容的阈值可以根据需要设置。`Content\
    \ Moderator APIs` 帮助视频、文本和图像的内容审核。`Content Moderator APIs` 有助于对攻击性内容进行标记。这些被标记的内容可以通过基于工作流的应用程序处理，删除删除攻击性内容，这可能还需要人工干预。\
    \ |\n\n**表 2.2:** 图像分析\n\n### 空间分析\n计算机视觉空间分析通过摄取摄像头的流视频帮助提取洞察并生成事件。它可以检测人的存在及其移动，并帮助计算进入空间的人数或测量佩戴口罩的合规性。\n\
    \n以下是空间分析的一些用例：\n\n![](img/Figure-1.14.jpg)\n\n**图 1.14:** 空间分析的用例\n\n### 自定义视觉服务\n\
    Custom Vision 提供自定义图像训练用于异常检测、带有自定义标签的物体等用例。通过 Custom Vision，我们可以构建并训练自定义的视觉模型。输入模型的图像越多，模型训练得越充分，预测就越准确。\n\
    \n以下是自定义视觉模型的训练方式：\n\n![](img/Figure-1.15.jpg)\n\n**图 1.15:** 自定义视觉模型\n\n一旦创建了项目，我们就可以上传图像、定义标签并针对标签对图像进行训练。每个类别至少上传\
    \ 50 张图像即可获得良好的准确率。当上传更多图像时，需要重新训练模型。\n\nCustom Vision 提供两个 API 将自定义模式集成到应用程序中：Prediction\
    \ API 和 Training API。定义如下：\n\n*   `Prediction API`: `Prediction API` 允许我们将训练好的模型集成到自定义应用程序中。该\
    \ API 可以 REST 服务访问，也可以在 Windows 应用程序中使用客户端。\n*   `Training API`: `Training API`\
    \ 允许我们使用代码构建并训练图像，并集成到应用程序中。\n*   定价: 访问以下链接获取更多关于定价的信息：\n    `https://www.azure.com/en-gb/pricing/details/cognitive-services/customvision-service/`\n\
    \    虽然免费层用于实验，定价基于存储以及每秒事务数等因素。\n\n### 人脸 API\nFace API 能够对照片中的人脸进行检测、分析、识别、组织和标记。它还允许识别心情或情绪，目前支持约\
    \ 9 或 10 种情绪。\n\nAzure Face API 有助于分析人脸、识别人物和寻找相似脸。脸检测和人脸识别是 Face API 涵盖的两个基本方面。它还帮助检测图像中的愤怒、恐惧、惊讶、厌恶、快乐和悲伤。\n\
    \n![](img/Figure-1.16.jpg)\n\n**图 1.16:** Face API\n\n`Face Detection` 帮助发现脸部属性，如性别、年龄等。\n\
    \n`Face Recognition` 支持以下功能子类：\n\n*   `人脸验证`: 验证两张脸是否匹配。\n*   `寻找相似脸`: 接收一张脸，并尝试根据一组脸的相似程度创建排序。\n"
