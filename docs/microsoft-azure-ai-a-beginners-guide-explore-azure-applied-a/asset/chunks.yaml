- raw: "Model Builder helps developers build models with a graphical user friendly\
    \ interface without much Machine Learning expertise. Model Builder supports a\
    \ number of scenarios like classifying sentiments, detecting fraudulent transactions,\
    \ classifying issues, and so on.\n\n# Templates \n\nModel Builder comes with templates\
    \ which can be used as starting points for common scenarios like sentiment analysis,\
    \ issue classification, price prediction, and custom scenarios.\n\n![](images/Figure-7.21.jpg)\n\
    \n**Figure 7.21:** Model Builder Templates\n\n# Data \n\nOnce we choose the template,\
    \ we need to input the dataset that will be used by the model and the output that\
    \ needs to be predicted.\n\nA dataset has features or attributes as columns and\
    \ sample data as rows. For instance, a bicycle price estimator will have features\
    \ like model, make, year of manufacturing etc. as features and price as label.\
    \ Model Builder places the following limitations on the data: \n\n*   Data can\
    \ be read from a (.csv or .tsv with a header row) \n\n*   Data can be read from\
    \ SQL server database-limit of 100000 rows \n\n*   Data copied from SQL server\
    \ to local machine before training\n\n# Train \n\nOnce the dataset is loaded,\
    \ it needs to be trained. The exact time to train depends on: \n\n*   Columns\
    \ type’s - whether numeric or text Task type – \n\n*   Regression and so on\n\n\
    *   Rows for training \n\n*   Number of feature columns\n\nEvaluate evaluation\
    \ measures how good the predictions using new data against the model that has\
    \ been trained. Model Builder splits the training data into a training (80%) set\
    \ and a test set (20%).\n\nImprove if your model performance score is not as good\
    \ as expected, we need to train for a longer duration, or add more data or balance\
    \ the data. For instance, if some tags are not used effectively, unbalanced data\
    \ will make the model struggle to predict.\n\n**Model File**: After the evaluation\
    \ phase, code that can be added as a model file is output which can be added to\
    \ an application.\n\n# [Lab 4 - Creating sample using ML.NET Model Builder for\
    \ sentiment analysis](#toc.xhtml#s117a)\n\nIn this lab we will create a sample\
    \ application which will take input and perform sentiment analysis using ML.NET\
    \ Model Builder and return the result.\n\n**Step 1**: Go to **[http://aka.ms/mlnettemplates](http://aka.ms/mlnettemplates)**\
    \ for Visual Studio and download ML.NET Model Builder extension.\n\n**Step 2**:\
    \ Create a .NET Core Console Project. Open Visual Studio. Select `File` | `New`\
    \ | `Project` from the menu bar. In the New Project dialog, select the Visual\
    \ C# node followed by the .NET Core node. Then select the Console App (.NET Core)\
    \ project template.\n\n![](images/Figure-7.22.jpg)\n\n**Figure 7.22:** Create\
    \ Project\n\n**Step 3**: Right click `Solution Explorer`. Select `Add` |`Machine\
    \ Learning`.\n\n![](images/Figure-7.23.jpg)\n\n**Figure 7.23:** Add Package\n\n\
    **Step 4**: Choose a Data Model for this sample we have downloaded yelp from UCI\
    \ Sentiment Labeled Sentences dataset. We can download from below link \n\n**[https://archive.ics.uci.edu/ml/machine-learning-databases/00331/sentiment%20labelled%20sentences.zip](https://archive.ics.uci.edu/ml/machine-learning-databases/00331/sentiment%20labelled%20sentences.zip)**).\n\
    \n![](images/Figure-7.24.jpg)\n\n**Figure 7.24:** Choose Data Model\n\nRight click\
    \ on `yelp_labelled.txt` and save as `yelp_labelled.tsv`.\n\nChoose the Model\
    \ Type:\n\n![](images/Figure-7.25.jpg)\n\n**Figure 7.25:** Choose Model Type\n\
    \nChoose your Dataset for training the model and select the column to predict.\n\
    \n![](images/Figure-7.26.jpg)\n\n**Figure 7.26:** Add Data\n\nTrain choose the\
    \ right duration to train. We need to set larger durations for larger datasets.\
    \ The training might fail when the durations are small.\n\n![](images/Figure-7.27.jpg)\n\
    \n**Figure 7.27:** Train Model\n\nProgress of the model training is displayed\
    \ as follows: \n\n*   **Status**: shows model training process status.\n\n*  \
    \ **Accuracy**: Accuracy of the best model.\n\n*   **Best algorithm**: Shows the\
    \ best algorithm.\n\n*   **Last algorithm**: Shows the last algorithm that was\
    \ explored by Model Builder. \n\n**Step 5**: Evaluate the model\n\n![](images/Figure-7.28.jpg)\n\
    \n**Figure 7.28:** Evaluate Model\n\n**Step 6**: Trained model is ready for consumption.\n\
    \n![](images/Figure-7.29.jpg)\n\n**Figure 7.29:** Model Ready for Consumption\n\
    \n# [Conclusion](#toc.xhtml#s118a)\n\nIn this chapter, we have looked at ML.NET\
    \ basics, how to leverage ML.NET to develop models and infuse custom Machine Learning\
    \ into applications, develop a sample ML Model leveraging Vision API, expose the\
    \ ML model as a service and invoke the service from .NET Core client.\n\nIn the\
    \ next chapter, we will look at Accord.NET.\n\n# [Multiple choice questions](#toc.xhtml#s119a)\n\
    \nThis section consists of a set of questions that are designed to test your knowledge\
    \ of the concepts covered in this chapter.\n\nWhen answering these questions,\
    \ imagine there is an audience who has watched a movie.\n\nYou have images of\
    \ the movie and images of the audience coming out of the theatre.\n\n1.  **We\
    \ can convert raw data into features using** \n\n    1.  Analysers\n\n    2. \
    \ ML Extraction\n\n    3.  Data Transforms\n\n    4.  Feature Engineering\n\n\
    2.  **Which algorithms create a model that calculate scores from a linear combination\
    \ of the input data and a set of corresponding weights?** \n\n    1.  Linear Regression\n\
    \n    2.  KNN\n\n    3.  Multiclass\n\n    4.  Binary\n\n3.  **Which algorithms\
    \ are to discover grouping in the input data provided like grouping customers\
    \ by segments?** \n\n    1.  Clustering\n\n    2.  Regression\n\n    3.  Multiclass\n\
    \n    4.  Binary\n\n4.  **Which type of learning is applicable where some portion\
    \ of the input data is labeled but most portion of it is unlabeled?** \n\n   \
    \ 1.  Supervised Learning\n\n    2.  Unsupervised Learning\n\n    3.  Semi Supervised\
    \ Learning\n\n    4.  All of the Above\n\n5.  **Which type of learning is applicable\
    \ to predict an output variable continuous value like predicting taxi fare for\
    \ a given trip based on certain conditions** \n\n    1.  Clustering\n\n    2.\
    \  Regression\n\n    3.  Multiclass\n\n    4.  Binary\n\n6.  **Which trainer create\
    \ a model that calculate scores from a linear combination of the input data and\
    \ a set of corresponding weights.** \n\n    1.  Linear\n\n    2.  Principal Component\
    \ Analysis\n\n    3.  K Means\n\n    4.  Naïve Bayes \n\n7.  **What framework\
    \ capable of handling large data and is designed to be distributed and efficient\
    \ with faster training speed, lower memory usage and higher accuracy and efficiency**\
    \ \n\n    1.  Linear\n\n    2.  Light Gradient Boosted Machine\n\n    3.  Fast\
    \ Tree\n\n    4.  Decision Tree\n\n8.  **Which technique is used to split the\
    \ data into several partitions and trains multiple algorithms on these partitions\
    \ to improve the robustness of the training process?** \n\n    1.  Validation\n\
    \n    2.  Principal Component Analysis\n\n    3.  Cross Validation\n\n    4. \
    \ Partitioning\n\n9.  **What is the learning of the model with labelled input\
    \ data and an algorithm to map the input data to the output data.** \n\n    1.\
    \  Supervised Learning\n\n    2.  Unsupervised Learning\n\n    3.  Semi Supervised\
    \ Learning\n\n    4.  All of the Above\n\n10.  **What can we use to standardize\
    \ features which are not on the same scale?** \n\n     1.  Validation\n\n    \
    \ 2.  Normalization\n\n     3.  Cross Validation\n\n     4.  Partitioning\n\n\
    # [Answers](#toc.xhtml#s120a)\n\n1.  **d. Feature Engineering**\n\n2.  **a. Linear\
    \ Regression**\n\n3.  **a. Clustering**\n\n4.  **c. Semi Supervised Learning**\n\
    \n5.  **b. Regression **\n\n6.  **a. Linear Trainers**\n\n7.  **b. Light Gradient\
    \ Boosted Machine**\n\n8.  **b. Principal Component Analysis**\n\n9.  **a. Supervised\
    \ Learning**\n\n10.  **b. Normalization**\n\n# [CHAPTER 8](#toc.xhtml#c08)\n\n\
    # [Using Azure ML Studio](#toc.xhtml#c08)"
