    \nFollowing are the ways index attributes can be used:\n\n![](images/Figure-5.14.jpg)\n\
    \n**Figure 5.14:** Index attributes\n\n*   Searchable determines that a field\
    \ is included in full text search.\n\n*   Filterable, Facetable, and Sortable\
    \ determine if fields are used in a filter, faceted navigation or sort structure.\n\
    \n*   Key is a unique document identifier.\n\n*   Retrievable makes the search\
    \ result return the field.\n\n**Cognitive skills**: We can add cognitive skills\
    \ to the Search Service as shown below:\n\n![](images/Figure-5.15.jpg)\n\n**Figure\
    \ 5.15:** Cognitive Skills\n\n**Add Enrichments**: A **skillset** can be attached\
    \ to an indexer which does the AI processing. The indexer extracts the content\
    \ and sets up the AI Processing pipeline. It analyzes, identifies, and creates\
    \ new information out of content like images, blobs, and raw text. Output is a\
    \ search index.\n\n![](images/Figure-5.16.jpg)\n\n**Figure 5.16:** Skillset\n\n\
    **Attach Cognitive Skills**: Some of the cognitive skills provided by the Azure\
    \ Cognitive search are described below:\n\n![](images/Figure-5.17.jpg)\n\n**Figure\
    \ 5.17:** Cognitive Skills\n\n*   **Custom Entity**: Helps in looking for a user-defined\
    \ set of words and phrases.\n\n*   **Key Phrases**: Helps in extracting data like\
    \ important phrases using a pre-trained model. It is useful to retrieve the main\
    \ points in a record.\n\n*   **Language Detection**: Helps in detecting language\
    \ in each document.\n\n*   **Merge**: Helps in combining text from multiple fields\
    \ to a single field. A common use case is to extract a caption from the OCR skill\
    \ and then merge it with the content field of a document.\n\n*   **Entity Recognition**:\
    \ Helps in identifying location, people, emails, organization, etc.\n\n*   **PII\
    \ Detection**: Helps in extracting personally identifiable information from a\
    \ given text.\n\n*   **Sentiment Analysis**: Helps in retrieving score based on\
    \ positive or negative or neutral sentiment.\n\n*   **Text Split**: Helps in enriching\
    \ content by splitting the text into sentences.\n\n*   **Translate**: Helps in\
    \ translating a text into a variety of languages.\n\n*   **Image Analysis**: Helps\
    \ in Identifying content of image and generating text description, generating\
    \ tags and identifying landmarks or celebrities.\n\n*   **OCR**: Helps search\
    \ faxes, images and scanned documents.\n\n*   **Conditional**: Allows merging,\
    \ filtering, or assigning a default value based on a condition, or setting a default\
    \ value for a value that does not exist."
  fmt: "\n*   `Pre Built-businessCard`: Helps in extracting text and key information\
    \ from business cards.\n*   `Prebuilt-idDocument`: Helps in extractintext and\
    \ key information from driver licenses and international passports.\n*   `Prebuilt-receipt`:\
    \ Helps in extracting text and key information from receipts.\n*   `Custom Models`\n\
    \    In addition to the support for pre-built models, we can train a custom model\
    \ using sample input forms. The minimum number of forms required for training\
    \ is 5. The model uses unsupervised learning to identify fields, tables, entries\
    \ and the relationships in the form.\n\n# Accessing Form Recognizer\n\nForm Recognizer\
    \ is accessible using REST APIs. Form Recognizer is currently in limited access\
    \ preview.\n\nIn this short lab, we see how we can use Form Recognizer studio\
    \ to analyze a sample invoice.\n\nWe will use the `Layout API` in this lab. The\
    \ `Layout API` analyzes and extracts text, tables and headers, selection marks,\
