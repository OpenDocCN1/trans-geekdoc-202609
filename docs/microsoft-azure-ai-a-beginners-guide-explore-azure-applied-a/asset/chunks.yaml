- raw: "**Figure 6.3:** LUIS Enabled Apps\n\nA LUIS app can be created using the luis.ai\
    \ portal and such an app contains a domain specific natural language model. If\
    \ you are starting new, you should start off by trying out one of the prebuilt\
    \ domain model. The other way is to build your own model, and it is also possible\
    \ to have blended combination of prebuilt domain models along with your custom\
    \ defined model.\n\nThe following are important concepts to understand in a LUIS\
    \ application: \n\n**Intent**: Action users wants the bot to perform - the basic\
    \ intention behind user’s query.\n\n**Utterances**: Questions or sentences used\
    \ by users with the bot.\n\n**Entities**: Nouns or Objects in the context that\
    \ the users’ query is based on.\n\nHere is an example: \n\n![](images/Figure-6.4.jpg)\n\
    \n**Figure 6.4:** Main Components of LUIS App\n\nThe way LUIS is different from\
    \ QnA Maker, is primarily on how the API response is consumed. With QnA Maker,\
    \ the result of the query, which is the answer to a mapped question is directly\
    \ sent to the user, with no additional processing or handling by the bot (bot’s\
    \ code). With LUIS, response from the LUIS API is a combination of prediction\
    \ score, intent, and some extra metadata. Bot must handle this response and react\
    \ accordingly before it can respond to users.\n\n# [Azure Cognitive Services for\
    \ Language ](#toc.xhtml#s80a)\n\nIn May 2021, Microsoft re-introduced QnA Maker\
    \ managed service as “*Custom Question Answering*” feature as part of Text Analytics.\
    \ This was part of the larger “*AI at Scale*” approach, where “*Question Answering*”\
    \ feature was introduced with both pre-built and custom capabilities. The existing\
    \ QnA Managed resources continue to work as well.\n\nWhat Microsoft has done very\
    \ recently is to unify QnA Maker and LUIS and place it along with text analytics\
    \ in a new service called as the “*Language Service*” or “*Cognitive Services\
    \ for Language*”. This is in public preview as of this writing. If you would have\
    \ QnA or LUIS resources already, it is possible to migrate them to the new language\
    \ service. Importing LUIS is to quite simple by importing your LUIS JSON file,\
    \ while QnA migration is a guided process. If you are interested, you can take\
    \ a peek at the migration guide here - Migrate QnA Maker knowledge bases to custom\
    \ question answering - Azure Cognitive Services | Microsoft Docs\n\n![](images/Figure-6.5.jpg)\n\
    \n**Figure 6.5:** Cognitive Services – Language Service\n\n![](images/Figure-6.6.jpg)\n\
    \n**Figure 6.6:** Adding Features in a Language Service\n\n# [Search](#toc.xhtml#s81a)\n\
    \nSearch is an integral part of building bots. QnA Maker for instance, now uses\
    \ Azure Search internally (you would see Azure Search instance created as part\
    \ of the QnA Service) where Search is used to index all the knowledge bases content\
    \ and as well as for authoring and testing purposes.\n\nOver and above this, Bots\
    \ can incorporate Azure Search separately to explore multiple sources involved\
    \ and could also have Bing Search integrated for web search. Therefore, if the\
    \ user query could not be serviced by the models and KBs, and the data from the\
    \ data sources, bots can run a Bing Search and provide with the suitable answer.\n\
    \n# [Storage](#toc.xhtml#s82a)\n\nStoring data with Bots can be of two ways -\
    \ the in-memory store or database store. In both cases, bots store and retrieve\
    \ state data that is associated with a user/ conversation and this data can then\
    \ be used for many purposes, such as to re-start the conversation from where it\
    \ was left-off or simply greeting a returning user by their name. It can also\
    \ be used to interact with users with content tailored to their interests, such\
    \ as alerting them on an event or news that interests them.\n\n# [Information\
    \ sources](#toc.xhtml#s83a)\n\nBots can also interface with external informational\
    \ sources that are exposed as REST APIs. Such services are those that could provide\
    \ demographic and geospatial data, data from 3rd parties and agencies, and so\
    \ on.\n\n*   **Monitoring and Insights**\n\n    Bot Analytics provides analytical\
    \ insights into the bot. It is an extension of application insights and provides\
    \ data about traffic, latency, and integrations and also the conversational data\
    \ such as user, message, and channel data.\n\n*   **Reporting/Visualization**\n\
    \n    Reporting and visualization is a common aspect of any solution and can be\
    \ fulfilled by cloud native offerings such as Power BI. Power BI is a collection\
    \ of software services, apps, and connectors that work together to turn unrelated\
    \ sources of data into visually immersive, and interactive insights. Data can\
    \ be in any source such as spreadsheets, cloud based or on-premises based data\
    \ stores and warehouses.\n\n# [Build Bots using the Bot Framework](#toc.xhtml#s84a)\n\
    \nBuilding Bots using the Bot Framework involves the following components and\
    \ tools that assist developers in building Bots: \n\n*   **Bot Framework SDK**:\
    \ A dev kit that provides all the necessary plumbing code to develop Bots.\n\n\
    *   **Bot builder tools**: To assist with end-to-end development, including the\
    \ Bot emulator.\n\n*   **Azure Bot Service**: The core service that enables communication\
    \ between bot and its channels.\n\n*   **Conversation experiences**: Channels\
    \ that allow communication with bots.\n\n*   The Azure Bot Service provides two\
    \ ways to create a bot and they differ in terms of how customers are billed which\
    \ is driven by the requirements/usage of the bot.\n\n*   **Web App Bot**: This\
    \ type of bot uses an App Service to host the bot and has the option of choosing\
    \ a “*App Service Plan*” or a “*Consumption Plan*”\n\n*   **Functions Bot**: Function\
    \ bots use Azure Functions as the backed. You will not see an App service plan/Location\
    \ field when creating a function bot. Instead, a Hosting plan field is available\
    \ to choose.\n\nThe thought process of designing and building bots is important\
    \ even before you start working on design. As a rule, the following should be\
    \ goals:\n\nStart simple and add complexity as you build on. Bot should be contextual\
    \ and adapt to the user.\n\nIncorporate intelligent controls to manage complexity.\n\
    \n# [Lifecycle](#toc.xhtml#s85a)\n\nThe goals for building a bot is:\n\n*   Start\
    \ simple and add complexity as you build on. Bot should be contextual and adapt\
    \ to the user.\n\n*   Incorporate intelligent controls to manage complexity.\n\
    \nThe end to end development workflow for a bot includes 6 stages and Microsoft\
    \ provides the tools for all of them to help develop, design, and build bots:\n\
    \nPicture courtesy: **[https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview?view=azure-bot-service-4.0](https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview?view=azure-bot-service-4.0)**\n\
    \n![](images/Figure-6.7.jpg)\n\n**Figure 6.7:** End to End Development Life Cycle\n\
    \nWhen you start building Bots, the first one you build you are likely going to\
    \ face a few glitches and feel that you missed to plan it well. But understanding\
    \ the development lifecycle helps developing a bot from start to finish without\
    \ many glitches. Here is a quick summary of each phase in the lifecycle.\n\n*\
    \   **Plan**\n\n    Involves planning the bot’s conversations and dialogs by leveraging\
    \ the design best practices. (look at principles of bot design). Use Chatdown\
    \ to mock conversations before you start coding.\n\n*   **Build**\n\n    Build\
    \ phase is when you would tie-in intelligence features such as **Language Understanding**\
    \ (**LUIS**), Knowledge base support (QnA Maker).\n\n*   **Test**\n\n    Use the\
    \ Bot Framework Emulator V4 for testing the bot and debugging it with breakpoints.\
    \ The Emulator is a free tool provided by Microsoft and allows connecting the\
    \ bot to other services such as LUIS, QnA, and so on.\n\n*   **Publish**\n\n \
    \   Bots can be published directly from Visual Studio or VS Code if you use them\
    \ for custom development. Azure CLI can also be used to create, download and publish\
    \ your locally built bots to the Azure Bot Service.\n\n*   **Connect**"
