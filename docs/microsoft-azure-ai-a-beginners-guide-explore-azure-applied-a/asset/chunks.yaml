    \ has many use cases spread across domains such as health, insurance, and banking.\n\
    \nFollowing diagram shows how we can process printed and handwritten notes using\
    \ easy-to-integrate APIs/SDKs.\n\n![](images/Figure-3.1.jpg)\n\n**Figure 3.1:**\
    \ OCR use case\n\nThe following sections cover the different APIs that are available\
    \ in Computer Vision for OCR.\n\n*   **Read API**: Using Read API, we can convert\
    \ text into a machine-readable character stream. This asynchronous API is good\
    \ for converting text-heavy images and images that contain a lot of noise. It\
    \ uses the latest recognition models. \n\n    The following of the key features\
    \ of Read API:\n\n    *   Supported image types include TIFF, JPEG, BMP, PDF and\
    \ PNG \n\n    *   File size should be less than 20 MB \n\n    *   It can process\
    \ up to 200 pages with a maximum limit of 300 lines per page\n\n*   **OCR API**:\
    \ We can leverage OCR API to convert images into text synchronously. This API\
    \ tries to detect the orientation of the text and tries to correct the orientation\
    \ of the image. \n\n    The following are OCR API Features:\n\n    *   Supported\
    \ image types include BMP, GIF, PNG and JPEG.\n\n    *   Supports rotation of\
    \ image by multiples of 90 degrees and small angles of up to 40 degrees. Input\
    \ image should be greater than or equal to 40 x 40 and less than or equal to 3200\
    \ x 3200 pixels.\n\n    *   Size should be less than 10 megapixels.\n\n    * \
    \  Size should not be greater than 4 MB.\n\n    *   OCR supports 25 different\
    \ languages and can detect the language of the text in the image.\n\n*   **Sample\
    \ Scenarios**\n\n    Given below are some sample scenarios/use cases in which\
    \ the above-mentioned APIs are used.\n\n    **Scenario 1**:\n\n    *   User uploads\
    \ a cheque.\n\n    *   The cheque is converted into Digital Text using OCR API.\n\
    \n    *   The signature is verified.\n\n    *   The cheque is cleared.\n\n   \
    \ ![](images/Figure-3.2.jpg)\n\n    **Figure 3.2:** OCR for handwritten cheque\
    \ use case\n\n**Scenario 2**: In a scenario in which there are multiple patients’\
    \ records getting scanned, digitized and stored, providing a comprehensive patient\
    \ record is very useful for providing apt treatment.\n\nWe can create an aggregated\
    \ patient history by performing OCR on medical records, insurance records from\
    \ various sources. This provides a comprehensive patient record. This is helpful\
    \ in providing the right treatment.\n\nFollowing diagram shows how we can use\
    \ OCR to aggregate records from multiple sources:\n\n![](images/Figure-3.3.jpg)\n\
    \n**Figure 3.3:** OCR to aggregate records from multiple sources.\n\n**Scenario\
    \ 3**: We can scan and perform OCR on documents in one language and translate\
    \ into another language using Azure Text to Speech API.\n\n![](images/Figure-3.4.jpg)\n\
    \n**Figure 3.4:** OCR to aggregate records from multiple sources.\n\n# [Handwriting\
