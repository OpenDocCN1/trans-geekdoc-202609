  trans: "\n\n以下是 Accord.NET 在各个模块中支持的一些算法：\n\n![](img/Figure-8.34.jpg)\n\n**图 8.34:**\
    \ Accord.NET 框架\n\n# 结论\n\n在本章中，我们学习了 Azure Machine Learning Studio。我们学习了如何使用\
    \ Azure Machine Learning Studio 创建示例 ML 实验。\n\n# 多选题\n\n本节由一组问题组成，旨在测试你对本章涵盖概念的理解。\n\
    \n1. **什么是项目编写和资产管理门户？**\n    1. Azure Machine Learning Studio\n    2. VS code\n\
    \    3. Visual Studio\n    4. Eclipse\n\n2. **哪项提供了基于无代码的方法，帮助通过简单的拖放而无需编写任何代码来开发\
    \ ML 应用？**\n    1. 自动化机器学习 (Automated ML)\n    2. ML Analytics\n    3. Visual\
    \ Studio\n    4. Eclipse\n\n3. **什么有助于更快速地开发、部署模型，并实现端到端生命周自动化？**\n    1. DevOps\n\
    \    2. AIML\n    3. MLOps\n    4. 以上\n\n4. **Azure 机器学习项目的基础模块是什么？**\n    1.\
    \ 数据集 (Dataset)\n    2. 项目 (Project)\n    3. 实验 (Experiment)\n    4. 机器学习工作空间\
    \ (Machine Learning Workspace)\n\n5. **什么有助于数据科学家、工程师、分析师和运营人员之间透明地共享从模型创建到部署的整个生命周期？**\n\
    \    1. 自动化 (Automation)\n    2. 治理 (Governance)\n    3. 重试 (Retry)\n    4. 透明度\
    \ (Transparency)\n\n# 答案\n\n1. **a. Azure Machine Learning Studio**\n2. **a. Automated\
    \ ML**\n3. **c. MLOps**\n4. **d. Machine Learning Workspace**\n5. **b. Governance**\n\
