- raw: "    Computer vision provides APIs for analyzing images, extracting text from\
    \ images and moderating content in images. Azure Computer Vision provides APIs\
    \ to help in processing and analyzing photos, images, and videos. These APIs allow\
    \ the users to perform the classification of images, extract sentiment from images\
    \ and read handwriting and convert to text or add descriptions to images based\
    \ on the intent in the images. It also helps in recognizing human faces and applying\
    \ tags based on classification, and so on. For example, Computer Vision can help\
    \ determine if an image contains adult content, can find all of the human faces\
    \ in an image, and can draw insights from a video.\n\n![](images/Figure-1.11.jpg)\n\
    \n**Figure 1.11:** Azure Computer Vision\n\nA detailed description of the APIs\
    \ is given as follows:\n\n*   **Text Extraction**: Helps in extracting text from\
    \ Images. It provides Optical Character Recognition which includes Read API and\
    \ OCR API. \n\n    ![](images/Figure-1.12.jpg)\n\n    **Figure 1.12:** Use cases\
    \ for Custom Services\n\n    *   Read API helps in extracting text from images\
    \ and is optimized for text-heavy images and documents which have a lot of text\
    \ content. We can use this API to extract information from business cards, posters,\
    \ receipts, whiteboards, and so on.\n\n    *   OCR API executes synchronously\
    \ and is not optimized for large documents. It leverages an older recognition\
    \ model. OCR supports around 25 languages. OCR automatically detects the language\
    \ of the detected text. It also provides the ability to correct the rotation of\
    \ the recognized text and provides the frame coordinates of each word.\n\n*  \
    \ Analyze Images: \n\n    ![](images/Figure-1.13.jpg)\n\n    **Figure 1.13:**\
    \ Use cases for Custom Services\n\n*   Image Recognition and Analysis can be leveraged\
    \ for extracting various visual features from images like categorization, image\
    \ type. Image Analysis can be performed by leveraging the Analyze Image API which\
    \ provides features like locating all the faces in an image, checking if an image\
    \ contains adult content, describing an image, generating images thumbnails, identifying\
    \ and tagging visual features in an image, detecting objects in an image, detecting\
    \ commercial brands in an image, identifying and tagging an entire image, detecting\
    \ a color scheme, detecting domain-specific content, and getting the bounding\
    \ box coordinates of interest.\n\n*   Here is a brief overview of the feature\
    \ of Analyze Images API: \n\n    | **Action** || **Description** |\n\n    | ---\
    \ | --- |\n\n    | Tag visual features || Helps in identifying and tagging visual\
    \ features in an image leveraging a large number of pre-built models. |\n\n  \
    \  | Detect objects || Helps in returning the coordinates of the bounding boxes\
    \ for each tag. We can leverage this to process relationships between objects\
    \ in a given image. |\n\n    | Detect brands || Helps in detecting commercial\
    \ brands in an image. This helps in checking the popularity of brands. |\n\n \
    \   | Categorize an image || Helps in identifying and categorizing images using\
    \ pre-built categories. |\n\n    | Describe an image || Helping in returning descriptions\
    \ based on the objects identified in an image.There is a confidence score also\
    \ returned for each object identified. |\n\n    | Detect faces || Helps in detecting\
    \ faces and providing information about each face detected.We can use this information\
    \ for the implementation of digital id or pose detection etc. |\n\n    | Detect\
    \ image types || Helps in identifying if the given image is a line or a clip art.\
    \ |\n\n    | Detect domain-specific content || Helps in identifying domain-specific\
    \ content using pre-built models like celebrities. |\n\n    | Detect the color\
    \ scheme || Helps in identifying whether the image is black and white or color\
    \ and helps in identifying the accent and dominant colors for a color image. |\n\
    \n    | Generate a thumbnail || Helps in identifying and cropping areas of interest\
    \ and returning a thumbnail. It can identify faces etc in an image and crops the\
    \ same. It provides the best quality thumbnail. It has the ability to identify\
    \ the face etc in an image, and crop around it. |\n\n    | Get the area of interest\
    \ || Helps in analyzing the content and returning the coordinates of the area\
    \ of interest. |\n\n    | Content Moderator || It helps detect adult and offensive\
    \ content in an image and returns confidence scores. The threshold for flagging\
    \ content can be set as per the requirement. Content Moderator APIs help in content\
    \ moderation for videos, text, and images. The Content Moderator APIs help with\
    \ labeling content that is offensive. This flagged content can be handled by workflow-based\
    \ applications to either approve or delete the offensive content which might also\
    \ require human intervention. |\n\n    **Table 2.2:** Analyze Images \n\n*   **Spatial\
    \ Analysis**: Computer Vision Spatial Analysis helps in extracting insights and\
    \ generating events by ingesting streaming video from cameras. It detects people’s\
    \ presence and their movements and helps in counting the number of people entering\
    \ a space or measuring compliance with face masks etc. It can also help in space\
    \ utilization optimization solutions. \n\n    Following are some use cases for\
    \ Spatial Analysis:\n\n    ![](images/Figure-1.14.jpg)\n\n    **Figure 1.14:**\
    \ Use cases for Spatial Analysis\n\n*   **Custom Vision Service**: Custom Vision\
    \ provides custom training of images for use cases like anomaly detection, objects\
    \ with custom tags defined detection etc. With Custom Vision we can build and\
    \ train our own custom vision model. The more the images are fed into the model\
    \ and the model is trained, the more accurate the prediction becomes as the model\
    \ learns to discern the images. \n\n    The following is how custom vision models\
    \ are trained:\n\n    ![](images/Figure-1.15.jpg)\n\n    **Figure 1.15:** Custom\
    \ vision model\n\n    Once a project is created, we can upload images, define\
    \ tags and then train the images against the tags. Good accuracy is obtained by\
    \ uploading at least 50 images in each category. The model needs to be retrained\
    \ when more images are uploaded.\n\n    Custom Vision Service provides two APIs\
    \ to integrate the custom modes into applications:\n\n    Prediction API and Training\
    \ API. These are defined as described below:\n\n    *   **Prediction API**: Prediction\
    \ API allows us to integrate the trained model into our custom applications. This\
    \ API can be accessed through REST services or by using a client library in the\
    \ case of Windows applications.\n\n    *   **Training API**: Training API allows\
    \ us to build and train images using code and can be integrated into applications.\n\
    \n    *   **Pricing**: Visit the following link for more details on pricing: \n\
    \n        **[https://www.azure.microsoft.com/en-gb/pricing/details/cognitive-services/customvision-service/](https://www.azure.microsoft.com/en-gb/pricing/details/cognitive-services/customvision-service/)**\n\
    \n        While the free tier is used for experimentation, the pricing is based\
    \ on storage and other factors like transactions per second etc.\n\n*   **Face\
    \ API**: Face API makes it possible to detect, analyze, identify, organize and\
    \ tag faces in pictures. It also allows identifying a mood or emotion with around\
    \ 9 or 10 emotions currently being supported. \n\n    The Azure Face API helps\
    \ in analyzing faces, identifying people, and finding similar faces. Face Detection\
    \ and Face Recognition are two basic aspects covered in Face API. It also helps\
    \ in detecting emotions like anger, fear, surprise, disgust, happiness, and sadness\
    \ in an image.\n\n    ![](images/Figure-1.16.jpg)\n\n    **Figure 1.16:** Face\
    \ API\n\n    Face Detection helps discover attributes of a face such as gender,\
    \ age, and so on.\n\n    Face Recognition supports the following subcategories\
    \ of functionalities:\n\n    *   **Face Verification**: This verifies if two faces\
    \ match Finding Similar Face: This takes a face and tries to create an order based\
    \ on the degree of similitude in a set of faces."
