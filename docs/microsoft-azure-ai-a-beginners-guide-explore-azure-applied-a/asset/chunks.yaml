    \ can create a skill by exporting a bot with Composer. Bots that make use of a\
    \ skill are termed as `root bots`. When a skill is used by a bot (and not directly),\
    \ users can only interact with the `root bot` and not with the skill.\n\n# Memory\
    \ Scopes\n\nAll this is done via the properties pane where you could try properties\
    \ that can be used for Bot response.\n"
  trans: "\n\n*   如果你已经使用 Bot Framework SDK 工作了一段时间，并决定切换到无代码模型且保留你的工作，Bot Composer\
    \ 可以实现这一目标。现有的对话（dialogs）和技能（skills）也可以导入到 Composer 中。当你决定切换到视觉设计器（Visual Designer）时，这是一个进一步加速机器人开发的优势。你还可以导出它们并共享。\n\
    \n*   Composer 使用声明式 JSON，它位于视觉画布之后，可以在其中将对话和响应拼接在一起。\n\n*   它支持 NuGet 包管理器，机器人可以消耗\
    \ NuGet 包，这就像任何其他应用程序开发中一样，增强了在组织内复用内容的能力。\n\n*   你可以使用 Composer 的网络聊天功能测试机器人，或使用\
    \ Bot 模拟器（Bot Emulator）。\n\n# 设置 Composer\n\nComposer 桌面应用程序适用于 Windows、MacOS\
    \ 和 Linux，可以从此处进行安装。请确保能够连接到互联网。如果你对制作 composer 的自定义构建感兴趣，请参考此微软文档以获取先决条件和指导。\n\
    \n以下是设置 Composer 需要的步骤：\n\n## 配置\n\n*   连接 (Connections)\n\n    连接是链接机器人与外部服务的方式，这些服务可以来自\
    \ Azure 或其他外部源。Azure 连接可能包括网络聊天（Web Chat）、Teams、语音服务等，而外部连接是可以通过 NuGet 包管理器以包形式提供的外部扩展。\n\
    \n*   技能 (Skills)\n\n    技能允许引用与机器人关联的现有技能以便复用。\n\n## 使用 Composer 进行机器人设计的组件\n\
    \n我们将探索 Composer 的以下核心功能：\n\n*   对话 (Dialogs)\n\n*   识别器 (Recognizers)\n\n*  \
    \ 触发器和操作 (Triggers and Actions)\n\n*   自然语言处理 (Natural Language Processing)\n\n\
    *   技能 (Skills)\n\n*   内存范围 (Memory Scopes)\n\n# 对话\n\n对话是建立和管理对话的手段。它们被称为`适应对话`\
    \ (Adaptive Dialogs)，将它们想象成窗口或界面，用于与具有针对输入和响应定制功能的机器人交互。对话可以有一个或多个触发器，即对话的起点。使用\
    \ bot composer 创建的机器人可以有两种对话——一个`主对话` (main dialog) 和一个或`子对话` (child dialogs)。\n\
    \n# 识别器\n\n识别器用于解释来自用户的消息并将其分为`意图` (intent) 和`实体值` (entity values)。在此过程之后，消息将传递给触发器。有\
    \ 3 种识别器：默认识别器（默认启用），它允许使用 composer 内置的 LUIS 和 QnA 识别器。也可以拥有自定义识别器或使用正则表达式版本，允许对意图和实体值进行自定义提取。\n\
    \n# 触发器和操作\n\n触发器是由为特定对话编写的规则触发的事件，并有一个或多个操作。操作是机器人要处理的执行指令。触发器的示例是`意图识别` (Intent\
    \ recognized)，当发生某个意图时（例如 `Agent`），操作可以是`开始新对话` (Begin a new Dialog)，从而与该 agent\
    \ 启动一个独立的对话流。\n\n# 自然语言处理\n\n自然语言处理 (`NLP`)是一项涵盖自然语言理解 (`NLU`) 和自然语言生成 (`NLG`)\
    \ 的技术。NLU 是理解和解码文本以知道其含义的能力。想象用户使用 <TBD> 等词汇与机器人通信。NLG 全关于生成自然语言。NLP 有四个组件组件：\n\
    \n*   语言理解\n*   语言生成\n*   QnA\n*   编排 (Orchestration)\n\n# 语言理解\n\n为了维持对话流，机器人需要保存用户对话的状态和上下文，以便用户可以从离开的地方继续。默认情况下，活动对话被保存到内存中，还可以添加其他数据，如用户配置文件、偏好自定义属性。\n\
    \n# 语言生成\n\n一旦确定了意图和语句，语言生成有助于响应。这在认知服务（Cognitive Services）下单独提供，是以前 `QnA Maker`\
    \ 服务的更新版本。\n\n# QnA\n\nQnA Maker (托管) 是经典的问答服务，提供基于问答的对话能力。QnA Maker 托管更新通过创建服务部分的两个资源（即\
    \ QnA Maker 服务和 Cognitive Search）简化了资源管理。它还支持使用 Azure Monitor 进行监控（而不是之前提供的 Application\
    \ Insights），并提供了深度学习 NLP 排名模型。\n\n# 编排\n\n可以在创建期间启用 Orchestrator。\n\n!images/Figure-6.2.jpg\n\
    \n# 技能\n\n技能用于创建可共享的对话逻辑。技能就像执行某些操作的代码函数——一组可以复用的任务。技能由技能清单 (JSON) 描述，该定义定义了它的操作、输入输出。你可以通过\
    \ Composer 导出机器人来创建一个技能。使用技能的机器人被称为`根机器人` (root bots)。当技能被机器人使用（而不是直接使用）时，用户只能与`根机器人`交互，而不能与技能交互。\n\
    \n# 内存范围\n\n这一切都是通过属性面板完成的，在面板中你可以尝试用于机器人响应的属性。\n\n"
