- raw: "*   **Data Transforms**: ML.NET provides a number of data transforms to convert\
    \ data to an acceptable format for the ML algorithms like text featurizers.\n\n\
    *   **Model Training**: Classic ML Tasks: ML.NET supports many logarithms like\
    \ classification, regression, clustering, anomaly detection, recommendation engine\
    \ etc. It provides more than 40 trainers to select for a specific task. 8\\. Extending\
    \ leveraging ML.NET *[Chapter 1, ‘Azure AI Platform and Services](#c01.xhtml)*\
    \ ‘\\[ 4 \\] Computer Vision: ML.NET also offers TensorFlow based image classification/recognition\
    \ with our own custom images.\n\n*   **Model Consumption and Evaluation**: \n\n\
    \    **Model Consumption**: Once the model is trained we can use the prediction\
    \ engine to predict. \n\n    **Model Evaluation**: We can determine the accuracy\
    \ of the model using evaluators provided by ML.NET.\n\n*   **Extensions**: ML.NET\
    \ helps simplify other Machine Learning infrastructure libraries and runtimes,\
    \ such as Cognitive ToolKit, TensorFlow and ONNX. The Microsoft **Cognitive Toolkit**\
    \ (**CNTK**) is a tool kit which is open source and provides deep learning capabilities.\
    \ TensorFlow is a library to accelerate machine learning and deep neural network\
    \ research which is developed by the Google Brain Team. ONNX is Open Neural Network\
    \ Exchange format. It is an open source shared model representation which helps\
    \ in framework interoperability and shared optimization. ML.NET also offers Python\
    \ bindings called NimbusML. We can create ML.NET models in Python with NimbusML.\
    \ These models can be consumed in .NET applications.\n\n*   **Tools**: We can\
    \ use ML.NET’s tools (Model Builder in Visual Studio or the cross platform CLI)\
    \ to make model training even easier. These tools use the ML.NET AutoML API internally\
    \ to try many different combinations of algorithms and configurations in order\
    \ to find the best model for our data and scenario. Now we will discuss the algorithms\
    \ that are supported by ML.NET.\n\n# [Algorithms supported by ML.NET](#toc.xhtml#s108a)\n\
    \nML.NET supports a number of training algorithms. An algorithm is a math that\
    \ executes to define the model that will be produced with unique characteristics.\
    \ With ML.NET, the same algorithm can be applied to different kinds of tasks while\
    \ how the output of the algorithm is interpreted differs. For instance, Stochastic\
    \ Dual Coordinated Ascent can be used for Regression and Binary Classification.\n\
    \n# [Choosing the right algorithm](#toc.xhtml#s109a)\n\nMachine learning algorithms\
    \ can be classified as supervised (Classification, regression) and unsupervised\
    \ (clustering).\n\n*   **Supervised**: Supervised learning is the learning of\
    \ the model with labelled input data and an algorithm to map the input data to\
    \ the output data. The algorithm learns by predicting the output from input data\
    \ and can predict the output where a new input value is provided. It involves\
    \ offline analysis of data. Accuracy is higher.\n\nSupervised learning can be\
    \ further classified into:\n\n*   **Classification**: This type of learning is\
    \ applicable to predict an output variable where the output is a category like\
    \ the color of a dress etc. \n\n*   **Regression**: This type of learning is applicable\
    \ to predict an output variable continuous value like predicting taxi fare for\
    \ a given trip based on certain conditions.\n\n*   **Unsupervised**: This type\
    \ of learning learns from unlabeled input data where there is no corresponding\
    \ output variable. It involves real time analysis of data. \n\n*   **Clustering**:\
    \ A clustering problem is where we want to discover grouping in the input data\
    \ provided like grouping customers by segments. The model learns by looking at\
    \ training data that are similar to each other and clusters them together like\
    \ similar kind of birds. \n\n*   **Association**: An association rule learns by\
    \ looking at the correlation of features in existing sample data. For instance,\
    \ suggesting accessories for a dress purchased.\n\n*   **Semi-supervised**: This\
    \ type of learning is applicable where some portion of the input data is labeled\
    \ but most portion of it is unlabeled.\n\nA number of factors determine the right\
    \ algorithm to choose. The choice of the right algorithm depends on the problem\
    \ we are solving, the characteristics of input data, and the compute and storage\
    \ resources. Sometimes we might have to try different algorithms to find the one\
    \ that works best for the problem statement.\n\nAlgorithms work on features which\
    \ are numerical values that are computed from input data. We can convert raw data\
    \ into features using one or more data transforms. Transformed features are referred\
    \ to as featurized text or featurized image data, etc.\n\nFollowing is a view\
    \ of the algorithms to be used for each type of task:\n\n![](images/Figure-7.2.jpg)\n\
    \n**Figure 7.2:** Algorithms supporting various ML tasks\n\nFor each algorithm/task\
    \ combination, ML.NET provides a trainer that executes the training algorithm.\
    \ We will now discuss trainers.\n\n# [Trainers](#toc.xhtml#s110a)\n\nFor each\
    \ combination of an algorithm and a task, ML.NET provides a trainer component\
    \ that executes the training algorithm and performs the interpretation. For instance,\
    \ for regression the **SdcaRegressionTrainer** leverages the **StochasticDualCoordinatedAscent**\
    \ algorithm.\n\nGiven below are the some of the Trainers supported by ML.NET:\n\
    \n*   **Linear Trainers**: Linear trainers create a model that calculate scores\
    \ from a linear combination of the input data and a set of corresponding weights.\
    \ Linear algorithms work well for features that are linearly separable. \n\n \
    \   ![](images/Figure-7.3.jpg)\n\n    **Figure 7.3:** Linear Trainers\n\n*   **Averaged\
    \ Perceptron**: This is used to classify inputs into several possible outputs\
    \ based on a linear function, and then combined with a set of weights that are\
    \ derived from the feature vector. This is good for text classification.\n\n*\
    \   **Stochastic dual coordinated ascent**: This is used to solve regularized\
    \ loss minimization problems in machine learning.\n\n*   **L-BFGS**: This is an\
    \ optimization algorithm used for parameter estimation to train various machine\
    \ learning models using a limited amount of memory. This is used when the number\
    \ of features is huge. \n\n*   **Symbolic Stochastic Gradient Descent**: This\
    \ is used for minimizing loss functions with the form of a sum. This is very accurate\
    \ and very fast.\n\n*   **Decision Tree Trainers**: Decision tree trainers are\
    \ applicable to features that are not separable linearly. These algorithms create\
    \ a model which is based on a decision series. The features for a decision tree\
    \ algorithm need not be normalized and are very accurate. \n\n    Following are\
    \ the various decision tree trainers in ML.NET:\n\n    ![](images/Figure-7.4.jpg)\n\
    \n    **Figure 7.4:** Decision Tree Trainers\n\n*   **Light Gradient Boosted Machine**:\
    \ This is a gradient boosting framework and is capable of handling large data\
    \ and is designed to be distributed and efficient with faster training speed,\
    \ lower memory usage and higher accuracy and efficiency.\n\n*   **Fast Tree**:\
    \ Fast Tree does not require the entire data set to be read for learning hence\
    \ reducing the time for learning and is efficient in terms of memory as well.\
    \ Fast tree performs a test and train process each time test data arrives. This\
    \ works well when the number of features is very high. \n\n*   **Generalized Additive\
    \ Model**: This is used when a linear predictor depends linearly on unknown smooth\
    \ functions.\n\nBoosted decision trees are an ensemble of smaller trees. Each\
    \ tree in the ensemble scores the input data. This input data is passed to the\
    \ next tree to produce a better score. Now we will look at the steps involved\
    \ in creating a ML.NET model.\n\n# [Creating a ML.NET Model](#toc.xhtml#s111a)\n\
    \nA Machine Learning model helps in performing the transformation on input data\
    \ and gives as output the predicted data. The basic steps in creating a model\
    \ are given as follows:\n\n![](images/Figure-7.5.jpg)\n\n**Figure 7.5:** Steps\
    \ in creating ML.NET Model"
