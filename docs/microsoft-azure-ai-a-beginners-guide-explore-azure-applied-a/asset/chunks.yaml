    \nA subscription key is required to invoke Computer Vision API which can be passed\
    \ through a query string parameter specified in the request header. We can obtain\
    \ the subscription keys as follows:\n\nGiven below is the link for Computer\n\n\
    Vision: **[https://azure.microsoft.com/en-us/services/cognitive-services/computer-vision/](https://azure.microsoft.com/en-us/services/cognitive-services/computer-vision/)**\n\
    \nOnce we have reached this screen, click on ‘`Try the Computer Vision API`’.\
    \ We then need to select the subscription type.\n\nOnce we get the subscription\
    \ keys we can leverage them to invoke the API from custom code.\n\n![](images/Figure-1.18.jpg)\n\
    \n**Figure 1.18:** Subscription keys\n\nWe will explore some of the use cases\
    \ that use Azure Vision APIs.\n\n# [Use cases](#toc.xhtml#s12a)\n\nAzure Vision\
    \ APIs can be used in a myriad of enterprise scenarios that leverage Image Classification,\
    \ Object Detection, Emotion / Sentiment Analysis. Sentiment analysis can be used\
    \ to analyze the sentiment.\n\nHere are two examples:\n\n*   **Smart Image Classification\
    \ and Object Detection**: Images can be classified as good or bad based on image\
    \ classification. This can be useful in use cases such as traffic jams, sending\
    \ traffic alerts, monitoring homes, and safety solutions.\n\n*   Insurance companies\
    \ can use smart image classification to classify images and guide insurance agents\
    \ on the right premium amount. \n\n    ![](images/Figure-1.19.jpg)\n\n    **Figure\
    \ 1.19:** Use case for Insurance\n\n*   **Smart Security**: A Face Detection API\
    \ can be leveraged to identify the customer and pull up relevant information such\
    \ as electronic health records for providing the right service. Example scenarios\
    \ could include a patient waiting at a hospital counter or a customer waiting\
    \ at a bank counter. \n\n    Given below is a use case in the hospital/bank counter.\
    \ When a customer comes to the counter, the face can be scanned and the relevant\
    \ record pulled up so that the nurse or teller knows the history of the patient\
    \ before his / her turn comes. This will help in reducing the wait time.\n\n \
    \   ![](images/Figure-1.20.jpg)\n\n    **Figure 1.20:** Use case in the hospital\
    \ counter\n\n*   **Emotion Analysis** can help organizations to understand how\
    \ their product/services are received by their customers and help them improve\
