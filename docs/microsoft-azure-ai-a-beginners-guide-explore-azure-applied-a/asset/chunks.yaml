    # Microsoft Azure AI：初学者指南


    ![](img/line.jpg)


    # 通过实际示例探索 Azure 应用 AI 服务、Azure 认知服务以及 Azure 机器学习


    ![](img/line.jpg)


    # Rekha Kodali


    # Sankara Narayanan Govindarajulu


    # Mohammed Athaulla


    ![](img/logo.jpg)


    [www.bpbonline.com](http://www.bpbonline.com)


    **2022 年第一版**


