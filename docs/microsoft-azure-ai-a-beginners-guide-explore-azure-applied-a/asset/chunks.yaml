    LinkedIn 档案：`https://www.linkedin.com/in/eranki/`


    # 致谢


    `Rekha Kodali`: 我想感谢并感谢导师 Venkata Guru Prasad Kandarpi 和 Hari Kishan Burle 提供的指导、灵感和支持。感谢我的孩子们（Sireesh
    和 Tarun）、我的兄弟们、Sarath 以及我的丈夫的支持。


    `Sankara Narayanan Govindarajulu`: 感谢家人、朋友、同事和评审人员，他们的支持和灵感让这一切成为可能。


    `Mohammed Athaulla`: 我非常感谢我的父母、妻子和儿子（Zayan）。没有他们的支持，这一切将是不可能的。


    # 前言


    近几年证明，AI 正在迅速成为各种规模组织的“新常态”。各各的组织正在为未来重新调整其战略和投资，将 AI 成为首要任务之一。本书的目的是是提供实用的指导方，如果你是
    CTO/架构师/设计师/顾问/开发者，甚至是 AI 旅程中的初学者，这些指南可能对你有所帮助。我们相信这本书将让你轻松学习 `Azure AI` 概念，并涵盖了
    `Azure AI` 的基础及一些高级概念。本书分为 8 章节。对 `Azure AI` 开发感兴趣的软件专业人士将从中受益。


    `第 1 章` 为 `Azure`提供的构建 AI 应用程序的服务/组件进行了基础介绍，包括 `Azure Cognitive Services` 和 `Azure
    Computer Vision`。阅读本章后，读者将能够理解 `Azure AI Platform`、`Azure Cognitive Services`
    的核心概念以及 `Azure Computer Vision` 中的各种服务。


    `第 2 章` 介绍了用于开发自定义应用的 `Azure Vision APIs`，这些应用可用于图像处理、人脸识别和物体检测。阅读本章后，读者将掌握利用
    `Image Analytics`、`Content Moderation`、`Object Detection`、`Face Recognition` 和
    `Custom Vision Services` 有效构建应用的技能。


    `第 3 章` 介绍了 `Handwriting Recognition`（手写识别）、`Optical Character Recognition`（光学字符识别）、`Face
    API` 和 `Spatial Analysis`（空间分析）。阅读本章后，读者将掌握通过利用 `Handwriting Recognition`、`Optical
    Character Recognition`、`Face API` 和 `Spatial Analysis` 有效构建应用的技能。


    `第 4 章` 探索了如何在应用程序中使用 Decision（决策）、`Language`（语言）、`Speech`（语音）和 `Web Search`（网络搜索）。阅读本章后，读者将理解如何有效利用每个
    `APIs` 来构建应用程序。


    `第 5 章` 让读者理解 `Azure Applied AI Services`。我们将深入探讨一下 `Azure Form Recognizer`、`Azure
    Metrics Advisor`、`Azure Cognitive Search`、`Azure Immersive Reader` 以及用于媒体的 `Azure
    Video Analyzer for Media`。在本章结束时，读者将理解如何有效利用这些服务。


    `第 6 章` 带领读者了解 `Microsoft Bot Landscape`，包括在对 Bots 及其多年来的演变进行简要介绍后，介绍 `Bot Framework`
    和 `Bot Framework Composer`。我们将查看 `Bot Framework` 提供的不同选项、最佳实践和场景，一个使用 `QnA` 的
    `Bot Framework` 简单示例，并包含 `NLP` (`LUIS`) 能力，还将了解如何使用 `Bot Emulator`、`Bot Composer`
    及其特征在本地开发/调试 Bots，并提供一个快速示例。


    `第 7 章` 介绍了 `ML.NET`。读者将学习如何利用 `ML.NET`，这是一个跨平台的开源机器学习框架。阅读本章后， 读者将理解如何开发 `ML
    model`（机器学习模型）并将其暴露为 `API` 或网络服务。读者还将理解如何从 `.NET` 代码调用它。


    `第 8 章` 介绍了 `Azure Machine Learning Studio`。读者将学习创建模型、对模型评分和运行实验，并学习 `Accord Framework`。读者将获得
    `ML Ops` 的视角以及从经典 `ML Studio Azure Designer` 迁移的简要概述。


    # 代码包与彩色图片


    请点击链接下载本书的 `Code Bundle` 和 `Coloured Images`：


    # [`rebrand.ly/137e75`](https://rebrand.ly/137e75)


    本书的代码包也托管在 GitHub 上，地址为 `[`github.com/bpbpublications/Microsoft-Azure-AI-A-Beginner-s-Guide`](https://github.com/bpbpublications/Microsoft-Azure-AI-A-Beginner-s-Guide)`。如果代码有更新，将在现有的
    GitHub 仓库中更新。


    我们在丰富的书籍和视频目录中提供了代码包，地址见 `[`github.com/bpbpublications`](https://github.com/bpbpublications)`。欢迎去查看！


    # 勘误表


    我们对 BPB Publications 的工作非常自豪，并遵循最佳实践以确保内容的准确性，为我们的订阅者提供享受的阅读体验。读者是我们的镜子，我们利用他们的反馈来反映并改进出版过程中可能出现的人为错误。为了让我们保持质量并帮助我们联系任何因不可预见错误而遇到困难的读者，请通过以下邮箱联系我们：


    `errata@bpbonline.com`


    BPB Publications 全体非常感谢您的支持、建议和反馈。


    您知道 BPB 为出版的每本书都提供 eBook 版本，并提供 PDF 和 ePub 文件吗？您可以在 `[www.bpbonline.com](http://www.bpbonline.com)`
    升级到 eBook 版本。更多详情请联系我们：`business@bpbonline.com`。


    在 `www.bpbonline.com.bonline.com` 上，您还可以阅读免费技术文章合集，订阅一系列免费新闻邮件，并接收 BPB 书籍的独家折扣和优惠。


    # 版权


    如果您在互联网上发现我们作品的任何形式非法副本，如果您能向我们提供地址或网站名称，我们将不胜感激。请通过 `business@bpbonline.com`
    联系我们并提供链接。


    # 如果您兴趣成为作者


    如果您在某个领域拥有专业知识，并兴趣编写或贡献书籍，请访问 `www.bpbonline.com.bonline.com`。我们与成千上万像您这样的开发者和技术专业人士合作，帮助他们将见解分享给全球技术社区。您可以提交通用申请、申请我们正在募作者的热门主题，或提交自己的想法。


    # 评论


    请留下评论。在您阅读并使用这本书后，为什么不在您购买的网站上留下评论呢？潜在读者可以查看并参考您的无偏见意见做出购买决策。我们 BPB 可以了解您对产品的看法，我们的作者也可以看到他们对书籍的反馈。谢谢！


    更多关于 BPB 的信息，请访问 `www.bpbonline.com.bonline.com`。


