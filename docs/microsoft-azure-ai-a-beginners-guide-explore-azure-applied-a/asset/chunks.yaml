    \ the key talking points in the input text. The service uses Microsoft Office’s\
    \ sophisticated Natural Language Processing toolkit. Languages supported include\
    \ Spanish, German, English and Japanese.\n2.  `Language Detection API`: The `Language\
    \ Detection API` takes text documents as input and returns language identifiers.\
    \ Number of languages supported is 120. This capability is useful in scenarios\
    \ in which the language is unknown.\n3.  `Entity Identification API`: The `Named\
    \ Entity Recognition API` takes a `JSON` document and returns a list of entities\
    \ with links to more information on the web.\n\n## Use Case Scenarios\n\nThe below\
    \ are sample use case scenarios in which `Azure Cognitive Text Analytics` is combined\
    \ with `Sentiment Analysis`, `Key Phrase Extraction API` and other APIs. \n\n\
    *   **Analyze Feedback results**: Analyze the feedback from a session etc. using\
    \ `Azure Cognitive Services Text Analytics`. The following shows how we can analyze\
    \ feedback and store in `Azure storage` and display reports in the portal.\n \
    \   ![](images/Figure-4.13.jpg)\n    **Figure 4.13:** Analyze Feedback results.\n\
    *   **Process and categorize support incidents**: Using `Key Phrase Extraction`\
    \ and `Entity Recognition` we can process requests to route the requests to the\
    \ right support engineers. We can also automate trend analysis which will help\
    \ in the right planning of resources for resolving the incidents.\n\nWe will look\
    \ into a brief introduction of `Azure Logic Apps` and `Functions` before getting\
    \ into a sample use case.\n\n# Azure Logic Apps and Functions\n\nLet us have a\
    \ brief introduction to `Azure Logic Apps` and `Azure Functions` which we will\
    \ leverage in executing the lab.\n\n*   **Azure Logic Apps** - A Brief Overview\
    \ \n    `Azure Logic Apps` are serverless and scalable applications that are used\
    \ to perform workflows and integration.\n    Characteristics of `Azure Logic Apps`\
    \ are shown below:\n\n![](images/Figure-4.14.jpg)\n\n**Figure 4.14:** Analyze\
    \ Feedback results.\n\n`Logic Apps` can be used to define workflows. They come\
    \ with a set of triggers including `FTP`, `AS2`, `EDI`, and `EDIFACT`. They provide:\n\
    *   `Poll Trigger`: Poll at regular intervals to check for data.\n*   `Push Trigger`:\
    \ Listen to an event.\n*   `Recurrence Trigger`: Triggered at a prescribed schedule.\
    \ \n*   **Templates**: `Logic Apps` come with pre-defined templates and support\
    \ for continuous integration and deployment.\n\n**Azure Functions**: `Azure Functions`\
    \ are serverless and are priced based on their usage. They are pieces of code\
    \ that are written in any language and are invoked by triggers. Characteristics\
    \ of `Azure Functions` are shown as follows:\n\n![](images/Figure-4.15.jpg)\n\n\
    **Figure 4.15:** Create Azure Function\n\nTriggers available in `Azure Functions`\
    \ include:\n*   `HTTP`: RESTful `HTTP` endpoints are triggered when an `HTTP`\
    \ endpoint is requested.\n*   `Timer`: Triggered on a predefined schedule.\n*\
    \   `WebHook`: Triggered when `GitHub` is consumed.\n*   `CosmosDb`: Triggered\
    \ on changes in `CosmosDB`.\n*   `Blob`: Triggered when a file is uploaded in\
    \ `Azure Blob`.\n*   `Storage Queue`: Triggered when a message is added or removed\
    \ from `Azure Queue Storage`.\n*   `EventHub`: Triggered when a registered `Azure\
    \ Hub Event` occurs.\n*   `Service Bus`: Triggered when a `Service Bus` topic\
    \ is updated.\n\n`Bindings`: Are optional and help simplify coding for data input\
    \ and output.\n\n# Lab - Create Logic App using OCR and Text Analytics\n\nWe will\
    \ create a simple application which enables a field worker to upload data he has\
    \ collected offline. Once the image is uploaded the image is stored in `Azure\
    \ Blob Storage`. A logic app that is listening to the event picks up the image\
    \ and runs a workflow, the functionalities of which include applying `OCR`, detecting\
    \ language, detecting key phrases and storing the results. A `Power BI` app shows\
    \ reports as required. The following is the sample scenario addressed by the lab:\n\
    \n![](images/Figure-4.16.jpg)\n\n**Figure 4.16:** Use case Flow Diagram\n\nShown\
    \ below are the detailed steps for performing the experiment for the problem statement\
    \ given above:\n\n**Step 1**: We will obtain `Cognitive Services` API subscription\
    \ for `Text Analytics API` as given below: \nGo to Azure portal and Select `AI\
    \ + Machine Learning` -> `Text Analytics`\n\n**Step 2**: We will create a `Cognitive\
    \ Service` API subscription for `Text Analytics`.\n\n![](images/Figure-4.17.jpg)\n\
    \n**Figure 4.17:** Create Subscription Key\n\n**Step 3**: We will obtain an `OCR`\
    \ subscription key as described in the `Handwriting Recognition Lab`.\n\n**Step\
    \ 4**: We will create a storage account.\n\n![](images/Figure-4.18.jpg)\n\n**Figure\
    \ 4.18:** Create Storage Account\n\nOnce `Validation` is passed, select `Create`.\n\
    \n![](images/Figure-4.19.jpg)\n\n**Figure 4.19:** Create Storage Account\n"
  trans: "\n\n*   `QnAMaker`: 是一种基于云的`自然语言处理` (`NLP`) 服务，允许用户创建自然对话层。可以利用 `QnAMaker`\
    \ 根据常见问题解答（FAQs，自定义知识库）为聊天机器人回答问题。\n*   `Translator`: `Translator` 可用于实时将一种语言翻译成另一种语言，支持超过\
    \ 90 种语言。\n\n![](img/Figure-4.7.jpg)\n\n**图 4.7:** 异常检测用例 – 语言服务 – `LUIS`（源）\n\
    \n在上方图中，`LUIS` 帮助聊天机器人识别与用户对话相关的意图和实体。\n\n![](img/Figure-4.8.jpg)\n\n**图 4.8:**\
    \ 语言服务 – `QnA Maker` \n\n([-`https://docs.microsoft.com/en-us/azure/cognitive-services/qnamaker/media/qnamake`](https://docs.microsoft.com/en-us/azure/cognitive-services/qnamaker/media/qnamake))\
    \ \n\n这是一个 `QnA Maker` 的示例，用于创建一个 FAQ 聊天机器人，该机器人可以根据可用输入回答用户的问题。\n\n现在我们已经对这些服务有了简要概述，我们将详细介绍\
    \ `Text Analytics API`。\n\n# 文本分析 (Text Analytics)\n\n`Text Analytics API` 是 `Language\
    \ API` 的一部分。它提供了基于自然语言的处理 API 来处理原始文本。我们可以将 `Text Analytics` 与 `Handwriting`（手写）、`OCR\
    \ API` 结合构建智能业务应用程序。它提供了以下功能\n\n![](img/Figure-4.9.jpg)\n\n**图 4.9:** Text Analytics\
    \ API。\n\n可以如下所示方式调用 `Text Analytics API`：\n\n![](img/Figure-4.10.jpg)\n\n**图\
    \ 4.10:** Text Analytics API 的调用\n\n我们可以使用 `Sentiment Analysis API` 对讨论论坛、评论和社交媒体中的文本和关键词汇进行情感分析。目前支持的语言包括英语、西班牙语、德语和法语。\n\
    \n![](img/Figure-4.11.jpg)\n\n**图 4.11:** 情感分析 API。\n\n接下来的图显示了我们如何使用文本和情感分析来检查其是正面情感还是负面情感。\n\
    \n调用 `Sentiment Analysis API`：\n\n*   输入应以 `JSON` 文档的形式提供。\n*   每个文档的大小必须少于 5,120\
    \ 个字符。\n*   每个集合限制为 1,000 个 (IDs)。\n\n![](img/Figure-4.12.jpg)\n\n**图 4.12:**\
    \ 调用情感分析 API。\n\n1.  `Key Phrase Extraction API`（关键词提取 API）：我们可以使用 `Key Phrase\
    \ Extraction API` 提取一组字符串，表示输入文本中的关键论点点。该服务使用了 Microsoft Office 先进的自然语言处理工具包。支持的语言包括西班牙语、德语、英语和日语。\n\
    2.  `Language Detection API`（语言检测 API）：`Language Detection API` 以文本文档作为输入并返回语言标识符。支持的语言数量为\
    \ 120 种。这种能力在语言未知的的情况下非常有用。\n3.  `Entity Identification API`（实体识别 API）：`Named\
    \ Entity Recognition API` 获取 `JSON` 文档并返回实体列表，带有网上更多信息的链接。\n\n## 用例场景\n\n以下是 `Azure\
    \ Cognitive Text Analytics` 与 `Sentiment Analysis`（情感分析）、`Key Phrase Extraction\
    \ API`（关键词提取 API）和其他 API 结合的示例用例场景。\n\n*   **分析反馈结果**：使用 `Azure Cognitive Services\
    \ Text Analytics` 分析来自会议等的反馈。下面显示了我们如何分析反馈并将其存储在 `Azure storage` 中，并在门户中显示报告。\n\
    \    ![](img/Figure-4.13.jpg)\n    **图 4.13:** 分析反馈结果。\n*   **处理并分类支持事件**：使用 `Key\
    \ Phrase Extraction`（关键词提取）和 `Entity Recognition`（实体识别），我们可以处理请求并将请求路由到正确的支持工程师。我们还可以自动化趋势分析，这将有助于为解决事件进行合理的资源规划。\n\
    \n在进入示例用例之前，我们将简要介绍 `Azure Logic Apps` 和 `Functions`。\n\n# Azure Logic Apps 和\
    \ Functions\n\n让我们要介绍一下我们将在实验中利用的 `Azure Logic Apps` 和 `Azure Functions`。\n\n\
    *   **Azure Logic Apps - 简述** \n    `Azure Logic Apps` 是无服务器且可扩展的应用程序，用于执行工作流和集成。\n\
    \    `Azure Logic Apps` 的特征所示所示：\n\n![](img/Figure-4.14.jpg)\n\n**图 4.14:** 分析反馈结果。\n\
    \n`Logic Apps` 可用于定义工作流。它们带有一组触发器，包括 `FTP`、`AS2`、`EDI` 和 `EDIFACT`。它们提供了：\n* \
    \  `Poll Trigger`（轮询触发器）：定期轮询以检查数据。\n*   `Push Trigger`（推送触发器）：监听事件。\n*   `Recurrence\
    \ Trigger`（周期触发器）：按指定的计划触发。\n*   **模板**：`Logic Apps` 带有定义的模板。\n\n**Azure Functions**：`Azure\
    \ Functions` 是无服务器的并根据使用量付费。它们是用任何语言编写的代码段，由触发器调用。`Azure Functions` 的特征所示：\n\n\
    ![](img/Figure-4.15.jpg)\n\n**图 15:** 创建 Azure Function\n\n`Azure Functions` 可用的触发器包括：\n\
    *   `HTTP`：当请求 RESTful `HTTP` 端点时触发。\n*   `Timer`（定时器）：按预定义的计划触发。\n*   `WebHook`：当消费\
    \ `GitHub` 时触发。\n*   `CosmosDb`：当 `CosmosDB` 发生变化时触发。\n*   `Blob`：当 `Azure Blob`\
    \ 上传文件时触发。\n*   `Storage Queue`：当 `Azure Queue Storage` 中添加或删除消息时触发。\n*   `EventHub`：当发生注册的\
    \ `Azure Hub Event` 时触发。\n*   `Service Bus`：当更新 `Service Bus` Topic 时触发。\n\n`Bindings`（绑定）：可选的，有助于简化输入输出的代码。\n\
    \n# 实验 - 使用 OCR 和文本分析创建 Logic App\n\n我们将创建一个简单的应用程序，允许现场工作人员上传离线收集的数据。一旦上传，图像将存储在\
    \ `Azure Blob Storage` 中。监听事件的逻辑应用获取图像并运行工作流，其功能包括应用 `OCR`、检测语言、检测关键词并存储结果。`Power\
    \ BI` 应用显示报告。以下是实验解决的示例场景：\n\n![](img/Figure-4.16.jpg)\n\n**图 4.16:** 用例流程图\n\n\
    下面显示了执行上述问题问题的详细步骤：\n\n**步骤 1**：我们将如下所示获取 `Text Analytics API` 的 `Cognitive Services`\
    \ 订阅：\n进入 Azure 门户并选择 `AI + Machine Learning` -> `Text Analytics`\n\n**步骤 2**：我们将为\
    \ `Text Analytics` 创建 `Cognitive Service` 订阅。\n\n**步骤 3**：我们将按照`手写识别实验`中的描述获取\
    \ `OCR` 订阅密钥。\n\n"
