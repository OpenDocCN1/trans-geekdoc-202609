- raw: "3.  **Highlight Parts of Speech**: It can highlight parts of speech\n\n4.\
    \  **Read Content Aloud**: It allows users to select text to read out loud\n\n\
    5.  **Translate Content in real time**: It helps in real time translation of text\
    \ into many languages\n\n6.  **Split words into Syllables**: It can help in breaking\
    \ words into syllables\n\n# [Azure Video Analyzer for Media](#toc.xhtml#s63a)\n\
    \nVideo Analyzer for Media helps users with getting detailed insights on videos\
    \ which include summarized insights that provide an aggregated view of faces,\
    \ emotions, and topics. These insights can be used for content creation such as\
    \ trailers, enhancing search across a video library, providing relevant ads based\
    \ on extracted insights, content moderation, and recommendations.\n\nIt also helps\
    \ in extracting insights from videos and enhancing content delivery experiences\
    \ by detecting faces, spoken words, emotions and characters. Recommendations can\
    \ be added and clips can be highlighted thus improving the engagement levels.\
    \ Furthermore, workflows can be triggered when the Video Analyser sees, detects\
    \ or hears what the user is looking for.\n\nThis helps with face detection, celebrity\
    \ identification, custom face recognition, thumbnail extraction, visual text recognition,\
    \ object identification, visual content moderation, shot detection, black frame\
    \ detection, key frame detection, audio analysis, keyword extraction, topic inference,\
    \ sentiment analysis, emotion detection, speech to text conversion, language detection,\
    \ noise reduction, speaker identification, and speaker statistics.\n\nSome of\
    \ the scenarios where insights provided by Video Analyser are given as follows:\n\
    \n![](images/Figure-5.4.jpg)\n\n**Figure 5.4:** Azure Video Analyzer for Media\
    \ \n\n*   **Deep search**: Insights provided by Azure Video Analyser can help\
    \ enhance the search experience.\n\n*   **Content creation**: We can use social\
    \ media content, highlight reels, or news clips and create trailers based on the\
    \ insights Video Analyzer for Media provides.\n\n*   **Accessibility**: The transcription\
    \ and translation provided by Video Analyzer for Media can be used to enable accessibility\
    \ to users.\n\n*   **Monetization**: By delivering relevant ads, Video Analyzer\
    \ for Media can be leveraged to help increase the value of videos and create revenue\
    \ opportunities.\n\n*   **Content moderation**: We can use content moderation\
    \ to alert users or block objectionable content/videos thus making the content\
    \ safe.\n\n*   **Recommendations**: By highlighting the relevant video moments\
    \ to users video insights can be used to improve user engagement.\n\nThe diagram\
    \ below gives a view on how Azure Media Analyser works:\n\n![](images/Figure-5.5.jpg)\n\
    \n**Figure 5.5:** Azure Immersive Reader\n\nImage from: **[https://docs.microsoft.com/en-us/azure/azure-video-analyzer/video-analyzer-for-media-docs/video-indexer-overview](https://docs.microsoft.com/en-us/azure/azure-video-analyzer/video-analyzer-for-media-docs/video-indexer-overview)**\n\
    \n*   Video / Audio Insights \n\n    The following table describes in detail the\
    \ features provided by Video / Audio Indexer.\n\n    | **Feature** || **Description**\
    \ |\n\n    | --- | --- |\n\n    | Face detection || Helps detect faces and group\
    \ faces in the video |\n\n    | Celebrity Detection || Helps identifying celebrities\
    \ in the video |\n\n    | Account-based face identification || Helps identify\
    \ faces based on a trained model  |\n\n    | Thumbnail extraction for faces ||\
    \ Helps identify the best face in a group of faces captured |\n\n    | Visual\
    \ text recognition  || Helps identify text in videos using OCR |\n\n    | Visual\
    \ content moderation || Helps moderate content  |\n\n    | Labels identification\
    \ || Helps identify objects and actions in a video |\n\n    | Scene segmentation\
