    application/octet-stream\");\n                responseMessage = await client.PostAsync(url,\
    \ content);\n            }\n            Console.WriteLine(\"\\n 响应:\\n\\n{0}\\\
    n\", JToken.Parse(await responseMessage.Content.ReadAsStringAsync()).ToString());\n\
    \        }\n\n        private static byte[] GetPictureAsByteArray(string filePath)\n\
