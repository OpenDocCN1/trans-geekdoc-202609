- raw: '**Conversation as a Service** (**CaaS**) and **Conversational User Interfaces**
    (**CUI**) has been in the market for a while. Every successful application, irrespective
    of the interface medium would have one thing in common for sure - a great user
    experience. With Bots, this doesn’t change and hence creating a good conversational
    user experience is imperative.


    And the Bot offerings from Microsoft has made life of developers easier to build,
    integrate and deploy bots.


    Bots could serve customer scenarios, internal or external. In the internal world,
    they could empower users to search for knowledge, documents and also seek help
    by acting as a virtual helpdesk for employees and users. In the external world,
    Bots can find their way in enterprises not only for simple customer scenarios
    such as Enquiries, Booking etc., but also advanced ones such as Account management,
    Payments, Retail etc.


    Let us look at the details, we will start with what Bot Framework has to offer,
    and quickly run through the Emulator along with a demo bot, and we will discuss
    Bot Framework Composer.


    # [The Bot Ecosystem](#toc.xhtml#s74a)


    Microsoft offers The Bot Framework as the underlying platform for building bots.
    Azure Bot Service is an Azure service that helps in hosting bots on Azure and
    provides features such as connectivity and authentication. It is important to
    understand this difference between Bot Framework and the Bot Service. In addition
    to the Bot Framework which is the underlying, Microsoft has other offerings such
    as the “*Bot Composer*” and “*Power Virtual Agents*” built on top of the Bot Framework
    that provide readily available interfaces and functions to quickly develop applications.


    Here is a quick view of how the Bot landscape looks with the different services
    made available by Microsoft:


    ![](images/Figure-6.1.jpg)


    **Figure 6.1:** Bot landscape


    # [The Bot Framework](#toc.xhtml#s75a)


    Microsoft Bot Framework provides just what you need to build and connect intelligent
    bots. The Framework implements standard protocols and provides beautiful tools
    to help model conversations. It also provides UI across multiple canvases and
    the adaptive cards rock. With Cognitive services integration, it becomes easy
    to enable Bots with common and well understood patterns and build intelligence
    into them.


    Bots have to be designed keeping the user interface requirements in mind and users
    have to type or speak as less as possible to get to what they need. Some key considerations
    while designing a bot are not related to its intelligence but about how better
    it makes the user experience are as follows:


    *   **Discoverability**: How easily can customers find the bot and start using
    it? Does it support multiple platforms?


    *   **Usability**: Number of steps to address a user’s problem.


    *   **Productivity**: Time taken to solve the situation versus other mediums of
    communication.


    *   **Common Patterns**: Bots are great friends to humans, and everyone looks
    at a use case to bring in bots. Let us take a look at the most common patterns
    where they get used the most.


    *   **Task automation**: Bots can perform simple to complex tasks, A simple example
    could be a user password reset while more complex business processes such as customer
    order processing are termed as **Robotic Process Automation** (**RPA**). Interestingly,
    the use of software automation to perform tasks has become popular on social media
    and is called as **Botting**. Some companies provide this as a service to boost
    the following on social media. Instagram uses neural networks to detect botting
    by analyzing word frequency in comments posted and accounts get a “*shadowban*”
    or even deleted.


    *   **Access to knowledge and other content**: Bots can be designed to provide
    information about any topic and it can find and return the information that the
    user has requested by leveraging data from such as relational data in a SQL database,
    JSON data in a NoSQL store, or documents in a document store. They differ from
    a normal chatbot, helping in decision making by training a vast amount of unstructured
    and structured data that produces an expert response.


    *   **Human hand-off**: Bots could be super intelligent, but there are times when
    they do not live in isolation and have to hand over the conversations to humans.
    The most common reasons for a bot + human hybrid scenarios are situations where
    it gets complex to handle, or if the situation is critical and needs to be resolved
    quickly or even simply customer’s choice. In such scenarios, there needs to be
    a hand-off trigger from where a human can take over, with or without wait time
    involved during the transition.


    *   **Bot to web browser and back**: There are scenarios where Bots could send
    a user to a web browser to complete a task and afterwards resume back once the
    task is done. Most typical use case is Authentication and Authorization with services
    like Azure Active Directory to access user’s personal content such as on Office
    365. Performing this redirect to a browser and back is a challenge and often when
    implementing a channel, it is a good practice to offer a built-in HTML window
    that the bot can use to present applications that would otherwise appear in a
    web browser. This keeps the user to within the conversation while still external
    resources can be accessed.


    *   **Websites**: Outside of the standard client applications such as Skype, Teams,
    etc., bots can also exist in a web browser, which is called a “*Web Chat*”. Instances
    like where websites would like to engage customers providing them with Information
    or Support, can be Bots embedded in the web site and making it easier for users
    to find information or get support quickly rather than navigate through the site.
    Bots can then hand-off the conversation to a human after taking an initial stab
    at the customer request.


    *   **Apps**: Bots can be integrated with application directly, using the Direct
    Line API. Be it Native mobile applications, Web applications or custom built applications
    that run of computers or devices, Bots can embed themselves into these applications
    and become the first respondents to users and customers.


    # [The Bot Framework Composer](#toc.xhtml#s76a)


    There has to be a tool for everyone, and while Bot Framework SDK is for coders,
    there wasn’t an option for non-coders to work with the Bot Framework. With Bot
    Framework Composer, Microsoft provides an open-source visual designer that helps
    in visual bot development. This tool was release around mid-2020 and Microsoft’s
    Bot Framework Engineering team has provided a tool that enables rapid developments
    of Bots, so that one can spend less time wiring up and provisioning services.
    Do not confuse this with the “*Power Virtual Agents*” which targets the business
    users and citizen developers and is a “*No-Code*” platform as well. The difference
    with Composer is that it still provides you with the robust framework to build
    bots, a middle ground between the Bot Framework SDK that provides total control
    in building your bots, and the Bot Composer that simplifies bot development with
    visual abstraction.


    # Why should you care?


    Built on top of the Bot Framework SDK, Composer IDE helps author bots, and integrate
    cognitive intelligence services, all in a visual experience. This caters to an
    audience who don’t want to code but still want to build bots for their domain
    specific or business use cases using all the bells and whistles that traditional
    developers has at their disposal. Being open source, doing custom builds or, hosting
    in cloud as a “*web application*” is possible. You heard that right, composer
    can run as a web application or as a desktop tool.


    The following tasks can be performed using Bot Composer:'
