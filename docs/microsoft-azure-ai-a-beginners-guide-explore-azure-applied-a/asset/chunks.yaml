    \    *   bf orchestrator:add -t qna --id <kb-id-of-mcdonaldsfaq-qna> -k <qna-subscription-key-of-mcdonaldsfaq-bot>\
    \ --routingName q\\_mcdonaldsfaq \n\n        Once the QNA Knowledge bases are\
    \ add (you can verify the `orchestratorconfig.json`) the proceed with creating\
