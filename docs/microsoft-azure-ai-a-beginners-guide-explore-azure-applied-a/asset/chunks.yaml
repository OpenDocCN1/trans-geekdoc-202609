    \ Portal-Bing Search\n\n### Step 2: The deployment success as given below comes\
    \ up once the resource is deployed:\n\n![](images/Figure-4.31.jpg)\n**Figure 4.31:**\
    \ Deployment Window\n\n### Step 3: Click on `Go To Resource` button and add a\
    \ Search Term and click on `Search`:\n\n![](images/Figure-4.32.jpg)\n**Figure\
    \ 4.32:** Add a Search Term\n\n### Step 4: The Search results appear as follows:\n\
    \n![](images/Figure-4.33.jpg)\n**Figure 4.33:** Search Results Window\n\n### Step\
    \ 5: For programmatic invocation we can get the Key and use it in the code. The\
    \ Key can be obtained as shown below:\n\n![](images/Figure-4.34.jpg)\n**Figure\
    \ 4.34:** Getting the key\n\nNow we will look at Docker Containers.\n\n# Azure\
    \ Cognitive Services containers\n\nIn addition to the cloud version of APIs Azure\
    \ also provides Docker containers that let use the same. This can be deployed\
    \ on-premises, on the edge.\n\nGiven below is a set of containers.\n\n![](images/Figure-4.35.jpg)\n\
    **Figure 4.35:** Available Docker Containers\n\n# Conclusion\n\nIn this chapter,\
    \ we have looked at the basics of using Decision, Language, Speech and Web Search.\
    \ We have also learned about Azure Apps and Azure Functions. In the next chapter,\
    \ we will learn about Applied Services.\n\n# Multiple Choice Questions\n\n# Questions\n\
    \n1. **Which service is used to make good decisions using Decision to analyze\
    \ the data and derive insights.**\n   - Decision\n   - Analyse\n   - Detect\n\
    \   - Insights\n\n2. **Which service can be used to integrate search capabilities\
    \ like News Search, Web Search, Image Search into custom applications?**\n   -\
    \ Decision\n   - Analyze\n   - Web Search\n   - Image Search\n\n3. **Which service\
    \ can be used to identify speeches from the person and identify them accordingly?**\n\
    \   - Speaker Recognition\n   - Speech To Text\n   - Text To Speech\n   - Voice\
    \ Assistant\n\n4. **Which service is used to Gain customer insights with call\
    \ center transcription, improve experiences with voice-enabled assistants, capture\
    \ key discussions in meetings and more.**\n   - Speaker Recognition\n   - Speech\
    \ To Text\n   - Text To Speech\n   - Voice Assistant\n\n5. **Which service is\
