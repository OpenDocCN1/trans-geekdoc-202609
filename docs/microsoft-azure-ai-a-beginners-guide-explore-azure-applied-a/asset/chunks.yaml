    \ an image to grayscale, convert a vector of pixels to `ImageDataViewType`, and\
    \ so on.\n*   Categorical data transformations help convert one or more text columns\
    \ into one-hotencoded vectors and convert one more text columns into hash-based\
    \ one-hot encoded vectors.\n*   Missing values help create a new Boolean output\
    \ column, the value of which is true when the value in the input column is missing\
    \ and create a new output column, the value of which is set to a default value\
    \ if the value is missing from the input column, and the input value otherwise.\n\
    \n## Step 3: Train Model\nWe have to separate data into two sets: training and\
    \ testing. A large portion is used for training while a small portion is used\
    \ for testing. We can minimize the effects of data discrepancies by using similar\
    \ test and training data.\n\nCross-validation is a training and model evaluation\
    \ technique which splits the data into several partitions and trains multiple\
    \ algorithms on these partition to improve the robustness of the training process.\
    \ This is an effective method for training when the datasets are small.\n\n##\
    \ Step 4: Improve Model\nAfter training we test the model whether it is making\
    \ the right predictions. We have to use the `Evaluate` method which produces different\
    \ metrics depending on the task that is performed.\n\nOnce the training is complete,\
    \ we can use the `Save` method to save the trained model to a file leveraging\
    \ the `DataViewSchema` of the input data.\n\nThere are various ways to improve\
    \ the model accuracy:\n\n*   **Reframe the problem**: Reframing the problem statement\
    \ itself might improve the model accuracy.\n*   **Provide more data samples**:\
    \ Providing more data samples improves the model performance.\n*   **Add context\
    \ to the data**: Creating the appropriate context around the data points helps\
    \ algorithms perform better.\n*   **Use meaningful data and features**: Add data\
    \ and features that help reduce noise using techniques like `Permutation Feature\
    \ Importance` (`PFI`).\n\n## Step 5: Using the Model\n![](images/Figure-7.8.jpg)\n\
    \n**Figure 7.8:** Using the Model\n\n### Load Model\nWe can load models that are\
    \ stored locally or remotely. For locally stored models, we have to use the `path`\
    \ of the file as input while for a model which is stored remotely, we have to\
    \ use a `Stream`.\n\n### Make Predictions\nThe prediction pipeline contains both\
    \ the trained model as well as the data pre-processing transformations. We can\
    \ make single or batch predictions. We will now look at some of the samples provided\
    \ by ML.NET.\n\n# Samples\nWe have many samples based on `Ml.NET` which are available\
    \ which include:\n\n![](images/Figure-7.9.jpg)\n\n**Figure 7.9:** Samples\n\n\
    # Lab 1 - Creating Samples using ML.NET - Sentiment Analysis\nIn this lab we will\
    \ create a sample application which will take input and perform sentiment analysis\
    \ and return the result.\n\n## Step 1: Create a .NET Core Console Project\nOpen\
    \ Visual Studio. Select `File` | `New` | `Project` from the menu bar. In the New\
    \ Project dialog, select the Visual C# node followed by the .NET Core node. Then\
    \ select the `Console App (.NET Core)` project template.\n\n![](images/Figure-7.10.jpg)\n\
    \n**Figure 7.10:** Create New Project\n\nIn the `Name` text box, type `AzureAIAnalysis`\
    \ and then select the `OK` button.\n\n![](images/Figure-7.11.jpg)\n\n**Figure\
    \ 7.11:** Configure Project\n\n## Step 2: Install ML.NET NuGet Package\nInstall\
    \ ML.NET NuGet Package by going to ‘Manage Nuget’ packages.\n\n![](images/Figure-7.12.jpg)\n\
    \n**Figure 7.12:** Install ML.NET Package\n\n## Step 3: Add model class\nAdd a\
    \ model class for sentiment. Sample code is given as follows:\n\n```csharp\ninternal\
    \ class AzureAISentiment\n{\n    [LoadColumn(0)] public string InputSentimentText;\n\
    \    [LoadColumn(1)] [Name(\"Label\")] public bool DetectedSentiment;\n}\n```\n\
    \nAdd a new class `AzureAISentimentPrediction` for output which will be used after\
    \ model training. `PredictedValue` represents a Boolean value that represents\
    \ the sentiment in the string that is passed as input. `PredictedScore` represents\
    \ the raw score calculated by the model `PredictedProbability` represents the\
    \ calibrated score if it represents a positive score.\n\n```csharp\npublic class\
    \ AzureAISentimentPrediction : AzureAISentiment\n{\n    [ColumnName(\"PredictedLabel\"\
    )]\n    public bool PredictedValue { get; set; }\n    public float PredictedProbability\
