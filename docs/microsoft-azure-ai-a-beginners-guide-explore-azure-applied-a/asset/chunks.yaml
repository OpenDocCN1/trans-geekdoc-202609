    ![](images/logo1.jpg)\n\n[www.bpbonline.com](http://www.bpbonline.com/)\n\n# Foreword\n\
    \nAs **Senior Vice President – Everything on Azure Solutions at Avanade Inc**,\
    \ I see Artificial Intelligence (AI) as the core pillar for Digital Transformation\
    \ across all verticals and customer segments. \n\nThe concept of AI has fascinated\
    \ a lot of free thinkers and frightened others. A few refer to AI as a great leap\
    \ towards building future businesses, while some bashes the idea based on fears\
    \ that might lead to human extinction. \n\nWhile AI technologies are still far\
    \ from creating a self-aware and self-evolving AI that might take over the earth,\
    \ for a fact - AI already has a big impact on almost every facet of our lives.\
    \ AI has given businesses across industries a chance to leverage it to build future\
    \ products, services, optimize operations, and drive invaluable insights for improving\
    \ Customer experience and Employee experience. Each year, new developments are\
    \ being made with artificial intelligence and automation that businesses can use\
    \ in various innovative ways. **But guess what, the availability of AI Skilled\
    \ Professionals is one biggest blocker in the accelerated adoption of AI. **\n\
    \nWhat like about this book is that it provides practical guidelines for different\
    \ personas right from CTO level to AI Architect or AI Consultant or a beginner\
    \ AI Developer. This book makes it easy to learn Microsoft Azure AI concepts,\
    \ common use cases, covers the basics and advanced concepts of Azure AI. The book\
    \ is well structured and covers a vast number of Azure AI and PaaS capabilities.\
    \ The best way to learn new technology is to try your hands on developing simple\
    \ apps and writing the code. This book helps with addressing that aspect with\
    \ well-explained working code samples. \n\nI enjoyed the chapter covering the\
    \ basics of the Azure AI platform, and concepts of the Azure AI ecosystem and\
    \ services. This is a must-read book if you want to learn about Azure Cognitive\
    \ Services, Azure Computer Vision, Azure Applied AI Services, and Azure Machine\
    \ Learning with practical examples to build intelligent applications in the domain\
    \ of Image Processing, Object Detection, Text Recognition, OCR, Spatial Analysis\
    \ and Face Recognition.\n\nDo not forget to test your knowledge against well-crafted\
    \ Multiple-Choice questions at the end of each chapter. Nice to reinforce the\
    \ learning objective. \n\nBook also provides technical content and insights Azure\
    \ Applied AI Services like Azure Form Recognizer, Azure Metrics Advisor, Azure\
    \ Cognitive Search, Azure Immersive Reader, Azure Video Analyzer for Media, and\
    \ Azure Bot Service.\n\nBooks do a great job in developing a good understanding\
    \ of BoT development options, BOT Framework, how to leverage Bot Framework Emulator,\
    \ NLP capabilities to enhance conversational interfaces. \n\nFrom me bonus, part\
    \ of the book is the concluding chapter, which covers concepts about infusing\
    \ ML in Custom Applications using ML.NET. \n\nPerhaps the most remarkable thing\
    \ about this book is that it provides an AI practitioner perspective and structured\
    \ approach to learning Azure AI. \n\nBy the end of this book, I am sure, you would\
    \ have immersed yourself with practical experience of working with Azure AI, Azure\
    \ ML services, and APIs and tools available in the Azure AI Platform.\n\nWishing\
    \ the authors all the very best for this new endeavor. \n\n![](images/Gaurav-Signature.jpg)\n\
    \nGaurav Aggarwal\n\n# Dedicated to\n\n*My Parents*\n\n***Dr. Vaikunta Rao***\n\
    \n*&*\n\n***Ramamani***\n\n*—Rekha*\n\n# About the Authors\n\n**Rekha Kodali **is\
    \ a Principal Director in Accenture. With more than 23 years of experience in\
    \ Microsoft Technologies, her focus areas include Azure, Enterprise Architecture,\
    \ Microservices, Solution Architecture, Presales and Innovation. She has been\
    \ instrumental in creating differentiated solutions and service offerings. Her\
    \ certifications include TOGAF, IASA certified Foundation Architect and Azure\
    \ Solutions Architect Expert and several other MS certifications. She has published\
    \ multiple research papers. \n\nShe is the author of a book: **Developing Cloud\
    \ Native Applications In Azure Using .Net Core: A Practitioner's Guide to Design,\
    \ Develop and Deploy Apps **Paperback – 1.\n\nLinkedIn Profile: **[https://www.linkedin.com/in/rekha-kodali-3561201b/](https://www.linkedin.com/in/rekha-kodali-3561201b/)**\n\
    \n**Sankara Narayanan Govindarajulu **is a Solution Architect at Microsoft, helping\
    \ with partners and customers on their digital transformation journey. Throughout\
    \ his career of 23 years, Sankara has put his profound experience along with his\
    \ passion in compelling ways to help customers in strategic decision making, project\
    \ execution, architecture and design, and development of enterprise solutions\
    \ covering various aspects such as availability, performance, security, business\
    \ continuity, cloud migration and transformation across platforms and technologies.\
    \ Sankara is TOGAF certified, and has certifications in Azure Migration, Architecture,\
    \ Development and Security. He has published a book, a few journals and presented\
    \ in internal technical conferences on multiple occasions. \n\nHis LinkedIn Profile:\
    \ **[https://www.linkedin.com/in/sankara-narayanan-g/](https://www.linkedin.com/in/sankara-narayanan-g/)**\n\
    \n**Mohammed Athaulla **is a Lead developer at Wipro Technologies with more than\
    \ 10 years of experience in Microsoft technologies. He has hands-on experience\
    \ in development and customization of software applications using various technologies\
    \ such as Azure, ASP.net core MVC, Web API, Angular, JavaScript, SQL Server etc.\
    \ He led the development of a large AI based solution. \n\nHis LinkedIn Profile\
    \ is **[https://www.linkedin.com/in/athaulla/](https://www.linkedin.com/in/athaulla/)**\n\
    \n# About the Reviewer\n\n**Suryanarayana Murty Eranki **has 24 years of practice\
    \ leadership in architecting & delivering cloud solutions, with significant experience\
    \ in IT software. He is an accomplished and technically sophisticated leader with\
    \ proven success in architecting and implementing large, complex, and business\
    \ critical technology projects across the project life cycle. As a Cloud solutioning\
    \ expert, helping enterprises adopt public cloud platforms such as Microsoft Azure,\
    \ Amazon Web Services and Google. He has worked with companies like Wipro, Tech\
    \ Mahindra, Cognizant, Genpact and currently he is leading a Cloud consulting\
    \ boutique, Apware - Hyderabad as an Executive Director to deliver Microsoft Azure\
    \ and AI/ML focussed solutions to their customers. "
