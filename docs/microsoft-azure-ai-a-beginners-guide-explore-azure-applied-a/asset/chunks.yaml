  trans: '

    利用在前章节中开发的 `BasicBot`，让我们为它添加自然语言处理功能，并添加第二个知识库，以便展示机器人如何通过分发器（dispatcher）来路由请求。机器人基本上变成了一个
    `dispatcher`。


    # 添加 LUIS 模型


    利用预构建的 `Reservation` 领域创建一个 LUIS 模型，为了我们的目的，我们将选择几个可用的 `reservation` 模型 - `RestaurantReservation.FindEntry`。将
    LUIS 应用命名为 `BasicBot`。


    # 添加第二个 QnA 知识库


    在上一节创建的 `BasicBot` 节中，我们已经创建了一个知识库（KB）。让我们添加第二个知识库，这次我们将选择来自知名餐厅 Olive Garden
    的 FAQ。FAQ 来源将使用此处的内容。你可以参考上一章节查看关于在 QnA 中创建知识库的步骤说明。


    # 使用 Bot Framework Orchestrator 创建分发模型


    过去，当使用多个 LUIS 和 QNA 应用时，Microsoft Bot Framework 使用分发工具进行 `Dispatching Model`。请求会被分发到正确的目的地。该工具现在已弃用，并被作为
    Bot Framework CLI 一部分的 Bot Framework Orchestrator 所取代。Orchestrator 为分发提供了一个直接的解决方案，它使用了
    `language understanding`，同时简化了建模过程，消除了对神经网络或 `NLP` 领域的深度专业知识。让我们开始使用 Orchestrator
    来了解请求是如何分发的。


    1. 首先在命令行或 PowerShell 中使用 `npm` 命令安装 Bot Framework CLI。

    ```bash

    npm i -g @microsoft/botframework-cli

    ```

    2. 你可以使用 `bf` 命令验证 CLI 的安装情况。本文编写时的版本为 4.15.0。一旦创建，你就可以通过添加 LUIS 应用模型和 QnA Maker
    知识库作为 Orchestrator 数据源来开始准备 Orchestrator。

    3. 通过添加你的 LUIS 模型和 QnA 库来准备 orchestrator。

    ```bash

    bf orchestrator:add -t luis --id <luis-id> --endpoint <endpoint> -k <key> --routingName
    reservation

    ```

    LUIS 编写应用将根据提供的端点和应用 ID 添加到 orchestrator 中。此时你可以检查 `orchestratorsettings.json`
    文件，该文件已填充了应用信息。

    4. 同样将 QnA Maker 知识库添加到 orchestrator 设置中。

    ```bash

    bf orchestrator:add -t qna --id <kb-id> -k <key> --routingName mcdonaldsfaq

    ```

    一旦添加了 QNA 知识库（你可以验证 `orchestrator.json`），即可继续为 orchestrator 创建语言模型。

    5. 下载基础模型并使用之前添加的 LUIS 和 QNA 库创建快照。

    ```bash

    bf orchestrator:basemodel:get --out model

    bf orchestrator:create --in CognitiveModels --model --out generated

    ```

    你可以看到这为 LUIS 和 QnA 创建了相应的文件，并将 orchestrator 的快照写入 `orchestrator.json`。

    6. 通过运行示例查询来检查模型：

    ```bash

    bf orchestrator:query -i="generated\orchestrator.json" -m=model -q="special hours"

    ```

    7. 在下载的代码中，修改 `appsettings.json` 文件以包含 LUIS 应用和 QnA 知识库的详情。


    注意在在此过程中创建的 3 个文件夹：

    - `model` 文件夹：包含 orchestrator 的基础模型文件。

    - `CognitiveModels` 文件夹：保存了相应应用程序（LUIS、QnA）生成的文件。

    - `generated` 文件夹：包含 orchestrator 快照，包含了所有的意图（intents）、语句（utterances）及其得分。


    这里是解决方案资源器的视图，显示了整个代码库并展开了最重要的部分。


    # 更新 BasicBot 源代码以包含分发支持


    现在我们已经有了 Orchestrator 模型，必须修改机器人源代码以包含分发功能。


    ## IBotService.cs 和 BotServices.cs


    `IBotService` 是定义连接的接口。`BotServices` 是实现 LUIS 和 QnA 的类。


    # ErrorHandlerAdapter


    用于处理机器人遇到的错误的错误处理程序，可以为用户定义自定义的错误消息，而不是直接向他们抛出原始错误信息。

    '
