- raw: "With the sample “*Basic Bot*” that we developed in the earlier chapter, let\
    \ us add natural language processing to it and also add a second knowledge base\
    \ so that we can showcase how the bot is able to route requests with the help\
    \ of dispatcher created routing model. The bot basically now becomes a “*dispatcher*”.\n\
    \n# [Adding a LUIS Model](#toc.xhtml#s92a)\n\nCreate a LUIS Model by leveraging\
    \ the pre-built “*Reservation*” domain models and for our purpose we will choose\
    \ just a few of the reservation models available -\n\n`RestaurantReservation.Confirm\
    \ RestaurantReservation.FindReservationEntry`\n\nName the LUIS app as “*BasicBotLuis*”.\n\
    \n# [Adding a second QnA KB](#toc.xhtml#s93a)\n\nWe already created a KB as part\
    \ of the “*Basic Bot*” we created in the previous section. Let us add a second\
    \ knowledge base and this time we will choose a FAQ from the famous Italian restaurant\
    \ - Olive Garden. The FAQ source we would use is from here.\n\nYou could refer\
    \ to the previous chapter for a step by step on creating a KB in QnA.\n\n# [Creating\
    \ a dispatch model using the Bot Framework Orchestrator](#toc.xhtml#s94a)\n\n\
    In the past, Microsoft Bot Framework used a dispatch tool for the “*Dispatching\
    \ Model*” when multiple LUIS and QNA apps were used. Requests were dispatched\
    \ to the right destination using this dispatch tool. This tool is now deprecated\
    \ and replaced with the Bot Framework Orchestrator which comes as part of the\
    \ Bot Framework CLI.\n\nOrchestrator rather provides a straightforward solution\
    \ for dispatching, it uses “*language understanding*” and at the same time simplifies\
    \ the modelling process that eliminates deep expertise in neural networks or **natural\
    \ language processing** (**NLP**) areas. Existing Bots that use Dispatch tool\
    \ can also be migrated quote easily to switch to the Orchestrator model.\n\nLet\
    \ us get started with the Orchestrator tool to understand how requests are dispatched.\n\
    \n1.  Start by installing the Bot Framework CLI with a `npm` command in the command\
    \ line or PowerShell. \n\n    `npm i -g @microsoft/botframework-cli`\n\n2.  You\
    \ can verify the installation of the CLI by using `bf` command. The version as\
    \ of this writing is 4.15.0. Once created, you can start preparing the Orchestrator\
    \ by adding LUIS application models and the QnA Maker knowledge bases as Orchestrator\
    \ data sources.\n\n3.  Prepare the orchestrator by adding your LUIS Model and\
    \ QnA KB. \n\n    *   bf orchestrator:add -t luis --id <luis-app-id> --endpoint\
    \ <luis-authoring-endpoint> -k <luis-authoring-subscription-key> --routingName\
    \ l\\_reservation\n\n    The LUIS Authoring app is added to the orchestrator with\
    \ the provided endpoint and application id. You can check the `orchestratorsettings.json`\
