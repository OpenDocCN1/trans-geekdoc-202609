    \ language learners, new readers, and people with learning differences.\n\n* \
    \  **Azure Form Recognizer**: It helps in identifying and extracting text, key/value\
    \ pairs, and table data from form documents. It helps in ingesting text from forms\
    \ and outputs structured data that includes the relationships in the original\
    \ file.  \n\n    *   **Azure Video Analyzer for Media**: It helps extract metadata\
    \ such as spoken words, faces etc. from video and audio files.\n\n    *   **Azure\
    \ Cognitive Search**: It leverages built-in AI capabilities that help in identifying\
    \ and exploring relevant content.\n\n    *   **Azure Bot Service**: It helps develop\
    \ conversational AI experiences.\n\nWe will look at each of the services in detail.\n\
    \n# [Azure Metrics Advisor](#toc.xhtml#s61a)\n\nAzure Metrics Advisor helps analyze\
    \ time-series real time data and surface anomalies, and helps derive insights\
    \ and create alerts. The Azure Metrics Advisor automatically applies models on\
    \ the data. It also provides a set of web based workspace and APIs for anomaly\
    \ detection, data ingestion and diagnostics.\n\nAzure Metrics Advisor helps developers\
    \ with capabilities of multi-dimensional metric data ingestion, automatic model\
    \ customization and anomaly detection. The capabilities of the pipeline can be\
    \ easily used by developers to build artificial intelligence for IT operations,\
    \ predictive maintenance, and business metric monitoring solutions.\n\nAzure Metrics\
    \ Advisor helps in the following:\n\n*   Analyze multi-dimensional data from multiple\
    \ data sources\n\n*   Identify and correlate anomalies\n\n*   Configure and fine-tune\
    \ anomaly detection model used on your data\n\n*   Diagnose anomalies and help\
    \ with root cause analysis  \n\n    *   Best model for the data is selected by\
    \ Metrics Advisor\n\n    *   Multi-dimensional metrics can be used to monitor\
    \ time series\n\n    *   Model can be customized using parameter tuning and interactive\
    \ feedback\n\n*   Notification through multiple channels using hooks like email\
    \ hooks, Azure Devops Hooks, Teams hooks, etc.\n\n*   **Analyze Root Cause**:\
    \ Metrics Advisor can combine anomalies detected into a diagnostic tree on the\
    \ same multi-dimensional metric to help analyze root cause.\n\n*   Smart diagnostic\
    \ insights: Smart diagnostic insights enable to help catch abnormal status using\
    \ all metrics which are related \n\nFollowing is a view on how Azure Metrics Advisor\
    \ can be leveraged:\n\n![](images/Figure-5.1.jpg)\n\n**Figure 5.1:** Azure Metrics\
    \ Advisor use cases\n\nAzure Metrics Advisor leverages machine learning to detect\
    \ anomalies, predict future anomalies, and help in development of systems that\
    \ detect and act on anomalies. It can ingest data from a number of data sources,\
    \ leverage the data to build models, tune the models, and use feedback to customize\
    \ the models. It also has the capability to perform root cause analysis with insights\
    \ and recommend appropriate actions.\n\nFollowing is the flow diagram for Azure\
    \ Metrics Advisor:\n\n![](images/Figure-5.2.jpg)\n\n**Figure 5.2:** Azure Metrics\
    \ Advisor Flow Diagram\n\nFollowing are a set of recommendations that are commonly\
    \ used:\n\n1.  **High availability recommendations**: Help ensure the continuity\
    \ of critical applications. High availability recommendations can help in the\
    \ following areas:  \n\n    *   Identify virtual machines not part of an availability\
    \ set and suggest/recommend moving them to an availability set.\n\n    *   Identify\
    \ application gateway instances that are not configured for fault tolerance to\
    \ ensure business continuity of critical applications.\n\n    *   Prevent accidental\
    \ deletion of virtual machine data.\n\n    *   Improve the performance of virtual\
    \ machine disks.\n\n2.  **Security recommendations**\n\n    Advisor integrates\
    \ with Azure Security Center. It provides **security recommendations**, helping\
    \ detect, respond to and prevent security threats.\n\n3.  **Cost recommendations**\n\
    \n    Helps in reducing virtual machine costs and identifying cost-effective solutions\
    \ for managing multiple SQL databases.\n\n4.  **Performance recommendations **help\
    \ improve performance of applications. Performance recommendations can help in\
    \ the following areas: \n\n    *   Improve database performance\n\n    *   Improve\
    \ Redis Cache performance\n\n    *   Improve App Service performance\n\n    Given\
    \ below are the steps for creating a workflow for Azure Metrics Advisor:\n\n \
    \   *   Create an Azure resource for Metrics Advisor\n\n    *   Build monitor\
    \ using web portal\n\n    *   Onboard data\n\n    *   Change configuration for\
    \ anomaly detection to address the specific needs \n\n    *   Subscribe anomalies\
    \ for notification\n\n    *   Diagnostic insights can be viewed\n\n    *   REST\
    \ API can be used to customize instances\n\n# [Azure Immersive Reader](#toc.xhtml#s62a)\n\
    \nAzure Immersive Reader helps in improving comprehension for language learners,\
    \ new readers, and people with learning differences such as dyslexia. It helps\
    \ in making reading easier. Immersive Reader client library can be leveraged to\
    \ improve web applications.\n\nImmersive Reader is a standalone web application\
    \ which can be integrated in a web application in an iframe by invoking the Immersive\
    \ Reader client library. The Immersive Reader client library handles the iframe\
    \ and interaction with the Immersive Reader backend service.\n\nSome of the features\
    \ of the Azure Immersive Reader are listed as follows:\n\n![](images/Figure-5.3.jpg)\n\
    \n**Figure 5.3:** Azure Immersive Reader Features\n\n1.  **Isolate Content**:\
    \ This helps in improving readability\n\n2.  **Display Pictures**: It can display\
    \ pictures for commonly occurring words"
