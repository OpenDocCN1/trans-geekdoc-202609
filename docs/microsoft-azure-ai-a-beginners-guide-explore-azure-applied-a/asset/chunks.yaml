    # Azure Form Recognizer


    Form Recognizer helps extract text and structure from documents. It helps in extracting
    text, key/value pairs, and tables from documents, forms, and receipts using pre-built
    and unsupervised building learning.


    Following models are supported by the Form Recognizer:


    * **General document**: Helps in analysing and extracting tables, text, key value
    pairs, structure, and named entities.

    * **Layout**: Helps in Analyzing and extracting tables, words, lines and selection
    marks in documents and forms documents.

    * **Custom**: Helps in analyzing and extracting form fields and other content
    from custom forms using custom trained models.

    * **Invoices**: Helps in analyzing and extracting common fields from invoices,
    using a pre-trained model for invoice.

    * **Receipts**: Helps in analyzing and extracting common fields from receipts,
    using a pre-trained model for receipt.

    * **ID documents**: Helps in analyzing and extracting common fields from ID documents
    like passports or driver’s licenses, using a pre-trained model for documents.

    * **Business Cards**: Helps in analyzing and extracting common fields from business
    cards, using a pre-trained model for business cards.


    **Prebuilt Models:**


    Analyze and extract data from common document types, using a pre-trained model.

