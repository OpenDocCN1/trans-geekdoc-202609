- raw: "Custom services help in building applications using custom-trained models.\
    \ Product recommendation, fraud detection for transactions, sales prediction are\
    \ some examples of applications that leverage custom services. Azure provides\
    \ an easy to use platform for developing/building, training and deploying custom\
    \ machine learning models using tools like Visual Studio Code, Jupyter Notebooks\
    \ and open source tools like Tensorlfow, PyTorch, and so on. It is also easy to\
    \ embed these as services in custom applications through simple REST API calls.\n\
    \n*   **Use cases for custom services**: Given below are a few use cases where\
    \ custom services can be leveraged \n\n    ![](images/Figure-1.6.jpg)\n\n    **Figure\
    \ 1.6:** Use cases for Custom Services\n\n    *   Provide product recommendations,\
    \ personalized recommendations for medicines, apparel, products, and so on.\n\n\
    \    *   Provide guidance and treatment to patients. Enable personalized suggestions\
    \ and recommendations for checkups, and so on.\n\n    *   Clinicians could proactively\
    \ identify at-risk patients by analyzing their medical records, use data from\
    \ smart devices to provide personalized care.\n\n    *   Fraud identification\
    \ using anomaly detection. Improved operational efficiencies. We can improve operational\
    \ efficiencies by deriving intelligent insights and actions from data collected\
    \ from devices.\n\n    *   Improved safety. By providing insights into shop floor\
    \ activities, the safety and efficacy of equipment can be improved by maintaining.\n\
    \nNow that we have an understanding of AI services we will go a little deeper\
    \ into Azure Cognitive Services.\n\n# [Azure Cognitive Services](#toc.xhtml#s9a)\n\
    \nAzure Cognitive Services provide APIs, SDKs, and services that can be leveraged\
    \ by developers to infuse cognitive intelligence like speech, optical character\
    \ recognition, sentiment analysis, face recognition, video analytics, text analytics\
    \ etc into applications.\n\nAzure Cognitive Services offer a set of machine learning-based\
    \ prebuilt Azure Rest APIs that are hosted in Azure. We can leverage these Azure\
    \ Cognitive Service APIs / services to easily add intelligence into web, mobile,\
    \ desktop applications such as face recognition, voice recognition, emotion, and\
    \ sentiment detection, vision and speech recognition, knowledge, search, and language\
    \ understanding. These APIs are cross-platform and are accessible across devices.\n\
    \nAzure Cognitive Services can be broadly classified into Decision, Language,\
    \ Speech, Vision and Web Search as depicted here:\n\n![](images/Figure-1.7.jpg)\n\
    \n**Figure 1.7:** Azure Cognitive Services\n\nHere is a brief description of different\
    \ services available under Azure Cognitive Services:\n\n*   **Decision Service**:\
    \ Helps build apps that help add recommendations for efficient decision-making.\
    \ Decision Services include Personalizer and Content Moderator.  \n\n    *   **Personalizer\
    \ service**: Personalizer service is a cloud-based service that helps applications\
    \ choose the best content to surface to users and helps in reinforcement learning\
    \ through easy-to-use APIs. Some of the use cases for decision API include Intent\
    \ clarification and disambiguation which help users have a better experience when\
    \ their intent is not clear by providing an option that is personalized. Decision\
    \ API helps provide suggestions for personalized menus and options. \n\n     \
    \   For example, it can be used to suggest a product to shoppers. The application\
    \ can monitor the users’ reaction and send back a reward score to the personalizer\
    \ service thus enabling continuous feedback and improvement of the machine learning\
    \ model, which further enhances the personalizer’s ability to contextualize recommendations.\n\
    \n    *   **Anomaly detector**: Anomaly detector helps in monitoring and detecting\
    \ anomalies. Anomaly detector takes time-series data as input and helps in detecting\
    \ dips, spikes in the data using anomaly detection algorithms. It can be used\
    \ in the cloud or edge and can be customized.\n\n    *   **Content moderator**:\
    \ Content moderator helps in monitoring and detecting offensive content.\n\n*\
    \   **Language service**: Helps build apps that embed conversational language\
    \ understanding. This helps in leveraging intelligence to decipher a users’ conversation\
    \ to retrieve information.\n\nThe following are some of the use cases for leveraging\
    \ language service.\n\n![](images/Figure-1.8.jpg)\n\n**Figure 1.8:** Language\
    \ Service\n\nIt helps in identifying entities and their relationships, better\
    \ understand sentiment and comprehend information much faster. It enables usage\
    \ of domain specific labels and enables conversations with Bots, applications,\
    \ IoT Devices using Natural Language Processing.\n\n*   **Speech service**: Helps\
    \ convert speech into text and text into natural-sounding speech. Speech helps\
    \ in translating from one language to another and enables speaker verification\
    \ and recognition. \n\n    Given below are some of the use cases for leveraging\
    \ Speech Service:\n\n    ![](images/Figure-1.9.jpg)\n\n    **Figure 1.9:** Speech\
    \ Service\n\n    *   **Speech to Text**: Helps translate audio streams to text\
    \ in real time\n\n    *   **Text To Speech**: Helps convert text into synthesized\
    \ speech\n\n    *   **Speech Translation**: Helps enable real time, multi-language\
    \ translation of speech\n\n    *   **Voice Assistants**: Helps empower developers\
    \ to create conversational interfaces to applications\n\n    *   **Speaker Recognition**:\
    \ Helps provide APIs to recognize and identify speakers\n\n    *   **Intent Recognition**:\
    \ Helps recognize speech, entities and intent\n\n*   **Vision Service**: Helps\
    \ in analyzing an image or a video and perform certain analysis and derive insight\
    \ such as recognizing, identifying caption, abusive content, and so on.  \n\n\
    \    *   **Computer Vision**: Provides access to advanced algorithms for processing\
    \ images and returning information.\n\n    *   **Face**: The Face service provides\
    \ access to advanced face algorithms, enabling face attribute detection and recognition.\n\
    \n    *   **Custom Vision Service**: Provides capabilities to build image classifiers.\n\
    \n*   **Web Search**: Helps add Bing Search APIs to apps. Bing Search helps in\
    \ searching information from webpages, images, videos, and news with a single\
    \ API call. Helps provide instant answers to user queries which are easily configured\
    \ to include web pages, images, videos, news, translations as JSON based on search\
    \ relevance and your Bing Web Search subscriptions. It helps in suggesting search\
    \ terms in real time, filter results, localize search results and analyse search\
    \ metrics with Bing Statistics.\n\nIn this book, we will focus on Azure Cognitive\
    \ Services as described above and Azure Applied AI Services. We will start with\
    \ understanding the basics and then get into details on each of the APIs provided\
    \ by Azure Vision API.\n\n# [Azure Vision Service](#toc.xhtml#s10a)\n\nAzure Vision\
    \ Service provides APIs / SDK to analyze images, videos, extract text from images,\
    \ and moderate content in images. We can either leverage the APIs or the SDK.\
    \ Vision APIs help infuse into applications vision capabilities like image processing,\
    \ video analytics, and insights, face recognition and detection capabilities,\
    \ OCR capabilities into applications.\n\nHere is a brief description of each of\
    \ the APIs provided by Azure Vision Service:\n\n![](images/Figure-1.10.jpg)\n\n\
    **Figure 1.10:** Azure Vision Service\n\nWe will now look at each of the APIs\
    \ in detail.\n\n*   **Computer Vision**"
