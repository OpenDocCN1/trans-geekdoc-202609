    \ <myresourcename> with the string found in your endpoint URL`\n\n`private const\
    \ string uriBase =`\n\n`“https://azureaiface1.cognitiveservices.azure.com//face/v1.0/detect”;`\n\
    \n`private static void Main(string[] args)`\n\n`{`\n\n`Console.WriteLine(“Detect\
