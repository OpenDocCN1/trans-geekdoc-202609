    \n    *   bf orchestrator:query -i=”generated\\\\orchestrator.blu” -m=model -q=”special\
    \ hours”\n\n    ![](images/Figure-6.31.jpg)\n\n    **Figure 6.31:** Verify Base\
    \ Model \n\n7.  In the downloaded code, modify the `appsettings.json` file to\
