    Channels are the connection between the bot and communication apps. Bot Service
    Channels can be connected to bots via Azure Portal or using `Azure CLI` command
    line.


    ## Refine


    Post deployment, evaluation involves improving the capabilities and performance
    of the Bots. Use `Bot Analytics` and tools like `Application Insights` to access
    conversation-level reporting on user, message and channel data.


    # Reference Architecture


    A reference architecture shows the possible components that could be used to design
    a solution, while the actual real-world solution for a business problem may not
    use all of the services, or may even incorporate additional services that aren’t
    documented in the reference architecture. This reference architecture for Bots
    depicts the use of Azure Bot Framework and other important services around it
    that builds a complete solution.


    Every bot is is unique, yet there is always a most fundamental perspective that
    can result in any kind of use case – a chat bot, conversational bot, support bot,
    etc. This reference architecture should be a good place to start exploring the
    possibilities and expand them further as requirements evolve.


    The architecture portrays the following key pillars:


    ### Users

    These are the users - internal staff or customers who are users of the bot via
    various channels. Users who prefer to use bots are not expected to understand
    anything about Bots and can converse in natural language of choice by starting
    off with a Hi or even a pressing question for which they have reached out. Bots
    guide users via “guided conversations”, helping them to traverse the whole conversation
    by providing options, and helping them choose one. The goal provide users the
    information/support they need in the best possible time.


    ### Azure Bot Service

    Azure Bot Service enables you to host intelligent, enterprise-grade bots with
    complete ownership and control of customers data. Ideally speaking, you could
    host bots anywhere you want, but the Bot Service in itself enables users to create
    bots from existing templates, host bots in Azure and providing connectivity options
    to connect to various channels, test the bot in a default “Web Chat” etc., amongst
    other features.


    ### Conversational Channels

    Channels are various interfaces via which the bot service can be connected to.
    Some of the common communication channels are Skype, SMS, and email.


    ### Security

    Prior to version 4, Bot framework required inclusion of OAuth controllers to perform
    user token management where the bot would ask the user sign in on a website, and
    use the magic code the user can verify their identity against. With `v4 SDK`,
    there is no need for magic code verification and it is now easier to develop a
    bot that authenticates users to various identity providers, such as Azure AD or
    even other provides such as GitHub etc. All of the security is taken care within
    the Azure Bot Service where you would have to create an Azure AD Application and
    register the app with your bot.


    Some of the best practices should be followed with respect to security are:


    Enabling enhanced authentication options in the Direct Line channel - that allows
    Bots service to detect and reject user id changes thereby avoiding impersonation.
    Specify the trusted domains int he Direct Line configuration page.


    # The Bot Framework Emulator


    Making development much more enjoyable comes with some powerful tools at developer’s
    disposal and Bot Emulator is one of them. The Bot Framework Emulator is an open-source,
    cross-platform application that allows developers to build, test and diagnose
    their conversational applications on local machines or in the cloud. While the
    emulator doesn’t cover all the areas in the workflow outlined above, what it does
    cover pretty well, is planning, testing and refining Bots and it does an excellent
    job at that.


    The emulator works with both local and remote hosted bots and supports the three
    major development platforms – Windows, Linux and OS X.


    The latest version of the emulator is available for download at.


    # Building a Basic Bot


    Let us start with a Basic Bot to demonstrate how it is done and then later we
    would use the Emulator to debug and test it.


    You can use the full version of Visual Studio/ Visual Studio Community or VS Code.


    Start off by going to Command Line or PowerShell and create a new project under
    a new folder `Basic Bot` by using the `dotnet` command line.


    ```

    ![](images/Figure-6.8.jpg

    ```

    **Figure 6.8:** Creating a BasicBot Folder


    This creates a project in the `BasicBot` folder.


    # Creating a QnA KB


    Let us try build QnA Maker into the basic bot, that could handle a question and
    answer session with a user. We are choosing the classic model here and you should
    see a warning that asks you to switch to Question Answering - lets ignore it.
    We would also use the emulator to quickly run through the features and how to
    test the bot locally before it gets deployed to Azure.


    Let’s start off by going creating a knowledge base.


    1. Go to `QnAMaker.ai` and sign in with your Azure account

    2. Click on `Create a knowledge base` to create a knowledge base which should
    open the following screen:


    ```

    ![](images/Figure-6.9.jpg

    ```

    **Figure 6.9:** Creating a Knowledge base


    The page provides with a step by step approach towards creating the knowledge
    base, and follows-up to create a bot:


    ```

    ![](images/Figure-6.10.jpg

    ```

    **Figure 6.10:** Creating a QnA service


    Click on `Create a QnA service` button which will take you to the `QnA Maker`
    creation blade under Cognitive Services, in the Azure Portal.


    ```

    ![](images/Figure-6.11.jpg

    ```

    **Figure 6.11:** Creating a QnA service


    Choose the desired options, for the context, we choose the basic pricing tiers
    for both QnA and Search. and once created, user is redirected to the overview
    page. You could explore the options in here and the most important information
    for us would be the `Keys` blade which has the keys for use with Bot Service.


    Back in the QnA Maker portal, hit the `Refresh` button in Step 2 to see your newly
    created QnA Service listed and selected the service to connect the knowledge base
    to the Azure based service. QnA Maker is a SaaS tool/offering and hence it (and
    its knowledge base) is separated out from Azure. The Azure QnA Maker service is
    a billing entity.


    ```

    ![](images/Figure-6.12.jpg

    ```

    **Figure 6.12:** Connecting to Database


    Give a name to the knowledge base and provide the FAQ or attach a document to
    automagically have the data extracted and populated from the reference link or
    document. You will be provided with the option to make edits before the information
    can be published for use.


    ```

    ![](images/Figure-6.13.jpg

    ```

    **Figure 6.13:** Populating the KB


    The last part before you go ahead and create the KB is to select the optional
    Chit-chat personality, which helps the bot to be more conversational and engaging
    and defines the personality of the virtual assistant.


    ```

    ![](images/Figure-6.14.jpg

    ```

    **Figure 6.14:** Chit Chat Functionality


    Knowledge base gets created and is displayed to the user, and this is the time
    they could review, make changes. Once done, the information can be saved and trained
    using the `Save and train` button and later Published using the `Publish` tab.
    You can also test the knowledge base within the portal and ascertain its functioning
    before publishing it.


    ```

    ![](images/Figure-6.15.jpg

    ```

    **Figure 6.15:** Publish the Service


    Once the knowledge base gets published, you are now ready to create a bot and
    it is now

    integrated within QnAMaker with a `Create Bot` button.


    ```

    ![](images/Figure-6.16.jpg

    ```

    **Figure 6.16:** Chit Chat Functionality


    Clicking the button smartly opens up the Azure Web App Bot blade with all necessary
    information pre-populated, which otherwise is a difficult task of noting down
    or remembering


    ```

    ![](images/Figure-6.17.jpg

    ```

    **Figure 6.17:** Create Bot

