- raw: "*   Platform provided by Azure to build AI-based applications\n\n*   Azure\
    \ Cognitive Services – Core Aspects\n\n*   Conversational AI \n\n*   Azure Computer\
    \ Vision\n\n*   Use Cases – Enterprise scenarios\n\n*   Setting up developer tools\n\
    \n# [Objective](#toc.xhtml#s2a)\n\nAfter reading this chapter, the reader will\
    \ be able to understand the Azure AI platform, the core concepts of Azure Cognitive\
    \ Services, various services available within Azure Computer Vision, and specific\
    \ use cases leveraging Azure Computer Vision.\n\n# [Azure AI platform](#toc.xhtml#s3a)\n\
    \nIntelligent applications leverage Artificial Intelligence to deliver rich, adaptive,\
    \ personalized, immersive, contextual experiences to users intelligently and are\
    \ autonomous. Natural interfaces of text, speech, and vision unlocking new categories\
    \ such as conversational commerce and AR/VR help in building immersive applications.\
    \ Immersive applications incorporate intelligent features such as emotion and\
    \ sentiment detection, vision and speech recognition, language understanding,\
    \ knowledge, and search. Azure AI Platform provides the capability to build such\
    \ applications very quickly. Azure AI Platform can be broadly classified into\
    \ four Services/Components as depicted below:\n\n![](images/Figure-1.1.jpg)\n\n\
    **Figure 1.1:** Components provided by Azure to build AI-based applications\n\n\
    # [Azure Applied AI Services](#toc.xhtml#s4a)\n\nAzure Applied AI Services are\
    \ built leveraging Azure Cognitive Services. They help in tasks like boosting\
    \ literacy in the classroom, diagnosing, monitoring anomalies in metrics, knowledge\
    \ from mining documents, document understanding, transcription analysis, and more\
    \ scenarios.\n\n![](images/Figure-1.2.jpg)\n\n**Figure 1.2:** Azure Applied AI\
    \ Services\n\n*   **Azure Form Recognizer**: It helps in identifying and extracting\
    \ text, key/value pairs, and table data from form documents. It helps in ingesting\
    \ text from forms and outputs structured data that includes the relationships\
    \ in the original file.\n\n*   **Azure Metrics Advisor**: It helps in identifying\
    \ and fixing problems leveraging a combination of near-real-time monitoring, adapting\
    \ models to specific scenarios and helps with diagnostics and alerts.\n\n*   **Azure\
    \ Cognitive Search**: It leverages built-in AI capabilities that help in identifying\
    \ and exploring relevant content.\n\n*   **Azure Immersive Reader**: It is an\
    \ inclusively designed tool that implements techniques to improve reading comprehension\
    \ for language learners, new readers, and people with learning differences.\n\n\
    *   **Azure Video Analyser for Media**: It helps extract metadata such as spoken\
    \ words, faces etc from video and audio files.\n\n*   **Azure Bot Service**: It\
    \ helps in developing conversational AI experiences.\n\n*   **Azure Cognitive\
    \ Services**: Developers can rapidly consume high-level “finished” services that\
    \ accelerate the development of AI solutions. They help in composing intelligent\
    \ applications, customized to the organization’s availability, security, and compliance\
    \ requirements.\n\n*   **Azure Machine Learning**: Consists of a set of comprehensive\
    \ tools and frameworks that help build, deploy, and operationalize ML models.\
    \ They provide an extensive set of supported tools and IDEs and Azure ML studio\
    \ that help in easily building and fine-tuning ML models and deploying them.\n\
    \n*   **AI Infrastructure**: AI Services and tools are backed by providing access\
    \ to large scale infrastructure. It provides hyper-clusters of thousands of state-of-the-art\
    \ GPUs, a breadth of AI hardware that includes the most comprehensive set of GPUs,\
    \ and an array of general-purpose CPUs. It provides the latest high-bandwidth\
    \ networks inside of every server.\n\nWe will look at some of the different types\
    \ of applications that can be built using the Azure AI platform.\n\n# [AI Services](#toc.xhtml#s5a)\n\
    \nAI services help access high-quality speech, vision, decision-making, language,\
    \ and AI models through simple REST API calls and also provide the ability to\
    \ create our own machine learning models.\n\nAI services offered can be broadly\
    \ classified as follows:\n\n![](images/Figure-1.3.jpg)\n\n**Figure 1.3:** AI services\n\
    \nThe following is an overview of AI Services:\n\n# [Trained Services (Prebuilt)\
    \ ](#toc.xhtml#s6a)\n\nTrained Services are Microsoft Azure Cognitive Services\
    \ that offer a set of machine learning-based Azure Rest APIs that can be easily\
    \ integrated into applications to infuse intelligence.\n\n*   **Use cases for\
    \ Trained/Prebuilt Services**: The following are a few use cases for leveraging\
    \ Cognitive/Trained services: \n\n    ![](images/Figure-1.4.jpg)\n\n    **Figure\
    \ 1.4:** Trained/Prebuilt/Cognitive Services\n\n    *   **HealthCare**: We can\
    \ leverage OCR and Read APIs and other custom algorithms/logic as appropriate\
    \ to go through large volumes of text that includes references to general entities\
    \ (e.g. people’s names) and domain-specific ones (e.g. drug and disease names)\
    \ that need to be connected and related. Sometimes we also need to combine this\
    \ with imagery that’s analyzed in well-known ways (e.g. OCR) as well as apply\
    \ leading-edge methods (e.g. AI-assisted diagnostics)\n\n    *   **Oil and Gas\
    \ companies**: Oil and Gas companies have teams of geologists and other specialists\
    \ that need to understand seismic and geologic data. They often have a huge library\
    \ of PDFs with pictures of samples over sample sheets full of handwritten field\
    \ notes. They need to connect places, people (domain experts), events, and navigate\
    \ all this information to make key decisions. We can leverage OCR and other custom\
    \ algorithms/logic to analyse and make decisions.\n\n    *   **Insurance**: Fraud\
    \ Risk Analysis can be done by identifying anomalies in transactions using Azure\
    \ Machine Learning, Face Recognition can be used as an additional authentication\
    \ mechanism.\n\n# [Conversational AI ](#toc.xhtml#s7a)\n\nConversational AI helps\
    \ in creating AI-based conversational interfaces. Azure provides Bot service which\
    \ includes Bot Builder SDK and tools for end-to-end bot development and Bot Connector\
    \ service to connect to multiple channels. We can create bots in a number of languages.\n\
    \nA Bot is a web service that communicates using a conversational interface and\
    \ leverages Bot Framework Service to exchange events and messages between the\
    \ Bot and the channel.\n\nBot functionality can be extended by adding additional\
    \ features like NLP etc. Microsoft Cognitive Services such as **Language Understanding\
    \ Service** (**LUIS**), can be added to the Bot interactions to make the conversation\
    \ more intuitive.\n\nThe following are some ways of extending Bot functionality:\n\
    \n![](images/Figure-1.5.jpg)\n\n**Figure 1.5:** Extending Bot Functionality\n\n\
    The following table shows some of the additional features that can be leveraged\
    \ to extend Bot functionality.\n\n| **Feature** || **Description** |\n\n| ---\
    \ | --- |\n\n| Natural language processing || NLP can be used to recognize and\
    \ understand the user’s intent, catch spelling mistakes, enable speech etc. |\n\
    \n| Q & A || A knowledge base can be leveraged to make the conversation more natural.\
    \ |\n\n| Manage multiple models || ‘Manage multiple models’ feature can be used\
    \ to manage multiple models like LUIS, Q&A maker. |\n\n| Add cards and buttons\
    \ || Cards and buttons can be used to enhance user experience. |\n\n**Table 2.1:**\
    \ Leveraging Bot Functionality\n\n**Use cases for conversational AI**: A few use\
    \ cases where conversational AI can be leveraged are as follows:\n\n*   Bots can\
    \ help Insurers give their customers an easy way to look up the status of a claim\
    \ and ask questions about benefits.\n\n*   Bots can help providers triage patient\
    \ issues with a symptom checker, help patients find care, and look up nearby doctors.\n\
    \n*   Bots can help end customers have intelligent conversations with banks /retail\
    \ websites.\n\n*   Bots can be built leveraging language understanding models,\
    \ bing knowledge and content out of the box. They are capable of learning from\
    \ previous interactions.\n\n# [Custom services](#toc.xhtml#s8a)"
