    \ Data. We need to clean missing rows and normalize the data before it can be\
    \ used for the experiment.\n\nAdd Clean Missing Data and configure by clicking\
    \ Edit Column as below:\n\n![](images/Figure-8.20.jpg)\n\n**Figure 8.20:** Select\
    \ Columns\n\nAdd clean missing data and configure by clicking `Edit Column` as\
    \ follows:\n\n![](images/Figure-8.21.jpg)\n\n**Figure 8.21:** Clean Missing Data\n\
    \nChoose ‘`Remove entire Row`’ in Cleaning Mode:\n\nAdd `Remove missing value\
    \ rows` in the Comment section:\n\n**Splitting the data**: For training, we will\
    \ use ‘`Split Data`’ and adjust the fraction of rows percentage to .7. This uses\
    \ 70% of the data for training and the remaining 30% for testing the model.\n\n\
    ![](images/Figure-8.22.jpg)\n\n**Figure 8.22:** Add Remove missing value rows\
    \ in the Comment section\n\n**Step 4**: Train machine learning model. Now we will\
    \ choose the algorithm to run the model.\n\nChoose ‘`Linear Regression Model`’.\n\
    \n![](images/Figure-8.23.jpg)\n\n**Figure 8.23:** Choose an algorithm \n\nAdd\
    \ Train Model \n\nIn the Edit column selector, enter ‘`price`’ in the Label Column\
    \ Dialog box.\n\n![](images/Figure-8.24.jpg)\n\n**Figure 8.24:** Label the column\n\
    \n**Step 5**: Evaluate Model.\n\nAdd Score Model and Evaluate Model:\n\nComplete\
    \ the pipeline as shown below:\n\n![](images/Figure-8.25.jpg)\n\n**Figure 8.25:**\
    \ The completed pipeline\n\nChoose and configure the Compute Instance settings:\n\
    \n![](images/Figure-8.26.jpg)\n\n**Figure 8.26:** Configure Settings\n\nWe will\
    \ configure the compute instance:\n\n![](images/Figure-8.27.jpg)\n\n**Figure 8.27:**\
    \ Configure the Compute Instance\n\n**Step 6**: Submit the pipeline\n\nWe can\
    \ submit the pipeline to train the machine learning model.\n\nAt the top of the\
    \ canvas, select `Submit`.\n\nWe need to fill in the experiment details and run\
    \ the pipeline\n\nIn the `Set up pipeline run` dialog box, select `Create new`.\n\
    \n![](images/Figure-8.28.jpg)\n\n**Figure 8.28:** Set up the pipeline run\n\n\
    **Scoring the Model:**\n\nWe can use the Score Model to apply our model to data.\n\
    \n*   The inputs to the Score Model are a deployed model and a dataset of new,\
    \ unlabelled records that we want to score.\n\n*   The output is a scored dataset\
    \ showing predictions for each record.\n\nThe column ‘`Scored Labels`’ predicts\
    \ the prices for the automobiles based on the features we had selected. We can\
    \ compare the predicted prices with the actual prices and ascertain the level\
    \ of accuracy of our model.\n\n![](images/Figure-8.29.jpg)\n\n**Figure 8.29:**\
    \ Click on Scored Dataset\n\nWe can check the scored dataset. There is a new column\
    \ of Scored Labels. This is the predicted data which is the automobile price.\n\
    \nThe scored dataset looks like as follows:\n\n![](images/Figure-8.30.jpg)\n\n\
    **Figure 8.30:** Scored Dataset\n\n**Deploying the Model**: Once the model is\
    \ deployed, it is available for consumption as Web-service and can be consumed\
    \ via Azure Machine Learning Test service or with API Testing tools. While deploying\
    \ the model, we can set the checkbox to Enable the Application Insights diagnostics\
    \ for data collection.\n\nWe have created two samples using ML Studio. We will\
    \ now look at how we can migrate from the classic version to the newer version\
    \ of ML Studio.\n\n# [ML Ops](#toc.xhtml#s126a)\n\n**machine learning operations**\
    \ (**ML Ops**) helps in developing, deploying models much faster and in automation\
    \ of the end to end life cycle.\n\n![](images/Figure-8.31.jpg)\n\n**Figure 8.31:**\
    \ MLOps\n\n**Repeatability:**\n\n**Create Pipelines**: Helps in creating pipelines\
    \ for repeating steps like data preparing, scoring and training.\n\n**Create Environments**:\
    \ Helps in creating environments for training and deploying models.\n\n**Automation**:\
    \ Helps in automating the end-to-end workflow which includes updating models,\
    \ training and deploying the models.\n\n**Alerts**: Helps in creating alerts for\
    \ model registration, experiment completion and model deployment.\n\n**Monitoring**:\
    \ Helps in comparing model inputs between training and inference, exploring model-specific\
    \ metrics, and provides monitoring and alerts on the machine learning infrastructure.\
    \ It helps in monitoring operational and machine learning-related issues.\n\n\
    **Governance**: Helps in transparent sharing of the entire lifecycle from creation\
    \ of models to deployment between data scientists, engineers, analysts and operations\
    \ personnel.\n\nFor more information: MLOps with Azure Machine Learning - Cloud\
    \ Adoption Framework | Microsoft Docs\n\n# [Migration](#toc.xhtml#s127a)\n\nML\
    \ Studio (classic) will be discontinued from August 2024. We will not be able\
    \ to create new Machine Learning Studio (classic) resources from December 2021.\n\
    \nIt is recommended to transition to the new studio by 31 August 2024 as support\
    \ for Machine Learning Studio (classic) will end by then.\n\nThe migration includes\
    \ assessing the current state, planning, getting ready, adopting new features,\
    \ and governing and managing assets and resources.\n\nGiven below is Azure Machine\
    \ Learning Adoption Framework which we can use as a guideline for migration:\n\
    \nReference: **[https://docs.microsoft.com/en-us/azure/machine-learning/migrate-overview](https://docs.microsoft.com/en-us/azure/machine-learning/migrate-overview)**\n\
    \n![](images/Figure-8.32.jpg)\n\n**Figure 8.32:** Azure Machine Learning Adoption\
    \ Framework\n\n**Azure/Azure-Machine-Learning-Adoption-Framework**: This repo\
    \ provides best practice guidance, plan template, solution assessment tool etc.\
    \ to help Machine Learning Studio(classic) customer adopt Azure Machine Learning.\
    \ (*github.com*).\n\nWhile we have seen some sample programs using Azure Machine\
    \ Learning Studio, Azure Machine Learning supports a lot of algorithms. We will\
    \ explore the details of the same in the next section.\n\n# [Azure ML library\
    \ of algorithms](#toc.xhtml#s128a)\n\nAzure Machine Learning has a large library\
    \ of algorithms which help solve regression, classification, recommender systems,\
    \ anomaly detection, clustering, etc. The Azure Machine Learning Algorithm Cheat\
    \ Sheet helps us identify the appropriate algorithm from the designer.\n\nWe can\
    \ download the cheat sheet here: **[https://docs.microsoft.com/en-us/azure/machine-learning/algorithm-cheat-sheet](https://docs.microsoft.com/en-us/azure/machine-learning/algorithm-cheat-sheet)**\n\
    \nHere is a view of the sheet form the Microsoft site:\n\n![](images/Figure-8.33.jpg)\n\
    \n**Figure 8.33:** ML algorithm Cheat Sheet\n\n**Using the Machine Learning algorithm\
    \ cheat sheet**: We can use this sheet as a starting reference point. To solve\
    \ a particular problem, we might have to use a combination of several algorithms.\n\
    \nWe can learn more about the algorithms supported by Azure ML Designer at\n\n\
    Algorithm and component reference. (**[https://docs.microsoft.com/en-us/azure/machine-learning/component-reference/component-reference](https://docs.microsoft.com/en-us/azure/machine-learning/component-reference/component-reference)**)\n\
    \nWhile we have discussed Microsoft based libraries we will briefly touch upon\
    \ the Accord.NET framework which provides a variety of libraries for image processing\
    \ apart from other tasks.\n\n# [Accord.NET -A brief Introduction](#toc.xhtml#s129a)\n\
    \nAccord.NET framework comprises a set of libraries for statistics, numerical\
    \ optimization, machine learning, artificial neural networks, numerical linear\
    \ algebra, signal and image processing, and support libraries.\n\nIt can be used\
    \ in Microsoft Windows, Xamarin, Unity3D, Windows Store applications, Linux or\
    \ mobile applications.\n\nThe framework offers a consolidated API for learning/training\
    \ machine learning models that is both easy to use and extensible.\n\nThe framework\
    \ has been divided into modules and users can choose the modules they would like\
    \ to include in their projects.\n\nAlgorithms supported by machine learning can\
    \ be classified as supervised and unsupervised learning."
