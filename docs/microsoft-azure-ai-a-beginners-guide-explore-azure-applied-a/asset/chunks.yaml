    \ content.\n\n- **Language service**: Helps build apps that embed language understanding.\
    \ This helps in identifying entities and their relationships, better understand\
    \ sentiment and comprehend information. The following are some of the use cases\
    \ for language service:\n\n  ![](images/Figure-1.8.jpg)\n\n  **Figure 1.8:** Language\
    \ Service\n\nIt helps infuse into conversations and enables usage of `Bots`, applications,\
    \ `IoT Devices` using `Natural Language Processing`.\n\n- **Speech service**:\
    \ Helps convert speech into text and text into natural-sounding speech. Speech\
    \ helps in translating from one language to another and enables speaker verification\
    \ and recognition. Given below are some of the use cases for Speech:\n\n  ![](images/Figure-1.9.jpg)\n\
    \n  **Figure 1.9:** Speech Service\n\n  - **Speech to Text**: Helps translate\
    \ audio streams to text in real time\n  - **Text To Speech**: Helps convert text\
    \ into synthesized speech\n  - **Speech Translation**: Helps enable real time,\
    \ multi-language translation of speech\n  - **Voice Assistants**: Helps empower\
    \ developers to create conversational interfaces to applications\n  - **Speaker\
    \ Recognition**: Helps provide APIs to recognize and identify speakers\n  - **Intent\
    \ Recognition**: Helps recognize speech, entities and intent\n\n- **Vision Service**:\
    \ Helps in analyzing images, videos, perform certain analysis and derive insight\
    \ such as recognizing, identifying caption, abusive content, and so on.\n\n  -\
    \ **Computer Vision**: Provides access to advanced algorithms for processing images\n\
    \  - **Face**: The `Face` service provides access to advanced algorithms, enabling\
    \ face attribute detection and recognition\n  - **Custom Vision Service**: Provides\
    \ capabilities to build image classifiers.\n\n- **Web Search**: Helps add `Bing\
    \ Search APIs` to apps. `Bing Search` helps in searching information from webpages,\
    \ images, videos, and news with a single `API call`. Helps provide instant answers\
    \ to user queries which are easily configured to include web pages, images, videos,\
    \ news, translations as `JSON` based on search relevance and your `Bing Search\
    \ subscriptions`. It helps in suggesting search terms in real time, filter results,\
    \ localize search results and analyse search metrics with `Bing Statistics`.\n\
    \nIn this book, we will focus on `Azure Cognitive Services` as described above\
    \ and `Azure Applied AI Services`. We will start with understanding the basics\
    \ and then get into details on each of the `APIs` provided by `Azure Vision API`.\n\
    \n# Azure Vision Service (#toc.xhtml#s10a)\n\nAzure Vision Service provides `APIs`\
    \ / `SDK` to analyze images, videos, extract text from images, and moderate content\
    \ in images. We can either leverage the `APIs` or the `SDK`. `Vision APIs` help\
    \ infuse into applications vision capabilities like image processing, video analytics,\
    \ and insights, face recognition and detection capabilities, OCR capabilities\
    \ into applications.\n\nWe will now look at each of the `APIs` in detail.\n\n\
    - **Computer Vision**\n"
  trans: "\n\n自定义服务有助于使用自定义训练的模型来构建应用程序。产品推荐、交易欺诈检测、销售预测都是利用自定义服务的应用示例。Azure 提供了一个易于使用的平台，用于开发/构建、训练和部署自定义机器学习模型，并使用了\
    \ `Visual Studio Code`、`Jupyter Notebooks` 以及 `Tensorlfow`、`PyTorch` 等开源工具。它还可以通过简单的\
    \ `REST API` 调用，将这些功能作为服务嵌入到自定义应用程序中。\n\n- **自定义服务的用例**：以下是利用自定义服务的几个用例：\n\n \
    \ ![](img/Figure-1.6.jpg)\n\n  **图 1.6：** 自定义服务的用例\n\n  - 提供产品推荐、针对药物、服装、产品等的个性化推荐。\n\
    \  - 为患者提供指导和治疗。实现体检等检查检查的个性化建议和推荐。\n\n  - 临床医生可以通过分析医疗记录来主动识别风险患者，并使用来自智能设备的数据提供个性化护理。\n\
    \n  - 使用异常检测进行欺诈识别。提高运营效率。我们可以通过从设备收集的数据中得出智能洞察和行动来提高运营效率。\n  - 提高安全性。通过提供对车间活动的洞察，可以通过维护来提高设备的安全有效性。\n\
    \n现在我们已经了解了 AI 服务，我们将深入研究 Azure 认知服务（Azure Cognitive Services）。\n\n# Azure 认知服务\
    \ (#toc.xhtml#s9a)\n\nAzure 认知服务提供了 `APIs`、`SDKs` 和服务，开发者利用这些服务可以将语音、光学识别、情感分析、人脸识别、视频分析、文本分析等认知智能注入应用程序。\n\
    \nAzure 认知服务提供了一系列托管在 Azure 上的基于机器学习的内置 `Azure Rest APIs`。我们可以利用这些 `Azure Cognitive\
    \ Service APIs` / 服务轻松地为 Web、移动、桌面应用程序添加智能功能，例如人脸识别、语音识别、情绪和情感检测、视觉和语音识别、知识、搜索和语言理解。这些\
    \ `APIs` 是跨平台的，可以在各种设备上访问。\n\nAzure 认知服务可以大致分为决策、语言、语音、视觉和网页搜索，如下：\n\n  ![](img/Figure-1.7.jpg)\n\
    \n  **图 1.7：** Azure 认知服务\n\n以下是 Azure 认知服务下不同服务的简要描述：\n\n- **决策服务 (Decision Service)**：帮助构建通过添加推荐来辅助高效决策的应用程序。决策服务包括\
    \ `Personalizer` 和 `Content Moderator`。\n\n  - **Personalizer 服务**：`Personalizer`\
    \ 服务是一种云端服务，帮助应用程序选择向用户展示的最佳内容，并通过易于使用的 `APIs` 帮助强化学习。决策 `API` 的一些用例包括 `Intent`（意图）的澄清和消除歧义，这在当用户意图不明确时，通过提供个性化选项帮助用户获得更好的体验。`Decision\
    \ API` 帮助为个性化菜单和选项提供建议。\n\n    例如，它可以用于向购物者建议产品。应用程序可以监控用户的反应，并向 `personalizer\
    \ service` 发回 `reward score`（奖励分数），从而实现机器学习模型的持续反馈和改进，这进一步增强了 `personalizer` 提示语境化推荐的能力。\n\
    \n  - **异常检测器 (Anomaly detector)**：`Anomaly detector` 帮助监控和检测异常。`Anomaly detector`\
    \ 以时间序列数据作为输入，帮助使用异常检测算法检测数据中的下降和峰值。它可以在云端或边缘端使用，并进行自定义。\n\n  - **内容审核器 (Content\
    \ moderator)**：`Content moderator` 帮助监控和检测攻击性内容。\n\n- **语言服务 (Language service)**：帮助构建嵌入语言理解的应用程序。这有助于识别实体及其关系，更好地理解情感并理解信息。以下是语言服务的一些用例：\n\
    \n  ![](img/Figure-1.8.jpg)\n\n  **图 1.8：** 语言服务\n\n  它帮助注入对话中，并允许使用 `Natural\
    \ Language Processing`（自然语言处理）驱动 `Bots`、应用程序和 `IoT Devices`。\n\n- **语音服务 (Speech\
    \ service)**：帮助将语音转换为文本并将文本转换为自然的语音。语音有助于不同语言之间的翻译，并实现说话人验证和识别。以下是语音服务的一些用例：\n\
    \n  ![](img/Figure-1.9.jpg)\n\n  **图 1.9：** 语音服务\n\n  - **语音转文本 (Speech to Text)**：帮助实时将音频流翻译为文本\n\
    \  - **文本转语音 (Text To Speech)**：帮助将文本转换为合成语音\n  - **语音翻译 (Speech Translation)**：帮助实现语音的实时多语言翻译\n\
    \  - **语音助手 (Voice Assistants)**：帮助赋予开发者为应用程序创建对话式界面\n  - **说话人识别 (Speaker Recognition)**：帮助提供\
    \ API 来识别和识别说话人\n  - **意图识别 (Intent Recognition)**：帮助识别语音、实体和意图\n\n- **视觉服务 (Vision\
    \ Service)**：帮助分析图像、视频，执行某些分析并得出洞察，如识别、识别标题、滥用内容等。\n\n  - **计算机视觉 (Computer Vision)**：提供处理图像的先进算法访问\n\
    \  - **人脸 (Face)**：`Face` 服务提供了高级算法的访问，实现人脸属性检测和识别\n  - **自定义视觉服务 (Custom Vision\
    \ Service)**：提供构建图像分类器的能力。\n\n- **网页搜索 (Web Search)**：帮助为应用程序添加 `Bing Search APIs`。`Bing\
    \ Search` 帮助通过单个 `API call` 从网页、图像、视频和新闻中搜索信息。帮助为用户查询提供即时答案，并可以轻松配置以包含网页、图像、视频、新闻、翻译，基于搜索相关性和您的\
    \ `Bing Search subscriptions` 以 `JSON` 格式输出。它有助于实时建议搜索词、过滤结果、本地化搜索结果并使用 `Bing\
    \ Statistics` 分析搜索指标。\n\n在书中，我们将专注于上述描述的 `Azure Cognitive Services` 和 `Azure Applied\
    \ AI Services`。我们将从理解基础知识开始，然后详细介绍 `Azure Vision API` 提供的每个 `API`。\n\n# Azure\
    \ 视觉服务 (#toc.xhtml#s10a)\n\nAzure 视觉服务提供了 `APIs` / `SDK` 来分析图像、视频、从图像提取文本并审核图像内容。我们可以利用\
    \ `APIs` 或 `SDK`。`Vision APIs` 帮助为应用程序注入视觉能力，如图像处理、视频分析和洞察、人脸识别和检测能力、OCR 能力。\n\
    \n我们将详细查看每个 `API`。\n\n- **计算机视觉 (Computer Vision)**\n\n"
