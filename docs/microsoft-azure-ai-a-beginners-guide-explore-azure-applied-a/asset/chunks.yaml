    **ISBN: 978-93-55510-518**


    保留所有权利。未经出版者书面许可，不得以任何形式或通过任何手段复制、分发或传输本书的任何部分，或存储在数据库或检索系统中，但可以在计算机系统中录入、存储和执行程序列表除外，但它们不能通过出版、复印、录制或任何电子和机械手段复制。


    ## 责任限制与免责声明


    本书包含的信息是真实准确，并代表了作者和出版者所知的最佳水平。作者已尽一切确保这些出版物的准确性，但出版者对书中任何信息引起的任何损失或损害不承担责任。


    书中提到的所有商标均承认其各自所有者的财产，但 BPB Publications 不能保证这些信息的准确性。


    ![](img/logo1.jpg)


    [www.bpbonline.com](http://www.bpbonline.com/)


    # 前言


    作为 Avanade 公司 Azure 全方位解决方案高级副总裁，我认为人工智能（AI）是所有垂直领域和客户群体数字化转型的核心支柱。


    AI 的概念让许多自由思考者着迷，让另一些人恐惧。少数人将 AI 视为构建未来业务的大跃迁，而有些人则基于可能导致人类灭绝的恐惧攻击这一理念。


    虽然 AI 技术距离创造能够自我意识和自我进化的 AI 还很远，但事实上——AI 已经对我们生活的每个方面产生了巨大影响。AI 为各行业的企业提供了利用其构建未来产品、服务、优化运营，并为改善客户体验和员工体验提供无价洞察的机会。每年人工智能和自动化领域都有新进展，企业可以用各种创新方式利用这些进展。但你猜怎么着，AI
    专业人才的匮乏是加速 AI 采用的最大障碍之一。


    我喜欢这本书的地方在于，它为不同的角色提供了从 CTO 层到 AI 架构师、AI 顾问或初级 AI 开发人员的实用指南。这本书让学习 Microsoft Azure
    AI 概念、常见用例变得简单，涵盖了 Azure AI 的基础和高级概念。本书结构良好，涵盖了大量的 Azure AI 和 PaaS 能力。学习新技术最好的方法是尝试开发简单的应用程序并编写代码。这本书通过解释良好的工作代码示例帮助解决这一问题。


    我很喜欢涵盖 Azure AI 平台基础、Azure AI 生态系统和服务概念的章节。如果你想学习 Azure 认知服务、Azure 计算机视觉，这是一本必读之书。


    # 关于作者


    **Rekha Kodali** 是埃森哲首席总监。她在微软技术领域拥有 23 多年的经验，其关注领域包括 Azure、企业架构、微服务、解决方案架构和售前工作。她在创建差异化解决方案和服务供应方案方面发挥了重要作用。她的证书包括
    TOGAF、IASA 认证基础架构师和 Azure 解决方案架构师专家。她是《Developing Cloud Native Applications Using
    Azure .Net Core: A Practitioner''s Guide to Design, Develop and Deploy》的作者。


    LinkedIn: `https://www.linkedin.com/rekha-kodali-3561201b/`


    **Sankara Narayanan Govindarajulu** 是微软的解决方案架构师，帮助合作伙伴和客户完成数字化转型之旅。在 23 年的职业生涯中，Sankara
    利用其深经验和热情以引入人的方式帮助客户进行战略决策、项目执行、架构设计以及企业解决方案开发。Sankara 拥有 TOGAF 认证，并拥有 Azure 迁移、架构、开发和安全认证。他出版过书籍和期刊，并在多次技术会议上进行过演讲。


    LinkedIn Profile：`https://www.linkedin.com/in/sankara-narayanan-g/`


    **Mohammed Athaulla** 是 Wipro 首席开发人员，在微软技术领域拥有 10 多年的经验。他在使用 Azure、ASP.net core
    MVC、Web API、Angular、JavaScript、SQL Server 等各种技术进行软件应用程序开发和定制方面拥有实战经验。他领导了一个大型
    AI 解决方案的开发。


    LinkedIn Profile：`https://www.linkedin.com/in/athaulla/`


    # 关于评审员


    **Suryanarayana Murty Eranki** 在架构和交付云解决方案方面拥有 24 年实践领导经验，并在 IT 软件方面拥有丰富经验。他是一位成就卓越且技术复杂的领导者，在项目生命周期内架构和实施大型、复杂且业务关键的技术项目方面表现成功。作为云解决方案专家，他帮助企业采用
    Microsoft Azure、Amazon Web Services 和 Google 等公共云平台。他曾在 Wipro、Tech Mahindra、Cognizant、Genpact
    等公司工作，目前在海得拉云咨询精品公司 Apware - Hyderabad 担任执行董事，为客户提供基于 Microsoft Azure 和 AI/ML
    的解决方案。


