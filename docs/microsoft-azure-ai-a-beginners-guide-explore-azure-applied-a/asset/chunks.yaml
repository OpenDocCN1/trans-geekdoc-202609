    \n# [Face recognition](#toc.xhtml#s32a)\n\nBased on a person’s facial contours,\
    \ facial recognition helps in identifying or verifying a person by comparing and\
    \ analyzing patterns. Facial recognition technology has potential for a wide range\
    \ of applications. It makes the person’s human machine interactions seamless.\n\
    \nFacial recognition can be effective to solve many problems across industry domains\
    \ such as banking, healthcare, residential security, and travel.\n\n The Face\
    \ API provides REST APIs to perform various tasks on faces such as detect faces,\
    \ verify faces, identify faces, analyze faces, matching faces, analyzing face\
    \ attributes, grouping similar faces.\n\nWe can leverage Face API to detect activities\
    \ in images, match faces from an existing database of images, return coordinates\
    \ of faces, manage profiles, analyze and identify faces in video frames.\n\nFollowing\
    \ is a sample use case for Face API for Face recognition:\n\n![](images/Figure-3.8.jpg)\n\
    \n**Figure 3.8:** Using Face API for Face recognition\n\n# [Computer Vision -\
    \ Face API - In Detail](#toc.xhtml#s33a)\n\nThe facial data returned by Face API\
    \ include:\n\n![](images/Figure-3.9.jpg)\n\n**Figure 3.9:** Features provided\
    \ by Face API\n\nSome of the use cases include:\n\n*   **Identifying Face in a\
    \ group**: Identify people by comparing faces in a group to return a person object\
    \ that matches.\n\n*   **Identifying Similar Faces**:  \n\n    *   Match Person\
    \ applies same person threshold to return similar face.\n\n    *   Match Face\
    \ returns similar faces by ignoring the same-person threshold.\n\n*   **Face Detection**\n\
    \n    We can leverage Face Detection API to detect faces and return boxes for\
    \ the images. It also returns facial attributes based on machine learning based\
    \ predictions. The facial attributes returned include Emotion, Age, Gender, Smile,\
    \ Facial hair, etc. along with 27 landmarks for each face.\n\n    Face – Detect\
    \ operation helps detect faces in an image, returns face rectangles with faceIds,\
    \ attributes and landmarks.\n\n    Detect human faces in an image, return face\
    \ rectangles, and optionally with faceIds, landmarks, and attributes.\n\n    *\
    \   Face size 200 × 200 pixels or bigger gives better detection results.\n\n \
    \   *   Supported formats include PNG.GIF, JPEG and BMP format are supported.\n\
    \n    *   Supported image file size is from 1 KB to 6 MB.\n\n    *   A maximum\
    \ of 64 faces can be returned for an image.\n\n# Emotion Recognition\n\nWe can\
    \ leverage the Emotion Recognition API to return a set of emotions for each face\
    \ in the image with a given level of confidence. Emotions recognized include anger,\
    \ contempt, disgust, fear, happiness, neutral, sadness, and surprise. \n\n# Face\
    \ Grouping\n\nWe can leverage Face Grouping API to group unidentified faces based\
    \ on similar features to group them together into groups.\n\nWe can use a facelist\
    \ which could be a single face, a group of faces, a single person or a group of\
    \ persons to help create and manage groups of faces. It helps find similar faces\
    \ in a set of pictures which could include celebrities, friends, or family members.\
