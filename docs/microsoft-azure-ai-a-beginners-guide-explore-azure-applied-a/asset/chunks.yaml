    \n# 第三章\n# 计算机视觉 - 光学字符识别、Face API 和空间分析\n阅读本章后，读者将理解 Vision APIs 中提供的各种 API。包括文本识别、光学字符识别、Face\
    \ API 和空间分析 API。在本章结束时，读者将理解如何使用每个 API 构建构建应用程序。\n\n# 结构\n在本章中，将解释以下主题：\n* 文本识别、光学字符识别\n\
    * Face API\n* 空间分析\n* 示例用例\n\n# 目标\n在本章中，读者将理解如何使用手写体识别、光学字符识别、Face API 和空间分析。阅读本章后，读者将掌握相关技能，通过利用手写体识别、光学字符识别、Face\
    \ API 和空间分析来有效地构建应用程序。\n\n# 手写/打印文本识别\n处理手写或打印文本信息是开发智能应用程序的一个非常重要的方面。计算机视觉提供了不同的\
    \ API，帮助检测和提取图像中的手写或打印文本。这在健康、保险和银行等领域有许多用例。\n\n下图显示了我们如何使用易于集成的 API/SDKs 处理打印和手写笔记。\n\
    \n![](img/Figure-3.1.jpg)\n\n**图 3.1：** OCR 用例\n\n以下章节涵盖了计算机视觉中提供的用于 OCR 的不同 API。\n\
    \n* **Read API**: 使用 `Read API`，我们可以将文本转换为机器可读的字符流。此异步 API 适用于转换文本密集图像以及包含大量噪声的图像。它使用了最新的识别模型。\n\
    \n  以下是 `Read API` 的关键功能：\n    * 支持的图像类型包括 TIFF、JPEG、BMP、PDF 和 PNG\n    * 文件大小应小于\
    \ 20 MB\n    * 它可以处理多达 200 页，每页最多限制为 300 行\n* **OCR API**: 我们可以利用 `OCR API` 同步将图像转换为文本。此\
    \ API 尝试检测文本的方向并尝试纠正图像的方向。\n\n  以下是 `OCR API` 的功能：\n    * 支持的图像类型包括 BMP、GIF、PNG\
    \ 和 JPEG。\n    * 支持按 90 度的倍数以及最多 40 度的小角度旋转图像。输入图像应大于或等于 40 x 40 且小于或等于 3200 x\
    \ 3200 像素。\n    * 大小应小于 1000 万像素。\n    * 大小不大于 4 MB。\n    * OCR 支持 25 种不同的语言并可以检测图像中文本的语言。\n\
    * **示例场景**\n  下面是使用上述 API 的一些示例场景/用例。\n\n  **场景 1**:\n    * 用户上传支票。\n    * 使用\
    \ `OCR API` 将支票转换为数字文本。\n    * 验证签名。\n    * 支票结清。\n\n    ![](img/Figure-3.2.jpg)\n\
    \n    **图 3.2：** 手写支票的 OCR 用例\n\n  **场景 2**: 在有多个患者记录被扫描、数字化和存储的场景下，提供全面的患者记录对于提供适当治疗非常有用。\n\
    \n  我们可以通过对各种来源的医疗记录、保险记录进行 `OCR` 来创建聚合患者病史。这提供了一个全面的患者记录。这有助于提供正确的治疗。\n\n  下图显示了我们如何使用\
    \ `OCR` 聚合来自多个来源的记录：\n  ![](img/Figure-3.3.jpg)\n\n  **图 3.3：** 从多个来源聚合记录的 OCR。\n\
    \n  **场景 3**: 我们可以对一种语言的文档进行扫描并执行 `OCR`，使用 Azure Text to Speech API 翻译成另一种语言。\n\
    \n  ![](img/Figure-3.4.jpg)\n\n  **图 3.4：** 从多个来源聚合记录的 OCR。\n\n# 手写识别实验\n下面是识别手写的示例。我们将创建一个\
    \ .NET 控制台应用程序。该程序接收图像作为输入。它将识别并打印读取的文本。\n\n按照步骤进行手写实验：\n\n**步骤 1**: 创建一个新的 C#\
    \ .NET Core App。\n\n```csharp\nusing System;\nusing System.Net.Http.Headers;\n\
    using System.Net.Http;\nusing System.Web;\nusing System.IO;\nusing System.Threading.Tasks;\n\
    using Newtonsoft.Json;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using Newtonsoft.Json.Linq;\n```\n\n**步骤 2**: 访问 `https://portal.azure.com` 创建计算机视觉服务。\n\
    \n**步骤 3**: 替换有效的密钥和端点。\n\n```csharp\nnamespace HandwritingDetection\n{\ninternal\
    \ class Program\n{\nprivate static string subscriptionKey = “<密钥>”; //替换密钥\nprivate\
    \ static string\nendpoint = “https://retailocr.cognitiveservices.azure.com/vision/v1.0/ocr?”;\
    \ //替换端点 URL\nprivate static void Main()\n{\nvar ch = “1”;\n// 从用户获取路径和文件名\nConsole.WriteLine(“手写文本提取:\"\
    );\nwhile (ch == “1”)\n{\nConsole.Write(“输入想要读取的图像路径:”);\nstring imgPath = Console.ReadLine();\n\
    if (File.Exists(imgPath))\nMakeRequest(imgPath).Wait();\nelse\nConsole.WriteLine(“\\\
    n 无效路径”);\nConsole.WriteLine(“\\n 按回车 0 退出，按 1 继续...”);\nch = Console.ReadLine();\n\
    }\n}\n}\n```\n\n**步骤 4**: 创建模型类 `ImageInfoViewModel.cs`\n\n```csharp\nnamespace\
    \ HandwritingDetection\n{\npublic class Word\n{\npublic List<int> boundingBox\
    \ { get; set; }\npublic string text { get; set; }\npublic double confidence {\
    \ get; set; }\n}\npublic class Line\n{\npublic List<int> boundingBox { get; set;\
    \ }\npublic string text { get; set; }\npublic List<Word> words { get; set; }\n\
    }\npublic class ReadResult\n{\npublic int page { get; set; }\npublic double angle\
    \ { get; set; }\npublic int width { get; set; }\npublic int height { get; set;\
    \ }\npublic string unit { get; set; }\npublic string language { get; set; }\n\
    }\n}\n```\n\n"
