    \n![](images/Figure-6.7.jpg)\n\n**Figure 6.7:** End to End Development Cycle\n"
  trans: "\n\n## 图 6.3: 启用 LUIS 的应用程序\n\n可以使用 `luis.ai` 门户创建 LUIS 应用，此类应用包含一个特定领域的自然语言模型。如果你是初开始，应该先尝试一个预构建的领域模型。另一种方法是构建你自己的模型，也可以将预构建的领域模型与你的自定义模型进行混合组合。\n\
    \n以下是理解 LUIS 应用时需要掌握的重要概念：\n\n- **意图 (Intent)**：用户希望机器人执行的操作 - 用户查询背后的基本意图。\n\
    - **话语 (Utterances)**：用户与机器人交互时使用的问题或句子。\n- **实体 (Entities)**：用户查询所依据的上下文中的名词或对象。\n\
    \n这里有一个示例：\n\n![](img/Figure-6.4.jpg)\n\n**图 6.4：** LUIS 应用的主要组件\n\nLUIS 与 QnA\
    \ Maker 的不同之处主要在于对 API 响应的消费方式。在 QnA Maker 中，查询结果（即映射问题的答案）会直接发送给用户，而无需机器人（机器人的代码）进行额外的处理或操作。在\
    \ LUIS 中，来自 LUIS API 的响应是预测评分、意图和一些元数据的组合。机器人必须处理此响应并做出相应反应，然后才能回复用户。\n\n## 用于语言的\
    \ Azure 认知服务\n\n2021 年 5 月，微软将 QnA Maker 管理服务作为“自定义问答”（Custom Question Answering）功能作为文本分析（Text\
    \ Analytics）的一部分重新引入。这是“规模化 AI”方法的一部分，其中“问答”功能同时引入了预构建和自定义能力。现有的 QnA 管理资源也可以继续工作。\n\
    \n微软最近所做的是将 QnA Maker 和 LUIS 合并，并将它们与文本分析一起置于名为“语言服务”（Language Service）或“用于语言的认知服务”（Cognitive\
    \ Services for Language）的新服务中。截至本文编写，它处于公共预览阶段。如果你已经拥有 QnA 或 LUIS 资源，可以将它们迁移到新的语言服务。导入\
    \ LUIS 非常简单，只需导入 LUIS JSON 文件，而 QnA 迁移是一个引导过程。如果你感兴趣，可以在这里查看迁移指南 - [将 QnA Maker\
    \ 知识库迁移到自定义问答 - Azure 认知服务 | Microsoft 文档](https://docs.microsoft.com/zh-cn/azure/ai-services/question-answering/howto-migrate-qnamaker-kb)\n\
    \n![](img/Figure-6.5.jpg)\n\n**图 6.5：** 认知服务 – 语言服务\n\n![](img/Figure-6.6.jpg)\n\
    \n**图 6.6：** 在语言服务中添加功能\n\n## 搜索\n\n搜索是构建机器人不可或缺的一部分。例如，QnA Maker 现在内部使用 Azure\
    \ Search（你会看到作为 QnA 服务一部分而创建的 Azure Search 实例），其中搜索用于索引所有知识库内容，并用于编写和测试。\n\n此外，机器人可以单独整合\
    \ Azure Search 以探索涉及的源，还可以集成 Bing Search 进行网络搜索。因此，如果模型、知识库和数据源无法处理查询，机器人可以运行\
    \ Bing Search 并提供合适的答案。\n\n## 存储\n\n机器人存储数据有两种方式：内存存储或数据库存储。在这两种情况下，机器人都会存储和检索与用户/对话关联的状态数据，这些数据可以用于许多用途，例如从离开的地方重新开始对话或简单地通过名称识别用户。它还可以用于根据用户的兴趣量身定制内容与用户进行交互，例如提醒他们感兴趣的事件或新闻。\n\
    \n## 信息源\n\n机器人还可以与暴露为 REST API 的外部信息源建立接口。此类服务可以提供人口统计和地理空间数据、来自第三方和机构的数据等。\n\
    \n- **监控与洞察**\n  Bot Analytics 为机器人提供分析洞察。它是应用程序 Insights 的扩展，提供有关流量、延迟和集成的数据，以及有关对话的数据，如用户、消息和通道数据。\n\
    - **报告/可视化**\n  报告和可视化是任何解决方案的共同方面，可以通过 Power BI 等云原生产品来实现。Power BI 是一系列软件服务、应用程序和连接器，它们共同工作，将不相关的数据源转换为视觉沉浸式且交互式的洞察。数据可以来自任何源，例如电子表格、基于云或基于本地部署的数据存储器和仓库。\n\
    \n## 使用 Bot Framework 构建机器人\n\n使用 Bot Framework 构建机器人涉及以下辅助开发者构建机器人的组件和工具：\n\n\
    - **Bot Framework SDK**：开发包，提供了开发机器人所需的所有底层管道代码。\n- **Bot 构建工具**：用于协助端到端开发，包括机器人模拟器（Bot\
    \ emulator）。\n- **Azure Bot Service**：启用机器人与其通道之间通信的核心服务。\n- **对话体验**：允许与机器人通信的通道。\n\
    - Azure Bot Service 提供了两种创建机器人的方法，它们在计费方面不同，取决于机器人的需求/使用情况。\n- **Web 应用机器人 (Web\
    \ App Bot)**：此类机器人使用 App Service 来托管机器人，并可以选择“App Service 计划”或“消费计划”。\n- **函数机器人\
    \ (Functions Bot)**：函数机器人使用 Azure Functions 作为后端。你不会看到 App service 字段。相反，有一个托管计划字段供选择。\n\
    \n设计和构建机器人的思维过程在开始设计之前就很重要。按照原则，以下应该是目标：从简单开始，随着构建不断增加复杂度。机器人应该是上下文感知的并适应用户的。引入智能控制来管理复杂度。\n\
    \n## 生命周期\n\n当你开始构建机器人时，你构建的第一个可能会遇到一些故障，并觉得计划得不够好。但理解开发周期有助于从头到尾开发机器人而不产生很多故障。以下是生命周期每个阶段的简要总结。\n\
    \n- **计划 (Plan)**\n  涉及利用设计最佳实践规划机器人的对话和对话框（查看机器人设计原则）。在开始编码之前，使用 Chatdown 模拟对话。\n\
    - **构建 (Build)**\n  构建阶段是你连接诸如**语言理解**（**LUIS**）、知识库支持（QnA Maker）等智能功能的时候。\n-\
    \ **测试 (Test)**\n  使用 Bot Framework Emulator V4 对机器人进行测试并使用断点进行调试。模拟器是微软提供的免费工具，允许机器人连接到\
    \ LUIS、QnA 等其他服务。\n- **发布 (Publish)**\n  如果你使用 Visual Studio 或 VS Code 进行自定义开发，可以直接从这些工具发布机器人。还可以使用\
    \ Azure CLI 创建、下载并将你在本地构建的机器人发布到 Azure Bot Service。\n- **连接 (Connect)**\n\n一个.\
    \ 机器人的端到端开发工作流包括 6 个阶段，微软提供了所有阶段的工具来帮助开发、设计和构建：\n\n图片来源：[`docs.microsoft.com/en-us/azure/bot-service/bot-service-overview?view=azure-bot-service-4.0`](https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview?view=azure-bot-service-4.0)\n\
    \n![](img/Figure-6.7.jpg)\n\n**图 6.7：** 端到端开发周期\n\n"
