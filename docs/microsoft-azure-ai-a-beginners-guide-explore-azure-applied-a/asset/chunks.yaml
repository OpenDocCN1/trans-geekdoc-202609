    \ Speech To Text\n\n8. **Which service Azure Content Moderator cognitive service\
    \ verifies and flags text, image, and video content for material that is offensive\
    \ with labels?**\n   - Azure Content Sanitizer\n   - Analyze\n   - Web Search\n\
    \   - Azure Content Moderator\n\n9. **Which API can be used to extract a list\
    \ of strings denoting the key talking points in the input text. ?**\n   - Decision\n\
    \   - Analyze\n   - Key Phrase Extraction\n   - Language Detection\n"
