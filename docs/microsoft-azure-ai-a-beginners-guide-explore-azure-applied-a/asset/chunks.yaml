  trans: "\n处理图像信息是开发业务关键应用时应用人工智能的一个非常重要的方面。我们可以通过图像分析和图像分类来分析和处理图像，这是 Azure Vision\
    \ Service 的两个不同方面。以下章节将详细介绍图像分析和图像分类。\n\n# 图像分析 - Azure Computer Vision API\n\n\
    我们可以利用 Azure Computer Vision `Analyze Image` API 来分析图像并获取有关图像视觉方面的信息。它根据不同的视觉特征返回描述，并对每个特征提供一个置信度评分。最终输出是一个按置信度从高到低排序的描述列表。基于数千个可识别的对象，计算机视觉除了返回背景详情外，还会根据图像中识别出的物体、生物体和动作返回标签。在信息不可用的地方会提供提示（Hints）。\n\
    \n下面的图显示了我们使用 `Analyze Image` API 可以执行的操作：\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1：**\
    \ 使用 `AnalyzeImage` API 可以执行的操作\n\n## 详细分析 API：\n\n*   **检测对象 (Detect object)**：我们可以利用对象检测\
    \ API 列出对象及其对应的坐标，并检查某个对象的相似实例的数量。我们可以利用 `detect` 操作来确定对象之间的关系，并获取每个找到的对象的边界框（bounding\
    \ box）坐标。标签是根据图像中包含的对象和生物应用的。\n\n    例如，对于包含像 `cat`（猫）、`dog`（狗）等对象的图像，`Detect\
    \ API` 将列出这些对象及其在图像中的坐标。此 API 可用于关联图像中对象之间的关系。`Detect API` 帮助检查图像中是否存在同一标签的多个实例。\n\
    \n    以下是 `Detect API` 的一些局限性：\n\n    *   小于图像 5% 的对象不会被检测\n    *   组织得太近的对象可能不会被检测\n\
    \n*   **类别 (Categories)**：我们可以利用此方法从约 86 个类别中获取类别。\n\n    示例分类包括 `dog`（狗）、`outdoor`（户外）、`bread`（面包）等：\n\
    \n    ![](img/Figure-2.2.jpg)\n\n    **图 2.2：** 示例分类\n\n*   **检测品牌 (Detect Brands)**：我们可以利用此方法获取关于社交媒体上哪些品牌受欢迎的见解。\n\
    \n    ![](img/Figure-2.3.jpg)\n\n    **图 2.3：** 示例品牌\n\n*   **图像分类 (Categorize\
    \ an image)**：我们可以利用此方法识别并对整个图像进行分类，使用具有父子继承层次结构的类别分类体系法。\n\n*   **列出特定领域模型 (List\
    \ domain-specific models)**：我们可以利用此方法返回 Computer Vision API 支持的特定领域模型，包括名人识别器、地标识别器。\n\
    \n*   **生成缩略图 (Generate a thumbnail)**：我们可以利用此方法返回由用户指定的宽度和高度的缩略图。服务将对图像进行分析。识别“感兴趣区域”（`ROI`）并根据\
    \ `ROI` 生成智能裁剪坐标。\n\n*   **描述图像 (Describe image)**：我们可以利用此方法返回图像的描述，该描述是图像中内容的标签集合，并带有置信度评分。支持的输入方法包括指定图像或图像\
    \ URL。我们在随后的章节中有一个实验。\n\n*   **检测脸部 (Detect faces)**：我们可以利用此方法提供有关图像中检测脸部的信息。返回的每个脸部的详情包括年龄、坐标、性别。\n\
