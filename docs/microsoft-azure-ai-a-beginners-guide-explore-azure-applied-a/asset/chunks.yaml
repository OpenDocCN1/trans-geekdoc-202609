    ![](img/Figure-2.12.jpg)\n\n**图 2.12：** 预测密钥\n\n## 第 5 步：训练 API\n\nCustom Vision\
    \ Service 还提供了另一个称为训练 API（training API）的 API。训练 API 可将模型构建和训练集成到自定义应用程序中。\n\n\
    ## 第 6 步：创建控制台应用程序并运行：使用 Custom Vision 进行分类\n\n![](img/Image672.jpg)\n\n```csharp\n\
    namespace CustomVision\n{\n    class Program\n    {\n        private static void\
