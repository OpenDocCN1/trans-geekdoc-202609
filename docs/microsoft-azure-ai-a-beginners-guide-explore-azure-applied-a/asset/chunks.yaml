  trans: "\n\n## 10. 哪种服务可以使用文本作为输入并返回语言标识符？\n\n1. `Decision`\n2. `Analyze`\n3. `Key\
    \ Phrase Extraction`\n4. `Language Detection`\n\n# [答案]\n\n你拥有电影的图片以及观众离开电影院的图片\n\
