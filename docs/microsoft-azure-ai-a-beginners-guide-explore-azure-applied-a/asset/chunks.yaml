    \ identify the speakers based on the learning.\n* **Voice Assistants**: Voice\
    \ Assistants provide fast and reliable interaction between an assistant and a\
    \ device.\n\nSome of the use cases for voice assistants are given as follows:\n\
    \n![](images/Figure-4.29.jpg)\n**Figure 4.29:** Voice Assistants\n\nThe use cases\
    \ for voice assistants include creating a voice assistant for an app, creating\
    \ a touchless, voice-first experience to improve safety and support back-to-work\
    \ scenarios, activating with a custom key word etc.\n\n# Bing Web Search\n\nThe\
    \ Bing web search APIs can be used to build connected apps and services that can\
    \ integrate search capabilities like News Search, Web Search, Image Search. We\
    \ can build applications that can integrate images, web pages, location, news\
    \ without advertisements.\n\nThese APIs can also help in auto suggesting search\
    \ terms, filtering results by content type, highlighting, localizing search results\
    \ by market, region and or country and analyzing search metrics with Bing Statistics.\n\
    \n# Lab\n\n### Step 1: Go to Azure Portal. Search for Bing Search. It brings up\
