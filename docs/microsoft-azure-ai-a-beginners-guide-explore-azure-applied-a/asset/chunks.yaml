    In the last few chapters, we have read about various cognitive services available
    in Azure. We have also read about `ML.NET` and `Applied Azure AI Services`. This
    chapter focuses on how we can use `Azure Machine Learning Studio` using `Automated
    ML` and `Designer`. We will understand `ML Ops` and how to migrate from `Classic
    Azure ML Studio`. Towards the end of the chapter we will learn about `Accord.Net
    Machine Learning Framework`.


    # Structure


    The following topics will be covered in this chapter:


    * Understanding Azure Machine Learning Studio

    * Sample Lab using ML Studio Automated ML

    * Sample Lab using ML Studio Azure Designer

    * ML Ops - A brief overview

    * Migration from Classic Azure ML Studio - A brief overview

    * Azure ML library of algorithms

    * Understanding Accord.Net Machine Learning Framework


    # Objective


    After reading this chapter, the reader will be able to leverage `Azure Machine
    Learning Studio` to create models, score models, and run experiments and also
    learn about `Accord Framework`.


    # Azure Machine Learning Studio


    `Azure Machine Learning studio` is a project authoring and asset management portal
    which provides no-code and code-first experiences for creating and managing assets
    and resources like models, run logs, datastores, notebooks, experiments, pipelines,
    datasets and compute resources. From data ingestion to using the model as a service,
    to container orchestration, `Azure Machine Learning Services` helps in making
    it easier and faster.


    The `Azure Machine Learning studio` provides different ways to author machine
    learning projects.


    * **Notebooks**: We can leverage `Jupyter notebooks`. This has integration with
    `Jupyter Notebook Servers`.

    * **Azure Machine Learning designer**: `Azure Machine Learning Designer` provides
    a no code based approach which helps in developing ML applications using simple
    drag and drop without writing any code.

    * **Automated machine learning UI**: Supervised machine learning models like classification,
    regression and time series forecasting where training data and known labels are
    available are supported by the `Automated machine learning studio`. It finds the
    best model based on chosen metrics by iterating over combinations of hyperparameters
    and algorithms.


    Now we will get familiar with `Azure Machine Learning Studio` by working on two
    machine learning samples. We will go through sample labs using `Azure Machine
    Learning Studio` with two options one with `Automated ML` and one with `Designer`.


    # Sample lab using Azure ML Studio using Automated machine learning UI no-code
    approach


    Automated machine learning helps developers build ML models with large scale,
    efficiency, and productivity by automating time-consuming, iterative tasks of
    machine learning model development. Automated machine learning rapidly iterates
    over many combinations of algorithms and hyperparameters to help find the optimum
    model based on a success metric chosen.


    **Problem Statement**: In this sample, we will use a dataset which is populated
    with data from a local dataset. We will create a workspace, load the sample dataset,
    create an experiment and run the experiment. We will observe how the model returns
    results. In this lab, we will explore the No Code Option. We will use `Azure Machine
    Learning automated ML` to train a classification model, deploy and evaluate the
    model.


    In this lab, we will perform the following steps:


    **Step 1**: Create an Azure Machine Learning workspace.

    **Step 2**: Load Dataset.

    **Step 3**: Run an automated machine learning experiment using the `Dataset`.


    The following are the steps in detail:


    ### Step 1: Create an Azure Machine Learning workspace.


    A workspace is the foundational block for machine learning project. Following
    is the workspace screen.


    ![](images/Figure-8.1.jpg)

    **Figure 8.1:** Create


    Click on `Create`. This will bring up the below screen.


    ![](images/Figure-8.2.jpg)

    **Figure 8.2:** Create


    After creating the workspace, we will go to Azure Machine Studio. Following is
    the snapshot of the running experiment.


    ![](images/Figure-8.3.jpg)

    **Figure 8.3:** Running experiment


    ### Step 2: Load Dataset.


    We will load the dataset using the below shown options.


    ![](images/Figure-8.4.jpg)

    **Figure 8.4:** Running experiment


    Click on `Create`. This will bring up the below screen.


    ![](images/Figure-8.5.jpg)

    **Figure 8.5:** Create


    The following is the dataset screen.


    ![](images/Figure-8.6.jpg)

    **Figure 8.6:** Create


    Click on `Create`. This will bring up the below screen.


    ![](images/Figure-8.7.jpg)

    **Figure 8.7:** Create


    The following is the snapshot of the running experiment.


    ![](images/Figure-8.8.jpg)

    **Figure 8.8:** Create


    Following is the snapshot of the running experiment.


    ![](images/Figure-8.9.jpg)

    **Figure 8.9:** Create


    The following is the snapshot of the running experiment.


    ![](images/Figure-8.10.jpg)

    **Figure 8.10:** Create


    The following is the snapshot of the running experiment.


    ![](images/Figure-8.11.jpg)

    **Figure 8.11:** Create


    The following is the snapshot of the running experiment.


    ![](images/Figure-8.12.jpg)

    **Figure 8.12:** Running experiment


    The following is the snapshot of the running experiment.


    ![](images/Figure-8.13.jpg)

    **Figure 8.13:** Running experiment


    The following is the snapshot of the running experiment.


    ![](images/Figure-8.14.jpg)

    **Figure 8.14:** Running experiment


    The results are displayed as follows:


    ![](images/Figure-8.15.jpg)

    **Figure 8.15:** Results Window


    **Deploy the model**: We can deploy the model using the below shown options.


    ![](images/Figure-8.16.jpg)

    **Figure 8.16:** Deploy the Model


    # Sample lab using Azure ML Studio Azure Machine learning designer


    **Problem Statement**: We will run a sample application using `Azure ML Studio
    Machine Learning Designer`. In this sample, we will leverage AutoMobile pricing
    data. We will import and clean the data. We will train, test and evaluate the
    model.


    ### Step 1: Create a new pipeline.


    We will create a pipeline by navigating to `Azure Machine Learning Studio`.


    ```

    https://ml.azure.com/

    ``` (Wait, [https://ml.azure.com/](https://ml.azure.com/))


    Following is Azure Machine Learning Studio opening screen:


    ![](images/Figure-8.17.jpg)

    **Figure 8.17:** Azure ML Studio


    Click on `Designer`.


    This will bring up the below screen.


    ![](images/Figure-8.18.jpg)

    **Figure 8.18:** Create Pipeline Screen


    Click on the first tab.


    **Step 2**: Import Data

