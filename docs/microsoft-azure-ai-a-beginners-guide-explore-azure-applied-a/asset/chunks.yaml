  trans: "\n\n在过去的几个章节中，我们学习了 Azure 提供的各种认知服务。我们还学习了 `ML.NET` 和 `Applied Azure AI\
    \ Services`。本章重点介绍我们如何通过 `Automated ML`（自动化机器学习）和 `Designer`（设计器）使用 `Azure Machine\
    \ Learning Studio`。我们将理解 `ML Ops` 以及如何从 `Classic Azure ML Studio` 迁移。在章节结束时，我们将学习\
    \ `Accord.Net Machine Learning Framework`。\n\n# \n\n本章将涵盖以下主题：\n\n* 理解 Azure Machine\
    \ Learning Studio\n* 使用 ML Studio Automated ML 的示例实验\n* 使用 ML Studio Azure Designer\
    \ 的示例实验\n* ML Ops - 简述\n* 从 Classic Azure ML Studio 迁移 - 简述\n* Azure ML 算法库\n\
    * 理解 Accord.Net Machine Learning Framework\n\n# 目标\n\n读完本章后，读者将能够利用 `Azure Machine\
    \ Learning Studio` 创建模型、对模型进行评分并运行实验，同时也将了解 `Accord Framework`。\n\n# Azure Machine\
    \ Learning Studio\n\n`Azure Machine Learning studio` 是一个项目编制和资产管理门户，为创建和管理模型、运行日志、数据存储、笔记本、实验、管道、数据集和计算资源等资产及资源提供无代码代码优先体验。从数据导入到将模型作为服务，再到容器编排，`Azure\
    \ Machine Learning Services` 帮助这一切变得更加简单和快速。\n\n`Azure Machine Learning studio`\
    \ 提供了编写机器学习项目的不同方式。\n\n* **Notebooks**：我们可以利用 `Jupyter notebooks`。它与 `Jupyter\
    \ Notebook Servers` 集成。\n* **Azure Machine Learning designer**：`Azure Machine\
    \ Learning Designer` 提供了一种无代码的方法，帮助通过简单的拖拽无需编写任何代码即可开发 ML 应用。\n* **Automated machine\
    \ learning UI**：`Automated machine learning studio` 支持在可用训练数据和已知标签的情况下进行监督机器学习模型（如分类、回归和时间序列预测）。它通过迭代超参数和算法的组合，根据所选指标找到最佳模型。\n\
    \n现在，我们将通过操作两个机器学习示例来熟悉 `Azure Machine Learning Studio`。我们将通过使用 `Azure Machine\
    \ Learning Studio` 的两个选项来完成示例实验：一个使用 `Automated ML`，另一个使用 `Designer`。\n\n# 使用\
    \ Azure ML Studio 使用 Automated machine learning UI 无代码方法的示例实验\n\n自动化机器学习通过自动化机器学习模型开发中耗时的迭代任务，帮助人员构建大规模、高效且高产率的\
    \ ML 模型。自动化机器学习快速迭代算法和超参数的许多组合，以帮助根据所选的成功指标找到最优模型。\n\n**问题描述**：在示例中，我们将使用一个由本地数据集数据填充的数据集。我们将创建一个工作区，加载示例数据集，创建一个实验并运行实验。我们将观察模型如何返回结果。在本次实验中，我们将探索无代码选项。我们将使用\
    \ `Azure Machine Learning automated ML` 来训练分类模型、部署并评估模型。\n\n在实验中，我们将执行以下步骤：\n\n\
    **步骤 1**：创建一个 Azure Machine Learning 工作区。\n**步骤 2**：加载数据集。\n**步骤 3**：使用 `Dataset`\
    \ 运行自动化机器学习实验。\n\n以下是详细步骤：\n\n### 步骤 1：创建一个 Azure Machine Learning 工作区。\n\n工作区是机器学习项目的构建基块。以下是工作区界面。\n\
    \n![](img/Figure-8.1.jpg)\n**图 8.1：** 创建\n\n点击 `Create`。这将显示下面的屏幕。\n\n![](img/Figure-8.2.jpg)\n\
    **图 8.2：** 创建\n\n创建工作区后，我们将进入 Azure Machine Studio。以下是运行实验的快照。\n\n![](img/Figure-8.3.jpg)\n\
    **图 8.3：** 运行中的实验\n\n### 步骤 2：加载数据集。\n\n我们将使用下方所示的选项加载数据集。\n\n![](img/Figure-8.4.jpg)\n\
    **图 8.4：** 运行中的实验\n\n点击 `Create`。这将显示下面的屏幕。\n\n![](img/Figure-8.5.jpg)\n**图 8.5：**\
    \ 创建\n\n这是数据集界面。\n\n![](img/Figure-8.6.jpg)\n**图 8.6：** 创建\n\n点击 `Create`。这将显示下面的屏幕。\n\
    \n![](img/Figure-8.7.jpg)\n**图 8.7：** 创建\n\n以下是运行实验的快照。\n\n![](img/Figure-8.8.jpg)\n\
    **图 8.8：** 创建\n\n以下是运行实验的快照。\n\n![](img/Figure-8.9.jpg)\n**图 8.9：** 创建\n\n以下是运行实验的快照。\n\
    \n![](img/Figure-8.10.jpg)\n**图 8.10：** 创建\n\n以下是运行实验的快照。\n\n![](img/Figure-8.11.jpg)\n\
    **图 8.11：** 创建\n\n以下是运行实验的快照。\n\n![](img/Figure-8.12.jpg)\n**图 8.12：** 运行中的实验\n\
    \n以下是运行实验的快照。\n\n![](img/Figure-8.13.jpg)\n**图 8.13：** 运行中的实验\n\n以下是运行实验的快照。\n\
    \n![](img/Figure-8.14.jpg)\n**图 8.14：** 运行中的实验\n\n结果显示如下：\n\n![](img/Figure-8.15.jpg)\n\
    **图 8.15：** 结果窗口\n\n**部署模型**：我们可以使用下方所示的选项部署模型。\n\n![](img/Figure-8.16.jpg)\n\
    **图 8.16：** 部署模型\n\n# 使用 Azure ML Studio Azure Machine learning designer 的示例实验\n\
    \n**问题描述**：我们将使用 `Azure ML Studio Machine Learning Designer` 运行一个示例应用程序。在示例中，我们将利用汽车定价数据。我们将导入并清洗数据。我们将训练、测试并评估模型。\n\
    \n### 步骤 1：创建新的流水线。\n\n我们将通过导航到 `Azure Machine Learning Studio` 来创建流水线。\n\n[`ml.azure.com/`](https://ml.azure.com/)\n\
    \n以下是 Azure Machine Learning Studio 打开屏幕：\n\n![](img/Figure-8.17.jpg)\n**图 8.17：**\
    \ Azure ML Studio\n\n点击 `Designer`。\n\n这将显示下面的屏幕。\n\n![](img/Figure-8.18.jpg)\n\
    **图 8.18：** 创建流水线屏幕\n\n点击第一个选项页。\n\n**步骤 2**：导入数据\n\n"
