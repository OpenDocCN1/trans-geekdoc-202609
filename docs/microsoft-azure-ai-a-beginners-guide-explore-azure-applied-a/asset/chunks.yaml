    \ 集成。它提供安全建议，帮助检测、响应和防止安全威胁。\n\n3. **成本建议**：帮助减少虚拟机成本并识别管理多个 SQL 数据库的成本解决方案。\n\
    \n4. **性能建议**帮助提高应用程序性能。性能建议可以帮助以下领域：  \n    * 优化数据库性能\n    * 优化 Redis 性能\n  \
    \  * 优化 App Service 服务\n\n以下是为 Metrics Advisor 创建工作流的步骤：\n\n* 创建 Metrics Advisor\
