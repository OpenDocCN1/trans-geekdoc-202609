- raw: "**Step 1**: Collect Data and Load Data: ML.NET uses classes to define input\
    \ data models ML.NET supports loading data from data sources that include data\
    \ files In-memory collections JSON/XML Databases.\n\n**Step 2**: Create Pipeline\n\
    \nOnce the data is loaded, we need to prepare the input data. Input data is not\
    \ clean and some data will be missing. We need to clean the data to be in a format\
    \ expected by ML.NET algorithms.\n\n*   **Filtering**: We can use the filter options\
    \ to remove unconnected data by using filtering.\n\n*   **Missing values**: We\
    \ can deal with missing values by replacing them with a value like the mean value\
    \ or some default value.\n\n*   **Normalizers**: We can use normalization to standardize\
    \ features which are not on the same scale.\n\n*   **Min-Max normalization**:\
    \ We can use this to normalize values based on the observed minimum and maximum\
    \ values of the data.\n\n*   For example, we can normalize original income values\
    \ \\[100000, 200000\\] to \\[0.5,1\\] which will give an output value in the range\
    \ of 0-1.\n\n*   **Binning**: We can use binning to convert continuous values\
    \ like age into a discrete representation of the input like age brackets of 0\
    \ to 15 etc.\n\n*   **Categorical Data**: We can use `OneHotEncoding` method to\
    \ convert Non-numeric categorical data to a number.\n\n*   **Text Data**: We can\
    \ use FeaturizeText to convert text to a numerical vector. \n\nWe can use **Data\
    \ transformations** to prepare data for model training. Data transformations can\
    \ be chained with each transformation in the chain expecting and producing data\
    \ of specific types and formats.\n\n**Column mapping and grouping**: Given below\
    \ are options for column mapping and grouping:\n\n![](images/Figure-7.6.jpg)\n\
    \n**Figure 7.6:** Column Mapping and Grouping\n\n**Normalization and Scaling**:\
    \ Given below are options for normalization and scaling.\n\n![](images/Figure-7.7.jpg)\n\
    \n**Figure 7.7:** Normalization and Scaling\n\n*   **Conversions between data\
    \ types**: Includes functions to convert the type of an input column to a new\
    \ type, Map values to keys, map values to value, map values to vector, hash, and\
    \ more.\n\n*   **Text transformations**: Includes functions to transform a text\
    \ column into a float array of normalized ngrams and char-grams counts, split\
    \ one or more text columns into individual words, and so on. Image transformations\
    \ help convert an image to grayscale, convert a vector of pixels to ImageDataViewType,\
    \ and so on.\n\n*   Categorical data transformations help convert one or more\
    \ text columns into one-hotencoded vectors and convert one more text columns into\
    \ hash-based one-hot encoded vectors.\n\n*   Missing values help create a new\
    \ Boolean output column, the value of which is true when the value in the input\
    \ column is missing and create a new output column, the value of which is set\
    \ to a default value if the value is missing from the input column, and the input\
    \ value otherwise.\n\n**Step 3**: Train Model \n\nWe have to separate data into\
    \ two sets: training and testing. A large portion is used for training while a\
    \ small portion is used for testing. We can minimize the effects of data discrepancies\
    \ by using similar test and training data.\n\nCross-validation is a training and\
    \ model evaluation technique which splits the data into several partitions and\
    \ trains multiple algorithms on these partition to improve the robustness of the\
    \ training process. This is an effective method for training when the datasets\
    \ are small.\n\n**Step 4**: Improve Model After training we test the model whether\
    \ it is making the right predictions. We have to use the Evaluate method which\
    \ produces different metrics depending on the task that is performed.\n\nOnce\
    \ the training is complete, we can use the Save method to save the trained model\
    \ to a file leveraging the DataViewSchema of the input data.\n\nThere are various\
    \ ways to improve the model accuracy: \n\n*   **Reframe the problem**: Reframing\
    \ the problem statement itself might improve the model accuracy.\n\n*   **Provide\
    \ more data samples**: Providing more data samples improves the model performance.\n\
    \n*   **Add context to the data**: Creating the appropriate context around the\
    \ data points helps algorithms perform better.\n\n*   **Use meaningful data and\
    \ features**: Add data and features that help reduce noise using techniques like\
    \ **Permutation Feature Importance** (**PFI**).\n\n**Step 5**: Using the Model\n\
    \n![](images/Figure-7.8.jpg)\n\n**Figure 7.8:** Using the Model\n\n**Load Model**:\
    \ We can load models that are stored locally or remotely. For locally stored models,\
    \ we have to use the path of the file as input while for a model which is stored\
    \ remotely, we have to use a Stream.\n\n**Make Predictions**: The prediction pipeline\
    \ contains both the trained model as well as the data pre-processing transformations.\
    \ We can make single or batch predictions. We will now look at some of the samples\
    \ provided by ML.NET.\n\n# [Samples](#toc.xhtml#s112a)\n\nWe have many samples\
    \ based on Ml.NET which are available which include:\n\n![](images/Figure-7.9.jpg)\n\
    \n**Figure 7.9:** Samples\n\n# [Lab 1 - Creating Samples using ML.NET - Sentiment\
    \ Analysis](#toc.xhtml#s113a)\n\nIn this lab we will create a sample application\
    \ which will take input and perform sentiment analysis and return the result.\n\
    \n**Step 1**: Create a .NET Core Console Project. Open Visual Studio. Select `File`\
    \ | `New` | `Project` from the menu bar. In the New Project dialog, select the\
    \ Visual C# node followed by the .NET Core node. Then select the `Console App\
    \ (.NET Core)` project template.\n\n![](images/Figure-7.10.jpg)\n\n**Figure 7.10:**\
    \ Create New Project\n\nIn the `Name` text box, type “`AzureAI_SentimentAnalysis`”\
    \ and then select the `OK` button.\n\n![](images/Figure-7.11.jpg)\n\n**Figure\
    \ 7.11:** Configure Project\n\n**Step 2**: Install ML.NET Nuget Package by going\
    \ to ‘Manage Nuget’ packages.\n\n![](images/Figure-7.12.jpg)\n\n**Figure 7.12:**\
    \ Install ML.NET Nuget Package\n\n**Step 3**: Add a model class for sentiment.\
    \ Sample code is given as follows: \n\n`internal class AzureAISentiment `\n\n\
    `{`\n\n`[LoadColumn(0)] public string InputSentimentText; [LoadColumn(1)] [ColumnName(“Label”)]\
    \ `\n\n`public bool DetectedSentiment; `\n\n`}`\n\nAdd a new class `AzureAISentimentPrediction`\
    \ for output which will be used as the prediction class used after model training.\
    \ `PredictedValue` represents a Boolean value that represents the sentiment in\
    \ the string that is passed as input. `PredictedScore` represents the raw score\
    \ calculated by the model `PredictedProbability` – represents the calibrated score\
    \ if it represents a positive score.\n\n`public class AzureAISentimentPrediction\
    \ : AzureAISentiment `\n\n`{ `\n\n`[ColumnName(“PredictedLabel”)] `\n\n`public\
    \ bool PredictedValue { get; set; `\n\n`} `\n\n`public float PredictedProbability\
    \ `\n\n`{ `\n\n`get; set; `\n\n`} `\n\n` public float PredictedScore `\n\n`{`\n\
    \n`get; set; `\n\n`} `\n\n`}`\n\n**Step 4**: Initializing MLContext: MLContext\
    \ is the core object in ML.NET which is used to create a new ML.NET context which\
    \ will be shared across the objects.\n\nThe following code snippet initializes\
    \ the MLContext object.\n\n`MLContext mlContext = new MLContext();`\n\n**Step\
    \ 5**: Data Preparation and loading \n\n**Step 5.1**: Download sample data file.\
    \ **[https://github.com/mo20096258/AzureAI\\_SentimentAnalysis/blob/main/yelp\\\
    _labelled.txt](https://github.com/mo20096258/AzureAI_SentimentAnalysis/blob/main/yelp_labelled.txt)**\n\
    \n**Step 5.2**: Set the data Path \n\n`static readonly string testfilePath = Path.Combine(Environment.CurrentDirectory,\
    \ “Data”, “yelp_labelled.txt”); `\n\n**Step 5.3**: We will use `IDataView` class\
    \ for loading data from an input text file which contains two columns. First column\
    \ represents the input sentiment while the second column represents the sentiment.\
    \ Create the `LoadSentimentData` method for loading the test data and splitting\
    \ the dataset into train and test datasets.\n\n*   It loads the sentiment data.\n\
    \n*   It splits the dataset into train and test datasets.\n\n*   It returns the\
    \ split train and test datasets. "
