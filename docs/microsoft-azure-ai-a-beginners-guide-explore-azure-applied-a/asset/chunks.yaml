    # Azure Video Analyzer for Media


    Video Analyzer for Media helps users with getting detailed insights on videos
    which include summarized insights that provide an aggregated view of faces, emotions,
    and topics. These insights can be used for content creation such as trailers,
    enhancing search across a video library, providing relevant ads based on extracted
    insights, content moderation, and recommendations.


    It also helps in extracting insights from videos and enhancing content delivery
    experiences by detecting faces, spoken words, emotions and characters. Recommendations
    can be added and clips can be highlighted thus improving the engagement levels.
    Furthermore, workflows can be triggered when the Video Analyser sees, detect or
    hears what the user is looking for.


    This helps with face detection, celebrity identification, custom face recognition,
    thumbnail extraction, visual text recognition, object identification, visual content
    moderation, shot detection, black frame detection, key frame detection, audio
    analysis, keyword extraction, topic inference, sentiment analysis, emotion detection,
    speech to text conversion, language detection, noise reduction, speaker identification,
    and speaker statistics.


    Some of the scenarios where insights provided by Video Analyser are given as follows:


    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Azure Video Analyzer for Media


    * **Deep search**: Insights provided by Azure Video Analyser can help enhance
    the search experience.

    * **Content creation**: We can use social media content, highlight reels, or news
    clips and create trailers based on the insights Video Analyzer for Media provides.

    * **Accessibility**: The transcription and translation provided by Video Analyzer
    for Media can be used to enable accessibility to users.

    * **Monetization**: By delivering relevant ads, Video Analyzer for Media can be
    leveraged to help increase the value of videos and create revenue opportunities.

    * **Content moderation**: We can use content moderation to alert users or block
    objectionable content/videos thus making the content safe.

    * **Recommendations**: By highlighting the relevant video moments to users video
    insights can be used to improve user engagement.


    The diagram below gives a view on how Azure Media Analyser works:


    ![](images/Figure-5.5.jpg)


    **Figure 5.5:** Azure Immersive Reader


    Image from: **[https://docs.microsoft.com/en-us/azure/azure-video-analyzer/video-analyzer-for-media-docs/video-indexer-overview](https://docs.microsoft.com/en-us/azure/azure-video-analyzer/video-analyzer-for-media-docs/video-indexer-overview)**


