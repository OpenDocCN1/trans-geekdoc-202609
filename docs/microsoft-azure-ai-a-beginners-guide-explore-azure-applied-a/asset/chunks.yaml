    \ `REST API` 定制实例\n\n# [Azure Immersive Reader]\n\nAzure Immersive Reader 帮助提高语言学习者、新读者以及如阅读障碍等学习障碍者的理解能力。它帮助让阅读变得更容易。Immersive\
    \ Reader 库可以用于改进 Web 应用程序。\n\nImmersive Reader 是一个独立的 Web 应用程序，可以通过调用 Immersive\
    \ Reader 库通过 iframe 集成到 Web 应用程序中。Immersive Reader 库处理 iframe 与 Immersive Reader\
    \ 后端服务的交互。\n\nAzure Immersive Reader 的某些功能列如下：\n\n![](img/Figure-5.3.jpg)\n\n\
    **图 5.3:** Azure Immersive Reader 功能\n\n1. **隔离内容**：这有助于提高可读性\n2. **显示图片**：它可以为常用词显示图片\n\
