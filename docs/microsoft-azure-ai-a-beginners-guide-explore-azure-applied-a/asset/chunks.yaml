    \ Translation**: This service helps translate in real time, as users are speaking,\
    \ speeches from one language to another. It supports more than 30 languages.\n\
    \n*   **Speaker Recognition**: This is still in preview mode. It helps identify\
    \ speeches from the person and identify the speakers based on the learning.\n\n\
    *   **Voice Assistants**: Voice Assistants provide fast and reliable interaction\
    \ between an assistant and a device.\n\nSome of the use cases for voice assistants\
    \ are given as follows:\n\n![](images/Figure-4.29.jpg)\n\n**Figure 4.29:** Voice\
    \ Assistants\n\nThe use cases for voice assistants include creating a voice assistant\
    \ for an app, creating a touchless, voice-first experience to improve safety and\
    \ support back-to-work scenarios, activating with a custom key word etc.\n\n#\
    \ [Bing Web Search](#toc.xhtml#s51a)\n\nThe Bing web search APIs can be used to\
    \ build connected apps and services that can integrate search capabilities like\
    \ News Search, Web Search, Image Search. We can build applications that can integrate\
    \ images, web pages, location, news without advertisements.\n\nThese APIs can\
    \ also help in auto suggesting search terms, filtering results by content type,\
    \ highlighting, localizing search results by market, region and or country and\
    \ analyzing search metrics with Bing Statistics.\n\n# [Lab](#toc.xhtml#s52a)\n\
    \n**Step 1**: Go to Azure Portal. Search for Bing Search. It brings up the following\
    \ Window:\n\n![](images/Figure-4.30.jpg)\n\n**Figure 4.30:** Azure Portal-Bing\
    \ Search\n\n**Step 2**: The deployment success as given below comes up once the\
    \ resource is deployed:\n\n![](images/Figure-4.31.jpg)\n\n**Figure 4.31:** Deployment\
    \ Window\n\n**Step 3**: Click on ‘`Go To Resource`’ button and add a Search Term\
    \ and click on `Search`:\n\n![](images/Figure-4.32.jpg)\n\n**Figure 4.32:** Add\
    \ a Search Term\n\n**Step 4**: The Search results appear as follows:\n\n![](images/Figure-4.33.jpg)\n\
    \n**Figure 4.33:** Search Results Window\n\n**Step 5**: For programmatic invocation\
    \ we can get the Key and use it in the code. The Key can be obtained as shown\
    \ below:\n\n![](images/Figure-4.34.jpg)\n\n**Figure 4.34:** Getting the key\n\n\
    Now we will look at Docker Containers. \n\n# [Azure Cognitive Services containers](#toc.xhtml#s53a)\n\
    \nIn addition to the cloud version of APIs and services Azure also provides Docker\
    \ containers that let us use the same APIs on premise. These can be leveraged\
    \ in scenarios where data compliance, security requirements etc hinder the usage\
    \ of cloud APIs. This helps in creation of a portable application architecture.\
    \ This can be deployed on-premises, on Azure and the edge.\n\nGiven below is a\
    \ set of available Docker containers.\n\n![](images/Figure-4.35.jpg)\n\n**Figure\
    \ 4.35:** Available Docker Containers\n\n# [Conclusion](#toc.xhtml#s54a)\n\nIn\
    \ this chapter, we have looked at the basics of using Decision, Language, Speech\
    \ and Web Search Services of Azure Cognitive Services and Docker Containers. We\
    \ have also learned about Azure Logic Apps and Azure Functions. In the next chapter,\
    \ we will learn about Azure Applied Services.\n\n# [Multiple Choice Questions](#toc.xhtml#s55a)\n\
    \nThought Experiment - This will be a set of questions around 7-10 to test the\
    \ knowledge of the concepts learned in the chapter. \n\n# [Questions](#toc.xhtml#s56a)\n\
    \n1.  **Which service is used to make good decisions using Decision APIs to analyze\
    \ the data and to derive insights from the same.** \n\n    1.  Decision \n\n \
    \   2.  Analyse \n\n    3.  Detect \n\n    4.  Insights\n\n2.  **Which service\
    \ can be used to integrate search capabilities like Web Search, News Search, Image\
    \ Search into custom applications? ** \n\n    1.  Decision \n\n    2.  Analyze\
    \ \n\n    3.  Web Search\n\n    4.  Image Search\n\n3.  **Which service can be\
    \ used to identify speeches from the person and identify them accordingly?** \n\
    \n    1.  Speaker Recognition\n\n    2.  Speech To Text\n\n    3.  Text To Speech\n\
    \n    4.  Voice Assistant\n\n4.  **Which service is used to Gain customer insights\
    \ with call center transcription, improve experiences with voice-enabled assistants,\
    \ capture key discussions in meetings and more. ** \n\n    1.  Speaker Recognition\n\
    \n    2.  Speech To Text\n\n    3.  Text To Speech\n\n    4.  Voice Assistant\n\
    \n5.  **Which service is used to Give app a voice** \n\n    1.  Speaker Recognition\n\
    \n    2.  Speech To Text\n\n    3.  Text To Speech\n\n    4.  Voice Assistant\n\
    \n6.  **Which service can be used to translate audio from more than 30 languages\
    \ ? ** \n\n    1.  Speech Translation\n\n    2.  Speech to Language\n\n    3.\
    \  Voice Assistant\n\n    4.  Text To Speech\n\n7.  **Which service can be used\
    \ to create apps and services that speak conversationally ? ** \n\n    1.  Speech\
    \ Translation\n\n    2.  Speech to Language\n\n    3.  Voice Assistant\n\n   \
    \ 4.  Speech To Text\n\n8.  **Which service Azure Content Moderator cognitive\
    \ service verifies and flags text, image, and video content for material that\
    \ is offensive with labels? ** \n\n    1.  Azure Content Sanitizer\n\n    2. \
    \ Analyze \n\n    3.  Web Search\n\n    4.  Azure Content Moderator\n\n9.  **Which\
    \ API can be used to extract a list of strings denoting the key talking points\
    \ in the input text. ? ** \n\n    1.  Decision \n\n    2.  Analyze \n\n    3.\
    \  Key Phrase Extraction\n\n    4.  Language Detection"
