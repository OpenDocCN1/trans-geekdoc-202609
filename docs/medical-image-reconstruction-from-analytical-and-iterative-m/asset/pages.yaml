  md: '# # 6.11 Worked examples


    **Example 1:** For an arbitrary matrix A, its generalized inverse matrix A+ must
    satisfy the following four properties:


    +   - AA*A = A, (6.104)

    +   - A*AA* = A, (6.105)

    +   - (A*A)* = A*A, (6.106)

    +   - (AA*)* = AA*. (6.107)


    Here M* is the Hermitian transpose (also called conjugate transpose) of a matrix
    M. For a real matrix, it is simply the transpose. In the following, we assume
