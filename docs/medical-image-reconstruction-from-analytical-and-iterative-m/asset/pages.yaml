    A^T = (A^T A)^-1 A^T = A* = Right (6.109)


    Property 3:

    Left = (A* A)^T = ((A^T A)^-1 A^T A)^T = ((A^T A)^-1 (A^T A))^T = I (6.110)

    Right = A* A = (A^T A)^-1 A^T A = (A^T A)^-1 (A^T A) = I (6.111)


    Property 4:

    Left = (AA*)^T = (A (A^T A)^-1 A^T)^T = A ((A^T A)^-1)^T A^T = A ((A^T A)^T)^-1
    A^T = A (A^T A)^-1 A^T = AA* = Right (6.112)


    Case 2: If (AA^T)^-1 exists, A+ = A^T (AA^T)^-1.'
