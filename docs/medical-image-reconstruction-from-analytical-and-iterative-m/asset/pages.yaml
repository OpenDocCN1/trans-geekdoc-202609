    b(x,y) = \int_{-\pi/2}^{\pi/2} \mathbf{H}p(s, \theta)|_{s=x \cos \theta + y \sin
    \theta} d\theta


    where the Hilbert transform is with respect to the variable s. Let the Fourier
    transform of p(s, \theta) be P(\omega, \theta). The central slice theorem applied
    to this particular problem is shown in Figure 2.16, where P(\omega, \theta) is
    multiplied by either i or -i before putting it in the 2D Fourier domain.


    An equivalent way to do this backprojection is to backproject p(s, \theta), then
    multiply the entire left half (\omega_x, \omega_y) plane by i and multiply the
    entire right half (\omega_x, \omega_y) plane by -i. This multiplication action
    can be achieved by performing line-by-line 1D Hilbert transform in the x direction.
    Thus, we have


    \mathbf{H}_x \int_{-\pi/2}^{\pi/2} p(s, \theta)|_{s=x \cos \theta + y \sin \theta}
    d\theta = \int_{-\pi/2}^{\pi/2} \mathbf{H}_s p(s, \theta)|_{s=x \cos \theta +
    y \sin \theta} d\theta


    In the following, we will briefly introduce the concept of the finite Hilbert
    transform, which plays an important role in the ROI reconstruction with truncated
