    Next, we step on the rotating platform and apply a new magnetic field $\vec{B}_1$,
    orthogonal to the main magnetic field $\vec{B}_0$. On the rotating platform, the
    vector $\vec{M}$ does not feel the existence of the main field $\vec{B}_0$; it
