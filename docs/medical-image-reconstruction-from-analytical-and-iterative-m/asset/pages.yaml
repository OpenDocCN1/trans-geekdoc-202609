    # ## 9.4 Convolutional neural network (CNN) as a matched filter for identification


    The main purpose of a neural network according to Section 9.2 is to build a universal
    model that maps an n-tuple to an m-tuple. Each element of the m outputs is a function
    of the n input variables. This mapping is continuous with respect to the n input
    variables. The CNNs do not try to fulfill the same purpose. CNNs are good at pattern
    recognition.


    In the machine learning community, the “convolution” is, in fact, implemented
    as the cross-correlation. The 1D convolution and cross-correlation are expressed
    in eqs. (9.24) and (9.25), respectively.


    ```

    Convolution: \(y(t) = \int x(\tau)h(t-\tau)d\tau, \quad (9.24)\)

    Cross – correlation: \(y(t) = \int x(\tau)h(t+\tau)d\tau. \quad (9.25)\)

    ```


    Let us consider a task, in which you are given a long string (an \(n\)-tuple \(\overline{x}\))
    and a short pattern (a \(k\)-tuple \(\overline{h}\)). The size \(n\) of the input
    data \(\overline{x}\) is much larger than the size \(k\) of the pattern \(\overline{h}\).
    The cross-correlation operation is a procedure that moves \(\overline{h}\) over
    \(\overline{x}\) and calculates the inner products to find a match. When a match
    is found, the cross-correction will produce a spike, which is a larger value than
    others. The effectiveness of the cross-correlation in pattern recognition is illustrated
    by the following 1D toy example.


