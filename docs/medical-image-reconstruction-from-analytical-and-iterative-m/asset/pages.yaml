    # 6.12 Summary


    +   The main difference between an analytic image reconstruction algorithm and
    an iterative image reconstruction algorithm is in image modeling. In an analytic
    algorithm, the image is assumed to be continuous, and each image pixel is a point.
    The set of discrete pixels is for display purpose. We can make those display points
    any way we want. However, in an iterative algorithm, a pixel is an area, which
    is used to form the projections of the current estimate of the image. The pixel
    model can significantly affect the quality of the reconstructed image.


    +   Another difference between an analytic image reconstruction algorithm and
    an iterative image reconstruction algorithm is that the analytic algorithm tries
    to solve an integral equation, while the iterative algorithm tries to solve a
    system of linear equations.


    +   A system of linear equations is easier to solve than an integral equation.
    This allows the linear equations to model more realistic and more complex imaging
    geometry and imaging physics. In other words, the iterative algorithm can solve
    a more realistic imaging problem than an analytic algorithm. As a result, the
    iterative algorithm usually provides a more accurate reconstruction.


    +   Iterative algorithms are used to minimize an objective function. This objective
    function can effectively incorporate the noise in the measurement. Currently,
    analytic algorithms control noise by frequency windowing.


    +   The iterative ML-EM and OS-EM algorithms are most popular in emission tomography
    image reconstruction. They assume Poisson’s noise statistics. The transmission
    data counterparts exist.


    +   Even though noise is modeled in the objective function, the reconstructed
    image is still noisy. There are five methods to control noise.


    +   The first method is to stop the iterative algorithm early before it converges.
    This simple method has a drawback that it may result in an image with nonuniform
    resolution. One remedy is to iterate till convergence and apply a post low-pass
    filter to suppress the noise.


    +   The second method is to replace the flat, nonoverlapping pixels by smooth,
    overlapping pixels to represent the image. The method can remove the artificially
    introduced high-frequency components by the flat, nonoverlapping pixels in the
    image. A drawback of using smooth, overlapping pixels is the increased computational
    complexity. One remedy is to use the traditional flat, nonoverlapping pixels and
    apply a low-pass filter to backprojected images.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - The third method is to model more accurate imaging geometry and physics
    in the projector/backprojector pair. The aim of this method is to reduce the deterministic
    discrepancy between the projection model and the measured data.


    +   - The fourth method is to use the correct noise model to set up an objective
    function. The author''s personal belief is that the noise model that is based
    on the joint probability density function is not very critical. You can have a
    not-so-accurate noise model (i.e., a not-so-accurate joint probability density
    function) but you must have the accurate variance. The important part is to incorporate
    a correct measurement noise variance to weigh the data. It is not as important
    to worry about whether the noise is strictly Gaussian, strictly Poisson, and so
    on.


    +   - The fifth method is the use of prior knowledge. If the projection data do
    not carry enough information about the object, due partially to insufficient measurements
    and partially to noise, prior knowledge about the object can supplement more information
    about the object and make the iterative algorithm more stable. Be careful that
    if the prior knowledge is not really true, it can mislead the algorithm to converge
    to a wrong image.


    +   - The readers are expected to understand how the system of imaging equations
    is set up and how the iterative ML-EM algorithm works in this chapter.


