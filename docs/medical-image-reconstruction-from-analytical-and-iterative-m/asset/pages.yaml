- pgno: 33
  md: '# # 2 Parallel-beam image reconstruction


    This chapter introduces the central slice theorem, which is the function of tomography.
    This theorem relates the two-dimensional (2D) image with its one-dimensional (1D)
    projections in the Fourier domain. From this theorem, many image reconstruction
    algorithms are derived. Among these algorithms, the filtered backprojection (FBP)
    algorithm is the most popular one, which consists of a ramp-filtering step and
    a backprojection step. The filtering can be implemented as a multiplication in
    the Fourier domain or as a convolution in the spatial domain. A special topic
    of region-of-interest (ROI) reconstruction with truncated projections is included
    in this chapter.


    # ## 2.1 Fourier transform


    The concept of the Fourier transform is based on the fact that it is possible
    to form a function p(s) as a weighted summation of a series of sine and cosine
    terms of various frequencies, ω, with a weighting function P(ω). You can use a
    prism to decompose the sunlight into a spectrum of different colors; you can also
    reproduce the original light by recombining the spectrum of different colors (see
    Figure 2.1).


    ![](img/dd555effd38151c67af30d84800c554a_33_0.png)


    Fig. 2.1: The white light can be decomposed into color lights, which can be converted
    back to the original white light.


    The weighting function P(ω) for each frequency ω is called the Fourier transform
    of p(s). One can easily use mathematical formulas to find P(ω) from p(s) and to
    recover p(s) from P(ω). If you know one function (either p(s) or P(ω)), you know
    the other. In this pair, one function is denoted by a lowercase letter with a
    variable s, and the other function is denoted by an uppercase letter with a variable
    ω.


    A Fourier transform pair p(s) and P(ω) is shown in Figure 2.2, where P(ω) is the
    Fourier transform of p(s). The function P(ω) tells us that the triangle function
    p(s) has rich low-frequency components because the central lobe has a large amplitude.
    As the frequency gets higher (i.e., as |ω| gets larger), the amplitude of the
    lobes becomes smaller. We also see some notches in P(ω); those notched frequencies
    are not in the triangle'
