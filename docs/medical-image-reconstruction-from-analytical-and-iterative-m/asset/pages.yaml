    In SPECT imaging with a nonuniform attenuator \(\mu(x, y)\), if attenuation correction
    is required, a transmission scan should be performed in addition to the emission
    scan. The transmission projections are used to reconstruct the attenuation map
    \(\mu(x, y)\). The following is a reconstruction algorithm that can correct for
    the nonuniform attenuation. Despite its frightening appearance, it is merely an
    FBP algorithm:


    ```

    \(f(x, y) = \frac{1}{4\pi^2} Re \left\{ \int_0^{2\pi} \frac{\partial}{\partial
    q} \left[ e^{a_d(q(t) - \theta, \theta)} \int_{-\infty}^\infty \frac{(e^\theta
    p)(l, \theta)}{q - l} dl \right] \bigg|_{q=s} d\theta \right\}\) (4.29)

    ```


