    v^2} \tan \theta\), \(\cos \theta = \left( \sqrt{D^2 + v^2} / \sqrt{D^2 + u^2
    + v^2} \right)\), and \(du/d\theta = \left( (D^2 + v^2) / \cos^2 \theta \right)\),
    and we obtain'
