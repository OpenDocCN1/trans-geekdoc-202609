    With minor changes to the ML-EM algorithm, the ordered subset version of it can
    be readily obtained as the OS-EM algorithm:


    ```

    x_j^{\text{next}} = \frac{x_j^{\text{current}}}{\sum_{i \in S_k} a_{ij}} \sum_{i
    \in S_k} a_{ij} \frac{p_i}{\sum_j a_{ij}x_j^{\text{current}}},

    ```


    where \(S_k\) represents the \(k\)th subset of the projections.'
