    # ## 4.3 Noise propagation in reconstruction


    In this section, we will see how the noisy data make the image noisy. A filtered
    back-projection (FBP) algorithm can be considered as a linear system. The input
    is the projection data and the output is the reconstructed image. The noise in
    the output is related to the noise in the input.


    # ### 4.3.1 Noise variance of emission data


    Measured projections are noisy. Due to the nature of photon counting, the measurement
    noise roughly follows the Poisson statistics. A unique feature of Poisson random
    variable _p_ is that the mean value \(\lambda = E(p)\) and the variance \(\sigma^2
    = \text{Var}(p)\) are the same. In'
