    # 9.9 Perspectives


    The original theoretical foundation of neural networks is to treat everything
    as an n-

    tuple to m-tuple mapping. The universal approximation theory is the backbone to
    sup-

    port the field of neural network research. A neural network with sufficient parame-

    ters is able to approximate this mapping. Machine learning is to approximate this

    underlying function (mapping) through a large amount of data.


    In practice, however, the universal approximation theory may not be needed. To
    ap-

    proximate an n-D function on [0,1]^n using a coarse (sparse) sampling of 10 samples
    in

    each dimension, a model may need as many as 10^n parameters. For a small image
    of size

    32 × 32, we need as many as 10^1024 parameters. This number of 10^1024 is astronomical!


    The success of neural networks in classification tasks may be credited to the
    inner

    product operation. In Section 9.4, we have used the matched filter perspective
    to ex-

    plain how a CNN can be used to recognize a pattern (for example, a bicycle). The
    appli-

    cation of a matched filter is the same as the inner product operation, where one

    operand is an input image and the other operand is a desired image pattern. The
    main

    difference between a fully connected (also known as dense) neural network layer
    and a

    CNN layer is that a CNN kernel (i.e., the desired pattern) traverses all over
    the input

    image and looks for a match. In a dense layer, nothing moves. We now use the MNIST'
