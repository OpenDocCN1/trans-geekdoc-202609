- pgno: 14
  md: '# # 1 Basic principles of tomography


    This is an introductory chapter that presents the fundamental concepts in tomography.
    It first defines what the tomography is and shows how a tomographic image can
    be obtained from its measurements using two simple examples. The concept of projection
    is then explained. Next, the filtered backprojection (FBP) image reconstruction
    method is introduced using a point source example. Finally, the concept of backprojection
    is discussed.


    # ## 1.1 Tomography


    The Greek word tomos means a section, a slice, or a cut. Tomography is the process
    of imaging a cross section. For example, if you are given a watermelon and would
    like to see inside, the easiest way to do so is to cut it open (Figure 1.1). Clearly,
    this approach to obtain a cross-sectional image is not a good idea in medicine.
    Nobody wants to be cut open in order to see what is inside.


    ![](img/dd555effd38151c67af30d84800c554a_14_0.png)


    Fig. 1.1: Cutting open to see what is inside.


    Let us look at another example. You are visiting a small park, which is closed
    for maintenance. You walk around the park and take a few pictures of it. After
    you get home, you can use your pictures to make a map of the park. To make your
    life easier, let us assume that there are two large trees in the park, and you
    take two pictures from the east and the south (Figure 1.2, left). Using these
    two pictures, you can map out where these two trees are (Figure 1.2, right). This
    can be done by positioning the pictures at the original orientations at which
    the pictures were taken, drawing a line from each tree, and finding the intersections.
    If you have enough pictures, it is not hard to find out where the trees are.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/dd555effd38151c67af30d84800c554a_15_0.png)


    Fig. 1.2: Reconstruct a map from two pictures.


    Tomography is a mathematical problem. Let us do a fun mathematical exercise here.
    We have a 2 × 2 matrix. We do not tell you what it is yet. Here are the hints:
    The sum of the first row is 5, the sum of the second row is 4, the sum of the
    first column is 7, and the sum of the second column is 2 (see Figure 1.3). Now,
    you figure out what this 2 × 2 matrix is.


    ![](img/dd555effd38151c67af30d84800c554a_15_1.png)


    Fig. 1.3: A 2 × 2 matrix puzzle.


    You can solve this puzzle by setting up a system of linear equations with the
    matrix entries as unknowns:


    x₁ + x₂ = 5,   x₃ + x₄ = 4,   x₁ + x₃ = 7,   and   x₂ + x₄ = 2.   (1.1)


    Solving these equations, you will get'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'x₁ = 3, x₂ = 2, x₃ = 4, and x₄ = 0. (1.2)


    Congratulations! You have just mathematically solved a tomography problem. Usually,
    a tomography problem is solved mathematically; hence, the term “computed tomography”
    (CT). The row sum or column sum in this example can be generalized as a ray sum,
    a line integral, or a projection. The procedure to produce a tomographic image
    from projections is called image reconstruction.


    What if the tomography problem gets more complicated? If there are many more trees
    in the park, taking only two pictures may not provide us enough information to
    map out the park. If the matrix size is larger than 2 × 2, the row sum and column
    sum alone do not form enough equations to solve for the matrix entries.


    We need more views! For the matrix identification case, we need to sum the matrix
    diagonally at various angles. In turn, more sophisticated mathematics is required
    to solve the tomography problem.


    # 1.2 Projection


    In order to understand the concept of projection (ray sum, line integral, or Radon
    transform), we will present more examples here.


    In the first example, the object is a uniform disk on the x–y plane, the center
    of the disk is at the origin, and the (linear) density of the disk is ρ (see Figure
    1.4). The projection (i.e., the line integral) of this object can be calculated
    as the chord length t times the linear density ρ, that is,


    p(s) = ρt = 2ρ√(R²−s²) if |s| < R; p(s) = 0 otherwise. (1.3)


    In this particular example, the projection p(s) is the same for any view angle
    θ, which is the orientation of the detector.


    If the object is more complicated, the projection p(s, θ) is angle θ dependent
    (see Figure 1.5).


    In the next example we use a point source on the y-axis to further illustrate
    the angle θ dependency of the projection p(s, θ) (see Figure 1.6). Here we pay
    attention to the location s of the spike on the one-dimensional detector, which
    can be evaluated as


    s = r sin θ. (1.4)


    This is a sine function with respect to θ. If you display this point source projection
    data set p(s, θ) in the s–θ coordinate system (see Figure 1.6, right), you will
    see the trajectory of a sine wave. Because of this observation, people refer to
    the projection data set as a sinogram.


    The fourth example is a discrete object of a 2 × 2 matrix, similar to that in
    Figure 1.3. The detector is also discrete with four detector bins (see Figure
    1.7). Each matrix element'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/dd555effd38151c67af30d84800c554a_17_0.png)


    ![](img/dd555effd38151c67af30d84800c554a_17_1.png)


    Fig. 1.4: The line integral across the disk is the length of a chord times the
    density.


    ![](img/dd555effd38151c67af30d84800c554a_17_2.png)


    Fig. 1.5: The projections are usually different at a different view angle.'
  merge: -1
