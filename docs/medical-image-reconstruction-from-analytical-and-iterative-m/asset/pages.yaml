  md: 'Proof. We start with the definition of the 1D Fourier transform:


    $$P(\omega) = \int_{-\infty}^{\infty} p(s) e^{-2\pi i s \omega} ds,$$ (2.26)


    then use the definition of \(p(s, \theta)\) (see Section 1.5), obtaining


    $$P(\omega, \theta) = \int_{-\infty}^{\infty} \left[ \int_{-\infty}^{\infty} \left[
    \int_{-\infty}^{\infty} f(x,y) \delta(x \cos \theta + y \sin \theta - s) dx dy
    \right] e^{-2\pi i s \omega} ds \right.$$ (2.27)


    Changing the order of integrals yields


    $$P(\omega, \theta) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f(x,y) \left[
    \int_{-\infty}^{\infty} \delta(x \cos \theta + y \sin \theta - s) e^{-2\pi i s
    \omega} ds \right] dx dy.$$ (2.28)


    Using the property of the \(\delta\) function, the inner integral over \(s\) can
    be readily obtained, and we have


    $$P(\omega, \theta) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f(x,y) e^{-2\pi
    i (x \cos \theta + y \sin \theta) \omega} dx dy,$$ (2.29)


    that is,


    $$P(\omega, \theta) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f(x,y) e^{-2\pi
    i (x u + y v)}|_{u=\omega \cos \theta, v=\omega \sin \theta} dx dy.$$ (2.30)


    Finally, using the definition of the 2D Fourier transform yields


    $$P(\omega, \theta) = F(\omega_x, \omega_y)|_{\omega_x=\omega \cos \theta, \omega_y=\omega
    \sin \theta}.$$ (2.31)


    In the polar coordinate system, the central slice theorem can be expressed as


    $$P(\omega, \theta) = F_{\text{polar}}(\omega, \theta).$$ (2.32)


    # 2.6.4 Derivation of the FBP algorithm


    We start with the 2D inverse Fourier transform in polar coordinates


    $$f(x, y) = \int_{0}^{2\pi} \int_{0}^{\infty} F_{\text{polar}}(\omega, \theta)
    e^{2\pi i (\omega x \cos \theta + y \sin \theta)} \omega d\omega d\theta.$$ (2.33)


    Because \(F_{\text{polar}}(\omega, \theta) = F_{\text{polar}}(-\omega, \theta
    + \pi)\), we have'
