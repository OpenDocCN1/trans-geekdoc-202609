    can be stated as


    **F**(*f* * *g*) = **F**(*f*) × **F**(*g*). (2.12)


    # 2.6.2 The Hilbert transform and the finite Hilbert transform


    The Hilbert transform is less well known than the Fourier transform. Unlike the
    Fourier transform that converts a real function into a complex function, the Hilbert
    transform converts a real function into another real function.


    In this section, we use **H** to denote the Hilbert transform operator. If you
    apply the Hilbert transform twice, you get the original function back, except
    for a sign change, that is


    **H**(**H**_f_) = **H**<sup>2</sup>_f_ = -_f_. (2.13)


    In other words, the inverse Hilbert transform is the negative value of the Hilbert
    transform.


    A real function and its Hilbert transform are orthogonal. If _g_ = **H**_f_, then


    \(\int_{-\infty}^{\infty} f(t)g(t)dt = 0.\) (2.14)


    For example, the Hilbert transform of cos(_t_) is sin(_t_). The Hilbert transform
    of sin(_t_) is -cos(_t_).


    The Hilbert transform can be defined in the Fourier domain. Let the Fourier transform
    of a real function _f_(_t_) be \(F(\omega)\), the Hilbert transform of _f_(_t_)
    be _g_(_t_), and the Fourier transform of _g_(_t_) be \(G(\omega)\), then


    \(G(\omega) = -i\operatorname{sgn}(\omega)F(\omega),\) (2.15)


    with \(i = \sqrt{-1}\) and \(\operatorname{sgn}(\omega)\) being the signum:


    \(\operatorname{sgn}(\omega) = \begin{cases} 1, & \omega > 0 \\ 0, & \omega =
    0 \\ -1, & \omega < 0. \end{cases}\) (2.16)


    Since the magnitude of \(-i\operatorname{sgn}(\omega)\) is 1, the Hilbert transform
    is an application of an all-pass filter with a \(\pm 90^\circ\) phase shift.


    Equivalently, the Hilbert transform can also be expressed as convolution with
    the convolution kernel'
