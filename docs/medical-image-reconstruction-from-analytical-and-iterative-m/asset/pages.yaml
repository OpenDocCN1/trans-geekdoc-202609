    # 1.7 Summary


    +   - Tomography is a process of taking projection data and converting the data
    into cross-sectional images. Projection data from multiple views are required.

    +   - A projection is a line integral (or ray sum, Radon transform) of an object.
    Projection data are acquired with detectors. Objects overlap on the detectors.

    +   - Backprojection is a superposition procedure and it sums the data from all
    projection views. Backprojection evenly distributes the projection domain data
    back along the same lines from which the line integrals were formed.

    +   - Image reconstruction is a mathematical procedure that dissolves the overlapping
    effect in the projection data and recreates the original image with nonoverlapped
    objects. A mathematical procedure is called an algorithm.

    +   - Dirac''s \(\delta\)-function usually acts as a point source in algorithm
    development.

    +   - The readers are expected to understand two main concepts in this chapter:
    projection and backprojection.


