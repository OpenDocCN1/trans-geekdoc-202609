    # 6.4 ML-EM algorithms


    We do not have to use a least-squares objective function. There are many different
    ways to set up an objective function. If we use the Poisson noise model or simply
    use the nonnegativity constraint, we will get a special objective function. By
    minimizing that special objective function, a multiplicative updating algorithm
    known as the ML-EM algorithm is derived and can be symbolically expressed as


    ```

    \(\bar{x}^{\text{next}} = \bar{x}^{\text{current}} \frac{\text{Backproject}\left\{
    \text{Measurement} / \text{Project}\left(\bar{x}^{\text{current}}\right) \right\}}{\text{Backproject}\left\{
    \bar{1} \right\}}, \quad (6.29)\)

    ```


    where \(\{\bar{1}\}\) is a vector with elements of 1s. The size of the vector
    is that of the projection data vector. In this algorithm, the data discrepancy
    is calculated as a ratio instead of a difference. The distinguishing feature of
    this algorithm is its nonnegativity. If the initial image \(\bar{x}^0\) does not
    contain any negative pixels or voxels, the image values will never become negative.


    Now let us explain the name of this algorithm: ML-EM. The objective function of
    this algorithm can be a likelihood function, which is the joint probability density
    function of Poisson random variables. We are looking for a solution (i.e., the
    reconstructed image) that can maximize this likelihood function. Therefore, this
    is a maximum likelihood algorithm.


