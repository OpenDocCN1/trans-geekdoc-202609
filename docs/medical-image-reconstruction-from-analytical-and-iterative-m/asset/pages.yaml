  md: '# 6.8 Including prior knowledge (Bayesian)


    We sometimes know more about the image that we are looking for – in addition to
    the measurements. We can enforce this prior knowledge into the image by adding
    an extra term to the objective function.


    For example, if we know in advance that the image X is very smooth, we can add
    a penalty term || ∇X ||^2 to suppress sharp jumps and encourage the smoothness:


    New objective function (X) = Old objective function (X) + β|| ∇X ||^2, (6.38)


    where β is the user-specified controlling parameter. Using the squared norm of
    the gradient || ∇X ||^2 as a penalty term can be generalized as using an “energy”
    function U(X) as penalty term. The energy function U(X) is defined as


    U(X) = ∑_{ij} w_ij V(x_j - x_i), (6.39)


    where the summation is over a neighborhood (clique), and V is a convex function,
    which may or may not be quadratic (see Figure 6.19). If V is a quadratic function,
    this energy function encourages smoothness and penalizes jumps. If the function
    V increases more slowly than a quadratic function (say, V increases linearly),
    then it can preserve edges and smooth out the noise. How does the algorithm know
    which is the edge that you want to keep and which is noise that you want to smooth
    out? Let us answer this question by comparing a linear function |x| and a quadratic
    function x^2. We assume that the noise consists of small jumps, while the edges
    separate the large jumps. When |x| is small, we have |x| > x^2, and the linear
    function gives relatively heavier penalty. Thus the noise is suppressed. When
    |x| is large, we have |x| < x^2, and the linear function gives a relatively much
    lighter penalty. Thus the edges are preserved.


    Algorithms that include the prior information carry many names, such as Bayesian
    methods or MAP (maximum a posteriori) algorithms.


    The new objective function is, in fact, the conditional probability Prob(X|P).
    Bayes’ law states


    Prob(X|P) = Prob(P|X)Prob(X) / Prob(P). (6.40)


    Taking the logarithm yields


    ln(Prob(X|P)) = ln(Prob(P|X)) + ln(Prob(X)) – ln(Prob(P)), (6.41)


    where the third term has nothing to do with our unknowns X and can be eliminated
    from the objective function. The Bayesian objective function then becomes


    L(X) = ln(Prob(P|X)) + ln(Prob(X)), (6.42)'
