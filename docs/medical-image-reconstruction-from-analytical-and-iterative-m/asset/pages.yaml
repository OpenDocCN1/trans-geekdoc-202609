  md: 'Similar to the \(\mu = 0\) case, the notched ramp filtering can be decomposed
    into a derivative and a notched Hilbert transform. In the spatial domain, the
    Hilbert transform is a convolution with a convolution kernel \(1/s\). The notched
    Hilbert transform, on the other hand, is a convolution with a convolution kernel
    \((\cos \mu s)/s\).


    In the Fourier domain, the notched Hilbert filter function is shown on the left-hand
    side of the graphic equation in Figure 4.21. The cosine function can be decomposed
    into \(\cos(\mu s) = (e^{\mu s} + e^{-\mu s})/2\). The Fourier transform has a
    property that multiplication by \(e^{\mu s}\) in the \(s\) domain corresponds
    to shifting by \(\mu/(2\pi)\) in the \(\omega\) domain (i.e., the Fourier domain).
    Therefore, the Fourier transform of \((\cos \mu s)/s\) is the combination of two
    shifted versions (one shifted to the left by \(\mu/(2\pi)\) and the other one
    shifted to the right by \(\mu/(2\pi)\)) of the Fourier transform of \(1/s\) (see
    Figure 4.21).


    If \(\mu\) is nonuniform, an FBP-type algorithm exists but is rather sophisticated
    and will be briefly discussed in Section 4.5.4.


