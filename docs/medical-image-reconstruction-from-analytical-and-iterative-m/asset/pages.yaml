    projection, s = x cos \(\theta\) + y sin \(\theta\), t = -x sin \(\theta\) + y
    cos \(\theta\), a_d(s, t) = \(\int_t^\infty \mu \left( s\overline{\theta} + t\overline{\theta^\perp}
