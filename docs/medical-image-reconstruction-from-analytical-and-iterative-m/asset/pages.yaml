  md: 'becomes a weighted least-squares objective function


    ```

    \chi_W^2 = (AX - P)^T W(AX - P),\n(6.33)

    ```


    where W is the diagonal matrix, W = diag {1/\sigma_1^2, 1/\sigma_2^2, ..., 1/\sigma_N^2},
    and N is the number of projections. In many cases, it is advantageous to make
    the definition of the weighting matrix W more general. For example, we can let
    W = diag {1/\sigma''_1, 1/\sigma''_2, ..., 1/\sigma''_N}, where the value of \gamma
    can be different from 2. The weighting W sometimes causes low-frequency shadowing
    artifacts in the reconstruction. A careful selection of this parameter \gamma
    may reduce the artifacts.


    This weighted least-squares objective function can also be obtained through the
    likelihood function by assuming Gaussian noise in the projections. The ith projection
    measurement p_i is a Gaussian random variable whose mean value is \mu_i = \sum_j
    a_{ij} x_j = A_i X and variance is \sigma_i^2. Here, A_i is the ith row of the
    matrix A. The Gaussian distribution density function gives


    ```

    Prob(p_i) = \frac{1}{\sqrt{2\pi}\sigma_i} \exp \left( - \frac{(A_i X - p_i)^2}{2\sigma_i^2}
    \right).\n(6.34)

    ```


    We assume that all projections are statistically independent. The likelihood function
    is the joint probability density function by considering all projections together:


    ```

    Prob(P) = \prod_i \frac{1}{\sqrt{2\pi}\sigma_i} \exp \left( - \frac{(A_i X - p_i)^2}{2\sigma_i^2}
    \right).\n(6.35)

    ```


    Our goal is to find an image X that maximizes the above likelihood function, hence,
    the term “maximum likelihood solution.” Taking the logarithm of the likelihood
    function, we have


    ```

    ln(Prob(P)) = \frac{1}{2} \sum_i \frac{(A_i X - p_i)^2}{\sigma_i^2} + \sum_i \ln
    \left( \frac{1}{\sqrt{2\pi}\sigma_i} \right).\n(6.36)

    ```


    The second term in the above equation is a constant. Therefore, maximizing the
    likelihood function is equivalent to minimizing the following weighted least-squares
    objective function:


    ```

    \chi_W^2 = \sum_i \frac{(A_i X - p_i)^2}{\sigma_i^2} = (AX - P)^T W(AX - P).\n(6.37)

    ```


    If the data noise is not Gaussian, the above approach of setting up a likelihood
    function and an objective function still applies. However, the resultant objective
    function is different.'
