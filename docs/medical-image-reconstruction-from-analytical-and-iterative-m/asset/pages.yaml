  md: '# 6.10 Reconstruction using highly undersampled data


    It has been reported that it is possible to exactly reconstruct a 256 × 256 image
    with only 10 views. It seems magic to us, because more than 100 views are normally
    required in such an imaging problem. Let us explore how they do it. The setup
    is quite simple and the goal is to minimize the following Bayesian objective function:


    $F = \|AX - P\|_2^2 + \beta \|\psi X\|_0, (6.99)$


    where \|\bullet\|_2 is the l_2 norm, \|\bullet\|_0 is the l_0 quasi-norm, and
    \psi is the sparsifying transform. The zero quasi-norm \|\bullet\|_0 is easy to
    understand; it simply counts the nonzero elements in a vector. For example, v̄
    = [3, 0, 0, 1, 7], in which there are three nonzero elements; therefore, \|v̄\|_0
    = 3.


    The trick of this method is to design the sparsifying transform \psi. This transform
    can be anything as long as it transforms your regular image into a sparse image
    in which most (say, 97%) pixels are zero.


    If your regular image is a piecewise-constant image, you can use \|\nabla\| (i.e.,
    the magnitude of the gradient) as your sparsifying transform \psi (see Figure
    6.21).


    A practical medical image is not a piecewise-constant image. If you take the gradient,
    the resultant image is not very sparse. Thus, it is tricky to find the sparsifying
    transform \psi for your application.


    Another problem is that the l_0-minimization is difficult to do. To be honest,
    we do not have an effective and efficient way to find its minimum. We normally
    set up an objective function using the l_2 norm, which basically gives you a user-friendly
    least-squares function such as \sum_l v_i^2, and we can perform many fun things
    with it (e.g., taking a derivative). However, the l_2 norm does not work well
    when data are highly undersampled.


    ![](img/dd555effd38151c67af30d84800c554a_177_0.png)


    **Fig. 6.21:** A sparsifying transform extracts some essential information from
    the original image to produce a sparse image.


    The l_1 norm {\sum_i |v_i|} is a popular alternative. It does not perform well
    as the l_0 quasi-norm in selecting the optimum image, but it is better than the
    l_2 norm. On the other hand, it is not as user friendly as the l_2 norm but is
    much better than the l_0 quasi-norm.'
