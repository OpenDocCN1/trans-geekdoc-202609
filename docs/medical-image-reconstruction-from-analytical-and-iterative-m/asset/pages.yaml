  md: 'The second summation term \(\sum_{ij} \ln(C_{ij}!)\) does not contain the parameters
    \(x_j\) to be estimated; therefore, it can be discarded without changing the ML
    problem. To find the ML solution of \(x_j\), we will maximize the following objective
    function:


    \(L = \sum_{ij} (c_{ij} \ln(a_{ij}x_j) - a_{ij}x_j).\) (6.67)


    # The "E" Step:


    The above objective function contains random variables \(c_{ij}\). The "E" (expectation)
    step is to replace it by the expected value using the measurement \(p_i\) and
    the current estimate of the parameters \(x_j\). That is, \(c_{ij}\) is replaced
    by


    \(E(c_{ij}|p_i, X^{current}) = \frac{a_{ij}x_j^{current}}{\sum_k a_{ik}x_k^{current}}
    p_i.\) (6.68)


    Thus, after the "E" step, the objective function becomes


    \(E(L|P, X^{current}) = \sum_{ij} \left( \frac{a_{ij}x_j^{current}}{\sum_k a_{ik}x_k^{current}}
    p_i \ln(a_{ij}x_j) - a_{ij}x_j \right).\) (6.69)


    # The "M" Step:


    To maximize the new objective function \(E(L|P, X^{current})\), we will take the
    derivative of it with respect to estimation parameters \(x_j\) and set the derivatives
    to zero, that is,


    \(\frac{\partial E(L|P, X^{current})}{\partial x_j} = \sum_i \left( \frac{a_{ij}x_j^{current}}{\sum_k
    a_{ik}x_k^{current}} p_i \frac{a_{ij}}{a_{ij}x_j} - a_{ij} \right)\)

    \(= \frac{1}{x_j} \sum_i \frac{a_{ij}x_j^{current}}{\sum_k a_{ik}x_k^{current}}
    p_i - \sum_i a_{ij}\)

    \(= 0.\) (6.70)


    Solving for \(x_j\), we finally have the ML-EM algorithm:


    \(x_j = \frac{x_j^{current}}{\sum_i a_{ij}} \sum_i a_{ij} \frac{p_i}{\sum_j a_{ij}x_j^{current}}.\)
    (6.71)


    In fact, this multiplicative ML-EM algorithm can also be written in an additive
    form so that it appears like a gradient descent algorithm as


    \(X^{next} = X^{current} + S^{current} A^T \Lambda^{current} (P - AX^{current}),\)
    (6.72)


    where the step size is


    \(S^{current} = \text{diag} \left\{ x_j^{current} / \sum_i a_{ij} \right\},\)
    (6.73)'
