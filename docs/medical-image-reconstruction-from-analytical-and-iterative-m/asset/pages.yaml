    # 8.3.1 Implementation of \((A^T A)^{-1}\) in the Fourier domain


    In Section 2.6.7, we had the following two expressions:


    $$B_{\text{polar}}(\omega, \theta) = \frac{F_{\text{polar}}(\omega, \theta)}{|\omega|},$$
    (2.37)


    $$B(\omega_x, \omega_y) = \frac{F(\omega_x, \omega_y)}{\sqrt{\omega_x^2 + \omega_y^2}}.$$
    (2.38)


    Equation (2.37) is in the polar coordinate system, and eq. (2.38) is its counterpart
    in the Cartesian coordinate system. They are both in the Fourier domain. Here
    \(F\) is the 2D Fourier transform of the original object \(f\), and \(B\) is the
    2D Fourier transform of the projection-then-backprojection of \(f\). Therefore,
    multiplying an image by \(A^T A\) is equivalent to filtering the image with a
    transfer function \(1/|\omega|\), where \(\omega\) is the radial variable in the
    polar Fourier space.


