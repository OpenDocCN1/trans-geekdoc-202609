    where


    \( V^T V = I_{n \times n}, \quad \text{(6.16)} \)


    \( U^T U = I_{m \times m}, \quad \text{(6.17)} \)


    and


    \( \sum_{m \times n} = \begin{bmatrix} \text{diag}\{ \sigma_i \} & \mathbf{0}
    \\ \mathbf{0} & \mathbf{0} \end{bmatrix} \quad \text{(6.18)} \)


    with the singular values arranged in the descending order:


    \( \sigma_1 \ge \sigma_2 \ge \cdots \ge \sigma_i \ge \cdots \ge 0. \quad \text{(6.19)}
    \)


    A generalized inverse (or pseudo-inverse) is defined as


    \( A^+ = V \Sigma^+ U^T, \quad \text{(6.20)} \)


    where


    \( \Sigma^+_{n \times m} = \begin{bmatrix} D_r & \mathbf{0} \\ \mathbf{0} & \mathbf{0}
    \end{bmatrix}, \quad \text{(6.21)} \)


    and the diagonal matrix \( D_r \) with a cutoff index \( r \) is defined as


    \( D_r = \text{diag}\left\{ \frac{1}{\sigma_1}, \frac{1}{\sigma_2}, \dots, \frac{1}{\sigma_r},
    0, \dots, 0 \right\}. \quad \text{(6.22)} \)


    The reconstructed image is given as


    \( X = A^+ P = V \Sigma^+ U^T P. \quad \text{(6.23)} \)


    In the SVD method, the user selects the cutoff index \( r \). If a very small
    \( r \) is chosen, the resultant reconstructed image only contains low-frequency
