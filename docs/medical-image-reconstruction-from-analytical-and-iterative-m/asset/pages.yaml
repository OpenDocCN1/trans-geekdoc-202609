- pgno: 110
  md: '![](img/dd555effd38151c67af30d84800c554a_110_0.png)


    Fig. 5.5: The directional vector trajectories are illustrated as curves or shaded
    areas on the unit sphere. The trajectories on the top row satisfy Orlov''s condition;
    the trajectories on the bottom row do not satisfy the condition.


    +   (i) Use an arbitrary point source and find the 3D projection/backprojection
    point spread function (PSF) h (defined in Figure 3.2). If the original image is
    f(x, y, z) and the backprojected image is b(x, y, z), then


    ```

    b = f * * * h,

    ```


    where "* * *" denotes the 3D convolution. For example, if the trajectory of the
    directional vector \(\vec{\theta}\) is the full unit sphere as shown in the leftmost
    case in the first row of Figure 5.5, the PSF is


    ```

    h(x, y, z) = \frac{1}{x^2+y^2+z^2} = \frac{1}{r^2},

    ```


    where r is the distance to the point source. In 2D, this projection/backprojection
    PSF is 1/r. This implies that in 3D, the PSF is sharper than that in 2D because
    the PSF falls off at a faster rate as r increases.


    +   (ii) Take the 3D Fourier transform of the relationship b = f * * * h and obtain


    ```

    B(\omega_x, \omega_y, \omega_z) = F(\omega_x, \omega_y, \omega_z)H(\omega_x, \omega_y,
    \omega_z).

    ```


    After this Fourier transform, b, f, and h become B, F, and H, respectively, and
    convolution becomes multiplication. If we again use the example in the leftmost
    case in the upper row of Figure 5.5, the transfer function H is


    ```

    H(\omega_x, \omega_y, \omega_z) = \frac{\pi}{\sqrt{\omega_x^2 + \omega_y^2 + \omega_z^2}}.

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Thus, a 3D ramp filter


    $$\frac{1}{H(\omega_x, \omega_y, \omega_z)} = \frac{\sqrt{\omega_x^2 + \omega_y^2
    + \omega_z^2}}{\pi}$$ (5.5)


    can be used for image reconstruction in this case.


    Solve for $F$ as


    $$F(\omega_x, \omega_y, \omega_z) = B(\omega_x, \omega_y, \omega_z) \frac{\sqrt{\omega_x^2
    + \omega_y^2 + \omega_z^2}}{\pi}.$$ (5.6)


    Finally, the image $f(x, y, z)$ is obtained by taking the 3D inverse Fourier transform
    of $F$.


    In general, 3D line-integral data are measured with heavy redundancy. Therefore,
    the image reconstruction algorithm is not unique because you can always weigh
    redundant data differently.


    # 5.1.2 Filtered backprojection


    In the filtered backprojection (FBP) algorithm, the projection $p(u, v, \vec{\theta})$
    is first filtered by a 2D filter (or a 2D convolution), obtaining $q(u, v, \vec{\theta})$.
    A backprojection of the filtered data $q(u, v, \vec{\theta})$ gives the reconstruction
    of the image $f(x, y, z)$.


    Due to data redundancy, the 2D filter is not unique. The filter is usually different
    depending on different data orientation $\vec{\theta}$. One way to obtain a Fourier
    domain filter is through the central slice theorem.


    In Section 5.1.1, we had a projection/backprojection PSF $h(x, y, z)$ and its
    Fourier transform $H(\omega_x, \omega_y, \omega_z)$. If we let $G(\omega_x, \omega_y,
    \omega_z) = 1/H(\omega_x, \omega_y, \omega_z)$, then $G$ is the Fourier domain
    filter in the backprojection-then-filtering algorithm. The Fourier domain 2D filter
    for projection $p(u, v, \vec{\theta})$ can be selected as the central slice of
    $G(\omega_x, \omega_y, \omega_z)$ with the normal direction $\vec{\theta}$ (see
    Figure 5.2). Note that the filter in general depends on the direction $\vec{\theta}$.


    # 5.2 Parallel plane-integral data


    In 3D, the parallel plane-integral $p(s, \vec{\theta})$ of an object $f(x, y,
    z)$ is referred to as the Radon transform (see Figure 5.6). In 2D, the Radon transform
    is the parallel line-integral $p(s, \theta)$ of $f(x, y)$. In a general $n$-D
    space, the $(n-1)$-D hyperplane integral of an $n$-D function $f$ is called the
    Radon transform. On the other hand, 1D integral of the object is called the line
    integral, ray sum, X-ray transform, or ray transform. In 2D, the Radon transform
    and the X-ray transform are the same thing.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/dd555effd38151c67af30d84800c554a_112_0.png)


    Fig. 5.6: In 3D, the plane integral of an object is the Radon transform.


    Unlike the line-integral data, the plane-integral data are not popular in medical
    imaging. Nevertheless, the Radon transform in 3D is still worthwhile to investigate
    because it has a simple and nice inversion and can be used to solve other related
    imaging problems.


    To study the Radon transform in 3D, we imagine a 1D detector that is able to measure
    plane integrals $p(s, \bar{\theta})$ with the planes orthogonal to the detector.
    The detector is along the direction $\bar{\theta}$. The central slice theorem
    for the Radon transform in 3D states that the 1D Fourier transform $P(\omega,
    \bar{\theta})$ of the projection $p(s, \bar{\theta})$ of a 3D function $f(x, y,
    z)$ is equal to a 1D profile through the origin of the 3D Fourier transform $F(\omega_x,
    \omega_y, \omega_z)$ of that function which is parallel to the detector (see Figure
    5.7). Here, $\bar{\theta}$ is the direction of the 1D detector and the 1D profile
    in the $(\omega_x, \omega_y, \omega_z)$ space.


    We observe from Figure 5.7 that each detector position only measures the frequency
    components along one line in the $(\omega_x, \omega_y, \omega_z)$ space. The direction
    $\bar{\theta}$ must go through a half unit sphere to get enough measurements for
    image reconstruction. After the data are acquired, the image reconstruction algorithm
    is simple and is in the form of FBP. This form is also referred to as the Radon
    inversion formula.


    In order to reconstruct the image, first take the second-order derivative of $p(s,
    \bar{\theta})$ with respect to variable s. This step is called filtering. Then
    backproject the filtered data to the 3D image array. You will not find an image
    reconstruction algorithm simpler than this.


    The 3D backprojector in the 3D Radon inversion formula backprojects a point into
    a 2D plane. There is a trick to perform the 3D backprojection with the Radon data.
    This trick is to perform the 3D backprojection in two steps, and each step is
    a 2D backprojection. In the first step, a point is backprojected into a line (see
    Figure 5.8(i)). All data points along a line are backprojected into a set of parallel
    lines, and these lines are in a 2D plane. In the second step, each line is backprojected
    into a 2D plane (see Figure 5.8(ii)). The backprojection directions in these two
    steps are orthogonal to each other.'
  merge: -1
