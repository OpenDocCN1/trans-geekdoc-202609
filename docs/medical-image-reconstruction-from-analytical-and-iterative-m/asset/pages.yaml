    # 4.7 Summary


    +   - The working principle for X-ray CT measurement is Beer''s law. One needs
    to take the logarithm to convert the CT measurements into line integrals.

    +   - PET and SPECT measure line integrals directly. However, these measurements
    suffer from photon attenuation within the patient.

    +   - Attenuation correction for PET can be achieved by the pre-scaling method.
    The scaling factor is obtained by transmission measurements.

    +   - Attenuation correction for SPECT is difficult and cannot be done by pre-scaling.
    Attenuation correction is a built-in feature in SPECT reconstruction algorithms.
    FBP algorithms exist for uniform attenuator and for nonuniform attenuator as well.
    However, the FBP algorithm for the nonuniform attenuator is very complicated to
    implement.

    +   - The readers are expected to understand the differences between transmission
    and emission tomography, and also the different attenuation effects in PET and
    SPECT.


