    # 5.5 Radon transform and ray transform in \(n\) dimensions


    Even though the focus of this chapter is on the three-dimensional real space,
    the concepts of Radon transform and ray transform can be readily extended into
    the \(n\)-dimensional real space. In 2D, the Radon transform and the ray transform
    are the same. They are both the parallel line integrals.


    In 3D, they are different. The 3D Radon transform is the parallel planar integrals,
    while the 3D ray transform is the parallel line integrals. In \(n\)-D, the Radon
    transform is the parallel \((n-1)\)-D hyperplane integrals of an \(n\)-D function
    \(f\). Regardless the value of \(n\), the Radon transform, \(p(s, \bar{\theta})\),
    is always a 1D function in \(s\), which is the along the direction of the 1D detector.
    Here, \(\bar{\theta}\) is a unit directional vector in the \(n\)-D space and indicates
    the direction of the 1D detector. On the other hand, the ray transform, \(p(\vec{s},
    \bar{\theta})\), is \((n-1)\)-D function in \(\vec{s}\), which is the location
    on the \((n-1)\)-D hyperplane detector. Here, \(\bar{\theta}\) is a unit vector
    in the \(n\)-D space and indicates the normal direction of the \((n-1)\)-D hyperplane
    detector.


    The inversion formula for the \(n\)-D Radon transform is in the form of FBP. If
    \(n\) is an odd number, the filter is the \((n-1)\)th-order 1D derivative operator
    with respect to the variable \(s\). For the 3D Radon transform, the tomographic
    filter is the second-order derivative with respect to \(s\), as presented in Section
    5.4.3.'
