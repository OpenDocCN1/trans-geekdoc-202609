    to the highest frequency). Note that \( w_n = \exp(-0.1 \times n \times p_{\max})
    \) is for one exemplary noise model. One can use other weighting functions for
    other noise models. The ray-based FBP algorithm can be implemented as


    +   1. At each view angle \( \theta \), find the 1D Fourier transform of \( p(s,
    \theta) \) with respect to \( s \), obtaining \( P(\omega, \theta) \).

    +   2. Form \( N+1 \) versions of \( Q_n(\omega, \theta) = P(\omega, \theta) \times
    W_{k, a, w_n}(\omega) \) with \( n = 0, 1, .., N \).

    +   3. Take the 1D inverse Fourier transform of \( Q_n(\omega, \theta) \) with
    respect to \( \omega \), obtaining \( q_n(s, \theta) \) with \( n = 0, 1, ..,
    N \).

    +   4. Construct \( q(s, \theta) \) by letting \( q(s, \theta) = q_n(s, \theta)
    \) if \( p(s, \theta) \simeq n \times p_{\max}/N \).

    +   5. Backproject \( q(s, \theta) \) to obtain the final image.


    This ray-based FBP algorithm is fast because it only performs backprojection once.
    Backprojection is the most time-consuming part in an FBP algorithm. We now demonstrate
    the effectiveness of this ray-based noise weighting FBP algorithm using a low-dose
    X-ray CT patient data set (see Figure 8.4). The severe horizontal streaking artifacts
    across the body are significantly reduced.


    The noise model is \( w = \frac{1}{\sqrt{\text{variance}}} \), where “variance”
