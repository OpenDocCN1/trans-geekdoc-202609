    # 8.5 FBP algorithm with quadratic constraints


    Other than being able to model the data noise, the iterative algorithm can also
    incorporate constraints as Bayesian optimization. If the constraints are quadratic
    functions of the image, an FBP algorithm can be developed to incorporate them.


    The Bayesian constraints regulate the solutions and effectively control the noise
    propagation. Therefore, the common iterative Bayesian algorithms do not diverge
    and, in theory, can iterate till infinity. There is no need to stop the algorithms
    early.'
