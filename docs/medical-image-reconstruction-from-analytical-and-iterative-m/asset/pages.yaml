- pgno: 175
  md: '# 6.9.7 Matched and unmatched projector/backprojector pairs


    This topic is quite controversial. It is almost like a religion in which people
    have their own opinions and carry out their practice accordingly. By projector/backprojector
    pair, we normally mean matrices A and A^T as described earlier in this chapter.
    If the backprojection matrix is the transpose of the projection matrix, then this
    pair is called matched. Otherwise, the pair is called unmatched.


    In an analytic reconstruction algorithm, the image pixel is a point. The image
    is not discretized. The projector, even not used in the reconstruction algorithm,
    is an integral of the continuous image. Its matched backprojector treats an image
    pixel as a point, too. Sometimes this backprojector is referred to as the pixel-driven
    backprojector. When implementing a pixel-driven backprojector, we start with an
    image pixel location, and find the location on the detector to get the backprojection
    value.


    In an iterative reconstruction algorithm, the image pixel is no longer a point
    but an area. The projector draws a ray from each detector bin, and determines
    the contribution of each pixel according to the overlap of this ray with the pixel
    of interest. This projector is sometimes referred to as the ray-driven projector.
    Its matched backprojector is the ray-driven backprojector.


    We all agree that one should make the projector (i.e., the matrix A) to model
    the imaging geometry and imaging physics as accurately as possible, significantly
    reducing the deterministic modeling errors. The question is whether one is allowed
    to use unmatched projector/backprojector pairs. We have seen many cases from the
    practical implementations. In some cases, the unmatched pair gives better results
    than the matched pair, in terms of artifact removal and speedup in computation
    time. In other cases, the unmatched pair gives more artifacts than the matched
    pair. A common reason one would use a backprojector other than A^T is to save
    computation time. We need to be cautioned that the solution can be different if
    an unmatched pair is used to replace the matched pair in an iterative reconstruction
    algorithm.


    First of all, one cannot just arbitrarily pick up a backprojector and use it in
    an iterative algorithm. For example, one cannot use a fan-beam backprojector to
    reconstruct a parallel-beam image. The minimum requirement of choosing a backprojector
    is that the projection-then-backprojection operator can only blur the image; it
    cannot cause image distortion in shape and other motions such as rotation and
    translation. If a projector/backprojector pair is applied to a point source, the
    result can only be a blurred point source at the same location.


    Second of all, we will investigate how a solution can be changed if a different
    backprojector is used to solve the system AX = P. Let us consider a modified Landweber
    iterative algorithm with a backprojector B^T, where B^T may not be the same as
    A^T, as


    ```

    X^{next} = X^{current} + SB^T(P - AX^{current}), (6.92)

    ```'
