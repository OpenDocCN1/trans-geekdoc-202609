    a_{nk} x_k^{\text{old}}} [\text{Change the oder of summations.}] \\

    &= \sum_j x_j^{\text{old}} \sum_n a_{nj} \frac{p_n}{\sum_k a_{nk} x_k^{\text{old}}}
    \left[ \vdots \sum_i a_{ij} = \sum_n a_{nj} \right]

    \end{aligned}$$

    ```'
