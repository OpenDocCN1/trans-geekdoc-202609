  md: '# Example 3: Find the discrete “Ramachandran–Lakshminarayanan” convolver, which
    is the inverse Fourier transform of the ramp filter. The cut-off frequency of
    the ramp filter is ω = 1/2.


    # Solution


    When the projection is to be filtered by the ramp filter, only a band-limited
    ramp filter is required, since the projection is band limited by 0.5. The band-limited
    ramp filter is defined in the Fourier domain as


    RAM P(ω) = { |ω| if |ω| ≤ 0.5 0 if |ω| > 0.5 . (2.53)


    Let us first use the inverse Fourier transform to find the continuous version
    of the convolver h(s):


    h(s) = ∫_{-1/2}^{1/2} |ω|e^{2πiωs} dω = 1/2 sin(πs)/πs - 1/4 [ sin(πs/2)/(πs/2)
    ]^2 . (2.54)


    The convolver h(s) is band limited. According to the Nyquest sampling principle,
    the proper sampling rate is twice the highest frequency, which is 1 in our case.
    To convert h(s) to the discrete form, let s = n (integer) and we have


    h(n) = { 1/4, n = 0 0, n even -1/(π^2n^2) n odd . (2.55)


    The continuous and discrete convolvers are displayed in Figure 2.20.


    # Example 4: How to obtain a discrete transfer function for the ramp filter in
    an FBP algorithm? In other words, what is the proper way to obtain a discrete
    version of eq. (2.52)?


    # Solution


    It is a violation of the Nyquest sampling principle to directly sample eq. (2.52),
    because its “spectrum” h(s) is not supported in a finite region of s. On the other
    hand, the discrete h(n) can be used to perform exact ramp filtering.


    It is impractical to find the discrete Fourier transform (DFT) of h(n) to obtain
    a discrete version of eq. (2.52) because the number of samples of h(n) is not
    finite. The good news is that the detector of a medical imaging system has a finite
    size, and only a finite central portion of the discrete kernel h(n) is required
    to obtain exact convolution.


    If the support of the projections has a length N, only the central N samples of
    the filtered projection are needed in backprojection. This requires that the minimal
    length of the convolution kernel be 2N − 1. In order to make both functions to
    have the same'
