- pgno: 86
  md: 'The goal of X-ray CT is to obtain a cross-sectional image of various attenuation
    coefficients within the body. A typical X-ray CT image is shown in Figure 4.4.
    The attenuation coefficient (commonly denoted by notation μ) is a property of
    a material; it is the logarithm of the input/output intensity ratio per unit length.
    Bones have higher μ values, and soft tissue has lower μ values. The attenuation
    coefficient of a material varies with the incoming X-ray energy; it becomes smaller
    when the X-ray energy gets higher.


    ![](img/dd555effd38151c67af30d84800c554a_86_0.png)


    **Fig. 4.5:** In the first-generation CT, the X-ray tube and the detector translate
    and rotate.


    The first-generation CT, which is no longer in use, had one small detector (see
    Figure 4.5). The X-ray source and the detector have two motions: linear translation
    and rotation. The X-ray source sends out a narrow pencil beam to obtain parallel-beam
    projections. The scanning time was rather long (about 25 min).


    The second-generation CT used narrow fan-beam geometry, consisting of 12 detectors
    (see Figure 4.6). Like the first-generation CT, it has two motions: linear translation
    and rotation. Due to the fan-beam geometry, the scan time was shortened to about
    1 min.


    The third-generation CT uses wide fan-beam geometry, consisting of approximately
    1,000 detectors (see Figure 4.7). No linear translation motion is necessary, and
    the scanning time was further reduced to about 0.5 s. The third-generation CT
    is currently very popular in medical imaging.


    The fourth-generation CT has a stationary ring detector. The X-ray source rotates
    around the subject (see Figure 4.8). This scanning method forms a very fast fan-beam
    imaging geometry; however, it is impossible to collimate the X-rays on the detector,
    which causes this geometry to suffer from high rates of scattering.


    Modern CT can perform helical scans, which is implemented as translating the patient
    bed in the axial direction as the X-ray source and the detectors rotate. The modern
    CT has a 2D multirow detector, and it acquires cone-beam data (see Figure 4.9).
    Image reconstruction methods for the cone-beam geometry will be covered in the
    next chapter.'
