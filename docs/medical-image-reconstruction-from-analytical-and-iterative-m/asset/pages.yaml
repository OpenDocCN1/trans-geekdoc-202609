    v(f) = ||[Rf](s, \theta) - p(s, \theta)||^2 + \beta||f - g^2||,

    ```


    where the first term enforces data fidelity, the second term imposes prior information
    about the image $f$, the parameter $\beta > 0$ controls the level of influence
    of the prior information to the image $f$, and $g$ is a reference image. Using
    integral expressions, $v$ in eq. (8.47) can be written as


