    Now the question is: What basis functions should we choose? The Fourier series
    expansion does not work because \( H(\omega) \) is not periodic. The Taylor expansion
    does not work well because the polynomials do not look like the function \( H(\omega)
    = \frac{|\omega|}{1 + \gamma_0|\omega|} \), which is monotonically increasing
    from 0 to 1 in the positive axis of \( \omega \).


    If we factor the ramp filter \( |\omega| \) out, \( 1/(1 + \gamma_0|\omega|) \)
    is monotonically decreasing and looks like an exponential function \( e^{-\gamma_0
    \omega} \) for \( \omega > 0 \). Based on this strategy, we propose the following
    expansion for \( \omega > 0 \):


    \( \frac{1}{1 + \gamma_0 \cdot \omega} \approx \frac{1}{3}(e^{-\gamma_0 \omega}
    + e^{-\gamma_1 \omega} + e^{-\gamma_2 \omega}), \quad (8.32) \)


    where the parameters \( \gamma_1 \) and \( \gamma_2 \) have to be determined.
    The range of \( \omega \) is [0, 1/2]. Approximation (8.32) is already exact at
