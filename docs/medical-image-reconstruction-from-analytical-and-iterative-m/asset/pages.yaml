- pgno: 246
  md: '# # 9 Machine learning


    Machine learning is currently the most active area in research and applications.
    It is data-driven and relied on a sufficient model or architecture. It can generate
    images better than those generated by analytic and iterative algorithms. This
    chapter introduces the basic principle of machine learning and presents its applications
    in medical image reconstruction.


    # ## 9.1 Analytic algorithms versus iterative algorithms versus machine learning
    algorithms


    The analytic image reconstruction algorithms are the most rigorous in mathematics
    and most challenging to develop. They rely on the closed-form solutions of an
    inverse problem. Due to the difficulty in solving an inverse problem, the researchers
    often make some strong assumptions such as the projections being noiseless line
    integrals. Once the analytic reconstruction algorithms have been developed, they
    can be applied to any objects. These types of algorithms are mathematics-driven.


    The iterative image reconstruction algorithms are easier to develop than the analytic
    algorithms because a closed-form solution of an inverse problem is not needed.
    In the development of an iterative algorithm, only the forward data acquisition
    model is required. The discrepancy between the forward model outputs and the measurements
    is used to form an objective function. Then an optimization algorithm is used
    to minimize the objective function. Compared with the analytic algorithm development,
    the restrictions for a forward model are more relaxed. For example, noise model
    in the measurements can be incorporated. Some physics effects can also be incorporated.
    In this sense, the iterative algorithms are physics-driven.


    The machine learning approaches require neither a closed-form solution to an inverse
    problem nor a forward model of data acquisition. They just need data, and a lot
    of it! The machine learning approaches are data-driven. A person without deep
    understanding of mathematics or physics can be very successful in producing excellent
    images by doing machine learning. The image quality obtained from machine learning
    methods are usually better than those obtained by analytical or iterative reconstruction
    algorithms. Figure 9.1 illustrates a general belief about these three categories
    of algorithms. The basic principles of machine learning are introduced in the
    next section.'
  merge: -1
  img_proc: true
