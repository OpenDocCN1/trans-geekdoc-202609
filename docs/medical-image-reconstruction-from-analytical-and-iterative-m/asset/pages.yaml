- pgno: 176
  md: 'where \( S = \text{diag}\{s_1, s_2, \dots, s_n\} \) with positive diagonal
    elements controlling the step size of each iteration for each unknown pixel \(
    x_j \). Let matrix \( T \) be


    \( T = I - SB^T A, \) (6.93)


    with \( I \) being the identity matrix. Then this modified Landweber algorithm
    has a general expression for each iteration as


    \( X^{(k+1)} = T^{k+1} X^{(0)} + (T^k + \dots + T + I) S B^T P. \) (6.94)


    where \( k \) is the iteration index, \( X^{(k+1)} \) means \( X^{\text{next}}
    \), \( X^{(k)} \) means \( X^{\text{current}} \), \( X^{(0)} \) means the initial
    condition, and so on. This algorithm converges if and only if \( \max_i \{ |\lambda_i|
    \} < 1, i = 1, 2, \dots, n \) where \( \lambda_i \) is the eigenvalue of the square
    matrix \( T \). If the eigenvalues of the matrix \( B^T A \) are all positive,
    then these convergence conditions can be met by choosing small enough step sizes.
    After the algorithm converges, the final solution is given by


    \( X^{(\infty)} = (B^T A)^{-1} B^T P, \) (6.95)


    which has a strong dependency on the choice of the backprojector \( B^T \). Only
    in a special case when \( A^{-1} \) and \( B^{-1} \) exist, the solution


    \( X^{(\infty)} = A^{-1} P \) (6.96)


    is backprojector \( B^T \) independent. If any one of the eigenvalues of the matrix
    \( B^T A \) is negative, the corresponding eigenvalue of matrix \( T \) will be
    greater than 1 and the algorithm will diverge.


    In general, when an unmatched projector/backprojector pair is used in an iterative
    algorithm, the final solution and the intermediate solutions are backprojector
    dependent. The matched pair solves the system


    \( A^T A X = A^T P, \) (6.97)


    while the unmatched pair solves a different system


    \( B^T A X = B^T P. \) (6.98)


    In order to speed up the convergence rate of the algorithm, some people include
    the ramp filter in the backprojector. They treat the combined ramp filter and
    the backprojector as a new backprojector. The new backprojector first performs
    ramp filtering and then backprojection.


    The unmatched pair enforces a different weighting scheme and has a different noise
    effect than the original problem. The unmatched pair also has a different sampling
    and data interpolation properties than the original problem. How much these differences
    can influence the reconstructed image is problem dependent and the users should
    exercise their judgment to choose a backprojector in their particular problem.'
