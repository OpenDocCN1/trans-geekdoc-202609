    # 5.3.3 Katsevich''s algorithm


    Katsevich''s cone-beam algorithm was initially developed for the helical orbit
    cone-beam geometry and was later extended to more general orbits. Katsevich''s
    algorithm is in the form of FBP, and the filtering can be made shift invariant.
    By shift invariant we mean that the filter is independent of the reconstruction
    location.


    Using a helical orbit (Figure 5.9), Tuy''s data sufficiency condition is satisfied.
    The main issue in developing an efficient cone-beam FBP algorithm is to properly
    normalize the redundant data. Katsevich uses two restrictions to handle this issue.


    It can be shown that for any point (x, y, z) within the volume surrounded by the
    helix, there is a unique line segment that passes through the point (x, y, z)
