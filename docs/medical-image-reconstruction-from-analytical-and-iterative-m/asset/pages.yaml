    # ## 5.4.3 Three-dimensional Radon inversion formula (FBP algorithm)


    The 3D Radon inversion formula can only be applied to 3D plane-integral data:


    \(f(x,y,z) = \frac{-1}{8\pi^2} \int\int_{4\pi} \frac{\partial^2 p(s, \vec{\theta})}{\partial
    s^2} \Big|_{s=\vec{x}\cdot\vec{\theta}} \sin \theta \, d\theta \, d\phi, \quad
    (5.25)\)


    where \(\vec{\theta} = (\sin \theta \cos \phi, \sin \theta \sin \phi, \cos \theta)\)
    and \(\vec{x} = (x, y, z)\). The coordinate systems are shown in Figure 5.23.
    If we backproject over a \(2\pi\) solid angle, then \(-1/(8\pi^2)\) should be
    replaced by \(-1/(4\pi^2)\).'
