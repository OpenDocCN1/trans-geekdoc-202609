- pgno: 65
  md: '# 3 Fan-beam image reconstruction


    The image reconstruction algorithms discussed in Chapter 2 are for parallel-beam
    imaging. If the data acquisition system produces projections that are not along
    parallel lines, the image reconstruction algorithms presented in Chapter 2 cannot
    be applied directly. This chapter uses the flat detector and curved detector fan-beam
    imaging geometries to illustrate how a parallel-beam reconstruction algorithm
    can be converted to user''s imaging geometry for image reconstruction.


    # 3.1 Fan-beam geometry and the point spread function


    The fan-beam imaging geometry is common in X-ray computed tomography (CT), where
    the fan-beam focal point is the X-ray source. A fan-beam imaging geometry and
    a parallel-beam imaging geometry are compared in Figure 3.1.


    For the parallel-beam geometry, we have a central slice theorem to derive reconstruction
    algorithms. We do not have an equivalent theorem for the fan-beam geometry. We
    will use a different strategy – converting the fan-beam imaging situation into
    the parallel-beam imaging situation and modifying the parallel-beam algorithms
    for fan-beam use.


    In Chapter 2, when we discussed parallel-beam imaging problems, it was not mentioned,
    but we always assumed that the detector rotates around at a constant speed and
    has a uniform angular interval when data are taken. We make the same assumption
    here for the fan beam.


    For the parallel-beam imaging geometry, this assumption results in a shift-invariant
    point spread function (PSF) for projection/backprojection. In other words, if
    you put a point source in the x–y plane (it does not matter where you put it),
    calculate the projections, and perform the backprojection, then you will always
    get the same star-like pattern (see Figure 3.2). This pattern is called the *point
    spread function* of the projection/backprojection operation.


    In the parallel-beam case, when you find the backprojection at the point (x, y),
    you draw a line through this point and perpendicular to each detector. This line
    meets the detector at a point, say, s*. Then add the value p(s*, θ) to the location
    (x, y).


    In the fan-beam case, when you find the backprojection at the point (x, y), you
    draw a line through this point and each focal-point location. This line has an
    angle, say, γ*, with respect to the central ray of the detector. Then add the
    value g(γ*, β) to location (x, y).


    It can be shown that if the fan-beam focal-point trajectory is a complete circle,
    the PSF is shift invariant (i.e., the pattern does not change when the location
    of the point source changes) and has the same PSF pattern as that for the parallel-beam
    case (see Figure 3.3).'
  merge: -1
