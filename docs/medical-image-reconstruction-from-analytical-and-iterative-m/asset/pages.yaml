    # 2.6 Mathematical expressions


    This section presents the mathematical expressions of the 1D Fourier transform
    pair, the Hilbert transform pair, and two versions of the inverse finite Hilbert
    transform. The proof of the central slice theorem is given. This section also
    derives the FBP and backprojection-then-filtering algorithms. The spatial domain
    filtering methods, such as the convolution backprojection algorithm and the Radon
    inversion formula, are also included.


    # 2.6.1 The Fourier transform and convolution


    The 1D Fourier transform is defined as


    \(P(\omega) = \int_{-\infty}^{\infty} p(s)e^{-2\pi i s \omega} ds,\)


    and the 1D inverse Fourier transform is


    \(p(s) = \int_{-\infty}^{\infty} P(\omega)e^{2\pi i s \omega} d\omega.\)


    The convolution of two functions \(f\) and \(g\) is defined as


    \((f * g)(t) = \int_{-\infty}^{\infty} f(\tau)g(t - \tau)d\tau = \int_{-\infty}^{\infty}
    f(t - \tau)g(\tau)d\tau.\)'
