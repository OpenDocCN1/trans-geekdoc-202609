  md: 'photographs taken by license plate-reading cameras can be translated to digits
    and alphabets.


    For image reconstruction, we are more interested in regression, which is a more
    difficult task than classification in machine learning. The input is a set of
    measurements, and the output is a reconstructed image.


    Some closely related machine learning regression applications include image denoising
    and image deblurring. In image denoising, the input is a noisy image, and the
    output is a denoised version of it. In image deblurring, the input is a low-resolution
    image, and the output is a high-resolution version of it. In an image reconstruction
    task, image denoising and resolution recovery are usually included in machine
    learning.


    The key component in machine learning is the black box, which is commonly referred
    to as the *neural network*. One needs to determine the architecture of the neural
    network. A neural network has many parameters, which are *weights* and *biases*.
    The parameters are calculated by training with a large amount of data pairs. Each
    data pair consists of an input and its desired output (referred to as *label*).
    After a neural network is trained, it is ready for image reconstruction in practical
    situations, where a desired output is unknown, and we want to predict it.


    The performance of a neural network in image reconstruction boils down to the
    architecture of the neural network. How do we choose a particular neural network
    architecture for an application at hand? It is more an art than science. There
    is a theory telling us that a neural network exists for the task, but the theory
    does not tell us how to build it.


    # 9.2.1 Adaptive linear neuron (ADALINE)


    In as early as 1960, Prof. Bernard Widrow of Stanford University and his student
    Marcian Hoff proposed a simple neural network, which we now call the adaptive
    linear neuron (ADALINE) network. It only consists of weights, a bias, and a summation
    function, which can be expressed as


    ```

    $y = \sum_{j=0}^n x_j w_j,$

    ```


    with $x_0 = 1$. Thus, $w_0$ is the bias, and $w_1, w_2, ..., w_n$ are the weights.
    A diagram of the ADALINE is shown in Figure 9.3. The error signal, $e$, is the
    difference between the model output, $y$, and the desired output, $\hat{y}$, as


    ```

    $e = \hat{y} - y.$

    ```


    A least mean squares (LMS) algorithm is used to determine the weights so that
    $e^2$ is minimized. This LMS algorithm is essentially the gradient descent algorithm.
    The theory behind this ADLINE neural network is the finite impulse response (FIR)
    filter,'
