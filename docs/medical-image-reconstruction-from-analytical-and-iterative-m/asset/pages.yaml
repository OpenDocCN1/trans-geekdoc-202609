  md: '# # 8 Using FBP to perform iterative reconstruction


    The readers should be aware that this chapter is based solely on author''s recent
    research. Many results have not been carefully cross-validated by the imaging
    community. A Chinese idiom goes like this: To throw a brick to attract jade. It
    means that the author''s attempt is only preliminary and it may trigger further
    progress.


    This chapter is motivated by the fact that the iterative algorithms are much robust
    than the filtered backprojection (FBP) algorithms and provide better images for
    the same given projection data set. On the other hand, the FBP algorithms are
    much faster than the iterative algorithms. It would be nice to develop FBP algorithms
    that can give almost the same images as those provided by the iterative algorithms.
    In fact, under some fairly common situations, this is possible.


    # ## 8.1 The Landweber algorithm: from recursive form to nonrecursive form


    As discussed in Sections 6.3.2 and 6.9.2, the kth iteration of the Landweber algorithm
    can be expressed as


    ```

    X^{(k)} = X^{(k-1)} + \alpha A^T(P - AX^{(k-1)})

    = \alpha A^T P + (I - \alpha A^T A)X^{(k-1)}

    = \alpha A^T P + (I - \alpha A^T A) \left[ \alpha A^T P + (I - \alpha A^T A)X^{(k-2)}
    \right]

    = \alpha A^T P + (I - \alpha A^T A)\alpha A^T P + (I - \alpha A^T A)^2 X^{(k-2)}

    = \alpha A^T P + (I - \alpha A^T A)\alpha A^T P + (I - \alpha A^T A)^2 \left[
    \alpha A^T P + (I - \alpha A^T A)X^{(k-3)} \right]

    = \alpha A^T P + (I - \alpha A^T A)\alpha A^T P + (I - \alpha A^T A)^2 \alpha
    A^T P + (I - \alpha A^T A)^3 X^{(k-3)}

    = \cdots

    = \left[ I + (I - \alpha A^T A) + \cdots + (I - \alpha A^T A)^{k-1} \right] \alpha
    A^T P + (I - \alpha A^T A)^k X^{(0)}

    = \left[ \sum_{n=0}^{k-1} (I - \alpha A^T A)^n \right] \alpha A^T P + (I - \alpha
    A^T A)^k X^{(0)}.

    ```


    The first line of eq. (8.1) is a recursive expression, in which X^{(k)} depends
    on X^{(k-1)}. The last line of eq. (8.1) in nonrecursive and X^{(n)}, n = 1, 2,
    . . , k - 1 do not appear on the right-hand side.


    The Landweber iterative algorithm is used to solve the system AX = P. If noise
    weighting is also considered, the last line of eq. (8.1) becomes'
