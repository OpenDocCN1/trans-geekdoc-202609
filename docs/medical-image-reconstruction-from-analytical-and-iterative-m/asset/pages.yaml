    The SVD technique is a powerful and stable method to find a generalized inverse
    and diagnose the system condition. Now we use SVD to find the least-squares solution
    for \( AX = P \) as follows.


    Assume that matrix \( A \) has \( m \) rows and \( n \) columns and is denoted
    as \( A_{m \times n} \). Using SVD, the matrix \( A_{m \times n} \) can be decomposed
    into


    \( A_{m \times n} = U_{m \times m} \Sigma V^T_{n \times n}, \quad \text{(6.15)}
