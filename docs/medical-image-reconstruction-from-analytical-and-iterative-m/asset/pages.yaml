- pgno: 84
  md: '# 4 Transmission and emission tomography


    This book considers real imaging systems in this chapter. If the radiation source
    is outside the patient, the imaging system acquires transmission data. If the
    radiation sources are inside the patient, the imaging system acquires the emission
    data. For transmission scans, the image to be obtained is a map (or distribution)
    of the attenuation coefficients inside the patient. For the emission scans, the
    image to be obtained is the distribution of the injected isotopes within the patient.
    Even for emission scans, an additional transmission scan is sometimes required
    in order to compensate for the attenuation effect of the emission photons. Some
    attenuation compensation methods for emission imaging are discussed in this chapter.


    # 4.1 X-ray computed tomography


    In this chapter, we relate transmission and emission tomography measurements to
    line-integral data so that the reconstruction algorithms mentioned in the previous
    chapters can be used to reconstruct practical data in medical imaging.


    X-ray computed tomography (CT) uses transmission measurements to estimate a cross-sectional
    image within the patient body. X-rays have very high energy, and they are able
    to penetrate the patient body. However, not every X-ray can make it through the
    patient''s body. Some X-rays get scattered within the body, and their energy gets
    weakened. During X-ray scattering, an X-ray photon interacts with an electron
    within the patient, transfers part of its energy to that electron, and dislodges
    the electron (see Figure 4.1). The X-ray is then bounced to a new direction with
    decreased energy.


    Some other X-rays completely disappear within the body, converting their energy
    to the tissues in the body, for example, via the photoelectric conversion. The
    photoelectric effect is a process in which the X-ray photon energy is completely
    absorbed by an atom within the patient. The absorbed energy ejects an electron
    from the atom (see Figure 4.2).


    Energy deposition within the body can damage DNA if the X-ray dose is too large.
    Let the X-ray intensity before entering the patient be \(I_0\), and the intensity
    departing the patient be \(I_d\); \(I_0\) and \(I_d\) follow the Beer''s law (see
    Figure 4.3):


    ```

    \frac{I_d}{I_0} = \exp(-p), \quad (4.1)

    ```


    where \(p\) is the line integral of the linear attenuation coefficients along
    the path of the X-rays. A line integral of the attenuation coefficients is obtained
    by'
