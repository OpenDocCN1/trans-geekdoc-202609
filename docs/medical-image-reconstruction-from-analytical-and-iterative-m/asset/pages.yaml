    numerical methods are needed to minimize the objective function (6.99), even if
    the \( l_0 \) quasi-norm is replaced by the \( l_1 \) norm.


    There is hope. Instead of using \( l_0 \) quasi-norm and \( l_1 \) norm, you may
    have also heard of the TV minimization. The TV norm of an image v(x, y) is defined
    as'
