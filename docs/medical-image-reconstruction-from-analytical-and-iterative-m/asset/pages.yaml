  md: '# 3.4.1 Derivation of a filtered backprojection fan-beam algorithm


    We begin with the parallel-beam FBP algorithm (see Section 2.6.5), using polar
    coordinates \( (r, \varphi) \) instead of Cartesian coordinates \( (x, y) \).
    Then \( x = r \cos \varphi, y = r \sin \varphi \), and \( x \cos \theta + y \sin
    \theta = r \cos(\theta - \varphi) \). We have


    ```

    \( f(r, \varphi) = \frac{1}{2} \int_{0}^{2\pi} \int_{-\infty}^{\infty} p(s, \theta)
    h(r \cos(\theta - \varphi) - s) ds d\theta. \quad (3.9) \)

    ```


    Changing variables \( \theta = \gamma + \beta \) and \( s = D \sin \gamma \) with
    the Jacobian \( D \cos \gamma \) yields


    ```

    \( f(r, \varphi) = \frac{1}{2} \int_{0}^{2\pi} \int_{-\pi/2}^{\pi/2} g(\gamma,
    \beta) h(r \cos(\beta + \gamma - \varphi) - D \sin \gamma) D \cos \gamma \, d\gamma
    d\beta. \quad (3.10) \)

    ```


    This is a fan-beam reconstruction algorithm but the inner integral over \( \gamma
    \) is not yet in the convolution form. Convolution is much more efficient than
    a general integral in implementation. In the following, we are going to convert
    the integral over \( \gamma \) to a convolution with respect to \( \gamma \).


    For a given reconstruction point \( (r, \varphi) \), we define \( D'' \) and \(
    \gamma'' \) as shown in Figure 3.11, then \( r \cos(\beta + \gamma - \varphi)
    - D \sin \gamma = D'' \sin(\gamma'' - \gamma) \), and


    ```

    \( f(r, \varphi) = \frac{1}{2} \int_{0}^{2\pi} \int_{-\pi/2}^{\pi/2} g(\gamma,
    \beta) h(D'' \sin(\gamma'' - \gamma)) D \cos \gamma \, d\gamma d\beta. \quad (3.11)
    \)

    ```


    Now, we prove a special property of the ramp filter


    ```

    \( h(D'' \sin \gamma) = \left( \frac{\gamma}{D'' \sin \gamma} \right)^2 h(\gamma),
    \quad (3.12) \)

    ```


    which will be used in the very last step, the derivation, of the fan-beam formula.


    ![](img/dd555effd38151c67af30d84800c554a_73_0.png)


    Fig. 3.11: The reconstruction point \( (r, \varphi) \) defines the angle \( \gamma''
    \) and distance \( D'' \).'
