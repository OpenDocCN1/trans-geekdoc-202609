    # 2.5 ROI reconstruction with truncated projections


    The situation of the ROI reconstruction with truncated projections is illustrated
    in Figure 2.11, where the detector is not large enough to cover the entire object
    but is large enough to cover the ROI. In tomographic theory, this ROI reconstruction
    problem is called the interior problem. Only the circular FOV (field-of-view)
    is fully measured. For a general interior problem, only an approximate solution
    can be obtained. Exact reconstructions exist only for some special cases.


    One solvable ROI reconstruction problem is shown in Figure 2.12, and the reconstruction
    is provided by the “derivative–backprojection–Hilbert transform” algorithm. The
    ROI is the dark shaded smaller region within the circular FOV. Both the derivative
    operation and the backprojection operation are local. That is, they only use the
    locally available data to find the results. After the derivative and backprojection,
    the data within the FOV are exact.'
