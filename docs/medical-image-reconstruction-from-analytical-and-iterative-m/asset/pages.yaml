    # 6.9 Mathematical expressions


    This section gives the mathematical expressions for the ART algorithm, the MLEM
    algorithm, the OS-EM algorithm, Green''s one-step late algorithm, and ML-TV (total
    variation) algorithm. Computer implementation steps are given for the conjugate
    gradient (CG) algorithm. The derivation of the ML-EM algorithm is also presented.


    # 6.9.1 ART


    The ART algorithm is a row-action algorithm. It considers one ray sum at a time
    and can be expressed as


    $X^{\text{next}} = X^{\text{current}} - \frac{A_i X^{\text{current}} - p_i}{||A_i||^2}
    A_i^T, \quad (6.44)$


    where $A_i X$ performs the forward projection along the $i$th projection ray,
    $p_i$ is the measured projection from the $i$th projection bin, $||A_i||^2 = \sum_j
    a_{ij}^2$ is the sum of the squared “contribution factors” along the $i$th ray,
    and $c A_i^T$ backprojects the value $c$ along the $i$th ray. If we rewrite the
    above algorithm in the following form:


    $X^{\text{next}} = X^{\text{current}} - \left( \frac{A_i X^{\text{current}}}{||A_i||}
    - \frac{p_i}{||A_i||} \right) \frac{A_i^T}{||A_i||}, \quad (6.45)$


    the geometric meaning of this algorithm can be easily explained as in Figure 6.20.'
