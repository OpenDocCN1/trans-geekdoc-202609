  md: '# 8.3.2 Implementation of \( I - (I - a A^T A)^k \) in the Fourier domain


    Multiplying an image with an identity matrix \( I \) does nothing to the image.
    In the Fourier domain, this is equivalent to filtering the image with a transfer
    function 1 (one).


    As pointed out in Section 8.3.1, multiplying an image by \( A^T A \) is equivalent
    to filtering the image with a transfer function \( 1/|\omega| \). Hence, multiplying
    an image by \( (I - a A^T A) \) is equivalent to filtering the image with a transfer
    function \( (1 - a/|\omega|) \). Multiplying an image by \( (I - a A^T A)^k \)
    is equivalent to filtering the image \( k \) times with a transfer function \(
    (1 - a/|\omega|) \), which is the same as filtering the image with a transfer
    function \( (1 - a/|\omega|)^k \). Thus, multiplying an image by \( I - (I - a
    A^T A)^k \) is equivalent to filtering the image with a transfer function \( 1
    - (1 - a/|\omega|)^k \).


    # 8.3.3 Landweber algorithm: backprojection-then-filtering algorithm


    Using the results in Sections 8.3.1 and 8.3.2, we are ready to implement the Landweber
    algorithm using an analytic backprojection-then-filtering algorithm. Let us once
    again rewrite eq. (8.9) here


    \( X^{(k)} = (A^T A)^{-1} \left[ I - (I - a A^T A)^k \right] A^T P. \)


    We can do part-by-part translation from the matrix notation to the Fourier domain
