- pgno: 276
  md: 'handwritten digit dataset to illustrate this point. This dataset is as basic
    and as famous as phrase “Hello, World!” as a test message for a beginner in programming.


    For example, the digit “4” can be written in different ways, some examples are
    illustrated in Figure 9.40. It is difficult to find a universal pattern W such
    that if the input image X is “4” then the inner product W · X is greater than
    a threshold b, and if the input image X is not “4” then the inner product W ·
    X is less than the threshold b.


    ![](img/dd555effd38151c67af30d84800c554a_276_0.png)


    Fig. 9.41: Handwritten samples of digit “4”.


    ![](img/dd555effd38151c67af30d84800c554a_276_1.png)


    Fig. 9.42: The first dense layer has multiple patterns for each digit; each subcategory
    of a digit belongs to one neuron. In the second dense layer, each neuron corresponds
    to a unique digit that collects all its subcategories in the first layer.


    One solution to resolve this difficulty is to have multiple subcategories of the
    digit “4.” Each subcategory represents similar styles of “4” and uses a pattern
    $W_i$ and a threshold $b_i$. We can build a dense layer neuron, $\text{ReLU}(W_i
    \cdot X - b_i)$, for the ith subcategory of “4.” The next dense layer collects
    all the subcategories of “4” into one neuron; all subcategories of other digits
    are clumped up in the similar manner, as shown in Figure 9.42.'
