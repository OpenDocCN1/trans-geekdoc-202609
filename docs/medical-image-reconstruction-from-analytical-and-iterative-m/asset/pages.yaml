  md: 'large $r$ is chosen, the resultant reconstructed image will contain high-frequency
    components and the image is noisy as well.


    More often than not, the matrix $A$ is too large to store in the computer; it
    can only be generated one row at a time when this row is used in solving the system
    of equations. Not every method that is able to solve a system of linear equations
    can be used here. For example, the methods based on diagonalizing the matrix $A$
    or transforming matrix $A$ into an upper triangle matrix are not applicable. Any
    method that modifies the matrix $A$ cannot be used. We can only use methods that
    use matrix $A$ and its transposed matrix $A^T$. Therefore, iterative methods that
    only use $A$ and $A^T$ (but do not modify them) make sense in finding an approximate
    solution to our imaging problem.


    An analytic reconstruction can be thought of as an “open-loop” system, while an
    iterative algorithm can be thought of as a “closed-loop” system. Each loop, referred
    to as an iteration, usually consists of a projection operation, a comparison of
    the projected data with the measured data, and a backprojection operation. The
    backprojection maps the data discrepancies from the projection space to the image
    space. The backprojected discrepancies will be used to modify the currently estimated
    image at each iteration (see Figure 6.2).


    ![](img/dd555effd38151c67af30d84800c554a_150_0.png)


    Fig. 6.2: A general procedure of an iterative image reconstruction algorithm.'
