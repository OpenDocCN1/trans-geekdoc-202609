    One can set up a Bayesian objective function


    \( X^2 = \|AX - PI\|_{W}^2 + \beta \|FX - GY\|^2 \)

    \( = X^T A^T W A X - 2 X^T A^T W P + P^T W P \)

    \( + \beta (X^T F^T F X - 2 X^T F^T G Y + Y^T G^T G Y), \)

