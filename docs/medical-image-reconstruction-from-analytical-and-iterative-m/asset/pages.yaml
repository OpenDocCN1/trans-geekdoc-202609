    # ## 4.4.2 SPECT: Tretiak–Metz FBP algorithm for uniform attenuation


    Attenuation correction for SPECT data is much more complicated than the PET data,
    because an event in SPECT is single photon detection (see Figure 4.17). On the
    same imaging path, the emission source at a different location has a different
    attenuation factor. This makes SPECT attenuation correction very difficult. We
    still do not know how to compensate for the attenuation by processing the projections
    as easily done as in PET. Some people have tried to perform attenuation compensation
    in the 2D Fourier domain of the sinogram using the “frequency–distance principle,”
    which is an approximate relationship: The angle in the Fourier domain is related
    to the distance from the detector in the spatial domain. However, the attenuation
    effect can be corrected during image reconstruction.


    In SPECT, if the attenuator is uniform (i.e., \(\mu = \text{constant}\) within
    the body boundary), the FBP image reconstruction algorithm is similar to that
    for the regular unattenuated data. The attenuation-corrected FBP algorithm, developed
    by Tretiak and Metz, consists of three steps:


    +   (i) Pre-scale the measured projection \( p(s, \theta) \) by \( e^{\mu d(s,
    \theta)} \), where the definition of distance \( d(s, \theta) \) is given in Figure
    4.18. We denote this scaled projection as \( \hat{p} (s, \theta) \).

    +   (ii) Filter the pre-scaled data with a notched ramp filter (see Figure 4.19).

    +   (iii) Backproject the data with an exponential weighting factor \( e^{-\mu
    t} \), where \( t \) is defined in Figure 4.20 and is dependent on the location
    of the reconstruction point as well as the backprojection angle \( \theta \).


    ![](img/dd555effd38151c67af30d84800c554a_94_1.png)


    Fig. 4.17: In SPECT, the attenuation is a mixed effect of all lengths.'
