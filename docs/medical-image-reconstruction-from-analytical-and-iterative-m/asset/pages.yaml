- pgno: 198
  md: '# 7 MRI reconstruction


    The magnetic resonance imaging (MRI) physics is quite different from that of transmission
    or emission imaging as we discussed in the previous chapters. This chapter first
    introduces the imaging physics of MRI, showing how the MRI signals are formed.
    We will see that the MRI signals are in the Fourier domain and the image reconstruction
    is achieved via the inverse Fourier transform.


    # 7.1 The “M”


    The MRI working principle is quite different from that of emission and transmission
    tomography. MRI is an image of “proton density” in a cross section of the patient.
    The data in MRI can be simplified as weighted plane integrals of the proton density
    function in that plane with “frequency”-dependent weighting functions.


    In this chapter, we present a watered-down version of the MRI principle. The goal
    of regular MRI is to get a picture of the distribution of hydrogen atoms (H<sup>+</sup>)
    within the patient body.


    The hydrogen atom is simply a proton that carries a positive charge and is continuously
    spinning. A spinning charge generates a magnetic field around it, as if it were
    a tiny magnet (see Figure 7.1). We call this tiny magnet a “magnetic moment,”
    \(\vec{\mu}\), which is a vector. The orientation is important for a vector.


    In the absence of a strong external magnetic field, the proton magnetic moments
    \(\vec{\mu}\) are randomly oriented inside the body. Thus, the *net* magnetic
    moment is zero \(\vec{0}\) (see Figure 7.2).


    When a strong external magnetic field is applied, the net magnetic moment is no
    longer zero. We denote this net magnetic moment as a vector \(\mathbf{\overline{M}}\)
    (see Figure 7.3) must point out that even in this case, not all \(\vec{\mu}\)
    are pointing in the same direction. About half of them point in the direction
    of the magnetic field, and the other half point in the opposite direction. Therefore,
    the magnitude of \(\overline{\mathbf{M}}\) is very small and is proportional to


    ```

    $$\frac{\gamma \hbar B_0}{2KT}, \quad (7.1)$$

    ```


    where *T* is the absolute temperature of the patient (in K), *K* is the Boltzmann
    constant (\(8.62 \times 10^{-11}\) MeV/K), \(\hbar\) is the Planck constant (\(6.6252
    \times 10^{-27}\) ergs), *B*<sub>0</sub> is the magnetic strength (in Tesla),
    and \(\gamma\) is an atom-dependent constant (42.58 MHz/T for H<sup>+</sup>) called
    the gyromagnetic ratio. We can see that a stronger magnetic field helps generate
    a stronger signal.


    Another concept that we need to explain MRI physics is *precession*. Let us take
    a look at a spinning toy top (or a gyroscope). Besides spinning, there is another
    motion:'
