    # 5.3 Cone-beam data


    Cone-beam image reconstruction is considerably more complex than that of parallel
    line-integral and parallel plane-integral data. There is no equivalent central
    slice theorem known to us. Cone-beam imaging geometry (see the two lower figures
    in Figure 4.13) is extremely popular, for example, in X-ray computed tomography
    (CT) and in pinhole SPECT (single-photon emission computed tomography); we will
    spend some effort to talk about its reconstruction methods.


    First, we have a cone-beam data sufficiency condition (known as Tuy''s condition):
    every plane that intersects the object of interest must contain a cone-beam focal
    point.


    This condition is very similar to the fan-beam data sufficiency condition: Every
    line that intersects the object of interest must contain a fan-beam focal point.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/dd555effd38151c67af30d84800c554a_114_0.png)


    ![](img/dd555effd38151c67af30d84800c554a_114_1.png)


    ![](img/dd555effd38151c67af30d84800c554a_114_2.png)


    **Fig. 5.9:** The circular orbit does not satisfy Tuy''s conditions. The circle-and-line
    and the helix orbits satisfy the conditions.


    In Figure 5.9, the circular cone-beam focal-point orbit does not satisfy Tuy''s
    condition. If we draw a plane cutting through the object above (or below) the
    orbit plane and parallel to the orbit plane, this plane will never intersect the
    circular orbit. The helical and circle-and-line orbits shown in Figure 5.9 satisfy
    Tuy''s condition, and they can be used to acquire cone-beam projections for exact
    image reconstruction. Modern CT uses helical orbit to acquire projection data
    (see Figure 4.8).


    # 5.3.1 Feldkamp''s algorithm


    Feldkamp''s cone-beam algorithm is dedicated to the circular focal-point trajectory.
    It is an FBP algorithm and is easy to use. Because the circular trajectory does
    not satisfy Tuy''s condition, Feldkamp''s algorithm can only provide approximate
    reconstructions. Artifacts can appear especially at locations away from the orbit
    plane. The artifacts include reduction in activity in the regions away from the
    orbit plane, cross-talk between adjacent slices, and undershoots.


    Feldkamp''s algorithm is practical and robust. Cone angle, as defined in Figure
    5.10, is an important parameter in cone-beam imaging. If the cone angle is small,
    say less than 10°, this algorithm gives fairly good images. At the orbit plane,
    this algorithm is exact. This algorithm also gives an exact reconstruction if
    the object is constant in the axial direction (e.g., a tall cylinder).'
  merge: -1
