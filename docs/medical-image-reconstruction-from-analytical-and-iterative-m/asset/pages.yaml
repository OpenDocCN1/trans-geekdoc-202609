    where Y is a reference image, and F and G are feature extracting matrices. This
    objective function pushes the selected feature of X to look like the selected
    feature of Y. For example, if Y is zero and F is the identity matrix, this objective
    function is looking for a minimum norm solution. If F and G are edge extracting
    matrices, this objective function is looking for an X that has edges similar to
    the edges of Y.


    The gradient of the objective function (8.19) is


    \( \nabla X^2 = 2 [A^T W A X - 2 A^T W P + \beta (F^T F X - F^T G Y)], \)

