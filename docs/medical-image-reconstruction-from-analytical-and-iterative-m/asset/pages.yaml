    an iterative image reconstruction algorithm, there is a backprojection step, and
    the backprojected image is somehow used to modify and improve the current image.
    No 2D filtering is necessary to process the backprojected image before the update
    of the reconstructed image. In the iterative FBP, a 1D filter is used before backprojection,
    as described in Section 8.10.1.


    It has been demonstrated that the contrast-to-noise ratio in the final reconstruction
    can be improved if a lowpass filter is applied to the backprojection of the projection-domain
    discrepancy, and then this backprojection is used to update the reconstructed
    image from the previous iteration.


    A regular iterative Landweber algorithm is given as


    \( X^{(k)} = X^{(k-1)} + \alpha A^T (P - A X^{(k-1)}). \) (8.64)


    Let the immediately after-backprojection filter be expressed by a Toeplitz square
    matrix V. A revised iterative Landweber algorithm with an immediately after-backprojection
    filter V is given as


    \( X^{(k)} = X^{(k-1)} + \alpha V A^T (P - A X^{(k-1)}). \) (8.65)


    If \( X^{(0)} \) is a zero image, eq. (8.86) can be written as


    \( X^{(k)} = (V A^T A)^{-1} \left[ I - \left( I - \alpha V A^T A \right)^k \right]
    V A^T P. \) (8.66)


    This algorithm can be implemented as a Landweber-FBP algorithm, that is, an FBP
    algorithm with a 2D window function in the Fourier domain:


    \( 1 - \left( 1 - \alpha \frac{v(\|\omega\|)}{\|\omega\|} \right)^{(k)}, \) (8.67)'
