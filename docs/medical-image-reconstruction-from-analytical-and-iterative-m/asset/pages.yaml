    # ## 7.7 Summary


    +   - The working principle of MRI is quite different from that of transmission
    and emission tomography. The MRI signal is in the form of radio waves and is received
    by antennas (called coils).

    +   - The “M” part: The patient must be positioned in a strong magnetic field
    so that the magnetic moments created by the proton spins have a chance to line
    up.

    +   - The “R” part: A resonant RF signal is required to be emitted toward the
    patient so that the net magnetic moments can be tipped over and do not align with
    the main'
