- pgno: 19
  md: '# 1.3 Image reconstruction


    In this section, we illustrate the common image reconstruction strategy by considering
    a point source. Let us consider an empty two-dimensional (2D) plane with an x–y
    coordinate system, and we place a small dot with a value, say 1, somewhere on
    this plane and not necessarily at the origin (see Figure 1.8). We now imagine
    that there is a detector (e.g., a camera) rotating around the origin, acquiring
    images of projections. At a particular angle θ, we denote the projection as p(s,
    θ), where s is the coordinate on the detector.


    ![](img/dd555effd38151c67af30d84800c554a_19_0.png)


    Fig. 1.8: Projection of a point source object.


    The projection p(s, θ) is formed by drawing a line across the x–y plane, orthogonal
    to the detector, and meeting on the detector at location s. Then we evaluate the
    line integral along this line, and the integral value is p(s, θ). In our example,
    if the line does not touch the point source, p(s, θ) is zero. If the line passes
    through the point source, then p(s, θ) is 1.


    Now we are going to reconstruct the image using the projections p(s, θ). Our strategy
    is similar to that in the tree-map example in Section 1.1, where we drew a line
    from each tree on the detector and found the location of the intersections. In
    image reconstruction, we not only need to find the location but also the intensity
    value of the object of interest.


    As shown in Figure 1.9(a), a number of projections are taken from the point source
    at various view angles. We attempt to reconstruct the point source image in the
    following manner.


    When you look at the projections p(s, θ) at one view θ, you see a spike of intensity
    1. This spike is the sum of all activities along the projection path. To reconstruct
    the image, you must redistribute the activity in the spike back to its original
    path. The problem is that you do not know where you need to put more activity
    along the path'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'and where you put less. Before you give up, you decide to put equal amounts
    of activity everywhere along the path, and the amount is the magnitude of the
    projection spike (see Figure 1.9b). If you do that for few more angles, you will
    have the situation as shown in Figure 1.9(c). Due to the superposition effect,
    there will be a tall spike in the x–y plane at the location of the point source.


    What you have just done is a standard mathematical procedure called backprojection.
    If you backproject from all angles from 0° to 360°, you will produce an image
    similar to the one shown in Figure 1.9(d).


    After backprojection, the image is still not quite the same as the original image
    but rather is a blurred version of it. To eliminate the blurring, we introduce
    negative “wings” around the spike in the projections before backprojection (see
    Figure 1.9e). The procedure of adding negative wings around the spike is called
    filtering. The use of the negative wings results in a clear image (see Figure
    1.9f). This image reconstruction algorithm is very common and is referred to as
    an FBP algorithm.


    ![](img/dd555effd38151c67af30d84800c554a_20_0.png)


    Fig. 1.9: Reconstruction of a point source image by backprojecting unfiltered
    and filtered data. (a) Project the point source; (b) backproject from one view;
    (c) backproject from a few views; (d) backproject from all views; (e) add negative
    wings; and (f) backproject modified data.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'In this section, we use a point source to illustrate the usefulness of filtering
    and backprojection with many views in image reconstruction. We must point out
    that if the object is a point source, we only need two views to reconstruct the
    image, just like the map-making example in Section 1.1.


    # ## 1.4 Backprojection


    One must first define projection before backprojection can be defined. We must
    make it clear that backprojection is not the inverse of projection. Backprojection
    alone is not sufficient to reconstruct an image. After you backproject the data,
    you do not get the original image back. We will illustrate this point by a simple
    discrete 2 × 2 problem below (see Figure 1.10).


    The original image is defined as x₁ = 3, x₂ = 2, x₃ = 4, and x₄ = 0. The associated
    projections are p(1, 0°) = 7, p(2, 0°) = 2, p(1, 270°) = 5, and p(2, 270°) = 4.
    The projections are formed one view at a time (see Figure 1.10). The backprojected
