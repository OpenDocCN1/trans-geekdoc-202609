    \(\int_{-\infty}^{\infty} \delta(ax)f(x)dx = \frac{1}{|a|}f(0), \quad (1.22)\)


    \(\int_{-\infty}^{\infty} \delta^{(n)}(x)f(x)dx = (-1)^n f^{(n)}(0) \text{[the
    nth-order derivative]}, \quad (1.23)\)


    \(\delta(g(x))f(x) = f(x) \sum_n \frac{1}{|g''(\lambda_n)|} \delta(x-\lambda_n),
    \quad (1.24)\)


    where \(\lambda_n\)s are the zeros of \(g(x)\).


    In 2D and 3D cases, \(\delta(\vec{x}) = \delta(x)\delta(y)\) and \(\delta(\vec{x})
    = \delta(x)\delta(y)\delta(z)\), respectively. In the last property, \(|g''|\)
    will be replaced by \(|\text{grad}(g)| = \sqrt{(\partial g/\partial x)^2 + (\partial
    g/\partial y)^2}\) and \(|\text{grad}(g)| = \sqrt{(\partial g/\partial x)^2 +
    (\partial g/\partial y)^2 + (\partial g/\partial z)^2}\), respectively, in 2D
    and 3D cases.


