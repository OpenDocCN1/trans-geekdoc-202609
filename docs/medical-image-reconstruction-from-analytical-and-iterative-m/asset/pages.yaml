    + \omega_y^2}\), and the resultant Fourier space “image” is \(F(\omega_x, \omega_y)\).
    The 2D inverse Fourier transform of \(F(\omega_x, \omega_y)\) gives the exact
    original image \(f(x, y)\).


    The other way is to multiply the 1D Fourier transform \(P(\omega, \theta)\) of
    the projection data \(p(s, \theta)\) by \(|\omega|\). We then take the 1D inverse
    Fourier transform of \(|\omega|P(\omega, \theta)\). After this special treatment
    (i.e., filtering) of the projection data, the treated (i.e., filtered) projection
    data are backprojected, and the exact original image \(f(x, y)\) is obtained.
    Note that in the previous discussion (see Figure 2.3), we ignored the second variable
    in \(P(\omega, \theta)\) and \(p(s, \theta)\) on purpose to allow the reader to
    pay attention to the first variable.


    These two methods (i.e., multiplying the Fourier transformed backprojected image
    by \(\sqrt{\omega_x^2 + \omega_y^2}\) and multiplying the Fourier transformed
    projections by \(|\omega|\)) will be further discussed later in this book. The
    second method, which is referred to as the FBP algorithm, is more popular than
    the first. The function \(|\omega|\) is called the *ramp filter* in tomography,
    named after its appearance (see Figure 2.5). It is the second method that added
    negative “wings” around the spikes in the projections in Chapter 1.


    ![](img/dd555effd38151c67af30d84800c554a_36_0.png)


    Fig. 2.5: The 1D ramp filter transfer function.


    # ## 2.3 Reconstruction algorithms


    Backprojection accomplishes most of the work in image reconstruction; it converts
    the projection data at various views into an image, which is almost what we wanted
    except for the blurring effect. The blurring effect is caused by the \(1/|\omega|\)
    nonuniform weighting, with \(|\omega| = \sqrt{\omega_x^2 + \omega_y^2}\), in the
    2D Fourier space (i.e., the \(\omega_x\omega_y\) plane). Compensation for \(1/|\omega|\)
    function can be realized by filtering the projection data \(p(s, \theta)\) or
    equivalently its 1D Fourier transform \(P(\omega, \theta)\) with a ramp filter
    \(|\omega|\). If the filtered projection data are backprojected, the exact image
    can be obtained.'
