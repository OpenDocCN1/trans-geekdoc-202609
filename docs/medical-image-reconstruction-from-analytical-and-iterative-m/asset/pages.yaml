  md: 'An immediate extension of this analytic continuation method can be applied
    to the general interior problem, where a small region of the image within the
    FOV is exactly known in advance (see Figure 2.14). The known region in the image
    can be very small.


    We now explain what we mean by analytic continuation. The analytic continuation
    is a subject in a mathematical branch called complex analysis, which studies functions
    with complex variables.


    If x is a real variable, h(x) = 2x + i(3 + 5x), with i = √−1, is not a function
    with a complex variable. However, h(z) = 2z, with z = x + iy and both x and y
    are real, is a function with a complex variable and is defined in a region (called
    domain) in the complex plane.


    A complex function h(z) is said to be analytic in a complex region R, if and only
    if the function h(z) is differentiable at every point in R. If a complex function
    is analytic on a region R, it is infinitely differentiable in R. Therefore, you
    can have a power expansion of an analytic function h(z) anywhere in R. You can
    imagine that an analytic function is very smooth.


    Let h1(z) and h2(z) be analytic functions in regions R1 and R2, respectively,
    and suppose that the intersection R1 ∩ R2 is not empty and that h1(z) = h2(z)
    on R1 ∩ R2. Then h2(z) is called an analytic continuation of h1(z) to R2, and
    vice versa. Moreover, the analytic continuation of h1(z) to R2 is unique. This
    uniqueness of analytic continuation is a rather amazing and extremely powerful
    statement. If a complex function h(z) is analytic in a region R, knowing the value
    of h(z) in a very small subregion of R uniquely determines the value of the function
    h(z) at every other point in R.


    If our 2D image f(x, y) is known in a small region Ωknown, we can somehow determine
    the image f(x, y) in a larger region Ω. Note that f(x, y) is not an analytic function.
    We do not perform analytic continuation on f(x, y).


    ![](img/dd555effd38151c67af30d84800c554a_45_0.png)


    Fig. 2.15: The known image values on [-r, r] together with the truncated projections
    can be used to determine image values in (-1, 1).'
