    # 5.1.1 Backprojection-then-filtering


    If the data are sufficiently measured, the 3D image can be exactly reconstructed.
    Like 2D image reconstruction, one can reconstruct an image either by performing
    the backprojection first or by performing the backprojection last. If the backprojection
    is performed first, the algorithm is a backprojection-then-filtering algorithm,
    and it is described in the following steps:'
  merge: -1
