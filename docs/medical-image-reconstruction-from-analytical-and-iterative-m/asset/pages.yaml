- pgno: 222
  md: '# 8.4 The Landweber algorithm: the weighted FBP algorithm


    # 8.4.1 Landweber algorithm: FBP without noise weighting


    In Section 8.3, a backprojection-then-filtering algorithm is derived to emulate
    the iterative Landweber algorithm. This algorithm is almost the same as the conventional
    backprojection-then-filtering algorithm except that the ramp filter is modified
    by a window function, which is controlled by the iteration number k and a parameter
    a.


    As presented in Chapter 2, many algorithms are equivalent and they belong to a
    big FBP family. Figure 2.9 lists 10 algorithms in this big family, and they can
    be converted from any one of them to another.


    To convert a backprojection-then-filtering algorithm to an FBP algorithm, all
    one has to do is to take the central slice of the 2D ramp filter as the 1D filter.
    In our case, the 2D ramp filter and the 2D window function are isotropic (that
    is, radially symmetrical). If presented in the polar coordinate system, they are
    functions of the radius and independent from the angles. The 1D central sections
    of them have the same expressions as the 2D radial expression (see Figure 8.2).
    Therefore, the FBP algorithm that emulates the Landweber algorithm consists of
    the following steps:


    +   1. Find the 1D Fourier transform of the projections p(s, theta) with respect
    to the first variable s, obtaining P(omega, theta).

    +   2. Multiply P(omega, theta) with a windowed ramp filter |omega|[1 - (1 - a/|omega|)^k],
    obtaining Q(omega, theta).

    +   3. Find the 1D inverse Fourier transform of Q(omega, theta) with respect to
    the first variable omega, obtaining q(s, theta).

    +   4. Backproject q(s, theta) to obtain the final reconstruction.


    This FBP algorithm is almost the same as the conventional FBP algorithm, except
    that the conventional ramp filter is replaced by a windowed ramp filter and the
    window function is controlled by the iteration number k and a parameter a. The
    transition from an iterative algorithm to an FBP algorithm is not so bad, is it?


    You are encouraged to implement this Landweber-FBP algorithm and the iterative
    Landweber algorithm. When you compare their reconstructed images, the images are
    not 100% identical. These two algorithms are not truly equivalent. The FBP algorithm
    assumes continuous functions and has a shift-invariant property. On the other
    hand, the iterative algorithm depends on how the image array pixels are defined.
    The combined projection and backprojection A^T A in an iterative algorithm do
    not give a perfect 1/r point spread function. The discrepancy between the results
    of these two algorithms is caused by the discrepancy between A^T A and the 1/r
    point spread function. However, the discrepancies are not large. Figure 8.3 shows
    a pair of reconstructions by these two algorithms with k = 20, where the values
    of the parameter a are different for two algorithms.'
