    \int_{y=-\infty}^{\infty} f(x,y) \delta(\cos\theta + y \sin\theta - s) dy dx -
    p(s, \theta) \right]^2 ds d\theta + \beta \int_{x=-\infty}^{\infty} \int_{y=-\infty}^{\infty}
    [f(x,y) - g(x,y)]^2 dy dx.

    ```


    Now we are ready to use the calculus of variations to find the optimal function
    $f(x, y)$ that minimizes the objective function $v(f)$ in eq. (8.48). The initial
    step is to replace the function $f(x, y)$ in eq. (8.48) by the sum of two functions:
