- pgno: 107
  md: '# 5 Three-dimensional image reconstruction


    This chapter is focused on 3D tomographic imaging. In 3D, we will consider the
    parallel line-integral projections, parallel plane-integral projections, and cone-beam
    line-integral projections, separately. For the 3D parallel line-integral projections
    and parallel plane-integral projections, there exist the central slice theorems,
    from which the image reconstruction algorithms can be derived. However, for the
    cone-beam projections the situation is different; there is no central slice theorem
    for cone beam. We have to somehow establish a relationship between the cone-beam
    projections and the 3D image itself. Since the cone-beam image reconstruction
    is an active research area, this chapter spends a significant effort on discussing
    cone-beam reconstruction algorithms, among which the Katsevich algorithm is the
    latest and the best one.


    # 5.1 Parallel line-integral data


    In many cases, 3D image reconstruction can be decomposed into a series of slice-by-slice
    2D image reconstructions if the projection rays can be divided into groups, where
    each group contains only those rays that are confined within a transaxial slice
    (see Figure 5.1, left).


    In other cases, the projection rays run through transaxial slices, where the slice-by-slice
    2D reconstruction approach does not work (see Figure 5.1, middle and right).


    The foundation for 2D parallel-beam image reconstruction (Section 2.2). The central
    slice theorem in 3D states that the 2D Fourier transform \(P(\omega_u, \omega_v,
    \vec{\theta})\) of the projection \(P(u, v, \vec{\theta})\) of a 3D function \(f(x,
    y, z)\) is equal to a slice through the origin of the 3D Fourier transform \(F(\omega_x,
    \omega_y, \omega_z)\) of that function which is parallel to the detector (see
    Figure 5.2). Here, \(\vec{\theta}\) is the normal direction of the \(u\)-v plane
    and the \(\omega_u\)-\(\omega_v\) plane. The direction \(\vec{\theta}\) represents
    a group of rays that are parallel to \(\vec{\theta}\).


    Based on this central slice theorem, we can determine some specific trajectories
    of \(\vec{\theta}\) so that we are able to fill up the \((\omega_x, \omega_y,
    \omega_z)\) Fourier space. One such option is shown in Figure 5.3, where the trajectory
    of \(\vec{\theta}\) is a great circle. A great circle is a circle with unit radius
    that lies on the surface of the unit sphere (see Figure 5.4). Each unit vector
    \(\vec{\theta}\) on the great circle corresponds to a measured \(P(\omega_u, \omega_v,
    \vec{\theta})\) plane in the \((\omega_x, \omega_y, \omega_z)\) Fourier space.
    After the unit vector \(\vec{\theta}\) completes the great circle, the measured
    \(P(\omega_u, \omega_v, \vec{\theta})\) planes fill up the entire \((\omega_x,
    \omega_y, \omega_z)\) Fourier space. In fact, due to symmetry, if the unit vector
    \(\vec{\theta}\) completes *half* of the great circle, a complete data set is
    obtained.


    The above example can be generalized, as stated in Orlov''s condition: A complete
    data set can be obtained if every great circle intersects the trajectory of the
    unit vector \(\vec{\theta}\), which is the direction of the parallel rays. The
    trajectory can be curves on the sphere and can also be regions on the sphere.
    Some examples of the \(\vec{\theta}\) trajectories'
  merge: -1
  img_proc: true
