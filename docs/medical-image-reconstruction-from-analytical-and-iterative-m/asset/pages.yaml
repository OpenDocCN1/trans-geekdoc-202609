    ![](img/dd555effd38151c67af30d84800c554a_34_0.png)


    Fig. 2.2: A Fourier transform pair.


    One can also find the Fourier transform for a function with two or more variables.
    We will denote the Fourier transform of the function f(x, y) as F(ωx, ωy), where
    ωx is the frequency in the x direction and ωy is the frequency in the y direction.


    # ## 2.2 Central slice theorem


    Central slice theorem is the foundation of tomography. It has other names: projection
    slice theorem and Fourier slice theorem. The central slice theorem in 2D states
    that the 1D Fourier transform P(ω) of the projection p(s) of a 2D function f(x,
    y) is equal to a slice (i.e., a 1D profile) through the origin of the 2D Fourier
    transform F(ωx, ωy) of that function which is parallel to the detector (see Figure
    2.3).


    If we rotate the detector around the object at least for 180°, the corresponding
    “central slice” in the 2D Fourier transform F(ωx, ωy) will rotate synchronously
    and will cover the entire 2D Fourier space, that is, the ωx-ωy plane (see Figure
    2.4). In other words, by rotating the detector 180°, the entire 2D Fourier transform
    F(ωx, ωy) is “measured.” Once F(ωx, ωy) is available, the original 2D function
    f(x, y) can be readily obtained by a mathematical procedure called the 2D inverse
    Fourier transform.


    Backprojecting projection data at one view is equivalent to adding a “central
    slice” of F(ωx, ωy) in the ωx-ωy plane (i.e., the Fourier space). Backprojection
    over 180° fully reconstructs the 2D Fourier transform F(ωx, ωy). Due to the property
    of the Fourier pair, the original function f(x, y) can be readily found from F(ωx,
    ωy).


    In Chapter 1, we learned that backprojection alone does not get you the original
    image back; instead, a blurred image is obtained. Is there a contradiction here?
    No. Let us take another look of the ωx-ωy plane in Figure 2.4. After we add the
    “central slices” to the ωx-ωy plane, we see higher density of the “central slices”
    at the origin of the ωx-ωy'
