    ```

    \sum_{n=0}^{k-1} r^n = \frac{1-r^k}{1-r} .

    ```


    A similar summation formula exists for matrices:


    ```

    \sum_{n=0}^{k-1} B^n = \left( I - B \right)^{-1} \left( I - B^K \right)

    ```


    if \( \left( I - B \right)^{-1} \) exists. Equation (8.7) can be easily verified
    by left-multiplying \( \left( I - B \right) \) on both sides. Thus, we have


    ```

    F^{(k)} = \alpha \sum_{n=0}^{k-1} \left( I - \alpha A^T W A \right)^n \alpha A^T
    W = \left( A^T W A \right)^{-1} \left[ I - \left( I - \alpha A^T W A \right)^k
    \right] A^T W .

    ```


