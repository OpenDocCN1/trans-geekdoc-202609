- pgno: 91
  md: 'A typical SPECT image and a PET image are shown in Figure 4.15. When comparing
    X-ray CT, PET, and SPECT, we observe that X-ray CT has the best resolution and
    is least noisy, and SPECT has the worst resolution and most noise. Image quality
