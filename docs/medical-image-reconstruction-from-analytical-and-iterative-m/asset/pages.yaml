- pgno: 77
  md: 'the projections can cause a spike in the ramp-filtered projections. In an ideal
    situation, an opposite spike will also be created and this opposite spike should
    be able to cancel the other spike. When data are discretely sampled, the positive
    spike and the negative spike do not match well. The uncanceled residue causes
    image artifacts. The main strategy of Parker''s method is to make the weighting
    function as smooth as possible so that the weighting function does not introduce
    any undesired components.


    # 3.4.4 Errors caused by finite bandwidth implementation


    In the derivation of the fan-beam FBP algorithm in Section 3.4.1, the bandwidth
    of the ramp filter is assumed to be infinity:


    $$h(\gamma) = \int_{-\infty}^{\infty} |\omega| e^{i2\pi\omega\gamma} d\omega.\tag{3.24}$$


    It has a property that


    $$h(a\gamma) = \int_{-\infty}^{\infty} |\omega| e^{i2\pi\omega\gamma} d\omega
    = \frac{1}{a^2} h(\gamma).\tag{3.25}$$


    In practice, the data are discretely sampled and the bandwidth is bounded. The
    band-limited ramp filter is expressed as


    $$h_{\Omega}(\gamma) = \int_{-\Omega}^{\Omega} |\omega| e^{i2\pi\omega\gamma}
    d\omega.\tag{3.26}$$


    Let $x = a\omega$ and we have


    $$h_{\Omega}(a\gamma) = \frac{1}{a^2} \int_{-a\Omega}^{\Omega} |x| e^{i2\pi x\gamma}
    dx = \frac{1}{a^2} h_{\Omega \doteq a}(\gamma) \neq \frac{1}{a^2} h_{\Omega}(\gamma).\tag{3.27}$$


    Therefore, for band-limited fan-beam data, the derivation of the fan-beam FBP
    algorithm in Section 3.4.1 is not valid. Fortunately, for the full-scan fan-beam
    projections, the errors in the FBP reconstruction are not significant and are
    usually noticeable. However, the errors can be significant for short-scan fan-beam
    data when the fan-beam focal length is short and the Parker weights are used.
    Figure 3.13 illustrates a short-scan fan-beam FBP reconstruction when a short
    focal length of 270 units is used. The object is a uniform disk with a radius
    of 230 units. The true image value within the disk is 1. The image display window
    is [0.76, 1.57].'
