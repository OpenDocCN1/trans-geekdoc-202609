    \theta)}{|\omega|} e^{2\pi i \omega (x \cos \theta + y \sin \theta)} |\omega|
    d\omega d\theta.$ (2.46)


    This is the 2D inverse Fourier transform in polar coordinates. If we take the
    2D Fourier transform (in the polar coordinate system) on both sides of the above
    equation, we have


    $B_{\text{polar}}(\omega, \theta) = \frac{F_{\text{polar}}(\omega, \theta)}{|\omega|},$
    (2.47)


    or in the Carteisan system,


    $B(\omega_x, \omega_y) = \frac{F(\omega_x, \omega_y)}{\sqrt{\omega_x^2 + \omega_y^2}};$
    (2.48)


    that is,


    $F(\omega_x, \omega_y) = \sqrt{\omega_x^2 + \omega_y^2} B(\omega_x, \omega_y).$
    (2.49)


    The backprojection-then-filtering algorithm follows immediately.


    # ### 2.6.8 Expression of the derivative-backprojection-Hilbert transform algorithm


    This algorithm is Method 5 discussed in Section 2.3.5 and can be expressed as


    $f(x,y) = \mathbf{H}_x \int_{0}^{\pi} \frac{\partial p(s, \theta)}{\partial s}
    \Big|_{s=x \cos \theta + y \sin \theta} d\theta.$ (2.50)


    The line-by-line 1D Hilbert transform in the x-direction is denoted as $\mathbf{H}_x$,
    which can be implemented either as a convolution with a kernel $1/(\pi x)$ or
    in the Fourier domain as a multiplication with a transfer function $i \text{sgn}(\omega_x)$.


    Both derivative and backprojection are local operators. The x-direction Hilbert
    transform $\mathbf{H}_x$ is not a local operator; however, it only depends on
    the data on a finite range as discussed in Section 2.6.2. This algorithm can be
    used to reconstruct a finite ROI if the projections are truncated in the y direction
    (see Section 2.5).'
