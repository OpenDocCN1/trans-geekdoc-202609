    # ## 6.5 OS-EM algorithm


    In ART, the image is updated after each projection ray is considered. On the other

    hand, in gradient descent methods and in the ML-EM algorithm, the image is updated

    only when all projection rays are considered. One way to speed up the convergence

    rate of an iterative algorithm is to make more frequent image updates.


    In an OS-EM algorithm, the projection views are grouped in different sets (called

    subsets), the algorithm goes through the subsets in a specified order, and the
    image is

    updated after each subset is considered. Figure 6.10 shows an example of how the
    pro-

    jection views are divided into subsets. There are many strategies for dividing
    the

    views into subsets.


    Increasing the number of subsets accelerates the convergence rate but may increase

    the noise as well. Roughly speaking, if you have N subsets, you may accelerate

    the ML-EM algorithm about N times. Modest acceleration of approximately 10 times
    is

    possible with very little increase in noise.


