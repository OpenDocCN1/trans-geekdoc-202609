  md: 'TV(v) = \iint \|\nabla v(x,y)\|_2 dxdy = \iint \sqrt{(\frac{\partial v}{\partial
    x})^2 + (\frac{\partial v}{\partial y})^2} dxdy.


    The TV norm minimization enforces a flat image with the gradient being zero in
    most places. The resultant image tends to be piecewise constant. In practice,
    a small number \(\varepsilon\) is introduced to calculate the TV norm as


    TV(v) \approx \iint \sqrt{(\frac{\partial v}{\partial x})^2 + (\frac{\partial
    v}{\partial y})^2 + \varepsilon^2} dxdy


    so that the TV norm (6.101), is differentiable. In order to get some intuition
    about the modified TV norm (6.101), let us assume \(\varepsilon^2 = 1\). Then
    the above expression is nothing but the surface area formula!


    We see that minimizing the modified TV norm is almost equivalent to minimizing
    the surface area. If a solution has a minimum surface area, it has the least oscillations.
    TV norm minimization avoids the \(l_0\) quasi-norm and \(l_1\) norm minimization.


    Using Green''s one-step-late method presented in Section 6.9.6, a TV-regulated
    EM (TV-EM) algorithm can be obtained as


    x_i^{next} = \frac{x_j^{current}}{\sum_i a_{ij} + \beta \frac{\partial TV(x^{current})}{\partial
    x_i^{current}}} \sum_i a_{ij} \frac{p_i}{\sum_j a_{ij} x_j^{current}}.


    For a 2D image X, if we express each pixel with double indices as x_{k,l} then
    the partial derivative in the above TV-EM algorithm can be given as


    \frac{\partial TV(X)}{\partial x_{k,l}} = \frac{x_{k,l} - x_{k-1,l}}{\sqrt{(x_{k,l}
    - x_{k-1,l})^2 + (x_{k-1,l+1} - x_{k-1,l})^2 + \varepsilon^2}} + \frac{x_{k,l}
    - x_{k,l-1}}{\sqrt{(x_{k+1,l-1} - x_{k,l-1})^2 + (x_{k,l} - x_{k,l-1})^2 + \varepsilon^2}}
    - \frac{x_{k+1,l} + x_{k,l+1} - 2x_{k,l}}{\sqrt{(x_{k+1,l} - x_{k,l})^2 + (x_{k,l+1}
    - x_{k,l})^2 + \varepsilon^2}}.


    Reconstruction with highly undersampled data is a Bayesian reconstruction problem.
    Performing the sparsifying transform \(\psi X\) is one way to extract the prior
    knowledge from the image X. If other prior information about the image X is available,
    it should be included in the objective function as well.'
