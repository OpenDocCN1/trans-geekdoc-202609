    # 1.5.3 The Dirac $\delta$-function


    The Dirac $\delta$-function is not a regular function that maps a value in the
    domain to a value in the range. The Dirac $\delta$-function is a generalized function
    or a distribution function. The $\delta$-function can be defined in many ways.
    Here, we use a series of Gaussian functions to define the $\delta$-function. Each
    of the Gaussian functions (see Figure 1.13) has a unit area underneath its curve,
    and as the parameter \(n\) gets larger, the curve gets narrower and taller (see
    Figure 1.13):


    $$\left(\frac{n}{\pi}\right)^{1/2} e^{-nx^2}. \quad (1.19)$$


    ![](img/dd555effd38151c67af30d84800c554a_25_0.png)


    Fig. 1.13: Using a train of Gaussian functions to define the $\delta$-function.


    Let \(f(x)\) be the smooth function that is differentiable everywhere with any
    order and \(\lim_{x \to \infty} x^N f(x) = 0\) for all \(N\). Then the $\delta$-function
    is defined implicitly as


    $$\lim_{x \to -\infty} \int_{-\infty}^{\infty} \left(\frac{n}{\pi}\right)^{1/2}
    e^{-nx^2} f(x) dx = \int_{-\infty}^{\infty} \delta(x) f(x) dx = f(0). \quad (1.20)$$'
