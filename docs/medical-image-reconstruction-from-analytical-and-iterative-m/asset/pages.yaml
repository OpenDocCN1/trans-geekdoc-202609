    # 7.3.2 To obtain x-information: frequency encoding


    We use the x-gradient to provide the x-position information. When we are ready
    to receive the RF signal from the patient, we turn on the x-gradient. The x-gradient
    is generated by the x-gradient coils, and it makes the strength of the main magnetic
    field to vary in the x-direction. The principle of using x-gradient to code x-position
