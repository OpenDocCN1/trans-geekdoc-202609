  md: 'Here, \(\frac{\sin(\pi M(\omega - k/M))}{\sin(\pi(\omega - k/M))}\), similar
    to the sinc function, has a removable singularity at \(\omega = k/M\), and it
    is a continuous function if one defines \(\frac{\sin(\pi M(\omega - k/M))}{\sin(\pi(\omega
    - k/M))} = M\) at \(\omega = k/M\). If \(H_c(\omega)\) is an even function, eq.
    (2.56) reduces to


    \(H(k) = \int_{-0.5}^{0.5} H_c(\omega) \frac{\sin\left(\pi M\left(\omega - \frac{k}{M}\right)\right)}{\sin\left(\pi\left(\omega
    - \frac{k}{M}\right)\right)} \cos\left(\pi(M-1)\left(\omega - \frac{k}{M}\right)\right)
    d\omega.\quad (2.57)\)


    It is learned from eq. (2.57) that in general


    \(H(k) \neq H_c(k/M).\quad (2.58)\)


    When \(M\) is chosen as an integer at least \(2N-1\), eq. (2.57) can be further
