  md: '![](img/dd555effd38151c67af30d84800c554a_70_0.png)


    Fig. 3.6: Flat and curved detector fan-beam geometries.


    The method outlined in Figure 3.5 is generic. We have a long list of parallel-beam
    image reconstruction algorithms. They can all be converted into fan-beam algorithms
    in this way, and accordingly, we also have a long list of fan-beam algorithms.
    We must point out that after changing the variables, a convolution operation (with
    respect to variable s) may not turn into a convolution (with respect to variable
    γ) automatically, and some mathematical manipulation is needed to turn it into
    a convolution form. Like parallel-beam algorithms, the fan-beam algorithms include
    combinations of ramp filtering and backprojection or combinations of the derivative,
    Hilbert transform, and backprojection (DHB).


    Researchers treat the flat detector fan-beam and curved detector fan-beam differently
    in reconstruction algorithm development. In a flat detector, the data points are
    sampled with equal distance Δs intervals, while in a curved detector, the data
    points are sampled with equal angle Δγ intervals (see Figure 3.6). A fan-beam
    algorithm can be converted from one geometry to the other with proper weighting
    adjustments.


    # 3.3 Short scan


    In parallel-beam imaging, when the detector rotates 2π (i.e., 360°), each projection
    ray is measured twice, and the redundant data are related by


    ```

    p(s, θ) = p(−s, θ + π);

    ```


    the redundant data are acquired by the two face-to-face detectors (see Figure
    3.7). Therefore, it is sufficient to acquire data over an angular range of π.


    Likewise, when the fan-beam detector rotates 2π, each projection ray is also measured
    twice, and the redundant data are related by (see Figure 3.8)'
