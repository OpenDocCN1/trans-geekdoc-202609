    # ## 9.6 Super-resolution


    In medical imaging, sometimes the measurements are undersampled. To estimate the
    unmeasured measurements is closely related to super-resolution image estimation.
    We always have doubts whether it is even possible to obtain a high-resolution
    image from a low-resolution image. We believe that image processing is unable
    to create unmeasured information. Successful evidence suggests that under some
    circumstances super-resolution is possible. Super-resolution images may be visually
    appealing, but they may not be identical to the true original high-resolution
    images.


    The traditional linear space expansion theory may not be able to explain the machine
    learning models due to the nonlinearities in the models. The traditional approach
    is to engineer a procedure to enhance the high frequency components so that the
    blurred low-resolution image becomes a sharp high-resolution image. This traditional
    approach does not work well because noise and Gibbs oscillation artifacts will
    be amplified.


    One explanation suggests that the neural network somehow remembers the sharp edges
    of the training labels and find the closest sharp edges for the new input low-resolution
    images. This explanation may not be what actually happens in reality.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Another hypothetical explanation of the magic of achieving super-resolution
    is through image mapping. A mapping is essentially a table lookup approach as
    illustrated in Figure 9.34. The blurred curve on the left of Figure 9.34 is the
    input n-tuple of the machine learning model. The sharp curve on the right of Figure
    9.34 is the output n-tuple of the model. After enough training pairs are used
    to train the model parameters, the model is expected to output a sharp curve for
    an unseen blurred curve input. How satisfactory of the output will depend on how
    similar the unseen input is to the training inputs.


    Still another explanation is that the neural networks are nonlinear combinations
    of edge detection filters. As a result, the high-frequency edges are enhanced.
    To reduce the pixelization effects in the low-resolution images, a depth-to-space
    transform by shifting the images from different channel outputs to form a higher-resolution
    image is illustrated in Figure 9.35, where the phrase “feature extraction” is
    another way to say “filtration.” The filtered images are sometimes referred to
    as feature maps. In Figure 9.35, the input is a 4 × 4 low-resolution image, and
    the output of the convolutional layers consists of four channels with a 4 × 4
    at each channel. The depth-to-space transformation merges these four channels
    into one 8 × 8 high-resolution image.


    ![](img/dd555effd38151c67af30d84800c554a_272_0.png)


    ![](img/dd555effd38151c67af30d84800c554a_272_1.png)'
