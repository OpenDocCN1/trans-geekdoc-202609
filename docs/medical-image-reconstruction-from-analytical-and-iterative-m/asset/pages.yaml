    # ## 2.8 Summary


    +   - The Fourier transform is a useful tool to express a function in the frequency
    domain. The inverse Fourier transform brings the frequency representation back
    to the original spatial domain expression.

    +   - In the Fourier domain, the projection data and the original image are clearly
    related. This relationship is stated in the popular central slice theorem. The
    1D Fourier transform of the projection data at one view is one line in the 2D
    Fourier transform of the original image. Once we have a sufficient number of projection
    view angles, their corresponding lines will cover the 2D Fourier plane.

    +   - The backprojection pattern in the 2D Fourier domain indicates that the sampling
    density is proportional to $1/|\omega|$. Therefore, the backprojection itself
    can only provide a blurred reconstruction. An exact reconstruction requires a
    combination of ramp filtering and backprojection.

    +   - The most popular image reconstruction algorithm is the FBP algorithm. The
    ramp filtering can be implemented as multiplication in the frequency domain or
    as convolution in the spatial domain.

    +   - One has the freedom to switch the order of ramp filtering and backprojection.

    +   - Ramp filtering can be further decomposed to the Hilbert transform and the
    derivative operation. Therefore, we have even more ways to reconstruct the image.

    +   - Under certain conditions, the ROI can be exactly reconstructed with truncated
    projection data.

    +   - The readers are expected to understand two main concepts in this chapter:
    the central slice theorem and the FBP algorithm.'
