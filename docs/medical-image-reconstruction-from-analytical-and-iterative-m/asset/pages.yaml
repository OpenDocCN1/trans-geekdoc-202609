    two shifted Hilbert transform transfer functions.


    # 4.4.3 SPECT: Inouye''s algorithm for uniform attenuation


    The Tretiak–Metz algorithm is in a beautiful FBP form. However, this algorithm
    generates very noisy images. The significant noise propagation from the projections
    to the reconstructed image is mainly contributed by the backprojector. In the
    Tretiak–Metz FBP algorithm, the backprojector has an exponential factor \(e^{-\mu
    t}\), where \(t\) can be positive or negative. This exponential factor gives a
    noise variance amplification factor of \(e^{-2\mu t}\). In other words, if the
    noise variance in the filtered sinogram is \(\sigma^2\), the noise will propagate
    into the reconstructed image with a variance approximately \(e^{-2\mu t}\sigma^2\).
