    # 7.5.2 Iterative reconstruction


    As in emission and transmission computed tomography, better images can be obtained
    if more imaging physics aspects are modeled and incorporated into the image reconstruction
    algorithm. The simple Fourier transform model discussed earlier in this chapter
    is not adequate for this model-based image reconstruction.


    In many situations, the $k$-space is not fully sampled. Constraints are needed
    to supply some prior information. A common method is to set up an objective function
    that includes the imaging physics models and constraints. An iterative algorithm
    is used to reconstruct the image by minimizing the objective function as discussed
    in Chapter 6.


    A typical objective function for iterative MRI image reconstruction is shown as
    follows:


    ```

    $F = ||AX - P||^2 +$ Bayesian terms, (7.22)

    ```


    where $AX$ symbolically represents two actions: 2D Fourier transform of the image
    $X$ and a binary selecting function to identify measured $k$-space sample locations.
    The $k$-space measurements are denoted by $P$. The optimization algorithm to minimize
    the objective function (7.22) produces a complex-valued image, which should be
    converted to a real and nonnegative image at the end.'
