  md: '\(f(x,y) = \int_{0}^{\pi} \int_{-\infty}^{\infty} F_{polar}(\omega, \theta)|\omega|
    e^{2\pi i \omega (x \cos \theta + y \sin \theta)} d\omega d\theta.\) (2.34)


    By using the central slice theorem, we can replace F by P:


    \(f(x,y) = \int_{0}^{\pi} \int_{-\infty}^{\infty} P(\omega, \theta)|\omega| e^{2\pi
    i \omega (x \cos \theta + y \sin \theta)} d\omega d\theta.\) (2.35)


    We recognize that \(|\omega|\) is the ramp filter. Let \(Q(\omega, \theta) = |\omega|
    P(\omega, \theta)\), then


    \(f(x,y) = \int_{0}^{\pi} \int_{-\infty}^{\infty} Q(\omega, \theta) e^{2\pi i
    \omega (x \cos \theta + y \sin \theta)} d\omega d\theta.\) (2.36)


    Using the definition of the 1D inverse Fourier transform and denoting the inverse
    Fourier transform of Q as q, we have


    \(f(x,y) = \int_{0}^{\pi} q(x \cos \theta + y \sin \theta, \theta) d\theta,\)
    (2.37)


    or


    \(f(x,y) = \int_{0}^{\pi} q(s, \theta)|_{s=x \cos \theta + y \sin \theta} d\theta.\)
    (2.38)


    This is the backprojection of \(q(s, \theta)\) (see Section 1.5).


    # ## 2.6.5 Expression of the convolution backprojection algorithm


    Let the convolution kernel h(s) be the inverse Fourier transform of the ramp filter
    \(|\omega|\); that is, \(h(s) = \int_{-\infty}^{\infty} |\omega| e^{2\pi i \omega
    s} d\omega\). It is readily obtained from Section 2.6.4 that


    \(f(x,y) = \int_{0}^{\pi} [h(s) * p(s, \theta)]|_{s=x \cos \theta + y \sin \theta}
    d\theta\)

    \(= \int_{0}^{\pi} \int_{-\infty}^{\infty} h(x \cos \theta + y \sin \theta - s)
    p(s, \theta) ds d\theta.\) (2.39)'
