  md: 'ramp filter \(\sqrt{\omega_x^2 + \omega_y^2}\) to both sides of the above Fourier
    domain relationship, the Fourier transform \(F(\omega_x, \omega_y)\) of the original
    image \(f(x, y)\) is readily obtained:


