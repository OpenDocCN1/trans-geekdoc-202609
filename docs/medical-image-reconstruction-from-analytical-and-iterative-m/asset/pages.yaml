    # 9.8 Attention


    There is a strategy in machine learning called *attention*. In a network layer,
    a pixel in the output is strongly influenced by some certain pixels in the input
    image. The network will pay more attention to those input pixels. In image denoising
    and super-resolution applications, the neighboring pixels have the most influence.
    The CNN architecture has a built-in attention scheme to focus only the nearby
    input image pixels covered by the convolution kernel. The uncovered pixels are
    ignored, as illustrated by Figure 9.38.


    For a direct end-to-end reconstruction network, a pixel in the reconstructed image
    is strongly influenced by the sinogram data along a particular sinewave, as illustrated
    by Figure 9.39. The reconstruction network should pay more attention to those
    sinogram pixels along this particular sinewave. The sinewave attention region
    in the input varies with the output image pixel location.


    A general attention architecture is illustrated in Figure 9.40, which looks like
    the residual network shown in Figure 9.27 excepting that the addition operator
    $\oplus$ is replaced by an element-by-element multiplication operator $\otimes$.
    Attention can help the network pay more attention to the high-frequency features.
    The high-frequency components usually are edges, texture, and other details. The
    output of the assisting network is called the *attention map* (also known as the
    *attention mask*). The values in an attention map range from 0 to 1. A value close
    to 1 in the attention map indicates that


    ![](img/dd555effd38151c67af30d84800c554a_274_1.png)'
