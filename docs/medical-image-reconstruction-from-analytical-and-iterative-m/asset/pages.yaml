    Fig. 7.4: A spinning toy top precesses about a vertical axis due to the gravity.


    even number of protons and even number of neutrons because they do not have unpaired
    protons or neutrons. Paired protons or neutrons have zero magnetic moment.


    # 7.2 The "R"


    We have a vector \(\bar{\mathbf{M}}\), called net magnetic moment, which is spinning
    by itself. Normally, the vector \(\bar{\mathbf{M}}\) points at the same direction
    of the external magnetic field \(\bar{B}_0\). If we somehow knock the vector \(\bar{\mathbf{M}}\)
    off balance, and \(\bar{\mathbf{M}}\) is not in the direction of \(\bar{B}_0\)
    anymore, then the vector \(\bar{\mathbf{M}}\) will precess about the direction
    of \(\bar{B}_0\) just as the toy top precesses about the direction of gravity
    (see Figure 7.5). The precession frequency is called the Larmor frequency and
    is given as


    \(\omega_0 = \gamma B_0, \quad (7.2)\)


    where \(B_0\) is the external magnetic field strength, and \(\gamma\) is the gyromagnetic
    ratio. For a proton, \(\gamma = 42.58\) MHz/T. If the MRI machine has a magnetic
    field of 1.5 T, then the Larmor frequency is approximately 64 MHz, which is close
    to the frequency range of an FM radio.


    The MRI signal is nothing but this 64 MHz radio frequency (RF) electromagnetic
    wave sent out from the patient''s body after the net magnetic moment \(\bar{\mathbf{M}}\)
    is somehow knocked off balance. Thus, the MRI signal is also called the RF signal.
    The strength of the signal is proportional to the proton density inside the patient.


    To knock the net magnetic moment \(\bar{\mathbf{M}}\) off balance is not an easy
    task. In order to move the vector \(\bar{\mathbf{M}}\), we need to create a virtual
    situation so that the vector \(\bar{\mathbf{M}}\) does not feel the existence
    of the external \(\bar{B}_0\) field.


    We will first put the vector \(\bar{\mathbf{M}}\) on a virtual rotating merry-go-round
    or a rotating platform (see Figure 7.6), which is rotating at the Larmor frequency.
    We will later'
