- pgno: 6
  md: '# Preface


    This tutorial text introduces the classical and modern image reconstruction technologies
    to the general audience. It covers the topics in two-dimensional parallel-beam
    and fan-beam imaging, and three-dimensional parallel ray, parallel plane, and
    cone-beam imaging. Both analytical and iterative methods are presented. The applications
    in X-ray CT (computed tomography), single-photon emission computed tomography,
    positron emission tomography, and magnetic resonance imaging are also discussed.
    Contemporary research results in exact region-of-interest reconstruction with
    truncated projections, Katsevich’s cone-beam filtered backprojection (FBP) algorithm,
    and reconstruction with highly undersampled data are also included in this book.


    Chapter 8 of the book is devoted to the techniques of using a fast analytical
    FBP algorithm to emulate an iterative reconstruction with an edge-preserving denoising
    constraint. These techniques are the author’s most recent research results, and
    the author also produced CT images of some patients leading to the third place
    winner of the 2016 Low-Dose CT Grand Challenge.


    This book is written in an easy-to-read style. The readers who intend to get into
    medical image reconstruction will gain the general knowledge of the field in a
    painless way. I hope you enjoy reading it as much as I enjoy writing (and drawing)
    it.


    Larry Zeng, Ph.D. (larry.zeng@uvu.edu, larry.zeng@hsc.utah.edu)

    Professor of Computer science, Utah Valley University, Orem, Utah, USA

    Adjunct Professor of Radiology and Imaging science, University of Utah, Salt Lake
    City, Utah, USA


    August 8, 2016, in Salt Lake City'
