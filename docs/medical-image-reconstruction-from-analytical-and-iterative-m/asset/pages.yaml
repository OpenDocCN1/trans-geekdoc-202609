- pgno: 151
  md: '# 6.2 Algebraic reconstruction technique


    The main idea of the algebraic reconstruction technique (ART) algorithm (which
    is also known as the Kaczmarz method) is to make the estimated image satisfy one
    equation at a time as illustrated in Figure 6.3, where three lines (L1, L2, and
    L3) represent three equations, and their intersection is the solution. In this
    example, the image only consists of two pixels.


    In Figure 6.3, $\bar{x}^0$ is the initial guess of the solution. The first step
    is to project this point $\bar{x}^0$ perpendicularly onto $L_1$, obtaining $\bar{x}^1$.
    Next, project $\bar{x}^1$ perpendicularly onto $L_2$ to obtain $\bar{x}^2$, and
    so on, projecting each point onto a line (which is one equation) one at a time.
    Eventually, the algorithm will converge to the solution of the system of equations
    (see Figure 6.3, top). If the equations are not consistent, the algorithm will
    bounce around and never converge (see Figure 6.3, bottom). One iteration is defined
    as the procedure of going through all the equations once.


    ![](img/dd555effd38151c67af30d84800c554a_151_0.png)


    Fig. 6.3: The ART algorithm tries to satisfy each equation at each update.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'The ART algorithm executed one projection ray at a time, and the image is updated
    after each ray is considered. Symbolically, the algorithm can be written as


    ```

    \(\vec{x}^{\text{next}} = \vec{x}^{\text{current}} - \text{Backproject}_{\text{ray}}
    \left\{ \frac{\text{Project}_{\text{ray}} \left( \vec{x}^{\text{current}} \right)
    - \text{Measurement}_{\text{ray}}}{\text{Normalization factor}} \right\}.\) (6.24)

    ```


    # 6.3 Gradient descent algorithms


    First, an objective function \(\chi^2\) is formed based on the system of imaging
    equations:


    ```

    \(x^2 = ||AX - P||^2,\) (6.25)

    ```


    which is a quadratic function (see Figure 6.4). Due to the noise, the equations
    are inconsistent. Thus, the minimum value of the objective function \(\chi^2\)
    usually has a non-zero, positive value.


    # 6.3.1 The gradient descent algorithm


    The strategy of gradient descent algorithms is to evaluate the gradient of the
    objective function \(\chi^2\) and use the gradient information to find the minimum
    of the objective function. The gradient in 1D is the derivative of the function.
    A positive gradient means an upward direction, and a negative gradient means a
    downward direction. The gradient descent algorithms take the opposite direction
    of the direction that is indicated by the gradient and use a small enough step
    size so that the algorithms can find the minimum (see Figure 6.5). The general
    form of a gradient descent algorithm looks like


    ```

    \(\vec{x}^{\text{next}} = \vec{x}^{\text{current}} - a_{\text{current}} \vec{\Delta}
    \left( \vec{x}^{\text{current}} \right),\) (6.26)

    ```


    ![](img/dd555effd38151c67af30d84800c554a_152_0.png)


    Fig. 6.4: A quadratic objective function.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/dd555effd38151c67af30d84800c554a_153_0.png)


    Fig. 6.5: The opposite direction of the gradient is the downhill direction.


    where \(\vec{\Delta}\) is the gradient of the objective function \(\chi^2\) at
    \(\vec{x}^{current}\) and contains both projection and backprojection at all rays.
    In fact,


    ```

    \(\vec{\Delta} = \nabla \|AX - P\|^2 = 2A^T(AX - P)\), (6.27)

    ```


    where \(\nabla\) is the notation for the gradient operator, the projection \(AX\)
    is the multiplication of \(X\) by matrix \(A\), and the backprojection is multiplication
    by matrix \(A^T\). The data discrepancy is \((AX - P)\). The algorithm converges
    when \(AX = P\) and \(X\) does not change any more. If the system is inconsistent,
    the algorithm converges when \(A^T(AX - P) = \vec{0}\). In our notation, \(X\)
    and \(\vec{x}\) are the same thing.


    In the gradient descent algorithm, the step size \(\alpha_{current}\) is calculated
    at each descent direction so that the quadratic objective function reaches its
    minimum along the chosen path. Most likely this minimum is not the global minimum
    of the objective function. At this point, the algorithm finds the current negative
    gradient direction and travels downhill to reach the next minimum along the new
    path. This procedure repeats over and over again until the algorithm terminates.


    If the system is underdetermined, this least-squares problem does not have a unique
    solution, and the objective function \(\chi^2\) has a long valley (see Figure
    6.6). The solution will depend upon the initial solution. If the initial solution
    is zero (i.e., \(\vec{x}^0 = \vec{0}\)), then the algorithm will converge to a
    minimum norm solution.


    Due to noise, we seldom ever have \(AX = P\) at convergence. Instead, we get a
    very noisy image when the iteration number is large. We apply an iterative reconstruction
    algorithm to noisy data generated with the phantom in Figure 2.10. As shown in
    Figure 6.7,'
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/dd555effd38151c67af30d84800c554a_154_0.png)


    Fig. 6.6: For a degenerated system, the iterative algorithm solution depends on
    the initial value.


    at the early iterations, the images only contain low-frequency components; at
    higher iterations, high-frequency components are recovered and noise comes into
    effect, too.


    # 6.3.2 The Landweber algorithm


    The Landweber algorithm is a simplified gradient descent algorithm, in which the
    step size is a fixed value determined by the user. Unlike the gradient decent
    algorithm, the Landweber algorithm does not necessarily reach the minimum in the
    decent direction at each iteration. However, the algorithm can converge if the
    step size is chosen small enough. How small is small enough? The step size \(\alpha\)
    should satisfy


    ```

    \(0 < \alpha < \frac{2}{\sigma_1^2},\) (6.28)

    ```


    where \(\sigma_1\) is the largest singular value of matrix \(A\). Sometimes, it
    is advantageous to make the step size \(\alpha\) variable, as a function of, for
    example, iteration number, noise weighting, and/or regions of interest.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 6.3.3 The conjugate gradient algorithm


    The gradient direction is easy to compute in a practical imaging problem using
    \(\tilde{\Delta} = \nabla \|AX - P\|^2 = 2A^T(AX - P)\), but the negative gradient
    direction may not be the optimal direction to use in finding the optimum image.
    Let us look at the contour lines of a typical objective function \(\chi^2\) in
    Figure 6.8, where the contour lines are ellipses. The gradient direction at any
    point is perpendicular to the tangent of the ellipse. The searching directions
    of two consecutive steps, \(\underline{u}^{current}\) and \(\underline{u}^{next}\),
    are orthogonal to each other (i.e., \(\underline{u}^{current} \cdot \underline{u}^{next}
    = 0\)). The searching path is zigzagging and not optimal.


    ![](img/dd555effd38151c67af30d84800c554a_155_0.png)


    Fig. 6.7: The image gets noisier as the iteration number gets larger.


    A better searching direction is to use the concept of _conjugate directions_.
    The conjugate directions are defined by \(\underline{u}^{current} (A^T A) \underline{u}^{next}
    = 0\) (see Figure 6.9). The shape of the objective function \(\chi^2\) is characterized
    by \((A^T A)\). When we use the conjugate directions, we actually first deform
    the contour lines into circles and then find the orthogonal directions. The conjugate
    directions make the algorithm converge faster.'
