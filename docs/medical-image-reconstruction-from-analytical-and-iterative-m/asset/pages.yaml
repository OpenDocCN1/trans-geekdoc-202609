    The x-gradient coils are depicted in Figure 7.12. We assume that the x-direction
    is the direction from the patient''s right ear to left ear. The x-gradient is
    turned on only when the RF signal is received, and this gradient is also called
    the readout gradient. Do not turn it on during slice selection. When you turn
    two gradients on at the same time, they will combine and form a gradient in the
    third direction.


    # 7.3.3 To obtain y-information: phase encoding


    After slice selection and before RF signal readout, we turn on the y-gradient
    for a short time. Before a gradient is turned on, <o>**M**</o> at all locations
    precess at the same frequency (i.e., same speed). However, when the y-gradient
    is turned on, the field strength at a different y-position is different. As a
    result, <o>**M**</o> at a different y-position precesses at a different Larmor
    frequency (e.g., precession at a faster rate for a position with a larger y value,
    Figure 7.13). After the y-gradient is on for a short while, it is turned off.
    At this moment, <o>**M**</o> at a different y-position will arrive at a different
    phase (i.e., angle). This phase carries the information of the y-position.


    The y-gradient coils look exactly like the x-gradient coils, except for a 90°
    rotation. The effective gradient is confined to the gap between two pairs of the
    coils (see Figure 7.14).


