    \ in creating \\( b_y(x, y) \\).\n+   \n+   (ii) Perform partial derivatives and\
    \ obtain \\( b(x, y) = \\partial b_x(x, y)/\\partial x + \\partial b_y(x, y)/\\\
    partial y \\).\n+   \n+   (iii) Perform the line-by-line Hilbert transform, in\
    \ the direction parallel to the detector at the \\( 90^\\circ \\) position.\n\n\
    One distinctive feature of Method 6 is that no filtering is applied to the raw\
    \ projection data. This feature is important when the list-mode projection data\
    \ are acquired, for example, in nuclear medicine. In the list-mode data, every\
    \ event is stored independently and usually there is no easy way to find a neighboring\
    \ event with which to take a derivative. This algorithm can be easily applied\
    \ to other imaging geometries and to some situations where the projection data\
    \ are truncated (i.e., not fully measured).\n\nYou must have noticed that we are\
    \ playing the order changing game to create more and more reconstruction algorithms.\
    \ We simply change the order of ramp filtering and backprojection, or change of\
    \ the order of performing derivative, the Hilbert transform, and backprojection.\
    \ If we keep playing this game, we can make a list of some possible image reconstruction\
    \ algorithms (see Figure 2.9). Each algorithm has its advantages and disadvantages.\n\
    \nThe table in Figure 2.9 does not exhaust all possibilities. For example, the\
    \ Hilbert transform can be implemented as convolution in the spatial domain or\
    \ as multiplication in the Fourier domain. The Hilbert transform has another form,\
    \ which is not convolution but is an integral over a finite interval. The finite\
    \ Hilbert transform has an important application in handling truncated projection\
    \ data.\n\nYou may see that the backprojection is used in all algorithms. This\
