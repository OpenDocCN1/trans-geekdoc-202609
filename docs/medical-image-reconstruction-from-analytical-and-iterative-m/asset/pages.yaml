- pgno: 80
  md: '# Example 3: Derive an FBP algorithm for the flat-detector fan-beam geometry.


    # Solution


    We begin with the parallel-beam FBP algorithm, using polar coordinates ($r, \varphi$)
    instead of Cartesian coordinates $(x, y)$. Then $x = r \cos \varphi, y = r \sin
    \varphi$, and $x \cos \theta + y \sin \theta = r \cos (\theta - \varphi)$. We
    have


    $f(r, \varphi) = \frac{1}{2} \int_0^{2\pi} \int_{-\infty}^\infty p(s, \theta)
    h(r \cos (\theta - \varphi) - s) ds d\theta. \quad (3.31)$


    For the flat-detector fan-beam projection $g(t, \beta) = p(s, \theta)$, the fan-beam
    and parallel-beam variables are related by $\theta = \beta + \tan^{-1} (t/D)$
    and $s = D(t / \sqrt{D^2 + t^2})$. Changing the parallel-beam variables to the
    fan-beam variables with the Jacobian $D^3 / (D^2 + t^2)^{3/2}$ yields


    $f(r, \varphi) = \frac{1}{2} \int_0^{2\pi} \int_{-\infty}^\infty g(t, \beta) h\left((\hat{t}
    - t) \frac{UD}{\sqrt{D^2 + t^2}}\right) \frac{D^3}{(D^2 + t^2)^{3/2}} dt d\beta,
    \quad (3.32)$


    where we have used $r \cos(\theta - \varphi) - s = (\hat{t} - t)(UD / \sqrt{D^2
    + t^2})$ with


    $U = \frac{D + r \sin(\beta - \varphi)}{D} \quad (3.33)$


    and


    $\hat{t} = \frac{Dr \cos(\beta - \varphi)}{D + r \sin(\beta - \varphi)} \quad
    (3.34)$


    (see Figure 3.17).


    ![](img/dd555effd38151c67af30d84800c554a_80_0.png)


    Fig. 3.17: Notation for flat detector fan-beam imaging geometry.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'This is a fan-beam reconstruction algorithm, but the inner integral over $t$
    is not yet in the convolution form. Using a special property of the ramp filter
    $h(at) = (1 / a^2) \ h(t)$ yields


    ```

    \( f(r, \varphi) = \frac{1}{2} \frac{1}{U^2} \int_0^{2\pi} \int_{-\infty}^{\infty}
    \frac{D}{\sqrt{D^2+t^2}} g(t, \beta) h(\hat{t}-t) dtd\beta. \)

    ```


    This is a fan-beam convolution backprojection algorithm, where \( D / \sqrt{D^2+t^2}
    \) is the cosine pre-weighting factor, the integral over \( t \) is the ramp-filter
    convolution, and \( 1/U^2 \) is the distance-dependent weighting factor in the
    backprojection.


    Note: The relationship \( h(at) = (1/a^2) \ h(t) \) does not hold for a *windowed*
    ramp filter. Therefore, the fan-beam algorithm derived above does not have uniform
    resolution in the reconstructed image in practice when a window function is applied
    to the ramp filter.


    # 3.6 Summary


    +   - The fan-beam geometry is popular in X-ray CT imaging.


    +   - The fan-beam image reconstruction algorithms can be derived from their parallel-beam
    counterparts via changing of variables.


    +   - There are two types of fan-beam detectors: the flat detectors and curved
    detectors. Each detector type has its own image reconstruction algorithms.


    +   - If the fan-beam focal-point trajectory is a full circle, it is called full
    scan. If the trajectory is a partial circle, it is called short scan. Even for
    a short scan, some of the fan-beam rays are measured twice. The redundant measurements
    need proper weighting during image reconstruction.


    +   - For some fan-beam image reconstruction algorithms, the backprojector contains
    a distance-dependent weighting factor. When a window function is applied to the
    ramp filter, this factor is not properly treated by the window function and the
    resultant fan-beam FBP is no longer exact in the sense that the reconstructed
    image has nonuniform resolution and intensity. The short-scan fan-beam FBP algorithm
    can result in noticeable errors if the focal length is very short.


    +   - The modern derivative and Hilbert transform-based algorithms are able to
    weigh the short-scan redundant data in a correct way.


    +   - In this chapter, the readers are expected to understand how a fan-beam algorithm
    can be obtained from a parallel-beam algorithm.'
  merge: -1
  img_proc: true
