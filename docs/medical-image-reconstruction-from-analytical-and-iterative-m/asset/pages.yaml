  md: 'However, the idea above is not totally useless. Let us do it in a slightly
    different way. We start out with a parallel-beam image reconstruction algorithm,
    which is a mathematical expression. On the left-hand side of the expression is
    the reconstructed image f(x, y). On the right-hand side is an integral expression
    that contains the projection p(s, θ) and some other factors associated with s
    and θ (see Figure 3.5).


    Next, we replace the parallel-beam projection p(s, θ) by its equivalent fan-beam
    counterpart g(y, β) on the right-hand side. Of course, this substitution is possible
    only if the conditions θ = γ + β and s = D sin γ are satisfied. These two relations
    are easier to see in Figure 3.4, which is derived from Figure 3.1.


    In order to satisfy these two conditions, we stick them into the right-hand side
    of the expression. This procedure is nothing but changing the variables in the
    integral, where the variables s and θ are changed into γ and β.


    As a reminder, in calculus, when you change the variables in an integral, you
    need a Jacobian factor, which is a determinant calculated with some partial derivatives.
    This Jacobian is a function of γ and β.


    A parallel-beam algorithm


    f (x,y) = ∬ {p(s,θ) and other things with s and θ}dsdθ


    p(s,θ) = g(y,β)

    θ = γ + β and s = D sin γ

    Jacobian J(y,β)


    Substituting parallel-beam data with fan-beam data

    Changing variables


    f (x,y) = ∬ {g(y,β) and other things with γ and β} J(y,β)dydβ


    A fan-beam algorithm


    # Fig. 3.5: The procedure to change a parallel-beam algorithm into a fan-beam
    algorithm.


    After substituting the parallel-beam data p(s, θ) with fan-beam data g(y, β),
    changing variables s and θ to γ and β, and inserting a Jacobian J(y, β), a new
    fan-beam image reconstruction algorithm is born (see Figure 3.5)!'
