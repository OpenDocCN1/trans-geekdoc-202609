    # Proof.


    ```

    $$\begin{aligned}

    \sum_i \sum_j a_{ij} x_j &= \sum_i \sum_j a_{ij} \left( \frac{x_j^{\text{old}}}{\sum_n
    a_{nj}} \sum_n a_{nj} \frac{p_n}{\sum_k a_{nk} x_k^{\text{old}}} \right) \\

