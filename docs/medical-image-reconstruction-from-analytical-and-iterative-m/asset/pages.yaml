    Problem 9.1 Consider one layer of a dense layer, whose input is an image consisting
    of 512^2 pixels and the output is an image of the same size. Calculate the total
    number of parameters in this dense layer. Then consider only layer of a CNN with
    one channel and the convolution kernel is 3 × 3. Calculate the total number of
    parameters in this convolutional layer.


    Problem 9.2 Consider a U-net. Calculate the total number of pixels in all channels
    at each layer.


    Problem 9.3 For the small dense network shown in Figure 9.34, find the gradient
    ∂J/∂b1.


    Problem 9.4 Write an objective function for iterative Bayesian image reconstruction
    for the following situation. The image may have some artifacts, which can be effectively
    detected by a neural network model m. When an image x is fed to m, the model produces
    a positive value symbolically denoted as m x. A large value m x indicates severe
    artifacts in the image x. No artifacts are found if m x is zero.'
