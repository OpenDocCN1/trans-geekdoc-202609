    # 4.4 Attenuation correction for emission tomography


    In emission tomography, the gamma ray photons are emitted from within the patient''s
    body. Not all the photons are able to escape from the patient body; thus, they
    are attenuated when they propagate. The attenuation follows Beer''s law, which
    we have seen in Section 4.1.


    # 4.4.1 PET


    In PET, two detectors are required to measure one event with coincidence detection.
    An event is valid if two detectors simultaneously detect a 511 keV photon. Let
    us consider the situation depicted in Figure 4.16, where the photons are emitted
    at an arbitrary location in a nonuniform medium. The photons that reach detector
    1 are attenuated by path L1 with an attenuation factor determined by Beer''s law.
    We symbolically represent this attenuation factor as exp ( -∫L1 μ ). Similarly,
    the attenuation factor for path L2 is exp ( -∫L2 μ ). The attenuation factor is
    a number between 0 and 1 and can be treated as a probability. The probability
    that a pair of photons will be detected by both detectors is the product of the
    probabilities that each photon is detected; that is,


    exp ( - ∫L1 μ ) × exp ( - ∫L2 μ ) = exp ( - ∫L1+L2 μ ) = exp ( - ∫L μ ).   (4.9)


    Therefore, the overall attenuation factor is determined by the entire path L,
    regardless of where the location of the gamma source is along this path.


    To do an attenuation correction for PET data, a transmission measurement is required
    with an external transmission (either X-ray or gamma ray) source. This transmission
    measurement gives the attenuation factor exp ( -∫L μ ).


    The attenuation-corrected line integral or ray sum of PET data is obtained as


    p(s, θ) = exp ( ∫L(s,θ) μ ) × [emission measurement of the path L(s, θ)],   (4.10)


    where the reciprocal of the attenuation factor is used to compensate for the attenuation
    effect. Note that there is no need to reconstruct the attenuation map for PET
    data attenuation correction.'
