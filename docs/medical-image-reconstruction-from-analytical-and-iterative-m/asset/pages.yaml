    transform.


    # 3.2 Parallel-beam to fan-beam algorithm conversion


    If you want to reconstruct the image by a filter-then-backproject (i.e., filtered
    backprojection [FBP]) algorithm, a different strategy must be used.


    A straightforward approach would be to rebin every fan-beam ray into a parallel-beam
    ray. For each fan-beam ray sum \(g(\gamma, \beta)\), we can find a parallel-beam
    ray sum \(p(s, \theta)\) that has the same orientation as the fan-beam ray with
    the relations (see Figure 3.4)


    ```

    \(\theta = \gamma + \beta\) (3.4)

    ```


    and


    ```

    \(s = D \sin \gamma,\) (3.5)

    ```


    where \(D\) is the focal length. We then assign


    ```

    \(p(s, \theta) = g(\gamma, \beta).\) (3.6)

    ```


    After rebinning the fan-beam data into the parallel-beam format, we then use a
    parallel-beam image reconstruction algorithm to reconstruct the image. However,
    this rebinning approach is not preferred because rebinning requires data interpolation
    when changing coordinates. Data interpolation introduces errors. The idea of rebinning
    is feasible, but the results may not be accurate enough.


    ![](img/dd555effd38151c67af30d84800c554a_68_0.png)


    **Fig. 3.4:** A fan-beam ray can be represented using the parallel-beam geometry
    parameters.'
