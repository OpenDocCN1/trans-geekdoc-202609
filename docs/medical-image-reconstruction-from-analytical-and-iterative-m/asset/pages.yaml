    # 7.5 Image reconstruction for MRI


    # 7.5.1 Fourier reconstruction


    If the k-space is sufficiently sampled in Cartesian grids, F(kx, ky) is known
    in a square region in the Fourier domain. The image f(x, y) can be readily obtained
    using a 2D inverse fast Fourier transform (2D IFFT).


    In fact, the result of this 2D IFFT is not really the original image (but really
    close). The result is the true image convolved with a point spread function (PSF)
    h. At each dimension, h is the ratio of a sine function over another sine function,
    and h is periodic. The PSF h is characterized by the number of samples and the
    sampling interval in the k-space. Each period of h looks similar to a sinc function
    that has a main lobe and ringing side lobes. The k-space sampling interval determines
    the period of h. If the period is smaller than the object size, we will see aliasing
    artifacts in the reconstruction, as shown in Figure 7.20, where the nose appears
    at the back of the head. Some Gibbs ringing artifacts sometimes can be seen around
    the sharp edges.


    For many applications, the MRI data are acquired using non-Cartesian trajectories
    such as radial and spiral. Regridding is a common technique to convert a non-Cartesian
    data set into a Cartesian data set. Then the 2D IFFT method is used to reconstruct
    the image. Regridding is essentially data interpolation, which moves the sampled
    data value to its close grid neighbors with proper weighting. The proper weighting
    considers the local sampling density. Nonuniform FFT is basically a regridding
    method; it is fast and can be used for MRI reconstruction.'
