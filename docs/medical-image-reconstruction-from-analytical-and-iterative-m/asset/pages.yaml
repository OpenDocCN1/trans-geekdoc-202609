- pgno: 277
  md: 'The toy example of a dense neural network shown in Figure 9.42 tries to classify
    three handwritten digits: “4,” “5,” and “6.” Each digit is subdivided into four
    subcategories according to different handwriting styles. The output of each neuron
    in the first layer is a scalar, calculated by ReLU(⟨Wi · X − bi⟩), where Wi is
    the pattern for the subcategory and bi is a threshold value. If the input X is
    a handwritten “4,” some of the pink neurons are activated with positive values.


    Each layer is fully connected. An image X or its corresponding pattern image Wi
    can be represented in the vector format (in any order without any effect on training)
    so that the inner product ⟨Wi · X⟩ makes sense.


    The second layer is, in fact, a dense layer. The links with zero weights are not
    shown in Figure 9.42. Each neuron in the second layer essentially sums up the
    output from all its corresponding subcategories from the first layer. This gives
    the one-hot result in the second layer. Here by one-hot, we imply that the neuron
    with the maximum output value is referred to as hot with a binary value 1 and
    other neurons are assigned a binary value 0. Optionally, a “softmax” activation
    function is used in the second layer. The softmax function normalizes the neuron
    output values into a probability-like distribution.


    The actual MNIST handwritten digit dataset has 60,000 training image/label pairs.
    It contains handwritten digits from “0” to “9.” If a fully connected neural network
    (similar to that shown in Figure 9.42) is used for the classification task, the
    first hidden layer may contain as many as 2,000 neurons and the second contains
    10 neurons.


    For the end-to-end image reconstruction, the input is a raw measurement-domain
    sinogram, and the output is a tomographic image. The image reconstruction is a
    regression (instead of classification) task. The image can be implemented as using
    a dense layer to perform the backprojection and then using a series of convolutional
    layers to perform image processing, which includes the ramp filtering. This dense
    layer can be considered as a “hardwired” backprojection on the pixel-by-pixel
    base. A backprojector for one image pixel can be ready represented as an inner
    product between the input sinogram and a sinewave pattern. There is no need for
    a threshold or for a nonlinear activation function for this dense backprojection
    layer. In fact, this dense layer is not dense at all. Almost all the weights are
    zeros except for the sinewave pattern.


    For an MRI end-to-end image reconstruction task with a general k-space sampling
    scheme, the same neural network architecture as above can be used. The dense layer
    performs the k-space re-gridding and the 2D inverse Fourier transform. An inner
    product expression can be readily obtained for the re-gridding and inverse Fourier
    transform. Notice that the k-space measurements are complex with real parts and
    imaginary parts. Our neural network commonly performs real number calculations.
    We can simply store a complex number as two real numbers, one for the real part
    and the other for the imaginary part, in any order, taking the advantage of the
    fully connections.'
