    \( g(\gamma, \beta) = g(-\gamma, \beta + 2\gamma + \pi). \quad (3.8) \)


    Due to data redundancy, we can use a smaller angular (\(\beta\)) range than \(2\pi\)
    for fan-beam data acquisition, hence, the term *short scan*. The minimal range
    of \(\beta\) is determined by how the data are acquired. This required range can
    be less than \(\pi\) (see Figure 3.9, left), equal to \(\pi\) (see Figure 3.9,
    middle), or larger than \(\pi\) (see Figure 3.9, right). The criterion is that
    we need at least 180° angular coverage for each point in the object in which we
    are interested.


    We need to be cautious that in a fan-beam short scan, some rays are measured once,
    and other rays are measured twice. Even for the case that the angular range of
    \(\beta\) is less than \(\pi\), there are still rays that are measured twice.
    In fact, any ray that intersects the measured focal-point trajectory twice is
    measured twice (see Figure 3.10). We require that any ray which passes through
    the object should be measured at least once. Proper weighting should be used in
    image reconstruction if data are redundant.'
