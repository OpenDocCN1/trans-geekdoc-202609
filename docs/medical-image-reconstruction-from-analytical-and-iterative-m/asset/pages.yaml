    than a fully connected network. In a CNN, a small convolutional kernel is applied
    to the entire image by assuming the shift-invariant property of the image. The
    small convolutional kernel is the pattern feature template that was discussed
    above. The convolution output is a feature map. For example, a high-pass convolutional
    kernel will produce a feature map that emphasizes the edges and high-frequency
    noise.'
