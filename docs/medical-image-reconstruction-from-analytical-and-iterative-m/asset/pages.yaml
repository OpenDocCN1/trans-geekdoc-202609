  md: 'First, we draw a line, say, the x-axis, passing through the small region \(\Omega_{known}\),
    as shown in Figure 2.15. Without loss of generality, we only consider the image
    values on one line: \(y=0\). We can do the same for other lines that pass through
    the known region \(\Omega_{known}\).


    It is given that the image \(f(x, 0)\) is known when \(-r \le x \le r\). In the
    following, we are going to define a function \(h(x)\), convert it into a complex
    function \(h(z)\), and apply analytic continuation to \(h(z)\) so that the image
    \(f(x, 0)\) can be estimated in a larger interval (-1, 1). In this particular
    imaging problem, the detector is smaller than the object. Projection data are
    only available for \(-1 \le s \le 1\). We can use the FBP algorithm to reconstruct
    the image as


    \(f(x, 0) = \frac{1}{4\pi} \int_0^{2\pi} d\theta \int_{-\infty}^{\infty} \frac{1}{s
    - x \cos \theta} \frac{\partial p(s, \theta)}{\partial s} ds.\) (2.4)


    This expression can be written in two terms: the first term with measured data
    and the second term with unmeasured data:


    \(f(x, 0) = \frac{1}{4\pi} \int_0^{2\pi} d\theta \int_{-1}^1 \frac{1}{s - x \cos
    \theta} \frac{\partial p(s, \theta)}{\partial s} ds + \frac{1}{4\pi} \int_0^{2\pi}
    d\theta \int_{|s|>1} \frac{1}{s - x \cos \theta} \frac{\partial p(s, \theta)}{\partial
    s} ds.\) (2.5)


    The first term can be evaluated using the measured data on [-1, 1] and it contains
    the sharp edges of the image \(f\). However, the second term is very smooth (almost
    a constant) but cannot be evaluated because the data are not available. Let us
    denote the second term as \(h(x)\). We have


    \(h(x) = \frac{1}{4\pi} \int_0^{2\pi} d\theta \int_{|s|>1} \frac{1}{s - x \cos
    \theta} \frac{\partial p(s, \theta)}{\partial s} ds, \quad |x| < 1.\) (2.6)


    In the above expression, \(|x|<1\) and \(|s|>1\) make \(1/(s - x \cos \theta)\)
    differentiable of any order. We further assume that \(\partial p/\partial s\)
    is continuous, which is usually satisfied in practice. We claim that if we replace
    the real variable \(x\) by a complex variable \(z\), then \(h(z)\) is an analytic
    function within \(|z| < 1\).


    The analytic function \(h(z)\) is known as \([-r, r]\), because \(h(x)\) can also
    be expressed as


    \(h(x) = f(x, 0) - \frac{1}{4\pi} \int_0^{2\pi} d\theta \int_{-1}^1 \frac{1}{s
    - x \cos \theta} \frac{\partial p(s, \theta)}{\partial s} ds,\) (2.7)


    where \(f(x, 0)\) is given as \([-r, r]\), and the second term in the above expression
    can be evaluated with the measured data. By using analytic continuation, \(h(z)\)
    is uniquely determined in \(|z| < 1\). Thus, \(h(x)\) is determined in (-1, 1).
    Once \(h(x)\) is found, the image value in (-1, 1) can be obtained as'
