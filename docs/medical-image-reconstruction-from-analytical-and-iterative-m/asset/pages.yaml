    # 8.10 Other applications of the Landweber-FBP algorithm


    # 8.10.1 The Landweber-FBP version of the iterative FBP algorithm


    In a regular iterative image reconstruction algorithm, the projection-domain data
    is directly backprojected into the image domain. Before backprojection, a noise-weighing
    function, w, is assigned to projection-domain data, which is the projection-domain
    discrepancy in an iterative Landweber algorithm.


    In an iterative FBP algorithm, the projection-domain data is filtered with prespecified
    filter. This filter can be chosen as the ramp filter, a Laplacian filter, or a
    lowpass filter. In a Bayesian algorithm, the Bayesian terms in the objective function
    can also contain filters. As an example, an objective function can be expressed
    as follows:


    ```

    \(\chi^2 = (AX - P)^T M (AX - P) + \beta(FX)^T \hat{M} (FX),\quad (8.59)\)

    ```


    where _M_ and \(\hat{M}\) are two Toeplitz square matrices. We must point out
    that if the matrix _M_ is a diagonal matrix, it acts as noise weighting instead
    of a filter. Noise weighting only scales a value up or down. On the other hand,
    a filter uses neighboring values as well.


    A linear convolution can always be expressed as a Toeplitz matrix multiplication.
    A Landweber algorithm can be used to minimize this objective function. Using the
    similar method in Section 8.5, a Landweber Bayesian algorithm can be obtained
