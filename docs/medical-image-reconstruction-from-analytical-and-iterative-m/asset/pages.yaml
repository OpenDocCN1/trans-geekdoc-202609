  md: 'Generally speaking, filtering can be any kind of processing on the data. In
    Katsevich’s formula, when we say “filtering” we specifically mean the Hilbert
    transform. Vectors \(\vec{a}\) and \(\vec{\beta}\) are orthogonal to each other.
    Katsevich’s formula is given as follows:


    \(f(\bar{x})=\frac{-1}{2\pi^2}\int_{I_P(\bar{x})}\frac{1}{\|\bar{x}-\bar{a}(s)\|}\left|\int_{-\pi/2}^{\pi/2}\frac{\partial
    g\left(\bar{\theta}(y),\bar{\alpha}(q)\right)}{\partial q}dq\right|_{q=s}\frac{1}{\sin
    \gamma}dyds,\) (5.55)


    where the integral over \(\gamma\) is the Hilbert transform and the integral over
    \(s\) is the cone-beam backprojection. Katsevich derived this nice and clean formula
    because he thought of a trick to assign the weights for redundant plane integrals
    by selecting a special filtering direction \(\vec{\beta}\). It can be shown that
    his assignment of \(\vec{\beta}\) makes the weight +1 for a plane that is measured
    one time and makes the weight +1 or -1 for a plane that is measured three times
    (two of them get +1 and one of them gets -1). The solution of \(\vec{\beta}\)
    is not unique. Different selections of the filtering direction give different
    algorithms.


    Here is one way to find a special filtering direction \(\vec{\beta}\). Let us
    define a \(\kappa\)-plane as follows. The focal-point location is \(\vec{a}(s)\).
    A point in the field of view \(\bar{x}\) is to be reconstructed. We then find
    an angle \(\psi\) in \((-\pi, \pi)\) such that the four points \(\bar{x}\), \(\vec{a}(s)\),
    \(\vec{a}(s+\psi)\), and \(\vec{a}(s+2\psi)\) are in one plane (see Figure 5.30).
    This plane exists but is not unique. The angle \(\psi\) with the smallest magnitude
    \(|\psi|\) that can construct this plane will be chosen, and the corresponding
    plane that contains these four points is referred to as a \(\kappa\)-plane \(\kappa(s,
    \psi)\).


    ![](img/dd555effd38151c67af30d84800c554a_134_0.png)


    Fig. 5.31: The \(\kappa\)-lines on the flat cone-beam detector. Each line corresponds
    to a fixed angle \(\psi\). Each reconstruction point associates with one and only
    one \(\kappa\)-line.'
