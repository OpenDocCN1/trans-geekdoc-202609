- pgno: 273
  md: '# 9.7 Training


    Model training is similar to iterative image reconstruction in the sense that
    it is an optimization procedure. The objective function (also known as the cost
    function or loss function) in model training is the distance between the model
    output and the label. In machine learning terminology, a label is a desired output.
    In denoising, a label is a noiseless image, and an input is a noisy image. In
    super-resolution, a label is a high-resolution image, and an input is a low-resolution
    image. In direct (end-to-end) image reconstruction, a label is a true image, and
    an input is a sinogram. A general training setup is shown in Figure 9.36. Training
    is to find the model parameters W by minimizing the objective function with a
    lot of input/label pairs. Training is an iterative procedure that goes through
    all input/label pairs multiple times. Each iteration is called an epoch in machine
    learning community. After training, the trained model is ready to accept any unseen
    input and to produce an output in a fast and one-pass way without any iterations.


    ![](img/dd555effd38151c67af30d84800c554a_273_0.png)


    Fig. 9.36: A general setup for parameter training.


    In machine learning, the training algorithms are mostly gradient descent-based.
    The gradient of the objective function with respect to the parameters is evaluated
    according to the chain rule, which is referred to as backpropagation in machine
    learning. As a toy example, let us consider a neural network shown in Figure 9.37
    and find the gradient \(\partial J / \partial w_1\), where \(J\) is the objective
    function


    ```

    J = \frac{1}{2} \sum_{i=1}^N (y_i - \hat{y}_i)^2, \quad (9.28)

    ```


    where \(\{x_i, \hat{y}_i\}\) is an input/label pair, there are \(N\) input/label
    pairs, and \(y_i\) is the model output. The gradient \(\partial J / \partial w_1\)
    is calculated using the chain rule as follows:


    ```

    \frac{\partial J}{\partial w_1} = \sum_{i=1}^N (y_i - \hat{y}_i) \frac{\partial
    y_i}{\partial \sigma} \left( \frac{\partial v_1}{\partial \sigma} x_i w_3 + \frac{\partial
    v_2}{\partial \sigma} (0) w_4 \right) \\ = \sum_{i=1}^N (y_i - \hat{y}_i) u(y_i)
    u(v_1) x_i w_3, \quad (9.29)

    ```


    where \(u(\cdot)\) is the unit step function defined in eq. (9.5). Once the gradient
    of the objective function with respect to each parameter is known, a gradient-based
    iterative algorithm is ready to be implemented for training the network.'
  merge: -1
  img_proc: true
