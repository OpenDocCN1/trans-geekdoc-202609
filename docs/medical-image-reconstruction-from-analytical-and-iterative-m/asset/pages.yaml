    # Example 7: Use a Bayesian method to find a stable solution of the system


    $$

    \begin{cases} x_1 + 0.01x_2 = 1.2 \\ x_1 + 0.001x_2 = 1. \end{cases}\tag{6.132}

    $$


    # Solution


    If we consider the potential measurement errors, the system of equations can be
    written as


    $$

    \begin{cases} x_1 + 0.01x_2 = 1.2 + \delta_1 \\ x_1 + 0.001x_2 = 1 + \delta_2.
    \end{cases}\tag{6.133}

    $$


    The solution of this modified system is given as


    $$

    \begin{cases} x_1 = 0.978 - 0.111\delta_1 + 1.11\delta_2 \\ x_2 = 22.22 + 111.1\delta_1
    - 111.1\delta_2. \end{cases}\tag{6.134}

    $$


    It is seen that \(x_2\) is sensitive to measurement noise. Let us assume a priori
    that “\(x_1\) and \(x_2\) are close” and solve this problem using the Bayesian
    method. Here, a prior is a probability distribution representing knowledge or
    belief about an unknown quantity a priori, that is, before any data have been
    observed. First, we set up an objective function and use the prior knowledge as
    a penalty term:


    $$

    F(x_1, x_2) = (x_1 + 0.01x_2 - 1.2 - \delta_1)^2 + (x_1 + 0.001x_2 - 1 - \delta_2)^2
    + \beta(x_1 + x_2)^2.\tag{6.135}

    $$


    Note that \(\beta\) in this expression is not a Lagrange multiplier, but a preassigned
    constant. To minimize \(F(x_1, x_2)\), we set \(\partial F/\partial x_1 = 0\)
    and \(\partial F/\partial x_2 = 0\). This results in a *different* problem:


    $$

    \begin{bmatrix} 2+\beta & 0.011-\beta \\ 0.011-\beta & 0.01^2 + 0.001^2 + \beta
    \end{bmatrix} \begin{bmatrix} x_1 \\ x_2 \end{bmatrix} = \begin{bmatrix} (1.2+\delta_1)
    + (1+\delta_2) \\ (0.01)(1.2+\delta_1) + (0.001)(1+\delta_2) \end{bmatrix}.\tag{6.136}

    $$


    The solution of this system depends on the value of \(\beta\), as well as the
    values of \(\delta_1\) and \(\delta_2\). Some MAP solutions are listed in the
    following two tables:'
