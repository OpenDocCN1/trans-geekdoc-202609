- pgno: 121
  md: '# 5.4 Mathematical expressions


    Some 3D image reconstruction algorithms are presented here without proofs. For
    the 3D parallel line-integral projections, we have a backprojection-then-filtering
    algorithm and FBP algorithms, which are not unique. For the parallel plane-integral
    projections (i.e., the Radon transform), we also have a backprojection-then-filtering
    algorithm and an FBP algorithm which is the Radon inversion formula.


    For cone-beam projections, Felkamp''s circular orbit algorithm and the Katsevich''s
    helical orbit algorithm are highlighted because they are in the form of convolution
    and cone-beam backprojection. Tuy''s relation and Grangeat''s relation are also
    discussed in this section.


    # 5.4.1 Backprojection-then-filtering for parallel line-integral data


    For this type of algorithm, the projections are backprojected to the image domain
    first, obtaining b(x, y, z). Then the 3D Fourier transform is applied on b(x,
    y, z), obtaining B(ωx, ωy, ωz). Next, a Fourier domain filter G(ωx, ωy, ωz) is
    used to multiply B(ωx, ωy, ωz), obtaining F(ωx, ωy, ωz) = B(ωx, ωy, ωz) G(ωx,
    ωy, ωz). Finally, the 3D inverse Fourier transform is applied to F(ωx, ωy, ωz)
    to obtain the reconstructed image f(x, y, z). Here, the filter transfer function
    G(ωx, ωy, ωz) is imaging geometry dependent. Some of the imaging geometries are
    shown in Figure 5.5, where the θ→ trajectories are displayed as shaded regions.
    Let Ω denote the occupied region by the θ→ trajectories on the unit sphere.


    When Ω = Ω4π is 4π, that is, Ω4π is the entire unit sphere, G is a ramp filter:


    ```

    G(ωx, ωy, ωz) = √(ωx² + ωy² + ωz²)/π. (5.8)

    ```


    If Ω is not the full sphere, this ramp filter will be modified by the geometry
    of Ω. Then the general form of G is


    ```

    G(ωx, ωy, ωz) = √(ωx² + ωy² + ωz²)/D(θ→), (5.9)

    ```


    where D(θ→) is half of the arc length of the intersection of a great circle with
    Ω. The normal direction of the great circle in the Fourier domain is θ→, where
    θ→ is the direction from the origin to the point (ωx, ωy, ωz).


    When Ω = Ωψ is the region shown in Figure 5.18, D(θ→) is the arc length γ, which
    is orientation θ→ dependent. Using the geometry, we have γ = π if θ ≤ ψ, and we
    have sin γ/2 = sin ψ / sin θ if θ > ψ.'
  merge: -1
  img_proc: true
