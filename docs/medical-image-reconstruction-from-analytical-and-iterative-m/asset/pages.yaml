    # **Example 2:** State the central slice theorem with a mathematical expression
    for the 3D line-integral projections and for the 3D plane-integral projections.


    # Solution


    # (i) *Three-dimensional plane-integral data*


    Let \(\vec{\theta} = (\sin \theta \cos \phi, \sin \theta, \cos \theta)\), then
    the central slice theorem for the 3D Radon transform (i.e., plane-integral projections)
    is


    \(P\left(\omega, \vec{\theta}\right) = F(\omega \sin \theta \cos \phi, \omega
    \sin \theta \sin \phi, \omega \cos \theta),\) \\

    (5.63)


    where \(P(\omega, \vec{\theta})\) is the 1D Fourier transform of the plane integrals
    \(p(s, \vec{\theta})\) with respect to s, and \(F(\omega_x, \omega_y, \omega_z)\)
    is the 3D Fourier transform of the object \(f(x, y, z)\).


    # (ii) *Three-dimensional line-integral data*


    For the 3D line-integral projections, we need a coordinate system on the detector
    plane which is perpendicular to \(\vec{\theta}\). Let


    \(\vec{\theta}_u = (-\sin \phi, \cos \phi, 0) \text{ and} \\

    \vec{\theta}_v = (-\cos \theta \cos \phi, -\cos \theta \sin \phi, \sin \theta),\)
    \\

    (5.64)


    then \(\vec{\theta}, \vec{\theta}_u\), and \(\vec{\theta}_v\) form an orthogonal
    system, \(\vec{\theta}_u\) is in the direction of the u-axis, and \(\vec{\theta}_v\)
    is in the direction of the v-axis. Thus, the central slice theorem can be stated
    as


    \(P\left(\omega_u, \omega_v, \vec{\theta}\right) = F(-\omega_u \sin \phi - \omega_v
    \cos \theta \cos \phi, \omega_u \cos \phi \\

    - \omega_v \cos \theta \sin \phi, \omega_v \sin \theta) \\

    = F\left(\omega_v \vec{\theta}_u + \omega_v \vec{\theta}_v\right),\) \\

    (5.65)


    where \(P(\omega_u, \omega_v, \vec{\theta})\) is the 2D Fourier transform of the
    line integrals \(p(u, v, \vec{\theta})\) with respect to u and v.


