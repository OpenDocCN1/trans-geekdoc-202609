    # ## 4.5 Mathematical expressions


    # ### 4.5.1 Expression for Tretiak–Metz FBP algorithm


    Now we give the mathematical expression of the FBP algorithm for SPECT with uniform
    attenuation correction. This algorithm has been outlined in Section 4.4.2 After
    the pre-scaling step, the scaled projection p(s, θ) can be related to the original
    image f(x, y) as


    \(\hat{p}(s, \theta) = \int_{-\infty}^{\infty} e^{\mu t} f(\vec{s}\theta + t\vec{\theta}^\perp)
    dt.\)


    You can refer to Section 1.5 for notation definitions. The following gives an
    FBP algorithm using the derivative and the notched Hilbert transform:


    \(f(x, y) = \frac{1}{4\pi^2} \int_{0}^{2\pi} e^{-\mu(-x\sin\theta + y\cos\theta)}
    \int_{-\infty}^{\infty} \frac{\cos(\mu(s - x\cos\theta - y\sin\theta))}{s - x\cos\theta
    - y\sin\theta} \frac{\partial \hat{p}(s, \theta)}{\partial s} ds d\theta.\)


    # ### 4.5.2 Derivation for Inouye''s algorithm


    Let f(x, y) be a density function in the x–y plane and fθ be the function f rotated
    by θ clockwise. After the pre-scaling step, the scaled projection p̂(s, θ) can
    be related to the original image f(x, y) as


    \(\hat{p}(s, \theta) = \int_{-\infty}^{\infty} e^{\mu t} f_\theta(s, t) dt.\)


    Taking the 1D Fourier transform with respect to s yields


    \(\hat{p}_{s \to \omega}(\omega, \theta) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty}
    e^{\mu t} f_\theta(s, t) e^{-2\pi i s \omega} dt ds\)

    \(= \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f_\theta(s, t) e^{-2\pi i
    (\omega s + t - \frac{\mu}{2\pi})} ds dt.\)'
