    # 8.7 Nonquadratic constraints


    Many people choose to use the iterative image reconstruction algorithms because
    they are so versatile. For example, they work well when the objective function
    have nonquadratic constraints as long as they are convex. Most edge-preserving
    constraints are nonquadratic, but are convex. The FBP algorithms are linear algorithms;
    they can only solve linear equations. If the objective function is quadratic,
    the gradient of the objective function is linear. By setting the gradients to
    zero we obtain a set of linear equations. To our knowledge, the FBP algorithms
    are unable to solve nonlinear equations.


    Of course, one can apply nonlinear filters as preprocessing or postprocessing
    procedures. For example, one can apply a nonlinear median filter to denoise the
    projections and apply a nonlinear edge-preserving filter to denoise the FBP reconstructed
    image.


    In many situations, the iterative reconstruction outperforms pre- and postfiltering.
    In this section, we propose a fast method to apply nonlinear filtering during
    reconstruction.'
