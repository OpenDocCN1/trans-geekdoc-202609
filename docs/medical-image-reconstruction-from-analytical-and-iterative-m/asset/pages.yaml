  md: 'A unique feature in an iterative algorithm is that the result depends on the
    initial image. The conventional FBP algorithm does not accept the initial image.
    We want to change that!


    Let us recall the beginning of Section 8.1, where the Landweber algorithm has
    two parts:


    ```

    $X^{(k)} = F^{(k)}P + H^{(k)}X^{(0)}$.

    (8.41)

    ```


    The first part $X^{(k)} = F^{(k)}P$ only depends on the projections $P$ and can
    be implemented as an FBP algorithm. The second part only depends on the initial
    image $X^{(0)}$, which has been assumed to be zero in the discussion in the first
    part of this chapter. From now on the initial image $X^{(0)}$ does not have to
    be a zero.


    According to eq. (8.4), $H^{(k)}$ is defined as


    ```

    $H^{(k)} = (I - \alpha A^T W A)^k$,

    (8.42)

    ```


    which can be implemented in the Fourier domain with a 2D transfer function in
    the polar coordinate system:


    ```

    $H(\omega) = \left( 1 - \frac{\alpha w}{|\omega|} \right)^k$ when $\omega \neq
    0$,

    (8.43)

    ```


    and we define $H(0) = 0$. As $|\omega| \to \infty$, $H(\omega) \to 1$. As $k$
    increases, the bandwidth of the high-pass filter gets narrower. A fast implementation
    of the second term in eq. (8.41) can be


    +   1. Take 2D fast Fourier transform (FFT) of $X^{(0)}$.

    +   2. Multiply the Fourier transformed image by $H(\omega)$.

    +   3. Take 2D inverse FFT.


    Thus eq. (8.41) can be implemented in two parts: a windowed FBP algorithm for
    the projections $P$ and a high-pass filter for the initial image $X^{(0)}$. Let
    us introduce our strategy with an example.


    Say, we have a task of image reconstruction. This task can be achieved by using
    2,000 iterations of the Landweber algorithm, which can also be done by using a
    windowed FBP algorithm with $k = 2,000$. We are now experts for that.


    Let us give algorithm (8.41) a name: _the 2-input FBP_, one in put being $P$ and
    the other input being the initial image $X^{(0)}$. For the first input $P$, we
    apply an FBP; for the second input $X^{(0)}$, we apply a high-pass filter. Instead
    of using the windowed FBP with $k = 2,000$, we can achieve the same goal by applying
    the 2-input FBP (with $k = 500$) four times. The result of one application of
    the 2-input FBP algorithm is the initial image of the next application.


    It is nice to notice that the first part of the algorithm “$F^{(500)}P$” only
    needs to be calculated once, even though the entire algorithm needs to be applied
    four times.'
