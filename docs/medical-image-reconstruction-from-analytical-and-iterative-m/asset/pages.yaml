    # 2.4 A computer simulation


    In Figure 2.10, we show an example of the FBP algorithm in action. The original
    image f(x, y) is shown in the lower right corner; it consists of a large disk
    and four small disks. The projection data p(s, θ) are generated analytically using
    computer software. The projections of the two outer small disks trace two sine
    curves in the sinogram, which is an s–θ coordinate display of the projection data.


    After applying the ramp filter to p(s, θ), the filtered data q(s, θ) looks sharper
    because the ramp filter, which is a high-pass filter, suppresses the low-frequency
    components and enhances the high-frequency components. One can see the darker
    edges around the projection of the disks. These darker edges are the negative
    “wings” that we discussed in Chapter 1.


    The image labeled (A) is the backprojection of q(s, θ) at the first angle. The
    filtered data q(s, θ) at the first angle are simply copied across the entire image.
    This action is sometimes described as even distribution of a value along the projection
    path. Progressing through images (A)–(G), as data from more and more angles are
    backprojected, the image takes shape and gets closer and closer to the original
    image. Remember that backprojection consists of two actions: smear back and superposition.
    The image is reconstructed when the backprojection is performed over 180°. The
    backprojection can also be performed over 360° (then divide the image value by
    2) because the data are redundant by observing the fact that p(s, θ) = p(−s, θ
    + π) and q(s, θ) = q(−s, θ + π).'
