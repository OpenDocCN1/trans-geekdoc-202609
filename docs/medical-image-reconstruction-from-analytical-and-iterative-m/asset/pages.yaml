    # 6.6.1 Analytical methods: windowing


    In an analytical algorithm, noise regulation is achieved via the application of
    a window function when the projection data are filtered. The filter in an image
    reconstruction algorithm is always a high-pass filter (e.g., the ramp filter)
    in which the high-frequency components are enhanced more than the low-frequency
    components. In order to suppress the high-frequency noise, a window function is
    always applied to the ramp filter (see Figure 6.11). Basically, the noise regulation
    strategy in an analytical algorithm is to control the bandwidth. Thus, both high-frequency
    noise and high-frequency signal are discarded.


    # 6.6.2 Iterative methods: stopping early


    There are many ways to control the noise in an iterative algorithm. We can first
    consider a rough noise propagation model of a linear iterative algorithm:


    ```

    Error_{image} \sim \lambda_n(\omega) \times Error_{projections},

    (6.30)

    ```


    where Error_{image} is the error magnitude in the reconstructed image, Error_{projections}
    is the error magnitude in the projections, and \lambda_n(\omega) is the algorithm
    transfer function which depends on the frequency \omega and the iteration number
    n.


    We can compare an iterative reconstruction algorithm with an SVD matrix pseudo-inverse
    solution. You may imagine that \lambda_n(\omega) contains the information of both
    the singular values and singular vectors of the imaging matrix A. The frequency
    components are in the singular vectors. As the iteration number n increases, more
    singular vectors join \lambda_n(\omega). The iteration number is somehow related
    to the cutoff index in an SVD pseudo-inversion expression. With a larger iteration
    number n, \lambda_n(\omega) contains components with higher frequencies. In some
    linear algorithms, this relationship can be simplified to


    ```

    Error_{image} \sim \kappa \times Error_{projections},

    (6.31)

    ```'
