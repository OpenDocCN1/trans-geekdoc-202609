  md: 'invariant FBP algorithm, we need to do something against common sense. In Katsevich''s
    algorithm, a measurement is weighted by either +1 or -1. If a plane is measured
    once, we must make sure that it is weighted by +1. If a plane is measured three
    times, we need to make sure that two of them are weighted by +1 and the third
    one of them is weighted by -1. In other words, we keep one and throw the other
    two away. Ouch! Further discussion about the weighting and filtering will be given
    in the next section.


    ![](img/dd555effd38151c67af30d84800c554a_120_0.png)


    The cutting plane intersects the orbit once.


    The cutting plane intersects the orbit 3 times.


    Fig. 5.17: The \(\pi\)-segment defines a section of helix. A cutting plane is
    a plane passing through the reconstruction point. The cutting plane either intersects
    the section of helix one or three times.


    In Katsevich''s algorithm, the normalization issue is taken care of by selecting
    a proper filtering direction. Here, filtering means performing the Hilbert transform.
    After the filtering direction and the normalization issues have been taken care
    of, Katsevich''s algorithm is implemented with the following steps:


    +   (i) Take the derivative of the cone-beam data with respect to the orbit parameter
    along the helix orbit.

    +   (ii) Perform the Hilbert transform along the directions that have been carefully
    selected.

    +   (iii) Perform a cone-beam backprojection with a weighting function, similar
    to the backprojection in Feldkamp''s algorithm.


    Some later versions of the algorithm have replaced the derivative with respect
    to the orbit parameters by partial derivative with respect to the detector coordinates.'
