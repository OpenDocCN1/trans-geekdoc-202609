  md: 'practice, the mean value \(E(p)\) is unknown for a measurement \(p\), and we
    often use the current measurement \(p\) to approximate the mean value \(E(p)\)
    and the noise variance \(\text{Var}(p)\):


    \(\text{Emission: } \text{Var}(p) \approx p.\)


    # ## 4.3.2 Noise variance of transmission data


    For transmission imaging, the line integral of the attenuation coefficient is
    calculated as \(p = \ln(I_0/I_d)\), where \(I_d\) is assumed to be Poisson and
    \(I_0\) can be approximated as a constant. The noise distribution for the post-log
    data \(p\) is complicated. The common practice is to assume the noise in \(p\)
    obeys the Gaussian distribution. We are interested in finding the noise variance
    of \(p\). Using the linear approximation of the Taylor expansion,


    \(p = f(I_d) \approx f(E(I_d)) + \frac{f''(E(I_d))}{1!} I_d,\)


    with \(f(x) = \ln I_0 - \ln x\).


    Thus, the variance of \(p\) can be approximated as


    \(\text{Var}(p) \approx \left( \frac{f''(E(I_d))}{1!} \right)^2 \text{Var}(I_d)
    = \frac{1}{(E(I_d))^2} E(I_d) = \frac{1}{E(I_d)} \approx \frac{1}{I_d} = \frac{1}{I_0
    e^{-p}},\)


    \(\text{Transmission: } \text{Var}(p) \approx \frac{1}{I_0 e^{-p}}.\)


    # ## 4.3.3 Noise propagation in an FBP algorithm


    We assume that the projection measurements are independent random variables. A
    general FBP algorithm can be symbolically expressed by the following convolution
    backprojection algorithm:


    \(f(x,y) = \sum_s \sum_\theta b(x,y,s,\theta)h(s-\hat{s})p(\hat{s},\theta),\)


    where \(p\) is the projection, \(h\) is the convolution kennel, and \(b\) is the
    combined factor for all sorts of interpolation coefficients and weighting factors.
    Then the noise variance of the reconstructed image \(f(x, y)\) can be approximately
    estimated as


    \(\text{Var}(f(x,y)) \approx \sum_s \sum_\theta b^2(x,y,s,\theta)h^2(s-\hat{s})\text{Var}(p(\hat{s},\theta)),\)'
