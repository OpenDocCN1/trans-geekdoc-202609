  md: 'and the noise variance weighting is


    ```

    \Lambda^{\text{current}} = \text{diag}\{1/\sum_k a_{ik}x_k^{\text{current}}\}
    \approx \text{diag}\{1/p_i\}.

    ```


    In reality, the measurement noise may not be exactly Gaussian distributed or Poisson
    distributed. The author personally believes that it is not very critical what
    the noise distribution is, while it is very important to know the variance of
    the measurement noise, because it is the variance that is used in measurement
    weighting. For example, in an imaging system, the measurement \(p_i\) is noisy
    and the noise variance is related to \(p_i\) as


    ```

    (\text{Variance of } p_t) = s_i \bar{p}_i,

    ```


    where \(s_i\) can be a system scaling factor, \(p_i\) may not be Poisson distributed,
    and \(\bar{p}_i\) is the expected value of \(p_i\). Realizing that the imaging
    model is


    ```

    \sum_k a_{ik}x_k = p_i,

    ```


    we can modify the ML-EM algorithm and obtain a general image reconstruction algorithm
    as


    ```

    x_j^{\text{next}} = \frac{x_j^{\text{current}}}{\sum_i a_{ij} \frac{1}{s_i}} \sum_i
    a_{ij} \frac{p_i}{s_i \sum_j a_{ij}x_j^{\text{current}}}.

    ```


    If we rewrite this modified algorithm in the additive form, the noise variance
    weighting is


    ```

    \Lambda^{\text{current}} = \text{diag}\left\{1/\left(s_i \sum_k a_{ik}x_k^{\text{current}}\right)\right\}
    \approx \text{diag}\{1/(s_ip_i)\}..

    ```


