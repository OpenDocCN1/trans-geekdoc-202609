    # ## 7.3 The “I”


    The RF signal emitted by the patient as described in Section 7.2 cannot be used
    to form an image because it is a combined signal from everywhere. We need a way
    to code the location information. This is achieved by the gradient coils.


    In the MRI machine, there are many coils. The main large superconducting coil
    immersed in liquid helium is used to generate the strong static _B_<sub>0</sub>
    field. There are RF coils, which are used to emit RF pulses for excitation and
    to receive RF imaging signals. The other coils in the machine to create gradients
    are x-gradient coils, y-gradient coils, and z-gradient coils.


    # ### 7.3.1 To obtain z-information: slice selection


    The z-gradient coils are shown in Figure 7.9. The currents in the two coils are
    running in the opposite directions and generate the local magnetic fields to enhance
    and reduce the main field _B_<sub>0</sub>, respectively. The resultant magnetic
    field is still pointing in the z-direction; however, the field strength is stronger
    at locations with larger z-values and is weaker at locations with smaller z-values.
    These coils create a gradient of the magnetic field strength in the z-direction.


    This z-gradient makes a nonuniform magnetic field, which results in different
    Larmor frequencies ω for a different z-position. The Larmor frequency is ω<sub>0</sub>
    only at one z-slice. We turn on and off the z-gradient and the _B_<sub>1</sub>
    RF pulse at the same time. The _B_<sub>1</sub> RF pulse is at the frequency of
    ω<sub>0</sub>. According to the resonance frequency principle, only'
