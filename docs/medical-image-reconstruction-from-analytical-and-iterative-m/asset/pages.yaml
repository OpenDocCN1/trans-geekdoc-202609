    # # 4.2 Positron emission tomography and single-photon emission computed tomography


    In the last section, transmission imaging was discussed. In transmission imaging,
    the radiation source is placed outside the patient body. The radiation rays (either
    X-rays or gamma rays) enter the patient from outside, pass through the patient
    body, exit the patient, and finally get detected by a detector outside.


    This section will change the subject to emission imaging, where the radiation
    sources are inside the patient body. Radiation is generated inside the patient
    body, emitted from within, and detected by a detector after it escapes from the
    patient body.


    Radioactive atoms with a short half-life are generated in a cyclotron or a nuclear
    reactor. Radiopharmaceuticals are then made and injected into a patient (in a
    peripheral arm vein) to trace disease processes. The patient can also inhale or
    ingest the radiotracer. Radiopharmaceuticals are carrier molecules with a preference
    for a certain tissue or disease process. The radioactive substance redistributes
    itself within the body after the injection. The goal of emission tomography is
    to obtain a distribution map of the radioactive substance.


    Unstable atoms emit gamma rays as they decay. Gamma cameras are used to detect
    the emitted gamma photons (see Figure 4.10). The cameras detect one photon at
    a time. These measurements approximate the ray sums or line integrals. Unlike
    the transmission data, we do not need to take the logarithm. SPECT (single-photon
    emission computed tomography) is based on this imaging principle.


    Some isotopes, for example, O-15, C-11, N-13, and F-18, emit positrons (positive
    electrons) during radioactive decay. A positron exists in nature only for a very
    short time before it collides with an electron. When the positron interacts with
    an electron, their masses are annihilated, creating two gamma photons of 511 keV
    each. These photons are emitted 180° apart. A special gamma camera is used to
    detect this pair of photons,'
  merge: -1
  img_proc: true
