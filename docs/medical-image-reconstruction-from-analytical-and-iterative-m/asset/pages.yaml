    is a constant without any variation. In this case, the noise weighting has no
    effect. A larger \( \gamma \) gives a larger variation of the weighting function.
    When \( \gamma = 1 \), the weighting function is the so-called “correct” weighting
    which is widely used among researchers. Since the weighting function is affected
    by the “iteration number,” the “correct” weighting may not yield the best results.
    In practice, the readers are encouraged to use a \( \gamma \) value that is different
