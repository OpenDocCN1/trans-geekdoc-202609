  md: 'Let us illustrate the differences among the \( l_2 \) norm, \( l_1 \) norm,
    and \( l_0 \) quasi-norm. A norm is a sort of measure of the distance or length.
    Let us consider a point in the 2D x–y coordinate system with coordinates of (3,
    4). We want to find its “distance” from the origin (0, 0). If we use the \( l_2
    \) norm, the \( l_2 \) distance is given as \( \sqrt{3^2 + 4^2} = 5 \). If we
    use the \( l_1 \) norm, the \( l_1 \) distance is given as |3| + |4| = 7. If we
    use the \( l_0 \) quasi-norm, the \( l_0 \) distance is given as 1 + 1 = 2.


    Let us consider a different point in the 2D x–y coordinate system which has coordinates
    of (0, 4). We want to find its “distance” from the origin (0, 0). If we use the
    \( l_2 \) norm, the \( l_2 \) distance is given as \( \sqrt{0^2 + 4^2} = 4 \).
    If we use the \( l_1 \) norm, the \( l_1 \) distance is given as |0| + |4| = 4.
    If we use the \( l_0 \) quasi-norm, the \( l_0 \) distance is given as 0 + 1 =
    1.


    Figure 6.22 shows the unit circles using the \( l_2 \) norm, \( l_1 \) norm, and
    \( l_0 \) quasi-norm. Except for the \( l_2 \) norm unit circle, the other two
    unit circles do not look like circles at all. For a “measure” to be qualified
    as a norm, it needs to satisfy a set of axioms. A quasi-norm is almost a norm
    except that it does not satisfy an axiom called the triangle inequality.


    ![](img/dd555effd38151c67af30d84800c554a_178_0.png)


    Fig. 6.22: A unit circle is a trajectory of the points that have a distance 1
    from the origin. Left: \( l_2 \) norm''s unit circle. Middle: \( l_1 \) norm''s
    unit circle. Right: \( l_0 \) quasi-norm''s unit circle.


    In theory, the \( l_0 \) quasi-norm is the best measure to promote the sparsity
    of \( \psi X \) and should be used. However, the optimization procedure is not
    tractable for any \( l_p \) norm with \( 0 \le p < 1 \) because its associated
    objective function is not convex any more. The closest norm that produces a convex
    objective function is the \( l_1 \) norm. The \( l_1 \) norm minimization is nearly
    optimal, in the sense that its solution is not far from the solution with the
    much more complicated \( l_0 \) quasi-norm minimization.


    If the derivative of the Bayesian term exists, we can use the one-step-late algorithm
    introduced in Section 6.9.6 to reconstruct the image. Unfortunately, the derivative
