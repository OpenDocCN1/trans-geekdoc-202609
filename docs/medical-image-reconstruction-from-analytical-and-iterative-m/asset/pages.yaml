- pgno: 55
  md: '# 2.6.9 Derivation of the backprojection-derivative-Hilbert transform algorithm


    This algorithm is Method 6 discussed in Section 2.3.6, and it can be readily derived
    from Method 5 by observing that \(\partial/\partial s\) is a directional derivative,
    which is equivalent to \(-\sin \theta(\partial/\partial x)+\cos \theta(\partial/\partial
    y)\) Thus, we have


    \(\int_{0}^{\pi} \left. \frac{\partial p(s, \theta)}{\partial s} \right|_{s=x
    \cos \theta+y \sin \theta} d\theta\)

    \(= - \frac{\partial}{\partial x} \int_{0}^{\pi} \left. p(s, \theta) \sin \theta
    \right|_{s=x \cos \theta+y \sin \theta} d\theta + \frac{\partial}{\partial y}
    \int_{0}^{\pi} \left. p(s, \theta) \cos \theta \right|_{s=x \cos \theta+y \sin
    \theta} d\theta\)

    \(= \frac{\partial b_x(x, y)}{\partial x} + \frac{\partial b_y(x, y)}{\partial
    y}, \quad (2.51)\)


    where


    \(b_x(x, y) = - \int_{0}^{\pi} \left. p(s, \theta) \sin \theta \right|_{s=x \cos
    \theta-y \sin \theta} d\theta,\)

    \(b_y(x, y) = \int_{0}^{\pi} \left. p(s, \theta) \cos \theta \right|_{s=x \cos
    \theta+y \sin \theta} d\theta. \quad (2.52)\)


    Equation (2.51) gives the first two steps in Method 6. The third step, the line-by-line
    x-direction Hilbert transform, is the same in both Methods 5 and 6.


