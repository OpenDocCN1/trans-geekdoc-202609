    # ### 5.4.7 Grangeat''s relationship


    Grangeat established a relationship between the derivative of Radon data and the
    derivative of the line integrals of the data on the flat cone-beam detection plane.


    In the following, we only consider a fixed focal-point position \(\vec{\Phi}\).
    We arbitrarily select a straight line on the detector and sum up the cone-beam
    projections along this line. Let us set up a coordinate system on the detector
    plane (see Figure 5.26). The _u_-axis is along the integral line on the detector
    and the _v_-axis is orthogonal to the _u_-axis. We denote the cone-beam projection
    data on the _u_-_v_ coordinate system as _g_(_u_, _v_). If we use the object _f_
    with the spherical system, then the projection _g_(_u_, _v_) can be expressed
    as (see Figure 5.27)


    \( g(u, v) = \int_{-\infty}^{\infty} f\left( \vec{\beta}, \theta, r \right) dr,
    \quad \text{(5.44)}\)


    where _u_ and \(\theta\) are related as


    \( u = \sqrt{D^2 + v^2} \tan \theta \quad \text{(5.45)}\)


    As in Feldkamp''s algorithm, the cone-beam data are pre-scaled by a cosine function
    \(D/\sqrt{D^2 + u^2 + v^2}\). Thus, the data summation along the _u_-axis is actually


    \( s(v) = \int_{-\infty}^{\infty} g(u, v) \frac{D}{\sqrt{D^2 + u^2 + V^2}} du
    = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f\left( \vec{\beta}, \theta,
    r \right) \frac{D}{\sqrt{D^2 + u^2 + v^2}} drdu. \quad \text{(5.46)}\)


