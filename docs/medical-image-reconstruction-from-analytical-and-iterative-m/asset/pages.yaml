    ray within the pixel. If the inverse matrix \(A^{-1}\) of \(A\) exists, the reconstructed
    image is given as


    ```

    X = A^{-1}P.

    (6.3)

    ```


    Line length is not the only way to model the “contribution.” Some imaging physics
    (e.g., attenuation and point spread function) can also be included as well.


    For a practical imaging problem, the matrix \(A\) is not square. In this case,
    a generalized inverse of the matrix can be used. For example, we can find a least-squares
