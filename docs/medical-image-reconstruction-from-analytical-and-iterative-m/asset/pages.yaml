    For example, if a ray is measured twice, the sum of the weighting factors for
    these two measurements should be unity. For a fan-beam short scan, the projection/back-projection
    PSF is no longer shift invariant.


    # 3.4 Mathematical expressions


    This section presents the derivation steps for the FBP algorithm for the curved
    fan-beam detector. The ramp filter used in the filtering step is formulated as
    a convolution. In this algorithm, the fan-beam backprojector contains a distance-dependent
    weighting factor, which causes nonuniform resolution throughout the reconstructed
    image when a window function is applied to the ramp filter in practice. In order
    to overcome this problem, the ramp filter can be replaced by a derivative operation
    and the Hilbert transform. The derivation of the fan-beam algorithm using the
    derivative and the Hilbert transform is given in this section.'
