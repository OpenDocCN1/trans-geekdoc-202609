  md: 'indicate that the ML methodology can be employed for the generation of NMR
    logs with a high degree of precision.


    Masroor et al. (2022) describe an ML procedure for estimating NMR permeability
    from conventional well logs. The methodology employs three supervised (ML) algorithms:
    group method of data handling, Random Forest (RF), and one-dimensional convolutional
    neural network (CNN). Additionally, a modified version of the two-dimensional
    CNN (Residual 2D-CNN) is devised, receiving artificial 2D feature maps derived
    from conventional logs. The ML and deep learning (DL) models’ hyperparameters
    are optimised using genetic algorithms to enhance their efficacy. The results
    indicate that nonlinear machine and DL techniques help estimate NMR permeability,
    with the Res 2D-CNN model providing the most efficient results (accuracy of 0.97).
    The study underscores the significance of employing produced feature maps to train
    the Res 2D-CNN model and the favourable impact of integrating residual and deeper
    bottleneck architectures in enhancing prediction accuracy and minimising training
    duration.


    Tamoto et al. (2023) also describe a study aimed at developing ML models for the
    estimation of NMR porosity from well logs. NMR logs are considered valuable for
    porosity quantification but are limited by high costs and adverse subsurface acquisition
    conditions. The adjusted RMSE and R² and metrics compared and evaluated four supervised
    ML models. The best results were achieved with the CatBoost regressor, producing
    an RMSE of less than 0.01 and an adjusted R² of 0.87. The ML models substantially
    improved total porosity prediction compared to traditional empirical computations.
    The dissimilarities between actual NMR logs and the ML predictions were mostly
    below 5%. Additionally, a porosity model based on well logs was developed using
    tree boosting, and the impacts of input variables on model estimates were investigated.
    The study also scrutinised the behaviour of the model’s linear and nonlinear characteristics
    to comprehend their relationships with the dataset.


    Li et al. (2020) present a study on the use of two neural-network-based ML models,
    long short-term memory (LSTM) network and a variational autoencoder with a convolutional
    layer (VAEc) network, for the generation of synthetic NMR T₂ distributions from
    formation mineral and fluid saturation logs. The models are trained and tested
    on a limited sample of data from the Bakken shale formation. The results show
    that both models perform well, synthesising fluid-filled pore size distributions
    even when the input data is corrupted by noise. The proposed method has the potential
    to improve reservoir characterisation under data constraints. NMR logs provide
    valuable information on fluid mobility, fluid-filled pore size distribution, fluid
    mobility, porosity, and permeability in the near-wellbore reservoir volume. However,
    their acquisition is limited due to financial and operational challenges. Hence,
    the use of ML can make NMR logs available in all wells.'
