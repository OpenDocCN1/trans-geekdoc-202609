  md: '![](img/80b94770dd572ad559c67fa9921bb887_53_0.png)


    Fig. 3.1. The excitation and relaxation of polarised hydrogen atomic nuclei in
    response to an external magnetic field (Otchere et al., 2022a).


    The concept of using NMR to predict pore fluid types is to use the magnetic properties
    of certain nuclei to provide information about a reservoir’s fluid composition
    and rock properties. This prediction is achieved by measuring the proton density
    and relaxation times of the fluids in the reservoir, which are unique to different
    fluid types, such as water, oil, and gas. When CMR is used for porosity partitioning,
    the total porosity is calculated by measuring the magnetic susceptibility of the
    pore fluids and using the relationship between magnetic susceptibility and fluid
    volume fraction. This method is based on the assumption that the magnetic susceptibility
    of the bound fluid is different from the free fluid, which is a key concept in
    CMR. The following equations are used to calculate total porosity, BFV, and FFV
    in reservoirs:


    (φT) = φB + φF


    (3.1)


    where the total porosity is represented as φT, which is a dimensionless value
    between 0 and 1, representing the fraction of the rock sample that is made up
    of pores, φB is the bound fluid volume fraction, and φF is the FFV fraction.


    BFV = φB × Vp


    (3.2)


    where Vp is the pore volume.


    FFV = φF × Vp


    (3.3)'
