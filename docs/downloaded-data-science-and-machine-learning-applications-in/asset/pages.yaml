    ```

    $BF_{ps}(x_k, x_i) = BF_p(x_k) \times BF_s(x_i). \quad (7.16)$

    ```


    # 2.3.2 Group Method of Data Handling (GMDH)


    In this study, GMDH is used to develop an explicit mathematical model with degrees
    of the polynomials to predict the oil recovery factor for CO₂-LSWAG under the
    miscible condition in a carbonate reservoir. Ivakhnenko (1966) cyberneticist proposed
    a GMDH polynomial neural network (PNN)) algorithm for constructing high-order
    regression-type polynomials. However, due to the self-organising nature of the
    GMDH algorithm (selecting its own input parameters automatically based on the
    parameter’s contribution to the final output), the GMDH modelling approach is
    able to overcome many artificial neural network (ANN) limitations as an alternative
    method (Lv et al., 2023). GMDH employs optimisation criteria to determine network'
