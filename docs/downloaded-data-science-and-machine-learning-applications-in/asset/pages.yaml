  md: 'The probabilistic model, a response surface that maps hyperparameters to the
    objective function probability score, is successfully evaluated with an acquisition
    function before selecting suitable samples to assess the actual objective function.
    Hyperparameter tuning is the act of updating the model’s parameters to regulate
    the training procedure’s performance and optimise the model’s performance by achieving
    a reasonably lower cost function (Otchere et al., 2022c).


    # 4.3 Explainable AI


    In most cases, the application of feature selection techniques is unsupervised;
    hence, there is no right or wrong answer, making each technique different for
    each data. For this research, model agnostic methods will be used to analyse the
    importance of input features to separate its explanations from the machine learning
    model. The desirable characteristics sought after are model representation and
    explanation flexibility, which are not limited to a specific type and make sense
    in the context of the model being explained. For this purpose, the Permutation
    Feature Importance (PFI) and Shapley values will be used to explain the results
    generated by the models. The inputs to achieve this are the model, the feature
    vectors, the target, and the error metrics. After applying these techniques, features
    that do not explain the target will be removed from the input feature vector.


    # 4.3.1 Permutation Feature Importance


    Permutation feature importance (PFI) is a model agnostic approach for computing
    the significance of features (Otchere et al., 2022a). This approach works by permuting
    the relationship between a feature and the model output by assigning the feature
    a nearly random value. The basic working principle to achieve this is to compute
    the importance of a feature by measuring the increase in estimation error after
    fifty feature permutations. As a result, a feature is considered essential if
    omitting its value increases the model error. Otherwise, it is unimportant if
    the error remains constant (Breiman, 2001). The main advantages of applying PFI
    are its straightforward interpretation, highly compressed global insight into
    a model’s behaviour, and not require retraining. However, one disadvantage is
    that it is unclear whether the training or test data should be used to measure
    PFI. The in-built function, permutation_importance, in Scikit-learn (Pedregosa
    et al., 2011) was used to run the PFI inspection technique. Given a regressor
    model, a function is created where the feature importance of all the input features
    is computed. An importance score criteria are computed whereby features achieving
    high values represent better predictive power.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 4.3.2 Shapley Values


    The Shapley value, introduced by Lloyd Shapley (Shapley, 1953) from Cooperative
    Game Theory, is a critical concept in measuring feature importance and the contribution
    of each feature to the models’ performances. Shapley values work by allocating
    a unique distribution among the participants of the entire surplus value created
    by the coalition of all players in each cooperative game. The theory defines four
    properties that must be satisfied: efficiency, symmetry, dummy, and additivity.
    The players represent the input features in machine learning and interpretability,
    and the Shapley value determines how much each feature contributes to the output.
    Knowing how the features contribute to the model output helps in understanding
    the essential factors in generating the model’s results. The Shapley value is
    not specific to any particular model type; hence it can be used regardless of
    the model type and architecture. Perhaps, unlike any other method of interpreting
    model results, Shapley’s values are based on a solid conceptual framework. While
    making intuitive sense is essential for interpretability, other methods lack the
    same rigorous conceptual framework. Shapley values have one key advantage of being
    evenly distributed among an instance’s feature values. It has been suggested that
    Shapley may be the only way to offer a complete explanation in cases when the
    law mandates it, such as the right to explanations. Shapley, like any other approach,
    has inherent drawbacks. The most crucial is that it is computationally expensive,
    implying that only an approximate solution can be calculated in a high percentage
    of real-world scenarios. It is also easy to misunderstand. After removing the
    feature from the model training, the Shapley value is not the difference between
    the expected and actual values. It is how much an input value contributes to the
    gap between the actual and average prediction.


    The open-source Shap library is a robust tool for working with Shap values and
    other metrics. Shap establishes a link between efficient credit allocation and
    local explanations, making it model agnostic. It ties together optimum credit
    allocation and local explanations. Using game theory’s traditional Shapley values
    and associated expansions have been the focus of numerous recent works. Recent
    academics have expanded on this notion by developing approaches for Shap values
    in deep learning models and gradient explainers. These approaches estimate Shap
    values for any model using specifically weighted local linear regression. It also
    provides various charts to help view the data and comprehend the model.


    This study does not include the mathematical foundations of the models utilised
    because there is a vast collection of published material detailing them. An overview
    of the methodology workflow used in this study is demonstrated in Fig. 2.2.'
  merge: -1
  img_proc: true
