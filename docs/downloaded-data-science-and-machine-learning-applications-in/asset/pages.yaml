- pgno: 84
  md: '# 3.2 Random Forest Conceptual Overview


    Another well-known robust bagging algorithm is the Random Forest (RF) developed
    by Breiman (Breiman, 2001). RF ensembles numerous Decision Tree base learners
    randomly using averaging (Dinov, 2018). Each base learner is trained on a random
    vector independently chosen with similar vector distribution to the other forest
    learners. The wisdom of crowds is a simple yet powerful notion at the core of
    RF. This concept means that many relatively uncorrelated learners working together
    surpass any individual base learners. The crucial point is the poor correlation
    amongst models, which allows the excellent performance of RF. The trees shield
    each other from their prediction errors, so RF generates excellent outcomes. While
    some trees may be inaccurate, many others will be accurate, allowing the trees
    to grow in the appropriate direction as a forest. Decision trees are susceptible
    to the dataset on which they are trained such that minor changes to the training
    data typically result in a radically altered tree structure. This disadvantage
    is solved by the random forest using the bagging principle, which allows each
    unique tree to be randomly selected from the dataset with replacement, resulting
    in diverse trees.


    Any given tree’s prediction becomes, in a sense, a characteristic of the overall
    model prediction. Due to its robustness against overfitting and simple interpretability,
    RF is frequently employed to provide good model results. This merit results from
    its assessment of the target’s critical input factors and the high priority given
    to correlated aspects. However, RF has a greater bias against high cardinal characteristics.
    The averaging of the base learners’ predictions is mathematically represented
    as:


    $$\hat{y} = \frac{1}{n} \sum_{k=1}^{n} h_k(X) \tag{4.10}$$


    where $\hat{y}$ is the output, h(X) is the number of trees, X is the input vector,
    and n and k are the overall numbers of trees grown where n is greater than k and
    k is greater than 1.


    The out-of-bag (OOB) score is another essential aspect of the RF algorithm. Specific
    samples will be excluded from the subsamples used to train the base learners when
    bootstrapping. These out-of-sample examples may be used to assess the learner
    and generate an OOB score, acting as a pseudo-validation subset for the random
    forest model. Set oob score = True when initialising the random forest object
    to acquire the OOB score. Another critical aspect of the RF algorithm is its feature
    engineering capability entailing selecting the most relevant features from the
    input variables in the training dataset. Feature selection is an essential part
    of the machine learning workflow.


    The primary disadvantage of random forest is that many trees may slow down and
    render the model inefficient for predictions. In general, the model'
