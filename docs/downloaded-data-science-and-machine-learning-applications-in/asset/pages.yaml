    of salt probability bodies has increased compared to the initial results obtained
    before the retraining of the CNN. The results showed a statistically significant
    improvement when iterations were increased in steps of 100 from 100 to 10,000.
    The best combination of input data and iterations was determined by comparing
    the pair-wise DSC metrics of all the iterations and increasing the number of input
    labelled data. DSC results sequentially increased with successive increments in
