    # Step 4: Sensitivity Analysis


    PROSPER helps users perform analysis by changing parameters such as GOR, water
    cut, and reservoir pressure to know how changes in these parameters will affect
    the well’s or reservoirs’ deliverability. For this work, water cut, GOR, and reservoir
    pressure were varied.


    # Step 5: Vertical Lift Performance Correlations


    Different correlations for VLP are provided. Test results showed that the Petroleum
    Expert correlation was appropriate to the well circumstances and therefore employed
    for VLP and sensitivity analysis. For surface equipment horizontal piping, Beggs
    and Brill (1991) correlations were employed.


    # Step 6: Gas Lift Modelling


    For this work, a continuous gas lift system was employed. The reason for opting
    for the continuous gas lift was based on these criteria; wells in this work are
    high productivity wells, lift gas is available for use and this warrants the use
    of gas lift method and field under investigation produces under high GOR conditions.
    PROSPER simulation software was used in the modelling of the gas lift for all
    the wells under investigation. A gas injection rate was 10 MMscf/day was used.
    The casing pressure imputed was at 1,500 psi with a kickoff pressure of about
    1,900 psi. The pressure gradient of the kill fluid was set to 0.465 psi/ft. All
    these datasets are shown in Table 11.7.


    # 2.5 Artificial Neural Networks


    ANN is a group of inputs and outputs of connected units where each connection
    has a weight associated with its computer program (Pennel et al., 2018; Akwensi
    et al., 2021; Brantson et al., 2022). This network helps build predictive models
    from large databases. The model is built on the concept of the human nervous system.
    For this work, two types of ANN (BPNN and RBFNN) models will be considered.'
