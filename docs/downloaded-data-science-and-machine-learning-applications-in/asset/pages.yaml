  md: '![](img/80b94770dd572ad559c67fa9921bb887_105_0.png)


    Q = f(P₁, T₁, P₂, T₂, P₃, T₃, Chkpos, ... x)


    Fig. 5.1. Schematic graph of well sub models.


    Many conservation equations in the mechanistic VFMs take a dynamic form. However,
    because of the steady state or quasi-steady state nature of the optimisation problem
    formulation, an optimisation solver can only discover a solution for a single
    point in time or can use the solution from the previous step as a first estimate
    for the prediction of the current time step. Sometimes, due to the nature of the
    problem, the conservation equations adopt steady state forms or do not take time
    as a variable parameter. Although it is feasible to frame the VFM as an optimisation
    problem dynamically, such a strategy is not applied in VFM literature. The primary
    reason for this could be the cost of complex computations of the dynamic optimisation
    for VFM systems. Also, that would not make it suitable for real-time applications.


    In addition to dynamic optimisation, Kalman filter approaches and other state
    estimation methods may be employed to develop a dynamic VFM. The major difficulty
    of this method could be the high level of knowledge required for setup and use
    of this application, as well as the difficulty of tuning the actual field data
    in a reliable way.


    On the other hand, the data-driven VFM technique is based on gathering field data
    and mathematically adapting it to the production system’s physical parameters,
    such as well bore and choke geometry, flow-line wall thickness, etc., without
    providing an explicit description of those parameters. Over the past few years,
    this strategy has gained a lot of popularity not just for oil and gas applications
    but also for many other applications. The data-driven'
