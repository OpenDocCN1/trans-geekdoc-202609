    This edited research book on Data Science and Machine Learning Applications in
    Subsurface Engineering features a collection of research papers highlighting the
    latest field advances. The book covers a wide range of topics related to the application
    of data science and machine learning techniques in subsurface engineering. The
    book’s main contributions can be summed as novel techniques for seismic interpretation,
    improved reservoir characterisation, data-driven decision-making, and applications
    beyond oil and gas. Overall, the contributions of this edited research book advance
    our understanding of the potential of data science and machine learning in subsurface
    engineering. The book provides a valuable resource for researchers, practitioners,
    and students interested in this field and highlights the latest developments that
    can be applied to solve complex problems in subsurface engineering.


    The future of subsurface engineering is exciting and filled with opportunities,
    but it also presents significant challenges. The rapid pace of technological innovation
    and the increasing demand for sustainable energy solutions require the industry’s
    continuous and dynamic response. The contributors to this book provide valuable
    insights into the potential of data science and machine learning techniques to
    address these challenges, as well as the need for continued collaboration and
    innovation in this field.


    In conclusion, this book offers a comprehensive collection of research papers
    covering various aspects of applying data science and machine learning in subsurface
    engineering. The book highlights the potential of these technologies to transform
    how we approach subsurface engineering challenges and highlights the importance
    of collaboration, transparency, and ethical considerations in their use. As the
    editor, I encourage readers to delve into the chapters and explore the exciting
    research, as they can expect to gain insight into the latest techniques and developments
    in this exciting field.'
