  md: '# Table 11.1. Options summary data.


    | Data | Remarks |

    |---|---|

    | Options | The options menu is used to define the characteristics of the well.
    Well characteristics such as fluid type, well completion, and desired lift method
    are defined here. |

    | PVT Model | The Black Oil model was selected. This model is suitable for usage
    in a wide variety of applications and hydrocarbon fluid systems. A minimum of
    GOR solution, oil viscosity and water formation salinity are required. Data from
    PVT are imputed, and correlations have been chosen that best corresponds to the
    location or oil type. |

    | Fluid Description | Oil and Water |

    | Temperature Model | Rough approximation |

    | Flow Type | Tubing flow |

    | Well Type | Producer |

    | Prediction | Pressure and temperature offshore model |

    | Well Completion | Cased hole |

    | Reservoir Type | Single branch reservoir |

    | Artificial Lift Design | Gas lift |


    # Step 2: PVT Data


    Data such as Solution Gas Oil Ratio (GOR), water salinity, and impurities present
    in the oil are imputed into the simulation program as shown in Table 11.2. Data
    for matching actual field data to the simulation program is also imputed in this
    menu. The bubble point and oil viscosity correlation were selected. Glazo and
    Beal et al. correlations were the best correlation models with the least standard
    deviation.


    # Table 11.2. PVT data.


    | Input Data | Values |

    |---|---|

    | Solution GOR (scf/bbl) | 1 243 |

    | Oil Gravity (°API) | 36 |

    | Gas Gravity | 0.878 |

    | Water Salinity (ppm) | 100000 |

    | Mole percent H₂S (%) | 0 |

    | Mole percent CO₂ (%) | 0 |

    | Mole percent N₂ (%) | 0 |'
