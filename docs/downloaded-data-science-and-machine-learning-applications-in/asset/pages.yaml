- pgno: 289
  md: 'Since both wells are high productivity index wells, a screening chart for high
    productivity wells was used. Sucker rod and progressive cavity pumps were not
    applicable in this field due to the depth restriction of not more than 3,050 m.
    Electrical Submersible Pump (ESP) and Gas Lift were the next in line for the screening
    process. At the end of the screening process, the gas lift was selected based
    on the following criteria. Gas lift can handle fields that have wells with a fluid
    gravity greater than 15° API. Also, the temperature for all the wells was in the
    acceptable range for gas lift 98.89–106.11°C. The required operating volumes for
    the wells were within an acceptable range for gas lift use. The required operating
    volumes for the gas lift range is 200–30,000 BOPD. Based on screening by advantages,
    gas lift is an excellent choice for offshore applications due to its high efficiency
    rate when used offshore. In addition to that, compressors are already available
    onsite for use. For the above reasons, the gas lift was chosen as the artificial
    lift technique for the wells under investigation for this research. Table 11.12
    shows the field data used for the screening.


