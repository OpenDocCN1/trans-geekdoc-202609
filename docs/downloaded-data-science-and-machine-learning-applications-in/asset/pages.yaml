- pgno: 106
  md: 'model can conduct quick and precise real-time metering if the model has been
    properly trained and the exposed conditions fall within the training range. This
    method can build models more affordably than mechanistic models since it does
    not require much in-depth production engineering domain expertise. In the following
    section, we are presenting various data-driven VFM applications on different oil
    wells systems.


    # 3. Data Driven VFM Main Application Areas


    Virtual sensors are convenient replacements of physical sensors that use available
    data during well-known conditions in instrumented wells to predict other measurements
    (Vinogradov and Vorobev, 2020). For instance, wellhead pressure (WHP) and wellhead
    temperature (WHT) are related to flow line pressure (FLP) for a specific choke
    diameter; therefore, it is convenient to establish a machine learning model among
    these four variables so that it can serve as a replacement whenever needed. Since
    most of the oil and gas wells exhibit a non-stationary process, where the boundary
    conditions may change along with the life of the field, it is probably safe to
    recognise that the virtual sensor model may not be valid throughout the life of
    the well, but for a specific period of time. Finally, a data-driven VFM would
    be very beneficial when there is sufficient measured data, including frequent
    well tests (e.g., 8–12 per year), permanent wellhead and flow line sensors (pressure,
    temperature). In the upcoming subsections, we are introducing different attempts
    of VFM for various production systems.


    # 3.1 Virtual Sensing in ESP Wells


    Electric submersible pumps (ESPs) are currently widely employed on many artificially
    lifted wells with high water cut and offshore oil wells due to their simple structure
    and high efficiency (Takacs, 2018). Among all the artificial lift systems, ESP
    is preferred because it can produce high volumes in higher temperatures and reach
    deeper depths. The development of sensors and data acquisition systems make it
    possible for ESP systems to continuously record the intake pressure and temperature,
    pump head, discharge pressure, and temperature, motor temperature and current,
    leakage current, vibration, etc. These data would be recorded at regular intervals
    and transmitted to surface remote terminal units (RTUs) (Carpenter, 2019). Figure
    5.2 shows a schematic graph of sub-modules and sensors deployed on the electrical
    submersible pump well system.


    Based on the advancement in communication, well technology, and field equipment,
    a lot of approaches are made for the estimation of flow rates in real time. In
    the following, a summary of the applications of soft sensing both mechanistic
    and surrogate modelling is given.'
