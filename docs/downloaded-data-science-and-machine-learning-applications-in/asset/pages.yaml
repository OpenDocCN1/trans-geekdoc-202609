    complete overlap between two sets of binary image segmentation results, A and
    B target regions (Fig. 8.8). The DSC is defined as (Yao et al., 2020);


    DSC(A, B) = 2(A ∩ B)/(|A| + |B|) (8.1)


    where ∩ represents the intersection of the two target regions |A| and |B| is the
    cardinality of the set. When there is a much higher number of background voxels
    than the number of target voxels, the DSC can be conceptualised as a special case
    of the kappa statistic, typically applied in situations involving reliability
    analyses. This concept has been shown previously by Zou et al. (2004).


    # 3. Results and Discussion


    # 3.1 Calculated Salt Body Volume


    In Fig. 8.9, the low level of accuracy in predicting salt probability bodies is
    noted. However, the possibility of using DCNN to map salt bodies on the base of
    seismic data has been illustrated. This low accuracy predicted salt probability
    volume could give an indication of the location and boundaries of the salt bodies.
    While the calculated salt body volume provides a broad indication of the presence
    of salt in the Groningen Field, it does not provide precise information regarding
    the exact position of the top, base, and wall sides of salt bodies. This is because
    the calculated volume is based on the probabilistic output of the DCNN model.
    As such, it may contain sections of “false probability” where the analysis of
    the reflectivity pattern does not suggest the presence of a salt body.'
