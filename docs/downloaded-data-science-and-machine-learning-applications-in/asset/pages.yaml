    # 4. Results and Discussion


    # 4.1 Evaluation of Models’ Performances


    Given the expense associated with operating an NMR log and the efficacy of machine
    learning models in reservoir characterisation, a variety of models were employed
    to estimate the total porosity and free fluid volume of a carbonate reservoir
    from wireline logs. The findings in Fig. 3.4 indicate that the hybrid ensemble
    exhibited an improved accuracy of holdout data in the prediction of total porosity
    and moveable fluid compared to the other models. Although some models, Extra Trees
    and XGBoost, achieved the highest training accuracy but comparatively lower test
    accuracy compared to the hybrid model, the models likely overfitted to the training
    data. Overfitting occurs when a model is too complex and can fit the training
    data very well but cannot generalise well to the test data. This issue is usually
    caused by having too many parameters or too much capacity in the model, which
    allows it to fit the noise in the training data. In this case, the Extra Trees
    model has a high training accuracy of 1, which is an indication that it is able
    to fit the training data very well. However, the test accuracy of 0.82 is lower
    than


