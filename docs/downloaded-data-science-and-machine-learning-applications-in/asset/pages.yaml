    # 1. Introduction


    With rising global energy demand and diminishing oil reserves, enhanced oil recovery
    (EOR) from existing brownfields is becoming increasingly important (Sheng, 2011).
    As production from the petroleum reservoir increases, the reservoir’s inherent
    primary energy depletes, resulting in insufficient reservoir pressure to drive
    the oil to the surface. As a result, secondary recovery methods (water or gas
    injection) are needed to boost production output. The oil recovered through both
    primary and secondary processes ranges from about


