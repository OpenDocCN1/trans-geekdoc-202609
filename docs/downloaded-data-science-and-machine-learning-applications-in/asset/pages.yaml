  md: '# CHAPTER 6


    # Data-driven and Machine Learning Approach in Estimating Multi-zonal ICV Water
    Injection Rates in a Smart Well Completion


    Daniel Asante Otchere¹,²,* and

    Mohammed Ayoub Abdalla Mohammed³


    # 1. Introduction


    The ‘smart’ or ‘intelligent’ well is considered one of the highly developed types
    of nonconventional wells. This statement refers to the cutting-edge versions of
    wells that have been introduced in recent years. The progressive nature of these
    wells is evident in their ability to gather and analyse data, monitor and control
    the production process, and adjust production in response to changing reservoir
    conditions. The term ‘smart’ or ‘intelligent’ has been coined to highlight the
    high level of automation and the use of advanced technology in these wells. A
    typical smart well features a customised completion with packers or sealing components
    that partition the wellbore with downhole sensors and pressure control valves
    fitted on the production tubing across separate reservoir intervals in a heterogeneous
    formation. Downhole sensors allow for continuous monitoring of temperature and
    pressure across the reservoir and


