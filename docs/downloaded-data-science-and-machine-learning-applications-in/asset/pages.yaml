- pgno: 250
  md: '# 5. Lithology and Facies Analysis


    The study of sedimentary depositional environment and its heterogeneity (Table
    10.4) has been studied by many authors (e.g., Meshri, 1986; Pettijohn, 1983; Yu,
    2008) except Qui (2000). The various authors suggested that the sedimentary depositional
    environment and its heterogeneity comparison can be best classified by studying
    its facies. In the early 1990s, Walker and James (1992) underlined that facies
    analysis is essential when studying basin fills. Lithology and facies analysis
    help to subdivide the reservoir rock sequence into respective lithostratigraphic
    units to help map and correlate between depositional areas and analyse their source.
    Due to the complexity of facies modelling, Tang (2008) outlined the two basic
    approaches for facies modelling, which are: the exploitation of empirical equations
    such as the Archie equation, multivariate statistics, and neural network. In recent
    years, the latter has gained more attention, with which several researchers have
    used multivariate statistics and neural networks for facies modelling (e.g., Bestagini
    et al., 2017; Miller et al., 2019; Tran, 2020) and identify lithology (e.g., Al-Anazi
    and Gates, 2010; Al-Mudhafar, 2017a; Alzubaidi et al., 2021).


    # 5.1 AI Applications in Lithology and Facies Analysis


    Rafiq et al. (2016) proposed an idea of microseismic facies analysis that enables
    the segmentation of an eccentric reservoir into discrete facies in response to
    microseismic accompanied by the combined exposition of microseismic with 3D seismic
    data. This approach was originally proposed by Eaton et al. (2014) and has been
    modified by the authors. Their findings correlated with the principal curving
    irregularities from 3D seismic data. With the combination of microseismic facies
    analysis and field parting acquired from log and core data, the authors delineated
    reservoir segments marking structural and depositional trends. De Matos et al.
    (2007) proposed two new semiautomatic alternative methods for seismic facies analysis.
    They used Kohonen Self-Organising Maps (SOMs) clustering as an advanced approach
    for mapping seismic facies, evaluating their quantity, and selecting seismic trace
    peculiarities in each oriented geological segment with the help of the wavelet
    transform algorithm. Validating their results, both approaches were used and utilised
    the synthetic and real seismic data from the Namorado deepwater oilfield in Campos
    Basin, offshore Brazil. For several seismic data sets, the results confirmed a
    good prediction of SOM clustering. The results also showed an improved seismic
    facies analysis by utilising trace distinctiveness noticed by the wavelet transform
    technique.


    An integration of wireline logs into seismic lithofacies classification was conducted
    by Avseth and Mukerji (2002). The input data for the study comprised GR, RHOB,
    seismic velocity, and impedance. The lithofacies'
