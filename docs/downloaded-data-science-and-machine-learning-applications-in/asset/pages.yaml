  md: '![](img/80b94770dd572ad559c67fa9921bb887_75_0.png)


    **Fig. 4.1.** Vs and Vp sonic velocities from *in-situ* sonic and field seismic
    measurements for mudrocks. Modified after Castagna et al. (1985).


    combinations of quartz and carbonates. The results of this study served as the
    foundation of several empirical approaches. This study will discuss two of the
    most commonly used techniques for estimating Vs.


    Research conducted by (Castagna et al., 1985) concluded that Vs sonic velocity
    is directly related to Vp sonic velocity for both water-saturated and dry siliciclastic
    sedimentary rocks, as shown in Fig. 4.1. Shales tend to have a relatively greater
    Vp/Vs than clean sandstones, given a similar Vp. From their results, Vp/Vs is
    almost homogeneous for dry sandstones. Wet sandstones and mudstones exhibited
    an indirect monotonic relationship between Vp and Vp/Vs. The Vs sonic velocities
    measured in water-saturated sandstone agreed with those predicted by Gassmann’s
    equations. This empirical linear relationship between the Vp and Vs sonic velocity
    in brine-saturated clastic silicate rocks is known as the mudrock line and is
    expressed from *in-situ* sonic and field seismic measurements as:


    $$V_p = 1.16V_s + 1.36 \tag{4.1}$$


    This linear equation is partly explained by the location of the clay point near
    a line joining the quartz point with the water velocity. The equation was formulated
    assuming that Vp and Vs velocities decrease linearly as increasing clay porosity
    approaches water. Similarly, when pure clay is mixed with quartz, velocities increase
    monotonically as the quartz point is approached. These constraints correspond
    with those deduced from Tosaya and Nur (1982) empirical relations, except for
    high porosity behaviour.


    Greenberg and Castagna (1992) proposed a correlation, the Greenberg-Castagna formulation,
    for pure unit completely brine-saturated'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'mineral rocks based on linear relations of Vp to estimate the Vs sonic velocity
    from other petrophysical parameters. To predict Vs sonic velocity of a 100% saturated
    rock, it is required to perform fluid replacement calculations by utilising Gassman
    relations. In order to mitigate the major limitation of the Greenberg-Castagna
    formula, fluid substitution is done when there are hydrocarbon-bearing rocks.
    It requires several sets of operations known as Gassmann fluid substitutions (Gassmann,
    1951). They utilised the regression weights for different lithologies shown in
    Table 4.2 to satisfy the expression:


    $$V_s = a_{i2} V_p^2 + a_{i1} V_p + a_{i0} \tag{4.2}$$


    The lines of fit for the lithological regression weights are based on Simm and
    Bacon (2014). The method''s fundamental process entails completing multiple iterations
    beginning with Vp assumptions for brine until it reaches a considerable convergence,
    assuring the validity of the Vs prediction. The regression coefficients of Vs
    are presented in Table 4.2.


    Techniques based on artificial intelligence (AI) are currently being utilised
    on a massive scale in the renewable and oil and gas industry. These techniques
    have led to significant developments in their application to improve the accuracy
    of their predictions (Otchere et al., 2021b). Numerous research has used machine
    learning techniques to predict Vs, highlighting their usefulness in identifying
    patterns amongst highly dimensional and complex wireline data (Anemangely et al.,
    2019; Bagheripour et al., 2015; Onalo et al., 2018). Table 4.3 summarises the
    various machine learning research conducted to predict Vs and, in some cases,
    Vp from conventional wireline logs. The summary will indicate the differences
    in this current study.


    The fundamental differences between the various studies and techniques used in
    predicting Vs or Vp were the model type, formation, reservoir fluid and input
    variables. Whereas supervised machine learning models are only as efficient as
    the information they are trained with when irrelevant data is used as input or
    important features is omitted, the model''s performance degrades (Otchere et al.,
    2021c). As a result, identifying and selecting features based on a demonstrated
    record of their effect on Vs and Vp measurements is required, invalidating the
    choice of machine learning models used as relevant. The main distinction between
    this study and earlier studies is the multi-output prediction of Vp and Vs, with
    Vp not being used as an input for Vs prediction.


