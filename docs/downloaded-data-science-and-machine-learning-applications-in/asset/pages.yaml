- pgno: 20
  md: 'two-image resolution DCNN techniques to identify the most suitable one for
    vertical resolution improvements. The success of using synthetic data to pre-train
    the DCNN and deploying it on a real field makes AI a promising candidate for enhancing
    vertical and lateral seismic image resolution. This research highlights the potential
    of AI techniques in improving seismic imaging and interpretation, paving the way
    for future developments in this area.


    Finally, Chapter 10 provides a structured overview of the application of AI in
    reservoir characterisation. The paper focuses on the empirical approach, AI application,
    and its enhancement with other computational models, as well as recent AI advancements
    for reservoir property prediction. The paper is divided into 10 sections, with
    Section 2 providing an overview of the empirical correlation used for petrophysical
    reservoir characterisation. The subsequent sections delve into the application
    of fractals analysis, AI, and machine learning techniques such as ANN and SVM
    and the review of lithology and facies analysis. The contribution of seismic data
    in reservoir property prediction is also examined, with Section 7 exploring the
    application of hybrid AI in reservoir characterisation. Section 8 highlights the
    summary of individual AI algorithms used in reservoir characterisation, while
    Section 9 addresses the challenges and the way forward for reservoir characterisation.
    Finally, Section 10 concludes the study and spells out the significant keys drawn
    from the present review. Overall, this structured overview provides valuable insights
    into the application of AI in reservoir characterisation, highlighting its potential
    to enhance the accuracy and efficiency of characterisation processes.


    Together, these chapters provide a comprehensive overview of how data science
    and machine learning can be applied to subsurface engineering, demonstrating the
    potential of these technologies for revolutionising the way we explore, produce,
    and manage subsurface resources.


    Subsurface engineering is a complex and challenging field that requires a deep
    understanding of the physical properties of the subsurface, including geology,
    fluid mechanics, and rock mechanics. Traditionally, subsurface engineering relied
    on deterministic models and manual interpretation of data, which were often time-consuming
    and prone to errors. The advent of data science and machine learning has transformed
    this field, offering new tools and approaches for handling and analysing large
    volumes of subsurface data. These technologies have revolutionised subsurface
    engineering by enabling more accurate predictions, faster decision-making, and
    improved resource management. This book provides a timely and comprehensive overview
    of the different applications of data science and machine learning in subsurface
    engineering, highlighting the potential of these technologies for unlocking new
    insights and value from subsurface data. By exploring the different'
