- pgno: 198
  md: 'reflected energy, as it determines the level of detail that can be observed
    in seismic images (Roy Chowdhury, 2011). However, several factors, including subsurface
    structure complexity, noise and interference in the data, low sensor resolution,
    seismic energy wavelength, and spatial sampling interval of the data acquisition
    system, frequently limit the resolution of seismic images (Ker et al., 2010).
    These constraints impede the efficiency of precisely interpreting the subsurface
    structures, resulting in costly exploration and production activity errors.


    Artificial intelligence (AI) has been increasingly used in the oil and gas industry
    to improve its activities in subsurface characterisation, reservoir engineering,
    and production (Otchere et al., 2022a). Recent advances in AI, notably computer
    vision, have shown promise in enhancing seismic image quality and limiting the
    impact of noise and interference. Through learning patterns and features in the
    seismic images and using this knowledge to fill in missing or impaired sections
    of new images, AI approaches can be utilised to improve the spatial resolution
    of seismic images. These approaches have the potential to overcome conventional
    methods’ limitations and offer more accurate and detailed images of subsurface
    structures.


    Several studies have applied AI techniques to improve the resolution of seismic
    images to improve subsurface interpretation activities. For example, Li et al.
    (2022) used a deep convolutional neural network (DCNN) to enhance low-resolution
    and noisy seismic images, demonstrating improved image quality and resolution
    for fault detection. (Otchere et al., 2022b) employed a DCNN to improve the seismic
    resolution of the Groningen field, resulting in a more accurate interpretation
    of subsurface faults. Picetti et al. (2019) utilised a generative adversarial
    network (GAN) to process low-quality seismic migrated images and improve the resolution
    of features. These studies demonstrate the potential of AI in overcoming the limitations
    of traditional methods and improving the resolution of seismic images.


    In summary, seismic image resolution plays a vital role in subsurface exploration
    and analysis. However, seismic imaging has inherent limitations regarding image
    resolution and quality, which might affect the accuracy and reliability of the
    resulting interpretation. AI techniques have the potential to improve seismic
    image resolution and quality using advanced machine learning algorithms, such
    as denoising and super-resolution techniques, and overcome the limitations of
    conventional techniques. Further research is thus required to optimise and validate
    the potential of AI completely and to explore its potential for automating the
    interpretation of seismic images.


    This study will demonstrate the application of a pre-trained DCNN on the Opunake
    field for seismic image resolution improvement and to improve the signal-to-noise
    ratio (SNR) that can be used as a valuable property in the seismic imaging and
    velocity modelling phases. Two image resolution DCNN'
