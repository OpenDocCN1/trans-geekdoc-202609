  md: 'with training a neural network directly on 3D seismic data, the Geoplat AI
    software was employed in this study to import the entire 3D seismic volume and
    the interpreted salts of the Groningen field. The software’s pre-trained DCNN,
    which is based on a computer vision-based model, was used. The model was trained
    on an extensive and diverse 3D synthetic seismic dataset image library created
    by fragmenting labelled images. These synthetic data were carefully designed to
    capture complex geological factors and imaging quality. These images were segmented
    using the DCNN model, which was initially trained to assign a label of 1 to salt-labelled
    images and a label of 0 to non-salt-labelled images, as illustrated in Fig. 8.2.
    The accurate segmentation of a synthetic volume fragment is shown on the left,
    while the predicted output created by the pre-trained neural network is shown
    on the right.


    The pre-trained DCNN model’s outstanding performance prompted its application
    to the Groningen Field’s actual dataset for automatic salt probability volume
    creation. The selected fragment size for the prediction was based on visually
    identifying salt tops and bottoms in the seismic volume. The resultant inline,
    crossline, and depth sections of the Groningen Field are displayed in Fig. 8.3.
    The ResU-net architecture framework, which has been pre-trained, is used to segment
    the 3D seismic images obtained from the seismic volume. Figure 8.4 illustrates
    the application framework of the DCNN for the creation of the salt probability
    volume. An additional signal gain was applied to handle low-quality seismic data,
    which amplifies and restores the regions with amplitude expression coefficient
    loss.


