    # 4.2 Machine Learning Model Application


    Cross-validation involves re-sampling input data from multiple subsets and assessing
    the model''s predictive performance in the overall dataset using a secondary subsets
    not utilised in the training process (Otchere et al., 2021a; Tarafder et al.,
    2021). This method may be used to minimise prediction errors on unknown data.
    The holdout cross-validation approach was used to randomly partition the data
    into 85:15 training and testing groups, representing 418 data points for testing.
    This approach guarantees that separate data points not observed by the trained
    model are used to validate the model leading to the avoidance of overfitting and
    selection bias. Several models were used in this research to effectively know
    the model that predicts mud loss with lower errors. The same out-of-sample data
    was used throughout this research to ensure that similar data points were used
    in all models.


    Hyperparameter tuning of the final model was performed to further improve the
    model''s performance. The BO algorithm, which is classed as a sequential model-based
    optimisation procedure, was used to improve the model (Tarafder et al., 2022).
    BO is a flexible and efficient approach that uses the Bayes Theorem to provide
    a rational mechanism for directing a global optimisation issue’s investigation
    to the extrema of objective functions. The algorithm works by iteratively training
    a Bayesian approximation probabilistic model of the objective function based on
    prior outcomes approximation.'
