    CaSO₄ ↔ Ca²⁺ + SO₄²⁻ (7.5)

    MgSO₄ ↔ Mg²⁺ + SO₄²⁻ (7.6)


    The mineral reaction considered in CO₂-LSWAG modelling for calcite and dolomite
    are:


    CaCO₃ + H⁺ ↔ Ca²⁺ + HCO₃⁻ (7.7)

    CaMg(CO₃)₂ + 2H⁺ ↔ Ca²⁺ + 2HCO₃⁻ + Mg²⁺ (7.8)


    The ion exchange considered in CO₂-LSWAG modelling is given as:


    SO₄²⁻ + 2CH₃COO⁻ X ↔ 2CH₃COO⁻ + SO₄⁻ X₂ (7.9)


