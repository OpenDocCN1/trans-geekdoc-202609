  md: 'Al-Jifri et al. (2021) develop two new empirical equations for predicting oil
    recovery factor in waterflooded heterogeneous reservoirs based on these parameters
    of water injection rate, permeability anisotropy, water viscosity, and reservoir
    heterogeneity with no proxy correlations currently existing for CO₂-LSWAG which
    this study strive to achieve. Furthermore, Roustazadeh et al. (2022) developed
    three regression-based models including the support vector machine (SVM), extreme
    gradient boosting (XGBoost), and stepwise multiple linear regression (MLR) and
    various combinations of three databases to construct machine learning (ML) models
    and estimate the oil and/or gas recovery factor (RF). The following authors (Aliyuda
    et al., 2020; Alpak et al., 2019; Chen et al., 2020; Ibrahim et al., 2022; Sharma
    et al., 2010; Tahmasebi et al., 2020) also applied ML algorithms in predicting
    hydrocarbon recovery factors from different reservoirs but not with regards to
    the present study with CO₂ LSWAG.


    In this study, a carbonate field model based on CO₂-LSWAG flooding was simulated
    using a compositional simulator with geochemical models incorporated, and then
    Multivariate Adaptive Regression Splines (MARS) and Group Method of Data Handling
    (GMDH) machine learning methods were used to develop proxy models for prediction
    of oil recovery factor. Therefore, this study advocates for the injection of low-salinity
    water alternating CO₂ as an EOR technique due to its high recovery factor for
    improving microscopic and macroscopic displacement efficiencies. The use of machine
    learning proxy models as prediction tools will also enhance the efficient full-field
    implementation of this technique in reducing the computational time associated
    with numerical simulations (Amar et al., 2021; Kalam et al., 2021) in carbonate
    reservoirs.


    The structure of this paper is organised as follows. Section 2 is the methodology
    that describes the use of a compositional simulator coupled with fluid flow and
    geochemical modelling, as well as machine learning tools. Section 3 is the results
    and discussion that analyses the currently proposed method and its comparison
    to the use of a conventional simulator to optimise operational conditions. Section
    4 concludes the study and spells out the major findings drawn from the present
    study.


    # 2. Methodology


    # 2.1 Modelling of CO₂-LSWAG


    This paper’s numerical method used a compositional simulator to generate various
    scenarios of the CO₂-LSWAG in a carbonate reservoir with SO₄'
