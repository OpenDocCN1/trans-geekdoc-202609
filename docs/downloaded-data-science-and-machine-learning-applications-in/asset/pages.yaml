  md: '# CHAPTER 8


    # Improving Seismic Salt Mapping through Transfer Learning Using A Pre-trained
    Deep Convolutional Neural Network


    # A Case Study on Groningen Field


    Daniel Asante Otchere,1,2,* Abdul Halim Latiff,1 Nikita Kuvakin,3 Ruslan Miftakhov,3
    Igor Efremov3 and Andrey Bazanov3


    # 1. Introduction


    The interpretation of seismic data is a critical aspect of geological exploration.
    It enables geologists and engineers to identify and delineate subsurface structures
    such as faults, reservoirs, and geological formations. However, traditional approaches
    to seismic interpretation, such as manual picking and horizon tracking, are laborious
    and time-consuming, particularly in areas with complex geology and numerous faults.
    Furthermore, these methods are prone to noise and other stratigraphic challenges,
    making them less reliable and accurate (Otchere et al., 2022c). Getting a reliable
    velocity model using


    1 Centre of Research for Subsurface Seismic Imaging, Universiti Teknologi PETRONAS,
    32610, Seri Iskandar, Perak Daril Ridzuan, Malaysia.

    2 Institute for Computational and Data Sciences, Pennsylvania State University,
    University Park, PA, USA.

    3 GridPoint Dynamics, 77 Hopton Road, London, SW162EL, United Kingdom.

    * Corresponding author: ascotjnr@yahoo.com'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'seismic salt imaging requires consistent interpretation analysis. However,
    the following restrictions may apply to traditional methods:


    +   1. Clearly delineated salt boundaries at lithological transition zones.

    +   2. Mapping complex salt build-ups require a great deal of time.

    +   3. Instead of using automatic picking, a significant amount of manual horizon
    interpretation is required.


    Salts are essential subsurface structures that significantly impact the geology
    of a region, and salt tectonics play a critical role in the storage of CO₂ gas,
    which is an essential part of the global energy transition journey (Duffy et al.,
    2022). The study of salts and their geological properties is of immense importance
    for the energy industry and our understanding of the Earth’s subsurface processes.
    The application of deep learning has revolutionised the oil and gas industry in
    the last decade, providing a new and efficient approach to seismic interpretation
    (Otchere et al., 2022c), reservoir engineering (Otchere et al., 2022a), and subsurface
    characterisation (Otchere et al., 2022b). This technology has significantly contributed
    to mapping and imaging subsurface structures, particularly salt structures, which
    are notoriously difficult to interpret due to their complex geometries and stratigraphic
    complexities. Compared to traditional seismic interpretation methods, deep learning-based
    algorithms offer several advantages, such as higher accuracy and faster processing
    times. Additionally, the ability of deep learning models to learn from large datasets
    and identify complex patterns makes them ideal for identifying subtle subsurface
    features that conventional techniques may miss. Consequently, applying deep learning-based
    algorithms in the oil and gas industry has grown tremendously in recent years.
    It is expected to continue to play a significant role in future subsurface characterisation,
    interpretation, and modelling.


    Seismic edge-detection algorithms have been widely used in the oil and gas industry
    to detect and interpret stratigraphic features in seismic data volumes. These
    algorithms have become increasingly popular due to their ability to extract subtle
    features in seismic data that may be indicative of subsurface structures (Chopra
    and Marfurt, 2007). They are particularly useful in areas where the subsurface
    is complex and difficult to interpret, such as in areas with numerous faults or
    where stratigraphic layering is intricate. Furthermore, edge-detection algorithms
    have been successfully integrated with machine learning techniques to improve
    the accuracy of interpretation results and reduce the time required for interpretation
    (Otchere et al., 2022c). These advancements have opened up new possibilities for
    the efficient and effective mapping and characterisation of subsurface structures,
    with'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'significant implications for the oil and gas industry. However, deploying the
    method to new fields gives inaccurate mapping interpretation. One way of boosting
    deep learning model performance in a new field is through transfer learning.


    In recent years, there has been a growing interest in using transfer learning
    to improve the accuracy of salt segmentation in seismic images. Transfer learning
    can significantly enhance our ability to identify and map subsurface salt structures,
    which can significantly impact the development of new energy resources and climate
    change mitigation. Using the specialised information learned in one context to
    solve the problems in another is known as transfer learning, which is a promising
    approach to address disparities in model prediction and ground truth (Li et al.,
    2020; Pan and Yang, 2010). The idea is to get insights into a problem using a
    plethora of available interpreted data when the initial model prediction of a
    comparable situation for which less information is not desirable. This calls for
    attention to the distinction between the model prediction and ground truth, reflected
    in the different distributions of their features and boundaries. In particular,
    the feature-based transfer learning strategy known as “domain adaptation” is a
    potential option (Ben-David et al., 2007; Pan et al., 2011). To do this, it first
    determines a feature space in which source domain data retain their intrinsic
    structure while minimising distribution disparity across domains. Transfer component
    analysis is a pioneering technique described by (Pan et al., 2011). Minimisation
    of maximum mean discrepancy (MMD) has emerged as a popular method for domain adaptation
    in machine learning. This method aims to learn transferable features between different
    domains while preserving the variation in the source domain. By representing the
    feature space as a reproducing kernel Hilbert space (RKHS), MMD minimisation enables
    the computation of distances between probability distributions, facilitating knowledge
    transfer from the source to the target domain. In this way, MMD-based domain adaptation
    has been successfully applied to various problems, including image classification,
    object detection, and natural language processing. An implementation with multiple
    kernels has been developed using this method (Lixin Duan et al., 2012).


    Deep learning models have revolutionised the field of machine learning by enabling
    computers to automatically learn complex representations of data. The ability
    to learn features from data has made deep learning particularly useful in domains
    where large amounts of data are available, such as computer vision and natural
    language processing. Recently, there has been an increasing interest in combining
    deep learning with transfer learning, which aims to leverage knowledge from related
    tasks to improve performance on new tasks. To this end, Ghifary et al. (2014)
    introduced a deep adaption neural network (DaNN) that includes a multi-modal dependency
    (M-MD) term in the loss'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'function to minimise MMD while maintaining variation in the source domain.
    This approach has shown promising results in various applications, including image
    classification and speech recognition.


    Domain adaptation has become an increasingly popular area of research in recent
    years as more and more problems arise with data distribution differences between
    the source and target domains. Among the various techniques developed to address
    these issues, domain-adversarial neural networks (DANN) have shown great potential
    (Ganin et al., 2016). The key idea behind DANN is to build a network that can
    predict the source domain problem while avoiding the discrimination between the
    source and target domains. This is achieved by using an adversarial loss function
    that helps minimise the difference between the feature representations of the
    source and target domains. The use of DANNs has been demonstrated in several applications,
    including image recognition, natural language processing, and speech recognition.


    Shi et al. (2019) defined the challenge of interpreting and extracting salt boundaries
    as a 3D image segmentation problem and assessed a deep CNN technique using an
    encoder-decoder architecture. The authors designed a data generator to train the
    model that extracts randomly positioned sub-volumes from a large-scale 3D training
    data set, followed by data reinforcement. The binary classification of sub-volumes
    into salt and non-salt was used as ground truth labels by thresholding the velocity
    model. These were then fed into the network, resulting in numerous iterations
    of network training. This approach enabled the network to learn salt features
    effectively, leading to more accurate salt boundary detection in seismic volumes.
    Their model, when validated, automatically extracted minor salt properties from
    3D seismic sections. Liu et al. (2019) also used a Squeeze-Extraction Feature
    Pyramid Network (Se-FPN) for salt deposits image segmentation. They used SeNet
    as a backbone to implicitly learn to suppress unimportant regions while highlighting
    key features. The authors suggested an enhanced FPN to combine multiscale information,
    where hypercolumns were added to the network to combine information from multiple
    scales. The proposed Se-FPN, when deployed in the TGS Salt Identification Challenge,
    got high-quality segmentation with a Mean Intersection over Union (MIU) of 0.86.
    To overcome the discrepancies between model fault prediction and ground truth
    (Yan et al., 2021), used transfer learning to improve the prediction performance
    of a CNN pre-trained with synthetic labels. The authors retrained the model using
    actual field seismic interpretations. They used random sample consensus (RANSAC)
    to automatically obtain and categorise actual seismic samples. This approach resulted
    in an improvement in fault detection accuracy. The existing literature provides
    a theoretical foundation for our objective, which is to leverage'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'transfer learning to enhance the detection of salt bodies and evaluate the
    effectiveness of the pre-trained CNN. These prior investigations demonstrate that
    transfer learning can be used to improve the accuracy of CNNs for image recognition
    tasks, even when the target dataset differs from the source dataset. The domain
    shifts (actual-predicted discrepancy) between the predicted and ground truth can
    be reduced to an acceptable level in a predetermined feature space using domain
    adaptation through transfer learning.


    This study will demonstrate the application of transfer learning using actual
    field interpretation to a CNN pre-trained with synthetic labels to generate salt
    probability models that can be used as a valuable property in the seismic imaging
    and velocity modelling phases. Transfer learning and deep learning techniques’
    object and edge detection have demonstrated promising success in various domains,
    making them an appealing approach for seismic salt mapping. The use of these techniques
    can potentially enhance the detection of subsurface salt bodies and improve the
    accuracy of salt mapping, resulting in more efficient and effective exploration
    and production of hydrocarbon reservoirs. Hence, the main contributions of this
    research are:


    +   1. *Improved salt segmentation accuracy:* Transfer learning can significantly
    enhance our ability to identify and map subsurface salt structures in seismic
    images. Using semantic segmentation to improve salt probability volume by retraining
    the model on a labelled dataset, it can learn to recognise salt structures with
    greater accuracy and efficiency, which is critical for the energy industry and
    our understanding of the Earth’s subsurface processes.

    +   2. *Cost and time savings:* Salt segmentation in seismic images is time-consuming
    and labour-intensive, requiring significant expertise and resources. By using
    transfer learning to automate this process, we can save time and reduce costs
    while improving the accuracy of the segmentation.

    +   3. *Enhanced data analysis:* Accurate segmentation of salt structures in seismic
    images is essential for various applications, including hydrocarbon exploration,
    CO₂ storage, and geohazard assessment. By improving the accuracy of salt segmentation,
    we can enhance our understanding of the subsurface geology and make more informed
    decisions about energy exploration and production.

    +   4. *Potential for future research:* Using transfer learning for salt segmentation
    in seismic images is a relatively new area of research with significant potential
    for future exploration and development. By demonstrating the effectiveness of
    this approach, we can inspire new research in the field and help to advance our
    understanding of subsurface processes and the energy transition journey.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'These contributions will help reduce the time and resources seismic interpreters
    spend interpreting seismic features. The findings in this study are of great importance
    for the energy industry and the broader scientific community, as they provide
    new insights into the use of transfer learning for improving the accuracy of salt
    segmentation in seismic images. The results of this study will also highlight
    the potential of this approach for developing new energy resources and mitigating
    climate change by improving our ability to identify and map subsurface salt structures
    accurately.


    # 2. Method


    # 2.1 Collection and Description of Data


    For this work, the Groningen seismic field data was selected as the case study.
    The system unit was a Windows 10 Operating System (OS) with the next generation
    AMD Radeon Pro™ and the highest-performing NVIDIA Quadro® professional graphics
    capable of 2-petaFLOPS tensor performance. A single NVIDIA RTX 8000 GPU and quadruple
    Intel (R) Xeon (R) W-2223 i5 CPU running at 3.60 GHz, with 32.0 GB of DDR4-2666
    MHz DRAM, were used to run the study. This research used a pre-trained DCNN model
    trained using synthetic and real data. The proposed approach consisted of two
    main parts, generating a salt probability model and improving the model output
    through transfer learning, as illustrated in Fig. 8.1. The optimised DCNN model
    for salt body probability prediction can be reused to map new salt bodies, thus
    enhancing interpretation efficiency. The model estimation section of the workflow
    represents an end-to-end model that automatically can map salt bodies after selecting
    several parameters.


    # 2.2 Deep Convolutional Neural Network in Salt Mapping and Post-processing


    For a long time, seismic data has become increasingly important in oil and gas
    exploration due to the valuable information it provides about subsurface structures.
    Seismic data is usually obtained by sending a wave signal into the ground and
    measuring the reflected signals that bounce back from different subsurface layers.
    This data is processed and interpreted to create seismic images of the subsurface
    structures. With the advancement in exploration technology, 3D seismic data volumes
    have become more common, providing a more detailed and accurate representation
    of the subsurface geology. However, the large volume of data generated by this
    technology presents a significant challenge for interpretation and analysis, necessitating
    the development of more efficient and effective techniques. To reduce the computation
    cost associated'
