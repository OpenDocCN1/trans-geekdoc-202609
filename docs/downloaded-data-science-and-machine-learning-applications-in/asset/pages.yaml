- pgno: 17
  md: '# # CHAPTER 1


    # ## Introduction


    > > “Data is the new oil”—this buzz phrase has become a ubiquitous adage in today’s
    digital age. Data science and machine learning have become indispensable tools
    for extracting insights and value from vast amounts of data. The field of subsurface
    engineering is no exception to this trend, and this book brings together a collection
    of chapters from experts in this field, exploring various data science and machine
    learning applications in subsurface engineering.


    In this book, we delve into the potential of these technologies for subsurface
    engineering, including topics such as data-driven reservoir characterisation,
    machine learning in drilling operations, and computer vision application in seismic
    image processing and interpretation. The book is divided into several chapters,
    each offering a unique perspective and case studies on the different applications
    of data science and machine learning in subsurface engineering.


    Chapter 2 focuses on predicting drilling fluid loss in the Marun oil field using
    machine learning models. The research begins by assessing the importance of input
    features through model agnostic metrics. Once a suitable dataset is established,
    several machine learning models will be used, with the best-performing one optimised
    using the Bayesian Optimisation algorithm. This research aims to generate new
    insights into the generalisation of individual features to explain the target.
    The study’s main contributions are twofold. Firstly, it provides a global explanation
    of variables in mud-loss prediction using explainable artificial intelligence
    (AI). Secondly, it develops a machine learning workflow that utilises explainable
    AI to enhance drilling fluid lost circulation prediction. Overall, this research
    offers valuable insights into applying machine learning to subsurface engineering,
    and the potential benefits of explainable AI in improving drilling fluid loss
    prediction.


    Chapter 3 describes a study aimed at developing an AI-based model that can predict
    porosity and producible pore volume fraction using wireline logs and NMR-measured
    total porosity and free fluid index. Wireline logs are'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'more economical and time-saving than running nuclear magnetic resonance (NMR)
    logs in all wells, making it a desirable field-scale technique for quantitative
    porosity and pore volume fraction measurement. The study aims to provide a more
    efficient and accurate method for reservoir characterisation and management, especially
    given the current demand for inexpensive and reliable techniques in the face of
    high oil prices. By developing an accurate prediction model, the study hopes to
    assist in improving reservoir management and decision-making processes.


    Chapter 4 delves into the use of data-driven machine learning techniques to determine
    compressional and shear sonic logs, which are crucial in subsurface engineering.
    The authors discuss the importance of using relevant input variables to train
    supervised machine learning models, as the model’s performance can degrade if
    irrelevant data or essential features are omitted. The authors identify and select
    input features based on their demonstrated impact on Vs and Vp measurements to
    address this issue. The study is distinguished from earlier research by its multi-output
    prediction of Vp and Vs, with Vp not being used as an input for Vs prediction.
    The authors use data from three wells in the Volve oil field to evaluate the relevance
    of input features, and different machine learning models are employed to predict
    Vp and Vs. The authors then use statistical metrics to determine the best-performing
    model, which is optimised using the Bayesian Optimisation (BO) algorithm.


    Chapter 5 explores the concept of virtual flow metering (VFM) in the oil and gas
    industry and focuses on data-driven solutions. VFM technology relies on analytical
    or data-driven models for real-time calculations of phase production. The chapter
    first introduces the classification of VFM based on modelling paradigms, including
    the first principle and data-driven VFMs. The applications of data-driven modelling
    in VFM systems are then discussed, emphasising the models’ features, predicted
    variables, input data, and respective papers. The chapter also describes the components
    and methodology used to develop data-driven virtual flow meters using the cross-industry
    standard process for a data mining framework. An implementation of this methodology
    is presented to estimate flow rate and water cut prediction from the electrical
    submersible pump’s sensor data. Finally, the chapter discusses the real operational
    experience reported in the literature using data-driven models. Overall, this
    chapter provides a comprehensive overview of the concept of VFM and highlights
    the potential applications of data-driven solutions in VFM systems in the oil
    and gas industry.


    Chapter 6 presents a novel approach to optimising inflow control valve (ICV) settings
    to increase oil production using machine learning techniques. The chapter proposes
    a data-driven approach to estimate the injected water'
  merge: -1
  img_proc: true
