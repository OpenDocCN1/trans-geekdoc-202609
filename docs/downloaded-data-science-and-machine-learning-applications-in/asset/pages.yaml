  md: 'important to understand that these metrics each provide a different perspective
    on the quality of the enhanced or denoised image.


    PSNR is a simple metric that measures the ratio of the maximum possible power
    of a signal to the power of the noise that corrupts the signal. It is generally
    used to compare the original image to the processed image in order to assess the
    quality of image enhancement and denoising methods. A higher PSNR value indicates
    a higher quality image with less noise. From the results in Fig. 9.7, the mean
    resolution model achieved the highest PSNR compared to the super-resolution model.
    This metric is easy to understand and compute. However, it cannot give a comprehensive
    evaluation of an image’s quality as it only considers the values and does not
    take into account the visual perception.


    SSIM takes into account the mean, standard deviation, and cross-covariance of
    the image pixels and gives an understanding of the structural similarity between
    two images. Based on the data it takes into account when computing, SSIM is a
    more reliable metric for evaluating image quality than PSNR, but it requires more
    computation than PSNR. This metric is based on the idea that the human visual
    system is highly adapted to recognise small changes in structural information,
    such as edges and textures, rather than small changes in pixel intensities. It
    is typically used as a measure of image quality in signal processing applications.
    However, it cannot give a comprehensive evaluation of an image’s quality as it
    only considers the values and does not take into account the visual perception.
    As such, it is imperative to combine it with other metrics like the PSNR. A higher
    SSIM value indicates a higher quality image with less noise. As such, the mean
    resolution model achieved the highest SSIM compared to the super-resolution model,
    which is shown in Fig. 9.8. The SSIM is usually measured between 0 and 1. However,
    for this study, the original seismic volume was used as a standard for comparison.
    As such, the initial SSIM was 1, whiles the improvements gained by the models
    were estimated between 0 and 1 to capture the increased SSIM. The mean resolution
    model achieved an improved SSIM of 0.4, whiles the super-resolution resulted in
    an SSIM of 0.31. This result shows that not all high resolution images should
    be classified as the best model. Some enhancements may result in the loss of important
    geological structures through false improvements, as typified by the SSIM results.


    When evaluating image enhancement or denoising methods, PSNR, SSIM, and SNR can
    be used together to provide a more comprehensive image quality evaluation. For
    example, a method that provides a high PSNR value and a high SSIM value is likely
    to produce an image that is both visually vivid and accurate in terms of preserving
    the original information. Additionally, a high SNR value means that the signal
    is stronger than the noise, and it indicates that the denoising method performed
    well in removing the noise. It is also important to note that even though the
    PSNR and SSIM values may'
