  md: 'by estimating Phi and compressional wave velocity from seismic attribute and
    well logs in an Iranian oil field. The PNN-Gaussian function selection documented
    the most reduced error, most noteworthy correlation, and least computational time
    as compared to the others by using three unique datasets for testing, training,
    and validation.


    Evaluation of SVM to ANN and Type-2 Fuzzy Logic (TFL) was conducted by Anifowose
    et al. (2013) to help improve the forecast of K in a carbonate reservoir. The
    prediction was done by the use of a 3D seismic signal and wireline logs as input
    parameters. The results showed that combining seismic signatures and wireline
    logs enhanced the training performance of the SVM and ANN models. Sebtosheikh
    and Salehi (2015) led a test impact of a limited training dataset in estimating
    the lithology from transformed seismic characteristics and directed log information
    in a heterogeneous carbonate reservoir using the SVM technique, the outcomes of
    which demonstrated its robustness in the face of limited data. It was also discovered
    that reducing the training and testing data sizes did not affect the presentation
    of SVM in lithological prediction. To improve the prediction of the spatial distribution
    of acoustic impedance, Phi, and saturation for a gas field, Qiang et al. (2020)
    proposed a new model to help improve the reservoir quality prediction from the
    integration of well logs, core and seismic inversion data. The authors employed
    the use of Sequential Gaussian Simulation (SGS) and Gaussian Indicator Simulation
    (GIS), which are both statistical algorithms to estimate the spatial distribution
    of the reservoir properties. In order to improve the robustness of the model,
    it was calibrated to post-stack seismic inversion to establish a relationship
    utilising SVM, Radial Basic Function (RBF) kernel, and well logs. Finally, SVM
    produced a good relationship between the thin lithofacies layers and seismic waveforms,
    resulting in a better prediction of the facies’ spatial distinction. Also, there
    was a good correlation of Phi and Sw prediction utilising SVM to facies classification
    with superior reservoir zones. To show the robustness of SVM, Wang et al. (2019)
    applied SVM to identify depositional microfacies from wireline logs. The SVM model
    was trained using integrated depositional microfacies obtained via core sample
    observation and well logs. The authors developed a quantifiable discrimination
    SVM model and compare it to standard results, which aided in the prediction of
    depositional microfacies in uncored wells with up to 84% accuracy.


    # 7. Hybrid Models of AI for Petrophysical Property Prediction


    AI has proven to improve the accuracy of reservoir property prediction as compared
    to conventional mathematical approaches, yet the need to further develop its effectiveness
    is still sought after (Otchere et al., 2021a). The various improvements to AI
    model accuracy and reducing processing time'
