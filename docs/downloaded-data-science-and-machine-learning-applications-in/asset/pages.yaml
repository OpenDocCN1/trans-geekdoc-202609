  md: 'and carboxylate ion exchange. The assumptions made in modelling the CO₂-LSWAG
    in CMG compositional simulator under miscible conditions are:


    +   1. Carboxylate ion exchange was solely responsible for the wettability alteration.

    +   2. Multiphase multicomponent flow equations and EOS flash calculations were
    fully coupled to geochemical reactions.

    +   3. Relative permeability sets of oil and water are altered by a scaled carboxylate
    ion exchange equivalent fraction.

    +   4. Carboxylate ion exchange is also dependent on mineral dissolution and precipitation
