  md: 'classification was based on the six different facies group from the North Sea
    turbidite reservoir, taking into consideration the clay content, grain size, and
    bedding configuration. After data filtering, the authors used a neural network
    and various multivariate statistical techniques to classify the lithofacies. The
    Mahalanobis Linear Discriminant Analysis (MLDA), Probability Density Function
    (PDF) classifier, and a Multilayer Feed-forward design with Back-propagation (MLFN-BP)
    mass adaptation methodology were used based on their ability to establish a link
    between facies and their physical properties. The results emphasised the use of
    PDF for the identification of new facies using holdout cross-validation; however,
    the MLFN-BP classifier was the best algorithm for dealing with the multidimensional
    cluster boundary. In terms of model performance, Otchere et al. (2021a), suggested
    there would have been an improvement if a stronger selection technique was employed
    to select only pertinent input variables and outlined a selection bias for their
    model. To also increase the performance of their model, the rock physics model
    would have been the best conditioning tool for the input well log data. Ameur-Zaimeche
    et al. (2020) conducted additional research on the feed-forward neural network
    using the MLP to reconstruct the lithofacies breaks in the Sif Fatima oil field
    in Algeria. Linking MLP to cluster analysis, their outcomes showed that MLP is
    better suited for forecasting the non-cored lithofacies.


    Tang (2008) defined carbonate lithofacies with some well logs using a Probabilistic
    Neural Network (PNN) by analysing the multidimensional correlation between the
    variables. Because of its ability to analyse the multidimensionality that exists
    between well logs and distinct facies, the PNN outperformed discriminate analysis
    and multi-logistic statistical algorithms. To assess the reliability of the PNN
    lithofacies prediction, an integration of two log lithology indicators and the
    model was used to map zonally using simple kriging. There was a good correlation
    between the zonal facies map with the conceptual reservoir model which indicates
    a good reservoir modelling and flow simulator. Al-Mudhafar (2017b) used well logs
    to investigate the use of the Kernel Support Vector Machine (KSVM) to model the
    distribution of lithofacies. Because of its ability to recognize distinct classes
    with a decision function defined by additional subgroups of supporting vectors,
    the author chose KSVM. To further validate the model, it was cross-validated using
    the known lithofacies. The validation yielded a 99.55% accuracy using the KSVM
    algorithm. Also in recent years, there has been increasing documentation of improved
    facies and lithology analysis (e.g., Asante-Okyere et al., 2020b; Otchere et al.,
    2022b; Shen et al., 2019; Xie et al., 2021).'
