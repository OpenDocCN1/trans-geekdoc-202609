    # 3. Results and Discussion


    # 3.1 Production and Well Data of the Study Area


    The Jubilee Field is located in Western Region, 60 km offshore, between the Deepwater
    Tano and West Cape Three Points blocks, off the coast of Ghana. Figure 11.2 shows
    the Jubilee concession and payout, respectively. The field lies within the tropical
    climatic zone between latitude 4.492°N and longitude 2.916°W. The Jubilee Field
    appraisal and development programme began at the end of 2008 with the drilling
    of the Odum, Mahogany, and Heydua wells. The field’s recoverable reserves are
    estimated to be more than 370 million barrels, with an upside potential of 1.8
    billion barrels. It is located at a water depth of 1100 m. The Jubilee Field was
    developed through an FPSO (floating production storage and offloading system)
    with a target plateau oil rate of 120,000 BOPD, water injection capacity of 230,000
    BWPD, and gas export and injection capacity of up to 160 MMscf/d (Schempf, 2011).
    Subsea gathering receptacles are located below the riser base to receive production
    from wells for onward transportation to an FPSO for processing. Compressors are
    installed on the FPSO to process produced gas for delivery to an onshore gas processing
    facility. Part of this processed gas is injected at the riser base for intermittent
    subsea boosting.


    The obtained production data used consisted of daily gas production (MMSCF/D),
    BOPD, cumulative oil production (MMSTB), Tubing Head Pressure (psig), Flowing
    Bottom Hole Pressure (psia), and number of days of production.'
