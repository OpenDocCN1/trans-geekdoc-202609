    The performance of the extra tree model is attributed to the bias-variance concept
    used to build this model. The explicit randomisation of the cut-point and features
    combined with ensemble averaging can reduce variance more strongly than the weaker
    randomisation techniques employed by other algorithms. Aside from having similar
    advantages as Decision Trees based on consistency for universal generalisation
    and approximation, Extra Trees additionally give resilience regarding gross model
    errors because outliers affect its predictions slightly and locally. When the
    input features are significantly more than the random splits, Extra Trees potentially
    outperform Decision Trees relating to computational efficiency while resisting
    irrelevant input features.


    # 5.2 Model Agnostic Results


    Permutation importance based on the XGBoost model was computed to evaluate the
    importance of and analyse the effect of multicollinearity on the input variables.
    The results in Fig. 2.6 show that the pump and pore pressures highly correlate
    to the prediction of mud loss. The results indicate that permuting an input feature
    reduces the model''s accuracy by, at most, 0.3, suggesting that some of the inputs
    are relevant. However, drilling time, hole size, meterage, WOB, and MFVIS do not
    offer any improvements to the model prediction. This result is compared with the
    feature importance output from the XGBoost model shown in Fig. 2.7. The discrepancy
    in the result indicates the importance of model agnostic that can give an inference
    into causality. This inference is necessary because correlation does not mean
    causation; hence, feature selection techniques based on correlation may not entirely
    improve model performance.'
