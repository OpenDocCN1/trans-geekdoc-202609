  md: '+   7. The model was trained using the Adam optimiser with MAE as the loss
    function.

    +   8. The model was trained using early stopping to prevent overfitting.


    Long Short-Term Memory (LSTM) and Gated Recurrent Unit (GRU) models are types
    of Recurrent Neural Network (RNN) models that are particularly well-suited for
    sequential data such as time series, speech, and text. A GRU model is similar
    to an LSTM model but has fewer parameters, which can be useful when working with
    limited data or computational resources. The key feature of GRU and LSTM is the
    ability to remember information over a more extended period of time by using gates
    to control the flow of information in and out of the cell. This model type can
    be useful when working with sequential data where the order of the data is essential.
    However, this model type can be computationally intensive and requires a large
    amount of data for training. To build the GRU and LSTM model for this study, the
    following steps were taken:


    +   1. The input data was transformed into a suitable format for GRU/LSTM, usually
    in the form of a 3D array where the first dimension represents the number of samples,
    the second dimension represents the time steps, and the third dimension represents
    the number of features.

    +   2. The model was composed of one or more GRU/LSTM layers, which are responsible
    for processing the input data and extracting features.

    +   3. The output of the GRU/LSTM layers was then passed through one or more fully
    connected layers to make the final predictions.

    +   4. The model was then trained using the training dataset and evaluated using
    the holdout dataset.

    +   5. The model was fine-tuned by adjusting the number of layers, the number
    of neurons in each layer, and the dropout rate to achieve the desired level of
    performance.

    +   6. The model was trained with regularisation techniques such as dropout and
    early stopping to prevent overfitting.


    # 3.3.2 Building a Hybrid Stacked Ensemble Model


    A hybrid ensemble model is a combination of multiple models working together to
    improve the overall performance of the model. A hybrid ensemble model of Extra
    Trees, Random Forest, and XGBoost was built using stacking in this case. Stacking
    is a technique where the predictions of the base models (Extra Trees, Random Forest,
    and XGBoost) are used as input to train a meta-model, which makes the final prediction.
    The base models were trained on the same dataset, and their predictions were combined
    into a single array,'
  merge: -1
  img_proc: true
