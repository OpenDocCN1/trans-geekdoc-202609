- pgno: 83
  md: '5. *Reduction in Variance (RIV)*: RIV is a technique used for regression problems.
    This method uses the traditional variance formula to select the optimum split.
    The split achieving the lowest variance is chosen as the criterion for splitting
    the data:


    $Variance = \frac{\sum (X - \bar{X})^2}{n}$ (4.8)


    The mean of the values is shown as $\bar{X}$. X is the actual value, and n is
    the number of values.


    6. *Chi-Squared Automatic Interaction Detector (CHAID)*: CHAID is a tree classification
    approach that determines the statistically significant differences between sub-nodes
    and the parent node. The sum of squares of the standardised discrepancies between
    the observed and predicted frequencies of the target is used to calculate it.
    CHAID employs the binary target variable ‘Success’ or ‘Failure’ by performing
    two or more splits. The greater the Chi-Square value, the greater the statistical
    significance of discrepancies between the sub-node and Parent node. Chi-squared
    is denoted mathematically as:


    $x^2 = \sum \frac{(O - E)^2}{E}$ (4.9)


    where $x^2$ represents the obtained Chi-Square, O is the observed score, and E
    denotes the expected score.


    These criteria will be used to calculate each attribute selection value. Each
    value is ranked, while the characteristics are orderly put in the tree. The attribute
    with the highest value regarding knowledge gain is at the root. The categorical
    output is assumed when utilising IG as a criterion, whereas GI assumes continuous
    attributes. CART models are simple to understand since they result in precepts,
    but one main disadvantage is the practical possibility of overfitting. Overfitting
    generally happens when CART builds many branches due to outliers and irregularities
    in data, but it can be minimised using the pre- and post-pruning approaches. Pre-pruning
    terminates tree construction early, and it is preferable not to split a node if
    its measure of purity falls below a certain threshold. However, deciding on an
    acceptable stopping point is challenging. Post-pruning begins by going deeper
    into the tree to construct an entire tree. If the tree exhibits overfitting, pruning
    is performed as a post-pruning phase. Cross-validation is employed to determine
    if extending a node would improve or not to evaluate the efficacy of pruning.
    If there is an improvement, extending that node can be done. However, if it indicates
    a degraded performance, the node should not be extended and changed to a terminal
    node (Breiman, 2001; Gordon et al., 1984).'
