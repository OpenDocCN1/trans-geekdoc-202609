    Table 12.2 shows a collation of some of the most widely used correlations for
    predicting the mean void fraction and structure velocity. These empirical correlations
    developed on the basics of slip-ratio and drift-flux model are semi-empirical
    and have proven to be robust and easily scalable, showing good performance over
    a wide range of fluid and flow parameters (Woldesemayat and Ghajar, 2007; Godbole
    et al., 2011). For this reason, the existing correlations considered in this study
    are limited to slip-ratio and drift-flux correlations for both the mean void fraction
    and the structure velocity. The performance of these correlations is evaluated
    using the test data for this study in Section 5.


    # 3. Methodology


    The sequential procedure for data processing and model development in this study
    are data acquisition and sourcing, data pre-processing, model development, hyperparameter
    tuning and model evaluation, and validation. All analysis was carried out in the
    Python environment using open-source libraries; Pandas, Numpy, Matplotlib, and
    Seaborn for data manipulation and visualization and Keras and Sklearn for predictive
    modelling.


    The experimental data for this study was sourced from previous studies as elaborated
    in Section 2. Data pre-processing and feature engineering encompasses all the
    steps taken to prepare the data for optimal model development and evaluation.
    The input parameters referred to as features and output parameters referred to
    as target values in this study were identified (Fig. 12.2). Correlation analysis
    is utilized to identify the magnitude of the relationship between input variables
    and target variables. This helps in selecting the most relevant variables for
    model development, eliminate irrelevant variables to reduce noise, avoid multicollinearity,
    and improve the overall performance of the model. Prior to model development,
    the data was split into training and test data for model development and model
    evaluation, respectively. The same number of data were used to train and test
    all the ML algorithms considered in this study. The supervised learning algorithms
    utilized in this study are Multiple Linear Regression (MLR), Polynomial Regression
    (PR), Random Forest (RF), Support Vector Regression (SVR),'
