    # 6.3 Model Deployment


    After the successful evaluation of the BO-ET model, the model was retrained with
    all data from Well A and Well B. The retraining was necessary to ensure that the
    model learns from all the data sets. The BO-ET model was successfully deployed
    on Well C to predict Vs and Vp from the wireline logs. Figure 4.12 shows the wireline
    plot of the predicted Vs and Vp logs where the top reservoir is indicated at a
    depth of 3,570.6 m. The reservoir has three different formation water salinity
    in the three different formations. Based on observations made in the hydrocarbon-bearing
    zone, the predicted log within that interval was of high interest. The sensitivity
    towards fluid presence was adequately predicted for all three formations confirming
    the robustness of the model. This result demonstrates the appropriateness of the
    model for predicting Vs and Vp in similar formation types.


    # 7. Conclusions


    This study demonstrated the use of data-driven domain knowledge and an optimised
    Extra-Trees model for predicting shear and compressional sonic logs in wells that
    they are absent. This approach has been found to outperform empirical correlations
    that rely on the compressional sonic log to predict the'
