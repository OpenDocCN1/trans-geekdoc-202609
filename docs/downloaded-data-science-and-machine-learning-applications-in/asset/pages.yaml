  md: 'where S denotes the present state, and Pi is the probability of an event i
    occurring in a node of state S. Entropy for multiple parameters is expressed mathematically
    as:


    $E(S,Y)=\sum_{n\in Y}P(n)E(n)\quad(4.4)$


    where Y represents the selected parameter.


    2. *Information Gain (IG)*: IG is a numerical attribute that quantifies how efficiently
    a specific attribute distinguishes training samples according to their target.
    Building a decision tree is to identify a characteristic with the most considerable
    information gain and the lowest entropy. Entropy decreases as a result of information
    gain. Based on the specific attribute values provided, it calculates the difference
    between the data''s entropy before splitting and the average entropy after splitting.
    IG is denoted mathematically as:


    $IG(S,Y)=E(S)-E(S,Y)\quad(4.5)$


    3. *Gini Index (GI)*: The Gini index may be considered an objective function to
    assess splits in a dataset. It is computed by subtracting the total of each class''s
    squared probability from one. GI prefers large divisions that are simple to implement,
    whereas information gain prefers fewer divisions with unique values. The Gini
    Index only performs binary splits by employing the binary target variable ‘Success’
    or ‘Failure’. A high GI value indicates greater inequality and heterogeneity.
    GI can be mathematically denoted as:


    $GI=1-\sum_{i=1}^{n}(p_i)^2\quad(4.6)$


    4. *Gain Ratio*: IG is biased towards choosing attributes with many values as
    root nodes. It means it prefers the attribute with a large number of distinct
    values. Gain ratio, a variation of IG that minimises bias, is typically the best
    option compared to IG. The gain ratio solves the issues related to IG by considering
    the number of branches that might occur before splitting. It adjusts IG by considering
    the inherent information of a split. The gain ratio is expressed as:


    $GI=\frac{E(S)-E(S,Y)}{\sum_{j=0}^{K}w_j\log_2 w_j}\quad(4.7)$


    where K refers to the number of subsets produced by the split, and j, refers to
    a subset.'
