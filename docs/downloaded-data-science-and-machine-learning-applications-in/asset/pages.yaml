    recovery rates in reservoirs with highly viscous crude oil.


    In their experimental study, Al-Abri et al. (2019) investigated the effect of
    hybrid injection of immiscible CO₂ and smart water on sandstone core samples.
    The study found that the synergy between gas injection and the various ions present
