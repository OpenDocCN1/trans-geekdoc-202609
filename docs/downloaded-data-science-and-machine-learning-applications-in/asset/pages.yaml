  md: '# 2. Empirical Models for Petrophysical Property Prediction


    Reservoir study using petrophysical analysis is one of the useful tools because
    it provides the basic input data for integrating reservoir characterisation and
    reservoir resource evaluation. The empirical models for reservoir characterisation
    are represented by the correlational relationship between the input and output
    variables represented by mathematical expressions. These empirical models are
    vital due to their potency to correlate measurable variables to important variables
    which may be difficult to determine. In the light of this, Reza et al. (2017)
    highlighted the importance of well log (input variable) analysis and its application
    in earth science and relation to reservoir property prediction (output variables).
    They further commented on the application in the various stages of an oilfield
    and their variation to different methods used to determine reservoir properties.
    The petrophysical analysis embodies the prediction of the reservoir parameters
    (which include but are not limited to porosity (Phi), permeability (K), water
    saturation (Sw), and lithology). To date, the reliable way of determining the
    true reservoir properties is laboratory measurement (porosity, permeability, grain
    density, and saturation) on core samples and well-test interpretation. However,
    these core samples are only limited to small intervals due to the cost involved
    in acquiring them. Therefore, the determination of the reservoir properties for
    the well interval relies on the interpretation of the vast petrophysical well
    logs acquired. The interpretation requires a systematic step in processing the
    well log data. Due to this, the results of each step always have an impact on
    the subsequent step.


    # 2.1 Porosity and Permeability Prediction Models


    According to Mohaghegh et al. (1996), the traditional method for estimating reservoir
    parameters has adopted a linear or nonlinear relationship among individual log.
    They highlighted in their study that the traditional approach is limited to assumptions,
    constants, and heterogeneity of the reservoir but Nelson (1994) in his paper reviewed
    some of these problems in detail. The traditional approach of estimating Phi and
    K from core samples are the use of models such as the Kozeny-Carman equation (Kozeny,
    1927; Carman, 1937 and 1956), Wyllie and Rose model (Wyllie and Rose, 1950), and
    Neutron-Density relation for Phi estimation (Gaymard and Poupon, 1968), Timur
    correlation for K estimation (Timur, 1968) from wireline logs. The empirical relation
    used to estimate Phi from log response (density and neutron log) yields a total
    porosity (PhiT) of the formation. This PhiT is not effective to use in reservoir
    characterisation due to reservoir heterogeneity and issues such as the presence
    of an isolated pore network. Mavko and Nur (1997) underlined the fact that the
    Kozeny-Carman’s relation observed low Phi'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'where there is a decrease in K with a rapid decrease in Phi. To account for
    this, Schwartz and Kimminau (1987) introduced a consolidated model to survey the
    effect of multiple accumulations of cementation on Phi. Bourbie et al. (1987),
    also proposed a solution by introducing a variable power on the Phi in the Kozeny-Carman
    equation (Eq. (10.1)).


    $K = B \phi^n d^2$ (10.1)


    where K is the permeability, φ is the porosity, d is the diameter, and n is the
    variable power introduced by Bourbie et al. (1987). The n varies from 3 and 7–8
    for higher porosities and lower porosities, respectively. With all the solutions,
    Mavko and Nur (1997), proposed a solution by accounting for the porosity percolation
    threshold. Their research included the percolation threshold in the Kozeny-Carman
    relation (Eq. (10.2)) to accurately fit the observed permeability to a well-sorted
    material and also extend the scope of the model.


    $K = B(\phi - \phi_c)d^2$ (10.2)


    where φ_c is the minimum threshold porosity. Note, the (φ − φ_c) replacing φ in
    the Kozeny-Carman relation caters for the percolation threshold.


    # 2.2 Saturation Prediction Models


    Various models have been developed to estimate Sw which mostly depend on the geology
    of the formation to be evaluated. The application of these models can lead to
    a different prediction of Sw. The common model used for determining Sw is Archie''s
    equation (10.3), Simandox equation (10.4), Waxman Smits'' equation (10.5), Indonesian
    equation (10.6) and Dual water equation (10.7) correlation. An overview of the
    several water saturation models is presented in Table 10.1. Archie''s is the most
    widely used model and it is applied to clean sand and carbonates having zero shaly
    volume (Shedid and Saad, 2017). Archie (1941) used resistivity data to establish
    a model to determine the Sw model for clean sandstone and carbonate reservoirs
    on an assumption that water is the conductive element in the reservoir. Yet, in
    2016, Mehana and El-Monier (2016) indicated that Archie''s assumption is not valid
    in shale formation since it has a high mineral and organic content. Also, Shedid
    and Saad (2017) highlighted the same disadvantage of Archie''s model. They highlighted
    that the presence of clay minerals in a formation complicates the results from
    Archie''s and may give a misleading result.


    Following this, several empirical models were built to estimate Sw in shaly and
    shaly sand formation. All aforementioned models are associated with various uncertainties.
    These uncertainties can also be dependent on the accuracy and precision of the
    well logs and core measurements. Note that,'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Table 10.1. Characteristics of various water saturation models.


    | Sw model | Characteristics |

    |---|---|

    | Archie''s model (Archie 1942) | Archie''s equation (Archie 1942) shows a relationship
    between water saturation to the true permeable formation resistivity, the formation
    porosity and the formation water resistivity. The challenge, therefore, arises
    due to the presence of shale in the reservoir which is a conductive medium and
    hence is against the original assumptions of Archie''s equation, which was a clean
    sandstone reservoir (Archie 1942). The presence of shale causes a disparity in
    the reading of the total resistivity of the reservoir and brings about an overshot
    in the water saturation predicted by Archie''s equation (Archie 1942). |

    | Simandoux (Simandoux, 1963) | The Simandoux model was developed to study the
    volumetric effects of reducing clay volume on the conductivity of the rock matrix
    and the overall saturation. The Simandoux model is applied in fine siltstone of
    clay-rich formation regardless of the specific distribution form of clay or clay
    applied in shaly sandstone. Simandoux experimented on only four synthetic samples
    using one type of clay (montmorillonite) with a constant value of porosity. Hence,
    the model leads to optimistic results when the porosity is less than 20%, and
    it cannot be relied on in low porosity situations. Also, the model does not show
    a volumetric balance between sandstone volume and the clay volumes with consideration
    of the lack of shale formation factor in the clay term making the correlation
    of clay effect in the model too large and hence reducing the amount of water saturation
    estimated (Sam-Marcus et al., 2018) |

    | Waxman-Smits (Waxman-Smits 1968) | The Waxman-Smits model is based on laboratory
    measurements of resistivity, porosity and saturation of real rocks. The major
    assumptions of the Waxman-Smits model about clay formation and its properties
    are as follows: Clay surface conductivity is assumed to share a directly proportional
    relationship with the factor Qv (defined as the milli-equivalents of exchangeable
    clay counterions per unit volume of pore space), and the F* term replicated in
    both the sandstone resistivity term and the shale resistivity term. This model
    served as the premise of the widely used dual water model. The Waxman-Smit''s
    equation is often used as a standard against other methods, due to its high experimental
    backing, but the determination of CEC (Cation Exchange Capacity) is a time-consuming
    experiment and this is the major limitation of the Waxman-Smits model. |

    | Indonesian (Poupon and Leveaux, 1971) | The Indonesian equation relies as a
    benchmark for field-based models that work reliably with log-based analysis regardless
    of special core analysis data. The Indonesian equation also does not particularly
    assume any specific shale distribution. The Indonesian model also has an extra
    feature as the only model considered the saturation exponent (n). According to
    Shedid and Saad (2017), the results from the Indonesian predictor have been obtained
    with a simpler equation, which is more convenient for quick interpretation. |

    | Dual water (Clavier et al. 1977) | Dual water is an improved form of Waxman-Smits
    which contains irreducible water saturation and free water. In this method, it
    is proposed that the contribution of clay minerals to the resistivity of reservoir
    rock is caused by the presence of free water within the pore spaces and the bound
    water within the clay matrix. Dual water was developed to account for the conductivity
    at the surface of a clay mineral within the volume of shaly sandstone. |'
  merge: -1
  img_proc: true
