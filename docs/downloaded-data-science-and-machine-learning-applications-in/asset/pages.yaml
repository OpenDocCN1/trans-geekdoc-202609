  md: 'In most of the cases, subject matter experts (SME) construct informative features
    for further algorithm training. Creating good features using the input data which
    can describe the multiphase flow transport process may help to obtain better predictions.


    # 4.2 Model Development


    Model Development is the phase in which the implemented algorithm constructs a
    map of the input and output features. This mapping process is also called the
    training or learning phase of the model. In this phase, the model will modify
    the available parameters to precisely predict the final output. The technique
    the parameters are modified differs depending on the algorithm implemented in
    building the model. The next step in the model development is verifying and testing
    the model on different data sets to see how the model will perform on untrained
    data.


    Additionally, the validation step is important to adjust the hyper-parameters.
    Hyper parameters are selected before training to decrease noise and deviations
    that reduce the prediction precision of the model. K-fold cross-validation is
    a new technique in which the data set is divided into training and testing data
    then the model hyper parameters are assigned. Then the model will be trained on
    K-folds and the average error is calculated for the model. The K-fold will be
    repeated with several hyper parameters to find the best ones with the lowest average
    error.


    The final phase is to confirm the performance of the validated model on a separate
    data set. In the final stage, there are two possible outcomes: first, the errors
    on the training and testing sets are large which is called underfitting, and second,
    the errors on the training are small but large on the testing set which is called
    overfitting. Thus, validating and testing the model to assign the best hyper parameters
    to figure out the finest outcome is the optimal goal. A typical choice for the
    number of folds to use would be k = 10. Figure 5.7 shows a 10-fold cross-validation.


