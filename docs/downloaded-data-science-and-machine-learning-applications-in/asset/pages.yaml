  md: 'Gu et al. (2021) present a ML approach to estimate fluid saturation in reservoirs
    by evaluating fluid components in the T₂-D spectrum. The method integrates a GABP
    neural network and Gaussian Mixture Model (GMM) to determine a new saturation
    formula based on the physical significance between the T₂-D spectrum and fluid
    saturation. The approach is evaluated through numerical simulations, and results
    demonstrate improved accuracy and stability compared to traditional BP neural
    networks. The GMM determines different Gaussian probability distribution functions
    to characterise different fluids in the T₂-D spectrum, leading to more accurate
    saturation estimates. The proposed method has the ability to quantitatively evaluate
    fluid components in the T₂-D spectrum.


    These studies demonstrate the potential of using ML algorithms to analyse wireline
    log and NMR data and predict various reservoir properties such as pore-scale properties,
    permeability, fluid saturations, and fluid types. These methods have been shown
    to be accurate and have the potential to improve the efficiency and accuracy of
    reservoir characterisation.


    # 3. Methodology


    # 3.1 Data Collection and Description


    Conventional wireline logs from a vertical exploration gas well were used in this
    study. The CMR tool was logged in the well. The objective of the CMR logging was
    to evaluate the formation’s total porosity, bound and free fluid, and permeability.
    CMR was logged over a carbonate section capped by shale. Over the zone of interest,
    we do not observe borehole effects on the CMR signal due to a relatively smooth
    borehole combined with moderate mud salinity (approximately 58 ppk equivalent
    NaCl using chart GEN-9 with Rmf = 0.0694 ohmm at 21 deg C). No anomalies were
    observed on the raw echoes, T2 distribution, total porosity, and bin porosities.
    Since the well is drilled with water-based mud, the T₂ distribution reflects the
    pore size distribution. The data used in this study underwent quality control
    and reprocessing. The parameters selection for the CMR reprocessing used in this
    study is captured in Table 3.2. Figure 3.2 shows the incremental increase in porosity
    and multiple pore size distribution with favourable connectivity between pores,
    identified through the multi-exponential decay time analysis of NMR T₂ distribution
    in 100% brine saturated samples. The partitioning of the porosity was done as
    follows:


    +   1. Small Pore Porosity (T₂ min to 3 ms) – this can be considered as water-filled
    porosity associated with clay (water resistivity of Rwb in the Dual Water Saturation
    model).

    +   2. Capillary Bound Fluid (3 ms to T₂ cutoff) – this can be considered part
    of effective porosity. In clastic rocks, this would be expected to be water'
