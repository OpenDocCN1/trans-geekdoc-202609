- pgno: 207
  md: '# Super-Vertical-Resolution Reconstruction of Seismic Volume 191


    segmentation tasks. The ResU-Net architecture consists of an encoder and a decoder,
    connected by a series of skip connections. The encoder is responsible for extracting
    features from the input image, while the decoder responsible for reconstructing
    the image from the features. The skip connections allow the decoder to access
    features from multiple scales, which helps improve the model''s accuracy.


    One key difference between the ResU-Net and U-Net architecture is using residual
    blocks in the encoder and decoder. A residual block is a block of layers that
    learns the residual mapping between the input and the output rather than the actual
    mapping. This residual block helps reduce the number of parameters in the model
    and improves its learning ability. The mathematical formulation of the ResU-Net
    architecture can be described as follows:


    Let X be the input image and Y be the output image (i.e., the segmentation map).
    The encoder consists of a series of convolutional layers and residual blocks,
    which can be written as:


    ```

    E(X) = F(X) + X

    ```


    where F(X) is the residual mapping learned by the residual block.


    The decoder consists of a series of upsampling layers and residual blocks, which
    can be written as:


    ```

    D(E(X)) = G(E(X)) + E(X)

    ```


    where G(E(X)) is the residual mapping learned by the residual block.


    The model''s final prediction is obtained by applying a convolutional layer to
    the decoder output:


    ```

    Y'' = Conv(D(E(X)))

    ```


    A schematic framework of the ResU-Net architecture is shown in Fig. 9.3 below.


    In the simplified schematic framework of a ResNet, the input image is passed through
    a series of convolutional layers and residual blocks. The convolutional layers
    extract features from the input image, while the residual blocks are responsible
    for learning the residual mapping between the input and the output. The output
    of the residual block is then added to the original input to produce the final
    output of the block. The output of the final residual block is passed through
    a series of upsampling layers, increasing the output’s resolution. This upsampled
    output is then passed through a final convolutional layer, which produces the
    final prediction of the model. Overall, the residual blocks and upsampling layers
    form a U-shaped structure, with the convolutional layers forming the encoder and
    the upsampling layers forming the decoder. The skip connections between the encoder
    and decoder allow'
