  md: 'AlQuraishi et al. (2017) conducted a study that found that the low-salinity
    alternating miscible CO₂ method was not effective for clay-free sandstones, but
    did result in a recovery value of 35.1% of the OOIP when clays were present. Yang
    et al. (2005) conducted research and discovered that CO₂ has the ability to decrease
    the oil and brine interfacial tension (IFT) under constant temperature and pressure
    conditions. This decrease in IFT can contribute to additional oil recovery through
    the hybrid method. Further studies conducted by Teklu et al. (2016) and Ramanathan
    et al. (2016) showed that the decrease in IFT was less than 10 dynes/cm. However,
    a study by Kumar et al. (2016) reported comparatively high IFT in the presence
    of CO₂. Despite these mixed findings, it is important to note that the change
    in IFT is relatively small and is not considered to be the primary mechanism in
    the hybrid LSW/gas approach for increasing oil recovery. Other mechanisms, such
    as the reduction of residual oil saturation and improvement of displacement efficiency,
    are believed to play a more significant role in the hybrid method. Nonetheless,
    the discovery of the potential of CO₂ to reduce IFT remains an important aspect
    of research in the oil and gas industry.


    The issue associated with pure gas flooding is unfavourable mobility resulting
    in viscous fingering and a reduction in volumetric sweep efficiency. With less
    gas needed for EOR projects, the WAG approach helps to solve this significant
    problem. Additionally, conventional CO₂ WAG methods typically cause a delay in
    oil production, which the current study can alleviate with CO₂ LSWAG. By overcoming
    the issue of late production that conventional WAG commonly faces, CO₂ LSWAG speeds
    up the synergy of these several process mechanisms. According to previous studies
    (Dang et al., 2014; Pourafshary and Moradpour, 2019; Sheng, 2014), the primary
    oil recovery mechanism in CO₂-LSWAG has been proposed to be wettability alteration
    to a more water-wet condition.


    However, the modeling studies of CO₂-LSWAG in a 1D homogeneous model and at field
    scale in sandstone reservoirs (Dang et al., 2014) had been done and characterised
    by the expensive computational cost (Belazreg and Mahmood, 2020; Jaber et al.,
    2019). There is little or no application of fast and reliable machine learning
    models to forecast the performance of CO₂ LSWAG as shown in Table 7.1, for secondary
