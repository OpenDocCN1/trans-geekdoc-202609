- pgno: 59
  md: '# 3.3 Machine Learning Model Application


    It is widely accepted that DL algorithms perform better than their traditional,
    more simplistic equivalents in the field of ML. The ability of DL models to manage
    substantial amounts of data has resulted in their widespread popularity for tasks
    involving predictive modelling and pattern recognition (Otchere et al., 2021a).
    Despite all of the advancements that have been made thanks to DL in the field
    of AI, it still has significant flaws. Hyperparameter tuning, slow convergence
    on short datasets, infinite structures, and complexities are among the most often
    encountered problems. While traditional ML models can mitigate these issues on
    smaller datasets, they are limited in their ability to produce higher model performance
    overall. It is difficult to know exactly which model to use because of the hazy
    definition of small datasets. Based on these assertions, a new custom stacked
    ensemble model is developed in this research. This custom ensemble model integrates
    multiple varied base learners in its architecture to enhance model effectiveness.
    However, compared to the custom stacked ensemble model, the performances of the
    individual models are low.


    # 3.3.1 Building Deep Learning Models


    A CNN model is a type of DL model that is particularly well-suited for image and
    signal processing tasks. However, its performance was evaluated on a regression
    task in this study. It comprises multiple layers, including convolutional, pooling,
    and fully connected layers. To build a CNN model for this study, the following
    steps were taken:


    +   1. The input data, wireline logs with 10 dimensions, were reshaped to match
    the expected input shape for a CNN model.

    +   2. The model was composed of a series of convolutional layers designed to
    extract features from the input data. These layers use filters to scan over the
    input data and extract features at different scales.

    +   3. The output of the convolutional layers was then passed through one or more
    pooling layers, which minimised the dimensionality of the feature maps and offered
    some form of translation invariance.

    +   4. The final output of the pooling layers was then passed through one or more
    fully connected layers to make the final predictions.

    +   5. The model was then trained using the training dataset and evaluated using
    the holdout dataset.

    +   6. The model was fine-tuned by adjusting the number of layers, the number
    of filters in each layer and the size of the filters to achieve the desired level
    of performance.'
  merge: -1
  img_proc: true
