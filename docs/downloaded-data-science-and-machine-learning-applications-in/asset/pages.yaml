  md: 'Table 4.1. Common methods of estimating Vs sonic velocity.


    | Methods | Types of Measurement |

    |---|---|

    | Laboratory | Core measurements |

    | Direct | Dipole Sonic Log |

    | Empirical Correlations | Castagna, Gassman, Brocher, Carroll and Greenberg-Castagna
    correlations |

    | Machine Learning | Examples of models |


    The acquisition of continuous Vs and Vp subsurface data is reliably done via wireline
    logs. The Dipole Shear Sonic Log, invented in the 1980s, is the most commonly
    used logging tool used to record the waveform values and process the data to compute
    Vs and Vp sonic velocity and became ubiquitous in the 1990s (Close et al., 2009).
    This measuring tool indicates how fast sound propagates through subsurface interfaces.
    Although the dipole sonic log is available, its expensiveness has rendered the
    direct measurement of Vs not worth the cost, as such, Vs is not ubiquitous in
    all wells. This limitation has necessitated further research in estimating Vs
    from other logs, mainly from the Vp log (Brocher, 2005; Carroll, 1969; Castagna
    et al., 1985; Dvorkin and Mavko, 2014; Gassmann, 1951; Greenberg and Castagna,
    1992). With the advancement of fluid sequestration, geothermal energy, and unconventional
    resources, Vs and Vp have become more prevalent. However, older wells never acquired
    Vs and Vp data before the dipole sonic log. Acquiring the data now is not feasible.
    As such, extensive research is required to provide substantial study in estimating
    these two logs from other conventional wireline logs. In this study, estimating
    Vs and Vp from wireline logs using a multioutput supervised machine learning approach
    is investigated for the Volve field siliciclastic oil-bearing reservoirs. This
    study is of the utmost significance, especially in more mature fields, as shear
    and compressional sonic logs were never obtained in old wells. This method would
    result in better accuracy in predicting compressional and shear sonic logs for
    hundreds of wells useful for geomechanics, performing well-to-seismic inversion,
    and other operations.


    # 2. Literature Review


    Prior to the influx of data, empirical and laboratory techniques have been useful
    in estimating Vs from Vp. One of the pioneering articles that were published by
    (Pickett, 1963) established the concept of using the compressional to shear wave
    velocities ratio as a lithology indicator. Figure 4.1, which has been modified
    from Pickett’s study, demonstrates the clear distinction in Vp/V that exists between
    dolomites, limestones, and clean sandstones. According to (Castagna et al., 1985),
    the Vp/Vs ratio tends to change fairly linearly between the velocity ratios of
    the end members with increasing composition in binary'
