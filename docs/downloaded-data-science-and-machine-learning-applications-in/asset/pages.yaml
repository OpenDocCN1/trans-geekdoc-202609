- pgno: 70
  md: '# 5. Conclusions


    To obtain a detailed understanding of the reservoir, it is crucial to quantify
    the surface wettability at an early stage. This information is essential for enhanced
    oil recovery (EOR), particularly chemical EOR, to maximise production. This study
    aimed to develop a suitable model for predicting total porosity and the free fluid
    volume using wireline logs as input. The study evaluated several models, including
    a Hybrid ensemble model, Extra Trees Regression, Random Forest, XGBoost, LSTM,
    GRU, and CNN. The performance of the models was evaluated using several metrics,
    including train score, test score, AIC, MAE, and RMSE. The incorporation of these
    computational methods provides a more accurate depiction of surface wettability
    when core wettability data and NMR logs are unavailable.


    In the light of the results obtained in this study, the following inferences can
    be made;


    +   1. The hybrid ensemble model achieved a high train and test accuracy score,
    indicating that it is able to fit the training data well and generalise well to
    new data. This is further supported by the recorded lowest MAE, and RMSE in its
    predictions.

    +   2. The likelihood of the model fitting new data is also high, as indicated
    by the AIC score, which is the lowest among all the models. AIC is a measure of
    the probability of the model’s fit on new data. A low AIC score indicates that
    the model is more likely to generalise well to new data.

    +   3. The DL models, LSTM, CNN, and GRU, performed poorly due to their high complexity
    and volume of data used.

    +   4. The hybrid ensemble model performed better than the others because it combined
    the strengths of multiple base models, Extra Trees Regression, Random Forest,
    and XGBoost, and used a stacking ensemble technique. This technique involves training
    multiple base models on the input data and then using their predictions as input
    to a higher-level meta-model that makes the final predictions. This allows the
    hybrid model to capture both the low-level and high-level features of the data,
    which leads to improved performance.


    The results of this study suggest that the hybrid ensemble model is a robust fit
    for this problem and is suitable for predicting total porosity and FFV. It is
    able to achieve high accuracy, consistency, and precision, and generalise well
    to new data. This makes it a valuable tool for the petroleum industry in estimating
    the porosity of reservoirs, determining the pore volume fraction of a reservoir
    that can be produced, and evaluating the potential of a prospect. This can help
    improve hydrocarbon exploration and production efficiency, ultimately leading
    to increased productivity and reduced costs.'
