    in sandstone reservoirs with strongly water-wet sandstone cores and little clay
    content, which are unfavourable conditions for the LSW process (Dang et al., 2014)
    unlike carbonate reservoirs which are complex and have received relatively little
    attention. It was reported that by combining the low-salinity waterflooding method
    and the CO₂-EOR method, a new LSW-alternating-CO₂ (LS-WACO₂) EOR method emerges.
    It was concluded that the solubility of CO₂ in LSW was the main reason for the
    increased residual oil mobilisation more than in ordinary WAG. In the work of
    Dang et al. (2014), a hybrid LSW alternating miscible CO₂ flooding injection was
    modelled in a 1D core. Their research indicates that the hybrid approach is effective
    in resolving late production problems associated with water alternating gas WAG
    injection. Pourafshary and Moradpour (2019) conducted a comprehensive review of
    Dang et al.’s (2014) work and recommended further field-scale simulation studies
    based on experimental work to fully evaluate the useful benefits of the hybrid
    methods developed by Dang et al. (2014). Their recommendation was based on the
    promising results obtained by Dang et al. (2014), and highlights the need for
    more comprehensive studies to advance the understanding of this novel method.
    Furthermore, only very limited simulation studies have been done with regard to
    CO₂ LSWAG injection in carbonate reservoirs (Al-Shalabi et al., 2014; Hamoud and
    Pranoto, 2016).


    In 2011, Aleidan and Mamora (2011) conducted a study that aimed to compare the
    effects of various water/CO₂ injection schemes on oil recovery from carbonate
    core samples. The study analysed the impact of SWAG and WAG injection schemes
    at different salinities. The researchers discovered that when they switched to
    LSW, there was an increase in oil recovery for both injection methods. This increase
    was as a result of the hybrid method and the synergy between gas and LSW injections.
    Gas dissolution in brine led to a reduction in fluid mobility, which accounted
    for the incremental oil recovery. Jiang et al. (2010) also conducted a study to
    investigate the impact of water salinity on the performance of WAG during miscible
    flooding in sandstones using highly viscous crude oil. The study aimed to examine
    the effect of low-salinity water on the effectiveness of WAG. The researchers
    discovered that in LSW, a higher gas solubility regulated the mobility ratio of
    water and viscous oil. This regulation occurred because the gas solubility in
    brine increases as salinity decreases, leading to a reduction in gas mobility
    and an increase in the viscosity of the brine. Consequently, the mobility of water
    and viscous oil became more balanced, which resulted in improved oil recovery
    rates. In addition to the findings mentioned previously, the research conducted
    by the team also showed that LSW is more effective than high-salinity water in'
