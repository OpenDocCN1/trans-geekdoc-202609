  md: '# CHAPTER 12

    Modelling Two-phase Flow Parameters Utilizing Machine-learning Methodology


    Longtong Dafyak* and Buddhika Hewakandamby




    Two-phase flow is predominant in natural occurring and industrial processes; from
    water droplets entrained in the air to domestic water distribution lines, combustion
    engines, power generation plants, amongst others. In the exploration industry,
    gas-liquid flow in pipes is a standard practice due to the coexistence of these
    fluids in the subsurface (McCain, 1994; Soloveichik et al., 2022). Furthermore,
    pipelines are still the safest and most economical means of transporting fluids
    over long distances (Green and Jackson, 2015; Canada Energy Report, 2020).


    When gases and liquids flow simultaneously in pipes, unique flow configurations
    are formed, which are referred to as flow patterns. These flow patterns were classified
    as bubbly, dispersed bubbly, plug, slug, stratified, and annular flows by Hewitt
    and Roberts (1969) and Mandhane et al. (1974) as illustrated by Shoham (2006)
    in Fig. 12.1. The flow patterns formed depend on the operating parameters, pipe
    geometric variables, and physical properties of the fluids (Lu, 2015). Each flow
    pattern is associated with specific interaction between the phases and the pipe
    walls, thus making one flow pattern entirely different from another (Nie et al.,
    2022). The difference in momentum, phase distribution, and velocity distribution,
    makes gas-liquid flow dynamics a lot more complex than single-phase flow. However,
    some flow patterns share similar intermittent behaviour and characteristic parameters.


    University of Nottingham, UK.


    * Corresponding author: longtongdafyak@gmail.com'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/80b94770dd572ad559c67fa9921bb887_303_0.png)


    Fig. 12.1. Flow patterns in (a) horizontal and (b) vertical pipes (Shoham, 2006).


    The wide application of gas-liquid flow and the curiosity of gas-liquid enthusiasts
    has inspired a plethora of studies in this field leading to the development of
    several gas-liquid models. Pioneering researchers (Nicklin, 1962; Dukler and Hubbard,
    1975; Fernandes et al., 1983; Alves and Shoham, 1991) proposed physics-based models
    to describe two-phase flow dynamics; however, these models are either highly simplified
    or require high computation time to derive a solution. For these reasons, several
    empirical and semi-empirical models have been developed over the years to predict
    two-phase flow parameters. These correlations predict the mean void fraction and
    velocities for most flow patterns, the frequency, void fraction, and length of
    flow structures for intermittent flow patterns amongst other two-phase flow parameters.
    There are primarily two limitations of these empirical/semi-empirical correlations;
    one of which is the constraint of its applicability to flow conditions from which
    it is developed. Second, some of these correlations have proven to be applicable
    over a wide range of two-phase flow conditions; however, the simplistic curve
    fitting approach used in developing most empirical correlations are often inadequate
    for optimally modelling the complex relationships between the two-phase flow variables.


    As Machine Learning (ML) application develops and gains popularity, researchers
    have explored ML techniques in predicting two-phase flow patterns and parameters.
    Flow pattern models developed by Cai et al. (1994), Rosa et al. (2010), Al-Naser
    et al. (2016), Mask et al. (2019), Liu et al. (2020), and dos Santos Ambrosio
    et al. (2022) using support vector machine, artificial neural networks (ANNs)
    and tree-based algorithms show promising results with an accuracy of approximately
    96–100%. Yan et al. (2018) reviewed soft computing techniques, ML, evolutionary
    computation, fuzzy logic, and probabilistic reasoning, and proposed the trajectory
    of future development in'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'multiphase flow research. Azizi et al. (2016) utilized ANN to predict liquid
    fraction using 468 experimental data points for oil-water mixtures. Kim et al.
    (2020) and Abdul-Majeed et al. (2022) proposed ML models to specifically model
    slug flow parameters. More recently, the ANN model proposed by Aliyu et al. (2023)
    for entrained liquid fraction in annular gas-liquid flows show good performance
    with a Root Mean Squared Error (RMSE) and R² of 0.005 and 0.97, respectively.
    These studies also compared existing correlations and demonstrated the potential
    of ANN, random forest, and support vector regression to outperform traditional
    two-phase flow correlations. Despite the contributions of these studies to data-driven
    modelling, studies focused on comparing the capabilities of varying ML algorithms
    in two-phase flow modelling is sparse. Thus, this study is focused on evaluating
    the performance of several ML algorithms in two-phase flow predictions and assessing
    the applicability of these ML models in comparison to traditional empirical correlations.


    In this study, the interest is limited to the mean void fraction and structure
    velocity of intermittent flow regimes. This is because intermittent flows (slug,
    plug/elongated bubble, and churn) are the most persistent and often the extremely
    challenging flow patterns in two-phase flow systems. These two parameters are
    also generic characteristics of most two-phase flow patterns; thus, the developed
    models are applicable across a wide breadth of two-phase flow conditions. The
    two-phase flow variables considered in this study are the operating conditions
    (the gas and liquid superficial velocities, the pipe diameter and inclination)
    and the fluid properties (the gas and liquid viscosity, the gas and liquid density).


