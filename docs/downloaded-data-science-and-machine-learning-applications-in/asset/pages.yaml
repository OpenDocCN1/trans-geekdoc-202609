- pgno: 255
  md: '# 6. Seismic Guided Petrophysical Property Prediction


    Integration of seismic and well log data for petrophysical property prediction
    requires bringing the source data to a common dimension (depth and time), specifically
    with both source in depth (well log) and time (seismic). This is usually achieved
    by using a seismic-to-well tie (Saikia et al., 2020) by matching the seismic response
    at the well location to that of the synthetic trace extracted from the well log.
    The synthetic trace is generated by convolving the reflection coefficient with
    a synthetic wavelet and using the reflection behaviour of the geological layers.
    Upon generating the synthetic wavelet, information on the depth of the synthetic
    trace and its equivalent time for the real seismic trace would be established.
    Once the best connection (stretch and squeeze) is attained, the depth-to-time
    relation is established (Saikia et al., 2020).


    The use of seismic-guided reservoir property prediction is one of the improved
    methods to help estimate reservoir properties (Table 10.5). In fields where there
    are not many wells and interpreting the reservoir only from the well logs becomes
    difficult, this method adopts statistical tools to estimate the reservoir property
    for the entire field. The information gained from the well log is not used proficiently
    for a larger field since this information will be confined to a specific location.
    Due to this difference in well log information, integrating the seismic data helps
    to give an estimation of the varying reservoir property of the field at large.
    In recent years, different AI algorithms have been implemented to help in the
    estimation of reservoir properties with the use of seismic data and well logs.


    Gogoi and Chatterjee (2019) predicted reservoir properties from well logs and
    seismic data by employing the MLF algorithm in Tipam sandstone and Barail arenaceous
    sandstone reservoirs. The data set used includes complete acoustic impedance from
    2D post-stacked seismic data, as well as RHOB, Phi, and shear impedance. The MLF
    algorithm generated a single-layer shale volume and Sw from numerous hidden layers.
    Upon analysis, the outcome showed a minimal estimation error for both reservoirs,
    suggesting that MFL can be used to predict such properties. The MLF has been established
    to be effective in the estimation of sand or shale reservoir properties by Iturraran-Viveros
    and Munoz-Garcia (2018). They investigated the use of seismic traits and wireline
    logs as input factors for describing petrophysical properties for the Tenerife
    field at a seismic scale, with the option of sands or shales. The gamma test,
    a multidimensional smoothing tool, was used to help optimise the input variable
    selection for training the ANN. It thus supported a decent assessment of Phi and
    Sw and brought about a decent connection with core, well log just as seismic amplitudes
    for each facies. Soleimani et al. (2020) assessed the performance of the MLF by
    comparing it with PNN, RBF, Multiple Linear Regression (MLR), and Geostatistical
    Method (GM)'
