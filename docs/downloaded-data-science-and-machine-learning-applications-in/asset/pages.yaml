  md: '# CHAPTER 4

    Compressional and Shear Sonic

    Log Determination

    Using Data-Driven Machine

    Learning Techniques


    *Daniel Asante Otchere,¹,²,* Raoof Gholami,³ Vanessa Nta⁴ and Tarek Omar Arbi
    Ganat⁵*


    # 1. Introduction


    Shear (Vs) and Compressional (Vp) sonic waves are significant parameters in subsurface
    engineering. They provide valuable information for reservoir exploration, development,
    recovery and fluid sequestration (Azizia et al., 2017; Zoveidavianpoor et al.,
    2013). These parameters or its ratio are useful in reflection seismology, lithologic
    identification, and formation evaluation (Castagna et al., 1985), pore fluid and
    pore pressure information (Duffaut and Landrø, 2007; Rojas, 2008), reservoir characterisation
    (Eberli et al., 2003; Pickett, 1963), geophysics (Phadke et al., 2000; Waluyo
    et al., 1995), and geomechanical properties (Asoodeh and Bagheripour, 2014; Rasouli
    et al., 2011). There are several ways of measuring these parameters, as summarised
    in Table 4.1.


    ¹ Centre of Research for Subsurface Seismic Imaging, Universiti Teknologi PETRONAS,
    32610, Seri Iskandar, Perak Daril Ridzuan, Malaysia.

    ² Institute for Computational and Data Sciences, Pennsylvania State University,
    University Park, PA, USA.

    ³ Department of Energy Resources, University of Stavanger, Kjell Arholms gate
    41, Stavanger, 4021, Norway.

    ⁴ Shell Oil Company, 150 N Dairy Ashford Rd, Houston, TX, 77079, United States
    of America.

    ⁵ Department of Petroleum and Chemical Engineering, Sultan Qaboos University,
    Muscat, Oman.

