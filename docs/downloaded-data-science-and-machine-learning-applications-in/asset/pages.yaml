  md: 'connectivity, network size, and the coefficient for the optimum model with
    model reduction with less human intervention (Ivakhnenko, 1971). The input and
    output relationship are expressed in polynomial form, with the model automatically
    selecting the most influential parameters (Farlow, 1984). In this study, GMDH
    is used to develop a mathematical model for predicting the CO₂-LSWAG oil recovery
    factor. Ivakhnenko (1971) applied the Kolmogorov-Gabor polynomials theory function
    to find the output parameter, which is expressed in Eq. (7.17):


    $$ORF^{GMDH} = a_o + \sum_{i=1}^{n} a_i x_i + \sum_{i=1}^{n} \sum_{j=1}^{n} a_i
    a_j x_i x_j + \sum_{i=1}^{n} \sum_{j=1}^{n} \sum_{k=1}^{n} a_i a_j a_k x_i x_j
    x_k + \cdots \quad (7.17)$$


    where, $a_{i...k}$, $x_{i...j}$, $ORF$, and $n$ represent polynomial coefficients,
    input parameters, the predicted values and the number of variables, respectively.


    From Eq. (7.17) the polynomial variables are obtained by employing least square
    minimisation analysis as expressed in Eq. (7.18):


    $$\delta_j^2 = \sum_{i=1}^{N} \left(ORF_i^{GMDH} - y_i\right)^2 \quad (7.18)$$


    where $N$, $y_i$, and $ORF_i^{GMDH}$ represent the number of training data points,
    actual values, and predicted values, respectively.


    # 2.3.3 Performance Metrics


    The accuracy of the prediction from the machine learning methods was measured
    using the coefficient of determination ($R^2$), mean squared error ($MSE$) and
    Pearson’s correlation coefficient ($r$) to understand the target against variations
    of individual independent variables.


    The $R^2$ is a statistical index with the best model prediction having an optimum
    value closer to 1, $MSE$ gets closer to zero for an accurate model, and $r$ can
    be $-1$ or $+1$, indicating a parametric effect on output (Brantson et al., 2019).
    Equations (7.19), (7.20), and (7.21) illustrate the mathematical expressions used
    for $R^2$ $MSE$ and $r$, respectively:


    $$R^2 = \left( \frac{\sum_{i=1}^{n} \left(ORF_{observed} - \overline{ORF}_{observed\
    mean}\right) \times \left(ORF_{predicted} - \overline{ORF}_{predicted\ mean}\right)}{\sqrt{\sum_{i=1}^{n}
