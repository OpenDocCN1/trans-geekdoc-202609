    # 5.4 Analysis of Features Using Shapley Values Model Agnostic Metrics


    The prediction of mud loss was performed using all the features to train the Extra
    Trees model. The same training and testing datasets used in the PFI analysis were
    used. Since machine learning models are supposed to be interpretable to help understand
    how a model made a particular prediction, model agnostic metrics are helpful.
    Shapley’s values originated from the game theory, and it is necessary to clarify
    its application to supervised machine learning interpretability. The game represents
    the prediction assignment for a specific event in the dataset. The gain is the
    difference between the actual forecast for a specific instance and the average
    forecast for all instances. The instance’s feature values collaborate to achieve
    the gain in the mud loss forecast.


    Figure 2.9 visualises the shapely values as absolute values in a feature importance
    plot. The Shap feature importance works with a simple principle where the traits
    with high absolute values are the features of most importance. The absolute mean
    of the Shapley values for each attribute across the data is computed to evaluate
    the global importance. The pump pressure and flow rate feature variables were
    highly important, with pump pressure being the most important and changing the
    target on average by 56.35 bbl/hr on the x-axis. The plot also realised that the
    correlation of meterage, drilling time, and WOB to the target was low, with the
    inclusion of WOB disagreeing with PFI results. Based on this result, further investigation
    was necessary to ascertain which traits were irrelevant to the target. The importance
    of Shapley values is an alternative to the importance of permutation features.
    Both the importance measures have a significant difference. The decline in model
    performance determines the permutation attribute’s relevance, whereas Shapley
    values are primarily based on the magnitude of feature provenances. The feature
    importance plot is'
