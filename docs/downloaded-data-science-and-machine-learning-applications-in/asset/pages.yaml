  md: '# CHAPTER 10


    # Petroleum Reservoir Characterisation


    # A Review from Empirical to Computer-Based Applications


    Ebenezer Ansah,1* Anthony Ewusi,2 Eric Thompson Brantson3 and Jerry S.Y. Kuma2




    In the early days, geological studies entailed reservoir description by integrating
    geologic, geophysical, and well logging data (Yu et al., 2011). Given this, practical
    problems related to geology and engineering highlighted the importance of integrated
    reservoir characterisation. That led to immense research and application of various
    reservoir characterisations in the oil and gas industries.


    According to Ma (2011), reservoir characterisation is the study of the properties
    of a reservoir using various field specialisations (geological, geophysical, petrophysical,
    and engineering), including uncertainty analysis of geological, engineering data,
    and spatial variations. There exists a correlation among these sparse data sources,
    and analysing them can bring out a great understanding of the reservoir. The most
    used data for reservoir characterisation are seismic data (2D, 3D, and 4D), well
    logs, and core data. Recent advancement has seen increased development in the
    application of'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'microseismic in the field of reservoir characterisation. In the characterisation
    process, well logs provide a high vertical resolution, while seismic data provide
    a high lateral resolution since it covers a large area. The core analysis gives
    a precise insight into the *in-situ* behaviour of the reservoir (highest resolution),
    but its acquisition is expensive and needs huge analysis effort, making it limited.
    Thus, all the available data sources complement each other to effectively attain
    a complete reservoir description.


    To highlight a good reservoir model, the correlation in the various data sets
    is insufficient since the data have some level of uncertainty, imprecision, and
    incompleteness (Verma et al., 2012). Therefore, Artificial Intelligence (AI) techniques
    have been one of the widely used modelling practices to handle such problems relating
    to the data set used for reservoir characterisation (Verma et al., 2012). Given
    the training dataset, a good model can be trained for complex problems. Literature
    has highlighted that AI methodologies have the strength of ameliorating models
    by integrating with other computing techniques (Anifowose et al., 2017; Nikravesh,
    2003). These computing techniques such as genetic algorithms, and fuzzy logic
    help to correct some various limitations (such as overfitting, parameter selection,
    etc.) of the AI algorithms.


    This paper provides a structured overview of the application of AI in reservoir
    characterisation. Several reviews highlighting the use of AI in reservoir properties
    can be found in (Anifowose et al., 2015; Anifowose et al., 2017; Nikravesh and
    Aminzadeh, 2001; Otchere et al., 2021a; Saikia et al., 2020; Yu et al., 2011).
    In this paper, the emphasis is on the empirical approach, AI application and its
    enhancement with other computational models, and recent AI advancement for reservoir
    property prediction. The paper will also address some challenges and perspectives
    on the way forward for reservoir characterisation.


    The following is how the paper is structured. The second section provides an overview
    of the empirical correlation used for petrophysical reservoir characterisation.
    Section 3 highlights the application of fractals analysis in reservoir characterisation.
    Section 4 is the application of AI in petrophysical reservoir characterisation
    with an emphasis on the application of artificial neural network (ANN) and support
    vector machine (SVM). Section 5 looks at the review of lithology and facies analysis
    while Section 6 is the contribution of seismic data in reservoir property prediction.
    Section 7 looks at the application of hybrid AI in reservoir characterisation.
    Section 8 highlights the summary of the individual AI algorithms used in reservoir
    characterisation with key consideration of the data input, activation function,
    output, and the statistical measures for the AI algorithms. Section 9 addresses
    the challenges and the way forward for reservoir characterisation. Section 10
    concludes the study and spells out the major keys drawn from the present review.'
