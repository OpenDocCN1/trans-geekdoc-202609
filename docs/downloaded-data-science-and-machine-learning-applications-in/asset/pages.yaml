    the positive component of the combination while having less influence on non-contributing
    properties (Brantson et al., 2018). As shown in Table 7.4, all the inputs and
    target will be loaded into the MARS algorithm for developing the trained model
    for spline fitting optimisation computations. Also, the MARS model automatically
    selects the most influential input parameters that affect the target response
    leaving out the non-contributing variables. Furthermore, the maximum basis functions,
    maximum interactions and degrees of freedom for knot optimisation used'
