    Moghadasi et al. (2017) investigated the use of bagged ANN, ANN-based Principal
    Component Analysis (PCA), and BPNN to predict permeability and porosity. Seven
    well logs were utilised as model parameters from the 11 wells used, and the predicted
    output was trained using core permeability and porosity. PCA was used as a feature
    extraction method to help identify the relevant variables. In order to average
    the predicted multiple datasets to enhance the level of stability and lower uncertainty,
    the bootstrap sampling bagging technique was used to generate multiple training
    sets for the prediction. Based on the models generated, the bagged ANN ensemble
    model prediction documented the highest R² of 0.94 (94%) and 0.85 (85%), respectively,
    and the lowest MSE of 0.001 and 0.0034 for Phi and K. Srissuthiyakorn (2016) developed
    a Multilayer Neural Network (MNN) and Convolutional Neural Network (CNN) paradigms
    in predicting permeability from geometry and feature extraction from rock images.
    Their paradigm employed slope descent-based back-propagation with Bayesian regularisation
    for training. MNN was modelled using porosity, Euler number, integral of the mean
    curvature, and specific surface area. From their research, the feed-forward network
    gave rise to a higher testing MSE (mean squared error) compared to the Bayesian
    regularisation network and CNN.


    Xie et al. (2020) developed a coarse-to-fine basis that incorporates outlier detection,
