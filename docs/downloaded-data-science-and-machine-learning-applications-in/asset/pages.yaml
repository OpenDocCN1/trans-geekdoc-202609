    # 4. Data Collection and Description


    The Volve field, located in the Norwegian part of the North Sea, is a sandstone
    oil-bearing reservoir interval. The Volve field formation predominantly consists
    of near-shore, shallow, to marginal marine deposits. As a result of the extensive
    core sampling, it was discovered that six distinct facies associations represent
    the Heather Formation; coastal plain, shoreface, fluvio-tidal channel-fill, bay-fill,
    mouth bar, and offshore open marine (Folkestad and Satur, 2008; Otchere et al.,
    2022b, 2021a; Sneider et al., 1995). The data used has 12 dimensions compiled
    from three wells, Well 15_9-F-1_A (Well A), 15_9-F-1_B (Well B) and 15_9-F-15_D
    (Well C). However, well A and B were combined, making up 4,000 data points (2,125
    for Well A and 1,875 for Well B), to train and test the model. A wireline plot
    of Wells A and B showing the shear (DTS) and compressional (DT) logs is illustrated
    in Figs. 4.2 and 4.3. The model was then deployed to estimate DTS and DT for Well
    C, which had a total data point of 11,935 without Vp and Vs logs. One of the main
    advantages of applying data analytics to data is to find patterns and hidden information
    in high dimensional data. As such, the primary input features for this research
    are summarised and justified in Table 4.4. Table 4.5 shows the descriptive statistics
    of the features for the combined Well A and Well B.


    Table 4.4. Justification for log selection as input variables.


    | Log | Purpose | Reason |

    |---|---|---|

    | Gamma ray (GR) | Lithology determinant | Lithogies exhibit different Vs and
    Vp wave velocities (Otchere et al., 2021c). |

    | Neutron (NPHI) | Lithology and porosity determinant | Lithogies and porosity
    influences Vs and Vp differently (Otchere et al., 2021c). |

    | Density (RHOB) | Lithology and porosity determinant | Lithogies and porosity
