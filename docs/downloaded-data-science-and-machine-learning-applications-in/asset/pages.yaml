- pgno: 199
  md: 'techniques will be compared to identify the most appropriate technique for
    vertical resolution improvements. The reported successes of using synthetic data
    to pre-train a DCNN due to the unavailability of data and deploying it on a real
    field make AI a viable candidate for vertical and lateral seismic image resolution.


    # 2. Brief Overview


    Seismic imaging is a well-known geophysical technique for visualising underlying
    structures and features in the Earth’s subsurface. It is extensively used in the
    oil and gas sector to discover and map hydrocarbon reservoirs and in civil engineering
    for site characterisation and underground utility mapping. Despite its widespread
    use, Seismic imaging has intrinsic limitations in terms of image resolution and
    quality, which affects the accuracy and dependability of the ensuing interpretation.
    Several factors can limit the resolution of seismic images in the oil and gas
    industry (Deng et al., 2021; Sun et al., 2022; Yan and Chunqin, 2008):


    +   1. *Seismic wavelength*: The resolution of a seismic image is directly related
    to the wavelength and finite size of the seismic source transmitted into the subsurface.
    Shorter wavelengths result in higher-resolution images, while longer wavelengths
    result in lower-resolution images.

    +   2. *Seismic source frequency and depth*: The frequency of the seismic source
    (e.g., air gun, vibrator) also influences image resolution. Higher frequencies
    produce higher-resolution images but consume more energy and may not penetrate
    the subsurface as deeply. The resolution of a seismic image often decreases as
    depth increases due to the increased absorption of seismic energy as it passes
    through the subsurface.

    +   3. *Geology*: The composition and structure of the Earth’s subsurface can
    also affect the resolution of the seismic image. Harder, more consolidated materials
    produce clearer images than softer, more porous materials. Seismic energy can
    be scattered by complex geology, such as folds or faults, resulting in a lower-resolution
    image.

    +   4. *Data processing*: The resolution of an image can be influenced by the
    quality of the data processing techniques employed. Image resolution can be improved
    using advanced processing techniques such as inversion and migration. Some techniques,
    such as filtering, can help to minimise noise and improve resolution, while others
    can reduce the resolution.

    +   5. *Receiver spacing*: The spacing between the seismic receivers that collect
    data can also impact the image’s resolution. Closer spacing results in higher-resolution
    images, but it also increases the cost of the survey.'
