  md: 'has been assessed to surpass previously reported techniques based on the same
    dataset. The evaluation criteria discussed presented the probability of fitting
    held-out data of the models. The exactness, reliability, and dependability of
    the models were also assessed based on the R², MAE, and RMSE on the out-of-sample
    data. The models and how the target is predicted, based on the PFI and Shapley
    values, have made the input features explainable as the following traits are displayed;


    +   1. *Fairness*: The results have ensured that the predictions are neutral and
    are not biased against any input variable, either implicitly or overtly. An easy-to-interpret
    model can explain why a particular prediction was made, making it more straightforward
    to determine which input variable had a more significant influence.

    +   2. *Reliability*: The results help capture the differences in input variables
    that result in significant changes in the target and vice versa.

    +   3. *Causality*: Causal relationships were identified, and the pump pressure
    feature for training and test data is ranked high amongst all input variables.

    +   4. *Trust*: The results have yielded some level of trust in input features
    used for the final prediction. This analysis is based on how the employed techniques,
    PFI and Shapley values, explain their judgements on the input features to the
    target.


    The application of Explainable AI enhanced model prediction accuracy by 97% and
    94% in terms of MAE and RMSE, respectively. The comparison with other published
    results based on the same data resulted in a 98% and 95% reduction in MAE and
    RMSE, respectively. This analysis is proof that correlation does not mean causation.
    Without the PFI and Shapley values, the XGBoost feature importance would not have
    indicated features that will cause over- or underfitting and not capable of global
    interpretation of features.


