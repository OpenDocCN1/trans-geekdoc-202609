    # A Case Study on Opunake Field


    *Daniel Asante Ochere*,¹,²,* Abdul Halim Latiff*,¹ Nikita Kuvakin,³

    *Ruslan Miftakhov*,³ *Igor Efremov*³ and *Andrey Bazanov*,³


    # 1. Introduction


    Seismic surveys are essential for subsurface structure exploration and analysis
    in the oil and gas and civil engineering sectors (Farfour et al., 2021; Talwani
    and Kessinger, 2003). Reflection seismic surveys are acquired to map potential
    subsurface features and structural and stratigraphic hydrocarbon traps (Haldar,
    2018). The subsurface rock’s acoustic impedance changes produce reflections due
    to the Earth’s reaction to synthetically generated acoustic waves near the surface
    (Aminzadeh and Dasgupta, 2013; Selley and Sonnenberg, 2015). Although the seismic
    energy travels in the form of elastic waves, most imaging procedures presume that
    the recorded waves are exclusively composed of compressional waves (Gray, 2014).
    Seismic image resolution is the ability to accurately and delicately depict subsurface
    structures from the Earth’s


    ¹ Centre of Research for Subsurface Seismic Imaging, Universiti Teknologi PETRONAS,
    32610, Seri Iskandar, Perak Darul Ridzuan, Malaysia.

