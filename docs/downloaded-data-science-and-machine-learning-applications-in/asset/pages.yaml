  md: 'dimensions of approximately 7400 × 7400 × 28 ft³ along the Y, X, and Z directions.
    A total of 12,150 grid blocks were utilised, comprising of 45 blocks in both X
    and Y directions and six blocks in the Z direction. The simulation utilised flexible
    grids and precise corner point geometry to accurately represent the geological
    features and description of the reservoir, particularly for heterogeneities and
    wells. This approach was preferred over conventional cartesian grids. The reservoir
    exhibited heterogeneity with variations in porosity and permeability. Porosity
    values ranged between 9.5%–29%, while permeability differed in all directions
    with the vertical permeability lower than the horizontal permeability. The active
    fluid phases used in the model were water and oil, which are commonly found in
    reservoirs. The porosity and permeability variations depicted in Figs. 7.2a and
    7.2b provide valuable insights into the characteristics of the reservoir model.
    Additionally, Fig. 7.3 depicts the oil and water relative permeability curves
    used for the CO₂-LSWAG simulation for high and low salinity as a function of water
    saturation. The aqueous or mineral reaction structure selected was for


