    # 3. Methodology


    In the context of ICV design, the process usually relies on the production capacity
    of individual laterals. Notwithstanding, some oil companies opt for a simplified
    approach by utilising the mean production rate of the field rather than individual
    lateral rates.


    +   1. Data acquisition: For this research, data is to be acquired from the production
    technology team in the subsurface department. The data required from multiple
    wells are SPFM WI Rate, Annulus Pressure, Tubing Pressure, ICV dP, ICV position,
    Annulus Temperature for the separate reservoir zones (lower, middle and upper),
    MPFM Rate, THT (tubing head temperature), Annulus Pressure, THP (tubing head pressure),
    Tubing dP (differential pressure). Having some ICV mappings in the wells of interest
    is also essential. The data from the mapping helps gain insight and train the
    machine learning model on accurate data. The data were grouped per hour and within
    a two-year range.

    +   2. Data preprocessing and preparation: Based on the collected data, preprocessing
    techniques are used to clean the data. Missing values and data variables were
    removed to prepare the data for further analysis. The total number of data used,
    based on the descriptive statistics after the removal of missing data, is 3,767
    data points.

    +   3. Exploratory data analysis: The most critical and time-consuming part of
    any machine learning project is the exploratory data analysis. It is the first
    direct encounter with the data towards understanding it. Initial data investigations
    were carried out to discover patterns in data, spot anomalies, and check assumptions
    with the help of summary statistics, heatmaps, and pair plot visualisation.

    +   4. Explainable AI and feature selection: In this step, the various input features
    are inspected and checked for their importance. Based on the results from the
    data analysis, feature selection is to be performed using explainable AI techniques
    (model agnostic metrics). The approach is'
