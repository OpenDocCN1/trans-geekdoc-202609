    | Resistivity {true (RT), shallow (RACELM), medium (RACEHM), and deep (RPCELM)}
    | Lithology and hydrocarbon detection logs | Different fluids have different effects
    on Vs and Vp (Otchere et al., 2021c). |

    | Caliper (CALI) | Detection of permeable zones hence relates to formation types
