    The methodologies evaluated in this research demonstrated that explainable AI
    through the use of model agnostic metrics could give an insight into the input
    features. Since correlation does not mean causation, simple statistical techniques
    may not be able to indicate the causal effects of each input to the target. The
    findings show that gradually increasing the input variables above 13 causes a
    degradation in the model''s performance. According to the Shapley values, drilling
    duration, meterage, and WOB are among the variables that have no direct influence
    on drilling fluid lost circulation. Hence, it should not be used to train the
    model. Model agnostic has provided trustworthiness and valuable solutions for
    predicting fluid loss using relevant causal features. The ability to adequately
    predict lost circulation prior to drilling gives vital information about fracture
    aperture and the optimal LCM particle-size distribution. As a result, LCM may
    be formulated to fill existing fractures or not to percolate deep into high permeable
    formations to minimise excessive drilling fluid loss. As such, predicting drilling
    fluid lost circulation can give valuable insight into the type of interventions
    required to be implemented.


