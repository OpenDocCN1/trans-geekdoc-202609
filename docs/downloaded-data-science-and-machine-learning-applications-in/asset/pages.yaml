  md: '![](img/80b94770dd572ad559c67fa9921bb887_267_0.png)


    Fig. 10.7. Application of Rock Physics for well conditioning and its contribution
    to reservoir characterisation.


    seismic-guided approach coupled with rock physics has been the best method. Since
    geological location has a great influence on the acquired data (geophysical, core
    data, and petrophysical), the characteristics (elastic moduli) of the geology
    can be addressed by the use of rock physics models and to understand the geophysical
    data response by such geology (Fig. 10.7). In Fig. 10.7, rock physics models are
    used to condition the various input logs (such as density and sonic logs) which
    are then used to better enhance reservoir characterisation (deterministic inversion,
    facies probability mapping, and others). The use of this technique helps in understanding
    the geological complexity, improving the well log response, and a considerable
    level of accuracy with a smaller number of data samples can be achieved. Therefore,
    future works should exploit the use of rock physics models alongside AI models
    to condition the various inputs used for the prediction of reservoir properties
    to have a more accurate and precise result for future property modelling.


    # 10. Conclusions


    The past years have seen the petroleum industry generate abundant data for its
    resource estimation. However, under current economic conditions, most field data
    acquisition has been limited thereby relying on the acquired data for reservoir
    characterisation taking into account the use of complex models. Integration of
    all available data (petrophysics, geology, geophysics, rock mechanics, and engineering)
    play an important role in achieving a good reservoir characterisation. The integration
