  md: '# 250 Data Science and Machine Learning Applications in Subsurface Engineering


    ![](img/80b94770dd572ad559c67fa9921bb887_266_0.png)


    reservoir characterisation and has to be exploited. Therefore, future works will
    be directed to looking at the application of semi-supervised deep learning approaches
    to help improve prediction for reservoir properties, and facies analysis and also
    look at improving the DL model with some metaheuristic algorithms. Figure 10.6
    shows a framework for the proposed semi-supervised deep learning model. In the
    semi-supervised learning algorithm architecture (Fig. 10.6), a small amount of
    labelled data is used for partial training of the model (supervised learning).
    After the supervised training, the trained model and the unlabelled dataset are
    used to predict the output which produces a pseudo label. Since these pseudo results
    may not be accurate, the algorithm links the pseudo labels data and the labelled
    training data at the same time linking the input labelled training data and that
    of the unlabelled training data. This linked data again uses the data to train
    the model to reduce the error and improve the accuracy of the model.




    Geophysical and petrophysical well logs are subjected to noise and various processing
    uncertainties, henceforth, a proper pre-processing technique is required to improve
    the qualitative and quantitative analysis of the data. Saikia et al. (2020) highlighted
    noise, outliers, spurious attribute removal, and a suitable correlation of different
    data sources in terms of time, depth, and frequency as some aspects of pre-processing
    technique. To handle these effectively, the application of rock physics has gained
    much attention in the society of geophysics. This paradigm has contributed to
    well log conditions. Also, rock physics in recent years has gained much attention
    in the oil industry to help condition the input well logs in other to improve
    reservoir characterisation. (Chi and Han, 2009; Mukerji et al., 2001; Saberi,
    2013; Saxena et al., 2018). To capture the rock’s log response and the uncertainty
    associated with theoretical relations, a'
