    $V_p = \phi T \times V_b$ (3.4)


    where V_b is the bulk volume of the rock sample, which can be measured by using
    various techniques such as helium pycnometry, mercury intrusion porosimetry, or
    gas adsorption. It is worth mentioning that the pore volume can also be calculated
    by measuring the rock sample’s bulk volume and subtracting the solid grains’ volume
    from it. This method is known as the grain volume method and is another way to
    calculate the pore volume. These equations are based on the assumption that the
    magnetic susceptibility of the bound fluid is different from the free fluid. This
    means that the bound fluid can be distinguished from the free fluid by measuring
    the magnetic susceptibility of the pore fluids.


    # 2.2 Works Related to the Use of Machine Learning in NMR for Reservoir Characterisation


    Machine learning has been extensively employed to complement conventional methods
    and, in some instances, provide certain advantages. The deployment of machine
    learning techniques and AI algorithms to overcome intricate issues has gained
    traction in numerous sectors, including the petroleum industry (Otchere et al.,
    2021a). The application of machine learning in reservoir characterisation has
    seen massive growth underlining its importance in this field. Machine learning
    models have become quite useful in situations where not much data is collected.
    These models have been used to predict various logs, which, due to time and cost,
    were not run in wells. These models have illustrated high accuracy compared to
    actual logs, saving time and money while providing a real-time estimate of reservoir
    properties during drilling. A review of articles utilising machine learning techniques
    and NMR data to provide accurate alternatives is presented below.


    Rezaee (2022) expounds upon a study that employed an extensive repository of CMR
    to engender outputs from an NMR logging tool for clastic rocks. The study intended
    to evaluate the effectiveness of diverse machine learning (ML) methodologies employing
    customary well-logs as input data. The study generated outputs for CMR data, including
    irreducible pore fluid (BVI), clay bound water (CBW), producible fluid (FFI),
    irreducible water saturation (Swirr), logarithmic mean of T₂ relaxation time (T₂LM),
    and permeability. To this end, well logs from 14 Western Australian wells were
    gathered, of which 80% were used for model training and validation and the remaining
    20% for testing purposes. Upon comparing the outcomes, it was revealed that the
    Adaptive Boosting (AdaBoost) model demonstrated the most notable results, with
    R² values exceeding 0.9 for the blind set. These findings'
  merge: -1
  img_proc: true
