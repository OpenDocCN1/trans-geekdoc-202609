    # 3.2 Local Geological Overview of the Opunake Field


    The Opunake Field is an oil and gas field located in the Kapuni Formation, the
    uppermost formation in the Taranaki Group. The field primarily comprises sandstones
    and siltstones, the primary reservoirs for oil and gas. The field is also rich
    in coal, mined and used for energy production (McBeath, 1977).


    The field is located in an area with high tectonic activity and has experienced
    several earthquakes and volcanic eruptions in the past. These events have significantly
    impacted the geology of the field, including the folding and faulting of the rock
    formations and the alteration of the sedimentary layers. The geological history
    of Opunake Field can be divided into three main periods: the Paleozoic, the Mesozoic,
    and the Cenozoic.


