- pgno: 80
  md: 'Data from three wells in the Volve oil field is used in this study. The input
    features and their relevance will be evaluated using the laboratory-verified justification
    of their influence on Vs and Vp prediction. After establishing a suitable dataset
    of relevant input variables, different machine learning models will be employed
    to predict Vp and Vs. The best-performing model based on several statistical metrics
    will then be optimised using the Bayesian Optimisation (BO) algorithm.


    # 3. Background of Machine Learning Regression Models


    This study builds on previous research in which multiple procedures and strategies
    were utilised to forecast Vs or Vp utilising available input information. Machine
    learning is becoming increasingly popular as academics move away from empirical
    correlations. Individual well log parameters provide crucial information about
    Vp and Vs. However, when particular subsets are employed, the outcomes may be
    estimated more precisely. In some instances, researchers use the filter method
    to select critical features, while others use wrapper methods, intrinsic techniques,
    and metaheuristics algorithms to select relevant input features. This shows that
    there is no standard set of features for this prediction. These strategies, however,
    are based on statistical measurements rather than domain knowledge. As such, understanding
    Vp and Vs and how subsurface parameters influence their measurements is utilised
    to solve this prediction problem. The appropriate features selected will subsequently
    be used as input features. Several machine learning models based on Decision Tree
    learning will be used to predict Vp and Vs.


    # 3.1 Decision Tree Conceptual Overview


    The Decision Tree algorithm has been around for decades, but it is currently known
    as Classification and Regression Trees (CART). CART, in contrast to other supervised
    learning models, can be used to address regression and classification problems
    (Tarafder et al., 2022). The aim of utilising a Decision Tree is to build a training
    model to estimate the value or class of an output variable by learning basic decision
    rules using prior data (Breiman, 2001). The CART model is the basis for major
    machine learning models like the Random Forests, bagged decision trees, and boosted
    decision trees. The CART model is a binary tree similar to algorithms and data
    structures, with no, single or two child nodes for each node. Assuming the parameter
    is numeric, a node defines a specific input parameter (X) and a split point on
    that parameter. The tree’s terminal (leaf) nodes include a target parameter (y)
    utilised to make a decision. Upon building the tree, the tree can be traversed
    by inserting a new row of data after each branch with splits until the final prediction.
    Making binary decision trees is a technique for splitting up the input data. A
    greedy'
  merge: -1
  img_proc: true
- pgno: 81
  md: "technique known as recursive binary splitting is utilised for the data partition.\
    \ Recursive binary splitting is a statistical approach in which all values are\
    \ aligned, and several strategic split points are explored and assessed using\
    \ an objective function. The split that results in the lowest cost is thence chosen.\
    \ Based on the objective function, all input parameters and feasible splits are\
    \ assessed and selected in a greedy approach.\n\nThe Disjunctive Normal Form concept,\
    \ also known as the Sum of Products (SOP), is the foundation of the CART model.\
    \ Various branches that end in the same class combine to form a sum for each branch\
    \ that extends from the tree’s root to a leaf node of that class. In implementing\
    \ the decision tree, determining which qualities should be regarded as the root\
    \ node at each level is the primary issue. Addressing this is referred to as attribute\
    \ selection. Different attribute selection techniques determine the attribute\
    \ designated as the root note at each level.\n\nThe preference to do judicious\
    \ splits has a major impact on tree’s reliability. There are specific selection\
    \ principles for CART models. To determine whether a node should be split into\
    \ multiple sub-nodes, different algorithms are used by CART models. The formation\
    \ of sub-nodes improves the uniformity of newly emerging sub-nodes (Gordon et\
    \ al., 1984). The decision to do strategic splits heavily affects a tree’s accuracy,\
    \ meaning that the integrity of the node grows with the target variable. The CART\
    \ model divides the nodes based on all available parameters and then chooses the\
    \ split that produces the most homogenous subnodes. The algorithm selection is\
    \ also chosen depending on the type of target data.\n\n# 3.1.1 Attribute Selection\
    \ Measures\n\nConsidering a dataset has N parameters, selecting which ones to\
    \ put at the root or various levels of the tree as internal nodes is a complicated\
    \ process. Choosing any node at random to be the root will not address the problem.\
    \ Choosing a random approach may result in bad outcomes with low precision. Researchers\
    \ worked on this attribute selection issue and proposed several approaches utilising\
    \ parameters such as (Breiman, 2001):\n\n+   1. *Entropy (E)*: The measure of\
    \ how random information is being processed is called entropy. High entropy makes\
    \ it difficult for inferences to be made from the data. A branch with zero entropy\
    \ is a leaf node, while a branch with a zero entropy needs to be split further.\
    \ Entropy for a parameter is expressed mathematically as:\n+   \n+   $$E(S) =\
    \ \\sum_{i=1}^{n} -p_i \\log_2 p_i \\tag{4.3}$$"
