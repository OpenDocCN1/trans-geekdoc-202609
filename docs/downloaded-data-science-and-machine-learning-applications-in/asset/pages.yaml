  md: '# CHAPTER 3


    # Application of a Novel Stacked Ensemble Model in Predicting Total Porosity and
    Free Fluid Index via Wireline and NMR Logs


    Daniel Asante Otchere¹,²


    # 1. Introduction


    With the growth in energy needs and advances in drilling and hydraulic fracturing
    techniques, the extraction of hydrocarbons from reservoirs innovatively has become
    a focus for exploration and exploitation in recent years (Li et al., 2022). Therefore,
    a complete understanding of bound and moveable fluids is critical for accurately
    evaluating net pay reservoirs and optimising completion, production, and enhanced
    oil recovery activities (Otchere et al., 2022b). In reservoir terms, pore fluids
    refer to the fluid distribution within the pore structure of the reservoir rock.
    There are two main types of pore volume fractions: bound fluid, the fluid that
    is physically trapped within the pore structure and cannot be easily displaced;
    and free fluid volume, the fluid that can easily move within the pore structure.
    Knowing the specific distinction between the proportion of bound and free fluid
    in a reservoir is essential for predicting the ease of fluid flow and production
    (Cai and Hu, 2019). For example, a reservoir with a higher proportion of bound
    fluid may require more aggressive enhanced recovery methods to increase'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'production. Understanding pore fluid type and volume fractions is crucial for
    effective reservoir management and optimisation (Cai and Hu, 2019; Otchere et
    al., 2021c).


    Numerous approaches have been formulated to ascertain the fluid distribution in
    a reservoir. The most appropriate and accurate method to measure pore types in
    reservoirs depends on the specific characteristics of the reservoir being studied.
    One standard method is the mercury injection capillary pressure (MICP) analysis,
    which measures the amount of mercury that can be injected into the pore structure
    at a given pressure (Peng et al., 2017). The amount of mercury that can be injected
    into the pore structure is directly related to the proportion of free fluid in
    the reservoir. MICP is a widely used method for measuring fluid distribution,
    and it is considered one of the most accurate and reliable methods for measuring
    free fluid volume (Dugan, 2015; Mitchell et al., 2008). Another method is nuclear
    magnetic resonance (NMR), which can provide a detailed description of the pore
    structure and fluid distribution within the reservoir (Xu et al., 2015). NMR is
    particularly useful for complex pore structures and can provide information on
    the distribution of multiple fluid phases. Additionally, NMR is a non-destructive
    method that uses magnetic fields and radio waves to measure the magnetic susceptibility
    of the pore fluids (Branco and Gil, 2017; Otchere et al., 2022a). The magnetic
    susceptibility of the pore fluids is used to distinguish between the bound and
    free fluid in the reservoir, making it a valuable tool for measuring pore fluid
    types and volume fractions on a large scale (Heaton et al., 2000).


    Both methods, however, have their inherent set of challenges. A fundamental challenge
    in measuring or determining pore type is the complexity of the pore structure.
    Reservoirs can have a variety of pore sizes and shapes, and different methods
    may be more effective for different types of pore structures. One challenge associated
    with using MICP is that it requires a core sample from the reservoir, which can
    be costly and time-consuming. Additionally, the availability of core samples may
    be limited, making it difficult to obtain enough samples to provide a representative
    analysis of the reservoir (Wu et al., 2021). Also, MICP is a destructive method,
    where the core sample is destroyed after analysis, which could make it difficult
    to repeat the analysis for the same sample if needed. Another challenge is the
    sensitivity of MICP to the saturation of the fluid, requiring the fluid to be
    in a state of equilibrium, which may not be the case in some reservoirs. This
    challenge can affect the accuracy of the results obtained from MICP analysis (Wu
    et al., 2020). On the other hand, NMR is sensitive to the reservoir’s porosity
    and cannot provide quantitative measurements of pore types. Furthermore, NMR is
    responsive to the existence of clay minerals, which can impact the precision of
    the outcomes (Elsayed et al., 2020). Table 3.1 summarises the unique advantages
    and limitations of these two techniques.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Table 3.1. Summary of MICP and NMR techniques identifying key advantages, limitations,
    and measurement principles.


    | Technique | Measurement Principle | Developed by | Advantages | Limitations
    | Observations |

    |---|---|---|---|---|---|

    | Mercury Injection Capillary Pressure (MICP) | Injects mercury into the pore
    structure at a given pressure, and the amount of mercury that can be injected
    into the pore structure is directly related to the proportion of free fluid in
    the reservoir. | Purcell (1949) | Accurate measurement of free fluid volume (FFV)
    | Requires a core sample | MICP is considered one of the most accurate and reliable
    methods for measuring FFV, but it is a destructive method. |

    | Nuclear Magnetic Resonance (NMR) | Uses magnetic fields and radio waves to obtain
    detailed images of the fluid distribution within the reservoir. | (Bloch, 1946)
    | Provides detailed images of the pore structure and fluid distribution within
    the reservoir. | Not able to provide quantitative measurements of pore types and
    sensitive to the presence of clay minerals. | NMR imaging is particularly useful
    for complex pore structures and can provide information on the distribution of
    multiple fluid phases. |


    Overall, understanding pore volume fraction is crucial for effective reservoir
    management and optimisation. However, accurately measuring and determining porosity
    and its associated producible volume can be challenging due to the complexity
    of the pore structure and the limited availability of core samples.


    The measurement of pore volume fraction is complicated and challenging. Many researchers
    in this discipline are always experimenting with new ideas and methodologies.
    Many researchers have been drawn to estimate pore volume fractions and total porosity
    using NMR data over the last two decades. This preference for NMR is owing to
    its non-invasive nature (Otchere et al., 2022a). Artificial intelligence (AI)
    can potentially revolutionise how pore volumes are predicted in reservoirs. One
    potential application is using AI to predict pore volumes measured by NMR, using
    wireline logs as input.


    Conventional wireline logs are ubiquitous in all wells drilled and provide essential
    information on the formation properties of the reservoir. These logs exhibit an
    intricate and nonlinear correlation with the distribution of pore volume fractions.
    On the other hand, NMR measurements provide information on the fluid distribution
    within the pore structure. Nonetheless, this approach'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'incurs significant expenses and may not appear practical to execute in every
    well during periods of low oil prices (Otchere et al., 2022a). By combining these
    two types of data, AI can be used to predict porosity and volume fractions with
    a high degree of accuracy. An ideal way to accomplish this is through the use
    of machine learning and data analytical techniques, which can be trained on a
    large dataset of wireline logs and NMR porosity and volume fraction measurements.
    These techniques exhibit resilience to noise and demonstrate a high efficacy in
    identifying intricate or nonlinear patterns or features indicative of specific
    input data and pore volume fraction (Otchere et al., 2021a). Once trained, the
    AI model can then be used to predict total porosity and pore volume fractions
    for new reservoirs based on the wireline logs.


    Utilising wireline logs to assist in estimating this indispensable property is
    comparatively more economical and time-saving and provides real-time information
    than running NMR logs in all wells. As such, considering current oil prices, the
    demand for an inexpensive and reliable field-scale technique for quantitative
    porosity and pore volume fraction measurement has been of interest. Hence, this
    study endeavours to develop an AI-based model that can accurately predict the
    porosity and producible pore volume fraction in a carbonate gas reservoir using
    wireline logs as input and NMR measured total porosity and FFV as the target output.
    This study aims to provide a more efficient and accurate method for reservoir
    characterisation and management.


    # 2. Nuclear Magnetic Resonance


    # 2.1 Concept and Application


    Atomic nuclei with an odd number of protons and neutrons exhibit NMR when subjected
    to magnetic fields at a specific resonance frequency (Coates et al., 1999). The
    proton in hydrogen has a strong magnetic moment due to its abundance in both water
    and oil, which is the outcome of the nucleus’ angular momentum. At that point,
    the proton acts like a spinning bar magnet. In an external magnetic field, it
    undergoes polarisation, which manifests as a quantifiable quantum feature known
    as the induced frequency (Larmor frequency) (Amani et al., 2017). Figure 3.1 shows
    a simplified representation of the reaction of a nucleus to an external magnetic
    field (Otchere et al., 2022a).


    Combinable Magnetic Resonance (CMR) tool is a recently developed technique that
    is used for porosity partitioning to determine the bound fluid volume (BFV) and
    FFV in reservoirs (Gubelin and Boyd, 1997). CMR can be used in conjunction with
    NMR to provide a more accurate and complete picture of the fluid distribution
    within the reservoir. CMR measurements are particularly useful in reservoirs with
    high water saturation, where other techniques may not be effective. Additionally,
    CMR can provide information on both bound and FFVs, which is not possible with
    other techniques.'
