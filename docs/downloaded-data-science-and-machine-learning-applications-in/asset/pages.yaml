- pgno: 99
  md: 'shear sonic log in terms of accuracy. The assessment criterion indicated the
    models’ likelihood of fitting held-out data. The models’ accuracy, precision,
    and dependability were further evaluated based on the MAE, MAPE, RMSE, and R²
    on the held-out data. The findings are outlined as follows:


    +   1. The input data were clearly justified to understand their influence on
    sonic velocity.

    +   2. The Extra-Trees model outperformed the Random Forest and Decision Tree
    models in terms of precision, robustness, and probability of fit.

    +   3. The BO algorithm made a marginal but meaningful improvement in the accuracy
    of the Extra-Trees model.

    +   4. In the multi-output regression prediction, the predicted Vs in the sandstone
    interval exhibited the highest error on the test data.

    +   5. The error in the sandstone interval is due to the influence of different
    formation fluids in the reservoir zone. This error was minimised by retraining
    the model with all the data from Wells A and B.

    +   6. After deploying the model on Well C, the predicted Vs and Vp matched the
    influence of different fluid saturations in the three different formation types.


    The proposed methodology offers the geothermal, fluid sequestration, and oil and
    gas industry a cheaper and time-efficient alternative to running the sonic logging
    tool in every drilled well. It also provides a way to measure Vs and Vp in older
    wells that were not previously measured.


