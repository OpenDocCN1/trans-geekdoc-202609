  md: '# 2. Brief Overview of Intelligent Well Completion


    A smart well completion system improves production by gathering, transmitting,
    and analysing data related to completions, production, and reservoirs. This allows
    for remote control of specific zones, ultimately leading to increased efficiency
    in the reservoir. The system helps to boost production through the blending of
    production from different zones, enables better management of water injection
    and breakthroughs, and reduces both capital and operating expenses by minimising
    the number of wells needed and optimising production without costly interventions.
    The smart well system is designed to operate in various environments and can include
    a combination of devices for zonal isolation, interval control, downhole control,
    permanent monitoring, and temperature sensing, as well as software for data acquisition
    and management.


    # 2.1 ICV Setting and Determination


    Multiple production simulations should be conducted to optimise the design and
    sizing of ICVs. The ICV size has a significant impact on the production rate,
    which can vary widely across different fields. To achieve specific goals, such
    as maximising oil recovery or minimising water production, it is essential to
    determine the optimal configuration for the ICVs. This can be accomplished by
    designing the ICVs in a way that ensures each setting yields a unique production
    rate. This approach greatly influences the optimisation process, as the resulting
    data provides valuable insights into the optimal ICV configuration for achieving
    the desired outcome.


    In the domain of ICV design, the process for determining the optimal design is
    usually contingent on the production capability of each lateral. However, in practice,
    several oil companies have streamlined the process by employing the average field
    production rate as a basis for design, rather than individual lateral rates. This
    approach is often deemed more expedient, particularly for logistical purposes,
    including maintenance and surveillance. For this research, ICV size was selected
    based on individual zonal flow at a particular setting, commingled flow from two
    zones iteratively and commingled flow from all three zones whiles monitoring downhole
    pressures. The ICV settings were discretised so that each setting resulted in
    production rates corresponding to zonal pressures. Several factors taken into
    account in the design of the ICV include:


    +   1. Simulations were run to establish the minimum and maximum production rates
    for each zone where all zones were commingled and when a single zone was produced
    sequentially.

    +   2. The discretisation of the ICV region was accomplished by establishing predefined
    intermediate settings (ranging from 0 to 10) that correspond'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'to the minimum and maximum production rates. The ICV region was segmented into
    these settings to provide a quantitative representation of the valve’s opening,
    where 0 denotes complete closure and 10 denotes complete openness.


    +   3. In accordance with downhole pressure monitoring, the maximum production
    rate can be achieved by adjusting the ICV (intelligent completion valve) to its
    highest setting range (7–10), whereas the minimum ICV setting range (0–3) results
    in a production rate of zero.

    +   4. If production rates significantly differed between zones, different sized
    ICVs were used appropriately, although this may not be a viable technique.

    +   5. The new ICV settings were tested on different base cases of all zones producing
    and one zone producing individually. If more than half of the ICV settings in
    a zone gave the same production rate, the maximum production rate was reduced.
    Also, the cases simulated were to capture instances where a particular zone experienced
    production issues (gas/water breakthroughs) and had to be shut in. Although the
    data was applied to an injection, this approach was simulated considering a production
    well to capture various scenarios and production issues.


    # 2.2 Literature Review of ICV Innovations and Machine Learning Applications


    In literature, ICVs have been widely studied as a means of optimising production
    in oil and gas reservoirs. These valves are used to manage the inflow of fluid
    into a well, allowing for selective control of production from different zones
    in the reservoir. This selective control enables effective management of water
    injection, gas and water breakthrough, and individual zone productivity, which
    can help increase ultimate recovery and reduce capital and operating expenditures.


    AI has been successfully implemented in the petroleum industry, including reservoir
    characterisation (Otchere et al., 2021), seismic interpretation (Otchere et al.,
    2022c), reservoir engineering (Otchere et al., 2022a) and many other sectors.
    Machine learning techniques have also been applied to the optimisation of ICV
    valves. Researchers have used machine learning algorithms to model the relationship
    between ICV settings and production rates and to predict the optimal ICV settings
    for a given set of conditions. These models can take into account various factors
    such as wellbore geometry, fluid properties, and reservoir characteristics.


    Various techniques have been suggested to enhance the productivity of smart wells.
    For example, Mubarak et al. (2008) employed an intensive production test to reduce
    water production from a trilateral smart well, where the laterals were found to
    be sensitive to ICV settings. Different settings'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'were observed to be practical for different sources of water production. Similarly,
    Jalali et al. (1998) improved the delivery rate of a smart gas well by unchoking
    the bottom layer gradually after producing the top layer without any restriction.
    In addition, Yeten et al. (2002) employed a gradient-based approach to optimise
    the cumulative oil recovery from smart wells. Naus et al. (2006) put forward a
    methodology to determine the changes in flow rate due to ICV settings and tested
    it in two reservoirs with the objective of achieving maximum ultimate recovery.
    Furthermore, Brouwer and Jansen (2002) evaluated the impacts of smart completions
    with several well targets and limitations, while Alhuthali et al. (2010) used
    smart wells and optimal rate control for waterflood optimisation. Yeten (2003)
    proposed a general methodology that uses genetic algorithms, hill climbing, and
    artificial neural networks (ANNs) to optimise well type, trajectory, location,
    and ICV settings. Another study, conducted by Behrouz et al. (2016), is the use
    of an intelligent well technology to develop a new method for selecting and ranking
    candidate wells and fields, determining interval control valve (ICV) size, and
    optimising ICV settings. An efficient ICV setting optimisation in an intelligent
    well was proposed, which maximised cumulative oil, minimised water production
    or conducted both. Real case studies were considered to demonstrate the effectiveness
    and robustness of the proposed methodology, resulting in a considerable improvement
    in the objective function using the developed methodology.


    Huang et al. (2011) aimed to develop an intelligent well completion system in
    China by optimising downhole monitoring, data transmission, intelligent optimisation,
    and production control systems. The authors developed an ICV system with proprietary
    internet protocol (IP) and created the first set of intelligent completion system
    (ICS) in China for measurable and optimisable oil well exploitation. Results showed
    that the system is stable and reliable, resulting in a 10.5% increase in oil production.
    Malakooti et al. (2020) proposed an integrated control and monitoring (ICM) algorithm
    that can enhance production from multi-zone I-wells. The algorithm employs a two-level
    optimisation process to maximise either projected zonal or oil production reliability.
    The authors validated the algorithm by subjecting it to a commercial transient
    wellbore simulator. The simulation results demonstrate that the ICM algorithm
    can optimise oil production while reducing the number of flow tests required.
    Furthermore, the study highlights that the exact estimation of zonal properties
    is not essential to achieve maximum oil production in multi-zone I-wells. The
