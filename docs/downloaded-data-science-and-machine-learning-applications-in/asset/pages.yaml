    \left(ORF_{predicted} - \overline{ORF}_{predicted\ mean}\right)^2}} \right)^2
    \quad (7.19)$$


    $$MSE = \frac{1}{n} \sum_{i=1}^{n} \left(ORF_{measured} - ORF_{predicted}\right)^2
    \quad (7.20)$$'
