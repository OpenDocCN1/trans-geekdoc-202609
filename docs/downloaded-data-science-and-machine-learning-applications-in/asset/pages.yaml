  md: 'The performance of both models was evaluated using three commonly used image
    quality metrics: PSNR, SSIM, and spectral analysis. PSNR measures the ratio between
    the maximum possible power of a signal and the power of the noise that corrupts
    the signal. SSIM measures the structural similarity between two images, while
    SNR measures the strength of a signal relative to the amount of noise present
    in the signal.


    The evaluation results showed that both models could enhance the images to a certain
    extent. However, the GAN model performed better than the conventional CNN model
    in terms of all three metrics. The GAN model achieved a higher PSNR, SSIM, and
    SNR value than the conventional CNN model, indicating that the generated images
    were of higher quality and contained less noise.


    In conclusion, the study successfully demonstrated the use of AI for image enhancement
    using CNN models. Both traditional CNN and GAN models were able to enhance the
    images. However, the GAN model performed better in terms of all three image quality
    metrics. The GAN model showed superior performance in terms of PSNR, SSIM, and
    SNR, which means it was able to generate images with less noise and more structural
    similarity. Based on these results, it can be concluded that the GAN model is
    a better choice for image enhancement tasks. The proposed methodology aims to
    encourage the utilisation and exploration of deep learning techniques in seismic
    interpretation.


