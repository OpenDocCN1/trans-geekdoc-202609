- pgno: 244
  md: '# 4.2 Support Vector Machine (SVM)


    The concept of support vector machines was first introduced in the early 1960s
    but later in the 1990s, its application became popular since it was able to outperform
    the classification problems of the ANN approach (Zendehboudi et al., 2018). SVMs
    are ML algorithms with kernel functions used for regression (SVR; Fig. 10.5a)
    and classification (SVC; Fig. 10.5b) analysis as shown in Fig. 10.5. SVMs have
    contributed widely to various applications such as regression, classification
    and forecasting. Some major advantage of SVMs is their ability to handle noisy
    data and high dimensional data (Furey et al., 2000). Also, the simplest structure
    of SVMs is capable of classifying two linearly-conceivable sets of data classes
    taking into consideration linear hyperplanes with maximum margins from both data
    classes.


    Considering a classification SVM with 2-dimensional space class (class 1 and 2)
    that can be handled as a linear classification as shown in Fig. 10.5b. Assuming
    an n input data represented by a = {a1, a2,..., an} a tagged variable yn which
    falls between −1 and +1 and can help classify the input variable. In this case,
    the ith input can fall into class 1 when yn = +1 and class 2 when yn = −1. Given
    a vector w which is perpendicular to the decision boundary as shown in Figure,
    the decision function can be expressed as:


    $c(a,w,e)=w\cdot a+e=\sum_{i=1}^{n} w_i a_i + e$ (10.10)


    where c is the decision function, a represents the input vector, w denotes a vector
    perpendicular to the separating line, and e is a bias.


    ![](img/80b94770dd572ad559c67fa9921bb887_244_0.png)


    ![](img/80b94770dd572ad559c67fa9921bb887_244_1.png)


    Fig. 10.5. SVM architecture showing: (a) regression SVM/RVM in a high dimensional
    space; and (b) supervised support vector creating a linear relationship between
    two non-linear data making use of optical hyperplane.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "SVM classification problems correspond to the maximisation of the margins separating\
    \ the two classes (Zendehboudi et al., 2018). To help minimise this, a Lagrange\
    \ multiplier (α_i ≥ 0) is introduced to convert from a constrained to an unconstrained\
    \ problem. Also, SVM can classify any given input in higher dimensional space\
    \ utilising a transformation such as sigmoid, polynomial, and radial basis functions\
    \ in the kernel when the classes are not linearly separable using a linear hyperplane\
    \ (Zendehboudi et al., 2018). Considering the kernel function, a vector x_i and\
    \ x_j are introduced into the objective function. Since the optimisation depends\
    \ on the dot product of the sample vector, the conversion to feature space can\
    \ be abridged to find a kernel function K(x_i, x_j). The mathematical expression\
    \ for the objective function can be expressed as;\n\n```\nG = \\sum_{i=1}^n \\\
    alpha_i - \\frac{1}{2} \\sum_{i=1}^n \\sum_{j=1}^n y_i \\alpha_i K(x_i, x_j) y_j\
    \ \\alpha_j \n(10.11)\n```\n\n# 4.2.1 Machine Learning (ML) Application in Petrophysical\
