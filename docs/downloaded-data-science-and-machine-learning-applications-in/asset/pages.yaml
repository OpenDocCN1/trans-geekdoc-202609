    # 4.1.1 ANN Application in Petrophysical Reservoir Prediction


    Mohaghegh et al. (1996) introduced a new application of ANN to characterise the
    heterogeneity of a reservoir. They encompassed the application of a three-layer
    feed-forward Back Propagation Neural Network (BPNN) approach (Fig. 10.3a). The
    authors proposed using a General Regression Neural Network (GRNN) to first identify
    the optimal network design to achieve a steady state in a shorter time. The GRNN
    lacks reproducibility with different datasets when trained with a different dataset.
    Therefore, the GRNN was used by the authors to identify the optimal network design
    structure and the BPNN was used to obtain the final results. Upon the high reservoir
    heterogeneity, a good fit was achieved by comparing it with the actual laboratory
    measurement from core logs. Hamada and Elshafel (2010) presented a successful
    implementation of the ANN to determine the Phi and K of the sand gas reservoir
    by exploiting'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'the transverse relaxation time of Nuclear Magnetic Resonance (NMR) T₂ and well
    logs. They used the ANN model which involved the NMR T₂ spin value as well as
    RHOB and resistivity logs to predict the Phi and K of the test wells. The ANN
    paradigm showed a good correlation with the core Phi and K values and that of
    the NMR predicted Phi and K for the test wells. Singh et al. (2016) employed the
    well-known BPNN to predict Phi for a gas field. Three well logs (RHOB, sonic (DT),
    and deep resistivity log) were used as the input variable for Phi estimation using
    one hidden layer. The authors correlated the predicted Phi to that of the Phi
    estimated using an empirical approach which entails the use of Neutron (NPHIL)
    and RHOB log. A correlation of 0.97 was obtained which indicates a good prediction.
    The robustness of the model was validated by testing against other offset wells
    using core measurement. The model reached a good correlation coefficient of 0.994
    for the Phi estimated.


    Hele and Bhatt (2002) also achieved excellent results when the authors used ANN
    to predict fluid saturation using wireline data while Elshafei and Hamada (2009)
    successfully estimated reservoir properties achieving an excellent correlation
    to core data using ANN. Al-Bulushi et al. (2009) applied ANN to estimate a nonlinear
    Sw using open-hole log data for a sandstone reservoir. From their results, they
    established a good Root Mean Square Error (RMSE) and correlation using the wireline
    logs. Zabihi et al. (2011) similarly designed an ANN model to predict K damage
    caused by the accumulation of barite sulfate scale in core voids with good precision
    during core flooding. The model took into account data from a case study to examine
    the K reduction owing to the build-up of barium sulfate in Malaysia and Berea
    sandstone cores. Results confirmed a high accuracy prediction of the modelled
    ANN to the measured permeability values. Nyein et al. (2018) developed an ANN
    paradigm for Sw prediction that included five (5) input parameters (GR, ILD, RHOB,
    photoelectric factor (PEF), and NPHI) and multiple hidden layer nodes. Likewise,
    the Mean Square Error (MSE) for the model’s training and testing was 0.0109 and
    0.012, respectively. This model achieved a decent correlation with core information.
    Likewise, the authors also utilized ANN in predicting Phi and classified the various
    lithology from the well logs. The model applied for estimating Phi inculcated
    six wireline logs (GR, ILD, RHOB, NPHI, PEF, and DT) as inputs with two latent
    nodes. The resulting Phi estimated matched with core data with MSEs of 0.001412
    and 0.00154 for training and testing, respectively. The good prediction highlights
    the importance of using impactful data input to train the ANN algorithm for a
    specified output variable (Table 10.2).'
