    # 4. Conclusions


    In summary, this research has contributed to the development of an optimised artificial
    lift system for the Jubilee Field, resulting in increased deliverability of all
    wells. Additionally, the application of AI techniques, such as BPNN and RBFNN,
    have demonstrated improved prediction accuracy for well performance. These findings
    have important implications for the optimisation of oil field production, and
    the methodology developed in this study can be applied to other fields to improve
    efficiency and productivity. The following conclusions can be drawn from the study.


    +   - Successfully screen and design an optimum artificial lift system (gas lift),
    for the field under investigation.

    +   - Comparing the average daily base flow rates calculated using the production
    history of the field to the results obtained after applying gas lift modelling
    with an increase in the deliverability of all the wells. There was an 83.63% increase
    for Well A and a 61.64% increase for Well B.

    +   - RBFNN gave the best prediction for the tubing head pressure in the Jubilee
    Field than the BPNN model used with an R of 96.290% and MAPE of 0.02764.

    +   - BPNN had less computational time due to the number of neurons used as compared
    to the RBFNN model.

    +   - Artificial lift method is recommended at the start of production for the
    field nearby of Jubilee Field which is the Pecan Field operated by Aker Energy
    to avoid technical problems faced in the Jubilee Field.'
