- pgno: 280
  md: "$$q=\\frac{J_f^{*}\\,\\bar{p}_f}{1.8}\\left[1-0.2\\frac{p_{wf}}{\\bar{p}_f}-0.8\\\
    left(\\frac{p_{wf}}{\\bar{p}_f}\\right)^2\\right] \\tag{11.2}$$\n\n+   where,\n\
    +   \n+   - $\\bar{P}_f$ = reservoir pressure in a future time.\n+   - $J_f^{*}$\
    \ = future productivity index\n+   - $J_p^{*}$ = present productivity index\n\
    +   - $k_{ro}$ = relative permeability to oil\n+   - $B_o$ = oil formation volume\
    \ factor\n+   - $\\mu_o$ = oil viscosity\n+   - $p_{wf}$ = bottomhole pressure\n\
    +   - $q$ = flowrate\n\n# ### 2.3 Outflow Performance Relationship Production\
    \ Forecast\n\nVertical lifting performance (VLP) also known as Outflow Performance\
    \ Relationship (OPR) is a description of bottomhole pressure as a function of\
    \ flow rate. Different correlations for VLP are provided for outflow performance\
    \ analysis.\n\n# ### 2.4 PROSPER Procedure for Well Model Set-Up\n\nPROSPER (Production\
    \ and System Performance) was used to build a separate model for each component\
    \ of a well system that contributes to overall performance and then enables each\
    \ model subsystem to be verified by performance matching. The program, therefore,\
    \ guarantees the exactness of the calculation. When the model system is modified\
    \ to real data, PROSPER is reliably employed to simulate different scenarios based\
    \ on surface production data and to anticipate the reservoir pressure.\n\nPROSPER\
    \ has five main sections. They are the Options Summary, PVT Data, IPR Data, Equipment\
    \ Data, and Analysis Summary. The following steps were used to build the model,\
    \ perform sensitivity analysis, and design an optimum gas lift model.\n\n# ####\
    \ Step 1: Options Summary\n\nWell characteristics, fluid type, well completion,\
    \ and desired lift method are defined in this section as shown in Table 11.1.\
    \ The Black Oil model is selected since it is suitable for a variety of applications\
    \ and hydrocarbon systems."
