    # 3. Fractal Analysis in Reservoir Characterisation


    Many numerical fashions have been used to acquire reservoir properties which have
    facilitated information on the relationship between reservoir properties and the
    components of reservoir decision programs. Fractals have emerged as one of the
    effective tools for quantifying complicated reservoir structures and are extensively
    used to model pore shape and flow phenomena in conventional and unconventional
    reservoirs (Bian et al., 2020). Hewett (1986) initially developed thoughts of
    fractal geometry to reservoir descriptions and evaluations. Hewett and Bahrens
    (1990) confirmed how the distribution of reservoir properties may be regarded
    as a consciousness of a random function by advocating two uses of condition simulation.
    They utilised the flow process and properties of various scales in the reservoir
    and assessed the uncertainties associated with the final results using incomplete
    data sampling.


    Sahimi (1993) handled the maximum essential elements of flow in porous rock, from
    modelling to fractals, percolation and current developments. Heiba et al. (1992)
    modelled the percolation theory of two-phase relative permeability, whilst Katz
    and Thompson confirmed that the porous rock'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# # 214 Data Science and Machine Learning Applications in Subsurface Engineering


    interface of numerous sandstones is fractal. Shook et al. (1992), upon defining
    scaling as the extrapolation of the outcome of one scale to another scale, Li
    and Lake (1995) implemented the concept to develop a scaling procedure for a heterogeneous
    rock. Costa (2006) developed a fractal predictive model for permeability by incorporating
    the concept of fractal geometry into the fundamental Kozeny-Carmen equation. The
    developed model was then used to predict the permeability of a variety of porous
    materials and discovered that the version was more adaptable to experimental results
    than other models. Zheng and Li (2015) developed a fractal permeability model
    for sandstone reservoirs that is entirely based on a fractal capillary model and
    Darcy’s law. The version is made up of a fractal Kozeny-Carmen constant that represents
    the microstructural parameters of the pores. Yu and Cheng (2002) created the fractal
    permeability model for heterogeneous porous media and delivered the set of rules
    for the fractal size of the pore dimension and the fractal size of tortuosity
    primarily based on the box-counting method. Bian et al. (2020), analyse how microporous
    systems affect the permeability of clay silt reservoirs according to the relationship
    between permeability and pore structure parameters. In addition, Dong (2020) advanced
    a predictive permeability model for low-permeability sandstone that takes into
    consideration the microstructural parameters and tortuosity. Upon comparing the
    two predicted model outputs to the core measured permeability, a relative average
    error of 8% was obtained. The reviewed literature has proven that fractal theory
    has been validated to be another good prospect for enhancing reservoir characterisation
    and can also be used to assess field-wide project performance.


    # ## 4. Application of Artificial Intelligence in Petrophysical Property Prediction


    In recent years, the use of technology has grown widely and the application of
    such technology has helped solve problems in the petroleum sector. Computer-based
    intelligence like ANNs and Machine Learning (ML) has helped solve petroleum-related
    problems such as the nonlinearity problems (O uenes, 2000; Kaydani et al., 2012)
    associated with the traditional correlations. It has higher capabilities for recognising
    the irregularities in the multiresolution of the individual variables that are
    not tended to by conventional relationships. Also, in using computer-based intelligence,
    there are no required assumptions to be made (Otchere et al., 2021a), and its
    operation is based on numerical models which can identify irregularities and help
    lessen noise present in the dataset (Saikia et al., 2020). Olson (1998), highlighted
    in his study that, the application of computer-based intelligence for formation
    evaluation is important to establish a reliable linear relationship'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'that exists between the estimated reservoir elastic properties from the wireline
    logs and corresponding sampled fluid information. The application of computer-based
    intelligence provides a different perspective on the implementation of well logs
    and also brings to light more details contained in these input logs (e.g., the
    relationship between Gamma Ray (GR), Deep resistivity (ILD), and Density (RHOB)
    with formation K). In this section, AI techniques such as ANN, SVM and fuzzy logic
    (FL) will be discussed by providing the main theoretical framework and some applications
    in reservoir characterisation.


    The application of ML algorithms has been applied to several quantitative analyses
    of well logs for the estimation of reservoir properties (Helle et al., 2001; Huang
    et al., 1996; Huang and Williamson, 1997). This learning approach has proved to
    be simple and has provided an accurate solution for the valuation of reservoir
    properties using several well logs. Nikravesh et al. (2003) noted that the computational
    process for the estimation of the reservoir parameters seems to be more reliable
    because they are independent of the uncertainties which come with the logging
    process.


    For the various AI concept and theories, Otchere et al. (2021a) have presented
    an in-depth report on the mathematical structure of some of the AI algorithms
    such as ANN, SVM, and Relevance Vector Machine (RVM). Likewise, Saika et al. (2020)
    and Otchere et al. (2021a) provides a detailed overview of the structure of AI
    algorithms and their advantages and limitations.


    # 4.1 Artificial Neural Networks (ANNs)


    In the early 1940s, McCulloch and Pitts (1943) idealised a mathematical model
    as a representation of the human biological neural system. This idea of the mathematical
    model is termed the ANN. The neurons of the human body are dedicated to information
    processing. These neurons are made up of cell body branches tree-like axons (which
    are signal transmitters) and dendrites (which are signal receivers). The cell
    body also includes a nucleus which produces chemicals required for the neuron.
    The chemical produced by the nucleus is then transferred between a neuron and
    its adjacent target cell through the synaptic connections found at the end of
    the axon branch (which are termed axon terminals). In the ANN architecture, the
    input signals (x₁, x₂, ..., xₙ); which serves as the chemical product or the electrical
    signal) are transmitted along the axons to the synaptic connections. At this point,
    weights (w₁, w₂, ..., wₙ) will be applied to the signals from the axon. These
    weights control the direction and influence of the cells. The product of the weight
    and signal (w₁x₁, w₂x₂, ..., wₙxₙ) will be transferred from the dendrites to the
    neuron cell. At the neuron cell, a summation of all the products of the weights
    and signals from the dendrites is made. A signal is then fired along the axon'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'if the summation value exceeds a threshold. During this stage, an activation
    function (f) performs a transformation on the signal received from the axon and
    influences the frequency of the final signal. Some common activation functions
    employed in the design of an ANN architecture are sigmoid, gaussian, tangent hyperbolic,
    piecewise linear, and others (Zendehboudi et al., 2018). A summary of a single-neuron
    ANN architecture is demonstrated in Fig. 10.2. Also, Fig. 10.3 presents another
    conceptual model of an ANN and Ensemble architecture indicating the various stages
    of operation. The mathematical model of the single neuron computation with an
    x input is shown below


    $$j = \sum_{i=1}^{n} w_i x_i + a \tag{10.8}$$


    where x_i is the input signal from the axon terminal arriving at synapse i; w_i
    represents the weight of the synapse i; a is the bias term, and j is the summation
    of all input received from the dendrites. The output signal after is given by
    the equation:


    $$y = f(j) \tag{10.9}$$


    where y represents the neuron output signal transmitted through an axon to another
    perceptron, and f represents the activation transform function.


    The various categories of the ANN and the activation function employed on the
    input variable give room for the possible design of an ANN as shown in Fig. 10.4.
    Zendehboudi et al. (2018) presented in detail some of the possible and popular
    ANN designs.


