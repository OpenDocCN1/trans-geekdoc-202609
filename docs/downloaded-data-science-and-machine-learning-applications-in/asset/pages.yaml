    # 5. Methodology


    # 5.1 Data Analysis and Visualisation


    The data for this study were analysed and visualised to help understand how the
    input variables correlate to both targets. The Kendall correlation covariance
    heatmap was used to calculate the degree of correlation between the inputs and
    the targets. The NPHI, RHOB, and PHIF were the parameters that strongly correlated
    to both targets. The nonlinear distribution between the input and the targets
    is also illustrated in the pair plot in Fig. 4.4. Based on the nonlinear distribution,
    it is clear that none of the input parameters had a linear relationship to both
    targets, hence advising on the selection of nonlinear models for this study.


    # 5.2 Machine Learning Model Application


    As part of the machine learning process, the models are trained on data which
    were randomly sampled from the total dataset using the holdout cross-validation
    technique. This technique is used to assess the performance of models and prevents
    selection bias and overfitting by predicting the targets using unseen data (Otchere
    et al., 2022a; Tarafder et al., 2021). The holdout approach divided the data into
    a 90:10 split, making up 3,600 training and 400 testing data points. The selection
    of the split is to ensure that the majority of the data are used to train the
    model due to the heterogeneity of the subsurface but to ensure a suitable number
    unknown to the models is kept for testing. Different multi-output models were
    utilised in this study to determine which model accurately predicts the Vs and
    Vp accurately. This study utilised the same out-of-sample data to guarantee that
    all the models were predicted on equivalent data points. The performance of the
    models was assessed, in order of ranking, using the mean absolute error (MAE),
    root mean squared error (RMSE), mean'
