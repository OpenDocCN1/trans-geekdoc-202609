    # 3.3 Virtual Sensing for Gas Lifted Wells


    Gas lift (GL) is a method of artificial lift that uses an external source of high-pressure
    gas for supplementing the formation of gas to lift the well fluids. The principle
    of the GL is that gas injected into the tubing reduces the density of the fluids
    in the tubing and the bubbles have a ‘scrubbing’ effect on the liquids. Both factors
    act to lower the flowing bottomhole pressure (BHP) at the bottom of the tubing.


    One use of the case for VFM modelling is to compute uncorrelated estimates of
    the GL rate by using the GL flow control valve performance model.


    Figure 5.4 shows the control volumes of the gas lifted well. In this system, the
    inputs are manifold pressure, valve and casing pressure, while the output is GL
    rates.


    Applications of this research by Ziegel et al. (2014) discuss the design of a
    data-driven model that would support and optimize production operations during
    normal or gas coning. The data-driven model had a limited set of inputs such as
