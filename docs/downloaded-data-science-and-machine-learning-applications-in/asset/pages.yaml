    # 5. Results and Discussion


    # 5.1 Evaluation of Model Performance


    All of the models used in this study were evaluated using Akaike Information Criterion
    (AIC) to find the best fit for the data set. The assessment of the result shows
    that lower AIC values have a higher probability of fitting data compared to a
    larger AIC. The following factors were considered when comparing and selecting
    the best model. A difference in AIC findings across models is considered insignificant
    if it is less than 10, moderate between 10 and 50, significant between 50–100,
    and very strong if above 100. From the results, it can be asserted that the extra
    tree model ended up being the best for drilling fluid loss predictions. There
    was a difference of ~ 260 AIC when the extra tree model was compared to the random
    forest model representing the two models with the lowest AIC. Hence, the extra
    tree model showed a strong disparity and improved likelihood of fit compared to
    the other models. The tendency of the model to over- or underfit the data still
    exists, even though AIC can measure the degree to which the model converges to
    the data.


    The models’ performances were assessed based on the out-of-sample data results.
    Since the models were trained with the training data, any attempt to reproduce
    the values will likely result in high accuracy. On the other hand, a high training
    accuracy is not always desirable since it may overfit the data, collecting intrinsic
    noise and yielding a non-generalised model. Test accuracy based on the out-of-sample
    data is the proportion of correct predictions made by the models on data that
    has not yet been observed.'
  merge: -1
  img_proc: true
