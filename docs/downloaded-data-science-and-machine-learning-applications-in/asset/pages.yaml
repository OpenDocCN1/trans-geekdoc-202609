- pgno: 143
  md: 'the added benefit of storing the CO₂ underground. This can be an effective
    way to mitigate the impact of greenhouse gas emissions on the environment and
    provide a solution to the problem of global warming. Therefore, it is important
    for researchers, policymakers, and stakeholders to continue exploring the potential
    of CO₂-EOR as a long-term anthropogenic CO₂ storage application, while also working
    towards reducing greenhouse gas emissions and finding sustainable solutions to
    climate change.


    The dominant cause of observed anthropogenic global warming has been unrestricted
    CO₂ emissions from fossil fuel combustion due to the rising usage of fossil fuels
    in producing electricity and other manufacturing processes (Kharecha et al., 2008).
    Over the last 35 years, the oil and gas industry has made numerous technological
    advancements and operational practices for injecting CO₂ for enhanced oil recovery
    (Yong et al., 2016). CO₂ flooding has emerged as one of the most promising EOR
    methods because it uses readily available, naturally occurring CO₂ from reservoirs
    (Sun et al., 2017). Typical incremental oil recovery by CO₂ flooding ranges between
    5%–25% (Wu et al., 2021). The CO₂ injection method has traditionally been used
    in reservoirs with an oil gravity of less than 25 (Stosur, 2003).


    In the quest to find the optimal use of CO₂ in enhanced oil recovery for secondary
    and tertiary modes, several techniques have been employed. These techniques include
    miscible and immiscible CO₂ flooding, CO₂ huff-n-puff, and CO₂-foam injection,
    among others (Christensen et al., 1998). Amongst these techniques, the combined
    forms of EOR methods have proven to optimise significantly oil recovery synergistically
    (Afzali et al., 2018; Teklu et al., 2016). A lot of CO₂-LSWAG experiments (AlQuraishi
    et al., 2011; Dang et al., 2014; Naderi and Simjoo, 2019; Pourafshary and Moradpour,
    2019; Zolfaghari et al., 2013) in both carbonate and sandstone reservoirs have
    been performed which reported an incremental oil recovery from the initial oil
    in place but not much on reservoir scale.


    Hybrid low-salinity gas flooding has garnered significant attention from researchers
    in recent years (Jiang et al., 2010; Kulkarni et al., 2004) due to its many advantages,
    such as low cost, low minimum miscibility pressure, and environmental friendliness.
    CO₂ is frequently used as the injection gas in this hybrid approach because of
    these benefits (Ma and James, 2022). The injection of LSW changes the gas solubility
    in water, affecting gas/oil interactions and ultimately enhancing oil recovery.
    Despite the potential benefits, there are varying observations regarding the effectiveness
    of this hybrid method, with some researchers reporting improved recovery. Others,
    however, have found no improvement in recovery over continuous gas injection (CGI).
    Furthermore, CO₂ partitioning between oil and water in the reservoir (Dang et
    al., 2014) can lead to different recovery rates depending on the reservoir conditions.'
