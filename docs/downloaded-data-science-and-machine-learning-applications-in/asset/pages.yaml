  md: 'et al., 2021c). As such, there is the need to develop a workflow capable of
    determining the most appropriate features, which involves engineering new features
    from existing input variables (Otchere et al., 2021b). These new features should
    be capable of improving model performance compared to when they are inputted singularly.
    Again, the choice of machine learning models should not be a hindrance if a more
    robust model appending all robust models into one super machine learning model
    is used. This approach tends to mitigate the inherent problems of each model while
    complementing each other’s strengths.


    This study uses data from the Marun oil field used by Sabah et al. (2021) and
    Toreifi et al. (2014). The input features and their importance will be assessed
    using model agnostic metrics when predicting drilling fluid loss. Once a suitable
    dataset of relevant features is established, several machine learning models will
    be used to predict drilling fluid loss. The model that gives the best results
    will then be optimised using the Bayesian Optimisation (BO) algorithm. The main
    objective of this research is to analyse the effect of individual features to
    generate new insight into their generalisation of explaining the target. The main
    contributions of this research are the global explanation of variables in mud-loss
    prediction using an explainable AI and the development of a machine learning workflow
    to enhance the prediction of drilling fluid lost circulation using an explainable
    AI.


    # 2. Background of Machine Learning Regression Models


    This research stems from earlier studies where several workflows and techniques
    were used to predict drilling fluid loss using available input variables. As academics
    increasingly move away from empirical correlations, the use of machine learning
    has become entrenched. Individual drilling parameters offer critical information
    concerning drilling fluid lost circulation. However, when some subsets are used,
    they can predict drilling fluid loss more accurately. In some instances, researchers
    employ the Pearson correlation to identify appropriate variables, while others
    use wrapper approaches, intrinsic techniques, and metaheuristics algorithms to
    identify important features. The use of several techniques indicates that no definitive
    collection of features exists for making this prediction. However, a robust workflow
    is needed to utilise model agnostic techniques to solve this prediction problem.
    This study aims to understand the relationship among key input variables relevant
    for drilling fluid lost-circulation prediction. The relevant features selected
    by the model agnostic techniques will then be used as input features. Several
    machine learning models will be used to predict fluid loss based on their learning
    theory and ability to work with high-dimensional and complex data.


    The reviewed models perform differently based on learning theory, dimensionality,
    small or large data, and different data distribution. Identifying'
