    # 5. Conclusions


    Insufficient labelled samples have hindered the progress of deep learning application
    in seismic interpretation. In this study, we aimed to enhance an image using AI
    by building and comparing two different CNN models. The first model was a traditional
    CNN, while the second model was a more recent architecture known as a GAN.


    The conventional CNN (super-resolution) model was trained using a dataset of low-quality
    images and their corresponding high-quality versions. The model was then used
    to enhance the test images by increasing their resolution and reducing noise.
    On the other hand, the GAN (mean resolution) model was trained using a dataset
    of high-quality images. The generator network of the GAN was used to generate
    new high-quality images, which were then compared with the original test images.'
