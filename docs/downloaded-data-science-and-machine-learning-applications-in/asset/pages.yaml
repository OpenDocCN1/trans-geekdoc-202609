    accuracy. The BO technique is a convenient and dynamic paradigm that uses the
    Bayes Theorem to give a reasonable mechanism for guiding the search of a global
    optimisation problem to the extrema of objective functions (Otchere et al., 2022b).
    The technique operates by training a Bayesian approximation probabilistic model
    of the objective function repeatedly based on previous result estimation. Before
    choosing acceptable samples for evaluation on the real objective function, the
    probabilistic model is evaluated using an acquisition function. The process of
    adjusting the model’s parameters to improve the learning algorithm’s efficiency
    and optimise model performance by reaching a sufficiently reduced cost function
    is known as hyperparameter tuning (Otchere et al., 2022b). The optimised model
