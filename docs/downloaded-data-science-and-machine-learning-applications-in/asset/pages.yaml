  md: '# CHAPTER 11


    # Artificial Lift Design for Future Inflow and Outflow Performance for Jubilee
    Oilfield


    # Using Historical Production Data and Artificial Neural Network Models


    Solomon Adjei Marfo,¹ Eric Thompson Brantson,²* Eric Mensah Amarfio,² Abakah-Paintsil
    Efu a Eduamba,² Iyiola Zainab Ololade,² Alexander Mensah Ofori,² Ebenezer Ansah³
    and Emmanuel Karikari Duodu²




    Forecasting production parameters such as production rate, oil recovery, or reserves
    estimation is an essential aspect that enables operators to determine the economic
    profitability of a petroleum venture. Inflow and Tubing Performance Relationships
    (IPR and TPR) are the two mathematical techniques used to analyse and predict
    the performance of a well. AL-Dogail et al. (2018) used artificial intelligence
    (AI) (backpropagation network and fuzzy logic) as another technique to predict
    the Inflow IPR of a gas reservoir for effective reservoir management.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'The operator of Jubilee Field, Ghana, recently updated its production figures
    downward from 87,000 to 70,000 Barrel of Oil Per Day (BOPD) due to certain technical
    issues such as increasing water cuts (Renpu, 2011), reduced gas offtake by Atuabo
    Gas, and sand contamination of the flowlines among a host of others (Agyeman,
    2020). Initially, field assessments made by operators of Jubilee Field, Tullow
    Oil, indicated a production peak rate of 120,000 BOPD, water injection capacity
    of 230,000 Barrel of Water Per Day (BWPD), and gas export and injection capacity
    of up to 160 MMscf/d (Schempf, 2011). As a result of these technical problems,
    this production rate has been cut down. These myriads of challenges can be solved
    by means of implementing an artificial lift system (Boyun et al., 2007).


    Artificial lift generally is a means of lowering the bottomhole flowing pressure
    so that a well can produce at some desired rate. Traditionally, the artificial
    lift had been referred to as downhole pumping or gas lift activity associated
    with mature fields, where the average reservoir pressure has declined such that
    the reservoir can no longer produce from its own natural energy (Mohammed et al.,
    2016). About 90% of all producing wells require some form of artificial lift to
    increase the flow of fluids from the wells when the reservoir no longer has sufficient
    energy to naturally produce at economic rates for enhanced financial performance
    (Flatern, 2015). When reservoir energy is insufficient or water cut is higher
    despite sufficient energy, then the artificial lift method could be used to maintain
    oil well production under rational production pressure drawdown (Fleshman et al.,
    2011). Geographical and environmental circumstances were considered the dominant
    factors in the selection of artificial lifting and some other subordinated factors,
    including reservoir pressure, productivity index, properties of reservoir fluid,
    and inflow performance according to Neely et al. (1981). Some of these lift methods
    are suited for high-rate wells while others are useful for low-rate wells. Several
    factors are taken into consideration before an artificial lift method is selected
    for a specific application (Battia and McAllister, 2014; Woods and Lea, 2017).


    To address these challenges and enhance production, this study aims to investigate
    the feasibility of screening and designing an optimum artificial lift method to
    increase production and predict future IPR and TPR for the Jubilee Field using
    historical production data. Also, this study investigated the use of Radial Basis
    Function Neural Network (RBFNN) and Backpropagation neural network (BPNN) models
    to predict Tubing Head Pressure (THP) using historical data. A similar application
    study was carried out by Wu et al. (2016) and Brantson et al. (2018) in forecasting
    tight gas carbonate reservoir production profiles. Furthermore, the application
    of Artificial Neural Networks (ANNs) in the oil and gas industry began in the
    1980s, however, it has become rampant over this decade and is now a common industry
    practice (Baudoin, 2016; Brantson et al., 2019a, 2019b; Chen et al., 2021).'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'This paper is structured into the following sections. Section 2 dwells on the
    method used to forecast future IPR and TPR as well as the ANN prediction of THP.
    Section 3 states the results obtained from the implementation of the IPR, TPR,
    and ANN. Section 4 summarises the major conclusion obtained from the study.


    # ## 2. Methodology


    # ### 2.1 Artificial Lift Screening Techniques


    To apply artificial lift techniques to a field, screening must be done to ensure
    that the right artificial lift system is applied to the field in question. Some
    factors to be considered during the screening process are location, depth, estimated
    production, reservoir properties, and other factors. The screening process is
    the initial procedure to evaluate the suitability of a certain artificial lifting
    system (Brown, 1982). The goal is to phase out inappropriate systems progressively,
    reducing the selection to a few contenders for the next selection process. It
    is attempted to choose the optimum system, and to compare design parameters with
    existing methodologies and charts (Lea and Nickens, 1999). In this study, field
    parameters were compared to the parameters on the screening chart (Takacs, 2015)
    and the appropriate lift method was selected.


    # ### 2.2 Inflow Performance Relationship Production Forecast


    An inflow performance relationship is a means of evaluating a reservoir’s deliverability
    in oil and gas production. An IPR curve is a graphical representation of the relation
    between the flowing bottomhole pressure and liquid production rate (Boyun et al.,
    2007). IPR curves are presented in a standardised manner, with the flowing bottomhole
    pressure on the ordinate of the graph and the corresponding production rate on
    the abscissa (Hill et al., 1993).


    Equations (11.1) and (11.2) are based on Vogel’s model and they can be used to
    generate a family of curves. This is done to improve the future performance of
    the well, which can be utilised to assess the good performance throughout the
    whole life of a well by the design engineer (Boyun et al., 2007).


    $$\frac{J_f^*}{J_p^*}=\frac{\left(\frac{k_{ro}}{B_o\mu_o}\right)_f}{\left(\frac{k_{ro}}{B_o\mu_o}\right)_p}\tag{11.1}$$'
