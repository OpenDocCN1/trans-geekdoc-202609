    remain compressible. However, when more fluid percolates into a porous medium,
    the rock increases in rigidity, whiles elasticity reduces as the entire rock is
    occupied. The type of fluid or fluids coexisting in the pore spaces also influences
    rigidity and elasticity. The superior performance of the BO–ET model over the
    empirical correlations for Vs prediction is because the model is data-driven and
    considers both dry and saturated conditions and even the type of fluid saturation.
    There is an apparent interaction between fluids and the rock texture that influences
    Vs and Vp measurements.'
