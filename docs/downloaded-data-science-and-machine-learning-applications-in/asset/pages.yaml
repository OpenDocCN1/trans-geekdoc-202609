  md: '# CHAPTER 5


    # Data-Driven Virtual Flow Metering Systems


    Ramez Abdalla* and Philip Jaeger


    # 1. Introduction


    Proper estimation of multiphase flowrates in oil and gas production systems is
    an essential tool of monitoring and optimising the production systems. Hence,
    one of the routine tests of wells is production testing. It is usually conducted
    as a schedulable test to monitor liquid rates, water cuts, and gas oil ratio (GOR).
    The production testing is easily conducted using the test separator to compare
    the actual production rate with the theoretical one. It is the most common form
    of production and reservoir surveillance. However, this technique has its limitations.
    The main limitation of this test is the insufficient resolution or repeatability
    to identify trends in liquid and water-cut rates over short periods of time. Another
    potential problem could be the duration issue. It is often the case in low-flow
    rate and deep wells, which require several time-consuming whole or complete liquid
    holdup periods. Later, an alternative solution to the production testing has been
    developed. This solution is called multiphase physical flow meters (MPFMs). This
    technology depends on the idea of indirectly estimating multiphase flowrates without
    separating the phases. This is done by tracking supplementary measurements of
    fluid phase properties such as velocity and phase fractions inside the device.
    These meters are usually installed at the wellhead, so that the multiphase flowrates
    of a particular well can be tracked in real-time. One disadvantage of MPFMs is
    that they have higher capital costs (CAPEX) and operating costs (OPEX), and they
    require frequent production calibration.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Subsequently, the technology of virtual flow metering (VFM) arises as an attractive
    technology in the oil and gas industry. It depends on either analytical or data-driven
    models for real-time calculations of phases’ production. In this chapter, data
    driven virtual flow metering solutions are presented. At the beginning, VFM classification
    is introduced based on modelling paradigms. They are classified as first principle
    and data-driven VFMs. Then, an overview of the applications of data-driven modelling
    in VFM systems is presented. Through discussing these applications, the model’s
    features used in the works, the predicted variables, the input data for the training,
    and the respective paper are emphasised.


    In addition, the data driven virtual flow meter components and methodology to
    develop this type of flow meter is discussed. The methodology follows the cross-industry
    standard process for a data mining framework. This is a framework for project
    planning that many industrial projects have used. Its main components are data
    understanding and preparation, modelling, and evaluation. Subsequently, an implementation
    of this methodology is presented to estimate flow rate and water-cut prediction
    from the electrical submersible pump’s sensor data. Finally, we introduce a field
    experience with a data-driven VFM system. In this section, the real operational
    experience reported in the literature using the data-driven models are discussed.


    # 2. VFM Key Characteristics


    The near wellbore area, wells, pipelines, and production chokes must be simulated
    to be able to formulate systems. To come up with precise estimates of flowrates,
    models are combined with observations like inlet and outlet pressures and temperatures,
    choke openings, etc. Depending on the measurement data available, the production
    system can either be represented as a whole from the reservoir to the processing
    plant, or it can be divided into sub models. Figure 5.1 shows a schematic graph
    of well sub models and relevant data. Also, optimisation algorithms may be used
    to modify flowrates and other tuning parameters. This is mainly to stabilise estimation
    models by reducing the discrepancy between model predictions and actual measurements.


    The concept behind these systems makes them have general characteristics in common
    whatever the system sub modules are. One of these characteristics is that they
    are dependent on instrument and system sensitivity to changes in flow and phase
    fractions. They are also dependent on tuning/calibration to extend to a “calibrated
    range” and adapt to a changing operating condition. They can be classified into
    pure data-driven or thermo-hydraulic modelling VFMs, or hybrids. All of them,
    either data-driven or mechanistic, should take into account pressure and temperature
    drop in the well, and pressure drop over choke and phase fractions of the flowing
    stream.'
