    Their study concluded that the LSSVM-Cuckoo Optimisation Algorithm recorded the
    highest prediction accuracy of 0.94 compared to all the hybrid models developed.
    Alkinani et al. (2020) also employed an artificial neural network to estimate
    lost circulation in induced and natural fractures. Their work entailed separating
    the datasets into three categories: 60% for training, 20% for testing, and 20%
    for validating. Databases, consisting of nine input features for each fracture
    type, were created for both natural and induced fractures to give room for data
    normalisation. The application of feature selection justified the selection of
    the Levenberg–Marquardt function to train the dataset as it resulted in the highest
    accuracy. Their results achieved an accuracy of 0.96 and 0.93, respectively, for
    both natural and induced fracture networks.


    Abbas et al. (2019b) assessed the potential of machine learning in mining and
    analysing drilling data to predict lost circulation while drilling. For the selection
    of input parameters, the work made use of the feature ranking method to reduce
    the dimensionality of the dataset. Eighteen out of the 23 studied parameters were
    selected as input variables to predict the lost–circulation. The feature ranking
    method enhanced the efficiency of the dataset, thereby improving computational
    processing time. The results showed that the Gaussian kernel support vector machine
    (SVM) recorded the highest accuracy of 0.92. Their work led to more research,
    such as using two different machine learning models that consider geological and
    operational parameters in making lost-circulation predictions (Abbas et al., 2019a).
    Toreifi et al. (2014) also proposed a new technique using the modular neural network
