    # 2.3.1 Multivariate Adaptive Regression Splines (MARS)


    The multivariate nonparametric regression technique known as MARS was introduced
    by Friedman in 1991. This method utilises piecewise linear segments, or splines,
    to capture complex nonlinear relationships between input and target variables.
    The mathematical relationship between the basis function terms and the dependent
    variable in MARS is expressed in Eq. (7.10):


    $$ORF = C_o + \sum_{k=1}^{M} C_k \beta_k(X), \qquad (7.10)$$


    where ORF is the oil recovery factor as the target variable. There are several
    parameters that must be taken into account while simulating the interaction between
    two or more variables in a reservoir system. These parameters include the intercept
    (C_o), the number of basis function terms (M), and the vector of the kth basis
    function''s unknown coefficients (C_k), where k is a value between 1 to M. The
    basis functions themselves are denoted by β_k and X is used to represent the input
    variables for the reservoir parameters.


    According to Friedman''s (1991) findings, the MARS technique uses multivariate
    spline functions as basis functions, which are represented in Eq. (7.11):


    $$\beta_k(X)=\prod_{z=1}^{Z_k}\left[p_{zn}\cdot\left(X_{m(z,n)}-s_{zn}\right)\right]_{+},
    \qquad (7.11)$$'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'In this context, we use the variable Z_n to represent the number of splits
    that resulted in the value of β_k. The variable p_{z_n} is utilized as a sign
    indicator that can take on values ±1. The notation [.]_+ is used to signify taking
    only the positive part. The function m(z, n) labels the predictor variable, while
    s_{z_n} represents the corresponding knot value of variable X_{m(z,n)}'',


    The MARS algorithm is a popular approach for developing models that can capture
    nonlinear relationships between variables. The algorithm typically consists of
    two steps, the forward and backward passes. In the forward pass, the algorithm
    investigates potential knots and begins with a model consists of just the constant
    term. This means that the initial model assumes that there is no relationship
    between the predictor variables and the response output variable. As the algorithm
    progresses, it gradually adds basis functions (BFs) to the model, which allows
    it to capture the nonlinearity between the predictor variables and the response
    output variable. The backward pass is carried out after the forward pass and is
    used to eliminate estimators that are irrelevant to the output variable. This
    is done to streamline the developed model eliminating the least significant BFs
    according to the generalised cross-validation (GCV) criterion given in Eq. (7.12).
    The GCV criterion is a widely used method for selecting the best subset of predictors
    that minimise the prediction error of the model. By removing the non-influential
    predictors, the model becomes more interpretable and easier to understand, while
    still accurately capturing the nonlinear relationships between the predictor variables
    and the response output variable.


    $$ GCV(\varphi)=\frac{\frac{1}{N}\sum_{i=1}^{N}(O_i - P_i)^2}{\left[1-\frac{M(\varphi)}{N}\right]^2},
    \tag{7.12} $$


    To achieve a balance between the model size and its fit to the dataset, a tuning
    parameter denoted as φ is utilised. The overall field measurements training dataset
    is represented by N, while O_i and P_i denote the observed and predicted values
    of the dataset, respectively. By adjusting the value of the tuning parameter,
    one can regulate the trade-off between the complexity of the model and its accuracy
    in capturing the dataset''s patterns. M(φ) is defined in Eq. (7.13) as the effective
    number of parameters employed in the model:


    $$ M(\varphi)=(\varphi + 1)+d.\varphi, \tag{7.13} $$


    The parameter d serves as a penalty or smoothing factor in the non-parametric
    MARS algorithm, where its value determines the number of basis functions and the
    smoothness of the estimated functions. A higher value of d leads to fewer basis
    functions and smoother estimates, whereas a'
  merge: -1
