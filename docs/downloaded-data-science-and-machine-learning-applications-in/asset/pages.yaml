  md: '$$r = \frac{\sum_{i=1}^{n}\left(ORF_{observed} - \overline{ORF}_{observed\
    mean}\right)\times\left(ORF_{predicted} - \overline{ORF}_{predicted\ mean}\right)}{\sqrt{\sum_{i=1}^{n}\left(ORF_{observed}
    - \overline{ORF}_{observed\ mean}\right)^{2} \times \sum_{i=1}^{n}\left(ORF_{predicted}
    - \overline{ORF}_{predicted\ mean}\right)^{2}} \tag{7.21}$$


    where, n = total number of oil recovery factor data points observed, ORF_observed
    = oil recovery factor observed data points, ORF_observed mean = mean of the oil
    recovery factor observed data points, and ORF_predicted mean = mean of the oil
    recovery factor predicted data points.


    # 2.3.4 Dataset Standardisation


    The CO₂-LSWAG modeling process involves the use of data with varying physical
    units. These physical units could include meters, grams, seconds, or any other
    units that are relevant to the data being used. In order to ensure that the data
    is comparable and can be used to generate accurate models, normalisation is applied.
    Normalisation is a technique that scales the data to a common range of values.
    In this particular study, both the input and output vectors were normalised in
    the interval [−1, 1]. This range was chosen because it is a common range of values
    used in normalisation techniques. The normalisation process was implemented to
    ensure that there is a constant variation in the data as expressed in Eq. (7.22).
    By normalising the data, the range of values for both input and output vectors
    is restricted to a specific range, thus making it easier to compare and analyse
    the data. It is important to note that normalisation is not always necessary,
    but it is often used when working with data that has varying physical units. By
    normalising the data, it is possible to remove any biases that may arise due to
    differences in physical units. This can help to ensure that the models generated
    from the data are accurate and reliable.


    $$y_i = y_{min} + \frac{\left(y_{max} - y_{min}\right)\times\left(x_i - x_{min}\right)}{\left(x_{max}
    - x_{min}\right)}, \tag{7.22}$$


    The resulting normalised data is denoted by y_i, where the maximum and minimum
    values (y_max and y_min) of the normalised data are set at 1 and −1, respectively,
    the measured values (x_i) are scaled to a range of −1 to 1, with x_min and x_max
    the measured data serving as the lower and upper bounds of this range. This method
    of normalisation is commonly used.


    # 3. Results and Discussion


    # 3.1 Numerical Model Description


    This study employed an inverted five-spot injection carbonate model to simulate
    CO₂-LSWAG oil recovery at the field scale. The reservoir had'
