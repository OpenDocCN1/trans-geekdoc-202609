  md: 'these uncertainties have direct implications on the economics of any project
    but often petrophysicists do not quantify them. To assess the implication, Bower
    and Fitz (2000) quantified the sensitivity associated with the dual water model
    to determine the most cost-effective way to reduce ambiguity and deliver a framework
    for good estimation. Figure 10.1 provides a flowchart of the influence of petrophysical
    properties on the Net Present Value (NPV) for a project. Also, a balance in capillary
    pressure and gravitational forces plays a vital role in the distribution of Sw
    above a Free Water Level (FWL) (Lian et al., 2016). Therefore, the availability
    of capillary pressure data from Special Core Analysis (SCAL) can help estimate
    the Sw at any given height (Brantson, 2022; Harrison and Jing, 2001; Olakunle
    et al., 2015; Rudyk and Al-Lamki, 2015). Possibly, a good saturation height model
    can be used to estimate the Sw value away from the cored well location provided
    that the geology and sedimentological setting of the predicted environment is
    known (Hu and Chen, 2012; Lian et al., 2016; Luo et al., 2013).


    $Sw = \sqrt[n]{\frac{(a * Rw)}{Rt * Phie^{m}}}$  (10.3)


    $\frac{1}{Rt} = \frac{\phi^{m} * Sw^{n}}{a * Rw} + \frac{Vsh * Sw}{Rsh}$  (10.4)


    $\frac{1}{Rt} = \frac{\phi_{r}^{m*} * SwT^{n}}{a * Rw} * \left(1 + B * Q_{v} \frac{Rw}{SwT}\right)$  (10.5)


    $\frac{1}{\sqrt{Rt}} = \left(\sqrt{\frac{\phi^{m}}{a * Rw}} + \frac{VCl^{(1-(Vcl/2))}}{\sqrt{Rcl}}\right)
    * Sw^{n/2}$  (10.6)


    $\frac{1}{Rt} = \frac{\phi_{r}^{m*} * SwT^{n}}{a} * \left(\frac{1}{Rw} + \frac{Swb}{SwT}\left(\frac{1}{Rwb}
    - \frac{1}{Rw}\right)\right)$  (10.7)


    where m is the cement factor, m* presents the cement factor used for Dual water
    and Waxman-Smiths, n is saturation exponent, a represents Tortuosity factor, Vsh
    is wet shale volume, Sw represents effective water saturation, SwT is Total water
    saturation, Swb is Bounded water saturation, Rw represents Formation water resistivity,
    Rwb also represents Bound water resistivity, Rt is Input resistivity curve, Qv
    represents cation exchange capacity per unit total pore volume, B is Equivalent
    conductance of clay cations and T representing Formation temperature in degree
    centigrade.'
