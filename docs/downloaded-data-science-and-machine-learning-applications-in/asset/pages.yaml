  md: 'AI algorithms used, conditioning of the input data helps to improve the prediction
    performance of the algorithm. The use of rock physics models as a complementary
    tool in conditioning the well logs has in recent times gained much attention and
    has proven to be useful in well log conditioning. Also, much work in combining
    rock physics and AI algorithms has not been done. In all, it can be inferred from
    Table 10.1 that, this review work will be a basis to advance the study of AI applications
    in reservoir characterisation.


    # 9. Challenges and Perspectives


    Yu et al. (2011) highlighted that reservoir characterisation is a multidisciplinary
    integration exercise that involves qualitative and quantitative interpretation.
    With increased complexity and abundance of data from various geological and reservoir
    problems, new technologies and methods are increasingly adopted in reservoir characterisation.
    Proper integration substitutes the need to run expensive and unrelated logs to
    make available correct estimation faster and strengthen your confidence as an
    operator. A good representative reservoir characterisation presents a good model
    for the optimisation of the lifetime performance of a field. Achieving that requires
    an accurate measurement available from multiple disciplines to prepare a good
    quantitative and qualitative representation of the reservoir. Significant experiments
    have been made in this regard, and many challenges remain, some perspectives for
    the future are discussed.


    # 9.1 AI Perspective


    Literature has highlighted various modifications of the ANN algorithm like the
    functional network (FNN), PNN, and Radial Basis Function (RBF) to help remove
    the various limitation of the ANN algorithms. This has led to addressing nonlinearity
    between various inputs which the empirical correlations could not highlight. AI
    has produced improved prediction and classification in a different task in reservoir
    characterisation, that is, the use of hybrid modelling (Amiri et al., 2015; Anifowose
    et al., 2011; Anifowose et al., 2015; Saemi et al., 2007) and also ensemble model
    (Anifowose et al., 2015) to make available good hyperparameters for modelling.


    Feature extraction and selection by AI algorithms is one of the main areas most
    literature is addressing to help improve the prediction capability of these AI
    tools. Feature selection looks at the individual input for the AI algorithms by
    looking at the necessary and unnecessary features which intern affect the efficiency
    of the algorithm. Since the conventional AI algorithm lacks the power of feature
    extraction, most research has looked at hybridising AI algorithms to cater to
    that deficiency. Considering the various feature selection tools (PCA, forward
    feature selection (FFS), linear discriminant'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'analysis (LDS), etc.), fuzzy-aided hybrid models have proven to provide good
    performance in many reviewed literature.


    Due to the spatial dimension of the various dataset used to train the AI algorithm,
    the need to transform the dataset from a high dimensional space to a low dimensional
    space while keeping the high dimensional structure helps improve the prediction
    power of the ANN and ML algorithm. This process of reducing dimensionality is
    termed feature extraction. With the development of deep learning algorithms, the
    problem of feature extraction has been addressed since the algorithm can extract
    valuable information from the primary data input. The literature reviewed here
    has indicated that the application of soft computing methods has to do with the
    trial-and-error method of choosing the parameter settings to obtain high-performance
    accuracy. Therefore, future studies have to employ an automatic selection of parameters
    for soft computing methods to avoid long time wasted in looking for optimal parameters.


    In recent years, the oil industry has seen a high volume of data generation by
    progressive sensors (Saikia et al., 2020) which has led to the development of
    advanced modelling and estimation techniques. Such advanced modelling is the application
    of a deep learning algorithm (e.g., CNN) to handle feature selection (Shaheen,
    2016) and extract useful messages from the input data through its hidden neurons
    (Saikia et al., 2020). The application of deep learning (DL) has not been well
    exploited in the domain of reservoir characterisation but has yielded much success
    in the field of image, and speech recognition (Bae et al., 2016; Fujiyoshi et
    al., 2019; He et al., 2016; Pouyanfar et al., 2018) and other fields like the
    medical sector (Chen et al., 2018; Fang et al., 2019). Although DL has in recent
    years been applied to solve various learning assignments, training the model is
    difficult (Rere et al., 2016) but with improved data availability, the performance
    of DL models has been better. Various algorithms such as Stochastic Gradient Descent
    (SGD), Conjugate Gradient (CG), Hessian-free optimization (HFO), and Krylov Subspace
    Descent (KSD) have been implemented to curtail this deficiency over the years.
    These algorithms have shown some limitations such as several manual tuning schemes
    for SGD, slowness of the CG, and more memory consumption of the HFO and KSD (Rere
    et al., 2016). To resolve the issues of some of these algorithms, the hybridisation
    of metaheuristics to DL will be a good area to address. The metaheuristic optimisation
    techniques have been successfully applied to solve many optimization problems
    in the research area of engineering, sciences, and related industries. Research
    on hybridising DL with metaheuristics algorithms is scarce in the field of reservoir
    characterisation. Notwithstanding, its other important status which is learning
    from unlabelled data concerning reservoir characterisation has also not been properly
    exploited. Likewise, with the availability of core information coupled with well
    log data, the application of semi-supervised deep learning approaches can lead
    to greater success in'
