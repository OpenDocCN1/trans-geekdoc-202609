  md: 'Table 3.5. Model architecture stacking ensemble models as base learners for
    the Custom Ensemble. Adapted from Otchere et al. (2022a).


    # Algorithm 1: Stacking Base Learners


    ```

    1: def ensemble_predict(models, X_train, y_train, X_test):

    2: # create an empty array to store predictions

    3: predictions = list()

    4:

    5: # loop through the models

    6: for model in models:

    7: model.fit(X_train, y_train)

    8: y_pred = model.predict(X_test)

    9: predictions.append(y_pred)

    10:

    11: # return the predictions

    12: return predictions

    13:

    14: def train_stacking_ensemble(X_train, y_train, X_test, y_test):

    15: models = get_models()

    16: ensemble_predictions = ensemble_predict(models, X_train, y_train, X_test)

    17: meta_model = LinearRegression()

    18: meta_model.fit(ensemble_predictions, y_test)

    19:

    20: # predict on the test set

    21: y_pred = meta_model.predict(ensemble_predictions)

    22:

    23: # evaluate performance

    24: r² = r²_score(y_test, y_pred)

    25: mae = mean_absolute_error(y_test, y_pred)

    26: rmse = sqrt(mean_squared_error(y_test, y_pred))

    27: fit_likelihood = OLS(y_test, add_constant(y_pred)).fit()

    28: print("R²: {:.4f}".format(r²))

    29: print("MAE: {:.4f}".format(mae))

    30: print("RMSE: {:.4f}".format(rmse))

    31: print("AIC: {:.4f}".format(fit_likelihood.aic))

    ```


    which was used as input to train a meta-model using linear regression. The meta-model
    was trained on the combined predictions and the target variables of the training
    dataset, and it was then used to make predictions on the test set. This approach
    can improve the model’s performance by combining the strengths of different models
    and reducing the prediction variance (Tarafder et al., 2022). Table 3.5 summarises
    the function used to develop the stacked ensemble using the Extra Trees, Random
    Forest, and XGBoost models, whiles Fig. 3.3 summarises the entire workflow.


    There are several different combinations of models and different parameters for
    each model, as well as different meta-models to find the best hybrid ensemble
    for a specific task, dataset, and desired performance.'
