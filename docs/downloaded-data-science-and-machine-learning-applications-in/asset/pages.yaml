    # 3.2 Virtual Sensing for SRP Wells


    Beam pumping, or the sucker-rod lift method, is the oldest and most widely used
    type of artificial lift. A sucker-rod pumping system is made up of several components,
    some of which operate on the surface and other parts operate underground, down
    in the well. The surface-pumping unit, which drives the underground pump, consists
    of a prime mover (usually an electric motor) and, normally, a beam fixed to a
    pivotal post which is called a Sampson post and the beam is called a walking beam.


    Several sensors can provide measurements of sucker-rod pump operations.


    The main measurements are loads on the pump which form what are called dynamomter
    cards which are diagnostic cards that plot the load on the top rod (polished rod)
    in relation to the polished rod position as the pumping unit moves through each
    stroke cycle. The plot of the polished rod Load vs Position is known as the Surface
    Card. Subsequently, a wave equation solution is used to derive the downhole card
    from the surface card. The downhole card is a plot of the Load vs Position on
    the pump’s plunger. Also, on the surface, continuous measurements for wellhead
    pressures, temperatures and power measurements of the motor are reported. In addition,
    the normal frequent tests data for any production system are provided. Those are
    fluid level depth using acoustic transducer and production of multi phases using
    a separator test or'
