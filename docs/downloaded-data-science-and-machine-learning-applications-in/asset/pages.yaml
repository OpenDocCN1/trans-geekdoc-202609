  md: '# **Table 12.3.** Brief description of regression algorithms.


    | ML Algorithm | Illustration |

    |---|---|

    | **Linear regression** assumes a linear relationship between a dependent variable
    and independent variable(s). Linear regression can be either simple (one dependent
    variable) or multiple (2 or more independent variables). Linear regression estimates
    the coefficients (slopes and intercept) that minimize the loss function between
    the actual values and predicted values (Montgomery et al., 2012). | [Illustration:
    linear regression line and data points] |

    | **Polynomial regression** models nonlinear relationships between dependent and
    independent variables. Polynomial models can fit complex relationships by adding
    higher-order terms; however, the appropriate degree of polynomial is an important
    consideration to minimize overfitting (James et al., 2013). | [Illustration: polynomial
    regression curve] |

    | **Random forest** is an ensemble learning method developed as a combination
    of multiple decision trees. RF models are developed following this sequence: Bootstrapping
    and tree building – randomly sampling of the original dataset to create multiple
    subsets of the data. Pruning – removing nodes or branches that do not improve
    the model’s performance. Majority voting – aggregates the predictions of multiple
    decision trees to make a final prediction (Breiman, 2001). | [Illustration: random
    forest consisting of multiple decision trees] |

    | **Support vector regression** learns the function that maps input features to
    continuous output values by finding a hyperplane that maximally separates the
    input data while minimizing the error on the training data. SVR uses kernel functions
    to transform input data into a higher dimensional space, where it is easier to
    find a linear decision boundary (Chang and Lin, 2012). | [Illustration: support
    vector regression hyperplane and support vectors] |

    | The architecture of a **deep neural network** consists of multiple layers of
    nodes. Each node performs a different type of computation and learns complex relationships
    between input and output variables. The first layer of the network receives the
    input variables, and subsequent layers process the data while the output layer
    provides the final prediction. The weight and bias of the nodes in the network
    are iteratively adjusted to minimize the difference between the predicted and
    the actual output (Goodfellow et al., 2016). | [Illustration: deep neural network
    with input, hidden, and output layers] |


