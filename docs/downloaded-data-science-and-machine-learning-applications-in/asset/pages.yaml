- pgno: 142
  md: '20%–40% of the original oil in place (OOIP) (Stalkup, 1984). Following the
    application of primary and secondary oil recovery techniques, two-thirds of the
    OOIP remains in the reservoir (Gbadamosi et al., 2019).


    According to Brantson et al. (2019), tertiary oil recovery methods are capable
    of retrieving a greater amount of oil than primary or secondary recovery methods.
    In this study, EOR synergy methods involving the injection of low salinity water
    (LSW) and carbon dioxide (CO₂) gas were employed to enhance oil recovery at the
    field scale. The use of LSW in field trials has demonstrated a significant improvement
    in oil recovery (Robertson, 2007; Webb et al., 2004; Vledder et al., 2010), making
    it a favourable option over conventional chemical EOR methods in terms of chemical
    costs, environmental impact, and field process implementation (Dang et al., 2014).
    On the other hand, CO₂-EOR has the potential to recover an additional 15%–20%
    of the remaining oil in place (Ahmed, 2018). The two main mechanisms behind CO₂
    injection schemes are oil swelling and viscosity reduction (AlQuraishi et al.,
    2019). It is noted that all reservoir lithologies, including siliciclastic, carbonate,
    and others, are appropriate for CO₂-EOR provided they have an enough seal to contain
    hydrocarbons and interconnected pore space for fluid accumulation and flow (Verma,
    2015). Therefore, estimating hydrocarbon’s ultimate recovery factor provides more
    detailed insights into oilfield development strategies (Roustazadeh et al., 2022).
    The methods of material balance, decline curve analysis, and dynamic numerical
    simulation are used to estimate recovery factors, but they are time-consuming.


    Over the years, there has been increasing awareness and concern over the continuous
    buildup of greenhouse gases in the atmosphere. This is due to human activities
    such as burning of fossil fuels, deforestation, and industrial processes that
    emit greenhouse gases such as carbon dioxide (CO₂), methane, and nitrous oxide.
    The accumulation of these gases has led to an increase in global temperatures,
    causing significant changes in the climate, which poses a threat to the entire
    world. One of the consequences of climate change is rising sea levels, which have
    been observed to be a direct result of the increasing levels of CO₂ and other
    greenhouse gases in the atmosphere. The rising sea levels have led to devastating
    consequences, such as flooding of coastal areas, displacement of communities,
    loss of habitats, and destruction of infrastructure (Santos et al., 2014). Therefore,
    it is crucial to find ways to mitigate the impact of greenhouse gas emissions
    on the environment and the world at large.


    In recent years, there has been considerable attention given to the potential
    use of CO₂-EOR as a long-term anthropogenic CO₂ storage application (Mandadige
    et al., 2016). CO₂-EOR is a technique used in the oil and gas industry to extract
    more oil from wells by injecting CO₂ into the reservoir. This technique not only
