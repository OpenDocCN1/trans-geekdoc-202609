    Nonetheless, these areas are still shown on the attribute as having a high probability
    of salt occurrence, indicating the potential presence of salt. Further analysis
    and interpretation by geoscientists are required to accurately determine the position
    and extent of salt bodies within the field. This event is because “false probability”
    sections occur when there is no obvious evidence of a salt body. The occurrence
    of probabilities, which are bodies traced in a distinct direction, is projected
    to have a salt probability. These probabilities are a fragmented portrayal of
    some extensive salt bodies and the requirement for vertical extent rectification.
    These false probabilities occur because synthetic and field labels used to pre-trained
    DCNN do not capture all the intrinsic characteristics in every field. Some of
    these false probabilities are salt probability zone projections tracked in the
    perpendicular direction. One approach for enhancing the probability attribute
    in such cases is by adding manually interpreted salt labels to retrain the pre-trained
    DCNN. Due to the unsatisfactory salt body prediction by the pre-trained model,
    transfer learning is recommended to help improve the model performance by tuning
    and recalculating the model weights to the type of salt bodies in this study.
    This approach will decrease the number of “false probability” results where the
    analysis of the reflectivity pattern does not suggest salt being present.'
