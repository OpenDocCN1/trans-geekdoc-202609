    # 3.3 Extremely Randomised Trees Conceptual Overview


    Extremely Randomised Trees (Extra-Trees) is an ensemble learning technique proposed
    by Geurts et al. (Geurts et al., 2006). Tree-based regressors are composed of
    a hierarchy set of rules that may predict the numerical values of the output (Gordon
    et al., 1984). The Extra-Trees technique uses the traditional top-down strategy
    to construct an ensemble of unpruned decision trees. The two key distinctions
    from previous tree-based ensemble algorithms are that it separates nodes by selecting
    cut-points entirely at random. It grows the trees using the entire training sample
    instead of replicating a bootstrap replica. Extra-Trees appropriately average
    the randomised predictions of Decision Trees to enhance precision while minimising
    computational complexity significantly.


    The Extra-Trees approach is built on the bias-variance concept. The explicit randomisation
    of the cut-point and features combined with ensemble averaging can reduce variance
    more strongly than the weaker randomisation techniques employed by other algorithms.
    The entire original training data should be used to reduce bias rather than bootstrap
    replicas. The computational cost of the tree growing method, assuming balanced
    trees, is on the order of N log N regarding the learning sample size, as is the
    case with most other tree-growing procedures. Moreover, given the ease of the
    node splitting technique, it is anticipated that the constant factor will be considerably
    lower than in previous ensemble-based methods that optimise cut points locally
    (Geurts et al., 2006).


    Constructing the nodes and branches that make up a tree depends on dividing the
    input vector into independently exclusive areas based on a predetermined splitting
    criterion, gradually reducing the size of the regions. When the number of samples
    in a tree section goes below a predefined threshold, the splitting terminates
    to form a leaf. When inputting a new sample into the tree, a specific path is
    taken based on the splitting criteria provided in the tree-building process. The
    predicted target is generated by aggregating the values stored in the leaf. The
    requirements for splitting, termination into leaves, tree quantity developed,
    and assigning weight to each leaf are the critical aspects that distinguish Extra-Trees
    from other tree-based techniques.


    Aside from having similar advantages as single trees based on consistency for
    universal generalisation and approximation, Extra-Trees also give resilience in
    gross model errors because outliers affect its predictions slightly and locally.
    Extra-Trees potentially outperform single trees in relation to computational efficiency
    while resisting irrelevant input features when the input features are significantly
    more than the random splits. Further comparison with single trees and dependent
    on the issue at hand indicate that'
