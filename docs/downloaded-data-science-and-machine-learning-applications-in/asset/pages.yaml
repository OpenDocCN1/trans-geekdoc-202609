  md: '# CHAPTER 2


    # Enhancing Drilling Fluid

    Lost-circulation Prediction

    Using Model Agnostic and Supervised

    Machine Learning


    *Daniel Asante Otchere,¹,²,*

    Mohammed Ayoub Abdalla Mohammed,³ Hamoud Al-Hadrami⁴

    and Thomas Boahen Boakye⁵


    # 1. Introduction


    Drilling is a complex and high-risk element of oil and gas field development and
    production (Zarouk and McLean, 2019). Drilling fluid serves several purposes in
    rotary drilling, where the drilling mud is cycled through the drill string to
    remove cuttings and improve drill bit performance (Alkinani et al., 2020). The
    size, shape, and density of the drilling fluid’s cuttings, as well as its annular
    velocity, all affect the drilling fluid’s ability to remove accumulated cuttings.
    One of the most prevalent drilling industry difficulties is drilling fluid lost
    returns. This problem occurs whenever the volume of mud injected during drilling
    partially or totally filtrates into the formation rather than flowing back up
    to the surface (Toreifi et al., 2014). Due to the volume


