  md: "line produced by the algorithm. There is not a single statistic that can analyse\
    \ all forms of data. The metrics are impacted by a number of components, including\
    \ but not limited to the presence of outliers, the machine learning algorithm\
    \ used, the ease with which derivatives can be discovered, and the prediction\
    \ confidence. Therefore, the model errors were evaluated using the following standards\
    \ to determine whether the models utilised in this research were appropriate;\n\
    \n+   1. *Mean Absolute Error (MAE)*: The MAE is a well-established evaluation\
    \ metric used to quantify the accuracy of predictive models. It is defined as\
    \ the L1 loss, representing the sum of absolute differences between the predicted\
    \ output and the target variable. By measuring the average magnitude of errors\
    \ without taking into account the direction of errors, the MAE provides a reliable\
    \ measure of model performance. Additionally, this metric is particularly sensitive\
    \ to relative errors, making it a useful tool for assessing performance in applications\
    \ where errors of all sizes are equally important. The MAE is also robust against\
    \ global scaling of the predicted output and the presence of outliers, making\
    \ it a versatile metric for evaluating model performance in various settings.\
    \ Mathematically, the MAE is written as;\n+   \n+   $$MAE = \\frac{\\sum_{i=1}^{n}\
    \ |y_i - \\hat{y}_i|}{n}$$ \n+   (6.1)\n+   \n+   2. *Root Mean Squared Error\
    \ (RMSE)*: This performance evaluation metric is popular because it is interpretable\
    \ as the standard deviation of the model’s prediction errors and specifies the\
    \ closeness of predicted data to actual data. This function is written as follows;\n\
    +   \n+   $$RMSE = \\sqrt{\\frac{\\sum_{i=1}^{n} (y_i - \\hat{y}_i)^2}{n}}$$\n\
    +   (6.2)\n+   \n+   3. *Akaike Information Criterion (AIC)*: This evaluation\
    \ standard was developed using a frequentist probability framework that assigns\
    \ a model a score based on its maximum likelihood estimation. This technique assesses\
    \ models’ quality and accuracy, resulting in a better model fit of the data. This\
    \ criterion is expressed as;\n+   \n+   $$AIC = 2K - 2(log - likelihood)$$\n+\
    \   (6.3)\n\nIn order to assess the accuracy of prediction models based on the\
    \ number of input features, various evaluation metrics are employed. However,\
    \ except for R², a lower value for the performance evaluation criteria indicates\
    \ better model performance. If a conclusion cannot be drawn based on these"
