    # 5. Conclusions


    In summary, eight supervised machine learning models were employed to predict
    multi-zonal rates for a smart water injection well in an oil and gas production
    setting. The machine learning models were trained and evaluated using PFI, a model-agnostic
    metric, to identify relevant features. Seven of the features were relevant and
    used as input to further train the top six models from the previous evaluation
    where all features were used. The Extra Trees model achieved the highest precision
    and consistency of 708 bbls RMSE and 68 bbls MAE compared to the test data. The
    Extra Trees predicted zonal rates were also visualised using KDE and joint plots
    to confirm their accuracy. Upon satisfactory results, the Extra Trees model was
    deployed on a new well with five months of hourly data, and the combined predicted
    zonal rates matched the total injected rate. Additionally, the model could predict
    zonal rates in instances where the ICVs were in the closed and fully opened positions.
    Overall, the results of this research demonstrate the potential of machine learning
    in predicting multi-zonal rates in oil and gas production and highlight the use
    of the Extra Trees model as a robust and effective tool for this task.


    This research provides preliminary results for the approach employed in water
    injection wells. When used in producer wells, this method could provide a simple
    and accurate data-driven approach to estimating each reservoir unit’s volume of
    produced fluids based on downhole parameters. The method can also provide real-time
    estimates of produced volumes, aiding advanced formulation of a reservoir management
    plan, daily production operational changes to meet critical targets, and the operator’s
    policy of developing domestic oil resources responsibly. This project’s success
    will not end ICV mapping but will drastically reduce the number of mappings performed
    in the life of the field. One limitation of this study is that the model is as
    good as the data used to train it. When new data is introduced that falls out
    of the range of the model, ICV mapping will be required, and the model will be
    retrained with the new data to fine-tune its prediction. This limitation, however,
    does not downplay the immense advantages this study provides. This approach is
    recommended to save time and money during production using a smart well completion.


