- pgno: 122
  md: 'developed to estimate the volume of injection fluids to each reservoir zone.
    However, these equations can become out of sync and sometimes require recalibration.
    New downhole pressure regimes, new fluids (water/gas), and wellhead pressure are
    all situations that necessitate recalibration.


    As a Production Technologist, one of the most important works is to estimate the
    oil production/water injection from/to multiple reservoir zones based on operational
    parameters such as bottomhole pressure, tubing differential pressure, and wellhead
    pressure. Most of these workflows or empirical correlations assume physics in
    some sort, which involves many assumptions. Hence, this research is being proposed
    to use a data-driven approach. This approach uses artificial intelligence (AI)
    techniques where the computer learns physics based on data patterns without assumptions
    and complex physics. This concept proposes advanced data analytics techniques,
    allowing new insights and understanding of the operational parameters (Otchere
    et al., 2022b). Advanced data analytics and machine learning will be used to build
    a model and predict water injection volumes into multiple reservoirs using daily
    production or injection data from an actual field. The main objectives of this
    work are to;


    +   1. Study and understand the key operational parameters that are necessary
    to estimate zonal rates through the use of advanced data analytics techniques.

    +   2. Create a reliable method using machine learning models to calculate production
    rates in multi-zonal reservoirs.


    Given the success of AI in the oil and gas business, this initiative has tremendous
    research possibilities. Current research applies machine learning techniques to
    optimise ICV settings to increase production. In this project, eight machine learning
    models will be employed to estimate the injected water volumes into each reservoir
    when ICV settings are out of sync, giving wrong zonal estimates. This approach
    will replace recalibrating the empirical correlation to estimate injected water
    into multiple zones, resulting in interrupted field production. This approach
    will be reapplied in oil production wells with various input parameters upon acceptable
    results. This research could provide a simple and accurate data-driven approach
    to estimating each reservoir unit’s volume of production fluids based on operational
    parameters. The method can also provide real-time estimates of produced volumes,
    aiding reservoir management plans. The current results submitted along this proposal
    could be extended to an advanced formulation of the reservoir management plan,
    daily production operational changes to meet critical targets and the operator’s
    policy of developing domestic oil resources responsibly.'
