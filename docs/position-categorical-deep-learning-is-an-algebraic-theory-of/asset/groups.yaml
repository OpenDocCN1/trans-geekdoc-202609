    \ Araújo *3 Petar Veličković *34\n\n## 摘要 \n\n我们对寻求一个用于规范和研究深度学习架构的通用框架这一探索性任务提出了我们的观点。我们的直觉是，关键在于目前在很大程度上在必须满足约束的规范与其实现之间建立了一座连贯的桥梁。专注于这种桥梁，我们建议应用范畴论——具体来说，就是值在程序\
    \ 2 范畴中的态的通用代数——作为一种在很大程度上涵盖了这些神经网络设计风格的理论。我们证明了我们的理论可以恢复几何深度学习的约束，以及来自神经网络多样化领域（如\
    \ RNN）的许多架构的实现。此外，我们还阐述了我们的理论如何使计算机科学和自动机中的许多标准构造可行。\n\n## 1 引言\n\n最令人期待的想法之一是提供一个引导性框架，通过该框架可以从原则上且广泛地推导出神经网络架构。近期人们进行了许多尝试，提供了框架来分类或描述大规模的深度学习架构（Cohen\
    \ et al., 2019; Xu et al., 2019; Bronstein et al., 2021; Chami et al., 2022; Pavillion\
    \ et al., 2023; Joshi et al., 2023; Weller et al., 2023）。\n\n我们观察到，深度学习架构描述模型通常有两种方式。首先是以自上而下的方式指定的，即通过模型满足的约束来描述模型（例如，为了尊重数据处理的结构）。另一种是自下而上的方法，通过实现描述模型，即通过执行前向/反向传播所需的一组张量操作。通常，为了在计算机科学的约束达成一致，我们必须超越几何学习（GL）。\n\
    \n## 1.1 我们的观点\n\n我们认为，自上而下和自下而上的方法已经分别得到了大量的关注，但还没有足够的表达能力来同时处理它们。如果我们需要深度学习的引导性框架，这种情况需要改变。为了支持我们的观点，我们在分歧的两侧都做了努力。\n\
    \n权衡框架最成功的案例之一是几何深度学习（Bronstein et al., 2021），GDL，它使用群论和表示论的视角，通过对称性保持约束来描述神经网络。此类层的实际实现是通过求解约束得出的。\n\
    \nGDL 被证明是强大的：例如，允许将卷积层构造为网格中平移不变性的精确解（Fukushima et al., 1983; LeCun et al., 1998），并通过消息传递和自注意力机制在图上进行学习（Mayer\
    \ et al., 2017; Vasikopoulos et al., 2017）。它还扩展到奇异领域，如球体（Coben et al., 2018; de\
    \ Haan et al., 2020）和几何约束（Fuchs et al., 2020）。虽然这涵盖了许多感兴趣的架构，但GDL 也有不可避免的限制。\n\
    \n首先，GDL 实现架构的可用性与求解方程约束的易程度直接相关。虽然 PyG（Fe & Lensen, 2019）、DGL（Wang, 2019）和 Jraph（Godwin\
    \ et al., 2020）在平移不变性模型方面取得了成功，且 JNN（Ceiper et al., 2021）在 E 等变模型方面取得了成功，但在未知领域很难复制这种成功。由于其关注群，GDL\
    \ 仅能够表示与对称的等价性，但无法操作我们使用神经网络在可逆（Worrall & Welling, 2019）或完全组合（de Hahn et al.,\
    \ 2020a）中对齐的操作。\n\n（注：原文此处存在大量重复句子，翻译已根据逻辑一致性进行处理或按原文结构保留）\n\n重新整理翻译如下：\n\n# 观点：认知深度学习是一种全架构的代数理论\n\
    \nBruno Granovovic *12 Paul Lessard *1 Andrew Dudzik *3\nTamara von Glehn *3 João\
