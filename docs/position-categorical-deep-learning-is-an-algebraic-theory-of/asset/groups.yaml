    \ B.3. A well-pointed endofactor $(F, \\sigma)$\n\ncomprises an endofactor $F\
    \ : C \to C$, and a natural transformation $\\sigma : id_C \\Rightarrow F$. A\
    \ pointed endofactor is said to be well-pointed if $F$ and $\\sigma$ either give\
    \ the same from the left or the right or in others, the natural transformations\
    \ $\\sigma \\circ F$ and $F \\circ \\sigma$ (which are of type $F \\Rightarrow\
    \ F$) are equal.\n\nAn algebra for a pointed endofactor $(F, \\sigma)$ is an algebra\
    \ $(A, a)$ for the endofactor $F$ for which the following diagram\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_13_0.png)\n\
    \n*Remark B.4.* Well-pointedness is a property, not structure, algebras for well-pointed\
    \ endofactors are just algebras for the pointed endofactors. Morphisms of algebras\
    \ for pointed endofactors are morphisms of algebras for the underlying endofactor.\n\
    \n*Example B.5* (Monads and pointed endofactors, idempotent monads and well-pointed\
    \ endofactors). The unit and underlying endofactor of a monad constitute a pointed\
    \ endofactor. If moreover monad is idempotent, then that pointed endofactor is\
    \ well-pointed.\n\n*Definition B.6.* For a given endofactor $F$, its algebra and\
    \ algebra homomorphism we denote by $\text{Alg}_{Endof}(F)$; For $(F, \\sigma)$\
    \ a well-pointed endofactor we denote by $\text{Alg}_{Endof}(F)$ the category\
    \ of algebras and morphisms thereof. For $(F, \\mu)$ an algebra and algebra homomorphism\
    \ then we denote by $\text{Alg}_{Mnd}(F)$.\n\n*Lemma B.7.* Suppose $F$ is an endofactor\
    \ on a category $\\mathcal{C}$ with coproducts. Then there is an equivalence of\
    \ categories $\text{Alg}_{Endof}(F) \\simeq \text{Alg}_{Pre}(F + id)$.\n\n*Definition\
    \ B.8.* Given $F : C \to C$, an algebraically free monad on $F$ is a monad $\t\
    ext{Free}(F)$ together with an equivalence of categories $\text{Alg}_{Endof}(F)\
    \ \\simeq \text{Alg}_{Mnd}(\text{Free}(F))$ which preserves the respective functors\
    \ to $C$ that forget the algebraic structure.\n\n# B.2. Kelly's Unified Transfinite\
    \ Construction\n\nThe existence for algebraically free monads is Kelly's unified\
    \ transfinite construction (Kelly, 1980).\n\n*Definition B.9* (Reflective subcategory).\
    \ A subcategory $\\mathcal{D}$ of a category $\\mathcal{C}$ is **reflective**\
    \ if the inclusion functor $F : D \to \\mathcal{C}$ admits a left adjoint. A reflective\
    \ subcategory is **locally presentable category**.\n\n*Example B.10* (Reflective\
    \ categories are reflective in graphs). Nearly every category encountered in practice\
    \ is a locally presentable category: The categories of monads, groups, rings,\
    \ vector spaces, and modules are locally presentable. As are the categories of\
    \ topological spaces, metric spaces, and uniform spaces. While beyond the scope\
    \ of this document to explain too much it, local presentability is a powerful\
    \ notion of what it means for objects and morphisms to be of things defined by\
    \ equalities of set-expressions.\n\n*Definition B.12 (Accessible category and\
    \ accessible functor). For an ordinal $\\kappa$, a $\\kappa$-accessible category\
    \ $\\mathcal{C}$ is a category such that:\n\n+   - $C$ has $\\kappa$-directed\
    \ colimits;\n- there is a set of $\\kappa$-compact objects which generate $C$\
    \ under $\\kappa$-directed colimits.\n\nA $\\kappa$-accessible functor $F : C\
    \ \to D$ is a functor between $\\kappa$-accessible categories which preserves\
