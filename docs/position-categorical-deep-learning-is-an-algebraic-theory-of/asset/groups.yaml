    - 群 $G = \Sigma_n$ 是 $n$ 个元素的排列群，

    - 代数的载体对象为（标量）节点特征 $R^n$，以及可能的邻接矩阵 $R^{n \times n}$，

    - 第一个代数的结构映射 $P_{X,A} : \Sigma_n \times R^n \times R^{n \times n} \rightarrow
    R^{n \times n}$ 执行置换：$P_{X,A}(\sigma, X, A) = (P(\sigma)X, P(\sigma)AP(\sigma)^T)$，其中
    $P(\sigma)$ 是由 $\sigma$ 指定排列矩阵。

    - 第二个代数的结构映射 $P_X$ 同样执行置换，但仅针对节点特征。归约并不是严格必要的，但在设计图神经网络时这是标准做法——因为它们通常被假设不会修改其底层的计算图。我们在这里故意省略了这一归约，以说明我们的框架如何处理跨越不同代数的神经网络转换。


    ## C.2. 球面上的旋转等变学习


    导致了球面卷积的第一层（Cohen et al., 2018）。


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_15_1.png)


    在这种情况下：


    - 群 $G = SO(3)$ 是3D 旋转的特殊正交群。

    - 第一个代数的载体对象是 $S^2 \rightarrow R$；定义在球面上的（标量）数据。注意，在实践中，这将是理想的，因此应使用矩阵来表示它。

    - 第一个代数的结构映射 $p_{SO(3)} : SO(3) \times (S^2 \rightarrow R) \rightarrow (S^2 \rightarrow
    R)$ 在球面数据上执行 3D 旋转，如下：$p_{SO(3)}(\alpha, \beta, \gamma, \psi) = \phi$，使得 $\phi(x)
    = R(\alpha, \beta, \gamma)x$，其中 $R(\alpha, \beta, \gamma)$ 是由 ZYZ 欧拉角指定的旋转矩阵（此（反）旋转被应用于球面上的点
    $x \in S^2$）。

    - 第二个代数的载体对象是 $SO(3) \rightarrow R$；定义在旋转上的（标量）数据。同样，在实践中这将是非常理想的。

    - 第二个代数的结构映射 $p_{SO(3)} : SO(3) \times (SO(3) \rightarrow R) \rightarrow (SO(3)
    \rightarrow R)$ 现在在旋转矩阵数据上执行 3D 旋转，如下：$p_{SO(3)}(\alpha'', \beta'', \gamma''),
    \psi) = \phi$，使得 $\phi(x) = R(\alpha'', \beta'', \gamma'')^{-1}R(\alpha, \beta,
    \gamma)x$。


    ## C.3. G 上的 G 等变学习


    导致了 G-CNN（Cohen & Wiley, 2016）以及球面 CNN 的后续层（Cohen et al., 2018）。


    ```

    $G \times (G \rightarrow \mathbb{R}) \xrightarrow{G \times f} G \times (G \rightarrow
    \mathbb{R})$$$

    $$

    Ag \quad \quad \quad \quad Ag$$

    $$

    nG \rightarrow \mathbb{R} \xrightarrow{f} G \rightarrow \mathbb{R}$

    ```


    在这种情况下：


    - 群 G 也是载体对象的载体（G $\rightarrow R$）。

    - 两个代数的映射都通过复合遵循 G 的正则表示 $A_G : G \times (G \rightarrow R) \rightarrow (G \rightarrow
    R)$，形式如下 $A_G(g,\psi)(h) = \psi(g^{-1}h)$。


    ## D. Lawvere 理论与语法


    de Haan 等人 (202a) 利用函数自然变换的抽象扩展了神经网络中等变层的理论。在本节中，我们将解释如何从这些这些术语的角度来理解单子（monads）的态射以及代数的语义。


    定义 1.1. 如果 C 是一个范畴，则 C 上的预形（presheaf）是一个函子 $C^{op} \rightarrow Set$。对象为预形、态射为自然变换的范畴记为
    P(C)。


    固定 Set 上的单ad T，$C_T$ 表示其代数和同态的范畴。


    给定一个代数 $A \in C_T$，将 A 解释为函子的方法是通过 Yoneda 嵌入 $C_T \rightarrow P(C_T)$，它将 A 识别为预形
    $[-, A]$。Yoneda 函子是忠实的，这是一个标准结论，这意味着我们可以根据极限和余极限的定义，将代数态射识别为预形。


    此外，这些预形具有一个特殊的性质。如果 $\lim j$ 是 C 中的一个小上极限，那么 $[\lim j, A] = [\lim j, A]$（本质上是向所有类添加所有，向空读者添加
    0）。


    定义 D.2. 如果 C 是一个范畴且 J 是 C 中一个小上极限的类，则 C 上的 J-连续预形是一个预形 $F \in P(C)$，使得对于所有 $j
    \in J$，都有 $F(\lim j) = \lim F(j)$。PSh(C) 对应的全子范畴记为 PSh(C)，或者当 J 是所有小上极限的类时简称为
    PSh(C)。我们将使用 $[ ]$ 指代所有余积的类，用 0 指代空。


    事实证明 C 具有一个很好的性质：它是强紧致的（strongly compact），这意味着每个连续预形都可以像上述那样通过 C 中的一个对象表示出来。换句话说，我们有等识别
    $C = PSh(C)$。


    然而，处理整个范畴 C 是不实际的。在可能，我们希望用更易处理的词汇进行推理。这将为单子提供语法。


    定义 D.3. Kleisli 范畴 $K_T$ 是 C 的一个全子范畴。有限 Kleisli 范畴 $K_T^F$ 是 $K_T$。一元 Kleisli
    范畴 $K_T^U$ 是 $K_T$。


    ```

    $C_T \supset K_T \supset K_T^F \supset K_T^U$

    ```


