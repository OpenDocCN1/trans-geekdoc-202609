    **定义 A.1 (等价)。** 两个范畴 $C$ 和 $D$ 之间的等价记作 $C \xrightarrow{\sim} D$，由一对函子 $F : C
    \to D$ 和 $G : D \to C$ 组成，并伴有自然同构（每个分量都有逆的自然变换）$F \circ G \cong 1_C$ 和 $G \circ
    F \cong 1_D$。


    **定义 A.2 (初始对象)。** 范畴 $C$ 中的一个对象 $I$ 被称为**初始对象**，如果对于每一个 $X \in C$，自然满足 $\mathcal{C}(I,
    X) \cong 1$，这意味着只有一种类型为 $I \to X$ 的映射。


    **定义 A.3 (终态对象)。** 范畴 $C$ 中的一个对象 $T$ 被称为**终态对象**，如果对于每一个 $X \in C$，自然满足 $\mathcal{C}(X,
    T) \cong 1$，这意味着只有一种类型为 $X \to T$ 的映射。


    **定义 A.4 (极限)。** 对于范畴 $\mathcal{C}$ 和 $\mathcal{J}$，$\mathcal{C}$ 中形状为 $J$ 的图是一个函子
    $D : J \to \mathcal{C}$。一个到 $D$ 的锥（cone）由一个对象 $C \in \mathcal{C}$ 和一个从常对象 $C$
    到函子 $D$ 的自然变换组成，即对于每个对象 $j \in \mathcal{J}$，有一族态射 $c_j : C \to D(j)$，使得对于 $\mathcal{C}$
    中的任何 $f : i \to j$，下图均交换：


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_12_0.png)


    锥的态射 $\theta : (C, c_j) \to (C'', c''_j)$ 是 $\mathcal{C}$ 中的一个态射 $\theta$，它使得每个图都交换：


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_12_1.png)


    图 $D$ 的极限记作 $\text{lim } D$，是由 $D$ 的锥以及它们之间的态射构成的范畴 $\text{Cone}(D)$ 中的终态对象。


    **定义 A.5 (上极限)。** 图 $D : J \to C$ 的上极限 $\text{lim } D$ 是由 $D$ 的锥构成的范畴 $\text{Cone}(D)$
    中的初始对象，其中一个锥 $(C, c_j : D(j) \to C)$ 具有锥（上方）的对偶且态射方向相反。**小**（分别对应 $\kappa$-定向的、连通的……）上极限是指索引范畴
    $\mathcal{J}$ 是小的（分别对应 $\kappa$-定向的、连通的……）的上极限。


    **示例 A.6.**** 范畴 $C$ 中的终态对象是从该范畴到 $C$ 的唯一图。类似，初始对象是上极限的一个例子。


    ## B. 1-范畴代数


    **定义 B.1 (单子相干图)。** 三元组 $(M, \eta, \mu)$ 包含：


    - 一个自函子 $M : C \to C$；

    - 一个自然变换 $\eta : \text{id}_C \Rightarrow M；

    - 一个变换 $\mu : M \circ M \Rightarrow M$


    如果以下图均交换，则构成一个单子：


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_12_2.png)


    **定义 B.2 (自函子的共代数)。** 令 $\mathcal{C}$ 为一个范畴，$F$ 为 $\mathcal{C}$ 上的一个自函子。$F$ 的代数是一个对
    $(A, a)$，其中 $A$ 是 $\mathcal{C}$ 的对象，$a : A \to F(A)$ 是 $C$ 的一个态射。


    ## 范畴深度学习


    ### B.1. 良点自算子与代数自由的单子


    在本小节中，我们将通过良点自算子以及针对此类自算子的代数自由单子的超限构造，将自算子及其代数与单子联系起来。


    ### 定义 B.3. 良点自算子 $(F, \sigma)$


    包含一个自算子 $F : C \to C$ 和一个自然变换 $\sigma : id_C \Rightarrow F$。一个带点的自算子被说是**良点的**，如果
    $F$ 和 $\sigma$ 从左侧或右侧给出相同的结果，或者在其他情况下，自然变换 $\sigma \circ F$ 和 $F \circ \sigma$（类型为
    $F \Rightarrow F$）相等。


    一个带点自算子 $(F, \sigma)$ 的代数是自算子 $F$ 的代数 $(A, a)$，其满足以下图：


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_13_0.png)


    *备注 B.4.* 良点性是一种性质而非结构，良点自算子的代数只是带点自算子的代数。带点自算子代数的态射是其底层自算子代数的态射。


    *示例 B.5*（单子与带点自算子，幂等单子与良点自算子）。单子的单位和底层自算子构成一个带点自算子。如果单子此外是幂等等的，那么该带点自算子就是良点的。


    *定义 B.6.* 对于给定的自算子 $F$，其代数和代数同态记为 $\text{Alg}_{Endof}(F)$；对于良点自算子 $(F, \sigma)$，我们用
    $\text{Alg}_{Endof}(F)$ 表示代数及其同态构成的范畴。对于 $(F, \mu)$ 代数和代数同态，我们记为 $\text{Alg}_{Mnd}(F)$。


    *引理 B.7.* 假设 $F$ 是具有余积范畴 $\mathcal{C}$ 上的自算子。存在范畴等价 $\text{Alg}_{Endof}(F) \simeq
    \text{Alg}_{Pre}(F + id)$。


    *定义 B.8.* 给定 $F : C \to C$，在 $F$ 上的代数自由单子是一个单子 $\text{Free}(F)$ 连同一个范畴等价 $\text{Alg}_{Endof}(F)
    \simeq \text{Alg}_{Mnd}(\text{Free}(F))$。


    ### B.2. Kelly 的统一超限构造


    $F$ 上的代数自由单子是一个单子 $\text{Free}(F)$ 连同一个范畴等价 $\text{Alg}_{Endof}(F) \simeq \dots$
    这种构造（Kelly, 1980）。


    **定义 B.9 (反射子畴)。** 如果包含函子 $F : D \to C$ 是反射的，则子畴 $D$ 是**反射子畴**。


    *示例 B.10.* 范畴是性质的，不是结构。良点自算子的代数只是带点自算子的代数。反射的。


    **定义 B.12 (可积范畴)。** 一个 $\kappa$-极限的范畴 $\mathcal{C}$ 是**可积的，如果：


    - $D$ 的一个锥 $(C, c_j : D(j) \to C)$ 具有锥（上方）的对偶且态射方向相反。

    - 对于 $\mathcal{C}$ 中的任何 $f : i \to j$，下图均交换。


    *备注 B.13.* 可积性是 $D$ 的一种性质。图 $D$ 的极限记作 $\text{lim } D$，是由 $D$ 的锥以及它们之间的态射构成的范畴
    $\text{Cone}(D)$ 中的终态对象。


