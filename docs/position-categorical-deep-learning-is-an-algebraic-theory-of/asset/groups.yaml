    \ et al., 2023; Joshi et al., 2023; Weller et al., 2023）。\n\n我们观察到，深度学习架构描述模型通常有两种方式。首先是以自上而下的方式指定的，即通过模型满足的约束来描述模型（例如，为了尊重数据处理的结构）。另一种是自下而上的方法，通过实现描述模型，即通过执行前向/反向传播所需的一组张量操作。通常，为了在计算机科学的约束达成一致，我们必须超越几何学习（GL）。\n\
