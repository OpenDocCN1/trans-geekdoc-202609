    |               |

    |               |

    R^n\times A f R^n\times A

    ```


    Elementwise, the commutativity of that diagram equals the equation


    ```

    f(g \triangleright x) = f(x)

    ```


    The translation example, for instance, recovers the equation f((i'',j'') \triangleright
    x(i,j)) = (i'',j'') \triangleright f(i,j) which reduces to f(i-i'', j-j'') = f(i,j).
    Intuites that, for any displacement (i'',j''), the result of translating the input
    by (i'',j'') and then applying the function f is the same as just f.

