    # H.1. Examples Linear equivariant for pair of pixels.


    **Example H.1** (Linear equivariant for pair of pixels). Consider the category
    Vect of finite-dimensional vector spaces and linear maps. For simplicity, we assume
    that the carrier is $R^2$, if $f : R^2 \to R^2$ is equivariant with respect to
    $\to$, then for any $[x_1, x_2] \in R^2$ it must hold that


    | w1x2 + w2x1 | w3x1 + w4x1 |

    | w3x2 + w4x1 | w1x1 + w2x2 |


    (11)


    This implies that $w_3 = w_2$ and $w_4 = w_1$, meaning $W$ is of the form


    | w1 w2 |

