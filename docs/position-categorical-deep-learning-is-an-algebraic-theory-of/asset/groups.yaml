    \n权衡框架最成功的案例之一是几何深度学习（Bronstein et al., 2021），GDL，它使用群论和表示论的视角，通过对称性保持约束来描述神经网络。此类层的实际实现是通过求解约束得出的。\n\
    \nGDL 被证明是强大的：例如，允许将卷积层构造为网格中平移不变性的精确解（Fukushima et al., 1983; LeCun et al., 1998），并通过消息传递和自注意力机制在图上进行学习（Mayer\
    \ et al., 2017; Vasikopoulos et al., 2017）。它还扩展到奇异领域，如球体（Coben et al., 2018; de\
    \ Haan et al., 2020）和几何约束（Fuchs et al., 2020）。虽然这涵盖了许多感兴趣的架构，但GDL 也有不可避免的限制。\n\
