    \ et al., 2020）在平移不变性模型方面取得了成功，且 JNN（Ceiper et al., 2021）在 E 等变模型方面取得了成功，但在未知领域很难复制这种成功。由于其关注群，GDL\
    \ 仅能够表示与对称的等价性，但无法操作我们使用神经网络在可逆（Worrall & Welling, 2019）或完全组合（de Hahn et al.,\
    \ 2020a）中对齐的操作。\n\n## 1.2 我们的立场\n\n我们认为，构建一个适用于所有深度学习的框架，需要稳健地连接自上而下和自下而上的方法，这种连接的自然候选者是范畴论。\n\
    \n值得注意的是，我们并不是第一个通过计算机科学视角处理神经网络的方法（Benglyn et al., 2015），但通过范畴论探索神经网络的语法语义（Sonoda\
    \ et al., 2023a; 2024）并应用于机器学习（Gavranovic, 2020）。\n\n"
