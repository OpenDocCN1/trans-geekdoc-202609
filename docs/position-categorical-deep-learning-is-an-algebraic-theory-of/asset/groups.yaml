    # Position: Cognitive Deep Learning is an Algebraic Theory of All Architectures


    Bruno Granovovic *12 Paul Lessard *1 Andrew Dudzik *3

    Tamara von Glehn *3 João Araújo *3 Petar Veličković *34


    ## Abstract


    We present our position on the elusive quest for a general-purpose framework for
    specifying and studying deep learning architectures. Our intuition is that the
    keys map so far a coherent bridge between specifications which must satisfy constraints
    and their implementations. Focusing on such a bridge, we propose to apply category
    theory—precisely, the universal algebra of morphisms valued in a 2-category of
    programs—as a theory largely subsuming these flavours of neural network design.
    We show that our theory recovers constraints by geometric deep learning, as well
    as implementations of many architectures from the diverse landscape of neural
    networks, such as RNNs. We also illustrate how our theory enables many standard
    constructs in computer science and automata.


    ## 1. Introduction


    One of the most coveted ideas is to provide a guiding framework from which neural
    network architectures can be principally and widely derived. Many attempt have
    recently been made, offering frameworks to categorize or describe large sheaves
    of deep learning architectures (Cohen et al., 2019; Xu et al., 2019; Bronstein
    et al., 2021; Chami et al., 2022; Pavillion et al., 2023; Joshi et al., 2023;
    Weller et al., 2023) to need a frame.


    We observe that there are, typically, two ways in how deep learning architectures
    describe models. First, specified in a top-down manner, wherein models are described
    by the constraints they satisfy (e.g. in order to respect the structure of the
    data process). Alternatively, a bottom-up approach describes models by their implementation,
    via a set of tensor operations required to perform their forward/backward pass.
    Generally, in order to align about constraints in computer science, we must go
    beyond GL.


    ## 1.1 Our Opinion


    It is our opinion that ample attention has already been given to both the top-down
    and bottom-up approaches in isolation, and there hasn''t been sufficiently expressive
    to address them simultaneously. If we want guiding framework for deep learning,
    this needs to change. To support our opinion, we perform a few efforts on both
    sides of the divide.


    One of the most successful examples of the tradeoff framework is geometric deep
    learning (Bronstein et al., 2021), GDL, which uses a group- and representation-theoretic
    perspective to describe neural networks via symmetry preserving constraints. The
    actual realisations of such layers are derived by solving constraints.


    GDL proved to be powerful: allowing, e.g. to construct convolutional layers as
    an exact solution to translation invariance in grids (Fukushima et al., 1983;
    LeCun et al., 1998), and passing message and self-attention mechanisms to perform
    learning over graphs (Mayer et al., 2017; Vasikopoulos et al., 2017). It also
    extends to exotic domains such as spheres (Coben et al., 2018; de Haan et al.,
    2020) and geometric constraints (Fuchs et al., 2020). While this covers many architectures
    of interest, GDL also has inescapable constraints.


    Firstly, usability of GDL to implement architectures correlates directly with
    how easy it is to resolve equation constraints. While PyG (Fe & Lensen, 2019),
    DGL (Wang, 2019) and Jraph (Godwin et al., 2020) have had success for translation-invariant
    models, and JNN (Ceiper et al., 2021) for E-equivariant models, it is hard to
    replicate success for areas where it is not known. Because of its focus on groups,
    GDL is only able to represent equivalence to symmetry, but not operate tions we
    use neural networks to align in invertible (Worrall & Welling, 2019) or fully
    compositional (de Hahn et al., 2020a). This is not a small collection of operators;
    if we can align a model to algorithm (Xu et al., 2019), it is fairly common for
    the target algorithm to transform data, for example when performing any of path-finding
    connection (Dudzik & Likovič, 2022).


    of parametric maps, as well we do in this paper. Further, prior art in syntax-semantics
    connections assumes that the operations are taking place in some topological space
    or that neural architectures have a very specific form—our framework assumes neither.


    On the other hand, bottom-up architectures are commonly embedded in packages,
    like TensorFlow (Abahi et al., 2016), PyTorch (Pasch et al., 2019) and JAX (Brad
    et al., 2018). These frameworks have become indispensable in the implementation.
    JAX is the most direct, as it is built around "pure functions", but features many
    other deep learning frameworks as well.


    ## 1.2 Our Position


    It is position that constructing a framework for all of deep learning, requires
    robustly bridging the top- and bottom-up approaches to neural network specification
    with a unifying framework, and the concepts that this bridging could come from
    computer science. However, such a framework must generalize both group theory
    and functional programming—and a natural candidate for achieving this is category
    theory.


    It is worth noting that ours is not the first approach to computer science through
    the lens of networks (Benglyn et al., 2015), but explore the syntax and semantics
    in neural networks (Sonoda et al., 2023a; 2024) by apply Category Theory to machine
    learning (Gavranovic, 2020). We are unaware of any prior work that tackles the
    connection of neural network architectures and the algebras


    ## 1.3. The Power of Category Theory


    To understand why we are here, we must first put the field of category theory
    in context. Minimally, it may be caused by a baseline-tested of systems, and then
    applied again across scientific fields. In abstract algebra, category theory has
    flourished since, and information has been used to express ideas from numerous
    fields in a unified manner, helping to reveal previously unheard aspects.


    This has resulted in a reliable set of matter theories and tools; from algebra,
    topology, combinatorics to recursion and dependent types, all of them with a mutually
    compatible interface. Category theory in machine learning has emerged (Fevikin
    & Smeding, 2024; Alvarez-Pazco et al., 2021; Gavranovic, 2022), operational data
    analysis (Guss & Sukalahdin, 2018), natural language processing (Lewis, 2019),
    causal inference (Jacobi et al., 2019), producing an entire category picture of
    gradient-based learning—from architectures to backup—in Cruwell et al. (2022);
    Gavranovic (2024).


    ## 1.1. ESSENTIAL CONCEPTS


    Before we begin, we will recall three essential concepts in category theory, which
    will be necessary for our exposition. First, we define a category, an axiomatisation
    of a compositional structure.


