    **定义 1.5** (自然变换)。令 $F: C \to D$ 和 $G: C \to D$ 为 $C$ 和 $D$ 之间的两个函子，一个自然变换 $\alpha:
    F \to G$ 是对于每个对象 $X \in C$，对应 $D$ 中的一个态射 $\alpha_X: F(X) \to G(X)$，使得对于 $C$ 中的任意态射
