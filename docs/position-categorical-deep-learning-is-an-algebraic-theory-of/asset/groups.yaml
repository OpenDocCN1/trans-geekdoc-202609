    matrix. Circulant matrices are known in neural networks as convolutional layers,
    the essence of modern CNNs (Fukushima et al., 2013; LeC et al., 1998).


    **Example H.3** (Invariant maps) are also $(G \times X)$-algebrahomomorphisms
