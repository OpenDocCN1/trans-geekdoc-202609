    Here $\delta_\epsilon(M)$ is the category whose objects are elements of $M$, and
    morphisms are the identities. Since $M$ is a monad, $\delta_\epsilon(M)$ is a
    monadic category, so $\delta_\epsilon(M) \times -$ is a monad.


    As the set of endomorphisms on a monad $A$ is isomorphic to the set of endofunctors
    on the category given the deloping of the monad, an M-module can be seen as a
    one-object algebra for this 2-monad. Indeed, this is a special case of any algebra.


    **Example F.5** (Cocyles as lax monoids). The monoidal cycles, or "crossed monoids",
    used in (Dudzik et al., 2024) to study synchrony in networks, can be described
    as lax monoids for 2-monad algebras. As if $A$ is an M-module, $BA$ is an algebra
    for $\delta_\epsilon(M) \times -$.


    G. The 2-category Para(C)


    **Definition G.1** (para, Currutt et al., 2022; Capucci et al., 2022). Given a
    monoidal category $(\mathcal{M}, \otimes)$ and an M-category $\mathcal{C}$, let
    Para$(\mathcal{C})$ be the 2-category:


    - Objects of the category;

    - Morphisms $X \to Y$ are pairs $(P, f)$, where $P$ is an object of $M$ and $f
    : P \blacktriangleright X \to Y$ is a morphism of $C$.


    > 12Contrary to a M-action A, where A is a set, in a M-module A comes equipped
    with a monoidal structure too.

