    # 分类深度学习


    **示例 L4** (Mealy 单元 / 全连接 RNN)。考虑电感器 $I \rightarrow O$ – 示例 2.11。通过示例 E.10 中的强度，我们可以得到
    2 阶自算子 $Para(I \rightarrow O) : Para(Set) \rightarrow Para(Set)$。然后一个 Mealy 单元作为余代（coalgebra）出现。


    更具体地说，一个余代包含载集 $S$ 和一个参数映射 $(P, cell^{\text{Mealy}}) \in Para(Set), (S, I \rightarrow
    S)$。这里，$cell^{\text{Mealy}}$ 可以被看作映射 $P \times S \rightarrow I \rightarrow O \times
    S$，如图所示。我们将其解释为一个消耗隐藏状态 $S$，并输出 $O$ 以及更新后的输入 $O$ 和更新后的隐藏状态的循环神经网络。


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_28_0.png)


    图 8. 对象 $S$ 的 $Para((I \rightarrow O))$ 2 阶自算子的示例，以及一个映射 $f: P \times S \rightarrow
    I$，我们对其进行了统一处理。


    **示例 L5** (Mealy 机器)。考虑示例 H.7 中的电感器 $O \rightarrow (I \rightarrow -)$。通过 $\sigma_{p,X}:
    P \times O \times (I \rightarrow O) \rightarrow Para(O \times (I \rightarrow -))$,我们得到
    2 阶自算子 $Para(O \times (I \rightarrow -)) : Para(Set) \rightarrow Para(Set)$。然后一个
    Mealy 单元作为它的余代出现。


    更具体地说，一个余代包含载集 $S$ 和一个参数映射 $(P, cell^{\text{More}}) \in Para(Set), (S, O \times
    (I \rightarrow S))$。这里，$cell^{\text{More}}$ 可以被看作映射 $P \times S \rightarrow O
    \times (I \rightarrow S)$，如图所示。将其分为两个部分 $cell^{\text{More}}: P \times S \rightarrow
    O$ 和 $cell^{\text{More}}: P \times S \rightarrow I$。


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_28_1.png)


    图 9. $Para(O \times (I \rightarrow -))$ 作为参数模型的示例。这里输出不依赖于当前输入。


    # 通过超有限构造展开神经网络


    我们将从自算子到自由单子代（free monads）的超有限构造中获益，以及这些网络相应的展开。具体而言，凭借定理 G.10 迈向权重源自范畴框架的路径，我们可以对这些网络进行展开。为了空间和清晰起见，展开是通过
    2 阶单子的自算子代数的长度同态来完成的。


    **示例 J.1** (迭代折叠 RNN)。考虑 $Para(1+A \times -)$ 的一个代数 $(P, cell^{\text{fold}})$，这是一个折叠
    RNN 单元（示例 I.1）。它的展开是一个 $Para(1+A \times -)$，其中 $\Delta p: P \rightarrow P \times
    P$ 是复制映射。


    ```

    $$1+A \times List(A) \xrightarrow{\Delta p} 1+A \times X\n\gamma(Nil, Cell) \Downarrow
    (P, cell^{\text{fold}})\nList(A) \xrightarrow{f_{rent}} X\n\quad \quad \quad (17)$$

    ```


    这里映射 $f_{rent}$ 是 *fold*（折叠，示例 2.12）的参数类比：


    ```h

    front :: (p, List a) -> x

    front p Nil = cell^p (inl ())

    front p (Cons a as) = cell^p (inr a (front as))

    ```


    我们可以看到 `front` 是结构递归的：它通过将 `cell^front` 应用于参数 $p$ 与具有相同参数的 `front` 输出以及相同尾部的输出，来处理列表的头部。


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_29_0.png)


    我们继续证明 $\Delta p$ 是参数态的有效参数化。分别解包等式 (17) 右上角和左下角的复合，得到参数映射：


    ```

    P × (1 + A × List(A)) → X

    nP × (1 + A × List(A)) → X

    ```


    它们的实现分别为：


    ```

    (p, q, inl(•)) -> cell^front (p, in(•))

    (p, inr(a, as)) -> cell^front (q, a, f(p, as))

    (p, •) -> cell^front (p, in(•))

    (p, (a, as)) -> cell^front (p, a, f(p, as))

    ```


    很容易看出 $\Delta p$ 是它们的有效参数化，“纽结”了参数 $p$ 和 $q$。


    **示例 1.2** (迭代展开)。考虑 $Para(O \times -)$ 的一个余代 $(P, cell_0, cell_0)$，$i$ 是一个展开单元（示例
    1.3）。它的展开是下方的 $Para(O \times -)$余代：


    | | | |

    |---|---|---|

    | $(P, cell_0, cell_0)$ | $(P, f_n)$ | Stream(O) |

    | $\Delta p$ | $\gamma((output,next))$ | |

    | $O \times X$ | $Para(O \times -), (f_n)$ | Stream(O) |


    这里 $f_n :: P \times X \rightarrow Stream(O)$ 是 unfold（展开，示例 1.5）的语法类比：


    ```

    f_n :: (p, x) -> Stream

    f_n p x = MKStream (cell_n p x) (f_n p)

    ```


    我们可以看到 $f_n$ 是结构递归的：它产生一个头部为 $cell_n(p,x)$ 的流。


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_29_1.png)


    图 1. 展开的“折叠”循环神经网络的字符串表示。


    **示例 J.3** (迭代递归 NN)。考虑 $Para(A + (-)^2)$ 的一个代数 $(P, cell^{f_{CSV}})$，即一个递归网络单元（示例
    1.2）。它的展开是 $Para(A + (-)^2)$代数之间的映射：


    ```

    $$\begin{aligned} A + Tree(A)^2 & \text{Para}(A+(-)^2)((P,f_{CSV})) & \to A +
    X^2 \\ \downarrow \Delta_P & \downarrow (P,cell^{f_{CSV}}) \\ Tree(A) & X \end{aligned}$$

    ```


    $f_{CSV}$ 是具有以下实现的函数：


    ```

    f_{CSV} :: (p, Tree a) -> x

    f_{CSV} p (Leaf a) = cell^p (inl a)

    f_{CSV} p (Node l r) = cell^p (in(f_{CSV} p l)) r

    ```


    该函数执行了权重共享，因为对子树的递归使用了相同的参数 $p$。


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_30_0.png)


    **示例 J.4** (迭代 Mealy 单元)。考虑 $Para(I \times -)$ 的一个代数 $(P, cell^{Mealy})$，即一个 Mealy
    机器（示例 2.11）。它的展开是 $Para(I \times -)$代数同态：


    ```

    $$\begin{aligned} (P,f_m) & \to Mealy_{O,I} \\ \downarrow \Delta_P & \downarrow
    \gamma(next) \\ I \times X & Para(I \times -), ((P,f_n)) \to (I \to O \times Mealy_{O,I})
    \end{aligned}$$

    ```


    $f_n$ 是具有以下实现的核心函数：


    ```

    f_n :: (p, x) -> Mealy

    f_n (p, x) = MkMealy $ i - let (o'', x'') = n p i in (o'', x''), f_n p''

    ```


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_30_1.png)


    **示例 J.5** (迭代 Moore 机器)。考虑 $Para(O(I \rightarrow -))$ 的余代 $P, cell^{Moore}$，即一个
    Moore 机器（示例 H.7）。它的展开是 $Para(O \times (I \rightarrow -))$ 余代同态：


    ```

    $$\begin{aligned} X & (P,f_n) & \rightarrow Moore_{O,I} \ (P,(o_n)) \\ \searrow
    \Delta_P & \gamma(next) O \times (I \rightarrow -) \rightarrow X & Para(O\times(I\rightarrow
    -))((P,f_n)) \rightarrow (I \to O \times Moore_{O,I}) \end{aligned}$$ (21)

    ```


    在代码中，$f_n$ 是一个强制函数：


    ```

    f_n :: (p, x) \rightarrow Moore o

    f_n (p, x) = MkMoore \$ \backslash i \rightarrow (o \ p \ x, f_n \ p \ n \ x \
    i)

    ```


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_31_0.png)


