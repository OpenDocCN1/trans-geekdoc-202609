    \ transformation between functors; this is the first and final concept we cover.\n\
    \n+   - For each object $A \\in C$, there is a unique identity $id_A: A \rightarrow\
    \ A$.\n\n**Definition 1.5** (Natural transformation). Let $F: C \rightarrow D$\
    \ and $G: C \rightarrow D$ be two functors between $C$ and $D$, a natural transformation\
    \ $\\alpha: F \rightarrow G$ of choice, for every object $X \\in C$, of a morphism\
    \ $\\alpha_X: F(X) \rightarrow G(X)$ in $D$ such that for every morphism $f: X\
    \ \rightarrow Y$ in $C$, it holds that $\\alpha_Y \\circ F(f) = G(f) \\circ \\\
    alpha_X$.\n\n+   - For any two morphisms $f: A \rightarrow B$ and $g: B \rightarrow\
    \ C$, there must exist a unique morphism whose composition $g \\circ f: A \rightarrow\
    \ C$.\n\nThe morphism $\\alpha_X$ is called the component of the natural transformation\
    \ at the object $X$.\n\nsuch to the following conditions:\n\n+   - For any morphism\
    \ $f: A \rightarrow B$, it holds that $id_B \\circ f = f \\circ id_A$.\n\n+  \
    \ - For three composable morphisms $f: A \rightarrow B, g: B \rightarrow C, h:\
    \ C \rightarrow D$, composition is associative, i.e., $h \\circ (g \\circ f) =\
    \ (h \\circ g) \\circ f$.\n\nThe components of a natural transformation assemble\
