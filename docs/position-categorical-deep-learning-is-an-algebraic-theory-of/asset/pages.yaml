  md: '# Categorical Deep Learning


    **Definition E.9** (Actorical strong monad coherence diagrams). A monad $(T, \mu,
    \eta)$ on the category $C$ of a $\mathcal{M}$-category $(\mathcal{C}, \blacktriangle)$
    is called **strong** if it is equipped with a natural transformation $\sigma_{P,A}
