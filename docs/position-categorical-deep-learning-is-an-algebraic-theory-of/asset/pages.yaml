    \ 7. An algebra for $Para(O \\times -)$ consists of an unfolding recurrent neural\
    \ network.\n\nstarting state produces a stream of outputs.\n\n$^{16}$We note that\
    \ the hidden state is allowed to denote the parameter, which is not possible in\
