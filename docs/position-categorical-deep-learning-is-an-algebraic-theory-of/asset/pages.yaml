  md: "# A. Category Theory Basics\n\nThe natural notion of ‘sameness’ for categories\
    \ is equivalence:\n\n**Definition A.1 (Equivalence).** An equivalence between\
    \ two categories $C$ and $D$, written $C \\xrightarrow{\\sim} D$, consists of\
    \ a pair of functors $F : C \to D$ and $G : D \to C$ with natural isomorphisms\
    \ (natural transformations where every component has an inverse) $F \\circ G \\\
    cong 1_C$ and $G \\circ F \\cong 1_D$.\n\n**Definition A.2 (Initial).** An object\
    \ $I$ in a category $C$ is called **initial** if for every $X \\in C$ naturally\
    \ holds that $\\mathcal{C}(I, X) \\cong 1$, meaning that there is only one map\
    \ of type $I \to X$.\n\n**Definition A.3 (Terminal).** An object $T$ in a category\
    \ $C$ is called **terminal** if for every $X \\in C$ naturally holds that $\\\
    mathcal{C}(X, T) \\cong 1$, meaning that there is only one map of type $X \to\
    \ T$.\n\n**Definition A.4 (Limit).** For categories $\\mathcal{C}$ and $\\mathcal{J}$,\
    \ a diagram of shape $J$ in $\\mathcal{C}$ is a functor $D : J \to \\mathcal{C}$.\
    \ A cone to $D$ consists of an object $C \\in \\mathcal{C}$ and a natural transformation\
    \ from a constant object $C$ to the functor $D$, a family of morphisms $c_j :\
    \ C \to D(j)$ for each object $j \\in \\mathcal{J}$, such that for any $f : i\
    \ \to j$ in $\\mathcal{C}$ the following diagram commutes:\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_12_0.png)\n\
    \nA morphism of cones $\theta : (C, c_j) \to (C', c'_j)$ is a morphism $\theta$\
    \ in $\\mathcal{C}$ making each diagram\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_12_1.png)\n\
    \ncommute. the limit of a diagram $D$, written $\text{lim } D$, is the terminal\
    \ object in the category $\text{Cone}(D)$ of cones to $D$ and morphisms between\
    \ them.\n\n**Definition A.5 (Colimit).** The colimit $\text{lim } D$ of a diagram\
    \ $D : J \to C$ is the initial object in the category $\text{Cone}(D)$ of cones\
    \ to $D$, where a cone $(C, c_j : D(j) \to C)$ has the dual of a cone (above)\
    \ with the morphisms reversed. **Small** (respectively $\\kappa$-directed, connected,\
    \ ...) colimits are colimits for which the indexing category $\\mathcal{J}$ is\
    \ small (respectively $\\kappa$-directed, connected, ...)\n\n**Example A.6.**\
    \ A terminal object in a category $C$ is the unique diagram from the category\
    \ to $C$. Similarly an initial object is an example of a colimit.\n\n# B. 1-Categorical\
    \ Algebra\n\n**Definition B.1 (Monad coherence diagrams).** A triple $(M, \\eta,\
    \ \\mu)$ of:\n\n+   - an endofunctor $M : C \to C$;\n- a natural transformations\
    \ $\\eta : \text{id}_C \\Rightarrow M$;\n- a transformation $\\mu : M \\circ M\
    \ \\Rightarrow M$\n\nconstitute a monad if the following diagrams commute:\n\n\
    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_12_2.png)\n\n**Definition B.2 (Coalgebra\
    \ for an endofunctor).** Let $\\mathcal{C}$ be a category and $F$ an endofunctor\
    \ on $\\mathcal{C}$. A coalgebra for $F$ is a pair $(A, a)$ where $A$ is an object\
    \ of $\\mathcal{C}$ and $a : A \to F(A)$ is a morphism of $C$."
