    \ we can always extract an output and a function which an input produces another\
    \ Moore. In Example 5 we will see how this will be related to general recurrent\
    \ neural networks of a particular form.\n\n**Example H.8** (Unfolds to Moore machines\
    \ are terminal $(O \\times -)$-codgebras). Consider the endofunctor $O \\times\
    \ (I \\to -)$ from Example H.7, and any other $(O \\times -), (o, n)$ to $\\text{Moore}_{O,I},\
    \ (output, next):\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_26_0.png)\n\nThen\
    \ the map $f_{o,n}$ is necessarily an unfold to a Moore machine, describing how\
    \ a Moore machine is obtained from a single value. It is a recursive function\
    \ as follows:\n\n```\n$f_m : x \\to Moore \\ o \\n f_m \\ x = MkMoore (m_1 \\\
    \ x) \\ (\\lambda i \\to f_m (m_2 \\ i))$\n```\n\nwhich is natural in nature,\
    \ it satisfies the following two equations which arise by unpacking the coalgebra\
    \ morphism equations aswise:\n\n```\n$o(x) = output(f_{o\n```\n\nHere Equation\
    \ (15) tells us that the output of the Moore machine produced by $f_{o,n}$ at\
    \ $x$ is given by the output of n at $x$, and Equation (16) tells us that $i$\
    \ is the one produced by $f_{o,n}$ at $n(x).\n\n27"
