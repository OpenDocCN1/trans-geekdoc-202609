    \ Set is a category whose objects are sets, and functions are between them.\n\n\
    # ## 2. From Monad to Algebras\n\nAnd another example, for geometric DL:\n\n**Example\
    \ 1.3** (Monads as categories). A group $G$, can be represented as a category,\
    \ with a single object $G$, and morphisms $g: G \rightarrow G$ corresponding to\
    \ elements. Note that $G$ is a group if the binary operation is isomorphic. Note\
    \ that $G$ is a group if and only if its morphisms are isomorphisms, for each\
    \ $g: G \rightarrow G$ there exists $h: G \rightarrow G$ such that $g \\circ h\
    \ = h \\circ g = id$. More, we can identify one-object categories, which are not\
    \ necessarily invertible, with monads.\n\nHaving set the essential concepts, we\
    \ want to discuss a categorical framework which generalizes geometric deep learning\
    \ (Bronstein, 2021). We will define a powerful notion (monad algebra homomorphism)\
    \ and demonstrate the specific case of monads induced by group actions. Generalising\
    \ from monads and their algebras we will find that our theory can express processes\
    \ structured data from computer science (e.g. lists and trees) and behave in set\
    \ ways like automata.\n\nThe power of theory starts to emerge when we interact\
    \ different categories. Just as functors of sets and morphisms of groups, there\
    \ is a more generic concept of structure preserving between categories.\n\n**Definition\
    \ 1.4** (Functor). Let $C$ and $D$ be two categories. $F: C \rightarrow D$ is\
    \ a functor between them, if it maps each object and morphism of $C$ to one in\
    \ $D$, and the following conditions hold\n\n+   - For any object $A \\in C$, $F(id_A)\
    \ = id_{D(A)}$.\n\n+   - For any composable morphisms $f, g$ in $C$, $F(g \\circ\
    \ f) = F(g) \\circ F(f)$.\n\n> ¹The term 'collection', rather than set, avoids\
    \ Russell's paradox, as objects may be viewed as sets. Categories that can be\
    \ defined with sets as small categories.\n\n**Definition 2.1** (Monad). Let $C$\
    \ be a category. A monad on $C$ is a triple $(M, \\eta, \\mu)$ where $M: C \r\
    ightarrow C$ is an endofunctor, and $\\eta: C \rightarrow M$ and $\\mu: M \\circ\
    \ M \rightarrow M$ are natural transformations (where $\\mu$ is function composition),\
    \ making diagrams in Definition 1. commute.\n\n**Example 2.2** (Group action monad).\
    \ Let $G$ be a group. The functor $G \times - \text{Set} \rightarrow \text{Set}$\
    \ is an endofunctor mapping a set $X$ to the set $G \times X$.\n\n> ²To the best\
    \ of our knowledge, these ideas were first conjectured in Olah (2015) in the language\
    \ of functional programming."
