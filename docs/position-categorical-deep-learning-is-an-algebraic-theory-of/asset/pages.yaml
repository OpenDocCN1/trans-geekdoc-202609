  md: "# Categorical Deep Learning\n\n**Example L4** (Mealy cell / Full RNN). Consider\
    \ the inductor $I \rightarrow O$ – Example 2.11. Via strength from Example E.10\
    \ we can the 2-endofunctor $Para(I \rightarrow O) : Para(Set) \rightarrow Para(Set)$.\
    \ Then a Mealy cell arises as the coalgebra.\n\nMore concretely, a coalgebra consists\
    \ of the carrier set $S$ and a parametric map $(P, cell^{\text{Mealy}}) \\in Para(Set),\
    \ (S, I \rightarrow S)$. Here $cell^{\text{Mealy}}$ can be thought of as a map\
    \ $P \times S \rightarrow I \rightarrow O \times S$, as shown in the figure below.\
    \ We interpret it as a recurrent\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_28_0.png)\n\
    \nFigure 8. An example for $Para((I \rightarrow O))$ 2-endofunctor of an object\
    \ $S$ and a map $f: P \times S \rightarrow I$ which we have taken liberty to unify.\n\
    \nneural network consuming a hidden state $S$, and output $O$ and an updated input\
    \ $O$ and updated hidden state.\n\nThis suggests that neural networks can be thought\
    \ of as Mealy machines, a perspective seldom advocated in the literature.\n\n\
    **Example L5** (Mealy machine). Consider the inductor $O \rightarrow (I \rightarrow\
    \ -)$ from Example H.7. With $\\sigma_{p,X}: P \times O \times (I \rightarrow\
    \ O) \rightarrow Para(O \times (I \rightarrow -))$, we get the 2-endofunctor $Para(O\
    \ \times (I \rightarrow -)) : Para(Set) \rightarrow Para(Set)$. Then a Mealy cell\
    \ arises as its coalgebra.\n\nMore concretely, a coalgebra consists of the carrier\
    \ set $S$ and a parametric map $(P, cell^{\text{More}}) \\in Para(Set), (S, O\
    \ \times (I \rightarrow S))$. Here $cell^{\text{More}}$ can be thought of as a\
    \ map $P \times S \rightarrow O \times (I \rightarrow S)$, as shown in the figure\
    \ below. We break it down into two pieces $cell^{\text{More}}: P \times S \rightarrow\
    \ O$ and $cell^{\text{More}}: P \times S \rightarrow I$.\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_28_1.png)\n\
    \nFigure 9. An example for $Para(O \times (I \rightarrow -))$ as a parametric\
    \ model. Here the output does not depend on the current input.\n\n# Unrolling\
    \ Neural Networks via Transfinite Construction\n\nWe will reap the benefits of\
    \ the transfinite construction of free monads on endofunctors, and the corresponding\
    \ unrolling of these networks. Specifically, with Theorem G.10 heading towards\
    \ the path of having weight arising out of the categorical framework, we can perform\
    \ the unrolling of these networks. For the purposes of space and clarity, the\
    \ unaking is done as length homomorphism of algebras for endofunctors of 2-monads.\n\
    \n**Example J.1** (Iterated Folding RNNs). Consider an algebra $(P, cell^{\text{fold}})$\
    \ of $Para(1+A \times -)$, a folding RNN cell (Example I.1). Its unrolling is\
    \ a $Para(1+A \times -)$ where $\\Delta p: P \rightarrow P \times P$ is the copy\
    \ map.\n\n```\n$$1+A \\times List(A) \\xrightarrow{\\Delta p} 1+A \\times X\\\
    n\\gamma(Nil, Cell) \\Downarrow (P, cell^{\text{fold}})\\nList(A) \\xrightarrow{f_{rent}}\
    \ X\\n\\quad \\quad \\quad (17)$\n```\n\nHere the map $f_{rent}$ is the parametric\
    \ analogue of a *fold* (Example 2.12):"
