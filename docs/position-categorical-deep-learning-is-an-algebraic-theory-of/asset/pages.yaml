- pgno: 8
  md: '# Categorical Deep Learning


    We can describe, if even spaces prevent us from adequate level of detail, the
    universal properties of recurrent, recurrent, and similar models: they are lax
    algebras for free monads generated by parametric functors? Having lifted the concept
    of algebra introduced in Part 2 into 2-categories, we can describe several neural
    networks (not just their individual layers) from first principles of functional
    programming.


    Our framework also offers a proactive path towards equitable AI systems. GDL already
    enables the architectural imputation of protected classes (Choraria et al. (2021)
    for example). This data, at least partially, with issues of inequity in training
    data and algorithms such as an invariant model, by construction, especially capable
    of inference on the dimensions of latent representation are orthogonal to protected
    class.


    With CDL, we hope to enable even finer control. By way of categorical logic, we
    hope that CDL will lead to a deeper understanding of the relationship between
    architecture and logic, in particular clarifying the logics of inductive bias.
    Our framework will eventually allow us to specify the kinds of neural networks
    and constructions we wish, permitting thereby for assessing biases, fairness in
    reasoning by DL models at example. We believe that this is the right path to AI
    clarity and safety, not merely explainable, but verifiable AI.


    # 4. New Horizons


    Our framework gives the correct definition of various architectures of neural
    networks as universal parameters known in computer science. This methodology potentially
    opens up new avenues for research.


    Firstly, any results of categorical deep learning as presented here rely on choosing
    the right category to order; in like manner deep learning relied on the choice
    of group symmetry. We have seen that many algorithms—general equivariance constraints—can
    be parametric, and as a consequence, the kind of constraints we can learn more:
    neural networks that learn not merely correct but verify correct logical argument,
    or order. This has ramifications for code synthesis: we can, for example, specify
    neural networks that learn well-tuned functions by choosing appropriate biases
    as their domain and codomain.


    # Impact Statement


    This paper work goes to fulfill the goal of Machine Learning. There are many potential
    societal consequences of our work, which we feel must be specially highlighted
    here.


    # Acknowledgments


    The authors wish to thank Razvan Pascan and Wee Yee Het for reviewing the paper
    prior to submission.


    # References


    Abdi, M., Agarwal, A., Barham, P., Brevo, E., Chen, Z., Cito, C., Cardoso, G.
    S., Davis, A., Dean, J., et al. TensorFlow: Large-scale machine learning on heterogeneous
    distributed systems. arXiv preprint:1606.00467.


    Abbott, M., Altenlenk, T., and Gani, N. Categories of functions. In Gordon, A.
    D. (ed.), Foundations of Software Science and Computer Science, Lecture Notes
    in Computer Science, pp. 23–38. 2003. ISBN 978-3-5460-3657-6; doi:10.1007/978-3-5460-3657-6_2.


    Alet, F., Dobrar, D., Zhao, A., Tenenberg, J., Kawaguchi, K., and Finn, C. Other
    networks: meta-learning using universal quantifiers. Advances in Neural Information
    Processing Systems, 34:16384–16391.


    Altenlenk, T., Levy, P., and Staton, S. Higher-order containers. In Ferreira,
    F., Löwe, B., Mayordomo, E., and Mendes Gomez, L. (eds.), Programs, Processes,
    volume 6158, pp. 11–20. Springer Berlin Heidelberg, 2010.


    This is possible by our framework''s generality: for example, access to categories
    (Abbott et al., 2003; Altenlenk et al., 2010), a uniform way to progress with
    reason about categories and polymorphic functions. By building functions through
    induction and connective types (Nüker & Vasek, 2023), we open new ways for type-safe
    design and implementation of neural networks in functional languages.


    One major limitation of categorical deep learning is that it was only applicable
    to deal with individual neural networks, owing to focus on linear functions (see
    e.g. Maraton et al. (2018) for the case of graphs). All nonlinear behaviors can
    be obtained through composition of layers with networks, but CDL logic makes no
    attempt to explain the science of the nonlinearity—which is often difficult to
    deconstruct (Shazee, 2020). Within our framework, we can reason about architectural
    blocks building multiple layers—as evidenced by our weighting examples—and we
    believe CDL should be able to have a theory of architectures that properly treats
    nonlinearities.'
