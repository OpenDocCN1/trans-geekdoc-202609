  md: "# I. Parametric 2-endofunctors and their Algebras\n\nJust like before, often\
    \ at our disposal we have a more minimal structure. Instead of requiring a strong\
    \ 2-monad, we can insist merely a strong 2-endofunctor. The data of an 2-endofunctor\
    \ will be the same as the algebra for an endofunctor 2.8.\n\n**Example 1.1 (Folding\
    \ RNN cell),** Consider the endofunctor $1 + A \times -$ from Example 2.9. Via\
    \ strength from Example E.10 we can form the 2-endofunctor $Para(1 + A \times\
    \ -): Para(Set) \\to Para(Set)$. Then a folding recurrent neural network arises\
    \ as its algebra.\n\nMore concretely, an algebra here consists of the carrier\
    \ $S$ (chosen to denote *hidden state*) and a parametric map $(P, \text{cell}^{rst})\
    \ \\in Para(Set)(1 + A \times S) \\cong P + P \times A \times S$ we can break\
    \ into two pieces: the choice of the initial hidden state $\text{cell}^S: P \\\
    to S$ and the recurrent neural network cell $\text{cell}^{rst}: P \times A \t\
    imes S \\to S$, as shown in the figure below. We will see how this construction\
    \ will produce a\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_27_0.png)\n\nFigure\
    \ 5. An algebra for $Para(1 + A \\times -)$ consists of a recurrent neural network\
    \ and an initial hidden state.\n\nrecurrent neural network consumes a sequence\
    \ of inputs and iteratively updates its hidden state.$^{16}$\nfrom Example E.10\
    \ we can form the 2-endofunctor $Para(A+(-)^2)$ on $Para(Set)$. Then a recurrent\
    \ neural network arises as its algebra.\n\nMore concretely, an algebra here consists\
    \ of the carrier $S$ and a parametric map $(P, \\text{cell}^{csv}) \\in Para(Set)(A+S^2)$.\
    \ Via the isomorphism $P \\times (A+S^2) \\cong P + P \times A \times S^2$ we\
    \ can break into two pieces: the choice of the initial hidden state $\text{cell}^S$\
    \ and the recurrent neural network cell $\text{cell}^{csv}: P \\times A \times\
    \ S^2 \\to S$, as shown in the figure below.\n\n![](img/92dd63b8e10fefd3f3f227bf65a30b83_27_1.png)\n\
    \nFigure 6. An algebra for $Para(A+(-)^2)$ consists of a recurrent neural network\
    \ and an initial hidden state.\n\n**Example 1.3 (Folding RNN),** Consider the\
    \ endofunctor $O \\times -$ from Example H.4. Via strength $\\sigma_{P,X}: P \\\
    times (O \\times X) \\to O \\times P \\times X$ we can form the 2-endofunctor\
    \ $Para(O \\times -): Para(Set) \\to Para(Set)$. Then an unfolding recurrent neural\
    \ network arises as its algebra.\n\nMore concretely, a coalgebra consists of the\
    \ carrier $S$, and a parametric map $(P, (\\text{cell}_o, \\text{cell}_s)) \\\
    in Para(Set)(S \\times O)$. Here $\text{cell}_o: P \\times S \\to O$ computes\
