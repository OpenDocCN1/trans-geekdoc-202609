  md: "# Categorical Deep Learning\n\n# C.3. G-equivariant Learning on G\n\nleading\
    \ to G-CNNs (Cohen & Wiley, 2016), as well as the subsequent layers of spherical\
    \ CNNs (Cohen et al., 2018).\n\n```\n$G \\times (G \\rightarrow \\mathbb{R}) \\\
    xrightarrow{G \\times f} G \\times (G \\rightarrow \\mathbb{R})$$\n$$\nAg \\quad\
    \ \\quad \\quad \\quad Ag$$\n$$\nnG \\rightarrow \\mathbb{R} \\xrightarrow{f}\
    \ G \\rightarrow \\mathbb{R}$\n```\n\nIn this case:\n\n+   - The group G is also\
    \ the carrier of the carrier objects (G $\rightarrow$ R).\n\n+   - Both algebras'\
    \ map follows the execution of the regular representation of G, $A_G : G \\times\
    \ (G \\rightarrow \\ R) \\rightarrow (G \\rightarrow \\ R)$, by composition, as\
    \ follows $A_G(g,\\psi)(h) = \\psi(g^{-1}h)$.\n\n# D. Lawvere Theories and Syntax\n\
    \nde Haan et al. (202a) expanded the theory of equivariant layers in neural networks\
    \ using the abstraction of natural transformations of functions. In this section,\
    \ we will explain how to understand morphisms of monads, and in the semantics\
    \ of algebras in these terms.\n\nDefinition 1.1. If C is a category, a presheaf\
    \ on C is a functor $C^{op} \\rightarrow Set$. The category whose objects are\
    \ presheaves and morphisms are natural transformations is denoted P(C).\n\nFix\
    \ a monad T on Set and $C_T$ denote its category of algebras and homomorphisms.\n\
    \nGiven an algebra $A \\in C_T$, the way to interpret A as a functor is via the\
    \ Yoneda embedding $C_T \\rightarrow P(C_T)$, which identifies A with the presheaf\
    \ $[-, A]$. It is a standard result that the Yoneda functor is faithful, which\
    \ means that we can identify algebras with morphisms as presheaves by the definition\
    \ of limits and colimits.\n\nFurthermore, these presheaves have a special property.\
    \ If $\\lim j$ is a small colimit in C, then $[\\lim j, A] = [\\lim j, A]$, essentially\
    \ to + to the class of all, and 0 to the reader of empty\n\nDefinition D.2. If\
    \ C is a category and J is a class of small colimits in C, then a J-continuous\
    \ presheaf on C is a presheaf $F \\in P(C)$ such that $F(\\\\lim j) = \\lim F(j)$\
    \ for all $j \\in J$. The corresponding full subcategory of PSh(C) is denoted\
    \ PSh(C), or simply PSh(C) in the case that J is the class of all small colimits.\
    \ We will use $[\\ ]$ to refer to the class of all colroducts, and 0 to the reader\
    \ of empty\n\nIt turns out that C has a nice property: it is strongly compact,\
    \ meaning that every continuous presheaf is representable as above by an object\
    \ of $C$. In other words, we have the identification $C = PSh(C).\n\nHowever,\
    \ it is impractical to work with the entire category C. When possible, we want\
    \ to reason in terms of a more tractable vocabulary. This will provide us with\
    \ syntax for monads. Following Ehrenmann's concept of a \"column sketch\" (Brandenenburg,\
    \ 2021), a category equipped with a restricted set of classes. Rather than giving\
    \ the general definition, we will describe few special cases of interest here.\n\
    \nDefinition D.3. The Kleisli category $K_T$ is the full subcategory of $C_T$\
    \ on the free algebras. The finitary Kleisli category $K_T^F$ is the free algebras\
    \ TS for a finite set. The unary Kleisli category $K_T^U$ is the full one-object\
    \ subcategory on the free algebras T1.\n\nWith the following sequences, we will\
    \ include a sequence of functors between presheaves:\n\n```\n$C_T \\supset K_T\
    \ \\supset K_T^F \\supset K_T^U$\n```"
