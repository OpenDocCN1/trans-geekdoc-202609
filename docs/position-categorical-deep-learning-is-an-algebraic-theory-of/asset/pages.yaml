- pgno: 15
  md: '# Categorical Deep Learning


    # C.1. Permutation-equivariant Learning on Graphs


    leading to graph neural networks (Veličković, 2023).


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_15_0.png)


    In this case:


    +   - The group $G = \Sigma_n$ is the permutation group of $n$ elements,


    +   - The carrier object for the algebras (scalar) node features $R^n$, and potentially,
    adjacency matrices $R^{n \times n}$,


    +   - The structure map for the first algebra, $P_{X,A} : \Sigma_n \times R^n
    \times R^{n \times n} \rightarrow R^{n \times n}$, executes the permutation: $P_{X,A}(\sigma,
    X, A) = (P(\sigma)X, P(\sigma)AP(\sigma)^T)$, where $P(\sigma)$ is the permutation
    matrix specified by $\sigma$.


    +   - The structure map for the second algebra, $P_X$, still executes the permutation,
    but only the node features. The reduction is not strictly necessary, but it is
    the standard when designing graph neural networks—as they are often assumed not
    to modify their underlying computational graph. We deliberately omit this reduction
    here to illustrate how our framework can handle neural networks transitioning
    across different algebras.


    # C.2. Rotation-equivariant Learning on Spheres


    leading to the first layer of spherical CNNs (Cohen et al., 2018).


    ![](img/92dd63b8e10fefd3f3f227bf65a30b83_15_1.png)


    In this case:


    +   - The group $G = SO(3)$ is the special orthogonal group of 3D rotations.


    +   - The carrier object for the first algebra is $S^2 \rightarrow R$; (scalar)
    data defined over the sphere. Note that in practice, this will be desirable, so
    be written to represent it using matrices.


    +   - The structure map for the first algebra, $p_{SO(3)} : SO(3) \times (S^2
    \rightarrow R) \rightarrow (S^2 \rightarrow R)$, executes a 3D rotation on the
    spherical data, as follows: $p_{SO(3)}(\alpha, \beta, \gamma), \psi) = \phi$,
    such that $\phi(x) = R(\alpha, \beta, \gamma)x$, where $R(\alpha, \beta, \gamma)$
    is the rotation matrix specified by the ZYZ-Euler angles, (this inverse) rotation
    is applied to points $x \in S^2$ on the sphere.


    +   - The carrier object for the second algebra is $SO(3) \rightarrow R$; (scalar)
    data defined over rotations. Once again, this will be quite desirable in practice.


    +   - The structure map for the second algebra, $p_{SO(3)} : SO(3) \times (SO(3)
    \rightarrow R) \rightarrow (SO(3) \rightarrow R)$ now executes a 3D rotation over
    the rotation-matrix data, as follows: $p_{SO(3)}(\alpha'', \beta'', \gamma''),
    \psi) = \phi$ such that $\phi(x) = R(\alpha'', \beta'', \gamma'')^{-1}R(\alpha,
    \beta, \gamma)x$.'
