  md: "# Categorical Deep Learning\n\n$Psh(C_T) \rightarrow Psh(K_T) \rightarrow Psh(K_T^\\\
    infty) \rightarrow Psh(K_T^\\perp)$\n\nBy restricting our classes of objects,\
    \ we can restrict this to the continuous presheaf categories:\n\n$C_T \\simeq\
    \ CPsh(C_T) \rightarrow CPsh_{11}(K_T) \rightarrow CPsh_1(K_T^\\infty) \rightarrow\
    \ CPsh_0(K_T^\\perp)$\n\nIt turns out that in many cases, there are equivalences\
    \ of categories.\n\n**D.4.** In the case that $C_T \rightarrow CPsh(K_T)$ is an\
    \ equivalence, we say that $K_T^\\infty$ is the *infinitary Lawvere theory for\
    \ T*. **Remark D.5.** In fact, all monads have an infinitary Lawvere theory. For\
    \ a proof, seeBrandenburg, 2021).\n\n**D.6.** In the case that $C_T \rightarrow\
    \ CPsh_+(K_T)$ is an equivalence, we say that $(K_T)^\\infty$ is the **Lawvere\
    \ theory for T**, and $T$ is a finitary monad.\n\n**D.7.** If $T$ is the monad\
    \ sending $S$ to the free commutative semiring on $S$, then $C_T$ is the category\
    \ of commutative semirings. We see as for commutative systems of equations with\
    \ finite number of variables, $T$ has a Lawvere theory $(K_T)^\\infty$.\n\nIt\
    \ is well known that for the \"finitary monads\", e.g. (Gambino & Kock, 2013).\
    \ This connection was observed in (Dulšek & Veličkový) for message passing in\
    \ Graph Neural Networks to polynomial functions.\n\nif we could further restrict\
    \ this to the four objects $[T_0, T_1, T_2, T_3]$, because we can easily axiomise\
    \ commutative systems with only three variables, $a(b+c) = ab+ac$.\n\n**D.8**\
    \ (Monoids). If $M$ is a monad, $C \rightarrow CPsh(K_M)$ is an equivalence, then\
    \ $C \\simeq Psh(K_M)$, which is the category of $M$-sets for the monad $M = (K_M)^\\\
    infty$. We can use \"infinitary Lawvere theories\" exactly to describe objects\
    \ of form $M \\times -$,\n\n**D.9** (Suplattices). Not all monads are finitary;\
    \ that not all have an associated Lawvere theory.\n\nFor a non-finitary monad,\
    \ let $P: \text{Set} \rightarrow \text{Set}$ be the covariant powerset function.\
    \ That is, $P(S)$ is the set of subsets of $S$, and if $f$ is a function, $P(f):\
    \ P(S) \rightarrow P(S)$ is defined as $P(f)(a) := \\{f(a) \\mid a \\in A\\}$.\
    \ We equip $P$ with the monad structure given by the unit $1 \rightarrow P$ and\
    \ composition $P^2 \rightarrow P$ sending $s \\in S$ to $P(S)$ and the composition\
    \ $C(S)$ to $\bigcup_{a \\in A} A$.\n\nThe category of $P$-algebras is the category\
    \ of suplattices, which is the category of sets with all least upper bounds, and\
    \ morphisms preserving them. Equivalently, a toplattice is given by a set $L$\
    \ with a join map $P(L) \rightarrow L$ satisfying unit and associativity axioms.\n\
    \nImplementing vertices requires $L^\\kappa \rightarrow L$ for arbitrarily large\
    \ cardinal numbers $\\kappa$, so we can intuitively see that suplattices are not\
    \ described by a finitary theory.\n\nNote that the Kleisli category $K_P$ is the\
    \ category of sets and relations.\n\n**Example D.10** (Semilattices). While $P$\
    \ is not finitary, it has a functor $P_{fin}$, the functor that takes each set\
    \ to its finite subsets.\n\nAlgebras for $P_{fin}$ are some joined-semilattices,\
    \ partial orders where every finite subset has a least upper bound. It is nice\
    \ exercise to show that a semilattice is equivalently a commutative idempotent\
    \ mon.\n\n# E. Monoidal Categories and Ategories\n\nMonoidal categories and are\
    \ the 'categorified' version of monads and actions.\n\n**Definition E.1** (Strict\
    \ monoidal, Johnson et al., Def. 1.2.1). Let $M$ be a category. We call $M$ a\
    \ *strict monoidal category* if it is given with the following data $\\otimes:\
    \ M \times M \rightarrow M$ the *monoidal product*; an object $I \\in M$ the *monoidal\
    \ unit*, such\n\n+   - $A \\otimes (B \\otimes C) = (A \\otimes B) \\otimes C$\
    \ for all $A, B, C \\in M$\n-* $A \\otimes I = A = I \\otimes A$ for all $A \\\
    in M$\n\n18"
