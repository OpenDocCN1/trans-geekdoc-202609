    # 4.3.6 Spoiler Design


    A spoiler as shown in Figure 4.6, structure is used to reduce the airflow falling
    on the panels that are placed on top of the nacelle. Its structure is composed
    in the nacelle to reduce the weight falling on the nacelle. This structure is
    mainly used to support the aerodynamics.


    Figure 4.7 shows the placing of a solar panel inside the spoiler structure that
    is placed on top of the nacelle. When there is sufficient wind flowing to rotate
    the rotor, solar power is stored and directly given to the grid via inverter.
    When there is no wind flowing, the solar power is given to the DC motor [14].
    The DC motor is placed in the gearing system and rotates the rotor of the wind
    turbine. Li-ion batteries power the DC motor at night and when solar energy is
    not dominant. The revolving motor of the yaw system is also powered by solar power
    and rotates according to the direction of the wind. By this technique, the power
    generation of wind energy will be increased and the overall efficiency of the
    system will increase [15].'
