  md: '# # Prediction of CKD Stage 1 Using Three Different Classifiers


    Thamizharasan, K.*, Yamini, P., Shimola, A. and Sudha, S.


    Department of Biomedical Engineering, Rajalakshmi Engineering College, Chennai,
    India


    # ## Abstract


    Chronic Kidney Disease shows slow and periodical loss of kidney function over
    a period of time and will develop into permanent kidney failure when left untreated.
    The proposed work aims at presenting the use of Deep Learning for the prediction
    of Chronic Kidney Disease. Training has been performed using 16 attributes of
    about 400 patients. Three Deep Learning techniques (Random Forest, Support Vector
    Machine, and Naive Bayes Classifier) are helpful in predicting the stages. A comparative
    analysis of these three classifiers is performed. The results show that a Random
    Forest Classifier has a higher accuracy rate of about 96.25% and an error rate
    of 0.03. Prediction of stage 1 is usually challenging, but a Random Forest Classifier
    has helped in predicting stage 1 of the disease with an accuracy of 75%, making
    it the most effective classifier. This classification would be helpful for prior
    forecasting of the disease and avoids future health implications for the patient.
    It would therefore play a major role in reducing the mortality rate of patients.


    **Keywords**: Chronic kidney disease, deep learning, support vector machine, random
    forest, naive bayes classifier


    # ## 6.1 Introduction


    Chronic Kidney Disease (CKD) is a condition marked by a gradual loss of kidney
    function over a period. CKD was declared as the 9th leading cause of death by
    the National Kidney Foundation in 2019 [1]. The rise in population and unhealthy
    habitual behavior resulted in the development of Kidney'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Diseases. Especially in developing countries, the expected shoot up in the
    number of Kidney Disease cases is predicted to have a profound effect on socio-economic
    conditions. Kidney Disease is considered a medical challenge in the 21st century.
    Even though there are a large number of pandemic kidney problems, CKD is widely
    accepted as the rising menace of this epoch. Being a longstanding disease of the
    century, CKD is classified into five stages based on the patient''s Glomerular
    Filtration Rate (GFR) and Serum Creatinine levels. Of these the most minacious
    is the fifth stage of CKD where the patient reaches a GFR value less than 15 ml/min
    per 1.73 m² [2].


    Recent landmark studies claim that the fifth stage of CKD eventually ends up in
    End-Stage Renal Disease leading to ultimate renal dysfunction. Early detection
    of the CKD stages is the only way to hold the fort unless the condition is inexorable.
    Though a lot of researchers worked their way through to predict the stages of
    CKD, prediction of the first stage of CKD is still unforeseeable. Since the GFR
    value associated with the first stage of this chronic disease is 90 ml/min per
    1.73 m² that is close to the normal value of GFR in a healthy person, the prediction
    of this stage has been a formidable challenge [3].


    Numerous analysts and researchers are working monotonously for a long time to
    predict CKD stages. Deep Learning algorithms have been used to predict the presence
    of CKD in patients. In this work, they used six different Deep Learning algorithms:
    Naive Bayes, Sequential Minimal Optimization (SMO), Simple Logistic (SLG), Radial
    Basis-Function (RBF), Multilayer Perceptron Classifier (MLPC), and Random Forest
    (RF) Classifiers. The results acquired show that the RF Classifier beats different
    classifiers in terms of area under the ROC curve (AUC), precision, and MCC with
    a value of 1.0.


    The other approach used in the other studies proposed is a versatile neuro-fuzzy
    derivation framework (ANFIS) used to predict the probability of renal failure
    due to CKD. The GFR values were predicted by a Takagi-Sugeno type ANFIS model.
    The model precisely predicted the GFR with an accuracy of 95%, but there were
    fluctuations in the result when the key attributes are updated [4].


    A classification model was developed using a Deep Learning algorithm and the primary
    aim of this study is to predict whether the patient is at the risk of CKD or not.
