    of a surveyed area, but it needs a more efficient computational cost method to

    be employed to detect motion. Most feature-based techniques lead to signifi-

    cant redundancy, having large frame intervals for feature correspondence and a

    scarcity of corresponding feature points. To overcome the issues of features,
    the

    Mosaic Background Model using the SURF feature of Deep Learning is proposed.

    Mosaicing is a method of assembling multiple overlapping images of the same

    scene into a larger wide image of a scene which overcomes the above issues. In

    real-time monitoring, a major problem is that the field of vision is completely
    too

    small to capture the target and a larger field of vision with low resolution.
    Ability

    to handle all the above issues, which includes management of quantity and quality

    feature extraction, is proposed. In this paper, Speeded Up Robust Features (SURF)

    are used to construct a Mosaiced Background Model for robust segmentation

    through Deep Learning. The proposed algorithm is able to detect and represent

    foreground objects and can also efficiently deal with large zoom effect, com-

    pared to Scale-Invariant Feature Transform (SIFT) based mosaiced foreground

    segmentation.


    Keywords: PTZ, mosaicing, SURF, video surveillance, feature extraction'
