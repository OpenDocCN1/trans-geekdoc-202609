  md: '# Emotional Classification Using EEG Signals and Facial Expression: A Survey


    S J Savitha*, Dr. M Paulraj and K Saranya


    Department of Computer Science and Engineering, Sri Ramakrishna Institute of Technology,
    Coimbatore, India


    # Abstract


    Electroencephalogram (EEG) and facial expression based emotion classification
    is a relatively new field in the affective computing area with challenging issues
    regarding the consecration of emotional states and extraction of features in order
    to attain optimum classification performance. Automatic emotion detection using
    facial expression recognition is now a main area of various fields such as computer
    science, medicine, and psychology. Various feature extraction techniques have
    been developed for classification of expressions from EEG signals from brain and
    facial expressions from static images, as well as real real time videos. Deep
    learning plays an important role for this kind of task. This chapter provides
    a review of research work carried out in the field of facial expression recognition
    and EEG signal classification.


    Keywords: Electroencephalogram (EEG), brain computer interface (BCI), emotion
    recognition, feature optimization, evolutionary algorithm


    # 3.1 Introduction


    The possibility of establishing a direct communication and control channel between
    the human brain and computers or robots has been a topic of scientific speculation
    and even science fiction for many years. Over the past twenty years, this idea
    has been brought to fruition by numerous research'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'and development programs and has evolved into one of the fastest-growing areas
    of scientific research. This technology, called brain-computer interface (BCI)
    technology, provides a new output channel for brain signals to communicate or
    control external devices without using the normal output pathways of peripheral
    nerves and muscles. EEG has been extensively employed for BCI applications due
    to its non-invasiveness, ease of implementation, and cost-efficiency. Recently,
    dry-electrodes and wireless EEG systems have also been studied in various experimental
    settings which has further expanded the scope of EEG based BCI systems. Deep learning
    methods provide many ways to accomplish this kind of task. As frequency analysis
    of EEG is a major concern, many approaches, such as the band pass filter bank,
    autoregressive (AR) model, Fourier transform, and Wavelet transform, have been
    employed. However, all these methods have certain limitations. The frequency resolution
    of a band-pass filter is constrained by the order of the filter. The AR model
    in deep learning coefficients only provide limited frequency information as the
    envelope of the spectrum reconstructed from AR coefficients is limited by the
    order of AR model. The discrete wavelet transform is considered a band-pass filter
    bank with orthogonal basis that has better frequency and temporal resolution.
    However, the obtained wavelet coefficients are redundant in general. Further,
    post-processing is required to stabilize the performance of the classifier. The
    EEG signal considered for BCI is generally band-limited. To enhance classification
    performance, more data from EEG channels is often required for more complex problems.
    The increase in the number of EEG channels poses two challenges. First, as the
    number of channels increases, direct identification of the subject-dependent reactive
    band becomes infeasible and an automated identification process is required. Secondly,
    as the feature vector includes all frequency estimates from all the channels,
    the dimension increases drastically. Deep Learning provides high dimensionality
    in feature vectors that will affect the performance of the classifier [1].


    A BCI allows a person to communicate with or control the external world without
    using conventional neuromuscular pathways. That is, messages and control commands
    are delivered not by muscular contractions, but rather by brain signals themselves.
    This BCI feature brings hope to individuals who are suffering from the most severe
    motor disabilities, including people with amyotrophic lateral sclerosis (ALS),
    spinal cord injury, stroke, and other serious neuromuscular diseases or injuries.
    BCI technology holds promise to be particularly helpful to people who are “locked-in”
    cognitively but without useful muscle function. Restoration of basic communication
    capabilities for these people would'
  merge: -1
  img_proc: true
