    set of features that have been generally agreed upon as the most suitable for
    emotion recognition. This leads to what is known as a high-dimensionality issue
    in EEG, as not all of these features carry significant information regarding emotions.
    Irrelevant and redundant features increase the feature space, making pattern detection
    more difficult and increasing the risk of over fitting. It is therefore important
    to identify salient features that have significant impact on the performance of
    each emotion [3].


