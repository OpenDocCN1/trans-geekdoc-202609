- pgno: 85
  md: '# ## 5.1 Introduction


    Video surveillance is a very active computer vision research area and

    the main tasks of a video surveillance system include motion detection,

    object classification, tracking, understanding of activity, and behavior

    analysis [1]. Panoramic representations of visual scenes have a wide

    application scope, including virtual reality (VR), interactive 2D/3D

    video, tele-conferencing, content-based video compression and manip-

    ulation, and full-view video surveillance. A wide Field of View (FOV)

    lens (e.g., a fisheye) can be a solution for obtaining panoramic views.

    However, in addition to the high cost of these specially designed image

    sensors, images obtained by such sensors have substantial distortions and

    mapping an entire scene into the limited sensor target of a standard video

    camera has low resolution. Constructing a panoramic representation

    by mosaicing image sequences captured by PTZ (Pan, Tilt, and Zoom)

    cameras meets the requirements of the aforementioned applications for

    high image resolution. Recently, sensor technology developments have

    led to an increasing distribution of a specific type of moving camera like

    pan-tilt-zoom (PTZ) cameras that can dynamically modify the field of

    view through the use of panning, tilting, and zooming (i.e., moving left

    and right, up and down, and closer and farther away). However, very few

    of the current algorithms and systems are able to properly detect and

    represent foreground objects and to efficiently deal with a large zoom

    effect. Still, this problem exists, which is very important to analyzing

    video further. We have various Deep Learning approaches that can do the

    analysis and find the appropriate and desired result for us. This motivates

    our work described in this paper.


    The organization of the paper is given below. The next section describes

    related works. Section 5.3 explains the overall methodology. Section 5.4

    presents the results and discussion, conclusion, and future work.


    # ## 5.2 Related Work


    Many researchers have attempted to extend stationary background mod-

    eling methods for PTZ camera-based application. The method presented

    uses the information of the overlapped region between consecutive frames

    to generate a background. The limitation of this frame-to-frame method is

    that it can accumulate errors over a long sequence and cannot zoom in to

    get a high quality view of the target. Some other methods use a panorama or

    a panoramic pyramid for background subtraction. However, this method'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'cannot provide a robust background for foreground detection because the panoramas
    contain moving objects which cause false detection [2].


    The timely replacement algorithm based on the central region of the background
    and the control strategy of camera rotation could achieve target detection and
    tracking under a dynamic background. The target which has to be tracked was in
    the field of view which was set before. Currently, this method can only achieve
    the detection and tracking of a single target, which is the main disadvantage
    of this paper. The multi-layered correspondence propagation method registers observed
    frames in the panoramic background and obtains the correspondence background,
    even when the zoom value (scale) of the PTZ camera changes a lot. Using the correspondence
    background, foreground objects are detected. Background registration methods are
    based on phase correlation, block matching, background motion compensation, and
    so on. Although these algorithms are able to achieve the target detection and
    tracking of dynamic surroundings, the background matching algorithm is more complex
    due to the tracking of larger amounts of calculation and lower speeds in real-time
    processing [3].


    Existing feature-based methods often filter the sequence images to extract feature
    points and try to find matches between a set of points. Subsequently, the tomography
    of the images will be obtained. The mosaic’s performance depends on the corresponding
    correction very deeply [4]. In order to increase the corresponding correction
    rate, the feature points are tracked frame-to-frame. On the other hand, video
    frames are typically 30 frames per second and long sequences contain significant
    redundancy. Therefore, to meet the real time constraint for the whole system,
    as a first step, some measures to identify key frames, which includes enough effective
    information for later mosaicking, is needed. In order to overcome the problems
    existing in traditional methods, a Background Mosaicing Model for wide area surveillance
    using SURF features is proposed. The objective of this paper is to propose an
    effective background model for a PTZ camera-based surveillance system which constructs
    mosaic and is able to properly detect and represent foreground objects even though
    areas with large zoom. The proposed method works well in workplaces such as Healthcare
    and monitoring in public places.


    # 5.3 Methodology


    The main aim of this paper is to propose an effective background model for a PTZ
    camera-based surveillance system that performs feature extraction followed by
    mosaic construction and foreground segmentation. Figure 5.1 shows an overview
    of the methodology.'
