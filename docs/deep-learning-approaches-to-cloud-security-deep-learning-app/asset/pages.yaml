  md: '# WORKING OF FACIAL RECOGNITION TECHNIQUE:


    Facial recognition technology identifies up to 80 factors on a human face to identify
    unique features. These factors are endpoints that can measure variables of a person’s
    face, such as the length or width of the nose, the distance between the eyes,
    the depth of the eye sockets and the shape and size of the mouth. In order to
    measure such detailed factors, complexities such as aging faces arise. To solve
    this, computers have learned to look closely at the features that remain relatively
    unchanged no matter how old we get. The framework works by capturing information
    for nodal points on a computerized picture of a person’s face and storing the
    subsequent information as a face print [7]. Face print is like a fingerprint but
    for your face. It accurately identifies the minute differences even in identical
    twins. It creates 3D models of your face and analyses data from different angles,
    overcoming many complexities associated with facial recognition technology. The
    face print is then utilized as a reason for correlation with information captured
    from faces in a picture or video.


    # 1.2.4 Voice Recognition


    Voice Recognition is a mechanized technique for recognizing or affirming the identity
    of an individual on the basis of voice. Voice Biometrics make a voiceprint for
    every individual, which is a numerical representation of the vocal tract of a
    speaker [8]. This is to ensure correct identification regardless of the language
    spoken, contents of speech, and wellbeing of an individual.


    # WORKINGS OF VOICE RECOGNITION:


    +   1. Create a voice print or “template” of a person’s speech.

    +   2. Only when a user opts in or enlists himself, a template is created, encrypted,
    and stored for future voice verification.

    +   3. Ordinarily, the enlistment process is passive, which means a template can
    be created in the background during a client’s ordinary cooperation with an application
    or operator.


    The utilization of voice biometrics for identification is expanding in fame because
    of enhancements in precision, energized to a great extent by evolution of AI,
    and heightened customer expectations for easy and fast access to information [9].'
