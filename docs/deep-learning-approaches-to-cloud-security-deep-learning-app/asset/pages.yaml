- pgno: 87
  md: '![](img/146f9a713528a3fbc62fcad0f0d5a352_87_0.png)


    # Figure 5.1 Proposed methodology.


    Input video is converted into a sequence of frames. Subsequently, the features
    are extracted using SURF (Speeded Up Robust Features). The first frame is taken
    as a reference frame and the feature points are compared to the points in the
    immediate next frame. If the feature points of both frames match, it will be compared
    to the next successive frame. Tracking these N feature points frame-to-frame is
    continued up until a mismatch occurs [5]. Then, the current frame will be taken
    as the key frame. Frames taken from reference frame to key frame will be mosaiced
    to a single frame (updated reference frame) which contains all the essential information
    about all the in-between frames optional key frames. Consequently, the key frame
    is updated as the new reference image and N feature points are selected on it
    [6]. Finally, the Background Mosaic Construction Model is fed for foreground segmentation.
    The details on methodology are given below.


    # 5.3.1 Feature Extraction


    Deep Learning has a vast repository of algorithms and techniques that can help
    us for feature extraction. PTZ camera-based video is taken for motion segmentation.
    Video formats, like .avi files, are converted as frames [7]. These frames are
    provided to the Deep Learning algorithm as an input, then all the converted frames
    as input data are used for feature extraction. All the converted frames are given
    for SURF feature Extraction. SURF (Speeded-Up Robust Features) features are based
    on a detector-descriptor scheme. The detector is based on the Hessian Matrix and
    uses a very basic approximation just as DoG, which is a Laplacian-based detector.
    A ''Fast-Hessian'' detector'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'relies on integral images to reduce computation time. The descriptor also describes
    a distribution of Haar-wavelet responses within the interest point neighborhood
    [8]. Again, exploit integral images for speed. Moreover, only 64 dimensions are
    used, reducing the time for feature computation and increasing the robustness
    simultaneously. A new indexing step, based on the sign of the Laplacian, increases
    the strength of the descriptor. The concept of integral images allows faster implementation
    of box type convolution filters [9]. The entry of an integral frame (I\(_\Sigma\)
    (x)) at a specific location (x = (x, y)) represents the sum of all pixels in the
    input image (I) of a rectangular region created by the point (x) and the origin
    shown in Equation (5.1),


    ```

    I\(_\Sigma\)(X) = \(\sum_{i=0}^{i \le x} \sum_{j=0}^{j=y} I(i, j)\) (5.1)

    ```


    With I\(_\Sigma\) calculated, it only takes four additions to determine the sum
    of the intensities over any upright, rectangular area, independent of its size.
    The extracted features are used to construct a Mosaiced Background Model [10].


    # 5.3.2 Background Deep Learning Model Based on Mosaic


    Mosaicing consists of four steps:


    +   1. First, detect N feature points on the initial frame of the video and set
    this frame as the reference frame

    +   2. Then, track these N feature points using SURF algorithm frame-to-frame
    until condition 1 is broken and set the current frame as a key frame for mosaicing

    +   3. Next, the reference image, the key image, and their corresponding feature
    points will be sent to the quality feature points management module to obtain
    the most accurate mosaic according to the condition 2 [11]

    +   4. Lastly, update the key frame as the new reference frame and reselect N
    feature points on it


    The objective of this paper is to propose a Mosaic Based Background Model for
    quantity management for robust feature points. Here, the speed and performance
    of the surveillance system will be increased [12].


    +   1. Extract N feature points on the initial frame (F1) of the video.'
