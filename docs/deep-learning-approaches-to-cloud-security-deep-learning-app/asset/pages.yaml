    # ## 3.4 BCI Applications


    Individuals who are severely disabled by disorders such as ALS, cerebral palsy,
    brainstem stroke, spinal cord injuries, muscular dystrophies, or chronic peripheral
    neuropathies might benefit from BCIs. To help determine the value of BCIs for
    different individuals, potential BCI users are categorized by the extent, rather
    than the etiology, of their disability. Evaluated in this way, potential BCI users
    fall into three reasonably distinct groups: (1) people who have no detectable
    remaining useful neuromuscular control and are totally locked-in; (2) people who
    retain only a very limited capacity for neuromuscular control such as weak eye-movements
    or a slight muscle twitch; and (3) people who still retain substantial neuro-muscular
    control and can readily use conventional muscle-based assistive communication
    technology [14].'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'It is not yet clear to what extent BCIs can serve people in the first group,
    those who are totally locked-in (e.g., by late-stage ALS or severe cerebral palsy).
    Resolution of this issue requires extensive and prolonged evaluation of each individual
    in order to resolve basic issues of alertness, attention, visual or auditory capacities,
    and higher cortical function. While it has been hypothesized that the totally
    locked-in state constitutes a unique BCI-resistant condition, the issue remains
    unresolved at present. It is worth mentioning that researchers have speculated
    that individuals in this group might be able to retain the capacity for BCI use
    if they begin it before becoming totally locked-in.


    At present, people in the second group constitute the primary prospective user
    population for current BCI systems. This group, which outnumbers the first group,
    includes people with late-stage ALS, patients who rely on artificial ventilation
    as their disease progresses, people with brainstem strokes, and people with severe
    cerebral palsy. Typically, they retain only very limited, easily fatigued, and/or
    unreliable eye movements or other minimal muscle function and, thus, cannot be
    adequately served by conventional muscle-based assistive communication technology.
    For people in this group, BCI systems may be able to provide basic communication
    and control that is more convenient and reliable than that provided by conventional
    technology in the Deep Learning domain [15].


    The third and largest group of potential BCI users consists of people who retain
    substantial neuromuscular control [16]. For most in this group, present-day BCI
    systems, with their limited capacities, have little to offer. These individuals
    are usually much better served by conventional technology. Nevertheless, some
    in this group, such as those with high-cervical spinal cord injuries, may prefer
    a BCI over conventional assistive devices that coopt their remaining voluntary
    muscle control (e.g., systems that depend on gaze direction or EMG from facial
    muscles). In the future, as the capacities, reliability, and convenience of BCI
    systems continue to improve, more people in this group could find them of value
    and the number of people using BCIs could substantially increase [17].


    The different conditions mentioned above impair the CNS in different ways and
    different BCIs depend on different aspects of brain activity. Thus, some people
    may be better served by one BCI than by another. For example, people who have
    sensorimotor cortex impairment due to severe cerebral palsy may not be able to
    use BCIs based on EEG or single-neuron activity from these cortical areas. In
    such people, BCI systems that use other EEG components or neuronal activity from
    other brain regions might be good alternatives [18].'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3.4.1 Possible BCI Uses


    It is important to distinguish between a BCI and its applications. The term BCI
    refers to the system of deep learning that records, analyses, and translates the
    input (i.e., the user’s brain signals) into device commands. In contrast, the
    term application refers to the specific purposes or devices to which the output
    commands are applied. Recent focus on the real-world applications of BCI technology
    is speeding the transition of BCI research from the laboratory to clinical products
    useful in everyday life. Although BCI applications could conceivably be clinical
    or non-clinical (e.g., computer games), this review discusses clinical applications
    only [19].


    The potential clinical uses of BCIs can be classified as: (1) direct control of
    assistive technologies; and (2) neurorehabilitation. Since the BCI serves as a
    replacement of normal neuromuscular pathways, the most obvious BCI applications
    are those that activate and control assistive technologies that are already in
    place to enable communication and control of the environment. These applications
    of BCIs to assistive technology encompass the areas of communication, movement
    control, environmental control, and locomotion. The possible uses of BCIs in neurorehabilitation
    have just begun to be explored.


    # 3.4.2 Communication


    Communication for people who are “locked in” probably represents the most pressing
    area in need of intervention with BCI technology. Although other applications
    are under development, restoring communication has been the main focus of the
    BCI research community.


    Distinguished from one another by the specific electrophysiological features measured,
    three types of EEG-based BCI systems have been tested in human subjects for the
    purpose of communication, specifically those based on: 1) slow cortical potentials
    (SCPs); 2) P300 event-related potentials; and 3) sensorimotor rhythms (SMRs).
    Both the SCP BCI and the SMR BCI require significant training of the users to
    gain sufficient control of their brain activity to produce signals that can be
    effectively applied to BCI use. In contrast, a P300 BCI measures the brain’s response
    to stimuli (visual or auditory) of special significance and requires minimal user
    training [20].


    # 3.4.3 Movement Control


    Restoration of motor control in paralyzed patients is another key application
    of BCI and is the main goal of many researchers in the field. The research in'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'this clinical application is sparse and has used mainly SMR-based systems.
    Wolpaw and his colleagues have demonstrated one-dimensional, two-dimensional,
    and even three-dimensional cursor controls using an SMR system and have done preliminary
    experiments with SMR control of a robotic arm [21]. These experiments indicate
    that SMR BCI systems might be able to support multidimensional control of the
    movement of motor neuroprosthesis or an orthotic device such as a robotic arm.
    Pfurtscheller and colleagues tested an SMR-based BCI for restoration of motor
    control in paralyzed patients (for review see A *tetraplegic patient was trained
    to control an electrically driven hand orthosis with EEG signals recorded over
    sensorimotor cortex* [22]). By learning to generate separable motor imagery tasks,
    this patient was able to open and close his paralyzed hand with the hand orthosis.


    Functional Electrical Stimulation (FES) can also be used for restoration of motor
    function in paralyzed patients with intact lower motor neuron and peripheral nerve
    function. With the goal of further enhancing motor restoration in paralyzed patients,
    Pfurtscheller and his colleagues combined the SMR BCI with FES systems and tested
    the combined system in two patients with high spinal cord injury.


    # 3.4.4 Environment Control


    BCI-based environmental control could greatly improve the quality of life of severely
    disabled people. People with severe motor disabilities are often home-bound. Effective
    means for controlling their environments (e.g., controlling room temperature,
    light, power beds, TV, etc.) would increase their well-being and sense of independence.
    A recent pilot study by Cincotti et al. attempted to integrate BCI technology
    into a domestic environmental control system. With unified control through EEG-based
    BCI technology, the user is able to operate remotely domestic devices such as
    neon lights and bulbs, TV and stereo sets, a motorized bed, an acoustic alarm,
    a front door opener, and a telephone, as well as to monitor the surrounding environment
    through wireless cameras [23]. The clinical validation of the system prototype
    took place in a simulated home environment in an occupational therapy department.
    Fourteen healthy normal subjects and four subjects suffering from spinal muscular
    atrophy type II (SMA II) or Duchenne Muscular Dystrophy (DMD) were tested. The
    patients were able to control the system with an average accuracy of 60-75% over
    the last three testing session (8-12 sessions in total). Preliminary findings
    from this study suggested that the self-control of the domestic environment realized
    with BCI technology increased the'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'patient’s sense of independence. Also, caregivers could be relieved to some
    extent from the need to be continually present [24].


    # 3.4.5 Locomotion


    Restoration of independent locomotion is another important issue for paralyzed
    people. In light of this, several BCI research groups have attempted to develop
    BCI-driven wheelchairs in order to restore some form of mobility. Tanaka et al.
    developed an electric wheelchair controlled by EEG. Directional commands were
    detected by EEG and were then applied to direct control of the wheelchair. Such
    precise control may be quite demanding on the user [25]. Rebsamen et al. reported
    a wheelchair controlled by a P300-BCI system in which the user simply selects
    a destination from a menu of destinations. While this approach is less demanding
    for the user, the capacity for real-time directional control of the wheelchair
    is limited by the selections and prior definition of possible paths is needed.
    Millán and his group studied a BCI-controlled wheelchair that is based on the
    EEG activity associated with various mental tasks and a shared control system.
    It employed intelligent algorithms to assist the user in obtaining continuous
    command of the system during wheelchair navigation. Further work is required to
    confirm the usability of a BCI-driven wheelchair in the real-world environment.
    For this application, due to considerations of safety, there must be stricter
    requirements for accuracy than for many other BCI applications.


    # 3.5 Cloud-Based EEG Overview


    Cloud computing is the practice of using a network of remote servers hosted on
    the Internet to store, manage, and process data, rather than on a local server
    or personal computer. This simply means that data and software are stored on offsite,
    remote servers, known as a server-farm infrastructure, and accessed over the Internet.
    In traditional computing, EEG recording and interpretation technology would be
    found on a local computer’s hard drive with networked servers used for archiving
    and data back-up. With Cloud-based technology, the local data center, as well
    as offsite data back-up systems, can be eliminated [26].


    With Cloud-based EEG technology, the software to perform a study is provided as
    a service by another company and is known as Software as a Service (SaaS). The
    patient is set up and the vEEG is recorded in the same manner as it would be on
    a digital EEG system, but instead of the data being'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'recorded, accessed, and stored on a local system, the software to run the study
    and the data storage server are seamlessly accessed over the Internet. The server
    is located in a secure and often unknown location – somewhere on “the Cloud”.
    Once on the Cloud server, all data remains encrypted and is securely protected.
    With SaaS, software licenses, updates, and security are provided, maintained,
    and completely managed by IT professionals who specialize in this type of service,
    relieving the EEG technologist and hospital IT department of this responsibility.
    The latest versions of software are rolled out to users who then have the option
    to push the update. Services are available on-demand and are often provided on
    a “pay-as-you-go” subscription basis. This means that data is always available,
    wherever the user may be, as long as there is a good Internet connection. Most
    Cloud providers are extremely reliable in providing services, with many maintaining
    a 99.9% uptime.


    In order to access recorded EEG and video data for pruning or review, a Client
    Application is installed onto a local computer and “requests” the pages of data
    from the server. The SaaS opens the files and the Client only allows the data
    to be viewed.


    Data is never downloaded onto a user’s computer, therefore, the opportunity for
    electronic Protected Health Information (ePHI) and patient data to be left on
    any computer, whether it is open, closed, on or off, is completely eliminated.


    Cloud-based computing systems are much more flexible than traditional methods
    for data recording and storage. Server and infrastructure needs are monitored
    and completely managed behind the scenes and can expand seamlessly when more space
    is required. Software solutions are kept current and will not become obsolete
    with changes in technology.


    Cloud solutions can be provisioned for peak times, then deprovisioned when increased
    capacity is no longer needed. This allows a flexible structure that adjusts according
    to business demands; costs for use fluctuate and grow with changes in business.


    # 3.5.1 Data Backup and Restoration


    HIPAA requires that data is protected using state of the art methods. Physical
    security of the server location is important, as well as ensuring that environmental
    conditions are optimal. This includes completely automatic back-up processes,
    continuous data protection, and frequent back-ups to geographically diverse locations.
    There should be 24-hour data monitoring, redundant power supplies with strict
    environmental controls, and verification that the data is being transferred correctly
    between'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'the client and server. Patient data should never be stored without proper backup.
    Redundant disk drives, which create full, mirrored backups of the data, are part
    of the critical process for recovery from corruption or data loss. Geographic
    redundancy ensures the data is stored in more than one location, so in the event
    of a catastrophic system failure due to natural or other disasters, the data is
    still safe, secure, and accessible. Access should be available to data whenever
    and wherever it is needed, and an export function should be available to download
    EEG data from the system onto whatever digital medium is preferred by the user,
    with all access tracked in the audit log [26]. It is imperative that each hospital
    or user group has a Disaster Recovery Plan in place should data restoration ever
    be necessary. This documented set of procedures and processes are critical for
    protecting and restoring an IT infrastructure in the event of a catastrophe.


    # 3.6 Conclusion


    An emotion can be identified by extracting different kinds of features from a
    signal. After preprocessing the signal, it has to be smoothed and optimized for
    a particular feature, using different deep learning optimization techniques like
    GA, PSO, etc. After getting the optimized result, it is applied to the Neural
    Network or SVM and it will provide a high accuracy of emotions in any situation.
    These emotions will be used for Human Computer Interaction, Affective Computing,
    Robotics, etc.


