  md: '# 14.4.1 Web Application Firewall (WAF) Security Models


    Web Application Firewalls consist of a positive security model and a negative
    security model or sometimes a mixture of both models. A positive security model
    WAF (“whitelist”) rejects every operation which does not comprise of authorised
    permission, whereas a negative security model (“deny list”) consists of a dropdown
    list of things that are restricted to be executed, providing permission to everything
    that is not part of that list.


    Positive Web Application Firewalls as well as negative Web Application Firewalls
    security models both provide their inputs in many application security situations.
    For instance:


    +   1. Positive Security Model


    When we perform input validation, the positive Web Application Firewall model
    states that you restrict the filtering out of bad inputs in order to specify the
    allowed inputs. The importance of using a positive security model firewall is
    that new attacks, which are not anticipated by the developer, will be prevented.


    When performing input approval, the positive model directs that you accept the
    permitted input instead of attempting to sift through bad input sources. The dominance
    of choosing a positive security model firewall is that new cyber traps, which
    are not foreseen by the engineer, will be pre-empted.


    +   2. Negative Security Model


    The negative Web Application Firewall model is simpler to execute, however, you
    can never be so certain that you have covered up all the aspects. You will certainly
    wind up with a considerable rundown of -ve marks to obstruct what must be perpetuated.
    The -ve security model methodology at first permits all traffic to come through
    despite the fact that many over the board restrictions have been implemented to
    improve security issues. Through this technique, offices that reliably make new
    system changes can get spare time so that the system does not get blocked.


