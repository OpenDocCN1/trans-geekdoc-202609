    # 1.2.2 Iris Recognition


    The iris is a shaded, flimsy, roundabout structure of the eye which controls light
    entering the retina by regulating the diameter and size of the pupil. It doesn’t
    change its appearance over a range of an individual’s lifetime except if harmed
    by external components [5]. Hereditarily indistinguishable twins also have distinctive
    iris designs. The irises of two eyes of an individual are also unique. **Iris
    recognition** is an automated method of identifying unique intricate patterns
    of an individual’s iris using mathematical pattern-recognition techniques.


    # WORKING OF IRIS READERS


    +   1. Scan an individual’s eyes with subtle infrared illumination to obtain detailed
    patterns of iris.

    +   2. Isolate iris pattern from the rest of the picture, analyze, and put in
    a system of coordinates.

    +   3. Coordinates are removed using computerized data and in this way an iris
    mark is produced.


    Even on disclosure, one cannot restore or reproduce such encrypted iris signatures.
    Now the user just needs to look at the infrared camera for verification. Iris
    acknowledgment results in faster coordination and is extremely resistant to false
    matches.


    # 1.2.3 Facial Recognition


    A non-intrusive technique to capture physical traits without contact and cooperation
    from people discovers its application in the acknowledgment framework. Every face
    can be illustrated as a linear combination of singular vectors of sets of faces.
    Thus, Principal Component Analysis (PCA) can be used for its implementation. The
    Eigen Face Approach in PCA can be utilized as it limits the dimensionality of
    a data set, consequently upgrading computational productivity [6].'
