  md: '# 11.4 Models and Design Goals


    # 11.4.1 Models


    # 11.4.1.1 System Model


    Just consider a biometric identification system based on cloud and consisting
    of three entities involved: Client, Cloud Server, and a Database Owner. The Database
    Owner haS the gathering of biometric data (D) whose copy he stores on a cloud
    server in an encrypted text format (C). For making data searches easier and faster,
    the Database Owner uses indexing methodology and creates index (I) for all the
    items in C and D, where a data item will have its one index which will be unique.
    The candidate''s biometric data will be with the Client who wants to check whether
    the pattern data can be matched by database D or not. To match identification,
    the Client will send his biometric pattern data to the Database Owner [13]. The
    Database Owner then creates an authentication detail or data for the biometric
    data received and submits the credential to the cloud. The cloud servers will
    search for the appropriate match to the user''s biometric data with the given
    authentication details and then returns the corresponding index of the data to
    the Database Owner. Thereafter, the plain text can be accessed by the Database
    Owner to make a match of the item using its index with the received data item
    and matches it with the previous model defined level, then sends the final authentication
    response back to the Client. Thus, we can see that, in this system model, time
    consumption of the data matching which is sourced out to the cloud is reduced.


