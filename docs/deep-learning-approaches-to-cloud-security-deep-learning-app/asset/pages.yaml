  md: '# Effective and Efficient Wind Power Generation Using Bifarious Solar PV System


    R. Amirthra Katesa Sai Raj*, M. Arun Kumar, S. Dinesh, U. Harisudhan and Dr. R.
    Uthirasamy


    Department of EEE, KPR Institute of Engineering and Technology, Coimbatore, India


    # Abstract


    Electricity is one of the most essential requirements in day-to-day life. Generally,
    electricity is generated through renewable and non-renewable energy sources. Power
    generation through the burning of coal is effective, but it also causes pollution
    and reduces the quantity of fossil fuels, which leads to degradation of natural
    resources. Nowadays, renewable energy sources are widely used because they are
    green and used to generate power without degrading any natural resources. Solar
    and wind energy are two of the most effective and efficient renewable energy sources,
    but windmills can produce power only when sufficient wind is blowing and a solar
    PV system can generate power only when there is sunlight. These two limitations
    degrade the efficiency of prolonged power generation. The main motivation of the
    proposed work is to improve the efficiency of wind power generation with the use
    of solar panels and utilize the power generated by solar cells effectively by
    powering the electrical components used inside a windmill, such as the revolving
    motor, elevators, etc. In this chapter, various literatures have been reviewed
    and the remarkable features of the proposed system are highlighted. At the end,
    data analysis is done using Deep Learning and visualizes all the results in graphical
    form. In this analysis, the power generation from our proposed system and traditional
    methods is visualized.


    Keywords: Solar panel, DC motor, cut-in speed, battery, yaw motor


    *Corresponding author: sairaj2306@gmail.com'
  merge: -1
  img_proc: true
