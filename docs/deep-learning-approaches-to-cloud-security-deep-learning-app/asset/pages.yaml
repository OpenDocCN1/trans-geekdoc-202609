    # 1) Support Vector Machine Classifier


    Support Vector Machines (SVM) come under supervised learning. Similar to Random
    Forest classifiers, they can be used for classification and regression (Singh,
    N., Singh, P. (2016)). An SVM classifier is best represented by coordinates in
    space that are plotted in such a way that the examples belonging to different
    categories are divided by a line which must be as wide as it could be placed.
    Newer categories are placed into the same place as it was earlier and they are
    predicted based on the gap side they belong to [19].


    A Support Vector Machine (SVM) plots a hyper plane usually in an n-dimensional
    space and can be used for classification or regression. On the hyper plane, whichever
    point has the maximum distance to the nearest point in any of the classes is selected.
    However, it is always easier to have a linear plane for the separation of two
    classes. This hyper plane is not manually inserted. In this case, kernels are
    usually used. An SVM kernel usually takes a low dimensional space and in turn
    converts into a higher dimensional space. This algorithm works well under a perfect
    separation line. It also turns out to be highly effective for higher dimensional
    spaces and also this classifier is memory-efficient [20].


    An SVM is usually classified as one of two types: linear or non-linear. A linear
    SVM is used for linearly separable data because it classifies two different classes
    by means of a single straight line, whereas a non-linear SVM can be useful for
    non-linearly separable data, i.e., the kind of data which cannot be distinguished
    by a straight line. Usually, an SVM assumes input in the form of numerical values.
    The points which are nearer to the hyper plane and create impact on their position
    are termed as support vectors. To find the coefficients of a hyper plane, a numerical
    optimization technique is used. The other method used is Sequential Minimal Optimization,
    which breaks problems into sub-problems and can be solved by mere calculating
    rather than numerical performing [21].


    # 2) Naive Bayes Classifier


    This classification is done on the basis of Bayes” theorem assuming that the predictors
    are independent to each other and that the presence of any feature in a class
    is unrelated to any other feature in any of the classes. This classifier is helpful
    for a large number of datasets. This is also one of the perfect classification
    methods used because it is simpler [22]. Usually, the dataset is classified into
    a feature matrix and response vector where the feature matrix has all vectors
    in which every vector contains values of'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'dependent features and the response vector contains the class variable value
    for every row of the feature matrix.


    This classifier is based on the assumption that every feature contributes independently
    and equally to the outcome. Some of the popular Naive Bayes Classifiers include
    Multinomial and Bernoulli Classifiers. In case of multinomial classifiers, frequencies
    are represented by feature vectors that are generated by multinomial distribution,
    whereas in Bernoulli, features are usually independent binary variables. Inputs
    in a Naive Bayes algorithm usually undergo of the following steps:


    +   Step 1: Convert the entire data set into a table of frequencies.

    +   Step 2: Create a likelihood table on the basis of certain probabilities.

    +   Step 3: Use the Bayesian Equation for calculating the posterior probability
    for each and every class; the one with the highest posterior probability is taken
    to be the predicted outcome.


    Navie Bayes Classifiers usually require a small number of training data to find
    out the required parameters and they are extremely fast. They also eliminate certain
    dimensional problems and fewer amounts of training data is enough for better prediction.
    This runs well when categorized inputs are given rather than numerical variables.
    In case of numerical variables, bell curves are usually used [23].


    # D. Classification of Data


    First, the classifiers are imported from a sklearn module and are assigned a particular
    variable name. Then, required parameters are fed to the classifiers for setting
    them up in tandem with our machine model. Training data is then fitted to the
    classifiers for training the model. Once the training is complete, the testing
    data is fed to the machine model for prediction of test dataset.


    # E. Model Evaluation


    Predicted values are collected and compared to the original values from the test
    dataset from sklearn using a Metrics Module Import Confusion Matrix, Accuracy
    Score, Classification Report, Cohen Kappa Score, and Mean Squared Error. The Confusion
    Matrix provides the correlation between true value and predicted value. A Classification
    Report provides parameters such as an F1 score, Precision, and Recall [24].


    +   1) Accuracy indicates how correct the measurement is. It tells how close a
    measurement is to a particular value. It shows the difference between the result
    and the true value.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Accuracy = TP+TN/(TP+TN+FP+FN)


    2) Precision tells how far two measurements are related with each other. Precision
    is usually calculated by using a standard value as a reference value.


    Precision = TP/TP+FP


    3) Recall is usually used as a method for relevance. It is usually a fraction
    of successfully obtained relevant datas.


    Recall = TP/TP+FN


    4) The F1 Score is one of the methods performed for determining accuracy. It is
    calculated as the average of precision and recall. F1 score is calculated using


    F1 Score = 2*(Recall * Precision) / (Recall + Precision)


    5) The Cohen Kappa Score is a measurement of how often the instances classified
    by means of Deep Learning Classifier match the data, which is usually maintained
    as a standard reference.


    Kappa = (OA – AC) / (1-AC)


    where


    OA – Observed Agreement

    AC - Agreement of Change


    6) Root Mean Square Error is the square root of the Mean Square Error. It is taken
    as the square of the difference between an estimated value and that of the parameter.
    It is a frequently used measure of the differences between values predicted by
    a model and the values actually observed [25].


