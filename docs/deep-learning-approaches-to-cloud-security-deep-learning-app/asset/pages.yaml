  md: '# Biometric Identification Using Deep Learning for Advance Cloud Security


    Navani Siroya<sup>1*</sup> and Manju Mandot<sup>2</sup>


    <sup>1</sup>MDS University Ajmer, India

    <sup>2</sup>Computer Science, JRN Rajasthan Vidyapeeth University, Udaipur, India


    # Abstract


    A few decades ago, biometric identification was a staple technology of highly
    advanced security systems in movies, but today, it exists all around us. Biometric
    technologies have the potential to revolutionize approaches to identity verification
    worldwide.


    This chapter discusses the prevailing Biometric modalities, their classification,
    and their working. It goes on to discuss the various approaches used for Facial
    Biometric Identification such as feature selection, extraction, face marking,
    and the Nearest Neighbor Approach.


    Here, we propose a system that compares an input image with that of the database
    in order to detect the presence of any similarities. Moreover, we use fiducially
    point analysis to extract facial landmarks and compare them with the database
    using data mining and use the Nearest Neighbor Approach for identifying similar
    images.


    The chapter ends with deliberations on the future extent of Biometric technologies
    and the need to put in ample safeguards for data protection and privacy.


    **Keywords:** Biometric, feature extraction, facial recognition, nearest neighbor
    approach


    *Corresponding author: siroyanavani@gmail.com'
