    # Random Forest Classifier


    This classifier is one of the compatible and easier algorithms to use. Also,

    there is no proper tuning required for the classifier. It is one of the com-

    monly used algorithms among all other algorithms [16]. This could be

    used for classification and regression. This kind of classification method

    uses multiple numbers of decision trees during the training phase for pro-

    ducing the desired output and that becomes the mode or mean of each and

    every tree. They do not suffer from the problem of over fitting.


    # Decision Tree


    A Decision Tree is the fundamental unit of this type of classifier. It comes

    under supervised learning. By means of decision trees, it classifies val-

    ues better. Every tree has a node which represents an attribute and every'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'leaf node represents a class. In random forest pseudo code, the first step
    includes placing the best fit property or attribute at the root. The second step
    involves dividing the training dataset in subsets of data and these subsets should
    contain the same value for a particular feature. These two steps need to be repeated
    until there are leaf nodes contained in every tree''s branch. Always, the attribute
    of the root is compared with that of the records. Based on this, we select the
    branch with the corresponding value and move to the other node. This process continues
    until we find a leaf node with a predicted value [17].


    It is always necessary to have a correct ratio of samples to feature numbers.
    It is essential to use the reduction of dimensions which gives better discriminative
    features. It is important to visualize the tree as an export function. It is also
    important to increase the depth of trees step by step for preventing the problem
    of over fitting. Whenever the sample size varies, float number could be used as
    a percentage. For a fewer number of classes, classification could be taken for
    a leaf value of one [18].


    The algorithm of this classifier works simply under four steps.


    +   Step 1: Selection of arbitrary samples from the obtained dataset

    +   Step 2: Decision tree needs to be built for every sample and every predicted
    result needs to be obtained from every decision tree

    +   Step 3: Voting needs to be performed for the predicted result


