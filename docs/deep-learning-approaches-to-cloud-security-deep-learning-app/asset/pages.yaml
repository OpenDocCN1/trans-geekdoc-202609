- pgno: 300
  md: 'Covering one of the most important subjects to our society today, cloud security,
    this editorial team delves into solutions taken from evolving deep learning approaches,
    solutions allowing computers to learn from experience and understand the world
    in terms of a hierarchy of concepts, with each concept defined through its relation
    to simpler concepts.


    Deep learning is the fastest growing field in computer science. Deep learning
    algorithms and techniques are found to be useful in different areas like automatic
    machine translation, automatic handwriting generation, visual recognition, fraud
    detection, and detecting developmental delay in children. However, applying deep
    learning techniques or algorithms successfully in these areas needs a concerted
    effort, fostering integrative research between experts ranging from diverse disciplines
    from data science to visualization. This book provides state of the art approaches
    of deep learning in these areas, including areas of detection and prediction,
    as well as future framework development, building service systems and analytical
    aspects. In all these topics, deep learning approaches, such as artificial neural
    networks, fuzzy logic, genetic algorithms, and hybrid mechanisms are used. This
    book is intended for dealing with modeling and performance prediction of the efficient
    cloud security systems, thereby bringing a newer dimension to this rapidly evolving
    field.


    This groundbreaking new volume presents these topics and trends of deep learning,
    bridging the research gap, and presenting solutions to the challenges facing the
    engineer or scientist every day in this area. Whether for the veteran engineer
    or the student, this is a must-have for any library.


    # Deep Learning Approaches to Cloud Security:


    +   * Is the first volume of its kind to go in-depth on the newest trends and
    innovations in cloud security through the use of deep learning approaches

    +   * Covers these important new innovations, such as AI, data mining, and other
    evolving computing technologies in relation to cloud security

    +   * Is a useful reference for the veteran computer scientist or engineer working
    in this area or an engineer new to the area, or a student in this area

    +   * Discusses not just the practical applications of these technologies, but
    also the broader concepts and theory behind how these deep learning tools are
    vital not just to cloud security, but society as a whole


    Audience: Computer scientists, scientists and engineers working with information
    technology, design, network security, and manufacturing, researchers in computers,
    electronics, and electrical and network security, integrated domain, and data
    analytics, and students in these areas


    Pramod Singh Rathore, PhD, is an assistant professor in the computer science and
    engineering department at the Aryabhatta Engineering College and Research Centre,
    Ajmer, Rajasthan, India and is also visiting faculty at the Government University,
    MDS Ajmer. He has over eight years of teaching experience and more than 45 publications
    in peer-reviewed journals, books, and conferences. He has also co-authored and
    edited numerous books with a variety of global publishers, such as the imprint,
    Wiley-Scrivener.


    Vishal Dutt, PhD, received his doctorate in computer science from the University
    of Madras, and he is an assistant professor in the computer science and engineering
    department at the Aryabhatta Engineering College in Ajmer, as well as visiting
    faculty at Maharshi Dayanand Saraswati University in Ajmer. He has four years
    of teaching experience and has more than 22 publications in peer-reviewed scientific
    and technical journals. He has also been working as a freelance writer for more
    than six years in the fields of data analytics, Java, Assembly Programmer, Desktop
    Designer, and Android Developer.


    Rashmi Agrawal, PhD, is a professor in the Department of Computer Applications
    at Manav Rachna International Institute of Research and Studies in Faridabad,
    India. She has over 18 years of experience in teaching and research and is a book
    series editor for a series on big data and machine learning. She has authored
    or coauthored numerous research papers in peer-reviewed scientific and technical
    journals and conferences and has also edited or authored books with a number of
    large book publishers, in imprints such as Wiley-Scrivener. She is also an active
    reviewer and editorial board member in various journals.


    Satya Murthy Sasubilli is a solutions architect with the Huntington National Bank,
    having received his masters in computer applications from the University of Madras,
    India. He has more than 15 years of experience in cloud-based technologies like
    big data solutions, cloud infrastructure, digital analytics delivery, data warehousing,
    and many others. He has worked for many Fortune 500 organizations, such as Infosys,
    Capgemini, and others and is an active reviewer for several scientific and technical
    journals.


    Srinivasa Rao Swarna is a program manager and senior data architect at Tata Consultancy
    Services in the USA. He received his BTech in chemical engineering from Jawaharlal
    Nehru Technological University, Hyderabad, India and completed his internship
    at Volkswagen AG, Wolfsburg, Germany in 2004. He has over 16 years of experience
    in this area, having worked with many Fortune 500 companies, and he is a frequent
    reviewer for several scientific and technical journals.'
