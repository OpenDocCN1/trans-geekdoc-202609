    # 4.3.2 DC Motor Mechanism


    A DC motor is used as a revolving element, which is used to rotate the rotor of
    the wind turbine when the cut-in speed of the wind is a little less than the rated
    speed. Since the ratio of the turbine is greater, a high starting torque is required
    to give a push to the rotor blades in order to gain momentum, so a DC series motor
    is used [7].


    The motor is placed in the gearing system, which drives the rotor of the wind
    turbine. Gearing arrangement is housed inside the nacelle and the motor is coupled
    to it as shown in the Figure 4.4.


    ![](img/146f9a713528a3fbc62fcad0f0d5a352_68_1.png)


    Figure 4.4 DC motor with gear arrangement.'
