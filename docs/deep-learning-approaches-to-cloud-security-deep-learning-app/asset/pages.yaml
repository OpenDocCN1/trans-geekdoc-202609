    panels. Panels are placed on top of the nacelle in a spoiler-like structure and
    also on the tower in a circular manner at equal intervals [3].


    # ## 4.3 Proposed System


    The proposed system is used to improve the power generation of the wind energy
    conversion system by the use of bifarious solar panels. Power generated from the
    solar panels is given to the battery, yaw motor, and DC motor when supply to them
    is needed, all other power from the solar panels is given to the grid via inverter.
    Li-ion batteries are used to store power during the daytime and stored power is
    given to the electrical components at night. The DC motor coupled to the gearing
    system is powered by solar energy and is used to give a starting push to the rotor
    blades when the wind speed is a little less than the cut-in speed [4].


    # ### 4.3.1 Block Diagram


    The block diagram representation of the proposed system is shown in the Figure
    4.3. Daytime and nighttime arrow marks represent power generation and utilization
    at different time periods [5]. The system consists of solar panels, a charge controller,
    battery bank, yaw motor, DC motor, gearbox, rotor blades, and an inverter unit
    with its controller unit. Typical working of the proposed system is explained
    as follows:


    +   - Solar panels are placed on top of the nacelle as well as on the tower to
    generate power during the daytime and supply it to various electrical components
    in the WECS.

    +   - Excess power is given to the grid via an inverter and charges the battery
    bank simultaneously.

    +   - The DC motor is operated when the cut-in speed of the wind is a little less
    than its rated speed, so even at low speed the WECS will be able to generate rated
    power.

    +   - At night, the battery bank acts as a power source to the electrical components
    [6].'
