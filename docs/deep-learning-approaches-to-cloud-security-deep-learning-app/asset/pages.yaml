    # 1.4 Related Work, A Review


    P M Rubesh Anand (2018), along with other researchers, in his study, have done
    a complete analysis of the cloud environment and summed up the prevailing security
    threats in the cloud, conceivable outcomes, and alleviation in cloud administration
    with accentuation on access supervision, identity management, and services. Their
    research evaluates various facets with their commonly used techniques or mechanisms.


    A K Jain (2012), in his research, sheds some light on the vulnerabilities of the
    biometric systems, the intrinsic limitations of the similarity of the any two
    biometrics, and its adversary effects. Unlike traditional authentication systems
    based on passwords, biometric authentications does not fully guarantee security.


    A Patil (2018) in his paper discusses the security concerns of the cloud computing.
    Since cloud computing is a technology that delivers real time services, it is
    vulnerable to various kinds of data breaches. They discuss end to end communication
    through encryption, which would safeguard stolen information as the content would
    be encrypted and require security credentials [14].


    To minimize, and ultimately beat, the dangers incorporated in the usage of customary
    strategies of authentication using PINs and passwords, a biometric framework for
    validation claimed to be more effective in controlling data breaches in cloud
    computing. In their research, they utilized an AES (Advanced Encryption Standard)
    algorithm for encrypting the data received from users at the time of enrollment
    and have devised another algorithm for the correlation of the user information
    with that of the layouts in the information database during authentication.


    C S Vorugunti (2014) in his paper provides a simple and secure authentication
    system based on the SAAS model. It involves enrollment and verification as two
    steps of authentication. In the enrollment process, the biometric data is converted
    into a binary form. The feature extractor then converts the binary string into
    a set of features. In the verification process, the same feature will be processed
    when the user logins to the cloud. The process then verifies the cryptographic
    encryption and decryption operation on the users’ biometric data.'
