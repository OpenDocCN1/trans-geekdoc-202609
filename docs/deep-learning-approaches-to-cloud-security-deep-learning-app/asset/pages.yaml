  md: '# 9.2.2.2 Deep Neural Networks


    A Deep Neural Network (or DNN), as the name suggests, is a deep study of neural
    networks where there are multiple layers interlinked to each other in between
    the input and output layers of the network. Many verified mathematical equations
    and manipulations were discovered by DNN so that it could obtain an intensified
    output by applying them over linear or nonlinear input data. When the network
    travels through every single layer, it evaluates the probability of each layer
    to determine the output. The perfect example of this is a DNN trained to identify
    a species of a spider; if we provide an image of a spider to the system to identify
    its species, to accomplish the following task, it will firstly scan the image
    and then it will try to calculate the probability of the spider in the image matches
    with the type of species present in the database. After getting the results, the
    user can set the limit of probability the machine must display.


    A DNN is programmed to generate complex non-linear correlations; that means that
    its system creates models where the object is represented as primitive layer of
    configuration. The layer added as an extra sector takes the components and attributes
    from lower layers which are probably modelling with units that are executing on
    a low-level network. Many variables with basic approaches are included in deep
    architecture where each and every architecture is successful in a specific architecture.
    Reversing the performance of any kind of architecture is not yet concluded to
    be possible unless it has been evaluated a similar data set.


    DNN network based data flow does not contain any loops when it flows between input
    and output layers. The steps indicating data flow in DNN are as follows: firstly,
    DNN generates a map of virtual neurons, then, it allots a random value to each
