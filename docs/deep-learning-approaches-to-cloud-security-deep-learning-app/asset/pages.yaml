    BCI research has undergone an explosive growth in recent years. At present, there
    are over 400 groups worldwide engaging in a wide spectrum of research and development
    programs using a variety of brain signals, signal features, and analysis and translational
    algorithms. In this review, we discuss the current status and future prospects
    of BCI technology and its clinical applications. We will define BCI, review the
    BCI-relevant source signals from the human brain, and describe the functional
    components of BCIs. We will also review current clinical applications of BCI technology
    and identify potential users and potential applications of Deep Learning. Finally,
    we will discuss current limitations of BCI technology, impediments to its widespread
    clinical use, and expectations for the future in the era of Deep Learning.


    # ## 3.2 Related Works


