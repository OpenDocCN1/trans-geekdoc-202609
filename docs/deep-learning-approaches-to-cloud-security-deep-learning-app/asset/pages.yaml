    # Advances in Cyber Security


    Series Editors: Rashmi Agrawal and D. Ganesh Gopal


    Scope: The purpose of this book series is to present books that are specifically
    designed to address the critical security challenges in today''s computing world
    including cloud and mobile environments and to discuss mechanisms for defending
    against those attacks by using classical and modern approaches of cryptography,
    blockchain and other defense mechanisms. The book series presents some of the
    state-of-the-art research work in the field of blockchain, cryptography and security
    in computing and communications. It is a valuable source of knowledge for researchers,
    engineers, practitioners, graduates, and doctoral students who are working in
    the field of blockchain, cryptography, network security, and security and privacy
    issues in the Internet of Things (IoT). It will also be useful for faculty members
    of graduate schools and universities. The book series provides a comprehensive
    look at the various facets of cloud security: infrastructure, network, services,
    compliance and users. It will provide real-world case studies to articulate the
    real and perceived risks and challenges in deploying and managing services in
    a cloud infrastructure from a security perspective. The book series will serve
    as a platform for books dealing with security concerns of decentralized applications
    (DApps) and smart contracts that operate on an open blockchain. The book series
    will be a comprehensive and up-to-date reference on information security and assurance.
    Bringing together the knowledge, skills, techniques, and tools required of IT
    security professionals, it facilitates the up-to-date understanding required to
    stay one step ahead of evolving threats, standards, and regulations.


    Publishers at Scrivener

    Martin Scrivener (martin@scrivenerpublishing.com)

    Phillip Carmical (pcarmical@scrivenerpublishing.com)'
