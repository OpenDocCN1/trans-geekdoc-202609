  md: 'eventually, is called Deep Learning (ML). These algorithms build a model based
    on the input data which we have fed into the system; this kind of data is called
    training data. Deep Learning approaches may be broadly classified under three
    groups as supervised learning, unsupervised learning, and reinforcement learning
    based on the type of input which is given to the system [13].


    The classification of CKD has been done using three proposed classifiers, namely,
    Random Forest, Naive Bayes, and Support Vector Machine. The proposed workflow
    for the prediction of each stage is shown in Figure 6.1. The steps which come
    under the workflow include acquirement of datasets, preprocessing of data, and
    training and testing the obtained datas. These steps are further explained below.


    # A. Acquisition of Dataset


