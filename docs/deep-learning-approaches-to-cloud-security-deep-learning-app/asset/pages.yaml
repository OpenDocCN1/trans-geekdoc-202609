    # 4.2 Study of Bi-Facial Solar Panel


    Bifarious (i.e., Bi-facial) solar panels Figure 4.2, are one of the most effective
    and efficient sources of solar power generation. They have solar PV cells in the
    front side of the panel, as well as on the back. This construction of PV placement
    generates effective power generation is small sizes.


    An important feature of these panels is that they can be placed in small areas
    yet can deliver two times the power of conventional panels.


    ![](img/146f9a713528a3fbc62fcad0f0d5a352_66_0.png)


    **Figure 4.2** Bi-facial solar panel.'
