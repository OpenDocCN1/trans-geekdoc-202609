  md: '# # Classification of MRI Images to Aid in Diagnosis of Neurological Disorder
    Using SVM


    Phavithra Selvaraj, Sruthi, M.S.*, Sridaran, M. and Dr. Jobin Christ M.C.


    Department of Biomedical Engineering, Rajalakshmi Engineering College, Chennai,
    India


    # ## Abstract


    This chapter provides a cognizance into the implementation of a support vector
    machine algorithm of Deep Learning to diagnose neurological conditions. With the
    advancement of emerging technologies, the means of diagnosing neurological conditions
    is substantially more complex than it used to be. Procedures and diagnostic tests
    are tools that help doctors identify a neurological illness or other medical condition.
    Precise identification of neurological pathologies can be done by adhering to
    an autopsy after the person’s passing. This paper is a novel implementation of
    an SVM algorithm to classify and diagnose various neurological pathologies using
    MRI images.


    **Keywords**: SVM, neurological disorders, MRI, deep learning


    # ### 7.1 Introduction


    Mental wellbeing plays a substantial part in a person’s health. With the number
    of neurological diseases increasing lately, the treatment gap for patients grows
    larger as the number of neurologists present is significantly less compared to
    the growth in the number of patients. Due to the repetition of many common symptoms
    between the many conditions in'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'various disorders, evaluating damage to the nervous system has been a complex
    task.


    Medical Imaging technology has had various ground-breaking advancements in diagnosing
    neural conditions. Numerous studies have been carried out by scientists to improve
    methods in order to provide elastic diagnostic information. Medical Imaging of
    the brain incorporates various types of imaging techniques used to diagnose stroke,
    blood vessel malformations, tumors, trauma, brain growth abnormalities, and hemorrhage
    in the brain. Magnetic Resonance Imaging uses radio waves generated by a programmed
    computer to generate detailed images of body tissues [1].


    An MRI can be used for the diagnosis of several conditions some of which are mentioned
    below:


    +   - Stroke

    +   - Traumatic brain injury

    +   - Brain and spinal cord tumors

    +   - Inflammation

    +   - Infection

    +   - Vascular irregularities

    +   - Disorders like Multiple Sclerosis

    +   - Brain damage associated with epilepsy

    +   - Abnormally developed brain regions

    +   - Some neurodegenerative disorders


    Papers about the classification of brain MRI images to identify conditions were
    studied and analyzed in order to arrive at the most optimal method for carrying
    out classification of the Brain MRI Images for diagnosing several neural conditions.
    Research studies on the evaluation of Deep Learning algorithms were studied and
    papers based on the structural features in MRI that are used for diagnosis of
    neurological conditions were also analyzed. One of the papers concluded that the
    selection of appropriate feature type is of the utmost importance when it comes
    to the efficiency of classification. The evaluation of different classifiers proved
    that most classifiers produced results with more or less the same accuracy when
    an adequate feature type is selected.


    Comparative analysis of different conditions and the correlation of MRI images
    with respect to them were also performed and the conclusions closely studied.
    One such study includes the classification of autism through Brain MRI analysis
    aiming to develop an Automated Cognitive System to classify ASD from healthy controls
    and to predict the neurotransmitter pattern in ASD patients which enables them
    to identify the'
