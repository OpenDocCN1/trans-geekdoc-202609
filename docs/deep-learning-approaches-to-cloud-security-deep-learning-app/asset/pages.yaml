- pgno: 18
  md: '# # Preface


    This book is organized into fifteen chapters. Chapter 1 discusses the prevailing
    Biometric modalities, classification, and their working. It goes on to discuss
    the various approaches used for Facial Biometric Identification such as feature
    selection, extraction, face marking, and the nearest neighbor approach.


    In Chapter 2 we understand the cloud computing concept with Multi-Tenant Framework
    (MWF). In Multi-Tenant Framework, there is a requirement of privacy and security,
    a concept developed using Deep Learning. The goal is to find privacy requirements
    in many factors. Multi-tenancy based systems use the Deep Learning concept. The
    services of Multi-Tenant based systems are aggregated due to the dynamic environment
    of cloud computing. Three consistencies will maintain privacy policies using deep
    learning.


    In Chapter 3, Automatic Emotion Detection using facial expression recognition
    is now a main area of focus in various fields such as computer science, medicine,
    and psychology. Various feature extraction techniques have been developed for
    classification of expressions from EEG signals from brain and facial expressions
    from static images, as well as real time videos. Deep Learning plays an important
    role for this kind of task. This chapter provides a review of research work carried
    out in the field of facial expression recognition and EEG Signal classification.


    In Chapter 4, the main motivation of the proposed work is to improve the efficiency
    of wind power generation with the use of solar panels and utilize the power generated
    by solar cells effectively by powering the electrical components used inside the
    wind mill, such as revolving motor, elevators, etc. In this paper, various literatures
    have been reviewed and the remarkable features of the proposed system are highlighted.
    At the end, the data analysis is done using deep learning and all the results
    are visualized in graphical form. In the analysis, the power generation from our
    proposed system and traditional methods is visualized.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Chapter 5 discusses mosaicing; a method of assembling multiple overlapping
    images of the same scene into a larger, wider image of a scene which overcomes
    the above issues. In the real-time monitoring, a major problem is that the field
    of vision is completely too small to capture the target and a larger field of
    vision results in low resolution. Ability to handle all the above issues, which
    includes management of quantity and quality feature extraction, is proposed. In
    this paper, Speeded Up Robust Features (SURF) are used to construct a mosaiced
    background model for foreground segmentation through deep learning.


    In Chapter 6, Chronic Kidney Disease shows slow and periodical loss of kidney
    function over a period of time and will develop into permanent kidney failure
    when left untreated. The proposed work aims at presenting the use of Deep Learning
    for the prediction of Chronic Kidney Disease. Training has been performed using
    16 attributes of about 400 patients. Three Deep Learning techniques like Random
    Forest, Support Vector Machine, and the Naive Bayes Classifier are helpful in
    predicting the stages. A comparative analysis of these three classifiers is performed.


    Chapter 7 provides a cognizance into the implementation of a support vector machine
    algorithm of Deep Learning to diagnose neurological conditions. With advancement
    of emerging technologies, the means of diagnosing neurological conditions is substantially
    more complex than it used to be. Procedures and diagnostic tests are tools that
    help doctors to identify a neurological illness or other medical condition. Precise
    identification of neurological pathologies can be done by adhering to an autopsy
    after the person’s passing.


    In Chapter 8 we define what convolution is needed in neural networks and the application
    of pooling on different data sets. This chapter also addresses how to use a CNN
    and the kind of operations it applies on the data-set. In this chapter, CNN are
    applied on image assets for feature extraction and dimensionality reduction.


    In Chapter 9, we discuss Deep Learning standard confronter issues on which shallow
    models, like SVM, are highly affected by the menace of dimensionality. As a module
    of a two-phase learning plan counts numerous layers of non-straight management,
    a lot of noticeably robust highpoints are logically unglued from the evidence.
    The existing instructional workout awarding the ESANN Deep Learning unusual consultation
    delicacies the cutting-edge models and results in the present understanding of
    this learning method which is an orientation for some difficult classification
    activities. So, in this chapter, we will learn about how Cloud Computing and Deep
    Learning have taken over the world with their new and improved'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'technologies and will learn about their applications, advantages, disadvantages,
    and correlations regarding different applications.


    In Chapter 10, we show a progression of examination concentrates on the best way
    to quicken the preparation of a disseminated AI Deep Learning model dependent
    on remote administration. Circulated Deep Learning has become the standard method
