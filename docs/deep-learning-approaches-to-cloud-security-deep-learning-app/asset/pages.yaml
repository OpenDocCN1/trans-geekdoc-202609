- pgno: 16
  md: '# Foreword


    This is Dr. Abhishek Kumar, Assistant Professor in Chitkara University, Himachal
    Pradesh. I have been involved in the research for more than 8 years with the authors
    of this book. This book is about a solution to these more intuitive problems.
    This solution is to allow computers to learn from experience and understand the
    world in terms of a hierarchy of concepts, with each concept defined through its
    relation to simpler concepts.


    This book is about how Deep Learning is the fastest growing field in computer
    science. Deep Learning algorithms and techniques are found to be useful in different
    areas like Automatic Machine Translation, Automatic Handwriting Generation, Visual
    Recognition, Fraud Detection, Detecting Developmental Delay in Children. However,
    applying Deep Learning techniques or algorithms successfully in these areas needs
    a concerted effort, fostering integrative research between experts ranging from
    diverse disciplines from data science to visualization. This book provides state
    of the art approaches of Deep Learning in these areas. It includes areas of detection,
    prediction, as well as future framework development, building service systems
    and analytical aspects. In all these topics, approaches of Deep Learning such
    as artificial neural networks, fuzzy logic, genetic algorithm and hybrid mechanisms
    are used. This book is intended for dealing with modeling and performance prediction
    of the efficient cloud security systems thereby bringing newer dimension.


    This book shall help clarify understanding of certain key mechanism of technology
    helpful in realizing such system. Enables processing of very large dataset help
    with precise and comprehensive forecast of risk and delivers recommended action
    that improve outcome for con-sumer. It is a novel application domain of deep learning
    that is of prime importance to human civilization as a whole. This would be helpful
    for both professionals and students, with state-of-the art knowledge on'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'the frontiers in information assurance. This book is a good step in that direction.


