  md: '# ## 3.3 Methods


    Deep Learning provides ways in which the EEG data are analyzed using several procedures,
    including signal preprocessing, feature extraction, dimensionality reduction,
    and classification methods to find emotions [8].


    # ### 3.3.1 EEG Signal Pre-Processing


    Pre-processing and feature extraction are two main steps in EEG signal processing.
    Pre-processing techniques help remove unnecessary artefacts from the EEG signal
    and increase the signal to noise ratio. A preprocessing block aids in improving
    the performance of the system by separating noise from the actual signal. Before
    processing the EEG, the signal has to remove noise and unwanted details by using
    spectral filtering and surface Laplace Transformation. 4 to 10Hz frequencies are
    used to extract the emotion related features. The following Feature Extraction
    Techniques of Deep Learning are used.


    # #### 3.3.1.1 Discrete Fourier Transform (DFT)


    In a time domain, representation of digital signals describes the signal amplitude
    versus the sampling time instant or the sample number. However, in some applications,
    signal frequency content is very useful otherwise as digital signal samples. The
    representation of the digital signal in terms of its frequency component in a
    frequency domain, that is, the signal spectrum, needs to be developed [9]. The
    algorithm transforming the time domain signal samples to the frequency domain
    components is known as the Discrete Fourier Transform, or DFT. The DFT also establishes
    a relationship between the time domain representation and the frequency domain
    representation. Therefore, we can apply the DFT to perform frequency analysis
    of a time domain sequence. In addition, the DFT is widely used in many other areas
    including spectral analysis, acoustics, imaging and video, audio, instrumentation,
    and communications systems.


    # #### 3.3.1.2 Least Mean Square (LMS) Algorithm


    Conventional filtering cannot be applied to eliminate artefacts because EEG signals
    and artefacts have overlapping spectra. An adaptive process was created in which
    the transfer function H(z) is adjusted according to an optimizing algorithm. The
    adaptation is directed by the error signal between the primary signal and the
    filter output. The most used optimizing'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'criterion is the Least Mean Square Algorithm. This algorithm of Deep Learning
    is an application scheme widely used in practice due to its simplicity [10].


    # 3.3.1.3 Discrete Cosine Transform (DCT)


    The DCT is a transform that is very common when encoding video and audio tracks
    on computers. It has found applications in digital signal processing and particularly
    in transform coding systems for data compression and decompression. DCT takes
    correlated input data and concentrates its energy in just the first few transform
    coefficients [11].


    # 3.3.2 Feature Extraction Techniques


    Feature extraction is the process of identifying the particular information from
    an EEG, which was measured by brain activity. This chapter focuses on several
    feature techniques, including:


    +   - Discrete Wavelet Transformation

    +   - Higher Order Crossing

    +   - Principal Component Analysis

    +   - Independent Component Analysis

    +   - Short Time Fourier Transform and Mutual Information

    +   - Time and Frequency Attribute


    This table explains different feature extraction methods and their advantages
    and disadvantages, which is helpful, for knowing how the feature is extracted
    from the EEG signal and analyzing emotion related features. By using this table,
    we can identify particular characteristics of the methods and the method that
    is extracting particular features with better results during the extraction process
    [12].


    # 3.3.3 Classification Techniques


    After extracting the features, classification is used to group related emotions.
    The following methods of Deep Learning are used for classification:


    +   - Neural Network

    +   - K-Nearest Neighbor

    +   - Support Vector Machine

    +   - Linear Dynamic Analysis'
