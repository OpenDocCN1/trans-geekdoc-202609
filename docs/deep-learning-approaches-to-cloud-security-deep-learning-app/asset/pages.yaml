    # 11.6.1 Issues and Challenges


    The main four Vs characterized by big data systems are volume, variety, velocity,
    and veracity. These dimensions are also associated with biometric data as explained
    below:


    # 1. Volume


    The data involved in biometric mechanisms is huge and the dataset involved has
    tons of entries. The authentication and the identification of faces is a big issue
    that it has huge volumes to tackle and search from--millions and millions of data
    rows. Another major challenge is to resolve the 1:N mapping in searching and mapping
    requests rather than the 1:1 requests which are a better outcome.


    Techniques to reduce dimensions aim at finding and exploring data structures with
    lesser dimensions in highly dimensioned data and save on computation and storage
    costs. The most popular and commonly used dimensionality reduction systems are
    Principal Component Analysis (PCA) and Linear Discriminant Analysis (LDA).


    # 2. Variety


    Biometrics systems are designed to run on a large variety of data types like image
    data, video data (faces or gaits), etc. Since the data coming from various sources
    are of different types, it is always a tedious and complex job to learn with such
    a heterogeneous data set.'
