  md: 'When there is no sufficient wind to generate power, the turbine does not rotate;
    thee cut-in speed of the wind is less and solar power is given to the DC motor
    to rotate the rotor. The DC motor gives a startup push to the turbine and it starts
    rotating, generating power at lesser speeds [8].


    The main advantage of using a DC motor is that there is no need for an inverter
    circuit, so there is no need to use an AC motor. Also, a DC series motor has a
    high starting torque when compared to AC motors.


    An AC induction motor can be also used, but by using an induction motor, the reactive
    power must be compensated for or efficiency will be reduced. Another drawback
    of using an AC motor is its maintenance.


    The DC motor is ideal when there is sufficient wind flowing and the power generated
    from solar energy is given to the grid via an inverter. Use of panels on towers
    also increases the power generated from solar energy.


    The power supply to the DC motor is from the solar panels during daytime and from
    battery banks at night [9].


    # 4.3.3 Battery Bank


    Li-ion batteries are used as backup power when there is no sunlight. Li-ion batteries
    are very efficient because of their less ideal discharge rate. Multiple batteries
    are taken and connected to form a stack of batteries. Battery banks are then placed
    inside the nacelle [10].


