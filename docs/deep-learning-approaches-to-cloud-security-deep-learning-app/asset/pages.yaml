    # 11.4.2 Design Goals


    In order to enable privacy-preserving and required biometric identification on
    the cloud platform, our cloud service should fulfill the required security and
    performance requirements simultaneously:


    +   - Cloud severs should be allowed by the system to work and perform most of
    the identification operations and the computational and communication cost should
    be kept at a minimum for the database owner as well as for the users using it

    +   - The biometric data integrity and security should also be protected during
    this whole identification process in such a way the others private biometric data
    cannot be derived in any form [15]

    +   - The system has to be efficient as well as scalable. In particular, the communication
