    # 7.2 Methodology


    Computerized medical image analysis and computer-aided diagnosis has progressed
    rapidly, promoting many imaging techniques to find applications in medical image
    processing. Several image processing operations should be applied on brain images
    before they can be used for the diagnosis of neurological pathologies. The identification,
    segmentation, and detection of an infected area in brain MRI images are tedious
    processes. The Magnetic Resonance Imaging technique provides a clear image on
    the neural architecture of the brain [3].


    An MRI contains many imaging modalities to scan and capture the internal structure
    of the human brain. The flowchart of the methodology used in this work is shown
    in Figure 7.1.


    # 7.2.1 Data Acquisition


    The MR images used in this work are obtained from four different databases. Autism
    MR images were obtained from an online repository called the LONI Image and Data
    Archive, which is managed by the University of Southern California. The IDA is
    a collection of data from different studies. Among these, the Autism Brain Imaging
    Data Exchange (ABIDE) consists of MR images of Autism patients. It consists of
    images with dimensions 176x256x256 and voxel size 1.05x1.05x1.05 [4].


    The Parkinson''s MR images and Schizophrenia MR images are obtained from Open
    Neuro and Open fMRI, which are online databases consisting of images from different
    research studies. The Parkinson''s image dimensions are 192x256x256 and the voxel
    size is 1x1x1. The MR images of patients with Schizophrenia have dimensions of
    160x192x192 and voxel size -1x1x1. The MR images of healthy individuals (control
    images) are obtained from both the above databases.'
