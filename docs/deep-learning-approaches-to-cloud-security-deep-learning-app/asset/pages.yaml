  md: '# 5.5 Conclusion


    This paper proposes and solves the problem of moving object detection in frame
    sequences. With PTZ cameras, object segmentation is done using a Background Mosaic
    Model based on Deep Learning segmentation approaches and then uses the foreground
    extraction technique. From extracted feature points, the accuracy of segmentation
    is improved with the help of a SURF feature-based Background Mosaic Model algorithm.
    The advantages of this method are plenty and, thus, this method is used in a variety
    of surveillance applications which require tracking and classification. In future
    work, complex video scenarios with harder conditions will be tested. Trying to
    detect humans while they are partially or completely occluded is not easy, but
