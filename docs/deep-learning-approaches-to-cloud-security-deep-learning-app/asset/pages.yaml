    the best classification algorithm depending on various parameters like accuracy
    and root mean square using a 2x2 confusion matrix. The results show that MLP provides
    a precision accuracy of 99.75%. This work could be used to predict the presence
    of CKD in patients but does not help in predicting the early stages of CKD [10].

    On an estimated analysis, over two million patients worldwide are affected by
    End-Stage Renal Disease characterized by a Glomerular Filtration Rate value less
    than 15 ml/min per 1.73 m². CKD is a burden not only due to renal replacement
    therapy (RRT) demands, but also for the health of the people. In this paper we
    have made an attempt to predict the first stages of CKD with the help of a Deep
    Learning Algorithm. Since the effect of CKD on global health is prodigious, it
    is essential to build a system that would ease the prediction of early stages
    of the disease. In this work, we predicted the stages of CKD by using a Deep Learning
    algorithm with 16-predictive attributes [11]. The classifiers used are a Random
    Forest Classifier, Support Vector Machine Classifier, and Naïve Bayes Classifier.
    Each classifier was trained and tested to get the percentage of accuracy using
    a predicted value. Out of the three classifiers we used, the Random Forest Classifier
    worked best when compared to the results predicted by a Support Vector Machine
    and Naive Bayes Classifier. With the help of a confusion matrix, we successfully
    predicted the stages of CKD using a Random Forest Classifier. The overall accuracy
    of RF for predicting the stages of CKD is 96.25% and the testing error rate is
    0.03%. This work helped us classify the patients relying upon the stages of CKD.
    We believe the early detection of the phases of kidney disease will surely help
    patients avoid falling into ESRD and likewise lessens mortality trouble due to
    kidney maladies [12].


    # 6.2 Materials and Methods


    The staging of Chronic Kidney Disease can be predicted using Deep Learning. A
    sequence of steps which is made to learn by the computer,'
