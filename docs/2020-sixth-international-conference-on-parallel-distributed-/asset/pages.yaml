    # D. Data Pre-processing


    The data set consists of various columns datatype being string, and Numeric. In
    machine learning all is applied to the categorical data of the columns which assign
    a unique number to each category in the data.


    Data wr is applied on the dataset to fill the missing values with mean, some of
    the states where hospitals is missing but numeric are filled with the number of
    beds available hospitals. The column having a data type could not be used to directly
    handle the data feature engineering is applied on the specific column. The dataset
    is divided into two phases training and Testing 70% of the dataset is used to
    train the model while 30% of the dataset is used to test the data.


    # E. Evaluation


    The objective of the evaluation metrics is to accurately predict the outcome of
    number of beds as required. The accuracy of the number of cases increased. The
    accuracy of the results is shown in the figure 6. The value is positive, positive
    error 0.0724, predicted is acceptable 0.629 which is greater than 0.5 proves proposed
    model is acceptable. The dataset consists of positive and negative datapoints.
    The proposed model could be calculated by total number of data points divided
    by total number of correct predictions divided (positive negative). With the help
    of accuracy, the accuracy of the improved model could be calculated with the following
    equations:


    accuracy= Data points/ total correct predictions


    0.0< Accuracy<1


    While presenting the system is the ratio of positive samples divided by total
    number of datapoints. Helps in identifying the correct number of accurate/correct
    predictions


    # REFERENCES


    A machine learning model is applied on the positive dataset, while multiple regression
    model is applied on the various attributes. State-wise population and beds with
    respect to number of cases of COVID-19 is considered for predicting the futuristic
    requirements. The interface of the proposed model is designed which dynamically
    predicts the predictions on the stated dataset (number of COVID cases which is
    constantly changing). The major issues is the lack of available data. Government
    is publishing the latest cases and status of the COVID-19 on public matters. Machine
    learning models provides the optimal results with the successful training with
    accurate data.


