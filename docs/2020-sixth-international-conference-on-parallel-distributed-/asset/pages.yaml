    Indian health system is not robust enough to provide a quality infrastructure
    and other resources to millions of its citizens. COVID-19 has created an emergency
    to fix all bottlenecks as soon as possible, the virus has erupted in many developed
    countries. India is starting at an alarming stage, just like a time bomb fixed
    in the head. Due to the inadequate health care services, very low testing of COVID-19
    cases has been done. Hence it is possible the numbers in India may not represent
