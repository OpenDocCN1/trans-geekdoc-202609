    **Keywords**—Machine learning, Regression, Hospitals, COVID-19, Health expenditure


    # ## INTRODUCTION


    Health system is affected all over the world due to COVID-19, or when we can generate
    an alert to the health care services and countries are trying to deploy strategies
    for it. To build some, number of beds available per thousand people, number of
    beds over total population, the de-population done by different countries, and
    over 60 years for some of the developed countries. Of the developed countries
    have prepared and able to handle the case of COVID-19. In this paper we have proposed
    a machine learning model to predict the number of beds required for patients.
    The number of beds available is retrieved from Gujarat state populations and number
    of patients based on health and family history. Multiple linear regression model
    is used for machine learning and is applied on the dataset to predict the number
    of required beds for the patients. An automated model is designed which can give
    the predictions of the beds on any number of patients.


