    In this paper we have developed machine learning to forecast the number of beds
    required for the Covid-19 patients. On July 5, 2020, India has 68,300 cases which
    is increasing at very fast rate. The Covid-19 positivity rate is 6.7 percent.
    There is major responsibility with the government and hospitals to take preventive
    measures, to manage the situation. The prediction model will dynamically provide
    the number of hospitals and beds needed for the care. Linear regression model
    of machine learning is used to implement the model. It is the best machine learning
    model for the continuous data and provides the accuracy of prediction after proper
    training of the model. It is a supervised machine learning model where different
    states of hospitals and population of different states as well as the population
    of Covid-19 patients is given as input. The set is divided into two training set
    and test data to 30 - 70 [70-71].


