    # 2020 第六届并行、分布式与网格计算国际会议 (PDGC)


    ![](img/1178e645b0ba2c81eb0871c695c6dc4c_3_0.png)


    图 5 所选属性之间的相关性


    ![](img/1178e645b0ba2c81eb0871c695c6dc4c_3_1.png)


    图 6. 遗传模型演示


    ## D. 数据预处理


    数据集包含多种数据类型的列，如字符串和数值（Numeric）。在机器学习中，这些方法均应用于列的分类数据，通过为数据中的每个类别分配一个唯一的数字。


    对数据集进行了数据清洗（Data wr），以用平均值填充缺失值；在某些缺失医院信息但为数值的状态下，用可用床位数量进行填充。对于数据类型无法直接处理的列，则对特定列应用了特征工程处理。数据集被分为训练和测试两个阶段：70%
    的数据集用于训练模型，30% 的数据集用于测试数据。


    ## E. 评估


    评估指标的目标是准确预测所需的床位数量。病例数量的准确性有所提高。结果的准确性如图 6 所示。值为正，误差为 0.0724，预测接受度为 0.629，大于
    0.5，证明所提模型是可以接受的。数据集包含正负数据点。所提模型可以通过数据点总数除以正确预测总数（正/负）来计算。在准确性的帮助下，可以使用公式计算改进模型的准确率：


    accuracy= 数据点/ 总正确预测数


    0.0 < Accuracy < 1


    在展示系统时，为正样本除以数据点总数的比例。这有助于识别准确/正确预测的数量。


    ## # 参考文献


    机器学习模型应用于正样本数据集，而多元回归模型应用于各种属性。考虑了各州人口与 COVID-19 病例相关的床位，以预测未来的需求。设计了所提模型的接口，用于动态对指定数据集（不断变化的
    COVID病例数）进行预测。主要问题是缺乏可用数据。政府正在公共事务方面发布 COVID-19 的最新病例和状况。机器学习模型通过在准确数据上的成功训练，提供了最优结果。


