    ### E. 密集与空洞技术：


    2017 年，[35] 提出了 DenseNet，其具有获取信息和梯度流的技术。目前，通过重复检查去混乱梯度并使用 DenseNet 减少特征计数不仅是巨大的。[40]
    针对肿瘤和肝脏样本分割建议了高密度连接。H-DenseNet 继承了密集连接路径和 U 型网络 [15] 的特征边缘。2015 年，[42] 空洞卷积最初被引入分割开始。传统的
    CNN 在给定样本上采用池化和卷积，这可能会收缩其维度并在卷积操作期间扩大感受野。在样本维度剪枝和扩展期间，使用空洞收缩和扩张对细节侵蚀的信息得以通过。它扩大了视野大小，使得每次卷积都能预测更大范围的特征。使用空洞卷积的分割模型通过样本和精细架构
    [44] 使用空洞卷积作为网络的输入卷积，其性能在几乎所有使用的实验中都优于原始架构。


