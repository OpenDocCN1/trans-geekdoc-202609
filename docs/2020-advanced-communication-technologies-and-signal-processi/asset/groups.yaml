    **Abstract**—Semantic Segmentation has benefited from the advancement of Deep
    Learning technologies. Image Segmentation has been a boon for medical field in
    both application and research area identification and lesion of infected parts
    of the organs can be extracted. Study of cell images from infected organs medical
    images taken from MRI, CT, etc to provide treatment as well as is possible for
    researchers to develop vaccines for such disease. This study is to train a model
    using different hyper-parameters so that the network learns to automatically segment
    medical images available from dated library. Segmentation is the key problem before
    any other type of problems can be encountered like that nucleus detection and
    classification. This study also looks at the performance of the network through
    evaluation matrix.


