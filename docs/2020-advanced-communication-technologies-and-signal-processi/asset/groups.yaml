    # 使用深度学习 U-Net 进行细胞核语义分割


    Rahul Pandey*

    信息技术系

    米佐拉姆大学

    印度，米佐拉姆

    ra.pan.91294@gmail.com


    R. Lachchhima

    信息技术系

    米佐拉姆大学

    印度，米佐拉姆

    mzut145@mzu.edu.in


    Ksh. Robert Singh

    电气工程系

    米佐拉姆大学

    印度，米佐拉姆

    mzut158@mzu.edu.in


    **摘要**— 语义分割受益于深度学习技术的进步。图像分割对于医学领域的应用和研究领域识别来说是一项巨大的福音，可以提取出器官受感染部位的病变。通过对来自
    MRI、CT 等医疗设备拍摄的受感染器官医学图像中的细胞图像进行研究，不仅可以提供治疗，还能让研究人员开发此类疾病的疫苗。本研究旨在通过使用不同的超参数来训练模型，使网络学会自动分割来自数据库的医学图像。分割是在遇到任何其他问题（如细胞核检测和分类）之前的关键问题。本研究还通过评估矩阵查看了网络的性能。


    ![](img/8ce026269c3728baf0d4c7d2546c7d3b_0_0.png)


    图 1. 常染色体多性囊性肾疾病的语义分割 [4]。


    **索引术**— 深度学习；神经网络；语义分割；细胞单元；医学图像分割；应用 U-Net。


    ## I. 引言


    分割涉及将图像（或视频帧）划分为不同的段，并将它们分配给具有相似的像素级对比度 [1]–3。特别是，语义分割是为给定样本中的每个像素分配颜色的任务，通常代表两个区域，即背景和物体。语义分割将不同感兴趣的“区域”相似性聚类视为一个单一单元。分割是图像计算和视觉的一个关键领域，应用于感知、粘接、检查、图像/视频压缩等许多领域。例如，医学中的语义分割
    [4]。


    随着现代技术（如以神经网络为基础的深度学习）的发展，已经开发出各种架构来实现分割（在我们的案例中是语义分割）。深度学习在执行语义分割方面有了显著提高，并促进了卓越水平的输出。一些广为人知的深度学习架构有
    CNN、FCN、U-Net、VNet、GoogleNet、ResNet-18 等。


    ### B. 深度网络


    从根本上说，深度学习是机器学习的一个子集，而机器学习又是人工智能的一个子集，如图1所示。深度神经网络基本上代表具有深层的人工神经网络，灵感来自人类大脑中从过去样本数据学习的神经元。深度学习算法反复更新任务，每次都调优以增强输出。


    | 人工智能 |

    | :--- |

    | 机器学习 |

    | 深度学习 |


    图 2. 深度学习的关系。机器学习与人工智能。


    在过去的几年里，深度卷积网络在视觉识别任务中的表现优于“先进水平”，例如 [6] [7]。虽然卷积网络已经存在很长时间，但它们的成功受限于可用训练集的大小和网络。由于在具有
    100 万张训练图像的 ImageNet 数据集上对具有 8 层和数百万个参数的大型网络进行监督学习，实现了突破。自此，已经训练了更大、更深的网络。


    ## II. 现有技术


    基于深度学习的语义分割方法的“未来感”模型是编码器-解码器和 FCN 架构的适应，它们之间有一些共同点，例如使用编码器和跳跃连接。跳跃连接已被证明在精炼目标对象的细粒度特征方面令人印象深刻，能够在复杂的样本上生成微小细节的语义标签
    [8]–10]。


    ### A. FCN 语义分割模型


    2015 年，提出了使用 FCN 进行语义分割的深度网络方法 [8]。广泛使用的卷积如 VGG16 和 GoogleNet 架构通过使用全卷积上采样来代替全连接层进行了修改。通过从像素逐点传播实现了甚至彻彻理解的像素分辨率输出。从最终层开始，使用跳跃连接对图进行上采样，并与之前的层图拼接。来自深层和粗糙层的语义空间细节与来自浅层和细微层的高分辨率特征细节相结合，以获得高精度的精确分割
    [9]。


    ![](img/8ce026269c3728baf0d4c7d2546c7d3b_1_0.png)


    图 4. SegNet: 编码器-解码器模型 [5]。


    ### C. 用于语义分割的 U-Net


    2015 年，提出了 U-Net 模型以为了研究目的积极分割生物显微样本。为了高效地理解图像样本，其架构和训练策略取决于数据增强问题。FCN 中的网络由任务、检测和与准确准位表达相关的捕获任务组成。在网络深度上，考虑以
