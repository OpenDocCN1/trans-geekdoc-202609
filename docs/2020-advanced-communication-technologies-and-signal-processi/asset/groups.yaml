    ## V. 结论


    语义分割是计算机视觉应用中备受关注的主题，部署在目标检测、自动驾驶、医学成像和物体识别等各种应用中。有效的分割技术取决于用户输入的参数，如优化器、激活函数以及
    UNet 模型对输入图像的预处理和调优。本文提出的方法在准确率方面成功实现了更精细的分割。


