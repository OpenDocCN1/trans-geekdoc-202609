    Medical Images Segmentation, Application U-Net.


    ## I. INTRODUCTION


    Segmentation involves partitioning an image (or video frames) into various segments
    and assigning them to similar pixel level contrasts [1]–3. In particular, semantic
    segmentation is the task of allocating a color to each pixel in a given sample
    generally representing two areas i.e., background and the object. Semantic segmentation
    treats various ''regions'' of interest similarity clusters as a single unit. Segmentation
    is a crucial area in image computing and vision with applications in perception,
    bonding, inspection, image/video compression and many more. For, an example of
    semantic segmentation in medical [4].


    With the advancement of modern technology such as Deep Learning using Neural Networks
    as foundation, various architectures have been developed to achieve segmentation
    (semantic segmentation in our case). Deep Learning has remarkably improved in
    performing semantic segmentation and is fostering output of outstanding calibre.
    Some of the widely known Deep Learning architectures are CNN, FCN, U-Net, VNet,
    GoogleNet, ResNet-18, etc.


    ### B. Deep Network


    Deep Learning is fundamentally a subset of ML that in turn is also a subset of
    AI in Fig: 1. Deep Neural Networks basically represent artificial neural networks
    with deep layers, inspired by the neurons in the human brain that learn from past
    data of sample. Deep learning algorithms frequently update the task over and over,
    every time tuning to enhance the output.


    | Artificial Intelligence |

    | :--- |

    | Machine Learning |

    | Deep Learning |


    Fig. 2. Relation of Deep Learning. Machine Learning and Artificial Intelligence.


    In the last years, Deep Convolutional Networks have outperformed the ''state of
    the art'' in visual recognition tasks, e.g. [6] [7]. While Convolutional Networks
    have existed for a long time, their success was limited to the size of the available
    training sets and networks. The breakthrough was achieved due to supervised learning
    of a large network with 8 layers and millions of parameters on the ImageNet data-set
    with 1 million training images. Since, even larger and deeper networks have been
    trained.


    ## II. STATE OF THE ART


    The ‘futuristic’ models for deep-learning based semantic segmentation methods
    are adaptations of the Encoder-Decoder and FCN architectures have some pieces
    that are common among them, such as using of encoder and skip connections. The
    skip-connections have demonstrated to be impressive in refining fine-grained characteristics
    of the desired objects, generating semantic labels of minute details on even complex
    sample [8]–10].


    ### A. FCN Semantic Segmentation Model


    In 2015 the deep network method for semantic segmentation with FCN was proposed
    [8]. Widely used convolutions like VGG16 and GoogleNet architecture was modified
    by using fully convolutional upsampling in place of fully layers. The pixel resolution
    output is achieved for even comprehension by propagation from pixel-wise. From
    the final layers, maps are upsampled using skip connections and concatenated with
    previous layer maps. Semantic spatial details from deep and rough layers while
    high resolution feature details from shallow and sublim layers are combined to
    obtain precision segmentation of high accuracy [9].


    ![](img/8ce026269c3728baf0d4c7d2546c7d3b_1_0.png)


    Fig. 4. SegNet: Encoder-Decoder Model [5].


    ### C. U-Net for Semantic Segmentation


    In 2015, the U-Net model was presented to actively segment bio-microscopic samples
    for research purposes. To efficiently comprehend from image samples, its architecture
    and training tactics hinge on augmentation issues. The network in FCN consists
    of tasks, detection and capturing linked with expression for accurate location.
    On the depth of the network, the VGG16 model as foundation is considered, that
    employs feature map quality rises with spatial resolution. The lowering of pixel-density
    by 32 is also one of U-Net characteristic.


    ![](img/8ce026269c3728baf0d4c7d2546c7d3b_1_1.png)


    Fig. 3. FCN Model Semantic Segmentation.


    ![](img/8ce026269c3728baf0d4c7d2546c7d3b_1_2.png)


    Fig. 5. U-Net Architecture.


    ### B. Encoder-Decoder Semantic Segmentation Model


    The notion of encoder-decoder networks, was initially moot for machine translation
    [10] and sequence learning [11]. slabs used as encoder are responsible for a single
    dimension representation which can easily employed for semantic segmentation but
    lacking fine details. Decoders will recover the signal lost during down-sampling
    operations or max-pooling, for the example the architecture is shown in Fig:3.
    FCN and Encoder-Decoder have inspired other models such as U-Net and VNet, to
    solve medical image issues and are also explored beyond medical area.


