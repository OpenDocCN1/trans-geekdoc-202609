    # V. CONCLUSION


    Semantic segmentation is a subject of significant interest in computer-vision
    applications that has been deployed in various applications such as object detection,
    autonomous steering, medical-imaging and recognizing objects. Effective segmentation
    techniques depend on manual initialization from user to some degree. This paper
    proposed pre-processing images and tuning in parameters such as Optimizer, Activation
    functions as well as Loss of the UNet model to automate the process of segmentation
    for the input images. In doing, we have successfully attained finer segmentation
    in terms of accuracy which can be observed from the graphs.


