    ## I. 引言


    分割涉及将图像（或视频帧）划分为不同的段，并将它们分配给具有相似的像素级对比度 [1]–3。特别是，语义分割是为给定样本中的每个像素分配颜色的任务，通常代表两个区域，即背景和物体。语义分割将不同感兴趣的“区域”相似性聚类视为一个单一单元。分割是图像计算和视觉的一个关键领域，应用于感知、粘接、检查、图像/视频压缩等许多领域。例如，医学中的语义分割
    [4]。


    随着现代技术（如以神经网络为基础的深度学习）的发展，已经开发出各种架构来实现分割（在我们的案例中是语义分割）。深度学习在执行语义分割方面有了显著提高，并促进了卓越水平的输出。一些广为人知的深度学习架构有
    CNN、FCN、U-Net、VNet、GoogleNet、ResNet-18 等。


    ### B. 深度网络


    从根本上说，深度学习是机器学习的一个子集，而机器学习又是人工智能的一个子集，如图1所示。深度神经网络基本上代表具有深层的人工神经网络，灵感来自人类大脑中从过去样本数据学习的神经元。深度学习算法反复更新任务，每次都调优以增强输出。


    | 人工智能 |

    | :--- |

    | 机器学习 |

    | 深度学习 |


    图 2. 深度学习的关系。机器学习与人工智能。


    在过去的几年里，深度卷积网络在视觉识别任务中的表现优于“先进水平”，例如 [6] [7]。虽然卷积网络已经存在很长时间，但它们的成功受限于可用训练集的大小和网络。由于在具有
    100 万张训练图像的 ImageNet 数据集上对具有 8 层和数百万个参数的大型网络进行监督学习，实现了突破。自此，已经训练了更大、更深的网络。


