    # A. Enhanced Techniques


    In spite of the basic UNet producing significant bio-medical sample, it also has
    its drawbacks in some areas. Researchers have proposed enhanced techniques to
    enhance the performance of the based UNet through such technique: attention technique,
    module technique, dilated technique, and residual technique. The segmentation
    networks designed on these techniques are likely better.


    +   1) Ensemble Technique: In CNN, ensemble networks are applied to solve over-fitting
    issue during training process [12]. An ensemble module consists of a set of parallel
    networks, which process the same input data in parallel and finally combine their
    outputs to complete the segmentation [12]. It consists of a main segmentation
    network and a pre-processing module. In most cases, of ensemble modules is more
    effective than that of a sub-net. In ensemble, sub-nets can learn from the data
    during the batch processing [13].


    # C. Multi-Node Attention


    Multi-Node attention module is a broad phrase for a class of techniques, which
    employs multiple layers to enhance segmentation execution. It is used in many
    deep learning techniques [30] [31]. These methods are usually using multi-scale
    or multi-scale frameworks which contain informative and complementary features.
    The different levels of these methods have different regions of interest, and
    allow the construction of multi-grained feature information. Multi-node attention
    can process high and low resolution images at the same time, which helps networks
    to combine complementary feature information. These segmentation networks are
    usually used to connect with other techniques.


