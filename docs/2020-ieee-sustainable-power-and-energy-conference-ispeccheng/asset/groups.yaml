    # VI. CONCLUSION


    Economicization and environmental protection is one of the social development
    trends. In order to solve the problems faced by the group official travel, such
    as insufficient buses, and those faced by market-oriented enterprises, this paper
    provides an EV sharing and leasing business model based on blockchain technology,
    which broadens the scene of the group''s official travel and a leasing model supported
    by the group''s personal private travel. In this model, including multiple actors
    such as the group, employees in the group and the group platform operator, the
    business process solutions for official and private EV use are established, the
    cost settlement for group employees'' trips is streamlined, while using blockchain
    technology to ensure reliability of EV leasing costs and to avoid situations such
    as use of private vehicles and false reimbursement. In addition, this paper proposes
    an incentive mechanism based on group credit, to motivate employees to use EV
    sharing and leasing for private use, so as to form a diversified economy. In 2018,
    Guangzhou and Jilin in China have successfully supported the use of shared vehicles
    for business travel, and the scheme proposed in this paper will support the EV
    official travel market of further development and improvement.


