    # I. INTRODUCTION


    With the market development of official vehicles, the traditional planning vehicle
    model has not adapted to the group''s official vehicle needs, and caused many
    problems in the use of vehicle management, highlighted: in the high cost of official
    vehicle allocations, causing a serious economic burden on the group; leading to
    excessive waste; and the phenomenon of private use of official vehicles which
    is a serious problem.


    Against this background, groups represented by state-owned institutions and private
    enterprises, have been exploring official management efficiency, strictly reducing
    the number and use of official vehicles, limiting the use of non-official vehicles
    with market-oriented travel or other forms. These challenges have several numbers:
    1) insufficient vehicles: limited number of vehicles reached by the group cannot
    almost meet the actual demand of electric vehicles; “official vehicle for official
    travel” may result in low efficiency of official vehicles in some groups; 2) insufficient
    supervision of vehicle


