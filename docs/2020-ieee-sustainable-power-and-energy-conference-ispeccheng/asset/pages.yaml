    +   1) Establish trust among all parties

    Vehicle-sharing is an industry that has great importance to offline. In addition
    to the current information sharing and evaluation system, there are behaviors
    such as malicious, damage and infringement of users'' rights, the cost of social
    intervention is relatively high.


    By validating who is other at the end of the transaction, it clarifies the division
    of responsibility, ownership, and access. With the blockchain technology, the
    operation of EV is enhanced by platforms, and multiple vehicles in the EV-sharing
    platform can be encouraged to join in the industry so to avoid the disadvantages
    of idle vehicle use and improve the use of efficiency. By placing idle vehicles
    on the platform, owners can obtain order revenue, which can only guarantee vehicle
    safety but also stable operation. In the future, with the help of blockchain technology,
    core problems such as authentication, data sharing, protection, security data,
    transparency and incentives can be solved. Business insurance, business finance,
    IT, business auto, repair, maintenance, and auto beauty, and even be expanded
    to meet the demand of development in the industry.


    +   2) Official and individual credit grading

    With the help of blockchain, the behavior of group users and individual users
    can be tracked by the shared operation platform. Based on the historical data,
    the credit of users can be recorded and updated, which is the premise for enterprise
    users to have the right to use the shared EV. For private users, their historical
    behavior data can be graded as personal credit. For individuals with good credit,
    personal travel can also be paid by credit granting rather than real-time payment.
    Blockchain-based vehicle credit not only improves the utilization of cars and
    reduces the operating cost of the platform, but also enables a sense of self-restraint
    and reduce idle usage.


    +   3) Industry points sharing

    As a result of the Internet, points connecting a role between B (enterprise) and
    C terminal (user) in the shared world. In general, general-businesses use points
    to mark various rights and their interests within the ecosystem to maintain user
    loyalty and costly usage.


    In the EV-sharing business, users can obtain through various behaviors such as
    travel, vehicle maintenance. With the help of blockchain, points can be collected
    among many participants in the share, so as to realize the ecology of the upstream
    and downstream of the electric industry producing consuming consumers. The points
    obtained from the enterprise''s behavior can be transferred to group employees
    as an incentive


    the company to give employees. The acquisition and circulation of points can greatly
    promote the establishment of the upstream and downstream ecology of the industry
    and the internal incentives of electric enterprises.


