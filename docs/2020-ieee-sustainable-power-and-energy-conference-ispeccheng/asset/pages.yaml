    II. MARKET ANALYSIS OF SHARING OFFICIAL TRAVEL


    From the perspective of groups, some enterprises, especially state-owned institutions,
    are not in position to share the group owned vehicles with public service or emergency
    reasons because the number of vehicles in groups is limited and may have idle
    during certain periods (e.g., weekends), which makes it possible to share the
    group vehicles within the organization or even with the public


    From the technical realization point of use, the sharing of group vehicles involves
    management and insurance data, the authenticity and reliability of such data is
    key for settlement of vehicle lease costs and the prevention of private use of
    official vehicles.


    From the perspective of the group ecology, the business scope of group''s official
    travel vehicle, leasing, with its size and growing trend of vehicle use, is no
    longer conducive to the formation of a business model with extensive diversification
    and diversified profits. It is necessary to introduce the group sharing of EV
    vehicle use as a supposed and based platform with multi-user participation.


