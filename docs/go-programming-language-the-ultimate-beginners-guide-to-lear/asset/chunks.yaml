    $ GOPATH / bin / hello Create a Web server Let''s make our previous simple program
    a web server: package main import "net / http" func main () { http.HandleFunc
    ("/", hello) http.ListenAndServe (": 8080", nil) } func hello (w http.ResponseWriter,
    r \* http.Request) { w.Write (\[\] byte ("hello!")) } There are a few lines that
    need to be explained. First we need to import the net / http package from the
    Go library: import "net / http" Then, install the Handler function in the root
    path of the Web server. Http.HandleFunc handles the initial Http request prompt
    in Go, ServeMux. http.HandleFunc ("/", hello) The hello function is of type http.HandlerFunc
    that allows the use of regular functions as processing functions for HTTP requests.
    The http.HandlerFunc functions have a special Signature signature (the function
    signature is the passed data and the data types returned by this function) and
    can be passed in a parameter to the HandleFunc function that registers the passed
    function in the given parameter of the ServeMux router, thus creating a web server,
    each time it arrives A new request that matches the root path, creates a new copy
    of the hello function. The hello function receives a variable of the http.ResponseWriter
    type that the wizard uses to generate an HTTP response and thus generates a response
    to the client request via the Write function provided by http.ResponseWriter.
    Since http.ResponseWriter.Write takes a generic type of \[\] byte or byte-slice,
    we convert the hello string to the appropriate type: func hello (w http.ResponseWriter,
    r \* http.Request) { w.Write (\[\] byte ("hello!")) } Finally, we run a Web server
    on port 8080 via the http.ListenAndServe function that receives two parameters,
    the first is the Port port and the second is a processing function. If the value
    of the second parameter is nil, then we want to use the default router DefaultServeMux.
    This Synchronous call, or Blocking, keeps the program running until the call is
    interrupted. Run and run the program the same way as before: go build ./hello
    Open another command-line-terminal and send an HTTP request to port 8080: curl
    http: // localhost: 8080 The result: hello! It''s simple. There is no need to
    install an external framework, download Dependencies or create project structures.
    The executable itself is an authentic Native code without operational credentials.
    Furthermore, the Web server''s standard library is geared to the production environment
    with defenses against common cyberattacks. This code can answer requests over
    the network directly and without arguments. Add new tracks We can do more important
    things than just say hello. Let the entry be a city name that we use to call the
    Weather API and redirect the answer - temperature - in response to the request.
    OpenWeatherMap provides a free and easy-to-use software interface for climate
    forecasting. Register at the site for an API key. Can query from OpenWeatherMap
    by cities. The API returns an answer as follows (we slightly edited the result):
    { "name": "Tokyo", "coord": { "lon": 139.69, "lat": 35.69 } , "weather": \[ {
    "id": 803, "main": "Clouds", "description": "broken clouds", "icon": "04n" } \],
    "main": { "temp": 296.69, "pressure": 1014, "humidity": 83, "temp\_min": 295.37,
    "temp\_max": 298.15 } } The variables in Go have static type, meaning that the
    type of data stored by the variables should be declared before use. So we will
    have to create a data structure to match the interface response format. We don''t
    need to store all the information, just keep the data we care about. We are now
    content with the name of the city and the expected temperature that comes with
    the Kelvin unit. We will define a structure to represent the data we need from
    the climate forecast service. type weatherData struct { Name string \`json:" name
    "\` Main struct { Kelvin float64 \`json:" temp " \` } \`json:" main "\` } The
    type keyword defines a new data structure called weatherData and declares it to
    be struct. Each field in variables of the struct type contains a name (for example,
    Name or Main), a data type (string or another anonymous), and a tag. The tags
    in Go are similar to the Metadata metadata, and enable us to use the encoding
    / json package to re-align the OpenWeatherMap response and save it in our data
    structure. More code is required than in languages ​​with dynamic data types (i.e.,
    a variable can be used as soon as we need it without having to declare the data
    type) like Ruby and Python, but it gives us the security of the data type. We
    have defined a data structure. We now need a way to fill this structure with data
    coming from the API; we will write a function for this. func query (city string)
    (weatherData, error) { resp, err: = http.Get ("http://api.openweathermap.org/data/2.5/weather?APPID=YOUR\_API\_KEY&q="
    + city) if err! = nil { return weatherData {}, err } defer resp.Body.Close ()
    var d weatherData if err: = json.NewDecoder (resp.Body) .Decode (& d); err! =
    nil  { return weatherData {}, err } return d, nil } The function takes a string
    of characters representing the city and returns a variable of weatherData and
    error data structures. This is the basic way to deal with errors in Go. Functions
    encapsulate certain behavior, and this behavior can fail. For our example, the
    GET request we send to OpenWeatherMap can fail for several reasons, and the returned
    data may be the one we are waiting for. In both cases, we return a non-nil error
    to the customer who is expected to handle the error in the context of the request.
    If the http.Get request succeeds, we postpone a request to close the response
    board to execute after exiting the Scope function (i.e. after returning from the
    HTTP request function), an elegant way to manage resources. In the meantime we
    reserve the weatherData structure and use json.Decoder to read the answer data
    and enter it directly into our structure. When the rework of the answer data is
    successful, we return the weatherData variable to the caller with an empty error
    to indicate that the operation was successful. We now proceed to associate that
    function with the processing function of the request: http.HandleFunc ("/ weather
    /", func (w http.ResponseWriter, r \* http.Request) { city: = strings.SplitN (r.URL.Path,
    "/", 3) \[2\] data, err: = query (city) if err! = nil { http.Error (w, err.Error
    (), http.StatusInternalServerError ) return } w.Header (). Set ("Content-Type",
    "application / json; charset = utf-8") json.NewEncoder (w) .Encode (data) }) We
    define a processing function on the In-line line instead of defining it separately.
    We use the strings.SplitN function to take all that exists after / weather / in
    the path and treat it as a city name. We execute the request and if we encounter
    errors that the customer knows about using the http.Error utility, we stop the
    execution of the function to indicate that the HTTP request is complete. If there
    is no error, we tell the customer that we are sending JSON data to it and use
    the json.NewEncode function to directly encode the weatherData content in JSON
    format. The blade is so elegant, it adopts a procedureural and easy to understand.
    They cannot be interpreted and cannot bypass common mistakes. If we move the "hello,
    world" processing function to the / hello path and import the required packages,
    we will get the following complete program: package main import ( "encoding /
    json" "net / http" "strings" ) func main () { http.HandleFunc ("/ hello", hello)
    http.HandleFunc ("/ weather /", func (w http.ResponseWriter, r \* http.Request)
    { city: = strings.SplitN (r.URL.Path, "/", 3) \[2\] data, err: = query (city)
    if err! = nil { http.Error (w, err.Error (), http.StatusInternalServerError) return
    } w.Header (). Set ("Content-Type", "application / json; charset = utf-8") json.NewEncoder
    (w) .Encode (data) }) http.ListenAndServe (": 8080", nil) } func hello (w http.ResponseWriter,
    r \* http.Request) { w.Write (\[\] byte ("hello!")) } func query (city string)
    (weatherData, error) { resp, err: = http.Get ("http://api.openweathermap.org/data/2.5/weather?APPID=YOUR\_API\_KEY&q="
    + city ) if err! = nil { return weatherData {}, err } defer resp.Body.Close ()
    var d weatherData if err: = json.NewDecoder (resp.Body) .Decode (& d); err! =
    nil { return weatherData {}, err } return d, nil } type weatherData struct { Name
    string \`json:" name "\` Main struct { Kelvin float64 \`json:" temp "\` } \`json:"
    main "\` } We run and execute the program in the same way as explained above:
    go build ./hello We open another terminal and request the path http: // localhost:
    8080 / weather / tokyo (Kelvin thermometer): curl http: // localhost: 8080 / weather
    / tokyo The result: {"name": "Tokyo", "main": {"temp": 295.9}} Query from multiple
    software interfaces Perhaps more accurate temperatures can be obtained if we inquire
    from several weather services and only average them. Most weather service interfaces
    require registration. We will add Weather Underground, so sign up for this service
    and find the authentication keys necessary to use the API. Since we want to have
    the same behavior from all services, it is worthwhile to write this behavior in
    an interface. type weatherProvider interface { temperature (city string) (float64,
    error) // in Kelvin, naturally } We can now convert the query function from the
    previous openWeatherMap to a data type that corresponds to the weatherProvider
    interface. Since we do not need to save any status to make an HTTP GET request,
    we will use an empty struct structure, and we will add a short line in the new
    query function to record what happens when you connect to the services for later
    review: type openWeatherMap struct {} func (w openWeatherMap) temperature (city
    string) (float64, error) { resp, err: = http.Get ("http://api.openweathermap.org/data/2.5/weather?APPID=YOUR\_API\_KEY&q="
    + city) if err! = nil { return 0, err } defer resp.Body.Close () var d struct
    { Main struct { Kelvin float64 \`json:" temp "\` } \`json:" main "\` } if err:
    = json.NewDecoder (resp.Body) .Decode (& d); err! = nil { return 0, err } log.Printf
    ("openWeatherMap:% s:% .2f", city, d.Main.Kelvin) return d.Main.Kelvin, nil }
    We just want to extract the temperature (Kelvin) from the answer, so we can define
    the struct structure on the Inline line. Otherwise, the  code is similar to the
    previous query function, but it is defined as the Method method of the openWeatherMap
    structure. This method allows us to use the Instance sample from openWeatherMap
    in place of the weatherProvider interface. We will do the same for Weather Underground.
    The only difference with the previous service is that we will store the API key
    in a struct and then use it in the function. Note that Weather Underground does
    not process identical city names as well as Open WeatherMap, which should be noted
    in actual applications. We will not address this in our simple example. type weatherUnderground
    struct { apiKey string } func (w weatherUnderground) temperature (city string)
    (float64, error) { resp, err: = http.Get ("http://api.wunderground.com/api/" +
    w.apiKey + "/ conditions / q /" + city + ".json") if err! = nil { return 0, err
    } defer resp.Body.Close () var d struct { Observation struct { Celsius float64
    \`json:" temp\_c "\` } \`json:" current\_observation " \` } if err: = json.NewDecoder
    (resp.Body) .Decode (& d); err! = nil { return 0, err } kelvin: = d.Observation.Celsius
    + 273.15 log.Printf ("weatherUnderground:% s:% .2f", city, kelvin) return kelvin,
    nil } We now have a weather service provider. Let us write a function that queries
    the two and returns the average temperature. For the sake of simplicity, we will
    stop querying if we have trouble getting data from both services. func temperature
    (city string, providers ... weatherProvider) (float64, error) { sum: = 0.0 for
    \_, provider: = range providers { k, err: = provider.temperature (city) if err!
    = nil { return 0, err } sum + = k } return sum / float64 (len (providers)), nil
    } Note that the function definition is very close to the definition of the temperature
    function defined in the weatherProvider interface. If we combine the weatherProvider
    interfaces into a data type and then define a function called temperature on this
    type, we can create a new type that combines the weatherProvider interfaces. type
    multiWeatherProvider \[\] weatherProvider func (w multiWeatherProvider) temperature
    (city string) (float64, error) { sum: = 0.0 for \_, provider: = range w { k, err:
    = provider.temperature (city) if err! = nil { return 0, err } sum + = k } return
    sum / float64 (len (w)), nil } Fabulous! We will be able to pass multiWeatherProvider
    to any function that accepts weatherProvider. We now associate the HTTP server
    with the temperature function to obtain temperatures when a path with a city name
    is requested: func main () { mw: = multiWeatherProvider { openWeatherMap {}, weatherUnderground
    {apiKey: "your-key-here"}, } http.HandleFunc ("/ weather /", func (w http.ResponseWriter,
    r \* http.Request) { begin: = time.Now () city: = strings.SplitN (r.URL.Path,
    "/", 3) \[2\] temp, err: = mw.temperature (city) if err! = nil { http.Error (w,
    err.Error (), http.StatusInternalServerError) return } w.Header (). Set ("Content-Type",
    "application / json; charset = utf-8") json.NewEncoder (w) .Encode (map \[string\]
    interface {} { "city": city, "temp": temp, "took": time.Since (begin) .String
    (), }) } ) http.ListenAndServe (": 8080", nil) } Run the program, run it and request
    a web server link as we did before. In addition to the JSON format in the application
    window, you will find outputs from the server registrations we added above in
    the window from which you ran the program. ./hello 2015/01/01 13:14:15 openWeatherMap:
    tokyo: 295.46 2015/01/01 13:14:16 weatherUnderground: tokyo: 273.15 $ curl http:
    // localhost: 8080 / weather / tokyo {"city": "tokyo", "temp": 284.30499999999995,
    "took": "821.665230ms"} Make the queries run in parallel We limit ourselves to
    the hour by querying the interfaces consecutively, one by one. There is nothing
    to stop us from querying both interfaces at the same time, which will reduce their
    response time. We take advantage of Go''s simultaneous playback capabilities across
    Go sub-units, goroutines and Channels. We will place each query in its own subunit
    and run it in parallel. We then combine the answers into one channel and then
    calculate averages when all queries are complete. func (w multiWeatherProvider)
    temperature (city string) (float64, error)  { // We create two channels, one for
    temperature and the other for errors // Each service provider adds a value to
    only one channel temps: = make (chan float64, len (w)) errs: = make (chan error,
    len (w)) // For each ISP, we call an anonymous function. An unknown function calls
    the dependent name temperature and then redirects the result obtained. for \_,
    provider: = range w { go func (p weatherProvider) { k, err: = p.temperature (city)
    if err! = nil { errs <- err return } temps <- k } (provider) } sum: = 0.0 // We
    collect temperatures - or errors, if any - from each service for i: = 0; i <len
    (w); i ++ { select { case temp: = <-temps: sum + = temp err: case = <-errs: return
    0, er r } } // Return the heat as before return sum / float64 (len (w)), nil }
    The time required to execute all queries now equals the time required to get an
    answer from the slowest weather service; rather than the sum of the durations
    of all queries as before. All we needed to do was modify the behavior of multiWeatherProvider,
    which still satisfies the needs of the simple and unparallel weatherProvider interface.'
  fmt: "\n# Go programming language: The Ultimate Beginner's Guide to Learn Go Programming\
    \ Step by Step By John Bach 3nd Edition\n\n\"Programming isn't about what you\
    \ know; it's about what you can figure out.\" - Chris Pine\n\n## Table of Contents\n\
    - Introduction: 5\n- Chapter I General concepts: 6\n- Chapter II Understanding\
    \ go: 19\n- Chapter III Writing the first program: 34\n- Chapter IV the rules:\
    \ 53\n- Chapter VI Create Backend: 84\n\n## Introduction\nYou may have heard in\
    \ the last few years about a new programming language that originated from within\
    \ Google called Go (or `Golang` as a searchable term for search engines), through\
    \ this book we will try to identify this language, its advantages, disadvantages\
    \ and what makes it different from others. \n\nThe first chapter of this book\
    \ will be a verbal lesson only, focusing on the points of difference of language\
    \ with the rest of the languages, and is directed to those with some programming\
    \ background with the rest of the languages, but the rest of the lessons will\
    \ be directed to beginners.\n\n## Chapter One: General concepts\nAs usual every\
    \ decade, there are new tools and techniques that try to take advantage of the\
    \ mistakes of their ancestors from tools and techniques. And \"What is the need\
    \ for a new programming language?\" Or \"Why don't they agree on a single programming\
    \ language?\" \n\nA programming language is just a tool for your tasks, each of\
    \ which is more appropriate for a task. Choose for each task the most appropriate\
    \ tool, and there is no need to sanctify the tool and the establishment of war\
    \ wars - non-technical - around them or create an imaginary obsession prevents\
    \ learning.\n\nA team of programmers from within Google felt it was time to improve\
    \ their workflow in `C` and `C++`, and they needed a new tool that eliminated\
    \ the flaws of those two, further improved their productivity, and was relevant\
    \ to the quality of Google's computational needs. They founded the Go programming\
    \ language within Google in 2007.\n\nThe long established team of the language\
    \ includes Unix's founder, Ken Thompson (a computer science, Ken) who worked for\
    \ Bell Labs, and Robert Pike, who was also part of Bell's Unix team Labs, one\
    \ of the founders of the `UTF-8` codec, and finally Robert Griesemer is a `V8`\
    \ JavaScript engine worker. \n\nKnowing this simple historical overview of Go,\
    \ I like to kill you all overly enthusiastic, I don't like you to love programming\
    \ language because of its founders, or it came out of a company you love, so I\
    \ will start to list things you may not like about the programming language Go,\
    \ even if you did not like it , You might want to stop reading. I would be personally\
    \ happy to see very few readers of this series really knowing what they are doing,\
    \ rather than a momentum enthusiastic about everything new without awareness and\
    \ knowledge of things.\n\n### Things you may not like about the Go programming\
    \ language\n\n#### 1. Object-oriented is not If\nIf you think it is, there is\
    \ no concept of `Class` or `Objects` and therefore there is no inheritance. However,\
    \ Go carries some of the advantages of object-oriented programming such as the\
    \ provision of `Interface`, `Structural Functions`, and `Struct` composition.\
    \ Why? The founders of language believe that object-oriented languages carry many\
    \ flaws and complexities that can be eliminated by abandoning some of these concepts\
    \ altogether. Even Java programmers themselves recommend `Composition`, for example,\
    \ more often than inheritance, language founders who believe that object-oriented\
    \ programming is often a bad idea, technically.\n\n#### 2. No Exception Handling\
    \ handled\nThis may be a corollary due to the absence of Go's concept of object\
    \ programming. Go errors are handled in fairly traditional way, since errors are\
    \ returned as normal values. However, Go allows you to throw an error for exceptional\
    \ cases via the keyword `panic` (similar to `raise` or `throw` in other languages)\
    \ as well as recover from these errors by `recover`.\n\n#### 3. No default or\
    \ optional arguments\nIn other programming languages, you might be used to doing\
    \ something like `function list(path, recursive = false)`. In Go, however you\
    \ cannot pass `recursive = false` as a sign because function will not accept such\
    \ default / optional parameters, Language founders believe that these behaviors\
    \ contribute to building unstable APIs or make their behavior unpredictable.\n\
    \n#### 4. No Overloading feature\nFor the same reasons, there is no Method overloading,\
    \ ie you cannot redefine a function with the same name but with different signature.\n\
    ```go\nfunc folder(path string) {}\nfunc folder(path string, level int) {}\nfunc\
    \ folderToLevel(path string, level int) {}\n```\n\n#### 5. No generics\nOther\
    \ languages enable you to write generic functions or classes, where you do not\
    \ declare the type of parameters you accept but leave them to know later when\
    \ you call them. type to be determined, so `<String>` or `<Integer>` can be easily\
    \ created while maintaining the same functions and operations. There is no Go\
    \ like this, instead there is interface as a universal type that satisfies all\
    \ types.\n\n#### 6. Go is a boring language\nBecause of the simplicity of language\
    \ and nothing new, many consider it a boring language. The number of keywords\
    \ and original types is small compared to other languages, and they greatly reduce\
    \ the existence of more than one way of doing a task. It doesn't even have `while`\
    \ loop and is limited to `for` loop.\n\n#### 7. Stubborn language\nThe founders\
    \ of language are firm in their opinion and decisions in the design of the language,\
    \ do not expect significant changes that may occur in the short or medium term.\n\
    \n#### 8. No consensus on a single package manager\nPython has `pip`, javascript\
    \ has `npm`, and other languages have a popular or agreed package manager, Go\
    \ is not. It has not yet agreed on a single package manager or how to get and\
    \ list dependencies in a standard way, but recently it is done through the concept\
    \ of `Vendoring`.\n\n## Things You May Like About the programming language Go\n\
    \n#### 1. Light parallel threads (goroutines)\nGo allows you to run parallel processing\
    \ and simply take full advantage of your CPU, as it has the so-called `goroutine`,\
    \ a parallel thread that is lighter than thread in other languages. It is enough,\
    \ for example, to create a function that works in a thread alone by going with\
    \ the `go` keyword:\n```go\ngo func () {\n    // A nasty function that does things\
    \ in a thread alone .... \n}\n```\n\n#### 2. Fast compiled language\nUnlike Ruby,\
    \ Python, Java and PHP, Go is an assembly language. The final output of your program\
    \ will be a stand-alone executable containing all the dependencies needed to run\
    \ it.\n\n#### 3. Productive language\nBecause it's boring language, it narrows\
    \ you to argue with your co-worker or someone working with you.\n\n#### 4. Multiple\
    \ platforms\nThe same software can be reassembled to run on Windows, Linux, Mac\
    \ OS or even smartphones.\n\n#### 5. Rich Standard Library\nDespite the novelty\
    \ of language, its standard library has made progress. It contains many things\
    \ needed by most types of applications.\n\n#### 6. Unicode everything by default\n\
    Go has made everything by default unless otherwise specified. Go has a `rune`\
    \ type instead of `char` type in other languages.\n\n#### 7. Good built-in tools\n\
    The documentation of your software can be generated by simply typing `godoc` command,\
    \ improving the formatting by typing `gofmt`, or starting code procedures (for\
    \ example, unit testing) by typing `go test`, all tools come with the `Go` installation.\n\
    \n#### 8. Easy language in terms of writing and formatting (Syntax)\nThe format\
    \ of the language is similar to Python, where there is no semicolon (`;`) after\
    \ the end of each instruction. A variable can be made without specifying its type:\n\
    ```go\nage := 35\n```\nFunctions can return more than one value:\n```go\nfunc\
    \ Hello() (string, string) { return \"Hello\", \"\" }\n```\n\n## Chapter II: Understanding\
    \ go\nIn the previous chapter, we learned about Go and its differences with other\
    \ languages. In this chapter, we will try to explain how to install it and understand\
    \ its workspace.\n\nGo has two types of compilers:\n1. `gc`: The standard compiler.\n\
    2. `gccgo`: A compiler that relies on `gcc` and supports more CPU architectures.\n\
    \n### Install Go\n- **Windows and Mac OS**: Go to the language site and download\
    \ the version for your system.\n- **Linux**: Check your package manager. For Ubuntu/Debian:\n\
    \  ```bash\n  sudo add-apt-repository -y ppa:ethereum/golang\n  sudo apt-get update\n\
    \  sudo apt-get install golang\n  ```\n  For Arch Linux:\n  ```bash\n  sudo pacman\
    \ -S go\n  ```\n\n### Understand the work environment\nThe working environment\
    \ here is basic: A folder on your computer, created anywhere you want, for all\
    \ Go projects. An environment variable `GOPATH` refers to this folder. Suppose\
    \ you name the work folder `work`, which should contain three subfolders:\n- `src`:\
    \ Where you place all the code for projects.\n- `bin`: Where executables generated\
    \ by your code are transferred.\n- `pkg`: Where external libraries fetched via\
    \ `go get` are stored.\n\n```text\nwork folder\n├── bin  # The resulting executables\
    \ folder\n├── pkg  # The resulting program libraries folder\n└── src  # Our code\
    \ folder\n```\n\nSince Go is a recent language, it assumes you will host your\
    \ code in a repository managed with a version management tool (VCS) such as `Git`\
    \ or `Mercurial`.\n\n### Configuring the work environment\nFor **Linux or Mac\
    \ OS**, add this to your `.bashrc` or `.zshrc`:\n```bash\nexport GOPATH=$HOME/work\n\
    export PATH=$PATH:$GOPATH/bin\n```\nFor **Windows**, add `GOPATH` to your Environment\
    \ Variables and add `C:\\Users\\username\\work\\bin` to your Path.\n\n### Bonus:\
    \ What if we can make executables\nTo create an executable without browsing every\
    \ time, use `go get`:\n```bash\ngo get github.com/your-username/hello\n```\nThis\
    \ will move the tool to `GOPATH/bin`.\n\n## Chapter III: Writing the first program\n\
    What does Go look like? How do I run a program written in Go?\n\n### Welcome to\
    \ the world\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    fmt.Print(\"\
    Welcome to the world\\n\")\n}\n```\nPlace this in a file named `helloworld.go`\
    \ inside a folder named `hello`. Run it using:\n```bash\ngo run helloworld.go\n\
    ```\n\n#### Line by line explanation\n- `package main`: Each Go file must belong\
    \ to a package. `main` is a special name that the compiler treats as the program\
    \ entry.\n- `import \"fmt\"`: Imports the `fmt` (format) standard library for\
    \ printing.\n- `func main()`: The main function where execution starts. \n- `fmt.Print(...)`:\
    \ Prints the string to the console. `\\n` is a newline character.\n\n### HelloHello\
    \ (Returning a value)\nIf you want to see how a function returns a value:\n```go\n\
    package hello\n\nimport \"fmt\"\n\nfunc HelloHello() string {\n    return \"Hello\
    \ world!\"\n}\n```\nNote: The function name starting with a capital letter (Uppercase)\
    \ makes it exported (accessible from other packages).\n\n## Chapter IV: The rules\n\
    The Go language was created to get the job done easily with static typing and\
    \ fast compilation.\n\n### Variables\nVariables in Go are declared before use.\n\
    ```go\nvar age int = 35\nage := 35 // Short declaration\n```\nStrings are immutable.\n\
    \n### Data Types\n- `string`: Use double quotes `\"\"`. Use backticks `` `` ``\
    \ for raw string literals including line breaks.\n- `rune`: Alias for `int32`,\
    \ represents Unicode characters.\n- `float64`: For decimal numbers.\n- `complex128`:\
    \ For complex numbers.\n- `uint/byte`: Unsigned integers.\n\n### Arrays vs Slices\n\
    Arrays have a fixed size at compile time:\n```go\nvar a4 [4]int\nvar a3 = [3]int{1,\
    \ 3, 5}\n```\nSlices are dynamic and are more common:\n```go\ns3 = []int{4, 5,\
    \ 9}\ns4 = make([]int, 4)\n```\nUse the built-in `append` function to add elements\
    \ to a slice:\n```go\ns := []int{1, 2, 3}\ns = append(s, 4, 5, 6)\n```\n\n###\
    \ Comments\nUse `//` for single-line comments and `/* ... */` for multi-line comments.\n\
    \n## Chapter VI: Create Backend\nGo programming development began with an experiment\
    \ from Google engineers.\n\n### Create a Web server\nWe can start a web server\
    \ using the `http` package.\n```go\npackage main\n\nimport (\n    \"encoding/json\"\
    \n    \"net/http\"\n    \"strings\"\n)\n\nfunc main() {\n    http.HandleFunc(\"\
    /weather/\", func(w http.ResponseWriter, r *http.Request) {\n        // ... logic\
    \ here\n        w.Header().Set(\"Content-Type\", \"application/json; charset=utf-8\"\
    )\n        json.NewEncoder(w).Encode(data)\n    })\n    http.ListenAndServe(\"\
    :8080\", nil)\n}\n```\n\n### Example: Querying a Weather API\n```go\ntype weatherData\
    \ struct {\n    Name   string  `json:\"name\"`\n    Kelvin float64 `json:\"temp\"\
    `\n}\n\nfunc query(city string) (weatherData, error) {\n    resp, err := http.Get(\"\
    http://api.openweathermap.org/data/2.5/weather?APPID=YOUR_API_KEY&q=\" + city)\n\
    \    if err != nil {\n        return weatherData{}, err\n    }\n    defer resp.Body.Close()\n\
    \n    var d weatherData\n    err = json.NewDecoder(resp.Body).Decode(&d)\n   \
    \ if err != nil {\n        return weatherData{}, err\n    }\n    return d, nil\n\
    }\n```\n"
  trans: "\n\n# Go 编程语言：John Bach 编写的分步学习 Go 编程终极新手指南第 3 版\n\n“编程不在于你知道什么，而在于你能弄懂什么。”\
    \ - Chris Pine\n\n## 目录\n- 引言: 5\n- 第一章 通用概念: 6\n- 第二章 理解 Go: 19\n- 第三章 编写第一个程序:\
    \ 34\n- 第四章 规则: 53\n- 第六章 创建后端: 84\n\n## 引言\n在过去的几年里，你可能听说过一种源自 Google 内部的新编程语言，被称为\
    \ Go（作为搜索引擎的搜索术语称为 `Golang`）。通过这本书，我们将尝试识别这种语言、它的优点、缺点以及它与其他语言的不同之处。\n\n本书的第一章将仅作为口头教程，重点介绍该语言与其他语言的差异，并面向具有其他语言编程背景的读者，而后续章节将面向初学者。\n\
    \n## 第一章：通用概念\n和往常一样，每十年都有新的工具和技术试图从前辈工具和技术的错误中吸取经验。“为什么需要一种新的编程语言？”或者“为什么他们不能对一种编程语言达成共识？”\n\
    \n编程语言仅仅是你完成任务的工具，每种工具都有其特定的任务。为每个任务选择最合适的工具即可，无需将工具神圣化，或在其周围引发非技术的战争，或是创造阻碍学习的虚幻执念。\n\
    \n来自 Google 内部的一个程序员团队认为是时候改进他们在 `C` 和 `C++` 中的工作流了，他们需要一种新工具来消除这两个工具的缺陷，进一步提高生产力，并符合\
    \ Google 计算需求的质量。他们于 2007 年在 Google 内部创立了 Go 编程语言。\n\n该语言的资深团队包括 Unix 的创始人 Ken\
    \ Thompson（计算机科学家 Ken，他曾任职于贝尔实验室），以及 Robert Pike，他也是贝尔实验室 Unix 团队的成员，`UTF-8` 编码的创始人之一；最后是\
    \ Robert Gries way，他是一位 `V8` JavaScript 引擎的工程师。\n\n在了解了 Go 的这段简单历史回顾后，我想泼灭掉你们过度的热情。我不希望你们因为它的创始人或它出自你们喜爱的的公司而热爱这门语言，因此我将开始列出一些你们可能不喜欢\
    \ Go 编程语言的地方，即使你们并不喜欢，也可能想停止阅读。我个人更希望看到这个系列书中极少数读者真正知道自己在做什么，而不是在对缺乏认知和知识的情况下对一切新事物盲目热情。\n\
    \n### 你可能不喜欢 Go 编程语言的地方\n\n#### 1. 面向对象并不是\n如果你认为它是，那么它没有类（`Class`）或对象（`Objects`）的概念，因此没有继承。然而\
    \ Go 携带了一些面向对象编程的优势，例如提供接口（`Interface`）、结构函数和结构体（`Struct`）组合。为什么？语言创始人认为面向对象的语言带有许多缺陷和复杂性，可以通过完全放弃这些概念来消除它们。甚至\
    \ Java 程序员自己也更倾向于使用“组合”而非继承；语言创始人认为从技术上来说，面向对象编程通常是一个坏主意。\n\n#### 2. 没有处理异常机制\n\
    这可能是由于 Go 缺乏对象编程概念导致的。Go 的错误以相当传统的方式处理，因为错误是作为普通值返回的。然而，Go 允许你通过关键字 `panic`（类似于其他语言中的\
    \ `raise` 或 `throw`）为异常情况抛出错误，并通过 `recover` 恢复这些错误。\n\n#### 3. 没有默认或可选参数\n在其他编程语言中，你可能习惯于类似\
    \ `function list(path, recursive = false)` 的操作。但在 Go 中，你不能将 `recursive = false`\
    \ 传递，因为函数不接受此类默认/可选参数。语言创始人认为这些行为会导致构建不稳定的 API 或使其行为变得不可预测。\n\n#### 4. 没有重载功能\n\
    出于同样的原因，没有方法重载，即你不能重新定义一个同名但签名不同的函数。\n```go\nfunc folder(path string) {}\nfunc\
    \ folder(path string, level int) {}\nfunc folderToLevel(path string, level int)\
    \ {}\n```\n\n#### 5. 没有泛型\n其他语言允许你编写泛型函数或类，你不需要声明接受的参数类型，而是留到调用时再确定类型，因此可以轻松创建\
    \ `<String>` 或 `<Integer>` 的同时保持相同的函数和操作。Go 没有这种机制，相反，接口（interface）作为一种满足所有类型的通用类型。\n\
    \n#### 6. Go 是一门无聊的语言\n因为语言简单且没有新花样，许多人认为它是一门无聊的语言。与其他语言相比，关键字和原始类型较少，它们极大地减少了完成某项任务的多样方法。它甚至没有\
    \ `while` 循环，而是限于 `for` 循环。\n\n#### 7. 固执的语言\n语言创始人对设计意见非常坚定，不要期望在短期或中期会发生重大的变化。\n\
    \n#### 8. 没有统一的包管理器\nPython 有 `pip`，javascript 有 `npm`，其他语言都有流行的包管理器，Go 尚未对如何获取和列出依赖达成共识，最近通过\
    \ `Vendoring` 概念来实现。\n\n## 你可能喜欢 Go 编程语言的地方\n\n#### 1. 轻量级线程 (goroutines)\nGo\
    \ 允许你运行并行处理并充分利用 CPU，它所谓的 `goroutine` 比其他语言的线程要轻量得多。你可以通过 `go` 关键字来创建它：\n```go\n\
    go func () {\n    // 在线程中执行的操作\n}\n```\n\n#### 2. 编译型语言\n与 Ruby、Python 和 Java\
    \ 不同，Go 是编译型语言。它的最终输出是运行所需的可执行文件。\n\n#### 3. 高效语言\n因为这门语言是无聊的（简单的），它能让你专注于与工作本身。\n\
    \n#### 4. 多平台支持\n同一份软件可以重新组合并在 Windows、Linux 甚至 Mac OS 上运行。\n\n#### 5. 丰富的标准库\n\
    尽管缺乏新奇性，它的标准库包含了大多数应用程序所需的许多内容。\n\n#### 6. 默认支持 Unicode\nGo 默认支持 Unicode，使用 `rune`\
    \ 类型而不是 `char` 类型。\n\n#### 7. 内置工具\nGo 自带 `godoc` 命令生成文档，通过 `gofmt` 改进格式化，通过 `go\
    \ test` 进行单元测试。\n\n#### 8. 易的语法和格式化\nGo 的格式与 Python 类似，每条指令结尾没有分号（`;`）。你可以指定类型：\n\
    ```go\nage := 35\n```\n函数可以返回多个值：\n```go\nfunc Hello() { return \"Hello\" }\n\
    ```\n\n## 第二章：理解 Go\n在上一章中，我们了解了 Go 以及与其他语言的区别。在本章中，我们将尝试解释如何安装它以及它的工作空间。\n\n\
    Go 有两种类型的编译器：\n1. `gc`: 标准编译器。\n2. `gcc`: 支持更多 CPU 架构的编译器。\n\n### 安装 Go\n- **Windows\
    \ 和 Mac OS**: 下载 Go 语言版本。\n- **Linux (Ubuntu/Debian)**:\n  ```bash\n  sudo add-apt-repository\
    \ ppa:golang\n  sudo apt-get update\n  sudo apt-get install golang\n  ```\n- **Arch\
    \ Linux**:\n  ```bash\n  sudo pacman -S go\n  ```\n\n### 理解工作环境\n工作环境 `GOPATH`\
    \ 指的是文件夹，它应该包含三个子文件夹：\n```text\nwork folder\n├── bin  # 可执行文件文件夹\n├── pkg  # 库文件夹\n\
    └── src  # 代码文件夹\n```\n由于 Go 是一门语言，假设你会使用版本控制工具（VCS）如 `Git` 或 `Mercurial` 管理代码。\n\
    \n### 配置工作环境\n**Linux 或 Mac OS**，将此添加到 `.bashrc` 或 `.zshrc`：\n```bash\nexport\
    \ GOPATH=$HOME/work\nexport PATH=$PATH:$GOPATH/bin\n```\n**Windows**，将 `GOPATH`\
    \ 添加到环境变量中，并将 `C:\\Users\\username\\work\\bin` 添加到 Path 中。\n\n### Bonus：如何制作可执行文件\n\
    无需每次浏览，使用 `go get`：\n```bash\ngo get github.com/your-username/hello\n```\n这会将工具移动到\
    \ `GOPATH/bin`。\n\n## 第三章：编写第一个程序\nGo 像什么样？如何运行用 Go 编写的程序？\n\n#### 欢迎来到\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main () {\n    fmt.Print(\"Welcome to the\
    \ world\\n\")\n}\n```\n将此放在名为 `hello` 的文件夹内名为 `helloworld.go` 的文件中。使用以下命令运行：\n\
    ```bash\ngo run helloworld.go\n```\n\n#### 逐行解释\n- `package main`: 每个 Go 文件必须属于一个包。`main`\
    \ 是编译器视为程序入口的特殊名称。\n- `import \"fmt\"`: 导入用于打印的标准库 `fmt`（格式）。\n- `func main()`:\
    \ 执行开始的主函数。\n- `fmt.Print(...)`: 将字符串打印到控制台。`\\n` 是换行符。\n\n### HelloHello (返回值)\n\
    如果你想看函数如何返回一个值：\n```go\npackage hello\n\nimport \"fmt\"\n\nfunc HelloHello() string\
    \ {\n    return \"Hello world!\"\n}\n```\n注意：函数名以大字母（大写）开头使其成为导出的（可以从其他包访问）。\n\
    \n## 第四章：规则\nGo 语言的设计旨在通过静态类型和快速编译来轻松完成工作。\n\n### 变量\nGo 中的变量在使用前声明。\n```go\n\
    var age int = 35\nage := 35 // 短变量声明\n```\n字符串是不可变的。\n\n### 数据类型\n- `string`:\
    \ 使用双引号 `\"\"`。使用反引号 ``` ``` 表示包含换行的原始字符串字面量。\n- `rune`: `int32` 的别名，代表 Unicode\
    \ 字符。\n- `float64`: 用于小数。\n- `complex128`: 用于复数。\n- `uint/byte`: 无符号整数。\n\n###\
    \ 数组与切片\n数组在编译时具有固定大小：\n```go\nvar a4 [4]int\nvar a3 = [3]int{1, 3, 5}\n```\n\
    切片是动态的且更常用：\n```go\ns3 = []int{4, 5, 9}\ns4 = make([]int, 4)\n```\n使用内置函数 `append`\
    \ 向切片添加元素：\n```go\ns := []int{1, 2, 3}\ns = append(s, 4, 5)\n```\n\n### 注释\n使用\
    \ `//` 单行注释，`/* ... */` 多行注释。\n\n## 第六章：创建后端\nGo 的开发始于 Google 工程师的一次实验。\n\n###\
    \ 创建 Web 服务器\n我们可以使用 `http` 包启动 Web 服务器。\n```go\npackage main\n\nimport (\n  \
    \  \"encoding/json\"\n    \"net/http\"\n    \"strings\"\n)\n\nfunc main() {\n\
    \    http.HandleFunc(\"/weather/\", func(w http.ResponseWriter, r *http.Request)\
    \ {\n        // ... 逻辑\n        w.Header().Set(\"Content-Type\", \"application/json;\
    \ charset=utf-8\")\n        json.NewEncoder(w).Encode(data)\n    })\n    http.ListenAndServe(\"\
    :8080\", nil)\n}\n```\n\n"
