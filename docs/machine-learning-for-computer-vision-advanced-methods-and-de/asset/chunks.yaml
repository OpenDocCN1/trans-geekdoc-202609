    accentuates: it is the driver''s duty to control the vehicle under all circumstances.


    For Autopilot to work, Tesla cars must be heavily equipped. Eight all encompassing
    cameras give them 360º visibility at a range of 250 meters.


    Ultrasonic sensors have been introduced to detect objects, as well as a radar
    that processes information about the encompassing environment. Thanks to all this,
    the cars are able to change their speed relying upon traffic conditions, brake
    when drawing nearer obstacles, maintain or change lanes, take a fork in the street,
    and park easily.


    Tesla''s Autopilot technology is another excellent example of the amazing effect
    computer vision has had on our most common daily activities.


    ## Microsoft''s InnerEye


    In the healthcare sector, InnerEye by Microsoft is an incredibly valuable apparatus
    that assists radiologists, oncologists, and specialists who work with radiology-based
    pictures. The primary goal of the tool is to accurately identify tumors among
    solid life systems in 3D images of cancerous.


    Based on computer vision and machine learning procedures, the innovation produces
    extremely nitty gritty 3D modelings of tumors. The above screenshot shows a total
    3D segmentation of a brain tumor created by InnerEye. In the event that you watch
    the whole video, you''ll see that the master controls the tool and guides it to
    perform the undertaking, which means that InnerEye goes about as an assistant.


    In radiation treatment, for instance, InnerEye results make it conceivable to
    direct radiation specifically at the target tumor while preserving imperative
    organs. These outcomes also help radiologists comprehend sequences of images and
    whether an infection is progressing, stable, or responding favorably to treatment,
    while taking into account the evolution of a tumor''s size, among other things.
    In this way, medical imaging becomes a means of following and estimating.


    ## Conclusion


    Computer vision is a famous topic in articles about new technology. An alternate
    way to deal with using information is what makes this technology extraordinary.
    Enormous amounts of information that we make daily, which some people think as
    a revel of our age, are really utilized for our benefit—the data can show PCs
    to see and understand objects. This innovation also demonstrates an important
    step that our development makes toward creating artificial insight that will be
    as complex as people.

    '
  trans: '

    强调：在任何情况下，控制车辆都是驾驶者的责任。


    为了让自动驾驶（Autopilot）运行，特斯拉汽车必须配备高性能设备。八个全方位摄像头提供了在 250 米范围内的 360º 视野。


    车辆还引入了超声波传感器来检测物体，并配备了用于处理周围环境信息的雷达。得益于这一切，汽车能够根据交通状况改变速度、在接近障碍物时刹车、保持或变换车道、在街道分叉处行驶，并轻松停车。


    特斯拉的自动驾驶技术是计算机视觉对我们最常见的日常活动产生巨大影响的另一个绝例。


    ## 微软 InnerEye


    在医疗领域，微软的 InnerEye 是一项极具价值的工具，协助放射科医生、肿瘤学家以及处理放射学图像的专家。该工具的主要目标是在癌症的 3D 图像中准确识别实体生命系统中的肿瘤。


    基于计算机视觉和机器学习程序，这项创新能够生成极其细致的肿瘤 3D 模型。上面的截图显示了由 InnerEye 创建的脑瘤总 3D 分割。如果你观看整个视频，你会发现主控控制工具并引导其执行任务，这意味着
    InnerEye 充当助手的角色。


    例如在放射治疗中，InnerEye 的结果使得将放射直接指向目标肿瘤同时保护重要器官成为可能。这些结果还帮助放射科医生理解图像序列，判断感染是正在进展、稳定还是对治疗反应良好，同时考虑到肿瘤大小的演变等因素。通过这种方式，医学影像变成了一种跟踪和评估的手段。


    ## 结论


    计算机视觉是新技术文章中的热门话题。处理信息的另一种方式使得这项技术变得与同凡。我们每天产生的海量信息（某些人认为是我们时代的启示）实际上正被用于造福人类——这些数据可以教会计算机看到并理解物体。这项创新也证明了我们在创造像人类一样复杂的人工智能方面所迈出的重要一步。

    '
