    “我们需要在流程的早期阶段纠正这些偏见，并重新思考我们的问题设定、假设以及数据收集实践，”弗吉尼亚大学计算机科学助理教授 Vincent Ordonez-Roman
    说道，他并未参与这些研究。“在计算机视觉领域，关于表征和刻板印象的传播存在着一些特定的挑战。像普林斯顿视觉 AI 实验室等的工作有助于阐明并引起计算机视觉社区对这些问题的关注，并提供了缓解这些问题的策略。”视觉
    AI 实验室的一项相关研究检查了防止计算机视觉模型学习可能反映偏见的虚假相关性的方法，例如，在女性的照片中过度预测“烹饪”等活动，或在男性的照片中过度预测“计算机编程”。视觉线索（如斑马是黑白相间的，或篮球运动员经常穿球衣等事实）有助于提高模型的准确性，因此，在避免问题相关性的同时开发出有效模型是该领域的一项重大挑战。在
    6 月份举行的虚拟国际计算机视觉与模式识别会议上展示的研究中，电气工程研究生学生 Zey Wang 和同事比较了四种缓解计算机视觉模型偏见的不同技术。他们发现，一种被称为对抗训练或“盲目公平”的流行技术损害了图像识别模型的整体性能。在对抗训练中，模型无法考虑有关保护变量的信息——在这项研究中，研究人员使用性别作为测试案例。另一种被称为领域无关训练或“感知公平”的方法在团队的分析中表现要好得多。


    “本质上，这意味着我们将为不同的性别设置不同的活动，是的，这种愿景将是取决于性别的，我们只需接受这一点，”Russ 说道。论文中概述的技术通过将偏见与其他视觉内容隔离开来考虑，缓解了偏见。“偏见问题如何真正加剧了情况是一个真正的问题，因为我们当然在数据本身中就能看到它，”Zey
    说道，“但在现实世界中，人类在意识到自身偏见的同时仍然能够做出良好的判断——计算机模型也可以做到。”


    ### 如何实现计算机视觉项目

    就像你考虑的每项创新一样，你都应该选择一种策略来实现计算机视觉。一个成功的计算机视觉创新取决于你的策略、资源和数据。你可以问自己一些问题，这些问题应该帮助你构建计算机视觉项目的策略。计算机视觉解决方案应该是降低成本还是增加成本（或两者兼顾），你应该定义是哪一个目标。只有这样，它才会对你的组织及其增长产生重大影响。你将如何衡量你的计算机视觉的成功？每个计算机视觉项目都是不同的，你需要定义一个对你的项目有意义且你能够衡量的指标。一旦设定了该指标，你就应该确保它能被业务人士和数据科学家共同所认可。


    ### 信息的访问性有保障吗？

    在启动计算机视觉倡议时，数据科学家需要能够方便地获取信息。他们需要与关键人员合作，可能来自不同的部门，例如 IT 部门。这些人人员需要用业务知识来支持项目，而内部官僚主义将是一个主要的限制因素。


    ### 你的组织正在收集正确的数据吗？

    计算机视觉算法并非魔法。它们需要数据才能工作，而且它们的优坏完全取决于你提供的数据。根据你的目标，有不同的方法和来源来收集正确的数据。无论如何，拥有的输入数据越多，你的计算机视觉模型表现良好的机会就越大。如果你对数据的数量和质量有怀疑，可以要求数据科学家帮助你评估数据集，并在必要时找到获取第三方数据的最佳方法。


    ### 你的组织正在以正确的格式收集数据吗？

