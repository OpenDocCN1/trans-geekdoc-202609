  trans: '

    对于相同的图像，分析师们在不同的图像中逐个向计算机展示了这些物体。实验表明，算法在学习相同或多样化关系时并没有问题，前提是它们不需要在同一张图片中同时看到这两个物体。


    塞尔（Serre）表示，在个体化物体时遇到的问题源于驱动这些算法的机器学习系统架构。这些算法使用卷积神经网络——这是一种连接的处理单元层，它们松散地模拟了大脑中的神经元网络。与大脑的一个关键区别在于，人工网络完全是“前馈”的——这意味着数据在网络层级之间是单向流动的。根据塞尔的说法，人类的视觉框架并不是这样运作的。


    “如果如果你观察我们自身视觉系统的生命机能，你会发现有很多重复的连接，数据从高层视觉区域流向低层视觉区域，然后又回来，”塞尔说道。虽然目前尚不清楚这些输入的具体作用是什么，但塞尔说，它们可能与我们关注视觉视野某些部分的能力并在脑海中对物体建立心理表征的能力有关。


    “人们可能会关注某一个物体，在工作记忆中构建一个与该物体绑定的特征表示，”塞尔说，“在那个时刻，他们会将注意力转移到另一个物体。当这两个物体在工作记忆中被提及时，你的视觉系统能够进行诸如‘相同’或‘独特’之类的比较。”


    塞尔和他的伙伴们理论认为，计算机无法进行这种操作的原因是，前馈神经网络没有考虑这种物体个体化和心理描绘所需要的循环处理。塞尔表示，要让计算机视觉更智能，可能需要更紧密地模拟人类视觉处理循环特性的神经网络。


    ## 业务用例


    组织正越来越多地采用 PC（计算机）视觉应用来回答业务问题或升级其产品。它们现在可能已经是你日常生活的一部分，而你甚至没有察觉。以下是一些主流的用例。


    ### 视觉搜索引擎


    视觉搜索创新于 2001 年随着 Google 图片（Google Images）开始面向大众。视觉搜索能够找回与内容匹配的图片。搜索关键词是一个典型的用例，但有时人们会拍照并要求找到相应的图像。在某些情况下，可以指定更详细的搜索，例如在夏季拍摄的海滨滩图像，且至少包含十张。目前存在许多视觉搜索，既有以今天可用网站的形式存在，也有作为多功能应用或功能的类型存在。其他值得关注的视觉搜索目标，例如专注于搜索的
    TinEye，以及允许通过广泛范围查找文本的 Picsearch。在移动应用领域，提供视觉搜索技术已巩固为一种标准。实现方式包括 Google（后被 Google
    Lens 取代），它可以用于从图片中获取详细数据。例如，你可以给你的猫拍照，并获取有关其品种的信息，或者如果你在博物馆里，应用程序可以提供有关某些艺术品的信息。在电子商务市场，Pinterest
    提供了 Pinterest。如果你需要根据你的衣橱来穿搭（例如，你需要找到如何穿戴你喜欢的牛仔裤或西装外套），你可以对该物品拍照，Pinterest 将返回包含你最终可以购买的可行衣物在内的穿搭建议。在线购物的视觉搜索是近年来增长最快的趋势之一。最后，视觉搜索的一个更高级的用例是视觉问答框架。可以在这篇《视觉问答导论：数据集、方法与评估》中阅读更多内容。


    ### Facebook 的人脸识别


    尽管能够为了自动对焦而进行脸检测的相机自 2000 年代中期一直存在，但人脸识别领域近年来取得了瞩目的成果。最普通（且具有争议）的应用可能是识别图像或视频中的人物。这在安全系统中尤其如此，但在社交领域中通过为脸部添加滤镜时也发挥了作用，使其能够感知外貌。人脸识别还用于更高级的方式，例如
    Facebook。这是改进人脸识别的目标。

    '
