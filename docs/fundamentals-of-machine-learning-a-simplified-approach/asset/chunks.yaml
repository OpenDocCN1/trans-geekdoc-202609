    ![](img/image011.png)步骤 2：根据属性分割数据集


    假设我们根据“收入”属性对数据进行分割，该属性有两个可能的值：低和高。


    *   对于收入 = 低，我们有以下实例：{ (30, 低, 否), (40, 低, 否), (50, 低, 是) }。


    *   对于收入 = 高，我们有：{ (30, 高, 是), (40, 高, 是), (50, 高, 是) }。


    步骤 3：计算子集的熵


    ![](img/image028.png)步骤 4：计算熵的加权和


    ![](img/image027.png)


    因此，根据“收入”属性对数据集进行分割的信息增益为 0.459。


    信息增益是决策树学习中的强大工具。它帮助识别能够将数据分割成尽可能均匀子集的特征。通过计算每个特征的信息增益，决策树算法可以在构建树的每一步中做出明智的决策，选择使用哪个属性进行分割。信息增益最高的属性被选为分割属性，从而构建出高效且准确的决策树模型。


    ID-3 算法


    ID3（Iterative Dichotomiser 3）是一种广泛使用的决策树算法，它通过递归地根据信息增益最高的属性对数据进行分割来构建决策树。其目标是根据输入特征（属性）预测目标变量（类别）。ID3
    由 Ross Quinlan 于 1986 年提出，仍是决策树学习的基石。


    ID-3 算法中的关键概念


    ID3 算法的核心思想是通过在每个节点选择信息增益最高的属性来构建树。该过程会在数据子集上递归进行，直到数据被正确分类或满足停止条件为止。


    ID-3 算法的步骤


    1.  选择最佳分割属性：


    对于树中的每个节点，算法选择能最大化信息增益的属性。该属性用于将数据分割成子集。


    1.  分割数据：


    在选择最佳属性后，数据集根据该属性的可能值进行划分。


    1.  递归重复：


    对于每个子集，算法递归地应用相同的过程：选择最佳属性、分割数据，并继续此过程。递归继续进行，直到满足以下任一停止条件：


    *   子集中所有实例属于同一类别。


    *   没有更多属性可用于分割（或所有属性均已使用）。


    *   达到预定义的最大树深度。


    1.  创建叶节点：


    当满足停止条件（例如，子集中的所有数据点属于同一类别）时，算法创建叶节点，并将该节点中的数据点的类别作为预测值。


    ID-3 算法的详细说明


    1.  初始步骤：从根节点开始：


    决策树的根节点使用整个数据集创建。算法选择能最大化信息增益的属性，用于在根节点处分割数据。


    1.  属性选择：


    对于数据集中的每个属性，计算其信息增益。信息增益最高的属性被选中，用于分割数据。


    信息增益是衡量在根据属性分割数据后，不确定性（熵）减少的指标。


    1.  数据分割：


    数据集根据选定属性的值进行划分。如果属性有多个可能值（例如，二元特征的“是”和“否”），则相应地划分数据，为每个值创建子节点。


    1.  递归过程：


    算法对每个子节点（数据子集）递归应用相同的过程。对于每个子集，计算各属性的信息增益，并选择最佳属性进行分割。


    1.  停止条件：


    递归继续进行，直到满足以下任一条件：


    *   子节点中的所有数据点属于同一类别（纯节点）。


    *   没有更多属性可用于分割。


    *   达到预定义的停止标准（如最大树深度或节点中最小数据点数）。


    1.  创建叶节点：


    当递归停止时，创建叶节点，并将该节点中数据点的类别作为预测值。


    ID-3 算法示例


    考虑一个小数据集，我们希望根据“年龄”和“收入”属性预测某人是否购买产品：


    | 年龄 | 收入 | 购买产品（目标） |

    | --- | --- | --- |

    | 30 | 低 | 否 |

    | 30 | 高 | 是 |

    | 40 | 低 | 否 |

    | 40 | 高 | 是 |

    | 50 | 低 | 是 |

    | 50 | 高 | 是 |


    步骤 1：计算每个属性的信息增益


    原始数据集的熵：目标变量有 2 个类别：“否”和“是”。熵是衡量整个数据集不确定性的指标。


    根据属性“年龄”分割数据后的熵：根据“年龄”属性分割数据：


    *   年龄 = 30：{ (30, 低, 否), (30, 高, 是) }


    *   年龄 = 40：{ (40, 低, 否), (40, 高, 是) }


    *   年龄 = 50：{ (50, 低, 是), (50, 高, 是) }


    计算每个子集的熵，并使用加权和计算信息增益。


    根据属性“收入”分割数据后的熵：根据“收入”属性分割数据：


    *   收入 = 低：{ (30, 低, 否), (40, 低, 否), (50, 低, 是) }


    *   收入 = 高：{ (30, 高, 是), (40, 高, 是), (50, 高, 是) }


    同样，计算每个子集的熵，并计算加权和。


    步骤 2：选择信息增益最高的属性


    信息增益最高的属性被选为根节点的第一个属性。该过程在子节点上重复，直到满足停止条件。


    ID-3 算法的优势


    1.  简单且易于理解：ID3 实现和理解简单，能够以清晰且可解释的方式构建决策树。


    2.  适用于小数据集：对于属性数量较少的小数据集，ID3 可以快速生成决策树。


    ID-3 算法的缺点


    1.  过拟合：如果树深度过大，ID3 可能会过拟合训练数据，尤其是当数据中包含噪声时。过拟合是模型学习数据中的噪声而非实际模式的现象。


    2.  倾向于值较多的属性：该算法倾向于选择可能值较多的属性，因为这些属性更有可能具有更高的信息增益。


    3.  无法直接处理数值数据：ID3 更适合处理类别数据。数值属性需要在应用 ID3 之前进行离散化处理。


    4.  贪心策略：ID3 采用贪心策略，在每一步都做出局部最优选择，而不考虑全局最优解。


    ID-3 算法是一种基于最大化信息增益的决策树学习算法。它在每个节点使用信息增益最高的属性来分割数据，因此对于分类任务来说是一个高效的算法。虽然它简单且易于实现，但可能会出现过拟合和对某些特征的偏见。了解其优势和局限性对于在实际数据集中应用它至关重要。


    决策树学习中的问题


    决策树学习是分类和回归任务中流行且可解释的方法。然而，在使用决策树时可能会遇到一些问题和挑战。这些问题包括过拟合、偏见以及处理各种类型数据等。以下是一些关键问题：


    1.  过拟合


