  trans: "\n| ![](img/chapter_title_corner_decoration_left.png)  ||  || ![](img/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![](img/chapter_title_above.png) \n\n# 66)14. 监督学习与无监督学习的区别是什么？\n\
    \n![](img/chapter_title_below.png) \n\n 监督学习 - 该模型从标记数据中学习，并以预测为输出  \n\n 无监督学习\
    \ - 该模型使用未标记的输入数据，并允许算法在没有指导的情况下对该信息进行操作。  \n\n| ![](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](img/chapter_title_corner_decoration_right.png)  |\n\n| --- | ---\
    \ | --- |\n\n![](img/chapter_title_above.png) \n\n# 67). 何时会使用分类而非回归？\n\n分类用于你的目标是类别型时，而回归用于目标变量是连续时。分类和回归都属于监督\
    \ [机器学习算法](https://www.simplilearn.com/10-algorithms-machine-learning-engineers-need-to-know-article\
    \ \"机器学习算法\")。\n\n分类问题的示例包括：\n\n 预测是或否  \n\n 估计性别  \n\n 动物的品种  \n\n 颜色的类型\
    \  \n\n回归问题的示例包括：\n\n 估计产品的销售额和价格  \n\n 预测团队的得分  \n\n 预测降雨量  \n\n| ![](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](img/chapter_title_corner_decoration_right.png)  |\n\n| --- | ---\
    \ | --- |\n\n![](img/chapter_title_above.png) \n\n# 68). 什么是过拟合，以及如何避免它？  \n\n\
    ![](img/chapter_title_below.png)  \n\n过拟合是指模型学习训练集过于彻底，将训练数据中的随机波动视为概念。这些波动影响模型的泛化能力，并且不适用于新数据。\
    \  \n\n当模型接收训练数据时，它会显示 100%的准确率——技术上是一个略小的损失。但是，当我们使用测试数据时，可能会出现错误并低效。这种情况被称为过拟合。\
    \  \n\n避免过拟合的多种方法包括：\n\n 正则化。它在目标函数中加入对特征的成本项  \n\n 构建简单模型。通过减少变量和参数，可以降低方差\
    \  \n\n 如 k 折叠交叉验证等交叉验证方法也可以使用  \n\n如果某些模型参数容易导致过拟合，可以使用 LASSO 等正则化技术，对这些参数进行惩罚。\
    \  \n\n基础机器学习：简化方法\n"
