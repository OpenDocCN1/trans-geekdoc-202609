    In supervised learning, we train a model to learn the relationship between input
    data and output data. We need to have labeled data to be able to do supervised
    learning.


    With unsupervised learning, we only have unlabeled data. The model learns a representation
    of the data. Unsupervised learning is frequently used to initialize the parameters
    of the model when we have a lot of unlabeled data and a small fraction of labeled
    data. We first train an unsupervised model and, after that, we use the weights
    of the model to train a supervised model.


    In reinforcement learning, the model has some input data and a reward depending
    on the output of the model. The model learns a policy that maximizes the reward.
    Reinforcement learning has been applied successfully to strategic games such as
    Go and even classic Atari video games.


