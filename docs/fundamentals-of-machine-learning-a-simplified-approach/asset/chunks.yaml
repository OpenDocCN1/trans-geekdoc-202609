    \ similar users or items based on their preferences or characteristics.\n\n* \
    \  Anomaly Detection: In anomaly detection, k-NN can be used to detect instances\
    \ that are far from their nearest neighbors, indicating they are outliers.\n\n\
    *   Medical Diagnosis: k-NN is often applied in medical diagnostics for predicting\
    \ diseases based on patterns in patient data.\n\n*   Text Classification: In natural\
    \ language processing, k-NN is used to classify text based on the similarity of\
    \ documents, such as in spam filtering or sentiment analysis.\n\nk-Nearest Neighbors\
    \ is a simple yet effective algorithm that is widely used for both classification\
    \ and regression tasks. It is highly intuitive and can work well for problems\
    \ with complex decision boundaries. However, its performance can be hindered by\
    \ large datasets, irrelevant features, and the choice of distance metric. Fine-tuning\
    \ k and selecting the right distance measure are crucial for achieving good performance.\n\
    \n# Locally Weighted Regression (LWR)\nLocally Weighted Regression (LWR) is a\
    \ type of regression model that focuses on fitting a model to a subset of the\
    \ data that is locally close to the query point, rather than fitting a global\
    \ model across the entire dataset. In essence, it is a non-parametric regression\
    \ method, meaning that it does not assume a specific form for the underlying data\
    \ distribution. Instead, LWR builds a regression model that adapts to the local\
    \ structure of the data.\n\nLWR is particularly useful when dealing with non-linear\
    \ relationships between the features and the target variable, where global linear\
    \ models like linear regression may not perform well.\n\n## How Locally Weighted\
    \ Regression Works\n1.  Weighting the Training Data:\n\nWhen a new data point\
    \ (query point) needs to be predicted, LWR assigns weights to all the training\
    \ data points based on their proximity to the query point. These weights decrease\
    \ with distance from the query point, so that points closer to the query have\
    \ a greater influence on the prediction.\n\n1.  Local Fitting:\n\nA regression\
    \ model (often linear regression) is then fitted to the weighted set of data points.\
    \ The regression model focuses more on the nearest neighbors of the query point\
    \ because of the higher weights assigned to them.\n\n1.  Prediction:\n\nOnce the\
    \ local model is fitted, it makes a prediction for the query point based on the\
    \ fitted model. The prediction will primarily depend on the data points that are\
    \ closest to the query point due to the higher weights assigned to them.\n\n1.\
    \  Kernel Function:\n\nThe weights assigned to each training point are typically\
    \ computed using a kernel function. The kernel function calculates the weight\
    \ based on the distance between the training instance and the query point. Commonly\
    \ used kernel functions include the Gaussian kernel or Epanechnikov kernel, which\
    \ assign higher weights to closer points and decrease the weight as the distance\
    \ increases.\n\nA typical kernel function for LWR is:\n\n``` \nw(x)=exp⁡(−(x−x0)22σ2)\n\
    ```\n\nwhere:\n\n*   `x` is a training point,\n\n*   `x0​` is the query point,\n\
    \n*   `σ` is a parameter that controls the width of the kernel.\n\n1.  Weighted\
    \ Linear Regression:\n\nOnce the weights are assigned, a weighted version of linear\
    \ regression is used to fit the local model. In weighted linear regression, the\
    \ objective is to minimize the weighted sum of squared errors:\n\n``` \nmin θ∑iw(xi)(yi−y^i)2\n\
    ```\n"
  trans: "\n# 懒惰学习\n由于训练阶段没有显式学习模型，所有计算都会推迟到查询阶段进行。这意味着训练阶段相对快速，但预测阶段可能会很慢，尤其是在大数据集上。\n\
    \n# 实例基于\nk-NN 是一种实例基于的学习算法，这意味着预测是基于训练集中存储的实例来进行的。\n\n## k-NN 中的距离度量\nk-NN 的性能很大程度上取决于用于衡量相似性的距离度量。距离度量的选择会显著影响算法的表现，尤其是在数据高维或包含多种特征类型时。\n\
    \n### 欧氏距离\n最常用的距离度量，它计算为特征空间中两点之间的直线距离：\n\n![](img/image023.png)\n\n其中 `ppp`\
    \ 和 `q` 是 `nnn` 维空间中的两个点，`pi​` 和 `qi​` 分别是两点的特征值。\n\n### 曼哈顿距离（L1 规范）\n曼哈顿距离将两点之间的距离定义为其坐标绝对差之和：\n\
    \n`d(p,q)= ![](img/image018.png)`  \n\n这种距离常用于数据以网格形式表示的情况（例如某些图像处理任务）。\n\n###\
    \ 威斯廷格距离\n这是欧氏距离和曼哈顿距离的推广。公式为：\n\n![](img/image026.png)\n\n其中 `p` 是控制距离类型的参数。当\
    \ `p=2` 时，它是欧氏距离；当 `p=1` 时，它是曼哈顿距离。\n\n### 鲁棒相似性\n在文本挖掘和其他特征向量稀疏的领域中，余弦相似性常被用作距离度量：\n\
    \n![](img/image032.png)\n\n它测量两个向量之间的夹角的余弦值，通常用于判断两个向量在方向上的相似性，而非大小。\n\n## 选择\
    \ k 在 k-NN 中\nk 的选择对 k-NN 的性能至关重要：\n\n*   小 k（例如 k = 1）：模型对噪声敏感，容易过拟合，因为它仅基于最近的一\
    \ neighbors 进行预测。\n\n*   大 k：较大的 k 值使模型更具噪声鲁棒性，但可能导致欠拟合，因为它平滑了决策边界，可能忽略重要的局部模式。\n\
    \n为了找到最佳的 k 值，常用交叉验证的方法。通过在训练数据的不同子集上测试模型，可以选择表现最佳的 k 值。\n\n## k-NN 的优势\n1.  简单直观：k-NN\
    \ 易于理解和实现，是基本分类和回归任务的 excellent 选择。\n\n2.  无训练阶段：由于 k-NN 不需要模型训练，其学习时间在计算上相对便宜。计算成本推迟到预测阶段。\n\
    \n3.  灵活性：k-NN 可用于分类和回归任务，并能轻松处理多类问题。\n\n4.  适合复杂数据：k-NN 可以建模复杂的决策边界，并处理非线性数据关系。\n\
    \n## k-NN 的缺点\n1.  预测阶段计算开销大：\n\n由于算法在预测时需要计算查询点与所有训练点的距离，当数据集很大且特征数量多时，性能会显著下降。\n\
    \n1.  内存消耗大：\n\nk-NN 存储所有训练数据，因此对于大数据集可能非常内存密集。\n\n1.  对无关特征敏感：\n\nk-NN 受到“维度诅咒”的影响，即特征数量增多导致距离度量退化。当数据包含许多无关或冗余特征时，会影响算法性能。\n\
    \n1.  对噪声数据敏感：\n\n由于 k-NN 依赖于实例的 proximity，噪声数据或离群点会显著影响预测。大量噪声实例会严重降低性能。\n\n\
    1.  选择合适的距离度量：\n\nk-NN 的性能高度依赖于距离度量的选择。选择不当的度量会导致预测效果差。\n\n## k-NN 的应用\n*   图像分类：k-NN\
    \ 常用于图像识别任务，其中图像被表示为特征向量，算法将新图像与训练集中的标记图像进行比较。\n\n*   推荐系统：k-NN 用于协同过滤，通过找到相似用户或物品来推荐产品或服务。\n\
    \n*   异常检测：在异常检测中，k-NN 可以用于检测与最近邻偏离的实例，从而识别出异常。\n\n*   医疗诊断：k-NN 常用于根据患者数据中的模式预测疾病。\n\
    \n*   文本分类：在自然语言处理中，k-NN 用于根据文档相似性对文本进行分类，如垃圾邮件过滤或情感分析。\n\nk-Nearest Neighbors\
    \ 是一种简单而有效的算法，广泛用于分类和回归任务。它直观易懂，能够很好地处理复杂的决策边界。然而，其性能可能受到大数据集、无关特征以及距离度量选择的影响。微调\
    \ k 值并选择合适的距离度量是实现良好性能的关键。\n\n# 局部加权回归（LWR）\nLocally Weighted Regression (LWR)\
    \ 是一种回归模型，它专注于在查询点附近的数据子集上进行拟合，而不是在整个数据集上拟合全局模型。因此，它是一种非参数回归方法，不假设底层数据分布的具体形式。相反，LWR\
    \ 构建一个能够适应数据局部结构的回归模型。\n\nLWR 特别适用于特征与目标变量之间存在非线性关系的情况，而全局线性模型（如线性回归）在这些情况下表现不佳。\n\
    \n## 局部加权回归的工作原理\n1.  加权训练数据：\n\n当需要预测一个新数据点（查询点）时，LWR 会根据其与训练数据点的距离为所有训练数据点分配权重。权重随距离增加而减小，因此更靠近查询点的点对预测的影响更大。\n\
    \n1.  局部拟合：\n\n随后在加权后的数据集上拟合回归模型（通常是线性回归）。由于对最近邻赋予更高权重，拟合模型更关注与查询点最近的数据点。\n\n\
    1.  预测：\n\n在拟合局部模型后，它会基于拟合模型对查询点进行预测。预测结果主要取决于与查询点最近的数据点，因为它们被赋予了更高的权重。\n\n1.\
    \  核函数：\n\n分配给每个训练点的权重通常通过核函数计算。核函数根据训练实例与查询点之间的距离计算权重，常用的核函数包括高斯核或 Epanechnikov\
    \ 核，它们为更接近的点分配更高权重，距离越远权重递减。\n\nLWR 的一个典型核函数为：\n\n``` \nw(x)=exp⁡(−(x−x0)22σ2)\n\
    ```\n\n其中：\n\n*   `x` 是一个训练点，\n\n*   `x0​` 是查询点，\n\n*   `σ` 是控制核宽度的参数。\n\n1. \
    \ 加权线性回归：\n\n在分配权重后，使用加权线性回归来拟合局部模型。加权线性回归的目标是最小化加权平方误差之和：\n\n``` \nmin θ∑iw(xi)(yi−y^i)2\n\
    ```\n\n"
