    \ frameworks like TensorFlow, Keras, scikit-learn, and PyTorch.\n\n9\\. Career\
    \ Paths\n\nData Science:\n\nRoles include Data Scientist, Data Analyst, Business\
    \ Intelligence Analyst, and Data Engineer.\n\nFocus is often on analyzing data,\
    \ developing reports, visualizing trends, and driving data-driven decisions for\
    \ organizations.\n\nMachine Learning:\n\nRoles include Machine Learning Engineer,\
    \ AI Researcher, Data Scientist (with a focus on ML), and Deep Learning Engineer.\n\
    \nFocus is on building and deploying machine learning models, optimizing algorithms,\
    \ and solving predictive and decision-making problems.\n\n10\\. Interrelation\n\
    \nWhile data science and machine learning are distinct, they are deeply intertwined.\
    \ Machine learning is one of the many tools within the data science toolbox. Data\
    \ science uses machine learning techniques to extract insights and build predictive\
    \ models, but it also relies on traditional statistical methods, data visualization,\
    \ and reporting to provide a holistic view of the data.\n\nIn essence, Data Science\
    \ is a broader field focused on working with data to extract insights and inform\
    \ decisions, while Machine Learning is a specialized subfield within Data Science\
    \ that deals with the development of algorithms that learn from data to make predictions\
    \ or decisions. Data science encompasses a wider range of tasks beyond machine\
    \ learning, including data wrangling, exploratory data analysis, and statistical\
    \ modeling, while machine learning focuses on creating models that can learn from\
    \ and predict outcomes based on data.\n\nExercise\n\n1.  Why we need machine learning\
    \ and how it is different from traditional programming approaches?\n\n2.  Present\
    \ a scenario where you will prefer Support vector machine (SVM) over the other\
    \ machine learning algorithm. Justify your preference.\n\n3.  Define Machine Learning.\
    \ Discuss with examples some useful applications of machine learning.\n\n4.  What\
    \ are supervised, semi-supervised and unsupervised learning?\n\n5.  What do you\
    \ mean by a well posed learning problem? Explain the important features that are\
    \ required to well define a learning problem.\n\nUnit II\n\nREGRESSION\n\nLINEAR\
    \ REGRESSION AND THE LOGISTIC REGRESSION\n\nLinear regression and logistic regression\
    \ are both widely used models in statistics and machine learning. However, they\
    \ are used for different types of prediction problems and have different underlying\
    \ assumptions and applications. Here's a comparison between the two:\n\n1\\. Problem\
    \ Type\n\nLinear Regression:\n\nObjective: Used for regression tasks, where the\
    \ goal is to predict a continuous numerical value.\n\nExample: Predicting house\
    \ prices, temperature, or sales amounts.\n\nLogistic Regression:\n\nObjective:\
    \ Used for classification tasks, where the goal is to predict a categorical outcome,\
    \ typically a binary outcome (yes/no, 0/1).\n\nExample: Predicting whether an\
    \ email is spam (1) or not (0), predicting if a customer will buy a product (1)\
    \ or not (0).\n\n2\\. Output (Dependent Variable)\n\nLinear Regression:\n\nThe\
    \ output is a continuous variable. It predicts a value that can range from negative\
    \ to positive infinity.\n\nExample: Predicting the price of a house based on its\
    \ features (size, number of rooms, etc.).\n\nLogistic Regression:\n\nThe output\
    \ is a probability that lies between 0 and 1. It predicts the likelihood of a\
    \ certain class or event happening.\n\nExample: Predicting the probability that\
    \ a customer will purchase a product.\n\n3\\. Model Equation\n\nLinear Regression:\n\
    \nThe model assumes a linear relationship between the dependent variable Y and\
    \ the independent variables X1,X2,...,Xn\n\nThe equation for a simple linear regression\
    \ is: \n\nY=β0+β1X1+β2X2+⋯+βnXn+ϵ\n\nwhere:\n\n*   Y is the dependent variable.\n\
    \n*   Xi​ are the independent variables.\n\n*   β0,β1,...,βn​ are the model coefficients.\n\
    \n*   ϵ is the error term.\n\nLogistic Regression:\n\nThe logistic regression\
    \ model uses the logistic function (also called the sigmoid function) to model\
    \ the probability of a binary outcome. The equation is:\n\n![](d2d_images/image040.png)\n\
    \nWhere:\n\n*   P(Y=1∣X) is the probability that the dependent variable Y equals\
    \ 1 given the independent variables X.\n\n*   The output is constrained between\
    \ 0 and 1 due to the sigmoid function.\n\n4\\. Assumptions\n\nLinear Regression:\n\
    \nLinearity: The relationship between the dependent and independent variables\
    \ is linear.\n\nHomoscedasticity: The variance of the residuals (errors) should\
    \ be constant across all levels of the independent variables.\n\nIndependence\
    \ of errors: The residuals should be independent of each other.\n\nNormality:\
    \ The residuals should be approximately normally distributed for valid statistical\
    \ inference.\n\nLogistic Regression:\n\nLinearity of the log-odds: The log-odds\
    \ of the probability are linearly related to the independent variables.\n\nIndependence:\
    \ The observations must be independent.\n\nNo multicollinearity: The independent\
    \ variables should not be highly correlated with each other.\n\nLarge sample size:\
    \ Logistic regression performs better with a large sample size to ensure stable\
    \ coefficient estimates.\n\n5\\. Error Measurement\n\nLinear Regression:\n\nThe\
    \ error is typically measured using Mean Squared Error (MSE) or Root Mean Squared\
    \ Error (RMSE). These metrics represent the average squared difference between\
    \ the predicted and actual values.\n\nLogistic Regression:\n\nThe error is measured\
    \ using Log Loss (also called Binary Cross-Entropy), which measures the performance\
    \ of a classification model whose output is a probability value between 0 and\
    \ 1.\n\nLog Loss is calculated as: \n\n![](d2d_images/image035.png)\n\nWhere:\n\
    \n*   y is the actual label (0 or 1).\n\n*   p^​ is the predicted probability\
    \ for the positive class (1).\n\n6\\. Interpretation of Coefficients\n\nLinear\
    \ Regression:\n\nThe coefficients βi​ represent the change in the dependent variable\
    \ Y for a one-unit change in the corresponding predictor Xi​, holding other variables\
    \ constant.\n\nExample: Ifβ1​=2, it means that for every 1-unit increase in X1​,\
    \ Y will increase by 2 units.\n\nLogistic Regression:\n\nThe coefficients βi​\
    \ represent the change in the log-odds of the probability of the dependent variable\
    \ being 1 for a one-unit change in the corresponding predictor Xi​, holding other\
    \ variables constant.\n\nThe odds ratio can be interpreted as: Odds Ratio=eβi​\n\
    \nExample: If β1=0.5, then the odds of the outcome being 1 (e.g., success) increase\
    \ by a factor of e^(0.5)≈1. for each one-unit increase in X1​.\n\n7\\. Applications\n\
    \nLinear Regression:\n\nPredicting continuous outcomes such as sales numbers,\
    \ stock prices, temperature, or income based on various factors.\n\nExample: Predicting\
    \ a person's weight based on their height and age.\n\nLogistic Regression:\n\n\
    Predicting binary outcomes such as whether a customer will buy a product (yes/no),\
    \ whether an email is spam (spam/not spam), or whether a patient has a particular\
    \ disease (yes/no).\n\nExample: Predicting if a patient will develop diabetes\
    \ based on factors like age, weight, and lifestyle.\n\n8\\. Performance Evaluation\n\
    \nLinear Regression:\n\nR-squared: Indicates how well the independent variables\
    \ explain the variance in the dependent variable. Higher values (closer to 1)\
    \ indicate a better fit.\n\nAdjusted R-squared: Takes into account the number\
    \ of predictors in the model, useful when comparing models with different numbers\
    \ of predictors.\n\nLogistic Regression:\n\nAccuracy: The proportion of correct\
    \ predictions (True Positives + True Negatives) to total predictions.\n\nConfusion\
    \ Matrix: Helps to assess the number of true positives, true negatives, false\
    \ positives, and false negatives.\n\nPrecision, Recall, F1-score: Measures used\
    \ to evaluate the model performance, especially in imbalanced datasets.\n\nROC\
    \ Curve and AUC (Area Under Curve): Measures the trade-off between true positive\
    \ rate (sensitivity) and false positive rate (1-specificity).\n\n9\\. Model Complexity\n\
    \nLinear Regression:\n\nSimpler model with fewer assumptions (linear relationships)."
