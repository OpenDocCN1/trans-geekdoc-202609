    Exercise


    1.  Explain feature selection and feature extraction method for dimensionality
    reduction.


    2.  Explain the procedure for the computation of the principal components of the data


    ## Important SRC referential Questions


    #### 1) What’s the trade-off between bias and variance?


    If our model is too simple and has very few parameters then it may have high bias
    and low variance. On the other hand if our model has large number of parameters
    then it’s going to have high variance and low bias. So we need to find the right/good
    balance without over fitting and under fitting the data.


    #### 2) What is gradient descent?


    Gradient descent is an optimization algorithm used to find the values of parameters
    (coefficients) of a function (f) that minimizes a cost function (cost).


    Gradient descent is best used when the parameters cannot be calculated analytically
    (e.g. using linear algebra) and must be searched for by an optimization algorithm.


    #### 3) Explain over- and under-fitting and how to combat them?


    ML/DL models essentially learn a relationship between its given inputs (called
    training features) and objective outputs (called labels). Regardless of the quality
    of the learned relation (function), its performance on a test set (a collection
    of data different from the training input) is subject to investigation.


    Most ML/DL models have trainable parameters which will be learned to build that
    input-output relationship. Based on the number of parameters each model has, they
    can be sorted into more flexible (more parameters) to less flexible(less parameters).


    The problem of under fitting arises when the flexibility of a model (its number
    of parameters) is not adequate to capture the underlying pattern in a training
    dataset. Over fitting, on the other hand, arises when the model is too flexible
    to the underlying pattern. In the later case it is said that the model has “memorized”
    the training data.


    An example of under fitting is estimating a second order polynomial (quadratic
    function) with a first order polynomial (a simple line). Similarly, estimating
    a line with a 10th order polynomial would be an example of over fitting.


    #### 4) How do you combat the curse of dimensionality?


      Feature Selection(manual or via statistical methods)


      Principal Component Analysis (PCA)


      Multidimensional Scaling


      Locally linear embedding


    #### 5) What is regularization, why do we use it, and give some examples of common
    methods?


    A technique that discourages learning a more complex or flexible model, so as
    to avoid the risk of over fitting. Examples


      Ridge (L2 norm)


      Lasso (L1 norm)


    The obvious disadvantage of ridge regression, is model interpretability. It will
    shrink the coefficients for least important predictors, very close to zero. But
    it will never make them exactly zero. In other words, the final model will include
    all predictors. However, in the case of the lasso, the L1 penalty has the effect
    of forcing some of the coefficient estimates to be exactly equal to zero when
    the tuning parameter λ is sufficiently large. Therefore, the lasso method also
    performs variable selection and is said to yield sparse models.


    #### 6) Explain Principal Component Analysis (PCA)?


    Principal Component Analysis (PCA) is a dimensionality reduction technique used
    in machine learning to reduce the number of features in a dataset while retaining
    as much information as possible. It works by identifying the directions (principal
    components) in which the data varies the most, and projecting the data onto a
    lower-dimensional subspace along these directions.


    #### 7) Why is ReLU better and more often used than Sigmoid in Neural Networks?


      Computation Efficiency: As ReLU is a simple threshold the forward and backward
    path will be faster.


      Reduced Likelihood of Vanishing Gradient: Gradient of ReLU is 1 for positive
    values and 0 for negative values while Sigmoid activation saturates (gradients
    close to 0) quickly with slightly higher or lower inputs leading to vanishing
    gradients.


      Sparsity: Sparsity happens when the input of ReLU is negative. This means fewer
    neurons are firing (sparse activation) and the network is lighter.


    #### 8) Given stride S and kernel sizes for each layer of a (1-dimensional) CNN,
    create a function to compute the receptive field of a particular node in the network.
    This is just finding how many input nodes actually connect through to a neuron
    in a CNN.


    The receptive field is defined portion of space within inputs that will be used
    during an operation to generate an output.


    Considering a CNN filter of size k, the receptive field of a peculiar layer is
    only the number of input used by the filter, in this case k, multiplied by the
    dimension of the input that is not being reduced by the convolutionnal filter
    a. This results in a receptive field of k\*a.'
