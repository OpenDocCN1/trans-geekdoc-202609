    \ of the decision boundary.\n\nUse Case:\n\n*   Scenarios where relationships\
    \ between features are polynomial in nature.\n\n1.3. Gaussian Kernel (Radial Basis\
    \ Function, RBF Kernel)\n\nA widely used kernel that maps data into an infinite-dimensional\
