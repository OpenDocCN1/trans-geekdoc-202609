    \ supervised learning.\n\n    *   **Centers:** The centers of the radial basis\
    \ functions are usually determined by clustering methods like k-means or selected\
    \ from the training data points.\n\n    *   **Widths/Spreads (`σ\\\\sigmaσ`):**\
    \ The width or spread of the Gaussian function (or other RBF types) determines\
    \ how sensitive the neuron is to the input. A smaller width makes the neuron respond\
    \ more narrowly to a specific region in the input space, while a larger width\
    \ makes the neuron respond to a broader range of inputs.\n\n    *   **Weights:**\
    \ The weights between the hidden and output layers are typically learned using\
    \ a linear method, such as least squares or gradient descent.\n\n2.  **Prediction\
    \ Phase:**\n\n    Once the network is trained, new input data is passed through\
    \ the input layer. The hidden layer computes the similarity between the input\
    \ data and the centers of the radial basis functions. The output layer then computes\
    \ the final prediction as a weighted sum of the outputs from the hidden layer\
    \ neurons.\n\n**Key Characteristics of Radial Basis Function Networks**\n\n1.\
    \  **Non-linear Mapping:**\n\n    RBFNs are capable of modeling complex, non-linear\
    \ relationships by applying the radial basis functions to the input data. These\
    \ functions allow the network to approximate any continuous function.\n\n2.  **Local\
    \ Response:**\n\n    The output of each neuron in the hidden layer is based on\
    \ the distance between the input and the neuron’s center. Neurons that are closer\
    \ to the input will have a higher response, making RBFNs sensitive to the local\
    \ structure of the data.\n\n3.  **Flexibility:**\n"
  trans: "\nwhere `w(xi)w(x_i)w(xi​)` is the weight for the iii-th training instance,\
    \ and `y^i\\\\hat{y}\\_iy^​i​` is the predicted value for the iii-th training\
    \ instance based on the parameters `θ\\\\thetaθ`.\n\n**Locally Weighted Regression\
    \ (LWR) 的主要特征**\n\n1.  **非参数性：**\n\n    LWR 不假设输入特征与输出之间的关系具有特定形式。它通过局部建模数据，能够比线性回归等参数模型更有效地处理复杂的非线性关系。\n\
    \n2.  **局部聚焦：**\n\n    与全局回归模型不同，LWR 关注与查询点“局部”相近的数据子集。这有助于捕捉局部模式和趋势，这些趋势在假设全局结构的模型中可能被忽略。\n\
    \n3.  **平滑的决策边界：**\n\n    由于其对局部数据的关注，LWR 能够生成平滑的决策边界，使其在决策边界不全局线性或难以明确定义的任务中具有用途。\n\
    \n4.  **计算复杂度：**\n\n    LWR 的主要缺点是预测阶段计算开销较大。因为它需要为每个查询点计算加权回归模型，当数据集很大时会变得非常慢。\n\
    \n**Locally Weighted Regression（本地加权回归）的优势**\n\n1.  **灵活性：**\n\n    LWR 非常灵活，能够逼近参数模型（如线性回归）无法捕捉的复杂非线性函数。它能够局部精确建模，这在许多实际应用中尤其有价值，因为数据往往是非线性的。\n\
    \n2.  **无全局模型假设：**\n\n    由于 LWR 不假设全局模型，它可以自适应地适应特征空间不同区域的数据分布变化。这使其在数据分布随局部变化的场景中表现出色。\n\
    \n3.  **平滑且自适应：**\n\n    通过对邻近点赋予更大的权重，LWR 能够生成平滑的预测，并对局部数据模式敏感。当特征与目标变量之间的关系复杂且非线性时，尤其有用。\n\
    \n5.  **在某些情况下对离群点鲁棒：**\n\n    通过为远离查询点的点赋予较小的权重，LWR 可以在一定程度上对离群点具有鲁棒性，因为离群点通常远离大多数其他数据点。\n\
    \n**Locally Weighted Regression（本地加权回归）的缺点**\n\n1.  **高计算成本：**\n\n    LWR 需要为每个查询点计算一次回归，这在大数据集或特征维度较高时非常耗费资源。预测时对每个数据点的距离计算也会导致速度下降。\n\
    \n2.  **对核函数和带宽的敏感性：**\n\n    LWR 的性能高度依赖于核函数的选择以及控制核宽度的参数（例如高斯核中的 `σ`）。如果选择不当，模型可能出现过拟合或欠拟合。\n\
    \n3.  **内存消耗大：**\n\n    LWR 需要保存全部训练数据，因此对大规模数据集而言内存需求较高。它必须保留完整的训练集以便进行预测，而参数模型只需要存储学习到的参数。\n\
    \n4.  **局部区域过小导致过拟合：**\n\n    当局部邻域过小时（即 `k` 非常小），模型对数据噪声过于敏感，容易出现过拟合。\n\n**Locally\
    \ Weighted Regression（本地加权回归）的应用场景**\n\n1.  **时间序列预测：**\n\n    LWR 可用于预测时间序列数据，尤其在数据呈现非线性时序关系时。通过关注局部趋势，LWR\
    \ 能够适应时间序列中的变化模式。\n\n2.  **非线性回归：**\n\n    当自变量与因变量之间的关系非线性，而全局模型（如线性回归）无法捕捉其模式时，LWR\
    \ 特别有用。\n\n3.  **函数逼近：**\n\n    在底层函数未知或高度复杂的情况下，LWR 可以通过在每个查询点局部建模函数，提供良好的逼近效果。\n\
    \n4.  **图像处理：**\n\n    LWR 可应用于图像分割或去噪等领域，利用局部像素值预测图像中其他像素的值，从而保留局部结构和细节。\n\n\
    **径向基函数网络（Radial Basis Function Network，RBFN）**\n\n径向基函数网络（RBFN）是一种使用径向基函数（RBF）作为激活函数的人工神经网络，主要用于分类、回归和函数逼近任务。RBFN\
    \ 是前馈神经网络的一个子类，其特点在于隐藏层使用 RBF 来建模数据的复杂非线性关系。\n\nRBFN 的关键特性是隐藏层的神经元响应输入与基函数中心之间的距离，这使其能够构造非线性决策边界和数据逼近。\n\
    \n**RBF 网络的结构**\n\nRBF 网络通常由三层组成：\n\n1.  **输入层：**\n\n    输入层的节点接收输入特征，每个节点对应输入向量的一个特征。该层不进行计算，仅将输入传递给下一层。\n\
    \n2.  **隐藏层：**\n\n    隐藏层是 RBF 实际应用的地方。该层包含若干神经元，每个神经元计算输入向量与其对应基函数中心之间的相似度（通常基于欧氏距离）。每个神经元对应一个基函数，其输出取决于输入向量与中心的接近程度。\n\
    \n    常用的径向基函数包括：\n\n    *   **高斯函数：** `ϕ(x)=exp(−2σ²∥x−c∥²)`，其中 `c` 为中心，`σ` 为函数的带宽，`x`\
    \ 为输入向量。\n\n    *   **多线性函数（Multiquadric function）**、**反多线性函数（Inverse multiquadric\
    \ function）** 等。\n\n3.  **输出层：**\n\n    输出层通常使用线性激活函数。输出是隐藏层神经元输出的加权和，这些权重在训练过程中学习得到。分类任务中，输出层常应用\
    \ softmax 或阈值函数以确定类别标签。\n\n**RBF 网络的工作原理**\n\n1.  **训练阶段：**\n\n    在训练阶段，RBFN\
    \ 通过监督学习调整参数（即基函数的中心和神经元的权重）。\n\n    *   **中心：** 中心通常通过 k‑means 聚类或从训练数据中选取。\n\
    \n    *   **宽度/带宽（σ\\\\sigmaσ）：** 高斯函数的宽度决定了神经元对输入空间中特定区域的敏感程度。带宽越小，神经元对局部区域响应越集中；带宽越大，响应范围越广。\n\
    \n    *   **权重：** 隐藏层与输出层之间的权重通常使用线性方法（如最小二乘）或梯度下降进行学习。\n\n2.  **预测阶段：**\n\n \
    \   训练完成后，新输入数据经输入层传递，隐藏层计算输入与各基函数中心的相似度，输出层根据学习到的权重计算最终预测，通常为加权和。\n\n**径向基函数网络（RBFN）的主要特征**\n\
    \n1.  **非线性映射：**\n\n    RBFN 能够通过在输入数据上应用径向基函数，建模复杂的非线性关系，甚至逼近任意连续函数。\n\n2.  **局部响应：**\n\
    \n    隐藏层每个神经元的输出取决于输入与该神经元中心的距离，较近的输入会激活更高的响应，使 RBFN 对数据的局部结构敏感。\n\n3.  **灵活性：**\n"
