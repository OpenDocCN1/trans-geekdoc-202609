    A5=(7,5), A6=(6,4), A7=(1,2), A8=(4,9)）进行一次迭代，初始中心（簇中心）为 A1、A4 和 A7，找出一次迭代后的三个簇。


    单元 IV


    人工神经网络


    感知机


    感知机是一种最简单的人工神经网络类型，用于执行二分类任务。1958 年由 Frank Rosenblatt 提出，感知机是机器学习和人工智能的早期突破。它是线性分类器，将输入特征映射到二元输出，判断输入属于哪一类。


    感知机的结构


    感知机由以下组件构成：


    1.  输入：感知机接收多个输入，每个输入代表数据集的特征。


    2.  权重：每个输入都关联一个权重，决定其在决策过程中的重要性。


    3.  偏置：偏置项加到加权和上，调整决策边界，提供更大的灵活性。


    4.  加权和：感知机计算所有输入值与对应权重的乘积之和，并加上偏置。


    5.  激活函数：使用阶跃函数决定输出。若加权和超过阈值，则输出一个类；否则输出另一个类。


    感知机的工作原理


    1.  前向传播：


    计算输入的加权和：![](img/image002.png) 为权重，xix​ 为输入，bbb 为偏置。


    应用激活函数：


    ![](img/image021.png)


    输出为 1 或 0，表示类别标签。


    1.  通过训练进行学习：


    感知机根据预测输出与实际目标值之间的误差调整权重。


    感知机学习规则（Δ 规则）更新权重如下：


    ![](img/image038.png)


    其中：


    * η\\etaη 是学习率。


    * yyy 是实际目标。


    * y^\\hat{y}y^​ 是预测输出。


    * xix​ 是输入值。


    1.  迭代：


    感知机会多次遍历数据集（epoch），在收敛或满足停止条件前不断迭代，以最小化分类错误。


    感知机的优势


    1.  简洁性：


    感知机概念和计算上都很简单，易于实现。


    1.  适用于线性可分数据：


    在数据可由直线（或超平面）分隔的情况下表现良好。


    1.  神经网络的基石：


    感知机为现代神经网络奠定了基础，启发了更高级的算法。


    感知机的局限性


    1.  线性可分性：


    感知机只能解决线性可分的问题。例如，它无法解决 XOR 问题，因为单条直线无法将两类分开。


    1.  无隐藏层：


    感知机为单层网络，缺乏隐藏层，限制了其建模复杂关系的能力。


    1.  阶跃激活函数：


    阶跃函数不可微，阻碍了基于梯度的优化方法。


    感知机的应用


    1.  二分类：


    常用于垃圾邮件检测或将数据划分为两类等二分类任务。


    1.  模式识别：


    早期应用包括识别简单图案和形状。


    1.  特征加权：


    通过分析感知机分配给特征的权重，可帮助识别最具判别性的特征。


    感知机在人工智能中的重要性


    尽管存在局限，感知机仍是人工智能和机器学习的基石。其概念简洁且具历史意义，为多层感知机（MLP）、深度神经网络及其他高级架构的发展铺平了道路，这些架构能够解决非线性和复杂问题。感知机是理解神经网络及其学习机制的重要入门。


    多层感知机


    多层感知机（MLP）是一种由多层神经元（节点）按前向结构排列的神经网络类型。与单层感知机不同，MLP 在输入层和输出层之间包含一个或多个隐藏层，能够学习数据的复杂非线性关系。MLP
    是现代深度学习架构的基础。


