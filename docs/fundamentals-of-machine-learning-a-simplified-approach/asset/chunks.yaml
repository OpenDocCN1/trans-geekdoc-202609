  trans: '

    为什么需要验证集和测试集？它们有什么区别？


    验证集（validation set）用于在模型训练过程中调谐超参数、选择模型结构以及进行早期停止，帮助我们在开发阶段判断模型的泛化能力。测试集（test
    set）则在模型最终确定后才使用，用于评估模型在未见过的数据上的真实表现，确保评估结果不受过拟合的影响。


    '
