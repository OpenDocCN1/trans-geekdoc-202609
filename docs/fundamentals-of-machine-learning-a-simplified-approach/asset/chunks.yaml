- raw: "![](d2d_images/chapter_title_below.png) \n\nThe kernel trick is a mathematical\
    \ function that transforms the original data into a higher-dimensional space without\
    \ explicitly computing the transformation. It allows SVM to find a hyperplane\
    \ in this new space, making it effective for non-linear problems.\n\n#### Common\
    \ Kernel Functions:\n\n1.  Linear Kernel: Used for linearly separable data.\n\n\
    K(x,y)=x⋅y\n\n1.  Polynomial Kernel: Allows the algorithm to fit non-linear decision\
    \ boundaries.\n\nK(x,y)=(x⋅y+c)d\n\n1.  Radial Basis Function (RBF) Kernel / Gaussian\
    \ Kernel: Commonly used for non-linear problems.\n\nK(x,y)=exp(−γ∥x−y∥2)\n\n1.\
    \  Sigmoid Kernel: Works like a neural network activation function.\n\nK(x,y)=tanh(αx⋅y+c)\n\
    \n| ![](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 4\\\
    . Mathematical Formulation\n\n![](d2d_images/chapter_title_below.png) \n\n####\
    \ Objective of SVM\n\nThe objective is to find a hyperplane that maximizes the\
    \ margin while minimizing classification errors.\n\n##### 1\\. Optimization Problem\n\
    \nFor linearly separable data:\n\n![](d2d_images/image016.png)\n\nWhere:\n\n*\
    \   w: Weight vector defining the hyperplane.\n\n*   b: Bias term.\n\n*   yi​:\
    \ Class label (+1+1+1 or −1-1−1) of the iii-th data point.\n\n*   xi​: Feature\
    \ vector of the iii-th data point.\n\n##### 2\\. Soft Margin (for Non-Separable\
    \ Data)\n\nFor non-linearly separable data, SVM introduces slack variables (ξi\\\
    \\xi\\_iξi​) to allow some misclassification:\n\n![](d2d_images/image014.png)\n\
    \nWhere:\n\n*   ξi​: Slack variables measuring the degree of misclassification.\n\
    \n*   C: Regularization parameter controlling the trade-off between maximizing\
    \ the margin and minimizing classification errors.\n\n| ![](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n| ---\
    \ | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 5\\. Steps in\
    \ SVM\n\n![](d2d_images/chapter_title_below.png) \n\n1.  Input Data:\n\nProvide\
    \ labeled training data with features X={x1​,x2​,...,xn​} and labels y={y1​,y2​,...,yn​}.\n\
    \n1.  Choose Kernel:\n\nSelect an appropriate kernel function based on the nature\
    \ of the data.\n\n1.  Optimization:\n\nSolve the optimization problem to find\
    \ the hyperplane that maximizes the margin.\n\n1.  Prediction:\n\nFor a new data\
    \ point xxx, calculate:\n\nf(x)=w⋅x+b\n\nAssign y=+1if f(x)>0, otherwise y=−1.\n\
    \n| ![](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 6\\\
    . Advantages of SVM\n\n![](d2d_images/chapter_title_below.png) \n\n1.  Effective\
    \ for High-Dimensional Data:\n\nSVM works well when the number of features is\
    \ large, as it focuses on maximizing the margin.\n\n1.  Robust to Overfitting:\n\
    \nThe regularization parameter CCC prevents overfitting, especially for high-dimensional\
    \ and sparse data.\n\n1.  Kernel Trick:\n\nThe ability to use kernels makes SVM\
    \ versatile for solving non-linear problems.\n\n1.  Works Well for Small Datasets:\n\
    \nSVM can perform well even with small datasets when properly tuned.\n\n| ![](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n| ---\
    \ | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 7\\. Disadvantages\
    \ of SVM\n\n![](d2d_images/chapter_title_below.png) \n\n1.  Computational Complexity:\n\
    \nTraining an SVM can be computationally expensive, especially for large datasets.\n\
    \n1.  Choice of Kernel:\n\nThe performance of SVM heavily depends on the choice\
    \ of kernel and its parameters.\n\n1.  Limited Scalability:\n\nSVM struggles with\
    \ very large datasets because it requires solving a quadratic optimization problem.\n\
    \n1.  Interpretability:\n\nSVM models are less interpretable compared to simpler\
    \ models like decision trees or linear regression.\n\n| ![](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n| ---\
    \ | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 8\\. Applications\
    \ of SVM\n\n![](d2d_images/chapter_title_below.png) \n\n1.  Text Classification:\n\
    \nSpam email detection, sentiment analysis, and document categorization.\n\n1.\
    \  Image Classification:\n\nObject recognition and face detection.\n\n1.  Bioinformatics:\n\
    \nGene classification, protein structure prediction, and disease diagnosis.\n\n\
    1.  Time-Series Prediction:\n\nFinancial forecasting and stock market prediction.\n\
    \n1.  Anomaly Detection:\n\nIdentifying fraud or detecting outliers in datasets.\n\
    \n| ![](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 9\\\
    . Example: Binary Classification\n\n![](d2d_images/chapter_title_below.png) \n\
    \n#### Dataset:\n\nAssume we have two classes of points in a 2D space:\n\n*  \
    \ Class A: Points labeled as +1+1+1.\n\n*   Class B: Points labeled as −1-1−1.\n\
    \n#### Goal:\n\nFind a line (hyperplane) that separates the points from Class\
    \ A and Class B with the maximum margin.\n\n#### Steps:\n\n1.  Compute the optimal\
    \ hyperplane w⋅x+b=0 using the training data.\n\n2.  Identify the support vectors\
    \ (points closest to the hyperplane).\n\n3.  Predict the class of a new point\
    \ by evaluating its position relative to the hyperplane.\n\nSupport Vector Machines\
    \ (SVMs) are powerful tools for classification and regression tasks. They are\
    \ particularly useful when the data is high-dimensional or when there are complex,\
    \ non-linear relationships. While they require careful parameter tuning and kernel\
    \ selection, their ability to maximize the margin and leverage the kernel trick\
    \ makes them a popular choice in various machine learning applications.\n\nSUPPORT\
    \ VECTOR KERNEL\n\nLinear Kernel\n\nThe simplest kernel function that does not\
    \ transform the data. It is suitable for linearly separable data.\n\nK(x,y)=x⋅y\n\
    \nWhere x and yyy are feature vectors.\n\nKey Features:\n\n*   Fast and computationally\
    \ efficient.\n\n*   Works well when the data is already linearly separable.\n\n\
    Use Case:\n\nText classification (e.g., document categorization) where the feature\
    \ space is sparse and high-dimensional.\n\nPolynomial Kernel\n\nA kernel that\
    \ allows for non-linear decision boundaries by considering polynomial combinations\
    \ of features.\n\nK(x,y)=(xy+c)d\n\nWhere:\n\n*   d: Degree of the polynomial.\n\
    \n*   c: A constant to trade off the influence of higher-order versus lower-order\
    \ terms.\n\nKey Features:\n\n*   Allows for more flexible decision boundaries\
    \ compared to the linear kernel.\n\n*   The degree d determines the complexity\
    \ of the decision boundary.\n\nUse Case:\n\n*   Scenarios where relationships\
    \ between features are polynomial in nature.\n\n1.3. Gaussian Kernel (Radial Basis\
    \ Function, RBF Kernel)\n\nA widely used kernel that maps data into an infinite-dimensional\
    \ space. It is based on the distance between data points and is defined as:\n\n\
    ![](d2d_images/image029.png)\n\nWhere:\n\n*   ∥x−y∥2: Squared Euclidean distance\
    \ between x and y.\n\n*   γ>0: A parameter that controls the influence of a single\
    \ training example.\n\nKey Features:\n\n*   Handles highly non-linear decision\
    \ boundaries.\n\n*   The parameter γ determines how far the influence of a single\
    \ training point extends.\n\n*   A small γ value makes the influence more global\
    \ (smoother decision boundary), while a large γ value makes it more local (complex\
    \ decision boundary).\n\nUse Case:\n\n*   Problems with non-linear separability.\n\
    \n*   Image classification, bioinformatics, and speech recognition.\n\n2\\. Choosing\
    \ a Kernel\n\nLinear Kernel:\n\n*   When the data is linearly separable or nearly\
