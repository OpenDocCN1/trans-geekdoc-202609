    filter size of 5x5, the corresponding receptive field will be the filter size,
    5 multiplied by the depth of the input volume (the RGB colors) which is the color
    dimension. This thus gives us a receptive field of dimension 5x5x3.


    #### 9) How would you remove outliers when trying to estimate a flat plane from
    noisy samples?


    Random sample consensus (RANSAC) is an iterative method to estimate parameters
    of a mathematical model from a set of observed data that contains outliers, when
    outliers are to be accorded no influence on the values of the estimates.


    #### 10) How does [CBIR](https://www.robots.ox.ac.uk/~vgg/publications/2013/arandjelovic13/arandjelovic13.pdf) work?


    Content-based image retrieval is the concept of using images to gather metadata
    on their content. Compared to the current image retrieval approach based on the
    keywords associated to the images, this technique generates its metadata from
    computer vision techniques to extract the relevant information’s that will be
    used during the querying step. Many approaches are possible from feature detection
    to retrieve keywords to the usage of CNN to extract dense features that will be
    associated to a known distribution of keywords.


    With this last approach, we care less about what is shown on the image but more
    about the similarity between the metadata generated by a known image and a list
    of known label and or tags projected into this metadata space.


    #### 11) Describe how convolution works. What about if your inputs are grayscale
    vs RGB imagery? What determines the shape of the next layer?


    In a convolutional neural network (CNN), the convolution operation is applied
    to the input image using a small matrix called a kernel or filter. The kernel
    slides over the image in small steps, called strides, and perform element-wise
    multiplications with the corresponding elements of the image and then sums up
    the results. The output of this operation is called a feature map.


    When the input is RGB(or more than 3 channels) the sliding window will be a sliding
    cube. The shape of the next layer is determined by Kernel size, number of kernels,
    stride, padding, and dialation.


    #### 12) Talk me through how you would create a 3D model of an object from imagery
    and depth sensor measurements taken at all angles around the object.


    There are two popular methods for 3D reconstruction:


      Structure from Motion (SfM)


      Multi-View Stereo (MVS)


    SfM is better suited for creating models of large scenes while MVS is better suited
    for creating models of small objects.


    #### 13) Implement SQRT (const double & x) without using any special functions,
    just fundamental arithmetic.


    The taylor series can be used for this step by providing an approximation of sqrt(x):


    #### 14) Reverse a bitstring.


    If you are using python3 :


    data = b’\\xAD\\xDE\\xDE\\xC0’


    my\_data = bytearray(data)


    my\_data.reverse()


    #### 15) Implement non maximal suppression as efficiently as you can.


    Non-Maximum Suppression (NMS) is a technique used to eliminate multiple detections
    of the same object in a given image. To solve that first sort bounding boxes based
    on their scores(N LogN). Starting with the box with the highest score, remove
    boxes whose overlapping metric(IoU) is greater than a certain threshold.(N^2)


    To optimize this solution you can use special data structures to query for overlapping
    boxes such as R-tree or KD-tree. (N LogN)


    #### 16) What is data normalization and why do we need it?


    Data normalization is very important preprocessing step, used to rescale values
    to fit in a specific range to assure better convergence during back propagation.
    In general, it boils down to subtracting the mean of each data point and dividing
    by its standard deviation. If we don’t do this then some of the features (those
    with high magnitude) will be weighted more in the cost function (if a higher-magnitude
    feature changes by 1%, then that change is pretty big, but for smaller features
    it’s quite insignificant). The data normalization makes all features weighted
    equally.


    #### 17) Why do we use convolutions for images rather than just FC layers?


    Firstly, convolutions preserve, encode, and actually use the spatial information
    from the image. If we used only FC layers we would have no relative spatial information.
    Secondly, Convolutional Neural Networks (CNNs) have a partially built-in translation
    in-variance, since each convolution kernel acts as it’s own filter/feature detector.


    #### 18) What makes CNNs translation invariant?


    As explained above, each convolution kernel acts as it’s own filter/feature detector.
    So let’s say you’re doing object detection, it doesn’t matter where in the image
    the object is since we’re going to apply the convolution in a sliding window fashion
    across the entire image anyways.


    #### 19) Why do we have max-pooling in classification CNNs?


    for a role in Computer Vision. Max-pooling in a CNN allows you to reduce computation
    since your feature maps are smaller after the pooling. You don’t lose too much
    semantic information since you’re taking the maximum activation. There’s also
    a theory that max-pooling contributes a bit to giving CNNs more translation in-variance.
    Check out this great video from Andrew Ng on the [benefits of max-pooling](https://www.coursera.org/learn/convolutional-neural-networks/lecture/hELHk/pooling-layers).


    #### 20) Why do segmentation CNNs typically have an encoder-decoder style / structure?


    The encoder CNN can basically be thought of as a feature extraction network, while
    the decoder uses that information to predict the image segments by “decoding”
    the features and up scaling to the original image size.


    #### 21) What is the significance of Residual Networks?


    The main thing that residual connections did was allow for direct feature access
    from previous layers. This makes information propagation throughout the network
    much easier. One very interesting paper about this shows how using local skip
    connections gives the network a type of ensemble multi-path structure, giving
    features multiple paths to propagate throughout the network.


    #### 22) What is batch normalization and why does it work?


    Training Deep Neural Networks is complicated by the fact that the distribution
    of each layer’s inputs changes during training, as the parameters of the previous
    layers change. The idea is then to normalize the inputs of each layer in such
    a way that they have a mean output activation of zero and standard deviation of
    one. This is done for each individual mini-batch at each layer i.e compute the
    mean and variance of that mini-batch alone, and then normalizes. This is analogous
    to how the inputs to networks are standardized. How does this help? We know that
    normalizing the inputs to a network helps it learn. But a network is just a series
    of layers, where the output of one layer becomes the input to the next. That means
    we can think of any layer in a neural network as the first layer of a smaller
    subsequent network. Thought of as a series of neural networks feeding into each
    other, we normalize the output of one layer before applying the activation function,
    and then feed it into the following layer (sub-network).


    #### 23) Why would you use many small convolutional kernels such as 3x3 rather
    than a few large ones?


    This is very well explained in the [VGGNet paper](https://arxiv.org/pdf/1409.1556.pdf).
    There are 2 reasons: First, you can use several smaller kernels rather than few
    large ones to get the same receptive field and capture more spatial context, but
    with the smaller kernels you are using less parameters and computations. Secondly,
    because with smaller kernels you will be using more filters, you’ll be able to
    use more activation functions and thus have a more discriminative mapping function
    being learned by your CNN.


    #### 24) Why do we need a validation set and test set? What is the difference
    between them?'
