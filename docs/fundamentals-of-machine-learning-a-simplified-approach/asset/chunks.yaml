  trans: '

    考虑一个简单的二分类问题，我们有一个包含两个类别：A 和 B 的数据集。


    如果数据集中 A 和 B 的比例各为 50%，则熵为：


    H(X)=−\[0.5log⁡20.5+0.5log⁡20.5\]=1 bit


    这代表最大的不确定性。


    *   如果数据集中 AAA 占 90%，BBB 占 10%，则熵为：


    H(X)=−\[0.9log⁡20.9+0.1log⁡20.1\]≈0.468 bits


    这表示不确定性较少，因为某一类明显更为普遍。


    信息增益


    在机器学习中，信息增益用于决定决策树算法中最佳的数据分割特征。信息增益是指根据特定属性对数据集进行划分后，熵的减少量。目标是选择能够实现最大熵减少的特征，从而得到更纯净（更均匀）的子集。


    信息增益公式：


    当根据属性 AAA 对数据集 DDD 进行划分时，信息增益计算如下：


    ![](img/image010.png)


    其中：


    *   H(D) 是原始数据集 DDD 的熵，


    *   Dv​ 是属性 A 的值为 v 的子集，


    *   H(Dv​) 是子集 Dv​ 的熵，


    *   ∣Dv∣∣D∣​ 是子集 Dv​ 中实例数量占整个数据集的比例。


    选择信息增益最高的属性作为划分依据。在决策树学习中，这一过程会递归进行，构建出能够将数据集划分为尽可能纯净子集的树结构。


    香农熵在信息论中的应用


    信息论中的熵概念由克劳德·香农（Claude Shannon）提出，用于量化消息或数据集的信息内容。它定义为从能够产生多种符号的源接收消息时的“惊讶”或不确定性的期望值。


    香农熵公式：


    对于一个能够产生符号 x1,x2,...,xn​ 的源，其概率分别为 p(x1),p(x2),...,p(xn)，熵 H(X) 为：


    ![](img/image042.png)


    该熵值表示在最佳无损编码下，从该源编码消息所需的最小比特数。


    信息论中的解释：


    *   高熵：如果源包含许多可能符号且概率相近（例如公平的硬币投掷），熵较高，因为结果的不确定性较大。


    *   低熵：如果源主要产生概率很高的单一符号（例如总是发送字母 "A"），熵较低，因为预测下一个符号的不确定性较小。


    机器学习中的熵应用


    1.  决策树学习：


    在 ID3（Iterative Dichotomiser 3）和 C4.5 等算法中，熵用于计算节点分割时的信息增益。目标是选择能够最大化信息增益的特征，从而实现最纯净的划分。


    1.  特征选择：


    熵用于评估特征的相关性，衡量特征能够多少地减少数据的不确定性。能够显著降低熵的特征被认为更具信息性，从而在模型中被选用。


    1.  聚类：


    在 k-means 等聚类算法中，熵可用于评估聚类质量。低熵表示簇内实例相似性高，而高熵则表明簇更为混杂或异质。


    1.  数据压缩：


    熵在数据压缩算法（如 Huffman 编码）中至关重要，目标是根据数据分布的熵，用最少的比特数表示数据。


    1.  Naive Bayes 分类器：


    熵与 Naive Bayes 等概率分类器中的 Kullback-Leibler 偏差（KL divergence）相关，这些分类器使用概率度量来评估特征给定类别的可能性。


    熵是香农在信息论中引入的一种强大的不确定性或混乱度量。在机器学习中，它在决策树算法和其他旨在量化数据不确定性的模型中发挥关键作用。通过最小化熵（或最大化信息增益），机器学习算法能够高效地做出决策和预测，最终学习到能够很好地泛化到未见数据的模式。理解熵是许多机器学习技术的基础，尤其是涉及分类和特征选择的技术。


    信息增益


    信息增益是决策树学习和机器学习整体中的一个核心概念。它用于衡量根据特定特征或属性对数据集进行划分后，不确定性或熵的减少量。使用信息增益的主要目标是找出能够显著降低不确定性的属性，从而构建更好的预测模型，特别是在决策树中。


    信息增益本质上衡量特征在分类数据方面的有效性。能够在数据划分后实现最大不确定性或熵减少的特征被选中用于决策树的构建。该过程会递归进行，直到数据完全被分类。


    理解熵


    在深入研究信息增益之前，理解熵是很重要的，因为它是用于计算信息增益的不确定性度量。


    熵是数据的不可预测性或杂乱程度的度量。如果数据集中所有实例属于同一类别，熵为 0（即没有不确定性）；如果实例在不同类别之间均匀分布，熵较高（即不确定性最大）。


