    \ selects the best feature for the next split, and continues until the stopping\
    \ conditions are met.\n\n1. Assign a Label:\n\nOnce the algorithm reaches a leaf\
    \ node, it assigns a label (class label or regression value) to the node.\n\n\
    *   In classification, the label assigned is the majority class of the samples\
    \ in that subset.\n\n*   In regression, the label assigned is the average value\
    \ of the target variable for the samples in that subset.\n\nDecision Tree Learning\
    \ Algorithm (Pseudocode)\n\nHere’s a general pseudocode representation of the\
    \ decision tree learning process:\n\n```python\ndef decision_tree_learning(data,\
    \ features):\n    if stopping_condition(data):\n        return create_leaf_node(data)\n\
    \    best_feature = select_best_feature(data, features)\n    tree = create_node(best_feature)\n\
    \    feature_values = unique_values(best_feature)\n    for value in feature_values:\n\
    \        subset = filter_data(data, best_feature, value)\n        subtree = decision_tree_learning(subset,\
    \ features - {best_feature})\n        tree.add_branch(value, subtree)\n    return\
    \ tree\n```\n\nExplanation of the Pseudocode:\n\n*   stopping_condition(data):\
    \ A function that checks if any stopping condition is met (all samples are the\
    \ same class, no features left, etc.).\n\n*   create_leaf_node(data): Creates\
    \ a leaf node with the majority class or the average value for regression.\n\n\
    *   select_best_feature(data, features): This function selects the best feature\
    \ for splitting based on the chosen criterion (e.g., Gini impurity or Information\
    \ Gain).\n\n*   create_node(best_feature): Creates a decision node that splits\
    \ on the best feature.\n\n*   unique_values(best_feature): Returns the unique\
    \ values or thresholds for the feature.\n\n*   filter_data(data, best_feature,\
    \ value): Filters the dataset based on the value of the selected feature.\n\n\
    *   add_branch(value, subtree): Adds a branch for each possible value of the selected\
    \ feature.\n\nPruning the Decision Tree\n\nOnce the tree has been fully grown,\
    \ pruning is used to reduce the size of the tree and improve its generalization\
    \ ability. There are two types of pruning:\n\n1. Pre-pruning (Early Stopping):\n\
    \nThe tree is stopped from growing early based on certain conditions such as:\n\
    \n*   A node has fewer than a predefined minimum number of samples.\n\n*   A node\
    \ cannot improve the model's accuracy (e.g., Information Gain is too low).\n\n\
    *   The depth of the tree reaches a predefined limit.\n\n1. Post-pruning (Cost-Complexity\
    \ Pruning):\n\n*   The tree is grown fully, and then branches are removed based\
    \ on their contribution to improving the model's performance (e.g., based on cross-validation).\n\
    \n*   This is usually done by evaluating the error rate and removing branches\
    \ that lead to overfitting.\n\nAdvantages of Decision Tree Learning\n\n*   Easy\
    \ to Understand and Interpret: The structure of the tree is easy to visualize,\
    \ making the model interpretable even for non-technical users.\n\n*   Handles\
    \ Both Numerical and Categorical Data: Decision Trees can work with both types\
    \ of data without needing normalization or scaling.\n\n*   Non-Linear Decision\
    \ Boundaries: Decision Trees can model non-linear relationships between features\
    \ and the target variable.\n\n*   Automatic Feature Selection: The algorithm automatically\
    \ selects the most relevant features at each step.\n\nDisadvantages of Decision\
    \ Tree Learning\n\n*   Overfitting: Decision Trees tend to overfit the data, especially\
    \ when the tree is deep or the dataset is noisy.\n\n*   Instability: Small changes\
    \ in the data can lead to a completely different tree.\n\n*   Bias Toward Features\
    \ with More Levels: Features with many distinct values can dominate the splitting\
    \ criteria, potentially leading to biased trees.\n"
  trans: "\n## 9. 非线性核的计算成本\n\n核计算：非线性核（如径向基函数 RBF 核）在计算上可能非常昂贵，因为需要在特征空间中计算每一对数据点之间的相似度。这会导致一个大小为\
    \ n×n 的核矩阵，对于大型数据集来说，这可能是计算上不可承受的。\n\n矩阵反演：在某些 SVM 实现中（特别是针对非线性核），训练阶段需要进行矩阵反演，这会增加计算时间和复杂度。\n\
    \n## 10. 在线学习的有限支持\n\n批量学习：SVM 通常设计用于批量学习，即一次性使用整个数据集进行训练。它们不适合在线学习或数据流场景。\n\n\
    无增量学习：传统 SVM 模型无法通过增量方式更新新数据。相比之下，如逻辑回归和决策树等模型可以轻松适应新数据，无需从头开始重新训练。这使得 SVM 不适合用于动态、实时应用。\n\
    \n### 练习\n\n1. 详细描述设计学习系统所涉及的所有步骤。讨论机器学习的视角和问题。\n\n2. 解释遗传算法在基于知识的技术中的作用。\n\n\
    3. 与传统算法相比，区分遗传算法，并给出合适的例子。\n\n4. 详细说明各种人工神经网络（ANN）架构。\n\n5. 区分监督学习和强化学习。用例子进行说明。\n\
    \n### 单元 III\n\n## 决策树学习\n\n## 决策树学习算法\n\n决策树学习算法是一种递归过程，它根据在每一步中最能区分数据点的特征将数据集划分为子集。目标是通过从数据特征中学习简单的决策规则，构建一个能够预测目标变量的模型。以下是决策树学习算法的过程和步骤概述。\n\
    \n### 决策树学习算法的步骤\n\n1. 输入数据集：\n\n算法从包含多个特征（属性）和目标变量（分类任务中的类标签，回归任务中的连续值）的数据集开始。\n\
    \n在分类任务中，目标变量是离散的；在回归任务中，目标变量是连续的。\n\n1. 检查停止条件：\n\n所有样本属于同一类别：如果所有样本属于同一类，该节点成为叶节点，并标记为该类别。\n\
    \n没有剩余特征：如果没有更多特征可以用于划分（或特征不再提供信息），节点成为叶节点。该节点的标签为该子集中样本多数类别的标签。\n\n最大深度或最小样本数：如果决策树达到预定义深度，或者子集中的样本数量过少以进行进一步划分，算法停止。\n\
    \n1. 选择最佳特征进行划分：\n\n算法评估所有可用特征，选择能实现最佳划分的特征，通常基于不纯度度量或如基尼不纯度、熵（信息增益）或回归任务中的方差减少等标准。\n\
    \n这些标准用于衡量在对特定特征进行划分后，数据的分离程度。最常用的度量包括：\n\n基尼不纯度：衡量随机样本被错误分类的概率。\n\n![](img/image024.png)\n\
    \n其中，Values(A) 是特征 A 的可能取值，tv 是子集 t 中特征 A 取值 v 的样本子集。\n\n方差减少：在回归任务中，算法选择能最小化目标变量在划分后方差的特征。\n\
    \n1. 划分数据集：\n\n在选择最佳特征后，根据该特征的值将数据集划分为子集。\n\n如果特征是连续的，划分可能基于阈值（例如，小于或大于某个值）。如果特征是离散的，数据集会根据该特征的不同取值进行划分。\n\
    \n1. 递归：\n\n算法对每个子集递归应用相同的过程（创建子树）。对于每个子集，检查停止条件，选择下一步的最佳特征，并继续，直到满足停止条件。\n\n\
    1. 赋值：\n\n当算法到达叶节点时，为节点赋值（类别标签或回归值）。\n\n- 在分类任务中，赋值为该子集中样本的多数类别。\n- 在回归任务中，赋值为该子集中目标变量的平均值。\n\
    \n### 决策树学习算法（伪代码）\n\n以下是决策树学习过程的一般伪代码表示：\n\n```python\ndef decision_tree_learning(data,\
    \ features):\n    if stopping_condition(data):\n        return create_leaf_node(data)\n\
    \    best_feature = select_best_feature(data, features)\n    tree = create_node(best_feature)\n\
    \    feature_values = unique_values(best_feature)\n    for value in feature_values:\n\
    \        subset = filter_data(data, best_feature, value)\n        subtree = decision_tree_learning(subset,\
    \ features - {best_feature})\n        tree.add_branch(value, subtree)\n    return\
    \ tree\n```\n\n### 伪代码说明：\n\n*   stopping_condition(data)：检查是否满足任一停止条件（所有样本属于同一类、无剩余特征等）。\n\
    \n*   create_leaf_node(data)：创建叶节点，标记为子集中多数类别或回归任务的平均值。\n\n*   select_best_feature(data,\
    \ features)：根据选定的标准（如基尼不纯度或信息增益）选择最佳划分特征。\n\n*   create_node(best_feature)：创建基于最佳特征的决策节点。\n\
    \n*   unique_values(best_feature)：返回特征的唯一值或阈值。\n\n*   filter_data(data, best_feature,\
    \ value)：根据特征值过滤数据集。\n\n*   add_branch(value, subtree)：为特征的每个可能值添加分支，连接相应的子树。\n\
    \n### 剪枝决策树\n\n在决策树完全生长后，剪枝用于减小树的大小并提高其泛化能力。主要有两种剪枝方式：\n\n1. 预剪枝（早期停止）：\n\n根据特定条件提前停止树的生长，例如：\n\
    \n- 节点中的样本数少于预定义的最小数量。\n- 节点无法提高模型准确率（例如，信息增益过低）。\n- 树的深度达到预定义限制。\n\n1. 后剪枝（代码复杂度剪枝）：\n\
    \n树完全生长后，根据分支对模型性能的贡献（例如，通过交叉验证）来移除分支。\n\n- 通常通过评估错误率，移除导致过拟合的分支。\n\n### 决策树学习的优势\n\
    \n*   易于理解和解释：树的结构易于可视化，即使是非技术用户也能理解模型。\n*   处理数值和类别数据：决策树可以处理数值和类别数据，无需标准化或缩放。\n\
    *   非线性决策边界：决策树可以建模特征与目标变量之间的非线性关系。\n*   自动特征选择：算法在每一步自动选择最相关的特征。\n\n### 决策树学习的缺点\n\
    \n*   过拟合：决策树容易过拟合数据，尤其是树过深或数据噪声较多时。\n*   不稳定性：小的数据变化可能导致完全不同的树。\n*   偏向于特征取值多的特征：特征取值级数多的特征可能主导划分标准，导致树偏向这些特征。\n\
    \n"
