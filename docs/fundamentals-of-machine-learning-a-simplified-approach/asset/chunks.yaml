    and text data.


    Medical Diagnosis: In healthcare, Naive Bayes can be used to predict the presence
    of a disease based on symptoms, where the symptoms are assumed to be conditionally
    independent.


    Sentiment Analysis: It is used to determine the sentiment (positive or negative)
    of a text or review, especially for social media posts or product reviews.


    Recommendation Systems: Naive Bayes can be used in recommendation systems to classify
    user preferences or behaviors.


    10\. Example: Naive Bayes for Spam Classification


    Imagine we are building a spam classifier where the features X=(X1​,X2​) represent
