- raw: 'Consider a simple binary classification problem where we have a dataset with
    two classes: A and B.


    If the dataset contains 50% A and 50% B, the entropy is:


    H(X)=−\[0.5log⁡20.5+0.5log⁡20.5\]=1 bit


    This represents maximum uncertainty.


    *   If the dataset contains 90% AAA and 10% BBB, the entropy is:


    H(X)=−\[0.9log⁡20.9+0.1log⁡20.1\]≈0.468 bits


    This indicates less uncertainty, since one class is much more prevalent.


    Information Gain


    In machine learning, information gain is used to decide the best feature to split
    the data in decision tree algorithms. Information gain is the reduction in entropy
    after a dataset is split based on a particular attribute. The goal is to choose
    the feature that results in the highest reduction of entropy, leading to more
    homogeneous (pure) subsets.


    Information Gain Formula:


    The information gain when splitting a dataset DDD based on an attribute AAA is
    calculated as:


    ![](d2d_images/image010.png)


    Where:


    *   H(D) is the entropy of the original dataset DDD,


    *   Dv​ is the subset of D for which the value of attribute A is v,


    *   H(Dv​) is the entropy of subset Dv​,


    *   ∣Dv∣∣D∣​ is the proportion of instances in subset Dv​ relative to the entire
    dataset.


    The attribute that provides the highest information gain is selected for the split.
    In decision tree learning, this process is repeated recursively to build a tree
    structure that divides the dataset into subsets that are as pure as possible.


    Shannon Entropy in Information Theory


    The concept of entropy in information theory, introduced by Claude Shannon, is
    used to quantify the information content of a message or dataset. It is defined
    as the expected amount of "surprise" or uncertainty when receiving a message from
    a source that can produce various symbols with certain probabilities.


    Shannon''s Entropy Formula:


    For a source that produces symbols x1,x2,...,xn​ with probabilities p(x1),p(x2),...,p(xn),
    the entropy H(X) is:


    ![](d2d_images/image042.png)


    This entropy value represents the minimum number of bits needed to encode a message
    from the source in a lossless manner, assuming optimal encoding.


    Interpretation in Information Theory:


    *   High Entropy: If the source has many possible symbols with similar probabilities
    (e.g., a fair coin toss), the entropy is high because there is high uncertainty
    about the outcome.


    *   Low Entropy: If the source mostly produces one symbol with high probability
    (e.g., always sending the letter "A"), the entropy is low because there is little
    uncertainty in predicting the next symbol.


    Applications of Entropy in Machine Learning


    1.  Decision Tree Learning:


    In algorithms like ID3 (Iterative Dichotomiser 3) and C4.5, entropy is used to
    calculate the information gain when splitting the data at each node. The goal
    is to select the feature that maximizes information gain, leading to the most
    homogeneous splits.


    1.  Feature Selection:


    Entropy is used in feature selection techniques to evaluate the relevance of a
    feature based on how much it reduces uncertainty or disorder in the data. Features
    that reduce entropy the most are considered more informative and are selected
    for use in models.


    1.  Clustering:


    In clustering algorithms like k-means, entropy can be used to evaluate the quality
    of clusters. Low entropy indicates that the instances within a cluster are similar
    to each other, and high entropy suggests a more mixed or heterogeneous cluster.


    1.  Data Compression:


    Entropy is crucial in data compression algorithms (e.g., Huffman coding), where
    the goal is to represent data with the minimum number of bits based on the entropy
    of the data distribution.


    1.  Naive Bayes Classifier:


    Entropy is related to the Kullback-Leibler Divergence in probabilistic classifiers
    like Naive Bayes, which use probabilistic measures of the likelihood of classes
    given the features.


    Entropy, as introduced by Shannon in information theory, is a powerful measure
    of uncertainty or disorder in a system. In machine learning, it plays a key role
    in decision tree algorithms and other models that aim to quantify the uncertainty
    in data. By minimizing entropy (or maximizing information gain), machine learning
    algorithms can efficiently make decisions and predictions, ultimately learning
    patterns that generalize well to unseen data. Understanding entropy is foundational
    to many machine learning techniques, especially those that involve classification
    and feature selection.


    INFORMATION GAIN


    Information Gain is a key concept in decision tree learning and machine learning
    in general. It is used to measure how much uncertainty or entropy is reduced after
    a dataset is split based on a particular feature or attribute. The primary goal
    in using information gain is to identify the attribute that provides the most
    significant reduction in uncertainty, thereby helping build better predictive
    models, particularly in decision trees.


    Information gain essentially quantifies the effectiveness of a feature in classifying
    data. The feature that results in the highest reduction in uncertainty or entropy
    when splitting the data is selected for use in the decision tree. This process
    is repeated recursively until the data is completely classified.


    Understanding Entropy


    Before diving into information gain, it''s important to understand entropy, as
    it is the measure of uncertainty used to calculate information gain.


    Entropy is a measure of the unpredictability or impurity of the data. If all instances
    in the dataset belong to a single class, the entropy is 0 (i.e., no uncertainty).
    If the instances are evenly distributed among different classes, the entropy is
    high (maximum uncertainty).


    Entropy Formula:


    For a set SS with nn possible classes, the entropy is defined as:


    ![](d2d_images/image001.png)


    Where:


    *   H(S) is the entropy of the set SS,


    *   p(xi) is the probability of class xi in set S,


    *   The sum runs over all classes in the set.


    Calculating Information Gain


    Information Gain measures how much entropy is reduced after a dataset is split
    based on a particular attribute. It tells us how useful an attribute is for classifying
    the data. The attribute that results in the highest information gain is the best
    candidate for splitting the data at each step of the decision tree construction.


    Information Gain Formula:


    The information gain for splitting a dataset D based on an attribute A is calculated
    as:


    ![](d2d_images/image004.png)


    Where:


    *   H(D) is the entropy of the original dataset D,


    *   Values(A) represents the set of all possible values of attribute A,


    *   Dv is the subset of D where attribute A has value v,


    *   H(Dv) is the entropy of subset Dv,


    *   ∣Dv∣∣D∣ is the fraction of instances in subset Dv relative to the entire dataset.


    Steps to Calculate Information Gain


    1.  Calculate the entropy of the original dataset: This gives us the overall uncertainty
    or disorder of the dataset before any split.


    2.  Split the dataset based on an attribute: Divide the dataset into subsets based
    on the values of a chosen attribute.


    3.  Calculate the entropy for each subset: For each subset, calculate the entropy.
    This tells us how uncertain the data is within each subset.


    4.  Compute the weighted sum of the entropies: Multiply the entropy of each subset
    by the fraction of instances in that subset relative to the entire dataset.


    5.  Calculate the information gain: Subtract the weighted sum of the entropies
    from the entropy of the original dataset. This gives us the information gain for
    the attribute.


    Example of Information Gain Calculation


    Consider a small dataset where the goal is to predict whether someone buys a product
    based on their age and income:


    | Age || Income || Buys Product (Target) |


    | --- | --- | --- |


    | 30 || Low || No |


    | --- | --- | --- |


    | 30 || High || Yes |


    | 40 || Low || No |


    | 40 || High || Yes |


    | 50 || Low || Yes |


    | 50 || High || Yes |


