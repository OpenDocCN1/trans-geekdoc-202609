- raw: "| ![](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 66)14.\
    \ What is the Difference Between Supervised and Unsupervised Machine Learning?\n\
    \n![](d2d_images/chapter_title_below.png) \n\n  Supervised learning - This model\
    \ learns from the labeled data and makes a future prediction as output \n\n \
    \ Unsupervised learning - This model uses unlabeled input data and allows the\
    \ algorithm to act on that information without guidance.\n\n| ![](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n| ---\
    \ | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 67). When Will\
    \ You Use Classification over Regression?\n\n![](d2d_images/chapter_title_below.png)\
    \ \n\nClassification is used when your target is categorical, while regression\
    \ is used when your target variable is continuous. Both classification and regression\
    \ belong to the category of supervised [machine learning algorithms](https://www.simplilearn.com/10-algorithms-machine-learning-engineers-need-to-know-article\
    \ \"machine learning algorithms\"). \n\nExamples of classification problems include:\n\
    \n  Predicting yes or no\n\n  Estimating gender\n\n  Breed of an animal\n\n\
      Type of color\n\nExamples of regression problems include:\n\n  Estimating\
    \ sales and price of a product\n\n  Predicting the score of a team\n\n  Predicting\
    \ the amount of rainfall\n\n| ![](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n| ---\
    \ | --- | --- |\n\n![](d2d_images/chapter_title_above.png) \n\n# 68). What is\
    \ Over fitting, and How Can You Avoid It? \n\n![](d2d_images/chapter_title_below.png)\
    \ \n\nThe Over fitting is a situation that occurs when a model learns the training\
    \ set too well, taking up random fluctuations in the training data as concepts.\
    \ These impact the model’s ability to generalize and don’t apply to new data. \n\
    \nWhen a model is given the training data, it shows 100 percent accuracy—technically\
    \ a slight loss. But, when we use the test data, there may be an error and low\
    \ efficiency. This condition is known as over fitting.\n\nThere are multiple ways\
    \ of avoiding over fitting, such as:\n\n  Regularization. It involves a cost\
    \ term for the features involved with the objective function\n\n  Making a simple\
    \ model. With lesser variables and parameters, the variance can be reduced \n\n\
      Cross-validation methods like k-folds can also be used\n\nIf some model parameters\
    \ are likely to cause over fitting, techniques for regularization like LASSO can\
    \ be used that penalize these parameters.\n\nFundamentals of Machine Learning:\
    \ A Simplified Approach"
