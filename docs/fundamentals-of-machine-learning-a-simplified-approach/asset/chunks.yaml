    When training a model, we divide the available data into three separate sets:


    - The training dataset is used for fitting the model’s parameters. However, the
    accuracy that we achieve on the training set is not reliable for predicting if
    the model will be accurate on new samples.

    - The validation dataset is used to measure how well the model does on examples
    that weren’t part of the training dataset. The metrics computed on the validation
    data can be used to tune the hyper parameters of the model. However, every time
    we evaluate the validation data and we make decisions based on those scores, we
    are leaking information from the validation data into our model. The more evaluations,
    the more information is leaked. So we can end up over fitting to the validation
    data, and once again the validation score won’t be reliable for predicting the
    behavior of the model in the real world.

    - The test dataset is used to measure how well the model does on previously unseen
    examples. It should only be used once we have tuned the parameters using the validation
    set.


    So if we omit the test set and only use a validation set, the validation score
    won’t be a good estimate of the generalization of the model.


    #### 25) What is stratified cross-validation and when should we use it?


    Cross-validation is a technique for dividing data between training and validation
    sets. On typical cross-validation this split is done randomly. But in stratified
    cross-validation, the split preserves the ratio of the categories on both the
    training and validation datasets.


    For example, if we have a dataset with 10% of category A and 90% of category B,
    and we use stratified cross-validation, we will have the same proportions in training
    and validation. In contrast, if we use simple cross-validation, in the worst case
    we may find that there are no samples of category A in the validation set.


    Stratified cross-validation may be applied in the following scenarios:


    - On a dataset with multiple categories. The smaller the dataset and the more
    imbalanced the categories, the more important it will be to use stratified cross-validation.

    - On a dataset with data of different distributions. For example, in a dataset
    for autonomous driving, we may have images taken during the day and at night.
    If we do not ensure that both types are present in training and validation, we
    will have generalization problems.


    #### 26) Why do ensembles typically have higher scores than individual models?


    An ensemble is the combination of multiple models to create a single prediction.
    The key idea for making better predictions is that the models should make different
    errors. That way the errors of one model will be compensated by the right guesses
    of the other models and thus the score of the ensemble will be higher.


    We need diverse models for creating an ensemble. Diversity can be achieved by:


    - Using different ML algorithms. For example, you can combine logistic regression,
    k-nearest neighbors, and decision trees.

    - Using different subsets of the data for training. This is called bagging.

    - Giving a different weight to each of the samples of the training set. If this
    is done iteratively, weighting the samples according to the errors of the ensemble,
    it’s called boosting. Many winning solutions to data science competitions are
    ensembles. However, in real-life machine learning projects, engineers need to
    find a balance between execution time and accuracy.


    #### 27) What is an imbalanced dataset? Can you list some ways to deal with it?


    An imbalanced dataset is one that has different proportions of target categories.
    For example, a dataset with medical images where we have to detect some illness
    will typically have many more negative samples than positive samples—say, 98%
    of images are without the illness and 2% of images are with the illness.


    There are different options to deal with imbalanced datasets:


    - Oversampling or under sampling. Instead of sampling with a uniform distribution
    from the training dataset, we can use other distributions so the model sees a
    more balanced dataset.

    - Data augmentation. We can add data in the less frequent categories by modifying
    existing data in a controlled way. In the example dataset, we could flip the images
    with illnesses, or add noise to copies of the images in such a way that the illness
    remains visible.

    - Using appropriate metrics. In the example dataset, if we had a model that always
    made negative predictions; it would achieve a precision of 98%. There are other
    metrics such as precision, recall, and F-score that describe the accuracy of the
    model better when using an imbalanced dataset.


