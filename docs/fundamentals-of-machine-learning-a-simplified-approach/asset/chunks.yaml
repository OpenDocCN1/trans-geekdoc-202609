- raw: 'Momentum lets the optimization algorithm remembers its last step, and adds
    some proportion of it to the current step. This way, even if the algorithm is
    stuck in a flat region, or a small local minimum, it can get out and continue
    towards the true minimum.


    #### 37) What is the difference between Batch Gradient Descent and Stochastic
    Gradient Descent?


    Batch gradient descent computes the gradient using the whole dataset. This is
    great for convex or relatively smooth error manifolds. In this case, we move somewhat
    directly towards an optimum solution, either local or global. Additionally, batch
    gradient descent, given an annealed learning rate, will eventually find the minimum
    located in it’s basin of attraction.


    Stochastic gradient descent (SGD) computes the gradient using a single sample.
    SGD works well (Not well, I suppose, but better than batch gradient descent) for
    error manifolds that have lots of local maxima/minima. In this case, the somewhat
    noisier gradient calculated using the reduced number of samples tends to jerk
    the model out of local minima into a region that hopefully is more optimal.


    #### 38) Epoch vs. Batch vs. Iteration.


      Epoch: one forward pass and one backward pass of all the training examples


      Batch: examples processed together in one pass (forward and backward)


      Iteration: number of training examples / Batch size


    #### 39) What is vanishing gradient?


    As we add more and more hidden layers, back propagation becomes less and less
    useful in passing information to the lower layers. In effect, as information is
    passed back, the gradients begin to vanish and become small relative to the weights
    of the networks.


    #### 40) What are dropouts?


    Dropout is a simple way to prevent a neural network from over fitting. It is the
    dropping out of some of the units in a neural network. It is similar to the natural
    reproduction process, where the nature produces off springs by combining distinct
    genes (dropping out others) rather than strengthening the co-adapting of them.


    #### 41) Define LSTM.


    Long Short Term Memory – are explicitly designed to address the long term dependency
    problem, by maintaining a state what to remember and what to forget.


    #### 42) List the key components of LSTM.


      Gates (forget, Memory, update & Read)


      tanh(x) (values between -1 to 1)


      Sigmoid(x) (values between 0 to 1)


    #### 43) List the variants of RNN.


      LSTM: Long Short Term Memory


      GRU: Gated Recurrent Unit


      End to End Network


      Memory Network


    #### 44) What is Auto encoder, name few applications.


    Auto encoder is basically used to learn a compressed form of given data. Few applications
    include


      Data de-noising


      Dimensionality reduction


      Image reconstruction


      Image colorization


    #### 45) What are the components of GAN?


      Generator


      Discriminator


    #### 46) What’s the difference between boosting and bagging?


    Boosting and bagging are similar, in that they are both assembling techniques,
    where a number of weak learners (classifiers/repressors that are barely better
    than guessing) combine (through averaging or max vote) to create a strong learner
    that can make accurate predictions. Bagging means that you take bootstrap samples
    (with replacement) of your data set and each sample trains a (potentially) weak
    learner. Boosting, on the other hand, uses all data to train each learner, but
    instances that were misclassified by the previous learners are given more weight
    so that subsequent learners give more focus to them during training.


    #### 47) Explain how a ROC curve works.


    The ROC curve is a graphical representation of the contrast between true positive
    rates and the false positive rate at various thresholds. It’s often used as a
    proxy for the trade-off between the sensitivity of the model (true positives)
    vs the fall-out or the probability it will trigger a false alarm (false positives).


    #### 48) What’s the difference between Type I and Type II error?


    Type I error is a false positive, while Type II error is a false negative. Briefly
    stated, Type I error means claiming something has happened when it hasn’t, while
    Type II error means that you claim nothing is happening when in fact something
    is. A clever way to think about this is to think of Type I error as telling a
    man he is pregnant, while Type II error means you tell a pregnant woman she isn’t
    carrying a baby.


    #### 49) What’s the difference between a generative and discriminative model?


    A generative model will learn categories of data while a discriminative model
    will simply learn the distinction between different categories of data. Discriminative
    models will generally outperform generative models on classification tasks.


    #### 50) Instance-Based Versus Model-Based Learning.


      Instance-based Learning: The system learns the examples by heart, then generalizes
    to new cases using a similarity measure.


      Model-based Learning: Another way to generalize from a set of examples is to
    build a model of these examples, then use that model to make predictions. This
    is called model-based learning.


    #### 51) When to use a Label Encoding vs. One Hot Encoding?


    This question generally depends on your dataset and the model which you wish to
    apply. But still, a few points to note before choosing the right encoding technique
    for your model:


    We apply One-Hot Encoding when:


      The categorical feature is not ordinal (like the countries above)


      The number of categorical features is less so one-hot encoding can be effectively
    applied


    We apply Label Encoding when:


      The categorical feature is ordinal (like Jr. kg, Sr. kg, Primary school, high
    school)


      The number of categories is quite large as one-hot encoding can lead to high
    memory consumption


    #### 52) What is the difference between LDA and PCA for dimensionality reduction?


    Both LDA and PCA are linear transformation techniques: LDA is a supervised whereas
    PCA is unsupervised – PCA ignores class labels.


    We can picture PCA as a technique that finds the directions of maximal variance.
    In contrast to PCA, LDA attempts to find a feature subspace that maximizes class
    separability.


    #### 53) What is t-SNE?


    t\-Distributed Stochastic Neighbor Embedding (t-SNE) is an unsupervised, non-linear
    technique primarily used for data exploration and visualizing high-dimensional
    data. In simpler terms, t-SNE gives you a feel or intuition of how the data is
    arranged in a high-dimensional space.


    #### 54) What is the difference between t-SNE and PCA for dimensionality reduction?


    The first thing to note is that PCA was developed in 1933 while t-SNE was developed
    in 2008. A lot has changed in the world of data science since 1933 mainly in the
    realm of compute and size of data. Second, PCA is a linear dimension reduction
    technique that seeks to maximize variance and preserves large pair wise distances.
    In other words, things that is different end up far apart. This can lead to poor
    visualization especially when dealing with non-linear manifold structures. Think
    of a manifold structure as any geometric shape like: cylinder, ball, curve, etc.


    t-SNE differs from PCA by preserving only small pair wise distances or local similarities
    whereas PCA is concerned with preserving large pair wise distances to maximize
    variance.


    #### 55) What is UMAP?


    UMAP (Uniform Manifold Approximation and Projection) is a novel manifold learning
    technique for dimension reduction. UMAP is constructed from a theoretical framework
    based in Riemannian geometry and algebraic topology. The result is a practical
    scalable algorithm that applies to real world data.


    #### 56) What is the difference between t-SNE and UMAP for dimensionality reduction?'
