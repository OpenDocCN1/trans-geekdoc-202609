- raw: '![Image](images/lock.jpg) Use the same secret combination of a special symbol
    and number in all your passwords. Use it at the start of the password and then
    in reverse order at the end. Never share your secret combination with anyone.


    ![Image](images/lock.jpg) Use a passphrase to devise your passwords. A passphrase
    contains seemingly random words strung together. Make sure it’s something you
    can remember but others can’t guess. Avoid using familiar phrases or famous quotes
    that others might know.


    ![Image](images/lock.jpg) Become creative when creating your passphrases. Substitute
    the number “1” for the letter “I,” use the symbol @ for the word “at,” and use
    the number “2” for the word “to.” You can also use a dollar sign (“$”) instead
    of an “S.”


    ![Image](images/lock.jpg) Write down the passphrases and keep them in a safe place
    only you know. Don’t store your secret combination of a number and special character
    with your passphrases. You’ll have to remember that combo in your head.


    ![Image](images/lock.jpg) Don’t enter your passwords on devices you don’t own.
    If you’re using a public computer at a library, Internet café, or hotel, avoid
    using your passwords for email, social media, and other mission-critical accounts.
    Those computers should only be used for anonymous Internet browsing because the
    networks probably aren’t safe.


    ![Image](images/chap.jpg)


    ## CHAPTER 8:


    ## Two-Factor Authentication


    LET’S REVIEW A COUPLE OF important steps that will help prevent you from becoming
    a cybercrime victim. First, you should by now be saying over and over again, “I
    will think before I click.” When you receive an email from a bank, credit card
    company, eBay, Amazon, Federal Express, or anybody else who asks you to click
    on a link, you’re going to stop, think, and then make a phone call to determine
    whether the email or text message containing the link is legitimate.


    Second, you’re no longer going to have the same password for multiple platforms.
    And surely you’ve already identified your mission-critical accounts, such as email,
    social media, cell phone, banking, and e-commerce. Those are the platforms that
    require the type of passphrases we discussed in the previous chapter. I showed
    you how easy it is to create and remember passphrases that consist of twelve characters,
    with upper- and lowercase letters, numbers, and at least one special symbol. Hopefully,
    you’ve written down your passphrases and put them in a safe place, and you have
    not written down your top-secret combination of a number and special character.
    Now that you’ve done enough to help you sleep a little better at night, we have
    another important security technique to implement.


    A woman approached me with a confident smile after one of my recent seminars and
    told me she’d been using multiple passphrases for years. She was using a lyric
    from one of her favorite songs as her passphrase, which consisted of twenty characters.
    I congratulated her and told her it was a great start, but then I asked her what
    would happen if I were somehow able to get my hands on her passphrase for her
    bank account. I told her I would be able to log in to her account and steal her
    money. You can do everything correctly—not click on suspicious links and not use
    the same password for everything—and yet still become a victim. That sounds really
    depressing, doesn’t it?


    Well, fortunately, I’m going to tell you how to take the next step in keeping
    yourself safe and making it even more difficult for cybercriminals to make you
    a victim. It’s not a well-kept secret and it’s not going to cost you a penny to
    implement. Before I share this technique, though, let’s go back to the basics.
    If a bad guy steals your password, he is going to have access to all your personal
    information. And, no matter what you do, there is a good chance he’s going to
    be able to steal your money. What if I told you that it might not matter if he
    steals your password? Doesn’t that sound like a much better scenario? There’s
    an additional security measure that makes your passwords obsolete—even if a cybercriminal
    steals them.


    In the past few years, I’ve probably done more than two hundred cybersecurity
    threat briefings, including presentations to civic groups, students, corporations,
    and churches. During each of my presentations, I asked the audience two simple
    questions. The first one might sound a little silly, but humor me for a second.
    Here’s the question: Is there anyone in the audience who doesn’t use email to
    communicate; doesn’t use social media platforms such as LinkedIn, Facebook, Twitter,
    or Instagram to connect with others; doesn’t use online banking or e-commerce
    to shop; and doesn’t store information on a cloud platform? (A cloud platform
    stores data on the Internet through a cloud-computing provider such as Google
    Drive, Dropbox, or iCloud. They manage and operate data storage as a service,
    and millions of people use them to back up their contacts, email, documents, photos,
    music, and everything else. With cloud storage, you don’t have to purchase a storage
    device and can add or remove capacity on demand.) Unless you’re an Eskimo or Amish
    farmer, you’re probably using one or all of the platforms I mentioned every day.


    Now, the next question is even more important: do you use multi-factor authentication
    (MFA) or two-factor authentication (2FA) to access your platform? I always get
    a couple of confused looks from people in the audience when I ask this question.
    MFA and 2FA are pretty simple concepts—they involve more than a single password.
    Think of it this way: if I am able to log in to your Gmail account by simply stealing
    your password, then you’re not using MFA or 2FA. Multi-factor and two-factor authentication
    means something more than a password is required to access an account. It’s an
    extra layer of cybersecurity that only the user knows or possesses, like a piece
    of information such as a passcode, pin, or six-digit number that you use in addition
    to your password. When you attempt to log in to an account, the six-digit number
    is typically provided to you in either a text message to your cell phone, through
    an application on your smartphone, or by a hard token on a small device like a
    fob or thumb drive. Advanced biometric-based MFA even replaces traditional passcodes
    and token-based systems with your fingerprint, facial or voice recognition, iris
    scans, and other biometics. It’s the wave of the future, and it’s extremely cool.


    If you’ve never heard of MFA or 2FA, then today is your lucky day because I’m
    about to explain how easy it is to install them on your platforms. First, though,
    let me highlight a couple of scary cybercrime statistics to emphasize the importance
    of two-factor authentication. As you’ve probably figured out by now, cybercrime
    is big business around the world; annual economic losses from data breaches are
    in the trillions of dollars. I told you earlier that analysts predict cybercrime
    losses will reach $6 trillion by 2020! That’s more money than I can wrap my head
    around, but I’m afraid it’s probably accurate. I witnessed hundreds, if not thousands,
    of cybercrime cases while working for the FBI in Nashville, and I would estimate
    that victims in those cases probably lost in excess of $100 million. And those
    are only the cases that were actually reported to the FBI and that I personally
    helped investigate.'
