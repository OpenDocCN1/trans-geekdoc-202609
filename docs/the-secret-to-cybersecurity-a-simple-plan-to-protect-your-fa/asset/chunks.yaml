- raw: 'The largest victim of a BEC scheme that I ever worked with was a small company
    that lost $7.5 million. The company’s chief executive officer was traveling overseas,
    and a bad guy spoofed an email to the finance manager that was allegedly from
    the CEO. In the email, the impostor claimed he’d been forced to set up a new email
    account because he was out of the country and couldn’t trust the network security
    in his hotel. The impostor told the finance manager that he was working on a highly
    sensitive business transaction, and he directed the manager to await instructions
    from an attorney who would tell him how to proceed. A few hours later, the finance
    manager received an email from the attorney and then followed instructions to
    wire transfer $7.5 million to a bank in Hong Kong. To make matters worse, the
    CEO and finance manager didn’t talk for the next two weeks. By the time the CEO
    returned to the U.S. and discovered that his company had been victimized, it was
    too late to take action. I’ve seen numerous cases in which money was sent to banks
    in Hong Kong and China, where banking and privacy laws make it nearly impossible
    to obtain information, even for law enforcement. Their laws allow cybercriminals
    to act with impunity.


    Why was it so easy for cybercriminals to pull off a $7.5 million heist? Unfortunately,
    we tend to trust what’s included in our emails, and we rarely verify their contents
    by calling the sender on the phone. Cybercrooks have been able to swindle $12
    billion through BEC schemes. This not only harms victims but also severely damages
    the global economy. There’s a pretty simple solution: we must stop assuming every
    email can be trusted. I’ve had vendors approach me about products that are allegedly
    like silver bullets that supposedly reduce risk by keeping emails secure. However,
    I don’t think you should take a bad business process, wrap it in technology, and
    hope for the best. Instead, let’s create a policy that prohibits money from being
    transferred based on what someone’s read in an email or text message. Let’s require
    anyone wiring money to bank accounts in the U.S. or overseas to receive verification—either
    over the phone or in person. While it might seem like common sense for many people,
    that simple business practice would have prevented several of the problems I’ve
    discussed.


    I hate to say it, but that change might not be enough to eliminate BEC scams.
    The bad guys are constantly identifying weak business practices and inventing
    devious ways to exploit them. I’ll give you a good example: In my years at the
    FBI, I’d receive a flurry of calls from panicked CEOs or in-house accountants
    prior to April 15, which is the annual federal tax deadline for U.S. citizens.
    It happened every year because the crooks had undoubtedly devised a new way to
    exploit office managers, human resource officers, accountants, and anyone else
    working in payroll and taxes. In one case I investigated, a cybercriminal targeted
    a human resources department with a spoofed email that was supposedly sent from
    a company executive. The impostor requested every employee’s personally identifiable
    information and W-2 form for tax and audit purposes. In one week, I received phone
    calls from people at seven different companies that were victimized by this specific
    BEC scam. In each instance, the victims sent their employees’ sensitive information
    to the cybercriminals, and they couldn’t understand why they were targeted since
    they didn’t maintain employee information on their company websites. They were
    amazed when I showed them how the bad guys were able to target their workers through
    LinkedIn and other social media. Is this common practice in most businesses? What
    would the new HR officer in your company do if he or she received an email from
    the boss asking for this information? It only takes a phone call or face-to-face
    meeting to prevent something bad from happening.


    One of the most frustrating aspects of investigating cybercrime for the FBI was
    that, as soon as we educated the public on one type of BEC scam, the bad guys
    came up with another variation. It was almost impossible to keep up! In another
    case I investigated, Company X purchased an expensive widget from Company Y for
    $3.5 million. Once the transaction was approved, someone from Company Y emailed
    an invoice for $3.5 million to the accounts payable department at Company X. This
    type of transaction occurs in corporate America thousands of times every day.
    Company X’s accounts payable department was aware the invoice was coming, so the
    clerk started the process of arranging the payment. About an hour later, however,
    the clerk received another email from Company Y, which informed her that the initial
    invoice was incorrect and the company had been mistakenly overcharged $3,000.
    A second invoice containing the correct amount was being sent right away. So,
    what did the accounts payable clerk do? You guessed it. She started the process
    of paying the lesser total; five levels of management had to sign off on such
    a large invoice. Each person in the chain of command approved the payment, and,
    after the company’s top manager signed off, she initiated a wire transfer from
    Company X to Company Y for $3.497 million.


    About ten days later, an accountant from Company Y sent an email to the accountants
    payable clerk at Company X with a friendly reminder about the outstanding $3.5
    million balance. Obviously, the email caused quite a stir at Company X. The employees
    there checked the original email to see where the money was sent, and they discovered
    it was wired to Company Y’s bank account in the Middle East. There was only one
    problem: Company Y didn’t have a bank account in the Middle East! By the time
    someone from Company X called me to help, it was too late. The bad guys had already
    withdrawn the money from the bank account they controlled. And, due to the country’s
    bank privacy laws, the bank wouldn’t share information without a mutual legal
    assistance treaty that required me to get approval from the U.S. Department of
    Justice—something that would have taken months. My FBI colleague in this country
    told me he saw this type of illegal activity every day.


    Company X had a $10 million cyber-liability insurance policy; unfortunately, it
    was told this type of fraud wasn’t covered. The fraud policy only covered a loss
    if there were two parties involved in the authentication of a wire transfer. However,
    the accounts payable clerk at Company X never contacted anyone at Company Y before
    the money was sent. If she had reached out to someone there to verify the account
    number and new invoice total, she probably would have been told it was indeed
    legitimate—because she would have called the phone number on the bogus second
    email that the bad guys had sent. It would have been a lookalike domain that appeared
    to be from Company Y. Even though she probably still would have sent the money,
    the act of trying to verify the wire transfer details would have been enough to
    activate their insurance policy. Too late.


    Company X ended up spending $50,000 on private investigators who tried to track
    the criminals down. Guess what the investigators discovered? The cyberthieves
    had taken over a high-ranking employee’s email account at Company X because the
    company didn’t use two-factor authentication. The bad guys read his emails and
    discovered that Company Y was getting ready to send an invoice for $3.5 million.
    They set up a forwarding rule in the company’s email system and, when Company
    Y sent the invoice to Company X, they intercepted the email and sent the fraudulent
    invoice.'
