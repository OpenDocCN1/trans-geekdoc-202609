- raw: 'Now, I’m sure there are a couple of folks reading this right now who might
    say they don’t have anything to worry about because they own Apple computers,
    iPads, or iPhones. A lot of people incorrectly believe that those types of macOS
    or iOS devices are immune to the bad things I’ve been talking about. My friend,
    I hate to be the bearer of bad news, but the belief that Apple products are immune
    to malware is absolute fiction. In 2011, a malware attack attempted to steal Apple
    owners’ usernames and passwords by sending out an email with the subject line,
    “Apple update your Billing Information,” from a spoofed email address of [appleid.apple.com](http://appleid.apple.com).
    More recently, in February 2018, a fraudulent pop-up asked Apple users to enter
    their Apple IDs and passwords. The best advice I can give iOS users is to only
    enter Apple IDs and passwords within the Settings app or iTunes Store and never
    in pop-ups.


    I had one FBI case involving the owner of a small financial firm who was a long-time
    iOS user. His name was Rogers, and he received an email from a client with whom
    he was having a business dispute. The email subject line read, “Please read this
    important document.” There was what appeared to be a PDF document attached to
    the email. Rogers was curious, so he clicked on the PDF. Instead of seeing a document,
    Rogers was directed to a webpage that indicated there was a DocuSign document
    to see. DocuSign is a legitimate online company that facilitates the electronic
    exchanges of contracts and other sensitive documents. More than two hundred million
    people around the world have used it. Rogers told me that he thought his client
    was suing him, so he clicked on the DocuSign document. Unfortunately, Rogers was
    about to learn about cybercrime the hard way. He was a little leery when he received
    the document, so he replied to the sender and asked if the communication was legitimate.
    He didn’t realize that bad guys had taken over his client’s email account, and
    a response told Rogers it was indeed for real. When Rogers attempted to open the
    DocuSign document, he was taken to a webpage that instructed him to enter his
    Microsoft username and password.


    A few hours later, I received an unsolicited email from Rogers with the subject
    line, “Please read this important document.” The email included an attached PDF.
    At this point, Rogers hadn’t shared any details with me, so I quickly picked up
    the phone and called him. He was panicked after realizing someone else had access
    to his email account because he’d provided his Microsoft username and password.
    The bad guys had sent an email to more than one thousand individuals in his address
    book, many of whom were his clients. Even worse, the criminals deleted all of
    Rogers’ contacts in his address book, so he couldn’t send a follow-up email to
    warn them to delete the original message. The cybercrooks also had access to his
    OneDrive online storage account, which contained all his client records. And that
    wasn’t all! They were also able to obtain—you guessed it—a file that contained
    the passwords for each of his bank accounts. Now, do you still feel like you’re
    safe simply because you’re using an iOS device? The most important thing to remember
    is that bad guys want access to your usernames and passwords at any cost, and
    they are going to use every dirty trick they can to steal them. Your email account
    is a gold mine, and, once they have access, they’re going to use it to trick other
    people into giving up their usernames and passwords too. Or they’ll just install
    malware on their computers to do it for them.


    As I said, antivirus and intrusion detection systems aren’t always going to save
    you, and neither is an Apple computer. That’s why you need to completely change
    your mindset about online security. You need to become a human firewall, questioning
    every email you receive. If your bank sends you an email about something, pick
    up the phone and call a local branch. If you receive an email from FedEx or UPS
    about a delay in shipping and you’re not expecting a package, call them. And if
    you are expecting a package, don’t click the link and log in to a web portal.
    If you receive an email with a Facebook or LinkedIn friend request, don’t click
    on the link to log in to the application or website. If your best friend or a
    family member sends you an email with a link or attachment, think twice before
    clicking on it. Send them an email first to ask if it’s legitimate. I could go
    on and on with the different scenarios I saw while investigating cybercrime for
    the FBI.


    Because phishing emails are more sophisticated and advanced than ever before,
    it’s much easier to be tricked into clicking. Some of them are so good, I’m afraid
    that even I might even fall for it one day. So, repeat after me: I will think
    before clicking on emails and will become a human firewall. Repeating that step
    one thousand times is the first step to being safe online.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Become a human firewall and examine every email you
    receive. Realize that bad guys want to use your email account as a weapon.


    ![Image](images/lock.jpg) Understand that bad guys desperately want you to click
    a link or open an attachment in an email. Unless you’ve thoroughly validated its
    authenticity, don’t click on it!


    ![Image](images/lock.jpg) Look at the time an email was sent. If it was sent at
    2:30 A.M. and you know that person never sends email that late, don’t open it
    before verifying it.


    ![Image](images/lock.jpg) Check the other recipients of the email. If an email
    was sent to a large group of people, it usually means the account was compromised
    and an automated program sent the message.


    ![Image](images/lock.jpg) If you receive an email with an urgent message from
    your bank, credit card company, utility company, FedEx, UPS, Amazon, eBay, Facebook,
    LinkedIn, Instagram, or any other financial institution or social media application,
    don’t open it or click on a link! Log in to the actual account manually through
    a browser or application to check if there’s a legitimate issue.


    ![Image](images/lock.jpg) Make a list of important telephone numbers, such as
    your bank and credit card companies, and call the numbers you have instead of
    the ones included in suspicious emails.


    ![Image](images/lock.jpg) If you receive an email containing a friend request
    from social media, do not click on the link in the message to log in to the account.
    Bad guys love to use social media friend requests to target victims. If I receive
    a connection request from LinkedIn, I automatically delete the email and then
    log in to the actual LinkedIn application to see if it’s a legitimate request.


    ![Image](images/lock.jpg) This is very important: Do not store your usernames
    and passwords for financial institutions, credit card companies, utilities, email,
    and social media on OneDrive, Dropbox, Google Drive, or iCloud. Write them down
    on a sheet of paper and store the physical copy somewhere safe.


    ![Image](images/chap.jpg)


    ## CHAPTER 5:


    ## Mobile Device Safety


    I’VE TALKED ABOUT THE IMPORTANCE of thinking before you click on email, but there
    are other ways cybercriminals will try to trick you. My sister, Bonni, is the
    principal of an elementary school in Long Island, New York, and she is an understandably
    busy person. Recently, she received a text message from her bank, informing her
    that her checking account was overdrawn because of a $2,000 transaction. The text
    from the bank instructed her to click a link that would take her to the bank’s
    website for an important message. If she didn’t address the problem immediately,
    the text message said, she’d be charged a hefty overdraft fee.'
