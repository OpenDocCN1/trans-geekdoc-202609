- raw: 'A few years ago, I met with representatives of an organization that earned
    about $300 million annually, and we dissected its most mission-critical asset:
    its bank account—or, more specifically, its access to its bank account. The company
    had an information technology manager whose sole responsibility was to ensure
    the company’s technology operated effectively and efficiently. I asked him a series
    of questions and discovered that the company didn’t utilize two-factor authentication
    and didn’t have a designated computer for banking. At the conclusion of my meeting,
    I had an in-depth briefing with the company’s executives and brought up my concerns.
    They explained that their bank didn’t offer two-factor authentication, but they
    didn’t want to change banks because they had a long-standing relationship. When
    I addressed the issue of not having a designated computer for banking, the company’s
    chief financial officer complained that he didn’t like the idea of having two
    computers on his desk. In the end, the company decided it would take its chances
    with its current setup. When the meeting was over, one of the executives asked
    me a question that I hear all the time, “Why would anyone want to target us? We’re
    not a large company.” Remarkably, he was talking about a company that earns $300
    million per year.


    Another question I hear at conferences all the time involves bank apps for mobile
    devices. More and more, Americans are avoiding the long lines at banks and credit
    unions for the convenience of online and mobile banking. According to the Federal
    Financial Institutions Examination Council, the number of commercial banks and
    savings institutions decreased from 13,401 in 1988 to 4,852 at the end of the
    first quarter of 2018. Why? It’s because everyone is replacing traditional banking
    with online and mobile banking. While Americans are abandoning brick-and-mortar
    banks for their smartphones and computers, reports suggest that most still have
    security-related concerns when using online and mobile banking. And there’s legitimate
    reason for concern when we can do everything from paying our bills to depositing
    checks on mobile devices.


    So, are bank apps safe? A few years ago, I was speaking at a big conference in
    Nashville, Tennessee, and the audience consisted of bank executives from around
    the country. I asked the audience how many of their banks offered apps, and almost
    everyone in the ballroom raised their hands. Then I asked, “Do any of your banks
    have an IT guy on staff who developed the app?” No one raised his or her hand.
    Banks don’t write apps; they have somebody else write them for them. Then I asked
    the question that people ask me all the time, “Are bank apps safe?” I looked out
    into the audience and everyone was staring back at me. It was dead silence. I
    said, “Come on guys, it’s either safe or it’s not.” Again, dead silence. So, I
    asked, “What if I was your customer? What would you say to me?” Still nothing,
    and, boy, was I losing my audience with that question. I finally said, “That’s
    why I’m here today. I found out that the answer is no.” I told a white lie to
    the bankers and claimed to have tracked down a guy in the Ukraine who developed
    a lot of their apps. I joked that I thought I’d heard him say, “Yes, bank apps
    are safe,” or maybe he said, “Nyet,” which is Russian for no.


    I use this story a lot because we don’t know who is writing the bank apps—or any
    other apps, for that matter—that we use every single day. Have we vetted the developers
    to make sure they’re good guys and not Boris Badenov’s first cousin? And, even
    if they are good guys and can be trusted, how secure are the apps they’ve created?
    Did they use a security framework to test the app and make sure it was safe? Or,
    did they just bring it to market as quickly as possible to get paid? Like a lot
    of other things involving the Internet, it’s all about having faith. Do I use
    my bank’s app? Yes, I do. As I told you earlier, I’m not willing to move in with
    the Eskimos.


    So, for argument’s sake, let’s assume your bank app is 100 percent safe. That’s
    great—as long as you don’t have any other apps on your smartphone. Apps are here
    to stay, and we’ll continue to download them, install them, and run them on our
    phones to play games, read email, watch live sporting events, listen to music,
    and do just about anything else. But I’m worried that apps are the newest attack
    vector for the bad guys. They realize how much we use apps, and I’m sure they’re
    developing countless ways to penetrate deficiencies in them. I honestly believe
    apps are the future of cybercrime, and that scares the heck out of me. In 2018,
    there were 3.5 million apps for Android users and 2.1 million in the Apple App
    Store. If you believe every one of them is safe and secure, I’ve got some Enron
    stock I’d like to sell you. Remember, the biggest threat in online and mobile
    banking comes from using a compromised device, one with malware that steals a
    username and password. So think long and hard about what you’re doing before you
    download and install another app on your phone. Every app you add alongside your
    banking app is one more opportunity to get hacked.


    Many years later, I bumped into the lawyer who lost $50,000 of his client’s money
    to a bank in Moscow. He told he purchased a second computer the next day—and that
    it was the best decision he’d ever made.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Be aware of your bank’s policy for reporting fraud,
    including timelines and reporting requirements, which could be as few as twenty-four
    hours for commercial accounts.


    ![Image](images/lock.jpg) Purchase a separate computer for online banking and
    don’t use it for any other purpose—period.


    ![Image](images/lock.jpg) Equip your computers with up-to-date antivirus software
    and firewalls to block unwanted access.


    ![Image](images/lock.jpg) Educate your employees about the dangers of clicking
    on unsolicited email and attachments. The website [www.BusinessIDtheft.org](http://www.BusinessIDtheft.org)
    is a great resource for educational materials, resources, and tips on preventing
    theft and fraud.


    ![Image](images/lock.jpg) Restrict employees’ use of computers for non-business
    activities, such as social media, e-commerce, and Web surfing.


    ![Image](images/lock.jpg) Never access bank websites or mobile apps through public
    Wi-Fi in places like coffee shops, airports, or hotels. Those networks aren’t
    secure and are extremely vulnerable to cybercrime.


    ![Image](images/lock.jpg) Before downloading any bank app from your phone’s app
    store, pay close attention to the name of the app provider or source in the app
    store description. Be sure you’re actually downloading the bank’s real app and
    not a cybercrook’s lookalike. Cybercriminals will create lookalike fake apps to
    steal your login credentials and account and routing numbers.


    ![Image](images/lock.jpg) Make sure your mobile devices require a password or
    biometric authentication, such as a fingerprint, for logging in. That will make
    it more difficult for criminals to access your phone if it’s lost or stolen.


    ![Image](images/lock.jpg) Be sure to log out of your bank’s website or app after
    using it. Leaving them open will make it easier to access if your device is lost
    or stolen.


    ![Image](images/lock.jpg) Set up fraud alerts through email, text messaging, or
    your bank’s app, which can help alert you to suspicious or fraudulent activity.


    ![Image](images/lock.jpg) Monitor and reconcile your bank account balances and
    transactions daily to report suspicious and fraudulent transactions immediately.


    ![Image](images/lock.jpg) Consider using credit cards rather than commercial bank
    accounts for business expenses. Some credit cards offer more generous protections
    in regards to fraud and theft.'
