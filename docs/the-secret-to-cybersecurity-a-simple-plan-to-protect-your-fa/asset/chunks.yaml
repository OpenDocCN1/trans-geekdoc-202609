  trans: '

    全球有数百万人转向 `Tinder`、`OkCupid`、`Coffee Meets Bagel` 和 `Match.com` 等约会软件来寻找完美匹配，而越来越多的网络犯罪分子正在猎捕这些善良的人。为了进入你的钱包，他们会首先锁定你的心。这些分子的虚假资料通常非常相似：他们把自己装成四十到六十岁的白人男性，自称读过美国大学，并声称现在居住在海外。这种刻绘将骗子塑造成目标人物眼中浪漫小说中的男主角。虚假资料通常包含一些诱惑，潜在的窃贼试图让自己表现成真实、值得信赖的人，如军人员、援助工作者或在海外工作的专业。这些虚假的“罗密欧”从不谈论性，而且他们似乎与受害者有很多共同点。寻找相似之处很容易，因为在他们的约会简介中提供了大量关于爱好、背景和兴趣的信息。这正是坏人作案所需的所有信息。


    2016 年，联邦调查局（FBI）的网络犯罪投诉中心收到了近近 1.5 万份情感诈骗报告，损失金额超过 2.3 亿美元。受害者最多的美国州是加利福尼亚州、佛罗里达州、德克萨斯州、纽约州和宾夕法尼亚州。在某些外国，你会发现网络犯罪分子排坐在电脑前，每个人都在出鱼线，试图钓到富有的受害者。2018
    年 6 月，纽约西区美国检察官宣布，居住在底律的 32 岁加纳公民 `Adams Amen` 对合谋实施电信诈诈罪认有罪。政府指控，在 2015 年 3 月到
    2017 年 6 月期间，Amen 与其他加纳国民合谋，利用 `MillionaireMatch.com` 约会网站策划了一个网络浪漫骗局，从多名受害者那里骗了近
    100 万美元。网络犯罪分子伪造了虚假的名字和简介，或者冒用别人的身份。在这个案例中，一名受害者收到了一张她认为是 `Marvin Roecker` 的男人的照片。这张照片实际上是德克萨斯州一名房地产中介，他的名字并不叫
    `Marvin Roecker`，而且完全没有参与此案。


    布鲁克就像许多情感诈骗的受害者一样，他们主要是年长的女性、离婚或丧偶、精通电脑且受过良好教育。她们在情感上很脆弱，网络犯罪分子完全清楚该如何拨动她们的心弦。目标是布鲁克的骗子是一个行内专家。我确信他花了几个小时磨练技巧，并且很可能记了日记，以便更好地如何操纵和剥削她。由于他可能同时在处理几个潜在受害者，那本日记非常重要；那可能就是他保持谎言不穿帮的方法。布鲁克和安东尼通过约会软件交流了几天，然后他建议他们通过短信、电话和电子邮件进行更私私的聊天。当我问布鲁克是否曾经见过安东尼本人时，她说她几乎每天都和他聊天。正如你可能注意到的，她没有回答我的问题。当我再次问她这个问题时，她回答说他们要一起搬到墨西哥，并在那里幸福生活。布鲁克是一个受过良好教育的女性，在大公司担任重要职位。但当她回答关于安东尼的问题时，她听起来像一个被男朋友玩得团团转的、幻幻的十五岁女中生。


    布鲁克告诉我，安东尼安排让她收到一笔 50 万美元的电汇，然后她应该将这笔钱汇给他们在墨西哥的房屋建筑商。这个请求在布鲁克看来完全合法的；安东尼是她的一生挚爱，她没有理由怀疑他的意图。周一早上，布鲁克收到安东尼的短信，确认
    50 万美元已汇入她的银行账户。他告诉她建筑商当天就需要这笔钱，以便为她的梦想厨房订花岗岩台面，增加了紧迫感。布鲁克下班去银行亲自办理交易。她见到一位乐意帮助她办理电汇的经理。布鲁克的账户余额从未超过过
    5000 美元，从未收到过如此大额的电汇，也从未向国外汇款。但分行经理从未问过布鲁克为什么要向国外汇如此大笔资金。在大多数情况下，银行在教育客户和警示诈骗方面做得足够充分。即使这位特定的经理建议布鲁克她可能卷入了骗局，我想她可能并不会相信他。


    在布鲁克向海外账户汇出 50 万美元后几天，那家据称转账出售安东尼家族地产所得的汇出银行撤回了该电汇。这笔钱实际上属于美国的一家权证公司，该公司是企业电子邮件诈骗（BEC）的受害者。另一个网络犯罪分子向权证公司伪造了邮件，并指示那里的人将房地产交易的收益汇入布鲁克的账户。布鲁克不仅是情感诈骗的受害者，银行还将她视为某项挪款计划的嫌疑人。当她最终意识到安东尼不是真实的，她以为自己爱的男人是一个网络犯罪分子时，她的生活天翻地覆了。此案中真正的财务受害者是那家权证公司，他们从未收回过钱。但向一个受过良好教育的成年女性解释她被一个尼日利亚网络犯罪分子骗了，对我来说太痛苦了。


    当权证公司的银行试图从布鲁克的银行追回 50 万美元时，钱已经没了。然而，银行扣留了 1.5 万美元，那是布鲁克赚取并储蓄的钱。但当她尝试从另一家银行追回资金时，被告知她还要负责还剩余的
    48.5 万美元。布鲁克崩溃了，自责自己太愚蠢。受害者的心理创伤是双重的：首先，他们必须应对他们认为的严肃感情关系的结束；其次，更糟糕的是，他们会产生自责，他们的家人和朋友也是如此。


    2017 年 2 月，FBI 分享了另一个情感诈骗受受害者的案例，该受害者非常有勇气分享自己的故事，希望其他人能避免受害。和布鲁克一样，这位女性五十多岁。她住在德克萨斯州，处于一段情感虐待的婚姻中。她在网上遇到一个叫查理的男人，查理说是“朋友的朋友”。查理注意到这位女性是一个坚定的基督徒，她在脸账号上公开发布了这一点。他告诉她自己也是基督徒，在加利福尼亚从事建筑业。在接下来的几个月里，他们通过电话一起祈祷、唱诗，并在周日下午讨论讲道。在几个月的交流后，查理联系她说他需要
    3 万美元来完成一项工作。他承诺在 24 到 48 小时内还钱。她为他的请求祈了祷，并决定汇出这笔钱。她几天没有收到查理的消息了——直到查理又要求了额外的
    3 万美元。在接下来的两年里，这位女性最终向查理汇了约 200 万美元。当她的财务顾问注意到她的账户不断减少时，他联系了她并建议她联系 FBI。

