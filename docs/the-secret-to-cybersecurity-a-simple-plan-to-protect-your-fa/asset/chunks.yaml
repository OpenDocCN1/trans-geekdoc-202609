    # 测验时间！


    假设你刚刚在邮箱账户上安装了 `2FA`，现在正坐在餐桌旁。突然，你的手机震动了，通知你收到了一条短信。你查看短信，发现是一条来自 `Gmail` 的随机六位数字代码。由于你正坐在桌边吃早餐并在笔记本电脑上查读邮件，你清楚自己并没有从不可信的设备登录。发生什么事了？有人尝试从一台不可信的电脑登录你的
    `Gmail` 账户，可能是他们通过某种方式窃取了你的用户名和密码。


    但是，由于你花时间安装了 `2FA`，他们仍然无法破解你的账户。他们是如何做到这一步的？可能是零售商、加油站、医疗保健提供者或银行发生了另一次数据泄露，不幸的是，这种情况似乎每天都在发生。或者当你的岳父母使用你的电脑时，电脑上被安装了键盘记录器。坏人尝试碰运气，使用了多个平台上不同账户的用户名和密码。如果你的
    `Gmail` 密码和你银行网站的密码一样呢？尽管这个潜在的小偷没能访问你的邮箱，但他可能仍然可以使用同一个密码访问你的在线银行。希望你已经学会了保护自己，不再为每个账户使用相同的密码，这样你就不必担心了。


    使用独立的密码和 `2FA` 是一个很好的开始。现在你已经锁定了你的邮箱账户，是时候用 `2FA` 锁定你的社交媒体了。


    ## 如何避免成为受害者


    ![Image](img/lock.jpg) 意识到坏人想将你的邮箱账户作为武器来攻击你的家人、朋友、工作同事及其他人。


    ![Image](img/lock.jpg) 仅使用提供双重身份验证的电子邮件供应商，例如 `Gmail`、`Outlook` 和 `iCloud`。你可以在
    [www.twofactorauth.org](http://www.twofactorauth.org) 找到提供和不支持服务的供应商。


    ![Image](img/lock.jpg) 从 Google Play Store 或 Apple App Store 在智能手机上下载如 `Duo Mobile`、`Google
    Authenticator` 或 `Microsoft Authenticator` 等身份验证器应用，随机生成安全代码，而不是通过短信接收代码。


    ![Image](img/lock.jpg) 如果你通过 `SMS` 短信使用 `2FA`，请为 `Google` 创建包含十个备份 `2FA` 代码的列表，并将其设置为你记得但别人无法识别的代码。将它们写下来并放在安全的地方，以防你丢失手机或在使用不可信设备时无法接收代码。


    ![Image](img/lock.jpg) 如果你使用 `SMS`，请确保联系你的移动运营商并实施秘密 `PIN` 代码，以确保其他人无法访问你的号码。


    ![Image](img/lock.jpg) 不要从不可信设备访问你的邮箱账户。仅从你拥有的电脑和移动设备访问邮件。


    ![Image](img/lock.jpg) 避免为邮箱账户使用基于 `SMS` 的 `2FA`。有更安全的选项，且基于 `SMS` 的 `2FA` 受到
    `SMS` 钓鱼和 `SIM` 劫持的影响，这些攻击仍然相当有效。


    ![Image](img/chap.jpg) 避免为邮箱账户使用基于 `SMS` 的 `2FA`。


    ## 第章：社交媒体安全


    社交媒体驱动一切


    社交媒体是个人和职业用途的强大工具。然而，全球许多人使用 `Facebook`、`Twitter`、`Instagram` 和 `LinkedIn` 等平台。`Sprout
    Social` 最近的一项调查发现，68%% 的 18 至 29 岁的美国人使用 `Facebook`。每天有超过百万的用户使用 `Twitter`，而 `Instagram`
    正在快速增长。


    我们使用社交媒体的方式改变了一切，但也伴随着风险。如果坏人能够破解你的社交媒体账户，他们可以造成无法修复的损害。企业社交媒体账户是客户、合作伙伴和朋友信任的平台。


    ## 破解的风险


    但没有人是完美的，假设 Bill 的公司 Facebook 账户被破解了。这种情况每天都在世界范围内发生。如果 Bill 收到一封来自未知或已知发送者（他认识的人）的鱼叉式攻击邮件，然后他点击了一个本该避开的链接呢？想象一下，当
    Bill 点击链接时，坏人安装了键盘记录器并窃取了他的密码。


    有了 Bill 的用户名和密码，黑客可以轻松登录他的 Facebook 账户。大多数机构此时不会太担心，因为他们的 Facebook 账户并不包含客户的任何敏感信息，如出生日期、出生地、银行账户、信用卡或社会安全号码。但如果黑客根本不想要这些信息呢？如果他想要的是更重要的东西呢？什么比这更重要？信任。


    ## 冒充


    现在假设骗子盗取了 Bill 的身份并变成了冒充者。他随后能够利用 Bill 的 Facebook 账户向所有的朋友和客户发送信息，通知大家他刚刚获得了一个大订单，这把他的公司推向了新的高度。冒充者告诉他们，Bill
    非常激动和感激，这一切发生完全归功于他们的支持和推荐。Bill 想通过给他们提供一张免费大杯 `Starbucks 咖啡` 数字优惠券来表示感谢。Bill
    的朋友和客户只需点击消息中的链接，就会重定向到一个网站，他们可以在那里打印优惠券或将其电子化存储在智能手机中。Bill 的朋友和客户可能会认为这条信息是真实的，因为他成功且总是慷慨。


    现在，当我第一次向 Bill 描述这个场景时，我问他有多少朋友和客户可能会点击链接并领取免费咖啡。他估计可能有 80–90% 的人会这样做。


    '
