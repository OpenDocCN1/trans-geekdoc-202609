- raw: 'Money mules perform an essential task for bad guys—they launder stolen money
    or merchandise and transfer it to cybercriminals who are usually located overseas.
    The mules are paid a flat fee or a certain percentage of the stolen funds for
    their services, and they’re often stiffed or dropped after only one transaction.
    From January 2015 to June 2016, the FBI’s Internet Crime Complaint Center said
    it received 22,143 complaints related to online money muling, totaling more than
    $3 billion in losses. Here’s the really scary part: Money mules are complicit
    and risk criminal prosecution, even if they were unknowingly part of the scam.
    In many of the cases, however, the mules knew exactly what they were doing. In
    January 2018, a California woman was charged with acting as an intermediary in
    three email scams that stole more than $360,000 from three people in Minnesota,
    according to published reports. Federal authorities said the first email scam
    stole $205,704 from a home buyer; the second netted $90,000 from a woman who believed
    she was sending money to a woman involved in the gem industry in Dubai; and the
    third victim sent multiple deposits totaling $86,000 to a woman searching for
    love on Craigslist. Money mules are a worldwide problem. In November 2017, the
    U.S. assisted Europol and other European countries in Operation European Money
    Mule Action, which resulted in one hundred and fifty-nine arrests and fifty-nine
    money-mule organizers being identified.


    Sadly, most of the money mules I interviewed while working for the FBI were unwitting
    accomplices in these scams. One such case involved a man we will call Drew, a
    disabled veteran of the Gulf War. The emotional and physical scars of the war
    took a heavy toll on Drew, who lost his job and family because of post-traumatic
    stress disorder. Once his wife and teenaged children left, Drew became an alcoholic
    and prescription pill abuser. He wasn’t able to hold down a job and barely survived
    on his medical disability pension from the military. He finally sought help from
    a church and was slowly able to turn his life around through Alcoholics Anonymous
    and a lot of prayer. With his life seemingly back on track, Drew believed his
    prayers were answered when he responded to an employment listing on Craigslist.
    The job was a work-from-home position with flexible hours and no outside sales.
    The advertisement said the company was looking for someone with strong financial
    and communication skills. Drew had earned a bachelor’s degree in finance through
    the GI Bill, and he believed the job was an opportunity he couldn’t pass up. He
    replied to the job listing with his resume, and then he received an email from
    an individual who identified himself as Mr. Bart a few hours later.


    Bart claimed to be the chief operating officer of a global company that was based
    in Ireland and allegedly purchased and sold high-priced commercial drilling equipment
    for oil exploration. Bart told Drew that the company was expanding into the Asia-Pacific
    Region and needed an executive in the U.S. who would work with vendors located
    around the world. Drew was told there was a training program, the hours were flexible,
    and he could work either part-time or full-time. His starting salary would be
    between $31.15 and $67.15 per hour depending on his skill level, and medical and
    retirement benefits were available to full-time employees. Drew felt like it was
    his lucky day; the job offer was the answer to his prayers. After Drew accepted
    the position, Bart directed him to open a commercial checking account in the name
    of Equipment Leasing Procurement International at a bank in the area where he
    lived. Once Drew opened the account, he sent the bank name and account and routing
    numbers to Bart. Over the next few days, Bart and Drew communicated via text messaging
    and Skype. Bart told Drew he would be getting new computer equipment and that
    it should be delivered within a few days.


    Around 11:30 P.M. one night, Drew received a telephone call from Bart, who apologized
    for calling so late. It was 6:30 A.M. in Ireland, and Bart sounded stressed and
    frantic. He told Drew that the company had just located a hydraulic 9718 core-drill
    processor through a company in Hong Kong. Bart explained that a wire transfer
    of $5.5 million was coming to Drew’s account, and he needed Drew to wire the money
    to a bank in Hong Kong as soon as his bank opened. When Drew arrived at his bank
    the next morning, he sat down with the branch manager, who seemed suspicious that
    so much money was being wired out of the country. The manager logged into his
    computer and saw that a $5.5 million wire transfer was indeed coming from another
    bank in the Midwest. When reached by phone, the manager at the other bank confirmed
    that the transaction was legitimate; she’d already contacted the controller of
    the company on the account, who said the money was for a large acquisition. The
    bank manager returned to Drew with a big smile and even offered to take him to
    lunch once the transaction was processed.


    After leaving the bank, Drew sent a text message to Bart, informing him that the
    money had been wired to the bank in Hong Kong. Bart thanked Drew for doing a great
    job and promised that a big bonus would be in his account within a few hours.
    Drew couldn’t believe how great the opportunity was turning out to be. For the
    first time in years, Drew felt like he was on top of the world. His life was getting
    better, and he decided he needed to go to church to thank God for all of his good
    fortune. At the same time, a cybercriminal in West Africa was probably jumping
    up and down and celebrating too. He’d probably just spoken to his colleague in
    Hong Kong, who confirmed that he’d received a $5.5 million wire transfer from
    an American bank. It was the type of score that would change a cybercriminal’s
    life. After he distributed his partners’ shares and most likely paid off more
    than a few bribes, this twenty-something cybercriminal would still be one of the
    richest men in his country. And, amazingly, it took very little effort and even
    less risk to pull off the heist.


    A few weeks later, FBI agents visited Drew’s house and interrogated him like a
    guy who was suspected of embezzling $5.5 million from a bank. Drew explained that
    he hadn’t kept any of the money for himself—it had all been wired to a bank in
    Hong Kong. When an FBI agent asked Drew why he’d sent the money there, he told
    him he was only doing his job. The agent asked Drew why he didn’t find it suspicious
    that his new job required him to send large amounts of money overseas—and why
    a company would entrust a new employee with so much responsibility. It took Drew
    only a few minutes to realize he’d participated in a $5.5 million scam and might
    face criminal prosecution. To make matters worse, the bank froze Drew’s account
    and seized whatever money was still in it. Suddenly, his life didn’t seem so rosy
    and had taken a turn for the worse.'
