- raw: 'And then there are the growing fields of blockchain and cryptocurrency. I’ve
    heard so much discussion recently about blockchain, which is the technology at
    the heart of bitcoin and other virtual currencies. Blockchain is essentially a
    database that is shared across a network of computers; the Harvard Business Review
    describes it as an “open, distributed ledger that can record transactions between
    two parties efficiently and in a verifiable and permanent way. The ledger itself
    can also be programmed to trigger transactions automatically.” Each party on a
    blockchain has access to the entire database and its complete history. No single
    person or entity controls the data or the information, and, once a transaction
    is entered into the database and accounts are entered, the records can’t be altered
    because they’re linked to every other transaction that occurred before them. Users
    are given a unique thirty-plus-character alphanumeric address that identifies
    them or they can remain anonymous. I recently participated in a panel about blockchain,
    and everyone is talking about how it is the new technology for information security.
    However, based on the discussions I’ve had, I can’t understand how blockchain
    would have prevented any of the crimes we’ve discussed in this book. I’m sure
    there are many practical applications for blockchain, and I’ve noticed that a
    lot of companies and organizations are exploring blockchain as information security
    solutions. But, when they’re not yet implementing the basics and fundamentals
    of cybersecurity, blockchain isn’t going to change anything.


    I’m gravely concerned about the growing market for bitcoin and other cryptocurrency.
    Now there are even ICOs, which are Internet coin offerings. People are investing
    a lot of money in bitcoin and other cryptocurrency, and businesses are starting
    to jump on the bandwagon too. I heard a presenter talking about bitcoin and cryptocurrency,
    and I couldn’t help but snicker while listening to him. The moderator asked me
    why I was laughing, and I said, “Look, my only experience with cryptocurrency
    was with cybercrime victims who had to use it to pay a ransom to have their personal
    information unlocked.”


    Cybercrime groups are already targeting cryptocurrency. The infamous North Korean
    cybercrime ring Lazarus has been targeting cryptocurrency exchanges, fintech (financial
    technology) companies, and banks with a malware campaign called AppleJeus, and
    they’re not alone in trying to break into these exchanges. Are there legitimate
    purposes for cryptocurrency? I’m sure there might be some out there, but I’ve
    only seen it used by cybercriminals.


    In conclusion, I have to say that I was very, very humbled to work with the FBI
    for twenty-nine years. I know there has been a lot of controversy associated with
    the FBI over the years, but I was extremely proud to work for such a tremendous
    organization. I’m also honored to have been able to share my experiences with
    you. Hopefully what you learned will help prevent you from becoming the next cybercrime
    victim.


