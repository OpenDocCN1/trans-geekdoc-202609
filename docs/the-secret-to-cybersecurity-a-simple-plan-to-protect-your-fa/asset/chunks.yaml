- raw: 'As a result of this very expensive lesson, the accounts payable clerk was
    fired (because someone always gets fired in cases like these). But was the right
    person terminated? Did Company X have a policy in place that required voice confirmation
    whenever a bank account number is changed? The clerk was only doing her job. If
    the company had used two-factor authentication, the bad guys would have never
    cracked into the high-ranking employee’s email to know the transaction was about
    to take place. Furthermore, one of my sources at the company told me the information
    security manager proposed requiring two-factor authentication about a year before
    the incident. Upper management rejected his recommendation because it didn’t want
    to spend the money and time on something that was such “a pain in the rear” to
    use.


    So, I’ll ask the question again: Was the right person fired?


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Implement two-factor authentication for any wire transfer.


    ![Image](images/lock.jpg) Never send a wire transfer based on the contents of
    an email; call someone directly or meet face-to-face with the person initiating
    or invoicing the wire transfer to verify the payment details.


    ![Image](images/lock.jpg) Utilize two-factor authentication for company email.
    Most BEC scams are successful because cybercriminals gain access to employees’
    email accounts.


    ![Image](images/lock.jpg) Before wiring the money, verify the bank account and
    routing numbers with account numbers you have on hand. If it’s the first transaction
    with a new vendor, call someone at the company to verify the bank information.


    ![Image](images/lock.jpg) If you’re calling someone at a new vendor to verify
    bank information, call a phone number you have on hand or search for the number
    in a directory. Don’t call the number included in the email.


    ![Image](images/lock.jpg) Compare the email address on invoices with email addresses
    you’ve previously received from the company. Verify that the invoice wasn’t sent
    from a spoofed email account.


    ![Image](images/lock.jpg) When replying to a suspicious or mission-critical email,
    use your email program’s Forward button instead of Reply. Then, type in the known
    email address of the person who allegedly sent you the message. By forwarding
    instead of replying to the message, you protect yourself from replying back to
    an illegitimate email from a spoofed account.


    ![Image](images/lock.jpg) Register any company domains that might be slightly
    different than your actual company domain. For instance, if your company’s domain
    is [jerrysbagels.com](http://jerrysbagels.com), then register jerrysbagels.co,
    [jerrybagels.com](http://jerrybagels.com), and [jerrysbagles.com](http://jerrysbagles.com).
    This will help prevent cybercriminals from registering spoofed domains.


    ![Image](images/lock.jpg) Establish one-time passwords or security questions for
    employees who might be traveling and might not have access to their phones. If
    an employee requests a wire transfer from the road, require that he or she provide
    the password or answers. Make sure the passwords and questions are strong.


    ![Image](images/lock.jpg) If you receive emails containing the phrases “code to
    admin expenses” or “urgent wire transfer,” be extra diligent about verifying their
    legitimacy. Victims of previous BEC scams reported those phrases were included
    in spoofed emails.


    ![Image](images/chap.jpg)


    ## CHAPTER 12:


    ## Real Estate Rip-Offs


    THOUSANDS OF HOMES ARE SOLD every day across the country. People who have worked
    hard and saved for years to purchase their dream homes are boxing up their belongings,
    preparing to put down new roots, and getting ready to make what will probably
    be the biggest financial transaction of their lives. Unfortunately, it only takes
    a cybercriminal a few minutes to spoil the American dream for a hopeful homebuyer.


    One of the most rapidly growing and financially damaging business email compromise
    scams targets people working in the real estate industry: buyers, sellers, real
    estate agents, mortgage brokers, bankers, and title insurance companies. Problems
    begin to arise when a cybercriminal compromises an email account of someone involved
    in the transaction—such as the buyer, seller, real estate agent, or closing attorney—and
    then creates a domain that is nearly identical. He’ll send an email to the buyers
    or someone at the title company, providing them with new bank account information
    for a down payment, closing costs, or the final purchase price. In many of these
    cases, the stolen money isn’t wired overseas, because that request would cause
    a big red flag for the would-be homebuyer. Instead, the bad guys will use a mule
    account to acquire the stolen funds before sending it overseas.


    In July 2018, the FBI’s Internet Complaint Center (IC3) reported that cybercriminals
    were increasingly stealing funds from the real estate sector, including title
    companies, law firms, real estate agents, buyers, and sellers. IC3 reported that
    fraud reports from people who were victimized by BEC scams involving real estate
    transactions increased by 1,100 percent from 2015 to 2017. And, in the same time
    frame, the money lost to such scams increased by 2,200 percent, peaking at more
    than $18 million during the quarter ending in October 2017. In 2017 alone, IC3
    reported receiving more than nine thousand complaints of online real estate fraud
    that resulted in losses of more than $56 million. In only the past few years,
    I’ve seen dozens of victims in Nashville, Tennessee, with losses totaling millions
    of dollars.


    Businesses of all sizes have fallen victim to this BEC scam, and the cyberthieves
    are even tricking some very smart people. In June 2017, New York State Supreme
    Court Justice Lori Sattler was scammed out of more than $1 million after she was
    duped while trying to sell her apartment and buy another one. According to published
    reports, Sattler was attempting to purchase a new apartment when she received
    an email that she believed was sent by her real estate attorney. The person claiming
    to be Sattler’s lawyer instructed her to wire $1.057 million to a specific bank
    account. Her stolen money was then forwarded to Commerce Bank of China, according
    to the reports. In August 2017, a Washington, D.C., couple was scammed out of
    $1.5 million as they prepared to purchase their dream home. The couple, both of
    whom were federal government workers, planned to use an inheritance to purchase
    a bigger home for their family. They put down a $200,000 down payment and were
    preparing for closing when they received an email that appeared to come from their
    title company. They replied to the email, which instructed them to wire the remaining
    $1.5 million to a bank account. But, when the couple arrived at the attorney’s
    office on the day of the closing, they were informed they’d been scammed. Investigators
    discovered that a cybercriminal had hacked into someone’s email account at the
    title company and spoofed an email to the couple. The victims notified the FBI
    and sued the title company in hopes of recovering their stolen money. They were
    still able to purchase the home with the rest of their inheritance, the published
    reports said, but they never saw that $1.5 million again.'
