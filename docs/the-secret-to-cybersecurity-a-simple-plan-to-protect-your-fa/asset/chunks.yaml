- raw: 'When I joined the FBI, I never could have imagined cybercrime would become
    my specialty. I was twenty years old when I was hired as a file clerk in the FBI’s
    New York field office in 1988. After my mother completed the application and submitted
    it on my behalf, she handed me $100 to buy two pairs of polyester slacks, four
    dress shirts, and two ties. I knew very little about computers and even less about
    the Internet.


    I eventually went back to college at night and was promoted to start doing more
    accounting and financial work within the FBI. Then I started working on an MBA
    in finance and information technology at Fordham University. The best part about
    attending Fordham was being surrounded by so many mentors—professors and the students
    who openly challenged them about the concepts they taught and whether things were
    being done the right way. I really enjoyed the challenge and had a renewed sense
    to learn. I just didn’t know if a career in law enforcement and the FBI was the
    correct path for me.


    I’d always been told that becoming an FBI agent was extremely difficult, and there
    was a hiring freeze in place, anyway. So, once I completed my MBA at Fordham,
    I was pretty sure I wanted to find a job on Wall Street. I wanted to introduce
    people who needed something to people who had something—and take my cut of the
    financial pie for making the deal happen. Even though I’d been working with the
    FBI for six years, I was still living in the same bedroom in my mother’s house
    that I’d been sleeping in since I was five years old. I knew I needed to start
    getting on with my life.


    But, before I could leave the FBI for a job on Wall Street, an unexpected opportunity
    opened up for me. The FBI’s hiring freeze came to an end in the spring of 1994
    and it started hiring new agents. People who already worked for the Bureau were
    given top priority, and my supervisor (who was like a father figure to me) encouraged
    me to apply. Much to his surprise, I told him I wasn’t interested in becoming
    an agent. He looked disappointed and then angry. He sternly told me I was going
    to apply to become an agent.


    About six months later, I left for new-agent training in Quantico, Virginia. I
    lost twenty pounds, passed the written test, interview, medical examination, background
    check, and polygraph test. When I graduated from new-agent training, I thought
    I’d be sent back to work in New York City or maybe even my first choice, Boston.
    Instead, I was assigned to a field office in Syracuse, New York. That might as
    well have been Iowa or Nebraska as far as I was concerned.


    If you would have asked me what my job description was in June 1995, it would
    have been very easy to describe: there were bad people doing bad things to good
    people, and my job was to work with state and local law enforcement to put the
    bad guys in jail. The end goal was to make upstate New York a much safer place
    for everyone. I worked a lot of white-collar crime, bank robberies, stolen property,
    and fugitive cases in the Northern Judicial District of New York. Really, I worked
    anything that came through the door as a new agent and the lowest man on the totem
    pole. I didn’t care. I had a gun, badge, and car with lights and sirens, and I
    was allowed to go out and play “Cops and Robbers” with my colleagues. It was a
    rewarding experience, and we managed to put a lot of bad people in jail.


    The turning point for me occurred in 1996, when I received a call from a representative
    of a small Internet service provider in upstate New York who wanted to talk about
    stolen property being sold over these things called bulletin boards. I met with
    the man and everything he described seemed so foreign to me. I’d taken a few programming
    courses in high school, and I probably knew more about computers than most FBI
    agents. The release of Windows 95 made things much easier for computer novices.
    It was almost plug-and-play for users like me, and that’s how I became interested
    in computers. It suddenly occurred to me, though, that I needed to learn a lot
    more about computers, the Internet, and the growing threat of cybercrime.


    I was so motivated that I went home and purchased a $2,500 Gateway computer system,
    which had a blazing fast 133 MHz processor and 40 MB hard drive. That probably
    made me the only FBI agent in my field office who owned a personal computer. I
    enrolled in an Internet course at the State University of New York at Oswego,
    but I had to cover the costs myself. My supervisor couldn’t understand why the
    FBI needed to be concerned about what was happening on the Internet! He couldn’t
    have known that I would retell that story thousands of times over the next several
    years.


    Almost by default, I became “the Internet guy” in the Syracuse field office, which
    really wasn’t the cool, fun, sexy job to have. While other agents were working
    bank robberies, drug cases, and chasing down fugitives, I was tracking down eighteen-year-old
    kids trying to hack into mainframes. To be honest, I’m not sure anyone else in
    my field office understood what I was doing. Back then, there were very few people
    who actually owned home computers, and cybercrime was in its infancy. There were
    only a handful of FBI agents around the country who were involved in these types
    of cases. They were mostly working investigations that involved young thrill seekers
    who were trying to gain access to the Pentagon’s computer network so they could
    brag about it to their buddies in online chat rooms.


    But cybercrime took a sinister turn in the late 1990s, when American consumers
    started using credit cards online to pay for goods and services—the beginning
    of e-commerce. When the notorious criminal Willie Sutton was asked why he robbed
    banks in New York during the 1930s, he simply replied, “Because that’s where the
    money is.” Near the end of the twentieth century, a lot of money moved to the
    Internet, so that’s where the bad guys went to commit their crimes. It was up
    to me to figure out how to stop them. Initially, the phone in our Syracuse field
    office wasn’t ringing off the hook to report cybercrime, so I took a more proactive
    approach. I identified the largest potential targets in town that bad guys might
    want to harm. Then I began meeting with different companies and building relationships
    with the right people in the most vulnerable industries.


    In 1998, the FBI made its first attempt to establish a national cyber strategy,
    which included dedicating one agent in each of the Bureau’s fifty-six field offices
    to computer crime investigations. I was that agent in Syracuse, and I had to devote
    at least half my working day to investigating computer crimes. There was little
    guidance from FBI headquarters in Washington, D.C., and working these types of
    investigations was mostly done by trial and error. On the bright side, though,
    I was given a laptop, PowerPoint projector, and cellular telephone, which were
    cutting-edge tools for an FBI agent back then.


    The more sophisticated and affordable computers and technology became over the
    years, the more dangerous things got for American consumers. My workload increased
    steadily year over year—until 2013, when cybercrime went off the rails. Target,
    one of America’s top retailers, had a mammoth security breach. Hackers obtained
    the names, credit card numbers, and other sensitive information for about forty
    million shoppers. My phone didn’t stop ringing from that point until I retired
    from the FBI in January 2018.'
