  trans: '


    针对老年人增长最快的骗局之一是计算机技术支持诈骗。在这种骗局中，网络犯罪分子装成知名公司的代表——例如 `Apple`、`Microsoft`、`McAfee`、`Norton`
    或 `Dell`——并告诉受害者他们的电脑感染了病毒。这些坏人会试图远程访问受害者的电脑，以窃取个人信息和其他文件，或者向电脑中注入恶意软件，受害者必须付费才能清除。然后，他们会获取信用卡号、银行账户和路由号码，向受害者收取所谓的“计算机服务”费用。


    网络犯罪分子通常会通过电话给受害者打电话，提议为他们“清理”电脑或删除他们即将安装的病毒。他们会收取 500 美元到 1000 美元作为防病毒软件订阅费，如果受害者抱怨价格太高，他们甚至会提供“老年折扣”。在其他情况下，受害者会拨打电脑屏幕上弹窗中显示的电话号码。骗子利用弹窗黑入受害者的电脑，或将其锁定并索要赎金。联邦贸易委员会还发现，网络犯罪网络花费了数百万美元，通过
    `Google` 和其他搜索引擎广告他们的欺诈服务。搜索词包括“删除病毒”、“`McAfee Customer Support` 和 `Norton Support`
    等词汇。搜索引擎的关键词经过仔细挑选，旨在误导受害者让他们相信犯罪分子正在提供来自信誉良好的合法服务。即使他们确实在卖软件，那可能也不是你真正需要的。众所周知，网络犯罪分子还会几周后回给受害者电话，为他们的合同提供退款。坏人会获取受害者的银行账户记录，声称要给他们退款——但随后使用他们的银行信息再次偷钱。我告诉你，这些网络犯罪分子在地狱里一定有留他们的房间。


    我朋友的妈妈一天晚上正在上网，这时她的电脑上弹出一个蓝屏，显示一个看起来很真实的警告。屏幕上的信息说，她的电脑感染了严重病毒，她需要立即采取行动，因为防病毒软件已过期。信息警告说，如果不立即行动，她将丢失所有数据。当我朋友和他母亲通话时，她非常担心。信息指示她点击一个链接进入一个网站，在那个网站可以使用信用卡支付
    79 美元来更新防病毒软件。幸运的是，她在使用信用卡之前接起了电话并打了给儿子。我朋友告诉她那个蓝屏是一个骗局，并指示她关闭电脑，拔掉电源，然后重新插上并启动。电脑重启后，蓝屏就消失了。这种骗局被称为虚假防病毒攻击，已经存在了大约十年。它仍然非常猖盛，因为每天都有不精通电脑的用户进入市场。一旦受害者向坏人提供了他们的信用卡号，电脑上就会弹出另一个屏幕，显示病毒已清除，电脑现在运行正常。事实上，受害者所做的唯一一件事就是给了坏人一个可以非法使用的信用卡号。


    计算机技术支持诈骗在全球是一项巨大的业务。2018 年 5 月，`U.S. Department of Justice` 宣布他们已逮捕了两名来自佛罗里达州的男子，他们被指控拥有并运营两家技术支持诈骗公司：位于佛罗里达州博因顿滩的
    `Client Care Experts, LLC` 和位于哥斯达黎加的 `ABC Repair Tech`。据检察官指控，从 2013 年 11 月 12
    日左右至少 2016 年 12 月 9 日，这两人和其他人合谋欺骗了 `U.S.` 及其他国家的四万多名患者。据称，这些犯罪分子通过购买在消费者电脑屏幕上无预警出现的弹窗广告并锁定他们的浏览器，赚了超过
    2500 万。弹窗虚假地告诉用户他们的电脑感染了恶意软件和病毒，他们面临着丢失数据的危险。正如我朋友的妈妈在屏幕上看到的那样，广告指示他们拨打免费热线寻求帮助。


    每当电脑上弹出声称有病毒的屏幕时，电脑用户都应该极其小心。弹窗诱骗用户点击链接，到这里你可能已经知道点击陌生链接后会发生什么。它通常会给你带来麻烦，因为该链接被设计用于安装恶意软件，要么窃取你的密码和用户名，要么加密你所有的文件，导致在不支付赎金的情况下无法解锁。对于任何人来说都是一个可怕的陷阱——尤其是我们国家的老年人。


    # 如何避免成为受害者


    ![Image](img/lock.jpg) 不要将电脑的远程控制权交给未经先通知打电话给你的销售或技术人员。


    ![Image](img/lock.jpg) 如果你收到来自自称是技术支持的人的紧急或未计划电话，请挂断。百个案例中九十九次都会是骗局。


    ![Image](img/lock.jpg) 不要依靠来电显示号码来验证电话对面的人。网络犯罪分子在联系受害者之前会伪造来电显示号码或屏蔽自己的号码。他们可以让他们自己看起来像是从
    `Microsoft` 或 `Apple` 打来的电话，但他们可能实际上位于西非或东欧。


    ![Image](img/lock.jpg) 记住，IT 专业人员绝不会从 `Apple`、`Microsoft`、`Norton` 和 `McAfee`
    等计算机和软件公司给你打电话。如果你你的电脑或软件有合法问题，你亲自打电话给他们寻求帮助。


    ![Image](img/lock.jpg) 保持你的防病毒软件、防火墙和弹窗拦截器更新。


    ![Image](img/lock.jpg) 永远不要拨电脑屏幕弹窗广告中的电话号码。网络犯罪分子花费数百万美元通过 `Google` 和其他搜索引擎购买弹窗广告。


    ![Image](img/lock.jpg) 我建议直接联系 `McAfee` 和 `Norton` 等知名公司咨询服务问题。如果你离 `Apple Store`
    或或其他电脑零售商足够近，我相信面对面维修比通过互联网维修更安全。


    ![Image](img/lock.jpg) 如果你收到有人为你退还防病毒软件订阅费的电话，请挂断。你认识多少家公司会真的打电话给你钱？在任何情况下，都不要向他们提供信用卡号或银行账户和路由号码。这是一个骗局，他们会偷你的钱。


    ![Image](img/lock.jpg) 如果你是计算机技术诈骗的受害者，请确保向执法部门报告此事件。这是我们停止此类犯罪的唯一途径。


    ![Image](img/chap.jpg)


    ## 第 18 章 保护儿童


    在我的职业生涯中，我见证很多坏事情，例如人们失去毕生积蓄，小企业在被网络犯罪分子侵害后被迫关闭。还有什么更糟糕的吗？很简单：当坏人伤害儿童并偷走他们的纯真时。我们有资源追踪这些可怕的人并将他们关禁很长时间，但我们永远无法恢复儿童的纯真。


    '
