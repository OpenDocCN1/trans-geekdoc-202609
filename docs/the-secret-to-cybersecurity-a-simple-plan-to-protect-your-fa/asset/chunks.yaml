- raw: 'Here’s where it starts to get really bad. Let’s say one billion of those three
    billion Yahoo! users owned an iPhone, iPad, or iMac desktop computer. That’s 33
    percent of the users; some analysts have estimated it might be closer to 50 percent
    or more. Let’s assume, for argument’s sake, that only 1 percent of the Yahoo!
    victims owned some sort of Apple device. One percent of three billion is still
    thirty million users. There’s a good chance many of the Yahoo! victims were using
    the same usernames and passwords for their iCloud accounts. What kind of damage
    can a cybercriminal do if he gains access to your iCloud account? He can wreak
    havoc by changing the username and password and locking you out of your account.
    He can hold your account hostage and demand thousands of dollars to release it.
    Many people are using cloud accounts to back up intimate details of their lives,
    so now the bad guys have access to everything—photos, email, movies, music, documents,
    calendars, and a lot more.


    You may have heard about the targeted attack on Apple usernames, passwords, and
    security questions in September 2014. Hackers released intimate photos of several
    celebrities, including actress Jennifer Lawrence and model Kate Upton. The photos
    were released to the world, but the celebrities didn’t have anyone to sue because
    anonymous hackers committed the crime. They were helpless in trying to stop the
    photos from being revealed.


    While some of the celebrities in the Apple hack were obviously embarrassed and
    might have been forced to have uncomfortable conversations with their parents,
    less-famous Yahoo! victims suffered greater financial damage. Cybercriminals have
    written scripts—simple automated programs—that can compare Yahoo! usernames and
    passwords with thousands of popular websites, such as banks, social media, e-commerce,
    and so on. If you use the same username and password for your Yahoo! account that
    you do for your iCloud account, there’s a good chance it’s going to be the same
    login credentials you also use for Amazon, eBay, American Express, and bank accounts.
    The thieves will scrutinize your emails to determine where you do business and
    attempt to gain access to all those accounts. Their automated programs allow them
    to gain access without even having to manually enter usernames and passwords.
    Even if they’re successful only 1 percent of the time, it’s still a lucrative
    business when you’re talking about information from three billion Yahoo! accounts.


    During a 2017 speech at the Black Hat USA conference in Las Vegas, Facebook chief
    security officer Alex Stamos explained to the audience why password reuse is one
    of the largest online dangers. Stamos told the crowd, “\[The\] vast majority of
    harm comes from the simple problems that are difficult to solve, such as the rampant
    reuse of passwords. When people use one password for their bank, social media,
    their email, and a gambling site, the gambling site may get broken into and then
    those credentials will be sold on the black market. Now dozens of attackers will
    fight to be the first one to take over that person’s digital identity.”


    I can’t stress enough the importance of having separate and strong passwords for
    mission-critical accounts. Mission-critical accounts are email, social media,
    cell phones, banking, and e-commerce. Think of anything you don’t want criminals
    to gain access to, and this even includes alarm systems, garage door openers,
    and security cameras. I’ll never forget one of the cybercrime cases I investigated
    while working for the Federal Bureau of Investigation. The case involved a woman
    named Ellen who was the mother of four children and a successful entrepreneur
    with a massive social media following. Unfortunately, Ellen was like most other
    people when it came to online security. She used simple passwords and reused them
    for most of her online accounts. A bad guy in Central Asia gained access to Ellen’s
    Facebook account because her password was a combination of one of her children’s
    names and the year the child was born. He probably found that information on her
    publicly available Facebook page in a matter of minutes.


    Once the cybercriminal had access to Ellen’s Facebook account, he discovered that
    she used an iCloud email account. It didn’t take him long to figure out that her
    login credentials for her iCloud email were the same as what she used on Facebook.
    So, he logged into her email account and read her email. The first thing he did
    was log in to the Apple Store, order ten new iPad minis, and have them delivered
    to Central Asia. Fortunately for him, Ellen had saved her credit card information
    in her Apple account. By examining Ellen’s email, this crook was able to identify
    about ten different mission-critical accounts. He changed the usernames and passwords
    for each of them and locked her out of her own accounts. Then he sent Ellen a
    ransom email, telling her to send him money to regain access. When Ellen received
    the email, she was furious and sent him a nasty reply. He responded by deleting
    the contents of Ellen’s iCloud account, which contained keepsake family photographs
    and multiple files of her uncompleted work. After that, he started targeting several
    of Ellen’s friends and followers, wreaking havoc on their lives, as well. It took
    Ellen weeks to regain control of her accounts. It was like the bad guy was always
    one step ahead of her. He even left a forwarding rule in Ellen’s email account
    that allowed him to receive a copy of every email sent to her. Each time Ellen
    received an email with a temporary password, he intercepted the email. I’ve seen
    this technique used in dozens of situations, and it’s very difficult to stop.


    Through our criminal investigation, we tracked down the person responsible for
    Ellen’s nightmare. We discovered it was a twenty-one-year-old man from Central
    Asia who was working alone. He had also gained access to email accounts belonging
    to about a half-dozen of Ellen’s friends and followers, causing a lot of trouble
    for them, as well.


    Fortunately, FBI agents are assigned overseas to help protect American citizens
    at home. They build relationships with foreign governments, law enforcement, intelligence
    agencies, and security services around the world, promoting a prompt and continuous
    exchange of information. There are sixty-four legal attaché offices—commonly known
    as legats—and more than a dozen smaller sub-offices in key cities around the world
    that provide coverage in more than two hundred countries, territories, and islands.
    Each office is established through mutual agreements with host countries and is
    located in the U.S. embassy or consulate in that country.


    Once we identified the cybercriminal in Ellen’s case, I established contact with
    an FBI colleague who was located in the Central Asian country where the thief
    lived. Unfortunately, the host government there didn’t have a formal treaty with
    the U.S. So, even if we had brought criminal charges against the man who victimized
    Ellen, we couldn’t have extradited him back to the U.S. However, the man could
    have been prosecuted for his crimes in his native country. My colleague asked
    me to send him the facts of the case and what we knew so the host government could
    conduct its own investigation. A few weeks later, ISIS attacked their country,
    and prosecuting a twenty-one-year-old man who was hacking a U.S. citizen was no
    longer a priority. Remember what I told you about not getting your stuff back
    and the bad guys not going to jail? Ellen never recovered her data that was erased,
    and we weren’t able to put the man in jail. The entire situation might have been
    prevented if she hadn’t used the same username and password for multiple online
    platforms.'
