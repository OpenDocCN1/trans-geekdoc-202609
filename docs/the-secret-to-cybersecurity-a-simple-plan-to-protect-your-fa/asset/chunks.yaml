    I have drafted a simple and realistic policy for real estate transactions, which
    is this: A title company must tell all its employees that any changes to bank
    information must be verified, but not by email or text. The title company employees
    must pass this information to real estate agents, closing attorneys, buyers, and
    sellers. That way, won’t be any surprises.


    Executives need to explain to every one of their employees that, if they fall
    victim to BEC scam, they’re going to be fired. That might sound harsh, but victims
    don’t have to be. A little caution and common sense will correct some of these
    problems. If a client is located out of town, better know what he or she looks
    like and then have a videoconference to verify any changes to closing process.
    Will this slow things down? Of course, but it’s better to be safe than sorry,
    especially when it comes to losing millions of dollars.


    When I was still working for the FBI, I shared this policy during one of my presentations.
    A woman in the audience complained that would be too difficult to implement. nobody
    wants a guy from federal government telling the private sector how to do its job.
    But it’s all about prevention, and if someone calls after the crime has already
    been committed, there’s little it can do.


    Unfortunately, many real estate agents are using unsecured `AOL` and `Yahoo` accounts
    to do business, and they’re using these accounts to communicate with homebuyers
    and sellers every day. The bad guys will continue to target real estate sector
    as long as these companies continue to do usual. But what about you? What are
    you going to do the next time you buy or sell a house and real estate broker sends
    you an email instructing you to send down payment to a certain bank account and
    routing number? If you’ve read this, you’re hopefully going to pick up the phone
    and verify or better yet, go to the office in person.


    ### How to Avoid Becoming a Victim


    - Raise awareness in your company about the threat of business email compromise,
    which will make your company less likely to become a victim.

    - Do not accept any changes to bank account information via email or text messages.

    - Require employees to verify each bank change, preferably in person or at least
    over the phone.

    - Ask your bank to hold customer requests for international wire transfers for
    an additional period of time to verify the legitimacy of the requests.

    - Be especially suspicious of requests for secrecy or pressure to take action
    quickly.

    - Don’t call the phone number that included in the email requesting the bank change.
    Call a previously known number that is listed in a directory or included on a
    business card.

    - Carefully scrutinize all emails related to real estate transactions, paying
    special attention to the sender’s email address. Make certain it’s not a spoofed
    account and compare it to other emails you’ve received from that person in the
    past.

    - If your real estate agent prefers to use a personal email account to conduct
    business, ask that she or he only communicate with you through company email.
    It’s probably more secure.

    - If you’re a buyer or seller, never rely on information about a wire transfer
    included in emails or text messages. Call your real estate agent, closing attorney,
    or someone at the title company and inform them that you’ve received an email
    or text message and want to verify its contents.

    - Install two-factor authentication on your email. Ask your real estate agent,
    closing attorney, and representative of the title company if they’re utilizing
    `2FA`, as well.


    ## Chapter 13: Work-from-Home Nightmares


    THERE’S A LOT TO LOVE about working from home: not sitting behind a desk from
    nine to five, avoiding traffic or crowded subways and buses, saving a few bucks
    on lunch and your professional wardrobe, and having the flexibility to spend more
    time with your family and friends during the work week. More and more Americans
    are working remotely, and it’s pretty easy to see why it’s so enticing for employees
    and their employers, who have figured out that their workers are more productive
    when they’re rested and happy.


    Work-from-home jobs are desirable for all the reasons stated but many people who
    go searching for such positions have their lives turned upside down by cybercriminals.
    In many cases, the bad guys target people who are most vulnerable: those who are
    recently unemployed, behind their bills, fresh out of college, or caring for sick
    loved ones. You’ve probably received hundreds of emails offering you an extra
    $1,000 a week or a certain commission to handle financial transactions from home.
    Or maybe you’ve seen similar job listings for “money transfer agents,” “local
    processors,” “payment processing agents,” and other comparable titles on `Craigslist`
    or `Monster.com`. I receive these emails all the time, and thankfully most of
    them end up in my spam folder. Here’s one example:


    ```

    Dear friend,


    Greetings to you and your family, I am the manager of bill and exchange in THE
    BANK, I have a business of 5.5 Million United State Dollars to be transfer to
    your account for investment in your country, if you are ready to assist get back
    to me, I will give you full details of how the fund will be transfer to you.


    Be rest assured that everything will be handled confidentially because, this is
    a great opportunity we cannot afford to miss, as it will make our family profit
    a lot. 6 years ago, that most of the greedy African Politicians used our bank
    to launder money overseas through the help of their Political advisers most of
    the funds which they transferred out of the shores of Africa were supposed to
    have used to develop the continent, as I am sending this message to you, I was
    able to divert five five Million Dollars ($5.5M) which is in escrow transit account
    belonging to no one in the bank, and now my bank is very anxious to know the real
    beneficiary of the funds is


    Immediately the fund has been successfully transfer into your account I will come
    to your country for the sharing of the fund, the fund will be shared 50% for me
    and 40% for you, and the other 10% for the orphanages home and poor with less-privilege
    people.


    Please indicate your interest in this transaction by replying back and if you
    are not interested do not waste your time to reply kindly delete my message from
    your box ok.


    Waiting to hear from you soon.


    Yours Faithfully,


    Mrs. Elodie Azeez

    ```

