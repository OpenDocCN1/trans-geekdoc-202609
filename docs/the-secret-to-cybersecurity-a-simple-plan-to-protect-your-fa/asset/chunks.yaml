- raw: 'In the past couple of years, the FBI has arrested and prosecuted some high-level
    criminals based overseas, and the FBI agents assigned to cybercrime are working
    overtime to make arrests. There have been a few notable success stories in recent
    years. In December 2016, a computer hacker named Mark Vartanya, also known as
    Kolypto, was extradited from Norway to the U.S. for his role as a Citadel malware
    toolkit co-developer. He helped steal financial account credentials and personal
    information from eleven million infected computers around the world, resulting
    in more than $500 million in losses. He pleaded guilty and was sentenced to five
    years in prison. In February 2018, the U.S. Justice Department announced charges
    against more than thirty individuals who were key members of Infraud, a long-running
    online cybercrime forum. The fraud forum attracted more than eleven thousand members
    from around the world who sold, traded, and purchased stolen identities, credit
    card accounts, and malicious software, costing consumers worldwide more than $500
    million in losses.


    I hate to say this, but we’re not going to arrest our way out of the cybercrime
    problem. There are many safe havens for computer criminals around the world, and
    the host governments in many of these places simply aren’t concerned that their
    citizens are victimizing people in the U.S. If you go to the FBI website and look
    at the most wanted list of cybercriminals ([www.fbi.gov/wanted/cyber](http://www.fbi.gov/wanted/cyber)),
    you will see twenty-five names you probably can’t pronounce. If any of them jumped
    on a plane and headed for vacation in Daytona Beach, Florida, I promise you that
    FBI agents would apprehend them at the airport. But if you believe any of the
    cybercriminals are going to travel to the U.S., then I have a bridge to sell you
    in Brooklyn.


    This is the moment when it’s okay for you to become depressed. You’ve just discovered
    that there’s very little chance you’re getting your money back when the bad guys
    steal your stuff and you notify law enforcement. And then I told you law enforcement’s
    chance of arresting and punishing the bad guys is probably even slimmer than you
    getting your money back. I broke that news at an event where liquor was being
    served, and a guy yelled from the crowd, “No wonder the president fired FBI director
    \[James\] Comey! What do you guys really do?” Obviously, my former position required
    having thick skin. This leads me to my fourth and final point, which is what drove
    me to write this book in an attempt to educate the American public.


    4\. Truth Four: A majority of cybercrime can be prevented.


    I made this point to a friend of mine who is a senior executive at FBI headquarters
    in Washington, D.C. He sharply disagreed with my assessment, as do many others
    on a regular basis. When I make that statement, I get depressed because I know
    90 percent of the cases I investigated might have been prevented through user
    education and awareness, sound business processes, and the use of a simple control
    called two-factor authentication. My FBI colleague explained that foreign intelligence
    services from China and Russia are using extremely sophisticated techniques and,
    when these threat actors target an organization or individual, the bad guys will
    win every single time. In some cases, that’s a true statement. I’ve seen these
    threat actors target some of the largest organizations in the world and gain access.
    But there are also plenty of unsophisticated threats from all around the world
    that are jumping on the bandwagon. They are victimizing senior citizens, homeowners,
    small businesses, and nonprofits and causing grave damage. Large companies have
    money to throw at the problem, but it’s not working.


    In 2017, Cybersecurity Ventures predicted that cybercrime would cost the world
    $6 trillion annually by 2021, up from $3 trillion only two years before. That
    represents the greatest transfer of economic wealth in history, according to the
    Herjavec Group. Amazingly, cybercrime will be more profitable than the global
    trade of all illegal drugs combined. Incidents of cybercrime are continuing to
    occur at an alarming rate and more and more data is being stolen. We’re spending
    an increasing amount money to stop it too. Garner Inc. says worldwide information
    security costs climbed to $93 billion in 2018 and will climb to more than $1 trillion
    by 2021—and we’re barely making a dent in preventing it. The fact that nearly
    every household appliance or piece of electronics will be connected to the Internet
    in the very near future leads me to believe that things are only going to get
    worse.


    During the final ten years of my FBI career, I dissected more than one thousand
    cybercrime incidents and data breaches. There were commonalities in each of the
    incidents, and I came up with a list of precautions that, if followed, will dramatically
    reduce your chances of becoming a victim. I’m going to refer to my points as methods
    of improving your cyber-hygiene. What I’m going to share with you won’t cost a
    lot of money either. In fact, the majority of my techniques will seem like common
    sense.


    Unfortunately, there’s no magic pill or silver bullet that will keep you safe.
    However, a combination of available techniques will greatly reduce your risk.
    If a cybersecurity salesman comes to your organization and says he has a product
    that will keep you safe and protect you from every single threat out there, I
    have news for you: he’s lying. There’s no single product on the market that will
    eliminate all the risk; cybercriminals simply work too fast and the threats are
    constantly changing. There is a term for this in our industry: Defense in Depth.
    This means not relying on one product for safety. Using only one strategy or no
    strategy is bad cyber-hygiene, and I can promise you one thing: if you don’t have
    good cyber-hygiene, the odds are stacked against you. You’re going to be hacked,
    and cybercriminals are probably going to get their greasy hands on your money.


    Before I go into the techniques, I have to admit that I didn’t create or develop
    any of these techniques. I’ve just been lucky—or should I say unlucky—to have
    witnessed and investigated thousands of cybercrime incidents and identify their
    root causes. Hopefully, I can use what I learned to make you safer on the Internet.


    ![Image](images/chap.jpg)


    ## CHAPTER 3:


    ## Phishing


    IT SEEMS LIKE ONLY YESTERDAY when I stuck an America Online CD into my laptop,
    plugged a cable into a telephone jack on the wall, and was connected to the information
    superhighway—now known as the Internet—for the first time.


    The World Wide Web was invented in 1989 (no, not by Al Gore) and the first website
    went live in 1991. Within a few years, I was emailing my friends on a regular
    basis and exchanging photos with them. By 1998, when Tom Hanks and Meg Ryan starred
    in the Hollywood hit You’ve Got Mail, the world was hooked on the Internet and
    everybody was using email. It was so easy that even our parents, grandparents,
    and children had the ability to send email. Today, there are more than 3.8 billion
    email users (more than half the planet’s entire population), according to a 2018
    study by the Radicati Group. That number is predicted to climb to 4.2 billion
    by 2022. Since the average person has 1.7 email accounts, some for personal use
    and others for business, there are around 4.4 billion accounts worldwide.'
