    许多美国职场人士使用 `Dropbox` 作为移动和共享大文件的便捷方式。你认为你的医生通过家里电脑或世界上任何其他地方使用 `Dropbox` 来访问你的医疗记录是一个好主意吗？有些人可能会说这是一个极佳的主意，因为这可以拯救生命并提高工作效率。但如果你的医生的
    `Yahoo!` 账户被犯罪分子黑客了，他们偷了他的用户名和密码——而这些正是他也用于 `Dropbox` 的相同登录凭据呢？不幸的是，我们知道结果：坏人可以访问敏感的个人文件，包括你的医疗记录。我是在说你不应该使用
    `Dropbox` 吗？不是；我是说它是非常棒的工具，你应该使用它——但前提是你正在使用双重身份验证来保护你的信息。


    `Google Drive` 和 `Dropbox` 并不是用于存储会计、医疗和薪资记录的唯一云服务。我在 `FBI` 工作期间遇到过这样一个案件，涉及骗子访问了一个会计师的云端软件软件包。他的邮箱被黑客了，不幸的是，他在云端软件上也使用了相同的密码。坏人得以访问了其客户的姓名、出生日期、社会安全号码、电子邮件地址以及银行账户和路由号码。他不得不花高价聘请一家安全公司来收拾烂摊子。他还必须通知他的客户他丢失了他们的信息，我确定这让他损失了一些业务。这名受害者向我承认，在一切结束后，这起事件让他损失了超过
    75,000 美元。一家“四大”会计师事务所可以处理这样的财务损失，但付出了巨大的努力才让这家小企业没有倒闭。


    在另一个案例中，网络犯罪分子通过使用盗取的用户名和密码登录了一家小型企业的薪资平台。利用被盗的信息，窃贼将银行账户和路由号码更改为他们控制的银行账户。坏人带走了超过
    100,000 美元，导致公司被迫破产。


    不幸的是，网络犯罪分子喜欢针对小型企业，因为他们没有具备所需的高昂网络安全防护。`Verizon`的一项研究发现，2017 年 61% 的网络攻击受害者是小型企业，高于上一年的
    53%。`Hiscox` 的另一份报告发现，47% 的小型企业在过去的 12 个月内遭受了至少一次网络攻击，52% 的企业遭受了多次攻击。似乎现在要维持一家小企业的经营已经足够困难了！


    云攻击最大的目标是 `Microsoft Office 365`。在过去，你购买 `Microsoft Office` 的纸质版，将软件安装到电脑上然后开始工作。随后在
    2011 年 6 月，`Microsoft` 推出了 `Office 365`，让消费者能够下载 `Office` 软件并将信息存储在云端。这种方式更便宜、更高效，但现在坏人只需要用户名和密码就可以发动攻击。他们不需要破解以前存储敏感信息的办公室电脑或网络。2017
    年，针对在多家“世界财富 2000 强”公司工作的 `Office 365` 用户，发生了一场复杂的云到云暴力破解攻击。攻击者尝试用不同版本的 `Office
    365` 用户名登录，这表明他们已经通过另一次数据泄露或钓鱼攻击获取了某些版本的账号。在 2018 年的一项独立调查中，`YouGov` 发现 41% 的小型企业使用了双重身份验证，而
    59% 的企业没有。

