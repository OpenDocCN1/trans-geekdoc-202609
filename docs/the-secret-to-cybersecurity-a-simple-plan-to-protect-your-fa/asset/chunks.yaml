  trans: '

    让我来解释一下为什么这如此困难。在过去，你必须有一个物理地址才能在家里安装固线电话。而现在，通过 `Google`、`Skype` 以及其他在线电话提供商，你可以获得免费的越网电话（VOIP）号码，让你能够通过电脑拨打电话。通过免费的
    VOIP 号码，犯罪分子发送短信诈骗（smishing）信息变得很容易，而执法部门要追踪这些号码却极其困难。即使执法部门经历了漫长而艰巨的程序向互联网提供者发送传票，其源头互联网协议（`IP`）地址通常位于国外。如果我们足够幸运关闭了其中一个，网络犯罪分子只需移动到另一个
    IP 即可。阻止他们就像在玩打地鼠游戏；你打倒一个，另一个又会跳出来。残酷的现实是，我们无法阻止坏人发送带有链接的短信。这是不可能的。我们能做的是教人们如何应对，以及如何不反应。只要可能，我一直鼓励金融行业的人士向他们的客户介绍不同类型的短信诈骗骗局。如果他们能有效地履行职责，我可能就不需要写这本书了。


    关于我姐姐和她手机的那个件事让我想起了自己的手机号，那同时也是我的工作电话。我告诉人们这是联系我的最佳方式。我决定进行一次测试，并在 `Google` 上搜索了我的手机号。令我惊讶的是，我看到它被列在一个网站上。我推测它在那里是因为我之前将其作为联系方式提供给一家公司，它要么是在我不知情的情况下被卖掉了，要么是通过数据泄露被盗的。我不说谎：我发现的发现绝对令人恐惧。那个拥有我手机号的网站看起来很奇怪。当我点击那个链接时，我被带到了另一个网页，上面有我的名字、生日、家庭地址、工作地址、妻子和母亲的名字及出生日期，以及过去二十年来我所有的电话号码和物理地址。该网站声称是一个数据聚合器；它爬取互联网，专门寻找居住在
    `U.S.` 的人的个人信息。它将最好的社交网络信息与十八岁以上所有人的公开信息结合在一起。该网站自称拥有互联网最大的公共记录库之一（2018 年它拥有近
    2 亿人口和 1800 万家公司的信息），我确定它每天都在迅速扩张。


    这个特定网站令人恐惧的地方在于，它的联系人被列为非洲某人。我对整个局面没有良好的感觉。这涉及到一个根本性问题：我们对互联网上的隐私有预期吗？还是我们应该假设有人坐在非洲，收集我们所有的个人信息，并可能卖给任何愿意付钱的人？在过去，你只需要有一个未公开的电话号码，仅此就让别人很难找到你。今天，关于你的一切信息都在网上，而这些细节正在被聚合和出售。隐私已经抛之脑后！而且，如果这些信息落入坏人手中，你成为受害者的概率极高。


    # 如何避免受害


    ![Image](img/lock.jpg) 警惕短信诈骗。在处理短信时，你需要成为一道“人为防火墙”。


    ![Image](img/lock.jpg) 使用强密码或指纹/生物识别功能来保护你的手机。这样做可以在手机丢失或被盗时保护它。


    ![Image](img/lock.jpg) 在不使用时关闭 Wi-Fi 或蓝牙。机场、购物中心和体育馆等公共场所的免费公共 Wi-Fi 服务通常是不安全的。在使用公共
    Wi-Fi 时，切不要登录财务或电子邮件账户。


    ![Image](img/lock.jpg) 在你彻底检查清楚之前，不要点击短信中包含的链接。除非你彻底核实其真实性，否则不要点击短信中的任何链接。如果收到来自未知号码的短信，不要点击链接。


    ![Image](img/lock.jpg) 记住，在不是来自信赖应用商店的情况下，不要下载任何应用程序，以免收集你的凭据。


    ![Image](img/lock.jpg) 你的手机和操作系统、网络浏览器一样容易受到病毒。


    ![Image](img/lock.jpg) 保持移动设备和应用程序处于最新状态，以防御网络威胁。


    ![Image](img/lock.jpg) 你的手机可能正处于来自陌生号码的短信。


    ![Image](img/lock.jpg) 如果你收到来自熟悉号码的可疑短信，请询问该号码。


    ![Image](img/lock.jpg) 考虑在移动设备上安装完整的安全套件，以加密你的手机与互联网之间的通信。患患于未。


    ![Image](img/images.jpg) 第 6 章：密码安全


    我喜欢开玩笑说世界上没有人比我更经常成为数据泄露的受害者。人事管理部门、安康医疗、Target、家得宝、索尼、福福小宫、、摩根士丹、万豪酒店和 Equifax
    都丢失了我的个人信息。然而，在我看来，这些事件中的任何一个都不如我所谓的“泄露之王”——`Yahoo!`。当我在演讲中提到 2013 年的 `Yahoo!`
    泄露事件时，听众中一定会挑战我。他们会辩称，由于生日、地址或社会安全号码等个人身份信息没有泄露，这并不严重。


    但 `Yahoo!` 及其母公司 Verizon 在 2017 年 10 月披露，当时 `Yahoo!` 的每一个客户账户都受到了泄露影响。这意味着超过三亿账户，包括电子邮件、Tumblr、Fantasy
    和 Flickr。这比 `Yahoo!` 在 2016 年最初报告的受影响数量多出三倍。网络分子获得了超过三亿个用户名、密码和安全问题的答案。`Yahoo!`
    官员告诉用户，一个复杂的外国对手实施了历史上规模最大的数据泄露，然后不情愿指示用户更改用户名和密码。令人震惊的是，这并不是强制更改。


    记住，`Yahoo!` 并不只是 `Yahoo!`。当时，该公司还包括 AT&T 和 BellSouth，以及其他较小的互联网提供商。坏人获取了数十亿电子邮件账户，然后他们能够通过发送数十亿鱼叉式钓鱼邮件将其转化为武器。而且，一旦他们进入了某人的电子邮件账户，他们就能发现那个人生活的内部——包括财务记录、社交媒体账户、敏感工作文件以及可能性的任何内容。

    '
