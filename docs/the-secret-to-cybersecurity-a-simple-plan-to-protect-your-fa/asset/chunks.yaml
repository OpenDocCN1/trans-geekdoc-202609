- raw: '## ABOUT THE AUTHOR


    ![Image](images/author.jpg)


    SCOTT AUGENBAUM became the “Cyber Guy,” working almost exclusively on computer
    crime cases in the FBI Offi ce in Syracuse, New York. In October 2003, Augenbaum
    was promoted to Supervisory Special Agent at FBI headquarters in Washington, D.C.,
    which provided him with a national perspective on the growing threat of computer
    crimes. He was assigned to the Cyber Division, Cyber Crime Fraud Unit and was
    responsible for managing the FBI’s Cyber Task Force Program and Intellectual Property
    Rights Program. In 2006, he helped launch the FBI’s fi rst local Computer Intrusion/Counterintelligence
    squad in Nashville, Tennessee.


    Augenbaum retired from the FBI in January 2018. He lives with his wife and children
    in Nashville, Tennessee, where he recently launched Hero Publishing, a company
    devoted to educating the public about the dangers of cybercrimes.


    [www.ScottEAugenbaum.com](http://www.ScottEAugenbaum.com)


