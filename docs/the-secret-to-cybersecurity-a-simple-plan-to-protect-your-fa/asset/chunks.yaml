- raw: 'David didn’t hear from anyone from the California bank for a few days, so
    he called the number he’d originally dialed. No one answered. When he tried to
    go to the bank’s website on the Internet, it was no longer there. He started to
    become concerned and contacted someone at his bank, which discovered his money
    hadn’t been sent to a bank in California but instead to one in Georgia—the country
    in Eastern Europe, not the state in the American Southeast The FBI’s legal attaché
    in Georgia was contacted, and our law enforcement partners there were notified.
    Unfortunately, David never got his money back, and the bad guys didn’t go to jail.


    I wish these stories were fiction, but every one of them happened during my tenure
    with the FBI. The names were changed to protect the victims’ identities, but the
    facts are accurate. They are scary scenarios and most individuals feel helpless
    when cybercriminals victimize them. In a lot of instances, I heard the same response
    from victims: “I’m a small businessman, and I don’t have the money to spend on
    online security. I’m not technology proficient.”


    I spent twenty-nine years in the FBI, six as a support employee and twenty-three
    as a special agent. My last fourteen years were spent investigating cybercrime.
    If you were hoping to read a book about how FBI agents took down a large group
    of cybercriminals, I’m sorry to disappoint you. There are a lot of great FBI agents
    who tell entertaining stories about arresting bad guys over the course of their
    careers; unfortunately, I don’t have a lot of those stories to tell. The criminals
    I chased around the world don’t get caught very often. That’s why it’s so important
    to learn how to cut them off before the crime ever happens.


    ![Image](images/chap.jpg)


    ## CHAPTER 2:


    ## THE FOUR TRUTHS


    IN 2002, THE FBI FORMED a Cyber Division at its headquarters in Washington, D.C.,
    and a national strategy was developed to combat the emerging threat of computer
    crimes. Part of my job as a special agent in Syracuse, New York, was to handle
    all cyber matters, and one of my responsibilities was to inform the public of
    the FBI’s mission in this investigative area. I still remember the highlights
    from my presentations to the public in 2001. I had a slide titled “Why the Increase
    in Cybercrime?” that warned:


    1. There was little risk for criminals of actually being caught, because the bad
    guys were behind keyboards and didn’t have to stick a gun in your face to steal
    your money.


    2. Attribution was difficult to prove because once you were able to identify the
    computer behind the crimes, you still had to prove the person behind the computer
    was the one actually committing the crime.


    3. There was a lack of experienced law enforcement investigators, prosecutors,
    and judges dealing with computer crimes. It was difficult to establish judicial
    venue if the bad guy was located in New York and the victim or victims were located
    throughout the U.S. or other parts of the world.


    4. There were no boundaries in cyberspace and bad guys from around the world could
    access our critical information. Many foreign governments were not concerned if
    criminals from their countries were victimizing U.S. citizens. Many of those countries
    refused to cooperate with the U.S. government in investigations.


    5. More and more people were purchasing home computers and had access to email,
    e-commerce, and online banking. With more people accessing the World Wide Web,
    suddenly almost everyone had an email account.


    What has changed since then? Everyone has a home computer and today’s cell phones
    and tablets are much more powerful than the home computers of 2002. We can do
    so many things on our cell phones now—watch movies, music videos, and live sporting
    events; check email; log in to our corporate networks; pay our mortgages and other
    bills; and purchase goods from around the world. The bad guys of the early Internet
    have changed from teenage hackers living in their parents’ basements to financially
    motivated, foreign-based adversaries who have ties to organized crime. Through
    social media accounts like Facebook, Instagram, Twitter, and others, we have provided
    those who want to do us harm with too much information about our personal lives,
    our families, and our employers. The only thing the bad guys have to do now is
    Google our names and they’ll find a plethora of information they can use against
    us.


    In 2002, it took a lot of skill to become a cybercriminal. Today, the necessary
    tools are available to almost anyone online. Crimeware is a term used by law enforcement
    to describe the tools needed by crooks to commit cybercrime—and these tools are
    readily available at a low cost. There is a part of the Internet called the dark
    web that exists on darknets and overlay networks and requires special software
    and routers to access. The dark web is usually encrypted content and isn’t indexed
    on conventional search engines. This is where criminals sell drugs, hack software,
    counterfeit money, and more. It’s also the place where stolen classified information
    is brokered and traded by hackers, and it’s where human traffickers conduct their
    abhorrent work.


    Unfortunately, the software and routers needed to access the dark web can be easily
    purchased. You can buy other types of destructive cyber-tools and methods for
    hiding your tracks and make it almost impossible for anyone to hunt you down.
    The illegal theft and release of hacking tools used by the National Security Agency
    (NSA) made matters much worse in August 2016. A hacking group called the Shadow
    Brokers stole the tools the NSA used to keep our country safe from terrorists
    and foreign intelligence services and posted them online. Now, the very tools
    originally designed to protect us are being used in a number of cyberattacks around
    the world.


    During the past fifteen years, I was involved in thousands of cybercrime cases,
    and I noticed the same four qualities in each instance. I now call these the Four
    Truths:


    1\. Truth One: Nobody expects to become a victim.


    I heard it over and over again during my career in law enforcement: I’m a small
    CPA firm. I’m a nonprofit. I’m a small healthcare company. I don’t have anything
    a cybercriminal would want to steal. I once had the CEO of a nonprofit organization
    tell me that no one would ever target a nonprofit. What would they want to steal?
    The bad news is that I worked with dozens of nonprofits that were victimized.
    Nonprofits collect sensitive data, including donor information, health information,
    Social Security numbers, confidential emails, employee and volunteer records,
    and billing information.


    One of the worst incidents involving a nonprofit that I’ve heard about involved
    the Little Red Door, an organization that helps women battling cancer in Muncie,
    Indiana. A group of hackers infected the nonprofit’s computers with malware (software
    intentionally designed to cause damage to a computer, server, or computer network)
    in January 2017, and its staff members couldn’t access patient files and other
    information. The hackers held the information hostage and wanted fifty bitcoin—an
    emerging online currency worth about $43,000 at the time—to release the files.
    At one point, the hackers even sent an email to the nonprofit that read, “Cancer
    sucks, but we suck more!” The bad guys are heartless. The Little Red Door couldn’t
    pay the ransom, so its staff members had to reload patients’ information into
    computers.'
