    当我在演示中使用这个例子时，我总是会问观众：“在这种情况下，大多数人会怎么做？”当我问这个问题时，观众通常会保持沉默。但当我间接地问出这个问题时，他们似乎总有相同的答案：“点击链接。”通常会有几个人向我投来一个眼神，仿佛在说：“我绝不会点击那个链接。相反，我会拨打邮件里的免费服务电话。”那样同样糟糕。当你拨打电话时，你可能是在和一个来自乌克兰的人通话，他可能说着没有口音的英语，并会指示你点击链接。跟我重复一遍：我绝不会拨打邮件中的电话号码，并且始终为我的银行和供应商维护一份电话列表。


    现在，如果查理（Charlie）点击了邮件中的链接，他就中了博里斯（Boris）的计。他将被重定向到境外的一台电脑，那台电脑正被博里斯和其他犯罪分子控制。此时通常会发生两件事：如果安装了键盘记录器，博里斯就可以窃取查理银行账户的用户名和密码。或者，查理会以为自己进入了银行的网站，迎接他的是一个带有停止欺诈交易说明的网页。他所做的只需输入用户名和密码。查理唯一担心的是保护他的钱，所以他会乐意登录银行网站以防止这种事的发生。一旦他输入了用户名和密码，键盘记录软件就会捕获这些信息，现在博里斯就拥有了访问查理账户所需的信息。


    但在这种情况下，可能还有多的一步。一旦博里斯使用查理的用户名和密码登录银行的真实网站，由于银行的电脑可能会识别出有人正从一个未知的电脑和 IP 地址登录。因此，银行网站会提供额外的障碍——安全问题。安全问题有许多形式，从你母亲的娘姓、第一只宠物、高中的吉祥物，到你婚礼上的伴娘或伴郎应有尽有。考虑一下你银行网站上的安全问题，并问问自己：博里斯或其他犯罪分子能通过查看我的社交媒体账户或在
    Google 上搜索我的名字来找到我挑战问题的答案吗？遗憾的是，对大多数人来说，答案是肯定的肯定的。


    你可能记得，当阿拉斯加州州长兼共和党副总统候选人莎拉·帕林（Sarah Palin）在 2008 年美国大选期间，她的雅虎邮箱账户遭到破解时。那个被称为 Rubico
    的黑客实际上是大卫·肯内尔（David Kernell），一个来自田纳西州大学的二十岁大学生，也是田纳西州议员的儿子。根据联邦当局的说法，肯内尔非法访问了帕林的邮箱账户，因为他正在寻找某种东西来破坏她的竞选。由于田纳西州的诺克斯维尔（Knoxville）不在我的管辖范围内，我没有参与此案。不过记录一下，帕林的账户并没有被“破解”。黑客是指利用技术非法访问他人的账户。帕林的账户被他人访问是因为她使用了薄弱的安全问题。事实上，肯内尔告诉联邦当局，他在大约“十五秒”内回答了帕林的安全问题。她的安全问题包括她的生日、读中和高中吉祥物。肯内尔在她的维基百科页面上找到了她的生日，而且确定她的高中和高中吉祥物很容易，因为她是在那里长大的。


