    ## 作者简介


    ![Image](img/author.jpg)


    SCOTT AUGENBAUM 被称为“网络大亨”，他曾在纽约州叙拉丘斯联邦调查局（FBI）办公室工作，几乎专门负责计算机犯罪案件。2003 年 10 月，Augenbaum
    被提升为华盛顿特区 FBI 总部的主管级特探员，这使他能够对日益增长的计算机犯罪威胁产生国家级的视角。他被分配到网络处、网络犯罪欺诈小组，负责管理 FBI
    的网络任务小组计划和知识产权保护计划。2006 年，他帮助在田纳纳西州纳什维尔启动了 FBI 的首个地方计算机入侵/反间谍小组。


    Augenbaum 于 2018 年 1 月从 FBI 退休。他与妻子和孩子现住在田纳纳西州纳什维尔，最近他在那里创立了 Hero Publishing，这是一家致力于向公众普及网络犯罪危害的公司。


    [www.ScottEAugenbaum.com](http://www.ScottEAugenbaum.com)


