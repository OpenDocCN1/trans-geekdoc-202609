- raw: 'One of the most rapidly growing scams involving the elderly is computer tech-support
    scams, in which cybercriminals pose as representatives of well-known companies—such
    as Apple, Microsoft, McAfee, Norton, or Dell—and advise victims that their computers
    have been infected with a virus. The bad guys will attempt to gain access to a
    victim’s computer remotely so they can steal personal information and other files,
    or they’ll inject malware into the computer that the victim would have to pay
    to remove. Then they’ll obtain credit card or bank account and routing numbers
    to bill the victims for their so-called “computer services.”


    The cybercriminals typically call the victims on the telephone, offering to “clean”
    their computers or remove a virus they’re about to install. They’ll ask for $500
    to $1,000 for subscriptions to antivirus software, and they’ll even offer “senior
    citizen discounts” if the victim complains that the price is too high. In other
    cases, victims have called a telephone number that appears in a pop-up window
    on their computer screen. Scammers have used the pop-up windows to hack into victims’
    computers or lock them out and demand ransom. The Federal Trade Commission also
    discovered that cybercrime networks have been spending millions of dollars to
    advertise their fraudulent services through Google and other search engines. The
    search terms include words like virus removal, McAfee Customer Support, and Norton
    Support. The search-engine keywords are carefully chosen to confuse victims into
    believing the criminals are offering legitimate services from trusted band names.
    Even if they’re selling you actual software, it’s probably nothing you really
    need. Cybercriminals have also been known to call victims back weeks later to
    offer them refunds on their contracts. The bad guys will obtain the victims’ bank
    account records to allegedly send them a refund—but then use their banking information
    to steal money from them again. I’m telling you, cybercriminals must have a reserved
    room in hell.


    My friend’s mom was surfing the Internet one evening when a blue screen popped
    up on her computer with a warning that looked authentic. The message on the screen
    said that her computer was infected with a serious virus and she needed to act
    immediately because her antivirus software had expired. If she didn’t act right
    away, the message warned her, she’d lose all of her data. When my friend spoke
    to his mother, she was very concerned. The message instructed her to click a link
    to go to a website where she could use her credit card to pay $79 for an update
    to her antivirus software. Thankfully, she picked up the phone and called her
    son before using her credit card. My friend advised her that the blue screen was
    a scam, and he instructed her to shut down her computer, unplug it, then plug
    it back in and start it up. Once the computer turned back on, the blue screen
    was gone. The scam is called a fake antivirus attack, and it has been around for
    about a decade. It is still going strong because unsophisticated computer users
    enter the market everyday. Once the victim provides his or her credit card number
    to the bad guys, another screen pops on the computer that says the virus has been
    removed, and the computer is now functioning properly. In reality, the only thing
    the victim has done is given the bad guys a credit card number to use unlawfully.


    Computer tech-support fraud is a huge business around the world. In May 2018,
    the U.S. Department of Justice announced that it had arrested two Florida men
    who allegedly owned and operated two tech-support scam companies: Client Care
    Experts, LLC, based in Boynton Beach, Florida, and ABC Repair Tech, based in Costa
    Rica. From approximately November 12, 2013, until at least December 9, 2016, the
    federal government alleges, the two men and others conspired to defraud more than
    forty thousand people across the U.S. and other foreign countries. These criminals
    raked in more than $25 million, according to prosecutors, by purchasing pop-up
    ads that appeared without warning on consumers’ computer screens and locked up
    their browsers. The pop-ups falsely told users that their computers were infected
    with malware and viruses and that they were in danger of losing their data. Just
    as my friend’s mother saw on her screen, the ads instructed them to call a toll-free
    number for help.


    Computer users should be extremely careful whenever a screen pops up on a computer
    claiming they have a virus. The pop-ups trick the users into clicking a link,
    and by now you hopefully know what happens when you click on an unfamiliar link.
    It will usually get you into trouble, because the link is designed to install
    malware that either steals your password and username or encrypts all of your
    files so they can’t be unlocked without paying a ransom. That’s a horrible trap
    for anyone to fall into—especially our nation’s seniors.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Do not give remote control of your computer to a salesperson
    or technician who calls you unannounced.


    ![Image](images/lock.jpg) If you receive an urgent or unscheduled call from someone
    who claims to be tech support, hang up the phone. Ninety-nine out of one hundred
    times, it’s going to be a scammer.


    ![Image](images/lock.jpg) Do not rely on caller ID to authenticate the person
    on the other end of the phone. Cybercriminals spoof caller ID numbers or block
    their numbers before contacting victims. They can make it appear they’re calling
    from Microsoft or Apple, but they might really be located in West Africa or Eastern
    Europe.


    ![Image](images/lock.jpg) Remember that IT professionals are never going to call
    you from computer and software companies like Apple, Microsoft, Norton, and McAfee.
    If you have a legitimate problem with your computer or software, you have to pick
    up the phone and call them for help.


    ![Image](images/lock.jpg) Keep your computer’s antivirus software, firewalls,
    and pop-up blockers up to date.


    ![Image](images/lock.jpg) Never call a phone number that’s included in a pop-up
    advertisement on your computer screen. Cybercriminals spend millions of dollars
    purchasing pop-up ads through Google and other search engines.


    ![Image](images/lock.jpg) Never call computer-repair companies that you find through
    Google and other search engines. I would recommend only calling well-known companies
    like McAfee and Norton directly for service issues. If you’re close enough to
    an Apple Store or other computer retailer, I believe it’s safer to have the repairs
    done in person than over the Internet.


    ![Image](images/lock.jpg) If you receive a call from someone offering you a refund
    on an antivirus software subscription, hang up the phone. How many companies do
    you know that actually call you to give money back? Do not, under any circumstances,
    provide them with a credit card number or bank account and routing numbers. It’s
    a scam, and they’re going to steal your money.


    ![Image](images/lock.jpg) If you’re the victim of computer tech fraud, make sure
    you report the incident to law enforcement. It’s the only way we’re going to stop
    this type of crime.


    ![Image](images/chap.jpg)


    ## CHAPTER 18:


    ## Keeping Kids Safe


    I WITNESSED A LOT OF bad things throughout my long career, such as people losing
    their life savings and small businesses having to close their doors after they
    were victimized by cybercriminals. What could possibly be worse? That’s easy:
    When the bad guys harm children and steal their innocence. We have the resources
    to hunt these terrible people down and send them to jail for a very long time,
    but we can never return a child’s innocence.'
