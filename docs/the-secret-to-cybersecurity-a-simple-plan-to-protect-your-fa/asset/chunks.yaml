    policy and determine if it’s covered for loss due to bank fraud. If it’s not,
    contact your insurance agent to find a policy that offers it.


    ![Image](images/chap.jpg)


    ## CHAPTER 17:


    ## Elder Scams


    THE ELDERLY ARE AMONG OUR most vulnerable citizens, and (not surprisingly) they’re
    among those who are most often targeted by cybercriminals. There were nearly fifty
    thousand complaints of fraud involving victims over the age of sixty reported
    to the Federal Bureau of Investigation in 2017, with adjusted losses totaling
    more than $342 million. The U.S. Government Accountability Office estimated in
    2018 that financial fraud targeting older Americans probably cost seniors about
    $2.9 billion annually. Most fraud, they say, isn’t reported because either the
    victims don’t know where to report it, they’re too ashamed to admit they’ve been
    scammed, or they don’t even know they’ve been victimized.


    On February 22, 2018, U.S. Attorney General Jeff Sessions announced the formation
    of the Elder Justice Initiative, which is designed to support and coordinate the
    U.S. Department of Justice’s enforcement efforts to combat elder abuse, neglect,
    and financial frauds and scams that target senior citizens. “The Justice Department
    and its partners are taking unprecedented, coordinated action to protect elderly
    Americans from financial threats, both foreign and domestic,” Sessions said at
    the time. “When criminals steal the hard-earned life savings of older Americans,
    we will respond with the tools at the Department’s disposal—criminal prosecutions
    to punish offenders, civil injunctions to shut the schemes down, and asset forfeiture
    to take back ill-gotten gains.”


    The Elder Justice Initiative seeks to provide targeted training and resources
    to prosecutors, law enforcement, judges, victim specialists, first responders,
    and civil legal aid employees to better respond to elder abuse. The U.S. Senate
    Special Committee on Aging is also working hard to educate elderly citizens and
    their families about the dangers of telephone and computer scams. The bad guys
    use a variety of scams to target senior citizens, including impersonating agents
    of the Internal Revenue Service or telling them they’ve won millions of dollars
    in the Jamaican lottery (but need to send money to claim their prize).


    Some schemes originate over the Internet, while others are conducted by telephone.
    I once received a call about an incident involving a man named Martin, an eighty-year-old
    retired attorney. One night, Martin received a phone call and the muffled voice
    on the other end sounded like his grandson, Fred. “Grandpa, I’m in trouble and
    need your help,” the man said. Martin asked Fred what was wrong and how he could
    help. Fred explained that he was in Florida for spring break, and his taxi driver
    had been arrested for having drugs in the trunk of his car. The police accused
    Fred of being an accomplice and arrested him too. Unless Fred paid $2,500 in bond,
    the police were going to keep him in jail until a trial two weeks later. Martin
    knew his grandson was indeed on vacation in Florida for spring break and started
    to worry. Fred begged his grandfather not to tell his parents, because they’d
    get angry if they knew he was in trouble. Fred was studying at Vanderbilt University,
    and he told his grandfather that he had a final exam the following week and would
    fail the course if he missed it.


    Martin would do anything for his family—especially his grandson, whom he loved
    dearly. Martin asked Fred if he needed an attorney, and he replied that he only
    needed bail money and had already located a bail bondsman. After Martin agreed
    to send the money, Fred put him on the phone with a bail bondsman, who provided
    him with instructions on how to send the money via Western Union. The bail bondsman
    also told Martin that police had confiscated Fred’s cell phone as evidence, so
    he provided him with another phone number to call once the money was wired. Later
    that night, Martin went to a Western Union location and wired $2,500 to the bondsman.
    A few hours later, he received another phone call from Fred asking for an additional
    $2,500 to pay a fine, and he went back to Western Union to wire more money.


    Fortunately, during Martin’s second visit, the Western Union clerk asked him why
    he was sending the money. Martin explained that his grandson was in jail and needed
    help. The clerk asked why Fred’s parents weren’t sending the money, and he explained
    that he was trying to cover for his grandson. At this point, the Western Union
    clerk was concerned that the elderly man might be a victim of a scam. Together,
    they called Fred’s cell phone. Fred answered and said, “Hi, Grandpa. How are you?”
    Martin asked him if he’d been released from jail yet, and Fred sounded confused.
    Fred replied that he hadn’t been in jail and was perfectly fine.


    By the time Martin contacted me, it was too late to get his money back. It was
    long gone. It’s extremely difficult to track money sent through the Western Union
    network since the recipient can pick it up at any location around the world. It
    didn’t take long to figure out what happened either. The bad guys were able to
    view Fred’s Facebook profile since he had set it to public (meaning anyone could
    view his posts). There, they identified his family and friends and saw photographs
    from his vacation in Florida. When they researched Martin, they discovered he
    was Fred’s grandfather, worked as an attorney, and lived in an expensive part
    of town. All that information is easily accessible through county tax records
    and professional licensing, which are available to anyone online. Since Martin
    was eighty years old, the thief took a gamble by muffling his voice and pretending
    to be Fred. If the bad guys had asked for $10,000 or $20,000 for bail money, I’m
    pretty sure Martin would have paid it. He was willing to do anything to help his
    beloved grandson.


    Grandparents are an easy target for cybercriminals. The crooks prey on the elders’
    love for their family and, oftentimes, their limited knowledge of Internet scams.
    I’ve seen grandparents be targeted by a bad guy who claimed that their loved ones
    had been involved in a car wreck and needed money for towing and medical bills.
    The messages are always sent with a sense of urgency, and the thieves allege that
    not sending the money will cause even more harm to their endangered family members.
    Thinking about this particular scenario doesn’t just break my heart, it makes
    my blood boil.


    I recently met a woman at a cybercrime prevention conference who explained that
    her daughter was traveling to South America for a mission trip. Her daughter had
    shared that news with the entire world on her Facebook account, and her mother
    wanted to know what she should do about it since it was already too late to delete
    the information on Facebook. I told her to expect telephone calls and emails from
    cybercriminals pretending to be her daughter, claiming to be in trouble, and asking
    for money. We can’t control what the crooks are going to do, but we can control
    how we react. I told the woman to establish a predetermined code word that only
    she and daughter knew in case she was really in trouble. They could also come
    up with a series of questions that no one else would be able to answer. I told
    her to make sure they didn’t discuss the code word or questions and answers over
    text messaging and email. And, of course, I encouraged her to tell her daughter
    to quit sharing details of her personal life on social media. We make it so easy
    for the bad guys to victimize us sometimes.'
