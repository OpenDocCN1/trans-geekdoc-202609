- raw: 'Sometimes the bad guys have no intention of unlocking your data, and other
    times the encryption keys are lost forever. Cybercriminals don’t like to keep
    incriminating evidence on their own computers, so they’ll often hide encryption
    keys on other people’s computers—the ones they’ve already hacked. Every so often,
    a company discovers that bad guys are using its computers and immediately takes
    them offline. When that happens, the victims who paid ransom for encryption keys
    might be out of luck because the cybercrooks can’t access the keys even if they
    wanted to.


    Like most cybercrime, identifying and apprehending the criminals behind ransomware
    is never easy. In one of my FBI investigations, a criminal who developed a specific
    variant of ransomware was indicted by the U.S. Attorney’s Office. The problem
    was that he lived in Russia, and the Russian government doesn’t cooperate with
    the U.S. when we want to arrest one of its citizens for computer intrusion.


    Nonetheless, the FBI and other international law enforcement agencies are certainly
    trying to stop the bad guys behind ransomware. In December 2017, the FBI and UK
    National Crime Agency, along with Romanian and Dutch investigators, arrested five
    individuals in Romania who were suspected of spreading two major ransomware variants—CTB-Locker
    and Cerber. Google’s research estimated that Cerber had generated about $6.9 million
    before it was stopped. Two of the suspects arrested, a twenty-five-year-old man
    and twenty-eight-year-old woman, were also suspected of illegally accessing one
    hundred and twenty-three computers that help run the Washington D.C. Metropolitan
    Police Department’s surveillance cameras. Not coincidentally, this happened just
    ahead of President Donald Trump’s inauguration in January 2017. Remember what
    I said earlier? These hackers aren’t teenaged kids sitting in front of computers
    in their parents’ basements. They’re intelligent, sophisticated hackers who have
    unfortunately decided to use their skills to commit major crimes.


    What’s the best way to back up your data? The first and most important step is
    to identify your mission-critical information. If you’re working on a thesis paper
    or bestselling novel and haven’t made backup copies, you’re at great risk. The
    same goes for tax records, accounting spreadsheets, and other important business
    documents. You can always reinstall software programs and maybe retrieve music,
    but some things are too valuable to lose. Think about it for a while, and then
    go to your computer and open your files. A lot of people prefer to store their
    most important documents in free cloud-based accounts like Google Drive, Microsoft’s
    OneDrive, Apple’s iCloud, or Dropbox. But keeping a copy in the cloud without
    two-factor authentication is just asking for trouble, in my opinion.


    The best thing to do is to go out and purchase a portable USB hard drive; a 1
    TB drive costs about $60. Then copy your files from the computer to the external
    hard drive either manually or using one of the many available software backup
    options. At that point, you’ll have a complete backup for your most important
    documents. When the backup is complete—and this is important—unplug the drive
    from your computer and put it in a safe place. Then set up a schedule and back
    up your data accordingly, whether it’s daily, weekly, or monthly, or whatever
    fits your needs.


    Now, what if there is a fire in your house and both your computer and the backup
    drive are destroyed? You can purchase a fireproof box and hope it makes it through
    a fire or that it will survive a tornado or a flood. Another option is to use
    a paid online backup service, such as Amazon Cloud Services or Carbonite. Find
    one that supports most of your devices and use the downloadable app provided to
    make a mirror image of your files. The best option is to do both: Back up locally
    on a hard drive you can keep safe and back up to a cloud storage provider that
    keeps your data safely offsite. As many security professionals say, if you don’t
    have at least three copies of your data, your data isn’t really backed up at all.


    There is nothing worse technologically than not having your important information
    backed up or realizing that your computer has been infected with ransomware, leaving
    you no choice but to pay and pray that you’ll get your stuff back. Don’t let Boris
    steal or encrypt your only copy of your important files. Get a backup strategy
    in place today.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Identify your most important data and regularly back
    it up, always verifying the integrity of those backups. Backups are critical in
    ransomware attacks. If you are infected, your backups might be the only way to
    recover your critical data.


    ![Image](images/lock.jpg) Secure your backups. Make sure they’re not connected
    to the computers or networks they’re backing up. Secure backups on the cloud or
    physically store them offline on external hard drives.


    ![Image](images/lock.jpg) One backup is never enough, so make sure to use a cloud-based
    backup system, as well as an external hard drive to be especially safe. Be sure
    to use a cloud service that offers two-factor authentication—and turn that feature
    on immediately.


    ![Image](images/lock.jpg) Patch your operating system and set up regular and automatic
    updates. Ransomware writers are constantly writing new variants and strains, and
    software vendors regularly offer patches and updates to protect systems from new
    ransomware.


    ![Image](images/lock.jpg) Make sure your browser is also up to date, whether it’s
    Microsoft Edge, Google Chrome, Firefox, Safari, Opera, or anything else. They
    all have vulnerabilities that are being patched all the time.


    ![Image](images/lock.jpg) Be certain that you have a reputable antivirus security
    suite and firewall installed on your computer. The antivirus software will help
    you identify threats or suspicious behavior.


    ![Image](images/lock.jpg) Most importantly, as always, think before you click
    a link or open an attachment. Practice your human firewall skills. Most ransomware
    is installed when the victim clicks a link or opens an attachment.


    ![Image](images/lock.jpg) Employ content scanning and filtering on your email
    servers. Incoming email should be scanned for known threats and block any attachments
    that might pose a threat.


    ![Image](images/lock.jpg) If you fear your computer has been infected, immediately
    disconnect it from your network and disable Wi-Fi and Bluetooth to prevent the
    malware from spreading to other machines.


    ![Image](images/lock.jpg) Don’t pay ransom to the hackers. Studies show that hackers
    still fail to decrypt the victims’ data one of out of every four times, despite
    being paid. Remember that paying the bad guys only encourages them and funds their
    illegal operation.


    ![Image](images/chap.jpg)


    ## CHAPTER 16:


    ## Better Online Banking


    ALMOST A DECADE AGO, WHEN I was still working for the FBI, I received a telephone
    call from an attorney. And, like almost everyone else who called me back then,
    there was desperation in his voice. He had discovered that $500,000 had been wired
    without his consent to an account at Alpha Bank in Moscow. The escrow account
    contained his client’s money, and his bank informed him that it couldn’t recall
    an overseas wire transfer. I told him that recalling an international wire is
    next to impossible, but we’d do everything possible to try and help him.'
