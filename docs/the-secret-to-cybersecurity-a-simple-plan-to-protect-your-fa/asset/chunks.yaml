  trans: '


    ![Image](img/lock.jpg) 在你所有的密码中使用由特殊符号和数字组成的秘密组合。在密码的开头使用它，然后在末尾以相反顺序再次使用。千万不要向任何人分享你的秘密组合。


    ![Image](img/lock.jpg) 使用短语（passphrase）来设计你的密码。短语由一串看似随机的单词组合而成。确保它是你能够记住但别人无法猜到的内容。避免使用他人可能知道的熟悉短语或著名名言。


    ![Image](img/lock.jpg) 在创建短语时发挥创造力。用数字“1”代替字母“I”，用符号@`代替单词“at”，并用数字“2”代替单词“to”。你也可以用美元符号（`$`）代替“S”。


    ![Image](img/lock.jpg) 将短语写下来，并将它们保存在只有你才知道的安全地方。不要将你包含数字和特殊字符的秘密组合与你的短语存放在一起。你必须在脑海中记住那个组合。


    ![Image](img/lock.jpg) 不要在这你不拥有的设备上输入密码。如果你正在图书馆、网吧或酒店使用公共电脑，请避免使用你的密码登录电子邮件、社交媒体和其他任务关键型账户。这些电脑应该只用于匿名浏览互联网，因为网络可能并不安全。


    ![Image](img/chap.jpg)


    # 第 8 章：双重身份验证


    让我们回顾几个可以帮助你避免成为网络犯罪受害的重要步骤。首先，到目前为止，你应该已经在反复强调：“我在点击之前会先思考。”当你收到来自银行、信用卡公司、eBay、Amazon、联邦快递（Federal
    Express）或任何其他人要求你点击链接的电子邮件时，你要停下来思考一下，然后拨打电话来确认包含链接的电子邮件或短信是否真实。


    其次，你将不再对多个平台使用相同的密码。而且你肯定已经识别出了自己的任务关键型账户，例如电子邮件、社交媒体、手机、银行和电子商务。这些平台需要我们在上一章中讨论的那种短语。我已向你展示了创建和记忆一个由
    12 个字符（包括大写和小字母、数字和至少一个特殊符号）组成的短语是多么简单。希望你已经把你的短语写下来并放在了安全的地方，而且你没有写下你那个包含数字和特殊字符的最高机密组合。既然你已经做了足够让你晚上睡得更好一点的事，我们还有另一个重要的安全技术需要实施。


    在我最近的一次研讨会之后，一位女性带着自信的微笑走向我，告诉我她已经使用了多年多个短语。她使用她她最喜欢的歌曲之一的一句歌词作为短语，包含 20 个字符。我祝贺了她并告诉她这是一个很好的开始，但接着我问她，如果我设法获得了她银行账户的短语会发生什么。我告诉她我将能够登录她的账户并偷走她的钱。你可以做对一切——不点击可疑链接，不对所有事情都使用同一个密码——但仍然成为受害者。


    幸运的是，我要告诉你如何保持安全。不过，在我分享这项技术之前，让我们回到基础。在过去的几年里，我可能已经向公民团体、学生和公司进行了两百多场网络安全简报。第一个听起来可能有点傻，但请听我说一秒。问题是：听观众中是否有人不使用电子邮件进行通信；不使用
    `LinkedIn`、`Facebook`、`Twitter` 或 `Instagram` 等社交媒体平台；不使用在线银行或电子商务；且不在云平台上存储信息？像
    `Google Drive`、`Dropbox` 或 `iCloud` 这样的平台作为服务管理和运行数据；数百万人使用它们来备份联系人、电子邮件、文档、照片、音乐和所有内容。通过云存储，你可以根据需要增加或删除容量。


    现在下一个问题更为重要：你是否使用多因素身份验证（`MFA`）或双重身份验证（`2FA`）来访问你的平台？当我问这个问题时，总是会得到人们困惑的眼神。`MFA`
    和 2FA` 是非常简单的概念——它们涉及比单一密码更多的东西。这样想：如果我通过偷你的密码就能登录你的 `Gmail` 账户，那么你就没有使用 `MFA`
    或 `2FA`。


    多因素和双重身份验证意味着访问账户需要比密码更多的东西。这是一层只有用户知道或拥有的额外网络安全层，例如某些信息，如口令、`PIN` 或你除了密码之外使用的六位数字。当你尝试登录账户时，这六位数字通常会通过手机短信、智能手机上的应用程序或通过如
    `fob` 或优存盘等小型设备上的硬件令牌提供给你。先进的基于生物识别的 `MFA` 甚至将传统的密码和令牌系统替换为指纹、面部或语音识别、虹膜扫描和其他生物识别技术。这是未来的趋势，而且非常酷。


    如果你从未听说过 `MFA` 或 `2FA`，那么今天就是你的幸运日，因为我将向你解释在你的平台上安装它们是多么简单。不过，首先，让我强调几个可怕的网络犯罪统计数据，以强调双重身份验证的重要性。正如你现在可能意识到的样，网络犯罪是全球的一项大生意；数据泄露导致的年度经济损失达万亿美元。我之前告诉过你，分析师预测到
    2020 年网络犯罪损失将达到 6 万亿美元！这个数字大到我无法想象，但我担心这可能是准确的。在纳什维尔的 `FBI` 工作期间，我见证了数百甚至上千起网络犯罪案件，我估计这些案件中的受害者损失的金额可能超过了
    1 亿美元。而那些只是被报告给 `FBI` 并由我协助调查的案件。


    '
