  trans: '

    当我加入 FBI 时，我从未想过网络犯罪会成为我的专业领域。`1988` 年，我二十岁，被聘为 FBI 纽约分局的档案分类员。在我母亲替我完成申请表并提交后，她给了我
    `$100` 去买了两条聚酯纤维长裤、四件衬衫和两条领带。当时我对计算机一知甚少，对互联网更是一窍不通。


    我回到大学上夜校，并晋升为在 FBI 内部处理更多的会计和财务工作。随后，我开始在福特大学攻读金融和信息技术的 MBA 学位。在福特大学学习最棒的一点是周围有这么多导师——教授们，以及那些公开挑战他们所授授概念、并质疑其办事方法是否正确的学生。我非常享受这种挑战，并焕发了学习的动力。我只是不知道执法部门和
    FBI 的职业道路是否真的适合我。


    我一直听人说成为一名 FBI 探员极其困难，而且当时正处于招聘冻结期。所以，当我从福特大学获得 MBA 学后，我很确定想去华尔街找份工作。我想把有需求的人介绍给有资源的人，并为促成这些交易分得财务大蛋糕的一羹。尽管我已经在
    FBI 工作了六年，但我仍然住在妈妈家里的那间卧室，从五岁起我就一直睡在那张床上。我知道我需要开始经营自己的生活了。


    但在我离开 FBI 去华尔街工作之前，一个意想不到的机会出现在了我面前。`1994` 年春天，FBI 的招聘冻结结束，开始招募新探员。局里的现有员工拥有最高优先权，我的主管（对我来说如父亲一般的形象）鼓励我申请。令他非常惊讶的是，我告诉他对成为探员不感兴趣。他看起来既失望又愤怒。他严厉地告诉我，我要申请成为一名探员。


    大约六个月后，我前往弗吉尼亚州的昆提科参加新探员培训。我减了 20 磅体重，通过了笔试、面试、体检、背景调查和测谎仪。当我从新探员培训毕业时，我本以为会被回纽约市工作，甚至可能是回到我的首选地波士顿。相反，我被分配到了纽约州锡瑞
    acuse 的一个分局。对我来说，那里和爱荷华州或内布拉斯加州没两区别。


    如果你问我 `1995` 年 6 月的工作内容是什么，那描述起来很容易：有坏人在对好人做坏事，我的工作是与州和地方执法部门合作，把坏蛋关进监狱。最终目标是让纽约州北部变成对每个人都更安全的地方。在纽约北部司法区，我处理了大量的白领犯罪、银行抢劫、失窃财产和逃犯案件。说白了，作为一名新探员和层级中的底层人员，任何进门的案子我都会接。我并不不在乎。我有枪、有徽章、还有一辆带有警示灯和警报声的汽车，我被允许和同事一起出去玩“警察抓小偷”。这是一段很有收获的经历，我们成功把许多坏人关进了监狱。


    我的转折点发生在 `1996` 年，当时我接到了来自纽约州北部一家小型互联网服务供应商代表的电话，他想谈谈通过这些所谓的“公告板”出售被盗物品的问题。我与那个男人见面，他所描述的一切对我来说都是如此陌生。我在高中时上过几门编程课，可能我对计算机的了解比大多数
    FBI 探员都要多。`Windows 95` 的发布让计算机新手的操作变得简单得多。对于像我这样的用户来说，它几乎是即插即用的，这也是我对计算机感兴趣的原因。然而，我突然意识到，我需要学习更多关于计算机、互联网以及日益增长的网络犯罪威胁。


    我当时动力十足，回家买了一套价值 `$2,500` 的网关（Gateway）计算机系统，它拥有速度极快的 `133 MHz` 处理器和 `40 MB` 硬盘。这可能让我成为我分局里唯一拥有个人电脑的
    FBI 探员。我在纽约州奥斯维戈州立大学报读了一门互联网课程，但我必须自己承担费用。我的主管无法理解，为什么 FBI 需要关注互联网上发生的事情。


    几乎是理所当然地，我成了锡瑞 acuse 分局的“网通（Internet guy）”，但这并不是一份很酷很有趣的工作。当其他探员在处理银行抢劫、毒品案件和追捕逃犯时，我正在追踪试图破解主机的
    18 岁少年。老实说，我不确定分局里是否还有其他人理解我在做什么。在当时，全美只有几个 FBI 探员参与此类案件。他们大多是寻求刺激的探员，试图获取网络访问权限。


    但网络犯罪在 `1990` 年代后期发生了阴险的转折，当时美国消费者开始在线使用信用卡支付商品和服务——这是电子商务的开始。当臭名昭著的罪犯威利·萨顿（Willie
    Sutton）被问及为什么在 `1930` 年代在纽约抢劫银行时，他简单地回答道：“因为那里有钱。”在世纪末，大量资金流向互联网，所以坏蛋们就去那里犯罪。如何阻止他们是我的责任。

    '
