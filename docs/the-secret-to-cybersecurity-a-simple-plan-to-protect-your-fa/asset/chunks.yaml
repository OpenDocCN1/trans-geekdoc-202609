    # BEC 诈骗：案例研究与预防


    我处理过的 BEC 诈骗案中，最大的受害者是一家小公司，损失了 750 万美元。当时该公司的首席执行官正在海外旅行，一个坏分子伪造了一封邮件发给财务经理，声称来自
    CEO。在邮件中，冒充者声称，由于他身在国外，无法信任酒店的网络安全，因此被迫建立了一个新的邮箱账户。冒充者告诉财务经理，他正在处理一笔高度敏感的业务交易，并指示经理等待一位律师的指示，律师将告诉他如何操作。几小时后，财务经理收到了来自那位律师的邮件，并按照指示向香港的一家银行电汇了
    750 万美元。更糟糕的是，CEO 和财务经理在接下来的两周内都没有交谈。等 CEO 回到美国发现公司遭受受害时，采取行动已经为时晚了。我曾见过许多案例，资金被汇往了香港和中国的银行，那里的银行业和隐私法使得即使是执法部门也几乎无法获取信息。他们的法律让网络犯罪分子能够逍遥法法作案。


    ## 为什么 BEC 诈骗会成功


    为什么网络犯罪分子能如此轻易地实施一起 750 万美元的抢劫案？不幸的是，我们倾向于信任邮件中的内容，很少通过电话联系发送者来核实邮件内容。网络诈犯已经通过
    BEC 诈骗骗取了 120 亿美元。这不仅伤害了受害者，还严重损害了全球经济。有一个简单的解决方案：我们必须停止假设每封邮件都是可信的。


    曾有供应商向我推销某些产品，声称这些产品像“银弹”一样，能通过保持邮件安全来降低风险。然而，我认为你不应该把一个糟糕的业务流程包裹在技术里，然后听天由命。相反，让我们制定一项政策，禁止根据某人在邮件或短信中看到的内容就进行转账。让我们要求任何向美国或海外银行账户汇款的人必须接受验证——无论是通过电话还是面对面。虽然对许多人来说这似乎是常识，但这种简单的商业做法本可以防止我讨论过的几个问题。


    ## 利用薄弱的业务惯例


    我不想说，但这种改变可能不足以消除 BEC 诈骗。坏分子在不断识别薄弱的业务惯例，并发明阴险的方法来利用它们。我给你举一个很好的例子：在 FBI 工作的几年里，在
    4 月 15 日之前，我会收到大量来自恐慌的 CEO 或内部会计师的电话，那是美国公民每年的联邦税报税截止日。这每年都会发生，因为那些骗子无疑发明了新方法来利用办公室经理、人力资源官、会计师以及任何从事薪资和税务工作的人员。


    在我调查的一个案件中，一名网络犯罪分子通过一封伪造成来自公司高管的邮件针对了人力资源部门。冒充者以税务和审计为目的索要每位员工的个人身份信息和 `W-2`
    表格。在一周内，我收到了来自七家因此特定 BEC 诈骗受害的公司的电话。在每个案例中，受害者都将其员工的敏感信息发送给了网络犯罪分子，他们无法理解自己为什么成为目标，因为他们并没有在公司网站上维护员工信息。当我向他们展示坏分子如何通过
    `LinkedIn` 和其他社交媒体定点他们的员工时，他们感到非常惊讶。这是大多数企业的常见做法吗？如果你们公司的新人力资源主管收到老板发来索要此类信息的邮件，他或她会做什么？只需要一个电话或面对面的会议就能防止坏事的发生。


    ## BEC 策略的演变


    在 FBI 调查网络犯罪最令人沮丧的方面之一，每当我们教育公众一种类型的 BEC 诈骗时，坏分子就会想出另一种变体。这几乎无法跟得上！在我调查的另一个案件中，`Company
    X` 从 `Company Y` 处购买了一个价值 350 万美元的昂贵部件。一旦交易获得批准，`Company Y` 的某人向 `Company X` 的应付账部门发送了一份
    350 万美元的发票。这种类型的交易在美国企业中每天发生数千次。`Company X` 的应付账部门知道发票即将到来，因此办事员开始安排付款流程。


    然而，大约一小时后，办事员收到了来自 `Company Y` 的另一封邮件，告知她初始发票是不正确的，公司被多收了 3000 美元。包含正确金额的第二份发票将立即发送。那么，应付账办事员做了什么？你猜对了。她开始了支付较小总额的流程；如此大额的发票需要五级管理层的签字。在公司高层经理签字后，她启动了从
    `Company X` 向 `Company Y` 电汇的 349.7 万美元


    ## 法律与保险挑战


    大约十天后，`Company Y` 的会计师向 `Company X` 的应付账办事员发了一封邮件，友好地提醒未付的 350 万美元。（等等，文中说余额是
    350 万美元然后是 349.7 万美元，让我们重读）。


    大约十天后，`Company Y` 的会计师向 `Company X` 的应付账办事员发了一封邮件，友好地提醒余额。显然，这封邮件在 `Company X`
    引起了不小。那里的员工检查了原始邮件查看钱汇到了哪里，他们发现钱被汇到了 `Company Y` 在中东的银行账户。只有一个问题：`Company Y` 在中东并没有银行账户！等
    `Company X` 的人给我打电话帮助时，太晚了。坏分子已经从他们控制的银行账户中取走了钱。而且，由于该国家的银行隐私法，银行在没有协助条约的情况下不会共享信息，这需要我获得
    `U.S. Department of Justice` 的批准——这将需要几个月。我在该国家的 FBI 同事告诉我，他每天都能看到这种非法活动。


    `Company X` 有一份 1000 万美元的网络责任保险单；不幸的是，他们被告知这种欺诈不在涵盖范围内。欺诈保险单仅在电汇验证涉及两方参与时才涵盖损失。然而，`Company
    X` 的应付账办事员在汇款之前从未联系过 `Company Y` 的任何人。如果她联系了那里的人验证账户号码和新发票总额，她可能会被告知这确实是法的——因为她会拨打坏分子发送的那封虚假第二封邮件上的电话。那将是一个看似
    `Company Y` 的仿域名。即使她仍然会汇款，但尝试验证电汇细节的行为也足以激活他们的保险单了。太晚了。


    ## 技术分析


    `Company X` 最终花费了 5 万美元请私人侦探来试图追踪这些犯罪分子。你猜侦探发现了什么？网络窃盗分子接管了 `Company X` 一位高管员工的邮箱账户，因为公司没有使用双重身份验证。坏分子读了了他的邮件，发现
    `Company Y` 准备好发送一份 350 万美元的发票。他们在公司邮件系统中设置了正转发规则，当 `Company Y` 向 `Company X`
    发送发票时，他们拦截了邮件并发送了伪造的发票。


    '
