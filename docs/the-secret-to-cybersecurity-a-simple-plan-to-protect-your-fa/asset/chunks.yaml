  trans: '

    现在，我敢肯定现在有几位正在阅读这段文字的人可能会说自己没什么好担心的，因为拥有苹果电脑、iPad 或 iPhone。许多人错误地认为，那些类型的 `macOS`
    或 `iOS` 设备可以免受我一直以来说的那些坏事的影响。我的朋友，我不想向你带来坏消息，但苹果产品可以免受恶意软件侵害的说法完全是胡说八道。2011 年，一次恶意软件攻击试图通过从伪造的
    [appleid.apple.com](http://appleid.apple.com) 发件地址发送主题为“Apple 更新您的账单信息”的电子邮件，来窃取苹果所有者的用户名和密码。最近，在
    2018 年 2 月，一个欺诈弹窗要求苹果用户输入他们的 `Apple IDs` 和密码。我能给 `iOS` 用户最好的建议是：只在 `Settings`（设置）应用或
    `iTunes Store` 中输入 `Apple IDs` 和密码，千万不要在弹出窗口中输入。


    我处理过一起 FBI 案件，涉及一家小型理财师公司的所有者，他是一个长期 `iOS` 用户。他叫 Rogers，他收到一封来自一位与他有业务纠纷的客户的邮件。邮件的主题是“请阅读此重要文件”。邮件中似乎附带了一个
    `PDF` 文档。Rogers 感到好奇，于是点击了该 `PDF`。Rogers 并没有看到文档，而是被重定向到一个网页，显示有一个 `DocuSign`
    文档需要查看。`DocuSign` 是一家合法的在线公司，方便合同和其他敏感文档的电子交换。全球有超过两亿人使用过它。Rogers 告诉我，他认为他的客户正在起诉他，所以他点击了
    `DocuSign` 文档。不幸的是，Rogers 就要以惨痛的方式了解网络犯罪了。他在收到文档时产生了一丝警觉，于是回复了发件者并询问该通信是否真实。他并没有意识到坏人已经接管了他客户的邮箱账户，而对方的回信告诉
    Rogers 这确实是真的。当 Rogers 尝试打开 `DocuSign` 文档时，他被带到了一个网页，网页指示他输入自己的 `Microsoft` 用户名和密码。


    几小时后，我收到了 Rogers 的的一封未经请求的邮件，主题是“请阅读此重要文件”。邮件包含一个附带 `PDF`。此时，Rogers 还没有向我分享任何细节，所以我迅速拿起电话打给了他。在意识到别人可以访问他的邮箱账户后，他惊慌失措了，因为他提供了
    `Microsoft` 用户名和密码。坏人向他通讯人录中的一千多人发送了邮件，其中许多人是他的客户。更糟糕的是，犯罪分子删除了 Rogers 通讯录中的所有联系人，导致他无法发送后续邮件警告他们删除原始信息。网络诈骗犯还访问了他的
    `OneDrive` 在线存储账户，其中包含了他所有的客户记录。而且这不是全部！他们还获取了——你猜怎么着——没错——一个包含他每个银行账户密码的文件。现在，你还觉得仅仅因为你在使用
    `iOS` 设备就是安全的吗？要记住的最重要的一点是，坏人不惜一切代价想要获取你的用户名和密码，他们将使用他们能使用的每一个肮鄙的手段来偷取它们。你的邮箱账户是一座金矿，一旦他们获得了访问权限，他们就会利用它来欺骗其他人交出用户名和密码。或者他们会直接在他们的电脑上安装恶意软件来代他们这样做。


    正如我所说的，防病毒软件和入侵检测系统并不总是能救你，苹果电脑也是如此。这就是为什么你需要完全改变你对网络安全的观念。你需要变成一个肉防火墙，质疑你收到的每一封邮件。如果你的银行给你发了关于某事的邮件，请拿起电话拨打当地分行。如果你收到来自
    `FedEx` 或 `UPS` 关于物流延迟的邮件，而你并没有在等包裹，打给他们。如果你确实在等包裹，不要点击链接并登录网页门户。如果你收到一封带有 `Facebook`
    或 `LinkedIn` 好友请求的邮件，不要点击链接登录应用程序或网站。如果你的好朋友或家人给你发了一封带有链接或附件的邮件，在点击之前请想两遍。先给他们发一封邮件询问其是否真实。我可以没完没了地说我在为
    FBI 调查网络犯罪时看到的各种场景。


    由于钓鱼邮件比以往任何时候都更精精密、更先进，被骗点击的情况变得容易得多。其中一些邮件太完美了，我担心甚至我某一天也会中招。所以，请重复我的话：我会在点击邮件之前思考，并将成为一个肉防火墙。将这一步重复一千次是网络安全的第一步。


    # 如何避免成为受害者


    ![Image](img/lock.jpg) 成为一个肉防火墙并检查你收到的每一封邮件。意识到坏人想要利用你的邮箱账户作为武器。


    ![Image](img/lock.jpg) 理解坏人渴望你点击链接或打开邮件中的附件。在充分验证其真实性之前，不要打开！


    ![Image](img/lock.jpg) 查看邮件发送的时间。如果是在凌晨 2:30 发的，而你知道那个人从不在那个时间发邮件，不要打开。


    ![Image](img/lock.jpg) 检查邮件的其他收件人。如果邮件是发送给一大群，通常意味着账户被破解并是由自动程序发送的。


    ![Image](img/lock.jpg) 如果你收到来自银行、信用卡公司、公用事业公司、`FedEx`、`UPS`、`Amazon`、`eBay`、`Facebook`、`LinkedIn`
    或任何金融机构或社交媒体应用的紧急邮件，不要打开！手动通过浏览器或应用程序登录实际账户检查是否存在问题。


    ![Image](img/lock.jpg) 列出重要的电话号码，例如你的银行和信用卡公司，拨打你手中的号码，而不是邮件中包含的号码。


    ![Image](img/lock.jpg) 如果你收到一封来自社交媒体的好友请求邮件，不要点击邮件中的链接登录账户。坏人喜欢利用社交媒体好友请求攻击受害者。如果我收到来自
    `LinkedIn` 的连接请求，我会自动删除邮件，然后登录实际 `LinkedIn` 应用程序查看是否是真实请求。


    ![Image](img/lock.jpg) 这非常重要：不要将你的金融机构、信用卡公司、事业单位、邮箱和社交媒体的用户名和密码存储在 `OneDrive`、`Dropbox`、`Google
    Drive` 或 `iCloud` 上。将它们写在纸上并将副本放在安全的地方。


    ![Image](img/chap.jpg)


    ## 第章：


    ## 移动设备安全


    我已经讨论过在点击邮件之前思考的重要性，但网络诈骗还有其他方式。我姐姐 Bonni 是纽约长岛一所小学的校长，她是一个可以理解的忙碌的人。最近，她收到一条来自银行的短信，告知她的支票账户因为一笔
    2000 美元的交易而透支。银行的短信指示她点击一个链接，带她进入银行网站查看重要信息。短信说，如果她不立即处理该问题，将被收取巨额透支费。

    '
