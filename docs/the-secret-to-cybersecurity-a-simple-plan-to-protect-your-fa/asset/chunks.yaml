    ## 致谢


    如果你在三十年前告诉我，我将在联邦调查局（FBI）度过了一段辉煌的职业生涯后就能享受退休生活，与我梦中情人结婚，并成为一本关于网络安全书籍的作者，我会告诉你那不是我的生活。回望这段旅程，我不禁想起，你的强大取决于你身边的人。在我的整个职业生涯中，我遇到了许多令我深受鼓舞的人，我列出了几个让这个梦想成为现实的人。如果不是我母亲
    Alice Augenbaum，我永远无法在 `FBI` 找到那份入门工作。如果不是她帮我填写了申请表，谁知道我今天会在哪里。


    我的朋友 Natalie O’Connell 促使我回到纽约市立学院（City College）留学。她还启发了我在福特汉大学（Fordham University）攻读信息技术
    MBA，这引发了我对技术的激情。


    `FBI` 纽约办公室的主管特探（`SSA`）Robert Grubert 担任了我六年的主管。他提供了我成功所需的所有工具。如果没有几位特探的友谊支持，包括
    Philip Sarcione、Joseph Cervini、Robert Leneck 和已故的 James Downey，我也无法坚持。


    在被派到锡拉库驻办事处期间，我受到了周围四位最出色的 `FBI` 特探的指导：John Winslow、Philip Looney、Robert Haley
    以及我的主管 Michael Mason。此外，我与许多其他人建立了许多深固的友谊。


