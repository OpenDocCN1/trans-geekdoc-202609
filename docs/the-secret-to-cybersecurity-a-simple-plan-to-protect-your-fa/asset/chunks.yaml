- raw: 'Many workers in corporate America use Dropbox as an easy way to move and share
    large files. Do you think it’s a good idea for your doctor to use Dropbox to access
    your medical records from his home computer or anywhere else in the world? Some
    might say it’s a great idea, because he could save lives and work more efficiently.
    But what if your doctor has a Yahoo! account that was hacked by criminals who
    stole his username and password—the same login credentials he also used for Dropbox?
    Unfortunately, we know the end result: Bad guys could gain access to sensitive
    personal files, including your medical records. Am I saying you shouldn’t use
    Dropbox? No; I’m saying it’s a great tool and you should use it—but only if you’re
    using two-factor authentication to secure your information.


    Google Drive and Dropbox aren’t the only clouds being used to store accounting,
    medical, and payroll records. I had one case while I was working for the FBI that
    involved crooks gaining access to an accountant’s cloud-based software package.
    His email was hacked and, unfortunately, he used the same password for his cloud-based
    software. The bad guys were able to access his clients’ names, dates of birth,
    Social Security numbers, email addresses, and bank account and routing numbers.
    He had to pay an expensive security firm to come in and clean up the mess. He
    also had to notify his customers that he’d lost their information, which I’m sure
    cost him some business. This victim admitted to me that the incident cost him
    more than $75,000 after all was said and done. A Big Four accounting firm can
    handle a financial loss like that, but it took a lot of hard work to keep this
    small business from going under.


    In another case, cybercriminals gained access to a small business’ payroll platform
    by logging in with stolen usernames and passwords. With the stolen information,
    the thieves changed bank account and routing numbers to bank accounts they controlled.
    The bad guys walked away with more than $100,000, and the company was forced out
    of business.


    Unfortunately, cybercriminals like to target small businesses because they don’t
    have the high-priced cybersecurity they need. A Verizon study found that 61 percent
    of cyberattack victims in 2017 were small businesses, up from 53 percent the previous
    year. Another report by Hiscox found that 47 percent of small businesses suffered
    at least one cyberattack in the previous twelve months and 52 percent suffered
    multiple attacks. Like it wasn’t hard enough to keep a small business open nowadays!


    The biggest target for cloud attacks is Microsoft Office 365. In the old days,
    you purchased a hard copy of Microsoft Office, loaded the software to your computer,
    and went to work. Then, in June 2011, Microsoft introduced Office 365, giving
    consumers the ability to download Office software and store information in the
    cloud. It was cheaper and more efficient, but now the bad guys only needed usernames
    and passwords to attack. They didn’t have to break into an office computer or
    network, which formerly stored the sensitive information. In 2017, there was a
    sophisticated cloud-to-cloud brute-force attack against Office 365 users who worked
    at multiple Fortune 2,000 companies. The attackers tried logging in with different
    versions of Office 365 usernames, which suggested they’d already obtained some
    version of them through another breach or phishing attack. In a separate 2018
    phishing attack, cybercriminals attempted to dupe users and steal millions of
    Office 365 passwords by disguising malicious emails as tax-related notifications
    from the Internal Revenue Service.


    Microsoft recently asked YouGov, the Internet market research firm, to conduct
    a survey of one thousand small business owners on its behalf. Shockingly, about
    71 percent of small business owners who were surveyed said they believe they are
    at risk of falling victim to a cyberattack. Not surprisingly, only 50 percent
    of them were using some form of email encryption, and about 59 percent had no
    way of remotely wiping data from a lost or stolen device. Even worse, more than
    half of them said they handled Social Security numbers and 29 percent stored bank
    records. In most of the Office 365 breaches of the past, the bad guys gained access
    because users who were logging in remotely hadn’t installed two-factor authentication.
    Once their usernames and passwords were stolen, the crooks had access to everything
    in the company. The breaches weren’t necessarily Microsoft’s fault, though; it
    was the Office 365 users—people like us—who had dropped the ball by not keeping
    their information secure.


    When I speak at business conferences, I always make it clear that it doesn’t matter
    how much money you spend on information security products if you don’t use two-factor
    authentication for remote employees. I usually raise my voice when I’m talking
    about this subject, but I’m tired of dealing with issues that could have been
    easily avoided. Most of the people I talk to at technology conferences tell me
    there have been very few breaches in the cloud, and most that have occurred were
    actually computers breaches within the victim organization itself—not at the cloud-server
    provider. I always reply that bad guys are targeting end users and not cloud providers,
    and then I try to explain what steps they should take to keep their clients safe.
    I tell them they need to make sure to have separate passwords, a strong, robust
    password for their cloud account, and to only use cloud providers that offer 2FA.


    If you search online, there are thousands of cloud providers, and every one of
    them wants your business. Each provider lists numerous ways they can take your
    business to the next level without having to spend a pile of cash. When searching
    for a cloud-based solution for either home or work, you need to make sure the
    provider offers two-factor authentication. Most cloud providers now offer the
    option, but, unfortunately, most users don’t end up using it. Go to [https://twofactorauth.org/#cloud](https://twofactorauth.org/#cloud)
    to find out which cloud providers have two-factor authorization. And, as I said
    about email and social media in previous chapters, if your cloud provider doesn’t
    offer 2FA, you need to find one that does. It’s that simple.


    Before you decide to use a cloud service, there are a couple of questions you
    need to ask yourself. What exactly are you storing in the cloud? Is it sensitive
    personal information? Do you really need to keep copies of your passport, driver’s
    license, birth certificate, and bank records in Google Drive or Microsoft’s OneDrive?
    What do you need to store in the cloud if you own a small business? Should you
    really store your clients’ personal and financial information and employees’ personal
    and payroll information there?


    If you want to store everything in the cloud, you’d better make darn sure that
    you’re using two-factor authentication and that you have a good plan in place
    in case a bad guy gains access to your cloud account. Is there a real person you
    can call to resolve the situation quickly? Are there difficult challenge questions
    in place to keep the bad guys out? Those are the important questions you must
    ask yourself before deciding to use a cloud-based service. Your company’s well-being
    and your family’s future might depend on it.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Decide if you really need cloud-based storage. Would
    you be better off keeping the information you’re storing in a safe or safe deposit
    box?


    ![Image](images/lock.jpg) If you decide to use a cloud, only choose a provider
    that offers two-factor authentication and make sure you turn it on. You can identify
    clouds that offer 2FA at [https://twofactorauth.org/#cloud](https://twofactorauth.org/#cloud).'
