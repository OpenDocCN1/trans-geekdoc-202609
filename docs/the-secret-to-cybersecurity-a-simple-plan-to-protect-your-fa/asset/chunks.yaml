- raw: 'Millions of people around the world have turned to dating apps such as Tinder,
    OkCupid, Coffee Meets Bagel, and Match.com to find the perfect match, and more
    and more cybercriminals are preying on these good people. To get to your wallet,
    they’ll first target your heart. The criminals’ fake profiles are typically similar:
    They present themselves as white men in their late forties to sixties, say they
    attended American colleges, and claim to now be living overseas. This portrayal
    casts the crook as the lead character of a romance novel for their targets. The
    fake profiles usually contain a little intrigue, and the potential thieves try
    to show themselves as real, trusted people like military personnel, aid workers,
    or professionals working abroad. These fake Romeos never talk about sex, and they
    always seem to have a lot in common with their victims. It’s easy to find similarities
    because there is plenty of information available about hobbies, background, and
    interests in their dating profiles. That’s all the information the bad guys need
    in order to get to work.


    In 2016, the FBI’s Internet Crime Complaint Center received nearly fifteen thousand
    reports of romance scams, amounting to more than $230 million in losses. The U.S.
    states with the most victims were California, Florida, Texas, New York, and Pennsylvania.
    In some foreign countries, you’ll find cybercriminals lined up in rows with computers,
    each one throwing out fishing lines in an attempt to land wealthy victims. In
    June 2018, the U.S. Attorney’s Office for the Western District of New York announced
    that Adams Amen, a thirty-two-year-old citizen of Ghana living in Detroit, pleaded
    guilty to conspiracy to commit wire fraud. Between March 2015 and June 2017, the
    government alleged, Amen conspired with other Ghanaian nationals to devise an
    Internet romance scheme utilizing the dating website MillionaireMatch.com that
    netted them nearly $1 million from multiple victims. The cybercriminals made up
    fraudulent names and profiles or assumed someone else’s identity. In this particular
    case, one of the victims received photographs of a man known to her as Marvin
    Roecker. The image was actually of a real estate agent from Texas who was not
    named Marvin Roecker, and who wasn’t involved in the case at all.


    Brooke was like a lot of the victims in romance scams, who are predominantly older
    women, divorced or widowed, computer-literate, and well educated. They are also
    emotionally vulnerable, and cybercriminals know exactly how to tug at their heartstrings.
    The crook who targeted Brooke was an expert at his trade. I’m sure he spent hours
    polishing his skills and most likely kept a journal to better understand how to
    manipulate and exploit her. Since he was likely working on several potential victims
    at the same time, that journal was important; it’s how he probably kept his lies
    straight. Brooke and Anthony communicated via the dating app for a few days, and
    then he suggested they chat more privately via text, telephone, and email. When
    I asked Brooke if she’d ever met Anthony in person, she said she’d talked to him
    almost every day. As you probably noticed, she didn’t answer my question. When
    I asked her the question again, she replied that they were moving to Mexico together
    and going to live happily ever after. Brooke was a well-educated woman with a
    prominent position at a large company. But when she answered my questions about
    Anthony, she sounded like a delusional fifteen-year-old schoolgirl who was getting
    jerked around by her boyfriend.


    Brooke told me that Anthony had arranged for her to receive a wire transfer of
    $500,000, which she was then supposed to wire to their homebuilder in Mexico.
    The request seemed absolutely legitimate to Brooke; Anthony was the love of her
    life, and she had no reason to doubt his intentions. On a Monday morning, Brooke
    received a text message from Anthony, confirming that $500,000 had been wired
    to her bank account. He added some urgency by telling her that the builder needed
    the money that same day so he could order the granite countertops for her dream
    kitchen. Brooke left work and went to the bank to handle the transaction in person.
    She met with a manager who was happy to help her with the wire transfer. Brooke
    never kept more than $5,000 in her checking account, had never received such a
    large wire transfer, and had never wired money out of the country. But the branch
    manager never asked Brooke why she was sending such a large amount to a foreign
    country. For the most part, banks do an adequate job of educating customers and
    warning them about fraud. Even if this particular manager had advised Brooke that
    she might be involved in a scam, I think she probably wouldn’t have believed him.


    A few days after Brooke wired $500,000 to an overseas account, the originating
    bank that had allegedly transferred the proceeds from the sale of Anthony’s family
    estate recalled the wire transfer. The money actually belonged to a title company
    in the U.S., which had been the victim of a business email compromise scam. Another
    cybercriminal had spoofed an email to the title company and directed someone there
    to send the proceeds from a real estate transaction to Brooke’s account. Brooke
    was not only the victim of a romance scam, but the bank also considered her a
    suspect in an embezzlement scheme. Her life was turned upside down when she finally
    realized that Anthony wasn’t real and that the man she thought she loved was a
    cybercriminal. The real financial victim in this case turned out to be the title
    company, which never recovered its money. But it was so painful for me to explain
    to a well-educated, adult woman that she had been scammed by a Nigerian cybercriminal.


    When the title company’s bank attempted to recall $500,000 from Brooke’s bank,
    the money was already gone. However, the bank was able to seize $15,000, which
    was money that Brooke had earned and saved. When she attempted to recover her
    money from the other bank, however, she was told that she was also responsible
    for repayment of the remaining $485,000. Brooke was devastated and blamed herself
    for being so foolish. The psychological trauma suffered by victims is twofold:
    First they must cope with the end of what they believe is a serious romantic relationship;
    second, to compound the damage, they blame themselves (as do their family and
    friends).


    In February 2017, the FBI shared another case of a romance scam victim who was
    courageous enough to share her story in hopes that other might avoid becoming
    victimized. Like Brooke, the woman was in her fifties. She lived in Texas and
    was in an emotionally abusive marriage. She met a man online, Charlie, who said
    he was the “friend of a friend.” Charlie noticed that the woman was a strong Christian,
    which she openly publicized on her Facebook account. He told her that he was a
    Christian, too, and that he worked in the construction business in California.
    Over the next several months, they prayed and sang together on the phone and discussed
    church sermons on Sunday afternoons. After several months of correspondence, Charlie
    contacted her and said he needed $30,000 to finish a job. He promised to repay
    her the money in twenty-four to forty-eight hours. She prayed about his request
    and decided to wire him the money. She didn’t hear from Charlie for a couple of
    days—until he requested an additional $30,000. Over the next two years, the woman
    ended up sending Charlie about $2 million. When her financial advisor noticed
    that her accounts were steadily dwindling, he contacted her and advised her to
    contact the FBI.'
