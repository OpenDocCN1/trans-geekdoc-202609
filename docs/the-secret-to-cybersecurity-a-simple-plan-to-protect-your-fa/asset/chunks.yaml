  trans: '


    此外，还有区块链和加密货币这两个日益增长的领域。最近我听到了很多关于区块链的讨论，它是比特币和其他虚拟货币的核心技术。区块链本质上是一个在计算机网络上进行共享的数据库；《哈佛商业评论》将其描述为“一个开放的、分布式的账本，能够以一种高效、可验证且永久的方式记录两个双方之间的交易。该账本本身还可以被编程以自动触发交易。”区块链上的每个参与方都可以访问整个数据库及其完整历史。没有任何一个个人或实体可以控制这些数据或信息，而且一旦交易被输入数据库并记入账目，这些记录就无法被更改，因为它们与之前发生的每一笔交易都紧密相关。用户被赋予一个唯一的
    30 多个字符的字母数字型地址以识别其身份，或者他们也可以保持匿名。我最近参加了一场关于区块链的小组讨论会议，每个人都在谈论它是如何成为信息安全的新技术的。然而，根据我参与过的讨论，我无法理解区块链如何防止我们在本书书中讨论过的任何犯罪行为。我相信区块链有许多实际应用，我也注意到许多公司和组织正在探索区块链作为信息安全解决方案。但是，当他们还没有实施网络安全的基础和基本工作时，区块链将不会改变任何事情。


    我对比特币和其他加密货币日益增长的市场深表担忧。现在甚至有了 ICO，即互联网代币发售。人们在比特币和其他加密货币中投入了大量资金，企业也开始随风起。我听到一位演讲者谈论比特币和加密货币，听他说话时我不禁笑出了声。主持人问我为什么在笑，我说：“听着，我对加密货币的唯一经验就是那些网络犯罪受害者，他们不得不用它来支付赎金，以解锁他们的个人信息。”


    网络犯罪集团已经将加密货币作为目标。臭名昭昭的朝鲜网络犯罪组织“拉撒路”（Lazarus）一直在通过一项名为 `AppleJeus` 的恶意软件活动攻击加密货币交易所、金融科技（fintech）公司和银行，而且他们在试图入侵这些交易所方面并不孤单。加密货币有正当用途吗？我相信可能存在，但我只见过网络犯罪分子使用它。


    总之，我必须说，在联邦调查局（FBI）工作二十九年让我感到非常非常谦卑。我知道多年来 FBI 伴随着许多争议，但能为如此巨大的组织工作我感到非常自豪。我很荣幸能够与你们分享我的经验。希望你们学到的知识将帮助你们避免成为下一个网络犯罪受害者。


