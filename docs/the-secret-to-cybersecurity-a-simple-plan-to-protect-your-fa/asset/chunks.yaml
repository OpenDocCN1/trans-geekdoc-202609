    Many workers in corporate America use `Dropbox` as an easy way to move and share
    large files. Do you think’s a good idea for your doctor to use `Dropbox` to access
    your medical records from his home computer or anywhere else in the world? Some
    might say it’s a great idea, because he could save lives and work more efficiently.
    But what if your doctor has a `Yahoo!` account that was hacked by criminals who
    stole his username and password—the same login credentials he also used for `Dropbox`?
    Unfortunately, we know the end result: Bad guys could gain access to sensitive
    personal files, including your medical records. Am I saying you shouldn’t use
    `Dropbox`? No; I’m saying it’s a great tool and you should use it—but only if
    you’re using two-factor authentication to secure your information.


    `Google Drive` and `Dropbox` aren’t the only clouds being used to store accounting,
    medical, and payroll records. I had one case while I was working for the `FBI`
    that involved crooks gaining access to an accountant’s cloud-based software package.
    His email was hacked and, unfortunately, he used the same password for his cloud-based
    software. The bad guys were able to access his clients’ names, dates of birth,
    Social Security numbers, email addresses, and bank account and routing numbers.
    He had to pay an expensive security firm to come in and clean up the mess. He
    also had to notify his customers that he’d lost their information, which I’m sure
    cost him some business. This victim admitted to me that the incident cost him
    more than $75,000 after all was said and done. A `Big Four` accounting firm can
    handle a financial loss like that, but it took a lot of hard work to keep this
    small business from going under.


    In another case, cybercriminals gained access to a small business’s payroll platform
    by logging in with stolen usernames and passwords. With the stolen information,
    the thieves changed bank account and routing numbers to bank accounts they controlled.
    The bad guys walked away with more than $100,000, and the company was forced out
    of business.


    Unfortunately, cybercriminals like to target small businesses because they don’t
    have the high-priced cybersecurity they need. A `Verizon` study found that 61
    percent of cyberattack victims in 2017 were small businesses, up from 53 percent
    the previous year. Another report by `Hiscox` found that 47 percent of small businesses
    suffered at least one cyberattack in the previous twelve months and 52 percent
    suffered multiple attacks. Like it wasn’t hard enough to keep a small business
    open nowadays!


    The biggest target for cloud attacks is `Microsoft Office 365`. In the old days,
    you purchased a hard copy of `Microsoft Office`, loaded the software to your computer,
    and went to work. Then, in June 2011, `Microsoft` introduced `Office 365`, giving
    consumers the ability to download `Office` software and store information in the
    cloud. It was cheaper and more efficient, but now the bad guys only needed usernames
    and passwords to attack. They didn’t have to break into an office computer or
    network, which formerly stored the sensitive information. In 2017, there was a
    sophisticated cloud-to-cloud brute-force attack against `Office 365` users who
    worked at multiple `Fortune 2,000` companies. The attackers tried logging in with
    different versions of `Office 365` usernames, which suggested they’d already obtained
    some version of them through another breach or phishing attack. In a separate
    2018, `YouGov` found that 41 percent of small businesses used two-factor authentication,
    while 59 percent did not.

    '
