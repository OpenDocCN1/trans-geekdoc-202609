  trans: '

    在处理了此类可怕的案件后，我立下了一项任务：教育父母了解网络上剥削儿童的危险。然而，我的信息并不总是受到欢迎，有时我甚至被说是在危言耸听。但我只是从我作为一个`FBI
    agent`的立场出发，陈述事实。


    有时，我会感到非常沮丧。我会和一位小学校长谈话，让她教育她的老师，但她告诉我老师们没有时间，她无法强迫他们参加我的培训。有时，校长会建议我联系家长/教师协会。但我很快发现，那些组织更关注筹款和支持教师的需求。这让我非常愤怒，学校在教孩子们如何使用电脑和互联网，但却不认为教他们这些危险是重要的。我以前的一位特工提供了一个我听过的最生动的比喻，说明让孩子无限制地接触网络是什么样的。他说：“你还不如给孩子车钥匙、一张加油卡和一箱啤酒，然后把他们的`GPS`
    指向新奥尔良的波本街，要好得多。”


    我确实向家长们做过很多演讲，我会向他们提供真实的案例研究，并详尽地解释儿童捕猎者如何在网络上与孩子们结友，并花费周、几个月甚至几年来诱导他们的受害者。坏人与孩子们建立联系，并经常假装成孩子。他们会与孩子们寻找共同的兴趣和爱好并成为朋友。最终，捕猎者向孩子介绍色情图片，目的是欺骗孩子认为这类照片是正常的。然后，他们会介绍成人与儿童进行性活动的照片，并试图说服孩子发送自己的裸照。当然，最终目标是实际上与孩子进行性接触。我知道这听起来很恐怖，但遗憾的是，想要与未成年少男女进行性行为的成年男性多得不完。


    尽管听起来如此可怕，我觉得向家长分享这一警告是重要的。我们的任务小组在聊天室里发现了这些怪物，在聊天室里，我们的警员会假装成未成年男女。他们在网上与儿童捕猎者待上几个小时，一旦他们向我们发送了儿童色情图片，我们就尝试与他们面对面面。一旦他们交换了儿童非法图像，就成了联邦犯罪。我们想让他们离开街头，这样他们再也不会伤害任何孩子了。捕猎者几乎总是会上钩并安排与我们见面。我记得有一次，我们逮捕的那个坏人随身带着一个旅行包。包里有电击枪、手铐、润滑剂和性器。作为一个两个孩子的父亲，调查这些犯罪绝对是令人恐惧的。


    在对家长的演讲期间，我总是问：“对孩子来说，理解真实朋友和虚拟朋友的区别重要吗？”几乎每个家长都同意这是一个非常重要的区别。然后我问家长们在`Facebook`上有多少朋友。当我问家长们是否有五百个朋友时，房间里几乎每个人的手都举了起来。数量从五百个增加到一千个，再到一千五百个。一位家长跳起来说：“我有两千个朋友！”似乎有很多成年人无法区分真实朋友和`Facebook`朋友；如果一个父母都无法区分这种区别，我们又该如何教我们的孩子呢？


    我们的孩子有近乎无限制的机会，在他们父母可能从未听过的平台上与虚拟朋友互动。当我自己的孩子上幼儿园时，我向他们解释互联网是有趣的，也是学习的棒工具，但互联网上存在危险的地方和人，他们想要伤害孩子。然而，每当我演讲中提到这一点时，观众中总会有一个母亲表示反对。她会说：“我不想通过告诉他们世界上所有的坏事来吓唬我的孩子。”那么我就不得不解释，如果至少不让他们意识到这些威胁，会让她的孩子处于更大的风险之中。


    让孩子理解互联网上的基本威胁是至关重要的第一步。作为父母，在你给孩子提供连接互联网的设备（无论是电脑、平板电脑还是手机）的那一天，你需要和他们进行一次严肃的谈话。你需要意识到，当你的孩子上网时，他或她接触到了过度的暴力、仇恨言论、风险或非法行为以及色情信息。你只需要在`YouTube`上花几分钟找到前三者的任何一种。


    与孩子谈论对错的区别是最重要的一步。如果你的孩子遇到了冒犯性的内容并来找你，那么你作为父母可能已经成功了。有一天，当我我儿子大约九岁时，他说他想和我谈谈。我立刻意识到事不妙。他并没有立刻直言不讳，但最终承认他在互联网上看到了一些不适当的内容。我们讨论了这件事，我向他保证这不是他的错。他足够信任我并告诉我，我感到很欣慰，然后再次向他解释了互联网的危险。


    最近，我为一所高端私立学校的中学生家长做了一场网络安全演讲。有一位母亲对我说的话感到非常震惊，她终于问我：“所以，你的意思是如果我不知道女儿在互联网上和谁聊天，我就是一个坏父母？”


    我回答道：“当然不是。二十四小时监控我们的孩子是不可能的。然而，如果你的女儿在互联网上遇到了某人，而她以前从未见过那个人，然后他们决定在商场见面而你对此一无所知，那么你就是一个坏父母。”


    我可以为孩子们写一整本关于网络安全的书，每个父母都应该关注国家失踪与剥削儿童中心的网站[`www.netsmartz.org`](http://www.netsmartz.org)，该网站为孩子们学习网络安全提供了很好的资源、演示和游戏。我们的孩子必须意识到互联网上有坏人，他们绝不应向陌生的人提供身份信息。他们必须知道真实朋友和虚拟朋友的区别，我们作为父母的必须了解孩子在网上做什么。


    ### 如何避免成为受害者


    父母必须理解互联网上没有规则，你的孩子可能会暴露在色情信息、不当内容和仇恨言论中。在决定给他们上网权限时，请记住这一点。

    '
