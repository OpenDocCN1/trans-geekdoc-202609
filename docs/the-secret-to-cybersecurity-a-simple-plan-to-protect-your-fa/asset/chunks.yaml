    ## HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Identify your most important data and regularly back
    it up, always verifying the integrity of those backups. Backups are critical in
    ransomware attacks. If you are infected, your backups might be the only way to
    recover your critical data.


    ![Image](images/lock.jpg) Secure your backups. Make sure they’re not connected
    to the computers or networks they’re backing up. Secure backups on the cloud or
    physically store them offline.


    ![Image](images/lock.jpg) One backup is never enough, so make sure to use a cloud-based
    system, as well as an external hard drive to be especially safe. Be sure to use
    a cloud service that offers two-factor authentication—and turn that feature on.


    Patch your operating system and set up regular and automatic updates. Ransomware
    writers are constantly writing new variants and strains, and software vendors
    regularly offer patches and updates.


    Make sure your browser is also up to date, whether it’s `Microsoft Edge`, `Google
    Chrome`, `Firefox`, `Safari`, `Opera`, or anything else. They all have vulnerabilities
    that are being patched.


    ![Image](images/lock.jpg) Be certain that you have a antivirus security suite
    and firewall installed on your computer. The antivirus software will help you
    identify threats or suspicious behavior.


    Most importantly, as always, think before you click a link or open an attachment.
    Practice your human firewall skills. Most ransomware is installed when the victim
    clicks a link or opens an attachment.


    ![Image](images/lock.jpg) Employ content scanning and filtering on your email
    servers. Incoming email should be scanned for known threats and block any attachments
    that might pose a threat.


    ![Image](images/lock.jpg) If you fear your computer has been infected, immediately
    disconnect it from your network and disable Wi-Fi and Bluetooth to prevent the
    malware from spreading to other machines.


    ![Image](images/lock.jpg) Don’t pay ransom to the hackers. Studies show that hackers
    still fail to decrypt the victims’ data one out of every four times, despite being
    paid. Remember that paying the bad guys only encourages them and funds their illegal
    operation.


    ## CHAPTER 16: # Better Online Banking


    ALMOST A DECADE AGO, WHEN I was still working for the FBI, I received a telephone
    call from an attorney. And, like almost everyone else who called me back then,
    there was desperation in his voice. He had discovered that $500,000 had been wired
    without his consent to an account at `Alpha Bank` in Moscow. The escrow account
    contained his client’s money, and his bank informed him that it couldn’t recall
    an overseas wire transfer. I told him that recalling an international wire is
    next to impossible, but we’d do everything possible to try and help him.

