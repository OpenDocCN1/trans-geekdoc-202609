    我们当时在莫斯科有 FBI 探员工作，但那时从俄罗斯政府那里获得的帮助寥寥其微。我们发现坏人安装了一个键盘记录器，让他们获取了访问该律师银行账户的权限。如今，大多数银行采用的控制措施要稳健得多，这使得网络犯罪分子发送国际电汇变得更加困难，但对他们来说，进入账户并发送国内电汇和
    ACH 转账（电子支票）仍然很容易。在我们调查结束时，那名律师成功追回了约 45 万美元，在这场灾难中损失了 5 万美元。在这次案例中，他立即发现了这笔电汇，而且幸运的是，这笔转账发生在莫斯科银行关门期间。这是我职业生涯中罕见的幸运运气。他对于失去了一些客户的钱感到非常焦虑，但我告诉他，这是他一生中最幸运的一天。他用一种困惑的表情看着我。“你怎么能这么说？”他问，“我刚刚损失了
    5 万美元。”我向他解释了他差一点就会损失 50 万美元，并告诉他带妻子去一家高级餐厅庆祝一下。在追回被盗资金方面，他是一个例外，这毫无疑问。在我整个职业生涯中，我可能只有四五个案例是受害者真正追回了资金。


    ### 商业账户的脆弱性


    当然，如果该律师在他的商业银行账户上使用双重身份验证，整个折难是可以避免的。大多数人并不知道，商业账户并不享有与消费者账户相同的保护。如果网络犯罪分子进入你的个人账户并偷走了你的钱，你很有可能获得赔偿，因为联邦存款保险公司（`FDIC`）担保了你的存款，你的银行可能会对任何损失负责。然而，如果黑客进入了你的业务账户，你想要回资金可能就没那么容易了。


    在过去的几年里，小企业遭受的一些损失是相当巨大的。根据 `FDIC` 的数据，堪萨斯州阿比林根的一家汽车经销商在业务经理的电脑感染恶意软件后，损失了 6.3
    万美元，这让网络犯罪分子能够启动九名虚假员工的工资发放。缅因州桑德福德的一家建筑公司因为恶意软件损失了 345,444 美元（被盗走了超过 50 万美元），加利福尼亚州亨廷顿海滩的一个托管小组则在坏人卷走约
    150 万美元后被迫关闭。我想知道那些企业主中有多少意识到自己正处于这种风险之中。


    ### 监管与法律差异


    任何维护商业账户的人都需要意识到这个鲜为人知的事：个人账户和业务账户受不同规则的限制的。个人账户受联邦储备委员会第 E 类条例（`12 C.F.R. Part
    205`）约束，该条例确保了因欺诈活动导致的资金损失获得覆盖和赔偿。《统一商法典》涵盖商业账户，在发生欺诈时，某些银行的政策对账户持有人的通常比个人账户慷慨得多。


    在大多数情况下，如果发生争议交易，企业主有责任立即通知银行，根据银行的政策，有时最快只需二十四小时。除非你与银行有长期的合作，否则他们可能不会配合退还你的资金；而且，当然许多小型银行在财务上没有能力还款。大多数客户在成为信用卡和
    ATM 欺诈的受害者时希望能获得完全补偿，但一些人被迫起诉较小的银行以追回更大的损失，因为他们的银行指责他们允许了网络犯罪的发生。


    ### 对小企业的影响


    我曾向数十家遭受此类侵害的企业传了这个坏消息。大企业在遭受损失后似乎总是能够恢复并生存，但我目睹过许多小企业在被网络犯罪分子侵害后被迫关门大。这仍然让我感到心痛，因为这本是可以避免的。当商业支票账户被掏空时，网络责任险无法救你，`FDIC`
    或像 `LifeLock` 这样的身份盗窃保护服务也同样。如果我有钱，我会在超级碗期间购买广告时间来向全国普及这方面的知识。


    ### 保护建议


    如果你有商业银行账户，你需要做的第一件事就是确保启用双重身份验证，这可以防止小偷闯入。人们经常告诉我他们的银行不提供 `2FA`。还记得我告诉过你们关于那些不提供该服务的电子邮件提供商吗？作为一名
    FBI 探员，我不应该提供建议的，但有时我会摘下 FBI 的帽子提供建议。如果我的银行不为商业账户提供 `2FA`，我会去寻找另一家银行。`www.twofactorauth.org`
    网站是寻找哪些银行提供双重身份验证的极佳资源。大多数大型银行的技术更先进，因为它们有钱花在软件、App 开发人员和安全团队上。一些小型银行和信用合作社根本无法负担那种水平的保护，尽管保持客户资金安全应该是重中之重。


    现在，作为一名普通公民，我可以自由提供我认为可能有帮助的任何建议。例如，如果你负担得起，我建议你购买一台单独的电脑用于网上银行。希望那位几乎损失了客户 50
    万美元钱的律师在第二天确实那样做了。大多数网络犯罪的发生是因为有人点击了链接、打开了他们本该忽略的附件，或者访问了安装恶意代码的网站。如果你消除了这些威胁，你就从根本上减少了网络犯罪的风险。这真的是一个非常简单的解决方案。


    ### 高级安全措施


    但如果网络犯罪分子感染了你网络上的另一台电脑呢？他们仍然可以感染与受保护电脑联网的设备。为了避免这种情况，你可以购买一个移动热点设备，例如 Verizon
    的 `Jetpack` 或 AT&T 的 `Nighthawk` 移动热点路由器。仅将你用于银行服务的电脑连接到那个特定的网络，你在旅行时也可以使用它。在最基础的层，这被称为应用程序白名单或网络分段。应用程序白名单只允许允许应用程序在计算机系统中存在并运行，而在这种情况下，该电脑仅用于银行业务。在任何情况下，你都不应该在上面浏览网页或检查电子邮件。这意味着也不要使用
    Facebook、Twitter 或 Instagram。


    当我几乎在每一个网络犯罪预防研讨会上宣扬这一点时，会收到各种不一的反响。组织从不乐于改变，特别是当改变需要花费资金并减慢业务流程时。每个人都希望拥有一台可以上网、查邮件、玩游戏、看视频并进行关键银行业务的多功能设备。但是，如果我要为我的客户处理数百万美元——即使是为小公司处理几千美元——我会认真考虑将这种方法作为保障。


