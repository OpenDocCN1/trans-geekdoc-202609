- raw: 'But around the time AOL, Amazon, and eBay were becoming household names, something
    sinister was brewing beneath the surface of the Internet. In 2005, I lived in
    Washington, D.C., and worked in the Cyber Division at FBI headquarters. I remember
    being home one evening in 2005 and receiving an email from a large bank. The email
    appeared official; it said there was a problem and that my bank account had been
    frozen. In order to regain access to the account, the email instructed me to click
    a link and enter my username, password, birthdate, and Social Security number
    on the webpage that appeared. There was only one problem: I didn’t have an account
    at this specific bank! Obviously confused, I immediately called the bank’s customer
    service department and explained the situation. The person on the phone told me
    he couldn’t help unless I had a valid account. Even after I explained to him that
    I was an FBI special agent who investigated cybercrime, the customer service representative
    told me, “Sorry, I can’t help unless you have a valid account.”


    I wonder how many unsuspecting people received that email and provided their account
    credentials to Eastern European cybercriminals, who undoubtedly drained their
    accounts. Somewhere in the former Russian Federation, a crook was probably sitting
    behind a keyboard. He had a name that sounded like Boris Badenov, the villain
    on the old TV cartoon The Adventures of Rocky and Bullwinkle and Friends. Boris
    was smiling because he’d figured out one of the world’s easiest scams. If Boris
    called you on the phone today and asked you for your username and password with
    his deep Russian accent, you would surely hang up on him. So Boris would probably
    go to Plan B. He’d send you an email asking for the information, but he’s not
    dumb enough to send it from an email address like borisbadenov@cybercriminal.com.
    This isn’t some teenage hacker living in his mother’s basement; he’s a sophisticated
    cybercriminal, someone who might be connected to a foreign government or an organized
    crime outfit. Boris might even have a friend who’s a graphic designer, and he’s
    probably talented enough to design a website that looks exactly like the one your
    bank uses.


    Boris is now engaged in the act of phishing, which is not to be confused with
    the sport of fishing. Put simply, phishing is the fraudulent practice of sending
    emails purporting to be from reputable companies in order to steal personal information
    such as passwords, usernames, and credit card numbers. According to IBM’s X-Force
    researchers, more than half of all emails sent everyday are spam. The Radicati
    Group estimates that 269 billion emails were sent and received every day in 2017
    and that number will climb to 319.6 billion by the end of 2021. When there are
    that many phish in the sea, it’s easy to see why criminals are so successful.


    During my cybercrime presentations, I ask the audience this question: If you received
    an email from your bank under the previous circumstances, is there anyone in the
    audience who would provide their banking credentials? Of course, almost everyone
    in the room pipes up with a great big no! Then I ask them about their iTunes,
    Amazon, Facebook, eBay, Google, and Instagram accounts. If you received an email
    asking for your credentials from one of those providers, would you provide them?
    Today, almost everyone knows not to provide credentials when asked in an email
    from any provider. But I can’t tell you how many times I’ve spoken at a high school
    or college, or even a civic group, and been surprised at the exasperated looks
    on people’s faces when I explain this point. It’s like they’re hearing it for
    the first time! If you provide your credentials to any of these accounts, the
    bad guy will gain access to the account and cause havoc. When I’m doing my presentation,
    I make people repeat this sentence: I will never provide my credentials to any
    provider when requested in an email. This is a concept I’ve explained to my kids,
    and I’m sure I could even explain it to my elderly mother—but she doesn’t need
    an explanation. I never purchased a computer for my mom and, when I finally bought
    her a cell phone ten years ago, I never upgraded her to a phone with an Internet
    connection. Some might say I’m being cruel and have deprived her of one of life’s
    great luxuries, but I’ve seen too many of my friends’ parents become cyber-victims.


    Over the past ten years, there have been a number of public-service campaigns
    warning people about the dangers of phishing. Sadly, cybercriminals don’t quit
    easily; they simply change their techniques to trick unsuspecting individuals
    into giving up their usernames and passwords. As computer users become more educated
    and security software and firewalls become more effective in protecting them from
    intrusions, cybercriminals simply create different malware. Malware does its dirty
    work after it’s implanted or introduced to a computer or network. It can implant
    computer viruses, worms, Trojan horses, ransomware, spyware, adware, scareware,
    and who knows what else. Malware has been around for as long as computers have
    been in use. The first Trojan was released in 1978, the first virus for Apple
    systems in 1983, and the first virus for IBM PC computers in 1986.


    Some malware installs a keystroke logger, which I mentioned in Chapter 1. Once
    the keystrokes are captured, the program sends the information back to an online
    server, which a cybercriminal can access to steal your personal information. The
    Soviet Union first developed and deployed a hardware keylogger back in the mid-1970s,
    when it installed them on IBM Selectric typewriters. The keystroke loggers were
    covertly installed at U.S. embassies and consulate buildings in Moscow and St.
    Petersburg to steal classified information. Because manual typewriters are immune
    to keyloggers and other viruses, the Russian special services are still using
    them today!


    One keylogging case I encountered during my FBI career involved a man named Charlie
    who was an attorney at a midsized firm. He received an email to his personal email
    account from what appeared to be his bank. The subject line said, “Suspicious
    Activity Detected On Your Account.” Charlie opened the email, which read:


    Dear Charlie, we would like to inform you that our bank’s new security system
    has detected a possibly suspicious transaction about to be processed through your
    checking account. Today at 9:05 A.M., a login was detected into your account from
    an IP address in Brooklyn, New York. The user requested an automated withdraw
    from your bank account in the amount of $1,875.54 payable to an online casino
    in the Bahamas.


    Charlie’s blood pressure spiked dramatically after he read the first few sentences
    of the email. He could feel a pit of anxiety in his stomach. The cybercriminal
    had baited the hook in his phishing attempt and now had Charlie dangling on the
    end of the line. It was time to reel him in:


    If this is a legitimate transaction, there is no need to do anything at all. The
    funds will be withdrawn from your account within the next hour. If you did not
    authorize this transaction, please contact the bank within the next hour. Your
    failure to contact the bank will result in monies being withdrawn from your account.
    To prevent this transaction from taking place, all you need to do is click on
    the link in this email or call the toll-free number below.


    This what I describe as the Jedi mind trick.'
  fmt: '

    But around the time AOL, Amazon, and eBay were becoming household names, something
    sinister was brewing beneath the surface of the Internet. In 2005, I lived in
    Washington, D.C., and worked in the `Cyber Division` at `FBI` headquarters. I
    remember being home one evening in 2005 and receiving an email from a large bank.
    The email appeared official; it said there was a problem and that my bank account
    had been frozen. In order to regain access to the account, the email instructed
    me to click a link and enter my `username`, `password`, `birthdate`, and `Social
    Security number` on the webpage that appeared. There was only one problem: I didn’t
    have an account at this specific bank! Obviously confused, I immediately called
    the bank’s customer service department and explained the situation. The person
    on the phone told me he couldn’t help unless I had a valid account. Even after
    I explained to him that I was an `FBI` special agent who investigated cybercrime,
    the customer service representative told me, “Sorry, I can’t help unless you have
    a valid account.”


    I wonder how many unsuspecting people received that email and provided their account
    credentials to Eastern European cybercriminals, who undoubtedly drained their
    accounts. Somewhere in the former Russian Federation, a crook was probably sitting
    behind a keyboard. He had a name that sounded like Boris Badenov, the villain
    on the old TV cartoon `The Adventures of Rocky and Bullwinkle and Friends`. Boris
    was smiling because he’d figured out one of the world’s easiest scams. If Boris
    called you on the phone today and asked you for your `username` and `password`
    with his deep Russian accent, you would surely hang up on him. So Boris would
    probably go to Plan B. He’d send you an email asking for the information, but
    he’s not dumb enough to send it from an email address like `borisbadenov@cybercriminal.com`.
    This isn’t some teenage hacker living in his mother’s basement; he’s a sophisticated
    cybercriminal, someone who might be connected to a foreign government or an organized
    crime outfit. Boris might even have a friend who’s a graphic designer, and he’s
    probably talented enough to design a website that looks exactly like the one your
    bank uses.


    Boris is now engaged in the act of `phishing`, which is not to be confused with
    the sport of fishing. Put simply, `phishing` is the fraudulent practice of sending
    emails purporting to be from reputable companies in order to steal personal information
    such as `passwords`, `usernames`, and credit card numbers. According to `IBM’’s
    X-Force` researchers, more than half of all emails sent everyday are spam. The
    `Radicati Group` estimates that 269 billion emails were sent and received every
    day in 2017 and that number will climb to 319.6 billion by the end of 2021. When
    there are that many phish in the sea, it’s easy to see why criminals are so successful.


    During my cybercrime presentations, I ask the audience this question: If you received
    an email from your bank under the previous circumstances, is there anyone in the
    audience who would provide their banking credentials? Of course, almost everyone
    in the room pipes up with a great big no! Then I ask them about their `iTunes`,
    `Amazon`, `Facebook`, `eBay`, `Google`, and `Instagram` accounts. If you received
    an email asking for your credentials from one of those providers, would you provide
    them? Today, almost everyone knows not to provide credentials when asked in an
    email from any provider. But I can’t tell you how many times I’ve spoken at a
    high school or college, or even a civic group, and been surprised at the exasperated
    looks on people’s faces when I explain this point. It’s like they’re hearing it
    for the first time! If you provide your credentials to any of these accounts,
    the bad guy will gain access to the account and cause havoc. When I’m doing my
    presentation, I make people repeat this sentence: I will never provide my credentials
    to any provider when requested in an email. This is a concept I’ve explained to
    my kids, and I’m sure I could even explain it to my elderly mother—but she doesn’t
    need an explanation. I never purchased a computer for my mom and, when I finally
    bought her a cell phone ten years ago, I never upgraded her to a phone with an
    Internet connection. Some might say I’m being cruel and have deprived her of one
    of life’s great luxuries, but I’ve seen too many of my friends’ parents become
    cyber-victims.


    Over the past ten years, there have been a number of public-service campaigns
    warning people about the dangers of `phishing`. Sadly, cybercriminals don’t quit
    easily; they simply change their techniques to trick unsuspecting individuals
    into giving up their usernames and passwords. As computer users become more educated
    and security software and firewalls become more effective in protecting them from
    intrusions, cybercriminals simply create different `malware`. Malware does its
    dirty work after it’s implanted or introduced to a computer or network. It can
    implant computer viruses, worms, Trojan horses, ransomware, spyware, adware, scareware,
    and who knows what else. Malware has been around for as long as computers have
    been in use. The first Trojan was released in 1978, the first virus for Apple
    systems in 1983, and the first virus for IBM PC computers in 1986.


    Some malware installs a `keyst logger`, which I mentioned in Chapter 1. Once the
    keystrokes are captured, the program sends the information back to an online server,
    which a cybercriminal can access to steal your personal information. The Soviet
    Union first developed and deployed a hardware `keylogger` back in the mid-1970s,
    when it installed them on `IBM Selectric` typewriters. The keystroke loggers were
    covertly installed at U.S. embassies and consulate buildings in Moscow and St.
    Petersburg to steal classified information. Because manual typewriters are immune
    to keyloggers and other viruses, the Russian special services are still using
    them today!


    One keylogging case I encountered during my FBI career involved a man named Charlie
    who was an attorney at a midsized firm. He received an email to his personal email
    account from what appeared to be his bank. The subject line said, “Suspicious
    Activity Detected On Your Account.” Charlie opened the email, which read:


    ```

    Dear Charlie, we would like to inform you that our bank’s new security system
    has detected a possibly suspicious transaction about to be processed through your
    checking account. Today at 9:05 A.M., a login was detected into your account from
    an IP address in Brooklyn, New York. The user requested an automated withdraw
    from your bank account in the amount of $1,875.54 payable to an online casino
    in the Bahamas.

    ```


    Charlie’s blood pressure spiked dramatically after he read the first few sentences
    of the email. He could feel a pit of anxiety in his stomach. The cybercriminal
    had baited the hook in his phishing attempt and now had Charlie dangling on the
    end of the line. It was time to reel him in:


    ```

    If this is a legitimate transaction, there is no need to do anything at all. The
    funds will be withdrawn from your account within the next hour. If you did not
    authorize this transaction, please contact the bank within the next hour. Your
    failure to contact the bank will result in monies being withdrawn from your account.
    To prevent this transaction from taking place, all you need to do is click on
    the link in this email or call the toll-free number below.

    ```


    This what I describe as the Jedi mind trick.

