    accounts. Passwords should be at least twelve characters long (fifteen is even
    better) and include lower- and uppercase letters, numbers, and at least one special
    character.


    ![Image](images/lock.jpg) If you’re a small-business owner, educate your employees
    about their responsibility in securing their usernames and passwords. Set up emergency
    protocols in response to potential breaches.


    ![Image](images/lock.jpg) Make sure you have backups of whatever you store in
    the cloud, whether it’s on external hard drives or other offsite storage.


    ![Image](images/lock.jpg) Use cloud encryption, which is critical for protection.
    It allows data and text to be transformed using encryption algorithms and then
    placed on a storage cloud.


    ![Image](images/chap.jpg)


    ## CHAPTER 11:


    ## Business Email Compromise


    ONE OF THE LARGEST CYBERCRIME threats in the world is called the business email
    compromise scheme (BEC), also known as cyber-enabled financial fraud. This attack
    is carried out by compromising legitimate personal and business email accounts
    through old-fashioned social engineering, computer intrusion techniques, and stealing
    usernames and passwords. BEC criminals trick end users into either wiring them
    money or sending them names, dates of birth, and Social Security numbers. According
    to the FBI’s Internet Crime Complaint Center (IC3), the BEC scam continues to
    grow, evolve, and target end users of all varieties. Since the FBI started formally
    keeping track of BEC and its variant, email account compromise (EAC), there have
    been reported losses of $12 billion through June 2018. Foreign citizens perpetrated
    many of the schemes, which originated in Nigeria but have since spread across
    the globe. Reports indicate that fraudulent transfers have been sent to one hundred
    and fifteen countries, with the majority going to Asian banks located in China
    and Hong Kong. During my career, I found instances in which money was transferred
    to dozens of foreign countries.


    In June 2018, the FBI and Department of Justice announced a major coordinated
    law enforcement effort to disrupt BEC schemes that were designed to intercept
    and hijack wire transfers from businesses and individuals. Operation WireWire,
    which also included agents from the Department of Homeland Security, Department
    of Treasury, and the U.S. Postal Inspection Service, resulted in seventy-four
    arrests, including forty-two people in the U.S., twenty-nine in Nigeria, and three
    in Canada, Mauritius, and Poland. The six-month operation resulted in the seizure
    of nearly $2.4 million and the disruption and recovery of almost $14 million in
    fraudulent wire transfers. Occasionally, even though it is extremely difficult,
    we are actually able to locate, arrest, and punish the bad guys.


    I investigated hundreds of BEC cases while working for the FBI, and I saw everyone
    from homeowners, small businesses, healthcare companies, real estate firms, and
    even large corporations targeted in these scams. The worst part is that every
    one of these crimes could have been avoided. One of the cases I worked involved
    a small nonprofit organization that had a wonderful mission of funding projects
    to help feed children in impoverished countries. Elena worked as the finance manager
    for the nonprofit, and one day her boss, Jeremy, was out of the office soliciting
    donations. Of course, fundraising is the lifeblood of any nonprofit, and it was
    Elena’s job to keep track of the money that was coming in and going out. On this
    day, Elena received an email from Jeremy instructing her to wire $35,000 to a
    bank account in West Africa as part of a humanitarian effort. This request wasn’t
    particularly unusual, so Elena followed Jeremy’s instructions. She called the
    bank and directed someone there to wire the money to the account in West Africa.
    During their conversation, the bank representative warned Elena of something called
    a business email compromise and questioned whether a cybercriminal might be impersonating
    her boss. Elena assured the banker that it was a legitimate transaction and there
    was nothing to worry about.


    The following week at a management meeting, Elena provided an update of the money
    that had been raised and where it had been sent for humanitarian projects. When
    Elena mentioned the $35,000 wire transfer to West Africa, Jeremy interrupted her
    with a puzzled look.


    “Where did you send $35,000?” Jeremy asked. “And why did you send it there?”


    Elena was surprised by Jeremy’s concerned tone and wondered if he had simply forgotten.
    She explained that she’d received his email, which included instructions for wiring
    the money to a bank account in West Africa. When Jeremy claimed he’d never sent
    Elena such an email, she pulled out her laptop and showed him the email. Jeremy
    opened his outbox, which didn’t contain the email in question. Upon further examination
    of the header pulled off the email in question, it became clear what had happened.
    Jeremy’s email address was Jeremy@nonprofit.com (used only for example); the email
    Elena received was from Jeremy@nonprof1t.com. It might take you a second to notice
    the difference, but that’s exactly what cybercriminals want to happen. It’s such
    a subtle disparity that most people would probably never recognize it. In most
    instances, we don’t pay close attention to the addresses on the emails we receive—especially
    if they’re from someone we know. Jeremy was obviously upset and confused, so he
    took his anger out on Elena. Jeremy called the bank and demanded it take action,
    but the only thing the bank could do was attempt to recall the wire transfer.
    Sadly, your chances of recalling an international wire transfer after twenty-four
    hours are slim to none. Then the banker explained to Jeremy that he’d warned Elena
    about BEC scams when she called to request the wire transfer. Things weren’t getting
    better for her.


    While investigating this case, I discovered the nonprofit organization was not
    utilizing two-factor authentication, and the bad guy had gained access to Jeremy’s
    email account—probably through password reuse or a keystroke logger. The thief
    read Jeremy’s emails and figured out how the organization conducted business,
    and he quickly realized that he only needed to send Elena an email with wire transfer
    instructions to steal the nonprofit’s money. The cybercriminal then registered
    a lookalike domain (the company name after the @ symbol in an email address) to
    mimic the nonprofit’s actual domain. When Elena received the email from Jeremy,
    she reasonably assumed it was from him and had the bank wire the money.


    During the course of our investigation, we discovered the crook was using a free
    web hosting service. We served the web hosting company with a federal grand jury
    subpoena, but the only breadcrumb of a clue was the IP address, which is almost
    always registered in West Africa. The bad guys are smart enough not to provide
    their actual names and addresses when they register phony websites. In the old
    days, the easiest way to catch a crook was to follow the money. Today, the bad
    guys send stolen money to overseas banks accounts, and it’s nearly impossible
    to find them and recover the funds. It’s an enormous red flag for most companies
    to receive a request to send money overseas, so the cybercriminals recruit mules
    in the U.S. to do their dirty work. Mules are witting or unwitting accomplices
    who facilitate transfers to overseas banks or, in some cases, receive stolen money
    into their domestic accounts and then wire the money to the thief from there.
    Mules who knowingly participate in the scam receive a small fraction of the stolen
    money for their trouble.'
