    among those who are most often targeted by cybercriminals. There were nearly fifty
    thousand complaints of fraud involving victims over the age of sixty reported
    to the Federal Bureau of Investigation in 2017, with adjusted losses totaling
    more than $342 million. The U.S. Government Accountability Office estimated in
    2018 that financial fraud targeting older Americans probably cost seniors about
