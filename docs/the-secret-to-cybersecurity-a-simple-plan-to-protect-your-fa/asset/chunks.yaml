    Let me explain why it’s so difficult. In the old days, you had to have a physical
    address to have a hardline phone in your home. Today, through `Google`, `Skype`,
    and other online phone providers, you can obtain free voice over Internet protocol
    (VOIP) numbers that enable you to call a phone through your computer. Through
    free VOIP numbers, it’s easy for criminals to send out smishing messages, and
    it’s extremely difficult for law enforcement to trace those numbers. Even when
    law enforcement goes through the long and arduous process of sending a subpoena
    to an Internet provider, the originating Internet protocol (`IP`) address usually
    resides in a foreign country. If we’re fortunate to shut one down, the cybercriminal
    simply moves to another IP. Stopping them is like playing a game of Whack-a-Mole;
    you knock one down and another pops up. The hard truth is we cannot stop the bad
    guys from sending text messages with links. It’s impossible. What we can do is
    teach people how to react and how not to react. Whenever possible, I’ve encouraged
    people in the financial sector to educate their customers on the different types
    of smishing scams. If they were doing their jobs effectively, I probably wouldn’t
    have needed to write this book.


    The episode with my sister and her cell phone made me think about my own cell
    number, which is also my work phone. I tell people it’s the best way to reach
    me. I decided to conduct a test and searched for my cell phone number on `Google`.
    Much to my surprise, I saw it listed on a website. I figured it was there because
    I’d previously provided it to a company as my contact number, and it was either
    sold without my knowledge or stolen through a data breach. I’m not going to lie:
    what I discovered was absolutely frightening. The website that had my cell phone
    number was strange-looking. When I clicked on that link, I was taken to a different
    webpage that included my name, date of birth, home address, work address, wife’s
    and mother’s names and dates of birth, and every phone number and physical address
    I’ve had for the past twenty years. The website claims to be a data aggregator;
    it crawls the Internet specifically searching for personal information of people
    living in the `U.S.` It combines the best social networking information with all
    publicly available information for everyone over the age of eighteen. The site
    boasts of having one of the largest public records repositories on the Internet
    (it had information for nearly two hundred million people and more than eighteen
    million companies in 2018), and I’m sure it’s expanding rapidly every day.


    What was frightening about this particular site is that its point of contact was
    listed as someone in Africa. I didn’t have a good feeling about the entire situation.
    It comes down to a fundamental question: do we have an expectation of privacy
    on the Internet? Or should we assume there’s somebody sitting in Africa collecting
    all our personal information and probably selling it to anyone who will pay? In
    the old days, you simply needed to have an unlisted phone number and that alone
    made it difficult for someone to find you. Today, everything about you is online,
    and those details are being aggregated and sold. Privacy has gone out the window!
    And, if this information gets into the hands of bad guys, the chances of you becoming
    a victim are extremely high.


    # HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Be aware of smishing. You need to become a human firewall
    when it comes to text messaging.


    ![Image](images/lock.jpg) Use strong passwords or fingerprint/biometric features
    to secure your cell phone. Doing so will protect your phone if it’s lost or stolen.


    ![Image](images/lock.jpg) Disable Wi-Fi or Bluetooth when you’re not using it.
    Free public Wi-Fi service in public places like airports, shopping malls, and
    sporting venues typically aren’t secure. Never log on to financial or email accounts
    while using public Wi-Fi.


    ![Image](images/lock.jpg) Don’t click on a link included in a text message until
    you have thoroughly vetted its legitimacy. It is easy for bad guys to send text
    messages to a massive number of recipients through automated means. If you don’t
    recognize the phone number that sent you the message, don’t click the link!


    ![Image](images/lock.jpg) Remember that clicking a link in a text message can
    cause ransomware or a virus to be installed on your smartphone. Computers aren’t
    the only devices affected by viruses, worms, and other cybercrime tools.


    ![Image](images/lock.jpg) Keep your mobile phone and apps updated for the latest
    security software. Your mobile devices are just as vulnerable as your laptops
    and desktop computers. Having the latest security software, operating systems,
    web browsers, and apps are the best defenses against online threats.


    ![Image](images/lock.jpg) Ignore text messages from numbers you don’t know. Your
    cell phone number might be in the hands of someone who shouldn’t have it.


    ![Image](images/lock.jpg) If you receive a suspicious text message from a familiar
    number, call that person at the number in your contacts and ask if the message
    is legitimate.


    ![Image](images/lock.jpg) If you receive a text message from a number such as
    `5000`, it’s a sign that the message is actually just an email sent to your phone.
    Don’t click the link!


    ![Image](images/lock.jpg) Don’t download any mobile apps that don’t come directly
