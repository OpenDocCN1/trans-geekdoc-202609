    bank’s website to prevent it from happening. Once he enters his username and password,
    the keylogging software captures them, and now Boris has the information he needs
    to access Charlie’s account.


    But there might be one more step in this scenario. Once Boris logs into the bank’s
    actual website with Charlie’s username and password, the bank’s computer will
    probably recognize that someone is logging in from an unknown computer and IP
    address. So the bank’s website presents an additional hurdle—a security question.
    There are many forms of security questions, from your mother’s maiden name, first
    pet, high school mascot, to the maid of honor or best man at your wedding. Consider
    security questions on your bank’s website and ask yourself, Could Boris or another
    criminal find the answers to my challenge questions by examining my social media
    accounts or searching my name in Google? Sadly, the answer is a resounding yes
    for most people.


    You might remember when Alaska governor and Republican vice-presidential candidate
    Sarah Palin had her Yahoo! email account compromised during the height of the
    2008 U.S. presidential election. The hacker known as Rubico was actually David
    Kernell, a twenty-year-old college student from the University of Tennessee and
    son of a Tennessee state representative. According to federal authorities, Kernell
    unlawfully accessed Palin’s email account because he was searching for something
    to derail her campaign. Since Knoxville, Tennessee, wasn’t included in my jurisdiction,
    I wasn’t involved in the case. For the record, though, Palin’s account wasn’t
    hacked. Hacking involves using technology to unlawfully access someone else’s
    account. Palin’s account was accessed by someone else because she used weak security
    questions. In fact, Kernell told federal authorities that he answered Palin’s
    security questions in about “fifteen seconds.” Her security questions included
    her birthday, high school, and high school mascot. Kernell found her birthday
    on her Wikipedia page, and it was easy to determine her high school and high school
    mascot because she grew up in the small town of Wasilla, Alaska. It was that easy.
    Kernell was found guilty of one felony count of anticipatory obstruction of justice
    (he tried to destroy computer evidence) and one misdemeanor count of unauthorized
    access of a computer in 2010. He was sentenced to one year plus one day in a minimum-security
    prison.


    Hopefully, Palin learned to use more difficult security questions. In many instances,
    security questions are the last line of defense in online security. They are the
    only things preventing Boris Badenov and other cybercriminals from gaining access
    to your accounts. I’m the parent of two teenagers, and I’ve taught them the importance
    of telling the truth. Integrity, honesty, and kindness are three of the most important
    attributes we can teach our children. But I don’t want my kids telling the truth
    when it comes to online security questions. I don’t want them sharing their birthdates,
    hometowns, best friend’s names, or high school mascots on the Internet. A cybercriminal
    can easily find the answers through social media or online search engines, given
    how much information we share about our families and ourselves nowadays.


    The trick to answering online security questions is coming up with answers that
    are easy to remember, yet difficult for the bad guys to guess. Use answers that
    involve things like your favorite foods, cars, vacation spots, or brand names
    of appliances. For instance, your best friend’s name could be “pizza,” your high
    school could be “barbeque ribs,” and your mother’s maiden name might be “fried
    chicken.” Use your imagination. Just don’t use any answers that might be figured
    out by searching your Facebook page or other information that is easily accessible
    online.


    After you’ve come up with creative and unique answers to security questions, write
    them down and keep them in a secure place. Never store them on your computers,
    tablets, or cell phones. And don’t do what I did! One day, I called my bank to
    handle a transaction and a customer service representative asked for my mother’s
    maiden name. I wasn’t thinking and provided her actual maiden name. The customer
    service representative told me my answer was incorrect and the tone of her voice
    changed dramatically. It’s a red flag when someone can’t remember his mother’s
    maiden name. I then remembered that I’d used the names of appliances in my security
    answers, so I told her my mother’s maiden name was Maytag. Wrong again. I rattled
    off Kenmore, Viking, and GE, before she quickly transferred me to the bank’s security
    department. Fortunately, the security representative had a sense of humor. He
    laughed when I told him I’d used appliance brands for my answers and then he gave
    me some really good advice: If you’re going to fabricate the answers to security
    questions, at least write them down so you can remember them!


    Now, let’s get back to Boris and Charlie’s money. Boris has gained access to Charlie’s
    bank accounts from the comfort of his apartment in Eastern Europe. But, since
    Charlie’s bank isn’t going to simply turn over his money to Boris via a wire transfer,
    Boris has to devise a clever way to physically get his hands on the cash. So Boris
    put an advertisement on `Craigslist` or `Monster.com`, in which he wrote that
    he was looking for someone who wanted to earn extra income by working as an accounts
    receivable clerk. The job description stated that an individual would enjoy the
    comforts of working at home while collecting and reconciling outstanding balances
    received from several vendors. In return, the accounts receivable clerk would
    be paid five to ten percent of the money he or she collects. The remaining balance
    would be sent to Boris through electronic check or Western Union. Sounds like
    a dream job for a stay-at-home mom or retiree! Once his new employee was hired,
    Boris logged in to Charlie’s bank account and sent an electronic check to his
    clerk’s newly established account. The employee wired Boris’s share via another
    `ACH` or `Western Union`, and Boris collected the stolen cash minutes later. By
    the time Charlie figured out his money was missing, it was too late to contact
    the bank or call the police.

