    无论你有多么喜欢钓鱼，你完全确定，那个不开心的人总是挂在你鱼线末端的那条鱼。网络钓鱼（phishing）也是如此。当你成为别人钩在钓钩上的鱼时，你会后悔自己没有落入那些浮在电子邮箱收件箱中闪闪发光的诱饵。


    ![Image](img/chap.jpg)


    # 第 4 章：点击前的思考


    感恩节后的购物热是一个我永远无法理解的美国现象。每年，数以百万计的购物者在百货商店和购物场外排队，等上几个小时，只为了在平板电视、游戏机以及任何其他打折商品上省几块钱。购物者过去会等到感恩节后一天的“黑色星期五”，但现在他们甚至在在周四晚上就开始冲商店了。另一个新现象是“网络星期一”（Cyber
    Monday），即感恩节周末后的周一，在线零售商会在此时举行大型节日购物促销。美国人每年在短短一天内通过电子商务花费数十亿美元购买礼物。


    你知道下一个节日是什么时候吗？它被称为“坏蛋周二”（Bad Guy Tuesday）。如果你没听过坏蛋周二，那是因为是我编造的。但我坚信，全球的网络罪分子会在感恩节周末休息假、放松，以便为网络星期一后的那一天做好准备。那天早晨，他们会向全球范围内发送钓鱼邮件，这些邮件旨在骗你点击一个看似指向
    `Amazon`、`Best Buy`、`Target`、`Walmart`、`FedEx` 或 `UPS` 的链接。我认为坏蛋可能在 12 月 23 日左右再次这样做，发送邮件通知我们包裹派递延迟了。我们有多少人会立即恐慌并点击链接？如果你像我一样，那么好消息是，到
    12 月 23 日你可能还没有开始你的节日购物！


    关于钓鱼，要记住最重要的点之一是：坏蛋总是在想出新方法通过电子邮件欺骗我们。这通常涉及打开邮件、点击链接、打开附件，或让你输入用户名和密码。网络罪分子通过数据泄露窃取了数十亿个电子邮件地址。2017
    年 5 月，针对 `Google` 邮件用户发生了一场大规模钓鱼攻击。一种高度复杂的恶意软件从用户可能认识的人那里发送了一封邮件邀请，要求他们点击链接。一旦用户点击，接收者就会被带到一个合法的
    `Google` 登录界面，在那里被要求继续进入 `Google Docs`。然而，通过点击“是”，用户实际上是为一个恶意的第三方应用程序授予了权限，该程序被用来窃取密码、电子邮件以及他们与
    `Google` 账户关联的所有内容。这种特定病毒最可怕的地方在于，它运行在 `Google` 的系统内部。当用户点击链接时，网络服务器上的恶意软件会向受害者通讯录中的人发送垃圾信息，不断重复这种场景。`Google`
    表示，约有一百万个（仅占 1%）邮件账户被该 `Google Docs` 恶意软件感染，但这仍然涉及了大量受害的人。`Google` 攻击是另一个提醒：互联网用户在点击链接之前需要思考，即使它看起来是来自他们认识的人。


    不幸的是，这类攻击并不新奇。坏蛋们已经针对 `Google` 目标多年多年。2010 年，我从妻子的一位朋友的 `Gmail` 账户收到一封邮件。那个女人的叫
    Brenda，我在社区里见过她，但从未通过邮件与她交流过。邮件中包含一条请求我提供建议的信息，以及一个指向 `Google Docs` 的链接。当然，我生活在一个每天都在互联网上调查坏事的世界，一封要求我做某事的意外邮件自动就是一个红旗信号。我用一个问题回复了该信息：“你是想把这个发给我吗？如果不是，你的账户已经被坏蛋接管了。”


    几分钟后，我收到了 Brenda 的回复，写道：“哦，Scott，你太疑神了。我真的很想要你的建议。”


    虽然这个评论可能会让大多数人满意，但对于一个来自纽约的 FBI 探员来说，这并不是一个足够的回答。在我的工作中，在经过彻底验证之前，我不信任邮件中包含任何内容。我再次回复道：“你想让我把这封邮件转发给我的妻子
    Ann 吗？她比我擅长这些事情。”


    几分钟后，Brenda 回复道：“好的，请把这个发给 Ann。”没问题——除了我妻子的名字不叫 Ann！我拿起电话打给 Brenda，向她解释了她的 `Gmail`
    账户发生了什么。起初，她并没有意识到情况的严重性。但随后我和她坐在一起，解释了这封邮件是如何发送给她通讯录中超过三千人的。她在一家成功的多级营销组织中工作，无法知道她有多少联系人试图查看那个
    `Google Docs` 里的文档。


    回到 FBI 办公室后，我分析了那封邮件，我们发现点击链接时似乎什么都没有发生，这在互联网上是司有常的。然而，点击了链接的人在不不知情的情况下被带到了俄罗斯的一个
    Web 服务器，该服务器试图用恶意软件感染他们的计算机。我们在实验室的虚拟机上打开了这封邮件以进一步检查。虚拟机是计算机内部的计算机，运行在一个安全的沙箱环境中，恶意软件无法在其中造成任何伤害。当我们点击链接时，网络服务器上的恶意软件试图用病毒感染我们的虚拟机，这些病毒旨在窃取任何关键任务账户的用户名和密码。然后，我们使用十二种公开的杀毒产品对该恶意软件进行了测试，其中八种并没有将其识别为威胁。我知道你们不想听这个，但杀毒软件在最佳状态下的效率也只有
    30%–40%。这是因为恶意软件编写者每天开发超过十万种新型恶意软件。这基本上是一场与坏蛋的竞赛，而杀毒软件只能防御已知的恶意软件。你无法对抗你尚不知道存在的东西，而新型毒株逃避检测的概率是非常危险的。这种类型的恶意软件被称为“零日漏洞”（zero-day
    exploit），因为一旦它发布到野外，在杀毒公司编写补丁或特征码之前，没有可行的治疗方法。


    我仍然好奇 Brenda 有多少朋友点击了链接，并导致通讯录、用户名和密码被盗取。她经营着一家成功的家庭业务。她有一群信任她的客户，许多人可能打开了她在邮件中发送的任何链接。当
    Brenda 尝试登录账户查看坏蛋造成了其他破坏时，她发现自己已经没有访问权限了，因为他们更改了她的密码。在她联系 `Google` 并尝试恢复访问权限期间，她的业务陷入了停滞。

    '
