    关于涉及重复使用密码的数百个类似恐怖故事，我可以告诉你们，但有一件特定的事件，自从从 FBI 退休以来，我一直无法忘记。该案件涉及一家大型组织的首席财务官（CFO），他在
    Facebook 上非常活跃。不幸的是，他在使用社交媒体时并不小心，甚至在自己的 Facebook 页面上列出了他的工作邮箱地址。由于某种原因，一个坏人获取了他的
    Facebook 账户。一旦网络犯罪分子访问了 CFO 的 Facebook 页面，他也就访问了该男人的工作邮箱。他浏览了这位高管的邮件，在几小时内就很好地了解了他的雇主是如何运作的。犯罪分子伪造了一封从首席财务官发给公司控制员的邮件，指示她支付金额数千元的发票。控制员认为这封邮件确实来自
    CFO，便听从了他的指令支付了发票。在西非的某个地方，一名网络犯罪分子通过极少的工作就获得了一笔巨额报酬。如果 CFO 为他的 Facebook 账户和工作邮箱使用不同的用户名和密码，这本是可以避免的。


    2018 年 8 月，FBI 揭露了另一个日益增长的在线威胁：犯罪分子通过钓鱼邮件、伪造的 PDF、电话通话或其他非法手段获取员工的工作登录凭据。这些坏分子随后会访问薪资门户，更改银行账户号码，并将直接存款转入他们控制的其他银行账户或预付银行卡中。在许多情况下，欺诈性的工资存款是从多个受害者的账户中转出的。该局在
    2017 年发现了约 17 宗此类案件，2018 年发现了 47 宗，总损失约为 100 万美元。FBI 表示，犯罪分子正针对大学、当地学区、医疗保健和商业航空公司。


    核心要点是：在多个在线平台使用相同的用户名和密码是灾难的根源。这只会让网络犯罪分子更容易获取你的电子邮件和银行账户，不仅可能导致你财务破产，还会让你的雇主、家人和朋友陷入损失。


    # 如何避免成为受害者


    ![Image](img/lock.jpg) 不要对任务关键账户使用相同的用户名和密码。这包括电子邮件、社交媒体、手机、银行业务和电子商务。


    ![Image](img/lock.jpg) 不要使用 Yahoo! 邮箱。该公司曾发生过两次大规模数据泄露，导致超过 30 亿账户遭到破解。两名俄罗斯间谍因规模较小的一次攻击被起诉；但更大一次攻击的设计者尚不清楚。很抱歉，我不信任
    Yahoo! 能保护你的在线个人身份。


    ![Image](img/lock.jpg) 确保你用于工资发放的登录凭据与其他在线平台使用的凭据不同。如果坏人获取了你的薪资信息，他就会拿走你辛苦挣的钱。


    ![Image](img/lock.jpg) 如果你需要写下密码来记住它们，请用一种你容易记忆但其他人无法破译的方式对其进行加密。我们将在下一章节中详细讨论这一点。


    ![Image](img/lock.jpg) 为每个网站使用不同的密码。如果你只有一个密码，犯罪分子就太容易破解并获取所有内容了。


    ![Image](img/lock.jpg) 不要循环使用密码，例如 `bigbomber1`、`bigbomber2`、`bigbomber3`。确保你的密码是唯一的。


    ![Image](img/lock.jpg) 永远不要向他人透露用户名和密码，即使是家人或亲密朋友。如果你认为别人知道你的登录凭据，请立即更改。虽然朋友或家人可能并不想伤害你，但偷窃他们东西的人可能会获取你的凭据。


    ![Image](img/chap.jpg)


    # 第 7 章：强密码


    无论我们喜不喜欢，密码已经成为我们日常生活的一部分部分。我们需要它们来解锁手机和电脑，从 ATM 机上提取现金，以及在 Netflix 上流媒体电影。普通美国人在一生中的某个阶段，通常会有
    10 到 20 个不同的任务关键账户，无论是电子邮件、银行网站、社交媒体还是信用卡。你为其中每一个账户都需要一个唯一的密码。当我在演讲中提到这一点时，观众中的大多数人都会用眼神看着我，仿佛在说：“那太难了”。如果你觉得这很难，等我告诉你们什么是好密码就知道了。


    在我们讨论如何设置一个强力、安全的密码之前，让我们先讨论一下什么是坏密码。我的儿子 Aidan 出于 2002 年，他的兄弟 Quinn 在 2005 年出生。你认为我曾用过“Aidan2002”和“Quinn2005”这些密码吗？我用过。它们很容易记住，而且至少我用的是两个密码而不是一个。然后我想出了第三个可能没人能猜到的密码；它包含了我的首字母、我妻的字母字母以及我们的结婚纪念日。作为其中的一员，……（注：此处原文略显断连，按原文逻辑翻译）。


    '
