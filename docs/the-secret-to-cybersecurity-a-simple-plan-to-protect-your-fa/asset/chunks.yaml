- raw: 'After working these types of horrific cases, I made a mission of educating
    parents about the dangers of child exploitation on the Internet. My message wasn’t
    always well received, however, and sometimes I was even told I was being an alarmist.
    But I was simply presenting the truth from where I sat as an FBI agent. At times,
    I became extremely frustrated. I’d talk to an elementary school principal about
    educating her teachers, and she’d tell me her teachers didn’t have time and she
    couldn’t force them to sit through my training. Sometimes, the principal would
    suggest that I contact a parent/teachers’ association. I quickly learned, though,
    that those kinds of groups are more concerned about fundraising and supporting
    teachers’ needs. It infuriated me that schools were teaching children how to use
    computers and the Internet, but they didn’t think it was important to teach them
    about the dangers. One of my former agents made the best analogy I’ve heard about
    what it’s like to let your kids have unrestricted access to the Internet. He said,
    “You’re better off giving your kids the keys to your car, a gas card, and a case
    of beer, and pointing their GPS toward Bourbon Street in New Orleans.”


    I did make many presentations to parents, and I would provide them with actual
    case studies and go into painstaking detail explaining how child predators befriend
    children on the Internet and spend weeks, if not months and years, grooming their
    victims. The bad guys build rapport with kids and often pretend to be children
    themselves. They’ll find common interests and hobbies with children and befriend
    them. Eventually, the predators introduce pornographic images to the kids, which
    is done to trick the children into thinking these kinds of photos are normal.
    Then they introduce photos of adults engaged in sexual activity with children
    and try to persuade the children to send nude photos of themselves. The ultimate
    goal, of course, is to actually meet the child for sexual contact. I know it’s
    terrifying to think about, but there’s sadly no shortage of adult men who want
    to engage in sexual activity with underage boys and girls.


    As horrifying as it sounds, I felt it was important to share this warning with
    parents. Our task force found these monsters in chat rooms, where our officers
    would pretend to be underage boys and girls. They’d spend hours online with child
    predators, and, once they sent us pornographic images of children, we tried to
    set up face-to-face meetings with them. As soon as they exchanged illicit images
    of kids, it was a federal crime. We wanted to get them off the streets so they
    wouldn’t hurt any more children. The predators almost always took the bait and
    arranged to meet us. I recall one occasion when the bad guy we arrested had a
    duffel bag with him. Inside the duffel bag were a stun gun, handcuffs, lubrication,
    and sexual devices. Being a father of two children, it was absolutely terrifying
    to investigate these crimes.


    During my presentations with parents, I always asked, “Is it important for your
    children to understand the difference between real friends and virtual friends?”
    Almost every parent agreed that it was a very important distinction to make. Then
    I asked the parents how many friends they had on Facebook. When I asked the parents
    if they had five hundred, nearly every hand in the room went up. It would go from
    five hundred to a thousand to one thousand five hundred friends. One parent jumped
    up and said, “I have two thousand friends!” It appears there are a lot of adults
    who can’t tell the difference between real friends and Facebook friends; if a
    parent can’t tell the difference, how are we supposed to teach our children?


    Our kids have near-limitless opportunities to interact with virtual friends on
    platforms their parents have probably never heard of. When my own children were
    in kindergarten, I explained that the Internet is fun and a great tool for learning,
    but that there are dangerous places and people on the Internet who would like
    to hurt them. Whenever I said that in a presentation, though, there was always
    a mother in the audience who would object. She’d say, “I don’t want to scare my
    children by telling them about all the bad things in the world.” Then I would
    have to explain that refusing to at least make them aware of the threats put her
    kids at much greater risk.


    Having your children understand basic threats on the Internet is a critical first
    step. As a parent, the day you provide your child with an Internet-connected device,
    whether it’s a computer, tablet, or smartphone, you need to have a serious talk
    with them. You need to realize that, when your child gets online, he or she has
    access to excessive violence, hate speech, risky or illegal behaviors, and pornography.
    You can find any of the first three on YouTube in only a few minutes, and pornography
    is so readily available on the web now that your kids are going find it no matter
    how old they are. You can invest money in blocking software like Internet filters
    and pornography restrictors, but children are smart enough to find ways around
    it—or they’ll just go to a friend’s house.


    Talking to your kids about the difference between right and wrong is the most
    important step. If your child comes across something offensive and they come to
    you, then you have probably succeeded as a parent. Make sure you listen attentively
    and try not to judge them too quickly. Tell them it’s not their fault and ask
    questions. One day, when my son was about nine years old, he said he wanted to
    talk to me. Instantly, I recognized that something was wrong. He wasn’t immediately
    forthcoming, but he eventually admitted that he’d seen something on the Internet
    that was inappropriate. We talked about it, and I assured him that it wasn’t his
    fault. I was relieved he trusted me enough to talk about it, and then I explained
    the dangers of the Internet to him once again.


    I recently gave a cybersecurity presentation to a group of parents of middle school
    students at an exclusive private school. There was one mother who was shocked
    by what I was telling her, and she finally asked me, “So, you’re saying that I’m
    a bad parent if I don’t know who my daughter is talking to on the Internet?”


    I replied, “Of course not. It’s impossible to monitor our children twenty-four
    hours a day. However, if your daughter meets someone on the Internet, and she’s
    never met that person before, and then they decide to meet at the mall and you
    don’t know anything about it, then you’re a bad parent.” I explained the best
    course of action was to sit down with your kids and have a serious discussion
    about the dangers of the Internet.


    I could write an entire book on Internet safety for our children, and every parent
    should make it a point to access the National Center for Missing and Exploited
    Children’s website, [www.netsmartz.org](http://www.netsmartz.org), which offers
    great resources, presentations, and games for kids to learn about online safety.
    Our kids must realize that there are bad guys on the Internet and they should
    never provide identifying information to people they don’t know. They must know
    the difference between real friends and virtual friends, and we as parents must
    be aware of what our kids are doing online. Most importantly, you must provide
    a home environment in which your kids can come to you with questions and concerns.
    Listen to them without judgment. It’s the only way we’re going to keep our children
    safe.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Parents must understand that there are no rules on the
    Internet, and that your children can be exposed to pornography, inappropriate
    material, and hate speech. Keep this in mind when making the decision about giving
    them access.'
