    about the importance of clarity. Here is what became clear to me at the FBI: I
    needed to do everything I could to become one of the world’s leading experts on
    cybercrime and risk management. I took a number of classes on information security
    from the world’s leading information security company, and I eventually earned
    seven information security certifications. It wasn’t easy. I read every article
    I could find about cybercrime, and I talked to as many people in the industry
    as I could. If you want to become an expert in a certain field, you must invest
    as much time as possible mastering the subject.


    Eventually, I started incorporating what I’d learned into presentations, and I
    shared what I knew with anyone who would listen. Throughout my FBI career, I delivered
    thousands of presentations to private-sector companies about how to avoid becoming
    a victim of cybercrime. As I neared retirement eligibility, I started asking myself,
    What do I enjoy doing the most that doesn’t feel like work? The answer was public
    speaking, educating the public, and meeting new people. These were areas that
    came naturally to me. It was effortless and fun. That’s when I got serious about
    leaving the Bureau and entering the private sector.


    I decided I wanted to change the world by educating small businesses, nonprofits,
    schools, and public citizens—especially young people and Baby Boomers—about how
    to avoid becoming victims of computer crimes. With so much money being spent on
    cybercrime education and prevention, there are very few resources available for
    the most vulnerable segments of society. I committed myself to taking what I learned
    during my twenty-nine years in the FBI and sharing it with the public.


    In the early days of my FBI career, I measured success by putting bad guys in
    jail. Today, my success stories happen when somebody calls me after one of my
    presentations and informs me that they’ve implemented two-factor authentication
    on their platforms. If someone had told me when I became an FBI agent that I’d
    get more job satisfaction from speaking about cybersecurity than arresting bad
    guys, I would’ve said, “You’re crazy, that’s not what I want to do.”


    Now, it’s the most important thing I do.


    In the pages that follow, I’m going to share a number of steps that, if followed,
    will reduce your chances of becoming a victim. These action items are not difficult
    for non-technical folks to understand, and you don’t have to spend much money
    to implement them. Of course, there are only two ways to guarantee you won’t have
    to deal with computer crime: move to the Arctic or throw away your computer. You’re
    probably not willing to do either one of those things, and neither am I. However,
    if you follow these steps, you will become a much safer, more protected member
    of the digital world.


    Over the next several chapters, I’m going to share with you several stories that
    will support each of these steps. And I’m going to be honest with you—I tend to
    scare people when I talk or write about cybercrime. In the world of information
    security, there is a term thrown around called `FUD`, which stands for fear, uncertainty,
    and doubt. This term is thrown around by big organizations when someone who tries
    to explain the scope of the cybercrime problem isn’t taken seriously. I’ve heard
    people say my lectures are full of `FUD`. Well, I’m here to introduce a new term
    called `FFRE`, which stands for fear from real experience. Every one of the stories
    included in this book comes from real-life experience. The victims are real, and
    the incidents happened. I don’t mind taking you out of your comfort zone if it
    will prevent you from becoming a victim.


    ![Image](images/chap.jpg)


    ## CHAPTER 1: Cybercrime


    CYBERCRIME HAS BECOME A FACT of life in the digital world. The threat is incredibly
    serious—and growing. Cyber-intrusions are becoming more prevalent, more expensive,
    and far more sophisticated. Our nation’s adversaries target our country’s critical
    infrastructure, including utilities, defense systems, and air- and traffic-control
    mechanisms. U.S. companies are targeted for trade secrets and other sensitive
    corporate data and universities, for their cutting-edge research and development.
    Identity thieves are attacking our average citizens, and online predators are
    stalking our children.


    Every day, there is another media report of a large-scale data breach. The American
    public is becoming numb after hearing the same depressing news over and over.
    According to analysis conducted by `Cybersecurity Ventures`, the cost of cybercrime
    might reach $6 trillion by 2021, doubling in the six years since 2015. A recent
    study by `Michael McGuire`, senior lecturer at the `University of Surrey`, found
    that cybercrime revenue around the world has grown to $1.5 trillion in illicit
    profits per year, which is roughly equal to the GDP of Russia! In the U.S., the
    FBI’s `Internet Complaint Center` received more than three hundred thousand complaints
    in 2017 with reported losses of over $1.4 billion.


    We have become vulnerable to cybercriminals in nearly every aspect of our lives.
    If you’ve ever shopped for home-repair products at `The Home Depot` (where fifty-six
    million credit card numbers were compromised from April 2014 to September 2014),
    purchased clothing or home goods at `Target` (where hackers infected payment-card
    readers and made off with approximately forty-one million credit- and debit-card
    numbers used by after-Thanksgiving shoppers in 2013), or attempted to broaden
    your professional network by registering at `LinkedIn` (which had more than six
    million encrypted passwords stolen by a Russian hacker known as Peace, who posted
    them to a Russian crime forum in May 2016), you might have unknowingly been a
    victim of cybercrime.


    While these massive data breaches involved some of the world’s largest companies
    and made headlines around the world, there was very little media coverage of what
    I dealt with on a daily basis while fighting cybercrime at the FBI. Every day,
    I worked with victims at small- and medium-sized businesses, nonprofit organizations,
    academic institutions, and, even worse, with retirees who lost their life savings.
    I witnessed too many horror stories during my career—including several businesses
    that were forced to close their doors after being victims of cybercrimes. Here
    are a few of the crimes I investigated during my FBI career:

