- raw: 'We had FBI agents working in Moscow, but we were getting very little help
    from the Russian government at the time. We discovered that the bad guys had installed
    a keystroke logger that had given them access to the attorney’s bank account.
    Today, the controls employed at most banks are much more robust, which makes it
    more arduous for cybercriminals to send international wire transfers, but it’s
    still easy for them to gain access to bank accounts and send domestic wire transfers
    and ACH transfers (electronic checks). By the end of our investigation, the attorney
    managed to recover approximately $450,000, losing $50,000 through the debacle.
    In this case, he discovered the wire transfer immediately, and the transfer fortunately
    occurred when banks were closed in Moscow. It was a lucky break that I rarely
    saw in my career. He was agitated about losing some of his client’s money, but
    I told him it was one of the luckiest days of his life. He looked at me with a
    puzzled expression. “How can you say that?” he asked. “I just lost $50,000.” I
    explained how close he’d come to losing $500,000 and told him to take his wife
    to an expensive restaurant to celebrate. He was the exception when it comes to
    recovering stolen money, there’s no question about it. In my whole career, I probably
    only had four or five cases in which the victims actually recovered their money.


    Of course, the entire ordeal might have been prevented if the attorney had used
    two-factor authentication on his commercial bank accounts. Most people don’t know
    it, but commercial accounts are not afforded the same protection as consumer accounts.
    If cybercriminals gain access to your personal account and steal your money, there’s
    a good chance you’re going to be reimbursed because the Federal Deposit Insurance
    Corporation (FDIC) guarantees your deposits and your bank will probably be liable
    for any losses. However, if a hacker gains access to your business account, you’re
    probably going to be out of luck in getting your money back. Some of the losses
    suffered by small businesses during the past few years have been sizable. According
    to the FDIC, a car dealer in Abilene, Kansas, lost $63,000 after its business
    manager’s computer was infected with malware, which allowed cybercriminals to
    initiate payroll for nine fictitious employees. A construction company in Sanford,
    Maine, lost $345,444 (more than $500,000 was taken) because of malware, and an
    escrow group in Huntington Beach, California, was forced to close after bad guys
    walked away with roughly $1.5 million. I wonder how many of those business owners
    were aware they were at such risk.


    Anyone who maintains a commercial account needs to be aware of this little-known
    fact: Personal and business accounts are governed by different rules and restrictions.
    Personal accounts are governed under Federal Reserve Regulation E (12 C.F.R. Part
    205), which ensures coverage and reimbursement for lost funds due to fraudulent
    activity. The Uniform Commercial Code covers commercial accounts, and certain
    banks’ policies are typically much less generous to account holders in the event
    of fraud. In most instances, the burden is on the business owner to notify the
    bank immediately if there is a disputed transaction, sometimes in as little as
    twenty-four hours, depending on a bank’s policies. Unless you have a long-standing
    relationship with your bank, it might not be cooperative about returning your
    money; and, of course, many of the smaller banks aren’t financially capable of
    giving it back. Most customers expect to be made whole when they are victims of
    credit card and ATM fraud, but some have been forced to sue smaller banks to recover
    bigger losses because their banks blamed them for allowing the cybercrime to happen.


    I was the bearer of this bad news to dozens of businesses that were victimized
    this way. Large businesses always seem to recover and manage to survive after
    suffering a loss, but I witnessed numerous instances in which smaller businesses
    were forced to close their doors after being victimized by cybercriminals. It
    still breaks my heart because it doesn’t have to happen. Cyber-liability insurance
    won’t save you when your commercial checking account is cleaned out, nor will
    the FDIC or identity theft protection services such as LifeLock. If I had the
    money, I’d purchase advertising time during the Super Bowl to educate the country
    about this.


    If you have commercial bank accounts, the first thing you need to do is make sure
    to enable two-factor authentication, which will prevent the thieves from breaking
    in. People tell me all the time that their bank doesn’t offer 2FA. Remember what
    I told you about email providers that didn’t offer it? As an FBI agent, I wasn’t
    supposed to provide advice, but there were times when I took off my FBI hat and
    offered suggestions. If my bank didn’t offer 2FA for commercial accounts, I’d
    go shopping for another bank. The website [www.twofactorauth.org](http://www.twofactorauth.org)
    is a great resource to find out which banks offer two-factor authentication. Most
    of the larger banks are more technologically advanced because they have the money
    to spend on software, app developers, and security teams. Some of the smaller
    banks and credit unions simply can’t afford those levels of protection, even though
    keeping their clients’ money secure should be paramount.


    Now, as a private citizen, I’m free to offer whatever suggestions I think may
    help. For instance, if you can afford it, I suggest you purchase a separate computer
    for online banking. Hopefully, the attorney who nearly lost $500,000 of his client’s
    money did exactly that the next day. Most cybercrime occurs because someone clicks
    a link, opens an attachment they should have ignored, or goes to a website that
    installs malicious code. If you take away those threats, you’re seriously reducing
    your risk when it comes to cybercrime. It’s such a simple solution, really.


    But what if the cybercrooks infect another computer on your network? They can
    still infect a properly protected computer that’s networked to a compromised one.
    To avoid that, you could purchase a mobile hotspot device, such as Verizon’s Jetpack
    or AT&T’s Nighthawk mobile hotspot router. Only connect the computer you’re using
    for banking to that particular network, and you can also use it when you’re traveling.
    At its most basic level, this is called application whitelisting or network segmentation.
    Application whitelisting only permits allowed applications to be present and active
    on a computer system, and, in this case, the computer would only be used for banking
    purposes. Under no circumstances should you surf the Internet or check email from
    it. That means no Facebook, Twitter, or Instagram either. Making occasional exceptions,
    as tempting as they might be, would undermine the entire purpose of this approach.


    I receive mixed reactions when I preach this point at nearly every one of my cybercrime
    prevention seminars. Organizations are never keen on change, especially when changes
    cost them money and slow down the business process. Everybody wants access to
    a multipurpose device that can surf the web, check email, play games, watch videos,
    and engage in mission-critical banking. But, if I were handling millions of dollars
    for my clients—or even thousands of dollars for smaller companies—I would seriously
    consider this approach as a safeguard.'
