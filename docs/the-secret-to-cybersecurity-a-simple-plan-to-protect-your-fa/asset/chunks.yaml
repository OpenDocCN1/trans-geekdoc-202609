    你可以猜到那个坏消息了。冒充者比（Bill）对提供免费咖啡并不感兴趣。相反，他可能在某处被攻破的计算机上设置了一个 Web 服务器。如果比的朋友和客户点击了链接，他们将被带到坏人的
    Web 服务器，该服务器将使用一种入侵检测系统（IDS）难以识别的新型恶意软件。正如我之前告诉过的那样，恶意软件编写者每天都会创建超过十万种新病毒，而入侵检测系统无法跟上这些新病毒，直到有人的计算机被感染并进行报告。假设在比的情况里，他的大多数朋友都有工作，而且他们像大多数美国上班者一样，在公司拥有的计算机上检查
    Facebook 账户。当他们点击星巴克优惠券链接时，会立即导致他们的公司网络感染病毒，这可能会给他们的雇主造成严重损害。这种渗透可能包括安装键盘记录器，它可以窃取电子邮件和银行账户的用户名和密码。或者可能是勒索软件，这将迫使他们的雇主支付数万美元来解锁计算机。


    在与比一起过过这些“末日场景”后，我问他：“如果你导致多家公司爆发勒索软件或恶意软件，你的社交媒体粉丝会对你怎么看？”他猜再也没有人会信任他发的任何电子邮件或社交媒体信息了，这将不可挽回地损害他的公司品牌。他最终承认，他确实需要评估他的公司如何使用社交媒体。我并没有建议他停止将社交媒体作为业务工具；它可以非常有益。他只需要防止网络罪犯访问他的社交媒体。他该怎么做呢？通过我们在上一章讨论过的双重认证。


    再次，双重认证免费且易于设置。因此，打开 Facebook 的安全与登录页面，找到双重认证选项。你可以选择在手机上接收短信，或者最好使用诸如 `Google
    Authenticator` 或 `Duo Mobile` 这样的身份验证应用。Facebook 甚至允许在有人从不可信设备登录你的账户时接收提醒，你还可以选择三到五个朋友，在你被锁定时通过
    Facebook 向你发送代码或 URL。


    如果你不使用 Facebook 进行业务，只用它来分享家庭照片和你的招牌牛排肉菜谱呢？拥有双重认证真的那么重要吗？嗯，大问题发生在你博里斯·巴登诺夫（Boris
    Badenov）接管了你的 Facebook 账户，并以你的名义撰写了一条非常漂亮的信息，给你的家人朋友发了一段有趣的猫咪视频，并附上信息“这个能让你心情变好”。当你两百个亲近的朋友友收到这条信息并点击链接时，他们将被重定向到一台海外计算机，那台计算机将安装键盘记录器来窃取用户名和密码。之后你可能没剩下几个朋友了。这才是大问题！


    在我生命中的某个时刻，我发誓永远不会拥有社交媒体账户；我只是认为这不值得冒险。然而，在我获得联邦调查局（FBI）退休资格大约十八个月前，我迈出了一步，注册了一个
    `LinkedIn` 账户。我当时正前往多伦多的 FBI 办事处执行为期 30 天的任务，我想与两个都在 `LinkedIn` 上的老朋友联系。一旦注册完成，我就与许多旧同事重新建立了联系，并通过网络主题专家建立起新的联系。所谓的从不使用社交媒体全泡汤了！但我真的相信
    `LinkedIn` 没那么危险，因为它本质上是一个为商务专业人士设计的社交应用。谁会去破解它呢，对吧？我一直有新人要求和我联系，`LinkedIn` 看起来很无害。


    每当有人想在 `LinkedIn` 上与你联系时，你都会收到一封来自 `LinkedIn` 带有链接的电子邮件。实际上，坏人创建一个伪造的 `LinkedIn`
    邮件其实很容易。万如果连接请求来自你认识的人呢？邮件要求你点击链接以接受该人的请求，或者你可以查看请求者的简短个人资料。我希望我能遵循我的准则：先思考，后点击。我希望我不会一时冲动，接受一个一个我认为是老朋友或未来业务伙伴的请求。为了万无一失，我创建了一条覆盖规则或内部政策来降低风险：我只接受来自
    `LinkedIn` 内部连接的请求。这意味着我会删除邮件，打开网络浏览器，输入 `www.linkedin.com` 以确保进入的是真实网站，在应用内的更新和通知中找到该请求，然后在服务内部接受请求。或者，我会在手机上的官方
    `LinkedIn` App 上执行此操作。这样，我避免了点击邮件中的任何链接，从而降低了感染恶意软件的风险。诚实地说，你应该在所有的社交媒体平台上都使用同样的规则。


    现在我的 `LinkedIn` 账户上有近三千个联系人。我经常向我的粉丝发送信息，关于如何在互联网上保持安全以及避免成为网络犯罪的受害者。我欠我的粉丝的，你也欠你的每个粉丝和朋友的，保持你的社交媒体账户安全。如果坏人获取了我的账户，他可以轻松地发送一条看起来是我发的帖子，然后引导他们点击链接来阅读我推荐的一篇好文章。我知道我的大多数粉丝都会点击那个链接。但是，他们看到的不是有信息的内容，坏人会将他们带到一个加载了恶意代码的网站，在那里他们会被感染恶意软件。感染我所有的粉丝将摧毁我作为网络安全专家的信誉——更不用我的自我价值了。所以，我做了什么？我安装了
    `2FA`。我希望你现在也这样做。点击安全设置并按照步骤实施双重认证。


    如果你是一个热迷的 `Twitter` 用户（我承认我不是）——在上面设置双重认证也毫不费力。随着许多职业运动员、演员和政客被曝光年轻时那些不好的推文，保护你的账户对于维护声誉可能至关重要。你不想让网络罪犯或被甩的情人接管你的账户并发布照片或淫秽内容。像
    `Google` 和 `Facebook` 一样，登录时你必须输入密码和发送到你手机的代码。代码可以通过短信接收或 `Google Authenticator`、`Duo
    Mobile`、`Authy` 或类似的身份验证应用获取，这要安全得多。


    我在 `LinkedIn` 上喜欢做之一是阅读同伴推荐的文章。为了阅读这些我需要做什么？我必须点击 `LinkedIn` 里的链接。我如何知道这些链接是安全的？嗯，我不知道。没有可靠的方法可以判断它们是否合法。但现在你已经知道了点击电子邮件、网站或社交媒体中的链接会发生什么，希望你明白对于航天飞机飞行员或核电站操作员来说在工作计算机上检查电子邮件、浏览网页或参与社交媒体并不是一个好主意。但我们每个人每天都会在多台计算机和移动设备上这样做。

    '
