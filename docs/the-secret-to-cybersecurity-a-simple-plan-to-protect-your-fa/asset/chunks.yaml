    # 勒索软件概述


    你的电脑是如何染上勒索软件的？你极可能是收到了一封带有链接的鱼叉式钓鱼电子邮件，当你点击该链接时，会被引导到一个安装了恶意负载的网站。你的某个软件程序很可能存在漏洞，要么你没有对该程序进行补丁，要么坏分子在厂商发现之前就发现了它。


    一旦恶意负载安装在你的电脑上，它就会定位你所有的重要文件——文档、照片、视频、数据库和音乐。勒索软件旨在加密所有这些信息并将你锁定在之外；某些勒索软件变体甚至会影响你的操作系统并防止计算机启动。这种加密技术非常复杂且通常是无法破解；即使是大学的超级计算机也无法击它。勒索软件对你的工作电脑可能特别有害，因为工作电脑可能连接到了网络。如果网络配置不当，感染可能会扩散到整个机构。


    ## 攻击的影响和频率


    在我看来——基于在 FBI 调查此类犯罪的二十多年经验——只有极小比例的损失向执法部门报告，这是由于羞愧和对声誉受损的恐惧。我几乎每天都能看到这类案例发生。大型组织在从这些事件中恢复方面变得越来越好，但越来越多的家庭主和小微企业不断成为勒索软件的受害者。


    例如，2017 年，FBI 网络犯罪投诉中心报告收收到 1783 起被确定为勒索软件的投诉，总损失超过 230 万美元。这些只是实际上报告给 FBI 的案例。一些网络安全公司建议，全球每年勒索软件攻击的数量可能接近七十万或更多，Cybersecurity
    Ventures 预测到 2019 年全球勒索软件的损害将增加到 115 亿美元。


    赎金要求通常在每次个人攻击中处于 500 美元到 1,000 美元之间；数据劫持者通常索要较低的赎金，以便获得更多支付。然而，对于较大的公司来说，某些赎金要贵得多。我曾有一公司给我打电话，说他们支付了
    28000 美元的赎金，但仍然没有收到解密密钥。2017 年，韩国网络提供商 Nayana 支付了 397 个比特币（当时约 100 万美元）来解锁超过 3400
    个被勒索软件加密的网站。在当时，这是已知的单次勒索软件攻击最高付款。


    ## 值得的案例研究：WannaCry


    如果你以前没听过勒索软件，你可能是在 2017 年 5 月 17 日了解到它的，那时 `WannaCry` 勒索软件发布的时候。它感染了全球各地的计算机和网络，确实让很多人想哭。`WannaCry`
    通过蠕虫感染了 Windows 电脑，加密了硬盘上的文件并使用户无法访问。攻击者利用了微软的一个漏洞，该漏洞此前已被国家安全局检测到。微软发布了补丁以防止渗透，任何更新了系统的人都不必担心。当然，并不是每个人都下载并安装了补丁。


    `WannaCry` 感染了全球 150 个国家的约 20 万台电脑；受影响最严重的四个国家是俄罗斯、乌克兰、印度和台湾。受攻击影响最大的单一机构之一是英格兰和苏格兰的国家医疗服务体系（NHS）医院网络——多达
    7 万台设备（包括计算机、MRI 扫描仪和血库冰箱）被感染。本田、日立、尼产、雷诺、联邦快递、德意志银行和 LG 电子等大公司，以及哥伦比亚、希腊、意大利和中国的大学也报告其网络被
    `WannaCry` 感染。


    即使是政府也无法免勒索软件的侵害；俄罗斯内政部、中国公安局和印度的州政府也成为了目标。估计 `WannaCry` 造成了 40 亿美元的损失。


    ## 关键基础设施的脆弱性


    医疗保健提供者特别成为目标，因为他们的信息至关重要。2017 年 2 月，`WannaCry` 攻击了好莱坞卫理医疗中心。2017 年 3 月，`WannaCry`
    感染了渥太华医院的机器。2016 年 11 月，`WannaCry` 攻击了旧金山的交通局。


    公共基础设施，包括交通和公用事业，也是勒索软件的热门目标。2016 年，`WannaCry` 感染了交通局。它仍然遭受了巨大的损失。


    ## FBI 关于赎金的政策


    明确的是，FBI 不支持向网络犯罪分子支付赎金。在 2017 年的网络犯罪报告中，FBI 描述了其关于勒索软件的政策：


    > 支付赎金并不能保证组织重新获得数据的访问；事实上，某些个人或组织在支付赎金后从未获得过解密密钥。支付赎金会助长对手为了利润攻击其他组织，并为其他犯罪分子的参与提供了一个利润丰厚的环境。虽然
    FBI 不支持支付赎金，但他们理解，当企业面临无法运营的情况时，高层会评估所有选项以保护其股东、员工和客户。


    正如我已经说过好几次的，对数据进行良好的备份可以免去很多痛苦。


    '
