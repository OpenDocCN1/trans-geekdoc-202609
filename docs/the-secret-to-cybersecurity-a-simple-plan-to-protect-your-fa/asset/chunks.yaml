- raw: 'I don’t care how much you love to fish, you can be sure that the one not having
    fun is the fish dangling at the end of your line. The same is true for phishing.
    When you’re the one stuck on someone else’s hook, you’ll wish you hadn’t fallen
    for the sparkling bait floating through your email inbox.


    ![Image](images/chap.jpg)


    ## CHAPTER 4:


    ## Think Before You Click


    POST-THANKSGIVING HOLIDAY SHOPPING IS AN American phenomenon that I’ll never understand.
    Every year, millions and millions of shoppers line up outside department stores
    and shopping malls and wait hours to save a few bucks on flat-screen TVs, game
    consoles, and whatever else is on sale. Shoppers used to wait until Black Friday,
    the day after Thanksgiving, but now they’re even hitting stores on Thursday night.
    Another new phenomenon is Cyber Monday, the Monday after Thanksgiving weekend,
    when online retailers have their big holiday shopping sales. Americans spend billions
    of dollars every year purchasing gifts through e-commerce in a single day.


    Do you have any idea what holiday comes next? It’s called Bad Guy Tuesday. If
    you haven’t heard of Bad Guy Tuesday, it’s because I made it up. But I’m convinced
    that cybercriminals around the world take Thanksgiving weekend off to rest and
    relax so they can get ready for the day after Cyber Monday. That morning, they
    blanket the world with phishing emails that are designed to trick you into clicking
    a link presumably to Amazon, Best Buy, Target, Walmart, FedEx, or UPS. I think
    the bad guys probably do it again around December 23, when they send emails informing
    us that our package delivery has been delayed. How many of us would immediately
    panic and click the link? If you’re like me, the good news is that you probably
    haven’t even started your holiday shopping by December 23!


    One of the most important things to remember about phishing is that bad guys are
    always coming up with new ways to deceive us through emails. It usually involves
    opening an email, clicking a link, opening an attachment, or having you enter
    your username and password. And cybercriminals have billions of email addresses
    that they’ve stolen in data breaches. In May 2017, there was a massive phishing
    attack on Google email users. Highly sophisticated malware sent an emailed invitation
    to users from someone they might have known that asked them to click a link. Once
    users clicked, the recipients were taken to a legitimate Google sign-in screen,
    where they were asked to continue to Google Docs. By clicking yes, however, the
    users were actually giving permission to a malicious third-party application that
    was programmed to steal passwords, emails, and everything else they’d linked to
    a Google account. The scariest part about this particular worm is that it worked
    within Google’s system. When users clicked the link, the malware sent spam messages
    to the people in the victims’ address books, replicating the scenario over and
    over again. Google said about one million (only one percent) of its email accounts
    were infected by the Google Docs malware, but that’s still a lot of people who
    were compromised. The Google attack is another reminder that Internet users need
    to think before they click a link, even if it appears to come from someone they
    know.


    Unfortunately, these types of attacks are nothing new. Bad guys have been targeting
    Google for years. In 2010, I received an email from one of my wife’s friend’s
    Gmail accounts. The woman’s name was Brenda and I’d seen her around the neighborhood,
    but I’d never communicated with her through email. The email contained a message
    asking for my input, as well as a link to Google Docs. Of course, I live in a
    world where I investigate bad things on the Internet every day, and an unexpected
    email asking me to do something was automatically a red flag. I responded to the
    message with a question, “Did you mean to send this to me? If you didn’t, your
    account has been taken over by a bad guy.”


    I received a response from Brenda a few minutes later that read, “Oh, Scott, you’re
    being paranoid. I really want your input.”


    While that comment might satisfy most people, it wasn’t a sufficient reply for
    a cynical FBI agent from New York. In my line of work, I trust nothing that’s
    included in an email until it has been thoroughly verified. I responded once again,
    “Do you want me to forward this email to my wife, Ann? She is better at these
    things than I am.”


    A few minutes later, Brenda responded, “Yes, please send this to Ann.” No problem—except
    that my wife’s name isn’t Ann! I picked up the phone, called Brenda, and explained
    what was happening to her Gmail account. At first, she didn’t understand the gravity
    of the situation. But then I sat down with her and explained how the email had
    been sent to more than three thousand people in her address book. She was employed
    by a successful multilevel sales organization, and there is no telling how many
    of her contacts attempted to view the document in Google Docs.


    I analyzed the email back at the FBI office, and we discovered that nothing appeared
    to happen when we clicked on the link, which is an everyday occurrence on the
    Internet. However, the people who clicked the link were unknowingly taken to a
    webserver in Russia that attempted to infect their computers with malware. We
    opened the email on a virtual machine in our computer lab to examine it further.
    A virtual machine is a computer within a computer that runs in a safe, sandboxed
    environment where malware can’t do any damage. When we clicked the link, the malware
    on the webserver attempted to infect our virtual machine with viruses designed
    to steal usernames and passwords for any mission-critical account. We then tested
    the malware against twelve publicly available antivirus products, and eight of
    them didn’t recognize it as a threat. I know you don’t want to hear this, but
    antivirus products are only 30–40 percent effective on their best days. That’s
    because malware writers develop more than one hundred thousand new strains of
    malware each day. It’s basically a race against the bad guys, and antivirus products
    can only protect against known malware. You can’t fight what you don’t yet know
    exists, and it’s dangerously easy for new strains to go undetected. This type
    of malware is called a zero-day exploit because once it’s released into the wild,
    there’s no available cure until antivirus companies write antidotes or signatures
    to contain it.


    I still wonder how many of Brenda’s friends clicked the link and had address books,
    usernames, and passwords stolen. She operated a successful stay-at-home business.
    She had a following of customers who trusted her, and many of them likely opened
    any link she sent in an email. When Brenda attempted to log in to her account
    to see what other damage the bad guys had done, she discovered she no longer had
    access because they’d changed her password. Her business came to a grinding halt
    while she contacted Google and tried to regain access. Once your account has been
    compromised, it isn’t easy convincing your email provider that you’re the legitimate
    account holder.'
