- raw: 'A second type of work-at-home scam that I encountered often while working
    for the FBI targets college students, stay-at-home moms, and the elderly. The
    victim typically received an email, recruiting him or her as an accounts receivable
    clerk for a nonexistent company. These fake positions required the recipient to
    provide a bank account and routing number in order to receive outstanding bills
    from the supposed company. Once money was transferred into the account, the individual
    was instructed to wire transfer about 90 percent of the funds to another bank
    account or send it to the bad guys via Western Union. The individual received
    10 percent of the funds as a commission, which seemed like a great job—at least
    until law enforcement knocked on the door. Where did the stolen money come from?
    In many cases, it was stolen from legitimate companies that weren’t utilizing
    two-factor authentication. If a thief steals a username and password, he can break
    into the payroll software package and change the bank account and routing information.
    Instead of paying employees their salaries, the companies end up paying cybercriminals
    overseas. What better way for criminals to do it than with an army of unsuspecting
    college students and stay-at-home moms? By the time the company discovers that
    its employees haven’t been paid and contacts the bank, it’s too late to recover
    the money.


    In another scam, the cybercriminals send fraudulent checks to mules and ask them
    to deposit them into their accounts. After taking a certain percentage of the
    money, the mules transfer the rest to the criminals’ accounts. A few days later,
    the mules will learn the checks weren’t real and that they actually sent their
    own money to the crooks.


    Yet another online scam involving mules is the reshipper scheme, which involves
    shipping illegally obtained merchandise such as computers, TVs, and other expensive
    items to cybercriminals located overseas. The bad guys recruit mules through Craigslist,
    [Monster.com](http://Monster.com), and other local message boards. They then direct
    their “new employees” to a company website, which looks like a legitimate shipping
    company. The victim will be asked to download an employment agreement, read it,
    and sign it. At that point, the recruit believes he or she is applying for an
    actual stay-at-home job. The employment agreement asks for the recruit’s date
    of birth, Social Security number, and bank account and routing numbers. The mule
    is told that he or she will receive packages and that it’s their job to open the
    boxes and inspect the items. Then they’ll re-ship them to an address provided
    by the company, which are typically in West Africa and Eastern Europe. In a few
    days, computers and TVs that were purchased with stolen credit card numbers start
    arriving at the mule’s home. Since most companies are suspicious when expensive
    merchandise is shipped to foreign countries, the mules serve as middlemen to prevent
    red flags. In some cases I investigated, the mules were paid with counterfeit
    checks; some of them were overpaid and even returned the overpayment with their
    own money before realizing their paycheck was fraudulent. In a nutshell, the victims
    lost a lot of money in the scams, and then law enforcement contacted them because
    thousands of dollars of stolen merchandise was shipped to their homes.


    [Monster.com](http://Monster.com), Craigslist, and other online job listings have
    made it so much easier for people to find stay-at-home jobs to supplement their
    income or work part-time while going to school or caring for loved ones. Unfortunately,
    the same technology has also made it easier for cybercrooks to create fraudulent
    positions to take advantage of them. It is crucial that you, as a job seeker,
    exercise common sense and caution when seeking online employment. Read position
    descriptions carefully and research companies before applying for jobs. Most importantly,
    remember this: If it sounds too good to be true, it’s probably a scam.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Follow one simple rule: If the job sounds too good to
    be true, it probably is.


    ![Image](images/lock.jpg) Avoid stay-at-home job descriptions that include reshipping,
    accounts receivable, and billing clerk. They’re usually scams.


    ![Image](images/lock.jpg) Never accept a position that requires depositing money
    into your bank account and then wiring it to different accounts. In nearly every
    case, you’ll be laundering stolen money for the bad guys.


    ![Image](images/lock.jpg) If a job description includes poor use of the English
    language, including grammar, capitalization, and verb tenses, it’s more than likely
    a scam. Many of the cybercriminals who send these types of emails aren’t native
    English speakers.


    ![Image](images/lock.jpg) Never provide credentials of any kind, such as bank
    account information, Social Security number, usernames, passwords, or any other
    personally identifiable information in response to a recruiting email.


    ![Image](images/lock.jpg) Before accepting a position, ask for a job interview
    by phone, videoconference, or preferably in person. If the only job interview
    occurs via email or text messaging, it’s probably a scam.


    ![Image](images/lock.jpg) Research your potential employer before accepting a
    job. Search the Internet and other resources to determine whether or not you’re
    interviewing with a legitimate company. Ask for its Web address and physical address.
    Check online business complaint sites, social media, and the Better Business Bureau.


    ![Image](images/chap.jpg)


    ## CHAPTER 14:


    ## Finding Mr. or Mrs. Wrong


    ONE OF THE MOST HEART-WRENCHING cases I encountered during my career with the
    FBI involved a woman in her late fifties, divorced, and looking for love as she
    neared her golden years. It was shortly after the Christmas holidays; Brooke was
    lonely, so she turned to the Internet to find someone she could spend the rest
    of her life with.


    In only a few short weeks, Brooke started communicating with a man she knew as
    Anthony. He had supposedly attended Vanderbilt University, studied chemical engineering,
    and then returned to his native France to run his family’s business. Anthony told
    Brooke that he traveled the world for work and occasionally returned to the U.S.
    The two talked on the phone, shared emails, and texted each other almost every
    day for about eight months. They exchanged photographs and tried to communicate
    several times via Skype or Facetime, but their connections never worked. After
    months of correspondence, Brooke fell in love with Anthony, and they made plans
    to build a dream house together on the beach in Costa Rica. All Anthony needed
    to do was sell his family estate in France and he would use the money to buy a
    vacation home they could share. Brooke would finally be able to have the fairy-tale
    life she’d always dreamed about.


    What prompted me to meet Brooke was a telephone call from her attorney late one
    Friday night. The attorney advised me that Brooke was the victim of cybercrime
    and had been defrauded by her online boyfriend in France The first thing I told
    him was that it sounded like the work of Nigerian bad guys, but he repeated to
    me that her boyfriend was from France. There was a concerned tone in his voice
    that I’d heard too many times before. I asked two important questions before he
    shared details of her story:


    1. How long ago was the money sent?


    2. How much did she send?


    The attorney said she’d wired $500,000 to an overseas account about ten days earlier.
    I broke the bad news, which I’d shared with hundreds of other cybercrime victims:
    it was too late to recover her money, we’re probably not going to be able to put
    the bad guys in jail, and this crime could have easily been prevented.'
