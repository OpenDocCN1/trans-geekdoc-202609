  trans: '


    在过去的几年里，FBI 逮捕并起诉了一些定居在海外的高级犯罪分子，负责网络犯罪的 FBI 探员正在加班加点进行逮捕。近年来出现了一些引目的成功案例。2016
    年 12 月，一名名为 `Mark Vartanya`（又名 `Kolypto`）的计算机黑客从挪威引渡到美国，因为他是 `Citadel` 恶意软件工具包的共同开发人员。他帮助从全球
    1100 万台受感染的计算机中盗取财务账户凭据和个人信息，导致了超过 5 亿美元的损失。他承认了罪并被判处五期徒禁。2018 年 2 月，美国司法部对 30
    多人提起指控，他们是长期运营的网络犯罪论坛 `Infraud` 的核心成员。该欺诈论坛吸引了全球超过 11,000 名成员，他们在论坛上出售、交易和购买被盗的身份信息、信用卡账户和恶意软件，导致全球消费者的损失超过
    5 亿美元。


    我不想说这些，但我们并无法通过逮捕来解决网络犯罪问题。世界上有很多计算机犯罪犯的避风港，而许多地方的主权政府根本不在乎他们的公民正在伤害美国人。如果你访问
    FBI 网站查看网络犯罪犯通名单 ([www.fbi.gov/wanted/cyber](https://www.fbi.gov/wanted/cyber)，你会看到
    25 个你可能读不出来的名字。如果其中任何一个人上飞机飞往佛罗里达州的戴通海滩度假，我向你保证，FBI 探员会在机场逮捕他们。但如果你认为会有任何网络犯罪分子会去美国旅行，那么我在布鲁克林可以卖给你一座桥。


    现在是你完全可以感到沮丧的时刻了。你刚刚发现，当坏人偷了你的东西并通知执法部门时，你拿回钱的机会非常渺小。而且我告诉过，执法部门逮捕并惩罚坏人的机会可能比你拿回钱还要小得多。我在一次提供酒水的活动中宣布这个消息时，一个人从人群中大喊：“难怪总统解雇了
    FBI 局长 `[James] Comey`！你们到底在干什么？”显然，我之前的职位需要脸皮厚一点。这引出了我的第四点也是最后一点，这也是促使我写这本书并试图教育美国公众的原因。


    4. 第四个真理：大多数网络犯罪是可以预防的。


    我把这一点告诉我的一个朋友，他是华盛顿特区 FBI 总部的一位高级高管。他对我的评估表示强烈反对，许多其他人也经常这样想。当我做出这种陈述时，我感到很沮丧，因为我知道我调查的
    90%的案件本本可以通过用户教育和意识、健全的业务流程以及使用名为`双重身份验证`的简单控制措施来预防。我的 FBI 同事解释说，来自中国和俄罗斯的外国情报机构正在使用极其复杂的技术，当这些威胁行为者针对某个组织或个人时，坏人每次都会获胜。在某些情况下，这确实是真的。我见过这些威胁行为者针对世界上一些最大的组织并获取了访问权限。但世界各地还有大量不复杂的威胁在追波大流。他们正在侵害老年人、房屋主、小企业和非营利组织，造成了严重的损害。大公司有钱投入解决问题，但事实并不起作用。


    2017 年，Cybersecurity Ventures 预测，到 2021 年，网络犯罪每年将给全球带来 6 万亿美元的损失，而仅仅两年前数字为 3 万亿美元。根据`Herjavec
    Group` 的说法，这是历史上最大规模的经济财富转移。令人惊讶的是，网络犯罪的利润将超过全球所有非法毒品贸易的总和。网络犯罪事件正以惊人的速度持续发生，越来越多的数据被窃取。`Garner
    Inc.` 表示网络安全成本在 2018 年已达到 930 亿美元，并在 2021 年将达到 1 万亿美元。在不久的未来，几乎每个家用设备都会连接互联网，这让我相信情况只会变得糟糕。


    在我 FBI 职业生涯的最后十年里，我剖析了数千起网络犯罪案件，它们具有共同点，我总结出了一些预防措施，如果遵循这些措施将极大减少你成为受害者的概率。与你分享的内容不需要花很多钱。


    ```

    images/chap.jpg

    ```


    不幸的是，市场上没有任何神奇药或银弹能让你完全安全。然而，各种技术的结合可以极大减少你的风险。如果一个安全销售员来到你的机构，声称他有一个产品可以让你安全并免受所有威胁的影响，我可以告诉你：他在撒谎。市场上没有任何一种单一产品可以消除所有风险；网络犯罪者的工作速度太快，威胁也在不断变化。在我们的行业中，这有一个术语：`深度防御`。这意味着不要依赖单一产品。只使用一种策略或没有策略是非常糟糕的网络习惯，我可以向你保证一点：如果你没有良好的习惯，形势将对你不利。你会被黑，网络犯罪者很可能会拿到你的钱。


    在进入具体技术之前，我必须承认我并没有创建或开发过任何这些技术。我只是幸运——或者应该说是不幸——见证并调查了数千起网络犯罪案件并识别了它们的根本原因。希望我能用所学的知识让你们在互联网上更安全。


    ## 第 3 章：钓鱼


    感觉就在昨天，我把一张 America Online 的光盘插入笔记本电脑，将电缆插进墙上的电话插座，第一次连接到现在被称为互联网的“信息高速公路”。


    万维网是 1989 年发明的（不，不是阿尔·戈尔发明的），第一个网站于 1991 年上线。在之后的几年里，我开始定期给朋友发送电子邮件并与他们交换照片。1998
    年，当汤姆·汉克斯和梅格·瑞瑞主演的好莱坞热门电影《你有新邮件了》时，全世界都痴迷了互联网，每个人都在使用电子邮件。它是如此简单，以至于我们的父母、祖父母和孩子都有发送电子邮件的能力。根据`Radicati
    Group`2018 年的一项研究，目前全球有超过 38 亿电子邮件用户（超过地球总人口的一半）。这一数字预计到 2022 年将增长到 42 亿。由于平均每人拥有
    1.7 个电子邮件账户（有些用于个人，另一些用于业务），全球大约有 44 亿个账户。


    '
