- raw: 'Miller seemed to take pity on Caroline and told her that she sounded like
    a nice girl. If she was willing to pay $250 in fines that day, he advised her,
    the violation would be removed from her driving record and her license wouldn’t
    be suspended. Caroline was relieved and told the officer that she’d come to the
    station later that day to pay the fines. But Miller told her that, since the violation
    was with the state police, she needed to go to Walmart and send a Western Union
    money order immediately. He then provided her with instructions on where to send
    the money.


    Somewhere in the United States, a cybercriminal climbed off his couch, put on
    his pants, and drove to his local Walmart to receive $250. His life had changed
    for the better ever since he watched a YouTube video with instructions on how
    to make money quickly. The only thing he had to do was find people who had posted
    information about traffic tickets on their Facebook pages; after that, it wasn’t
    too difficult to obtain their telephone numbers. It was an easy way to make a
    living, and most of his victims were relieved to get off so cheaply. At least
    they wouldn’t lose their driver’s license or go to jail—not that this was ever
    even possible in this scenario.


    MICHAEL WAS THE OWNER OF a successful services company. He was happily married,
    had two beautiful children, and was active in his church. One night, Michael received
    an enticing Facebook message from a woman with an exotic Asian name. Against Michael’s
    better judgment, he exchanged emails with the woman. They engaged in a few online
    conversations and got to know each other. At some point, she suggested they could
    talk to each other via Skype. Within five minutes, Michael was looking at a beautiful,
    young blonde woman, who appeared to be between twenty and twenty-five years old.
    She told him her name was Melania, and that she was from South Africa.


    Somewhere in a remote village in Asia, members of a cybercrime extortion ring
    were putting their plan into action. The only thing left to do was push a button
    and record Michael’s Skype call. Michael locked the door of his office to give
    himself a little privacy; he didn’t know he was being video-recorded. Before long,
    Melania took off her clothes and started performing sex acts. She told Michael
    she wanted him to do the same thing. He did. After the call, he logged off and
    went back to work.


    A few minutes later, Michael received an email from Melania, in which she told
    him she needed $10,000 to pay her mother’s medical bills. She had no choice but
    to demand the money from Michael to save her dying mother. A link to a private
    YouTube channel of Michael’s video was included in the email. The video’s quality
    was excellent, and there was no room for doubt that it was Michael who was unclothed
    and doing things he shouldn’t have been doing. Melania warned Michael that, if
    he didn’t send her the money, a link to the video would be sent to his Facebook
    friends, including his wife, children, fellow church members, and business associates.


    Michael should have contacted law enforcement after receiving the ransom letter,
    but he didn’t. Although losing $10,000 would be a very expensive lesson, Michael
    believed it was a bargain to avoid public humiliation. He went to his bank and
    made a wire transfer to a bank in Russia. The location seemed odd to him since
    Melania claimed she was from South Africa, but he had been assured the video would
    be destroyed once the ransom was paid. He felt relieved to have dodged a bullet
    that might have destroyed his marriage and career and ruined his reputation for
    life.


    Michael still felt relieved when he woke up the next morning. It almost seemed
    like a bad dream. But, when he checked his email, he found another message from
    Melania. She apologized and said the $10,000 he’d sent wasn’t enough. She needed
    him to transfer an additional $35,000 to the same bank account. Michael was furious
    and sent her an angry email, saying she hadn’t lived up to her end of the deal.
    She emailed him back immediately and reminded him what would happen if he didn’t
    pay. Michael didn’t think he had a choice, so he sent Melania another $35,000
    that afternoon. Over the next several weeks, Michael sent her a total of $150,000.


    By the time Michael called the FBI office, he was at the end of his rope. He was
    humiliated, had wiped out most of his retirement savings, and was actually considering
    suicide. I’m convinced the bad guys wouldn’t have stopped making demands until
    they’d drained every penny from Michael or, worse, he’d killed himself.


    PATRICK WAS TWENTY-FIVE YEARS OLD and newly married when he and his wife saved
    $50,000 for a down payment on their first home. After numerous meetings, telephone
    calls, and emails, Patrick and his wife selected what they thought was their dream
    home. Shortly before closing on the property, Patrick’s broker told him he was
    only waiting for instructions from the title company about where to wire his down
    payment. A few hours later, Patrick received an email from a title company with
    detailed wire transfer instructions, including a bank account and routing number.
    Patrick went to his bank and withdrew his hard-earned $50,000. He provided the
    wire instructions to a bank official and left one step closer to becoming a first-time
    home buyer—or so he thought.


    The next day, Patrick received an email from the actual title company with instructions
    on where to send the money. Obviously confused because he’d wired the money the
    previous day, Patrick emailed his broker. Patrick and his broker called the title
    company, and it took a while for everyone to get on the same page. The title company
    informed Patrick that it hadn’t sent the previous day’s email. Looking carefully
    at the title company’s instructions, Patrick became concerned that the routing
    number and bank account number were different than the ones from the previous
    day. Upon closer inspection, he also noticed the name of the title company was
    slightly altered in the email address in the earlier emails. Patrick called his
    bank to stop the wire transfer, but it was too late. An official from Patrick’s
    bank called someone from the bank where the money was sent, but the funds had
    already been withdrawn.


    Obviously panicked about losing so much money, Patrick called the title company.
    Its attorney informed him, in a nice way, that it wasn’t responsible because it
    hadn’t sent the original email. Patrick contacted the local police, who told him
    the bank that received the money was located in another state and therefore out
    of its jurisdiction. Patrick called the state police, who told him it didn’t have
    the necessary resources to investigative cybercrime. He was instructed to notify
    the FBI, which directed him to go to the [www.IC3.gov](http://www.IC3.gov) website
    and fill out a complaint to the FBI’s Internet Crime Complaint Center. As far
    as I know, Patrick is still trying to recover his money.


    NOT LONG AGO, A WEALTHY older gentleman named David was comparing rates for certificates
    of deposits on the Internet. He found a bank in California that was offering a
    competitive rate; it wasn’t a great rate, but it was better than what local banks
    were offering. David was interested in investing a sizable amount of money, so
    even a quarter of a percentage point could mean a few thousand dollars in interest
    earned. David contacted the bank and spoke to a representative, who was pleasant
    and knowledgeable on the phone. During their conversation, the bank rep persuaded
    David to send $750,000 to the bank via wire transfer. David followed the man’s
    instructions and received a confirmation email.'
