    ## ACKNOWLEDGMENTS


    IF YOU WOULD HAVE TOLD me more than thirty years ago that I would be enjoying
    retirement after an amazing career with the Federal Bureau of Investigation, married
    to the woman of my dreams, and the author of a book about cybersecurity, I would
    have told you that’s not my life. As I look back on this journey, I am reminded
    that you are only as strong as the people you surround yourself with. Throughout
    my career, I met so many incredible people who inspired me, and I’ve listed a
    few who made this dream possible.


    If it was not for my mom, Alice Augenbaum, I never would have found that entry-level
    job with the FBI. If she hadn’t filled out the application for me, who knows where
    I’d be today.


    My friend Natalie O’Connell pushed me to go back to college at City College in
    New York. She also inspired me to work on an MBA in Information Technology at
    Fordham University, which led to my passion for technology.


    Supervisory Special Agent (SSA) Robert Grubert of the FBI’s New York office was
    my supervisor for six years. He provided all the tools I needed to succeed. I
    also wouldn’t have made it without the friendship and support of several special
    agents, including Philip Sarcione, Joseph Cervini, Robert Leneck, and the late
    James Downey.


    While assigned to the Syracuse Resident Agency, I was mentored by four of the
    greatest FBI agents around: John Winslow, Philip Looney, Robert Haley, and my
    Supervisor Michael Mason. I had numerous great friendships with so many other
    awesome people while working there.


    While assigned to FBI headquarters in Washington, D.C., I wouldn’t have made it
    there for three years without the friendships of Ray Goergen, Todd Ratcliff, and
    Leslie Bryant.


    In Nashville, I had the support and friendship of Matthew Dunn, Richard Campbell,
    Randy Bechtel, and Keith Moses. Together we ran the Nashville Division and made
    sure our staff was proud to work for the FBI. Special Agent in Charge of the Houston
    Division, Perrye Turner, pushed me to go back and finish my MBA, as well as continue
    a lifelong path of education.


    I’d especially like to thank John McMurtrie, Brandon Harcum, John Medeiros, Jeff
    Dale, Casper Cromwell, Cameron Beall, Dean Kinsman, and Merridee Isabell for being
    my direct reports during my seven years as a supervisor. Thanks for making my
    life so easy. To Matthew Espenshade, Jeff Peterson, and Jeremy Baker, thanks for
    being true leaders and allowing me to do my job.


    How can I not mention Victor Rodriguez, my good friend and trusted lieutenant,
    with his encyclopedic knowledge of technology. I’d also like to commend my friends
    at the Tennessee Bureau of Investigation and Franklin Police Department, such
    as Kevin Williams, Cesar Salazar, Richard Littlehale, Mark Gwyn, and Eric Anderson,
    for their unconditional support to the Nashville Cyber Task Force. We couldn’t
    have kept the community safe without you guys.


    To my great friend and former FBI Agent Jason Smolanoff, Senior Managing Director,
    Cyber Risk: your guidance, support, and friendship allowed me to follow my passion
    to teach individuals and organizations how not to be the next cybercrime victim.


    David Briggs of First Tennessee Bank invited me to scare his clients, which is
    where I met my current business partner and close friend, David Byerley. When
    I met David, I told him my goal was to write a book and speak around the country
    on keeping people safe. David convinced me I should aim much higher and instead
    of educating the country, why not educate the world? David provided me with the
    confidence to aim much higher than I could on my own.


    I’d also like to thank my family at Hero Publishing for taking a retired FBI agent’s
    dreams and using them to make the world a better and safer place. I am blessed
    to work with such a team of superstars: Matt Rigsby, Blake Byerley, Sam Lingo,
    Josh Oakes, Zak Manning, Hannah Paramore, Holly Hubert, Betsy Woundenberg, and
    Paul Clements. Paul is an amazing nonfiction author who took my original 70,000-word
    manuscript and made it into a meaningful story that flowed.


    I can’t forget my friends Darren Mott, Robert Bannazia, Mike Rech, Rich Hlvati,
    Jordon Flowers, Dan Wittig, Don Baham, Brien Welsh, Bill Mulholland, Don Slaughter,
    Maria Dominici, Don “Mac” McCarthy, and Wiley Robinson, who’ve all been tortured
    by me asking, “What do you think about this story or point?”


    Jonathan Merkh at Forefront Books and his team made this book a reality, and I
    spent the past several months with Mark Schlabach working on this project and
    perfecting the story.


    To my sister, Bonni, and brother in-law, Rick, and nieces Emily and Sydney, thanks
    for your love and support over the years. To my brother, Stephen, thanks for making
    me laugh.


    Words can’t describe how much I love my wife, Maureen, and appreciate her for
    allowing me to chase my dreams. Writing a book takes a tremendous amount of effort
    and patience, and she understood how important it was for me to get my story published.
    I have no idea where she comes up with the patience to put up with me, and because
    of her I am a much better person. To my boys Aidan and Quinn, thanks for keeping
    me young. I’m always so proud of both of you.


    Finally, thank you to the brave men and women of the FBI, who day in and day out
    continue to keep the country safe, and to the Federal Bureau of Investigation
    Agents Association, which never stops fighting for their rights.


    Scott E. Augenbaum


    [www.scotteaugenbaum.com](http://www.scotteaugenbaum.com)


