  trans: '

    如果今天让我定义我的工作，我会说我是在教个人和组织如何不成为网络犯罪事件的受害者。我一直能够与私营部门一些最优秀、最精明的精英合作，分享情报，共同制定解决方案并确保大家的安全。在我的
    FBI 职业生涯，我处理过许多大型安全泄露事件，对我来说，没有什么比处理那些受害的小公司、退休人员是非营利组织更让我感到痛苦的了。我现在知道，为这些人提供教育不仅服务了社区，也让我们所有人都保持安全。


    当我作为 FBI 特别探员退休时，对我来说是一个悲伤的一天。我花了二十多年时间处理网络犯罪案件，其中七年时间，我管理着美国最好的网络犯罪部门之一。我热爱那份工作。我的同事们就像家人一样。作为一名探员，我可以一直工作到五十七岁，但我决定在五十岁符合条件时退休。我为什么要离开我如此喜爱的职业？因为在我的内心深处，我知道在
    FBI 之外，我可以为美国民众做更多。


    几年前，我读过一本名为《人们为何会失败》的书，第一章是关于清晰性的重要。在 FBI 期间，我变得清晰的事情是：我需要尽一切努力成为全球网络犯罪和风险管理领域的领先专家之一。我从全球领先的信息安全公司参加了多门信息安全课程，并获得了七项信息安全认证。这并不容易。我阅读了我能找到的所有关于网络犯罪的文章，并与行业内尽可能多的人进行交流。如果你想成为某个领域的专家，你必须投入尽可能的时间来精通该学科。


    最终，我开始将我学到的知识融入到演示稿中，并向任何愿意听的人分享我的所学。在整个 FBI 职业生涯，我向私营部门公司进行了数千场演讲，讲解如何避免成为网络犯罪的受害者。当我接近退休年龄时，我开始问自己：我最喜欢做且感觉起来不像工作的事情是什么？答案是公开演讲、教育公众以及结识新朋友。这些领域对我来说非常自然，毫不费力且有趣。从那时，我开始认真考虑离开局局并进入私营部门。


    我决定我想通过教育小企业、非营利组织、学校和公民——尤其是年轻人和婴儿潮一代——如何避免成为计算机犯罪的受害者来改变世界。在网络犯罪教育和预防上投入了如此多的资金，但对于社会最脆弱的群体，可用资源非常少。我致力于将我在
    FBI 工作的二十九年中学到的知识并与公众分享。


    在我 FBI 职业生涯的早期，我衡量成功的标准是将坏人送进监狱。今天，我的成功故事发生在某人在听了我的某场演讲后给我打电话，告诉他们已经在平台上实施了双重身份验证。如果有人在我成为
    FBI 探员时告诉我，我通过谈论网络安全获得的职业满足感将比捕捕坏人更多，我当时会说：“你疯了，那不是我想做的。”


    现在，这是我所做的最重要的事情。


    在接下来的章节中，我将分享一些步骤，如果遵循这些步骤，将减少你成为受害者的概率。这些行动项对于非技术人员来说并不难理解，你不需要花很多钱来实现它们。当然，只有两种方法可以保证你不必处理计算机犯罪：搬到北极或者扔掉你的电脑。你可能不愿意做其中任何一种，我也一样。然而，如果你遵循这些步骤，你将成为数字世界中一个更安全、更受保护的成员。


    在接下来的几个章节中，我将与你分享几个故事来支持这些每一个步骤。我会对你诚诚的——当我谈论或描写网络犯罪时，我倾向于吓唬人们。在信息安全领域，有一个术语叫做
    `FUD`，代表恐惧、不确定性和怀疑（uncertain and doubt）。当有人试图解释网络犯罪问题的规模但没有被重视时，大机构就会使用这个词。我听过人们说我的演讲充满了
    `FUD`。那么，我在这里引入一个新术语叫做 `FFRE`，它代表来自真实经历的恐惧。书中包含的每一个故事都来自真实的现实经历。受害者是真实的，事件也是真实的。如果这能防止你成为受害者，我不介意带你离开舒适区。


    ![Image](img/chap.jpg)


    ## 第一章：网络犯罪


    网络犯罪已成为数字世界的生活事实。这种威胁极其严重而且正在增长。网络入侵变得越来越普遍、越来越昂贵、越来越复杂。我们国家的对手针对我们的国家关键基础设施，包括公用事业、防御系统以及航空和交通控制机制。美国公司成为贸易机密和其他敏感企业数据的目标，大学则成为尖端研发的目标。身份盗窃者正在攻击我们的普通公民，在线掠食者正在跟踪我们的孩子。


    每天都有另一个关于大规模数据泄露的媒体报道。美国公众在反复听到同样令人沮丧的新闻后变得麻木了。根据 `Cybersecurity Ventures` 的分析，网络犯罪的成本到
    2021 年可能达到 6 万亿美元，自 2015 年以来在六年内翻了一番。`Sur 里大学`高级讲师 `Michael McGuire` 的最新研究发现，全球网络犯罪的每年非法利润已到
    1.5 万亿美元，大约相当于俄罗斯的 GDP！在美国，FBI 的 `Internet Complaint Center` 在 2017 年收到了超过三十万份投诉，报告损失超过
    14 亿美元。


    在我们生活的几乎每个方面，我们已经对网络犯罪分子变得脆弱。如果你曾在 `The Home Depot` 买过家居维修产品（在 2014 年 4 月到 9 月期间，有
    5600 万个信用卡号泄露），在 `Target` 购买过衣服或家居用品（黑客感染了支付卡读取器，并拿走了 2013 年感恩节后购物者使用的约 410 万个信用卡和借记卡号），或尝试通过在
    `LinkedIn` 注册来扩大你的专业网络（一个名为 Peace 的俄罗斯黑客盗取了超过 600 万个加密密码，他于 2016 年 5 月将它们发布在一个俄罗斯犯罪论坛上），你可能在不经意间成为了网络犯罪的受害者。


    虽然这些大规模数据泄露涉及世界上一些最大的公司并在全球范围内成为头条新闻，但我在 FBI 与网络犯罪斗争时，每天处理的内容很少有媒体报道。每天，我都会与中小型企业、非营利组织、学术机构的受害者合作，更糟糕的是，与失去生活积蓄的退休人员合作。在我的职业生涯中，我目睹了太多恐怖故事——包括几家成为网络犯罪受害者后被迫关门的企业。以下是我在
    FBI 职业生涯期间调查的一些案件：


    '
