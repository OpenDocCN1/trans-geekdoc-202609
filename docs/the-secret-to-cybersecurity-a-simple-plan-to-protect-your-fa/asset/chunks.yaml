- raw: 'Today, almost every young child has access to a computer, game console, tablet,
    or smartphone that’s connected to the Internet. Being so connected has changed
    the way kids interact with the world. Most adults have a difficult time keeping
    up with their own personal cybersecurity, let alone ensuring their children are
    safe. That’s why, over the past several years, we’ve seen a dramatic increase
    in cyber-dangers targeting children, including cyberbullying, exposure to taboo
    material, online predators, and revealing too much personal information and inappropriate
    photos on social media. Plus, they have access to the dark web, where drugs, weapons,
    and anything else is available for sale to anyone who gains access.


    While investigating the disappearance of a juvenile in May 1993, special agents
    from the FBI’s Baltimore Division and police detectives from Prince George’s County,
    Maryland, identified two suspects who had sexually exploited several juveniles
    during a twenty-five-year period. Investigators determined that the adults were
    routinely using computers to transmit sexually explicit images to minors and,
    in some instances, luring kids into engaging in illicit sexual activity. Further
    investigations and discussions with experts, in both the FBI and private sector,
    revealed that computer telecommunications was rapidly becoming one of the most
    prevalent techniques used by sex offenders to not only share pornographic images
    of minors, but also to identify and recruit children into sexual relationships.
    In 1995, based on information developed during this investigation, the Innocent
    Images National Initiative (IINI) was created to address the illicit activities
    conducted by users of commercial and private online services and the Internet.


    A few months after reporting to the FBI’s field office in Syracuse, New York,
    I participated in my first IINI investigation in the fall of 1995. During the
    investigation in Baltimore, investigators examined the subjects’ computers and
    discovered they were trading images of child pornography with individuals across
    the country. The Baltimore investigation revealed that three hundred and fifty
    individuals were using the Internet to trade images and communicate, which was
    a shock to many people in law enforcement. One of the individuals identified during
    the investigation lived in the Syracuse area, and we had enough probable cause
    to obtain a warrant to search his residence. Our suspect was a medical professional
    with a wife and two teenaged children. When questioned, he denied ever looking
    at these types of images and communicating with other bad guys, but a forensic
    review of his computer told a completely different story—he had thousands of images
    of children stored on his computer. He later changed his story and admitted he
    did look at the photos, but only for a medical research project. He said he kept
    the project a secret from his office and wife. He eventually pleaded guilty to
    felony charges and helped us track down other criminals.


    Not too long ago, child pornography was difficult to obtain in the U.S. because
    the risks were too great. The U.S. Postal Inspection Service and FBI did a tremendous
    job of identifying suspects and apprehending them. These well-publicized sting
    operations greatly reduced the abhorrent activity—until the Internet came long.
    The illegal activities started on online bulletin boards and then moved into chat
    rooms on AOL and Internet Relay Chat, where these monsters found other like-minded
    predators with whom to communicate and trade. When the Internet really became
    popular during the 1990s, we started seeing a major increase in the number of
    online predators. For agents working these kinds of cases, it was like shooting
    fish in a barrel. I worked dozens of these cases while I was assigned to Syracuse.
    It was dark and dirty world, and I’m not going to go into detail about the images
    floating around the web. They would make you sick and give you nightmares.


    When I was transferred to Nashville, Tennessee, and promoted to supervisory special
    agent of the FBI’s cybercrime squad there, I gave my first presentation about
    online safety to a group of inner-city kids between the ages of eight and twelve.
    My real estate broker’s husband mentored many of the kids, and she asked if I
    would speak to them about cybersecurity. It was the first time I’d talked to a
    group of kids in quite a while, and I don’t think I realized how accessible computers
    were to them in 2007. When I walked into the room, I scanned the audience and
    thought most of them were probably too young to have access to the Internet. I
    figured I’d better come up with some entertaining stories about bank robberies
    and fugitives. But then I asked the kids how many of them had searched the Internet.
    About two-thirds of the audience raised its hand. Then I asked how many of them
    had MySpace accounts, which was the most popular social media at the time. Almost
    all of them raised their hands. I jokingly asked the kids how they had access
    to a MySpace account, because you were supposed to be thirteen or older. They
    laughed at me. Their answers to my next question surprised me. When I asked how
    many of them knew more about computers than their parents, about half of them
    raised their hands.


    After doing dozens of cybersecurity presentations to children over the past several
    years, I have become convinced that most parents are happy to have their children
    at home on computers instead of running around on the streets. As I gave more
    and more presentations to the community, I noticed a trend: Most kids believe
    they know more about computers and the Internet than their parents. And what’s
    even scarier is that most of their parents don’t even know what they’re doing
    on the Internet. In 2007, our advice to parents was to keep a computer in public
    places in the house so they could walk by and see what their kids were doing.
    Under no circumstances, we said, should a child be allowed to have unsupervised
    use of a computer in his or her bedroom. It was pretty good advice for a few years—until
    laptops became more affordable and game consoles and smartphones allowed kids
    to connect to the web from almost anywhere.


    From 2007 until 2011, I supervised the Innocent Images Task Force for the FBI’s
    Memphis Division, which included the area from Memphis to Nashville. We had three
    full-time FBI special agents and about a dozen full-time task-force officers assigned
    to the work. The task-force officers were personnel from state and local agencies
    who were deputized by the U.S. Marshals Service and had the same legal authority
    as the FBI to investigate federal cases. This program helped the FBI tremendously,
    as our mission to combat online child predators was only as good as our working
    relationship with other federal, state, and local law enforcement agencies. During
    the years in which I ran the task force, we had so many cases that we were only
    able to investigate the worst of the worst. One year, my team did an especially
    outstanding job and arrested and prosecuted nearly thirty child predators. The
    subjects came from all walks of life, including attorneys, pilots, social workers,
    police officers, doctors, truck drivers, and clergymen. A lot of these bad guys
    were trading illicit photos and some of them were hurting kids. As effective as
    we were that year, though, I remember when a former FBI director acknowledged
    how big the problem really was. He said we couldn’t have made a dent in the crisis
    with even eleven thousand special agents assigned to these types of crimes. But
    we didn’t have eleven thousand agents; in fact, we didn’t even have eleven.'
