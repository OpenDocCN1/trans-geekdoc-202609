  trans: '


    ![Image](img/lock.jpg) 时刻关注你的孩子在网上的活动，包括他们搜索的内容和访问的网站。必要时，请安装内容过滤器以确保额外安全。


    ![Image](img/lock.jpg) 要意识到互联网上并不缺少想要伤害他人的人。


    ![Image](img/lock.jpg) 确保你的孩子理解现实朋友与虚拟朋友之间的区别。


    ![Image](img/lock.jpg) 如果你的孩子有自己的社交媒体账号，他们的用户名绝不能是他们真实的姓氏和名。这些信息在 `Google` 和其他搜索引擎上太容易被找到了，会让网络捕食者轻易找到他们。


    ![Image](img/lock.jpg) 应该教育孩子切勿向互联网上的任何人提供他们的姓名、地址、出生日期或电话号码。


    ![Image](img/lock.jpg) 孩子们绝不能向在网上相识的陌生人发送自己的照片。


    ![Image](img/lock.jpg) 告诉你的孩子，他们在互联网上编写和发布的任何内容，包括推文、评论、照片和视频，可能都会永远留存在。


    ![Image](img/lock.jpg) 设定家规，并限制孩子在使用电脑和其他设备上的时间。谈论规则以及违反规则的后果。


    ![Image](img/lock.jpg) 教会你的孩子不要打开陌生人的邮件，不要回复伤害性或令人不安的消息，并且不要与在网上结识的任何人安排面对面。


    ![Image](img/lock.jpg) 确保你的孩子知道，当他们在网上看到任何问题或素材时，可以向你寻求帮助。


    ## 结语


    当我决定写这本书时，我的目的是记录我在与联邦调查局（FBI）合作期间抗击网络犯罪的故事，并分享我在那些调查中学到的所有知识，以防止普通人成为下一个受害者。看到人们的生活被毁掉、公司破产、老年人被诈骗，而这一切本可以是可以避免的，我无法用语言来形容那是多么令人沮丧。但预防并不是真的开发一种新技术来解决问题；我诚恳地相信它源于教育和意识。


    我觉得书中还有很多其他可以写的主题，我担心有人会说：“嘿，你没谈到如何正确设置我的家庭网络”、“我该如何处理我的路由器？”或者“我应该购买什么样的安全设备来保护我的信息？”
    请理解，这本书并不是为了教你如何保护你的电脑；我的目标更多是教你如何避免成为下一个受害者。


    网络犯罪的未来将通向何方？这是一个可怕的问题。2018 年，全球约有八千七百万在使用 `Facebook`，其中许多人向陌生人分享了过个人信息。社交媒体最大的问题之一就是隐私，所以问问自己
    `Facebook` 正在做什么来保护我们。2018 年 7 月，`Facebook` 受到英国法律允许的最高罚款，原因是未能保护其用户数据，且未通知数百万用户政治数据公司
    `Cambridge Analytica` 收集了他们的信息用于政治活动。当然，`Facebook` 已经因为允许一个与克里姆林宫有联系的俄罗斯行动在其平台上购买数千条广告，以影响
    2016 年美国总统选举而面临严厉的审查。


    在我的网络犯罪讲座中，我总是问人们：“有多少人对 `Facebook` 发生的事情感到愤怒？”观众中很多人举起了手，但随后我提醒他们，他们是自愿将最私私的信息——姓名、出生日期、家乡和家庭照片——给了这个社交媒体平台。我们甚至会分享照片和视频，并在我们不在家、度假或出国旅行时告知陌生人。我们必须采取更好的措施来保护我们的隐私，所以问问自己你是否在社交媒体上分享了过多的个人信息。


    现在，几乎我们每一个人都拥有一部智能手机并且触手即可访问互联网。在大多数情况下，并不是我们的智能手机不安全且容易受到网络犯罪者的攻击；而是我们下载到手机和其他设备上的数百万个应用程序。下载到设备上的程序时要小心。在你的手机和平板电脑上，确保你只从
    Apple App Store 和 Google Play Store 下载并安装合法的应用程序。


    我们在书中没有涵盖的另一个重要主题是所谓的“物联网”（`IOT`），它由我们使用的所有连接到互联网的设备组成。我们正在家里摆满了恒温器、车库门开启器、冰箱、灯泡和直接连接网络的安全摄像头！你可以走在
    `Best Buy` 的过道上，看到数百为了让我们的生活更简单更方便而引入的设备，但与此同时，这些许多设备都有默认且不安全的密码。我们可以通过手机上的应用控制许多设备。如果你在家庭安全系统使用的用户名和密码与你的
    `Yahoo!` 邮箱一样，会发生什么？如果 `Yahoo!` 再次发生数据泄露，坏人就能访问你家里的安全摄像头。想象一下他们从数千英里之外看到什么！记住，我们需要对这些设备也使用不同的密码和双重身份验证。


    那么下一代所谓的智能助手呢？我最近看了一个视频，显示 `Google Assistant` 打电话给餐厅并预订晚餐——完全没有人类协助。计算机自己拨通了号码，问候了接电话的人，并与中餐厅的领位进行了复杂的交谈讨论。它能够回答问题、改变方向、填补空白，甚至使用诸如“嗯”和“啊，好的”这样的人类触发词，来掩盖它实际上是一台机器的事实。我们已经在使用
    `Google Assistant` 和 Apple 的 `Siri` 来打电话、查询体育比分并为我们提供路线或餐厅推荐了。但如果有一天，虚拟助手被用来打给我们，而我们相信那头的类人声音其实是我们的医生、律师或银行家，那就太可怕了。我担心公司为了节省资金和降低开销会跳进这项技术，而不完全理解涉及的风险。坏人发现成百万种利用这项技术或其他新技术来非法获取我们个人信息的方法，只是时间问题。


