- raw: 'After the first traumatic experience, victims of real estate BEC scams usually
    don’t fall for them again—but it should never have happened in the first place.
    When an email account is compromised, the bad guys read all the emails and it
    doesn’t take them long to figure out how a business operates. In one of the cases
    I investigated, the victim was a title insurance company. Title insurance protects
    buyers and mortgage lenders against defects or fraud with a title when a property
    is sold or transferred; a title company researches records to ensure that there
    are no undisclosed heirs to the property, unpaid taxes, pending legal action,
    errors, or fraud associated with the title. This particular company outsourced
    most of its information technology infrastructure to a capable IT provider, which
    clearly understood information security. They had an excellent firewall established
    for the company and also installed an effective enterprise-level information security
    suite. The title company was better protected than most small companies.


    Unfortunately, the bad guys were able to obtain the username and password for
    a real estate agent, whom we’ll call Amanda. She was representing clients who
    were in the process of selling a home. Amanda had a Gmail account with an email
    address of Amanda1935@gmail.com (only an example) and did not have two-factor
    authentication turned on. How did the bad guys gain access to her Gmail account?
    She might have clicked on a link she shouldn’t have clicked on, which would have
    allowed the cybercriminals’ malware to install a keylogger on her computer and
    steal her password. Or maybe there was an unreported data breach at a large supermarket,
    gas station, department store, or pharmacy, and Amanda’s username and password
    were among the ones stolen. Then the bad guys probably could have counted on Amanda
    being among the 60–70 percent of the U.S. population that uses the same password
    for every online platform. This scenario probably sounds familiar to you by now,
    because it’s the genesis for almost every cybercrime. Armed with Amanda’s username
    and password, the cybercriminals could have easily logged into her Gmail account.
    If she had only installed two-factor authentication on her Gmail, the crooks wouldn’t
    have been able to break into it.


    While reading Amanda’s emails, the bad guys discovered that she represented a
    couple that was getting ready to close a real estate transaction, and that Amanda
    was communicating with a woman we’ll call Beverly at a title company. The cybercriminals
    learned the closing date was only a couple of days away. So, the bad guys registered
    an email account at a free email provider in the name of Amanda1935@mail.com,
    and they were ready for business. They broke back into Amanda’s Gmail account
    and set up a simple forwarding rule. Any email that the title company sent to
    Amanda’s Gmail account would be forwarded to them. Then the criminals sent an
    email to Beverly from their spoof email account. The subject line said, “Change
    of Plans,” and the message read, “Hi, Beverly, hope all is well. My clients just
    called and they want the proceeds of the sale to be wired to a different bank
    account. I hope this isn’t too much of a pain in the butt. Please tell me what
    I need to do. Have a blessed day.” Since the bad guys had access to Amanda’s emails,
    they were able to write the email as if it came from her, using the same language,
    structure, and closing phrase.


    Beverly quickly responded to the email, “This happens all the time, Amanda. Just
    send me the new bank account information.” Once Beverly received an email from
    the fake Amanda1935@mail.com address with the new bank information, she replaced
    the sellers’ account with the one controlled by the cybercriminals.


    The closing went off without a hitch at the attorney’s office, but then, a few
    days later, the sellers complained that they still had not received $250,000 from
    the sale. The title company discovered that the money had been sent to a bank
    in Texas, and that’s when the finger-pointing started. By the time I was called
    in to help about ten days later, the money was long gone. I contacted the bank
    and my contact there provided me with the account history and a fake West African
    passport, which the thief had used to open the account. He’d even gone to the
    Texas Secretary of State’s website and registered a business in one of the seller’s
    name, and the state provided him with a legitimate tax ID number. Then the bad
    guy, armed with the fake passport and real tax ID number, went to the bank and
    opened an account. As soon as the stolen money was wired to the account, he cashed
    it out in ten cashier’s checks ranging from $18,000 to $25,000. Each of the cashier’s
    checks was written to someone different; the names matched the ones on the criminal’s
    fake passports. Once those checks were cashed, most of the money was sent to Nigeria.
    Our law enforcement partners were essentially chasing ghosts, and the money was
    already overseas.


    The title company discovered it was legally obligated to pay the sellers their
    stolen money. It could have gone after Amanda, but she was only a part-time agent
    and didn’t have much money. She lost her commission on the sale, though, and her
    reputation as a dependable real estate agent was damaged forever. Beverly was
    fired for her mistake, even though she was only following the procedures that
    were in place at her employer. Someone always gets fired in these cases, remember?


    Going back to the important points I made earlier:


    1. Once your money is stolen, it is hard to recover.


    2. The FBI’s chances of identifying the cybercriminals and putting them in jail
    are surprisingly low.


    3. This type of crime could be prevented about 90 percent of the time.


    How could this crime have been stopped? If Amanda had installed two-factor authentication
    on her Google account, the interlopers would have never gained access to it. But
    Amanda shouldn’t get all the blame, either. If the title company had implemented
    one simple policy, the entire mess might have been avoided. It should have had
    this rule in place: any changes to the distribution of proceeds from sale must
    be accompanied by a follow-up telephone call for verification. But even that policy
    could probably use a little more tweaking. What if Beverly had sent an email to
    Amanda1935@mail.com and said, “You know the policy; you need to call me.” Then
    the bad guys might have called pretending to be Amanda with a cold, or they could
    have sent an email saying, “I can’t get to the phone, but my assistant will call
    you in a few minutes.” Or, even better, Beverly could have forwarded the “Change
    of Plans” email to Amanda at the address she knew to be correct instead of replying
    to the new mission-critical (and spoofed) message. It’s up to the title company
    to develop an airtight policy to prevent millions of dollars from being stolen.
    If it doesn’t make necessary changes, it might continue to be victimized.


    It’s so important that proper policies are in place and that they are shared with
    all third parties. A five-alarm siren needs to sound anytime someone wants to
    change bank account information. Everyone in the company needs to be suspicious
    of such changes and follow up with foolproof verification that doesn’t involve
    email or text. There was a time when people had to appear in person at real estate
    closings, but technology has spoiled us and we’re too accustomed to a streamlined
    business process. But it’s our insistence on being fast and efficient that has
    gotten us into all of this trouble. The criminals are winning. They’ve stolen
    billions and billions of dollars—and that’s only what’s been reported.'
