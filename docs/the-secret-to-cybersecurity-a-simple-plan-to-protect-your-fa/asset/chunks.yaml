  trans: '

    令人不安的迹象表明，黑客正日益针对非营利组织和小微企业，因为这些机构不太具备复杂的安全措施。数据泄露对非营利组织可能是极具破坏性的，因为会导致时间浪费、诉讼、罚款和处罚，以及公众信任的丧失，这会对捐赠贡献产生负面影响。教会也是如此。某个宗教机构的领导人甚至告诉我，`上帝`就是他们的防火墙，没有人会针对教会。再次，事实并非如此。教会和非营利组织拥有可以通过互联网访问的银行账户，我目睹过他们无数次受害。


    面对日益增长的网络犯罪之危险，非营利组织和宗教机构并非唯一表现天真的群体。我曾与 `NASDAQ` 交易所上市公司的高管交流过，他们告诉我并不担心网络安全；他们说坏人只针对纽约证券交易所（`NYSE`）上市的公司！最近，一家
    `NYSE` 上市公司的一位高管告诉我，他不担心，因为他所属机构年收入不到 50 亿美元，而网络窃盗只针对收入超过 300 亿美元的公司！当然，这并非事实，这种态度是网络犯罪问题的重要组成部分。


    我们所有人，无论是在年收入数十亿美元的上市公司工作，还是在苦苦维持经营的小型非营利组织工作，都拥有网络犯罪分子想要的信息。当窃偷获取了我们银行账户的 `username`
    和 `password` 时，他极有可能会抽空我们的资金。如果他访问了我们的电脑文件并发现了敏感信息（例如我们的纳税申报），他将利用这些信息以我们的名义开设信用卡或贷款账户，使我们成为身份盗窃的受害者。如果他访问了我们的电子邮件和社交媒体账户，他会将学到的关于我们的信息作为武器，去获取更多受害者。


    在我的一次网络安全讲座期间，一位女性打断了我，说她完全不需要担心。她不进行网上银行业务，只使用银行的网站查看账户余额。当我问她访问余额是否需要 `username`
    和 `password` 时，她确认了确实需要。我让她登录账户并打开自动账单支付工具，她可以在那里输入 `account` 和路由号（routing number）进行付款。她告诉我她不使用账单支付功能，并用一种特别傲慢的语气说：“我只查看我的银行余额。”但随后我问她，如果坏人获取了她的银行账户、`username`
    和 `password`，然后输入这些被盗信息并给自己汇款会怎样？此时，她终于意识到自己到底有多脆弱——美国大多数人也是如此。


    在我的网络安全防护讲座上，我总是让人们识别他们存储在电脑上最重要的数据。如果你是一个作家，那可能是一份未完成的手手稿。如果你是一个学生，那可能是一个论文或作业。如果你是一家小微企业，那是人力资源材料或银行记录。如果一个网络犯罪分子入侵了你的电脑，哪一样东西是你最不想让他偷走的？我从听众那里得到了各种答案，然后我喜欢开玩笑说：“有人提到了裸照吗？”无论什么信息对你来说是重要的，对窃偷来说都是重要的。这使得我们每一个人都成了目标。


    ## 2. 第二个真相：你可能无法拿回你的钱。


    这可能是人们最难理解的概念：当网络犯罪分子进入你的银行账户并偷走所有资金时，执法部门追回资金的机会微乎其微，甚至几乎为零。我不想这么说，但这是事实。别误会我；我确实有几个成功案例，从受损的商务邮件诈骗中追回了离开美国的资金。如果有一个追回流向海外资金的
    `FBI` 探员名人堂，我的名字可能就在挂在墙上的牌子上。但冷酷的现实是，我的胜率可能低于 .100，这并不能让我进入纽约州库珀斯顿的棒球名人堂。


    最近我在一次会议上发言，并告诉大家执法部门从外国网络犯罪分子那里追回资金是多么困难。一位退休的 `FBI` 高管在同一会议上发言，他批评我告诉听众执法部门（特别是
    `FBI`）可能无法拿回他们的财产。我对他微笑说：“真相总是痛苦的，不是吗？”他看起来很震惊。


    不幸的是，在很多情况下这绝对是事实。网络安全公司 `Kaspersky Lab` 2017 年的一项研究显示，52% 的受访者表示，他们在计算机犯罪中被盗的资金没有追回，或仅追回了部分。研究发现，互联网用户平均每次攻击损失
    476 美元，十个人中就有一人报告损失超过 5000 美元。更令人惊讶的是，81% 的受访者报告进行过在线财务交易，44% 承认在连接的设备上存储了财务数据。然而，只有
    60% 的互联网用户报告使用网络安全软件保护所有设备。你还不如直接把你的 `usernames` 和 `passwords` 发邮件给网络犯罪分子呢！


    ## 3. 第三个真相：坏人可能不会被捕。


    网络犯罪最令人沮丧的部分之一是它如此普遍，但逮捕人数却如此寥寥。大问题在于计算机犯罪分子并不总在美国。在很多情况下，感染你的电脑以窃取个人信息的网络犯罪分子可能位于东欧、西非、亚洲、南美或中东。


    根据网络安全公司 `Symantec` 的数据，2017 年恶意软件、垃圾邮件和钓鱼来源最大的国家是 `U.S.`（23.96%）、`China`（9.63%）、`Brazil`（5.84%）、`India`（5.11%）、`Germany`（3.35%）、`Russia`（3.07%）、`United
    Kingdom`（2.61%）、`France`（2.35%）、`Japan`（2.25%）和 `Vietnam`（2.16%）。虽然 `FBI` 和其他执法机构识别和逮捕本土黑客的机会显然更大，但对他们来说，定位并捕获海外海外的计算机犯罪分子要困难得多。许多网络犯罪分子居住在
    `China` 和 `Russia` 等国家是有特定原因的——那些政府对美国并不友好，不太可能在调查中合作，或引渡其公民就其犯罪行为接受惩罚。当我开始在 `FBI`
    工作时，打击犯罪是一个局部问题；现在，它是一个国际性问题。

    '
