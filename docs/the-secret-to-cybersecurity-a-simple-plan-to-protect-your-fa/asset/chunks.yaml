- raw: 'The FBI’s investigation led to the arrest of two Nigerians posing as South
    African diplomats who traveled to the U.S. to collect money from her on Charlie’s
    behalf. According to the FBI, Charlie claimed he was being paid $42 million for
    a construction project in South Africa, and she believed she was paying to have
    the money, including her $2 million, transferred to a bank in the U.S. In July
    2016, the two Nigerian co-conspirators pleaded guilty for their roles in the scam,
    and a federal judge sentenced them each to thirty-six months in prison. Charlie
    is still on the loose, presumably in Nigeria, and might never be apprehended.
    The woman who was victimized told the FBI, “I not only invested money in this
    man, but there is a big, huge piece of my heart that I invested in him. It’s not
    just the finances, it’s the emotional part, too—being embarrassed, being ashamed,
    being humiliated.” She continued, “I can’t even imagine a man, a person, that
    could be this bad. I can’t think of him that way. . . . There can’t be a man in
    this world that could be this horrible to have purposefully done what he’s done
    to me.”


    Unfortunately, there are thousands of men exactly like Charlie victimizing people
    around the world. But if you think women are the only victims of romance scams,
    think again. In 2017, Action Fraud, the cybercrime reporting center controlled
    by the City of London Police, reported that 39 percent of the romance-scam victims
    in that country were men. I’ve seen plenty of men fall victim to this scheme,
    and the details of the exchanges are fairly similar every time. The woman is generally
    much younger than her target and there always seems to be a lot of pillow talk
    and an exchange of intimate photographs. Many of these women claim to be from
    Eastern Europe, and they say they’re looking for someone to marry and are willing
    to relocate to the U.S. That’s when they start bleeding cash from the victims.
    They’ll start by asking for a nice present. Before long, the victims are paying
    the woman’s rent, sending her money for a plane ticket, and wiring her $10,000
    for legal fees because she was arrested while trying to leave her native country.


    Finding true love is difficult enough, and no one wants to be alone. That’s what
    makes this type of cybercrime so emotionally painful for victims—and so profitable
    for criminals. The most important thing to remember about these types of schemes
    is that there is no typical victim. Targets can be male or female, young or old,
    straight or gay. The common denominator is that they’re lonely and seeking a romantic
    relationship, and the bad guys are more than willing to take advantage of them.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Research the person’s photo and profile using online
    searches. If it’s a scam, the same profile has probably been used before.


    ![Image](images/lock.jpg) Go slowly and ask a lot of questions. You should also
    keep a journal and be prepared to identify inconsistencies.


    ![Image](images/lock.jpg) Beware if an individual seems too perfect or knows too
    much about you.


    ![Image](images/lock.jpg) Beware if an individual is attempting to isolate you
    from family and friends.


    ![Image](images/lock.jpg) Beware if someone requests inappropriate photographs
    or financial information that could later be used to extort you.


    ![Image](images/lock.jpg) If an individual promises to meet you in person but
    always comes up with an excuse why he or she can’t, it’s probably a scam. If you
    haven’t met that person after a few months, for whatever reason, you have good
    reason to be suspicious.


    ![Image](images/lock.jpg) If you agree to meet a prospective partner in person,
    make sure to tell family and friends who you’re meeting and where you’re going.


    ![Image](images/lock.jpg) Never send money to someone you don’t know personally.
    If you haven’t met them in person, don’t send them money.


    ![Image](images/lock.jpg) Be cautious of people who portray themselves as military
    personnel, aid workers, and overseas workers. U.S. military officials say they
    receive thousands of complaints every year from scam victims around the world.
    Officials note military members will never need money for leave or healthcare,
    which are common requests made by cybercriminals.


    ![Image](images/lock.jpg) Be alert to spelling and grammar mistakes, inconsistencies
    in their stories, and other signs that it’s a scam.


    ![Image](images/lock.jpg) Be careful about how much personal information you share
    on social media. Scammers use this type of information to create fake identities
    or target you in a scheme.


    ![Image](images/chap.jpg)


    ## CHAPTER 15:


    ## Ramsomware


    LET’S SAY YOU COME HOME from work one day and log on to your computer, but you
    can’t open any of your files. No matter what you do or how hard you try, you simply
    can’t retrieve them. Regrettably, you realize that you’ve never backed up your
    important information, such as photographs, documents, music, videos, and contacts,
    and now it might be gone forever. Or maybe you did try to back it up recently
    but, for whatever reason, it didn’t work. What if you’d been writing a thesis
    paper for months to complete your graduate degree? What if you were an author
    who had already written 80 percent of your next novel? What if you were a bookkeeper?
    A lawyer? A doctor? How much would you be willing to pay to get your clients’
    files back, instead of losing them forever? Would you pay $200? Or maybe $500?
    Or even $1,000? What if you found yourself in this quandary and were suddenly
    presented with a solution and opportunity to get all of your stuff back? It sounds
    like a great business decision—especially for the bad guys who are holding your
    information hostage.


    Encryption has been a wonderful thing in the digital world. It was designed to
    keep our computers safe, so, as long as your information was encrypted, any would-be
    thieves who found your laptop (or stole it) wouldn’t be able to gain access. Unless
    your password is extremely weak, such as jordan2005 or password123, a bad guy
    would probably have a difficult time accessing your files. As a result, cybercriminals
    figured out a way to subvert the value of encryption and use it against you to
    make money. Hackers created what we now call ransomware; you may have heard of
    some recent examples, such as the Cryptolocker virus, CryptoWall, Locky, Cerber,
    KeyRanger, SamSam, TeslaCrypt, TorrentLocker, and Reveton. Ransomware is a type
    of malware that targets both human and technical weaknesses in an effort to block
    users from accessing important data and/or systems—until the victim pays a ransom
    in exchange for a decryption key that unlocks the captive files and/or system.


    Here’s how ransomware works: You log in to your computer and can’t access any
    of the information. After you figure out that you can’t remove a nasty virus to
    open your files, you’ll find a note in your system that says something like, “Hi,
    my name is Boris Badenov. If you don’t pay me $500 in bitcoin in the next twenty-four
    hours, you’ll never get your information back.” You, like most people, may not
    even know that bitcoin is untraceable virtual electronic currency. Because Boris
    is so nice, he has presented you with a low-cost solution that will allow you
    to retrieve your files. It’s like he’s giving you a magic wand to make the nightmare
    go away, right?'
