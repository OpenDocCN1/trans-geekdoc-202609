  trans: '

    情况从这里开始变得非常糟糕。假设在三十亿 Yahoo! 用户中，有十亿人拥有 iPhone、`iPad` 或 `iMac` 桌面电脑。这占了用户的 33%；一些分析师估计这一比例可能接近
    50% 甚至更高。为了论证起见，我们假设只有 1% 的 Yahoo! 受害者拥有某种苹果设备。三十亿人的 1% 仍然有三千万名用户。很有可能，许多 Yahoo!
    受害者为他们的 `iCloud` 账户使用了相同的用户名和密码。如果网络犯罪分子获取了你的 `iCloud` 账户，他能造成什么样的破坏？他可以通过更改用户名和密码并将你锁定在账户之外来大肆破坏。他可以绑持你的账户，并索要数千美元以释放它。许多人使用云账户备份生活的私密细节，因此现在坏人可以访问所有内容——照片、电子邮件、电影、音乐、文档、日历等更多内容。


    你可能听说过 2014 年 9 月针对 Apple 用户名、密码和安全问题的定向攻击。黑客泄了多位名人的私密照片，包括演员 `Jennifer Lawrence`
    和模特 `Kate Upton`。照片被向全世界公开，但这些名人并没有可以起诉的对象，因为犯罪是由匿名黑客犯下的。在试图阻止照片泄露时，他们无能为力。


    虽然 Apple 黑客攻击事件中的某些名人显然感到无颜自地，并可能被迫与父母进行不快的交谈，但那些没那么出名的 Yahoo! 受害者遭受了更大的经济损失。网络犯罪分子编写了脚本——简单的自动化程序——可以将
    Yahoo! 用户名和密码与成千上万个热门网站（如银行、社交媒体、电子商务等）进行对比。如果你在 Yahoo! 账户使用的用户名和密码与 `iCloud`
    账户相同，那么很有可能你在 `Amazon`、`eBay`、美国运通（American Express）和银行账户也使用了相同的登录凭据。小偷们会仔细检查你的电子邮件，以确定你在哪里进行业务，并尝试访问所有这些账户。他们的自动化程序允许他们无需手动输入用户名和密码即可获得访问权限。即使成功率仅为
    1%，当你考虑到三十亿 Yahoo! 账户的信息时，这仍然是一门暴利的生意。


    在 2017 年于拉斯维加斯举行的 Black Hat USA 大会议的一次演讲中，Facebook 首席安全官 `Alex Stamos` 向观众解释了为什么重用密码是最大的网络危险之一。Stamos
    告诉大家：“绝大多数伤害源于那些难以解决的简单问题，例如泛滥的密码重用。当人们对银行、社交媒体、电子邮件和博彩网站使用同一个密码时，博彩网站可能会被攻入，然后这些凭据就会在黑市上售卖。现在，数十名攻击者将争夺成为第一个接管该人数字身份的人。”


    我再怎么强调都不为为任务关键账户设置独立且强密码有多重要。任务关键账户包括电子邮件、社交媒体、手机、银行和电子商务。想想任何你不希望让犯罪分子访问的东西，这甚至包括报警系统、车库门打开器和安全摄像头。我永远不会忘记在为联邦调查局（FBI）工作期间调查过的一个网络犯罪案件。该案件涉及一位名为
    `Ellen` 的女性，她是四个孩子的母亲，也是一位在社交媒体上拥有海量粉丝的成功企业家。不幸的是，Ellen 在网络安全方面和大多数人一样。她使用简单的密码，并在大多数在线账户中重用它们。一个中亚的坏分子获取了
    `Ellen` 的 `Facebook` 账户，因为她的密码是其中一个孩子的名字与其出生年的组合。他可能在几分钟内就在她公开的 Facebook 页面上找到了这些信息。


    一旦网络犯罪分子获取了 `Ellen` 的 Facebook 账户，他就发现她使用一个 `iCloud` 电子邮件账户。他没花多久就发现她 `iCloud`
    电子邮件的登录凭据与她在 Facebook 上使用的一样。于是，他登录了她的电子邮件账户并阅读了邮件。他做的第一件事就是登录 `Apple Store`，订了十台新的
    `iPad minis`，并让它们寄到中亚。对他来说的是，Ellen 在她的 `Apple` 账户中保存了信用卡信息。通过检查 `Ellen` 的电子邮件，这个骗子能够识别出大约十个不同的任务关键账户。他更改了每个账户的用户名和密码，并将她锁在自己的账户之外。然后他给
    `Ellen` 发送了一封勒索邮件，要求她给他钱以重新获得访问权限。当 Ellen 收到邮件时，她非常愤怒，并回回了一封刻薄的回信。他通过删除 `Ellen`
    `iCloud` 账户中的内容作为回应，其中包含了珍贵的家庭照片和多份她未完成的工作文件。之后，他开始针对 `Ellen` 的几位朋友和粉丝，同样破坏了他们的生活。Ellen
    花了几周时间才恢复对账户的控制。这感觉就像那个坏人总是比她快一步。他甚至在 `Ellen` 的电子邮件账户中设置了一个转发规则，允许他收到发送给她的每封邮件的副本。每当
    Ellen 收到带有临时密码的电子邮件时，他就会拦截那封邮件。我已经在几十种情况下看到过这种技术，而且非常很难停止。


    通过我们的刑事调查，我们找到了导致 `Ellen` 噩梦的始后者。我们发现是一个来自中亚的二十一岁男子，他是一个人行动。他还获取了属于 `Ellen` 大约六个朋友和粉丝的电子邮件账户，也给他们造成了许多麻烦。


    幸运的是，FBI 探员被派到海外帮助保护美国公民。他们与全球各政府、执法部门、情报机构和安全部门建立关系，促进信息的及时和持续交换。世界各地主要城市有六十四个法律联络处（通常称为
    `legats`）以及十多个分办事处，覆盖了两百多个国家、领土和岛屿。每个办事都是通过与东道国的协议建立的，并位于该国的美国大使馆或领事馆。


    一旦我们确定了 `Ellen` 案件中的网络犯罪分子，我就与位于该小偷居住的中亚国家的 FBI 同事取得了联系。不幸的是，那里的东道国政府与美国没有正式条约。因此，即使我们对受害
    Ellen 的男子提出刑事指控，我们也无法将其引渡回美国。然而，该男子可以在他的母国对其犯罪进行起诉。我的同事请我将案件事实和我们掌握的信息发给他，以便东道国政府进行自己的调查。几周后，ISIS
    袭击了他们的国家，起诉一个攻击美国公民的二十一岁男子不再是首要任务。Ellen 再也无法恢复那些被删除的数据，我们也没能把那个男子关进监狱。如果她没有在多个在线平台使用相同的用户名和密码，整个局面本是可以避免的。


    '
