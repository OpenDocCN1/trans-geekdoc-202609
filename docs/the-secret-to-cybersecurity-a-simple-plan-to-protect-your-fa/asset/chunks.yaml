- raw: '![Image](images/lock.jpg) Always be aware of what your children are doing
    online, including what they’re searching for and which websites they’re visiting.
    Install content filters if necessary to be extra safe.


    ![Image](images/lock.jpg) Realize that there is no shortage of people on the Internet
    who are looking to harm children.


    ![Image](images/lock.jpg) Make sure your children understand the difference between
    real friends and virtual friends.


    ![Image](images/lock.jpg) If your children have their own social media accounts,
    their usernames should never be their actual first and last names. That information
    is too easy to find on Google and other search engines, making it easy for online
    predators to find them.


    ![Image](images/lock.jpg) Children should be educated about never providing their
    name, address, date of birth, or telephone numbers to anyone on the Internet.


    ![Image](images/lock.jpg) Children should never send photographs of themselves
    to strangers they meet online.


    ![Image](images/lock.jpg) Teach your children that anything they write and post
    on the Internet, including tweets, comments, photographs, and videos, is probably
    going to stay online forever.


    ![Image](images/lock.jpg) Set house rules and limit your children’s time on computers
    and other devices. Talk about rules and the consequences of breaking them.


    ![Image](images/lock.jpg) Teach your children not to open email from strangers,
    not to respond to hurtful or disturbing messages, and not to arrange face-to-face
    meetings with anyone they meet online.


    ![Image](images/lock.jpg) Make sure your children know they can come to you about
    questions and concerns about material they see on the Internet.


    ## AFTERWORD


    WHEN I DECIDED TO WRITE this book, my purpose was to record my stories of fighting
    cybercrime while working with the Federal Bureau of Investigation and to share
    everything I learned during those investigations to prevent the average person
    from becoming the next victim. I can’t say enough how upsetting it was to see
    people’s lives being ruined, companies going out of business, senior citizens
    being ripped off, and our children being hurt when it all could have been prevented.
    But prevention isn’t really going out and developing a new technology to solve
    the problems. I honestly believe it comes through good, old-fashioned education
    and awareness.


    I feel like there are so many other subjects that I could have written about in
    this book, and I worry that someone will say, “Hey, you didn’t talk about the
    correct way to set up my home network,” or, “What I should do with my router?”
    or, “What kind of security suite should I purchase to protect my information?”
    There is so much information out there about those subjects and so many varying
    opinions. Understand that this book wasn’t written to teach you how to secure
    your computer and network; my goal was more about teaching you how to avoid becoming
    the next cybercrime victim.


    Where is the future of cybercrime headed? That’s a scary question. In 2018, there
    were about eighty-seven million people around the world using Facebook, and many
    of them were sharing too much of their personal information with strangers. One
    of the biggest issues with social media is privacy, so ask yourself what Facebook
    is doing to protect us. In July 2018, Facebook was hit with the maximum financial
    penalty allowed under British law for failing to safeguard its user data and for
    not informing tens of millions of its users that the political data firm Cambridge
    Analytica harvested their information for use in political campaigns. And, of
    course, Facebook was already facing intense scrutiny for allowing a Russian operation
    with ties to the Kremlin to purchase thousands of advertisements on its platform
    to influence the 2016 U.S. presidential election.


    I always ask people in my cybercrime presentations, “How many people are upset
    about what happened with Facebook?” A lot of people in the audience raise their
    hands, but then I remind them that they willingly gave their most personal information—their
    name, date of birth, hometown, and family photos—to this social media platform.
    We’ll even share photos and videos, and we’ll inform strangers when we’re not
    home or on vacation and traveling out of the country. We have to take better steps
    to safeguard our privacy, so ask yourself if you’re sharing too much personal
    information on social media.


    Right now, nearly every one of us owns a smartphone and has access to the Internet
    at our fingertips. In most instances, it’s not our smartphones that are insecure
    and vulnerable to cybercriminals; it’s the millions of apps we’re downloading
    onto our phones and other devices. Be careful with the apps you’re downloading
    to your machines. On your phone and tablet, make sure you’re downloading and installing
    legitimate apps only from Apple’s App Store and the Google Play Store.


    Another important topic we didn’t cover in this book is what’s called the Internet
    of things (IOT), which is made up of all the devices we’re using that connect
    to the Internet. We’re filling our homes with thermostats, garage-door openers,
    refrigerators, light bulbs, and security cameras that have a direct line to the
    web! You can walk down the aisles at Best Buy and see hundreds of devices that
    were introduced to make our lives easier and more convenient, but, at the same
    time, a lot of these devices have default and insecure passwords. We can control
    many of them through apps on our phones. What happens if you’re using the same
    username and password for your home security system that you are for your Yahoo!
    email? If Yahoo! has another data breach, the bad guys are going to be able to
    gain access to the security cameras inside your house. Imagine what they’ll be
    able to watch from thousands of miles away! Remember that we need to use different
    passwords and two-factor authentication with these devices, as well.


    What about the next generation of so-called smart assistants? I recently watched
    a video showing the Google Assistant calling a restaurant and making a reservation
    for dinner—all without any human assistance. The computer, all by itself, dialed
    the number, greeted the person who answered, and engaged in a complex back-and-forth
    discussion with the hostess at a Chinese restaurant. It was able to answer questions,
    change direction, fill silence, and even use human triggers like “hmm” and “ah,
    okay” to disguise the fact that it was, in fact, a machine. We’re already using
    Google Assistant and Apple’s Siri to dial the phone, pull up sports scores, and
    provide us with directions or restaurant recommendations. But it’s scary to think
    that one day, virtual assistants will be used to call us, and we’ll believe the
    human-like voice on the other end is actually our doctor, lawyer, or banker. I
    fear that companies are going to jump into this technology to save money and reduce
    their overhead without completely understanding the risks involved. It’s only
    a matter of time before the bad guys figure out a million ways to use this and
    other new technologies to illicitly gain access to our personal information.'
