  trans: '


    我在 FBI 工作期间经常遇到的第二类居家办公诈骗，，其目标群体是大学生、全职妈妈和老年人。这些受害者通常会收到一封邮件，被招募为一家不存在公司的应收账款员。这些虚假职位要求收件人提供银行账户和路由号码（routing
    number），以便接收来自所谓公司的未付账单。一旦资金转入账户，该个人就会被指示将约 90% 的资金汇入另一个银行账户，或通过西联汇（Western Union）发送给坏人。个人将获得
    10% 的资金作为佣金，这看起来像是一份好工作——至少在执法部门敲门之前是这样。


    被盗资金从哪里来？


    在很多情况下，这些钱是从没有使用双重身份验证的合法公司偷取的。如果小偷盗了用户名和密码，他就可以进入薪资软件包并更改银行账户和路由信息。公司最终没有给员工发工资，而是付给了海外的网络犯罪分子。对于犯罪分子来说，还有什么办法比利用一群毫无防备的大学生和全职妈妈更得当呢？等当公司发现员工没有收到工资并联系银行时，已经太晚无法收回钱了。


    在另一种诈骗中，网络犯罪分子向“钱骡”（mules）发送虚假支票，并要求他们存入账户。在提取一定比例的资金后，钱骡会将剩余资金转入犯罪分子的账户。几天后，钱骡会发现支票是假的，他们实际上是将自己的钱寄给了骗子。


    另一种涉及钱骡的在线诈骗是“转运计划”（reshipper scheme），这涉及将非法获得的商品（如电脑、电视和其他贵物品）运往海外的网络犯罪分子。坏人通过
    `Craigslist`、`Monster.com` 以及其他本地留言板招募钱骡。然后他们引导这些“新员工”访问一个看起来像正规货运公司的网站。受害者会被要求下载一份雇佣协议、阅读并签署它。此时，应募者认为自己正在申请一份真正的居家工作。雇佣协议要求应募者的出生日期、社会安全号码（Social
    Security number）以及银行账户和路由号码。钱骡被告知将收到包裹，他们的工作是开箱并检查物品。然后他们要把这些包裹转寄到公司提供的地址，这些地址通常位于西非和东欧。几天后，用被盗信用卡号购买的电脑和电视开始出现在钱骡的家中。由于大多数公司对贵重货物运往国外会产生怀疑，钱骡充当了中间人以防止引起警报。在我调查的某些案件中，钱骡获得的是假支票的报酬；其中有些人被多给了钱，甚至在意识到工资支票是假之前还用自己的钱退回了多付的部分。简而言之，受害者在这些诈骗中损失了大量资金，随后执法部门联系了他们，因为价值数千美元的被盗货物被寄到了他们家中。


    `Monster.com`、`Craigslist` 以及其他在线招聘列表让人们更容易找到居家工作，以补充收入，或者在上学或照顾亲人的期间兼职。遗憾的是，同样的技术也让网络诈骗分子更容易创建虚假职位来利用他们。对于你来说，作为求职者，在寻找在线工作时保持常识和警惕至关重要。在申请工作之前，仔细阅读职位描述并研究公司。最重要的是，记住这一点：如果一件事听起来好得不可真实，那么它可能就是诈骗。


    # 如何避免成为受害者


    - 遵循一个简单的规则：如果一份工作听起来好得不可真实，它很可能真的是。

    - 避免包含转运、应收账款和账单文员的居家工作描述。它们通常是诈骗。

    - 永远不要接受要求将钱存入你的银行账户然后汇入不同账户的职位。在几乎每情况下，你都在为坏人洗被盗的钱。

    - 如果职位描述中的英语使用不当（包括语法、大小写和动词时态），那么它极可能是诈骗。发送此类邮件的网络犯罪分子中许多不是英语母语者。

    - 永远不要在回复招聘邮件时提供任何类型的凭证，例如银行账户信息、社会安全号码、用户名、密码或任何个人身份信息。

    - 在接受职位之前，要求通过电话、视频会议，最好是面对面进行工作面试。如果唯一的面试仅通过电子邮件或短信进行，那么它很可能是诈骗。

    - 在接受工作之前，先研究你的潜在雇主。搜索互联网和其他资源，以确定你正在与一家合法公司面试。询问其 Web 地址和物理地址。检查在线业务投诉网站、社交媒体和美国商业改进局（Better
    Business Bureau）。


    # 第 14 章：寻找错的先生或女士


    我在 FBI 从业期间遇到的最令人心碎的案件之一，涉及一位五十多岁的女性，离异，在接近晚年时寻找爱情。那是圣诞节后不久；布鲁克（Brooke）感到孤独，于是她转向互联网寻找一个可以让她共度余生的人。


    在短短几周内，布鲁克与一个名叫安东尼（Anthony）的男人开始了交流。据他说他曾就读 `Vanderbilt University` 化学工程，然后回到法国本土经营家族生意。安东尼告诉布鲁克他为了工作旅行，偶尔回到美国。八个月来，他们每天通话、分享邮件并发短信。他们交换了照片，并尝试多次通过
    `Skype` 或 `Facetime` 通信，但连接从未成功过。在几个月的通信后，布鲁克爱上了安东尼，他们计划在哥斯达黎加的海滩上一起建造梦想房屋。安东尼只需要卖掉他在法国的庄园，就可以用那笔钱买一套他们共享的度假别墅。布鲁克终于可以过上她梦寐以求的童话生活了。


    促使我见到布鲁克的是周五深夜她律师打来一个电话。律师告诉我布鲁克是网络犯罪的受害者，被她在法国的网恋骗了。我告诉他这听起来像是尼日利亚坏人的作案，但他重复用我听过很多次的担心语气。在他分享故事细节之前，我问了两个关键问题：


    1. 钱汇出去多久了？

    2. 她汇了多少钱？


    律师说她在大约十前向一个海外账户汇了 50 万美元。我告知了坏消息，我已经对数百名其他网络犯罪受害者说过这些：收回她的钱已经太晚了，我们可能无法把那些坏人入监狱，而这起犯罪本是可以避免的。


    '
