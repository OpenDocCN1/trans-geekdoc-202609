  trans: '


    FBI 的调查导致两名假装成南非外交官的尼日利亚人被，他们前往美国代表 Charlie 向一名女性索要了资金。根据 FBI 的说法，Charlie 声称他在南非的一项建筑项目中获得了
    4400 万美元的报酬，她相信支付这笔钱是为了让资金（包括她的 200 万美元）转到美国的一家银行。2016 年 7 月，两名尼日利亚共犯承认其在诈骗中的作用认有罪，一名联邦法官判他们每人入禁三十六个月。Charlie
    目前仍在逃亡，推测在尼日利亚，并且可能永远不会被捕。那个受害的女性告诉 FBI：“我不仅在那个男人身上投入了钱，我还把内心的一大部分、巨大的情感投入到了那里。这不仅仅是财务问题，还有情感方面——尴尬、羞愧、被侮辱。”她继续说道：“我甚至无法想象一个人、一个人类竟然能如此糟糕。我无法那样去想他……这个世界上不可能有人会如此残忍，故意对我做他所做的事情。”


    不幸的是，世界上有成千上万像 Charlie 一样的男人在各地受害他人。但如果你认为女性是浪漫诈骗的唯一受害者，请再想想。2017 年，由伦敦市警察控制的网络犯罪举报中心“行动欺诈”（Action
    Fraud）报告，该国浪漫诈骗的受害者中有 39% 是男性。我见过许多男性落入这种陷阱，而且每次交流的细节都相当相似。这些女性通常比她的目标年轻得多，而且似乎总会有大量的蜜情话和亲密照片的交换。这些女性中许多人声称来自东欧，并说他们正在寻找可以结婚的对象，并且愿意搬到美国。这时，他们开始榨取受害者的钱财。他们会从要一份漂亮的礼物开始。没多久，受害者就开始为这个女人付房租，给她寄机票钱，并为她汇款
    10,000 美元的法律费，因为她在试图离开母国时被捕了。


    寻找真爱已经足够困难了，没有人想要孤独。这正是为什么这种网络犯罪对受害者来说在情感上如此痛苦，而对犯罪分子来说又如此有利。关于这类计划，要记住的最重要的一点是没有所谓的典型受害者。目标可以是男性或女性，年轻或老年，异性恋或同性恋。他们的共同点是感到孤独并寻求浪漫关系，而那些坏人则非常愿意利用他们。


    # 如何避免成为受害者


    -   使用在线搜索研究该人的照片和个人资料。如果是诈骗，同一个个人资料可能已经被使用过了。

    -   进展要缓慢，多提问。你还应该记录日记，并准备好识别不一致之处。

    -   如果一个人看起来太完美，或者对你了解得太多，要警惕。

    -   如果某个人试图将你与家人和朋友隔离开，要警惕。

    -   如果有人要求提供不当照片或以后可能被用来勒索你的财务信息，要警惕。

    -   如果某个人承诺与你面谈，但总是找借口不能来，这可能是一个诈骗。如果你在几个月后由于任何原因仍未见过那个人，你有充分的理由怀疑。

    -   如果你同意与潜在伴侣面谈，请确保告诉家人和朋友你要见谁以及去去哪里。

    -   永远不要向你不认识的人汇钱。如果你没有和他们见过面，就不要给他们钱。

    -   对那些伪装成军人、援助工作人员和海外工作人员的人保持谨慎。美国军官员表示，他们每年都会收到来自全球诈骗受者的数千起投诉。官员指出，军人永远不需要休假或医疗费用，而这些是网络分子常用的请求。

    -   警惕拼写和语法错误、故事中的不一致之处，以及其他诈骗的迹象。

    -   注意在社交媒体上分享的个人信息量。诈骗分子利用这类信息创建虚假身份，或在计划中针对你。


    # 第 15 章：勒索软件


    假设你某天下班回家并登录电脑，但你无法打开任何文件。无论你做什么或如何努力，你都无法找回它们。遗憾的是，你意识到自己从未备份过那些重要信息，如照片、文档、音乐、视频和联系人，现在它们可能永远消失了。或者也许你最近尝试过备份，但由于某种原因，并没有成功。如果你已经写了几个月的论文来完成你的学位会怎样？如果你是一个已经写好了下一部小说
    80% 的作者呢？如果你是一个会计师呢？律师呢？医生呢？为了找回客户的文件而不是丢失它们，你愿意付多少钱？你会付 200 美元吗？或者 500 美元？甚至是
    1000 美元？如果你发现自己陷入困境并突然得到了解决方案和机会呢？这听起来是一个很棒的商业决策——特别是对于那些劫持了你信息的坏人来说。


    加密在数字世界中是一件很棒的事。它旨在保护我们的电脑安全，所以只要你的信息经过了加密，任何发现你的笔记本电脑（或偷走它）的小偷都无法访问。除非你的密码非常弱，例如
    `jordan2005` 或 `password123`，否则坏人可能很难访问你的文件。结果，网络分子发现了一种扭转加密价值的方法并利用它来赚钱。黑客创建了我们现在称为勒索软件的东西；你可能听说过最近的一些例子，例如
    `Cryptolocker virus`、`CryptoWall`、`Locky`、`Cerber`、`KeyRanger`、`SamSam`、`TeslaCrypt`、`TorrentLocker`
    和 `Reveton`。勒索软件是一种针对人类和技术弱点的恶意软件，旨在阻止用户访问重要数据和系统——直到受害者支付赎金以换取解锁被扣留的文件和系统的解密密钥。


    勒索软件的工作原理是：你登录电脑却无法访问任何信息。当你发现无法通过删除恶性病毒来打开文件后，你会在系统中发现一条便条，上面写着类似：“你好，我叫 Boris
    Badenov。如果你在接下来的 24 小时内付给我 500 美元的 `bitcoin`，你永远无法找回你的信息。”你和大多数人一样，可能甚至不知道 `bitcoin`
    是一种无法追踪的虚拟电子货币。因为 Boris 很好，他为你提供了一个低成本的解决方案，让你能够找回文件。这就像是他给了你一根魔棒，让噩梦消失，不是吗？


    '
