    # Money Mules: An Overview


    Money mules perform an essential task for bad guys—they launder stolen money or
    merchandise and transfer it to cybercriminals who are usually located overseas.
    The mules are paid a flat fee or a certain percentage of the stolen funds for
    their services, and they’re often stiffed or dropped after only one transaction.


    ## Scope of the Problem


    From January 2015 to June 2016, the `FBI`’s Internet Complaint Center said it
    received 22,143 complaints related to online muling, totaling more than $1 billion
    in losses. Here’s the scary part: Money mules are complicit and risk criminal
