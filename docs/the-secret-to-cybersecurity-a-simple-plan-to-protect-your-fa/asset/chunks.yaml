  trans: '


    # 戴安与键盘记录器


    戴安（DIANE）是来自田纳西州富兰克林的两个孩子的母亲，她在结束了一整天的办公室工作后回到家中。她为家人准备了晚餐，洗了澡，然后登录了笔记本电脑。她仍然更倾向于在电脑上检查邮件，很少在`iPhone`
    上访问；她更喜欢大得多的屏幕。她十四岁的女儿喜欢取笑她使用那台老旧的电脑，说这让她在瞬息万变的数字世界里变得太老了。


    当戴安浏览她的`Gmail`账户时，她迅速删除了垃圾邮件和广告，然后注意到一封来自姐姐阿比盖尔（Abigail）的邮件。戴安的姐姐经常给她发一些关于健康和健身的文章，这封邮件看起来也一样。邮件中包含一个指向关于喝椰子水好处及其减轻皱纹作用文章的链接。戴安总是阅读姐姐发送的文章，所以她点击了关于椰子水的链接并等待文章出现。什么都没有发生。她又点击了一次。没有反应。她想，自己的网络服务可能又变慢了，这是她电脑出现大部分问题的原因。她等得不耐烦了，读了剩下的邮件，浏览了几个她喜爱的在线零售商，然后是时候看《行尸之路》的最新集数了。


    当瑞克·格莱姆斯（Rick Grimes）和他的伙伴小组在电视上试图在僵尸爆发中生存时，戴安努力睁开眼睛。与此同时，在地球另一端东欧洲的一台僵尸电脑正在与她的电脑通信。当戴安点击关于椰子水文章链接时，她被重定向到一台由网络犯罪分子控制的电脑。一旦连接，电脑就在戴安的机器上加载了一个名为`keylogger`（键盘记录器）的恶意程序。键盘记录器有时被称为击键记录器或系统监控器，它的职责只有一个：监控并记录在特定电脑键盘上输入的每一个按键。当戴安为网站（如`Gmail`、她的工作邮箱账户或在线银行账户）输入用户名和密码时，恶意的`keylogger`程序窃取了她的凭据并将其发送给网络犯罪分子，后者现在可以访问戴安的网站了。一旦那个坏蛋获得了戴安银行账户的访问权限，他就准备好洗光她的储蓄了。


    # 乔纳森与勒索软件


    乔纳森（JONATHAN）是一位退休的高中教师，热爱写作和诗歌。养老金涵盖了他的生活费用，他通过担任婚礼摄影师的兼职收入来补充退休金。每当乔纳森没有在拍照时，他就会花时间写作。他最终构思了一个小说的点子，他认为这是他一生中最好的主意。他花了十八个月写了七万五千字，但终于完成了。他将这本犯罪小说视为他一生的心血，并正准备通过亚马逊自出版成为一名出版作家。


    一个周末，乔纳森在一个奢华的婚礼上担任摄影师。这是一场黑领结的正式盛宴，他不敢相信自己一个晚上能赚到多少钱。工作很辛苦，但他一个晚上赚的钱比他当老师的一周赚的还多。乔纳森从婚礼回到家后，他将照片下载到电脑上，并开始用他的照片编辑软件进行处理。完成后，他将照片保存到硬盘中。在睡觉之前，乔纳森检查了他的`Facebook`账户，并点击了一个一个想成为他在线朋友的人发送的链接。那来自一个迷人的年轻女性，她对乔纳森卓越的摄影技巧表示了赞赏。


    在地球另一端，有一个网络犯罪分子坐在东欧洲的笔记本电脑前。我们称他为伊万（Ivan）。当乔纳森点击链接时，伊万笑了。他知道一个毫无防备的美国人的世界即将被翻天覆地。伊万的一台僵尸电脑发送了数千封伪装成`Facebook`垃圾邮件的鱼叉式钓鱼邮件。他针对男性`Facebook`用户，并提议与这些毫无防备的受害者好友。伊万声称自己是一个迷人的女性，对男性`Facebook`页面上列出的兴趣留下了深刻印象。这就像是从婴儿手中拿糖吃。当乔纳森点击链接时，伊万的恶意程序加密了他硬盘上的所有信息。除非向伊万支付
    300 美元赎金，否则乔纳森无法找回他的`iCloud`账户。糟糕的是，伊万还更改了他的`iCloud`账户密码。


    # 海瑟与数据泄露


    对于一家公司的新入职薪职员海瑟（HEATHER）来说，这是一个典型的周一早晨，当她收到 CEO 的一封邮件时。CEO 询问她是否喜欢新工作，赞扬了她到为止的表现，并告诉她薪资经理正在外地参加商务会议，CEO
    正要去公司董事会开会，需要一份包含每位员工姓名、职位、生日、地址、社会安全号码和工资的电子表格。海瑟渴望承担更多责任，并回复说她会在一小时内完成任务。这至少是她所认为正在发生的事。


    在西非一家肮脏的互联网咖啡馆里，一个网络犯罪分子收到了海瑟的邮件，他跳了起来开始庆祝。伊万的一封鱼叉式钓鱼邮件发送给了美国的一个薪职员，要求提供该大型公司的
    W-2 信息。毫无防备的薪职员向他发回了两千名员工的敏感个人信息。在一个满其他网络犯罪子的房间里，这个男人宣布他以每人 5 美元的价格出售姓名、生日、社会安全号码、地址和工资。其他网络犯罪分子开始给他递钱，就像他是华尔街的交易员一样。在短短二分钟内，那个恶棍拿走了
    5000 美元。在几个月后，他的犯罪客户尝试为受害员工申报联邦所得税并访问他们的信用卡账户。


    # 卡罗琳与逮捕令


    卡罗琳（CAROLINE）是一个二十一岁的大学大三级学生，她这周过得并不顺利。期末迫在眉睫，她刚和男朋友发生了一场激烈的争吵，她的父母对她最近超速行驶非常愤怒。他们知道自己的保费即将飙升。当卡罗琳准备去上下一节课时，她的手机响了。来电显示显示电话来自当地警察局。卡罗琳接电话时，心里感到一阵不适。来电者介绍自己是警察局的米勒探员（Detective
    Miller）。他询问卡罗琳，为什么还没有回复警方关于她闯红灯的信件。他说信中包含一张交通摄像头拍摄的照片。卡罗琳告诉警官她没有收到那封信。警官告诉她，三封信寄到了她的校园地址，并且已经发了逮捕令。由于未出庭，她的驾照也将将被吊销。卡罗琳崩溃了，哭了起来。


    '
