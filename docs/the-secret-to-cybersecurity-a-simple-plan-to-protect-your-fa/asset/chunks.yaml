    我为房地产交易制定了一项简单且现实的政策，内容如下：权属公司必须告知所有员工，银行信息的任何更改必须经过验证，但不能通过电子邮件或短信。权属公司的员工必须将此信息传递给房地产经纪人、结案律师、买家和卖家。这样，就不会有任何意外。


    高管们需要向每一位员工说明，如果他们成为 BEC（商务电子邮件诈骗）的受害者，他们将被解雇。这听起来可能很严厉，但受害者不必如此。一点警惕和常识就能纠正这些这些问题。如果客户位于外地，最好知道他们的长相，然后通过视频会议来验证交割流程的任何更改。这会减慢速度吗？当然会，但防患胜于未然，尤其是当涉及到数百万美元的损失时。


    当我还在 FBI 工作时，我在一次演讲中分享了这项政策。观众中的一位女性抱怨说这执行起来太难了。没有人希望来自联邦政府的人来教私营部门如何工作。但关键在于预防，如果等到犯罪已经发生后才来打电话，那就无能为力了。


    遗憾的是，许多房地产经纪人正在使用不安全的 `AOL` 和 `Yahoo` 账户进行业务，他们每天使用这些账户与买家和卖家交流。只要这些公司继续照常行事，坏人就会继续针对房地产行业。但你呢？下次当你买卖房屋，房地产经纪人给你发一封邮件，指示将首付款发送到特定的银行账户和路由号码时，你会怎么办？如果你读到了这里，希望你会拿起电话进行实，或者更好是亲自去办公室。


    ### 如何避免成为受害者


    - 提高公司内部对商务电子邮件诈骗威胁的意识，这将使贵公司成为受害者的概率降低。

    - 不要通过电子邮件或短信接受对银行账户信息的任何更改。

    - 要求员工验证每项银行变更，最好是面对面的，或至少通过电话。

    - 要求您的银行对客户的国际汇款请求保留更长的处理期，以验证请求的合法性。

    - 对要求保密或压力快速采取行动的要求要格外警惕。

    - 不要拨打请求更改银行信息的邮件中所包含的电话号码。拨打名录或名片上列出的已知号码。

    - 仔细审查所有与房地产交易相关的电子邮件，特别注意发人的电子邮件地址。确保它不是伪造账户，并将其与你过去从那里收到的其他邮件进行对比。

    - 如果你的房地产经纪人倾向于使用个人邮箱账户开展业务，请要求他们仅通过公司邮箱与你联系。这可能更安全。

    - 如果你是买家或卖家，永远不要依赖电子邮件或短信中包含的汇信息。给你的房地产经纪人、结案律师或权属公司的工作人员打电话，告知他们你收到了一封邮件或短信并想要验证其内容。

    - 在你的电子邮件上安装双重身份验证。询问你的房地产经纪人、结案律师和权属公司的代表他们是否也在使用 `2FA`。


    ## 第 13 章：居家办公的噩梦


    居家办公有很多优点：不需要从早九到晚五坐在办公桌后，避免交通拥堵或拥挤的地铁和公交，节省午餐费和职业装费用，并在工作日期间灵活地花更多时间与家人朋友待在一起。越来越多的美国人正在远程办公，很容易看出为什么这对员工和雇主都有巨大的吸引力，因为雇主们发现员工在休息和愉快时工作效率更高。


    由于上述所有原因，居家办公的工作是受期待的，但许多寻找此类职位的人的生活被网络罪分子搞得天翻地覆。在许多情况下，坏人针对的是最脆弱的人群：那些最近失业、欠费、刚毕业的届生或正在照顾生病亲属的人。你可能收到过数百封邮件，提议每周额外获得
    1000 美元或特定的佣金，让你从家里处理财务交易。或者你可能在 `Craigslist` 或 `Monster.com` 上看到类似的“汇款代理人”、“本地处理员”、“支付处理代理”以及其他类似职位的招聘列表。我经常收到这些邮件，幸运的是，大多数邮件都进入了我的垃圾邮件箱。这里有一个例子：


    ```

    亲爱的朋友，


    向你和你的家人问候，我是银行的账单和汇兑经理，我有 550 万美元的业务要转到你的账户，以便在你的国家进行投资。如果你准备好协助，请回复我，我将给你有关资金如何转给你的详细信息。


    请放心，一切都将保密处理，因为这是一个我们无法错过的大机会，因为它将为我们的家庭带来巨额利润。6 年前，大多数贪婪的非洲政客利用我们的银行在他们政治顾问的帮助下海外洗钱，他们转出非洲大陆的大部分资金本应用于开发该大陆。当我向你发送这条信息时，我成功转拨了
    550 万美元（$5.5M），这笔资金处于银行内无人的托管交易账户中，现在我的银行非常想知道资金的真实受益人是谁。


    一旦资金成功转入你的账户，我将前往你的国家分享资金，资金将分配为：我占 50%，你占 40%，剩下的 10% 捐给孤儿院和贫困的弱势群体。


    请通过回复表示你对这笔交易的兴趣，如果你感兴趣，请不要浪费时间回复，从你的信箱中删除我的信息，好吗。


    期待很快收到你的回复。


    诚挚的，


    Mrs. Elodie Azeez

    ```


    '
