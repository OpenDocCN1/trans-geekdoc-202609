- raw: 'If the victims in my cases had used MFA or 2FA on their personal platforms,
    many of them wouldn’t have been victims of cybercrime. I cringe every time I make
    that statement because I know it’s true and many of the crimes could have been
    prevented. I worked with a lot of large corporations that were victimized, and
    they were big enough to survive heavy financial losses. But I can’t tell you how
    often I worked with small businesses, nonprofit organizations, schools, or retirees
    who lost tens thousands of dollars or more to cybercriminals. In many cases, the
    victims’ lives were ruined. I witnessed small businesses go out of business and
    retirees lose their entire life savings. They are tragic stories that will haunt
    me for the rest of my life.


    After witnessing the carnage that comes with cybercrime, some of the most important
    advice I now give to family members and friends—and what I’m going to say to you
    now—is that you should only use an email provider that offers two-factor authentication.
    With that added layer of security, a cybercriminal would need your passphrase
    and the security code that’s on your mobile device to break into your account.
    Gmail, Outlook, and iCloud each offer 2FA. The website [www.twofactorauth.org](http://www.twofactorauth.org)
    is an excellent resource that identifies the platforms that have 2FA and those
    that don’t. One of the big questions I get from people is, “What if my email platform
    doesn’t offer two-factor authentication?” Easy: find one that does. A person once
    told me that he had a “very cool” email address on a provider that didn’t offer
    2FA and he didn’t want to give it up. I told him to do whatever he wanted, but
    I wouldn’t be opening any emails from him!


    In the past, most email platforms offered 2FA through SMS; they’d send you a six-digit
    verification code via a text message when you attempted to log in to your email
    from a computer or other device. Well, cybercriminals figured out devious ways
    to clone cell phones, intercept SMS messages, and hijack accounts simply by calling
    unsuspecting cellular carriers. Two-factor authentication through SMS is better
    than doing nothing at all, but token-based 2FA and app-based 2FA are much better
    alternatives nowadays. If you want to add yet another layer of security, download
    a password authenticator on your mobile device. Google, Microsoft, and Apple offer
    such apps through Google Play and the App Store, and there are other options available,
    such as Authy, LastPass Authenticator, and 1Password. I personally use Duo Mobile,
    which is free and works across a lot of platforms. These apps, available on both
    iOS and Android devices, generate random two-step verification codes on your phone—even
    if it’s not connected to the Internet. If you don’t have Google Authenticator
    or another authenticator app, the Gmail verification codes can still be sent to
    your phone via text messages. But the authenticator apps use algorithms to generate
    the codes on your phone, making it even safer. You can also transfer the authenticator
    apps to a new phone if your old device is lost or damaged or if you’ve replaced
    it with the latest model.


    I have a Gmail account that I use for personal correspondence. Google has an incredibly
    easy process to utilize 2FA to help me stay safe, and it only takes a few minutes
    to install. The first step is to go to Google’s 2-Step Verification page, [www.google.com/landing/2step](http://www.google.com/landing/2step),
    and click on the blue “Get Started” box in the upper right-hand corner. Enter
    your Gmail username and password and then click on the “Start Setup” button. Then,
    you will be asked to do something you won’t want to do—enter your cell phone number.
    In order for 2FA to work and keep you safe, you’re going to have to enter your
    cell phone number. (If you have Google Voice, don’t use that number because you
    might get locked out.) Once Gmail has your cell phone number, you will receive
    a random six-digit number via a text message. A webpage will appear on the Gmail
    screen asking you to enter the six-digit code. You will then be asked whether
    or not to add your current computer as a trusted device and, if you’re using a
    computer you normally use, you should answer yes. To install Google Authenticator,
    which I’d encourage you to do, download the app from Google Play and then go to
    the “2-step Verification” section of your Google account. Under “Set up alternative
    second step,” find “Authenticator app” and tap “Set up.” Follow the instructions
    on the screen, and get a code from your authenticator app to make sure it’s working.
    These instructions work as of this writing, but, of course, Google might change
    their process at any time. The screens might not look identical when you try this
    for yourself.


    Of course, there are millions of people around the world reading and writing email
    on their mobile devices, whether it’s an iPhone, iPad, Android phone, or some
    other tablet. In fact, more than one-third of the people using email might be
    reading it on an iPhone or iPad, according to a 2018 survey by online marketing
    firm Litmus. They analyzed fifteen billion emails in the first half of 2018 and
    found that 29 percent were opened on iPhones, 10 percent on iPads, and 8 percent
    on Apple computers. About 27 percent were opened on Gmail and 7 percent on Outlook.
    Only 1 percent was opened on Yahoo! Mail, and I can’t tell you how happy that
    makes me.


    If you’re using a device with an iOS platform to read and write email, I have
    good news: Apple also offers an easy process for installing two-factor authentication.
    With 2FA, your Apple ID and iCloud mail account can only be accessed on devices
    you trust, such as your iPhone, iPad, or Mac laptops and desktops. When you sign
    in to a new device for the first time, you’ll have to enter your Apple ID password
    and a six-digit verification code that’s automatically displayed on your trusted
    devices. By entering the code, you’re verifying that you’re currently working
    on a trusted device. Once you’ve signed in with a verification code, you won’t
    be asked for it on that device again unless you sign out completely, erase the
    device, or change your Apple ID password for security reasons. You’ll also be
    asked to enter a trusted telephone number to receive verification codes via text
    message or automated phone calls. To turn on two-factor authentication on your
    iPhone, iPad, or iPod touch (if you’re using iOS 10.3 or later), go to Settings,
    sign in, and select “Password & Security.” Tap the arrow next to “Turn On Two-Factor
    Authentication.” Then tap “Continue” and a new screen will appear, where you’ll
    be asked to enter a phone number to receive verification codes when you sign in.
    Enter a telephone number and tap “Next,” and then a verification code will be
    sent to the phone number you provided. Enter the code to verify your phone number
    and turn on two-factor authentication. It’s that easy. Like with Google, Apple
    might make a slight change at any time, so follow the most recent instructions.'
