  trans: '

    由于这笔极其昂贵的教训，应付账账员被解雇了（因为这类情况下总会有人解雇）。但被解雇的人对吗？`Company X` 是否有一项政策，要求在更改银行账户时必须进行语音确认？该办事员只是在履行她的职责。如果公司使用了双重身份验证，坏人就永远无法破解那位高管员工的邮箱来得知交易即将发生。此外，我在公司的一位消息人士告诉我，信息安全经理在事件发生的一年前就提过需要双重身份验证。高层拒绝了他的建议，因为他们不想把金钱和时间浪费在一个用起来“非常头疼”的事情上。


    所以，我会再次问这个问题：被解雇的人对吗？


    # 如何避免成为受害者


    ![Image](img/lock.jpg) 对任何电汇转实施双重身份验证。


    ![Image](img/lock.jpg) 绝不要根据邮件内容发送电汇；直接打电话或与发起电汇或开具发票的人员面对面，以核实付款详情。


    ![Image](img/lock.jpg) 为公司邮箱利用双重身份验证。大多数 BEC（业务邮件欺骗）诈骗之所以成功是因为网络犯罪获得了员工邮箱的访问权限。


    ![Image](img/lock.jpg) 在汇款之前，用你手头的账户号码核实银行账户和路由号码。如果是与新供应商的首次交易，给该公司的人打电话核实银行信息。


    ![Image](img/lock.jpg) 如果你正在给新供应商的人员核实银行信息，请拨打你手中的电话号码或在目录中查询该号码。不要拨打邮件中提供的号码。


    ![Image](img/lock.jpg) 将发票上的邮箱地址与你之前从该公司收到的邮箱地址进行对比。核实发票不是从伪造的邮箱发送的。


    ![Image](img/lock.jpg) 在回复可疑或关键任务邮件时，请使用你邮件程序的“转发”按钮而不是“回复”。然后，输入据称发送消息给你的已知邮箱地址。通过转发而不是回复邮件，你可以保护自己免于回复来自伪造账户的非法邮件。


    ![Image](img/lock.jpg) 注册任何可能与你实际公司域名略有不同的公司域名。例如，如果你公司的域名是 `jerrysbagels.com`，那么注册
    `jerrysbagels.co`、`jerrybagels.com` 和 `jerrysbagles.com`。这将有助于网络犯罪分子注册伪造域名。


    ![Image](img/lock.jpg) 为可能正在旅行且无法使用手机的员工建立一次性密码或安全问题。如果员工在途中要求电汇，请要求其提供密码或答案。确保密码和问题具有足够的强度。


    ![Image](img/lock.jpg) 如果你收到包含“管理费用代码”或“紧急电汇”字词的邮件，请格外严谨地核实其合法性。之前的 BEC 诈骗受害者报告过，这些短语就出现在伪造的邮件中。


    ![Image](img/chap.jpg)


    # 第 12 章：房地产诈骗


    全国每天有成千上万的房屋在出售。那些多年努力并积蓄以购买梦想之家的人正在打包行李，准备落下新根，并准备进行这辈子可能是他们一生中最大的财务交易。不幸的是，网络犯罪分子只需要几分钟就能摧毁一个心怀希望的购房者的美国梦。


    增长最快且财务损失最大的业务邮件欺骗诈骗之一针对房地产行业的人士：买家、卖家、房地产经纪人、抵押贷款经纪人、银行家和产权保险公司。当网络犯罪分子入侵了交易中某人的邮箱时，问题就开始出现。网络犯罪分子入侵了交易相关人员（如买家、卖家、房地产经纪人或产权律师）的邮箱，并创建一个与其极其相同的域名。在汇款之前，用你手头的账户号码核实银行账户和路由号码。如果是与新供应商的首次交易，给该公司的人打电话核实银行信息。向买家提供首付款、结算成本或购买价格。在许多案例中，被盗的资金被汇往海外。坏人使用一个钱子账户获取被盗资金。


    2018 年 7 月，`FBI` 的互联网投诉中心 (`IC3`) 报告称，网络犯罪分子越来越多地从房地产领域（包括产权公司、律师事务所等）中窃取资金。从
    2015 年到 2017 年，受 BEC 诈骗影响的受害者报告增加了 1100%。在同一时期，此类诈骗的损失资金增加了 2200%，在截至 2017 年 10
    月的季度达到了 1800 万美元。仅 2017 年，`IC3` 就报告收到了九千多起在线房地产诈骗，损失超过 5600 万美元。仅在过去几年里，我在纳什维尔见过数十位受害者，损失总达数百万美元。


    各种规模的企业都是这种 BEC 诈骗的受害者，网络犯罪分子甚至在欺骗一些聪明的人。2017 年 6 月，纽约州最高法院法官 `Lori Sattler` 在试图卖掉公寓购买另一处公寓时被骗了
    100 万美元。根据报道，`Sattler` 在尝试购买新公寓时收到了一封她认为是其房地产律师发送的邮件。自称是 `Sattler` 律师的人指示她向特定的银行账户汇款
    105.7 万美元。她的被盗资金随后转到了中国商业银行。2017 年 8 月，华盛顿特区的一对夫妇在准备购买梦想之家时被骗了 150 万美元。这对夫妇都是联邦政府工作人员，他们计划利用一笔遗产为家庭购买更大的房子。他们支付了
    20 万美元的首付款，并在准备结算时收到一封似乎来自他们产权公司的邮件。他们回复了该邮件，邮件指示他们将剩余的 150 万美元汇入一个账户。但当夫妇在结算当天到达律师办公室时，他们被告知被骗了。调查人员发现，网络犯罪分子黑入了产权公司某人的邮箱账户，并向这对夫妇发送了伪造邮件。

