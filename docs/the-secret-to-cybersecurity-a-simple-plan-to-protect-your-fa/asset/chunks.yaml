    ![Image](img/lock.jpg) 请务必为你的云账户使用不同的密码。密码长度至少应十二个字符（十五个甚至更好），并包含小写字母、大写字母、数字以及至少一个特殊字符。


    ![Image](img/lock.jpg) 如果你是小企业主，请让你的员工了解他们保护自己用户名和密码的责任。针对潜在的泄露情况建立应急预案。


    ![Image](img/lock.jpg) 确保你对存储在云端的任何内容都有备份，无论是存储在外部硬盘还是其他的离线存储。


    ![Image](img/lock.jpg) 使用云加密，这对于保护至关重要。它允许使用加密算法对数据和文本进行转换，然后放在存储云中。


    ![Image](img/chap.jpg)


    # 第 11 章：商业电子邮件欺骗


    世界上最大的网络犯罪威胁之一被称为商业电子邮件欺骗计划方案（`BEC`），也被称为网络支持的金融欺诈。这种攻击通过传统的社会工程学、计算机侵入技术以及窃取用户名和密码，攻破合法的个人和业务电子邮件账户来实现。`BEC`
    犯罪分子诱骗终端用户向他们汇款，或向他们提供姓名、出生日期和社会安全号码。根据 FBI 网络犯罪投诉中心（`IC3`）的数据，`BEC` 诈骗仍在增长、演变，并针对各种终端用户。自从
    FBI 开始正式跟踪 `BEC` 及其变体电子邮件账户攻破（`EAC`）以来，截至 2018 年 6 月，报告的损失高达 120 亿美元。外国公民实施了许多方案，这些方案起源于尼日利亚，但随后已扩散到全球。报告显示，欺诈转账已发送到
    115 个国家，大部分流向中国和香港的亚洲银行。在我的职业生涯中，我发现过资金转入数十个外国国家的案例。


    2018 年 6 月，FBI 和司法部宣布了一项重大的协调执法行动，旨在破坏设计拦截和劫持企业及个人电汇款的 `BEC` 方案。“电线行动”（`Operation
    WireWire`）还包括来自国土安全部、财政部和美国邮政检查局的探员，导致 74 人被捕，其中包括美国的 42 人，尼日利亚的 29 人，以及加拿大、毛里求斯和波兰的
    3 人。为期六个月的行动没收了近 240 万美元，并拦截和恢复了近 1400 万美元的欺诈电汇。有时，尽管极其困难，我们实际上能够定位、逮捕并惩罚坏人。


    在 FBI 工作期间，我调查了数百起 `BEC` 案件，我看到从房主、小企业、医疗保健公司、房地产公司甚至大型公司都成为这些诈骗的目标。最糟糕的部分是，这些犯罪每一个都是可以避免的。我处理的一个案件涉及一家小型非营利组织，他们有一个伟大的使命，即资助帮助贫困国家儿童提供食物的项目。Elena
    在该非营利组织担任财务经理，有一天，她的老板 Jeremy 在办公室外募集捐款。当然，筹款是任何非营利组织的命脉，Elena 的工作是跟踪资金的进。那一天，Elena
    收到一封来自 Jeremy 的邮件，指示她向西非的一个银行账户汇款 35,000 美元，作为人道主义努力的一部分。这一请求并不特殊，所以 Elena 遵循了
    Jeremy 的指示。她给银行打电话，指示那里的人将钱汇到西非的账户。在他们的交谈期间，银行代表警告 Elena 注意一种被称为`商业电子邮件欺骗`的情况，并质疑网络罪分子是否在冒充她的老板。Elena
    向银行家保证这是一笔合法的交易，无需担心。


    下周在一次管理会议上，Elena 更新了筹集资金的情况以及这些资金发往人道主义项目的地方。当 Elena 提到用于人道主义项目的资金时，当她提到向西非汇了
    35,000 美元时，Jeremy 困惑了。


    “你向哪里汇了 35,000 美元？”Jeremy 问，“你把钱汇到了哪里？”Elena 对 Jeremy 担忧的语气感到惊讶，并想他是否只是忘记了。她解释说她收到了一封邮件，向西非汇款。Elena
    收到了一封来自 Jeremy 的邮件，指示她向西非的一个银行账户汇款 35,000 美元。当 Jeremy 声称他从未发送过此类邮件时，她拿出笔记本电脑展示给他看邮件。Jeremy
    打开了收件箱，那里并没有该邮件。在进一步检查邮件头部后，发生的情况变得很清楚了。Jeremy 的电子邮件地址是 `Jeremy@nonprofit.com`（仅作示例）；Elena
    收到的邮件来自 `Jeremy@nonprof1t.com`。你可能需要几秒钟注意到区别，但这正是网络罪分子希望发生的。这种差异如此微妙，以至于大多数人可能永远无法识别。大多数情况下，我们不会仔细看邮件地址——特别是如果它们来自我们认识的人。Jeremy
    显然非常生气且困惑，他把气发泄在了 Elena 身上。Jeremy 银行要求采取行动，但银行唯一能做的尝试撤回电汇。遗憾的是，在 24 小时后撤回国际电汇的机会几乎其微。然后银行向
    Jeremy 解释说，当她要求汇款时曾警告过 `BEC` 诈骗。她的情况并没有好转。


    在调查此案件时，我发现该非营利组织没有使用双重身份验证，坏人已经获取了 Jeremy 的电子邮件账户——可能是通过密码重用或击键记录器。小偷阅读了 Jeremy
    的邮件并了解了组织的运作方式，他很快意识到自己只需要给 Elena 发一封带有转账指令的邮件就能窃取该非营利组织的资金。随后，网络罪分子注册了一个相似域名（电子邮件地址中
    @ 符号后面的公司名称）来模仿该非营利组织的实际域名。当 Elena 收到 Jeremy 的邮件时，她合理地认为那是他发的，并让银行汇款。调查过程中，我们发现罪犯使用了一个免费的网络托管服务。我们向该网络托管公司发出了联邦大陪审传票，但唯一的线索是
    IP 地址，该地址几乎总是注册在尼日利亚。坏人足够聪明，在注册假网站时不会提供真实的姓名和地址。过去，抓住罪犯最简单的方法是追踪资金。今天，坏人将被盗资金汇入海外银行账户，几乎无法找到他们并追回资金。对于大多数公司来说，收到向海外汇款的要求是一个巨大的警告，因此网络罪分子在美国招募钱骡来替他们干脏活。钱骡是有或不知情的共犯，他们协助向海外银行转移，或者在某些情况下将被盗资金汇入他们的国内账户，然后从那里汇给小偷。故意参与诈骗的钱骡可以获得被盗资金的一小部分作为报酬。

    '
