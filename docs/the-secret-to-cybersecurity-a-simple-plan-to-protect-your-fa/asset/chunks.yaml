- raw: '![Image](images/lock.jpg) If available, use authentication apps that don’t
    rely on SMS texting for added security. If a social media app doesn’t offer authentication
    through something other than text messages, I wouldn’t use it until it does.


    ![Image](images/lock.jpg) Only open links such as friend requests on Facebook
    and connection requests on LinkedIn through the actual apps or webpages. Don’t
    click on the links that are sent through emails or messages to your phone.


    ![Image](images/lock.jpg) Don’t share too much information on social media. While
    most of us want everyone to know what we’re doing, where we’ve been, and where
    we’re going, sharing too much information makes you an easy target for identity
    theft. Never share your Social Security number, birth date, home address, or phone
    number on social media.


    ![Image](images/lock.jpg) Don’t post your work history on social media apps like
    Facebook. By advertising where you worked and when you were there, you’re providing
    cybercriminals with a lot of the information they’ll need to fill out fraudulent
    loan applications in your name.


    ![Image](images/lock.jpg) Customize the privacy settings on social media apps.
    Take control of who can see what you’re posting and limit what personal information
    is shared with others.


    ![Image](images/lock.jpg) We love to post photographs from our family vacations,
    but it’s also an advertisement to criminals that it’s a good time to break into
    our homes. And, if we’ve posted too much information on social media, the bad
    guys probably know exactly where we live.


    ![Image](images/chap.jpg)


    ## CHAPTER 10:


    ## Is the Cloud Safe?


    ONE OF THE QUESTIONS I get asked most often is, “Is the cloud safe?” Some people
    I talk to even ask, “What is the cloud?” And, no, I’m not talking about the big,
    white, fluffy things up in the sky. There are a lot of different names for the
    types of clouds I’m talking about: public cloud, private cloud, Software as a
    Service (SaaS), Infrastructure as a Service (IaaS), file hosting service, and
    even hybrid cloud. My definition of the cloud is a little simpler. I define it
    as a computer that doesn’t belong to you, but it’s where you store your information.
    Think of it as a hopefully secure space you’re leasing, or, in many cases, it’s
    where you’re storing your stuff for free. If you use Google, iCloud, Outlook,
    Dropbox, Microsoft, or Quickbooks, you’re using a cloud. We store files, documents,
    music, and photos in the cloud so we can keep it safe and access it from anywhere
    in the world. Because of the cloud, we no longer have to store our information
    on the hard drive of a device or carry it around on a tiny thumb drive that we
    almost always lose. For a lot of reasons, the cloud is a really great invention.


    The cloud is an especially important and amazing tool for small businesses. It
    can be used to store files and share files between clients and colleagues when
    they might otherwise be too large to send through emails. Most cloud-based services
    store three copies of documents that are uploaded, so there’s no danger of losing
    important work. Most options are cost-effective compared to other types of web-hosting
    services, and you’re not required to purchase new hardware every time you need
    more storage space. Plus, you don’t have worry about a server going down, which
    might affect an employee’s productivity and ability to access important documents.


    But, much like everything else on the Internet, the cloud has the potential of
    being extremely dangerous. One weekend about ten years ago, I went scanner crazy.
    I decided it was finally time for the Augenbaum family to go green and paperless,
    so I took all our important documents out of a fireproof lock box and started
    scanning them. Since I’d already spent my hard-earned money on a digital scanner,
    I figured I might as well use it. What a great idea! I scanned all our birth certificates,
    passports, Social Security cards, marriage certificate, and state and federal
    tax returns. Then, I saved all the documents to a folder called “Important Documents”
    on my computer’s internal hard drive. This was not a smart idea. I might as well
    have labeled it, “Bad Guys: This Is What You’re Looking For!” To make matters
    worse, the file wasn’t even password-protected. I figured that, since I’d gone
    through the trouble of backing up my important documents on my hard drive, I might
    as well have a backup of the backup. Now, the smart thing would have been to burn
    the file to a CD or save it on a thumb drive or external hard drive that I could
    keep in a secure location at home or safe deposit box at a bank. But, no, I saved
    the file to my Google Drive cloud account! For weeks, I’d been receiving a bunch
    of emails from Google, informing me that I had a gigabyte of free storage space
    on my Google Drive account. So, I uploaded all of my important documents there.


    Hopefully, a few things should be jumping out to you by now. If I only need a
    username and password to access my account from anywhere in the world, who else
    could access my sensitive information? Well, if a bad guy steals my username and
    password, he could easily break in. This brings me back to my earlier question:
    is the cloud safe? Despite the scenario I just described to you, the answer is
    yes. The bad guys don’t typically hack into an actual cloud provider; they don’t
    need to. The files you send to the cloud are being stored on hard drives on machines
    that are heavily secured in data centers around the country. It would be pretty
    difficult for a cybercrook to penetrate them. Instead, it’s a lot easier to attack
    the end users—you and me. The only things a bad guy needs to break into a cloud
    account are the username and password, and then it’s usually game over for the
    victim. But, since you’re now an expert in creating passphrases and installing
    two-factor authentication, hopefully you understand the importance of keeping
    your cloud accounts safe and realize how easy it is to lock them down.


    Along with Google Drive, another cloud provider that is chock-full of sensitive
    information is Dropbox, a file hosting service that offers cloud storage, file
    synchronization, personal cloud, and client software for free. I’ve seen a lot
    of corporations use it to store sensitive work projects so their employees can
    access the files from work and home. In February 2018, Dropbox announced that
    it had more than five hundred million users who had uploaded more than four hundred
    billion pieces of content. About 1.2 billion files are being uploaded to Dropbox
    every single day! Many people use the Dropbox app on their cell phones to download
    and access files; the app has been downloaded onto Android phones more than five
    hundred million times.


    One night, while I was writing this book, I went upstairs and found a nice, quiet
    place to hide and write. Much to my surprise, I found my wife’s laptop opened
    to her Dropbox account. As a trained cyber-investigator and nosey person in general,
    I noticed that her Dropbox account contained about 715 MB of accounting and tax
    documents belonging to her clients. To my horror (but not my surprise), I discovered
    that two-factor authentication hadn’t been turned on. I went to “Settings” and
    clicked on “Security,” and, at the bottom of the screen, was “Two-Step Verification”—which
    had been turned off. I enabled and provided her cell phone number to receive the
    code. Then, her account and all her clients’ personal information were secure.
    Unsecured Dropbox accounts present an enormous opportunity for cybercriminals,
    and I guarantee you that they’re constantly scheming for ways to break in.'
