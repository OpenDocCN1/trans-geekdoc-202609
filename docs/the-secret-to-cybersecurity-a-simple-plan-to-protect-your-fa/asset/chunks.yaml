- raw: 'There are disturbing signs that hackers are increasingly targeting nonprofits
    and small businesses because they are less likely to have sophisticated security
    measures. Data breaches can be especially damaging to nonprofits because they
    lead to lost time, litigation, fines, and penalties—as well as a loss of public
    trust, which can have a negative effect on donor contributions. The same goes
    for churches. One leader of a religious organization actually told me that God
    was its firewall and no one would ever target a church. Again, that’s not true.
    Churches and nonprofits have bank accounts that are accessible via the Internet,
    and I have seen them victimized on numerous occasions.


    Nonprofits and religious organizations aren’t the only groups that are naïve when
    it comes to the growing dangers of cybercrime. I’ve had conversations with executives
    of publicly traded companies on the NASDAQ exchange who have told me they weren’t
    worried about cybersecurity; they said the bad guys were only targeting companies
    on the New York Stock Exchange (NYSE)! Recently, an executive of a publicly traded
    company on the NYSE told me he wasn’t concerned because his organization’s annual
    revenue was less than $5 billion, and the cyberthieves were only targeting companies
    with revenues of more than $30 billion! Of course, that isn’t true, and those
    types of attitudes are a big part of the cybercrime problem.


    All of us, whether we work for a publicly traded corporation with billions of
    dollars in annual revenue or a small nonprofit that is struggling to keep its
    doors open, have information cybercriminals want to get their hands on. When a
    thief obtains the username and password for our bank accounts, there’s a good
    chance he’s going to drain our funds. If he gets access to our computer files
    and finds something sensitive, such as our tax returns, he is going to use that
    information to open credit card or loan accounts in our name and make us victims
    of identify theft. If he gets access to our email and social media accounts, he
    is going to use what he learns about us as a weapon to gain access to even more
    victims.


    During one of my cybersecurity presentations, a woman interrupted me and said
    she had nothing at all to worry about. She didn’t bank online and only used her
    bank’s website to check her account balances. When I asked her if she needed a
    username and password to access her balance, she confirmed that she did. I asked
    her to log in to her account and pull up the automated bill-pay tool, where she
    could enter an account and routing number to make payments. She told me she didn’t
    use the bill-pay feature and said in a particularly condescending tone, “I only
    check my bank balance.” But then I asked her what would happen if the bad guys
    gained access to her bank account, username, and password, and then entered the
    stolen information to make a payment to themselves. At this point, she finally
    understood how vulnerable she really was—along with the rest of the American public.


    I always like to ask people at my cybersecurity safety presentations to identify
    the most important data they’ve stored on their computers. If you’re an author,
    it’s probably an unfinished manuscript. If you’re a student, it might be a thesis
    paper or homework. If you’re a small business, it’s human resources materials
    or banking records. If a cybercriminal were to break into your computer, what’s
    the one thing you wouldn’t want him to steal? I get a variety of answers from
    people in the audience, and then I like to joke, “Did someone say naked photographs?”
    Whatever information is important to you is important to a thief. That makes every
    one of us a target.


    2\. Truth Two: You’re probably not getting your money back.


    This might be the most difficult concept for people to understand: When cybercriminals
    gain access to your bank account and steal all your money, law enforcement’s chances
    of recouping your money is really slim to none. I hate to say that, but it’s true.
    Don’t get me wrong; I have a few success stories of recovering money that left
    the U.S. in compromised business email scams. If there were a Hall of Fame for
    FBI agents who recovered money that ended up overseas, my name would probably
    be on a plaque hanging on a wall. But the cold truth is that I’d probably be hitting
    below .100, and that’s not going to get me anywhere close to the Baseball Hall
    of Fame in Cooperstown, New York.


    I recently spoke at a conference and told the crowd about how difficult it is
    for law enforcement to recover money from foreign cybercriminals. A retired FBI
    executive was speaking at the same conference, and he criticized me for telling
    the audience that law enforcement, particularly the FBI, probably can’t get their
    property back. I smiled at him and said, “The truth hurts, doesn’t it?” He looked
    stunned.


    Unfortunately, it’s absolutely the truth in a lot of cases. A 2017 study by the
    cybersecurity company Kaspersky Lab found that 52 percent of people surveyed reported
    recovering either none or only some of their money that was stolen in computer
    crimes. On average, the study found, Internet users lost $476 per attack and one
    in ten people reported losing more than $5,000. Even more surprising, 81 percent
    of the respondents reported conducting financial transactions online and 44 percent
    admitted storing financial data on their connected devices. However, only 60 percent
    of Internet users reported protecting all of their devices with cybersecurity
    software. You might as well email your usernames and passwords to the cybercriminals!


    3\. Truth Three: The bad guys probably aren’t getting arrested.


    One of the most frustrating parts of cybercrime is that it’s so prevalent, yet
    there are so few arrests. The big problem is that computer criminals aren’t always
    based in the U.S. In many cases, the cybercriminal who infects your computer to
    steal your personal information is based somewhere in Eastern Europe, West Africa,
    Asia, South America, or the Middle East.


    According to the cybersecurity company Symantec, the countries that were the largest
    sources of malware, spam, and phishing in 2017 were the U.S. (23.96 percent),
    China (9.63 percent), Brazil (5.84 percent), India (5.11 percent), Germany (3.35
    percent), Russia (3.07 percent), United Kingdom (2.61 percent), France (2.35 percent),
    Japan (2.25 percent), and Vietnam (2.16 percent). While the FBI and other law-enforcement
    agencies will obviously have a better chance of identifying and arresting homegrown
    hackers, it’s much more difficult for them to locate and apprehend computer-based
    criminals operating overseas. Many cybercriminals are based in countries like
    China and Russia for a specific reason—the governments there aren’t friendly to
    the U.S. and aren’t likely to cooperate in an investigation or extradite their
    citizens to face punishment for crimes. When I first started working with the
    FBI, fighting crime was a localized problem; now, it’s an international problem.'
