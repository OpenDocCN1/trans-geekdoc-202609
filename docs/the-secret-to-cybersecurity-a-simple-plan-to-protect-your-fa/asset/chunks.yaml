    ## INTRODUCTION:


    ## Fear from Real Experience


    IT’S HARD TO BELIEVE THAT it was fewer than twenty-five years ago when America
    Online (AOL) and its “You’ve Got Mail!” slogan ruled the World Wide Web. It’s
    also hard to believe that the Internet, which was once considered nothing more
    than a novelty, would bring so many great things into our lives.


    But while we’ve been greatly enriched by the wealth of information, entertainment,
    goods, and services provided by the Internet, nobody ever really considered how
    much crime would come with it. Who would have ever imagined that plugging an Ethernet
    cable into the back of our computer or connecting our laptop, cell phone, or tablet
    to a wireless network in an airport would become an open door for criminals to
    ruin our lives and destroy the economy?


    I was one of the first special agents from the Federal Bureau of Investigation
    assigned to investigating cybercrime back in the late 1990s. At the time, we were
    chasing amateur hackers, thrill seekers, and teenagers who were mostly more mischievous
    and adventurous than criminal.'
