    ![Image](img/chap.jpg)


    # 第 17 章：老年人诈骗


    老年人是我们**最脆弱的公民之一**，而且（并不意外的是），他们也是网络犯罪分子最频繁攻击的目标。2017 年，联邦调查局接到了近 5 万起涉及 60 岁以上受害者的诈骗投诉，调整后的损失总额超过
    3.42 亿美元。美国政府问责办公室在 2018 年估计，针对美国老年人的财务诈骗每年可能导致老年人损失约 29 亿美元。他们说，大多数诈骗案未被报告，是因为受害者不知道向哪里举报，要么他们太羞于承认自己被骗了，要么他们根本就不知道自己受了骗。


    2018 年 2 月 22 日，美国司法部长杰夫·塞申（Jeff Sessions）宣布了“老年正义倡议”（Elder Justice Initiative）的成立，该倡议旨在支持并协调美国司法部的执法工作，打击针对老年公民的虐待、疏忽以及财务诈骗和骗局。塞申当时表示：“司法部及其合作伙伴正在采取前所未有的协调行动，保护美国老年人免受国内外财务威胁的侵害。当犯罪分子偷取美国老年人辛苦积累的养老储蓄时，我们将利用部门掌握的工具进行反击——通过刑事起诉惩罚犯罪者，通过民事禁令关闭诈骗计划，通过资产没收追回非法所得。”


    “老年正义倡议”寻求为检察官、执法人员、法官、受害者专家、急救人员和民方法援助员工提供针对性的培训和资源，以更好地应对老年虐待。美国参院老年特别委员会也在努力教育老年公民及其家人了解电话和电脑诈骗的危险。坏人利用各种诈骗手段针对老年人，包括冒充美国国税局（IRS）探员，或告诉他们中中了牙买加彩票的数百万美元（但需要汇钱才能领取奖金）。


    有些骗局源于互联网，而另一些是通过电话进行的。我曾接到过一个电话，关于一个名叫马丁（Martin）的案件，他是一位 80 岁的退休律师。一天晚上，马丁接到一个电话，电话那头模糊的声音听起来像他的孙子弗雷德（Fred）。“爷爷，我遇到麻烦了，你需要帮我，”那个。马丁问弗雷德发生了什么以及他能如何帮助。弗雷德解释他在佛罗里达州春假，他的出租车司机因为后备箱有毒品被捕了。警察指控弗雷德是同犯并逮捕了他。除非弗雷德支付
    2500 美元保金，否则警察将把他关押直到两周后的审判。马丁知道孙子确实在佛罗里达州过假，开始担心起来。弗雷德恳求爷爷不要告诉他父母，因为如果父母知道他遇到麻烦会生气的。弗雷德在范德堡大学上学，他告诉爷爷下周有一场期末考试，如果错过了，这门课就会不及格。


    马丁会为家人做任何事——尤其是他心深爱的孙子。马丁问弗雷德是否需要律师，弗雷德回答说他只需要保金，并且已经找到了一个保释人。马丁同意汇钱后，弗雷德把他转接给了一个保释人，后者向他提供了如何通过西联汇（Western
    Union）汇款的说明。保释人还告诉马丁，警察已经没收了弗雷德的手机作为证据，所以给了他另一个电话号码以便在汇款后拨打。那天晚些时候，马丁去西联汇网点给保释人汇了
    2500 美元。几小时后，他又接到弗雷德的电话，要求额外支付 2500 美元交罚款，他又回到西联汇汇了更多的钱。


    幸运的是，在马丁第二次去时，西联汇的职员问他为什么要汇钱。马丁解释说他的孙子在监狱里需要帮助。职员问为什么弗雷德的父母不寄钱，他解释说他正试图为孙子隐瞒。此时，西联汇的职员担心这位老年人可能是诈骗受害者。他们一起拨打了弗雷德的手机。弗雷德接了电话：“嗨，爷爷。你好吗？”马丁问他是否已经出狱了，弗雷德听起来很困惑。弗雷德回答说他没进过监狱，一切都好。


    等马丁联系我时，已经太晚无法拿回钱了。钱早没了。追踪通过西联汇网络发送的资金极其困难，因为收件人可以在世界上任何地点取款。弄清楚发生了什么也没有费多久。坏人能够看到弗雷德的
    Facebook 个人资料，因为他将其设置为了公开（这意味着任何人都可以查看他的帖子）。在那里，他们识别了他的家人和朋友，并看到了他在佛罗里达州度假的照片。当他们调查马丁时，发现他是弗雷德的爷爷，职业是律师，住在城市里一个昂贵的地区。所有这些信息都可以通过县税收记录和职业执照获取，而这些信息可以在网上查到。由于马丁
    80 岁了，小偷通过模糊声音并假装成弗雷德进行了一次豪赌。如果坏人要求 10000 美元或 20000 美元的保金，我很确定马丁会付钱。他愿意为他心爱的孙子做任何事。


    祖父母是网络犯罪分子的容易目标。骗子利用老年人对家人的爱，以及他们往往对网络诈骗的有限认知。我曾见过祖父母被坏人盯，对方谎称他们的亲人遭遇了车祸，需要支付拖车和医疗费用。这些信息总是带有紧迫感，而且骗子声称如果不汇钱会给他们处于危险中的家人造成更大的伤害。想到这种特定的场景不仅让我心碎，更让我怒火中腾。


