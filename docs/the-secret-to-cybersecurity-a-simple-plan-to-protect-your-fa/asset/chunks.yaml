    # Time for a quiz!


    Let’s say you’ve just installed `2FA` on your email account and you’re sitting
    at the kitchen table. All of a sudden, your phone buzzes, notifying you that you’ve
    received a text message. You check the text message and see that it’s a random
    six-digit code from `Gmail`. Since you’re sitting at the table eating breakfast
    and reading email on your laptop, you know that you haven’t logged on from an
    untrusted device. What happened? Someone else tried to log in to your `Gmail`
    account from an untrusted computer, probably after somehow stealing your username
    and password.


    But, since you’d taken the time to install `2FA`, they still couldn’t break into
    your account. How did they get that far? There might have been another data breach
    at a retailer, gas station, healthcare provider, or bank, which, unfortunately,
    seems to happen every day. Or maybe a keylogger was installed on your computer
    when your in-laws were using it. A bad guy took a swing and used the username
    and password from a different account across multiple platforms. What if your
    `Gmail` password was the same as your password for a bank website? Even though
    the would-be thief wasn’t able to access your email, he might have still been
    able to use that same password to access your online banking. Hopefully, you’ve
    learned to protect yourself and not use the same passwords for every account,
    so you don’t have anything to worry about.


    Using separate passwords and `2FA` is a great start. Now that you’ve locked down
    your email account, it’s time to lock up your social media with `2FA`.


    ## HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Realize that bad guys want to use your email account
    as a weapon to attack your family, friends, work colleagues, and others.


    ![Image](images/lock.jpg) Only use email providers that offer two-factor authentication,
    such as `Gmail`, `Outlook`, and `iCloud`. You can find the providers that do and
    don’t at [www.twofactorauth.org](http://www.twofactorauth.org).


    ![Image](images/lock.jpg) Download an authenticator app like `Duo Mobile`, `Google
    Authenticator`, or `Microsoft Authenticator` on your smartphone from the Google
    Play Store or Apple App Store to randomly generate security codes rather than
    receiving them via text messages.


    ![Image](images/lock.jpg) If you’re using `2FA` through `SMS` texting, create
    a list of ten backup `2FA` codes for `Google`, and make them codes you’ll remember
    but others won’t recognize. Write them down and keep them in a safe place in case
    you lose your cell phone or can’t receive the codes when using an untrusted device.


    ![Image](images/lock.jpg) If you’re using `SMS`, make sure you contact your cellular
    provider and implement a secret `PIN` code to ensure others can’t access your
    number.


    ![Image](images/lock.jpg) Don’t access your email accounts from untrusted devices.
    Only access email from computers and mobile devices you own.


    ![Image](images/lock.jpg) Avoid `SMS`-based `2FA` for email accounts. There are
    more secure options out there, and `SMS`-based `2FA` is vulnerable to `SMS` phishing
    and `SIM` hijacking, which are still somewhat effective.


    ![Image](images/chap.jpg) Avoid `SMS`-based `2FA` for email accounts.


    ## CHAPTER 9: Social Media Safety


    SOCIAL MEDIA DRIVES EVERYTHING


    Social media is an amazing tool for both personal and professional purposes. However,
    many people around the world use platforms like `Facebook`, `Twitter`, `Instagram`,
    and `LinkedIn`. A recent survey by `Sprout Social` found that `68` percent of
    `U.S.` adults between eighteen to twenty-nine use `Facebook`. More than one million
    users use `Twitter` every day, and `Instagram` is growing rapidly.


    The way we use social media has changed everything, but it comes with risks. If
    a bad guy is able to breach your social media account, they can do irreparable
    damage. Corporate social media accounts are trusted platforms for clients, associates,
    and friends.


    ## The Risk of Compromise


    But nobody’s perfect, and let’s say, for example, that Bill’s company Facebook
    account is compromised. It happens to companies around the world every day. What
    if Bill received a spear-phished email from either an unknown or known sender
    (someone he knows), and then he clicked a link he should have stayed away from?
    Imagine, when Bill clicked the link, the bad guys installed a keylogger and stole
    his password.


    With Bill’s username and password, the hackers could easily log in to his Facebook
    account. Most organizations wouldn’t be too concerned at this point, because their
    Facebook accounts certainly don’t contain any sensitive information about their
    clients, such as date of birth, place of birth, bank accounts, credit cards, or
    Social Security numbers. But what if the hacker didn’t even want that information?
    What if he was going after something much more important? What could possibly
    be more important? Trust.


    ## Impersonation


    Now let’s assume the crook stole Bill’s identity and became an imposter. He then
    has the ability to craft a message from Bill’s Facebook account to all of his
    friends and clients, informing everyone that he has just landed a massive account
    that will take his company to new heights. Bill is so excited and grateful, the
    imposter tells them, and the only reason it happened was because of their overwhelming
    support and referrals. Bill wants to thank all of them by giving them a digital
    coupon for a free large cup of `Starbucks coffee`. Bill’s friends and clients
    only have to click a link included in the message, and they’ll be directed to
    a website where they can either print the coupon or store it electronically on
    their smartphones. Bill’s friends and clients will probably believe the message
    is legitimate because he’s successful and always generous.


    Now, the first time I ran this scenario by Bill, I asked him how many of his friends
    and clients would probably click the link and claim their free coffee. He guessed
    that 80–90 percent of them would probably do it.

    '
