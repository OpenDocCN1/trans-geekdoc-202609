  trans: '

    米勒似乎对卡罗琳产生了同情心，告诉她听起来是个好女孩。他建议说，如果她愿意当天支付 250 美元的罚款，违规记录就会从她的驾驶记录中删除，她的执照也不会被吊销。卡罗琳松了一口气，告诉警察官她会在当天晚晚些时候去警察局交罚款。但米勒告诉她，由于该违规行为涉及州警察，她需要去沃尔玛并立即通过西联汇款（Western
    Union）发送汇票。然后，他为她提供了如何汇款的说明。


    在美国的某处，一名网络犯罪分子从沙发上爬起来，穿上裤子，开车当地当地沃尔玛领取了 250 美元。自从他看了一个关于如何快速赚钱的 YouTube 视频后，他的生活就变得好转了。唯一要做的就是找到那些在
    Facebook 页面上发布过交通罚单信息的人；之后，获取他们的电话号码并不困难。这是一种轻松的生计方式，他的大多数受害者对于以如此廉价的价格脱身而感到庆幸。至少他们不会失去驾照或坐牢——尽管在这种情况下，这根本就不可能发生。


    迈克尔是一家成功服务公司的所有者。他婚姻幸福，有两个可爱的孩子，并在教会活动活跃。一天晚上，迈克尔收到一封来自带有异域亚洲名字的女性的诱人 Facebook
    消息。违背了迈克尔的直觉，他与那个女性交换了邮件。他们进行了几次在线对话并互相了解了彼此。在某个时刻，她建议他们可以通过 Skype 聊天。在五分钟内，迈克尔看到一个漂亮的年轻金发女性，看起来年龄在二十到二十五岁之间。她告诉迈克尔她的名字叫梅拉尼娅，来自南非。


    在亚洲某个偏远的村庄，一个网络犯罪勒索团的成员正在执行他们的计划。唯一需要做的就是按下按钮录制迈克尔的 Skype 通话。迈克尔锁上办公室的门是为了给自己留一点私人空间；他不知道自己正被录像。不久后，梅拉尼娅脱掉衣服开始表演性动作。她告诉迈克尔，她希望他也做同样的事情。他做了。通话结束后，他注销并回到工作中。


    几分钟后，迈克尔收到了来自梅拉尼娅的邮件，她在邮件中告诉他需要 10,000 美元来支付母亲的医疗费用。为了救她垂死的母亲，她不得不向迈克尔索钱。邮件中包含了一个迈克尔私人
    YouTube 频道的视频链接。视频质量极佳，毫无疑问，视频里赤身裸体的迈克尔正做着他不该做的事情。梅拉尼娅警告迈克尔，如果他不给她钱，视频链接就会被发送给他的
    Facebook 朋友，包括他的妻子、孩子、教友和生意伙伴。


    迈克尔在收到勒索信后应该联系执法部门，但他没有这样做。虽然失去 10,000 美元将是一个非常昂贵的教训，但迈克尔认为，为了避免公开的羞辱，这是划算的。他去银行向俄罗斯的一家银行进行了电汇。这个地点对他来说很奇怪，因为梅拉尼娅声称自己来自南非，但他得到保证，一旦支付赎金，视频就会被销毁。躲过了一颗可能摧毁他的婚姻和职业并终结他一生声誉的子弹，他感到松了一口气。


    第二天早上迈克尔醒来时仍然感到庆幸。这几乎像是一场噩梦。但是，当他检查邮件时，他发现了另一封来自梅拉尼娅的邮件。她道歉并说他寄的 10,000 美元还不够。她需要他向同一个银行账户额外转账
    35,000 美元。迈克尔大发雷霆给她发了一封愤怒的邮件，说她没有履行她的承诺。她立即回了邮件，提醒他如果不付钱会发生什么。迈克尔认为自己没有选择，于是那天下午他又给梅拉尼娅寄了另外
    35,000 美元。在接下来的几周里，迈克尔总共给她寄了 150,000 美元。


    等迈克尔拨打 FBI 办公室时，他已经走投无路了。他感到很羞辱，耗光了大部分退休储蓄，并且实际上在考虑自杀。我深信，那些坏人会在榨干迈克尔的每一分钱之前，或者更糟，在他自杀之前才停止索要。


    帕特里克二十五岁，新婚时他和妻子攒下了 50,000 美元作为第一套房子的首付款。经过多次会议、电话和邮件后，帕特里克和妻子选择了他们认为的梦想家。在房产交割前，帕特克的经纪人告诉他，他只需等待产权公司的指令，关于向哪里汇首付款。几小时后，帕特里克收到了来自一家产权公司的邮件，其中有详细的电汇指令，包括银行账户和路由号码。帕特里克去银行取出了辛苦赚来的
    50,000 美元。他将汇款指令提供给银行官员，离成为首次购房者又近了一步——至少他是这样想的。


    第二天，帕特里克收到了一封来自真实产权公司的邮件，说明了要把钱寄到哪里。帕特里克显然困惑了，因为他昨天已经汇了钱，他给经纪人发了邮件。帕特里克和他的经纪人拨打了产权公司，大家花了一段时间才达成共识。产权公司告诉帕特里克，他们没有发送昨天的邮件。帕特里克仔细查看产权公司的指令，发现路由号码和银行账户与之前的不同。通过仔细检查，他还发现邮件地址中的产权公司名称被篡改了。帕特里克联系银行拦截电汇，但为晚了。


    帕特里克显然对失去这么多钱感到恐慌，他联系了产权公司。对方律师态度很好地告诉他，他们不负责，因为他们没有发送过那封邮件。帕特里克联系了当地警察，警察告诉他收到钱的银行位于另一个州，因此不在他们的管辖范围内。帕特里克联系了州警察，州警察告诉他们没有足够的资源调查网络犯罪。他被指示通知
    FBI，并被要求前往 [www.IC3.gov](http://www.IC3.gov) 向 FBI 的网络投诉中心提交投诉。据我所知，帕特里克仍在努力追回他的钱。


    不久前，一位名叫大卫的富有老先生在互联网上比较定期单利率。他发现加利福尼亚的一家银行提供的利率具有竞争力的；虽然不是很高的利率，但比当地银行提供的要好。大卫对投资一笔巨资金感兴趣，所以即使百分之四的差距也意味着几千美元的收益。大卫联系了银行并与一名代表通话，对方在电话中态度愉快且知识丰富。在对话过程中，银行代表说服大卫通过电汇向银行汇入了
    750,000 美元。大卫遵循了那个男人的指示并收到了一封确认邮件。

