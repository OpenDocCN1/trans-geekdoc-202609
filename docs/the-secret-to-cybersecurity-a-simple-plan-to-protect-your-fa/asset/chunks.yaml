- raw: 'How did you get ransomware on your computer? You most likely received a spear-phished
    email with a link, and when you clicked the link you were taken to a website where
    the malicious payload was installed. There’s a good chance there was a vulnerability
    in one of your software programs, and either you didn’t patch the program or the
    crooks discovered it before the vendor did. Once a malicious payload is installed
    on your computer, it locates all of your important files—documents, photos, videos,
    databases, and music. The ransomware is designed to encrypt all of that information
    and lock you out; some variations of ransomware even impact your operating system
    and prevent the computer from starting. The encryption is sophisticated and usually
    unbreakable; a super computer at a university isn’t even powerful enough to defeat
    it. Ransomware can be especially damaging to your computer at work, which is probably
    connected to a network. If the network is poorly configured, the infection can
    spread through an entire organization.


    In my opinion—based on more than twenty years of investigating these types of
    crimes for the FBI—only a small percentage of these sorts of losses are ever reported
    to law enforcement because of embarrassment and fear of reputational damage. I
    have witnessed cases like these play out on an almost daily basis. Large organizations
    are getting better at recovering from these incidents, but more homeowners and
    small businesses are becoming victims of ransomware all the time. In 2017, for
    example, the FBI’s Internet Crime Complaint Center reported receiving 1,783 complaints
    identified as ransomware, with losses totaling more than $2.3 million. Those were
    only the cases that were actually reported to the FBI. Some cybersecurity firms
    have suggested that the number of ransomware attacks worldwide might be closer
    to seven hundred thousand or more annually, and Cybersecurity Ventures predicts
    ransomware damages will climb to $11.5 billion globally by 2019. Ransom demands
    are typically between $500 and $1,000 for each individual attack; the data-kidnappers
    generally ask for lowish ransoms so more will be paid. However, some ransoms have
    been much more expensive for larger companies. I had one company call me and say
    it paid $28,000 in ransom but still didn’t receive the decryption keys. In 2017,
    South Korean web provider Nayana paid three hundred and ninety-seven bitcoin—about
    $1 million U.S. at the time—to unlock more than three thousand four hundred websites
    that were encrypted with ransomware. At the time, it was the single largest-known
    payout for a ransomware attack.


    If you hadn’t heard of ransomware before, you probably learned about it on May
    17, 2017, when the WannaCry ransomware was released. It infected computers and
    networks around the world, and it certainly made a lot of people want to cry.
    WannaCry infected Windows computers with a worm that encrypted files on the hard
    drives and made them impossible for users to access. The attackers took advantage
    of a flaw in Microsoft that had previously been detected by the National Security
    Agency. Microsoft released a patch to prevent penetration, and anyone who updated
    a system had nothing to worry about. Of course, not everyone downloaded and installed
    the patch.


    WannaCry infected about two hundred thousand computers in one hundred and fifty
    countries around the world; the four most affected were Russia, Ukraine, India,
    and Taiwan. One of the largest single agencies impacted by the attack was the
    National Health Services network of hospitals in England and Scotland—as many
    as seventy thousand devices, including computers, MRI scanners, and blood-storage
    refrigerators were infected. Large companies such as Honda, Hitachi, Nissan, Renault,
    FedEx, Deutsche Bank, and LG Electronics, as well as universities in Colombia,
    Greece, Italy, and China, also reported their networks were infected with WannaCry.
    Even governments weren’t immune from the ransomware; the Russian Ministry of Internal
    Affairs, Chinese public security bureau, and state governments in India were also
    targeted. It was estimated that WannaCry caused $4 billion in damage and ransom
    worldwide.


    Healthcare providers in particular are targeted most often because their patients’
    information is so critical to operations and so sensitive in nature. In February
    2016, a hacker attacked computer systems at Hollywood Presbyterian Medical Center
    near Los Angeles. The hospital paid a $17,000 ransom in bitcoin to obtain a decryption
    key; it disputed an earlier report that hackers wanted $3.4 million. In March
    2016, cybercriminals infected more than nine thousand machines at Ottawa Hospital
    in Canada, but the hospital was able to wipe the drives and recover files from
    backups.


    Public agencies and critical infrastructure, including transportation and utilities,
    are also popular targets of ransomware. In November 2016, computer systems at
    San Francisco’s transit system, Muni, were attacked. The cybercriminals wanted
    $73,000 as ransom, but the transit authority refused to pay and restored its system
    in two days. It still suffered significant losses, though, because riders were
    allowed to ride for free during the two days the computer system was down.


    When I receive a call from ransomware victims, I tell them they’re going to be
    okay as long as they have a good recent backup. In most cases, there’s dead silence
    on the other end. If I don’t hear a word for three or four seconds, I pretty much
    know they don’t have a recent backup in place. Sending bad guys money for a decryption
    key should really be called “pay and pray,” because what you’re doing is paying
    a ransom and then praying you’ll get your stuff back. I’ve had cases in which
    victims paid and still didn’t get their money back, and others in which victims
    paid and then the crooks asked for even more money. Like the saying goes, there’s
    no honor among thieves. I try to explain to victims that it’s never a good idea
    to pay ransom; it only keeps them in business. Even worse, the money you pay them
    not only supports criminal organizations but maybe even terrorist groups. As I’ve
    said a few times already, a good backup of your data can save you a world of heartache.


    To be clear, the FBI does not support paying ransom to cybercriminals. In its
    2017 Internet Crime Report, the FBI described its policy about ransomware:


    Paying a ransom does not guarantee an organization will regain access to their
    data; in fact, some individuals or organizations were never provided with decryption
    keys after having paid a ransom. Paying a ransom emboldens the adversary to target
    other organizations for profit and provides for a lucrative environment for other
    criminals to become involved. While the FBI does not support paying a ransom,
    there is an understanding that when businesses are faced with an inability to
    function, executives will evaluate all options to protect their shareholders,
    employees, and customers.


    I couldn’t have said it better myself.


    How long can a business survive without access to its network or records? Not
    for very long. I remember receiving a call from the owner of a small accounting
    firm who called me in a panic when his files were held hostage. His firm’s IT
    company had been trying to retrieve his data for a month. To make matters worse,
    it was April 14—the day before the federal tax deadline. The hackers had frozen
    the firm’s work from the previous month. The owner of the accounting firm made
    the best case I’ve ever heard for paying ransom. “If I don’t pay the $500,” he
    told me, “then I will lose approximately $150,000 in billable work, and I’ll go
    out of business.” I wished him luck and told him I’d pray for him. Like I said,
    when you pay the ransom, you usually don’t get your stuff back.'
  fmt: "\n# Ransomware Overview\n\nHow did you get ransomware on your computer? You\
    \ most likely received a spear-phished email with a link, and when you clicked\
    \ the link you were taken to a website where the malicious payload was installed.\
    \ There’s a good chance there was a vulnerability in one of your software programs,\
    \ and either you didn’t patch the program or the crooks discovered it before the\
    \ vendor did. \n\nOnce a malicious payload is installed on your computer, it locates\
    \ all of your important files—documents, photos, videos, databases, and music.\
    \ The ransomware is designed to encrypt all of that information and lock you out;\
    \ some variations of ransomware even impact your operating system and prevent\
    \ the computer from starting. The encryption is sophisticated and usually unbreakable;\
    \ a super computer at a university isn’t even powerful enough to defeat it. Ransomware\
    \ can be especially damaging to your computer at work, which is probably connected\
    \ to a network. If the network is poorly configured, the infection can spread\
    \ through an entire organization.\n\n## The Impact and Frequency of Attacks\n\n\
    In my opinion—based on more than twenty years of investigating these types of\
    \ crimes for the FBI—only a small percentage of these sorts of losses are ever\
    \ reported to law enforcement because of embarrassment and fear of reputational\
    \ damage. I have witnessed cases like these play out on an almost daily basis.\
    \ Large organizations are getting better at recovering from these incidents, but\
    \ more homeowners and small businesses are becoming victims of ransomware all\
    \ the time. \n\nIn 2017, for example, the FBI’s Internet Crime Complaint Center\
    \ reported receiving 1,783 complaints identified as ransomware, with losses totaling\
    \ more than $2.3 million. Those were only the cases that were actually reported\
    \ to the FBI. Some cybersecurity firms have suggested that the number of ransomware\
    \ attacks worldwide might be closer to seven hundred thousand or more annually,\
    \ and Cybersecurity Ventures predicts ransomware damages will climb to $11.5 billion\
    \ globally by 2019. \n\nRansom demands are typically between $500 and $1,000 for\
    \ each individual attack; the data-kidnappers generally ask for lowish ransoms\
    \ so more will be paid. However, some ransoms have been much more expensive for\
