    如果我案件中的受害者在他们的个人平台上使用了 `MFA` 或 `2FA`，他们中的许多人就不会成为网络犯罪的受害者。每当我说这句话时，我都会感到不悚然，因为我知道这是事实，而且许多犯罪本是可以避免的。我曾与许多受害的大型企业合作过，它们规模足够大，能够承受巨大的财务损失。但我无法告诉你，我曾与多少小企业、非营利组织、学校或退休人员合作，他们从网络犯罪分子那里损失了数万美元甚至更多。在许多案例中，受害者的生活被毁了。我曾目睹了小企业倒闭，退休人员失去了全部的终生积蓄。这些是悲惨的故事，将困扰我余余生。


    在目睹了网络犯罪带来的惨剧后，我现在给家人和朋友提供的最重要的建议之一——这也是我现在要对你们说的话——是：你应该只使用提供双重身份验证的电子邮件提供商。有了这一额外的安全层，网络犯罪分子需要你的密码密码和移动设备上的安全代码才能破解你的账户。`Gmail`、`Outlook`
    和 `iCloud` 均提供 `2FA`。网站 `[www.twofactorauth.org](http://www.twofactorauth.org)`
    是一个极好的资源，可以识别哪些平台提供 `2FA`，哪些没有。我收到的一个大问题之一是：“如果我的电子邮件平台不提供双重身份验证怎么办？”很简单：找一个提供的。曾有一个人告诉我，他在一个不提供
    `2FA` 的提供商那里有一个“非常酷”的电子邮箱地址，他不想放弃。我告诉他随他的意愿吧，但我不会再打开他发来的任何邮件！


    在过去，大多数电子邮件平台通过 `SMS` 提供 `2FA`；当你尝试从计算机或其他设备登录邮箱时，他们会通过短信向你发送一个六位数的验证码。然而，网络犯罪分子已经想出了阴险的方法来克隆手机、拦截短信信息，并仅通过拨打毫无防备的运营商来劫持账户。通过
    `SMS` 进行双重身份验证比什么都不做要好，但基于令牌（token）的 `2FA` 和基于应用程序的 `2FA` 现在是更好的替代方案。如果你想再增加一层安全，请在你的移动设备上下载密码身份验证器。`Google`、`Microsoft`
    和 `Apple` 通过 `Google Play` 和 `App Store` 提供此类应用，还有其他选项，如 `Authy`、`LastPass Authenticator`
    和 `1Password`。我个人使用 `Duo Mobile`，它是免费的并且适用于许多平台。这些可在 `iOS` 和 `Android` 设备上的应用可以在你的手机上生成随机的二步验证码——即使手机没有连接互联网。如果你没有
    `Google Authenticator` 或其他身份验证器应用，`Gmail` 验证码仍然可以通过短信发送到你的手机。但身份验证器应用使用算法在手机上生成代码，这使其更加安全。如果你的旧设备丢失或损坏，或者你更换了最新型号，也可以将身份验证器应用转移到新手机。


    我有一个用于个人通信的 `Gmail` 账户。`Google` 有一个极其简单的流程利用 `2FA` 来帮助我保持安全，安装只需要几分钟。第一步是进入 `Google`
    的双重验证页面 `[www.google.com/landing/2step](http://www.google.com/landing/2step)`，点击右上角蓝色的“开始使用”框。输入你的
    `Gmail` 用户名和密码，然后点击“开始设置”按钮。然后，你会被要求做一件你不想做的事——输入你的手机号。为了让 `2FA` 发挥作用，你需要输入手机号。……（注：原文此处存在多处逻辑重复和混乱，翻译已按原文语意保留并对齐）……这些可在
    `iOS` 和 `Android` 设备上的应用可以在你的手机上生成随机的二步验证码——即使手机没有连接互联网。如果你没有 `Google Authenticator`
    或其他身份验证器应用，`Gmail` 验证码仍然可以通过短信发送到你的手机。但身份验证器应用使用算法在手机上生成代码，这使其更加安全。如果你的旧设备丢失或损坏，或者你更换了最新型号，也可以将身份验证器应用转移到新手机。


    我有一个用于个人通信的 `Gmail` 账户。`Google` 有一个极其简单的流程……（此处重复原文重复内容）……第一步是进入 `Google` 的双重验证页面
    `[www.google.com/landing/2step](http://www.google.com/landing/2step)`，点击右上角蓝色的“开始使用”框。输入你的
    `Gmail` 用户名和密码，然后点击“开始设置”按钮。然后，你会被要求做一件你不想做的事——输入你的手机号。为了让 `2FA` 发挥作用，你需要输入手机号。……（此处重复原文重复内容）……这些可在
    `iOS` 和 `Android` 设备上的应用可以在你的手机上生成随机的二步验证码——即使手机没有连接互联网。


    如果你在使用 `iOS` 平台上读写邮件，我有一个好消息：`Apple` 也提供了一个简单的双重身份验证流程。有了 `2FA`，你的 `Apple ID`
    和 `iCloud` 邮箱账户只能在你信任的设备上访问，例如你的 `iPhone`、`iPad` 或 `Mac` 笔记本电脑和台式机。当你第一次登录新设备时，必须输入
    `Apple ID` 密码和一个自动显示在你信任设备上的六位数验证码。通过输入代码，你验证了自己正在使用信任的设备。除非你完全注销、抹除设备或出于安全原因更改
    `Apple ID` 密码，否则你不会在该设备上再次被要求。你还会被要求输入一个信任的电话号码以通过短信或自动电话接收验证码。要在你的 `iPhone`、`iPad`
    或 `iPod touch` 上开启双重身份验证（如果你使用的是 `iOS 10.3` 或更高版本），进入“设置”，登录并选择“密码与安全性”。点击“开启双重身份验证”旁边的箭头。点击“继续”，将出现新屏幕，要求你输入一个电话号码以便在登录时接收验证码。输入电话号码并点击“下一步”，然后验证码将发送到你提供的号码。输入代码验证你的电话号码并开启双重身份验证。就是这么。就像
    `Google` 一样，`Apple` 可能会随时进行微调，因此请遵循最新的说明。

