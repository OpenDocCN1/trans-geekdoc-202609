- raw: 'DIANE, A MOTHER OF TWO from Franklin, Tennessee, came home from a long day
    at the office. She made dinner for her family, took a shower, and then logged
    on to her laptop. She still preferred to check her email on her computer and rarely
    accessed it on her iPhone; she preferred the much larger screen. Her fourteen-year-old
    daughter liked to tease her about using the aging computer, saying it made her
    old in the rapidly changing digital world.


    As Diane went through her Gmail account, she quickly deleted spam and advertisements
    and then noticed an email from her sister, Abigail. Diane’s sister regularly sent
    her articles about health and fitness, and this email seemed to be no different.
    The email included a hyperlink to an article about the benefits of drinking coconut
    water and its ability to reduce wrinkles. Diane always read the articles her sister
    sent, so she clicked the link about coconut water and waited for the article to
    appear. Nothing happened. She clicked again. No response. She figured her Internet
    service must be running slow again, which was the cause of most of her computer
    problems. She grew tired of waiting, read the rest of her emails, browsed a few
    of her favorite online retailers, and then it was time to watch the latest episode
    of The Walking Dead.


    Diane fought to keep her eyes open as Rick Grimes and his ragtag group tried to
    survive a zombie apocalypse on TV. Meanwhile, a zombie computer halfway around
    the world in Eastern Europe was talking to her computer. When Diane clicked the
    hyperlink to the article about coconut water, she was redirected to a computer
    controlled by a cybercriminal. Once connected, the computer loaded a malicious
    program called a keylogger onto Diane’s machine. A keylogger, sometimes called
    a keystroke logger or system monitor, has one job: to monitor and record each
    keystroke typed on a specific computer’s keyboard. When Diane entered a username
    and password for a website, such as Gmail, her work email account, or online banking
    account, the malicious keylogger program stole her credentials and sent them to
    the cybercriminal, who now had access to Diane’s websites. Once the bad guy obtained
    access to Diane’s bank account, he was ready to wipe out her savings.


    JONATHAN WAS A RETIRED HIGH school teacher with a love for writing and poetry.
    His pension covered his living expenses, and he supplemented his retirement income
    with his salary from a side business as a wedding photographer. Whenever Jonathan
    wasn’t taking photographs, he spent his time writing. He finally hatched an idea
    for a novel, which he believed was the idea of a lifetime. It took him eighteen
    months to write seventy-five thousand words, but he finally finished. He considered
    the crime novel to be his life’s work and was about to become a published author
    through Amazon self-publishing.


    One weekend, Jonathan was working as a photographer at a ritzy wedding. It was
    a black-tie affair, and he couldn’t believe how much money he was going to make
    in one night. It was hard work, but he’d earn as much in one night as he made
    in one week as a teacher. Once Jonathan returned home from the wedding, he downloaded
    the photos to his computer and started editing them with his photo-editing software.
    When he was finished, he saved the photos to his hard drive. Before going to bed,
    Jonathan checked his Facebook account and clicked on a link from an individual
    who wanted to become his online friend. It was from an attractive young woman
    who commented on Jonathan’s exceptional photography skills.


    Halfway around the world, there was a cybercriminal sitting in front of a laptop
    in Eastern Europe. Let’s call him Ivan. Ivan smiled as soon as Jonathan clicked
    on the link. He knew an unsuspecting American was about to have his world turned
    upside down. One of Ivan’s zombie computers had sent thousands of spear-phishing
    emails disguised as spam messages on Facebook. He targeted male Facebook users
    and offered to friend the unsuspecting victims. Ivan claimed to be an attractive
    woman who was impressed with an interest that was listed on the men’s Facebook
    pages. It was like taking candy from a baby. When Jonathan clicked on the link,
    Ivan’s computer encrypted all the information on his hard drive. Jonathan couldn’t
    regain access to his photographs or manuscript unless he paid Ivan a ransom of
    $300. Making matters worse, Ivan’s malicious program also targeted Jonathan’s
    Apple iCloud account and changed all his passwords. Even if Jonathan had previously
    backed up his information to iCloud (he didn’t), he wouldn’t be able to retrieve
    it now without paying the ransom.


    IT WAS A TYPICAL MONDAY morning for Heather, a newly hired payroll clerk at a
    large company, when she received an email from her CEO. He asked if she was enjoying
    her new job, commended her on her work so far, and told her that the payroll manager
    believed she was on the fast track for a promotion. Heather was overjoyed that
    the CEO knew her and believed she was doing a great job. The email also included
    some instructions for Heather: Since the payroll manager was out of town at a
    business conference, he needed her to complete a special project. The CEO was
    headed to a meeting with the company’s board of directors and needed a spreadsheet
    that included every employee’s name, title, birthday, address, Social Security
    number, and salary. Heather was eager for added responsibility and replied that
    she’d complete the task within the hour. She added the personal information of
    more than two thousand employees to an Excel spreadsheet and attached it to an
    email she sent to the CEO. At least that’s what she believed was happening.


    In a dirty Internet café in West Africa, a cybercriminal received Heather’s email,
    jumped out of his chair, and started celebrating. One of his spear-phished emails
    went to a payroll clerk in America requesting the W-2 information for a large
    company’s payroll. The unsuspecting payroll clerk sent him back the sensitive
    personal information of more than two thousand employees. In a room full of other
    cybercriminals, the man announced that he was selling the names, birthdays, Social
    Security numbers, addresses, and salaries for $5 each. The other cybercriminals
    started handing him money like he was a trader on Wall Street. In only twenty
    minutes, the villain walked away with more than $5,000. Within months, his criminal
    customers attempted to file federal tax returns for the victimized employees and
    access their credit card accounts.


    CAROLINE WAS A TWENTY-ONE-YEAR-OLD COLLEGE junior and was not having a great week.
    Midterms were fast approaching, she’d just had an ugly fight with her boyfriend,
    and her parents were upset that she’d recently been pulled over for speeding.
    They knew their insurance premiums were about to skyrocket. As Caroline prepared
    to leave for her next class, her cell phone rang. The caller ID indicated the
    call was coming from the local police department. Immediately, Caroline had a
    sick feeling in her stomach as she answered the phone. The caller identified himself
    as Detective Miller with the police department. He asked Caroline why she hadn’t
    yet responded to letters from the police that identified her as a driver running
    through a red light. He said the letters included a photograph taken by a traffic
    camera. Caroline told the officer that she hadn’t received the letter. The officer
    advised her that three letters had been sent to her campus address and that a
    warrant had been issued for her arrest. Her driver’s license was also going to
    be suspended for failing to appear in court. Caroline reached her breaking point
    and broke down in tears.'
