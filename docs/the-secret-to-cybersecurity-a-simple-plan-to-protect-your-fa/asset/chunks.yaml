- raw: 'There are hundreds of other similar horror stories involving password reuse
    that I could tell you about, and there’s one particular incident I haven’t been
    able to forget since retiring from the FBI. The case involved the chief financial
    officer of a large organization, a man who was quite active on Facebook. Unfortunately,
    he wasn’t careful when using social media, and he even listed his work email address
    on his Facebook page. Somehow, a bad guy gained access to his Facebook account.
    Once the cybercriminal gained access to the CFO’s Facebook page, he was also able
    to access the man’s work email. He browsed through the executive’s emails and,
    within a few hours, had a good understanding of how his employer operated. The
    criminal spoofed an email from the chief financial officer to the company’s controller,
    instructing her to pay an invoice for several thousand dollars. The controller,
    believing the email was legitimately from the CFO, followed his instructions and
    paid the invoice. Somewhere in West Africa, a cybercriminal enjoyed a very large
    payday for very little work. It could have been prevented if the CFO used different
    usernames and passwords for his Facebook account and work email.


    In August 2018, the FBI revealed another growing online threat, in which criminals
    were gaining access to employees’ work login credentials, either through phishing
    emails, spoof PDFs, telephone conversations, or other unlawful means. The bad
    actors would then gain access to payroll portals, changing bank account numbers
    and diverting direct deposits to other bank accounts or prepaid bank cards they
    controlled. In many cases, fraudulent payroll deposits were transferred from multiple
    victims’ accounts. The Bureau identified approximately seventeen such cases in
    2017 and forty-seven in 2018, with losses totaling approximately $1 million. The
    FBI said criminals were targeting universities, local school districts, healthcare,
    and commercial airlines.


    Here’s the bottom line: Having the same username and password for multiple online
    platforms is a recipe for disaster. This only makes it easier for cybercriminals
    to gain access to your email and bank accounts, which can cause financial ruin
    not only for you, but also for your employer, family, and friends.


    HOW TO AVOID BECOMING A VICTIM


    ![Image](images/lock.jpg) Do not use the same username and password for mission-critical
    accounts. This includes email, social media, cell phones, banking, and e-commerce.


    ![Image](images/lock.jpg) Don’t use Yahoo! for email. The company was the subject
    of two massive data breaches that resulted in more than three billion accounts
    being compromised. Two Russian spies were indicted for the smaller of the two
    hacks; it’s still unclear who the architect was of the larger one. I’m sorry,
    but I don’t trust Yahoo! to protect your online personal identity.


    ![Image](images/lock.jpg) Ensure that your login credentials used for payroll
    purposes differ from those used for other online platforms. If a bad guy obtains
    your payroll information, he’ll be collecting your hard-earned money.


    ![Image](images/lock.jpg) If you need to write down passwords to remember them,
    encrypt them in a way that is easy for you to remember but makes them indecipherable
    by anyone else. We’ll talk more about this in the following chapter.


    ![Image](images/lock.jpg) Use a different password for every website. If you have
    only one password, it’s too easy for a criminal to break in to gain access to
    everything.


    ![Image](images/lock.jpg) Don’t recycle passwords, such as bigbomber1, bigbomber2,
    bigbomber3. Make sure your passwords are unique.


    ![Image](images/lock.jpg) Never disclose your username and passwords to someone
    else, even if it’s a family member or close friend. If you believe someone else
    knows your login credentials, change them immediately. While a friend or family
    member probably won’t want to do you harm, someone who steals from them might
    gain access to your credentials.


    ![Image](images/chap.jpg)


    ## CHAPTER 7:


    ## Strong Passwords


    WHETHER WE LIKE THEM OR not, passwords have become a part of our everyday lives.
    We need them to unlock our cell phones and computers, access cash from ATMs, and
    stream movies from Netflix. The average American is going to have somewhere between
    ten to twenty mission-critical accounts at various points in his or her life,
    whether they’re email, banking websites, social media, or credit cards. You need
    a unique password for every one of them. When I make this comment during my presentations,
    most people in the audience give me a look that says, That’s too hard. If you
    think that’s difficult, just wait until I tell you what a good password is.


    Before we get into how to set up a strong, secure password, let’s discuss what
    a bad password would be. My son Aidan was born in 2002 and his brother Quinn came
    along in 2005. Do you think I’ve ever used the passwords “Aidan2002” and “Quinn2005”?
    I have. They were easy to remember and at least I was using two passwords instead
    of one. Then I came up with a third password that nobody could possibly ever guess;
    it included my initials, my wife’s initials, and the date of our anniversary.
    As someone who used three passwords for everything, I’m guessing I was probably
    doing better than 95 percent of the U.S. population—but it still wasn’t nearly
    enough to prevent cybercriminals from hacking my accounts. Think about your passwords
    for a second. How many passwords do you use for multiple platforms? I’m guessing
    they’re all probably the same (or a slight variation of each other), and I bet
    they’re related to significant things in your life, such as your children, birthdays,
    anniversaries, pets, or hometown. I hate to tell you this, but those are absolutely
    terrible passwords, and I was as guilty as anyone of using them.


    In my opinion, a good password is typically at least twelve characters in length
    and must contain an upper- and lowercase letter, numbers, and at least one special
    character. If you want a really great password, make it fifteen characters. And,
    to make it even more unique, a password shouldn’t contain any words that you can
    find in a dictionary. Now, many members of the techie community might argue that
    twelve characters isn’t enough and that strong passwords should be fifteen, twenty,
    or even twenty-five characters long because of threats like brute-force attacks
    (trial-and-error tools used by criminals that use automated software to generate
    a massive of number of consecutive guesses) and dictionary attacks (an automated
    attack that uses—you guessed it—every word in the dictionary). There is quite
    a bit of debate about password length and password complexity, but I’m only trying
    to come up with something stronger than “Aidan2002” and “Quinn2005.”


    Normally, when I tell people they need ten to twenty unique passwords that are
    at least twelve characters in length, they’ll say something like, “This guy is
    crazy. I can’t do that. I’m not even going to try. There’s no way I’m going to
    remember every one of them.” Then, in my best Tony Robbins or Joel Osteen voice,
    I’ll explain to them that it’s only going to take me five minutes to teach them
    a system that will change their passwords and help remember them. I’ve even taught
    my system at retirement homes, and each of the lovely men and women were able
    to do it. It’s not that hard.


    First, let’s define our objective. We have identified our mission-critical accounts,
    and now we need to devise separate passwords for each one. Each password needs
    to be twelve characters in length, contain upper- and lowercase letters, and should
    also have numbers and at least one special character. We’re also not going to
    use words that are included in the dictionary. It might sound difficult, but I’m
    positive you’ll be surprised how easy it really is.'
