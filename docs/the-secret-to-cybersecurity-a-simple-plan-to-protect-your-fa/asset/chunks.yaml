    # 洗钱骡：概述


    洗钱骡（Money Mules）为坏分子执行一项关键任务——他们洗白盗取的资金或货物，并将其转移给通常位于海外的网络犯罪分子。洗钱子会为自己的服务获得固定费用或被盗资金的定比例抽成，但他们往往在进行一次交易后就会被克扣费用或抛弃。


    ## 问题的规模


    从 2015 年 1 月到 2016 年 6 月，`FBI`互联网投诉中心表示，他们收到了 22,143 起与在线洗钱相关的投诉，总损失超过 10 亿美元。令人可怕的地方在于：即使洗钱子在不知情的情况下参与了诈骗，他们也是共犯，并面临着刑事起诉的风险。然而，在许多情况下，洗钱子非常清楚自己在做什么。


    2018 年 1 月，一名女子被指控在三场诈骗中担任中间人，这些诈骗从明尼苏达州的三个人那里盗取了超过 36 万美元。根据联邦当局的数据，第一封邮件从一个以为自己是在向迪拜买家汇款的女性那里骗取了
    205,704 美元；第二封邮件从一个以为自己是在为爱情汇款的女性那里骗取了 90,000 美元；第三封邮件则向一个寻找 `Craigslist` 的受害者发送了多笔总计
    86,000 美元的存款。洗钱骡是一个全球性问题。2017 年 11 月，`Europol`及其他国家在“洗钱骡行动”（Operation Money Mule）中逮捕了
    59 人，并识别出 59 名洗钱骡组织者。


    ## Drew 的案例


    遗憾的是，在`FBI`工作期间接受采访的大多数洗钱骡都是这些诈骗活动的不知情同犯。（注：原文中关于“不知情”与“知情”存在某些矛盾；此处保留了原文）。


    其中一个案例涉及一个被称为 Drew 的男人，他是一名`海湾战争`的残疾军人。战争带来的情感和身体创伤给 Drew 造成了沉重打击，他因为创伤后应激障碍失去了工作。在妻子和孩子离开后，Drew
    变成了一个酒鬼，无法维持一份工作。最后，他寻求了教会的帮助，生活逐渐扭转。当他在 `Craigslist` 上看到一个招聘信息时，他的祷告得到了回应。那是一份在家办公、时间灵活且不需要销售的工作。广告上说公司正在寻找具有强大财务和沟通能力的人。Drew
    通过《退伍军人权利法案》（GI Bill）获得了金融学士学位，认为这份工作是一个无法错过的机会。他用简历回复了招聘信息，随后收到一封来自自称 Bart 的人的邮件。


    小时后，Bart 声称自己是一家总部位于爱尔兰的全球性公司的首席运营官，该公司据称购买了用于石油勘探的高价钻探设备。Bart 告诉 Drew，公司正在向亚洲地区扩张，需要一名在美国的执行人员在世界范围内工作。Drew
    被告诉，那里有一项培训计划，时间灵活，他可以兼职也可以全职工作。根据他的技能水平，起薪将将在每小时 31.15 美元到 67.15 美元之间，全职员工还可以享受医疗和退休福利。Drew
    觉得这简直是他幸运的一天；这份录用通知书就是他祷告的回应。


    在 Drew 接受该职位后，Bart 指导他在他居住地的一家银行开设了一个名为`Equipment Leasing International`的商业支票账户。一旦
    Drew 开了户，他就将银行名称、账号和路由号码发给了 Bart。在接下来的几天里，Bart 和 Drew 通过短信和 `Skype` 进行交流。Bart
    告诉 Drew 他将收到新设备，设备将在几天内送达。


    某晚晚上 11:30 左右，Drew 收到了 Bart 的电话，Bart 为在这么晚打电话表示歉——那是爱尔兰的早晨 6:30。Bart 听起来压力很大且非常疯狂。他告诉
    Drew 公司刚刚发现了一笔 550 万美元的汇款，需要 Drew 在银行开门后尽快将钱汇到香港的一家银行。


    第二天早晨 Drew 到达银行后，他与行长坐在一起，经理似乎对这么多钱被汇出境外表示怀疑。经理登录电脑，发现确实有一笔 550 万美元的汇款来自`中西部`的另一家银行。通过电话取得联系后，另一家银行的经理确认了笔交易是合法的；她已经联系了账户所属公司的控制员，对方表示这笔钱用于一项大型收购。行长带着大大的微笑回到
    Drew 面前，甚至提出在交易处理完成后带他去吃午饭。


    离开银行后，Drew 给 Bart 发了一条短信，告诉他钱已经汇到了香港的银行。Bart 感谢 Drew 工作出色，并承诺一笔大额奖金将在几小时内进入他的账户。Drew
    无法相信这个机会竟然是如此棒。多年来第一次，Drew 觉得自己正处于世界之巅。他的生活正在变得越来越好，他决定需要去教会感谢上帝赐予他所有的好运。


    与此同时，西非的一名网络犯罪分子可能也在因此跳跃庆祝。他可能可能刚刚与在香港的同事通了电话，后者确认收到了一笔来自美国银行的 550 万美元汇款。这是一笔足以改变网络犯罪分子生活的财财。在分发了合伙人的份额并可能支付了数笔贿赂后，这个二十多岁的网络犯罪分子仍然将是他国家最富有的人之一。而且令人惊讶的是，完成这起抢劫所需的努力很少，风险也极小。


    ## 后果


    几周后，`FBI`探员访问了 Drew 的家，并像对待一个涉嫌侵吞 550 万美元的人一样对他进行了审问。Drew 解释他没有为自己留任何钱——所有的钱都汇到了香港的银行。当一名
    FBI 探员问 Drew 为什么把钱汇到那里时，他告诉对方只是在履行职责。探员问 Drew，为什么他不觉得他的新工作要求向境外汇出大量资金很可疑——以及为什么公司会将如此大的责任交给一个新员工。Drew
    只花了几分钟就意识到参与了一场 550 万美元的诈骗，并可能面临刑事起诉。更糟糕的是，银行冻结了 Drew 的账户，并没收了里面所有的资金。


    '
