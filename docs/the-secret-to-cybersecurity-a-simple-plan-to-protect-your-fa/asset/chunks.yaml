  trans: '


    但在 AOL、Amazon 和 eBay 成为家喻户晓的时期，某种阴险的东西正在互联网的表面下涌动。2005 年，我住在华盛顿特区，在 `FBI` 总部的
    `Cyber Division` 工作。我记得 2005 年的一个晚上，回到家里后收到了一封来自大银行的邮件。这封邮件看起来很正式；它说出了问题，我的银行账户已被冻结。为了重新获得账户访问权限，邮件指示我点击一个链接并在出现的网页上输入我的
    `username`、`password`、`birthdate` 和 `Social Security number`。唯一的问题是：我在这家特定的银行并没有账户！我显然非常困惑，立即拨打了银行的客户服务部门电话并解释了情况。电话那头的人告诉我，除非我有有效的账户，否则他无法提供帮助。即使我向他解释我是一名调查网络犯罪的
    `FBI` 特探，那位客服代表还是告诉我：“抱歉，除非你有有效的账户，否则我无法提供帮助。”


    我想知道有多少毫无防备的人收到了那封邮件，并向东欧的网络犯罪分子提供了他们的账户凭据，而后者无疑清空了他们的账户。在旧俄罗斯联邦的某个地方，可能有一个骗子正坐在键盘后。他的名字听起来像
    Boris Badenov，那是老电视动画片《摇石和布尔威尔基及其朋友的冒险》中的反派。Boris 正在微笑，因为他发现了世界上最简单的骗局手段之一。如果
    Boris 现在今天给你打电话，并用他那深重的俄语口音向你索要 `username` 和 `password`，你肯定会挂掉他的电话。所以 Boris 可能会执行计划
    B。他会给你发一封邮件索要这些信息，但他并不笨到会用 `borisbadenov@cybercriminal.com` 这样的邮箱地址发送。这可不是什么住在他妈妈地下室的青少年黑客；他是一个复杂的网络犯罪分子，可能与外国政府或有组织犯罪集团有关。Boris
    甚至可能有一个是平面设计师的朋友，而那个朋友可能足够优秀，设计出一个看起来和你银行所使用的网站一模一样的网站。


    Boris 现在正在从事 `phishing`（网络钓鱼），这与运动钓鱼是不混淆的。简单来说，`phishing` 是一种欺诈行为，通过发送伪装成来自信誉良好的公司的邮件，来窃取个人信息，如
    `passwords`、`usernames` 和信用卡号。根据 `IBM’s X-Force` 研究人员的数据，每天发送的所有邮件中超过一半是垃圾邮件。`Radicati
    Group` 估计，2017 年每天发送和收到的有 2690 亿封邮件，这个数字到 2021 年底将升至 3196 亿。当海里有这么多“鱼”时，很容易理解为什么犯罪分子会如此成功。


    在我进行网络犯罪讲座时，我会向观众提出这个问题：如果你在上述情况下收到一封来自银行的邮件，观众中是否有人会提供他们的银行凭据？理当然，房间里几乎每个人都大声说“不”！然后我询问他们关于
    `iTunes`、`Amazon`、`Facebook`、`eBay`、`Google` 和 `Instagram` 账户。如果你收到其中一个提供者发来封索要你凭据的邮件，你会提供吗？今天，几乎每个人都知道，当收到任何提供者通过邮件索要凭据时，不要提供。但我无法告诉我在高中、大学甚至公民团体演讲时，当我解释这一点时，看到人们脸上那种沮丧的表情令我多么惊讶。他们看起来就像是第一次听到一样！如果你向这些账户中的任何一个提供凭据，坏就会获得账户访问权限并进行破坏。当我做演示时，我会让人们重复这句话：当在中被要求时，我绝不会向任何提供者提供我的凭据。这是一个我向孩子们解释过的概念，我确信甚至可以解释给我老母亲听——但她不需要解释。我从未给妈妈买过电脑，当十年前我终于给她买了一部手机时，我从未把她升级到连接互联网的手机。有些人可能会说我很残忍，剥夺了她生活中极大的奢侈之一，但我目睹了太多朋友的父母成为网络受害者。


    在过去的十年里，开展过许多公共服务活动，警告人们 `phishing` 的危险。遗憾的是，网络犯罪分子不会轻易放弃；他们只是改变了技术来欺骗毫无防备的人交出用户名和密码。随着计算机用户变得越来越博学，安全软件和防火墙在保护他们免受入侵方面变得越来越有效，网络犯罪分子只需创建不同的
    `malware`（恶意软件）。在植入或引入计算机或网络后，恶意软件就会执行它的肮脏工作。它可以植入计算机病毒、蠕虫、特洛伊马、勒索软件、间谍软件、广告软件、恐吓软件，谁知道还有什么。恶意软件自计算机在使用以来一直存在。第一个特洛马发布于
    1978 年，苹果系统的第一个病毒发布于 1983 年，IBM PC 电脑的第一个病毒发布于 1986 年。


    某些恶意软件会安装 `keyst logger`（键盘记录器），我在第一章中提到过。一旦击键被捕获，程序就会信息发回在线服务器，网络犯罪分子可以访问该服务器来窃取你的个人信息。苏联早在
    20 世纪 70 年代中期就开发并部署了硬件 `keylogger`，他们将其安装在 `IBM Selectric` 型打字机上。键盘记录器被秘密安装在位于莫斯科和圣彼得堡的美国大使馆和领事馆建筑内，以窃取机密。由于手动打字机对键盘记录器和其他病毒免疫，俄罗斯特工部门今天仍在使用它们！


    我在 FBI 职业期间遇到的一个键盘记录案例涉及一个名叫 Charlie 的男人，他是一家中型律师事务所的律师。他的个人邮箱收到了ر封似乎来自他银行的邮件。主题写着：“您的账户检测到可疑活动”。Charlie
    打开邮件，上面写道：


    ```

    亲爱的 Charlie，我们想通知您，银行的新安全系统检测到一笔可能正通过您的支票账户处理的可疑交易。今天上午 9:05，检测到有人从纽约布鲁克林的一个 IP
    地址登录了您的账户。该用户请求从您的银行账户中自动提取金额为 $1,875.54 的资金，支付给巴哈马的一家在线赌场。

    ```


    Charlie 在读完邮件的前几行后，Charlie 的血压急剧升高。他能感到胃里有一阵焦虑。网络犯罪分子在这次钓鱼尝试中已经抛出了鱼饵，现在 Charlie
    正悬挂在鱼线的末端，随之晃动。是时候把他拉上岸了：


    ```

    如果这笔交易是合法的，您无需采取任何操作。资金将在一小时内从您的账户中扣除。如果您没有授权这笔交易，请在一小时内联系银行。您未联系银行将导致资金从您的账户中扣除。为了防止这笔交易发生，您只需点击此邮件中的链接或拨打下方的免费电话。

    ```


    这就是我所描述的“大师级脑控术”。


    '
