  trans: '


    # 银行安全与现代挑战


    几年前，我遇到了一家年收入约 3 亿美元组织的代表，我们剖析了他们最关键的资产：其银行账户——更具体地说，是他们对银行账户的访问权限。该公司有一位信息技术经理，他的唯一职责是确保公司的技术有效高效地运行。我向他提出了一系列问题，发现公司没有使用双重身份验证，也没有专门用于处理银行业务的电脑。在会议结束时，我与公司高管进行了了深入的简报，并提出了我的顾虑。他们解释说，他们的银行不提供双重身份验证，但他们不想更换银行，因为双方有着长期的合作关系。当我提到没有专门用于处理银行业务的电脑时，公司的首席财务官抱怨说，他不喜欢在桌子上放两台电脑。最终，公司决定对现状听天由命。会议结束后，一位高管问了我一个我经常听到的问题：“为什么会有人针对我们呢？我们又不是大公司。”令人惊讶的是，他谈论的是一家年收入长达
    3 亿美元的公司。


    ## 向移动银行的转型


    我在会议上经常听到的另一个问题涉及移动设备的银行 App。为了在线和移动银行的便利，越来越多的美国人开始避开银行和信用合作社的长长排队。根据联邦金融机构检查委员会的数据，商业银行和储蓄机构的数量从
    1988 年的 13,401 家减少到 2018 年第一末的 4,852 家。为什么？因为大家都在用在线和移动银行取代传统银行。虽然美国人放弃了实体银行而选择智能手机和电脑，但报告显示，大多数人在使用在线和移动银行时仍对安全存在顾虑。当我们可以在移动设备上完成从缴费到存款支票等一切操作时，这种担忧是有理由的。


    ##安全的现实


    那么，银行 App 安全吗？几年前，我在田纳西州纳什维尔的一场大型会议上演讲，观众是来自全国各地的银行高管。我问观众有多少家银行提供 App，会厅里几乎每个人都举了手。接着我问：“你们的银行是否有内部配备的
    IT 人员开发了这些 App？”没有人举手。银行自己不写 App；他们是让别人代写。然后我问了人们经常问我的问题：“银行 App 安全吗？”我看向观众，所有人都在盯着我。现场一片死寂。我说：“得吧伙计们，这要么安全，要么不安全。”又是一片死寂。于是我问：“如果我是你们的客户呢？你们会对我说什么？”还是没有任何反应，天哪，这个问题快要让我的观众索之无味了。我终于说：“这就是我今天坐在这里的原因。我发现答案是否定的。”我对那帮银行家们撒了一个小白谎，声称在乌克兰找到了一个开发了他们许多
    App 的人。我开玩笑说，我记得我听过他说：‘是的，银行 App 是安全的’，或者他说的是‘Nyet’（俄语，意为‘不’）。


    我经常使用这个故事，因为我们并不知道全貌……（此处后续重复内容已去重）


