    # Chapter 19 - 比特币诈骗及如何避免


    区块链行业存在多种与加密货币相关的诈骗。最常见的包括敲诈勒索、虚假交易所、虚假赠送、社交媒体网络钓鱼、复制粘贴恶意软件、网络钓鱼电子邮件、庞氏骗局和传销，以及勒索软件。在本章中，我们将分析其中一些诈骗，以便你掌握不被其欺骗的知识。事实上，在涉及比特币和加密货币时，最重要的是能够保护你的资产。我们确信接下来的几页将极其重要。在新技术被引入世界之前，骗子将继续寻找新的花招来欺骗受害者。不幸的是，比特币作为一种无国界的数字货币，为加密行业的骗子提供了一个有趣的机会。比特币的去中心化特性使你能够完全控制你的代币。然而，这也使得设计适当的监管和法律框架变得更加困难，正如我们在前一章中所见。如果骗子成功说服你在使用比特币时犯错，他们可能会窃取你的
    BTC，而你几乎无法找回你的代币。话虽如此，了解骗子的运作方式并找出如何识别潜在的危险信号至关重要。有大量涉及比特币的诈骗需要警惕。在本章中，我们将讨论最常见的几种。


    ## 敲诈勒索


    敲诈勒索是许多骗子用来威胁受害者的方法，除非以某种方式获得回报，否则将披露敏感信息。这种回报通常以加密货币支付的形式出现。在这一诈骗中，犯罪分子获取受害者的敏感信息并利用它迫使他们发送比特币或其他形式的资金。避免敲诈勒索并保护你的比特币的最佳方法是，在选择登录凭证、访问哪些网站以及将信息提供给谁时要非常小心。此外，尽可能使用双重身份验证也是很大的帮助。如果你被敲诈的信息是虚假的，并且在发送付款之前发现这一点，你可能就能摆脱麻烦。


    ## 虚假交易所


    顾名思义，虚假交易所是合法加密货币交易所的欺诈性复制品。通常，这些诈骗以移动应用程序的形式出现，但你也可能会发现它们以桌面应用程序或虚假网站的形式存在。一些虚假交易所与原版非常相似，因此你需要非常小心。它们乍看之下可能似乎合法，但它们的目标是窃取你的资金。通常，这些虚假交易所通过提供免费加密货币、有竞争力的价格、最低手续费甚至礼物来吸引加密货币交易者和投资者。为了避免在虚假交易所上受骗，你应该将真实的
    URL 保存为浏览器书签，并在登录前始终仔细核对。你也可以使用 Binance Verify，这是一个允许你验证 URL、Telegram 群组、Twitter
    账户等合法性的工具。对于移动应用程序，请查看开发者信息、下载量、评论和评价。


    ## 虚假赠送


    虚假赠送是通过提供免费物品来换取少量存款，从而窃取加密货币的手段。通常，骗子会要求你先将资金发送到一个比特币地址，以便收到更多的比特币（例如，“发送 0.1
    BTC 以接收 0.5 BTC”）。但是，如果你进行这些交易，你将一无所获，并且再也找不到你的资金。涉及虚假赠送的诈骗有很多种变体。除了 BTC，一些诈骗会要求其他加密货币，例如
    ETH、BNB、XRP 和许多其他币种。在某些情况下，他们可能会要求你提供私钥或其他敏感信息。虚假赠送通常出现在 Twitter 和其他社交媒体平台上，骗子会附着在热门推文、病毒式新闻或公告上（例如协议更新或即将进行的
    ICO）。避免此类诈骗的最佳方法是，永远不要参与任何要求你先提交有价值物品的赠送活动。合法的赠送活动绝不会要求资金。


    ## 社交媒体网络钓鱼


    社交媒体网络钓鱼是一种常见的比特币诈骗，与虚假赠送一样，通常出现在社交媒体平台上。首先，骗子会创建一个类似于加密行业中具有高度权威人士的账户。之后，他们会通过推文或私信提供虚假赠送。保护自己免受社交媒体网络钓鱼的最佳方法是验证该人是否真的是他们声称的那个人。某些平台有指标可以查明，例如检查
    Twitter 和 Facebook 上的已验证账户。


    ## 复制粘贴恶意软件


    复制粘贴恶意软件是骗子用来窃取你资金的一种非常隐蔽的方法。这种类型的恶意软件会篡改你设备上的数据，如果你不小心，它会诱骗你直接将资金发送给骗子。假设你想向你的朋友
    Bob 发送一笔 BTC 付款。像往常一样，他会将他的比特币地址发送给你，以便你复制并粘贴到你的钱包中。但是，如果你的设备感染了复制粘贴恶意软件，骗子的地址将在你粘贴的那一刻自动替换
    Bob 的地址。这意味着，一旦你的比特币交易发送并确认，你就已经付给了骗子，而 Bob 将不会收到代币。为了避免此类诈骗，你需要密切关注计算机的安全性。警惕包含受感染附件或危险链接的可疑消息或电子邮件。注意你访问的网站以及在设备上安装的软件。你还应该考虑使用防病毒软件并定期扫描威胁。此外，保持设备操作系统的更新并在确认交易前手动检查地址也很重要。


    ## 网络钓鱼电子邮件


    网络钓鱼有不同类型。最常见的一种涉及网络钓鱼电子邮件，试图诱骗你下载受感染的文件或点击指向看似合法的恶意网站的链接。当这些电子邮件模拟你经常使用的产品或服务时，尤其危险。通常，骗子会包含一条敦促你采取紧急行动以保护你的账户或资金的消息。他们可能会要求你更新账户信息、重置密码或提交文件。在大多数情况下，他们的目标是获取你的登录凭证并尝试入侵你的账户。保护自己免受网络钓鱼的第一步是检查电子邮件是否来自原始来源。如果有疑问，你可以直接联系公司以确认收到的电子邮件是由他们发送的。此外，你可以将鼠标悬停在电子邮件链接上（不要点击）以检查
    URL 是否有拼写错误、不寻常的字符或其他不规则之处。即使你没有发现任何警告信号，也应该避免点击这些链接。如果你需要登录你的账户，请以其他方式进行，例如手动输入
    URL 或使用你保存的书签。


    ## 庞氏骗局和传销


    庞氏骗局和传销是两种最古老的金融诈骗。庞氏骗局是一种投资策略，使用新投资者添加的资金向长期参与的投资者分配回报。当骗子无法再引入新投资者时，资金流动就会停止。OneCoin
    是加密货币中庞氏骗局的一个很好的例子。传销是一种商业模式，根据成员引入的新成员数量向其支付报酬。当新成员耗尽时，资金也就耗尽。避免这些诈骗的最佳方法是在购买加密货币之前进行研究——无论是山寨币还是比特币。如果一种加密货币或比特币基金的价值仅取决于新投资者或成员的加入，那么它很可能是庞氏骗局或传销。


    ## 勒索软件


    勒索软件是一种恶意软件，它会锁定受害者的移动设备或计算机，或阻止他们访问重要数据，除非支付赎金（通常以 BTC 支付）。当这些攻击针对医院、机场和政府机构时，可能特别具有破坏性。通常，勒索软件会阻止访问重要文件或数据库，并威胁如果在截止日期前未付款则将删除它们。不幸的是，然而，没有保证犯罪分子会遵守他们的承诺。有一些措施可以让你保护自己免受勒索软件攻击。最佳实践如下。


    - 安装防病毒软件并保持操作系统和应用程序的更新。

    - 不要点击可疑的广告和链接。

    - 注意电子邮件附件。你应该特别警惕 `.exe`、`.vbs` 或 `.scr` 文件。

    - 定期备份你的文件，以便在遭受攻击时恢复它们。


    如你可能已经注意到，如果你不采取正确的保护措施，比特币的世界可能非常危险。但是，如果你小心谨慎并拥有正确的知识，它也是存储你财富的最安全方法。请花些时间研究这个话题，因为它与决定你的投资策略同样重要。


