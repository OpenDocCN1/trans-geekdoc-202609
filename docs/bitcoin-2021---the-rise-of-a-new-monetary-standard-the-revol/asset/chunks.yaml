    # 简介


    比特币在去年 12 月突破每枚 20,000 美元时，再次席卷全球。在经历了超过 2 年的熊市后，最著名的加密货币超越了其之前的历史最高点。许多人现在试图让自己成为专业投资者，并损失了大量资金，这只会帮助那些真正知道自己在做什么的人积累难以置信的财富，从而带来跨代的财富。要加入那些真正成功的少数投资者的行列，你需要正确的策略和正确的心态。请注意，我们并未包含大额初始资金。事实上，虽然拥有更多资金进行交易意味着拥有更强的火力，但积累比特币和建立财富并不需要数千美元。事实上，当我们开始投资比特币时，我们只有几百美元投入市场，但这笔钱在几年内为我们带来了数千美元的收益。在这本书中，你将发现所有使我们将投资技能提升到新水平的策略，以及一切帮助我们理解比特币的东西。如果你认真遵循我们的建议，我们相信你将在相对较短的时间内看到惊人的结果，因为这次牛市提供了大量的机会。请远离加密货币世界中所有花哨的东西。只需专注于比特币，深入研究它，然后像对待奶牛一样榨取它！祝你成功！Charles
    Swing 和 Masaru Nakamoto


    # 第 1 章 - 什么是比特币？


    比特币（₿, BTC, XBT）是一种加密货币，也称为加密货币。在单位面值的情况下，它写作“bitcoin”，而在点对点支付系统的情况下，它写作“Bitcoin”。该想法最初于
    2008 年 11 月由一个人或一群人以中本聪为化名提出。比特币的实现源代码于 2009 年发布。G20 将比特币视为“加密资产”。“加密资产”一词指的是“存储在电子钱包中的虚拟资产，允许接受其作为支付的用户社区在不诉诸法定货币的情况下进行交易”。


    ## 运作


    要创建和管理比特币，比特币依赖于软件。在这个软件中，比特币根据一种协议创建，该协议支付给处理过交易的代理人（称为“矿工”）。这些代理人使用他们的计算能力来验证、保护和记录交易到一个称为区块链的虚拟账本中。区块链一词来自这样一个事实：比特币的基本实体称为区块，然后这些区块被连接成一条链。对于每个新接受的区块，验证-安全-记录活动（称为挖矿）由新创建的比特币和处理过的交易的费用来报酬。


    作为一种货币或商品，比特币可以兑换成其他货币或商品、商品或服务。加密货币汇率在专业市场上设定，并根据供求法则波动。可以在专业平台、实体终端上在线购买比特币，或者与已经拥有比特币的人交换任何商品或服务（交易可以从智能手机到智能手机进行）。这些平台还使得可以实时跟踪比特币相对于其他货币或加密货币的价格演变。


    ## 记账单位


    比特币的记账单位是比特币。其发行量限制为 20,999,999.977 个单位，每个单位可分割到小数点后第八位（称为聪或 Sat）。官方货币符号于 2015
    年注册并被 Unicode 接受。交易平台使用的相应缩写是 BTC 和 XBT。使用的非官方符号包括฿和Ƀ。


    ## 去中心化


    该系统在没有中央机构或单一管理员的情况下运行。它通过网络中所有节点的共识以去中心化的方式进行管理。比特币是最大的去中心化加密货币，截至 2021 年 4 月
    5 日，其市值超过一万亿美元（2020 年 1 月 1 日为 1300 亿美元）。


    ## 支付手段


    作为一种支付手段，比特币被越来越多的商家接受，他们受到交易费用通常低于信用卡组织收取的 2%至 3%且与金融交易金额无关的鼓励。然而，在 2017 年，费用在几个月内大幅上涨，从
    2016 年的 0.2 美元到 2017 年 12 月某些天的 20 美元，以至于 Steam 平台或微软撤回了比特币作为支付方式，正是因为交易费用过高（微软于
    2018 年 1 月再次授权比特币）。为了解决交易费用过高的问题，2018 年和 2019 年各种技术增强（Segwit、闪电网络、批量交易、Schnorr）的逐步推出使得非紧急交易的费用降至约
    0.05 美元，甚至闪电网络类型交易的费用低于 0.0001 美元。与信用卡不同，任何费用都由买家承担，而不是由卖家承担，买家自愿选择支付这些费用。比特币交易是不可撤销的，无法撤销。尽管
    2014 年接受比特币的商家数量增长了 500%，但这种加密货币在零售贸易中并不十分确立，但继续在贸易中站稳脚跟。


    ## 用途


    在 2009 年 1 月至 2010 年 3 月之间，使用比特币是加密货币爱好者之间的一种爱好，比特币没有实际价值。然而，在 2010 年 4 月，比特币开始以
    0.003 美元的价格在交易所交易，不久之后，在 2010 年 5 月，它已经值 0.01 美元。几个月后，在 2010 年 7 月，其价值又增加了 0.08
    美元。这些数字反映了这种零价值的加密货币经历的价格快速上涨，达到了 10 美分。从 2009 年创建以来，直到 2013 年美国当局关闭丝绸之路，比特币主要被犯罪网络用作赌博、购买非法物质或被黑客攻击的数据库的交换媒介。这种加密货币引起了金融当局、各国立法机构（尤其是美国）和主流媒体的关注。然而，近年来，加密货币已经成熟，越来越多的研究得出结论，这些非法活动虽然仍然像任何支付系统一样存在，但只涉及加密货币交易的一小部分。美国参议院也承认比特币可以提供完全合法的金融服务。


    ## 安全的价值存储


    根据一些专家的说法，比特币更像是一种避风港，而不是一种支付手段，尽管与黄金不同，比特币确实可以用于这两种目的。相反，其他金融专家认为比特币波动太大，不足以成为避风港，但它自
    2009 年才存在，其可能的避风港地位只有在经历一段剧烈波动期后才有可能实现。至于比特币是否能达到黄金的市场价值（甚至超过它），这个问题仍然备受争议。然而，应该注意的是，凭借其万亿美元的估值，比特币离达到白银的价值并不太远，白银的价值约为
    1.4 万亿美元。


