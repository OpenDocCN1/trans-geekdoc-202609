    # 第 17 章 - 积累比特币的最佳方式


    我们已经写过一本关于比特币和加密货币交易的书，其中鼓励读者掌握高买低卖的艺术。这一次，由于我们面对的是许多初学者，我们想建议一种与主动交易相辅相成的方法。事实上，主动交易可能会带来压力、充满挑战，并且仍然可能产生不理想的结果。但是，还有其他选择。像许多投资者一样，你可能正在寻找一种不那么费力且耗时更少的投资策略。或者你更喜欢更被动的投资风格。在加密货币生态系统中，你有很多选择，包括质押、借出你的资产、参与挖矿池等等。但是，如果你想投资市场却不知道从哪里开始呢？更准确地说，建立长期头寸的最佳方式是什么？在本章中，我们将讨论一种被称为
    DCA（定投法，即美元成本平均法）的投资策略，它提供了一种简单的方法来减轻开仓所涉及的一些风险。


    ## 什么是 DCA？


    美元成本平均法是一种旨在减少波动性对资产购买影响的投资策略。它包括在固定间隔内购买等量的资产。其前提是，通过这种方式进入市场，投资可能比一次性大额购买更不受波动性影响。为什么？因为在固定间隔内购买可以平滑平均价格。从长远来看，这种策略可以减少糟糕的收入对你投资的负面影响。让我们看看美元成本平均策略是如何运作的，以及你为什么可能想考虑使用它。


    ## 美元成本平均法的优势


    美元成本平均法的主要好处是它降低了在错误时机下注的风险。市场择时是交易或投资中最困难的要素之一。通常，即使交易方向正确，时机也可能是错误的——这使得整个交易变得不准确。资本积累计划有助于降低这种风险。如果你将投资分成较小的部分，你可能会比将相同金额的资金一次性投入获得更好的结果。时机不佳地进行购买出乎意料地容易，并可能导致不理想的结果。此外，你可以消除决策过程中的一些先入之见。当你依赖美元成本平均法时，策略将为你做出决策。当然，美元成本平均法并不能完全消除风险。其理念只是让市场进入更平滑，以最大限度地降低时机错误的风险。资本积累计划绝不是成功投资的保证——还必须考虑其他因素，例如投资期限和你投资的资产。正如我们已经说过的，在市场中找到正确的时机极其困难。即使是最伟大的交易老手有时也难以读懂市场。因此，如果你使用美元成本平均策略建立了头寸，你可能还需要考虑你的退出计划，即退出头寸的交易策略。现在，如果你已经确定了目标价格（或价格范围），这可能相当简单。同样，你需要将投资平均分配，并在市场接近你的目标时开始出售。这样，你可以降低在错误时机退出的风险。但是，这完全取决于你个人的投资系统。有人采用“买入并持有”策略，其基本目标是永远不卖出，因为预计购买的资产价值将随时间继续上涨。请查看下面过去一个世纪道琼斯工业平均指数的表现。
    ![](img/image_rsrc1U5.jpg) 尽管存在短期衰退，道琼斯指数一直处于持续上升趋势。买入并持有策略的目的是进入市场并保持头寸足够长的时间，以消除时机的重要性。但是，重要的是要指出，这种策略通常面向股票市场，可能不适用于加密货币市场。请记住，道琼斯指数的表现与现实世界经济相关。其他资产类别的表现会非常不同，尤其是如果它们完全由投机支持。我们并不是说比特币也是这种情况。恰恰相反，在这种情况下，美元成本平均策略效果很好。


    ## 美元成本平均策略示例


    让我们通过一个示例来看看这个策略。假设你有一笔固定的 10,000 美元，并且我们认为投资比特币是一个合理的赌注。你也相信价格有很大机会留在当前区域，这是一个使用美元成本平均策略建立和发展头寸的好点子。你可以将
