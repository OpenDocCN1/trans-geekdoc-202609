    allow you to "hide" all the moving parts of a Bitcoin transaction that includes
    such complexities. Therefore, even if the transactions adopt these functions,
    they will appear as a single transaction. This is a big win for Bitcoin privacy
    advocates. In fact, Taproot allows you to completely hide the execution of a Bitcoin
    script. For example, spending Bitcoin using Taproot can make a transaction in
    a Lightning Network channel, a peer-to-peer transaction, or a sophisticated smart
    contract indistinguishable. However, it should be noted that this does not change
    the fact that the wallets of the initial sender and the final recipient will be
    exposed. The Taproot proposal was initially presented by Greg Maxwell, developer
    of Bitcoin Core, in January 2018. In October 2020, Taproot was integrated into
    the Bitcoin Core library after a pull request from Pieter Wuille. To fully implement
    the update, node operators must adopt Taproot''s new consensus rules. Depending
    on this dynamic, the actual implementation could take months. The benefits of
    Taproot for Bitcoin As we have already mentioned, Taproot will bring major  improvements
    to Bitcoin''s privacy. Combined with Schnorr''s signatures, Taproot could also
    increase the efficiency in executing transactions. In addition to increased privacy,
    other potential benefits include the following. ●     Reduced amount of data to
    be transferred and stored in the blockchain; ●      More transactions per block
    (higher transactions per second rate); ●      Reduced transaction costs. Another
    advantage of Taproot is the fact that signatures will no longer be malleable,
    a known security risk in the Bitcoin network. Simply put, the malleability of
    signatures means that it is technically possible to change the signature of a
    transaction before it is confirmed. By doing so, the attack would make it appear
    that the transaction never took place. This leaves Bitcoin vulnerable to the notorious
    double spend problem, which could ruin the integrity of the distributed ledger.
    As you may understand by now, Taproot is a highly anticipated and widely supported
    upgrade to Bitcoin. When implemented alongside Schnorr''s signatures, we will
    see dramatic improvements in privacy, scalability, and security. Additionally,
    these updates can generate increased interest in the Lightning Network and encourage
    multi-signature solutions as the industry standard. Regardless of the level of
    your involvement in the Bitcoin community, the benefits of improving privacy,
    efficiency and security will likely affect your experience when using Bitcoin.
    We  could not be more excited for this incredible update! '
  fmt: '

    # Chapter 23 - Taproot


    Along with Schnorr''s signatures, Taproot is a highly anticipated Bitcoin tech
    upgrade since the introduction of SegWit. Taproot''s goal is to change the way
    Bitcoin scripts operate to improve privacy, scalability and security. This and
    much more will be possible by combining Taproot with a related update, Schnorr''s
    signatures. Anyone familiar with the crypto community knows that privacy, scalability
    and security are top priorities. Even though Bitcoin is the most popular cryptocurrency
    in the world, those issues still need to be addressed. Taproot aims to do exactly
    that. Bitcoin has had its ups and downs, but it has proven to be the pillar holding
    the crypto universe in place. Regardless of incidents over the years, such as
    the hack against Mt.Gox or the famous Bitcoin hard forks, the crypto community
    has continued to support Bitcoin. However, there are certain issues that cannot
    be ignored and one of the biggest is privacy. Bitcoin is a public blockchain,
    anyone can monitor the transactions that take place on the network. For some people,
    this is a major problem. You can increase your anonymity through techniques such
    as coin mixing and CoinJoins. Unfortunately, none of these make Bitcoin a private
    currency. While the same goes for Taproot, it could help increase anonymity on
    the network. The Taproot update is considered by many to be an important first
    step in resolving Bitcoin''s lack of privacy and other related issues. But what
    exactly is Taproot, and how will it benefit Bitcoin? Let''s find it out together.


    ## What is Taproot?


    Taproot is a soft fork that improves Bitcoin scripts to increase privacy and other
    factors related to complex transactions. Transactions on the Bitcoin network can
    use various features that make them more complex, including timed issues, multi-signature
    requirements, and more. Without Taproot, anyone can identify transactions that
    use these complex features, which require the creation of multiple transactions.
    However, the Taproot update will allow you to "hide" all the moving parts of a
    Bitcoin transaction that includes such complexities. Therefore, even if the transactions
    adopt these functions, they will appear as a single transaction. This is a big
    win for Bitcoin privacy advocates. In fact, Taproot allows you to completely hide
    the execution of a Bitcoin script. For example, spending Bitcoin using Taproot
    can make a transaction in a Lightning Network channel, a peer-to-peer transaction,
    or a sophisticated smart contract indistinguishable. However, it should be noted
    that this does not change the fact that the wallets of the initial sender and
    the final recipient will be exposed. The Taproot proposal was initially presented
    by Greg Maxwell, developer of Bitcoin Core, in January 2018. In October 2020,
    Taproot was integrated into the Bitcoin Core library after a pull request from
    Pieter Wuille. To fully implement the update, node operators must adopt Taproot''s
    new consensus rules. Depending on this dynamic, the actual implementation could
    take months.


    ## The benefits of Taproot for Bitcoin


    As we have already mentioned, Taproot will bring major improvements to Bitcoin''s
    privacy. Combined with Schnorr''s signatures, Taproot could also increase the
    efficiency in executing transactions. In addition to increased privacy, other
    potential benefits include the following.


    - Reduced amount of data to be transferred and stored in the blockchain;

    - More transactions per block (higher transactions per second rate);

    - Reduced transaction costs.


    Another advantage of Taproot is the fact that signatures will no longer be malleable,
    a known security risk in the Bitcoin network. Simply put, the malleability of
    signatures means that it is technically possible to change the signature of a
    transaction before it is confirmed. By doing so, the attack would make it appear
    that the transaction never took place. This leaves Bitcoin vulnerable to the notorious
    double spend problem, which could ruin the integrity of the distributed ledger.
    As you may understand by now, Taproot is a highly anticipated and widely supported
    upgrade to Bitcoin. When implemented alongside Schnorr''s signatures, we will
    see dramatic improvements in privacy, scalability, and security. Additionally,
    these updates can generate increased interest in the Lightning Network and encourage
    multi-signature solutions as the industry standard. Regardless of the level of
    your involvement in the Bitcoin community, the benefits of improving privacy,
    efficiency and security will likely affect your experience when using Bitcoin.
    We could not be more excited for this incredible update!

    '
