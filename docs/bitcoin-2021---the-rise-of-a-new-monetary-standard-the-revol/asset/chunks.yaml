- raw: 'Chapter 13 - Storing your Bitcoin Now that you have learned where to buy your
    first bitcoin, it is time to store it properly. In fact, once the purchase is
    complete you do not want to leave your coins on an exchange. By now you should
    know that if you do not own the private key, you cannot say you actually own your
    bitcoins. Therefore, it is important to have a reliable place where you store
    and accumulate your coins for the future. In this chapter we are going to take
    a look at some of the most entrusted cryptocurrency wallets. Let’s start with
    the one we personally use to store our bitcoins: the Ledger Nano X Ledger Nano
    X In the next few pages we will consider all the important aspects to know, including
    the price of the Ledger Nano X. We will also see how to use it to keep your cryptocurrencies
    safe, keeping them offline in a device that completely protects them from any
    cyber attack. This system, we remind you, is the only one that is truly reliable:
    the online wallets of exchanges, even the most famous ones, are connected to the
    internet and are consequently exposed to cyber attacks. Hardware wallets, on the
    other hand, only connect when you need to perform operations and remain completely
    inaccessible for the rest of the time. In addition to not being able to be attacked
    from the outside, hardware wallets also protect you against the possibility that
    you lose your device. Thanks to a password system that identifies you in a unique
    way, in fact, if you lose your Ledger Nano X you just need to buy another one
    and recover all your virtual currency assets. The device is even more compact
    and lighter than the previous ones, with its just 34 grams of weight that make
    it more pocketable than a normal USB stick. The package includes the following.
    ●      The device; ●     A USB cable for connecting it to a computer or smartphone
    ●     The illustrated sheet with instructions for using the Ledger Nano X; ●    
    A strap to hang the device and possibly carry it around the neck; ●     Three
    sheets for recovering passwords, with space to mark them and instructions in case
    of loss. ![](image_rsrc1U3.jpg)As you may imagine, nothing is missing in this
    top tier product. Ledger puts us in a position to learn how to use the device
    directly thanks to the instructions in the package and moreover it gives us all
    the tools to connect it to our electronic devices. The soul of Ledger Nano X is
    BOLOS, the operating system developed by Ledger. The code is not open source,
    which means it cannot be customized by developers but it is also not accessible
    to possible attackers looking for bugs. The company jealously guards every string
    of the BOLOS code, and indeed this intuition has proved very useful over the years
    for the security of its devices. BOLOS is already installed in the Nano X microchip,
    so there is no need to do any external installation by downloading to the computer
    and passing the software via USB cable. This step, foreseen by some competing
    products, on the one hand allows everyone to download the firmware versions they
    prefer; on the other hand, unnecessarily exposing the hardware wallet to an internet
    connection increases the risk of compromise. Ledger Nano X is compatible with
    computers running Windows 8 or later, and Apple devices running Mac iOS 10.9 or
    later. It also connects to mobile devices. In particular, you need Android 7.0
    and iOS 9 to establish a successful connection. Wanting to draw a dividing line,
    we can say that it is compatible with all operating systems released or updated
    after 2017. In any case we recommend that you check the characteristics of the
    system installed on your device to make sure it is compatible with Ledger Nano
    X. Ledger Nano X can connect to your devices in two ways. First of all, as every
    other hardware walled, it is able to do this via USB cable. The novelty of this
    year, however, is the possibility of connecting the Ledger to your devices via
    Bluetooth as well. When the company announced this feature, disputes immediately
    flared up. Bluetooth connections, in fact, are much easier to attack than those
    via the internet. If the device is already designed to stay connected to the network
    for the shortest possible time, the possibility of leaving it connected to Bluetooth
    for hours does not seem very coherent with the philosophy of cryptocurrencies.
    However, Ledger has confirmed that the data transmitted via Bluetooth are public
    ones. This means that, even if stolen by someone, it cannot be useful in any way;
    all private cryptographic keys are unique and jealously guarded within the wallet,
    and never leave the device. When connected via Bluetooth or USB cable to a device,
    the Ledger Nano X acts like a piggy bank that can be used to receive or send cryptocurrencies.
    Obviously, each device must be configured using dedicated software and personal
    passwords, so that even in the event of theft, no one can connect it to their
    computer and use it at will. Even in this case, however, the connected device
    remains shielded thanks to the dedicated application that filters the passage
    of information. Thanks to this intermediation, all critical data is never transmitted
    outside the Nano X. The new Ledger is compatible with over 1,100 cryptocurrencies,
    and software updates gradually widen the range of options. Despite this, only
    100 types of different cryptocurrencies can be stored for each Nano X. While it
    is rare to find someone who needs to store more than 100 different crypto, it
    is still a limitation for some people who like to diversify their portfolios and
    act as a venture capitalist for cryptocurrencies. To add a cryptocurrency, simply
    open the Ledger Live software from any device. Once the program is open, you will
    be asked to authenticate using your credentials, thus accessing the main panel
    with all the available functions. At this point you will have to go to the catalog
    of available crypto, choosing the one you are interested in adding to our wallet.
    Once the application has been selected, its download will begin. The code will
    be transferred to your Ledger Nano X which, from that moment on, will be ready
    to host wallets of the selected cryptocurrency. To add your portfolio you will
    have to open the application and complete the process. You will be asked for the
    access keys to your wallet, and once this is done we will have correctly configured
    the storage on our device. What is important to understand is that, technically,
    cryptocurrencies are not "sent" to the Ledger, as they are not transferred from
    one wallet to another. The only thing that changes is the information on the blockchain
    that says where those funds are kept. In any case, for simplicity, we will continue
    to use the term "send" to make the subject clearer. Once you open the application,
    suppose it is that of Bitcoin, at the top you will find two buttons: "Send" and
    "Receive". By clicking on "Receive" you will display a unique code that can be
    used as a destination address for sending your Bitcoins directly to the Ledger
    Nano X. At this point it will be sufficient to use this key as the address for
    sending your cryptocurrencies. The procedure for sending varies depending on where
    you previously stored your tokens; if you buy them for the first time from an
    exchange, you can have them sent directly to the address that appears on the Ledger
    Nano X. The procedure for sending cryptocurrencies is almost similar to the previous
    one, with the only difference that you will have to click on the "Send" button
    instead of the "Receive" button. Your offline wallet will ask you for the recipient
    wallet. Once entered, just click on the "Send" button to complete the procedure.
    Thanks to the cryptocurrency applications on Ledger Nano X you have the ability
    to check your balance and your incoming and outgoing transactions at any time.
    In this way you can always have an overview of your assets and keep cash flows
    under control. There are various online stores that sell the Ledger, but it becomes
    extremely important to be able to trust the retailer. Someone, in fact, could
    sell compromised devices with the aim of stealing the coins contained inside.
    In fact, it is sufficient to update the operating system and install one with
    specially written code, to achieve this malicious effect. If you don''t want to
    take any chances, we recommend you to buy it directly on the Ledger website ([https://www.ledger.com/](https://www.ledger.com/)
    ). Trezor Trezor is a hardware wallet that connects to your computer via USB port.
    It can stock, send and receive cryptocurrencies of different types, among which
    we can mention Bitcoin, Ethereum, Ethereum  Classic, Litecoin, Namecoin, Dogecoin,
    Dash, Bitcoin Testnet and even ZCash. It includes important security features,
    such as a password manager and also a two-step authentication. It can also be
    integrated with other very popular wallets, such as MyEtherWallet and Copay, to
    securely manage even the virtual wallets that you may have opened on these specific
    platforms. Trezor is a hardware wallet with an essential design, small in size,
    easy to connect to your PC and which also comes with a small band that allows
    you to connect it directly to your keychain, making it even more comfortable to
    be carried around. ![](image_rsrc1U4.jpg)At the time of writing it is available
    in two different colors: black and white. On the front of the device you will
    also find a low resolution white on black display and the two buttons that you
    will need to go on with the operations or to cancel them. It is also possible
    to interact with all or almost all of the major  exchanges on the internet thanks
    to the software that is delivered together with the hardware wallet and above
    all thanks to the Google Chrome extension that Trezor makes available. Trezor
    offers certainly adequate security with respect to the management of wallets that
    contain important quantities of cryptocurrency within them. First of all, it allows
    you to have a backup of the wallet with a 24-word passphrase that is generated
