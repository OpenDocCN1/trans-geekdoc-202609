- raw: 'Chapter 25 - Improving the Blockchain Scalability In previous chapters we
    have mentioned the different updates that are being implemented on the Bitcoin
    blockchain to make it more scalable. In the next few pages we are going to dive
    deeper into this topic. With the term scalability we refer to the skill of a system
    to grow to satisfy an increasing request. In computer technology, you could improve
    your device''s performance by updating the hardware to make it faster in performing
    certain activities. When we talk about scalability in Blockchain, we refer to
    the growth of their ability to manage more transactions. Protocols like Bitcoin
    have many strengths, but scalability is not one of these. If Bitcoin is managed
    in a centralized database, it would be relatively easy for an administrator to
    increase speed and performance. However, the value proposals of Bitcoin (e.g.,
    resistance to censorship) require that many participants synchronize a copy of
    Blockchain. Blockchain scalability problems Performing a Bitcoin node is relatively
    cheap, and even simple devices can do it. Despite this, given that thousands of
    nodes must keep up to date with each other, there are some limits on their ability.
    Limits are fixed on the number of transactions that can be processed on-chain,
    to prevent the database from being too heavy. If it became too big too quickly,
    the nodes could not keep up. Also, if the blocks are too large, it is not possible
    to send them quickly through the  network. As a result, we are faced with an obstacle.
    A blockchain can be seen as a train service that departs at defined intervals.
    Each wagon offers limited places, and to get a ticket. Travelers must make an
    offer to earn the place. If everyone tries to get on the train at the same time,
    the price will be high. Similarly, a clogged network with pending transactions
    will require users to pay higher commissions to ensure that their transactions
    are included in reasonable times. A solution could be to enlarge the wagons. This
    would like to say more places, higher performance and lower prices for tickets.
    But there are no guarantees that places are not filled as in the previous case.
    The wagons cannot be enlarged constantly, as well as blocks on blocks and gases
    cannot expand to infinity. The latter makes it more expensive for nodes to stay
    on the network, as they need more advanced hardware to stay synchronized. The
    creator of Ethereum, the second largest cryptocurrency, Vitalik Buterin coined
    the scalability trilemma to describe the challenge that blockchains must face.
    Butterin has theorized that protocols must compromise between scalability, safety
    and decentralization. These elements are in conflict between them. In fact, by
    concentrating too much on two of the properties, you will neglect the third one.
    For this reason, many see scalability as something to reach off-chain, while security
    and decentralization should be maximized on the blockchain itself. Off-chain scalability
    solutions Off-chain scalability refers to approaches to perform transactions without
    weighing off the blockchain. Protocols that connect to the blockchain and allow
    users to send and receive funds, without transactions to appear on the main chain.
    What is a sidechain? A sidechain is a separate blockchain that is not an independent
    platform, as it is anchored in some way to the main chain. The main chain and
    the sidechain are interoperable, and the assets can flow freely from one to the
    other. There are several ways to ensure that the funds can be transferred. In
    some cases, assets are moved from the main chain by depositing them into a special
    address. In fact, they are not actually sent to the sidechain - they are instead
    blocked in the address, and a corresponding amount is issued on the sidechain.
    A more linear option is to send funds to a custody service, which exchanges the
    deposit in funds on the sidechain. However, in this case centralization could
    become an issue. The functionality of a sidechain Suppose your friend Alice has
    five bitcoins. She wants to exchange them for five equivalent units on a Bitcoin
    sidechain - let''s call it sidecoin. The sidechain in question uses a bidirectional
    anchorage, so users can transfer their own assets from the Main Chain to the Sidechain
    and vice versa. Remember that the Sidechain is a separate blockchain. Therefore,
    it  will have blocks, nodes and mechanisms of different validation. To receive
    the sidecoin, Alice sends the five bitcoins to another address. It could be owned
    by someone who will credit the five sidecoin on her address once you received
    bitcoins. Alternatively, you could present some kind of trust-minimized configuration
    where the sidecoin are automatically credited when the software detects a payment.
    Alice has now converted her coins into sidecoin, but she can always reverse the
    process to recover her bitcoins. Now that she has entered the sidechain, she is
