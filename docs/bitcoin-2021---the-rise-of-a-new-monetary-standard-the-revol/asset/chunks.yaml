    # Chapter 25 - Improving the Blockchain Scalability


    In previous chapters we have mentioned the different updates that are being implemented
    on the Bitcoin blockchain to make it more scalable. In the next few pages we are
    going to dive deeper into this topic. With the term scalability we refer to the
    skill of a system to grow to satisfy an increasing request. In computer technology,
    you could improve your device''s performance by updating the hardware to make
    it faster in performing certain activities. When we talk about scalability in
    Blockchain, we refer to the growth of their ability to manage more transactions.
    Protocols like Bitcoin have many strengths, but scalability is not one of these.
    If Bitcoin is managed in a centralized database, it would be relatively easy for
    an administrator to increase speed and performance. However, the value proposals
    of Bitcoin (e.g., resistance to censorship) require that many participants synchronize
    a copy of Blockchain.


    ## Blockchain scalability problems


    Performing a Bitcoin node is relatively cheap, and even simple devices can do
    it. Despite this, given that thousands of nodes must keep up to date with each
    other, there are some limits on their ability. Limits are fixed on the number
    of transactions that can be processed on-chain, to prevent the database from being
    too heavy. If it became too big too quickly, the nodes could not keep up. Also,
    if the blocks are too large, it is not possible to send them quickly through the
    network. As a result, we are faced with an obstacle. A blockchain can be seen
    as a train service that departs at defined intervals. Each wagon offers limited
    places, and to get a ticket. Travelers must make an offer to earn the place. If
    everyone tries to get on the train at the same time, the price will be high. Similarly,
    a clogged network with pending transactions will require users to pay higher commissions
    to ensure that their transactions are included in reasonable times. A solution
    could be to enlarge the wagons. This would like to say more places, higher performance
    and lower prices for tickets. But there are no guarantees that places are not
    filled as in the previous case. The wagons cannot be enlarged constantly, as well
    as blocks on blocks and gases cannot expand to infinity. The latter makes it more
    expensive for nodes to stay on the network, as they need more advanced hardware
    to stay synchronized. The creator of Ethereum, the second largest cryptocurrency,
    Vitalik Buterin coined the scalability trilemma to describe the challenge that
    blockchains must face. Butterin has theorized that protocols must compromise between
    scalability, safety and decentralization. These elements are in conflict between
    them. In fact, by concentrating too much on two of the properties, you will neglect
    the third one. For this reason, many see scalability as something to reach off-chain,
    while security and decentralization should be maximized on the blockchain itself.


    ## Off-chain scalability solutions


    Off-chain scalability refers to approaches to perform transactions without weighing
    off the blockchain. Protocols that connect to the blockchain and allow users to
    send and receive funds, without transactions to appear on the main chain.


    ### What is a sidechain?


    A sidechain is a separate blockchain that is not an independent platform, as it
    is anchored in some way to the main chain. The main chain and the sidechain are
    interoperable, and the assets can flow freely from one to the other. There are
    several ways to ensure that the funds can be transferred. In some cases, assets
    are moved from the main chain by depositing them into a special address. In fact,
    they are not actually sent to the sidechain - they are instead blocked in the
    address, and a corresponding amount is issued on the sidechain. A more linear
    option is to send funds to a custody service, which exchanges the deposit in funds
    on the sidechain. However, in this case centralization could become an issue.


    ### The functionality of a sidechain


    Suppose your friend Alice has five bitcoins. She wants to exchange them for five
    equivalent units on a Bitcoin sidechain - let''s call it sidecoin. The sidechain
    in question uses a bidirectional anchorage, so users can transfer their own assets
    from the Main Chain to the Sidechain and vice versa. Remember that the Sidechain
    is a separate blockchain. Therefore, it will have blocks, nodes and mechanisms
    of different validation. To receive the sidecoin, Alice sends the five bitcoins
    to another address. It could be owned by someone who will credit the five sidecoin
    on her address once you received bitcoins. Alternatively, you could present some
    kind of trust-minimized configuration where the sidecoin are automatically credited
    when the software detects a payment. Alice has now converted her coins into sidecoin,
    but she can always reverse the process to recover her bitcoins. Now that she has
    entered the sidechain, she is free to make transactions on this separate blockchain.
    She can send sidecoin or receive from others, just as it would happen on the main
    chain. She might, for example, pay Bob a sidecoin for a logo. When she wants to
    go back to Bitcoin, she could send her four remaining sidecoin to a special address.
    Once the transaction is confirmed, four bitcoins would be unlocked and sent to
    an address that you control on the main chain.


    ### Use cases of a sidechain


    Maybe you''re wondering what all this can serve. Why does not Alice directly use
    the Bitcoin blockchain? The answer is that the sidechain could be capable of things
    that bitcoin is unable to do. Blockchain are accurately organized compromise systems.
    Although Bitcoin is the safest and most decentralized cryptocurrency, it is not
    the best in terms of performance. Bitcoin transactions are faster than conventional
    methods, but still relatively slow compared to other blockchain systems. The blocks
    are mined every ten minutes, and the commissions can grow greatly when the network
    is congested. Indeed, it is likely that this level of security is not necessary
    for small daily payments. If Alice is paying a coffee, she will not wait for confirmation
    of the transaction. Her coffee would be cold before the payment is concluded.
    The sidechain are not bound by the same rules. In fact, they don''t even need
    to use the proof of work to operate. You can use any consensus mechanism, trust
    a single validator, or change any parameter. You can introduce updates that do
    not exist on the main chain, produce larger blocks and impose quick regulations.
    It is interesting to note that the sidechain could have critical bugs and it would
    not influence the underlying chain. This allows them to be used as a platform
    for experimentation and to implement functionality that would otherwise require
    consent from the majority of the network. Provided that users are satisfied with
    compromises, sidechains could be a fundamental step towards effective scalability.
    The main chain nodes must not file every transaction from the sidechain. Alice
    could enter the sidechain with a single Bitcoin transaction, run hundreds of sidecoin
    transactions, and exit the sidechain. As for the Bitcoin Blockchain, she performed
    only two transactions - one to enter and one to go out.


    ### Payment channels


    Payment channels have the same purpose as the Sidechain on the scalability front,
    but are fundamentally very different. Like the sidechain, they push the transactions
    out of the main chain to prevent the blockchain from clogging. Unlike sidechain,
    however, they do not require a separate blockchain to work. A payment channel
    uses a Smart Contract to allow users to perform transactions without publishing
    them on the blockchain. This is possible thanks to the use of an agreement imposed
    by software between the two participants.


    #### How does a payment channel work?


    In models like the famous Lightning Network, two parts first deposit the coins
    in an address they possess together. This is a multi-signature address, which
    requires two signatures to spend the funds. So, if Alice and Bob have created
    this address, the funds can only be moved with the consent of both. Suppose they
    deposit 10 BTC each at an address that now contains 20 BTCs. It would be easy
    for them to keep a budget that begins by saying that Alice and Bob have 10 BTC
    each. If Alice wants to give Bob a coin, they could update the budget indicating
    that Alice has 9 BTC and Bob has 11 BTC. They should not publish the results on
    the Blockchain until they continue to update these budgets. When they decide to
    end their transactions, they could create a transaction that sends these balances
    to the addresses in possession of the parts, sign it and transmit it. Alice and
    Bob may have registered ten, one hundred or a thousand transactions on their budget.
    But as far as the blockchain is concerned, only two on-chain operations performed:
    one for the initial transaction and the other to realize the funds at the end.
    In addition to these two, all other transactions are free and almost instant.
    There are no costs to pay for miners and no confirmation of the block to wait.
    Obviously, the example we discussed above requires the collaboration of both parties,
    a situation not ideal for two strangers. However, you can use special mechanisms
    to punish any fraud attempt, so that the parties can certainly interact without
    trusting each other.


    #### Payment routing


    Evidently the payment channels are convenient for two parts that provide a high
    volume of transactions. But it does not end here. It is possible to create a network
    of these channels to ensure that Alice can pay a participant to which it is not
    directly connected. If Bob has an open channel with Carol, Alice can pay her,
    as long as there is sufficient capacity. Alice will transmit the funds to the
    side of the Bob channel, which, in turn, will transmit them to that of Carol.
    If Carol is connected to another participant, she can do the same thing. A network
    of this type evolves in a distributed typology in which anyone is connected to
    different peers. We will often find multiple paths to a destination, and users
    can choose the most effective one. We discussed two scalability approaches that
    allow transactions to be carried out without weighing off the underlying blockchain.
    Both technologies, sidechain and payment channels, must still mature, but are
    already widely exploited by users who want to circumvent the deficiencies of transactions
    in the base level. Over time and as other users join the network, it is important
    that decentralization remains intact. This is only possible through the imposition
    of limits on the growth of the blockchain to ensure that new nodes can easily
    join. Supporters of off-chain scalability solutions believe that, over time, the
    main chain will only be used to regulate high-value transactions, or to enter/exit
    Sidechain and open/close channels.

