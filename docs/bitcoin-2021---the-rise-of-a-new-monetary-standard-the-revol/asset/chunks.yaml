- raw: 'Chapter 9 - Legal framework The legal nature of bitcoin is not a uniformly
    decided issue. The international aspect of bitcoin, with regard to the regional
    nature of the legal frameworks (European Union, United States, China, in particular),
    precludes any comprehensive legal response, in the current state of the law. In
    particular, the G20 considered that if crypto assets raise issues with regards
    to consumer and investor protection, market integrity, tax evasion, money laundering
    and terrorist financing, then they must be managed by states rather than by the
    G20 itself. European Union According to the European Central Bank, the important
    banking and financial regulations imposed on the Member States of the European
    Union do not concern bitcoin. The European banking authority warned consumers
    against the risks associated with bitcoin (December 13th, 2013), considering cryptocurrencies
    as “virtual representations” of money. It also recommended on July 4th, 2014 to
    European banking and financial institutions not to use bitcoin nor to offer services
    around it. On October 22nd, 2015, the Court of Justice of the European Union confirmed
    that bitcoin exchange transactions for traditional currencies were exempt from
    VAT, considering bitcoin as a “virtual currency” and not as a good or a service.
    Australia In December 2013, the Governor of the Central Bank of Australia (RBA)
    said in an interview on the legality of bitcoin that “there would be nothing to
    stop people from deciding to transact in another currency in a store if they wanted.
    There is no law against this, so we have competing currencies”. Australia has
    officially confirmed that bitcoin will be treated as cash on July 1st, 2017 and
    that it will no longer be subject to double taxation. Belgium The Minister of
    Finance indicated that government intervention with regard to the Bitcoin system
    does not appear to be necessary, since it is the European Union that should be
    focused on regulating this subject. The central bank of Belgium estimated in a
    statement that “the threats to monetary stability posed by digital currencies
    issued by private actors are currently rather limited, because they used as a
    medium of exchange, so that their impact on the conditions in the economy is weak”.
    China On December 5th, 2013, the Chinese Central Bank banned local banks from
    any bitcoin transaction, a measure leading to the start of a crash in the value
    of the virtual currency. BTC China, the world''s leading bitcoin transaction platform,
    prohibited users from making new deposits in Yuan into their account "following
    new government  regulations". On January 8th, 2014, the Chinese group Ali Baba
    banned bitcoin payments, in accordance with new Chinese regulations. A law established
    on September 4th, 2017 leads either to the closure of an exchange platform or
    to the end of the acceptance of fiat currencies. In February 2018, the Chinese
    government announced that it wanted to strengthen the ban through censorship of
    all Chinese or foreign bitcoin exchange websites. South Korea In South Korea bitcoin
    and cryptocurrencies are legal and recognized as financial instruments. There
    are no restrictions for holding and exchanging bitcoin between individuals. Exchange
    platforms must ensure they have at least 500 million Korean Won to protect traders
    and businesses from embezzlement and fraud. The government of South Korea has
    agreements with 14 “virtual cash” exchange platforms known as currency exchanges.
    Thanks to these agreements, these platforms only accept users whose identity is
    controlled by a financial actor such as a bank. United States The parliamentary
    report by Senator Tom Carper (February 3rd, 2014) provided a first overview of
    the legal issues of bitcoin. The report concluded on the economic interest of
    bitcoin and the need to regulate its development, in order to contain its specific
    risks. It also did not offer a firm legal definition of bitcoin. On February 26th,
    2014, US Senator Joe Manchin called for bitcoin to be banned in the United States,
    because of its uncontrolled volatility and the risk that it could be used for
    illegal purposes, in particular for money laundering. For the moment, the United
    States considered that virtual currencies developed on the bitcoin model have
    no legal value but constitute assets liable to be subject to taxes. On December
    10th, 2017, the Chicago Stock Exchange institutionalized Bitcoin, launching the
    possibility to trade Bitcoin futures. In 2018, the authorities - notably the Securities
    and Exchange Commission, and the Commodity Futures Trading Commission - prosecuted
    various actors who carried out scams such as the dangling of the possibility of
    getting rich with Bitcoin or binary options. France In France, neither the law
    nor case law has specifically and clearly regulated the nature and legal regime
    of bitcoin. For some lawyers, it is not a currency. For others, bitcoin would
    be "a currency, electronic in nature, devoid of legal tender". For the national
    commission of campaign accounts and political financing, it is a “currency without
    defined legal status”. For the Directorate General of Public Finances, bitcoin
    is considered to be a movable property, the value at purchase or sale and its
    value at the end of the fiscal year being legal. In the event that Bitcoin is
    considered to be electronic money, the rules in force for electronic money would
    apply to bitcoin (Articles  L. 133-29 et seq. 191 of the Monetary and Financial
    Code). In other cases, a legal regime for Bitcoin would have to be invented. In
    a 2014 report it was stated that virtual currency did not represent a claim on
    the issuer and was not issued against the remittance of funds, within the meaning
    of the electronic money directive, which did not give it the electronic money
    status. On the other hand, no text excludes bitcoin transactions from the tax
    obligations in force, in particular with regard to the taxation of profits or
    the collection of capital gain tax. This situation was recalled by the tax authorities
    on July 11th, 2014. Similarly, profits made in accordance with the definition
    of article 92 of the General Tax Code (CGI) are subject to taxation. In January
    2018, the Minister of the Economy, Bruno Le Maire, said he understood “the risks
    of speculation and possible embezzlement”. He entrusted a mission on bitcoin to
    Jean-Pierre Landau, former deputy governor of the Banque de France. In his report,
    Jean-Pierre Landau recommends not directly regulating crypto-currencies (except
    in the context of the fight against money laundering), to create an environment
    favorable to the development of this technology and to strictly limit the exposure
    of the financial sector to cryptocurrencies. On September 12th, 2018, France became
    the first country in the world to grant a legal framework to Initial Coin Offerings.
    Japan The central bank of Japan officially recognizes bitcoin and cryptocurrencies
    as a means of payment. In fact, article 2-5 of the amended PSA specifies that
    virtual currencies are accepted as a  means of payment without being legal currencies.
    United Kingdom Bitcoin is considered "private money". When cryptocurrencies are
    exchanged for pounds sterling or other fiat currencies, such as the euro or the
    dollar, no VAT is due. However, VAT applies for all goods and services that could
    be exchanged for bitcoins. Profits and losses made on cryptocurrencies are subject
    to capital gains tax. Russia On February 6th, 2014, Russia declared the currency
    illegal on its territory, arguing that the only official currency in Russia is
    the ruble and that no other currency can legally be used in the country. Singapore
    In December 2013, the Singapore Monetary Authority asserted that trading in goods
    and services for bitcoins constituted trade in which it was not for the authority
    to intervene. In January 2014, Singapore''s Domestic Revenue Administration released
    a set of tax guidelines according to which bitcoin transactions can be considered
    barter if they are used as a method of payment for real goods and services. Companies
    that deal in bitcoin exchanges will be taxed based on their sales levels. Swiss
    In Switzerland, the Federal Council considered that bitcoin is a virtual currency
    of marginal use, and that as such it is subject in  principle to the legislation
    of regular currencies. However, it recommends that authorities and responsible
    consumer organizations call on bitcoin users to be cautious. According to the
    Federal Council, the execution of contracts concluded in virtual currencies can
    in principle be ensured and offenses committed with these currencies are punishable.
    For example, the professional trading of virtual currencies and the operation
    of trading platforms in Switzerland fall in principle within the scope of the
    law on money laundering, which requires the identity of the person to be verified.
    However, from the Swiss point of view, there are no international standards regulating
    virtual currencies. Bitcoin will always exist, whether prohibited or advised by
    the authorities, you just need to connect to the internet by cable or satellite
    to make a transaction in your ledger. In addition, people residing in countries
    hostile to bitcoin can use a method such as those proposed by Samourai or Wasabi,
    for example, to avoid being traced. The debate around Bitcoin and terrorism Various
    opinions relating to the real or supposed link between Bitcoin and terrorism have
    been raised. On several occasions, Bitcoin has been touted as a tool that can
    be used for terrorist financing their criminal actions. In our opinion, stating
    that Bitcoin can be used for terrorism is as saying that dollars  can be used
    for the same reason. Both statements could be true, but we will never consider
    stopping using dollars because of this potential issue. '
