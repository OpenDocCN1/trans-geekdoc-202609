    of b-money, imagined by Wei Dai in 1999, and bitgold, described in 2005 by Nick
    Szabo. Bitcoin in particular solves the crucial problem of the trust model: servers
    considered serious vote with their computing power to determine the legitimate
    transaction chain. In b-money, the servers were supposed to pay a security deposit
    according to a not very explicit mechanism. The idea of ​​using a computational
    proof chain was put forward in the bitgold project although Nick Szabo only proposed
    to use a majority of addresses to establish the legitimacy of a chain of transactions,
    which left the problem of controlling the number of addresses. Satoshi Nakamoto
    claimed that he worked on bitcoin from 2007 to 2009. As early as 2008, he posted
    a document on a mailing list describing the digital currency. In February 2009,
    he published an announcement about his work on the P2P Foundation site. On January
    3, 2009, the first block or genesis block was created. In February 2009, he distributed
    the first version of the Bitcoin software on the P2P Foundation site and to operate
    the network, he used his computer and thus generated the first bitcoins. Along
    with other developers, Nakamoto continued the implementation of the software and
    its Bitcoin-Qt version until 2010. Developers and the bitcoin community gradually
    lost contact with him in the middle of 2010. On December 12, 2010, a final message
    was posted by Nakamoto on the main forum. Shortly before disappearing, Nakamoto
    designates Gavin Andresen as his successor by giving him access to the SourceForge
    bitcoin project and a copy  of the alert key. The latter is a unique private cryptographic
    key allowing to mitigate the effects of a potential attack on the Bitcoin system,
    such as the discovery of a cryptographic flaw allowing to modify the transactions,
    or the take of control of more than 51% of the nodes in the network. During an
    alert, the operators of the nodes of the network can  either warn their users
    or stop recording transactions. On September 27, 2012, the Bitcoin Foundation
    was created. Important characters from the world of new technologies quickly supported
    the project, such as Wences Casares. The identity of Satoshi Nakamoto Several
    people claimed to be Satoshi Nakamoto, but none of them could prove it. There
    is no trace of his identity before the creation of Bitcoin. On his profile, Satoshi
    claimed to be a 40-year-old Japanese. In March 2014, journalist Leah McGrath Goodman
    from Newsweek magazine announced that she had tracked down the inventor of Bitcoin
    who she said would be a 64-year-old Japanese-American whose birth name is "Satoshi
    Nakamoto", although he changed his name to “Dorian Prentice Satoshi Nakamoto”
    at the age of 23. He is believed to be a retired physicist living in California.
    This thesis was methodically dismantled a month later by linguists from Aston
    University in England who carried out an in-depth study of the linguistic correspondences
    between the written productions of the author of the Bitcoin white paper and several
    suspected personalities, notably Dorian Nakamoto. In 2016, Craig Steven Wright,
    an Australian entrepreneur, claimed  to be Satoshi Nakamoto. However, strong doubts
    remain. Adoption The history of Bitcoin adoption is quite remarkable, as it has
    been a long process of fake bans and unjustified threats to the cryptocurrency
    space. In the following pages we are going to track back the adoption process
    of Bitcoin, starting from 2012. Here are the main milestones of BTC adoption.
    ●     On November 16th, 2012, WordPress started accepting bitcoins for its paid
    services. ●     On November 28th, 2012, the remuneration of miners decreased for
    the first time, from 50 to 25 BTC. The bitcoin source code provides for a halving
    of the remuneration every two hundred and ten thousand blocks mined, or approximately
    every four years. ●     On December 6th, 2012, a partnership between the startup
    Paymium (French exchange site) and the company Aqoba (payment institution) enabled
    Paymium to operate as a payment service provider, and therefore to keep accounts
    in euros and issue payment cards usable in euros and bitcoins. On February 14th,
    2013, the Reddit community site set up a system to buy “Reddit Gold” with bitcoins.
    ●     On February 16th, 2013, the online storage site Mega, successor to Megaupload,
    started accepting payments in bitcoin. On October 14th, 2013, the giant Baidu
    (Chinese equivalent of Google) started accepting bitcoin transactions for  its
    Jiasule firewall service. ●     On October 29th, 2013, the first automatic bitcoin
    cash dispenser-exchanger went into service in Vancouver. In September 2016, more
    than seven hundred and seventy of these automatic distributor-exchangers were
    installed worldwide, including four in France. ●     On November 21st, 2013, the
    University of Nicosia announced that it accepted bitcoin and opened a master''s
    degree in economics specializing in digital currencies. On November 22nd, 2013,
    Richard Branson announced that Virgin Galactic was going to accept bitcoins as
    a means of payment for its space tourism flights. ●     On November 29th, 2013,
    Jiangsu Telecom (third largest Chinese operator), a subsidiary of China Telecom,
    started accepting bitcoins. ●     On March 25th, 2014, the US tax authorities
    declared that bitcoin should not be considered as a currency, but as a commodity,
    whose transactions are subject to taxation on capital gains. This involves taking
    into account the exchange rate at which a bitcoin has been acquired and the one
    at which it is used in order to calculate the realized gain, which makes the legal
    use of bitcoin in the United States particularly difficult. ●     On May 9th,
    2014, the United States Election Commission accepted that election campaigns could
    be funded in bitcoins up to a limit of $100 per election cycle. ●      On September
    23rd, 2014, Paypal allowed certain North American digital goods merchants selected
    by partner bitcoin payment processors to accept payments in bitcoins, and thus
    very gradually opened up to bitcoin. As of October 16th, 2017, there were Bitcoin
    ATMs around the world. ●     In December 2017, the French Minister of Public Accounts,
    Gérald Darmanin, reminded French taxpayers of the requirement to declare income,
    when it comes to capital gains realized during bitcoin transactions. ●     In
    November 2018, the Ohio government announced that it was accepting Bitcoin tax
    payments. In January 2020, an investing.com study revealed that 9% of financial
    advisers already put part of their client''s funds in bitcoin to protect them
    from monetary troubles. Important moments During the adoption phase there have
    been quite a few important moments that changed the course of Bitcoin’s life.
    Here are the most important ones. ●     On August 15th, 2010, a block was generated
    containing a transaction creating 184,467,440,737 bitcoins for three different
    addresses. This flaw is linked to the fact that the code did not foresee the case
    of creating such large amounts of bitcoins. This problem was solved automatically
    by the bitcoin blockchain and these bitcoins no longer exist. ●     On March 12th,
    2013, an incident occurred related to the non- backward compatibility of version
    0.8.0: the chain split into several versions and some remained blocked for a few
    hours. After a few moments of panic, the system was able to correct itself, signaling
    the strength of the blockchain technology. ●     On April 11th, 2013, the value
    of bitcoin collapsed from $266 to $105 before stabilizing at $160 in less than
    six hours. On April 13th, the price reached $66. This massive drop occurred after
    a big bull run, where the price of Bitcoin rose six times in just a few weeks.
    For those that are already familiar with Bitcoin’s price action, we are sure they
    are smiling just by thinking about such low prices. ●     On October 2nd, 2013,
    Ross Ulbricht was arrested. He was the alleged founder of Silk Road, which was
    shut down by the FBI and used only bitcoin for all of its transactions. More on
    that in a dedicated chapter. ●     On February 11th, 2014, the Bitcoin network
    was the victim of a massive and concerted attack launched on numerous exchange
    platforms, where quite a few bitcoins were stolen. This was just the preview of
    what was going to happen a few days later. In fact, on February 24th, 2014, the
    Mt. Gox trading platform suffered a record loss of 744,408 BTC, the equivalent
    of more than 44 billion dollars. The site was closed shortly after. A crisis management
    document has been drawn up and is publicly available on its website, we suggest
    you check it out because it is quite interesting (https://www.mtgox.com/). Due
    to this incident, bitcoin lost more than 38% of its value in the first quarter
    of 2014. On September 11th, 2015, Mark Karpelès, owner of the Mt. Gox platform
    was indicted in Japan for  embezzlement. He is suspected of having embezzled 2.3
    million dollars of bitcoin deposits. ●     In May 2016, the Gatecoin exchange
    site was hacked and had 250 bitcoins and 185,000 ether stolen. The hacker managed
    to bypass the online storage limits of the exchange platform''s assets: while
    only 5% of the deposits are not cold stored, the hacker managed to empty these
    deposits while continuing to feed the address by transfer of cold storage assets
    from the exchange platform. After this event, almost every trading and exchanging
    platform decided to implement a new protection mechanism, in order to improve
    their safety. ●     On August 3rd, 2016, the Bitfinex exchange site reported the
    theft of 119,756 bitcoins on its exchange platform, which at the time counted
    for around $65 million. ●     On May 7th, 2019, hackers stole more than 7,000
    Bitcoins from the Binance Cryptocurrency Exchange, worth over US $40 million.
    Binance CEO Zhao Changpeng said, “Hackers used a variety of techniques, including
    phishing, viruses and other attacks. They had the patience to wait and perform
    well orchestrated actions through multiple independent accounts at the most opportune
    moment”. It was this event that inspired Binance to improve its protection mechanism
    even further. All incidents related to exchange platforms only affect people who
    do not themselves hold the private keys of their bitcoin wallet. Not your keys,
    not your bitcoins as they say. As you can see, every time the Bitcoin network
    has been attacked, new solutions were found to make sure the same issue would
    not happen in the future. In our  opinion, this is one of the main strengths in
    this system. In fact, since it is developed by people, it can easily adapt to
    new hacking methods and attacks. It is pretty interesting to see the evolution
    of Bitcoin and if you want to actually invest in it safely, you need to know a
    bit of its history as well. '
