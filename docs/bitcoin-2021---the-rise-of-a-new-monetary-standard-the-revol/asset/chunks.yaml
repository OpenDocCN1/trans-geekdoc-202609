    # 第 22 章 - Schnorr 签名


    如你所知，比特币通过我们称之为椭圆曲线数字签名算法（或 ECDSA）的方式来强制执行产权。该算法允许你取一个数字（即私钥）并从中推导出公钥。这一步骤的神奇之处在于，虽然你从私钥获取公钥很简单，但反过来则是不可能的。你的私钥是你进入比特币网络的通行证。它允许你生成一个地址来接收币并稍后花费。在本章中，我们将讨论
    Schnorr 签名算法，它是 ECDSA 的一种替代方案，可能会在比特币中引入一些有趣的变化。


    ## 数字签名摘要


    数字签名的工作方式就像它们在纸笔上的祖先一样，但它们要安全得多。只要花一点时间和精力，任何人都可以伪造纸上的签名。你不能对一个稳健的数字签名方案做同样的事情，即使你有数十万年的时间。


    数字签名有几种用例。最流行的一种涉及向世界证明你写了一条特定的消息。如前所述，你可以从私钥创建公钥。为此，只需在 `secp256k1` 曲线上进行一些数学幻想即可。之后，你也可以从公钥生成公共地址。等等，你不知道
    `secp256k1` 曲线是什么？别担心，如果你刚开始学习比特币，这不值得解释，因为它与密码学的关系比与加密货币更大。你只需要知道，向任何人展示你的公钥是完全安全的。你可以将其添加到你的网站或
    Twitter 个人简介中，以允许他人验证你的身份。同样，你可以与他人共享你的公共地址以转移加密货币。


    你的私钥允许你创建数字签名。通过写一条消息并使用你的私钥对其执行操作，你创建了一条签名消息。任何人都可以审查它并将其与你的公钥进行比较，以验证它确实是由你签名的。


    ### 这与比特币有何关系？


    每当你在比特币中进行交易时，你都在数字签署一条消息，内容是“我正在发送这些之前发送给我的币”。然后，当它发送到网络上的其他节点时，它们可以检查 ECDSA
    签名是否与消息匹配。如果不匹配，节点会拒绝它。


    ## 什么是 Schnorr 签名？


    Schnorr 签名是一种不同类型的算法。它的运作方式与我们目前使用的椭圆曲线数字签名算法类似，但比它具有许多优势。Schnorr 签名实际上比 ECDSA
    更早，这导致许多人想知道为什么它们没有从一开始就集成到比特币中。一个可能的解释是，Claus P. Schnorr - 该算法的创建者 - 为其申请了专利。专利在
    2008 年初到期，比比特币白皮书发布早几个月，但该算法仍然缺乏通用标准化。出于这个原因，中本聪选择了更广泛接受的（且开源的）ECDSA。


    ## Schnorr 签名的优势


    与其他算法相比，Schnorr 签名非常简单。因此，它们比替代方案更安全。乍一看这可能意义不大，但它们还有一个强大的功能：线性。简单来说，这使得该算法对某些企业特别有吸引力
    - 特别是对于多重签名交易。


    你可能知道比特币已经支持多重签名，但方式并不理想。当你创建一个多重签名地址时，任何向你发送资金的人都不需要知道你为花费输入设置了什么条件。他们甚至可能不知道他们正在向多重签名设置发送资金。事实上，地址唯一明显的区别在于它以“3”开头。但是，当你想要移动资金时，你会揭示其性质。


    假设你使用了与 Alice 和 Bob 的 2-of-3 设置。要花费 5 BTC，你们三人都必须提供公钥和有效签名。当你将资金从地址中移出时，整个网络可以通过检查区块链来了解发生了什么。从隐私角度来看，这不是好消息。此外，如果你创建一个更大的多重签名（例如，8-of-10），你将占用区块链上的大量空间。这可能很昂贵，因为这会导致更长的交易
    - 请记住，你的交易中的字节越多，你就需要支付更多费用才能让它通过网络。


    Schnorr 签名被提出作为解决这些隐私和可扩展性问题的方案。它们允许诸如签名聚合之类的功能，将多个签名者的签名合并为一个签名。生成的“主签名”长度与正常的单个签名相同，从而带来显著的空间节省。此外，合并的签名使观察者更难确定谁签署了交易。在
    m-of-m 方案中（所有参与者都必须签名才能花费资金），你甚至无法区分单签名和多重签名交易。


    本质上，Schnorr 签名是进一步进步的重要组成部分。一旦实现，它们可以被用来改进诸如原子交换和闪电网络等加密技术。


    ## Schnorr 签名的实现


    与比特币协议的大多数更新一样，比特币用户的一般社区可能需要一些时间才能同意包含 Schnorr 签名。比特币核心贡献者 Pieter Wuille、Jonas
    Nick 和 Tim Ruffing 已提交了一份比特币改进提案（BIP）草案，但仍有工作要做。Blockstream 已经发布了一个名为 MuSig 的可能实现。通过允许签名和密钥聚合，它可能成为比特币
    Schnorr 签名算法的基础。


    Schnorr 签名可以通过软分叉集成到代码中，这是一种不会分裂网络的更改。这种分叉将是一个“选择加入”的更新。然而，假设我们将在不久的将来看到它们集成将过于乐观
    - 在达成共识之前可能需要几年时间。


    Schnorr 签名是比特币当前路线图上最受期待的目标之一。通过单次更新，它们可以提供显著的隐私和可扩展性优势。也许更有趣的是，它们还为比特币智能合约的进一步发展以及
    Taproot 等更高级的构造创造了条件，我们将在下一章中讨论。


    '
