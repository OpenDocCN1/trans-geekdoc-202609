    # Chapter 14 - The Proof of Keys Day


    As we have seen in the previous chapter, keeping your private keys safe is essential
    to ensure financial independence. Unfortunately, many cryptocurrency investors
    entrust their money exclusively to exchanges. This practice is far from safe,
    considering that exchanges have full control over cryptocurrency deposits. Since
    the early days of Bitcoin, billions have been lost due to scams and cyberattacks
    against exchanges. The hack of the Mt.Gox exchange in 2014 is one of the most
    famous and controversial cases, and is still under investigation today.


    The idea for the Proof of Keys was created by Trace Mayer, a podcaster and cryptocurrency
    investor. He created the concept as an annual celebration with the aim of encouraging
    investors to reclaim their monetary autonomy. As discussed above, many people
    leave their cryptocurrencies on exchanges. This practice is inherently dangerous
    as these exchanges have full control over the private keys of the deposit addresses.
    In this context, the Proof of Keys day aims to prevent investors from relying
    on exchanges for storing their cryptocurrencies. The concept is often presented
    with a short but effective motto: not your keys, not your Bitcoin.


    The first Proof of Keys day took place on January 3rd, 2019 - the day of the 10th
    anniversary of the genesis block on the Bitcoin network. In other words, Proof
    of Keys day celebrates financial sovereignty. Its goal is to encourage cryptocurrency
    investors to move their funds from exchanges to personal wallets. By taking full
    control over our private keys, we are assured that no one but us can access our
    funds.


    ## Results of the Proof of Keys day


    The philosophy behind the Proof of Keys day is perfectly in line with that of
    Bitcoin. By replacing third-party intermediaries with a trustless system for the
    transfer of value, individuals can confidently cooperate with each other - without
    giving up their monetary autonomy.


    ### New investors learn how to move their coins


    Cryptocurrency investors should be comfortable moving cryptocurrencies from place
    to place. While this may seem simple to some, beginners often find it difficult
    to understand the different types of wallets and how to use them. For this, the
    Proof of Keys day encourages investors to learn more about the different types
    of crypto wallets and to practice their use. It is also a reminder of how value
    is transferred within decentralized blockchain networks.


    ### Remind investors who really owns the private keys


    As already mentioned, the central mission set by Trace Mayer at the origin of
    the Proof of Keys day was to encourage every cryptocurrency investor to own their
    own private keys. Leaving cryptocurrencies on an exchange means you have zero
    control over your own funds. Even if it only happens once a year, Proof of Keys
    day is an opportunity for every investor to take control of their funds. While
    this day is a great warning about who owns what, it means very little if investors
    don''t go all out in protecting their coins.


    ### Unmasking shady or dishonest exchanges


    Financial institutions are famous for the practice known as fractional reserve.
    In essence, it is a system that allows institutions to leverage existing deposits
    by lending more money than they actually own. Unfortunately, this is risky for
    the depositor, as a "bank run" could lead to bankruptcy. In the context of the
    crypto sector, Proof of Keys day can encourage thousands of investors to withdraw
    their funds from exchanges. If a large percentage of investors decide to do this
    on the same day, they could eventually reveal exchanges that practice fractional
    reserve methods or are lying about their reserves. Fortunately, the transparency
    of Bitcoin and other blockchain networks offers exchanges a very simple way to
    make their funds publicly verifiable.


    ### Celebrating the genesis block of Bitcoin


    Last but not least, Proof of Keys day is a way to celebrate the first block mined
    on the Bitcoin network. This block is known as the genesis block. The genesis
    block contains the first Bitcoin transaction made, in which Satoshi Nakamoto sent
    50 BTC to Hal Finney. Another memorable transaction took place on May 22nd, 2010,
    when two pizzas were bought for 10,000 bitcoins. The episode is now known as the
    Bitcoin Pizza day.


    ## How to participate in the Proof of Keys movement


    It doesn''t matter if you are a newcomer or a veteran in the field of cryptocurrencies.
    Taking part in the Proof of Keys day is very simple. As we have already said,
    the idea is to declare financial autonomy by withdrawing all funds from exchanges
    (or other third party services).


    First of all, you can take an inventory of all the funds you own on cryptocurrency
    exchanges. This will give you an idea of ​​who really owns what when it comes
    to your bitcoins and altcoins. Then, find a cryptocurrency wallet that you are
    comfortable with. In addition to ease of use, it is important to consider the
    security level of each type of wallet before making your choice. Finally, send
    your funds to your personal wallet to own and control your private keys.


    Some people participate in the Proof of Keys movement once a year, moving funds
    off exchanges for one day on January 3rd to celebrate and affirm their financial
    sovereignty. This practice is common among active traders, who must hold funds
    on exchanges in order to trade. Then, after the celebration, they move the funds
    back to exchanges. However, long-term investors who do not trade in the short
    or medium term should keep funds on a personal wallet until they decide to sell
    their coins.


    Proof of Keys day is a simple but important event that reminds cryptocurrency
    investors who really owns their private keys. Millions of crypto enthusiasts join
    the celebration, moving funds off exchanges to their personal wallets. As the
    blockchain industry grows, events like Proof of Keys day will not only help educate
    the community on the importance of private key ownership, but also on security
    principles in general.

