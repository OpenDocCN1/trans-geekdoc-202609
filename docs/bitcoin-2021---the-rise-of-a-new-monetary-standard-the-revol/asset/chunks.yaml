    # Chapter 8 - The Byzantine Generals Problem


    In the previous chapters, we have mentioned the Byzantine generals problem a few
    times. In the next few pages we are going to dive deeper into this subject and
    understand why Bitcoin offers an amazing solution to this issue.


    The problem of the Byzantine generals is a computer problem on how to reach consensus
    in situations where errors are possible. In particular, in distributed computer
    systems there may be imperfect information for the failure of a component, such
    as a server, and it can appear inconsistent, non-functional and functioning for
    fault detection systems, presenting different symptoms to different observers.


    ## The problem


    The problem of the Byzantine generals refers to a problem of agreement (described
    by Leslie Lamport, Robert Shostak and Marshall Pease in their 1982 article "The
    problem of the Byzantine generals") in which a group of generals commands part
    of the Byzantine army. Surrounded by a city, these generals want to formulate
    a plan to attack it. In its simplest form, generals should only decide whether
    to attack or retreat, and some generals prefer to attack, while others prefer
    to retreat. The important thing is that each general accepts a common decision,
    as a solitary attack by some generals would result in a defeat and would be worse
    than a coordinated attack or a coordinated withdrawal.


    The problem is complicated by the presence of traitorous generals who not only
    vote for a suboptimal strategy, but can do so selectively. For example, if nine
    generals vote, four of whom support the attack while the other four are in favor
    of the withdrawal, the ninth general can send a vote of withdrawal to those generals
    in favor of the withdrawal and an attack vote to the others. Those who have received
    a vote of withdrawal from the ninth general will withdraw, while the rest will
    attack.


    The problem is further complicated by the fact that the generals are physically
    separated and must send their votes through messengers who may not report the
    votes or falsify them. Byzantine fault tolerance can be achieved if loyal (non-defective)
    generals find majority agreement on their strategy. Note that there may be a default
    vote value for lost messages. For example, missing messages can be assigned the
    value `<null>`. In addition, if the agreement provides that the `<null>` votes
    are the majority, it is possible to use a pre-established strategy (for example,
    withdrawal).


    The typical mapping of this story into computer systems is that computers are
    the generals and their connections to the digital communications system are the
    messengers. Although the problem is formulated in the analogy as a decision-making
    and security problem, in electronics it cannot be solved simply with cryptographic
    digital signatures, since errors such as incorrect voltages can be propagated
    through the encryption process. Therefore, a component may appear to be functional
    for one component and defective for another component, which prevents a consensus
    on whether the component is defective or not.


    ## Examples of Byzantine errors


    In a similar problem, bee swarms are used as an example. They have to find a new
    home, and the bees have to reach a consensus on which of the candidate homes they
    can reach. And then everyone has to fly there, with their queen. The bee approach
    works reliably, but when researchers find two houses, equally attractive by all
    bee criteria, a catastrophe occurs, the swarm breaks up and all the bees die.


    ## First solutions


    In 1982 Lamport, Shostak and Pease described several solutions. They began by
    pointing out that the problem of generals can be reduced to solve a "commander
    and lieutenant" problem in which loyal lieutenants must act in group and that
    their action must correspond to that the commander has ordered in case the commander
    is loyal. One solution considers scenarios in which messages can be falsified,
    but which will be tolerant of Byzantine flaws as long as the number of traitorous
    generals does not equal or exceed one third of the generals.


    The inability to deal with a third or more of the traitors ultimately boils down
    to proving that the problem of one commander and two lieutenants cannot be solved
    if the commander is a traitor. To see this, suppose we have a treacherous commander
    A and two lieutenants, B and C. When A tells B to attack and C to retreat, and
    B and C exchange messages, relaying the message from A, neither B nor C can find
    out who the traitor is, since it is not necessarily A. In fact, another lieutenant
    could have falsified the message presumably from A.


    It can be shown that if “n” is the number of generals in total, and “t” is the
    number of traitors in that n, there are solutions to the problem only when `n
    > 3t` and the communication is synchronous.


    A second solution requires unforced message signatures. For critical security
    systems, digital signatures (in modern computer systems, this can be achieved
    in practice using public key cryptography) can provide tolerance to Byzantine
    flaws in the presence of an arbitrary number of traitorous generals. There is
    also a variation of the first two solutions that allow for behavior tolerant to
    Byzantine errors in some situations where not all generals can communicate directly
    with each other.


    Around 1980, several system architectures that implemented Byzantine fault tolerance
    were designed. These include: Draper''s FTMP, Honeywell13''s 12 MMFC, and SRI.14''s
    SIFT.


    ## Fault tolerance


    In 1999, Miguel Castro and Barbara Liskov introduced the "BFT (Byzantine Fault
    Tolerance) algorithm. In a nutshell, Byzantine fault tolerance (BFT) is the property
    of a system that can resist the class of failures derived from the Byzantine generals
    Problem. This means that a BFT system is able to continue operating even if some
    nodes fail or act dishonestly.


    There is more than one solution to the Byzantine generals problem and, consequently,
    more than one way to build a BFT system. Likewise, there are various different
    approaches for a blockchain that intends to achieve Byzantine fault tolerance.
    This brings us to so-called consensus algorithms.


    ## Bitcoin and the BFT algorithm


    An example of BFT in use is bitcoin, a peer-to-peer digital currency system. The
    bitcoin network works in parallel to generate a Hashcash-style work test chain.
    The proof-of-work chain is the key to overcoming Byzantine failures and obtaining
    a coherent global view of the state of the system.


    We can define a consensus algorithm as the mechanism by which a blockchain network
    achieves consensus. The most common implementations are proof of work (PoW) and
    proof of stake (PoS). Let''s take the case of Bitcoin as an example. While the
    Bitcoin protocol establishes the primary rules of the system, the PoW consensus
    algorithm is what defines the way these rules are followed to reach consensus
    (for example, when verifying and validating transactions).


    Even though the concept of proof of work is older than cryptocurrencies, Satoshi
    Nakamoto developed a modified version by creating an algorithm that allowed the
    creation of Bitcoin as a BFT system. It should be remembered that the PoW algorithm
    is not 100% Byzantine fault tolerant, but thanks to the expensive mining process
    and the underlying cryptographic techniques, PoW has proved to be one of the safest
    and most reliable implementations for blockchain networks.


    In this sense, the Proof of Work consensus algorithm, designed by Satoshi Nakamoto,
    is considered by many to be one of the most ingenious solutions to the Byzantine
    Generals Problem.


    As we have seen, the Byzantine Generals Problem is an interesting dilemma that
    eventually gave rise to BFT systems, which are widely applied in different scenarios.
    In addition to the blockchain sector, some use cases for BFT systems include aviation,
    space industry and nuclear energy. In the context of cryptocurrencies, having
    efficient network communication along with a valid consensus mechanism is vital
    for any blockchain ecosystem. Securing these systems is a constant effort, and
    existing consensus algorithms have not yet managed to overcome certain limitations
    (such as scalability). Despite this, PoW and PoS are very interesting approaches
    as BFT systems, and the potential applications are certainly inspiring widespread
    innovation.

