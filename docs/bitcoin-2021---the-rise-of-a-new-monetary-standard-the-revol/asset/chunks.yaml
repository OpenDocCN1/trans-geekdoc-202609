- raw: 'Chapter 27 - Revolutionizing the Banking System Banks often act from intermediaries
    within the global economy by managing and coordinating the financial system through
    their internal registers. Given that these registers are not available to the
    public to be examined, people are forced to pay confidence in the banks and in
    their infrastructures often obsolete. Blockchain technology has the potential
    to revolutionize not only the world''s money market, but also the entire banking
    industry, eliminating these intermediaries and replacing them with a trustless,
    borderless, transparent and easy to access for everyone. Blockchain could potentially
    help make the transactions fastest and most economical, increase access to capital,
    ensure greater data security, make trustless agreements through Smart Contract,
    make compliance easier and much more. Moreover, thanks to the innovative nature
    of the blockchain, the ways in which new financial items can interact with each
    other can potentially lead to completely new types of financial services. Advantages
    of the blockchain for the banking system The blockchain offers different advantages
    that can truly help the banking system become more trustless and decentralized.
    Here are the main benefits the blockchain can provide to our financial system.
    ●     Security . Blockchain-based architecture eliminates individual error points
    and reduces the need to deliver data  into the hands of intermediaries. ●    
    Transparency . The blockchain standardizes shared processes and creates a single
    shared source of truth for all network participants. ●     Trust . Transparent
    registers allow different parts to collaborate and make agreements easier. ●    
    Programmability . The blockchain allows reliable automation of commercial processes
    through the creation and execution of smart contracts. ●     Privacy . Privacy
    Technologies made possible from BlockChain allow selective sharing of data between
    companies. ●     Performance . Networks are designed to support a large number
    of transactions, at the same time supporting interoperability between different
    chains, thus creating an interconnected blockchain network. Rapid transfer of
    funds using the blockchain Sending money into the current banking system can be
    a rather long process, can impose various commissions for banks and customers
    and can request additional checks and administration. In the instant connectivity
    era, the traditional banking system failed to keep up with the rest of technological
    developments. Blockchain technology offers a faster payment method and with lower
    commissions, available at any time, without borders and with the same security
    guarantees that the traditional system can offer. Asset tokenization on the blockchain
    Buying and selling titles and other assets, such as actions, bonds, commodity,
    currencies and derivatives, requires a complex and coordinated effort between
    banks, brokers, compensation agencies and exchange platforms. This process should
    not only be efficient, but accurate as well. The added complexity directly corresponds
    to the increase in times and costs. Blockchain technology simplifies this process
    by providing a basic technological level that makes tokenization of any type of
    asset possible. Given that much of the financial assets is bought and sold digitally
    through online brokers, the tokenization on  the blockchain seems to be a convenient
    solution for all interested parties. Some innovative blockchain companies are
    looking for physical asset tokenization, such as real estate, works of art and
    raw materials. This would make the transfer of the asset property with a convenient
    and economical process in the real world. Furthermore, it would offer new opportunities
    for investors with a limited capital, allowing them to buy a fractional property
    of expensive assets - investment products that could not be accessed before. Loan
    grant using the blockchain Banks and other loan companies have monopolized the
    credit sector, thus managing to offer loans with relatively high interest rates
    and limit access to capital based on credit scores. This makes the process of
    concession of long and expensive loans. While banks have the advantage, the economy
    depends on the supply by the banks of the funds necessary for high-cost products,
    such as cars and houses. Blockchain technology allows anyone in the world to participate
    in a new type of loan ecosystem, which is part of the movement often defined as
    decentralized finance (DEFI). To create a more accessible financial system, the
    DEFI aims to develop and offer all financial applications on the blockchain. Peer-to-peer
    money loans, allowed by the blockChain, allow everyone to lend and borrow in a
    simple, safe and inexpensive way, without arbitrary restrictions. With a more
    competitive loan sector, banks will be forced to offer better terms to their customers.
    The impact of the blockchain on global trade Participation in international trade
    is extremely evident due to a large number of international standards and regulations
    imposed on importers and exporters. Keeping track of goods and moving them through
    each phase still requires manual processes, full of documentation and handwritten
    records. Blockchain technology allows participants from commercial finance to
    provide a higher level of transparency thanks to a shared register that accurately
    monitors moving goods in the globe. Simplifying and optimizing the complex world
    of commercial finance, blockchain technology allows importers, exporters and other
    companies to save large amounts of time and money. Safe agreements via smart contract
    Contracts exist to protect people and businesses when they enter into agreements,
    but this protection has a high cost. Due to the complex nature of contracts, the
    process necessary to create one requires a lot of manual work by legal experts.
    Smart contracts allow the automation of the agreements through deterministic code
    testing tampering running on the BlockChain. Money can remain safe at ESCROW and
    is released only when certain conditions of the agreement have been met. Smart
    contracts substantially reduce the element of trust necessary to reach an agreement,
    minimizing the risks linked to financial agreements and the chances of ending
    up in court. Integrity and security of data enabled by the blockchain The sharing
    of data with trusted imminators always involves the risk that the data is compromised.
    Furthermore, many financial institutions still use paper-based storage methods,
    which significantly increases accounting costs. BlockChain technology enables
    optimized processes that automate verification and data recording, digitize KYC
    / AML data and transaction history, and makes real-time authentication of financial
    documents possible. This helps reduce operational risks, the risk of fraud, and
    reduces costs related to data management for financial institutions. The banking
    and financial sector is one of the main sectors that will be revolutionized by
    the blockchain. The potential cases of use are numerous, from real-time transactions
    to asset tokenization, loans, simpler international trade, safer digital agreements
    and much more. The resolution of all the technological and regulatory difficulties
    that hinder the potential of this new financial infrastructure seems to be  just
    a matter of time. A bank and financial system based on a trustless, transparent
    and borderless base level is the most effective tool for creating a more open
    and interconnected economy. '
