    # Chapter 5 - The Blockchain


    The blockchain of the Bitcoin system is comparable to a public ledger recording
    transactions. It exists in more than 10,000 copies managed in parallel by the
    nodes of the network, none playing a privileged role. Some copies of the register
    are stored in areas safe from any cataclysm, such as in a bunker under the mountains
    in Switzerland.


    The operator of each node in the network can decide to install a “full node” which
    builds and maintains a local copy of the blockchain. On the contrary, the operator
    can choose to be satisfied with a lightweight node which will call on the neighboring
    full nodes to validate the transactions using the `SPV` (simple payment verification)
    protocol. Since these decisions are completely decentralized, it is impossible
    to know the number of nodes of each type. The only type permanently identified
    by specialized sites such as `blockchain.info` or `bitnodes` is that of “listening
    nodes” which accept, at the time of measurement, transactions and blocks from
    other nodes. Their number hovers around 10,000. Network nodes are likely to number
    in the tens of thousands. For full nodes, the number of which matches the number
    of copies in the blockchain, estimates range from 5,000 to 30,000, located in
    85 countries on all continents. This redundancy ensures continuity of service.


    Each computer can become disconnected or crash without jeopardizing the proper
    functioning of the entire system. When it becomes operational again, the blockchain
    construction protocol it hosts automatically reconstructs the missing portion
    by resorting to neighboring nodes. As long as they have access to the Internet,
    a user will always find a node in the network to accept and relay a write-in,
    and then there will be a large number of miners and full nodes, located all over
    the world, to register that write-up and make it accessible in the blockchain,
    where it will always remain accessible from any point in the world with Internet
    access, without being able to be modified.


    This same redundancy, together with the “precautionary principle” under which
    each node of the network checks the validity of the information it receives before
    using it, makes it impossible to propagate fraudulent activities. Errors and frauds
    are still possible on a particular computer, whether caused by the operator of
    the site or by a hacker who manipulates this site; it is even possible that they
    are spread locally by contagion or by connivance. On the other hand, it is virtually
    impossible for such issues to spread to a significant percentage of the copies
    of the blockchain, let alone the entire network.


    ## The construction of the blockchain


    By receiving a new block, each computer managing a complete node executes a protocol
    leading either to the rejection of the block if it has already been received or
    if it is invalid, or to its addition to the local blockchain after a final check
    of all the writings it contains, or when it is put on hold. Each block contains
    the identifier of the block that precedes it in its miner''s blockchain and, in
    the most common case, this predecessor is the terminal block of the local chain,
    to which the new block is added after a final verification of its validity.


    The transactions contained in this new block are then validated by the node, in
    particular the one which pays in bitcoins the miner who created this block. This
    is transmitted to neighboring nodes and, step by step, to the entire network.
    In the event of failure during the verification of the validity of the block,
    it is kept pending, and is incorporated into a secondary branch of the blockchain.
    If the node receives a new block that contains a transaction already present in
    the local chain, that block is rejected. It is therefore the first valid block
    received that each node will register in its chain of blocks. Identical blocks
    built by other miners in the same 10 minute cycle will be rejected, so the miners
    race to see their blocks added to the chain and are paid accordingly.


    Due to the delay required for the blocks to propagate through the network, two
    blocks created in the same cycle can arrive in a different order depending on
    the receiving nodes, which then build different versions of the register. In this
    case, we say that there is a fork. Most of the time, a fork is temporary, and
    the blockchain construction protocol corrects it in the next cycle.


    ## The consensus mechanism


    In order for all copies of the blockchain to be identical on all nodes, even though
    they are built independently, this protocol incorporates a so-called "consensus"
    mechanism, which is a central part of the system. The rule used by Bitcoin is
    to retain the chain whose construction of the blocks that make it up has required
    the most important work. To this end, the header of each block indicates the difficulty
    of the work that was done to build it. The fact that the checksum of the block
    respects the imposed constraints constitutes the “proof of work” guaranteeing
    that this work has been carried out.


    If, after adding a block to a secondary chain, it appears that the secondary chain
    required more work than the main chain, that secondary chain should become the
    main branch. To do this, the program goes back to where it was detached from the
    main branch, revalidates the blocks and the transactions they contain one by one,
    and adds each block at the end of the new chain being processed. This very complex
    process is the real heart of the system because it is the only way to change the
    blockchain and its results are irreversible. It also provides functions such as
    the resolution of bifurcation cases and the reconstruction of the chain in the
    event of a computer or network shutdown.


    At the end of this second phase, each of the thousands of copies of the blockchain
    that exist on the complete nodes was extended by a block chosen by each node from
    among the proposals of the miners by applying the programmed consensus rule. If
    all full nodes implement the same write and block validation rules, this additional
    block is the same for all nodes, so that all copies of the blockchain remain the
    same. A few thousand new transactions are thus recorded definitively and become
    accessible on the thousands of corresponding sites.


    ## The role of cryptography


    Cryptography is used to authenticate actors, but digital data is not encrypted:
    cryptography is only used to ensure the signature.


    ### Signature keys


    To be valid, each transaction must be signed, in the cryptographic sense of the
    term, using asymmetric cryptography techniques. To this end, each bitcoin address
    also constitutes the cryptographic fingerprint of a public key. Any transaction
    indicates as input the reference of a previous transaction justifying the availability
    of funds subject to the transaction and as output one or more bitcoin addresses
    and the amounts that must be allocated to them. A transaction always balances
    its inputs and outputs.


    To transmit bitcoins, a user must cryptographically sign a transaction referring
    as input to one or more previous transactions whose output amount is sufficient
    to cover the transaction. The private key used to sign this transaction must match
    the public key that previously received bitcoins. Therefore, the user must store
    all his private keys in a confidential and secure manner. The corresponding file
    in the software, called `wallet.dat`, must be kept and saved by the user in a
    confidential manner.


    Cryptography enables the authentication and non-repudiation described above, through
    transaction signing and one-way functions. At no time does the system ensure the
    confidentiality or encryption of data transmitted over the network. All transactions
    are therefore in the clear. The signing of transactions is performed using elliptical
    curve cryptography, known as `ECDSA`. In this case, the curve used is `secp256k1`.


    ## Transparency


    Even if the software does not use any personal data of the user, anonymity is
    not guaranteed. In fact, the identity of a user can be determined if the IP address
    is traceable, or possibly as a result of a meticulous and complex statistical
    study of the transaction database, or when the regulations of a state or group
    of states take legal steps to end the anonymity of transactions on virtual currency
    platforms. However, it is possible to remain anonymous on the Bitcoin network
    with so-called "mixing" services and a good knowledge of `AML`, and `KYC` measures
    applied to exchange platforms.


    The Bitcoin system does not encrypt any of the data it uses. Cryptography is only
    used to create tamper-proof signatures and implement one-way functions. Only the
    private key wallet is likely to be encrypted by the user, but this is optional.


    ## Proof of work


    Bitcoin uses the proof of work method, initially imagined to solve the spam problem
    and in particular implemented in the `Hashcash` system. The hash algorithms are
    `SHA-256` and `RIPEMD-160`. A double hash in `SHA-256` is used to obtain the hash
    of the blocks and therefore the proof of work, while a `SHA-256` followed by a
    `RIPEMD-160` is used to construct the bitcoin addresses.

