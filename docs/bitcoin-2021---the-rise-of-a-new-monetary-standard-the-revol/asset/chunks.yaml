    # Chapter 7 - Satoshi Nakamoto


    As we have seen, the creation of the Bitcoin network is still a mystery. In this
    chapter we try to gather all the information there is regarding the identity of
    Satoshi Nakamoto. Please, keep in mind that his identity has never been revealed
    and that we can only make assumptions on who he actually is.


    Satoshi Nakamoto is the pseudonym of the inventor of the cryptocurrency Bitcoin.
    In November 2008, Satoshi Nakamoto published the Bitcoin protocol on The Cryptography
    Mailing list on the `metzdowd.com` website. In 2009 he distributed the first version
    of the client software and later contributed to the project anonymously together
    with other developers, to finally withdraw from the Bitcoin community in 2010.
    The last contact from Satoshi Nakamoto was in 2011, when he claimed to have moved
    on to other projects and left Bitcoin in good hands with Gavin Andresen.


    The theories about Satoshi Nakamoto''s true identity are numerous. Nobody knows
    if it is a "he", a "she" or if it is more than one person. In Japanese "satoshi"
    means "clear, quick and wise thought". "Naka" can mean "medium", "inside" or "relationship".
    "Moto" can mean "origin" or "foundation". But it is not certain whether these
    meanings are useful to trace back to the person or group of people who invented
    the Bitcoin system.


    It was originally thought to be Michael Clear, a graduate in cryptography from
    Trinity College but he denied. Others suspected Vili Lehdonvirta, a former Finnish
    game developer (but also a sociologist and economist), but he too has denied any
    connection with Satoshi. Adam Penenberg, a professor at New York University, claims
    that behind the mysterious character there are three people: Neal King, Vladimir
    Oksman, Charles Bry. Penenberg''s thesis is based on a Google search of some particular
    phrases of the bitcoin protocol that lead back to a patent request for updating
    and distributing cryptographic keys. The patent was applied for by King, Oksman
    and Bry, who denied having anything to do with bitcoin.


    Nick Szabo, a computer scientist and cryptographer, has long been suspected of
    being Satoshi along with collaborator Laszlo Hanyecz. Both have always firmly
    denied, but in the next pages we are going to tell you more about Szabo, as he
    is the one we believe to be Satoshi. Others think it is Martii Malmi, a Finnish
    developer, who dealt with Bitcoin from the very beginning by also creating the
    user interface of the system. There are also rumors about the creator of MtGox,
    Jed McCaleb, an American lover of Japanese culture and resident in Japan. Other
    theories instead lead to Donal O''Mahony and Michael Peirce, who wrote a paper
    on digital payments in e-commerce platforms.


    In 2017, after a tip from a SpaceX employee, the idea appeared on the web that
    Elon Musk was hiding behind the pseudonym, a theory later denied by the entrepreneur
    himself on his Twitter account.


    ## Craig Steven Wright


    In December 2015, according to two investigative articles published by Wired and
    Gizmodo, Craig Steven Wright, an Australian entrepreneur, would be the creator
    of Bitcoin. Within hours, searches were carried out in Wright''s home and office
    by the Australian Federal Police, however unrelated to the incident.


    On May 2nd, 2016, Craig Steven Wright publicly claimed to be Satoshi Nakamoto.
    Wright revealed his identity to the BBC, The Economist and GQ. In order to prove
    his claim, he signed a message with the private encryption key associated with
    the first Bitcoin transaction. However, the validation of this signature is disputed
    and even if its validity were demonstrated, many cryptographic experts do not
    consider it a definitive proof, as it refers to the second block and not to the
    first created.


    On May 4th, 2016, Wright promised to publish further evidence to prove his identity.
    However, the next day, he deleted all posts on his blog and published a note titled
    "I''m sorry" in which he declared that he was ready to publish more evidence but
    did not have the courage to do so. He ended the note with a "goodbye".


    In the same year Wright filed a copyright request for the Bitcoin white paper,
    originally written by Satoshi Nakamoto. However, the copyright request was denied
    due to insufficient proof of ownership.


    ## Nick Szabo


    We admit it: our opinion is that Nick Szabo is Satoshi Nakamoto. We have no actual
    proof of his identity, but after having researched this subject quite extensively
    this is our opinion.


    Nick Szabo is a computer scientist, lawyer, and cryptographer known for his research
    on digital contracts and digital currency. He graduated from the University of
    Washington in 1989 with a degree in computer science.


    The expression and concept of "smart contracts" were developed by Szabo with the
    aim of bringing what he calls "highly evolved" practices of contract law, from
    the conception to the application of the protocols of contract between strangers
    on the Internet. Smart contracts are a major feature of cryptocurrencies and the
    programming language `E`.


    Szabo worked for David Chaum, the inventor of electronic money "E-Cash" as a consultant
    in the mid-90s. In 1998, Szabo designed a decentralized digital currency mechanism
    which he called "Bit gold". Bit gold, not having received enough support, was
    never implemented, but was referred to as a direct precursor to the Bitcoin architecture.


    In the principle of Bit gold, participants devote the power of their computers
    to solving cryptographic puzzles. The solved puzzles are sent to a public registry
    insensitive to the problem of the Byzantine generals, and assigned to the public
    key of the participant who solved the puzzle. Each solution is then integrated
    into the input data of the next challenge, creating an increasingly long chain.
    Until the majority of participants agree to a solution for the current riddle,
    the work of solving the next riddle cannot begin. It is a proof-of-work-type consensus
    model. This also makes it possible to manage the issuance of new Bit gold tokens
    as well as a means of checking their timestamp.


    The main problem with transactions in digital form is the so-called double-spending
    problem. Once the data has been created, reproducing it is a simple matter of
    copying and pasting. Most digital currencies solve the problem by ceding some
    control to a central authority that keeps track of the balance of each account.
    This was considered unacceptable by Szabo. In an interview he stated the following.
    “I sought to imitate as closely as possible in cyberspace the security and trust
    characteristics of gold, and the main one is that it does not depend on any central
    authority”.


    In 2008, a mysterious figure writing under the pseudonym Satoshi Nakamoto published
    a proposal for Bitcoin. As you know Nakamoto''s true identity has since remained
    a secret, leading to speculation about a long list of people suspected of being
    Nakamoto. Although Szabo has repeatedly denied it, some people (including us)
    have speculated that he was Nakamoto. Research by financial author Dominic Frisby
    provides circumstantial evidence of this, but, as he admits, no formal evidence
    that Satoshi is indeed Szabo.


    In a July 2014 email from Frisby, Szabo said, “Thanks for letting me know this.
    I''m afraid you are wrong in exposing me as Satoshi, but I''m used to this".


    Nathaniel Popper wrote in the New York Times that the most convincing evidence
    regarding the creation of Bitcoin pointed to an American man of Hungarian descent
    by the name of Nick Szabo. In 2008, prior to the publication of Bitcoin, Szabo
    wrote a comment on his blog about the intention to create a working version of
    his hypothetical currency. This blog post is exactly what makes us think he is
    the actual inventor of this amazing monetary network.

    '
