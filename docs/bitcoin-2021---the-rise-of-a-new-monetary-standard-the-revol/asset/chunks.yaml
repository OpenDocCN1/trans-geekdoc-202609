    done. Blockstream has already released one possible implementation called MuSig.
    By allowing signature and key aggregation, it could form the basis for the Bitcoin''s
    Schnorr signature algorithm. Schnorr''s signatures could be integrated into the
    code through a soft fork, which is a change that would not divide the network.
    This type of fork would be an “opt-in” update. However, it would be too optimistic
    to assume that we will see them integrated in the near future - it may take a
    couple of years before consensus is reached. Schnorr''s signatures are one of
    the most anticipated targets on Bitcoin''s current roadmap. With a single update,
    they can provide  significant privacy and scalability benefits. Perhaps more interestingly,
    they also create the conditions for further developments in Bitcoin smart contracts
    and more advanced constructs such as Taproot, which we will discuss in the next
