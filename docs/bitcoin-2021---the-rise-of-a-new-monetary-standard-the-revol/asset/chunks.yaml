    # Introduction


    Bitcoin has taken the world by storm once again when it crossed $20,000 per BTC
    in December of last year. After more than 2 years of bear market, the most famous
    cryptocurrency surpassed its previous all time high. A lot of people are now trying
    to improvise themselves as professional investors and are losing a lot of money,
    only helping those who actually know what they are doing accumulate an incredible
    amount of wealth that will lead to generational fortunes. To join the club of
    the few investors that actually make it, you need the right strategies and the
    right mindset. Notice how we did not include a large initial capital. In fact,
    while having more money to trade with means having more fire power, it is not
    necessary to have thousands of dollars to accumulate Bitcoin and build wealth.
    In fact, when we started investing in Bitcoin we only had a few hundreds to put
    into the market, but that sum yielded us thousands and thousands of dollars over
    the span of a few years. In this book you are going to discover all the strategies
    that have allowed us to take investing skills to the next level and everything
    that helped us understand Bitcoin. If you diligently apply our advice, we are
    sure you are going to see amazing results in a relative short period of time,
    since this bull run is offering an amazing number of opportunities. Please, stay
    away from all the shiny objects of the cryptocurrency world. Just focus on Bitcoin,
    study it deeply and then milk it like a cash cow! To your success! Charles Swing
    and Masaru Nakamoto


    # Chapter 1 - What is Bitcoin?


    Bitcoin (₿, BTC, XBT) is a cryptocurrency otherwise called cryptographic currency.
    In the case of the unitary denomination, it is written "bitcoin" and, in the case
    of the peer-to-peer payment system, it is written "Bitcoin". The idea was first
    presented in November 2008 by one person, or a group of people, under the pseudonym
    Satoshi Nakamoto. The source code for the implementation of Bitcoin was released
    in 2009. The G20 considers Bitcoin to be a “crypto-asset”. The term “crypto-asset”
    refers to “virtual assets stored on an electronic wallet allowing a community
    of users accepting them in payment to carry out transactions without having to
    resort to legal tender”.


    ## Operation


    To create and manage bitcoins, Bitcoin relies on software. In this software, bitcoins
    are created according to a protocol that pays the agents (called “miners”) who
    have processed transactions. These agents use their computing power to verify,
    secure and record the transactions in a virtual ledger called the blockchain.
    The word blockchain comes from the fact that the basic entity of Bitcoin is called
    a block, and that the blocks are then connected in a chain. For each new block
    accepted, the verification-security-recording activity, called mining, is remunerated
    by newly created bitcoins and by the costs of the transactions processed.


    As a currency or a commodity, bitcoin can be exchanged for other currencies or
    commodities, goods or services. The cryptocurrency exchange rate is set on specialized
    marketplaces and fluctuates according to the law of supply and demand. It is possible
    to buy bitcoins online on specialized platforms, physical terminals or in exchange
    for any good or service with a person who already has them (the transaction can
    be done from smartphone to smartphone). The platforms also make it possible to
    follow in real time the evolution of the price of bitcoin compared to other currencies
    or cryptocurrencies.


    ## Account unit


    Bitcoin''s unit of account is bitcoin. Its emission is limited to 20,999,999.977
    units, each divisible to the eighth decimal place (called Satoshi or Sat). The
    official currency symbol was registered and accepted in 2015 with Unicode. The
    corresponding acronyms, used by the exchange platforms, are BTC and XBT. Among
    the unofficial symbols used are ฿ and Ƀ.


    ## Decentralization


    The system operates without a central authority or a single administrator. It
    is managed in a decentralized manner thanks to the consensus of all the nodes
    of the network. Bitcoin is the largest decentralized crypto currency, with a capitalization
    of over one trillion dollars as of April 5th, 2021 ($ 130 billion as of January
    1st, 2020).


    ## Means of payment


    As a means of payment, bitcoin is accepted by a growing number of merchants, encouraged
    by transaction fees generally lower than the 2 to 3% charged by credit card organizations
    and independent of the amount of the financial transaction. However, in 2017 the
    fees increased dramatically over the course of a few months, from $0.2 in 2016
    to $20 on certain days in December 2017, so that the Steam platform or Microsoft
    withdrew Bitcoin as a payment method, precisely because of too high transaction
    fees (Microsoft again authorized Bitcoin in January 2018). In order to address
    the issue of excessively high transaction fees, the gradual rollout of various
    technology enhancements (Segwit, Lightning Network, batch transactions, Schnorr)
    throughout 2018 and 2019 allowed fees to drop to around $0.05 for non-urgent transactions,
    and even amounts less than $ 0.0001 for Lightning type transactions. Unlike credit
    cards, any charges are borne not by the seller but by the buyer, who chooses to
    pay them voluntarily. A bitcoin transaction is irrevocable and cannot be reversed.
    Despite a 500% growth in the number of merchants accepting bitcoin in 2014, the
    cryptocurrency is not very established in the retail trade, but continues to gain
    a foothold in trade.


    ## Use


    Between January 2009 and March 2010, using bitcoin was a hobby among crypto enthusiasts,
    and bitcoin had no real value. However, in April 2010, bitcoin started trading
    in an exchange for $0.003, and soon after, in May 2010, it was already worth $0.01.
    A few months later, in July 2010, 0.08 dollars were added to its value again.
    These numbers reflect the rapid rise in prices that this zero-value cryptocurrency
    has experienced at 10 cents. Since its creation in 2009 and until the closure
    by the American authorities of Silk Road in 2013, bitcoin was used mainly as a
    medium of exchange by criminal networks for gambling, the purchase of illicit
    substances, or for hacked databases. The cryptocurrency has attracted the attention
    of financial authorities, legislative bodies in various countries, particularly
    the United States, and the mainstream media. Nevertheless, in recent years, cryptocurrency
    has matured and a growing number of studies conclude that these illegal activities,
    although they still exist as in any payment system, only involve a minority share
    of cryptocurrency exchanges. The United States Senate also recognizes that bitcoin
    makes it possible to provide perfectly legitimate financial services.


    ## Safe store of value


    According to some of the experts, bitcoin would be a safe haven much more than
    a means of payment, even if unlike gold, Bitcoin can indeed be used for these
    two purposes. Conversely, other financial experts consider Bitcoin to be far too
    volatile to be a safe haven, but it has only existed since 2009 and its possible
    safe haven status will only be possible after a first period of intense volatility.
    As for the question of whether Bitcoin can reach the market value of gold (or
    even exceed it), this remains much debated. However, it should be noted that with
    its trillion dollars evaluation, Bitcoin is not too far from reaching the value
    of Silver, which is approximately 1.4 trillion dollars.

