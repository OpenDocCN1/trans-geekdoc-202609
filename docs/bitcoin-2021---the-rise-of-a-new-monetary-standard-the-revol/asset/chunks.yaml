    # Chapter 28 - Bitcoin Blockchain and Safety


    In this book we have often mentioned that the blockchain is an incredible safe
    and secure technology to store transactions. But what makes it so secure? Well,
    in this chapter we are going to dive deeper into this aspect. Blockchain are protected
    through a variety of mechanisms, including advanced cryptographic techniques and
    behavioral and decision-making mathematical models. Blockchain technology is the
    structure below most of the cryptocurrency systems and is what prevents duplication
    or destruction of this type of digital money. The use of blockchain technology
    is currently under development in other contexts in which immutability and data
    security are very valuable. Some examples include the registration and monitoring
    of beneficial donations, medical databases, and management of logistics chains.
    However, blockchain security is certainly not a simple topic. Therefore, it is
    important to understand the concepts and basic mechanisms that give solid protection
    to these innovative systems.


    ## The concepts of immutability and consensus


    Although there are many elements that contribute to the security associated with
    blockchain, two of the most important are the concepts of consensus and immutability.
    The consensus refers to the capacity of the nodes within a distributed network
    blockchain to agree on the actual state of the network and on the validity of
    the transactions. Generally, the process to achieve consensus depends on the so-called
    consent algorithms. Immutability, on the other hand, refers to the ability of
    the blockchain to prevent alteration of those transactions that have already been
    confirmed. Although these transactions are often linked to the transfer of cryptocurrencies,
    they can also refer to the registry of other forms of digital data. Combined,
    consensus and immutability provide data security structure in the blockchain network.
    While the consensus algorithms guarantee that the rules of the system are followed
    and that all the parties involved agree on the current state of the network -
    immutability guarantees the integrity of data and transaction records after each
    new data block is confirmed as valid.


    ## The role of encryption in the safety of Blockchain


    Blockchains make extensive use of encryption to get their data security. A cryptographic
    function that takes on extreme importance in this context is hashing. Hashing
    is a process in which a known algorithm as a hash function receives a data input
    (of any size) and returns a determined output that contains a fixed length value.
    Regardless of the dimensions of the input, the output always has the same length.
    If the input is changed, the output will be completely different. However, if
    the input does not change, the resulting hash will always be the same - no matter
    how many times the hash function is performed. Inside blockchain, these output
    values, known as hashes, are used as unique identifiers for data blocks. The hash
    of each block is generated in relation to the previous block hash, a factor that
    connects the blocks together, thus forming a chain. Furthermore, the block hash
    depends on the data contained within it, so any changes to the data would also
    require the modification of the block hash. As a result, each block hash is generated
    based on both the data contained within it and on the previous block hash. These
    hash identifiers play a fundamental role in ensuring the safety and immutability
    of the blockchain. Hashing is also exploited in the consent algorithms used to
    validate transactions. In the Bitcoin Blockchain, for example, the Proof of Work
    (POW) algorithm used to reach consensus and for mining new units exploits a hash
    function called SHA-256. As the name suggests, SHA-256 transforms the input data
    into a 256-bit long hash or 64 characters. In addition to providing protection
    for transactions stored on the registers, encryption is also used to guarantee
    the safety of the wallets used to store the tokens. The pair of public and private
    keys that allow users to receive and send payments is created through the use
    of asymmetrical or public key cryptography. Private keys are used to generate
    digital signatures for transactions, allowing you to authenticate the property
    of transferring tnits. It is not necessary to go down to the details for the purpose
    of this chapter, it is enough to know that the nature of asymmetrical encryption
    prevents anyone except for the owner of the private key to access the funds preserved
    in a cryptocurrency wallet, thus maintaining such funds safe until when the owner
    decides to spend them (as long as the private key is not shared or compromised).


    ## Crypto Economy


    In addition to encryption, a relatively new concept known as crypt economics plays
    a role in maintaining the security of the blockchain network. It refers to the
    study field known as game theory, which mathematically formulates decision-making
    processes of rational actors in situations with predefined rules and rewards.
    While the traditional game theory can be applied to a wide range of cases, the
    crypto economy model specifically describes the behavior of nodes within distributed
    blockchain systems. In short, the crypto economy is the study of the economic
    aspect of blockchain protocols and the possible results that their design could
    submit according to the behavior of the participants. Security through crypto
    economy is based on the notion that blockchain systems offer better incentives
    to nodes that honestly act instead of adopting malicious or incorrect behavior.
    Again, the proof of work consensus algorithm used in the mining of Bitcoin offers
    an excellent example of this incentive scheme. When Satoshi Nakamoto created the
    structure for Bitcoin mining, the process was intentionally conceived as expensive
    in terms of resources. Due to its complexity and its computational needs, the
    mining process involves a considerable investment of time and money - regardless
    of where the mining node is located. As a result, this structure places a strong
    disincentive to malicious actions and remarkable incentives for honest mining
    activities. The dishonest or inefficient nodes are quickly expelled from the blockchain
    network, while honest and efficient miners have the potential to receive substantial
    rewards for blocks. Similarly, this balance of risks and rewards also guarantees
    protection from potential attacks that aim to compromise consent by accumulating
    the majority of the Hash Rate of a blockchain network in the hands of a single
    group or entity. These attacks, known as 51 percent attack, could be extremely
    harmful if performed successfully. Due to the competitiveness of the mining proof
    of work and the size of the Bitcoin network, the probability that an attacker
    is able to get control of the majority of nodes is really minimal. Furthermore,
    the cost of the computational power necessary to obtain 51 percent of the control
    of a huge blockchain network would be astronomical, placing an immediate disincentive
    to such a huge investment for a potential small reward. As long as the cost linked
    to establishing a majority of dishonest nodes remains prohibitive and there are
    better incentives for honest activity, the system will be able to thrive without
    significant disorders. It should be emphasized that smaller blockchain networks
    are undoubtedly susceptible to the attacks described above, given that the total
    hash rate dedicated to these systems is considerably lower than that of bitcoin.
    Through the combined use of game theory and encryption, blockchains are able to
    reach high levels of security as distributed systems. However, as for almost all
    systems, it is essential that these two fields of knowledge are adequately applied.
    An accurate balance between decentralization and safety is vital for the development
    of a reliable and effective network. As the cases of use of blockchain continue
    to evolve, even security systems will develop to meet the needs of various applications.
    Private blockchain currently under development for commercial enterprises, for
    example, make greater reliance on safety through access control instead of based
    on the mechanisms of game theory that are essential for the security of many public
    blockchains.

