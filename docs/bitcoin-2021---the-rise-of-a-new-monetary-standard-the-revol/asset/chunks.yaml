    # Chapter 21 - The SegWit Update


    Segregated Witness (`SegWit`) is an update to the protocol developed in 2015.
    The concept was introduced as a solution to the scalability problem that blockchain
    networks still face today. On average, the Bitcoin network validates a new block
    every 10 minutes, each containing several transactions. Consequently, the size
    of the block affects the number of transactions that can be confirmed in each
    block. Currently, the Bitcoin blockchain is capable of processing around 7 transactions
    per second. The core idea of SegWit is to reorganize the block data so that the
    signatures are no longer placed along with the transaction data. In other words,
    the SegWit update consists of separating witnesses (signatures) from transaction
    data. This allows multiple transactions to be stored in a single block, thus increasing
    the performance in terms of transactions on the network. Considering that Bitcoin
    can process around 7 transactions per second, executing a transaction can sometimes
    take a long time. This process is far slower than conventional payment solutions
    and financial networks, which can process thousands of transactions per second.
    SegWit was developed in 2015 by Bitcoin developer Pieter Wuille, along with other
    Bitcoin Core contributors. In August 2017, the SegWit update was implemented as
    a soft fork on the Bitcoin network. There are several cryptocurrency projects
    using SegWit today, including Bitcoin and Litecoin. The protocol update brought
    with it a number of benefits, including improved transaction speed and increased
    block capacity. Additionally, SegWit has fixed the so-called transaction malleability
    bug (more on that later).


    ## Increase in block capacity


    One of the biggest advantages of SegWit is the increase in block capacity. By
    removing signature data from transaction input, more transactions can be stored
    in a single block. Transactions are made up of two main components: inputs and
    outputs. Essentially, an input contains the public address of the sender, while
    the output contains the public address of the recipient. However, the sender must
    prove ownership of the funds they are transferring, and they do so with a digital
    signature. Without SegWit, signature data can take up to 65% of a block. With
    SegWit, the signature data is removed from the transaction input. This brings
    the actual block size from 1MB to approximately 4MB. It is important to note that
    SegWit is not an actual block size increase. Instead, it is an advanced solution
    that allows you to increase the actual size without having to increase the block
    size limit (which would require a hard fork). To be more precise, the current
    block size is still 1MB, but the actual block size limit is 4MB. SegWit also introduced
    the idea of block weight. We can consider the weight of the block as a concept
    that replaces the idea of block size. Essentially, the block weight is a measure
    that includes all data in the block, including transaction data (1MB) and signature
    data (3MB), which are no longer part of the input field.


    ## Increased transaction speed


    By creating a block that can hold more transactions, SegWit has also made it possible
    to increase transaction speed, as there can be a larger number of transactions
    moving through the blockchain. While a block may take the same time to mine, more
    transactions are being processed in it, so the transactions per second rate is
    higher. The increase in transaction speed has also helped reduce transaction costs
    in the Bitcoin network. Before SegWit, it wasn''t uncommon to spend more than
    $30 on a transaction. However, SegWit has drastically lowered this cost to less
    than $1 per transaction.


    ## Correction of transaction malleability


    In the past, a major problem with Bitcoin was the ability to potentially alter
    transaction signatures. If a signature is altered, it could result in the corruption
    of a transaction between two parties. Since the data stored on blockchains is
    virtually immutable, it would have been possible to permanently store invalid
    transactions on the blockchain. With SegWit, signatures are no longer part of
    the transaction data, which removes the possibility of altering this data. This
    fix has enabled further innovations in the blockchain community, including second-layer
    protocols and smart contracts.


    ## SegWit and Lightning Network


    The development of second-layer protocols was partially made possible by the correction
    of the transaction malleability bug. In a nutshell, second-layer protocols are
    new platforms or new products developed on top of a blockchain, such as that of
    Bitcoin. As we have seen in the last chapter, one of the best known second-layer
    protocols is Lightning Network, an off-chain micropayment network.


    ## SegWit vs SegWit2x


    SegWit is a soft fork upgrade, which means it is backwards compatible. In other
    words, Bitcoin nodes that are not updated to include SegWit are still capable
    of processing transactions. However, another SegWit implementation called SegWit2x
    (`S2X`) has been proposed, which would have required a hard fork upgrade. The
    key difference between SegWit and SegWit2x is that the latter would not only involve
    a change in transaction batching, but also an increase in block size (from 1MB
    to 2MB). However, a larger block size would have increased the load on node operators
    and miners, as it would have led to double the amount of data to manage. Another
    important difference is that the SegWit proposal was supported and enforced by
    the Bitcoin community. The episode gave birth to the concept of UASF, which stands
    for user-activated soft fork. Conversely, SegWit2x proposed a substantial change
    to one of Bitcoin''s core rules, and as the developers did not reach a consensus
    on its adoption and implementation, the SegWit2x movement was suspended. SegWit''s
    implementation marked the biggest update to the Bitcoin protocol, and the fact
    that it has been supported and implemented by the decentralized community makes
    it even more important. The introduction of SegWit was a major step forward in
    solving many problems related to Bitcoin and other blockchain networks - especially
    in terms of scalability. Through the combination of SegWit and second-layer protocols,
    blockchain networks can handle more transactions, with more efficiency and lower
    costs. Despite being a powerful and innovative solution, SegWit has not yet reached
    full adoption. Currently, the percentage of Bitcoin addresses using SegWit is
    around 53%.

    '
