    Blockfi 是一个加密资产管理平台，为用户提供在其代币上赚取利息的机会。它向试图将其资源货币化的公司和组织提供加密货币、稳定币和美元贷款。这可能是在 Blockfi
    平台上让你的加密货币产生被动收入的最简单方式。一旦开设账户，你可以存款并从第一天开始赚取复利。你可以通过访问 Blockfi 网站创建一个利息账户，为此你必须年满十八岁。你需要经过
    KYC 流程，上传身份证的清晰照片。如果所有详细信息正确，你的账户将在几分钟内获批。如果你的账户在 48 小时内未获批，你可以写信至 onboarding@blockfi.com
    寻求帮助并完成验证流程。对于企业账户，你需要发送你公司股份的经理和所有者的身份信息。Blockfi 还提供促销活动来吸引客户，目前提供最高 250 美元的注册奖金，存款至少
    25 美元或更多。正如我们所说，要求你精确完成 KYC 是因为这有助于 Blockfield 组织防止洗钱活动和其他类似的非法行为。Blockfi 利息账户在每月的第一个工作日对存款提供利息。赚取利息不需要最低余额。如果你没有平台支持的某些代币，你可以直接将美元或欧元转入你的
    Blockfi 利息账户。传统法币将转换为可用的任何代币。利率可能会因不同因素而有所变化，但他们会提前向你提供相关信息。此外，利率每两到三个月变化一次，而其他平台则每周变化利率。因此，Blockfi
    随着时间提供相当稳定的收益。Blockfi 在付款方面也提供一些灵活性。如果你以特定形式的加密货币存入资金，你可以选择以你喜欢的加密货币获得利息。例如，如果你存入了
    BTC，你可以以 BTC、ETH、LTC、USDC 或 USDT 的形式获得收益。你需要在每月最后一个工作日之前至少两个工作日更改此信息，以便选择能按时生效。否则，如果你不更改，你将获得你最初存入的加密货币类型的利息。Blockfi
    还提供月度报表，列明你存入的资金、已赚取的利息以及下个月可赚取的利息。Blockfi 会通过电子邮件发送月度报表，你也可以直接从平台下载 PDF 格式的报表。你还可以在个人账户的相应部分下载
    CSV 格式的交易历史。此外，你还可以在特定日期范围内筛选交易并下载报告。Blockfi 通过将其资金提供给可信赖的公司和机构借款人、购买 ETF 和其他金融证券来产生利息。在向任何人放款之前，会进行深入的信用分析。你也可以随时关闭账户。如果你的投资组合中有加密货币，你可以连同相关应计利息一起将其转移到其他账户。如果你在开设账户后六十天内没有存入任何金额，系统将自动关闭该账户。


    ## 加密货币贷款


    最低贷款金额为 10,000 美元，你可以存入比特币、以太坊或莱特币作为抵押品。资金随后以美元转入客户账户。Blockfi 将此服务宣传为融资重大购买（如房产、汽车、假期等）的理想方式，或作为多元化你的财务投资组合的机会。


    ## 如何使用 Blockfi 交易平台


    Blockfi 用户还可以在平台上存入资金，并用它们购买更多加密货币或稳定币。Blockfi 拥有自己的交易所，所有拥有个人账户的用户均可使用。这使得平台上的投资者可以以直观的方式在一种加密货币和另一种加密货币之间切换。最棒的是，在交易时你仍然可以赚取复利。要注册
    Blockfi 账户，请按照以下简单步骤操作：


    - 访问 Blockfi 网站并创建账户；

    - 完成电子邮件验证并登录你的账户；

    - 通过用户仪表板向账户添加资金；

    - 点击位于顶部的导航面板中的“交易”；

    - 选择你想要交换的加密货币；

    - 输入你想要购买的金额；

    - 查看订单详情并点击 Enter 以完成交易。


    Blockfi 引入了一项新功能，允许用户通过银行转账向平台发送现金存款。这涉及法币传输，以便在平台上直接购买稳定币。对于从未购买过比特币的初学者来说，这个过程相当简单。他们可以在
    Blockfi 注册，通过银行转账存入传统货币，并在 Blockfi 利息账户中获得高达 8.6% 的收益。美元存款会自动兑换为 Gemini 美元（GUS），然后可以使用
    Blockfi 交易平台将其转换为比特币、以太坊、莱特币和 USDC。要使用 Blockfi 通过美元购买稳定币，请按照以下步骤操作：


    - 登录你的 BlockFlen 账户。

    - 点击顶部导航栏中的“存款”。

    - 选择“USD (bank transfer)”作为存款货币。

    - 选择“Bank transfer”作为支付方式。

    - 输入你的详细信息并将银行转账发送到 Blockfi。


    ## Blockfi 团队


    该公司成立于 2017 年，总部位于新泽西州。其联合创始人是 Zac Prince 和 Flori Marquez，分别担任首席执行官和运营高级副总裁。Prince
    拥有德克萨斯州立大学的国际商务学位，并具有技术背景，曾担任 Orchard Platform 的业务发展副总裁和 Sociomantic Labs 的销售经理。Marquez
    毕业于康奈尔大学，是银行和金融领域的新星之一。Rene Van Kesteren 是首席风险官，在加入 Blockfi 之前在 Bank of America
    Merrill Lynch 工作了十三年。执行团队的另一位主要成员是 CTO Mahesh Paolini-Subraminya，他于 1980 年代末从圣母大学毕业后一直在技术领域工作。其余管理团队在金融科技和传统金融方面拥有类似的经验组合，而公司整体雇佣了
    65 人，分布在新泽西州、纽约州、阿根廷和波兰的四个办公室中。在评估一家相对新公司时，最可靠的指标之一是其初始投资者名单。Blockfi 在此方面拥有令人印象深刻的支持，包括
    Akuna Capital 级别的参与者、coellid ventures、Galaxy Digital Ventures 和温克利沃斯双胞胎。


    ## Blockfish 如何运作


    如果你想赚取利息、获得贷款或进行交易，你只能使用比特币、以太坊或莱特币。在贷款方面，你需要存入更多资本作为担保，才能享受最低 10,000 美元的贷款。最高贷款价值比率（LTV）为
    50%，并提供额外利率。有必要详细讨论这些贷款是如何构建的。请求处理迅速，如果你在工作日申请，大约两小时内可以等待 Blockfi 的决定。Blockfi
    使用多种因素来计算利率，包括贷款金额、地点和提供的特定担保。这无疑对那些试图摆脱传统金融所设限制的加密货币领域人士具有巨大吸引力。显然，如果在该时间段内抵押品价值上涨，你可能能够收回一些费用佣金。相反，如果抵押品价值突然下降，你可能需要提供额外资金或偿还贷款余额。


    ## 谁可以使用 Blockfi？


    该公司确定了“三种主要类型的组织”使用其提供的服务：


    - 交易者和投资基金。本质上是那些寻找套利机会、需要借入加密货币以缩小不同市场之间价差的人。“保证金”交易者也可能需要签订贷款以支付其交易策略的成本。

    - “场外交易”市场操作者（OTC）。这些是希望远离公共交易所进行交易的买卖双方，公共交易所通常收取高额佣金。

    - 需要加密货币流动性的公司。他们可能希望将大部分资产存放在冷钱包中，但仍需要流动性来为客户提供日常运营。加密货币 ATM 可以作为一个例子。


    ## Blockfi 佣金


    创建 Blockfi 利息账户的用户将受到以下限制和取款佣金约束：


    - 比特币：佣金 0.0025 BTC，每周限额 100

    - 以太坊：佣金 0.0015 ETH，每周限额 5,000 美元

    - 莱特币：佣金 0.0025 LTC，每周限额 10,000 美元

    - 稳定币：佣金 0.25 美元，每周限额 100 万美元


    在 Blockfi 赚取利息没有最低余额要求。你每月还可以享受一次免费的加密货币和稳定币取款，并且可以在你喜欢的任何时间进行。每次免费取款每月适用于一种加密货币。提出请求后，你的加密货币首先会转移到
    Blockfi Trading LLC，然后再转到请求的地址。如果你想进行额外取款，将收取我们之前列出的相关佣金。


    ## Blockfi 与安全


    Blockfi 的主要托管交易所是 Gemini（著名的温克利沃斯双胞胎所属），该交易所最近完成了“SoC 2”合规性认证，成为首个达到此安全级别的加密货币交易所。该交易所受纽约州金融服务部（NYDFS）监管，并将
    95% 的资产存放在冷钱包中。根据网站说明，即使是双胞胎本人，如果没有许可，也无法转移该钱包中包含的加密货币。简而言之，Gemini 的安全协议无出其右，资金被盗的可能性极低。即使发生此类违规，所有资金均由
    AON 投保，任何损失都将得到补偿。


    ## 更高级别的安全系统


    除了 Gemini 的安全性之外，Blockfi 还使用一系列功能来保护客户的账户安全。双重身份验证已启用，所有密码、个人和敏感信息均已加密。该平台还允许用户在其账户上实践“AllowListing”（也称为
    Whitelisting），因此资金只能转入指定并批准的某些地址。要从 Blockfi 提取资金需要极其复杂的攻击，即使在这种情况下，保险也将覆盖任何损失。没有客户存款被盗过，如果账户被盗，将立即冻结一周，并将与相关客户进行视频会议以确认其身份。然后你可以执行更改密码和电子邮件地址的步骤，以确保客户能够重新控制其个人账户。


    ## 机构 Blockfi 服务


    Blockfi 提供机构服务，如个性化贷款，也可以是稳定币、加密货币和法币（如美元）形式。Blockfi 支持快速入职，即与其公司级别报告的快速交易执行。你将在整个贷款创建过程中逐步得到指导。如需更多详情，可以通过填写网站提供的特殊请求表格联系团队。在基于加密货币的贷款和加密账户领域，Blockfi
    无疑在市场上可用的前 3 个平台中位置良好。该平台不断创新，并始终添加新功能。考虑到它目前提供的高利率以及它已经运营超过 4 年的事实，我们可以建议你将一部分持有资产存入
    Blockfi 利息账户。


