    # Chapter 29 - The 2021 Bull Market


    Market trends are among the most fundamental aspects of the financial markets.
    We can define a market trend as the general direction in which an asset or market
    moves. For this reason, market trends are closely monitored by technical analysts
    and fundamental analysts. Bull markets tend to be relatively easy to exploit,
    as they allow for the use of the simplest trading and investment strategies. Even
    inexperienced investors could perform well in really favorable bull market conditions.
    However, it remains crucial to understand that markets move in cycles. So what
    should you know about bull markets? How do investors take advantage of bull markets?
    You can find the answers in this chapter.


    ## What is a bull market?


    A bull market (or bull run) is the scenario in a financial market where prices
    are rising. The term bull market is often used in the context of the stock market.
    However, it can be used in any financial market - including Forex, bonds, commodities,
    real estate, and cryptocurrencies. Furthermore, the expression bull market could
    also refer to a specific asset such as Bitcoin or Ethereum. It could describe
    a sector, such as utility tokens, privacy coins, or biotech stocks. You may have
    already heard Wall Street traders use the terms "bullish" and "bearish”. When
    an investor says he is bullish in a market, it means that he expects prices to
    rise. When bearish, he predicts a drop in prices. Often being bullish can mean
    having a long position in the market, but this is not necessarily the case. A
    bullish condition may not present a long opportunity at the moment but simply
    indicates that prices are rising or are expected to rise. It is also important
    to highlight the fact that a bull market does not mean that prices do not fall
    or fluctuate. For this reason it is more reasonable to consider bull markets over
    longer time frames. In this sense, bull markets will include periods of decline
    or consolidation without invalidating the overall market trend. Take a look at
    the Bitcoin chart below. Despite periods of decline, and some violent market crashes,
    it has been in an overall bullish trend since its inception. ![](image_rsrc1UA.jpg)In
    this perspective, the definition of a bull market depends on the time periods
    that are taken into consideration. Generally, when we use the term bull market
    we are talking about a time span of months or years. As with other techniques
    used in market analysis, trends observed over longer periods tend to have more
    value than trends over shorter periods. Thus, in a bull market over extended periods
    there may be prolonged phases of decline. These countertrend price movements are
    known for their particular volatility - although this can vary a lot from asset
    to asset.


    ## Examples of a bull market


    Some of the best-known examples of bull markets come from the stock market. We
    are talking about scenarios in which the prices of stocks and market indexes (such
    as the Nasdaq 100) are constantly increasing. Taking the global economy into consideration,
    we know it fluctuates between bull and bear markets. These market cycles can last
    for years or even decades. Some argue that the bull market that began following
    the 2008 financial crisis and ended due to the coronavirus pandemic was the "longest
    bull market in history." The validity of this claim is uncertain - as we said,
    bull markets over longer periods of time can be a matter of point of view. Anyway,
    let''s take a look at the long-term performance of the Dow Jones Industrial Average
    (DJIA). We can see that it is basically in a century-long bull market. Of course,
    there are periods of decline that can last for years, as in the case of 1929 or
    2008, but the overall trend is still heading upwards. ![](image_rsrc1UB.jpg)Some
    argue that we could see a similar trend in Bitcoin, but we can''t say for sure
    when Bitcoin will face a multi-year bear market. Importantly, most other cryptocurrencies
    will likely never experience such appreciation, so be very careful what you invest
    in.


    ## Bull market vs. bear market


    These are opposite concepts, so the difference isn''t very hard to guess. In a
    bull market, prices continually rise, while in a bear market, prices continually
    fall. This also results in differences on the best methods for investing in the
    two conditions. In a bull market, investors will generally want to be long, while
    in a bear market they will want to be short or out of the market sitting on cash.
    In some cases, even sitting on cash (or stablecoins) can mean being short on the
    market, as this means expecting prices to drop. The main difference is that holding
    the funds in cash is more about preserving capital, while a short position is
    meant to gain on falling asset prices. However, if you sell an asset with the
    intention of buying it back at a lower price, you are essentially in a short position
    - even if you are not directly profiting from the decline. Another element to
    consider are fees. Staying in stablecoin is unlikely to lead to fees, as there
    are usually no costs associated with custody. Conversely, many short positions
    will require a financing fee or interest rate to ensure they are opened. As such,
    quarterly futures may be ideal for long-term short positions, as they do not charge
    funding fees.


    ## How investors can benefit from bull markets


    The central idea in bull market investing is relatively simple. Prices are going
    up, so opening long and buying corrections is generally a reasonable strategy.
    For this reason the buy and hold strategy and dollar cost averaging plan are generally
    suitable for long-term bull markets. There is a saying that goes: "The trend is
    your friend, until it isn''t anymore." This simply means that it makes sense to
    trade in the direction of the market trend. At the same time, no trend will last
    forever, and the same strategy may not perform well in other parts of a market
    cycle. The only certainty is the fact that markets can and will change. As we
    have seen for the COVID-19 pandemic, multi-year bull markets can be wiped out
    in a matter of weeks. Of course, most investors will be bullish in a bull market.
    It makes sense as prices are rising, so overall sentiment should be bullish as
    well. However, even during a bull market, some investors will be bearish. If their
    investing strategy allows it, they may also be successful with short-term bearish
    trades. Hence, some investors will try to open short on recent highs in a bull
    market. However, we are talking about advanced strategies that are generally more
    suited to professional investors. For less experienced investors, it usually makes
    more sense to trade following the market trend. Many investors get trapped when
    they try to make money shorting bull markets. After all, facing a raging bull
    can be a dangerous.

    '
