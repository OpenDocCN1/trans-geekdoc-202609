    Since the early days of Bitcoin, its supporters have put forward the thesis that
    cryptocurrency is more like "digital gold" than a simple digital currency. In
    recent years, this narrative has been picked up by many Bitcoin enthusiasts. The
    thesis of Bitcoin as a store of value states that this cryptocurrency is one of
    the most solid assets known to man. Proponents of the thesis believe that Bitcoin
    is the best way to preserve wealth over time by protecting it from devaluation.


    Bitcoin is known for its incredible volatility. It might seem illogical how an
    asset that can lose 20% of its value in one day may be considered by many to be
    a store of value. However, even considering its numerous collapses, it remains
    to this day the best performing asset in history. So why is Bitcoin considered
    a store of value?


    ### Bitcoin shortage


    Perhaps one of the more compelling arguments for the store of value thesis is
    that Bitcoin has a limited supply. As you may recall from previous chapters, there
    will never be more than 21 million bitcoins. The protocol guarantees this property
    with a rule carved into the code. The only way in which new coins can be created
    is in the mining process, in some ways analogous to gold mining. However, instead
    of drilling into the ground, Bitcoin miners must solve a cryptographic puzzle
    using computational power. By doing so they will earn new coins. Over time, the
    reward decreases following events known as halving. As the name suggests, each
    halving halves the reward. In the early days of Bitcoin, the system distributed
    50BTC to every miner that produced a valid block. During the first halving, this
    number was reduced to 25 BTC. The next halving halved it to 12.5 BTC, and the
    next one will cut the reward to 6.25 bitcoin per block. This process will continue
    for another 100+ years until the final fraction of the last coin is in circulation.


    Let''s create a model similar to the example we did earlier with our fiat currency.
    Suppose we bought 25% of the supply of Bitcoin (i.e., 5,250,000 coins) many years
    ago. When we acquired these coins, we knew our percentage would stay the same
    as there is no entity capable of adding more coins to the system. There is no
    government here - or rather, not in the traditional sense (more details soon).
    So, if we had bought 25% of the maximum supply in 2010, we would still have 25%
    today.


    ### Decentralization


    Maybe you are thinking, it is only open-source software. Everyone can copy the
    code and create their own version with 100 million more coins. In fact, you could.
    Let''s say you can clone the software, make the changes and run a node. Everything
    seems to work. There is only one problem, though: there are no other nodes to
    connect to. You see, as soon as you changed your software parameters, the members
    of the Bitcoin network started ignoring you. You have forked, and the program
    you are running is no longer what is globally accepted as Bitcoin. What you just
    did is functionally the equivalent of taking a picture of the Mona Lisa and claiming
    that there are now two Mona Lisa. You can convince yourself that this is the case,
    but good luck convincing someone else.


    We mentioned that there is some kind of government in Bitcoin. This government
    is made up of each user running the software. The only way the protocol can be
    changed is with the majority accepting the changes. Getting a majority to add
    coins would be no easy feat - after all, you''re asking them to devalue their
    own funds. At present, even seemingly insignificant features take years to reach
    consensus across the network. As it grows and gets bigger and bigger, promoting
    changes will get harder and harder. Therefore, holders can be reasonably sure
    that the supply will not be inflated. Even though the software is man-made, the
    decentralization of the network means that Bitcoin acts more as a natural resource
    than as code that can be arbitrarily modified.


    ## The properties of good currencies


    Proponents of the store-of-value thesis also point out characteristics of Bitcoin
    that make it a good currency. It is not only a limited digital resource, it also
    shares characteristics that have traditionally been adopted in the various currencies
    of history for centuries. Gold has been used as a currency by several civilizations
    since their inception. There are several reasons behind this choice. We have already
    talked about durability and scarcity. These properties can create good assets,
    but not necessarily good forms of money. For this, fungibility, portability and
    divisibility are needed.


    ### Fungibility


    Fungibility means that the units are indistinguishable. With gold, you can take
    any two ounces, and they will have the same value. This also applies to things
    like stocks and cash. It doesn''t matter which particular unit you own - it will
    have the same value as any other of the same type.


    Bitcoin''s fungibility is a thorny topic. It shouldn''t matter which coin you
    own. In most cases, `1 BTC = 1 BTC`. Things get complicated when we consider that
    each unit can be linked to previous transactions. There are cases where companies
    blacklist funds they believe have been involved in criminal activity, even if
    the holder received them later. Should it matter? It is difficult to understand
    why. When you are paying for something with a banknote, neither you nor the merchant
    know what it was used for three transactions ago. There is no concept of a transaction
    history - new banknotes have no more value than used ones. At worst, it is possible
    that older bitcoins (with a longer history) will sell for less than new bitcoins.
    Depending on who you ask, this hypothesis could be the biggest threat to Bitcoin
    or something you don''t need to worry about. For now, however, Bitcoin is functionally
    fungible. There have only been a few isolated incidents involving frozen coins
    due to a historical suspicion.


    ### Portability


    Portability denotes the ease of transportation of an asset. `$10,000` in `$100`
    bills? Rather easy to move. `$10,000` oil equivalent? A little less. Sound money
    must have a small form factor. It must be easy to transport to allow individuals
    to pay each other for goods and services. Gold has traditionally been excellent
    in this area. At the time of writing, a standard gold coin holds a value of nearly
    `$1,500`. Many purchases worth a full ounce of gold are unlikely to be made, so
    smaller denominations take up even less space.


    Bitcoin is indeed superior to precious metals when it comes to portability. It
    doesn''t even have a physical footprint. You could keep trillions of dollars worth
    of assets on a piece of hardware that fits in the palm of your hand. Moving gold
    worth one billion dollars (currently more than 20 tons) requires enormous effort
    and cost. Even with cash, you should be carrying several pallets full of `$100`
    bills. With Bitcoin, you can send the same amount anywhere in the world for less
    than a dollar.


    ### Divisibility


    Another vital quality of money is its divisibility - that is, the ability to divide
    it into smaller units. With gold, you can take a one-ounce coin and cut it in
    half to make two half-ounce units. You may spoil the beautiful eagle or buffalo
    design on it, but the value of the gold remains the same. You can cut half-ounce
    units over and over to produce even smaller denominations.


    Divisibility is another area where Bitcoin excels. There are only twenty-one million
    coins, but each is made up of one hundred million smaller units (satoshi). This
    gives users a high degree of control over their transactions, as they can send
    an amount by specifying up to eight decimal places. Additionally, Bitcoin''s visibility
    makes it easier for small investors to buy fractions of BTC.


    ## Reserve of value, medium of exchange and unit of account


    The general opinion is divided on the current role of Bitcoin. Many believe that
    Bitcoin is simply a currency - a tool for moving funds from point A to point B.
    We will discuss this in the next section, but this perspective goes against what
    many proponents of the store of value thesis advocate. Store of value proponents
    argue that Bitcoin has to go through various stages before becoming the definitive
    currency. It starts as a collector''s item (probably the stage we are in now):
    it has proven functional and safe, but has only been adopted by a small niche.
    Its main audience consists of enthusiasts and speculators. Only with better education,
    infrastructure for institutions and greater confidence in its ability to retain
    value can it proceed to the next stage: the store of value. Some believe it has
    already reached this level, since institutions are investing in Bitcoin as well.


    At this point, Bitcoin has not been widely spent due to Gresham''s law, which
    states that bad money drives out good. This means that when presented with two
    types of coins, individuals will be prompted to spend the lower one and accumulate
    the higher one. Bitcoin users prefer to spend fiat currencies, as they have little
    confidence in their long-term survival. They prefer to keep their own bitcoins,
    as they believe they will hold their value. If the Bitcoin network continues to
    grow, more and more users will adopt it, liquidity will increase, and the price
    will become more stable. Due to the increased stability, there will no longer
    be an incentive to keep it in the hope of big gains in the future. Hence, we can
    expect that it will be used a lot more in daily trading and payments, as a strong
    medium of exchange. The increased use further stabilizes the price.


    In the final stage, Bitcoin would become a unit of account - it would be used
    to price other assets. Just as we could price a gallon of oil at `$4`, in a world
    where Bitcoin reigns as a currency we are going to measure this value in bitcoin.
    If these three monetary milestones are met, proponents see a future where Bitcoin
    has become a new standard that replaces the currencies used today.


    ## The case against Bitcoin as a store of value


    The arguments presented in the previous pages may seem completely logical to some
    or completely absurd to others. There are some criticisms of the idea of Bitcoin
    as "digital gold" put forward by both Bitcoin enthusiasts and cryptocurrency skeptics.


    ### Bitcoin as digital money


    When disagreement arises on this issue, many are quick to point out the Bitcoin
    whitepaper. For them, it is clear that from the very beginning Satoshi designed
    Bitcoin to be spent. In fact, we find it in the same title of the document: “Bitcoin:
    A Peer-to-Peer Electronic Money System”. The argument suggests that Bitcoin can
    only be valid if users spend their coins. By accumulating them, you are not helping
    adoption - you are hindering it. While Bitcoin is not widely valued as digital
    money, its core proposition is driven not by utility but by speculation.


    In 2017, these ideological differences led to a major fork. Bitcoiner''s minority
    wanted a system with larger blocks, to offer lower transaction fees. Due to the
    growth in usage of the original network, the cost of a transaction can drastically
    increase, excluding lower value transactions for many users. If the average commission
    is `$10`, there is little point in spending coins on a `$3` purchase. The forked
    network is now known as Bitcoin Cash. The original network implemented an update
    around that time, known as SegWit. Segwit nominally increased the capacity of
    the blocks, but that was not his main goal. It also laid the foundation for the
    Lightning Network, which aims to facilitate low-cost transactions by moving them
    off-chain. However, the Lightning Network is far from perfect. Regular Bitcoin
    transactions are much easier to understand, while managing Lightning Network capacity
    and channels has a steep learning curve. It remains to be seen whether it can
    be simplified, or whether the solution design is fundamentally too complex to
    rationalize. Due to the growing demand for block space, on-chain transactions
    are no longer very cheap during busy times. For this, it could be argued that
    not increasing the block size damages Bitcoin''s functionality as a currency.


    ### No intrinsic value


    For many, the comparison between gold and Bitcoin is absurd. The history of gold
    is, essentially, the history of civilization. Precious metal has been a staple
    of societies for thousands of years. Undoubtedly, it has lost some of its dominance
    since the elimination of the gold standard, but it remains the ultimate safe haven
    asset. Indeed, the comparison between the network effects of the king of assets
    and a protocol that has been in existence for eleven years seems a bit too much.
    Gold has been revered for millennia as both a status symbol and an industrial
    metal. Conversely, Bitcoin has no use outside its network. You can''t use it as
    a conductor in electronics, nor can you work it to create a huge shiny chain when
    you decide to become a hip hop star. It might emulate gold (mining, limited supply,
    etc.), but that doesn''t change the fact that it''s a digital asset. In a sense,
    all currencies are a shared belief - the dollar only has value because the government
    says it and society accepts it. Gold is only valuable because everyone agrees
    it does. Bitcoin is no different at all, but those who value it are still a small
    group in the overall world of finance.


    ### Volatility and correlation to other assets


    Those who discovered Bitcoin in the early years have certainly seen their investment
    grow by huge orders of magnitude. For them, it has actually retained value - and
    more. However, those who first bought coins near the all-time high did not have
    this experience. Many have suffered large losses by selling at any later time.
    Bitcoin is incredibly volatile, and its markets are unpredictable. Metals like
    gold and silver have insignificant fluctuations by comparison. You may argue that
    we are still in the early stages, and that the price will eventually stabilize.
    But this, in itself, would indicate that Bitcoin is not currently a store of value.
    The relationship between Bitcoin and traditional markets must also be considered.
    Since the launch of Bitcoin, they have been in a constant uptrend. Cryptocurrency
    cannot truly be tested as a safe haven asset if all other asset classes are doing
    well as well. Bitcoin enthusiasts may refer to it as "unrelated" to other assets,
    but there is no way to know until other assets suffer while Bitcoin remains stable.


    ### Tulipmania and Beanie Babies


    It wouldn''t be a real critique of Bitcoin''s store-of-value properties if we
    didn''t mention the comparisons to Tulipmania and the Beanie Babies. They are
    weak analogies at best, but they serve to illustrate the dangers of bubbles and
    their bursting. In both episodes, investors flocked to buy items they thought
    were rare in hopes of reselling them for a profit. By themselves, the items weren''t
    that valuable - they were relatively simple to produce. The bubble burst when
    investors realized they were massively overvaluing their investments, and as a
    result the tulip and beanie babies markets collapsed. Again, these are weak analogies.
    Bitcoin''s value comes from users'' trust in it, but unlike tulips it cannot be
    grown to meet demand. That said, there is no guarantee that investors won''t see
    Bitcoin as overvalued in the future, causing the bubble to burst.


    Bitcoin certainly shares most of the characteristics of a store of value like
    gold. The number of units is limited, the network is decentralized enough to offer
    security to owners, and can be used to store and transfer value. Ultimately, it
    has yet to prove itself as a safe haven - it is still too early to be certain.
    Things could go either way - the world could take refuge in Bitcoin in times of
    economic crisis, or it could continue to be used only by a minority group. Only
    time will tell, but what we have seen since March 2020 is a progressive shift
    from bonds, gold and silver to Bitcoin and cryptocurrencies. We strongly believe
    Bitcoin is a store of value and we are dollar cost averaging into it on a weekly
    basis.

    '
