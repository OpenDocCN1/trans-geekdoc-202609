    wary of .exe, .vbs or .scr files). ●     Backup your files regularly to restore
    them in case of an  attack. As you might have noticed, the world of Bitcoin could
    be extremely dangerous if you do not put in place the right protective measures.
    However, if you are careful and have the right knowledge, it is also the most
    secure method to store your wealth. Please, dedicate some time to the study of
