    possible to change the address of the recipient of the cryptocurrency transaction.
    CryptoShuffler is one of the software using this technique. This rare technique
    has little effect because it suffices for the payment sender to visually check
    the first/last characters of the destination address to make sure that it is not
    being fooled. Price evolution against the dollar When it was created in February
    2009, the cryptocurrency was initially traded only as an experiment by a few rare
    users and its value was zero. On October 12th, 2009, the first known bitcoin sale
    took place, where two users traded 5,050 bitcoins for $5.02 using a Paypal transfer,
    which equates to a price of around $0.001 per bitcoin. In March 2010, Bitcoinmarket.com
    was the first bitcoin exchange platform to be opened, thus allowing continuous
    quotation of the price of bitcoin. It was the beginning of an era and every Bitcoin
    enthusiast should be thankful to this website for what it has done for the community.
    On February 9th, 2011, bitcoin reached the valuation of one full dollar. On November
    29th, 2013, the value of a bitcoin exceeded that of an ounce of gold, to nearly
    $1,250. Once again, for those that are familiar with today price action, these
    numbers do not seem so incredible. However, if you think about it, we are talking
    about a  huge price development in just a couple of years. What other asset did
    over 1000% in just two years? The answer is very simple: no other asset managed
    to do it. Bitcoin, mainly traded for yuan and dollars, can also be traded for
    euros on a dozen platforms. Until November 2013, Mt. Gox was the most important
    of these platforms in terms of transaction volume (~ 70%) and the practice had
    been taken to consider its price as representative of the market. As a result
    of the problems encountered, users turned away from it, causing the price of bitcoin
    to drop sharply on Mt. Gox, with prices observed on other platforms only slightly
    affected. The price experienced a 400% increase between January and March 2013,
    before correcting itself severely on April 10th, following a failure of the Mt.
    Gox exchange site and probable panic sales. The price fell back to the level of
    the previous month, around $50. Between December 4th and 5th, 2013, following
    a warning from the People''s Bank of China and the Bank of France, the price lost
    nearly 35% in 24 hours. On February 19th, 2014, the price collapsed following
    the announcement of the disappearance of 850,000 bitcoins on Mt. Gox. On this
    exchange platform, bitcoin goes from $185, on February 18, to $73 24 hours later,
    while it remains close to $400 on other platforms. Mt.Gox declared bankruptcy
    on February 28, 2014. On May 1st, 2014, a group of investors by the name of Sunlot
    Holdings offered to buy the site for one symbolic bitcoin. In 2016, after the
    Brexit announcement on June 24th, the value of bitcoin skyrocketed, gaining more
    than 9%, while all financial  centers plunged for more than a week. This was probably
    the first time that the true strength of Bitcoin was shown to the world. In fact,
    BTC is an asset that does particularly well when there is turbulence in the world.
    We have seen this in 2020, where it rose by over 600% in just one year. In 2017,
    Bitcoin topped out at around $19,000 and entered a long bear market of over 2
    years. Those who accumulated during that time were brave enough to survive more
    than 700 days without seeing the asset climbing back to its all time high. However,
    in 2020, Bitcoin finally managed to break that level and skyrocketed. At the time
    of writing this book, one bitcoin is worth around $60,000. Think about it, if
    you bought $10 worth of Bitcoin on February 9th, 2011, you would now have an equivalent
    of over $600,000. These kind of numbers really impress us. '
