    two fundamental steps. First, dedicated network nodes (the “miners”) create a
    new block by grouping together recently completed transactions and adding a header
    to them containing the date and time, a checksum (“hash "), which will also serve
    as the unique identifier of the block, and the identifier of the previous block.
    Secondly, after having checked the validity of all the transactions contained
    in this new block and their consistency with the transactions already recorded,
    each miner adds it to their local version of the register (or chain of blocks).
    The public register is copied several times. The complete history of all transactions
    can then be read by viewing all nodes in the network that manage a copy of the
    blockchain. The copy can reveal possible differences between files, in the event
    of disagreement. In this case, any differences between these copies must be resolved
    by the software. If you think about it, transactions consist of debiting certain
    accounts in order to credit others. They are made up of inputs and outputs. Each
    output includes an amount and the public key of the credited address, or more
    generally a program (a script) making it possible to authorize or not the transfer
    of the amount of this output to another transaction. Each input designates an
    output from a previous transaction and has a program (script) that provides the
    data expected by the script appearing in that output. The sum of the values ​​of
    the outputs must be less than or equal to the sum of the values ​​of the inputs.
    The difference constitutes the miner''s remuneration. When creating a transaction,
    scripts for each entry are executed;  first the script of the entry itself, then
    the script of the earlier exit that the entry refers to. The transaction is only
    committed if the result is "true" for all inputs. These scripts are written in
    an internal language designed by Nakamoto. This language is intentionally minimalist
    and not Turing-complete in order to prevent the system from being able to engage
    in infinite loops. The use of scripts should allow the software to easily adapt
    to future developments and allow support for advanced features such as transactions
    involving multiple signatures or smart contracts. Transactions made by a node
    are broadcast to its neighbors. These validate the transactions they receive and
    gradually consolidate them into a local pool before passing them on to their own
    neighbors. The valid transactions are thus broadcast step by step to all the nodes
    of the network, after a new check during each step. Before permanently registering
    a transaction in the blockchain, the network performs several times a set of checks,
    including in particular that the outputs referenced by the inputs do exist and
    have not yet been used, that the author of the transaction is indeed the owner
    of the address credited in these outputs, and that the sum of the amounts appearing
    in the outputs of the transaction is much less than or equal to the sum of the
    amounts of the outputs referenced by the inputs. It is a bit complicated, but
    if you read this last sentence a couple of times you will get a better grasp of
    what actually happens during a transaction. The effect of entering a transaction
    in the blockchain is to prohibit any future reference to the outputs designated
    by the inputs of this  transaction, and therefore to prevent a double expenditure
    of the amount of these outputs, which would amount to creating from scratch bitcoins
    in an unauthorized manner. The only allowed creation of bitcoin from scratch is
    through a special transaction called Coinbase (not the exchange) inserted at the
    start of each block in the chain to pay the miner who inserted the block. A transaction
    is taken into account instantly by the network and confirmed for the first time
    after approximately 10 minutes. Each new confirmation reinforces the validity
    of the transaction in the transaction register. Bitcoin addresses Each user can
    have any number of addresses that can be created through the wallet. Each bitcoin
    address has a public key and a private key pair associated with it. An address
    is equal to the 160-bit (20 bytes) cryptographic hash of its public key. A bitcoin
    address also has a prefix identifying the version number (0 by default) and a
    four-byte checksum. In all, a bitcoin address occupies 25 bytes. An address is
    represented in ASCII format thanks to a dedicated encoding of 58 alphanumeric
    characters: upper and lower case numbers and letters, with the exception of the
    letters and numbers l, I, 0 and O, which Nakamoto excluded due to their resemblance
    in some typefaces. Here is, as an example, the very first bitcoin address that
    received bitcoins. 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa106. To use the sum contained
    in an output of an existing transaction crediting a bitcoin address, the user
    must make use in the input of a transaction of the private key corresponding to
    the address by signing the transaction. The network checks the validity of this
    signature using the public key associated with the credited address, using asymmetric
    cryptography techniques. The operation is repeated for each entry of the transaction.
    Wallets Each user''s wallet contains their personal data, including the address,
    public key and private key of each of their accounts. It can also contain user-specific
    information built from the blockchain. For example the list of available transaction
    outputs or account balances. The wallet software provides the functions of creating
    accounts, consulting accounts, constructing and sending transactions. There is
    a choice of wallet software for all varieties of devices including smartphones.
    They differ in the extent of their ancillary functions and in their user interface.
    The information contained in a user''s wallet is critical and must be strictly
    protected against any intrusion. If the private key of an account is lost, the
    user can no longer access the transactions that fund this account, nor create
    new transactions from it. His bitcoins are permanently lost and will stay forever
    in the database without being able to change address. In 2013, a user lost 7,500
    bitcoins, at the time worth $7.5 million, by accidentally throwing away the hard  drive
    that contained his private key. The discovery of the private key of an account
    by another user allows this one to steal the identity of the legitimate account
    holder and to spend the bitcoins which would come to be there, which is equivalent
    to the theft of bitcoins. The mining process The mining operation consists of
    assembling transactions into "blocks", by adding a header indicating in particular
    the size of the block, the number of transactions recorded, the date and time,
    a checksum ("hash" ) prohibiting any modification of the block and also serving
    as a unique identifier for the block, as well as the identifier of the previous
    block. Miners include in the blocks they constitute a particular transaction which
    credits them with a certain number of bitcoins created for this purpose, and incorporates
    specific transaction fees. However, this remuneration will only be effective if
    the block is definitively accepted in the blockchain by the other nodes. It is
    this creation of money that explains the use of the term "mining", by analogy
    with the exploitation of gold mines. A block can contain any number of transactions,
    typically between 1000 and 2000, but the block size cannot exceed 1 megabyte (for
    the Bitcoin Core system). Within a block, transactions are stored in the form
    of a Merkle tree. The checksum (or fingerprint) of the block is calculated by
    applying twice a SHA-256 hash to the sextuplet made up of the following  components.
    ●      The software version number; ●      the footprint of the header of the
    previous block; ●     the root of the block''s transaction tree (which is itself
    an indirect fingerprint of all the block''s transactions); ●     the timestamp
    (time elapsed since January 1, 1970, in seconds); ●      the “nonce”. The calculation
    of this footprint is made intentionally difficult by the requirement to be less
    than a certain value, which is materialized by a binary representation starting
    with a certain number of zeros. To this end, the fingerprint contains among its
    components, an arbitrary 32-bit number, called the “nonce”. Even if one knows
    the hashes corresponding to certain nonces, the hashing makes it impossible to
    determine the value of the hash for a new nonce without running the algorithm
    again. Therefore, we can only find the appropriate nonce for the bound requirement
    on the value of the fingerprint by making several tests. For a given value of
    the nonce, the probability of calculating a footprint less than the difficulty
    is very low, so many attempts must be made before this is achieved. Between 2014
    and 2016, the average number of nonces that each miner had to test between each
    creation of blocks increased from 1 billion to 200 billion. This calculation consists
    of performing the same calculation a very large number of times from different
    data, so it lends itself well to parallel calculation. The difficulty is readjusted
    every 2016 blocks to take into account the real computing power of the network
    and allows on average to add a block every 10 minutes, which amounts to saying
    that the probable duration of calculation of a valid footprint is 10 minutes for
    the most powerful computer or group of computers on the network. This system of
    proof of work and chaining of blocks by their footprint makes any alteration of
    the blockchain practically impossible (except in the case of a 51% attack). An
    attacker who wishes to modify a transaction in a given block would be forced to
    recalculate his checksum and that of all subsequent blocks. As the difficulty
    increases over time, as does the number of blocks after the modified transaction
    (its degree of confirmation), the time required to make such a modification increases
    very rapidly. When a miner has built a valid block whose checksum satisfies the
    difficulty condition, it broadcasts it to neighboring nodes, who check its validity
    before reposting it in turn. The remuneration for mining work is made in bitcoin.
    The payout is known as the block reward. The current block reward is 6.25 bitcoins.
    This reward is halved for every 210,000 blocks. The valid blocks are thus broadcast
    step by step to all the nodes of the network, not without having been checked
    beforehand, but without being able to be modified. From the nonce included in
    the header, it is quick and easy to check the validity of the block (a simplistic
    parallel can be made with a sudoku game: its resolution is difficult and requires
    time and human calculation but its verification is very easy once the solution
    is found). The environment dilemma Mining is an activity often criticized because
    of the supposed environmental imprint of its energy consumption. However, some
    observers weigh down the criticism by pointing out that the “classic” monetary
    network consumes much more energy, through millions of cash dispensers or the
    infrastructures necessary for the proper functioning of the classic monetary system,
    such as data centers. The majority of bitcoin miners use renewable energy because
    it is cheaper in regions of the world that favor mining (low temperature, presence
    of dams, geothermal energy, etc.). Estimate of power consumption The power consumption
    of Bitcoin mining is difficult to assess due to the decentralization of the activity.
    The figures most often cited by the press come from the “Digiconomist” site created
    by a Dutch financial analyst. According to his estimate, which is based on the
    assumption of an economic balance between mining revenues and costs, the global
    electricity consumption caused by mining would be 71.1 TWh / year (1 terawatt-hour
    (TWh) = 1 billion kilowatt-hours (kWh)). This would totat to about 0.32% of global
    electricity consumption. With only around 200,000 transactions per day in 2018,
    Bitcoin''s electricity consumption would be around 1,000 kWh per transaction on
    July 1st, 2018. By comparison Visa consumed 0.19 TWh / year to manage 111 billion
    dollars. transactions in 2017 (around 300 million transactions per day), i.e.
    0.001 7 kWh per transaction. Bitcoin would thus consume approximately 600,000
    times more energy per transaction than Visa. Note, however, that  mining consumption
    is independent of the number of transactions. The estimates of the “Digiconomist”
    site are nevertheless contested and considered exaggerated. In fact, according
    to Marc Bevand, a computer security engineer, they overestimate the power consumption
    of Bitcoin miners by a factor of 1.5 to 2.8 (probably 2.2), which would reduce
    the total power consumption to 32.3 TWh / year, or 424 kWh per transaction (the
    equivalent of the consumption of a 1000 W radiator operating for almost 18 days).
    These estimates are marred by uncertainties due to the assumptions they require,
    but it is possible to calculate a minimum power consumption of the Bitcoin network
    from verifiable data. ●     The number of hashes per second: 37.1 × 1018 H / s
    on July 1st, 2018; ●     the power and chopping capacity of the most efficient
    machine on the market (Bitmain''s Antminer S9): 1323 W for 13.5 × 1012 H / s.
    It is thus possible to affirm that the Bitcoin network had at least 2.8 million
    mining machines on July 1st, 2018 and that its electricity consumption was at
    least equal to 32.2 TWh / year. The number of entities securing the Bitcoin network
    is constantly increasing which increases the value of bitcoins. According to a
    Bank of America report published in March 2021, the bitcoin network consumed 0.4%
    of global electricity at the end of 2020, or about as much as the Netherlands,
    and emits as many greenhouse gases as oil burned by American Airlines. In two
    years, these emissions have increased by 40 million tonnes, the equivalent  of
    8.3 million cars, to reach 60 million tonnes. Three quarters of the world''s mining
    capacity is based in China; 27% of Chinese miners are in Sichuan, a province with
    strong low-carbon hydroelectric production, but 43% are in Xinjiang, where 80%
    of electricity comes from coal-fired power stations. Why is power consumption
    so important? The very high energy consumption of Bitcoin is linked to the new
    block mining system, which is supposed to protect the system from fraud in the
    absence of a central authority. Security is based on a mathematical problem the
    solution of which is difficult to find and the resolution of which is inherently
    expensive. To have a chance of adding the next block to the chain, miners must
    indeed invest heavily in server farms in order to have great computing power.
    These farms use a lot of electricity to power and cool the servers. To be able
    to register a new block on the blockchain, miners must solve a mathematical problem
    submitted to everyone who competes, and it is the first who finds a solution that
    proceeds to the registration and earns a fee in bitcoins. Since the solution can
    only be found by trial and error, it is the miner who is able to make the maximum
    number of tries who has the most chance of winning. The difficulty of the problem
    is adjusted so that the computation time necessary for its resolution is of the
    order of 10 minutes. The magnitude of the electricity consumption is linked to
    the intensity of the calculations and to the fact that these calculations are
    made simultaneously by a large number of miners. It is linked to the price of
    Bitcoin, because the higher it is, the more the remuneration increases and the
    more miners there are. This is  reminiscent of Henry Ford''s prediction at the
    start of the twentieth century: "An energy currency will replace gold and end
    wars". According to Fabrice Flipo and Michel Berne, of the Institut Mines-Télécom,
    the generalization of crypto-currencies could lead to an energy consumption greater
    than eight times the electricity consumption of France, i.e. twice that of the
    United States, because their security and the confidence we have in them are based
    on a mathematical problem whose answer is difficult to find and whose resolution
    is in essence expensive. The optimization of equipment and technical progress
    would make it possible to consume only 417 MW by 2021, which would nevertheless
    require nearly 5,500 kWh to produce a bitcoin, i.e. half of the annual electricity
    consumption of an American household. Thus, for researcher Nicolas Houy, of the
    Lyon/Saint-Étienne Analysis and Economic Theory Group, “a large amount of money
    could very well be managed by a small amount of miners”. Groups of miners The
    difficulty of mining has led miners to group together in mining pools to combine
    their computing resources and build new blocks more quickly. The remuneration
    corresponding to the constitution of each block is then divided proportionally
    between the members, after deduction of fees, which makes it possible to smooth
    their income and makes them less uncertain. In 2016, around ten of these cooperatives
    supplied 95% of the blocks. They are largely found in China (which accounts for
    most of the hash energy on the bitcoin network), but also in the Czech Republic
    and Georgia. Remuneration for mining activities has led to the development of
    ever more specialized technologies. The most efficient hardware uses integrated
    circuits that outperform general-purpose processors while using less power. As
    of 2015, a miner not using equipment specially designed for mining had a low probability
    of covering his electricity and equipment costs, even by joining a mining group. '
