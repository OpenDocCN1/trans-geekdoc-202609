    \ it was already worth $0.01. A few months later, in July 2010, 0.08 dollars were\
    \ added to its value again. These numbers reflect the rapid rise in prices that\
    \ this zero-value cryptocurrency has experienced at 10 cents. Since its creation\
    \ in 2009 and until the closure by the American  authorities of Silk Road in 2013,\
    \ bitcoin was used mainly as a medium of exchange by criminal networks for gambling,\
    \ the purchase of illicit substances, or for hacked databases. The cryptocurrency\
    \ has attracted the attention of financial authorities, legislative bodies in\
