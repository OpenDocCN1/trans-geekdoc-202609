    # 第 13 章 - 存储你的比特币


    现在你已经了解在哪里购买第一个比特币，是时候妥善存储它了。事实上，一旦购买完成，你就不希望将你的币留在交易所。到现在你应该知道，如果你不拥有私钥，就不能说你真正拥有你的比特币。因此，拥有一个可靠的地方来存储和积累你的币以备将来使用非常重要。在本章中，我们将看看一些最受信任的加密货币钱包。让我们从我们个人用来存储比特币的那个开始：Ledger
    Nano X。


    ## Ledger Nano X


    在接下来的几页中，我们将考虑所有需要知道的重要方面，包括 Ledger Nano X 的价格。我们还将看到如何使用它来保持你的加密货币安全，将它们离线保存在一个完全保护它们免受任何网络攻击的设备中。我们提醒你，这个系统是唯一真正可靠的系统：交易所的在线钱包，即使是最著名的，也连接到互联网，因此暴露于网络攻击之下。而硬件钱包则不同，它们只在你需要执行操作时连接，其余时间完全不可访问。除了无法从外部受到攻击之外，硬件钱包还能保护你免受丢失设备的可能性。事实上，得益于一种以独特方式识别你的密码系统，如果你丢失了
    Ledger Nano X，你只需要购买另一个并恢复所有虚拟货币资产。该设备比之前的设备更加紧凑和轻便，仅重 34 克，比普通 USB 闪存盘更方便携带。包装包括以下内容。


    - 设备；

    - 一根用于连接计算机或智能手机的 USB 电缆；

    - 一张带有使用 Ledger Nano X 说明的图示纸；

    - 一条用于悬挂设备并可能挂在脖子上的带子；

    - 三张用于恢复密码的纸，有空间标记它们，并附有丢失时的说明。


    ![](img/image_rsrc1U3.jpg)


    正如你所想象的，这款顶级产品什么都不缺。Ledger 让我们有机会直接通过包装中的说明学习如何使用设备，并且还为我们提供了所有工具将其连接到我们的电子设备。Ledger
    Nano X 的核心是 BOLOS，这是 Ledger 开发的操作系统。代码不是开源的，这意味着开发者无法对其进行定制，但也无法被寻找漏洞的潜在攻击者访问。该公司严密保护
    BOLOS 代码的每一行，事实上，这种直觉多年来对其设备的安全性证明非常有用。BOLOS 已经预装在 Nano X 微芯片中，因此不需要通过下载到计算机并通过
    USB 电缆传输软件来进行任何外部安装。一些竞争产品预留的这一步骤，一方面允许每个人下载他们偏好的固件版本；另一方面，不必要地将硬件钱包暴露在互联网连接下会增加被攻破的风险。Ledger
    Nano X 兼容运行 Windows 8 或更高版本的计算机，以及运行 Mac iOS 10.9 或更高版本的 Apple 设备。它还连接到移动设备。特别是，你需要
    Android 7.0 和 iOS 9 才能建立成功的连接。如果要划一条分界线，我们可以说它与 2017 年之后发布或更新的所有操作系统兼容。无论如何，我们建议你检查设备上安装的系统特性，以确保它与
    Ledger Nano X 兼容。


    Ledger Nano X 可以通过两种方式连接到你的设备。首先，与其他所有硬件钱包一样，它可以通过 USB 电缆进行连接。然而，今年的新功能是可以通过蓝牙将
    Ledger 连接到你的设备。当公司宣布此功能时，争议立即爆发。事实上，蓝牙连接比通过互联网的连接更容易受到攻击。如果设备已经设计为尽可能短时间保持网络连接，那么让它连接蓝牙数小时似乎与加密货币的理念不太一致。然而，Ledger
    确认通过蓝牙传输的数据是公共数据。这意味着，即使被他人窃取，也无法以任何方式有用；所有私有加密密钥都是唯一的，并在钱包内严密保护，永远不会离开设备。当通过蓝牙或
    USB 电缆连接到设备时，Ledger Nano X 就像一个存钱罐，可以用来接收或发送加密货币。显然，每个设备都必须使用专用软件和个人密码进行配置，以便即使在被盗的情况下，也无法有人将其连接到他们的计算机并随意使用。然而，即使在这种情况下，连接的设备也因专用应用程序而受到屏蔽，该应用程序过滤信息的传递。得益于这种中介，所有关键数据永远不会在
    Nano X 之外传输。


    新的 Ledger 兼容超过 1,100 种加密货币，软件更新逐渐扩大了选项范围。尽管如此，每个 Nano X 只能存储 100 种不同的加密货币。虽然很少有人需要存储超过
    100 种不同的加密货币，但对于喜欢分散投资组合并充当加密货币风险投资家的人来说，这仍然是一个限制。要添加加密货币，只需从任何设备打开 Ledger Live
    软件。程序打开后，你将被要求使用凭据进行身份验证，从而访问包含所有可用功能的主面板。此时，你需要前往可用加密货币目录，选择你感兴趣添加到我们钱包中的一种。选择应用程序后，其下载将开始。代码将被传输到你的
    Ledger Nano X，从那时起，它将准备好托管所选加密货币的钱包。要添加你的投资组合，你需要打开应用程序并完成流程。你将被要求提供钱包的访问密钥，一旦完成，我们就已正确配置了设备上的存储。


    重要的是要理解，从技术上讲，加密货币并不是被“发送”到 Ledger，因为它们不是从一个钱包转移到另一个钱包。唯一改变的是区块链上关于资金存放位置的信息。无论如何，为了简单起见，我们将继续使用“发送”一词来使主题更清晰。一旦你打开应用程序，假设是比特币的应用程序，顶部你会找到两个按钮：“发送”和“接收”。点击“接收”将显示一个唯一代码，可以用作将你的比特币直接发送到
    Ledger Nano X 的目标地址。此时，只需使用此密钥作为发送加密货币的地址即可。发送程序因你之前存储代币的位置而异；如果你第一次从交易所购买，你可以让它们直接发送到
    Ledger Nano X 上显示的地址。发送加密货币的程序几乎与之前相似，唯一的区别是你需要点击“发送”按钮而不是“接收”按钮。你的离线钱包会要求你输入接收方钱包。输入后，只需点击“发送”按钮即可完成程序。得益于
    Ledger Nano X 上的加密货币应用程序，你可以随时查看余额以及进出交易。这样你可以随时掌握资产概览并控制现金流。


    有各种在线商店出售 Ledger，但能够信任零售商变得极其重要。事实上，有人可能会出售被攻破的设备，目的是窃取其中包含的币。事实上，只需更新操作系统并安装一个专门编写代码的系统，就能实现这种恶意效果。如果你不想冒任何风险，我们建议你直接在
    Ledger 网站上购买（`https://www.ledger.com/`）。


    ## Trezor


    Trezor 是一个通过 USB 端口连接到计算机的硬件钱包。它可以存储、发送和接收不同类型的加密货币，其中包括比特币、以太坊、以太坊经典、莱特币、名称币、狗狗币、达世币、比特币测试网，甚至
    ZCash。它包括重要的安全功能，例如密码管理器和双重身份验证。它还可以与其他非常流行的钱包集成，例如 MyEtherWallet 和 Copay，以安全地管理你可能在这些特定平台上开设的虚拟钱包。Trezor
    是一个设计简洁的硬件钱包，体积小巧，易于连接到你的 PC，并且还附带一条小带子，允许你将其直接连接到钥匙链上，使其更方便携带。 ![](img/image_rsrc1U4.jpg)


    在撰写本文时，它有黑色和白色两种不同颜色可供选择。在设备正面，你还会发现一个黑底白字的低分辨率显示屏以及两个按钮，你需要使用它们来继续操作或取消操作。还可以通过随硬件钱包提供的软件，尤其是
    Trezor 提供的 Google Chrome 扩展程序，与互联网上几乎所有主要交易所进行交互。Trezor 在管理包含大量加密货币的钱包方面提供了肯定足够的安全性。首先，它允许你在安装阶段生成一个
    24 字助记短语来备份钱包。首次安装后，还必须输入 PIN 码：输入 PIN 码时的任何错误都会指数级增加下一次尝试的等待时间。这意味着进行 30 次尝试大约需要
    17 年。借助 24 字助记短语，你可以随时恢复钱包，即使你购买的 Trezor 丢失或损坏。同样重要的是要考虑到将恢复方法与 Electrum 等虚拟钱包集成的可能性。这是
    Ledger Nano X 没有的功能。关于 Trezor 的另一个重要安全功能是，批准交易时必须在硬件钱包上按下按钮。这意味着，即使在极不可能的情况下有人远程进入你的
    Trezor，他们也无法在未经你同意的情况下批准交易。TREZOR 的隐私档案也很有趣。事实上，我们面对的是一个没有序列号的设备，因此无法被任何人追踪，更不用说制造商了。在加密货币世界中，用户追踪几乎是每种服务的现实，这是一个巨大的优势。一旦你购买了它，没有人能将你的
    Trezor 与你的订单关联起来。还值得一提的是，Trezor 还兼容世界上大多数流行的软件钱包，其中包括 Electrum、GreenAddress、Multibit、Mycelium，以及
    myTREZOR.com 提供的软件钱包。还值得记住制造商公布的技术规格。


    - 重量：12 克

    - 尺寸：6 x 3 x 0.6 厘米

    - CPU：ARM Cortex M3 120 MHz

    - 显示屏：128 × 64 像素 OLED 亮屏

    - 连接性：Micro USB

    - 支持的系统：Windows、Mac、Linux、Android


    此外，Trezor 的源代码可在 github 上找到，母公司邀请任何有兴趣和能力的人修改代码，并将上述更改提议给固件代码的主分支。这对于那些希望在更技术层面上了解更多关于加密货币和编程的人来说是一个绝佳的机会。如果出于任何原因你不想购买
    Ledger Nano X，那么 Trezor 绝对是目前第二好的硬件钱包。


