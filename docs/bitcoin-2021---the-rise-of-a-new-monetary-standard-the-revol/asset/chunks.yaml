    # 1. Futures exchanges are managed by market experts


    The creators of Bitcoin invented the blockchain, a cutting-edge technology that
    promises to revolutionize the world. However, they are not experts in creating
    markets. The CME and the CBOE both have a long experience in creating futures
    contracts for buying and selling. The launch of these trading venues will improve
    price management. This means that any new Bitcoin information will be quickly
    reflected on the contract price.


    # 2. Large financial companies are familiar with futures


    Wall Street firms are familiar with futures exchanges and how they work. Most
    of these carry out back-office operations that allow you to easily trade such
    instruments. This ease of use will attract more dollar volume on Bitcoin-related
    contracts. As a result, the Bitcoin futures market will become very liquid, perhaps
    more liquid than Bitcoin itself. For instance the SPDR S&P500 ETF is more traded
    than the underlying stocks in the index and a similar dynamic could also occur
    on Bitcoin futures.


    # 3. The reference price


    Contracts will be settled on each trading day using a transparent reference price.
    The reference price may not be perfect, but it will soon be written in contracts
    that provide for the payment or receipt of Bitcoin as is the case in other markets.
    For example, jewelry manufacturers and retailers often use gold reference prices
    in their contracts. In short, having a transparent settlement price will simplify
    the issue of using Bitcoin as a payment method.


    # 4. Futures contracts are not lost


    You can lose money on it, but you will never lose a futures contract. On cryptocurrency
    exchanges, however, it has already happened that Bitcoins were lost or stolen.


    # 5. You can bet on the price drop


    Going short on a futures contract is as simple as buying it. Those who believe
    that the Bitcoin price is in a speculative bubble can thus bet on a deflation
    of prices.


    # 6. It is a regulated market


    The Commodity Futures Trading Commission (`CFTC`) regulates futures trading. Those
    who love Bitcoin because it is not a government currency will not agree that regulation
    is an advantage. However, it''s a significant plus for Bitcoin fans in general.
    The good news is that `CFTC` rules aren''t as tough as those for stocks and bonds.
    What it does is introduce some rules that all market participants must adhere
    to and sets a level playing field for all speculators and investors who expose
    themselves to futures contracts. This feature will attract professional traders
    and thus increase the trading volume in the market. More trading volume will be
    beneficial for Bitcoin fans because it will make cryptocurrency futures a significant
    financial instrument, and consequently Bitcoin itself as well.


    # Chapter 16 - Bitcoin Options


    Now that you understand the fundamentals of bitcoin futures, we can discuss an
    even more complex financial instrument. We are talking about options. So mistreated
    by retail investors and yet so used by large investors on traditional markets,
    bitcoin options are a great tool to hedge spot positions. In this chapter we will
    try to clarify what they are and we will try to demonstrate that the bad reputation
    they enjoy in the eyes of the general public is actually unfounded and that on
    the contrary, if used correctly and consciously, they possess characteristics
    that make them tools very useful to enrich your arsenal of investment and trading
    strategies.


    To do this, let''s start by clarifying the basic concept, which however many manage
    to make complicated right from the start. How do options on Bitcoin work? The
    option can actually be considered as an insurance on the asset you hold, Bitcoin
    in your case, against a particular scenario that you think or fear may occur.
    To have this possibility, you pay an initial sum (exactly as you pay the insurance
    premium at the time of stipulation), high or low depending on the probability
    that the scenario has to come true. And exactly as in the case of an insurance,
    the option also has an expiry date, at the choice of the purchaser, beyond which
    it is no longer valid and can be exercised by the holder.


    If your vision is a rise in the price of bitcoin, you will buy an upward option
    that "protects" you from a price increase beyond a certain value and will allow
    you to buy BTC in the future at a cheaper price (`strike price`). This type of
    option is called the `CALL` option. If, on the other hand, your view is bearish,
    you will buy a bearish option that protects you from a decrease in the value of
    bitcoin below a value of your choice (always called the `strike price`). This
    option is called `PUT`.


    And now the question that arises spontaneously: “but if my vision is bullish,
    why not buy Bitcoin right away before the price goes up? And if it is bearish,
    why not sell now?" Well, the advantage of the option is precisely this. It gives
    you the opportunity to delay the decision to a future moment. If you were right,
    the insurance / option will make you collect the price difference between the
    value decided at the time of stipulation and the actual value on the day of sale
    (or expiry of the option). Otherwise, the option expires and you will have lost
    the premium paid initially.


    It should be emphasized that, as in the case of an insurance, the maximum loss
    is the sum paid on stipulation. There is no liquidation risk, so much so that
    no maintenance margin is required for the purchase of options and there is no
    additional "hidden" outlay in addition to the initial one for the purchase.


    ## Where to buy options


    Certainly the first market to be mentioned in this sense is the `CME`, Chicago
    Mercantile Exchange, where futures and related options are listed on traditional
    financial markets. From 2020 the options on Bitcoin have also been added. The
    same goes for the `BAKKT` platform which is part of the `ICE` group. However,
    trading in these markets is only open to institutional and professional investors.


    A common investor looking to buy Bitcoin options has to rely on other types of
    platforms. Almost all exchanges offer the possibility to buy futures, but not
    options on Bitcoin, whose trading is currently the prerogative of `Binance`, `FTX`,
    `Deribit`, `Okex` and `LedgerX` only. While as far as futures are concerned, all
    exchanges provide similar, if not identical, services, for options the situation
    is different. In fact, `Binance` and `FTX` provide a service only on demand, i.e.
    there is no market with a book consisting of bids and offers such as we are used
    to seeing, but it is necessary to request a particular option with the desired
    characteristics and expect a quotation from the exchange itself or from another
    user of the platform willing to sell it to us. This type of transaction can be
    defined as `OTC`, i.e. each option is tailored to the applicant and is only recommended
    for expert users who know what they are doing, as this type of market is less
    liquid and less transparent.


    Instead, `Deribit`, `Okex` and `LedgerX` offer a type of negotiation similar to
    that of any crypto or crypto futures. Therefore, they are standardized, complete
    with a buy and sell book, and the same characteristics for each market participant.
    This feature makes buying, selling, and understanding what you are doing much
    easier.


    If you are a beginner, we advise you to stick to the basic strategy of buying
    and selling spot bitcoins. In fact, futures and options are two extremely complicated
    financial instruments and should be used only by those that have some trading
    experience.

    '
