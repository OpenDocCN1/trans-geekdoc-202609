    # 第 15 章 - 比特币期货


    在前面的章节中，我们一直在讨论购买“实物”比特币。然而，金融世界极其迷人，并具有创造极其复杂且与“现实”没有直接联系的金融工具的能力。由于本书是关于比特币的，我们认为谈论与该资产交互的不太为人知的可能性至关重要。因此，在接下来的几页中，我们将介绍您需要了解的关于期货的所有内容。许多人想知道比特币期货是如何运作的。从严格的技术角度来看，这些是正常的期货合约，就像它们在金融市场上存在已久一样。它们的特殊之处在于它们以
    BTC 作为基础资产。事实上，期货合约正是两方之间关于在未来日期或到期时，以及双方商定的特定价格购买或出售商品的合同。在合同到期时，双方实际上有义务履行协议，以先前商定的价格买卖，无论基础资产的价格在此期间是下跌还是上涨。它们被用作一种对冲价格波动风险的保险。然而，它们也经常被用于投机。它们也是可交换的，即一旦期货合约签发，签署合同的各方可以在市场上出售。当两方之间签署期货合同时，一方同意买入，另一方同意卖出。决定买入基础资产的人被认为开立了多头头寸，而决定卖出的人被认为开立了空头头寸。期货合约最初是专门为商品交易而创建的，但实际上它们可以用于交易任何资产，包括纯粹的金融资产，例如比特币或其他加密货币。比特币期货可以用来保护自己免受
    BTC 价值大幅波动的影响，但实际上它们经常被用于在不实际拥有比特币的情况下投机 BTC 的价格。此外，许多允许 BTC 交易的交易所并未完全受到监管，而允许
    BTC 期货交易的交易所，例如 ICE 或 CME，则完全受到监管。期货允许那些不信任未受监管交易所，或者那些根本无法投资于未完全受监管市场的机构投资者进行交易。每个单独的合约包含一定数量的基础资产，而在比特币期货的情况下，该数量通常为
    1 BTC。还有基于实物比特币的期货合约，例如 Bakkt 的合约，以及基于复制价格的指数的合约，例如 CME 的合约。那些不基于实物比特币的合约以现金结算，即在到期时交易以普通法定货币进行，而不是以
    BTC 进行。自 2017 年 12 月首批比特币期货合约上市以来，其成功程度逐渐增长，以至于近期的交易量开始变得显著。事实上，说句实话，在那些既可以交易实物比特币也可以交易比特币期货合约的平台上，后者的交易量往往显著超过真实
    BTC 交易的交易量，这正是由于期货特有的特性，允许非常便捷的交易，并且即使是对要求最严格的投资者也触手可及。这是一个不仅在比特币市场有效，而且在其他商品市场也有效的特性。但是，请记住，当您交易期货时，您永远不拥有实际的基础资产。使期货如此具有投机性的是使用杠杆的可能性。让我们来发现它是什么以及它涉及什么。


    ## 杠杆


    杠杆是一种工具，允许您以相对较小的资本投资增加在金融市场上的风险敞口。它无疑是期货交易中最重要的特性之一。当您投资于杠杆产品时，交易所会要求您仅存入总头寸价值的一小部分。剩余部分的资金将由交易所本身提供。但是，您的盈亏将基于整个风险敞口。因此，您获得或损失的金额可能看起来远高于实际投资的资本。它甚至可能超过您的初始投资。这是杠杆的关键概念，也是吸引大多数加密货币爱好者的原因。初始支出被称为保证金或存款要求。您的提供商会要求它来覆盖您可能遭受的全部或部分潜在损失。保证金通常是整个风险敞口的一小部分，其价值取决于各种因素。例如，一个流动性更好且波动性更低的市场需要的保证金（例如
    5%）低于波动性大且流动性低的市场。某些产品要求每个合约支付固定保证金，而在其他情况下，保证金按头寸价值的百分比计算。


    ### 杠杆的工作原理


    让我们从一个澄清疑问的例子开始。如果某个特定市场要求 10% 的保证金，这意味着您只需投资 100 美元就可以获得 1000 美元投资的风险敞口。因此，杠杆等于您投资价值的
    10 倍，或者如技术术语所说，杠杆为 10:1。假设您想购买 1 个比特币期货合约。如果当前价格为 60 欧元，该交易将花费您 60,000 美元。如果价格每合约上涨
    2000 美元，您可以以 62,000 美元平仓。然而，一些交易所为您提供使用杠杆购买比特币期货合约股份的机会，只需支付保证金（即 6000 美元总额的百分比）以换取总风险敞口。假设初始保证金要求为
    10%。您将支付 10% x 60000 美元 x 1 个合约 = 6000 美元。如果股价从 60,000 美元上涨到 62,000 美元，您将获得与非杠杆交易相同的利润（2000
    美元）。在两种情况下，您都获得了相同的利润，但使用杠杆您只需支付 6000 美元的保证金，而不是全额 60,000 美元。您的回报率为 100%，远高于直接购买合约所能实现的
    20%。尽管杠杆是一种出色的金融工具，但仍建议您始终记住，它不仅放大了潜在利润，也放大了损失，在市场对您不利的情况下，损失有时甚至可能超过初始存款。


    ### 杠杆的优势


    杠杆的主要优势是它允许您在投资组合中保留更多流动性，因为您只需占用一小部分资本。您还可以充分利用您的资本，也许投资于多种不同的资产，而不是仅一两种，从而分散您的投资组合。但是，应记住，通过杠杆操作，您放弃了实际拥有比特币所带来的所有优势。同样重要的是要记住，如果市场向对您不利的方向移动，您可能需要支付额外保证金以覆盖损失。


    ### 谁应该使用杠杆


    投资者和交易者使用杠杆来放大其对各种市场的风险敞口。这使他们能够在投资组合中保留更多流动性用于其他投资，比实际购买资产更好地分散资本。您可以在 Binance
    上对大多数加密货币使用杠杆。公司也使用杠杆来投资能够带来相对较高回报的资产。一种流行的商业策略是使用债务来融资资产。这是因为公司相信他们可以从这些投资中获得的回报超过他们必须为债务支付的利息成本。


    ### 金融杠杆的影响


    您必须始终牢记，杠杆放大了收益和损失的范围。虽然您有很好的机会获得可观的利润，但您的潜在损失并不局限于初始存款。以投资百分比表示的最大损失，在使用杠杆交易时更高。但是，应注意的是，最大风险，即您可能损失的最高金额，无论您是以全额购买资产还是仅支付保证金，都是相同的。因此，重要的是您要考虑总头寸价值，而不仅仅是您预期的保证金。因此，您不应在没有准备好全额覆盖任何损失的情况下进行杠杆投资。


    ## 比特币期货的 6 个优势


    根据一些专家的说法，交易比特币期货也可能是押注世界上最流行的加密货币的最佳方式。以下是一些人相信这一点的六个主要原因。


