    # Chapter 2 - The History of Bitcoin


    Bitcoin is an improvement on the concept of b-money, imagined by Wei Dai in 1999,
    and bitgold, described in 2005 by Nick Szabo. Bitcoin in particular solves the
    crucial problem of the trust model: servers considered serious vote with their
    computing power to determine the legitimate transaction chain. In b-money, the
    servers were supposed to pay a security deposit according to a not very explicit
    mechanism. The idea of using a computational proof chain was put forward in the
    bitgold project although Nick Szabo only proposed to use a majority of addresses
    to establish the legitimacy of a chain of transactions, which left the problem
    of controlling the number of addresses. Satoshi Nakamoto claimed that he worked
    on bitcoin from 2007 to 2009. As early as 2008, he posted a document on a mailing
    list describing the digital currency. In February 2009, he published an announcement
    about his work on the P2P Foundation site. On January 3, 2009, the first block
    or genesis block was created. In February 2009, he distributed the first version
    of the Bitcoin software on the P2P Foundation site and to operate the network,
    he used his computer and thus generated the first bitcoins. Along with other developers,
    Nakamoto continued the implementation of the software and its Bitcoin-Qt version
    until 2010. Developers and the bitcoin community gradually lost contact with him
    in the middle of 2010. On December 12, 2010, a final message was posted by Nakamoto
    on the main forum. Shortly before disappearing, Nakamoto designates Gavin Andresen
    as his successor by giving him access to the SourceForge bitcoin project and a
    copy of the alert key. The latter is a unique private cryptographic key allowing
    to mitigate the effects of a potential attack on the Bitcoin system, such as the
    discovery of a cryptographic flaw allowing to modify the transactions, or the
    take of control of more than 51% of the nodes in the network. During an alert,
    the operators of the nodes of the network can either warn their users or stop
    recording transactions. On September 27, 2012, the Bitcoin Foundation was created.
    Important characters from the world of new technologies quickly supported the
    project, such as Wences Casares.


    ## The identity of Satoshi Nakamoto


    Several people claimed to be Satoshi Nakamoto, but none of them could prove it.
    There is no trace of his identity before the creation of Bitcoin. On his profile,
    Satoshi claimed to be a 40-year-old Japanese. In March 2014, journalist Leah McGrath
    Goodman from Newsweek magazine announced that she had tracked down the inventor
    of Bitcoin who she said would be a 64-year-old Japanese-American whose birth name
    is "Satoshi Nakamoto", although he changed his name to “Dorian Prentice Satoshi
    Nakamoto” at the age of 23. He is believed to be a retired physicist living in
    California. This thesis was methodically dismantled a month later by linguists
    from Aston University in England who carried out an in-depth study of the linguistic
    correspondences between the written productions of the author of the Bitcoin white
    paper and several suspected personalities, notably Dorian Nakamoto. In 2016, Craig
    Steven Wright, an Australian entrepreneur, claimed to be Satoshi Nakamoto. However,
    strong doubts remain.


    ## Adoption


    The history of Bitcoin adoption is quite remarkable, as it has been a long process
    of fake bans and unjustified threats to the cryptocurrency space. In the following
    pages we are going to track back the adoption process of Bitcoin, starting from
    2012. Here are the main milestones of BTC adoption.


    - On November 16th, 2012, WordPress started accepting bitcoins for its paid services.

    - On November 28th, 2012, the remuneration of miners decreased for the first time,
    from 50 to 25 BTC. The bitcoin source code provides for a halving of the remuneration
    every two hundred and ten thousand blocks mined, or approximately every four years.

    - On December 6th, 2012, a partnership between the startup Paymium (French exchange
    site) and the company Aqoba (payment institution) enabled Paymium to operate as
    a payment service provider, and therefore to keep accounts in euros and issue
    payment cards usable in euros and bitcoins.

    - On February 14th, 2013, the Reddit community site set up a system to buy “Reddit
    Gold” with bitcoins.

    - On February 16th, 2013, the online storage site Mega, successor to Megaupload,
    started accepting payments in bitcoin.

    - On October 14th, 2013, the giant Baidu (Chinese equivalent of Google) started
    accepting bitcoin transactions for its Jiasule firewall service.

    - On October 29th, 2013, the first automatic bitcoin cash dispenser-exchanger
    went into service in Vancouver. In September 2016, more than seven hundred and
    seventy of these automatic distributor-exchangers were installed worldwide, including
    four in France.

    - On November 21st, 2013, the University of Nicosia announced that it accepted
    bitcoin and opened a master''s degree in economics specializing in digital currencies.

    - On November 22nd, 2013, Richard Branson announced that Virgin Galactic was going
    to accept bitcoins as a means of payment for its space tourism flights.

    - On November 29th, 2013, Jiangsu Telecom (third largest Chinese operator), a
    subsidiary of China Telecom, started accepting bitcoins.

    - On March 25th, 2014, the US tax authorities declared that bitcoin should not
    be considered as a currency, but as a commodity, whose transactions are subject
    to taxation on capital gains. This involves taking into account the exchange rate
    at which a bitcoin has been acquired and the one at which it is used in order
    to calculate the realized gain, which makes the legal use of bitcoin in the United
    States particularly difficult.

    - On May 9th, 2014, the United States Election Commission accepted that election
    campaigns could be funded in bitcoins up to a limit of $100 per election cycle.

    - On September 23rd, 2014, Paypal allowed certain North American digital goods
    merchants selected by partner bitcoin payment processors to accept payments in
    bitcoins, and thus very gradually opened up to bitcoin. As of October 16th, 2017,
    there were Bitcoin ATMs around the world.

    - In December 2017, the French Minister of Public Accounts, Gérald Darmanin, reminded
    French taxpayers of the requirement to declare income, when it comes to capital
    gains realized during bitcoin transactions.

    - In November 2018, the Ohio government announced that it was accepting Bitcoin
    tax payments.

    - In January 2020, an investing.com study revealed that 9% of financial advisers
    already put part of their client''s funds in bitcoin to protect them from monetary
    troubles.


    ## Important moments


    During the adoption phase there have been quite a few important moments that changed
    the course of Bitcoin’s life. Here are the most important ones.


    - On August 15th, 2010, a block was generated containing a transaction creating
    184,467,440,737 bitcoins for three different addresses. This flaw is linked to
    the fact that the code did not foresee the case of creating such large amounts
    of bitcoins. This problem was solved automatically by the bitcoin blockchain and
    these bitcoins no longer exist.

    - On March 12th, 2013, an incident occurred related to the non-backward compatibility
    of version 0.8.0: the chain split into several versions and some remained blocked
    for a few hours. After a few moments of panic, the system was able to correct
    itself, signaling the strength of the blockchain technology.

    - On April 11th, 2013, the value of bitcoin collapsed from $266 to $105 before
    stabilizing at $160 in less than six hours. On April 13th, the price reached $66.
    This massive drop occurred after a big bull run, where the price of Bitcoin rose
    six times in just a few weeks. For those that are already familiar with Bitcoin’s
    price action, we are sure they are smiling just by thinking about such low prices.

    - On October 2nd, 2013, Ross Ulbricht was arrested. He was the alleged founder
    of Silk Road, which was shut down by the FBI and used only bitcoin for all of
    its transactions. More on that in a dedicated chapter.

    - On February 11th, 2014, the Bitcoin network was the victim of a massive and
    concerted attack launched on numerous exchange platforms, where quite a few bitcoins
    were stolen. This was just the preview of what was going to happen a few days
    later. In fact, on February 24th, 2014, the Mt. Gox trading platform suffered
    a record loss of 744,408 BTC, the equivalent of more than 44 billion dollars.
    The site was closed shortly after. A crisis management document has been drawn
    up and is publicly available on its website, we suggest you check it out because
    it is quite interesting (`https://www.mtgox.com/`). Due to this incident, bitcoin
    lost more than 38% of its value in the first quarter of 2014. On September 11th,
    2015, Mark Karpelès, owner of the Mt. Gox platform was indicted in Japan for embezzlement.
    He is suspected of having embezzled 2.3 million dollars of bitcoin deposits.

    - In May 2016, the Gatecoin exchange site was hacked and had 250 bitcoins and
    185,000 ether stolen. The hacker managed to bypass the online storage limits of
    the exchange platform''s assets: while only 5% of the deposits are not cold stored,
    the hacker managed to empty these deposits while continuing to feed the address
    by transfer of cold storage assets from the exchange platform. After this event,
    almost every trading and exchanging platform decided to implement a new protection
    mechanism, in order to improve their safety.

    - On August 3rd, 2016, the Bitfinex exchange site reported the theft of 119,756
    bitcoins on its exchange platform, which at the time counted for around $65 million.

    - On May 7th, 2019, hackers stole more than 7,000 Bitcoins from the Binance Cryptocurrency
    Exchange, worth over US $40 million. Binance CEO Zhao Changpeng said, “Hackers
    used a variety of techniques, including phishing, viruses and other attacks. They
    had the patience to wait and perform well orchestrated actions through multiple
    independent accounts at the most opportune moment”. It was this event that inspired
    Binance to improve its protection mechanism even further. All incidents related
    to exchange platforms only affect people who do not themselves hold the private
    keys of their bitcoin wallet. Not your keys, not your bitcoins as they say. As
    you can see, every time the Bitcoin network has been attacked, new solutions were
    found to make sure the same issue would not happen in the future. In our opinion,
    this is one of the main strengths in this system. In fact, since it is developed
    by people, it can easily adapt to new hacking methods and attacks. It is pretty
    interesting to see the evolution of Bitcoin and if you want to actually invest
    in it safely, you need to know a bit of its history as well.

    '
  trans: '


    # 第 2 章 - 比特币的历史


    比特币是对魏岱（Wei Dai）于 1999 年构思的 b-money 概念以及尼克·萨博（Nick Szabo）于 2005 年描述的 bitgold 的改进。特别是，比特币解决了信任模型这一关键问题：被认为可靠的服务器通过其算力投票来确定合法的交易链。在
    b-money 中，服务器本应根据一种不太明确的机制支付安全押金。使用计算证明链的想法是在 bitgold 项目中提出的，尽管尼克·萨博只提议使用大多数地址来确定交易链的合法性，这留下了控制地址数量的问题。中本聪声称他从
    2007 年到 2009 年致力于比特币的开发。早在 2008 年，他就在邮件列表上发布了一份描述数字货币的文档。2009 年 2 月，他在 P2P 基金会网站上发布了关于其工作的公告。2009
    年 1 月 3 日，第一个区块或创世区块被创建。2009 年 2 月，他在 P2P 基金会网站上分发了第一个版本的比特币软件，并使用自己的计算机来运行网络，从而生成了第一批比特币。与其他开发者一起，中本聪一直持续实现该软件及其
    Bitcoin-Qt 版本直到 2010 年。开发者和比特币社区在 2010 年中期逐渐与他失去了联系。2010 年 12 月 12 日，中本聪在主论坛上发布了最后一条消息。在消失之前不久，中本聪指定加文·安德烈森（Gavin
    Andresen）为其继任者，授予他访问 SourceForge 比特币项目的权限以及一份警报密钥的副本。后者是一个独特的私有加密密钥，允许减轻对比特币系统潜在攻击的影响，例如发现允许修改交易的加密缺陷，或网络中超过
    51% 的节点被控制。在警报期间，网络节点的操作者可以警告其用户或停止记录交易。2012 年 9 月 27 日，比特币基金会成立。来自新技术界的重要人物迅速支持了该项目，例如文塞斯·卡萨雷斯（Wences
    Casares）。


    ## 中本聪的身份


    几个人声称自己是中本聪，但没有人能够证明这一点。在比特币创建之前，没有关于他身份的任何痕迹。在他的个人资料中，中本聪声称自己是一名 40 岁的日本人。2014
    年 3 月，Newsweek 杂志的记者利亚·麦格拉思·古德曼（Leah McGrath Goodman）宣布，她已经找到了比特币的发明者，她称该发明者是一名
    64 岁的日裔美国人，出生名为“中本聪”，尽管他在 23 岁时将名字改为“多里安·普伦蒂斯·中本聪”（Dorian Prentice Satoshi Nakamoto）。他被认为是一名居住在加利福尼亚州的退休物理学家。这一论点一个月后被英国阿斯顿大学的语言学家有条不紊地推翻，他们对比特币白皮书作者的文字作品与几名涉嫌人物（尤其是多里安·中本聪）之间的语言对应关系进行了深入研究。2016
    年，澳大利亚企业家克雷格·史蒂文·赖特（Craig Steven Wright）声称自己是中本聪。然而，强烈的怀疑依然存在。


    ## 采用


    比特币采用的历史非常引人注目，因为它经历了一个漫长的过程，充斥着对加密货币领域的伪禁令和无理威胁。在接下来的页面中，我们将追溯比特币的采用过程，从 2012
    年开始。以下是 BTC 采用的主要里程碑。


    - 2012 年 11 月 16 日，WordPress 开始接受比特币作为其付费服务的支付方式。

    - 2012 年 11 月 28 日，矿工的报酬首次下降，从 50 降至 25 BTC。比特币源代码规定每挖掘两百一十万个区块（大约每四年）报酬减半。

    - 2012 年 12 月 6 日，初创公司 Paymium（法国交易所）与公司 Aqoba（支付机构）之间的合作伙伴关系使 Paymium 能够作为支付服务提供商运营，因此可以保存欧元账户并发行可用欧元和比特币的支付卡。

    - 2013 年 2 月 14 日，Reddit 社区网站建立了一个使用比特币购买“Reddit Gold”的系统。

    - 2013 年 2 月 16 日，在线存储网站 Mega（Megaupload 的继任者）开始接受比特币支付。

    - 2013 年 10 月 14 日，巨头百度（中国的谷歌）开始为其 Jiasule 防火墙服务接受比特币交易。

    - 2013 年 10 月 29 日，第一台自动比特币取款机-兑换机在温哥华投入使用。2016 年 9 月，全球安装了超过七百七十台这些自动取款机-兑换机，其中包括四台在法国。

    - 2013 年 11 月 21 日，尼科西亚大学宣布接受比特币，并开设了专注于数字货币的经济学硕士学位。

    - 2013 年 11 月 22 日，理查德·布兰森（Richard Branson）宣布维珍银河（Virgin Galactic）将接受比特币作为其太空旅游航班的支付方式。

    - 2013 年 11 月 29 日，江苏电信（中国第三大运营商，中国电信的子公司）开始接受比特币。

    - 2014 年 3 月 25 日，美国税务机关宣布比特币不应被视为货币，而应被视为商品，其交易需缴纳资本增值税。这涉及考虑比特币获取时的汇率和使用时的汇率，以计算实现的收益，这使得比特币在美国的合法使用尤其困难。

    - 2014 年 5 月 9 日，美国选举委员会接受竞选活动可接受比特币资助，每个选举周期上限为 100 美元。

    - 2014 年 9 月 23 日，Paypal 允许由合作比特币支付处理商选定的某些北美数字商品商家接受比特币支付，从而非常逐渐地向比特币开放。截至 2017
    年 10 月 16 日，全球已有比特币 ATM。

    - 2017 年 12 月，法国公共账目部长热拉尔·达尔马宁（Gérald Darmanin）提醒法国纳税人，在涉及比特币交易产生的资本收益时，有义务申报收入。

    - 2018 年 11 月，俄亥俄州政府宣布接受比特币纳税。

    - 2020 年 1 月，一项 investing.com 的研究揭示，9% 的金融顾问已将部分客户资金投入比特币，以保护其免受货币动荡的影响。


    ## 重要时刻


    在采用阶段，发生了许多改变比特币进程的重要时刻。以下是其中最重要的几个。


    - 2010 年 8 月 15 日，一个区块被生成，其中包含一笔为三个不同地址创建 184,467,440,737 个比特币的交易。这个缺陷与代码未预见创建如此大量比特币的情况有关。这个问题由比特币区块链自动解决，这些比特币不再存在。

    - 2013 年 3 月 12 日，发生了与版本 0.8.0 不向后兼容相关的事件：链分裂成多个版本，其中一些被阻塞了几个小时。在短暂的恐慌之后，系统能够自我纠正，表明了区块链技术的强大。

    - 2013 年 4 月 11 日，比特币价值从 266 美元崩溃至 105 美元，并在不到六小时内稳定在 160 美元。4 月 13 日，价格达到 66
    美元。这次大幅下跌发生在一轮大牛市之后，比特币价格在短短几周内上涨了六倍。对于那些已经熟悉比特币价格走势的人，我们确信他们一想到如此低的价格就会微笑。

    - 2013 年 10 月 2 日，罗斯·乌尔布雷希特（Ross Ulbricht）被捕。他是丝绸之路（Silk Road）的涉嫌创始人，该网站被 FBI
    关闭，并且所有交易都只使用比特币。关于这一点将在专门章节中详细介绍。

    - 2014 年 2 月 11 日，比特币网络遭到在众多交易平台上发起的大规模协调攻击，相当数量的比特币被盗。这只是几天内将要发生的事情的预演。事实上，2014
    年 2 月 24 日，Mt. Gox 交易平台遭受了 744,408 BTC 的创纪录损失，相当于 440 多亿美元。该网站在不久之后关闭。一份危机管理文件已制定并在其网站上公开提供，我们建议您查看，因为它非常有趣（`https://www.mtgox.com/`）。由于此事件，比特币在
    2014 年第一季度损失了超过 38% 的价值。2015 年 9 月 11 日，Mt. Gox 平台所有者马克·卡佩莱斯（Mark Karpelès）在日本因贪污被起诉。他被怀疑贪污了
    230 万美元的比特币存款。

    - 2016 年 5 月，Gatecoin 交易所被黑客攻击，250 个比特币和 185,000 个以太币被盗。黑客设法绕过了交易平台资产的在线存储限制：虽然只有
    5% 的存款未冷存储，黑客设法清空了这些存款，同时通过从交易平台转移冷存储资产继续为地址充值。此事件后，几乎每个交易和兑换平台都决定实施新的保护机制，以提高其安全性。

    - 2016 年 8 月 3 日，Bitfinex 交易所报告其交易平台被盗 119,756 个比特币，当时价值约 6500 万美元。

    - 2019 年 5 月 7 日，黑客从 Binance 加密货币交易所窃取了超过 7,000 个比特币，价值超过 4000 万美元。Binance 首席执行官赵长鹏表示，“黑客使用了多种技术，包括网络钓鱼、病毒和其他攻击。他们有耐心等待，并在最合适的时机通过多个独立账户执行精心策划的行动”。正是这一事件激励
    Binance 进一步改进其保护机制。与交易平台相关的所有事件只影响那些不持有自己比特币钱包私钥的人。正如他们所说，不是你的钥匙，就不是你的比特币。正如您所见，每次比特币网络受到攻击后，都会找到新的解决方案，以确保同样的问题不再发生。在我们看来，这是该系统的主要优势之一。事实上，由于它由人开发，可以轻松适应新的黑客攻击方法和攻击。观察比特币的演变非常有趣，如果您想安全地投资它，您也需要了解一些它的历史。


    '
