    # 第 25 章 - 提升区块链可扩展性


    在前面的章节中，我们提到了正在比特币区块链上实施的不同更新，以使其更具可扩展性。在接下来的几页中，我们将深入探讨这个话题。可扩展性一词指的是系统增长以满足不断增长的需求的能力。在计算机技术中，你可以通过更新硬件来提高设备的性能，使其在执行某些活动时更快。当我们谈论区块链中的可扩展性时，我们指的是其管理更多交易的能力的增长。像比特币这样的协议有许多优势，但可扩展性不是其中之一。如果比特币在集中式数据库中管理，管理员提高速度和性能将相对容易。然而，比特币的价值主张（例如，抗审查性）要求许多参与者同步一份区块链副本。


    ## 区块链可扩展性问题


    运行一个比特币节点相对便宜，即使是简单的设备也可以做到。尽管如此，鉴于成千上万个节点必须彼此保持同步，它们的能力存在一些限制。对链上可以处理的交易数量设定了限制，以防止数据库变得太重。如果它变得太大太快，节点就无法跟上。另外，如果块太大，就无法通过网络快速发送它们。结果，我们面临一个障碍。区块链可以被视为在定义间隔发车的火车服务。每个车厢提供有限的座位，要获得车票，旅行者必须出价以赢得座位。如果每个人都试图同时上车，价格就会很高。同样，一个充斥着待处理交易的拥堵网络将要求用户支付更高的佣金，以确保他们的交易在合理的时间内被包含。一个解决方案可能是扩大车厢。这将意味着更多的座位、更高的性能和更低的车票价格。但不能保证座位不会像之前的情况一样被填满。车厢不能不断扩大，就像区块和
    gas 也不能无限扩展。后者使得节点留在网络上的成本更高，因为它们需要更先进的硬件来保持同步。以太坊的创建者，第二大加密货币，Vitalik Buterin
    创造了可扩展性三难困境一词来描述区块链必须面临的挑战。Buterin 理论认为，协议必须在可扩展性、安全性和去中心化之间做出妥协。这些元素之间存在冲突。事实上，如果过于关注其中两个属性，你就会忽略第三个。因此，许多人将可扩展性视为链下需要实现的东西，而安全性和去中心化应在区块链本身上最大化。


    ## 链下可扩展性解决方案


    链下可扩展性是指在不增加区块链负担的情况下执行交易的方法。连接到区块链并允许用户发送和接收资金的协议，而无需交易出现在主链上。


    ### 什么是侧链？


    侧链是一个独立的区块链，但它不是一个独立的平台，因为它以某种方式锚定到主链。主链和侧链是互操作的，资产可以在两者之间自由流动。有几种方法可以确保资金可以转移。在某些情况下，资产通过存入特定地址从主链移出。事实上，它们并没有实际发送到侧链，而是被锁定在地址中，并在侧链上发行相应数量的资产。一种更直接的选择是将资金发送给托管服务，该服务将存款兑换为侧链上的资金。然而，在这种情况下，中心化可能成为一个问题。


    ### 侧链的功能


    假设你的朋友 Alice 有五个比特币。她想将它们兑换为比特币侧链上的五个等值单位——让我们称之为 sidecoin。所涉及的侧链使用双向锚定，因此用户可以将自己的资产从主链转移到侧链，反之亦然。请记住，侧链是一个独立的区块链。因此，它将具有不同的区块、节点和验证机制。要接收
    sidecoin，Alice 将五个比特币发送到另一个地址。该地址可能由某人拥有，一旦他收到比特币，就会在她的地址上记入五个 sidecoin。或者，你可以提出某种最小化信任的配置，当软件检测到付款时，sidecoin
    会自动记入。Alice 现在已经将她的币转换为 sidecoin，但她随时可以逆转过程以找回她的比特币。现在她已经进入侧链，她可以在这个独立的区块链上自由进行交易。她可以发送
    sidecoin 或从他人接收，就像在主链上发生的情况一样。例如，她可能支付 Bob 一个 sidecoin 作为标志的费用。当她想回到比特币时，她可以将剩余的四个
    sidecoin 发送到一个特殊地址。一旦交易确认，四个比特币将被解锁并发送到她在主链上控制的一个地址。


    ### 侧链的用例


    也许你在想这一切有什么用。为什么 Alice 不直接使用比特币区块链呢？答案是侧链可能能够做到比特币无法做到的事情。区块链是精心组织的妥协系统。虽然比特币是最安全、最去中心化的加密货币，但在性能方面它并不是最好的。比特币交易比传统方法更快，但与其他区块链系统相比仍然相对较慢。区块每十分钟挖出一次，当网络拥堵时，手续费可能会大幅上涨。事实上，对于小额日常支付，可能不需要这种级别的安全性。如果
    Alice 在付咖啡钱，她不会等待交易确认。在付款完成之前，她的咖啡就会凉了。侧链不受相同规则的约束。事实上，它们甚至不需要使用工作量证明来运行。你可以使用任何共识机制，信任单个验证者，或更改任何参数。你可以引入主链上不存在的更新，生成更大的区块并强制执行快速规则。值得注意的是，侧链可能存在严重错误，但这不会影响底层链。这使得它们可以用作实验平台，并实现原本需要网络大多数同意才能实现的功能。只要用户对妥协感到满意，侧链可能是迈向有效可扩展性的一个基本步骤。主链节点不需要记录侧链上的每一笔交易。Alice
    可以通过一笔比特币交易进入侧链，运行数百笔 sidecoin 交易，然后退出侧链。就比特币区块链而言，她只进行了两笔交易——一笔进入，一笔退出。


    ### 支付通道


    支付通道在可扩展性方面与侧链具有相同的目的，但本质上非常不同。与侧链一样，它们将交易推出主链，以防止区块链拥堵。然而，与侧链不同，它们不需要单独的区块链来工作。支付通道使用智能合约来允许用户执行交易，而无需将其发布到区块链上。这得益于使用软件在两个参与者之间强制执行的协议。


    #### 支付通道如何工作？


    在像著名的闪电网络这样的模型中，双方首先将币存入他们共同拥有的地址。这是一个多重签名地址，需要两个签名才能花费资金。因此，如果 Alice 和 Bob 创建了这个地址，资金只有在双方同意的情况下才能移动。假设他们各自向一个现在包含
    20 BTC 的地址存入了 10 BTC。他们很容易维护一个预算，一开始就说 Alice 和 Bob 各有 10 BTC。如果 Alice 想给 Bob 一枚币，他们可以更新预算，表明
    Alice 有 9 BTC，Bob 有 11 BTC。只要他们继续更新这些预算，就不需要将结果发布到区块链上。当他们决定结束交易时，他们可以创建一笔交易，将这些余额发送到双方拥有的地址，对其签名并广播。Alice
    和 Bob 可能在他们的预算上记录了十笔、一百笔或一千笔交易。但就区块链而言，只进行了两个链上操作：一笔用于初始交易，另一笔用于在最后实现资金。除了这两笔之外，所有其他交易都是免费且几乎即时的。不需要支付矿工费用，也不需要等待区块确认。显然，我们上面讨论的例子需要双方的合作，这对两个陌生人来说并不是理想的情况。但是，你可以使用特殊机制来惩罚任何欺诈尝试，这样各方可以确定地在不相互信任的情况下进行交互。


    #### 支付路由


    显然，支付通道对于进行大量交易的双方来说很方便。但事情并没有结束。可以创建这些通道的网络，以确保 Alice 可以支付一个她没有直接连接的参与者。如果 Bob
    与 Carol 有开放的通道，Alice 可以支付给她，只要容量足够。Alice 会将资金传输到 Bob 通道的一方，然后 Bob 会将其传输到 Carol
    通道的一方。如果 Carol 连接到另一个参与者，她可以做同样的事情。这种类型的网络以分布式拓扑结构演变，任何人都连接到不同的对等节点。我们通常会找到多条通往目的地的路径，用户可以选择最有效的路径。我们讨论了两种可扩展性方法，允许在不增加底层区块链负担的情况下进行交易。这两种技术，侧链和支付通道，仍需成熟，但已经被希望绕过基础层交易缺陷的用户广泛使用。随着时间的推移，随着更多用户加入网络，保持去中心化完好至关重要。这只有通过对区块链增长施加限制才能实现，以确保新节点可以轻松加入。链下可扩展性解决方案的支持者认为，随着时间的推移，主链将仅用于监管高价值交易，或用于进入/退出侧链和开启/关闭通道。


    '
