    # Chapter 21 - SegWit 更新


    隔离见证（`SegWit`）是 2015 年开发的协议更新。该概念被引入作为解决区块链网络至今仍面临的可扩展性问题的方案。平均而言，比特币网络每 10 分钟验证一个新块，每个块包含多笔交易。因此，块的大小影响每个块中可以确认的交易数量。目前，比特币区块链每秒可处理约
    7 笔交易。SegWit 的核心思想是重新组织块数据，使签名不再与交易数据一起放置。换句话说，SegWit 更新包括将见证（签名）与交易数据分离。这允许将多笔交易存储在单个块中，从而提高网络交易方面的性能。考虑到比特币每秒可处理约
    7 笔交易，执行一笔交易有时可能需要很长时间。这一过程远比传统支付解决方案和金融网络慢，后者每秒可处理数千笔交易。SegWit 由比特币开发者 Pieter
    Wuille 与其他比特币核心贡献者于 2015 年开发。2017 年 8 月，SegWit 更新作为比特币网络上的软分叉实现。目前有几个加密货币项目使用
    SegWit，包括比特币和莱特币。协议更新带来了许多好处，包括提高交易速度和增加块容量。此外，SegWit 修复了所谓的交易可变性漏洞（稍后详述）。


    ## 块容量增加


    SegWit 的最大优势之一是块容量增加。通过从交易输入中删除签名数据，更多交易可以存储在单个块中。交易由两个主要组件组成：输入和输出。本质上，输入包含发送者的公钥地址，而输出包含接收者的公钥地址。但是，发送者必须证明其转移资金的所有权，并通过数字签名来实现。如果没有
    SegWit，签名数据可占块的 65% 以上。使用 SegWit 后，签名数据从交易输入中删除。这使实际块大小从 1MB 增加到约 4MB。需要注意的是，SegWit
    并非实际块大小增加。相反，它是一种高级解决方案，允许在不增加块大小限制（这将需要硬分叉）的情况下增加实际大小。更准确地说，当前块大小仍为 1MB，但实际块大小限制为
    4MB。SegWit 还引入了块重量的概念。我们可以将块重量视为取代块大小概念的概念。本质上，块重量是一种包含块中所有数据的度量，包括交易数据（1MB）和签名数据（3MB），后者不再属于输入字段。


    ## 交易速度提高


    通过创建可以容纳更多交易的块，SegWit 也使提高交易速度成为可能，因为可以有更多数量的交易在区块链中流动。虽然挖出一个块所需的时间可能相同，但其中处理的交易更多，因此每秒交易率更高。交易速度的提高也有助于降低比特币网络中的交易成本。在
    SegWit 之前，一笔交易花费超过 30 美元并不罕见。然而，SegWit 已将此成本大幅降低到每笔交易不到 1 美元。


    ## 交易可变性修正


    过去，比特币的一个主要问题是可能更改交易签名。如果签名被更改，可能会导致双方之间的交易损坏。由于存储在区块链上的数据几乎不可更改，因此可能永久在区块链上存储无效交易。使用
    SegWit 后，签名不再是交易数据的一部分，这消除了更改此数据的可能性。此修复使区块链社区能够进行进一步创新，包括第二层协议和智能合约。


    ## SegWit 与闪电网络


    第二层协议的开发部分得益于交易可变性漏洞的修正。简而言之，第二层协议是在区块链（例如比特币区块链）之上开发的新平台或新产品。正如我们在上一章中看到的，最著名的第二层协议之一是闪电网络，一个链下微支付网络。


    ## SegWit 与 SegWit2x


    SegWit 是软分叉升级，这意味着它是向后兼容的。换句话说，未更新以包含 SegWit 的比特币节点仍然能够处理交易。然而，另一个名为 SegWit2x（`S2X`）的
    SegWit 实现已被提议，这将需要硬分叉升级。SegWit 与 SegWit2x 之间的关键区别在于，后者不仅涉及交易批处理的变化，还涉及块大小增加（从
    1MB 到 2MB）。然而，更大的块大小会增加节点运营商和矿工的负载，因为这将导致需要管理的数据量翻倍。另一个重要区别是，SegWit 提案得到了比特币社区的支持和执行。这一事件催生了
    UASF 的概念，即用户激活软分叉。相反，SegWit2x 提议对比特币的核心规则之一进行重大更改，由于开发者未能就其采用和实现达成共识，SegWit2x
    运动被搁置。SegWit 的实现标志着比特币协议的最大更新，并且它被去中心化社区支持和实施的事实使其更加重要。引入 SegWit 是解决比特币和其他区块链网络相关许多问题的重大进步——尤其是在可扩展性方面。通过
    SegWit 与第二层协议的结合，区块链网络可以处理更多交易，效率更高且成本更低。尽管是一种强大且创新的解决方案，SegWit 尚未实现完全采用。目前，使用
    SegWit 的比特币地址百分比约为 53%。


    '
