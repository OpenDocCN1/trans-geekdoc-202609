    # Chapter 10 - Potential Risks Linked to the Bitcoin Network


    From the outset, Bitcoin has been the subject of many discussions, both technical
    and economic, and even political. From these discussions, a number of advantages
    and disadvantages of the Bitcoin network were discussed. Some of these comments
    are not necessarily specific to bitcoin and could be applied to other payment
    systems with similar characteristics. However, recently, we realized that the
    risks associated with bitcoin are little or poorly understood in their nature
    and extent. Bitcoin, like most existing cryptocurrencies, has no underlying assets
    or collateral. Whoever buys a bitcoin exclusively pays the seller. Therefore,
    the increase in the value of money comes exclusively from the continued presence
    of a flow of buyers able to support its price. Therefore, on closer inspection,
    the functioning of bitcoin might seem much more similar to that of a pyramid system
    than to that of a monetary system. However, if you have followed us so far, you
    know that in reality things are quite different. In fact, when you store bitcoins
    you contribute to the stability and strength of the monetary network, which grows
    and strengthens itself from the amount of money that investors pour into it.


    ## Volatility


    Bitcoin is a volatile currency because the number of coins is limited in the face
    of growing demand. The price evolves according to the news on crypto-currencies.
    Cryptocurrency is floating like any currency and fluctuates differently against
    different currencies.


    ## Irreversibility


    A bitcoin transaction is irreversible and cannot be reversed. This means that
    if you give or type the wrong address, you will have lost your coins for good.


    ## Depending on the internet


    The Bitcoin protocol is an overlay of the IP protocol which is the basis of the
    functioning of the internet. In the event of an internet shutdown (massive power
    / IT failure or forced shutdown by a government of internet providers'' routers,
    for example) or if a government does not promote or defend internet neutrality,
    the Bitcoin protocol could be slowed down or even completely blocked.


    ## Technical limitations of the network


    The size of the database has grown very rapidly and requires several gigabytes
    of memory in a hard drive. Some experts have questioned the future size of this
    database and are discussing possible solutions to save disk space such as pruning
    the oldest transactions that form the Merkle tree. However, this does not seem
    necessary given the progress made in storage technologies. The size of the block
    is another important aspect. Bitcoin "super-nodes" are being considered to facilitate
    the propagation of information through the nodes of the network and which struggle
    to keep up with the increase in the size of the database. Some scholars argue
    that Moore''s Law could help track network growth using personal computers.


    ## Institutional risk


    To convert cryptocurrency to currency it is often necessary to go through an exchange
    platform operated by private companies, which are potentially vulnerable to defaults
    or bankruptcies, as happened to Mt. Gox. However, it is possible to exchange your
    bitcoins for cash, gold or a service in order to avoid this pitfall.


    ## Environmental impacts and risks


    They are linked to the electricity consumption generated by mining, which represents,
    according to estimates, from 0.15% to 0.32% of the world electricity consumption.
    They are low when it is produced from renewable energies, but important for fossil
    fuels (global warming and air pollution). More and more server farms are installed
    in countries with cold climates (to facilitate their cooling) with cheap renewable
    energies, such as Canada and Iceland. A study on the origin of the electricity
    consumed by mining farms shows that 74.1% of the energy consumed is produced from
    renewable energies. However, following criticism, the lead author of the study
    admitted there were some mistakes in the research. Indeed, the major renewable
    energy in China, hydroelectricity, is only available at low cost in certain periods
    of the year. The rest of the year electricity production comes mainly from coal.


    ## Ethical risks


    Bitcoin would favor the first acquirers of the currency ("early adopters"). This
    claim is sometimes confirmed by certain studies showing that the distribution
    of wealth in bitcoin is very unequal. It has been suggested that Bitcoin could
    be likened to a Ponzi scheme, but this is not applicable as we have seen in the
    previous pages as well. In fact, the price of the cryptocurrency is a balance
    between buyers looking to acquire the currency and sellers looking to sell it.
    In a Ponzi scheme, new entrants pay early adopters and receive nothing in return.
    Some central banks (ECB, Banque de France, Bank of China) have issued warnings
    on the use of bitcoin insisting on its highly speculative character, on the legal
    risks it generates due to its status as an unregulated currency and on its possible
    use for criminal purposes (money laundering, terrorist financing). The European
    Banking Authority (EBA) also issued a warning in December 2013 against the lack
    of consumer protection through the use of the payment method that is bitcoin.
    However, other institutions hold a more nuanced or even opposite approach. Thus,
    the German and American governments regard this currency with a certain benevolence
    and Ben Bernanke, ex-president of the FED, stated that bitcoin has potential to
    revolutionize the monetary system.


    # Chapter 11 - Mixed Opinions on Bitcoin


    Economists have expressed various opinions on bitcoin. For the American Nobel
    Laureate in Economics Joseph Stiglitz, bitcoin is a bubble that will be very exciting
    as long as it goes up before it goes down. For him, it does not serve any socially
    useful function. Its success is due to its ability to circumvent. As a result,
    he feels that bitcoin should be banned for good. The French Nobel laureate in
    economics Jean Tirole warns against bitcoin, stating that it is “an asset without
    intrinsic value”, “without economic reality”. He is dubious in terms of two criteria:
    is it a viable currency in the long term? Does it contribute to the common good?
    Regarding viability, Jean Tirole is particularly critical of the Initial coin
    offering (ICO) of three billion dollars in 2017. Advertised as an instrument of
    financial disintermediation, according to him ICOs neglect the fundamentals of
    finance. In fact, the use of reliable and well-capitalized intermediaries to monitor
    projects is fundamental to ensure everything is done correctly. For the economist,
    the social role of Bitcoin is "elusive". Bitcoins are concentrated in private
    hands, particularly for fraud and tax evasion. Bill Gates (ex-CEO of Microsoft),
    Jack Dorsay (CEO of Twitter), Richard Branson, Chamath Palihapitiy (co-founder
    of Facebook), the Winklevoss brothers and a series of other billionaires see bitcoin
    as inevitable. Jean-Marc Sylvestre, French journalist for the business press,
    predicts a crash by highlighting its success among those who make dirty money
    in the drug trade, the illicit guns trade and in international prostitution as
    well as among populations of emerging countries, who do not have a bank account
    but are equipped with a smartphone. To this can be added the key role of bitcoin
    in ransomware attacks, with ransomware often demanding payment in this currency,
    which is difficult to trace. As you can see, there are different opinions on Bitcoin
    and its validity as a currency. Actually, we believe it to be more like digital
    gold, which is the same idea shared by Michael Saylor, CEO of Microstrategy, and
    Elon Musk. In the next chapters we are going to discuss the technical aspects
    you need to know if you want to buy bitcoin and store it in a safe way.

    '
