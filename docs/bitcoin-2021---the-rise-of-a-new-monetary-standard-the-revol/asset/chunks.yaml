    # 第 23 章 - Taproot


    与 Schnorr 签名一起，Taproot 是自 SegWit 引入以来备受期待的比特币技术升级。Taproot 的目标是改变比特币脚本的运作方式，以提高隐私性、可扩展性和安全性。通过将
    Taproot 与相关更新 Schnorr 签名相结合，这以及更多功能都将成为可能。任何熟悉加密社区的人都知道，隐私性、可扩展性和安全性是首要任务。尽管比特币是世界上最流行的加密货币，但这些问题仍然需要解决。Taproot
    旨在做到这一点。比特币经历过起起落落，但它已被证明是支撑加密世界的基石。尽管多年来发生了各种事件，例如针对 Mt.Gox 的黑客攻击或著名的比特币硬分叉，加密社区仍然继续支持比特币。但是，存在某些不可忽视的问题，其中最大的一个是隐私性。比特币是一个公共区块链，任何人都可以监控网络上发生的交易。对某些人来说，这是一个重大问题。你可以通过币币混合和
    CoinJoins 等技术来提高匿名性。不幸的是，这些都无法使比特币成为一种私有货币。虽然 Taproot 也是如此，但它可以帮助提高网络上的匿名性。许多人认为
    Taproot 更新是解决比特币缺乏隐私性及其他相关问题的重要第一步。但是，Taproot 究竟是什么，它将如何惠及比特币？让我们一起找出答案。


    ## 什么是 Taproot？


    Taproot 是一个软分叉，它改进比特币脚本以提高隐私性以及与复杂交易相关的其他因素。比特币网络上的交易可以使用各种使其更复杂的功能，包括定时问题、多重签名要求等。如果没有
    Taproot，任何人都可以识别使用这些复杂功能的交易，这些功能需要创建多个交易。但是，Taproot 更新将允许你“隐藏”包含此类复杂性的比特币交易的所有移动部分。因此，即使交易采用这些功能，它们也将显示为单个交易。这对比特币隐私倡导者来说是一大胜利。事实上，Taproot
    允许你完全隐藏比特币脚本的执行。例如，使用 Taproot 花费比特币可以使闪电网络通道中的交易、点对点交易或复杂的智能合约无法区分。但是，应该注意的是，这并不改变初始发送者和最终接收者的钱包将被暴露的事实。Taproot
    提案最初由比特币核心开发者 Greg Maxwell 于 2018 年 1 月提出。2020 年 10 月，在 Pieter Wuille 的拉取请求后，Taproot
    被集成到比特币核心库中。为了完全实施该更新，节点运营商必须采用 Taproot 的新共识规则。根据这种动态，实际实施可能需要数月时间。


    ## Taproot 对比特币的好处


    如我们已经提到的，Taproot 将为比特币的隐私性带来重大改进。结合 Schnorr 签名，Taproot 还可以提高执行交易的效率。除了提高隐私性之外，其他潜在好处包括以下内容。


    - 减少需要在区块链中转移和存储的数据量；

    - 每个区块的交易数量更多（每秒交易率更高）；

    - 降低交易成本。


    Taproot 的另一个优势是，签名将不再具有可塑性，这是比特币网络中已知的安全风险。简单来说，签名的可塑性意味着在交易确认之前，从技术上讲有可能更改交易的签名。这样做会使攻击看起来交易从未发生过。这使比特币容易受到臭名昭著的双重支付问题的影响，这可能会破坏分布式账本的完整性。如你现在所理解的，Taproot
    是比特币备受期待且广受支持的升级。当与 Schnorr 签名一起实施时，我们将看到隐私性、可扩展性和安全性的显著改进。此外，这些更新可以增加对闪电网络的兴趣，并鼓励将多重签名解决方案作为行业标准。无论你在比特币社区中的参与程度如何，提高隐私性、效率和安全性的好处很可能会影响你使用比特币的体验。我们对这个令人难以置信的更新感到无比兴奋！


    '
