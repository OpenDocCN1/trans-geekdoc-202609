    # 第 7 章 - 中本聪


    正如我们所见，比特币网络的创建至今仍是个谜。在本章中，我们试图收集所有关于中本聪身份的信息。请记住，他的身份从未被揭晓，我们只能对他的真实身份做出推测。


    中本聪是加密货币比特币发明者的化名。2008 年 11 月，中本聪在 `metzdowd.com` 网站上的 The Cryptography Mailing
    list 发布了比特币协议。2009 年，他分发了第一版客户端软件，随后与其他开发者匿名共同参与了该项目，最终于 2010 年退出比特币社区。中本聪的最后一次联系发生在
    2011 年，当时他声称已转向其他项目，并将比特币托付给了加文·安德森（Gavin Andresen）等可靠的人手中。


    关于中本聪真实身份的理论众说纷纭。没人知道他是“他”、“她”还是不止一个人。在日语中，“satoshi”意为“清晰、迅速且明智的思想”。“Naka”可以表示“中间”、“内部”或“关系”。“Moto”可以表示“起源”或“基础”。但不确定这些含义是否有助于追溯发明比特币系统的个人或团体。


    最初有人认为是迈克尔·克利尔（Michael Clear），他是都柏林三一学院的密码学毕业生，但他予以否认。其他人怀疑是维利·莱赫东维尔塔（Vili Lehdonvirta），一名前芬兰游戏开发者（同时也是社会学家和经济学家），但他也否认与中本聪有任何关联。纽约大学教授亚当·彭嫩伯格（Adam
    Penenberg）声称，这个神秘人物背后有三个人：尼尔·金（Neal King）、弗拉基米尔·奥克斯曼（Vladimir Oksman）和查尔斯·布赖（Charles
    Bry）。彭嫩伯格的论点基于对比特币协议中某些特定短语的谷歌搜索，这些搜索指向一项关于更新和分发加密密钥的专利申请。该专利由金、奥克斯曼和布赖申请，他们否认与比特币有任何关系。


    尼克·萨博（Nick Szabo）是一名计算机科学家和密码学家，长期以来与合作者拉斯洛·汉耶奇（Laszlo Hanyecz）一起被怀疑是中本聪。两人始终坚决否认，但在接下来的页面中，我们将告诉你更多关于萨博的信息，因为我们相信他是中本聪。其他人认为是马蒂·马尔米（Martii
    Malmi），一位芬兰开发者，他从比特币创立之初就参与其中，并创建了系统的用户界面。还有关于 MtGox 创建者杰德·麦卡莱布（Jed McCaleb）的传闻，他是一位热爱日本文化并居住在日本的美国人。其他理论则指向唐纳尔·奥马霍尼（Donal
    O''Mahony）和迈克尔·皮尔斯（Michael Peirce），他们撰写了一篇关于电子商务平台数字支付的论文。


    2017 年，在一名 SpaceX 员工的线索后，网络上出现了埃隆·马斯克（Elon Musk）隐藏在化名背后的想法，这一理论后来被这位企业家本人在其 Twitter
    账户上予以否认。


    ## 克雷格·史蒂文·赖特（Craig Steven Wright）


    2015 年 12 月，根据 Wired 和 Gizmodo 发表的两篇调查文章，澳大利亚企业家克雷格·史蒂文·赖特（Craig Steven Wright）被认为是比特币的创建者。几小时内，澳大利亚联邦警察对赖特的住所和办公室进行了搜查，但与该事件无关。


    2016 年 5 月 2 日，克雷格·史蒂文·赖特公开声称自己是中本聪。赖特向 BBC、《经济学人》和 GQ 透露了他的身份。为了证明他的主张，他使用与第一笔比特币交易相关的私有加密密钥对一条消息进行了签名。然而，该签名的验证存在争议，即使其有效性得到证明，许多密码学专家也不认为这是确凿的证据，因为它指的是第二个区块，而不是第一个创建的区块。


    2016 年 5 月 4 日，赖特承诺将发布更多证据来证明其身份。然而，第二天，他删除了博客上的所有帖子，并发布了一篇题为“对不起”的便条，声明他准备发布更多证据，但没有勇气这样做。他以“再见”结束了这篇便条。


    同年，赖特为最初由中本聪撰写的比特币白皮书提交了版权申请。然而，由于所有权证明不足，该版权申请被驳回。


    ## 尼克·萨博（Nick Szabo）


    我们承认：我们的观点是尼克·萨博是中本聪。我们没有他身份的实际证据，但在广泛研究了这个主题之后，这是我们的观点。


    尼克·萨博是一名计算机科学家、律师和密码学家，以其关于数字合同和数字货币的研究而闻名。他于 1989 年毕业于华盛顿大学，获得计算机科学学位。


    “智能合约”的表达和概念是由萨博开发的，旨在将他所谓的“高度演进”的合同法实践，从构思到互联网上陌生人之间的合同协议协议的应用。智能合约是加密货币的主要特征之一，也是编程语言
    `E` 的特征。


    萨博在 90 年代中期曾担任电子货币“E-Cash”的发明者大卫·乔姆（David Chaum）的顾问。1998 年，萨博设计了一种名为“比特黄金”（Bit
    gold）的去中心化数字货币机制。比特黄金未获得足够支持，从未被实现，但被视为比特币架构的直接前身。


    在比特黄金的原理中，参与者将其计算机的算力用于解决密码学难题。解决的难题会被发送到一个对拜占庭将军问题不敏感的公共登记册，并分配给解决难题的参与者的公钥。每个解决方案随后被整合到下一个挑战的输入数据中，创建出越来越长的链条。直到大多数参与者同意当前谜题的解决方案，解决下一个谜题的工作才能开始。这是一种工作量证明类型的共识模型。这也使得可以管理新比特黄金代币的发行，并作为检查其时间戳的一种手段。


    数字形式交易的主要问题是所谓的双重支付问题。一旦数据被创建，复制它只是简单的复制和粘贴。大多数数字货币通过将部分控制权交给一个中央机构来解决这个问题，该机构跟踪每个账户的余额。萨博认为这是不可接受的。在一次采访中，他如下表示。“我试图尽可能在网络空间中模仿黄金的安全性和信任特征，其主要特点之一是它不依赖于任何中央机构”。


    2008 年，一位使用中本聪化名撰写的神秘人物发布了一份关于比特币的提案。如你所知，中本聪的真实身份此后一直保密，导致关于一长串被怀疑是中本聪的人的猜测。尽管萨博多次否认，但一些人（包括我们）曾推测他是中本聪。金融作家多米尼克·弗里斯比（Dominic
    Frisby）的研究提供了间接证据，但正如他承认的那样，没有正式证据表明中本聪确实是萨博。


    在 2014 年 7 月弗里斯比给萨博的电子邮件中，萨博说：“谢谢你告诉我这个。恐怕你把我揭露为中本聪是错的，但我对此已经习惯了”。


    纳撒尼尔·波珀（Nathaniel Popper）在《纽约时报》中写道，关于比特币创建的最有说服力的证据指向一位名为尼克·萨博的匈牙利血统的美国人。2008
    年，在比特币发布之前，萨博在他的博客上发表了一条评论，表达了创建其假设货币可行版本的意图。这篇博客文章正是让我们认为他是这个惊人货币网络的实际发明者的原因。


    '
