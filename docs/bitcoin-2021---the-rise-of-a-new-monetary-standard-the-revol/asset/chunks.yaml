    # Chapter 9 - Legal framework


    The legal nature of bitcoin is not a uniformly decided issue. The international
    aspect of bitcoin, with regard to the regional nature of the legal frameworks
    (European Union, United States, China, in particular), precludes any comprehensive
    legal response, in the current state of the law. In particular, the G20 considered
    that if crypto assets raise issues with regards to consumer and investor protection,
    market integrity, tax evasion, money laundering and terrorist financing, then
    they must be managed by states rather than by the G20 itself.


    ## European Union


    According to the European Central Bank, the important banking and financial regulations
    imposed on the Member States of the European Union do not concern bitcoin. The
    European banking authority warned consumers against the risks associated with
    bitcoin (December 13th, 2013), considering cryptocurrencies as “virtual representations”
    of money. It also recommended on July 4th, 2014 to European banking and financial
    institutions not to use bitcoin nor to offer services around it. On October 22nd,
    2015, the Court of Justice of the European Union confirmed that bitcoin exchange
    transactions for traditional currencies were exempt from VAT, considering bitcoin
    as a “virtual currency” and not as a good or a service.


    ## Australia


    In December 2013, the Governor of the Central Bank of Australia (RBA) said in
    an interview on the legality of bitcoin that “there would be nothing to stop people
    from deciding to transact in another currency in a store if they wanted. There
    is no law against this, so we have competing currencies”. Australia has officially
    confirmed that bitcoin will be treated as cash on July 1st, 2017 and that it will
    no longer be subject to double taxation.


    ## Belgium


    The Minister of Finance indicated that government intervention with regard to
    the Bitcoin system does not appear to be necessary, since it is the European Union
    that should be focused on regulating this subject. The central bank of Belgium
    estimated in a statement that “the threats to monetary stability posed by digital
    currencies issued by private actors are currently rather limited, because they
    used as a medium of exchange, so that their impact on the conditions in the economy
    is weak”.


    ## China


    On December 5th, 2013, the Chinese Central Bank banned local banks from any bitcoin
    transaction, a measure leading to the start of a crash in the value of the virtual
    currency. BTC China, the world''s leading bitcoin transaction platform, prohibited
    users from making new deposits in Yuan into their account "following new government
    regulations". On January 8th, 2014, the Chinese group Ali Baba banned bitcoin
    payments, in accordance with new Chinese regulations. A law established on September
    4th, 2017 leads either to the closure of an exchange platform or to the end of
    the acceptance of fiat currencies. In February 2018, the Chinese government announced
    that it wanted to strengthen the ban through censorship of all Chinese or foreign
    bitcoin exchange websites.


    ## South Korea


    In South Korea bitcoin and cryptocurrencies are legal and recognized as financial
    instruments. There are no restrictions for holding and exchanging bitcoin between
    individuals. Exchange platforms must ensure they have at least 500 million Korean
    Won to protect traders and businesses from embezzlement and fraud. The government
    of South Korea has agreements with 14 “virtual cash” exchange platforms known
    as currency exchanges. Thanks to these agreements, these platforms only accept
    users whose identity is controlled by a financial actor such as a bank.


    ## United States


    The parliamentary report by Senator Tom Carper (February 3rd, 2014) provided a
    first overview of the legal issues of bitcoin. The report concluded on the economic
    interest of bitcoin and the need to regulate its development, in order to contain
    its specific risks. It also did not offer a firm legal definition of bitcoin.
    On February 26th, 2014, US Senator Joe Manchin called for bitcoin to be banned
    in the United States, because of its uncontrolled volatility and the risk that
    it could be used for illegal purposes, in particular for money laundering. For
    the moment, the United States considered that virtual currencies developed on
    the bitcoin model have no legal value but constitute assets liable to be subject
    to taxes. On December 10th, 2017, the Chicago Stock Exchange institutionalized
    Bitcoin, launching the possibility to trade Bitcoin futures. In 2018, the authorities
    - notably the Securities and Exchange Commission, and the Commodity Futures Trading
    Commission - prosecuted various actors who carried out scams such as the dangling
    of the possibility of getting rich with Bitcoin or binary options.


    ## France


    In France, neither the law nor case law has specifically and clearly regulated
    the nature and legal regime of bitcoin. For some lawyers, it is not a currency.
    For others, bitcoin would be "a currency, electronic in nature, devoid of legal
    tender". For the national commission of campaign accounts and political financing,
    it is a “currency without defined legal status”. For the Directorate General of
    Public Finances, bitcoin is considered to be a movable property, the value at
    purchase or sale and its value at the end of the fiscal year being legal. In the
    event that Bitcoin is considered to be electronic money, the rules in force for
    electronic money would apply to bitcoin (Articles `L. 133-29 et seq. 191` of the
    Monetary and Financial Code). In other cases, a legal regime for Bitcoin would
    have to be invented. In a 2014 report it was stated that virtual currency did
    not represent a claim on the issuer and was not issued against the remittance
    of funds, within the meaning of the electronic money directive, which did not
    give it the electronic money status. On the other hand, no text excludes bitcoin
    transactions from the tax obligations in force, in particular with regard to the
    taxation of profits or the collection of capital gain tax. This situation was
    recalled by the tax authorities on July 11th, 2014. Similarly, profits made in
    accordance with the definition of article 92 of the General Tax Code (CGI) are
    subject to taxation. In January 2018, the Minister of the Economy, Bruno Le Maire,
    said he understood “the risks of speculation and possible embezzlement”. He entrusted
    a mission on bitcoin to Jean-Pierre Landau, former deputy governor of the Banque
    de France. In his report, Jean-Pierre Landau recommends not directly regulating
    crypto-currencies (except in the context of the fight against money laundering),
    to create an environment favorable to the development of this technology and to
    strictly limit the exposure of the financial sector to cryptocurrencies. On September
    12th, 2018, France became the first country in the world to grant a legal framework
    to Initial Coin Offerings.


    ## Japan


    The central bank of Japan officially recognizes bitcoin and cryptocurrencies as
    a means of payment. In fact, article 2-5 of the amended PSA specifies that virtual
    currencies are accepted as a means of payment without being legal currencies.


    ## United Kingdom


    Bitcoin is considered "private money". When cryptocurrencies are exchanged for
    pounds sterling or other fiat currencies, such as the euro or the dollar, no VAT
    is due. However, VAT applies for all goods and services that could be exchanged
    for bitcoins. Profits and losses made on cryptocurrencies are subject to capital
    gains tax.


    ## Russia


    On February 6th, 2014, Russia declared the currency illegal on its territory,
    arguing that the only official currency in Russia is the ruble and that no other
    currency can legally be used in the country.


    ## Singapore


    In December 2013, the Singapore Monetary Authority asserted that trading in goods
    and services for bitcoins constituted trade in which it was not for the authority
    to intervene. In January 2014, Singapore''s Domestic Revenue Administration released
    a set of tax guidelines according to which bitcoin transactions can be considered
    barter if they are used as a method of payment for real goods and services. Companies
    that deal in bitcoin exchanges will be taxed based on their sales levels.


    ## Swiss


    In Switzerland, the Federal Council considered that bitcoin is a virtual currency
    of marginal use, and that as such it is subject in principle to the legislation
    of regular currencies. However, it recommends that authorities and responsible
    consumer organizations call on bitcoin users to be cautious. According to the
    Federal Council, the execution of contracts concluded in virtual currencies can
    in principle be ensured and offenses committed with these currencies are punishable.
    For example, the professional trading of virtual currencies and the operation
    of trading platforms in Switzerland fall in principle within the scope of the
    law on money laundering, which requires the identity of the person to be verified.
    However, from the Swiss point of view, there are no international standards regulating
    virtual currencies. Bitcoin will always exist, whether prohibited or advised by
    the authorities, you just need to connect to the internet by cable or satellite
    to make a transaction in your ledger. In addition, people residing in countries
    hostile to bitcoin can use a method such as those proposed by Samourai or Wasabi,
    for example, to avoid being traced.


    ## The debate around Bitcoin and terrorism


    Various opinions relating to the real or supposed link between Bitcoin and terrorism
    have been raised. On several occasions, Bitcoin has been touted as a tool that
    can be used for terrorist financing their criminal actions. In our opinion, stating
    that Bitcoin can be used for terrorism is as saying that dollars can be used for
    the same reason. Both statements could be true, but we will never consider stopping
    using dollars because of this potential issue.

    '
  trans: '


    # 第 9 章 - 法律框架


    比特币的法律性质并非一个统一决定的问题。比特币的国际性，就法律框架的区域性（特别是欧盟、美国、中国）而言，在当前法律状态下，无法作出全面的法律回应。特别是，G20
    认为，如果加密资产在消费者和投资者保护、市场完整性、逃税、洗钱和恐怖融资方面引发问题，那么它们应由各国管理，而非由 G20 本身管理。


    ## 欧盟


    根据欧洲央行的说法，对欧盟成员国施加的重要银行和金融法规不涉及比特币。欧洲银行管理局警告消费者注意与比特币相关的风险（2013 年 12 月 13 日），将加密货币视为货币的“虚拟表现形式”。它还于
    2014 年 7 月 4 日建议欧洲银行和金融机构不要使用比特币，也不要围绕比特币提供服务。2015 年 10 月 22 日，欧洲联盟法院确认，比特币与传统货币的兑换交易免征增值税，将比特币视为“虚拟货币”，而非商品或服务。


    ## 澳大利亚


    2013 年 12 月，澳大利亚储备银行（RBA）行长在接受关于比特币合法性的采访时表示，“如果人们想在商店里用另一种货币进行交易，没有什么能阻止他们。对此没有法律禁止，因此我们有竞争性货币”。澳大利亚官方确认，比特币将于
    2017 年 7 月 1 日被视为现金，并且不再受双重征税。


    ## 比利时


    财政部长表示，政府对比特币系统的干预似乎没有必要，因为欧盟才应该专注于监管这一主题。比利时央行在一份声明中估计，“私人行为体发行的数字货币对货币稳定性构成的威胁目前相当有限，因为它们被用作交换媒介，因此对经济条件的影响较弱”。


    ## 中国


    2013 年 12 月 5 日，中国央行禁止当地银行进行任何比特币交易，这一措施导致虚拟货币价值开始崩盘。BTC China（全球领先的比特币交易平台）禁止用户向其账户进行新的人民币存款，理由是“遵循新的政府法规”。2014
    年 1 月 8 日，中国集团阿里巴巴禁止比特币支付，以符合新的中国法规。2017 年 9 月 4 日颁布的一项法律导致交易平台关闭或停止接受法定货币。2018
    年 2 月，中国政府宣布希望通过审查所有中国或外国比特币交易网站来加强禁令。


    ## 韩国


    在韩国，比特币和加密货币是合法的，并被认可为金融工具。个人之间持有和交换比特币没有限制。交易平台必须确保拥有至少 5 亿韩元，以保护交易者和企业免受贪污和欺诈。韩国政府与
    14 个被称为货币兑换所的“虚拟现金”交易平台有协议。得益于这些协议，这些平台只接受由银行等金融行为体验证身份的用户。


    ## 美国


    参议员 Tom Carper 的议会报告（2014 年 2 月 3 日）首次概述了比特币的法律问题。该报告得出结论，比特币具有经济利益，需要监管其发展，以控制其特定风险。它也没有对比特币给出明确的法律定义。2014
    年 2 月 26 日，美国参议员 Joe Manchin 要求在美国禁止比特币，理由是其不受控制的波动性以及可能被用于非法目的（特别是洗钱）的风险。目前，美国认为基于比特币模式开发的虚拟货币没有法律价值，但构成可能需缴税的资产。2017
    年 12 月 10 日，芝加哥证券交易所将比特币制度化，推出了比特币期货交易的可能性。2018 年，当局（特别是证券交易委员会和商品期货交易委员会）起诉了各种实施诈骗的行为者，例如承诺通过比特币或二元期权致富的诈骗。


    ## 法国


    在法国，法律和判例法均未具体明确地规范比特币的性质和法律制度。有些律师认为它不是货币。另一些人认为比特币是“一种电子性质的货币，不具有法偿性”。对于全国竞选账户和政治融资委员会来说，它是一种“法律地位未定义的货币”。对于公共财政总局来说，比特币被视为动产，其购买或出售时的价值以及财政年度末的价值均合法。如果比特币被视为电子货币，则电子货币的现行规则适用于比特币（货币和金融法典第
    `L. 133-29 et seq. 191` 条）。在其他情况下，必须为比特币发明一种法律制度。在 2014 年的一份报告中，指出虚拟货币不代表对发行人的债权，也不是在汇款资金的情况下发行的，在电子货币指令的意义上，这并未赋予其电子货币地位。另一方面，没有文本将比特币交易排除在现行税务义务之外，特别是关于利润征税或资本利得税征收方面。税务机关于
    2014 年 7 月 11 日再次强调了这一情况。同样，根据《普通税法典》（CGI）第 92 条的定义所获得的利润需缴税。2018 年 1 月，经济部长 Bruno
    Le Maire 表示他理解“投机和可能的贪污风险”。他委托 Jean-Pierre Landau（法国银行前副行长）负责一项关于比特币的使命。在他的报告中，Jean-Pierre
    Landau 建议不直接监管加密货币（除了在打击洗钱的背景下），创造有利于该技术发展的环境，并严格限制金融部门对加密货币的敞口。2018 年 9 月 12
    日，法国成为世界上第一个为首次代币发行（ICO）授予法律框架的国家。


    ## 日本


    日本央行正式承认比特币和加密货币是一种支付手段。事实上，修订后的《支付服务法》第 2-5 条规定，虚拟货币被接受为一种支付手段，但不是法定货币。


    ## 英国


    比特币被视为“私人货币”。当加密货币兑换成英镑或其他法定货币（如欧元或美元）时，无需缴纳增值税。但是，所有可以用比特币交换的商品和服务均适用增值税。加密货币的盈亏需缴纳资本利得税。


    ## 俄罗斯


    2014 年 2 月 6 日，俄罗斯宣布该货币在其领土上非法，理由是俄罗斯唯一的官方货币是卢布，该国不能合法使用其他任何货币。


    ## 新加坡


    2013 年 12 月，新加坡金融管理局断言，用比特币交易商品和服务构成了该机构不应干预的贸易。2014 年 1 月，新加坡国内税务局发布了一套税务指南，根据该指南，如果比特币交易作为购买真实商品和服务的支付方式，可以被视为以物易物。从事比特币交易的公司将根据其销售水平征税。


    ## 瑞士


    在瑞士，联邦委员会认为比特币是一种边缘用途的虚拟货币，因此原则上适用常规货币的立法。然而，它建议当局和负责任的消费者组织敦促比特币用户保持谨慎。根据联邦委员会的说法，以虚拟货币签订的合同的执行原则上可以得到保障，使用这些货币犯下的罪行可受惩罚。例如，在瑞士进行虚拟货币的专业交易和运营交易平台原则上属于反洗钱法的范围，该法律要求验证个人身份。然而，从瑞士的角度来看，没有监管虚拟货币的国际标准。比特币将始终存在，无论当局是禁止还是建议，你只需通过电缆或卫星连接到互联网，即可在你的账本上进行交易。此外，居住在对比特币持敌意的国家的人们可以使用
    Samourai 或 Wasabi 等方法，例如，以避免被追踪。


    ## 围绕比特币和恐怖主义的辩论


    关于比特币与恐怖主义之间实际或所谓联系的各种观点已被提出。多次，比特币被宣传为可用于恐怖分子资助其犯罪行为的工具。在我们看来，说比特币可用于恐怖主义，就像说美元可以出于同样的原因被使用一样。这两种说法都可能是正确的，但我们永远不会因为这个潜在问题而停止使用美元。


    '
