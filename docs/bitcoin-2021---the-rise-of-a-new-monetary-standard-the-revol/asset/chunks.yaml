    # Chapter 28 - Bitcoin Blockchain and Safety


    在本书中，我们经常提到区块链是一种极其安全可靠的存储交易的技术。但究竟是什么让它如此安全呢？那么，在本章中，我们将深入探讨这一方面。区块链通过多种机制得到保护，包括先进的加密技术以及行为和决策数学模型。区块链技术是大多数加密货币系统的基础结构，也是防止此类数字货币被复制或销毁的关键。区块链技术目前正在其他需要不可更改性和数据安全性的场景中开发应用。一些示例包括有益捐赠的注册与监控、医疗数据库以及物流链管理。然而，区块链安全绝非简单话题。因此，理解为这些创新系统提供强大保护的概念和基本机制非常重要。


    ## The concepts of immutability and consensus


    虽然有许多因素有助于区块链相关的安全性，但其中最重要的两个是共识和不可更改性的概念。共识是指分布式网络区块链中的节点就网络的实际状态和交易的有效性达成一致的能力。一般来说，达成共识的过程依赖于所谓的共识算法。另一方面，不可更改性是指区块链防止已确认交易被篡改的能力。虽然这些交易通常与加密货币的转移相关联，但也可以指其他形式数字数据的登记。共识和不可更改性共同为区块链网络提供数据安全结构。共识算法保证系统规则得到遵守，所有相关方都同意网络的当前状态，而不可更改性则保证每个新数据块被确认有效后，数据和交易记录的完整性。


    ## The role of encryption in the safety of Blockchain


    区块链广泛使用加密技术来实现数据安全。在本语境下，哈希函数是一种极其重要的加密函数。哈希是一种过程，其中已知算法作为哈希函数接收任意大小的数据输入，并返回包含固定长度值的确定输出。无论输入的尺寸如何，输出始终具有相同的长度。如果输入发生变化，输出将完全不同。但是，如果输入不变，生成的哈希始终相同——无论哈希函数执行多少次。在区块链中，这些输出值（称为哈希）被用作数据块的唯一标识符。每个区块的哈希是相对于前一个区块的哈希生成的，这一因素将区块连接在一起，从而形成链。此外，区块哈希取决于其中包含的数据，因此对数据的任何更改也需要修改区块哈希。因此，每个区块哈希既基于其中包含的数据，也基于前一个区块哈希。这些哈希标识符在确保区块链的安全性和不可更改性方面发挥着根本作用。哈希也用于验证交易的共识算法中。例如，在比特币区块链中，用于达成共识和挖掘新单元的工作量证明（POW）算法利用了一种名为
    SHA-256 的哈希函数。正如其名称所示，SHA-256 将输入数据转换为 256 位长的哈希或 64 个字符。除了为存储在账本上的交易提供保护外，加密还用于保障用于存储代币的钱包的安全。允许用户接收和发送付款的公钥和私钥对是通过非对称或公钥加密技术创建的。私钥用于为交易生成数字签名，从而允许您验证转移代币的所有权。出于本章的目的，无需深入细节，只需知道非对称加密的性质防止任何人（除私钥所有者外）访问加密货币钱包中保存的资金，从而使这些资金保持安全，直到所有者决定花费它们（只要私钥未被共享或泄露）。


    ## Crypto Economy


    除了加密之外，一种相对较新的概念——密码经济学——在维护区块链网络安全方面也发挥着作用。它指的是博弈论这一研究领域，该领域在具有预定义规则和奖励的情况下，对理性行为者的决策过程进行数学表述。虽然传统的博弈论可以应用于广泛的案例，但密码经济学模型专门描述了分布式区块链系统中节点的行为。简而言之，密码经济学是研究区块链协议的经济方面及其设计可能根据参与者行为产生的可能结果。通过密码经济学实现的安全性基于这样一种观念：区块链系统为诚实行为的节点提供比采取恶意或不正确行为更好的激励。同样，比特币挖矿中使用的工作量证明共识算法为这种激励方案提供了绝佳示例。当中本聪为比特币挖矿创建结构时，该过程被有意设计为在资源方面成本高昂。由于其复杂性和计算需求，挖矿过程涉及大量的时间和资金投资——无论挖矿节点位于何处。因此，这种结构对恶意行为构成了强大的抑制力，并为诚实的挖矿活动提供了显著的激励。不诚实或低效的节点会被迅速驱逐出区块链网络，而诚实且高效的矿工则有可能为区块获得丰厚的奖励。同样，这种风险与回报的平衡也保护了免受旨在通过将区块链网络的大部分哈希率集中在单一群体或实体手中来破坏共识的潜在攻击。这些攻击被称为
    51% 攻击，如果成功实施，可能会造成极大危害。由于比特币工作量证明挖矿的竞争性以及比特币网络的规模，攻击者能够控制大部分节点的概率非常小。此外，获得对大型区块链网络
    51% 控制权所需的计算能力成本将是天文数字，这对如此巨大的投资构成了即时抑制力，而潜在回报却很小。只要建立大部分不诚实节点的成本仍然高昂，并且诚实活动有更好的激励，系统就能在没有重大混乱的情况下蓬勃发展。应强调，较小的区块链网络无疑容易受到上述攻击，因为专门用于这些系统的总哈希率远低于比特币。通过博弈论和加密技术的结合使用，区块链作为分布式系统能够达到高水平的安全性。然而，与几乎所有系统一样，必须充分应用这两个知识领域。去中心化与安全性之间的准确平衡对于开发可靠且有效的网络至关重要。随着区块链用例的不断发展，安全系统也将发展以满足各种应用的需求。例如，目前为商业企业开发的私有区块链更多地依赖于基于访问控制的安全性，而不是基于许多公共区块链安全所必需的博弈论机制。


    '
