    # Chapter 12 - Buying Bitcoin


    The turnover regarding virtual currencies is constantly increasing, as evidenced
    by the interest of users on cryptocurrency exchanges. Even if Bitcoin is the best
    known worldwide, it does not mean that it is the only cryptocurrency to be bought
    or sold. Choosing the best cryptocurrency exchange is essential, especially in
    consideration of the total invested capital value. In fact, there are risks associated
    with cryptocurrency investing, one of these refers precisely to the choice of
    the exchange. Before listing the best exchange sites for buying and selling cryptocurrencies,
    we will explain in detail what an exchange is and how it works. Therefore, we
    will focus on the most advantageous solutions on the market today, available to
    experienced investors and users who are entering the digital currency sector only
    now.


    ## Cryptocurrency exchanges


    Cryptocurrency exchanges are platforms where coins can be exchanged. The most
    common exchange takes place between dollars or euros for the corresponding value
    of a virtual currency. For example, if you want to buy one BTC, you will need
    $58,000 (the present value of a single BTC) plus the commission value for the
    exchange. Once the exchange is complete, the newly acquired cryptocurrency must
    be deposited in a wallet (electronic wallet). The wallet can be compared to a
    bank account, with which, however, one only has the opportunity to withdraw, deposit
    or send part or all of the cryptocurrency to another digital wallet or exchange.


    ## The wallet


    Each wallet is assigned a specific address, which could be compared to the bank
    account number code of traditional checking accounts. In addition, a secret key
    is needed to log into the electronic wallet for the first time. You can then set
    a login password and encrypt the data.


    There are three types of wallets:


    - **Software Wallet**. A program downloaded to a computer or mobile device. They
    are generally among the wallets that guarantee greater security.

    - **Online Wallet**. Digital wallets that can be accessed from the Internet through
    a private key, most often managed by the exchange. Of the three types it is the
    least safe.

    - **Hardware Wallet**. A physical device (most often a USB stick) that makes it
    possible to access the wallet only if it is connected to a second device. Among
    all it is the one that offers the greatest safety.


    We will talk more about cryptocurrency wallets in a dedicated chapter.


    As there are different wallets, there are also different types of exchanges:


    - **Exchange fiat to crypto**. They allow you to exchange a fiat currency (e.g.
    dollar or euro) for a virtual currency.

    - **Exchange with centralized management**. Platforms managed by a third party.
    The positive aspects include the speed of transactions and the low commissions
    compared to those requested by exchanges for decentralized cryptocurrencies. Among
    the disadvantages, however, there is a greater risk of running into a scam.

    - **Exchange with decentralized management**. The processes are automated, as
    everything is delegated to the blockchain technology. Consequently, an exchange
    of this type operates in total safety. However, it is also true that transactions
    are slower. Furthermore, the variety of cryptocurrencies is still small compared
    to the offer of other exchanges.


    The last aspect to emphasize concerns the commissions, charged to users who operate
    within the exchange platforms. Broadly speaking, there are four different fees:


    - Storage fee;

    - Withdrawal fee;

    - Order taker fee;

    - Order maker fee.


    Usually, the fees are inversely proportional to the volumes traded on a monthly
    basis. This means that higher volumes correspond to lower fees, while when volumes
    are low, fees tend to rise. Therefore, if we want to summarize the concepts expressed
    so far, the choice of an exchange rather than another should be based on the analysis
    of three important aspects:


    - **Safety**. As far as possible, opting for a decentralized exchange platform
    would be the best decision, but it is also true that it is a rather recent solution
    with the limitations described above (low speed of operations and few cryptocurrencies
    to trade).

    - **Strategy**. Before choosing an exchange instead of another, you should have
    already outlined a plan. In this regard, it is important to understand if you
    want to aim for a fiat-to-crypto exchange or an exchange where only virtual currencies
    exist.

    - **Commissions**. An analysis of the costs to be incurred for the future operations
    that will be carried out is very important to make a final choice, taking into
    account the other two factors as well.


    ## The best cryptocurrency exchanges


    The list of the best cryptocurrency exchanges features long-lived platforms such
    as Coinbase Pro, Kraken and Bitstamp, in addition to the more modern Binance.
    Below we offer a brief presentation of each trading platform, listing pros and
    cons.


    ### Binance


    Binance is the largest international cryptocurrency exchange. Created only in
    2017, in a short time it managed to gain the interest of virtual currency traders.
    Binance has also recently created its own cryptocurrency (Binance Coin, ticker
    symbol: BNB). Currently BNB is in the top ten positions of the CoinmarketCap ranking,
    dominated by Bitcoin and Ethereum.


    Until recently, traders on Binance could only trade cryptocurrencies with other
    cryptocurrencies. Recently, however, the possibility of exchanging virtual currencies
    in exchange for fiat currencies has also been introduced. The main advantages
    are that there are over 130 cryptocurrencies available and the commissions are
    around 0.1%. The only disadvantage is that the graphic interface is not very beginner
    friendly. In fact, we found that people that are just starting out in cryptocurrency
    find it difficult to navigate through the many possibilities of the site. It is
    the Ferrari of cryptocurrency exchanges: if you want to buy bitcoin for the first
    time you do not need a Ferrari.


    ### Wirex


    Wirex is a digital payment platform, and an FCA-licensed electronic money institution
    in the United Kingdom, with a clear mission: to cancel the differences between
    real and virtual money and make the use of cryptocurrencies easier and more accessible
    to everyone. Thanks to the innovative mobile app and the new generation Wirex
    multi-currency card, the user can buy, exchange and hold a wide range of fiat
    coins and cryptocurrencies (including BTC, ETH, LTC, XRP, XLM, WXT, WAVES, DAI
    and NANO) and also spend them in physical stores. All this quickly, safely and
    without commission.


    There are many advantages of having a Wirex account, from unlimited access to
    OTC rates for cryptocurrency exchanges, to new generation rewards.


    #### Services offered and benefits


    - **Currency exchange without commission**. Users can exchange fiat and cryptocurrencies
    instantly on the app for free and at favorable exchange rates.

    - **Wirex multi-currency card**. This allows users to spend cryptocurrencies and
    fiat money wherever Mastercard and Visa are accepted, and participate in the first
    cryptocurrency cashback program in the world (Cryptoback) to get up to 2% of the
    cost for each purchase made.

    - **Free ATM withdrawals up to $500 per month and no monthly fee**. Among the
    advantages offered by Wirex there are also the free account setup and card issuance
    and the absence of commissions on card transactions in stores. Furthermore, users
    have the possibility of recharging the account without restrictions up to 50,000
    dollars per transaction by bank transfer.


    #### Sign up process and verification


    To register, you need to connect to the website or download the app available
    for free on the App Store and Play Store. The registration procedure is quick
    and easy: just fill out the form and click on the link received in the confirmation
    email. The verification process takes only a few minutes. You will have to upload
    the documents to verify your identity and, once verified, set a password for greater
    security.


    And speaking of security, to protect its users'' data from possible hacker attacks
    and violation of privacy, Wirex uses SSL (Secure Sockets Layer) technology for
    all communications between servers and web browsers, which guarantees data protection.
    Furthermore, two-factor authentication and BitGo''s multi-signature technology,
    which makes it impossible to transfer money without the transaction being authorized
    with signature by all parties involved. Finally, the platform does not keep payment
    card numbers, expiration dates or CVV codes. It is a very nice app for buying
    your first bitcoin, we recommend it.


    ### Coinbase Pro


    Coinbase Pro is the world''s best known cryptocurrency exchange. It is based in
    San Francisco and also appears in the ranking of the longest-lived platforms (the
    year of Coinbase''s foundation dates back to 2012). Compared to other exchanges,
    there are few cryptocurrencies available for trading in Coinbase Pro. The updated
    list features Bitcoin, Bitcoin Cash, Ethereum, Litecoin, EOS, Stellar, Ethereum
    Classic, Ox and the stablecoin USD Coin (USDC). The possibility of exchanging
    virtual currencies with fiat currencies should be noted. Another important aspect
    to take into consideration when talking about Coinbase Pro is the ease of use
    of the platform, which is also valid for those who are new to cryptocurrency trading.


    ### Kraken


    Kraken was born in 2011, a year earlier than Coinbase. It owes its popularity
    to the rich fiat currency exchange section for Bitcoin (users can choose between
    euro, dollar, pound, yen, etc.). The Kraken exchange currently supports 17 cryptocurrencies.
    These include Bitcoin, Bitcoin Cash, Bitcoin SV, Ethereum, Ethereum Classic, Ripple,
    Litecoin, Moreno, EOS, ZCash, DASH, Dogecoin and the stablecoin Tether.


    Among the negative sides of Kraken we can mention the arbitrary closure of some
    accounts managed by normal users, as witnessed by some traders who spoke controversially
    about the platform founded by Jesse Powell almost ten years ago. The availability
    of cryptocurrencies is greater than CoinbasePro, and the ability to exchange fiat
    currencies for virtual currencies is what makes it attractive for new crypto enthusiasts.
    However, the slower speed of operations compared to other equally famous exchanges
    and a question mark on security in light of the complaint relating to the arbitrary
    closure of some accounts does not give us the confidence to suggest it to those
    just starting out in crypto.


    ### Bitstamp


    Bitstamp was founded in the same year as Kraken (2011) by the very young Nejc
    Kodrič and Damijan Merlak. Born in 1989, Kodrič created Bitstamp at the age of
    22. The exchange, whose base today is in Luxembourg, was created as a European
    alternative to Mt. Gox, the historic cryptocurrency exchange site that failed
    in 2014 (until a few months earlier it held 70% of Bitcoin transactions globally).


    One of the main features of Bitstamp is the lower commission value compared to
    other competitors. For example, the commission on an international bank transfer
    is 0.05%, while for a withdrawal, 0.09% is the requested fee. However, like CoinbasePro,
    Bitstamp does not allow traders to trade a large number of cryptocurrencies. At
    the moment, exchanges of Bitcoin, Bitcoin Cash, Litecoin, Ethereum and Ripple
    are allowed.


    ### Bittrex


    Bittrex is among the 5 best cryptocurrency exchanges along with the most well-known
    platforms mentioned so far. Its base is in Seattle, in the United States of America,
    and this makes Bittrex one of the safest exchanges for traders (in Washington
    State, security is a central theme in the debate related to the management of
    virtual currencies). On Bittrex, only the exchange between cryptocurrencies is
    allowed, therefore it is not the ideal choice for those who instead aim to exchange
    between fiat and virtual currencies. The cost of commissions should also be emphasized,
    the percentage of which on average reaches 0.25%. Based on its structure, Bittrex
    is also the platform where the largest number of cryptocurrencies are present.
    The list also includes Bitcoin, Ethereum, Ripple and Cardano.


    Our insight into the best cryptocurrency exchange sites ends here. We remind you
    that new exchanges are born every day, but we advise you to just use the ones
    mentioned in this chapter. In fact, the cryptocurrency world is famous for the
    huge number of scams. Be cautious and everything will be fine.

