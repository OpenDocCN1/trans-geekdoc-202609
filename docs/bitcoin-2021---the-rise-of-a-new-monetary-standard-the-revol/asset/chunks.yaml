    # Chapter 10 - 与比特币网络相关的潜在风险


    从一开始，比特币就一直是许多讨论的主题，涉及技术、经济甚至政治。从这些讨论中，人们讨论了比特币网络的许多优点和缺点。其中一些评论不一定特定于比特币，也可以应用于具有类似特征的其他支付系统。然而，最近，我们意识到与比特币相关的风险在其性质和范围方面知之甚少或理解不足。比特币，如同大多数现有的加密货币一样，没有底层资产或抵押品。无论谁购买比特币，都只是支付给卖家。因此，货币价值的增长完全来自持续存在的、能够支撑其价格的买家流。因此，经过仔细检查，比特币的运作方式可能看起来更像是一个庞氏骗局系统，而不是货币系统。然而，如果你一直跟随我们，你会知道实际上情况大不相同。事实上，当你存储比特币时，你正在为货币网络的稳定性和强度做出贡献，该网络随着投资者注入的资金量而增长和增强。


    ## 波动性


    比特币是一种波动性货币，因为在需求增长的情况下，币种数量有限。价格根据加密货币的新闻而变化。加密货币像任何货币一样浮动，并对不同货币产生不同的波动。


    ## 不可逆性


    比特币交易是不可逆的，无法撤销。这意味着如果你提供或输入了错误的地址，你的币将永远丢失。


    ## 依赖互联网


    比特币协议是 IP 协议的叠加层，IP 协议是互联网运行的基础。在发生互联网关闭（例如大规模停电/IT 故障或政府强制关闭互联网服务提供商的路由器）或政府不促进或捍卫互联网中立性的情况下，比特币协议可能会减慢甚至完全被阻止。


    ## 网络的技术限制


    数据库的大小增长非常迅速，需要硬盘中几个千兆字节的内存。一些专家对该数据库未来的大小表示质疑，并讨论可能的解决方案以节省磁盘空间，例如修剪形成 Merkle
    树的最旧交易。然而，鉴于存储技术的进步，这似乎并不必要。区块大小是另一个重要方面。正在考虑比特币“超级节点”以促进信息通过网络节点的传播，这些节点难以跟上数据库大小的增加。一些学者认为，摩尔定律可以帮助使用个人电脑跟踪网络增长。


    ## 机构风险


    要将加密货币转换为法币，通常需要通过私营公司运营的交易平台，这些平台可能容易出现违约或破产，就像 Mt. Gox 发生的情况一样。但是，你可以将比特币兑换成现金、黄金或服务，以避免这个陷阱。


    ## 环境影响和风险


    它们与挖矿产生的电力消耗有关，据估计，这占全球电力消耗的 0.15% 到 0.32%。当电力来自可再生能源时，影响较低；但对于化石燃料（全球变暖和空气污染）来说则很重要。越来越多的服务器农场安装在气候寒冷的国家（以便于散热）且拥有廉价可再生能源的国家，例如加拿大和冰岛。一项关于挖矿农场消耗的电力来源的研究表明，消耗的能源中有
    74.1% 来自可再生能源。然而，在受到批评后，该研究的主要作者承认研究中存在一些错误。确实，中国的主要可再生能源水电，一年中的某些时期才低价可用。其余时间，电力生产主要来自煤炭。


    ## 伦理风险


    比特币似乎有利于该货币的首批获取者（“早期采用者”）。这一说法有时被某些研究证实，这些研究表明比特币中的财富分配非常不均等。有人认为比特币可以被比作庞氏骗局，但正如我们在前面的页面中所见，这并不适用。事实上，加密货币的价格是寻求获取货币的买家和寻求出售货币的卖家之间的平衡。在庞氏骗局中，新进入者支付给早期采用者，但没有任何回报。一些中央银行（欧洲央行、法国银行、中国人民银行）已就比特币的使用发出警告，强调其高度投机性质、由于其作为非受监管货币的地位而产生的法律风险，以及其可能被用于犯罪目的（洗钱、恐怖融资）。欧洲银行管理局（EBA）也于
    2013 年 12 月发出警告，反对通过比特币这种支付方式缺乏消费者保护。然而，其他机构持有更细致甚至相反的观点。因此，德国和美国政府对这种货币持有一定的善意态度，前美联储主席本·伯南克表示，比特币有潜力彻底改变货币系统。


    # Chapter 11 - 对比特币的褒贬不一的看法


    经济学家们对比特币发表了各种意见。对于美国诺贝尔经济学奖获得者约瑟夫·斯蒂格利茨来说，比特币是一个泡沫，在上涨之前会非常令人兴奋，但随后会下跌。在他看来，它没有任何社会有用的功能。其成功归功于其规避能力。因此，他认为比特币应该被永久禁止。法国诺贝尔经济学奖获得者让·蒂罗尔警告人们警惕比特币，称其为“没有内在价值的资产”、“没有经济现实”。他在两个标准上持怀疑态度：它是长期可行的货币吗？它是否有助于共同利益？关于可行性，让·蒂罗尔特别批评
    2017 年三十亿美元的首次代币发行（ICO）。作为金融去中介化工具的宣传，在他看来，ICO 忽视了金融的基本原理。事实上，使用可靠且资本充足的中介来监控项目，是确保一切正确进行的根本。对于这位经济学家来说，比特币的社会角色是“难以捉摸的”。比特币集中在私人手中，特别是用于欺诈和逃税。比尔·盖茨（微软前首席执行官）、杰克·多西（Twitter
    首席执行官）、理查德·布兰森、查马思·帕拉哈皮蒂亚（Facebook 联合创始人）、温克利沃斯双胞胎以及一系列其他亿万富翁认为比特币是不可避免的。法国商业新闻记者让-马克·西尔维斯特预测将出现崩盘，并强调其在毒品交易、非法枪支交易和国际卖淫中赚取黑钱的人群中以及没有银行账户但拥有智能手机的新兴国家人口中的成功。除此之外，比特币在勒索软件攻击中起着关键作用，勒索软件通常要求以这种难以追踪的货币支付赎金。正如你所见，关于比特币及其作为货币的有效性存在不同的看法。实际上，我们认为它更像是数字黄金，这是
    Microstrategy 首席执行官迈克尔·塞勒和埃隆·马斯克共享的同一想法。在接下来的章节中，我们将讨论如果你想购买比特币并以安全的方式存储它，你需要知道的技术方面。


