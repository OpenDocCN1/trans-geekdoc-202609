    # Chapter 6 - The specific features of Bitcoin


    ## The Bitcoin system''s unit of account


    The Bitcoin system''s unit of account is bitcoin. The symbols used to represent
    it are `BTC` and `XBT`. Bitcoin can also be subdivided into smaller units such
    as millibitcoin (`mXBT`), microbitcoin (`μXBT`) or even satoshi, which represents
    10 nano bitcoins (`10nXBT`). Microbitcoin is sometimes referred to as a bit. The
    Unicode consortium agreed in November 2015 to add bitcoin among its characters,
    assigning it the code `20BF`.


    ## Specificities of Bitcoin


    As a virtual currency, bitcoin has three particularities.


    - In terms of regulation, the lack of legal status and regulatory framework means
    that virtual currencies do not provide any guarantee of price or liquidity. The
    voluntary limitation of the number of units issued without indexation carries
    a risk of speculation leading to high volatility.

    - In terms of transparency, encryption of the identities of beneficiaries and
    order givers leads to total anonymity of transactions. The transactions carried
    out are recorded in a public register, but this traceability is limited. In fact,
    it does not allow to know the principal and the beneficial owner, it is neither
    certain nor systematic, it cannot be exploited neither technically nor legally.

    - In terms of extraterritoriality, the protagonists, the servers and the legal
    persons who exploit them may be located in countries and territories whose cooperation
    may be difficult to obtain.


    Exchange terminals allow bitcoin virtual currency to be exchanged for legal tender,
    much like an ATM can withdraw cash from a bank. To do this, these terminals can
    take into account identification formalities based on biometric control: taking
    palm prints, scanning an identity document and comparing facial features with
    the photo that appears on the identity card.


    Another particularity of Bitcoin is the irrevocability of an illicit transaction,
    which makes it extremely important to be sure to send the funds to a correct address.


    ## Proof of ownership


    The user who owns bitcoins can access them through a specific address and a password
    also known as a private key. Since knowledge of the private key is essential for
    signing transactions, bitcoins cannot be spent without resorting to it. The network
    checks the validity of the private key using the user''s public key with asymmetric
    cryptography techniques. On the other hand, only knowledge of the public key of
    an address is necessary to make a deposit. You can imagine the public key to be
    your bank account number, while the private key is the password to access your
    home banking.


    ## Transactions and fees


    Bitcoins from different transactions cannot be combined. A user receiving several
    payments will keep as many different amounts (called input data) in their wallet,
    even if their software, to make them easier to read, displays the total amount.
    When the user wants to spend them, their software will calculate the best set
    of input data to transfer to minimize the size of the output data and thus limit
    transaction costs.


    Example: a user receives 13 payments of `1 × 2.3 XBT`, `5 × 1.0 XBT`, `2 × 0.7
    XBT`, `1 × 0.5 XBT`, `1 × 0.3 XBT`, `2 × 0.2 XBT` and `1 × 0.1 XBT`. The software
    will tell them that they have `10.0 XBT`.


    (Case 1): If they want to spend `3.0 XBT`, the best set of output data will be
    to combine the `2.3 XBT` and `0.7 XBT` received previously.


    (Case 2): If they want to spend `3.05 XBT`, the best output data set is to bundle
    the `2.3 XBT` with the `0.7 XBT` received previously and split the transaction
    from `0.1 XBT` into one exit transaction of `0.05 XBT`, the other transaction
    fraction of `0.05 XBT` being kept in the wallet.


    As you can see, this process is quite complicated and requires a few internal
    transactions. The beauty of the Bitcoin network is that the end user does not
    need to do anything. Once the transaction has been issued, everything is done
    automatically.


    The payment of transaction fees is theoretically optional, but the miners determine
    the order of processing of the transactions to be integrated into the new blocks
    according to the transaction fees offered by the users. The more a user accepts
    to pay high transaction fees, the faster their transaction will be processed.
    In the event of charges of the same amount, priority is given to the oldest transactions.
    Transactions made without transaction fees are processed after all others; in
    practice, these transactions start to be processed on average from 120 minutes
    and up to a potentially infinite time.


    The most competitive transaction fees, which provide almost immediate confirmation,
    between 0 and 35 minutes on average, are around `80 satoshis / byte` (`0,000,000
    80 XBT / byte`). Thus, in 2016, for a median transaction size of `265 bytes`,
    this represents an approximate cost of `21,200 satoshis` (or less than `$0.11`)
    regardless of the amount of bitcoins to be transferred.


    To discourage the proliferation of low-value transactions, the software applies
    a mandatory transaction fee of `0.0001 XBT` to any transaction for an amount less
    than `0.01 XBT`. The larger the assemblies of input data are to carry out a transaction,
    the longer it takes to encode and the more the costs increase, while still remaining
    a very low overall amount. The algorithm of the Bitcoin software is designed to
    avoid as much as possible the aggregation of input data of amount less than `0.01
    XBT` in order to limit mandatory transaction fees.


    If the amount of bitcoins to be transferred is low or if the transaction is recent,
    only the payment of transaction fees will allow immediate processing of the transaction.
    In fact, each transaction is assigned an order of priority determined as a function
    of its amount, its age and its size, itself determined as a function of the number
    of input data grouped together. Specifically, the software calculates a quotient
    determined by the number of bitcoins to be transferred multiplied by the age of
    the transaction and divided by the size of the aggregated input data. Below a
    certain quotient, the transaction will only be processed immediately in return
    for the payment of transaction fees. If the user chooses not to pay transaction
    fees, the quotient will increase over time until it exceeds a threshold value
    which will trigger the processing of the transaction; it will thus be processed
    free of charge but with delay. The higher the number of bitcoins to be transferred,
    the higher the quotient and the faster the user will see their transaction processed
    or free of charge. For the same amount of bitcoins to be transferred, transactions
    involving a small number of input data are processed faster than others.


    Bitcoin software generally calculates the optimal fees to pay for the transaction
    to be processed at the time of transfer. These fees vary depending on the number
    of transactions to be processed at the time of the transfer, but overall they
    are very negligible. The user decides on their own how much transaction fees they
    are willing to pay.


    ## Special cases


    If a user has registered in their wallet `3 XBTs` from two transactions of `1`
    and `2 XBT` and wishes to purchase a product or service costing `2,999 XBT` free
    of charge, the Bitcoin software will have to combine the two transactions and
    split the transaction of `1 XBT` into one line of `0.999 XBT` and one of `0.001
    XBT`. But in this case, the `0.001 XBT` line would have an automatic charge of
    `0.0001 XBT` applied. The user could not then make their purchase which would
    cost them `2 XBT + 0.999 XBT + 0.0001 XBT` when they have `3 XBT` and wish to
    keep `0.001 XBT`. In such a case, it would be better for them to send `3 XBT`
    to the seller free of charge, although some sellers want the exact purchase amount
    sent to them.


    The reddit site reports the case of a user who won a jackpot of `XBT 1,280` on
    a gambling site where the amount of bets was `XBT 0.02`. To transfer the jackpot
    amount, the gaming site had to aggregate `64,000` transactions amounting to `XBT
    0.02` in input data, which represented a `51,203 byte` transaction; the amount
    of fees required for immediate processing was `0.026 XBT`, or approximately `$15`,
    which is more than the player''s bet amount, `$12`, or than a fee usually paid
    for a normal transaction.


    Some miners may choose to process transactions by breaking the rules of the Bitcoin
    protocol. In this case, they include the transaction in a new block that they
    will manage to mine in a longer time as their computing power is low.


    ## The creation of bitcoins


    The creation of a new block is rewarded with bitcoins created for this purpose.
    The amount of this reward is halved every time `210,000` transaction blocks are
    added to the blockchain. This process is called the “halving” and it is one of
    the fundamental reasons that sustain the price increase of bitcoin. Here is how
    it works.


    From the creation of the first block (genesis block) to the `209,999`th block,
    created on November 28, 2012, each miner was rewarded with `50` newly created
    bitcoins for the creation of a new valid block.


    From block `210,000` to block `419,999`, created on July 9th, 2016, the reward
    was `25` bitcoins for each newly created block.


    From block `420,000` to block `629,999`, created on May 11th, 2020, the reward
    was `12.5` bitcoins for each newly created block.


    From block `630,000` to block `839,999`, the reward is `6.25` bitcoins for each
    newly created block.


    The next halving should take place around May 2024, when the reward will decrease
    to `3.125` bitcoins per block.


    The reward system tends towards zero as the series of `210,000` blocks follow
    one another, so that a maximum of `20,999,999.9769` bitcoins will be created,
    probably around the year `2140`. The gradual decrease in the amount of new bitcoins
    rewarding the creation of new blocks will be offset by the development of transaction
    fees. In other words, the inventor of the Bitcoin system tried to define a monetary
    policy whereby the number of bitcoins cannot exceed `21 million` units in total,
    with the rate of creation of new units tending towards zero. Such a monetary system
    is described as deflationary. As you might know, the Dollar-based system is inflationary,
    as more units are printed to sustain the growth of the economy.


    ## Confidentiality


    The Bitcoin system indicates on the public ledger the amount of bitcoins associated
    with each address. All transactions recorded on the blockchain are also public.
    The identity of the owners of bitcoin addresses is not public but can be determined,
    for example through exchange platforms that record the identity of their users.
    Exchange platforms generally pool their users'' holdings on a single address and
    reallocate a bitcoin credit line to each of their users through their trading
    software. Users can thus exchange their bitcoins for other cryptocurrencies or
    for currencies. The platform secures its deposits by distributing them over several
    addresses or by storing them to prevent any theft. When a user transfers the deposits
    from the platform to another address, the platform debits the credit line and
    transfers the amount to be exchanged from one of his addresses to the address
    indicated by the user.


    Researchers at Stanford University and Concordia University have shown that, to
    prevent hacking, bitcoin exchange platforms can prove their creditworthiness without
    revealing their addresses using zero-knowledge protocols. It is also possible
    to keep bitcoins in "cold storage" on a digital medium disconnected from the network,
    which has the effect of protecting them against theft. Between 2017 and 2018,
    a French start-up sold more than `1.5 million` of these bitcoin safes in `165`
    countries. Nowadays, Ledger and Trezor are the two main companies that sell hard
    wallets.


    Researchers have argued that in the absence of specific protection measures, payments
    made using the Bitcoin protocol are no more private than payments by bank card.


    ## Stock exchanges and financial instruments


    Bitcoin, as a virtual currency, is quite unclassifiable. Thus, some asset management
    companies consider that virtual currency can neither be considered as a good investment,
    nor be compared to gold, due to the lack of price history. For the ex-president
    of the SEC, Jay Clayton, the “Initial Coin Offerings” are less protected than
    the traditional securities, allowing more manipulation of markets and scams. For
    him, as for other investments, extreme caution as well as awareness of the risk
    of losing everything is required. No ICOs have been registered with the US federal
    financial markets regulator and supervisor (known as the SEC), and the listing
    and trading of exchange traded products that hold cryptocurrency has not been
    approved by the SEC up to this point.


    ## Market platforms


    Fiduciary currencies (`USD`, `EUR`, `CNY`, etc.) or crypto-currencies (`ETH`,
    `LTC`, etc.) can be exchanged for bitcoins through various exchanges or specialized
    trading platforms active on the internet, by carrying out transactions transfers
    by bank transfer. Brokerage fees are generally very low and users must provide
    proof of their identity to access these platforms. As you might think, in this
    way the anonymity of Bitcoin disappears.


    Escrow platforms connect buyers and sellers to exchange bitcoins for cash, money
    orders, or bank transfers. One-way points of sale make it possible to pay in bitcoins,
    subject to the payment of a fee, by debiting the corresponding amount in dollars
    on bank cards or prepaid cards. Finally, there are vending machines which charge
    a generally higher commission.


    Since November 2016, the Swiss Federal Railways have been offering, in conjunction
    with the company SweePay, the purchase of bitcoins from their train ticket machines,
    thus creating the largest bitcoin distribution network in the world.

    '
