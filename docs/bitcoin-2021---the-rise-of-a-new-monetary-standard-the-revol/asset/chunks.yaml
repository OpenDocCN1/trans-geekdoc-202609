    # Chapter 3 - The Idea behind Bitcoin


    Bitcoin''s theoretical roots lie in the Austrian school of economics and its critique
    of the current monetary system and interventions by governments and other entities,
    which this school of thought says exacerbates business cycles and massive inflation.
    One of the topics that the Austrian School of Economics, led by Eugen von Böhm-Bawerk,
    Ludwig von Mises and Friedrich A. Hayek, focused on is the business cycle. In
    fact, according to the Austrian theory, business cycles are the consequence of
    inevitable monetary interventions in the market, whereby an excessive expansion
    of bank credit leads to an increase in the stock of bank credit in a fractional
    reserve system, which in turn leads to artificially low interest rates. In this
    situation, entrepreneurs, guided by distorted interest rate signals, embark on
    over-ambitious investment projects that do not match the preferences of consumers
    at that time for intertemporal consumption (that is, i.e. their short-term decisions
    and future consumption). Sooner or later, this generalized imbalance can no longer
    last and leads to a recession, during which companies must liquidate failed investment
    projects and restructure their production structures according to the intertemporal
    preferences of consumers. As a result, many economists in Austrian schools are
    calling for the abandonment of this process by abolishing the fractional reserve
    banking system and reverting to a currency based on the gold standard, which cannot
    be easily manipulated by authorities. A related area in which Austrian economists
    have been very active is monetary theory. Friedrich A. Hayek is one of the best
    known names in this field. He wrote some very influential publications, such as
    Denationalization of Money (1976), in which he postulated that governments should
    not have a monopoly on issuing money. On the contrary, he suggests that private
    banks should be allowed to issue non-interest bearing certificates, based on their
    own trademarks. These certificates (i.e. currencies) should be open to competition
    and would be traded at varying exchange rates. Any currency that can guarantee
    stable purchasing power would eliminate other less stable currencies from the
    market. The result of this process of competition and profit maximization would
    be a highly efficient monetary system in which only stable currencies would coexist.
    The following ideas are generally shared by Bitcoin supporters.


    ● They see Bitcoin as a good starting point to end the monopoly of central banks
    in issuing money.

    ● They strongly criticize the current fractional reserve banking system, which
    allows banks to extend their credit supply beyond their actual reserves and, at
    the same time, allows depositors to withdraw their funds to their checking accounts
    at any time.


    ## Specificity of Bitcoin


    We must distinguish between bitcoin, cryptocurrency and on the other hand Bitcoin,
    the payment system in this currency. In these two aspects, Bitcoin differs from
    pre-existing systems on some important points. First of all, unlike other monetary
    currencies, Bitcoin is not the embodiment of the authority of any state, bank,
    or business. The value of bitcoin is determined in a fully floating fashion by
    the economic use that is made of it and by the foreign exchange market. The rules
    organizing the monetary issue are determined solely by the free computer code
    of the Bitcoin software. Furthermore, as a payment system, Bitcoin is distinguished
    by the fact that its operation does not require the use of a centralized infrastructure
    keeping accounts of the amounts held in order to ensure transactions. The role
    of guarantee and verification exists, but is assigned approximately every ten
    minutes to a computer of the network chosen at random according to its power.
    Bitcoin is based on a cryptographic protocol whose main purpose is, on the one
    hand, to resolve the so-called double payment problem, which had hitherto prevented
    the emergence of such a type of currency, and, on the other hand, to “prohibit”
    the falsification of stakeholder identifiers and the value of bitcoin stock in
    electronic wallets identified by a given address.


    ## Monetary principles behind Bitcoin


    From a monetary point of view, bitcoin is distinguished from other currencies
    by the major fact that the monetary aggregate is not designed to adapt to the
    production of wealth. The total amount and the emission rate of the units are
    entered explicitly in the computer code of the software, according to a mathematical
    rule of the geometric series type. Bitcoins are issued slowly and steadily, decreasingly,
    reaching a maximum amount of 21 million around the year 2140. All fiat currencies
    experience inflation, from low to high depending on the policies of their central
    bank. Conversely, bitcoin currency is likely to end up experiencing deflation,
    as the maximum amount of bitcoins that can be created is set in the software in
    advance at 21 million. In addition to this, bitcoins lost by users will never
    be replaced. This is why the Bitcoin project is considered by the community of
    its creators as an original experiment in economic terms, constituting a kind
    of test of the monetary theses of the Austrian school of economics. In fact, Friedrich
    Hayek, Nobel laureate in economics, in 1976 called for the reestablishment of
    monetary free will in his book “For a true competition of currencies”. The success
    or failure of Bitcoin is difficult to predict, but it is impossible to say it
    has not done well so far.


    ## Scalability of the protocol


    On July 14th, 2010, shortly after the launch of the Bitcoin system, Satoshi Nakamoto
    created a limit of 1MB for each newly created block every ten minutes on the bitcoin
    blockchain. At that time, transactions were free because few in number, and developers
    had a legitimate concern that attackers could "spam" the transaction network,
    arbitrarily creating huge blocks and permanently inflating the size of the blockchain.
    This limit was intended to prevent this kind of attack until a better solution
    could be put in place. Satoshi Nakamoto had proposed a solution that would involve
    increasing the block size to certain block heights, effectively increasing the
    limit to a predetermined rate similar to how new bitcoins are issued. The scalability
    of the Bitcoin system has been a constant source of debate in the community since
    the introduction of this block size limit. This 1 MB limit, initially thought
    to limit the number of transactions per second to seven, posed no problem at a
    time when the actual number of transactions hardly exceeded 2.3 transactions per
    second (2010). So, seven transactions per second was three times the volume of
    bitcoin''s busiest day at that time, leaving developers years to find a better
    solution. In addition to this, the protocol provided for the introduction of transaction
    fees over time, which would make this type of attack more costly and ineffective.


    ### Saturation of transaction integration capacity


    From 2014, the success of the Bitcoin system led to a continuous rise in the number
    of transactions which eventually hit the 1MB limit in 2016. A developer, Gavin
    Andresen, initially proposed 20MB blocks, but the increase was deemed too aggressive
    by the community. Another proposal, BIP10191, offered to increase the block size
    by 40% per year from 8MB which led to the creation of a new cryptocurrency, different
    from bitcoin, called Bitcoin XT92. Other proposals have been made like BIP10093
    with a 2MB block which leads to the Bitcoin Classic cryptocurrency and more aggressive
    "emerging consensus" approaches that allow users to "vote" on the best block size
    at a time given through Bitcoin Unlimited. Other members of the community preferred
    not to favor an increase in the block size, but to change the protocol itself
    so that more transactions are integrated in a block by reducing their size or
    increasing the creation frequency of new blocks. When the number of transactions
    eventually reached the block size limit, the pool of pending transactions became
    full. The only way to get a given transaction into the blockchain faster for a
    user was to increase transaction fees, which reached nearly $5 at the end of 2016.
    This made Bitcoin uncompetitive against existing services like Western Union or
    Paypal on the strict basis of speed and cost.


    ### The New York Agreement


    The stalled debate on scalability weakened the Bitcoin Core system and led to
    the growing success of the vote in favor of the Bitcoin Unlimited movement, especially
    among miners, in large part due to frustration at the lack of upgrading solutions.
    The approach of the development team, called segwit (segregated witness), of not
    increasing the block size limit, but differently partitioning the digital signatures
    of transactions into "extension block", was not working to achieve sufficient
    consensus. A compromise was found in an industry consensus in 2017 called Segwit2x97,
    which combined the segregated witness proposal with a block size increase to 2MB.
    This proposal was implemented on August 1st, 2017 for segregated witnesses and
    the block size increase came into effect in November 2017 at block 494,784. It
    was a major update to the Bitcoin system. Nonetheless, the scalability debate
    was still heated and a breakaway group unilaterally increased the block size to
    8MB while rejecting the Segwit proposal on August 1, 2017. This decision led to
    the emergence of a new cryptocurrency, called Bitcoin Cash. Bitcoin XT (created
    in August 2015), Bitcoin Unlimited (created in January 2016), Bitcoin Classic
    (created in February 2016 before being discontinued in November 2017), Bitcoin
    Cash (created in August 2017) and Bitcoin Gold (created in October 2017) are alternative
    cryptocurrencies to Bitcoin (also called Bitcoin Core) that try to solve the problem
    of transaction fees.


    ## Distribution of wealth


    Bitcoins are concentrated in the hands of a few whales. The distribution of “wealth”
    is such that 2,100 addresses hold 40.2% of the total. However this kind of information
    is not very useful because some of these addresses are dead (keys lost when a
    unit of bitcoin was not worth 1 cent). Our opinion is that now that we are seeing
    institutions jumping on board, we will have much more concentration in terms of
    the number of bitcoins owned by whales. As the price rises, it will be more and
    more difficult for the average Joe to have ownership of one full bitcoin.

    '
