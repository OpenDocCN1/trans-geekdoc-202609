    \ growth in the number of merchants accepting bitcoin in 2014, the cryptocurrency\
    \ is not very established in the retail trade, but continues to gain a foothold\
    \ in trade. Use Between January 2009 and March 2010, using bitcoin was a hobby\
    \ among crypto enthusiasts, and bitcoin had no real value. However, in April 2010,\
