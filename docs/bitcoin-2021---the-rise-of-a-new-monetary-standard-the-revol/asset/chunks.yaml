    # 第 4 章 - 比特币如何工作


    比特币并不独立于比特币支付系统存在，该系统允许从一个账户向另一个账户进行交易，这要归功于称为钱包的软件，而权威性由称为矿工的验证软件来确保。所有交易的数据构成一个私法下的公共账本，由于其结构被称为“区块链”，代理人通过在比特币系统的区块链中记录其交易来使用比特币。比特币系统是基于计算机的。换句话说，比特币系统位于互联网上。下载并安装适当的软件，您可以通过与您选择的硬件（包括智能手机或计算机）交互来成为比特币用户。要支付或接收比特币，用户必须连接到系统。此连接提供两个功能：创建任意数量的账户，以及轻松执行交易，该交易包括将比特币从自己的账户转移到第三方的账户。比特币系统的基本功能在于交易，这些交易由有资格的计算机进行有效性检查，并不可撤销地记录在公共登记簿中。这个公共账本或区块链可以由任何人在任何地方查看，只要他们有互联网连接。在查询过程中，无法进行任何更改。


    ## 比特币交易机制


    比特币交易需要两个基本步骤。首先，专用网络节点（“矿工”）通过将最近完成的交易分组并添加包含日期和时间、校验和（“哈希”）的标题来创建新块，该校验和还将作为块的唯一标识符，以及前一个块的标识符。其次，在检查此新块中包含的所有交易的有效性及其与已记录交易的一致性后，每个矿工将其添加到其本地版本的登记簿（或区块链）中。公共登记簿被多次复制。然后可以通过查看网络中管理区块链副本的所有节点来读取所有交易的完整历史记录。副本可以揭示文件之间可能存在的差异，以防出现分歧。在这种情况下，这些副本之间的任何差异必须由软件解决。如果你仔细想想，交易包括借记某些账户以贷记其他账户。它们由输入和输出组成。每个输出包括一个金额和被贷记地址的公钥，或者更一般地说，是一个程序（脚本），用于授权或不授权将此输出的金额转移到另一笔交易。每个输入指定先前交易的一个输出，并有一个程序（脚本），为出现在该输出中的脚本提供所需的数据。输出值的总和必须小于或等于输入值的总和。差额构成矿工的报酬。创建交易时，将执行每个条目的脚本；首先执行条目本身的脚本，然后执行条目引用的较早退出的脚本。只有当所有输入的结果均为“真”时，交易才会提交。这些脚本是用中本聪设计的内部语言编写的。这种语言故意极简且非图灵完备，以防止系统陷入无限循环。使用脚本应使软件能够轻松适应未来的发展，并支持多签名交易或智能合约等高级功能。节点发出的交易会广播到其邻居节点。这些邻居节点验证接收到的交易，并逐渐将其整合到本地池中，然后再传递给自己的邻居节点。有效的交易就这样逐步广播到网络的所有节点，并在每个步骤中进行新的检查。在将交易永久记录在区块链之前，网络会多次执行一组检查，特别是检查输入引用的输出是否存在且尚未被使用、交易发起者是否确实是这些输出中贷记地址的所有者，以及交易输出中出现的金额总和是否远小于或等于输入引用的输出金额总和。这有点复杂，但如果你多读几遍最后这句话，你就会更好地理解交易过程中实际发生的情况。将交易记录在区块链中的效果是禁止将来引用该交易输入所指定的输出，从而防止这些输出金额的双重支出，这将相当于以未经授权的方式从零开始创建比特币。唯一允许从零开始创建比特币的方式是通过一种称为
    Coinbase（非交易所）的特殊交易，该交易插入链中每个块的开头，以支付插入该块的矿工。交易会被网络即时考虑，并在大约 10 分钟后首次确认。每个新的确认都会加强交易登记簿中交易的有效性。


    ## 比特币地址


    每个用户可以拥有任意数量的地址，这些地址可以通过钱包创建。每个比特币地址都与一个公钥和私钥对相关联。地址等于其公钥的 160 位（20 字节）加密哈希。比特币地址还有一个标识版本号（默认为
    0）的前缀和一个四字节校验和。总的来说，比特币地址占用 25 字节。地址以 ASCII 格式表示，得益于一种专用的 58 个字母数字字符编码：大小写数字和字母，但字母和数字
    l、I、0 和 O 除外，中本聪因其在某些字体中的相似性而将其排除。下面是作为示例的第一个比特币地址，它接收了比特币。`1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa106`。要使用现有交易输出中记入比特币地址的金额，用户必须在交易的输入中使用相应地址的私钥对交易进行签名。网络使用与记入地址相关联的公钥，利用非对称加密技术检查此签名的有效性。该操作对交易的每个输入重复进行。


    ## 钱包


    每个用户的钱包包含其个人数据，包括其每个账户的地址、公钥和私钥。它还可以包含从区块链构建的用户特定信息，例如可用交易输出列表或账户余额。钱包软件提供创建账户、查询账户、构建和发送交易的功能。所有类型的设备（包括智能手机）都有多种钱包软件可供选择。它们在辅助功能的范围和用户界面方面有所不同。用户钱包中包含的信息至关重要，必须严格防止任何入侵。如果账户的私钥丢失，用户将无法再访问资助该账户的交易，也无法从该账户创建新交易。他的比特币将永久丢失，并将永远留在数据库中而无法更改地址。2013
    年，一名用户不小心扔掉了包含其私钥的硬盘，损失了 7,500 个比特币，当时价值 750 万美元。另一名用户发现账户的私钥，将允许该用户窃取合法账户持有人的身份，并花费其中的比特币，这相当于比特币被盗。


    ## 挖矿过程


    挖矿操作包括将交易组装成“块”，并添加一个标题，该标题特别指示块的大小、记录的交易数量、日期和时间、校验和（“哈希”），该校验和禁止对块进行任何修改，并也作为块的唯一标识符，以及前一个块的标识符。矿工在其构建的块中包含一笔特殊交易，该交易为他们记入为此目的创建的一定数量的比特币，并包含特定的交易费用。但是，只有当块被其他节点最终接受到区块链中时，这笔报酬才会生效。正是这种货币创造解释了“挖矿”这一术语的使用，类比于金矿开采。一个块可以包含任意数量的交易，通常在
    1000 到 2000 之间，但块大小不能超过 1 兆字节（针对比特币核心系统）。在块中，交易以默克尔树的形式存储。块的校验和（或指纹）是通过对以下组件组成的六元组应用两次
    SHA-256 哈希来计算的。● 软件版本号；● 前一个块标题的指纹；● 块交易树的根（它本身是所有块交易的间接指纹）；● 时间戳（自 1970 年 1 月
    1 日以来的秒数）；● “随机数”。由于要求校验和小于某个值（由以一定数量的零开头的二进制表示体现），因此计算此指纹被故意设计得困难。为此，指纹包含一个任意的
    32 位数字，称为“随机数”。即使知道某些随机数对应的哈希值，哈希也使得在不重新运行算法的情况下无法确定新随机数的哈希值。因此，我们只能通过多次尝试来找到满足指纹值约束要求的适当随机数。对于给定的随机数值，计算出小于难度的指纹的概率非常低，因此在实现之前必须进行许多尝试。在
    2014 年至 2016 年间，每个矿工在每次创建块之间必须测试的随机数平均数量从 10 亿增加到 2000 亿。此计算包括从不同数据中多次执行相同的计算，因此非常适合并行计算。难度每
    2016 个块重新调整一次，以考虑网络的实际计算能力，并平均每 10 分钟添加一个块，这相当于说，网络上最强大的计算机或计算机组计算有效指纹的可能持续时间为
    10 分钟。这种工作量证明和通过指纹链接块的系统使得区块链的任何更改几乎不可能（51% 攻击除外）。希望修改给定块中交易的攻击者将被迫重新计算其校验和以及所有后续块的校验和。由于难度随时间增加，修改后的交易之后的块数量（其确认程度）也随之增加，进行此类修改所需的时间会非常迅速地增加。当矿工构建了一个校验和满足难度条件的有效块时，它会将其广播到邻近节点，这些节点在检查其有效性后再次转发。挖矿工作的报酬以比特币支付。该支付称为块奖励。当前块奖励为
    6.25 个比特币。每 210,000 个块，该奖励减半。有效块就这样逐步广播到网络的所有节点，不是在事先检查后无法修改，而是在无法修改的情况下广播。从标题中包含的随机数，可以快速轻松地检查块的有效性（可以与数独游戏做一个简单的类比：解决它很困难，需要时间和人工计算，但一旦找到解决方案，验证就非常容易）。


    ## 环境困境


    挖矿是一项经常因其能源消耗的所谓环境足迹而受到批评的活动。然而，一些观察人士通过指出“经典”货币网络消耗的能源要多得多（通过数百万台取款机或经典货币系统正常运行所需的基础设施，例如数据中心）来减轻批评。大多数比特币矿工使用可再生能源，因为在有利于挖矿的世界地区（低温、水坝、地热能等），可再生能源更便宜。


    ## 电力消耗估计


    由于挖矿活动的去中心化，比特币挖矿的电力消耗难以评估。媒体最常引用的数据来自一位荷兰金融分析师创建的“Digiconomist”网站。根据他的估计，该估计基于挖矿收入和成本之间经济平衡的假设，挖矿造成的全球电力消耗将为每年
    71.1 太瓦时（1 太瓦时（TWh）= 10 亿千瓦时（kWh））。这将占全球电力消耗的约 0.32%。2018 年每天只有约 20 万笔交易，2018
    年 7 月 1 日比特币的电力消耗约为每笔交易 1,000 千瓦时。相比之下，Visa 在 2017 年消耗了 0.19 太瓦时/年，用于管理 1110 亿美元的交易（每天约
    3 亿笔交易），即每笔交易 0.0017 千瓦时。比特币每笔交易消耗的能源大约是 Visa 的 600,000 倍。但是请注意，挖矿消耗与交易数量无关。然而，“Digiconomist”网站的估计值受到质疑，并被认为被夸大了。事实上，根据计算机安全工程师
    Marc Bevand 的说法，它们将比特币矿工的电力消耗高估了 1.5 到 2.8 倍（可能是 2.2 倍），这将使总电力消耗降至每年 32.3 太瓦时，即每笔交易
    424 千瓦时（相当于 1000 瓦电暖器运行近 18 天的消耗量）。这些估计由于所需的假设而存在不确定性，但可以根据可验证的数据计算比特币网络的最小电力消耗。●
    每秒哈希数：2018 年 7 月 1 日为 37.1 × 10¹⁸ H/s；● 市场上最高效机器（比特大陆的 Antminer S9）的功率和哈希能力：1323
    W 对应 13.5 × 10¹² H/s。因此可以断言，2018 年 7 月 1 日比特币网络至少有 280 万台挖矿机，其电力消耗至少等于每年 32.2
    太瓦时。保障比特币网络的实体数量不断增加，这增加了比特币的价值。根据美国银行 2021 年 3 月发布的一份报告，2020 年底比特币网络消耗了全球 0.4%
    的电力，大约相当于荷兰的用电量，并排放的温室气体相当于美国航空公司燃烧的石油。两年内，这些排放量增加了 4000 万吨，相当于 830 万辆汽车，达到 6000
    万吨。全球四分之三的挖矿产能位于中国；27% 的中国矿工位于四川，这是一个拥有强大低碳水电生产的省份，但 43% 位于新疆，那里 80% 的电力来自燃煤电厂。


    ## 为什么电力消耗如此重要？


    比特币非常高的能源消耗与新的区块挖矿系统有关，该系统旨在在没有中央权威的情况下保护系统免受欺诈。安全性基于一个数学问题，其解决方案难以找到，且求解过程本身成本高昂。为了有机会将下一个区块添加到链中，矿工必须确实大量投资于服务器农场，以拥有强大的计算能力。这些农场使用大量电力为服务器供电和冷却。为了在区块链上记录新区块，矿工必须解决提交给所有竞争者的数学问题，最先找到解决方案的人将进行记录并获得比特币费用。由于解决方案只能通过试错法找到，因此能够进行最大尝试次数的矿工获胜的机会最大。问题的难度会进行调整，以便其求解所需的计算时间大约为
    10 分钟。电力消耗的规模与计算强度以及这些计算由大量矿工同时进行的事实有关。它与比特币的价格有关，因为价格越高，报酬就越多，矿工就越多。这让人想起亨利·福特在二十世纪初的预测：“一种能源货币将取代黄金并结束战争”。根据伊索-电信学院的
    Fabrice Flipo 和 Michel Berne 的说法，加密货币的普及可能导致能源消耗超过法国电力消耗的八倍，即美国电力消耗的两倍，因为它们的安全性和我们对它们的信任基于一个数学问题，其答案难以找到，且其求解本质上成本高昂。设备优化和技术进步将使
    2021 年的电力消耗仅为 417 兆瓦，但这仍然需要近 5,500 千瓦时来生产一个比特币，相当于美国家庭一半的年用电量。因此，里昂/圣埃蒂安分析与经济理论小组的研究员
    Nicolas Houy 表示，“大量资金完全可以由少数矿工管理”。


    ## 矿工群体


    挖矿的难度导致矿工组建矿池，以结合其计算资源并更快地构建新区块。构建每个区块对应的报酬随后按比例在成员之间分配，扣除费用后，这使得他们的收入更加平稳且不确定性降低。2016
    年，大约十个这样的合作社提供了 95% 的区块。它们主要位于中国（占比特币网络大部分哈希算力），但也位于捷克共和国和格鲁吉亚。挖矿活动的报酬导致了越来越专业化技术的发展。最高效的硬件使用集成电路，其性能优于通用处理器，同时耗电更少。截至
    2015 年，不使用专门为挖矿设计的设备的矿工，即使加入矿池，也很难覆盖其电力和设备成本。


    '
