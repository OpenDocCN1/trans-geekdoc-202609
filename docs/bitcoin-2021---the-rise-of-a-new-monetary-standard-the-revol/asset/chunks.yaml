    # Chapter 26 - The Stock to Flow Model


    In this chapter we are going to take a look at a price prediction model called
    stock to flow. In simple terms, the Stock to Flow model (`SF` or `S2F`) is a way
    to measure the abundance of a particular resource. The Stock to Flow ratio is
    the quantity of resources present in the reserves divided by the quantity that
    is produced annually. The Stock to Flow model is generally applied to natural
    resources.


    Let''s take the example of gold. Although estimates may vary, the World Gold Council
    estimates that around 190,000 tons of gold have been mined in history. This quantity
    (that is, the total supply) is what we can call the stock. In addition, approximately
    2,500 to 3,200 tons of gold are mined each year. This quantity is what we call
    the flow. We can calculate the Stock to Flow ratio using these two parameters.


    But what does it mean in real life terms? Essentially it shows how many new units
    of a given resource enter the market each year, in relation to the total supply.
    The higher the Stock to Flow ratio, the less new supply enters the market relative
    to the total. Therefore, an asset with a high Stock to Flow ratio should, in theory,
    hold its value effectively over the long term. Conversely, consumer goods and
    industrial products will generally have a low Stock to Flow ratio. For what reason?
    Since their value typically comes from their destruction or consumption, the stocks
    are usually only sufficient to cover the demand. These assets don''t necessarily
    have a high value as possessions, so they tend to perform poorly as an investment
    asset.


    In some exceptional cases, the price could rise rapidly if a shortage is foreseen
    in the future. But other than that, production remains in step with demand. It
    is important to emphasize that scarcity alone does not necessarily mean that a
    resource is precious. Gold, for example, is not that rare - after all, we have
    190,000 tons available! The Stock to Flow report suggests that it is valuable
    because the annual production compared to the existing supply is relatively small
    and constant.


    ## The Stock to Flow ratio of gold


    Historically, gold has had the highest Stock to Flow ratio of all precious metals.
    But what is the exact number? Going back to our previous example - divide the
    total supply of 190,000 tons by 3,200, and you will get a Stock to Flow ratio
    of ~ 59. This tells us that, at the current rate of production, it would take
    around 59 years to mine 190,000 tons of gold.


    However, it is worth bearing in mind that the estimates of the amount of new gold
    that will be mined each year are just that - estimates. If we increase the annual
    production (flow) to 3,500, the Stock to Flow ratio drops to ~ 54. While we''re
    at it, why not calculate the total value of all the gold that has been mined in
    history? If we take a price of around $ 1500 for every ounce of gold, the total
    value of all gold reaches around $9 trillion. That said it sounds like a lot,
    but if we combined all this gold into a cube we could make it fit on a single
    soccer field!


    For comparison, the highest total value of the Bitcoin network hit $1 trillion
    at the beginning of 2021.


    ## Stock to Flow and Bitcoin


    By now you should know how Bitcoin works. Therefore, it won''t be hard for you
    to understand why it might make sense to apply the Stock to Flow model to it.
    Essentially, this model treats bitcoins as limited resources, like gold or silver.
    Gold and silver are often referred to as resources that act as a store of value.
    In theory, they should hold their long-term value due to their relative scarcity
    and low flow. Furthermore, it is somewhat difficult to significantly increase
    the supply in a short period of time.


    According to supporters of the Stock to Flow model, Bitcoin is a similar asset.
    It is scarce, relatively expensive to produce, and its maximum supply is limited
    to 21 million coins. Furthermore, the issuance of supply of Bitcoin is defined
    at the protocol level, which makes the flow completely predictable. You should
    have already familiarized with the concept of halving, where the amount of new
    supply entering the system is halved every 210,000 blocks (roughly four years).


    ![](image_rsrc1U7.jpg)


    According to the proponents of this model, the combination of these properties
    creates a scarce digital asset with deeply valid characteristics for maintaining
    long-term value. Furthermore, they assume that there is a statistically significant
    relationship between the Stock to Flow and the market value. According to the
    model''s projections, Bitcoin''s price is expected to go through a noticeable
    increase over time due to its consistently low Stock to Flow ratio. Among others,
    the application of the Stock to Flow model to Bitcoin is often attributed to PlanB
    and its article “Modeling Bitcoin''s Value with Scarcity”.


    ## Bitcoin''s Stock to Flow ratio


    The current circulating supply of Bitcoin is around 18 million bitcoins, while
    the new supply is around 0.7 million per year. At the time of writing, Bitcoin''s
    Stock to Flow ratio is hovering around 50. In the image below, you can see the
    historical relationship between the 365-day moving average of Bitcoin''s Stock
    to Flow and its price. We have also indicated the dates of the Bitcoin halving
    on the vertical axis.


    ![](image_rsrc1U8.jpg)


    ## Limits of the Stock to Flow model


    While Stock to Flow is an interesting model for measuring scarcity, it doesn''t
    explain all parts of the picture. The models depend entirely on their assumptions.
    First of all, Stock to Flow is based on the assumption that scarcity, as measured
    by the model, should bring value. According to critics of the Stock to Flow, this
    model fails if Bitcoin has no other useful quality besides supply shortages. Gold''s
    scarcity, predictable flow and global liquidity have made it a relatively stable
    store of value relative to fiat currencies, which are subject to devaluation.
    According to this model, Bitcoin''s volatility is also expected to decrease over
    time. This is confirmed by historical data provided by Coinmetrics.


    ![](image_rsrc1U9.jpg)


    The valuation of an asset requires consideration of its volatility. If volatility
    is to some extent predictable, the valuation model may be more reliable. However,
    Bitcoin is famous for its large price swings. While volatility may decrease at
    the macro level, Bitcoin has been valued in a free market since its inception.
    This means that the price is mostly self-adjusted on the free market by users,
    traders and speculators. Combining this with relatively low liquidity, Bitcoin
    is likely to be exposed to sudden spikes in volatility more than any other asset.
    Hence, the model may fail to consider this either.


    Other external factors, such as economic Black Swan events, could undermine this
    model. However, it should be noted that this possibility essentially applies to
    any model that tries to predict the price of an asset based on historical data.
    A Black Swan event, by definition, has a surprise factor. Historical data cannot
    take into account unknown events.


    Our opinion is that the Stock to Flow model has been incredibly accurate so far
    and that it will be able to predict future price movements for the foreseeable
    future.

    '
  trans: '


    # 第 26 章 - 存量流量模型


    在本章中，我们将探讨一种名为存量流量（Stock to Flow）的价格预测模型。简单来说，存量流量模型（`SF` 或 `S2F`）是一种衡量特定资源丰富程度的方法。存量流量比率是储备中资源数量除以每年产量。存量流量模型通常应用于自然资源。


    让我们以黄金为例。虽然估算可能有所不同，但世界黄金协会估计历史上已开采约 190,000 吨黄金。这个数量（即总供应量）就是我们所说的存量。此外，每年大约开采
    2,500 至 3,200 吨黄金。这个数量就是我们所说的流量。我们可以利用这两个参数计算存量流量比率。


    但在实际生活中，它意味着什么呢？本质上，它显示每年进入市场的给定资源的新单位数量，与总供应量相比。存量流量比率越高，相对于总供应量，进入市场的新供应量就越少。因此，理论上，存量流量比率高的资产应该能在长期内有效保持其价值。相反，消费品和工业产品通常会有较低的存量流量比率。为什么呢？因为它们的价值通常来自于其销毁或消耗，存量通常仅足以满足需求。这些资产作为持有物不一定具有高价值，因此作为投资资产往往表现不佳。


    在某些特殊情况下，如果预见到未来会出现短缺，价格可能会迅速上涨。但除此之外，生产仍与需求保持同步。需要强调的是，稀缺性本身并不一定意味着资源是珍贵的。例如，黄金并不那么稀有
    - 毕竟，我们有 190,000 吨可用！存量流量报告表明，黄金之所以有价值，是因为与现有供应量相比，年产量相对较小且恒定。


    ## 黄金的存量流量比率


    从历史上看，黄金在所有贵金属中拥有最高的存量流量比率。但确切数字是多少呢？回到我们之前的示例 - 将 190,000 吨的总供应量除以 3,200，你将得到约
    59 的存量流量比率。这告诉我们，按当前生产速率，开采 190,000 吨黄金大约需要 59 年。


    然而，值得注意的是，每年将被开采的新黄金量的估算仅仅是估算。如果我们将年产量（流量）增加到 3,500，存量流量比率将下降到约 54。既然如此，为什么不计算历史上所有开采黄金的总价值呢？如果我们按每盎司黄金约
    1500 美元的价格计算，所有黄金的总价值将达到约 9 万亿美元。话虽如此，听起来很多，但如果我们将所有这些黄金合并成一个立方体，它可以放在一个足球场上！


    作为比较，比特币网络的最高总价值在 2021 年初达到 1 万亿美元。


    ## 存量流量与比特币


    到现在，你应该已经了解比特币的工作原理。因此，你不会觉得难以理解为什么将存量流量模型应用于比特币是有意义的。本质上，该模型将比特币视为有限资源，如黄金或白银。黄金和白银常被称为作为价值储存手段的资源。理论上，由于其相对稀缺性和低流量，它们应该能保持长期价值。此外，在短时间内显著增加供应量有些困难。


    根据存量流量模型的支持者，比特币是一种类似的资产。它稀缺，生产成本相对较高，且其最大供应量限制为 2100 万枚。此外，比特币的供应发行在协议层面定义，这使得流量完全可预测。你应该已经熟悉减半的概念，即每
    210,000 个区块（大约四年）进入系统的新供应量减半。


    ![](img/image_rsrc1U7.jpg)


    根据该模型的拥护者，这些属性的组合创造了一种稀缺的数字资产，具有维持长期价值的深层有效特征。此外，他们假设存量流量与市场价值之间存在统计学上显著的关系。根据该模型的预测，由于比特币始终保持较低的存量流量比率，其价格预计会随时间显著增加。其中，将存量流量模型应用于比特币通常归功于
    PlanB 及其文章“用稀缺性建模比特币价值”。


    ## 比特币的存量流量比率


    比特币当前的流通供应量约为 1800 万枚比特币，而新供应量约为每年 0.7 百万枚。在撰写本文时，比特币的存量流量比率在 50 左右波动。在下图中，您可以看到比特币存量流量
    365 天移动平均值与其价格之间的历史关系。我们还在垂直轴上标明了比特币减半的日期。


    ![](img/image_rsrc1U8.jpg)


    ## 存量流量模型的局限性


    虽然存量流量是衡量稀缺性的一个有趣模型，但它并不能解释图景的所有部分。该模型完全依赖于其假设。首先，存量流量基于这样一个假设：由模型衡量的稀缺性应该带来价值。根据存量流量模型的批评者，如果比特币除了供应短缺之外没有其他有用特性，该模型就会失效。黄金的稀缺性、可预测的流量和全球流动性使其相对于法定货币（后者面临贬值）成为相对稳定的价值储存手段。根据该模型，比特币的波动性预计也会随时间降低。这由
    Coinmetrics 提供的历史数据所证实。


    ![](img/image_rsrc1U9.jpg)


    资产估值需要考虑其波动性。如果波动性在某种程度上是可预测的，估值模型可能更可靠。然而，比特币以其巨大的价格波动而闻名。虽然波动性在宏观层面可能会降低，但比特币自诞生以来就在自由市场中估值。这意味着价格主要由用户、交易者和投机者在自由市场上自我调整。将其与相对较低的流动性相结合，比特币可能比任何其他资产更容易暴露于突发的波动性激增。因此，该模型可能也无法考虑这一点。


    其他外部因素，例如经济黑天鹅事件，可能会破坏该模型。然而，应该注意的是，这种可能性本质上适用于任何试图基于历史数据预测资产价格的模型。黑天鹅事件，按定义，具有惊喜因素。历史数据无法考虑未知事件。


    我们的观点是，存量流量模型迄今为止非常准确，并且在可预见的未来将能够预测未来的价格走势。


    '
