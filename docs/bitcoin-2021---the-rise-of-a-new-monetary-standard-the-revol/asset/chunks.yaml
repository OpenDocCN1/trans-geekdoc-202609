    # 第 12 章 - 购买比特币


    虚拟货币的交易量不断增加，这从用户对加密货币交易所的兴趣中可见一斑。尽管比特币在全球最为知名，但这并不意味着它是唯一可供购买或出售的加密货币。选择最佳的加密货币交易所至关重要，尤其是考虑到投资资本的总价值。事实上，加密货币投资存在风险，其中之一正是交易所的选择。在列出购买和出售加密货币的最佳交易所网站之前，我们将详细解释什么是交易所以及其运作方式。因此，我们将关注当今市场上最有利的解决方案，这些方案适用于经验丰富的投资者以及刚刚进入数字货币领域的用户。


    ## 加密货币交易所


    加密货币交易所是可以交换代币的平台。最常见的交易是美元或欧元与相应价值的虚拟货币之间的交换。例如，如果您想购买一个 BTC，您将需要 58,000 美元（单个
    BTC 的当前价值）加上交易所的佣金价值。交易完成后，新获得的加密货币必须存入钱包（电子钱包）。钱包可以比作银行账户，但与之不同的是，您只能提取、存入或发送部分或全部加密货币到另一个数字钱包或交易所。


    ## 钱包


    每个钱包都分配有一个特定地址，可以将其比作传统支票账户的银行账户号码代码。此外，首次登录电子钱包还需要一个密钥。然后您可以设置登录密码并加密数据。


    钱包分为三种类型：


    - **软件钱包**。下载到计算机或移动设备上的程序。它们通常是保证更高安全性的钱包之一。

    - **在线钱包**。可以通过互联网使用私钥访问的数字钱包，大多数由交易所管理。在三种类型中，它是最不安全的。

    - **硬件钱包**。一种物理设备（通常是 USB 闪存盘），只有在连接到第二个设备时才能访问钱包。在所有类型中，它提供了最大的安全性。


    我们将在专门的章节中详细讨论加密货币钱包。


    由于存在不同的钱包，也存在不同类型的交易所：


    - **法币兑换加密货币交易所**。它们允许您将法币（例如美元或欧元）兑换为虚拟货币。

    - **集中式管理交易所**。由第三方管理的平台。积极方面包括交易速度快，以及与去中心化加密货币交易所要求的佣金相比较低的佣金。然而，缺点之一是更容易遇到诈骗的风险。

    - **去中心化管理交易所**。流程是自动化的，因为一切都委托给区块链技术。因此，这种类型的交易所在完全安全的环境下运行。然而，交易速度也较慢。此外，与其他交易所的供应相比，可用的加密货币种类仍然较少。


    最后要强调的方面涉及向在交易所平台上操作的用户收取的佣金。大致来说，有四种不同的费用：


    - 存储费；

    - 提现费；

    - 吃单费；

    - 挂单费。


    通常，费用与每月交易量成反比。这意味着交易量越大，费用越低，而当交易量低时，费用往往会上升。因此，如果我们想要总结迄今表达的概念，选择一个交易所而不是另一个应该基于对三个重要方面的分析：


    - **安全性**。只要有可能，选择去中心化交易所平台将是最佳决定，但也事实是这是一个相当新的解决方案，存在上述限制（操作速度低和可交易的加密货币种类少）。

    - **策略**。在选择一个交易所而不是另一个之前，您应该已经制定了一个计划。在这方面，了解您是想针对法币兑换加密货币交易所，还是只存在虚拟货币的交易所非常重要。

    - **佣金**。分析未来将要进行的操作所需的成本对于做出最终选择非常重要，同时也要考虑其他两个因素。


    ## 最佳加密货币交易所


    最佳加密货币交易所列表包括长期存在的平台，如 Coinbase Pro、Kraken 和 Bitstamp，以及更现代的 Binance。下面我们对每个交易平台进行简要介绍，列出优缺点。


    ### Binance


    Binance 是最大的国际加密货币交易所。它成立于 2017 年，在短时间内成功赢得了虚拟货币交易者的兴趣。Binance 最近还创建了自己的加密货币（Binance
    Coin，代码：BNB）。目前 BNB 在 CoinmarketCap 排名中位列前十，该排名由比特币和以太坊主导。


    直到最近，Binance 上的交易者只能用加密货币交换其他加密货币。然而，最近引入了用虚拟货币兑换法币的可能性。主要优势是有超过 130 种加密货币可供选择，且佣金约为
    0.1%。唯一的缺点是图形界面对初学者不够友好。事实上，我们发现刚开始接触加密货币的人很难在网站的众多可能性中导航。它是加密货币交易所中的法拉利：如果您是第一次购买比特币，不需要一辆法拉利。


    ### Wirex


    Wirex 是一个数字支付平台，也是英国持有 FCA 许可的电子货币机构，其使命明确：消除真实货币与虚拟货币之间的差异，使加密货币的使用更加便捷和普及。得益于创新的移动应用和新一代
    Wirex 多币种卡，用户可以购买、交换和持有广泛的法币和加密货币（包括 BTC、ETH、LTC、XRP、XLM、WXT、WAVES、DAI 和 NANO），并可在实体店消费。这一切都快速、安全且无佣金。


    拥有 Wirex 账户有许多优势，从无限访问加密货币交易的 OTC 汇率，到新一代奖励。


    #### 提供的服务和优势


    - **无佣金货币兑换**。用户可以在应用上即时免费兑换法币和加密货币，并享受有利的汇率。

    - **Wirex 多币种卡**。这允许用户在接受 Mastercard 和 Visa 的地方消费加密货币和法币，并参与世界上第一个加密货币返现计划（Cryptoback），每笔消费可获得高达
    2% 的返现。

    - **每月免费 ATM 取现高达 500 美元且无月费**。Wirex 提供的优势还包括免费账户设置和卡片发行，以及商店卡交易无佣金。此外，用户有机会通过银行转账无限制地为账户充值，每笔交易最高
    50,000 美元。


    #### 注册流程和验证


    要注册，您需要连接到网站或下载可在 App Store 和 Play Store 上免费获取的应用。注册程序快速简便：只需填写表格并点击确认邮件中收到的链接。验证过程只需几分钟。您需要上传文件以验证身份，验证通过后，设置密码以提高安全性。


    说到安全，为了保护用户数据免受可能的黑客攻击和隐私侵犯，Wirex 在服务器和网页浏览器之间的所有通信中都使用 SSL（安全套接层）技术，这保证了数据保护。此外，双重身份验证和
    BitGo 的多签名技术使得在未经所有相关方签名授权的情况下无法转账。最后，平台不保留支付卡号、到期日期或 CVV 代码。这是一款非常适合购买第一个比特币的应用，我们推荐它。


    ### Coinbase Pro


    Coinbase Pro 是世界上最知名的加密货币交易所。它位于旧金山，并且也出现在最长寿平台的排名中（Coinbase 的成立年份可追溯至 2012 年）。与其他交易所相比，Coinbase
    Pro 上可供交易的加密货币较少。更新后的列表包括比特币、比特币现金、以太坊、莱特币、EOS、恒星、以太坊经典、Ox 和稳定币 USD Coin (USDC)。应当注意的是，可以用虚拟货币兑换法币。在谈到
    Coinbase Pro 时，另一个需要考虑的重要方面是平台的易用性，这对于初次接触加密货币交易的人也同样适用。


    ### Kraken


    Kraken 成立于 2011 年，比 Coinbase 早一年。它之所以受欢迎，归功于其丰富的比特币法币兑换部分（用户可以在欧元、美元、英镑、日元等之间选择）。Kraken
    交易所目前支持 17 种加密货币。这些包括比特币、比特币现金、比特币 SV、以太坊、以太坊经典、瑞波币、莱特币、门罗币、EOS、ZCash、DASH、狗狗币和稳定币
    Tether。


    在 Kraken 的负面方面，我们可以提到一些由普通用户管理的账户被任意关闭，一些交易者对此颇具争议地谈论了该平台，该平台由 Jesse Powell 近十年前创立。加密货币的可用性大于
    Coinbase Pro，而能够兑换法币为虚拟货币的能力使其对新加密货币爱好者具有吸引力。然而，与其他同样知名的交易所相比操作速度较慢，以及鉴于关于某些账户被任意关闭的投诉而对安全性存在疑问，这使我们不敢向刚开始接触加密货币的人推荐它。


    ### Bitstamp


    Bitstamp 成立于与 Kraken 相同年份（2011 年），由非常年轻的 Nejc Kodrič 和 Damijan Merlak 创立。Kodrič
    出生于 1989 年，22 岁时创建了 Bitstamp。该交易所目前总部位于卢森堡，最初是作为 Mt. Gox 的欧洲替代方案而创建的，Mt. Gox 是历史悠久的加密货币交易所网站，于
    2014 年倒闭（在几个月前，它曾持有全球 70% 的比特币交易）。


    Bitstamp 的主要特点之一是佣金价值低于其他竞争对手。例如，国际银行转账的佣金为 0.05%，而提现的费用为 0.09%。然而，与 Coinbase
    Pro 类似，Bitstamp 不允许交易者交易大量加密货币。目前，允许交易比特币、比特币现金、莱特币、以太坊和瑞波币。


    ### Bittrex


    Bittrex 是与迄今提到的最知名平台并列的 5 大加密货币交易所之一。其总部位于美国西雅图，这使得 Bittrex 成为交易者最安全的交易所之一（在华盛顿州，安全是与虚拟货币管理相关的辩论中的核心主题）。在
    Bittrex 上，只允许加密货币之间的交换，因此对于那些希望在法币和虚拟货币之间交换的人来说，它不是理想的选择。佣金成本也应予以强调，其平均百分比达到 0.25%。基于其结构，Bittrex
    也是加密货币种类最多的平台。列表还包括比特币、以太坊、瑞波币和卡尔达诺。


    关于最佳加密货币交易所网站的介绍到此结束。我们提醒您，每天都有新的交易所诞生，但我们建议您只使用本章中提到的交易所。事实上，加密货币世界以大量诈骗而闻名。保持谨慎，一切都会好起来的。


