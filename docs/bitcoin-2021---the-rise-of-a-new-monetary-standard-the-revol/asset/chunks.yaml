    to hack your account. The first step in protecting yourself from phishing is to
    check if the emails are from the original source. If in doubt, you can contact
    the company directly to confirm that the email received was sent by them. Additionally,
    you can move your mouse over the email links (without clicking) to check if the
    URLs have misspellings, unusual characters, or other irregularities. Even if you
