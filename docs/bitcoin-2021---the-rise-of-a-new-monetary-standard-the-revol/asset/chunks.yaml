    to another, thanks to software called wallets, and the authority being ensured
    by software from verification called miners. The data of all transactions constitute
    a public ledger under private law called “blockchain'''' because of its structure,
    and an agent uses bitcoins by recording their transactions in the Bitcoin system''s
    blockchain. The Bitcoin system is computer-based. In other words, the Bitcoin
    system resides on the Internet. Downloading and installing the appropriate software
    allows you to become a Bitcoin user by interacting with hardware of your choice,
