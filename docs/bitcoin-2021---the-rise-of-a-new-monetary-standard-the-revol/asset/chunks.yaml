    # 第 20 章 - 比特币更新：闪电网络


    在本章中，我们将讨论一个非常有趣的话题，这个话题在实施后永远改变了比特币网络的历史。我们要谈论的是闪电网络。让我们更仔细地看看它是什么。


    闪电网络的概念由 Joseph Poon 和 Thaddeus Dryja 于 2015 年提出。该项目背后的主要思想是开发一种支付协议，可作为链外解决方案来解决困扰比特币区块链的可扩展性问题，尽管该概念也适用于其他加密货币。闪电网络的引入是对比特币和许多其他加密货币所面临的局限性的回答。目前，比特币区块链每秒可处理
    2 到 7 笔交易。随着加密货币生态系统的增长以及越来越多的人加入网络，传输到区块链的交易可能会增加。逐渐地，网络变得越来越拥堵，整体性能受到损害，显著降低了比特币作为全球数字货币的实际可用性。在此背景下，闪电网络被创建为一种尝试，以减少比特币区块链网络的拥堵。


    ## 闪电网络的工作原理


    闪电网络由在比特币区块链上开发的链外转账网络组成。该系统在点对点（P2P）级别运行，其使用基于创建所谓的“双向支付通道”，用户可以通过这些通道进行直接的加密货币交易。当两个交易对手决定开设支付通道时，他们有能力将资金从一个钱包转移到另一个钱包。尽管创建新支付通道的过程涉及链上交易，但在通道内进行的所有交易都是链外的，不需要全局共识。因此，这些交易可以通过智能合约快速执行，费用显著降低，TPS（每秒交易数）率显著提高。


    要开设支付通道，两个感兴趣的交易对手必须设置一个多签名钱包并向其中添加资金。多签名钱包中的资金只有在提供双方的私钥（两个或更多，具体取决于情况）时才能访问。这意味着一方在未经另一方同意的情况下无法访问钱包。例如，假设
    Alice 想使用闪电网络与 Bob 交易比特币。首先，两人开设一个支付通道，使用多签名钱包。虽然支付通道的工作方式类似于智能合约，但多签名钱包充当保险箱，要交换的资金存放在其中。只要支付通道保持打开，Alice
    和 Bob 就可以进行任意数量的链外交易。每笔交易后，Alice 和 Bob 立即签署并更新他们各自的资产负债表副本，该表记录了他们持有的币种数量。当他们不再需要时，可以关闭支付通道并将最终余额传输到比特币区块链。闪电网络智能合约保证双方将根据财务报表的最终版本收到他们的比特币。换句话说，参与者只需要与比特币区块链交互两次。一次是开设支付通道，一次是关闭它。因此，在通道内进行的所有交易都不直接与主链交互。


    ## 网络路由


    即使两个交易对手没有可用的直接支付通道，他们仍然可以通过互连的支付通道发送和接收比特币。这意味着 Alice 可以向 Charlie 发送资金，而无需与他创建直接通道，只要它们之间有一条包含足够资金的路由。因此，如果
    Alice 与 Bob 有开放的支付通道，Bob 与 Charlie 有一个通道，Alice 可以通过 Bob 发送比特币。支付路由可能涉及闪电网络的多个节点，但智能合约会自动搜索可用的最短路径。


    ## 闪电网络的优势


    正如我们所看到的，闪电网络项目正在努力实现一种链外解决方案，以解决可扩展性问题。如果成功，它可以减少比特币区块链上的流量。通过使用双向支付通道，闪电网络使几乎即时的交易成为可能。闪电网络可能适合微支付，因为它允许转账非常小的金额，甚至可以达到
    1 聪。此外，机器对机器经济可以实施自动微支付，在其中交易在电子设备之间进行，无需人工干预。


    ## 闪电网络的局限性


    与链上交易不同，在闪电网络中，如果接收方离线，则无法进行支付。因此，网络参与者可能需要定期监控支付通道以保护他们的资金（通过使用外部监控服务可以消除此风险）。此外，闪电网络不适合大额支付。该网络基于多个多签名钱包（实际上是共享钱包），这些钱包很可能不包含足够的余额来作为大额支付的中介。开设和关闭支付通道需要链上交易，这通常需要人工操作和更高的费用。


    ## 闪电网络何时实施？


    考虑到 Lightning Labs 宣布的主网测试版，闪电网络的推出日期原定于 2018 年 3 月 15 日。然而，闪电网络尚未在比特币区块链上实际实施。在测试版推出后，闪电网络节点和支付通道的数量大幅增加。一些交易所，如
    Kraken，宣布将于 2021 年开始支持闪电网络。节点和支付通道的集体工作使闪电网络成为解决可扩展性问题的一个有趣的解决方案。测试版目前正在测试中，其效率有待证明。尽管如此，闪电网络有巨大的潜力来改善比特币和加密货币生态系统。


    ## 闪电火炬


    2019 年 1 月 19 日，化名 Twitter 用户“hodlonaut”开始了一场类似游戏的闪电网络推广测试，向一位可信的接收者发送了 100,000
    聪（0.001 比特币），每位接收者都会向下一位可信的接收者发送增加 10,000 聪的金额。所谓的“闪电火炬”支付传递给了多位知名人士。其中包括 Lightning
    Labs 首席执行官 Elizabeth Stark、Twitter 首席执行官 Jack Dorsey 和 Binance 首席执行官“CZ”赵长鹏。闪电火炬传递了
    292 次，之后达到了之前硬编码的 4,390,000 聪的限制。闪电火炬的最终支付于 2019 年 4 月 13 日发出，作为向 Bitcoin Venezuela（一个在委内瑞拉推广比特币的非营利协会）捐赠
    4,290,000 聪（当时价值 217.78 美元）的款项。我们有幸参与了闪电火炬活动，并为该事件感到无比自豪。


    '
