- raw: 'Chapter 26 - The Stock to Flow Model In this chapter we are going to take
    a look at a price prediction model called stock to flow. In simple terms, the
    Stock to Flow model (SF or S2F) is a way to measure the abundance of a particular
    resource. The Stock to Flow ratio is the quantity of resources present in the
    reserves divided by the quantity that is produced annually. The Stock to Flow
