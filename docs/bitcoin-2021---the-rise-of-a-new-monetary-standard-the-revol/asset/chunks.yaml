    # Chapter 20 - Bitcoin Update: the Lightning Network


    In this chapter we are going to discuss a very interesting topic, that forever
    changed the history of the Bitcoin network when it was implemented. We are talking
    about the Lightning Network. Let’s take a closer look at what it is.


    The Lightning Network concept was created by Joseph Poon and Thaddeus Dryja in
    2015. The main idea behind the project is the development of a payment protocol
    that can be used as an off-chain solution to address the problem of the scalability
    that plagues the Bitcoin blockchain, although the concept is also applicable to
    other cryptocurrencies. The introduction of the Lightning Network is the answer
    to the limitations that both Bitcoin and many other cryptocurrencies face. Currently,
    the Bitcoin blockchain is capable of processing 2 to 7 transactions per second.
    With the growth of the cryptocurrency ecosystem and with more and more people
    joining the network, transactions transmitted to the blockchain are likely to
    increase. Gradually, the network becomes more and more congested and the overall
    performance is compromised, significantly reducing the practical usability of
    Bitcoin as a global digital currency. In this context, the Lightning Network was
    created as an attempt to reduce the congestion of the Bitcoin blockchain network.


    ## How the Lightning Network works


    The Lightning Network is composed of an off-chain transfer network developed on
    the Bitcoin blockchain. The system operates at a peer-to-peer (P2P) level and
    its use is based on the creation of so-called “two-way payment channels”, through
    which users can perform direct cryptocurrency transactions. When two counterparties
    decide to open a payment channel, they have the ability to transfer funds from
    one wallet to another. Even though the process of creating a new payment channel
    involves an on-chain transaction, all transactions that take place within the
    channel are off-chain and do not require global consent. As a result, these transactions
    can be quickly executed through a smart contract, incurring significantly lower
    fees and a significantly higher TPS (transactions per second) rate.


    To open a payment channel, the two interested counterparties must set up a multi-signature
    wallet and add funds to it. The funds within the multi-signature wallet are accessible
    only when the private keys of both parties are provided (two or more, depending
    on the case). This means that one of the parties cannot access the wallet without
    the consent of the other. As an example, suppose Alice wants to use the Lightning
    Network to trade bitcoins with Bob. First of all, the two open a payment channel,
    using a multi-signature wallet. While the payment channel works like a smart contract,
    the multi-signature wallet acts as a safe, where the funds to be exchanged are
    deposited. As long as the payment channel remains open, Alice and Bob can perform
    as many off-chain transactions as they want. Immediately after each transaction,
    both Alice and Bob sign and update their copy of the balance sheet, which records
    the number of coins in their possession. When they no longer need it, they can
    close the payment channel and transmit the final balance to the Bitcoin blockchain.
    The Lightning Network smart contract guarantees that both parties will receive
    their bitcoins, based on the final version of the financial statements. In other
    words, participants only need to interact with the Bitcoin blockchain twice. One
    to open the payment channel and one to close it. As a result, all transactions
    performed within the channel do not interact directly with the main chain.


    ## Network Routing


    Even if two counterparties do not have a direct payment channel available, they
    can still send and receive bitcoins through interconnected payment channels. This
    means that Alice can send funds to Charlie without having to create a direct channel
    with him, as long as there is a route between them that contains sufficient funds.
    Therefore, if Alice has an open payment channel with Bob and Bob has a channel
    with Charlie, Alice can send bitcoins through Bob. Payment routing may involve
    several nodes of the Lightning Network, but the smart contract will automatically
    search for the shortest path available.


    ## Benefits of the Lightning Network


    As we have seen, the Lightning Network project is working to achieve an off-chain
    solution that solves the scalability problem. If successful, it could reduce traffic
    on the Bitcoin blockchain. Through the use of two-way payment channels, the Lightning
    Network makes almost instant transactions possible. The Lightning Network could
    prove suitable for micropayments, as it allows the transfer of very small amounts,
    even reaching 1 satoshi. In addition, the machine-to-machine economy could implement
    automated micropayments, in which transactions are performed between electronic
    devices without the need for human intervention.


    ## Limits of the Lightning Network


    Unlike on-chain transactions, within the Lightning Network it is not possible
    to make payments if the recipient is offline. Therefore, the network participants
    may need to monitor payment channels regularly to protect their funds (this risk
    can be eliminated by using external monitoring services). Furthermore, the Lightning
    Network is not suitable for large payments. The network is based on several multi-signature
    wallets (in practice shared wallets), and it is very likely that these do not
    contain a sufficient balance to act as intermediaries for large payments. Opening
    and closing a payment channel requires an on-chain transaction, which usually
    requires labor and higher fees.


    ## When will the Lightning Network be implemented?


    Taking into consideration the beta version of the mainnet announced by Lightning
    Labs, the launch date of the Lightning Network had been set for March 15th, 2018.
    However, the Lightning Network has not yet been actually implemented on the Bitcoin
    blockchain. Following the launch of the beta, there has been a huge increase in
    the number of Lightning Network nodes and payment channels. Some exchanges, like
    Kraken, announced that they will start supporting the Lightning Network in 2021.
    The collective work of nodes and payment channels is what makes Lightning Network
    an interesting solution to the problem of scalability. The beta version is currently
    being tested and its efficiency is yet to be proven. Despite this, the Lightning
    Network has enormous potential to improve the Bitcoin and cryptocurrency ecosystem.


    ## The Lightning Torch


    On January 19, 2019, pseudonymous Twitter user “hodlonaut” began a game-like promotional
    test of the Lightning Network by sending 100,000 satoshis (0.001 bitcoin) to a
    trusted recipient where each recipient added 10,000 satoshis to send to the next
    trusted recipient. The so-called "lightning torch" payment reached notable personalities.
    Among them there were Lightning Labs CEO Elizabeth Stark, Twitter CEO Jack Dorsey,
    and Binance CEO "CZ" Changpeng Zhao. The lightning torch was passed 292 times
    before reaching the formerly hard-coded limit of 4,390,000 satoshis. The final
    payment of the lightning torch was sent on April 13th, 2019 as a donation of 4,290,000
    satoshis ($217.78 at the time) to Bitcoin Venezuela, a non-profit association
    that promotes bitcoin in Venezuela. We had the privilege to participate in the
    Lightning Torch and we are extremely proud of that event.

    '
