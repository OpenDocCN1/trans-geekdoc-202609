    # 第 3 章 - 比特币背后的理念


    比特币的理论根源在于奥地利学派经济学及其对当前货币体系以及政府和其他实体干预的批评，该学派认为这种干预加剧了商业周期和大规模通货膨胀。由 Eugen von
    Böhm-Bawerk、Ludwig von Mises 和 Friedrich A. Hayek 领导的奥地利学派经济学关注的主题之一是商业周期。事实上，根据奥地利理论，商业周期是市场上不可避免的货币干预的后果，即银行信贷的过度扩张导致部分准备金制度下银行信贷存量增加，进而导致人为压低的利率。在这种情况下，企业家在扭曲的利率信号引导下，开展了与消费者当时对跨期消费（即短期决策和未来消费）的偏好不匹配的过于雄心勃勃的投资项目。迟早，这种普遍的失衡将无法持续下去并导致衰退，在此期间，公司必须清算失败的投资项目，并根据消费者的跨期偏好重组其生产结构。因此，许多奥地利学派经济学家呼吁通过废除部分准备金银行制度并恢复基于金本位的货币来放弃这一过程，这种货币不容易被当局操纵。奥地利经济学家非常活跃的另一个相关领域是货币理论。Friedrich
    A. Hayek 是该领域最著名的名字之一。他撰写了一些非常有影响力的出版物，例如《货币非国家化》（1976 年），他在其中假设政府不应拥有货币发行的垄断权。相反，他建议应允许私人银行发行不计息证书，并基于其自身商标。这些证书（即货币）应向竞争开放，并将以不同的汇率进行交易。任何能够保证稳定购买力的货币都将从市场上淘汰其他不那么稳定的货币。这种竞争和利润最大化过程的结果将是一个高效率的货币体系，其中只有稳定货币才能共存。以下观点通常为比特币支持者所共享。


    ● 他们将比特币视为结束中央银行货币发行垄断的一个良好起点。

    ● 他们强烈批评当前的部分准备金银行制度，该制度允许银行将其信贷供应扩展到其实际储备之外，同时允许存款人随时将其资金提取到支票账户中。


    ## 比特币的特殊性


    我们必须区分比特币（加密货币）和另一方面的比特币（这种货币的支付系统）。在这两个方面，比特币与预先存在的系统在某些重要点上有所不同。首先，与其他货币不同，比特币不是任何国家、银行或企业权力的体现。比特币的价值由其经济用途以及外汇市场以完全浮动的方式决定。组织货币发行的规则完全由比特币软件的自由计算机代码确定。此外，作为支付系统，比特币的特点在于其运行不需要使用集中式基础设施来保存持有金额的账目以确保交易。担保和验证的作用存在，但大约每十分钟分配一次给网络中根据其算力随机选择的一台计算机。比特币基于一种加密协议，其主要目的是，一方面，解决所谓的双重支付问题，此问题此前一直阻碍此类货币的出现，另一方面，“禁止”伪造利益相关者标识符以及由给定地址标识的电子钱包中比特币存量的价值。


    ## 比特币背后的货币原则


    从货币角度来看，比特币与其他货币的主要区别在于，货币总量并非设计用于适应财富的生产。单位的总量和发行率明确写入软件的计算机代码中，遵循一种等比数列类型的数学规则。比特币缓慢而稳定地发行，呈递减趋势，预计在
    2140 年左右达到 2100 万的最大数量。所有法定货币都会经历通货膨胀，程度取决于其中央银行的政策，从低到高不等。相反，比特币货币最终可能会经历通货紧缩，因为可创建的比特币最大数量在软件中预先设定为
    2100 万。除此之外，用户丢失的比特币永远不会被替换。这就是为什么比特币项目被其创建者社区视为一项在经济学方面的原创实验，构成了一种对奥地利学派经济学货币论点的测试。事实上，经济学诺贝尔奖获得者
    Friedrich Hayek 在 1976 年的著作《真正的货币竞争》中呼吁恢复货币自由意志。比特币的成功或失败很难预测，但到目前为止，不可能说它表现不佳。


    ## 协议的可扩展性


    2010 年 7 月 14 日，比特币系统启动后不久，Satoshi Nakamoto 在比特币区块链上为每十分钟新创建的区块设定了 1MB 的限制。当时，交易是免费的，因为交易数量很少，开发人员有合理的担忧，即攻击者可能会“垃圾邮件”交易网络，任意创建巨大的区块并永久膨胀区块链的大小。此限制旨在防止此类攻击，直到能够实施更好的解决方案。Satoshi
    Nakamoto 提出了一种方案，即将区块大小增加到特定的区块高度，从而将限制有效地提高到预定的速率，类似于新比特币的发行方式。自引入此区块大小限制以来，比特币系统的可扩展性一直是社区持续辩论的来源。这个
    1MB 限制最初被认为将每秒交易数量限制为七笔，在实际交易数量几乎未超过每秒 2.3 笔（2010 年）的时代，这并不构成问题。因此，每秒七笔交易是当时比特币最繁忙日交易量的三倍，为开发人员留出了数年时间来寻找更好的解决方案。除此之外，协议规定随时间推移引入交易费用，这将使此类攻击变得更加昂贵和无效。


    ### 交易集成容量饱和


    从 2014 年开始，比特币系统的成功导致交易数量持续上升，最终在 2016 年达到了 1MB 的限制。开发人员 Gavin Andresen 最初提议了
    20MB 区块，但社区认为增加幅度过于激进。另一项提议 BIP10191，建议从 8MB 开始每年增加区块大小 40%，这导致创建了一种不同于比特币的新加密货币，称为
    Bitcoin XT92。还提出了其他提议，例如 BIP10093，采用 2MB 区块，导致了 Bitcoin Classic 加密货币，以及更激进的“新兴共识”方法，允许用户通过
    Bitcoin Unlimited 在特定时间“投票”决定最佳区块大小。社区的其他成员倾向于不支持增加区块大小，而是改变协议本身，以便通过减少交易大小或增加新区块的创建频率，在一个区块中集成更多交易。当交易数量最终达到区块大小限制时，待处理交易池变得满载。用户要想让特定交易更快进入区块链，唯一的方法是增加交易费用，2016
    年底交易费用已达到近 5 美元。这使得比特币在速度和成本的严格基础上，无法与西方联合汇款或 PayPal 等现有服务竞争。


    ### 纽约协议


    关于可扩展性的停滞辩论削弱了比特币核心系统，并导致支持比特币无限运动的投票日益成功，尤其是在矿工中，很大程度上是由于对缺乏升级解决方案的沮丧。开发团队的方法，称为隔离见证（segwit），即不增加区块大小限制，而是将交易的数字签名以不同的方式分区到“扩展区块”中，未能达成足够的共识。2017
    年，在行业共识中找到了一个妥协方案，称为隔离见证 2x（Segwit2x97），它结合了隔离见证提议和将区块大小增加到 2MB。该提议于 2017 年 8
    月 1 日针对隔离见证实施，区块大小增加于 2017 年 11 月在区块 494,784 生效。这是比特币系统的一次重大更新。尽管如此，可扩展性辩论仍然激烈，一个分裂团体于
    2017 年 8 月 1 日单方面将区块大小增加到 8MB，同时拒绝隔离见证提议。这一决定导致了一种新加密货币的出现，称为比特币现金。比特币 XT（创建于
    2015 年 8 月）、比特币无限（创建于 2016 年 1 月）、比特币经典（创建于 2016 年 2 月，后于 2017 年 11 月停止）、比特币现金（创建于
    2017 年 8 月）和比特币黄金（创建于 2017 年 10 月）是比特币（也称为比特币核心）的替代加密货币，旨在解决交易费用问题。


    ## 财富分配


    比特币集中在少数大户手中。“财富”的分配方式是，2100 个地址持有总量的 40.2%。然而，这种信息并不十分有用，因为其中一些地址已经失效（当一个比特币单位还不值
    1 美分时，密钥丢失）。我们的观点是，既然我们现在看到机构纷纷入场，那么在大户持有的比特币数量方面，我们将看到更高的集中度。随着价格上涨，普通人要拥有一个完整的比特币将变得越来越困难。


