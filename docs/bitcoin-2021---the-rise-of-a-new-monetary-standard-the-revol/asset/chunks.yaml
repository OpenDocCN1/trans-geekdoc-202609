    # A common hacking technique


    The technique known as the Trojan Horse makes it possible to change the address
    of the recipient of the cryptocurrency transaction. CryptoShuffler is one of the
    software using this technique. This rare technique has little effect because it
    suffices for the payment sender to visually check the first/last characters of
    the destination address to make sure that it is not being fooled.


    # Price evolution against the dollar


    When it was created in February 2009, the cryptocurrency was initially traded
    only as an experiment by a few rare users and its value was zero. On October 12th,
    2009, the first known bitcoin sale took place, where two users traded 5,050 bitcoins
    for $5.02 using a Paypal transfer, which equates to a price of around $0.001 per
    bitcoin. In March 2010, Bitcoinmarket.com was the first bitcoin exchange platform
    to be opened, thus allowing continuous quotation of the price of bitcoin. It was
    the beginning of an era and every Bitcoin enthusiast should be thankful to this
    website for what it has done for the community. On February 9th, 2011, bitcoin
    reached the valuation of one full dollar. On November 29th, 2013, the value of
    a bitcoin exceeded that of an ounce of gold, to nearly $1,250. Once again, for
    those that are familiar with today price action, these numbers do not seem so
    incredible. However, if you think about it, we are talking about a huge price
    development in just a couple of years. What other asset did over 1000% in just
    two years? The answer is very simple: no other asset managed to do it. Bitcoin,
    mainly traded for yuan and dollars, can also be traded for euros on a dozen platforms.
    Until November 2013, Mt. Gox was the most important of these platforms in terms
    of transaction volume (~ 70%) and the practice had been taken to consider its
    price as representative of the market. As a result of the problems encountered,
    users turned away from it, causing the price of bitcoin to drop sharply on Mt.
    Gox, with prices observed on other platforms only slightly affected. The price
    experienced a 400% increase between January and March 2013, before correcting
    itself severely on April 10th, following a failure of the Mt. Gox exchange site
    and probable panic sales. The price fell back to the level of the previous month,
    around $50. Between December 4th and 5th, 2013, following a warning from the People''s
    Bank of China and the Bank of France, the price lost nearly 35% in 24 hours. On
    February 19th, 2014, the price collapsed following the announcement of the disappearance
    of 850,000 bitcoins on Mt. Gox. On this exchange platform, bitcoin goes from $185,
    on February 18, to $73 24 hours later, while it remains close to $400 on other
    platforms. Mt.Gox declared bankruptcy on February 28, 2014. On May 1st, 2014,
    a group of investors by the name of Sunlot Holdings offered to buy the site for
    one symbolic bitcoin. In 2016, after the Brexit announcement on June 24th, the
    value of bitcoin skyrocketed, gaining more than 9%, while all financial centers
    plunged for more than a week. This was probably the first time that the true strength
    of Bitcoin was shown to the world. In fact, BTC is an asset that does particularly
    well when there is turbulence in the world. We have seen this in 2020, where it
    rose by over 600% in just one year. In 2017, Bitcoin topped out at around $19,000
    and entered a long bear market of over 2 years. Those who accumulated during that
    time were brave enough to survive more than 700 days without seeing the asset
    climbing back to its all time high. However, in 2020, Bitcoin finally managed
    to break that level and skyrocketed. At the time of writing this book, one bitcoin
    is worth around $60,000. Think about it, if you bought $10 worth of Bitcoin on
    February 9th, 2011, you would now have an equivalent of over $600,000. These kind
    of numbers really impress us.

    '
  trans: '


    # 一种常见的黑客技术


    被称为特洛伊木马的技术使得更改加密货币交易收款人地址成为可能。CryptoShuffler 是使用这种技术的软件之一。这种罕见的技术影响很小，因为付款发送者只需目视检查目标地址的首/尾字符，即可确保自己没有被欺骗。


    # 与美元的价格演变


    该加密货币于 2009 年 2 月创建之初，仅由少数用户作为实验进行交易，其价值为零。2009 年 10 月 12 日，首次已知的比特币交易发生，两名用户通过
    PayPal 转账用 5,050 个比特币交换了 5.02 美元，相当于每个比特币约 0.001 美元。2010 年 3 月，Bitcoinmarket.com
    是第一个开放的比特币交易平台，从而允许比特币价格的持续报价。这是一个时代的开始，每个比特币爱好者都应该感谢这个网站为社区所做的一切。2011 年 2 月 9
    日，比特币达到了 1 美元的估值。2013 年 11 月 29 日，一个比特币的价值超过了盎司黄金，接近 1,250 美元。再次强调，对于那些熟悉当今价格走势的人来说，这些数字似乎并不那么令人难以置信。但是，如果你仔细想想，我们谈论的是仅仅几年内的巨大价格发展。还有哪种资产在短短两年内就上涨了超过
    1000%？答案很简单：没有其他资产做到过这一点。比特币主要以人民币和美元交易，也可以在十几个平台上以欧元交易。直到 2013 年 11 月，Mt. Gox
    都是这些平台中交易量（约 70%）最大的平台，并且惯例是将其价格视为市场的代表。由于遇到的问题，用户远离了它，导致比特币在 Mt. Gox 上的价格急剧下跌，而其他平台上观察到的价格仅受轻微影响。价格在
    2013 年 1 月至 3 月间上涨了 400%，但在 4 月 10 日严重回调，此前 Mt. Gox 交易网站出现故障，并可能出现恐慌性抛售。价格回落到上个月的水平，约为
    50 美元。2013 年 12 月 4 日至 5 日，在中国人民银行和法国银行发出警告后，价格在 24 小时内损失了近 35%。2014 年 2 月 19
    日，在 Mt. Gox 上宣布丢失 850,000 个比特币后，价格崩溃。在这个交易平台上，比特币从 2 月 18 日的 185 美元跌至 24 小时后的
    73 美元，而其他平台上的价格仍接近 400 美元。Mt.Gox 于 2014 年 2 月 28 日宣布破产。2014 年 5 月 1 日，一家名为 Sunlot
    Holdings 的投资者集团提出以一个象征性的比特币购买该网站。2016 年，在 6 月 24 日 Brexit 公告之后，比特币价值飙升，上涨了 9%
    以上，而所有金融中心在超过一周的时间里都暴跌了。这可能是第一次向世界展示比特币的真正实力。事实上，BTC 是一种在世界动荡时表现特别好的资产。我们在 2020
    年看到了这一点，当时它在短短一年内上涨了超过 600%。2017 年，比特币在约 19,000 美元处触顶，并进入了长达 2 年多的熊市。在那段时间积累比特币的人足够勇敢，在超过
    700 天内没有看到资产回升至历史高点而幸存下来。然而，在 2020 年，比特币终于突破了那个水平并飙升。在撰写本书时，一个比特币价值约 60,000 美元。想想看，如果你在
    2011 年 2 月 9 日购买了价值 10 美元的比特币，你现在将拥有相当于超过 600,000 美元的资产。这类数字确实令我们印象深刻。


