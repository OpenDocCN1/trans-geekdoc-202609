    # Chapter 22 - Schnorr Signatures


    As you may know, Bitcoin enforces property rights through what we call the Elliptic
    Curve Digital Signature Algorithm (or ECDSA). The algorithm allows you to take
    a number (i.e., a private key) and derive a public key from it. The magic of this
    step is that while it is simple for you to get the public key from the private
    key, the reverse is impossible. Your private key is your passport to the Bitcoin
    network. It is what allows you to generate an address to receive coins and spend
    them later. In this chapter, we will talk about the Schnorr signature algorithm,
    an alternative to ECDSA that could introduce some interesting changes in Bitcoin.


    ## A summary on digital signatures


    Digital signatures work just like their ancestors on pen and paper, but they are
    much more secure. With a little time and effort, anyone can forge a signature
    on paper. You can''t do the same with a solid digital signature scheme, even with
    hundreds of thousands of years at your disposal.


    There are several use cases for digital signatures. One of the most popular involves
    proving to the world that you wrote a particular message. As mentioned, you can
    create a public key from a private key. To do this, just perform some mathematical
    fantasy on the `secp256k1` curve. After that, you can also generate a public address
    from your public key. Wait, you don’t know what the `secp256k1` curve is? Do not
    worry, if you are just starting out studying Bitcoin, it is not something worth
    explaining as it has more to do with cryptography than cryptocurrencies. You just
    need to know that it is completely safe to show your public key to anyone. You
    can add it to your website or Twitter bio to allow others to verify your identity.
    Likewise, you can share your public addresses with others to transfer cryptocurrencies.


    Your private key allows you to create a digital signature. By writing a message
    and performing an operation on it using your private key, you create a signed
    message. Anyone can review it and compare it to your public key to verify that
    it was indeed signed by you.


    ### How does this relate to Bitcoin?


    Whenever you make a transaction in Bitcoin, you are digitally signing a message
    that says “I am sending these coins which have previously been sent to me”. Then,
    when it is sent to the other nodes on the network, they can check that the ECDSA
    signature matches the message. If not, the nodes reject it.


    ## What are Schnorr''s signatures?


    Schnorr signatures are a different type of algorithm. It operates similar to the
    Elliptic Curve Digital Signature Algorithm we currently use, but has a number
    of advantages over it. Schnorr''s signatures are actually older than the ECDSA,
    which leads many to wonder why they haven''t been integrated into Bitcoin from
    the start. One possible explanation is that Claus P. Schnorr - the creator of
    the algorithm - patented them. The patents expired in early 2008, months before
    the publication of the Bitcoin whitepaper, but the algorithm still lacked general
    standardization. For this reason, Satoshi Nakamoto has opted for the more widely
    accepted (and open source) ECDSA.


    ## Benefits of Schnorr signatures


    Schnorr''s signatures are quite simple in comparison to other algorithms. As a
    result, they are safer than their alternatives. It might not mean much at first
    glance, but they have another powerful feature: linearity. Simply put, this makes
    the algorithm particularly attractive for certain businesses - in particular,
    for multi-signature transactions.


    You may know that Bitcoin already supports multi sigs, but not in the best way.
    When you create a multisignature address, anyone who sends you funds does not
    need to know what conditions you have set for spending inputs. They may not even
    know they are sending funds to a multisig setup. In fact, the only noticeable
    difference of the address is the fact that it starts with a "3". However, you
    reveal its nature when you want to move funds.


    Let''s assume you used a 2-of-3 setup with Alice and Bob. To spend 5 BTC, all
    three of you must provide public keys and valid signatures. When you move the
    funds out of the address, the entire network can know what happened by examining
    the blockchain. From a privacy standpoint, that''s not good news. Also, if you
    create a larger multisig (e.g., 8-of-10), you are taking up a lot of space on
    the blockchain. This can be expensive, as it will result in a longer transaction
    - remember that the more bytes there are in your transaction, the more you will
    have to pay to get it through the network.


    Schnorr''s signatures were presented as a solution to these privacy and scalability
    issues. They allow things like signature aggregation, which combines the signatures
    of several signers into a single signature. The resulting “master signature” will
    be the same length as a normal individual signature, leading to significant space
    savings. Additionally, combined signatures make it much more difficult for an
    observer to determine who signed a transaction. In m-of-m schemes (where all participants
    have to sign in to spend the funds), you wouldn''t even be able to distinguish
    between single and multisig transactions.


    Essentially, Schnorr''s signatures are an important component for further progress.
    Once implemented, they can be leveraged to improve crypto technologies such as
    atomic swaps and the Lightning Network.


    ## The implementation of Schnorr signatures


    As with most updates to the Bitcoin protocol, it may take some time for the general
    community of Bitcoin users to agree to include Schnorr''s signatures. Bitcoin
    Core contributors Pieter Wuille, Jonas Nick, and Tim Ruffing have submitted a
    draft of the Bitcoin Improvement Proposal (BIP), but there is still work to be
    done. Blockstream has already released one possible implementation called MuSig.
    By allowing signature and key aggregation, it could form the basis for the Bitcoin''s
    Schnorr signature algorithm.


    Schnorr''s signatures could be integrated into the code through a soft fork, which
    is a change that would not divide the network. This type of fork would be an “opt-in”
    update. However, it would be too optimistic to assume that we will see them integrated
    in the near future - it may take a couple of years before consensus is reached.


    Schnorr''s signatures are one of the most anticipated targets on Bitcoin''s current
    roadmap. With a single update, they can provide significant privacy and scalability
    benefits. Perhaps more interestingly, they also create the conditions for further
    developments in Bitcoin smart contracts and more advanced constructs such as Taproot,
    which we will discuss in the next chapter.

    '
