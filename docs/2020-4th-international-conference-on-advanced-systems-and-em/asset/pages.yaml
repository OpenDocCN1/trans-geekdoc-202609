    # IV. POSITION ESTIMATION USING NEURAL NETWORK


    Machine learning is a collection of computational methods that use experience
    to enhance performance, or to get predictions. It is a data-driven approach to
    solve problems. Artificial neural networks (ANNs) are computer systems loosely
    inspired by the biological neural networks that connect the brains of humans or
    nodes called artificial neurons. An ANN is based on a set of neurons and each
    connection between artificial neurons can transmit a signal from one to the other
    which directly estimates parameters (coordinates) according to a database. Data
    filtering is considered as a learning process, and for all new systems the estimated
    result according to the learning of the base.


