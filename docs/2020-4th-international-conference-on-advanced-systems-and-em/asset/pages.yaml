    # II. LOCALIZATION


    An indoor localization system must contain a group of sensors to ensure the collection
    of necessary information for localization in different forms (acoustic, electric,
    etc.) [15]. These sensors with other element are very important for the installation
    of the localization infrastructure. The configuration consists of various parameters
    and the techniques we use to acquire the position of the mobile to move. The case
    of localization systems ensures the existence of one or more bases at fixed locations,
    the received signals is used from the mobile, to measure the parameter of the
    localization [16]. The quality of the collected data is depends on the type and
    of the elements used for the localization (the type and the quality of the sensors),
    on the other hand the environment of the experiments affects effectively on the
    collection of the data. This is due to the propagation of signals is interfered
    with a few influencing effects, from those we can count with different dimensions,
    radiation rate, climatic conditions, obstacles (static or dynamic) (see [3] for
    a survey).


