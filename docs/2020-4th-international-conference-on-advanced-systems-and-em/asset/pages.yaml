    rssi parameter. The received signal indication (rssi) method is of the classic
    classification techniques used in local networks or in mobile radio networks [13].
    Its principle consists of measuring the distance between the transmitter and receiving
    system by calculating the energy of received signal. In general, three base stations
    are required to perform the localization[17]. Assuming that the parameters are
    known, the distance d separating each base station from the mobile can be


    The Friis transmission equation is given by Equation 3.


    ```

    $d_c = \sqrt{\frac{P_tg_t\lambda^2}{(4\pi)^2P_r}}$ (3)

    ```


    $d_c$ is the distance between the transmitter and the receiver, $P_t$ and $P_r$
    are respectively the transmitted and received power, $G_t$ and $G_r$ are the gains
    of transmitter and receiver and $\lambda$ is the wavelength.


    In a previous work [15], the authors studied the distance estimation using polynomial
    approximation and Neural Networks. The methods used a very interesting accommodation
