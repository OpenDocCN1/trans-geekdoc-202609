    # C. Position estimation


    In this section we will saw in the previous section, the estimation of the distance
    is the first for the estimation of position[19]. The estimated distance between
    each base station (d1, d2, d3) and the robot use a system of 3 units with which
    are the coordinates of the robot (x,y), three equations represent the formulas
    of 3 circles of radius estimated distances.


    Using the Cartesian formula of a circle, and the estimated distances d1, d2 and
    d3 (which represents the distance between the base stations (1,2,3) and the mobile
    object) can obtain three equations with unknowns (see Eq. 4). Therefore, it is
    possible to estimate the coordinates. It should also be noted that in the ideal
    case, there is a direct LOS (Line Of Sight), the position estimation is mathematically
    perfect (if we ignore all the disturbing factors). But in the real case, there
    are disturbances of different types (acoustic, electromagnetic, ...), which makes
    it impossible to obtain a null error, and also significantly enhances the accuracy
    of the estimation. This is what our research does in this way to minimize as much
    as possible the error of the position estimation (going through the distance estimation[17]).


    ```

    $d_1^2 = (x-x_1)^2 + (y-y_1)^2$

    $d_2^2 = (x-x_2)^2 + (y-y_2)^2$

    $d_3^2 = (x-x_3)^2 + (y-y_3)^2$ (4)

    ```


    However, the number of the base stations can be more than 3.in this case it will
    be multilation, the estimation of position is from a system of n estimated equations.


    In relation of this, we have taken a riis dataset [14] to perform our work on
    the estimation of the coordinates. In the mentioned paper, the authors used a
    mathematical method based on the elimination of the weights reference measures
    and use other three measures to perform the estimation of the distances. This
    leads to the estimation of the position method to estimate the position (coordinates).
    For our work, we compute the coordinates using the neural networks.


