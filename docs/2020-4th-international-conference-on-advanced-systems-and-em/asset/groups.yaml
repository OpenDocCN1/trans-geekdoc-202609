    # 基于机器学习的室内定位


    Acheref Gadghadhi

    SE & ICT 研究实验室

    ENICarthage

    突尼斯

    acheref.gadghadhi@enicaru-t..com


    Yassine Hachiahi

    SE & ICT 研究实验室

    ENICarthage

    突尼斯

    yassine.hachiahi@ipeim.mnp.tn


    Hassen Zairi

    SE & ICT 研究实验室

    ENICarthage

    突尼斯

    hassen.zairi@gmail.com


    **摘要—** 多年来，人员和工程师一直在各种场景下寻找精确的室内定位系统（IPS）。为了实现这一目标，人们使用了多种方法。基于接收信号强度（RSS）的确定性
    IPS 使用 RSS 值进行距离估计，然后通过三角测量法进行校准以获得坐标值。由于室内环境变化巨大，RSS 通常是不稳定的。


    在本文中，我们提出了一种新的 IPS 方法。我们将我们的方法与使用三个锚点融合的方法进行了比较。结果优于经典方法。


    **室内术语—** 定位系统（IPS）、RSS、神经网络、学习近似和机器学习。结果证明这些近似方法更适合此问题。在这项工作中，我们提出了使用神经网络进行位置估计，并将其与
    [14] 中的结果进行了比较。位置估计通过两种神经网络（NN）架构执行，第一个基于 RSS 测量值输入；而第二个也基于 RSS 测量值输入。此外，我们对所提方法与
    [14] 作者提出的方法进行了比较。重点关注的参数是每个估计位置的距离误差以及该方法在准确性方面的性能。


    我们首次在相同条件下，执行了三个输入、一个隐藏神经网络的性能，以达到 [14] 中的精度。接下来，我们将比较三个输入与四个神经网络的比较，并发现增加信标的数量可以获得更高的精度。


    # I. 引言


    由于对高质量研究结果的迫切需求，目前仍然缺乏可靠的室内定位产品和工具。然而，在智能城市中，基于室内定位的服务需求不断增加 [1]。近年来，室内研究的精度以及定位系统的配置设置得到了极大改进。尽管如此，这些广泛使用的室内定位方案已实现与户外环境中类似于
    GPS 的满意性能 [2]。


    目前已经提出了多种方法，例如 [3]、超宽带（UWB）、射频识别（RFID） [5]、微机电系统（MEMS） [6]、无线局域网（WLAN） [7]、计算机视觉
    [8]、磁场 [9]、红外信号 [11] 和 [12]。


    RSS 技术是移动目标定位最流行的算法之一，上述传感器允许您执行数据采集。RSS 是传感器接收到的平均功率，该功率源于发射源。假设接收功率遵循指数衰减，接收功率是发射功率、路径损耗常数以及源与传感器之间距离的函数
    [13]。通过收集传感器的 rsi 数据并去噪，可以更准确地估计距离。这是通过使用一些分析数学方法实现的。在 [15] 中，作者讨论了这两种近似技术的缺点，尽管


    # II. 定位


    室内定位系统必须包含一组传感器，以确保以不同形式（声学、电学等）收集定位所需的必要信息 [15]。这些传感器与其他元件对于定位基础设施的安装至关重要。配置由各种参数和我们用于获取移动物体位置的技术组成。定位系统的情况确保了固定位置存在一个或多个基站，利用移动设备的接收信号来测量定位参数
    [16]。所采集数据的质量取决于用于定位的元件类型和质量（传感器的类型和质量），另一方面，实验环境会有效影响数据的采集。这是由于信号传播受到一些影响因素的干扰，这些可以分为不同的维度：辐射率、气候条件、障碍物（静态或动态）（综述请参见
    [3]）。


    # A. 基于 RSS 的定位


    由于我们的工作致力于使用 rsi 参数进行定位，我们将使用基于 2020 年第 44 届先进系统与新兴技术国际会议（IC_ASET）的 rssi 参数的三角测量技术。接收信号指示（rssi）方法是本地网络或移动无线电网络中常用的分类技术之一
    [13]。其原理是通过计算接收信号的能量来测量发射系统和接收系统之间的距离。通常，需要三个基站来执行定位 [17]。假设参数已知，每个基站与移动设备之间的距离
    $d$ 可以为：


    Friis 传输方程由公式 3 给出。


    ```

    $d_c = \sqrt{\frac{P_tg_t\lambda^2}{(4\pi)^2P_r}}$ (3)

    ```


    $d_c$ 是发射器和接收器之间的距离，$P_t$ 和 $P_r$ 分别是发射和接收功率，$G_t$ 和 $G_r$ 是发射器和接收器的增益，$\lambda$
    是波长。


    在之前的工作 [15] 中，作者研究了使用多项式近似和神经网络的距离估计。这些方法对实验结果具有非常有趣的适应性。


    ![](img/c713304737ca36799d5f26bfab)


    # C. 位置估计


