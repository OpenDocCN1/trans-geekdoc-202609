    **Abstract—** Since many years, researchers and engineers are looking for a precise
    Indoor Positioning System (IPS) in various scenarios. Several methods were used
    in order to reach this goal. Deterministic methods in IPS, based on the received
    signal strength (RSS), use the RSS value into a distance estimate, and then calibrate
    it by triangulation to get coordinate values. RSS is generally unstable due to
    the high amount of variation in indoor environments.


    In this paper, we propose a new approach for IPS. We compare our method with the
    one using fusion of three anchors. The results are substantially better than the
    classic method.


    **Indoor Terms—**Positioning System (IPS), RSS, Neural Networks, Learning


    approximation and machine learning. The results prove that these approximation
    methods fit better to this problem. In this work, we propose a position estimation
    using neural networks, and compare it to the results in [14]. The position estimation
    is performed with two neural network (NN) architecture, the first one is based
    on RSS measures as input. While the second is based on RSS measures as input.
    As well, we give a comparison between the proposed methods and the method presented
    by the authors in [14]. The parameter focusing on the comparison, the distance
    error for each estimated position, and the method performance in accuracy.


    In a first time, we perform the performance of three inputs, one hidden neural
    network, to reach the precision in [14], in the same conditions. Next, we will
    compare three inputs to four neural network and detect that increasing the number
    of beacons gives a better precision.


