  \n根据 LinkedIn 的 2016 年全球趋势报告，招聘人员的质量是 40% 大公司和 45% 小公司的首要考虑事项。25。但这些企业中，有多少实际上在衡量新员工的质量？传统上，安全职位被认为很难根据你可能认为合适的指标进行评估，例如零破口、零数据丢失或零安全事件。但事件、破口和数据丢失是无法完全控制的。\n\
  \n### 评估的挑战\n\n传统上，安全职位被认为很难根据你可能认为合适的指标进行评估，例如零破口、零数据丢失或零安全事件。但事件、破口和数据丢失是无法完全控制的。\n\
  \n### 支持的重要性\n\n作为一名 CIO（首席信息官），你作为导师的角色非常重要。这向我表明，CIO 需要的支持和指导与安全领导一样多，尤其是在早期阶段。\n\
  \n我采访过的一位 CIO 建议，在评估候选人时，CIO 的安全专业知识比组织的安全成熟度更重要。他认为 CIO 支持安全领导的能力以及安全领导对这种支持的依赖才是关键所在。\n\
