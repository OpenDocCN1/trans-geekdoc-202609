- "# 安全的首席官：如何招聘并留住优秀网络安全人才以保护您的组织\n\n\n\n\n![](img/f3k28cv1jdf.png)\n\n\n\n\n\n\n\
  \n\n![](img/f3k28cv1jdg.png)\n\nClaire Pales 是 27 Lanterns 的董事，这是一家致力于帮助机构创建并维持有效信息安全团队的咨询公司。在过去的\
  \ 15 年里，Claire 积累了在澳大利亚及亚洲（包括中国香港和印度）建立团队和领导屡奖安全策略的经验。Claire 的信息和网络安全经验涵盖关键基础设施、在线和电子商务团队，并持续关注成长和培养从毕业生到领导者的信息安全专业人士，帮助企业建立卓越的信息安全实践。\n\
  \nClaire 拥有警察研究学士学位、网络犯罪调查研究生学习背景，并具备执行教练资格。\n\nClaire 住在墨尔本，有四个孩子，是一位活跃的行业博客作者，并担任澳大利亚女性安全网络（Australian\
  \ Women in Security Network）的志愿者。\n\n[www.27lanterns.com.au](http://www.27lanterns.com.au)\n\
  \n## 推荐\n\n“Claire 成功地将她的企业、咨询和全球专业知识相结合，为信息和网络安全提供了见解且务实的方法。她的独立性是客户的吸引力，因为 Claire\
  \ 提供的客观建议获得了高管和董事会的信任。Claire 建立关系和信任的能力让她更早地获得洞察并交付价值。” – Anna Leibel，UniSuper 技术执行经理\n\
  \n“毫无疑问，这个互联的世界带来了一些最具挑战性的风险和绝佳的机会。确保一个机构的网络安全设置恰当是所有机构（无论大小）都面临的问题。网络安全领域的第二大挑战是如何找到合适的网络安全专业人士。”\n\
  \n“Claire 的书不仅充满了她多年经验中积累的见解，而且时机恰恰，因为市场上正充斥着针对安全专业人士的机会。她不仅强调了选择合适的网络安全‘战士’的重要性，还为读者提供了一个持久的框架，让机构（特别是他们的首席信息官\
  \ CIO）理解，在正确的控制、文化和预期下，网络安全是一个无法消除的风险，但可以被有效管理。这绝对是一本网络领域的佳读！”\" – Rachael Falk，Pace\
  \ & Scale Pty Ltd 网络安全顾问\n\n“从我们与 Claire 接触的那一刻起，我们就知道她是指导我们网络安全之旅的完美人选。除了是一位经验丰富、受人尊敬且充满激情的信息安全专业人士外，Claire\
  \ 还理解个人和机构的运作机制。Claire 结合技术知识的能力让她更早地获得洞察并交付价值。” – John Finnan，MYOB 支付负责人\n\n“毫无疑问，这个互联的世界带来了一些最具挑战性的风险和绝佳的机会。确保一个机构的网络安全设置恰当是所有机构（无论大小）都面临的问题。网络安全领域的第二大挑战是如何找到合适的网络安全专业人士。她帮助我度过了许多危机。”\n\
