  致谢\n\n## 引言\n\n“在网络安全行业，我们没有失业，而且需求是巨大的。” Craig Davies，澳大利亚安全增长网络首席执行\n\n作为一个国家，我们并没有掌控网络攻击威胁。在全球范围内，我们并不是唯一在数字时代保护业务方面面临不确定未来的人。最近的新闻事件证明，我们对于每天影响我们机构的网络事件和事故装备不足且准备不足。\n\
  \n在过去的一年里，企业仅因病毒邮件损失了超过 2000 万美元，比 2016-17 财年损失的 860 万增加了 230%。澳大利亚企业正寻求防止类似于近期\
  \ WannaCry 和 Petya 勒索病毒的攻击，这些病毒锁定了系统并要求索金以解锁文件。没有哪个机构是幸免的——即使是受托保护我们国家重大秘密的公司（如澳大利亚信号局），也卷入了澳大利亚网络安全中心在过去一年确认的\
  \ 47,000 起本地网络犯罪事件，这涵盖了从数据泄露到国家支持黑客攻击的一切。\n\n如果你正在阅读这本书，很有可能是你的董事会、审计和风险委员会或首席执行官已经读了上述活动并开始提问。你可能被指派针对你的机构在全球意识提高后所发现的网络威胁采取行动。\n\
  \n\n\n\n如果你正看到这里，说明你很幸运。世界上存在一些不可思议的安全领导者，他们是充满热情、动力十足且专注的人，无论扰乱了谁的利益，都保持着高度的正直。但是，他们不会接受任何工作，也不会帮助任何机构；由于当前的威胁形势，他们对如何利用自己的专业知识非常挑。他们的技能备受追求，竞争激烈，为了吸引顶级人才，薪资（尤其是在澳大利亚）正在上升。\n\
  \n那么，你如何寻找并留住这些安全战士呢？这本书就是这个问题。它关于深度挖掘、提前规划，并可能给一个虽然不完美但可能拥有你组织所需技能的人一个机会。如果没有人曾经机会过，我现在就不会在这里写这本书了。\n\
  \n当我 20 世纪 90 年代后期开始工作时，网络安全并不在我的职业范围内。大学毕业后两年，当我的职业动力和目标处于顶峰时，我遇到了 `Telstra` 的企业安全主管并邀请她喝咖啡。六个月后我开始为她工作，在后的几年里，我代表\
  \ `Telstra` 在全国范围内为警察和其他机构提供法庭证词，从地区法院到联邦法院。\n\n我努力工作，吸取了大量建议，进一步学习，并随着我对这个领域变得越来越热情，我的声誉也日益提高。在行业工作了\
  \ 15 多年后，我现在为自己工作。我建立过团队，领导过屡获奖的战略，并帮助亚洲和澳大利亚的组织免受网络攻击。多年网络和信息安全领导者的经验带我来到了今天，分享我的经验以及帮助企业建立卓越安全实践和内部安全领导力的热情。\n\
  \n# 这本书是给谁看的？\n\n《Secure CIO》是为那些网络或信息安全人员汇报或希望汇报的首席信息官 (`CIOs`) 编写。\n\n尽管出现了更多的安全管理职位，但大多数安全领导者及其他各种安全职位仍向\
  \ `CIO` 汇报。网络安全招聘市场对于招聘经理和候选人来说变得越来越困难。许多职位空缺数月，这给 `CIOs` 在日益增加的工作负载带来了更多压力，并增加了组织的风险。寻找并留住合适的安全人员可以为\
  \ `CIOs` 提供一种其他方式无法提供的确定性。拥有的内部专家和领导者在网络风险发生之前（及之后）进行评估和处理，可以改变业务向更好的方向发展。\n\n#\
  \ 为什么我写这本书？\n\n《Secure CIO》满足了对于有效招聘领导者以应对网络安全风险的建议和保证的需求。\n\n澳大利亚信息安全协会的研究表明，澳大利亚感知到的网络安全人才短缺源于管理层对风险缺乏理解。\n\
  \n这本书的结构首先是向你（即 `CIO`）提供关于招聘网络安全领导者时常犯的错误的见解。随后是一个五步框架，从设定你的议程到找到那个符合组织需求的战略性员工。它回应了关键问题：如何吸引高质量候选人、对评估候选人安全技能所需知识的担忧，以及如何减少董事和利益相关者应对网络风险的压力。\n\
  \n# 问题\n\n在我的研究中，`CIOs` 经常提到招聘安全领导者的指令是基于对抗全球安全威胁的愿望。董事会、审计和风险委员会、首席执行官，有时前任 `CIOs`\
  \ 请求这个新的领导职位，但并不理解需要什么技能、公司的安全状况以及如何找到能够留下的优秀安全人员。\n\n是什么阻止了 `CIOs` 招聘和留住组织所需的网络安全人才？常见问题包括：\n\
  \n*   在将招聘交给人力资源经理或猎头之前，未能识别出需求\n*   根据组织“想要的”而非“需要的”来编写职位描述\n*   寻找一个能够胜任超过一人职责的候选人\n\
  *   职位描述由不熟悉保障组织所需工作的人编写，且与业务战略脱节\n*   来自董事会和其他利益相关者的压力，要求 `CIOs` 应对网络风险以安抚股东和客户\n\
  \n一旦职位发布，又引发了进一步的问题：\n\n*   广告没有吸引到高质量、合格的候选人\n*   候选人可能符合文化契合，但面试官对其技术技能并不确定\n\
  *   对候选人的预期不明确\n*   候选人在某些领域很强，但在其他领域缺乏技能\n\n# 有效招聘的五步框架\n\n我们如何克服这一长串问题？以下框架将帮助你对该职位设定合理的预期，然后评估候选人的技能：\n\
  \n1.  **清晰（Clarity）—— 建立你的议程**：从你和利益相关者的角度来看，组织的安全状况如何？这如何影响你招聘的人？\n2.  **同理（Compass）——\
  \ 你希望该职位向什么方向发展？**：基于你的议程，你对这个人的有什么期望？你的组织需要哪些技能？\n3.  **连接（Connection）—— 如何招聘**：从初始搜索到面试阶段，再到向候选人提供职位。\n\
  4.  **承诺（Commitment）—— 对候选人做出承诺**：一旦候选人接受了你的录取，他们需要什么支持？\n5.  **辅导（Coaching）——让你的新员工融入组织**：当你招聘的人入职时，向他们简述议程，重申预期并设定目标。提供辅导和导师支持，以便更平稳地过渡到该职位。\n\
  \n\n\n\n\n*   专注于事件的预防、检测和响应，并与审计和风险委员会沟通，确保网络风险正得到妥善处理。\n*   协作、影响和启发。\n\n那么，如何建立这种确定性呢？\n\
  \n## 困境\n\n“大多数人在规避问题上花费的时间和精力，比在尝试解决问题上的多得多。”\n\n亨利·福特，福特汽车公司创始人\n\n本节针对 CIO 在聘请网络安全领导者时常见的常见问题提供了一些见解。通过观察那些长期处于空缺状态职位的招聘广告，以及发送给招聘猎头的、不符合该职位要求的数百份申请，我发现了三个反复出现的问题：\n\
  \n### 1 安全被视为一个 IT 问题\n\n聘请专家和管理安全的责任仍被认为是一个 IT 问题，通常是 `CIO` 的责任。他们评估候选人的能力差异很大，除非他们明确自己的目标，否则可能需要很长时间才能填补该职位。\n\
  \n`CIO`s 拥有一套复杂且多样化的职责。他们需要考虑公司每个部门的战略。他们必须承担风险以驱动创新，但同时又要关注风险缓解以满足安全需求。这可能导致 `CIO`s\
  \ 在照顾业务和客户需求之间产生冲突。为了做到这一点，他们需要一个强大的顾问团队来引导并教育他们实现业务目标的新方法。\n\n对于 `CIO`s 来说，如果安全是一项新责任，额外的挑战在于，最初管理安全的预算可能需要从其他\
  \ IT 资金中“挤”出来。一个简单的钓鱼测试订阅每年就要花费 50,000 美元，没有多少 IT 预算会有这笔钱，更不用说用于安全监控的大额，或是处理事件告警或风险评估结果的人员了。中型组织的平均安全预算为数十万美元，因此从其他计划或优先事项中拨用这笔资金将影响底线。\n\
  \n`SANS Institute` 是全球最大的 IT 安全培训、认证和安全文档来源。他们的《2016 年安全支出趋势报告》发现，自 2014 年以来，安全支出通常占公司总\
  \ IT 预算的 4–6%。但预算在 10–12% 范围内的公司数量正在增加。[2]\n\n然而，随着安全支出需求的增加，整体 IT 预算似乎在下降，中型组织的预算范围在\
  \ 100 万至 1000 万美元之间。[3]\n\n说到支出，谁来为清理安全泄露买单？`Australian Cyber Security Centre` 表示，“遭到破坏的成本几乎比预防措施要贵得多”，[4]，因此，拥有一个专门的安全预算（而不是拼凑出来的预算）用于早期事件检测等事项，正成为保护贵组织的关键。\n\
  \n### 2 你们的组织无法吸引高质量的候选人\n\n这通常是因为职位描述过于宽泛，要求一个人兼任多人的角色，并执行多项安全功能。\n\n信息安全主管（或确切地说是首席信息安全官）所需的技能，可能与那些需要审查代码或评估技术细节的人不匹配。\n\
  \n### 3 董事会压力\n\n董事会对网络安全表达担忧是非常重要的，这样你就能了解他们的立场；然而，恐慌和直觉反应是没有帮助的。`Australian Cyber\
  \ Security Centre` 发现，董事会和高级管理层定期讨论安全性是一个关键因素。\n\n解决这些反复出现的问题引出了一个核心问题：你如何才能找到并留住优秀的网络安全人才？\n\
  \n\n\n\n\n有多少企业在招聘开始之前会花时间了解自己的安全态势、业务所需的技能，以及通过安全职位可以增加哪些价值？从求职者对可用职位的角度来看，有多少候选人真正知道如果他们入职成功，自己将将面临什么样的局面？\n\
  \n保障业务安全可能让人防不胜防，尤其是当从零开始时。一旦你的组织确定了需要将安全成为业务运营模式的一部分，该如何着手呢？是应该采取大动作并寻求深度的风险评估？还是应该考虑为期三年的战略实施？又应该聘佣一名信息安全主管？\n\
  \n帮助你识别贵公司信息安全面貌的最佳方法是什么？与其采取上述那种“大干过场”的方法，组织可以从询问业务中的关键人员安全对他们意味着什么、他们对安全计划有什么期待、安全如何与业务战略对齐，以及在考虑到所有竞争性优先事项的情况下，安全计划在组织中应处于什么位置。当你想象与\
  \ CEO、营销人员以及那位压力巨大的 IT 运营主管进行这些与安全相关的对话时，我能感觉到你正在翻白眼。但如果让有人从组织的每个角落收集意见、信息和愿景，以回答这些困难的问题，就能让那些决策者确立对安全的真实价值认知。\n\
  \n我们已经了解到，告诉领导者、工程师和任何愿意听的人安全意味着什么，往往会换来叹息、不情的顺从或恐慌。如果我们给予业务部门机会表达他们对安全的看法——以及他们对安全的了解（这通常只是他们在媒体上看到的））——这些信息将形成一个基础，新入职的安全领导者可以在此构建他们的路线图，了解谁还会支持安全，并确定信息安全成功对你的组织意味着什么。\n\
  \n从建立组织的安全议程开始，将有助于你未来的团队与业务优先事项保持一致。是的，会有一些艰难的对话和令人不安的沉默，但如果这意味着共同达成了一条前行的道路，它们难道不值得吗？\n\
  \n## 1. 行业现状\n\n“围绕网络安全的对话正在发生变化——风险被更好地理解，机会得到了更好的实现。”\n网络安全圆讨会议在线新闻报道，2017 年 4\
  \ 月 24 日，澳大利亚总理及内阁部\n\n在澳大利亚，正形成日益统一的战线，将应对网络安全风险作为保护我们边界（虚拟或其他边界）的一部分。\n\n在商业领域，越来越多关于网络安全的对话正帮助组织为潜在的网络威胁做好准备。在一项政府调查中，81%\
  \ 的组织意识到所有员工都有责任确保网络安全，且总体上 73% 的组织在最高管理层级定期讨论网络安全。[6] 转向能够自信地向董事会汇报并为其成员提供确定性的资深安全领导者，已成为网络韧性组织的必要选择。\n\
  \n然而，企业发现安全领导者难以寻找，而且行业面貌的变化比以往任何时候都更有要求。以下数字展示了一些挑战：\n\n* 在美国，随时有 350,000 个网络安全专业人员职位空缺。[7]\n\
  * 78% 的 AISA 成员认为，缺乏清晰度导致了招聘的困难。[8]\n* 由于增长空间有限导致招聘困难；52% 的人报告其团队保持不变或增长率低于 10%。[9]\n\
  * 澳大利亚在未来十年内可能需要额外约 11,000 名员工——包括技术性及非技术性职位——仅仅为了满足“业务常态”的需求。[10]\n\n单这些统计数据就足以让招聘尝试变得望而却畏。但正在产生更多的研究，指导政府、大学和企业去：\n\
  \n* 吸引、培训和留住更多女性（详见第 6 章）。女性仅占网络安全劳动力的 11%（而在普通劳动力中占 48%），[11]\n* 协作；参与。\n* 处理持续发展问题并获得导师指导。\n\
  \n### 核心要点\n\n我们对组织预期与可用网络安全之间的差距比以往任何时候都更加清晰。有很多机会通过识别和指导下一代人、直言安全的重要性来解决这个问题。\n\
  \n[6] 同上。\n[7] Maria Korolov, ‘Look beyond job boards to fill roles’, CSO Online,\
  \ IDG Communications, 2017 年 7 月 13 日, `https://www.csoonline.com/article/320668/it-careers/firms-look-beyond-job-boards-to-find-cybersecurity-talent/`\n\
  [8] ‘The Australian Cyber Skills Shortage Study 2016’, AISA Research Report, Australian\
  \ Information Security Association, `https://www.agix.com.au/wp-content/uploads/2016/12/AISA-skills-age.pdf`\n\
  [9] 同上。\n[10] ‘Challenges to Australia’s Cyber Security Industry’, Australian Cyber\
  \ Security Growth Network, 2017, `https://www.acsgn.com/cyber-security-sector-competitiveness-plan/challenges-australias-security-industry/`\n\
  [11] Patrick Howell O’Neill, ‘Women paid less than men at every level of cybersecurity\
  \ industry, report says’, Cyberscoop, 2017 年 3 月 15 日, `https://www.cyberscoop.com/women-in-cybersecurity-wage-gap-report/`\n\
  \n\n\n\n\nhttps://www.csoonline.com/article/3206688/it-careers/firms-look-beyond-job-boards-to-find-and-recruit-cybersecurity-talent.html.\
  \ 8《2016 年澳大利亚网络安全人才短缺研究》，AISA 研究报告，澳大利亚信息安全协会， 10《澳大利亚网络安全行业面临的挑战》，澳大利亚网络安全增长网络，2017\
  \ 年 4 月。\n\n在商业领域，关于网络安全的讨论日益增，这有助于组织为潜在的网络威胁做好准备。在一项政府调查中，81% 的组织意识到所有员工都有确保网络安全的责任，总体而言，73%\
  \ 的组织在高级管理层定期讨论网络安全问题。6 对于具有网络韧性的组织来说，培养能够自信地向董事会汇报并为其成员提供确定性的高级安全领导者已成为必迫需求。\n\n\
  *   78% 的受调查的 AISA 成员认为，对所需技能缺乏清晰认识导致了网络安全职位招聘的困难。8\n*   美国随时有 35 万个网络安全人士的职位空缺。7\n\
  *   由于工资限制和倾向于空缺职位而导致的招聘困难，与网络安全团队增长有限的证据是一致的；52% 的人报告其团队规模保持不变或增长不足 10%，而超过 11%\
  \ 的受访者报告人数有所减少。9 9 同上。11 Patrick Howell O’Neill，“报告显示，网络安全行业各层级的女性薪水均低于男性”，Cyberscoop，2017\
  \ 年 3 月 15 日，https://www.cyberscoop.com/women-in-cybersecurity-wage-gap-report/。6\
  \ 同上。\n\n### 2\n\n### 你的初心是什么？\n\n“如果你仅仅因为他们能做某项工作而雇用他们，他们是为了钱而工作。但如果你雇用那些相信你所信仰的人，他们将付出血水和泪水为你工作。”\n\
  西蒙·斯涅克（Simon Sinek），作家\n\n当我开始询问首席信息官（CIO）聘请安全专家是为了解决什么问题时，答案并没有让我感到意外。如“审计和风险委员会告诉我们，最近的审计显示我们需要更好地处理网络风险，这包括聘一名领导者来负责”之类的回答很常见。有些回答侧重于领域专业知识，即拥有专家来定义战略并降低组织的安全风险。\n\
  \n一些较不常见的回答是，需要一名安全领导者为 CIO 提供建议，并且安全意识是其职责范围的关键。\n\n绝大多数人谈论的是保护客户。作为建立安全团队和安全领导者的理由，这是一个极佳的切入点。如果你将保护客户置于你工作的核心，那么你的存在意义（reason\
  \ for being）将与销售、营销、财务和运营团队的初衷相似：留住客户。保护客户也意味着维护你在市场上的声誉，并确保系统在威胁和事件期间持续运行的韧性。\n\
  \n本章的重点是，无论你引入安全领导者的理由是什么，你都准备好支持这位领导者去实现其目标的追求。\n\n### 3\n\n### 安全成熟度\n\n“先寻求理解，再寻求被理解。”\n\
  斯蒂芬·柯维（Stephen Covey），《高效能的七个习惯》\n\n在职业生涯中，我很幸运能够进入那些已经构思好战略（或拥有策略骨架）的角色。然后，我会花时间审查文档，确保战略符合业务、与业务战略保持同步、是现实的，并且是我可以引以为傲的交付成果。作为一个进入组织的新领导者，这给了我很大的信心：在缺乏安全领导者或团队的情况下，组织已经投入精力了解自己的安全成熟度以及他们可能需要做的事情。在决定承担哪些职位时，这无疑是一个“加分项”。\n\
  \n\n\n\n现有的策略总是会受到执行者的影响，有时我会对其做出调整，以确保我们正引导组织的安全工作朝着相关的方向发展。此外，我的优势在于安全意识、领导力以及与组织各层人员的沟通。如果任何策略遗漏了这些关键要素，我会确保计划并实现安全和\
  \ IT 团队之外的沟通。\n\n任何新任领导者都希望在组织中留下自己的印记。他们如何做到这一点取决于他们自己。但拥有一份形式的计划有助于引导新任领导者了解组织的安全风险，以及哪些问题需要优先扑灭。\n\
  \n这并不需要投入大量的时间和资金。在本书的指导下，大多数首席信息官（CIO）都能确定组织的高层关注点。在面试阶段，请确保你提供了足够的洞察，让新的安全领导者知道他们处于什么样的环境，以及他们可以专注于哪些快速胜利。\n\
  \n## 大石头（The Big Rocks）\n\n我将这些领域称为“大石头”。斯蒂芬·柯维维（Stephen Covey）谈过生活中的大石头，这个想法源于他。本质上，大石头是关注点，是能够产生最大影响的需要解决的问题。虽然总会有“沙子和小石子”的空间，但解决大石头可以消除你组织可能感受到的大部分安全痛点。\n\
  \n接下来的几章将帮助你理解如何识别这些大石头，我建议准备三个。在很多情况下，它们会很快变得清晰。以下是从经验中以及通过对 CIO 的访谈中获得的示例。这个清单绝不是穷详尽的。\n\
  \n#### 在初创企业中\n安全领导者的重点可能放在供应商管理、应用安全、第三方合作安全以及基础网络安全上。涉及合规性和审计的可能性可能较小。\n\n####\
  \ 在新数字化的组织中\n应用安全、事件响应、安全意识和云安全可能是大石头。\n\n#### 在公用事业机构中\n大石头可以定义为理解 IT 和 OT（运营技术）安全、安全意识以及安全监控/事件响应。\n\
  \n### 议程（The Agenda）\n\n大石头构成了议程的主体。议程并不是策略。我重复一遍，议程不是策略。议程为新任领导者设定了背景，并提供了一些事实、观点和背景，让他们在最初几个月里以此为锚点。议程构成了新领导者交接文档的大部分（在第\
  \ 17 章中讨论）。想象一下，作为首席财务官加入一个组织，却没有人给你关于公司财务状况的想法。你没有员工，没有背景，只有一些过时的政策，并且负着保持组织财务安全的全部责任。这就是安全人员每天面临的局面，如果我们努力为他们提供一份可以快速起步议程，这不仅造福于新领导者，也造福于他们的部分同僚。\n\
  \n给新任安全领导者交一叠审计报告并不等同于为他们提供一份安全议程。后者的目的完全不同。虽然审计报告提供了重要的背景，并对关键风险和建议的修复措施提供了清晰的说明，但它们不能替代一个在制定时考虑了超越合规之外内容的议程。\n\
  \n议程可以涵盖与领导者访谈的细节；安全对于组织价值观、使命和战略方向的反思；当前安全状况以及已实施措施（政策或技术控制）的细节；大石头；领导者对所需安全领导者类型的意见，以及一些有价值的信息。\n\
  \n#### 核心收获\n议程提供了一组关于安全状态的事实。虽然它不是策略、审计或风险评估，但它整合了信息，为新领导者提供了一个战略起点。\n\n### 其他人怎么说，第一部分\n\
  \n“弄清楚比推测更明智。”\n马克·吐威（Mark Twain），作家兼企业家\n\n将将你的议程精炼为“大石头”的主要活动之一，是确立你的领导团队（以及其他利益相关者）如何看待安全。这不仅仅是和他们边喝咖啡边聊他们的大致想法。而是向他们中的每一个人提问相关的问题，以建立主题和思维上的不一致之处。这些讨论将在执行者和员工之间进行。此类员工可能包括但不限于顾问、承包商，以及负责安全威胁和风险相关的系统、数据信息的永久员工。\n\
  \n你问的问题会因组织而异，并取决于成熟度。问题有助于识别重大差距在哪里，以及你在哪里能获得最大的支持。例如，如果 CEO 不认为网络安全是风险，但所有其他领导者都是如此，那么你需要集结的力量将非常不同。\n\
  \n作为 CIO，你拥有很大的筹码，并且可能与领导团队保持着相当特殊的关系。在提问这些问题时，这可能是利也可能是弊。你可能需要在对话开始前设定一些参数，以确保获得开放、诚实的反馈。或者，你也可以直接请一位更中立的人代表你提问。\n\
  \n无论何种方式，你都需要原始、具体的数据，以帮助确定重点应该在哪里，以及现在及近期需要什么样的安全领导者。我之所以说“近期”，是因为现在需要的安全领导者与两年后需要的非常不同，因为网络安全变化很快。而且在两年后，让你的领导者忙碌的事情将与他们到来时不同，特别是如果他们是从唯一的安全运营人员开始在组织的工作。\n\
  \n以下是一些你可能考虑的问题。这些问题没有特定的顺序，只有你才能判断它们是否相关，或者你是否需要问不同的问题来识别“大石头”。\n\n*   你认为信息安全负责人或首席信息安全官（CISO）应该负责什么？\n\
  \n\n\n\n\n*   你认为安全应该如何融入整体业务战略？（这在某种程度上是一个陷阱问题。你希望安全不会被描述为一个战略支柱，而是被视为业务运营方式的基石——就像文化和价值观一样。（顺便提一下，我见过一些尚未成熟到可以“奠定”基石的组织，它们在安全成为业务模式之前，需要先有一个战略目标）。）\n\
  *   你认为组织最大的/第一大风险是什么？这可以是任何你认为是最大的风险，不一定是指与安全相关的。\n*   你认为业务部门对项目和方向上引入更安全的叠加层将会有何种反应？\n\
  *   有哪些安全实践是你们部门特有的（如果有的话），它们是否有效？（有些人可能不知道这个问题的答案，这证明了有必要去沟通并实施那些可能在某处吃灰的政策。）\n\
  *   谁对安全负有最终责任？（这将告诉你，如果发生重大的泄露或其他安全事件，安全将如何如何被看待）。\n*   我们应该优先教育谁，客户还是员工？\n*  \
  \ 你认为安全是市场的一种差异化优势吗？\n*   新的安全负责人应该向谁汇报？（虽然 CIO 通常是自然人选，但有时是 CFO、CEO、首席风险官、首席技术官，甚至可能不是\
  \ C 级高管）。\n*   你希望领导者具备什么样的特质或属性？（这将让你了解这位新领导所处的环境。一个影响者、一个启发者、一个冒险者、一个独立、多才、具备技术意识或精通技术技能的人——这些不同类型的技能和经验可能帮助领导者取得成功。）\n\
  *   组织是如何管理变化的？\n*   你还建议我与谁交谈并向他们提出这些问题？（对话可能会引出你没有考虑过的人）。\n\n如果你有任何这里没有列出的、你想讨论的新问题或疑虑，请发送至\
  \ info@27lanterns.com。这也有助于我们通过新鲜、新的案例来帮助他人。\n\n在进行这些访谈时，我发现的一点是存在许多共同点。在一家组织中，我访谈的\
  \ 20 位领导和利益相关者中，有 15 人表示他们组织的安全工作太被动，他们觉得需要更加主动才能看到变化。显而易见的是，他们希望安全透明度更高，并且预防事故而非响应事故。我合作过的另一家公司也达成了共识，即\
  \ CEO 对安全负有最终责任，但他并不知道这一点；他也不知道这种责任要求他做什么。\n\n这些反馈可以提交给董事会、执行层、审计委员会——任何愿意听的人。这些问题的答案对于新入任的领导者来说也是金子。了解组织内部如何看待安全，以及领导者如何看待安全，这些是非常重要的。在最近一次框架交付中，我将访谈记录朗读给一位新入任的网络安全主管，帮助她构建组织框架。我保持对话氛围轻松，并对我的速记进行了详细说明，以便她能从分解的意见中获得最大的价值。她获得的洞察是巨大的。在面对面见到许多利益相关者时，她能够产生共鸣，因为她理解了他们的一些顾虑以及关于传播安全意识的想法。\n\
  \n#### 核心收获\n\n在生活中，他人的想法并不总是重要。但在安全领域，知道谁从第一天起就会支持你，谁是你需要赢得挑战，可以决定安全计划的成败——以及领导者及其任期。有时，最重要的洞察来自最意想不到的地方。听听利益相关者对安全和风险的看法，可能会挖掘出一些可以加入你议程的宝贵行动——以及负责执行它们的人。在时间允许的情况下，针对尽可能的相关人员，以确保你拥有组织的良好代表性。\n\
  \n#### 5 对齐业务战略\n\n“仅仅将网络安全视为一个 IT 问题，就像认为一家公司从 CEO 到底下的所有员工都是人力资源问题一样。”\n\nSteven\
  \ Chabinsky，White & Case 律师数据、隐私与网络安全全球主席\n\n如果你读过第 2 章，就会知道这份议程本身并不是一种战略。议程只是一个起点。将你的议程与整体业务战略对齐是非常重要的。我指的不是将安全包含在战略中（关于更多信息请参阅第\
  \ 2 章）。当我说“重要”时，我的意思是“必不可少”。新入任的领导者应该能够将议程中强调的安全活动直接与组织的战略、目标、使命和任务联系起来。本质上，安全没有选择，必须根据组织的商业驱动力前进。\n\
  \n记录并交付一份与业务战略对齐的网络安全议程，将为新入任的领导者提供一个起点和一个基础，以此构建详细的信息安全战略。\n\n当涉及到议程的战略对齐时，有几点需要考虑：\n\
  \n1. 首先，你们从事的是哪种业务？初创公司？还是历史悠久的标志性品牌？你们处于什么行业？组织正在经历多大程度的变化？（此列表绝非详尽。）答案将帮助你理解自己的风险。\n\
  2. 业务在一年计划中的终极目标是什么？这可能是客户/成员增长 50%、比竞争对手获得更多利润、成为行业第一、成为首选雇主……等等，以此此类推。\n3. 思考安全将如何为业务战略增加价值。组织最关心的是什么？\n\
  \    1. 如果是维护客户的信任，保护他们的数据就是关键。\n    2. 如果是在研发领域保持领先，知识产权的保护和机密性是重点。\n    3. 如果你是内容提供者，你必须优先数据和服务的完整性和可用性。\n\
  \n考虑到这一点，将业务最关心的点转化为安全议程的焦点点。如果整体业务战略是从传统的模拟组织向数字化转型，你可能有开发者向公共网站或 App 提交代码。如果是这样，且他们没有按照安全代码规范进行编码，那么你的重点任务之一可能是审查应用程序安全。这可能影响你选择的领导者类型，或他们建立的团队类型。\n\
  \n如果你是一家处于指数级增长的初创公司，你的整体战略计划可能包括继续这一轨迹。然而，你可能在使用一些在你们“年轻”时适合存储数据的工具和系统。随着你的增长，这种做法变得不可持续。如果这些数据是敏感的或包含私人信息，你新领导者的首要任务将是建议保护这些信息的安全实践，既是为了客户，也是为了符合隐私法律。在这种情况下，一个重点任务之一就是数据安全/保护。\n\
  \n作为额外，正确的这种对齐将为你的沟通计划提供支持，因为你的安全信息不仅仅是关于拥有安全的密码和不点击链接。它是关于安全在推动业务发展方面的作用。\n\n####\
  \ 核心收获\n\n议程不是战略。它是一个起点，用于考虑安全如何为业务在未来 12 个月内要实现的目标（当然，是指日常工作之外）增加价值。\n\n\n\n\n\
  只有在发生重大泄露且确保组织安全成为未来可预见的首要策略时，这种情况才会改变。\n\n如果你读过第 2 章，你就会知道议程（agenda）本身并不是为了成为策略。议程是一个起点。将你的议程与整体业务战略对齐非常重要。我所指的并不是将安全纳入战略中（关于这方面的更多信息，请参阅第\
  \ 2 章）。当我说“重要”时，我的意思是“必不可少”。新上任的领导应该直接将议程中强调的安全活动与组织的战略、目标、使命和任务联系起来。从根本上说，安全必须根据组织的商业驱动力向前发展。\n\
  \n# 第 2 节\n\n## 罗盘：你的目的地在哪里？\n\n> “变革的秘诀在于将你所有的精力集中在建立新事物，而不是与旧事物战斗。”\n> — 苏格拉底\n\
  \n### 框架的第二部分是 `Compass`\n框架的 `Part 2` 是 `Compass`，关于根据你的议程理解你正在走向哪里。此外，根据整体业务战略，你的组织需要哪些技能？\n\
  \n当我们制定计划时，往往会高估我们能实现的目标，而低估实现这些目标所需的资源。这对于大多数工作和生活方面都是如此，对于安全领域也是如此。\n\n是聘雇一名安全专业人士还是一个团队，将决定个人或个人可以承担的工作量、任务多样性，以及他们对某些活动需要参与的程度。由于本书侧重于聘用领导者，我的建议是将精力放在安全改进的基础性、可衡量的领域，这些领域要与组织的优先事项和关键风险对齐。这将确保你的计划与真正重要的事情相关，并使安全成为组织整体战略实现的一部分。对你的组织能够实现的变革以及实现这些变革需要什么保持诚实，这样你更有可能聘到一位能够在未来一年内执行强有力且可见的计划的安全领导者。\n\
  \n## 去向何方？\n\n> “目标设定正确，就成功了一半。”\n> — 齐格·齐格拉，作家\n\n接下来的二三章将紧密配合。你通过聘用网络或信息安全专业人士想要实现的目标，与你认为成功的候选人中不可妥协的技能和特质密切相关，因此决定了真实的职位描述应包含的内容。\n\
  \n在向潜在候选人“推销”这份工作时，思考你想实现什么是非常重要的。诚实地说明他们的角色、他们为何出现在组织中、他们将如何获得支持以及对安全功能的认知，对于选择正确的候选人至关重要。\n\
  \n我在许多组织中工作过，有些拥有充足的安全资金，有些则没有。有些组织中安全领导者的角色是团队深思熟虑的补充，而另一些组织中安全领导者占据着唯一的安全职位。\n\
  \n通常，当一个职位新创建时，往往是因为发生了大规模的泄露/事件——这并不总是毁灭性的，但足以震动组织采取行动——或者是审计委员会的发现、来自焦虑董事董事的指示，或者是\
  \ `CEO`/`CIO`/`CTO` 认为需要安全领导者的直觉。如果是替换现有的领导者，通常会进行关于重新证明该角色存在之必要性，以及是否有方法让现有员工吸收该角色的讨论。理想情况下，吸收该角色是不可能的，因为领导者扮演的角色与技术工程师、分析师或顾问有显著不同。\n\
  \n通过对无数招聘广告和职位描述的审查，以及通过安全活动中的交流，我明显感觉到，聘用安全领导者追求的是四个主要结果。这些结果并不都体面。\n\n### 为了满足审计发现\n\
  如果你聘用网络或信息安全主管仅仅是因为审计报告建议你这样做，那么他们永远无法实现比“安全良好表象”之外的任何成就。他们可能变成一个形象人物，让业务看起来在保护自己和客户，但实际上并非如此。\n\
  \n创建议程并让业务看起来在保护自己和客户，但实际上并非如此，这种做法可能让他们变成一个形象人物。创建议程并让执行团队和利益相关者对安全产生认知是首要的，可以利用审计意见作为杠杆，但它不能是唯一的理由。作为\
  \ `CIO`，你需要对该领导者所能实现的内容表示信任，并提供更多的支持。如果领导者把所有时间都花在回顾，他们将永远无法进行规划、保护组织并展望未来。\n\n\
  ### 用人员满足安全需求\n如果你仅仅是因为审计报告建议而聘用一名网络或信息安全主管来解决组织的所有安全问题，他们注定会失败（或离开）。这是考虑安全的另一个理由：你希望优先关注哪里？这个新领导者可能需要一个团队，或者至少一个实践社区，让那些不向安全主管汇报的人汇聚在一起，确保他们拥有共同的目标。\n\
  \n### 合规\n许多法规和法律要求特定组织拥有专门的安全或网络安全负责人，即被指定负责安全的人员。为了合规招聘通常是以提名内部员工的形式进行的。这个人并不一定具备应对风险或事件的技能、知识或关注，但他们的名字会出现在文件中，任何合规性审计将得到满足。\n\
  \n### 确定性和信心\n压倒性的，最常见的回答可以总结为类似这样，一位澳大利亚 `CIO` 在被询问为何聘用安全领导者时给出的回答：“这意味着有一个专门的专家，其唯一职责是降低组织的安全风险。”\n\
  \n在研究聘用安全领导者的目标期间，一些 `CIOs` 给出了以下回答。你会对其中任何一个产生共鸣吗？\n\n* 有安全领导者提供了组织的关注点和优先级。\n\
  * 它确保我们有一位能够在管理和执行我们的网络安全活动方面定义清晰的战略并引导方向。\n* 没有领导者，危险在于我们无法采取整体方法，投资会由于个人部门的优先事项或偏好而过度或不足。\n\
  * 我们需要一位有能力的捍卫者，其唯一任务是确保安全受到重视，并在最重要的领域进行适当的投资。\n\n\n\n\n目前的 IT 安全经理专注于关注政策和合规性，如果没有更资深的领导者，安全工作将仅仅停留在职能层面。\n\
  \n### 核心要点\n无论你的目标是什么，请确保它是经过深思熟虑的，尊重你聘用的安全人才，并且基于关键利益相关者能够且愿意支持的议程。\n\n## 7. 哪些技能和结果是不可妥协的？\n\
  \n借用第 5 章的一个观点，通常新的安全领导者会被赋予许多职责。这可能是因为组织之前从未有人处理过网络风险。这导致人们对一个人能完成什么缺乏理解，因此赋予了他们过宽的范围。也可能是因为资金仅够容纳一名安全人员，而选择一名领导者被视为最佳投资。最后，也可能是计划了一个团队，但目前安全负责人承担了所有的责任。\n\
  \n这些给新领导者堆积任务和结果的理由是完全合理的。然而，这种做法并不明智也不合理，一份清单式的职责可能会吓跑优秀的候选人。（第 8 章将对此详细介绍）。\n\n\
  在你的长期战略和团队尚遥远不可及的时候，在面试候选人时清楚哪些是不可妥协的、哪些是可以商量的非常重要。这意味着建立第一天所需的技能和能力。在评估你的不可妥协项时，请务必将此牢记在心。\n\
  \n其中大部分内容在约定职位描述内容时会得到考虑。以下是我的客户要求的的一些不可妥协的技能/经验示例：\n\n*   候选人必须曾领导过/交付过安全战略。\n\
  *   候选人此前必须担任过信息安全负责人。\n*   候选人的经验不能仅来自`[此处插入特定行业]`。（如果招聘经理不希望找一个整个职业生涯都在“四大”度过的人，通常会提出此要求。）\n\
  *   候选人必须向董事会交付过结果/内容（即“准备好面对董事会”）。\n*   候选人必须曾领导过网络安全事件响应活动。\n\n不可妥协因素也可以以属性或品质的形式存在，例如：\n\
  *   韧性\n*   好奇心\n*   耐心\n*   同理心\n*   适应能力\n*   影响力\n\n不可妥协的因素是招聘流程的关键，但它们可能会被忽视，因为候选人看起来太优秀了，以让你愿意妥协那些不可妥协的条款，或者你是因为招聘疲劳而做了选择。这是你最应该避免的。你还需要愿意在审查简历和面试候选人时测试这些因素。要求候选人分享他们展现出每种属性的例子。当你进入流程的相应阶段时，你也将希望向推荐人进行这些测试。\n\
  \n### 那么“加分项”呢？那些第二层级、虽然可以商量但出于文化或职位考虑如果有会好的愿望呢？例如：\n\n1.  女性。（由于几个原因，女性正变得越来越青睐：女性倾向于对自己的角色/团队/工作采取不同的方法；安全行业需要女性；被认为可以满足多样性需求；而且随着女性人数的增加，可以开始改变父权文化，如果那是你所寻求的影响。）网络安全专业人士中仅有\
  \ 11% 是女性，13，据称是因为他们的高等教育倾向于非技术领域、对可用工作缺乏认知、存在歧视以及社会晋升缓慢。当然，聘用女性是因为她们是该职位的合适人选，而不仅仅是因为性别。但由于全球研究所详述的这些原因，女性对该行业的吸引力在降低。\n\
  2.  认证。虽然有人认为某些安全认证有助于确保行业内部使用同一种“语言”，但这些认证并不意味着候选人是一个合格的安全运营人员。这些认证是加分项，但如果候选人其他符合你所有的不可妥协项，则不应据此排除他们。（这也是为什么我将认证放在加分项部分，因为如果它们是不可妥协的，你可能会错过一些没有看到或没有意愿去认证的优秀候选人。第\
  \ 8 章将对此详细介绍。）\n\n几点需要注意的：\n*   不可妥协因素，特别是涉及特质时，应该符合公司的价值观（预期）以及在组织中工作的真实情况（现实）。\n\
  *   如果你是设定不可妥协因素的人，不要太快地委托初试流程。不可妥协因素应在第一次面试中解决/测试，以避免浪费你和候选人的时间。\n*   面试时，在最初的闲聊之后，让候选人先说话。如果你一开始就开始介绍职位、公司以及你招聘他们的所有原因，你就是在为他们写剧本。由于他们不知道你想听什么，比起你用职位要求引导对话，你更有可能获得他们对经历的真实叙述，包括成功和失败。\n\
  \n如果你是读到此的 CIO，我的目的不是教你如何打扫。我意识到，在你职业生涯的这个阶段，你可能已经面试并聘佣了许多员工。本章的重点是，安全领导者以及所有安全专业人员无法履行许多职责，尽管他们经常被要求这样做，即使是短时间内。\n\
  \n所以，如果你设计了从第一天起绝对需要的技能和经验，并让其他不那么紧迫的任务/技能过去，你会更早地获得招聘成功。但请记住，还要设定相关人的预期——特别是当职位是全新的，每个人对领导者应该具备的看法时。（第\
  \ 11 和第 13 章将对此详细介绍。）\n\n### 核心要点\n没有对错。虽然我可能不同意你的不可妥协因素，但这些是你设定的，你每天都要与这个人共事，并且你认为这些是必要条件。记住，不可妥协因素越多，你的市场就越窄。不可妥协因素确保了你寻找的人才至少能满足组织在中期的安全需求。\n\
  \n## 补充材料\n虽然需要你建立自己的需求和不可妥协因素清单，我 2016 年写的关于安全领导者所需素质的这篇博客可能对你有帮助。\n\n### 信息安全领导者的\
  \ 7 个特质\n在安全行业，与其他任何行业一样，在招聘领导者时，有一些特质应该出现在你的不可妥协清单上。信息安全领导者是当今业务中的关键角色之一，不是一个可以雇错的角色。以下是需要寻找的\
  \ 7 个特质，没有特定顺序（第一项除外）：\n\n1.  `诚信`。对于信息安全领导位的候选人来说，这不需要解释。诚信无疑是要寻求的关键属性。此外，诚实、道德、忠诚、一致和负责任都是高诚信领导者可能具备的价值观。\n\
  2.  `能力`。候选人的能力可以通过他们展示的优先级、创新、交付、完成工作的能力以及对组织的证明提升来建立。此外，他们通过工作技能和培训提高能力水平的渴望应该是持续的。\n\
  \n\n\n\n\n### 3. 领导力\n将领导力列为领导者所需的技能可能看起来很奇怪，但除了人员领导力外，信息安全领导者还需要展现出承担责任、解决问题的能力，并激励团队和董事会做出改变并接受新的工作方式。并非所有领导者都是平等的，以前领导过团队的人并不意味着他们就是你组织合适的领导者。\n\
  \n### 4. 人脉/网络\n建立人脉是一项不仅能帮助连接安全社区，还展示了与同仁和利益相关者进行新对话的意愿。人脉可以促进领导者和你的业务，将组织与其他优秀人才联系起来，并突出潜在的合作伙伴关系。\n\
  \n### 5. 技术知识\n专业人士认为自己“不懂技术”的时代已经过去了（我曾犯过这个错）。在数字经济时代，每一位业务领导者（包括安全领域的）都必须具备与组织技术人员交流的知识，以理解并实现组织战略。这并不是意味着找一个能和你最好的开发者一起写代码的领导，但这意味着他们理解技术如何影响更广泛的业务目标。\n\
  \n### 6. 韧性\n对于许多人来说，每天体现上述特质可能会精疲力竭——但确实有候选人能够从容应对。领导安全团队或职能需要对安全事件和业务的快速增长做出快速且明智的反应。这和诚实一样，需要在招聘早期就建立。\n\
  \n### 7. 威望（Gravitas）\n众所周知安全是一个枯燥的、由合规驱动的话题（我知道这很难相信）。具有威望的候选者能够以恰当的严肃和承诺感传递信息，从而赢得尊重。威望不仅在向高级领导和董事会汇报时重要，而且在项目期间提供建议、与第三方谈判以及事件响应也是关键。\n\
  \n一位伟大的信息安全领导者在灾难时期、业务增长以及日常运营中都是至关重要的。基于上述品质进行招聘，将为他们可能需要交付的广泛成果做好良好准备。你正在为你的下一位信息安全领导者寻找这些特质吗？\n\
  \n***\n\n13 Heather Ricciuto, ‘Representation of Woman in Cybersecurity Remains\
  \ Stagnant, Despite Recent Efforts to Balance the Scales’, Security Intelligence,\
  \ IBM, 15 March 2017,\n\n[`securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnantdespite-recent-efforts-to-balance-the-scales/`](https://securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnant-despite-recent-efforts-to-balance-the-scales/).\n\
  \n13 Heather Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant,\
  \ Despite Recent Efforts to Balance the Scales’, Security Intelligence, IBM, 15\
  \ March 2017,\n\n*   女性。（由于几个原因，女性正变得越来越青睐：女性倾向于对角色/团队/工作采取不同的方法；安全行业需要她们；被认为可以满足多样性需求；而且随着她们人数的增加，如果那是你寻求的影响，她们可以开始改变父权文化。）网络安全专业人士中仅有\
  \ 11% 是女性，13，据称是因为她们的高等教育倾向于非技术领域、对可用工作缺乏认知、存在歧视以及社会进步缓慢。当然，应该雇用女性是因为她们是该职位的合适人，而不仅仅是因为她们的性别。但由于全球研究详述的这些原因，吸引到该行业的女性较少。\n\
  \n### 8. 面对现实 – 真正的职位描述\n\n> “如果 NASA 专注于寻找熟练的月球漫步者，我们永远找不到能去月球的人。”\n> 匿名\n\n你是否曾经读过职位描述并好奇他们到底想要的是什么？职位描述（`JDs`）以宽泛而闻名。在某些方面，为了涵盖某一天中可能出现在你办公桌上的各种情况，这是必要的，对吧？但一个过于宽泛的\
  \ `JD` 可能会产生几种后果：\n\n1. 拒掉无法完成列表上每一项任务的候选人\n2. 震慑不想执行列表上每一项/任何一项任务的候选人\n3. 让那些认为任何如此宽泛的职位描述一定没有经过仔细考虑的候选人产生回避情绪\n\
  4. 吸引那些能做到列表某一项并计划应付其他 49 项的候选人\n5. 让合格的候选人望而却步，因为不清楚关键职责是什么\n\n看起来引入更多候选人似乎是一件好事。但实际上，它创造了耗费时间的简历审查，而且对任何人都没有益处。`JDs`\
  \ 不是设定挑战性目标的地方。然而，安全 `JDs` 是我见过的最具挑战性的之一。\n\n以下技能/经验列表摘自某个职位的真实安全职位描述：\n\n*   必须具有构建安全运营中心（SOC）的过经验\n\
  *   负责跨两个国家的组织信息安全战略方向\n*   负责确保符合内部和外部信息安全要求和标准，例如，信息安全策略、`ISO27001` 原则以及相关的认证要求，例如\
  \ `IRAP`\n*   政策和框架开发\n*   计划管理与交付\n*   合规性\n*   事件响应活动\n*   客户监控审计\n*   尽职调查问卷/`RFPs`\n\
  *   强大的运营安全背景\n*   强大的项目管理能力——理想情况下是在供应商或咨询环境中\n*   在需要强大的内部利益相关者管理的环境中经验\n\n`JD`\
  \ 中没有提到团队，因此阅读此内容的候选人会认为这是独立工作，且大部分工作将由他们自己完成。一个 `JD` 寻找运营过安全运营中心、具有战略经验、在供应商或四大事务所工作过、编写过政策并响应\
  \ `RFPs`（征求书）以及确保符合标准的员工——这些真的在未来两年内都需要吗？还是重点是安全运营中心，以培养该领导者成为战略决策者？\n\n侧记：安全行业非常需要教练和导师来培养领导力。全球范围的调查显示，专业人士渴望提供职业增长的机会。\n\
  \n在考虑 `JDs` 时，请考虑短期目标并保持实际。如果你不确定，可以寻求关于编写优秀 `JD` 的建议，以确保你能够吸引到所需的安全领导者。\n\n####\
  \ 关于女性\n\n正如章节开头提到的，2017 年，网络安全领域约有 11%的人是女性，14，取决于你阅读哪项研究。行业内存在强烈的担忧——并有以下研究的支持——这源于女性认为自己无法实现职位广告中的所有项目，因此不申请。\n\
  \n“根据报告，包括经常被引用的惠普（HP）内部研究，HP 的女性只有在满足职位说明列出的 100% 资质时才会申请晋升，而男性只要满足 60% 就会申请。据此推断，高层管理缺乏女性是因为女性缺乏自信。然而，根据\
  \ HP 的发现进行了一项[更近期]的研究，并发表在《哈佛商业评论》的一篇文章中：深入探讨了信心差距现象。调查了一千多名专业男女，并询问：“如果你因为不符合所有资质而决定不申请工作，为什么不申请？”\
  \ \n\n\n\n\n根据调查结果，自信或缺乏自信实际上并不是男女未申请职位的最常见原因。相反，最常见的回答是（46.4%的男性和 40.6%的女性将其选为首要原因）：“我不认为我符合条件，所以他们不会雇佣我，而且我不想浪费自己的时间和精力”。受访者并不是对自己的能力或技能缺乏自信，他们是将职位描述解读为合格候选人必须具备的硬性技能和经验大纲”。15\n\
  \n## 梅根·诺尔\n\n## 扩展行业\n\n如果我们想扩大这个行业，我们需要做几件事。首先，让 `JD`（职位描述）回归真实，明确初期真正的需求。其次，停止将广告作为唯一的招聘机制，多参加社交活动，结识你需要的男女员工。最后，要意识到安全人员来自不同的背景，许多人拥有非常专业的经验。我们需要允许他们向某个角色演变，投入他们的职业发展，并为其留出挑战自我的空间（第\
  \ 12 章将详细介绍）。我并不是建议仅仅因为他们是女性或男性，就聘用无法提供职位所需最低可行产出的不合格候选人，从而让组织面临风险。我建议的是需要新的方法来吸引和留安全专家，而\
  \ `JDs` 在其中起着作用。\n\n## 创建真实的职位描述\n\n为了创建一个真实的职位描述，请坚持你对该人在未来 12 至 18 个月内的要求/期望。你今天需要的安全人员并不是你两年需要的安全人员。安全行业在演变，而且演变速度很快。今天，你可能需要一个具备出色启动技能的人——供应商管理、应用安全、思想领导力以及创造安全文化的创新想法。两年后，你可能需要像他们说的那样“稳定大局”，并考虑合规性、身份管理或收购中的安全问题。\n\
  \n当我询问 `CIOs` 安全态势是否会影响他们的用人标准时，回答各不相同：是；否；也许；不真的。但你不能多年沿用同一个详细的职位描述，并希望安全职能持续增长和繁荣。`JDs`\
  \ 是动态的文档，你仍然根据变化和增长进行调整，而不会削弱职位的核心职责。\n\n### 编写真实职位描述的技巧\n\n除了短期关注点，这里是一些编写更真实的职位描述的技巧：\n\
  \n*   对于哪些是“期望”、“强制要求”和“加分项”要谨慎。仔细考虑你在每个标题下放了什么。你的安全负责人真的需要每一项证书吗？仅仅因为你是一家银行，他们就需要金融服务背景吗？战略规划真的仅仅是“期望”吗？我并不是说这些其中任何一个是错或对的，但要明确你的强制性期望和不可越越的底，并更清楚地明确为了获得一个已经完成\
  \ 75%任务的候选人，你可以牺牲什么。\n*   这份文档是绩效评估所需的，且你将据此管理你的新领导。你承担不起它过于主观的代价。\n*   对工作量和责任设定合理的期望。\n\
  *   明确该职位如何与组织的其他部分相匹配。\n*   明确短期和长期目标。\n*   提供成功的定义。任何过于宽泛的 `JD` 都可能让候选人或员工感到不可逾越，而成功看起来像是一个遥远的绿洲。\n\
  *   在简洁和详细之间取得平衡。超过两三页，你可能会在多个层面上失去读者的兴趣。\n\n## 证书：繁荣还是衰落？\n\n安全认证（如 `CISSP`/`CISM`/`CISA`/`CEH`）正迅速成为职位描述中的常态，作为评估候选人专业知识的可衡量方法以及人力资源部门的筛选机制。然而，安全认证的价值长期以来存在争议。对于在职位描述中要求证书，有许多观点。以下是多年来向我表达的几种观点：\n\
  \n1.  证书是必不可少的，特别是在聘用“技术型”安全人员时，因为拥有相同证书的人聚在一起能够在安全方面使用共同语言。\n2.  例如，`CISSP` 并不容易通过，它有\
  \ 250 道题，长达六小时。但有人认为，安全认证证明的只是你能成功读完一本书、参加一场考试并支付巨额费用，因为所有内容都可以从书中学习。底线是它提供了理论，但没有实战培训。\n\
  3.  如果你处于职业早期，或者在从事其他行业多年后接触信息安全，那么证书是有价值的；然而，考虑到获得证书所需的先决经验年限，对于最需要它的人来说是遥不可及的。\n\
  4.  在所教授的技术、所依赖的平台或遵循的政策方面已经过时的证书是没用的，但评估性的 `CIO` 或招聘经理可能没有意识到这一点。\n5.  针对特定软件的证书（如\
  \ `Microsoft`、`Cisco` 和 `Oracle`）被认为比特定的安全资质更有价值。\n6.  拥有 `MBA` 的安全领导者的价值远比花费相同时间学习\
  \ `CISSP` 或类似课程的人要得多。\n7.  领导经验、人脉关系以及参加相关的行业会议/研讨会，总的来说比五年前获得的证书更有价值。\n8.  认证可以为那些无法自信评估安全候选人的\
  \ `CIOs` 提供基础性的信心。获得证书也显示了他们对安全行业持续学习的承诺。\n9.  有许多不同的证书可供选择。最终，候选人知识的应用比他们获得的证书数量更重要。\n\
  10. 完成过多的证书可能表明缺乏职业重点和规划。认证应该支持你的职业方向，而不是为了满足领导职位的职位描述而获得的。\n\n始终可以选择聘用你认为他们可以满足你的不可越越要求以及一些不紧急要求的人。一旦入职，如果对你作为领导/直属经理意义重大，或者为了让候选人与组织内的安全同事保持一致，可以提供让他们参加认证。投资员工不仅可以提升你的团队水平，还能增加留存率和工作满意度。某些认证并不便宜，无论从财务还是时间投入来看。为你的团队提供在岗位增加技能和知识的机会，对士气和忠诚非常有帮助。\n\
  \n备注：招聘时，某些与证书同等或更高价值的项目包括加入安全的专业机构/组织（`ISACA`、`OWASP`、`Cloud Security Alliance`、`Australian\
  \ Information Security Association` 或当地同等机构）、演讲以及在安全协会担任志愿者。\n\n## 关于职位名称\n\n\n\n\
  \n\n有很多职位名称经常被——通常是出于好意——交叉混用。但安全主管（head of security）甚至与网络安全主管（head of cyber security）或信息安全主管（head\
  \ of information security）不是一回事，而后者与 IT 安全经理也不能与首席信息安全官（CISO）通用。尽力让职位名称具有吸引力，但不要以免让人们不确定自己是否想担任，或者在搜索工作时找不到它。你可能也需要测试市场，如果传统的职位名称无法吸引你想要的候选人，可以考虑更改标题，但要确保它仍然反映了责任的深度和广度。\n\
  \n此外，考虑什么样的候选人会被特定的标题吸引。例如，我本人申请一个标题中带有 `engineer`（工程师）一词的角色毫无信心。我看到一个看似是信息安全主管岗位的广告，在标题中使用了\
  \ `engineer` 一词来吸引更多候选人。有些人曾担任首席信息安全官，但不愿申请经理职位；而有些人可能没有意识到职位为 `CISO` 的职位的资历（因为该职位向\
  \ `CIO` 汇报）。\n\n### 你需要问自己的问题：\n\n*   这位领导者在未来 12–18 个月内需要实现什么？\n*   什么职位名称能清晰地描述该岗位的职责以及权限级别/层级？\n\
  *   我是否需要候选人持有相关证书？这些证书对于衡量候选人之间的水平是否真正必要？\n*   我该如何吸引更多女性候选人，以确保我拥有多样化的候选人池？\n\n\
  ### 核心要点\n\n职位描述承载着多重角色。它不仅详细说明了成功因素，还是产生价值且相关的面试问题的绝佳触发器。它也是企业对支持其中列出的活动的承诺，因此在最终确定之前，先与你的\
  \ C 级同事进行沟通，并谨慎对待你的所愿。记住，在编制 JD 时要考虑职位名称和功能，以及要求的经验如何对申请者群体产生重大影响。如果安全职位标题不符合现有模式，那么你们的人力资源部门可能需要为安全职位标题创建一个新类别。\n\
  \n***\n\n[14] Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant,\
  \ Despite Recent Efforts to Balance the Scales’, 15 March 2017, [`securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnant-despite-recent-efforts-to-balance-the-scales/`](https://securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnant-despite-recent-efforts-to-balance-the-scales/).\n\
  \n[15] Megan Noel, ‘Why women don’t apply for jobs they’re not 100% qualified for\
  \ (but should), The American Genius, 23 February 2016, [`theamericangenius.com/business-news/women-apply-for-jobs/`](https://theamericangenius.com/business-news/women-apply-for-jobs/).\n\
  \n15 Megan Noel, ‘Why women don’t apply for jobs they’re not 100% qualified for\
  \ (but should), The American Genius, 23 February 2016,\n\n“根据调查结果，自信或缺乏自信实际上是男女未申请职位最不常见的原因。相反，最常见的回答（46.4%\
  \ 的男性和 40.6% 的女性选择其作为首要原因）是：我不认为他们会雇佣我，因为我不符合资格，而且我不想浪费我的时间和精力”。调查受者并不是对自己的能力或技能缺乏信心，相反，他们将职位描述解读为合格候选人必须具备的技能和经验的硬性大纲”。15\n\
  \n正如本章开头提到的，在 2017 年，网络安全岗位中约 11% 的人是女性，14 取决你阅读哪项研究。行业内部存在强烈的担忧——并有下方研究的支持——这源于女性认为自己无法实现职位广告中的所有项目，因此他们没有申请。\n\
  \n14 Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant, Despite\
  \ Recent Efforts to Balance the Scales’, 15 March 2017.\n\n# 第 3 节：连接：如何招聘？\n\n\
  > “聘佣最优秀的人是你最重要的任务。”\n> —— Steve Jobs，苹果公司（Apple Inc.）创始人\n\n框架中的任何部分都不比其他部分重要。你在此为止为了理解对你和组织重要的事情、以及你绝不会妥协的事情所做的工作，将为你招聘流程的核心提供有力帮助。当你对自己想要的东西有清晰的愿景时，面对大量候选人可能会令人沮丧甚至挫败。但当你看到每个人的潜力时，它也可以让你倍感振舞并深受灵感。正如我在第\
  \ 2 部分所说，要有一些不可逾越的底，如果文化契合度远大于任何你能教给或通过教练引导领导者的东西，也要留出回旋余地。显然，完成工作需要经验。但如果你能发现成长空间，这对你才华横溢的员工来说是一个巨大的机会。\n\
  \n框架的第 3 部分完全关于与合适的候选人建立连接。寻找和留住网络安全专业人才开始决定你如何寻找候选人——你自己、通过猎头或使用内部人才团队。从最初的搜索到面试，最后向某人提供职位。与正确的人建立联系是关键。连接的要素包括：评估候选人的匹配度（技术和文化）、合适的联合面试官，以及意识到你直觉上是正确的，尽管该职位对他们来说是一个挑战。这是一个艰难的过程，也是你无法犯错的过程。\n\
  \n### 给招聘人员的话\n\n> “花在招聘上的时间是值得的。”\n> —— Robert Half，招聘行业先驱\n\n在任何一天，在 LinkedIn\
  \ 上，你可以读到一些直白、厌倦的帖子，关于“潜在候选人”被猎头推荐他们完全无法胜任的职位。或者是 10 年前做过的职位。或者被联系是因为他们是女性（或者因为他们不是）。\n\
  \n自从 2016 年离开公司工作开始自己的业务以来，我在 12 个月内至少被招聘联系了五次，他们说：“我们只是想知道你的业务进展如何了，因为我们有一个非常棒的职位。我们知道你现在做咨询，但你可能仍然对一份正式工作感兴趣。”这最令人沮丧的部分是，对于某些职位我不符合资格，或者我资历过，但因为我对安全充满热情，他们似乎认为他们的职位能让我离开自己的咨询业务回归行列。我礼貌地拒绝了，但我确定他们挂掉电话后会打给下一个符合他们寻找职位的人。\n\
  \n许多招聘人员是第一个承认他们不知道如何招聘这些职位的人。安全职位对于人力资源和招聘人员来说是全新的。当安全人员谈论技术问题时，他们的眼神会变得呆滞。他们不理解一个安全领导者的技能可能与另一个完全不同，尽管他们拥有相同的头、薪级和行业年限。完全有可能一个\
  \ `CISO` 无法直接胜任另一个人的工作。\n\n\n\n\n有很多优秀的招聘机构，他们有很多安全职位需要填补，因为他们是雇主委员会的成员，并合同负责填写该雇主要求的任何职位。对于专攻安全领域的招聘人员来说，这可能让他们感到沮丧，因为他们无法参与委员会流程，因此无法为这些组织提供专业知识。此外，如果委员会招聘人员无法填补职位，首席信息官（CIO）通常会独立走向市场，但如果他们没有先进行书中建议的艰难谈话并做好准备工作，这通常同样充满问题。\n\
  \n你的准备工作具有巨大的价值，即为组织未来的安全状况做准备，并以此推导出你需要什么样的领导者。如果你能完成这些准备工作，并在你的人力资源团队的支持下进行内部招聘，这是一个很好的选择。然而，如果你正在考虑使用第三方招聘机构，有一些关键点需要记住。\n\
  \n- 寻找一位了解安全市场状况的招聘人员。他们可以就你是否能尽早完成招聘的可能性提供现实的观点。\n- 目标锁定在参加安全活动并理解组织所面临的安全挑战的招聘人员。\n\
  - 寻找一个你喜欢与之交流的招聘人员。你需要开放的对话和信任来找到出色的候选人。这只有在愿意进行诚实对话且在电话响起时不感到反感的情况下才能实现。招聘人员是销售人员，所以他们的方式与你不同，但建立稳固的关系具有巨大的价值。\n\
  \n### 使用招聘机构的普遍缺点\n\n- 他们不是你（当然了）。你心里非常清楚自己想要什么，因为你已经做过了艰难的思考、规划和准备工作，所以将这些交给他人总会伴随着风险。\n\
  - 你（或你信任的人）仍然需要花时间面试和会候选人。这消耗了你或你员工的生产力，而即使没有第三方招聘人员，这些时间也是会被花费的。你花在阅读简历和面试上的每一小时都会增加招聘成本，因为如果你录用了他们提供的人，你就必须为这种权利向招聘人员付费。\n\
  - 极少数有对该主题及相关专业人士充满热情的真正的安全招聘人员，这可能导致入围名单中的人并非你的理想人选。\n- 无法无法衡量文化。他们不是每天在该环境中工作，因此无法准确知道哪种类型的候选人在你的组织内“如鱼得水”。这意味着你可能会比计划中见到更多的候选人。（顺便提一下，这也可以是一个优点，因为见到的人越多，你对最适合的安全技能的感就越好。）\n\
  \n如果你必须使用他们，我建议寻找能够直接与你或你的人力资源顾问对接的安全特定招聘人员。这并不总是可能的，所以，如果你计划——或受公司政策强制——使用委员会招聘公司，请回去再次阅读第\
  \ `2` ，以明确你的职位描述和目标。这将帮助你更加清楚地明确你在未来一到两年内想要什么，哪些经验或技能是可以商榷的，并确保你有一个清晰的职位描述。这些步骤将带来更清晰的招聘广告，并与你可能在社交活动或通过人脉遇到的其他潜在候选人进行更有用的对话。（更多内容将在第\
  \ 11 章中介绍。）\n\n### 资源\n\n以下是澳大利亚几家专门的网络安全招聘机构：\n\n- CyberSecPeople `https://www.cybersecpeople.com`\n\
  - Decipher Bureau `https://www.decipherbureau.com`\n- Q1 Recruitment `https://q1group.com.au`\n\
  \n## 核心总结\n\n如果你必须使用招聘人员，尝试寻找一位熟练的网络安全招聘人员。做好功课，并根据明确的方向和职位描述规划流程。更多信息请参见第 `2` 节。\n\
  \n### 10 候选人评审\n\n> “我宁愿面试 50 个人而不雇，也不愿雇错人。”\n杰夫·贝佐斯（Jeff Bezos），亚马逊首席执行官\n\n这本书并不是为了教你如何工作。如果你多年来成功招聘\
  \ IT 领导和专业人士，你可能会认为这一章对你没有价值，但我鼓励你尽管读一下。\n\n在我职业生涯早期，我的雇主让我参加了一个名为`面向非网络工程师的网络工程`的课程。正如你可能从从其引人注目的标题中想象的那样，课程向像我这样负责向公众介绍它的人解释复杂的通信网络。多年后想起这门课程，提醒我即使是有些陌生的主题内容，对于来自其他业务或行业领域的人来说也很有价值。对于我在职业生涯中遇到的一些令人惊叹的“安全人员”来说，也是如此。我使用引号是因为在很多情况下，称他们为安全人员并不是完全事实。\n\
  \n许多备受推崇的安全领导是基于技术安全技能之外的任何因素，被任命、要求或“被征召”担任安全岗位的，并且通过一些非常不常的路径。尽管缺乏实战安全经验，这些灵魂被选中是因为他们无法培训的特质，例如他们的正直、内在的领导能力以及对对错的清晰理解。许多安全人员被选中是因为他们是出色的沟通者、团队建设者，或者在困难时期来临时能够召士士。历史证明，用意料之外的候选人填补安全职位，为行业带来了跨职能的榜样，他们对业务相关的风险有理解——这种经验是一些终身安全专业人士永远无法获得的。\n\
  \n我的意思是，在考虑安全领导者时，你看到的简历很可能来自不同的背景。我认识许多备受尊敬的安全领导者，他们的人力资源、审计、警察部队、武装部队、风险、技术、公关或学术界磨练出了才干。鉴于如今安全领域的发展速度，他们最近的经验是你最关注的，但从你的议程角度来看，请把他们的背景看作是额外的的加分项。一些领导者带来了独特的技能和经验，不应因为他们没有走传统的计算机科学路径而忽视他们。\n\
  \n这在评审候选人时也同样，因为你可能不会看到所有的简历。根据你的招聘方式，另一位负责简历评审的人可能会筛选掉“不合适”的申请者。这可能是招聘人员、人力资源经理、你的直属属、另一位安全人员，或者是为你筛选简历的第三方顾问。\n\
  \n筛选过程也是需要考虑的。如果你创建了出色的职位描述，向评审者说明了你的优先事项，并信任他们的判断，你就成功了一半。如果入围名单符合预期，这个过程确实为你节省了时间。如果你看到的简历只是平庸中优，那么可能值得进行抽检或深入查看拒绝列表。这种质量保证可能决定你招聘的成败。然而，你的准备和对流程的信任将产生一份不错的入围名单。\n\
  \n相反，你可能根本没有得到入围名单。如果没有任何候选人接近你的硬底线要求，这并不一定是坏事。然而，如果你发现没有一个值得面试的人，我会感到惊讶，因为纸面上的人与面对面的人往往不同。仅仅信任简历可能会错过一个没有以你预期的方式推销技能的优秀候选人。\n\
  \n### 关于简历的说明\n\n\n\n\n简历（CV）是观察候选人认为哪些事重要的窗口，并有助于判断其工作和文化契合度。我的简历开头重点介绍了我在职业生涯中如何对他人的产生积极影响，这直一直是我的首要任务。其他人可能会以荣誉、证书、曾代表过的公司或技术成就开头。这没有对错之分，但简历远不止是一份历史文件。作为招聘经理，要观察它是如何构思的，以及从候选人对待过去和未来的方式中，你直觉到的氛围（vibe）。这是非常双维度的，有时你只需要相信你的直觉。鉴于候选人展示自己的方式可能也是他们向你和你的组织介绍自己，在完成最初的\
  \ 30 秒判断后，以下是一些需要注意的事点。\n\n1. **拼写错误和措辞不当**。如果你希望入选候选人能够在书面和口头交流中良好表达，而他们的简历措辞拙劣，这应该引起关注。这份文档展示了他们论述自己熟悉领域的能力，因此它应该是组织良好、简洁且清晰的。\n\
  2. **含糊不清**。仔细观察成就信息的呈现方式。如果所有的职责或成就都集中在小组、团队或组织取得了什么，而没有关于个人贡献的细节，你将如何知道他们的长处？\n\
  3. **主动性**。寻找他们并非为了报酬而做出的成果/成就，例如超出目标而非仅仅达成目标，或者获得特别表扬。\n\n下一站——会见候选人。在审查简历后，与候选人面对面是考虑契合度的时候。他们对待你的方式、使用的语言以及整体言谈举止充分说明了他们将如何胜任该职位。作为一名女性，我经常发现男性行业同行的做法是采取不同的伪装，从平易近人、尊重到威胁性或傲慢不一。我信反过来也是如此。此外，考虑面试者在回答你的基础问题时是否使用了大量的技术术语。这令人担忧，因为在日常活动中，是他们的目标受众，他们对你的表达应该是恰当的，作为一名优秀的领导者，他们应该能够判断这一点。\n\
  \n请考虑，新的安全负责人需要充满激情、动力十足且具有影响力。无论组织的成熟程度如何，这些特质都是必须经过测试的。我面试过一些纸面上看起来完美的候选人，但当我见到他们时，他们却很世俗，已经失去了通过一个接一个钓鱼链接来改变世界的动力（可以这么说的话）。回想你的底线（non-negotiables），并确保你的问题集中在硬技能以及你渴望确认其存在的个人特质上。\n\
  \n这个候选人审查过程可能受到我在下一章中讨论的一个细节的影响。如果你以前见过该候选人，或者他们被你组织中的某人认识，你的方法（以及他们的方法）可能会略有不同。\n\
  \n如果你发现现阶段没有找到良好的理想候选人，我建议你重新审你的职位描述，重新评估你的底线，并重新考虑吸引候选人的方法，即：如果在线广告无效，尝试更多的人脉拓展，反之亦然，或者重新考虑职位名称。\n\
  \n### 核心要点\n\n候选人审查具有挑战性，你很容易感到沮气。坚持进行你的筛选和面对面面试。如果你发现自己无法获得妥善评估候选人所需的信息，请重新审视你的吸引候选人的方法和面试问题。\n\
  \n## 11 让自己被支持者包围\n\n> “你需要一个协作的招聘流程。”\n> 史夫·乔布斯，苹果公司联合创始人\n\n在招聘过程中，有时你需要让自己被某些人、专业人士和同行包围。这将确保你尽最大努力找到合适的人选。此外，尝试独自进行招聘是徒劳的。你可能会在以下阶段发现有价值的支持：在向员工寻求推荐时，在寻找候选人时，以及选择与你共同面试的人时。\n\
  \n### 内部员工推荐\n\n发现和留住优秀人才（无论安全还是其他领域）的最佳方式之一是通过推荐。向工作人员/员工提供一份简短的职位描述，看看他们是否认识可能具备合适技能和文化契合度的人，这是一个极佳的起点。你的员工是流行的广告。大多数人不会向他们不乐意加入的组织推荐朋友/熟人，所以从理论上讲，你只会听到那些践行价值观的人的声音。此外，可以给予报酬/奖励/认可来激励员工。虽然预算可能是一个问题，但即使对推荐支付费用，该费用也远低于你为获得相同结果向猎头支付的费用。一个设计良好的、具有清晰规则和指南的员工推荐计划可以将候选人直接送到你家门口。\n\
  \n**注意**：虽然我绝不想暗示事情会变糟，但确保规则清晰并且你对此经过深思是非常重要的。如果有疑问，请寻求法律建议，以确保在被推荐员工不合适时你涵盖了所有可能的结果。\n\
  \n寻求推荐的过程也可以成为在组织内推广安全意识的绝佳机会。现有员工可以更多地了解该职位涉及的内容，从而更地意识到安全负责人将带来的变化。\n\n被推荐候选人的主要优势是：\n\
  \n1. **质量**：美国员工成功软件公司 Achievers 的研究表明，被推荐的员工是质量更高的招聘对象。这是因为员工在推荐他们担任某个职位之前，会对潜在候选人的技能和文化契合度进行预筛选。\n\
  2. **成本**：推荐计划降低了招聘成本。与猎头所需的数万美元相比，这些计划偶尔只需要花费几千美元。这支在社区中帮助你寻找工作的“小小蜜蜂军队”是不被低估的。\n\
  3. **品牌**：推荐对你的品牌非常有益，因为它让人们谈论你，特别是在 LinkedIn 或 Twitter 等社交媒体上。这种信息是积极的，即使没有提供丰硕的推荐，也会推广你的公司和安全工作。此外，员工采取的方式通常比猎头不那么侵略性，所以他们对职位的推广可能更容易被人脉接受。\n\
  4. **士气**：你的员工是你的大使，让他们了解组织的目标和方向以介绍潜在候选人只会增强他们对组织的热情。\n\n### 人脉拓展\n\n在寻找候选人时，人脉拓展与员工推荐一样，是成功的公式。据估计，85%以上获得空工作的人是通过人脉获取的。16\
  \ 与其他 CIO 建立联系、参加安全相关活动以及在安全人员——或未来的安全负责人聚集的活动上演讲，增加了你寻找优秀人才的机会。被经历过类似过程的其他 CIO\
  \ 包围会有帮助。听他们的战争故事、成功案例以及他们管理安全的方式，可以为别人的经历提供见解，你也可以从他们的幸运或不幸中学习。他们可能拥有不适合他们的职位但可能适合你的候选人。此外，直接与可能与你合作/工作的人建立联系是一个很好的方法。\n\
  \n\n\n\n人脉拓展并不是每个人都喜欢的。有些人纯粹不喜欢和人打交道。（这很奇怪，但事实如此！）如果没有人脉拓展，我将不知道大学毕业后担任过的任何工作——我也不会失去我一些非常棒的朋友！我的每一份工作都是通过我认识的人或我刻意去结识的人介绍的。\n\
  \n“重要的不是你知道什么，而在于你认识谁”这句老话因为人脉拓展而变成了陈生常谈。我恳求你，下次获得机会时，请努力去建立人脉。接受午餐邀请，开启对话，或者找一个你可以参加的非正式活动，在在那里你可能会遇到某人，而那个人认识的人对你提供的职位感兴趣。\n\
  \n顺便提一下，可能值得联系一些关注安全的协会，以了解他们拥的人脉拓展机会，或者如果他们愿意，可以向他们的成员介绍你的职位。如果你在澳大利亚，澳大利亚信息安全协会（Australian\
  \ Information Security Association）和澳大利亚女性安全网络（Australian Women in Security Network）是两个很好的起点。\n\
  \n## 选择合适的共同面试官\n\n最后，但绝非不重要，选择合适的人来共同面试你的候选人。在招聘的各个阶段，你身边的人对于选择匹配的候选人至关重要。要做到这一点具有挑战性，因为很难知道人们在面试情境下的反应。有些人对安全专业人员所需的特质有先入为主的想法，而另一些人则毫无头绪。无论如何，考虑谁最适合分享第一、第二和第三轮面试阶段是非常重要的。选择一个与新领导有紧密合作的人，对于性格或文化契合度很有帮助。然而，你无法取悦所有人，所以对于你从另一个意见中需要什么，要保持谨慎且诚实。如果你想找到最合适的候选人，你所选择的人必须认同你的计划、你的首要关注以及你不可妥协的底线。\n\
  \n### 关于你的共同面试官需要考虑的几点：\n\n* 这名新员工会对每位共同面试官的日常生活产生多大影响？\n* 他们是否知道你对新员工的目标，并是否尊重这些目标？\n\
  * 你与他们的工作关系是什么？\n* 新的安全主管与共同面试官之间的工作关系将是怎样的？\n* 你会在所有面试中保持同一个共同面试官，还是会更换人选？\n* 如果安全对你的组织来说是新领域，你的共同面试官对理解候选人经验的准备程度如何？\n\
  * 考虑你共同面试官的性别平衡\n\n## 核心总结\n\n仔细考虑如何让相关人士围绕在你身边以获得最佳结果。以上所有内容都需要精力和投入，但如果你能根据推荐、与候选人的联系以及良好的面试团队找到合适的候选人，这些努力将是非常值得的。\n\
  \n***\n\n[1] Gina Belli, ‘至少有 70%的工作职位甚至没有列出——这里是如何增加你获得理想新工作的机会’, Business Insider,\
  \ 2017 年 4 月 10 日, [`http://www.businessinsider.com/at-least-70-of-jobs-are-not-even-listed-heres-how-to-up-your-chances-of-getting-a-great-new-gig-2017-4?IR=T`](http://www.businessinsider.com/at-least-70-of-jobs-are-not-even-listed-heres-how-to-up-your-chances-of-getting-a-great-new-gig-2017-4?IR=T)。\n\
  \n在寻找候选人时，人脉拓展与员工内部推荐一样是成功的公式。据估计，85%以上获得公开职位的人是通过人脉拓展获得的。与同行的 CIO 建立人脉、参加与安全相关的活动，以及在安全人员（或未来的安全领导者）聚集的活动上演讲，都会增加挖掘优秀人才的机会。让自己身边围绕着经历过类似过程的\
  \ CIO 是有帮助的。听听他们的实战故事、成功案例以及他们如何管理安全工作，可以让你对他人的经历产生见解，你也可以从他们的好运或不幸中学习。他们可能拥有一些不适合他们职位但适合你职位的候选人。此外，直接与那些可能与你合作或为你工作建立人脉是一个极好的方法。\n\
  \n## 你允许突破空间吗？\n\n“如果你的行动能激励他人梦想更多、学习更多、做得更多、变得更好，你就是一个领导者。”\n约翰·昆西··亚当斯（John Quincy\
  \ Adams），前美国总统\n\n在担任经理和顾问期间，我读过许多优秀的简历，并遇到过一些才华横溢的候选人。我也遇到过一些傲慢的申请者、一些低调的领导者，以及一些不确定自己要去哪里、为什么去去的专业人士。\n\
  \n通过对一套框架的交付，我最近遇到了一位非常优秀的候选人——我们称她为 `Jill`——我后来录用了她，并指导过她。我最初是在 `LinkedIn` 上发现了\
  \ `Jill`。\n\n\n\n我讲述这个故事是因为，虽然这个领域有很多优秀的专业人士，但要找到契合要求的安全人才非常困难。虽然招聘一个仍处于成熟期的人并不总是合适的，但应该留出成长的空间。如果你觉得候选人践行这些价值观，并且在第一天就能满足你的大部分要求/需求，请考虑给他们一个机会。这可能正是他们需要的机会，而这一切将归功于你。这不是一个轻松的选择，需要你作为他们的管理者付出努力。但在考虑保护你的组织以及帮助某人成长为全能型领导者以胜任下一份工作时，这是值得思考的。让我们面对现实吧，当他们让你表现出色时，你作为他们老板的职责是为他们应对未来的挑战做好准备。\n\
  \n顺便提一下：如果你不愿意或没有能力支持新领导者弥补技能或经验上的差距，那么不走这条路也可以。这可能会导致职位空缺更长时间，但如果你无法支持一位领导者成长为该角色，那么对所有相关方来说，共同前进是不公平的。\n\
  \n### 核心要点\n\n我坚持我的建议，即设定一些不可逾越的标准，即第一天必须具备的技能。但如果某人在经验上有缺口，请考虑在不损害你的目标的情况下，你可能如何成为帮助他们克服这些问题的人。给一个已经达到\
  \ 80%要求的候选人机会，可能是对所有参与者最好的事情。务必评估情况，相信你的直觉，并一如既往地根据你希望在未来 12 到 18 个月内实现的成果来做决定。\n\
  \n### 13\n\n## 他人的评价，第二部分\n\n“当你说话时，你只是在重复你所知的。但如果你倾听，可能会学到新东西。”\n\n十四世赖嘛，藏佛教精神领袖\n\
  \n到目前，希望你已经遇到了一些非常有才华的网络安全领导者。你已经参加过一些安全相关的活动/聚会。你对自己的议程比以往任何信心，这当然需要高层的背书。你正准备选择一位安全领导者进行背景调查、合同邀约和最终承诺。这种感觉如何？很棒，对吧？\n\
  \n还是觉得很令人生畏？周围的人是否在询问招聘进展如何？当你告诉他们你选择了一位候选人时，他们是否质疑你对认为有价值的技能和经验的判断？你是否担心自己可能没有从业务和环境匹配的角度来判断这个人的性格？这一切都是正常现象，如果你任其发展，可能会扰乱你的流程。\n\
  \n### 那么，其他人在说什么？\n\n#### 组织领导者/利益相关者\n\n你周围人的某些反应可能包括：\n\n*   当你讨论候选人的技能和经验时感到惊讶\n\
  *   担心候选人比预想的资浅或资深\n*   如果此人将严重依赖被任命者交付某些结果或满足审计要求，他们可能希望在后期提供一些建议\n\n需要记住的关键点是，在安全领域，你的组织将拥有一名专门的员工——可能还有一个团队——这让你在实现确定性和保护你的客户方面领先于许多其他组织。此外，人们对招聘总会有意见。引入安全领导者对于任何规模的组织来说都是迈出的一大步，并且只能提高安全成熟度。这位新领导者的到来本身就会提高对安全承诺的关注度。（更多内容见第\
  \ 16 章。）\n\n对你来说好消息是，如果你遵循了书中的流程——与利益相关者交谈、制定了议程并清晰地定义角色——那么你的选择就是合理的，这同时也通过了你的共同面试官的审核。我意识到过程中在某些点可能会出错。但本质上，如果你选择的人符合你不可逾越的标准，并准备好承担该议程，从他们的技能、热情以及你支持他们的能力和意愿来看，你就可以放宽心了。\n\
  \n### 安全行业\n\n他人的评价还包括行业。这个人的人脉关系如何？你的任何安全人脉中是否有人认识他们？他们是否参与了行业活动、在活动中演讲并支持他们的同伴？\n\
  \n我的一位咨询客户强调了筛选行业小组活跃成员作为候选人的重要。招聘员工方面，特别是安全领域，我完全同意这一要求。在安全领域工作，你不能成为一个孤岛（或者躲在石头下面）。随着格局每天变化，我们都在某种程度上摸索前进，因此，与同伴分享信息、寻求反馈并从他人的经验中学习是至关重要的。让我们面对现实吧，今天网络攻击的幸存者可能是明天该主题的权威。听众从你保护组织的经验中获得的价值在于，他们可能会更早地注意到某些事情，更容易看到攻击的特征，或者简单地向其员工教育他们以防范新的网络攻击方法。\n\
  \n你的候选人是否是受追的演讲者，可以在行业论坛上演讲并回顾他们职业至今的事件或关键教训？无论是长期成员还是第一次参加者，如果你发现符合你的技术要求、并表现出激励和被同伴激励意愿的候选人，这些人通常是值得留任的。\n\
  \n### 推荐人\n\n他人的评价也包括推荐人。我们都知道，推荐人很少对候选人说坏话，这就是为什么他们被选为推荐人的原因。但可以某种方式组织问题，以获取有关候选人能力的足够信息，而不需要要求负面评价。背景调查有时由人事合作伙伴和招聘人员进行，但重要的是你要对调查的深度感到满意，它要超出基础。如果调查完成后你仍有疑虑，请要求更多推荐人进行深入挖掘，或者你自己进行进一步调查。\n\
  \n书中之前提到通过询问推荐人来测试候选人满足不可逾越标准的能力。要求推荐人分享候选人表现某些不可逾越经验或特质的案例。\n\n你可能想问的其他问题：\n\n\
  *   这个职位很高，涉及与董事会的互动。你认为这位候选人如何管理董事会的预期？\n*   候选人是如何处理安全事件带来的压力和影响的？\n*   候选人与他人相处如何？\n\
  *   候选人如何处理自主权？\n*   在预算方面，你认为候选人是否掌握了对你组织最好的投资方案？\n\n核心要点\n\n在生活中，作为一个一般原则，我们应该避免听从别人的想法或言，相信自己的直觉和判断。但这并不意味着我们停止在行动之前提问、寻求意见和验证信息。通过关键开放式问题，了解他人从你心仪候选人那里获得和持续获得的价值，为你选择下一位安全领导者提供了重要信息。\n\
  \n### 第 4 部分\n\n承诺：你准备好了吗？\n\n“除非做出承诺，否则只有保证和希望，没有计划。”\n\n彼得·F·鲁克，作者\n\n1973 年，哈佛商业评论发表了一篇关于员工留存的文章：“为什么员工留下来”。17。几乎\
  \ 45 年后，它仍然适用。前提是员工留在组织中是因为惯性。在更好的机会出现之前，他们会留在原来的岗位上。\n\n\n\n第一是工作满意度。其次是“公司环境”以及员工在其中感受到的舒适程度。\n\
  \n文章指出：“员工的惯性的加强或削弱，取决于其职业伦理与公司所代表价值观之间的兼容程度。员工的职业伦理源于自身的价值观以及在工作中遇到的实际情况。而公司的价值观则源于社会准则、董事会的正式决策，以及管理层的政策和程序。这两个视角之间差距的扩大会削弱惯性；而差距的缩小则会加强惯性。”\n\
  \n第三个因素是员工对其他机构职业机会的感知，以及他们自我施加的限制和个人标准（如地理位置）。最后，还有非工作因素，如财务责任、家庭纽带、友谊和社区关系。研究中的许多员工报告称工作满意度较低，但他们仍然留了下来。\n\
  \n几年前，我担任了一份工作，它为我提供了许多我所需的“个人标准”。在亚洲生活了三个半后刚下飞机，我找了一份能带给我急需的澳洲经验的工作。对我来说，这是一个全新的行业，这是一个“主管级”职位，最重要的是，它给了我灵活性。我有两个小孩子和一个生病的家人，我从亚洲回来是为了陪伴他们，而这份工作正符合标准。\n\
  \n我没有意识到，我加入的是一个与我的价值观不一致的组织。虽然哈佛大学可能在 45 年前就做过这项研究，但当我入职仅六周就发现我无法为这个组织工作时，这四个因素全部发挥了作用。\n\
  \n回想起来，不知道自己是否能更早地察觉到。我太专注于履行家庭责任了，以至于没有把组织匹配度放在首位。我向一位我信赖的领导反映了我的顾虑，他不是我的老板，很好地劝说我不要冲动。他对这个组织充满热情，并希望我能留在这个职位上，这既令人悦耳又有说服力。我非常感谢他，因为他促使我思考如何为组织增加价值，履行我对职位的承诺，并在尽管价值观冲突的情况下，以某种程度的个人诚信离开。我怀着感激的心情接受了他的话并继续努力。但几周后，他给我的那剂强心剂的作用消失了，我再次意识到，我的心不在焉了。\n\
  \n谈到留才，一旦员工的惯性发生转变，组织能做的其实是有限的。重要的是确保在他们签署劳动合同之前解决了他们的需求，讨论了价值观的匹配情况，以及他们完成工作所需的支持。确保他们能够通过“烧烤测试”：如果他们正在参加烧烤派对，有人问起他们在哪里工作，他们会自豪地说出来吗？确保潜在员工从工作的角度意识到自己正身处什么样的境地。（幸好你把第二章的那个议程带在了。）最后，确保他们工作的环境能够支持这位领导。我不是在要求特殊待遇，而只是要求尽职调查。安全就业市场竞争激烈，你希望为你新的信息安全主管或网络安全主管创造正确的条件，让他们投入并繁荣发展。\n\
  \n在说完这些之后，你还必须考虑你需要什么来支持他们，以确保你们在保护组织方面拥有长远的未来？你需要同事对这一议程的认可、安全计划的预算，以及你其他直接下属和同事对这位新人的支持。最后，为了从你的安全领导那里获得你所需的确定性，你需要具备韧性，信任这个过程，并准备好投入。\n\
  \n框架的第四部分关于投入到新员工——对自己的选择感到满意，同时也理解他们保护组织并留下的承诺程度，并且是出于正确的理由，而不是因为惯性。\n\n***\n\n\
  [17] Vincent S. Flowers & Charles L. Hughes, ‘Why Employees Stay’, Harvard Business\
  \ Review, July 1973 issue, [`hbr.org/1973/07/why-employees-stay`](https://hbr.org/1973/07/why-employees-stay)。\n\
  \n1973 年，《哈佛商业评论》发表了一关于员工留存的文章：“为什么员工会留下来”。17 几乎在 45 年后，它依然切中要害。其前提是，员工留在组织中是因为惯性。在有更好的机会出现之前，他们会一直留在自己的岗位上。但这种停止惯性的推力受到四个因素的影响。\n\
  \n17 Vincent S. Flowers & Charles L. Hughes, ‘Why Employees Stay’, Harvard Business\
  \ Review, July 1973 issue,\n\n## 第 14 节：职责巡视\n\n“为今天和每一天计划你的工作，然后执行你的计划。”\n\n玛格丽特·撒切勒，英国前首相\n\
  \n我们都知道有些人是带着计划承担新职位的。他们从第一天起就知道自己的 30 天、60 天和 90 天目标。或者说“前 100 天”。也有考虑有限期限的计划者。我是在做概括，因为每个人都略有不同。但本质上，人们要么知道自己想要什么以及计划花多久来实现，要么就盲目进入职位，相信旅程会将他们带向何方。\n\
  \n对于那些有大目标且期限有限的人来说，这通常是他们设定的边界，但对候选人和组织来说效果很好。我有两个例子。\n\n#### 案例 1\n\n一位朋友担任了顾问，作为临时执行官领导一个团队。公司非常喜欢她，很快他们就请求她留下来。她礼貌地拒绝了一个月，隔一天一次，直到她去找首席执行官建议她留下，但有以下条件：她将继续担任顾问，但仅限两年，期间她计划执行\
  \ `X`、`Y` 和 `Z`。有了这个提议，组织能够以一致的领导向前发展，可以为两年后的领导变更做计划，并且知道达成协议后将获得什么。这对双方来说都是双赢。\n\
  \n#### 案例 2\n\n有些人寻找特定的技能组合来补充他们的经验。在我职业生涯早期，我有一位同事没有在任何小公司工作过。他离开了一家全球性组织的高管职位，整花了两年在一个更敏捷的环境中领导一个较小团队——传统意义上的“敏捷”。在他离职之日，他已经完成了目标并进入了一家中型企业担任更高的职位——这一直是他的计划。组织意识到他正在为自己的简历寻求特定的经验。他们知道他不会长留，正因为如此，他们让他高强度工作，确保他培训他人，并通过导师指导和项目领导传授了他\
  \ 20 年的业务知识。公司尊重他的诚实，他们眼睁睁看着日子流逝等待他不可避免的辞职，而是珍惜与他共处的时光。\n\n\n\n正如我之前提到的，你现在需要的安全人员并不是你两年后所需要的那个人。诚实地说明你的计划并无害，即你计划帮助你的新领导在短的任期内尽其努力，为组织的安全行动计划取得突破，然后获得晋升或被选拔到一个新的、更高级的角色。我相信，每位经理的职责就是为员工的下一份工作做好准备，然后让他们获得自由。如果双方对此达成共识，这将是一种为所有参与者获得最佳结果的一种非常高效、有效且诚实的方法。规划较短的任期并不适合每个人，但尽管如此，在\
  \ 2016 年，澳大利亚人平均在岗位上的时间仅为三个月四个月，千禧一代甚至更短，18，所以这并不是一种如此负面的规划方式。我们将在下一章讨论长期留任的员工，以及这对候选人及其在组织内未来的影响。\n\
  \n### 核心要点\n\n在面试中，当你问出“年后你认为自己会在什么位置？”时，请仔细听。这听起来可能像是一个老套、陈旧的问题，但如果你真的听出了他们回答中的特征，它就能告诉你许多关于候选人如何看待这一切的进展。如有必要，通过提问进行深层挖掘，以找出他们需要什么至少留两年。例如，如果他们渴望成为大公司的\
  \ `CISO`，而你无法提供这种高级资历（即使以后出现了这样的职位），他们可能会被更广阔的前景所吸引。\n\n***\n\n18 Ben Phillips,‘“铁饭碗”心态是否已彻底消失？’\
  \ Adzuna’s Blog, 2016 年 2 月 4 日, [`www.adzuna.com.au/blog/2016/02/04/is-the-job-for-life-mentality-gone-for-good/`](https://www.adzuna.com.au/blog/2016/02/04/is-the-job-for-life-mentality-gone-for-good/)。\
  \ \n\n18 Ben Phillips,‘“铁饭碗”心态是否已彻底消失？’ Adzuna’s Blog, 2016 年 2 月 4 日, [`www.adzuna.com.au/blog/2016/02/04/is-the-job-for-life-mentality-gone-for-good/`](https://www.adzuna.com.au/blog/2016/02/04/is-the-job-for-life-mentality-gone-for-good/)。\
  \ \n\n正如我之前提到的，你现在需要的安全人员并不是你两年后所需要的那个人。诚实地说明你的计划并无害，即你计划帮助你的新领导在短的任期内尽其努力，为组织的安全行动计划取得突破，然后获得晋升或被选拔到一个新的、更高级的角色。我相信，每位经理的职责就是为员工的下一份工作做好准备，然后让他们获得自由。如果双方对此达成共识，这将是一种为所有参与者获得最佳结果的一种非常高效、有效且诚实的方法。规划较短的任期并不适合每个人，但尽管如此，在\
  \ 2016 年，澳大利亚人平均在岗位上的时间仅为三个月四个月，千禧一代甚至更短，18 所以这并不是一种如此负面的规划方式。我们将在下一章讨论长期留任的员工，以及这对候选人及其在组织内未来的影响。\n\
  \n## 期望差距\n\n“伟大始于对未来的清晰愿景。”—— 西蒙·斯内克\n\n你和新领导的期望大部分可以通过设定议程来解决（见第 2 章）。通过这些文档、你所进行的对话以及正确的职位描述，应该明确你需要招聘谁，以及他们在未来六个月、12\
  \ 个月或 18 个月的产出应该是什么。之后，他们需要制定更广泛的策略，但他们会在面试后知道。\n\n你和新领导的期望，大部分可以通过设定议程来解决。通过这些文档、你所进行的对话以及正确的职位描述，应该明确你需要招聘谁，以及他们在未来六个月、12\
