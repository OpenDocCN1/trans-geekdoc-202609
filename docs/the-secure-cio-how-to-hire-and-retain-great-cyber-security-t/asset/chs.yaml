  ## 渴望成为信息安全主管的 IT 经理\n\n第二个例子是我在多个中型组织看到的。在两个几乎相似的案例中，组织拥有一位安全策略经理（或类似职位），其职责是管理安全相关策略的更新、执行策略、例外或豁免，并教育员工策略的存在和应用。这个角色是重要的，并在业务的合规方面发挥了作用。两位经理都拥有至少\
  \ 15 年的行业经验，大部分在安全或合规领域。他们人脉广泛，熟悉业务，并因从事合规类活动而闻名。很棒，对吧？是的。但这些属性和经验并没有让他们走向领导层/C\
  \ 级职位。\n\n当他们的组织意识到新的网络威胁以及全球组织面临的风险时，审计随之而来。这些审计引发了数百担忧，之一就是 IT 安全领域缺乏领导力和可见性。不仅缺乏领导力，而且缺乏高层应对网络风险，并担心安全在项目、产品或倡议的执行对话中没有得到认可。组织还可能遭受了网络攻击但却不知情。于此，2016\
  \ 年全球检测网络泄露的平均时间为 146 天，欧洲、中东和非洲（EMEA）为 469 天，19，你可以理解为什么最近一些头部会从土里冒出来，与网络有关。\n\n\
  \n\n\n\n首席信息官（CIOs）被要求去寻找一位高级网络安全领导者，而 IT 安全经理/策略经理自信地提交了对该职位的意向。此人在工作的许多方面都符合条件，但\
  \ IT 安全（或网络安全或信息安全）在过去几年里发生了变化，而且仍在持续变化。安全经理通常是优秀的作家、谈判者，技术过硬且人脉广广。然而，他们可能低估了从管理结构化的、相对非黑即白的运营到担任网络安全负责人或首席信息安全官（CISO）那种如过山车般的跨越。\n\
  \n内部提拔是行之行的，我也写过几篇关于内部员工通过其他技能补充安全职优势的博客。然而，并非所有的安全经验都是同等的，而且在上述两种情况下，引入一组具有行业其他领域经验的新视角都成功地应对了网络风险。（我们稍后会讨论如何衡量新员工的影响。）\n\
  \n这两位经理都有丰富的经验，并通过他们的忠诚、资历和对安全领域的广泛知识为组织提供了价值。通过任命一位领导者来引导他们进入安全的新时代，从而支持他们目前的工作，对所有相关者来说都是一个好的结果。提拔这些经理本是解决审计发现的一种简单方法，但并不符合业务的最佳利益。\n\
  \n### 核心要点\n\n明确候选人在该职位上可以实现的目标，包括他们的愿景和能力。拥有一个动力十足、热情高溢并渴望在新职位上大展拳场的候选人可能看起来令人难以信。但请注意你是否能够利用这种热情，以及这对需要实现的结果可能产生的影响。\n\
