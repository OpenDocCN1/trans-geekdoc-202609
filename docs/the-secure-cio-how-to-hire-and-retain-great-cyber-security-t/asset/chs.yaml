  \ Infocyte, 2016 年 7 月 27 日, [`www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you`](https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you).另另\
  \ Herb Weisbaum, ‘Data Breaches Happening at Record Pace, Report Finds’, NBC Business\
  \ News, 2017 年 7 月 24 日, [`www.nbcnews.com/business/consumer/data-breaches-happening-record-pace-report-finds-n785881`](https://www.nbcnews.com/business/consumer/data-breaches-happening-record-pace-report-finds-n785881)。\n\
