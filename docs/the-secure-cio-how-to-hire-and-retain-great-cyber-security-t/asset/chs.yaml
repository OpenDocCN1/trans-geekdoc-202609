  \n当他们的组织开始意识到新的网络威胁以及全球组织正在面临的风险时，审计随之而来。这些审计引发了数百个担忧，其中之一就是 IT 安全领域缺乏领导力和可见性。这不仅是缺乏领导力，还缺乏高级人员来应对网络风险，而且担心在执行高层关于项目、产品或倡议的对话中，安全没有得到重视。这些组织可能已经遭受了网络攻击并且……\n\
  \n### 教练：不要让他们孤立无援\n\n这一部分解释了我所说的“穿 T 恤”（wearing the T-shirt）。它的关键在于人的行动中体现价值观。无论\
  \ T 恤的细节如何，在人的行动中体现价值观才是关键。\n\n我很喜欢这一点，因为层级结构中的任何人都可以获得基础的公司 T 恤（然后通过参与直接工作之外的工作获得特殊\
  \ T 恤）。`wearing the T-shirt` 这个表达可以这样说，每个人都知道预期的。\n\n所以，当你的新安全领导者到来时，请确保你已准备好`wear\
  \ the security T-shirt`。\n\n### 16\n\n欢迎\n\n“这里没有陌生人，只有尚未认识的朋友。”\n\n威廉·巴特勒·叶慈（William\
  \ Butler Yeats），爱尔兰诗人\n\n在第 12 章中，我提出了这样一个事实：仅仅通过报到岗位，新的安全经理就开始改变你组织的安全面貌。这是事实，而且这仅仅是一个开始。\n\
  \n\n\n\n\n人们的需求各不相同。每个人的工作方式略有不同，取决于新员工的资历，你可能需要在他们加入组织的前几周内调整你的方法。但尽管需求具有多样性，在涉及安全时，当安全负责人是新加入者时，以下内容在组织中是通用的；当他们领导一个成熟的安全职能时，也可以为流程提供参考。以下列出的每一个想法都是传播安全理念、支持你的新领导并让他们开始评估组织不同领域的机会。安全专业人员的一个主要特质是他们好奇的天性，以及在结识新朋友和听取不同部门及产品如何协作时感到的安全感。以下某些内容可能看起来显而易见，而另一些则可能会激发灵感。\n\
  \n### 1. 设定基调\n这位领导进入业务的方式可以设定他们与你以及组织关系的基调。在他们入职的第一天，花一小时时间重申你的支持、向他们介绍、安排一些会议并启动工作是至关重要的。这看起来似乎是显而易见的，但并非所有领导都这样做。另一些人将前几周视为汲取安全和业务文献、完成入职培训（参见第\
  \ 5 点）并适应环境的时间。这些都很重要，但不要削弱第一天的重要性——在那一天，确定性和信心再多越好。每当第一天设定好基调后，我都会反复重读那些第一天的笔记——在新职位中，我笔记本上的前几页被证明非常有价值。尽管如此，这取决于你雇佣了谁以及他们需要什么。考虑他们的需求，或者问问他们是想先稳一稳还是直接投入工作。我遇到过这种争论中两种立场的领导。虽然我个人倾向于不被放之自偏，但要弄清楚你的领导希望这几天该如何度过。\n\
  \n### 2. 介绍他们\n同样，这可能看起来很基础，但作为安全负责者的老板，这是你展示对这个人及其职能支持的首次机会。要可以，请尽一切方法要求他们写一段关于自己的简介，但介绍工作具有双重目的，同时也提醒了你的员工要关注安全。大多数人喜欢读读关于新人的信息，但如果你能利用他们的到来来增加知识或提醒员工安全的重要性——以一种轻松、符合文化的方式——请利用这种机会。除了书面沟通外，带新同事参加会议，并让他们去总部/办事处会见其他人。介绍他们让组织知道安全负责人已经到位，并且他们扮演着关键角色。\n\
  \n### 3. 咖啡交流\n鉴于助理已经是稀有物种，这可能意味着与利益相关者安排几次咖啡会议。不要包含任何描述；只需要几个关键人物就能启动重要的关系。自己挑选一些人可能是值得的，但也要找出执行团队想主动会见新领导的人。你可能会对那些急于分享他们的见解和需求的人感到惊讶。当然，新领导可以自己这样做，但由你开启这个过程，将是你推广安全计划的另一个机会。\n\
  \n### 4. 伙伴/导师\n有许多变量可能使这变得棘手或多余，但值得提及。根据组织的规模和资历，找一个能为新领导解答疑问的人是有帮助的——一个可能在公司待了一久或见过组织变化的人，可以在领导需要信息时向其进行简报。来自单一来源的过多信息可能会产生偏差。此外，如果是初创公司，可能是一个小型团队/环境，任何人都可以回答问题。这里讨论的变量太多，但在你不在时，身边有一个人回答日常咨询是值得的。这种需求可以在你向他们简报议程（参见第\
  \ 17 章）时涵盖，这些信息对于领导来说可能已经足够。\n\n### 5. 入职培训\n当新员工资历很深时，入职（induction）往往会被忽视。入职流程告诉了我许多关于组织的信息，以及它认为新员工必须了解的重点。诸如“安全/隐私是否被涵盖？到什么程度？”等问题对于新安全负责人来说是金子，尤其是当议程中的`big\
  \ rocks`之一是员工意识时。不要低估他们参加入职培训日的价值；他们能看到安全可能的定位。\n\n### 6. 持续支持\n利用每一个推广安全负责人及其计划的机会。支持不仅以`1:1`面谈、决策和预算的形式出现。支持还需要在整个项目、事件处理以及面对董事会和风险委员会期间对组织的其他部分保持可见。\n\
  \n#### 核心收获\n如果安全对你的组织来说是全新的，那么在设定后就置之不管是不指望这位领导带来良好的结果和留任。安全工作是一项艰苦的工作，他们需要你以及所有利益相关者的支持才能维持计划运行。尽一切可能，从第一天起就参与进来，为领导提供可见的支持，并支持他们为组织贡献以及保护你的客户所做的一切。\n\
  \n### 17 更新\n“让那些没有你可能永远无法被看到的东西可见。”罗伯特·布列松，法国电影导演\n\n第 17 章和第 18 章是密不可分的。向新安全负责人更新议程并设定你的预期对他们的成功至关重要。在之前的章节中，我们讨论了议程的重要性，以及通过回顾笔记和建立三个主要关注领域（`big\
  \ rocks`）对领导有多么重要。\n\n很有可能他们会根据自己的背景以及他们希望经验将他们带向何方而有自己的想法。这没关系。议程是他们理解领导想法的绝佳起点，并可以据此构建策略。但自议程撰写以来，领导可能已经换，方向也可能发生了改变，因此新领导不仅需要了解议程简报，还需要了解自议程确定以来任何大小的变化。\n\
  \n在我工作过的一家组织中，在议程确定到新领导入职期间，不仅高层发生了重大变化，下一级管理层也是如此。新增了首席运营官（COO）职位，客户服务、工程、员工体验和法律部门都聘请了新的执行领导。随着新领导的适应，随之而来的是方向的改变和战略审查。这本身不会改变\
  \ `big rocks`，但了解那些离开的人以及他们可能对议程产生过的影响是值得的。例如，一个 `big rock` 可能是通过合同锁定第三方的安全。如果你没有律师可以审阅合同，你们的\
  \ `big rocks` 之一可能在短期内变得更难实现。同样，如果你们的 `big rocks` 之一是应用安全，而工程或开发与运营负责人发生了变动，他们将在同意安全变更之前想要了解自己的员工和系统。\n\
  \n\n\n\n\n在议程定稿到新员工入职之间，可能会发生一些你可能希望向他们简报的其他潜在变化包括：\n\n* 成本削减\n* 架构重组\n* 外包\n* 从本地化向云端的迁移\n\
  * 安全相关事件、其影响、解决方案及教训\n* 基于行业内安全事件的新威胁\n* 新的审计发现\n* 新运营模式\n\n作为 `CIO`，你不需要进行所有这些更新简报。可能当新领导与组织内各个部门的人员见面时，这些人可以填补空白并提供更新。关键在于考虑这些信息，因为与他们从议程中读到的内容相比，这是一项重要的变化。同样，如果你已经开始进行某些审计整改，应安排人向新领导简报其进展情况、负责人是谁，以及新领导在与审计人员合作处理安全相关事宜时可能扮演什么角色。\n\
  \n### 核心要点\n除了议程简报外，对组织变化以及任何显著影响“大石头”（核心任务）事项的更新也非常重要。如果已经过去了一段时间，假设议程反映了组织的现状可能是危险的，而且让安全负责人与关键利益相关者建立良好关系是当务之急。\n\
  \n### 18\n#### 什么是教练？\n（这不是在场边大喊大叫）\n\n“教练是释放人的潜力，使其自身表现达到最大化。”\n约翰·惠特莫尔（John Whitmore），执行教练先驱\n\
  \n在让新员工过渡到组织的过程中，可能涉及使用教练。这项投资在许多方面都有帮助，特别是考虑到我们在上一章中涵盖的细节。教练可以帮助思考创新的方式，为组织提供更安全的成果，而这个组织在此之前可能还没有专门处理过\
  \ `cyber risk`。\n\n由于曾担任过导师，并与同级、下属、高管及普通人进行过大量交流，在获得教练认证之前，我以为我知道什么是教练了——它的价值所在以及人们为什么要寻求它。但你知道人们是如何评价假设的。事实证明，我的一些先入为主的观点是错误的。事实上，教练很大程度上在于教练提出极佳的问题，然后保持安静、倾听，并创造足够的信任和张力，引导客户获得有用的结果。\n\
  \n`国际教练联合会`（International Coaching Federation）将其定义为“一种持续的专业关系，帮助人们在生活、职业、业务或组织中取得非凡的。通过教练过程，客户加深了学习，提高了表现并增加了生活质量”。20\n\
  \n那么我为什么要告诉你这些呢？为什么你的新员工需要教练呢？因为即使他们表现得完美，也有改进空间。（我们将在第 20 章讨论“应对挑战性”，那是使用教练的好时机。）你可能因为成本原因或认为你认为引导下属解决问题、担忧和复杂决策是你的职责，而放弃了为员工提供教练的想法。然而，世界上最成功的一些人都有专门从事其领域领域的教练，许多人在已经成功的情况下也聘请了教练。教练关乎开发高潜力表现者的能力。教练对于那些愿意学习、成长并对未来负责的人有效。职业或个人生活中的教练，与精英运动员与教练合作以改进已达世界级水平的成果没有区别。\n\
  \n在招聘和留住 `cyber security talent` 的情况下，教练帮助个人进入角色，解决可能出现的复杂问题，并提升他们的表现方式。\n\n根据你在完成此书框架的第\
  \ 5 部分时设定的预期目标和结果，在教练课程期间可以探索以下类型的内容：\n\n* 角色扮演场景：练习并尝试对预期情况的可能反应，以磨练技能并建立对新行为的适应感\n\
  * 建立更好的倾听和提问技巧，以提高符合利益相关者预期的交付\n* 问题解决：通过提启发性问题激发创造性的问题解决\n* 针对实际工作挑战进行头脑风暴\n\n\
  教练支持新员工，提高留任率，增强承诺，并且与导师不同，它鼓励领导发现自己的解决方案并交付成果。作为唯一的安全负责人加入组织可能会感到授权但也可能感到孤立。在未来几个月里为领导提供与教练处理挑战的机会，对组织具有巨大的价值。\n\
  \n### 核心要点\n教练不是导师、辅导或指示。教练是新员工的价值资源，用于帮助他们过渡、处理选项以及解决阻碍或瘫痪他们的行为。\n\n### 19\n####\
  \ 候选人需要什么？\n“别人的成功绝不会削减你的光芒。”\n匿名\n\n以下我和行业内其他人在开始新职位时证明有效的建议。作为安全领导，所有的支持都受到欢迎和感谢。支持新领导的方法有很多，虽然我在第\
  \ 16 章中讨论了入职前 30 天的短期支持，但这里有一些长期需求。\n\n#### 他们需要高质量的第三方顾问\n在我的研究期间，一位 `CIO` 建议，如果信息安全负责人职位空缺很长时间（幸运的是在他那里没有发生），他将聘请一位顾问来维持组织运转，直到找到心仪的领导。这就是他在\
  \ 2015 年所做的，尽管当时组织已经找到了接手招聘职位的人选。该职位空了六周，但一旦现职者辞职，就聘请了一位顾问来填补潜在空白。在写作期间（2017 年），尽管团队现在有了五名出色的安全专家，但那位顾问仍在那里。\n\
  \n\n\n该顾问目前的角色是支持大型安全项目、提供日常通用型建议，并根据其所属咨询公司内其他客户所看到的安全趋势，确保业务处于最新状态。这位首席信息官（CIO）并不是第一个在任领导者入职后仍长期留用安全顾问的人。他们深知自己不能单独战斗，然而，为团队争取预算是一项挑战。为顾问获取资金则相对容易一些。他们的知识是新颖的，尽管存在可能不是永久性的这一风险，但他们通过第二双专家手来交付新领导者所需的能力是很有价值的。\n\
  \n## 他们需要预算和工具\n\n我不会在预算和工具上长墨太久，主要因为我关注的是安全领域的人才，但我会说这么一点：2016 年，`SANS` 对安全预算进行了研究，其中大部分处于\
  \ IT 支出范围内。敏感信息保护和监管合规是安全开支背后的两个最主要的业务驱动力。引入一位安全领导者并不是费用支出的开始、中间和终点。要成就伟事业，你们的新领导者可能需要自动化工具、第三方评估、检测和监控工具、测试、合规相关系统以及云安全应用的资金（例如分布式拒绝攻击（`DDOS`）和托管）。员工培训、认证以及通过会议和课程保持同步更新也需要资金。如果你计划将安全成为业务优先事项，你必须在预算中反映这一点——不能只是“拆东墙补西墙”，而是要真正地分配安全支出。获取所需的预算不仅需要衡量过去投资的成功（过去的安全投入可能很小，或者被双用途（安全与\
  \ IT 结合）的硬件和服务掩盖了），根据 `SANS` 受访者的说法，还围绕着确保合规、实现业务目标，以及提供事件数量和风险概况改进的证明，这是获取安全预算时使用的四个核心理由。\n\
  \n## 他们需要曝光\n\n在新安全领导者入职的前 30 天内，向董事会或审计委员会汇报不太可能是你们的首要日程。然而，值得计划让他们尽早发生。我接触过的一位\
  \ CIO 建议，尽管有了新的安全领导者，他仍然认为自己的角色是董事会在安全方面的教育者。这种方法在日常工作中运作良好，但当发生泄露或事件时，董事会需要知道是谁正在管理这些风险/问题/事件/影响。在事件发生期间第一次与他们见面并不是理想的。\n\
  \n随着全球网络安全事件的增加，我想知道有多少董事会最近第一次与他们的安全领导者见面，或者在长时间没有更新后才再次见面。董事会由人组成——他们也是人——他们的担忧源于不确定性和信息缺失。安全领导者可以增加他们对安全状况认知，提供定期、有效且与业务相关的更新、清晰的风险视图以及你们减少和缓解此类威胁的计划。你希望提供网络风险正在得到解决的确定性，让董事会对安全领导者建立信任。\n\
  \n如果董事会已经熟悉你们的网络安全策略，包括发生事件时的处理方法，这将确保任何关于网络事件的紧急董事会议将更关注手头任务。许多组织将网络风险纳入其企业风险清单——通常排名第一——但并非所有组织都将如何处理此类风险的策略“社交化”到董事会层面。定期、具有参与性的战略更新是关键，这样当事件发生时，董事会已经认识安全领导者以及在提高安全成熟度方面的进展。\n\
  \n在 2016 年澳大利亚网络安全中心调查中发现，韧性更强的受访者“更有可能在过去三个月内在董事会层面讨论过网络安全（87%），而被归类为韧性较差的仅为 59%”。\n\
  \n调查还显示，在韧性较差的组织中，21% 的近期董事会级网络安全讨论是由事件引发的，而韧性较高的组织这一比例仅为 6%。此外，韧性较低的组织通常比其他组织更有可能事后才讨论网络安全。\n\
  \n报告还指出，“无论韧性如何，都需要做更多工作将网络安全融入高级管理层的核心战略业务中”。\n\n总体而言，在 27% 的受访者中，网络安全在最高层很少被讨论，甚至从未被过。如果还没有引入，现在就是将安全引入董事会的时候了。高级管理层参与网络安全讨论是成功降低网络安全风险的关键因素。“最终，高层决策者对网络安全更好的理解有助于组织更有效地应对事件。”\n\
  \n## 久而久之，你们的新领导者可能需要一个团队\n\n所有业务在关注安全方面都要从哪里开始，新的安全领导者是一个极佳的起点。有一个专人致力于降低风险对组织的安全承诺将大有裨益。但正如我之前提到的，安全领导者不能单独做到这一点，虽然顾问有时会有帮助，但保护你们组织的需求只有通过能够深耕业务并满足其需求的专家才能实现，特别是当业务处于增长期时。\n\
  \n当我到达 `Sportsbet` 时，只有我和一个已经在那里了几个月的第三方顾问。当一年后我离开时，那里已经有了一名应用安全专家、一名架构师、一名分析师和一名信息安全主管来取代我。`Sportsbet`\
  \ 是一个拥有 700 人的组织，感谢于对安全的坚定承诺，他们利用安全团队能提供的每一小时。这过去和现在都是致力于支持其安全团队、履行监管义务（这需要资源）并将审计发现减少到最低的组织。如果没有一个专家团队在技术（新旧旧）上与业务紧密合作、深入新倡议、增加他人知识并提高安全基准，这一切是无法完成的。\n\
  \n## 候选人不需要什么\n\n其中一些是重复的，但为了完整起见，让我们看看安全领导者不需要、不想要或不具备管理能力的事项。\n\n*   你们的新安全领导者不是整个业务在未来任何时候每一个审计发现/行动的新所有者，也不是那些自战争以来就未露面的零星发现的所有者。是的，审计发现通常会导致基于新的或改进的安全控制措施的管理承诺，但许多审计发现与信息/网络安全无关。请确保不要让新领导者被归类为负责\
  \ IT 审计发现的责任人，这种情况通常是因为安全被认为是审计的紧密伙伴。\n\n\n\n\n\n*   你的新领导无法兼顾所有人的需求。从安全领域的招聘广告中可以看出，大多数安全专业人员被要求成为“全能手”。合规人员也需要精通安全。或者，反欺诈部门的人必须兼任信息安全负责人的职责。又或者，信息安全负责人必须同时分析安全事件日志。企业往往会错误地试图让一个人来解决所有的安全问题。指出一个人无法胜任许多人的角色似乎是常识，但从今天所招聘的许多职位来看，这似乎是人们的预期目标。\n\
  \n*   在至少的前六个月内，他们不需要安全供应商的介绍。销售人员非常擅长自己的工作，但大概率是，安全负责人对网络和业务运营的了解并不深入，不足以为讨论增加价值。此外，大多数安全负责人更倾向于在需要时（根据他们所提供的策略）主动联系供应商。\n\
  \n*   他们不需要对本应由业务部门管理的活动或结果负责。我在上面提到了审计，但还有一些任务是企业有时错误地希望由网络安全部门负责的，例如第三方供应商参与。安全团队负责提供一份需求清单，第三方在逻辑或物理上连接到你的网络时必须满足这些需求。安全部门不需要拥有风险，也不需要对是否与供应商合作做出最终决定。法律、IT、合规和财务部门都可以在签署或就特定供应商风险提供建议方面发挥作用。如果业务部门采纳了所有建议并愿意承担风险，安全团队或许可以接受。在指派网络/信息安全人员负责风险削减流程之前，请考虑风险削减流程的真正所有者。\n\
  \n这个列表与书中的其他列表一样，绝不是详尽的。\n\n## 核心启示\n\n新的安全领导需要的不仅仅是来自提供的日常支持。他们需要确信自己的目标是清晰的，已经获得了预算和规划，并且他们的投入将获得重视。\n\
  \n***\n\n21 Barbara Filkins，“IT 安全支出趋势”，调查，SANS Institute, 2016 年 2 月，[`www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697`](https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697)。\n\
  \n22 同上。\n\n23 2016 年网络安全调查, 澳大利亚网络安全中心, 澳大利亚政府, 2017 年，[`www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf`](https://www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf)。\n\
  \n24 同上。\n\n我不会在预算和工具上过多纠缠，主要因为我关注的是安全领域的人员，然而，我会说：2016 年，SANS21 对安全预算进行了研究，大部分支出位于\
  \ IT 支出范围内。敏感信息保护和监管合规是安全支出背后的两个最重要的业务驱动力。引入安全负责人并不是你支出的开始、中间和终点。要取得大成就，你的新领导可能还需要自动化工具、第三方评估、检测和监控工具、测试、合规相关系统以及云安全应用的资金（例如分布式拒绝攻击（`DDOS`）和托管）。员工培训、认证以及通过会议和课程跟上潮流也需要资金。如果你计划将安全作为业务的优先考虑之事项，你必须在预算中体现这一点——不能只是“拆东墙补西墙”，而是要真正分配安全支出。获得所需的预算不仅需要衡量过去投资的成功与（过去在安全方面的投入可能很少，或者被双用途（安全和\
  \ IT 结合）的硬件和服务所掩盖），它还围绕着确保合规、实现业务目标，并提供事件数量减少和风险概况改进的证明。\n\n\n\n\n\n最近，我向一位名叫大卫（David）的朋友请教了关于他的\
  \ CIO 如何帮助他应对能力挑战（the stretch）的经历。大卫在安全行业的经历是在 20 世纪中期的公用事业领域，当时正处于大规模的 IT 转型时期，公司请来了一位代理\
  \ CIO 来招聘正式 CIO 并实施新的 IT 组织架构。其中一个职位就是信息安全主管。\n\n当时，大卫是一名业务分析师，在 IT 部门中比 CIO 低四个层级。他当时二十多岁，拥有信息系统硕士学位。他热衷于参与这次\
  \ IT 转型。\n\n大卫定期与代理 CIO 会面，就转型团队完成的工作向其提供建议。在一次会议上，CIO 询问了大卫对信息安全、灾难恢复和业务连续性计划的看法。几天后，他被任命为信息安全主管，负责灾难恢复和业务连续性计划。他必须立即上任，并直接向\
  \ CIO 汇报。一夜之间，大卫被提升了三个级别，并对自己完全没有经验的领域负责。风险很大，对吧？\n\n在随后的几个月里，代理 CIO 导师式地引导大卫进入这一角色。他被赋予了自由，并鼓励做出重大决策。这种支持简单却有力，大卫拥抱了给予他的机会。大卫的观点不断受到挑战，直到\
  \ CIO 对所做出的决策感到满意。他也被允许犯一些错误，只要他能证明自己从错误中汲取了教训。\n\n给一个领导者机会是一个了不起的举动，但也涉及在辅导和导师方面的大量工作。在大卫的案例中，CIO\
  \ 给了他犯错和成长所需的自主权，并提供了足够的指导和支持，以随着时间的推移尽可能地减少这些错误。\n\n遗憾的是，在某些情况下，人们被任命时初衷良好，但情况发生了变化。例如，最近我接触过的一位\
  \ CIO 在内部任命了一位安全领导者，将一位基础设施领导者调到了安全岗位，并计划帮助他完成过渡。他已经在组织中工作很久，深受管理层的尊重，在 CIO 看来，他能够胜任新职责。他并不是她的首选，因为缺乏深厚的安全背景，但她愿意指导他并支持他在应对挑战方面的需求。\n\
  \n由于不可预见的情况，CIO 在几个月后离开了组织，因此她不再能指导该领导者在新角色中的工作。组织如何管理这一点对安全职能至关重要，也会影响 IT 及更广泛业务部门对安全的认知。CIO\
  \ 的退出是无法预测的。因此，CIO 必须确保信息安全主管获得其他高管的支持，并能寻求新任 CIO 的支持，以确保组织的持续保护。\n\n### 核心要点\n\n\
  应对你新安全领导者技能中的挑战，对你们双方来说都是一段充满回报且充实的经历。即使你的新领导者不需要大量的支持或改进，你的坚定支持也将对留住人才大有帮助。如果他们入任该职位时有很大的成长空间，请确保他们愿意参与自己的技能提升。这是进化为全方位领导者以及安全职能成功的关键。\n\
  \n### 21\n\n## 接下来该怎么办？\n\n### 关于衡量的说明\n\n“无法衡量，就无法改进。” —— 彼得·德鲁鲁克\n\n无法衡量，就无法改进。人们说，你衡量什么，就能得到什么。这确实是事实。\n\
  \n组织如何管理这一点对安全职能至关重要，也会影响 IT 及更广泛业务部门对安全的认知。CIO 的退出是无法预测的。因此，CIO 必须确保信息安全主管获得其他高管的支持，并能寻求新任\
  \ CIO 的支持，以确保组织的持续保护。\n\n对新领导者的期望是什么？根据 LinkedIn 的 2016 年全球趋势报告，招聘质量是 40% 公司和 45%\
  \ 小规模公司的首要考虑事项。\n\n在衡量成功时，还有许多其他需要考虑因素。问自己以下问题（无特定顺序），可以帮助建立上述的一些衡量标准：\n\n\n\n\n\
  \n新员工的成功在某种程度上取决于你。我既经历过成功的案例，也经历过希望事态有所不同的时刻。在这两种情况下，关键都源于我在招聘前的准备工作。在那个本可以做得更好的案例中，我聘请了一位向我汇报的新领导，在几周后，他来找我并解释了他对该职位和组织的疑虑，因为他对自己的目标没有清晰的认识。该职位是新设立的，我对于他的角色在头几个月应该向何处发展也没有清晰的，更不用说他可以期待实现什么了。我有预期，但这些预期只是骨架，没有实质内容。我们在文化上非常契合，在我的管理风格和他的执行风格方面也相处融洽。然而，只有当我坐下来与他设定了清晰的\
  \ `KPIs`（关键绩效指标）时，他才获得了成就感，我也开始看到出色的成果。我从这段经历中中学到了很多，我不希望看到其他领导处于类似的境地，尤其是当一些新员工并不一定有自信站出来承认他们看不清清晰的前景时。他面临的挑战之一是与组织的价值观不一致，这也影响了他的日常判断。（我们在第\
  \ 5 节中讨论了这一点，但我再次强调，因为它的重要性不应被低估。）\n\n密切关注你与新领导的互动，将帮助你衡量招聘决策的质量。在必要时，利用第三方教练的辅导机会来获得独立的视角，了解被任命者的需求，并对他们所加入的生态系统保持现实态度。这不仅可以帮助他们适应角色，还能让他们更好地理解风险，并满足更广泛的预期。\n\
  \n### 核心要点\n\n带领你的新领导开启这段衡量之旅，可以为他们招聘其他进入其管辖范围的安全人员员设定先例。虽然此书在招聘安全专业人员和领导者时提供了一个框架，但它也可以作为一个提醒：无论你聘佣了谁，先进行深层次的思考和规划，都能让你做出招聘决策更有信心，并增加你留住该员工的可能性。\n\
