    https://www.csoonline.com/article/3206688/it-careers/firms-look-beyond-job-boards-to-find-and-recruit-cybersecurity-talent.html.
    8 ‘The Australian Cyber Security Skills Shortage Study 2016’, AISA Research Report,
    Australian Information Security Association, 10 ‘Challenges to Australia’s Cyber
    Security Industry, Australian Cyber Security Growth Network, April 2017,


    In business, the growing number of conversations about cyber is helping to prepare
    organisations for potential cyber threats. In a government survey, 81% of organisations
    recognise that all staff have responsibility for ensuring cyber security and,
    overall 73% regularly discuss cyber security at the most senior management levels.6
    A move towards more senior security leaders who can approach the board with confidence
    and give its members certainty has become a must for cyber-resilient organisations.


    *   78% of AISA members surveyed believe that lack of clarity about skills required
    contributes to difficulties in recruiting for cyber security roles.8

    *   At any time, there are 350,000 open roles for cyber security professionals
    in the U.S.7

    *   Difficulties in recruiting because of wage restrictions and the tendency to
    leave positions unfilled are consistent with evidence of the limited growth of
    cyber security teams; 52% reported that their team had remained about the same
    or grown by less than 10%, while more than 11% of respondents reported a decrease.9
    9 Ibid. 11 Patrick Howell O’Neill, ‘Women paid less than men at every level of
    cybersecurity industry, report says’, Cyberscoop, 15 March 2017, https://www.cyberscoop.com/women-in-cybersecurity-wage-gap-report/.
    6 Ibid.


    ## 2


    ## What is your why?


    ‘If you hire people just because they can do a job, they’ll work for your money.
    But if you hire people who believe what you believe, they’ll work for you with
    blood, sweat and tears.’

    Simon Sinek, author


    When I began asking CIOs what problem they were solving by hiring a security professional,
    the answers didn’t surprise me. Responses such as ‘The audit and risk committee
    told us a recent audit showed we need to address cyber risk better, and this included
    hiring a leader to take responsibility’ were common. Some responses focused on
    domain expertise, having an expert to define the strategy and mitigate the organisation’s
    security risks.


    Some of the less common responses were that a security leader was needed to advise
    the CIO and that security awareness was key to their remit.


    The overwhelming majority spoke about protecting the customer. This is a great
    place to start as a rationale for having a security team and a security leader.
    If you put protecting your customer at the heart of what you do, your reason for
    being will be similar to that of the sales, marketing, finance, and operations
    teams: retaining the customer. Protecting the customer also means retaining your
    reputation in the market and ensuring the resilience of systems to continue operating
    through threats and incidents.


    The point of this chapter is that no matter what your reasons are for bringing
    in a security leader, you are prepared to back this leader in their pursuits to
    deliver.


    ## 3


    ## Security maturity


    ‘Seek first to understand, and then be understood.’

    Stephen Covey, The 7 Habits of Highly Effective People


    I have been fortunate in my career to arrive in roles that have strategies – or
    the bones of one – already thought through. I then take the time to review the
    documentation and ensure the strategy fits the business, is up to date with the
    business strategy, is realistic, and is one I can be proud to deliver. As a new
    leader coming into an organisation, it gave me great confidence that in the absence
    of a security leader or team, an organisation had invested in understanding their
    security maturity and what they might need to do. This was certainly a ‘pro’ when
    it came to deciding which roles to take on.

