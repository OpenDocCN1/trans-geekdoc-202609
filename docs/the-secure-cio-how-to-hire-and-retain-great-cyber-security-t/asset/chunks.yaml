    Claire Pales 是 27 Lanterns 的董事，这是一家致力于帮助机构创建并维持有效信息安全团队的咨询公司。在过去的 15 年里，Claire
    积累了在澳大利亚及亚洲（包括中国香港和印度）建立团队和领导屡奖安全策略的经验。Claire 的信息和网络安全经验涵盖关键基础设施、在线和电子商务团队，并持续关注成长和培养从毕业生到领导者的信息安全专业人士，帮助企业建立卓越的信息安全实践。


    Claire 拥有警察研究学士学位、网络犯罪调查研究生学习背景，并具备执行教练资格。


    Claire 住在墨尔本，有四个孩子，是一位活跃的行业博客作者，并担任澳大利亚女性安全网络（Australian Women in Security Network）的志愿者。


    [www.27lanterns.com.au](http://www.27lanterns.com.au)


