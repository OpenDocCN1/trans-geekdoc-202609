  trans: "\n\n*   你认为安全应该如何融入整体业务战略？（这在某种程度上是一个陷阱问题。你希望安全不会被描述为一个战略支柱，而是被视为业务运营方式的基石——就像文化和价值观一样。（顺便提一下，我见过一些尚未成熟到可以“奠定”基石的组织，它们在安全成为业务模式之前，需要先有一个战略目标）。）\n\
    *   你认为组织最大的/第一大风险是什么？这可以是任何你认为是最大的风险，不一定是指与安全相关的。\n*   你认为业务部门对项目和方向上引入更安全的叠加层将会有何种反应？\n\
    *   有哪些安全实践是你们部门特有的（如果有的话），它们是否有效？（有些人可能不知道这个问题的答案，这证明了有必要去沟通并实施那些可能在某处吃灰的政策。）\n\
    *   谁对安全负有最终责任？（这将告诉你，如果发生重大的泄露或其他安全事件，安全将如何如何被看待）。\n*   我们应该优先教育谁，客户还是员工？\n*\
    \   你认为安全是市场的一种差异化优势吗？\n*   新的安全负责人应该向谁汇报？（虽然 CIO 通常是自然人选，但有时是 CFO、CEO、首席风险官、首席技术官，甚至可能不是\
    \ C 级高管）。\n*   你希望领导者具备什么样的特质或属性？（这将让你了解这位新领导所处的环境。一个影响者、一个启发者、一个冒险者、一个独立、多才、具备技术意识或精通技术技能的人——这些不同类型的技能和经验可能帮助领导者取得成功。）\n\
    *   组织是如何管理变化的？\n*   你还建议我与谁交谈并向他们提出这些问题？（对话可能会引出你没有考虑过的人）。\n\n如果你有任何这里没有列出的、你想讨论的新问题或疑虑，请发送至\
    \ info@27lanterns.com。这也有助于我们通过新鲜、新的案例来帮助他人。\n\n在进行这些访谈时，我发现的一点是存在许多共同点。在一家组织中，我访谈的\
    \ 20 位领导和利益相关者中，有 15 人表示他们组织的安全工作太被动，他们觉得需要更加主动才能看到变化。显而易见的是，他们希望安全透明度更高，并且预防事故而非响应事故。我合作过的另一家公司也达成了共识，即\
    \ CEO 对安全负有最终责任，但他并不知道这一点；他也不知道这种责任要求他做什么。\n\n这些反馈可以提交给董事会、执行层、审计委员会——任何愿意听的人。这些问题的答案对于新入任的领导者来说也是金子。了解组织内部如何看待安全，以及领导者如何看待安全，这些是非常重要的。在最近一次框架交付中，我将访谈记录朗读给一位新入任的网络安全主管，帮助她构建组织框架。我保持对话氛围轻松，并对我的速记进行了详细说明，以便她能从分解的意见中获得最大的价值。她获得的洞察是巨大的。在面对面见到许多利益相关者时，她能够产生共鸣，因为她理解了他们的一些顾虑以及关于传播安全意识的想法。\n\
    \n### 核心收获\n\n在生活中，他人的想法并不总是重要。但在安全领域，知道谁从第一天起就会支持你，谁是你需要赢得挑战，可以决定安全计划的成败——以及领导者及其任期。有时，最重要的洞察来自最意想不到的地方。听听利益相关者对安全和风险的看法，可能会挖掘出一些可以加入你议程的宝贵行动——以及负责执行它们的人。在时间允许的情况下，针对尽可能的相关人员，以确保你拥有组织的良好代表性。\n\
    \n### 5 对齐业务战略\n\n“仅仅将网络安全视为一个 IT 问题，就像认为一家公司从 CEO 到底下的所有员工都是人力资源问题一样。”\n\nSteven\
    \ Chabinsky，White & Case 律师数据、隐私与网络安全全球主席\n\n如果你读过第 2 章，就会知道这份议程本身并不是一种战略。议程只是一个起点。将你的议程与整体业务战略对齐是非常重要的。我指的不是将安全包含在战略中（关于更多信息请参阅第\
    \ 2 章）。当我说“重要”时，我的意思是“必不可少”。新入任的领导者应该能够将议程中强调的安全活动直接与组织的战略、目标、使命和任务联系起来。本质上，安全没有选择，必须根据组织的商业驱动力前进。\n\
    \n记录并交付一份与业务战略对齐的网络安全议程，将为新入任的领导者提供一个起点和一个基础，以此构建详细的信息安全战略。\n\n当涉及到议程的战略对齐时，有几点需要考虑：\n\
    \n1. 首先，你们从事的是哪种业务？初创公司？还是历史悠久的标志性品牌？你们处于什么行业？组织正在经历多大程度的变化？（此列表绝非详尽。）答案将帮助你理解自己的风险。\n\
    2. 业务在一年计划中的终极目标是什么？这可能是客户/成员增长 50%、比竞争对手获得更多利润、成为行业第一、成为首选雇主……等等，以此此类推。\n3. 思考安全将如何为业务战略增加价值。组织最关心的是什么？\n\
    \    1. 如果是维护客户的信任，保护他们的数据就是关键。\n    2. 如果是在研发领域保持领先，知识产权的保护和机密性是重点。\n    3. 如果你是内容提供者，你必须优先数据和服务的完整性和可用性。\n\
    \n考虑到这一点，将业务最关心的点转化为安全议程的焦点点。如果整体业务战略是从传统的模拟组织向数字化转型，你可能有开发者向公共网站或 App 提交代码。如果是这样，且他们没有按照安全代码规范进行编码，那么你的重点任务之一可能是审查应用程序安全。这可能影响你选择的领导者类型，或他们建立的团队类型。\n\
    \n如果你是一家处于指数级增长的初创公司，你的整体战略计划可能包括继续这一轨迹。然而，你可能在使用一些在你们“年轻”时适合存储数据的工具和系统。随着你的增长，这种做法变得不可持续。如果这些数据是敏感的或包含私人信息，你新领导者的首要任务将是建议保护这些信息的安全实践，既是为了客户，也是为了符合隐私法律。在这种情况下，一个重点任务之一就是数据安全/保护。\n\
    \n作为额外，正确的这种对齐将为你的沟通计划提供支持，因为你的安全信息不仅仅是关于拥有安全的密码和不点击链接。它是关于安全在推动业务发展方面的作用。\n\n\
    ### 核心收获\n\n议程不是战略。它是一个起点，用于考虑安全如何为业务在未来 12 个月内要实现的目标（当然，是指日常工作之外）增加价值。\n\n"
