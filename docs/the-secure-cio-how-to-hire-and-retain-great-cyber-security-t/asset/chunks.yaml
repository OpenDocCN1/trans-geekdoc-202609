  trans: '

    人脉拓展并不是每个人都喜欢的。有些人纯粹不喜欢和人打交道。（这很奇怪，但事实如此！）如果没有人脉拓展，我将不知道大学毕业后担任过的任何工作——我也不会失去我一些非常棒的朋友！我的每一份工作都是通过我认识的人或我刻意去结识的人介绍的。


    “重要的不是你知道什么，而在于你认识谁”这句老话因为人脉拓展而变成了陈生常谈。我恳求你，下次获得机会时，请努力去建立人脉。接受午餐邀请，开启对话，或者找一个你可以参加的非正式活动，在在那里你可能会遇到某人，而那个人认识的人对你提供的职位感兴趣。


    顺便提一下，可能值得联系一些关注安全的协会，以了解他们拥的人脉拓展机会，或者如果他们愿意，可以向他们的成员介绍你的职位。如果你在澳大利亚，澳大利亚信息安全协会（Australian
    Information Security Association）和澳大利亚女性安全网络（Australian Women in Security Network）是两个很好的起点。


    ## 选择合适的共同面试官


    最后，但绝非不重要，选择合适的人来共同面试你的候选人。在招聘的各个阶段，你身边的人对于选择匹配的候选人至关重要。要做到这一点具有挑战性，因为很难知道人们在面试情境下的反应。有些人对安全专业人员所需的特质有先入为主的想法，而另一些人则毫无头绪。无论如何，考虑谁最适合分享第一、第二和第三轮面试阶段是非常重要的。选择一个与新领导有紧密合作的人，对于性格或文化契合度很有帮助。然而，你无法取悦所有人，所以对于你从另一个意见中需要什么，要保持谨慎且诚实。如果你想找到最合适的候选人，你所选择的人必须认同你的计划、你的首要关注以及你不可妥协的底线。


    ### 关于你的共同面试官需要考虑的几点：


    * 这名新员工会对每位共同面试官的日常生活产生多大影响？

    * 他们是否知道你对新员工的目标，并是否尊重这些目标？

    * 你与他们的工作关系是什么？

    * 新的安全主管与共同面试官之间的工作关系将是怎样的？

    * 你会在所有面试中保持同一个共同面试官，还是会更换人选？

    * 如果安全对你的组织来说是新领域，你的共同面试官对理解候选人经验的准备程度如何？

    * 考虑你共同面试官的性别平衡


    ## 核心总结


    仔细考虑如何让相关人士围绕在你身边以获得最佳结果。以上所有内容都需要精力和投入，但如果你能根据推荐、与候选人的联系以及良好的面试团队找到合适的候选人，这些努力将是非常值得的。


    ***


    [1] Gina Belli, ‘至少有 70%的工作职位甚至没有列出——这里是如何增加你获得理想新工作的机会’, Business Insider, 2017
    年 4 月 10 日, [`http://www.businessinsider.com/at-least-70-of-jobs-are-not-even-listed-heres-how-to-up-your-chances-of-getting-a-great-new-gig-2017-4?IR=T`](http://www.businessinsider.com/at-least-70-of-jobs-are-not-even-listed-heres-how-to-up-your-chances-of-getting-a-great-new-gig-2017-4?IR=T)。


    在寻找候选人时，人脉拓展与员工内部推荐一样是成功的公式。据估计，85%以上获得公开职位的人是通过人脉拓展获得的。与同行的 CIO 建立人脉、参加与安全相关的活动，以及在安全人员（或未来的安全领导者）聚集的活动上演讲，都会增加挖掘优秀人才的机会。让自己身边围绕着经历过类似过程的
    CIO 是有帮助的。听听他们的实战故事、成功案例以及他们如何管理安全工作，可以让你对他人的经历产生见解，你也可以从他们的好运或不幸中学习。他们可能拥有一些不适合他们职位但适合你职位的候选人。此外，直接与那些可能与你合作或为你工作建立人脉是一个极好的方法。


    ## 你允许突破空间吗？


    “如果你的行动能激励他人梦想更多、学习更多、做得更多、变得更好，你就是一个领导者。”

    约翰·昆西··亚当斯（John Quincy Adams），前美国总统


    在担任经理和顾问期间，我读过许多优秀的简历，并遇到过一些才华横溢的候选人。我也遇到过一些傲慢的申请者、一些低调的领导者，以及一些不确定自己要去哪里、为什么去去的专业人士。


    通过对一套框架的交付，我最近遇到了一位非常优秀的候选人——我们称她为 `Jill`——我后来录用了她，并指导过她。我最初是在 `LinkedIn` 上发现了
    `Jill`。

    '
