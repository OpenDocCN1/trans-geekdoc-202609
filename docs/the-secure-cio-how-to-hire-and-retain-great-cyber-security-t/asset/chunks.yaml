    ‘According to the findings, confidence or lack thereof, was actually the least
    common reason men and women did not apply. Instead, the most common response,
    with 46.4% of men and 40.6% of women choosing it as their first reason, was: “I
    didn’t think they would hire me since I didn’t meet the qualifications and I didn’t
    want to waste my time and energy”. Survey responders didn’t lack confidence in
    their ability or their skills, instead they were interpreting the job description
    as a hard and fast outline of skills and experience a qualified candidate must
    have”.[15](#sbh9shsl.html#f3k28cv1jb8)


    ## Megan Noel


    ## Expanding the Industry


    If we want to expand the industry, we need to do a few things. First, get real
    about the `JD` and what is truly needed in the first instance. Second, stop using
    advertising as the only mechanism to recruit, and get out to networking events
    and meet the men and women you require. Finally, realise that security staff come
    from diverse backgrounds and many have had some very specialised experience. We
    need to allow them to evolve into a role, to invest in their professional development
    and allow room for stretch (more on that in chapter 12). I’m not suggesting we
    put the organisation at risk by employing underqualified candidates who can’t
    provide the minimum viable outcomes needed for the role just because they are
    women, or just because they are men. I’m suggesting that new ways of attracting
    and retaining security professionals are needed, and `JDs` play a part in this.


    ## Creating Realistic Job Descriptions


    For a realistic job description, stick to the requirements/expectations you have
    of this person for the next 12–18 months. The security person you need today is
    not the security person you need in two years’ time. Security evolves, and it
    evolves quickly. Today, you might need someone who has great start-up skills –
    vendor management, application security, thought leadership, and innovative ideas
    to create a secure culture. In two years’ time, you might need to ‘calm the farm’,
    as they say, and consider compliance, identity management, or security in acquisitions.


    When I asked `CIOs` if the security posture made a difference to whom they hired,
    the responses were mixed. Yes; no; maybe; not really. But you can’t carry the
    same detailed job description across many years and hope that the security function
    will continue to grow and prosper. `JDs` are living documents, and you can still
    adjust for change and growth without taking away from the core accountability
    of the role.


    ### Tips for Assembling a Realistic Job Description


    Aside from your near-term focus, here are some tips to assemble a more realistic
    job description:


    *   Be careful about what is desired, mandatory, and ‘an advantage’. Think carefully
    about what you put under each of these headlines. Does your security leader really
    need every certification? Do they need a background in financial services just
    because you are a bank? Is strategic planning really just desired? I’m not suggesting
    any of these are wrong, or right, but be clear on your mandatory expectations
    and non-negotiables, and be even clearer on what you could sacrifice in return
    for a candidate who is 75% there.

    *   This document is needed for performance reviews and against which you will
    manage your new leader. You can’t afford for it to be too subjective.

    *   Set realistic expectations for workloads and responsibilities.

    *   Be clear about how the role fits in with the rest of the organisation.

    *   Be clear about the short- and longer-term goals.

    *   Provide a definition of success. Any `JD` that’s too broad can appear insurmountable
    for a candidate or employee, and success can seem a distant oasis.

    *   Strike a balance between brevity and detail. More than two or three pages
    and you’re likely to lose the reader on a number of levels.


    ## Certifications, Boom or Bust?


    Security certifications, such as `CISSP`/`CISM`/`CISA`/`CEH`, are fast becoming
    the norm in job descriptions as a measurable way to assess a candidate’s expertise
    and as a screening mechanism for human resources. However, the value of security
    certifications has long been debated. There are many schools of thought on requiring
    certifications in job descriptions. Here are a few that have been expressed to
    me over the years:


    1.  Certifications are a must-have, especially when hiring ‘technical’ security
    staff, as people who come together who have the same certifications are able to
    speak a common language on security.

    2.  `CISSP`, for example, is not easy, at 250 questions and up to six hours, to
    sit. But it is argued that all a security certification proves is that you can
    successfully read a book, sit an exam, and pay a huge fee, as all the content
    is available to be studied from a textbook. The bottom line is it provides theory,
    but not on-the-job training.

    3.  Certifications are of value if you are early in your career, or are new to
    information security after years in another profession; however, given the prerequisite
    years of experience required in order to qualify, it’s out of reach for those
    who need it most.

    4.  Certifications that are outdated in terms of the technology they teach, platforms
    they rely on, or policies to live by are useless, but an assessing `CIO` or hiring
    manager may not be aware of this.

    5.  Certifications that are software-specific, such as `Microsoft`, `Cisco`, and
    `Oracle`, are considered of more value than a security-specific qualification.

    6.  A security leader with an `MBA` is of far greater value than someone who has
    put in the same hours studying for `CISSP` or similar.

    7.  Leadership experience, networking, and attending relevant industry meetings/conferences
    is, collectively, of greater value than a certification gained five years before.

    8.  Certifications can provide base-level confidence to `CIOs` who are unable
    to confidently assess security candidates. Achieving a certification also shows
    that they have some commitment to continued learning in the security industry.

    9.  Many different certifications are available. Ultimately, the application of
    the candidate’s knowledge is more important than the number of certifications
    someone has achieved.

    10. Completing too many certifications can suggest a lack of career focus and
    planning. Certification should support your career direction rather than be achieved
    to meet a job description for leadership roles.


    There is always the option to hire someone whom you believe can meet your non-negotiables
    and some of your less urgent requirements. Once on board, offer to put them through
    certification if it means a lot to you as a leader/line manager, or to align the
    candidate with their security peers in the organisation. Investing in staff can
    provide not only upsk of your team but increase the likelihood of retention and
    job satisfaction. Some certifications are not cheap, from both a financial and
    time commitment. Offering your team a chance to increase their skills and knowledge
    while they are in a role can do wonders for morale and commitment.


    Side note: Some items that might be of equal or greater value than certifications
    when hiring include joining professional institutions/organisations dedicated
    to security (`ISACA`, `OWASP`, `Cloud Security Alliance`, `Australian Information
    Security Association`, or your local equivalent), keynote speaking, and volunteering
    with security associations.


    ## A word on job titles

