    \ \n\nAccording to LinkedIn’s 2016 global trends report, the quality of the person\
    \ hired is a priority for 40% of large companies and 45% of smaller ones.25 But\
    \ how many of these businesses actually measure the quality of their new employee?\
    \ Traditionally, security roles were considered difficult to evaluate based on\
    \ the measurements you might assume appropriate, measurements such as zero breaches,\
    \ or zero data lost, or zero security incidents. But incidents, breaches, and\
    \ data loss cannot be completely controlled. Don’t confuse measuring your leader\
    \ with measuring the program. Measuring whether your hire has met your expectations\
    \ can be based on your agenda, what you want the leader to achieve against broader\
    \ business key performance indicators, and how they might be progressing in addressing\
    \ the stretch.\n\n### \n\n22\n\nIt’s never a ‘wrap’\n\n‘What feels like the end\
    \ is often the beginning.’\n\nAnonymous\n\nMovie directors will shout, ‘That’s\
    \ a wrap’, when filming is complete. Once done, it’s up to another team of experts\
    \ to come in, take the hard work of the actors, and create a movie that will win\
    \ box office acclaim.\n\nWhen it comes to hiring and retaining cyber security\
    \ talent, it’s never a wrap. You can’t set and forget these people. You can’t\
    \ afford to imagine they will be able to function without support. Aside from\
    \ the probable need for more security staff around them, there’s a real chance\
    \ that some of their peers in the organisation will require coaxing to support\
    \ the security function, especially if it’s new.\n\nMany organisations travel\
    \ along in quiet ignorance about their security position – remember, the average\
    \ time to detect a breach is more than 140 days[26](#9mdyh4wu.html#f3k28cv1jcy).\
    \ So, the introduction of this staff member may seem more like an interruption\
    \ rather than a welcome change to the IT leadership team.\n\nThe new leader will\
    \ likely feel overwhelmed when they first join. And after the initial flurry of\
    \ activity – greeting the executive team, bedding down the strategy, and kicking\
    \ off the regular security-related meetings – the hard work certainly lies ahead\
    \ of them.\n\nI have had heads of cyber security call me weeks into a new role,\
    \ concerned that they are not the right fit, that they can’t keep up with the\
    \ organisation’s rapid delivery on customer expectations, or they feel they can’t\
    \ achieve the strategy on their own. Others call me every six months when they\
    \ find themselves in the same position as their organisation goes through the\
    \ ebbs and flows of delivery, budgets, project delays, and breaches. I coach these\
    \ leaders regarding their value and remind newer employees that trust and impact\
    \ take time, that they don’t want to be labelled as that person who came in and\
    \ slammed the table to make the chess pieces all fall down, figuratively speaking.\n\
    \nAs a CIO, your role as a mentor and a business leader is important. We discussed\
    \ at the very beginning about how every CIO’s workload is growing, you’re becoming\
    \ more strategic, and you have more than ever on your plate. I’m not suggesting\
    \ that the new security leader is, or will be, needy. What I am suggesting is\
    \ that even if you don’t know a lot about security and can’t offer subject matter\
    \ guidance, your new leader will likely need your support to rally the troops\
    \ and raise the profile of security initially as well as in the longer term.\n\
    \nOne CIO I interviewed suggested the security know-how of a CIO was more important\
    \ when assessing a potential candidate than the security maturity of the organisation.\
    \ He believed the ability of the CIO to support the security leader, and their\
    \ reliance on that security leader to educate them, was key. This suggests to\
    \ me that the CIO needs just as much support and guidance, especially in the early\
    \ days, as the security leader does.\n\nIt may seem that the hiring and retaining\
    \ a cyber security leader is a lot of hard work, and it can be. But with careful\
    \ planning it can also be rewarding, and can shape you into a more rounded CIO\
    \ with excellent experience to take into future roles.\n\n\\_\\_\\_\\_\\_\\_\\\
