    \ job description should reflect the reality (needs), not the dream outcome (wants).\
    \ By all means decide on some non-negotiable traits and experience. Be clear on\
    \ what this person needs to achieve and what the priorities are.\n\n3 Board pressure\n\
    \nThere is board pressure to fill the role and have someone address cyber risk\
    \ fast.\n\nIt’s important for the board to voice its concerns about cyber security\
    \ so you are aware of its position; however, panic and knee-jerk reactions are\
    \ not helpful. The Australian Cyber Security Centre found that regular board and\
    \ senior management level discussions about security are a key factor distinguishing\
    \ cyber-resilient organisations from less resilient ones.[5](#qmegfk9d.html#f3k28cv1jb2)\n\
    \nWhile the board should see cyber security as everyone’s responsibility, they\
    \ will still want one confident, trusted voice to assure them that security is\
    \ being addressed. It is important to set expectations about the timeframe required\
    \ to fill this security role.\n\nAddressing these three recurring problems brought\
    \ me to the central question that is answered by this book: How can you find and\
    \ retain a great cyber security leader to give the board certainty and protect\
    \ the organisation?\n\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n[2](#qmegfk9d.html#f3k28cv1jb3)\
    \ Barbara Filkins, ‘IT Security Spending Trends: a SANS Survey, SANS Institute,\
    \ February 2016, [https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697](https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697)\n\
    \n[3](#qmegfk9d.html#f3k28cv1jb4) Ibid.\n\n[4](#qmegfk9d.html#f3k28cv1jb5) 2016\
    \ Cyber Security Survey, Australian Cyber Security Centre, Australian Government,\
    \ [https://www.acsc.gov.au/publications/ACSC\\_Cyber\\_Security\\_Survey\\_2016.pdf.](https://www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf)\n\
    \n[5](#qmegfk9d.html#f3k28cv1jb6) Ibid.\n\n5 Ibid. \n\nAs the need for security\
    \ spending increases, however, overall IT budgets appear to be dropping, with\
    \ mid-tier organisations being in the range of US$1 million–10 million.3\n\nAnd\
    \ speaking of expenditure, who pays to clean up a security breach? The Australian\
    \ Cyber Security Centre says, ‘The costs of compromise are almost certainly more\
    \ expensive than preventative measures’,4 and therefore having a dedicate security\
    \ budget (not one scrapped together) for things such as early incident detection\
    \ is becoming key to protecting your organisation.\n\nThe SANS Institute is the\
    \ largest IT security training, certification, and security documents source in\
    \ the world. Their Security Spending Trends Report for 2016 found that since 2014,\
    \ security usually accounts for 4–6% of a company’s total IT budget. But the number\
    \ of companies with budgets in the 10–12% range is growing.2\n\n4 2016 Cyber Security\
    \ Survey, Australian Cyber Security Centre, Australian Government,  \n\nIt’s important\
    \ for the board to voice its concerns about cyber security so you are aware of\
    \ its position; however, panic and knee-jerk reactions are not helpful. The Australian\
    \ Cyber Security Centre found that regular board and senior management level discussions\
    \ about security are a key factor distinguishing cyber-resilient organisations\
    \ from less resilient ones.5\n\n3 Ibid. 2 Barbara Filkins, ‘IT Security Spending\
    \ Trends: a SANS Survey, SANS Institute, February 2016,  \n\n### \n\nSection 1\n\
    \nClarity: Establishing your Agenda\n\n‘Preparation is the key to success.’\n\n\
    Alexander Graham Bell, inventor, innovator\n\nThe framework begins with clarity\
    \ – clarity on why you are recruiting, on the current state of security in your\
    \ organisation from your perspective and that of your stakeholders, and on where\
    \ a new leader would fit into the overall organisational structure."
