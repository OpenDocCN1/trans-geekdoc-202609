  raw: "Networking is not everyone’s cup of tea. Some people simply don’t like people.\
    \ (Strange, but true!) Without networking, I would not have known about any of\
    \ the jobs I have held since leaving university – and I wouldn’t have some of\
    \ my great friends either! Every one of my jobs has been suggested to me through\
    \ people I have known or those I have made it my business to know.\n\nThe old\
    \ adage ‘It’s not what you know, it’s who you know’ became an old adage thanks\
    \ to networking. I implore you, next time you get the opportunity, to make the\
    \ effort to network. Accept an invite to lunch, strike up a conversation, or find\
    \ an informal activity you can attend where you might meet someone who knows someone\
    \ who is interested in the role you have on offer.\n\nAs a side note, it might\
    \ be worth contacting some security-focused associations to understand the networking\
    \ opportunities they have, or to advertise your role with their members if they\
