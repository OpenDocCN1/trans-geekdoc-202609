  trans: '


    在议程定稿到新员工入职之间，可能会发生一些你可能希望向他们简报的其他潜在变化包括：


    * 成本削减

    * 架构重组

    * 外包

    * 从本地化向云端的迁移

    * 安全相关事件、其影响、解决方案及教训

    * 基于行业内安全事件的新威胁

    * 新的审计发现

    * 新运营模式


    作为 `CIO`，你不需要进行所有这些更新简报。可能当新领导与组织内各个部门的人员见面时，这些人可以填补空白并提供更新。关键在于考虑这些信息，因为与他们从议程中读到的内容相比，这是一项重要的变化。同样，如果你已经开始进行某些审计整改，应安排人向新领导简报其进展情况、负责人是谁，以及新领导在与审计人员合作处理安全相关事宜时可能扮演什么角色。


    #### 核心要点

    除了议程简报外，对组织变化以及任何显著影响“大石头”（核心任务）事项的更新也非常重要。如果已经过去了一段时间，假设议程反映了组织的现状可能是危险的，而且让安全负责人与关键利益相关者建立良好关系是当务之急。


    ### 18

    #### 什么是教练？

    （这不是在场边大喊大叫）


    “教练是释放人的潜力，使其自身表现达到最大化。”

    约翰·惠特莫尔（John Whitmore），执行教练先驱


    在让新员工过渡到组织的过程中，可能涉及使用教练。这项投资在许多方面都有帮助，特别是考虑到我们在上一章中涵盖的细节。教练可以帮助思考创新的方式，为组织提供更安全的成果，而这个组织在此之前可能还没有专门处理过
    `cyber risk`。


    由于曾担任过导师，并与同级、下属、高管及普通人进行过大量交流，在获得教练认证之前，我以为我知道什么是教练了——它的价值所在以及人们为什么要寻求它。但你知道人们是如何评价假设的。事实证明，我的一些先入为主的观点是错误的。事实上，教练很大程度上在于教练提出极佳的问题，然后保持安静、倾听，并创造足够的信任和张力，引导客户获得有用的结果。


    `国际教练联合会`（International Coaching Federation）将其定义为“一种持续的专业关系，帮助人们在生活、职业、业务或组织中取得非凡的。通过教练过程，客户加深了学习，提高了表现并增加了生活质量”。20


    那么我为什么要告诉你这些呢？为什么你的新员工需要教练呢？因为即使他们表现得完美，也有改进空间。（我们将在第 20 章讨论“应对挑战性”，那是使用教练的好时机。）你可能因为成本原因或认为你认为引导下属解决问题、担忧和复杂决策是你的职责，而放弃了为员工提供教练的想法。然而，世界上最成功的一些人都有专门从事其领域领域的教练，许多人在已经成功的情况下也聘请了教练。教练关乎开发高潜力表现者的能力。教练对于那些愿意学习、成长并对未来负责的人有效。职业或个人生活中的教练，与精英运动员与教练合作以改进已达世界级水平的成果没有区别。


    在招聘和留住 `cyber security talent` 的情况下，教练帮助个人进入角色，解决可能出现的复杂问题，并提升他们的表现方式。


    根据你在完成此书框架的第 5 部分时设定的预期目标和结果，在教练课程期间可以探索以下类型的内容：


    * 角色扮演场景：练习并尝试对预期情况的可能反应，以磨练技能并建立对新行为的适应感

    * 建立更好的倾听和提问技巧，以提高符合利益相关者预期的交付

    * 问题解决：通过提启发性问题激发创造性的问题解决

    * 针对实际工作挑战进行头脑风暴


    教练支持新员工，提高留任率，增强承诺，并且与导师不同，它鼓励领导发现自己的解决方案并交付成果。作为唯一的安全负责人加入组织可能会感到授权但也可能感到孤立。在未来几个月里为领导提供与教练处理挑战的机会，对组织具有巨大的价值。


    #### 核心要点

    教练不是导师、辅导或指示。教练是新员工的价值资源，用于帮助他们过渡、处理选项以及解决阻碍或瘫痪他们的行为。


    ### 19

    #### 候选人需要什么？

    “别人的成功绝不会削减你的光芒。”

    匿名


    以下我和行业内其他人在开始新职位时证明有效的建议。作为安全领导，所有的支持都受到欢迎和感谢。支持新领导的方法有很多，虽然我在第 16 章中讨论了入职前 30
    天的短期支持，但这里有一些长期需求。


    #### 他们需要高质量的第三方顾问

    在我的研究期间，一位 `CIO` 建议，如果信息安全负责人职位空缺很长时间（幸运的是在他那里没有发生），他将聘请一位顾问来维持组织运转，直到找到心仪的领导。这就是他在
    2015 年所做的，尽管当时组织已经找到了接手招聘职位的人选。该职位空了六周，但一旦现职者辞职，就聘请了一位顾问来填补潜在空白。在写作期间（2017 年），尽管团队现在有了五名出色的安全专家，但那位顾问仍在那里。

    '
- fmt: '

    The consultant’s current role is to support larger security projects, provide
    day-to-day generalist advice, and keep the business up to date on what he sees
    in security across other clients within his consulting company. This CIO is not
    the first person to keep a security consultant on long after the new leader has
    joined. It is recognised that they can’t do it alone, and yet, getting budget
    for teams is a challenge. Obtaining funding for a consultant is a little easier.
    Their knowledge is also fresh, and despite the risk that they might not be permanent,
    there is value in their ability to deliver what the new leader needs from a second
    pair of expert hands.


    ## They need budget and tools


    I won’t bang on too long about budget and tools, mostly because I’m all about
    the people in security, however, I will say this: In 2016, `SANS` undertook research
    into security budgets, most of which were within IT expenditure. Protection of
    sensitive information and regulatory compliance are the two most significant business
    drivers behind security spending. Bringing in a security leader is not the start,
    middle, and end of your expenses. To achieve great things, your new leader potentially
    needs funding for automation tools, third-party assessments, detection and monitoring
    tools, testing, compliance-related systems, and cloud-based security applications
    (think distributed denial of service (`DDOS`) and hosting). Staff training, certification,
    and keeping up to date through conferences and courses also cost money. If you
    plan to make security a business priority, you must reflect this in your budget
    – to not just borrow from Peter to pay Paul but truly allocate security spend.
    Getting the budget you need requires more than measuring the success of past investment,
    which might have been very little in security, or masked by dual-purpose (security
    and IT combined) hardware and services. It also revolves around ensuring compliance,
    enabling business objectives, and providing proof of improvements in incident
    counts and risk profile, the top four justification points used in obtaining a
    security budget, according to `SANS` respondents.


    ## They need exposure


    It’s unlikely that a trip to the board or audit committee is high on your agenda
    for your new security leader in their first 30 days. However, it is worth planning
    for this to happen sooner than later. One of the CIOs I spoke with suggested that
    despite the new security leader, he still saw his role as the educator of the
    board on all things security. This approach can work fine day to day, but when
    there is a breach or an incident, the board needs to know the person who is managing
    the risk/issue/incident/impact. Meeting them for the first time during an incident
    isn’t ideal.


    With global cyber events on the rise, I wonder how many boards have recently met
    their security leaders for the first time, or after a long hiatus between updates.
    Boards are made up of people – who are only human – whose concerns branch from
    uncertainty and a lack of information. The security leader can increase their
    knowledge about the state of security affairs, provide a regular, valid, and business-relevant
    update, a clear view of the risk, and your plans to minimize and mitigate such
    threats. You want to provide certainty that cyber risk is being addressed, and
    for the board to build trust in your security leader.


    If the board is already across your cyber security strategy, including your approach
    when incidents arise, this ensures that any urgent board meetings about a cyber
    event will be more focused on the task at hand. Many organisations include cyber
    risk in their corporate risk registers – often at No. 1 – but not all ‘socialise
    the strategy’ on how this risk is being addressed up to board level. Regular,
    engaging strategic updates are key, so that when incidents happen, the board already
    knows the security leader and the progress towards improving security maturity.


    In the 2016 Australian Cyber Security Centre Survey, it was found that its more
    cyber-resilient respondents were ‘far more likely to have discussed cyber security
    at the board level within the last three months (87%) compared with those categorised
    as less resilient (59%)’.


    The survey also revealed that in less cyber-resilient organisations, 21% of recent
    board-level cyber security discussions were prompted by an incident, compared
    with just 6% for more resilient organisations. Additionally, less resilient organisations
    were generally more likely than others to reactively discuss cyber security.


    The report also said that ‘regardless of resilience, more needs to be done to
    embed cyber security into the core strategic business of senior management’.


    Overall, in 27% of respondents, cyber security is rarely, if ever, discussed at
    the most senior level. Now is the time to bring security into the boardroom, if
    it has not already been introduced. Involvement of senior management in cyber
    security discussions is a leading factor in successfully mitigating cyber security
    risks. ‘Ultimately, better understanding by senior decision makers of cyber security
    helps organisations respond to incidents more effectively.’


    ## In time, your new leader might need a team


    All businesses have to start somewhere in focusing on security, and a new security
    leader is a great place to begin. It does wonders for the organisation’s commitment
    to security to have someone dedicated to reducing the risks. But, as I mentioned
    earlier, security leaders cannot do this alone, and while consultants can be helpful
    at times, the need to protect your organisation can be fulfilled only by specialists
    who can sit in the business and meet its needs, especially if the business is
    growing.


    When I arrived at `Sportsbet`, it was just me and a third-party consultant who
    had been there a few months. By the time I left, a year later, there was an application
    security specialist, an architect, an analyst, and a head of information security
    to replace me. `Sportsbet` was a 700-strong organisation that took every hour
    the security team could give them, thanks to a strong commitment to security.
    This was, and is, an organisation committed to supporting its security team, meeting
    regulatory obligations – which requires resources – and reducing audit findings
    to a minimum. This couldn’t be done without an expert team working closely with
    the business on technologies (new and old), delving into new initiatives, increasing
    the knowledge of others, and raising the security bar.


    ## What the candidate doesn’t need


    Some of this is reiteration, but for completeness, let’s look at a handful of
    things a security leader doesn’t need or want or have the skills to manage.


    *   Your new security leader is not the new owner of every audit finding/action
    for the whole business for the rest of time, or for those stray findings that
    haven’t seen the light of day since before the war. Yes, audit findings often
    lead to management commitments based on new or improved security controls, but
    a lot of audit findings have nothing to do with information/cyber security. Please
    ensure that the new leader doesn’t get lumped with managing IT’s audit findings,
    which often happens because security is perceived as a close partner of audit.

