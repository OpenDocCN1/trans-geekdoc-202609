    首席信息官（CIOs）被要求去寻找一位高级网络安全领导者，而 IT 安全经理/策略经理自信地提交了对该职位的意向。此人在工作的许多方面都符合条件，但 IT
    安全（或网络安全或信息安全）在过去几年里发生了变化，而且仍在持续变化。安全经理通常是优秀的作家、谈判者，技术过硬且人脉广广。然而，他们可能低估了从管理结构化的、相对非黑即白的运营到担任网络安全负责人或首席信息安全官（CISO）那种如过山车般的跨越。


    内部提拔是行之行的，我也写过几篇关于内部员工通过其他技能补充安全职优势的博客。然而，并非所有的安全经验都是同等的，而且在上述两种情况下，引入一组具有行业其他领域经验的新视角都成功地应对了网络风险。（我们稍后会讨论如何衡量新员工的影响。）


    这两位经理都有丰富的经验，并通过他们的忠诚、资历和对安全领域的广泛知识为组织提供了价值。通过任命一位领导者来引导他们进入安全的新时代，从而支持他们目前的工作，对所有相关者来说都是一个好的结果。提拔这些经理本是解决审计发现的一种简单方法，但并不符合业务的最佳利益。


    ## 核心要点


    明确候选人在该职位上可以实现的目标，包括他们的愿景和能力。拥有一个动力十足、热情高溢并渴望在新职位上大展拳场的候选人可能看起来令人难以信。但请注意你是否能够利用这种热情，以及这对需要实现的结果可能产生的影响。


    ***


    19 Chris Gerritz, ‘Breach Detection by the Numbers: Days, Weeks or Years?’, Infocyte,
    2016 年 7 月 27 日, [`www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you`](https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you).另另
    Herb Weisbaum, ‘Data Breaches Happening at Record Pace, Report Finds’, NBC Business
    News, 2017 年 7 月 24 日, [`www.nbcnews.com/business/consumer/data-breaches-happening-record-pace-report-finds-n785881`](https://www.nbcnews.com/business/consumer/data-breaches-happening-record-pace-report-finds-n785881)。


    19 Chris Gerritz, ‘Breach Detection by the Numbers: Days, Weeks or Years?’, Infocyte,
    2016 年 7 月 27 日, [`www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you`](https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you).


    当他们的组织开始意识到新的网络威胁以及全球组织正在面临的风险时，审计随之而来。这些审计引发了数百个担忧，其中之一就是 IT 安全领域缺乏领导力和可见性。这不仅是缺乏领导力，还缺乏高级人员来应对网络风险，而且担心在执行高层关于项目、产品或倡议的对话中，安全没有得到重视。这些组织可能已经遭受了网络攻击并且……


    ### 教练：不要让他们孤立无援


    这一部分解释了我所说的“穿 T 恤”（wearing the T-shirt）。它的关键在于人的行动中体现价值观。无论 T 恤的细节如何，在人的行动中体现价值观才是关键。


    我很喜欢这一点，因为层级结构中的任何人都可以获得基础的公司 T 恤（然后通过参与直接工作之外的工作获得特殊 T 恤）。`wearing the T-shirt`
    这个表达可以这样说，每个人都知道预期的。


    所以，当你的新安全领导者到来时，请确保你已准备好`wear the security T-shirt`。


    ### 16


    欢迎


    “这里没有陌生人，只有尚未认识的朋友。”


    威廉·巴特勒·叶慈（William Butler Yeats），爱尔兰诗人


    在第 12 章中，我提出了这样一个事实：仅仅通过报到岗位，新的安全经理就开始改变你组织的安全面貌。这是事实，而且这仅仅是一个开始。


