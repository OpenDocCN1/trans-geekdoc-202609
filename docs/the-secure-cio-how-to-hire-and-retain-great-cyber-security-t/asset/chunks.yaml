- fmt: "\nNetworking is not everyone’s cup of tea. Some people simply don’t like people.\
    \ (Strange, but true!) Without networking, I would not have known about any of\
    \ the jobs I have held since leaving university – and I wouldn’t have some of\
    \ my great friends either! Every one of my jobs has been suggested to me through\
    \ people I have known or those I have made it my business to know.\n\nThe old\
    \ adage ‘It’s not what you know, it’s who you know’ became an old adage thanks\
    \ to networking. I implore you, next time you get the opportunity, to make the\
    \ effort to network. Accept an invite to lunch, strike up a conversation, or find\
    \ an informal activity you can attend where you might meet someone who knows someone\
    \ who is interested in the role you have on offer.\n\nAs a side note, it might\
    \ be worth contacting some security-focused associations to understand the networking\
    \ opportunities they have, or to advertise your role with their members if they\
    \ are up for that. If you’re in Australia, the Australian Information Security\
    \ Association and the Australian Women in Security Network are two good places\
    \ to start.\n\n## The right people to co-interview\n\nLast, but by no means least,\
    \ choose the right people to co-interview your candidate. At all stages of recruitment,\
    \ the people you surround yourself with are key to selecting the candidate that\
    \ fits. This can be challenging to get right because it’s hard to know how people\
    \ will react in an interview situation. Some will have preconceived ideas about\
    \ what is needed in a security professional and others won’t have any idea. Either\
    \ way, considering who is best to share the first, second, and third interview\
    \ stages is important. Choosing someone who will have a close collaboration with\
    \ the new leader can be helpful for personality or cultural fit. However, you\
    \ won’t be able to please everyone, so be careful and honest about what you need\
    \ from that other opinion. The people you select have to buy in to your agenda,\
    \ your immediate focus, and your non-negotiables if you are to find the most suitable\
    \ candidate.\n\n### A few things to consider about your co-interviewer(s):\n\n\
    * How much will this new employee affect each co-interviewer’s daily life?\n*\
    \ Do they know your goals for the new employee, and do they respect them?\n* What\
    \ is your working relationship with them?\n* What will the new security leader’s\
    \ working relationship be with the co-interviewers?\n* Will you keep the co-interviewer\
    \ consistent across all interviews or mix up who comes along with you?\n* If security\
    \ is new to your organisation, how well equipped are your co-interviewers to comprehend\
    \ the candidate’s experience?\n* Consider gender balance with your co-interviewers\n\
    \n## Key takeaway\n\nConsider carefully how to surround yourself with the relevant\
    \ people to achieve the best outcome. All of the above takes time and effort but\
    \ can be rewarding if you can find the right candidate based on a referral, a\
    \ connection with the candidate, and a good interview team.\n\n***\n\n[1] Gina\
    \ Belli, ‘At least 70% of jobs are not even listed – here’s how to up your chances\
    \ of getting a great new gig’, Business Insider, 10 April 2017, [`http://www.businessinsider.com/at-least-70-of-jobs-are-not-even-listed-heres-how-to-up-your-chances-of-getting-a-great-new-gig-2017-4?IR=T`](http://www.businessinsider.com/at-least-70-of-jobs-are-not-even-listed-heres-how-to-up-your-chances-of-getting-a-great-new-gig-2017-4?IR=T).\n\
    \nWhen seeking candidates, networking is close to employee referrals as a winning\
    \ formula. It is estimated that 85-plus per cent of people who land open jobs\
    \ did so through networking. Networking with peer CIOs, attending security-related\
    \ events and speaking at events where security staff – or future security leaders\
    \ – gather increases your chances of sourcing great talent. Surrounding yourself\
    \ with other CIOs who have been through a similar process can be helpful. Hearing\
    \ their war stories, their successes, and how they have managed security can provide\
    \ insight into what others experience, and you can also learn from their good\
    \ or bad fortune. They may also have candidates who weren’t suitable for their\
    \ roles but could be for yours. Furthermore, networking directly with those who\
    \ might be interested in working with/for you is a great approach. There are conferences,\
    \ meet-ups, informal breakfasts, awards dinners, large events, and drinks you\
    \ can join to meet more security professionals and, just as importantly, hear\
    \ about the challenges they face. Two birds, one stone.\n\n## Are you allowing\
    \ for stretch?\n\n‘If your actions inspire others to dream more, learn more, do\
    \ more, and become more, you are a leader.’\nJohn Quincy Adams, former US President\n\
    \nDuring my time as a manager and a consultant, I have read many excellent CVs\
    \ and met some brilliant candidates. I’ve also met some arrogant applicants, some\
    \ understated leaders, and some unfortunate professionals who are not sure where\
    \ they are going, or why.\n\nThrough a delivery of the framework, I recently met\
    \ a fantastic candidate – let’s call her `Jill` – whom I later placed and have\
    \ also coached. I first spotted `Jill` on `LinkedIn`, whom I later placed and\
