    8《2016 年澳大利亚网络安全人才短缺研究》，AISA 研究报告，澳大利亚信息安全协会， 10《澳大利亚网络安全行业面临的挑战》，澳大利亚网络安全增长网络，2017
    年 4 月。


    在商业领域，关于网络安全的讨论日益增，这有助于组织为潜在的网络威胁做好准备。在一项政府调查中，81% 的组织意识到所有员工都有确保网络安全的责任，总体而言，73%
    的组织在高级管理层定期讨论网络安全问题。6 对于具有网络韧性的组织来说，培养能够自信地向董事会汇报并为其成员提供确定性的高级安全领导者已成为必迫需求。


    *   78% 的受调查的 AISA 成员认为，对所需技能缺乏清晰认识导致了网络安全职位招聘的困难。8

    *   美国随时有 35 万个网络安全人士的职位空缺。7

    *   由于工资限制和倾向于空缺职位而导致的招聘困难，与网络安全团队增长有限的证据是一致的；52% 的人报告其团队规模保持不变或增长不足 10%，而超过 11%
    的受访者报告人数有所减少。9 9 同上。11 Patrick Howell O’Neill，“报告显示，网络安全行业各层级的女性薪水均低于男性”，Cyberscoop，2017
    年 3 月 15 日，https://www.cyberscoop.com/women-in-cybersecurity-wage-gap-report/。6
    同上。


    ## 2


    ## 你的初心是什么？


    “如果你仅仅因为他们能做某项工作而雇用他们，他们是为了钱而工作。但如果你雇用那些相信你所信仰的人，他们将付出血水和泪水为你工作。”

    西蒙·斯涅克（Simon Sinek），作家


    当我开始询问首席信息官（CIO）聘请安全专家是为了解决什么问题时，答案并没有让我感到意外。如“审计和风险委员会告诉我们，最近的审计显示我们需要更好地处理网络风险，这包括聘一名领导者来负责”之类的回答很常见。有些回答侧重于领域专业知识，即拥有专家来定义战略并降低组织的安全风险。


    一些较不常见的回答是，需要一名安全领导者为 CIO 提供建议，并且安全意识是其职责范围的关键。


    绝大多数人谈论的是保护客户。作为建立安全团队和安全领导者的理由，这是一个极佳的切入点。如果你将保护客户置于你工作的核心，那么你的存在意义（reason for
    being）将与销售、营销、财务和运营团队的初衷相似：留住客户。保护客户也意味着维护你在市场上的声誉，并确保系统在威胁和事件期间持续运行的韧性。


    本章的重点是，无论你引入安全领导者的理由是什么，你都准备好支持这位领导者去实现其目标的追求。


    ## 3


    ## 安全成熟度


    “先寻求理解，再寻求被理解。”

    斯蒂芬·柯维（Stephen Covey），《高效能的七个习惯》


    在职业生涯中，我很幸运能够进入那些已经构思好战略（或拥有策略骨架）的角色。然后，我会花时间审查文档，确保战略符合业务、与业务战略保持同步、是现实的，并且是我可以引以为傲的交付成果。作为一个进入组织的新领导者，这给了我很大的信心：在缺乏安全领导者或团队的情况下，组织已经投入精力了解自己的安全成熟度以及他们可能需要做的事情。在决定承担哪些职位时，这无疑是一个“加分项”。


