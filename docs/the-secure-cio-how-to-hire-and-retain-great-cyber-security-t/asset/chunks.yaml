- fmt: '

    There is a plethora of job titles that are often – and in a well-intentioned way
    – used interchangeably. But a head of security is not even same as a head of cyber
    security or a head of information security, which is not the same as an IT security
    manager, which can’t be interchanged with a chief information security officer.
    By all means make the job title enticing, but not so much so that people aren’t
    sure they would want to take it on, or that it can’t be found when a job search
    is performed. You may also need to test the market, and if traditional job titles
    aren’t drawing in the candidates you are after, consider changing the title but
    ensure it still reflects the level and breadth of responsibility.


    Also, consider the type of candidate who would be attracted to particular titles.
    I, for example, would not feel confident applying for a role with the word `engineer`
    in the title. I saw an ad for what appeared to be a head of information security
    role that used the word `engineer` in the title to attract more candidates. There
    are those who have had chief information security officer titles but would not
    apply for a manager role, and those who may not realise the seniority of a position
    titled `CISO` (because the role reports to the `CIO`).


    ### Questions to ask yourself:


    *   What will this leader need to achieve in the next 12–18 months?

    *   What job title clearly describes the responsibilities and level of authority/hierarchy
    of this role?

    *   Do I need candidates to possess certifications, and are these truly needed
    to measure candidates against one another?

    *   How can I attract more female candidates to ensure I have a varied candidate
    pool?


    ### Key takeaway


    The job description wears many hats. Not only does it detail success factors,
    it’s a great trigger for valuable, relevant interview questions. It’s also a commitment
    by the business to support the activities laid out in it, so socialise it with
    your c-level peers before finalising it, and be careful what you wish for. Remember
    to consider the role title and function when pulling the JD together, and how
    the required experience can play a significant role in who applies. It may be
    that your HR department has to create a new category for security role titles
    if they don’t fit a mould.


    ***


    [14] Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant, Despite
    Recent Efforts to Balance the Scales’, 15 March 2017, [https://securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnant-despite-recent-efforts-to-balance-the-scales/](https://securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnant-despite-recent-efforts-to-balance-the-scales/).


    [15] Megan Noel, ‘Why women don’t apply for jobs they’re not 100% qualified for
    (but should), The American Genius, 23 February 2016, [https://theamericangenius.com/business-news/women-apply-for-jobs/](https://theamericangenius.com/business-news/women-apply-for-jobs/).


    15 Megan Noel, ‘Why women don’t apply for jobs they’re not 100% qualified for
    (but should), The American Genius, 23 February 2016,


    ‘According to the findings, confidence or lack thereof, was actually the least
    common reason men and women did not apply. Instead, the most common response,
    with 46.4% of men and 40.6% of women choosing it as their first reason, was: “I
    didn’t think they would hire me since I didn’t meet the qualifications and I didn’t
    want to waste my time and energy”. Survey responders didn’t lack confidence in
    their ability or their skills, instead they were interpreting the job description
    as a hard and fast outline of skills and experience a qualified candidate must
    have”.’15


    As mentioned at the start of this chapter, in 2017, about 11% of people in cyber
    security roles are women,14 depending on which study you read. There is strong
    concern within the industry – and backed by the research below – that this stems
    from women believing they cannot achieve all the items in a job ad, so they don’t
    apply.


    14 Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant, Despite
    Recent Efforts to Balance the Scales’, 15 March 2017.


    ## Section 3: Connection: How to hire?


    > ‘Hiring the best is your most important task.’

    > Steve Jobs, co-founder, Apple Inc.


    No part of the framework is more important than another. The work you have put
    in so far to understand what’s important to you and the organisation and what
    you won’t budge on will hold you in good stead for the guts of the hiring process.
    Meeting a lot of candidates can be disheartening and also frustrating when you
    have a clear vision of what you want. It can also be uplifting and inspiring as
    you see the potential in each one. As I said in Part 2, have some non-negotiables
    and also some room to move if the cultural fit is going to far outweigh anything
    you can teach or have the leader coached in. Obviously, experience is required
    to get the job done. But consider the great opportunity for your talented employee
    should you find room for growth.


    Part 3 of the framework is all about connection with the right candidates. Finding
    and retaining cyber security professionals starts with deciding how you will source
    the candidates – yourself, via a recruiter or using internal talent team. From
    initial search to interview and ultimately offering someone the role. Connecting
    with the right people is key. The components of connection are: assessing the
    candidates for their fit, technical and cultural, having the right co-interviewer,
    and realising you might get away with hiring the person you know in your gut is
    right, even though the role will be a stretch for them. This is a tough process
    and one you can’t afford to get wrong.


    ### To recruiter


    > ‘Time spent on hiring is time well spent.’

    > Robert Half, pioneer recruiter


    On any given day, on LinkedIn, you can read blunt, jaded posts about a ‘potential
    candidate’ being approached by a recruiter for roles they could never do. Or roles
    they did 10 years ago. Or they’ve been approached because they are a woman (or
    because they are not).


    Since leaving my corporate job and beginning my business in 2016, I have been
    approached at least five times in 12 months by recruiters who say, ‘We were just
    wondering where your new business was at because we have this great role. We know
    you’re doing consulting now, but you might still be interested in a permanent
    job instead.’ The frustrating part about this is that for some of the jobs I’m
    not qualified, or I’m over-qualified, but because I have a passion for security,
    they seem to think their role is the one that will make me leave my consulting
    business to return to the fold. I politely decline, but I’m sure they are hanging
    up just to call the next person who fits the title they are seeking to fill.


    Many recruiters are the first to admit they don’t know how to fill these roles.
    Security roles are new to human resource people and recruiters. Their eyes glaze
    over when security staff talk technical. They don’t understand that one security
    leader may have completely different skills to another, yet they have the same
    title, pay grade, and years in the industry. It’s totally possible that one `CISO`
    could not simply walk into the job of another.

