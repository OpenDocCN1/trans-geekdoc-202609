    \ security must also analyse the security event logs. Businesses often mistakenly\
    \ seek one person to solve all of their security problems. It seems like common\
    \ sense to point out that one person can’t fill the roles of many, but with many\
    \ of the jobs advertised today, it seems that is the expectation. \n\n*   They\
    \ don’t need security vendor introductions for at least the first six months.\
    \ Salespeople are great at what they do, but chances are the security leader won’t\
    \ know enough about the network and the business operations to add value to a\
    \ discussion. Furthermore, most security leaders would prefer to contact vendors\
    \ when they need them, based on the strategy they deliver.\n\n*   They don’t need\
    \ to take ownership of activities or outcomes that should be managed by the business.\
    \ I mentioned this above, about audit, but there are also tasks that businesses\
    \ sometimes wrongly look to cyber security to own; for example, third-party vendor\
    \ engagement. The security team is responsible for providing a list of requirements\
    \ that third parties must meet to logically or physically connect with your network.\
    \ Security doesn’t need to own the risk or the final decision on whether to engage\
    \ with the vendor. Legal, IT, compliance, and finance can all play a part in signing\
    \ off or advising on the risks involved with a particular vendor. If the business\
    \ takes all the advice and wants to accept the risk, that may be fine by the security\
    \ team. Consider the real owner of risk-reduction processes before assigning cyber/information\
    \ security staff to own them.\n\nThis list, as with all others in this book, is\
    \ by no means exhaustive.\n\nKey takeaway\n\nA new security leader will need more\
    \ than day-to-day support from you. They need to feel confident that their purpose\
    \ is clear, that they have been budgeted and planned for, and that their input\
    \ will be valued.\n\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n[21](#f14cnhhu.html#f3k28cv1jcf)\
    \ Barbara Filkins, ‘IT Security Spending Trends’, Survey, SANS Institute, February\
    \ 2016, [https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697](https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697).\n\
    \n[22](#f14cnhhu.html#fn22) Ibid.\n\n[23](#f14cnhhu.html#f3k28cv1jcg) 2016 Cyber\
    \ Security Survey, Australian Cyber Security Centre, Australian Government, 2017,\
    \ [https://www.acsc.gov.au/publications/ACSC\\_Cyber\\_Security\\_Survey\\_2016.pdf](https://www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf).\n\
    \n[24](#f14cnhhu.html#f3k28cv1jch) Ibid.\n\nI won’t bang on too long about budget\
    \ and tools, mostly because I’m all about the people in security, however, I will\
    \ say this: In 2016, SANS21 undertook research into security budgets, most of\
    \ which were within IT expenditure. Protection of sensitive information and regulatory\
    \ compliance are the two most significant business drivers behind security spending.\
    \ Bringing in a security leader is not the start, middle, and end of your expenses.\
    \ To achieve great things, your new leader potentially needs funding for automation\
    \ tools, third-party assessments, detection and monitoring tools, testing, compliance-related\
    \ systems, and cloud-based security applications (think distributed denial of\
    \ service (DDOS) and hosting). Staff training, certification, and keeping up to\
    \ date through conferences and courses also cost money. If you plan to make security\
    \ a business priority, you must reflect this in your budget – to not just borrow\
    \ from Peter to pay Paul but truly allocate security spend. Getting the budget\
    \ you need requires more than measuring the success of past investment, which\
    \ might have been very little in security, or masked by dual-purpose (security\
    \ and IT combined) hardware and services. It also revolves around ensuring compliance,\
    \ enabling business objectives, and providing proof of improvements in incident\
    \ counts and risk profile, the top four justification points used in obtaining\
    \ a security budget, according to SANS respondents.22\n\nIn the 2016 Australian\
    \ Cyber Security Centre Survey, it was found that its more cyber-resilient respondents\
    \ were ‘far more likely to have discussed cyber security at the board level within\
    \ the last three months (87%) compared with those categorised as less resilient\
    \ (59%)’.23\n\nOverall, in 27% of respondents, cyber security is rarely, if ever,\
    \ discussed at the most senior level. Now is the time to bring security into the\
    \ boardroom, if it has not already been introduced. Involvement of senior management\
    \ in cyber security discussions is a leading factor in successfully mitigating\
    \ cyber security risks. ‘Ultimately, better understanding by senior decision makers\
    \ of cyber security helps organisations respond to incidents more effectively.’24\n\
    \n24 Ibid. 23 2016 Cyber Security Survey, Australian Cyber Security Centre, Australian\
    \ Government, 2017, [https://www.acsc.gov.au/publications/ACSC\\_Cyber\\_Security\\\
    _Survey\\_2016.pdf](https://www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf).\
    \ 22 Ibid. 21 Barbara Filkins, ‘IT Security Spending Trends’, Survey, SANS Institute,\
    \ February 2016, [https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697](https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697).\
    \ \n\n### \n\n20\n\nAddressing the stretch\n\n‘We rise by lifting others.’\n\n\
    Robert G. Ingersoll, lawyer, US Civil War veteran\n\nIn all the roles I have taken\
    \ on, and I’m sure most people would say the same, there has been somewhat of\
    \ a stretch for me from day one to achieve what was desired. We talked in chapter\
    \ 18 about expectations, and part of the new leader delivering on these will be\
    \ your commitment to ‘addressing the stretch’.\n\nWhen I first led a trust and\
    \ safety team 10 years ago, my stretch was evident. I had never led fraud analysts\
    \ before, they were in the throes of choosing and integrating a multimillion-dollar\
    \ fraud detection tool and I had no idea how it worked, and I had never been exposed\
    \ to ecommerce security before. I entered this role after working in corporate\
    \ security, building up expertise in dealing with law enforcement. I knew little\
    \ about dealing with commercial staff or security vendors.\n\nI had been tapped\
    \ on the shoulder for this role by someone I had worked with a number of years\
    \ before, and the management team were content with my skill set. The team I landed\
    \ with were great analysts and hard workers who knew their craft and needed only\
    \ my leadership and support to ensure fraud prevention was part of project discussions\
    \ and product planning. This I could do. But to address the stretch, I undertook\
    \ to widen my skills and knowledge myself. I sought experts from around the business\
    \ to support my integration with the organisation. I learnt how an ecommerce platform\
    \ worked, sat with the analysts to understand how online fraud worked – and how\
    \ to prevent it – and built a network of supporters around me to help fill the\
    \ gaps in my knowledge.\n\nWhat I learnt in this role was that I had many transferable\
    \ skills, my love of people management kept my days buoyant, and I believed in\
    \ the product and protecting the customers who used it. While my boss didn’t involve\
    \ himself in my upskilling, this meant that it took a little longer to address\
    \ the stretch, and I leant heavily on the support of those around me to prepare\
    \ me for the broader, bolder roles ahead."
