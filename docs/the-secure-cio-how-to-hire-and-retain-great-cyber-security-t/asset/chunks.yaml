    Existing strategies will always be affected by those who deliver them, and on
    occasion I have made changes to ensure we were taking the organisation’s security
    in a relevant direction. Also, my strengths lie in security awareness, leadership,
    and communication with all levels of the organisation. If any strategy missed
    these key elements, I ensured that communication outside of the security and IT
    teams was planned for and achieved.


    Any new leader wants to make their mark on the organisation. How they do that
    will be up to them. But arriving to some form of plan helps guide the incoming
    leader as to the organisation’s security risk and what fires need to be put out
    first.


    This needn’t involve extensive time and financial investment. Most CIOs, with
    some guidance from this book, can ascertain the organisation’s high-level concerns.
    At the interview stage, ensure you provide enough insight for a new security leader
    to know what they are stepping into and what quick wins they can concentrate on.


    ## The Big Rocks


    I call these areas the ‘big rocks’. Stephen Covey talks about the big rocks of
    life, and the idea comes from him. In essence, the big rocks are points of focus,
    areas to address that make the biggest impact. There will always be room for ‘sand
    and pebbles’, but addressing the big rocks takes away a large percentage of the
    security pain your organisation may be feeling.


    The next couple of chapters will help you to understand how to identify these
    big rocks, of which I would recommend having three. In many cases, they become
    clear quite quickly. Here are some examples gleaned from experience and also through
    interviews with CIOs. The list is by no means exhaustive.


    ### In a start-up

    The focus for the security leader may be on vendor management, application security,
    security of third party engagements, and basic network security. It’s less likely
    to be about compliance and audit.


    ### In a newly digital organisation

    Application security, incident response, security awareness, and cloud security
    may be the big rocks.


    ### In a utility

    Big rocks could be defined as understanding IT and OT (operational technology)
    security, security awareness, and security monitoring/incident response.


    ## The Agenda


    The big rocks form the major part of the agenda. The agenda is not a strategy.
    I repeat, the agenda is not a strategy. The agenda sets the scene for the new
    leader and provides some facts, opinion, and context to which they can anchor
    in their first few months. The agenda forms the major part of the handover documents
    for the new leader (discussed in chapter 17). Imagine joining an organisation
    as a chief financial officer and no one giving you any idea of the financial state
    of the company. You have no staff, no background, just some outdated policies
    and full accountability to keep the organisation financially secure. This is what
    security people face every day, and if we could work towards giving them an agenda
    on which they can get off to a brisk start, this benefits not only the new leader
    but some of their peers.


    Handing the new security leader a wad of audit reports is not the same as providing
    them with a security agenda. It serves a much different purpose. While audit reports
    provide important background and clarity on the key risks and the remediation
    recommended, they cannot replace an agenda that has been created with more than
    compliance in mind.


    The agenda can cover details of interviews with leaders; a reflection of security
    against the values, mission, and strategic direction of the organisation; details
    of the current state of security and what is already in place (policies or technical
    controls); the big rocks; the opinions of leaders about the type of security leader
    needed and some valuable information.


    ### Key takeaway

    The agenda provides a set of facts regarding security status. While it is not
    a strategy, audit, or risk assessment, it pulls together information to give the
    new leader with a strategic starting point.


    ## What others are saying, Part 1


    ‘It is wiser to find out than to suppose.’

    Mark Twain, writer and entrepreneur


    One of the main activities that will boil your agenda down to the big rocks is
    establishing how your leadership team (and other stakeholders) see security. This
    isn’t simply chatting with them over coffee about their general thoughts. This
    is asking each of them pertinent questions to establish themes and inconsistencies
    of thought. These discussions take place with executive leaders and staff. Such
    staff may include, but not be limited to consultants, contractors, and permanent
    employees who are the custodians of systems, data, and information relevant to
    security threats and risks.


    The questions you ask will differ from organisation to organisation and depend
    on maturity. The questions help to identify where the major gaps are and where
    you will gain the most support. For example, if the CEO doesn’t see cyber as a
    risk but all the other leaders do, the troops you need to rally will be very different.


    As CIO, you have a lot of leverage, and you likely have quite specialised relationships
    with the leadership team. This can work for and against you when asking these
    questions. You may need to set some parameters before the conversation starts
    to ensure there is open, honest feedback. Or you could simply ask someone else
    who is more impartial to ask the questions on your behalf.


    Either way, you want raw, specific data that helps to establish what your focus
    should be and what sort of security leader will be needed now and in the near
    future. I say ‘near’ because the security leader you need today is very different
    from the one you’ll need in two years’ time, because cyber changes quickly. And
    in two years’ time, a lot of what will keep your leader busy will look different
    to when they arrived, especially if they begin their life with your organisation
    as the sole security operator.


    Here are some questions you might want to consider. They are in no particular
    order and only you can decide if they are relevant or whether you need to ask
    something different to identify the ‘big rocks’.


    *   What do you believe a head of information security or a chief information
    security officer would be responsible for?

