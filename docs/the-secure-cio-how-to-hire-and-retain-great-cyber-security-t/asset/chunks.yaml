  trans: '

    只有在发生重大泄露且确保组织安全成为未来可预见的首要策略时，这种情况才会改变。


    如果你读过第 2 章，你就会知道议程（agenda）本身并不是为了成为策略。议程是一个起点。将你的议程与整体业务战略对齐非常重要。我所指的并不是将安全纳入战略中（关于这方面的更多信息，请参阅第
    2 章）。当我说“重要”时，我的意思是“必不可少”。新上任的领导应该直接将议程中强调的安全活动与组织的战略、目标、使命和任务联系起来。从根本上说，安全必须根据组织的商业驱动力向前发展。


    # 第 2 节


    ## 罗盘：你的目的地在哪里？


    > “变革的秘诀在于将你所有的精力集中在建立新事物，而不是与旧事物战斗。”

    > — 苏格拉底


    ### 框架的第二部分是 `Compass`

    框架的 `Part 2` 是 `Compass`，关于根据你的议程理解你正在走向哪里。此外，根据整体业务战略，你的组织需要哪些技能？


    当我们制定计划时，往往会高估我们能实现的目标，而低估实现这些目标所需的资源。这对于大多数工作和生活方面都是如此，对于安全领域也是如此。


    是聘雇一名安全专业人士还是一个团队，将决定个人或个人可以承担的工作量、任务多样性，以及他们对某些活动需要参与的程度。由于本书侧重于聘用领导者，我的建议是将精力放在安全改进的基础性、可衡量的领域，这些领域要与组织的优先事项和关键风险对齐。这将确保你的计划与真正重要的事情相关，并使安全成为组织整体战略实现的一部分。对你的组织能够实现的变革以及实现这些变革需要什么保持诚实，这样你更有可能聘到一位能够在未来一年内执行强有力且可见的计划的安全领导者。


    ## 去向何方？


    > “目标设定正确，就成功了一半。”

    > — 齐格·齐格拉，作家


    接下来的二三章将紧密配合。你通过聘用网络或信息安全专业人士想要实现的目标，与你认为成功的候选人中不可妥协的技能和特质密切相关，因此决定了真实的职位描述应包含的内容。


    在向潜在候选人“推销”这份工作时，思考你想实现什么是非常重要的。诚实地说明他们的角色、他们为何出现在组织中、他们将如何获得支持以及对安全功能的认知，对于选择正确的候选人至关重要。


    我在许多组织中工作过，有些拥有充足的安全资金，有些则没有。有些组织中安全领导者的角色是团队深思熟虑的补充，而另一些组织中安全领导者占据着唯一的安全职位。


    通常，当一个职位新创建时，往往是因为发生了大规模的泄露/事件——这并不总是毁灭性的，但足以震动组织采取行动——或者是审计委员会的发现、来自焦虑董事董事的指示，或者是
    `CEO`/`CIO`/`CTO` 认为需要安全领导者的直觉。如果是替换现有的领导者，通常会进行关于重新证明该角色存在之必要性，以及是否有方法让现有员工吸收该角色的讨论。理想情况下，吸收该角色是不可能的，因为领导者扮演的角色与技术工程师、分析师或顾问有显著不同。


    通过对无数招聘广告和职位描述的审查，以及通过安全活动中的交流，我明显感觉到，聘用安全领导者追求的是四个主要结果。这些结果并不都体面。


    ### 为了满足审计发现

    如果你聘用网络或信息安全主管仅仅是因为审计报告建议你这样做，那么他们永远无法实现比“安全良好表象”之外的任何成就。他们可能变成一个形象人物，让业务看起来在保护自己和客户，但实际上并非如此。


    创建议程并让业务看起来在保护自己和客户，但实际上并非如此，这种做法可能让他们变成一个形象人物。创建议程并让执行团队和利益相关者对安全产生认知是首要的，可以利用审计意见作为杠杆，但它不能是唯一的理由。作为
    `CIO`，你需要对该领导者所能实现的内容表示信任，并提供更多的支持。如果领导者把所有时间都花在回顾，他们将永远无法进行规划、保护组织并展望未来。


    ### 用人员满足安全需求

    如果你仅仅是因为审计报告建议而聘用一名网络或信息安全主管来解决组织的所有安全问题，他们注定会失败（或离开）。这是考虑安全的另一个理由：你希望优先关注哪里？这个新领导者可能需要一个团队，或者至少一个实践社区，让那些不向安全主管汇报的人汇聚在一起，确保他们拥有共同的目标。


    ### 合规

    许多法规和法律要求特定组织拥有专门的安全或网络安全负责人，即被指定负责安全的人员。为了合规招聘通常是以提名内部员工的形式进行的。这个人并不一定具备应对风险或事件的技能、知识或关注，但他们的名字会出现在文件中，任何合规性审计将得到满足。


    ### 确定性和信心

    压倒性的，最常见的回答可以总结为类似这样，一位澳大利亚 `CIO` 在被询问为何聘用安全领导者时给出的回答：“这意味着有一个专门的专家，其唯一职责是降低组织的安全风险。”


    在研究聘用安全领导者的目标期间，一些 `CIOs` 给出了以下回答。你会对其中任何一个产生共鸣吗？


    * 有安全领导者提供了组织的关注点和优先级。

    * 它确保我们有一位能够在管理和执行我们的网络安全活动方面定义清晰的战略并引导方向。

    * 没有领导者，危险在于我们无法采取整体方法，投资会由于个人部门的优先事项或偏好而过度或不足。

    * 我们需要一位有能力的捍卫者，其唯一任务是确保安全受到重视，并在最重要的领域进行适当的投资。


