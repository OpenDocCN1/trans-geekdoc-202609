    ### Addressing the stretch


    ‘We rise by lifting others.’


    Robert G. Ingersoll, lawyer, US Civil veteran


    In all the roles I have taken on, and I’m sure most people would say the same,
    there has been somewhat of a stretch for me from day one to achieve what was desired.
    We talked in chapter 18 about expectations, and part of the new leader delivering
    on these will be your commitment to.


    When I first led a trust and safety team 10 years ago, my stretch was evident.
    I had never led fraud analysts before, they were in the throes of choosing and
    integrating a multimillion-dollar fraud detection tool and I had no idea how it
    worked, and I had never been exposed to ecommerce security before. I this role
    after working in corporate security, building up expertise in dealing with law
    enforcement. I had been tapped on the shoulder for this role by someone I had
    worked with a number of years before, and the management team were content with
    my skill set. The team I landed with were great analysts and hard workers who
    knew their craft and needed only my leadership and support to ensure fraud prevention
    was part of project discussions and product planning. This I could do. But to
    address the stretch, I undertook to widen my skills and knowledge myself. I sought
    experts from around the business to support my integration. I learnt how an ecommerce
    platform worked, sat with the analysts to understand how online fraud worked –
    and how to prevent it – and built a network of supporters around me to help fill
    the gaps.


    What I learnt in this role was that I had many transferable skills, my love of
    people management kept my days buoyant, and I believed in the product and protecting
    the customers who used it. While my boss didn’t involve himself in my upskilling,
    this meant that it took a little longer to address the stretch, and I leant heavily
    on the support of those around me to prepare me for the broader, bolder roles
    ahead.

