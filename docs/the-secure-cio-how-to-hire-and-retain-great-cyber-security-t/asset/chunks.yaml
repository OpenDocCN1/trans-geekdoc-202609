    Claire Pales is the Director of 27 Lanterns, a consulting company committed to
    helping organisations create and sustain effective information security teams.
    For the past 15 years, Claire has gained experience establishing teams and leading
    award-winning security strategies throughout Australia and Asia including Hong
    Kong, China and India. Claire’s information and cyber security experience spans
    critical infrastructure, online and ecommerce teams, with an ongoing focus to
    grow and coach information security professionals from graduates to leaders and
    help businesses to establish exceptional information security practices.


    Claire has a Bachelors Degree in Police Studies, Post-Graduate studies in e-Crime
    Investigation and executive coaching qualifications.


    Based in Melbourne, Claire has four children, is a regular industry blogger and
    actively volunteers with the Australian Women in Security Network.


    [www.27lanterns.com.au](http://www.27lanterns.com.au)


    ### Testimonials


    “Claire successfully blends her corporate, consulting and global expertise to
    offer an insightful and pragmatic approach to information and cyber security.
    Her independence is a draw card for clients as Claire provides objective recommendations
    which gain confidence with executives and Boards. Claire’s ability to build relationships
    and trust allows her to gain insights and deliver value sooner.” – Anna Leibel,
    Executive Manager, Technology at UniSuper


    “There can be no doubt that this connected world presents some of the most challenging
    risks and brilliant opportunities. Securing an organisation so that its cyber
    security settings are appropriate is an issue that confronts all organisations-
    both big and small. The second biggest challenge in cyber security is how to find
    the right cyber security professional.


    Claire’s book is not only full of her insights which she has accumulated from
    years of experience but it is perfectly timed as the marketplace is awash with
    opportunities for security professionals. She not only addresses the importance
    of selecting the right cyber security ‘warrior’ but also provides readers with
    an enduring framework so that organisations, particularly their CIOs, understand
    that, with the right controls, culture and expectations, cyber security is a risk
    that cannot be eliminated but can be effectively managed. This is definitely a
    cyber page-turner!” – Rachael Falk, Cyber Security Adviser, Pace & Scale Pty Ltd


    “From the very moment we connected with Claire, we knew she was the perfect fit
    to guide us in our cyber security journey. Aside from being an experienced, well
    respected and extremely passionate Information Security professional, Claire understands
    what makes individuals and organisations tick. Claire’s ability to combine technical
    expertise allows her to gain insights and deliver value sooner.” – John Finnan,
    Head of Payment at MYOB


    “There can be no doubt that this connected world presents some of the most challenging
    risks and brilliant opportunities. Securing an organisation so that its cyber
    security settings are appropriate is an issue that confronts all organisations-
    both big and small. The second biggest challenge in cyber security is how to find
