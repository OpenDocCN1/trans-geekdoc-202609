    The current IT security manager is focused on policy and compliance, and without
    a more senior leader, security will remain a desk function.


    ## Key takeaway

    No matter your destination, make sure it’s well thought through, respectful of
    the security talent you engage, and is based on an agenda that key stakeholders
    can and will support.


    ## 7. What skills and outcomes are non-negotiable?


    To pick up a point from chapter 5, it is often the case that a new security leader
    is given the responsibility of many. This may be because the organisation hasn’t
    had someone addressing cyber risk before. This leads to a lack of understanding
    of what one person can achieve, so they are given too broad a remit. It may also
    be because funding accommodates only one security staff member, and a leader is
    chosen as the best investment. Finally, it may be that a team is planned, but
    for now, the security leader has all the responsibility.


    These are quite valid reasons for heaping tasks and outcomes on the new leader.
    However, this is not sensible or reasonable, and a laundry list of responsibilities
    can turn away great candidates. (More on this in chapter 8).


    To combat this at a time when your long-term strategy and team are still a way
    off, it is important to be comfortable with what is and isn’t negotiable when
    you meet candidates. This means establishing what skills and abilities are needed
    on day one. Keep this squarely in your mind as you assess your non-negotiables.


    Much of this will be considered when agreeing on content for the job description.
    Here are some examples of non-negotiable skills/experience that my clients have
    asked for:


    *   The candidate must have led/delivered a security strategy before.

    *   The candidate must previously have worked as a head of information security

    *   The candidate’s experience cannot solely be from `[insert particular industry]`.
    (This is often requested if the hiring manager doesn’t want someone whose whole
    career has been with the big four, for example.)

    *   The candidate must have delivered outcomes/content to boards (be ‘board-ready’).

    *   The candidate must have previously led cyber security incident response activities.


    Non-negotiables can also take the form of attributes or qualities such as:

    *   resilience

    *   curiosity

    *   patience

    *   empathy

    *   adaptability

    *   ability to influence


    Non-negotiables are key to the hiring process, yet they can be overlooked because
    a candidate seems so great that you are willing to negotiate the non-negotiable,
    or you choose based on hiring fatigue. This is the last thing you should do. You
    also need to be willing to test these, both in reviewing the résumés and in interviewing
    candidates. Ask candidates to share examples of when they exhibited each attribute.
    You will also want to test this with referees when you get to that point in the
    process.


    ### And what about nice-to-haves? That second tier of desires that are negotiable
    but would be nice to have for cultural or role-based reasons? Things such as:


    1.  A female. (Females are becoming more sought after for several reasons: Women
    tend to take a different approach to their roles/teams/jobs; are needed in the
    security industry; are seen to fulfil diversity needs; and, as their numbers grow,
    can begin to change a patriarchal culture, if that’s the impact you seek.) A mere
    11% of cyber security professionals are women,[13](#13mdt4.html#f3k28cv1jdc) allegedly
    because their higher education tends to be in non-technical areas, lack of awareness
    of the jobs available, discrimination, and slow social advancement. Women, of
    course, should be hired because they are the right person for the role, not merely
    because of their gender. But due to these reasons detailed by global research,
    fewer women are attracted to the industry.

    2.  Certifications. While it has been argued that certain security certifications
    help to ensure that the industry is speaking the same ‘language’, these certifications
    do not necessarily mean the candidate is a competent security operator. These
    certifications are nice to have but should not discount a candidate if they otherwise
    meet all your non-negotiables. (This is also why I put certification in the nice-to-have
    section, because if they are non-negotiable, you can miss out on some good candidates
    who haven’t seen a need, or had a desire, to certify. More on this in chapter
    8.)


    A few things to note:

    *   Non-negotiables, especially when it comes to traits, should be in line with
    your company values (expectations) and with what it’s truly like to work in your
    organisation (reality).

    *   If you are the one setting the non-negotiables, don’t be too quick to delegate
    the early interview process. Non-negotiables should be addressed/tested in the
    first interview to avoid wasting your and the candidate’s time.

    *   When you interview, after the initial chatter, let the candidate speak first.
    If you launch into the role, and the company, and all the reasons you’re hiring,
    you’re writing the script for them. Since they don’t know what you want to hear,
    you are more likely to get an authentic retelling of their history, including
    successes and failures, than if you had led the conversation with role requirements.


    If you are a CIO reading this, it is not my objective to tell you how to sweep
    up. I realise that by this time in your career, chances are you have interviewed
    and hired many staff. The point of this chapter is that security leaders, and
    all security professionals, cannot fulfil the role of many, and yet often they
    are required to do this, even for a short period.


    So, if you design what you absolutely need from day one in skills and experience
    and let other, less pressing tasks/skills go, you will have more success in hiring
    sooner rather than later. Remember, though, to also set/assure the expectations
    of others involved – especially when the role is new and everyone has a view on
    what the leader should be capable of. (More on this in chapters 11 and 13.)


    ## Key takeaway

    There is no right or wrong. While I may or may not agree with your non-negotiables,
    you are setting them, you have to work with this person every day, and you see
    these as imperatives. Remember that the more non-negotiables you have, the narrower
    your market becomes. Non-negotiables ensure that you seek a candidate who can,
    at a minimum, meet the security needs of your organisation in the short to medium
    term.


    ## Bonus material

    While you are the one who needs to establish your list of needs and non-negotiables,
    this blog post I wrote in 2016 about the qualities security leaders need may help
    in your ponderings.


    ### Top 7 qualities of an Information Security Leader

    In the security industry, like any other, there are a few traits that should be
    on your list of non-negotiables when it comes to hiring a leader. The information
    security leader is one of the key roles in business today and is not a hire that
    you can afford to get wrong. Here are the top 7 qualities to look for, in no particular
    order (except the first one):


    1.  `Integrity`. This needs little explaining in a candidate for an information
    security leadership role. Integrity is without question the key attribute to seek.
    The bonus is honest, ethical, loyal, consistent and responsible are all values
    that can come with high integrity leaders.

    2.  `Competence`. A candidate’s competence can be established in their demonstrated
    prioritisation, innovation, delivery, ability to get the job done, exceeding expectations
    and evidenced uplift of an organisation. In addition to this, their desire to
    increase their level of competence through on-the-job skills and training must
    be continuous.

