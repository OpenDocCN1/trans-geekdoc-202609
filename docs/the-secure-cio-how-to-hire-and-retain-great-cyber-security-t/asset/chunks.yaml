- fmt: "\nSome other potential changes that could occur between the agenda being finalised\
    \ and the new staff member’s arrival that you might want to brief them on might\
    \ include:\n\n* cost cutting\n* restructures\n* outsourcing\n* shifts from on-premise\
    \ to cloud\n* security-related incidents, their impact, resolution, and lessons\
    \ learnt\n* new threats based on security events within the industry\n* new audit\
    \ findings\n* new operating models\n\nAs `CIO`, you don’t need to conduct all\
    \ these update briefings. It may be that as the new leader meets people across\
    \ the organisation, those people can fill in the blanks and provide updates. The\
    \ key is to consider this information, as it’s an important change from the content\
    \ they read in the agenda. Similarly, if you have some audit remediation already\
    \ underway, have someone brief the new leader on how it is occurring, who the\
    \ responsible parties are, and what role the new leader may play in collaborating\
    \ with the auditors on security-focused items.\n\n#### Key takeaway\nIn addition\
    \ to the agenda briefing, an update on changes in the organisation and anything\
    \ that affects the big rocks significantly is important. Assumptions that the\
    \ agenda reflects the current state of the organisation can be dangerous if some\
    \ time has passed, and getting the security leader off on the right foot with\
    \ key stakeholders is a priority.\n\n### 18\n#### What is coaching?\n(It’s not\
    \ about screaming from the sidelines)\n\n‘Coaching is unlocking people’s potential\
    \ to maximise their own performance.’\nJohn Whitmore, executive coaching pioneer\n\
    \nPart of transitioning your new employee to the organisation may involve the\
    \ use of a coach. This investment is helpful on a number of fronts, especially\
    \ considering the details we covered in the previous chapter. Coaching can assist\
    \ in thinking about innovative ways to deliver more secure outcomes to an organisation\
    \ that might not, until now, have had anyone address `cyber risk`.\n\nHaving been\
    \ a mentor, and having talked a great deal to peers, direct reports, executives,\
    \ and people in general, I thought I knew what coaching was before I earned my\
    \ coaching accreditation – how it was valuable and why people might seek it out.\
    \ But you know what they say about assumptions. It turned out that some of my\
    \ preconceived ideas were wrong. In reality, coaching is a lot about the coach\
    \ formulating great questions, then piping down, listening, and creating enough\
    \ trust and tension to steer their client into useful outcomes. \n\nThe `International\
    \ Coaching Federation` defines it as ‘an ongoing professional relationship that\
    \ helps people produce extraordinary results in their lives, careers, businesses\
    \ or organisations. Through the process of coaching, clients deepen their learning,\
    \ improve their performance, and enhance their quality of life.’[20](#rrs8996r.html#f3k28cv1jc4)\n\
    \nSo why am I telling you this, and why would your new hire need a coach? Because\
    \ even if they’re killing it, there is always room for improvement. (We will talk\
    \ about ‘addressing the stretch’ in chapter 20, which is a good time to use a\
    \ coach.) You may have dismissed the idea of providing coaching for your staff\
    \ because of cost or because you think it’s your role to coach your direct reports\
    \ through issues, concerns, and complex decisions. However, some of the most successful\
    \ people in the world have coaches who specialise in their field, and many have\
    \ engaged a coach even though they were already successful. Coaching is about\
    \ developing the capabilities of high-potential performers. Coaching works for\
    \ those who are willing to learn, grow, and be accountable for their future. Coaching\
    \ in one’s career or personal life is no different to elite athletes working with\
    \ their coach to improve on already world-class results.\n\nIn the case of hiring\
    \ and retaining `cyber security talent`, coaching helps individuals transition\
    \ into their roles, work through complex problems that might come up, and enhance\
    \ the way they perform.\n\nDepending on the agreed goals and outcomes you have\
    \ set when working through section 5 of this book’s framework, the following types\
    \ of things can be explored during coaching sessions:\n\n* Role-play scenarios:\
    \ practising and experimenting with possible responses to anticipated situations\
    \ to polish skills and build comfort with new behaviours\n* Creating better listening\
    \ and questioning skills to improve delivery against stakeholder expectations\n\
    * Problem solving: stimulating creative problem solving by asking probing questions\n\
    * Brainstorming solutions to real work challenges\n\nCoaching supports new employees,\
    \ increases retention, builds commitment and, unlike mentoring, encourages the\
    \ leader to discover their own solutions and deliver results. Joining an organisation\
    \ as the only security leader can be empowering but also isolating. Providing\
    \ your leader with the opportunity to work through some of the challenges with\
    \ a coach in the early months, and periodically in the future, can be of enormous\
    \ value to the organisation.\n\n#### Key takeaway\nCoaching isn’t mentoring, counselling,\
    \ or directing. Coaching is a valuable resource for the new employee to assist\
    \ their transition, work through options, and address behaviours that might hold\
    \ them back paralyse them.\n\n### 19\n#### What does the candidate need?\n‘Supporting\
    \ another’s success won’t ever dampen yours.’\nAnonymous\n\nBelow are some suggestions\
    \ of things that have worked for me and others in the industry when starting out\
    \ in a new role. As a security leader, all support is welcome and appreciated.\
    \ There are many ways to support the new leader, and while I spoke about these\
    \ in chapter 16 in the short term, of their first 30 days, here are a few longer-term\
    \ needs.\n\n#### They need quality third-party consultants\nDuring my research,\
    \ one of the `CIOs` suggested that if the head of information security role sat\
    \ empty for a long time – fortunately, in his case, it didn’t – he would bring\
    \ in a consultant to tide over the organisation while it found the leader it wanted.\
    \ This is what he had done in 2015, even though the organisation had found someone\
    \ to take the role advertised. The role was empty for six weeks, and yet, as soon\
    \ as the incumbent had resigned, a consultant was brought in to manage the potential\
    \ gap. At the time of writing (2017), that consultant is still there, despite\
    \ the team now comprising five strong security specialists.\n"
