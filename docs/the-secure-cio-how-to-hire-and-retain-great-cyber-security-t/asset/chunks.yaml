- fmt: "\n*   Where do you see security fitting into the overall business strategy?\
    \ (This is somewhat of a trick question. You hope security will be described not\
    \ as a strategic pillar but as a foundation stone of the way the business operates\
    \ – like culture and values. (As a side note, I have seen organisations who were\
    \ not mature enough to ‘lay’ the foundation stone, and needed the strategic objective\
    \ first before security became a way of doing business).\n*   What do you see\
    \ as the organisation’s biggest/No. 1 risk? It can be whatever you believe is\
    \ the biggest risk, not necessarily a security-related one.\n*   How do you think\
    \ the business will react to a more secure overlay in projects and in direction?\n\
    *   What security practices are specific to your department (if any), and are\
    \ they effective? (Some won’t know the answer to this question, which demonstrates\
    \ the need to communicate and implement the policies that are likely gathering\
    \ dust somewhere.)\n*   Who has ultimate responsibility for security? (This will\
    \ tell you how security would be seen should a major breach or other security\
    \ incident occur).\n*   Who should we be educating first, customers or employees?\n\
    *   Do you see security as a market differentiator?\n*   Who should a new security\
    \ leader report to? (While the CIO is often the natural choice, sometimes it’s\
    \ the CFO, the CEO, the chief risk officer, the chief technology officer, or perhaps\
    \ not even a c-level executive).\n*   What traits or attributes would you expect\
    \ the leader to have? (This will tell you about the environment this new leader\
    \ is stepping into. An influencer, an inspirer, a risk-taker, someone who is autonomous,\
    \ resourceful, technically aware, or technically skilled – different types of\
    \ skills and experience that might help a leader succeed.)\n*   How is change\
    \ managed in the organisation?\n*   Who else would you recommend I speak to and\
    \ raise these questions with? (The conversation may lead to names of people you\
    \ hadn’t considered).\n\nSend any new questions or concerns that don’t appear\
    \ here that you would like to discuss to me at [info@27lanterns.com](mailto:info@27lanterns.com).\
    \ This also helps us to help others with fresh, new examples to consider.\n\n\
    One thing that has become clear to me in conducting these interviews is that common\
    \ threads appear. In one organisation, of the 20 leaders and stakeholders I interviewed,\
    \ 15 said that security in their organisation was too reactive, and that they\
    \ felt they needed to be more proactive in order to see change. It became clear\
    \ that they wanted more visibility of security, and to prevent incidents rather\
    \ than respond to them. Another business I worked with were aligned on the premise\
    \ that the CEO had ultimate responsibility for security, but that he wouldn’ be\
    \ aware of this; neither would he know what this responsibility required of him.\n\
    \nThis feedback can be presented to the board, the executive, the audit committee\
    \ – anyone who will listen. The answers to these questions are also gold for the\
    \ incoming leader. Knowing how security is seen within the organisation, and how\
    \ the leaders see security can be leveraged, is important. In a recent delivery\
    \ of the framework, I read my interview records aloud to an incoming head of cyber\
    \ security to help frame the organisation for them. I kept the conversation light\
    \ and elaborated on my shorthand so that she could gain the most value from having\
    \ the opinions broken down. The insight she took was overwhelming. She could relate\
    \ to many of the stakeholders when meeting them face to face, having understood\
    \ some of their concerns and ideas for spreading security awareness.\n\n### Key\
    \ takeaway\n\nIn life, what others think isn’t always important. But in security,\
    \ knowing who will be backing you from day one, and who will be a challenge to\
    \ win over, can make or break the security program – and the leader and their\
    \ tenure. Sometimes, the most important insights come from the most unlikely places.\
    \ Hearing what stakeholders say about security and risk may unearth some valuable\
    \ actions to hitch to your agenda – and those responsible for implementing it.\
    \ Target as many relevant people as time permits to ensure you have a good cross\
    \ section of the organisation.\n\n### 5 Aligning to business strategy\n\n‘Thinking\
    \ of cyber security solely as an IT issue is like believing that a company’s entire\
    \ workforce, from the CEO down, is an HR issue.’\n\nSteven Chabinsky, global chair,\
    \ Data, Privacy & Cybersecurity, White & Case\n\nIf you have read chapter 2, you\
    \ will know that the agenda is not meant to be a strategy in itself. The agenda\
    \ is a starting point. Aligning your agenda to the overall business strategy is\
    \ important. By this I don’t mean including security in the strategy (see chapter\
    \ 2 for a little more on this). And when I say important I mean imperative. The\
    \ incoming leader should be able to directly tie security activities highlighted\
    \ in the agenda to the organisation’s strategy, goals, mission, and objectives.\
    \ Essentially, security has no choice but to move forward based on the commercial\
    \ drivers of the organisation.\n\nDocumenting and delivering a cyber security\
    \ agenda that is aligned to the business strategy will give the incoming leader\
    \ a starting point and a foundation on which to build a detailed information security\
    \ strategy.\n\nWhen it comes to strategic alignment of the agenda, there are few\
    \ things to consider:\n\n1. First, what sort of business are you in? A start-up?\
    \ A long-established iconic brand? What industry are you in and how much change\
    \ is your organisation going through? (This list is by no means exhaustive.) The\
    \ answers will help you to understand your risk.\n2. What is the business’s ultimate\
    \ goal in its one-year plan? This might be a 50% growth in customers/members,\
    \ making more profit than your competitors, being number one in the industry,\
    \ being an employer of choice… The list goes on.\n3. Think about how security\
    \ will add value to the business strategy. What does the organisation care most\
    \ about?\n    1. If it’s maintaining the trust of your clients, protecting their\
    \ data is key.\n    2. If it’s being the leading edge in research and development,\
    \ protection of intellectual property and confidentiality will be a focus.\n \
    \   3. If you are a content provider, you must prioritize integrity and availability\
    \ of data and services.\n\nWith this in mind, take what the business cares most\
    \ about and convert that into focal points for the security agenda. If the overall\
    \ business strategy is to move from a traditionally analog organisation to a digital\
    \ one, you may have developers committing code to public websites or apps. If\
    \ so, and they are not coding within secure code guidelines, one of your big rocks\
    \ might be to examine application security. This may also feed the type of leader\
    \ you select or the type of team they build.\n\nIf you are a start-up and experiencing\
    \ exponential growth, your overall strategic plan may include continuing this\
    \ trajectory. However, you might be using some tools and systems that were right-fit\
    \ to store data when you were ‘young’. As you grow, however, this becomes unsustainable.\
    \ If this data is sensitive or contains private information, a key priority for\
    \ your new leader will be to advise on security practices to protect that information,\
    \ both on behalf of the customer and also in line with privacy laws. In this case,\
    \ one of the big rocks becomes data security/protection.\n\nAs a bonus, getting\
    \ this alignment right will inform your communications plan, because your security\
    \ messaging isn’t only about having a secure password and not clicking on links.\
    \ It’s about security’s role in taking the business forward.\n\n### Key takeaway\n\
    \nThe agenda is not a strategy. It’s a starting point in considering how security\
    \ can add value to what your business is focused on achieving in the next 12 months,\
    \ outside of business as usual, of course.\n\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\n"
