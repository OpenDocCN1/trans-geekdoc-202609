    The only time this changes is if a major breach has occurred and securing the
    organisation is the immediate strategy for the foreseeable future.


    If you have read chapter 2, you will know that the agenda is not meant to be a
    strategy in itself. The agenda is a starting point. Aligning your agenda to the
    overall business strategy is important. By this I don’t mean including security
    in the strategy (see chapter 2 for a little more on this). And when I say important
    I mean imperative. The incoming leader should be able to directly tie security
    activities highlighted in the agenda to the organisation’s strategy, goals, mission,
    and objectives. Essentially, security has no choice but to move forward based
    on the commercial drivers of the organisation.


    # Section 2


    ## Compass: What’s your destination?


    > ‘The secret of change is to focus all of your energy, not on fighting the old
    but on building the new.’

    > — Socrates


    ### Part 2 of the framework is `Compass`

    `Part 2` of the framework is `Compass`, which is about understanding where you
    are going, based on your agenda. Also, what skills does your organisation need,
    based on the overall business strategy?


    When we plan, we often overestimate what we can achieve and underestimate the
    resources needed to achieve it. This is true for most aspects of work and life,
    and is certainly true for security.


    Whether you hire a sole security professional or team will dictate the workload
    and variety of tasks the individual(s) can take on and the level of involvement
    they need to have in certain activities. As this book is focused on hiring leaders,
    my advice would be to focus your efforts on fundamental, measurable areas for
    security improvement that are aligned with your organisation’s priorities and
    key risks. This will ensure your initiatives relate to what’s really important,
    and make security part of the achievement of your organisation’s overall strategy.
    Be honest about the change your organisation is capable of achieving, and what
    it will take to achieve it, and you’re much more likely to hire a security leader
    who can execute a strong, visible program in the coming year.


    ## Where to?


    > ‘A goal properly set is halfway reached.’

    > — Zig Ziglar, author


    The next two or three chapters work hand in hand. What you are looking to achieve
    by hiring a cyber or information security professional is closely linked with
    what skills and attributes you feel are non-negotiable in a successful candidate,
    and therefore what comprises a realistic job description.


    Thinking about what you want to achieve is important when it comes to ‘selling’
    the job to a potential candidate. Being honest about their role, why they will
    be in the organisation, how they will be supported, and the perception of the
    security function are essential in choosing the right candidate.


    I have worked in many organisations, some with extensive security funding, some
    without. Some where the role of the security leader was a carefully considered
    addition to a team and others where the security leader occupied the only security
    role.


    Often, when a position is newly created, it has come about because of a large-scale
    breach/incident – not always debilitating, but big enough to rattle the organisation
    into action – an audit committee finding, a direction from a nervous board, or
    the instinct of a `CEO`/`CIO`/CTO` that a security leader is needed. If it is
    a replacement of an existing leader, there will usually be a discussion about
    re-justifying the role’s existence and whether there is a way for existing staff
    to absorb the role. Ideally, absorbing the role will not be possible, as the leader
    plays a significantly different role to a technical engineer, analyst, or adviser.


    Through the review of countless job ads and job descriptions, and via conversations
    at security events, it’s become apparent to me that four major outcomes are sought
    from hiring a security leader. They are not all pretty.


    ### To satisfy an audit finding

    If you are hiring a head of cyber or information security only because an audit
    report advised you to, they will never be able to achieve anything more than the
    perception of good security. They could become a figurehead who makes it look
    like the business is protecting itself and the customer, when it is not.


    Creating the agenda and finding out how the rest of the executive team and stakeholders
    feel about security goes a long way to starting a broader conversation about security
    and gaining better traction for the new leader. By all means, use the audit committee
    direction as leverage, but it can’t be the only rationale. As `CIO`, you need
    to buy into the benefits of what this leader can achieve, and why a dedicated
    expert should be armed with the resources (time and people) to provide more than
    audit remediation. I’m aware that audit remediation goes a long way to securing
    an organisation. But if the leader spends all their time looking back, they will
    never have the capacity to plan, to future-proof the organisation, and look forward.


    ### Fulfilling security needs with one person

    If you are hiring a security leader to address all the security concerns in the
    organisation, they will also be doomed to fail (or depart). This is yet another
    reason to consider the big rocks: What is the priority and where do you want to
    focus first? This new leader is likely to need a team at some stage, or at least
    a community of practice, where those who do not report to the head of information
    security but have a security-related function can come together to ensure they
    share the same objective.


    ### Compliance

    A number of regulations and laws require that particular organisations have a
    dedicated information or cyber security head, someone identified as the officer
    responsible for security. Hiring for compliance usually takes the form of nominating
    an internal staff member. This person won’t necessarily have the skills, knowledge,
    or care factor to address risk or incidents, but their name will appear on documentation,
    and any audit against compliance will be met.


    ### Certainty and confidence

    Overwhelmingly, the most common response can be summarized similar to this one,
    from a `CIO` in Australia when asked why they would hire a security leader: ‘It
    means there is a dedicated, subject-knowledgeable person whose sole role is to
    mitigate the organisation’s security risks’.


    During my research on the objective of hiring a security leader, some `CIOs` gave
    the responses below. Can you relate to any of these?


    * Having a security leader provides organisational focus and prioritisation of
    security.

    * It ensures we have someone who is defining a clear strategy and directing traffic
    when it comes to our overall approach to managing and executing our cyber security
    activities.

    * Without a leader, the danger is that we don’t take an holistic approach, and
    our investment is over- or under-balanced due to individual department priorities
    or preferences.

    * We need a competent champion whose sole focus is ensuring that cyber security
    is taken seriously and that we are investing appropriately in the areas that matter
    most.

    * The executive team looks to the cyber security leader to define the information
    security program and its subsequent management, and provide education and guidance
    to all.

    * As `CIO`, cyber security is one of my two greatest concerns. (The other is talent).
    Without a cyber person, the front door doesn’t feel locked, and the business is
    more reactive to security issues.

    * We need this person for compliance, someone with deep security knowledge whose
    whose daily task is to focus on cyber security – to prevent attacks, respond to
    incidents, speak to audit and risk, and give the board confidence that cyber is
    being handled.

