    \ I have read many excellent CVs and met some brilliant candidates. I’ve also\
    \ met some arrogant applicants, some understated leaders, and some unfortunate\
    \ professionals who are not sure where they are going, or why.\n\nThrough a delivery\
    \ of the framework, I recently met a fantastic candidate – let’s call her Jill\
    \ – whom I later placed and have also coached. I first spotted Jill on an advanced\
    \ LinkedIn search for talent, way before she was on the radar as an applicant.\
    \ I reviewed the job description with the hiring manager, readvertised, and the\
    \ applicants flowed in – more than a hundred. But Jill didn’t apply. I looked\
    \ at her profile again, after little joy with the hundred applicants, but before\
    \ I got a chance to approach her, she applied. Her background was strong and she\
    \ had led security teams in some of Australia’s biggest brands.\n\nWhen I met\
    \ her, I was charmed by her passion, enthusiasm, and down-to-earth approach to\
    \ security. The talent manager and I recommended Jill for a second interview.\
