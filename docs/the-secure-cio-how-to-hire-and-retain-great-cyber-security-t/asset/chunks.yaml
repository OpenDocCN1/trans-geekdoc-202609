    *   你的新领导无法兼顾所有人的需求。从安全领域的招聘广告中可以看出，大多数安全专业人员被要求成为“全能手”。合规人员也需要精通安全。或者，反欺诈部门的人必须兼任信息安全负责人的职责。又或者，信息安全负责人必须同时分析安全事件日志。企业往往会错误地试图让一个人来解决所有的安全问题。指出一个人无法胜任许多人的角色似乎是常识，但从今天所招聘的许多职位来看，这似乎是人们的预期目标。


    *   在至少的前六个月内，他们不需要安全供应商的介绍。销售人员非常擅长自己的工作，但大概率是，安全负责人对网络和业务运营的了解并不深入，不足以为讨论增加价值。此外，大多数安全负责人更倾向于在需要时（根据他们所提供的策略）主动联系供应商。


    *   他们不需要对本应由业务部门管理的活动或结果负责。我在上面提到了审计，但还有一些任务是企业有时错误地希望由网络安全部门负责的，例如第三方供应商参与。安全团队负责提供一份需求清单，第三方在逻辑或物理上连接到你的网络时必须满足这些需求。安全部门不需要拥有风险，也不需要对是否与供应商合作做出最终决定。法律、IT、合规和财务部门都可以在签署或就特定供应商风险提供建议方面发挥作用。如果业务部门采纳了所有建议并愿意承担风险，安全团队或许可以接受。在指派网络/信息安全人员负责风险削减流程之前，请考虑风险削减流程的真正所有者。


    这个列表与书中的其他列表一样，绝不是详尽的。


    ## 核心启示


    新的安全领导需要的不仅仅是来自提供的日常支持。他们需要确信自己的目标是清晰的，已经获得了预算和规划，并且他们的投入将获得重视。


    ***


    21 Barbara Filkins，“IT 安全支出趋势”，调查，SANS Institute, 2016 年 2 月，[`www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697`](https://www.sans.org/reading-room/whitepapers/analyst/security-spending-trends-36697)。


    22 同上。


    23 2016 年网络安全调查, 澳大利亚网络安全中心, 澳大利亚政府, 2017 年，[`www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf`](https://www.acsc.gov.au/publications/ACSC_Cyber_Security_Survey_2016.pdf)。


    24 同上。


    我不会在预算和工具上过多纠缠，主要因为我关注的是安全领域的人员，然而，我会说：2016 年，SANS21 对安全预算进行了研究，大部分支出位于 IT 支出范围内。敏感信息保护和监管合规是安全支出背后的两个最重要的业务驱动力。引入安全负责人并不是你支出的开始、中间和终点。要取得大成就，你的新领导可能还需要自动化工具、第三方评估、检测和监控工具、测试、合规相关系统以及云安全应用的资金（例如分布式拒绝攻击（`DDOS`）和托管）。员工培训、认证以及通过会议和课程跟上潮流也需要资金。如果你计划将安全作为业务的优先考虑之事项，你必须在预算中体现这一点——不能只是“拆东墙补西墙”，而是要真正分配安全支出。获得所需的预算不仅需要衡量过去投资的成功与（过去在安全方面的投入可能很少，或者被双用途（安全和
    IT 结合）的硬件和服务所掩盖），它还围绕着确保合规、实现业务目标，并提供事件数量减少和风险概况改进的证明。


