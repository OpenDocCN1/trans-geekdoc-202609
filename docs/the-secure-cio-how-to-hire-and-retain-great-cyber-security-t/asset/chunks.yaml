    The first is job satisfaction. Second is the ‘company environment’ and the degree
    of comfort an individual employee feels within it.


    The article stated, ‘An employee’s inertia is strengthened or weakened by the
    degree of compatibility between his own work ethic and the values for which the
    company stands. The employee’s ethic derives from his own values and the actual
    conditions he encounters on the job. The company’s values derive from societal
    norms, formal decisions by the board of directors, and the policies and procedures
    of the managing group. A widening gap between these two vantages weakens inertia;
    a narrowing gap strengthens it.’


    The third factor is an employee’s perceived job opportunities in other institutions
    and self-imposed restrictions and personal criteria (such as location). Finally,
    there are non-work factors such as financial responsibilities, family ties, friendships,
    and community relations. Many employees in the study reported low job satisfaction,
    and yet they stayed.


    A few years ago I took on a role that provided me with many of the ‘personal criteria’
    I needed. Having just stepped off the plane from three and a half years in Asia,
    I took a job that gave me much-needed Australian experience. It was a new industry
    to me, it was a ‘head of’ position and, most importantly, it gave me flexibility.
    With two small children and a sick family member, I had returned from Asia to
    be with them and this job fitted the criteria.


    What I didn’t realise was that I was joining an organisation that didn’t align
    with my values. And while Harvard might have done this study 45 years ago, all
    four of these factors came into play when I figured out, only six weeks into the
    job, that I couldn’t work for this organisation.


    On reflection, I don’t know that I could have perceived this earlier. I was so
    focused on meeting my family commitments that the organisational match wasn’t
    at the front of my mind enough. I flagged my concerns to a trusted leader, who
    was not my boss and did a good job of talking me down off the ledge. He was passionate
    about the organisation and about keeping me in the role, which was flattering
    and persuasive. I have a lot to thank him for, as he spurred me to look at how
    I could add value to the organisation, uphold my commitment to the role, and exit
    with some level of personal integrity, despite the values clash. I took his words
    with a grateful heart and ploughed on. But within weeks, the shot in the arm he
    had given me had worn off and I realised, once again, that my heart wasn’t in
    it.


    When it comes to retention, there is only so much an organisation can do to keep
    staff in a role once their inertia has shifted. What is important is making sure
    you address their needs, discuss the alignment of their values and the support
    they need to get the job done before they sign the employment contract. Make sure
    they can pass the barbecue test: If they were at a barbecue and someone asked
    where they worked, would they be proud to say? Make sure the prospective employee
    realizes what they are getting themselves into from a work perspective. (Lucky
    you have that agenda from chapter 2 handy.) Finally, make sure that the environment
    in which they will work supports this leader. I’m not asking for special treatment,
    just due diligence. The security job market is competitive and you want to create
    the right conditions for your new head of information security or cyber security
    leader to commit and prosper.


    In saying all of this, you must also consider what do you need to support them
    to ensure you can have a long future together in protecting the organisation?
    You need peer endorsement of the agenda, a budget for the security program, and
    the support of some of your other direct reports and peers for this recruit. Finally,
    to obtain the certainty you seek from your security leader, you need to have resilience,
    to trust in the process, and be ready to commit.


    Section 4 of the framework is about committing to the new employee – being comfortable
    in your selection but also understanding their level of commitment to protecting
    the organisation and staying with it for the right reasons, not due to inertia.


    ***


    [17] Vincent S. Flowers & Charles L. Hughes, ‘Why Employees Stay’, Harvard Business
    Review, July 1973 issue, [https://hbr.org/1973/07/why-employees-stay](https://hbr.org/1973/07/why-employees-stay).


    In 1973, the Harvard Business Review ran a story about staff retention: ‘Why employees
    stay’.17 Almost 45 years later, it still rings true. The premise is that employees
    stay in organisations because of inertia. Until something better comes along,
    they will stay in their role. But the push to stop the inertia is affected by
    four factors.


    17 Vincent S. Flowers & Charles L. Hughes, ‘Why Employees Stay’, Harvard Business
    Review, July 1973 issue,


    ### Section 14: The tour of duty


    ‘Plan your work for today and every day, then work your plan.’


    Margaret Thatcher, former UK Prime Minister


    We all know of people who take on a new role with a plan a mind. They know from
    day one what their 30-, 60-, and 90-day goals are. Or ‘the first 100 days’. There
    are also planners who consider a limited tenure. I’m generalising, as everyone
    is slightly different. But, in essence, people either know what they want and
    how long they plan to allow to achieve it or they go into roles with blind faith
    that the journey will take them where it takes them.


    For those with a plan of big goals and limited tenure, this is often their own
    boundary to set, but it can work well for the candidate and the organisation.
    I have a couple of examples.


    #### Example 1


    A friend assumed a role as a consultant leading a team as an interim executive.
    The business loved her, and before long, they were asking her to stay. She politely
    declined, every other day for a month, until she went to the chief executive and
    suggested she would stay, but on the following terms: She would remain a consultant,
    but only for two years, and in that time she planned to execute `X`, `Y`, and
    `Z`. With this proposal, the organisation was able to move ahead with consistent
    leadership, it could plan for the leadership change two years on, and it knew
    what it would get by agreeing to the deal. It’s was a win for both sides.


    #### Example 2


    Some people look for a particular skill set to complement their experience. Early
    in my career I had a peer who hadn’t worked for any smaller companies. He stepped
    out of a senior role in a global organisation and spent two years to the day leading
    a much smaller team in a more agile environment – ‘agile’ in the traditional sense.
    By his resignation date, he had made himself redundant and moved to a more senior
    role in a mid-tier organisation – his plan all along. The organisation was aware
    that he was seeking some specific experience for his CV. They knew he would not
    stay forever, and because of that, they worked him hard, made sure he trained
    others, and imparted his 20 years of business knowledge through mentoring and
    program leadership. The business respected his honesty, and instead of watching
    the days slip by, awaiting his inevitable resignation, they embraced the time
    they had with him.

