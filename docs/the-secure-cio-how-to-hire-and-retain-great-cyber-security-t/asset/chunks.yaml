    \ chapter, surrounding yourself with supporters is important. In Jill’s case,\
    \ when the co-interviewer told the hiring manager he wasn’t one hundred per cent\
    \ convinced of her ability to fill the role, progress stopped while they considered\
    \ the next move. This was partly due to her self-professed nervousness in approaching\
    \ boards and senior leaders. Jill was strong in other areas and certainly a passionate\
    \ security leader. She met the other non-negotiables, and while she didn’t have\
    \ the gravitas some other leaders had exhibited, she was a good cultural fit for\
    \ the organisation.\n\nWhile they pondered Jill’s ability, we presented some other\
    \ candidates. The field was slim, and given the non-negotiables, even slimmer.\
    \ I felt Jill could do the job and so I told the hiring manager my story about\
    \ taking a chance on people. I told him I had moved to Asia and was speaking to\
    \ regional boards, having never spoken to a board member before. I had made mistakes,\
    \ but I had good people around me, I made sure I was prepared so as to support\
    \ my CIO, and I could improve each time.\n\nI also explained that because this\
    \ was a new role, any new leader would need guidance in navigating the board and\
    \ the broader business, about what was expected, and how best to impart information\
    \ to that audience.\n\nThis was (and is) a tough role for any new leader to step\
    \ into. I’m pleased to say the hiring manager chose Jill, and she is still the\
    \ head of information security (at the time of writing). I’ve been coaching her\
    \ through some of her content, strategy, and presentation skills. And because\
    \ she is aware of the gap in her skills, Jill is working hard to improve these\
    \ as soon as she can. The way I see it, securing the organisation is her priority,\
    \ and if the information reaches the appropriate eyes and ears so that timely\
    \ decisions can be made, then she’s fulfilling her role. For now, any improvement\
    \ in her delivery is a bonus."
