    The CIOs were asked to go out and find a senior cyber security leader, and the
    IT security manager/policy manager confidently submitted an expression of interest
    in the role. This person was qualified in many aspects of the job, but IT security
    (or cyber or information security) has changed over the past few years. And it
    continues to change. Security managers are often good writers, negotiators, technically
    sound, and well connected. However, they may also underestimate the jump from
    managing a structured, relatively black-and-white operation to what can be a roller-coaster
    ride as a head of cyber security or CISO.


    Promoting from within can work, and I’ve written a few blogs about the benefits
    of internal staff complementing the security function with other skills. However,
    not all security experience is equal, and, in both cases, bringing in a fresh
    set of eyes with experience from other corners of the industry successfully addressed
    the cyber risk. (We will talk about measuring the impact of a new employee later.)


    Both of these managers had great experience and provided value to the organisation
    through their loyalty, tenure, and vast knowledge of security. Supporting them
    in their current roles by the appointment of a leader to guide them into a new
    era of security was a good outcome for all involved. Promoting these managers
    would have been an easy way to address the audit findings, but was not in the
    best interest of the business.


    ## Key takeaway


    Be clear on what the candidate can achieve in the role, both in their aspirations
    and their abilities. It might seem too good to be true to have a motivated, enthusiastic
    candidate raring to go in the new role. But be mindful of whether you can harness
    that enthusiasm, and the impact this might have on the outcomes that need to be
    achieved.


    ***


    19 Chris Gerritz, ‘Breach Detection by the Numbers: Days, Weeks or Years?’, Infocyte,
    27 July 2016, [https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you](https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you).
    See also Herb Weisbaum, ‘Data Breaches Happening at Record Pace, Report Finds’,
    NBC Business News, 24 July 2017, [https://www.nbcnews.com/business/consumer/data-breaches-happening-record-pace-report-finds-n785881](https://www.nbcnews.com/business/consumer/data-breaches-happening-record-pace-report-finds-n785881).


    19 Chris Gerritz, ‘Breach Detection by the Numbers: Days, Weeks or Years?’, Infocyte,
    27 July 2016, [https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you](https://www.infocyte.com/blog/2016/7/26/how-many-days-does-it-take-to-discover-a-breach-the-answer-may-shock-you).
    See also Herb Weisbaum, ‘Data Breaches Happening at Record Pace, Report Finds’,
